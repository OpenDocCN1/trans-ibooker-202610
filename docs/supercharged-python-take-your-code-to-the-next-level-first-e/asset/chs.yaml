  \ final example in this chapter use “indirect” importing? If so, how, exactly?\n\
  \n## CHAPTER 15 SUGGESTED PROBLEMS\n\n1 A desirable feature of our stock demo program\
  \ would be to enable the user to specify the period of the moving-average line.\
  \ That period has been set to 180 working days (equivalent to six months), but the\
  \ program should provide adjustment of this time period as one option. You can,\
  \ if you want, start out with a default of 180 days. But the user should be able\
  \ to adjust this.\n\n2 It would also be desirable to retain the stock-market selection\
  \ until it is changed. If the user enters a blank string at the beginning, that\
  \ should indicate a desire to exit the program. But subsequently, entering a blank\
  \ line in response to the stock-market ticker prompt should cause the program to\
  \ continue using the stock already selected.\n\n3 Yet another desirable feature\
  \ would be to enable the user to enter any number of stock-market ticker symbols\
  \ (assuming they are all valid) and then graph all the stocks referred to. (Hint:\
  \ To implement this feature, you might create a list of such symbols and pass it\
  \ to one or more `for` loops that would get a data frame for each stock and then\
  \ pass all that data to a function that plotted each and every stock, before showing\
  \ the entire graph.)\n\n## A. Python Operator Precedence Table\n\nOperators in Python\
  \ expression are evaluated in the order shown in Table A.1 for Python 3.0.\n\n###\
  \ Table A.1. Python Operators by Precedence\n\n| Operator | Description |\n|---|---|\n\
  | _func_(_args_) | Function call |\n| _collection_[_begin : end : step_] | Slicing\
  \ |\n| _collection_[_index_] | Indexing |\n| _object_.attribute | Property or member\
  \ access |\n| _num_ ** _num_ | Exponentiation |\n| ~_int_ | Bitwise NOT |\n| +num,\
  \ -num | Plus/minus sign |\n| *, /, %, // | Multiplication, division, remainder\
  \ division, integer division (when operation is between two numbers); also multiplication\
  \ of lists and strings: list * n |\n| +, - | Addition and subtraction (when operation\
  \ is between two numbers); also str + str produces string (or list) concatenation\
  \ |\n| int << n, int >> n | Left and right bit shifts |\n| int & int | Bitwise AND\
  \ |\n| int ^ int | Bitwise XOR |\n| int \\| int | Bitwise OR |\n| in, not in, is,\
  \ is not, <, <=, >, >=, !=, == | Comparisons; each produces Boolean value (true/false)\
  \ |\n| not vala | Boolean NOT |\n| val and vala | Boolean AND |\n| val or vala |\
  \ Boolean OR |\n\na. The _val_ may be almost any kind of value; Python will apply\
  \ the operation `bool()` to convert before applying to conditionals— within, say,\
  \ `if` or `while`. See notes that follow.\n\n**Other notes:**\n\n1. Where operators\
  \ are at the same level of precedence, they are evaluated left to right.\n\n2. Parentheses\
  \ override precedence rules.\n\n3. The special symbol = (not to be confused with\
  \ ==, which is test for equality) is part of assignment-statement syntax and is\
  \ not an operator.\n\n4. With combined assignment-operator symbols (+=, *=, /=,\
  \ etc.), the entire expression on the right is evaluated and then the assignment\
  \ is carried out, regardless of precedence. For example, if x starts out as 12,\
  \ then the statement x /= 3 + 9 sets x to 1, but the statement x = x / 3 + 9 sets\
  \ x to 13.\n\n5. Assignment-operator symbols include +=, -=, *=, /=, //=, **=, <<=,\
  \ >>=, &=, ^=, |=. In each case, x op= y is equivalent to x = x op y; but note 4\
  \ applies.\n\n6. As mentioned in Chapter 4, the Boolean operators apply short-circuit\
  \ logic. If the first operand is true, the operator `and` returns the second operand.\
  \ If the first operand is false, the operator `or` returns the second operand. Otherwise,\
  \ the first operand is returned without evaluating the second operand.\n\n7. To\
  \ determine whether a value behaves as true or false, Python applies a Boolean conversion,\
  \ **bool()**. For numeric values, zero is “false.” For collections, an empty string\
  \ or collection is “false.” For most types, **None** is “false.” In all other cases,\
  \ the value behaves as if “true.” (Comparisons, such as n > 1, always return **True**\
  \ or **False**, which are fixed values.)\n\nBy combining the last two rules, you\
  \ should be able to see why Python responds as follows:\n\n```\n>>>print(None and\
  \ 100)\nNone\n>>>print(None or 100)\n100\n>>>print(not(''))\nTrue\n```\n\n8. &,\
  \ -, ^, and | have specialized uses with set objects, as intersection, difference,\
  \ symmetric difference, and union, respectively.\n\n## B. Built-In Python Functions\n\
  \nIn this appendix, square brackets in the syntax displays are not intended literally\
  \ but indicate optional items.\n\nThe argument type *iterable* appears many times\
  \ in this appendix. An *iterable* may be a collection, such as a string, list, or\
  \ tuple, or any object whose class implements an `__iter__` method. Generators and\
  \ ranges are also iterables.\n\nSome of the functions (such as `min` and `max`)\
  \ require a sequence or group of arguments to be *sortable*. To be sortable, a less-than\
  \ operator (`<`) must be successfully applied to every combination of objects in\
  \ the sequence.\n\n### Table B.1. Most Commonly Used Built-In Functions\n\n| To\
  \ do the following task: | Call these function(s): |\n|---|---|\n| Convert between\
  \ ASCII and character format | `ch`, `ord` |\n| Convert to `binary`, `oct`, `hex`\
  \ string display | Call function of the same name. |\n| Convert to `bool`, `bytes`,\
  \ `complex`, `float`, `int`, `str`, `set`, or `list` data-object type. | Call function\
  \ of the same name. |\n\n| Description | Function |\n|---|---|\n| Divide, with modular\
  \ division | `divmod` |\n| Format an object to be printed | `format` |\n| Generate\
  \ a sequence of integers | `range` |\n| Get absolute value | `abs` |\n| Get input\
  \ string from end user | `input` |\n| Get length of a collection | `len` |\n| Get\
  \ type of object | `type`, `isinstance` |\n| Get maximum from two or more values\
  \ | `max` |\n| Get minimum from two or more values | `min` |\n| Merge two or more\
  \ sequences | `map`, `zip` |\n| Open a disk file for reading or writing | `open`\
  \ |\n| Print or display a series of values | `print` |\n| Produce a sorted or reversed\
  \ version of a collection | `sorted`, `reversed` |\n| Round a fractional amount\
  \ | **round** |\n| Sum the elements of a collection | **sum** |\n\n## ABS(X)\n\n\
  Returns the absolute value of the numeric argument x. The result is nonnegative;\
  \ so negative arguments are multiplied by −1. In the case of a **complex** argument,\
  \ the function returns the length of the real or imaginary vector as a non-negative,\
  \ real-number result. The function uses the Pythagorean Theorem to find this value.\
  \ For example:\n\n```\n>>> c = 3+4j\n>>> abs(c)\n5.0\n```\n\nIn fact, this combination\
  \ of features—using `abs` on a **complex** number—is a convenient shortcut for invoking\
  \ the Pythagorean Theorem!\n\n## ALL(ITERABLE)\n\nReturns **True** if all the elements\
  \ generated by _iterable_ are “true”—that is, they produce **True** after a **bool**\
  \ conversion is applied. In general, non-zero values and non-empty collections evaluate\
  \ as true. For example:\n\n```\n>>> all([1, 2, 4])\nTrue\n>>> all([1, 2, 0])\nFalse\n\
  ```\n\n## ANY(ITERABLE)\n\nReturns **True** if at least one of the elements in _iterable_\
  \ is “true,” after a **bool** conversion is applied to each item. Remember that\
  \ non-zero values and non-empty collections evaluate as “true.” For example:\n\n\
  ```\n>>> any([0, 2, 0])\nTrue\n>>> any([0, 0, 0])\nFalse\n```\n\n## ASCII(OBJ)\n\
  \nProduces an ASCII-only representation of the object, _obj_, returning it as a\
  \ string. If non-ASCII characters are found in the output string, they are translated\
  \ into escape sequences.\n\n## BIN(N)\n\nBinary-radix conversion. Returns a string\
  \ containing a binary-radix representation of integer _n_, including the `0b` prefix.\
  \ Inputs other than integer will cause Python to raise a **TypeError** exception.\n\
  \nFor example:\n\n\n\n\n\n## BOOL(OBJ)\n\n布尔转换。这是一个重要的转换，因为它会被 `if` 和 `while` 语句以及\
  \ `filter` 函数根据需要隐式调用。\n\n该函数根据 _obj_ 的值返回 `True` 或 `False`。每个类都可以通过实现 `__bool__`\
  \ 方法来决定如何评估此函数；但否则，默认行为是返回 `True`。Python 类倾向于遵循以下一般准则。如果对象包含以下任何内容，则通常转换为 `True`：\n\
  \n- 非零数值。（对于复数，这是 `0+0j` 以外的任何值。）\n- 非空集合，包括非空列表和字符串。\n\n通常转换为 `False` 的对象包括：\n\n\
  - 任何等于零的数值\n- 零长度的集合或序列，或零长度字符串\n- 特殊值 `None`\n\n例如：\n\n```\n>>> class Blah() :\n\
  \ pass\n```\n\n```\n>>> b = Blah()\n>>> b.egg = 0\n>>> bool(b)\nTrue\n>>> bool(b.egg)\n\
  False\n```\n\n在这种情况下，对象 `b` 自动转换为 **True**，因为类未定义 `__bool__` 方法，但 `b.egg` 等于 0，因此为\
  \ **False**。\n\n## BYTES(SOURCE, ENCODING)\n\n字节字符串转换函数。将源（通常是字符串）转换为 `bytes` 字符串，其中每个元素的字节值在\
  \ 0 到 255 之间（包含 0 和 255），并存储在单个字节中。在 Python 3.0 中，Python 字符串通常使用 Unicode 或 UTF-8\
  \ 表示，因此普通字符串每个字符可能占用多个字节。因此，如果需要每个字符占用一个字节，则需要将普通字符串转换为 `bytes` 字符串。\n\n例如：\n\n\
  ```\n>>> bs = bytes('Hi there!', encoding='utf-8')\n>>> bs\nb'Hi there!'\n```\n\n\
  ## CALLABLE(OBJ)\n\n如果对象 _obj_ 可以作为函数调用，则返回 **True**。真值表示以下一项或多项：_obj_ 是函数名、由函数定义创建，或是实现\
  \ `__call__` 的类的实例。\n\n## CHR(N)\n\n返回一个字符的字符串，该字符的 Unicode 值为 _n_。此范围的下半部分包括 ASCII\
  \ 字符。这是 **ord** 函数的逆函数。此函数的定义域为 0x10FFFF。超出该范围的 _n_ 值会引发 **ValueError**。\n\n例如：\n\
  \n```\n>>> chr(97)\n'a'\n```\n\n## COMPILE(CMD_STR, FILENAME, MODE_STR, FLAGS=0,\
  \ DONT_INHERIT=FALSE, OPTIMIZE=-1)\n\n**compile** 函数接受一个包含表达式、语句或代码块（取决于 _mode_）的字符串，并返回一个代码对象，然后可以通过调用\
  \ **eval** 或 **exec** 函数来执行。_mode_str 字符串包含 'exec'、'single' 或 'eval'，分别用于编译模块、单个语句或表达式。\n\
  \n因为它允许执行任意 Python 代码字符串，通过 **exec** 给外部人员访问会造成重大安全漏洞。一般来说，除非有非常充分的理由使用它，否则应避免使用。但下面是一个简单的演示：\n\
  \n```\n>>> command_str = '''\npi = 3.141592\nprint('pi/2 = ', pi/2)\n'''\n>>> cmd\
  \ = compile(command_str, 'my_mod', 'exec')\n>>> exec(cmd)\npi/2 = 1.570796\n```\n\
  \n有关更多信息，请搜索在线帮助。请记住，很少有人应该使用此函数。如果执行任意用户输入的字符串，您将交出程序和系统中一切的控制权。\n\n## COMPLEX(REAL=0,\
  \ IMAG=0)\n\n复数转换。_real_ 和 _imag_ 参数均为可选，且每个参数的默认值均为 0。给定数值输入（与字符串输入相反，字符串输入将在下一条目中解释），函数将执行以下操作：\n\
  \n- 将 _imag_ 参数乘以 1j——即乘以虚数 _i_。\n- 将其加到 _real_ 参数上。\n- 如果需要，通过添加或减去 `0j` 来确保结果是复数。（这通常由前两条规则得出。）\n\
  \n这些简单的规则涵盖了转换的所有内容。例如，默认情况下返回零值复数：\n\n```\n>>> complex()\n0j\n```\n\n您也可以仅为实部提供参数，创建一个包含\
  \ `0j` 的值，以指示其作为复数而非实数的状态。\n\n```\n>>> complex(5.5)\n(5.5+0j)\n```\n\n使用此转换的最常见方法是为每个参数使用实数或整数。\n\
  \n```\n>>> complex(3, -2.1)\n(3-2.1j)\n```\n\n您也可以仅为第一个参数指定复数参数，转换将原样返回该数字。\n\n\
  ```\n>>> complex(10-3.5j)\n(10-3.5j)\n```\n\n此函数的一个特点是，您可以为两个参数都指定复数！前面概述的规则仍然适用。在以下示例中，_imag_\
  \ 参数为 5j。像往常一样，它乘以 1j，结果为 5j * 1j = -5。然后将该值加到 _real_ 参数 1 上，以产生 -4。\n\n```\n>>>\
  \ complex(1, 5j)\n(-4+0j)\n```\n\n## COMPLEX(COMPLEX_STR)\n\n复数转换接受一个形如 ' a+bj '\
  \ 的单个字符串参数——但它不能有内部空格，且不允许第二个参数。可选的括号可以围绕 a+bj。例如：\n\n```\n>>> complex('10.2+5j')\n\
  (10.2+5j)\n>>> complex(' (10.2+5j) ')\n(10.2+5j)\n```\n\n此函数接受有效复数的字符串，即使该数字只有实部或只有虚部。即使没有非零虚部，结果中也始终会存在\
  \ 0j。例如：\n\n```\n>>> complex('2')\n(2+0j)\n>>> complex('3j')\n3j\n```\n\n此函数的另一个特点是，_complex_str\
  \ 是唯一可以使用 `j` 代替 `1j` 的上下文；通常，数字必须与 `j` 结合，以将其与名为 `j` 的任何变量区分开。\n\n```\n>>> complex('1+j')\n\
  (1+1j)\n```\n\n> 注意\n> 有可能生成使用 `-0j` 而不是通常的 `+0j` 的值。例如，`complex(1, -1j)` 生成 `(2-0j)`，尽管\
  \ `complex(2, 0)` 生成 `(2+0j)`。两个结果可以用 `==` 成功比较，但不能用 `is` 比较。这种现象源于浮点表示包括符号位；`0.0`\
  \ 和 `-0.0` 是不同的对象，即使数值相等。\n\n另请参见前一条目中的 `complex`。\n\n## DELATTR(OBJ, NAME_STR)\n\
  \n删除属性函数。从对象 `obj` 中删除一个属性，其中 _name_str 是包含属性名称的字符串。例如：\n\n```\nmy_dog.breed = 'St\
  \ Bernard'\n...\na_str = 'breed'\ndelattr(my_dog, a_str)\n```\n\n执行此语句后，对象 `my_dog`\
  \ 不再具有 'breed' 属性。\n\n如果 `obj` 在删除前不具有指定的属性，则会引发 `AttributeError` 异常。另请参见 `hasattr`\
  \ 和 `setattr` 函数。\n\n## DIR([OBJ])\n\n目录函数。返回可选参数 _obj_ 的属性列表。如果此对象是类，则显示类的所有属性。如果对象不是类，则获取对象的类并显示该类的所有属性。\n\
  \n如果省略此参数，`dir` 返回当前上下文（当前函数或模块）的属性列表。例如：\n\n```\ndir()   # 获取模块的属性\n```\n\n或者，在函数定义内部：\n\
  \n```\ndef demo():\n    i = 1\n    j = 2\n    print(dir())\n```\n\n调用 `demo` 将打印以下内容：\n\
  \n```\n['i', 'j']\n```\n\n看似无害的 `print(dir(i))` 将打印一个相当长的列表，因为 `i` 是整数，而整数类（`int`）有相当长的属性列表。此类调用的输出与以下内容相同：\n\
  \n```\nprint(dir(int))\n```\n\n## DIVMOD(A, B)\n\n将 _a_ 除以 _b_，然后返回一个元组，包含 a/b（向下舍入到最接近的整数）以及结果\
  \ a % b（余数）。此函数通常与整数一起使用。例如：\n\n```\nquot, rem = divmod(203, 10) # 结果是 20，\n余数 3\n\
  ```\n\n参数 _a_ 和 _b_ 中的一个或两个可以是 **float** 值；但在这种情况下，两个返回值都将是浮点格式。商将没有小数部分，但余数可能有。例如：\n\
  \n```\n>>> divmod(10.6, 0.5)\n(21.0, 0.09999999999999964)\n```\n\n在这种情况下，结果元组应为\
  \ `(21.0, 0.1)`，但存在一个小的舍入误差，这在浮点值中可能发生。您可以使用 **round** 函数来帮助纠正它。\n\n## ENUMERATE(ITERABLE,\
  \ START=0)\n\n枚举。接受一个 _iterable_ 作为输入并返回一个\n\n\n\n\nsequence of tuples, each having\
  \ the form\n\n```\n`number, item`\n```\n\nHere, _number_ is an integer in a sequence\
  \ beginning with _start_ (0 by default) and increasing by 1 in each position; and\
  \ _item_ is an item produced by the _iterable_.\n\nFor example, if you want to take\
  \ a list of strings and print each along with a sequential number, you could use\
  \ the following loop:\n\nClick here to view code image\n\n```\nbeat_list = ['John',\
  \ 'Paul', 'George', 'Ringo']\nfor n, item in enumerate(beat_list, 1):\n    print('%s.\
  \ %s' % (n, item))\n```\n\nThis prints\n\n```\n1. John\n2. Paul\n3. George\n4. Ringo\n\
  ```\n\nThe value produced by the **enumerate** function, by the way, is an “enumerate”\
  \ object, which can be used in a **for** statement, and can also, like other iterables,\
  \ be turned into a list or tuple if desired. In this example, which starts with\
  \ 1, the enumeration object produces tuples in this sequence:\n\nClick here to view\
  \ code image\n\n```\n`(1, item0), (2, item1), (3, item2)...`\n```\n\nIf you want\
  \ to print this iterable, you need to convert it to a list, or else use a `for`\
  \ loop to step through it, as was done here.\n\n## EVAL(EXPR_STR [, GLOBALS [, LOCALS]])\n\
  \nEvaluates the Python expression contained in `expr_str`. Although this can be\
  \ a way to write more compact code, it’s potentially dangerous if you evaluate arbitrary\
  \ input strings input by the user, unless the app is for your own use only.\n\n\
  The following example evaluates a Python expression and returns the result.\n\n\
  ```\n>>> a = 100\n>>> eval('3 * a + 55')\n355\n```\n\nThe string must contain an\
  \ expression and not a statement. Therefore, assignment statements cannot be used.\
  \ However, expressions can contain function calls, and function calls, in turn,\
  \ can execute statements.\n\nOne way to reduce the dangers of `eval` is to prevent\
  \ access to symbols. The `globals` argument, by default, gives the setting for local\
  \ symbols as well. Setting this argument to an empty dictionary prevents access\
  \ to symbols. (But note that built-in functions are always accessible.)\n\n[Click\
  \ here to view code image]\n\n```\n>>> eval('3 * 100 + 55', {}) # This is fine.\n\
  355\n>>> eval('3 * a + 55', {}) # ERROR; 'a' not\ndefined\n```\n\nOne way to bulletproof\
  \ your code is to create a dictionary\ncontaining the symbols you want to be accessible;\
  \ then give that\ndictionary as the `globals` argument:\n\n> Click here to view\
  \ code image\n\n```\n>>> from math import *\n>>> a = 25\n>>> dict_1 = {'tan': tan,\
  \ 'radians': radians, 'a': a\n}\n>>> eval('1000 * tan(radians(a))', dict_1)\n176.326980708465\n\
  ```\n\nThe effect is to create a dictionary that restricts the `eval` statement\
  \ to recognize only two functions (**tan** and **radians**) and one variable (`a`).\n\
  \nThe _locals_ argument isn’t used much, but you can use it to restrict access to\
  \ local symbols only. In that case, it won’t usually permit access to functions.\n\
  \n> Click here to view code image\n\n```\neval('a * a + 100', {}, locals())\n```\n\
  \n> Note\n> Although you can use the arguments to try to make `eval` safer, you\
  \ can never fully bulletproof this usage if your application should happen to take\
  \ an arbitrary string\n\nfrom the user and evaluate it. There are ways hackers can\
  \ take advantage of such\ncode to bring down a system. So again, take care.\n\n\
  ## EXEC(OBJECT [, GLOBAL [, LOCALS]]))\n\nSee the **compile** and **eval** functions.\
  \ The **compile** and **exec**\nfunctions are used by only the most advanced programmers.\n\
  You should usually avoid this function because of the large\nsecurity risks it can\
  \ create.\n\nExcept for the few people who need it, this function is a\nclassic\
  \ case of overkill. Proceed at your own risk.\n\n## FILTER(FUNCTION, ITERABLE)\n\
  \nGenerates a filtered sequence of values. Each item in the\n*iterable* is passed\
  \ to *function* in turn. This, argument,\n*function*, should take one argument and\
  \ return **True** or\n**False**.\n\nIf **True** is returned for a given element,\
  \ the element gets\nincluded in the sequence generated by **filter**. Otherwise,\
  \ the\nitem is omitted.\n\nIn this next example, only negative numbers get included\
  \ in\nthe results. Other values get filtered out.\n\nClick here to view code image\n\
  \n```\ndef is_neg(x):\n    return x < 0\n```\n\n```\nmy_list = [10, -1, 20, -3,\
  \ -2.5, 30]\nprint(list(filter(is_neg, my_list)))\n```\n\nThe result produced by\
  \ **filter** is a kind of iterable. You can convert it to a list if desired and\
  \ print it; so the last of the lines just shown prints the following:\n\n```\n[-1,\
  \ -3, -2.5]\n```\n\nThe _function_ argument may optionally be **None**. In that\
  \ case, the items included in the result are those that evaluate to **True** when\
  \ the **bool** conversion is applied. (Generally, any non-zero value or non-empty\
  \ collection evaluates as true.)\n\n## FLOAT([X])\n\nFloating-point conversion.\
  \ If the optional argument _x_ is specified, the result of converting the value\
  \ to floating point is returned. Types that may be successfully converted to floating\
  \ point include numeric types (such as integers) and strings containing a valid\
  \ representation of a floating-point number.\n\nStrings can include numeric representations\
  \ such as `'4.105'`, `'-23E01'`, and `'10.5e-5'`. Positive and negative infinity\
  \ can also be represented as `'Infinity'`, `'-Infinity'`, `'inf'`, and `'-inf'`.\n\
  \n> Click here to view code image\n\n```\nn = 1\nyyy = float(n)    # Assign 1.0\
  \ to yyy.\namt = float('-23E01')  # Assign -23E01 to amt.\n```\n\nIf no argument\
  \ is specified, the value 0.0 is returned. Note that the square brackets, in this\
  \ case, indicate that the argument, x, is optional.\n\nClick here to view code image\n\
  \n```\namt = float()   # Assign 0.0 to amt.\n```\n\n## FORMAT(OBJ, [FORMAT_SPEC])\n\
  \nFormat-string function, using the extended syntax for formatting described in\
  \ Chapter 5, “Formatting Text Precisely.” If the optional _format_spec_ argument\
  \ is specified, that argument is interpreted as a _spec_ formatting code, as described\
  \ in Chapter 5. Otherwise, the object is translated into its standard __str__ representation.\
  \ In either case, a string is returned.\n\nFor example:\n\n```\n>>> format(1000000,\
  \ ',')\n'1,000,000'\n```\n\nThe _format_ method of the string class (_str_) calls\
  \ this function once for each embedded print field. The result is to call the object’s\
  \ __format__ method if it’s defined, or (by default) its __str__ method.\n\n## FROZENSET([ITERABLE])\n\
  \nReturns a _frozenset_ object, which is an immutable version of the _set_ type.\
  \ Note the use of parentheses in the following\n\nexample, indicating that the argument\
  \ is a tuple.\n\nClick here to view code image\n\n```\n>>> frozenset((1, 2, 2, 3,\
  \ 3, 4, 1))\nfrozenset({1, 2, 3, 4})\n```\n\nIf the _iterable_ argument is omitted,\
  \ this function returns\nan empty **frozenset**.\n\n## GETATTR(OBJ, NAME_STR [,DEFAULT])\n\
  \nGet-attribute function. Returns the value of the named attribute\nfor the object,\
  \ _obj_; this value may have any type. The\n_name_str argument is a string containing\
  \ the attribute. If the\nattribute does not exist, the default value is returned;\
  \ but if the\nnamed attribute does not exist and there’s no default value, an\n\
  **AttributeError** exception is raised.\n\nThe following example assumes that a\
  \ Dog class exists.\n\n```\n>>> d = Dog()\n>>> d.breed = 'Bulldog'\n>>> attr_name\
  \ = 'breed'\n>>> getattr(d, attr_name)\n'Bulldog'\n```\n\n_See also_ **delattr**,\
  \ **hasattr**, and **setattr**.\n\n## GLOBALS()\n\nReturns a data dictionary, giving\
  \ the names and values of global\n\nvariables for the module that's currently executing.\n\
  \n## HASATTR(OBJ, NAME_STR)\n\nReturns **True** if the object, _obj_, has the attribute\
  \ specified in _name_str. The following example assumes that _my_dog is an instance\
  \ of a class, such as Dog:\n\n```\n>>> my_dog.breed = 'Husky'\n>>> nm = 'breed'\n\
  >>> hasattr(my_dog, nm)\nTrue\n```\n\n## HASH(OBJ)\n\nReturns a hash value for the\
  \ specified object, _obj_. This hash value is used by data dictionaries; as long\
  \ as such a value is provided, the object, _obj_, can be used as a key. Classes\
  \ whose objects do not support this function are not “hashable” and therefore cannot\
  \ be used as dictionary keys.\n\nThis function is implemented by calling the __hash__\
  \ method of the object’s class. See Chapter 9 for more information.\n\nVery rarely\
  \ is there any reason to call hash or __hash__ directly, except for testing purposes.\
  \ The most important thing to remember is that if you write a class and want it\
  \ to serve as a type that can be used as a key, then be sure to implement the __hash__\
  \ magic method.\n\n## HELP([OBJ])\n\n\n\n\n## HEX(N)\n\n十六进制转换。返回包含整数 _n_ 的十六进制（基数\
  \ 16）表示的字符串，包括前缀 `0x`。非整数输入会导致 Python 引发 `TypeError` 异常。\n\n例如：\n\n```\n>>> hex(23)\n\
  '0x17'\n```\n\n## ID(OBJ)\n\n返回对象 `obj` 的唯一标识符。如果两个变量（`obj1` 和 `obj2`）具有相同的标识符，则表达式\
  \ `obj1 is obj2` 返回 `True`——这意味着它们引用内存中的同一个对象。（注意：不要将其与相等性测试 `==` 混淆，后者是一种限制较少的条件。）\n\
  \n## INPUT([PROMPT_STR])\n\n输入函数。在等待用户输入零个或多个字符并按下回车键后，返回用户输入的字符串。如果指定了 _prompt_str_，则打印一个用于提示用户的字符串，例如“Enter\
  \ name here: ”。此提示字符串后不会自动打印额外的空格，因此你可能需要自行提供。例如：\n\nClick here to view code image\n\
  \n```\nmy_name = input('Enter your name, please: ')\nmy_age = int(input('Enter your\
  \ age, please: '))\n```\n\n## INT(X, BASE=10)\n\n整数转换函数。该函数接受一个数值或包含有效整数表示的字符串，然后返回实际的整数值。如果包含\
  \ *base* 参数，则决定如何解释作为参数给出的数字字符串；默认情况下假设十进制基数（基数 10），但也可以使用其他基数，例如 2（二进制）、8（八进制）或\
  \ 16（十六进制）。例如：\n\n```\n>>> int('1000', 16)\n4096\n```\n\n对于第一个参数，你可以指定另一种数值类型的对象，例如\
  \ *float*。*int* 转换会截断小数部分。例如：\n\n```\n>>> int(3.99), int(-3.99)\n(3, -3)\n```\n\n\
  要使用不同的舍入方案四舍五入到最接近的整数（或任何有效位数），请参见 **round** 函数。\n\n## INT()\n\n用于空参数列表的 `int` 转换函数。此版本的\
  \ `int`，在未指定任何参数的情况下，返回整数值 0。\n\n_另请参见_ 先前的 `int` 条目。\n\n## ISINSTANCE(OBJ, CLASS)\n\
  \n如果对象 _obj_ 是指定的 _class_ 或从该类派生的任何类型的实例，则返回 **True**。通常建议使用此函数而不是 **type** 函数。（第二个参数也可以是类型元组。在这种情况下，如果对象是任何指定类的实例，则此函数返回\
  \ **True**。）\n\n## ISSUBCLASS(CLASS1, CLASS2)\n\n如果 _class1_ 是 _class2_ 的子类或两个参数是同一个类，则返回\
  \ **True**。如果 _class1_ 不是类，则引发 **TypeError** 异常。与 `isinstance` 类似，第二个参数也可以是类型元组。\n\
  \n例如：\n\nClick here to view code image\n\n```\n>>> class Floopy(int):\n pass\n\n\
  >>> f = Floopy()\n>>> issubclass(Floopy, int)\nTrue\n>>> issubclass(int, Floopy)\n\
  False\n>>> issubclass(int, int)\nTrue\n>>> issubclass(f, int) # TypeError: f is\
  \ not a class\n```\n\n## ITER(OBJ)\n\n迭代函数。此函数调用假设 _obj_ 是可迭代对象——即返回迭代器的对象。这包括标准集合和序列，以及生成器。\n\
  \n如果参数不是可迭代对象，则调用 `iter(obj)` 会导致引发 **TypeError** 异常。如果 _obj_ 是可迭代对象，则对 `iter` 的调用应返回一个迭代器对象。此类对象通过响应\
  \ `next` 来执行对一系列值的实际遍历。\n\n几个示例应该能澄清这一点。首先，如果对象不是可迭代对象，则不能合法地调用 `iter(obj)`。例如：\n\
  \nClick here to view code image\n\n```\n>>> gen = iter(5) # This raises a TypeError\n\
  ```\n\n但是，如果目标对象是列表，则调用是有效的，即使（如本例所示）它是仅包含单个成员的短列表。\n\n```\n>>> gen = iter([5])\n\
  ```\n\n当然，更常见的是在包含至少两个成员的较长列表上使用 `iter`。返回的对象（称为迭代器或生成器对象）随后可以与 `next` 一起用于一次访问一个值的流。例如：\n\
  \nClick here to view code image\n\n```\n>>> gen = iter([1, 2, 3])\n>>> next(gen)\n\
  1\n>>> next(gen)\n2\n>>> next(gen)\n3\n>>> next(gen)    # StopIteration exception\
  \ raised.\n```\n\n`iter` 函数的效果是调用可迭代对象类（如集合或生成器）中的 `__iter__` 魔术方法，而 `next` 函数的效果是调用迭代器对象类的\
  \ `__next__` 方法。请记住这是一个两步过程。\n\n- 对可迭代对象（如集合、序列或范围）调用 `iter` 返回一个迭代器对象（如前示例中的 `gen`）。有时这会隐式发生；`for`\
  \ 循环会自动为你执行此操作。\n\n- 对迭代器对象调用 `next` 可获取迭代产生的下一个值。`for` 循环也会自动执行此操作。\n\n## LEN(SEQUENCE)\n\
  \n返回当前存储在 `sequence` 中的元素数量，该序列通常是集合，但也可能是由 `range` 函数生成的序列。对于字符串，这给出字符串中的字符数。\n\
  \n```\n>>> len('Hello')\n5\n```\n\n此函数通常通过调用对象类的 `__len__` 方法来实现。\n\n请注意，尽管由 **range**\
  \ 函数生成的序列支持此函数，但不能保证其他生成器也支持。\n\n## LIST([ITERABLE])\n\n列表转换函数。接受一个参数，该参数必须是某种可迭代对象，并返回一个列表。如果涉及生成器对象，则值的来源必须是有限数量的。\n\
  \n如果 *iterable* 是字符串，则该函数返回一个列表，其中每个元素都是一个单字符字符串。\n\n```\n>>> print(list('cat'))\n\
  ['c', 'a', 't']\n```\n\n语法中的方括号表示 *iterable* 是可选的。如果未指定 *iterable*，则此函数返回一个空列表，[]。\n\
  \nClick here to view code image\n\n```\n>>> new_list = list() # Init new_list to\
  \ empty list.\n>>> new_list\n[]\n```\n\n## LOCALS()\n\n返回包含本地符号表中值信息的字典。不应直接修改此字典。例如：\n\
  \n```\n>>> def foobar() :\n    a = 2\n    b = 3\n    c = 1\n    print(locals())\n\
  >>> foobar()\n{'a':2, 'b':3, 'c':1}\n```\n\n## MAP(FUNCTION, ITERABLE1 [, ITERABLE2...])\n\
  \n接受一系列 _iterables_ 并返回另一个可迭代对象，该对象可用于 `for` 语句，例如，或通过调用 `list` 转换转换为列表。\n\n_function_\
  \ 参数是一个可调用对象，必须接受与提供给此函数的其他参数中的 _iterables_ 数量相等的参数数目。\n\n对于 _iterables_ 中的每个参数位置，都会调用该函数并从每个参数中获取一个元素；然后将结果放置由\
  \ `map` 函数生成的结果序列中。结果可迭代对象会在任何参数耗尽时停止。\n\n例如：\n\nClick here to view code image\n\
  \n```\n>>> def multy(a, b, c):\n    return a * b * c\n>>> m = map(multy, [1, 20],\
  \ [1, 20], [1, 50])\n>>> print(list(m))\n[1, 20000]\n```\n\n在这种情况下，结果为 [1, 20000]，因为\
  \ 1 * 1 * 1 产生 1，而 20 * 20 * 50 产生 20000。\n\nmap 函数可以只使用一个可迭代参数；但是，在这种情况下，列表推导式通常提供更好的解决方案。\n\
  \n## MAX(ARG1 [, ARG2]...)\n\n返回一系列一个或多个参数中的最大值（此处的括号并非字面意思）。有关此函数工作原理的更多信息，请参见\
  \ max 的其他条目。\n\n```\n>>> max(1, 3.0, -100, 5.25)\n5.25\n```\n\n## MAX(ITERABLE)\n\
  \n从有限可迭代对象（可能是集合、序列或生成器对象）中返回最大元素。在 Python 3.0 中，所有元素都必须相对于所有\n\n\n\nother elements,\
  \ or else this function raises a **TypeError** exception.\n\nSorting is enabled\
  \ by support for the less-than operator (<) for the objects involved; this means\
  \ that the appropriate `__lt__` magic method must be defined for every combination\
  \ of element.\n\nBut note that all built-in numeric types, except for **complex**,\
  \ are sortable with regard to each other.\n\nFor example:\n\nClick here to view\
  \ code image\n\n```\n>>> from fractions import Fraction\n>>> a_list = [1, Fraction('5/2'),\
  \ 2.1]\n>>> max(a_list)\nFraction(5, 2)\n```\n\n_See also_ the previous listing\
  \ for **max**.\n\n## MIN(ARG1 [, ARG2]...)\n\nReturns the minimum value from a series\
  \ of one or more arguments (brackets here are not intended literally). See the other\
  \ entry for **min** for more information on how this function works.\n\n```\n>>>\
  \ min(1, 3.0, -100, 5.25)\n-100\n```\n\n## MIN(ITERABLE)\n\nReturns the minimum\
  \ element from a finite _iterable_ (which may be a collection, sequence, or generator\
  \ object). In Python 3.0, all the elements must be sortable with regard to all the\
  \ other elements, or else this function raises a **TypeError** exception.\n\nSorting\
  \ is enabled by support for the less-than operator (<) for the objects involved;\
  \ this means that the appropriate `__lt__` magic method must be defined for every\
  \ combination of element.\n\nBut note that all built-in numeric types, except for\
  \ **complex**, are sortable with regard to each other.\n\nFor example:\n\nClick\
  \ here to view code image\n\n```\n>>> from fractions import Fraction\n>>> a_list\
  \ = [1, Fraction('5/2'), 2.1]\n>>> min(a_list)\n1\n```\n\nSee also the previous\
  \ listing for **min**.\n\n## OCT(N)\n\nReturns a string containing the integer _n_\
  \ in octal representation, including the octal prefix (0o). Inputs other than integer\
  \ cause Python to raise a **TypeError** exception.\n\nFor example:\n\n```\n>>> oct(9)\n\
  '0o11'\n```\n\n## OPEN(FILE_NAME_STR,\nMODE='RT')\n\nAttempts to open the file named\
  \ by the first argument, which\nmay include a complete path name or a name local\
  \ to the\ncurrent directory. If the file open is successful, a file object is\n\
  returned. If not, an exception is raised, such as\n**FileNotFoundError**.\n\nThe\
  \ _mode_ is a string that should not contain more than two or\nthree characters.\
  \ Up to one character may be 't' or 'b',\nindicating whether the file is accessed\
  \ as text or binary. The\ndefault is text ('t').\n\nThe other character or characters\
  \ determine whether the file-\naccess mode is read, write, or read/write. The default\
  \ is read\nmode ('r'). Table B.2 shows the read/write modes that may be\ncombined\
  \ with 't' (the default) or 'b', representing text and\nbinary mode, respectively.\n\
  \n## Table B.2. File Read/Write Modes\n\n| Read/Write file modes | Description |\n\
  |---|---|\n| r | Read mode. The file must already exist. |\n| w | Write mode. The\
  \ file will be replaced in its entirety. |\n| a | Append mode. File pointer is set\
  \ to end of file, but |\n| w+ | Read/write mode. Truncates the file to zero bytes\
  \ upon opening. |\n| r+ | Read/write mode. Performs no truncation upon opening.\
  \ |\n| x | Open for exclusive creation (write mode). Exception is raised if the\
  \ file already exists. |\n\nHere’s a simple example, opening a file in binary write\
  \ mode ('wb'):\n\n```\nf = open('mydata.dat', 'wb')\n```\n\nThis function has a\
  \ number of other optional arguments that are occasionally used in specialized situations,\
  \ not covered in this appendix. These other arguments include _buffering_, which\
  \ by default is set to -1; and _encoding_, _errors_, and _newline_, each of which\
  \ is set to **None** by default.\n\n> **Note**\n> >\n> > A file, once open, can\
  \ be closed by calling the `close` method of the `file` class, which includes many\
  \ other I/O methods. A file may also be closed automatically by using the `with`\
  \ keyword, as explained in Appendix E.\n\n## ORD(CHAR_STR)\n\nOrdinal value function.\
  \ Returns the number that is the ASCII or Unicode character code for the character\
  \ contained in _char_str_. This argument is assumed to be a string containing exactly\
  \ one character. If it is not a string or if it contains more than one character,\
  \ a **TypeError** exception is raised.\n\nThe **ord** function is the inverse of\
  \ the **chr** function.\n\n```\n>>> chr(ord('a'))\n'a'\n```\n\n## POW(X, Y [, Z])\n\
  \nPower function. Returns the same value that `x ** y` does—that is, it raises the\
  \ numeric value _x_ to the power of _y_. If _z_ is specified, the function returns\
  \ `x ** y % z` (divide the result by _z_ and then return the remainder). For example:\n\
  \n```\n>>> pow(2, 4)\n16\n>>> pow(2, 4, 10)\n6\n>>> pow(1.1, 100)\n13780.61233982238\n\
  ```\n\nThis last figure represents one dollar compounded at 10 percent annually\
  \ for 100 years. The result is more than $13,000. (All good things come to those\
  \ who wait!)\n\n## PRINT(OBJECTS, SEP='', END='\\n', FILE=SYS.STDOUT)\n\nGeneral-purpose\
  \ `print` function. Default action is to get the string representation (`str`) of\
  \ each of the objects and print them. By default, the `print` function prints an\
  \ empty space between each of the objects’ arguments; however, the `sep` argument\
  \ may be used to specify another separator, including (if desired) an empty string,\
  \ which would result in no separator at all.\n\nAnother named argument is `end`,\
  \ which by default is a newline character; this determines what character, if any,\
  \ is automatically printed at the end of all the output produced by this call to\
  \ the `print` function. This is another argument that’s often set to an empty string,\
  \ giving the function caller more control over how often the output advances to\
  \ the next line.\n\nFinally, the default destination for the output is standard\
  \ output (`sys.stdout`).\n\nHere’s an example using a customized separator: a semicolon\
  \ followed by a space.\n\n```\ns1 = 'eenie'\ns2 = 'meenie'\ns3 = 'Moe'\nprint(s1,\
  \ s2, s3, sep='; ')\n```\n\nThis prints\n\n```\neenie; meenie; Moe\n```\n\nThis\
  \ function is implemented by calling the `__str__` function for each of the objects\
  \ to be printed.\n\n## RANGE(N)\n\nReturns a sequence of integers, starting with\
  \ 0 up to but not including n. Therefore, range(n) produces 0, 1, 2, ... n-1.\n\
  You can use this sequence directly in a for statement; but if you want the sequence\
  \ to have the full status of a list (so that you can print or index it), you need\
  \ to apply a list conversion.\n\n```\n>>> list(range(5))\n[0, 1, 2, 3, 4]\n```\n\
  \nThe expression range(len(collection)) returns a sequence of integers corresponding\
  \ to all the valid, non-negative indexes for the collection.\nRemember that the\
  \ value n is itself not included in the sequence. Instead, range generates integers\
  \ from 0 up to but not including n.\n\n## RANGE(START, STOP [, STEP])\n\nReturns\
  \ a sequence of integers, just as in the other version of range. However, the start\
  \ argument specifies an integer to begin the sequence on; stop is the number to\
  \ end on; and the range extends up to, but not including, the stop argument. The\
  \ step argument, if included, determines how much to increment each time.\nIf the\
  \ step value is negative, the range goes in the reverse direction. It begins with\
  \ the start value and then goes down to, but not including, the stop value. For\
  \ example:\n\n```\n>>> list(range(1, 7, 2))\n[1, 3, 5]\n>>> list(range(5, 1, -1))\n\
  [5, 4, 3, 2]\n```\n\nSee also the previous entry for **range**, which shows you\
  \ can\nhave as few as one argument.\n\n## REPR(OBJ)\n\nProduces a string representation\
  \ of _obj_, similar to the action of\nthe **str** conversion function; however,\
  \ whereas **str** gives a\nstandard string representation, **repr** gives the canonical\n\
  representation of the object as it appears in code. Therefore,\nwhereas `str(a_string)`\
  \ prints a string as it is, without any\nsurrounding quotation marks, `repr(a_string)`\
  \ prints it with\nthe quotes, because that’s how it would appear in Python code.\n\
  \nFor example:\n\n> Click here to view code image\n\n```\n>>> my_str = 'Hi, I'm\
  \ Brian!'\n>>> print(repr(my_str))\n'Hi, I'm Brian!'\n```\n\nThe last two lines\
  \ are equivalent to the following, because\nIDLE uses **repr** to display the value\
  \ of an object rather than\npassing the object to **print**.\n\n```\n>>> my_str\n\
  'Hi, I'm Brian!'\n```\n\n\n\n\n\n此函数通过调用对象类的 `__repr__` 函数来实现。\n\n## REVERSED(ITERABLE)\n\
  \n生成一个反向生成器，用于遍历源中的元素——也就是说，它按照与元素在 _iterable_ 中的顺序相反的顺序迭代项目。你可以在 `for` 循环中使用此生成器，这是最典型的用法。你还可以使用\
  \ **list** 转换函数将其转换为列表。例如：\n\n```\n>>> print(list(reversed([1, 2, 3])))\n[3, 2,\
  \ 1]\n```\n\n从技术上讲，你可以获取字符串的反向生成器并尝试显示有意义的结果。然而，这很难实现，并且需要使用列表和 `join` 函数。否则，请看会发生什么：\n\
  \n```\n>>> str(reversed('Wow, Bob, wow!'))\n'<reversed object at 0x11124bc88>'\n\
  ```\n\n问题是，**reversed** 函数对字符串操作时，生成的是一个生成器对象而不是字符串。但有替代方案。最简单的解决方案是直接在字符串上使用切片。例如：\n\
  \n```\n>>> 'Wow, Bob, wow!'[::-1]\n'!wow ,boB ,woW'\n```\n\n## ROUND(X [,NDIGITS])\n\
  \n对数值 x 进行四舍五入，使用 ndigits 指示在哪个位置进行四舍五入：具体来说，ndigits 是一个整数，指示小数点右侧多少位进行四舍五入。负数表示小数点左侧的位置。\n\
  \nndigits 值为 0 会导致四舍五入到最接近的单位（即最接近的整数）。ndigits 值为 1 会四舍五入到最接近的十分位，而值为 -1 会四舍五入到最接近的\
  \ 10 的倍数。\n\n如果未指定 ndigits，则函数四舍五入到最接近的单位，并将结果作为整数而不是浮点数返回。（语法中的方括号表示该参数是可选的。）\n\
  \n例如：\n\n```\n>>> round(12.555, 1)\n12.6\n>>> round(12.555, 2)\n12.56\n>>> round(12.555,\
  \ 0)\n13.0\n>>> round(12.555)\n13\n>>> round(12.555, -1)\n10.0\n```\n\n默认情况下，四舍五入机制根据结果中最低有效位右侧数字的值向上或向下舍入。如果该数字为\
  \ 5 或更高，则向上舍入；如果为 4 或更低，则向下舍入。此行为对正数和负数都适用，因此“向上舍入”会产生远离 0 的值。例如：\n\n```\n>>> round(-55.55)\n\
  -56\n```\n\n## SET([ITERABLE])\n\nPython 集合的转换函数。如果省略 *iterable* 参数，则结果为空。这是在 Python\
  \ 中表示空集合的标准方法，因为 { } 表示空字典而不是空集合。\n\n```\nempty_set = set()\n```\n\n如果 *iterable*\
  \ 不为空，则生成的集合包含参数中的所有元素，但重复项会被删除，顺序无关紧要。例如：\n\n```\n>>> my_list = [11, 11, 3, 5,\
  \ 3, 3, 3]\n>>> my_set = set(my_list)\n>>> my_set\n{3, 11, 5}\n```\n\n## SETATTR(OBJ,\
  \ NAME_STR, VALUE)\n\n属性设置函数。虽然大多数属性设置是直接完成的，但此函数允许你在运行时（而非硬编码）稍后确定属性。这样，属性名称可以在运行时确定。该属性可能由用户提供，也可能由程序交互的数据库中的某个属性确定。\n\
  \n例如，Dog 对象的品种可以这样设置：\n\n```\nd = Dog()\nd.breed = 'Dane'\n```\n\n但如果属性事先未知，则以下语句完成相同的操作，在这种情况下将\
  \ `breed` 属性设置为 'Dane'。\n\n```\nattr_str = 'breed'\n...\nsetattr(d, attr_str, 'Dane')\
  \  # set d.breed = 'Dane'\n```\n\n## SORTED(ITERABLE [, KEY] [, REVERSE])\n\n生成一个包含\
  \ _iterable_ 中所有元素但按排序顺序排列的列表。参数中的所有元素必须是相同的数据类型，或兼容的数据类型，其顺序可以通过对任意两个元素应用小于（<）运算符来确定。如果不支持此类比较，则会引发\
  \ **TypeError** 异常。\n\n以下是一个简单的示例：\n\n```\n>>> sorted([5, 0, 10, 7])\n[0, 5, 7,\
  \ 10]\n```\n\n此函数始终生成一个列表，而 **reversed** 函数生成一个可迭代对象。key 参数是一个返回用于排序的 _key_ 的函数，而\
  \ _reverse_ 如果为 **True** 则表示从高到低的顺序。如果使用，每个参数都必须是关键字参数。\n\n## STR(OBJ=\"\")\n\n\
  返回对象 _obj_ 的字符串表示形式。如果未指定 _obj_，则此函数返回空字符串。\n\n此转换通过调用对象类的 `__str__` 方法来实现。如果类未定义\
  \ `__str__` 方法，则默认调用其 `__repr__` 方法。在许多情况下，两种方法显示的结果相同；然而，区别在于 `__repr__` 方法包含对象在代码中出现的表示形式——例如，字符串对象会带有引号返回。\n\
  \n除了打印中的作用外，此字符串转换还有其他用途。例如，如果你想计算数字中 o 的数量，可以使用此转换。\n\n```\n>>> n = 10100140\n\
  >>> s = str(n)\n>>> s.count('0')\n4\n```\n\n## STR(OBJ=B\" [, ENCODING='UTF-8'])\n\
  \n此版本的 `str` 将 `bytes` 字符串（保证由单个字节组成）转换为标准 Python 字符串，后者可能使用两个或多个字节来存储一个字符。例如：\n\
  \n```\nbs = b'Hello!' # Guaranteed to hold exactly six bytes\ns = str(bs, encoding='utf-8')\n\
  print(s) # Print a normal string, ? bytes per char.\n```\n\n_另请参见_ 上一条关于 `str` 的条目。\n\
  \n## SUM(ITERABLE [, START])\n\n生成 _iterable_ 中元素的总和。所有元素必须是数值；或者它们至少必须支持该类型对象之间以及与整数的\
  \ __add__ 方法。它不会连接字符串。\n\n这是一个非常方便的函数，用于数值列表、元组和集合。例如，这是一个获取数值集合平均值的简单函数：\n\n```\n\
  def get_avg(a_list):\n    return sum(a_list)/len(a_list)\n```\n\n以下是执行此函数的示例：\n\n\
  ```\n>>> get_avg([1, 2, 3, 4, 10])\n4.0\n```\n\n**sum** 函数可以用于其他类型的可迭代对象，例如生成器，只要它们产生有限序列。例如：\n\
  \n```\n>>> def gen_count(n):\n    i = 1\n    while i <= n:\n        yield i\n  \
  \      i += 1\n>>> sum(gen_count(100))\n5050\n```\n\n在这种情况下，`sum(gen_count(n))`\
  \ 的效果是将 1 到 n 的所有数字相加。\n\n## SUPER(TYPE)\n\n返回指定类型的超类。当你从类继承并希望调用特定方法（例如 `__init__`）的超类版本时，这很有用。\n\
  \n## TUPLE([ITERABLE])\n\n元组转换：通过从 _iterable_ 获取值来返回不可变序列，该序列的大小必须是有限的。方括号表示 _iterable_\
  \ 是可选参数；如果省略，则返回的元组为空。\n\n## TYPE(OBJ)\n\n返回 _obj_ 的类型，可以在运行时与其他类型进行比较，使用等式测试（==）或\
  \ **is**。例如：\n\n```\n>>> i = 5\n>>> type(i) is int\nTrue\n>>> type(i) == int\nTrue\n\
  ```\n\n**type** 函数在 Python 中通常很有用，用于确定参数的类型；它使你能够针对不同类型的参数做出不同响应。但是，通常建议使用 **isinstance**\
  \ 而不是 **type**，因为 **isinstance** 会考虑子类。\n\n## ZIP(*ITERABLES)\n\n从一系列参数返回元组序列。对于每个位置，结果中的元组是\
  \ (i1, i2, i3... iN)，其中 N 是此函数的参数数量，_i_ 是由相应的 _iterable_ 参数生成的值。当这些参数中最短的一个耗尽时，函数停止生成元组。\n\
  \n\n\n\n\nThat’s a mouthful, but an example should help clarify. The following example\
  \ demonstrates how **zip** can be used to create one list from the sum of two other\
  \ lists: each element in _a_ is added to the corresponding element in _b_.\n\nClick\
  \ here to view code image\n\n```\na = [1, 2, 3]\nb = [10, 20, 30]\nc = [i[0] + i[1]\
  \ for i in zip(a, b)]\n```\n\nPrinting the results gives us\n\n```\n[11, 22, 33]\n\
  ```\n\nThe expression `zip(a, b)`, were you to convert it to a list and print it,\
  \ produces a list of tuples, as shown:\n\n```\n>>> a_list = list(zip(a, b))\n>>>\
  \ a_list\n[(1, 10), (2, 20), (3, 30)]\n```\n\nCompare the first three lines of the\
  \ previous example with the following lines, which are more complicated and harder\
  \ to maintain. This is a longer way of producing the same result.\n\nClick here\
  \ to view code image\n\n```\na = [1, 2, 3]\nb = [10, 20, 30]\nc = []\nfor i in range(min(len(a),\
  \ len(b)) ):\n    c.append(a[i] + b[i])\n```\n"
- '## C. Set 方法


  本附录列出了 `set` 类型的方法。它不涵盖也可用于此类型的函数，例如 `len`。有关这些内容，请参见附录 B。


  ### 表 C.1. 最常用的 Set 方法。


  | 要执行的任务： | 调用的方法： |

  | --- | --- |

  | 将元素添加到集合 | `add` |

  | 清除集合的所有内容 | `clear` |

  | 复制另一个集合的所有内容 | `copy` |

  | 从集合中删除项目 | `discard`, `pop`, `remove` |

  | 确定集合是否是另一个集合的子集或超集 | `issubset`, `issuperset` |

  | 执行集合差集（集合减法） | `difference`, `symmetric_difference` |

  | 执行交集 | `intersection` |

  | 执行并集 | `union` |


  **注意**：要确定元素是否是特定集合的成员，请使用 `in` 关键字。


  ## SET_OBJ.ADD(OBJ)


  将对象 _obj_ 添加到现有集合中。如果 _obj_ 已经是集合的成员，则该语句无效。两种情况均返回 **None**。例如：


  Click here to view code image


  ```

  a_set = {1, 2, 3}

  a_set.add(4)        # Adds 4 to the set.

  ```


  集合 `a_set` 现在等于 `{1, 2, 3, 4}`。


  ## SET_OBJ.CLEAR()


  清除现有集合中的所有元素。不接受参数，并返回值 **None**。


  ```

  a_set.clear()

  ```


  ## SET_OBJ.COPY()


  返回集合的浅拷贝，逐个成员复制。例如：


  ```

  a_set = {1, 2, 3}

  b_set = a_set.copy()

  ```


  执行这些语句后，`b_set` 具有与 `a_set` 相同的内容，但它们是两个独立的集合，因此对其中一个的更改不会影响另一个。


  ## SET_OBJ.DIFFERENCE(OTHER_SET)


  返回一个集合，包含 `set_obj` 中存在但不在 `other_set` 中的所有元素。例如：


  Click here to view code image


  ```

  a_set = {1, 2, 3, 4}

  b_set = {3, 4, 5, 6}

  c = a_set.difference(b_set)

  print(c)            # Prints {1, 2}

  print(b_set.difference(a_set))  # Prints {5, 6}

  ```


  `difference` 运算符（对集合使用减号 `-`）产生相同的结果且更紧凑。


  Click here to view code image


  ```

  print(a_set - b_set)        # Prints {1, 2}

  ```


  ## SET_OBJ.DIFFERENCE_UPDATE(OTHER_SET)


  执行与 `difference` 方法相同的操作，但结果存储在 `set_obj` 中，返回值为 `None`。


  差值赋值运算符 (`-=`) 执行相同的操作。


  Click here to view code image


  ```

  a_set -= b_set    # Put results of diff. in a_set

  ```


  ## SET_OBJ.DISCARD(OBJ)


  从 _set_obj_ 中删除元素 _obj_。返回值 **None**。执行与 **remove** 方法相同的操作，但如果 _obj* 当前不是集合的成员，则不会引发异常。


  Click here to view code image


  ```

  a_set = {''Moe'', ''Larry'', ''Curly''}

  a_set.discard(''Curly'')

  print(a_set)        # Prints {''Moe'', ''Larry''}

  ```


  ## SET_OBJ.INTERSECTION(OTHER_SET)


  返回 _set_obj_ 和 _other_set_ 的交集，即同时是两个集合元素的所有对象。如果两个集合没有共同元素，则返回空集合。例如：


  Click here to view code image


  ```

  a_set = {1, 2, 3, 4}

  b_set = {3, 4, 5, 6}

  print(a_set.intersection(b_set))  # Prints {3, 4}

  ```


  交集运算符 (&) 执行相同的操作。


  Click here to view code image


  ```

  print(a_set & b_set)      # Prints {3, 4}

  ```


  ## SET_OBJ.INTERSECTION_UPDATE(OTHER_SET)


  执行与 intersection 方法相同的操作，但结果存储在 set_obj 中，返回值为 None。


  交集赋值运算符 (&=) 执行相同的操作。


  Click here to view code image


  ```

  a_set &= b_set   # Put the intersection in a_set

  ```


  ## SET_OBJ.ISDISJOINT(OTHER_SET)


  根据 set_obj 和 other_set 是否不相交（即没有共同元素）返回 True 或 False。


  ## SET_OBJ.ISSUBSET(OTHER_SET)


  如果 _set_obj_ 是 _other_set_ 的子集，则返回 **True**；这包括两个集合相等的情况。例如：


  Click here to view code image


  ```

  {1, 2}.issubset({1, 2, 3})  # Produces the value True.

  {1, 2}.issubset({1, 2})     # Also produces True.

  ```


  ## SET_OBJ.ISSUPERSET(OTHER_SET)


  如果 _set_obj_ 是 _other_set_ 的超集，则返回 True；这包括两个集合相等的情况。例如：


  Click here to view code image


  ```

  {1, 2}.issuperset({1})     # Produces the value True.

  {1, 2}.issuperset({1, 2})   # Also produces True.

  ```


  ## SET_OBJ.POP()


  从集合中返回一个随机元素，然后删除该元素。例如：


  Click here to view code image


  ```

  a_set = {''Moe'', ''Larry'', ''Curly''}

  stooge = a_set.pop()

  print(stooge, a_set)

  ```


  此示例打印（或者可能打印）以下内容：


  ```

  Moe { ''Larry'', ''Curly'' }

  ```


  ## SET_OBJ.REMOVE(OBJ)


  从 _set_obj_ 中删除指定元素 _obj_。这与 **discard** 方法执行相同的操作，但如果 _obj* 当前不是元素，则 **remove**
  会引发 **KeyError** 异常。


  ## SET_OBJ.SYMMETRIC_DIFFERENCE(OTHER_SET)


  返回一个集合，包含属于 _set_obj_ 但不属于 _other_set_ 的所有对象，反之亦然。例如：


  Click here to view code image


  ```

  a_set = {1, 2, 3, 4}

  b_set = {3, 4, 5, 6}

  print(a_set.symmetric_difference(b_set))

  ```


  此代码打印集合 {1, 2, 5, 6}。


  对称差集运算符 (**^**) 执行相同的操作。


  Click here to view code image


  ```

  print(a_set ^ b_set)   # Prints {1, 2, 5, 6}

  ```


  ## SET_OBJ.SYMMETRIC_DIFFERENCE_UPDATE(OTHER_SET)


  执行与 `symmetric_difference` 方法相同的操作，但结果存储在 _set_obj_ 中，返回值为 **None**。


  对称差集赋值运算符 (`^=`) 执行相同的操作。


  Click here to view code image


  ```

  a_set ^= b_set     # Put the sym. difference in a_set

  ```


  ## SET_OBJ.UNION(OTHER_SET)


  返回 _set_obj_ 和 _other_set_ 的并集，即包含属于任一集合或两个集合的所有对象的集合。例如：


  Click here to view code image


  ```

  a_set = {1, 2, 3, 4}

  b_set = {3, 4, 5, 6}

  print(a_set.union(b_set))  # Prints {1, 2, 3, 4, 5, 6}

  ```


  并集运算符 (`|`) 执行相同的操作。


  Click here to view code image


  ```

  print(a_set | b_set)  # Prints {1, 2, 3, 4, 5, 6}

  ```


  ## SET_OBJ.UNION_UPDATE(OTHER_SET)


  执行与 **union** 方法相同的操作，但结果存储在 _set_obj_ 中，返回值为 **None**。


  并集赋值运算符 (`|=`) 执行相同的操作。


  Click here to view code image


  ```

  a_set |= b_set    # Put the union in a_set

  ```


  此运算符提供了一种扩展集合内容的简便方法。例如：


  Click here to view code image


  ```

  a_set = {1, 2, 3}

  a_set |= {200, 300}

  print(a_set)    # Prints {1, 2, 3, 200, 300}

  ```






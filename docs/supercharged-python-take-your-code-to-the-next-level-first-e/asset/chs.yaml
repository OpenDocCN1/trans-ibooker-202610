  import re\nimport operator\nfrom random import randint\nfrom rpn_io import *\n\n\
  sym_tab = { }   # Symbol table (for variables)\nstack = []      # Stack to hold\
  \ the values.\npc = -1         # Program Counter\n\n# Scanner: Add items to recognize\
  \ variable names, which\n# are stored in the symbol table, and to perform\n# assignments,\
  \ which enter values into the sym. table.\n\nscanner = re.Scanner([\n    (r\"[ \\\
  t\\n]\", lambda s, t: None),\n    (r\"-?(\\d*)?\\.\\d+\", lambda s, t:\n       \
  \ stack.append(float(t))),\n    (r\"-?\\d+\", lambda s, t: stack.append(int(t))),\n\
  \    (r\"[a-zA-Z_][a-zA-Z_0-9]*\", lambda s, t:\n        stack.append(t)),\n   \
  \ (r\"[+]\", lambda s, t: bin_op(operator.add)),\n    (r\"[-]\", lambda s, t: bin_op(operator.sub)),\n\
  \    (r\"[*]\", lambda s, t: bin_op(operator.mul)),\n    (r\"[/]\", lambda s, t:\
  \ bin_op(operator.truediv)),\n    (r\"[>]\", lambda s, t: bin_op(operator.gt)),\n\
  \    (r\"[!]\", lambda s, t: bin_op(randint)),\n    (r\"[\\^]\", lambda s, t: bin_op(operator.pow)),\n\
  \    (r\"[=]\", lambda s, t: assign_op()),\n    (r\"[?]\", lambda s, t: jnz_op())\n\
  ])\n\ndef jnz_op():\n    \"\"\"Jump on Not Zero operation.\n\n    After evaluating\
  \ the operands, test the first op;\n    if not zero, set Program Counter to op2\
  \ - 1.\n    \"\"\"\n    global pc\n    op2, op1 = stack.pop(), stack.pop()\n   \
  \ if type(op1) == str:\n        op1 = sym_tab[op1]\n    if type(op2) == str:\n \
  \       op2 = sym_tab[op2]\n    if op1:\n        pc = int(op2) - 1  # Convert op\
  \ to int format.\n\ndef assign_op():\n    \"\"\"Assignment Operator function.\n\
  \    Pop off a name and a value, and make a symbol-table\n    entry.\n    \"\"\"\
  \n    op2, op1 = stack.pop(), stack.pop()\n    if type(op2) == str:  # Source may\
  \ be another var!\n        op2 = sym_tab[op2]\n    sym_tab[op1] = op2\n\ndef bin_op(action):\n\
  \    \"\"\"Binary Operation function.\n    If an operand is a variable name, look\
  \ it up in\n    the symbol table and replace with the corresponding\n    value,\
  \ before being evaluated.\n    \"\"\"\n    op2, op1 = stack.pop(), stack.pop()\n\
  \    if type(op1) == str:\n        op1 = sym_tab[op1]\n    if type(op2) == str:\n\
  \        op2 = sym_tab[op2]\n    stack.append(action(op1, op2))\n\ndef main():\n\
  \    \"\"\"Main function.\n    This is the function that drives the\n    program.\
  \ After opening the file and getting operations\n    into a_list, process strings\
  \ in a_list one at a time.\n    \"\"\"\n    global pc\n    dir('__main__')\n   \
  \ a_list = open_rpn_file()\n\n    if not a_list:\n        print('Bye!')\n      \
  \  return\n\n    pc = -1\n    while True:\n        pc += 1\n        if pc >= len(a_list):\n\
  \            break\n        a_line = a_list[pc]\n        try:\n            a_line\
  \ = a_line.strip()\n            if a_line.startswith('PRINTS'):\n              \
  \  do_prints(a_line[7:])\n            elif a_line.startswith('PRINTLN'):\n     \
  \           do_println(a_line[8:])\n            elif a_line.startswith('PRINTVAR'):\n\
  \                do_printvar(a_line[9:], sym_tab)\n            elif a_line.startswith('INPUT'):\n\
  \                do_input(a_line[6:], sym_tab)\n            elif a_line:\n     \
  \           tokens, unknown = scanner.scan(a_line)\n                if unknown:\n\
  \                    print('Unrecognized input:', unknown)\n                   \
  \ break\n        except KeyError as e:\n            print('Unrecognized symbol',\
  \ e.args[0],\n                  'found in line', pc)\n            print(a_list[pc])\n\
  \            break\n\nmain()\n```\n\n## 文件 rpn_io.py\n\n```python\ndef open_rpn_file():\n\
  \    '''Open-source-file function.\n    Open a named file and read lines into a\
  \ list,\n    which is then returned.\n    '''\n    while True:\n        try:\n \
  \           fname = input('Enter RPN source: ')\n            if not fname:\n   \
  \             return None\n            f = open(fname, 'r')\n            break\n\
  \        except:\n            print('File not found. Re-enter.')\n    a_list = f.readlines()\n\
  \    return a_list\n\ndef do_prints(s):\n    '''Print string function.\n    Print\
  \ string argument s, without adding a newline.\n    '''\n    a_str = get_str(s)\n\

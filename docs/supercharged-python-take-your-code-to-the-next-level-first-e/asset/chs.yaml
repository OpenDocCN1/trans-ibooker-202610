  >>> n = 5\n>>> n = n + 1\n>>> n = n + 1\n>>> n\n7\n```\n\nWhat’s really going on\
  \ is that we’re repeatedly reassigning n as a name for an increasingly higher value.\
  \ Each time, the old association is broken and n refers to a new value.\n\nAssignments\

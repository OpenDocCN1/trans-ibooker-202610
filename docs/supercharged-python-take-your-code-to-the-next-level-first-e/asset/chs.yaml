  \ 语句相同的结果，请在 Python 2.0 中使用 `raw_input` 函数。\n\n`input` 函数会打印提示字符串（如果指定了的话）；然后返回用户输入的字符串。输入字符串会在用户按下\
  \ Enter 键后立即返回；但不会追加换行符。\n\n![](img/6e45221a8147f2442c653a3d4a866570_51_0.png)\n\
  \n```\ninput(prompt_string)\n```\n\n要将返回的字符串存储为数字，需要将其转换为整数（**int**）或浮点数（**float**）格式。例如，要获取整数，请使用以下代码：\n\
  \n> Click here to view code image\n\n```\nn = int(input('Enter integer here: '))\n\
  ```\n\n或者使用以下代码来获取浮点数：\n\n> Click here to view code image\n\n```\nx = float(input('Enter\
  \ floating pt value here: '))\n```\n\n提示文本打印时不会添加空格，因此你通常需要自己提供该空格。\n\n为什么需要 **int**\
  \ 或 **float** 转换？请记住，当你想要获取数字时，这些转换是必要的。当你使用 **input** 函数获取任何输入时，你得到的是一个字符串，例如“5”。这样的字符串对于许多用途都没问题，但在进行转换之前，你无法对其执行算术运算。\n\
  \nPython 3.0 还支持 **print** 函数——在其最简单的形式中，它按给定顺序打印所有参数，并在每个参数之间插入一个空格。\n\n![](img/6e45221a8147f2442c653a3d4a866570_52_0.png)\n\
  \n```\nprint(arguments)\n```\n\nPython 2.0 有一个 **print** 语句，功能相同，但不使用括号。\n\n**print**\
  \ 函数有一些可以通过名称输入的特殊参数。\n\n- **sep**=_string_ 指定一个分隔符字符串，用于替代默认分隔符（即一个空格）。如果你选择，这可以是一个空字符串：sep='\
  \ '。\n- **end**=_string_ 指定在打印完最后一个参数后打印什么（如果有的话）。默认值为换行符。如果你不想打印换行符，请将此参数设置为空字符串或其他字符串，例如\
  \ end=' '。\n\n有了这些基本函数——**input** 和 **print**——你就可以创建一个完整的 Python 脚本。例如，你可以将以下语句输入到文本文件中，并将其作为脚本运行。\n\
  \n> Click here to view code image\n\n```\nside1 = float(input('Enter length of a\
  \ side: '))\nside2 = float(input('Enter another length: '))\nhyp = ((side1 * side1)\
  \ + (side2 * side2)) ** 0.5\nprint('Length of hypotenuse is:', hyp)\n```\n\n## 1.7\
  \ 函数定义\n\n在 Python 交互式开发环境中，如果你先将程序作为函数定义（例如 `main`）输入，然后再调用该函数，可以更轻松地输入程序。Python\
  \ 提供 `def` 关键字用于定义函数。\n\nClick here to view code image\n\n```\ndef main():\n   \
  \ side1 = float(input('Enter length of a side:\n' ))\n    side2 = float(input('Enter\
  \ another length: '))\n    hyp = (side1 * side1 + side2 * side2) ** 0.5\n    print('Length\
  \ of hypotenuse is: ', hyp)\n```\n\n请注意，第一行必须按以下方式输入。`def` 关键字、括号和冒号（`:`）是严格要求的。\n\
  \n```\ndef main():\n```\n\n如果你在 IDLE 中正确输入此内容，环境会自动为你缩进后续行。保持此缩进。如果你将函数作为脚本的一部分输入，则必须选择一种缩进方案，并且必须保持一致。当你有选择时，建议使用四个空格的缩进。\n\
  \n> **Note**\n> 将制表符与实际空格混合使用可能会导致错误，即使看起来没有问题。所以要小心制表符！\n\n因为没有“开始块”和“结束块”语法，\n\
  Python 依赖缩进来知道语句块在哪里开始和结束。关键规则如下：\n\n> *\n> 在任何给定的代码块中，所有语句（即处于相同嵌套级别）的缩进必须相同。\n\
  \n例如，以下块是无效的，需要修订。\n\nClick here to view code image\n\n```\ndef main():\n    side1\
  \ = float(input('Enter length of a side:\n'))\n    side2 = float(input('Enter another\
  \ length:\n'))\n    hyp = (side1 * side1 + side2 * side2) ** 0.5\n    print('Length\
  \ of hypotenuse is: ', hyp)\n```\n\n如果你在嵌套块中有嵌套块，则每个级别的缩进必须保持一致。这是一个示例：\n\nClick\
  \ here to view code image\n\n```\ndef main():\n    age = int(input('Enter your age:\
  \ '))\n    name = input('Enter your name: ')\n    if age < 30:\n        print('Hello',\
  \ name)\n        print('I see you are less than 30.')\n        print('You are so\
  \ young.')\n```\n\n在这个函数定义中，前三个语句处于相同的嵌套级别；最后三个语句处于更深的级别。但每个级别都是一致的。\n\n尽管我们还没有讲到\
  \ **if** 语句（我们马上就要讲了），但你应该能够看到，下一个示例中的控制流与前一个示例不同。\n\nClick here to view code image\n\
  \n```\ndef main():\n    age = int(input('Enter your age: '))\n    name = input('Enter\
  \ your name: ')\n    if age < 30:\n        print('Hello', name)\nprint('I see you\
  \ are less than 30.')\nprint('You are so young.')\n```\n\n希望你能看出区别：在这个版本的函数中，最后两行不依赖于你的年龄是否小于\
  \ 30。这是因为 Python 使用缩进来确定控制流。\n\n由于最后两个语句只有在年龄小于 30 时才有意义，因此可以合理地得出结论：这个版本有一个错误。修正方法是缩进最后两个语句，使它们与第一个\
  \ **print** 语句对齐。\n\n定义函数后，你可以使用函数名后跟括号来调用该函数（即使其执行）。（如果你不包含括号，则无法成功执行函数！）\n\n```\n\
  main()\n```\n\n那么让我们回顾一下。要定义函数（即创建一种小型程序），你需要输入 def 语句，并继续输入函数中的行，直到完成——之后，输入一个空行。然后通过输入函数名后跟括号来运行函数。定义函数后，你可以随意多次执行它。\n\
  \n因此，下面的示例会话在 IDLE 环境中展示了定义函数并调用它两次的过程。为清晰起见，用户输入使用粗体显示。\n\n![](img/6e45221a8147f2442c653a3d4a866570_56_0.png)\n\
  \n```\n>>> def main():\n    side1 = float(input('Enter length of a side:\n'))\n\
  \    side2 = float(input('Enter another length: '))\n    hyp = (side1 * side1 +\
  \ side2 * side2) ** 0.5\n    print('Length of hypotenuse is: ', hyp)\n>>> main()\n\
  Enter length of a side: 3\nEnter another length: 4\nLength of hypotenuse is: 5.0\n\
  >>> main()\nEnter length of a side: 30\nEnter another length: 40\nLength of hypotenuse\
  \ is: 50.0\n```\n\n如你所见，定义函数后，你可以随意多次调用它（使其执行）。\n\nPython 的理念是这样的：因为你无论如何都应该进行这种缩进，那么为什么不让\
  \ Python 依赖缩进，从而省去你额外添加括号的工作呢？\n\n\n\n\n\n\n## 1.8 PYTHON“IF”语句\n\n与所有 Python 控制结构一样，缩进在\
  \ if 语句中很重要，第一行末尾的冒号也很重要。\n\nClick here to view code image\n\n```python\nif a >\
  \ b:\n    print('a is greater than b')\n    c = 10\n```\n\nif 语句有一个包含可选 else 子句的变体。\n\
  \nClick here to view code image\n\n```python\nif a > b:\n    print('a is greater\
  \ than b')\n    c = 10\nelse:\n    print('a is not greater than b')\n    c = -10\n\
  ```\n\nif 语句也可以有任意数量的可选 elif 子句。虽然下面的示例每个语句块只有一行，但它们可以更大。\n\nClick here to view\
  \ code image\n\n```python\nage = int(input('Enter age: '))\nif age < 13:\n    print('You\
  \ are a preteen.')\nelif age < 20:\n    print('You are a teenager.')\nelif age <=\
  \ 30:\n    print('You are still young.')\nelse:\n    print('You are one of the oldies.')\n\
  ```\n\n你不能有空语句块；要有一个不执行任何操作的语句块，请使用 **pass** 关键字。\n\n以下是语法摘要，其中方括号表示可选项，省略号表示可以重复任意次的语法部分。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_58_0.png)\n\n```python\nif condition:\n\
  \    indented_statements\n[ elif condition:\n    indented_statements]...\n[ else:\n\
  \    indented_statements]\n```\n\n## 1.9 PYTHON“WHILE”语句\n\nPython 具有一个基本结构的 **while**\
  \ 语句。（没有“do while”版本，尽管有一个可选的 **else** 子句，如第 4 章中所述。）\n\n这种限制有助于保持语法简单。**while**\
  \ 关键字创建一个循环，该循环测试条件，就像 **if** 语句一样。但是在执行缩进语句后，程序控制返回到循环顶部，并再次测试 _condition_。\n\n\
  ![](img/6e45221a8147f2442c653a3d4a866570_59_0.png)\n\n```python\nwhile condition:\n\
  \    indented_statements\n```\n\n下面是一个简单示例，打印 1 到 10 的所有数字。\n\nClick here to view\
  \ code image\n\n```python\nn = 10    # This may be set to any positive integer.\n\
  i = 1\nwhile i <= n:\n    print(i, end=' ')\n    i += 1\n```\n\n让我们尝试将这些语句输入到函数中。但这次，函数接受一个参数\
  \ _n_。每次执行时，函数可以为 _n_ 采用不同的值。\n\n```python\n>>> def print_nums(n):\n    i = 1\n\
  \    while i <= n:\n        print(i, end=' ')\n        i += 1\n\n>>> print_nums(3)\n\
  1 2 3\n>>> print_nums(7)\n1 2 3 4 5 6 7\n>>> print_nums(8)\n1 2 3 4 5 6 7 8\n```\n\
  \n应该清楚这个函数的工作原理。变量 `i` 初始为 1，并且每次执行循环时增加 1。只要 `i` 等于或小于 `n`，循环就会再次执行。当 `i` 超过 `n`\
  \ 时，循环停止，不再打印任何值。\n\n可选地，**break** 语句可用于退出最近的封闭循环。而 **continue** 语句可用于立即继续循环的下一次迭代（转到循环顶部），但不像\
  \ **break** 那样退出。\n\n![](img/6e45221a8147f2442c653a3d4a866570_60_0.png)\n\n```python\n\
  break\n```\n\n例如，可以使用 **break** 退出原本无限的循环。**True** 是一个关键字，与 Python 中的所有单词一样，区分大小写。大小写很重要。\n\
  \nClick here to view code image\n\n```python\nn = 10    # Set n to any positive\
  \ integer.\ni = 1\nwhile True: # Always executes!\n    print(i)\n    if i >= n:\n\
  \        break\n    i += 1\n```\n\n注意 `i += 1` 的用法。如果你一直在注意，这意味着与以下内容相同：\n\nClick\
  \ here to view code image\n\n```python\ni = i + 1 # Add 1 to the current value and\
  \ reassign.\n```\n\n## 1.10 两个酷炫的小应用\n\n到此为止，你可能会想，如果这些语法什么都不做，那有什么用？但是，如果你一直在跟随学习，你已经掌握了足够的知识来做很多事情。本节展示了两个很酷的小应用程序，它们能做一些令人印象深刻的事情……尽管我们需要添加一些功能。\n\
  \n以下是一个打印斐波那契数列任意数量项的函数：\n\n```python\ndef pr_fibo(n):\n    a, b = 1, 0\n    while\
  \ a < n:\n        print(a, sep=' ')\n        a, b = a + b, a\n```\n\n你可以通过在 IDLE\
  \ 中运行它，或在其下方添加这些模块级行，将其变成一个完整的程序：\n\n```python\nn = int(input('Input n: '))\npr_fibo(n)\n\
  ```\n\n顺便说一句，新功能包含在函数定义的以下行中：\n\n```python\na, b = 1, 0\na, b = a + b, a\n```\n\n\
  这两个语句是 _元组赋值_ 的示例，我们将在后面的章节中再次讨论。本质上，它允许一组值用作输入，一组变量用作输出，而不会相互干扰。这些赋值可以写成\n\n```python\n\
  a = 1\nb = 0\n...\ntemp = a\na = a + b\nb = temp\n```\n\n简单来说，`a` 和 `b` 分别初始化为 1\
  \ 和 0。然后，稍后，`a` 被设置为总和 `a + b`，同时，`b` 被设置为 `a` 的旧值。\n\n第二个应用（自己试试！）是一个完整的计算机游戏。它秘密地在\
  \ 1 到 50 之间选择一个随机数，然后要求你，玩家，通过反复猜测来找到答案。\n\n程序首先使用 **random** 包；我们将在第 11 章中介绍更多关于该包的信息。目前，按所示输入前两行，知道它们将在书中后面解释。\n\
  \nClick here to view code image\n\n```python\nfrom random import randint\nn = randint(1,\
  \ 50)\nwhile True:\n    ans = int(input('Enter a guess: '))\n    if ans > n:\n \
  \       print('Too high! Guess again. ')\n    elif ans < n:\n        print('Too\
  \ low! Guess again. ')\n    else:\n        print('Congrats! You got it!')\n    \
  \    break\n```\n\n要运行，将所有这些输入到 Python 脚本中（从文件菜单中选择新建），然后像往常一样从运行菜单中选择运行模块。祝你玩得开心。\n\
  \n## 1.11 Python 布尔运算符摘要\n\n布尔运算符返回特殊值 **True** 或 **False**。请注意，逻辑运算符 **and** 和\
  \ **or** 使用短路逻辑。表 1.2 总结了这些运算符。\n\n## 表 1.2. Python 布尔和比较运算符\n\n| 运算符 | 含义 | 计算结果\
  \ |\n|---|---|---|\n| == | 测试相等 | True 或 False |\n| != | 测试不相等 | True 或 False |\n\
  | > | 大于 | True 或 False |\n| < | 小于 | True 或 False |\n| >= | 大于或等于 | True 或 False\
  \ |\n| <= | 小于或等于 | True 或 False |\n| and | 逻辑“与” | 第一个或第二个操作数的值 |\n| or | 逻辑“或”\
  \ | 第一个或第二个操作数的值 |\n| not | 逻辑“非” | True 或 False，反转其单个操作数的值 |\n\n表 1.2 中的所有运算符都是二元运算符——也就是说，它们接受两个操作数——除了\
  \ `not`，它接受一个操作数并反转其逻辑值。以下是一个示例：\n\nClick here to view code image\n\n```python\n\
  if not (age > 12 and age < 20):\n    print('You are not a teenager.')\n```\n\n顺便说一句，另一种写法——使用\
  \ Python 快捷方式——是写以下内容：\n\nClick here to view code image\n\n```python\nif not (12\
  \ < age < 20):\n    print('You are not a teenager.')\n```\n\n据我所知，这是一个独特的 Python\
  \ 编码快捷方式。至少在 Python 3.0 中，这个示例不仅有效，而且在 `if` 和 `not` 关键字后面甚至不需要括号，因为逻辑 `not` 作为运算符具有低优先级。\n\
  \n## 1.12 函数参数和返回值\n\n函数语法足够灵活，可以支持多个参数和多个返回值。\n\n![](img/6e45221a8147f2442c653a3d4a866570_65_0.png)\n\
  \n```python\ndef function_name(arguments):\n    indented_statements\n```\n\n在此语法中，_arguments_\
  \ 是参数名称列表，如果有多个，则用逗号分隔。以下是 **return** 语句的语法：\n\n```python\nreturn value\n```\n\n\
  你也可以返回多个值：\n\n```python\nreturn value, value ...\n```\n\n最后，你可以省略返回值。如果你这样做，效果与语句\
  \ **return None** 相同。\n\nClick here to view code image\n\n```python\nreturn    \
  \ # Same effect as return None\n```\n\n执行 **return** 语句会导致立即退出并返回到函数的调用者。到达函数末尾会导致隐式返回——默认返回\
  \ **None**。（因此，使用 **return** 完全是可选的。）\n\n从技术上讲，Python 参数传递更接近“按引用传递”而不是“按值传递”；然而，它两者都不完全是。当一个值传递给\
  \ Python 函数时，该函数接收到对命名数据的引用。但是，每当函数为参数变量赋予新值时，它就会断开与传递的原始变量的连接。\n\n因此，以下函数不会按你可能期望的方式工作。它不会更改传递给它的变量的值。\n\
  \n\n\n\n\n```python\ndef double_it(n):\n    n = n * 2\n\nx = 10\ndouble_it(x)\n\
  print(x)    # x is still 10!\n```\n\n乍一看，这似乎是一个局限，因为有时程序员需要创建多个“输出”参数。\n然而，你可以在\
  \ Python 中直接返回多个值来实现这一点。调用语句必须期望接收这些值。\n\n```python\ndef set_values():\n    return\
  \ 10, 20, 30\na, b, c = set_values()\n```\n\n变量 a、b 和 c 分别被设置为 10、20 和 30。\n\n由于\
  \ Python 没有数据声明的概念，Python 中的参数列表只是一系列用逗号分隔的名称——除了每个名称可以选择性地指定一个默认值。以下是一个带有两个参数但没有默认值的函数定义示例：\n\
  \n```python\ndef calc_hyp(a, b):\n    hyp = (a * a + b * b) ** 0.5\n    return hyp\n\
  ```\n\n这些参数在没有类型声明的情况下列出；Python 函数不进行类型检查，除非你自己进行类型检查！（不过，你可以使用 type 或 isinstance\
  \ 函数来检查变量的类型。）\n\n虽然参数没有类型，但它们可以被赋予默认值。\n\n使用默认值使你能够编写一个函数，在该函数中并非所有参数都必须在每次函数调用时都指定。默认参数具有以下形式：\n\
  \n```python\nargument_name = default_value\n```\n\n例如，以下函数打印一个值多次，但默认打印次数为 1：\n\n\
  ```python\ndef print_nums(n, rep=1):\n    i = 1\n    while i <= rep:\n        print(n)\n\
  \        i += 1\n```\n\n这里，rep 的默认值为 1；因此，如果最后一个参数没有给出值，则它被赋值为 1。因此，此函数调用将数字 5 打印一次：\n\
  \n```python\nprint_nums(5)\n```\n\n输出如下：\n\n```\n5\n```\n\n> Note\n> 因为刚才所示的函数使用\
  \ n 作为参数名，自然会认为 n 必须是一个数字。然而，由于 Python 没有变量或参数声明，没有什么强制执行这一点；n 同样可以被传递一个字符串。\n>\
  \ 但是，Python 中的数据类型会有后果。在这种情况下，如果你向第二个参数 rep 传递一个非数字，可能会出现问题。这里传递的值会反复与一个数字进行比较，因此如果给出了这个值，它需要是数字。否则，将引发一个表示运行时错误的异常。\n\
  \n默认参数，如果出现在函数定义中，必须位于所有其他参数之后。\n另一个特殊功能是使用命名参数。这些不应与默认值混淆，默认值是一个独立的问题。默认参数是在函数定义中指定的。命名参数是在函数调用期间指定的。\n\
  一些示例应该能澄清这一点。通常，参数值按给定的顺序分配给参数。例如，假设一个函数被定义为有三个参数：\n\n```python\ndef a_func(a, b,\
  \ c):\n    return (a + b) * c\n```\n\n但以下函数调用直接指定了 c 和 b，将第一个参数留给 a，根据其位置分配。\n\n\
  Click here to view code image\n\n```python\nprint(a_func(4, c = 3, b = 2))\n```\n\
  \n此函数调用的结果是打印值 18。值 3、4 和 2 被按无序分配，因此 `a`、`b` 和 `c` 分别得到 4、2 和 3。\n\n如果使用命名参数，它们必须位于参数列表的末尾。\n\
  \n# 1.13 前向引用问题\n\n在大多数计算机语言中，每个程序员都必须处理一个令人恼火的问题：前向引用问题。问题在于：我应该以什么顺序定义我的函数？\n\n\
  这是一个问题，因为一般规则是函数必须在调用之前存在。在某种程度上，它与变量的规则类似，即变量必须在用于计算值之前存在。\n\n那么，你如何确保每个函数都存在——即必须已定义——在你调用它之前？如果，天哪，你有两个需要互相调用的函数怎么办？如果你遵循两条规则，这个问题很容易解决：\n\
  \n- 在调用任何函数之前，先定义所有函数。\n- 然后，在源文件的末尾，放入你的第一个模块级函数调用。（模块级代码是指位于任何函数之外的代码。）\n\n这个解决方案之所以有效，是因为\
  \ def 语句创建一个可调用对象作为函数，但尚未执行它。因此，如果 funcA 调用 funcB，你可以先定义 funcA——只要在执行 funcA 时，funcB\
  \ 也已定义。\n\n# 1.14 Python 字符串\n\nPython 有一个文本字符串类 `str`，它使你能够使用可打印文本字符。该类具有许多内置功能。如果你想获取它们的列表，请在\
  \ IDLE 中输入以下内容：\n\n```\n>>> help(str)\n```\n\n你可以使用多种引号来指定 Python 字符串。唯一的规则是它们必须匹配。在内部，引号不作为字符串本身的一部分存储。这是一个编码问题；表示某些字符串的最简单方法是什么？\n\
  \nClick here to view code image\n\n```\ns1 = 'This is a string.'\ns2 = \"This is\
  \ also a string.\"\ns3 = '''This is a special literal quotation string.'''\n```\n\
  \n最后一种形式——使用三个连续引号来界定字符串——创建一个文本引用字符串。你也可以重复三个双引号来达到相同的效果。\n\nClick here to view\
  \ code image\n\n```\ns3 = \"\"\"This is a special literal\nquotation string.\"\"\
  \"\n```\n\n如果字符串由单引号界定，你可以轻松嵌入双引号。\n\nClick here to view code image\n\n```\ns1 =\
  \ 'Shakespeare wrote \"To be or not to be.\"'\n```\n\n但是，如果字符串由双引号界定，你可以轻松嵌入单引号。\n\
  \nClick here to view code image\n\n```\ns2 = \"It's not true, it just ain't!\"\n\
  ```\n\n你可以打印这两个字符串。\n\n```\nprint(s1)\nprint(s2)\n```\n\n这将产生以下输出：\n\nClick here\
  \ to view code image\n\n```\nShakespeare wrote \"To be or not to be.\"\nIt's not\
  \ true, it just ain't!\n```\n\n文本引用语法的好处是它使你能够嵌入两种引号，以及嵌入换行符。\n\nClick here to view\
  \ code image\n\n```\n'''You can't get it at \"Alice's Restaurant.\"'''\n```\n\n\
  或者，你可以通过使用反斜杠 (\\) 作为转义字符来将嵌入引号放入字符串中。\n\nClick here to view code image\n\n```\n\
  s2 = 'It\\'s not true, it just ain\\'t!'\n```\n\n第 2 章“高级字符串功能”提供了对字符串功能的几乎详尽的介绍。\n\
  \n你可以在 Python 中解构字符串，就像在 Basic 或 C 中一样，通过索引单个字符，使用从 0 到 N–1 的索引，其中 N 是字符串的长度。以下是一个示例：\n\
  \n```\ns = 'Hello'\ns[0]\n```\n\n这将产生\n\n```\n'H'\n```\n\n但是，你不能为现有字符串中的字符赋予新值，因为\
  \ Python 字符串是不可变的：它们不能被更改。\n\n那么，如何构建新字符串呢？你可以通过结合使用连接和赋值来实现。以下是一个示例：\n\n```\ns1\
  \ = 'Abe'\ns2 = 'Lincoln'\ns1 = s1 + ' ' + s2\n```\n\n在这个示例中，字符串 s1 最初的值为 'Abe'，但最终它包含\
  \ 'Abe Lincoln'。\n此操作是允许的，因为变量只是一个名称。因此，你可以通过连接来“修改”字符串，而不会实际违反字符串的不可变性。为什么？这是因为每个赋值在变量和数据之间创建一个新的关联。以下是一个示例：\n\
  \n```\nmy_str = 'a'\nmy_str += 'b'\nmy_str += 'c'\n```\n\n这些语句的效果是创建字符串 'abc' 并将其（或者更准确地说，重新赋值）分配给变量\
  \ my_str。尽管表面上看，没有字符串数据被实际修改。这个示例中实际发生的是，名称 my_str 被反复使用，用来命名一个越来越大的字符串。\n你可以这样想：每条语句都会创建一个更大的字符串，然后将其分配给名称\
  \ my_str。\n在处理 Python 字符串时，还有一条重要的规则需要牢记：在 Python 中索引字符串会产生一个单个字符。在 Python 中，单个字符不是一个单独的类型（如在\
  \ C 或 C++ 中），而只是一个长度为 1 的字符串。The\n\n\n\n\n\n## 1.15 PYTHON LISTS (AND A COOL SORTING\
  \ APP)\n\nPython 最常用的集合类称为 _list_ 集合，它非常灵活且功能强大。\n\n![](img/6e45221a8147f2442c653a3d4a866570_75_0.png)\n\
  \n```\n[ items ]\n```\n\n这里的方括号是字面意思，而 _items_ 是零个或多个项目的列表，如果有多个项目，则用逗号分隔。下面是一个示例，表示夏季周末的一系列华氏度高温：\n\
  \n```\n[78, 81, 81]\n```\n\n列表可以包含任何类型的对象（包括其他列表！），并且与 C 或 C++ 不同，Python 允许你混合类型。例如，你可以有字符串列表：\n\
  \nClick here to view code image\n\n```\n[ 'John', 'Paul', 'George', 'Ringo' ]\n\
  ```\n\n你还可以有混合类型的列表：\n\n```\n['John', 9, 'Paul', 64 ]\n```\n\n但是，在 Python 3.0 中，具有混合类型的列表不能自动排序，而排序是一个重要功能。与其他一些\
  \ Python 集合类（字典和集合）不同，列表中的顺序很重要，并且允许重复值。但是，正是内置功能的长列表（全部在第 3 章中介绍）使 Python 列表非常出色。在本节中，我们使用两个功能：**append**，它动态地向列表添加元素，以及前面提到的\
  \ **sort** 功能。\n\n下面是一个简洁的小程序，展示了 Python 列表排序功能。将以下内容输入 Python 脚本并运行它。\n\n```\n\
  a_list = []\n\nwhile True:\n    s = input('Enter name: ')\n    if not s:\n     \
  \   break\n    a_list.append(s)\na_list.sort()\nprint(a_list)\n```\n\n哇，这太短了！但它有效吗？下面是一个示例会话：\n\
  Click here to view code image\n\n```\nEnter name: John\nEnter name: Paul\nEnter\
  \ name: George\nEnter name: Ringo\nEnter name: Brian\nEnter name:\n['Brian', 'George',\
  \ 'John', 'Paul', 'Ringo']\n```\n\n看到了什么吗？Brian（我相信他是经理）被添加到组中，现在所有人都按字母顺序打印出来。\n\
  \n你应该看到，这个小程序提示用户一次输入一个名字；每输入一个名字，它就通过 **append** 方法添加到列表中。最后，当输入空字符串时，循环中断。之后，它被排序并打印。\n\
  \n## 1.16 THE “FOR” STATEMENT AND RANGES\n\n当你查看上一节中的应用程序时，你可能会想知道是否有一种更优雅的方法，或者至少是一种更灵活的方法，来打印列表的内容。是的，有。在\
  \ Python 中，`for` 语句的中心（虽然不是唯一）目的是遍历集合并对每个元素执行相同的操作。\n\n其中一种用法是打印每个元素。上一节应用程序的最后一行可以替换为以下内容，让你更好地控制如何打印输出。\n\
  \n```\nfor name in a_list:\n    print(name)\n```\n\n现在输出是\n\n```\nBrian\nGeorge\n\
  John\nPaul\nRingo\n```\n\n在示例 **for** 语句中，_iterable_ 最常是一个集合，例如列表，但也可以是对 **range**\
  \ 函数的调用，它是一个生成器，用于生成一系列值的迭代。（你将在第 4 章中了解更多关于生成器的内容。）\n\n![](img/6e45221a8147f2442c653a3d4a866570_78_0.png)\n\
  \n```\nfor var in iterable:\n    indented_statements\n```\n\n请再次注意缩进的重要性，以及冒号 (:)。\n\
  \n值以类似于函数参数传递的方式发送到 **for** 循环。因此，给循环变量赋值对原始数据没有影响。\n\n```\nmy_lst = [10, 15, 25]\n\
  for thing in my_lst:\n    thing *= 2\n```\n\n看起来这个循环应该将 my_lst 的每个元素加倍，但它没有。要以这种方式处理列表，原地更改值，有必要使用索引。\n\
  \n```\nmy_lst = [10, 15, 25]\nfor i in [0, 1, 2]:\n    my_lst[i] *= 2\n```\n\n这产生了预期的效果：将\
  \ my_lst 的每个单独元素加倍，因此现在列表数据是 [20, 30, 50]。\n\n要以这种方式索引列表，你需要创建一个形式为\n\n```\n0, 1,\
  \ 2, ... N-1\n```\n\n的索引序列，其中 N 是列表的长度。你可以通过使用 **range** 函数来自动生成这样的索引序列。例如，要将长度为\
  \ 5 的数组中的每个元素加倍，请使用此代码：\n\nClick here to view code image\n\n```\nmy_lst = [100,\
  \ 102, 50, 25, 72]\nfor i in range(5):\n    my_lst[i] *= 2\n```\n\n这段代码片段不是最优的，因为它将列表长度（即\
  \ 5）硬编码到代码中。下面是编写此循环的更好方法：\n\nClick here to view code image\n\n```\nmy_lst = [100,\
  \ 102, 50, 25, 72]\nfor i in range(len(my_lst)):\n    my_lst[i] *= 2\n```\n\n执行此循环后，my\\\
  _lst 包含 [200, 204, 100, 50, 144]。\n\n**range** 函数生成一系列整数，如表 1.3 所示，具体取决于你指定一个、两个还是三个参数。\n\
  \n# Table 1.3. Effects of the Range Function\n\n| Syntax | Effect |\n|--------|--------|\n\
  | `range(end)` | 生成一个从 0 开始，直到但不包括 `end` 的序列。 |\n| `range(beg, end)` | 生成一个从 `beg`\
  \ 开始，直到但不包括 `end` 的序列。 |\n| `range(beg, end, step)` | 生成一个从 `beg` 开始，直到但不包括 `end`\
  \ 的序列；但是，元素每次增加 `step` 的值。如果 `step` 为负，则 range 倒计时。 |\n\n**range** 的另一个用途是创建一个遍历一系列整数的循环。例如，下面的循环计算一个阶乘数。\n\
  \nClick here to view code image\n\n```\nn = int(input('Enter a positive integer:\
  \ '))\nprod = 1\nfor i in range(1, n + 1):\n    prod *= i\nprint(prod)\n```\n\n\
  这个循环之所以有效，是因为 `range(1, n + 1)` 生成从 1 开始，直到但不包括 `n + 1` 的整数。因此，这个循环的效果是执行以下计算：\n\
  \n```\n1 * 2 * 3 * ... n\n```\n\n## 1.17 TUPLES\n\nPython 中的 _tuple_ 概念与列表密切相关；如果说有什么不同的话，元组的概念甚至更基本。下面的代码返回一个整数列表：\n\
  \n```\ndef my_func():\n    return [10, 20, 5]\n```\n\n此函数以列表形式返回值。\n\n```\nmy_lst\
  \ = my_func()\n```\n\n但是，下面的代码返回一系列简单的值，实际上返回一个元组：\n\n```\ndef a_func():\n    return\
  \ 10, 20, 5\n```\n\n它可以这样调用：\n\n```\na, b, c = a_func()\n```\n\n请注意，即使元组为了清晰起见被括在括号中，它仍然是一个元组。\n\
  \nClick here to view code image\n\n```\nreturn (10, 20, 5)  # Parens have no effect\
  \ in\n                    # this case.\n```\n\n元组和列表的基本属性几乎相同：每个都是有序集合，允许任意数量的重复值。\n\
  \n但是，与列表不同，元组是不可变的；元组值不能原地更改。元组不支持列表支持的所有方法或函数；特别是，元组不支持任何修改元组内容的方法。\n\n## 1.18\
  \ DICTIONARIES\n\nPython _dictionary_ 是一个包含一系列键值对关联的集合。与列表不同，字典使用花括号指定，而不是方括号。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_83_0.png)\n\nClick here to view code\
  \ image\n\n```\n{ key1: value1, key2: value2, ... }\n```\n\n用大白话说，字典就像数据库中的一个平面的两列表。它缺乏现代数据库管理系统的高级功能；它只是一个表。但它仍然可以作为\
  \ Python 程序中的丰富数据存储对象。\n\n字典的键是一系列唯一的值；键不能重复。对于每个键，都有一个关联的数据对象，称为值。例如，你可以按以下方式创建一个用于给一班学生评分的字典：\n\
  \nClick here to view code image\n\n```\ngrade_dict = { 'Bob':3.9, 'Sue':3.9, 'Dick':2.5\
  \ }\n```\n\n此语句创建一个包含三个条目的字典——字符串“Bob”、“Sue”和“Dick”——它们分别具有关联值 3.9、3.9 和 2.5。请注意，重复值\
  \ 3.9 完全没问题，因为它不是键。\n\n像往常一样，grade_dict 只是一个名称，你可以给字典起几乎任何你想要的名称（只要名称遵守前面列出的规则）。我选择\
  \ grade_dict 这个名称，因为它暗示了这个对象是什么。\n\n创建字典后，你可以随时通过类似下面的语句添加一个值：\n\n\n\n\n\n这条语句添加键“Bill\
  \ G”并将其与值 4.0 关联。这些数据会被添加到名为 grade_dict 的字典中。如果键“Bill G”已经存在，该语句仍然有效；但它的效果是替换与“Bill\
  \ G”关联的值，而不是将 Bill 作为新条目添加。\n\n你可以打印或以其他方式引用字典中的值，使用类似下面的语句。注意它的作用：它使用字符串（“Bill\
  \ G”）作为键，一种索引值，来查找与该键关联的数据。\n\nClick here to view code image\n\n```python\nprint(grade_dict['Bill\
  \ G']) # Print the value 4.0\n```\n\n请注意，你可以从空字典开始，然后向其中添加数据。\n\n```python\ngrade_dict\
  \ = { }\n```\n\n为字典选择类型时，还适用以下规则：\n\n- 在 Python 3.0 版本中，所有键必须共享相同的类型，或者至少是兼容的类型，例如整数和浮点数，这些类型可以进行比较。\n\
  - 键类型应该是不可变的（即无法“原地”更改的数据）。字符串和元组是不可变的，但列表不是。\n- 因此，像 [1, 2] 这样的列表不能用作键，但像 (1, 2)\
  \ 这样的元组可以。\n- 值可以是任何类型；但是，如果可能，为所有值对象使用相同的类型通常是个好主意。\n\n有一点需要注意。如果你尝试获取特定键的值，而该键不存在，Python\
  \ 会引发异常。为了避免这种情况，请使用 **get** 方法来确保指定的键存在。\n\n![](img/6e45221a8147f2442c653a3d4a866570_85_0.png)\n\
  \nClick here to view code image\n\n```python\ndictionary.get(key [,default_value])\n\
  ```\n\n在此语法中，方括号表示可选项。如果 _key_ 存在，则返回字典中对应的值。否则，如果指定了 _default_value_，则返回该值；如果没有这样的默认值，则返回\
  \ **None**。第二个参数使你能够编写高效的直方图代码，例如下面的代码，用于统计单词频率。\n\nClick here to view code image\n\
  \n```python\ns = (input('Enter a string: ')).split()\nwrd_counter = {}\nfor wrd\
  \ in s:\n    wrd_counter[wrd] = wrd_counter.get(wrd, 0) + 1\n```\n\n这个示例的作用如下：当它找到一个新单词时，该单词会被加入字典，值为\
  \ 0 + 1，即 1。如果找到一个已存在的单词，则由 `get` 返回该单词的频率，然后在其基础上加 1。因此，如果找到某个单词，其频率计数将加 1。如果未找到该单词，则将其添加到字典中，起始计数为\
  \ 1。这正是我们想要的。\n\n在此示例中，字符串类的 `split` 方法被用于将字符串分割为单个单词的列表。有关 `split` 的更多信息，请参见第 2.12\
  \ 节，“使用 ‘split’ 分解输入”。\n\n## 1.19 集合\n\n_集合_ 与字典类似，但没有关联的值。实际上，集合只是一组唯一的键，这使得集合与列表在以下方面有所不同：\n\
  \n- 所有成员必须唯一。尝试将现有值添加到集合中会被简单地忽略。\n- 所有成员都应该是不可变的，与字典键一样。\n- 顺序永远无关紧要。\n\n例如，考虑以下两个集合定义：\n\
  \nClick here to view code image\n\n```python\nb_set1 = { 'John', 'Paul', 'George',\
  \ 'Pete' }\nb_set2 = { 'John', 'George', 'Pete', 'Paul' }\n```\n\n这两个集合被认为完全相等，以下两个集合也是如此：\n\
  \n```python\nset1 = {1, 2, 3, 4, 5}\nset2 = {5, 4, 3, 2, 1}\n```\n\n创建集合后，可以使用 **add**\
  \ 和 **remove** 方法来操作其内容。例如：\n\n```python\nb_set1.remove('Pete')\nb_set1.add('Ringo')\n\
  ```\n\n（你是不是总是为 Pete 感到难过？）\n\n请注意，创建新集合时，不能简单地使用一对空花括号，因为该语法用于创建空字典。相反，请使用以下语法：\n\
  \n```python\nmy_set = set()\n```\n\n集合集合还支持 **union** 和 **intersection** 方法，以及使用以下运算符：\n\
  \nClick here to view code image\n\n```python\nsetA = {1, 2, 3, 4}\nsetB = {3, 4,\
  \ 5}\nsetUnion = setA | setB    # Assign {1, 2, 3, 4, 5}\nsetIntersect = setA &\
  \ setB  # Assign {3, 4}\nsetXOR = setA ^ setB    # Assign {1, 2, 5}\nsetSub = setA\
  \ - setB    # Assign {1, 2}\n```\n\n在这些示例中，`setUnion` 和 `setIntersect` 分别是并集和交集操作的结果。`setXOR`\
  \ 是异或操作的结果；它包含出现在一个集合或另一个集合中但不同时出现在两个集合中的所有元素。`setSub` 包含在第一个集合中（在此例中为 `setA`）但不在第二个集合中（`setB`）的元素。附录\
  \ C，“集合方法”列出了 `set` 类支持的所有方法，并为其中大多数方法提供了示例。\n\n## 1.20 全局变量和局部变量\n\nPython 变量可以是全局变量或局部变量，与其他语言一样。一些程序员不鼓励使用全局变量，但当你需要它们时，你就需要它们。什么是\
  \ _全局变量_？它是一个在函数调用之间保留其值且对所有函数可见的变量。因此，在一个函数中对 `my_global_var` 的更改会反映到另一个函数中的 `my_global_var`\
  \ 的值。\n\n如果在函数定义中引用变量 `x`，则使用 `x` 的局部版本——前提是该变量在局部级别存在。否则，如果存在全局版本的变量，则使用全局版本。\n\
  \n_局部作用域_，与全局作用域相对，意味着对变量的更改不会影响函数定义外部同名变量。在这种情况下，该变量是私有的。但全局变量在所有地方都可见。\n\n例如，以下语句创建了两个版本的\
  \ count：一个局部版本和一个全局版本。但默认情况下，函数使用其自身（局部）版本的变量。\n\nClick here to view code image\n\
  \n```python\ncount = 10\ndef funcA() :\n    count = 20\n    print(count) # Prints\
  \ 20, a local value.\n\ndef funcB() :\n    print(count) # Prints 10, the global\
  \ value.\n```\n\n你看到这是如何工作的吗？示例中的第一个函数使用其自身的局部版本的 count，因为该变量是在该函数内创建的。\n\n但是第二个函数\
  \ funcB 没有创建这样的变量。因此，它使用全局版本，该版本是在示例的第一行创建的（count = 10）。\n\n困难在于，当你想要引用变量的全局版本，但将其作为赋值语句的目标时。Python\
  \ 没有数据声明的概念，因此添加赋值语句的效果是创建一个新变量。这是一个问题，因为当它创建变量时，默认情况下，如果变量在函数内部，则该变量将是局部变量。\n\n\
  例如，假设你希望 funcB 更改 count 的值。你可以这样做，但现在 funcB 只引用其自身的 count 的私有副本。如果你依赖函数来更改在所有地方都被识别的\
  \ count 的值，那你就没办法了。\n\n```python\ndef funcB():\n    count = 100  # count now is\
  \ local, no effect\n                  # on global version of count.\n    print(count)\
  \  # Prints 100, the local value.\n```\n\n解决方案是使用 **global** 语句。该语句告诉 Python 避免使用变量的局部版本；因此它必须引用全局版本，假设它存在。这是一个示例：\n\
  \n```python\ncount = 10    # Variable created as global.\n\ndef my_func():\n   \
  \ global count\n    count += 1\n\nmy_func()    # Call my_func.\nprint(count)  #\
  \ Prints 11.\n```\n\n现在，调用 my_func 会导致 count 的值被更改，并且这会影响函数本身之外的程序代码，如你所见。如果 my_func\
  \ 引用了 count 的局部副本，那么它将对函数外部的 count 没有影响。\n\n**global** 语句本身不会创建任何东西；你需要一个赋值来完成。在前面的示例中，count\
  \ 是在函数定义之前的语句中创建的。_模块级代码_，由函数和类定义之外的所有语句组成，使你能够创建全局\n\n\n\nvariables. But so does\
  \ the following code, which—upon being executed—creates a variable `foo` if it does\
  \ not already exist.\n\n单击此处查看代码图片\n\n```python\ndef my_func():\n    global foo\n\
  \    foo = 5     # Create foo if it does not already\n                # exist (as\
  \ a global).\n    print(foo)\n```\n\nAssuming `foo` does not already exist, the\
  \ effect of this function is to create `foo` and set it to 5. It cannot be created\
  \ as a local—because of the statement **global `foo`**—and therefore `foo` is created\
  \ as a global variable. This works even though the assignment to `foo` is not part\
  \ of module-level code.\n\nIn general, there is a golden rule about global and local\
  \ variables in Python. It’s simply this:\n\n> If there’s any chance that a function\
  \ might attempt to assign a value to a global variable, use the `global` statement\
  \ so that it’s not treated as local.\n\n## 第 1 章总结\n\n第 1 章介绍了 Python 的基础知识，但不包括类定义、集合的高级操作以及库中专门的部分（例如文件操作）。此处介绍的信息足以编写许多\
  \ Python 程序。\n\n恭喜你！如果你理解了本章的所有内容，你就已经踏上成为熟练 Python 程序员的道路了。接下来的几章将深入探讨列表和字符串的细节，这是两种最重要的集合类型。\n\

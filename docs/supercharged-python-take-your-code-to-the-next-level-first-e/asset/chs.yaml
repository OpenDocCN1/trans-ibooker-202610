  \n```\nimport array\n```\n\nThis package, along with all the other packages introduced\
  \ in this chapter, deals with arrays in the strict C and C++ sense, instead of lists.\n\
  \nSo what are these things called “arrays”?\n\nLike a list, an *array* is an ordered\
  \ collection in memory in which elements can be referred to by index number. But\
  \ unlike lists, arrays are assumed to contain fixed-length data. Data is contiguous,\
  \ meaning that all elements are placed next to each other in memory.\n\nFigure 12.1.\
  \ helps illustrate the difference. In a Python list, a number of references are\

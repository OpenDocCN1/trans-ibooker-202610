  \ = int(wrd)\n```\n\n## 第 14 章 总结\n\n在本章中，我们探讨了在 Python 中使用 `import` 语句的各种方式，以创建可以包含任意数量源文件的多模块项目。\n\
  \n在 Python 中使用多个模块的方式与其他语言有所不同。特别是，在 Python 中，如果导入是 *单向* 的，则更安全，这意味着 `A.py` 可以导入\
  \ `B.py`，但如果是这样，`B` 不应该导入 `A`。你可以让 `A` 和 `B` 互相导入，但前提是你知道自己在做什么，并且小心不要创建相互依赖。\n\n\
  同样，你在从另一个模块导入模块级变量时也应当小心。最好使用其限定名称来引用这些变量，例如 `mod_a.x` 和 `mod_a.y`。否则，在创建该变量的模块之外对其进行任何赋值，都会导致创建一个“局部”于出现该变量的模块的新变量。\n\
  \n最后，本章完成了本书中一直在开发的 RPN 解释器应用程序的编程代码。本章添加了问号 (?) 作为非零跳转操作，比较符 (>) 以及感叹号 (!) 作为随机数生成器。添加这些操作极大地扩展了用\
  \ RPN 编写的脚本所能实现的功能。\n\n但这些添加远非最终。还有许多其他重要功能你可能希望支持，例如行标签和更好的错误检查。这些留作本章末尾的练习。\n\n\
  ## 第 14 章 复习问题\n\n- 1 是否可以使用多个 `import` 语句多次导入同一个模块？这样做的目的是什么？你能想到什么场景会有用吗？\n\n\
  - 2 模块有哪些属性？（至少列举一个。）\n\n- 3 使用循环导入——例如两个模块互相导入——可能会创建依赖关系和隐藏的错误。你如何设计程序以避免相互导入？\n\
  \n- 4 Python 中 `__all__` 的用途是什么？\n\n- 5 在什么情况下引用 `__name__` 属性或字符串 `'__main__'`\
  \ 是有用的？\n\n- 6 在使用 RPN 解释器应用程序时——它逐行解释 RPN 脚本——添加程序计数器有哪些用途？\n\n- 7 在设计一种简单的编程语言（如\
  \ RPN）时，你需要哪些最小的表达式或语句（或两者兼具）才能使该语言原始但完整——也就是说，理论上能够执行任何计算机任务？\n\n## 第 14 章 建议问题\n\
  \n- 1 目前，两个模块 `rpn.py` 和 `rpn_io.py` 之间共享了一些数据。你能否修改应用程序，将共享数据放在第三个模块 `common.py`\
  \ 中？\n\n- 2 鉴于 RPN 解释器程序的编写方式，添加操作应该很容易，尤其是当它们对应于 operator 包中定义的操作之一时。作为一个小型项目，添加以下内容：小于测试和等于测试。你最大的挑战可能是找到足够的标点字符来表示所有不同的操作符。但是，如果你修改扫描中使用的正则表达式，你可以提出双字符操作符，例如\
  \ `==` 表示等于测试。\n\n- 3 对于 RPN 脚本编写者来说，能够在脚本中添加注释将是很好的。你应该能够按照以下规则实现此功能：在 RPN 脚本的每一行中，忽略从井号\
  \ (#) 开始直到行尾的所有文本。\n\n- 4 大于测试 (**>**) 是一个布尔运算符，产生 True 或 False（1 或 0）。RPN 脚本的编写者能否在没有实际提供小于\
  \ (**<**)、AND 或 OR 运算符的情况下，产生与其他逻辑运算符相同的效果？如果你仔细想想，乘法 (**\\*** ) 完美地替代了 AND。加法 (**+**)\
  \ 也能替代 OR 吗？大部分情况下可以；但是，结果有时是 **2** 而不是 **1** 或 **0**。那么，你能否创建一个逻辑 NOT 运算符，它接受输入\
  \ **0** 并产生 **1**，但接受任何正数并产生 **0**？我们真正想问的是，你能否想到几个算术运算，当组合在一起时，能做与逻辑 OR 相同的事情？\n\
  \n- 5 RPN 脚本语言中仍然缺少的最大部分是对行标签的支持。添加这些并不特别困难，但也并非微不足道。任何以 _label_: 开头的行都应被解释为标记一行代码。为了平滑地实现此功能，你应该进行几遍扫描。第一遍应该建立一个“代码表”，排除空行并编译第二个符号表，该表存储标签及其每个标签的值；该值应为代码表中的索引。例如，0\
  \ 将表示第一行。\n\n- 6 此应用程序中的错误检查可以进一步改进。例如，你能否添加错误检查，如果操作符过多则报告语法错误？（提示：在这种情况下，栈的状态会怎样？）\n"

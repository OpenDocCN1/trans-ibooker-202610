  \ the integer type (`int`)? Containment or inheritance?\n\n\n\n\n# 第 10 章 建议问题\n\
  \n1. 编写一个程序，提示用户输入所有所需信息，然后使用元组构造一个 `Decimal` 对象。例如，以下元组将对象初始化为值 `Decimal('12.10')`：`(0,\
  \ (1, 2, 1, 0), -2)`\n\n2. 使用第 10.12 节“金钱与继承”中开始的继承方法，完成 Money 类的定义，使加法、乘法和减法都受到支持。然后编写示例代码，确保所有这些操作都能正常工作。\n\

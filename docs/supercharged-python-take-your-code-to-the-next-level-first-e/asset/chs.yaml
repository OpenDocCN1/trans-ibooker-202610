  | pickle.dumps(obj) 用于 pickle 操作。此方法返回 obj 的二进制表示，以字节形式，用于前一个方法 pickle.dump。此方法实际上不会写出对象，因此其用途有限。\
  \ |\n| pickle.load(file) 用于 pickle 操作。此方法返回之前使用 pickle.dump 方法写入文件的对象。 |\n\n请注意，pickle\
  \ 函数要求你在使用其功能之前导入 **pickle** 包。\n\n# 8.7 文本文件操作深入探讨\n\n文本文件成功打开后，你几乎可以像在控制台上读写文本一样读写它。\n\
  \n> > 注意\n> > 控制台交互由三个特殊文件支持——sys.stdin、sys.stdout 和 sys.stderr——这些文件永远不需要打开。通常不需要直接引用这些文件，但\
  \ input 和 print 函数实际上是通过与这些文件交互来工作的，尽管你通常看不到这一点。\n\n有三种方法可用于从文件读取；它们都可以用于文本文件。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_482_0.png)\n\n```python\nstr = file.read(size=-1)\n\
  str = file.readline(size=-1)\nlist = file.readlines()\n```\n\nread 方法读取文件的全部内容并将其作为单个字符串返回。如果需要，该字符串可以直接打印到屏幕上。如果有换行符，它们会嵌入到此字符串中。\n\
  \n可以指定 size 作为要读取的最大字符数。-1 的默认值会导致该方法读取整个文件。\n\n**readline** 方法读取直到第一个换行符，或者直到达到指定的\
  \ _size_（如果指定）。如果读取了换行符，它会作为字符串的一部分返回。\n\n最后，**readlines** 方法读取文件中的所有文本行，并将其作为字符串列表返回。与\
  \ **readline** 一样，读取的每个字符串（如果存在）都包含尾随换行符。（因此，所有字符串都会有换行符，最后一个除外。）\n\n有两种方法可用于向文本文件写入。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_483_0.png)\n\nClick here to view code\
  \ image\n\n```\nfile.write(str)\nfile.writelines(str | list_of_str)\n```\n\n**write**\
  \ 和 **writelines** 方法不会自动追加换行符，因此如果你想将文本作为一系列独立的行写入文件，则需要自行追加这些换行符。\n\n两种方法之间的区别在于，**write**\
  \ 方法返回写入的字符数或字节数。**writelines** 方法接受两种参数：你可以传递单个字符串或字符串列表。\n\n一个简单的示例说明了文件读取和写入之间的交互。\n\
  \nClick here to view code image\n\n```\nwith open('file.txt', 'w') as f:\n    f.write('To\
  \ be or not to be\\n')\n    f.write('That is the question.\\n')\n    f.write('Whether\
  \ tis nobler in the mind\\n')\n    f.write('To suffer the slings and arrows\\n')\n\
  \nwith open('file.txt', 'r') as f:\n    print(f.read())\n```\n\n此示例将一系列字符串作为单独的行写出，然后直接打印内容，包括换行符。\n\
  \n> Click here to view code image\n\n![](img/6e45221a8147f2442c653a3d4a866570_484_0.png)\n\
  \n使用 **readline** 或 **readlines** 读取同一文件——它们都将换行符视为分隔符——同样会读取每个字符串末尾的换行符。下面是一个一次读取一行并打印的示例。\n\
  \n> Click here to view code image\n\n```\nwith open('file.txt', 'r') as f:\n   \
  \ s = ' ' # Set to a blank space initially\n    while s:\n        s = f.readline()\n\
  \        print(s)\n```\n\n**readline** 方法返回文件中的下一行，其中“行”定义为直到下一个换行符或文件末尾的文本。只有在已达到文件末尾条件（EOF）时，它才返回空字符串。但是，**print**\
  \ 函数会自动打印一个额外的换行符，除非你使用 **end** 参数来抑制该行为。在这种情况下，输出为\n\n![](img/6e45221a8147f2442c653a3d4a866570_485_0.png)\n\
  \n```\n```\nTo be or not to be.\n\nThat is the question.\n\nWhether tis nobler in\
  \ the mind\n\nTo suffer the slings and arrows\n```\n```\n\n**print** 函数参数 `end='\
  \ '` 将避免打印额外的换行符。或者，你可以从读取的字符串中删除换行符，如下所示。\n\n![](img/6e45221a8147f2442c653a3d4a866570_485_1.png)\n\
  \n```\n```\nwith open('file.txt', 'r') as f:\n    s = ' '    # Set to a blank space,\
  \ initially\n    while s:\n        s = f.readline()\n        s = s.rstrip('\\n')\n\
  \        print(s)\n```\n```\n\n尽管这应该是一个简单的操作，但这看起来开始变得复杂。更简单的解决方案可能是使用 **readlines**\
  \ 方法（注意使用了复数形式）将整个文件读入列表，然后可以像这样读取列表。此方法也会获取尾随换行符。\n\nClick here to view code image\n\
  \n```\nwith open('file.txt', 'r') as f:\n    str_list = f.readlines()\n    for s\
  \ in str_list:\n        print(s, end='')\n```\n\n但最简单的解决方案——只要你不需要将字符串放入列表中——就是一次性读取整个文件，通过简单地调用\
  \ **read** 方法，然后打印所有内容，如前所示。\n\n# 8.8 使用文件指针（“SEEK”）\n\n如果你打开支持随机访问的文件，可以使用 **seek**\
  \ 和 **tell** 方法移动到文件中的任何位置。\n\n![](img/6e45221a8147f2442c653a3d4a866570_486_0.png)\n\
  \n```\nfile.seek(pos, orig)\nfile.seekable()\nfile.tell()\n```\n\n**seekable** 方法包含在内，以防你需要检查文件系统或设备是否支持随机访问操作。大多数文件都支持。尝试在不\n\
  \n\n\nthere being support for random access causes an exception to be raised.\n\n\
  The **seek** method is sometimes useful even in programs that don’t use random access.\
  \ When you read a file, in either text or binary mode, reading starts at the beginning\
  \ and goes sequentially forward.\n\nWhat if you want to read a file again, from\
  \ the beginning? Usually you won’t need to do that, but we’ve found it useful in\
  \ testing, in which you want to rerun the file-read operations. You can always use\
  \ **seek** to return to the beginning.\n\nClick here to view code image\n\n```\n\
  file_obj.seek(0, 0)  # Go back to beginning of the file.\n```\n\nThis statement\
  \ assumes that **file_obj** is a successfully opened file object. The first argument\
  \ is an offset. The second argument specifies the origin value 0, which indicates\
  \ the beginning of the file. Therefore, the effect of this statement is to reset\
  \ the file pointer to the beginning of the file.\n\nThe possible values for _offset_\
  \ are 0, 1, and 2, indicating the beginning, current position, and end of the file.\n\
  \nMoving the file pointer also affects writing operations, which could cause you\
  \ to write over data you’ve already written. If you move to the end of the file,\
  \ any writing operations effectively append data.\n\nOtherwise, random access is\
  \ often most useful in binary files that have a series of fixed-length records.\
  \ In that case, you can directly access a record by using its zero-based index and\
  \ multiplying by the record size:\n\nClick here to view code image\n\n```\nfile_obj.seek(rec_size\
  \ * rec_num, 0)\n```\n\nThe **tell** method is the converse of **seek**. It returns\
  \ an offset number that tells the number of bytes from the beginning of the file.\
  \ A value of 0 indicates that the beginning of the file is in fact your current\
  \ position.\n\nClick here to view code image\n\n```\nfile_pointer = file_obj.tell()\n\
  ```\n\n## 8.9 将文本读入 RPN 项目\n\n有了读写文本文件的能力，我们可以为逆波兰表示法（RPN）项目添加新功能。经过本节的更改后，你将能够打开一个由\
  \ RPN 语句组成的文本文件，逐个执行这些语句，并打印结果。\n\n在添加文本文件读取能力后，我们将朝着构建功能齐全的语言解释器迈出重要一步。\n\n###\
  \ 8.9.1 迄今为止的 RPN 解释器\n\n程序的当前版本继承自第 7 章，使用正则表达式语法和 Scanner 对象对 RPN 语句进行词法分析和解析。程序一次评估一个\
  \ RPN 语句，遇到空行时退出。\n\n针对输入的每一行 RPN，程序输入该行代码并打印该 RPN 语句的最终数值。\n\nClick here to view\
  \ code image\n\n```\nimport re\nimport operator\n\nstack = []   # Stack to hold\
  \ the values.\n\n# Scanner object. Isolate each token and take\n# appropriate action:\
  \ push a numeric value, but\n# perform\n# operation on top two elements on stack\
  \ if an\n# operator\n# is found.\nscanner = re.Scanner([\n    (r\"[ \\t\\n]\", lambda\
  \ s, t: None),\n    (r\"-?(\\d*\\.)?\\d+\", lambda s, t:\n        stack.append(float(t))),\n\
  \    (r\"\\d+\", lambda s, t: stack.append(int(t))),\n    (r\"[+]\", lambda s, t:\
  \ bin_op(operator.add)),\n    (r\"[-]\", lambda s, t: bin_op(operator.sub)),\n \
  \   (r\"[*]\", lambda s, t: bin_op(operator.mul)),\n    (r\"[/]\", lambda s, t:\
  \ bin_op(operator.truediv)),\n    (r\"[\\^]\", lambda s, t: bin_op(operator.pow)),\n\
  ])\n\n# Binary Operator function. Pop top two elements\nfrom\n# stack and push the\
  \ result back on the stack.\n\ndef bin_op(action):\n    op2, op1 = stack.pop(),\
  \ stack.pop()\n    stack.append(action(op1, op2))\n\ndef main():\n    while True:\n\
  \        input_str = input('Enter RPN line: ')\n        if not input_str:\n    \
  \        break\n        try:\n            tokens, unknown =\nscanner.scan(input_str)\n\
  \            if unknown:\n                print('Unrecognized input:',\nunknown)\n\
  \            else:\n                print(str(stack[-1]))\n        except IndexError:\n\
  \            print('Stack underflow.')\n\nmain()\n```\n\n以下是示例会话：\n\n> Click here\
  \ to view code image\n\n```\nEnter RPN line: 25 4 *\n100.0\nEnter RPN line: 25 4\
  \ * 50.75-\n49.25\nEnter RPN line: 3 3* 4 4* + .5^\n5.0\nEnter RPN line:\n```\n\n\
  每一行 RPN 代码——尽管间距不同且不一致——都能被程序正确读取和评估。例如，第三行输入（加粗部分）是勾股定理的一个示例，因为它正在计算\n\nClick here\
  \ to view code image\n\n```\nsquare_root((3 * 3) + (4 * 4))\n```\n\n的值。\n\n### 8.9.2\
  \ 从文本文件读取 RPN\n\n下一步是让程序打开一个文本文件并从中读取 RPN 语句。“语句”可以由一系列运算符和数字组成，就像前面示例中所示，但程序在评估每个语句后应该做什么呢？\n\
  \n目前，让我们采用一条简单的规则：如果要读取的文件中的某行文本为空，则不执行任何操作。但如果该行有任何输入，则执行该行 RPN 代码并打印结果，该结果应可作为\
  \ `stack[-1]`（栈顶）获得。\n\n程序的新版本如下。请注意，加粗的行表示新增或大幅修改的行。此外，`open_rpn_file` 定义是新的。\n\
  \nClick here to view code image\n\n```\nimport re\nimport operator\n\nstack = []\

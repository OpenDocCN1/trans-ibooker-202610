  \ 1.618033988749895。\n\n## 11.12 三角函数：树的高度\n\n三角函数有许多实际用途。在本节中，我们将演示一个简单的用途：计算树的高度。\n\
  \n考虑图 11.4 中所示的直角三角形。直角（90 度）是固定的，但其他两个角可以变化。我们选择离我们最近的角。根据这个角的度量，我们可以（通过三角函数）预测任意两边长度的比率。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_691_0.png)\n\n图 11.4. 直角三角形\n\n三个基本三角函数——正弦、余弦和正切——定义如下。在\
  \ Python 中，如同大多数其他编程语言和库一样，这三个函数分别实现为 sin、cos 和 tan 函数。\n\nsine(θ) = 对边 <B> / 斜边\
  \ <C>\ncosine(θ) = 邻边 <A> / 斜边 <C>\ntangent(θ) = 对边 <B> / 邻边 <A>\n\n例如，如果对边长度是邻边长度的一半，那么正切值就是\
  \ 0.5。\n\n这与树的高度有什么关系？关系很大。考虑以下场景：一名人类观察者驻守在距树底 1,000 英尺处。他不知道树的高度，但他确定到树底的距离，因为之前已经测量过。使用他可靠的六分仪，他测量了树顶相对于地平线的角度。这给了他一个角度，θ。\n\
  \n图 11.5 说明了这个场景。\n\n![](img/6e45221a8147f2442c653a3d4a866570_692_0.png)\n\n图 11.5.\
  \ 计算树的高度\n\n现在只需一点代数知识就能得出正确的公式。记住正切函数的公式。\n\ntangent(θ) = 对边 <B> / 邻边 <A>\n\n两边同时乘以\
  \ A 并重新排列，我们得到以下计算规则。\n\n对边 <B> = tangent(θ) * 邻边 <A>\n\n因此，要得到树的高度，你需要求出仰角的正切值，然后乘以到树底的距离，在此例中为\
  \ 1,000 英尺。现在编写一个计算树高的程序很容易。\n\n单击此处查看代码图像\n\n```python\nfrom math import tan, radians\n\
  ```\n\n```python\ndef get_height(dist, angle):\n    return tan(radians(angle)) *\
  \ dist\n\ndef main():\n    while True:\n        d = float(input('Enter distance\
  \ (0 to exit):'))\n        if d == 0:\n            print('Bye!')\n            break\n\
  \        a = float(input('Enter angle of elevation:'))\n        print('Height of\
  \ the tree is', get_height(d, a))\n\nmain()\n```\n\n程序的核心是执行计算的那一行：\n\n单击此处查看代码图像\n\
  \n```python\nreturn tan(radians(angle)) * dist\n```\n\n虽然这是一个简单的程序，但它确实有一个微妙之处，或者说是陷阱。所有\
  \ Python 三角函数都使用弧度。除非先将角度转换，否则它们不使用角度。一个完整圆定义为 360 度；它也定义为 2*pi 弧度。因此，如果用户要使用角度——这是大多数人在现实生活中使用的——你需要应用\
  \ math.radians 函数将角度转换为弧度（或者只需乘以 2*pi/360）。\n\n以下是示例会话：\n\n单击此处查看代码图像\n\n```\nEnter\
  \ distance (0 to exit): 1000\nEnter angle of elevation: 7.4\nHeight of the tree\
  \ is 129.87732371691982\nEnter distance (0 to exit): 800\nEnter angle of elevation:\
  \ 15\nHeight of the tree is 214.35935394489815\nEnter distance (0 to exit): 0\n\
  Bye!\n```\n\n> 注意\n> 在此示例中，我们使用了 `import` 语句语法的变体，该变体导入特定函数。如果你确定不会与导入的特定名称发生冲突，这通常是一种好的方法。\n\
  > \n> from math import tan, radians\n\n## 11.13 对数：数字猜谜游戏重访\n\n`math` 包中其他经常有用的函数是对数函数，如表\
  \ 11.5 所示。\n\n| 数据对象 | 描述 |\n|---|---|\n| `log10(` | 以 10 为底的对数。（10 需要被提升到多少次方才能产生\
  \ x？） |\n| `log2 (x )` | 以 2 为底的对数。（2 需要被提升到多少次方才能产生 x？） |\n| `log (x , base= e)`\
  \ | 使用指定底数的对数。第二个参数是可选的；默认情况下，该函数使用底数 e 查找“自然对数”。 |\n\n如果对数的概念对你已经很熟悉，请继续阅读第 11.13.2\
  \ 节，了解对数在程序中的实际用途。你可以阅读第 11.13.1 节（下一节）来了解更多关于对数的信息。\n\n### 11.13.1 对数的工作原理\n\n\
  对数是指数运算的逆运算。如果你记住这个定义，对数就不那么令人生畏了。例如，假设以下成立：\n\nbase ** exponent = amount\n\n那么，以下等式也必须成立：\n\
  \nLogarithm-of-base (amount) = exponent\n\n换句话说，对数计算的是达到某个数量所需的指数。通过一些示例更容易理解。首先，让我们假设底数为\
  \ 10。注意表 11.6 中，随着指数的增加，数量增加得有多快。\n\n| 10 提升到这个指数 | 产生这个结果 |\n|----------------------------|----------------------|\n\
  | 1 | 10 |\n| 2 | 100 |\n| 3 | 1000 |\n| 3.5 | 3162.277 |\n| 4 | 10000 |\n| 4.5\
  \ | 31622.777 |\n\n现在，要理解以 10 为底的对数，我们只需要反转列（见表 11.7）。你应该从这些表中注意到，随着数量的增加，指数增加得有多慢。对数增长非常缓慢——并且总是会被简单的线性增长超越。\n\
  \n| 取 10 的对数 | 产生这个结果 |\n|-----------------------|----------------------|\n| 10\
  \ | 1 |\n| 100 | 2 |\n| 1000 | 3 |\n| 3162.277 | 3.5（近似值） |\n| 10000 | 4 |\n| 31622.777\
  \ | 4.5（近似值） |\n\n请记住，表 11.7 中的一些结果是近似值。例如，如果你取 31,622.777 的以 10 为底的对数，你会得到一个非常接近\
  \ 4.5 的数字。\n\n### 11.13.2 将对数应用于实际问题\n\n现在让我们回到数字猜谜游戏。如果你玩几次游戏，你应该会看到有一个明显的策略，可以在少于\
  \ N 次猜测中得到答案，其中 N 是范围的大小。最糟糕的策略是从 1 开始，然后每次加 1，猜 2，依此类推，直到覆盖整个范围。\n\n平均而言，该策略需要\
  \ N/2 次猜测才能成功：如果范围是 1 到 50，则需要 25 次猜测。但采用正确的策略，你应该能做得好得多，这引出了以下问题。\n\n对于大小为 N 的范围，理想策略得到答案所需的最大步骤数是多少？\n\
  \n当 N = 3 时，最好的策略是什么？显然，你应该先猜中间的数字 2，然后下一次猜 1 或 3。这保证了你最多只需要猜两次，即使有三个值。当超过三个值时，我们可能需要再猜一次。但两次猜测对于\
  \ N = 3 就足够了。\n\n下一个“上限”应该出现在 N = 7，你应该明白为什么。这是因为你可以猜中间的值 4，然后——如果这个猜测不成功——将自己限制在前三个数字（需要再猜两次）或后三个数字（也需要再猜两次）。因此，对于\
  \ N = 7，三次猜测就足够了。\n\n如果你仔细想想，每上升一步，需要额外的猜测，可以通过在上一步将 N 加倍并加 1 来实现。例如，图 11.6 说明了当\
  \ N 从 1 增加到 3 再到 7 时，所需猜测次数如何从 1 增加到 2 再到 3。\n\n\n\n\n\nFigure 11.6. How three guesses\
  \ are needed at N = 7\n\nWe can now determine the maximum number of guesses required\
  \ at certain numbers. When N falls between these numbers, we round upward to the\
  \ next step—because to get the maximum number of guesses needed, we must assume\
  \ a worst-case scenario. Table 11.8 shows the progression.\n\n# Table 11.8. Maximum\
  \ Number of Guesses Required by the Game\n\n| Size = N | N + 1 | Number of guesses\
  \ required = log2(N+1) |\n|----------|-------|----------------------------------------|\n\
  | 1        | 2     | 1                                      |\n| 3        | 4  \
  \   | 2                                      |\n| 7        | 8     | 3         \
  \                             |\n| 15       | 16    | 4                        \
  \              |\n| 31       | 32    | 5                                      |\n\
  | 63       | 64    | 6                                      |\n\nThe numbers in\
  \ the leftmost column of Table 11.8 list ranges of numbers in the game; not all\
  \ numbers are listed, but only those that “step up”—that is, require an additional\
  \ guess. Each of these is an upper limit—so that for N = 15 or less, for example,\
  \ up to four guesses are required. But for any range greater than 15, more guesses\
  \ are required.\n\nThe numbers in the leftmost column are each 1 less than a power\
  \ of 2. When added to 1, they correspond to a power of 2. Therefore, to get the\
  \ numbers in the rightmost column—which contains the number of guesses needed—you\
  \ must take logarithm base 2 of N+1.\n\nThe final step is to round upward to the\
  \ nearest integer, because the number of steps taken must be an integer, and not\
  \ floating point. The correct formula is\n\n_Maximum guesses needed = ceiling(log-base-2(N\
  \ + 1))_\n\nWriting the program, with the aid of the **math** package, is now easy.\n\
  \nClick here to view code image\n\n```\nfrom math import log2, ceil\n\nn = int(input('Enter\
  \ size of range: '))\nx = ceil(log2(n + 1))\nprint('Max. number of guesses needed\
  \ is', x)\n```\n\nThis program, in addition to using the `math.log2` function, also\
  \ uses `math.ceil`, one of the miscellaneous functions. The `ceil` function takes\
  \ any number and rounds it upward to the lowest integer greater than or equal to\
  \ its input.\n\nNow, if you run the program, you can answer the question we posed\
  \ earlier. As usual, user input is shown in bold.\n\nClick here to view code image\n\
  \n```\nEnter size of range: 50\nMax. number of guesses needed is 6.\n```\n\nSo that’s\
  \ the answer. If you follow the ideal strategy—which is to make a guess in the middle\
  \ of the available range—you should never need more than six guesses.\n\nAs for\
  \ the strategy, you pick a number as close as you can to the midpoint of the available\
  \ range. This range should always be what’s left over after you use all the information\
  \ you’ve gotten from previous guesses. For example, if you guess 25 and the computer\
  \ says, “Too high,” you should adjust the range to 1 to 24 instead of 1 to 50.\n\
  \nThis strategy reflects a binary-search pattern, which should, on average, reduce\
  \ the number of available choices by roughly 50 percent each time, until the result\
  \ is found.\n\n# CHAPTER 11 SUMMARY\n\nThis chapter explored how two of the most\

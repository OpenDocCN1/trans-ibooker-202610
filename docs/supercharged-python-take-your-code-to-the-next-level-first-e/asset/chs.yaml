  \n# ## 12.1.1 The “array” Package\n\nYou might not want to use this package much,\
  \ but it has some of the basic features of the **numpy** package. The **array**\
  \ package does, however, enable you to interface with contiguous blocks of data\
  \ created by other programs.\n\n# ## 12.1.2 The “numpy” Package\n\nThe **numpy**\
  \ package is the core of the technology discussed in this chapter. It builds on\
  \ the concept of contiguous memory— introduced by the **array** package—but it does\
  \ much more. The **numpy** package provides efficient handling of one-dimensional\
  \ arrays (which are something like lists), batch processing (in which you operate\
  \ on an array or large portions of that array at the same time), and high-level\
  \ support for creating and maintaining multidimensional arrays.\n\n# ## 12.1.3 The\
  \ “numpy.random” Package\n\nThe **numpy.random** package is automatically downloaded\
  \ as part of the **numpy** package. It provides much of the same functionality described\
  \ in Chapter 11 but is optimized for use with **numpy** arrays.\n\n# ## 12.1.4 The\
  \ “matplotlib” Package\n\nThis package is really more than one, but they are downloaded\
  \ together: **matplotlib** and **matplotlib.pyplot**. With the help of these packages,\

  \nFigure 15.2. 带有标题和图例的微软股票\n\n## 15.6 编写“MAKEPLOT”函数（重构）\n\n在开发本章的应用程序代码时，我们发现某些语句一遍又一遍地重复。\n\
  \n要成为一名专业程序员——甚至是一名优秀的业余程序员——你应该寻找减少此类代码的方法：将程序中重复且枯燥的部分放入一个可以根据需要随时调用的公共函数中。借助本章中的绘图软件，大部分工作都可以放入一个名为\
  \ `makeplot` 的公共函数中，该函数足够灵活，可以以多种方式使用。\n\n此过程称为对代码进行 _重构_。\n在本节中，我们将提取一个名为 `makeplot`\
  \ 的函数。\n调用它的代码将不再执行大部分绘图工作，如你在本节后半部分将看到的那样。相反，代码将调用 `makeplot` 并传递以下参数：\n\n- `stock_df`，由\
  \ `load_stock` 最初生成的数据帧，然后传递给特定的“绘图”函数\n- `field`，你希望绘制的列（或 _属性_）的名称\n- `my_str`，要放置在图例中的名称，用于描述图表中特定线条对应的内容，例如图\
  \ 15.3 中的“MSFT”\n\n本节及后续章节展示了 `do_plot` 函数如何调用 `makeplot` 并传递所需信息。\n以下是 `makeplot`\
  \ 本身的定义。它不做某些事情，例如调用 `plt.plot` 或设置标题，这是有充分理由的，如你将看到的那样。但它完成了其他所有工作。\n\nClick here\
  \ to view code image\n\n```python\ndef makeplot(stock_df, field, my_str):\n    column\
  \ = getattr(stock_df, field)\n    column = np.array(column, dtype='float')\n   \
  \ plt.plot(stock_df.Date, column, label=my_str)\n    plt.legend()\n```\n\n让我们回顾一下这些语句。定义中的第一条语句会从数据帧中选择指定的列，使用由内置\
  \ `getattr` 函数访问的命名属性。调用者需要将属性（例如 `Close`）作为字符串传入。\n\n定义中的第二条语句将存储在 **pandas** 数据帧中的信息转换为\
  \ **numpy** 格式。第三条语句执行实际绘图，使用 `my_str`，这是一个用于图例的字符串，并添加到图表中。\n\n但是 `makeplot` 不会调用\
  \ `plt.show`，因为在将所有其他图表放入所需图表之前，不应调用该函数。\n\n定义了 `makeplot` 后，其余代码变得更短。例如，有了 `makeplot`，上一节中的\
  \ `do_plot` 函数可以修改为\n\nClick here to view code image\n\n```python\ndef do_plot(stock_df,\
  \ name_str):\n    makeplot(stock_df, 'Close', 'closing price')\n    plt.title(name_str\
  \ + ' Stock Price')\n    plt.show()\n```\n\n调用 `makeplot` 后，此函数只需设置标题——我们将其留作灵活操作——然后调用\
  \ `plt.show`。`makeplot` 的第二个参数选择要访问的列，第三个参数（`'closing price'`）是要放置在图例中的字符串。\n\n\
  ## 15.7 同时绘制两个股票\n\n当你看到图 15.2 时，你可能会说：“苹果电脑股票价格的图表怎么了？我想看看那个！”\n\n我们可以把苹果放回去；事实上，我们可以做得更好。我们可以在同一个图表中显示两个股票价格，并使用图例来澄清哪条线指的是哪家公司。\n\
  \n然而，这需要对模块结构进行重大更改。我们需要修改不止一个函数，以便有一个函数调用来处理两个股票。让我们从模块级代码开始，现在它传递两个股票数据帧而不是一个。\n\
  \nClick here to view code image\n\n```python\n# Run test if this is main module.\n\
  if __name__ == '__main__':\n    stock1_df = load_stock('MSFT')\n    stock2_df =\
  \ load_stock('AAPL')\n    do_duo_plot(stock1_df, stock2_df)\n```\n\n对于每个股票，都会单独调用\
  \ `load_stock`，这样我们就不必修改第一个模块 `stock_load.py`。然后将两个数据帧交给 `do_duo_plot`，以便将两个股票一起绘制，并附带包含两个标签的图例。\n\
  \nClick here to view code image\n\n```python\ndef do_duo_plot(stock1_df, stock2_df):\n\
  \    \"\"\"Revised Do Plot function.\n    Take two stock data frames this time.\n\

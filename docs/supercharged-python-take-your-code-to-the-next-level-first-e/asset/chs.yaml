  \ < 'aaa'` 返回 **False**。（有关顺序的说明，请参见注释。） |\n| `str1 > str2` | 如果 `str1` 在字母顺序中晚于\
  \ `str2`，则返回 **True**。例如，`'def' > 'abc'` 返回 **True**，但 `'def' > 'xyz'` 返回 **False**。\
  \ |\n| `str1 <= str2` | 如果 `str1` 在字母顺序中早于 `str2`，或者字符串具有相同的内容，则返回 **True**。 |\n\
  | `str1 >= str2` | 如果 `str1` 在字母顺序中晚于 `str2`，或者字符串具有相同的内容，则返回 True。 |\n| `str1 +\
  \ str2` | 生成两个字符串的连接，即将 str2 的内容简单地粘贴到 str1 末尾的结果。例如，'Big' + 'Deal' 生成连接字符串 'BigDeal'。\
  \ |\n| `str1 * n` | 生成字符串自身连接 n 次的结果，其中 n 是整数。例如，'Goo' * 3 生成 'GooGooGoo'。 |\n|\
  \ `n * str1` | 与 str1 * n 相同的效果。 |\n| `str1 in str2` | 如果子字符串 str1 完整地包含在 str2 中，则生成\
  \ True。 |\n| `str1 not in str2` | 如果子字符串 str1 不包含在 str2 中，则生成 True。 |\n| `str is\
  \ obj` | 如果 str 和 obj 引用内存中的同一对象，则返回 True；有时在与 None 或未知对象类型进行比较时需要。 |\n| `str is\
  \ not obj` | 如果 str 和 obj 不引用内存中的同一对象，则返回 True。 |\n\n> **注意**\n>\n> 比较字符串时，Python\
  \ 使用一种字母顺序；更具体地说，它使用 _code point_ 顺序，该顺序查看字符的 ASCII 或 Unicode 值。在此顺序中，所有大写字母都在所有小写字母之前，但除此之外，字母涉及字母顺序比较，正如你所期望的那样。数字比较也按你期望的方式工作，因此\
  \ `'1'` 小于 `'2'`。\n\n字符串的连接运算符（+）可能很熟悉，因为它在许多具有某种字符串类的语言中都受到支持。\n连接不会自动在两个单词之间添加空格。你必须自己添加。但是，所有字符串（包括像\
  \ `' '` 这样的字面量字符串）都具有相同的类型 **str**，因此 Python 没有问题执行以下操作：\n\nClick here to view code\
  \ image\n\n```\nfirst = 'Will'\nlast = 'Shakespeare'\nfull_name = first + ' ' +\
  \ last\nprint(full_name)\n```\n\n此示例打印\n\n```\nWill Shakespeare\n```\n\n字符串乘法运算符（*）在进行面向字符的图形处理并希望初始化一条长行（例如分隔符）时很有用。\n\
  \n```\ndivider_str = '_' * 30\nprint(divider_str)\n```\n\n这将打印以下内容：\n\n```\n------------------------------\n\
  ```\n\n此操作的结果，'_' * 30，是由 30 个下划线组成的字符串。\n\n> **性能提示**\n> 有其他方法可以创建包含连续 30 个下划线的字符串，但使用乘法运算符（*）是效率最高的。\n\
  \n小心不要滥用 `is` 和 `is not` 运算符。这些运算符测试两个值是否是内存中的 _同一对象_。例如，你可能有两个字符串变量，它们都包含值 \"cat\"\
  。在这种情况下，使用相等性（==）测试它们将始终返回 **True**，但 `obj1 is obj2` 可能不会。\n\n你应该何时使用 `is` 或 `is\
  \ not`？你应该主要在比较不同类型的对象时使用它们，因为适当的相等性测试（==）可能未定义。这种情况的一个例子是测试某个值是否等于特殊值 **None**，它是唯一的，因此适合使用\
  \ `is` 进行测试。\n\n## 2.4 索引和切片\n\n从字符串中提取数据的两种方式包括索引和切片：\n\n- *索引* 使用数字根据字符在字符串中的位置来引用单个字符。\n\
  - *切片* 是 Python 更独特的功能。它使你能够使用紧凑的语法引用整个子字符串。\n\n列表支持类似的功能，因此“第 3 章，高级列表功能”应该看起来相似。但是，存在一些差异。最大的差异是：\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_105_0.png)\n\n你可以以任何组合使用正数（非负）和负索引。图\
  \ 2.1 说明正索引如何从 0 运行到 N–1，其中 N 是字符串的长度。\n\n![](img/6e45221a8147f2442c653a3d4a866570_106_0.png)\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_106_1.png)\n\n# 图 2.1. Python 中的字符串索引\n\
  \n此图还说明了负索引，它们从 –1（表示最后一个字符）向后运行到 –N。\n\n除了不可变性之外，字符串和列表之间还有另一个区别。索引字符串始终生成一个单字符字符串，假设索引有效。单字符字符串具有\
  \ str 类型，就像较大的字符串一样。\n\n因此，例如，假设你索引 'Hello' 的第一个字符；结果是字符串 'H'。尽管其长度为 1，但它仍然是字符串。\n\
  \n```\ns = 'Hello'\nch = s[0]\nprint(type(ch))\n```\n\n如果执行此代码，将打印以下结果——证明 ch 虽然只包含一个字符，但仍然具有\
  \ str 类型：\n\n```\n<class 'str'>\n```\n\nPython 没有单独的“字符”类型。\n\n\n\n\n切片是 Python\
  \ 字符串、列表和元组共有的一种特殊能力。表 2.2 总结了字符串切片支持的语法，切片会产生子字符串。请记住，你不能对字符串的切片进行赋值。\n\n## 表 2.2.\
  \ Python 字符串切片语法\n\n| 语法 | 获取的子字符串 |\n|---|---|\n| `string[beg:end]` | 从 _beg_ 开始的所有字符，直到但不包括\
  \ _end_。 |\n| `string[:end]` | 从字符串开头开始的所有字符，直到但不包括 _end_。 |\n| `string[beg:]` |\
  \ 从 _beg_ 开始直到字符串末尾的所有元素。 |\n| `string[:]` | 字符串中的所有字符；此操作会复制整个字符串。 |\n| `string[beg:end:step]`\
  \ | 从 _beg_ 开始的所有字符，直到但不包括 _end_，每次移动 _step_ 个项目。 |\n\n假设你想要从字符串中删除开头和结尾的字符。在这种情况下，你需要结合使用正索引和负索引。先从一个包含开头和结尾双引号的字符串开始。\n\
  \n```python\nking_str = '\"Henry VIII\"'\n```\n\n如果直接打印此字符串，你会得到以下结果：\n\n```\n\"\
  Henry VIII\"\n```\n\n但是，如果你想要打印不带引号的字符串该怎么办？一种简单的方法是执行以下代码：\n\n```python\nnew_str\
  \ = king_str[1:-1]\nprint(new_str)\n```\n\n输出现在是\n\n```\nHenry VIII\n```\n\n图 2.2\
  \ 说明了此过程的工作原理。在切片操作中，切片从第一个参数开始，**直到但不包括**第二个参数。\n\n# king_str[1:-1]\n\n![](img/6e45221a8147f2442c653a3d4a866570_109_0.png)\n\
  \n图 2.2. 字符串切片示例 1\n\n这里有另一个示例。假设我们想要从短语“The Bad Dog”中提取第二个单词“Bad”。如图 2.3 所示，正确的切片应从索引\
  \ 4 开始，并延伸到所有直到但不包括索引 7 的字符。因此，该字符串可以通过 `string[4:7]` 访问。\n\n# string[4:7]\n\n![](img/6e45221a8147f2442c653a3d4a866570_109_1.png)\n\
  \n图 2.3. 字符串切片示例 2\n\n# 切片规则有一些有趣的后果。\n\n- 如果 _beg_ 和 _end_ 都是正索引，_beg_-_end_ 给出切片的最大长度。\n\
  - 要获取包含字符串前 N 个字符的字符串，请使用 _string_[:_N_]。\n- 要获取包含字符串最后 N 个字符的字符串，请使用 _string_[-_N_:]。\n\
  - 要制作字符串的完整副本，请使用 _string_[:]。\n\n切片允许第三个可选的 _step_ 参数。当为正时，_step_ 参数指定每次向前移动多少个字符。_step_\
  \ 参数为 2 表示“获取每隔一个字符。”_step_ 参数为 3 表示“获取每隔三个字符。”例如，以下语句从 'RoboCop' 的第二个字符开始，然后每次通过两个字符遍历字符串。\n\
  \n单击此处查看代码图片\n\n```python\na_str = 'RoboCop'\nb_str = a_str[1::2]   # Get every\
  \ other character.\nprint(b_str)\n```\n\n此示例打印以下内容：\n\n```\nooo\n```\n\n这里有另一个示例。步长值为\
  \ 3 表示“获取每隔三个字符。”这次，切片默认从第一个位置开始。\n\n单击此处查看代码图片\n\n```python\na_str = 'AbcDefGhiJklNop'\n\
  b_str = a_str[::3]   # Get every third character.\nprint(b_str)\n```\n\n此示例打印以下内容：\n\
  \n```\nADGJN\n```\n\n你甚至可以使用负的 _step_ 值，这会导致切片在字符串中向后执行。例如，以下函数返回作为参数传递给它的字符串的精确反转。\n\
  \n单击此处查看代码图片\n\n```python\ndef reverse_str(s):\n    return s[::-1]\n\nprint(reverse_str('Wow\
  \ Bob wow!'))\nprint(reverse_str('Racecar'))\n```\n\n此示例打印以下内容：\n\n```\n!wow boB\
  \ woW\nracecaR\n```\n\n切片时，Python 对超出范围的索引不会引发异常。它只是尽可能多地获取输入。在某些情况下，这可能会导致空字符串。\n\
  \n```python\na_str = 'cat'\nb_str = a_str[10:20]  # b_str assigned an empty string.\n\
  ```\n\n# 2.5 单字符函数（字符代码）\n\n有两个函数旨在与长度为 1 的字符串一起使用。实际上，这些是单字符函数，尽管它们操作的是字符串。\n\n\
  ```python\nord(str)   # Returns a numeric code\nchr(n)     # Converts ASCII/Unicode\
  \ to a one-char str.\n```\n\n![](img/6e45221a8147f2442c653a3d4a866570_112_0.png)\n\
  \nord 函数期望一个字符串参数，但如果字符串长度大于 1，则会引发 TypeError 异常。你可以使用此函数返回与字符对应的 ASCII 或 Unicode\
  \ 值。例如，以下示例确认字母 A 的 ASCII 代码是十进制 65。\n\n```python\nprint(ord('A'))  # Print 65.\n\
  ```\n\nchr 函数是 ord 函数的逆函数。它接受一个字符代码，并返回其 ASCII 或 Unicode 等效值，作为长度为 1 的字符串。因此，使用参数\
  \ 65 调用 chr 应该打印字母 A，它确实如此。\n\n```python\nprint(chr(65))  # Print 'A'\n```\n\n`in`\
  \ 和 `not in` 运算符，虽然不限于与单字符字符串一起使用，但通常会这样使用。例如，以下语句测试字符串的第一个字符是否是元音：\n\n> 单击此处查看代码图片\n\
  \n```python\ns = 'elephant'\nif s[0] in 'aeiou':\n    print('First char. is a vowel.')\n\
  ```\n\n相反，你可以编写一个辅音测试。\n\n> 单击此处查看代码图片\n\n```python\ns = 'Helephant'\nif s[0] not\
  \ in 'aeiou':\n    print('First char. is a consonant.')\n```\n\n一个明显的缺点是，这些示例不能正确处理大写字母。以下是一种修复方法：\n\
  \n> 单击此处查看代码图片\n\n```python\nif s[0] in 'aeiouAEIOU':\n    print('First char. is\
  \ a vowel.')\n```\n\n或者，你可以在测试前将字符转换为大写；这会产生不区分大小写的比较效果。\n\n单击此处查看代码图片\n\n```python\n\
  s = 'elephant'\nif s[0].upper() in 'AEIOU':\n    print('First char. is a vowel.')\n\
  ```\n\n你还可以使用 `in` 和 `not in` 来测试包含多个字符的子字符串。在这种情况下，必须找到整个子字符串才能产生 **True**。\n\n\
  ```python\n'bad' in 'a bad dog'  # True!\n```\n\n坏狗里有 bad 吗？是的，有。请注意，`in` 运算符，如果被测试，总是表现得好像所有字符串都包含空字符串\
  \ `''`，这与列表的工作方式不同。如果你询问列表是否包含空列表，Python 不会返回 **True**。\n\n单击此处查看代码图片\n\n```python\n\
  print('' in 'cat')   # Prints True\nprint([] in [1, 2, 3]) # Prints False\n```\n\
  \n单字符操作重要的另一个领域是 `for` 循环和迭代。如果你遍历列表，你可以访问每个列表元素。但是，如果你遍历字符串，你会得到单个字符：同样，这些都是长度为\
  \ 1 的字符串，而不是单独的“字符”类型的对象。\n\n单击此处查看代码图片\n\n```python\ns = 'Cat'\nfor ch in s:\n\
  \    print(ch, ',', 'type:', type(ch))\n```\n\n此代码打印以下内容：\n\n```\nC, type: <class\
  \ 'str'>\na, type: <class 'str'>\nt, type: <class 'str'>\n```\n\n因为这些字符中的每一个都是长度为\
  \ 1 的字符串，我们可以打印相应的 ASCII 值：\n\n```python\ns = 'Cat'\nfor ch in s:\n    print(ord(ch),\
  \ end=' ')\n```\n\n此示例打印以下内容：\n\n```\n67 97 116\n```\n\n# 2.6 使用“JOIN”构建字符串\n\n\
  考虑到字符串是不可变的，你可能会问以下问题：如何构建或创建新字符串？\n\n再次，Python 赋值的特殊性来解救。例如，以下语句构建字符串“Big Bad John”：\n\
  \n```python\na_str = 'Big '\na_str = a_str + 'Bad '\na_str = a_str + 'John'\n```\n\
  \n这些是完全有效的语句。它们重复使用名称 `a_str`，每次将一个新字符串赋值给该名称。最终结果是创建以下字符串：\n\n```\n'Big Bad John'\n\
  ```\n\n以下语句也是有效的，即使它们似乎违反了不可变性，但实际上并没有。\n\n```python\na_str = 'Big '\na_str += 'Bad\
  \ '\na_str += 'John'\n```\n\n这种使用 =、+ 和 += 构建字符串的技术，对于涉及少数对象的简单情况是足够的。例如，你可以按照以下方式构建一个包含字母表中所有字母的字符串，使用在第\
  \ 2.5 节“单字符操作（字符代码）”中介绍的 `ord` 和 `chr` 函数。\n\n```python\nn = ord('A')\ns = ''\n\
  ```\n\n\n\n\n\nfor i in range(n, n + 26):\n    s += chr(i)\n\n这个示例的优点是简洁。但它会导致 Python\
  \ 在内存中一次又一次地创建全新的字符串。一个稍好一些的替代方案是使用 join 方法。\n\n![](img/6e45221a8147f2442c653a3d4a866570_117_0.png)\n\
  \nseparator_string.join(list)\n\n该方法将列表中的所有字符串连接起来，形成一个大字符串。如果该列表包含多个元素，则 separator_string\
  \ 的文本会放在每对相邻字符串之间。空列表是一个有效的分隔符字符串；在这种情况下，列表中的所有字符串都会简单地连接在一起。在运行时，使用 join 通常比连接更高效，尽管除非元素数量非常多，否则你可能看不到执行时间的差异。\n\
  \nn = ord('A')\na_lst = [ ]\nfor i in range(n, n + 26):\n    a_lst.append(chr(i))\n\
  s = ''.join(a_lst)\n\njoin 方法将 a_lst（一个字符串列表）中的所有字符串连接成一个大字符串。在这种情况下，分隔符字符串为空。\n\
  \n> **Performance Tip**\n>\n> `join` 相对于简单连接的优势可以在涉及数千次操作的大型案例中看到。在这些情况下，连接的缺点在于\
  \ Python 必须创建数千个不断增大的字符串，这些字符串只使用一次，然后通过“垃圾回收”被丢弃。但垃圾回收会带来执行时间的代价，前提是它运行得足够频繁以产生影响。\n\
  \n下面是一个使用 `join` 方法更优的案例：假设你想编写一个函数，该函数接收一个名称列表，并逐个打印，名称之间用逗号优雅地分隔。下面是编写代码的困难方式：\n\
  \nClick here to view code image\n\n```\ndef print_nice(a_lst):\n    s = ''\n   \
  \ for item in a_lst:\n        s += item + ', '\n    if len(s) > 0:     # Get rid\
  \ of trailing\n                        # comma+space\n        s = s[:-2]\n    print(s)\n\
  ```\n\n给定此函数定义后，我们可以对字符串列表调用它。\n\nClick here to view code image\n\n```\nprint_nice(['John',\
  \ 'Paul', 'George', 'Ringo'])\n```\n\n该示例打印以下内容：\n\nHere's the version using the\
  \ **join** 方法：\n\n```\n```python\ndef print_nice(a_lst):\n    print(', '.join(a_lst))\n\
  ```\n```\n\n这少了不少代码！\n\n# ## 2.7 重要的字符串函数\n\n本章中描述的许多“函数”实际上是 _methods_：使用“点”语法调用的类的成员函数。\n\
  \n但除了方法之外，Python 语言还有一些重要的内置函数，这些函数是为与语言的基本类型一起使用而实现的。此处列出的函数特别适用于字符串。\n\n![](img/6e45221a8147f2442c653a3d4a866570_119_0.png)\n\
  \nClick here to view code image\n\n```\n```python\ninput(prompt_str)    # Prompt\
  \ user for input string.\nlen(str)             # Return num. of chars in str.\n\
  max(str)             # Return char with highest code val.\nmin(str)            \
  \ # Return char with lowest code val.\nreversed(str)   # Return iter with reversed\
  \ str.\nsorted(str)     # Return list with sorted str.\n```\n```\n\n最重要的函数之一是 **len**，它可以与任何标准集合类一起使用来确定元素的数量。对于字符串，此函数返回字符的数量。下面是一个示例：\n\
  \nClick here to view code image\n\n```\ndog1 = 'Jaxx'\ndog2 = 'Cutie Pie'\nprint(dog1,\
  \ 'has', len(dog1), 'letters.')\nprint(dog2, 'has', len(dog2), 'letters.')\n```\n\
  \n这将打印以下字符串。请注意，“Cutie Pie”有九个字母，因为它计算了空格。\n\n```\nJaxx has 4 letters.\nCutie Pie\
  \ has 9 letters.\n```\n\n**reversed** 和 **sorted** 函数分别生成一个迭代器和一个列表，而不是字符串。但是，可以通过使用\
  \ **join** 方法将这些数据对象的输出转换回字符串。下面是一个示例：\n\nClick here to view code image\n\n```\n\
  a_str = ''.join(reversed('Wow,Bob,wow!'))\nprint(a_str)\nb_str = ''.join(sorted('Wow,Bob,wow!'))\n\
  print(b_str)\n```\n\n这将打印以下内容：\n\n```\n!wow,boB,woW\n!,BWbooowww\n```\n\n# 2.8 二进制、十六进制和八进制转换函数\n\
  \n除了 **str** 转换函数之外，Python 还支持三个函数，这些函数接受数字输入并生成字符串结果。这些函数中的每一个都生成适当基数（2、16 和 8，分别对应二进制、十六进制和八进制）的数字字符串。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_121_0.png)\n\nClick here to view code\
  \ image\n\n```\nbin(n) # Returns a string containing n in binary:\n# For example,\
  \ bin(15) -> '0b1111'\nhex(n) # Returns a string containing n in hex:\n# For example,\
  \ hex(15) -> '0xf'\noct(n) # Returns a string containing n in octal:\n# For example,\
  \ oct(15) -> '0o17'\n```\n\n下面是另一个示例，展示了如何将十进制数 10 打印为二进制、八进制和十六进制。\n\nClick here\
  \ to view code image\n\n```\nprint(bin(10), oct(10), hex(10))\n```\n\n这将打印以下内容：\n\
  \n```\n0b1010 0o12 0xa\n```\n\n如你所见，这三个函数会自动使用前缀“ob”、“oo”和“ox”。\n\n# ## 2.9 简单布尔（“is”）方法\n\
  \n这些方法——名称中都以单词“is”开头——返回 **True** 或 **False**。它们通常与单字符字符串一起使用，但也可以用于更长的字符串；在这种情况下，只有当字符串中的每个字符都通过测试时，它们才返回\
  \ **True**。表 2.3 显示了字符串的布尔方法。\n\n# ### Table 2.3. 字符串的布尔方法\n\n| Method name/syntax\
  \ | Returns True if string passes this test |\n|---|---|\n| str.isalnum() | 所有字符都是字母或数字，并且至少有一个字符。\
  \ |\n| str.isalpha() | 所有字符都是字母表中的字母，并且至少有一个字符。 |\n| str.isdecimal() | 所有字符都是十进制数字，并且至少有一个字符。与\
  \ isdigit 类似，但旨在与 Unicode 字符一起使用。 |\n| str.isdigit() | 所有字符都是十进制数字，并且至少有一个字符。 |\n\
  | str.isidentifier() | 字符串包含一个有效的 Python 标识符（符号）名称。第一个字符必须是字母或下划线；其他每个字符必须是字母、数字或下划线。\
  \ |\n| str.islower() | 字符串中的所有字母都是小写，并且至少有一个字母。（但是，可能存在非字母字符。） |\n| str.isprintable()\
  \ | 字符串中的所有字符（如果有）都是可打印字符。这不包括 \\n 和 \\t 等特殊字符。 |\n| str.isspace() | 字符串中的所有字符都是“空白”字符，并且至少有一个字符。\
  \ |\n| str.istitle() | 字符串中的每个单词都是有效的标题，并且至少有一个字符。这要求每个单词都大写，并且除了单词开头之外，任何地方都不出现大写字母。单词之间可能存在空白和标点字符。\
  \ |\n| str.isupper() | 字符串中的所有字母都是大写，并且至少有一个字母。（但是，可能存在非字母字符。） |\n\n这些函数既适用于单字符字符串，也适用于更长的字符串。以下代码说明了两者的用法。\n\
  \nClick here to view code image\n\n```\nh_str = 'Hello'\nif h_str[0].isupper():\n\
  \    print('First letter is uppercase.')\nif h_str.isupper():\n    print('All chars\
  \ are uppercase.')\nelse:\n    print('Not all chars are uppercase.')\n```\n\n此示例打印以下内容：\n\
  \n```\nFirst letter is uppercase.\nNot all chars are uppercase.\n```\n\n这个字符串也会通过标题测试，因为首字母是大写，其余字母不是。\n\
  \nClick here to view code image\n\n```\nif h_str.istitle():\n    print('Qualifies\
  \ as a title.')\n```\n\n# ## 2.10 大小写转换方法\n\n上一节中的方法用于测试大写字母与小写字母。本节中的方法执行转换以生成一个新字符串。\n\
  \n\n\n\n\n\n![](img/6e45221a8147f2442c653a3d4a866570_126_0.png)\n\nClick here to\
  \ view code image\n\n```\nstr.lower() # Produce all-lowercase string\nstr.upper()\
  \ # Produce all-uppercase string\nstr.title() # 'foo foo'.title() => 'Foo Foo'\n\
  str.swapcase() # Upper to lower, and vice versa\n```\n\n**lower** 和 **upper** 方法的效果非常直观。前者将字符串中的每个大写字母转换为小写字母；后者则相反，将每个小写字母转换为大写字母。非字母字符不会被改变，而是保持原样保留在字符串中。\n\
  \n转换后的结果作为一个新字符串返回。由于原始字符串数据是不可变的，因此不会“原地”更改。但以下语句能达到你的预期效果。\n\nClick here to view\
  \ code image\n\n```\nmy_str = \"I'm Henry VIII, I am!\"\nnew_str = my_str.upper()\n\
  my_str = new_str\n```\n\n最后两步可以高效地合并为：\n\n```\nmy_str = my_str.upper()\n```\n\n\
  如果你随后打印 `my_str`，将得到以下结果：\n\n```\nI'M HENRY VIII, I AM!\n```\n\n**swapcase** 方法很少使用。它生成的字符串中，原字符串为小写字母的位置变为大写字母，反之亦然。例如：\n\
  \n```\nmy_str = my_str.swapcase()\nprint(my_str)\n```\n\n这将打印以下内容：\n\n```\ni'm hENRY\
  \ viii, i AM!\n```\n\n## 2.11 查找和替换方法\n\n查找和替换方法是 `str` 类中最有用的方法之一。在本节中，我们首先介绍 **startswith**\
  \ 和 **endswith**，然后介绍其他查找和替换函数。\n\n![](img/6e45221a8147f2442c653a3d4a866570_127_0.png)\n\
  \nClick here to view code image\n\n```\nstr.startswith(substr) # Return True if\
  \ prefix found.\nstr.endswith(substr) # Return True if suffix found.\n```\n\n其中一位作者曾编写过一本名为《Python\
  \ Without Fear》（Addison-Wesley, 2018）的早期著作，其中包含一个将罗马数字转换为十进制数的程序。该程序需要检查输入字符串开头处的某些字母组合——即以任意数量的罗马数字\
  \ M 开头。\n\nClick here to view code image\n\n```\nwhile romstr.startswith('M'):\n\
  \    amt += 1000    # Add 1,000 to running total.\n    romstr = romstr[1:]    #\
  \ Strip off first character.\n```\n\n相反，**endswith** 方法查找目标子字符串是否作为后缀存在。例如：\n\n\
  Click here to view code image\n\n```\nme_str = 'John Bennett, PhD'\nis_doc = me_str.endswith('PhD')\n\
  ```\n\n这些方法，`startswith` 和 `endswith`，可以在空字符串上使用而不会引发错误。如果子字符串为空，返回值始终为 **True**。\n\
  \n现在让我们来看看 Python 字符串的其他查找和替换方法。\n\n![](img/6e45221a8147f2442c653a3d4a866570_128_0.png)\n\
  \nClick here to view code image\n\n```\nstr.count(substr [, beg [, end]])\nstr.find(substr\
  \ [, beg [, end]])\nstr.index()     # Like find, but raises exception\nstr.rfind()\
  \     # Like find, but starts from end\nstr.replace(old,new [, count])# count is\
  \ optional; limits no. of replacements\n```\n\n在此语法中，方括号并非字面意思，而是表示可选项。\n\n**count**\
  \ 方法报告目标子字符串出现的次数。其工作原理如下。\n\nClick here to view code image\n\n```\nfrank_str =\
  \ 'doo be doo be doo...'\nn = frank_str.count('doo')\nprint(n)    # Print 3.\n```\n\
  \n你可以在同一方法调用中可选地使用 _start_ 和 _end_ 参数。\n\nClick here to view code image\n\n```\n\
  print(frank_str.count('doo', 1))    # Print 2\nprint(frank_str.count('doo', 1, 10))\
  \    # Print 1\n```\n\n_start_ 参数为 1 表示计数从第二个字符开始。如果同时使用 _start_ 和 _end_，则计数范围是从\
  \ _start_ 位置开始，直到但不包括 `end` 位置的目标字符串。这些参数和往常一样是基于零的索引。\n\n如果参数（`begin`、`end`）中的一个或两个超出范围，`count`\
  \ 方法不会引发异常，而是尽可能处理尽可能多的字符。\n\n**find** 方法适用类似规则。对该方法的简单调用会查找子字符串参数的第一次出现，并返回该实例的非负索引；如果未找到子字符串，则返回\
  \ –1。\n\nClick here to view code image\n\n```\nfrank_str = 'doo be doo be doo...'\n\
  \nprint(frank_str.find('doo'))   # Print 0\nprint(frank_str.find('doob'))  # Print\
  \ -1\n```\n\n如果你想查找子字符串所有出现的位置，可以在循环中调用 **find** 方法，如以下示例所示。\n\nClick here to view\
  \ code image\n\n```\nfrank_str = 'doo be doo be doo...'\nn = -1\nwhile True:\n \
  \   n = frank_str.find('doo', n + 1)\n    if n == -1:\n        break\n    print(n,\
  \ end=' ')\n```\n\n此示例打印出可以找到 'doo' 实例的每个索引。\n\n此示例的工作原理是利用 _start_ 参数。在每次成功调用 **find**\
  \ 方法后，初始搜索位置 n 会设置为上一次成功的查找索引，然后向上调整 1。这保证了下一次调用 **find** 方法必须查找子字符串的新实例。\n\n如果\
  \ **find** 操作未找到任何出现，则返回值为 –1。\n\n**index** 和 **rfind** 方法与 **find** 方法几乎相同，只有少数区别。**index**\
  \ 函数在未找到子字符串出现时不会返回 –1。相反，它会引发 **ValueError** 异常。\n\n**rfind** 方法查找子字符串参数的最后一次出现。默认情况下，该方法从末尾开始向左搜索。但这并不意味着它查找的是子字符串的逆序。相反，它查找的是子字符串的常规副本，并返回最后一次出现的起始索引号——即最后一次出现的起始位置。\n\
  \nClick here to view code image\n\n```\nfrank_str = 'doo be doo be doo...'\nprint(frank_str.rfind('doo'))\
  \  # Prints 14.\n```\n\n该示例打印 14，因为 'doo' 最右侧的出现位于基于零的位置 14 处开始。\n\n最后，**replace**\
  \ 方法将旧子字符串的每一次出现都替换为新子字符串。和往常一样，该方法生成结果字符串，因为它无法原地更改原始字符串。\n\n例如，假设我们有一组书籍标题，但想要将单词“Grey”的拼写更改为“Gray”。以下是示例：\n\
  \nClick here to view code image\n\n```\ntitle = '25 Hues of Grey'\nnew_title = title.replace('Grey',\
  \ 'Gray')\n```\n\n打印 new_title 会产生以下结果：\n\n```\n25 Hues of Gray\n```\n\n下一个示例说明\
  \ **replace** 如何处理同一子字符串的多次出现。\n\nClick here to view code image\n\n```\ntitle =\
  \ 'Greyer Into Grey'\nnew_title = title.replace('Grey', 'Gray')\n```\n\n新字符串现在为\n\
  \n```\nGrayer Into Gray\n```\n\n## 2.12 使用“SPLIT”拆分输入\n\n在处理字符输入时，最常见的编程任务之一是*分词化*——将一行输入拆分为单个单词、短语和数字。Python\
  \ 的 **split** 方法提供了一种简单便捷的方式来完成此任务。\n\n![](img/6e45221a8147f2442c653a3d4a866570_133_0.png)\n\
  \nClick here to view code image\n\n```\n`input_str.split(delim_string=None)`\n```\n\
  \n对该方法的调用将返回一个子字符串列表，这些子字符串取自 *input_string*。*delim_string* 指定一个作为分隔符的字符串；这是一个用于将一个标记与另一个标记分开的子字符串。\n\
  \n如果省略 *delim_string* 或其为 **None**，则 **split** 的行为实际上是使用任意一个或多个空白字符（空格、制表符和换行符）来区分一个标记和下一个标记。\n\
  \n例如，**split** 方法——使用默认分隔符空格——可以用于拆分包含多个名字的字符串。\n\nClick here to view code image\n\
  \n```\n`stooge_list = 'Moe Larry Curly Shemp'.split()`\n```\n\n如果打印结果列表，则如下所示：\n\
  \n\n\n\n\n\n**split** 的行为，当参数为 **None** 或使用默认参数时，会将**任意数量**的连续空格作为分隔符。下面是一个示例：\n\
  \n```python\nstooge_list = 'Moe   Larry Curly   Shemp'.split()\n```\n\n但是，如果指定了分隔符字符串，则必须精确匹配才能识别一个字符与下一个字符之间的分隔符。\n\
  \n```python\nstooge_list = 'Moe   Larry Curly   Shemp'.split(' ')\n```\n\n在这种情况下，**split**\
  \ 方法会识别一个额外的字符串——尽管它是空的——只要有多余的空格就存在。这可能不是你想要的行为。刚才展示的示例会产生以下结果：\n\n```python\n\
  ['Moe', '', '', '', 'Larry', 'Curly', '', '', 'Shemp']\n```\n\n另一个常见的分隔符字符串是逗号，或者可能是逗号加上空格。在后一种情况下，分隔符字符串必须精确匹配。下面是一个示例：\n\
  \n```python\nstooge_list = 'Moe, Larry, Curly, Shemp'.split(', ')\n```\n\n相比之下，下面的示例使用简单的逗号作为分隔符。这个示例会导致令牌包含多余的空格。\n\
  \n```python\nstooge_list = 'Moe, Larry, Curly, Shemp'.split(',')\n```\n\n在这种情况下，结果在四个字符串元素中的最后三个元素中包含一个前导空格：\n\
  \n```python\n['Moe', ' Larry', ' Curly', ' Shemp']\n```\n\n如果你不想要这些前导空格，一个简单的解决方案是使用去除（stripping），如下所示。\n\
  \n## 2.13 去除（STRIPPING）\n\n一旦你从用户或文本文件中检索到输入，你可能希望通过去除前导和尾随空格将其放置在正确的格式中。你可能还想要去除前导和尾随的“0”数字或其他字符。`str`\
  \ 类提供了几种方法来让你执行这种去除操作。\n\n```python\nstr.strip(extra_chars=' ')  # Strip leading\
  \ & trailing.\nstr.lstrip(extra_chars=' ')  # String leading chars.\nstr.rstrip(extra_chars='\
  \ ')  # String trailing chars.\n```\n\n这些方法调用中的每一个都会生成一个字符串，其中包含要去除的尾随或前导字符（或两者）。\n\
  \n**lstrip** 方法仅去除前导字符，而 **rstrip** 方法仅去除尾随字符，但除此之外，所有三种方法执行相同的工作。**strip** 方法去除前导和尾随字符。\n\
  \n对于每种方法，如果指定了 *extra_chars* 参数，则该方法会去除 *extra_chars* 字符串中每个字符的所有出现。例如，如果字符串包含 `+0`，则该方法会去除所有前导或尾随星号（*）以及所有前导或尾随“0”数字和加号（+）。\n\
  \n要去除的字符的内部实例保持不变。例如，下面的语句去除前导和尾随空格，但不去除中间的空格。\n\n```python\nname_str = '  Will\
  \ Shakes  '\nnew_str = name_str.strip()\n```\n\n图 2.4 说明了此方法调用的工作原理。\n\n图 2.4. Python\
  \ 去除操作\n\n## 2.14 对齐方法（JUSTIFICATION METHODS）\n\n当你需要进行复杂的文本格式化时，通常应该使用第 5 章“精确格式化文本”中描述的技术。但是，str\
  \ 类本身带有用于对齐文本的基本技术：要么在打印字段中左对齐，要么右对齐，要么居中文本。\n\n```python\nstr.ljust(width [, fillchar])\
  \   # Left justify\nstr.rjust(width [, fillchar])   # Right justify\nstr.center(width\
  \ [, fillchar])   # Center the text.\ndigit_str.zfill(width)   # Pad with 0’s.\n\
  ```\n\n在这些方法的语法中，每对方括号表示一个可选项，不应按字面意思解释。这些方法返回的字符串格式如下：\n\n- `str` 的文本被放置在由 `width`\
  \ 指定的大小的更大打印字段中。\n- 如果字符串文本短于指定长度，则文本将按适当方式左对齐、右对齐或居中。如果 `center` 方法无法完美居中，则略微偏向左对齐。\n\
  - 结果的其余部分用填充字符填充。如果未指定此填充字符，则默认值为空格。\n\n下面是一个示例：\n\n```python\nnew_str = 'Help!'.center(10,\
  \ '#')\nprint(new_str)\n```\n\n此示例打印\n\n```\n###Help!###\n```\n\n另一个常见的填充字符（空格以外）是数字字符“0”。数字字符串通常是右对齐而不是左对齐。下面是一个示例：\n\
  \n```python\nnew_str = '750'.rjust(6, '0')\nprint(new_str)\n```\n\n此示例打印\n\n```\n\
  000750\n```\n\nzfill 方法提供了一种更短、更紧凑的方式来做同样的事情：用前导“0”字符填充数字字符串。\n\n```python\ns =\
  \ '12'\nprint(s.zfill(7))\n```\n\n但是 zfill 方法不仅仅是 rjust 的快捷方式；相反，使用 zfill 时，零填充成为数字本身的一部分，因此零会打印在数字和符号之间：\n\
  \n```python\n>>> '-3'.zfill(5)\n'-0003'\n>>> '-3'.rjust(5, '0')\n'000-3'\n```\n\n\
  ## 第 2 章总结\n\nPython 字符串类型（str）是一个异常强大的数据类型，即使与其他语言中的字符串相比也是如此。字符串方法包括对输入进行标记化（拆分）；去除前导和尾随空格（去除）；转换为数字格式；以及以任何基数打印数字表达式的能力。\n\

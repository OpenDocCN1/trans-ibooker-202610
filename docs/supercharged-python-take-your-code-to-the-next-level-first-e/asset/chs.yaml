  \ |\n| str | = | file | .rea | d(si | ze=-1 ) | 二进制文件读取，但也可用于文本文件。读取文件内容并将其作为字符串返回。size\
  \ 参数控制读取的字节数，但如果设置为 -1（默认值），则读取所有内容并返回。在文本模式下，size 参数指的是字符数，而不是字节数。在二进制模式下，返回的字符串应被视为字节容器，而不是真正的文本字符串。\
  \ |\n| file | .wri | te(t | ext) | 文本或二进制写入操作。返回写入的字节数（在文本模式下为字符数），这始终等于字符串的长度。在二进制模式下，字符串通常包含非字节字符串的数据；此类数据在写入前必须转换为字节字符串或\
  \ bytearray 格式。在文本模式下，此方法和 writelines 都不会自动追加换行符。 |\n\n| `file.writelines(str_list)`\
  \ | 主要用于文本模式的写入操作。写入一系列字符串。参数包含要写入的文本字符串列表。此方法不会向写入的数据追加换行符。因此，如果你希望列表中的每个元素都被视为单独的一行，则需要自行追加换行符。\
  \ |\n| --- | --- |\n| `file.writable()` | 如果文件可写入，则返回 **True**。 |\n| `file.seek(pos,\
  \ origin)` | 将文件指针移动到文件中的指示位置。如果支持随机访问，则此方法将文件指针移动到相对于原点（_orig_）的正或正负偏移量（_pos_），_orig_\
  \ 有三个参数：0 – 文件开头 1 – 当前位置 2 – 文件末尾 |\n| `file.seekable()` | 如果文件系统支持随机访问，则返回 **True**。否则，使用\
  \ `seek` 或 `tell` 会引发 `UnsupportedOperation` 异常。 |\n| `file.tell()` | 返回当前文件位置：从文件开头开始的字节数。\
  \ |\n\n| 1() |\n| --- |\n| file .close() 关闭文件并刷新 I/O 缓冲区，以便所有挂起的读取或写入操作都在文件中实现。其他程序和进程现在可以自由访问该文件。\

  ```\n\n让我们进一步假设，同一目录下有一个名为 `rpn.txt` 的文件，其内容如下：\n\n```\n3 3 * 4 4 * + .5 ^\n1 1\
  \ * 1 1 * + .5 ^\n```\n\n有了这个文件和新版本的 RPN 解释器程序，以下是示例会话。\n\n```\nEnter RPN source:\
  \ rppn.txt\nFile not found. Re-enter.\nEnter RPN source: rpn.txt\n5.0\n1.4142135623730951\n\
  ```\n\n该程序的行为完全符合设计。当输入 RPN 文件名（rpn.txt）时，程序会按需评估每一行。\n\n请注意，rpn.txt 的第一行被故意留空，作为测试。程序如预期般跳过了它。\n\
  \n此版本程序的基本操作是打开一个文本文件，该文件理想情况下包含语法正确的 RPN 语言语句。当成功打开有效文本文件时，open_rpn_file 函数返回一个文本行列表。main\
  \ 函数随后逐个评估该列表中的每个成员。\n\n但我们才刚刚开始。下一步是扩展 RPN 语言的语法，使其能够将值赋给变量，就像 Python 本身所做的那样。\n\
  \n### 8.9.3 为 RPN 添加赋值运算符\n\nRPN“语言”即将变得更加有趣。我们将使其能够识别和存储符号名称。如何实现这一点？\n\n我们需要一个符号表。Python\
  \ 提供了一种特别方便、快速且简单的方法来实现这一点：使用数据字典。记住，你可以通过赋值 { } 来创建一个空字典。\n\n```\nsym_tab = { }\n\
  ```\n\n现在我们可以向符号表添加条目。以下\n\n\n\nRPN 语法会赋予一个值；与 Python 本身一样，如果符号尚不存在，则会创建它。否则，其值将被新值替换。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_495_0.png)\n\n```\n`symbol expression\
  \ =`\n```\n\n以下是一些示例：\n\n```\n`x 35.5 =\nx 2 2 + =\nmy_val 4 2.5 * 2 + =\nx my_val\
  \ +`\n```\n\n这些语句的效果应该是将值 35.5 放入 `x`，然后将 4（即 2 + 2）放入 `x`，接着将 12 放入 `my_val`。最后，效果是将表达式\
  \ `x my_val +` 放在栈顶，这应该会导致打印出值 16。\n\n得益于 Python 的字典功能，向表中添加符号非常容易。例如，你可以将符号 `x`\
  \ 放入表中，其值为 35.5。\n\n```\n`sym_tab['x'] = 35.5`\n```\n\n我们可以将此操作纳入 Scanner 对象，以及其他操作。\n\
  \n```\nscanner = re.Scanner([\n    (r\"[ \\t\\n]\", lambda s, t: None),\n    (r\"\
  [+-]*(/\\d*.)?/\\d+\", lambda s, t:\n        stack.append(float(t))),\n    (r\"\\\
  d+\", lambda s, t: stack.append(int(t))),\n    (r\"[a-zA-Z_][a-zA-Z_0-9]*\", lambda\
  \ s, t:\n        stack.append(t)),\n    (r\"[+]\", lambda s, t: bin_op(operator.add)),\n\
  \    (r\"[-]\", lambda s, t: bin_op(operator.sub)),\n    (r\"[*]\", lambda s, t:\
  \ bin_op(operator.mul)),\n    (r\"[/]\", lambda s, t: bin_op(operator.truediv)),\n\
  \    (r\"[^]\", lambda s, t: bin_op(operator.pow)),\n    (r\"[=]\", lambda s, t:\
  \ assign_op()),\n])\n```\n\n在这个新版本的 `scanner` 中，以下正则表达式表示：“查找以小写字母、大写字母或下划线（_）开头，然后包含零个或多个这些字符或数字字符的模式。”\n\
  \n该项作为字符串添加到栈中。请注意，Python 列表可以自由混合字符串和数字。当添加这样的符号时，它将被存储为字符串。因此，它可能是赋值的目标。`assign_op`\
  \ 函数定义如下：\n\n```\ndef assign_op():\n    op2, op1 = stack.pop(), stack.pop()\n  \
  \  if type(op2) == str:  # Source may be another\n    var!\n    op2 = sym_tab[op2]\n\
  \nsym_tab[op1] = op2\n```\n\n虽然 `op1` 指的是变量名（即 RPN 语言中的变量），但 `op2` 可能指的是变量名或数值。因此，与下一块代码一样，如果\
  \ `op2` 是字符串，则必须在符号表 `sym_tab` 中查找它。\n\n> **注意**\n>\n> 在前面的示例中，如果 `op1` 不指向变量名，则表示语法错误。\n\
  \n在其他二进制操作（如加法、乘法等）的情况下，每个操作数可能是符号名（存储在字符串中）或数值。因此，使用 `bin_op` 函数时，有必要检查每个操作数的类型，如果是字符串，则查找其值。\n\
  \n单击此处查看代码图片\n\n```\ndef bin_op(action):\n    op2, op1 = stack.pop(), stack.pop()\n\
  \    if type(op1) == str:\n        op1 = sym_tab[op1]\n    if type(op2) == str:\n\
  \        op2 = sym_tab[op2]\n    stack.append(action(op1, op2))\n```\n\n现在我们可以创建完全修订后的应用程序。然而，这引发了一个设计问题。程序是否应该评估并打印每一行\
  \ RPN 的结果？\n\n可能不应该，因为某些 RPN 行仅仅会赋值，而这种操作不会将任何值放在栈顶。因此，这个版本的程序只打印最终结果，不打印任何其他结果。除了输入和错误消息，这个版本的应用程序会等到执行结束后再打印任何内容。\n\
  \n单击此处查看代码图片\n\n```\nimport re\nimport operator\n\n# Provide a symbol table; values\
  \ of variables will\n#   stored here.\nsym_tab = { }\nstack = []    # Stack to hold\
  \ the values.\n\n# Scanner: Add items to recognize variable names,\n# which\n# \
  \  are stored in the symbol table, and to perform\n#   assignments, which enter\
  \ values into the sym.\n#   table.\n\nscanner = re.Scanner([\n    (r\"[ \\t\\n]\"\
  , lambda s, t: None),\n    (r\"[+-]*(?:\\d\\*.)?\\d+\", lambda s, t:\n        stack.append(float(t))),\n\
  \    (r\"[a-zA-Z_][a-zA-Z_0-9]*\", lambda s, t:\n        stack.append(t)),\n   \
  \ (r\"\\d+\", lambda s, t: stack.append(int(t))),\n    (r\"[+]\", lambda s, t: bin_op(operator.add)),\n\
  \    (r\"[-]\", lambda s, t: bin_op(operator.sub)),\n    (r\"[*]\", lambda s, t:\
  \ bin_op(operator.mul)),\n    (r\"[/]\", lambda s, t: bin_op(operator.truediv)),\n\
  \    (r\"[^]\", lambda s, t: bin_op(operator.pow)),\n    (r\"[=]\", lambda s, t:\
  \ assign_op()),\n])\n```\n\n```\n])def assign_op():\n    '''Assignment Operator\
  \ function: Pop off a name\n    and a value, and make a symbol-table entry.\n  \
  \  Remember\n    to look up op2 in the symbol table if it is a\n    string.\n  \
  \  '''\n    op2, op1 = stack.pop(), stack.pop()\n    if type(op2) == str:   # Source\
  \ may be another\n    var!\n        op2 = sym_tab[op2]\n    sym_tab[op1] = op2\n\
  def bin_op(action):\n    '''Binary Operation evaluator: If an operand is\n    a\
  \ variable name, look it up in the symbol table\n    and replace with the corresponding\
  \ value, before\n    being evaluated.\n    '''\n    op2, op1 = stack.pop(), stack.pop()\n\
  \    if type(op1) == str:\n        op1 = sym_tab[op1]\n    if type(op2) == str:\n\
  \        op2 = sym_tab[op2]\n    stack.append(action(op1, op2))\ndef main():\n \
  \   a_list = open_rpn_file()\n    if not a_list:\n        print('Bye!')\n      \
  \  return\n    for a_line in a_list:\n        a_line = a_line.strip()\n        if\
  \ a_line:\n            tokens, unknown = scanner.scan(a_line)\n            if unknown:\n\
  \nprint('Unrecognized input:',\nunknown)\nprint(str(stack[-1]))\ndef open_rpn_file():\n\
  \    \"\"\"Open-source-file function. Open a named\n    file and read lines into\
  \ a list, which is\n    returned.\n    \"\"\"\n    while True:\n        try:\n \
  \           fname = input('Enter RPN source: ')\n            if not fname:\n   \
  \             return None\n            f = open(fname, 'r')\n            break\n\
  \        except:\n            print('File not found. Re-enter.')\n    a_list = f.readlines()\n\
  \    return a_list\nmain()\n```\n\n以下是一个示例会话。假设文件 `rpn2.txt` 包含以下内容：\n\n单击此处查看代码图片\n\
  \n```\nside1 30 =\nside2 40 =\nsum side1 side1 * side2 side2 *+ =\nsum 0.5 ^\n```\n\
  \n如果正确执行，这些 RPN 语句的效果是将勾股定理应用于输入 30 和 40，理应输出 50.0。如果 `rpn2.txt` 的内容如下，则\n\n以下会话演示了它是如何被评估的。\n\
  \n```\nEnter RPN source: rpn2.txt\n50.0\n```\n\n该程序存在一些局限性。并非每种错误都能在此得到正确报告。另外，如果最后一条语句是赋值，理想情况下程序应报告赋值的值，但它没有这样做。\n\
  \n我们将在第 14 章中解决这个问题，通过向 RPN 语法添加 INPUT 和 PRINT 语句。\n\n在离开此话题之前，让我们回顾一下这个 Python\
  \ 程序的工作原理。首先，它设置一个 Scanner 对象，其用法在第 7 章“正则表达式 II”中已解释。该对象查找单个项目或标记，并根据标记的类型采取相应操作。\n\
  \n+   • 如果找到数值表达式，则将其转换为真实数字并放入栈中。\n\n+   • 如果是符号名（即变量），则将其作为字符串放入栈中；之后，作为赋值的结果，它可以被添加到符号表中。\n\
  \n+   • 如果是操作符，则将栈中最近的两个操作数弹出并进行求值，结果重新放回栈中。赋值（=）是一个例外，它不会将任何内容放入栈中（尽管可以说，也许应该这样做）。\n\
  \n还有一个新的变化：如果从栈中弹出一个变量名，则会在符号表中查找它，并在将操作数用作操作的一部分之前，用变量的值替换该操作数。\n\n> **注意**\n>\n\
  > 如果你浏览本应用程序中的代码，可能会注意到符号查找代码是重复的，可以用函数调用来替代。该函数必须以足够通用的方式编写，以适应任何操作数，但这不应该很难。这种方法只能节省一两行代码，但它是\
  \ _代码重构_ 的合理用途，代码重构会收集相似操作并用公共函数调用替代它们。例如，目前代码使用\n>\n> ```\n> if type(op1) == str:\n\
  >     op1 = sym_tab[op1]\n> ```\n>\n> 这可以替换为公共函数调用，如下所示：\n>\n> ```\n> op1 = symbol_look_up(op1)\n\
  > ```\n>\n> 当然，你需要定义该函数。\n\n## 8.10 直接二进制读/写\n\n在本章的其余部分，我们将进入读写二进制文件的新领域。\n\n当你以二进制模式打开文件时，如果选择，可以直接将字节数据读写到文件中。这些操作处理的是类型为\
  \ **bytes** 的字符串。\n\nPython 中的低级二进制读写操作使用了一些与文本文件操作相同的方法，但使用的是 **bytes** 数据。\n\n\
  \n\n\n\n## 8.11 将数据转换为固定长度字段（“结构”）\n\n如果你正在创建一个需要从头开始读写新数据文件的应用程序，你会发现 pickle 接口是最易于使用的，你可能希望直接跳到下一节。\n\
  \n但是，如果你需要与非 Python 创建的现有二进制文件进行交互，你就需要一个更低级别的解决方案，它能让你读写各种大小的整数和浮点数，以及字符串。虽然可以通过一次读写一个字节来实现这一点——如上一节所示——但这是一种不可移植且困难的做法。\n\
  \n**struct** 包有助于将熟悉的内置类型打包和解包为字节字符串。它包含若干函数调用。\n\n```python\nimport struct\nbytes_str\
  \ = struct.pack(format_str, v1, v2, v3...)\nv1, v2, v3... = struct.unpack(format_str,\
  \ bytes_str)\nstruct.calcsize(format_str)\n```\n\n**struct.pack** 函数接受一个格式字符串（参见表\
  \ 8.2）和一系列一个或多个值。它返回一个可以写入二进制文件的 **bytes** 字符串。\n\n**struct.unpack** 函数执行相反的操作，接受一个类型为\
  \ **bytes** 的字符串，并返回一系列值，以元组形式返回。值的数量和类型由 _format_str_ 参数控制。\n\n**calcsize** 函数返回给定\
  \ _format_str_ 参数所需的字节数。虽然 _bytes_str_ 的类型为 **bytes**，但格式字符串是一个普通的 Python 字符串。\n\
  \n表 8.2 列出了此上下文中格式字符串中可以出现的字符（不要与第 5 章中的格式混淆）。\n\n# 表 8.2. 打包和解包的常见数据格式\n\n| 格式说明符\
  \ | C 语言类型 | Python 类 | 大小 |\n|---|---|---|---|\n| c | char | bytes | 1 |\n| ? |\
  \ bool | bool | 1 |\n| h | short | int | 2 |\n| H | unsigned short | int | 2 |\n\
  | l | long | int | 4 |\n| L | unsigned long | int | 4 |\n| q | long long | int |\
  \ 8 |\n| Q | unsigned long | int | 8 |\n| f | float | float | 4 |\n| d | double\
  \ | float | 8 |\n| ints | char[] | str | int length |\n| P | Pascal 字符串类型；有关更多信息，请参阅在线帮助。\
  \ | | |\n\n表 8.2 在第二列中列出了 C 语言数据类型。许多其他语言通常有短整数和长整数、短浮点数和长浮点数的概念，这些类型与这些类型对应。（但是，Python\
  \ 整数需要“打包”，如本节所示。）\n\n> **注意**\n>\n> 整数前缀可以应用于字符串以外的字段。例如，‘3f’ 与 ‘fff’ 相同。\n\n要使用\
  \ **struct** 包写入二进制文件，请执行以下步骤。\n\n- 以二进制写入模式（`'wb'`）打开文件。\n- 如果要写入字符串，请先使用字符串类的\
  \ **encode** 方法将其转换为 **bytes** 字符串。\n- 使用 **struct.pack** 函数从所有数据中创建一个打包的 **bytes**\
  \ 字符串。你需要使用表 8.2 中列出的一个或多个数据格式说明符，例如用于 16 位整数的 `'h'`。你包含的任何字符串都需要像步骤 2 中描述的那样已经编码。\n\
  - 最后，使用文件对象的 **write** 方法将字节字符串写入文件。\n\n使用 **struct** 包从二进制文件读取的过程类似。\n\n- 以二进制读取模式（`'rb'`）打开文件。\n\
  - 读入一串字节。你必须指定要读取的确切字节数，因此你需要提前知道记录的大小；你可以根据表 8.2 中的字符在数据格式字符串上运行 **struct.calcsize**\
  \ 函数来确定它。\n\n```python\nbss = f.read(struct.calcsize('h'))\n```\n\n- 使用 **struct.unpack**\
  \ 函数将 **bytes** 字符串解包为值的元组。因为结果是一个元组，所以你需要使用索引来访问单个元素，即使只有一个元素。这是一个示例：\n\n```python\n\
  tup = unpack('h', bss)\nreturn tup[0]\n```\n\n- 如果在步骤 3 中，你读入了一个打算赋值给普通 Python 字符串的\
  \ **bytes** 字符串，请使用 **bytes** 类的 **decode** 方法转换你读取的每个字符串。\n\n由于这些技术涉及字节的低级位置，由于大端序与小端序以及填充，存在一些特殊注意事项。但首先，接下来的几个小节将处理特定问题：\n\
  \n- 一次读写一个数字\n- 一次读写多个数字\n- 读写固定长度字符串\n- 读写可变长度字符串\n- 读写混合数据的组合\n\n## 8.11.1 一次读写一个数字\n\
  \n一次读写一个打包数字（本示例中为整数）的问题相当简单，但在读取过程中，请记住返回的是一个元组，即使只有一个元素，也需要对其进行索引。\n\n```python\n\
  from struct import pack, unpack, calcsize\n```\n\n```python\ndef write_num(fname,\
  \ n):\n    with open(fname, 'wb') as f:\n        bss = pack('h', n)\n        f.write(bss)\n\
  \ndef read_num(fname):\n    with open(fname, 'rb') as f:\n        bss = f.read(calcsize('h'))\n\
  \        t = struct.unpack('h', bss)\n        return t[0]\n```\n\n有了这些定义，你就可以将单个整数读写到文件中，假设这些整数适合短整数（16\
  \ 位）格式。较大的值可能需要更大的数据格式。\n\n这是一个示例：\n\n```python\nwrite_num('silly.dat', 125)\nprint(read_num('silly.dat'))\
  \ # Write the number\n125.\n```\n\n## 8.11.2 一次读写多个数字\n\n这个问题与上一节中的问题类似；但是，因为它返回不止一个数字，最简单的解决方案是将\
  \ **read** 函数的返回值解释为元组。为了变化，这次我们使用浮点数——三个。\n\n\n\n\n\nfrom struct import pack, unpack,\
  \ calcsize\n\ndef write_floats(fname, x, y, z):\n    with open(fname, 'wb') as f:\n\
  \        bss = pack('fff', x, y, z)\n        f.write(bss)\n\ndef read_floats(fname):\n\
  \    with open(fname, 'rb') as f:\n        bss = f.read(calcsize('fff'))\n     \
  \   return unpack('fff', bss)\n\n注意，在本示例中，`'fff'` 可以替换为 `'3f'`。\n下一个示例展示了如何使用这些函数一次读取和写入三个浮点数。\n\
  \nClick here to view code image\n\n```\nwrite_floats('silly.dat', 1, 2, 3.14)\n\
  x, y, z = read_floats('silly.dat')\nprint(x, y, z, sep=' ')\n```\n\n将打印出这三个值——最后一个值带有明显的舍入误差。\n\
  \nClick here to view code image\n\n```\n1.0   2.0   3.140000104904175\n```\n\n##\
  \ 8.11.3 写入和读取固定长度字符串\n\n字符串——你可能会认为它应该是最容易处理的——却为二进制存储带来了特殊问题。首先，\n\n由于不能假设 Python\
  \ 字符串使用单字节格式，因此有必要对其进行编码或解码以获取 **bytes** 字符串。\n\n其次，由于字符串长度不一，使用二进制操作时就会引发这样一个问题：到底应该读取或写入多少个字符！这是一个非平凡的问题。但至少有两种解决方案。一种解决方案是在函数调用中指定要读取或写入的字符数。\n\
  \nClick here to view code image\n\n```\nfrom struct import pack, unpack, calcsize\n\
  def write_fixed_str(fname, n, s):\n    with open(fname, 'wb') as f:\n        bss\
  \ = pack(str(n) + 's', s.encode('utf-8'))\n        f.write(bss)\ndef read_fixed_str(fname,\
  \ n):\n    with open(fname, 'rb') as f:\n        bss = f.read(n)\n        return\
  \ bss.decode('utf-8')\n```\n\n这对函数必须事先就要读取或写入的字符串精确长度达成一致。因此，它们必须完全同步。\n\n当 `write_fixed_str`\
  \ 调用 **pack** 函数时，该函数会自动截断或填充字符串（添加额外的空字节），使其长度正好为 n。\n\nClick here to view code\
  \ image\n\n```\nwrite_fixed_str('king.d', 13, \"I'm Henry the VIII I am!\")\nprint(read_fixed_str('king.d',\
  \ 13))\n```\n\n第二行只读取 13 个字符，因为只有 13 个字符可读。它打印\n\n```\nI'm Henry the\n```\n\n##\
  \ 8.11.4 写入和读取可变长度字符串\n\n这种方法比上一节中的方法更复杂，因为函数的用户可以传入任意字符串作为参数，并且会写入或读取正确数量的字节。\n\
  \nClick here to view code image\n\n```\nfrom struct import pack, unpack, calcsize\n\
  def write_var_str(fname, s):\n    with open(fname, 'wb') as f:\n        n = len(s)\n\
  \        fmt = 'h' + str(n) + 's'\n        bss = pack(fmt, n, s.encode('utf-8'))\n\
  \        f.write(bss)\ndef read_var_str(fname):\n    with open(fname, 'rb') as f:\n\
  \        bss = f.read(calcsize('h'))\n        n = unpack('h', bss)[0]\n        bss\
  \ = f.read(n)\n        return bss.decode('utf-8')\n```\n\n`write_var_str` 函数需要做一些技巧处理。首先，它创建一个形如\
  \ **hnums** 的字符串格式说明符。在下一个示例中，该格式说明符是 `h24s`，意思是，“写入（并稍后读取）一个整数，后跟一个包含 24 个字符的字符串。”\n\
  \n`read_var_str` 函数随后读取一个整数——在此例中为 24——并使用该整数来确定要读取的确切字节数。最后，这些字节被解码回标准 Python 文本字符串。\n\
  \n下面是一个相关示例：\n\n![](img/6e45221a8147f2442c653a3d4a866570_514_0.png)\n\n```\nwrite_var_str('silly.dat',\
  \ \"I'm Henry the VIII I am!\")\nprint(read_var_str('silly.dat'))\n```\n\n这些语句打印\n\
  \n```\nI'm Henry the VIII I am!\n```\n\n## 8.11.5 一起写入和读取字符串与数值\n\n下面是一对函数，用于读取和写入一条记录，该记录由一个九字符长度的字符串、一个十字符长度的字符串和一个浮点数组成。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_514_1.png)\n\n```\nfrom struct import\
  \ pack, unpack, calcsize\ndef write_rec(fname, name, addr, rating):\n    with open(fname,\
  \ 'wb') as f:\n        bname = name.encode('utf-8')\n        baddr = addr.encode('utf-8')\n\
  \        bss = pack('9s10sf', bname, baddr, rating)\n        f.write(bss)\n\ndef\
  \ read_rec(fname):\n    with open(fname, 'rb') as f:\n        bss = f.read(calcsize('9s10sf'))\n\
  \        bname, baddr, rating = unpack(\n            '9s10sf', bss)\n        name\
  \ = bname.decode('utf-8').rstrip('\\x00')\n        addr = baddr.decode('utf-8').rstrip('\\\
  x00')\n        return name, addr, rating\n```\n\n下面是一个用法示例：\n\n> Click here to view\
  \ code image\n\n```\nwrite_rec('goofy.dat', 'Cleo', 'Main St.', 5.0)\nprint(read_rec('goofy.dat'))\n\
  ```\n\n这些语句产生如下元组，符合预期：\n\n```\n('Cleo', 'A Str.', 5.0)\n```\n\n> ### Note\n> **pack**\
  \ 函数的优点在于根据需要插入内部填充，从而确保数据类型正确对齐。例如，四字节浮点值需要从 4 的倍数地址开始。在前面的示例中，**pack** 函数添加额外的空字节，使浮点值从正确对齐的地址开始。\n\
  > \n> 然而，这里的局限性在于，即使使用 **pack** 函数在单个记录内对齐所有内容，也不一定能保证对 *下一* 条记录进行正确的写入和读取。如果最后写入或读取的项目是非对齐大小的字符串，那么可能需要为每条记录填充字节。例如，考虑\n\
  \n以下记录：\nClick here to view code image\n\n```\nbss = pack('ff9s', 1.2, 3.14, 'I\\\
  'm Henry'.encode('utf-8'))\n```\n\n填充是一个棘手的问题，但取决于代码运行的系统，你偶尔可能需要考虑它。Python 官方规范指出，写入操作将与最后写入对象的对齐方式兼容。Python\
  \ 会在需要时添加额外字节。\n因此，要将结构体的末尾对齐到特定类型（例如浮点数）的对齐要求，你需要在格式字符串末尾使用该类型的代码；但如果你愿意，最后一个对象可以具有重复计数为\
  \ 0。在以下情况下，这意味着你需要写入一个“虚拟”浮点值，以保证与下一个要写入的浮点类型对齐。\nClick here to view code image\n\
  \n```\nbss = pack('ff9s0f', 1.2, 3.14,\n'I\\'m Henry'.encode('utf-8'))\n```\n\n\
  ## 8.11.6 低级细节：大端序与小端序\n\n考虑写入三个整数而非仅一个整数的问题。\nClick here to view code image\n\n\
  ```\nimport struct\nwith open('junk.dat', 'wb') as f:\n bstr = struct.pack('hhh',\
  \ 1, 2, 100)\ndatalen = f.write(bstr)\n```\n\n如果你计算变量 datalen（存储实际写入的字节数），你会发现它等于\
  \ 6。\n\n你也可以使用 **calcsize** 找到这个数字。这是因为数字 1、2 和 100 各被写为 2 字节整数（格式 **h**）。在 Python\
  \ 本身中，此类整数占用的空间要大得多。\n你可以使用类似的代码稍后从文件中读取这些值。\n\nClick here to view code image\n\n\
  ```\nwith open('junk.dat', 'rb') as f:\n    bstr = f.read(struct.calcsize('hhh'))\n\
  \    a, b, c = struct.unpack('hhh', bstr)\n    print(a, b, c)\n```\n\n运行这些语句块后，你应该得到\
  \ a、b 和 c 的以下值，反映出写入的相同值：\n\n```\n1 2 100\n```\n\n下一个示例使用了一个更有趣的情况：两个整数后跟一个长整数。在本示例之后，我们将讨论涉及的复杂性。\n\
  \nClick here to view code image\n\n```\nwith open('junk.dat', 'wb') as f:\n    bstr\
  \ = struct.pack('hhl', 1, 2, 100)\n    datalen = f.write(bstr)\n\nwith open('junk.dat',\
  \ 'rb') as f:\n    bstr = f.read(struct.calcsize('hhl'))\n    a, b, c = struct.unpack('hhq',\
  \ bstr)\n```\n\n本示例应与之前一样工作（只是使用 **hh1** 格式而非 **hhh**），但打印出字节字符串 `bstr` 揭示了一些重要细节：\n\
  \nClick here to view code image\n\n```\nb'\\x01\\x00\\x02\\x00\\x00\\x00\\x00\\\
  x00\\x00d\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00'\n```\n\n以下是一些需要注意的事项。\n\
  \n- 如果你仔细观察字节排列，本示例和前面的代码（如果你查看 **bytes** 字符串）都揭示了 *小端序* 字节排列的使用：在整数字段中，最低有效位首先放置。这发生在我的系统上，因为它是一台使用摩托罗拉处理器的\
  \ Macintosh。每个处理器可能使用不同的标准。\n\n- 第二，由于长整数（等于 100，即十六进制值 d）必须从 32 位边界开始，因此在第二个参数和第三个参数之间放置了\
  \ 2 个字节的填充。前一节末尾的注释提到了这个问题。\n\n可能出错的事情之一是尝试读取一个数据文件，而写入数据时使用的处理器采用大端序字节排列，而你的系统使用小端序，反之亦然。因此，**struct**\
  \ 函数允许你通过在格式字符串开头指定大端序或小端序来行使一些控制。表 8.3 列出了处理二进制数据的低级模式。\n\n| Table 8.3. Low-Level\
  \ Read/Write Modes |\n|---|\n\n\n\n\n\n| 符号 | 含义 |\n|------|------|\n| >    | 小端序\
  \ |\n| >    | 大端序 |\n| @    | 本地机器原生字节序 |\n\n例如，要将两个长整数打包成字节字符串，具体使用小端存储，请使用以下语句：\n\
  \nClick here to view code image\n\n```\nwith open('junk.dat', 'wb') as f:\n    bstr\
  \ = struct.pack('<hhl', 1, 2, 100)\n    datalen = f.write(bstr)\n```\n\n## 8.12\
  \ 使用 Pickle 包\n\n累了吗？Pickle 接口提供了一种更简单的读写数据文件的方式。\n\n从概念上讲，Pickle 数据文件应被视为一系列 Python\
  \ 对象，每个对象都存在于一种“黑盒”中，通过 Pickle 进行读取或写入。你无法进入这些对象（至少不容易做到），但你也不需要这样做。你只需一次读取或写入一个对象即可。\n\
  \n图 8.3 提供了这种数据文件布局的概念图。\n\n![](img/6e45221a8147f2442c653a3d4a866570_520_0.png)\n\
  \n### 图 8.3 Pickle 数据文件\n\n这种协议的优点在于，当你将项目读回程序时，你读取的是完整的对象。要查询读取的每个对象的类型，可以使用 `type`\
  \ 函数，或者直接将对象传递给 `print` 函数。\n\nPickle 由以下两个函数支持：\n\nClick here to view code image\n\
  \n```\nimport pickle\npickle.dump(value, file_obj)  # Write object to file.\nvalue\
  \ = pickle.load(file_obj)  # Load object from file.\n```\n\n使用这种方法，你只需知道你正在一次读取和写入\
  \ Python 对象——尽管这些对象可能包含集合，因此可能非常大。甚至不需要事先知道你正在读取和写入什么类型，因为你可以通过检查来发现。\n\n例如，以下代码块写入三个\
  \ Python 对象，在此示例中，它们分别是一个列表、一个字符串和一个浮点数值。\n\nClick here to view code image\n\n```\n\
  import pickle\nwith open('goo.dat', 'wb') as f:\n    pickle.dump([1, 2, 3], f)\n\
  \    pickle.dump('Hello!', f)\n    pickle.dump(3.141592, f)\n```\n\n该过程简单可靠，前提是该文件将由另一个使用\
  \ Pickle 包的 Python 应用程序读取。例如，以下代码块从文件 goo.dat 读取这三个对象，并打印出每个对象的字符串表示和类型。\n\nClick\
  \ here to view code image\n\n```\nwith open('goo.dat', 'rb') as f:\n    a = pickle.load(f)\n\
  \    b = pickle.load(f)\n    c = pickle.load(f)\n    print(type(a), a)\n    print(type(b),\
  \ b)\n    print(type(c), c)\n```\n\n此示例打印\n\n```\n<class 'list'> [1, 2, 3]\n<class\
  \ 'str'> Hello!\n<class 'float'> 2.3\n```\n\nPickle 易于使用，部分原因在于——与读取简单的字节序列不同——其效果是以全部荣耀加载一个\
  \ Python 对象。你可以对对象做很多事情，包括获取其类型，如果它是集合，还可以获取其长度。\n\n> Click here to view code image\n\
  \n```\nif type(a)==list:\n    print('The length of a is ', a)\n```\n\nPickle 唯一的真正限制是，当你打开一个文件时，可能不知道写入了多少个对象。一种解决方案是尽可能多地加载对象，直到程序引发\
  \ EOFError 异常。以下是一个示例：\n\n> Click here to view code image\n\n```\nloaded = []\n\
  with open('goo.dat', 'rb') as f:\n    while True:\n        try:\n            item\
  \ = pickle.load(f)\n        except EOFError:\n            print('Loaded', len(loaded),\
  \ 'items.')\n            break\n\n        print(type(item), item)\n        loaded.append(item)\n\
  ```\n\n## 8.13 使用 “Shelve” 包\n\n`shelve` 包在 `pickle` 接口之上构建了一个文件范围的数据库。前者包含后者的功能，因此你不需要同时导入两者。\n\
  \n```\nimport shelve\n```\n\n该包的接口很简单。你只需通过 `shelve.open` 打开一个文件，它提供了进入搁置接口的直接途径。然后可以将返回的对象用作虚拟字典。\n\
  \nClick here to view code image\n\n```\nshelf_obj = shelve.open(db_name)\n```\n\n\
  你可以为 `shelf_obj` 选择任何名称，它当然只是一个变量。`db_name` 与文件名相同，去掉其 `.db` 扩展名，该扩展名会自动添加到磁盘文件或设备的名称中。\n\
  \n当此函数调用成功执行时，如果数据库文件不存在，则会创建它；但在任何情况下，它都会以读写模式打开。\n\n随后的操作就很简单了。只需将返回的对象（存储在我们用占位符\
  \ `shelf_obj` 表示的变量中）视为任何数据字典（`dict` 类型）。以下是一个示例，其中 `nums` 在此情况下被用作字典名称：\n\nClick\
  \ here to view code image\n\n```python\nimport shelve\nnums = shelve.open('numdb')\n\
  nums['pi'] = (3.14192, False)\nnums['phi'] = (2.1828, False)\nnums['perfect'] =\
  \ (6, True)\nnums.close()\n```\n\n请注意，在此情况下，字典是通过变量 `num` 引用的；但与其他字典不同，它最终通过简单调用其\
  \ `close` 方法来关闭，该方法会清空缓冲区并将任何待处理的操作写入磁盘。\n\n这个现在驻留在磁盘上的字典，可以随时重新打开。例如，一个简单的循环打印出所有现有的键。\n\
  \n```python\nnums = shelve.open('numdb')\nfor thing in nums:\n    print(thing)\n\
  ```\n\n鉴于此前放入此字典的数据，此循环将打印以下键：\n\n```\npi\nphi\nperfect\n```\n\n当然，你也可以打印单个值。\n\n\
  ```\nprint(nums['pi'])\n```\n\n此语句打印与键 'pi' 关联的值。\n\n```\n3.14192\n```\n\n最后，在使用搁置接口打开字典后，你最终必须关闭它，这会强制将任何待处理的更改写出。\n\
  \n```\nnums.close()\n```\n\n以下特殊规则适用于搁置接口：\n\n- 虽然生成的数据字典与其他字典一样是 **dicts**，但键必须是字符串。不支持其他类型的键。\n\
  - 与往常一样，关联的值可以是任何类型，但必须是“可 Pickle 的”。\n- 请记住，**dict** 名称必须是简单名称；接口会通过附加 .db 扩展名自动在磁盘上放置一个文件。但是，不要在\
  \ Python 代码中自己使用此扩展名。\n\n这种接口的优点在于，对于非常大的数据集，它可能比普通 Pickle 或几乎任何其他访问技术都要快得多且更高效。搁置接口至少对于大型数据集，不会读取整个字典；相反，它会查看索引以确定值的位置，然后自动定位到该位置。\n\
  \n> Note\n> 默认情况下，当你使用搁置访问 stuff['Brian'] 等内容时，你得到的是副本，而不是原始数据。因此，例如，如果 my_item\
  \ 是列表，以下语句不会导致文件更改：\n> d[key].append(my_item)\n> 但是，以下语句会导致更改：\n> data = d[key]\n\
  > data.append(my_item)\n> d[key] = data\n\n# 第 8 章 小结\n\nPython 支持灵活、易于的技术来读写文本文件和二进制文件。二进制文件是指不打算将所有数据表示为可打印字符，而是用于直接存储数值的文件。二进制文件没有普遍认可的格式。确定格式并以该格式写出数据，是处理二进制文件时的一个重要问题。使用\
  \ Python，有几种高级选项可供选择。\n\n**struct** 包使你能够通过将 Python 值转换为固定大小、规则的数据字段来读写 Python 值。**pickle**\
  \ 包使你能够将完全实现的 Python 对象读写到磁盘。最后，**shelve** 接口允许你将磁盘文件视为一个大型数据字典，其中键必须是字符串。\n\nPython\
  \ 还支持通过 **os** 包与文件系统进行交互，该包包括 **os.path** 子包。这些包提供查找和删除文件以及读取目录系统的功能。在 IDLE 中，你可以使用\
  \ **help(os)** 和 **help(os.path)** 来了解其功能。\n\n# 第 8 章复习题\n\n1. 总结文本文件和二进制文件之间的区别。\n\

- "## D. 字典方法\n\n本附录列出了 `dict` 类型的方法。它不涵盖也可与此类型一起使用的函数，例如 `len`。有关这些内容，请参见附录 B。\n\n\
  在每个部分开头的语法显示中，方括号并非字面意思，而是表示可选项。\n\n### 表 D.1. 最常用的字典方法。\n\n| 要执行的任务： | 调用此方法： |\n\
  |---|---|\n| 从另一个集合添加键/值对 | `update` |\n| 清除字典的所有内容 | `clear` |\n| 复制另一个字典的所有内容\
  \ | `copy` |\n| 删除键及其关联的值 | `pop` |\n| 按键获取值；如果未找到键，则返回默认值（例如 `None`） | `get` |\n\
  | 获取包含所有关联值的序列 | `values` |\n| 获取包含所有键的序列 | `keys` |\n| 获取所有键值对 | `items` |\n| 如果键存在则获取其值；否则插入默认值\
  \ | `setdefault` |\n\n## DICT_OBJ.CLEAR()\n\n从现有字典中清除所有元素。不接受参数，并返回值 **None**。\n\
  \n```python\na_dict.clear()\n```\n\n## DICT_OBJ.COPY()\n\n通过逐个成员复制，返回字典的浅拷贝。例如：\n\
  \n```python\na_dict = {'pi': 3.14159, 'e': 2.71828 }\nb_dict = a_dict.copy()\n```\n\
  \n执行这些语句后，b_dict 与 a_dict 具有相同的内容，但它们是两个独立的集合，因此对其中一个的更改不会影响另一个。\n\n## DICT_OBJ.GET(KEY_OBJ,\
  \ DEFAULT_VAL = NONE)\n\n返回 `dict_obj` 中指定键关联的值。如果未找到键，则该方法返回 `default_val`，如果未指定，则为\
  \ **None**。例如：\n\n```python\nv = my_dict.get('BrianO')\nif v:\n    print('Value\
  \ is: ', v)\nelse:\n    print('BrianO not found.')\n```\n\n**get** 的以下用法是创建直方图的有效快捷方式。假设\
  \ `wrd_list` 是一个字符串列表，每个字符串包含一个单词。我们可以这样形成这样的列表，并伴随一个空字典。\n\n```python\ns = 'I am\
  \ what I am and that is all that I am'\nwrd_list = s.split()\nhist_dict = {}\n```\n\
  \n现在我们可以使用 **get** 方法来生成我们要查找的单词计数。\n\n```python\nfor wrd in wrd_list:\n    hist_dict[wrd]\
  \ = hist_dict.get(wrd, 0) + 1\nprint(hist_dict)\n```\n\n这些语句在字典中维护单词/频率对。每次找到新单词时，它都会以值\
  \ 1 添加到字典中；否则，现有值将加 1。这些语句生成以下输出：\n\n```\n{'I': 3, 'am': 3, 'what': 1, 'and': 1,\
  \ 'that': 2,\n'is': 1, 'all': 1, 'am.': 1}\n```\n\n## DICT_OBJ.ITEMS()\n\n返回一个元组序列，格式为\
  \ (_key_, _value_)，包含字典中的所有键值对。例如：\n\n```python\ngrades = {'Moe':1.5, 'Larry':1.0,\
  \ 'BillG':4.0}\nprint(grades.items())\n```\n\n这段代码打印以下内容：\n\n```\ndict_items([('Moe',\
  \ 1.5), ('Larry', 1.0), ('BillG',\n4.0)])\n```\n\n## DICT_OBJ.KEYS()\n\n返回包含字典中所有键的序列。例如：\n\
  \n```python\ngrades = {'Moe':1.5, 'Larry':1.0, 'BillG':4.0}\nprint(grades.keys())\n\
  ```\n\n这段代码打印以下内容：\n\n```\ndict_keys(['Moe', 'Larry', 'BillG'])\n```\n\n## DICT_OBJ.POP(KEY\
  \ [, DEFAULT_VALUE])\n\n返回与 _key_ 关联的值，然后从字典中删除该键值对。如果未找到键，则该方法返回 _default_value_（如果指定）；如果未指定该参数，则引发\
  \ **KeyError**。例如：\n\n```python\ngrades = {'Moe':1.5, 'Larry':1.0, 'BillG':4.0}\n\
  print(grades.pop('BillG', None)) # Prints 4.0\nprint(grades) # Prints grades,\n\
  with # BillG removed.\n```\n\n## DICT_OBJ.POPITEM()\n\n从字典对象中返回任意键值对并将其删除。（这与“随机对象”不完全相同，因为选择不保证符合真正随机性的统计要求。）键值对作为元组返回。例如：\n\
  \n```python\ngrades = {'Moe':1.5, 'Larry':1.0, 'BillG':4.0}\nprint(grades.popitem())\n\
  print(grades)\n```\n\n这些语句打印以下内容：\n\n```\n('BillG', 4.0)\n{'Moe': 1.5, 'Larry':\
  \ 1.0}\n```\n\n## DICT_OBJ.SETDEFAULT(KEY, DEFAULT_VALUE=NONE)\n\n返回指定 _key_ 的值。如果找不到键，则该方法插入该键，以及指定为\
  \ _default_value_ 的关联值；如果未指定，则该值为 **None**。无论哪种情况，都会返回该值。\n\n例如，以下语句如果存在键 'Stephen\
  \ Hawking'，则返回其关联的当前值；否则，它插入一个键值对并返回新值 4.0。\n\n```python\nprint(grades.setdefault('Stephen\
  \ Hawking', 4.0))\n```\n\n## DICT_OBJ.VALUES()\n\n返回包含字典中所有关联值的序列。要将此序列视为列表，可以使用列表转换。例如：\n\
  \n```python\ngrades = {'Moe':1.5, 'Larry':1.0, 'Curly':1.0,\n          'BillG':\
  \ 4.0}\nprint(grades.values())\n```\n\n这些语句打印以下内容：\n\n```\ndict_values([1.5, 1.0,\
  \ 1.0, 4.0])\n```\n\n## DICT_OBJ.UPDATE(SEQUENCE)\n\n此方法通过将序列中的所有键值条目添加到 dict_obj\
  \ 来扩展字典对象。序列参数可以是另一个字典，也可以是包含键值对的元组序列。\n\n例如，以下语句从 grades1 中的两个条目开始，然后向该字典添加三个更多条目。\n\
  \n```python\ngrades1 = {'Moe':1.0, 'Curly':1.0}\ngrades2 = {'BillG': 4.0}\ngrades3\
  \ = [('BrianO', 3.9), ('SillySue', 2.0)]\ngrades1.update(grades2)\ngrades1.update(grades3)\n\
  print(grades1)\n```\n\n执行这些语句时，打印以下内容：\n\n```\n{'Moe': 1.0, 'Curly': 1.0, 'BillG':\
  \ 4.0, 'BrianO': 3.9, 'SillySue': 2.0}\n```\n\n## 面向 IT 专业人士的视频培训\n\n- **快速学习**\n\

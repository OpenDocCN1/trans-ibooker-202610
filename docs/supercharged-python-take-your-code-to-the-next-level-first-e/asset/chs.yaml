  \n- 6. 你可以对字符串使用列表推导式吗？如果可以，如何操作？\n\n- 7. 你如何从命令行获取用户编写的 Python 程序的帮助？如何从 IDLE 内部获取帮助？\n\
  \n- 8. 函数在 Python 中被称为“一等对象”，但在大多数其他语言（如 C++ 或 Java）中不是。你可以对 Python 函数（可调用对象）做些什么，而在\

- "## 13. Advanced Uses of \"numpy\"\n\nYour introduction to the world of **numpy**\
  \ has just begun. One of the most interesting things you can do is plot charts,\
  \ building on top of **numpy** data types and functions. You’ll need to download\
  \ and import the **matplotlib** package as well as **numpy**.\n\nThere are many\
  \ things you can set, such as color, range, extent, and other factors, but getting\
  \ started is simple. After covering the plotting capabilities, this chapter examines\
  \ other advanced uses of the **numpy** package:\n\n- Financial applications\n- Linear\
  \ algebra: dot products and outer products\n- Operations on fixed-length records\
  \ of all kinds\n- Reading and writing large amounts of data\n\n### 13.1 ADVANCED\
  \ MATH OPERATIONS WITH \"NUMPY\"\n\nBefore you start plotting curves, you’ll need\
  \ to know about the mathematical functions operating on the standard **numpy** **ndarray**\
  \ type.\n\nTable 13.1 lists the most common of the functions. These are extremely\
  \ useful in plotting graphs. Most of them take an array as argument and return an\
  \ array of the same shape.\n\n| Operation | Description |\n|---|---|\n| `numpy.cos(A)`\
  \ | Return the cosine of each element in A, as explained in Chapter 11, “The Random\
  \ and Math Packages.” The input to this function is assumed to be in radians and\
  \ not degrees. That’s assumed for the other trig functions as well. |\n| `numpy.sin(A)`\
  \ | Return the sine of each element in A. As with `cos`, the results are returned\
  \ in an array of matching shape. |\n| `numpy.tan(A)` | Return the tangent of each\
  \ element. |\n| `numpy.exp(A)` | Return e raised to the power of each element in\
  \ A. |\n| `numpy.power(X, Y)` | Raise each element in X by its corresponding value\
  \ in Y. These two arrays must have the same shape, or one or both must be scalar.\
  \ |\n| `numpy.deg2rad(A)` | Convert degrees to radians; the argument may be an array\
  \ of the same shape or may be scalar. |\n| `numpy.abs(A)` | Take the absolute value\
  \ of each element in A. |\n| `numpy.log(A)` | Take the natural logarithm of each\
  \ element in A. |\n| `numpy.log10(A)` | Take the logarithm base 10 of each element\
  \ in A. |\n| `numpy.log2(A)` | Take the logarithm base 2 of each element in A. |\n\
  | `numpy.sqrt(A)` | Take the square root of each element in A. |\n| `numpy.arccos(A)`\
  \ | Inverse cosine function. |\n| `numpy.arcsin(A)` | Inverse sine function. |\n\
  | `numpy.arctan(A)` | Inverse tangent function. |\n| `numpy.cosh(A)` | Hyperbolic\
  \ cosine. |\n| `numpy.sinh(A)` | Hyperbolic sine. |\n| `numpy.tanh(A)` | Hyperbolic\
  \ tangent. |\n| `numpy.append(A, B)` | Create a new array by appending the contents\
  \ of array B onto the end of array A. |\n| `numpy.pi` | Get the value of pi. |\n\
  | `numpy.e` | Get the value of e. |\n\nThese functions have additional arguments.\
  \ A common argument is the _out_ argument, which names an output array in which\
  \ to place the results. Such an array must match the source array in size and shape.\
  \ Here’s an example:\n\n```python\nimport numpy as np\nA = np.linspace(0, np.pi,\
  \ 10)\nB = np.empty(10)\nnp.sin(A, out=B)\n```\n\nThis last line puts the results\
  \ into B. The following statement would have the same effect, except that every\
  \ time you call it, you allocate a new array. In some cases, it’s more efficient\
  \ to use an existing array to store the results.\n\nClick here to view code image\n\
  \n```python\nimport numpy as np\nA = np.linspace(0, np.pi, 10)\nB = np.sin(A)\n\
  ```\n\nTo see all the arguments available to be called for each of these functions,\
  \ use the `np.info` command.\n\n![](img/6e45221a8147f2442c653a3d4a866570_789_0.png)\n\
  \nClick here to view code image\n\n```python\nnumpy.info(numpy.function_name)\n\
  ```\n\nFor example, the following commands, given from within IDLE, provide manageable\
  \ chunks of information on specific numpy functions:\n\n```python\nimport numpy\
  \ as np\nnp.info(np.sin)\nnp.info(np.cos)\nnp.info(np.power)\n```\n\nMost of the\
  \ functions listed here are designed to operate on a single numpy array. A few functions\
  \ have variations. The numpy power function takes at least two arguments: X and\
  \ Y. Either or both can be an array; but if they are both arrays, they must have\
  \ the same shape. The effect of the function is to raise each X value to a power\
  \ specified by the corresponding element of Y.\n\nFor example, the following statements\
  \ raise each of the elements in array A to the power of 2 (that is, to square each\
  \ element).\n\n```python\n>>> import numpy as np\n>>> A = np.arange(6)\n>>> print(A)\n\
  [0 1 2 3 4 5]\n>>> print(np.power(A, 2))\n[ 0 1 4 9 16 25]\n```\n\nOther functions\
  \ are often used in conjunction with the numpy linspace function, which in turn\
  \ is heavily used in plotting equations, as you’ll see in Section 13.3, “Plotting\
  \ Lines with 'numpy' and 'matplotlib.'”\n\nFor example, the following statements\
  \ combine the **linspace** function with the **sin** function and the constant,\
  \ **pi**, to get a series of 10 values that reflects the value of the sine function\
  \ as its inputs increase from 0 to pi and then decrease back to 0.\n\nClick here\
  \ to view code image\n\n```python\n>>> A = np.linspace(0, np.pi, 10)\n>>> B = np.sin(A,\
  \ dtype='float16')\n>>> print(B)\n[0.000e+00 3.420e-01 6.431e-01 8.657e-01 9.849e-01\n\
  9.849e-01 8.662e-01 6.431e-01 3.416e-01 9.675e-04]\n```\n\nIn this example, the\
  \ data type **float16** was chosen so as to make the numbers easier to print. But\
  \ a still better way to do that is to use some of the formatting techniques from\
  \ Chapter 5. Now the results are easier to interpret.\n\nClick here to view code\
  \ image\n\n```python\n>>> B = np.sin(A)\n>>> print(' '.join(format(x, '5.3f') for\
  \ x in B))\n0.000 0.342 0.643 0.866 0.985 0.985 0.866 0.643\n0.342\n0.000\n```\n\
  \nThis small data sample demonstrates the behavior of the sine function. The sine\
  \ of 0 is 0, but as the inputs increase toward pi/2, the results approach 1.0; then\
  \ they approach 0 again as the inputs increase toward pi.\n\n## 13.2 DOWNLOADING\

  \n参数 `title_str` 包含在图表显示时放置在顶部的文本。显示图例是一个两步操作：\n\n- 首先，当你调用 `plt.plot` 方法来绘制特定线条时，传递一个名为\
  \ `label` 的命名参数。在此参数中，传递要为相应线条打印的文本。\n- 在调用 `plt.show` 函数之前，调用 `plt.legend`（无参数）。\n\

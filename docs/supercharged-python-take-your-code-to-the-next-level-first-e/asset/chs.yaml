  \ by 2.\n\n```\nteam_a['Rating'] *= 2\n```\n\nYou can also append new rows of data\
  \ at any time by using the `np.append` function. Here’s an example:\n\nClick here\
  \ to view code image\n\n\n\n\n\n最后，你可以使用 `savetxt` 函数将数组写回文本文件，该函数有多个参数。\n\n![](img/6e45221a8147f2442c653a3d4a866570_864_0.png)\n\
  \n单击此处查看代码图片\n\n```\nnp.savetxt( fname, array, fmt='%.18e', newline='\\n',\nheader='',\
  \ footer='')\n```\n\n文本文件会自动打开，前提是 _fname_ 是合法目标。格式字符串 _fmt_ 并不像前面所示的是 _dtype_ 数组。相反，它是一个使用百分号来指定字段的格式字符串，如第\
  \ 5 章“精确格式化文本”中所示。下面是一个使用本节开发的数据数组 `team_a` 的示例。\n\n单击此处查看代码图片\n\n```\nfmt_str =\
  \ '%i, %.1f, %i, %.1f, %s'\nnp.savetxt('team_data.txt', team_a, fmt=fmt_str)\n```\n\
  \n## 第 13 章总结\n\n你可以使用 **numpy** 包完成的事情范围令人惊叹。过去两章都专门讨论了该主题，但我们还远未穷尽。\n\n本章介绍了绘制二维图表的方法。基本思路是使用\

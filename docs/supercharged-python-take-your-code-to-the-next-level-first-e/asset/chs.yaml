- "## 5. 精确格式化文本\n\n在为商业和专业用途编程时，你希望格式化文本以创建外观精美的表格和演示文稿。在这方面，Python 拥有丰富的资源。它有几种方式来修改和增强以文本字符形式打印的信息。\n\
  \n本章详细介绍了所有三种方法，从字符串格式化运算符 %s 开始，它通常提供最快速、最简单的解决方案。为了获得最完整的控制，你可能希望使用 format 函数或\
  \ format 方法，它们支持许多选项，甚至允许你打印带有千位分隔符（,）的大数字。\n\n### 5.1 使用百分号运算符（%）进行格式化\n\n这是一个格式化输出的简单问题。假设你想以以下形式打印一个句子，其中\
  \ a、b 和 c 当前分别等于 25、75 和 100，但它们可以有任何值。你希望通过引用变量来得到以下结果。\n\n```\n25 plus 75 equals\
  \ 100.\n```\n\n这应该很容易。但是，如果你使用 **print** 函数，它会在数字 100 和点（.）之间放置一个空格，因此你会得到以下结果：\n\
  \n```\n25 plus 75 equals 100.\n```\n\n你如何处理那个不需要的空格？**print** 函数允许你通过将 **sep** 参数设置为空字符串来关闭打印字段之间默认的空格放置。但是在这种情况下，你必须自己放置所有空格。\n\
  \nClick here to view code image\n\n```\nprint(a, ' plus ', b, ' equals ', c, '.',\
  \ sep='')\n```\n\n这有效，但很丑陋。\n\n更好的方法是使用 **str** 类格式化运算符（%）来格式化输出，使用类似于 C 语言“printf”函数的格式说明符。以下是修改示例的方法：\n\
  \nClick here to view code image\n\n```\nprint('%d plus %d equals %d.' % (a, b, c))\n\
  ```\n\n这不是更好吗？\n\n表达式 `(a, b, c)` 实际上是一个包含三个参数的元组，每个参数分别对应格式字符串中 `%d` 的每个出现。`(a,\
  \ b, c)` 中的括号是严格要求的——除非只有一个参数，否则不需要。\n\nClick here to view code image\n\n```\n>>>\
  \ 'Here is a number: %d.' % 100\n'Here is a number: 100.'\n```\n\n当然，这些元素可以通过编程方式拆分。以下是一个示例：\n\
  \n```\nn = 25 + 75\nfmt_str = 'The sum is %d.'\nprint(fmt_str % n)\n```\n\n此示例打印以下内容：\n\
  \n```\nThe sum is 100.\n```\n\n字符串格式化运算符，%，可以出现在以下两个版本之一中。\n\n![](img/6e45221a8147f2442c653a3d4a866570_290_0.png)\n\
  \nClick here to view code image\n\n```\nformat_str % value    # Single value\nformat_str\
  \ % (values)   # One or more values\n```\n\n如果有多个 _value_ 参数，则与打印字段（由类型字符和百分号 %\
  \ 标记）对应的参数必须放在元组内。以下两个语句都是有效的：\n\n```\nprint('n is %d' % n)\nprint('n is %d and\
  \ m is %d' % (n, m))\n```\n\n下一个示例也有效，因为它将三个数字组织成一个元组。\n\n```\ntup = 10, 20, 30\n\
  print('Answers are %d, %d, and %d.' % tup)\n```\n\n这些语句打印以下内容：\n\n```\nAnswers are\
  \ 10, 20, and 30.\n```\n\n### 5.2 百分号（%）格式说明符\n\n格式说明符 %d 代表十进制整数。它是一种常见格式，但格式化运算符（%）也适用于其他格式，如表\
  \ 5.1 所示。\n\n# Table 5.1. Percent-Sign Specifiers\n\n| Specif | Meaning | Example\
  \ |\n|--------|---------|---------|\n| %d | Decimal integer. | 199 |\n| %i | Integer.\
  \ Same meaning as %d. | 199 |\n| %s | Standard string representation of the input.\
  \ This field says, “Produce a string,” but it can be used to print the standard\
  \ string representation of any data object. So this can actually be used with integers\
  \ if you choose. | Thomas |\n| %r | Standard %r representation of the input, which\
  \ is often the same as %s but uses the canonical representation of the object as\
  \ it appears in Python code. (For more information, see Section 5.7, “‘Repr’ Versus\
  \ String Conversion.”) | 'Bob' |\n| %x | Hexadecimal integer. | ff09a |\n| %X |\
  \ Same as %x, but letter digits A–F are uppercase. | FF09A |\n| %o | Octal integer.\
  \ | 177 |\n| %u | Unsigned integer. (But note that this doesn’t reliably change\
  \ signed integers into their unsigned equivalent, as you’d expect.) | 257 |\n\n\
  | 格式说明符 | 描述 | 示例输出 |\n|---|---|---|\n| `%f` | Floating-point number to be printed\
  \ in fixed-point format | `3.1400` |\n| `%F` | Same as `%f`. | `33.1400` |\n| `%e`\
  \ | Floating-point number, printing exponent sign (e). | `3.1400e+00` |\n| `%E`\
  \ | Same as `%e` but uses uppercase `E`. | `3.1400E+00` |\n| `%g` | Floating point,\
  \ using shortest canonical representation. | `7e-06` |\n| `%G` | Same as `%g` but\
  \ uses uppercase `E` if printing an exponent. | `7E-06` |\n| `%%` | A literal percent\
  \ sign (`%`). | `%` |\n\n以下是一个示例，使用 `int` 转换和十六进制输出来添加两个十六进制数：e9 和 10。\n\n```\n\
  h1 = int('e9', 16)\nh2 = int('10', 16)\nprint('The result is %x.' % (h1 + h2))\n\
  ```\n\n该示例打印\n\n```\nThe result is f9.\n```\n\n因此，将十六进制 e9 和十六进制 10 相加得到十六进制 f9，这是正确的。\n\
  此示例中 h1 和 h2 周围的括号是必要的。否则，示例将使用 h1 作为数据创建格式化字符串，然后尝试将该字符串与数字 h2 连接，从而导致错误。\n\n```\n\
  print('The result is %x.' % h1 + h2) # ERROR!\n```\n\n当你打印十六进制或八进制数字时，格式化运算符（%）不会在数字前面添加前缀。如果你想打印带有前缀的十六进制数字，你需要自己指定它们。\n\
  \n```\nprint('The result is 0x%x.' % (h1 + h2))\n```\n\n该语句打印以下内容：\n\n```\nThe result\
  \ is 0xf9.\n```\n\n在较大的字符串中打印子字符串（%s）是格式化运算符的另一种常见用法。以下是一个示例：\n\nClick here to view\
  \ code image\n\n```\ns = 'We is %s, %s, & %s.' % ('Moe', 'Curly',\n'Larry')\nprint(s)\n\
  ```\n\n这打印\n\n```\nWe is Moe, Curly, & Larry.\n```\n\n这些格式的行为可以通过使用宽度和精度数字来更改。每个打印字段的格式如下所示，其中\
  \ c 代表表 5.1 中的一个格式字符。\n\n![](img/6e45221a8147f2442c653a3d4a866570_295_0.png)\n\n\
  ```\n%[-][width][.precision]c\n```\n\n在此语法中，方括号表示可选项，并非字面意思。减号（–）指定打印字段内的左对齐。使用此技术，默认情况下所有数据类型均为右对齐。\n\
  但是，以下示例使用左对齐，这不是默认值，方法是将减号（–）作为说明符的一部分。\n\nClick here to view code image\n\n```\n\
  >>> 'This is a number: %-6d.' % 255\n'This is a number: 255 .'\n\n```\n\n至于语法的其余部分，格式说明符可以采用以下任何一种格式。\n\
  \n```\n%c\n%widthc\n%width.precisionc\n%.precisionc\n\n```\n\n对于字符串值，如果指定了 _width_，则文本将放置在大小为\
  \ _width_ 的打印字段中。子字符串默认右对齐，并用空格填充。如果打印字段小于子字符串的长度，则忽略 _width_。如果包含 _precision_，则指定字符串的最大大小，如果更长则会被截断。\n\
  \n以下是使用 10 空格打印字段宽度的示例。\n\nClick here to view code image\n\n```\nprint('My name\
  \ is %10s.' % 'John')\n\n```\n\n这打印以下内容，包括六个空格的填充。\n\n```\nMy name is     John.\n\
  \n```\n\n\n\n\n\n在要打印的整数的情况下，_width_ 数字的解释方式相同。但除此之外，_precision_ 指定一个较小的字段，数字在其中右对齐并用前导零填充。下面是一个示例：\n\
  \n```\nprint('Amount is %10d.' % 25)\nprint('Amount is %.5d.' % 25)\nprint('Amount\
  \ is %10.5d.' % 25)\n```\n\n这些语句打印\n\n```\nAmount is         25.\nAmount is 00025.\n\
  Amount is         00025.\n```\n\n最后，_width_ 和 _precision_ 字段控制浮点数的打印字段宽度和精度。精度是小数点右边的数字位数；如果需要，该数字包含尾随零。\n\
  下面是一个示例：\n\n```\nprint('result:%12.5f' % 3.14)\nprint('result:%12.5f' % 333.14)\n\
  ```\n\n这些语句打印以下内容：\n\n```\nresult:     3.14000\nresult:   333.14000\n```\n\n在这种情况下，数字\
  \ 3.14 被填充了尾随零，\n因为指定了 5 位精度。当\n精度字段小于要打印的值的精度时，数字会适当地向上或向下舍入。\n\n```\nprint('%\
  \ .4f' % 3.141592)\n```\n\n这个函数调用打印以下内容——在这种情况下，通过舍入产生了 4\n位精度：\n\n```\n3.1416\n\
  ```\n\n使用 %s 和 %r 格式字符使您能够处理任何类的数据。这些说明符会导致调用\n支持类字符串表示的类的内部方法之一，如第 9 章“类和魔术方法”中所述。\n\
  \n在许多情况下，%s 和 %r 说明符的效果没有区别。例如，用于 int 或\nfloat 对象时，任一说明符都会导致该数字被转换为您期望的字符串表示。\n\n\
  您可以在以下 IDLE 会话中看到这些结果，其中用户输入为 **粗体**。\n\n```\n>>> 'The number is %s.' % 10\nThe\
  \ number is 10.\n>>> 'The number is %r.' % 10\nThe number is 10.\n```\n\n从这些示例中，您可以看到\
  \ %s 和 %r 都只打印整数的标准字符串表示。\n在某些情况下，%s 和 %r 所指示的字符串表示之间存在差异。后者旨在\n获取对象在 Python 代码中出现的规范表示。\n\
  这两种表示形式之间的主要区别之一是，%r 表示在字符串周围包含引号，\n而 %s 不包含。\n\n```\n>>> print('My name is %r.'\
  \ % 'Sam')\nMy name is 'Sam'.\n>>> print('My name is %s.' % 'Sam')\nMy name is Sam.\n\
  ```\n\n## 5.3 百分号（%）可变长度打印字段\n\n使用格式运算符（%）一段时间后，您可能会想知道是否有方法为打印字段创建可变长度的宽度。例如，您可能希望在确定所需的最大宽度后打印一个表格，将其设置为所需宽度（例如，N\
  \ = 6，其中 N 是所需的最大尺寸），然后为每个打印字段赋予相同的大小。\n幸运的是，百分号格式化（%）提供了一种简单的方法来做到这一点。要创建可变宽度字段，请在通常放置指定固定宽度的整数的位置放置一个星号（*）。下面是一个示例：\n\
  \n```\n>>> 'Here is a number: %*d' % (3, 6)\n'Here is a number:   6'\n```\n\n以这种方式使用的每个星号都会创建对额外参数的需求。该参数首先出现，位于它应用于的数据对象之前。因此，元组中两个参数的顺序是（1）打印字段宽度和（2）要打印的数据。\n\
  您可以打印其他类型的数据，例如字符串。\n\n```\n>>> 'Here is a number: %*s' % (3, 'VI')\n'Here is a\
  \ number:  VI'\n```\n\n同样，第一个参数是打印字段宽度——在此示例中为 3。第二个参数是要打印的数据——在此示例中为字符串 'VI'。\n\
  您可以在格式字符串中包含多个可变宽度打印字段的使用。请记住，格式字符串中出现的每个星号都必须有额外的参数。因此，如果您想一次格式化 **两个** 这样的数据对象，则总共需要\
  \ **四个** 参数。下面是一个示例：\n\n```\n>>> 'Item 1: %*s, Item 2: %*s' % (8, 'Bob', 8,\n'Suzanne')\n\
  'Item 1:      Bob, Item 2:   Suzanne'\n```\n\n这些参数——全部放在参数后面的元组中（顺便说一句，需要括号）——是\
  \ 8、'Bob'、8 和 'Suzanne'。\n这四个参数的含义如下：\n\n- 第一个打印字段宽度为 8。\n- 第一个要打印的数据对象是 'Bob'（即按原样打印字符串）。\n\
  - 第二个打印字段宽度为 8。\n- 第二个要打印的数据对象是 'Suzanne'。\n\n如前所述，这个数字可以是一个变量，其值在运行时确定。下面是一个示例：\n\
  \n```\n>>> n = 8\n>>> 'Item 1: %*s, Item 2: %*s' % (n, 'Bob', n,\n'Suzanne')\n'Item\
  \ 1: Bob, Item 2: Suzanne'\n```\n\n所有参数——包括字段宽度参数（在此示例中为 n）——都放在百分号运算符（%）后面的元组中。\n\
  可变长度宽度功能可以与其他功能结合使用。例如，您可以使用 %r 说明符而不是 %s；这对要打印的数字没有影响，但会导致字符串带引号打印。\n\n```\n>>>\
  \ n = 9\n>>> 'Item 1: %*r, Item 2: %*r' % (n, 'Bob', n,\n'Suzanne')\n\"Item 1: \
  \ 'Bob', Item 2: ' Suzanne'\"\n```\n\n您还可以创建可变长度精度指示器。格式运算符（%）的一般规则如下：\n\n> 通常在格式代码中放置整数的地方，您可以改为放置一个星号（*）；并且对于每个这样的星号，您必须在参数列表中放置一个相应的整数表达式。\n\
  \n例如，下面的语句将数字格式化为如果说明符是 `'%8.3f'`：\n\n```\n>>> '%*.*f' % (8, 3, 3.141592)\n' 3.142'\n\
  ```\n\n## 5.4 全局“FORMAT”函数\n\nPython 的两个密切相关的功能为您提供了更大的控制力来规范规格。全局 `format` 函数允许指定一个打印字段。例如，它提供了一种简单的方法来添加千位分隔符的逗号。\n\
  \n```\n>>> big_n = 10 ** 12  # big_n 是 10 的 12 次方\n>>> format(big_n, ',')\n'1,000,000,000,000'\n\
  ```\n\n这只是您可以使用 **format** 函数所做事情的一个提示。本节仅介绍了该函数功能的入门。第 5.8 节“‘format’函数和方法的‘spec’字段”描述了您可以与该函数一起使用的格式规范（或\
  \ **_spec_**）的其他语法元素。\n\n**format** 函数与字符串类（**str**）的 **format** 方法密切相关。\n\n当 **format**\
  \ 方法处理字符串时，它会分析格式说明符以及用作输入的数据对象。它通过为每个单个字段调用全局 **format** 函数来执行此分析。\n\n**format**\
  \ 函数随后为数据对象的类调用 `__format__` 方法，如第 9 章中所述。此过程的优点在于，它允许每种类型（包括您可能编写的任何新类）与所有格式说明符语法交互，或者选择忽略它。\n\
  \n图 5.1 显示了涉及的各个函数之间的控制流：字符串类的 **format** 方法、全局 **format** 函数，以及最后每个类中的 `__format__`\
  \ 方法。\n\n![](img/6e45221a8147f2442c653a3d4a866570_304_0.png)\n\n# 图 5.1. 格式化例程之间的控制流\n\
  \n该类可以选择直接处理此方法，也可以不选择。默认情况下，如果未定义 `__format__`，则调用该类的 `__str__` 方法。\n\n![](img/6e45221a8147f2442c653a3d4a866570_304_1.png)\n\
  \n```\nformat(data, spec)\n```\n\n此函数在评估数据并根据规范字符串 `spec` 进行格式化后返回一个字符串。后一个参数是包含打印单个项目的规格的字符串。\n\
  \n下面显示的语法提供了 `spec` 语法的简化视图。它省略了一些功能，例如填充和对齐\n\n\ncharacters, as well as the use\
  \ of o in right justifying and padding\na number. To see the complete syntax of\
  \ _spec_, see Section 5.8,\n“The ‘spec’ Field of the ‘format’ Method.”\n\n![](img/6e45221a8147f2442c653a3d4a866570_305_0.png)\n\
  \nIn this syntax, the brackets are not intended literally but\nsignify optional\
  \ items. Here is a summary of the meaning.\nThe function attempts to place the string\
  \ representation of\nthe data into a print field of _width_ size, justifying text\
  \ if\nnecessary by padding with spaces. Numeric data is right\njustified by default;\
  \ string data is left justified by default.\nThe comma ( , ) indicates insertion\
  \ of commas as thousands\nplace separators. This is legal only with numeric data;\n\
  otherwise, an exception is raised.\nThe _precision_ indicates the total number of\
  \ digits to print\nwith a floating-point number, or, if the data is not numeric,\
  \ a\nmaximum length for string data. It is not supported for use with\nintegers.\
  \ If the _type_char is `f`, then the precision indicates a\nfixed number of digits\
  \ to print to the right of the decimal point.\nThe _type_char is sometimes a radix\
  \ indicator, such as `b` or\n`x` (binary or hexadecimal), but more often it is a\
  \ floating-point\nspecifier such as `f`, which indicates fixed-point format, or\
  \ `e` and\n`g`, as described later in Table 5.5.\nTable 5.2 gives some examples\
  \ of using this specification. You\ncan figure out most of the syntax by studying\
  \ these examples.\n\n# Table 5.2. Sample Format Specifiers for the “format” Function\n\
  \n| Format specification | Meaning |\n|---|---|\n| ' , ' | Displays thousands place\
  \ separators as part of a number—for example, displaying 1000000 as 1,000,000. |\n\
  | ' 5 ' | Specifies a minimum print-field width of 5 characters. If the information\
  \ to be displayed is smaller in size, it is justified by being padded. Numbers are\
  \ right justified by default; strings are left justified by default. |\n| ' 1 0\
  \ ' | Specifies a minimum print-field width of 10 characters. If the representation\
  \ of the object is smaller than 10 characters, it is justified within a field that\
  \ wide. |\n| ' 1 0 , ' | Specifies a minimum print-field width of 10 characters\
  \ and also displays thousands place separators. |\n\nSpecifies a minimum print-field\
  \ width of 10. If the data is a string, 5 characters is a print-field maximum and\
  \ anything larger is truncated. If the data is floating point, the field displays\
  \ at most 5 digits total to the left and right of the decimal point; rounding is\
  \ performed, but if the display size still exceeds the space allowed, the number\
  \ is displayed in exponential format, such as `3+010e`. The precision field (5 in\
  \ this case) is not valid for integers.\n\nSame as above, but print-field width\
  \ is 8 and precision is 4.\n\nSpecifies a minimum print-field width of 10 and precision\
  \ of 7, (total number of digits to the left and right), **and** it displays thousands\
  \ place separators.\n\nFixed-point display. Uses a print-field width of 10 and displays\
  \ exactly 3 digits to the right of the decimal point. Rounding up or down, or putting\
  \ in trailing zeros, is performed as needed to make the number of digits come out\
  \ exactly right.\n\nUses a print-field width of 10 and displays exactly 5 digits\
  \ to the right of the decimal point.\n\nDisplays exactly 3 digits to the right of\
  \ the decimal point. There is no minimum width in this case.\n\n| 'b | Uses binary\
  \ radix. |\n| ' | |\n| '6 | Uses binary radix; right justifies numbers within a\
  \ field of 6 |\n| b' | characters. |\n| 'x | Uses hexadecimal radix. |\n| ' | |\n\
  | '5 | Uses hexadecimal radix; right justifies numbers within a field of 5 |\n|\
  \ x' | characters. |\n| 'o | Uses octal radix. |\n| ' | |\n| '5 | Uses octal radix;\
  \ right justifies numbers within a field of 5 |\n| o' | characters. |\n\nThe remainder\
  \ of this section discusses the features in more detail, particularly width and\
  \ precision fields.\nThe thousands place separator is fairly self-explanatory but\
  \ works only with numbers. Python raises an exception if this specifier is used\
  \ with data that isn’t numeric.\nYou might use it to format a large number such\
  \ as 150 million.\n\n```\n>>> print(format(n, ', '))\n150,000,000\n```\n\nThe width\
  \ character is used consistently, always specifying a minimum print-field width.\
  \ The string representation is padded —with spaces by default—and uses a default\
  \ of left justification for strings and right justification for numbers. Both the\
  \ padding character and justification can be altered, however, as explained later\
  \ in this chapter, in Section 5.8.2, “Text Justification: ‘fill’ and ‘align’ Characters.”\n\
  \nHere are examples of justification, padding, and print fields. The single quotation\
  \ marks implicitly show the extent of the print fields. Remember that numeric data\
  \ (150 and 99, in this case) are right justified by default, but other data is not.\n\
  \n```\n>>> format('Bob', '10')\n'Bob '\n>>> format('Suzie', '7')\n'Suzie '\n>>>\
  \ format(150, '8')\n' 150'\n>>> format(99, '5')\n' 99'\n```\n\nThe width is always\
  \ a print-field minimum, not a maximum. A width field does not cause truncation.\n\
  \nThe precision specifier works differently, depending on the kind of data it’s\
  \ applied to. With string data, the precision is a print-field maximum, and it can\
  \ cause truncation. With floating-point fields, precision specifies the maximum\
  \ number of total characters to the left and right of the decimal point—not counting\
  \ the decimal point itself—and thereby rounds up or down as needed. Here’s an example:\n\
  \n```\n>>> format('Bobby K.', '6.3')\n'Bob   '\n>>> format(3.141592, '6.3')\n' 3.14'\n\
  ```\n\nBut if the `f` type specifier is also used, it specifies fixed-point display\
  \ format, and that changes the rules for floating point. With fixed-point format,\
  \ the precision specifies the number of digits to the right of the decimal point,\
  \ unconditionally.\n\nThe `format` function uses rounding or padding with trailing\
  \ zeros, as needed, to achieve the fixed number of digits to the right of the decimal\
  \ point. Here’s an example:\n\n```\n>>> format(3.141592, '9.3f')\n'   3.142'\n>>>\
  \ format(100.7, '9.3f')\n' 100.700'\n```\n\nAs you can see, the fixed-point format\
  \ is useful for placing numbers in columns in which the decimal point lines up nicely.\
  \ As mentioned earlier, Section 5.8 discusses the complete syntax for _spec_, which\
  \ is used by both the global `format` function and the `format` method.\n\n## 5.5\
  \ INTRODUCTION TO THE “FORMAT” METHOD\n\nTo get the most complete control over formatting,\
  \ use the **format** method. This technique contains all the power of the global\
  \ **format** function but is more flexible because of its ability to handle multiple\
  \ print fields.\n\nLet’s return to the example that started this chapter. Suppose\
  \ you have three integer variables (a, b, and c) and you want to print them in a\
  \ sentence that reads as follows:\n\n```\n25 plus 75 equals 100.\n```\n\nThe **format**\
  \ method provides a smooth, readable way to produce this print string.\n\nClick\
  \ here to view code image\n\n```\nprint('{} plus {} equals {}'.format(25, 75, 100))\n\
  ```\n\nEach occurrence of {} in the format string is filled in with the string representation\
  \ of the corresponding argument.\n\n![](img/6e45221a8147f2442c653a3d4a866570_311_0.png)\n\
  \nClick here to view code image\n\n```\nformat_specifying_str.format(args)\n```\n\
  \nLet’s break down the syntax a little. This expression passes through all the text\
  \ in _format_specifying_str_ (or just “format string”), except where there’s a print\
  \ field. Print fields\n\nare denoted as “{}.” Within each print field, the value\
  \ of one of\nthe _args_ is printed.\n\nIf you want to print data objects and are\
  \ not worried about\nthe finer issues of formatting, just use a pair of curly braces,\
  \ {},\nfor each argument. Strings are printed as strings, integers are\nprinted\
  \ as integers, and so on, for any type of data. Here’s an\nexample:\n\nClick here\
  \ to view code image\n\n```\nfss = '{} said, I want {} slices of {}.'\n\nname =\
  \ 'Pythagoras'\npi = 3.141592\nprint(fss.format(name, 2, pi))\n```\n\nThis prints\n\
  \nClick here to view code image\n\n```\nPythagoras said, I want 2 slices of 3.141592.\n\
  ```\n\nThe _arg_ values, of course, either can be constants or can be\nsupplied\
  \ by variables (such as _name_ and _pi_ in this case).\nCurly braces are special\
  \ characters in this context. To print\n**literal** curly braces, not interpreted\
  \ as field delimiters, use {{ and\n}}. Here’s an example:\n\nClick here to view\
  \ code image\n\n```\nprint('Set = {{({{}}, {{}})}}'.format(1, 2))\n```\n\n\n\n\n\
  ## 5.6 按位置排序\n\n### （名称或编号）\n\n![](img/6e45221a8147f2442c653a3d4a866570_314_0.png)\n\
  \nClick here to view code image\n\n```\n{ [position] [!|r|s|a] [: spec ] }\n```\n\
  \n在 **format** 字符串中打印字段的语法中，方括号并非字面意思，而是表示可选项。对于第二个项，语法表示感叹号后跟 **r**、**s** 或 **a**，但不超过其中一个；我们将在下一节中介绍该语法。\n\
  \n_spec_ 是一系列可能复杂的格式化参数。本章从第 5.8 节开始介绍 _spec_，并解释所有可能的子字段。\n\n这种语法最简单的应用之一是使用单个\
  \ _position_ 指示符。\n\n```\n{ position }\n```\n\n_position_ 指示符通过使用数字或名称来指示所引用的参数。使用\
  \ _position_ 指示符可以让你按任意顺序引用参数。\n\n_position_ 指示符本身可以是索引编号或命名位置：\n\n```\npos_index\
  \ | pos_name\n```\n\n我们将逐一介绍这些内容。位置索引是指根据其基于零的索引引用 `format` 方法参数列表中的某个项的数字。位置名称需要与命名参数匹配，我们稍后会再提到。首先，让我们来看看位置索引，因为它们相对容易理解。\n\
  \n关于 `format` 方法参数的一般规则如下：\n\n> *\n> 对 format 方法的调用必须至少拥有与格式说明字符串中的打印字段数量一样多的参数，除非字段像本节末尾所示那样重复。但如果出现的参数多于打印字段，则多余的参数（最后给出的参数）将被忽略。\n\
  \n例如，请考虑以下 `print` 语句：\n\nClick here to view code image\n\n```\nprint('{}; {}; {}!'.format(10,\
  \ 20, 30))\n```\n\n这将打印\n\n```\n10; 20; 30!\n```\n\n你可以在位置字段中使用整数常量以逆序打印。这些是基于零的索引，因此编号为\
  \ 0、1 和 2。\n\nClick here to view code image\n\n```\nprint('The items are {2}, {1},\
  \ {0}'.format(10, 20, 30))\n```\n\n# 此语句打印\n\n```\nThe items are 30, 20, 10.\n```\n\
  \n你也可以使用基于零的索引编号来引用多余参数，即参数多于打印字段的情况。以下是一个示例：\n\nClick here to view code image\n\
  \n```\nfss = 'The items are {3}, {1}, {0}.'\nprint(fss.format(10, 20, 30, 40))\n\
  ```\n\n# 这些语句打印\n\n```\nThe items are 40, 20, 10.\n```\n\n请注意，引用超出范围的参数会引发错误。在此示例中有四个参数，因此它们的索引为\
  \ 0、1、2 和 3。在此示例中，没有索引编号是超出范围的引用。\n\n打印字段也可以根据参数名称与参数匹配。以下是一个示例：\n\nClick here to\
  \ view code image\n\n```\nfss = 'a equals {a}, b equals{b}, c equals {c}.'\nprint(fss.format(a=10,\
  \ c=100, b=50))\n```\n\n# 此示例打印\n\n```\na equals 10, b equals 50, c equals 100.\n\
  ```\n\n你也可以使用定位技术在输出中重复值。以下是一个示例：\n\n```\nprint('{0}, {0}, {1}, {1}'.format(100,\
  \ 200))\n```\n\n此示例打印\n\n```\n100, 100, 200, 200\n```\n\n位置排序具有一个高级功能，偶尔对某些应用很有用。通过更改格式字符串本身，你可以更改哪些部分的参数被选中以包含在打印字符串中。\n\
  \n例如，{0[0]:} 表示“选择第一个参数的第一个元素”。{0[1]:} 表示“选择第一个参数的第二个元素”。以此类推。\n\n以下是一个更完整的示例。请记住，像往常一样使用基于零的索引。\n\
  \n```\n>>> a_list = [100, 200, 300]\n>>> '{0[1]:}, {0[2]:}'.format(a_list)\n'200,\
  \ 300'\n```\n\n此技术也适用于命名位置。\n\n```\n>>> '{a[1]:}, {a[2]:}'.format(a=a_list)\n'200,\
  \ 300'\n```\n\n那么，保持对位置顺序的这种控制有什么意义呢？许多应用永远不需要它，但它使你能够根据需要使用格式字符串重新排序数据。例如，当你翻译成另一种自然语言且语言语法可能要求重新排序时，这特别有用。\n\
  \n一种情况可能涉及日语，如下示例所示：\n\n```\nif current_lang == 'JPN':\n    fss = '{0}はいつ{2}の{1}と会うのだろうか？'\n\
  else:\n    fss = \"When will {0} meet {1} at {2}'s?\"\nprint(fss.format('Fred',\
  \ 'Sam', 'Joe'))\n```\n\n根据 `current_lang` 的值，这可能会打印以下内容：\n\n```\nWhen will Fred\
  \ meet Sam at Joe's?\n```\n\n或者它会打印以下内容。请注意，名称的位置已更改，符合日语语法，该语法更改了某些名称的顺序。\n\nFredはいつJoeのSamと会うのだろうか？\n\
  \n## 5.7 “REPR” 与字符串转换\n\n在 Python 中，每种类型最多可能有两种不同的字符串表示形式。这可能看起来有些过度，但偶尔很有用。这源于\
  \ Python 是一种解释型语言。\n\n本节讨论 `str` 和 `repr` 转换之间的区别。但是，此处的所有信息同样适用于 `str` 和 `repr`\
  \ 的其他用途，例如 `%s` 和 `%r` 格式说明符。\n\n当你应用 `str` 转换时，该转换将返回数据的字符串等效形式，与 `print` 函数打印时完全相同。\n\
  \n```\nprint(10)  # This prints 10.\nprint(str(10))  # So does this!\n```\n\n但是，对于某些类型的数据，存在单独的\
  \ `repr` 转换，它与 `str` 不同。`repr` 转换将数据对象转换为其在源代码中的 _规范表示_——即，它在 Python 程序中的样子。\n\n\
  以下是一个示例：\n\n![](img/6e45221a8147f2442c653a3d4a866570_319_0.png)\n\n```\nprint(repr(10))\
  \  # This ALSO prints 10.\n```\n\n在这种情况下，打印的内容没有区别。但是字符串方面存在区别。字符串在内存中存储时没有引号；引号是通常只出现在源代码中的分隔符。此外，转义序列（如\
  \ \\n，即换行符）在存储时会被转换为特殊字符；同样，\\n 是源代码表示，而非实际存储内容。\n\n请看以下字符串 `test_str`：\n\n```\n\
  test_str = 'Here is a \\n newline! '\n```\n\n直接打印此字符串会显示以下内容：\n\n```\nHere is a\n\
  newline!\n```\n\n但是，对字符串应用 **repr** 然后再打印会产生不同的结果，本质上是说“显示源代码的规范表示”。这包括引号，尽管它们本身不是字符串的一部分，除非它们被嵌入。但是\
  \ **repr** 函数包含引号，因为它们是 Python 源代码中表示字符串所会出现的内容。\n\n```\nprint(repr(test_str))\n\
  ```\n\n此语句打印\n\n```\n'Here is a \\n newline.'\n```\n\n%s 和 %r 格式说明符以及 format 方法使你能够控制使用哪种表示样式。不带\
  \ repr 打印字符串参数的效果与直接打印它相同。以下是一个示例：\n\nClick here to view code image\n\n```\n>>>\
  \ print('{}'.format(test_str))\nHere is a\nnewline!\n```\n\n使用 !r 修饰符会导致使用参数的 repr\
  \ 版本——即，对数据应用 repr 转换。\n\nClick here to view code image\n\n```\n>>> print('{!r}'.format(test_str))\n\
  'Here is a \\\\n newline! '\n```\n\n!r 的使用与位置排序正交。两者可以相互独立使用，不会相互干扰。那么，你能看出以下示例的作用吗？\n\
  \nClick here to view code image\n\n```\n>>> print('{1!r} loves {0!r}'.format('Joanie',\n\
  'ChaCha'))\n'ChaCha' loves 'Joanie'\n```\n\n在此示例中，花括号内的格式字符起两个作用。首先，它们使用位置索引将“Joanie\
  \ loves ChaCha”反转；然后，!r 格式导致两个名称带引号打印，这是规范表示的一部分。\n\n\n\n\n\n## 5.8 “FORMAT” 函数和方法中的“SPEC”\
  \ 字段\n\n本节及其所有子节均适用于全局 format 函数和 format 方法。但是，本章其余部分中的大多数示例都假设使用 format 方法，这就是为什么它们在打印字段\
  \ { } 和冒号 (:) 的上下文中显示 spec 的原因。\n\nspec（格式说明符）的语法是 format 方法语法中最复杂的部分。每个部分都是可选的，但如果使用，必须遵循所示的顺序。（方括号表示这些项目均为可选。）\n\
  \n```\n[ [ fill ]align ][ sign ][ # ][ 0 ][ width ][ , ][ .prec ][ type ]\n```\n\
  \n这里的项目大多相互独立。Python 根据位置和上下文解释每个项目。例如，_prec_（精度）如果出现，则紧跟在小数点 (.) 之后。\n\n查看示例时，请记住，只有在将\
  \ _spec_ 与全局 **format** 函数一起使用时，才使用花括号和冒号，而不与 **format** 方法一起使用。使用 **format** 函数时，您可以包含\
  \ _align_、_sign_、`0`、_width_、_precision_ 和 _type_ 说明符，但不包含花括号或冒号。以下是一个示例：\n\n```\n\
  s = format(32.3, '<+08.3f')\n```\n\n### 5.8.1 打印字段宽度\n\n常用项目之一是打印字段 _width_，指定为整数。要打印的文本将以此大小的字段显示。如果文本短于此宽度，则默认情况下，它将被对齐，并用空格填充额外的空格。\n\
  \n**位置**：如语法显示所示，_width_ 项目位于 _spec_ 语法的中间。与 **format** 方法一起使用时，_width_ 始终紧跟在冒号\
  \ (:) 之后，_spec_ 语法的其余部分也是如此。\n\n以下示例展示了宽度规范如何应用于两个数字：777 和 999。该示例使用星号 (*) 来帮助说明打印字段的开始和结束位置，但除此之外，这些星号只是为了说明而添加的普通字符。\n\
  \n```\nn1, n2 = 777, 999\nprint('**{:10}**{:2}**'.format(n1, n2))\n```\n\n这将打印\n\
  \n```\n** 777**999**\n```\n\n数字 777 在较大的打印字段（10）内右对齐。这是因为，默认情况下，数值数据右对齐，字符串数据左对齐。\n\
  \n数字 999 超过了其打印字段大小（2）的长度，因此它按原样打印。不会执行截断。\n\n宽度规范在表格中经常很有用。例如，假设您想打印一个整数表，但希望它们对齐。\n\
  \n```\n10\n2001\n2\n55\n144\n2525\n1984\n```\n\n打印这样的表格很容易。只需使用 `format` 方法，并设置一个比您预期的最长数字更宽的打印字段宽度。由于数据是数值，默认情况下它是右对齐的。\n\
  \n```\n'{:5}'.format(n)\n```\n\n打印字段宽度与大多数其他功能正交。上一节中的“ChaCha loves Joanie”示例可以修订为：\n\
  \n```\nfss = '{1!r:10} loves {0!r:10}!!'\nprint(fss.format('Joanie', 'ChaCha'))\n\
  ```\n\n这将打印\n\n```\n'ChaCha' loves 'Joanie' !!\n```\n\n此处的输出与先前的“ChaCha and Joanie”示例类似，但为两个参数添加了\
  \ 10 的打印字段宽度。请记住，宽度规范必须出现在冒号右侧；否则，它将作为位置号起作用。\n\n### 5.8.2 文本对齐：“fill” 和 “align”\
  \ 字符\n\n_fill_ 和 _align_ 字符是可选的，但 _fill_ 字符只有在 _align_ 字符存在时才能出现。\n\n```\n[[fill]align]\n\
  ```\n\n**位置**：如果这些项目出现在打印字段规范中，则位于语法的所有其他部分之前，包括 _width_。以下是包含 _fill_、_align_ 和\
  \ _width_ 的示例：\n\n```\n{:->24}\n```\n\n下一个示例在上下文中使用此规范：\n\n```\nprint('{:->24}'.format('Hey\
  \ Bill G, pick me!'))\n```\n\n这将打印\n\n```\n----Hey Bill G, pick me!\n```\n\n让我们检查此打印字段\
  \ `{:->24}` 的每个部分。以下是分解。\n\n- 当使用 **format** 方法（但不是全局 **format** 函数）时，冒号 (:) 是打印字段规范中出现的第一个项目。\n\
  - 冒号之后，出现 _fill_ 和 _align_ 字符。减号 (-) 是此处的填充字符，对齐方式是右对齐 (>).\n- 指定 _fill_ 和 _align_\
  \ 后，给出了打印字段 _width_ 24。\n\n由于要打印的参数 ('Hey Bill G, pick me! ') 长度为 20 个字符，但打印字段宽度为\
  \ 24 个字符，因此使用四个填充字符（在此情况下为减号）进行填充。\n\n填充字符可以是花括号以外的任何字符。请注意，如果您想用零填充数字，也可以使用第 5.8.4\
  \ 节“前导零字符 (0)”中描述的 '0' 说明符。\n\n_align_ 字符必须是表 5.3 中列出的四个值之一。\n\n| 对齐字符 | 含义 |\n\
  |---|---|\n| < | 左对齐。这是字符串数据的默认值。 |\n| > | 右对齐。这是数字的默认值。 |\n| ^ | 将文本居中于打印字段中间。（当文本无法完美居中时，这会略微偏向左对齐。）\
  \ |\n| = | 将所有填充字符放在符号字符 (+ 或 -) 和要打印的数字之间。此规范仅对数值数据有效。 |\n\n只有在填充字符后紧跟 `align`\
  \ 字符 (<, >, ^, 或 =) 时，填充（或补齐）字符才被识别为填充字符。\n\n```\nprint('{:>7}'.format('Tom')) \
  \  # Print '   Tom'\nprint('{:@>7}'.format('Lady'))   # Print '@@@Lady'\nprint('{:*>7}'.format('Bill'))\
  \   # Print '***Bill'\n```\n\n在这些示例的第一个中，未指定 _fill_ 字符，因此使用默认值空格来填充打印字段。在第二和第三种情况下，分别使用了填充字符和号\
  \ (@) 和星号 (*)。\n\n如果我们改用 < 来指定左对齐，填充将放在右侧（尽管请注意，左对齐是字符串的默认值）。因此，前面的示例将修订为：\n\n```\n\
  print('{:<7}'.format('Tom'))   # Print 'Tom   '\nprint('{:@<7}'.format('Lady'))\
  \   # Print 'Lady@@@'\nprint('{:*<7}'.format('Bill'))   # Print 'Bill***'\n```\n\
  \n接下来的几个示例演示了使用 ^ 来指定数据居中；填充出现在文本的两侧。\n\n```\nfss = '{:^10}Jones'\nprint(fss.format('Tom'))\
  \   # Print '   Tom Jones'\nfss = '{:@^10}'\nprint(fss.format('Lady'))   # Print\
  \ '@@Lady@@@'\n```\n\n```\nfss = '{:*^10}'\nprint(fss.format('Bill'))  # Print '***Bill***'\n\
  ```\n\n最后，接下来的示例展示了使用 = 来指定符号字符 (+ 或 -) 与数值数据之间的填充。第二种情况使用零作为填充字符。\n\n```\nprint('{:=8}'.format(-1250))\
  \   # Print '-   1250'\nprint('{:=08}'.format(-1250))  # Print '-0001250'\n```\n\
  \n> Note\n> 请记住（如果我们对此有点啰嗦，抱歉），spec 语法的所有示例也适用于全局 format 函数。但是，与 format 方法不同，format\
  \ 函数不使用花括号来创建多个打印字段。它一次只处理一个打印字段。以下是一个示例：\n\n```\nprint(format('Lady', '@<7')) \
  \  # Print 'Lady@@@'\n```\n\n### 5.8.3 “sign” 字符\n\n_sign_ 字符（如果使用，通常是加号 (+)）有助于确定是否在数值字段中打印加号或减号。\n\
  \n**位置：** _sign_ 字符位于 _fill_ 和 _align_ 字符之后（如果包含），但在 _spec_ 的其他部分之前。\n\n\n\n特别是，它位于\
  \ _width_ 之前。表 5.4 列出了此字符的可能值。\n\n# 表 5.4. “format” 方法的“符号”字符\n\n| Character   |\
  \ Meaning   |\n|-------------|-----------|\n| +           | 对非负数打印加号（+）；对负数打印减号（−），与往常一样。\
  \   |\n| -           | 仅对负数打印减号。这是默认行为。   |\n| (blank space) | 对非负数，在加号应出现的位置打印空格；对负数打印减号，与往常一样。这对于在制表符中对齐数字非常有用，无论是否存在负号。\
  \   |\n\n一个简单的示例说明了符号字符的用法。\n\nClick here to view code image\n\n```\nprint('results>{:\
  \ },{:+},{:-}'.format(25, 25, 25))\n```\n\n此示例打印\n\n```\nresults> 25,+25,25\n```\n\
  \n请注意，即使第一个 25 是非负数，它前面也有一个额外的空格；但是，如果打印字段有确定的宽度（本例中没有），则该字符不会产生任何差异。\n\n下一个示例将相同的格式应用于三个负值（−25）。\n\
  \nClick here to view code image\n\n```\nprint('results>{: },{:+},{:-}'.format(-25,\
  \ -25,\n-25))\n```\n\n此示例打印以下输出，说明负数始终带有减号打印。\n\n```\nresults>-25,-25,-25\n```\n\
  \n## 5.8.4 前导零字符 (0)\n\n该字符指定为数字填充 0 数字字符，导致使用“0”代替空格。虽然您可以通过指定对齐和填充字符来实现类似效果，但此技术略显简洁。\n\
  \n**放置：** 如果使用，此字符紧跟在 _width_ 规范之前。本质上，它相当于在宽度本身前添加前导零前缀 (0)。\n\n例如，以下语句会在要显示的文本小于打印字段宽度时打印前导零。\n\
  \nClick here to view code image\n\n```\ni, j = 125, 25156\nprint('{:07} {:010}.'.format(i,\
  \ j))\n```\n\n这将打印\n\n```\n0000125 0000025156.\n```\n\n这里是另一个示例：\n\nClick here to\
  \ view code image\n\n```\nprint('{:08}'.format(375)) # This prints 00000375\n```\n\
  \n也可以通过使用 _fill_ 和 _align_ 字符来实现相同的结果，但由于您不能在不显式指定 _align_ 的情况下指定 _fill_，因此该方法略显冗长。\n\
  \n```\nfss = '{:0>7} {:0>10}'\n```\n\n尽管这两种方法——将 0 指定为填充字符和指定前导零——在效果上通常相同，但存在两者产生不同结果的情况。填充字符不是数字本身的一部分，因此不受下一节中描述的逗号的影响。\n\
  \n还有与加号/减号的交互作用。如果您尝试以下内容，您会看到加号 (+) 打印位置的差异。\n\nClick here to view code image\n\
  \n```\nprint('{:0>+10} {:+010}'.format(25, 25))\n```\n\n此示例打印\n\n```\n0000000+25\
  \ +000000025\n```\n\n## 5.8.5 千位分隔符\n\n**format** 方法最方便的功能之一是能够在数字输出中使用千位分隔符。您有多少次见过如下输出？\n\
  \nClick here to view code image\n\n```\nThe US owes 21035786433031 dollars.\n```\n\
  \n这到底是多少？人们会眼花缭乱，这对大多数政治家来说可能是个好结果。它看起来只是“一个大数字”。\n如果按以下方式打印，这个数字会更易读——尽管对于大多数凡人来说仍然太大，难以理解。但如果您有一点数字天赋，您会看到这不仅仅是\
  \ 2100 万或 210 亿，而是 **21 万亿**。\n\nClick here to view code image\n\n```\nThe US owes\
  \ 21,035,786,433,031 dollars.\n```\n\n**放置**：逗号跟在 _width_ 说明符之后，并在 _precision_ 说明符之前（如果存在）。逗号应为除\
  \ _precision_ 和 _type_（如果存在）之外的最后一项。\n\n您可能希望参考第 5.8.1 节开头的语法显示。\n\n以下示例使用 `{:,}`\
  \ 打印字段。这是一个简单的规范，因为它只是在冒号右侧紧跟一个逗号——全部位于打印字段内。\n\nClick here to view code image\n\
  \n```\nfss1 = 'The USA owes {:,} dollars.'\nprint(fss1.format(21000000000))\nfss2\
  \ = 'The sun is {:,} miles away.'\nprint(fss2.format(93000000))\n```\n\n这些语句打印\n\
  \nClick here to view code image\n\n```\nThe USA owes 21,000,000,000 dollars.\nThe\
  \ sun is 93,000,000 miles away.\n```\n\n下一个示例将逗号与 _fill_ 和 _align_ 字符 `*` 和 `>`\
  \ 结合使用。_width_ 说明符是 `12`。请注意，逗号 (`,`) 紧跟在 _width_ 之后；它是右花括号之前的最后一项。\n\n```\nn =\
  \ 4500000\nprint('The amount on the check was\n${:*>12,}'.format(n))\n```\n\n此示例打印\n\
  \n```\nThe amount on the check was $****4,500,000\n```\n\n打印宽度为 12，包括打印的数字（包括逗号，共九个字符）的空间；因此，此示例使用三个填充字符。此处的填充字符是星号\
  \ (*)。美元符号 ($) 不包含在此计算中，因为它是一个字面字符，原样打印。\n\n如果存在如第 5.8.4 节中描述的前导零字符（与 0 填充字符不同），则零也会与逗号分组。这里是一个示例：\n\
  \n```\nprint('The amount is {:011,}'.format(13000))\n```\n\n此示例打印\n\n```\nThe amount\
  \ is 000,013,000\n```\n\n在这种情况下，前导零与逗号分组，因为所有零都被视为数字本身的一部分。\n\n打印字段大小为 12（或任何其他\
  \ 4 的倍数）会与逗号产生冲突，因为初始逗号不能是有效数字的一部分。因此，Python 在该特殊情况下会添加一个额外的前导零。\n\nClick here to\
  \ view code image\n\n```\nn = 13000\nprint('The amount is {:012,}'.format(n))\n\
  ```\n\n这将打印\n\n```\nThe amount is 0,000,013,000\n```\n\n但是，如果将 0 指定为填充字符而不是前导零，则零不被视为数字的一部分，并且不会与逗号分组。请注意此处\
  \ 0 相对于右对齐 (>) 符号的位置。这次它位于该符号的左侧。\n\nClick here to view code image\n\n```\nprint('The\
  \ amount is {:0>11,}'.format(n))\n```\n\n这将打印\n\n```\nThe amount is 0000013,000\n\
  ```\n\n## 5.8.6 控制精度\n\n_precision_ 说明符是一个数字，主要用于浮点值，尽管也可以用于字符串。它会导致舍入和截断。浮点数的精度是要打印的最大位数，包括小数点左右两侧。\n\
  \n精度也可以用于定点格式（具有 **f** 类型说明符），以确保始终在小数点 *右* 侧打印精确的位数，帮助浮点值在表格中对齐。\n\n**放置**：精度始终是小数点\
  \ (.) 紧右侧的一个数字。它是 *spec* 字段中的最后一项，除了下一节中描述的单字母 *type* 说明符之外。\n\n![](img/6e45221a8147f2442c653a3d4a866570_337_0.png)\n\
  \n.precision\n\n以下是一些简单示例，其中精度用于限制打印的总位数。\n\nClick here to view code image\n\n```\n\
  pi = 3.14159265\nphi = 1.618\n\nfss = '{:.2} + {:.2} = {:.2}'\nprint(fss.format(pi,\
  \ phi, pi + phi))\n```\n\n这些语句打印以下结果。请注意，每个数字恰好有两个总位数：\n\n```\n3.1 + 1.6 = 4.8\n\
  ```\n\n由于舍入错误，此语句看起来不准确。对于每个数字，只打印两个总位数。为每个数字打印三位数会产生更好的结果。\n\nClick here to view\
  \ code image\n\n```\npi = 3.14159265\nphi = 1.618\n\nfss = '{:.3} + {:.3} = {:.3}'\n\
  print(fss.format(pi, phi, pi + phi))\n```\n\n这将打印\n\n```\n3.14 + 1.62 = 4.76\n```\n\
  \n在所有有限精度的情况下，出现的最后一位数字都会适当舍入。\n\n如果要使用 _precision_ 以定点格式打印数字，请将 _width_ 和 _precision_\
  \ 与打印字段末尾的 `f` 类型说明符结合使用。这里是一个示例：\n\nClick here to view code image\n\n```\nfss =\
  \ ' {:10.3f}\\n {:10.3f}'\nprint(fss.format(22.1, 1000.007))\n```\n\n这将打印\n\n\n\n\
  \n\n注意，在这种情况下，内容对齐得多么整齐。在此上下文中（使用 `f` 类型说明符时），精度指定的不是总位数，而是 _小数点右侧的位数_——如果需要，这些位数会用尾随零填充。\n\
  \n该示例可以与其他功能结合使用，例如千位分隔符，它位于宽度之后但精度之前。因此，在此示例中，每个逗号都紧跟在宽度说明符 10 之后。\n\n> Click here\
  \ to view code image\n\n```\nfss = ' {:10,.3f}\\n {:10,.3f}'\nprint(fss.format(22333.1,\
  \ 1000.007))\n```\n\n此示例打印\n\n```\n22,333.100\n1,000.007\n```\n\n定点格式 `f` 与 _宽度_\
  \ 和 _精度_ 结合使用，对于创建数字对齐的表格非常有用。下面是一个示例：\n\n> Click here to view code image\n\n```\n\
  fss = ' {:10.2f}'\nfor x in [22.7, 3.1415, 555.5, 29, 1010.013]:\n    print(fss.format(x))\n\
  ```\n\n此示例打印\n\n```\n22.70\n3.14\n555.50\n29.00\n1010.01\n```\n\n# ## 5.8.7 与字符串一起使用的“精度”（截断）\n\
  \n当与字符串一起使用时，_精度_ 说明符可能会导致截断。如果要打印的字符串长度大于 _精度_，则文本会被截断。下面是一个示例：\n\n> Click here\
  \ to view code image\n\n```\nprint('{:.5}'.format('Superannuated.')) # Prints\n\
  'Super'\nprint('{:.5}'.format('Excellent!')) # Prints\n'Excel'\nprint('{:.5}'.format('Sam'))\
  \ # Prints\n'Sam'\n```\n\n在这些示例中，如果要打印的字符串短于 _精度_，则没有影响。但下一个示例使用了 _填充_ 字符、_对齐_、_宽度_\
  \ 和 _精度_ 的组合。\n\n```\nfss = '{:*<6.6}'\n```\n\n# 让我们分解一下这些符号的含义。\n\n- _填充_ 和 _对齐_\
  \ 字符分别是 `*` 和 `<`。`<` 符号指定左对齐，因此如果需要，星号用于右侧填充。\n- _宽度_ 字符是 6，因此任何短于 6 个字符的字符串在左对齐后都会进行填充。\n\
  - _精度_（小数点后的字符）也是 6，因此任何长于 6 个字符的字符串都会被截断。\n\n# 让我们将此格式应用于多个字符串。\n\n```\nprint(fss.format('Tom'))\n\
  print(fss.format('Mike'))\nprint(fss.format('Rodney'))\nprint(fss.format('Hannibal'))\n\
  print(fss.format('Mortimer'))\n```\n\n这些语句很容易使用全局 `format` 函数来编写。请注意相似之处和差异；之前的示例涉及格式字符串\
  \ `'{ :*<6.6 }'`。\n\n```\nprint(format('Tom', '*<6.6'))\nprint(format('Mike', '*<6.6'))\n\
  print(format('Rodney', '*<6.6'))\nprint(format('Hannibal', '*<6.6'))\nprint(format('Mortimer',\
  \ '*<6.6'))\n```\n\n无论哪种情况——即，对于刚显示的任一代码块——输出均为\n\n```\nTom***\nMike**\nRodney\n\
  Hannib\nMortim\n```\n\n_宽度_ 和 _精度_ 不必相同。例如，以下格式指定宽度为 5，因此任何短于 5 的字符串都会被填充；但精度为 10，因此任何长于\
  \ 10 的字符串都会被截断。\n\n```\nfss = '{:*<5.10}'\n```\n\n# ## 5.8.8 “类型”说明符\n\n_spec_ 语法中的最后一项是\
  \ _类型_ 说明符，它影响要打印的数据的解释方式。它限于一个字符，并且具有表 5.5 中列出的值之一。\n\n**位置**：使用 _类型_ 说明符时，它是 _spec_\
  \ 语法中的最后一项。\n\n# ### 表 5.5. 格式方法识别的“类型”说明符\n\n| 类型字符 | 说明 |\n|---|---|\n| b | 以二进制显示数字。\
  \ |\n| c | 将数字转换为其 ASCII 或 Unicode 字符。 |\n| d | 以十进制格式显示数字（默认值）。 |\n| e | 使用指数格式显示浮点值，使用小写\
  \ e——例如，12e+20 。 |\n| E | 与 e 相同，但使用大写 E 显示——例如，12E+20。 |\n| f 或 F | 以定点格式显示数字。\
  \ |\n| g | 使用格式 e 或 f，以较短者为准。 |\n| G | 与 g 相同，但使用大写 E。 |\n| n | 使用本地格式显示数字。例如，不要打印\
  \ 1,200.34（美国格式），而使用欧洲格式：1.200,34 。 |\n| o | 以八进制格式（基数 8）显示整数。 |\n| x | 以十六进制格式显示整数，使用小写字母表示大于\
  \ 9 的数字。 |\n| X | 与 x 相同，但十六进制数字使用大写字母。 |\n\n将数字显示为百分比：乘以 100 然后添加百分号（%）。\n\n接下来的五个部分说明了\
  \ _类型_ 说明符的特定用途。\n\n# ## 5.8.9 以二进制基数显示\n\n要以二进制基数（基数 2）打印整数，请使用 `b` 说明符。结果是一系列\
  \ 1 和 0。例如，以下语句以二进制基数显示 5、6 和 16：\n\n> Click here to view code image\n\n```\nprint('{:b}\
  \ {:b} {:b}'.format(5, 6, 16))\n```\n\n这将打印以下内容：\n\n```\n101  110  10000\n```\n\n\
  您可以选择使用 # 说明符自动添加基数前缀，例如二进制的 **0b**。如果出现，此格式字符位于 _填充_、_对齐_ 和 _符号_ 字符之后，但在 _类型_ 说明符之前。（它也位于\
  \ _宽度_ 和 _精度_ 之前。）下面是一个示例：\n\n```\nprint('{:#b}'.format(7))\n```\n\n这将打印\n\n# #\
  \ 5.8.10 以八进制和十六进制基数显示\n\n八进制（基数 8）和十六进制（基数 16）基数由 `o`、`x` 和 `X` 类型说明符指定。后两个分别指定大于\
  \ 9 的数字的小写和大写十六进制。\n\n以下示例说明每种格式如何显示十进制 63：\n\n> Click here to view code image\n\
  \n```\nprint('{:o}, {:x}, {:X}'.format(63, 63, 63))\n```\n\n这也可以写成\n\n> Click here\
  \ to view code image\n\n```\nprint('{0:o}, {0:x}, {0:X}'.format(63))\n```\n\n无论哪种情况，这都打印\n\
  \n```\n77, 3f, 3F\n```\n\n同样，您可以使用 # 说明符让 `format` 方法自动插入基数前缀，如果出现，它位于 _填充_、_对齐_\
  \ 和 _符号_ 字符之后。下面是一个示例：\n\n> Click here to view code image\n\n```\nprint('{0:#o},\
  \ {0:#x}, {0:#X}'.format(63))\n```\n\n此语句打印\n\n```\n0o77, 0x3f, 0X3F\n```\n\n# ##\
  \ 5.8.11 显示百分比\n\n格式化的常见用途是将数字转换为百分比——例如，将 0.5 显示为 50%，将 1.25 显示为 125%。您可以自己执行此任务，但\
  \ % 类型说明符会自动化该过程。\n\n百分号格式字符 (%) 将值乘以 100 然后追加百分号。下面是一个示例：\n\n> Click here to view\
  \ code image\n\n```\nprint('You own {:%} of the shares.'.format(.517))\n```\n\n\
  此示例打印\n\n> Click here to view code image\n\n```\nYou own 51.700000% of the shares.\n\
  ```\n\n如果与 % 类型说明符结合使用 _精度_，则 _精度_ 控制小数点右侧的位数，与往常一样——但在先乘以 100 之后。下面是一个示例：\n\n>\
  \ Click here to view code image\n\n```\nprint('{:.2%} of {:.2%} of 40...'.format(0.231,\n\
  0.5))\n```\n\n这将打印\n\n```\n23.10% of 50.00% of 40...\n```\n\n与定点格式一样，如果要打印百分比以便在表格中整齐对齐，请同时指定\
  \ _宽度_ 和 _精度_ 说明符。\n\n# ## 5.8.12 二进制基数示例\n\n`format` 方法提供了以二进制、八进制或十六进制基数打印数值输出的工具。您可以将此功能与\
  \ `int` 转换结合使用，创建一个同时使用二进制输入和输出的二进制计算器——也就是说，其输入和输出功能是 1 和 0 的字符串。\n\n下一个示例执行二进制加法，并以十进制和二进制显示结果。\n\
  \n> Click here to view code image\n\n```\ndef calc_binary():\n    print('Enter values\
  \ in binary only!')\n    b1 = int(input('Enter b1:'), 2)\n    b2 = int(input('Enter\
  \ b2:'), 2)\n    print('Total is: {:#b}'.format(b1 + b2))\n    print('{} + {} =\
  \ {}'.format(b1, b2, b1 + b2))\n```\n\n下面是一个示例会话，用户输入为粗体。\n\n\n\n\n\n>>> calc_binary()\n\
  Enter values in binary only!\nEnter b1: 101\nEnter b2: 1010\nTotal is: 0b1111\n\
  5 + 10 = 15\n\n关键的格式说明字符串位于以下语句中：\n\n点击此处查看代码图片\n\n```\nprint('Total is: {:#b}'.format(b1\
  \ + b2))\n```\n\n冒号右侧有两个字符：井号（#），它会导致打印基数符号 0b；以及类型说明符 b，它会导致使用二进制基数，即基数为 2。\n\n\
  ```\n'{:#b}'\n```\n\n第二行输出使用简单的打印字段，默认输出十进制。\n\n```\n'{} + {} = {}'\n```\n\n## 5.9\
  \ 可变大小字段\n\n第 5.3 节解释了如何使用格式化操作符（%）来使用可变宽度打印字段。format 方法提供了相同的，甚至更多的灵活性。你可以将说明符语法的任何部分留空，以便稍后填充。\n\
  \n在 **format** 方法中，可变字段的一般规则是：在打印字段中放置一对嵌套的花括号 {}，通常你会在其中放置固定值。然后该方法扫描格式字符串并执行替换，将嵌套的\
  \ {} 小字段替换为参数列表中的相应项。最后，字符串按常规方式应用格式化。\n\n要填充的值是从参数列表中读取的。\n\n点击此处查看代码图片\n\n```\n\
  >>> 'Here is a num: {{:{}.{}}}'.format(1.2345, 10, 4)\n'Here is a num:         1.234'\n\
  ```\n\n这个示例的效果就好像写成如下形式，其中数字 10 和 4 分别替换了两组内部花括号（因此前一个示例与这个示例效果相同）：\n\n点击此处查看代码图片\n\
  \n```\n'Here is a num: {:10.4}'.format(1.2345)\n```\n\n在这种情况下，参数是整数表达式，因此可变长度示例也可以使用变量引用来编写：\n\
  \n点击此处查看代码图片\n\n```\na, b = 10, 4\n'Here is a num: {{:{}.{}}}'.format(1.2345, a,\
  \ b)\n```\n\n使用此方法应用参数的方式与格式化操作符（第 5.3 节）的工作方式略有不同。\n\n区别在于：当你以这种方式使用 **format**\
  \ 方法时，数据对象在参数列表中排在 _第一_ 位；改变格式的表达式紧随其后。即使有多个打印字段也是如此。例如：\n\n![](img/6e45221a8147f2442c653a3d4a866570_350_0.png)\n\
  \n```\n>>> '{:{} {:}}!'.format('Hi', 3, 'there', 7)\n'Hi   there   !'\n```\n\n请注意，使用此技术时，字符串默认左对齐。\n\
  \n建议使用位置数字来澄清顺序。使用这些数字有助于使表达式的含义更清晰、更可预测。刚才显示的示例可以修改为使用以下表达式：\n\n![](img/6e45221a8147f2442c653a3d4a866570_350_1.png)\n\
  \n```\n>>> '{0:{1}} {2:{3}}!'.format('Hi', 3, 'there', 7)\n'Hi   there   !'\n```\n\
  \n使用位置数字后，格式的含义更容易解释。通过查看本示例中数字的位置，你应该能够看出，位置索引 0 和 2（分别对应第一个和第三个参数位置）指的是传递给 **format**\
  \ 的第一个和第三个参数。\n\n同时，位置索引 1 和 3（分别对应第二个和第四个参数）指的是整数表达式 3 和 7，它们分别成为相应字段的打印字段宽度。\n\
  \n同样，下面的示例展示了如何使用位置索引来显示数字 3.141592，使用打印字段宽度为 8，并在小数点右侧固定显示 3 位小数。请注意，数字默认右对齐。\n\
  \n点击此处查看代码图片\n\n```\n>>> 'Pi is approx. {0:{1}.{2}f}'.format(3.141592, 8,\n3)\n\
  'Pi is approx.     3.142'\n```\n\n请记住，在这种情况下，8 和 3 都可以替换为任何整数表达式，包括变量，这正是此功能的全部意义所在。\n\
  \n点击此处查看代码图片\n\n```\n>>> a, b = 8, 3\n>>> 'Pi is approx. {0:{1}.{2}f}'.format(3.141592,\
  \ a,\nb)\n'Pi is approx.     3.142'\n```\n\n这个示例在效果上等同于以下内容：\n\n点击此处查看代码图片\n\n```\n\
  'Pi is approx. {0:8.3f}'.format(3.141592)\n```\n\n位置名称在此上下文中也非常有用，作为一种使格式化意图特别清晰的方式。以下是一个示例：\n\
  \n点击此处查看代码图片\n\n```\n>>> 'Pi is {pi:{fill}{align}{width}.\n{prec}f}'.format(\n...\
  \ pi=3.141592, width=8, prec=3, fill='0',\n... align='>')\n```\n\n同样，参数的值可以用数值和字符串变量填充，从而允许在代码执行期间调整这些值。\n\
  \n# 第 5 章 小结\n\nPython 核心语言提供了三种格式化输出字符串的技术。一种是在显示字符串上使用字符串类格式化操作符（%）；这些字符串包含类似于\
  \ C 语言中“printf”函数所使用的打印字段说明符。\n\n第二种技术涉及 **format** 函数。这种方法允许你不仅指定宽度和精度，还可以指定千位分组和百分比处理。\n\
  \n第三种技术是字符串类的 **format** 方法，它基于全局 **format** 函数，但提供了最多的灵活性，支持多个打印字段。\n\n接下来的两章将利用正则表达式包，将文本处理能力提升到更高水平。\n\
  \n# 第 5 章复习问题\n\n+   1 使用第一种主要技术——字符串类格式化操作符（%）有什么优点（如果有的话）？\n\n+   2 使用全局 `format`\
  \ 函数有什么优点（如果有的话）？\n\n+   3 与使用全局 `format` 函数相比，字符串类的 `format` 方法有什么优点（如果有的话）？\n\n\
  +   4 这两种技术——`format` 函数和字符串类的 `format` 方法——究竟有何关联（如果有的话）？\n\n+   5 反过来，这两种技术如何涉及单个类的\
  \ `__format__` 方法（如果有的话）？\n\n+   6 要将浮点数整齐地排列成一列打印表格，至少需要格式化操作符（%）的哪些功能？\n\n+  \
  \ 7 要将浮点数整齐地排列成一列打印表格，至少需要 `format` 方法的哪些功能？\n\n+   8 举出至少一个示例，说明 `repr` 和 `str`\
  \ 对某段数据提供了不同的表示。为什么 `repr` 版本会打印更多字符？\n\n+   9 `format` 方法允许你将零（0）指定为填充字符 `or` 作为数值表达式的前导零。这是否完全是冗余的语法？或者你能否举出至少一个示例，说明结果可能不同？\n\
  \n**10** 在三种技术——**format** 操作符（%）、全局 **format** 函数和 **string** 类的 **format** 方法中，哪些支持指定可变长度打印字段？\n\
  \n# 第 5 章建议练习题\n\n+   1 编写一个十六进制计算器程序，它接受任意数量的十六进制数（当用户输入空字符串时停止），然后再次以十六进制数输出总和。（提示：记住第\
  \ 1 章“基础回顾”中解释的 **int** 转换，它支持使用十六进制基数转换字符串。）\n\n+   2 编写一个二维数组程序，执行以下操作：以五行五列的形式获取整数输入。然后，通过查看整个集合所需的最大打印宽度（即最大数字的位数），确定表格中每个单元格的理想打印宽度。这应该是一个统一的宽度，但要包含表格中最大的条目。使用可变长度打印字段来打印此表格。\n\
  \n+   3 对浮点数执行与刚才描述的相同应用程序。表格的打印应将所有数字以整齐的列形式输出。\n\n\n\n\n"
- "## 6. 正则表达式，第一部分\n\n越来越多，最复杂的计算机软件都在处理 _模式_——例如，语音模式和图像识别。本章讨论的是前者：如何识别单词和字符的模式。虽然你不能仅凭这些技术构建一个人类语言翻译器，但它们是一个开始。\n\
  \n这就是正则表达式的用途。_正则表达式_ 是你指定的模式，使用特殊字符来表示指定字符、数字和单词的组合。它相当于学习一门新语言，但它是一门相对简单的语言，一旦你学会了，这项技术就能让你在很小的空间内完成大量工作——有时只需一两条语句——而否则可能需要很多行。\n\
  \n> 正则表达式语法有多种变体。Python 正则表达式包符合 Perl 标准，这是一个高级且灵活的版本。\n\n### 6.1 正则表达式简介\n\n正则表达式可以简单到只是一系列匹配给定单词的字符。例如，以下模式匹配单词“cat”；这并不奇怪。\n\
  \n```\ncat\n```\n\n但是，如果你想匹配更大的一组单词呢？例如，假设你想匹配以下字母组合：\n\n- 匹配“c”字符。\n- 匹配任意数量的“a”字符，但至少一个。\n\
  - 匹配“t”字符。\n\n以下是实现这些条件的正则表达式：\n\n```\nca+t\n```\n\n与正则表达式（如同上一章中的格式说明符一样），字面字符和特殊字符之间存在根本区别。\n\
  \n字面字符，例如本例中的“c”和“t”，必须完全匹配，否则结果是匹配失败。大多数字符都是字面字符，你应该假设一个字符是字面字符，除非特殊字符改变了它的含义。所有字母和数字本身都是字面字符；相比之下，标点字符通常是特殊的；它们改变附近字符的含义。\n\
  \n加号（+）是一个特殊字符。它不会导致正则表达式处理器查找加号。相反，它与“a”一起形成一个子表达式，意思是“匹配一个或多个‘a’字符。”因此，模式 `ca+t`\
  \ 匹配以下任何一个：\n\n```\ncat\ncaat\ncaaat\ncaaaat\n```\n\n如果你想匹配 _实际的_ 加号呢？在这种情况下，你会使用反斜杠（`\\\
  `）来创建转义序列。转义序列的功能之一是将特殊字符转换回字面字符。因此，以下正则表达式精确匹配 `ca+t`：\n\n```\nca\\+t\n```\n\n\
  另一个重要的运算符是乘号（`*`），它表示“前面表达式的 _零次或多次_ 出现。”因此，表达式 `ca*t` 匹配以下任何一个：\n\n```\nct\ncat\n\
  caat\ncaaaaaaat\n```\n\n值得注意的是，此模式匹配“ct”。请记住，星号是表达式修饰符，不应单独求值。相反，请遵守此规则。\n\n> 星号（*）修改紧随其后的表达式的含义，因此\
  \ a 与 * 一起匹配零个或多个“a”字符。\n\n你可以像图 6.1 所示那样从语法上分解它。字面字符“c”和“t”各匹配一个字符，但 a* 形成一个单元，意思是“匹配零次或多次出现的‘a’。”\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_358_0.png)\n\n前面介绍的加号（+）的工作方式类似。加号与其前面的字符或组一起，意思是“匹配此表达式的一个或多个实例。”\n\
  \n### 6.2 实际示例：电话号码\n\n假设你想为电话号码编写一个验证函数。我们可以将模式视为以下形式，其中 # 代表一个数字：\n\n```\n###-###-####\n\
  ```\n\n使用正则表达式语法，你可以这样写模式：\n\n```\n\\d\\d\\d-\\d\\d\\d-\\d\\d\\d\\d\n```\n\n在这种情况下，反斜杠（\\\
  ）继续充当转义字符，但它在这里的作用不是将“d”变为字面字符，而是创建一个特殊含义。子表达式 \\d 表示匹配任何一个数字字符。表示数字字符的另一种方法是使用以下子表达式：\n\
  \n```\n[0-9]\n```\n\n但是，\\d 只有两个字符长，而不是五个字符，因此更简洁。以下是一个完整的 Python 程序，它实现了用于验证电话号码的此正则表达式模式。\n\
  \nClick here to view code image\n\n```\nimport re\npattern = r'\\d\\d\\d-\\d\\d\\\
  d-\\d\\d\\d\\d'\n\ns = input('Enter tel. number: ')\nif re.match(pattern, s):\n\
  \    print('Number accepted.')\nelse:\n    print('Incorrect format.')\n```\n\n示例首先要做的是导入正则表达式包。对于每个使用正则表达式功能的模块（源文件），只需执行一次此操作。\n\
  \n```\nimport re\n```\n\n接下来，示例指定正则表达式模式，编码为 *原始字符串*。使用原始字符串时，Python 本身不会翻译任何字符；例如，它不会将\
  \ `\\n` 翻译为换行符，也不会将 `\\b` 翻译为响铃。相反，原始字符串中的所有文本都直接传递给正则表达式求值器。\n\n![](img/6e45221a8147f2442c653a3d4a866570_360_0.png)\n\
  \n```\nr''string'' or\nr\"string\"\n```\n\n提示用户输入后，程序调用 *match* 函数，该函数限定为 `re.match`，因为它从\
  \ `re` 包导入。\n\n```\nre.match(pattern, s)\n```\n\n如果模式参数与目标字符串（本例中为 `s`）匹配，则该函数返回一个匹配对象；否则返回值\
  \ **None**，它转换为布尔值 **False**。因此，你可以将返回的值当作布尔值使用。如果确认匹配，则返回 **True**；否则，返回 **False**。\n\
  \n> 注意\n> 如果忘记包含 `r`（原始字符串指示符），这个特定示例仍然有效，但如果你始终在指定正则表达式模式时使用 `r`，你的代码会更可靠。Python\
  \ 字符串解释的工作方式与 C/C++ 字符串解释不完全相同。在这些语言中，除非使用原始字符串，否则每个反斜杠都会自动被视为具有特殊含义。（较新版本的 C++\
  \ 也支持原始字符串功能。）使用 Python 时，某些子表达式（例如 `\\n`）具有特殊含义。但除此之外，反斜杠被视为字面字符。由于 Python 有时将反斜杠解释为字面字符，有时不这样做，除非你养成始终使用原始字符串的习惯，否则结果可能不可靠且不可预测。因此，安全的策略是始终在正则表达式规范字符串前面放置一个\
  \ `r`。\n\n### 6.3 细化匹配\n\n尽管前一节中介绍的电话号码示例有效，但它有一些局限性。`re.match` 函数在模式匹配目标字符串开头时任何时候都返回“真”值。它不必匹配整个字符串。因此，代码确认了以下电话号码模式的匹配：\n\
  \n```\n555-123-5000\n```\n\n但它也匹配以下内容：\n\n```\n555-345-5000000\n```\n\n如果你想将正结果限制为精确匹配——即整个字符串必须匹配模式且没有剩余内容——你可以添加特殊字符\
  \ $，它表示“字符串结尾”。如果在指定模式之外检测到任何其他文本，此字符会导致匹配失败。\n\nClick here to view code image\n\
  \n```\npattern = r'\\d\\d\\d-\\d\\d\\d-\\d\\d\\d\\d$'\n```\n\n还有其他方式可以细化正则表达式模式。例如，你可能希望允许输入匹配以下任一格式：\n\
  \n```\n555-123-5000\n555 123 5000\n```\n\n为了适应这两种模式，你需要创建一个字符集，它允许特定位置有多个可能的值。例如，以下表达式表示匹配“a”或“b”，但不能同时匹配：\n\
  \n```\n[ab]\n```\n\n可以在字符集中放入许多字符。但一次只能匹配其中一个字符。例如，以下范围精确匹配一个字符：an\n\n\n\n\n\n\"\
  a\", \"b\" \"c\", 或 \"d\" 出现在下一个位置。\n\n```\n[abcd]\n```\n\n同样，下面的表达式表示可以匹配一个空格或一个减号（-）——这正是我们在这种情况下想要的：\n\
  \n```\n[ -]\n```\n\n在这种情况下，方括号是唯一的特殊字符；括号内的两个字符是字面量，且最多只能匹配其中一个。减号在方括号内通常有特殊含义，但当它出现在括号内字符的最前面或最后面时则不是这样。下面是我们需要的完整正则表达式：\n\
  \nClick here to view code image\n\n```\npattern = r'\\d\\d\\d[ -]\\d\\d\\d[ -]\\\
  d\\d\\d\\d$'\n```\n\n现在，将本节中提出的完善模式全部结合起来，下面是完整的示例：\n\nClick here to view code image\n\
  \n```\nimport re\npattern = r'\\d\\d\\d[ -]\\d\\d\\d[ -]\\d\\d\\d\\d$'\ns = input('Enter\
  \ tel. number: ')\nif re.match(pattern, s):\n    print('Number accepted.')\nelse:\n\
  \    print('Incorrect format.')\n```\n\n回顾一下，给定这个模式，Python 正则表达式求值器的工作原理如下。\n\n\
  +   - 它尝试匹配三个数字：\\\\d\\\\d\\\\d。\n+   - 然后它读取字符集 [ -] 并尝试匹配一个空格或一个减号，但不能两者都匹配——也就是说，这两个字符中只有一个会在此处被匹配。\n\
  +   - 它尝试再匹配三个数字：\\\\d\\\\d\\\\d。\n+   - 同样，它尝试匹配一个空格或一个减号。\n+   - 它尝试再匹配四个数字：\\\
  \\d\\\\d\\\\d\\\\d。\n+   - 它必须匹配字符串末尾，$。这意味着在目标字符串中，匹配完最后四个数字后，不能再有任何输入。\n\n另一种强制精确匹配、不允许有尾随数据的方法是使用\
  \ `re.fullmatch` 方法而不是 `re.match`。你可以使用以下语句来匹配电话号码模式；在这种情况下，使用 `fullmatch` 使得字符串末尾字符变得多余。\n\
  \nClick here to view code image\n\n```\nimport re\n\npattern = r'\\d\\d\\d[ -]\\\
  d\\d\\d[ -]\\d\\d\\d\\d'\n\ns = input('Enter tel. number: ')\nif re.fullmatch(pattern,\
  \ s):\n    print('Number accepted.')\nelse:\n    print('Incorrect format.')\n```\n\
  \n到目前为止，本章仅涉及了正则表达式语法所能做到的表面内容。第 6.5 节将更详细地解释语法。但在掌握这种语法时，有几条原则需要牢记。\n\n+   - 许多字符在放置于正则表达式模式中时具有特殊含义。熟悉所有这些字符是个好主意。这些包括大多数标点字符，例如\
  \ + 和 *。\n+   - 任何对 Python 正则表达式解释器没有特殊含义的字符都被视为字面量字符。正则表达式解释器尝试精确匹配这些字符。\n+   -\
  \ 反斜杠可以用于“转义”特殊字符，使其变成字面量字符。反斜杠也可以为某些普通字符添加特殊含义——例如，使 \\d 表示“任何数字”而不是字符“d”。\n\n\
  诚然，起初这可能有点令人困惑。如果一个字符（如 *）本身就是特殊的，那么转义它（在其前面加上反斜杠）会取消该特殊含义。但在其他情况下，转义一个字符会_赋予_它特殊含义。\n\
  \n是的，这两点都是真的！但如果你看过足够多的示例，就应该能明白。\n\n下面是一个用于测试社会安全号码有效性的简短程序。它与用于检查电话号码格式的程序类似，但不完全相同。这个模式查找三个数字、一个减号、两个数字、另一个减号，然后是四个数字。\n\
  \nClick here to view code image\n\n```\nimport re\n\npattern = r'\\d\\d\\d-\\d\\\
  d-\\d\\d\\d\\d$'\n\ns = input('Enter SSN: ')\nif re.match(pattern, s):\n    print('Number\
  \ accepted.')\nelse:\n    print('Incorrect format.')\n```\n\n## 6.4 正则表达式的工作原理：编译与运行\n\
  \n正则表达式看起来像魔术。但其实现是计算机科学中一个标准（尽管相对高级）的主题。正则表达式的处理分为两个主要步骤。\n\n+   - 正则表达式模式被分析，然后编译成一系列统称为“状态机”的数据结构。\n\
  +   - 实际的匹配过程被视为正则表达式求值器的“运行时”，与“编译时”相对。在运行时，程序在查找匹配项时遍历状态机。\n\n除非你打算自己实现一个正则表达式包，否则没有必要了解如何创建这些状态机，只需了解它们的作用即可。但理解编译时与运行时之间的这种二分法很重要。\n\
  \n让我们再看一个简单的例子。正如修饰符 + 表示“匹配前一个表达式的一个或多个实例”，修饰符 * 表示“匹配前一个表达式的零个或多个实例”。所以请考虑这个：\n\
  \n```\nca*b\n```\n\n这个表达式匹配“cb”以及“cab”、“caab”、“caaab”等等。当这个正则表达式被编译时，它会产生图 6.2 所示的状态机。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_367_0.png)\n\n下面的列表描述了程序在运行时如何遍历这个状态机来找到匹配项。位置\
  \ 1 是起点。\n\n+   - 读取一个字符。如果是“c”，机器进入状态 2。读取任何其他字符都会导致失败。\n+   - 从状态 2，可以读取“a”或“b”。如果读取“a”，机器保持在状态\
  \ 2。它可以这样做任意次。如果读取“b”，机器转移到状态 3。读取任何其他字符都会导致失败。\n+   - 如果机器到达状态 3，则完成，并报告成功。\n\n\
  这个状态机说明了一些基本原理，尽管它很简单。特别是，状态机必须先被编译，然后在运行时被遍历。\n\n> > **注意**\n> >\n> > 本章中的状态机图假设为\
  \ DFA（确定有限自动机），而 Python 实际使用的是 NFA（非确定有限自动机）。除非你要实现一个正则表达式求值器（这很可能永远不需要做），否则这对你没有区别。\n\
  > > 所以如果是这种情况，你可以忽略 DFA 和 NFA 之间的区别！不客气。\n\n你需要知道的是：如果你打算多次使用同一个正则表达式模式，最好将该模式编译成一个正则表达式对象，然后反复使用该对象。regex\
  \ 包为此目的提供了一个名为 **compile** 的方法。\n\n![](img/6e45221a8147f2442c653a3d4a866570_368_0.png)\n\
  \nClick here to view code image\n\n```\nregex_object_name = re.compile(pattern)\n\
  ```\n\n下面是一个使用 **compile** 函数创建名为 reg1 的正则表达式对象的完整示例。\n\nClick here to view code\
  \ image\n\n```\nimport re\n\nreg1 = re.compile(r'ca*b$') # Compile the pattern!\n\
  \ndef test_item(s):\n    if re.match(reg1, s):\n        print(s, 'is a match.')\n\
  \    else:\n        print(s, 'is not a match!')\n\ntest_item('caab')\ntest_item('caaxxb')\n\
  ```\n\n这个小程序打印以下内容：\n\n```\ncaab is a match.\ncaaxxb is not a match!\n```\n\n你可以不预编译正则表达式对象来执行这些任务。但是，如果你打算多次使用同一个模式，编译可以节省执行时间。否则，Python\
  \ 可能不得不多次重建状态机，而本可以只构建一次。\n\n作为比较，图 6.3 显示了一个实现加号（+）的状态机，它表示“一个或多个”\n\n而不是“零个或多个”。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_370_0.png)\n\n**图 6.3.** `ca+b` 的状态机\n\
  \n给定这个模式，“cb”不是成功的匹配，但“cab”、“caab”和“caaab”是。这个状态机要求至少读取一个“a”。之后，匹配更多的“a”字符是可选的，但它可以匹配找到的尽可能多的连续“a”实例。\n\
  \n另一个基本运算符是 _替换_ 运算符（`|`），它表示“二选一”。\n\n下面的模式匹配竖线两侧的表达式之一。那么你认为下面的意思到底是什么？\n\n```\n\
  ax|yz\n```\n\n替换运算符 `|` 的优先级在语法的任何部分中都大致最低。因此，这个表达式匹配“ax”和“yz”，但不匹配“axyz”。如果没有使用括号，该表达式的求值就好像写成这样：\n\
  \n```\n(ax) | (yz)\n```\n\n\n\n\n\nFigure 6.4 shows the state machine that implements\
  \ this expression.\n\n![](img/6e45221a8147f2442c653a3d4a866570_371_0.png)\n\n**Figure\
  \ 6.4.** State machine for `(ax) | (yz)`\n\nNow consider following expression, which\
  \ uses parentheses to change the order of evaluation. With these parentheses, the\
  \ alteration operator is interpreted to mean “either x or y but not both.”\n\n```\n\
  a (x|y) z\n```\n\nThe parentheses and the `|` symbol are all special characters.\
  \ Figure 6.5 illustrates the state machine that is compiled from the expression\
  \ `a (x|y) z`.\n\n![](img/6e45221a8147f2442c653a3d4a866570_371_1.png)\n\n**Figure\
  \ 6.5.** State machine for `a (x|y) z`\n\nThis behavior is the same as that for\
  \ the following expression, which uses a character set rather than alteration:\n\
  \n```\na[xy]z\n```\n\nIs there a difference between alteration and a character set?\n\
  Yes: A character set always matches one character of text (although it may be part\
  \ of a more complex pattern, of course). Alteration, in contrast, may involve groups\
  \ longer than a single character. For example, the following pattern matches either\
  \ “cat” or “dog” in its entirety—but not “catdog”:\n\n```\ncat|dog\n```\n\n# 6.5\
  \ IGNORING CASE, AND OTHER FUNCTION FLAGS\n\nWhen a regular-expression pattern is\
  \ compiled or being interpreted directly (through a call to a function such as re.match),\
  \ you can combine a series of regex flags to influence behavior. A commonly used\
  \ flag is the re.IGNORECASE flag. For example, the following code prints “Success.”\n\
  \nClick here to view code image\n\n```\nif re.match('m*ack', 'Mack the Knife', re.IGNORECASE):\n\
  \    print('Success.')\n```\n\nThe pattern 'm*ack' matches the word “Mack,” because\
  \ the flag tells Python to ignore the case of the letters. Watch out for Mack the\
  \ Knife even if he doesn’t know how to use uppercase!\nThe following does the same\
  \ thing, because it uses the I abbreviation for the IGNORECASE flag, so re.IGNORECASE\
  \ and re.I mean the same thing.\n\nClick here to view code image\n\n```\nif re.match('m*ack',\
  \ 'Mack the Knife', re.I):\n    print('Success.')\n```\n\nBinary flags may be combined\
  \ using the binary OR operator (|). So you can turn on both the I and DEBUG flags\
  \ as follows:\n\nClick here to view code image\n\n```\nif re.match('m*ack', 'Mack\
  \ the Knife', re.I | re.DEBUG):\n    print('Success.')\n```\n\nTable 6.1 summarizes\
  \ the flags that can be used with regular-expression searching, matching, compiling,\
  \ and so on.\n\n# Table 6.1. Regular-Expression Flags\n\n| Flag | Abbreviation |\
  \ Description |\n|---|---|---|\n| ASCII | A | Assume ASCII settings. |\n| IGNORECASE\
  \ | I | All searches and matches are case-insensitive. |\n| DEBUG | | When the operation\
  \ is carried out within IDLE, debugging information is printed. |\n| LOCALE | L\
  \ | Causes matching of alphanumeric characters, word boundaries, and digits to recognize\
  \ LOCALE settings. |\n| MULTILINE | M | Causes the special characters ^ and $ to\
  \ match beginnings and ends of lines as well as the beginning and end of the string.\
  \ |\n| DOTALL | S | The dot operator (.) matches all characters, including end of\
  \ line (\\n). |\n| UNICODE | U | Causes matching of alphanumeric characters, word\
  \ boundaries, and digits to recognize characters that UNICODE classifies as such.\
  \ |\n| VERBOSE | X | White space within patterns is ignored except when part of\
  \ a character class. This enables the writing of prettier expressions in code. |\n\
  \n# 6.6 REGULAR EXPRESSIONS: BASIC SYNTAX SUMMARY\n\nLearning regular-expression\
  \ syntax is a little like learning a new language; but once you learn it, you’ll\
  \ be able to create patterns of endless variety. As powerful as this language is,\
  \ it can be broken down into a few major elements.\n\n- Meta characters: These are\
  \ tools for specifying either a specific character or one of a number of characters,\
  \ such as “any digit” or “any alphanumeric character.” Each of these characters\
  \ matches one character at a time.\n- Character sets: This part of the syntax also\
  \ matches one character at a time—in this case, giving a set of values from which\
  \ to match.\n- Expression quantifiers: These are operators that enable you to combine\
  \ individual characters, including _wildcards_, into patterns of expressions that\
  \ can be repeated any number of times.\n- Groups: You can use parentheses to combine\
  \ smaller expressions into larger ones.\n\n# 6.6.1 Meta Characters\n\nTable 6.2\
  \ lists meta characters, including wildcards that can be matched by any of a group,\
  \ or range, of characters. For example, a dot (. ) matches any one character, subject\
  \ to a few limitations.\n\nThese meta characters match exactly one character at\
  \ a time. Section 6.6.3, “Pattern Quantifiers,” shows how to match a variable number\
  \ of characters. The combination of wildcards, together with quantifiers, provides\
  \ amazing flexibility.\n\nMeta characters include not only those shown in the table\
  \ but also the standard escape characters: These include \\t (tab), \\n (newline),\
  \ \\r (carriage return), \\f (form feed), and \\v (vertical tab).\n\n# Table 6.2.\
  \ Regular-Expression Meta Characters\n\n| Special character | Name/Description |\n\
  |---|---|\n| . | Dot. Matches any one character except a newline. If the **DOTALL**\
  \ flag is enabled, it matches any character at all. |\n| ^ | Caret. Matches the\
  \ beginning of the string. If the **MULTILINE** flag is enabled, it also matches\
  \ beginning of lines (any character after a newline). |\n| $ | Matches the end of\
  \ a string. If the **MULTILINE** flag is enabled, it matches the end of a line (the\
  \ last character before a newline or end of string). |\n| \\A | Matches beginning\
  \ of a string. |\n| \\b | Word boundary. For example, r'ish\\b' matches 'ish is'\
  \ and 'ish)' but not 'ishmael'. |\n| \\B | Nonword boundary. Matches only if a new\
  \ word does _not_ begin at this point. For example, r'al\\B' matches 'always' but\
  \ not 'al '. |\n| \\d | Any digit character. This includes the digit characters\
  \ 0 through 9. If the **UNICODE** flag is set, then Unicode characters classified\
  \ as digits are also included. |\n| \\s | Any whitespace character; may be blank\
  \ space or any of the following: \\t, \\n, \\r, \\f, or \\v. **UNICODE** and **LOCALE**\
  \ flags may have an effect on what is considered a whitespace character. |\n| \\\
  S | Any character that is not a white space, as defined just above. |\n| \\w | Matches\
  \ any alphanumeric character (letter or digit) or an underscore (_). The **UNICODE**\
  \ and **LOCALE** flags may have an effect on what characters are considered to be\
  \ alphanumeric. |\n| \\W | Matches any character that is not alphanumeric as described\
  \ just above. |\n| \\z | Matches the end of a string. |\n\nFor example, the following\
  \ regular-expression pattern matches any string that begins with two digits:\n\n\
  r'\\d\\d'\n\nThe next example matches a string that consists of a two-digit string\
  \ and nothing else:\n\n```\nr'\\d\\d$'\n```\n\n# 6.6.2 Character Sets\n\nThe character-set\
  \ syntax of Python regular expressions provides even finer control over what character\
  \ is to be matched next.\n\n![](img/6e45221a8147f2442c653a3d4a866570_378_0.png)\n\
  \nClick here to view code image\n\n```\n[char_set] // Match any one character in\
  \ the set.\n[^char_set] // Match any one character NOT in the set.\n```\n\nYou can\
  \ specify character sets by listing characters directly, as well as by ranges, covered\
  \ a few paragraphs later. For example, the following expression matches any vowel\
  \ (except, of course, for “y”).\n\n```\n[aeiou]\n```\n\nFor example, suppose you\
  \ specify the following regular-expression pattern:\n\n```\nr'c[aeiou]t'\n```\n\n\
  This matches any of the following:\n\n```\ncat\ncet\ncit\ncot\ncut\n```\n\nWe can\
  \ combine ranges with other operators, such as +, which retains its usual meaning\
  \ outside the square brackets. So consider\n\n```\nc[aeiou]+t\n```\n\nThis matches\
  \ any of the following, as well as many other possible strings:\n\n```\ncat\nciot\n\
  ciiaaet\ncaaauuuut\nceeit\n```\n\nWithin a range, the minus sign (-) enables you\
  \ to specify ranges of characters when the minus sign appears between two other\
  \ characters in a character range. Otherwise, it is treated as a literal character.\
  \ For example, the following range matches any character from lowercase “a” to lowercase\
  \ “n”:\n\n```\n[a-n]\n```\n\nThis range therefore matches an “a”, “b”, “c”, up to\
  \ an “l”, “m”, “n”.\n\n\n\n\n\n\"m\"，或 \"n\"。如果启用了 `IGNORECASE` 标志，它还匹配这些字母的大写形式。\n\
  \n以下匹配任何大写或小写字母，或数字。与 \"\\\\w\" 不同，不过，此字符集不匹配下划线 (_)。\n\n```\n[A-Za-z0-9]\n```\n\
  \n以下匹配任何十六进制数字：0 到 9 之间的数字，或范围 “A”、“B”、“C”、“D”、“E” 和 “F” 内的大写或小写字母。\n\n```\n[A-Fa-f0-9]\n\
  ```\n\n字符集遵循一些特殊规则。\n\n+   - 方括号 (`[]`) 内的几乎所有字符都失去其特殊含义，除非在此处特别提及。因此，几乎所有内容都按字面解释。\n\
  \n+   - 右方括号具有特殊含义，用于终止字符集；因此，右方括号必须用反斜杠转义才能按字面解释：“\\\\]”\n\n+   - 减号 (-) 具有特殊含义，除非它出现在字符集的最开头或最末尾，在这种情况下它被解释为字面减号。同样，插入符号\
  \ (^) 在范围开头具有特殊含义，但在其他位置则没有。\n\n+   - 反斜杠 (`\\\\`)，即使在此上下文中，也必须转义才能按字面表示。使用 “\\\\\
  \\\\” 来表示反斜杠。\n\n例如，在字符集规范之外，算术运算符 `+` 和 `*` 具有特殊含义。然而，它们在方括号内失去含义，因此你可以指定一个匹配这些字符中任意一个的范围：\n\
  \n```\n`[+*/-]`\n```\n\n此范围规范包含一个减号 (`-`)，但它没有特殊含义，因为它出现在字符集的末尾而不是中间。\n\n以下字符集规范使用插入符号来匹配不是四个运算符\
  \ `+`、`*`、`/` 或 `-` 中任何一个的字符。插入符号在此处具有特殊含义，因为它出现在开头。\n\n```\n`[^+*/-]`\n```\n\n\
  但以下规范，其中插入符号 (`^`) 出现在不同位置，匹配五个运算符中的任何一个，`^`、`+`、`*`、`/` 或 `-`。\n\n```\n`[+*^/ -]`\n\
  ```\n\n因此，以下 Python 代码在运行时打印 “Success！”。\n\n```\n```python\nimport re\nif re.match(r'[+*^/\
  \ -]', '^'):\n    print('Success!')\n```\n```\n\n然而，以下 Python 代码不打印 “Success”，因为字符集开头的插入符号反转了字符集的含义。\n\
  \n```\nimport re\nif re.match(r'[^+*/-]', '^'):\n    print('Success!')\n```\n\n\
  # ## 6.6.3 模式量词\n\n表 6.3 中的所有量词都是表达式修饰符，而不是表达式扩展符。第 6.6.4 节详细讨论了“贪婪”匹配的含义。\n\n#\
  \ ### 表 6.3. 正则表达式量词（贪婪）\n\n| 语法 | 描述 |\n|---|---|\n| `expr*` | 修改表达式 `expr` 的含义，使其匹配零次或多次出现，而不是一次。例如，`a*`\
  \ 匹配 “a”、“aa” 和 “aaa”，以及空字符串。 |\n| `expr+` | 修改表达式 `expr` 的含义，使其匹配一次或多次出现，而不是仅一次。例如，`a+`\
  \ 匹配 “a”、“aa” 和 “aaa”。 |\n| `expr?` | 修改表达式 `expr` 的含义，使其匹配零次或一次 expr 出现。例如，`a?`\
  \ 匹配 “a” 或空字符串。 |\n| `expr1` \\| `expr2` | 选择。匹配 expr1 的单次出现，或 expr2 的单次出现，但不匹配两者。例如，`a\\\
  |b` 匹配 “a” 或 “b”。请注意，此运算符的优先级非常低，因此 `cat\\|dog` 匹配 “cat” 或 “dog”。 |\n| `expr{n}`\
  \ | 修改表达式，使其匹配 expr 的恰好 n 次出现。例如，`a{3}` 匹配 “aaa”；但虽然 `sa{3}d` 匹配 “saad”，它不匹配 “saaaad”。\
  \ |\n| `expr{m,n}` | 匹配 expr 的至少 m 次出现和最多 n 次出现。例如，`x{2,4}y` 匹配 “xxy”、“xxxy” 和 “xxxxy”，但不匹配\
  \ “xxxxxyy” 或 “xy”。 |\n| `expr{m,}` | 匹配 expr 的至少 m 次出现，且匹配次数没有上限。例如，`x{3,}` 如果能在任何位置匹配模式\
  \ “xxx”，则找到匹配项。但如果可以，它将匹配超过三次。因此 `zx{3,}y` 匹配 “zxxxxy”。 |\n| `expr{,n}` | 匹配表达式\
  \ expr 的至少零次和最多 n 次实例。例如，`ca{,2}t` 匹配 “ct”、“cat” 和 “caat”，但不匹配 “caaat”。 |\n| `(expr)`\
  \ | 导致正则表达式求值器将 expr 的全部视为单个组。这样做有两个主要目的。首先，量词应用于紧随其后的表达式；但如果该表达式是一个组，则引用整个组。例如，`(ab)+`\
  \ 匹配 “ab”、“abab”、“ababab” 等等。其次，组很重要，因为它们可以在后续引用，无论是在匹配还是文本替换中。 |\n| `\\n` | 引用之前已匹配的组；引用的是运行时实际找到的文本，而不仅仅是模式本身的重复。`\\\
  1` 引用第一个组，`\\2` 引用第二个组，以此类推。 |\n\n表 6.3 中列出的倒数第二个量词是使用括号创建组。分组可以显著影响模式的含义。将项目放在括号中还会创建用于后续引用的标记组。\n\
  \n使用表 6.3 中的数值量词使某些表达式更容易呈现，或者至少更紧凑。例如，考虑前面介绍的电话号码验证模式。\n\n```\nr'\\\\d\\\\d\\\\\
  d-\\\\d\\\\d\\\\d-\\\\d\\\\d\\\\d\\\\d'\n```\n\n这可以修订为\n\n```\nr'\\d{3}-\\d{3}-\\\
  d{4}'\n```\n\n此示例节省了几个按键，但其他情况可能节省更多。使用这些功能还会创建更易读、更易维护的代码。\n\n括号除了清晰之外还有重大意义。其最重要的作用是指定组，而组又可以影响模式的解析方式。例如，考虑以下两个模式：\n\
  \n```\npat1 = r'cab+'\npat2 = r'c(ab)+'\n```\n\n第一个模式匹配以下任何字符串，其中 “b” 被重复。\n\n```\n\
  cab\ncabb\ncabbb\ncabbbb\n```\n\n但第二个模式——得益于分组的优点——匹配以下任何字符串。这些字符串重复 “ab” 而不是 “b”。\n\
  \n```\ncab\ncabab\ncababab\ncabababab\n```\n\n在这种情况下，分组非常重要。图 6.6 显示 Python 正则表达式求值器如何因为括号而以不同方式解释模式的含义；具体来说，是组\
  \ “ab” 被重复。\n\n![](img/6e45221a8147f2442c653a3d4a866570_386_0.png)\n\n# 图 6.6. 在正则表达式中解析组\n\
  \n# 6.6.4 回溯、贪婪和非贪婪\n\nPython 正则表达式在许多微妙方面都很灵活。特别是，正则表达式求值器总是倾向于匹配而非不匹配，即使这需要一种称为回溯的技术。\n\
  \n考虑以下示例。\n\n```\nimport re\npat = r'c.*t'\nif re.match(pat, 'cat'):\n    print('Success!')\n\
  ```\n\n问问自己：模式 `c.*t` 是否匹配目标字符串 \"cat\"？它应该匹配，不是吗？因为 “c” 匹配 “c”，“t” 匹配 “t”，而模式 “\
  \ .*” 说，“匹配任意数量的字符。” 所以它应该匹配 “cat”。\n\n但请等一下。如果你按字面意思理解 “ .*” 模式，它不应该执行以下操作吗？\n\n\
  +   - 匹配 “c”。\n+   - 通过匹配所有剩余字符（即 “at”）来匹配一般模式 “ .*”。\n+   - 然后到达字符串末尾。正则表达式求值器尝试匹配\
  \ “t” 但无法匹配，因为它现在位于字符串末尾。结果？看起来像是失败。\n\n幸运的是，正则表达式求值器比这更复杂。在未能匹配字符串后，它会回溯并根据 “ .*”\
  \ 尝试匹配更少的字符；回溯一个字符后，它发现它确实匹配目标字符串 “cat”。\n\n关键在于，正则表达式语法很灵活，并且可以正确匹配它合法能够匹配的任何模式，即使必须使用回溯。\n\
  \n一个相关问题是贪婪量词与非贪婪量词的问题。Python 正则表达式中的所有类型的模式规范都遵循黄金法则：如果可能匹配，则报告匹配，即使必须回溯。但在该规则内，有时会有多个可能的结果。“贪婪与非贪婪”是当存在多个可能字符串时，选择哪个字符串的问题。\n\
  \n\n\n\n\n## 6.7 正则表达式实用示例\n\n本节使用前面展示的元素进行一个实用示例。假设你被指派编写软件，用于验证密码是否足够强。\n\n我们说的不是密码加密。那是另一个话题。但在接受密码之前，你可以测试它是否具有足够的强度。\n\
  \n不久以前，在软件开发的“西部荒野”时代，任何至少包含一个字符的单词都可能被接受。这样的密码很容易被破解。如今，只有难以破解的密码才会被接受。否则，系统会自动提示用户重新输入。以下是一些典型的标准：\n\
  \n- 每个字符都必须是大写或小写字母、数字或下划线（_），或者是以下标点字符之一：@、#、$、%、^、&、* 或 !。\n- 最小长度为八个字符。\n- 它必须至少包含一个字母。\n\
  - 它必须至少包含一个数字。\n- 它必须包含一个可接受的标点字符。\n\n现在假设你受雇编写这些测试。如果你使用正则表达式，这项工作对你来说将轻而易举——一块美味的蛋糕。\n\
  \n下面的验证函数执行必要的测试。我们可以使用四个模式，并对每个模式执行 `re.match` 来实现这五条规则。\n\n```python\nimport re\n\
  \npat1 = r'(\\w|[@#$%^&*!]){8,}$'\npat2 = r'.*\\d'\npat3 = r'.*[a-zA-Z]'\npat4 =\
  \ r'.*[@#$%^&*]'\n\ndef verify_passwd(s):\n    b = (re.match(pat1, s) and re.match(pat2,\
  \ s) and\n         re.match(pat3, s) and re.match(pat4, s))\n    return bool(b)\n\
  ```\n\n`verify_passwd` 函数对目标字符串 `s` 应用四种不同的匹配条件。`re.match` 函数分别使用四个不同的模式（`pat1`\
  \ 到 `pat4`）进行调用。如果所有四个匹配都成功，结果为“真”。\n\n第一个模式接受任何是字母、字符或下划线 _或_ 范围 @#$%^&*! 中的字符……然后要求匹配八个或更多这样的字符。\n\
  \n`\\w` 元字符的意思是“匹配任何字母数字字符”。因此，当括号内的表达式组合在一起时，它的意思是“匹配一个字母数字字符 _或_ 列出的标点字符之一。”\n\
  \n```\n(\\w|[@#$%^&*!]){8, }\n```\n\n让我们稍微拆解一下。在括号内，我们找到这个表达式：\n\n```\n\\w|[@#$%^&*!]\n\
  ```\n\n这里使用了选择，由竖线 `|` 指示。这个子模式的意思是“匹配 `\\w` 或匹配集合 [@#$%^&*!] 中的字符。”\n\n方括号内的字符失去了它们在括号外原本具有的特殊含义。因此，范围规范内的所有内容都被视为字面量，而不是特殊字符。\n\
  \n将所有这些组合起来，这个子表达式的意思是“匹配一个字母数字字符（`\\w`），或匹配列出的标点字符之一。” 模式的下一部分 `{ 8, }` 表示这样做至少八次。\n\
  \n因此，我们匹配八个或更多字符，其中每个字符都是字母数字字符或所示的标点字符之一。\n\n最后，有一个字符串结束指示符 `$`。因此，不能有例如任何尾随空格。附加一个行结束符\
  \ `$` 要求字符串在读取最后一个字符后终止。\n\n```\n(\\w|[@#$%^&*!]){8, }$\n```\n\n其余使用 `re.match`\
  \ 实现的测试（每个使用不同的字符串）检查某种字符的存在。例如，`pat2` 匹配任意数量的任何类型的字符（ `.`*`）`）然后匹配一个数字。作为正则表达式模式，这表示“匹配零个或多个字符，然后匹配一个数字。”\n\
  \n```\n.*\\d\n```\n\n下一个模式 `pat3` 匹配零个或多个字符（ `.`*`）`）然后匹配一个大写或小写字母。\n\n```\n.*[a-zA-Z]\n\
  ```\n\n最后一个模式匹配零个或多个字符，然后匹配范围 `@#$%^&*!` 中的字符。\n\n```\n.*[@#$%^&*!]\n```\n\n其效果是测试以下各项：一个字母、一个数字和一个标点字符。每种至少要有一个。当然，拥有多个任何这些字符（数字、字母、下划线、标点字符）也是可以的。\n\
  \n## 6.8 使用匹配对象\n\n`re.match` 函数返回一个 `match` 对象（如果成功）或特殊对象 `None`（如果失败）。到目前为止，我们一直将此值（对象或\
  \ `None`）当作布尔值（真/假）来使用，这在 Python 中是一种有效的技术。\n\n但是，如果你得到一个 **match** 对象，你可以使用它来获取关于匹配的信息。例如，正则表达式模式可以选择使用括号分为子组。一个\
  \ **match** 对象可以用来确定每个子组中匹配了什么文本。\n\n例如，考虑以下内容：\n\n```python\nimport re\npat = r'(a+)\
  \ (b+) (c+)'\nm = re.match(pat, 'abbcccee')\nprint(m.group(0))\nprint(m.group(1))\n\
  print(m.group(2))\nprint(m.group(3))\n```\n\n此示例打印以下内容：\n\n```\nabbccc\na\nbb\n\
  ccc\n```\n\n如你从本示例中所见，**group** 方法返回全部或部分匹配的文本，如下所示。\n\n- **group(0)** 返回正则表达式匹配的整个文本。\n\
  - **group(_n_)**，从 1 开始，返回一个匹配的组，其中组由括号分隔。第一个这样的组可以作为 `group(1)` 访问，第二个作为 `group(2)`，依此类推。\n\
  \n**match** 对象的另一个属性是 **lastindex**。这是一个整数，包含匹配过程中找到的最后一个组的编号。因此，前面的示例可以用一个更通用的循环来编写。\n\
  \n```python\nimport re\npat = r'(a+) (b+) (c+)'\nm = re.match(pat, 'abbcccee')\n\
  for i in range(m.lastindex + 1):\n    print(i, '. ', m.group(i), sep='')\n```\n\n\
  此示例生成以下输出：\n\n```\n0. abbccc\n1. a\n2. bb\n3. ccc\n```\n\n在此示例的代码中，必须向 `m.lastindex`\
  \ 加 1。这是因为 **range** 函数生成一个从 0 开始、直到但不包括参数值的迭代器。在此示例中，组编号为 1、2、3，因此范围需要延伸到 3；而你可以通过在范围末尾加\
  \ 1 来实现这一点。\n\n表 6.4 总结了 **match** 对象的属性。\n\n# 表 6.4. 匹配对象属性\n\n| 语法 | 描述 |\n|--------|-------------|\n\
  | group(n) | 返回与指定组对应的文本，从 1 开始作为第一个组；默认值为 0，返回整个匹配字符串的文本。 |\n| groups() | 返回一个元组，包含匹配文本中的所有组，从组\
  \ 1（第一个子组）开始。 |\n| groupdict() | 返回一个字典，包含所有命名组，格式为 name:text。 |\n| start(n) | 返回目标字符串中由\
  \ n 引用的组的起始位置。字符串中的位置从 0 开始，但组编号从 1 开始，因此 start(1) 返回第一个组的起始字符串索引。start(0) 返回所有匹配文本的起始字符串索引。\
  \ |\n| end(n) | 类似于 **start(n)**，但 **end(n)** 获取已识别组的结束位置，相对于整个目标字符串。在此字符串中，文本由目标字符串中的所有字符组成，从“起始”索引开始，直到但不包括“结束”索引。例如，起始和结束值为\
  \ 0 和 3 表示匹配了前三个字符。 |\n| span(n) | 返回 **start(n)** 和 **end(n)** 提供的信息，但以元组形式返回。\
  \ |\n| lastindex | 组中最高的索引编号。 |\n\n## 6.9 在字符串中搜索模式\n\n一旦你理解了基本的正则表达式语法，就可以以许多有用的方式应用它。到目前为止，我们已使用它来查找\n\
  \n\n\nexact matches of a pattern.\n\nBut another basic usage for regular expressions\
  \ is to do searches: not to require the entire string to match but only part of\
  \ it. This section focuses on finding the first substring that matches a pattern.\
  \ The `re.search` function performs this task.\n\n![](img/6e45221a8147f2442c653a3d4a866570_396_0.png)\n\
  \nClick here to view code image\n\n```\nmatch_obj = re.search(pattern, target_string,\n\
  flags=0)\n```\n\nIn this syntax, _pattern_ is either a string containing a regular-expression\
  \ pattern or a precompiled regular-expression object; _target_string_ is the string\
  \ to be searched. The _flags_ argument is optional and has a default value of 0.\n\
  \nThe function produces a **match** object if successful and **None** otherwise.\
  \ This function is close to `re.match` in the way that it works, except it does\
  \ not require the match to happen at the beginning of the string.\n\nFor example,\
  \ the following code finds the first occurrence of a number that has at least two\
  \ digits.\n\nClick here to view code image\n\n```\nimport re\nm = re.search(r'\\\
  d{2,}', '1 set of 23 owls, 999\ndoves.')\nprint(\"''\", m.group(), \"'' found at\
  \ \", m.span(),\n\nsep='')\n```\n\nIn this case, the search string specifies a simple\
  \ pattern: two\nor more digits. This search pattern is easy to express in regular-\n\
  expression syntax, using the special characters introduced\nearlier in this chapter.\n\
  \n```\n\\d{2,}\n```\n\nThe rest of the code uses the resulting match object, assigning\n\
  that object a variable name of m. Using the **group** and **span**\nmethods of this\
  \ object, as described in Section 6.8, “Using the\nMatch Object,” you can get information\
  \ about what was\nmatched and where in the target string the match occurred.\nThe\
  \ code in this example prints the following:\n\n```\n\"23\" found at (9, 11)\n```\n\
  \nThis successfully reports that the substring “23” was found by\nthe search: m.group()\
  \ produced the substring that was\nmatched, “23,” while m.span() produced the starting\
  \ and\nending positions within the target string as the tuple (9, 11).\nHere, as\
  \ elsewhere, the starting position is a zero-based index\ninto the target string,\
  \ so the value 9 means that the substring\nwas found starting at the tenth character.\
  \ The substring\noccupies all positions **up to but not including** the ending\n\
  position, 11.\n\n## 6.10 ITERATIVE SEARCHING (\"FINDALL\")\n\nOne of the most common\
  \ search tasks is to find _all_ substrings matching a particular pattern. This turns\
  \ out to be easy, because there is such a function and it produces a Python list.\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_398_0.png)\n\nClick here to view code\
  \ image\n\n```\nlist = re.findall(pattern, target_string, flags=0)\n```\n\nIn this\
  \ syntax, most of the individual items have the meaning described in the previous\
  \ section: _pattern_ is a regular-expression string or precompiled object, _target_string_\
  \ is the string to be searched, and _flags_ is optional.\n\nThe return value of\
  \ `re.findall` is a list of strings, each string containing one of the substrings\
  \ found. These are returned in the order found.\n\nRegular-expression searches are\
  \ _non-overlapping_. This means, for example, that once the string “12345” is found,\
  \ the search will not then find “2345,” “345,” “45,” and so on. Furthermore, all\
  \ the quantifiers in this chapter are greedy; each will find as long a string as\
  \ it can.\n\nAn example should help clarify. Let’s take an example from the previous\
  \ section and search for all digit strings, and not only the first one. Also, let’s\
  \ look for digit strings that have at least\n\none digit.\n\nClick here to view\
  \ code image\n\n```\nimport re\ns = '1 set of 23 owls, 999 doves.'\nprint(re.findall(r'\\\
  d+', s))\n```\n\nThe code prints the following list of strings:\n\n```\n['1', '23',\
  \ '999']\n```\n\nThis is almost certainly the result you want. Because the search\
  \ is both non-overlapping and greedy, each string of digits is fully read but read\
  \ only once.\n\nWhat if you want to extract a digit string that optionally contains\
  \ any number of thousands place separators (a comma, in the American nomenclature),\
  \ decimal points, or both? The easiest way to do this is to specify that the first\
  \ character must be a digit, but it can be followed by another digit, a comma (,),\
  \ or a dot(.)—and that such a character (digit, comma, or dot) can appear zero or\
  \ more times.\n\nClick here to view code image\n\n```\nimport re\ns = 'What is 1,000.5\
  \ times 3 times 2,000?'\nprint(re.findall(r'\\d[0-9,.]*', s))\n```\n\nThis example\
  \ prints the following list:\n\n```\n['1,000.5', '3', '2,000']\n```\n\nIn looking\
  \ back at this example, keep in mind that the regular-expression pattern is\n\n\
  ```\n\\d[0-9,.]*\n```\n\nThis means “Match a digit (\\d), followed by any character\
  \ in the range [0–9, .], zero or more times.”\n\nHere’s another example. Suppose\
  \ we want to find all occurrences of words six or more characters in length. Here’s\
  \ some code that implements that search.\n\nClick here to view code image\n\n```\n\
  s = 'I do not use sophisticated, multisyllabic\nwords!'\nprint(re.findall(r'\\w{6,}',\
  \ s))\n```\n\nThis code prints the following list:\n\nClick here to view code image\n\
  \n```\n['sophisticated', 'multisyllabic']\n```\n\nIn this case, the regular expression\
  \ pattern is\n\n```\n\\w{6,}\n```\n\nThe special character \\w matches any of the\
  \ following: a letter, a digit, or an underscore. Therefore, the pattern matches\
  \ any word at least six characters long.\n\nFinally, let’s write a function useful\
  \ for the Reverse Polish\n\nNotation calculator introduced in Section 3.12. We’d\
  \ like to break down input into a list of strings, but we’d like operators (+, *,\
  \ /, −) to be recognized separately from numbers. In other words, suppose we have\
  \ the input\n\n```\n12 15+3 100-*\n```\n\nWe’d like 12, 15, 3, 100, and the three\
  \ operators (+, −, and \\*) to each be recognized as separate substrings, or _tokens_.\
  \ The space between “12” and “15” is necessary, but extra spaces shouldn’t be required\
  \ around the operators. An easy solution is to use the `re.findall` function.\n\n\
  Click here to view code image\n\n```\nimport re\ns = '12 15+3 100-*'\nprint(re.findall(r'[+*/-]|\\\
  \\w+', s))\n```\n\nThis example prints the following:\n\nClick here to view code\
  \ image\n\n```\n['12', '15', '+', '3', '100', '-', '*']\n```\n\nThis is exactly\
  \ what we wanted.\nThis example has a subtlety. As explained in Section 6.6.2, “Character\
  \ Sets,” the minus sign (−) has a special meaning within square brackets _unless_\
  \ it appears at the very beginning or end of the range, as is the case here. In\
  \ this case, the minus sign is at the end of the range, so it’s interpreted literally.\n\
  \n```\n[+*/-] | \\w+\n```\n\nWhat this pattern says is “First, match one of the\
  \ four\noperator characters if possible (+, *, /, or -). Failing that, try to\n\
  read a word, which is a series of one or more “w” characters:\nEach of these characters\
  \ is a digit, letter, or underscore ( _ ).” In\nthis case, the strings “12,” “15,”\
  \ “3,” and “100” are each read as\nwords.\n\nBut the previous expression used both\
  \ the alternation\noperator and plus sign (| and +). How does precedence work in\n\
  this case? The answer is that | has low priority, so the\nexpression means “Match\
  \ one of the operators _or_ match any\nnumber of digit characters.” That’s why the\
  \ return value is\n\nClick here to view code image\n\n```\n['12', '15', '+', '3',\
  \ '100', '-', '*']\n```\n\nEach of these substrings consists of either an operator\
  \ or a\nword: the word ends when a white space or operator is read\n(because white\
  \ spaces and operators are not matched by \\w).\n\n## 6.11 THE “FINDALL” METHOD\
  \ AND\nTHE GROUPING PROBLEM\n\nThe `re.findall` method has a quirk that, although\
  \ it creates\nuseful behavior, can also produce frustrating results if you don’t\n\
  anticipate it.\n\nOne of the most useful tools in regular-expression grammar\n\n\
  is grouping. For example, the following regular-expression\npattern captures all\
  \ instances of well-formed numbers in the\nstandard American format, including thousands\
  \ place\nseparators (,):\n\nClick here to view code image\n\n```\nnum_pat = r'\\\
  d{1,3} (, \\d{3}) * (\\. \\d*) ? '\n\n```\n\nTo summarize, this pattern looks for\
  \ the following:\n\n+   - Between one and three digits. Not optional.\n+   - A group\
  \ of characters beginning with a comma (,) followed by\n+   exactly three digits.\
  \ This group can appear zero or more times.\n+   - A decimal point (.) followed\
  \ by zero or more digits. This group is\n+   optional.\n\nYou can use this pattern\
  \ effectively to match valid digit\nstrings, such as any of the following:\n\n```\n\
  10.5\n5,005\n12, 333, 444.0007\n\n```\n\nBut a problem occurs when you use this\
  \ pattern to search for\nall occurrences of numbers. When the `re.findall` function\
  \ is\ngiven a regular-expression pattern containing parenthesized\ngroups, it returns\
  \ a list of tuples in which each tuple contains all\nthe text found in that subgroup.\n\
  Here’s an example:\n\n\n\n\n\n这些语句打印出以下内容：\n\n```\n[(',000', ''), ('', '.5')]\n\
  ```\n\n但这不是我们想要的！\n\n哪里出了问题？在这种情况下，问题在于如果在搜索字符串中使用分组，`findall` 函数返回一个列表，其中包含每个匹配字符串内部找到的子组，而不是返回与整体模式匹配的字符串，而这正是我们想要的。\n\
  \n因此，在这种情况下，结果是错误的。\n\n要得到想要的结果，请使用两部分解决方案。\n\n+ 1. 通过将整个表达式放在括号中，将整个表达式放在一个分组中。\n\
  + 2. 打印表达式 `item[0]`。\n\n以下是实现此解决方案的代码：\n\n```\npat = r'(\\d{1,3}(,\\d{3})*(.\\\
  d*)?)'\nlst = re.findall(pat, '12,000 monkeys on 55.5 cats.')\nfor item in lst:\n\
  \    print(item[0])\n```\n\n这将产生以下输出：\n\n```\n12,000\n55.5\n```\n\n这正是我们想要的。\n\n\
  ## 6.12 SEARCHING FOR REPEATED PATTERNS\n\n最复杂的模式涉及对 _标记组_ 的引用。当括号内的模式匹配时，正则表达式会记录运行时实际匹配的字符，并通过\
  \ _标记_ 该组来记住它们——即实际匹配的字符。\n\n一个示例应该能说明这一点。作家常见的错误之一是重复单词。例如，你写“the the”而不是“the”，或者写“it\
  \ it”而不是“it”。以下是一个查找重复单词的搜索模式：\n\n```\n(w+) \\1\n```\n\n此模式匹配一个单词，即一个或多个“w”字符（字母、数字或下划线），后跟一个空格，然后是相同字符的重复。此模式不匹配以下内容：\n\
  \n```\nthe dog\n```\n\n虽然“the”和“dog”都符合单词标准（`\\w+`），但第二个单词与第一个不相同。单词“the”被标记了，但在这种情况下没有重复。\n\
  \n但以下内容匹配该模式，因为它重复了标记的子字符串“the”：\n\n```\nthe the\n```\n\n以下是在更完整的上下文中使用的模式，目标字符串中包含“the\
  \ the”。\n\n```\nimport re\n\ns = 'The cow jumped over the the moon.'\nm = re.search(r'(\\\
  w+) \\1', s)\nprint(m.group(), '...found at', m.span())\n```\n\n运行此代码时，将打印以下内容：\n\
  \n```\nthe the ...found at (20, 27)\n```\n\n以下模式表示：“匹配由一个或多个字母数字字符组成的单词。标记它们，然后匹配一个空格，然后匹配标记字符的重复。”\n\
  \n```\n(\\w+) \\1\n```\n\n以下是使用相同模式的另一个示例，应用于包含“of of”的字符串。\n\n```\ns = 'The United\
  \ States of of America.'\nm = re.search(r'(\\w+) \\1', s)\nprint(m.group(), '...found\
  \ at', m.span())\n```\n\n此示例打印结果：\n\n```\nof of ...found at (18, 23)\n```\n\n与所有其他正则表达式匹配和搜索一样，Python\
  \ 实现使得进行不区分大小写的比较变得容易，这在这种情况下可能很有用。考虑以下文本字符串：\n\n```\ns = 'The the cow jumped over\
  \ the the moon.'\n```\n\n我们能否进行搜索，以指示句子开头处是否有重复单词，或者没有？可以，因为我们所要做的就是指定 **re.IGNORECASE**\
  \ 标志，或简称为 **re.I**。\n\n```\nm = re.search(r'(\\w+) \\1', s, flags=re.I)\nprint(m.group(),\
  \ '...found at', m.span())\n```\n\n此示例打印：\n\n```\nThe the ...found at (0, 7)\n```\n\
  \n`re.search` 函数报告找到的第一个成功匹配。\n\n## 6.13 REPLACING TEXT\n\n另一个工具是替换文本的能力，即文本替换。我们可能希望将模式的所有出现替换为其他模式。这几乎总是涉及前一节中描述的组标记。\n\
  \n`re.sub` 函数执行文本替换。\n\n```\nre.sub( find_pattern, repl, target_str, count=0,\n\
  flags=0)\n```\n\n在此语法中，`find_pattern` 是要查找的模式，`repl` 是正则表达式替换字符串，`target_str` 是要搜索的字符串。最后两个参数均为可选。\n\
  \n返回值是新字符串，由进行请求的替换后的目标字符串组成。\n\n以下是一个简单的示例，将每个“dog”替换为“cat”：\n\n```\nimport re\n\
  s = 'Get me a new dog to befriend my dog.'\ns2 = re.sub('dog', 'cat', s)\nprint(s2)\n\
  ```\n\n此示例打印：\n\n```\nGet me a new cat to befriend my cat.\n```\n\n然而，这并不那么有趣，因为它没有使用任何正则表达式特殊字符。下一个示例使用了。\n\
  \n```\ns = 'The the cow jumped over over the moon.'\ns2 = re.sub(r'(\\w+) \\1',\
  \ r'\\1', s, flags=re.I)\nprint(s2)\n```\n\n这将打印以下字符串，该字符串修复了重复单词问题——实际上两个都修复了，尽管第一个需要设置不区分大小写的标志。\n\
  \n```\nThe cow jumped over the moon.\n```\n\n在此输出中，“The the”已被替换为“The”，“over over”已被替换为“over”。之所以有效，是因为正则表达式搜索模式指定了任何重复单词。它在此处呈现为原始字符串：\n\
  \n```\nr'(\\w+) \\1'\n```\n\n下一个字符串，替换字符串，仅包含对该模式前半部分的引用。这是一个标记字符串，因此指示正则表达式求值器记录该标记字符串并将其用作替换字符串。\n\
  \n```\nr'\\1'\n```\n\n此示例说明了一些关键点。首先，替换字符串应指定为原始字符串，就像搜索字符串一样。Python 字符串处理给 `\\\
  1` 附加了特殊含义；因此，如果不将替换文本指定为原始字符串，则无法工作——除非使用指定文字反斜杠的另一种方式：\n\n```\n\\\\1\n```\n\n\
  但最好坚持使用原始字符串。其次，对“The the”的重复单词测试除非将 flags 参数设置为 re.I（或 re.IGNORECASE），否则会失败。在此示例中，flags\
  \ 参数必须明确命名。\n\n```\ns2 = re.sub(r'(\\w+) \\1', r'\\1', s, flags=re.I)\n```\n\n#\
  \ CHAPTER 6 SUMMARY\n\n本章探讨了 Python 正则表达式包的基本功能：如何使用它来验证数据输入的格式，如何搜索与指定模式匹配的字符串，如何将输入拆分为标记，以及如何使用正则表达式进行复杂的搜索和替换操作。\n\
  \n理解正则表达式语法是理解范围和通配符（一次匹配一个字符）以及量词（表示可以匹配零个、一个或任意数量的字符组重复）的问题。结合这些能力，使您能够使用正则表达式表达无限复杂的模式。\n\
  \n在下一章中，我们将探讨更多正则表达式用法示例，以及非贪婪运算符和 Scanner 接口，后者构建在 Python 正则表达式包之上。\n\n# # CHAPTER\

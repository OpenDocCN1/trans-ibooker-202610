  ## WHAT YOU''LL LEARN


  The list of topics in this book that are not in _Python Without Fear_ or other “beginner”
  texts is a long one, but here is a partial list of some of the major areas:


  - List, set, and dictionary comprehension.

  - Regular expressions and advanced formatting techniques; how to use them in lexical
  analysis.

  - Packages: the use of Python’s advanced numeric and plotting software. Also, special
  types such as `Decimal` and `Fraction`.

  - Mastering all the ways of using binary file operations in Python, as well as text
  operations.

  - How to use multiple modules in Python while avoiding the “gotchas.”

  - Fine points of object-oriented programming, especially all the “magic methods,”
  their quirks, their special features, and their uses.


  ## HAVE FUN


  When you master some or all of the techniques of this book, you should make a delightful
  discovery: Python often enables you to do a great deal with a relatively small amount
  of code. That’s why it’s dramatically increasing in popularity every day. Because
  Python is not just a time-saving device, it’s fun to be able to program this way
  . . . to see a few lines of code do so much.


  We wish you the joy of that discovery.



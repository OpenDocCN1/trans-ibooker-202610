  \n```python\nplt.plot( [X,] Y [,format_str] )\nplt.show()\n```\n\nIn this syntax,\
  \ square brackets are not intended literally but indicate optional items.\n\nThe\
  \ simplest calls to **plot** usually involve two one-dimensional array arguments:\
  \ X and Y. Where X is omitted, it’s assumed to be the array [0, 1, 2... N-1], where\
  \ N is the length of\n\n\n\n\nY. 但大多数时候，你会希望同时包含 X 和 Y 参数。\n\n该操作是从 X 和 Y 中取出点对，其中\
  \ X 和 Y 长度相同，并将它们绘制在图表上。X 中的每个值都与 Y 中对应的值匹配，以得到一个 (x, y) 点。然后绘制所有点并将其连接起来。\n\n下面是一个简单的示例，使用\
  \ **np.linspace** 和 **np.sin** 函数。\n\nClick here to view code image\n\n```\nimport\
  \ numpy as np\nimport matplotlib.pyplot as plt\n\nA = np.linspace(0, 2 * np.pi)\n\
  plt.plot(A, np.sin(A))\nplt.show()\n```\n\n如果你已下载 **numpy** 和 **matplotlib**，并且按所示输入此代码，你的计算机应显示图\
  \ 13.1 中的窗口。窗口将保持可见，直到你关闭它。\n\n![](img/6e45221a8147f2442c653a3d4a866570_795_0.png)\n\
  \n**Figure 13.1.** 正弦图\n\n这是简单的代码，但让我们逐步了解每个部分。示例首先做的事情是导入所需的包。\n\nClick here to\
  \ view code image\n\n```\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
  ```\n\n接下来，示例调用 **numpy linspace** 函数。请记住，该函数生成一组值，包括两个指定的端点，以得到总共 N 个均匀间隔的值。默认情况下，N\
  \ 为 50。\n\nClick here to view code image\n\n```\nA = np.linspace(0, 2 * np.pi)\n\

  \ | 大于 |\n| `>=` | 大于或等于 |\n\n| 运算符或语法 | 描述 |\n|---|---|\n| `name = str` | 将字符串数据分配给指定的变量名。\
  \ |\n| `str1 == str2` | 如果 `str1` 和 `str2` 具有相同的内容，则返回 **True**。（与所有比较运算符一样，这区分大小写。）\
  \ |\n| `str1 != str2` | 如果 `str1` 和 `str2` 具有不同的内容，则返回 **True**。 |\n| `str1 < str2`\

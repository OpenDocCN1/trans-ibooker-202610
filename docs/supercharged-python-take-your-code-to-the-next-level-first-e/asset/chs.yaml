- "## 9. 类和魔术方法\n\nPython 有类。在编程语言的世界里，这意味着能够编写用户定义的类型并赋予它们能力。一个类由它所做的事情定义，也由它包含的内容定义。大多数现代编程语言都有此功能。Python\
  \ 增加了一种变体。它有一种称为 _魔术方法_ 的东西，它会在响应某些情况时自动调用。\n\n在 Python 中编写类起初非常简单。但它很快就会变得有趣。\n\
  \n### 9.1 类和对象：基本语法\n\n在 Python 中编写类的基本语法如下所示。\n\n![](img/6e45221a8147f2442c653a3d4a866570_530_0.png)\n\
  \n```\nclass class_name:\n    statements\n```\n\n_statements_ 由一个或多个语句组成，并进行缩进。\n\
  \n你不能写零个语句，但可以使用 **pass** 关键字作为空操作；这在你想稍后定义类的功能时作为占位符很有用。\n\n例如，我们可以这样定义 Car 类：\n\
  \n```\nclass Car:\n    pass\n```\n\n我们也可以定义 Dog 和 Cat 类：\n\n```\nclass Dog:\n  \
  \  pass\n\nclass Cat:\n    pass\n```\n\n那么在 Python 中如何使用类？很简单。你可以创建该类的任意数量的实例，也称为\
  \ *实例*。以下语句创建了多个 Car 实例：\n\n```\ncar1 = Car()\ncar2 = Car()\ncar3 = Car()\n```\n\
  \n或者你可以创建 Dog 类的实例：\n\n```\nmy_dog = Dog()\nyr_dog = Dog()\n```\n\n到目前为止，这些实例都不执行任何操作。但这即将改变。我们可以用类做的第一件事是为整个类创建变量。这些变量称为\
  \ _类变量_，并由其所有实例共享。例如，假设 Car 是这样定义的：\n\n```\nclass Car:\n    accel = 3.0\n    mpg\
  \ = 25\n```\n\n现在，打印 Car 的任何实例都将产生这些值。\n\n单击此处查看代码图像\n\n```\nprint('car1.accel =\
  \ ', car1.accel)\nprint('car2.accel = ', car2.accel)\nprint('car1.mpg   = ', car1.mpg)\n\
  print('car2.mpg   = ', car2.mpg)\n```\n\n# 这些语句打印\n\n```\ncar1.accel = 3.0\ncar2.accel\
  \ = 3.0\ncar1.mpg   = 25\ncar2.mpg   = 25\n```\n\n但这里有个变化：Car 的任何一个实例都可以为变量 accel\
  \ 赋予自己的值。这样做会覆盖类变量的值，其值为 3.0。我们可以创建一个名为 my_car 的实例，并为 accel 赋值。\n\n```\nmy_car =\
  \ Car()\nyr_car = Car()\nmy_car.accel = 5.0\n```\n\n图 9.1 说明了这种关系。在 my_car 对象中，accel\
  \ 已成为实例变量；在 yr_car 中，\n\n![](img/6e45221a8147f2442c653a3d4a866570_533_0.png)\n\n\
  它仍然是类变量。\n\n### 9.2 关于实例变量的更多信息\n\n与其他语言不同，Python 有不在类中创建的实例变量——至少不是直接创建的。相反，实例变量是临时添加的，或者在\
  \ `__init__` 方法中添加。\n\n一般规则是，你创建实例变量的方式与创建任何变量的方式相同——通过为其赋值。对于实例变量，你需要使用点（.）语法。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_534_0.png)\n\n```\nobject.var_name =\
  \ value\n```\n\n例如，我们可以创建一个名为 Dog 的类，创建一个实例，然后为该实例赋予多个属性——即实例变量。\n\n单击此处查看代码图像\n\
  \n```\nclass Dog:\n    pass\n\nmy_dog = Dog()  # Create instance of Dog.\nmy_dog.name\
  \ = 'Champ the Wonder Dog'\nmy_dog.breed = 'Great Dane'\nmy_dog.age = 5\n```\n\n\
  现在，三个数据变量附加到名为 my_dog 的对象上。它们是 name、breed 和 age，并且都可以这样访问。\n\n单击此处查看代码图像\n\n```\n\
  print('Breed and age are {} and {}.', my_dog.breed,\n      my_dog.age)\n```\n\n\
  此语句打印\n\n```\nBreed and age are Great Dane and 5.\n```\n\n此时，`name`、`breed` 和 `age`\
  \ 都是 `my_dog` 对象特有的属性。如果你创建其他 Dog 对象，它们不一定具有这些相同的属性（即实例变量）。但是，我们可以选择在任何时候将这些相同的属性附加到另一个\
  \ Dog 对象上。\n\n```\nyr_dog = Dog()\ntop_dog = Dog()\nhot_dog = Dog()\nhot_dog.name\
  \ = 'Hotty Totty'\nhot_dog.breed = 'Dachshund'\n```\n\n如何确保同一个类的每个对象都具有这些属性（实例变量）？答案是这就是\
  \ `__init__` 方法的用途！\n\n### 9.3 \"`__INIT__`\" 和 \"`__NEW__`\" 方法\n\n对于每个类，如果定义了\
  \ `__init__` 方法，则在创建类的对象时会自动调用它。你可以使用此方法来确保类的每个实例都支持相同的公共变量集……但每个实例都有自己的值。\n\n![](img/6e45221a8147f2442c653a3d4a866570_535_0.png)\n\
  \n单击此处查看代码图像\n\n```\nclass class_name:\n    def __init__(self, args):\n        statements\n\
  ```\n\n单词 **self** 不是关键字，而是第一个参数的名称，它是对单个对象的引用。这个参数可以是任何合法名称，但使用 `self` 是通用惯例。\n\
  \n`args` 是参数——如果有多个，则用逗号分隔——在首次创建对象时传递给对象。例如，我们可以修改 Dog 类定义以包含 `__init__` 方法。\n\n\
  单击此处查看代码图像\n\n```\nclass Dog:\n    def __init__(self, name, breed, age):\n     \
  \   self.name = name\n        self.breed = breed\n        self.age = age\n```\n\n\
  现在，当创建 Dog 类的对象时，必须给出三个参数，然后将这些参数传递给 `__init__` 方法。下面是一个示例：\n\n单击此处查看代码图像\n\n```\n\
  top_dog = Dog('Handsome Dan', 'Bulldog', 10)\n```\n\n该语句创建一个名为 `top_dog` 的 Dog 对象，然后调用该类的\
  \ `__init__` 方法。在这种情况下，`__init__` 方法的效果是赋值实例变量，仿佛执行了以下语句：\n\n```\ntop_dog.name =\
  \ 'Handsome Dan'\ntop_dog.breed = 'Bulldog'\ntop_dog.age = 10\n```\n\n同样，你可以创建另一个名为\
  \ `good_dog` 的对象，它将不同的数据传递给超类函数。\n\n单击此处查看代码图像\n\n```\ngood_dog = Dog('WonderBoy',\
  \ 'Collie', 11)\n```\n\n一般来说，`__init__` 方法倾向于具有如下所示的模式，尽管如果你愿意，它们也可以执行其他初始化工作。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_537_0.png)\n\n单击此处查看代码图像\n\n```\nclass\
  \ class_name:\n    def __init__(self, val1, val2, ...):\n        self.instance_var1\
  \ = val1\n        self.instant_var2 = val2\n        ...\n```\n\nPython 实际上使用 `__new__`\
  \ 方法来创建对象，但大多数时候，你会希望坚持编写和实现 `__init__` 方法来执行初始化。有两个主要例外。\n\n\n\n\n\n## 9.4 类与前向引用问题\n\
  \n正如 Python 中的函数存在前向引用问题，Python 类也存在同样的问题。问题是，类必须在被实例化之前定义。_实例化_一个类意味着使用它来创建一个对象。\n\
  \n以下是一种在类前向引用中会出现问题的情况。\n\nClick here to view code image\n\n```\nclass Marriage:\n\
  \    def __init__(self):\n        self.wife = Person('f')\n        self.husband\
  \ = Person('m')\na_marriage = Marriage() # Instantiate the class.\n\nclass Person:\n\
  \    def __init__(self, gender):\n        self.gender = gender\n```\n\n这个愚蠢的程序会失败，但并非因为它愚蠢。你应该能看出问题所在：前几行代码被执行，导致类\
  \ Marriage 被定义，因此作为一个类存在；但第六行随后通过尝试创建一个名为 `a_marriage` 的实际对象来_实例化_该类。\n\n这本身不应该是问题。但是，当对象被创建并调用其\
  \ `__init__` 方法时，该方法试图创建名为 `wife` 和 `husband` 的几个对象，即 Person 类的对象。问题就在这里。Person\
  \ 类尚未定义，无法用于创建新对象。\n\n解决方案很明显：只需将第六行移动到文件末尾。这样，两个类都在被实例化之前定义。\n\n```\n`a_marriage\
  \ = Marriage()`\n```\n\n一般来说，如果遵循几条规则，对类的前向引用就不是问题。\n\n- 确保所有类在被实例化之前都已定义。这是主要规则。\n\
  - 对于相互实例化的类，或者（天不容）一个类创建自身实例的类，要格外小心。虽然有一种技巧可以让你做到这一点，但这确实是你不应该涉足的领域。愚者总是敢于涉足智者所畏惧之地。\n\
  - 但是，包含其他类（单向）的类，或者包含对类实例引用的类，通常不是问题。不过要警惕相互依赖。\n\n## 9.5 方法一般情况\n\n_方法_与普通函数有几点不同。首先，方法是在类定义内定义的；这正是使它们成为方法的原因。\n\
  \n```\nmy_obj.a_method(12)\n```\n\n其次，每次通过实例调用方法时，都会传递一个隐藏参数：对调用它的对象的引用（_self_）。\n\
  这里显示的语法对比了方法定义（必须在类定义内发生）与对该同一方法的调用。\n\n![](img/6e45221a8147f2442c653a3d4a866570_540_0.png)\n\
  \nClick here to view code image\n\n```\nclass class_name:\n    def method_name(self,\
  \ arg1, arg2, arg3...):\n        statements\n\nobj_name = class_name()\nobj_name.method_name(arg1,\
  \ arg2, arg3...)\n```\n\n请注意，方法的定义——但不是对该方法的_调用_——包含隐藏的第一个参数 _self_，因此定义的参数比函数调用多一个。例如，考虑以下类定义。\n\
  \n```\nclass Pretty:\n    def __init__(self, prefix):\n        self.prefix = prefix\n\
  \    def print_me(self, a, b, c):\n        print(self.prefix, a, sep='')\n     \
  \   print(self.prefix, b, sep='')\n        print(self.prefix, c, sep='')\n```\n\n\
  编写完这个类后，我们可以通过创建一个实例并使用它来测试它。请注意，对方法的调用始终比相应的定义少一个参数，因为定义显式包含 **self**，而对方法的调用则不包含。\n\
  \n```\nprinter = Pretty('-->')\nprinter.print_me(10, 20, 30)\n```\n\n这将打印\n\n```\n\
  -->10\n-->20\n-->30\n```\n\n还要注意，在方法内部，实例本身始终标识为 **self**，实例变量标识为 **self.name**。\n\
  \n## 9.6 公共和私有变量与方法\n\n面向对象编程的传统目标之一是 _封装_，它使类的内部内容对外部世界隐藏。\n\nPython 的哲学与这一观点背道而驰。作为一种脚本语言，Python\
  \ 倾向于暴露一切，让你尝试任何事情。与其他语言相比，安全性和类型检查较少。\n\n但是，Python 有一个有用的约定。以下划线 (_) 开头的变量和方法名旨在为私有。此外，以双下划线\
  \ (__) 开头的名称通过一种称为 _名称改写_ 的过程变得不可访问，假设它们不是“魔术方法”，如本章后面所述。\n\n一个简单的示例可以演示此工作原理。请注意，在以下类定义中，变量\
  \ x 和 y 无法从外部访问。但是，在类本身内部，所有三个变量（包括 __z）都是可访问的。\n\nClick here to view code image\n\
  \n```\nclass Odd:\n    def __init__(self):\n        self.x = 10\n        self.y\
  \ = 20\n        self.__z = 30\n\ndef pr(self):\n    print('__z = ', self.__z)\n\
  ```\n\n给定这个类定义，以下语句完全有效，并且完全符合你的预期。\n\n```\no = Odd()\no.x    # 10\no.y    # 20\n\
  ```\n\n但是，以下表达式会引发异常：\n\n```\no.__z   # Error!\n```\n\n最后这个表达式引发错误，因为 Python 将 __z\
  \ 替换为一个改写名称，该名称由类名和变量名的组合生成。\n\n但是，__z 在同一类的方法定义内仍然可以访问，无需改写，这就是为什么 pr 方法仍然有效的原因。变量和方法名在同一类内始终可访问。但是请记住，在\
  \ Python 中，此类类内引用需要用 self 限定。\n\n## 9.7 继承\n\nPython 提供对继承的支持，也称为“子类化”。假设你有一个类 Mammal，它包含你在程序中需要使用的大多数方法。但是，你需要添加或更改其中的几个方法。例如，你可能希望创建一个\
  \ Dog 类，其实例可以做 Mammal 实例能做的任何事情，再加上更多事情。\n\n首先显示带有一个基类的单继承语法。\n\n![](img/6e45221a8147f2442c653a3d4a866570_544_0.png)\n\
  \n> Click here to view code image\n\n```\nclass class_name(base_class):\n    statements\n\
  ```\n\n其效果是创建一个新类 class_name，它继承属于 base_class 的所有类变量和方法。语句可以添加新变量和方法定义，以及覆盖现有定义。\n\
  \nPython 中的每个变量和方法名都是多态的。名称直到运行时才被解析。因此，你可以调用任何对象的任何方法，并且它将被正确解析。\n\n例如，以下类层次结构涉及一个基类\
  \ Mammal 和两个子类 Dog 和 Cat。子类从 Mammal 继承 __init__ 和 call_out 方法，但每个子类都实现了 speak 方法的自己的版本。\n\
  \n> Click here to view code image\n\n```\nclass Mammal:\n    def __init__(self,\
  \ name, size):\n        self.name = name\n        self.size = size\n\ndef speak(self):\n\
  \    print('My name is', name)\n\ndef call_out(self):\n    self.speak()\n    self.speak()\n\
  \    self.speak()\n\nclass Dog(Mammal):\n    def speak(self):\n        print('ARF!!')\n\
  \nclass Cat(Mammal):\n    def speak(self):\n        print('Purrrrrrr!!!!')\n```\n\
  \n这些定义使以下语句成为可能：\n\n> Click here to view code image\n\n```\nmy_cat = Cat('Precious',\
  \ 17.5)\nmy_cat.call_out()\n```\n\n最后一个语句打印\n\n```\nPurrrrrrr!!!!\nPurrrrrrr!!!!\n\
  Purrrrrrr!!!!\n```\n\nDog 和 Cat 类继承 __init__ 方法，与 C++ 语言中的构造函数不同。但这引发了一个问题：如果子类需要进行额外初始化，同时我们又希望尽可能利用基类的\
  \ __init__ 定义，该怎么办？解决方案是为子类编写一个新的 __init__ 方法定义，但调用基类的\n\n\n\nversion of `__init__`\
  \ as follows. This results in calling all superclass initialization methods, even\
  \ those inherited indirectly:\n\n```\nsuper().__init__\n```\n\nFor example, the\
  \ definition of `Dog.__init__` initializes the `breed` variable itself and calls\
  \ `super().__init__` to do the rest of the initialization.\n\nClick here to view\
  \ code image\n\n```\nclass Dog(Mammal):\n    def speak(self):\n        print('ARF!')\n\
  \    def __init__(self, name, size, breed):\n        super().__init__(name, size)\n\
  \        self.breed = breed\n```\n\n## 9.8 多重继承\n\nPython 的灵活语法支持多重继承。这允许你创建一个从两个或多个基类继承的类。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_546_0.png)\n\nClick here to view code\
  \ image\n\n```\nclass class_name(base_class1, base_class2, ...):\n```\n\n例如，在以下类定义中，`Dog`\
  \ 类不仅从 `Mammal` 类继承，还从另外两个类继承。\n\nClick here to view code image\n\n```\nclass Dog(Mammal,\
  \ Pet, Carnivore):\n    def speak(self):\n        print('ARF!')\n    def __init__(self,\
  \ name, size, breed):\n        Mammal.__init__(self, name, size)\n        self.breed\
  \ = breed\n```\n\n`Dog` 类现在不仅从 `Mammal` 类继承，还从 `Pet` 和 `Carnivore` 类继承。因此，`Dog`\
  \ 的每个实例——即每个 `Dog` 对象——自动包含来自 `Pet` 和 `Carnivore` 类以及 `Mammal` 类的属性。\n\n初始化期间只调用了\
  \ `Mammal.__init__` 方法；但是，其他基类也可能参与。例如，家庭昵称可以传入，然后在 `Pet.__init__` 中初始化：\n\nClick\
  \ here to view code image\n\n```\ndef __init__(self, name, size, nickname,\n   \
  \            breed):\n    Mammal.__init__(self, name, size)\n    Pet.__init__(self,\
  \ nickname)\n    self.breed = breed\n```\n\n当你使用多重继承时，可能会出现冲突。例如，如果你编写一个从三个不同基类继承的类，只要基类不定义相同的方法或类变量，情况不太可能引起问题。如果它们与其他基类使用相同的方法或类变量名称，则可能会出现冲突。\n\
  \n## 9.9 魔术方法概述\n\n在 Python 中，许多方法名称具有预定义的含义。所有这些名称都使用双下划线前缀和后缀（它们被称为 _dunder_ 方法）；因此，如果你在自己的方法名称中避免使用双下划线，就不必担心与这些名称冲突。\n\
  \n使用预定义名称的方法也称为 _魔术方法_。它们可以像任何其他方法一样被调用，但每个方法在特定条件下都会自动被调用。\n\n例如，`__init__` 方法在创建类的实例时会自动被调用。通常的响应是将每个参数（当然\
  \ `self` 除外）分配给实例变量。\n\n这些方法的一般类别包括以下内容。\n\n+   * `__init__` 和 `__new__` 方法，它们会自动被调用以初始化和创建对象。这些在第\
  \ 9.3 节中已介绍。\n\n+   • 对象表示方法，包括 `__format__`、`__str__` 和 `__repr__`。这些在第 9.10.1\
  \ 节和第 9.10.2 节中介绍。\n\n+   • 比较方法，例如 `__eq__`（测试相等性）、`__gt__`（大于）、`__lt__`（小于）以及相关方法。这些在第\
  \ 9.10.3 节中介绍。\n\n+   • 二元运算符方法，包括 `__add__`、`__sub__`、`__mul__`、除法方法以及 `__pow__`。这些在第\
  \ 9.10.4 节中介绍。\n\n+   • 一元算术运算符方法，包括 `__pos__`、`__neg__`、`__abs__`、`__round__`、`__floor__`、`__ceil__`\
  \ 和 `__trunc__`。这些在第 9.10.5 节中介绍。\n\n+   • 位运算符方法 `__and__`、`__or__`、`__lshift__`\
  \ 等等。大多数 Python 程序员几乎从不实现这些方法，因为它们只有在整数类型（`int`）上才有意义，而该类型已经支持它们。出于这个原因，本书不介绍这些方法。\n\
  \n+   • 反射方法，包括 `__radd__`、`__rsub__`、`__rmul__` 以及其他以 `r` 开头的名称。当你希望支持你的类与另一个不了解你的类之间的操作时，有必要实现这些方法。当你的对象是右侧操作数时，它们适用。这些在第\
  \ 9.10.6 节中介绍。\n\n+   • 原地赋值运算符方法，包括 `__iadd__`、`__isub__`、`__imul__` 以及其他以 `i`\
  \ 开头的名称。这些方法支持赋值操作，例如 `+=`，利用其作为原地操作并使其真正原地。但是，如果你不编写这样的方法，你会“免费”获得 `+=` 作为重新赋值。在第\
  \ 9.10.7 节中介绍。\n\n+   • 转换方法：`__int__`、`__float__`、`__complex__`、`__hex__`、`__oct__`、`__index__`\
  \ 和 `__bool__`。\n\n这些在第 9.10.8 节中介绍。\n\n+   • 容器类方法，使你能够创建自己的容器。这些方法包括 `__len__`、`__getitem__`、`__setitem__`、`__delitem__`、`__contains__`、`__iter__`\
  \ 和 `__next__`。这些在第 9.10.9 节中介绍。\n\n+   • 上下文和 pickling（序列化）方法，包括 `__getstate__`\
  \ 和 `__setstate__`。通常，只要对象的所有组件都是可 pickling 的，该对象就是“可 pickling 的”。此类别中的方法处理特殊情况，超出了本书的范围。\n\
  \n+   • `__call__` 方法，可用于使类的实例直接作为函数调用。\n\n## 9.10 魔术方法详解\n\n以下小标题详细介绍了你作为中级到高级\
  \ Python 程序员可能会发现有用的主要魔术方法。如前所述，这里不介绍一些魔术方法，因为大多数 Python 程序员很少实现它们。请参阅 Python 的官方在线文档，以获取此类方法的完整列表和描述。\n\
  \n### 9.10.1 Python 类中的字符串表示\n\n多种方法使类能够表示自身，包括 `__format__`、`__str__` 和 `__repr__`。\n\
  \n如第 5 章所述，`format` 函数将格式说明符传递给要打印的对象。正确的响应是基于该说明符返回字符串表示。例如，考虑以下函数调用：\n\n```\n\
  format(6, 'b')\n```\n\nPython 通过调用整数类 `int` 的 `__format__` 方法来评估此函数调用，并传递说明符字符串\
  \ `'b'`。该方法通过返回包含整数 6 的二进制表示的字符串来响应。\n\n```\n'110'\n```\n\n以下是字符串表示中活动的一般流程摘要。\n\
  \n+   • `format` 函数尝试为对象调用 `__format__` 方法，并传递可选的格式说明符。实现此方法使类能够返回格式化的字符串表示。默认操作是调用\
  \ `__str__` 方法。\n\n+   • `print` 函数调用对象的 `__str__` 方法来打印对象；也就是说，它调用该对象类的 `__str__`\
  \ 方法。如果未定义 `__str__`，则默认情况下会调用类的 `__repr__` 方法。\n\n+   • `__repr__` 方法返回包含对象在 Python\
  \ 代码中表示的规范表达式的字符串。此方法通常与 `__str__` 做相同的事情，但并非总是如此。此方法由 IDLE 直接调用，或在使用 `r` 或 `!r`\
  \ 时调用。\n\n+   • 最后，`object` 类（即最终基类）的 `__repr__` 方法可能作为最终默认操作被调用。此方法打印关于对象类的简单语句。\n\
  \n图 9.2 直观地说明了此控制流。\n\n![](img/6e45221a8147f2442c653a3d4a866570_552_0.png)\n\n**Figure\
  \ 9.2.** 字符串表示中的控制流\n\n### 9.10.2 对象表示方法\n\n表 9.1 列出了字符串表示魔术方法，以及每个方法的描述。\n\n| Table\
  \ 9.1 | Magic Methods Supporting Object Representation |\n|-----------|------------------------------------------------|\n\
  |           |                                                |\n\n\n\n\n\n| 方法语法\
  \ | 描述 |\n|---|---|\n| `__format__(self, spec)` | 当对象直接传递给 `format` 函数时调用。<br>该方法的操作应返回格式化后的字符串。<br>很少有类直接实现此方法。\
  \ |\n| `__str__(self)` | 该方法应返回一个呈现对象数据以供用户使用的字符串。例如，如果你创建了自己的 Fraction 类版本，你可能会将四分之三的值打印为\
  \ `3/4`。<br>如果未实现此方法，默认操作是调用类的 `__repr__` 方法。 |\n| `__repr__(self)` | 此方法与 `__str__`\
  \ 方法类似，但目的略有不同：它应返回包含对象规范表示的字符串，该表示将出现在 Python 代码中。如果你实现了此方法但未实现 `__str__`，则此方法决定两种情况下字符串的表示方式。\
  \ |\n\n当对象作为参数传递给 `hash` 函数时调用；它生成哈希码，使该类型的对象能够作为数据字典中的键。此方法应返回一个整数。理想情况下，整数应尽可能随机选取，以便即使值相似的对象也能获得不接近的哈希码。但如果两个值相等，它们必须产生相同的哈希码。\n\
  \n布尔转换方法。在任何对 `bool` 函数的调用之后调用此方法；每当对象作为 `while` 或 `if` 等控制结构中的条件出现时，也会隐式调用此方法。正确的响应是返回\
  \ `True` 或 `False`；仅当对象为空、等于 `None` 或包含零值时，才应返回 `False`。\n\n请记住，任何对象都可以在任何需要条件的上下文中指定。如果根本未实现\
  \ `__bool__` 方法，默认行为是返回 `True`。因此，如果你希望有时转换为 `False`，则需要实现此方法。\n\n这是 Python 2.0\
  \ 中支持的布尔转换。Python 3.0 要求改为实现 `__bool__`，如果你想支持布尔转换。\n\n```python\n_(\n se\n lf\n\
  )\n```\n\n以下示例展示了如何编写理论上的 Point 类，以同时支持 `__str__` 和 `__repr__` 方法，以及 `__init__`。为了说明，`__str__`\
  \ 和 `__repr__` 方法返回略有不同格式的字符串。\n\n单击此处查看代码图片\n\n```python\nclass Point:\n    big_prime_1\
  \ = 1200556037\n    big_prime_2 = 2444555677\n    def __init__(self, x = 0, y =\
  \ 0):\n        self.x = x\n        self.y = y\n    def __str__(self):\n        s\
  \ = str(self.x) + ', '\n        s += str(self.y)\n        return s\n    def __repr__(self):\n\
  \        s = 'Point(' + str(self.x) + ', '\n        s += str(self.y) + ')'\n   \
  \     return s\n    def __hash__(self):\n        n = self.x * big_prime_1\n    \
  \    return (n + self.y) % big_prime_2\n```\n\n```python\ndef __bool__(self):\n\
  \    return x and y\n```\n\n有了这个简单的类定义后，你可以按如下方式测试 `__str__` 和 `__repr__` 方法的操作。\n\
  \n```\n>>> pt = Point(3, 4)\n>>> pt\nPoint(3, 4)\n>>> print(pt)\n3, 4\n```\n\n在\
  \ IDLE 中直接输入 `pt` 会导致环境打印其规范表示，这会导致调用类的 `__repr__` 方法。但当 `pt` 作为参数传递给 `print` 函数时，该函数反过来调用\
  \ `__str__` 方法以获取对象的标准字符串表示。\n为了说明，在这种情况下，`__repr__` 方法返回一个更长的显示字符串。\n\n```\nPoint(3,\
  \ 4)\n```\n\n## 9.10.3 比较方法\n\n比较方法使你的类的对象能够用于比较，包括 `==` 和 `!=`（等于和不等于）以及不等式，包括\
  \ `>`、`<`、`>=` 和 `<=`。至少实现等于测试通常是个好主意，因为否则 `==` 的默认行为是应用 `is` 运算符。\n比较运算符有一些我们在此处解释的特性，这些特性在书籍或互联网上很少有文档记录。官方规范包含了大部分这些信息，但并未阐明所有后果。\n\
  以下是 Python 中比较运算符的一些特殊功能。\n\n- 要使你的类的对象相对于其他对象可排序，请定义小于（<）操作。例如，要将你的类的对象放入集合并对其进行排序，你可以实现与同类其他对象相关的\
  \ `__lt__`。这样做可以启用集合的 sort 方法以及 min 和 max。\n\n- 但包含你的对象和其他类对象的集合呢？这是可行的。比较没有反射运算符——定义当你的对象在操作右侧时会发生什么——但它们具有同样好或更好的东西：对称性。\n\
  \n- 与反射运算符不同，Python 通过对称性规则执行反射。如果 A > B，Python 推断 B < A。因此，如果你为任何类组合实现 `__lt__`\
  \ 和 `__gt__`，你实际上已经为两个方向定义了 `__lt__`。\n\n- 这些规则还意味着，你通常可以“免费”获得操作，而无需实现所有操作。\n\n\
  在 Python 2.0 中，只需实现一个方法 `__cmp__` 即可支持所有比较运算符。Python 3.0 不支持此功能。\n以下是一个简单的类，提供支持\
  \ Python 3.0 中所有比较运算符所需的最少代码，相对于同类成员。此类定义使你能够对集合进行排序，只要它们仅包含 Dog 对象。\n\n单击此处查看代码图片\n\
  \n```python\nclass Dog:\n    def __init__(self, n):\n        self.n = n\n\n    def\
  \ __eq__(self, other):\n        \"\"\"Implementation of ==; provides != for\n  \
  \      free.\"\"\"\n        return self.n == other.n\n\n    def __lt__(self, other):\n\
  \        \"\"\"Implementation of <; provides > for\n        free.\"\"\"\n      \
  \  return self.n < other.n\n\n    def __le__(self, other):\n        \"\"\" Implementation\
  \ of <=; provides >= for\n        free.\"\"\"\n        return self.n <= other.n\n\
  ```\n\n在描述每个比较运算符后，我们再次探讨对称性如何工作以及如何使对象相对于其他类可排序。表 9.2 描述了比较方法。\n\n# 表 9.2. Python\
  \ 比较魔术方法\n\n| 语法 | 描述 |\n|--------|-------------|\n| `__cmp__` (self , other) |\
  \ Python 3.0 或更高版本不使用。在 2.0 中，此方法可用于通过返回 -1（小于）、0（等于）或 1（大于）来实现所有比较。 |\n| `__eq__`\
  \ (self , other) | 测试等于。响应 == 运算符调用，该运算符测试内容是否相等。该方法应返回 True 或 False。如果未实现此方法，Python\
  \ 将使用 is 运算符测试“等于”。 |\n| `__ne__` (self , other) | 不等于。响应 != 运算符调用，该运算符测试内容是否不相等。与此处列出的所有其他方法一样，正确的响应是返回\
  \ True 或 False。如果未实现此方法，Python 将调用等于测试然后反转逻辑含义。因此，通常实现 `__eq__` 方法就足够了。 |\n| `__gt__`\
  \ (self , other) | 大于测试。此方法响应 > 运算符调用。通过对称性规则，如果你只需要与同类其他对象比较，则可以像稍后解释的那样免费获得大于操作。\
  \ |\n| `__lt__` (self , other) | 小于测试。此方法响应 < 运算符调用。要启用包含你的类对象的集合中的排序，这是你需要实现的唯一比较运算符。要启用包含你的类对象和其他对象的集合中的排序，你可能还需要实现\
  \ `__gt__`。 |\n| `__ge__` (self , other) | 大于或等于测试。此方法响应应用于类对象的 >= 运算符。当你实现 `__eq__`\
  \ 和 `__gt__` 时，此运算符不会自动提供。相反，每个比较运算符都必须单独实现，但由于对称性规则，你可以通过实现 `__le__`（如果你只与同类对象比较）来免费获得\
  \ `__ge__`。 |\n| `__le__` (self , other) | 小于或等于测试。此方法响应应用于类对象的 <= 运算符。当你实现 `__eq__`\
  \ 和 `__lt__` 时，此运算符不会自动提供。相反，每个比较运算符都必须单独实现，但由于对称性规则，你可以通过实现 `__ge__`（如果你只与同类对象比较）来免费获得\
  \ `__le__`。 |\n\n现在让我们看看 Python 中的对称性规则如何工作\n\n\n\n\ncomparisons and how this enables\
  \ us to create classes for which `<` is defined in both directions, thereby making\
  \ the objects mutually sortable with any kind of object.\n\nPython assumes the following\
  \ rules apply to comparisons:\n\nIf A > B, then B < A.\n\nIf A < B, then B > A.\n\
  \nIf A >= B, then B <= A.\n\nIf A <= B, then B >= A.\n\nIf A == B, then B == A;\
  \ furthermore, we can conclude that A != B is not true.\n\nLet’s assume that you’re\
  \ interested in supporting comparisons only between your objects and other objects\
  \ of the same class. In that case, you can write less code, because you can get\
  \ half your comparison operators for free.\n\nNow let’s consider the more challenging\
  \ issue: What if you want to make your objects mutually sortable with, say, numbers?\
  \ The problem is that you have no access to source code for the `int`, `float`,\
  \ `Decimal`, or `Fraction` class (among many other classes).\n\nAssume your class\
  \ is named Dog. For Dog objects to be mutually sortable with `int`, you need to\
  \ support all of the following comparisons:\n\n```\nDog < Dog\nDog < int\nint <\
  \ Dog\n```\n\nHow do you implement this last comparison? Fortunately, there’s a\
  \ work-around. Implement greater than (`__gt__`) and you’ll get `int < Dog` for\
  \ free.\n\nHere’s an example of a Dog class that’s mutually sortable with regard\
  \ to numbers. Also, depending on how you initialize the instance variable, d, the\
  \ Dog class also can be mutually sortable with regard to strings. By “mutually sortable,”\
  \ we mean that you can place these objects in the same list as other kinds of objects,\
  \ and the entire list can be sorted; this is true for our Dog class, even if the\
  \ list contains both numbers and dogs, or it contains both strings and dogs. An\
  \ example at the end of this section demonstrates an example featuring dogs and\
  \ integers.\n\nDog implements four methods:\n\n```python\nclass Dog:\n    def __init__(self,\
  \ d):\n        self.d = d\n\n    def __gt__(self, other):\n        \"\"\" Greater\
  \ than (>). This method provides a\n        less-than comparison through Rules of\n\
  \        Symmetry.\n        if a > b, then b < a.\n        \"\"\"\n        if type(other)\
  \ == Dog:\n            return self.d > other.d\n        else:\n            return\
  \ self.d > other\n\n    def __lt__(self, other):\n        \"\"\" Less than (<).\
  \ This method must support\ncomparisons to objects of the same class, as\nwell as\
  \ to numbers.\n'''\nif type(other) == Dog:\n    return self.d < other.d\nelse:\n\
  \    return self.d < other\n\n# Defining __repr__ also gets us __str__.\ndef __repr__(self):\n\
  \    return \"Dog(\" + str(self.d) + \")\"\n```\n\nWithout the comments, this is\
  \ a small class, although a good deal could be added to it, of course. This class\
  \ definition enables code such as the following:\n\n```python\nd1, d5, d10 = Dog(1),\
  \ Dog(5), Dog(10)\na_list = [50, d5, 100, d1, -20, d10, 3]\na_list.sort()\n```\n\
  \nPrinting `a_list` then produces:\n\n```\n[-20, Dog(1), 3, Dog(5), Dog(10), 50,\
  \ 100]\n```\n\n## 9.10.4 Arithmetic Operator Methods\n\nTable 9.3 provides a summary\
  \ of the magic methods that support an arithmetic operator or arithmetic function.\
  \ These methods will most often be of interest when the class represents some kind\
  \ of mathematical object, such as a point or a matrix; however, the addition sign\
  \ (+) is supported by the string class (`str`) and other classes (such as lists)\
  \ as a concatenation operator.\n\n| Method name | Description |\n|---|---|\n| `__add__(self,\
  \ other)` | Addition. This method is invoked whenever an instance of the class is\
  \ on the left side of an addition operation (+). The argument named `other` is a\
  \ reference to the operand on the right. |\n| `__sub__(self, other)` | Subtraction.\
  \ This method is invoked whenever an instance of the class is on the left side of\
  \ a subtraction operation (-). The argument named `other` is a reference to the\
  \ operand on the right. |\n| `__mul__(self, other)` | Multiplication. This method\
  \ is invoked whenever an instance of the class is on the left side of a multiplication\
  \ operation (*). The argument named `other` is a reference to the operand on the\
  \ right. |\n| `__floordiv__(self, other)` | Floor division. This method is invoked\
  \ whenever an instance of the class is on the left side of a floor division operation\
  \ (`//`), which should round the result downward. The argument named `other` is\
  \ a reference to the operand on the right. For example, in Python 3.0, the expression\
  \ `7 // 2` produces `3` as the result. |\n| `__truediv__(self, other)` | Ordinary\
  \ division. This method is invoked whenever an instance of the class is on the left\
  \ side of a division operation (`/`). In Python 3.0, if the operands are integers\
  \ or floating point, this operation should produce a floating-point result not rounded\
  \ down. The argument named `other` is a reference to the operand on the right. For\
  \ example, in Python 3.0, the expression `7 / 2` produces `3.5` as its result. |\n\
  | `__divmod__(self, other)` | Division performed by the `divmod` function, which\
  \ returns a tuple with two values: a quotient—rounded to the nearest integer—and\
  \ a remainder. The argument named `other` is a reference to the argument on the\
  \ right (the divisor). For example, a call to `divmod(17, 2)` returns the tuple\
  \ `(8, 1)`, because `8` is the ratio, rounded down, and `1` is the quotient. |\n\
  | `__pow__(self, other[, modulo])` | Power function. This method is automatically\
  \ invoked when the exponentiation operator (`**`) is used to raise some object to\
  \ a power. |\n| `__lshift__(self, other)` | Left shift. This method is invoked whenever\
  \ an instance of the class is on the left side of a left shift operation (`<<`).\
  \ |\n\nFor example, `__add__` for a particular class is invoked when one of its\
  \ objects is added to another object. This assumes, however, that the object is\
  \ the left operand; if the object is the right operand, then its reflection method\
  \ may be called—in this case, `__radd__`.\n\nThe following example utilizes the\
  \ Fraction class from the fractions package. But if that package were not supported\
  \ by Python, you could write such a class yourself.\n\n```python\nimport fractions\n\
  \nf = fractions.Fraction(1, 2)\nprint(f + 1) # Calls Fraction.__add__\nprint(2 +\
  \ f) # Calls Fraction.__radd__\n```\n\nAs mentioned earlier, the `__add__` method\
  \ could be supported by any class that recognizes the addition operator (+), even\
  \ if it’s used for an operation such as string concatenation.\n\nA hypothetical\
  \ Point class can provide many good examples of how to implement these magic methods\
  \ for arithmetic operators.\n\n```python\nclass Point:\n    def __init__(self, x,\
  \ y):\n        self.x = x\n        self.y = y\n\n    def __add__(self, other):\n\
  \        \"\"\" Return a point containing self+other.\"\"\"\n        newx = self.x\
  \ + other.x\n        newy = self.y + other.y\n        return Point(newx, newy)\n\
  \n    def __sub__(self, other):\n        \"\"\" Return the distance between points.\"\
  \"\"\n        dx = self.x - other.x\n        dy = self.y - other.y\n        return\
  \ (dx * dx + dy * dy) ** 0.5\n\n    def __mul__(self, n):\n        \"\"\" Return\
  \ point * a scalar number, n.\"\"\"\n        newx = self.x * n\n        newy = self.y\
  \ * n\n        return Point(newx, newy)\n```\n\nThis sample class, which supports\
  \ four magic methods (`__init__`, `__add__`, `__sub__`, and `__mul__`), illustrates\
  \ some important points. First, each of the arithmetic operator methods returns\
  \ a value; that value, of course, can be assigned to a variable or used in any other\
  \ kind of expression. Consider this example:\n\n```python\npt1 = Point(10, 15)\n\
  pt2 = Point(0, 5)\nx = pt1 + pt2\n```\n\nThe expression `pt1 + pt2` results in the\
  \ `__add__` method being called through the object `pt1`. In this method call, `self`\
  \ is a reference to `pt1` itself, and `other` becomes a reference to the object\
  \ `pt2`. The result of the call is a new Point value, which is then passed to the\
  \ variable `x`.\n\nIn this case, adding two points causes the corresponding coordinates\
  \ to be added together; the resulting data is then returned as a new Point object.\n\
  \nThe subtraction sign (-) is interpreted as a distance operator in this case. The\
  \ method calculates the distance between two points and then returns it as a single\
  \ floating-point value.\n\nFinally, the multiplication sign (*) assumes that the\
  \ left operand (the operand referred to by `self`) is a Point object, and the right\
  \ operand is a scalar value, such as 1, 5, or 10. The action of the method is to\
  \ multiply each value in the Point operand by the same integer, `n`. The result\
  \ is then returned as a new Point object.\n\nThe syntax shown here is a reminder\
  \ of how to create a new object of a given class.\n\n![](img/6e45221a8147f2442c653a3d4a866570_568_0.png)\n\
  \nThis syntax creates a new instance of `Class`, initializing it with the specified\
  \ `args`, which in turn are passed to the class’s `__init__` method, if defined.\n\
  \n\n\n\n\n\n> 注意\n> 如果类的某个实例可能与另一种类型进行操作组合，且该类型有支持交互的代码，那么二元操作方法在不支持这些类型时应返回 `NotImplemented`；这样，操作右侧的操作数就有机会实现该操作。有关更多信息，请参见第\
  \ 9.10.6 节。\n\n## 9.10.5 一元算术方法\n\n此类别中的方法，与第 9.9 节列出的方法类似，通常由封装某种数字的类实现；不过，它们也可以指代其他数学对象，例如点或矩阵。\n\
  \n表 9.4 列出了一元算术方法。\n\n### 表 9.4. 一元算术运算符的魔术方法\n\n| 方法名 | 描述 |\n|---|---|\n| `__pos__(self)`\
  \ | 一元正号。当将加号（+）应用于单个操作数时，会调用此方法。由于此运算符通常只是原样返回对象，因此很少有其他作用，它之所以被支持，是为了完整性。 |\n\
  | `__neg__(self)` | 一元负号。当将负号（-）应用于单个操作数时，会调用此方法。 |\n| `__abs__(self)` | 绝对值。当将\
  \ abs 函数应用于类的对象时，会自动调用此方法。 |\n| `__invert__(self)` | 按位取反，生成的结果中，操作数为 0 的每个位置都包含\
  \ 1，反之亦然。这是响应 ~ 运算符而调用的。这也称为按位补码或一的补码。 |\n| `__bool__(self)` | 将值转换为布尔值。此转换不仅由 bool()\
  \ 调用，还由 not 等逻辑运算符以及响应条件的控制结构调用。如果未定义此方法，默认操作是返回 True。 |\n| `__round__(self, n=None)`\
  \ | 精度舍入函数。此方法由指定有限精度的格式化函数以及 round 函数调用。可选参数 n 指定要舍入到的有效数字位数。如果省略，函数应舍入到最接近的整数。\
  \ |\n| `__floor__(self)` | 向下取整函数。其效果应是将值舍入到不高于对象值的最大整数。此方法由 math 包中的 math.floor\
  \ 函数调用。 |\n| `__ceil__(self)` | 向上取整函数。其效果应是将值舍入到不低于对象值的最小整数。此方法由 math 包中的 math.ceil\
  \ 函数调用。 |\n| `__trunc__(self)` | 向下截断方法。此方法与 `__floor__` 类似，但不是向上或向下舍入，而是仅截断浮点值的小数部分。例如，-3.5\
  \ 被舍入为 -3.0，而 3.5 被舍入为 3.0。此方法由 math 包中的 math.trunc 函数调用。 |\n\n与二元方法类似，这些一元方法期望一个创建新对象（即实例）并返回它的实现。此对象通常应与正在操作的对象属于同一类型。\n\
  \n前面介绍过的 Point 类是一个数学对象，可用于说明某些魔术方法的用法。为此，我们需要向现有的 Point 类定义添加以下方法定义：\n\n单击此处查看代码图片\n\
  \n```python\ndef __neg__(self):\n    newx = -self.x\n    newy = -self.y\n    return\
  \ Point(newx, newy)\n```\n\n例如，以下表达式并非旨在更改 my_point 的内部值。相反，它旨在生成一个可以赋值或使用的新值。\n\
  \n```python\n-my_point\n```\n\n有了此定义后，我们现在可以创建 Point 类实例（Point 对象）并应用算术取反。\n\n单击此处查看代码图片\n\
  \n```python\npt1 = Point(3, 4)\npt2 = -pt1\nprint(pt2.x, ', ', pt2.y, sep='')\n\
  ```\n\n此示例输出\n\n```\n-3, -4\n```\n\n正如你所期望的，此结果是将 Point 实例设置为 3, 4 的算术取反。其取反是 Point\
  \ 的一个新实例。然后将结果赋值给 `pt2`。\n\n你可以通过直接调用魔术方法来测试它。例如，假设我们添加以下 `__trunc__` 方法的定义：\n\n\
  ```python\ndef __trunc__(self):\n    newx = self.x.__trunc__()\n    newy = self.y.__trunc__()\n\
  \n    return Point(newx, newy)\n```\n\n有了此定义，我们可以直接测试 `__trunc__` 方法。\n\n```python\n\
  import math\n\npt1 = Point(5.5, -6.6)\npt2 = math.trunc(pt1)\nprint(pt2.x, ', ',\
  \ pt2.y, sep='')\n```\n\n此示例输出\n\n```\n5, -6\n```\n\n## 9.10.6 反射（逆序）方法\n\n本节列出的魔术方法与前面介绍的二元运算符方法类似，但有一个关键区别：当讨论中的对象是表达式中的右侧（或第二个）操作数时，会调用这些方法。\n\
  \n> 注意\n> 本讨论假设英语从左到右阅读单词的标准。Python 和其他计算机语言扫描语句的方式也是如此。\n\n假设你有一个将两个对象相加的表达式，每个对象属于不同的类：\n\
  \n```python\nfido = Dog()\nprecious = Cat()\nprint(fido + precious)\n```\n\nPython\
  \ 计算表达式 `fido + precious` 时，首先检查 Dog 类是否实现了 `__add__` 方法。接下来会发生以下几种情况之一。\n\n- 左操作数实现了\
  \ `__add__` 方法并返回了 `NotImplemented` 以外的值。那么不需要调用右操作数的任何方法。\n- 左操作数（或其类）根本未实现 `__add__`\
  \ 方法。在这种情况下，Python 检查右操作数是否实现了 `__radd__` 方法。\n- 左操作数实现了 `__add__` 方法，但该方法决定不支持与右侧这样的对象进行交互。假设\
  \ `__add__` 方法已检查右操作数的类型，并决定：“我不支持与此类对象进行加法（+）运算。”在这种情况下，它应返回 `NotImplemented`。如果是，Python\
  \ 检查右操作数是否实现了 `__radd__` 方法。\n\n表 9.5 列出了反射二元运算符方法。\n\n### 表 9.5. 反射操作的魔术方法\n\n\
  | 方法名 | 描述 |\n|---|---|\n| `__radd__(self, other)` | 右侧加法运算符（+）。如果右操作数定义了此方法，且左操作数未定义\
  \ `__add__` 或定义了但返回 NotImplemented，则在响应加法时调用此方法。 |\n| `__rsub__(self, other)` |\
  \ 右侧减法运算符（-）。如果右操作数定义了此方法，且左操作数未定义 `__sub__` 或返回 NotImplemented，则在响应减法时调用此方法。 |\n\
  | `__rmul__(self, other)` | 右侧乘法运算符（*）。如果右操作数定义了此方法，且左操作数未定义 `__mul__` 或返回 NotImplemented，则在响应乘法时调用此方法。\
  \ |\n| `__rfloordiv__(self, other)` | 右侧向下取整除法（`//`）。如果右操作数定义了此方法，且左操作数未定义 `__floordiv__`\
  \ 或返回 `NotImplemented`，则在响应向下取整除法时调用此方法。该方法应返回除法的结果，可能是一个新对象。 |\n| `__rtruediv__(self,\
  \ other)` | 右侧除法（`/`）。如果右操作数定义了此方法，但左操作数未定义 `__div__` 或返回 `NotImplemented`，则在响应标准除法（使用单个正斜杠）时调用此方法。该方法应返回除法的结果，可能是一个新对象。\
  \ |\n| `__rmod__(self, other)` | 右侧取模除法运算符（%），也称为余数除法。如果右操作数定义了此方法，但左操作数未定义 `__mod__`\
  \ 或返回 `NotImplemented`，则此方法实现取模除法。 |\n\n\n\n\n\n| `__rdivmod__(self, other)` | `divmod`\
  \ 的右侧。当调用 `divmod` 函数且第二个参数定义了此方法，而第一个参数未定义 `__divmod__` 或返回 `NotImplemented` 时，会调用此方法。该方法应返回一个元组，其中第一个元素是商，第二个元素是余数。\
  \ |\n| --- | --- |\n| `__rpow__(self, other)` | 右侧幂运算符（`**`）。当右操作数定义了此方法，且左操作数未定义\
  \ `__pow__` 或返回 `NotImplemented` 时，会响应幂运算调用此方法。该方法应返回幂运算的结果，结果可能是一个新对象。 |\n\n在大多数情况下，反向顺序方法是其正向顺序（左操作数）版本的近似复制。例如，通过对其他魔术方法进行小幅修改，可以轻松编写反向顺序的\
  \ Point 类方法。\n\n但是，对于这个类，没有必要编写其中大多数方法。例如，考虑以下代码：\n\n```\npt1 = Point(1, 2)\npt2\
  \ = Point(5, 10)\n```\n\n```\npt3 = pt1 + pt2\n```\n\n假设以这种方式支持加法（+）—即将一个 Point\
  \ 实例添加到另一个 Point 实例—那么在这种情况下，`__add__` 将通过左操作数（pt1）被调用；因此，`__radd__` 永远不会通过右操作数被调用。\n\
  \n对称操作（一个点加上一个点）永远不会调用任何右侧 r 魔术方法。\n\n相反，r 方法在非对称情况下很有用 — 例如，当整数可能与 Point 对象相乘时。假设你想支持以下两种表达式：\n\
  \n```\npt3 = pt1 * 5\npt3 = 10 * pt1\n```\n\n这两个表达式中的第一个会导致调用 `__mul__` 方法，该方法会自动通过左操作数\
  \ pt1 被调用。\n\n第二个语句更有问题，因为 10 是整数，而整数类（int）不支持与 Point 对象相乘。因此，该语句要求 Point 类实现 `__rmul__`\
  \ 方法。\n\n> 单击此处查看代码图像\n\n```\ndef __rmul__(self, n):\n    ''' Return point * a scalar\
  \ number, n '''\n    newx = self.x * n\n```\n\n```\nnewy = self.y * n\nreturn Point(newx,\
  \ newy)\n```\n\n此方法定义的主体与 `__mul__` 方法定义相同。尽管 Point 对象现在位于乘法表达式的右侧，但它仍然通过 self 参数被引用。\n\
  \n## 9.10.7 原地运算符方法\n\n表 9.6 列出了为任何类提供组合赋值操作支持的魔术方法，包括 `+=`、`-=` 和 `*=`。\n\n这些方法名称中的\
  \ i 代表“原地”。如果你实现了这些方法，可以使运算符对你的类的对象执行真正的原地操作，从而修改内存中的实际数据对象。\n\n如果你支持所涉及的操作（例如用于实现加法的\
  \ `__add__`），但不支持相应的 i 方法，Python 仍然支持赋值操作；此行为是免费提供的。但此类操作不是原地操作：相反，它们会产生一个新对象，导致变量被重新分配给这个新对象。\n\
  \n例如，假设你有一个对象和对它的第二个引用。\n\n单击此处查看代码图像\n\n```\na = MyClass(10)\nb = a\na += 1\n```\n\
  \n```\nprint(a, b)  # Do a and b still have same value?\n```\n\n这里的问题是：如果操作 `a +=\
  \ 1` 是原地操作，那么 a 和 b 都继续引用相同的数据，该数据已被更改。但如果 `a += 1` 不是原地操作，则该操作必须将新数据分配给 a，这会打破\
  \ a 和 b 之间的关联。在这种情况下，操作后 a 和 b 引用不同的数据。\n\n字符串类（`str`）是不可变的，不将 `+=` 实现为原地操作。相反，它将字符串变量重新分配给内存中的新对象。\n\
  \n# 表 9.6. 原地操作魔术方法\n\n| 方法名称 | 描述 |\n|---|---|\n| `__iadd__(self, other)` | 组合加法赋值运算符方法。当\
  \ `+=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回 `self`。 |\n| `__isub__(self,\
  \ other)` | 组合减法赋值运算符方法。当 `-=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回 `self`。\
  \ |\n| `__imul__(self, other)` | 组合乘法赋值运算符方法。当 `*=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回\
  \ `self`。 |\n| `__itruediv__(self, other)` | 组合除法赋值运算符方法。当 `/=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回\
  \ `self`。 |\n| `__ifloordiv__(self, other)` | 组合向下取整除法赋值运算符方法。当 `//=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回\
  \ `self`。 |\n| `__imod__(self, other)` | 组合取模赋值运算符方法。当 `%=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回\
  \ `self`。 |\n| `__ipow__(self, other)` | 组合幂赋值运算符方法。当 `**=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回\
  \ `self`。 |\n| `__ilshift__(self, other)` | 组合左移赋值运算符方法。当 `<<=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回\
  \ `self`。 |\n| `__irshift__(self, other)` | 组合右移赋值运算符方法。当 `>>=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回\
  \ `self`。 |\n| `__iand__(self, other)` | 组合按位与赋值运算符方法。当 `&=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回\
  \ `self`。 |\n| `__ixor__(self, other)` | 组合按位异或赋值运算符方法。当 `^=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回\
  \ `self`。 |\n| `__ior__(self, other)` | 组合按位或赋值运算符方法。当 `|=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回\
  \ `self`。 |\n\n| `__imul__(self, other)` | 当 `*=` 运算符应用于类的对象时（该对象位于运算符左侧），会调用此方法。要成功实现原地操作，此方法应返回\
  \ `self`。 |\n| --- | --- |\n| `__idiv__(self, other)` | 实现 `/=` 运算符。此方法和表中的其他方法遵循与上述相似的指导原则。\
  \ |\n| `__igrounddiv__(self, other)` | 实现 `//=` 运算符，该运算符执行向下取整除法（向下舍入到最近的整数）。 |\n\
  | `__imod__(self, other)` | 实现 `%=`，该运算符执行模运算（余数）除法。 |\n| `__ilshift__(self, other)`\
  \ | 实现 `<<=` 运算符，该运算符执行按位左移。 |\n| - | 实现 `>>=` 运算符，该运算符执行按位右 |\n\n\n\n__irshift__(self,\
  \ other)\n\n__iand__(self, other)\n\n__ior__(self, other)\n\n__ixor__(self, other)\n\
  \n__ipow__(self, other[, modulo])\n\n当将这些方法实现为真正的原地运算符（以便修改内存中的数据对象）时，应遵循以下步骤：首先，修改调用该方法的实例的内容——即通过\
  \ self 参数访问的变量。其次，使用\n\nreturn self\n\n返回对该对象的引用。\n\n例如，Point 类可能会这样定义 __iadd__\
  \ 和 __imul__ 方法：\n\ndef __iadd__(self, other):\n    self.x += other.x\n    self.y\
  \ += other.y\n    return self\n\ndef __imul__(self, other):\n    self.x *= other\n\
  \    self.y *= other\n    return self\n\n# 9.10.8 转换方法\n\n许多数据转换方法（参见表 9.7）对 Python\
  \ 程序员非常有用。\n\n例如，每当对象在需要条件的上下文中使用时（如 if 语句或 while 循环），Python 会隐式调用 bool 转换以获取 True\
  \ 或 False 值。这个转换函数反过来会调用对象类的 __bool__ 方法。通过编写此类方法，你可以确定控制结构如何解释你的类的对象作为条件时的行为。\n\
  \n当然，__str__ 方法作为将任何内容显示为字符串的转换非常重要。但是，__str__ 已在前一节中介绍过。\n\n# 表 9.7 转换方法\n\n| 方法\
  \ | 描述 |\n|---|---|\n| __int__(self) | 响应 int 转换函数时调用。此方法应返回对象的整数等效值。 |\n| __float__(self)\
  \ | 响应 float 转换函数时调用。此方法应返回对象的浮点数等效值。 |\n| __complex__(self) | 响应 complex 转换函数时调用。此方法应返回对象的复数等效值。例如，执行\
  \ complex(1) 时，返回的值为 (1+0j)。 |\n| __hex__(self) | 响应 hex 转换函数以及格式化函数时调用。仅在 Python\
  \ 2.0 中使用。 |\n| __oct__(self) | 响应 oct 转换函数以及格式化函数时调用。仅在 Python 2.0 中使用。 |\n| __index__(self)\
  \ | 如果对象作为集合（如元组、字符串或列表）的索引，或切片操作中的限制，则调用此方法以返回实际索引号，该索引号必须是整数。 |\n| __bool__(self)\
  \ | 前面已在表 9.1 中描述。该方法应根据情况返回 True 或 False。大多数类的做法是返回 True，但在零值或空容器的情况下除外。 |\n\n\
  以下类定义说明了 Point 类与这些方法中几个简单定义的用法。\n\n> 单击此处查看代码图像\n\nclass Point:\n    def __init__(self,\
  \ x = 0, y = 0):\n        self.x = x\n        self.y = y\n\n    def __int__(self):\n\
  \        return int(self.x) + int(self.y)\n\n    def __float__(self):\n        return\
  \ float(self.x) + float(self.y)\n\n以下 IDLE 会话说明了这些转换的用法。用户输入以粗体显示。\n\n>>> p = Point(1,\
  \ 2.5)\n>>> int(p)\n3\n>>> float(p)\n3.5\n\n# 9.10.9 集合类方法\n\nPython 允许你创建自己的容器类。大多数程序员，尤其是初级到中级程序员，很少发现有此必要。Python\
  \ 的内置容器类（list、dict、set 等）功能多样、灵活且强大。\n\n但是，如果你选择，可以使用任何想要的存储机制实现自己的容器。例如，你可以创建由底层二叉树而非哈希表实现的字典类。\n\
  \n你还可以创建基于某些现有 Python 容器类但添加额外功能的自定义容器类。你可以通过继承或包含来实现这一点，这两者将在第 10 章“Decimal、Money\
  \ 和其他类”的实际示例中讨论。\n\n表 9.8 列出了构建自己的集合类时应支持的魔术方法，具体取决于你希望这些集合有多有用和强大。\n\n# 表 9.8 集合类魔术方法\n\
  \n| 语法 | 描述 |\n|---|---|\n| __len__(self) | 返回包含集合中元素数量的整数。 |\n| __getitem__(self,\
  \ key) | 给定用于选择元素的键，从集合中返回一个元素。此魔术方法响应索引表达式的使用，即 obj[key]。键可能是整数，在这种情况下，方法应执行索引操作。或者，键可能是非整数，例如数据字典的情况。无论哪种情况，适当的响应都是从集合中返回所选元素。\
  \ |\n| __setitem__(self, key, value) | 此魔术方法的目的与 __getitem__ 方法类似，只是 __setitem__\
  \ 设置指定的值——同样根据键，如果键是整数，则键可能是索引号。由键选择的元素应被指定的值替换。 |\n\n__delitem__(self, key) 此方法删除指定的项目，再次使用键值来选择该项目。\n\
  \n__iter__(self) 为集合对象返回一个迭代器；这样的迭代器是为集合实现 next 方法的对象。因此，实现 __iter__ 方法的最简单方式是返回\
  \ self，但要确保类直接实现 __next__ 方法。\n\n__next__(self) 此方法可以由类本身或专为与主类协同工作而设计的辅助类实现。无论哪种情况，此方法都应返回迭代中的下一个元素，否则引发\
  \ StopIteration 异常。\n\n__reversed__(self) 如果实现了此方法，则应返回值按逆序排列的集合迭代。\n\n__contains__(self,\
  \ item) 此方法应根据指定的项目是否可以在集合中找到而返回 True 或 False。\n\n__missing__(self, key) 如果集合被要求访问不存在的元素，则调用此方法。该方法可以返回一个值，例如\
  \ None，或者根据情况引发异常。\n\n以下代码提供了一个简单集合类的示例。这是一个专用的 Stack 类。它几乎不做什么，只是实现了 list 已经具备的一些功能；但\
  \ Stack 类还实现了 peek，它返回“顶部”（或最后一个）元素的值，而不会将其从堆栈中弹出。\n\nclass Stack:\n    def __init__(self):\n\
  \        self.mylist = []    # 此处使用了包含！\n\n    def append(self, v):\n        self.mylist.append(v)\n\
  \n    def push(self, v):\n        self.mylist.append(v)\n\n    def pop(self):\n\
  \        return self.mylist.pop()\n\n    def peek(self):\n        return self.mylist[-1]\n\
  \n    def __len__(self):\n        return len(self.mylist)\n\n    def __contains__(self,\
  \ v):\n        return self.mylist.__contains__(v)\n\n    def __getitem__(self, k):\n\
  \        return self.mylist[k]\n\n给定此类定义，我们可以创建一个 Stack 对象，然后将其作为集合进行操作。以下是一个示例：\n\
  \nst = Stack()\nst.push(10)\nst.push(20)\nst.push(30)\nst.push(40)\nprint('Size\
  \ of stack is:', len(st))\nprint('First elem is:', st[0])\nprint('The top of the\
  \ stack is:', st.peek())\nprint(st.pop())\nprint(st.pop())\nprint(st.pop())\nprint('Size\
  \ of stack is:', len(st))\n\n这些语句产生以下输出：\n\nSize of stack is: 4\nFirst elem is:\
  \ 10\nThe top of the stack is: 40\n40\n30\n20\nSize of stack is: 1\n\n如果你熟悉面向对象编程，可能会注意到，在这种情况下，同样的结果可以通过使用继承更轻松地实现。我们可以使用以下代码实现这个专用的\
  \ Stack 类：\n\nclass Stack(list):\n    def push(self, v):\n        self.append(v)\n\
  \n    def peek(self):\n        return self[-1]\n\n给定这几行代码，这个 Stack 类可以执行前面所示更复杂的类定义的所有操作。\n\
  \n\n\n\nearlier.\nThis solution—inheritance—works only when you choose to\nbuild\
  \ your collection class on top of an existing class, such as\n`list` or `dict`.\n\
  \n# 9.10.10 实现“`__iter__`”和“`__next__`”\n\n`__iter__` 和 `__next__` 方法，以及\n`next`\
  \ 函数，需要进一步阐述。这些方法使你的类的对象能够\n产生一个 _生成器_（或 _迭代器_），进而使其可用于某些特殊上下文，例如 `for`\n循环。让我们先从一些术语开始。\n\
  \n- 一个 _可迭代对象_ 是可以被迭代——或者更确切地说，逐个元素\n遍历的对象。要成为可迭代对象，对象必须响应 `__iter__` 并返回一个对象。\n\
  \n- 一个 _迭代器_ 是对 `__iter__` 的调用必须返回的对象。迭代器\n是一个可以用于遍历集合对象的对象。\n\n- 这个迭代器可以是同一个类，也可以是专门为此目的编写的单独类，\n\
  它必须响应 `__next__` 方法——也就是说，它必须实现这个魔术方法，即使它\n不做其他事情。\n\n这些能力很重要，因为它们使类的实例能够与 Python\
  \ `for` 关键字一起使用。例如，假设你有一个四维 Point 对象。如果\n这样的对象的迭代器一次获取四个坐标中的一个，那么该类的用户可以使用如下代码：\n\
  \n```\nmy_point = Point()\nfor i in my_point:\n    print(i)\n```\n\n这个示例将一次打印四个坐标中的每一个。\n\
  \n如前所述，集合可以是它自己的迭代器；要做到这一点，它\n在响应 `__iter__` 方法时返回 `self`，并且它\n自己实现 `__next__` 方法。\n\
  \n取决于你的容器的复杂性和你想要的灵活性程度，有几种方法可以\n实现这些方法。\n\n- 将对 `__iter__` 的调用传递给包含在目标中的集合对象。这是最简单的解决方案。这本质上是\n\
  让其他人来处理这项工作。\n\n- 在集合类本身中实现 `__iter__` 和 `__next__`。在这种情况下，`__iter__` 方法返回 `self`，\n\
  并初始化迭代设置。但是，这样的解决方案使得无法同时支持多个循环。\n\n- 响应 `__iter__` 方法，创建一个自定义迭代器对象，其唯一目的是支持\n遍历集合类。这是最健壮的，也是推荐的方法。\n\
  \n下一个示例说明了第二种方法，因为在大多数情况下，它相对简单。要为之前介绍的 Stack 类使用这种方法，添加以下方法定义：\n\n```\ndef __iter__(self):\n\
  \    self.current = 0\n    return self\n\ndef __next__(self):\n    if self.current\
  \ < len(self):\n        self.current += 1\n        return self.my_list[self.current\
  \ - 1]\n    else:\n        raise StopIteration\n```\n\n这里一个重要的编码技巧是将变量 current 引用为\
  \ self.current。这会导致该变量成为实例变量，而不是类变量或全局变量。\n\n当序列或迭代中的所有元素都通过反复递增 self.current 被遍历后，__next__\
  \ 方法会通过引发 StopIteration 异常来响应。这会导致 for 循环停止。\n\n# ## 9.11 支持多种参数类型\n\n如何编写接受多种参数类型的函数和方法？例如，假设你想以这样的方式编写一个\
  \ Point 类，使得 Point 对象既可以乘以标量数字，也可以乘以另一个 Point 对象。\n\nPython 不支持重载，但你可以在运行时测试参数的类型，并根据该类型采取不同的操作。至少有两种方法可以测试对象的类型。一种技术是调用\
  \ **type** 函数。\n\n![](img/6e45221a8147f2442c653a3d4a866570_595_0.png)\n\n```\ntype(object)\n\
  ```\n\n例如，你可以直接测试数据对象或变量，看它是否具有整数类型。\n\n```\nn = 5\nif type(n) == int:\n    print('n\
  \ is integer.')\n```\n\n更可靠的方法是使用 **isinstance** 函数。你可以使用两种不同的版本。\n\n![](img/6e45221a8147f2442c653a3d4a866570_595_1.png)\n\
  \n点击此处查看代码图像\n\n```\nisinstance(object, class)\nisinstance(object, tuple_of_classes)\n\
  ```\n\n第一个版本确定对象的类，然后如果对象的类与 *class* 参数相同或派生自该参数，则返回 **True**——也就是说，对象必须具有与第二个参数相同或派生自第二个参数的类。\n\
  \n这种语法的第二个版本相同，只是它允许你包含一个多个类的元组（即不可变列表）。\n\n以下是第一种语法的示例：\n\n点击此处查看代码图像\n\n```\n\
  n = 5\nif isinstance(n, int):\n    print('n is an integer or derived from it.')\n\
  ```\n\n以下是第二种语法的示例。这种技术使你能够测试 n 是否包含任何整数或浮点数。\n\n点击此处查看代码图像\n\n```\nif isinstance(n,\
  \ (int, float)):\n    print('n is numeric.')\n```\n\n请记住，因为使用了 isinstance 而不是 type，n\
  \ 不需要具有 int 或 float 类型；派生自 int 或 float 的类型就足够了。这类类型不常见，但你可以通过子类化来创建一个。\n\n因此，例如，假设你想要使\
  \ Point 对象支持乘以其他 Point 对象和数字。你可以通过定义 __mul__ 方法来做到这一点，如下所示：\n\n点击此处查看代码图像\n\n```\n\
  def __mul__(self, other):\n    if type(other) == Point:\n        newx = self.x *\
  \ other.x\n        newy = self.y * other.y\n        return Point(newx, newy)\n \
  \   elif type(other) == int or type(other) == float:\n        newx = self.x * other\n\
  \        newy = self.y * other\n        return Point(newx, newy)\n    else:\n  \
  \      return NotImplemented\n```\n\n如果这个类不知道如何处理涉及 _other_ 类的操作，则返回 **NotImplemented**\
  \ 而不是引发异常很重要。通过返回 **NotImplemented**，你使 Python 能够询问右操作数其类是否支持 __rmul__ 方法来处理这种情况。\n\
  这个方法也可以使用 **isinstance** 函数来检查类型，而不是使用 **type** 函数来定义。\n\n点击此处查看代码图像\n\n```\ndef\
  \ __mul__(self, other):\n    if isinstance(other, Point):\n        newx = self.x\
  \ * other.x\n        newy = self.y * other.y\n        return Point(newx, newy)\n\
  \    elif isinstance(other, (int, float)):\n        newx = self.x * other\n    \
  \    newy = self.y * other\n        return Point(newx, newy)\n    else:\n      \
  \  return NotImplemented\n```\n\n无论哪种情况，对数字乘法的支持都是不对称的；这样的操作可能出现在如下表达式中：\n\n```\n\
  pt2 = 5.5 * pt1\n```\n\n当然，问题是不能为整数或浮点数添加魔术方法，因为我们没有编写这些类。因此，应该为 Point 类编写 __rmul__\
  \ 方法。\n\n点击此处查看代码图像\n\n```\ndef __rmul__(self, other):\n    if isinstance(other,\
  \ (int, float)):\n        newx = self.x * other\n        newy = self.y * other\n\
  \        return Point(newx, newy)\n    else:\n        return NotImplemented\n```\n\
  \n# 9.12 动态设置和获取属性\n\nPython 对象可以有许多属性；这些包括实例变量、方法和属性。所有这些属性的共同点是它们是硬编码的——也就是说，这些名称在编程代码中是固定的。\n\
  \n但有时动态设置属性很有用，即在运行时根据运行时条件设置属性名称。这允许用户建议属性名称，或者属性名称可以来自数据库或其他应用程序。第 15 章“从互联网获取财务数据”使用了这种技术。\n\
  \n**setattr** 函数的语法如下所示。\n\n![](img/6e45221a8147f2442c653a3d4a866570_599_0.png)\n\
  \n点击此处查看代码图像\n\n```\nsetattr(object, name_str, value)\n```\n\n在这种语法中，_object_ 是对要修改的对象的引用，_name_str_\
  \ 是包含属性名称的字符串，_value_ 是包含值的数据对象或表达式。\n\n**getattr** 函数具有互补的语法。\n\n![](img/6e45221a8147f2442c653a3d4a866570_599_1.png)\n\
  \n点击此处查看代码图像\n\n```\ngetattr(object, name_str [, default_val])\n```\n\n以下是一个简单的示例，在\
  \ IDLE 环境中输入。属性 _breed_ 是动态添加的，并设置为 'Great\n\n\n\n\n## 第 9 章 小结\n\nPython 提供了一种灵活且强大的面向对象编程方式。基本概念——类——本质上是一种用户定义的类型。但是，与其他面向对象编程系统（OOPS!）一样，这种类型可以包含任意数量的方法定义。方法是在类中定义的函数，通常通过该类的实例来调用。\n\
  \n```python\nmy_dog = Dog('Bowser')\nmy_dog.speak()\n```\n\nPython 方法有一个必须的第一个参数，按照惯例称为\
  \ **self**。\n\n**self** 参数在任何方法调用中都不会显式出现；但是，它必须始终出现在任何旨在通过单个实例调用的方法 _定义_ 中。名称 **self**\
  \ 是对对象本身的引用。\n\nPython 具有极强的多态性，原因是变量和函数名永远不会在运行时之前解析——也就是说，直到语句被执行。因此，任意数量的类可以定义同名的属性，但特定对象的正确代码始终会被正确访问。\n\
  \nPython 最独特的特征之一是，任何类都可以利用 _魔术方法_：对 Python 具有特殊含义并在特殊情况下自动调用的方法名称。例如，`__init__`\
  \ 方法在类的实例被初始化时被调用。魔术方法名称的特征始终是同时具有前导和后置双下划线（`__`）。因此，如果你自己避免使用此类名称，就不会存在命名冲突的可能性。\n\
  \n本章介绍了 Python 支持的许多魔术方法，包括 `__init__` 以及支持算术和其他操作的方法。\n\n## 第 9 章 复习问题\n\n1. 你如何描述类与其实例之间的关系？例如，它是一对一还是一对多的关系？\n\
  \n2. 哪种信息仅保存在实例中？\n\n3. 哪些信息保存在类中？\n\n4. 方法究竟是什么，它与标准函数有何确切区别？\n\n5. Python 是否支持继承，如果支持，语法是什么？\n\
  \n6. Python 在多大程度上支持封装（使实例或类变量私有）？\n\n7. 类变量和实例变量之间究竟有什么区别？\n\n8. 在类的方法定义中，self\
  \ 何时需要使用，如果需要的话？\n\n9. `__add__` 和 `__radd__` 方法之间有什么区别？\n\n10. 什么时候真的需要反射方法？什么时候不需要，即使你支持该操作？\n\
  \n11. `__iadd__` 方法被称为什么？\n\n12. `__init__` 方法是否被子类继承？如果你需要在子类中自定义其行为，该怎么办？\n\n\
  ## 第 9 章 建议练习题\n\n1. 编写并测试一个三维 Point 类，该类支持两个该类对象之间的加法和减法，以及与标量值（整数或浮点数）的乘法。除了 `__init__`\
  \ 方法外，你还需要编写魔术方法，包括 `__str__`、`__repr__`、`__add__`、`__sub__`、`__mul__` 和 `__rmult__`。`__rmult__`\
  \ 方法是支持 `n * point` 形式表达式所必需的，其中 `point` 是乘法符号右侧的 Point 对象。\n\n2. 编写并测试一个 BankAcct\
  \ 类，该类至少包含以下状态信息：姓名、账号、金额和利率。除了 `__init__` 方法外，该类应支持调整利率、提取和存款（可以合并在一个方法中）、更改利率以及标记时间流逝的方法——后者应自动计算指定天数的利息。\n"
- "# 10. Decimal、货币和其他类\n\n在电影《超人 III》中，一位计算机天才发现，如果他能在银行每笔交易中窃取一分钱的小数部分，并将该小数部分转移到自己的账户，他就能致富。这是因为一分钱的小数部分乘以每天数百万笔交易，就能积少成多。\n\
  \n这就是为什么银行家关心舍入误差。他们知道一分钱的小数部分可以积少成多。精确金额很重要。\n\n早期，电子计算机被用于商业目的，因此精确记录美元和美分（或任何货币）而不出错非常重要。这就是本章的主旨：利用特别适合财务目的的数据跟踪方式。本章将介绍\
  \ `Decimal` 类和我们将逐步构建的 Money 类。\n\n我们还将简要介绍 `Fraction` 和内置的 `complex` 类，尽管后者主要用于高级数学和科学应用。\n\
  \n## 10.1 数值类概览\n\n本书大部分内容关注两种数值数据：整数和浮点数。这些数据类型对于许多应用程序来说已经足够。然而，正如你将看到的，它们并不完美。整数的明显缺点是不能保存小数，而浮点数据存在舍入误差，我们将在本章中展示这一点。\n\
  \n本章介绍了其他数据格式，包括一个我们将根据第 9 章“类和魔术方法”的原则自行开发的格式。\n\n- `Decimal` 类，它是一种“定点”数据类型，可以精确且无误差地保存小数分数，例如\
  \ 0.02。\n- `Money` 类，你可以下载或自行开发。为了说明，本章采用后一种方法：我们自己开发这个类。\n- `Fraction` 类，它可以精确且无任何舍入误差地保存分数，例如三分之一或七分之一，这是其他类无法做到的。\n\
  - `complex` 类，它代表高等数学中的复数。这类数字既有“实”部分，也有“虚”部分。\n\n如果你不熟悉高等数学中复数的用法，不用担心。除非你从事需要使用复数的工作，否则可以安全地忽略这些数字。如果你是这类人，你自己已经知道了。\n\
  \n这些类都不需要你从互联网下载任何东西，而且 `complex` 类甚至不需要导入任何内容。它是一个内置类，就像 `int`、`float` 和 `str`\
  \ 一样。\n\n## 10.2 浮点格式的局限性\n\n`float` 值的问题是，它们以十进制格式显示，但在内部以二进制存储。计算机可以精确存储 0.5 这样的数值，因为该值直接映射到二进制分数，但计算机在处理其他分数时会出现问题。\n\
  \n例如，如果你能以二进制基数显示浮点数，十进制数 2.5 将如下所示：\n\n```\n10.1\n```\n\n但是像 0.3 这样的十进制分数呢？问题是\
  \ 0.3 必须存储为三十分之一，而十分之一无论精度有多少位都无法在二进制格式中精确存储。这是因为 1/10 不是 2 的幂，不像 1/2 或 1/4。因此，在这种情况下，数值必须被舍入，从而产生微小的不准确。\n\
  \n下面是 Python 中的一个示例，可以在 IDLE 中轻松演示：\n\n```python\n>>> 0.1 + 0.1 + 0.1\n0.30000000000000004\n\
  ```\n\n这个结果在数学上是错误的，但它表明的不是处理器损坏，而是每当浮点运算处理十分之一之类的分数时，微小的舍入误差可能会出现。大多数程序只是忽略这些错误，因为打印和格式化函数通常在一定位数后进行舍入，从而隐藏了这些错误。\n\
  \n通常这没问题。编程的假设是，使用浮点数时必须接受微小误差；这只是你要付出的代价。在科学和实际应用中，通常根本不存在无限精度。例如，太阳距离地球并不是 _精确_\
  \ 9300 万英里，只是大约。\n\n此外，你可以使用 **round** 函数消除这样的微小误差。\n\n```python\n>>> round(1.0\
  \ + 1.0 + 1.0, 2)\n0.3\n```\n\n但是对于财务应用程序，我们希望做得更好，不依赖于不断使用 **round** 函数。小数很重要，即使是微小的误差也是不可接受的，因为它们可能会随时间累积。对于银行家来说，$1.99\
  \ 必须精确等于 $1.99。\n\n下面是一些更多演示舍入误差的示例。\n\n```python\n>>> 0.6 + 0.3 + 0.1 # Should\
  \ produce 1.0\n0.9999999999999999\n>>> (0.6 + 0.3 + 0.1) / 2 # Should produce 0.5\n\
  0.49999999999999994\n```\n\n\n\n\n\n当你处理业务应用程序，尤其是银行业务领域时，能够精确地存储像 44.31 这样的数字，且没有任何误差，将非常有用。幸运的是，Python\
  \ 提供了一个解决这个问题的类：`Decimal` 类。\n\n## 10.3 介绍 Decimal 类\n\n在 IDLE 中，执行以下 `import` 语句。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_608_0.png)\n\n我们现在可以定义任意数量的 `Decimal`\
  \ 类实例，它——就像浮点类 `float` 一样——可以存储小数部分。\n\n![](img/6e45221a8147f2442c653a3d4a866570_608_1.png)\n\
  \n如你所见，`Decimal` 实例的默认值是零 (0)。但你可以赋予任何喜欢的十进制值，并且它会被精确地存储。\n\n```\n>>> d = Decimal('0.1')\n\
  >>> print(d + d + d)\n0.3\n```\n\n这个示例符合你的预期，但你应该已经注意到其中的一个转折。**Decimal** 变量 `d`\
  \ 是用文本字符串初始化的。用浮点值来初始化似乎更自然。但看看如果你这样做会发生什么。\n\nClick here to view code image\n\n\
  ```\n>>> d = Decimal(0.1)\n>>> print(d)\n0.10000000000000000555111512312578...\n\
  ```\n\n这个结果看起来一定很奇怪。但这背后有原因。当使用 `0.1` 进行初始化时，一个浮点值（类型 **float**）被转换为 **Decimal**\
  \ 格式。如前所述，**Decimal** 可以以绝对精度存储 `0.1`。但在这种情况下，它首先必须从浮点数转换；而问题是，浮点值_本身已经包含了舍入误差_。这就像是吃了有毒之树的果实。\n\
  \n我们如何解决这个问题？从字符串初始化是最佳解决方案。使用 \"`0.01`\" 作为初始化器表示，“我希望得到这个字符串所代表的十进制实现”——也就是说，没有舍入误差的值。\n\
  \n让我们看看另一个示例。\n\nClick here to view code image\n\n```\n>>> d = Decimal('0.1')\n\
  >>> print(d + d + d)\n```\n\n这给出了正确答案。将其与浮点版本进行对比。\n\n![](img/6e45221a8147f2442c653a3d4a866570_610_0.png)\n\
  \n```\n>>> print(0.1 + 0.1 + 0.1)\n0.30000000000000004\n```\n\n这里是另一个示例。以下使用浮点算术的情况显示了一个比使用\
  \ **Decimal** 解决的错误更明显的错误。\n\n![](img/6e45221a8147f2442c653a3d4a866570_610_1.png)\n\
  \n```\n>>> print(0.1 + 0.1 + 0.1 - 0.3)\n5.551115123125783e-17\n>>> d1, d3 = Decimal('0.1'),\
  \ Decimal('0.3')\n>>> print(d1 + d1 + d1 - d3)\n0.0\n```\n\n**Decimal** 类保持精度。例如，如果你对具有两位精度（包括尾随零）的\
  \ **Decimal** 实例进行算术运算，这两位精度会被保持，如你所见：\n\n![](img/6e45221a8147f2442c653a3d4a866570_610_2.png)\n\
  \n```\n>>> d1, d3 = Decimal('0.10'), Decimal('0.30')\n>>> d1 + d3\nDecimal('0.40')\n\
  ```\n\n这种行为在使用 **Decimal** 对象表示美元和美分，并且希望保留小数点右侧两位精度的情况下很有用。你可以将一列这样的数字相加，只要它们都不超过两位精度，右侧的两位就会被保持。\n\
  \n这里是另一个示例：\n\nClick here to view code image\n\n```\n>>> d1, d2 = Decimal('0.50'),\
  \ Decimal('0.50')\n>>> print(d1 + d2)\n1.00\n```\n\nNote\n如果你将一个对象传递给 print 函数，那么默认情况下，它会打印数字的标准字符串表示形式。对于\
  \ Decimal 对象，这种表示形式是一串简单的数字，并带有适当的小数点。\n\n1.00\n\n但是，如果你在 IDLE 环境中直接将 Decimal 对象作为输入，它会打印规范表示形式，其中包括类型名称和引号：\n\
  \nDecimal('1.00')\n\nDecimal 类还有一些值得注意的其他行为特点。如果你将两个这样的对象相乘，精度不会被保持，反而会增加。下面是一个示例：\n\
  \nClick here to view code image\n\n```\n>>> d1, d3 = Decimal('0.020'), Decimal('0.030')\n\
  >>> print(d1 * d3)\n0.000600\n```\n\n但是，你可以始终通过使用 **round** 函数来调整此类对象的精度，该函数重新调整小数点右侧的位数（去掉尾随零），并对数字进行向上或向下舍入。下面是一个示例：\n\
  \n```\n>>> print(round(d1 * d3, 4))\n0.0006\n>>> print(round(d1 * d3, 3))\n0.001\n\
  ```\n\n与整数和浮点值交互时适用几条规则。\n\n- 你可以自由地将整数与 **Decimal** 对象相乘，也可以将它们相加。\n- 你也可以直接且精确地从整数初始化：\n\
  \  ```\n  d = Decimal(5)\n  ```\n- 将 **Decimal** 对象与浮点值相加或相乘会导致错误。要执行此类操作，你需要将浮点数转换为\
  \ **Decimal** 对象——例如，先从浮点值转换，然后再进行舍入。否则，两种类型之间的算术运算会导致运行时错误。\n\n因此，例如，你可以执行以下操作，与整数交互：\n\
  \n```\n>>> d = Decimal(533)\n>>> d += 2\n>>> print(round(d, 2))\n535.00\n```\n\n\
  > ### Performance Tip\n> 创建 `Decimal` 对象所需的时间大约是创建浮点对象的 30 倍，而浮点数上的算术运算速度比 `Decimal`\
  \ 对象快 60 倍。教训是，在需要时使用 `Decimal` 对象，但在大多数应用程序中使用浮点值也有充分的理由。\n\n## 10.4 Decimal 对象上的特殊操作\n\
  \n如果你创建一个 `Decimal` 对象并获取其帮助，文档将揭示大量操作和方法。\n\n```\n>>> help(Decimal)\n```\n\n其中大多数是魔术方法，它们存在是为了支持两个\
  \ `Decimal` 对象之间，或 `Decimal` 对象与整数之间的所有基本算术运算。其他操作，例如对数函数，也受到支持。\n\n在其他方法中，大多数非常技术性或是空操作：它们实际上除了按当前状态返回对象之外什么也不做。但是，有些方法对\
  \ Python 程序员来说很有意思。其中之一是 **normalize** 方法。其作用是将对象的精度减少到所需的最小值，实际上去掉尾随零。\n\n在以下示例中，**normalize**\
  \ 将一个小数点后精度为三位的对象，转换为只有一位精度的对象。\n\n```\n>>> d = Decimal('15.700')\n>>> print(d)\n\
  15.700\n>>> d2 = d.normalize()\n>>> print(d2)\n15.7\n```\n\n**normalize** 方法甚至会在小数部分为零时彻底去掉小数点。\n\
  \n```\n>>> d = Decimal('6.00')\n>>> print(d)\n6.00\n>>> d2 = d.normalize()\n>>>\
  \ print(d2)\n6\n```\n\n但是，当你更改 **Decimal** 值的精度时，你会得到一个具有不同内部状态的对象，即使在相等性测试（`==`）中这些值被认为是相等的。假设前面示例中\
  \ `d` 和 `d2` 的值：\n\n```\n>>> d == d2\nTrue\n```\n\nDecimal 对象是不可变的，就像整数、浮点值和字符串一样。但是，以下代码是合法的，因为它并不真正更改现有的\
  \ Decimal 数据；它只是将 d 与一个新对象关联。（因此，`is` 运算符会显示这两个对象不相同。）但是请记住，原始对象在数值上被认为等于其归一化版本。\n\
  \nClick here to view code image\n\n```\n>>> d2 = d\n# Save old version of d in d2.\n\
  >>> d = d.normalize() # Now d is normalized.\n>>> d2 == d\nTrue\n>>> d2 is d\nFalse\n\
  ```\n\nas_tuple 方法提供了关于此类对象内部结构的重要线索。\n\nClick here to view code image\n\n```\n\
  >>> d = Decimal('15.0')\n>>> d.as_tuple()\nDecimalTuple(sign=0, digits=(1, 5, 0),\
  \ exponent=-1)\n```\n\n以下是这对该对象内部结构的暗示。\n\n\n\n\n\n有一个符号位（1 表示负数；0 表示非负数）。\n十进制数字（1、5、0）被单独存储。\n\
  精度被存储，在此情况下为负指数，显示需要将小数点向右移动多少位（如果为负数则向左移动）。\n\n事实上，如果你选择，可以使用相同的信息直接构造一个 `Decimal`\
  \ 对象。将元组放在括号内，然后使用该信息来初始化对象：\n\n```\n>>> d = Decimal((0, (3, 1, 4), -2))\n>>> print(d)\n\
  3.14\n```\n\n此类元组（完全描述 Decimal 对象状态的元组）的一般结构如下所示。\n\n![](img/6e45221a8147f2442c653a3d4a866570_616_0.png)\n\
  \n```\n(sign_bit, (digit1, digit2, digit3...), exponent)\n```\n\n另一种有时很有用的操作是 decimal\
  \ 包中定义的 `getcontext` 函数。以下是使用示例。\n\n```\n>>> decimal.getcontext()\nContext(prec=28,\
  \ rounding=ROUND_HALF_EVEN,\nEmin=-999999, Emax=999999, capitals=1, clamp=0,\nflags=[DivisionByZero,\
  \ Inexact, FloatOperation,\nRounded], traps=[InvalidOperation, DivisionByZero,\n\
  Overflow])\n```\n\n这里有大量信息需要梳理，但其中大部分很有用。首先，prec=28 表示最大精度为 28 位。其次，舍入技术 ROUND_HALF_EVEN\
  \ 表示，如果需要，最终有效数字将通过检查其右侧的数字是否为 5 或更大来舍入，如果是，则进位。traps 指示哪些操作会引发异常。\n\n## 10.5 十进制类应用\n\
  \n我们可以使用 `Decimal` 类来累加一列数字，其精度为小数点右侧两位。\n\n这是累加美元和美分数字的适当方式，因此你可以期望所有金额都采用 1.00（一美元）、1.50、9.95\
  \ 等形式。在这种情况下，如果出现分以下的零头，我们会将其四舍五入到最近的美分，而不是随意丢弃所有余数。\n\n最后，该应用程序将以美元和美分格式显示结果——但不会打印货币符号。（这是我们将在下一节中添加的功能。）在查看编码技术时，请记住，**Decimal**\
  \ 对象最自然且高效的创建方式是通过字符串初始化。\n\n点击此处查看代码图像\n\n```\nmoney_amount = Decimal('1.99')\n\
  ```\n\n以下是完整的应用程序代码。操作是提示用户输入一个数字，如果用户没有输入空字符串，则将指定的数字字符串作为 **Decimal** 对象添加。如果用户按\
  \ Enter 键且未输入任何内容，程序将中断、停止并打印总计。\n\n点击此处查看代码图像\n\n```\nfrom decimal import Decimal\n\
  total = Decimal('0.00')\nwhile True:\n    s = input('Enter amount in dollars and\
  \ cents (##.##): ')\n    if not s:\n        break\n    d = Decimal(s)\n    d = round(d,\
  \ 2)\ntotal += d\nprint('The sum of all these amounts is:', total)\n```\n\n该程序在处理小于\
  \ 0.01 的分数时，本可以采用两种不同的策略之一。你可以将所有较小的分数累加到运行总计中，并在最后进行舍入。但此处采用的方法是，在输入每个金额时即进行舍入。\n\
  \n以下是示例会话。\n\n点击此处查看代码图像\n\n```\nEnter amount in dollars and cents (#.##): 1\nEnter\
  \ amount in dollars and cents (#.##): 3.00\nEnter amount in dollars and cents (#.##):\
  \ 4.50\nEnter amount in dollars and cents (#.##): 33.003\nEnter amount in dollars\
  \ and cents (#.##): 12.404\nEnter amount in dollars and cents (#.##):\nThe sum of\
  \ all these amounts is: 53.90\n```\n\n由于此应用程序在每次输入后应用舍入，结果为 53.90。但我们也可以在最后一次性进行所有舍入，在这种情况下会产生略有不同的结果：53.91。\n\
  \n## 10.6 设计货币类\n\n金钱说话。现在我们将创建一个 Money 类。你可以下载这样的类。但亲自创建这样的类很有教育意义。在此过程中，我们将在第\
  \ 9 章中使用许多概念作为实际示例。\n\n将十进制数字与一个 *units* 数字一起存储可能很有用，该数字代表货币类型。我们将使用三种类型，由存储在额外字符串字段中的值来指示。顺便说一句，表\
  \ 10.1 中的缩写在国际上被公认为这些货币的标准名称。\n\n# 表 10.1 三种货币的缩写\n\n| Symbol (to store in units,\
  \ a str instance variable) | Description |\n|---|---|\n| 'USD' | 美元 |\n| 'EUR' |\
  \ 欧元 |\n| 'CAD' | 加元 |\n\n现在需要做出决定：我们应该使用以下两种方法中的哪一种？\n\n- 组合。这种方法将 Money 对象视为一个容器，包含一个\
  \ `Decimal` 对象和另一个对象（`units` 字段）。缺点是，对于你希望 Money 类支持的每个操作，都需要编写一个单独的魔术方法。\n- 继承。这种方法将\
  \ Money 对象视为一种特殊的 `Decimal` 对象，其中 `units` 字段作为额外属性添加。\n\n考虑到这一选择，继承可能是更好的方法；它也更符合面向对象的精神，即“A\
  \ 是 B 的一种，只是更专业化”的关系实际上是继承关系。\n\n另一方面，组合适用于“A 包含 B”的关系。在这种情况下，组合效果更好。\n\n但是 Python\
  \ 语言中有一个特性，使得在这种情况下继承难以使用。一般准则是，如果你希望保持简单，避免从不可变类或内置类继承。不幸的是，这包括从 `Decimal` 继承。\n\
  \n因此，在本章中，我们将使用对象组合来围绕 `Decimal` 类构建 Money 类。稍后，我们将在第 10.12 节“货币与继承”中展示如何使用继承来创建\
  \ Money 类。\n\n图 10.1 显示了组合架构。每个 Money 对象包含两部分：一个 `Decimal` 对象 `dec_amt` 和一个名为 `units`\
  \ 的字符串。\n\n![](img/6e45221a8147f2442c653a3d4a866570_621_0.png)\n\n图 10.1 使用组合的 Money\
  \ 类\n\n## 10.7 编写基本 Money 类（组合）\n\n围绕 `Decimal` 对象构建 Money 类在开始时很容易。以下是入门方法：\n\n\
  点击此处查看代码图像\n\n```\nfrom decimal import Decimal\n\nclass Money():\n    def __init__(self,\
  \ v = '0', units = 'USD'):\n        self.dec_amt = Decimal(v)\n        self.units\
  \ = units\n```\n\n使用这个简单的类定义，你可以创建 Money 对象并显示其属性，尽管还需要添加其他操作和方法。以下示例利用了默认单位为美元的特性。\n\
  \n点击此处查看代码图像\n\n```\n>>> m1 = Money('0.10')\n>>> print(m1.dec_amt, m1.units)\n0.10\
  \ USD\n```\n\n但如果你只能做到这些，那就不够出色。接下来要添加的是以有意义且自动的方式打印 Money 对象的功能。目前，如果你打印 m1，它就不太有用。\n\
  \n点击此处查看代码图像\n\n```\n>>> print(m1)\n<__main__.Money object at 0x103cc6f60>\n```\n\
  \n## 10.8 显示 Money 对象（“__str__”、“__repr__”）\n\n要确定 Money 对象的打印方式，请为类编写一个 `__str__`\
  \ 方法。以下是要添加到类定义中的函数的工作版本。\n\n点击此处查看代码图像\n\n```\ndef __str__(self):\n    s = str(self.dec_amt)\
  \ + ' ' + self.units\n    return s\n```\n\n以下是利用此方法的示例会话。\n\n```\n>>> m1 = Money('5.01',\
  \ 'CAD')\n>>> print(m1)\n5.01 CAD\n```\n\n如你所见，现在可以轻松初始化和显示 Money 对象，默认单位类型为 USD，表示使用美元。\n\
  \n但我们还希望打印类的良好规范表示形式。除了 `__str__` 之外，还需要 `__repr__` 方法定义。\n\n点击此处查看代码图像\n\n```\n\
  def __repr__(self):\n    s = ('Money(' + str(self.dec_amt) + ', ' +\n         self.units\
  \ + ')')\n    return s\n```\n\n类的 `__repr__` 函数通常与 `__str__` 函数不同。\n\n\n\n\n\n##\
  \ 10.9 其他货币操作\n\n到目前为止，我们使用 Money 类只能创建对象并打印它们。但要使该类有用，至少应支持 Money 对象之间的加法操作（+）。\n\
  \n如果暂时忽略单位的作用，`__add__` 函数很容易编写。这个版本假设你只想将 Money 对象添加到同一类的其他对象中。\n\nClick here to\
  \ view code image\n\n```\ndef __add__(self, other):\n    d = self.dec_amt + other.dec_amt\n\
  \    return Money(str(d))\n```\n\n我们可以扩展这个函数定义，预设左操作数使用的单位应由结果使用。实现这种方法给我们提供了函数定义的第二个版本。在以下代码中，要添加的项目以粗体显示，仅为了说明。\n\
  \n```\ndef __add__(self, other):\n    d = self.dec_amt + other.dec_amt\n    return\
  \ Money(str(d), self.units)\n```\n\n更有趣、更有用的是，在先乘以货币汇率后，将右侧使用的单位转换为与左侧匹配。虽然这些数字每天都在变化，但程序可以根据需要进行修改以适应这些变化。一种方法是从按需更新的文件中读取货币汇率。\n\
  \n为了暂时保持简单，我们将选取一些汇率（即撰写本文时的当前汇率），并假设程序可以根据需要进行修改。因为有六种可能的转换（来自我们支持的三种货币），最好的方法是使用字典。键值是连接两个货币符号的结果。值字段显示第二种货币必须乘以什么数字才能产生第一种货币。\n\
  \n```\nexch_dict = {\n    'USDCAD': Decimal('0.75'), 'USDEUR': Decimal('1.16'),\n\
  \    'CADUSD': Decimal('1.33'), 'CADEUR': Decimal('1.54'),\n    'EURUSD': Decimal('0.86'),\
  \ 'EURCAD': Decimal('0.65')\n}\n```\n\n例如，`USDCAD` 键的值为 0.75，这意味着加拿大元数字乘以 0.75 即可得到其等值的美元。现在，函数的最终版本可以在每当两种不同货币相加时应用货币汇率。\n\
  \n字典将汇率存储为 Decimal 对象，从而使后续算术运算更容易执行。\n\nClick here to view code image\n\n```\n\
  def __add__(self, other):\n    ''''Money add function.\n    Supports two Money objects\
  \ added together;\n\n    if\n    the second has a different currency unit,\n   \
  \ then\n    exchange rate must be applied before adding\n    the\n    two amounts\
  \ together. Apply rounding of 2.\n    '''\n    if self.units != other.units:\n \
  \       r = Money.exch_dict[self.units +\n                            other.units]\n\
  \        m1 = self.dec_amt\n        m2 = other.dec_amt * r\n        m = Money(m1\
  \ + m2, self.units)\n    else:\n        m = Money(self.dec_amt + other.dec_amt,\n\
  \                  self.units)\n    m.dec_amt = round(m.dec_amt, 2)\n    return\
  \ m\n```\n\n让我们逐步了解这个函数的工作原理。正如注释（或者更确切地说，文档字符串）所指出的，如果单位不同（例如美元与加拿大元），则在相加金额之前可能会应用汇率。虽然在大多数位置汇率表示为浮点数，但我们在这里将这些汇率存储为\
  \ **Decimal** 对象，以便需要进行的转换更少。\n\nClick here to view code image\n\n```\nr = Money.exch_dict[self.units\
  \ +\nother.units]\nm1 = self.dec_amt\nm2 = other.dec_amt * r\nm = Money(m1 + m2,\
  \ self.units)\n```\n\n无论哪种情况——无论是应用了汇率还是没有应用——我们也希望应用 2 的舍入因子，以便货币始终以小数点后两位精度表示。\n\
  \nClick here to view code image\n\n```\nm.dec_amt = round(m.dec_amt, 2)\n```\n\n\
  新的 Money 对象 m 最终由 `__add__` 函数返回。\n\n有了这个函数定义，以及可以作为 Money 类变量的 `exch_dict`，我们现在可以将不同货币相加——只要它们是该程序识别的三种货币之一（尽管该列表可以根据需要扩展）。例如，我们可以将一美元与一加拿大元相加并得到有意义的结果。\n\
  \nClick here to view code image\n\n```\n>>> us_m = Money('1', 'USD')\n>>> ca_m =\
  \ Money('1', 'CAD')\n>>> print(us_m + ca_m)\n1.75 USD\n```\n\n> Note\n> 当然，只要使用了三种支持的货币，这个函数定义就能正确工作。如果使用了\
  \ USD、CAD 或 EUR 以外的单位，每当混合货币相加时都会导致 **KeyError** 异常。\n\n把所有内容放在一起，这里是完整的 Money 类。当然，它并不真正完整，因为我们还可以添加许多操作，例如减法和整数乘法。\n\
  \nClick here to view code image\n\n```\nfrom decimal import Decimal\n\nclass Money():\n\
  \    ''''Money Class.\n    Stores both a Decimal amount and currency units.\n  \
  \  When\n    objects are added, exchange rate will be applied\n    if\n    the currency\
  \ units differ.\n    '''\n    exch_dict = {\n        'USDCAD': Decimal('0.75'),\
  \ 'USDEUR':\n        Decimal('1.16'),\n        'CADUSD': Decimal('1.33'), 'CADEUR':\n\
  \        Decimal('1.54'),\n        'EURUSD': Decimal('0.86'), 'EURCAD':\n      \
  \  Decimal('0.65')\n    }\n    def __init__(self, v = '0', units = 'USD'):\n   \
  \     self.dec_amt = Decimal(v)\n        self.units = units\n    def __str__(self):\n\
  \        s = str(self.dec_amt) + ' ' + self.units\n        return s\n    def __repr__(self):\n\
  \        s = ('Money(' + str(self.dec_amt) + ' ' +\n        str(self.units) + ')')\n\
  \        return s\n    def __add__(self, other):\n        \"\"\"Money add function.\n\
  \        Supports two Money objects added together;\n        if\n        the second\
  \ has a different currency unit,\n        then\n        exchange rate (r) is applied\
  \ before adding\n        the\n        two amounts together. Apply rounding of 2.\n\
  \        \"\"\"\n        if self.units != other.units:\n            r = Money.exch_dict[self.units\
  \ +\n            other.units]\n            ml = self.dec_amt\n            m2 = other.dec_amt\
  \ * r\n            m = Money(ml + m2, self.units)\n        else:\n            m\
  \ = Money(self.dec_amt + other.dec_amt,\n            self.units)\n        m.dec_amt\
  \ = round(m.dec_amt, 2)\n        return m\n```\n\n这就是（目前）完整的类定义——虽然，如前所述，你可能想添加许多操作。\n\
  \n## 10.10 演示：货币计算器\n\n有了完整的 Money 类定义，现在可以编写一个计算器应用程序，它可以将我们目前支持的三种不同货币中的任意数量金额相加，并以共同面额给出答案。\n\
  \n大部分代码很容易编写，但用户输入必须分解为数值和单位部分，这在一定程度上使编码变得复杂。幸运的是，大部分工作由 **str** 类型的 **split**\
  \ 方法完成。\n\nClick here to view code image\n\n```\nfrom decimal import Decimal\n\n\
  # Place Money class definition here or import it.\ndef money_calc():\n    ''''Money\
  \ addition calculator.\n    Prompt for a series of Money objects until empty\n \
  \   string is entered; then print results of the\n    running total.\n    '''\n\n\
  \    n = 0\n    while True:\n        s = input('Enter money value: ')\n        s\
  \ = s.strip()\n        if not s:\n            break\n        a_list = s.split()\
  \ # Split into amt, units.\n        d = a_list[0]\n        if len(a_list) > 1:\n\
  \            m = Money(d, a_list[1])\n        else:\n            m = Money(d)\n\
  \        if n == 0:\n            amt = m\n        else:\n            amt += m\n\
  \        n += 1\n    print('Total is', amt)\nmoney_calc()\n```\n\n这段代码的最后一行执行该函数，使其成为一个完整的程序。\n\
  \n这个函数有一个微妙之处。最好让第一种货币选择（第一行输入的单位）决定最终答案所使用的货币。这给用户对结果的控制权。例如，也许你希望结果以加拿大元或欧元表示；你只需确保第一个条目使用这些单位即可。\n\
  \n问题是，我们正在保持一个运行总数，而保持运行总数的常用方法是从初始零值开始。这里有一个示例：\n\n```\namt = Money('0')\n```\n\
  \n这里的问题是，目前 USD 是单位的默认值；因此，这个初始选择通过程序的逻辑，会预先确定该程序的每个结果都以美元表示。\n\n\n\n\n\n## 10.11\
  \ 设置默认货币\n\n为了让我们的 Money 类对更广泛的用户群更加友好，我们应该允许类的用户设置除美元以外的默认单位。实现此功能的一个简单方法是将其与类变量绑定，然后让类的用户按需更改它。\n\
  \n要做到这一点，我们首先需要向 Money 类添加一个类变量，这是一个非常容易做的更改。\n\n```python\nclass Money():\n   \
  \ default_curr = 'USD'\n```\n\n然后我们需要修改 `__init__` 函数。这比听起来要棘手，因为虽然你可以在方法定义中引用类变量，但不能在参数列表中使用这样的引用。因此，以下代码会导致错误：\n\
  \n```python\n# This causes an ERROR!\ndef __init__(self, v='0',\n             units=Money.default_curr):\n\
  ```\n\n令人沮丧的是，我们无法这样做。然而，`__init__` 函数的以下定义运行良好，它通过将默认值（空字符串）替换为存储在 `default_curr`\
  \ 中的值来实现。\n\n```python\ndef __init__(self, v='0', units=''):\n    self.dec_amt =\
  \ Decimal(v)\n    if not units:\n        self.units = Money.default_curr\n    else:\n\
  \        self.units = units\n```\n\n对 `__init__` 函数所做的更改（以粗体显示）后，类变量 `default_curr`\
  \ 现在实际上成为 `units` 的默认值。\n\n最后，`money_calc` 函数可以轻松修改，以便第一个项目输入的单位成为类的新默认设置。需要在循环大约四分之三处添加一行代码。\n\
  \n```python\nif n == 0:    # If this is first entry...\n    amt = m    # Create\
  \ amt!\n    Money.default_curr = m.units\n```\n\n有了这个更改，应用程序现在允许用户指定不同于美元的默认值。他们所要做的就是在输入的第一个货币对象中指定新的默认值。\n\
  \n例如，以下示例会话中的用户会导致加拿大元（CAD）成为默认值。\n\n```\nEnter money value: 1.0 CAD\nEnter money\
  \ value: 2.05\nEnter money value: .95\nEnter money value: 2\nEnter money value:\n\
  Total is 6.00 CAD\n```\n\n在这种情况下，很容易看出，总计使用的单位和默认货币使用的单位都是加拿大元，而不是美元。\n\n在下一个示例会话中，你可以看到，即使在系列中间输入了不同的货币，默认值仍然是加拿大元。\n\
  \n```\nEnter money value: 2.0 CAD\nEnter money value: -1\nEnter money value: 10\
  \ USD\nEnter money value: 5.01\nEnter money value: -5.01\nEnter money value:\nTotal\
  \ is 14.30 CAD\n```\n\n你可以看到，所有加拿大金额都相互抵消，只剩下一加拿大元。还输入了 10 美元。但是最终结果以加拿大元打印——因为第一个数字是以\
  \ CAD 计价的。因此，虽然总和包含 10 美元，但它被转换为等值的加拿大元，加上未被抵消的一加拿大元，即 10 美元的加拿大元等价（13.30），加上一加拿大元（1.00），总计为\
  \ 14.30。\n\n你应该注意，更改类的默认单位有点棘手；只要程序正在运行，此类更改就会影响类的所有后续用途。（但是，它不影响程序的未来运行。）但如果你稍加注意，这不应该成为问题。\n\
  \n## 10.12 金钱与继承\n\n获得金钱的最佳方式是什么？当然是继承。\n\n正如我们在第 10.6 节“设计 Money 类”中提到的，基于现有对象类型\
  \ `Decimal` 创建 Money 类的更自然方式是使用继承——即子类化 `Decimal`。\n\n问题是 `Decimal` 类型是不可变的。这带来了一个特殊的挑战；这个挑战可以通过几行代码来解决，但如何编写这段代码并不明显。不过，不用担心。本节将为你提供这种专业知识。\n\
  \n通常，继承很容易实现。假设 Money 子类化了另一个名为 Thingie 的类，该类不是不可变的。在这种情况下，你可以使用以下易于编写的代码：\n\n```python\n\
  class Money(Thingie):\n    def __init__(self, v, units='USD'):\n        super().__init__(v)\n\
  \        self.units = units\n```\n\n这种方法的意思是（请记住，这是你对大多数类使用的方法，但不适用于 `Decimal`）“调用超类函数来处理第一个参数的初始化，但直接初始化第二个参数\
  \ units。”请记住，units 是 Money 类添加到 Thingie 类的额外属性。\n\n但是，这种方法对于像 Decimal 这样的不可变类会失败。相反，有必要为\
  \ Money 类编写一个 `__new__` 方法。Money 类中 Decimal 部分的分配由 `__new__` 处理。\n\n```python\n\
  from decimal import Decimal\n\nclass Money(Decimal):\n    def __new__(cls, v, units='USD'):\n\
  \        return super(Money, cls).__new__(cls, v)\n\n    def __init__(self, v, units='USD'):\n\
  \        self.units = units\n\nm = Money('0.11', 'USD')\nprint(m, m.units)\n```\n\
  \n这个小程序打印以下内容：\n\n```\n0.11 USD\n```\n\n如果你想将这种编码技术应用于涉及不可变超类的其他情况，这里是你需要记住的：使用\
  \ `__new__` 函数调用超类版本的 `__new__`。参数应该是子类名称和 cls，即对类的引用。让此方法初始化源自超类的类部分（在此例中为 v）。确保传递超类版本的\
  \ `__new__` 返回的值。\n\n```python\ndef __new__(cls, v, units='USD'):\n    return super(Money,\
  \ cls).__new__(cls, v)\n```\n\n对于其他情况，我们可以将此模式推广到任何给定的类和超类，分别命名为 MyClass 和 MySuperClass，以及超类数据\
  \ d：\n\n```python\nclass MyClass(MySuperClass):\n    def __new__(cls, d, other_data):\n\
  \        return super(MyClass, cls).__new__(cls, d)\n```\n\n> **注意**\n>\n> 我们可以进一步将此代码概括如下，其中\
  \ `d` 是基类中的数据，`other_data` 是子类中的数据，应在 `__init__` 中初始化。\n>\n> ```python\n> class\
  \ MyClass(MySuperClass):\n>     def __new__(cls, d, other_data):\n>         return\
  \ super(MyClass, cls).__new__(cls, d)\n> ```\n\n现在，让我们回到 Money 示例。如果子类添加了任何其他属性并需要初始化，仍然需要编写\
  \ `__init__` 方法。`__init__` 方法应当用于\n\n\n\ninitialize these other attributes.\n\n\
  Click here to view code image\n\n```\ndef __init__(self, v, units='USD'):\n    self.units\
  \ = units\n```\n\nEven with these definitions in place, it’s still necessary to\
  \ print both the object itself (which inherits directly from `Decimal`) and the\
  \ `units`, which is the attribute added by Money.\n\n```\nprint(m, m.units)\n```\n\
  \nBut we can improve this situation by overriding the `__str__` method, to print\
  \ a Money object in a more natural and direct way. Notice that the superclass version\
  \ of this method is called to do much of the work.\n\nClick here to view code image\n\
  \n```\ndef __str__(self):\n    return super().__str__() + ' ' + self.units\n```\n\
  \nThis is a typical example of how you’d override the `__str__` method, regardless\
  \ of whether you’re subclassing an immutable class or a mutable class.\n\n> **Note**\n\
  > It may seem unreasonable that Python doesn’t let you use the easy approach to\
  \ subclassing another type, as shown earlier with the hypothetical superclass Thingie.\n\
  \nThere are a number of reasons that's not feasible in Python. For one thing, if\
  \ a superclass is immutable, that means its data can never be changed after it's\
  \ created. Also, some built-in classes make use of the `__new__` function to initialize\
  \ values, in addition to other actions, so that calling upon the superclass's `__init__`\
  \ function is inadequate. The basic rule is this: If subclassing a built-in type\
  \ the ordinary way doesn't work, you might need to subclass `__new__`.\n\n## 10.13\
  \ 分数类\n\nDecimal 和 Money 类可以以绝对精度存储十进制数字，例如 0.53。但这些类也有其局限性。\n\n如果你想存储 1/3 的值，该值无法在二进制基数下表示而不产生舍入误差。但在十进制基数下表示这个数量同样不可能！从数学上讲，你需要无限多的数字来在任一基数中存储\
  \ 1/3（三分之一）。\n\n0.33333333333333333333333333333333333333333...\n\n幸运的是，整数来拯救了我们。整数以绝对精度存储数字，通过创建具有两部分的对象——分子（上半部分）和分母（下半部分）——我们可以表示任何可以表示为两个整数之比的数字（参见图\
  \ 10.2）。\n\n![](img/6e45221a8147f2442c653a3d4a866570_642_0.png)\n\n### 分数类\n\n图\
  \ 10.2. 分数类的结构\n\n会出现一些问题，但这些问题都由该类平滑处理。例如，1/2、2/4 和 100/200 在数学上都是等价的。但得益于内部方法，这些都会自动减少到相同的内部表示。下面是一个示例。首先，我们需要导入该类。\n\
  \nClick here to view code image\n\n```\nfrom fractions import Fraction\n```\n\n\
  请务必按所示输入此语句。单词 fractions 是小写复数；单词 Fraction 是大写单数！为什么不一致，我们不确定。无论如何，导入该类后，可以以一致且非常方便的方式处理\
  \ Fraction 对象。让我们再看看处理 1/2、2/4 和 100/200 的问题。\n\nClick here to view code image\n\
  \n```\nfr1 = Fraction(1, 2)\nfr2 = Fraction(2, 4)\nfr3 = Fraction(100/200)\nprint('The\
  \ fractions are %s, %s, & %s.' % (fr1, fr2, fr3))\n```\n\n此示例打印\n\n```\nThe fractions\
  \ are 1/2, 1/2, & 1/2.\n```\n\n所有这些 **Fraction** 对象都显示为相同的数量，因为它们会自动减少到最简形式。\n\n\
  ```\n>>> if fr1 == fr2 and fr2 == fr3:\n    print('They are all equal!')\nThey are\
  \ all equal!\n```\n\n> Note\n> 通过使用第 4 章中指出的快捷方式之一，你可以将此示例中的条件替换为链式比较，从而产生更短的版本。\n\
  > >>> if fr1 == fr2 == fr3:\n>     print('They are all equal!')\n\n分数可以以其他方式指定。例如，如果初始化时只给出一个整数，该类将其存储为该整数除以\
  \ 1（当然，这是一个比率）。下面是一个示例：\n\n```\n>>> fr1 = Fraction(5)\n>>> print(fr1)\n5\n```\n\n\
  分数也可以从 **Decimal** 对象和浮点值转换。有时这工作良好，如下所示。\n\n```\n>>> fr1 = Fraction(0.5)\n>>> print(fr1)\n\
  1/2\n```\n\n但有时则不然。\n\n```\n>>> fr2 = Fraction(0.01)\n>>> print(fr2)\n5764607523034235/576460752303423488\n\
  ```\n\n哇，这里发生了什么？答案是，我们的老对头，浮点舍入误差，再次抬头了。**Fraction** 类尽力适应浮点值 0.01 中的那个微小舍入误差，因此得出了这个丑陋的比率。\n\
  \n有几种解决方案。一种是直接从字符串初始化，就像我们对 **Decimal** 对象所做的那样。\n\n```\n>>> fr2 = Fraction('0.01')\n\
  >>> print(fr2)\n1/100\n```\n\n这就好多了！另一种选择是使用 `limit_denominator` 方法。该方法表示分母只能变得这么大。考虑到这一限制，`Fraction`\
  \ 类会生成尽可能接近的近似值……而该近似值通常正好就是我们想要的数字。\n\n```\n>>> fr2 = Fraction(0.01).limit_denominator(1000)\n\
  >>> print(fr2)\n1/100\n```\n\n成功！但该类的真正强大之处在于它支持所有 `Fraction` 类型对象的标准操作，并且结果保证绝对正确。下面是一个示例：\n\
  \n```\n>>> fr1 = Fraction(1, 2)\n>>> fr2 = Fraction(1, 3)\n>>> fr3 = Fraction(5,\
  \ 12)\n>>> print(fr1 + fr2 + fr3)\n5/4\n```\n\n因此，1/2、1/3 和 5/12 相加得到 5/4。你可以自己验证这个答案是否正确。其他算术运算，如乘法、除法、减法等，均受支持，并可以与整数平滑结合。\n\
  \n```\n>>> fr1 = Fraction(1, 100)\n>>> print(fr1, 'times 50 =', fr1 * 50)\n1/100\
  \ times 50 = 1/2\n```\n\n考虑到你可以从指定浮点表达式的字符串（例如 `'0.1'`）初始化 **Fraction** 对象，那么你能否从字符串\
  \ `'1/7'` 初始化，这是我们真正想做的？\n\n是的。这尤其方便，我们将在即将推出的应用程序中使用它。\n\n```\n>>> fr1 = Fraction('1/7')\n\
  >>> print(fr1)\n1/7\n>>> fr1 += Fraction('3/4')\n>>> print(fr1)\n25/28\n```\n\n\
  这种转换只有在分子、正斜杠 (/) 和分母之间没有空格时才有效。很少有用户会愚蠢到加入额外空格。但如果你担心用户会这样做，你可以始终通过以下方式消除空格：\n\n\
  ```\ns = s.replace(' ', '')\n```\n\n最后，你始终可以访问 Fraction 对象的 **numerator** 和 denominator\
  \ 成员。但请记住，这些对象在输入后会立即被简化。下面是一个示例：\n\n```\n>>> fr1 = Fraction('100/300')\n>>> print('numerator\
  \ is', fr1.numerator)\nnumerator is 1\n>>> print('denominator is', fr1.denominator)\n\
  denominator is 3\n```\n\n现在，让我们创建另一个加法器应用程序——这次是针对分数的。分数可以以 'x/y' 形式的字符串输入，这使得这个应用程序易于编写。\n\
  \n```\nfrom fractions import Fraction\ntotal = Fraction('0')\nwhile True:\n    s\
  \ = input('Enter fraction (press ENTER to quit): ')\n    s = s.replace(',', '')\
  \ # Elim. spaces, just in case.\n    if not s:\n        break\n    total += Fraction(s)\n\
  print('The total is %s.' % total)\n```\n\n哇，这是一个短程序！之所以这么容易编写，是因为用户可以以他们通常使用的形式输入分数（例如\
  \ '1/3' 表示三分之一），而无需引入任何额外代码来词法分析此结果。是的，Fraction 类为你完成了所有工作！但是，用户不能以 '2 1/3' 的形式输入分数。那个特定的数量必须输入为\
  \ '7/3'。下面是一个示例会话。注意该应用程序如何平滑地处理负数和整数，例如 2。\n\n```\nEnter fraction (press ENTER\
  \ to quit): 2\nEnter fraction (press ENTER to quit): 1\nEnter fraction (press ENTER\
  \ to quit): 1/2\nEnter fraction (press ENTER to quit): 1/3\nEnter fraction (press\
  \ ENTER to quit): -3\nEnter fraction (press ENTER to quit):\nThe total is 5/6.\n\
  ```\n\n处理整数没有问题，因为像 2 这样的输入会被转换为分数 2/1。\n\n## 10.14 复数类\n\n在结束本章之前，我们将再看一个 Python\
  \ 内置类型：复数类。像 int 和 float 一样，它是一个完全内置的不可变类；你甚至不需要导入任何东西。复数到底是什么？幸运的是，如果你不知道它是什么，你几乎肯定不是需要知道它的人。复数理论为\n\
  \n\nscientists and engineers working in advanced areas of math; other people might\
  \ find the ideas interesting but almost never need to use them.\n\nBut, for what\
  \ it’s worth, a complex number—and you’ll see this if you stick around—has two parts:\
  \ a “real” part and an “imaginary” part. The imaginary part of a complex number\
  \ is the answer to the age-old question, What is the square root of –1?\n\nIf you\
  \ have some basic training in math, you may protest, “Negative numbers have no square\
  \ roots! There is no number that, multiplied by itself, produces –1!” We empathize,\
  \ but higher math presupposes such numbers.\n\nIf that’s a problem, the only thing\
  \ to be said is “Turn back now, or else abandon hope, all ye who enter.” But professional\
  \ mathematicians have worked out a series of techniques for dealing with such numbers.\n\
  \nStill with us? Okay. The first thing to be said about Python complex numbers is\
  \ that you can write them as literal numbers. Here’s an example:\n\n```python\n\
  z = 2.5 + 1.0j\n```\n\nAt first glance, z looks like a real number that is the sum\
  \ of 2.5 and 1.0 times a variable j. But it’s not. It’s a single object, in which\
  \ the real portion is 2.5 and the imaginary portion is 1.0.\n\nAs with other classes\
  \ we’ve looked at, the **complex** class produces objects that themselves are made\
  \ up of smaller parts. Figure 10.3 displays the structure of a complex-number object.\n\
  \n# complex type\n\n**Figure 10.3.** Structure of a Python complex number\n\nLet's\
  \ look at that assignment again.\n\n```python\nz = 2.5 + 1.0j\n```\n\nIf you understand\
  \ complex numbers, you may object that the letter `i` (not `j`) should be used to\
  \ represent the imaginary portion of a number. But `j` is used because the letter\
  \ `i` is used by some engineers to represent electric current; also, `i` is a formatting\
  \ character.\n\nAfter this assignment, `z` is an object that has real and imaginary\
  \ portions that can be accessed as `real` and `imag`, respectively.\n\nClick here\
  \ to view code image\n\n```python\nprint('Real part is %s and imaginary part is\
  \ %s.'\n      % (z.real, z.imag))\n```\n\nThis prints\n\nClick here to view code\
  \ image\n\n```\nReal part is 2.5 and imaginary part is 1.0.\n```\n\nAn alternative\
  \ to writing a literal is to use an explicit **complex** conversion:\n\n```python\n\
  z = complex(5.7, 10)\n```\n\nIf we then print the real and imaginary portions of\
  \ z explicitly, as in the previous example, z is now described this way:\n\nClick\
  \ here to view code image\n\n```\nReal part is 5.7 and imaginary part is 10.0.\n\
  ```\n\nThe ability to write complex numbers directly is a convenience. You can even\
  \ exclude the “real” part, and if you do, the number still has type **complex**.\
  \ So you can do things like this:\n\n```python\nprint(2j * 3j)\n```\n\nThis statement\
  \ produces the result of multiplying two complex numbers together (each of which\
  \ has an imaginary portion in this case; the real portion exists but in each case\
  \ is assumed to be 0). If you’re familiar with the basic math of complex numbers,\
  \ the result should not surprise you.\n\n```\n(-6+0j)\n```\n\nBy the way, if you\
  \ store this result in z and then examine z.real and z.imag, you’ll find that each\
  \ of these members is floating point, and not integer, despite the way the result\
  \ is displayed in this case.\n\n```python\n>>> print(type(z.imag))\n<class 'float'>\n\
  ```\n\nThe use of literal complex numbers, such as -6+0j, although convenient, creates\
  \ some situations in which you need to be careful. Parentheses are not required,\
  \ but errors can crop up if you omit them. For example, how do you think Python\
  \ evaluates the following?\n\n```python\nz = 0 + 2j * 0 + 3j\n```\n\nFrom the previous\
  \ discussion, it might seem that Python would treat this statement as if written\
  \ the following way:\n\n```python\nz = (0 + 2j) * (0 + 3j)\n```\n\nThis in turn\
  \ would produce the complex number (-6+0j). But Python does not interpret the statement\
  \ that way. How can it know that o is not just o, a real number, instead of part\
  \ of a complex number? Instead, the usual rules of precedence apply, and the statement\
  \ is evaluated by performing multiplication first.\n\n```python\nz = 0 + (2j * 0)\
  \ + 3j\n```\n\nSo now, printing `z` produces\n\n```\n3j\n```\n\n> **Note**\n> You\
  \ might think that spacing changes things here, that entering `0 + 3j` with internal\
  \ spaces omitted, resulting in `0+3j`, changes the interpretation of the expression.\
  \ It does not.\n\nEven the expression `3j` can be misleading if you’re not careful.\
  \ Any such expression is actually part of a complex number.\n\n```python\n>>> z\
  \ = 3j\n>>> print(z.real)\n0.0\n```\n\nYou can, if you choose, have complex numbers\
  \ with the imaginary portion currently set to zero. But the use of `j` ensures complex\
  \ type.\n\n```python\n>>> z = 2 + 0j\n>>> print(z)\n(2+0j)\n>>> print(z.real, z.imag)\n\
  2.0 0.0\n```\n\nAnd here’s another caveat: When you’re writing code that includes\
  \ complex numbers, it’s a good idea to avoid making `j` a variable.\n\nYou can convert\
  \ other numbers to **complex**, although the imaginary part will be assumed to be\
  \ zero. But complex numbers cannot be converted to these other types (instead, you\
  \ must assign from `.real` and `.imag` portions); they also cannot be compared to\
  \ each other or to other numbers by using >, <, >=, or <=.\n\nClick here to view\
  \ code image\n\n```python\nz = complex(3.5)    # This is valid; z.imag will be 0.\n\
  x = float(z)        # Not supported!\nx = z.real          # But this is valid.\n\
  ```\n\nThis should give you a good grounding in complex numbers in Python, although\
  \ most of the discussion has been about input and output formats, along with the\
  \ interpretation of literals.\n\nMathematically, complex numbers are not difficult\
  \ to handle, given that floating-point math is already well supported. Addition\
  \ is obvious, and multiplication follows these rules:\n\n- Multiply the four parts\
  \ together, using distribution to get four results.\n- There will be a real portion\
  \ (real times real).\n- There will be two portions with one factor of `j` each.\
  \ Add these together to get the new imaginary portion.\n- There will be a j-squared\
  \ portion (imaginary times imaginary). Convert j-squared to -1, which means reversing\
  \ the sign of the squared coefficient; then add that result back into the real portion.\n\
  \nThat’s how it’s done! When you understand these simple rules, complex math is\
  \ not such a mystery, after all.\n\n# CHAPTER 10 SUMMARY\n\nMost programming, or\
  \ at least much of it, focuses on working with integers and floating-point numbers,\
  \ but for certain areas of the data-processing industry, other data types may work\
  \ better. Foremost among these is a Decimal, or fixed-point type, which can hold\
  \ dollar-and-cents figures with more precision and accuracy than other data types\
  \ can.\n\nThis chapter has shown that Python’s support for alternative data formats\
  \ is very strong. You can easily utilize the Decimal, Fraction, and complex classes\
  \ in your own programs, without having to download anything off the Internet; the\
  \ complex type doesn’t even require importing.\n\nYou can also come up with your\
  \ own classes, building on the existing ones. And, although you can download a Money\
  \ class from the Internet, this chapter showed how to start creating your own Money\
  \ class, using the techniques introduced in Chapter 9, “Classes and Magic Methods.”\n\
  \nBut not everything is as easy as it looks. Inheriting from an immutable class\
  \ such as Decimal requires a particular coding technique shown in this chapter.\n\
  \n# CHAPTER 10 REVIEW QUESTIONS\n\n1. Compare and contrast the advantages and disadvantages\
  \ of the `float` and `Decimal` classes.\n\n2. Consider two objects: `Decimal('1.200')`\

  \ except for one situation: If and |\n\n\n\n| dline | e(si | ze = | -1) | 只有在已到达文件末尾（EOF）的情况下，此方法才返回空字符串。在读取文件最后一行的特殊情况下，此函数将返回不带换行符的字符串——除非换行符本身作为最后一个字符存在。\

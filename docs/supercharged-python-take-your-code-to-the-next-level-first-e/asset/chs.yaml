  \ s, t: stack.append(int(t))),\n(r\"[a-zA-Z_][a-zA-Z_0-9]*\", lambda s, t:\nstack.append(t)),\n\
  (r\"[+]\", lambda s, t: bin_op(operator.add)),\n(r\"[-]\", lambda s, t: bin_op(operator.sub)),\n\

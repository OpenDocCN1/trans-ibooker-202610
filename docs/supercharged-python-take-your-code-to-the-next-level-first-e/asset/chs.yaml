  \n![](img/6e45221a8147f2442c653a3d4a866570_674_0.png)\n\n下面是修订后的 Deck 类的完整版本，以及一个打印五张牌手牌（如扑克）的小程序。此版本假设使用六副牌鞋，但你可以轻松将其修改为仅使用一副牌。\n\
  \n# File deck_test.py\n# ------------------------------------------------------------\n\

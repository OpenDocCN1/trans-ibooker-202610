  \ 15. It also needs to be downloaded.\n\n## 4.7 FUNCTIONS AS FIRST-CLASS OBJECTS\n\
  \nAnother productivity tool—which may be useful in debugging, profiling, and related\
  \ tasks—is to treat Python functions as _first-class_ objects. That means taking\
  \ advantage of how you can get information about a function at run time. For example,\
  \ suppose you’ve defined a function called `avg`.\n\nClick here to view code image\n\
  \n```python\ndef avg(a_list):\n    \"\"\"This function finds the average val in\
  \ a\n    list.\"\"\"\n    x = (sum(a_list) / len(a_list))\n    print('The average\
  \ is:', x)\n    return x\n```\n\nThe name `avg` is a symbolic name that refers to\
  \ a function, which in Python lingo is also a callable. There are a number of things\
  \ you can do with `avg`, such as verify its type, which is **function**. Here’s\
  \ an example:\n\n```python\n>>> type(avg)\n<class 'function'>\n```\n\nWe already\
  \ know that `avg` names a function, so this is not new information. But one of the\
  \ interesting things you can do with an object is assign it to a new name. You can\
  \ also assign a different function altogether to the symbolic name, `avg`.\n\nClick\
  \ here to view code image\n\n```python\ndef new_func(a_list):\n    return (sum(a_list)\
  \ / len(a_list))\n\nold_avg = avg\navg = new_func\n```\n\nThe symbolic name `old_avg`\
  \ now refers to the older, and longer, function we defined before. The symbolic\
  \ name `avg` now refers to the newer function just defined.\n\nThe name `old_avg`\
  \ now refers to our first averaging function, and we can call it, just as we used\
  \ to call `avg`.\n\n```python\n>>> old_avg([4, 6])\nThe average is 5.0\n5.0\n```\n\
  \nThe next function shown (which we might loosely term a “metafunction,” although\
  \ it’s really quite ordinary) prints information about another function—specifically,\
  \ the function argument passed to it.\n\nClick here to view code image\n\n```python\n\
  def func_info(func):\n    print('Function name:', func.__name__)\n    print('Function\
  \ documentation:')\n    help(func)\n```\n\nIf we run this function on `old_avg`,\
  \ which has been assigned to our first averaging function at the beginning of this\
  \ section, we get this result:\n\nClick here to view code image\n\n```\nFunction\
  \ name: avg\nFunction documentation:\nHelp on function avg in module __main__:\n\
  \navg(a_list)\n    This function finds the average val in a list.\n```\n\nWe’re\
  \ currently using the symbolic name old_avg to refer to\nthe first function that\
  \ was defined in this section. Notice that\nwhen we get the function’s name, the\
  \ information printed uses\nthe name that _the function was originally defined with_.\n\
  \nAll of these operations will become important when we get to\nthe topic of “decorating”\
  \ in Section 4.9, “Decorators and\nFunction Profilers.”\n\n## 4.8 VARIABLE-LENGTH\
  \ ARGUMENT LISTS\n\nOne of the most versatile features of Python is the ability\
  \ to\naccess variable-length argument lists. With this capability, your\nfunctions\
  \ can, if you choose, handle any number of arguments—\nmuch as the built-in print\
  \ function does.\n\nThe variable-length argument ability extends to the use of\n\
  named arguments, also called “keyword arguments.”\n\n### 4.8.1 The *args List\n\n\
  The *args syntax can be used to access argument lists of any\nlength.\n\n![](img/6e45221a8147f2442c653a3d4a866570_258_0.png)\n\
  \nClick here to view code image\n\n```python\ndef func_name([ordinary_args,] *args):\n\
  \    statements\n```\n\nThe brackets are used in this case to show that *args may\
  \ optionally be preceded by any number of ordinary positional arguments, represented\
  \ here as ordinary_args. The use of such arguments is always optional.\n\nIn this\
  \ syntax, the name args can actually be any symbolic name you want. By convention,\
  \ Python programs use the name args for this purpose.\n\nThe symbolic name args\
  \ is then interpreted as a Python list like any other; you expand it by indexing\
  \ it or using it in a for loop. You can also take its length as needed. Here’s an\
  \ example:\n\nClick here to view code image\n\n```python\ndef my_var_func(*args):\n\
  \    print('The number of args is', len(args))\n    for item in args:\n        print(item)\n\
  ```\n\nThis function, my_var_func, can be used with argument lists of any length.\n\
  \nClick here to view code image\n\n```python\n>>> my_var_func(10, 20, 30, 40)\n\
  ```\n\n```\nThe number of args is 4\n10\n20\n30\n40\n```\n\nA more useful function\
  \ would be one that took any number of numeric arguments and returned the average.\
  \ Here’s an easy way to write that function.\n\n```python\ndef avg(*args) :\n  \
  \  return sum(args)/len(args)\n```\n\nNow we can call the function with a different\
  \ number of arguments each time.\n\n```python\n>>> avg(11, 22, 33)\n22.0\n>>> avg(1,\
  \ 2)\n1.5\n```\n\nThe advantage of writing the function this way is that no brackets\
  \ are needed when you call this function. The arguments are interpreted as if they\
  \ were elements of a list, but you pass these arguments without list syntax.\n\n\
  What about the ordinary arguments we mentioned earlier? Additional arguments, not\
  \ included in the list `*args`, must either precede `*args` in the argument list\
  \ or be keyword arguments.\n\nFor example, let’s revisit the `avg` example. Suppose\
  \ we want a separate argument that specifies what units we’re using.\n\nBecause\
  \ `units` is not a keyword argument, it must appear at the beginning of the list,\
  \ in front of `*args`.\n\nClick here to view code image\n\n```python\ndef avg(units,\
  \ *args):\n    print (sum(args)/len(args), units)\n```\n\nHere’s a sample use:\n\
  \nClick here to view code image\n\n```python\n>>> avg('inches', 11, 22, 33)\n22.0\
  \ inches\n```\n\nThis function is valid because the ordinary argument, `units`,\
  \ precedes the argument list, `*args`.\n\n> Note\n> The asterisk (*) has a number\
  \ of uses in Python. In this context, it’s called the _splat_\n> or the _positional\
  \ expansion_ operator. Its basic use is to represent an “unpacked list”; more specifically,\
  \ it replaces a list with a simple sequence of separate items.\n> The limitation\
  \ on such an entity as `*args` is that there isn’t much you can do with it. One\
  \ thing you can do (which will be important in Section 4.9, “Decorators and Function\
  \ Profilers”) is pass it along to a function. Here’s an example:\n> Click here to\
  \ view code image\n> >>> ls = [1, 2, 3] # Unpacked list.\n> >>> print(*ls) # Print\
  \ unpacked version\n> 1 2 3\n> >>> print(ls) # Print packed (ordinary list).\n>\
  \ [1, 2, 3]\n> The other thing you can do with `*args` or `*ls` is to pack it (or\
  \ rather, _repack_ it) into a standard Python list; you do that by dropping the\
  \ asterisk. At that point, it can be manipulated with all the standard list-handling\
  \ abilities in Python.\n\n### 4.8.2 The \"**kwargs\" List\n\nThe more complete syntax\
  \ supports keyword arguments, which are named arguments during a function call.\
  \ For example, in the following call to the print function, the end and sep arguments\
  \ are named.\n\nClick here to view code image\n\n```python\nprint(10, 20, 30, end='.',\
  \ sep=',')\n```\n\nThe more complete function syntax recognizes both unnamed and\
  \ named arguments.\n\n![](img/6e45221a8147f2442c653a3d4a866570_261_0.png)\n\nClick\
  \ here to view code image\n\n```python\ndef func_name([ordinary_args,] * args, **kwargs):\n\
  \ statements\n```\n\nAs with the symbolic name args, the symbolic name kwargs can\
  \ actually be any name, but by convention, Python programmers use kwargs.\n\nWithin\
  \ the function definition, kwargs refers to a dictionary in which each key-value\
  \ pair is a string containing a named argument (as the key) and a value, which is\
  \ the argument value passed.\n\nAn example should clarify. Assume you define a function\
  \ as\n\n\nfollows:\n\n```python\ndef pr_named_vals( **kwargs ):\n    for k in kwargs:\n\
  \        print(k, ':', kwargs[k])\n```\n\n该函数遍历由 **kwargs** 表示的字典，打印键值（对应参数名）以及传递给参数的相应值。\n\
  \n例如：\n\n```python\n>>> pr_named_vals(a=10, b=20, c=30)\na : 10\nb : 20\nc : 30\n\
  ```\n\n函数定义可以将任意数量的命名参数（即 **kwargs**）与任意数量的未命名参数（即 **args**）结合起来。下面是一个正是这样做的函数定义。以下示例定义了这样的函数，然后调用它。\n\
  \n```python\ndef pr_vals_2( *args, **kwargs ):\n    for i in args:\n        print(i)\n\
  \    for k in kwargs:\n        print(k, ':', kwargs[k])\npr_vals_2(1, 2, 3, -4,\
  \ a=100, b=200)\n```\n\n这个小程序作为脚本运行时，将打印以下内容：\n\n```\n1\n2\n3\n-4\na : 100\nb :\
  \ 200\n```\n\n> 注意\n> 虽然 args 和 kwargs 分别被展开为列表和字典，\n> 但这些符号可以传递给另一个函数，如下一节所示。\n\
  \n# 4.9 装饰器和函数分析器\n\n当你开始改进 Python 程序时，最有用的事情之一就是计时单个函数的运行速度。你可能想知道，当程序执行一个生成一千个随机数的函数时，会经过多少秒和秒的分数。\n\
  \n装饰后的函数可以分析代码的运行速度，并提供其他信息，因为函数是一等对象。装饰概念的核心是包装函数，它执行原函数的所有操作，但还会添加其他要执行的语句。\n\n\
  下面是一个示例，如图 4.3 所示。装饰器以函数 F1 作为输入，并返回另一个函数 F2 作为输出。第二个函数 F2 是通过包含对 F1 的调用并添加其他语句生成的。F2\
  \ 是一个包装函数。\n\n![](img/6e45221a8147f2442c653a3d4a866570_264_0.png)\n\n下面是一个装饰器函数的示例，它将函数作为参数，并通过添加对\
  \ time.time 函数的调用来包装它。请注意，time 是一个包，必须在调用 time.time 之前导入它。\n\n```python\nimport\
  \ time\n\ndef make_timer(func):\n    def wrapper():\n        t1 = time.time()\n\
  \        ret_val = func()\n        t2 = time.time()\n        print('Time elapsed\
  \ was', t2 - t1)\n        return ret_val\n```\n\n这个简单示例涉及几个函数（顺便说一句，它还不完整！），让我们回顾一下。\n\
  \n- 有一个函数作为输入；我们将其称为 _原始_ 函数（本例中为 F1）。我们希望能够输入任何想要的函数，并对其进行装饰——即获取一些额外的语句。\n- _包装_\
  \ 函数是将这些额外语句添加到原始函数的结果。在本例中，这些添加的语句报告原始函数执行所花费的秒数。\n- _装饰器_ 是执行创建包装函数并返回它的工作的函数。装饰器能够做到这一点，是因为它在内部使用\
  \ **def** 关键字来定义一个新函数。\n- 最终，包装后的版本旨在替换原始版本，如你将在本节中看到。这是通过重新分配函数名来完成的。\n\n如果你查看这个装饰器函数，应该注意到它有一个重要的遗漏：原始函数\
  \ _func_ 的参数被忽略了。因此，包装函数如果涉及参数，将无法正确调用 _func_。\n\n解决方案涉及上一节中引入的 **\\*args** 和 **\\\
  *\\*kwargs** 语言特性。下面是完整的装饰器：\n\n```python\nimport time\n\ndef make_timer(func):\n\
  \    def wrapper(*args, **kwargs):\n        t1 = time.time()\n        ret_val =\
  \ func(*args, **kwargs)\n        t2 = time.time()\n        print('Time elapsed was',\
  \ t2 - t1)\n        return ret_val\n    return wrapper\n```\n\n请记住，新函数将是 wrapper。正是\
  \ wrapper（或者更准确地说，暂时命名为 wrapper 的函数）最终将替代 func 被调用；因此，这个包装函数必须能够接受任意数量的参数，包括任意数量的关键字参数。正确的做法是将所有这些参数传递给原始函数\
  \ func。具体做法如下：\n\n```python\nret_val = func(*args, **kwargs)\n```\n\n返回值也在此处处理；包装函数返回与\
  \ func 相同的值，正如它应该做的那样。如果 func 不返回值怎么办？这不是问题，因为 Python 函数默认返回 None。因此，在这种情况下，值 None\
  \ 会被简单地传递。（你不需要测试返回值是否存在；总是存在一个！）\n\n定义了这个装饰器 make_timer 后，我们可以对任何函数生成一个包装后的版本。然后——这几乎是最后的技巧——我们重新分配函数名，使其指向函数的包装版本。\n\
  \n```python\ndef count_nums(n):\n    for i in range(n):\n        for j in range(1000):\n\
  \            pass\n\ncount_nums = make_timer(count_nums)\n```\n\n由 `make_timer`\
  \ 生成的包装函数定义如下（除了标识符 `func` 将被重新分配，如你稍后将看到）。\n\n```python\ndef wrapper(*args, **kwargs):\n\
  \    t1 = time.time()\n    ret_val = func(*args, **kwargs)\n    t2 = time.time()\n\
  \    print('Time elapsed was', t2 - t1)\n    return ret_val\n```\n\n我们现在重新分配名称 `count_nums`，使其指向\
  \ *这个* 函数——`wrapper`——它将调用原始的 `count_nums` 函数，但还会做其他事情。\n\n感到困惑了吗？诚然，起初这有点绕脑子。但实际发生的事情是：(1)\
  \ 在运行时创建原始函数的一个更复杂的版本，以及 (2) 这个更复杂的版本就是名称 `count_nums` 今后将指向的对象。Python 符号可以引用任何对象，包括函数（可调用对象）。因此，我们可以随意重新分配函数名。\n\
  \n```python\ncount_nums = wrapper\n```\n\n或者，更准确地说，\n\n```python\ncount_nums = make_timer(count_nums)\n\
  ```\n\n所以现在，当你运行 `count_nums`（它现在指向函数的包装版本）时，你会得到类似以下的输出，报告以秒为单位的执行时间。\n\n```python\n\
  >>> count_nums(33000)\nTime elapsed was 1.063697338104248\n```\n\n`count_nums` 的原始版本除了进行一些计数之外什么也不做；这个包装版本除了调用\
  \ `count_nums` 的原始版本之外，还会报告时间的流逝。\n\n作为最后一步，Python 提供了一小段方便的语法来自动化函数名的重新分配。\n\n\
  ![](img/6e45221a8147f2442c653a3d4a866570_268_0.png)\n\n```python\n@decorator\ndef\
  \ func(args):\n    statements\n```\n\n此语法被翻译为以下内容：\n\n```python\ndef func(args):\n\
  \    statements\n    func = decorator(func)\n```\n\n在任一情况下，都假设 _decorator_ 是一个已经定义的函数。这个装饰器必须将函数作为其参数，并返回函数的包装版本。假设所有这些都已正确完成，下面是一个使用\
  \ @ 符号的完整示例。\n\n```python\n@make_timer\ndef count_nums(n):\n    for i in range(n):\n\
  \        for j in range(1000):\n            pass\n```\n\n在 Python 执行此定义后，_count_num_\
  \ 可以被调用，它将按定义执行 _count_num_，但还会添加（作为包装的一部分）一个 **print** 语句，告诉经过的秒数。\n\n请记住，这个技巧的部分（实际上是最后的技巧）是让名称\
  \ _count_nums_ 指向 _count_nums_ 的 _新_ 版本，在通过装饰过程添加了新语句之后。\n\n# 4.10 生成器\n\n关于 Python\
  \ 的主题，没有哪个比生成器更容易引起困惑的了。\n\n\n\n\n\nabounds than generators. It’s not a difficult\
  \ feature once you understand it. Explaining it’s the hard part.\n\nBut first, what\
  \ does a generator do? The answer: It enables you to deal with a sequence one element\
  \ at a time.\n\nSuppose you need to deal with a sequence of elements that would\
  \ take a long time to produce if you had to store it all in memory at the same time.\
  \ For example, you want to examine all the Fibonacci numbers up to 10 to the 50th\
  \ power. It would take a lot of time and space to calculate the entire sequence.\
  \ Or you may want to deal with an infinite sequence, such as all even numbers.\n\
  \nThe advantage of a generator is that it enables you to deal with one member of\
  \ a sequence at a time. This creates a kind of “virtual sequence.”\n\n## 4.10.1\
  \ What’s an Iterator?\n\nOne of the central concepts in Python is that of _iterator_\
  \ (sometimes confused with _iterable_). An iterator is an object that produces a\
  \ stream of values, one at a time.\n\nAll lists can be iterated, but not all iterators\
  \ are lists. There are many functions, such as `reversed`, that produce iterators\
  \ that are not lists. These cannot be indexed or printed in a useful way, at least\
  \ not directly. Here’s an example:\n\nClick here to view code image\n\n```\n>>>\
  \ iter1 = reversed([1, 2, 3, 4])\n>>> print(iter1)\n<list_reverseiterator object\
  \ at 0x1111d7f28>\n```\n\nHowever, you can convert an iterator to a list and then\
  \ print it, index it, or slice it:\n\n```\n>>> print(list(iter1))\n[4, 3, 2, 1]\n\
  ```\n\nIterators in Python work with **for** statements. For example, because `iter1`\
  \ is an iterator, the following lines of code work perfectly well.\n\nClick here\
  \ to view code image\n\n```\n>>> iter1 = reversed([1, 2, 3, 4])\n>>> for i in iter1:\n\
  \    print(i, end=' ')\n4 3 2 1\n```\n\nIterators have _state information_; after\
  \ reaching the end of its series, an iterator is exhausted. If we used `iter1` again\
  \ without resetting it, it would produce no more values.\n\n## 4.10.2 Introducing\
  \ Generators\n\nA generator is one of the easiest ways to produce an iterator. But\
  \ the generator function is not itself an iterator. Here’s the basic procedure.\n\
  \n- Write a generator function. You do this by using a **yield** statement anywhere\
  \ in the definition.\n- Call the function you completed in step 1 to get an iterator\
  \ object.\n- The iterator created in step 2 is what yields values in response to\
  \ the **next** function. This object contains state information and can be reset\
  \ as needed.\n\nFigure 4.4 illustrates the process.\n\nA generator function is really\
  \ a generator factory!\n\n![](img/6e45221a8147f2442c653a3d4a866570_272_0.png)\n\n\
  Figure 4.4. Returning a generator from a function\n\nHere’s what almost everybody\
  \ gets wrong when trying to explain this process: It looks as if the **yield** statement,\
  \ placed in the generator function (the thing on the left in Figure 4.4), is doing\
  \ the yielding. That’s “sort of” true, but it’s not really what’s going on.\n\n\
  The generator function defines the behavior of the iterator. But the iterator object,\
  \ the thing to its right in Figure 4.4, is what actually executes this behavior.\n\
  \nWhen you include one or more **yield** statements in a function, the function\
  \ is no longer an ordinary Python function; **yield** describes a behavior in which\
  \ the function does not return a value but sends a value back to the caller of **next**.\
  \ State information is saved, so when **next** is called again, the iterator advances\
  \ to the next value in the series without starting over. This part, everyone seems\
  \ to understand.\n\nBut—and this is where people get confused—it isn’t the generator\
  \ function that performs these actions, even though that’s where the behavior is\
  \ _defined_. Fortunately, you don’t need to understand it; you just need to use\
  \ it. Let’s start with a function that prints even numbers from 2 to 10:\n\n```\n\
  def print_evens():\n    for n in range(2, 11, 2):\n        print(n)\n```\n\nNow\
  \ replace `print(n)` with the statement `yield n`. Doing so changes the nature of\
  \ what the function does. While we’re at it, let’s change the name to `make_evens_gen`\
  \ to have a more accurate description.\n\nClick here to view code image\n\n```\n\
  def make_evens_gen():\n    for n in range(2, 11, 2):\n        yield n\n```\n\nThe\
  \ first thing you might say is “This function no longer returns anything; instead,\
  \ it yields the value n, suspending its execution and saving its internal state.”\
  \ But this revised function, `make_evens_gen`, does indeed have a return value!\
  \ As shown in Figure 4.4, the value returned is not n; the return value is an iterator\
  \ object, also called a “generator object.” Look what happens if you call `make_evens_gen`\
  \ and examine the return value.\n\nClick here to view code image\n\n```\n>>> make_evens_gen()\n\
  <generator object make_evens_gen at 0x1068bd410>\n```\n\nWhat did the function do?\
  \ Yield a value for n? No! Instead, it returned an iterator object, and that’s the\
  \ object that yields a value. We can save the iterator object (or generator object)\
  \ and then pass it to next.\n\nClick here to view code image\n\n```\n>>> my_gen\
  \ = make_evens_gen()\n>>> next(my_gen)\n2\n>>> next(my_gen)\n4\n>>> next(my_gen)\n\
  6\n```\n\nEventually, calling next exhausts the series, and a StopIteration exception\
  \ is raised. But what if you want to reset the sequence of values to the beginning?\
  \ Easy. You can do that by calling `make_evens_gen` again, producing a new instance\
  \ of the iterator. This has the effect of starting over.\n\nClick here to view code\
  \ image\n\n```\n>>> my_gen = make_evens_gen()  # Start over\n>>> next(my_gen)\n\
  2\n>>> next(my_gen)\n4\n>>> next(my_gen)\n6\n>>> my_gen = make_evens_gen()  # Start\
  \ over\n>>> next(my_gen)\n2\n>>> next(my_gen)\n4\n>>> next(my_gen)\n6\n```\n\nWhat\
  \ happens if you call `make_evens_gen` every time? In that case, you keep starting\
  \ over, because each time you’re creating a new generator object. This is most certainly\
  \ not what you want.\n\n```\n>>> next(make_evens_gen())\n2\n>>> next(make_evens_gen())\n\
  2\n>>> next(make_evens_gen())\n2\n```\n\nGenerators can be used in `for` statements,\
  \ and that’s one of the most frequent uses. For example, we can call `make_evens_gen`\
  \ as follows:\n\n```\nfor i in make_evens_gen():\n    print(i, end=' ')\n```\n\n\
  This block of code produces the result you’d expect:\n\n```\n2 4 6 8 10\n```\n\n\
  But let’s take a look at what’s really happening. The **for** block calls `make_evens_gen`\
  \ one time. The result of the call is to get a generator object. That object then\
  \ provides the values in the **for** loop. The same effect is achieved by the following\
  \ code, which breaks the function call onto an earlier line.\n\n```\n>>> my_gen\
  \ = make_evens_gen()\n>>> for i in my_gen:\n    print(i, end=' ')\n```\n\nRemember\
  \ that `my_gen` is an iterator object. If you instead referred to `make_evens_gen`\
  \ directly, Python would raise an exception.\n\nClick here to view code image\n\n\
  ```\nfor i in make_evens_gen:     # ERROR! Not an iterable!\n    print(i, end='\
  \ ')\n```\n\nOnce you understand that the object returned by the generator function\
  \ is the generator object, also called the iterator, you can call it anywhere an\
  \ _iterable_ or _iterator_ is accepted in the syntax. For example, you can convert\
  \ a generator object to a list, as follows.\n\nClick here to view code image\n\n\
  ```\n>>> my_gen = make_evens_gen()\n>>> a_list = list(my_gen)\n>>> a_list\n[2, 4,\
  \ 6, 8, 10]\n>>> a_list = list(my_gen)  # Oops! No reset!\n>>> a_list\n[]\n```\n\
  \nThe problem with the last few statements in this example is that each time you\
  \ iterate through a sequence using a generator object, the iteration is exhausted\
  \ and needs to be reset.\n\nClick here to view code image\n\n```\n>>> my_gen = make_evens_gen()\
  \  # Reset!\n>>> a_list = list(my_gen)\n>>> a_list\n[2, 4, 6, 8, 10]\n```\n\nYou\
  \ can of course combine the function call and the **list** conversion. The list\
  \ itself is stable and (unlike a generator object) will retain its values.\n\nClick\
  \ here to view code image\n\n```\n>>> a_list = list(make_evens_gen())\n>>> a_list\n\
  [2, 4, 6, 8, 10]\n```\n\nOne of the most practical uses of an iterator is with the\
  \ **in** and **not in** keywords. We can, for example, generate an iterator that\
  \ produces Fibonacci numbers up to and including N, but not larger than N.\n\n\n\
  \n\n\n\n**yield** 语句将此函数从普通函数转换为生成器函数，因此它返回一个生成器对象（迭代器）。我们现在可以使用以下测试来确定一个数字是否为斐波那契数：\n\
  \n> Click here to view code image\n\n```\nn = int(input('Enter number: '))\nif n\
  \ in make_fibo_gen(n):\n    print('number is a Fibonacci. ')\nelse:\n    print('number\
  \ is not a Fibonacci. ')\n```\n\n此示例之所以有效，是因为生成的迭代器不会产生无限序列（否则会导致问题）。相反，如果在确认该数字为斐波那契数之前达到\
  \ n，则迭代器终止。\n\n请记住——我们最后再说一次——通过将 **yield** 放入函数 make_fibo_gen 中，它就变成了生成器函数，并返回我们需要的生成器对象。前面的示例可以写成如下形式，以便函数调用在单独的语句中进行。效果相同。\n\
  \n> Click here to view code image\n\n```\nn = int(input('Enter number: '))\nmy_fibo_gen\
  \ = make_fibo_gen(n)\nif n in my_fibo_gen:\n    print('number is a Fibonacci. ')\n\
  else:\n    print('number is not a Fibonacci. ')\n```\n\n与往常一样，请记住，生成器函数（包含 **yield**\
  \ 语句的函数）根本不是生成器对象，而是一个生成器工厂。这令人困惑，但你只需要习惯它。无论如何，图 4.4 显示了实际发生的情况，你应该经常参考它。\n\n##\
  \ 4.11 访问命令行参数\n\n从命令行运行程序可以让你为程序提供额外的灵活性。你可以让用户指定 _命令行参数_；这些是可选参数，在程序启动时直接向程序提供信息。或者，你可以让程序提示用户输入所需的信息。但使用命令行参数通常更高效。\n\
  \n命令行参数始终以字符串形式存储。因此——就像 input 函数返回的数据一样——你可能需要将这些字符串数据转换为数字格式。要在 Python 程序中访问命令行参数，首先需要导入\
  \ **sys** 包。\n\n```\nimport sys\n```\n\n然后，你可以通过引用名为 **argv** 的列表来引用完整的命令行参数集，包括函数名称本身。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_280_0.png)\n\n```\nargv   # If 'import\
  \ sys.argv' used\nsys.argv   # If sys imported as 'import sys'\n```\n\n无论哪种情况，**argv**\
  \ 都引用一个命令行参数列表，所有参数均存储为字符串。列表中的第一个元素始终是程序本身的名称。该元素的索引为 **argv[0]**，因为 Python 使用基于零的索引。例如，假设你正在运行\
  \ `quad`（一个二次方程求值器）并输入以下命令行：\n\n```\npython quad.py -1 -1 1\n```\n\n在这种情况下，**argv**\
  \ 将被实现为一个包含四个字符串的列表。图 4.5 说明了这些字符串的存储方式，强调第一个元素 **argv[0]** 引用包含程序名称的字符串。\n\n![](img/6e45221a8147f2442c653a3d4a866570_281_0.png)\n\
  \n在大多数情况下，你可能会忽略程序名称，专注于其他参数。例如，这里有一个名为 `silly.py` 的程序，它只打印传递给它的所有参数，包括程序名称。\n\n\
  ```\nimport sys\nfor thing in sys.argv:\n    print(thing, end=' ')\n```\n\n现在假设我们输入以下命令行：\n\
  \n```\npython silly.py arg1 arg2 arg3\n```\n\n终端程序（在 Mac 上）或 DOS 窗口将打印以下内容：\n\n\
  ```\nsilly.py arg1 arg2 arg3\n```\n\n下面的示例提供了一种更复杂的使用这些字符串的方法，即将它们转换为浮点格式并将数字传递给\
  \ `quad` 函数。\n\n> Click here to view code image\n\n```\nimport sys\n\ndef quad(a,\
  \ b, c):\n    '''Quadratic Formula function.'''\n    determin = (b * b - 4 * a *\
  \ c) ** .5\n    x1 = (-b + determin) / (2 * a)\n    x2 = (-b - determin) / (2 *\
  \ a)\n    return x1, x2\n\ndef main():\n    '''Get argument values, convert, call\
  \ quad.'''\n    s1, s2, s3 = sys.argv[1], sys.argv[2],\n    sys.argv[3]\n    a,\
  \ b, c = float(s1), float(s2), float(s3)\n    x1, x2 = quad(a, b, c)\n    print('x\
  \ values: {}, {}'.format(x1, x2))\n\nmain()\n```\n\n这里有趣的一行是：\n\n> Click here to\
  \ view code image\n\n```\ns1, s2, s3 = sys.argv[1], sys.argv[2],\nsys.argv[3]\n\
  ```\n\n同样，`sys.argv` 列表与任何其他 Python 列表一样是基于零的，但程序名称（称为 `sys.argv[0]`）通常不会在程序代码中使用。\
  \ presumably 你已经知道你的程序名称是什么，所以不需要去查找。\n\n当然，从程序内部，你不能总是确定命令行上是否指定了参数值。如果未指定，你可能希望提供替代方案，例如提示用户输入这些相同的值。\n\
  \n请记住，参数列表的长度始终是 N+1，其中 N 是命令行参数的数量——当然，不包括程序名称。\n\n因此，我们可以按以下方式修改前面的示例：\n\n> Click\
  \ here to view code image\n\n```\nimport sys\n\ndef quad(a, b, c):\n    '''Quadratic\
  \ Formula function.'''\n    determin = (b * b - 4 * a * c) ** .5\n    x1 = (-b +\
  \ determin) / (2 * a)\n    x2 = (-b - determin) / (2 * a)\n    return x1, x2\n\n\
  def main():\n    '''Get argument values, convert, call quad.'''\n    if len(sys.argv)\
  \ > 3:\n        s1, s2, s3 = sys.argv[1], sys.argv[2],\n        sys.argv[3]\n  \
  \  else:\n        s1 = input('Enter a: ')\n        s2 = input('Enter b: ')\n   \
  \     s3 = input('Enter c: ')\n    a, b, c = float(s1), float(s2), float(s3)\n \
  \   x1, x2 = quad(a, b, c)\n    print('x values: {}, {}'.format(x1, x2))\n\nmain()\n\
  ```\n\n此版本中的关键行位于以下 **if** 语句中：\n\n> Click here to view code image\n\n```\nif len(sys.argv)\
  \ > 3:\n    s1, s2, s3 = sys.argv[1], sys.argv[2],\n        sys.argv[3]\nelse:\n\
  \    s1 = input('Enter a: ')\n    s2 = input('Enter b: ')\n    s3 = input('Enter\
  \ c: ')\na, b, c = float(s1), float(s2), float(s3)\n```\n\n如果 **sys.argv** 中至少有四个元素（因此除了程序名称本身之外还有三个命令行参数），程序将使用这些字符串。否则，程序将提示输入这些值。\n\
  \n因此，从命令行，你可以运行以下内容：\n\n```\npython quad.py 1 -9 20\n```\n\n程序将打印以下结果：\n\n```\n\
  x values: 4.0 5.0\n```\n\n# 第 4 章 总结\n\n本章的大部分内容介绍了通过编写更好、更高效的 Python 代码来提高效率的方法。除此之外，如果你尽可能少地在\
  \ IDLE 中调用 `print` 函数——或者仅从命令行运行程序——可以让你的 Python 程序运行得更快。\n\n一种有助于提高代码效率的技术是使用 `time`\
  \ 和 `datetime` 包对其进行性能分析，以计算给定不同算法时代码的相对速度。编写装饰器在这方面很有帮助，因为你可以使用它们来分析函数性能。\n\n在许多情况下，超级充电应用程序的最佳方法之一是使用许多可用于\
  \ Python 的免费包之一。其中一些是内置的；而其他包，例如 `numpy` 包，则需要下载。\n\n# 第 4 章 复习问题\n\n- 1. 赋值运算符（如\
  \ `+=`）仅仅是一种便利吗？它实际上能在运行时带来更快的性能吗？\n\n- 2. 在大多数计算机语言中，你需要编写多少条语句才能替代 Python 语句 `a,\
  \ b = a + b, a`？\n\n- 3. 在 Python 中，将 100 个整数初始化为 0 的最有效方法是什么？\n\n- 4. 将 99 个整数初始化为\

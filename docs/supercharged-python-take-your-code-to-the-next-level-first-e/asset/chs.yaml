  \        mod_b.funcB(n - 1)\n```\n\n## RPN 计算器实现\n\n### 文件 rpn.py\n\n```python\n\
  #File rpn.py ----------------------------------------\nimport re\nimport operator\n\
  from rpn_io import *\n# Provide a symbol table; values of variables will be\n# \
  \ stored here.\nsym_tab = {}\nstack = []   # Stack to hold the values.\n# Scanner:\
  \ Add items to recognize variable names, which\n#  are stored in the symbol table,\
  \ and to perform\n#  assignments, which enter values into the sym. table.\nscanner\
  \ = re.Scanner([\n    (r\"[ \\t\\n]\", lambda s, t: None),\n    (r\"-?(\\d*)?\\\
  .\\d+\", lambda s, t:\n        stack.append(float(t))),\n    (r\"-?\\d+\", lambda\
  \ s, t: stack.append(int(t))),\n    (r\"[a-zA-Z_][a-zA-Z_0-9]*\", lambda s, t:\n\
  \        stack.append(t)),\n    (r\"[+]\", lambda s, t: bin_op(operator.add)),\n\
  \    (r\"[-]\", lambda s, t: bin_op(operator.sub)),\n    (r\"[*]\", lambda s, t:\
  \ bin_op(operator.mul)),\n    (r\"[/]\", lambda s, t: bin_op(operator.truediv)),\n\
  \    (r\"[\\^]\", lambda s, t: bin_op(operator.pow)),\n    (r\"[=]\", lambda s,\
  \ t: assign_op()),\n])\n\ndef assign_op():\n    ''''Assignment Operator function:\
  \ Pop off a name\n    and a value, and make a symbol-table entry.\n    ...\n   \
  \ op2, op1 = stack.pop(), stack.pop()\n    if type(op2) == str:  # Source may be\
  \ another var!\n        op2 = sym_tab[op2]\n    sym_tab[op1] = op2\n\ndef bin_op(action):\n\
  \    ''''Binary Operation evaluator: If an operand is\n    a variable name, look\
  \ it up in the symbol table\n    and replace with the corresponding value, before\n\
  \    being evaluated.\n    ...\n    op2, op1 = stack.pop(), stack.pop()\n    if\
  \ type(op1) == str:\n        op1 = sym_tab[op1]\n    if type(op2) == str:\n    \
  \    op2 = sym_tab[op2]\n    stack.append(action(op1, op2))\n\ndef main():\n   \
  \ a_list = open_rpn_file()\n    if not a_list:\n        print('Bye!')\n        return\n\
  \n    for a_line in a_list:\n        a_line = a_line.strip()\n\nif a_line:\n   \
  \ tokens, unknown = scanner.scan(a_line)\n    if unknown:\n        print('Unrecognized\
  \ input:', unknown)\nprint(str(stack[-1]))\n\nmain()\n```\n\n### 文件 rpn_io.py\n\n\
  ```python\n#File rpn_io.py\n#-----------------------------------------------\n\n\
  def open_rpn_file():\n    ''\"Open-source-file function. Open a named\n    file\
  \ and read lines into a list, which is\n    returned.\n    ...\n    while True:\n\
  \        try:\n            fname = input('Enter RPN source: ')\n            if not\
  \ fname:\n                return None\n            f = open(fname, 'r')\n      \
  \      break\n        except:\n            print('File not found. Re-enter.')\n\
  \    a_list = f.readlines()\n    return a_list\n```\n\n### 主程序逻辑\n\n```python\n\
  from rpn_io import open_rpn_file\ndef main():\n    a_list = open_rpn_file()\n  \
  \  if not a_list:\n        print('Bye!')\n        return\n\nfor a_line in a_list:\n\
  \    a_line = a_line.strip()\n    if a_line.startswith('PRINTS'):\n        do_prints(a_line[7:])\n\
  \    elif a_line.startswith('PRINTLN'):\n        do_println(a_line[8:])\n    elif\
  \ a_line.startswith('PRINTVAR'):\n        do_printvar(a_line[9:], sym_tab)\n   \
  \ elif a_line.startswith('INPUT'):\n        do_input(a_line[6:], sym_tab)\n    elif\
  \ a_line:\n        tokens, unknown = scanner.scan(a_line)\n        if unknown:\n\
  \            print('Unrecognized input:', unknown)\n```\n\n### 指令处理函数\n\n```python\n\
  def do_prints(s):\n    \"\"\" Carry out PRINTS directive by printing a\n    string.\n\
  \    \"\"\"\n    a_str = get_str(s)\n    print(a_str, end='')\n\ndef do_println(s):\n\
  \    \"\"\" Carry out PRINTLN directive: print the\n    optional string argument,\
  \ if specified, and then\n    print a newline, unconditionally.\n    \"\"\"\n  \
  \  if s:\n        do_prints(s)\n    print()\n\ndef get_str(s):\n    \"\"\" Helper\
  \ function for do_prints.\n    \"\"\"\n    a = s.find('\"')\n    b = s.rfind('\"\
  ')\n    if a == -1 or b == -1:\n        return ''\n    return s[a+1:b]\n\ndef do_printvar(s,\
  \ sym_tab):\n    \"\"\" Carry out PRINTVAR directive; look up the\n    variable\
  \ name contained in the string s, and\n    then look this name up in the symbol\

- "# 2. 高级字符串功能\n\n计算机如何向人类传递消息？通过手势、烟雾信号，还是（如 1950 年代的科幻电影中那样）一个闪烁的红灯？\n\n不。即使是使用语音或语音识别（有些超出本书范围）的程序，也依赖于称为文本字符串或简称字符串的可打印字符组。每个程序员都需要掌握提示、搜索和打印这些字符串的艺术。幸运的是，Python\
  \ 擅长这项任务。\n\n即使你以前使用过 Python 文本字符串，你可能也希望浏览本章，以确保你使用了 Python 字符串的所有内置功能。\n\n## 2.1\
  \ 字符串是不可变的\n\nPython 中的数据类型要么是可变的（可更改），要么是不可变的。\n\n可变类型的优点很明显。数据可以“原地”更改，这意味着你不必在每次更改时都从头重建对象。可变类型包括列表、字典和集合。\n\
  \n不可变类型的优点不那么明显，但很重要。不可变类型可以用作字典的键；这样的键通常是字符串。例如，你可能有一个评分字典，用于列出一组评论家的平均评分。\n\n\
  ```python\nmovie_dict = { 'Star Bores': 5.0,\n\t'The Oddfather': 4.5,\n\t'Piranha:\
  \ The Revenge': 2.0 }\n```\n\n不可变类型的另一个优点是，由于它们不能更改，因此其使用在内部经过优化。例如，使用元组比使用列表效率稍高。不可变类型的局限性是，此类数据不能原地更改。例如，以下语句无效。\n\
  \n```python\nmy_str = 'hello, Dave, this is Hal.'\nmy_str[0] = 'H' # ERROR!\n```\n\
  \n本示例中的第二条语句无效，因为它试图获取第一条语句中创建的字符串并修改数据本身。结果，Python 引发 **TypeError** 异常。但以下语句是有效的。\n\
  \n```python\nmy_str = 'hello'\nmy_str = 'Hello'\n```\n\n这些语句有效，因为每次都会创建一个全新的字符串，并重新分配名称\
  \ `my_str`。\n\n在 Python 中，变量只不过是一个名称，可以反复重复使用。这就是为什么这些最后的语句可能看起来违反了字符串的不可变性，但实际上并没有。在最后一个示例中，没有现有字符串被更改；相反，创建了两个不同的字符串，并重复使用了名称\
  \ `my_str`。\n\n这种行为源于 Python 中赋值的性质及其缺乏数据声明。你可以随意重复使用名称。\n\n## 2.2 数值转换，包括二进制\n\n\
  Python 中的类型名称在支持此类转换的地方会隐式调用类型转换。\n\n![](img/6e45221a8147f2442c653a3d4a866570_96_0.png)\n\
  \n```python\ntype(data_object)\n```\n\n该操作是获取指定的 `data_object`，并在转换为指定的 `type` 后生成结果——如果存在适当的转换。如果不存在，Python\
  \ 会引发 **ValueError** 异常。\n\n以下是一些示例：\n\n```python\ns = '45'\nn = int(s)\nx = float(s)\n\
  ```\n\n如果你随后打印 `n` 和 `x`，你会得到以下结果：\n\n```\n45\n45.0\n```\n\n`int` 转换与大多数转换不同，它接受一个可选的第二个参数。此参数使你能够将字符串转换为数字，同时以不同的基数（例如二进制）进行解释。以下是一个示例：\n\
  \n单击此处查看代码图片\n\n```python\nn = int('10001', 2)  # Interpret in binary radix.\n```\n\
  \n打印 `n` 显示它被赋予了十进制值 17。同样，你可以将其他基数与 `int` 转换一起使用。以下代码使用八进制（8）和十六进制（16）基数。\n\n单击此处查看代码图片\n\
  \n```python\nn1 = int('775', 8)\nn2 = int('1E', 16)\nprint('775 octal and 1E hex:',\
  \ n1, n2)\n```\n\n这些语句打印以下结果：\n\n```\n775 octal and 1E hex: 509 30\n```\n\n因此，我们可以将\
  \ **int** 转换总结为接受一个可选的第二个参数，其默认值为 10，表示十进制基数。\n\n![](img/6e45221a8147f2442c653a3d4a866570_98_0.png)\n\
  \n```python\nint(data_object, radix=10)\n```\n\n当你从键盘获取输入（通常通过使用 **input** 语句）或从文本文件获取输入，并需要将数字字符转换为实际数值时，**int**\
  \ 和 **float** 转换是必需的。\n\n**str** 转换的作用方向相反。它将数字转换为其字符串表示形式。实际上，它适用于任何类型的数据，只要该类型定义了字符串表示形式。\n\
  \n将数字转换为字符串使你能够执行诸如计算可打印数字的数量或计算特定数字出现次数等操作。例如，以下语句打印数字 1007 的长度。\n\n单击此处查看代码图片\n\
  \n```python\nn = 1007\ns = str(n)    # Convert to '1007'\nprint('The length of',\
  \ n, 'is', len(s), 'digits.')\n```\n\n此示例打印以下输出：\n\n单击此处查看代码图片\n\n\n\n\nThe length\
  \ of 1007 is 4 digits.\n\nThere are other ways to get this same information. You\
  \ could, for example, use the mathematical operation that takes the base-10 logarithm.\
  \ But this example suggests what you can do by converting a number to its string\
  \ representation.\n\n> **注意**\n>\n> Converting a number to its string representation\
  \ is not the same as converting a number to its ASCII or Unicode number. That's\
  \ a different operation, and it must be done one character at a time by using the\
  \ `ord` function.\n\n## 2.3 字符串运算符（+、=、*、> 等）\n\n字符串类型 `str` 支持数值类型支持的一些相同运算符，但对其解释方式不同。例如，当应用于字符串而不是数字时，加法（+）变为字符串连接。\n\
  \n以下是一些有效字符串运算符的示例：赋值和相等性测试。\n\nClick here to view code image\n\n```\ndog1_str =\
  \ 'Rover'          # Assignment\ndog2_str = dog1_str       # Create alias for.\n\
  \ndog1_str == dog2_str      # True!\ndog1_str == 'Rover'       # True!\n```\n\n\
  在此示例中，第二条语句为 `dog1_str` 引用的相同数据创建了一个引用或别名。（但是，如果 `dog1_str` 后来被赋予新数据，`dog2_str`\
  \ 仍然引用 'Rover'。）由于 `dog1_str` 和 `dog2_str` 引用相同的数据，第一个相等性测试必须产生值 **True**。\n\n但是第二个相等性测试也返回\
  \ **True**。只要两个字符串具有相同的内容，它们就被视为相等。它们不一定必须是内存中相同数据的别名。\n\n所有基于运算符的 Python 字符串比较都区分大小写。有几种方法可以忽略大小写。你可以将两个操作数都转换为大写或都转换为小写（通过使用\
  \ **upper** 或 **lower** 字符串方法），这对于仅包含 ASCII 字符的字符串效果良好。\n\n但是，如果你正在处理使用更广泛 Unicode\
  \ 字符集的字符串，执行不区分大小写比较的最安全方法是使用专门为此目的提供的 **casefold** 方法。\n\nClick here to view code\
  \ image\n\n```\ndef compare_no_case(str1, str2):\n    return str1.casefold() ==\
  \ str2.casefold()\n\nprint(compare_no_case('cat', 'CAT'))  # Return True.\n```\n\
  \n表 2.1 列出了 **str** 类型可用的运算符。\n\n# 表 2.1. 字符串运算符\n\n| 运算符 | 描述 |\n|---|---|\n| `+`\
  \ | 连接 |\n| `*` | 重复 |\n| `[]` | 切片 |\n| `in` | 成员 |\n| `not in` | 非成员 |\n| `%`\

  \n**Figure 13.6.** 绘制多项式\n\n## 13.4 绘制多条线\n\n如果你想显示更复杂的图表，例如同时包含正弦函数和余弦函数的图表以便比较，该怎么办？这很简单。例如，你可以在显示结果前对\

  9♥ 9♥ T♠ 4♦ T♣\n\n## 11.7 绘制正态分布\n\n在数学和统计学中，正态分布是经典的钟形曲线。它在自然界中如此频繁地出现并非偶然。它是帕斯卡三角形在深入更深层次时趋同的形状。它是二项式定理在生成这些数字时预测的形状。\n\
  \n例如，平均美国男性的身高大约是五英尺十英寸。如果你对这个人群进行随机抽样，平均而言，你会发现绝大多数男性的身高都在这个身高几英寸以内。当然，会有一些特别矮或特别高的异常值。但是，随着你远离平均值，这些异常值会变得越来越少。\n\
  \n结果就是一条钟形曲线。大部分人口应该围绕平均值（或均值）分布，在该均值周围形成一个凸起。正态分布由两个主要因素控制：均值和标准差。\n\n均值是平均值，即曲线的中间。标准差，也称为西格玛，决定曲线是窄还是宽。经过足够长的时间，数值的产生应符合表\
  \ 11.2 中的规则。\n\n### 表 11.2. 标准差的影响\n\n| 标准差的数量 | 人口百分比（按预测） |\n|---|---|\n| 一 |\
  \ 平均而言，约 68% 应落在均值的一个标准差以内。 |\n| 二 | 平均而言，约 95% 应落在均值的两个标准差以内。 |\n| 三 | 平均而言，约 99.7%\
  \ 应落在均值的三个标准差以内。 |\n\n以下是如何阅读表 11.2。例如，假设你有一个均值为 100、标准差为 20 的正态分布。从长远来看，你应该期望由\
  \ `normalvariate` 函数产生的约 68% 的数字落在 80 到 120 之间。你应该期望产生的 95% 的数字落在 40 到 160 之间。\n\
  \n然而，尽管 `random` 包中有所有概率分布，它们只是概率分布。尤其是在短期内，没有什么是确定的。对于给定的试验，在给出的条件下，数字落在 40 到 160\
  \ 范围内的概率是 95%；有 5% 的概率落在范围之外。\n\n但这并不意味着这种情况 _不可能发生_。概率仅为 5% 的事件确实会发生，而且经常发生。概率为百万分之一或更低的事件每天都会发生——每次有人中彩票时都会发生！\n\
  \n因此，如果你只取少量样本结果，可能看不到任何类似钟形曲线的东西。幸运的是，由于大数定律（在第 11.3 节“测试随机行为”中演示），如果你取许多样本值，你应该会看到相当可预测的行为。\n\
  \n以下程序旨在利用大数定律，允许任意数量的样本结果，缩小数字以便于绘图，然后打印结果图表。\n\n```python\nimport random\n\ndef\
  \ pr_normal_chart(n):\n    hits = [0] * 20\n    for i in range(n):\n        x =\
  \ random.normalvariate(100, 30)\n        j = int(x/10)\n        if 0 <= j < 20:\n\
  \            hits[j] += 1\n    for i in hits:\n        print('*' * int(i * 320 /\
  \ n))\n```\n\n此函数调用 **normalvariate** 函数任意次数；然后使用结果制作一个简单的基于字符的图表。关键行调用 **random.normalvariate**，均值为\
  \ 100，标准差为 30：\n\n```python\nx = random.normalvariate(100, 30)\n```\n\n当然，标准差不必是\
  \ 30。你可以通过修改这个数字进行实验。较小的偏差会产生更细、更明显的图表；较大的偏差会使曲线看起来更平坦。\n\n代码然后通过除法和 int 转换将数字 x\
  \ 转换为 0 到 20 之间的整数，将结果收集到二十个“桶”中。除非你增加标准差，否则随机数落在这个范围之外的情况很少见。\n\n结果 x 被除，以便可以索引\
  \ hits 数组。在每个桶中，我们累积相应范围中的命中次数。\n\n```python\nj = int(x/10)\nif 0 <= j < 20:\n \
  \   hits[j] += 1\n```\n\n然后将每个命中次数乘以 320 并除以 n 进行缩小。这使得参数 n 可以设置为你选择的任意大值，而不会增加要打印的星号（*）的总数。如果不进行缩放，你就无法输入较大的\
  \ n 值，否则屏幕会被星号淹没。\n\n```python\nfor i in hits:\n    print('*' * int(i * 320 / n))\n\
  ```\n\n为什么使用这些特定的数字——100、30 和 320？\n\n我们通过反复试验确定了这些数字，以达到美观的效果。你可以尝试使用不同的数字。\n\n\
  你可以输入相对较少的试验次数——比如 500 次。图 11.2 显示了典型结果。生成的图表显示的图形大致像钟形曲线，但明显有偏差；远不是大 n 时数学所预测的结果。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_680_0.png)\n\n**图 11.2.** 500 次试验后的正态分布\n\
  \n但此图仅使用了 500 次试验，对于统计学来说，这并不是一个很大的样本；它应该揭示一般模式，但在某些地方会有显著偏差，确实如此。\n\n在图 11.3 中，试验次数从\
  \ 500 增加到 199,000 次。由于函数中编写的缩放，要打印的星号总数不会显著变化。但现在，形状与数学上完美的钟形曲线吻合得更加紧密。\n\n![](img/6e45221a8147f2442c653a3d4a866570_681_0.png)\n\
  \n**图 11.3.** 199,000 次试验后的正态分布\n\n在样本大于 199,000（约 200,000）的情况下，你应该继续得到结果——在这个粗糙的粒度级别上——看起来像数学上完美的钟形曲线。\n\
  \n\n\n\n\n\n## 11.8 编写你自己的随机数生成器\n\n本节介绍如何编写你自己的随机数生成器（如果你选择这样做）。其中包含一些最初在 _Python\
  \ Without Fear_ 中讨论过的生成器相关内容。\n\n大多数时候你不需要编写自己的随机数生成器，但在某些情况下它很有用。也许你正在为赌博设备编写代码，例如电子老虎机或在线扑克游戏。你的主要关注点之一是，不允许任何用户破解代码并预测接下来会发生什么。\n\
  \n`random` 包支持相当高质量的随机数分布。但是，如果没有外部随机化设备的访问权限——例如测量放射性衰变的设备——就必须使用伪随机数，这些数字虽然有用，但并非万无一失。理论上，任何序列都可以被破解。\n\
  \n编写你自己的伪随机生成器，使你能够生成一个尚未被任何人破解的序列。\n\n### 11.8.1 生成随机数的原理\n\n一般来说，伪随机序列可以通过做两件事来实现足够随机的行为：\n\
  \n- 选择一个 _种子_（起始值），人类难以或不可能猜测。系统时间对此目的来说是可以的。虽然时间不是随机的——它的值总是在增加——但它精确到微秒，且最低有效位对人类来说非常难以预测。\n\
  - 使用伪随机序列，它通过对前一个数应用数学运算来生成每个数字。这涉及复杂的变换。这些是混沌变换，因为初始值的微小差异会导致结果的巨大差异。\n\n### 11.8.2\
  \ 示例生成器\n\n第 4 章介绍了在 Python 中编写生成器的原理。最重要的规则是，不使用 return 语句，而是使用 yield 语句。yield\
  \ 在响应下一个函数调用（可能是直接调用，也可能是在 for 循环中调用）时给出一个值，并在再次调用之前保留内部状态。\n\n这都是第 4.10 节“生成器”中描述的更大过程的一部分。虽然包含\
  \ yield 的函数似乎不返回对象，但实际上它返回了：它返回一个生成器对象，也称为迭代器。生成器对象才是在运行时实际产生值的东西。\n\n所以——这是奇怪的部分——函数描述了生成器做什么，但生成器本身实际上是由函数返回的对象！诚然，这有点反直觉。\n\
  \n下面是一个简单的随机数生成器，它生成 0 到大约 42 亿（四字节整数的大小）范围内的浮点值。\n\nClick here to view code image\n\
  \n```python\nimport time\n\ndef gen_rand():\n    p1 = 1200556037\n    p2 = 2444555677\n\
  \    max_rand = 2 ** 32\n    r = int(time.time() * 1000)\n    while True:\n    \
  \    n = r\n        n *= p2\n        n %= p1\n        n += r\n        n *= p1\n\
  \        n %= p2\n        n %= max_rand\n        r = n\n        yield n\n```\n\n\
  结果是一个随机数生成器（你可以自己验证），它似乎相当不错地满足了随机性的明显统计测试。然而，它仍然是一个相对简单的生成器，绝无意提供最佳性能。它确实遵循了一些随机性的基本原则。\n\
  \n定义此生成器函数后，你可以使用以下代码对其进行测试：\n\nClick here to view code image\n\n```python\n>>>\
  \ gen_obj = gen_rand()\n>>> for i in range(10): print(next(gen_obj))\n1351029180\n\
  ```\n\n## 11.9 math 包概述\n\n`math` 包提供了一系列在许多科学和数学应用中有用的函数。\n\n虽然 `math` 包的大部分服务以函数形式提供，但该包还包括两个有用的常量：`pi`\

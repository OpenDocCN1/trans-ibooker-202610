  \ 20 字符的姓名字段，一个 30 字符的地址字段，以及针对以下每一项的 16 位整数字段：年龄、薪水和绩效评分（1 到 10 分）。“写入”程序应提示用户输入任意数量的此类记录，直到用户表示要退出。“读取”程序应将所有记录读入列表中。\n\

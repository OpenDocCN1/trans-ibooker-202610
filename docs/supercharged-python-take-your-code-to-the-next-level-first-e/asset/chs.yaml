  \nIf it helps you in the beginning, you can think of variables as storage locations\
  \ into which to place values, even though that’s not precisely what Python does.\n\
  \nWhat Python really does is make `a`, `b`, and `c` into names for the values 10,\
  \ 20, and 30. By this we mean “names” in the ordinary sense of the word. These names\

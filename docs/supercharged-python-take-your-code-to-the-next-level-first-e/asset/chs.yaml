  \nBefore leaving the subject, let’s review the structure of the program. The main\
  \ module, `rpn.py`, imports several packages and one module, `rpn_io.py`.\n\nThere’s\
  \ a circular relationship here, in that the main module creates a symbol table that\
  \ the other module needs access to. But this is easily facilitated by having some\
  \ of the function calls pass `sym_tab`. The functions thereby get a reference to\
  \ `sym_tab`, which they can then use to manipulate the table (see Figure 14.3).\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_918_0.png)\n\n**Figure 14.3.** Final\
  \ structure of the PRN project\n\nHere’s the final listing of the main module, `rpn.py`.\
  \ Most of\nthe work of the module is done by the scanner object. The use of the\

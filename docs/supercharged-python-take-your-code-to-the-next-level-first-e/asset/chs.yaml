- "# # 12. The \"numpy\" (Numeric Python) Package\n\nWe now come to one of the best\
  \ parts of Python: packages that perform sophisticated math operations on large\
  \ amounts of data. The key package that enables many of these abilities is called\
  \ **numpy**.\n\nSome of these operations can be written with the core Python language,\
  \ but many applications run much faster and compactly with help from the **numpy**\
  \ package. Statistical analysis can be done with a simple, high-level commands in\
  \ **numpy** rather than by writing complex functions, running as much as _a hundred\
  \ times as fast_.\n\nWhether you pronounce it “NUM-pee” or “num-PIE,” the **numpy**\
  \ package may well become your favorite.\n\n# ## 12.1 OVERVIEW OF THE “ARRAY,” “NUMPY,”\
  \ AND “MATPLOTLIB” PACKAGES\n\nThe next two chapters cover the usage of several\

  \ 3。\n\n## 1.6 基本输入和输出\n\n在前面的 1.1 节中，我们承诺过会展示如何提示用户输入公式所需的值。现在我们要兑现这个承诺。（你不会以为我们在撒谎吧？）\n\
  \nPython 的 `input` 函数是一种易于使用的输入机制，包含一个可选的提示文本。用户输入的文本将作为字符串返回。\n\n![](img/6e45221a8147f2442c653a3d4a866570_50_0.png)\n\

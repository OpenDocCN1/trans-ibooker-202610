  \n**图 15.6.** 股票每日成交量图表\n\n左侧的数字代表的不是百万股，而是数千万股。由于这些数字太大，如果不占用大量屏幕空间就无法打印，因此图表顶部会打印数字\
  \ 1e8。因此，左侧的数字应解释为 1000 万的倍数，即等于 1e8（10 的 8 次方）。\n\n## 15.9 限制时间段\n\n到目前为止，我们尚未控制图表所覆盖的时间段。如果你想查看股票过去三个月的数据，而不是\
  \ 10 年的数据，该怎么办？\n\n每一天都标记一个活跃交易日：这包括周一至周五，但不包括节假日。这就是为什么一年大约有 240 个“交易日”，而不是 365\
  \ 天。按照同样的逻辑，一个月大约是 20 天，三个月大约是 60 天。\n\n需要注意的是，限制数据帧持续时间的技术是使用我们的老朋友——切片。如你在第 3\
  \ 章中可能记得的，获取字符串、列表或数组最后 N 个元素的表达式是\n\n```\n[-N:]\n```\n\n我们可以将此操作应用于 pandas 数据帧。其效果是获取最新的\
  \ N 行数据，忽略其他所有内容。因此，要将数据帧限制为过去三个月（60 天），你可以使用以下语句：\n\n单击此处查看代码图像\n\n```python\n\
  stock_df = stock_df[-60:].reset_index()\n```\n\n还会调用 reset_index 方法，因为在这种情况下，保持数据准确是必要的。\n\
  \n当将此语句插入到之前的示例中时，我们将获得给定股票过去三个日历月（60 天）的成交量数据，而不是整年的数据。\n\n单击此处查看代码图像\n\n```python\n\
  def do_volume_plot(stock_df, name_str):\n    \"\"\" Plot the daily volume of a stock\
  \ passed in\n```\n\n\n\n\n\n\n作为\n数据框(stock_df)。仅绘制最近 60 天的数据。\n'''\nstock_df =\
  \ stock_df[-60:].reset_index()\nmakeplot(stock_df, 'Volume', 'volume')\nplt.title('Volume\
  \ for ' + name_str)\nplt.show()\n\n现在，当应用程序运行时，你将只能看到三个月的数据（图 15.7）。\n\n![](img/6e45221a8147f2442c653a3d4a866570_955_0.png)\n\
  \n**图 15.7.** 绘制三个月的成交量数据\n\n如你所见，这个图表的问题是，它在 X 轴上给出的是月/年/日期标签，而不是仅月/年，导致日期和时间信息拥挤在一起。\n\
  \n但有一个简单的解决方案。使用鼠标抓取图表框架的侧边，然后将其拉宽。这样做时，X 轴上会腾出空间，使你能够清晰地看到日期和时间数字，如图 15.8 所示。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_956_0.png)\n\n# 图 15.8. 拉宽图表\n\n使用这个图表，你还可以做更多事情。在这个时间段内，微软股票曾出现过成交量最高的一天。将鼠标指针移动到折线的顶点，你可以看到，这种高成交量发生在\
  \ 12 月底，当天交易的股票数量超过 110,000,000 股，即一亿一千万股，价值超过 110 亿美元。正如比尔所说，这足以买很多奶酪汉堡。\n\n##\
  \ 15.10 分割图表：子图绘制成交量\n\n当你能将股票成交量与价格结合起来查看时，成交量会更有趣。如果价格大幅上涨或下跌伴随着小成交量，那么价格变化很可能只是偶然：可能只是当天参与交易的交易者太少。\n\
  \n但价格大幅变化伴随着高成交量则更具实质意义。这意味着价格变化是由许多卖家或买家的行为引起的，他们决心追逐该股票。\n\n因此，我们真正想看到的是一个*分割图表*，一个让我们并排查看价格和成交量的图表。事实证明，绘图包提供了一种简单的方法来实现这一点。你主要需要学习一个新的方法调用。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_957_0.png)\n\n单击此处查看代码图像\n\n```\nplt.subplot(nrows,\
  \ ncols, cur_row)\n```\n\n这个方法调用表示，绘图命令，直到下一次调用`plt.subplot`，仅适用于指定的子图。`nrows`和`ncols`参数指定单独图表的虚拟“行”和“列”的数量；`cur_row`参数指定要处理的网格中的哪一“行”。在这种情况下，我们只有两个网格成员和只有一个虚拟\n\
  \n列。\n以下是用于此双图的 Python 代码的一般计划：\n\n单击此处查看代码图像\n\n```\nplt.subplot(2, 1, 1) # Do\
  \ first \"row.\"\n\n# Plot the top half of the graph here.\n\nplt.subplot(2, 1,\
  \ 2) # Do second \"row.\"\n\n# Plot the bottom half of the graph here.\n\nplt.show()\n\
  ```\n\n所以子图绘制并不难。我们只需将已知内容插入这个通用方案即可。以下是实现此功能的代码。\n\n单击此处查看代码图像\n\n```\ndef do_split_plot(stock_df,\
  \ name_str):\n    \"\"\" Do Plot function, with subplotting.\n    Use stock_df,\
  \ a stock data frame read from web.\n    \"\"\"\n\n    plt.subplot(2, 1, 1) # Plot\
  \ top half.\n    makeplot(stock_df, 'Close', 'price')\n    plt.title(name_str +\
  \ ' Price/Volume')\n\n    plt.subplot(2, 1, 2) # Plot bottom\n    half.\n    makeplot(stock_df,\
  \ 'Volume', 'volume')\n    plt.show()\n```\n\n这段代码有一个变通之处。只有上半部分应该有标题；下半部分的标题会与上半部分的\
  \ X 轴挤在一起。因此，只显示一个标题。\n但除此之外，这个示例使用的是看起来熟悉的代码。\n图 15.9 使用 GOOGL (Google) 作为选定的股票。\n\
  \n![](img/6e45221a8147f2442c653a3d4a866570_959_0.png)\n\n**图 15.9.** GOOGL (Google)\
  \ 的子图，带有成交量\n\n## 15.11 添加移动平均线\n\n你可以为股票市场报告添加的最有用的内容之一是移动平均线。以下是 180 天（六个月）移动平均线的工作原理。\n\
  \n+   • 从至少有 180 个前置数据点的日期开始。如果你想更早开始，可以使用尽可能多的可用前置日期。\n+   • 对此日期之前的所有 180 个日期的收盘价求平均值。这成为移动平均线的第一个点。\n\
  +   • 对下一天重复步骤 1 和 2：你现在得到的价格是第二个日期之前的 180 个价格的平均值。\n+   • 继续重复这些步骤，以生成一条绘制平均价格的折线图，该线中的每个数据点都对前\
  \ 180 天的价格求平均。\n\n结果是，如果你忠实地遵循这些步骤，你将得到一条似乎跟随实际价格但（大部分）不精确匹配它的线。相反，它总是滞后于后面，仿佛被过去的遗产所拖累。但这两条线之间的关系很有趣。\n\
  一方面，当当前价格突破其移动平均线时，似乎即将出现强劲上涨；反之，当当前价格跌破移动平均线时，这往往是大跌的开始。\n\n> > **注意**\n> >\n>\
  \ > 警告：我们不赞同任何特定的投资策略。然而，许多股票分析师和经济学家确实关注移动平均线。\n\n计算移动平均线似乎是计算机的理想工作。事实上，对于 Python\
  \ 来说，使用我们导入的包，这很容易。**pandas rolling** 函数使你能够为任何给定行获取一组 `n` 个前置行，其中行按时间顺序排列。\n然后只需求平均值即可得到我们想要的移动平均线。\n\
  \n要获取此移动平均线，请使用此处所示的函数调用。\n\n![](img/6e45221a8147f2442c653a3d4a866570_961_0.png)\n\
  \n单击此处查看代码图像\n\n```\ndata_set = selected_column.rolling(n,\nmin_periods=m).mean()\n\
  ```\n\nselected_column 是 Open、Close 或我们正在使用的任何列。值 n 告诉在平均值中使用多少个过去的天数。min_period（如果你愿意可以省略）说明对于任何给定日期，需要有多少个前置数据点可用，才能成为移动平均线的一部分。\n\
  \n此语句之所以有效，是因为对于每一天，rolling 函数访问 n 个前置行。对这些数据求平均值即可得到我们要找的移动平均值。本质上，rolling 访问 180\
  \ 行数据以生成一个二维矩阵；然后 mean 方法将这些行合并为一个单一列，该列包含平均值。\n\n例如，以下是针对每一天平均前 180 天的调用：\n\n单击此处查看代码图像\n\
  \n```\nmoving_avg = column.rolling(180,\nmin_periods=1).mean()\n```\n\n为了使其余代码更容易编写，让我们先修改`makeplot`函数，使其能够容纳一个可选参数来创建移动平均线。对**rolling**的调用必须在`column`仍然是**pandas**列而不是**numpy**列时进行。\n\
  \n单击此处查看代码图像\n\n```\n# Make a plot: do the boring, repetitive stuff.\ndef makeplot(stock_df,\
  \ field, my_str, avg=0):\n    column = getattr(stock_df, field)\n    if avg:   \
  \      # Only work if avg is not 0!\n        column = column.rolling(avg,\nmin_periods=1).mean()\n\
  \    column = np.array(column, dtype='float')\n    plt.plot(stock_df.Date, column,\
  \ label=my_str)\n    plt.legend()\n```\n\n请注意，这为`makeplot`提供了一个额外参数`avg`，但该参数实际上是可选的；它有一个默认值\
  \ 0。\n\n现在让我们绘制一只股票及其 180 天移动平均线，大约对应六个月。像往常一样，新的和修改的行以粗体显示。\n\n单击此处查看代码图像\n\n```\n\
  def do_movingavg_plot(stock_df, name_str):\n    ''' Do Moving-Average Plot function.\n\
  \    Plot price along with 180-day moving average\n```\n\n\n\n\nWow, it works!\n\
  \nAnd it’s clear how to tweak this example. The following statement replaces 180\
  \ with 360, thereby doubling the period of averaging so that for any given day,\
  \ the previous 360 days’ prices are averaged in to produce the moving-average line\
  \ rather than 180.\n\nClick here to view code image\n\n```\nmakepot(stock_df,'Close','360\
  \ day average',\n360)\n```\n\n## 15.12 向用户提供选择\n\n要构建可用的应用程序，你需要向用户提供选择，并让他们决定绘制哪些数据。在任何给定的一天，可能会显示成千上万种图表。\n\
  \n最重要的选择是显示信息的股票。这很简单，只需提示用户输入股票代码，例如 IBM、DIS、MSFT 或 GOOGL。\n\n然后，应用程序可以打印过去十年收盘价的简单图表，也可以从菜单中选择打印几种类型的图表之一。你还可以添加一个“退出”命令。\n\
  \n一个合理的起始应用程序设计可能是提供以下菜单：\n\nClick here to view code image\n\n+   0. Quit\n+   1.\
  \ Print simple closing-price graph.\n+   2. Print highs and lows.\n+   3. Print\
  \ price/volume subplots.\n+   4. Print price with 180-day moving average.\n\n为了支持这些操作，`stock_plot`\
  \ 模块需要包含几个函数，每个函数执行不同的操作。这只是从之前的部分复制和粘贴代码的问题。\n下面的清单显示了 `stock_plot` 模块的最终版本。\n\n\
  > Click here to view code image\n\n```\n# file stock_plot_v4.py ----\n---\nimport\
  \ numpy as np\nimport matplotlib.pyplot as plt\nfrom stock_load import load_stock\n\
  def do_simple_plot(stock_df, name_str):\n \"\"\" Do Plot function.\n Plot a simple\
  \ graph of closing price.\n \"\"\"\n makeplot(stock_df,'Close', 'closing price')\n\
  \ plt.title(name_str + ' Stock Price')\n plt.show()\ndef do_highlow_plot(stock_df,\
  \ name_str):\n \"\"\" Do High/Low Plot function.\n Plot both highs and lows for\
  \ stock, then show.\n \"\"\"\n makeplot(stock_df, 'High', 'daily highs')\nmakeplot(stock_df,\
  \ 'Low', 'daily lows')\nplt.title('High/Low Graph for ' + name_str)\nplt.show()\n\
  \ndef do_volume_subplot(stock_df, name_str):\n    \"\"\" Do Volume Subplot function.\n\
  \    Plot closing price and volume subplots.\n    \"\"\"\n    plt.subplot(2, 1,\
  \ 1)      # Plot top half.\n    makeplot(stock_df, 'Close', 'price')\n    plt.title(name_str\
  \ + ' Price/Volume')\n    plt.subplot(2, 1, 2)      # Plot bottom\n    half.\n \
  \   makeplot(stock_df, 'Volume', 'volume')\n    plt.show()\n\ndef do_movingavg_plot(stock_df,\
  \ name_str):\n    \"\"\" Do Moving-Average Plot function.\n    Plot price along\
  \ with 180-day moving average\n    line.\n    \"\"\"\n    makeplot(stock_df,'Close',\
  \ 'closing price')\n    makeplot(stock_df,'Close', '180 day average',\n    180)\n\
  \    plt.title(name_str + ' Stock Price')\n    plt.show()\n\n# Do the boring, repetitive\
  \ stuff.\ndef makeplot(stock_df, field, my_str, avg=0):\n    column = getattr(stock_df,\
  \ field)\n    if avg:      # Only plot avg if not 0!\n        column = column.rolling(avg,\n\
  \    min_periods=1).mean()\n    column = np.array(column, dtype='float')\n    plt.plot(stock_df.Date,\
  \ column, label=my_str)\n    plt.legend()\n\nif __name__ == '__main__':\n    name_str\
  \ = 'GOOGL'\nstock_df = load_stock(name_str)\ndo_movingavg_plot(stock_df, name_str)\n\
  do_simple_plot(stock_df, name_str)\ndo_volume_subplot(stock_df, name_str)\ndo_highlow_plot(stock_df,\
  \ name_str)\n```\n\n现在还需要编写一个模块，提示用户选择，然后调用相应的函数。该模块将提示输入股票代码，然后——如果找到了相关股票——要求进行菜单选择。\n\
  \n我们本可以从一个不尝试捕获异常（运行时错误）的版本开始，但考虑到可能出错的所有情况（连接不佳、输入无效的股票代码），添加错误检查（即异常处理代码）后，这个应用程序会更加有用。错误检查对于许多类型的应用程序都是一件好事，但在这种情况下，它是必不可少的。\n\
  \n以下应用程序通过重新提示用户，直到成功或直到用户输入空字符串来处理错误，在这种情况下，应用程序会优雅地终止。如第 8 章所示，根据需要进行重新提示，因为异常处理和\
  \ while 循环的结合。循环永远不会退出，直到函数返回；异常处理的一个副作用是跳转到 except 语句，然后（作为结果）再次从循环顶部开始。\n\nClick\
  \ here to view code image\n\n```\n# file stock_demo.py ------------------------------------\n\
  from stock_plot_v4 import *\nmenu_str = ('Menu choices:\\n' +\n'0. Exit\\n' +\n\
  '1. Simple Plot of Prices\\n' +\n'2. Plot of Daily High/Low Prices\\n' +\n'3. Plot\
  \ of Price with Volume Subplot\\n' +\n'4. Price plus Moving Average\\n')\nprompt_msg\
  \ = 'Enter stock symbol (ENTER to exit): '\ndef main():\n    while True:\n     \
  \   # Prompt and re-prompt user until a valid\n        stock\n        # symbol is\
  \ entered OR user exits.\n        try:\n            s = input(prompt_msg)\n    \
  \        s = s.strip()\n            if not s:        # On empty string,\n      \
  \          exit.\n                return\n            stock_df = load_stock(s)\n\
  \            n = int(input(menu_str + 'Input choice:\n'))\n            if n < 0\
  \ or n > 4:\n                n = 0\n            if n == 0:\n                return\n\
  \            fn = [do_simple_plot, do_highlow_plot,\n                  do_volume_subplot,\
  \ do_movingavg_plot]\n            [n-1]\n            fn(stock_df, s)\n        except:\n\
  \            print('Couldn\\'t find stock. Re-try.')\nmain()\n```\n\n这里采用的技术之一是使用开放括号来启用行延续，帮助创建多行字符串，`menu_str`。\n\
  \n另一种技术是索引函数名称列表（可调用对象）并调用相应的命令。还有其他方法可以达到同样的效果——最明显的方法是使用一系列 `if/elif` 语句——但这里使用的技术紧凑且高效。\n\
  \n这个模块的一个有趣之处在于，它调用了 `load_stock` 函数，尽管该函数既未定义在本模块中，也未定义在它直接导入的模块 `stock_plot_v4.py`\
  \ 中。但该模块导入了 `stock_load.py`。因此，`stock_demo` 间接导入了 `stock_load`。\n\n还有许多可能的改进，但这些留给了章末的建议问题。\n\
  \n# 第 15 章总结\n\n在这本书中，我们已经走得很远了。在第 1 章中，我们的 Python 程序展示了几个打印一些值的语句。然后，仍在第 1 章中，我们使用\
  \ Python 打印了诸如斐波那契数之类的复杂序列。但是，在本章及之前的章节中，我们添加了列表、矩阵和复杂数据框等 Python 对象。\n\n能够从互联网上获取信息，将其加载到数据框和数组中，最后将其绘制出来，这真是太棒了。图形编程是你可以掌握的最具挑战性的任务之一，但得益于其包，Python\
  \ 将问题减少到仅几行代码。甚至在第 13 章中也涉及了三维图形。\n\n所以，如果我们问“Python 有什么用？”答案是“任何事情，只要有人为它编写了包！”\n\
  \n还有其他一些关于这门语言的事情可以说。在大多数程序中你最常想做的事情——获取用户输入，然后将输入分解为单词、短语和数字——在 Python 中得到了极好的支持。而正则表达式包将这些能力提升到了更高的水平。\n\
  \nPython 在列表、字符串、字典和集合方面的内置能力非常强大，以至于最大的挑战之一就是了解你拥有的所有选项。你可以很长一段时间都没有意识到集合是自排序的，或者你可以在不编写循环的情况下获取列表的总和。学习每个\
  \ Python 快捷方式可能需要一段时间。我们写这本书，部分目的就是为了缩短你掌握这种丰富语言所需的时间。\n\nPython 也存在偶尔的危险，你在沿着 Python\
  \ 河流顺流而下时可能会遇到的危险弯道。我们也在本书中尝试解决了大部分这些问题，所以当你最终与 Python 面对面时，你会发现它不是草丛中的蛇，而是一个新朋友和伙伴。\n\
  \n# 第 15 章复习\n\n\n\n\n\n\n## QUESTIONS\n\n- 1 Is there any difference between a\
  \ **numpy** array and a **pandas** data frame? If there is, how do you convert between\

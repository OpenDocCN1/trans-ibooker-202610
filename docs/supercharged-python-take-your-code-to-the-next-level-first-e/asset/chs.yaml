  4. 使用 **with** 关键字而不是直接打开文件有什么优势？\n5. 当你读取一行文本时，Python 是否包含尾随换行符？当你写入一行文本时，Python\
  \ 是否会追加换行符？\n6. 哪些文件操作支持随机访问操作？\n\n\n\n\n\n7 你最可能在什么情况下使用 **struct** 包？\n\n8 什么情况下\

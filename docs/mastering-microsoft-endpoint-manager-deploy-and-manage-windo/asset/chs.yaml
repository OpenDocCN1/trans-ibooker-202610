  Name * Enable Location Service\nDescription\nPlatform Windows 10 and later\n\n图\
  \ 16.39 – 启用位置服务配置文件\n\n- 2. 搜索 privacy 并选择 Let Apps Access Location，如以下屏幕截图所示：\n\

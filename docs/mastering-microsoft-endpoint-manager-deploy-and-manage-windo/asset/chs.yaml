- "# 精通 Microsoft Endpoint Manager：部署和管理 Windows 10、Windows 11 和 Windows 365 在物理和云\
  \ PC 上\n\n\n\n\n\n\n> \"If you want to go fast, go alone. If you want to go far,\
  \ go together.\"\n> \n> - African proverb\n\n> \"With Windows 365, we are making\
  \ Windows available not just on Windows devices, but any device, harnessing the\
  \ power of the cloud.\"\n> \n> - Satya Nadella\n\n> Community is important for everyone:\
  \ please consider sharing your knowledge to help others! Working together will help\
  \ everyone get to a much higher level!\n> \n> - Christiaan Brinkhoff\n\n> \"The\
  \ way I measure my life is \"Am I better than I was last year?\"\"\n> \n> - Satya\
  \ Nadella\n\n> \"You renew yourself every day. Sometimes you're successful, sometimes\
  \ you're not, but it's the average that counts.\"\n> \n> - Satya Nadella\n"
- "## Foreword\n\n### The history behind Microsoft Endpoint Manager\n\nI started at\
  \ Microsoft as a developer right out of college in the early 90s. My first coding\
  \ assignment was on **Project Hermes**, building an inventory and application delivery\
  \ tool for the new operating system that Microsoft was about to release – Windows\
  \ NT. Project Hermes later became **Systems Management Server (SMS)** 1.0. I stayed\
  \ on the project and eventually became the product and engineering owner responsible\
  \ for building and releasing Configuration Manager 2007 and 2012. Right after releasing\
  \ Configuration Manager 2012, I went to lead the engineering team for Intune/MEM\
  \ and re-architected Intune to become the industry-leading cloud-based device management\
  \ service. At the start of 2020, I was asked whether I was interested in leading\
  \ the product and engineering effort for a new startup project called Cloud PC;\
  \ I remembered saying *sign me up* because I saw it as the last piece of the puzzle\
  \ to complete the full circle for device management.\n\nWhen I joined Microsoft,\
  \ device management as an industry didn't exist. With the introduction of SMS 1.0\
  \ and through Configuration Manager 2012, Microsoft created a new IT function –\
  \ device management. With Intune/MEM, we expanded device management from Windows\
  \ devices to all devices and we brought device management to the cloud. **Virtual\
  \ Desktop Infrastructure (VDI)** has existed for decades, but it has always been\
  \ costly to set up and run and is difficult to adapt to changing business needs.\
  \ With Windows 365 Cloud PC, we set out to democratize VDI. We want cloud PCs to\
  \ be easy to provision and manage, just like how IT manages their physical devices\
  \ today, and in addition, we wanted to remove much of the complexity and cost associated\
  \ with VDI.\n\nIn the last year and a half, we built a brand-new Azure-based service\
  \ to enable every MEM admin to provision and manage cloud PCs as easily as they\
  \ can with their physical Windows PCs, or iOS/Android devices. With the full elasticity\
  \ of Azure, the predictable pricing, and the ability to instantly purchase, provision,\
  \ and resize cloud PCs, we are creating many new use cases for running a Windows\
  \ PC in the cloud that cannot be easily achieved by traditional VDI or physical\
  \ PCs.\n\nOn behalf of the hundreds of engineers and product managers that worked\
  \ tirelessly in the middle of the COVID pandemic building the Windows 365 service,\
  \ and to all the IT heroes everywhere managing and securing devices, we want to\
  \ introduce to you a new category of PC – Cloud PC. This book will help you to adopt\
  \ Windows 365 quickly and gain new superpowers in device management.\n\nEnjoy your\
  \ newfound power.\n\nKen Pan\n\nCVP Windows 365 & MMD at Microsoft\n\n### The history\
  \ behind Cloud PC\n\nI joined Microsoft in 2001 as a Hardware Technical Evangelist\
  \ and Lead Program Manager for Networking. I worked with hardware partners to improve\
  \ user experiences and expand the market for consumer networking products. During\
  \ this time of my career, I created several patents around wireless setup, network\
  \ discovery, and media streaming technologies. The culmination of this work led\
  \ to the development and standardization of Wi-Fi Protected Setup and the adoption\
  \ of a number of Microsoft networking technologies in common industry products.\
  \ Working with partners to bring new value to customers was ingrained in my DNA\
  \ and is something I have carried forward in my career.\n\nDuring the Windows 7\
  \ era, I transitioned to media streaming and led the product team implementing video\
  \ in HTML5, DRM, Media CODECs, and media streaming. My team delivered a number of\
  \ new end user experiences including PlayTo and remote media access to Windows Media\
  \ Player. From there I moved to the Xbox team to deliver SmartGlass for Xbox One.\n\
  \nAbout 10 years into my career at Microsoft, my interests led me to virtualization,\
  \ which was a culmination of all the technologies I had worked on, such as home\
  \ networking, audio and video encoding, DRM, media streaming, and device redirection.\
  \ At that time, Microsoft's first-party virtualization offering (RDS) had a very\
  \ limited feature set and scalability. Though the technology was heavily used by\
  \ the tech community for accessing personal desktops, adoption was relatively small\
  \ in the enterprise space (this was largely led by Citrix).\n\nThe RDS team was\
  \ ripe with talented engineers who had focused their entire careers working on virtualization\
  \ and the partner ecosystem was clamoring for opportunities to engage with Microsoft\
  \ to deliver value-added services. This combination of a large talent pool, ready\
  \ and willing partners, and continued growth of virtualization use cases created\
  \ just the right environment to develop a new virtualization platform that could\
  \ reach a broader audience.\n\n- Create an end user experience that is consistent\
  \ with physical Windows devices.\n- Provide a seamless experience to scale up and\
  \ out as the needs of our customers evolve.\n- Provide fixed monthly pricing options\
  \ that enable customers to manage their budgets.\n- No global admin required; administration\
  \ is properly distributed to the right admins in familiar portals.\n\nRight around\
  \ the time we finalized our principles, the world was hit with a global pandemic\
  \ that would forever change the way we work. The team was only a few months old\
  \ when COVID hit, and we had just started building out the new team when the world\
  \ went into lockdown. Seeing as we were developing a new service that would empower\
  \ users to be productive anywhere in the world, we took on the challenge of putting\
  \ together a globally distributed team and developing the service using Teams, SharePoint,\
  \ Azure DevOps, and other tools to keep the team in sync. 8 months later we started\
  \ our private preview of the service and 8 months after that we went live.\n\nThe\
  \ world will forever be changed by the effects of COVID. Organizations are creating\
  \ more opportunities for remote workers, and they are migrating their workloads\
  \ to the cloud to expand their reach to provide corporate resources to a globally\
  \ distributed workforce. Windows 365 was cast from this new environment and is just\
  \ the right product to empower organizations to provide secure and elastic Windows\
  \ Desktops to their globally distributed workforce.\n\nScott Manchester\n\nDirector\
  \ of Product Management at Microsoft\n\n\n\n\n\n## Contributors\n## 关于作者\n\n**Christiaan\
  \ Brinkhoff** 担任微软 Windows 365 工程团队的主管项目经理和社区负责人，推动诸如 Windows 11 集成等新功能以及大量不同的新社区计划，同时发挥其专业专长帮助客户构想新的虚拟化体验。Christiaan\
  \ 于 2018 年作为 FSLogix 收购的一部分加入微软。\n\n他还获得了微软 MVP、Citrix CTP 和 VMware vExpert 社区成就。\n\
  \n> *写书需要巨大的奉献和持续的精力，尤其是在搬到美国雷德蒙德后，家庭也在成长。我要感谢我的妻子一直支持我，并允许我投入大量私人时间来完成这本书！*\n\n\
  **Per Larsen** 担任微软 Endpoint Manager - 客户加速团队 - **商业管理体验 (CMX)** 工程的高级项目经理，他将来自微软最大和最具战略意义客户的经验带回工程团队，以推动服务的改进，使客户拥有持续改进的产品体验。他还帮助部署和采用微软\

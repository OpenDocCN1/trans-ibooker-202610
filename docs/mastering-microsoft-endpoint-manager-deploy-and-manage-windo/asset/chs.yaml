- '## Introducing

  Windows 365


  在本章中，你将从概念层面了解有关 Windows 365 的所有必要信息。


  阅读完本章后，你将更了解使用 Windows 365 的好处以及不同的服务组件。在下一章中，你将学习如何部署它！


  本章内容非常全面——我们将介绍以下主题：


  - What is Windows 365?

  - Microsoft Endpoint Configuration Manager support


  ## What is Windows 365?


  用户希望技术熟悉、易于使用且始终可用，以便他们能够在不同设备间流畅地工作和创作。Cloud PC 通过将云的强大功能和安全性与 PC 的熟悉感相结合，使这一切成为可能。只有微软能够将
  PC 和云结合起来，提供一致且集成的 Windows 体验。Windows 365 是全球首个云 PC。借助 Windows 365 Cloud PC，Windows
  从基于设备的操作系统演变为混合个性化计算。


  Cloud PC 是你的个性化桌面、应用、设置和内容，通过安全流式传输从云端到你的设备。在 Microsoft Endpoint Manager 中部署和管理虚拟终端时，降低了环境复杂性，无需额外的
  **Virtual Desktop Infrastructure (VDI)** 专业知识或资源。


  Windows 365 为你提供了 Windows 的所有优势，而没有任何传统硬件限制，因为你的桌面在 Azure 云中运行。


  你可以在以下列表中找到该服务的全部主要原则：


  - 在 Microsoft Endpoint Manager 中部署和管理虚拟终端；无需额外的 VDI 专业知识或资源。

  - 在几分钟内采购、配置和部署，并可选择自动操作系统更新。

  - 从任何地方访问你的个性化 Windows 桌面体验。

  - 为弹性劳动力量身定制计算和配置。

  - 在你选择的设备上继续上次的工作。

  - 在 Windows 终端上优化体验。

  - 以按用户计费的方式自信扩展。


  ## Removing the complexity of traditional VDI deployments


  所有构建块都已为你自动化，并且服务会以最优化的方式随你扩展以使用 Microsoft 365 应用。这是微软对 Windows 和 Microsoft 365
  的最佳表达，并且始终安全且保持最新。


  Cloud PC 可以从任何设备在任何地方访问，并且可以根据用户不断变化的计算需求进行扩展，这意味着用户可以获得自助服务权限，从而使 IT 管理员无需分配提供更多计算资源的许可证。存储升级和
  Cloud PC 重启也适用——稍后会详细介绍。


  ## Why virtualize Windows in the cloud?


  对你们中的一些人来说，这可能听起来是常识。然而，如果你对在云上运行的虚拟化桌面带来的好处了解不多，这里有一个快速概述：


  - **Mobility** – 用户可以从任何设备、任何地方访问 Cloud PC。

  - **Security** – 业务数据永远不会离开云。

  - **Scalability** – 适应劳动力波动。

  - **Compatibility** – 旧应用可以虚拟化运行。

  - **Performance** – 应用更接近数据。

  - **Management** – 一个镜像供多位用户使用。

  - **Cost** – 利用云的灵活性。


  ## Removing complexity while increasing security


  Windows 365 在各方面都减少了复杂性，同时也提高了终端的安全级别。该服务完全由 Microsoft Defender for Endpoints 和零信任原则支持，并增强了
  Azure AD 条件访问规则的支持——保护你的虚拟桌面从未如此易于配置。


  ## Low costs as a fixed-price model


  另一个巨大的好处是成本，因为该服务可以降低维护 VDI 环境或任何其他用例的当前成本，例如远程员工通过昂贵且不可靠的 VPN 连接连接。所有服务均采用订阅模式构建，也符合大多数企业的
  CapEx 需求。


  以下比较模型完美展示了传统远程桌面服务（基于会话）和 VDI 与 Azure Virtual Desktop 和 Windows 365 之间的差异：


  ![](img/a3e9f26159d3739e434fe676b2987c1d_77_0.png)


  Figure 3.1 – Comparison between an on-premises and in-the-cloud environment


  Windows 365 是一种固定价格服务，其个人桌面体验完全通过 Microsoft Endpoint Manager 管理。


  ## Comparing Windows 365 Enterprise and Business


  Windows 365 有两个版本，一个可通过 Microsoft Endpoint Manager 完全管理和配置（本书主要涵盖），称为 **Windows
  365 Enterprise**，另一个称为 **Windows 365 Business**，你需要自行提供更多服务，例如应用交付和管理。


  客户可以直接从 Microsoft 365 管理中心门户购买 Windows 365 Business，无需域即可设置其帐户，并直接从 Windows 365
  在线主页配置和管理其 Cloud PC。


  无需其他 Microsoft 许可证——如果你愿意，只需一张信用卡即可开始。Windows 365 Business 适用于希望在其组织内为 300 个或更少用户部署
  Cloud PC 的客户。


  Windows 365 Business 允许客户在从 Microsoft 365 管理中心将许可证分配给用户后直接开始配置 Cloud PC。无需 IT 管理员交互。用户在许可证分配后不到一小时即可访问
  Cloud PC 并开始工作！


  在下表中，你可以找到每个产品可用的功能列表，以便在每个场景中更轻松地做出决定：



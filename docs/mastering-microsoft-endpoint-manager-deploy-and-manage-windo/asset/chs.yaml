  \ 摘要\n\n### 基础\n\n应用设备名称模板\n是\n\n输入名称\nWin-%RAND:5%\n\n输入资源前缀名称\nCloudConfig\n\n\
  ### 应用\n\n所选应用\nMicrosoft Teams\nMicrosoft Edge for Windows 10\nOutlook\n\n### 分配\n\

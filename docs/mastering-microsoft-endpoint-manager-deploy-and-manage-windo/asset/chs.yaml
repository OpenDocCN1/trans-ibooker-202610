- "## 16\n故障排除 Microsoft Endpoint Manager\n\n在本章中，您将了解在配置 Microsoft Endpoint Manager\
  \ (MEM) 环境时请求帮助的方法，以及在遇到问题时，如何自行或在 Microsoft 支持的少量帮助下解决这些问题。\n\n在本章中，我们将介绍以下主题：\n\
  \n- Troubleshooting MEM\n- Service health and message center\n- Troubleshoot blade\
  \ in MEM\n- Troubleshooting Windows 10 MEM enrollment\n- Windows 10 device diagnostics\n\
  - Troubleshooting application delivery\n- Troubleshooting Autopilot\n- Windows 11\
  \ Autopilot diagnostics page\n- Troubleshooting locating a Windows device\n- Troubleshooting\
  \ Microsoft Edge\n\n## Troubleshooting MEM\n\n在 **Tenant admin** 刀片下，您有 **Tenant\
  \ status**。这里存储了一些关于租户的重要信息，例如以下内容：\n\n- **Tenant name and Tenant location:** 在这里，您可以看到您的租户位于世界的哪个部分——在本例中为欧洲。\n\
  - **MDM authority:** MDM 代表 **mobile device management**。这在过去并不那么重要。\n- **Service\
  \ release:** 这很重要。在这里，您可以跟踪您的租户是否已升级到最新的服务版本。\n\nIntune 是 Microsoft 每月更新的服务，因此根据租户所在的位置，您可能会看到您的\
  \ Intune 版本根据以下部署计划在其他版本之前得到更新：\n\n1. **Day 1: User interface (UI)** 推广到亚太地区。\n\
  2. **Day 2:** UI 推广到欧洲、中东和非洲。\n3. **Day 3:** UI 推广到北美。\n4. **Day 4+:** UI 推广到 Intune\
  \ for Government。\n\n以下屏幕截图显示了存储在 **Tenant status** 中的信息概览：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_588_0.png)\n\
  \n*Figure 16.1 – Tenant status*\n\n**Connector status** 是您可以查看 Windows Autopilot\
  \ 同步、Microsoft Store for Business 同步以及 Microsoft Defender for Endpoint 连接器状态的地方，这些都与\
  \ Windows 相关。\n\n您还可以查看所有其他连接器类型的状态。连接器可能有三种不同的状态，如下所述：\n\n- **Unhealthy:**\n  -\
  \ 证书或凭据已过期。\n  - 最后一次同步是在 3 天或更久之前。\n- **Warning:**\n  - 证书或凭据将在 7 天内过期。\n  - 最后一次同步是在\
  \ 1 天前以上。\n- **Healthy:**\n  - 证书或凭据在未来 7 天内不会过期。\n  - 最后一次同步是在 1 天前以内。\n\n您可以在以下屏幕截图中看到此概览：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_589_0.png)\n\nFigure 16.2 – Connector\
  \ status\n\n## Service health and message center\n\nSERVICE HEALTH 显示活动事件和通知。此信息在\
  \ MEM 管理中心中易于访问，如以下屏幕截图所示。相同的信息也在 Microsoft 365 管理中心的 Microsoft 365 服务运行状况仪表板中提供：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_590_0.png)\n\nFigure 16.3 – Service health\
  \ and message center\n\n在 Tenant admin 刀片中，如果您拥有 Microsoft Intune 订阅，您可以选择记录免费支持票证，如以下屏幕截图所示：\n\
  \n## Tenant admin | Help and support\n\n## What can we help you with?\n\nChoose\
  \ a topic and we’ll find the best solution for you. Learn more\n\nFor on-premises\
  \ Configuration Manager issues, open your case at https://www.support.microsoft.com.\n\
  \nConfiguration Manager\nExample: Desktop Analytics, Endpoint analytics for Configuration\
  \ Manager, Tenant attach for Configuration Manager devices\n\nIntune\nExample: Device\
  \ management, Endpoint analytics for Intune devices\n\nCo-management\nCo-management\
  \ workloads with either Intune or Configuration Manager as the management authority\n\
  \n- Tenant status\n- Microsoft Tunnel Gateway\n- Connectors and tokens\n- Filters\
  \ (preview)\n- Roles\n- Azure AD Privileged Identity Man...\n- Diagnostics settings\n\
  - Audit logs\n- Device diagnostics (preview)\n- End user experiences\n- Customization\n\
  - Custom notifications\n- Terms and conditions\n- Microsoft Managed Desktop\n- Tenant\
  \ enrollment\n- Help and support\n\nFigure 16.4 – Intune support\n\n点击 Intune 开始\
  \ Microsoft Intune 支持工作流。首先，您将通过常见场景或推荐的支持文章进行指导。如果这些都无法帮助您解决问题，您可以创建支持请求，其中需要提供尽可能详细的信息。\n\
  \n## Troubleshoot blade in MEM\n\n在 **Troubleshoot** 刀片内部，**information technology\
  \ (IT)** 管理员可以从 MEM 管理中心选择用户以开始故障排除。\n\n转到 **Troubleshooting + support** 即可开始。如果您想排查无用户设备，您可以启动\
  \ **Device** 刀片并直接定位设备，以查看分配给设备的配置文件和应用。在本例中，我们希望通过执行以下步骤找到并帮助终端用户：\n\n1. 通过点击 **Select\
  \ user** 按钮选择您要帮助的用户，如以下屏幕截图所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_592_0.png)\n\

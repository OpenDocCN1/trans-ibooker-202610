  \ – 位置服务已开启\n\n## Troubleshooting Microsoft Edge\n\nMicrosoft 已发布基于 Chromium 的新版\
  \ Microsoft Edge。此新版本提供与扩展和网站的最佳兼容性。这也意味着有新的故障排除方式以及可管理 Edge 浏览器的新策略。\n\n让我们先来看看浏览器内置的策略故障排除工具。通过在地址栏中输入\
  \ Edge : //policy/，您可以访问策略页面，如以下屏幕截图所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_618_0.png)\n\
  \n图 16.45 – Edge 策略\n\n您可以看到所有策略设置以及应用于 Edge 浏览器的每个设置的策略值。\n\n要检查浏览器是否已更新到最新版本，您可以在\
  \ Edge 浏览器的地址栏中输入 edge : // settings/help。这将带您进入以下屏幕：\n\n## Summary\n\n在本章中，您了解了在配置\
  \ MEM 期间可能出现的绝大多数部署错误。\n\n阅读本章后获得的知识将帮助您在试用过程中排查一些常见错误，并使您成为维护企业生产工作负载所需的专家！\n\n\
  在下一章中，我们将学习有关 Windows 365 的故障排除。\n\n## Questions\n\n- 1. Microsoft Support 是否包含在您的\
  \ Microsoft Intune 订阅中？\n  a) Yes\n  b) No\n- 2. 从 Microsoft Intune 工作时，是否需要在 Windows\
  \ 上启用 Windows 位置服务？\n  a) Yes\n  b) No\n\n## Answers\n\n- 1. (A)\n- 2. (A)\n\n##\

  \ – 分配\n\n在下一节中，让我们了解如何阻止个人设备。\n\n## 阻止个人 Windows 设备\n\n如果您阻止个人拥有的 Windows 设备注册，Intune\
  \ 会检查每个新的 Windows 注册请求是否已作为企业注册获得授权。未经授权的注册将被阻止。\n\n以下方法被视为已作为 Windows 企业注册获得授权：\n\
  \n- 注册用户正在使用设备注册管理器帐户。\n- 设备通过 Windows Autopilot 注册。\n- 设备已使用 Windows Autopilot\
  \ 注册，但不是来自 Windows 设置的仅 MDM 注册选项。\n- 设备的 IMEI 号码列在 **Device enrollment | Corporate\
  \ device identifiers** 中。\n- 设备通过批量预配包注册。\n- 设备通过 **Group Policy Object (GPO)**\
  \ 注册，或通过 Configuration Manager 的自动注册进行共管。\n\n以下注册会被 Intune 标记为企业。但由于它们不提供 Intune\
  \ 管理员按设备控制，它们将被阻止：\n\n- 在 Windows 设置期间使用 Azure AD 加入的自动 MDM 注册*\n- 从 Windows 设置使用\
  \ Azure AD 加入的自动 MDM 注册*\n\n以下个人注册方法也将被阻止：\n\n- 从 Windows 设置使用 **Add Work Account**\
  \ 的自动 MDM 注册*\n- 来自 Windows 设置的仅 MDM 注册选项\n\n*如果已使用 Autopilot 注册，这些将不会被阻止。\n\n##\
  \ Microsoft Intune Windows 设备限制限制\n\n在本节中，我们将学习如何限制设备的限制。让我们开始：\n\n- 1. 登录到 MEM\

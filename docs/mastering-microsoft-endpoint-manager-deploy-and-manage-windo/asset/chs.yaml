  ## Windows 365 上的优化 Teams


  镜像库 – Microsoft 准备的 Windows 10 Enterprise 镜像 – 包含提供 Cloud PC 优化 Teams 体验所需的所有软件。作为
  IT 管理员或用户，您只需安装和配置 Microsoft Teams 应用程序即可使用。


  这种方法的主要好处是，您可以直接从物理端点到另一方进行 Teams 音视频通话，点对点进行，这有效地创建了与在运行 Microsoft Teams 的物理端点上相同的体验。


  优化的一些主要好处如下：


  - 由 WebRTC 促进的高性能点对点流媒体 – 流量将点对点流动并通过端点呈现。

  - 设备将作为相同的硬件设备重定向，提供更好的硬件重定向支持。

  - 在 Windows 10 客户端上，现代媒体堆栈的所有好处，包括硬件视频解码。


  ## Microsoft Edge


  Microsoft Edge Chromium 已被证明非常快速，并且其与其他 Microsoft 服务（如 Microsoft Endpoint Manager）设置策略以及跨平台支持应用同步，例如个人历史记录和收藏夹设置，得到了广泛好评。这导致
  Edge 至今成为 Windows 10 Enterprise 的默认浏览器。


  ## 休眠标签页


  Edge 工程团队不久前为 Edge Chromium 添加了休眠标签页作为 Edge 的新原生功能。此功能使您可以在浏览器处于非活动模式时减少每个标签页的 RAM
  使用量。使用此功能时 CPU 利用率也会降低。


  该功能是在 Chromium 冻结技术的核心之上构建的。冻结会暂停标签页的脚本计时器以最大限度地减少资源使用。休眠标签页在点击时会自动恢复，这与丢弃的标签页不同，后者需要完全重新加载页面。此设置默认启用，设置为
  1 小时。


  ## 启动加速


  启动加速可使您的浏览器启动速度快达 41%！在工作和在线浏览时，速度很重要。启动加速通过显著减少设备重启或重新打开浏览器后打开浏览器的耗时来最大化计算机的性能。初步测试显示，使用此功能后启动时间可提高
  29% 至 41%。






  此设置在我们的市场镜像中默认启用，适用于所有 4GB 及以上内存的 Cloud PC。


  以下截图是 Microsoft Edge 中的系统设置菜单。您可以看到“启动提升”和“通过休眠标签页节省资源”均已启用：


  ![](img/a3e9f26159d3739e434fe676b2987c1d_93_0.png)


  图 3.13 – 启动提升和休眠标签页


  ## 屏幕捕获保护


  屏幕捕获保护功能可防止敏感信息在客户端终结点上被捕获。启用此功能后，远程内容将自动被阻止或隐藏在屏幕截图和屏幕共享中。


  它还会对可能持续捕获屏幕内容的恶意软件隐藏。我们建议您在使用此功能时禁用剪贴板重定向，以防止将远程内容复制到终结点。


  要启用屏幕捕获保护功能，您只需运行以下命令来添加指定的注册表项，以在您的镜像中启用该功能：


  ## 重要说明


  您可以通过 PowerShell 将以下设置作为脚本操作推送到您的 Cloud PC。


  ```

  reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fEnableScreenCaptureProtection
  /t REG_DWORD /d 1

  ```



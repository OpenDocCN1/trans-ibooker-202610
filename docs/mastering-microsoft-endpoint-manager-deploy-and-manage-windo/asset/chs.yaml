  \n## 监控和分析\n\n确保你的云 PC 环境的性能和质量水平良好与实施一样重要（或更重要）。用户需要对他们的云 PC 感到满意，并且不应损害其生产力。\n\
  \nWindows 365/云 PC 与你今天为物理终端使用的所有监控和分析功能无缝集成。这意味着你可以轻松区分问题是活跃在物理终端上还是在云 PC 会话中。\n\
  \n你将在第 14 章，监控和端点分析中了解更多关于监控的内容，我们将在那里深入探讨确保你的 Windows 365/云 PC 环境性能和质量的具体指标，无论是主动还是被动！\n\

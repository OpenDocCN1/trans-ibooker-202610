  \ – Microsoft Defender for Endpoint\n\n> 注意\n> 启用后，使用设备威胁级别规则的合规策略将评估设备，包括来自此连接器的数据。禁用后，对于配置了设备威胁级别的策略，Intune\
  \ 将不会在设备合规性计算中使用通过此连接器发送的设备风险详细信息。由于从此连接器获取的风险级别而不合规的现有设备也将变为合规。\n\nMDM 合规策略设置：启用后，使用“设备威胁级别”规则的合规策略将评估设备，包括来自此连接器的数据，建议利用设备威胁级别作为\
  \ Windows 设备合规策略的一部分。\n\n禁用后，对于配置了“设备威胁级别”的策略，Intune 在设备合规性计算期间将不会使用通过此连接器发送的设备风险详细信息。由于从此连接器获取的风险级别而不合规的现有设备也将变为合规。\n\
  \n### MDM 合规策略设置\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_509_0.png)\n\n图 13.59\
  \ – MDM 合规策略设置\n\n- 6. 我们现在需要将 Windows 终结点注册到 Defender 中。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_509_1.png)\n\
  \n图 13.60 – Windows 10 设备 – Microsoft Defender for Endpoint 运行状态\n\n- 7. 切换回 MEM\
  \ 门户。\n\n8. 转到**终结点安全性**，然后转到**终结点检测和响应**。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_510_0.png)\n\
  \n图 13.61 – 终结点检测和响应\n\n开始之前，请下载你的 Defender 载入文件。你可以在 Defender 的“设置 | 载入”下找到该文件：https://securitycenter.windows.com/preferences2/onboarding。\n\
  \n图 13.62 – 正在下载载入文件\n\n9. 将其存储在你的计算机上的某个位置，并解压缩该文件夹。\n\n图 13.63 – 保存载入文件\n\n- 10.\
  \ 在相应字段中选择**Windows 10 及更高版本**和**终结点检测和响应 (MDM)**。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_512_0.png)\n\
  \n图 13.64 – 创建终结点检测和响应 (MDM) 配置文件\n\n- 11. 输入名称，然后单击**下一步**。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_512_1.png)\n\
  \n图 13.65 – 创建配置文件 1\n\n12. 启用“载入 blob”设置。\n\n### 创建配置文件\n\n终结点检测和响应\n\n终结点检测和响应\n\
  \nMicrosoft Defender for Endpoint 客户端配置包类型\n\n载入 blob\n\n图 13.66 – 创建配置文件 2\n\n\
  13. 选择你之前下载的 WindowsDefenderATP.onboarding 文件并将其上传到你的租户。\n\n### 选择文件\n\n选择文件\n\n\
  “WindowsDefenderATP.onboarding”\n\n选择\n\n图 13.67 – 正在上传载入文件\n\n14. 确认载入文件已正确添加。此文件包含将推送到终结点的配置，以便它们了解如何连接到你的\

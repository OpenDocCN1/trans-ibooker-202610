  \ Windows 配置文件类型以及服务之间的差异，以便在不同的端点设备上提供类似的体验，例如使用 Enterprise State Roaming 和 Microsoft\
  \ Edge 的物理和云端点。\n\nChapter 13, Identity and Security Management, 教你如何以最安全的方式为终端用户和\
  \ IT 部门配置 Azure Active Directory。你将学习启用 Azure MFA 的不同选项，关于 BitLocker，以及如何使用 MEM\
  \ – Intune 中的端到端安全级别集成配置 Microsoft Defender for Endpoint。\n\nChapter 14, Monitoring\
  \ and Endpoint Analytics, 看看在部署桌面之后，确保 Windows 和应用程序的性能、登录持续时间细分和质量水平是多么重要。你将在本章中学习如何使用\
  \ Endpoint Analytics、Productivity Score 和 MEM 的其他监控功能来实现这一点。\n\nChapter 15, Universal\
  \ Print, 看看 Universal Print 以及尽管企业越来越多地以数字方式做事，打印在物理纸上仍然很重要。Universal Print 是 Azure\
  \ 上相对较新的平台服务，可以简化整个打印配置和维护过程，与传统的打印服务器环境相比。\n\nChapter 16, Troubleshooting Microsoft\
  \ Endpoint Manager, 教授部署 Windows 10 Enterprise 和其他技巧和窍门以使部署顺利进行的最常见原因和修复方法。两位作者在多种形式的\
  \ Windows 部署方面拥有超过 20 年的现场经验，他们将在本节中分享这些经验。\n\nChapter 17, Troubleshooting Windows\
  \ 365, 教你关于 Windows 365 Cloud PC 的所有不同故障排除错误，以便在环境中部署云 PC 时能够主动应对可能发生的任何错误。\n\n\
  Chapter 18, Community Help, 分享作者拥有强大的社区背景的一些最佳社区博客；有些由初学者撰写，而有些则由 Microsoft MVP\
  \ 撰写。\n\n# 如何充分利用本书\n\n为了充分利用本书，最好对 MEM、Azure、Microsoft 365 云服务等有基础水平的了解。这不是必需的，因为你将在本书中学到所需的一切！\n\

  \n图 8.37 – Win32 应用迁移工具\n\n本节到此结束，介绍了 Microsoft Intune 中的 Win32 应用程序。在下一节中，我们将深入介绍\
  \ Microsoft 365 应用程序。\n\n## 部署 Microsoft 365 应用\n\nOffice 即点即用是向端点部署 Microsoft 365\
  \ 应用（Office）的新方式。如下例所述，安装过程分为以下五个阶段，并涉及从互联网主动下载。因此，安装元素非常小。\n\nMicrosoft 365 应用不同于\
  \ Microsoft Intune 中的其他应用，因为它是部署到托管设备的策略。该策略类似于通过 MDM 通道部署到设备的其他 CSP：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_319_0.png)\n\
  \n图 8.38 – Office CSP\n\n由于它是策略而非 Win32 应用，因此不能将其用作 Win32 应用中的依赖项。CSP 写入注册表键 Computer\\\
  HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\OfficeCSP，并在其中创建值为 http://go.microsoft.com/fwlink/?LinkID=829801\
  \ 的默认键，此时 setup.exe 会将该文件与存储在同一注册表位置（带有 GUID）的 XML 文件一起下载到本地设备。\n\nsetup.exe/configure\
  \ [Microsoft 365 应用 XML 文件名称] 的组合随后将开始从 Office CDN（Microsoft Intune UI 和配置 XML 中的默认选项）下载所有二进制文件。\n\
  \n安装完成后，FinalStatus 注册表键将更新如下：\n\n- 当状态 = 0 时：70（成功）\n- 当状态 != 0 时：60（失败）\n\nMicrosoft\
  \ Endpoint Manager 应用交付支持从应用配置文件配置菜单中直接注册 Microsoft 365 应用。\n\n它只是一个下拉菜单，允许您包含或排除\
  \ Microsoft 365 应用的安装（无需 ODT – XML 文件）：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_320_0.png)\n\
  \n图 8.39 – 添加 Microsoft 365 应用\n\n选择要在此部署中包含的 Office 应用后，您可以继续 Microsoft 365 应用向导。\n\
  \n## 更新通道\n\n选择所选 Microsoft 365 应用的 32 位或 64 位版本，并选择最符合您业务需求的更新通道：\n\n### 应用套件信息\n\

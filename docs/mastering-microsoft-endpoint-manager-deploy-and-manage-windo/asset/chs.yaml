  | 1 | 设备类型限制 – HR | 是 |\n| 默认 | 所有用户 | 是 |\n\n### 设备限制\n\n定义每个用户可以注册多少设备。\n\n| 优先级\
  \ | 名称 | 设备限制 | 已分配 |\n| --- | --- | --- | --- |\n| 1 | 设备限制 – HR | 15 | 是 |\n|\

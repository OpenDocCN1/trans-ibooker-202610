  \ IT 管理员提供对环境中桌面应用程序稳健性的高层次视图。App reliability score 是一个介于 0 到 100 之间的数字。该分数是根据环境中每个桌面应用程序的应用程序可靠性评分计算得出的，该评分可在\
  \ App performance 选项卡中找到。\n\n\n\n\n\n每个 App 性能 选项卡上的应用程序都会根据以下内容分配一个应用可靠性评分：\n\n\

  +   8. 将配置文件分配给你的 Autopilot 设备组。\n+   9. 作为 IT 管理员，你也可以直接从 Microsoft Intune 中的设备启动\
  \ Autopilot Reset：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_287_1.png)\n\nFigure\
  \ 7.40 – Windows device Autopilot Reset\n\n+   10. 在 **Device actions status** 部分，你将看到\

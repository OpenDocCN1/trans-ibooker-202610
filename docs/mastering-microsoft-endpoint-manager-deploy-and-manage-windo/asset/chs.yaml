  例如，我们的第二个许可规格 2vCPU/4 GB/64 GB 及更高版本的镜像开箱即用包含 Microsoft 365 应用和 Teams AV 优化，而 1vCPU/2
  GB/64 GB Lite 镜像则为该特定工作负载类型提供优化的操作系统体验，以获得最佳体验，因为我们已从镜像内部移除了不同内置服务，而这些服务对于支持的工作负载类型是不需要的：



  ## On-premises connections


  需要本地网络连接来连接到您自己的数据中心环境。这可能是仅连接到您自己的 Azure Virtual Network，但也可能是连接到您的托管设施或其他私有/混合云环境。很可能，您将在
  Cloud PCs 上安装业务应用，这些应用需要连接到仍驻留在本地的数据<|message|> 库或应用服务器。


  要连接到本地位置，您需要在本地网络上建立站点到站点 VPN 或 ExpressRoute（更可靠）。当您是拥有多个网络位置的企业时，您可以轻松通过点击 **+
  Create connection** 添加更多，如下图所示。



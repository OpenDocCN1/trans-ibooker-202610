  ## 自定义镜像


  一些客户更喜欢使用自己预先构建的自定义镜像，也称为黄金镜像。在 Windows 365 中也支持这种方法，可在配置策略向导期间选择。


  支持的自定义镜像服务如下：


  - Azure 管理镜像

  - 共享镜像库


  客户可以自由选择最适合其需求的解决方案，因为我们同时支持 Windows 10 和 11。一些客户更喜欢更现代化的管理方法，即使用一个包含最新 Windows
  更新和基础应用的基础镜像，其余部分将通过 Microsoft Intune 应用交付配置文件添加：



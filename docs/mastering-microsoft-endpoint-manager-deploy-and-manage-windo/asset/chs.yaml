  \n## 支持的终结点 – 设备重定向设置\n\n就支持摄像头或串行端口重定向而言，这并未作为 Windows 365 基线配置的一部分默认启用。开箱即用，Windows\
  \ 365 允许你重定向本地音频、剪贴板和麦克风。\n\n要允许更多重定向功能，你必须从 Microsoft Endpoint Manager 的 Intune\
  \ 配置文件中分配不同的配置集。我们之所以保留这么多设置禁用，是出于安全考虑。我们的服务符合我们的零信任原则，因此我们默认将其禁用，让客户决定什么最适合他们的用例。\n\
  \n默认情况下，最终用户将拥有更多的功能集，管理员可以选择是允许所有这些重定向，还是创建策略来阻止它们。\n\n你可以如下所示启用这些设置：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_123_0.png)\n\
  \n## 信息工作者门户（IWP）\n\n如“支持的终结点”部分所述，最终用户可以从不同平台访问其云电脑。Web 门户是最统一的方法，因为它只需要支持 HTML5\
  \ 的浏览器，例如 Microsoft Edge。\n\n为了简化访问，我们创建了 IWP，你可以在以下屏幕截图中看到它。该门户允许最终用户选择通过浏览器或远程桌面（MSRDC）客户端访问其云电脑。\n\
  \n- 4. 你在寻找我们在 Windows 365 中支持的不同终结点客户端吗？单击左上角主页图标下方的下载图标：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_125_0.png)\n\
  \n图 4.33 – 下载远程桌面客户端终结点支持的应用\n\n- 5. 选择你的本地资源重定向首选项。\n\n- 6. 几个月以来，你也可以在通过 Web 门户连接时，使用新的文件传输上传功能从设备上传数据。启用此功能将在此计算机上创建网络驱动器，以便你可以将文件从本地终结点传输到云电脑：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_125_1.png)\n\n图 4.34 – 允许访问本地资源\n\n##\
  \ 多重身份验证和条件访问\n\n我们建议你参阅本书后面的*第 13 章，身份与安全管理*，以了解有关条件访问的更多信息。\n\n多重身份验证默认在你的 Azure\
  \ AD 租户上启用，以确保黑客和其他入侵者远离你的环境。在 Windows 365 上启用此功能将使你被黑客攻击的可能性降低 99.9%。它还具有简化管理层作为运营顶层的优势。简而言之，你应该启用此功能！\n\
  \n这也相当容易做到。对于 Windows 365，我们有一个云电脑应用，可以在 **条件访问** 配置菜单中选择。步骤如下：\n\n- 1. 开始配置。转到\
  \ Microsoft Endpoint Manager 中 **终结点安全** 菜单下的 **条件访问** 菜单：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_128_0.png)\n\
  \n图 4.39 – 条件访问\n\n\n\n\n\n2. 创建新策略，并为你的 Azure MFA 策略输入自定义名称。完成此操作后，你可以逐步浏览向导中的所有层，以激活正确的设置来触发\
  \ MFA 的二级身份验证：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_129_0.png)\n\n图 4.40\
  \ – 输入策略的名称\n\n3. 选择要筛选并为其激活 MFA 的用户和/或 AAD 组列表。我将选择云电脑用户。\n\n> 重要说明\n> 选择“所有用户”时，请确保不要将自己锁定在外！此策略将影响你的所有用户。我们建议先将策略应用于一小部分用户，以验证其行为是否符合预期。\n\
  \n4. 打开云应用或 **“操作”** 菜单，然后选择 **“云电脑”** 作为云应用。确保 **“云电脑”** 的云应用 ID 为 `0af06dc6-e4b5-4f28-818e-e78e62d137a5`。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_130_0.png)\n\n图 4.41 – 选择 Windows 365\n\
  \n5. 单击 **“条件”** 开始创建过程。这将允许你根据风险、设备平台、位置、客户端应用或设备状态等条件的信号来控制用户访问层。\n\n6. 选择最符合你安全要求的设置。我将使用标记为\
  \ **“合规”** 的设备，以确保拥有合规设备的用户可以无需输入 MFA 即可连接到云电脑。\n\n> **重要说明**\n> \n> 所有其他帐户都将通过\
  \ MFA 提示强制执行。\n\n7. 移至 **“授予”** 菜单。选择最符合你安全要求的设置。\n\n8. 确保选择 **“需要多重身份验证”**：\n\n\
  ![](img/a3e9f26159d3739e434fe676b2987c1d_130_1.png)\n\n图 4.42 – 需要多重身份验证\n\n9. 转到“会话”菜单。此部分是可选的；但是，登录频率可以在现有令牌过期后仅\
  \ 1 小时就强制执行 MFA 提示。\n\n> 重要说明\n> 特别是在自带设备 (BYOD) 场景中，这可能非常有用。在配置此设置的时间内，你云电脑上的现有会话将保持活动状态。\n\
  \n10. 持久性浏览器功能使得在关闭并重新打开浏览器窗口后仍能保持登录状态。\n\n11. 通过单击“开启”然后“创建”来启用并创建策略。\n\n12. 确保“启用策略”设置默认设置为“关”。\n\
  \n13. 确认策略已以“开”状态添加。\n\n下次登录云电脑时，系统会提示你进行 MFA！\n\n## 云电脑的安全基线\n\n在 Microsoft 云中使用虚拟化桌面需要与物理\

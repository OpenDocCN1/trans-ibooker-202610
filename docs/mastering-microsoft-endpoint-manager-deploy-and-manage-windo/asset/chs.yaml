  \n他是认证的 Azure 解决方案架构师、管理员、安全工程师和 Microsoft 365 认证现代桌面管理员。他还作为 CompTIA 主题专家参与了 IT\
  \ 基础认证考试准备。\n\n**Peter Cashen** 是英国的科技顾问，通过自己的公司 Kloud 365 Ltd 工作，自 1990 年代末以来专注于终端用户计算。他参与微软技术超过\

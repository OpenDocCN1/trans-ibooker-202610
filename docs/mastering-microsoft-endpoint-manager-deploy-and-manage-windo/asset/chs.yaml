  \ Windows Autopilot 设备的场景。\n\n> **Important Note**\n> 如果 **Windows Defender Application\
  \ Control (WDAC)** 配置为由 Microsoft 的 Intelligent Security Graph 确定应用声誉，Autopilot\
  \ Reset 可能会失败。\n\nWindows Autopilot Reset 在同一用户需要再次重复使用设备时具有很好的设备重置用例，在其他场景下也有其他选项可用。在下一节中，我们将介绍擦除和重置。\n\
  \n## Wiping and resetting your devices\n\n出厂重置会将设备恢复为默认设置。这会从该设备中删除所有个人和公司数据及设置。你可以选择是否保留设备的注册状态和与该设备关联的用户账户。此操作无法撤消。你确定要重置此设备吗？以下是可供你选择的选项：\n\
  \n- **Wipe device, but keep enrollment state and associated user account.**\n- **Wipe\
  \ device, and continue to wipe even if device loses power. If you select this option,\
  \ please be aware that it might prevent some Windows 10 devices from starting up\
  \ again..**\n\n此选项可确保即使关闭设备也无法规避擦除操作。此选项将一直尝试重置设备直至成功。在某些配置中，此操作可能会导致设备无法重新启动。\n\
  \n此问题可能是由于 Windows 安装存在严重损坏，导致操作系统无法重新安装而引起的。在这种情况下，流程会失败并使系统停留在 Windows Recovery\
  \ Environment 中：\n\n**Wipe - APTEST01**\nFactory reset returns the device to its\
  \ default settings. This removes all personal and company data and settings from\
  \ this device. You can choose whether to keep the device enrolled and the user account\
  \ associated with this device. You cannot revert this action. Are you sure you want\
  \ to reset this device?\n☐ Wipe device, but keep enrollment state and associated\
  \ user account\n☐ Wipe device, and continue to wipe even if device loses power.\
  \ If you select this option, please be aware that it might prevent some Windows\
  \ 10 devices from starting up again.\n[Yes] [No]\n\nFigure 7.41 – Windows device\
  \ wipe\n\n- Wipe device, but keep enrollment state and associated user account：\n\
  \n| Retained during a wipe | Not retained |\n|---|---|\n| User accounts associated\
  \ with the device | User files |\n| Machine state (domain join, AAD-joined) | User-installed\
  \ apps (store and Win32 apps) |\n| MDM enrollment | Non-default device settings\
  \ |\n| OEM-installed apps (store and Win32 apps) |  |\n| User profile |  |\n| User\
  \ data outside of the user profile |  |\n| User auto logon |  |\n\n## Fresh start\n\
  \n清理设备将删除所有预装的 Win32 应用。你可以选择是否保留设备上的用户数据以及是否确定要清理设备：\n\nFresh Start - APTTEST01\n\
  Cleaning this device will remove all preloaded Win32 apps. You can choose whether\

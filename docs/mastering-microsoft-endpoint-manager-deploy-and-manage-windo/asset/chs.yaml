  \ tBUrOYwUmzOEQnbYO=\" />\n<p n=\"DiskSSNKernel\" v=\"|Virtual Disk |Msft \" />\n\
  </HardwareInventory>\n</HardwareReport>\n```\n\nOEM 激活工具 3.0 已成功完成其所需进程。\n\n\n\n\
  \n\n# 适用于现有设备的 Windows Autopilot\n\n如果你不想将设备收集并上传到 Autopilot，还有其他一些选项可供选择。\n\n对于已在\
  \ Intune 中的设备（可以是 Azure AD 加入的设备或共同管理的设备），你可以利用 Autopilot 配置文件中的“将所有目标设备转换为 Autopilot”选项：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_252_0.png)\n\n图 7.12 – 将所有目标设备转换为 Autopilot\n\
  \n选择“是”以将所有目标设备注册到 Autopilot（如果尚未注册）。下次已注册设备经历 Windows OOBE 时，它们将按照分配的 Autopilot\
  \ 场景进行。\n\n请注意，某些 Autopilot 场景需要特定最低版本的 Windows。请确保你的设备满足执行该场景所需的最低版本。\n\n删除此配置文件不会从\
  \ Autopilot 中移除受影响的设备。要从 Autopilot 中移除设备，请使用 Windows Autopilot 设备视图。\n\n你还可以通过从\
  \ System Center Configuration Manager (SCCM) 或 Microsoft Deployment Toolkit (MDT)\
  \ 执行传统操作系统部署，来为现有设备利用 Windows Autopilot。\n\n你只需将 Autopilot 配置文件放在 `%windir%\\provisioning\\\
  AutoPilot\\AutopilotConfigurationFile.json` 中。\n\n在 Microsoft Intune 中创建 Autopilot\
  \ 配置文件后，你可以利用 WindowsAutopilotIntune PowerShell 模块导出它：\n\n```\nInstall-Module WindowsAutopilotIntune\
  \ -Force\nInstall-Module Microsoft.Graph.Intune -Force\nConnect-MSGraph\nGet-Autopilotprofile\n\
  ```\n\n你将获得租户中所有 Autopilot 配置文件的列表。以下是一个示例。我们将利用 ID 获取它，并将其转换为所需的 JSON 内容：\n\n```\n\
  @odata.type                     : #microsoft.graph.\nazureADWindowsAutopilotDeploymentProfile\n\
  id                              : 264c05b0-683c-4537-87ff-\n1ff5151d5b98\ndisplayName\
  \                : Intune Book\ndescription                 :\nlanguage        \
  \            : os-default\ncreatedDateTime            : 4/10/2021 9:59:13 AM\nlastModifiedDateTime\
  \       : 4/10/2021 9:59:13 AM\nenrollmentStatusScreenSettings :\nextractHardwareHash\
  \        : True\ndeviceNameTemplate         : OSD-%RAND:5%\ndeviceType         \
  \        : windowsPc\nenableWhiteGlove          : True\nroleScopeTagIds        \
  \    : {0}\noutOfBoxExperienceSettings : @{hidePrivacySettings=True; hideEULA=True;\
  \ userType=standard; deviceUsageType=singleUser; skipKeyboardSelectionPage=True;\
  \ hideEscapeLink=True}\n```\n\n使用唯一的 Autopilot 配置文件 ID 调用命令时，你可以将其转换为在 Windows 设备映像处理过程中所需的\
  \ JSON 文件：\n\n```\nGet-Autopilotprofile -id 264c05b0-683c-4537-87ff-1ff5151d5b98\
  \ | ConvertTo-AutopilotconfigurationJSON\n{\n    \"CloudAssignedDomainJoinMethod\"\
  : 0,\n    \"CloudAssignedDeviceName\": \"OSD-%RAND:5%\",\n    \"CloudAssignedAutopilotUpdateTimeout\"\
  : 1800000,\n    \"CloudAssignedForcedEnrollment\": 1,\n    \"Version\": 2049,\n\
  \    \"CloudAssignedTenantId\": \"c56dd45b-1da6-4bd0-a53b-1466782d6ee5\",\n    \"\
  CloudAssignedAutopilotUpdateDisabled\": 1,\n    \"ZtdCorrelationId\": \"264c05b0-683c-4537-87ff-1ff5151d5b98\"\
  ,\n    \"Comment_File\": \"Profile Intune Book\",\n    \"CloudAssignedAadServerData\"\
  : \"{\\\"ZeroTouchConfig\\\":{\\\"CloudAssignedTenantUpn\\\":\\\"\\\",\\\"ForcedEnrollment\\\
  \":1,\\\"CloudAssignedTenantDomain\\\":\\\"osddeployment.dk\\\"}}\",\n    \"CloudAssignedOobeConfig\"\
  : 1310,\n    \"CloudAssignedTenantDomain\": \"osdeployment.dk\",\n    \"CloudAssignedLanguage\"\
  : \"os-default\"\n}\n```\n\n然后，你可以将 Autopilot 配置文件的内容复制到记事本，并将其保存为 `AutopilotConfigurationFile.json`。\n\
  \nWindows 设备可以通过 Configuration Manager 使用适用于现有设备的 Autopilot 进行注册时，通过关联 ID 进行分组。关联\
  \ ID 是 Autopilot 配置文件的一个参数。Azure AD 设备属性 `enrollmentProfileName` 会自动设置为 `OfflineAutopilotprofile-<correlator\
  \ ID>`。因此，可以使用 `enrollmentProfileName` 属性，根据关联 ID 创建任意 Azure AD 动态组。\n\n要创建 Windows\
  \ Autopilot 配置文件，请执行以下步骤：\n\n- 1. 在 Microsoft Endpoint Manager 管理中心（https://endpoint.microsoft.com/）中，选择“设备”|“Windows”|“Windows\
  \ 注册”|“部署配置文件”。\n- 2. 然后，选择“创建配置文件”|“Windows PC”。\n- 3. 在“输入配置文件名称”字段中，输入“Autopilot\
  \ 默认配置文件”。\n- 4. 将“将所有目标设备转换为 Autopilot”设置为“否”。\n  选择“是”以将所有目标设备注册到 Autopilot（如果尚未注册）。下次已注册设备经历\
  \ Windows OOBE 时，它们将按照分配的 Autopilot 场景进行。\n- 5. 除非你有理由更改，否则将所有其他设置保留为默认值。\n\n在 OOBE\
  \ 步骤中，配置以下值，然后单击“下一步”：\n\n| 设置 | 值 |\n|---|---|\n| 部署模式 | 用户驱动。 |\n| 加入 Azure AD\
  \ 为 | 已加入 Azure AD。 |\n| Microsoft 软件许可条款 | 隐藏。 |\n| 隐私设置 | 隐藏。 |\n| 隐藏更改帐户选项 |\
  \ 隐藏。 |\n| 用户帐户类型 | 标准。 |\n| 允许 White Glove OOBE | 否。 |\n| 语言（区域） | 操作系统默认值。 |\n\
  | 自动配置键盘 | 是。 |\n| 应用设备名称模板 | 你可以选择应用设备名称模板。使用一个有助于你通过此配置识别设备的前缀，例如：`OSD-%RAND:x%`\
  \ |\n\n> **重要说明**\n> **语言（区域）** 需要在进行 OOBE 时具备以太网连接才能生效；否则，此 OOBE 向导将显示给最终用户。操作系统默认值仅在操作系统为单操作系统时才会生效，因此，例如，如果操作系统同时为\
  \ en-US 和 nl-NL，则不会显示此 OOBE 向导页面。\n> \n> **自动配置键盘** 需要在进行 OOBE 时具备以太网连接才能生效；否则，此\
  \ OOBE 向导将显示给最终用户。\n\n如果在 OOBE 阶段设备上存在 unattended.xml 文件，Windows Autopilot 很可能会失败，因此，如果你正在对现有设备进行映像部署，请确保这些文件不存在于\
  \ `%WINDIR%\\Panther\\Unattend unattended.xml` 和 `%WINDIR%\\Panther\\unattend.xml`\
  \ 中。\n\n## 在开箱体验 (OOBE) 期间的 Windows 更新\n\nIT 管理员不能选择退出这些关键更新，因为它们是 Windows Autopilot\
  \ 预配的一部分，设备需要这些更新才能正常运行。\n\n在用户连接到网络后，关键驱动程序更新和关键 Windows **零日补丁 (ZDP)** 更新将在 OOBE\
  \ 期间自动开始下载。此后，Autopilot 功能更新和关键更新也会自动下载并安装。\n\n在此 OOBE 阶段，不会更新功能更新和质量更新。\n\nWindows\
  \ 将提醒用户设备正在检查和应用更新：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_256_0.png)\n\n图\
  \ 7.13 – Windows 在 OOBE 期间检查更新\n\n> **重要说明**\n> \n> 如果你使用未集成任何驱动程序的自定义映像，Windows\
  \ 可以在此过程中下载驱动程序，但可能会发生重新启动，从而中断 Windows Autopilot 体验。对于 Windows Autopilot，建议对新设备使用\
  \ OEM 映像，对现有设备使用带正确驱动程序的自定义映像；在测试适用于现有设备的 Windows Autopilot 时，也应如此，以获得最接近新设备的体验。\n\
  \n## 在 Intune 中自动分配 Windows Autopilot 配置文件\n\n从 Microsoft Intune 将 Autopilot 配置文件分配给设备有两种方式：静态\
  \ Azure AD 组或动态 Azure AD 组。静态组无法提供你在企业中想要的自动化，因此在本节中，我们将指导你完成自动配置文件分配。\n\nZTDID\
  \ 是 Windows Autopilot 服务中设备的唯一标识符。ZTDID 和组标签都是 Azure AD 设备对象上的属性。组标签是在将设备上传到 Windows\
  \ Autopilot 时，你可以放入 CSV 中的值，并且这个值你可以自行选择。使用你创建的组标签，你可以利用组标签将 Autopilot 设备分组用于特定目的，例如信息工作者、共享设备、Microsoft\
  \ Teams 会议室系统、自助服务终端设备或其他用途。如果你希望设备对象位于不同的 AD 动态设备组中，稍后可以更改 Autopilot 对象中的组标签。请记住在\
  \ Autopilot 设备边栏选项卡中单击“同步”；否则，你需要等待更改，直到后台运行同步。\n\n你将拥有标准信息——设备序列号、Windows 产品 ID、硬件哈希——因此你只需创建一个名为\
  \ `OrderID` 的自定义列，并使用你想要用于创建 Autopilot 动态组以进行配置文件分配的值，例如 `EdgeKIOSK`。\n\n将 Autopilot\
  \ 信息导入 Microsoft Intune 后，你可以使用 Microsoft Graph Explorer 通过刚创建的信息查看设备。你需要查找 Azure\
  \ AD 设备对象，因为 Microsoft Intune 设备对象是在 Windows 在 Microsoft Intune 中执行移动设备管理 (MDM)\
  \ 注册时首次创建的。\n\n转到 Graph Explorer：https://developer.microsoft.com/en-us/graph/graph-explorer：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_257_0.png)\n\n图 7.14 – Graph Explorer\n\
  \n\n\n\n\n# 登录到 Graph Explorer\n\n输入 `https://graph.microsoft.com/v1.0/devices`\
  \ 以获取所有设备——然后你可以找到刚刚创建的设备并看到它具有 ZTDID，且具有唯一值，并且在 Graph 中 Group Tag 显示为 OrderID。你也可以在末尾加上\
  \ ID 运行 graph 调用，只获取单个设备的值：`https://graph.microsoft.com/v1.0/devices/[id]`。数据存储在一个名为\
  \ physicalIds 的多值属性中：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_258_0.png)\n\n\
  *Figure 7.15 – Graph Explorer devices*\n\n然后，你可以在 graph 中的设备对象上找到 `physicalIds`\
  \ 作为属性，以验证 AzureAD 设备对象上是否存在 ZTDID – ZTDID 表示它是 Autopilot 对象。你还可以看到 OrderID（OrderID\
  \ 与 Microsoft Endpoint Manager 管理中心中的 Group Tag 相同）：\n\n```\n```json\n\"physicalIds\"\
  : [\n    \"[HWID]:h:6755414090630361\",\n    \"[ZTDID]:able4d57-66e5-4143-bb43-753be871075f\"\
  \n]\n```\n```\n\n```\n\" [OrderId] :EdgeKIOSK\",\n\" [USER-HWID] :44cd8da3-8f37-49e0-aa01-93c7179969d1:6755414090630361\"\
  ,\n\" [GID] :g:6825777827713522\",\n\" [USER-GID] :44cd8da3-8f37-49e0-aa01-93c7179969d1:6825777827713522\"\
  ,\n],\n```\n\n现在我们拥有了创建两个动态 AAD 组所需的所有信息，一个用于所有 Autopilot 设备，一个用于 EdgeKIOSK。\n\n\
  我们将创建三个动态组，以便区分不同的 Windows Autopilot 场景。我们将组命名为 All AutoPilot Devices、All AutoPilot\
  \ EdgeKIOSK 和 All AutoPilot JSON。\n\n在 Microsoft Endpoint Manager 管理中心，https://endpoint.microsoft.com/，选择\
  \ Groups。\n\n选择 New Group。\n\n在 Group name 字段中输入以下内容：All Autopilot Devices。\n\n\
  选择 Dynamic Device 作为 Membership type：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_259_0.png)\n\
  \nFigure 7.16 – New AAD device group\n\n第一个组 **All AutoPilot Devices** 具有如下的动态组成员资格规则：\n\
  \n```\n```text\n(device.devicePhysicalIDs -any _ -contains \"[ZTDId]\") -and -not\n\
  (device.devicePhysicalIDs -any _ -eq \"[OrderID]: EdgeKIOSK\")\n```\n```\n\n此规则将找到所有具有\
  \ ZTDID 的设备，并排除 OrderID 的值为 EdgeKIOSK 的所有设备：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_260_0.png)\n\
  \n*Figure 7.17 – AAD group Autopilot rule syntax*\n\n第二个组 **All AutoPilot EdgeKIOSK**\
  \ 具有如下的动态组成员资格规则： `(device.devicePhysicalIDs -any _ -eq \"[OrderID]: EdgeKIOSK\"\
  )`。\n\n此规则将找到所有 OrderID 的值等于 EdgeKIOSK 的设备。\n\n你也可以仅使用 PowerShell 创建 AAD 动态组：\n\n\
  ```\n```powershell\nInstall-Module AzureAD\n$AzureAdCred = Get-Credential\nConnect-AzureAD\
  \ -Credential $AzureAdCred\n# Create a dynamic group called \"All AutoPilot Devices\"\
  \nNew-AzureADMSGroup -Description \"All AutoPilot Devices\"\n-DisplayName \"All\
  \ AutoPilot Devices\" -MailEnabled $false\n-SecurityEnabled $true -MailNickname\
  \ \"Win\" -GroupTypes\n\"DynamicMembership\" -MembershipRule \"(device.devicePhysicalIDs\n\
  -any _ -contains \\\"[ZTDId]\\\") -and -not (device.\ndevicePhysicalIDs -any _ -eq\
  \ \\\"[OrderID]:SharedDevice\\\")\"\n-MembershipRuleProcessingState \"On\"\n# Create\
  \ a dynamic group called \"All AutoPilot EdgeKIOSK\"\n```\n```\n\n```\nNew-AzureADMSGroup\
  \ -Description \"All AutoPilot EdgeKIOSK\" -DisplayName \"All AutoPilot EdgeKIOSK\"\
  \ -MailEnabled $false -SecurityEnabled $true -MailNickname \"Win\" -GroupTypes \"\
  DynamicMembership\" -MembershipRule \"(device.devicePhysicalIds -any _ -eq \"[OrderID]:EdgeKIOSK\"\
  )\" -MembershipRuleProcessingState \"On\"\n```\n\n```\n# Create a dynamic group\
  \ called \"All AutoPilot JSON\"\n```\n\n```\nNew-AzureADMSGroup -Description \"\
  All AutoPilot JSON\" -DisplayName \"All AutoPilot JSON\" -MailEnabled $false -SecurityEnabled\
  \ $true -MailNickname \"Win\" -GroupTypes \"DynamicMembership\" -MembershipRule\
  \ \"(device.enrollmentProfileName -eq \"OfflineAutopilotprofile-264c05b0-683c-4537-87ff-1ff5151d5b98\"\
  )\" -MembershipRuleProcessingState \"On\"\n```\n\n现在你已将硬件信息导入到 Windows Autopilot，并创建了配置注册状态页所需的所有组。\n\
  \n# 注册状态页 ESP\n\n许多人认为 ESP 和 Windows Autopilot 是同一回事。那并不完全正确，因为 ESP 是 Windows 的核心功能，可以作为\
  \ Windows CSP 设置。\n\nESP 可作为任何 Windows Autopilot 配置场景的一部分使用。它也可以与 Windows Autopilot\
  \ 分开使用，作为 AAD 加入的默认 OOBE 的一部分，以及任何新用户首次登录设备时使用。\n\n基本上，这意味着任何在 OOBE 阶段加入 AAD 的 Windows\
  \ 10 设备都会向最终用户显示 ESP，无论它是否是 Windows Autopilot 设备，只要用户或设备分配了 ESP 即可。\n\n你可以创建多个具有不同配置的\
  \ ESP 配置文件，指定以下内容：\n\n- 显示安装进度\n- 在配置过程完成前阻止访问\n- 时间限制\n- 允许的故障排除操作\n\n我们将在本节中向你展示如何执行此操作，并在后面的章节中介绍\
  \ Windows Autopilot 亭场景。\n\n# ESP 实现 Windows CSP\n\nESP 使用 `EnrollmentStatusTracking`\
  \ **配置服务提供程序 CSP** 和 `FirstSyncStatus` CSP 来跟踪不同应用的安装：\n\n- `EnrollmentStatusTracking`\
  \ CSP：`/Vendor/MSFT/EnrollmentStatusTracking`。\n- `EnrollmentStatusTracking` CSP：Windows\
  \ Client Management | Microsoft Docs（`https://docs.microsoft.com/en-us/windows/client-management/mdm/enrollmentstatustracking-csp`）。\n\
  - `EnrollmentStatusTracking` CSP 在 Windows 10 版本 1903 及更高版本中受支持。\n- `EnrollmentStatusTracking`\
  \ CSP 用于跟踪 Microsoft Intune 管理扩展和 Microsoft Intune Win32 应用的安装，这些应用针对的是被 ESP 阻止的目标设备和/或用户。\n\
  - `FirstSyncStatus` CSP：`/Vendor/MSFT/DMClient/Provider/ProviderID/FirstSyncStatus`。\n\
  - DMClient CSP – Windows Client Management | Microsoft Docs（`https://docs.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp`）。\n\
  - `FirstSyncStatus` CSP 在 Windows 10 版本 1709 及更高版本中受支持。\n- `FirstSyncStatus` CSP\
  \ 负责将 ESP CSP 有效负载从 Microsoft Intune 传递到 Windows 10 客户端。有效负载包括 ESP 设置，例如超时时间和需要安装的应用。它还传递预期的\
  \ MSI（业务线）应用、Microsoft Store for Business 应用、Wi-Fi 配置文件和 SCEP 证书配置文件，以及 Microsoft\
  \ Edge、分配访问和 Kiosk Browser 的策略。\n\n我们将按以下步骤查看创建 ESP 的方法：\n\n1. 通过启动 Microsoft Endpoint\
  \ Manager 管理中心，`https://endpoint.microsoft.com/`，并选择 **Devices | Windows | Windows\
  \ enrollment | Enrollment Status Page** 创建第一个 ESP。\n2. 在 **Settings** 下选择一个配置文件。\n\
  3. 选择 **Yes** 用于 **Show app and profile installation progress**。\n4. 选择 **Yes**\
  \ 用于 **Block device use until all apps and profiles are installed**。\n5. 选择 **Selected**\
  \ 用于 **Block device use until these required apps are installed if they're assigned\
  \ to the user/device**。\n6. 选择 **Select apps**，然后选择 **Select | Save** 用于应用。\n\n\
  在 **Settings** 步骤中，配置以下值然后单击 **Next**：\n\n| Setting | Value |\n|---|---|\n| Show\
  \ app and profile configuration process | Yes |\n| Show an error when installation\
  \ takes longer than the specified number of minutes | 60 |\n| Show custom message\
  \ when time limit error occurs | Yes (you may modify the default message) |\n| Allow\
  \ users to collect logs about installation errors | Yes |\n| Only show page to devices\
  \ provisioned by out-of-box experience (OOBE) | Yes |\n| Block device user until\
  \ all apps and profiles are installed | Yes |\n| Allow users to reset the device\
  \ if an installation error occurs | Yes |\n| Allow users to use the device if an\
  \ installation error occurs | No |\n| Block device user until these required apps\
  \ are installed if they are assigned to the user/device | All or select up to 100\
  \ apps |\n\n现在我们已经了解了如何创建注册页面，让我们继续学习 Autopilot 报告和诊断。\n\n# Autopilot 报告和诊断\n\n\
  以管理员身份运行 cmd.exe，然后你可以运行 MdmDiagnosticsTool 来获取本地设备的日志：\n\n```\nC:\\windows\\system32\\\
  MdmDiagnosticsTool.exe -area Autopilot -cab\nC:\\temp\\MdmDiagnostics.cab\n```\n\
  \n然后你将获得 MdmDiagnostics.cab 文件，你可以将其内容提取到文件夹中以访问内容：\n\n```\nAgentExecutor-20210331-083241.log\n\
  AgentExecutor.log\nClientHealth.log\nDeviceHash_DESKTOP-86N3?3H3.csv\nDiagnosticLogCSP_Collector_Autopilot.etl\n\
  ```\n\n\n\n\n\n- DiagnosticLogCSP_Collector_DeviceEnrollment.etl\n- DiagnosticLogCSP_Collector_DeviceProvisioning_2021_1_31_20_4_38.etl\n\
  - DiagnosticLogCSP_Collector_DeviceProvisioning_2021_2_11_4_18_29.etl\n- DiagnosticLogCSP_Collector_DeviceProvisioning_2021_2_24_19_11_54.etl\n\
  - DiagnosticLogCSP_Collector_DeviceProvisioning_2021_3_13_3_31_33.etl\n- IntuneManagementExtension-20210228-125401.log\n\
  - IntuneManagementExtension-20210319-102847.log\n- IntuneManagementExtension.log\n\
  - LicensingDiag.cab\n- LicensingDiag_Output.txt\n- MdmDiagLogMetadata.json\n- MdmDiagReport_RegistryDump.reg\n\
  - MdmLogCollectorFootPrint.txt\n- microsoft-windows-aad-operational.evtx\n- microsoft-windows-appxdeploymentserver-operational.evtx\n\
  - microsoft-windows-assignedaccess-admin.evtx\n- microsoft-windows-assignedaccess-operational.evtx\n\
  - microsoft-windows-assignedaccessbroker-admin.evtx\n- microsoft-windows-assignedaccessbroker-operational.evtx\n\
  - microsoft-windows-crypto-ncrypt-operational.evtx\n- microsoft-windows-devicemanagement-enterprise-diagnostics-provider-admin.evtx\n\
  - microsoft-windows-devicemanagement-enterprise-diagnostics-provider-debug.evtx\n\
  - microsoft-windows-devicemanagement-enterprise-diagnostics-provider-operational.evtx\n\
  - microsoft-windows-moderndeployment-diagnostics-provider-autopilot.evtx\n- microsoft-windows-moderndeployment-diagnostics-provider-managementservice.evtx\n\
  - microsoft-windows-provisioning-diagnostics-provider-admin.evtx\n- microsoft-windows-provisioning-diagnostics-provider-autopilot.evtx\n\
  - microsoft-windows-provisioning-diagnostics-provider-managementservice.evtx\n-\
  \ microsoft-windows-shell-core-operational.evtx\n- microsoft-windows-user device\
  \ registration-admin.evtx\n- Sensor-20210105-105450.log\n- Sensor-20210207-191747.log\n\
  - Sensor.log\n- setupact.log\n- TpmHliInfo_Output.txt\n- _IntuneManagementExtension.log\n\
  \n从 MDM 诊断工具中获得的最重要的信息如下：\n\n```\nRegistry Dump\nMdmDiagReport_RegistryDump.reg\
  \ captures the\nHKEY_LOCAL_MACHINE\nHKEY_CURRENT_USER\nRegistry values associated\
  \ with autopilot device provisioning are written to HKEY_LOCAL_MACHINE\\SOFTWARE\\\
  Microsoft\\Provisioning\\Diagnostics\\AutoPilot\n\nHKEY_CURRENT_USER\\software\\\
  microsoft\\enterprisemodernappmanagement and HKEY_LOCAL_MACHINE\\software\\microsoft\\\
  enterprisemodernappmanagement\n```\n\n在 Microsoft Endpoint Manager 管理中心进行报告的情况下，流程如下。\n\
  \n在 Microsoft Endpoint Manager 管理中心，https://endpoint.microsoft.com/，选择 设备 | 监视 |\
  \ Autopilot 部署（预览）。\n\n您可以查看最近 30 天的 Windows Autopilot 部署：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_265_0.png)\n\
  \n图 7.18 – Autopilot 报告\n\n您可以查看以下属性：\n\n- **注册日期**\n- **注册方法**\n- **序列号**\n- **设备名称**\n\
  - **用户**\n- **Autopilot 配置文件**\n- **注册状态页部署状态**\n- **部署总时间**\n\n## Company Portal\n\
  \nCompany Portal 是面向终端用户的自助服务工具，以便他们可以安装 IT 管理员已为终端用户提供的应用。\n\n对于 Windows 10 Autopilot\
  \ 部署的设备，建议您将 Microsoft Store for Business 账户与 Intune 关联。Company Portal 应用将在分配给 Autopilot\
  \ 组时以设备上下文安装，并在用户登录前安装到设备上。您可以使用以下步骤选择安装 Company Portal（离线）应用：\n\n- 1. 在 Microsoft\
  \ Endpoint Manager 管理中心，`https://endpoint.microsoft.com/`，选择 **应用 | Windows**。\n\
  - 2. 从 Windows 应用列表中，选择 **Company Portal**（离线）。\n- 3. 将 Company Portal 作为必需应用分配给您选择的\
  \ Autopilot 设备组。\n- 4. 由于这是一个离线应用，请确保将 **许可证类型**更改为 **设备许可**。\n\n## 为 Autopilot\
  \ 设备配置自动 BitLocker 加密\n\n使用 Windows Autopilot，可以在自动加密开始前配置 BitLocker 加密设置。此配置可确保默认加密算法不会自动应用。在自动\
  \ BitLocker 加密开始前也可以应用其他 BitLocker 策略。\n\nBitLocker 自动设备加密使用 BitLocker 驱动器加密技术，在用户完成\
  \ *Modern Standby* 或符合 **硬件安全可测试性规范 (HSTI)** 的硬件上的 OOBE 后自动加密内部驱动器。\n\n在 Modern\
  \ Standby 要求或 HSTI 验证的情况下，此要求通过以下其中一种方式满足：\n\n- 已实施 Modern Standby 要求。这些要求包括 **统一可扩展固件接口\
  \ (UEFI)** 安全启动要求和防止未经授权的 **直接内存访问 (DMA)** 保护。\n- 从 *Windows 10 版本 1703* 开始，此要求可通过\
  \ HSTI 测试满足。\n- 平台安全启动自检（或在注册表中配置的其他自检）必须由 HSTI 报告为已实施并通过。\n- 除 Thunderbolt 外，HSTI\
  \ 必须不报告任何不允许的 DMA 总线。\n- 如果存在 Thunderbolt，HSTI 必须报告 Thunderbolt 已安全配置（安全级别必须为 SL1\
  \ – *用户授权* 或更高）。\n\n*Windows 10（Modern Standby）* 扩展了 *Windows 8.1 Connected Standby\
  \ 电源模型*。Connected Standby，进而 Modern Standby，使能类似智能手机电源模型的即时开启/即时关闭用户体验。就像手机一样，S0\
  \ 低功耗空闲模型使系统在低功耗模式下仍可连接到网络。\n\n通过利用 `powercfg /a` 命令，您可以查看设备是否支持 Modern Standby（S0\
  \ 低功耗空闲）：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_267_0.png)\n\n图 7.19 – powercfg\n\
  \n## 重要说明\n\nBitLocker 自动设备加密在 OOBE 体验期间开始。但是，BitLocker 驱动器保护仅在用户使用 AAD 账户登录后启用。在此之前，保护处于暂停状态，数据未受保护。\n\
  \nBitLocker 加密算法在 BitLocker 首次启用时使用。该算法为全卷加密设置强度。可用加密算法为 AES-CBC 128 位、AES-CBC 256\
  \ 位、XTS-AES 128 位和 XTS-AES 256 位加密。BitLocker 将使用默认加密方法 XTS-AES 128 位或任何设置脚本指定的加密方法。\n\
  \n要确保在 Autopilot 设备的自动加密发生前设置您想要的 BitLocker 加密算法，请确保满足以下要求：\n\n- 设备包含 **受信任平台模块\
  \ (TPM)**，TPM 1.2 或 TPM 2.0。\n- 已启用 UEFI 安全启动。\n- 已启用平台安全启动。\n- 已启用 DMA 保护。\n- 在\
  \ Windows 10 Endpoint Protection 配置文件中配置 **加密方法** 设置为您想要的加密算法。\n- 将策略分配给您的 Autopilot\
  \ 设备组。加密策略必须分配给组中的设备，而不是用户。\n- 为这些设备启用 Autopilot ESP。如果未启用 ESP，则策略不会在加密开始前应用。\n\n\
  ## 重要说明\n\n当您启用 EncryptionMethodByDriveType 时，必须为所有三个驱动器（操作系统、固定数据和可移动数据）指定值；否则将失败（500\
  \ 返回状态）。例如，如果您仅为操作系统和可移动驱动器设置加密方法，您将收到 500 返回状态。\n\n按如下方式在 Intune 中创建用于自动 BitLocker\
  \ 加密的 BitLocker 策略：\n\n- 1. 在 Microsoft Endpoint Manager 管理中心，`https://endpoint.microsoft.com/`，选择\
  \ **设备 | Windows | 配置配置文件**。\n- 2. 选择 **创建配置文件**。\n- 3. 选择 **平台 | Windows 10 及更高版本**。\n\
  - 4. 选择 **配置文件类型 | 模板 | 模板名称 | Endpoint Protection**。\n- 5. 选择 **名称 | Autopilot\
  \ Bitlocker | 下一步**。\n- 6. 展开 **Windows 加密**。\n- 7. 选择 **Windows 设置 | 加密设备 | 要求**。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_269_0.png)\n\nBitLocker 基础设置应如下所示：\n\n\
  - 1. 选择 **BitLocker 基础设置 | 其他磁盘加密的警告 | 阻止**。\n\n  选择 **阻止** 将禁用 BitLocker 配置提示和其他磁盘加密的警告提示。阻止是自动\
  \ BitLocker 加密设备的需要。\n- 2. 选择 **允许标准用户在 Azure AD 加入期间启用加密 | 允许**。\n\n  将此设置设为 **允许**\
  \ 时，即使用户不是本地管理员，也可让终端用户自动加密设备。\n- 3. 对于 **配置加密方法**，选择您的组织所需的内容。Windows 默认值为 **XTS-AES\
  \ 128 位**，这也是 Windows 安全基线中推荐的值：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_269_1.png)\n\
  \n\n\n\n\nBitLocker 操作系统驱动器设置如下：\n\n1. 选择 **启动时需要额外身份验证 | 要求**。\n\n   BitLocker\
  \ 操作系统驱动器设置\n\n   启动时需要额外身份验证\n\n   要求\n\n   未配置\n\n   图 7.22 – BitLocker 操作系统驱动器设置\n\
  \n2. 选择 **操作系统驱动器恢复 | 启用**。\n\n3. 选择 **将 BitLocker 恢复信息保存到 Azure Active Directory\
  \ | 启用**。\n\n4. 启用将 BitLocker 恢复信息存储在设备对象上的 AAD 中，以便最终用户可以在他们是主要用户的设备上自行检索。具有相应权限的\
  \ AAD 管理员始终可以检索 BitLocker 恢复密钥。\n\n5. 选择 **在启用 BitLocker 之前将恢复信息存储在 Azure Active\
  \ Directory 中 | 要求**。这将防止用户在计算机成功将 BitLocker 恢复信息备份到 AAD 之前启用 BitLocker。选择 **要求**\
  \ 将确保在启用加密之前恢复密钥已成功存储在 AAD 中：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_270_0.png)\n\
  \n图 7.23 – BitLocker 存储恢复信息\n\n> **重要说明**\n> \n> 如果在 Hyper-V 或任何其他虚拟平台上测试 Autopilot\
  \ 和 BitLocker 加密，我们建议分配 2–4 GB 的内存和 2–4 个虚拟 CPU。\n\n6. 要使自动 BitLocker 加密正常工作，您需要为虚拟设备启用\
  \ **可信平台模块**：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_271_0.png)\n\n在 Hyper-V\
  \ 等虚拟设备上测试时，您可能会遇到与在物理设备上测试时不同的行为。\n\n要以简单的方式开始测试 Autopilot，已经有一个名为云配置的指导场景在 Microsoft\
  \ Intune 中。此内容将在下一节中介绍。\n\n## 云配置场景\n\n您可以在云配置中部署 Windows 10。在 Microsoft Endpoint\
  \ Manager 管理中心，https://endpoint.microsoft.com/，选择 **疑难解答 + 支持 | 指导场景（预览）**。\n\n\
  使用简单、安全、标准化的配置，优化您的 Windows 10 设备以适应云端，满足您的需求：\n\n1. 在 **以云配置部署 Windows 10** 指导场景中选择\
  \ **开始**。\n2. 在介绍中，选择 **下一步**。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_272_0.png)\n\
  \n图 7.25 – 指导场景\n\n### 介绍\n\nWindows 10 云配置有助于为具有专注工作流程需求的用户标准化并简化设备管理。您可以使用云配置来配置新设备，或重新利用和延长现有硬件的使用寿命。它适用于任何\
  \ Windows 10 Pro、Windows 10 Enterprise 或 Windows 10 Education 设备。现在让我们了解更多并评估云配置。\n\
  \n以下指导工作流可轻松部署云配置概述和设置指南中推荐的应用程序和设备配置。\n\n### 此配置适用于谁？\n\nWindows 10 云配置专为设备用户设计，他们的需求较为简化，例如生产力和浏览。理想的候选用户是组织中以下用户组：\n\
  \n- 那些使用 IT 为其工作流程需求精选的一组专注应用程序的用户，例如电子邮件、Microsoft Teams、浏览器以及必要的生产力和业务线应用程序。应用程序可以直接交付到设备或通过虚拟化交付。\n\
  - 那些在角色中成功工作不依赖本地基础设施的用户。\n- 那些使用的设备不需要复杂的设置配置或自定义代理的用户。\n- 作为管理员，您可以享受在整个组织中应用标准化设备配置的好处，从而简化管理、故障排除和设备更换。\n\
  - 最终用户可以享受熟悉的 Windows 10 体验，该体验针对云进行了优化，仅包含他们需要的应用程序和设置。\n\n### 继续所需的内容\n\n确保您已启用自动注册。您可以在\
  \ **设备 | Windows | Windows 注册 | 自动注册** 下管理自动注册设置。\n\n### 基础\n\n这是您配置 Windows Autopilot\
  \ 的步骤：\n\n1. 对于 **应用设备名称模板**，选择 **是**。\n2. 输入 Autopilot 命名模板的名称，例如 `Win-%RAND:5%`。\n\
  3. 输入资源前缀名称，例如 `CloudConfig`。\n\n### 以云配置部署 Windows 10\n\n介绍  **2 基础**  3 应用  4\
  \ 分配  5 查看 + 部署\n\n### Autopilot 设备名称模板\n\n设备将配置为使用 Windows Autopilot 注册。您可以应用设备名称模板来组织您的设备。\n\
  \n应用设备名称模板 — 否 / 是\n\n为您的设备创建唯一名称。名称必须为 15 个字符或更少，可以包含字母（a-z、A-Z）、数字（0-9）和连字符。名称不得仅包含数字。名称不能包含空格。使用\
  \ `%SERIAL%` 宏添加硬件特定的序列号。或者，使用 `%RAND:x%` 宏添加随机数字字符串，其中 x 等于要添加的位数。\n\n输入名称 * —\
  \ `Win-%RAND:5%`\n\n### 资源名称前缀\n\n为云配置创建和部署的资源命名。此页面底部的列表显示名称将在每个资源旁边出现的样式。\n\n\
  输入资源前缀名称 * — `CloudConfig`\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_274_0.png)\n\
  \n### 要创建的资源\n\n所有这些配置文件都将具有所选的前缀：\n\n- CloudConfig M365（Teams）\n- CloudConfig Microsoft\
  \ Edge\n- CloudConfig 安全基线\n- CloudConfig Autopilot 配置文件\n- CloudConfig ESP\n- CloudConfig\
  \ OneDrive 已知文件夹移动设置\n- CloudConfig Microsoft Edge 应用设置\n\n### 分配\n\n选择 **创建新组**，并为\
  \ **组名称** 选择 CloudConfig。\n\n这将创建一个空组，以便您可以将设备放入该组并根据需要测试部署：\n\n主页 > 疑难解答 + 支持 >\n\
  \n### 以云配置部署 Windows 10\n\n介绍   基础   应用   4 分配   5 查看 + 部署\n\n### 选择组\n\n- 创建新组\n\
  - 选择现有组\n\n> 我们建议将云配置分配给尚未分配其他配置文件和应用程序的设备。您可以暂时从组中删除或排除现有资源，并在部署云配置后将其添加回来。\n\n\
  组名称 * — CloudConfig\n\n图 7.28 – 云配置分配\n\n### 部署\n\n在摘要中查看您的设置并选择部署：\n\n主页 > 疑难解答\

  ## 角色和委派


  Windows 365 在 Microsoft Endpoint Manager 中提供在现有 Intune 角色之上委派访问功能和功能的能力。例如，您希望为帮助台员工提供对
  Windows 365 门户的只读访问权限，以检查 Cloud PC 是否不可用。其他示例包括将安全相关设置作为安全策略的一部分进行分离。让我在下面的表格中更深入地解释所有角色：


  | 角色 | 在 | 可以执行的操作 |

  |---|---|---|

  | 应用管理器 | Windows 365 Enterprise Cloud PC | Intune 应用管理器可以管理应用程序、读取设备信息并查看设备配置配置文件。
  |

  | Cloud PC 管理员 | Windows 365 Enterprise Cloud PC | Cloud PC 管理员可以在 MEM 中的 Cloud
  PC L2 节点中执行读取和写入操作。 |

  | Cloud PC 读者 | Windows 365 Enterprise Cloud PC | Cloud PC 读者可以在 MEM 中的 Cloud PC
  L2 节点中执行读取操作。 |

  | 端点安全管理员 | Windows 365 Enterprise Cloud PC | Intune 端点安全管理员可以管理安全和合规功能，例如安全基线、设备合规性、条件访问和
  Microsoft Defender for Endpoint，以管理其 Cloud PC。 |

  | 帮助台操作员 | Windows 365 Enterprise Cloud PC | Intune 帮助台操作员可以在 Cloud PC 上执行远程任务并将应用程序或策略分配给设备。
  |

  | Intune 管理员角色 | Windows 365 Enterprise Cloud PC | Intune 管理员角色可以将 Intune 角色（内置和自定义）分配给其他管理员，但不能分配
  Cloud PC 角色。 |

  | 策略和配置文件管理器 | Windows 365 Enterprise Cloud PC | Intune 策略和配置文件管理器可以管理 Cloud PC
  的合规策略、配置配置文件、企业设备标识符和安全基线。 |

  | 只读操作员 | Windows 365 Enterprise Cloud PC | Intune 只读操作员对所有 Intune 节点包括 Cloud PC
  节点具有只读访问权限。 |

  | 学校管理员 | Windows 365 Enterprise Cloud PC | Intune 学校管理员可以在 Intune for Education
  中管理 Windows 10 设备。 |



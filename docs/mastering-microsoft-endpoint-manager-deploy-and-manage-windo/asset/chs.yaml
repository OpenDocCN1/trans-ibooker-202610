- "## Microsoft 365 简介\n\n理解产品的核心概念是成功部署的最重要因素。在本章中，你将学习如何在利用 Microsoft 365 产品套件中其他服务的同时保持资源安全。\n\
  \n在本章中，我们将介绍以下主题：\n- Microsoft 365 服务\n- Azure Virtual Desktop 和 Windows 365\n-\
  \ Windows 10 和 Windows 11\n\n### Microsoft 365 简介\n\nMicrosoft 365 包含许多你在日常工作中可能会使用的服务，无论你是\
  \ IT 专业人员还是非技术用户。这些服务通过简化在本地环境中需要大量工作才能完成的任务，帮助你提高生产力。一个很好的例子就是我们从 Exchange Server\
  \ 向 Exchange Online 的转变。\n\n## 服务实现了什么？\n\n在本章的引言部分，我们将简要介绍与本书主题相关的 Microsoft 365\
  \ 核心服务和功能，以便对各种服务之间的差异有一个良好的基础理解。你还将了解每项服务的用途和优势。\n\n## Microsoft Endpoint Manager\n\
  \n**Microsoft Endpoint Manager (MEM)** 是 Microsoft Intune 和 **Microsoft Endpoint\
  \ Configuration Manager (MECM)** 的整合。它提供统一的整体管理体验，同时在不进行复杂迁移或影响生产力的情况下增加新功能和智能操作。\n\
  \n它提供了一系列资产来帮助你过渡到现代管理，同时提高客户的安全性并帮助他们迁移到云端。MEM 现在还包括对不同终端的<|message|> 管理功能：\n\n\
  ![](img/a3e9f26159d3739e434fe676b2987c1d_30_0.png)\n\n图 1.1 – MEM – 服务组合\n\nMEM\
  \ 帮助你管理物理和虚拟桌面、笔记本电脑、平板电脑和其他移动设备，包括 iOS、Android 和 macOS 设备。\n\nMEM 使用 **Azure Active\
  \ Directory (Azure AD)** 作为主要身份和目录存储。它取代了传统的 Active Directory，包含混合身份功能，并且可以与本地管理基础设施（如通过\
  \ Kerberos 的 Configuration Manager）集成。\n\nIntune 对于超出组策略管理范围的设备非常有帮助，例如移动电话、不是 **Active\
  \ Directory Domain Services (AD DS)** 域成员的设备，或加入 Azure AD 的 Windows 10 设备：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_31_0.png)\n\
  \n图 1.2 – MEM – 管理控制台\n\n使用 MEM，你可以实现以下目标：\n- 让组织员工使用其个人物理和虚拟终端设备访问组织数据（通常称为 **自带设备\
  \ (BYOD)**）。\n- 管理组织拥有的手机。\n- 控制从未受管设备（如公共自助终端和移动设备）访问 Microsoft 365。\n- 确保连接企业数据的设备和应用符合安全策略。\n\
  \n例如，当用户尝试在其手机或 Windows 10 终端上打开其 **业务线 (LOB)** 应用时，Microsoft 365 会与 Azure AD 检查以验证用户身份并确认该用户是否可以从该应用在该设备上访问数据。访问授权取决于以下因素：\n\
  - Azure AD 中定义的条件访问策略\n- 该设备上的应用是否符合应用配置和数据保护策略（Intune 将为 Azure AD 确认此项）\n\n如果设备和应用都符合所有策略，Azure\
  \ AD 会通知 Microsoft 365 数据可以被访问。\n\n## Azure Virtual Desktop\n\n**Azure Virtual Desktop**，简称\
  \ AVD，是 Microsoft 在 Microsoft Azure 云之上提供的托管平台即服务。与传统的 **虚拟桌面基础架构 (VDI)** 部署不同，所有基础设施服务，如代理、Web\
  \ 访问、负载均衡、管理、监控等，都作为控制平面的一部分为你设置好。\n\n## Windows 365 Cloud PC\n\n*在任何设备上体验 Windows\
  \ 的新方式*——这是描述新 Microsoft 云服务 **Windows 365 Cloud PC** 的最佳方式。Microsoft 的愿景是让人们使用\
  \ Windows 365 的方式与管理物理终端相同，但具有云的灵活性。\n\n如果你正在寻找一种简单的方式在云中运行 Windows 桌面，Windows 365\
  \ 就是你所需要的一切。你可以通过在 MEM 中部署和管理虚拟终端来降低环境成本和复杂性；无需额外的 VDI 专业知识或资源。本章后面会对此进行更详细的解释。\n\
  \n## AVD 和 Windows 365 Cloud PC – 共享责任模型\n\n与许多云服务一样，存在一组共享的安全责任。你拥有控制权和灵活性，而这也带来了责任。如果你采用\
  \ Windows 365 Cloud PC，了解这一点很重要：虽然某些组件已为你的环境预先安全配置，但仍有其他领域需要你根据组织的安全需求进行配置：\n\n\
  | 责任 | 传统 VDI | Azure Virtual Desktop | Windows 365 |\n|---|---|---|---|\n| 虚拟化管理平面\
  \ | 客户/合作伙伴 | Microsoft | Microsoft |\n| 身份平台 (Azure AD) | 客户/合作伙伴 | Microsoft |\
  \ Microsoft |\n| 平台安全 | 客户/合作伙伴 | Microsoft | Microsoft |\n| 网络 | 客户/合作伙伴 | Microsoft\
  \ | Microsoft |\n| 数据中心 | 客户/合作伙伴 | Microsoft | Microsoft |\n| 映像管理平台 (通过 MEM) |\
  \ 客户/合作伙伴 | 客户/合作伙伴 | Microsoft |\n| 操作系统更新 | 客户/合作伙伴 | 客户/合作伙伴 | 客户/合作伙伴 |\n| 终端用户设备\
  \ (物理 PC/移动) | 客户/合作伙伴 | 客户/合作伙伴 | 客户/合作伙伴 |\n\n表 1.1 – 共享责任模型 1\n\n## AVD 和 Windows\
  \ 365 Cloud PC – 共享责任模型\n\n下表是对前一表的扩展，但在管理体验的差异方面更深入：\n\n| 责任 | Azure Virtual Desktop\
  \ | Windows 365 |\n|---|---|---|\n| 身份 | Azure AD |  |\n| 终端用户设备 (移动和 PC) | Windows,\
  \ MacOS, iOS, Android, HTML, Linux SDK |  |\n| 映像管理和受支持操作系统 | Windows Server, Windows\
  \ 10, Windows 11 | Windows 10, Windows 11 |\n| 桌面 | 个人和池化桌面 | 个人桌面 |\n| 部署 | Microsoft\
  \ Azure 和 Endpoint Manager | Microsoft Endpoint Manager |\n| 配置/管理/应用部署 | Microsoft\
  \ Azure 和 Endpoint Manager | Microsoft Endpoint Manager |\n| 虚拟化控制平面 | Azure Virtual\
  \ Desktop |  |\n| 物理主机 | Microsoft Azure |  |\n| 物理网络 | Microsoft Azure |  |\n|\
  \ 物理数据中心 | Microsoft Azure |  |\n\n表 1.2 – 共享责任模型 2\n\n## Windows 10 Enterprise\n\
  \nWindows 10 Enterprise 是 Microsoft 365 订阅的主要组件之一。Windows 10 满足大型和中型组织的需求，为用户和组织提供工具、服务和支持，以提高个人和组织生产力。\n\
  \nWindows 10 还通过 Microsoft 365 应用、Microsoft Teams、Microsoft Whiteboard 和 OneNote\
  \ 支持协作。\n\nWindows 10 通过提供更快、更安全的工作方式来提高生产力，让用户在所有设备上完成工作。用户可以通过企业搜索和 Cortana 查找应用、设置、文档和消息，并使用时间线查看其活动和文档的\
  \ chronological 视图。Windows 10 的硬件选项从 Surface Hub 到新的始终连接 PC。这些选项支持用户在他们需要或偏好的任何地方工作。用户可以在\
  \ Microsoft Edge 中使用继续到 PC 功能从一个设备移动到另一个设备，或使用 Microsoft Ink 直接在网页上做笔记。Windows 10\
  \ 还提供了一套强大的辅助功能，例如旁白、单词预测和眼控。\n\nWindows 10 包含工具，可帮助你自定义设备设置、管理所有设备，并在不影响个人数据的情况下控制个人设备上的企业身份、数据和应用。通过保持\
  \ Windows 10 的最新状态来最大化安全性和生产力。更新 Windows 的方式已完全改变。过去每几年发生一次的大型升级现在已改为每年两次的更新。Windows\
  \ 即服务，Windows 10 的模式，提供了管理和分发更新所需的灵活性和控制，可以使用你当前的方法或使用 Microsoft 的基础设施。\n\nWindows\
  \ 10 可保护、检测并自动响应最先进的恶意软件和黑客威胁，同时保护用户身份、设备和组织信息。Windows 10 会在威胁演变时进行调查并自动化补救措施，从而加快响应时间，这要归功于\
  \ Intelligent Security Graph（使用安全情报、机器学习和行为分析）。这些安全解决方案内置于其中，为你提供 **终端保护** (EPP)\
  \ 和 **终端检测和响应** (EDR) 的完整安全生命周期管理。\n\n\n\n\n它还能与其他 Microsoft 365 服务集成，这些服务甚至覆盖了最复杂的多平台环境：\n\
  \n- **威胁防护：** Windows 10 威胁防护包含下一代恶意软件和黑客攻击防御，可帮助抵御包括零日攻击在内的各种威胁。它提供了一个加固平台，有助于防范攻击、隔离威胁，并阻止恶意应用和内容的执行。Windows\
  \ 10 可以检测并响应最先进的威胁，并自动修复。\n- **身份访问：** Windows 10 通过帮助你迈向无密码的世界，保护用户身份免受哈希传递和票据传递攻击。**Windows\
  \ Hello** 是一种生物识别身份验证工具，可加强身份验证，并有助于防范潜在的身份欺骗。\n- **信息保护：** Windows 10 让数据保护变得简单——无论数据处于静态还是使用中。Windows\
  \ 信息保护有助于防止敏感信息泄露。当您将 Windows 10 与 Azure 信息保护和 Microsoft 365 结合使用时，您将获得一个高度完善的解决方案，以最少的投入满足数据丢失防护的最高要求。\n\
  \n## Windows 11 企业版\n\nWindows 11 是 Windows 的下一个演进阶段；它是自 Windows 10 以来 Windows 操作系统最重要的一次更新。它提供了许多创新，专注于在灵活流畅的全新体验中提高最终用户的工作效率。Windows\
  \ 11 旨在支持当今的混合工作环境，并且致力于成为有史以来最安全、最可靠、连接性最强、性能最佳的 Windows 操作系统。\n\nWindows 11 与\
  \ Windows 10 基于相同的体系结构构建，因此您在更新和设备管理工具方面的投资可以持续沿用。\n\nWindows 11 已为零信任做好准备，并且从设计上就注重安全，内置的新安全技术将从芯片到云端提供全面保护，同时提升生产力并带来全新体验。加密、基于硬件的隔离和恶意软件防护等关键安全功能默认为开启状态。此外，通过简化部署\
  \ Windows Hello 企业版的步骤，实现无密码化也变得更加容易。\n\n为了满足当今市场对混合办公的需求，地点不应成为障碍。应对我们工作的新*方式、时间*和*地点*，需要在\
  \ Windows 操作系统中融入简洁与安全性的变革，并以更简单的方式交付 Windows——通过 Windows 365 从云端交付：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_37_0.png)\n\
  \n图 1.3 – Windows 11\n\n您可以为用户提供高度安全且一致的体验，并配置所有必要的 IT 控制，以不干扰业务的方式交付更新，同时结合焕然一新的现代外观和体验——这可以说是在总体上对\
  \ Windows 10 功能的最佳描述。\n\n我们将在*第 6 章“Windows 部署和管理”*中进一步介绍 Windows 11。\n\n## 生产力评分\n\
  \n生产力评分支持数字化转型之旅，它可让您深入了解组织如何使用 Microsoft 365 以及支持这些应用的技术体验。您组织的评分反映了员工工作效率和技术的有效性，并可以与规模类似的组织基准进行比较。\n\
  \n生产力评分提供以下内容：\n\n- 用于帮助您了解自己在数字化转型进程中所处位置的指标\n- 基于数据的见解，帮助您识别提高组织生产力和满意度的机会\n-\
  \ 您可采取的行动，帮助您的组织高效使用 Microsoft 365 产品\n\n以下生产力评分屏幕截图显示了您在 Microsoft 365 管理门户中根据评分指标所获得的见解层级：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_38_0.png)\n\n图 1.4 – 生产力评分\n\n端点分析及其带来的种种益处可以极大地改善您的端到端体验。另一个巨大优势是，所有服务成本均已包含在内；与\
  \ Azure Monitor 不同，您无需为存储保留付费！\n\n## 桌面分析\n\n桌面分析是完整 MEM 服务的重要组成部分；它基于云，并与 Configuration\
  \ Manager 集成。该服务还为 IT 管理员提供不同层级的见解和智能，以便就 Windows 10 终结点的更新就绪状况做出前瞻性决策。该服务将您业务中的数据与从连接到\
  \ Microsoft 云服务的数百万台设备聚合而来的数据相结合。\n\n以下是桌面分析与 Configuration Manager 配合使用的各种优势：\n\
  \n- 创建组织中正在运行的应用程序清单。\n- 评估应用程序与最新 Windows 10 功能更新的兼容性。\n- 识别兼容性问题，并基于云支持的数据见解获得缓解建议。\n\
  - 创建代表整个应用程序和驱动程序资产（涵盖最少的设备集）的试点组。\n- 将 Windows 10 部署到试点设备和生产托管设备。\n\n以下示例屏幕截图展示了在桌面分析中，安全更新和功能更新如何在一个统一的体验中汇集在一起：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_41_0.png)\n\n图 1.6 – 桌面分析 – 管理控制台\n\n\
  既然我们已经讨论了用于监控和分析终端的各种增强功能，接下来我们将介绍可以在物理桌面和云托管桌面中使用的各种 Microsoft 365 服务。\n\n## Microsoft\
  \ 365 企业应用版\n\nMicrosoft 365 企业应用版包含 Microsoft 生产力应用程序套件，例如 Word、Excel、PowerPoint、Outlook\
  \ 和 Teams，适用于 Windows 和 Mac 设备。Microsoft 365 企业应用版不是基于 Web 的 Office 版本，而是用户可在设备上安装和运行的完整版\
  \ Office。您可以将 Microsoft 365 企业应用版附带的 Office 应用程序与本地部署或在线版的 Exchange、SharePoint 或\
  \ Skype for Business 结合使用。\n\n您可以从网络共享或直接从互联网安装 Microsoft 365 企业应用版。安装后，您不必连接互联网即可使用它。但是，您至少需要每\
  \ 30 天连接一次，以确保您的许可证仍然有效。\n\nMicrosoft 365 企业应用版会每月或每半年更新一次，包含 Microsoft 提供的新功能、安全更新和其他质量更新。您可以通过选择特定的更新频道，来决定哪种更新频率最适合您的组织。\n\
  \n与 Office 专业增强版 2019 相比，Microsoft 365 企业应用版具有一些优势，例如支持隔离设备和基于设备的激活。对 Office 2019\
  \ 感兴趣的组织应联系 Microsoft 获取更多信息。\n\n## OneDrive for Business（Microsoft 365 企业应用版的组成部分）\n\
  \nMicrosoft OneDrive 是一项企业文件共享服务，可让您轻松存储并从所有物理设备、虚拟设备和移动设备安全访问文件。您还可以与任何地点的人员协同工作，无论他们是在组织内部还是外部，同时利用全面的安全功能，例如仅允许基于若干安全基线条件进行数据共享。您在\
  \ OneDrive 中的所有数据在传输过程中以及数据中心内静态存储时，均会通过高级加密得到保护。\n\nOneDrive 通过将您连接到 Microsoft\
  \ 365 中的个人文件和共享文件，增强了 Microsoft 365 应用中的协作能力。借助 Web、桌面或移动设备上的 OneDrive，您可以访问所有个人文件，以及其他人或团队与您共享的任何文件，包括来自\
  \ Microsoft Teams 和 SharePoint 的文件。\n\n另一个重要功能是 OneDrive 云备份——也称为 OneDrive 文件夹备份（以前称为已知文件夹移动）。此服务会自动将物理或虚拟终结点上的`Desktop`、`Documents`和`Pictures`文件夹同步到您的\
  \ OneDrive 云存储。您的文件和文件夹将受到保护，并且可以从任何设备访问！\n\n## Microsoft Teams\n\nMicrosoft Teams\
  \ 是一款统一通信协作工具，它将不同的服务整合在一起，使您与同事以及外部企业的协作方式更加现代化。Teams 允许您将基于聊天的工作区作为 Windows 10\
  \ 物理和虚拟 PC 的一部分，同时也可作为各种平台上的移动应用，帮助您在办公室和外出途中都能随时了解最新动态。\n\n\n\nTeams 通过共享 OneDrive\
  \ 和 SharePoint 文档、见解和状态更新，让您的团队保持同步，同时能够管理重要项目并轻松找到人员——无论身处何地，使用任何设备！\n\n使用 Microsoft\
  \ Teams，您可以执行以下操作：\n\n- **通过聊天、会议和通话进行沟通：** 主持音频、视频和网络会议，并与组织内外的任何人聊天。\n- **通过集成的\
  \ Microsoft 365 应用进行协作：** Teams 允许用户通过流行的 Microsoft 365 应用（从 Microsoft Word 到 Microsoft\
  \ Power BI）共同创作和共享文件，从而让团队协作变得轻松。\n- **自定义工作区并实现更多目标：** 使用 Teams，您可以集成 Microsoft\
  \ 和第三方合作伙伴服务的应用，以满足您组织的独特需求。\n- **跨设备连接：** Teams 和 Teams 设备可完美配合，提供智能会议和通话体验。找到适合您需求的设备，将您的最佳想法付诸实践。\n\
  \n## Microsoft Edge\n\nMicrosoft Edge 作为 Internet Explorer 的下一代现代迭代产品，已经存在了一段时间，于\
  \ 2015 年首次发布。5 年后，基于开源软件项目 Chromium 构建的新版本 Edge 发布。它使用与 Google Chrome 浏览器相同的核心引擎。\n\
  \nMicrosoft Edge 已被证明非常快速。它与 MEM 等其他 Microsoft 服务保持一致以设置策略，以及该应用跨平台同步个人历史记录和收藏夹设置等数据的能力，都受到了好评。这使得\
  \ Edge 至今仍是 Windows 10 的默认浏览器。\n\nMicrosoft Edge 可用于 Windows、macOS、iOS、Android 和\
  \ Linux。您可以选择要在不同平台上使用相同原生 Edge 体验的设备。\n\n## Universal Print\n\n您可能还记得以下工作流程——或者至今仍在这样做：启动\
  \ Windows Server 环境，添加打印服务器角色，然后开始将打印机和指定驱动程序添加到服务器。这并不现代或高效，不是吗？Universal Print\
  \ 提供了相同甚至更多的功能，同时还消除了对本地基础架构的需求。它使您能够直接通过 Microsoft Azure 中的集中式门户管理打印机。告别在设备和/或黄金映像上安装（和维护）打印机驱动程序吧。额外的好处是，一切都可与\
  \ Azure AD 配合使用。这意味着用户可以使用他们用于其他 Microsoft 服务的同一组凭据，无论他们登录的是物理桌面还是云端运行的虚拟桌面。\n\n\
  ## Microsoft Defender for Endpoint（前身为 MDATP）\n\nMicrosoft Defender for Endpoint\
  \ 是 Microsoft Defender 的企业版，Windows 10 企业版和 Windows 11 企业版默认启用。它是一个云安全平台，旨在帮助企业网络预防、检测、调查和响应高级威胁。\n\
  \n该服务已端到端集成到 MEM 控制台中，因此可以轻松地作为安全基线的一部分，与其他合规性和安全设置及角色保持一致。\n\n将 Defender 集成到 MEM\
  \ 中的一大优势是，在您的组织使用配置包载入设备后，您将无需再次执行此操作。您的所有物理和/或云 PC 都将开箱即用地受到保护：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_44_0.png)\n\
  \n图 1.7 – Defender for Endpoint – 管理控制台\n\nIntune 中的 Defender for Endpoint 配置过程非常简单，我们将在本书后面更详细地说明。\n\
  \n## Exchange Online\n\nExchange Online 是一个用于电子邮件、日历、联系信息和任务的消息传递与协作平台。您可以通过 Microsoft\
  \ Outlook、Outlook 网页版或 Outlook Mobile 访问所有这些内容。您可以在大多数设备上访问 Exchange Online，包括 Android、iOS\
  \ 和 Windows 10 设备。\n\n## SharePoint Online\n\nSharePoint Online 是 Microsoft SharePoint\
  \ Server 的云端演进。它帮助您创建以团队或沟通为中心的网站，以实现高效的协作和沟通。拥有相应 Microsoft 365 或 SharePoint Online\
  \ 许可证的内部用户可以使用 SharePoint Online。他们可以与组织内外的其他人共享文件或文件夹。组织外部的共享可由网站管理员控制。\n\n使用 SharePoint\
  \ Online，用户可以执行以下操作：\n\n- 构建网站、页面、文档库和列表。\n- 添加 Web 部件以自定义其页面。\n- 与团队共享重要视觉内容、新闻和更新。\n\
  - 在整个组织中搜索和发现网站、文件、人员和新闻。\n- 使用流程、表单和列表管理其业务流程。\n- 将其文件同步并存储在云端，以便任何人都可以安全地使用它们。\n\
  - 通过 SharePoint 移动应用随时了解最新动态。\n\n## 总结\n\n在本章中，您了解了在日常工作中或在使用 MEM 简化环境管理开销的过程中可能使用的所有不同\
  \ Microsoft 365 服务。\n\n本章主要是为本书后续章节提供背景；现在我们将转换重点，带您踏上使用 MEM 进行统一端点管理的旅程。\n\n##\
  \ 问题\n\n1. 使用 MEM 的主要好处是什么？\n   A. MEM 确保组织不再需要凭据即可访问和共享公司数据。\n   B. MEM 阻止远程设备和应用访问组织的资源。\n\
  \   C. MEM 帮助保护组织的云和本地设备、应用及数据的安全。\n2. Windows 365 Cloud PC 和 AVD 之间的主要区别是什么？\n\
  \   A. Windows 365 Cloud PC 专为简单性而设计，AVD 则专为灵活性而设计。\n   B. Windows 365 Cloud PC\
  \ 采用固定价格成本模型，而 AVD 基于消耗量计费。\n\n## 答案\n\n1. (C)\n2. (A)\n\n## 拓展阅读\n\n读完本章后，如果您想了解有关\
  \ MEM 的更多信息，请使用以下免费在线资源：\n\n- MEM 基础知识：https://docs.microsoft.com/en-us/learn/paths/endpoint-manager-fundamentals/\n\
  - MEM 简介：https://docs.microsoft.com/en-us/learn/modules/intro-to-endpoint-manager/\n"
- "## 2 什么是统一端点管理？\n\n现代管理的基础有时难以理解。您将了解现代管理和零信任的概念，以及作为 Microsoft Endpoint Manager\
  \ 一部分的 Intune，及其历史和架构概念，从而清楚地理解所有设备——物理设备、虚拟设备和移动设备——如何汇聚到一个管理控制台中。\n\n在本章中，我们将讨论以下主题：\n\
  \n- 现代管理之路\n- Microsoft Endpoint Manager 和 Intune\n- 深入了解 Windows 10 企业版\n- 自带设备\n\
  - 什么是零信任？\n\n### Microsoft Endpoint Manager 和 Intune\n\n什么是统一端点管理？通过 **Microsoft\
  \ Endpoint Manager** 的概念，它又是怎样的？下图的高级架构图解释了 Microsoft Endpoint Manager 中的一切如何汇聚为统一的端点管理体验。\n\
  \n通过 **Windows 365** 端点和移动设备，一个控制台即可管理您的物理和云 PC。这是唯一可以统一管理它们的地方。此外，Intune 公司门户可以部署来自\
  \ Configuration Manager、Intune、Windows 365、Azure Virtual Desktop 和 Azure Active\
  \ Directory 的应用——为所有应用提供统一的最终用户体验！\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_49_0.png)\n\
  \n图 2.2 – Microsoft Endpoint Manager 架构图\n\n上图中的 Microsoft Endpoint Manager 架构展示了使用\
  \ Configuration Manager 和 Intune 在单一、统一端点管理解决方案中进行云管理之旅的三个阶段：\n\n1. 租户附加\n2. 共同管理工作负载\n\
  3. 云原生管理\n\n\n\n所有新的 Windows 设备都应直接通过 **Azure Active Directory（Azure AD）** 进入云，并自动注册到\
  \ Intune。如果您的组织已经拥有 Configuration Manager 环境，且正在向本地托管设备部署大量应用程序，那么这可以利用 Windows\
  \ Autopilot 为 IT 和最终用户提供最佳入门体验。\n\n对于现有设备，请开始使用租户附加功能，该功能为 Configuration Manager\
  \ 客户提供了最灵活的路径，无需将 Windows 客户端注册到 Intune 即可开始获得云优势。将 Configuration Manager 环境连接到云，并立即获得大量远程操作和终结点分析。\n\
  \n如果您的组织已准备好进入下一步，则可以开始将 Windows 设备载入到共同管理状态，这意味着同时使用 Configuration Manager 和 Intune\
  \ 管理 Windows 客户端。一次将一个工作负载迁移到云，从而兼得两者之优势。\n\n## Endpoint Manager 管理中心门户\n\nMicrosoft\
  \ Endpoint Manager 管理中心门户（`https://endpoint.microsoft.com/#home`）是您创建策略和管理设备的全面一站式管理体验。它允许\
  \ IT 管理员接入其他关键设备管理服务，例如组、安全基线和设置、条件访问、分析工具和报告。\n\n**Microsoft Intune** 是 100% 基于云的\
  \ MDM 和 **移动应用程序管理（MAM）** 提供商，适用于您的应用和设备。Microsoft Intune 允许您控制 Android、Android\
  \ Enterprise、iOS/iPadOS、macOS 和 Windows 10 设备上的功能和设置。它与其他服务集成，包括 Azure AD 和移动威胁防御。\n\
  \nMicrosoft Intune 可以创建合规性策略并检查合规性状态，从而将设备标记为合规或不合规。如果您已在 Microsoft 365 云环境中启用条件访问，则可以利用\
  \ Intune 中的合规性状态来允许或阻止对公司数据的访问。\n\nIntune 还可用于应用程序生命周期管理。\n\n## Microsoft 365 管理中心门户\n\
  \n在 Microsoft 365 管理中心门户（`https://admin.microsoft.com`）中，您可以管理和掌管所有 Microsoft 365\
  \ 云服务。您在此门户中最常见的任务是购买和分配 Microsoft 服务的许可证。\n\n以下是通过 Microsoft 365 管理中心可以执行的操作的完整列表：\n\
  \n| 菜单 | 用途 |\n|------|---------------|\n| 主页 | 这是管理中心中的登陆页面。您将看到在哪里管理用户、计费、服务运行状况和报告。\
  \ |\n| 用户 | 创建和管理组织中的用户，例如员工或学生。您还可以设置其权限级别或重置其密码。 |\n| 组 | 创建和管理组织中的组，例如 Microsoft\
  \ 365 组、通讯组、安全组或共享邮箱。了解如何创建 (https://docs.microsoft.com/en-us/microsoft-365/admin/create-groups/create-groups?view=o365-worldwide)\
  \ 和管理 (https://docs.microsoft.com/en-us/microsoft-365/admin/create-groups/manage-groups?view=o365-worldwide)\
  \ 组。 |\n| 资源 | 创建和管理资源，例如 SharePoint 网站集。了解如何创建网站集 (https://docs.microsoft.com/en-us/sharepoint/create-site-collection)。\
  \ |\n| 计费 | 查看、购买或取消组织的订阅。查看过去的账单或查看分配给各个用户的许可证数量。了解如何管理计费 (https://docs.microsoft.com/en-us/microsoft-365/commerce/?view=o365-worldwide)。\
  \ |\n| 支持 | 查看现有服务请求或创建新的服务请求。在“联系业务产品支持 – 管理员帮助”(https://docs.microsoft.com/en-us/microsoft-365/business-video/get-help-support?view=o365-worldwide)\
  \ 中了解更多信息。 |\n| 设置 | 管理应用（例如电子邮件、网站和 Office 套件）的全局设置。更改密码策略和过期日期。添加和更新域名，例如 contoso.com。更改组织配置文件并选择发布首选项，以及选择合作伙伴是否可以访问您的管理中心。\
  \ |\n| 安装 | 管理现有域，启用和管理 **多因素认证（MFA）**，管理管理员访问权限，将用户邮箱迁移到 Office 365，管理功能更新，并帮助用户安装其\
  \ Office 应用。 |\n| **报告** | 一目了然地查看您的组织如何使用 Microsoft 365，包括电子邮件使用、Office 激活等的详细报告。了解如何使用新的活动报告\
  \ (https://docs.microsoft.com/en-us/microsoft-365/admin/activity-reports/activity-reports?view=o365-worldwide)。\
  \ |\n| **运行状况** | 一目了然地查看运行状况。您还可以查看更多详细信息和运行状况历史记录。有关详细信息，请参阅 *如何检查 Microsoft 365\
  \ 服务运行状况* (https://docs.microsoft.com/en-us/microsoft-365/enterprise/view-service-health?view=o365-worldwide)\
  \ 和 *如何检查 Windows 版本运行状况* (https://docs.microsoft.com/en-us/windows/deployment/update/check-release-health)。<br><br>使用消息中心跟踪即将对功能和服务进行的更改。我们在其中发布公告，提供有助于您规划变更并了解其可能对用户产生何种影响的信息。在此处获取更多详细信息：*消息中心*\
  \ (https://docs.microsoft.com/en-us/microsoft-365/admin/manage/message-center?view=o365-worldwide)。\
  \ |\n| **管理中心** | 为 Exchange、Skype for Business、SharePoint、Yammer 和 Azure AD 打开单独的管理中心。每个管理中心都包含该服务的所有可用设置。<br><br>例如，在\
  \ Exchange 管理中心中，设置和管理电子邮件、日历、通讯组等。在 SharePoint 管理中心中，创建和管理网站集、网站设置和 OneDrive for\
  \ Business。在 Skype for Business 管理中心中，设置即时消息通知、拨入会议和在线状态。<br><br>在 *Exchange Online*\
  \ (https://docs.microsoft.com/en-us/exchange/exchange-admin-center) 和 *Microsoft\
  \ 365 中的 SharePoint 简介* (https://docs.microsoft.com/en-us/sharepoint/introduction)\
  \ 中了解有关 Exchange 管理中心的更多信息。<br><br>注意：您可用的管理中心取决于您的计划和区域。 |\n\n## 什么是统一终结点管理？\n\n\
  作为 Endpoint Manager 的一部分，共同管理使用云功能，包括条件访问。您可以将某些任务保留在本地，同时使用 Intune 在云中运行其他任务。\n\
  \n共同管理支持以下工作负载：\n\n- 合规性策略\n- Windows 更新策略\n- 资源访问策略\n- 终结点保护\n- 设备配置\n- Office\
  \ 即点即用应用\n- 客户端应用\n\n### 合规性策略\n\n合规性策略定义了设备必须遵守的规则和设置，才能被条件访问策略视为合规。此外，从 Configuration\
  \ Manager 评估规则开始，可以使用合规性策略独立于条件访问监视和修正设备的合规性问题。\n\n### Windows 更新策略\n\n**Windows\
  \ 更新企业版（WUfB）** 策略允许您将 WUfB 策略配置为环形概念，以便您可以决定何时以及如何为 Windows 10 及更高版本的设备提供服务。\n\n\
  您可以为直接由 WUfB 管理的 Windows 10 及更高版本的设备配置 Windows 10 功能更新或质量更新的延迟策略。\n\n在 Intune 中，您还可以选择配置\
  \ Windows 10 功能更新。此策略允许设备更新到您指定的 Windows 版本，并且不会在那些设备上升级到更新的 Windows 功能版本。您在 Windows\
  \ 10 及更高版本功能更新策略中指定的 Windows 功能版本将保留在设备上，直到您选择更改策略设置。虽然功能版本保持静态，但设备将继续下载和安装该功能版本可用的质量更新和安全更新。\n\
  \n### 资源访问策略\n\n资源访问策略在 Windows 10 及更高版本的设备上配置**虚拟专用网络（VPN）**、Wi-Fi、电子邮件和证书设置。\n\
  \n\n\n\n## 端点保护\n\n端点保护工作负载包括 Windows Defender 系列的恶意软件防护功能：\n\n- **防病毒：** 防病毒策略帮助安全管理员专注于管理以下设置：适用于\
  \ Intune 管理设备的 Microsoft Defender 防病毒、Microsoft Defender 排除项以及 Windows 安全体验。\n-\
  \ **磁盘加密：** 端点安全磁盘加密配置文件仅关注与设备内置加密方法（如 BitLocker）相关的设置。这使得 IT 管理员能够部署并自动加密最终用户的\
  \ Windows 设备。\n- **防火墙：** 使用 Intune 中的端点安全防火墙策略，为运行 Windows 10 的设备配置设备内置防火墙。防火墙策略分为两种：防火墙策略本身和防火墙规则策略。\n\
  - **端点检测和响应：** 当你将 Microsoft Defender for Endpoint 与 Intune 集成时，请使用针对**端点检测和响应 (EDR)**\
  \ 的端点安全策略来管理 EDR 设置并将设备载入 Microsoft Defender for Endpoint。\n- **攻击面减少：** 当你的 Windows\
  \ 10 设备上正在使用 Defender 防病毒时，请使用 Intune 端点安全策略进行攻击面减少，以管理这些设备的设置。\n\n攻击面减少策略分为不同的策略：\n\
  \n- A. 应用和浏览器隔离\n- B. 设备控制\n- C. 攻击面减少规则\n- D. 漏洞利用保护\n- E. Microsoft Edge Legacy\
  \ 的 Web 保护\n- F. 应用程序控制\n\n- **帐户保护：** 帐户保护策略帮助你保护用户的身份和帐户。帐户保护策略专注于 Windows Hello\
  \ 和 Credential Guard 的设置，这是 Windows 身份和访问管理的一部分。\n\n当你切换此工作负载时，Configuration Manager\
  \ 策略会保留在设备上，直到 Intune 策略覆盖它们。此行为确保设备在转换期间仍然具有保护策略。\n\n端点保护工作负载也是设备配置的一部分。当你切换设备配置工作负载时，也会应用相同的行为。当你切换设备配置工作负载时，它还包括\
  \ Windows 信息保护功能的策略，而该功能不包含在端点保护工作负载中。\n\n作为 Intune 设备配置设备限制配置文件类型一部分的 Microsoft\
  \ Defender 防病毒设置不在端点保护滑块的范围内。要为启用了端点保护滑块的共同管理设备管理 Microsoft Defender 防病毒，请在 **Microsoft\
  \ Endpoint Manager 管理中心 | 端点安全 | 防病毒**中使用新的防病毒策略。新的策略类型提供了新的和改进的选项，并支持设备限制配置文件中可用的所有相同设置。\n\
  \nWindows 加密功能包括 BitLocker 管理。我们将在*第 10 章 高级策略管理*和*第 13 章 身份与安全管理*中更多地讨论 BitLocker。\n\
  \n## 设备配置\n\n设备配置工作负载包括你为组织中的设备管理的设置。切换此工作负载也会移动资源访问和端点保护工作负载。\n\n即使 Intune 是设备配置权威，你仍然可以将设置从\
  \ Configuration Manager 部署到共同管理的设备。此例外可能用于配置你的组织需要但 Intune 中尚不可用的设置。在 Configuration\
  \ Manager 配置基线上指定此例外。创建基线时，启用即使对于共同管理的客户端也始终应用此基线的选项。你可以在现有基线属性的**常规**选项卡中稍后更改它。\n\
  \n有关 Intune 功能的更多信息，请参阅 Microsoft Intune 中的**创建设备**配置文件。\n\n## Office 即点即用应用\n\n\
  除非设备重新启动，否则 Office 更新可能需要大约 24 小时才能显示在客户端上。\n\nOffice 365 应用程序由 Intune 管理。Intune\
  \ 中的此条件默认作为新 Microsoft 365 应用程序的要求添加。当你转换此工作负载时，共同管理的客户端不满足应用程序的要求，因此它们不会安装通过 Configuration\
  \ Manager 部署的 Microsoft 365。\n\n移动工作负载后，从 Microsoft Intune 分配的 Microsoft 365 应用会显示在设备上的公司门户中。\n\
  \n## 客户端应用\n\n使用 Intune 管理共同管理的 Windows 10 设备上的客户端应用和 PowerShell 脚本。转换此工作负载后，从 Intune\
  \ 部署的任何可用应用都将在公司门户中提供。你从 Configuration Manager 部署的应用在软件中心和公司门户中可用。公司门户可以将 SCCM 和\
  \ Intune 的可用应用显示为一个最终用户软件门户。\n\n## 桌面分析\n\n**桌面分析**是一项与 Configuration Manager 集成的基于云的服务。它提供见解和智能，帮助你更明智地决定\
  \ Windows 客户端的更新就绪情况。该服务将你组织的数据与从连接到 Microsoft 云的数百万台设备聚合的数据相结合。它提供有关组织中安全更新、应用和设备的信息，并识别应用和驱动程序的兼容性问题。为最有可能为整个组织的资产提供最佳见解的设备创建试点。\n\
  \n作为 Endpoint Manager 的一部分，使用桌面分析的云驱动见解来保持 Windows 10 设备的最新状态。桌面分析需要设备上的 SCCM 客户端，仅使用\
  \ Intune 不受支持。\n\n**Windows Autopilot**：Windows Autopilot 设置并预配置新设备，使其准备好使用。它旨在简化\
  \ Windows 设备的生命周期，无论是对 IT 还是最终用户，从初始部署到生命周期结束。\n\n作为 Endpoint Manager 的一部分，使用 Autopilot\
  \ 预配置设备并自动在 Intune 中注册设备。你还可以将 Autopilot 与 Configuration Manager 和共同管理集成，以实现更复杂的设备配置（预览版）。\n\
  \n强烈建议在仅 Azure AD 环境中使用 Windows Autopilot，以利用整个 Windows Autopilot 功能套件，例如 Autopilot\
  \ 重置和 Autopilot 中的共同管理。\n\n**Azure AD：** Endpoint Manager 使用 Azure AD 来识别设备、用户、组和\
  \ MFA。Azure AD Premium 是 Microsoft 365 许可证的一部分，具有额外的功能来帮助保护设备、应用和数据，包括动态组、自动注册和条件访问。Windows\
  \ Autopilot 也需要 Azure AD Premium，因为自动注册是先决条件。\n\n**Endpoint Manager 管理中心：** 管理中心是一个一站式网站，用于创建策略和管理设备。它与其它关键设备管理服务集成，包括组、安全、条件访问和报告。\n\
  \nMicrosoft Endpoint Manager 是用于管理所有设备的集成解决方案。Microsoft 将 Configuration Manager\
  \ 和 Intune 整合到一个名为 Microsoft Endpoint Manager 管理中心的单一控制台中。\n\n从 Configuration Manager\
  \ 版本 2002 开始，你可以将 Configuration Manager 设备上传到云服务，并从管理中心的**设备**边栏选项卡执行操作：\n\n- **客户端详细信息**：此功能为\
  \ IT 管理员或帮助台提供属性和设备状态的快速概览。\n- **安装应用程序**：此功能为 IT 管理员或帮助台提供将应用程序部署到最终用户设备的选项。\n\
  - **设备时间线**：设备每天向管理中心发送一次事件。只有在客户端收到启用 Endpoint analytics 数据收集策略后收集的事件才在管理中心可见。通过安装应用程序或从\
  \ Configuration Manager 安装更新，或重新启动设备，可以轻松生成测试事件。事件保留 30 天。使用图表查看已收集的事件。\n- **资源浏览器**：从\
  \ Microsoft Endpoint Manager 管理中心，你可以使用资源浏览器查看已上传的 Configuration Manager 设备的硬件清单。\n\
  - **运行脚本**：此选项允许其他 IT 管理员或帮助台实时从云中针对单个 Configuration Manager 管理的设备运行 PowerShell\
  \ 脚本。这提供了 PowerShell 脚本的所有传统优势，这些脚本已由本地环境中的 Configuration Manager 管理员定义和批准。\n\n\n\
  \n\n最常见的批量激活方法要求设备连接到组织网络，或通过 VPN 连接，以便定期与组织的激活服务*签到*以维护其许可证。然而，当人们在家工作且不在公司或学校网络中时，其设备接收或维护激活的能力会受到限制。\n\
  \n有几种方法可以进行 Windows 激活：\n\n- 密钥管理服务\n- 多次激活密钥\n- 基于 Active Directory 的激活\n- Windows\
  \ 10 订阅激活\n\n## 通过 Windows 365 云电脑使用 Windows\n\n前面的激活 Windows 10 企业版的选项已内置到 Windows\
  \ 365/云电脑中。如果你打算在 Azure 上自行管理和部署虚拟桌面，这意味着 Windows 10 企业版将通过 Azure **密钥管理服务 (KMS)**\
  \ 自动激活。\n\n## Azure KMS – 云电脑/Windows 365/AVD\n\n如果你的 Windows 桌面是虚拟的并在 Azure 上运行，例如使用\
  \ **Azure 虚拟桌面 (AVD)**，你需要连接到 Azure `kms.core.windows.net:1688` KMS 服务器才能激活你的虚拟机。使用\
  \ Azure 映像库中的映像时，这会自动发生。确保你的 Azure **虚拟网络 (vNET)** 能够连接到该地址，并相应配置防火墙策略和规则。稍后将在云电脑/Windows\
  \ 365 和要求章节中了解更多相关内容。\n\nWindows 11 将在今年秋季晚些时候该操作系统正式发布后加入产品阵容。本书后面还会介绍更多关于 Windows\
  \ 11 的内容。\n\n通过 Active Directory 激活的设备在与域最近一次联系后的最多 180 天内保持激活状态。设备会在此期间结束前定期尝试重新激活（默认每\
  \ 7 天一次），并在 180 天结束时再次尝试。\n\n## Windows 10 及更高版本的订阅激活\n\n从 Windows 10 版本 1703 开始，Windows\
  \ 10 专业版支持订阅激活功能，如果用户订阅了 Windows 10 企业版 E3 或 E5，则可以自动从 Windows 10 专业版*升级*到 Windows\
  \ 10 企业版。\n\n借助 Windows 10 版本 1703，Windows 10 企业版 E3 和 Windows 10 企业版 E5 都可以作为在线订阅服务提供。现在，在组织中部署\
  \ Windows 10 企业版无需密钥，也无需重启。\n\n## 适用于 Windows 10 版本 1703 或更高版本\n\n拥有当前 Windows 10\
  \ 专业版许可证的设备可以无缝升级到 Windows 10 企业版。基于产品密钥的 Windows 10 企业版软件许可证可以转换为 Windows 10 企业版订阅。\n\
  \n拥有企业协议的组织也可以使用传统的加入 Active Directory 的设备，从这项新服务中受益。在这种情况下，在其设备上登录的 Active Directory\
  \ 用户必须使用 Azure AD Connect 同步与 Azure AD 进行同步。\n\n订阅激活功能消除了在每台目标设备上手动部署 Windows 10\
  \ 企业版或教育版映像，然后建立本地密钥管理服务（例如基于 KMS 或 MAK 的激活）、输入**通用批量许可密钥 (GVLK)**，以及随后重启客户端设备的需要。\n\
  \n## WUfB 是管理 Windows 服务的新方式\n\nWUfB 允许 IT 专业人员利用基于云的 Windows 更新服务来部署和管理 Windows\
  \ 更新。你可以使用组策略或 MDM 解决方案（如 Microsoft Intune）来配置 WUfB 设置，以控制 Windows 10 设备的更新方式和时间。\n\
  \nWUfB 自 Windows 10 版本 1511 起可用，并在后续 Windows 10 版本中得到了增强。其中一些改进旨在为 IT 专业人员提供更大的控制权，同时为最终用户提供更好的体验。\n\
  \n## 谁应该使用 WUfB？\n\nWUfB 面向组织中管理的运行 Windows 10 教育版、专业版或企业版的设备。WUfB 不支持 Windows 10\
  \ **长期服务渠道 (LTSC)**：\n\n- 所有组织都可以利用它来更高效地维护其联网设备。\n- 中小型企业可以在继续使用 Windows 更新的同时获得灵活性，并且比之前不使用\
  \ System Center Configuration Manager、Microsoft Intune、**Windows Server 更新服务 (WSUS)**\
  \ 或第三方解决方案时拥有更多控制。\n\n## 为什么需要 WUfB？\n\nWUfB 可以帮助你为最终用户提供最佳的 Windows 更新体验，并降低维护\
  \ Windows 的成本，同时为你提供许多更复杂、更耗时的解决方案所具备的灵活性和控制力：\n\n- 降低批准、部署和监控更新的成本。\n- 管理组织生态系统中的应用程序兼容性。\n\
  - 找到合适的权衡方案来保护设备，同时尽量减少对员工工作的干扰。\n- 管理支持快速更新速度所需的基础设施配置，包括找到合适的方法来处理很少连接到企业的设备。\n\
  \n## WUfB 允许我配置什么？\n\n当你使用配置设置从 Microsoft Intune 配置 WUfB 策略时，WUfB 将被启用。如果你传统上使用\
  \ WSUS 进行服务，一旦你设置了 WUfB 设置，你的客户端将同时连接到云中的 Windows 更新以及你的 WSUS 服务器。如果你想更改此行为，则需要删除端点上旧的\
  \ WSUS 配置设置。\n\n通过 Windows 更新客户端设置（通过组策略、MDM 或 UX），WUfB 提供了延迟应用更新的能力。质量更新和功能更新分开处理，以提供更大的灵活性。\n\
  \n此外，如果你需要在早期环中测试更新后有时间对更新实施补救，则可以利用“暂停”功能：\n\n- **功能更新**：以前称为**升级**，功能更新不仅包含安全性和质量修订，还包含重要的功能新增和更改。功能更新于每年秋季和春季每半年发布一次。\n\
  - **质量更新**：质量更新是传统的操作系统更新，通常于每月第二个星期二发布（尽管它们可以随时发布）。其中包括安全更新、关键更新和驱动程序更新。WUfB 还将非\
  \ Windows 更新（例如 Microsoft Office 或 Visual Studio 的更新）视为质量更新。这些非 Windows 更新称为 **Microsoft\
  \ 更新**，你可以设置设备在接收 Windows 更新的同时接收（或不接收）此类更新。\n- **驱动程序更新**：适用于与你设备相关的非 Microsoft\
  \ 驱动程序的更新。驱动程序更新默认开启，但如果你愿意，可以使用 WUfB 策略将其关闭。\n- **Microsoft 产品更新**：其他 Microsoft\
  \ 产品的更新，例如通过 Windows Installer (MSI) 安装的 Office 版本。通过 Click-to-Run 安装的 Office 版本无法使用\
  \ WUfB 更新。产品更新默认关闭。你可以使用 WUfB 策略将其开启。\n\nWindows 10 功能更新策略与你的*Windows 10 更新环*策略协同工作，以防止设备收到比功能更新策略中指定的值更新的\
  \ Windows 功能版本。\n\n要使 Windows 10 功能更新策略生效，需要 Windows 10 版本 1709 或更高版本。设备需要注册到 Intune\
  \ MDM，并加入混合 AD、加入 Azure AD 或注册到 Azure AD。Windows 遥测需要打开，最低设置为“基本”。如果遥测关闭，Windows\
  \ 可能会升级到比功能更新策略中定义的版本更高的 Windows 版本。\n\n\n\n当设备收到 Windows 10 功能更新策略时，该设备将更新到策略中指定的\
  \ Windows 版本。已经运行更高版本 Windows 的设备将保持当前版本不变。通过冻结版本，设备的功能集将在策略有效期内保持稳定。\n\n当设备对某个\
  \ Windows 版本存在保护暂停时，该设备将不会安装更新。当设备评估更新版本的适用性时，如果存在未解决的已知问题，Windows 会创建临时的保护暂停。一旦问题得到解决，该暂停即被移除，设备随后便可以更新。\n\
  \n与使用更新环中的**暂停**（有效期为 35 天）不同，Windows 10 功能更新策略会一直生效。在您修改或移除 Windows 10 功能更新策略之前，设备不会安装新的\
  \ Windows 版本。如果您编辑策略以指定较新的版本，设备随后即可安装该 Windows 版本中的功能。\n\n如今，Windows 10 有 3000 多个组策略设置。尽管\
  \ Microsoft 针对不同的安全功能提供了大量指导，但要逐一探究每个设置仍可能需要很长时间。您需要自行确定每个设置的影响，然后为每个设置确定合适的值。\n\
  \n适用于 Windows 10 的 WUfB 提供了一组可配置的策略，只要设备具有 Internet 连接，即可通过配置以下多个领域的策略设置，在更新时提供最安全的\
  \ Windows 环境，同时保持最佳最终用户体验：\n\n- 配置截止日期\n- 重启行为\n- 考虑低活动设备（活动时间）\n- 传递优化\n- 电源策略\n\
  \n在保持软件更新合规性的需求与维持员工生产力的愿望之间，始终存在一种张力。虽然安全部门要求在软件更新后的 7 天内看到设备群完全更新，但现实是，部署所述更新会给用户带来相关成本，而且很少有公司能够在单个工作日的中间向全体员工推送更新，除非是紧急情况下的零日补丁。\n\
  \n鉴于“受保护的劳动力”和“高生产力的劳动力”这两个目标相互竞争，您可能会发现，您需要做出的选择可能不是最大化更新速度的最佳选项，而是更符合企业生产力需求的体验。\n\
  \n## 自带设备 (BYOD)\n\nBYOD 根据 Windows SKU 的不同而提供不同的选项。所有 BYOD 场景都可以利用 Windows 365\
  \ 和 Azure 虚拟桌面，以远程应用的形式访问完整桌面或单个应用程序。\n\nWindows 设备也可以注册到 Azure AD，以访问公司资源，例如电子邮件。\n\
  \n将设备作为个人拥有的设备 (BYOD) 注册到 Intune。如果管理员已配置自动注册（可通过 Azure AD Premium 订阅获得），则用户只需输入一次凭据。否则，他们必须通过仅限\
  \ MDM 的注册单独注册，并重新输入凭据。\n\nMicrosoft Intune 管理在 BYOD 上无法提供相同的管理功能；并非所有 Windows 版本都内置相同的\
  \ MDM 管理设置：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_68_0.png)\n\n图 2.5 – Microsoft\
  \ Endpoint Manager 终结点支持\n\nWindows 10 企业版具有完整的管理功能，而家庭版和专业版由于 Windows 的限制，管理功能较少。Microsoft\
  \ 为 IT 管理员提供了利用注册限制的选项，以便您可以阻止个人注册到 Microsoft Intune。\n\n## 什么是零信任？\n\n过去，组织在创建对公司网络的远程访问时，通常通过\
  \ VPN 连接实现访问，无论是在公司所有还是个人所有的 Windows 设备上，都仅由 MFA 令牌保护。\n\n如今，组织需要一种新的安全模型，它能够有效适应现代环境的复杂性，支持移动办公人员，并保护人员、设备、应用程序和数据，无论它们位于何处。\n\
  \n这就是零信任的核心。零信任模型不相信企业防火墙背后的一切都是安全的，而是假定已发生入侵，并像验证来自不受控制网络的请求一样验证每个请求。无论请求来自何处或访问什么资源，零信任模型都教导我们“永不信任，始终验证”。\n\
  \n### 验证身份\n\n当今大多数安全漏洞都涉及凭据窃取，而网络卫生方面的疏失会放大员工乃至整个组织的潜在风险。这就是为什么零信任系统的主要组件之一是在授予对公司网络的访问权限之前验证用户身份的能力。\n\
  \n首先，通过 Azure Authenticator 的现代体验和 Windows Hello 企业版，在所有 Windows 10 设备上实施 MFA。\n\
  \n### 验证设备\n\n由于不受管理的设备是恶意行为者的易入点，确保只有健康且受信任的设备才能访问关键应用程序和数据，对企业安全至关重要。我们零信任实施的一个基本部分是将所有最终用户设备注册到设备管理系统（如\
  \ Microsoft Intune）中。\n\n通过这种方式启用合规性策略，检查设备的 BitLocker 加密、安全启动和设备健康验证等参数，对于管理控制对公司资源访问的策略至关重要。\n\
  \nMicrosoft Endpoint Manager 是这种新思维方式的关键组成部分，因为它通过合规性策略验证设备是否符合要求，从而使设备成为受信任的设备。\n\
  \n条件访问是 Azure AD 内置的工具，用于汇集信号、做出决策并强制执行组织的条件访问策略：\n\n- **信号**：设备或用户通过特定应用程序或浏览器登录。\n\
  - **决策**：根据策略，您将被授予什么级别的访问权限。\n- **强制执行**：这可能很简单，例如通过 MFA 令牌授予最终用户访问权限，或拒绝访问：\n\n\
  ![](img/a3e9f26159d3739e434fe676b2987c1d_69_0.png)\n\n图 2.6 – 零信任验证设备示意图\n\n## 问题\n\
  \n1. 现代管理与市场上的其他管理解决方案有何不同？\n\n   A. 通过统一的管理门户体验，对设备进行安全管理。\n\n   B. 它为移动设备管理提供了更多功能。\n\
  \n   C. 其他解决方案不支持 Windows 10 企业版。\n\n2. 零信任背后的主要原则是什么？\n\n   A. 永不信任，始终验证。\n\n \
  \  B. 始终信任，永不验证。\n\n## 答案\n\n1. (A)\n2. (A)\n\n## 延伸阅读\n\n读完本章后，如果您想了解更多关于现代管理的内容，请使用以下免费在线资源之一：\n\
  \n- 推动我们 Microsoft Endpoint Manager 愿景的现代管理和安全原则 – Microsoft Tech Community：https://techcommunity.microsoft.com/t5/microsoft-endpoint-manager-blog/modern-management-and-security-principles-driving-our-microsoft/ba-p/946797\n\
  - Microsoft 365 中的现代管理简介：https://docs.microsoft.com/en-us/learn/modules/introduction-to-modern-management-in-microsoft-365/\n\
  - 使用 Microsoft Endpoint Manager 进行现代管理 – YouTube：https://www.youtube.com/watch?v=103UXEnIOFg\n"

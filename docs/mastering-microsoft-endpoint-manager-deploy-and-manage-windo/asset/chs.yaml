  \n在运行策略分析后，您将看到 MDM 支持率（也适用于 Windows），显示您的设置/策略中有多少也可以在 Endpoint Manager 中使用，以便从\
  \ GPO 1:1 迁移到 Intune 设置：\n\n按组策略名称或 Active Directory 目标搜索\n\n显示 1 到 1 条记录，共 1 条\n\

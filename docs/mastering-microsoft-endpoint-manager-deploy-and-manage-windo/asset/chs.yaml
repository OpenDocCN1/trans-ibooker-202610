- "# 14\n\n# 监控和 Endpoint Analytics\n\n部署桌面设备后，确保环境中物理和 Windows 365 云 PC 中 Windows\
  \ 以及应用程序的性能和质量水平非常重要。\n\n您将在本章中学习如何通过 Endpoint analytics、生产力评分以及 Microsoft Endpoint\
  \ Manager 的其他监控功能来实现这一目标。\n\n在本章中，我们将介绍以下主题：\n\n+   - 监控和分析\n+   - 监控您的物理和虚拟云终结点\n\
  +   - Endpoint analytics – 高级监控\n+   - 影响启动进程的前 10 名\n+   - 操作系统重启历史记录\n+   - 资源性能\n\
  +   - 见解和建议 – 评分趋势\n+   - 应用程序可靠性\n+   - Windows 365 特定指标\n+   - 见解和建议\n+   - 自定义基线\n\
  +   - 生产力评分\n+   - 服务运行状况\n\n## 监控和分析\n\n监控您的 Windows 10 企业版环境与实施它同样重要。用户体验是成功实施中最重要的部分。\n\
  \nMicrosoft Endpoint analytics 和生产力评分作为内置服务，使您能够在环境中可能遇到的问题发生之前提前应对。作为此服务的一部分，您无需额外环境或为基于消耗的资源付费；一切都包含在您的\
  \ Microsoft 365 许可证中。您将在本章中阅读与此相关的所有需要了解的内容！\n\n## 监控您的物理和虚拟云终结点\n\n如果您是现有的 Microsoft\
  \ Endpoint Manager 客户，您可能已经使用“设备”菜单中的“监视”选项。由于 Windows 365 等同于物理 Windows 10 企业版桌面，您可以在此处统一监控虚拟设备和物理设备，以获得统一的体验。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_523_0.png)\n\n# 图 14.1 – Microsoft Endpoint\
  \ Manager 管理中心\n\n您可以收集有关环境的见解，也可以考虑应用许可证、已发现应用、应用安装和应用保护状态等指标。\n\n以下是可用的不同监控仪表板的完整列表：\n\
  \n+   - **配置：**\n+     - 分配状态\n+     - 分配失败\n+     - 具有受限应用的设备\n+     - 加密报告\n+\
  \     - 证书\n+   - **合规性：**\n+     - 不合规设备\n+     - 没有合规性策略的设备\n+     - 设置合规性\n+\
  \     - 策略合规性\n+     - 不合规策略\n+     - Windows 运行状况证明报告\n+     - 威胁代理状态\n+   - **注册：**\n\
  +     - Autopilot 部署\n+     - 注册失败\n+     - 不完整的用户注册\n+   - **软件更新：**\n+     - 每个更新环的部署状态\n\
  +     - iOS 设备的安装失败\n+     - 功能更新失败\n+     - Windows 加速更新失败\n+   - **其他：**\n+  \
  \   - 设备操作\n\n例如，您可以轻松找出正在部署哪些应用以及成功数量，如下一节示例所示。\n\n## Endpoint analytics – 高级监控\n\
  \nEndpoint analytics 的主要目的是主动优化用户体验并在此过程中跟踪您的进度。作为 IT 管理员，它是您跟踪物理和虚拟桌面环境质量水平的主要仪表板。\n\
  \n您可以找到的指标显示了环境中所有 Microsoft Endpoint Manager 管理设备的价值，例如，您的物理设备与 Windows 10 或 11\
  \ 云 PC 合计的价值。\n\n以下是 Endpoint analytics 中当前可用的报告/仪表板列表：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_525_0.png)\n\
  \n图 14.2 – 环境概览\n\n### 启动性能 – 登录持续时间\n\n改善启动性能以优化从打开物理计算机到高效工作的时间，最适合在提高工作效率速度方面实现一致的性能。\n\
  \n查看您当前的分数，并将其与所选基线进行比较。参阅不同的见解和建议列表，了解如何改善设备启动时间和分数；这些可以在 Endpoint analytics 仪表板中找到。\n\
  \n\n\n\n\n以下是 Endpoint analytics 中可用的指标列表，按组织和每台用户设备级别划分，以便深入挖掘特定场景：\n\n- **Core\
  \ boot**：设备开机后达到登录提示的平均时间。排除操作系统更新时间：\n- **Group Policy**：设备核心启动期间处理组策略所花费的平均时间\n\
  - **To sign-in screen**：核心启动时间减去处理组策略所花费的时间\n- **Core sign-in**：用户登录后达到响应式桌面的平均时间。排除新用户登录和功能更新后的首次登录：\n\
  - **Group Policy**：设备核心登录期间处理组策略所花费的平均时间\n- **To desktop**：从登录到桌面渲染之间的平均时间，减去处理组策略所花费的时间\n\
  - **To responsive desktop**：从桌面渲染到 CPU 使用率降至 50% 以下之间的平均时间\n\n启动性能评分让 IT 部门了解从开机到投入生产的终端用户体验。有了这些见解，就能获得改进终端用户体验的建议。接下来，我们将介绍性能评分的细分。\n\
  \n## Performance score breakdown\n\n要计算租户的评分，我们会查看每台设备完成核心启动阶段所需的时间，并将每次体验从 0（较差）到\
  \ 100（卓越）进行评分。然后我们计算所有设备的平均分，以获得核心启动评分。\n\n在下面的屏幕截图中，您可以找到从物理机启动和登录过程到云 PC 甚至 Windows\
  \ 10 Enterprise 端点的完整登录过程的示例细分。\n\n## Startup score\n\nMeeting goals\n\nStartup\

  \ Access Messaging\n...\n\n图 16.40 – 允许应用访问位置\n\n3. 将设置更改为 Force allow，如以下屏幕截图所示：\n\
  \nHome > Windows >\n\n# Create device configuration profile\n\nWindows 10 and later\

  \n## 8\nApplication Management and Delivery\n\n在本章中，你将学习如何将 Microsoft 365 和业务线应用部署和管理到你的\
  \ Windows 10 端点，这是每个 Windows 10 Enterprise 部署中非常重要的一项要素。应用程序使终端用户保持生产力，但应用程序也可以是帮助终端用户或\
  \ IT 管理员的工具。\n\n在本章中，我们将介绍以下主题：\n\n- Application delivery via Microsoft Endpoint\
  \ Manager\n- Different application types you can deploy\n- Community tool – Win32App\
  \ Migration Tool\n- Deploying Microsoft 365 apps\n- Microsoft 365 Apps admin center\n\
  - Deploying Microsoft Teams\n- OneDrive\n- What is MSIX?\n\n## Application delivery\
  \ via Microsoft Endpoint Manager\n\n我们一直在解释使用统一端点管理解决方案从同一管理体验中获得的好处。当然，这些好处同样适用于向你的端点交付应用程序，无论它们是在虚拟云还是物理端点上运行\
  \ Windows 10 Enterprise，均可通过 Microsoft Endpoint Manager 进行管理。\n\n另一个重要层面是安全性。通常，安装应用需要安装权限，例如在\
  \ Windows 10 Enterprise 端点上需要本地管理员权限。通过 Microsoft Endpoint Manager 交付应用，你可以以模块化方式分配和安装应用，而无需将用户设为本地管理员。\n\
  \n将应用程序与映像分开模块化添加（单独添加）也将极大地简化你的映像维护流程。例如，在传统的虚拟桌面基础架构中，你会创建一个所谓的 master image。使用\
  \ Microsoft Endpoint Manager – Intune 则不需要此步骤，因为所有应用程序都可以与操作系统映像层分开管理。在你注册 Windows\
  \ 10 Enterprise 映像后，所有分配的应用程序都将根据用户、组或设备筛选自动添加。听起来很酷，对吧？\n\n要开始交付应用，你必须进入 Microsoft\
  \ Endpoint Manager 中的 **Apps** 菜单。你开始配置并将应用程序分配给你的用户或设备的旅程。很简单，并且支持不同的应用程序格式，其说明你将在本书的本章中找到。\n\
  \n## Different application types you can deploy\n\n向终端用户交付应用程序，无论他们主要使用物理还是虚拟云桌面，对企业来说都是一个非常重要的因素。\n\
  \n大多数企业多年来一直使用 SMS、ConfigMgr 和 **Microsoft Endpoint Configuration Manager (MECM)**\
  \ 来实现这一目标（面向其本地基础设施）。在 Microsoft Endpoint Manager – Intune 中，流程更简单，因为后端基础设施已预先构建，可几乎立即开始部署应用！\n\
  \n\n\n\n\n那么，针对每种操作系统，支持哪些应用格式作为交付类型呢？让我们为您全面介绍，以便您可以决定对您的业务来说最佳的方法。\n\n当您在 Microsoft\
  \ Intune 中创建新应用时，首先需要选择适合要交付到设备的应用的应用类型：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_295_0.png)\n\
  \n图 8.1 – 选择应用类型\n\n支持的 Windows 10 应用交付类型将在以下小节中详细介绍。\n\n## LOB 应用\n\n在 Intune 中，您可以使用不同的方法部署不同格式。支持的格式包括现代应用，例如\
  \ **Universal Windows Platform (UWP)** 应用和 **Windows App Packages (AppX)**，以及更经典的格式，例如\
  \ Win32 应用，包括简单的 **Microsoft Installer (MSI)** 程序包文件。\n\n### .MSI – 通过 LOB 应用\n\n\
  MSI 格式安装程序同时受 Intune 中 LOB 和 Windows 应用（Win32）选项支持，后者对应用依赖项的支持更完善。\n\n### MSIX –\
  \ 通过 LOB 应用\n\nMSIX 是 Microsoft 的新 Windows 应用程序包格式，为所有 Windows 应用提供现代化的打包体验。MSIX\
  \ 程序包格式保留了现有应用程序包和/或安装文件的功能，同时还为 Win32、WPF 和 Windows Forms 应用启用了新的现代打包和部署功能。我们将在本书后面更深入地介绍\
  \ MSIX。\n\nMSIX 结合了 MSI、.appx 和 App-V 的最佳功能。\n\n### AppX – 通过 LOB 应用\n\nAppX 应用分发文件格式首次随\
  \ Microsoft Windows 8 推出。也称为现代（UWP）应用，带有 AppX 扩展名的文件可直接用于分发和安装。\n\n在 Windows 10\
  \ Enterprise 的 Windows Store 中，应用会自动以 AppX – UWP 格式分发。\n\nAppX 对于分发支持多设备的应用非常有益，包括运行\
  \ Windows 的 PC、平板电脑和智能手机。\n\n> **重要提示**\n> \n> 当您使用 Autopilot 时，我们建议您不要将 LOB 应用与\
  \ Windows 32 应用（Win32）作为交付选项混合使用 – 您可以在 *第 7 章，管理 Windows Autopilot* 中找到更多相关信息。\n\
  \n要配置简单的 LOB 应用，在 Microsoft Endpoint Manager 控制台中，您必须在菜单中进入 Apps 以开始配置：\n\n### 企业内部应用\n\
  \n要添加自定义或内部应用，请上传应用的安装文件。确保文件扩展名与应用的预期平台匹配。Intune 支持以下企业内部应用平台和扩展：\n\n- Android\
  \ (APK)\n- iOS (IPA)\n- macOS (.IntuneMac)\n- Windows (.msi, .appx, .appxbundle,\
  \ .msix, 和 .msixbundle)\n\n了解更多\n\n图 8.2 – LOB 应用\n\n您可以通过 + Add 按钮开始配置：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_297_0.png)\n\
  \n图 8.3 – 所有应用\n\n以下菜单显示了之前提到的所有支持的应用类型。要开始以最简单的方式部署 MSI 文件的配置，您选择 Line-of-business\
  \ app。\n\n要以更高级的方式部署 MSI 文件和其他 Win32 应用格式，我们建议您使用 Windows 应用（Win32）选项 – 在下一节中进行说明：\n\
  \n> 重要提示\n> Win32 支持交付优化和设置依赖项，而 LOB 不支持这些。\n\n### 选择应用类型\n\n创建应用\n\n应用类型\n\n企业内部应用\n\
  \n### 企业内部应用\n\n要添加自定义或内部应用，请上传应用的安装文件。确保文件扩展名与应用的预期平台匹配。Intune 支持以下企业内部应用平台和扩展：\n\

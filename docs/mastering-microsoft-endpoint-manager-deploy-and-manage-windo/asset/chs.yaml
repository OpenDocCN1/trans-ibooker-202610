  \n\n\n\n\n## 自我故障排除和 Microsoft 支持\n\n以下部分将介绍作为**信息技术 (IT)** 部门，如何为用户提供最佳支持，以及如何向\
  \ Microsoft 请求支持。通过 **Microsoft Endpoint Manager (MEM)** 管理中心门户中的**故障排除 + 支持**，即可轻松请求支持。\n\
  \n你可以在此处查看不同支持工单主题的概览，以便为你的案例分配合适的支持工程师：\n\n- **Intune**\n  - 使用 Intune 管理设备\n \
  \ - Intune 设备的终结点分析\n- **Configuration Manager**\n  - Desktop Analytics\n  - Configuration\
  \ Manager 设备的终结点分析\n  - Configuration Manager 设备的租户附加\n- **共同管理**\n  - 由 Intune\
  \ 或 Configuration Manager 作为管理机构管理共同管理工作负载\n- **云电脑**\n  - 在任何设备上体验 Windows 的新方式\n\
  \n你可以在以下屏幕截图中查看**故障排除 + 支持**的概览：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_623_0.png)\n\
  \n图 17.1 – 故障排除 + 支持\n\n在“帮助和支持”下，选择“云电脑”选项以创建帮助台工单。\n\n之后，输入你遇到的问题的简要摘要。系统可能会根据你输入的内容提供解决方案。\n\
  \n如果没有，请单击“使用搜索描述问题并联系支持人员”，如下图所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_623_1.png)\n\
  \n图 17.2 – 联系支持人员\n\n## 域名解析\n\n一个非常常见的错误是：客户配置 Azure 环境并创建 Azure **虚拟网络 (VNet)**，却忘记将\
  \ VNet 上的 **DNS 服务器**设置更改为自己的域服务器。\n\n请始终确保将 **域名系统 (DNS)** 服务器更改为“自定义”，并输入你自己的\
  \ DNS 服务环境的**Internet 协议 (IP)** 地址，该环境能够解析你的 **Active Directory 域服务 (AD DS)** 域。\n\
  \n云电脑的注册将会失败。好消息是，前面在*第 3 章，介绍 Windows 365*中介绍的 Watchdog 服务也会通知你相关情况。\n\n以下屏幕截图显示了**DNS\
  \ 服务器**设置：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_625_0.png)\n\n图 17.4 – DNS\
  \ 服务器\n\n现在继续介绍故障排除中的网络部分，并进一步讨论需要检查并为流量列入允许列表的不同服务**统一资源定位符 (URL)**。\n\n## 服务 URL\
  \ 防火墙流量\n\n一些客户倾向于阻止所有出站流量，除非该流量经过验证。如果你的组织采用这种做法，则必须确保允许使用以下所有 URL 和端口。否则，部署将返回错误。\n\
  \n防火墙应允许访问两个 MEM 服务——Intune 和 Azure Virtual Desktop (AVD)——的流量。\n\n你可以对这些 URL 执行\
  \ `nslookup -type ping`，以检查连接是否正常。对于以下域，可以使用 80/443 TCP 端口作为出站端口：\n\n- portal.manage.microsoft.com\n\
  - *.manage.microsoft.com\n- m.manage.microsoft.com\n- login.microsoftonline.com\n\
  - *.officeconfig.msocdn.com\n- config.office.com\n- graph.windows.net\n- enterpriseregistration.windows.net\n\
  - sts.manage.microsoft.com\n- Manage.microsoft.com\n- i.manage.microsoft.com\n-\
  \ r.manage.microsoft.com\n- a.manage.microsoft.com\n- p.manage.microsoft.com\n-\
  \ EnterpriseEnrollment.manage.microsoft.com\n- EnterpriseEnrollment-s.manage.microsoft.com\n\
  \n除前面列表中提到的 MEM URL 外，还需将以下 AVD 指定的 URL 和端口列入允许列表：\n\n| 地址 | 出站传输控制协议 (TCP) 端口 |\
  \ 用途 |\n|---|---|---|\n| *.wvd.microsoft.com | 443 | 服务流量 |\n| gcs.prod.monitoring.core.windows.net\
  \ | 443 | 代理流量 |\n| production.diagnostics.monitoring.core.windows.net | 443 | 代理流量\
  \ |\n| *xt.blob.core.windows.net | 443 | 代理流量 |\n| *eh.servicebus.windows.net |\
  \ 443 | 代理流量 |\n| *xt.table.core.windows.net | 443 | 代理流量 |\n| catalogartifact.azureedge.net\
  \ | 443 | Azure Marketplace |\n| kms.core.windows.net | 1688 | Windows 激活 |\n| mrsglobalsteus2prod.blob.core.windows.net\
  \ | 443 | 代理和并行 (SXS) 堆栈更新 |\n| wvdportalstorageblob.blob.core.windows.net | 443\
  \ | Azure 门户支持 |\n| 169.254.169.254 | 80 | Azure 实例元数据服务 (IMDS) 终结点 |\n| 168.63.129.16\
  \ | 80 | 会话主机运行状况监视 |\n| cpcsacnrysalprodprna02.blob.core.windows.net<br>cpcsacnrysalprodprap01.blob.core.windows.net<br>cpcsacnrysalprodprau01.blob.core.windows.net<br>cpcsacnrysalprodpreu01.blob.core.windows.net<br>cpcsacnrysalprodpreu02.blob.core.windows.net<br>cpcsacnrysalprodprna01.blob.core.windows.net\
  \ |  | 云电脑缩放单元 |\n\n现在让我们进入 Windows 365 中最常见的错误：云电脑预配过程中的错误。\n\n## Windows 365 预配错误\n\
  \n在以下部分中，你将进一步了解 Windows 365 预配过程中出现的各种错误，这些错误属于 Watchdog 网络配置服务的检查范围。\n\n### 域加入失败\n\
  \nWindows 365 会尝试将云电脑加入你的本地 AD 域。此步骤失败可能由许多受组织控制的因素导致，但你可以按以下方式进行故障排除：\n\n- 请确保关联的**本地网络连接\
  \ (OPNC)** 中的 AD 域、**组织单位 (OU)** 和凭据正确。\n- 请确保域加入用户拥有执行域加入所需的足够权限。\n- 请确保 VNet 和子网能够正确访问域控制器。\n\
  \n`JsonADDomainExtension` 是用于执行域加入的 Azure 函数。请确保成功完成此操作所需的一切条件均已具备。\n\n**解决方法：**将\
  \ Azure **虚拟机 (VM)** 附加到已配置的 VNet，并使用提供的凭据执行域加入。\n\n### 混合 Azure AD 加入失败\n\nWindows\
  \ 365 不会代表客户执行任何 **混合 Azure AD 加入 (HAADJ)** 操作。HAADJ 必须作为云电脑的先决条件进行配置，并且运行状况良好。\n\
  \n如果预配因 HAADJ 失败，可能是因为 AD Connect 同步服务配置的同步周期不足。请确保 Microsoft Azure AD Connect 配置为每\
  \ 30 分钟同步一次 AD 计算机对象，且同步间隔不超过 60 分钟。如果 Azure AD 对象未在 90 分钟内出现，此步骤将超时。\n\n另一个需要考虑的因素是本地\
  \ AD 复制时间。请确保用于 Windows 365 的域控制器能够足够快地完成复制，使对象在此超时窗口内进入 Azure AD。\n\n**解决方法：**检查\
  \ AD 对象是否出现在正确的 OU 中，并确认其已在预配超时之前成功同步到 Azure AD。\n\n### 缺少 SCP 记录\n\n你可能需要修改混合 Azure\
  \ AD 配置，才能成功预配云电脑。Azure AD Connect 会同步计算机对象，而计算机通过查找 AD 中的服务连接点 (SCP) 对象来确定要注册到哪个\
  \ Azure AD 域。你可以在 ADSI Edit 工具中找到这些对象，路径为 `CN=Configuration | CN=Services | CN=Device\
  \ Registration Configuration`。你将看到一个全局唯一标识符 (GUID)，并且在该记录中会看到一个多字符串值，其中包含 Azure\
  \ AD 租户名称和 GUID，如以下屏幕截图所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_629_0.png)\n\
  \n图 17.5 – ADSI Edit\n\n如果缺少这些记录，可以在混合配置过程中使用 Azure AD Connect 创建它们（https://docs.microsoft.com/azure/active-directory/devices/hybrid-azuread-join-managed-domains），如下图所示：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_630_0.png)\n\n图 17.6 – SCP 配置\n\n在某些情况下，你可能只希望某个\
  \ OU 中的特定计算机执行 HAADJ。为此，请跳过 SCP 记录创建操作，而是创建自定义组策略对象 (GPO)，并将其链接到云电脑所在的 OU（https://docs.microsoft.com/azure/active-directory-domain-services/manage-group-policy#create-a-custom-group-policy-object）。在\
  \ GPO 中，你需要创建两个注册表项，其值名称分别为 `TenantId` 和 `TenantName`，如下例所示：\n\n\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_631_0.png)\n\
  \nFigure 17.7 – GPO Policy Management Editor\n\n你将云 PC 添加到的 OU 不在 Azure AD Connect\
  \ 同步的范围内。\n\n如果你创建了一个新的 OU，那么它很可能未被包含，你需要返回 Azure AD Connect 并将其包含在同步规则中，如以下屏幕截图所示：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_631_1.png)\n\nFigure 17.8 – Azure AD\
  \ Connect domain filtering\n\n## Azure AD 同步和复制导致延迟\n\n云 PC 部署过程在 90 分钟后超时，而你的环境可能配置为引入不必要的延迟。让我们讨论同步和复制导致此问题发生的两种场景。\n\
  \n## Azure AD 同步间隔\n\n默认的 Azure AD Connect 同步间隔为每 30 分钟。完成同步过程所需的时间取决于 Azure AD\
  \ Connect 处理的对象数量。\n\n为了防止你的云 PC 超时，你需要确保同步间隔和同步时间小于 90 分钟。首先，确认你的 Azure AD Connect\
  \ 同步服务正在运行，并且其间隔未被延长，例如延长至每 2 小时。有关说明，请参阅 Azure AD Connect sync: https://docs.microsoft.com/azure/active-directory/hybrid/how-to-connect-sync-feature-scheduler。接下来，如果你正在同步大量对象，请查阅本文档以了解如何优化环境：https://docs.microsoft.com/azure/active-directory/hybrid/plan-connect-performance-factors。\n\
  \n## AD DS 站间复制\n\n考虑以下 AD DS 拓扑。我们有一个站点上的域控制器运行 Azure AD Connect，而云 PC 部署服务用于创建计算机对象的域控制器位于另一个站点，如以下屏幕截图所示：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_632_0.png)\n\nFigure 17.9 – Azure AD\
  \ Connect topology\n\n我们之前解释过，Azure AD Connect 同步间隔和同步时间需要在云 PC 部署超时之前完成（90 分钟）。此场景增加了另一个需要考虑的时间：域的站间复制时间。该默认值是\
  \ 15 分钟，如果将其添加到计算机对象出现在 AD DS 中然后出现在 Azure AD 中的总可能时间，则会产生新的总时间为 1 小时，如以下图表所示：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_633_0.png)\n\nFigure 17.10 – Azure AD\
  \ sync cycle\n\n这是理论上的最大时间，并不适用于每个组织；然而，我们见过长时间的站间复制导致超时问题的例子。结论是，如果你由于规模和复杂性导致同步时间较长，请尽量减少其他可能的延迟。凭借现代的连接性，很少有理由限制站间同步间隔，因此你可能需要考虑将复制设置为默认的\
  \ 15 分钟。\n\n感谢并致谢 Steven DeQuincey，Microsoft 365 for Partners 的 Field PM，为本节做出贡献。\n\
  \n## Intune 注册失败\n\nWindows 365 会将设备基于的移动设备管理（MDM）注册到 Intune。这应该非常可靠。\n\n如果 Intune\
  \ 注册失败，请确保云 PC 的 VNet 上所有必需的 Intune 端点均可用。还请确保租户上没有 MDM 注册限制，并且 Intune 租户处于活动且健康状态。\n\
  \nResolution: 使用测试设备或 VM 尝试 Intune 注册。\n\n## 没有足够的 IP 地址可用\n\n向 OPNC 提供子网时，请确保有足够的\
  \ IP 地址。\n\n每次云 PC 部署过程都会使用提供的范围内其中一个 IP 地址。\n\n如果部署失败，将重试总共三次。每次都会分配新的 **虚拟网络接口卡（vNIC）**\
  \ 和 IP 地址。这些 IP 地址会在数小时内释放，但如果地址空间太窄，这可能会导致问题。\n\n**Resolution:** 检查 VNet 中可用的 IP\
  \ 地址，并确保有足够多的 IP 地址可供重试过程成功。\n\n## 未找到部署策略\n\n部署进行中时，有人删除了部署策略。\n\n**Resolution:**\
  \ 确保部署策略可用并且已分配给正确的用户组。\n\n## 未找到用户\n\n部署进行中时，有人删除了关联的用户。\n\n**Resolution:** 确保分配的用户帐户有效。\n\
  \n## 未找到许可证\n\n部署进行中时，有人移除了用户的 Windows 365 许可证。\n\n**Resolution:** 确保用户已为其帐户分配了有效的\
  \ Windows 365 许可证。\n\n## 请求被策略禁止\n\nWindows 365 使用客户提供的 VNet 将云 PC VM 的 vNIC 摄取到客户的\
  \ VNet 中。企业有时会实施 Azure 策略来限制某些 Azure 对象的创建。\n\n**Resolution:** 在 Azure 门户中查看 **Policy**，并查找任何会阻止\
  \ Windows 365 服务部署云 PC 的策略事件。\n\n## OPNC 不健康\n\n如果关联的 OPNC 不健康，云 PC 部署将被阻止。\n\n\
  OPNC 每 6 小时刷新一次。如果部署进行中时 OPNC 刷新失败，将导致整个部署过程失败。\n\n**Resolution:** 确保 OPNC 健康并重试部署。\n\
  \n## Web Proxy Auto-Discovery（WPAD）问题\n\n云 PC 服务使用 AVD 代理连接到虚拟化控制平面的代理服务。当你通过 DNS\
  \ 使用 WPAD 使用代理时，可能会遇到诸如机器帐户不被允许连接到 AVD 和 MEM 的服务 URL 的问题。\n\n**Resolution:** 允许机器帐户或网络中的\
  \ IP 地址通过互联网连接到服务 URL 列表。作为替代方案，你可以删除代理设置，使其不再应用于云 PC，并使用直接路由到互联网（推荐）。\n\n## 用户名和密码不正确或加入域的权限不足\n\
  \nWindows 365 Enterprise 需要域环境才能将云 PC 加入你的 AD 域。\n\n**Resolution:** 为此创建并在 OPNC\
  \ 中配置的 AD 服务帐户需要具有以下权限：\n\n- 1. **在 OU 中创建计算机对象**（将计算机加入域）。\n- 2. **在 OU 中删除计算机对象**（用于取消部署云\
  \ PC 以从 AD 中删除计算机帐户）。\n- Permissions to enumerate user objects so that they can\
  \ be found, to be added to the local `Remote Desktop Users` group when provisioning.\n\
  \n另一个问题可能是你只是输入了错误的凭据！\n\n## 无法访问 DSC 文件\n\n在部署期间无法访问 **Desired State Configuration（DSC）**\
  \ 文件会导致失败，并显示以下消息：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_635_0.png)\n\nFigure\
  \ 17.11 – Failure message\n\n**Resolution:** 确保防火墙访问已正确配置以允许 DSC 端点通过以下地址：\n\n-\
  \ `prod.warmpath.msftcloudes.com`\n- `cpcsacnrysalprodprna01.blob.core.windows.net`（北美）\n\
  - `cpcsacnrysalprodprna02.blob.core.windows.net`（北美）\n- `cpcsacnrysalprodprap01.blob.core.windows.net`（亚太）\n\
  - `cpcsacnrysalprodprau01.blob.core.windows.net`（澳大利亚）\n- `cpcsacnrysalprodpreu01.blob.core.windows.net`（欧盟）\n\
  - `cpcsacnrysalprodpreu02.blob.core.windows.net`（欧盟）\n- `mrsgglobalsteus2prod.blob.core.windows.net`\n\
  - `catalogartifact.azureedge.net`\n- `kms.core.windows.net`\n\n要检查这是否是网络连接 URL 访问问题，你可以尝试以下操作：\n\
  \n- 1. 对你所在区域的 Azure 容器执行 nslookup 操作，以检查你是否可以使用组织的 DNS 服务器解析，如以下屏幕截图所示：\n\n```\n\
  C:\\WINDOWS\\system32>nslookup cpcsacnrysalprodpreu01.blob.core.windows.net\nServer:\
  \  UnKnown\nAddress:  172.16.0.1\n\nNon-authoritative answer:\nName:    blob.dub07prdstr05a.store.core.windows.net\n\
  Address:  52.239.138.100\nAliases:  cpcsacnrysalprodpreu01.blob.core.windows.net\n\
  ```\n\nFigure 17.12 – nslookup on Azure container\n\n\n\n\n2. 如果 DNS 解析成功，则使用 PsPing\
  \ 检查是否可以建立连接（无法通过浏览器完成此操作，因为无法进行身份验证），如下图所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_637_0.png)\n\
  \n图 17.13 – 使用 PsPing 检查连接\n\n## 云电脑 – 基于设备的筛选\n\n你可能会遇到这样的情况：你已经配置了 MEM 租户来管理物理端点。现有策略、应用程序交付规则或其他配置项在\
  \ MEM 管理中心控制台的 Windows 365 窗格中可能会被筛选为“所有设备”。这可能会导致冲突，因为在某些情况下，该设置应仅适用于物理环境。\n\n\
  所有云电脑设备都有一个特定的型号名称（包含 Cloud PC）和一个注册配置文件名称（与云电脑预配配置文件相同），可以使用这些名称在“所有设备”分配中筛选出它们。\n\
  \n## 用户收到错误“你对此 Cloud PC 的访问将在 5 天后结束。请立即备份你的文件”\n\n当你在 Windows 365 门户中看到上述错误时，表示\
  \ IT 管理员已从你的用户帐户中移除 Windows 365 许可证。Cloud PC 不会立即被删除，而是会进入 7 天的宽限期。\n\n要解决此问题，IT\
  \ 管理员必须重新分配许可证，以避免最终用户的数据丢失，如下图所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_638_0.png)\n\
  \n图 17.14 – 许可证丢失错误\n\n你可以在这里找到此错误如何呈现给最终用户的屏幕截图：\n\n你可以通过远程桌面客户端找到该工具。当你在顶栏中有一个活动会话时，右键单击该栏并选择“体验监视器”，如下图所示：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_640_0.png)\n\n图 17.16 – 体验监视器\n\n单击“查看详细信息”，如下图所示：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_640_1.png)\n\n图 17.17 – 查看详细信息\n\n以下屏幕显示有关活动连接的所有相关信息。它还显示了该服务所使用的网关：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_641_0.png)\n\n图 17.18 – 诊断信息\n\n你也可以直接从此处将诊断信息发送给\
  \ Microsoft，以附加到你的支持工单中，用于故障排除。\n\n请确保满足连接的网络带宽要求，如第 4 章“部署 Windows 365”中的远程桌面连接要求表所列。\n\
  \n你现在已经了解了许多最常见的错误，以及可用于分析和跟踪用户体验（UX）的工具。大多数情况下，Endpoint Analytics 会帮助你并主动警告你环境中的错误；但是，了解自己可以做些什么来解决问题总是好的！\n\
  \n## 总结\n\n在本章中，你了解了在 Windows 365/云电脑注册过程中可能发生的大部分部署错误。\n\n读完本章后，你掌握的知识将帮助你在体验新服务时解决任何错误！在下一章中，你将找到社区中的众多专家，从他们那里你可以获得有关该主题的更多知识。\n\

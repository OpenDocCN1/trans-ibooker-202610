  Control which extensions cannot be installed   Enabled\nExtension IDs the user should\
  \ be prevented from installing (or * for all)   1 item\n\nFigure 10.2 – Microsoft\
  \ Edge baseline – Configuration settings\n\n本节关于 Microsoft 安全基线的介绍到此结束。接下来，我们将介绍\
  \ Endpoint security policies。\n\n## Configuring your Endpoint security profile\n\
  \nMicrosoft Intune 的 **Endpoint security** 节点旨在允许 IT 或安全管理员配置设备安全。通过使用这些以安全为重点的策略，你将仅在此刀片视图中看到与安全相关的策略，而不会看到其他类型设置的常规策略。Endpoint\
  \ Security 刀片中的策略可以应用于 Windows 或 macOS。这些策略可以是 Windows 10 MDM（Microsoft Intune）或\
  \ Windows 10 和 Windows Server（ConfigMgr）。最后一种适用于未加入 Microsoft Intune 的租户附加设备。\n\n\
  ## Microsoft Defender policy\n\n防病毒策略包含与设备配置策略的端点保护或设备限制配置文件相同的设置。\n\n然而，这些策略类型包含与防病毒策略无关的额外设置类别。虽然\
  \ **Endpoint security** 刀片中的 Windows Defender 策略类型仅包含 Windows Defender 设置，但你可以在此处看到三种不同的策略类型：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_377_0.png)\n\nFigure 10.3 – Windows Defender\
  \ policy types\n\n## Profile: **Windows Security experience**\n\nWindows Security\
  \ 应用由多个 Windows 安全功能使用，以提供有关机器健康和安全状态的通知。安全应用通知包括防火墙、防病毒产品和 Windows Defender SmartScreen。\n\
  \nWindows Security experience 配置文件可用于关闭 Windows Security 应用中的某些区域，例如家庭选项，如果你不想在\
  \ Intune 管理的设备上显示家庭选项：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_378_0.png)\n\n\
  Figure 10.4 – Windows Security app\n\n一个很好的例子是 **Application control** 策略类型。\n\n\
  **Application control** 策略可以帮助缓解安全威胁。它通过限制用户允许运行的应用程序以及在系统核心（内核）中运行的代码来实现这一点。Application\
  \ control 策略还可以阻止未签名的脚本和 Windows Installer（MSI），并将 Windows PowerShell 限制为在受限语言模式下运行。\n\
  \n通过几个设置，你可以轻松加固你的 Windows 操作系统：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_381_0.png)\n\
  \nFigure 10.8 – Microsoft Defender Application control policy\n\n现在，让我们启用 Windows\
  \ SmartScreen（不仅限于 Microsoft Edge，正如本章后面将展示的）。\n\n将 **App locker application control**\
  \ 设置为 **Enforce Components, Store Apps, and Smartlocker** – 这将启用 **Windows Defender\
  \ Application Control (WDAC)**，以便仅以下内容可以在 Windows 操作系统上执行：\n\n- Windows components\n\
  - Third-party hardware and software kernel drivers\n- Microsoft Store-signed apps\n\
  - [Optional] Reputable apps, as defined by the **Intelligent Security Graph (ISG)**\n\
  \nWDAC 策略适用于整个受管理的计算机，并影响设备的全部用户。\n\n设置目录中的设置直接从 Windows CSP 生成，并且目录中的设置体验是根据设置的类型及其元数据（如工具提示）动态生成的。设置目录不断添加新的\
  \ Windows 设置，并减少了从 Microsoft Intune 部署自定义策略（基于 OMA-URI）的需求。设置目录中的新功能之一是，如果某个设置不在你的策略中，则该设置将被视为未配置。稍后编辑策略并从现有的设置目录策略中删除一个设置，不仅会将该设置从策略中删除，而且在下一次设备检查入时，还会从已分配的设备上删除先前的强制执行。\n\
  \n设置目录中有数千个设置可供选择，其中包括 Microsoft Intune 中任何其他策略类型中都没有且之前在控制台中不可用的设置。你还可以在设置目录中配置\
  \ Administrative Templates。随着 Windows 向 MDM 提供商添加或公开更多设置，这些设置会迅速添加到 Microsoft Intune\
  \ 设置目录中以供配置。\n\n要使用设置目录创建配置文件，请打开 Microsoft Endpoint Manager 管理中心：\n\n1. Go to Home\

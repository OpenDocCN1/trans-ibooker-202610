  \n## 6\n\n### Windows Deployment and Management\n\n在本章中，您将清楚地了解如何使用 Microsoft Endpoint\
  \ Manager 的 Intune 为不同的云 PC 和物理 PC Microsoft Endpoint Manager 管理的终端场景部署和更新 Windows\
  \ 10 Enterprise。您将了解不同的部署方法和可用于在企业级别提供 Windows 更新和管理 的其他功能。\n\n+   在本章中，我们将介绍以下主题：\n\
  +   \n+   - 将现有 Windows 设备部署到 Microsoft Endpoint Manager\n+   - 那本地设备呢？\n+     -\
  \ Co-management\n+     - Tenant attach\n+   - Microsoft Surface 和其他 **Original Equipment\
  \ Manufacturer (OEM)** 设备\n+   - Windows Update for Business\n+   - Windows 10 和\
  \ Windows 11 更新通道\n\n## Deploying existing Windows devices into Microsoft Endpoint\
  \ Manager\n\n*此场景仅适用于物理 Windows 终端。*\n\n在当今的企业公司中，正常的做法是利用来自 Microsoft Endpoint\
  \ Manager Configuration Manager 或 Microsoft Deployment Toolkit 的操作系统部署。\n\nMicrosoft\
  \ Deployment Toolkit 更简单，因为它只需要访问一个共享位置，在那里存储 Windows 10 操作系统驱动程序应用程序。\n\nConfiguration\
  \ Manager 和 Deployment Toolkit 通常要求设备位于本地以加入企业 **Active Directory (AD)**，并访问 **Preboot\
  \ eXecution Environment (PXE)** 服务器才能开始操作系统部署。\n\n在过去的几十年里，企业公司开始删除 OEM 为使设备以最佳方式运行\
  \ Windows 10、驱动程序以及在全新设备上实现最佳性能所需的一系列设置所做的工作。这是通过利用 *wipe and load* 映像概念完成的，并且只有公司批准安装在设备上的内容才会被安装。通常，这将是旧版本的\
  \ Windows、旧版本的驱动程序和 Microsoft Enterprise 应用。\n\n如果能更简单地从任何地方完成此操作就好了。随着 Covid-19\
  \ 的爆发，几乎所有人都开始在家工作，幸运的是，现代技术让我们能够摆脱物理位置的束缚，转向随时随地工作。这也包括将全新设备配置到最终用户的家庭地址，而无需最终用户去办公室领取新设备。今天，这可以通过现代配置来实现，称为\
  \ **Windows Autopilot**。我们将在本章中对 Windows Autopilot 进行高层次介绍，并在下一章中通过真实案例进行更深入的介绍。\n\
  \nWindows Autopilot 是一组不同的技术组件，它们汇聚成一项服务，用于开箱即用地配置新设备，使其准备好投入生产使用。Autopilot 的好处是，您也可以在需要重新开始时使用它来重置、重新利用和从头恢复设备。所有这些都是为了让\
  \ IT 部门摆脱这些工作；无需管理基础设施，因为 Autopilot 作为 Microsoft Endpoint Manager 内的云服务运行，因此简单易用，可以更快地提高生产力！\n\
  \n## Enrolling devices – Windows enrollment\n\n在本节中，我们将了解 Windows 10 PC 可以通过用户或管理员以多种不同方式注册到\
  \ Intune 的方法，您可以在管理中心门户中在 **Devices | Enroll devices | Windows enrollment** 下找到。\n\
  \n> **Important Note**\n> \n> Windows 365 Cloud PCs 会自动注册到 Microsoft Endpoint Manager\
  \ 的 Intune。\n\n## Automatic enrollment\n\n本节介绍配置 Windows 设备在加入或注册到 **Azure Active\
  \ Directory (AAD)** 时进行注册。我们已在上一章 *Chapter 5, Requirements for Microsoft Endpoint\
  \ Manager* 中介绍过此内容，因此请返回该章节以了解更多信息。\n\n您在此处看到 Windows enrollment 仪表板，这是配置该部分大多数元素的起点：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_199_0.png)\n\nFigure 6.1 – Windows enrollment\n\
  \n## Testing company domain CNAME registration for Windows enrollment\n\n在 DNS 中配置\
  \ CNAME 可以让您的用户在注册 Windows 设备时无需输入 **Mobile Device Management (MDM)** 服务器的地址。\n\n\
  在 DNS 中配置 CNAME 资源记录后，输入相应的域以确认其已正确配置。\n\nDNS 记录的更改可能需要长达 72 小时才能传播。您可以在以下屏幕截图中找到使此操作成为可能的配置选项：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_200_0.png)\n\nFigure 6.2 – CNAME validation\
  \ setup\n\n让我们现在切换到 **Enrollment Status Page** 屏幕，了解有关您注册到 Microsoft Endpoint Manager\
  \ 的结果和状态的更多信息。\n\n## Enrollment Status Page\n\n**Enrollment Status Page** 屏幕显示新设备注册后以及新用户登录设备时的配置进度。这使\
  \ IT 管理员可以选择性地阻止（阻止）设备访问，直到其完全配置完成，同时为用户提供有关配置过程中剩余任务的信息。\n\n默认注册状态页适用于所有用户和所有设备，但您可以创建多个具有不同配置的注册状态页配置文件，以满足您的场景需求。\n\
  \n这些配置文件按优先级顺序指定；将使用适用的最高优先级。每个注册状态页配置文件都可以针对包含设备或用户的组。当确定使用哪个配置文件时，将遵循以下标准：\n\n\
  +   - 首先使用针对设备的最高优先级配置文件。\n+   - 如果没有针对设备的配置文件，则将使用针对当前用户的最高优先级配置文件。（这仅适用于有用户的场景。在白手套和自部署场景中，只能使用设备定位。）\n\
  +   - 如果没有针对特定组的配置文件，则将使用默认注册状态页配置文件。\n\n注册状态页不仅适用于 Windows Autopilot 设备，还适用于分配给用户或设备的、注册到\
  \ Microsoft Intune 的所有设备。\n\n我们将在下一章中深入介绍 Windows Autopilot，包括如何设置它以及如何为不同场景配置注册状态页。\n\
  \n在以下屏幕截图中，您可以看到如何在 Enrollment Status Page 屏幕上捕获设备：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_201_0.png)\n\
  \nFigure 6.3 – Enrollment Status Page screen\n\n\n\n\n\n部署 Windows Autopilot 后，组织保持与最新\
  \ Windows 版本同步非常重要。许多公司将此称为 *保持常绿*。为了帮助您的组织保持最新，您应考虑使用 Windows Update for Business。\n\
  \n## 现有基础架构怎么办？\n\n我们在前两章中讨论了 Microsoft Endpoint Manager 的更广泛的统一端点管理概念，解释了您可以从单一统一仪表板控制台管理和维护所有设备。\n\
  \n我们也认识到，并非所有客户都会直接以 AAD 管理的方式迁移到 Microsoft Endpoint Manager。因此，在 Microsoft Endpoint\
  \ Manager 中也支持共同管理现有的本地 Windows 10 设备和混合 AAD 加入的设备。这将为您的混合配置创建相同的统一端点管理体验。\n\n##\
  \ 共管和租户附加\n\n共管并不是一项新功能，因为它已经存在一段时间了。共管使工作负载能够从 Configuration Manager（前称 **System\
  \ Center Configuration Manager (SCCM)**）迁移到 Microsoft Endpoint Manager 的 Intune。它告诉由\
  \ Configuration Manager 管理的 Windows 10 客户端不同工作负载的管理权限属于谁，并且还允许您从 Microsoft Endpoint\
  \ Manager 控制台查看和管理它们。简单来说，共管设备同时由 Configuration Manager 和 Microsoft Endpoint Manager\
  \ 管理。\n\n租户附加则有所不同，并且在管理能力方面有限，因为租户附加仅使您可以将 Configuration Manager 环境添加到 Microsoft\
  \ Endpoint Manager 中，这意味着您可以利用 Microsoft Endpoint Manager 中可用的功能。租户附加允许您使用 MEM 门户对\
  \ Configuration Manager 管理的客户端执行操作，例如安装应用、运行脚本等。\n\n例如，通过共管，您现有的 Windows 10 企业端点主要通过\
  \ Configuration Manager 接收应用部署和安全策略，而它则查看 Intune 以获取合规策略和设备配置策略。这有助于企业在不直接对 Microsoft\
  \ Endpoint Manager 进行影响重大的切换的情况下，结合 Configuration Manager 和 Microsoft Endpoint Manager\
  \ 的优势。\n\n或者，创建集合以仅将某些设备添加到 Microsoft Endpoint Manager **Devices** 菜单中，如下图所示的第二个选项：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_206_0.png)\n\n图 6.6 – 共管配置向导\n\n设置完成后，以下完成确认应会弹出在屏幕上，以确认一切按预期进行：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_207_0.png)\n\n图 6.7 – 共管配置向导\n\n设备现已添加。\n\
  \n此外，当您希望在 Endpoint Analytics 中除了 Microsoft Endpoint Manager 管理的设备外，还主动监控您的设备时，请确保选择\
  \ **Enable Endpoint Analytics for devices uploaded to Microsoft Endpoint Manager**\
  \ 选项。\n\n在下面的屏幕截图中，您可以看到如何将设备信息从 Configuration Manager 环境上传到 Endpoint Analytics。您将在\
  \ *第 14 章，监控和 Endpoint Analytics* 中了解更多关于 Endpoint Analytics 的信息：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_208_0.png)\n\
  \n图 6.8 – Endpoint Analytics 上传设置\n\n我们将在本书后面更深入地讨论 Endpoint Analytics 的好处，如果您想了解更多关于监控上下文中附加价值的信息。\n\
  \n向导完成后，在 Configuration Manager 控制台中，您将在 **Cloud Services | Co-management** 下看到与\
  \ Microsoft Endpoint Manager 租户的连接，如下图所示：\n\n图 6.9 – Configuration Manager 中的共管概览\n\
  \n如果一切操作正确，您的设备也将显示在 Microsoft Endpoint Manager 管理中心控制台中，在 All devices 下：\n\n图 6.10\
  \ – Microsoft Endpoint Manager 中的设备状态\n\n## 何时使用何种解决方案\n\n可能有点令人困惑，不知道何时为您的组织使用何种管理方案，因此这里有一个快速表格来澄清这一点：\n\
  \n| Identity | Management | Provisioning |\n|---|---|---|\n| Active Directory only\
  \ | Configuration Manager + tenant attach | OS deployment |\n| Hybrid AAD-joined\
  \ | Microsoft Endpoint Manager's Intune or tenant attach + co-management | Microsoft\
  \ Endpoint Manager and other OS deployments (Configuration Manager/Microsoft Deployment\
  \ Toolkit (MDT)) Windows 365 Cloud PC Enterprise |\n| AAD only | Co-management or\
  \ Microsoft Endpoint Manager's Intune | Windows Autopilot Windows 365 Cloud PC Business\
  \ |\n\n这将帮助您做出最符合当前以及未来场景的决定。好消息是，Microsoft Endpoint Manager 从统一可管理性的角度支持所有这些方案，同时您正在朝着\
  \ Microsoft 云中的完全现代管理之旅努力！\n\n共管的设备，或注册到 Intune 的设备，可能直接加入 AAD，也可能是混合 AAD 加入，但它们必须具有云身份。\n\
  \n## Windows Update for Business\n\n在第一章中，我们介绍了 Windows Update for Business 的概述。在本章中，我们将介绍如何进行配置。\n\
  \n当您使用 Windows Update for Business 来管理和控制更新工作流的设备时，有几个策略值得关注。为了在保持对用户生产力影响谨慎的同时最大化更新速度，Microsoft\
  \ 建议了一组特定的策略及其推荐值。在本节中，我们将介绍这些策略以及如何配置它们。\n\n本节中的 Windows Update for Business 策略适用于\
  \ Microsoft Intune 或将 Windows Update 策略工作负载设置为 Microsoft Intune 的共管设备。\n\n## Windows\
  \ Update for Business 管理的更新类型\n\nWindows Update for Business 旨在为 IT 管理员提供管理对 Windows\
  \ 10 设备多种类型更新的策略的能力：\n\n- **功能更新：** 以前称为 **升级**，功能更新包含重大的功能新增和更改以及安全和质量修订。功能更新每年在秋季（H1）和春季（H2）发布两次。\n\
  - **质量更新：** 质量更新是传统的操作系统更新，通常在每个月的第二个星期二发布，尽管它们可能在任何时间发布。这些包括驱动程序、安全和关键更新。\n- **驱动程序更新：**\
  \ 与您的设备相关的非 Microsoft 驱动程序的更新。驱动程序更新默认开启，但您可以使用 Windows Update for Business 策略将其关闭（如果您愿意）。\n\
  - **Microsoft 产品更新：** Windows Update for Business 还将非 Windows 更新（例如 Microsoft Office、.NET\
  \ 或 Visual Studio 的更新）视为质量更新。这些非 Windows 更新称为 **Microsoft 更新**，您可以设置设备是否与 Windows\
  \ 更新一起接收此类更新（或不接收）。\n\n但首先，Windows 更新是如何工作的？Windows 更新过程分为四个阶段：\n\n1. **扫描：** 设备在随机间隔检查\
  \ Microsoft 更新服务器或您的 **Windows Server Update Services (WSUS)** 端点，以查看自上次搜索更新以来是否添加了任何更新，然后通过检查管理员设置的上游准则（例如组策略）来评估更新是否合适。此过程对用户不可见。\n\
  2. **下载：** 一旦设备确定更新可用，它就开始下载更新。下载过程对用户不可见。对于功能更新，下载发生在多个顺序阶段。\n3. **安装：** 更新下载后，根据设备的\
  \ Windows Update 设置，更新会安装到系统上。\n4. **提交和重启：** 安装后，设备通常（但并非总是）必须重启才能完成安装并开始使用更新。在此阶段之前，设备运行软件的先前版本。\n\
  \n在流程的每个阶段，都有通过策略和设置提高速度的机会，我们的建议如下。\n\n\n\n\n\n## 强制执行更新合规性截止日期\n\n为许多组织部署功能或质量更新只是管理其设备生态系统的部分工作。下一个重要部分是对更新合规性执行强制管控的能力。Windows\
  \ Update for Business 提供了相关控制措施，用于管理设备应迁移到更新版本的截止日期。\n\n## 如何处理冲突或旧版策略\n\n我们有时会发现，管理员为设备同时设置了组策略设置和来自\
  \ MDM 服务器（如 Microsoft Intune）的 MDM 设置。根据这些策略的最终配置方式，策略冲突会以不同方式处理：\n\n-   **Windows\
  \ 更新**：组策略设置优先于 MDM。\n-   **Microsoft Intune**：如果在两个不同的组上为同一策略设置了不同的值，您将收到一条警报，并且在该冲突解决之前，两个策略都不会生效。\n\
  \n对于组织中的设备，禁用相互冲突的策略以确保其按预期更新至关重要。例如，如果设备对您的 MDM 策略更改没有反应，请检查是否通过组策略设置了具有不同值的类似策略。\n\
  \n如果您发现更新速度未达到预期，或者某些设备比其他设备慢，那么可能是时候清除所有策略和设置，仅指定本文档中概述的建议更新策略了。\n\n## 如何设置和配置\
  \ Windows Update for Business\n\nMicrosoft Intune 提供了两种策略类型来管理 Windows Update for\
  \ Business：\n\n-   **Windows 10 更新圈**：此策略是一组设置，用于配置 Windows 10 更新的安装时间。自 Windows\
  \ 10 版本 1607 起就支持 Windows 10 更新圈策略，因此这并不是什么全新功能。\n-   **Windows 10 功能更新**：此策略将设备更新到您指定的\
  \ Windows 版本，然后冻结这些设备上的功能集版本。此版本冻结将一直保持，直到您选择将其更新到更高的 Windows 版本。虽然功能版本保持不变，但设备可以继续安装适用于其功能版本的质量和安全更新。Windows\
  \ 10 功能更新策略支持运行 Windows 10 版本 1709 或更高版本的设备。\n\n设置和配置 Windows Update for Business\
  \ 的步骤如下：\n\n-   **1.** 登录 Microsoft Endpoint Manager 管理中心 (https://endpoint.microsoft.com)。\n\
  -   **2.** 选择“设备”|“Windows”|“Windows 10 更新圈”|“创建配置文件”：\n-   **3.** 在“更新设置”部分，填写“服务通道”、“质量更新延迟期”和“功能更新设置”：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_213_0.png)\n\n图 6.11 – 创建 Windows 10\
  \ 更新圈\n\n### 更新设置\n\n| 设置 | 值 |\n| --- | --- |\n| 服务通道 | 半年度通道 |\n| Microsoft 产品更新\
  \ * | 允许 / 阻止 |\n| Windows 驱动程序 * | 允许 / 阻止 |\n| 质量更新延迟期（天） * | 0 |\n| 功能更新延迟期（天）\
  \ * | 0 |\n| 设置功能更新卸载期（2 - 60 天） * | 10 |\n\n图 6.12 – 创建 Windows 10 更新圈\n\n对于**服务通道**，**半年度通道**是默认选项，也是用于生产的通道；而如果您在**服务通道**中选择**Windows\
  \ Insider**，则 Microsoft Intune 会自动配置 Windows 更新设置，以便 Windows Insider 版本可以正常工作。有关\
  \ Windows Insider for Business 的更多信息，请参阅后续章节。\n\n以下是更新圈不同配置设置的细分：\n\n-   半年度通道\n\
  -   半年度通道（定向）适用于 1809 及以下版本\n-   Windows Insider – 快速\n-   Windows Insider – 慢速\n\
  -   Windows Insider – 发布预览\n\nIT 管理员可以将功能更新和质量更新的安装推迟到这些更新首次在 Windows 更新服务上可用之后的限定时间范围内，然后再部署到设备。\n\
  \n此延迟可用于留出时间，以便在更新推送到设备时验证部署。\n\n延迟功能允许您指定更新发布后多少天才会提供给设备。通过这种方式，您可以为以下组创建具有不同延迟天数的圈部署：\n\
  \n-   试点组\n-   生产圈 1\n-   生产圈 2\n-   广泛部署\n\n更新发布圈如下图所示，以帮助您更好地理解顺序：\n\n对于 **Microsoft\
  \ 产品更新**，默认选择是**允许**。可用的两个选项如下：\n\n-   **允许**：选择**允许**可从 Microsoft Update 扫描应用更新。\n\
  -   **阻止**：选择**阻止**可阻止扫描应用更新。\n\n> **提示**\n>\n> 建议值为**允许**，这样可以使设备上安装的所有 Microsoft\
  \ 产品（如 C++、.NET 等）保持最新状态。\n\n对于 **Windows 驱动程序**，默认选择是**允许**。可用的两个选项如下：\n\n-   **允许**：选择**允许**可在更新期间包含\
  \ Windows 更新驱动程序。\n-   **阻止**：选择**阻止**可阻止扫描驱动程序。\n\n> **提示**\n>\n> 建议值为**允许**，这样您可以直接通过\
  \ Windows 更新保持所有驱动程序的最新状态，无论是驱动程序、固件中的安全相关修复，还是稳定性方面的修复——请注意，这是一个开关，用于启用或禁用来自 Windows\
  \ 更新的全部或全部驱动程序更新。\n\n**设置功能更新卸载期（天）(2 - 60 天)** 允许您设置可以从设备远程卸载功能更新的天数。\n\n在 Microsoft\
  \ Intune 的更新圈策略中，您可以选择卸载设备上的 Windows 功能或质量更新。\n\n请参阅以下屏幕截图，了解如何在 Microsoft Endpoint\
  \ Manager 管理中心控制台中更新圈策略：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_216_0.png)\n\
  \n图 6.14 – 更新圈策略\n\n-   **4.** 在**用户体验设置**部分，您可以创建围绕应用更新的用户体验行为：\n\n### 用户体验设置\n\
  \n图 6.15 – 更新圈策略活动时间\n\n以下屏幕截图显示了 Intune 中 Windows Update for Business 策略的默认设置，除非您在策略中更改，否则该设置还会将\
  \ Windows 的活动时间指定为上午 8 点到下午 5 点：\n\n图 6.16 – 更新圈策略重置为默认值\n\n相反，使用 **重置为默认值** （Microsoft\
  \ 推荐的设置），您的最终用户可以自行设置活动时间，并且如果最终用户未配置活动时间，则可以利用智能活动时间。当员工的工作时间与在家办公成为新常态之前不同时，这一点比以往任何时候都更加重要：\n\
  \n### 活动时间\n\n设置活动时间，让我们了解您通常何时使用此设备。我们不会在活动时间内自动重启，并且不会在不检查您是否正在使用的情况下重启。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_218_0.png)\n\
  \n图 6.17 – 客户端活动时间\n\n**重启检查** 可以设置为在重启前跳过所有检查。这包括电池电量是否达到 40%、用户是否存在、是否需要显示器、演示模式、全屏模式、通话状态、游戏模式等。\n\
  \n**暂停 Windows 更新的选项** 为最终用户提供通过 Windows 更新暂停更新最多 7 天的选项。\n\n如果您在部署功能或质量更新时发现问题，IT\
  \ 管理员可以从指定的开始日期起将其暂停 35 天，以防止其他设备安装该更新，直到问题解决。如果您暂停了功能更新，质量更新仍会提供给设备，以确保其安全。功能更新和质量更新的暂停期均从您设置的开始日期起计算。\n\
  \n在 Microsoft Intune 的更新圈策略中，您可以选择暂停设备上的 Windows 功能或质量更新：\n\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_219_0.png)\n\
  \n图 6.18 – 更新环策略\n\n**检查Windows更新的选项**是Windows更新中的一项设置，启用后，允许设备用户检查更新服务以获取更新。\n\n\
  对于**要求用户批准以解除重启通知**，指定解除自动重启所需通知的方式。为了获得最佳最终用户体验，请将其设置为**是**，但当最终用户掌握控制权时，这可能会降低设备的更新合规性。建议保留默认值：**否**。您可以在以下屏幕截图中找到这些设置：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_219_1.png)\n\n图 6.19 – 更新环策略\n\n对于**在所需自动重启前通过可关闭的提醒提醒用户（小时）**，指定自动重启警告提醒通知的时间段。允许值为**2、4、8、12或24**。默认值为4小时。建议将其留空。\n\
  \n对于**在所需自动重启前通过持续提醒提醒用户（分钟）**，指定自动重启即将进行的警告通知的时间段。允许值为**15、30或60**。默认值为15。建议将其留空。\n\
  \n**更改通知更新级别**指定用户可以看到哪些Windows更新通知。建议将其设置为**使用默认的Windows更新通知**，以便最终用户获得尽可能多的通知，并可以选择相应地采取行动。\n\
  \n如果您有自助服务终端设备、ATM或其他没有用户使用的设备，建议将其设置为**关闭所有通知，包括重启警告**，因为这些设备上没有最终用户响应通知。您可以在以下屏幕截图中找到这些设置：\n\
  \n更改通知更新级别 ① 关闭所有通知，包括重启警告\n\n图 6.20 – 更新环策略通知级别\n\n**使用截止日期设置**使您能够利用截止日期设置。建议设置为**允许**。利用**允许**设置，作为IT管理员，您可以为功能更新和质量更新设置截止日期。\n\
  \n对于**功能更新截止日期**，允许的天数为2到30天。建议设置为**7**，这样Windows功能更新将在强制安装和重新启动之前有7天的截止日期。\n\n\
  对于**质量更新截止日期**，允许的天数为2到30天。建议设置为**5**，这样Windows质量更新将在强制安装和重新启动之前有5天的截止日期。这不会阻止最终用户在截止日期结束之前安装质量更新。\n\
  \n对于**宽限期**，允许的天数为0到7天。建议设置为**2**天，这样如果最终用户休假回来，他们将有2天时间安装更新并重新启动设备。\n\n对于**截止日期前自动重启**，建议设置为**是**。这指定设备是否应在截止日期前自动重启。**是**将确保重启时尽可能减少最终用户的交互。**否**将确保最终用户在设备重启时始终在场。\n\
  \n使用截止日期设置 ① 允许 未配置\n\n功能更新截止日期 ① 7\n\n质量更新截止日期 ① 5\n\n宽限期 ① 天数，0到7\n\n截止日期前自动重启\
  \ ① 是 否\n\n图 6.21 – 更新环策略使用截止日期设置\n\n当您为自动Windows更新和操作系统重启指定不同截止日期时，最终用户通知将如下所示：\n\
  \n- 用户会收到一条toast通知，几天后用户会收到此对话框：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_221_0.png)\n\
  \n图 6.22 – Toast通知\n\n- 如果用户计划了重启或安排了自动重启，用户将在重启前15分钟收到此通知：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_221_1.png)\n\
  \n图 6.23 – 重启通知\n\n如果截止日期过后重启仍处于待处理状态，将显示以下通知：\n\n- 截止日期前12小时，用户会收到此通知：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_222_0.png)\n\
  \n图 6.24 – 截止日期前的通知\n\n- 一旦截止日期已过，用户必须重启以保持设备合规，并会收到此通知：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_222_1.png)\n\
  \n图 6.25 – 截止日期后的通知\n\n为获得最佳Windows更新体验，请遵循以下准则：\n\n- 每月至少使用设备6小时，其中至少连续使用2小时。\n\
  - 定期为设备充电。夜间插入电源可使设备在非使用时间自动更新。\n- 确保设备至少有10 GB可用空间（启用存储感知策略）。\n- 让设备不受阻碍地访问Windows更新服务。\n\
  \n## Windows 10 功能更新\n\nWindows 10功能更新策略与来自Microsoft Intune的Windows 10更新环策略配合使用，以防止设备接收到比功能更新策略中指定的值更高的Windows功能版本。\n\
  \nWindows更新环策略中的功能更新应配置为0，您可以在Microsoft Endpoint Manager中进行以下设置：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_224_0.png)\n\
  \n更新环的功能更新必须正在运行，不得暂停。\n\n设备将更新到策略中指定的Windows版本。但是，如果设备已在运行更高版本的Windows，则它保持当前版本。通过冻结版本，设备的功能集能在策略有效期内保持稳定。\n\
  \nMicrosoft Intune Windows 10功能更新需要满足以下先决条件：\n\n- 已注册Intune MDM，并且已加入混合AD、已加入AAD或已注册AAD。\n\
  - 已开启遥测，最低设置为“基本”。\n\n现在我们将配置Microsoft Endpoint Manager中的Windows 10功能更新配置文件设置：\n\
  \n1. 登录Microsoft Endpoint Manager管理中心 (https://endpoint.microsoft.com)。\n2. 选择“设备”\
  \ | “Windows” | “Windows 10功能更新” | “创建配置文件”：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_225_0.png)\n\
  \n图 6.28 – 创建功能更新部署\n\n您可以选择要部署的功能更新，如下所示：\n\n- Windows 10 1803\n- Windows 10 1809\n\
  - Windows 10 1909\n- Windows 10 2004\n- Windows 10 20H2\n\n通过设置此策略，指定的Windows功能不会从Microsoft\
  \ Intune下载和安装，而是告知设备在从Microsoft Intune接收策略后的下一个计划时间执行Windows更新同步时，应发送设备应处于的功能更新信息。\n\
  \n## 选择退出保护性暂停\n\n选择退出Windows更新保护性暂停适用于运行Windows 10版本1809及更高版本，并安装了2020年10月安全更新的Windows\
  \ Update for Business设备。\n\n保护性暂停会阻止具有已知兼容性问题的设备接收新操作系统版本。一旦修复程序发布并在受暂停的设备上验证通过，将继续提供。\n\
  \n保护性暂停保护默认提供给所有尝试通过Windows更新升级到新的Windows 10功能更新版本的设备。\n\nIT管理员如有必要，可以使用组策略设置或通过**禁用功能更新的保护性暂停**MDM设置，将设备退出保护性暂停保护。\n\
  \nMDM策略可以作为Microsoft Intune中的自定义策略进行配置。\n有关如何在Microsoft Intune中创建自定义策略的更多详细信息，请参见*第10章，高级策略管理*。在Microsoft\
  \ Intune中创建自定义策略时，您需要填写每个必填字段，如下例所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_226_0.png)\n\
  \n更多详细信息如下：\n\n- **名称：** `DisableWUfBSafeguards`\n- **描述：** `This policy will disable\
  \ safeguards`\n- **OMA-URI：** `./Vendor/MSFT/Policy/Config/Update/DisableWUfBSafeguards`\n\
  - **数据类型：** 整数\n- **值：** 1\n\n\n\n\n此选项支持的取值如下：\n\n- **0（默认）**：启用保护措施，在保护措施解除之前，设备可能会被阻止升级。\n\
  - **1**：不启用保护措施，升级将在不受保护措施阻止的情况下进行部署。\n\n选择退出保护措施可能会使设备面临已知性能问题的风险。建议仅在 IT 受控环境中为验证目的而选择退出。\n\
  \n**“禁用保护措施策略”**选项在设备升级到新的 Windows 10 版本后将恢复为**“未配置”**，即使之前已启用也是如此。这可以确保管理员在每个新功能更新中出于对已知问题的考虑而有意禁用\
  \ Microsoft 的默认保护。\n\n禁用保护措施并不能保证你的设备能够成功更新。更新仍可能在该设备上失败，并且很可能会导致升级后体验不佳，因为你绕过了\
  \ Microsoft 针对已知问题所提供的保护。\n\n在下一节中，你将了解加速部署 Windows 更新的选项。\n\n## 加速 Windows 补丁\n\
  \n加速质量修补是为了在你的设备环境中比正常速度更快地部署更新。如果发布了一个重要的质量更新并包含重要的安全修复，你可以利用加速策略。\n\n通过创建加速策略，预期在\
  \ 2 天内让超过 90% 分配了加速策略的设备完成更新并重新启动。这也意味着，使用此类策略时，由于重启行为更加激进，可能会对最终用户的工作效率产生负面影响。与配置了\
  \ Windows Update for Business 通道策略设置的设备相比，部署后的第一周内成功更新的设备数量要多出两到三倍。\n\n加速更新的一项好处是你无需修改\
  \ Windows 10 更新通道的现有质量更新设置。加速配置文件将临时覆盖任何 Windows Update for Business 设置，并使用加速策略中的必要设置代替；这是为了确保加速更新尽快安装到目标设备上。成功安装加速更新后，Windows\
  \ Update for Business 策略中的设置将自动恢复为正确状态。\n\n加速更新策略的支持适用于仍通过 Windows Update 接收更新且尚未到达服务终止日期的\
  \ Windows 10 设备。设备需要加入混合 Azure AD 或加入 Azure AD，该策略才能正常工作。\n\n加速更新使用 **Windows 推送通知服务\
  \ (WNS)** 和推送通知渠道向设备传递存在需要安装的加速更新的消息。这样做是为了加快安装速度。此过程使设备能够尽快从 Windows Update 开始下载和安装加速更新，而无需等待设备通过正常计划的签入过程与\
  \ Windows Update 后端服务通信。\n\n要配置质量更新配置文件，请执行以下操作：\n\n1. 登录 Microsoft Endpoint Manager\
  \ 管理中心 (https://endpoint.microsoft.com)。\n2. 选择**“设备 | Windows | Windows 10 质量更新\
  \ | 创建配置文件”**：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_228_0.png)\n\n图 6.30\
  \ – Windows 10 质量更新设置\n\n你可以选择要部署的质量更新。你始终可以选择为 Windows 10 发布的最新三个补丁：\n\n## 创建质量更新配置文件\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_229_0.png)\n\n图 6.31 – Windows 10 质量更新配置文件\n\
  \n> **重要说明**\n> \n> 使用 2 天以获得最佳最终用户体验。如果更新非常重要，请选择 0 天，但请注意，分配了此策略的设备将在下载并安装补丁后强制重启。\n\
  \n你可以看到，随着截止日期的临近，通知会变得越来越强制：\n\n1. 你首先会收到**“在 x 天后重启”**的消息，具体取决于策略中设置的天数：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_230_0.png)\n\
  \n图 6.32 – 在 x 天后重启\n\n2. 然后，它会变得更加强制，并在重启前 2 天在最终用户的屏幕上显示此消息，此时最终用户可以选择时间：\n\n\
  ![](img/a3e9f26159d3739e434fe676b2987c1d_230_1.png)\n\n图 6.33 – 选择重启时间的通知\n\n3.\
  \ 然后，它会变得更加强制，并在重启前 2 小时在最终用户的屏幕上显示此消息。最终用户可以选择确认并等待，或立即重启：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_231_0.png)\n\
  \n图 6.34 – 重启前 2 小时的通知\n\n4. 在重启截止时间前 15 分钟，最终用户只能选择重启：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_231_1.png)\n\
  \n图 6.35 – 强制重启\n\n## Windows 11 更新\n\nWindows 11 已于 10 月 5 日作为**正式发布版 (GA)** 发布，现在可以用在生产工作负载中。从配置管理的角度来看，Microsoft\
  \ Endpoint Manager 从第一天起就支持 Windows 11。\n\n例如，你可以将 Windows 11 更新作为更新通道推送到你的物理或云电脑。请务必选择正确的\
  \ Windows 11 服务渠道。\n\n你可以在这篇 Microsoft 官方博客文章中了解更多信息：https://techcommunity.microsoft.com/t5/windows-it-pro-blog/commercial-previews-for-windows-11-and-windows-10-version-21h2/ba-p/2676467。\n\
  \n你可以在以下屏幕中单击“下载并安装”以开始更新：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_232_0.png)\n\
  \n图 6.36 – Windows 11 更新\n\n## 面向企业的 Windows 预览体验计划\n\n注册面向企业的 Windows 预览体验计划。将你的企业租户注册到面向企业的\
  \ Windows 预览体验计划的好处是，作为 IT 管理员，你可以使用 Microsoft Intune 管理组织中多台设备上的 Windows 10 和 Windows\
  \ 11 预览体验成员预览版安装。\n\n请使用你的 AAD 工作帐户（我们建议使用此帐户以获得最佳体验）或个人 Microsoft 帐户注册。如果你使用组织帐户，你将能够代表组织向\
  \ Microsoft 提供反馈，以帮助塑造 Windows，满足你业务的特定需求。你必须使用 AAD 帐户注册，才能在组织中集中管理 Windows 10/11\
  \ 预览体验成员预览版（https://insider.windows.com/en-us/for-business）：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_232_1.png)\n\
  \n图 6.37 – Windows 预览体验计划\n\n你需要使用全局管理员帐户注册 Windows Insider for Business：\n\n##\
  \ 注册 Windows 预览体验计划\n\n要将你的组织域注册到 Windows 预览体验计划（以下简称“计划”），请阅读计划协议和隐私声明，然后接受计划的条款。\n\
  \n- 计划协议\n- 我接受此协议的条款。（必需）\n- 立即注册\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_233_0.png)\n\
  \n图 6.38 – Windows 预览体验计划\n\n你需要阅读计划协议并单击**“我接受此协议的条款。（必需）”**：\n\n## 注册你的域\n\n要注册域，你必须已使用\
  \ Azure Active Directory (AAD) 中的工作帐户注册了该计划，并且必须在该 AAD 域中分配有全局管理员角色。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_233_1.png)\n\
  \n图 6.39 – Windows 预览体验计划注册\n\n现在，你的域已注册，可以使用 Windows Insider for Business。\n\n\
  你现在可以创建包含 Windows 预览体验成员通道的 Windows Update for Business 通道部署，并将其分配给一组测试设备：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_233_2.png)\n\
  \n图 6.40 – Windows 预览体验成员部署通道\n\n\n\n\n您的终端用户现在可以使用其 AAD 账户在 Feedback Hub 中发送反馈，并且您组织的其他成员可以看到此反馈。\n\
  \n从侧边菜单中选择反馈部分。\n\n在筛选下拉菜单下，选择我的组织。这将显示您组织中所有使用其注册的 AAD 账户登录 Feedback Hub 的用户的反馈：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_234_0.png)\n\n图 6.41 – Windows Feedback\
  \ Hub\n\n## 更新 Microsoft 365 应用\n\n当您开始在云管理的设备或共管设备上使用 Windows Update for Business\
  \ 时，您还应考虑如何管理 Microsoft 365 应用的更新。\n\n有两种选择：\n\n- Microsoft 365 应用的服务配置文件：您可以在 Microsoft\
  \ 365 应用管理中心（config.office.com）的服务配置文件部分查看设备的概览，包括下一次构建的推出情况、预计的波次以及任何设备故障和问题的信息。\n\
  \n从那里，您可以点击设备、操作、问题和设置，以获取有关由服务配置文件管理的设备的更多信息：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_235_0.png)\n\
  \n图 6.42 – Microsoft 365 应用服务策略\n\n- 使用管理模板配置策略：管理模板是您习惯在本地环境中使用组策略配置策略设置的方式。\n\n\
  建议查看 Office 365 应用管理中心提供的新的服务功能。我们将在本书后面的第 8 章《应用程序管理和交付》中深入介绍这一点。\n\n这就结束了本章。\n\
  \n## 摘要\n\n在本章中，您了解了开始使用 Microsoft Endpoint Manager 和 Windows Update for Business\
  \ 为不同终端场景部署和更新 Windows 所需了解的所有主题。\n\n我们介绍了更新 Windows 的不同选项以及应应用的策略设置。如果您习惯使用 SCCM\
  \ 部署 Windows Update，您可能在业务中部署 Windows 更新时已经有某种环形部署。借助 Windows Update for Business，您可以采用相同的方法，因为\
  \ Windows Update for Business 也有基于环的部署。\n\n如果您尚未运行 Windows Insider for Business，我们解释了为什么开始使用它是个好主意，现在您已准备好在组织中配置\
  \ Windows Insider for Business。在下一章中，我们将深入探讨 Windows Autopilot 的世界。\n\n## 问题\n\n\
  - 1. 什么是 Windows Update for Business？\n  A. 更新 Microsoft 应用的一种方式\n  B. 更新 Microsoft\
  \ Edge 的一种方式\n  C. 更新 Windows 的一种方式\n\n- 2. 设置功能更新卸载期的最大天数是多少？\n  A. 30\n  B. 60\n\
  \  C. 90\n\n- 3. 什么是 Windows Insider for Business？\n  A. 获取 Windows 预发布版本的一种方式\n\
  \  B. Windows 信息保护\n  C. Microsoft 365 应用预发布\n\n## 答案\n\n- 1. (C)\n- 2. (B)\n- 3.\
  \ (A)\n\n## 延伸阅读\n\n如果您在阅读本章后想了解更多关于 Microsoft Endpoint Manager 要求的信息，请使用此处列出的免费在线资源之一：\n\
  \n- 了解如何使用 Windows Update for Business – Azure，Microsoft Docs：https://docs.microsoft.com/en-us/mem/intune/protect/windows-update-for-business-configure\n\
  - 了解混合 Azure AD 加入和共管：https://techcommunity.microsoft.com/t5/microsoft-endpoint-manager-blog/understanding-hybrid-azure-ad-join-and-co-management/ba-p/2221201\n"
- "## 7 管理 Windows Autopilot\n\n在本章中，您将了解 Windows Autopilot 的工作原理以及为什么它对简化物理终端的交付流程对您的组织有益。\n\
  \nWindows Autopilot 是一组用于预配置全新设备并使其处于终端用户可以提高生产力的状态的技术。\n\nWindows Autopilot 设计用于从任何地方轻松地将全新设备上线。以前，企业依赖于\
  \ **Operation System Deployment (OSD)**，但在全球 Covid 大流行期间，许多员工在家工作，越来越多的企业正在寻找替代方案，即使在家工作也能将新设备交付给终端用户。Windows\
  \ Autopilot 非常适合此场景，其中 **Original Equipment Manufacturer (OEM)** 或经销商可以将设备直接发送给终端用户，终端用户可以拆箱新设备、使其运行并开始工作，而无需进入办公室。\n\
  \n## Windows Autopilot 概述\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_239_0.png)\n\
  \n图 7.1 – Autopilot 流程\n\n您通过将设备上传到 Autopilot 服务、创建并分配 Autopilot 配置文件，然后创建并分配 ESP\
  \ 配置文件（此步骤是可选的，但建议）来开始使用 Autopilot。\n\n设备发货后，用户只需输入其凭据，自动注册就会开始。就是这么简单：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_239_1.png)\n\
  \n图 7.2 – Autopilot 欢迎屏幕\n\n输入正确的凭据后，注册开始，所有配置项、策略、证书和应用程序都将应用于您的物理终端设备。\n\n一旦此阶段完成，用户就可以看到桌面：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_240_0.png)\n\n图 7.3 – Autopilot 设置设备\n\
  \n如果您使用企业状态漫游，您将以熟悉的方式看到桌面，因为您的大部分配置文件将从云端下载到设备。\n\n顺便说一下，Windows 11 也支持 Autopilot，并且体验完全现代化，如以下屏幕截图所示：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_241_0.png)\n\n图 7.4 – Autopilot Windows\
  \ 11 欢迎屏幕\n\n一旦您继续并输入分配了 Autopilot 和其他 Microsoft Endpoint Manager 配置文件配置的用户 AAD\
  \ 凭据，设备注册设置过程就会开始，如以下 Windows 11 示例所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_242_0.png)\n\
  \n图 7.5 – Autopilot Windows 11 设备设置\n\n在下一节中，我们将解释如何使用硬件 ID 作为唯一标识符将设备添加到 Windows\
  \ Autopilot。\n\n## 将硬件 ID 上传到 Windows Autopilot\n\nWindows Autopilot 硬件哈希是一个 4K\
  \ 字符串，通过在设备上运行 Windows 10 操作系统并运行 `Get-WindowsAutoPilotInfo.ps1` 获取：\n\n```\nNew-Item\
  \ -Type Directory -Path \"C:\\Temp\\Autopilot\"\nSet-Location -Path \"C:\\Temp\\\
  Autopilot\"\nSet-ExecutionPolicy -Scope Process -ExecutionPolicy Unrestricted\n\
  Install-Script -Name Get-WindowsAutoPilotInfo\nGet-WindowsAutoPilotInfo.ps1 -OutputFile\
  \ AutoPilotHWID.csv\n```\n\nWindows Autopilot 设备注册可以在组织内部手动完成，用于测试或组织已拥有的设备。\n\n\
  它用于收集设备的硬件标识（硬件哈希）并以 **Comma-Separated Values (CSV)** 文件的形式将此信息上传到 Microsoft Endpoint\
  \ Manager 管理中心的 Windows Autopilot 服务，并捕获硬件哈希以进行手动注册，这需要将设备启动到 Windows 10。因此，此过程主要用于测试和评估场景。\n\
  \n将全新设备导入 Windows Autopilot 服务的推荐方法是让 OEM 或 Microsoft **Cloud Solution Provider\
  \ (CSP)** 合作伙伴上传信息。\n\n对于 *Microsoft Surface* 或 *HoloLens* 设备，您可以向 Microsoft Devices\
  \ Autopilot Support 开启支持案例：https://prod.support.services.microsoft.com/supportrequestform/0d8bf192-cab7-6d39-143d-5a17840b9f5f。您只需提供以下信息：\n\
  \n- AAD 租户 ID\n- AAD 域名\n- 所有权证明\n- 设备序列号\n\n此过程也可以用于从租户中取消注册 Autopilot。\n\n您可以使用\
  \ CSP 合作伙伴以比您在 Microsoft Intune 中自行操作时更少的信息将设备上传到 Windows Autopilot：\n\n- `ProductKey\
  \ only`\n- `SerialNumber + OemManufacturerName + ModelName`\n\n让我们描述一下这些字段：\n\n\
  - `ProductKey`：这是 Windows 产品 ID，即 PKID，是一个 13 位数字，对应于在设备制造时插入设备固件中的 Windows 产品密钥（使用\
  \ OAv3）。\n- `SerialNumber`：这是 OEM 分配给每个制造设备的唯一值。\n- `OemManufacturerName`：这是 OEM\
  \ 在设备的 **System Management Basic Input/Output System (SMBIOS)** 固件中指定的值，例如 *Microsoft\
  \ Corporation* 或 LENOVO（稍后会详细介绍）。\n\n\n\n\n-   ModelName：这是由设备 OEM 在 SMBIOS 固件中为特定型号指定的值，例如\
  \ *Surface Pro 7*。\n\n要手动注册 Windows Autopilot 设备，过程如下：\n\nCSV 文件最多可以有 500 行。下面显示了标头和行格式，包括设备序列号、Windows\
  \ 产品 ID、硬件哈希、组标记和分配的用户：\n\n```\n<serialNumber>,<ProductID>,<hardwareHash>,\n<optionalGroupTag>,<optionalAssignedUser>\n\
  ```\n\n> **重要说明**\n> 从 CSV 文件导入 Windows Autopilot 设备。在 CSV 文件中分配用户时，请确保分配了正确的 **用户主体名称\
  \ (UPN)**，因为导入过程中不会验证 UPN。这意味着如果 CSV 文件中的 UPN 不正确，则不会将用户分配到 Windows Autopilot 设备对象。\n\
  \n如果使用的是 **Active Directory 联合身份验证服务 (ADFS)**，则无法将用户分配到特定的 Autopilot 设备。\n\n## Windows\
  \ Autopilot 部署计划\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_244_0.png)\n\n图 7.6\
  \ – Windows Autopilot 部署计划\n\n转到 Microsoft Endpoint Manager 管理中心 https://endpoint.microsoft.com/，然后选择“设备\
  \ | Windows | Windows 注册 | 设备”。\n\n## 选择导入：\n\n主页 > Windows >\n\n## Windows Autopilot\
  \ 设备\n\nWindows 注册\n\n同步   筛选   导入   导出   分配用户   刷新   删除\n\n基本信息\n\n上次同步请求：04/10/21,\
  \ 12:48 AM\n\n上次成功同步：04/10/21\n\nWindows Autopilot 允许你为用户自定义开箱即用体验 (OOBE)。\n\n按序列号搜索\n\
  \n| 序列号 | 制造商 | 型号 | 组标记 |\n|---|---|---|---|\n\n图 7.7 – Windows Autopilot 设备\n\n\
  浏览你的 autopilot.csv 文件，然后选择导入。\n\n你将在门户中看到以下消息：导入正在进行中。已用时间：0 分钟。此过程最长可能需要 15 分钟。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_245_0.png)\n\n图 7.8 – 添加 Windows Autopilot\
  \ 设备\n\n选择设备。选择 **分配用户。**\n\n浏览并选择你希望分配给设备的用户：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_246_0.png)\n\
  \n图 7.9 – 分配用户\n\n在 **Windows Autopilot 设备** 边栏中选择设备时，你将获得更多信息，以及 IT 管理员可以更改的一些属性：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_246_1.png)\n\n图 7.10 – Windows Autopilot\
  \ 设备\n\n在下表中，你可以看到 Windows Autopilot 对象中可能存在的不同设置和值类型：\n\n| 设置 | 值 |\n|---|---|\n\
  | 用户 | UPN。 |\n| 用户友好名称 | 可以更改，并将在 OOBE 预配期间显示。 |\n| 序列号 | 序列号。 |\n| 制造商 | 示例：“Microsoft\
  \ Corporation。” |\n| 型号 | 示例：“Surface Book 2。” |\n| 设备名称 | 可以配置，设备将在载入过程中获得此名称（在\
  \ OOBE 期间设置设备名称时会导致重启）。 |\n| 组标记 | 除非在 autopilot 上传文件中设置，否则为空白。可以更改，并会影响动态 AAD 组。\
  \ |\n| 配置文件状态 | 已分配或未分配。 |\n| 已分配的配置文件 | 分配给设备的配置文件名称。 |\n| 分配日期 | 配置文件分配给设备时的时间戳。\
  \ |\n| 注册状态 | 指定设备是否已注册到 Microsoft Intune。已注册或未注册。 |\n| 关联的 Intune 设备 | N/A 表示没有关联的设备。在设备首次完成\
  \ Autopilot 流程或 Intune 对象被删除之前，状态为 N/A。 |\n| 关联的 Azure AD 设备 | N/A 表示没有关联的设备 AAD\
  \ 对象。 |\n| 上次联系 | 上次联系设备时的时间戳。并不意味着设备从未与 Microsoft Intune 联系过。 |\n| 采购订单 | 当 OEM\
  \ 代表你的组织上传设备时，会发送采购订单 ID。 |\n\n较新的 Windows 10 版本具有用于 Windows Autopilot 服务的 4K 硬件哈希。例如，如果更换了\
  \ TPM 或主板，则需要新的硬件哈希。Windows Autopilot 服务中识别设备的一些方式基于 SMBIOS UUID、**媒体访问控制 (MAC)**\
  \ 或磁盘序列号——原因是 Windows 设备没有唯一标识符。如果我们查看 Autopilot 硬件哈希中包含哪些信息，我们也会了解为什么在更换主板后需要新的硬件哈希。\n\
  \nSMBIOS 中唯一值的最低要求如下：\n\n- `ProductKeyID`\n- `Sm biosSystemManufacturer`\n- `Sm\
  \ biosSystemProductName`\n- `Sm biosSystemSerialNumber`\n- `Sm biosSkuNumber`\n\
  - `Sm biosSystemFamily`\n- `MacAddress`\n- `Sm biosUuid`\n- `DiskSerialNumber`\n\
  - `TPM EkPub`\n\nWindows Autopilot 设备信息存储在哪里？\n\nWindows Autopilot 数据存储在美国 (US)，而不是你的\
  \ AAD 租户所在的区域。存储的不是客户数据，而是业务数据，这使得 Microsoft 能够提供 Windows Autopilot 服务。\n\n首先，你需要从\
  \ https://docs.microsoft.com/en-us/windows-hardware/get-started/adk-install 下载 Windows\
  \ **评估和部署工具包 (ADK)**：\n\n> **重要说明**\n> 你至少需要使用 ADK 版本 1703。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_249_0.png)\n\
  \n# 图 7.11 – Windows ADK\n\n安装 Microsoft ADK 后，你可以在此处找到所需工具：\n\n```\nC:\\Program\
  \ Files (x86)\\Windows Kits\\10\\Assessment and Deployment Kit\\Deployment Tools\\\
  amd64\\Licensing\\OA30\\oa3tool.exe\n```\n\n假设你运行以下命令：\n\n```\noa3tool.exe /DecodeHwHash=HardwareHash\n\
  ```\n\n然后，你将获得硬件哈希中存储内容的结果：\n\n```\nOEM Activation Tool 3.0\n```\n\n```\n(c) Copyright\
  \ 2019 Microsoft Corp.\n```\n\n```\nVersion: 10.0.19041.1\n```\n\n解码后的硬件哈希如下：\n\n\

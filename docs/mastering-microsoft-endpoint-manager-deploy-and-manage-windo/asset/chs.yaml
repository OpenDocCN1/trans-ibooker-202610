  HDD\" />\n<p n=\"Disk1.StorageBusType\" v=\"SAS\" />\n<p n=\"Disk1.IncursSeekPenalty\"\
  \ v=\"255\" />\n<p n=\"Disk1.TrimEnabled\" v=\"1\" />\n<p n=\"Disk1.DiskSerialNumber\"\
  \ v=\"|Virtual Disk |Msft \" />\n<p n=\"InternalDiskCount\" v=\"1\" />\n<p n=\"\
  TotalDiskCapacity\" v=\"80\" />\n<p n=\"OpticalDiskDriveType\" v=\"true\" />\n<p\

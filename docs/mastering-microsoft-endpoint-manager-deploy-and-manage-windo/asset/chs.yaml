- "## 高级策略管理\n\n这是本书中关于策略管理的第二章。您将了解可用于自定义和保护环境中 Windows 10 Enterprise 桌面的不同策略选项。本章在内容和与\
  \ Windows 操作系统自定义、Microsoft 365 应用程序（Office、OneDrive 等）和组策略管理相关的话题方面将非常广泛。\n\n我们将涵盖不同的场景——一些部分场景和一些端到端场景。本章最重要的部分将让您深入了解\
  \ Microsoft Intune 中存在的所有不同策略选项，以及何时以及如何以最佳方式利用不同的策略类型来完成企业所需的任务。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 从 Endpoint Manager 安全刀片配置策略\n- 配置您的 Endpoint 安全配置文件\n- Windows 10 不健康端点\n- 从设置目录配置策略\n\
  - 配置管理模板\n- OneDrive 已知文件夹移动配置\n- OneDrive – 阻止同步特定文件扩展名\n- 配置设备配置（模板）\n- 将自定义策略作为最后的手段利用\n\
  - 推送 PowerShell 脚本 – 向端点推送脚本化操作\n- 合规性策略\n- 组织合规性报告\n\n## 策略管理\n\n使用 Microsoft Endpoint\
  \ Manager 的一部分 Microsoft Intune 来管理您的 Windows 10 或 11 Enterprise 桌面，全部都是关于标准化并简化环境的管理层。在\
  \ *Chapter 9, Understanding Policy Management* 中，我们介绍了 MDM 策略在客户端的工作原理。我们还学习了如何从头开始或使用组策略分析开始\
  \ MDM 策略管理。\n\n在本章中，我们将查看在 Microsoft Intune 中配置设置的各种方法。我们将从安全基线开始，因为它们是保护桌面方面的最佳实践。\n\
  \n### 从 Endpoint Manager 安全刀片配置策略\n\n如果您的组织已准备好，您应该从安全基线开始。假设您的组织已经利用了 Microsoft\
  \ 安全基线，例如 **Center for Internet Security (CIS)** 基准。使用 GPO，您今天已经知道安全基线对 Windows\
  \ 生产环境可能产生的影响。Microsoft Intune 中有多个不同的基线：\n\n- **Windows 10 Security Baseline:**\
  \ 使用 Windows 10 安全基线来帮助您保护用户和设备。此基线由 Windows 安全团队创建的设置建议会影响安全性。如果您今天在 **Group Policy\
  \ Object (GPO)** 中已经使用某种安全基线，强烈建议您也采用 Intune Windows 10 安全基线。\n\n\n\n\n\n- **Microsoft\
  \ Defender for Endpoint 基线：** Microsoft Defender for Endpoint 基线代表了 Defender for\
  \ Endpoint 的默认推荐配置，可能与其它安全基线的默认基线不匹配。这意味着，如果你将此基线与 Windows 10 安全基线一起使用，可能会在不同的策略设置之间产生冲突。\n\
  - **Windows 365 安全基线（预览版）：** Windows 365 安全基线提供了一组基于安全最佳实践和真实世界实施经验的策略模板。你可以使用安全基线获取安全建议，帮助降低风险。Windows\
  \ 365 基线是针对 Cloud PC 的一个基线，包含 Windows、Microsoft Edge 和 Microsoft Defender for Endpoints\
  \ 的安全设置。这也意味着，你不应将其他安全基线分配给同一组设备，否则可能导致策略冲突。\n- **Microsoft Edge 基线：** Microsoft\
  \ Edge 基线设置了 Microsoft Edge 浏览器的推荐配置。Microsoft Edge 安全基线占用非常小，仅设置与安全相关的设置，因此在你的组织中易于测试。如果允许用户在公司拥有的\
  \ Windows 10 设备上使用不同的浏览器，你还应为这些第三方浏览器创建安全基线；否则，存在终端用户始终使用安全性最低浏览器的风险。\n\n请注意，当基线更改其版本时，旧版本将变为只读。你可以继续使用这些配置文件，但无法编辑它们。你应每次新版本发布时更改基线版本，以利用最新的建议。\n\
  \nMicrosoft Edge 基线默认值代表了 Microsoft Edge 浏览器的推荐配置，因此可能与其它安全基线的基线默认值不匹配。\n\n在本示例中，我们将创建一个\
  \ Microsoft Edge 基线策略：\n\nHome > Endpoint security > Microsoft Edge baseline >\n\

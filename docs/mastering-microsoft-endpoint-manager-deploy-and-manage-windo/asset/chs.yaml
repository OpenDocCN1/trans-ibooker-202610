- "## 5 Requirements for Microsoft Endpoint Manager\n\n在本章中，你将清楚了解 Microsoft Endpoint\
  \ Manager（MEM）的不同要求，从操作系统版本和 URL 防火墙允许列表到所需许可证和权限。在我们开始本书的技术深入内容之前，我们将介绍 MEM 的要求。其中一些要求可能对你的环境没有任何影响，而其他要求则影响很大。例如，如果你处于采用所有\
  \ Microsoft 技术零信任环境中，网络 URL 防火墙要求就不那么重要，但如果你出于某种原因在环境中拥有防火墙、代理服务器等，那么它们就非常重要。\n\n\
  在本章中，我们将介绍以下主题：\n\n- Endpoint scenarios\n- Identity roles and privileges\n- Network\
  \ URL firewall requirements\n- Licensing requirements\n- Supported OSes\n- Windows\
  \ 11 hardware requirements\n- Administrator licensing\n\n### Endpoint scenarios\n\
  \nMEM 支持我们将在本书中深入介绍的不同终端场景。\n\n受支持的终端场景如下：\n\n- Physical desktops\n- Cloud PC endpoints\n\
  - Mobile devices\n\n现在我们提到了不同的终端场景，我们将解释 MEM 中可用的不同角色。\n\n### Identity roles and\
  \ privileges for Microsoft Intune\n\n为了配置 MEM，你首先必须确保拥有执行此操作的必要权限。你在 Azure Active\
  \ Directory（AD）租户中创建的第一个用户将自动成为全局管理员，是 Global Admin 角色的成员。Global Admin 角色拥有完整的 Microsoft\
  \ Intune 权限。\n\n还有其他角色可以帮助你在用户角色设计中委派访问权限。Intune 的某些后续步骤需要 Global Admin 角色，因此我们建议对初始设置使用此类帐户。\n\
  \n以下是 MEM 中受支持的角色列表。\n\n**Compliance Administrator**\n\n具有此角色的用户有权在 Microsoft 365\
  \ 合规中心、Azure、Microsoft 365 管理中心和 Microsoft 合规中心中管理与合规相关的功能。\n\n具有此角色的用户可以查看所有 Intune\
  \ 审计数据。\n\n**Compliance Data Administrator**\n\n具有此角色的用户有权在 Microsoft 365 合规中心、Microsoft\
  \ 365 管理中心和 Azure 中跟踪数据。\n\n具有此角色的用户可以查看所有 Intune 审计数据。\n\n**Intune Administrator**\n\
  \n具有此角色的用户在 Microsoft Intune 中拥有全局权限。\n\nIntune Administrator 角色包含管理用户和设备以关联策略的能力，以及在\
  \ Azure AD 中创建和管理所有安全组的能力。\n\n> **Important Note**\n>\n> Intune Administrator 不具有\
  \ Office 组的管理员权限。\n\n**Message Center Reader**\n\n此角色中的用户可以监控其组织在 Microsoft Intune\
  \ 消息中心中的通知和咨询健康更新。\n\n> **Important Note**\n>\n> 这对于范围受限的 Intune 管理员用户很重要。\n\n**Security\
  \ Administrator**\n\n具有此角色的用户有权在 Microsoft 365 安全中心、Azure AD 身份验证、Azure AD Identity\
  \ Protection、Azure Information Protection 和 Microsoft 365 合规中心中管理与安全相关的功能。\n\n此角色中的用户可以查看用户、设备、注册、配置和应用程序信息。但是，他们无法更改\
  \ Intune。\n\n**Security Operator**\n\n具有此角色的用户可以管理警报，并对与安全相关的功能具有全局只读访问权限，包括 Microsoft\
  \ 365 安全中心、Identity Protection、Azure AD、特权身份管理 和 Microsoft 365 合规中心中的所有信息。\n\n此角色中的用户可以查看用户、设备、注册、配置和应用程序信息。但是，他们无法更改\
  \ Intune。\n\n**Security Reader**\n\n具有此角色的用户对与安全相关的功能具有全局只读访问权限，包括 Microsoft 365\
  \ 安全中心、Azure AD、特权身份管理、Identity Protection 和 Microsoft 365 合规中心中的所有信息，以及读取 Azure\
  \ AD 登录报告和审计日志的能力。\n\n此角色中的用户可以查看用户、设备、注册、配置和应用程序信息。但是，他们无法更改 Intune。\n\n### Identity\
  \ roles and privileges for a Windows 365 cloud PC\n\n为了使用 Windows 365 云 PC，你的 Azure\
  \ AD 配置应为混合 Azure AD 加入（HAADJ），以将你的云 PC 注册到 Intune。\n\n**Azure Subscription Owner**\n\
  \n具有此角色的用户可全局访问 Azure 订阅中的所有资源。这些权限是 Windows 365 初始设置所需的。\n\n此角色授予用户完全访问以管理所有资源的能力，包括在\
  \ Azure RBAC 中分配角色的能力。\n\n**Intune Administrator**\n\n具有此角色的用户在 Microsoft Intune\
  \ 中拥有全局权限。\n\nIntune Administrator 角色包含管理用户和设备以关联策略的能力，以及在 Azure AD 中创建和管理所有安全组的能力。\n\
  \n> **Important Note**\n>\n> Intune Administrator 不具有 Office 组的管理员权限。\n\n\n\n\n\n\
  ## 域管理员\n\n拥有此角色的用户将能够在您的本地域中创建计算机帐户。这是为云电脑在您的域中创建计算机帐户所必需的。您还可以通过直接使用域中的相应组织单位进行委派控制来委派访问权限。\n\
  \n## 通用打印的身份角色与权限\n\n通用打印在 Azure AD 中引入了两个角色：打印机管理员和技术员。初始配置需要打印机管理员。全局管理员帐户也完全足够。\n\
  \n我们将在本书后面进一步讨论通用打印。\n\n## 打印机管理员\n\n拥有此角色的用户拥有完全访问权限，可以管理通用打印中打印机的所有方面。\n\n## 打印机技术员\n\
  \n拥有此角色的用户可以注册和注销打印机，并设置打印机状态。\n\n## 许可要求\n\n要使用 MEM，您必须拥有 Intune 许可证的使用权。您也可以选择获取\
  \ 30 天的试用许可证，以此进行测试并验证服务。\n\nMEM 作为一项服务并不需要 Azure 订阅；但是，当您将服务与云电脑一起使用时，您需要设置 Azure\
  \ 虚拟网络，因此需要 Azure 订阅。当云电脑支持 Azure AD 加入时（即将推出），将不再需要 Azure 订阅。\n\n以下类型的许可证可提供 MEM\
  \ 的访问权限：\n\n- 仅限 Intune 的许可证\n- Microsoft 365 E3\n- Microsoft E5\n- **企业移动性 + 安全性\
  \ (EMS)** E5\n\n您的公司很可能已拥有其中一种许可证，因此已经可以访问 MEM。\n\n创建试用帐户相对简单；您只需访问 `admin.microsoft.com`，点击**计费**，然后点击**购买服务**。搜索前面列出的许可证之一，并购买试用版（免费）。此过程无需信用卡或任何其他信息：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_162_0.png)\n\n图 5.1 – Microsoft 365 许可证购买\n\
  \n## 受支持的操作系统\n\n在本节中，我们将了解支持 MEM 的操作系统和 Web 浏览器版本。首先让我们看一下操作系统：\n\n- Microsoft：\n\
  \  - Windows 11（企业版**单会话和多会话版本**）\n  - Windows 10（企业版**单会话和多会话版本**）\n  - Windows\
  \ 10 专业版、教育版\n  - Windows 10 企业版 2019 LTSC\n  - Windows 10 IoT 企业版（x86、x64）\n  -\
  \ Windows 10 Teams – Surface Hub\n  - Windows Holographic for Business\n\n- 受支持的移动操作系统：\n\
  \  - Apple：\n    - Apple iOS 12.0 及更高版本\n    - Apple iPadOS 13.0 及更高版本\n    - Mac\
  \ OS X 10.13 及更高版本\n\n- **存储：** 安装 Windows 11 需要 64 GB* 或更大的可用存储空间（可能需要额外的存储空间来下载更新和启用特定功能）。\n\
  - **显卡：** 兼容 DirectX 12 或更高版本，并带有 WDDM 2.0 驱动程序。\n- **系统固件：** 支持 UEFI、安全启动。\n- **TPM：**\
  \ 受信任的平台模块 (https://docs.microsoft.com/en-us/windows/security/information-protection/tpm/trusted-platform-module-overview)。\n\
  - **显示器：** 高清晰度 (720p) 显示器，9 英寸或更大的显示器，每颜色通道 8 位。\n- **互联网连接：** 需要互联网连接才能执行更新。\n\
  \n*随着时间推移，更新以及启用操作系统中的特定功能可能会有其他要求。*\n\n遵循这些要求非常重要，因为在 Windows 11 正式发布后，您可能会遇到各种问题：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_164_0.png)\n\n在上图中，您可以看到 Windows 11 安装过程中的错误截图。它会在开始就地升级过程之前检测硬件要求。\n\
  \n在升级之前，您还必须了解 Windows 10 和 Windows 11 之间的一些其他差异。您可以在以下列表中找到它们：\n\n- Windows 11\
  \ 中的“开始”界面发生了重大变化，包括以下主要的弃用和移除项：\n  - 动态磁贴\n  - 动态预览\n  - 命名组和应用文件夹\n- 从 Windows\
  \ 10 升级时，固定应用和网站不会迁移。\n- Windows 采用了新的现代图标。\n- Teams 已集成到操作系统中。\n- Windows 应用商店应用已更新，并允许安装\
  \ Win32 应用程序。\n- 一项新功能，支持多个窗口的灵活性，并能够并排对齐应用。\n- 动态磁贴不再可用。如需一目了然的动态内容，请查看新的小组件功能。\n\
  - 平板模式已移除，并新增了针对键盘连接和断开姿势的功能和能力。\n- 任务栏功能已更改，包括以下内容：\n  - **人员**不再显示在任务栏上。\n  -\
  \ 某些图标可能不再显示在**系统托盘（systray）**中，包括之前针对升级设备的自定义设置。\n  - 仅允许对齐到屏幕底部。\n  - 应用无法再自定义任务栏的区域。\n\
  - **时间线**已移除。Microsoft Edge 中提供了某些类似功能。\n- **Internet Explorer** 已移除。Edge 是推荐的替代品，并包含\
  \ IE 模式，该模式在某些场景下可能很有用。\n- **数学输入面板**已移除。\n\n3. 在 Microsoft 365 管理中心，访问 admin.microsoft.com。如果您是全局管理员，您可以分配您的\
  \ Intune 许可证：\n\n图 5.5 – Microsoft 365 管理中心 – 许可证分配\n\nMicrosoft Intune 许可证是 Microsoft\
  \ 365 E3、面向一线员工的 Microsoft 365 F1/F3、EMS E3 以及独立的 Microsoft Intune 的一部分。\n\n还有许多其他许可证也授予您使用\
  \ Microsoft Intune 的权利。请始终咨询您的许可证合作伙伴，以确定适合您场景的正确许可证。\n\n您租户中的用户也需要许可证才能将其设备注册到\
  \ Intune。\n\n为您的用户分配 Intune 许可证的一个建议是利用 Azure AD 基于组的许可。\n\n## Azure AD 基于组的许可\n\
  \nMicrosoft 付费云服务（例如 Microsoft 365、EMS、Windows 10、Office 365、Dynamics 365 和其他类似产品）需要许可证。这些许可证分配给每个需要访问这些服务的用户。管理员使用其中一个管理门户（admin.microsoft.com\
  \ 或 aad.portal.azure.com）和 PowerShell cmdlet 来管理许可证。Azure AD 是支持所有 Microsoft 云服务身份管理的基础架构。Azure\
  \ AD 存储用户的许可证分配状态信息。\n\nAzure AD 包括基于组的许可，这意味着可以将一个或多个产品许可证分配给一个组。Azure AD 确保将许可证分配给该组的所有成员。这包括后来成为该组成员的新成员。当他们离开该组时，这些许可证将被移除。这种许可证管理消除了通过\
  \ PowerShell 自动化许可证管理以反映组织和部门结构逐用户变化的必要性。\n\n对于任何分配了许可证的组，您还必须有足够的许可证来覆盖每个唯一成员。虽然您不必为组中的每个成员分配许可证，但您必须至少有足够的许可证来包含所有成员。例如，如果您的租户中有\
  \ 10,000 个属于许可组的唯一成员，则您必须至少有 10,000 个许可证才能满足许可证分配的要求。\n\n许可证可以分配给 Azure AD 中的任何安全组。安全组可以使用\
  \ Azure AD Connect 从本地同步。您也可以直接在 Azure AD 中创建安全组（也称为纯云组），或通过 Azure AD 动态组功能自动创建。Office\
  \ 365 组不能用于基于组的许可。\n\n\n\n\n\n## 启用 Windows 自动注册\n\n自动 MDM 注册意味着当 Windows 设备加入 Azure\
  \ AD 时，设备将自动通过 MDM 注册流程注册到 Intune。\n\n要实现 Windows 自动注册，请按照以下步骤操作：\n\n- 1. 登录到 MEM\
  \ 管理中心 (https://endpoint.microsoft.com)。\n- 2. 选择 Devices | Windows | Windows enrollment\
  \ 然后选择 Automatic Enrollment：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_171_0.png)\n\
  \n图 5.6 – MEM 管理中心 – Windows 自动 MDM 注册\n\n如果所有用户都已分配 Intune 许可证，用户注册也可以限定为特定用户组。最佳选择是利用\
  \ Intune 注册限制来配置用户可以注册的 Windows 设备。\n\n3. 确保将 MDM 用户范围选择为 All：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_172_0.png)\n\
  \n图 5.7 – MEM 管理中心 – MDM 用户范围\n\n以下是 MDM 用户范围所有选项的含义：\n\n- None：MDM 自动注册已禁用。\n-\
  \ Some：选择可以自动注册其 Windows 设备的组。\n- All：所有用户都可以自动注册其 Windows 设备。\n\n> 重要说明\n> 自动 MDM\
  \ 注册需要 Azure AD 高级订阅。\n\n对于 Windows 自带设备 (BYOD) 设备（个人注册），如果 MAM 用户范围和 MDM 用户范围（自动\
  \ MDM 注册）都已为所有用户（或同一组用户）启用，则 MAM 用户范围优先。如果您已配置它们，设备将不会进行 MDM 注册，并且将应用 Windows 信息保护\
  \ (WIP) 策略。\n\n## 使用 Azure Virtual Desktop 与 Intune\n\n在 Windows 365 中，以下步骤不需要，因为\
  \ Intune 注册会自动完成。此外，请确保在继续之前已执行上一步（将 MDM 用户范围设置为 All 且 MAM 用户范围设置为 None）。\n\n> **重要说明**\n\
  > 请确保 RemoteDesktopServices/AllowUsersToConnectRemotely 策略未被禁用。\n\n请注意，以下 Windows\
  \ 10 桌面设备远程操作不适用于/不建议用于 Azure Virtual Desktop 虚拟机：\n\n- Autopilot reset\n- BitLocker\
  \ key rotation\n- Fresh start\n- Remote lock\n- Reset password\n- Wipe\n\n让我们开始执行操作：\n\
  \n- 1. 登录到您的会话主机。\n- 2. 打开 **Local Computer Policy** 并单击 **Administrative Templates\
  \ | Windows Components | MDM：**\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_173_0.png)\n\
  \n图 5.8 – 本地组策略 – MDM\n\n- 3. 将策略设置为 **Enabled.**\n- 4. 将凭据类型设置为 **User Credential：**\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_174_0.png)\n\n图 5.9 – 本地组策略 – MDM\n\n\
  - 5. 确认您的会话主机已注册到 Azure AD 的 MDM 注册，其应如下例所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_174_1.png)\n\
  \n图 5.10 – 管理中心 – 所有设备\n\n正如我们刚刚向您展示了将 Windows 设备注册到 Microsoft Intune 的不同选项，我们现在将向您展示如何通过\
  \ Microsoft Intune 注册限制来限制 Windows 注册。\n\n## Microsoft Intune Windows 注册限制\n\n如果您阻止个人拥有的\
  \ Windows 设备注册，Intune 会检查每个新的 Windows 注册请求是否已作为企业注册获得授权。未经授权的注册将被阻止。\n\n> **重要说明**\n\
  > 在默认注册限制中阻止 Windows MDM 注册将阻止一些涉及企业设备的场景。\n\n## Microsoft Intune Windows 设备限制\n\
  \n在本节中，我们将了解如何为 Windows 设备创建注册限制：\n\n- 1. 登录到 MEM 管理中心 (endpoint.microsoft.com)。\n\
  - 2. 选择 Devices | Enrollment restrictions：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_175_0.png)\n\

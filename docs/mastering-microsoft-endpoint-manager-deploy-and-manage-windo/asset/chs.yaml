  ## 索引\n\n## 前言\n现代工作场所解决方案旨在简化环境的管理层，但其采用缓慢的主要原因之一是对产品缺乏理解和认识。通过本书，你将学到将迁移到现代工作场所所需的一切知识，支持运行Windows\
  \ 10、Windows 11或Windows 365。\n\n*精通Microsoft Endpoint Manager*详细解释了各种概念，让你清楚地规划如何使用**Microsoft\
  \ Endpoint Manager (MEM)**，并提前消除潜在的迁移挑战。你将掌握使用Windows 365云电脑、Windows Autopilot、配置文件管理、监控与分析、Universal\
  \ Print等新服务。本书将带你了解最新功能和新Microsoft云服务，帮助你掌握MEM的基础知识，并了解可以管理哪些服务。无论是物理端点还是云端点，本书都涵盖。\n\
  \n读完本书后，你将能够设置MEM并高效地使用它运行Windows 10、Windows 11和Windows 365。\n\n你将学到什么：\n- 使用Windows\
  \ 365云电脑简化Windows在云中的部署。\n- 在MEM中配置高级策略管理。\n- 探索物理和云电脑的现代配置文件管理和迁移选项。\n- 通过基线设置和其他安全最佳实践强化安全性。\n\
  - 查找MEM、Windows 365云电脑等的故障排除提示和技巧。\n- 发现物理和云管理端点的部署最佳实践。\n- 跟上Microsoft社区的步伐，并发现值得关注的MVP名单。\n\
  \n\n\n\n\n# 本书适合谁\n\n如果你是一名 IT 专业人员、企业移动性管理员、架构师或顾问，希望通过 MEM 学习如何在物理和云端点上管理 Windows\
  \ 以实现远程工作，那么本书适合你。\n\n# 本书涵盖内容\n\n*Chapter 1, Introduction to Microsoft 365,* 教你如何在利用\
  \ Microsoft 365 更广泛产品套件中其他服务的同时保持资源安全。理解产品的 fundamentals 是成功部署最重要的因素。\n\n*Chapter\
  \ 2, What Is Unified Endpoint Management?,* 承认现代管理的 basics 有时难以理解，因此你将学习关于现代管理和零信任的概念以及\
  \ MEM（Intune）的历史和架构概念，以便清晰地了解物理、虚拟和移动的所有设备如何在同一个管理控制台中汇聚。\n\n*Chapter 3, Introducing\
  \ Windows 365,* 教你一切开始使用这项新 Microsoft 云服务所需的内容，该服务可简化部署以及使用 MEM 进行云 PC 维护。\n\n*Chapter\
  \ 4, Deploying Windows 365,* 教你关于如何部署 Windows 365 的一切所需知识，所需的要求是什么，以及技巧和窍门。\n\n\
  *Chapter 5, Requirements for Microsoft Endpoint Manager,* 提供对 MEM 不同要求的清晰理解，从操作系统版本和\
  \ URL 防火墙允许列表到所需的许可证和权限。\n\n*Chapter 6, Windows Deployment and Management,* 教你关于使用\
  \ MEM – Intune 部署 Windows 10 Enterprise 的内容。\n\n*Chapter 7, Manager Windows Autopilot,*\
  \ 教你何时以及如何使用 Autopilot 在物理端点设备上注册 Windows 10。推荐的方法是什么以及事先需要做出哪些决定？你将在本章中了解所有这些内容。\n\
  \n*Chapter 8, Application Management and Delivery,* 教授部署和管理 Windows 10 端点上的 Microsoft\
  \ 365 和业务线应用程序的最佳实践。\n\n*Chapter 9, Understanding Policy Management,* 教你关于不同策略类型，现代策略管理意味着什么，以及它在\
  \ Windows 10/11 客户端上与组策略相比的工作方式。\n\nChapter 10, Advanced Policy Management, 教你关于不同的策略选项，以自定义和保护环境中的\

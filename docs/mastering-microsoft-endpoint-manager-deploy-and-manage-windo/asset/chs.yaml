  - 4. 选择同时对 MDM 和个人拥有的设备在特定操作系统上进行阻止和允许，以允许或阻止设备注册。\n\n如果您阻止特定操作系统注册，则适用于企业和个人设备注册。\n\
  \n如果您允许 Windows (MDM) 平台注册，您可以阻止个人设备；请参阅以下部分以了解 *阻止个人 Windows 设备* 的含义。\n\n**Allow\
  \ min/max range** 对于操作系统版本仅在注册时阻止设备，对已注册到 Microsoft Intune 的设备没有影响：\n\n> **重要说明**\n\

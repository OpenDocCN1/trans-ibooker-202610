  \n\n\n\n## Microsoft Endpoint Manager 中的策略管理\n\n策略集允许您创建对已存在的需要作为单个概念单元进行标识、定位和监控的管理实体的引用捆绑包。策略集是可以分配的应用程序、策略和其他您创建的管理对象的集合。创建策略集可让您一次选择多个不同的对象并从一个位置进行分配。随着组织的变更，您可以重新访问策略集以添加或删除其对象和分配。您可以使用策略集将现有的对象（如应用程序、策略和\
  \ VPN）关联并分配为单个包。\n\n您可以使用策略集执行以下操作：\n\n- 对需要一起分配的对象进行分组。\n- 在所有受管设备上分配组织的最少配置要求。\n\
  - 向所有用户分配常用或相关的应用程序。\n\n您可以在策略集中包含以下管理对象：\n\n- 应用配置策略\n- 应用保护策略\n- 设备配置配置文件\n- 设备合规性策略\n\

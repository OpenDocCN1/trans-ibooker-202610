  \n图 7.29 – 云配置 查看 + 部署\n\n4. 所有配置文件现在将被创建：\n\n主页 > 疑难解答 + 支持 >\n\n### 以云配置部署 Windows\
  \ 10\n\n部署成功。\n\n### 部署详细信息\n\n| 资源 | 资源类型 | 更多 | 状态 | 分配 |\n| --- | --- | --- |\
  \ --- | --- |\n| CloudConfig | AAD 安全组 | 文档 | 已创建 | -- |\n| CloudConfig M365（Teams）\
  \ | M365 应用套件 | 文档 | 已创建 | 已分配 |\n| CloudConfig Microsoft Edge | 应用 | 文档 | 已创建 |\
  \ 已分配 |\n| CloudConfig 安全基线 | Windows 10 安全基线 | 文档 | 已创建 | 已分配 |\n| CloudConfig\
  \ Autopilot 配置文件 | Autopilot 配置文件 | 文档 | 已创建 | 已分配 |\n| CloudConfig ESP 20210419_0:04:18\
  \ | 注册状态页 | 文档 | 已创建 | 已分配 |\n| CloudConfig OneDrive 已知文件夹移动 | 管理模板 | 文档 | 已创建 |\
  \ 已分配 |\n| CloudConfig Microsoft Edge 应用设置 | 管理模板 | 文档 | 已创建 | 已分配 |\n| CloudConfig\
  \ 合规策略 | 合规策略 | 文档 | 已创建 | 已分配 |\n| CloudConfig 内置应用删除脚本 | 脚本 | 文档 | 已创建 | 已分配 |\n\
  | CloudConfig 更新环 20210419_0:04:18 | Windows 10 更新环 | 文档 | 已创建 | 已分配 |\n\n图 7.30\
  \ – 云配置部署成功\n\n以下是您可以接下来执行的操作：\n\n- 将设备添加到您配置的组中。\n- 将您预注册的 Autopilot 设备或其他现有设备添加到您配置的组中。对于现有设备，我们建议删除其他配置文件和应用程序并重置它们，以便它们仅使用云配置全新开始。\n\
  - 部署必要的业务线应用程序和配置。\n\n我们建议将额外的必要配置保持在最低限度，包括在云配置之上部署的业务线应用程序数量。这有助于保持设备管理和故障排除更简单。\n\
  \n\n\n\n\n## 用户可能需要访问的工作或学校资源部署要点\n\n确保配置证书、VPN 配置文件、Wi-Fi 配置文件以及桌面/应用虚拟化客户端，以启用对组织资源的访问。\n\
  \n## 监控云配置设备\n\n使用 Microsoft Endpoint Manager 监控云配置设备的部署状态和设备运行状况。有关如何监控各个组件的信息，请参阅云配置概述和设置指南。\n\
  \n这是一种轻松开始测试 Windows Autopilot 和云配置设备的便捷方式。在下一节中，我们将介绍如何部署由 Windows Autopilot 提供的\
  \ kiosk 模式设备。\n\n## Edge kiosk 自部署场景\n\n从 Windows 10 20H2 开始，基于 Chromium 的 Microsoft\
  \ Edge 已内置于操作系统中。本场景将介绍如何使用 Microsoft Endpoint Manager 为单个应用配置 Microsoft Edge kiosk\
  \ 模式：\n\n- 1. 上传带有组标签（如 EdgeKIOSK）的 Autopilot 设备。\n- 2. 为 Edge kiosk 创建特定的 ESP。\n\
  - 3. 创建 Windows Autopilot 配置文件。\n- 4. 创建可受益于 kiosk 场景的一些配置文件。\n- 5. 创建 kiosk 配置文件。\n\
  \n## 为 Edge kiosk 创建特定的 ESP\n\nkiosk 设备可以是无用户的，并且使用 Windows Autopilot 自部署模式，在将设备加入\
  \ AAD 或 Microsoft Intune 时无需用户登录，因此我们将创建一个 ESP 并将其分配给此特定场景的 Autopilot 组。\n\n创建您偏好的设置的\
  \ ESP：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_280_0.png)\n\n图 7.31 – 为 Edge\
  \ kiosk 创建 ESP\n\n将其分配给 AAD **All Autopilot KIOSK** 动态组，该组将忽略默认 ESP 配置文件，因为它已分配给设备组。\n\
  \n## 创建 Windows Autopilot 配置文件\n\n为此场景创建新的 Autopilot 配置文件：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_280_1.png)\n\
  \n图 7.32 – Edge kiosk 的 Windows Autopilot 配置文件\n\n将 **Deployment mode** 设置为 **Self-Deploying\
  \ (preview)** 以将设备作为无用户设备加入：\n\nHome > Devices > Windows > Windows Autopilot deployment\
  \ profiles >\n\n# Create profile\n\nWindows PC\n\nBasics   Out-of-box experience\
  \ (OOBE)   Scope tags   Assignments   Review + create\n\nConfigure the out-of-box\
  \ experience for your Autopilot devices\n\nDeployment mode *   Self-Deploying (preview)\n\
  \nJoin to Azure AD as   Azure AD joined\n\nMicrosoft Software License Terms   Show\
  \   Hide\n\nImportant information about hiding license terms\n\nPrivacy settings\
  \   Show   Hide\n\nThe default value for diagnostic data collection has changed\
  \ for devices running Windows 10, version 1903 and later. Learn more\n\nHide change\
  \ account options   Show   Hide\n\nUser account type   Administrator   Standard\n\
  \nLanguage (Region)   Operating system default\n\nAutomatically configure keyboard\
  \   No   Yes\n\nApply device name template   No   Yes\n\nFigure 7.33 — Windows Autopilot\
  \ profile OOBE\n\n## Self-Deploying (preview)\n\n自部署模式目前不会将用户与设备关联（因为在流程中未指定用户 ID\
  \ 或密码）。\n\n自部署模式使用设备的 TPM 2.0 硬件对组织 AAD 租户中的设备进行身份验证。因此，没有 TPM 2.0 的设备不能使用此模式使用。设备还必须支持\
  \ TPM 设备证明。此 Windows Autopilot 场景需要具有物理 TPM 的设备，因此虚拟设备将无法工作。\n\n要实现 100% 的零接触入职体验，需要以太网连接；否则，设备会提示您选择区域和键盘布局。\n\
  \n## 创建自定义 Windows 10 配置文件以禁用用户 ESP\n\n这是为了确保用户部分的 ESP 不会在 Edge kiosk 上显示，因为它是一个无用户设备：\n\
  \n- - **Name:** `Disable User ESP`\n- - **Description:** `Disable User ESP for Edge\
  \ KIOSK`\n- - **OMA-URI:** `./Vendor/MSFT/DMClient/Provider/ProviderID/FirstSyncStatus/SkipUserStatusPage`\n\
  - - **Data type:** `Boolean`\n- - **Value:** `True`\n\n## 创建自定义 Windows 10 配置文件以禁用\
  \ FirstLogonAnimation\n\n此策略设置允许您控制用户在首次登录计算机时是否看到首次登录动画。这适用于完成初始设置的计算机的第一位用户以及后来添加到计算机的用户。它还控制\
  \ Microsoft 帐户用户在其首次登录时是否会被提供服务选择加入提示。\n\n如果您未配置此策略设置，完成初始 Windows 设置的用户在其首次登录时将看到动画。如果第一位用户已完成初始设置且未配置此策略设置，则新用户登录此计算机时不会看到首次登录动画。\n\
  \n在此 Edge kiosk 场景中，我们只需要快速轻松的入职体验：\n\n- - **Name:** `Disable FirstLogonAnimation`\n\
  - - **Description:** `Disable FirstLogonAnimation for Edge KIOSK`\n- - **OMA-URI:**\
  \ `./Device/Vendor/MSFT/Policy/Config/WindowsLogon/EnableFirstLogonAnimation`\n\
  - - **Data type:** `Integer`\n- - **Value:** `0`\n\n## 创建 Windows 10 模板 kiosk 配置文件\n\
  \n将 Windows 10 配置为单应用 kiosk 模式。我们使用 Microsoft Intune 中内置的配置文件类型模板，模板名称为 Kiosk。此配置文件类型将引导您完成必要的配置步骤。如果您需要在\
  \ kiosk 配置文件中进行更高级的设置，则需要使用 XML 格式的 kiosk 配置文件创建自定义 kiosk 策略：\n\nFigure 7.36 – Edge\
  \ kiosk profile\n\n以下是配置设置选项卡上的设置：\n\nFigure 7.37 – Edge kiosk Configuration settings\n\
  \n需要在 Windows 10 模板 Administrative Templates 配置文件中配置其他 Edge 设置：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_285_0.png)\n\
  \n## Kiosk 模式支持的功能\n\n在此表中，您可以看到不同 Microsoft Edge 版本可用的设置：\n\n| Feature | Digital/Interactive\
  \ Signage | Public Browsing | Available with Microsoft Edge Version (and Higher)\
  \ |\n|---|---|---|---|\n| InPrivate Navigation | Y | Y | 89 |\n| Reset on inactivity\
  \ | Y | Y | 89 |\n| Read-only address bar (policy) | N | Y | 89 |\n| Delete downloads\
  \ on exit (policy) | Y | Y | 89 |\n| F11 blocked (enter/exit fullscreen) | Y | Y\
  \ | 89 |\n| F12 blocked (launch Developer Tools) | Y | Y | 89 |\n| Multi-tab support\
  \ | N | Y | 89 |\n| Allow URL support (policy) | Y | Y | 89 |\n| Block URL support\
  \ (policy) | Y | Y | 89 |\n| Show home button (policy) | N | Y | 89 |\n| Manage\
  \ favorites (policy) | N | Y | 89 |\n| Enable printer (policy) | Y | Y | 89 |\n\
  | Configure the new tab page URL (policy) | N | Y |  |\n| End session button* |\
  \ N | Y | 89 |\n| All internal Microsoft Edge URLs are blocked, except for edge://downloads\
  \ and edge://print | N | Y | 89 |\n| Ctrl + N blocked (open a new window) * | Y\
  \ | Y | 89 |\n| Ctrl + T blocked (open new tab) | Y | N | 89 |\n| Settings and more\
  \ (...) will display only the required options | Y | Y | 89 |\n| Restrict the launch\
  \ of other applications from the browser | Y | Y | 90/91 |\n| UI print settings\
  \ lockdown | Y | Y | 90/91 |\n\n建议配置其他配置文件，例如 Windows Defender、Windows Update for\
  \ Business 以及可能与您的 kiosk 场景相关的其他策略。\n\n此场景也可以使用多应用 kiosk 模式实现；它只需要在 Microsoft Endpoint\
  \ Manager 中的 kiosk 配置文件中进行不同的配置。\n\n## Autopilot Reset\n\nWindows Autopilot Reset\
  \ 仅适用于 AAD 加入的设备。\n\nWindows Autopilot Reset 将设备恢复到业务就绪状态，允许同一用户或新用户快速轻松地登录并开始工作。Windows\
  \ Autopilot 重置后登录设备的第一位用户将成为设备的新主要用户和所有者。\n\n以下是 Windows Autopilot Reset 的特别之处：\n\
  \n- - 它会删除个人文件、应用和设置。\n- - 它会保留设备与 AAD 的身份连接，因此它保留相同的 AAD 对象。\n- - 它会保留设备与 Intune\
  \ 的管理连接，因此它保留相同的 Microsoft Intune Windows 对象。\n\n使用 Windows Autopilot Reset 时，流程会自动保留设备上的以下信息：\n\
  \n- - 它保留设备上配置的区域、语言和键盘。\n- - 它保留 Wi-Fi 连接详细信息。\n- - 它预配之前已应用于设备的软件包。\n- - 当重置流程启动时，预配包存在于\
  \ USB 驱动器上。\n- - 它保留 AAD 设备成员身份和 Microsoft Intune 注册信息。\n\nWindows Autopilot Reset\
  \ 将阻止用户在这些信息恢复之前访问桌面，包括在 Microsoft Intune 同步完成之前重新应用任何预配包。\n\n在 Microsoft Endpoint\
  \ Manager 管理中心执行以下步骤，https://endpoint.microsoft.com/：\n\n- 1. 选择 Devices | Windows\
  \ | Configuration Profiles。\n- 2. 选择 Create Profile。\n\n\n\n\n\n+   3. 选择 **Platform\
  \ Windows 10 and Later** 和 **Profile Type Templates**。\n+   4. 选择 **Device restrictions**\
  \ | **Create**。\n+   5. 输入 `Enable Autopilot Reset` 作为名称。\n+   6. 选择 **General**\

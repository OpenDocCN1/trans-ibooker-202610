  \n## 配置设备配置（模板）\n\n模板包含按功能组织的设置组。当你不想手动构建策略，或希望配置设备以访问公司网络（例如配置Wi-Fi或VPN）时，应使用模板。\n\
  \n在本节中，我们将展示一些示例以及用例。\n\n第一个是传递优化。建议在所有Windows设备上配置它，尤其是在运行Windows Update for Business时：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_404_0.png)\n\n图10.38 – 模板 – 传递优化\n\n\
  查看i图标中的信息，它将为你提供每个设置的推荐值：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_405_0.png)\n\
  \n图10.39 – 传递优化 – 推荐值\n\n然后，配置所有设置，测试它们，并评估所有推荐设置是否在你的组织中按预期工作。\n\n另一个很好的设备配置模板示例是**共享多用户设备**，它用于为组织中多个用户使用的共享Windows\
  \ 10设备配置访问、账户删除、维护和电源管理设置：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_406_0.png)\n\
  \n图10.40 – 共享多用户设备\n\n最终用户可以使用AAD账户登录这些共享设备。登录后，他们的凭据会被缓存。在使用设备时，最终用户只能访问你允许的功能。例如，你可以选择设备何时进入睡眠模式，以及用户是否可以在本地查看和保存文件，启用或禁用电源管理设置等。你还可以通过设置特定阈值来控制AAD账户是否会被删除；当达到阈值时，用户账户将被删除。此功能使用已针对共享使用进行优化的同一本地用户配置文件，因此首次使用该设备的用户登录时间只需几秒钟。\n\
  \n## 推送PowerShell脚本 – 对端点执行脚本操作\n\n如果没有策略来满足你在公司设备上需要进行的配置更改，你可以利用Microsoft Intune中的PowerShell脚本。这也是将一次性安装或自定义脚本操作发布到物理和云端点的一个好方法：\n\
  \n1. 在Microsoft Endpoint Manager管理中心，浏览到“主页 | 设备 | Windows | PowerShell脚本”，然后单击“添加”：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_409_0.png)\n\n图10.43 – PowerShell脚本\n\
  \n2. 单击**选择文件**，将PowerShell脚本上传到Microsoft Intune：\n\n> **重要说明**\n> 确保选择**在64位PowerShell主机上运行脚本**，以获得正确的注册表位置。\n\
  \n主页 > 设备 > Windows >\n\n# 添加PowerShell脚本...\n\n基本信息\n2 脚本设置\n3 分配\n4 查看并添加\n\n\
  脚本位置 *\n\n选择文件\n\n使用登录凭据运行此脚本\n\n强制脚本签名检查\n\n在64位PowerShell主机中运行脚本\n\n图10.44 – 上传PowerShell脚本\n\
  \n将脚本分配给用户组或设备组。然后，脚本将在每个已分配的设备上运行一次。以下是一些脚本示例：\n\n- **启用保留存储：**\n\n```\n$Storage\
  \ = Invoke-Command {DISM /Online /\nGet-ReservedStorageState}\n$Output = $Storage\
  \ | Select-String \"Reserved storage is disabled.\"\nWrite-Host $Output\nIf ($Output\
  \ -like \"Reserved storage is disabled.\") {\n    Invoke-Command {DISM /Online /\n\
  Set-ReservedStorageState /State:Enabled}\n}\n```\n\n- 为OneDrive启用ADAL：\n\n```\n\
  $registryPath = \"HKCU:\\SOFTWARE\\Microsoft\\OneDrive\"\n$Name = \"EnableADAL\"\
  \n$value = \"1\"\nIF(!(Test-Path $registryPath))\n{\n    New-Item -Path $registryPath\
  \ -Force | Out-Null\n    New-ItemProperty -Path $registryPath -Name $name -Value\
  \ $value `\n    -PropertyType DWORD -Force | Out-Null}\nELSE {\n    New-ItemProperty\
  \ -Path $registryPath -Name $name -Value $value `\n    -PropertyType DWORD -Force\
  \ | Out-Null}\n```\n\n这些只是利用PowerShell脚本配置Intune管理的Windows设备的一些示例。接下来，我们将介绍合规策略。\n\
  \n## 合规策略\n\nMicrosoft Endpoint Manager可以在设备上设置合规状态。设备有两种可能的结果：合规或不合规。\n\n在Microsoft\
  \ Intune中，你可以定义用户和设备必须满足的规则和设置才能合规。如果已配置条件访问，则不合规的用户和设备可能会被阻止访问包含公司数据的资源。\n\n> **重要说明**\n\
  > 条件访问需要Azure AD Premium许可证。\n\n包括适用于不合规设备的操作。针对不合规的操作可以提醒用户不合规的情况，并保护不合规设备上的数据。\n\
  \nMicrosoft Intune中有两种类型的合规策略：\n\n- **合规策略设置**：租户级设置，类似于每台设备都会接收的内置合规策略。合规策略设置为合规策略在Microsoft\
  \ Intune环境中的工作方式设定基线。\n\n这些设置配置合规服务处理设备的方式。每台设备都会将其评估为*内置设备合规策略*，这一点体现在设备监控中。\n\n\
  以下是你可以在内置策略中配置的选项：\n\n- 将未分配合规策略的设备标记为**默认值为“合规”**。这意味着此安全功能默认处于禁用状态。建议你将此设置更改为**“不合规”**，以便所有没有合规策略的设备自动标记为不合规。\n\
  \n- 增强型越狱检测：**默认值“已禁用”**（仅适用于iOS/iPadOS）。\n\n- 合规状态有效期（天）：默认值为30天。\n指定一个时间段，设备必须在此时间段内成功报告其收到的所有合规策略。如果设备在有效期到期前未能报告其策略的合规状态，则该设备被视为不合规。你可以将时间段配置为1到120天。\n\
  \n要管理合规策略设置，请登录Microsoft Endpoint Manager管理中心，然后转到**终结点安全 | 设备合规 | 合规策略设置**。\n\n\
  - **设备合规策略**：你配置并部署到用户组或设备组的平台特定规则。这些规则定义了设备的要求，例如最低操作系统版本或使用磁盘加密。设备必须满足这些规则才能被视为合规。\n\
  \n## Windows\n\n**设备运行状况证明（DHA）**服务验证设备的**受信任的平台模块（TPM）**和**平台配置寄存器（PCR）**日志，然后发布DHA报告。Microsoft提供DHA云服务，这是一项由Microsoft托管的DHA服务，免费、跨地域负载均衡，并针对全球不同区域的访问进行了优化。\n\
  \n\n\n\nDHA 使企业能够将组织的安全水平提升至硬件监控和可验证的安全水平，同时对运营成本的影响最小或为零。\n\nDHA 服务与 MDM 解决方案集成，并执行以下操作：\n\
  \n- 将 DHA 服务通过现有 MDM 设备管理通信渠道从设备接收到的信息与 DHA 报告结合。\n- 基于可验证的硬件和受保护的数据做出更安全、更可信的安全决策。\n\
  - 在合规策略中利用 DHA 时，Windows 10 必须在 Microsoft Intune 中进入合规状态之前重新启动。\n\n在 Windows 合规策略的设备健康部分，有三个设置：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_413_0.png)\n\n图 10.45 – 合规策略 – 设备健康\n\
  \n按如下方式更新这些设置：\n\n- 要求 BitLocker：要求 – 设备可以在系统关闭或休眠时保护存储在驱动器上的数据免受未经授权的访问。\n- 要求设备启用安全启动：要求\
  \ – 系统被强制启动到工厂受信任状态。用于启动计算机的核心组件必须具有组织制造设备所信任的正确加密签名。这些签名在 UEFI 固件允许机器启动之前进行验证。如果任何文件被篡改，从而破坏其签名，系统将无法启动。\n\
  \n作为 IT 管理员，您可以监控合规状态的不同部分：\n\n- **合规运营报告**：提供实时运营报告，可帮助 IT 管理员根据在此报告中找到的数据采取行动。\n\
  \n转到 **Home | Devices | Monitor | Windows health attestation report**。在这里，您可以选择查看有多少设备未启用\
  \ BitLocker 和安全启动，例如：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_416_0.png)\n\n\
  图 10.49 – Windows 健康证明报告\n\n- **不合规设备报告**：转到 **Home | Devices | Monitor | Noncompliant\
  \ devices.**\n\n在此报告中，您可以选择查看所有不合规设备。如果应用 **OS == Windows** 过滤器，您将只看到不合规的 Windows\
  \ 设备：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_417_0.png)\n\n图 10.50 – 监控 – 不合规设备\n\
  \n- **不合规策略（预览）**：转到 Home | Devices | Monitor | Noncompliant policies (preview)。\n\
  \n在此报告中，您可以快速了解 Microsoft Intune 中的合规策略概览以及有多少设备不符合特定合规策略：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_418_0.png)\n\
  \n图 10.51 – 监控 – 不合规策略（预览）\n\n本节关于合规策略以及如何对合规策略进行运营监控到此结束。接下来，我们将介绍合规的组织报告。\n\n\
  点击 Reports，您将获得设备合规性和设备合规性趋势选项：\n\n图 10.53 – 报告 – 设备合规性\n\n使用设备合规性，通过利用过滤器，您可以选择\
  \ Windows 设备并仅获取这些设备的报告。您还可以根据合规状态和/或所有权进行过滤：\n\n图 10.54 – 报告 – 设备合规性\n\n## 设备合规性趋势\n\
  \n此报告将为您提供过去 60 天合规状态的历史视图。\n\n在此视图中，我们再次对设置 Windows 作为操作系统进行了过滤：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_421_0.png)\n\
  \n图 10.55 – 报告 – 设备合规性趋势\n\n本节关于设备合规性组织报告到此结束。\n\n## 总结\n\n在本章中，您了解了不同类型的策略，并查看了通过\
  \ Microsoft Endpoint Manager 为物理和云端点以更现代的方式配置 Windows 的场景。我们查看了一些您可以利用的场景和策略配置。在策略管理领域，您需要在企业环境中确定想要采取何种方法。当查看纯云管理的设备和策略时，将是向前看而非向后看的完美时机。例如，首先部署具有安全影响的策略，例如\
  \ Edge 安全基线、Windows Defender 策略等。然后，查看部署将帮助最终用户提高生产力的策略，例如配置 OneDrive 已知文件夹移动、帮助最终用户更好地在应用程序中开始工作的策略，例如自动配置\
  \ Microsoft Edge、从应用程序中删除提示等。当您完成这两个大领域后，您可能就完成了，或者至少处于良好的起点。在与最终用户测试他们的体验以及他们提供的任何反馈后，您可以返回并更改策略以适应业务需求。当您与业务中的应用程序所有者交谈时，或您的安全部门对设备上的某些策略或设置有特定要求时也是如此。这是一个持续的过程，用于评估您是否在环境中使用正确的策略，就像您在策略配置使用\
  \ GPO 时可能有类似的过程一样。\n\n在本章之后，您将能够管理您的物理和云端点，并知道在未来何时遵循哪种配置路径。下一章是策略管理的第三部分。最后一部分介绍了一个云服务，如果您拥有\
  \ Office 365，您可以利用它来配置 Microsoft 365 应用程序，无论是否使用 Microsoft Intune。\n\n## 问题\n\n\
  - 1. 什么是 Storage Sense？\n  a) 用于优化 SSD 性能的服务。\n  b) 具有幽默感的服务。\n  c) 用于清理端点上 OneDrive\
  \ 缓存和配置文件中下载文件夹的服务。\n  d) 用于阻止服务运行的服务。\n\n2. 配置 Windows 端点设置的推荐选项是什么？\n\n- a) 设置目录\n\
  - b) 管理模板\n- c) 安全基线\n- d) 设备限制配置文件\n\n3. 可以使用哪种策略类型来配置 Microsoft Edge？\n\n- a)\
  \ 共享多用户设备\n- b) 管理模板\n- c) Kiosk 配置文件\n- d) 设备限制配置文件\n\n## 答案\n\n- 1. (c)\n- 2.\
  \ (a)\n- 3. (b)\n\n## 进一步阅读\n\n如果您想在阅读本章后了解更多信息，请查看以下免费在线资源：\n\n- Device compliance\
  \ policies in Microsoft Intune – Azure | Microsoft Docs:\n  https://docs.microsoft.com/en-us/mem/intune/protect/device-compliance-get-started\n\
  - Use templates for Windows 10 devices in Microsoft Intune – Azure | Microsoft Docs:\
  \ https://docs.microsoft.com/en-us/mem/intune/configuration/administrative-templates-windows\n\
  - Restrict device features using policies in Microsoft Intune – Azure | Microsoft\
  \ Docs: https://docs.microsoft.com/en-us/mem/intune/configuration/device-restrictions-configure\n\
  \n## 11\n\n## Office 策略管理\n\n在本章中，您将了解 Office 云策略，以及如何使用此云服务来配置最终用户在其 Windows 设备上安装的\
  \ Microsoft 365 应用程序，无论是在家中的 Windows 设备还是由 Microsoft Intune 等管理工具管理的公司发放的 Windows\
  \ 设备。这不是 GPO、Microsoft Intune 中的管理模板或设置目录策略的替代品，但在某些场景中，您可以利用 Office 云策略服务。\n\n\
  我们还将展示 Office 云策略服务具有安全策略顾问，它可以帮助您和您的企业了解是否已实施正确的策略建议。这些建议基于 Microsoft 最佳实践以及有关您现有环境的信息。\n\
  \n安全策略顾问只能与 Office 云策略服务结合使用。\n\n在本章中，我们将涵盖以下主题：\n\n- Office 云策略服务\n- 使用 OCP 服务创建策略配置\n\
  - 安全策略顾问\n\n\n\n\n\n## Office 云策略服务\n\nMicrosoft 365 Apps 管理中心（https://config.office.com）提供对\
  \ Microsoft 365 企业版应用的基于云的策略管理。从 **Office 云策略 (OCP)** 服务部署的策略将适用于受管设备和未受管设备，因此基本上适用于贵组织\
  \ Office 365 用户登录的所有设备，包括公司设备和个人设备。\n\n当用户在设备上登录 Microsoft 365 Apps for enterprise\
  \ 时，策略设置会漫游到该设备。您还可以强制实施适用于 Office 网页版、iOS、macOS 和 Android 的某些策略设置。\n\nOffice 云策略服务包含许多与\
  \ Group Policy 或 Microsoft Intune 中可用的基于用户的策略设置相同的设置。OCP 服务与来自 **组策略对象 (GPO)** 或\
  \ Microsoft Intune 的策略设置的冲突处理方式为 Microsoft Intune 或 GPO 始终获胜。用户可以是具有冲突策略设置多个 Azure\
  \ Active Directory 组 的成员。通过在 OCP 上为 Office 策略设置优先级，您可以控制应用哪个策略设置。优先级最高者将被应用，其中 0\
  \ 是可在 OCP 服务中分配给策略的最高优先级。\n\n使用 Office 云策略服务的条件如下：\n\n- 至少为 Microsoft 365 Apps for\
  \ enterprise（以及 Project 和 Visio 桌面应用的订阅版本）的 1808 版本。\n- 用户帐户必须在 **Azure Active Directory\
  \ (AAD)** 中创建或同步。用户必须使用基于 AAD 的帐户登录 Office 365 ProPlus。\n- 安全组必须在 **AAD** 中创建或同步，并将适当的用户添加到这些组中。\n\
  \n基于云的策略管理的优点如下：\n\n- 它适用于所有设备 – 受管和未受管设备，均适用于 Microsoft Intune 和 SCCM。\n- 它适用于\
  \ BYOD 和个人设备。\n- 设置始终是最新的，并且由于它是来自 Microsoft Office 团队的服务，因此无需下载更新的 Administrative\
  \ Template 文件（ADMX/ADML）。\n\n## 使用 OCP 服务创建策略配置\n\n以下是从 MEM 管理中心创建策略配置的基本步骤。\n\n\
  要创建策略配置，您必须在 AAD 中被分配以下角色之一：全局管理员、安全管理员或 Office 应用管理员。Intune 服务管理员无权创建 OCP 策略。\n\
  \n- 1. 转到 **Home | Apps | Policies for Office apps.**\n\n如果这是您第一次查看 Office 云策略服务，您将没有任何策略配置。\n\
  \n点击 **Create** 创建您的第一个策略配置。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_428_0.png)\n\
  \n图 11.2 – Policies for Office apps\n\n2. 在 Name 字段中输入 Office policy，然后点击 Select\
  \ type 以展开到以下屏幕截图中显示的视图。选择 This policy configuration applies to users。\n\n选择此选项时，您可以从\
  \ AAD 中选择目标用户组。如果您选择 This policy configuration applies to users that access documents\
  \ anonymously using Office web apps，它将应用于 Office Online，如果文档是匿名访问的。IT 管理员始终可以设置外部共享，以便访客用户必须登录或提供验证码：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_429_0.png)\n\n图 11.3 – Create policy\
  \ configuration – Select type\n\n3. 对于 Select group 选项，选择 Office 365 Users（自定义组）。\n\
  \n然后点击 Select group 以展开到以下屏幕截图中显示的视图。您可以选择 AAD 安全组，但一个安全组只能分配一个 OCP 服务策略：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_430_0.png)\n\
  \n图 11.4 – Create policy configuration – Select group\n\n- 4. 如果已将 OCP 分配给 AAD 组，它将在\
  \ UI 中变灰，因为您只能在 Azure AD 中为每个组分配一个 Office 云策略：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_430_1.png)\n\
  \n图 11.5 – Select the group for this policy configuration\n\n## 配置策略\n\n截至目前，Office\
  \ 云策略服务中共有 2,133 个不同的策略设置。\n\n配置要包含在策略配置中的策略设置。您可以搜索策略设置名称以查找要配置的策略设置。您还可以按应用程序筛选，按策略是否为推荐的安全基线，以及策略是否已配置进行筛选。Platform\
  \ 列指示策略是应用于 Windows 设备的 Microsoft 365 Apps for enterprise、Office for the web，还是两者都适用。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_431_0.png)\n\n图 11.6 – Create policy\
  \ configuration\n\n在本例中，我们将配置所有 Microsoft 365 企业版应用的默认文件格式：\n\n- 1. 搜索 `Default\
  \ file format`。\n- 2. 选择 Word 的 **Default file format**。\n- 3. 从 **Not configured**\
  \ 更改为 **Enabled**。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_432_0.png)\n\n对其他\
  \ Microsoft 365 企业版应用执行相同的操作。\n\n点击 Create。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_433_0.png)\n\
  \n图 11.8 – Create policy configuration\n\n至此，关于 Microsoft Endpoint Manager 中 Office\
  \ 云策略的部分结束。我们向您展示了如何创建可部署到组织中所有终端的 Office 策略。在下一节中，我们将向您展示 OCP 服务中的一些技巧。\n\n如果您输入\
  \ Word，您将只看到适用于 Word 的策略：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_435_0.png)\n\
  \n图 11.10 – Filters on Application\n\n如果您选择 Security Baseline，您将只看到适用于 Windows 的策略；其他操作系统没有安全基线：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_436_0.png)\n\n图 11.11 – Filters on Recommendations\n\
  \n当您选择安全基线中的策略设置时，您只需选择 Microsoft recommended security baseline 即可将策略配置为正确的值：\n\n\
  ![](img/a3e9f26159d3739e434fe676b2987c1d_436_1.png)\n\n图 11.12 – Microsoft recommended\
  \ security baseline\n\n如果您勾选 **Configured**，您将只看到策略中已配置的策略：\n\n图 11.13 – Filters\
  \ by Status\n\n如果您使用 **Configured** 作为筛选器，您可以看到所有已配置的策略设置：\n\n图 11.14 – Filter –\
  \ Configured\n\n> Note\n> 如果您仅在设备上安装 Microsoft Teams，则不会安装 Click-to-Run 服务，并且 Office\
  \ 云策略不会应用于设备。\n\n可以通过转到 File | Account | Switch account 在 Office 应用程序中切换帐户：\n\n\
  ![](img/a3e9f26159d3739e434fe676b2987c1d_439_0.png)\n\n图 11.16 – Office – Account\n\
  \nMicrosoft Intune ADMX 策略或 GPO 用户策略可以位于本地注册表中，\n\n```\nHKCU\\software\\policies\\\
  Microsoft\\Office\\16.0\\\n```\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_439_1.png)\n\
  \n图 11.17 – Registry path for Office ADMX\n\n来自 GPO 或 Microsoft Intune ADMX 策略的许多策略都是按设备设置的。在本例中也是如此，这也是只有一个策略值显示的原因。\n\
  \n从 Office 云策略服务检索的策略设置存储在注册表中的 HKEY_CURRENT_USER\\Software\\Policies\\Microsoft\\\
  Cloud\\Office\\16.0。此键在每次在签入过程中从策略服务检索新一组策略时都会被覆盖。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_440_0.png)\n\
  \n图 11.18 – Registry path for Office cloud policy\n\n策略服务签入活动存储在注册表中的 HKEY_CURRENT_USER\\\
  Software\\Microsoft\\Office\\16.0\\Common\\CloudPolicy。删除此键并重新启动 Office 应用将在下次启动\
  \ Word 或 Excel 等 Office 应用时触发策略服务签入：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_440_1.png)\n\
  \n图 11.19 – Registry path for Office cloud policy check-in\n\n至此，关于使用 Office 云策略服务配置策略的部分结束。在下一节中，我们将介绍\
  \ Apps 管理中心中的 Security Policy Advisor 如何帮助您改进在 Office 云策略服务中配置的策略的安全设置。\n\n\n\n\n\
  \n# 安全策略顾问\n\n在 Microsoft Intune 之外，直接在 Microsoft 365 Apps 管理中心中，还有更多 Office 策略管理的选项。\n\
  \n登录 Apps 管理中心 https://config.office.com：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_441_0.png)\n\
  \n图 11.20 – 欢迎使用 Microsoft 365 Apps 管理中心\n\n你可以选择使用安全策略顾问，根据企业版 Microsoft 365 应用的使用情况，为你提供安全策略的智能建议：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_441_1.png)\n\n图 11.21 – Apps 管理中心 – 安全策略顾问\n\
  \n图 11.24 – Office 企业版应用策略\n\n进入已应用策略刀片，你可以看到或回滚刚刚应用的策略设置：\n\n图 11.25 – Office 企业版应用策略\
  \ – 已应用策略\n\n启用 **显示所有建议（包括生产力影响高的建议）**：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_444_0.png)\n\
  \n图 11.26 – Office 企业版应用策略 – 显示所有建议\n\n你将获得推荐策略设置及其对终端用户的生产力影响的概览。这可以帮助你在更改策略设置前做出正确的决定：\n\
  \n| 推荐策略 | 功能 ↑ | 应用 ↑ | 生产力影响 ↓ | 置信度 ↑ |\n|---|---|---|---|---|\n| New! Word 的\
  \ Office Open XML 转换器 | 文件阻止 | Word | 用户组中 100% 的用户 | 高 |\n| New! Excel 2007 及更高版本的二进制工作簿\
  \ | 文件阻止 | Excel | 用户组中 100% 的用户 | 高 |\n| 预览仅信任使用 V3 签名签名的 VBA 宏 | VBA | Office\
  \ | 用户组中 0% 的用户 | 高 |\n| New! Word 的旧版转换器 | 文件阻止 | Word | 用户组中 0% 的用户 | 高 |\n\n\
  图 11.27 – Office 企业版应用策略 – 推荐策略\n\n你还会看到具有高用户影响的策略建议，在本例中为 **用户组中 100% 的用户。**\n\n\
  # 总结\n\n至此，本书关于策略管理的章节已全部结束。在本章中，你了解了 Office 云策略服务，你可以从其管理门户或从 Microsoft Intune\
  \ 中使用它。Office 云策略适用于各种类型的终端，包括 Windows（桌面版和 Windows 365）、macOS、iOS 和 Android。后三种操作系统类型在本書中未涵盖，但重要的是要知道\
  \ Office 云策略服务可在多个操作系统上运行，而不仅仅是 Windows。本章要带走的一个要点是，Office 云策略仅在用户上下文中应用，这意味着目前你无法设置仅存在于设备级别的策略。\n\
  \n在下一章中，你将了解用于配置文件管理的不同工具。\n\n# 问题\n\n+   1. 什么是 Office 云策略服务？\n+      A. 本地服务\n\
  +      B. 一组组策略\n+      C. 一个帮助你为 Microsoft 365 应用配置策略的云服务\n+      D. 用于配置 Microsoft\
  \ Edge 的服务\n+   2. 你可以从 Microsoft Endpoint Manager 管理中心配置 Office 云策略服务吗？\n+    \
  \  A. 是\n+      B. 否\n+   3. 你可以用 Office 云策略服务配置 Office 2016 吗？\n+      A. 是\n+\
  \      B. 否\n\n# 答案\n\n+   1. (C)\n+   2. (A)\n+   3. (B)\n\n# 进一步阅读\n\n如果你想在阅读本章后了解更多信息，请使用以下免费在线资源：\n\
  \n+   - Microsoft 365 Apps for enterprise 的 Office 云策略服务概述： https://docs.microsoft.com/en-us/deployoffice/overview-office-cloud-policy-service\n"
- "# 用户配置文件管理\n\n配置文件管理是确保良好用户体验的非常重要的因素。你的 Windows 配置文件包含一组基线设置，用于个性化你的 Windows 10\
  \ 体验。因此，使用满足你需求的技术非常重要，以确保你在其他设备和终端上也能获得相同的体验。\n\n幸运的是，随着云服务的出现，配置文件管理如今变得容易得多——得益于\
  \ **Azure Active Directory (Azure AD)**、OneDrive 和 Microsoft Edge 等服务，这几乎是轻而易举的事！\n\
  \n阅读本章后，你将了解在物理和云终端上配置现代配置文件管理的全部内容。\n\n在本章中，我们将介绍以下主题：\n\n+   - Windows 配置文件\n\
  +   - **企业状态漫游 (ESR)**\n+   - Microsoft Office 的漫游设置\n+   - OneDrive for Business\
  \ 已知文件夹移动\n+   - Microsoft Edge\n+   - ESR + OneDrive + Edge + Office\n\n# Windows\
  \ 配置文件\n\nWindows 配置文件是 Windows 10 Enterprise 的一个非常重要的组件。\n\n在桌面环境中，你可以使用不同类型的配置文件。首先，本地用户配置文件主要作为\
  \ Microsoft Endpoint Manager 的一部分使用。为了使其现代化，我们将向配置文件中添加云服务（稍后解释）。\n\n过去使用的其他版本是为了简化配置文件。让我们看看\
  \ Microsoft Endpoint Manager 中使用的不同配置文件版本的更多细节：\n\n+   - **本地用户配置文件**：这些是存储在操作系统磁盘上的用户配置文件，在你首次登录\
  \ Windows 10 Enterprise 时创建。本地配置文件中存储的一切都特定于用户而不是计算机。本地配置文件是我们同时在物理终端和 Windows 365\
  \ 中使用的解决方案。\n\n+   - **临时用户配置文件**：如果出现配置文件错误，则会发放临时配置文件，使用临时配置文件是为了避免用户加载一个新空配置文件从而覆盖现有配置文件。临时配置文件在用户登录后会被清除，作为安全机制。临时配置文件仅在出现错误情况、无法加载正常的本地配置文件时使用。\n\
  \n我们不建议在撰写本书时使用的配置文件类型是漫游和强制配置文件：\n\n+   - **漫游用户配置文件**：这是一种相对较旧的技术，可在登录和注销时将你的本地配置文件复制到中央文件服务器共享。此配置文件复制过程基于文件，可能会在配置文件较大时延长用户的登录过程。随着\
  \ Office 365 服务在启用缓存的情况下使用，这种技术并不是最佳选择。当你是物理或云终端的所有者时，本地配置文件是作为持久终端用户体验的最佳替代方案。\n\
  \n+   - **强制用户配置文件**：强制配置文件是应用了许多自定义设置或修改的本地配置文件模板。每次用户登录时，都会基于此强制配置文件模板创建一个新的 Windows\
  \ 本地配置文件。这使得为终端用户提供一致且全新的配置文件体验成为可能。注销后配置文件设置不会保存。因此，此配置文件类型仅适用于非持久使用场景。\n\n+  \
  \ - **简化管理与监控：** 提供轻松访问、控制和查看谁能够将其 Windows 配置文件设置同步到 ESR 以及谁不能。在 Azure 门户中，你可以根据\
  \ Azure AD 组过滤访问权限。\n\n当你的环境中同时存在物理设备和虚拟设备时，可以利用 ESR 在你的设备之间传输配置文件的一部分，以实现统一的配置文件设置体验。以下屏幕截图显示了如何为所有用户或选定的（Azure\
  \ AD）人员组激活该设置：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_450_0.png)\n\n*图 12.1\
  \ – ESR 设置*\n\n# ESR 中包含哪些特定的配置文件数据？\n\n以下是存储在 ESR 数据中、属于 Azure AD 用户的配置文件设置列表，每当用户登录到干净的\
  \ Windows 10 Enterprise 设备时，这些设置将被还原，以提供统一的体验：\n\n| 配置文件组件 | 描述 |\n|---|---|\n|\
  \ Windows 主题 | 你的桌面主题和任务栏设置已保存。 |\n| 语言设置 | 键盘布局、系统语言、日期和时间设置等。 |\n| 缓存密码 | 你的密码存储在\
  \ Windows 和你的浏览器中。 |\n| 易用性功能 | 高对比度主题偏好以及 Narrator 和 Magnifier 设置已保存。 |\n| 其他 Windows\
  \ 设置 | 鼠标属性和设置已保存。 |\n\n一旦启用 ESR，登录你的 Windows 10 Enterprise 桌面并在 **设置** 菜单下打开 **帐户**。你将看到作为\
  \ Windows 配置文件一部分同步的所有已激活设置！\n\n\n\n\n\n通常情况下，作为 IT 管理员，您会创建强制执行以下设置的策略，以便最终用户无法禁用这些设置。这将确保配置文件设置数据始终安全地存储在\
  \ Microsoft 云中：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_451_0.png)\n\n图 12.2\
  \ – Windows 中的 ESR 设置\n\n在下一节中，我们将更详细地解释 Microsoft Office 产品如何自动将设置同步到云中，以实现无缝的最终用户体验。\n\
  \n## Microsoft Office 的漫游设置\n\nOffice 的漫游功能可在 Microsoft 365 应用和设备之间实现体验，从而提高生产力，并在任何设备上让\
  \ Office 更个性化。一些设置和功能的示例包括最近使用文件列表、文档中的最后阅读位置、Office 加载项的首次运行体验、自动更正首选项和主题。\n\n\
  以下是完整的设置列表：\n\n- 最近使用文件（所有应用）\n- 最近使用位置（所有应用）\n\n在下一节中，我们将解释 Outlook 签名如何同步到云中。\n\
  \n## Outlook 的签名云设置\n\nOffice 漫游功能提供的另一个很酷的新增强功能是能够将您的 Outlook 设置存储在云中，作为您的 Azure\
  \ AD/Office 365 帐户的一部分。我们在上一节中解释了不同的 Office 服务，例如最近使用文件，以及保存的其他组件。\n\n其中一个长期以来一直具有挑战性的\
  \ Outlook 设置是 Outlook 签名。现在已修复，因为签名设置存储在云中，因此无论您在任何计算机上访问 Outlook for Windows，您的体验都是一致的。\n\
  \n要启用此功能，您只需打开 **Outlook 选项** 菜单，然后选择 **常规**。在此窗格中，您勾选 **将我的 Outlook 设置存储在云中** 旁边的复选框。\n\
  \n您的 Outlook 签名现在会跟随您，即使在本地配置文件重置后也是如此，这很酷，对吧？\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_453_0.png)\n\
  \n图 12.4 – Outlook 的云存储选项\n\n在下一节中，您将了解有关 OneDrive for Business **已知文件夹移动 (KFM)**\
  \ 的信息。\n\n## OneDrive for Business 已知文件夹移动\n\nOneDrive for Business KFM 是一种简单的方法，可备份您的重要文件夹（**桌面**、**文档**\
  \ 和 **图片** 文件夹）到您的虚拟 Windows 365 PC 中，以便在无需任何用户交互的情况下受保护并在其他设备上可用。\n\nOneDrive PC\
  \ 文件夹备份在 **Windows 365 上默认启用**，因此这是一种轻松的方式，可在其他设备上继续工作，例如您的物理终端或移动设备，因为所有文件夹也会立即在这些设备上可用。\n\
  \n由于 OneDrive Files On-Demand 默认启用，您 Cloud PC 配置文件内的存储分配也将保持较低，因为 OneDrive 中的此功能让您无需占用计算机上的存储空间即可访问文件。\n\
  \n作为 Windows 365 的一部分，OneDrive 会静默配置，并且 PC 文件夹备份（KFM）也会默认激活，以确保在您的 Windows 10/11\
  \ Enterprise 桌面环境中为业务连续性和灾难恢复目的保护您的数据。\n\n您可以在安装在 Windows 设备上的 OneDrive 客户端中找到 OneDrive\
  \ KFM 设置，以将您的 **桌面**、**文档** 和 **图片** 文件夹同步到 OneDrive 云，如下所示：\n\n### 管理文件夹备份\n\n\
  这些文件夹正在 OneDrive 中同步。新的和现有文件将被添加到 OneDrive、备份，并在其他设备上可用，即使您丢失了此 PC。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_454_0.png)\n\
  \n选择后 OneDrive 剩余空间：4,639 GB\n\n图 12.5 – OneDrive KFM\n\n## 重要说明\n\n以下屏幕截图中显示的设置允许您在\
  \ Windows 10 Enterprise 终端上静默配置 OneDrive PC 文件夹备份。正如您所见，这相对容易...\n\n顺便说一下，OneDrive\
  \ 中内置了一个新的错误消息，用于在您使用 KFM 时警告您在 PC 上本地删除文件。幸运的是，文件会自动备份到回收站中 30 天。因此，完全不用担心。\n\n\
  当您想在 Windows 10 Enterprise 终端上使用此设置时，请直接在 Microsoft Endpoint Manager 中作为策略设置激活以下选项：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_455_0.png)\n\n图 12.6 – 从同步中排除 OneDrive\
  \ 文件和扩展名\n\n如果您不小心删除了 Windows 配置文件中的文件，OneDrive 会自动拍摄文件快照——并且始终提供在接下来的 30 天内恢复的选项。请参阅出现的以下新消息：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_456_0.png)\n\n图 12.7 – OneDrive 中意外删除文件的新的提示\n\
  \n在下一节中，我们将解释如何从 Windows 对 OneDrive 缓存执行维护和清理操作。\n\n## Windows 10 存储感知\n\nWindows\
  \ 10 存储感知与 OneDrive 协同工作，通过将您最近未使用的本地可用的 OneDrive 文件再次设为仅在线，从而自动释放空间。\n\n如果您在过去\
  \ 30 天内未使用任何文件，当设备可用空间不足时，可以将其设置为仅在线。您还可以安排并定义存储感知运行的频率：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_456_1.png)\n\
  \n图 12.8 – 存储感知\n\n## OneDrive 和存储感知\n\n借助存储感知，您可以静默协助 Windows 设备管理存储，例如释放 OneDrive\
  \ 缓存空间。OneDrive 使用 Files On-Demand 同步仅必要的數據到您的终端。由于 OneDrive 会在本地缓存数据，您可能希望在一段时间后释放此缓存空间。存储感知使您能够根据业务偏好执行此操作。\n\
  \nOneDrive 数据始终在您的配置文件中可见，并且只有在您需要再次访问并进行更改时才需要重新下载。\n\n您可以在 Windows 的 **系统** 设置菜单中，在\
  \ **存储** 下找到存储感知。您可以使用 **内容在未打开超过：** 下的下拉菜单清理数据：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_457_0.png)\n\
  \n图 12.9 – 清理缓存\n\n您也可以仅在操作系统磁盘空间不足时才执行此操作——以防紧急情况：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_457_1.png)\n\
  \n图 12.10 – 清理计划\n\n您还可以使用此功能清理 Windows 配置文件中的下载文件夹。这也很方便：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_458_0.png)\n\
  \n图 12.11 – 下载文件夹清理\n\n## Microsoft Edge\n\nMicrosoft Edge 越来越多地成为绝大多数用户的主流浏览器。这是\
  \ Microsoft Edge 工程团队努力工作的结果，最近添加了许多功能以解决客户反馈并使 Edge 准备好用于企业采用。\n\n在配置文件管理的背景下，Microsoft\
  \ Edge 也提供了很棒的功能，因为它支持将所有浏览器相关数据作为 Azure AD 凭据的一部分进行同步。这意味着您的历史记录、收藏夹、密码集合、设置、扩展和打开的标签页将为您存储在\
  \ Microsoft 云中。\n\n例如，您可以为配置文件相关数据配置 OneDrive KFM 到您的 Windows 配置文件中，以将文档、图片和桌面文件夹重定向为备份层——Edge\
  \ 对浏览器设置也做同样的事情。此外，重要的是要注意，Edge 浏览器特定的配置文件数据在您使用 Edge 作为浏览器的所有设备之间共享。想象一下，从您的物理或虚拟终端切换到\
  \ Surface Duo 或 iPhone 并继续您离开的地方。\n\n在初始配置过程中，或在首次启动 Edge 时，您将被要求使用 Azure AD 凭据登录。之后，它会要求您同步您的配置文件。在此首次启动之后，它现在将开始保存您的\
  \ Edge 配置文件数据——从您第二次启动 Edge 开始，您的所有浏览器设置都将预先加载，您的 Edge 浏览器看起来和感觉与在其他设备上完全相同。\n\n\
  您还可以使用组策略预设 Edge 中的静默登录和自动同步激活，以强制执行此设置以确保配置文件同步。\n\n在 Edge 中手动启用配置文件同步的设置如下图所示：\n\
  \n\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_459_0.png)\n\n图 12.12 – Edge 配置文件同步选项\n\
  \n启用同步设置后，以下 Edge 专属配置文件数据将自动同步：\n\n- 收藏夹\n- 密码\n- 表单填充数据\n- 历史记录\n- 打开的标签页（会话）\n\
  - 设置（首选项）\n- 扩展\n\n另一个值得强调的选项是使用多个配置文件。例如，假设你有一个用于私人使用的个人账户，以及一个业务账户。你可以简单地再创建一个配置文件，个人配置文件将完全与另一个隔离。再见了，只能打开一个隐私模式会话的限制，或因这个原因而使用其他浏览器的情况。\n\
  \n你也可以使用“以访客身份浏览”选项，在不创建配置文件的情况下使用隔离会话，当你不想将其保存到 Azure AD 账户凭据的在线配置文件存储中时。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_461_0.png)\n\
  \n图 12.14 – OneDrive + ESR + Edge\n\n## 从传统迁移到现代配置文件管理\n\n本章中的所有章节都解释了如何将配置文件管理配置现代化，作为物理或云端点的组成部分。\n\
  \n配置一切的便捷性也适用于从任何其他配置文件管理解决方案的迁移路径，无论是漫游配置文件还是市场上任何其他解决方案。\n\n在迁移前需要在传统环境中执行以下步骤：\n\
  \n1. 如果你正在使用漫游配置文件，你唯一需要做的就是激活 OneDrive PC 文件夹备份（KFM）和 ESR，并确保 Edge 和 OneDrive 静默配置已打开。\n\
  2. 当你在现有配置文件解决方案之上配置此项时，数据的同步将在用户继续使用现有解决方案的同时进行。\n3. IT 管理员随后可以在成功配置所有现代组件后，安排切换时间以移除漫游配置文件元素并继续使用本地配置文件。此方法也适用于\
  \ FSLogix。\n\n这可能是一个可选择的方案，当你目前使用传统的 VDI 解决方案并希望利用 Windows 365 时，也适用于你使用 Endpoint\
  \ Configuration Manager 或任何其他物理端点管理解决方案，并希望将其迁移到由 Microsoft Endpoint Manager 管理的物理端点时。\n\
  \n## 总结\n\n在本章中，你了解了使用 OneDrive 和 Microsoft Edge 等产品在 Windows 10 Enterprise 环境中现代化和优化\
  \ Windows 配置文件的各种选项。\n\n在下一章中，我们将解释身份和安全管理世界的方方面面。\n\n## 问题\n\n1. 允许你在 OneDrive\
  \ 中重定向配置文件文件夹的功能名称是什么？\n   A. PC 文件夹备份\n   B. 文件夹快照\n   C. 文件夹复制\n   D. OneDrive\
  \ 配置文件备份\n\n2. 在现代化的 Windows 配置文件背景下，使用 Edge 的主要好处是什么？\n   A. Edge 可以通过 Microsoft\
  \ Endpoint Manager 进行注册。\n   B. 它默认包含在 Windows 10 Enterprise 中，因此无需在 Windows 配置文件中安装。\n\
  \   C. Edge 支持同步 Edge 配置文件相关数据，包括收藏夹、历史记录和密码缓存。\n\n## 答案\n\n1. (A)\n2. (C)\n\n##\
  \ 进一步阅读\n\n如果你在阅读本章后想了解更多关于 Windows 配置文件的信息，请查阅以下免费在线资源：\n\n- Enterprise State Roaming\
  \ FAQ – Azure Active Directory | Microsoft Docs: `https://docs.microsoft.com/en-us/azure/active-directory/devices/enterprise-state-roaming-faqs`\n\
  - Microsoft Edge and Enterprise State Roaming | Microsoft Docs: `https://docs.microsoft.com/en-us/deployedge/microsoft-edge-enterprise-state-roaming`\n\
  \n## 13\n身份和安全管理\n\n在本章中，你将了解有关 Azure Active Directory（AAD）和安全性的所有内容。我们将介绍 AAD 的历史以及你可以配置的不同安全方面，以保护组织内的\
  \ Windows 10 Enterprise 设备。\n\n在本章中，我们将介绍以下主题：\n\n- Microsoft Identity\n- AAD\n\
  - 用户和组\n- 混合 AAD\n- 条件访问\n- BitLocker 磁盘加密\n- 自助密码重置\n- AAD 密码保护\n- 无密码身份验证\n- 每个无密码场景中支持和不支持的内容\n\
  - Microsoft Defender for Endpoint\n\n## Microsoft Identity\n\n**Active Directory\
  \ Domain Services（AD DS）** 自 2000 年起就已面市。正如你们中的一些人可能还记得的那样，它随 Windows 2000 Server\
  \ 的首次发布而推出。\n\n其工作原理是，你将 Windows 客户端或服务器设备加入 **Active Directory（AD）**，以通过组策略或安全设置接管其管理层，或将其用于将不同的\
  \ AD 环境相互连接，以将组织权限委托给存储在不同 AD 环境中的资源——在不同的林中。\n\n在 **Microsoft Endpoint Manager（MEM）**\
  \ 的上下文中，可以连接到同时加入 AD DS 和 AAD 的 Windows 设备。加入 AD DS 且也需要在 AAD 中可用的设备称为 **混合 AAD\
  \ 加入（HAADJ）**。在你的业务准备好原生使用 AAD 之前，混合 AAD 可能是作为过渡方案的最佳选择。让我们在下一节中进一步讨论这个问题。\n\n如果你的设备直接注册到\
  \ AAD 并在 MEM 中的 **所有设备** 中列出，你可以在 Windows 10 Enterprise **设置** 菜单中看到 AAD 域属性。\n\n\
  ![](img/a3e9f26159d3739e434fe676b2987c1d_466_0.png)\n\n图 13.1 – 访问工作或学校\n\n设备可能处于不同状态，但共同点是，你都可以在设置应用下的\
  \ **账户 | 访问工作或学校** 中看到它们。\n\n让我们接下来看 AAD。\n\n## AAD\n\nAAD 为 Windows 10 Enterprise\
  \ 和 MEM 提供 **单点登录（SSO）** 和 **多因素身份验证（MFA）**，以帮助保护你的用户免受 99.9% 的网络安全攻击。\n\nAAD 是传统\
  \ AD（AD DS）的演进，使其能够实现以下功能：\n\n- SSO 简化了从任何地方访问你的应用。\n- 条件访问和 MFA 有助于保护你的环境免受外部入侵者。\n\
  - 作为单一身份平台，它让你能更安全地与内部和外部用户互动。\n- 开发人员工具使将身份集成到你的应用和服务中变得容易。\n\n让我们接下来看 AAD 用户。\n\
  \n## AAD 用户\n\nAAD 用户包括组织中用户的账户设置，仅存在于 Microsoft Azure 云中。创建和删除用户可以通过使用 AAD 全局管理员角色或分配了账户管理员\
  \ **基于角色的访问控制（RBAC）** 角色的账户来完成。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_467_0.png)\n\
  \n图 13.2 – MEM 管理中心中的新用户\n\n直接在 AAD 中创建新用户适用于仅云身份；混合身份仍需在本地 AD 中创建并通过 AD Connect\
  \ 同步到 AAD。让我们接下来看 AAD 访客用户。\n\n## AAD 访客用户\n\n访客用户账户旨在与 AAD 租户环境之外的其他组织协作，而无需创建包含组织域的普通\
  \ AAD 用户账户。一个例子是允许访问 SharePoint 站点。如果最终用户有权在 OneDrive for Business 中共享文档，也可以使用访客用户完成。\n\
  \n请注意，访客用户无法将设备注册到 AAD 或 Microsoft Intune。\n\n在 **创建新用户** 工作流中，IT 管理员可以选择邀请用户而不是在企业\
  \ AAD 中创建用户，如此工作流所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_468_0.png)\n\n\
  图 13.3 – 邀请访客用户\n\n在 **邀请用户** 工作流中，IT 管理员还可以分配 AAD 中的组或角色。这意味着访客用户可以被分配 Intune 管理员角色，例如，你可以将该角色授予外部顾问。\n\
  \n让我们接下来看 AAD 中组的各种选项。\n\n## AAD 组类型\n\nAAD 组有两种类型，如下所示：\n\n- **安全**：这是最常用的类型，因为它用于将成员添加到组以获得对文件夹共享、应用程序、RBAC、安全策略或云桌面环境的访问权限。\n\
  \n\n\n\n\n+   - **Microsoft 365**：这是其他 Microsoft 云服务（如 Exchange Online 和 SharePoint）中使用的组类型，以实现更好的协作。此组类型还允许客户与组织\
  \ AAD 租户环境之外的成员共享访问权限。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_469_0.png)\n\n\
  图13.4 – 创建新组\n\n安全组可用于用户和设备，但不能混合使用。接下来，我们将探讨不同的成员类型。\n\n## AAD 成员类型\n\n在上一节中，我们解释了\
  \ AAD 组类型的区别。有三种方式可以让用户或设备成为 AAD 组的成员：\n\n- **已分配**：这是向特定组分配访问权限的最常见方式。你将特定用户添加到\
  \ AAD 组中以获得访问权限，例如访问安全策略。\n- **动态用户**：此类型可根据你定义的条件自动将用户添加到组中。当用户不再满足成为组成员的要求时，无需任何交互即可将其添加或移出\
  \ AAD 组。\n- **动态设备**：此类型与动态用户成员类型有些类似；不过，它现在用于自动在 AAD 组中添加或移除设备。\n\n选择最适合你的用例的类型，因为动态成员身份可以为大型组织提供更具可扩展性的方法。动态组仅支持用户类型或设备类型之一，而不是两者。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_470_0.png)\n\n图13.5 – 创建新组\n\n在动态成员规则中，你可以创建基于属性的复杂规则来为组启用动态成员身份，并可使用这些规则在\
  \ AAD 组中添加和移除用户。\n\n例如，你可以通过添加以下规则，自动将所有在 AAD 中将 @contoso.com 配置为 proxyAddresses\
  \ 的用户添加进来。可以想象，通过这种方法将会有无数种选项可用。\n\n## 动态成员规则\n\n保存 放弃 有反馈？\n\n配置规则 验证规则（预览）\n\n\
  你可以使用规则生成器或规则语法文本框来创建或编辑动态成员规则。了解更多\n\n和/或 属性 运算符 值 proxyAddresses 包含 \"contoso\"\
  \n\n+ 添加表达式 + 获取自定义扩展属性\n\n### 规则语法\n\n```\n(user.proxyAddresses -contains \"contoso\"\
  )\n```\n\n图13.6 – 动态成员规则\n\n你现在也可以使用“验证规则”选项轻松测试表达式。如果验证结果显示为红色，则表示该用户不属于允许的筛选属性范围，因此不会动态添加到\
  \ AAD 组中：\n\n添加用户以根据此规则进行验证。了解更多\n\n+ 添加用户 验证 在组中 不在组中 未知\n\n| 名称 | 状态 |\n|---|---|\n\
  | Christiaan Brinkhoff<br>Christiaan@cpc-demo.cloud | ❌ 查看详细信息 |\n\n图13.7 – 动态规则验证\n\
  \n动态组可以帮助你在 Microsoft Intune 分配中更加敏捷。例如，动态设备具有多个属性，可以帮助将类似设备类型分组。\n\n接下来，我们将了解混合\
  \ AAD 及其重要性。\n\n## 混合 AAD\n\nHAADJ 设备是你组织的一部分，并使用属于该组织的 AD (AD DS) 账户登录。它们同时存在于云和本地环境中，以便在传统\
  \ AD DS 与 AAD 之间实现转换。这在 MEM 以及 *Windows 365* 中的不同场景下都是必需的。\n\n要使用混合 AAD，你必须复制本地环境，将身份和设备导入/同步到\
  \ AAD。你可以使用 Microsoft AAD Connect 软件完成此操作。\n\n该软件基于 **Microsoft 身份管理 (MIM)** 构建，并预配置了所有配置项目，可将本地用户、组和设备复制到\
  \ AAD。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_472_0.png)\n\n*图13.8 – Microsoft\
  \ AAD Connect – 快速设置*\n\n如果你过去已配置过 AAD Connect，则必须将配置更改为 HAADJ，以支持 Windows 365 等服务。混合\
  \ AAD 在以下替代场景中也可能很有帮助：\n\n- 你已将依赖 AD 机器身份验证的 Win32 应用部署到这些设备。\n- 你希望继续使用组策略来管理设备配置。\n\
  - 你希望继续使用现有的映像解决方案来部署和配置设备。\n- 除了 Windows 10 之外，你还必须支持较低级别的 Windows 7 和 8.1 设备。\n\
  \n确保你配置 AAD Connect – HAADJ – 的服务器能够连接到以下所有 URL：\n\n- https://enterpriseregistration.windows.net\n\
  - https://login.microsoftonline.com\n- https://device.login.microsoftonline.com\n\
  - https://autologon.microsoftazuread-sso.com\n\n请按照以下步骤满足该服务的先决条件。对于物理电脑，请执行以下操作：\n\
  \n1. 转到你的 AAD Connect 服务器，该服务器很可能在本地私有云数据中心环境中运行。\n2. 打开 Microsoft AAD Connect 程序。\n\
  3. 打开“配置设备选项”任务。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_473_0.png)\n\n图13.9\
  \ – 配置设备选项\n\n4. 使用组织的全局管理员账户登录，以验证你是此 AAD 租户的所有者。\n\n图13.10 – 连接到 AAD\n\n5. 完成后，系统会要求你更改\
  \ AAD 配置的设备选项。请将其更改为“配置混合 Azure AD 加入”。\n\n图13.11 – 配置混合 Azure AD 加入\n\n6. 确保选择“Windows\
  \ 10 或更高版本已加入域的设备”选项。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_475_0.png)\n\n\
  图13.12 – 设备操作系统\n\n7. 单击“下一步”后，你必须为你的 AD 林配置服务连接点 (SCP)。\n\n你必须单击绿色的“添加”按钮，将本地 AD\
  \ 的相应企业管理员凭据添加到 AAD 身份验证服务中。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_475_1.png)\n\
  \n图13.13 – SCP 配置\n\n8. 完成后，单击“下一步”按钮。\n\n现在，你可以将 AAD Connect 配置更改为混合 AAD。\n\n9.\
  \ 单击“配置”以开始配置。\n\n接下来，让我们了解条件访问。\n\n## 条件访问\n\n条件访问是 AAD 用于汇聚信号、做出决策并强制执行组织策略的工具。它是全新的身份驱动控制平面的核心。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_476_0.png)\n\n图13.14 – 条件访问\n\n管理员必须有两个主要目标：\n\
  \n- 无论何时何地，都要让用户高效工作。\n- 保护组织的资产。\n\n借助条件访问策略，你可以在需要时应用适当的访问控制来保持组织安全，并在不需要时避免干扰用户。\n\
  \n以下截图是一个基于 AAD 组配置筛选器的示例：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_478_0.png)\n\
  \n图13.16 – 包含用户和组\n\n可以配置包含和排除用户及组分配，以满足你公司的访问控制需求。\n\n接下来，我们将了解条件访问策略中的云应用。\n\n\
  ## 云应用\n\n云应用是代表 Microsoft 云或第三方应用程序的 AAD 企业应用程序。例如，可以是 Windows 365、软件即服务 (SaaS)\
  \ 应用程序或 Office 365 服务。\n\n若要为每个云应用强制执行不同的条件访问设置，可以创建仅适用于该特定应用程序的不同策略，以自定义访问权限：\n\
  \n## 选择\n\n云应用\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_479_0.png)\n\n图13.17\
  \ – 选择云应用\n\n云应用很可能以服务名称命名；否则，你必须根据相应的应用 ID 选择它们，例如 0af06dc6-e4b5-4f28-818e-e78e62d137a5。\n\
  \n除了按云应用进行筛选外，你还可以在操作期间应用条件访问设置，例如将设备注册和加入 MEM 的过程。此时你必须选择用户操作而不是云应用：\n\n- 注册安全信息\n\
  - 注册或加入设备\n\n基于所有或特定的云应用或操作控制用户访问。了解更多\n\n选择此策略的适用范围\n\n用户操作\n\n选择此策略将应用的操作\n\n\
  注册安全信息\n\n注册或加入设备\n\n图13.18 – 用户操作\n\n\n\n\n\n接下来，我们将查看条件访问策略中的条件。\n\n## 条件\n\n\
  有四种不同类型的条件可供配置：\n\n- **设备平台**：控制用户从不同设备平台的访问；例如，此策略仅在用户从 Android、Windows、macOS、iOS\
  \ 或 Windows Phone 登录时适用。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_480_0.png)\n\
  \n图 13.19 – 包含/排除平台\n\n- **位置**：根据用户的物理位置控制用户访问，例如基于公共 IP 允许列表。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_480_1.png)\n\
  \n图 13.20 – 包含/排除位置\n\n您可以在 **命名位置** 菜单中配置 IP 授权 – 条件访问中的 IP 列表。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_481_0.png)\n\
  \n图 13.21 – 条件访问 – 命名位置\n\n- **客户端应用**：控制用户访问以针对不使用现代身份验证的特定客户端应用程序。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_481_1.png)\n\
  \n图 13.22 – 选择此策略适用的客户端应用\n\n设置 **授予访问** 可以配置为全部或部分控制。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_483_0.png)\n\
  \n图 13.24 – 授予访问\n\nMFA 应该是强制性的；根据需要添加其他设置，例如控制未受 MEM 管理的设备上的访问。\n\n基于会话控制控制用户访问，以在特定云应用程序内启用有限的体验：\n\
  \n- **使用应用强制限制**：应用强制限制可能需要在云应用内进行额外的管理员配置。限制仅对新会话生效。\n- **访问控制设置**：条件访问应用控制可实时监控和控制用户应用访问和会话，基于访问和会话策略。访问和会话策略用于云应用安全门户中，以进一步细化筛选器并设置对用户的操作。\n\
  - **登录频率**：这是用户在尝试访问资源时再次被要求登录的时间段。默认设置是 90 天的滚动窗口，即用户在机器上不活动 90 天或更长时间后，首次尝试访问资源时将被要求重新进行身份验证。\n\
  \n> 提示\n> 此设置可能有助于在 **自带设备 (BYOD)** 设备上强制每小时进行一次 MFA，以确保在此时间后访问过期！\n\n- **持久浏览器会话**：持久浏览器会话允许用户在关闭并重新打开浏览器窗口后仍保持登录状态：\n\
  \n> 注意\n> 持久浏览器会话仅在选择 **所有云应用** 时才能正确工作\n\n- 这不会影响令牌生命周期或登录频率设置。\n- 这将覆盖公司品牌上的 **显示保持登录选项**\
  \ 策略。\n- **永不持久** 将覆盖从联合身份验证服务传递的任何持久 SSO 声明。\n- **永不持久** 将阻止移动设备上的 SSO 跨应用程序以及应用程序与用户移动浏览器之间进行。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_484_0.png)\n\n图 13.25 – 会话控制\n\n至此，我们完成了可用于保护企业数据的条件访问策略的演练。接下来，我们将展示一个选项，以防止用户在其\
  \ BYOD 设备上执行 AAD 设备注册。\n\n## 防止用户执行 AAD 设备注册\n\n要阻止用户在其加入企业域、加入 AAD 或混合加入 AAD 的\
  \ Windows 10 设备上添加额外的企业工作账户，请启用以下注册表项。此策略也可用于阻止加入域的机器意外地使用同一用户账户进行 AAD 注册：HKLM\\\
  SOFTWARE\\Policies\\Microsoft\\Windows\\WorkplaceJoin，\"BlockAADWorkplaceJoin\"\
  =dword:00000001。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_485_0.png)\n\n图 13.26\
  \ – 在您的设备上随处使用此账户\n\n没有集中方式可以防止用户在其 BYOD 设备上在 AAD 中注册。如果已配置 AAD 自动 MDM 注册并且已设置允许我的组织管理我的设备的复选标记，则设备将被注册到\
  \ Microsoft Intune。接下来，我们将查看自助密码重置 (SSPR)。\n\n## 自助密码重置\n\nSSPR 功能允许企业让用户无需服务台交互即可自行重置密码。这可以大幅减少组织中的支持工单数量，因为大多数用户可以自行恢复。\n\
  \n当用户多次错误输入密码时，账户将进入锁定状态。借助 SSPR 服务，最终用户可以更改密码，并在该过程中被提示进行 MFA。\n\n> 注意\n> 在用户可以解锁账户或重置密码之前，他们必须注册其联系信息。\n\
  \nSSPR 需要 AAD Premium P1 许可证，该许可证随 Microsoft 365 E3 或更高版本提供。\n\n您必须转到 Azure 门户中的\
  \ AAD (https://portal.azure.com/#home) 来激活该功能。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_486_0.png)\n\
  \n图 13.27 – 自助密码重置已启用\n\n也可以仅对 AAD 组成员启用 SSPR – 通过菜单中的“所选”选项。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_486_1.png)\n\
  \n图 13.28 – 密码重置 – 选择用于范围限定的组\n\n接下来，我们将查看 AAD 密码保护。\n\n## 无密码身份验证\n\n阅读上一节时，您可能会想，密码-less\
  \ 登录身份验证怎么办？好问题！\n\nMicrosoft 旨在让设置密码变得更容易；我们的策略是四步方法，我们部署替代方案，减少密码攻击面，过渡到无密码部署，最后消除密码。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_488_0.png)\n\n无密码身份验证是一种无需输入密码即可登录 Windows\
  \ 10 Enterprise 端点的方式。最常见的方法之一是通过所谓的 YubiKey 安全密钥。您有 USB-C、USB 以及其他设备的版本，例如 Apple\
  \ 设备。其他选项是使用短信或 Microsoft Authenticator 应用。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_488_1.png)\n\
  \n让我们谈谈 YubiKey。最终用户体验看起来与您通常登录 Windows 的方式非常相似。虽然您通常使用 Windows Hello 或密码登录，但现在您可以选择\
  \ USB 密钥，如图所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_489_0.png)\n\n图 13.32\
  \ – Windows 登录选项\n\n之后，Windows 会要求您将安全密钥插入 USB 端口，该密钥保存用于登录 Windows 10 设备的密码短语，无需密码。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_489_1.png)\n\n图 13.33 – FIDO2 身份验证\n\n\
  首先，您需要在 AAD 租户中启用无密码身份验证。\n\n### 启用无密码身份验证\n\n要启用无密码身份验证，您必须进入 Azure 门户并打开 AAD。然后，按照以下步骤操作：\n\
  \n- 1. 转到 安全。\n- 2. 打开 身份验证方法。\n\n3. 在 **管理** 菜单下，选择 **身份验证方法。**\n\n图 13.34 – 身份验证方法\n\
  \n4. 点击 **FIDO2 安全密钥。**\n\n身份验证方法 | 策略\n云桌面 - Azure AD 安全\n\n搜索 (Ctrl+/)\n\n有反馈？\n\
  \n点击此处为用户启用组合安全信息注册体验。\n\n在身份验证方法策略中配置您的用户以启用无密码身份验证，您需要为用户启用增强注册预览，以便他们可以注册这些并让他们登录。\n\
  \n| 方法 | 目标 | 已启用 |\n|---|---|---|\n| FIDO2 安全密钥 |  | 否 |\n| Microsoft Authenticator\
  \ |  | 否 |\n| 短信 (预览) |  | 否 |\n| 临时访问通行证 (预览) |  | 否 |\n\n图 13.35 – 身份验证方法 – 策略\n\
  \n\n\n\n\n5. 启用（至少）登录和强身份验证的设置。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_491_0.png)\n\
  \n你还可以使用密钥限制策略，通过输入带有验证器证明 GUID (AAGUID) 的设备的允许或阻止列表，来指定最终用户可以在你的租户中使用哪些 FIDO2 密钥。\n\
  \nFIDO2 规范要求每个安全密钥提供程序在证明期间提供 AAGUID。AAGUID 是一个 128 位标识符，用于指示密钥类型，例如制造商和型号。\n\n\
  你现在已完成先决条件，可以开始使用 FIDO2 密钥。通过 Microsoft Authenticator 移动应用使用无密码身份验证时，你会看到以下 AAD\
  \ 登录屏幕，全程无需输入密码。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_491_1.png)\n\n无密码登录更加安全，最终用户几乎无需在任何地方输入密码。\n\
  \n接下来，我们将展示一个表格，说明最终用户可以在哪些场景中使用无密码登录。\n\n## 每种无密码方案支持和不支持的内容\n\nMicrosoft 的无密码身份验证方法支持不同的场景。在选择无密码身份验证策略之前，需要考虑每种身份验证方法的组织需求、先决条件和功能。\n\
  \n> **注意**\n> 无密码身份验证无需额外费用。\n\n在下表中，你可以看到基于不同场景的选项：\n\n| 场景 | 手机身份验证 | 安全密钥 | Windows\
  \ Hello for Business |\n|---|---|---|---|\n| 计算机登录：从已分配的 Windows 10 设备 | 否 | 是，支持生物识别和/或\
  \ PIN | 是，支持生物识别和/或 PIN |\n| 计算机登录：从共享的 Windows 10 设备 | 否 | 是，支持生物识别和/或 PIN | 否\
  \ |\n| Web 应用登录：从用户专用计算机 | 是 | 是，前提是计算机登录已为应用启用 SSO | 是，前提是计算机登录已为应用启用 SSO |\n|\
  \ Web 登录：从移动设备或非 Windows 设备 | 是 | 否 | 否 |\n| 计算机登录：从非 Windows 计算机 | 否 | 否 | 否 |\n\
  \n本节关于无密码登录的内容到此结束。接下来，我们将介绍 BitLocker 磁盘加密。\n\n## BitLocker 磁盘加密\n\n自 Windows Vista\
  \ 首次发布以来，BitLocker 一直可用，它提供了加密连接到终结点的驱动器的选项。在大多数情况下，BitLocker 可以与带有受信任的平台模块 (TPM)\
  \ 芯片的终结点配合使用。\n\n只要你能够通过设备身份验证，并且不会将操作系统磁盘从终结点中取出并更换为另一台设备，你就不太可能需要使用与设备磁盘关联的 BitLocker\
  \ 密钥来解密所有内容。服务台操作员角色将能够访问所有密钥以进行还原：\n\n- 1. 要为 Windows 10 或 Windows 11 终结点启用 BitLocker，你必须转到终结点安全，然后选择磁盘加密。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_493_0.png)\n\n图 13.38 – 终结点安全 – 磁盘加密\n\
  \n> 注意\n> BitLocker 目前尚不支持 Windows 365。\n\n2. 单击“创建策略”。\n3. 选择 Windows 10 及更高版本作为平台，并为配置文件选择\
  \ BitLocker。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_494_0.png)\n\n图 13.39 –\
  \ BitLocker 配置文件\n\n4. 为策略输入名称。\n5. 更改 BitLocker 基本设置以满足你的需求。以下是对每个设置含义的简要说明：\n\n\
  - 为操作系统和固定数据驱动器启用全磁盘加密：如果未配置，将不会执行任何 BitLocker 强制措施。如果驱动器在应用此策略之前已加密，则不会采取额外操作。如果加密方法和选项与此策略匹配，配置应返回成功。\n\
  - BitLocker 固定驱动器策略：此策略设置用于控制固定驱动器的 BitLocker。此策略的值决定 BitLocker 用于加密的密码强度。\n- BitLocker\
  \ 系统驱动器策略：此策略设置用于控制系统驱动器的 BitLocker。此策略的值决定 BitLocker 用于加密的密码强度。\n- BitLocker 可移动驱动器策略：此策略设置用于控制可移动驱动器的\
  \ BitLocker。此策略的值决定 BitLocker 用于加密的密码强度。\n\n很可能你想要为操作系统和固定驱动器启用全磁盘加密，包括可能轮换恢复密码以提高安全性。\n\
  \n在 Windows 10 设备上配置静默加密时，请考虑以下最佳实践：\n\n- 使用*推荐*设置创建 BitLocker 策略。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_495_0.png)\n\
  \n图 13.40 – 配置设置\n\n- 在**固定驱动器设置**和**操作系统驱动器设置**部分，你可以调整基本设置以使其更严格。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_496_0.png)\n\
  \n图 13.41 – BitLocker 固定驱动器设置\n\n> **重要说明**\n> \n> 如果将这些设置配置为“必需”，BitLocker 将无法静默加密设备，因为这些设置需要用户交互。\n\
  \n完成 BitLocker 特定配置后，你必须完成分配，很可能基于 AAD 用户或组进行分配。\n\n## BitLocker 恢复密钥\n\n当你的终结点出现问题并且需要恢复驱动器时，你很可能会需要恢复密钥。幸运的是，BitLocker\
  \ 密钥会自动保存到 MEM。\n\n你可以在 MEM 中的**设备 | *用户的设备* | 恢复密钥**下找到设备的 BitLocker 恢复密钥：\n\n\
  ![](img/a3e9f26159d3739e434fe676b2987c1d_497_0.png)\n\n图 13.42 – BitLocker 恢复密钥\n\
  \n在 Windows 10 的密钥字段中输入恢复密钥，一切就绪了！\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_498_0.png)\n\
  \n图 13.43 – BitLocker 恢复\n\n在不知道设备名称的情况下，你可以在 AAD 管理中心中搜索设备的 BitLocker 恢复密钥，路径为**设备\
  \ | BitLocker 密钥**。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_498_1.png)\n\n图\
  \ 13.44 – 搜索 BitLocker 密钥\n\n本节关于 Microsoft Intune 中 BitLocker 管理的内容到此结束。接下来，我们将介绍\
  \ Microsoft Defender for Endpoint。\n\n## Microsoft Defender for Endpoint\n\nMicrosoft\
  \ Defender for Endpoint 是 Microsoft 的企业终结点安全平台，旨在帮助企业防范、调查、检测和响应威胁。这有助于提高整个终结点配置的安全级别。\n\
  \nMicrosoft Defender for Endpoint 是一个安全解决方案，包括基于风险的漏洞管理和评估、减少攻击面、基于行为和云端的新一代保护、**终结点检测和响应\
  \ (EDR)**、自动调查和修正、托管搜寻服务、丰富的 API 以及统一安全管理。\n\n### 与 MEM 集成\n\n对于使用 Windows 365/Azure\
  \ 虚拟桌面的客户来说，MEM 变得越来越重要，因为它提供了一种统一的方式来配置和维护你的物理和虚拟云终结点以及其他设备（例如移动设备）。\n\nMicrosoft\
  \ Defender for Endpoint 可无缝集成到 MEM。你只需要在初始设置期间激活一次 Intune 集成，你的报告就会流入 MEM。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_499_0.png)\n\
  \n图 13.45 – Microsoft Defender for Endpoint\n\n本节关于 Microsoft Defender for Endpoint\
  \ 的概述到此结束。接下来，我们将向你概述安全基线。\n\n## 安全基线\n\n安全基线是预先配置的 Windows 设置组，可帮助你应用由相关安全团队推荐的安全设置。你可以自定义部署的基线，以仅强制执行你需要的设置和值。\n\
  \nWindows 以及 Microsoft Edge 中有多个与安全相关的设置可用于你的终结点。另一个重要优势是，可以基于不同的操作系统或需要更严格控制的场景进行版本控制和筛选。你不再需要使用\
  \ GPO 来确保终结点的安全设置——只需创建一个安全基线配置文件，一切就绪。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_500_0.png)\n\
  \n图 13.46 – MDM 安全基线\n\n本节安全基线概述到此结束。接下来，我们将介绍合规策略。\n\n\n\n\n\n## 合规策略\n\n我们可以定义用户和设备必须满足的规则和设置才能合规。这可以包括适用于不合规设备的操作。针对不合规的操作可以向用户发出不合规条件警报，并保护不合规设备上的数据。\n\
  \n请参阅以下示例，了解当你的终结点不符合合规预期时，如何在 Microsoft Defender 中设置风险级别。你的设备将在 Microsoft Defender\
  \ for Endpoint 和 Intune 中显示为风险设备，并标记为不合规。\n\n主页 > 设备 > 合规策略 >\n\n### Windows 10\
  \ 合规策略\n\nWindows 10 及更高版本\n\n有效的操作系统内部版本\n\nConfiguration Manager 合规性\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_501_0.png)\n\
  \n图 13.47 – Microsoft Defender for Endpoint 合规设置\n\n### 注意\n\n有关合规策略的更多信息，请参阅第 10\
  \ 章“高级策略管理”。\n\n## Windows 365 安全基线\n\nWindows 365 提供其自有品牌的安全基线，其中包含针对云电脑虚拟化场景优化的各种最佳实践。\n\
  \n我们强烈建议客户使用这些基线，因为它们来自实际实施经验。你可以使用这些策略来降低风险，同时提高云电脑的安全边界。\n\n你可以使用安全基线获取有助于降低风险的安全建议。Windows\
  \ 365 基线支持 Windows 10、Edge 和 Microsoft Defender for Endpoint 的安全配置。这些基线包含版本管理功能，可帮助客户选择何时将用户策略更新到最新版本。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_502_0.png)\n\n图 13.48 – 安全基线\n\n### Defender\
  \ for Endpoint 的要求\n\n在本节的下一部分，我将解释如何通过 MEM 配置 Microsoft Defender for Endpoint，以保护你的虚拟或物理\
  \ Windows 终结点：\n\n- 1. 通过 https://endpoint.microsoft.com/#home 转到 MEM 管理中心。\n- 2.\
  \ 转到终结点安全性。\n\n图 13.49 – 终结点安全性\n\n3. 单击“打开 Microsoft Defender 安全中心”。\n\n图 13.50\
  \ – Microsoft Defender for Endpoint\n\n4. 单击**下一步**。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_504_0.png)\n\
  \n图 13.51 – Microsoft Defender 安全中心 – 第 2 步\n\n5. 填写你的区域、数据保留策略时间和组织规模。\n\n> **注意**\n\
  > 你还可以选择**预览功能**选项，率先体验即将推出的功能。\n\n单击**下一步**。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_505_0.png)\n\
  \n图 13.52 – Microsoft Defender 安全中心 – 第 3 步\n\n- 6. 确保所有设置正确无误，因为无法返回。单击**继续**。\n\
  \n### 创建云实例\n\n单击“继续”后，你将无法更改某些偏好设置（例如数据存储位置）。如果要检查或进行任何更改，请单击“返回偏好设置”并查看你的偏好设置。如果希望设置你的帐户，请单击“继续”。\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_505_1.png)\n\n图 13.53 – 创建云实例\n\n7. 正在创建你的\
  \ Microsoft Defender for Endpoint 帐户，请稍候。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_506_0.png)\n\
  \n图 13.54 – Microsoft Defender 安全中心 – 第 3 步\n\n现在，你已准备好创建 Microsoft Defender for\
  \ Endpoint 与 Microsoft Intune 的集成。\n\n### 连接到 Intune – MEM 集成\n\n按照以下步骤继续集成：\n\n\
  - 1. 打开安全中心门户：https://securitycenter.windows.com/。\n- 2. 转到“设置”。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_506_1.png)\n\
  \n图 13.55 – 设置\n\n3. 将“Microsoft Intune 连接”旁边的滑块打开。\n\n### 设置\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_507_0.png)\n\

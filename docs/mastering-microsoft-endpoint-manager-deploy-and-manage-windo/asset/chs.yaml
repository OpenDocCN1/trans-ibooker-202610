  \ Manager (SCCM)** 中设置一个入口来控制共同管理设备的 Windows MDM 自动注册，因为设备需要位于某个集合中才能进入 Microsoft\
  \ Intune。\n\n在 Microsoft Intune 内部，你还有注册限制，以确保你能区分注册到 Microsoft Intune 的个人设备和企业拥有的设备。这也可以针对不同的\
  \ Azure AD 用户组设置不同的范围。\n\n## BitLocker 故障\n\n你可以按照以下步骤排查 BitLocker 故障：\n\n1. 在“主页\
  \ | 设备 | 监视 | 加密报告”中，你可以看到“加密就绪状态”列，以确定设备是否已准备好进行 BitLocker 加密，如下面的截图所示：\n\n图 16.20\
  \ – 加密报告\n\n2. 你还可以深入查看特定设备，以查看该设备应用了哪个策略，如下面的截图所示：\n\n图 16.21 – 设备加密状态\n\n至此，我们介绍完了\
  \ Microsoft Intune 中的部分监视功能。\n\nIT 管理员会让你先单击“是”，然后 Intune 才会访问设备并收集日志，如下面的截图所示：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_602_0.png)\n\n图 16.23 – 收集 Windows 设备的诊断信息\n\
  \n你可以在设备上跟踪状态（请记住刷新此页面以获取更新后的状态），如下面的截图所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_602_1.png)\n\
  \n图 16.24 – 诊断信息收集完成\n\n诊断日志收集有三种状态消息，如下所述：\n\n- **完成**：已成功从设备收集诊断信息，可在 **设备诊断**\
  \ 边栏选项卡中下载。\n- **诊断信息上传挂起**：设备正在进行诊断日志收集，不久将完成；或者设备处于脱机/不可达状态，尚未收到请求。诊断收集操作的有效期为\
  \ 12 小时，超过该时间后，IT 管理员需要再次单击该操作；因此，如果计算机重新联机和/或签入 Intune 服务，设备上将会启动诊断日志收集。\n- **失败**：设备已运行诊断，但未能完成任务或未能将日志上传到后端服务。要排查此问题，请查看\
  \ `HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\MdmDiagnostics` 处的 **MDMDiagnostics**\
  \ 注册表项及其内部的子项。\n\n在 MEM 中该设备的 **监视** 区域，你可以找到 **设备诊断（预览）** 边栏选项卡的入口，如下面的截图所示：\n\n\
  ![](img/a3e9f26159d3739e434fe676b2987c1d_603_0.png)\n\n图 16.25 – 设备诊断\n\n在下一节中，我们将介绍应用程序交付的故障排除。\n\
  \n## 应用程序交付故障排除\n\nMicrosoft Intune 中有不同类型的应用，它们需要不同的故障排除方法，如下所列：\n\n- Win32 应用\n\
  - 业务线 (LOB) 应用\n- Microsoft Store 应用\n\n### Win32\n\n在 MEM 管理中心的特定设备上，“托管应用”边栏选项卡为\
  \ IT 管理员提供应用的安装状态信息，并包含安装失败信息。\n\nIntune 中的“故障排除”窗格提供失败详细信息，包括用户设备上托管应用的详细信息。在“托管应用”窗格中，每个设备下都会提供应用的端到端\
  \ (E2E) 生命周期详细信息。你可以查看安装问题，例如应用何时创建、修改、定向并交付到设备，如下面的截图所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_605_0.png)\n\
  \n图 16.28 – 托管应用安装状态\n\n## Autopilot 故障排除\n\n作为 MEM 管理中心的 **监视** 边栏选项卡的一部分，有一个报告显示租户中\
  \ Autopilot 部署的状态。此报告可用作监视经历 Windows Autopilot 的新设备的示例，并为 IT 管理员提供设备的成功/失败概览以及总部署时间。\n\
  \n在对 Windows Autopilot 进行故障排除时，熟悉以下工作流非常重要：\n\n1. 建立无线 (Wi-Fi) 或有线（以太网）连接。\n2. 下载\
  \ Windows Autopilot 配置文件。当你使用有线连接或手动建立无线连接时，只要网络连接就绪，配置文件就会从 Autopilot 部署服务下载。如果你使用以太网连接，可能会遇到跳过区域和语言设置的情况。这可以在\
  \ Autopilot 配置文件中进行配置。\n3. 下一步是用户身份验证。执行 **用户驱动部署 (UDD)** 时，用户将输入其 Azure AD 凭据和密码。如果用户已分配到\
  \ Windows Autopilot 对象，用户名将自动完成，只需验证密码。\n4. 下一步是 Azure AD 加入。对于 UDD，设备将使用指定的用户凭据加入\
  \ Azure AD。对于自部署场景，设备将在不指定任何用户凭据的情况下加入。\n5. 接下来是自动 MDM 注册。作为 Azure AD 加入过程的一部分，当在\
  \ Azure AD 中配置后，设备将注册到 Microsoft Intune。\n6. 应用设置、应用程序和证书。如果配置了 **注册状态页 (ESP)**，则在显示\
  \ ESP 期间将应用大多数设置。如果未配置或不可用，则在用户登录后应用设置。\n\n导航到 **主页 | 设备 | 监视 | Autopilot 部署**。Autopilot\
  \ 报告将包含最近 30 天的数据。使用 Autopilot 重置的设备不会显示在此报告中。你可以在此处看到报告概览：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_608_0.png)\n\
  \n图 16.31 – Autopilot 报告\n\n如果在设备加入 Azure AD 时看到正常的 OOBE 屏幕，则说明设备没有经历 Autopilot\
  \ 工作流。最有可能的原因是设备未分配 Autopilot 配置文件。你可以通过导航到“主页 | 设备 | Windows | Windows Autopilot\
  \ 设备”找到 Windows Autopilot 设备并查看其他详细信息，这将带你进入以下屏幕：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_609_0.png)\n\
  \n图 16.32 – 未分配 Autopilot 配置文件\n\n在这种情况下，未分配配置文件——最可能的原因是 Autopilot 设备对象不属于分配了 Autopilot\
  \ 配置文件的正确组。你还可以看到该设备位于 Azure AD 中，但不在 Intune 中。单击 Autopilot 设备对象时，上面会显示很多有用的信息。\n\
  \n你不能从 Microsoft Intune 直接将 Autopilot 配置文件分配到设备；只能为 Azure AD 组执行此操作。从 Microsoft\
  \ Store for Business 中，你可以直接将配置文件分配到设备。这可能会破坏预期的 Windows Autopilot 部署体验，并使你自己的故障排除更加困难。\n\
  \n### Windows 11 Autopilot 诊断页面\n\n当你使用 Autopilot 部署 Windows 11 时，你可以让用户查看有关 Autopilot\
  \ 预配过程的更多详细故障排除信息。新的 Windows Autopilot 诊断页面为 IT 管理员和最终用户提供了用户友好的视图，以便对 Windows Autopilot\
  \ 失败进行故障排除。\n\n如果你将“为最终用户打开日志收集和诊断页面”设置为“是”，则会在 Autopilot 设备上启用 Windows Autopilot\
  \ 诊断，如下面的截图所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_610_0.png)\n\n\n\n\n\n\
  如果在 Windows Autopilot 过程中出现任何错误，最终用户可以通过点击 **view diagnostics** 查看更多详细信息，如以下屏幕截图所示：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_611_0.png)\n\n图 16.34 – Windows Autopilot\
  \ 失败\n\n这将启动适用于 Windows 11 的新的 **Windows Autopilot diagnostics** 页面，目前该页面仅适用于用户驱动的\
  \ Windows Autopilot 部署模式。\n\n最终用户随后会看到清晰的图标显示如下等状态：\n\n- **Task failed**\n- **Task\
  \ in progress**\n- **Task unknown or incomplete**\n- **Task successfully completed**\n\
  \n在 **Enrollment Status** 下，您可以看到已完成的各项检查，例如 **Trusted Platform Module (TPM)** 证明和\
  \ MDM 注册，如以下屏幕截图所示：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_612_0.png)\n\n图\
  \ 16.35 – Windows Autopilot 注册状态\n\n借助 **Windows Autopilot diagnostics** 概览，您可以展开\
  \ **General** 和 **Hardware** 以获取有关设备的更多信息。您还可以深入 **Apps and policies status** 以获取有关此区域不同错误的更多信息，如以下屏幕截图所示：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_613_0.png)\n\n图 16.36 – Windows Autopilot\
  \ diagnostics 配置信息\n\n您可以在以下屏幕截图中看到应用失败的不同任务消息示例：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_613_1.png)\n\
  \n图 16.37 – Windows Autopilot 应用失败消息\n\n您可以在此 **Windows Autopilot diagnostics**\
  \ 屏幕中看到，LOB MSI 的安装不完整，并且 Win32 应用出现错误。一旦获得应用的 **identifier (ID)**，您就可以返回 Microsoft\
  \ Intune 并从应用侧继续进行故障排除。\n\n在下一节中，我们将介绍如何确保您的设备已启用位置服务，以便在设备丢失时找到您的 Windows 设备。\n\
  \n## Troubleshooting locating a Windows device\n\n要在地图上获取丢失或被盗的 Windows 设备的当前位置，请在\
  \ Microsoft Intune 中使用 **Locate device** 操作。\n\n支持的 Windows 版本如下：\n\n- Windows 10\
  \ version 20H2 (10.0.19042.789) 或更高版本\n- Windows 10 version 2004 (10.0.19041.789)\
  \ 或更高版本\n- Windows 10 version 1909 (10.0.18363.1350) 或更高版本\n- Windows 10 version\
  \ 1809 (10.0.17763.1728) 或更高版本\n\nWindows **Location** 服务默认处于关闭状态，如以下屏幕截图所示：\n\n\
  ![](img/a3e9f26159d3739e434fe676b2987c1d_614_0.png)\n\n图 16.38 – 位置服务已关闭\n\n如果用户希望使用此功能，则需要将其打开，或创建一项策略来打开位置服务。为此，请执行以下步骤：\n\
  \n- 1. 在设置目录中创建策略以在 Windows 设备上启用位置服务，如以下屏幕截图所示：\n\nHome > Devices > Windows >\n\
  Create device configuration profile\nWindows 10 and later - Settings catalog (preview)\n\

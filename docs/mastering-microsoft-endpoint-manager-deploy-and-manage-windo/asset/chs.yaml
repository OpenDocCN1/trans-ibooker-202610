  ## High-level architecture components and responsibilities


  Windows 365 的架构相对简单易懂，与 Azure Virtual Desktop (AVD) 有所不同，因为某些对象现在位于 Microsoft 管理的环境中。


  所有蓝色部分现在由 Microsoft 管理，而灰色元素由客户/合作伙伴负责。这与您需要自行负责大部分事物的解决方案不同，这意味着管理开销更大，很可能也更复杂。


  Microsoft 作为 Windows 365 的一部分管理以下服务：


  - Virtualization control plane（信息工作者（web access）门户、网关、连接代理、诊断和 REST API）

  - Cloud PCs 和 Azure 计算服务（VMs、配置、Azure 订阅、Cloud PC VM 配置、自动扩展等）


  客户和/或合作伙伴作为 Windows 365 的一部分管理以下组件：


  - Azure Virtual Network（子网、ExpressRoute、S2S VPN 等）

  - Microsoft Endpoint Manager（设备配置、设置目录、PowerShell 等）

  - Azure Active Directory 配置（混合 Azure AD、条件访问、合规策略等）

  - Active Directory Domain Services 配置（本地 AD、Azure AD Connect 等）

  - 物理端点客户端（Windows、macOS、Linux、Android、iOS 等）


  Microsoft Endpoint Manager 是所有其他服务的统一管理控制台，我们利用的其他服务包括 Azure AD、Defender for Endpoint、用于监控的
  Desktop Analytics，以及 Intune 用于同时管理您的物理和云端点。


  下图显示了 Windows 365 Enterprise 的高层架构，其中域配置为混合 Azure AD 加入。它概述了客户和合作伙伴作为服务的一部分所承担的不同职责，以及与其他
  Microsoft Endpoint Manager 组件的紧密集成情况：


  ![](img/a3e9f26159d3739e434fe676b2987c1d_83_0.png)


  图 3.6 – Microsoft Endpoint Manager 和 Windows 365 架构


  ## Microsoft Endpoint Configuration Manager support


  Configuration Manager 是用于管理位于您网络或基于互联网的桌面、服务器和笔记本电脑的本地管理解决方案。您可以使其云启用以集成 Intune、Azure
  AD、Microsoft Defender ATP 和其他云服务。使用 Configuration Manager 部署应用、软件更新和操作系统。您还可以监控合规性、实时查询和操作客户端，以及更多功能。


  ## Co-management and Windows 365


  作为 Endpoint Manager 的一部分，您可以继续像以往一样使用 Configuration Manager。如果您准备将某些任务转移到云端，请考虑共管。


  共管将您现有的本地 Configuration Manager 投资与云结合，使用 Intune 和其他 Microsoft 365 云服务。您可以选择 Configuration
  Manager 或 Intune 作为七个不同工作负载组的管控权限。


  ## Sizes and performance of fixed-price licenses


  Windows 365 的工作方式与其他虚拟化服务略有不同。您的 Cloud PC 的性能由用户分配的许可证定义，通过 Microsoft 365 管理中心门户进行分配，与您为用户分配例如
  Microsoft 365 E3/E5 许可证的方式相同。


  有多个许可证反映不同的 VM 大小。考虑更多的 vCPU、RAM 和操作系统，以及配置文件存储。图形增强型大小将在不久的将来添加。


  下表列出了今天可用的所有不同的 Cloud PC 许可证。GPU 增强型 Cloud PC 大小将很快添加，并且在您阅读本书时很可能已经可用：



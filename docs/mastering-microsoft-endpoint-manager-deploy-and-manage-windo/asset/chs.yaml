  \n## 用户设置 – 自助服务\n\n在 Windows 365 中使用自助服务选项的主要目标是减轻 IT 支持部门和 IT 管理员的工作负担。当用户拥有自助服务升级权限时（如以下截图所示），他们可以重启其云桌面，并升级到更大的\

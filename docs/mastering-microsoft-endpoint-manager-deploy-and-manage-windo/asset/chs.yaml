  \n图 8.57 – 创建策略配置\n\n我们将在第 10 章《高级策略管理》中更深入地介绍此内容。\n\n## 部署 Microsoft Teams\n\n\
  Microsoft Teams 将通过上述 Microsoft 365 应用设置以机器范围安装程序的形式安装。值得一提的是，Teams 是一款按用户计费的应用。Microsoft\
  \ 365 设置会将安装程序添加到您的 Windows 10 Enterprise 终端，并在新用户登录终端时自动安装。Teams 然后会安装在用户配置文件中。\n\
  \n在 Microsoft Intune 中的 Microsoft 365 应用设置中，您可以选择与其它应用一起安装 Teams：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_333_0.png)\n\
  \n图 8.58 – 应用套件信息\n\nTeams 应用每 2 周更新一次，经过内部更新计划（如 Technology Adoption Program (TAP)）测试后发布。\n\
  \n安装在用户配置文件中的机器范围桌面应用会自动更新，无需用户或 IT 管理员进行任何操作。\n\n您也可以通过右上角的三点菜单手动更新 Teams 应用。点击“检查更新”将触发更新过程，并在屏幕顶部显示“我们将在您继续工作时检查并安装任何更新”的通知：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_333_1.png)\n\n图 8.59 – MS Teams 检查更新菜单选项\n\
  \nMicrosoft Teams 遵循自己的更新流程，不遵循其他 Microsoft 365 应用的更新流程。\n\n## OneDrive\n\nOneDrive\
  \ 并非 Microsoft 365 应用交付流程的一部分，原因很简单：OneDrive 是 Windows 10 Enterprise 的必备组件，因此在注册后即包含在操作系统中。\n\
  \nOneDrive 根据 **Insiders**、**Standard** 或 **Deferred** 周期自动更新。OneDrive 在运行时每 24\
  \ 小时检查一次终端是否有可用更新。\n\n生产环（即默认）每 20 天接收一次更新，而延迟环则提供更多灵活性，每 2-3 个月更新一次。在此期间，客户可以自行部署更新，从而精确记录软件更新时间。当天数超过时，更新将自动应用：\n\
  \n> > **重要说明**\n> >\n> > Microsoft 保留在关键更新时绕过 60 天宽限期的权利。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_334_0.png)\n\
  \n*图 8.60 – OneDrive 更新计划*\n\n您可以通过指定的 OneDrive 策略将 OneDrive 客户端置于 **Deferred**\
  \ 环中，我们将在下一章中进行说明。\n\n当您想通过 Microsoft Endpoint Manager 强制终端更新时，可以向终端发送以下命令以使其成为可能。`restart`\
  \ 参数会重新启动您的 Windows 10 Enterprise 桌面：\n\n```\nExecute C:\\<location>\\OneDriveSetup.exe\
  \ /update /restart\n```\n\nOneDrive 客户端安装在每个用户的配置文件下的 %localappdata% 中。自 OneDrive\
  \ 同步客户端版本 19.174.0902.0013 起，您可以按机器安装 OneDrive。只需运行 OneDriveSetup.exe/allusers 即可将安装从按用户转换为按机器：\n\
  \n```\nThis can be done by creating a Powershell Script and run it from Microsoft\
  \ Intune to the device where you want the change.\n#>\n##########################################################################################\n\
  ###################################################################\n\n$url = \"\
  https://go.microsoft.com/fwlink/?linkid=2083517\"\n$output = \"$ENV:temp\" + '\\\
  OneDriveSetup.exe'\n$O4BPath = \"$ENV:localappdata\" + 'Microsoft/OneDrive/OneDriveSetup.exe'\n\
  #write $O4BPath\n#write $output\nIF(Test-Path $output)\n{\n}\nELSE {\nInvoke-WebRequest\
  \ -Uri $url -OutFile $output\n}\nIF(!(Test-Path $O4BPath))\n{\n    & \"$output\"\
  \ + '/allusers'\n}\nELSE {\n}\n```\n\n此脚本将下载最新版本的 OneDrive 同步客户端，并将安装转换为按机器安装，安装位置为\
  \ Program Files (x86)\\Microsoft OneDrive。\n\n## 部署 Microsoft Edge\n\n自更新 79 以来，Microsoft\
  \ Edge 已相当容易分发到您的终端——它完全集成在 Microsoft Endpoint Manager 中，并且我们将在下一章中介绍的大多数策略也适用。\n\
  \n在 Intune 应用菜单中，您必须添加适用于 Windows 的 Microsoft Edge，以在受管理的 Windows 10 设备上安装 Microsoft\
  \ Edge 浏览器——作为应用类型开始配置：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_336_0.png)\n\
  \n图 8.61 – 适用于 Windows 10 的 Microsoft Edge\n\n当您希望比 Stable 环中的其他用户更早测试新功能时，可以简单地将\
  \ Channel 设置更改为最适合您使用场景的设置。\n\n您也可以分别从 Windows 10 Enterprise 终端部署所有不同的频道版本：\n\n\
  ![](img/a3e9f26159d3739e434fe676b2987c1d_336_1.png)\n\n图 8.62 – 适用于 Windows 10 的\
  \ Microsoft Edge Stable\n\n语言设置也适用。选择操作系统默认设置以从 Windows 操作系统内部驱动语言设置，或覆盖它们以分离浏览器语言：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_337_0.png)\n\n图 8.63 – 适用于 Windows 10\
  \ 的 Microsoft Edge 语言菜单\n\nMicrosoft Edge 是 Windows 每个新版本的一部分，因此此应用类型在未来某个时候将变得多余。\n\
  \n## 什么是 MSIX？\n\nMSIX 是一种 Windows 应用包格式，为所有 Win32、UWP 和 Windows 应用提供现代化的打包体验。它是与\
  \ App-V 等技术相比进行应用虚拟化的新方法。\n\n将应用与映像分离，以便在不进行映像更新的情况下更新和分配应用，这听起来像是一个解决方案，对吧？好吧，这正是\
  \ MSIX 可以实现的功能。让我解释一下您如何在此处打包一个应用：\n\n- 1. 通过清单文件声明式安装。\n- 2. 应用签名需要在设备上受信任。\n-\
  \ 3. 通过 BlockMap 和签名进行防篡改保护。\n\n\n\n\n\n4. 操作系统管理安装、更新和移除：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_338_0.png)\n\
  \n图 8.64 – MSIX 包\n\n## AppxManifest.xml\n\n包清单是一个 XML 文档，其中包含系统部署、显示和更新 MSIX 应用所需的信息。此信息包括包标识、包依赖项、所需功能、视觉元素和可扩展性点。\n\
  \n## AppxBlockMap.xml\n\n包块映射文件是一个 XML 文档，其中包含应用文件的列表，以及存储在包中的每个数据块的索引和加密哈希值。块映射文件本身在包签名时通过数字签名进行验证和保护。块映射文件允许\
  \ MSIX 包进行增量下载和验证，并且还支持在安装后对应用文件进行差异更新。\n\n## AppxSignature.p7x\n\nAppxSignature.p7x\
  \ 在包签名时生成。所有 MSIX 包在安装前都必须签名。有了 AppxBlockmap.xml，平台可以安装该包并且可以对其进行验证。\n\n## 如何创建\
  \ MSIX 包\n\n创建 MSIX 包的过程看起来与您过去使用 App-V 时所做的大致相似。应用开发人员创建应用程序并创建 MSIX 包（这可能是 **独立软件供应商\
  \ (ISV)**），之后您通过 Intune – Microsoft Endpoint Manager 自定义应用程序以进行部署并将其分配给正确的 AAD 组或用户。\n\
  \n让我们解释以下步骤，以便您对流程有良好的感觉：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_339_0.png)\n\
  \n图 8.65 – MSIX 工具\n\n首先，在 Microsoft Store 中搜索 MSIX Packaging Tool 并将其安装在您的 Windows\
  \ 10 虚拟机上：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_339_1.png)\n\n图 8.66 – MSIX\
  \ Packaging Tool\n\n启动打包工具：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_340_0.png)\n\
  \n图 8.67 – 启动 MSIX Packaging Tool\n\n点击 Create your app package：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_340_1.png)\n\
  \n图 8.68 – 应用程序包\n\n点击 Create package on this computer：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_340_2.png)\n\
  \n图 8.69 – 在此计算机上创建包\n\n确保您在映像/会话主机上的状态与不同操作项的屏幕截图中显示的一致。\n\n然后，点击 Next：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_341_0.png)\n\
  \n图 8.70 – 创建新包\n\n浏览应用程序安装程序。这可以是您任何 Win32 应用程序。我将使用 Notepad++ 进行练习。\n\n输入应用特定的要求。发布者名称是组织的证书\
  \ CN（例如，Contoso）。确保证书已注入到您的映像中，否则应用程序无法注册并将失败。\n\n> **重要提示**\n> 如果 CN 检测正确，您将看到\
  \ **Subject of the certificate provided** 通知。证书可以是自签名、公开的或通过根 CA 内部创建的。私钥和 CN 必须在后续流程中匹配。\n\
  \n点击 **Next**：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_343_0.png)\n\n图 8.73\
  \ – 发布者名称\n\n现在，运行您的应用程序的安装过程：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_344_0.png)\n\
  \n图 8.74 – 安装程序语言\n\n确保禁用自动更新，因为 MSIX 将为只读。\n\n启动应用程序以确保一切已正确安装。\n\n如果应用程序安装正确，您将看到以下屏幕。如果需要，请在继续下一步之前重新启动机器：\n\
  \n![](img/a3e9f26159d3739e434fe676b2987c1d_344_1.png)\n\n图 8.75 – 安装\n\n我们几乎准备好了。点击\
  \ **Next**。\n\n> **重要提示**\n> \n> 当您想在同一个 MSIX 包中打包额外的插件或其他附加应用程序时，请点击 **No, I'm\
  \ not done**。\n\n我已完成，所以我点击 **Yes, move on**：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_345_0.png)\n\
  \n图 8.76 – 是的，继续\n\n然后，点击 Next：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_346_0.png)\n\
  \n图 8.77 – 依赖于\n\n将 .msix 包文件保存在计算机或网络上的某个位置。然后，点击 Create：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_346_1.png)\n\
  \n图 8.78 – 创建包\n\n包已准备好进行下一步。当您想在包中编辑内容时，请点击 Package editor：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_347_0.png)\n\
  \n图 8.79 – 包创建成功\n\n## 将 MSIX 包应用程序推送到您的终端\n\n如开头所述，要部署 MSIX 应用程序，您必须使用 Line-of-business\
  \ app 作为应用类型设置：\n\n> 重要提示\n> MSIX 的部署通过 Intune SideCar 代理进行。\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_347_1.png)\n\
  \n## Line-of-business app\n\n要添加自定义或内部应用，请上传应用的安装文件。确保文件扩展名与应用的预期平台匹配。Intune 支持以下内部应用平台和扩展：\n\
  \n- Android (APK)\n- iOS (IPA)\n- macOS (.IntuneMac)\n- Windows (.msi, .appx, .appxbundle,\
  \ .msix, 和 .msixbundle)\n\n了解更多\n\n图 8.80 – 内部 MSIX\n\n它会提示您上传将上传到 Microsoft Endpoint\
  \ Manager 并分发到您的 Windows 10 Enterprise 终端的 .msix 包文件：\n\n## App package file\n\n\
  App package file *\n\"Notepadplusplus_1.0.0.0_x64__h91ms92gds mmt.msix\"\nName:\
  \ Notepad++\nPlatform: Windows\nSize: 3.84 MiB\nMAM Enabled: No\n\n图 8.81 – MSIX\
  \ 应用包\n\n应用程序设置与其它应用程序格式基本相同——非常简单：\n\n## Add App\n\nWindows Universal line-of-business\
  \ app\n\n1 App information   2 Assignments   3 Review + create\n\nSelect file *\n\
  Notepadplusplus_1.0.0.0_x64__h91ms92gds mmt.msix\nName *\nNotepad++\nDescription\
  \ *\nNone\nEdit Description\nPublisher *\nContoso\nCategory\n0 selected\nShow this\
  \ as a featured app in the Company Portal\nYes No\n\n图 8.82 – 应用信息 MSIX\n\n完成后，您应将\
  \ MSIX 应用程序分配给正确的 AAD 组，并且应用程序将在 Windows 10 Enterprise 中注入，而无需安装它：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_349_0.png)\n\
  \n图 8.83 – 应用分配 MSIX\n\n这结束了关于使用 MSIX 进行应用程序虚拟化以及通过 Microsoft Endpoint Manager 将其交付到您的终端的部分。无需切换到\
  \ Azure 门户——所有内容都从统一的管理体验中整合。\n\n## Summary\n\n在本章中，您了解了配置和分发面向物理和云终端的应用程序的所有不同选项。由于这是现代桌面非常重要的因素，您离成为现代工作场所的摇滚明星又近了一步。\n\
  \n在下一章中，我们将深入探讨现代桌面的另一个重要元素，即策略管理！\n\n## Questions\n\n- 1. Windows 应用程序（Win32）的首选和最全面的应用程序部署类型是什么？\n\
  \  A. Line-of-business app\n  B. Windows app (Win32)\n  C. Web link\n  D. Microsoft\
  \ Store app\n\n2. 生产使用工作负载的 Edge 发布通道叫什么？\n\nA. Canary\nB. Stable\nC. Dev\nD. Beta\n\
  \n## Answers\n\n- 3. (B)\n- 4. (B)\n\n## Further reading\n\n如果您想了解更多关于 Microsoft\
  \ Endpoint Manager – Intune 应用程序部署选项的信息，请使用以下免费在线资源之一：\n\n- Windows 10 app deployment\
  \ by using Microsoft Intune | Microsoft Docs: `https://docs.microsoft.com/en-us/mem/intune/apps/apps-windows-10-app-deploy`\n\
  - Assign apps to groups with Microsoft Intune | Microsoft Docs: `https://docs.microsoft.com/en-us/mem/intune/apps/apps-deploy`\n\
  \n\n\n\n"
- "## 9 了解策略管理\n\n在本章中，你将了解来自 Microsoft Intune 的策略管理与 **组策略对象 (GPO)** 有何不同，以及在你的环境中用于自定义和保护\
  \ Windows 10/11 企业版桌面的不同策略选项。本章内容会非常广泛，但它将为你提供理解 Windows 与 Microsoft Intune 之间策略管理如何工作所需的基础信息。\n\
  \n我们在本书中将策略管理分为三章；在这一章之后，*第 10 章，高级策略管理* 将介绍不同场景下的高级策略管理，而 *第 11 章，Office 策略管理*\
  \ 则介绍来自 Office 云策略服务的 Office 策略管理。\n\n在本章中，我们将涵盖以下主题：\n\n- 策略管理\n- 什么是内容安全策略 (CSP)\
  \ 策略？\n- Windows 推送通知服务 (WNS)\n- 策略设计的入门\n- Microsoft Endpoint Manager 内的策略管理\n\
  - 从 Azure 目录 (AD) 迁移现有策略 – 组策略管理（预览）\n\n## 策略管理\n\n使用 Microsoft Endpoint Manager\
  \ – Intune 管理你的 Windows 10/11 企业版桌面，全部都是关于标准化并简化环境的管理层。如上一章所述，一切都围绕着将配置集（和应用程序）分层，针对来宾操作系统进行分离，从而无需从一开始就创建包含这些内容的自定义映像。\n\
  \nMicrosoft Endpoint Manager – Intune 内的策略管理使得可以从“设备”菜单中配置以下选项：\n\n- 合规策略\n- 条件访问\n\
  - 配置配置文件\n- 设置目录\n- 脚本\n- 组策略分析（预览）\n- 注册限制\n- 策略集\n\n组策略管理已有 20 多年的历史，一直是配置域中一组用户或计算机行为的方式。今天在本地域中仍然可以实现这一点，但如果你想开始现代化你的策略和设置管理，你应该开始关注\
  \ Microsoft Intune 以及其为策略管理提供的功能集。使用 GPO 有一些缺点，其中之一是它需要与域控制器保持可见性。另一个是 GPO 是即发即忘，但这是什么意思呢？GPO\
  \ 分配给特定的一组用户和设备，并在设备定期连接到域控制器时应用。如果设备正确接收并应用了策略、无法联系到域控制器，或没有应用新的或更改的策略，域控制器不会收到任何报告。\n\
  \n有时，由于配置错误，Windows 设备可能会联系到内部网络上非常遥远且连接非常慢的域控制器，这会导致启动和登录时间非常长。许多这些问题都可以通过纯云加入并管理的设备来避免。\n\
  \n随着 COVID-19 在 2020 年初席卷全球，许多公司被迫让员工在家工作，而许多公司对此并不准备就绪。这也推动了从云端对设备进行 MDM 管理的新方法。Microsoft\
  \ Intune 是这种新型工作方式的完美匹配，因为它在初始加入 Microsoft Intune 后仅需要互联网连接。\n\n在本章中，我们将重点关注纯云管理的\
  \ Azure Active Directory Windows 10 设备，但同样也适用于从 Microsoft Intune 管理的混合域加入设备，甚至在共管状态下。需要在此注意的一点是，GPO\
  \ 和 MDM 设置管理位于身份层，即用户或设备，而 Microsoft Intune 与 **System Center Configuration Manager\
  \ (SCCM)** 之间的共管则位于管理平面上。\n\n首先，我们需要回顾传统的 Windows 管理，即所有 Windows 设备都在办公室的本地、生产环境中，或最终用户通过\
  \ VPN 在家工作。如果这些设备混合加入 Azure Active Directory，现代策略管理仍然是一个选项。对于新设备而言，最佳的前进方向是纯 Azure\
  \ Active Directory 加入并通过 Windows Autopilot 上线。我们在本章中介绍的内容涵盖这两种场景。本书致力于云管理，并且某些场景不适用于混合加入的设备，因此你需要做出一些决定，将设备迁移到\
  \ Azure AD 加入，以获得最佳的最终用户体验。从小开始，从 **概念验证 (POC)** 开始，并展示现代策略管理的优势。最佳实践方法是，在你的 POC\
  \ 中阻止本地设备从本地 Active Directory 获取 GPO；否则，你可能会陷入无法 100% 确定设置是从何处应用的情况。\n\n**配置服务提供程序\
  \ (CSP)** 是用于在设备上读取、设置、修改或删除配置设置的接口。这些设置映射到注册表项或文件。某些 CSP 支持 WAP 格式，某些支持 SyncML，而某些两者都支持。SyncML\
  \ 仅用于通过空中传输的 **开放移动联盟设备管理 (OMA DM)**。另一方面，WAP 可用于通过空中传输的 OMA 客户端配置，或作为 `.provxml`\
  \ 文件包含在手机映像中，该文件在启动期间安装。\n\n### 什么是 CSP 策略？\n\n某些策略只能在设备级别配置，而其他策略可以在用户级别配置。这意味着设备级策略将独立于登录设备的用户而产生效果，而用户级策略将取决于登录设备的用户。\n\
  \n用户范围是指策略仅适用于登录设备的用户，并且策略可以根据登录设备的用户而变化。以下是配置用户策略时 CSP 树的示例：\n\n- `./User/Vendor/MSFT/Policy/Config/AreaName/PolicyName`\
  \ 用于配置策略\n- `./User/Vendor/MSFT/Policy/Result/AreaName/PolicyName` 用于获取结果\n\n设备范围是指策略仅适用于设备本身，而与登录设备的用户无关。以下是配置设备策略时\
  \ CSP 树的示例：\n\n- `./Device/Vendor/MSFT/Policy/Config/AreaName/PolicyName` 用于配置策略\n\
  - `./Device/Vendor/MSFT/Policy/Result/AreaName/PolicyName` 用于获取结果\n\nGPO 与 CSP 策略之间最大的区别在于，CSP\
  \ 策略还具有结果通道，因此设备上配置的每个设置都会向 MDM 系统报告 – 在本例中为 Microsoft Intune。\n\n如果我们更仔细地查看策略结构，它看起来像\
  \ Windows 注册表以树结构排列：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_355_0.png)\n\n\
  通过使用 ADMXInstall，你可以为在操作系统版本之间添加的那些 Win32 或 Desktop Bridge 应用添加 ADMX 支持的策略。ADMX\
  \ 支持的策略通过使用 CSP 策略 URI 在你的设备中摄取：`./Vendor/MSFT/Policy/ConfigOperations/ADMXInstall`。\n\
  \nOMA-URI 字符串需要进入 CSP 策略 URI：\n\n- `./Vendor/MSFT/Policy/ConfigOperations/ADMXInstall/Applicationname/Policy/ADMXFileName`。\n\
  - `./Vendor/MSFT/Policy/Config/` 保持不变，用于你部署到设备的所有机器策略。\n\nApplicationname 和 ADMXFileName\
  \ 都是用户定义的。在本例中，Applicationname 为 App1，你可以使用与 ADMXFileName 相同的名称。只需记住 ADMXFileName\
  \ 必须唯一，这意味着你不能在同一设备上部署两个同名的 ADMX 文件。\n\n以下是我的 ADMX 文件的内容 – 这也可能是 Google Chrome、Microsoft\
  \ Office、Internet Explorer 或其他：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_356_0.png)\n\
  \n图 9.2 – AdmxInstalled 的注册表项\n\n然后，如果你更仔细地查看注册表，它们首先被写入的地方是 HKLM\\SOFTWARE\\MICROSOFT\\\
  PolicyManager\\AdmxInstalled。\n\n策略始终在 GUID 下声明，并使用你在 Microsoft Intune 中创建策略时为策略指定的名称。\n\
  \n然后，你将能够在创建策略设置时看到你使用的策略类别的命名：\n\n```\nHKLM\\Software\\Microsoft\\PolicyManager\\\
  AdmxDefault\n```\n\n如果策略是设备策略，你将能够在以下位置看到适用于设备的直接结果：HKEY_LOCAL_MACHINE\\SOFTWARE\\\
  Microsoft\\PolicyManager\\current\\device。\n\n最终，策略在 Windows 设备上所做的全部工作就是设置一些注册表项，而\
  \ MDM 策略也是如此。所有策略设置都进入这里：HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\。\n\n\n\n\nMDM\
  \ 策略在设备同步时应用，无论是在 Microsoft Intune 中触发，还是作为 Windows 设备在开启 MDM 同步时按 8 小时计划自动执行。\n\
  \nIT 管理员要从 Microsoft Intune 同步设备，请启动 Microsoft Endpoint Manager 管理中心，然后按照以下步骤操作：\n\
  \n- 1. 点击**主页 | 设备 | Windows | Windows 设备**。\n- 2. 搜索要同步的设备，然后可以选择单个设备并点击**同步**。Intune\
  \ 随后将通过 **Windows 推送通知服务 (WNS)** 尝试与设备取得联系：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_357_0.png)\n\
  \n图 9.3 – 设备同步\n\n- 3. 在刚刚选择单个设备的同一视图中，你还可以使用批量设备操作：\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_357_1.png)\n\

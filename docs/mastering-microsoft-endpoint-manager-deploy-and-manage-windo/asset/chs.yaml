  \ – Score trends\n\n## Application reliability\n\n健康的、高性能的应用程序使您组织中的用户能够保持生产力。查看当前的应用程序可靠性评分，并了解其与所选基线的比较情况。参考见解和建议，了解如何提高应用程序可靠性评分。\n\

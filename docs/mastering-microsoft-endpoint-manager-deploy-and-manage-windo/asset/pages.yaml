- pgno: 82
  md: '# High-level architecture components and responsibilities


    The architecture of Windows 365 is relatively simple to understand and a bit different
    from Azure Virtual Desktop (AVD) as some objects now live in a Microsoft-managed
    environment.


    All the blue parts are now managed by Microsoft and the gray elements are the
    responsibility of the customer/partner. This is different from solutions where
    you are responsible for most things yourself, meaning more overhead in management
    and most likely also a higher level of complexity.


    Microsoft manages the following services as part of Windows 365:


    +   - Virtualization control plane (information worker (web access) portal, gateway,
    connection broker, diagnostics, and REST APIs)

    +   - Cloud PCs and Azure compute services (VMs, provisioning, Azure subscriptions,
    Cloud PC VM provisioning, autoscaling, and so on)


    Customers and/or partners manage these components as part of Windows 365:


    +   - Azure Virtual Network (subnets, ExpressRoute, S2S VPN, and so on)

    +   - Microsoft Endpoint Manager (device configuration, settings catalog, PowerShell,
    and so on)

    +   - Azure Active Directory configuration (hybrid Azure AD, Conditional Access,
    compliance policies, and so on)

    +   - Active Directory Domain Services configuration (on-premises AD, Azure AD
    Connect, and so on)

    +   - Physical endpoint clients (Windows, macOS, Linux, Android, iOS, and so on)


    Microsoft Endpoint Manager is the unified management console on top of all the
    other services we leverage, such as Azure AD, Defender for Endpoint, Desktop Analytics
    for monitoring, and Intune to manage your physical and cloud endpoints all at
    once.


    The following diagram shows the high-level architecture of Windows 365 Enterprise
    with a hybrid Azure AD join as the domain configuration. It outlines the different
    responsibilities customers and partners have as part of the service as well as
    what other Microsoft Endpoint Manager components are tightly integrated:'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/a3e9f26159d3739e434fe676b2987c1d_83_0.png)


    Figure 3.6 – Microsoft Endpoint Manager and Windows 365 architecture


    # Microsoft Endpoint Configuration Manager support


    Configuration Manager is an on-premises management solution to manage desktops,
    servers, and laptops that are on your network or internet-based. You can cloud-enable
    it to integrate with Intune, Azure AD, Microsoft Defender ATP, and other cloud
    services. Use Configuration Manager to deploy apps, software updates, and operating
    systems. You can also monitor compliance, query and act on clients in real time,
    and much more.


    # Co-management and Windows 365


    As part of Endpoint Manager, you can continue to use Configuration Manager as
    you always have. If you''re ready to move some tasks to the cloud, consider co-management.


    Co-management combines your existing on-premises Configuration Manager investment
    with the cloud using Intune and other Microsoft 365 cloud services. You choose
    whether Configuration Manager or Intune is the management authority for the seven
    different workload groups.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Sizes and performance of fixed-price licenses


    The way Windows 365 works is a little bit different from how other virtualization
    services work. The performance of your Cloud PC is defined per user-assigned license
    via the Microsoft 365 admin center portal in the same manner as how you assign,
    for example, Microsoft 365 E3/E5 licenses to users.


    There are multiple licenses that reflect different VM sizes. Think about more
    vCPUs, RAM and OS, and profile storage. Graphically enhanced sizes will be added
    in the near future.


    The following table has all the different Cloud PC licenses that are available
    today. GPU-enhanced Cloud PC sizes will be added soon, and will most likely already
    be available when you read this book:


    | VM/OS disk size | Example scenarios | Recommended apps |

    |---|---|---|

    | 1vCPU/2 GB/64 GB | First-line workers, call centers, and education/training/CRM
    access.


    Note: This SKU is not supported for Windows 11. | Office light (web-based), Microsoft
    Edge, OneDrive, lightweight line-of-business apps (for example, a call center
    application – web apps), Defender support |

    | 2vCPU/4 GB/256 GB

    2vCPU/4 GB/128 GB

    2vCPU/4 GB/64 GB | Mergers and acquisitions, short-term and seasonal, customer
    services, bring your own PC, and work from home. | Microsoft 365 apps, Microsoft
    Teams (audio only), Outlook, Excel, PowerPoint, OneDrive, Adobe Reader, Edge,
    line-of-business apps, Defender support |

    | 2vCPU/8 GB/256 GB

    2vCPU/8 GB/128 GB | Bring your own PC, work from home, market researchers, government,
    and consultants. | Microsoft 365 apps, Microsoft Teams, Outlook, Excel, Access,
    PowerPoint, OneDrive, Adobe Reader, Edge, line-of-business apps, Defender support
    |

    | 4vCPU/16 GB/512 GB

    4vCPU/16 GB/256 GB

    4vCPU/16 GB/128 GB | Finance, government, consultants, healthcare services, bring
    your own PC, and work from home. | Microsoft 365 apps, Microsoft Teams, Outlook,
    Excel, Access, PowerPoint, Power BI, Dynamics 365, OneDrive, Adobe Reader, Edge,
    line-of-business apps, Defender support |'
  merge: -1

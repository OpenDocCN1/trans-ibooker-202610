- pgno: 447
  md: '# # User Profile Management


    Profile management is a very important factor in ensuring a good user experience.
    Your Windows profiles contain a baseline of settings to make your Windows 10 experience
    personal. Therefore, it''s very important to use technology that meets your needs
    to make sure that the same experience you have on Windows follows you on your
    other devices and endpoints too.


    Luckily, with cloud services, profile management is a lot easier these days –
    thanks to services such as **Azure Active Directory (Azure AD)**, OneDrive, and
    Microsoft Edge, it''s almost a piece of cake!


    After this chapter, you will know everything about the configuration of modern
    profile management on both physical and cloud endpoints.


    In this chapter, we''ll go through the following topics:


    +   - Windows profiles

    +   - **Enterprise State Roaming (ESR)**

    +   - Microsoft Office''s roaming settings

    +   - OneDrive for Business Known Folder Move'
  merge: -1
  img_proc: true
- pgno: 448
  md: '+   - Microsoft Edge

    +   - ESR + OneDrive + Edge + Office


    # Windows profiles


    The Windows profile is a very important component of Windows 10 Enterprise.


    There are different types of profiles that you could use within your desktop environment.
    The first, local user profiles, is mostly used as part of Microsoft Endpoint Manager.
    To modernize it, we will be adding cloud services to the profile (explained later).


    The other versions were used in the past to simplify the profile. Let’s see some
    more details about the different profile versions used as part of Microsoft Endpoint
    Manager:


    +   - **Local user profiles**: These are user profiles stored locally on the OS
    disk and created when you log on to Windows 10 Enterprise for the first time.
    Everything stored in the local profile is specific to the user and not to the
    computer. Local profiles are the solution that we use within both physical endpoints
    and Windows 365.


    +   - **Temporary user profiles**: A temporary profile is issued in case of a
    profile error, with the temporary profile being used to avoid the user loading
    a new empty profile that overwrites the existing one. Temporary profiles are flushed
    after the user logs on as a safety mechanism. Temporary profiles are only used
    in error scenarios when your normal local profile cannot be loaded.


    Profile types we don’t recommend using at the time of writing this book are roaming
    and mandatory profiles:


    +   - **Roaming user profiles**: This is a relatively old technology that makes
    it possible to replicate your local profile during logon and logoff to a central
    file server share. This profile copy process is file-based and can drag out the
    duration of the logon process for the user when the profile is large in size.
    With Office 365 services being used with caching enabled, this technology isn’t
    the best option. Local profiles are the best solution as an alternative when you
    are the owner of the physical or cloud endpoint – as a persistent end user experience.


    +   - **Mandatory user profiles**: A mandatory profile is a template of a local
    profile with many custom settings or modifications applied. Every time the user
    logs on, a new Windows local profile is created based on this mandatory profile
    template. This makes it possible to provide a consistent and brand-new profile
    experience for the end user. Profile settings are not saved after logging off.
    Therefore, this profile type is only applicable in non-persistent use cases.'
  merge: -1
  img_proc: true
- pgno: 449
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 450
  md: '+   - **Simplified management and monitoring:** Provide easy access, control,
    and visibility of who is able to sync their Windows profile settings to ESR and
    who isn''t. In the Azure portal, you can filter access based on Azure AD groups.


    When you have a mixture of physical and virtual devices in your environment, ESR
    could be utilized to transfer parts of your profile across your devices for a
    unified profile settings experience. See the following screenshot for how to activate
    the setting for all your users or for a selected (Azure AD) group of people:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_450_0.png)


    *Figure 12.1 – ESR settings*


    # What specific profile data is included in ESR?


    Here''s a list of profile settings for the Azure AD users that are stored within
    the ESR data and that will be restored every time the user logs on to a clean
    Windows 10 Enterprise device to provide a unified experience:


    | Profile component | Description |

    |---|---|

    | Windows themes | Your desktop themes and taskbar settings are saved. |

    | Language settings | Keyboard layouts, system language, date and time settings,
    and more. |

    | Cached password | Your passwords are stored in both Windows and your browsers.
    |

    | Ease of access features | High-contrast theme preferences and Narrator and Magnifier
    settings are saved. |

    | Other Windows settings | Mouse properties and settings are saved. |


    Once you enable ESR, log on to your Windows 10 Enterprise desktop and open **Accounts**
    under the **Settings** menu. You''ll see all the activated settings synced as
    part of your Windows profile!'
  merge: -1
  img_proc: true
- pgno: 451
  md: 'It''s pretty common that you as an IT admin create a policy that enforces the
    following settings, so end users cannot disable the settings. This would ensure
    that the profile settings data is always safely stored in the Microsoft cloud:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_451_0.png)


    Figure 12.2 – ESR settings in Windows


    In the next section, we will explain more about how Microsoft Office products
    automatically synchronize settings to the cloud for a seamless end user experience.


    # Microsoft Office''s roaming settings


    Office''s roaming feature enables experiences across Microsoft 365 apps and devices
    to improve productivity and make Office more personalized to you across any device.
    Some examples of settings and features are the list of most recently used files,
    the last reading position in a document, the first-run experience for Office add-in,
    autocorrect preferences, and themes.


    Here''s the full list of settings:


    +   - Most recently used files (all apps)

    +   - Most recently used locations (all apps)'
  merge: -1
  img_proc: true

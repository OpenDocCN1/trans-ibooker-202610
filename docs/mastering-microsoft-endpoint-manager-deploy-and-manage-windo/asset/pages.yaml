- pgno: 282
  md: '# Creating a custom Windows 10 profile to disable user ESP


    This is to ensure that the user portion of the ESP will not show up on the Edge
    kiosk as it is a userless device:


    +   - **Name:** `Disable User ESP`

    +   - **Description:** `Disable User ESP for Edge KIOSK`

    +   - **OMA-URI:** `./Vendor/MSFT/DMClient/Provider/ProviderID/FirstSyncStatus/SkipUserStatusPage`

    +   - **Data type:** `Boolean`

    +   - **Value:** `True`


    # Creating a custom Windows 10 profile to disable FirstLogonAnimation


    This policy setting allows you to control whether users see the first sign-in
    animation when signing in to the computer for the first time. This applies to
    both the first user of the computer who completes the initial setup and users
    who are added to the computer later. It also controls whether Microsoft account
    users are offered the opt-in prompt for services during their first sign-in.


    If you do not configure this policy setting, the user who completes the initial
    Windows setup will see the animation during their first sign-in. If the first
    user had already completed the initial setup and this policy setting is not configured,
    new users signing in to this computer do not see the first logon animation.


    In this Edge kiosk scenario, we just want a fast and easy onboarding experience:


    +   - **Name:** `Disable FirstLogonAnimation`

    +   - **Description:** `Disable FirstLogonAnimation for Edge KIOSK`

    +   - **OMA-URI:** `./Device/Vendor/MSFT/Policy/Config/WindowsLogon/EnableFirstLogonAnimation`

    +   - **Data type:** `Integer`

    +   - **Value:** `0`'
  merge: -1

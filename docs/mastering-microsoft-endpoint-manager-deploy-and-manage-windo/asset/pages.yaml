- pgno: 47
  md: '# 2

    What Is Unified Endpoint Management?


    The basics of modern management are sometimes complicated to understand. You will
    learn about the concept of modern management and zero trust with Intune as part
    of Microsoft Endpoint Manager, along with its history and architectural concepts,
    to get a clear understanding of how all devices – physical, virtual, and mobile
    – come together in a single management console.


    In this chapter, we''ll go through the following topics:


    +   - Paths to modern management

    +   - Microsoft Endpoint Manager and Intune

    +   - Exploring Windows 10 Enterprise in detail

    +   - Bring your own device

    +   - What is zero trust?'
  merge: -1

- pgno: 425
  md: '# 11


    # Office Policy Management


    You''ll learn about the Office cloud policies in this chapter, and how you can
    use this cloud service to configure the Microsoft 365 apps that your end users
    have installed either on their Windows devices at home or their company-issued
    Windows devices that are managed by a management tool such as Microsoft Intune.
    This is not a replacement for GPO, administrative templates, or settings catalog
    policies in Microsoft Intune, but in some scenarios, you can leverage the Office
    cloud policy service.


    We will also show how the Office Cloud policy service has Security Policy Advisor,
    which can help you and your enterprise to get insights into whether you have the
    correct security policy recommendations implemented. These recommendations are
    based on Microsoft best practices and information about your existing environment.


    Security Policy Advisor can only be used in combination with the Office Cloud
    policy service.


    In this chapter, we will cover the following topics:


    +   - The Office cloud policy service

    +   - Creating a policy configuration with the OCP service

    +   - Security Policy Advisor'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# The Office cloud policy service


    The Microsoft 365 Apps admin center (https://config.office.com) provides cloud-based
    policy management of Microsoft 365 enterprise apps. Policies deployed from the
    **Office cloud policy (OCP)** service will work on devices that are managed and
    unmanaged, so basically, all devices that users in your Office 365 organization
    are logging in to, both corporate and personally owned.


    When a user signs into Microsoft 365 Apps for enterprise on a device, the policy
    settings roam to that device. You can also enforce some policy settings for Office
    web apps, iOS, macOS, and Android.


    The Office cloud policy service includes many of the same user-based policy settings
    that are available in Group Policy or in Microsoft Intune. Conflict handling between
    the OCP service and policy settings from **Group Policy Object (GPO)** or Microsoft
    Intune is done so that Microsoft Intune or GPO will always win. A user can be
    a member of multiple Azure Active Directory groups with conflicting policy settings.
    By setting a priority on the Office policy in OCP, you can control which policy
    setting is applied. The highest priority is applied, with 0 being the highest
    priority that you can assign to a policy in the OCP service.


    Requirements for using the Office cloud policy service are as follows:


    +   - At least version 1808 of Microsoft 365 Apps for enterprise (and for the
    subscription versions of the Project and Visio desktop apps).

    +   - User accounts must be created in or synchronized to **Azure Active Directory
    (AAD)**. The user must be signed in to Office 365 ProPlus with an AAD-based account.

    +   - Security groups must be created in or synchronized to **AAD**, with the
    appropriate users added to those groups.


    Pros of cloud-based policy management are as follows:


    +   - It works on all devices – managed and unmanaged, both Microsoft Intune and
    SCCM.

    +   - It works on BYOD and personal devices.

    +   - The settings are always up to date and as it is a service from the Microsoft
    Office team, there is no need to download updated Administrative Template files
    (ADMX/ADML).'
  merge: -1
  img_proc: true

- pgno: 502
  md: '# Windows 365 security baselines


    Windows 365 delivers its own branded set of security baselines that include different
    best practices that are optimized for cloud PC virtualized scenarios.


    We highly recommend customers use these as they come from experience from real-world
    implementations. You can use these policies to lower the risk while increasing
    the security boundaries of your cloud PCs.


    You can use security baselines to get security recommendations that can help lower

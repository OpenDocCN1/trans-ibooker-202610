  md: '# Image management – creating a custom image (optional)


    In traditional VDI environments, rolling out virtual desktops always starts with
    creating a custom image, also known as a golden image. Microsoft understands the
    need for this, which is why this approach is also supported in Windows 365.


    However, the recommendation is to only use the image for baseline applications,
    agents, OS updates, and language packs. Then, you must add the other configuration
    items and applications via Microsoft Endpoint Manager and Intune.


    > Important Note

    > This step is optional. Microsoft will also provide marketplace images for both
    Windows 10 and Windows 11 that you can select during the provisioning policy creation
    process with Microsoft 365 Apps, Edge, and Teams optimizations pre-installed.


    When you wish to build images before you start the cloud PC provisioning process,
    perform the following steps:



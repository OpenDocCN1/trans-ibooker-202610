  md: '# About the reviewers


    **Seif Bassem** is a senior customer engineer in the global technical team at
    Microsoft, focusing on Azure apps and infrastructure. He has also worked in FastTrack
    within Microsoft, helping customers to modernize how they provision, manage, and
    secure their devices using Microsoft Endpoint Manager.


    Prior to joining Microsoft, Seif had 10 years of experience in the IT industry
    leading a team of engineers who were managing and deploying various Microsoft
    solutions and projects in the financial services sector.


    He is a certified Azure solutions architect, administrator, security engineer,
    and Microsoft 365 Certified Modern Desktop Administrator. He also participated
    as a CompTIA subject matter expert for the IT Fundamentals Certifications exam
    preparation.


    **Peter Cashen** is a UK-based technology consultant working through his own company,
    Kloud 365 Ltd, who has specialized in end user computing since the late 1990s.
    He has been involved with Microsoft technologies for over 20 years including SMS,
    System Center Configuration Manager, Endpoint Manager, and other related tools.
    Peter''s clients are from many sectors, including retail, banking, emergency services,
    secure government, pharmaceutical, legal, and engineering, and there has also
    been a stint at Microsoft.


    Peter is currently helping clients with large Azure Active Directory-only implementations
    across the globe to enable them to reduce (or eliminate) their on-premises footprint.


    > It''s hard work and challenging – but I thrive on challenges!


    **Paul Winstanley** is a five-time Enterprise Mobility MVP who has over 25 years
    of IT experience. He''s spent the last decade specializing in endpoint management
    via Microsoft Endpoint Manager, Configuration Manager, and Intune.


    Paul is an independent consultant with his own endpoint management company, SCCM
    Solutions, which was formed in 2013.


    He blogs on his SCCMentor website, sharing his knowledge of Configuration Manager,
    Intune, Windows 10, and MDM, and is active on Twitter @sccmentor.'

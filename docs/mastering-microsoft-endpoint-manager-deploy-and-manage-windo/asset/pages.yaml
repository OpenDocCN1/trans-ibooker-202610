    # Windows 11 update


    Windows 11 was released on October 5 as **General Availability (GA)** and can
    now be used as part of your production workloads. Microsoft Endpoint Manager supports
    Windows 11 from day one from a configuration management perspective.


    For example, you can push the Windows 11 update to your physical or cloud PCs
    as update ring. Make sure to select the right Windows 11 service channel.


    You can read more about this in this official Microsoft blog article: https://techcommunity.microsoft.com/t5/windows-it-pro-blog/commercial-previews-for-windows-11-and-windows-10-version-21h2/ba-p/2676467.'

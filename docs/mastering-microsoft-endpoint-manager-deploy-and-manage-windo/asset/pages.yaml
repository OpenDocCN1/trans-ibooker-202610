- pgno: 65
  md: '# WUfB is the new way of manning Windows servicing


    WUfB allows IT professionals to utilize the cloud-based Windows Update service
    to deploy and manage Windows updates. You can use Group Policy or MDM solutions
    such as Microsoft Intune to configure the WUfB settings that control how and when
    Windows 10 devices are updated.


    WUfB has been available since Windows 10, version 1511, and has been enhanced
    in Windows 10 releases since. Some of the improvements are designed to provide
    IT pros with greater control while offering an improved experience for the end
    user.


    # Who should use WUfB?


    WUfB is intended for devices running Windows 10 Education, Professional, or Enterprise
    editions managed in organizations. The Windows 10 **Long-Term Servicing Channel
    (LTSC)** is not supported with WUfB:


    +   - All organizations can leverage it to be more efficient in servicing their
    internet-connected devices.


    +   - Small and medium businesses gain flexibility while continuing to use Windows
    Update, with more control than previously provided without using System Center
    Configuration Manager, Microsoft Intune, **Windows Server Update Services (WSUS)**,
    or third-party solutions.


    # Why do I want WUfB?


    WUfB can help you to provide the end user with the best Windows update experience
    and lower the cost of servicing Windows, while giving you much of the flexibility
    and control available from more complicated and time-consuming solutions:


    +   - Reduce the cost of approving, deploying, and monitoring updates.


    +   - Manage application compatibility within the organization''s ecosystem.


    +   - Find the right trade-offs to protect devices, while minimizing disruption
    to the workforce.


    +   - Manage the infrastructure configurations necessary to support rapid update
    velocity, including finding the right way to address devices that are rarely connected
    to the enterprise.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# What does WUfB allow me to configure?


    When you configure WUfB policy from Microsoft Intune with the configuration setting,
    WUfB will be enabled. If you have traditionally utilized WSUS for servicing, your
    clients will connect to both Windows Update in the cloud as well as your WSUS
    server once you set WUfB settings. If you want to change this behavior, you need
    to remove your old configuration settings for WSUS on the endpoints.


    Through the Windows Update Client settings (through Group Policy, MDM, or the
    UX), WUfB provides the ability to delay the application of updates. Quality updates
    and feature updates are treated separately to give you added flexibility.


    In addition, you may leverage the "Pause" functionality if you need time to implement
    remediation to updates after testing them in earlier rings:


    +   - **Feature updates**: Previously referred to as **upgrades**, feature updates
    contain not only security and quality revisions but also significant feature additions
    and changes. Feature updates are released semi-annually in the fall and the spring.

    +   - **Quality updates**: Quality updates are traditional OS updates, typically
    released on the second Tuesday of each month (though they can be released at any
    time). These include security, critical, and driver updates. WUfB also treats
    non-Windows updates (such as updates for Microsoft Office or Visual Studio) as
    quality updates. These non-Windows updates are known as **Microsoft updates**,
    and you can set devices to receive such updates (or not) along with their Windows
    updates.

    +   - **Driver updates**: Updates for non-Microsoft drivers that are relevant
    to your devices. Driver updates are on by default, but you can use WUfB policies
    to turn them off if you prefer.

    +   - **Microsoft product updates**: Updates for other Microsoft products, such
    as versions of Office that are installed by using Windows Installer (MSI). Versions
    of Office that are installed by using Click-to-Run can''t be updated by using
    WUfB. Product updates are off by default. You can turn them on by using WUfB policies.


    Windows 10 feature updates policies work in conjunction with your *Windows 10
    update ring* policies to prevent a device from receiving a Windows feature version
    that''s later than the value specified in the feature updates policy.


    For Windows 10 feature updates policies to be working, Windows 10, version 1709,
    or later is required. The devices need to be enrolled in Intune MDM and be hybrid
    AD-joined, Azure AD-joined, or Azure AD-registered. Windows telemetry needs to
    be turned on, with a minimum setting of Basic. If telemetry is off, Windows can
    be upgraded to a later version of Windows than defined in the feature updates
    policy.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'When a device receives a Windows 10 feature updates policy, the device updates
    to the version of Windows specified in the policy. A device that already runs
    a later version of Windows remains in its current version. By freezing the version,
    the device''s feature set remains stable for the duration of the policy.


    A device will not install an update when it has a safeguard hold for that Windows
    version. When a device evaluates the applicability of an update version, Windows
    creates the temporary safeguard hold if an unresolved known issue exists. Once
    the issue is resolved, the hold is removed, and the device can then update.


    Unlike using **Pause** with an update ring, which expires after 35 days, the Windows
    10 feature updates policy remains in effect. Devices won’t install a new Windows
    version until you modify or remove the Windows 10 feature updates policy. If you
    edit the policy to specify a newer version, devices can then install the features
    from that Windows version.


    Today, there are more than 3,000 Group Policy settings for Windows 10. Although
    Microsoft provides extensive guidance on different security features, exploring
    each one can take a long time. You would have to determine the impact of each
    setting on your own and then determine the appropriate value for each setting.


    WUfB for Windows 10 has a set of policies that you can configure to provide the
    most secure Windows environments as it is updated, as long as the devices have
    internet connectivity and still keep the best end user experience by configuring
    policy settings across a number of areas:


    +   - Configuring deadlines

    +   - Restart behavior

    +   - Accounting for low-activity devices (active hours)

    +   - Delivery optimization

    +   - Power policies


    There has always been a tension between the need for being current with software
    update compliance and the desire to keep the workforce productive. While the security
    department has a requirement to see a fully updated device fleet within 7 days
    of a software update, the reality is that deployment of the said update has an
    associated cost for users, and very few companies can afford to push an update
    on an entire workforce in the middle of a single working day unless it is a zero-day
    patch in an emergency.


    Given the competing goals of a protected and productive workforce, you may find
    that you may need to make choices that are less than the best possible selection
    for maximizing update velocity in favor of an experience more aligned with your
    business’s productivity needs.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # Bring your own device


    BYOD has different options depending on the Windows SKU. All BYOD scenarios can
    leverage Windows 365 and Azure Virtual Desktop to get access to either a full
    desktop or a single application as a remote app.


    Windows devices can also be registered with Azure AD to gain access to corporate
    resources such as email.


    Enroll the device in Intune as a personally owned device (BYOD). If an administrator
    has configured autoenrollment (available with Azure AD Premium subscriptions),
    the user only has to enter their credentials once. Otherwise, they''ll have to
    enroll separately through MDM-only enrollment and re-enter their credentials.


    Microsoft Intune management does not provide the same management capabilities
    on BYOD; not all Windows editions have the same MDM management setting built in:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_68_0.png)


    Figure 2.5 – Microsoft Endpoint Manager endpoint support


    Windows 10 Enterprise has full management features, whereas both the Home and
    Pro editions have fewer management capabilities due to Windows limitations. Microsoft
    provides the option for the IT admin to leverage enrollment restrictions so that
    you can block personal enrollment into Microsoft Intune.


    # ## What is zero trust?


    In the past, when organizations created remote access to corporate networks, normally,
    access was effected with a VPN connection either on a corporate-owned or a personally
    owned Windows device, only secured by an MFA token.


    Today, organizations require a new security model that effectively adapts to the
    complexity of the modern environment, embraces the mobile workforce, and protects
    people, devices, applications, and data wherever they are located.


    This is the core of zero trust. Instead of believing that everything behind the
    corporate firewall is safe, the zero trust model assumes a breach and verifies
    each request as though it originated from an uncontrolled network. Regardless
    of where the request originates from or what resource it accesses, the zero trust
    model teaches us to "never trust, always verify."'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Verifying identity


    The majority of security breaches today involve credential theft, and lapses in
    cyber hygiene amplify the potential for risk to employees and to organizations
    at large. That''s why one of the primary components of a zero trust system is
    the ability to verify a user''s identity before access is granted to the corporate
    network.


    Start by implementing MFA through the modern experience of Azure Authenticator
    and Windows Hello for Business on all Windows 10 devices.


    # Verifying devices


    Because unmanaged devices are an easy entry point for bad actors, ensuring that
    only healthy and trusted devices can access critical applications and data is
    vital for enterprise security. A fundamental part of our zero trust implementation
    is to enroll all end user devices in device management systems such as Microsoft
    Intune.


    Enabling compliance policies to check the devices for parameters such as BitLocker
    encryption, secure boot, and device health verification in this way is essential
    to managing the policies that govern access to corporate resources.


    Microsoft Endpoint Manager is a key piece of this new way of thinking as it makes
    the device trusted, with a compliance policy to validate whether the devices are
    compliant.


    Conditional Access is the tool built into Azure AD to bring signals together,
    make decisions, and enforce organizational Conditional Access policies:


    +   - **Signals**: A device or a user sign-in with a specific application or browser.

    +   - **Decision**: What level of access you will be granted based on the policies.

    +   - **Enforcement**: This could be as simple as giving the end user access with
    an MFA token or denying access:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_69_0.png)


    Figure 2.6 – Zero trust verifying devices diagram'
  merge: -1
  img_proc: true

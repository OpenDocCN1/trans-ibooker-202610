  md: '# # Cloud configuration scenario


    You can leverage deploying Windows 10 in a cloud configuration. In the Microsoft
    Endpoint Manager admin center, https://endpoint.microsoft.com/, choose **Troubleshooting
    + support | Guided scenarios (preview)**.


    Optimize your Windows 10 devices for the cloud with a simple, secure, standardized
    configuration fit for your needs:


    +   1. Select **Start** in the **Deploy Windows 10 in cloud configuration** guided
    scenario.

    +   2. In the introduction, select **Next**.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_272_0.png)


    Figure 7.25 – Guided scenarios


    # ## Introduction


    Windows 10 in a cloud configuration helps to standardize and simplify device management
    for users with focused workflow needs. You can use a cloud configuration to configure
    new devices or to repurpose and extend the life of existing hardware. It works
    on any Windows 10 Pro, Windows 10 Enterprise, or Windows 10 Education device.
    Let''s now learn more and evaluate the cloud configuration.


    The following guided workflow makes it easy to deploy the recommended apps and
    device configurations found in the cloud configuration overview and setup guide.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Who is this configuration useful for?


    Windows 10 cloud configuration is designed for device users with simplified needs,
    such as productivity and browsing. Ideal candidates are the following groups of
    users in your organization:


    +   - Those who use a focused set of apps curated by IT for their workflow needs,
    such as email, Microsoft Teams, a browser, and essential productivity and line-of-business
    apps. Apps can be delivered directly to the device or through virtualization.

    +   - Those who have no dependency on an on-premises infrastructure to be successful
    in their role.

    +   - Those who use devices that do not require complex setting configurations
    or custom agents.

    +   - As an admin, you get to enjoy the benefits of a standardized device configuration
    applied across the organization, simplifying management, troubleshooting, and
    device replacements.

    +   - End users enjoy a familiar Windows 10 experience optimized for the cloud
    with just the apps and settings they need.


    # What you will need to continue


    Make sure you have enabled automatic enrollment. You can manage automatic enrollment
    settings under **Devices | Windows | Windows enrollment | Automatic enrollment**.


    # Basic


    This is the step where you are configuring Windows Autopilot:


    +   1. For **Apply device name template**, select **Yes**.

    +   2. Enter a name for the Autopilot naming template, such as `Win-%RAND:5%`.'
  merge: -1

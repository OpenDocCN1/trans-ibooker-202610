- pgno: 85
  md: '| 8vCPU/32GB/512GB

    8vCPU/32GB/256GB

    8vCPU/32GB/128GB | Software developers, engineers, content creators, and design
    and engineering workstations. | Microsoft 365 apps, Microsoft Teams, Outlook,
    Access, OneDrive, Adobe Reader, Edge, Power BI, Visual Studio Code, line-of-business

- pgno: 564
  md: '# Registering your own custom printers with Universal Print


    We are finished with the connection part; we now need to make the printers available
    in the cloud as part of the Universal Print service:


    +   1. Select the printers in the Available Printers list. Click on Register:


    > Important note

    > The list of available printers is detected from the printers attached to the
    desktop/server you install the printer connector on.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_564_0.png)


    Figure 15.17 – Universal Print – print connector'
  merge: -1
  img_proc: true
- pgno: 565
  md: '2. The printers are added to the cloud. The status is **in progress**. This
    takes a minute or so.


    We''ve done all the pre-steps now. The printers are now all visible in the **Registered
    Printers** list; however, as you can see, they aren''t shared yet. That''s something
    we are going to do now.


    # Sharing your printers with your users


    Let''s look at how you can share your printers with your end users:


    +   1. Go to the Universal Print portal and open **Printers**.


    > **Important note**

    > As you can see, they have the status **Not shared**.


    +   2. Select the printer(s) you want to share. Click on **Share**:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_565_0.png)


    Figure 15.18 – Universal Print – management console


    Now we are ready with the print sharing/publishing steps, the users are still
    not allowed to see and use the printers. Therefore, we need to add either an Azure
    AD group or the users directly to the list of members.'
  merge: -1
  img_proc: true
- pgno: 566

- pgno: 157
  md: '# 5

    Requirements for Microsoft Endpoint Manager


    In this chapter, you will get a clear understanding of the different requirements
    for Microsoft Endpoint Manager (MEM), from OS versions and the URL firewall allow-listing
    to the required licenses and privileges. Before we get started with the technical
    in-depth content of this book, we will cover the requirements for MEM. Some of
    the requirements may not have any impact on your environment, and others will
    have a high impact. For example, network URL firewall requirements are not that
    important if you are in a zero-trust environment with all Microsoft technologies,
    but if you for some reason have a firewall, proxy servers, and so on in your environment,
    then they are highly important.



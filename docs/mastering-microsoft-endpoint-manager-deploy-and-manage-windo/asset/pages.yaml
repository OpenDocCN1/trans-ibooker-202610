  md: '# Deploying essentials that users might need to access

    work or school resources


    Be sure to configure the certificates, VPN profiles, Wi-Fi profiles, and desktop/app
    virtualization clients that enable access to your organization''s resources.


    # Monitoring your cloud configuration devices


    Use Microsoft Endpoint Manager to monitor the deployment status and device health
    of your cloud configuration devices. For information on how to monitor each of
    the components, refer to the cloud configuration overview and setup guide.


    This is an easy way to start testing Windows Autopilot and cloud-configured devices.
    In the next section, we will cover how to deploy devices running in kiosk mode
    and that are being provisioned by Windows Autopilot.


    # Edge kiosk self-deployment scenario


    From Windows 10 20H2, Microsoft Edge, based on Chromium, is built into the OS
    delivered. This scenario will cover how to configure Microsoft Edge in kiosk mode
    for a single app with Microsoft Endpoint Manager:


    +   1. Upload Autopilot devices with a group tag such as EdgeKIOSK.

    +   2. Create a specific ESP for the Edge kiosk.

    +   3. Create a Windows Autopilot profile.

    +   4. Create some profiles that can benefit the kiosk scenario.

    +   5. Create a kiosk profile.


    # Creating a specific ESP for the Edge kiosk


    A kiosk device can be userless, and by using Windows Autopilot self-deploying
    mode, no user has to sign in when onboarding the device into AAD or Microsoft
    Intune, so we will create an ESP and assign it to the Autopilot group for this
    specific scenario.'

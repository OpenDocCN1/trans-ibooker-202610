    not going through the Autopilot workflow. Most likely, there is no Autopilot profile
    assigned to the device. You can find the Windows Autopilot device and see additional
    details by navigating to Home | Devices | Windows | Windows Autopilot devices,
    which will take you to the following screen:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_609_0.png)


    Figure 16.32 – Autopilot profile not assigned'

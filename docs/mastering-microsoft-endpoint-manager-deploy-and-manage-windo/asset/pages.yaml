  md: '# Domain Administrator


    Users with this role will be able to create computer accounts in your on-premises
    domain. This is needed to create the computer accounts for cloud PCs in your domain.
    You can also delegate access via delegation of control directly with the right
    Organizational Unit on your domain.


    # Identity roles and privileges for Universal Print


    Universal Print introduced two roles, Printer Administrator and Technician, to
    Azure AD. The Printer Administrator is needed to do the initial configuration.
    A Global Admin account will be sufficient too.


    We will talk more about Universal Print later on in the book.


    # Printer Administrator


    Users in this role have full access to manage all aspects of printers in Universal
    Print.


    # Printer Technician


    Users in this role can register and un-register printers and set the printer status.


    # Licensing requirements


    To use MEM, you have to be entitled to an Intune license. There are also options
    to obtain a trial license for 30 days to kick the tires and validate the service.


    MEM as a service doesn''t require an Azure subscription; however, when you use
    the service together with a cloud PC, you''ll need to set up an Azure virtual
    network and, therefore, you need an Azure subscription. An Azure subscription
    will not be necessary when Azure AD join is supported with cloud PCs (coming soon).


    Here are the types of licenses that provide access to MEM:


    +   - Intune-only license

    +   - Microsoft 365 E3

    +   - Microsoft E5

    +   - **Enterprise Mobility + Security (EMS)** E5'

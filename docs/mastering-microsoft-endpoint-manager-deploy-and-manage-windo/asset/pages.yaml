- pgno: 536
  md: 'Each application on the App performance tab is assigned an App reliability
    score based on the following:


    +   - **Crash frequency**: For each app, there are two metrics:

    +     - The total number of app crashes.

    +     - The total usage duration over a 14-day rolling window is used to calculate
    the Mean time to failure value in the **App performance** tab.

    +   - **Total usage duration**: Is a factor in the usage duration across all enrolled
    devices in Endpoint analytics. This ensures that you get the data for the most
    disruptive application issues that are prioritized in the App reliability score.


    # Windows 365-specific metrics


    Another huge benefit is that Endpoint analytics is also the tool you use to check
    the status of your physical endpoints. This means that you can create one single
    pane of glass to check the status of your physical endpoint and cloud PC endpoint
    altogether at once.



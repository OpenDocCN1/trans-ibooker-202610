  md: 'By using **Reset to default** instead, which is the Microsoft-recommended setting,
    your end users can set active hours themselves and leverage intelligent active
    hours if the end user does not configure active hours. This is more important
    than ever when employees are working different hours than they used to before
    working from home was the new normal:


    # Active hours


    Set active hours to let us know when you typically use this device. We won''t
    automatically restart it during active hours, and we won''t restart without checking
    if you''re using it.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_218_0.png)


    Figure 6.17 – Active hours client side


    **Restart checks** can be set to skip all checks before restarting. This includes
    the battery level being at 40%, the user presence, the display needed, presentation
    mode, fullscreen mode, phone call state, game mode, and so on.


    **Option to pause Windows updates** gives the end user the option to pause an
    update with Windows Update for up to 7 days.


    If you discover a problem while deploying a feature or quality update, it can
    be paused by the IT administrator for 35 days from a specified start date to prevent
    other devices from installing it until the issue is mitigated. If you pause a
    feature update, quality updates are still offered to devices to ensure they stay
    secure. The pause period for both feature and quality updates is calculated from
    the start date that you set.


    From within your update ring policy in Microsoft Intune, you can choose to pause
    Windows feature or quality updates on devices:'

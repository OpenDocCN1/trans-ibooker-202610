    # Windows Push Notification Services (WNS)


    WNS enables Microsoft Intune to send toast, tile, badge, and raw updates from
    Microsoft Intune to MDM-enrolled devices. This provides a mechanism to deliver
    new updates to your users in a power-efficient and dependable way:


    +   1. Microsoft Intune makes an HTTP POST to the channel URI. This request is
    made over SSL and contains the necessary headers and the notification payload.

    +   2. WNS responds to indicate that the notification has been received and will
    be delivered at the next available opportunity.


    WNS does not provide end-to-end confirmation that your notification has been received
    by the device or application. Microsoft Intune provides this option by showing
    the status in the Device actions status view on the Overview blade for a specific
    device:'

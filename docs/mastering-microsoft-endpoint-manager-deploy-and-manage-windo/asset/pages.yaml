    administrator rights out of the box. When you want all or some of your users to
    be local administrators, we can build the following feature into Microsoft Endpoint
    Manager as a configuration profile that makes users local administrators.


    Make sure that you only configure the configuration profile for the devices or
    users that need these rights.


    # VM SKU upgrades (preview feature)



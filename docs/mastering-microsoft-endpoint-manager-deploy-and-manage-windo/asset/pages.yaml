- pgno: 224
  md: '# Windows 10 feature updates


    Windows 10 feature updates policies work in conjunction with your Windows 10 update
    ring policies from Microsoft Intune, to prevent a device from receiving a Windows
    feature version that is later than the value specified in the feature updates
    policy.


    A feature update in the Windows update ring policy should be configured to 0,
    which you can do in the following setting in Microsoft Endpoint Manager:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_224_0.png)


    Feature updates for the update ring must be running. They must not be paused.


    The device updates to the version of Windows specified in the policy. However,
    it remains at its current version if the device is already running a later version
    of Windows. By freezing the version, the device’s feature set remains stable for
    the duration of the policy.


    Microsoft Intune Windows 10 feature updates require the following prerequisites:


    +   - Be enrolled in Intune MDM and be hybrid AD-joined, AAD-joined, or AAD-registered.

    +   - Have Telemetry turned on, with a minimum setting of Basic.


    We are now going to configure the Windows 10 feature update profile settings in
    Microsoft Endpoint Manager:


    +   1. Sign in to the Microsoft Endpoint Manager admin center (https://endpoint.microsoft.com).

    +   2. Select Devices | Windows | Windows 10 Feature Updates | Create profile:'
  merge: -1
  img_proc: true
- pgno: 225
  md: '![](img/a3e9f26159d3739e434fe676b2987c1d_225_0.png)



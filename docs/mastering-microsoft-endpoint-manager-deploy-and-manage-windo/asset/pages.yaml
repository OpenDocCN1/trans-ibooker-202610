- pgno: 525
  md: '# # Endpoint analytics – advanced monitoring


    The main purpose of Endpoint analytics is to proactively optimize the user experience
    and track your progress along the way. It''s your main dashboard as an IT administrator
    to track the quality level of both your physical and virtual desktop environments.


    The metrics that you can find show the value of all Microsoft Endpoint Manager-managed
    devices in your environment, for example, of your physical and Windows 10 or 11
    cloud PCs combined.


    Here''s a list of the reports/dashboards currently available in Endpoint analytics:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_525_0.png)


    Figure 14.2 – Overview of your environment


    # ## Start up performance – logon duration


    Improving start up performance to optimize the time from powering on your physical
    computer to productivity is best for consistent performance in terms of increasing
    the speed to productivity.


    Review your current score and see how it compares to the selected baseline. Refer
    to the list of different insights and recommendations to learn how to improve
    your device start up times and score; this can be found in the Endpoint analytics
    dashboards.'
  merge: -1
  img_proc: true
- pgno: 526
  md: 'Here''s a list of the metrics available in Endpoint analytics, per organization,
    and per user device level, to dig deeper into specific scenarios:


    +   - **Core boot**: Average time it takes to reach the sign-in prompt after a
    device is turned on. Excludes the OS update time:

    +   - **Group Policy**: Average time spent processing Group Policy during the
    device''s core boot

    +   - **To sign-in screen**: Core boot time minus the time spent processing Group
    Policy

    +   - **Core sign-in**: Average time it takes to get to a responsive desktop after
    a user signs in. Excludes new user sign-in and first sign-in following a feature
    update:

    +   - **Group Policy**: Average time spent processing Group Policy during the
    device''s core sign-in

    +   - **To desktop**: Average time between sign-in and when the desktop renders,
    minus the time spent processing Group Policy

    +   - **To responsive desktop**: Average time between when the desktop renders
    and when CPU usage falls below 50%


    The start up performance score gives the IT department insight into the end user
    experience from power-on to productivity. With these insights come recommendations
    on what to change to improve end users'' experience. Next, we will cover the performance
    score breakdown.


    # Performance score breakdown


    To calculate our tenant''s score, we look at how long it takes each device to
    complete the core boot phase and score each experience from 0 (poor) to 100 (exceptional).
    We then calculate the average score of all devices to get the core boot score.


    In the following screenshot, you can find an example breakdown of the full logon
    process, from booting up and the logon process of your physical, to even further
    in your cloud PC, your Windows 10 Enterprise endpoint.'
  merge: -1
  img_proc: true

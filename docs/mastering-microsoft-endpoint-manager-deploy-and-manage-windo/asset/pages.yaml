- pgno: 422
  md: '# Summary


    In the chapter, you''ve learned about the different policy types and looked at
    scenarios for configuring Windows in a more modern way via Microsoft Endpoint
    Manager for both physical and cloud endpoints. We have looked at some scenarios
    and policy configurations that you can leverage. In the policy management area,
    you need to figure out what kind of approach you want to take in your enterprise
    environment. When looking at pure cloud-managed devices and policies, it would
    be the perfect time to look forward and not backward. As examples, start by deploying
    policies that have a security impact, such as the Edge security baseline, Windows
    Defender policies, and so on. Then, look at deploying policies that will help
    your end users be more productive, such as configuring OneDrive Known Folder Move,
    policies that help end users start working in their apps better, such as autoconfiguring
    Microsoft Edge, removing prompts from applications, and so on. When you are done
    with those two big areas, you might be done or at least in a good place to start.
    After testing with your end users regarding their experience and any feedback
    they have, you can go back and change your policies to fit the business requirements.
    The same goes for when you are talking to application owners in your business,
    or your security department has specific requirements that certain policies or
    settings to be on your devices. This is an ongoing process to evaluate whether
    you are using the correct policies in your environment, just as you probably had
    a similar process when your policy configuration was done with GPO.


    After this chapter, you will be able to manage your physical and cloud endpoints
    and know when to follow which configuration path moving forward. The next chapter
    is part three of policy management. The last part looks at a cloud service that
    you can leverage if you have Office 365 to configure Microsoft 365 apps, both
    with and without Microsoft Intune.


    # Questions


    +   1. What is Storage Sense?

    +      a) A service to optimize the performance of your SSD.

    +      b) A service with a sense of humor.

    +      c) A service to clean up your endpoints from the OneDrive cache and the
    Downloads folder in your profile.

    +      d) A service to block services from running.'
  merge: -1
  img_proc: true

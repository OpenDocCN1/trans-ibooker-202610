- pgno: 237
  md: '# 7

    Manager Windows

    Autopilot


    In this chapter, you will learn about Windows Autopilot, how it works, and why
    it could be beneficial for your organization to simplify the delivery process
    of your physical endpoints.


    Windows Autopilot is a collection of technologies used to preconfigure brand-new
    devices and get them into a state where the end user can be productive.


    Windows Autopilot is designed to easily onboard a brand-new device from anywhere.
    Previously, enterprises relied on **Operation System Deployment (OSD)**, but during
    the global Covid pandemic, where many employees were working from home, more and
    more enterprises were looking for alternatives to get new devices to their end
    users even when working from home. Windows Autopilot is a perfect fit for this
    scenario, where an **Original Equipment Manufacturer (OEM)** or reseller can send
    the device directly to the end user, who can then unbox the new device, get it
    up and running, and start working without any need to go into the office.'
  merge: -1
  img_proc: true

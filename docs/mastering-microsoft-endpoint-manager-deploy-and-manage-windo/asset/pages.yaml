- pgno: 377
  md: 'This concludes this section on Microsoft Security baselines. Next, we will
    cover Endpoint security policies.


    # Configuring your Endpoint security profile


    The **Endpoint security** node of Microsoft Intune was built to allow IT or security
    admins to configure device security. By using these security-focused policies,
    you will only see security-related policies in this blade view and not regular
    policies for other types of settings. Policies in the Endpoint Security blade
    can be applied to Windows or macOS. These policies can be Windows 10 MDM (Microsoft
    Intune) or Windows 10 and Windows Server (ConfigMgr). The last one is for tenant-attached
    devices that are not onboarded to Microsoft Intune.


    # Microsoft Defender policy


    Antivirus policies include the same settings as endpoint protection or device
    restriction profiles for device configuration policies.


    However, those policy types include additional categories of settings that are
    unrelated to antivirus policies. While the Windows Defender policy types in the
    **Endpoint security** blade only contain Windows Defender settings, you can see
    the three different policy types here:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_377_0.png)


    Figure 10.3 – Windows Defender policy types'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# Profile: **Windows Security experience**


    The Windows Security app is used by several Windows security features to provide
    notifications about the health and security of a machine. Security app notifications
    include firewalls, antivirus products, and Windows Defender SmartScreen.


    The Windows Security experience profile can be used to turn off areas in the Windows
    Security app, such as family options if you don''t want to show family options
    on your Intune-managed devices:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_378_0.png)


    Figure 10.4 – Windows Security app'

- pgno: 493
  md: '# BitLocker disk encryption


    BitLocker has been available since the first release of Windows Vista and gives
    the option to encrypt the drives attached to the endpoint. In most cases, BitLocker
    can work in conjunction with your endpoint that has a Trusted Platform Module
    (TPM) chip.


    As long as you can authenticate to your device and you are not moving the OS disk
    out of the endpoint and exchanging it for another device, it''s unlikely that
    you will ever need the BitLocker key that is associated with your device disk
    to decrypt everything. The help desk operator role will be able to access all
    the keys to restore:


    +   1. To enable BitLocker for your Windows 10 or Windows 11 endpoints, you have
    to go to Endpoint security, followed by Disk encryption.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_493_0.png)


    Figure 13.38 – Endpoint security – Disk encryption


    > Note

    > BitLocker is not supported on Windows 365 as of yet.'
  merge: -1
  img_proc: true
- pgno: 494
  md: '2. Click on Create Policy.

    3. Select Windows 10 and later as the platform with BitLocker for Profile.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_494_0.png)


    Figure 13.39 – BitLocker profile


    4. Enter a name for the policy.

    5. Change the BitLocker base settings to align them with your needs. Here''s a
    rundown of what every setting means:


    +   - Enable full disk encryption for OS and fixed data drives: If not configured,
    no BitLocker enforcement will take place. If the drive was encrypted before this
    policy was applied, no extra action will be taken. If the encryption method and
    options match that of this policy, the configuration should return success.

    +   - BitLocker fixed drive policy: This policy setting is used to control the
    BitLocker for the fixed drive. The values of this policy determine the strength
    of the cipher that BitLocker uses for encryption.

    +   - BitLocker system drive policy: This policy setting is used to control BitLocker
    for the system drive. The values of this policy determine the strength of the
    cipher that BitLocker uses for encryption.

    +   - BitLocker removable drive policy: This policy setting is used to control
    BitLocker for the removal drive. The values of this policy determine the strength
    of the cipher that BitLocker uses for encryption.


    Most likely, you want to enable full disk encryption for the OS and fixed drives,
    including potentially the rotation of the recovery password to increase security.'
  merge: -1
  img_proc: true

    # Monitoring and analytics


    Monitoring your Windows 10 Enterprise environment is just as important as the
    implementation of it. User experience is the most important part of a successful
    implementation.


    Microsoft Endpoint analytics and Productivity Score as built-in services make
    it possible for you to stay ahead of problems that you might encounter in your
    environment before they occur. You don''t need to make an additional environment
    or pay for consumption-based resources as part of this service; everything is
    included in your Microsoft 365 license. You''ll read about everything you need
    to know in this regard in this chapter!


    # Monitoring your physical and virtual cloud endpoints


    If you are an existing Microsoft Endpoint Manager customer, you''ll already use
    the Monitor option inside the Devices menu. As Windows 365 is equal to a physical
    Windows 10 Enterprise desktop, you can monitor both your virtual and physical
    devices here for one unified experience.'

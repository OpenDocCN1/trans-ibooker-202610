    # The Windows Insider Program for Business


    Register for the Windows Insider Program for Business. The benefit of enrolling
    your corporate tenant for the Windows Insider Program for Business is that you
    as an IT admin can manage installations of Windows 10 and Windows 11 Insider preview
    builds across multiple devices in your organization using Microsoft Intune.


    Register with either your AAD work account, which we recommend for the best experience,
    or your personal Microsoft account. If you use your organization''s account, you''ll
    be able to give Microsoft feedback on behalf of your organization to help shape
    Windows to meet your business''s specific needs. You must register with your AAD

    If you created a new OU, then it’s likely not included, and you’ll need to go
    back into Azure AD Connect and include it in the synchronization rules, as illustrated
    in the following screenshot:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_631_1.png)


    Figure 17.8 – Azure AD Connect domain filtering'
  merge: -1
  img_proc: true
- pgno: 632
  md: '# Azure AD synchronization and replication cause delays


    The cloud PC provisioning process times out after 90 minutes and your environment
    might be configured to introduce unwanted delays. Let''s discuss two scenarios
    where this occurs: synchronization and replication.


    # Azure AD synchronization interval


    The default Azure AD Connect sync interval is every 30 minutes. The time it takes
    to complete the synchronization process depends on the number of objects Azure
    AD Connect is processing.


    To prevent your cloud PCs from timing out, you need to make sure that the sync
    interval and the sync time is less than 90 minutes. First, confirm that your Azure
    AD Connect sync service is running and that its interval hasn''t been extended,
    for example, to every 2 hours. For instructions, see Azure AD Connect sync: https://docs.microsoft.com/azure/active-directory/hybrid/how-to-connect-sync-feature-scheduler.
    Next, if you are synchronizing a lot of objects, review this document to learn
    how to optimize your environment: https://docs.microsoft.com/azure/active-directory/hybrid/plan-connect-performance-factors.


    # AD DS inter-site replication


    Consider this AD DS topology. We have a domain controller at one site running
    Azure AD Connect, and a domain controller at a different site that the cloud PC
    provisioning service uses to create computer objects, as illustrated in the following
    screenshot:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_632_0.png)


    Figure 17.9 – Azure AD Connect topology'
  merge: -1
  img_proc: true
- pgno: 633
  md: 'We previously explained that the Azure AD Connect sync interval and synchronization
    time need to complete before cloud PC provisioning times out (90 minutes). This
    scenario adds another time to consider: the inter-site replication time for the
    domain. The default for this is 15 minutes, which, if added to the total possible
    time for computer objects to appear in AD DS and then in Azure AD, creates a new
    total time of 1 hour, as illustrated in the following diagram:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_633_0.png)


    Figure 17.10 – Azure AD sync cycle


    This is the theoretical maximum time and is not applicable to every organization;
    however, we have seen examples of long inter-site replication times causing timeout
    issues. The takeaway is that if you have long-running sync times due to size and
    complexity, try to minimize any other possible delays. With modern connectivity,
    there isn''t often a reason to limit inter-site sync intervals, so you might want
    to consider setting replication to the default 15 minutes.


    Thanks and credits go to Steven DeQuincey, Field PM of Microsoft 365 for Partners,
    for contributing to this section.


    # Intune enrollment failed


    Windows 365 performs a device-based Mobile Device Management (MDM) enrollment
    into Intune. This should be very reliable.


    If Intune enrollment is failing, please ensure all of the required Intune endpoints
    are available on the VNet of your cloud PCs. Also ensure there are no MDM enrollment
    restrictions on the tenant, and that the Intune tenant is active and healthy.


    Resolution: Attempt an Intune enrollment using a test device or VM.


    # Not enough IP addresses available


    When providing a subnet to the OPNC, ensure there are more than sufficient IP
    addresses.


    Every cloud PC provisioning process uses one of the IP addresses provided in the
    range.'
  merge: -1
  img_proc: true
- pgno: 634
  md: 'If provisioning fails, it will be retried a total of three times. Each time,
    a new **virtual network interface card (vNIC)** and IP address will be allocated.
    These IP addresses will be released in a matter of hours, but this can cause issues
    if the address space is too narrow.


    **Resolution:** Check the VNet for available IP addresses and ensure there are
    more than enough IPs available for the retry process to succeed.


    # Provisioning policy not found


    While provisioning was in progress, someone deleted the provisioning policy.


    **Resolution:** Ensure the provisioning policy is available and assigned to the
    correct user group.


    # User not found


    While provisioning was in progress, someone deleted the associated user.


    **Resolution:** Ensure the assigned user account is valid.


    # License not found


    While provisioning was in progress, someone removed the user''s Windows 365 license.


    **Resolution:** Ensure the user has a valid Windows 365 license assigned to their
    account.


    # Request disallowed by policy


    Windows 365 uses the customer-provided VNet to perform vNIC ingestion from the
    cloud PC VM into the customer''s VNet. An enterprise will sometimes implement
    an Azure policy to restrict certain Azure objects from being created.


    **Resolution:** View **Policy** in the Azure portal and look for any policy events
    that would stop the Windows 365 service from provisioning the cloud PC.


    # OPNC isn''t healthy


    Cloud PC provisioning will be blocked if the associated OPNC is not healthy.


    The OPNC will refresh every 6 hours. If the OPNC refresh fails while provisioning
    is ongoing, it will fail the complete provisioning process.


    **Resolution:** Ensure the OPNC is healthy and retry the provisioning.'
  merge: -1
  img_proc: true
- pgno: 635
  md: '# Web Proxy Auto-Discovery (WPAD) problems


    The cloud PC service uses the AVD agent to connect to the broker services of the
    virtualization control plane. When you use a proxy via WPAD via DNS, you could
    run into problems such as the machine account not being allowed to connect to
    the service URLs of both AVD and MEM.


    **Resolution:** Allow the machine account or IP addresses in your network to connect
    over the internet to the list of service URLs. As an alternative, you could remove
    the proxy settings so that they are no longer applied to cloud PCs and use a direct
    route to the internet (preferred).


    # Incorrect username and password or permissions to join domain


    Windows 365 Enterprise requires a domain environment to join cloud PCs to your
    AD domain.


    **Resolution:** The AD service account created for this and configured in the
    OPNC needs to have the following permissions to do this:


    +   1. **Create computer objects in the OU** (join the computer to the domain).

    +   2. **Delete computer objects in the OU** (needed to deprovision the cloud
    PC to remove the computer account from AD).

    +   3. Permissions to enumerate user objects so that they can be found, to be
    added to the local `Remote Desktop Users` group when provisioning.


    The other problem could be that you just entered in the wrong credentials!


    # Unable to reach the DSC files


    Being unable to reach the **Desired State Configuration (DSC)** files during provisioning
    causes a failure, showing the following message:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_635_0.png)


    Figure 17.11 – Failure message'
  merge: -1
  img_proc: true
- pgno: 636
  md: '**Resolution:** Ensure the firewall access is correctly configured to allow
    DSC endpoints across the following:


    +   - `prod.warmpath.msftcloudes.com`

    +   - `cpcsacnrysalprodprna01.blob.core.windows.net` (North America)

    +   - `cpcsacnrysalprodprna02.blob.core.windows.net` (North America)

    +   - `cpcsacnrysalprodprap01.blob.core.windows.net` (Asia Pacific)

    +   - `cpcsacnrysalprodprau01.blob.core.windows.net` (Australia)

    +   - `cpcsacnrysalprodpreu01.blob.core.windows.net` (EU)

    +   - `cpcsacnrysalprodpreu02.blob.core.windows.net` (EU)

    +   - `mrsgglobalsteus2prod.blob.core.windows.net`

    +   - `catalogartifact.azureedge.net`

    +   - `kms.core.windows.net`


    To check if this is a network connection URL access issue, you can try the following
    actions:


    +   1. Perform a nslookup operation on the Azure container for your region to
    check you can resolve with your organization''s DNS servers, as illustrated in
    the following screenshot:


    ```

    C:\WINDOWS\system32>nslookup cpcsacnrysalprodpreu01.blob.core.windows.net

    Server:  UnKnown

    Address:  172.16.0.1


    Non-authoritative answer:

    Name:    blob.dub07prdstr05a.store.core.windows.net

    Address:  52.239.138.100

    Aliases:  cpcsacnrysalprodpreu01.blob.core.windows.net

    ```


    Figure 17.12 – nslookup on Azure container'
  merge: -1
  img_proc: true
- pgno: 637
  md: '2. If DNS resolution is successful, then use PsPing to check whether you can
    establish a connection (you cannot establish this via a browser as you will be
    unable to authenticate), as illustrated in the following screenshot:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_637_0.png)


    Figure 17.13 – PsPing to check connection


    # Cloud PC – device-based filtering


    You could run into scenarios where you already have a configured MEM tenant to
    manage your physical endpoints. Existing policies, application delivery rules,
    or other configuration items could be filtered to All Devices in the Windows 365
    blade of the MEM admin center console. This could cause conflict as there might
    be cases where the setting should only apply to your physical environment.


    All cloud PC devices have a specific model name (contains Cloud PC) and an enrollment
    profile name (equals the cloud PC provisioning profile) that can be used to filter
    them from an All Devices assignment.'
  merge: -1
  img_proc: true
- pgno: 638
  md: '# Users are getting the error "Your access to this Cloud PC ends in 5 days.
    Back up your files immediately"


    When you see the preceding error in the Windows 365 web portal, it means that
    the IT administrator removed the Windows 365 license from your user account. The
    cloud PC isn''t deleted directly after that but moves into a grace period of 7
    days.


    To solve this problem, the IT administrator has to re-assign the license to avoid
    potential data loss for the end user, as illustrated in the following screenshot:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_638_0.png)


    Figure 17.14 – Lost license error


    You can find a screenshot of how this error is presented to the end user here:'

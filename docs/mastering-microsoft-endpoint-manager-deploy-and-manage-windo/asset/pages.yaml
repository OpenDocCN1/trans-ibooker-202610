- pgno: 198
  md: '# # Deploying existing Windows devices into

    # Microsoft Endpoint Manager


    *This scenario applies to physical Windows endpoints only.*


    In enterprise companies today, the normal approach is to leverage OS deployment
    either from Microsoft Endpoint Manager Configuration Manager or Microsoft Deployment
    Toolkit.


    Microsoft Deployment Toolkit is simpler as it only requires access to a share,
    where the Windows 10 OS driver application is stored.


    Both Configuration Manager and Deployment Toolkit often require the device to
    be on-premises to join the corporate **Active Directory (AD)** and have access
    to the **Preboot eXecution Environment (PXE)** server to even getting started
    with OS deployment.


    Over the last few decades, enterprise companies have started to delete all the
    work that the OEM put into making a device run in the most optimal way with Windows
    10, drivers, and the combination of the settings that are needed on a brand-new
    device to perform in the best way possible. This was done by leveraging a *wipe
    and load* imaging concept, and only what the company approved to be installed
    on the devices would be installed. Normally, this would be an older version of
    Windows, older versions of drivers, and Microsoft Enterprise apps.


    If only it were possible to do this in a simpler way and from anywhere. With the
    outbreak of Covid-19 and almost everybody working from home, luckily, modern technology
    has allowed us to disconnect from physical locations and move to working from
    anywhere. This also includes provisioning a brand-new device to an end user''s
    home address without the end user needing to go to the office location and get
    the new device. This is possible today with modern provisioning, called **Windows
    Autopilot**. We will cover Windows Autopilot at a high level in this chapter,
    and in more depth and with real-life examples in the next chapter.


    Windows Autopilot is a group of different components of technology that come together
    into one service to configure new devices out of the box to get them ready for
    production usage. The cool thing about Autopilot is that you can also use it to
    reset, repurpose, and recover devices from scratch if you want to start over again.
    This is all done to release the IT department from doing all this work themselves;
    there''s no infrastructure to manage as Autopilot runs as a cloud service within
    Microsoft Endpoint Manager, so it''s simple and easy to get productive faster!'
  merge: -1
  img_proc: true
- pgno: 199

- pgno: 363
  md: 'When a user is doing an MDM sync, all new policies will be applied to the device
    and all existing policies will be verified that they have been applied.


    # Getting started with policy design


    When designing your strategy on policy management with Microsoft Intune, it is
    important to take the right approach. There are several policy types in Microsoft
    Intune. In the following list, you can see the different policy types and the
    order in which you should start creating policies:


    +   1. Configure the security baseline.

    +   2. Configure policy from the **Endpoint Security** blade.

    +   3. Configure policy from the **Settings** catalog.

    +   4. Configure the administrative template.

    +   5. Configure the device configuration.

    +   6. Leverage a custom policy as the last resort.


    Just remember that there are no rights and wrongs, but if you''re undertaking
    a migration from AD GPO to MDM settings management, it might be a good time to
    start afresh and see what you need to configure instead of taking your history
    of GPO setting in your on-premises environment with you. Sometimes, organizations
    do not even know why they implemented a specific policy setting back when they
    did. Perhaps the person responsible for implementing this policy setting is no
    longer even with the company and did not leave any documentation on why this setting
    was configured the way it was in the first place.


    As there is no conflict handling incorporated in the MDM stack, you may inadvertently
    create a conflict between two settings coming from two different policies to the
    same user or device.


    This can be from the same policy type or different policy types, so it is important
    to notice and monitor any conflicting policies.'
  merge: -1
  img_proc: true

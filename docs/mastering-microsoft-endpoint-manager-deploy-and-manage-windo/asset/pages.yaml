- pgno: 547
  md: 'This concludes the chapter on monitoring and Endpoint analytics. As we have
    shown, you will only benefit from enabling Endpoint analytics in your environment
    to get more insight into your Windows estate.


    # Summary


    In this chapter, you''ve learned about the different monitoring, analytics, and
    reporting capabilities within Microsoft Endpoint Manager. Endpoint analytics gives
    you great insights that you can react to, but remediation scripts have the option
    to detect issues before the end user notices and remediate them. This is the best
    way to keep your end users productive and keep support calls to a minimum. Endpoint
    analytics is part of the Microsoft Intune and Windows Enterprise license, at no
    additional cost; you should just enable it to start getting data on your devices,
    which includes information on app crashes and reasons for reboots, including a
    blue screen.


    In the next chapter, we''re going to explain to you how you can simplify your
    traditional printing environment with Microsoft Universal Print.


    # Questions


    +   1. Is it possible to measure the logon duration of your physical and cloud
    PCs?

    +      A. Yes

    +      B. No

    +   2. What does the service health dashboard show?

    +      A. The availability of the different Microsoft cloud services

    +      B. The SLA of the different Microsoft cloud services

    +      C. The downtime of the different Microsoft cloud services


    # Answers


    +   1. (A)

    +   2. (A)'

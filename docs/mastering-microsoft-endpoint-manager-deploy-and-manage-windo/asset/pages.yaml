- pgno: 178
  md: '# Blocking personal Windows devices


    If you block personally owned Windows devices from enrollment, Intune checks to
    make sure that each new Windows enrollment request has been authorized as a corporate
    enrollment. Unauthorized enrollments will be blocked.


    The following methods qualify as being authorized as a Windows corporate enrollment:


    +   - The enrolling user is using a device enrollment manager account.

    +   - The device enrolls through Windows Autopilot.

    +   - The device is registered with Windows Autopilot but isn''t an MDM enrollment-only
    option from Windows Settings.

    +   - The device''s IMEI number is listed in **Device enrollment | Corporate device
    identifiers**.

    +   - The device enrolls through a bulk provisioning package.

    +   - The device enrolls through a **Group Policy Object (GPO)**, or automatic
    enrollment from Configuration Manager for co-management.


    The following enrollments are marked as corporate by Intune. But since they don''t
    offer the Intune administrator per-device control, they''ll be blocked:


    +   - Automatic MDM enrollment with an Azure AD join during Windows setup*

    +   - Automatic MDM enrollment with an Azure AD join from Windows Settings*


    The following personal enrollment methods will also be blocked:


    +   - Automatic MDM enrollment with **Add Work Account** from Windows Settings*

    +   - The MDM enrollment-only option from Windows Settings


    *These won''t be blocked if registered with Autopilot.



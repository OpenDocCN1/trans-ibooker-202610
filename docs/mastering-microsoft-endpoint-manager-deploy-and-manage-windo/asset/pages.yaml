- pgno: 334
  md: 'Microsoft Teams follows its own update process and does not follow the update
    process of other Microsoft 365 apps.


    # # OneDrive


    OneDrive isn''t part of the Microsoft 365 app delivery process for the simple
    reason that OneDrive is mandatory for Windows 10 Enterprise and is therefore included
    in the OS following enrollment.


    OneDrive auto-updates based on either the **Insiders**, **Standard**, or **Deferred**
    ring cycle. OneDrive checks for available updates every 24 hours when it''s running
    as part of your endpoint.


    The production ring (which is the default) receives updates every 20 days, whereas
    the deferred ring gives you a bit more flexibility as it updates every 2–3 months.
    During this timeframe, customers can deploy updates on their own, allowing them
    to record precisely when their software is updated. When the number of days is
    exceeded, the update will apply automatically:


    > > **Important Note**

    > >

    > > Microsoft reserves the right to bypass the 60-day grace period for critical
    updates.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_334_0.png)


    *Figure 8.60 – OneDrive update schedule*


    You can put your OneDrive client inside the **Deferred** ring via designated OneDrive
    policies, which we will explain in the next chapter.


    When you want to force updates to your endpoint via Microsoft Endpoint Manager,
    you could send the following command to your endpoints to make this possible.
    The `restart` parameter performs a reboot of your Windows 10 Enterprise desktop:


    ```

    Execute C:\<location>\OneDriveSetup.exe /update /restart

    ```'
  merge: -1
  img_proc: true

    +   - MEM fundamentals: https://docs.microsoft.com/en-us/learn/paths/endpoint-manager-fundamentals/

    +   - Introduction to MEM: https://docs.microsoft.com/en-us/learn/modules/intro-to-endpoint-manager/'
  merge: -1

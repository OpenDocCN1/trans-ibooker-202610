- pgno: 75
  md: '# Introducing

    Windows 365


    In this chapter, you''ll learn everything you need to know about Windows 365 from
    a conceptual perspective.


    After reading this chapter, you''ll know more about the benefits of using Windows
    365 and the different service components. In the next chapter, you''ll learn how
    you can deploy it!


    This chapter is very comprehensive – we''ll go through the following topics:


    +   - What is Windows 365?

    +   - Microsoft Endpoint Configuration Manager support


    # What is Windows 365?


    Users want technology that is familiar, easy to use, and always available so they
    can work and create fluidly across devices. Cloud PCs make this possible by combining
    the power and security of the cloud with the familiarity of a PC. Only Microsoft
    can bring together a PC and the cloud with a consistent and integrated Windows
    experience. Windows 365 is the world''s first cloud PC. With Windows 365 Cloud
    PC, Windows evolves from a device-based OS to hybrid personalized computing.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'A Cloud PC is your personalized desktop, apps, settings, and content streamed
    securely from the cloud to your devices. Lowering the complexity level of your
    environment as you deploy and manage virtual endpoints in Microsoft Endpoint Manager,
    no additional **Virtual Desktop Infrastructure (VDI)** expertise or resources
    are needed.


    Windows 365 provides you with all the benefits of Windows, without any of the
    traditional hardware limitations as your desktops are running in the Azure cloud.


    You can find all the main principles of the service in the following list:


    +   - Deploy and manage virtual endpoints in Microsoft Endpoint Manager; no additional
    VDI expertise or resources needed.

    +   - Procure, provision, and deploy in minutes, with optional automated OS updates.

    +   - Access from anywhere to your personalized Windows desktop experience.

    +   - Tailor compute and configurations for an elastic workforce.

    +   - Pick up where you left off on the device of your choice.

    +   - Optimized experiences on Windows endpoints.

    +   - Scale confidently with per-user pricing.


    # Removing the complexity of traditional VDI deployments


    All the building blocks are automated for you, and the service scales with you
    in the most optimized way possible to use Microsoft 365 apps. It is Microsoft''s
    best expression of Windows and Microsoft 365 and is always secure and up to date.


    A Cloud PC can be accessed from anywhere from any device and can scale with a
    user''s changing compute needs, meaning that the user could receive the self-service
    privileges to release an IT admin from needing to assign a license that provides
    more compute resources. The same applies to storage upgrades and Cloud PC reboots
    – more about this later.


    # Why virtualize Windows in the cloud?


    For some of you, this might sound like common sense. However, if you don''t know
    that much about the benefits of using virtualized desktops running on the cloud,
    here''s a quick rundown:


    +   - **Mobility** – Users can access Cloud PC from any device, anywhere.

    +   - **Security** – Business data never leaves the cloud.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '+   - **Scalability** – Adjust to workforce fluctuations.

    +   - **Compatibility** – Old apps can run virtualized.

    +   - **Performance** – Apps remain close to the data.

    +   - **Management** – A single image for many users.

    +   - **Cost** – Utilize the flexibility of the cloud.


    # Removing complexity while increasing security


    Windows 365 removes complexity all around while also adding a higher security
    level to your endpoints. The service is fully supported by Microsoft Defender
    for Endpoints and zero-trust principles, with enhancements for Azure AD conditional
    access rules – securing your virtual desktops has never been easier to configure.


    # Low costs as a fixed-price model


    The other great benefits are the costs involved as this service could decrease
    the current cost of keeping your VDI environment up and running or any other use
    case, for example, remote workers connecting via an expensive, unreliable VPN
    connection. All the services are built using a subscription-based model that aligns
    with the CapEx needs of most businesses, too.


    The following comparison model perfectly shows the differences between traditional
    Remote Desktop Services (session-based) and VDI, and Azure Virtual Desktop and
    Windows 365:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_77_0.png)


    Figure 3.1 – Comparison between an on-premises and in-the-cloud environment'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Windows 365 is a fixed-price service with a personal desktop experience completely
    managed via Microsoft Endpoint Manager.


    # Comparing Windows 365 Enterprise and Business


    Windows 365 is available in two versions, one fully managed and configurable via
    Microsoft Endpoint Manager (mostly covered in this book), called **Windows 365
    Enterprise**, and one that is called **Windows 365 Business**, where you have
    to provide more services yourself, such as application delivery and management.


    Customers can purchase Windows 365 Business directly from the Microsoft 365 admin
    center portal, set up their account without a domain, and provision and manage
    their Cloud PCs directly from the Windows 365 home page online.


    No other Microsoft licenses are required – you can get started with just a credit
    card if you want. Windows 365 Business is intended for customers wanting to deploy
    Cloud PCs for 300 users or fewer across their organization.


    Windows 365 Business allows customers to start provisioning a Cloud PC directly
    after assigning the license to the user from the Microsoft 365 admin center. There
    is no IT admin interaction needed. The user will be able to access the Cloud PC
    and become productive in under an hour after the license has been assigned!


    In the following table, you can find the list of features available per product
    to make your decision easier in each scenario:


    |  | Windows 365 Business | Windows 365 Enterprise |

    |---|---|---|

    | Click to provision directly from the product page | ● |  |

    | "No-domain" set up | ● |  |

    | Self-serve troubleshooting – reset | ● |  |

    | "Cloud Save" (minimal Azure storage and potentially **OneDrive for Business
    (ODfB)**) | ● | ● |

    | Self-serve upgrades |  | ● |

    | **Universal Print (UP)** integration |  | ● |

    | Partner/programmatic enablement (Graph APIs, **Managed service providers (MSP)**
    tooling) |  | ● |

    | Custom images |  | ● |

    | Image management (store, replicate, deploy) |  | ● |'
  merge: -1
  img_proc: true

- pgno: 499
  md: '# # Microsoft Defender for Endpoint


    Microsoft Defender for Endpoint is Microsoft''s Enterprise endpoint security platform
    that was created to help businesses prevent, investigate, detect, and respond
    to threats. This serves to increase the level of security of your whole endpoint
    configuration.


    Microsoft Defender for Endpoint is a security solution that includes risk-based
    vulnerability management and assessment, attack surface reduction, behavioral-based
    and cloud-powered next-generation protection, **endpoint detection and response
    (EDR)**, automatic investigation and remediation, managed hunting services, rich
    APIs, and unified security management.


    # ## Integration with MEM


    MEM becomes more and more prominent for customers who are using Windows 365/Azure
    Virtual Desktop as it provides a unified way of configuring and maintaining your
    physical and virtual cloud endpoint as well as other devices such as mobile.


    Microsoft Defender for Endpoint integrates seamlessly into MEM. You only need
    to activate the Intune integration once during the initial setup and your reports
    will flow into MEM.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_499_0.png)


    Figure 13.45 – Microsoft Defender for Endpoint


    This concludes the overview on Microsoft Defender for Endpoint. Next, we will
    give you an overview of the security baselines.'
  merge: -1
  img_proc: true
- pgno: 500
  md: '# # Security baselines


    Security baselines are preconfigured groups of Windows settings that help you
    apply the security settings that are recommended by the relevant security teams.
    The baselines you deploy can be customized to enforce only the settings and values
    required by you.


    There are multiple security-related settings in Windows as well as for Microsoft
    Edge for your endpoints. Another great asset is the option to do versioning and
    filtering based on different OSes or scenarios that have to be stricter. You no
    longer have to use GPOs to ensure the security settings on your endpoints – just
    create a security baseline profile and you''re all set.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_500_0.png)


    Figure 13.46 – MDM security baselines


    This concludes this security baseline overview. Next, we will cover compliance
    policies.'
  merge: -1
  img_proc: true
- pgno: 501
  md: '# Compliance policies



  md: '# Multi-factor authentication and conditional access


    We recommend going to *Chapter 13, Identity and Security Management*, later in
    this book, to learn more about conditional access.


    Multi-factor authentication is enabled on your Azure AD tenant by default to ensure
    that hackers and other intruders stay out of your environment. Enabling this feature
    on Windows 365 will decrease the possibility of you being hacked by 99.9%. It
    also incorporates the benefits of simplifying your management layer as the top
    layer for your operations. Long story short, you should enable this!


    It''s also fairly easy to do. As per Windows 365, we have a cloud PC app that
    we can select in the **Conditional access** configuration menu. The steps are
    as follows:


    +   1. Start the configuration. Go to the **Conditional access** menu in the **Endpoint
    security** menu within Microsoft Endpoint Manager:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_128_0.png)


    Figure 4.39 – Conditional access'
  merge: -1
  img_proc: true
- pgno: 129
  md: '2. Create a new policy and enter a custom name for your Azure MFA policy. Once
    you''ve done this, you can go through all the layers in the wizard to activate
    the correct settings to trigger MFA''s secondary authentication:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_129_0.png)


    Figure 4.40 – Entering the name of your policy


    3. Select the list of users and/or AAD groups you wish to filter and activate
    MFA for. I am going to pick cloud PC users.


    > Important Note

    > When selecting All users, make sure to not lock yourself out! This policy will
    affect all of your users. We recommend applying a policy to a small set of users
    first to verify that it behaves as expected.'
  merge: -1
  img_proc: true

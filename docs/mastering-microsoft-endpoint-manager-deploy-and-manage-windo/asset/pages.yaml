- pgno: 582
  md: 'You''ve now finished configuring Universal Print and have become a real expert
    in printing to the cloud. This will make your life as an IT professional a lot
    easier while maintaining your printers in comparison with a traditional printing
    environment.


    # Summary


    In the chapter, you''ve learned about a new Microsoft 365 service called Universal
    Print, how to configure the service, and how to publish printers to your endpoints
    via Microsoft Endpoint Manager.


    In the next chapter, we''re going to talk about other managed devices that you
    can manage with Microsoft Endpoint Manager.


    # Questions


    +   1. What port needs to be open in the firewall in order to use Universal Print?

    +      A. TCP - 443

    +      B. TCP - 445

    +   2. Are print jobs with Universal Print sent to the cloud encrypted?

    +      A. Yes

    +      B. No

    +   3. Does Universal Print support zero-trust?

    +      A. Yes, all traffic goes over the internet over SSL.

    +      B. No.


    # Answers


    +   1. (A)

    +   2. (A)

    +   3. (A)'
  merge: -1
  img_proc: true

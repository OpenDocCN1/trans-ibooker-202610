- pgno: 351
  md: '# 9

    Understanding

    Policy Management


    In this chapter, you will learn about how policy management from Microsoft Intune
    is different from **Group Policy Object (GPO)** and the different policy options
    to customize and secure your Windows 10/11 Enterprise desktops in your environment.
    This chapter will be very broad in terms of content, but it will give you the
    basic information to understand how policy management works between Windows and
    Microsoft Intune.


    We have divided policy management into three chapters in this book; following
    this first one, *Chapter 10, Advanced Policy Management*, deals with advanced
    policy management with different scenarios, and *Chapter 11, Office Policy Management*,
    is about office policy management from the office cloud policy service.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'In this chapter, we''ll cover the following topics:


    +   - Policy management

    +   - What is a Content Security Policy (CSP) policy?

    +   - Windows Push Notification Services (WNS)

    +   - Getting started with policy design

    +   - Policy management within Microsoft Endpoint Manager

    +   - Migrating existing policies from Azure Directory (AD) – Group Policy management
    (preview)


    # Policy management


    Using Microsoft Endpoint Manager – Intune to manage your Windows 10/11 Enterprise
    desktops is all about standardizing and simplifying the management layer of your
    environment. As explained in the previous chapter, everything is centered around
    layering your configuration sets (and applications) separately for the guest OS
    to remove the need to create custom images that include these things from the
    get-go.


    Policy management within Microsoft Endpoint Manager – Intune makes it possible
    to configure the following options from within the Devices menu:


    +   - Compliance policies

    +   - Conditional access

    +   - Configuration profiles

    +   - Settings catalog

    +   - Scripts

    +   - Group policy analytics (preview)

    +   - Enrollment restrictions

    +   - Policy sets'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'Group policy management has been around for over 20 years and has been a way
    to configure the behavior of a group of users or computers in a domain. This is
    still possible with an on-premises domain today, but if you want to start modernizing
    your policy and settings management, you should start looking at Microsoft Intune
    and the feature set it provides for policy management. There are some disadvantages
    associated with using GPO, one of these being that it requires a line of sight
    to a domain controller. Another is that GPO is fire-and-forget, but what do we
    mean by this? A GPO is assigned to a specific group of users and devices, and
    they are applied when a device is connecting to a domain controller on a regular
    basis. There is no reporting back to the domain controller if the device received
    and applied the policy correctly, if no domain controller can be contacted, or
    if no new or changed policies are applied.


    Sometimes, due to misconfiguration, a Windows device can contact a domain controller
    far away on the internal network with very slow connectivity, which can result
    in very long boot and sign-in times. Many of these issues can be avoided with
    a pure cloud-joined and managed device.


    With COVID-19 hitting the world at the beginning of 2020, many companies were
    forced to have their employees work from home, something that many companies were
    not ready for. This also drove a new approach with MDM management of devices from
    the cloud. Microsoft Intune is a perfect match for this new way of working, as
    it just requires internet connectivity following the initial onboarding into Microsoft
    Intune.


    In this chapter, we will focus on pure cloud management of Azure Active Directory
    Windows 10 devices, but the same will also apply to hybrid domain-joined devices
    that are managed from Microsoft Intune, also in a co-managed state. One important
    thing to note here is that GPO and MDM settings management is on the identity
    layer, either users or devices, whereas co-management between Microsoft Intune
    and **System Center Configuration Manager (SCCM)** is on the management plane.


    First, we need to look back at traditional Windows management, where all Windows
    devices were on-premises in the office, in production, or with end users working
    at home with VPN. Modern policy management is still an option on those devices
    if they are hybrid-joined to Azure Active Directory. The best option moving forward
    with new devices is pure Azure Active Directory joined and onboarded with Windows
    Autopilot. What we are covering in this chapter covers both scenarios. This book
    is dedicated to cloud management, and certain scenarios do not apply to a hybrid-joined
    device, so you need to make some decisions to go to Azure AD-joined devices to
    get the best end user experience. Start small, start with a **Proof of Concept
    (POC)**, and showcase the benefits of modern policy management. A best practice
    approach is to block on-premises devices in your POC from getting GPOs from the
    local Active Directory; otherwise, you can end up in a situation where you are
    not 100% sure where the settings are being applied from.'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'A **Configuration Service Provider (CSP)** is an interface for reading, setting,
    modifying, or deleting configuration settings on the device. These settings map
    to registry keys or files. Some CSPs support WAP format, some support SyncML,
    and some support both. SyncML is only used over the air for **Open Mobile Alliance
    Device Management (OMA DM)**. On the other hand, WAP can be used over the air
    for OMA client provisioning, or it can be included in the phone image as a `.provxml`
    file that is installed during boot.


    # What is a CSP policy?


    Some policies can only be configured at the device level, whereas other policies
    can be configured at the user level. This means that device-level policies will
    have an effect independent of the user logging into the device, whereas user-level
    policies will have an effect depending on the user logging into the device.


    User scope is where the policy only applies to the user who logs into the device,
    and the policy can vary depending on who is logging on to the device. The following
    is an example of what the CSP tree looks like when configuring a user policy:


    +   - `./User/Vendor/MSFT/Policy/Config/AreaName/PolicyName` to configure the
    policy

    +   - `./User/Vendor/MSFT/Policy/Result/AreaName/PolicyName` to get the result


    Device scope is where the policy only applies to the device itself, regardless
    of the user who logs into the device. The following is an example of what the
    CSP tree looks like when configuring a device policy:


    +   - `./Device/Vendor/MSFT/Policy/Config/AreaName/PolicyName` to configure the
    policy

    +   - `./Device/Vendor/MSFT/Policy/Result/AreaName/PolicyName` to get the result


    The biggest difference between a GPO and a CSP policy is that a CSP policy has
    a result channel as well, so every setting that is being configured in the device
    will report back to the MDM system – in this case, Microsoft Intune.


    If we take a closer look at the policy structure, it looks like the Windows registry
    is arranged in a tree structure:'
  merge: -1
  img_proc: true
- pgno: 355
  md: '![](img/a3e9f26159d3739e434fe676b2987c1d_355_0.png)


    By using ADMXInstall, you can add ADMX-backed policies for those Win32 or Desktop
    Bridge apps that have been added between OS releases. ADMX-backed policies are
    ingested in your device by using the CSP policy URI: `./Vendor/MSFT/Policy/ConfigOperations/ADMXInstall`.


    The OMA-URI string needs to go into the CSP policy URI:


    +   - `./Vendor/MSFT/Policy/ConfigOperations/ADMXInstall/Applicationname/Policy/ADMXFileName`.

    +   - `./Vendor/MSFT/Policy/Config/` remains the same for all machine policies
    that you are deploying to the device.'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'Applicationname and ADMXFileName are user-defined. In this case, Applicationname
    is App1, and you can use the same name as ADMXFileName. Just remember that ADMXFileName
    needs to be unique, which means you cannot deploy two ADMX files with the same
    name on a device.


    Here is the content of the ADMX file in my case – this could also have been Google
    Chrome, Microsoft Office, Internet Explorer, or others:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_356_0.png)


    Figure 9.2 – Registry entry for AdmxInstalled


    Then, if you take a closer look at the registry, the first place where they are
    written is HKLM\SOFTWARE\MICROSOFT\PolicyManager\AdmxInstalled.


    The policy is always declared under a GUID and with the name you gave the policy
    in Microsoft Intune when you created the policy.


    Then, you will be able to see the naming of the policy category that you are using
    when creating a policy setting:


    ```

    HKLM\Software\Microsoft\PolicyManager\AdmxDefault

    ```


    If the policy is a device policy, you will be able to see the direct results that
    apply to the devices in the following location: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\PolicyManager\current\device.


    In the end, all a policy does on a Windows device is set some registry keys, and
    it is the same with MDM policies. All the policy settings go here: HKEY_LOCAL_MACHINE\SOFTWARE\Policies\.'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'MDM policies are applied when a device syncs, either from Microsoft Intune
    or as part of the 8-hour schedule when a Windows device is running with MDM sync
    on.



    # Enrollment Status Page (ESP)


    Many think that ESP and Windows Autopilot are one and the same. That is not necessarily
    the whole truth as ESP is a core Windows function and can be set as a Windows
    CSP.


    ESP can be used as part of any Windows Autopilot provisioning scenario. It can
    also be used separately from Windows Autopilot as part of the default OOBE for
    AAD join, as well as for any new users signing in to the device for the first
    time.


    Basically, what that means is that any Windows 10 devices that join AAD in the
    OOBE phase will have the ESP shown to the end user, irrespective of whether it
    is a Windows Autopilot device, as long as there is an ESP assigned to the user
    or device.


    You can create multiple ESP profiles with different configurations that specify
    the following:


    +   - Showing the installation progress

    +   - Blocking access until the provisioning process is complete

    +   - Time limits

    +   - Allowed troubleshooting operations


    We will show you how to do this in this section and, in a later section, with
    a Windows Autopilot kiosk scenario.'
  merge: -1
  img_proc: true
- pgno: 262
  md: "# ESP implementation Windows CSP\n\nESP uses the `EnrollmentStatusTracking`\
    \ **Configuration Service Provider (CSP)** and the `FirstSyncStatus` CSP to track\
    \ the installation of different apps:\n\n+   - The `EnrollmentStatusTracking`\
    \ CSP: `/Vendor/MSFT/EnrollmentStatusTracking`.\n+   \n+   - The `EnrollmentStatusTracking`\
    \ CSP: Windows Client Management | Microsoft Docs (`https://docs.microsoft.com/en-us/windows/client-management/mdm/enrollmentstatustracking-csp`).\n\
    +   \n+   - The `EnrollmentStatusTracking` CSP is supported in Windows 10 version\
    \ 1903 and later.\n+   \n+   - The `EnrollmentStatusTracking` CSP is used to track\
    \ the installation of the Microsoft Intune Management extension and Microsoft\
    \ Intune Win32 apps that are target devices and/or users that are blocked by the\
    \ ESP.\n+   \n+   - The `FirstSyncStatus` CSP: `/Vendor/MSFT/DMClient/Provider/ProviderID/FirstSyncStatus`.\n\
    +   \n+   - The DMClient CSP – Windows Client Management | Microsoft Docs (`https://docs.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp`).\n\
    +   \n+   - The `FirstSyncStatus` CSP is supported in Windows 10 version 1709\
    \ and later.\n+   \n+   - The `FirstSyncStatus` CSP is responsible for delivering\
    \ the ESP CSP payload from Microsoft Intune to the Windows 10 client. The payload\
    \ includes ESP settings such as the timeout period and applications that are required\
    \ to be installed. It also delivers the expected MSI (line-of-business) applications,\
    \ Microsoft Store for Business apps, Wi-Fi profiles, and SCEP certificate profiles,\
    \ as well as policies for Microsoft Edge, assigned access, and Kiosk Browser.\n\
    \nWe will look at the steps to create an ESP as follows:\n\n+   1. Create the\
    \ first ESP by starting the Microsoft Endpoint Manager admin center, `https://endpoint.microsoft.com/`,\
    \ and choose **Devices | Windows | Windows enrollment | Enrollment Status Page**.\n\
    +   2. Choose a profile under **Settings**.\n+   3. Choose **Yes** for **Show\
    \ app and profile installation progress**.\n+   4. Choose **Yes** for **Block\
    \ device use until all apps and profiles are installed**.\n+   5. Choose **Selected**\
    \ for **Block device use until these required apps are installed if they're assigned\
    \ to the user/device**."
  merge: -1
  img_proc: true

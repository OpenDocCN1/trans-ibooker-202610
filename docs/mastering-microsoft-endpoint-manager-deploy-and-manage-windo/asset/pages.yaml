- pgno: 461
  md: '![](img/a3e9f26159d3739e434fe676b2987c1d_461_0.png)


    Figure 12.14 – OneDrive + ESR + Edge


    # Migrating from legacy to modern profile management


    All the sections in this chapter explained how you could modernize your profile
    management configuration as part of your physical or cloud endpoint.


    The ease of configuring everything also applies to the migration paths from any
    other profile management solution, whether that''s roaming profiles or any other
    solution on the market.


    The steps to perform on your legacy environment before migrating are as follows:


    +   1. If you are working on a roaming profile, the only thing you must do is
    activate OneDrive PC folder backup (KFM) and ESR, and make sure that Edge and
    OneDrive silent configuration is turned on.'

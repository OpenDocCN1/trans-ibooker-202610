- pgno: 294
  md: '# Application delivery via Microsoft Endpoint Manager


    We’ve been explaining the benefits of using a modern unified endpoint management
    solution from the same management experience. Of course, the same benefits apply
    for delivering applications to your endpoints, whether they’re running Windows
    10 Enterprise on a virtual cloud or physical endpoints via Microsoft Endpoint
    Manager.


    Another important layer is security. Normally, installing apps would require installation
    rights, for example, local administrator permissions on your Windows 10 Enterprise
    endpoint. Delivering your app via Microsoft Endpoint Manager allows you to assign
    and install apps – in a modular fashion – without the need to make the user a
    local administrator.


    Adding applications modularly (separately) from the image would also drastically
    simplify your image maintenance process. For example, within a legacy virtual
    desktop infrastructure, you would have created a so-called master image. This
    is not required with Microsoft Endpoint Manager – Intune as all applications can
    be managed separately from the OS image layer. After you enroll your Windows 10
    Enterprise images, all your assigned applications are added automatically based
    on user, group, or device filtering. Sounds pretty cool, right?


    To start delivering apps, you must go to the **Apps** menu in Microsoft Endpoint
    Manager. You begin your journey of configuring and assigning the application to
    your users or devices. It’s easy, and different application formats are supported,
    explanations for which you will find in this chapter of the book.


    # Different application types you can deploy


    Delivering applications to your end users, whether they are working primarily
    on a physical or virtual cloud desktop, is a very important factor for enterprises.


    Most enterprises have been doing this for years with SMS, ConfigMgr, and **Microsoft
    Endpoint Configuration Manager (MECM)** (to their on-premises infrastructure).
    Within Microsoft Endpoint Manager – Intune, the process is easier as the backend
    infrastructure is pre-built to start deploying apps almost immediately!'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'So, what format of apps are supported as delivery types for each OS? Let''s
    give you a complete rundown so that you can decide what is the best approach for
    your business.


    When you create a new app in Microsoft Intune, you start by selecting an app type
    that is appropriate for the app you want to deliver to your devices:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_295_0.png)


    Figure 8.1 – Select app type


    Supported Windows 10 app delivery types are covered in more detail in the following
    sub-sections.'
  merge: -1
  img_proc: true
- pgno: 296
  md: "# # LOB applications\n\nWithin Intune, you can deploy different formats in\
    \ different methods. The supported formats are modern apps, such as **Universal\
    \ Windows Platform (UWP)** apps and **Windows App Packages (AppX)**, as well as\
    \ more classic formats such as Win32 apps, including simple **Microsoft Installer\
    \ (MSI)** package files.\n\n# ## .MSI – via the LOB app\n\nMSI format installers\
    \ are supported by both the LOB and the Windows app (Win32) options within Intune,\
    \ with the latter more enhanced for app dependencies.\n\n# ## MSIX – via the LOB\
    \ app\n\nMSIX is Microsoft's new Windows app package format that provides a modern\
    \ packaging experience to all Windows apps. The MSIX package format preserves\
    \ the functionality of existing app packages and/or install files in addition\
    \ to enabling new, modern packaging and deployment features to Win32, WPF, and\
    \ Windows Forms apps. We'll go more deeply into MSIX later on in the book.\n\n\
    MSIX combines the best features of MSI, .appx, and App-V.\n\n# ## AppX – via the\
    \ LOB app\n\nThe AppX application distribution file format was first introduced\
    \ with Microsoft Windows 8. Also known as modern (UWP) apps, files with an AppX\
    \ extension added are directly ready for distribution and installation.\n\nWithin\
    \ the Windows Store as part of Windows 10 Enterprise, apps are automatically distributed\
    \ in the AppX – UWP format.\n\nAppX is very beneficial for distributing applications\
    \ supported for multiple devices, including PCs, tablets, and smartphones that\
    \ run on Windows.\n\n> **Important Note**\n> \n> When you use Autopilot, we recommend\
    \ that you do not mix LOB apps with the Windows 32 app (Win32) as a delivery option\
    \ – you can find more information about this in *Chapter 7, Manager Windows Autopilot*."
  merge: -1
  img_proc: true

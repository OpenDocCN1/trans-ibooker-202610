    # On-premises connections


    An on-premises network connection is needed to connect to your own data center
    environment. This could be to your own Azure Virtual Network only, but also to
    your co-location or other private/hybrid cloud environment. Most likely, you are
    going to install line-of-business applications on top of your Cloud PCs that require
    a connection to the database or application server that still resides on-premises.


    To connect to your on-premises location, you need to have a site-to-site VPN or
    ExpressRoute (more reliable) to your on-premises network. When you are an enterprise
    with multiple network locations, you can easily add more by clicking on + Create
    connection, as shown in the screenshot that follows.


    The following screenshot is an example of a successful on-premises network connection
    that is checked and defined as successful by our Watchdog service:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_85_0.png)


    Figure 3.7 – Create an on-premises network connection'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'More in-depth information about this and how you can configure it can be found
    later, in Chapter 4, Deploying Windows 365.


    # Provisioning policies


    A provisioning policy is what the name suggests – a policy to provision your Cloud
    PCs. The policy must be configured after you have configured the on-premises connection
    as this is one of the requirements to move forward.


    The provisioning policy includes the baseline configuration of your Cloud PC,
    such as the image version of Windows 10 Enterprise or Windows 11, the on-premises
    connection (location), and the Azure AD group that includes the users that should
    receive this baseline configuration.


    Once the provisioning policy is done, it will show up under the Provisioning policies
    menu. You can have multiple policies per either department or location as this
    would be the most common reason for enterprises to split them into different provisioning
    policies:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_86_0.png)


    Figure 3.8 – Provisioning policies


    Now the information you need to know about provisioning policies has been explained,
    we will take a deeper dive into the images that are supported as part of the provisioning
    policy.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Windows 365 – gallery images


    As written in the previous section, the image selection option is part of the
    provisioning policy. There''s also the option to select a gallery image running
    Windows 10 or 11 with pre-baked images per workload type.


    For example, the images for our second license size 2vCPU/4 GB/64 GB and higher
    include Microsoft 365 apps and Teams AV optimizations out of the box, whereas
    the 1vCPU/2 GB/64 GB Lite image offers an optimized OS experience for that specific
    workload type to get the best experience possible, as we removed different built-in
    services from inside the image that you won''t need for the type of workloads
    supported:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_87_0.png)


    Figure 3.9 – Selecting Windows 365 images


    Now, we''ve explained how you could use the preferred route in selecting images
    for Windows 365 Cloud PCs. In the next section, we explain how you can use custom
    images.


    # Custom images


    Some customers prefer to use their own pre-built custom images, also known as
    golden images. This approach is also supported within Windows 365 as an option
    to select during the provisioning policy configuration wizard.


    Supported custom image services are as follows:


    +   - Azure managed image

    +   - Share image gallery'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'The customer is free to pick whatever solution fits their needs best, as we
    support both Windows 10 and 11. Some customers prefer the more modern management
    approach, meaning a baseline image with the latest Windows updates and baseline
    apps and the rest will be added via Microsoft Intune – app delivery profiles:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_88_0.png)


    Figure 3.10 – Adding a custom image


    Later in the chapter, we are going to explain how you can create your own custom
    image to use as a baseline in Windows 365 too.


    # Roles and delegation


    Windows 365 offers capabilities to delegate access features and functionalities
    on top of existing Intune roles within Microsoft Endpoint Manager. For example,
    you want to give helpdesk employees read-only access to the Windows 365 portal
    to check whether the Cloud PC is unavailable or not. Other examples include the
    separation of security-related settings as part of your security policies. Let
    me explain all the roles in more depth in the following table:'
  merge: -1
  img_proc: true
- pgno: 89
  md: '| Role | In | Can do |

    |---|---|---|

    | Application manager | Windows 365 Enterprise Cloud PC | Intune Application Managers
    can manage applications, read device information, and view device configuration
    profiles. |

    | Cloud PC Administrator | Windows 365 Enterprise Cloud PC | Cloud PC Administrators
    can take read and write actions in the Cloud PC L2 node in MEM. |

    | Cloud PC Reader | Windows 365 Enterprise Cloud PC | Cloud PC Readers can take
    read actions in the Cloud PC L2 node in MEM. |

    | Endpoint Security Manager | Windows 365 Enterprise Cloud PC | Intune Endpoint
    Security Managers can manage security and compliance features such as security
    baselines, device compliance, Conditional Access, and Microsoft Defender for Endpoint
    for their Cloud PCs. |

    | Help Desk Operator | Windows 365 Enterprise Cloud PC | Intune Help Desk Operators
    can perform remote tasks on Cloud PCs and assign applications or policies to the
    devices. |

    | Intune administrator role | Windows 365 Enterprise Cloud PC | Intune administrator
    role can assign Intune roles (built-in and custom) to other administrators but
    cannot assign Cloud PC roles. |

    | Policy and Profile Manager | Windows 365 Enterprise Cloud PC | Intune Policy
    and Profile Managers can manage compliance policy, configuration profiles, corporate
    device identifiers, and security baselines for Cloud PCs. |

    | Read Only Operator | Windows 365 Enterprise Cloud PC | Intune Read Only Operators
    have read-only access to all Intune nodes including the Cloud PC node. |

    | School Administrator | Windows 365 Enterprise Cloud PC | Intune School Administrators

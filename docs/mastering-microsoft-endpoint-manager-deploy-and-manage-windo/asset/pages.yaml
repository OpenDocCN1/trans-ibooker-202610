- pgno: 21
  md: '# Preface


    One of the main reasons for the slow adoption of Modern Workplace solutions designed
    to simplify the management layer of your environment is the lack of understanding
    and knowledge of the product. With this book, you''ll learn everything you need
    to know to make the shift to the Modern Workplace, running Windows 10, Windows
    11, or Windows 365.


    *Mastering Microsoft Endpoint Manager* explains various concepts in detail to
    give you the clarity to plan how to use **Microsoft Endpoint Manager (MEM)** and
    eliminate potential migration challenges beforehand. You''ll get to grips with
    using new services such as Windows 365 Cloud PC, Windows Autopilot, profile management,
    monitoring and analytics, Universal Print, and much more. The book will take you
    through the latest features and new Microsoft cloud services to help you to get
    to grips with the fundamentals of MEM and understand which services you can manage.
    Whether you are talking about physical or cloud endpoints it''s all covered.


    By the end of the book, you''ll be able to set up MEM and use it to run Windows
    10, Windows 11, and Windows 365 efficiently.


    What you will learn:


    +   - Simplify the deployment of Windows in the cloud with Windows 365 Cloud PC.

    +   - Configure advanced policy management within MEM.

    +   - Discover modern profile management and migration options for physical and
    cloud PCs.

    +   - Harden security with baseline settings and other security best practices.

    +   - Find troubleshooting tips and tricks for MEM, Windows 365 Cloud PC, and
    more.

    +   - Discover deployment best practices for physical and cloud-managed endpoints.

    +   - Keep up with the Microsoft community and discover a list of MVPs to follow.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Who this book is for


    If you are an IT professional, enterprise mobility administrator, architect, or
    consultant looking to learn about managing Windows on both physical and cloud
    endpoints for remote working via MEM, this book is for you.


    # What this book covers


    *Chapter 1, Introduction to Microsoft 365,* teaches you about keeping your resources
    secure while leveraging other services within Microsoft 365''s broader product
    suite. Understanding the fundamentals of a product is the most important factor
    for a successful deployment.


    *Chapter 2, What Is Unified Endpoint Management?,* acknowledges how the basics
    of modern management are sometimes complicated to understand, and so you will
    learn about the concept of modern management and zero trust with MEM (Intune),
    the history, and the architectural concept to get a clear understanding of how
    all the devices from physical, virtual, and mobile all come together in one management
    console.


    *Chapter 3, Introducing Windows 365,* teaches you everything to get started with
    this new Microsoft cloud service that simplifies deployment as well as your cloud
    PC maintenance with MEM.


    *Chapter 4, Deploying Windows 365,* teaches you everything you need to know about
    how to deploy Windows 365, what the requirements are, and tips and tricks.


    *Chapter 5, Requirements for Microsoft Endpoint Manager,* provides a clear understanding
    of the different requirements for MEM, from OS versions and URL firewall allow-listing
    to the required licenses and privileges.


    *Chapter 6, Windows Deployment and Management,* teaches you about deploying Windows
    10 Enterprise with MEM – Intune.


    *Chapter 7, Manager Windows Autopilot,* teaches you how and when to use Autopilot
    to enroll Windows 10 on your physical endpoint devices. What are the recommended
    approaches and decisions to make beforehand? You will get to know all of this
    in this chapter.


    *Chapter 8, Application Management and Delivery,* teaches best practices to deploy
    and manage your Microsoft 365 and line-of-business applications on your Windows
    10 endpoints.


    *Chapter 9, Understanding Policy Management,* teaches you about the different
    policy types, what modern policy management means, and how it works on Windows
    10/11 clients compared to Group Policy.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Chapter 10, Advanced Policy Management, teaches you about the different policy
    options to customize and secure your Windows 10 Enterprise desktops in your environment.


    Chapter 11, Office Policy Management, teaches you about the different policy options
    to customize and secure your Windows 10 Enterprise desktops in your environment.


    Chapter 12, User Profile Management, discusses how profile management is a very
    important factor to ensure a good user experience. You will learn about the different
    Windows profile types and differences in services to offer similar experiences
    on different endpoint devices, for example, physical and cloud endpoints with
    Enterprise State Roaming and Microsoft Edge.


    Chapter 13, Identity and Security Management, teaches you how to configure Azure
    Active Directory in the most secure way possible for your end users and IT department.
    You will learn what the different options to enable Azure MFA are, about BitLocker,
    and how to configure Microsoft Defender for Endpoint with end-to-end security-level
    integration in MEM – Intune.


    Chapter 14, Monitoring and Endpoint Analytics, looks at how, after deploying your
    desktops, it''s important to ensure the performance, logon duration segmentation,
    and quality level of Windows and applications. You will learn in this chapter
    how you can achieve this with Endpoint Analytics, Productivity Score, and other
    monitoring capabilities of MEM.


    Chapter 15, Universal Print, looks at Universal Print and how, despite businesses
    doing more and more things in a digital way, printing on physical paper remains
    important. Universal Print is a relatively new platform service on Azure that
    can simplify the whole printing configuration and maintenance process compared
    to a traditional print server environment.


    Chapter 16, Troubleshooting Microsoft Endpoint Manager, teaches the most common
    causes and fixes of deploying Windows 10 Enterprise and other tips and tricks
    to unblock deployments to go smoothly. Both writers have over 2 decades of field
    experience in deploying Windows in many forms that they will share in this section.


    Chapter 17, Troubleshooting Windows 365, teaches you about all the different troubleshooting
    errors of Windows 365 Cloud PC to prepare you to respond proactively to any errors
    that could occur while deploying cloud PCs in your environment.


    Chapter 18, Community Help, shares, as the writers have a strong community background,
    some of the best community blogs out there; some are written by beginners, while
    some are by Microsoft MVPs.'
  merge: -1
  img_proc: true

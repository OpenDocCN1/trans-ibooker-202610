- pgno: 453
  md: 'In the next section, we explain how Outlook signatures can be synced to the
    cloud.


    # Outlook''s signature cloud settings


    Another cool new enhancement provided by Office''s roaming feature is the ability
    to store your Outlook settings on the cloud as part of your Azure AD/Office 365
    account. We explained in the previous section the different Office services, such
    as most recently used files, and the other components that are saved.


    One of the Outlook settings that has been a challenge for a while is Outlook signatures.
    This has now been fixed as signature settings are stored in the cloud, so your
    experience is consistent when you access Outlook for Windows on any computer.


    To enable this feature, you simply open the **Outlook Options** menu, followed
    by choosing **General**. On this pane, you check the box next to **Store my Outlook
    settings in the cloud**.


    Your Outlook signature will now follow you, even after a local profile reset,
    which is pretty cool, right?


    ![](img/a3e9f26159d3739e434fe676b2987c1d_453_0.png)


    Figure 12.4 – Outlook''s cloud storage options'
  merge: -1
  img_proc: true
- pgno: 454
  md: 'In the next section, you will learn about OneDrive for Business **Known Folder
    Move (KFM)**.


    # OneDrive for Business Known Folder Move


    OneDrive for Business KFM is a simple way to back up your important folders (the
    **Desktop**, **Documents**, and **Pictures** folders) within your virtual Windows
    365 PC, so they''re protected and available on other devices without any user
    interaction required.


    OneDrive PC folder backup is **enabled by default on Windows 365** and is therefore
    an easy way to continue your work on other devices, such as your physical endpoint
    or mobile device, as all the folders will instantly become available on those
    devices too.


    With OneDrive Files On-Demand enabled by default, the storage allocation within
    your Cloud PC profile will also be low, as this feature within OneDrive gives
    you access to your files without taking up storage space on your computer.


    As part of Windows 365, OneDrive is silently configured, and PC folder backup
    (KFM) is also activated by default to ensure your data for business continuity
    and disaster recovery purposes with your Windows 10/11 Enterprise desktop environment.


    You can find the OneDrive KFM setting in the OneDrive client installed on your
    Windows device to sync your **Desktop**, **Documents**, and **Pictures** folders
    to the OneDrive cloud, as follows:


    # Manage folder backup


    These folders are syncing in OneDrive. New and existing files will be added to
    OneDrive, backed up, and available on your other devices, even if you lose this
    PC.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_454_0.png)


    Space left in OneDrive after selection: 4,639 GB


    Figure 12.5 – OneDrive KFM'
  merge: -1
  img_proc: true

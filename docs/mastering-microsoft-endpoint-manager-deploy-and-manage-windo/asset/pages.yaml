    # Self-Deploying (preview)


    Self-deploying mode does not presently associate a user with the device (since
    no user ID or password is specified as part of the process).


    Self-deploying mode uses a device''s TPM 2.0 hardware to authenticate the device
    in an organization''s AAD tenant. Therefore, devices without TPM 2.0 can''t be
    used with this mode. Devices must also support TPM device attestation. This Windows
    Autopilot scenario will require a device with a physical TPM, so a virtual device
    will not work.


    To achieve a 100% zero-touch onboarding experience, an Ethernet connection is
    required; otherwise, the device will prompt you for a region and keyboard layout.'

- pgno: 211
  md: "# # Types of updates managed by Windows Update for Business\n\nWindows Update\
    \ for Business is designed to provide IT admins with the capability to manage\
    \ policies for several types of updates to Windows 10 devices:\n\n+   - **Feature\
    \ updates:** Previously referred to as **upgrades**, feature updates contain significant\
    \ feature additions and changes along with security and quality revisions. Feature\
    \ updates are released semi-annually in the fall (H1) and the spring (H2).\n+\
    \   \n+   - **Quality updates:** Quality updates are traditional OS updates, typically\
    \ released on the second Tuesday of each month, though they can be released at\
    \ any time of the month. These include driver, security, and critical updates.\n\
    +   \n+   - **Driver updates:** Updates for non-Microsoft drivers that are relevant\
    \ to your devices. Driver updates are on by default, but you can use Windows Update\
    \ for Business policies to turn them off if you prefer.\n+   \n+   - **Microsoft\
    \ product updates:** Windows Update for Business also treats non-Windows updates\
    \ (such as updates for Microsoft Office, .NET, or Visual Studio) as quality updates.\
    \ These non-Windows updates are known as **Microsoft updates** and you can set\
    \ devices to receive such updates (or not) along with their Windows updates.\n\
    \nBut first, how do Windows updates work? There are four phases to the Windows\
    \ update process:\n\n+   1. **Scan:** A device checks the Microsoft update server\
    \ or your **Windows Server Update Services (WSUS)** endpoint at random intervals\
    \ to see whether any updates have been added since the last time updates were\
    \ searched, and then evaluates whether the update is appropriate by checking the\
    \ guidelines (for example, group policies) that have been set up by the administrator.\
    \ This process is invisible to the user.\n+   \n+   2. **Download:** Once the\
    \ device determines that an update is available, it begins downloading the update.\
    \ The download process is not visible to the user. The download happens in multiple\
    \ sequential phases with feature updates.\n+   \n+   3. **Install:** After the\
    \ update is downloaded, depending on the device's Windows Update settings, the\
    \ update is installed on the system.\n+   \n+   4. **Commit and restart:** Once\
    \ installed, the device usually (but not always) must be restarted in order to\
    \ complete the installation and begin using the update. Before that phase, a device\
    \ runs the previous version of the software.\n\nAt each stage of the process,\
    \ there are opportunities to increase the velocity via policies and settings,\
    \ and our recommendations follow."
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Enforcing compliance deadlines for updates


    Deploying feature or quality updates for many organizations is only part of the
    equation for managing their device ecosystem. The next important part is the ability
    to enforce update compliance. Windows Update for Business provides controls to
    manage deadlines for when devices should migrate to newer versions.


    # How to handle conflicting or legacy policies


    We sometimes find that administrators set devices to get both Group Policy settings
    and MDM settings from an MDM server such as Microsoft Intune. Depending on how
    they are ultimately set up, policy conflicts are handled differently:


    +   - **Windows updates**: Group Policy settings take precedence over MDM.

    +   - **Microsoft Intune**: If you set different values for the same policy on
    two different groups, you will receive an alert and neither policy will be set
    until the conflict is resolved.


    It is crucial that you disable conflicting policies for devices in your organization
    to update as expected. For example, if a device is not reacting to your MDM policy
    changes, check to see whether a similar policy is set via Group Policy with a
    differing value.


    If you find that the velocity is not as high as you expect or some devices are
    slower than others, it may be time to clear all policies and settings and specify
    only the recommended update policies outlined in this document.


    # How to set up and configure Windows Update for Business


    Microsoft Intune provides two policy types to manage Windows Update for Business:


    +   - **Windows 10 update ring**: This policy is a collection of settings that
    configures when Windows 10 updates get installed. Windows 10 update ring policies
    have been supported since Windows 10 version 1607, so it is not something completely
    new.

    +   - **Windows 10 feature updates**: This policy updates devices to the Windows
    version you specify, and then freezes the feature set version on those devices.
    This version freeze remains in place until you choose to update them to a later
    Windows version. While the feature version remains static, devices can continue
    to install quality and security updates that are available for their feature version.
    Windows 10 feature update policies are supported for devices that run Windows
    10 version 1709 or later.'
  merge: -1
  img_proc: true

    # Security Reader


    Users with this role have global read-only access to security-related features,
    including all information in the Microsoft 365 security center, Azure AD, Privileged
    Identity Management, Identity Protection, and Microsoft 365 Compliance Center,
    as well as the ability to read Azure AD sign-in reports and audit logs.


    Users in this role can view user, device, enrollment, configuration, and application
    information. However, they cannot make changes to Intune.


    # Identity roles and privileges for a Windows 365 cloud PC


    In order to use a Windows 365 cloud PC, your Azure AD configuration should be
    hybrid Azure AD-joined (HAADJ) to enroll your cloud PCs into Intune.


    # Azure Subscription Owner


    Users with this role have global access to all resources in the Azure subscription.
    These rights are needed for the initial setup of Windows 365.


    This role grants users full access to manage all resources, including the ability
    to assign roles in Azure RBAC.


    # Intune Administrator


    Users with this role have global permissions within Microsoft Intune.


    The Intune Administrator role contains the ability to manage users and devices
    in order to associate policies, as well as creating and managing all security
    groups in Azure AD.


    > Important Note

    > Intune Administrator does not have admin rights over Office groups.'

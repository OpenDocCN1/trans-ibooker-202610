- pgno: 203
  md: 'Once you have deployed Windows Autopilot, it is important that your organization
    keeps up to date with the latest Windows releases. Many companies refer to this
    as *being evergreen*. To help your organization stay current, you should look
    into Windows Update for Business.


    # What about existing infrastructures?


    We talked about the broader unified endpoint management concept of Microsoft Endpoint
    Manager in the first two chapters, explaining that you could manage and maintain
    all your devices from one single unified dashboard console.


    We do recognize that not all customers are moving directly to Microsoft Endpoint
    Manager in an AAD-managed manner. Therefore, co-managing existing on-premises
    Windows 10 devices and hybrid AAD-joined devices is supported too within Microsoft
    Endpoint Manager. This would create the same unified endpoint management experience
    for your hybrid configuration.


    # Co-management and tenant attach


    Co-management is not a new feature, as it has been around for a while. Co-management
    makes it possible to move workloads from Configuration Manager (formerly **System
    Center Configuration Manager (SCCM)**) to Microsoft Endpoint Manager''s Intune.
    It tells the Windows 10 clients that are managed by Configuration Manager who
    the management authority is for different workloads and also allows you to see
    and manage them from the Microsoft Endpoint Manager console. To make it simple,
    a co-managed device is managed by both Configuration Manager and Microsoft Endpoint
    Manager at the same time.


    Tenant attach is a bit different and limited in terms of management capabilities
    as tenant attach makes it possible to only add your Configuration Manager environment
    to Microsoft Endpoint Manager, meaning you can leverage the capabilities available
    in Microsoft Endpoint Manager. Tenant attach allows you to perform actions on
    your Configuration Manager-managed clients using the MEM portal, such as installing
    apps, running scripts, and so on.


    For example, with co-management, your existing Windows 10 Enterprise endpoints
    manager through Configuration Manager mainly listens to Configuration Manager
    for app deployment and security policies, while it looks at Intune for compliance
    policies and device configuration policies. This helps businesses to combine the
    benefits of both Configuration Manager and Microsoft Endpoint Manager without
    making an impactful cutover directly to Microsoft Endpoint Manager.'
  merge: -1
  img_proc: true

  md: 'The following table explains the differences between the different endpoints
    that are supported for Windows 365 at the time of writing:


    |  | Windows Desktop | Store client | Android | iOS/iPadOS | macOS | Web |

    |---|---|---|---|---|---|---|

    | Keyboard | X | X | X | X | X | X |

    | Mouse | X | X | X | X* | X | X |

    | Touch | X | X | X | X |  | X |

    | Serial port | X |  |  |  |  |  |

    | USB | X |  |  |  |  |  |

    | Teams AV Redirection | X |  |  |  |  |  |

    | Multimedia redirection | Coming soon |  |  |  |  |  |

    | Multi-monitor | 16 monitors |  |  |  |  |  |

    | Dynamic resolution | X | X |  |  | X | X |

    | Screen capture protection | X |  |  |  |  |  |

    | Cameras | X |  | X | X | X |  |

    | Start menu integration | X |  |  |  |  |  |

    | Clipboard | X | X | Text | Text, images | X | Text |

    | Local drive/storage | X |  | X | X | X |  |

    | Accessibility | X |  |  |  |  |  |

    | Location | X |  |  |  |  |  |

    | Microphones | X | X | Coming soon | X | X | X |

    | Printers | X |  |  |  | X (CUPS only) | PDF print |

    | Scanners | X |  |  |  |  |  |

    | Smart cards | X |  |  |  | X |  |

    | Speakers | X | X | X | X | X | X |


    This makes it easier for you to adjust the device based on the requirements for
    redirection. We''re constantly improving the clients, so there''s a likely chance
    that some features will be supported when you start reading this book.'

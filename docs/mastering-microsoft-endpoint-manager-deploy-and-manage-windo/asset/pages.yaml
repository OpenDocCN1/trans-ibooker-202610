- pgno: 98
  md: '# Technical requirements for deploying Windows 365


    To use Windows 365, you must meet the following requirements:


    +   - The following are the licenses you will need to use Cloud PC/Windows 365:

    +     - *Users with Windows Pro endpoints*: W10 E3 + EMS1 E3 or M365 F3/E3/E5/BP

    +     - *Users with non-Windows Pro endpoints*: Win VDA E3 + EMS1 E3 or M365 F3/E3/F5/BP

    +   - An Azure subscription:

    +     - Subscription owner (set up network connection)

    +   - **Virtual Network (VNet)** in an Azure subscription:

    +     - Azure VNet must route to a DNS server that can resolve **Active Directory
    (AD)** records either on-premises or on Azure.

    +   - This AD must be in sync with Azure AD to provide **Hybrid Azure AD join
    (HAADJ)**. **Azure AD join (AADJ)** is currently being worked on.

    +   - Microsoft Intune supported licenses (for example, Microsoft 365 E3):

    +     - Intune Service Admin or a cloud PC administrator


    We will cover some of the subscriptions that are required in more detail.


    # Azure subscription


    Make sure that you have an Azure subscription to configure the Azure VNet; that
    is, for the on-premises connection within Windows 365. If you already have one
    set up, you can skip this step.


    > **Important Note**

    > An Azure subscription will no longer be required as soon as we support Azure
    AD native. This will happen soon. Windows 365 Business already supports this at
    the time of writing!'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Azure VNet


    One of the requirements of using Windows 365 is that you need to have an Azure
    VNet. This network will be used as a gateway to the internet as part of your cloud
    PC. If you already have one, this will be an easy task to perform!


    # Azure VNet – DNS configuration


    As part of the HAADJ requirement, you need to have a line-of-sight connection
    to one of your DNS servers that can talk with your Active Directory domain.


    Always make sure to change your DNS to Custom and enter the IP address of the
    DNS service environment that can resolve your AD DS domain:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_99_0.png)


    Figure 4.1 – Changing DNS to custom'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Azure VNet – required related URLs and ports


    To use all Windows 365 services, you must allow traffic to the following service
    URLs since these services are key to using the service successfully:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_100_0.png)


    Figure 4.2 – Allowing all URLs


    > Important Note

    > Make sure to allow all the URLs and ports via either Azure Firewall or a third-party
    firewall. The best way to do this is with tags based on the wildcard and FQDN
    domain.


    # Microsoft Endpoint Manager and AVD – service URLs


    The following URLs and ports are required to use the Windows 365 services. The
    service will not function properly when some are not added correctly:


    +   - https://docs.microsoft.com/en-us/azure/virtual-desktop/safe-url-list

    +   - https://docs.microsoft.com/en-us/mem/intune/fundamentals/intune-endpoints:

    +     - cpcsacnrysalprodprna02.blob.core.windows.net

    +     - cpcsacnrysalprodprap01.blob.core.windows.net

    +     - cpcsacnrysalprodprau01.blob.core.windows.net'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   - `cpcsacnrysalprodpreu01.blob.core.windows.net`

    +   - `cpcsacnrysalprodpreu02.blob.core.windows.net`

    +   - `cpcsacnrysalprodprna01.blob.core.windows.net`


    Now, let''s look at the network requirements for the Remote Desktop Protocol.


    # Remote Desktop Protocol requirements


    Windows 365 uses the **Remote Desktop Protocol (RDP)**, so you should follow the
    same network bandwidth requirements needed for each scenario in your organization.


    Please use the following table as guidance while designing your network infrastructure
    environment for Windows 365:


    | Scenario | Default mode | H.264/AVC 444 mode | Description |

    |---|---|---|---|

    | Idle | 0.3 Kbps | 0.3 Kbps | The user has paused their work and there are no
    active screen updates. |

    | Microsoft Word | 100-150 Kbps | 200-300 Kbps | The user is actively working
    with Microsoft Word: typing, pasting graphics, and switching between documents.
    |

    | Microsoft Excel | 150-200 Kbps | 400-500 Kbps | The user is actively working
    with Microsoft Excel: multiple cells with formulas and charts are updated simultaneously.
    |

    | Microsoft PowerPoint | 4-4.5 Mbps | 1.6-1.8 Mbps | The user is actively working
    with Microsoft PowerPoint: typing, pasting, modifying rich graphics, and using
    slide transition effects. |

    | Web browsing | 6-6.5 Mbps | 0.9-1 Mbps | The user is actively working with a
    graphically rich website that contains multiple static and animated images. The
    user scrolls the pages both horizontally and vertically. |

    | Image gallery | 3.3-3.6 Mbps | 0.7-0.8 Mbps | The user is actively working with
    the image gallery application: browsing, zooming, resizing, and rotating images.
    |

    | A video playback | 8.5-9.5 Mbps | 2.5-2.8 Mbps | The user is watching a 30 FPS
    video that consumes half of the screen. |

    | Fullscreen video playback | 7.5-8.5 Mbps | 2.5-3.1 Mbps | The user is watching
    a 30 FPS video that''s maximized to full screen. |'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Hybrid Azure AD joined


    Before you start configuring Windows 365, you must make sure that your environment
    is HAADJ-enabled. It''s relatively simple to activate. If you aren''t already
    using it, you just have to reopen the Azure AD Connect setup and select the Configure
    Hybrid Azure AD join option as part of the Device options menu. You can learn
    more about this in Chapter 13, Identity and Security Management, or by going to
    https://docs.microsoft.com/en-us/azure/active-directory/devices/hybrid-azuread-join-managed-domains.


    > **Important Note**

    > Azure AD native support is coming soon. The self-service version of Windows
    365 small business is already supported for Azure AD.


    Here, you can find the main Azure AD Connect wizard configuration screen. Here,
    you need to select Configure Hybrid Azure AD join to use Windows 365 Enterprise:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_102_0.png)


    Figure 4.3 – Azure AD Connect Hybrid Azure AD join setup'

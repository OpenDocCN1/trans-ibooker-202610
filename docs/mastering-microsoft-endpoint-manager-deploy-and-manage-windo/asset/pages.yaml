- pgno: 608
  md: '# Troubleshooting Autopilot


    As part of the **Monitoring** blade in the MEM admin center, there is a report
    that shows the status of Autopilot deployments in the tenant. This report can
    be used as an example to monitor new devices that go through Windows Autopilot
    and give the IT admin an overview of the successes/failures and the total deployment
    time for devices.


    When you are troubleshooting Windows Autopilot, it is important to be familiar
    with the following workflow:


    +   1. A wireless (Wi-Fi) or wired (Ethernet) connection is established.

    +   2. The Windows Autopilot profile is downloaded. When you use a wired connection
    or manually establish a wireless connection, the profile downloads from the Autopilot
    deployment service as soon as the network connection is in place. If you have
    an Ethernet connection, you may experience a situation where regional and language
    settings are bypassed. This can be configured in the Autopilot profile.

    +   3. The next step is user authentication. When performing a **user-driven deployment
    (UDD)**, the user will enter their Azure AD credentials and password. If a user
    is assigned to the Windows Autopilot object, the username will be completed automatically,
    leaving just the password to be validated.

    +   4. The next step is Azure AD Join. For UDDs, the device will be joined to
    Azure AD using the specified user credentials. For self-deploying scenarios, the
    device will be joined without specifying any user credentials.

    +   5. Automatic MDM enrollment occurs next. As part of the Azure AD join process,
    the device will enroll in Microsoft Intune when configured in Azure AD.

    +   6. Settings, applications, and certificates are applied. If the **enrollment
    status page (ESP)** is configured, most settings will be applied while the ESP
    is displayed. If not configured or available, settings will be applied after the
    user has signed in.


    Navigate to **Home | Devices | Monitor | Autopilot deployments**. Autopilot reporting
    will contain data from the last 30 days. Devices that are using Autopilot reset
    will not show up in this report. You can see an overview of the report here:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_608_0.png)


    Figure 16.31 – Autopilot report'
  merge: -1
  img_proc: true
- pgno: 609

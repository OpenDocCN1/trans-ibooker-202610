- pgno: 409
  md: '# Pushing PowerShell scripts – scripted actions to endpoints


    If there is no policy for the configuration change that you need to make on your
    corporate devices, you can leverage PowerShell scripts in Microsoft Intune. This
    is also a good way of publishing one-time installations or custom scripted actions
    to both your physical and cloud endpoints:


    +   1. In the Microsoft Endpoint Manager admin center, browse to Home | Devices
    | Windows | PowerShell scripts and click Add:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_409_0.png)


    Figure 10.43 – PowerShell scripts'
  merge: -1
  img_proc: true
- pgno: 410
  md: "2. Click **Select a file** to upload your PowerShell script to Microsoft Intune:\n\
    \n> **Important Note**\n> Make sure to select **Run script on the 64-bit PowerShell\
    \ host** for the right registry location.\n\nHome > Devices > Windows >\n\n# Add\
    \ Powershell script ...\n\nBasics\n2 Script settings\n3 Assignments\n4 Review\
    \ + add\n\nScript location *\n\nSelect a file\n\nRun this script using the logged\
    \ on credentials\n\nEnforce script signature check\n\nRun script in 64 bit PowerShell\
    \ Host\n\nFigure 10.44 – Uploading a PowerShell script\n\nAssign the script to\
    \ the user or device groups. The script will then run once on each assigned device.\
    \ Here are some script examples:\n\n+   - **Enable Reserved Storage:**\n\n```\n\
    $Storage = Invoke-Command {DISM /Online /\nGet-ReservedStorageState}\n$Output\
    \ = $Storage | Select-String \"Reserved storage is disabled.\"\nWrite-Host $Output\n\
    If ($Output -like \"Reserved storage is disabled.\") {\n    Invoke-Command {DISM\
    \ /Online /\nSet-ReservedStorageState /State:Enabled}\n}\n```"
  merge: -1
  img_proc: true
- pgno: 411
  md: "+   - Enable ADAL for OneDrive:\n\n```\n$registryPath = \"HKCU:\\SOFTWARE\\\
    Microsoft\\OneDrive\"\n$Name = \"EnableADAL\"\n$value = \"1\"\nIF(!(Test-Path\
    \ $registryPath))\n{\n    New-Item -Path $registryPath -Force | Out-Null\n   \
    \ New-ItemProperty -Path $registryPath -Name $name -Value $value `\n    -PropertyType\
    \ DWORD -Force | Out-Null}\nELSE {\n    New-ItemProperty -Path $registryPath -Name\
    \ $name -Value $value `\n    -PropertyType DWORD -Force | Out-Null}\n```\n\nThese\
    \ are just examples of leveraging PowerShell scripts to configure an Intune-managed\
    \ Windows device. Next, we will cover compliance policies.\n\n# Compliance policies\n\
    \nMicrosoft Endpoint Manager can set a compliance state on a device. There are\
    \ two possible outcomes for a device: compliant or noncompliant.\n\nIn Microsoft\
    \ Intune, you can define the rules and settings that users and devices must meet\
    \ to be compliant. If Conditional Access has been configured, then users and devices\
    \ that are noncompliant can be blocked from accessing resources that contain corporate\
    \ data.\n\n> **Important Note**\n> Conditional Access requires an Azure AD Premium\
    \ license.\n\nInclude actions that apply to noncompliant devices. Actions for\
    \ noncompliance can alert users to the conditions of noncompliance and safeguard\
    \ data on noncompliant devices."
  merge: -1
  img_proc: true
- pgno: 412
  md: "There are two types of compliance policies in Microsoft Intune:\n\n+   - **Compliance\
    \ policy settings**: Tenant-wide settings that act like a built-in compliance\
    \ policy that every device receives. The compliance policy settings set a baseline\
    \ for how the compliance policy will work in your Microsoft Intune environment.\n\
    +   \n+   These settings configure the way the compliance service treats devices.\
    \ Each device evaluates these as a *Built-in Device Compliance Policy*, which\
    \ is reflected in device monitoring.\n+   \n+   The following are the options\
    \ you can configure in the built-in policy:\n+   - Mark devices with no compliance\
    \ policy assigned as **Default value is Compliant**. This means that this security\
    \ feature is disabled by default. It is recommended that you change this setting\
    \ to **Not Compliant** so that all devices without a compliance policy will automatically\
    \ be marked as non-compliant.\n+   - Enhanced jailbreak detection: **Default value\
    \ Disabled** (applies only to iOS/iPadOS).\n+   - Compliance status validity period\
    \ (days): The default value is 30 days.\n+   Specify a period in which devices\
    \ must successfully report on all their received compliance policies. If a device\
    \ fails to report its compliance status for a policy before the validity period\
    \ expires, the device is treated as non-compliant. You can configure a period\
    \ so that it ranges from 1 to 120 days.\n+   To manage the compliance policy settings,\
    \ sign into the Microsoft Endpoint Manager admin center and go to **Endpoint security\
    \ | Device compliance | Compliance policy settings.**\n\n+   - **Device compliance\
    \ policy**: Platform-specific rules you configure and deploy to groups of users\
    \ or devices. These rules define requirements for devices, such as the minimum\
    \ number of operating systems or the use of disk encryption. Devices must meet\
    \ these rules to be considered compliant.\n\n# Windows\n\nThe **Device Health\
    \ Attestation (DHA)** service validates the **Trusted Platform Module (TPM)**\
    \ and **Platform Configuration Register (PCR)** logs for a device and then issues\
    \ a DHA report. Microsoft offers the DHA cloud service, a Microsoft-managed DHA\
    \ service that is free, geo-load-balanced, and optimized for access from different\
    \ regions of the world."
  merge: -1
  img_proc: true
- pgno: 413
  md: 'DHA enables enterprises to raise the security bar of their organization to
    hardware monitored and attested security, with minimal or no impact on operation
    costs.


    The DHA service integrates with MDM solutions and does the following:


    +   - Combines the info DHA service that''s received from devices (through existing
    MDM device management communication channels) with the DHA report.

    +   - Makes more secure and trusted security decisions, based on attested hardware
    and protected data.

    +   - When leveraging DHA in a compliance policy, Windows 10 must be rebooted
    before it gets into a compliant state in Microsoft Intune.


    In the Device Health section of the Windows compliance policy, there are three
    settings:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_413_0.png)


    Figure 10.45 – Compliance policy – Device Health


    Update these settings as follows:


    +   - Require BitLocker: Require – The device can protect data that''s stored
    on the drive from unauthorized access when the system is off or hibernating.

    +   - Require Secure Boot to be enabled on the device: Require – The system is
    forced to boot to a factory trusted state. The core components that are used to
    boot the machine must have correct cryptographic signatures that are trusted by
    the organization that manufactured the device. These signatures are verified by
    UEFI firmware before it lets the machine start. If any files are tampered with,
    which breaks their signature, the system doesn''t boot.'
  merge: -1
  img_proc: true

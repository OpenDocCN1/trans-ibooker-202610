- pgno: 49
  md: '# Microsoft Endpoint Manager and Intune


    What is unified endpoint management and how does this look through the concept
    of **Microsoft Endpoint Manager**? The following high-level architecture drawing
    explains how everything within Microsoft Endpoint Manager comes together in one
    unified endpoint management experience.


    There is one console for your physical and cloud PCs via **Windows 365** endpoints
    and mobile devices. This is the only place where they can be managed in a unified
    way. Also, the Intune company portal can deploy apps from Configuration Manager,
    Intune, Windows 365, Azure Virtual Desktop, and Azure Active Directory – one end
    user experience for all apps!


    ![](img/a3e9f26159d3739e434fe676b2987c1d_49_0.png)


    Figure 2.2 – Microsoft Endpoint Manager architecture diagram


    The Microsoft Endpoint Manager architecture in the preceding diagram shows the
    three stages of the cloud management journey using Configuration Manager and Intune
    in a single, unified endpoint management solution:


    +   1. Tenant attach

    +   2. Co-management workloads

    +   3. Cloud-native management'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'All new Windows devices should go directly to the cloud with **Azure Active
    Directory (Azure AD)** with automatic enrollment into Intune. This leverages Windows
    Autopilot for the best onboarding experience for IT and end users, provided your
    organization already has a Configuration Manager environment with lots of applications
    that you are deploying to your on-premises managed devices.


    For existing devices, start using tenant-attach capabilities that provide the
    most flexible path for Configuration Manager customers to start gaining cloud
    benefits without necessarily enrolling their Windows clients with Intune. Connect
    the Configuration Manager environment to the cloud and immediately gain access
    to a host of remote actions and endpoint analytics.


    If your organization is ready for the next step, you can start onboarding Windows
    devices into a co-management state, which means managing Windows clients using
    both Configuration Manager and Intune. Leverage the best of both worlds by moving
    one workload to the cloud at a time.


    # Endpoint Manager admin center portal


    The Microsoft Endpoint Manager admin center portal (`https://endpoint.microsoft.com/#home`)
    is your holistic one-stop admin experience to create policies and manage your
    devices. It allows IT admins to plug in other key device management services,
    such as groups, security baselines and settings, Conditional Access, analytics
    tools, and reporting.


    **Microsoft Intune** is a 100% cloud-based MDM and **mobile application management
    (MAM)** provider for your apps and devices. Microsoft Intune lets you control
    features and settings on Android, Android Enterprise, iOS/iPadOS, macOS, and Windows
    10 devices. It integrates with other services, including Azure AD, and mobile
    threat defenders.


    Microsoft Intune can create compliance policies and check for the compliance status,
    which marks the device as compliant or non-compliant. If you have enabled Conditional
    Access in your Microsoft 365 cloud environment, you can leverage the compliance
    status from Intune to allow or block access to corporate data.


    Intune can also be used for application life cycle management.


    # Microsoft 365 admin center portal


    In the Microsoft 365 admin center portal (`https://admin.microsoft.com`), you
    can manage and administer all your Microsoft 365 cloud services. The most common
    task that you perform in this portal is to purchase and assign licenses for your
    Microsoft services.'
  merge: -1
  img_proc: true
- pgno: 51

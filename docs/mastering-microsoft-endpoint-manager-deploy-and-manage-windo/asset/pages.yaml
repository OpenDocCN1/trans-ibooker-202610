- pgno: 488
  md: '# # Password-less authentication


    While reading the previous section, you might have thought, what about password-less
    sign-in authentication? Good point!


    Microsoft aims to make setting passwords easier; our strategy is a four-step approach
    where we deploy replacement offerings, reduce the password surface area, transition
    to password-less deployment, and finally, eliminate passwords.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_488_0.png)


    Password-less authentication is a way to log on to your Windows 10 Enterprise
    endpoint without entering your password. One of the most common approaches to
    do this is via a so-called YubiKey security key. You have them for USB-C, USB,
    and other devices, such as an Apple device. Other options are to use text messages
    or the Microsoft Authenticator app.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_488_1.png)'
  merge: -1
  img_proc: true
- pgno: 489
  md: 'Let''s talk about the YubiKey. The end user experience looks very similar to
    how you normally log on to Windows. While you are normally logging on with either
    Windows Hello or your password, you can now select a USB key, as shown:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_489_0.png)


    Figure 13.32 – Windows sign-in options


    After that, Windows will ask you to inject the security key into the USB port
    that holds the passphrase to log on to your Windows 10 device without a password.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_489_1.png)


    Figure 13.33 – FIDO2 authentication


    First, you need to enable password-less authentication in your AAD tenant.


    # Enabling password-less authentication


    To enable password-less authentication, you have to go to the Azure portal and
    open AAD. Then, follow these steps:


    +   1. Go to Security.

    +   2. Open Authentication methods.'
  merge: -1
  img_proc: true
- pgno: 490
  md: '3. Under the **Manage** menu, select **Authentication methods.**


    Figure 13.34 – Authentication methods


    4. Click on **FIDO2 Security Key.**


    Authentication methods | Policies

    Desktops in the Cloud - Azure AD Security


    Search (Ctrl+/)


    Got feedback?


    Click here to enable users for the combined security info registration experience.


    Configure your users in the authentication methods policy to enable passwordless
    authentic need to enable your users for the enhanced registration preview so they
    can register these a them to sign in.



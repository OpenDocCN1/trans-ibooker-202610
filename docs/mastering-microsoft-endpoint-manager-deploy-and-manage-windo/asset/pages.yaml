    # Summary


    This concludes the last of the chapters relating to policy management in this
    book. In the chapter, you’ve learned about the Office cloud policy service, which
    you can use either from its management portal or from within Microsoft Intune.
    Office cloud policies apply to all kinds of endpoint, including Windows (both
    desktop and Windows 365), macOS, iOS, and Android. The last three OS types are
    not covered in this book, but it is important to know that the Office cloud policy
    service works on multiple OSes, not only on Windows. One point to take away from
    this chapter is that Office cloud policies only apply in the user context, which
    means that you are not able to set policies that only exist at the device level
    at this point in time.


    In the next chapter, you will learn about the different tools that are available
    for profile management.'

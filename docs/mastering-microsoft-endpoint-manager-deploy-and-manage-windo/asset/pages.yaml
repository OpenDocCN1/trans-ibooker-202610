    # Assigning and deploying cloud printers with Microsoft Endpoint Manager


    In the previous section, you learned about all the basics – as well as the manual
    process – of assigning printers. This process is also possible to perform via
    Microsoft Endpoint Manager (as explained earlier) as a more enterprise-ready approach
    to, for example, assign hundreds of printers across the globe to your users:


    +   1. First, download the Universal Print provisioning tool via this link: https://www.microsoft.com/en-us/download/details.aspx?id=101453.

    +   2. Make the CSV list ready for deployment as Microsoft Endpoint Manager enrolment
    will use a CSV file as the source. You can find the printers.csv file in the tool
    as part of SamplePolicy.zip.

    +   3. Add all the Universal Print printer share name and share IDs and whether
    the printer should become the default printer in the CSV file in the following
    order, SharedId, SharedName, IsDefault:'
  merge: -1
  img_proc: true

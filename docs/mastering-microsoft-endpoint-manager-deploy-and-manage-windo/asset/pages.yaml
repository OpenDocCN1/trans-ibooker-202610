- pgno: 549
  md: '# 15

    Universal Print


    Businesses are doing more and more things digitally; however, printing on physical
    paper remains important. Universal Print is a relatively new platform-as-a-service
    on Azure that can simplify the whole printing configuration and maintenance process
    compared to a traditional print server environment.


    After reading this chapter, you will be able to connect both legacy printers and
    modern printers that are Universal Print ready to the Microsoft cloud. We''ll
    also take a closer look at how you can assign printers to physical PCs and cloud
    PCs as endpoints via Microsoft Endpoint Manager.


    Long story short, you will become an expert in printing!


    In this chapter, we''ll go through the following topics:


    +   - What is Universal Print?

    +   - Configuring Universal Print


    # What is Universal Print?


    Universal Print is a new cloud-based print solution that allows IT admins to share
    printers through the cloud. Universal Print eliminates the need for on-premises
    print servers and lets you easily manage and deploy printers directly with Microsoft
    Endpoint Manager to use them as part of your cloud and physical desktops.'
  merge: -1
  img_proc: true
- pgno: 550
  md: 'It enables you to manage printers directly through a centralized portal in
    Microsoft Azure. Say goodbye to installing (and maintaining) printer drivers on
    devices and/or base images. Also, everything works with Azure Active Directory
    (AD). This means that users can use the same set of credentials they use for other
    Microsoft services, whether they log on to a physical or a virtual desktop running
    in the cloud.


    Another great benefit of the service is that you most likely already have the
    licenses – most customers that are eligible to use Microsoft Endpoint Manager
    also get Universal Print licenses. You can find the licenses you need for Universal
    Print in the requirements section later in this chapter.


    # Universal Print – architecture explained


    The core print services run in the cloud as a platform service running on Azure,
    while the Universal Print connector(s) must be installed on a device running Windows
    Server or the Windows client OS. The connector device may be a physical device,
    virtualized on-premises, or hosted on Azure:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_550_0.png)


    Figure 15.1 – The architecture of Universal Print – used with permission from
    Microsoft'
  merge: -1
  img_proc: true
- pgno: 551
  md: 'When your printer is Universal Print-ready, you can then connect the printer
    directly to the cloud! There''s no need for an ExpressRoute or a site-2-site VPN
    connection in all scenarios. Did you share and connect your printers correctly?
    You can then start assigning printers via Microsoft Endpoint Manager to your virtual
    (and physical) Windows 10 Enterprise desktops!


    See the following example – the settings menu of a Lexmark printer that is Universal
    Print ready:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_551_0.png)


    Figure 15.2 – Universal Print – Lexmark printer settings


    This section explained how you can connect directly from your printer to the Universal
    Print service. Now, we will switch to the Universal Print connector process and
    explain how you can connect non-Universal Print-ready printers to Universal Print.'
  merge: -1
  img_proc: true
- pgno: 552
  md: '# The print connector


    The print connector is the proxy between your on-premises location and the Universal
    Print service. If your printer doesn''t support Universal Print, this makes every
    printer scenario supported.


    See the following print connector connection process. We''ll explain more about
    this process later on in this chapter:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_552_0.png)


    Figure 15.3 – Universal Print – print connector


    Now you know how to connect your printers, we can start explaining how the data
    flow works.


    # Where does my printed data go?


    Universal Print stores all print queues in Office data storage. This is the same
    storage that stores customers'' Office 365 mailboxes and OneDrive files. A job
    stays in the print queue for a few days. If the job is not claimed at the printer
    within 3 days, it gets marked as aborted. Even after printing, a job may stay
    in Universal Print for a few more days (up to a total of 10 days).


    # Printer defaults


    All the management of Universal Print happens from within the Azure portal, and
    this also applies to changing the printer''s default settings such as color mode,
    the size of the paper, the output bin, and so on. Normally, you would have logged
    on to a traditional print server; with Universal Print you can do it from the
    cloud from one management console (see the following example).


    The settings you define are taken over by the Windows 10 physical or virtual desktop
    by default:'
  merge: -1
  img_proc: true
- pgno: 553
  md: '![](img/a3e9f26159d3739e434fe676b2987c1d_553_0.png)


    Figure 15.4 – Universal Print – printer defaults


    Let''s jump into the requirements of the service, now you''ve learned about all
    the basics to kick the tires.


    # Universal Print – service requirements


    In this section, you will learn about all the prerequisites to use Universal Print:


    +   - Your desktops should be joined to Azure AD. **Hybrid AAD joined (HAADJ)**
    device physical and virtual desktops are also supported.

    +   - An *eligible* Microsoft 365 or Windows SKUs license.

    +   - Universal Print licenses assigned to the Azure AD tenant via the Global
    Administrator.

    +   - A Universal Print supported printer that can connect directly to the cloud
    – without a connector.'
  merge: -1
  img_proc: true
- pgno: 554
  md: '+   - A normal USB or network printer (via a connector).

    +   - To configure Universal Print, the administrator doing the work should have
    either the Printer Administrator Azure AD role or should just be the Global Administrator.

    +   - A Windows 10 client device – on version 1903 or later.

    +   - A Universal Print connector host.


    After these more functional and licensing requirements, let’s look at the network
    requirements. As Universal Print is a cloud service, you can imagine that a network
    and firewalling are very important.


    # Network requirements


    The connectors and your desktops should be able to connect to the following Universal
    Print service URLs:


    +   - https://login.microsoftonline.com

    +   - https://aadcdn.msftauth.net

    +   - *.print.microsoft.com


    Enough talking. Let’s switch over to the deployment steps to deploy Universal
    Print in your environment.


    # Learning how to deploy Universal Print


    Before we start, make sure that your environment is Hybrid Azure Active Directory
    (AD) enabled – or Azure AD only. Make sure the first Windows 10 or later domain-joined
    devices box has been ticked. You can find information about how to set up Hybrid
    Azure AD join and Azure AD join in Chapter 13, Identity and Security Management.


    Also, make sure you have a Universal Print license assigned to your Azure AD tenant.


    See the following screenshot to see how you can change your Azure AD Connect configuration
    to Hybrid Azure AD join during the setup flow:'
  merge: -1
  img_proc: true
- pgno: 555
  md: '![](img/a3e9f26159d3739e434fe676b2987c1d_555_0.png)


    Figure 15.5 – Azure AD Connect – enable Hybrid Azure AD join


    Now, let''s look at what rights you need in order to configure and maintain Universal
    Print.


    # Delegating printer access – custom roles


    If you want to delegate access, for example, if you need to configure the Universal
    Print service with an account other than the Global Administrator, then to achieve
    this you need to assign Printer Administrator or Printer Tech rights to your user
    accounts.


    See the following screenshot to see the roles in the admin center portal:


    +   Devices

    +   - Cloud device admin

    +   - Desktop Analytics admin

    +   - Intune admin

    +   - Printer admin

    +   - Printer tech


    Figure 15.6 – Universal Print role-based access controls'
  merge: -1
  img_proc: true

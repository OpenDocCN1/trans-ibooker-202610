  md: '# Enabling Windows automatic enrollment


    Automatic MDM enrollment means when a Windows device joins Azure AD, the device
    will automatically be enrolled into Intune with the MDM enrollment flow.


    For automatic Windows enrollment, follow these steps:


    +   1. Sign in to the MEM admin center (https://endpoint.microsoft.com).


    +   2. Select Devices | Windows | Windows enrollment followed by Automatic Enrollment:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_171_0.png)


    Figure 5.6 – MEM admin center – Windows automatic MDM enrollment


    User enrollment can also be scoped to a group of users, if all your users have
    an Intune license assigned. The best option is to leverage Intune enrollment restriction
    to configure which Windows devices a user can enroll.'
  merge: -1

    +   - Windows 10 1803

    +   - Windows 10 1809

    +   - Windows 10 1909

    +   - Windows 10 2004

    +   - Windows 10 20H2


    By setting this policy, the specified Windows feature is not downloaded and installed
    from Microsoft Intune but it tells the devices to send the information on what
    feature update the devices should be on when Windows Update sync is performed
    at the next scheduled time after receiving the policy from Microsoft Intune.


    # Opting out of safeguard holds


    Opting out of Windows Update safeguard holds is available on Windows Update for
    Business devices running Windows 10 version 1809 and above and installed with
    the October 2020 security update.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Safeguard holds prevent a device with a known compatibility issue from being
    offered a new OS version. The offering will proceed once a fix is issued and is
    verified on a held device.


    The safeguard holds protection is provided by default to all devices trying to
    update to a new Windows 10 feature update version via Windows Update.


    IT admins can, if necessary, opt devices out of safeguard protections using group
    policy settings or via the **Disable safeguards for Feature Updates** MDM settings.


    The MDM policy can be configured as a custom policy from Microsoft Intune.

    More details on how to create a custom policy in Microsoft Intune will be covered
    in *Chapter 10, Advanced Policy Management*. When you are creating the custom
    policy in Microsoft Intune, you need to fill out every mandatory field like in
    this example:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_226_0.png)


    More details are as follows:


    +   - **Name:** `DisableWUfBSafeguards`

    +   - **Description:** `This policy will disable safeguards`

    +   - **OMA-URI:** `./Vendor/MSFT/Policy/Config/Update/DisableWUfBSafeguards`

    +   - **Data type:** Integer

    +   - **Value:** 1'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'The supported values for this option are as follows:


    +   - **0 (default)**: Safeguards are enabled, and devices may be blocked for
    upgrades until the safeguard is cleared.

    +   - **1**: Safeguards are not enabled, and upgrades will be deployed without
    blocking on safeguards.


    Opting out of the safeguards can put devices at risk of known performance issues.
    The recommendation is only opting out in an IT-controlled environment for validation
    purposes.


    The **Disable safeguards policy** option will revert to **Not Configured** on
    a device after moving to a new Windows 10 version, even if previously enabled.
    This ensures the admin is consciously disabling Microsoft''s default protection
    from known issues for each new feature update.


    Disabling safeguards does not guarantee your device will be able to successfully
    update. The update may still fail on the device and will likely result in a bad
    experience post upgrade as you are bypassing the protection given by Microsoft
    pertaining to known issues.


    In the next section, you''ll learn about options to deploy Windows updates faster.


    # Expediting a Windows patch


    Expediting quality patching is done to deploy updates faster than normal across
    your device estate. If an important quality update is released and has an important
    security fix, you can leverage the expedite policy.


    By creating an expedite policy, the expectation is to get more than 90% of devices
    with an expedited policy assigned, updated, and restarted within 2 days. That
    also means that when using this type of policy, it can have a negative impact
    on your end users'' productivity as it has a way more aggressive reboot behavior.
    Two to three times more devices are updated successfully in the first week of
    deployment compared to devices configured with Windows Update for Business ring
    policy settings.


    One benefit of expediting an update is that you won''t need to modify the existing
    quality update settings of your Windows 10 update rings. An expedited profile
    will temporarily override any Windows Update for Business settings and use the
    necessary settings from the expedited policy instead; this is to ensure the expedited
    update is installed as quickly as possible on the targeted devices. The settings
    from your Windows Update for Business policy will be automatically restored to
    the correct state after the expedited update successfully installs.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'Support for expediting an update policy is available on Windows 10 devices
    that are still receiving updates through Windows Update and have not reached the
    end of service. Devices need to be hybrid AAD-joined or AAD-joined for the policy
    to work.


    Expedited updates use **Windows Push Notification Services (WNS)** and push notification
    channels to deliver the message to devices that there''s an expedited update to
    install. This is done to speed up installation. This process enables devices to
    start the download and install from Windows Update as an expedited update as soon
    as possible, without having to wait for the device to go through the normal scheduled
    check-in process for talking to the Windows Update backend service.


    To configure a quality update profile, do the following:


    +   1. Sign in to the Microsoft Endpoint Manager admin center (https://endpoint.microsoft.com).

    +   2. Select **Devices | Windows | Windows 10 Quality Updates | Create profile:**



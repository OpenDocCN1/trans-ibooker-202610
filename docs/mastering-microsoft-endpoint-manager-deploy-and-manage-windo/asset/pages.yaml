- pgno: 366
  md: '# Policy management within Microsoft Endpoint Manager


    Policy sets allow you to create a bundle of references to already existing management
    entities that need to be identified, targeted, and monitored as a single conceptual
    unit. A policy set is an assignable collection of apps, policies, and other management
    objects you''ve created. Creating a policy set enables you to select many different
    objects at once and assign them from a single place. As your organization changes,
    you can revisit a policy set to add or remove its objects and assignments. You
    can use a policy set to associate and assign existing objects, such as apps, policies,
    and VPNs, in a single package.


    You can use policy sets to do the following:


    +   - Group objects that need to be assigned together.

    +   - Assign your organization''s minimum configuration requirements on all managed
    devices.

    +   - Assign commonly used or relevant apps to all users.


    You can include the following management objects in a policy set:


    +   - App configuration policies

    +   - App protection policies

    +   - Device configuration profiles

    +   - Device compliance policies

    +   - Device type restrictions

    +   - Windows Autopilot deployment profiles

    +   - Enrollment status page'
  merge: -1
  img_proc: true

- pgno: 303
  md: 'Add a custom or in-house Win32-based app. Upload the app''s installation file
    in .intunewin format. The following example demonstrates the packaging process
    for the most famous app used in demos – Notepad++.


    The capabilities to filter out and create dependencies are much greater than with
    the previous LOB approach. The capabilities we use in this section apply to any
    Win32 application you have. Let''s begin:


    +   1. Firstly, download the Microsoft Win32 Content Prep Tool: https://github.com/Microsoft/Microsoft-Win32-Content-Prep-Tool.

    +   2. Unzip the tool, for example, on the C:\ drive (you could pick a random
    folder as well).

    +   3. Save your application .exe or .msi file in, for example, the same folder
    as the Prep Tool (selected previously). It could also be saved somewhere else,
    of course. I''m using Notepad++ for this example because it''s free:

    +   4. Now we start creating the Win32 .Intunewin package.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_303_0.png)



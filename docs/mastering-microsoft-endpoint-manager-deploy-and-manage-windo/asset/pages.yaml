    Select the Feedback section from the side menu.


    Under the Filter dropdown, select My organization. This will show all the feedback
    from users in your organization who are also signed in to the Feedback Hub using
    their registered AAD accounts:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_234_0.png)


    Figure 6.41 – Windows Feedback Hub


    # Updating Microsoft 365 apps


    When you are starting to leverage Windows Update for Business either on a cloud-managed
    device or a co-managed device, you should also be looking at how you are managing
    updating Microsoft 365 apps.


    There are two options:


    +   - Servicing profile for Microsoft 365 apps: You can see an overview of the
    devices in the Servicing Profile section of the Microsoft 365 apps admin center
    (config.office.com), including details on the next build rollout, projected waves,
    and information on any device failures and issues.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'From there, you can click on Devices, Actions, Issues, and Settings to get
    more information on devices managed by the servicing profile:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_235_0.png)


    Figure 6.42 – Microsoft 365 apps servicing policy


    +   - Administrative templates to configure policies: Administrative templates
    are the way that you are used to configuring policy settings in your on-premises
    environment with group policies.


    The recommendation is to look at the new servicing capabilities provided by the
    Office 365 Apps admin center. We will cover this in depth in Chapter 8, Application
    Management and Delivery, later in this book.


    This has brought us to the end of the chapter.


    # Summary


    In the chapter, you''ve learned about all the subjects you need to know in order
    to start deploying and updating Windows with Microsoft Endpoint Manager and Windows
    Update for Business for different endpoint scenarios.


    We went through the different options on how to update Windows and what policy
    settings you should apply. If you are used to leveraging SCCM for deploying Windows
    Update, you probably already have some kind of ring deployment when you are deploying
    Windows Updates in your business. With Windows Update for Business, you can start
    taking the same approach as Windows Update for Business has ring-based deployments
    as well.


    If you are not already running Windows Insider for Business, we explained why
    it is a good idea to start, and now you are ready to configure Windows Insider
    for Business in your organization. In the next chapter, we''re going to take a
    deeper dive into the world of Windows Autopilot.'
  merge: -1

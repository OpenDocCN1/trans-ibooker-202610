- pgno: 491
  md: '5. Enable the settings for (at least) sign-in and strong authentication.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_491_0.png)


    You can also use a key restriction policy to specify what FIDO2 keys your end
    users can leverage in your tenant, by entering an allow or block list of devices
    with an Authenticator Attestation GUID (AAGUID).


    The FIDO2 specification requires each security key provider to provide an AAGUID
    during attestation. An AAGUID is a 128-bit identifier indicating the key type,
    such as the make and model.


    You’re now done with the prerequisites and are ready to use FIDO2 keys. You should
    see the following log-on screen for AAD while using password-less authentication
    via the Microsoft Authenticator mobile application, and all without entering the
    password.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_491_1.png)


    Password-less sign-in is more secure and the end user rarely has to enter their
    password anywhere.'
  merge: -1

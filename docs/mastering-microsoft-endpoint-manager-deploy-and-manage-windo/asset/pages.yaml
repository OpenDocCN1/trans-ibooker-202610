- pgno: 200
  md: '# Testing company domain CNAME registration for Windows enrollment


    Configuring a CNAME in your DNS saves your users from having to enter the address
    of the **Mobile Device Management (MDM)** server when enrolling their Windows
    devices.


    After configuring the CNAME resource records in your DNS, enter the corresponding
    domain to confirm that it has been configured correctly.


    Changes to DNS records might take up to 72 hours to propagate. You can find the
    configuration option that makes this possible in the following screenshot:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_200_0.png)


    Figure 6.2 – CNAME validation setup


    Let''s now switch over to the **Enrollment Status Page** screen to learn more
    about the results and status of your enrollment into Microsoft Endpoint Manager.


    # Enrollment Status Page


    The **Enrollment Status Page** screen displays the provisioning progress after
    a new device is enrolled, as well as when new users sign in to the device. This
    enables IT administrators to optionally prevent (block) access to the device until
    it has been fully provisioned, while at the same time giving users information
    about the tasks remaining in the provisioning process.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'The default enrollment status page applies to all users and all devices, but
    you can create multiple enrollment status page profiles with different configurations
    that are needed for your scenario.


    These profiles are specified in priority order; the highest priority that is applicable
    will be used. Each enrollment status page profile can be targeted to groups containing
    devices or users. When determining which profile to use, the following criteria
    will be followed:


    +   - The highest-priority profile targeted to the device will be used first.

    +   - If there are no profiles targeted to the device, the highest-priority profile
    targeted to the current user will be used. (This only applies in scenarios where
    there is a user. In white-glove and self-deploying scenarios, only device targeting
    can be used.)

    +   - If there are no profiles targeted to specific groups, then the default enrollment
    status page profile will be used.


    The enrollment status page is not just applicable to Windows Autopilot devices
    but to all devices that are enrolled into Microsoft Intune that have it assigned
    either to users or devices.


    We will cover Windows Autopilot in depth, including how to set it up and configure
    the enrollment status page for different scenarios, in the next chapter.


    In the following screenshot, you can see how to capture devices on the Enrollment
    Status Page screen:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_201_0.png)


    Figure 6.3 – Enrollment Status Page screen'
  merge: -1
  img_proc: true

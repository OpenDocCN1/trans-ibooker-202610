- pgno: 63
  md: 'Devices activated via Active Directory maintain their activated state for up
    to 180 days following the most recent contact with the domain. Devices periodically
    attempt to reactivate (every 7 days by default) before the end of that period
    and, again, at the end of the 180 days.


    # Windows 10 and later Subscription Activation


    Starting with Windows 10, version 1703, Windows 10 Pro supports the Subscription
    Activation feature, enabling users to *step up* from Windows 10 Pro to Windows
    10 Enterprise automatically if they are subscribed to Windows 10 Enterprise E3
    or E5.


    With Windows 10, version 1703, both Windows 10 Enterprise E3 and Windows 10 Enterprise
    E5 are available as online services via subscription. Deploying Windows 10 Enterprise
    in your organization can now be accomplished with no keys and no reboots.


    # For Windows 10, version 1703 or later


    Devices with a current Windows 10 Pro license can be seamlessly upgraded to Windows
    10 Enterprise. Product key-based Windows 10 Enterprise software licenses can be
    transitioned to Windows 10 Enterprise subscriptions.


    Organizations that have an Enterprise agreement can also benefit from the new
    service, using traditional Active Directory-joined devices. In this scenario,
    the Active Directory user that signs in on their device must be synchronized with
    Azure AD using Azure AD Connect sync.


    The Subscription Activation feature eliminates the need to manually deploy Windows
    10 Enterprise or Education images on each target device and then later standing
    up on-premises key management services, such as KMS- or MAK-based activation,
    entering **Generic Volume License Keys ( GVLKs)**, and subsequently rebooting
    client devices.'
  merge: -1
  img_proc: true

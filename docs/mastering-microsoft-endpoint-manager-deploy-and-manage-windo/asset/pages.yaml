- pgno: 465
  md: '# 13

    Identity and Security Management


    In this chapter, you will learn everything about Azure Active Directory (AAD)
    and security. We will cover the history of AAD and the different security aspects
    that you can configure to secure your Windows 10 Enterprise devices within your
    organization.


    In this chapter, we''ll go through the following topics:


    +   - Microsoft Identity

    +   - AAD

    +   - Users and groups

    +   - Hybrid AAD

    +   - Conditional Access

    +   - BitLocker disk encryption

    +   - Self-service password reset

    +   - AAD password protection

    +   - Password-less authentication

    +   - What is and isn''t supported in each password-less scenario

    +   - Microsoft Defender for Endpoint'
  merge: -1
  img_proc: true
- pgno: 466
  md: '# Microsoft Identity


    **Active Directory Domain Services (AD DS)** has been on the market since the
    year 2000. As some of you might remember, it arrived with the first release of
    Windows 2000 Server.


    The way it works is, you join your Windows client or server devices to **Active
    Directory (AD)** to take over the management layer of it via either group policies
    or security settings, or you use it to chain different AD environments to each
    other to delegate organization permissions to resources that are stored in a different
    AD environment – in different forests.


    Within the context of **Microsoft Endpoint Manager (MEM)**, it''s possible to
    connect to Windows devices that are both AD DS- and AAD-joined. Devices that are
    joined to AD DS and need to become available in AAD as well are known as **hybrid
    AAD-joined (HAADJ)**. Before your business is ready to work natively in AAD, hybrid
    AAD might be the best option to use as an interim solution. Let''s talk more about
    this in the next sections of this chapter.


    If your devices are enrolled into AAD directly and listed in **All Devices** within
    MEM, you can see the AAD domain properties in your Windows 10 Enterprise **Settings**
    menu.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_466_0.png)


    Figure 13.1 – Access work or school


    Devices can be in different states, but common for them all is that you can see
    them in the settings app under **Accounts | Access work or school.**


    Let''s look at AAD next.'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# AAD


    AAD provides **single sign-on (SSO)** and **multi-factor authentication (MFA)**
    to Windows 10 Enterprise and MEM to help protect your users from 99.9 percent
    of cybersecurity attacks.


    AAD is the evolution of traditional AD (AD DS) and makes it possible to do the
    following:


    +   - SSO simplifies access to your apps from anywhere.

    +   - Conditional Access and MFA help to protect your environment from outside
    intruders.

    +   - As a single identity platform, it lets you engage with internal and external
    users more securely.

    +   - Developer tools make it easy to integrate identity into your apps and services.


    Let''s look at AAD users next.


    # AAD users


    AAD users include the account settings of a user in your organization and only
    live in the Microsoft Azure cloud. Creating and deleting users can be done by
    using either the AAD Global Administrator role or an account that has the account
    administrator **role-based access control (RBAC)** role assigned.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_467_0.png)


    Figure 13.2 – New user in the MEM admin center'
  merge: -1
  img_proc: true
- pgno: 468
  md: 'Creating new users directly in AAD is for cloud-only identities; hybrid identities
    still need to be created in the on-premises AD and synced to AAD with AD Connect.
    Let''s look at AAD guest users next.


    # AAD guest users


    Guest user accounts are designed to collaborate with other organizations outside
    of your AAD tenant environment without creating a normal AAD user account that
    contains your organization''s domain. One example is to allow access to a SharePoint
    site. If an end user has permission to share documents in OneDrive for Business,
    it can also be done with a guest user.


    Be aware that a guest user cannot enroll a device into AAD or Microsoft Intune.


    In the **Create a new user** workflow, the IT admin can choose to invite a user
    instead of creating one in the corporate AAD, as seen in this workflow:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_468_0.png)


    Figure 13.3 – Inviting guest users


    In the **Invite user** workflow, the IT admin can also assign groups or roles
    in AAD. This means that a guest user can be assigned the role of Intune administrator,
    so you can give the role to an external consultant, as an example.


    Let''s look at different options for groups in AAD next.


    # AAD group types


    There are two types of AAD groups, as follows:


    +   - **Security**: This is the most commonly used type as it is used to add members
    to a group to gain access to a folder share, applications, RBAC, a security policy,
    or a cloud desktop environment.'
  merge: -1
  img_proc: true
- pgno: 469
  md: '+   - **Microsoft 365**: This is the group type used within other Microsoft
    cloud services, such as Exchange Online and SharePoint, to collaborate better.
    This group type also allows customers to share access to members outside the organization''s
    AAD tenant environment.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_469_0.png)


    Figure 13.4 – Creating a new group


    Security groups can be used for both users and devices but not a mix. Next, we
    will look at the different membership types.


    # AAD membership types


    In the previous section, we explained the differences in types of AAD groups.
    There are three ways to make users or devices members of an AAD group:


    +   - **Assigned**: This is the most common way of assigning access to a specific
    group. You add specific users to an AAD group to gain access, for example, to
    a security policy.


    +   - **Dynamic user**: This type makes it possible to automatically add users
    to a group based on conditions that you define. There is no interaction needed
    to add – as well as remove – the users to the AAD group when the user no longer
    meets the requirements to be part of the group.


    +   - **Dynamic device**: This type is somewhat the same as the dynamic user membership
    type; however, now it is used to automatically add or remove devices from the
    AAD group.'
  merge: -1
  img_proc: true
- pgno: 470
  md: 'Pick the type that fits your use case best, as dynamic membership could provide
    a more scalable method for larger organizations. Dynamic groups are only supported
    as either the user or device type – not both.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_470_0.png)


    Figure 13.5 – Creating a new group


    Within the dynamic membership rules, you can create complex attribute-based rules
    to enable dynamic membership for groups, which you could use to add and remove
    users from the AAD group.


    For example, you can add all users that have @contoso.com as proxyAddresses configured
    in AAD automatically by adding the following rule. You can imagine that any number
    of options will be available through this approach.'
  merge: -1
  img_proc: true
- pgno: 471
  md: '# Dynamic membership rules



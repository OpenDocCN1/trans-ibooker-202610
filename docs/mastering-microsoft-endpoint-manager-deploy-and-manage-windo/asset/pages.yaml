- pgno: 184
  md: 'We have covered the branding part of Microsoft Intune in this section. In the
    next section, we will cover Microsoft Store for Business integration with Microsoft
    Intune.


    # Associating your Microsoft Store for Business account with Intune


    Microsoft Store for Business gives you a place to find and purchase apps for your
    organization, individually or in volume. You can manage volume-purchased apps
    from the Azure portal by connecting the store to Microsoft Intune. See the following
    examples:


    +   - You can synchronize the list of apps you have purchased (or that are free)
    from the store with Intune.

    +   - Apps that are synchronized appear in the MEM admin center; you can assign
    these apps like any other apps.

    +   - Both online and offline licensed versions of apps are synchronized to Intune.
    App names will be appended with Online or Offline in the portal.

    +   - You can track how many licenses are available and how many are being used
    in the Intune administration console.

    +   - Intune blocks the assignment and installation of apps if there is an insufficient
    number of licenses available.

    +   - Apps managed by Microsoft Store for Business will automatically revoke licenses
    when a user leaves the enterprise, or when the administrator removes the user
    and the user devices.


    > **Important Note**

    > Microsoft Store for Business and Microsoft Store for Education will be retired
    in the first quarter of 2023. Customers may continue to use the current capabilities
    for free apps until that time. There will be no support for Microsoft Store for
    Business and Education on Windows 11. You can still leverage Microsoft Intune
    to deploy apps from Microsoft Store for Business on Windows 11 both as required
    and as available in the company portal.


    As Microsoft Store for Business is still important to get Store apps to a Windows
    device, we will still advise you to create the connection with the following guidelines:


    +   1. Sign in to the MEM admin center (endpoint.microsoft.com).

    +   2. Select Tenant administration | Connectors and tokens | Microsoft Store
    for Business.'

  md: '| MEM policy-driven provisioning, management, and guided scenarios |  | • |

    | EA-based reporting, monitoring |  | • |

    | Service health, operational health alerts |  | • |

    | Connection to on-premises (networks, apps, resources) and diagnostics |  | •
    |

    | Advanced MEM-based troubleshooting and device management |  | • |


    We''d like to give you a bit more information about the Windows 365 Business version
    of the product. Within Enterprise, there are some prerequisites and Microsoft
    Endpoint Manager is needed to make the configuration supported for larger organizations.


    However, Windows 365 Business only needs a license assigned to the user via the
    Microsoft 365 admin center to start the provisioning process of the Cloud PC.
    After assigning a 2vCPU/8 GB/128 GB Cloud PC license, users can directly go to
    the windows365.microsoft.com portal to access their workspace:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_79_0.png)


    Figure 3.2 – Windows 365 Business – provisioning a Cloud PC'
  merge: -1

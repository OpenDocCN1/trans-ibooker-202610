- pgno: 7
  md: '+   - Create an end user experience that is consistent with physical Windows
    devices.

    +   - Provide a seamless experience to scale up and out as the needs of our customers
    evolve.

    +   - Predicate fixed monthly pricing options that enable customers to manage
    their budgets.

    +   - No global admin required; administration is properly distributed to the
    right admins in familiar portals.


    Right around the time we finalized our principles, the world was hit with a global
    pandemic that would forever change the way we work. The team was only a few months
    old when COVID hit, and we had just started building out the new team when the
    world went into lockdown. Seeing as we were developing a new service that would
    empower users to be productive anywhere in the world, we took on the challenge
    of putting together a globally distributed team and developing the service using
    Teams, SharePoint, Azure DevOps, and other tools to keep the team in sync. 8 months
    later we started our private preview of the service and 8 months after that we
    went live.


    The world will forever be changed by the effects of COVID. Organizations are creating
    more opportunities for remote workers, and they are migrating their workloads
    to the cloud to expand their reach to provide corporate resources to a globally
    distributed workforce. Windows 365 was cast from this new environment and is just
    the right product to empower organizations to provide secure and elastic Windows
    Desktops to their globally distributed workforce.


    Scott Manchester


    Director of Product Management at Microsoft'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Contributors


    # About the authors


    **Christiaan Brinkhoff** works as a Principal Program Manager and Community Lead
    for the Windows 365 Engineering team at Microsoft, driving new features such as
    Windows 11 integration and lots of different new community initiatives while bringing
    his expertise to help customers imagine new virtualization experiences. Christiaan
    joined Microsoft in 2018 as part of the FSLogix acquisition.


    He has also been rewarded with the Microsoft MVP, Citrix CTP, and VMware vExpert
    community achievements.


    > *Writing a book demands huge dedication and constant energy, especially when
    you’ve relocated to Redmond, USA, and your family’s growing. I’d like to thank
    my wife for always supporting me and allowing me to dedicate so much private time
    to finalizing this book!*


    **Per Larsen** works as a Senior Program Manager for Microsoft Endpoint Manager
    - Customer Acceleration Team - **Commercial Management Experiences (CMX)** Engineering,
    where he takes learnings from Microsoft’s largest and most strategic customers
    back into the rest of engineering to drive improvements for the service so that
    customers have a continuously improving product experience. He also helps deploy
    and adopt Microsoft Endpoint Manager - Microsoft Intune. Per mainly focuses on
    the management of Windows and special devices such as HoloLens 2, Surface Hub,
    and Microsoft Teams Room System.


    Per was also an MVP in Enterprise Mobility, from 1st July 2016 to when he joined
    Microsoft on 1st April 2018.


    > *Writing a book during the pandemic and being at home all the time requires
    dedication and constant energy. I’d like to thank my kids for always supporting
    me and allowing me to dedicate so much private time to writing this book!*'
  merge: -1
  img_proc: true

    # What is MSIX?


    MSIX is a Windows app package format that provides a modern packaging experience
    to all Win32, UWP, and Windows apps. It''s a new way of doing application virtualization
    compared to technologies such as App-V.


    Separating the applications from the images to update and assign applications
    without doing an image update sounds like a solution, right? Well, that''s exactly
    what MSIX can accomplish. Let me explain how you could package an application
    here:


    +   1. Declarative install via the manifest file.

    +   2. The app signature needs to be trusted on the device.

    +   3. Tamper protection via BlockMap and signature.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '4. The OS manages the installation, updates, and removal:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_338_0.png)


    Figure 8.64 – MSIX package


    # AppxManifest.xml


    The package manifest is an XML document that contains the information the system
    needs to deploy, display, and update an MSIX app. This info includes package identity,
    package dependencies, required capabilities, visual elements, and extensibility
    points.


    # AppxBlockMap.xml


    The package block map file is an XML document that contains a list of the app''s
    files along with indexes and cryptographic hashes for each block of data that
    is stored in the package. The block map file itself is verified and secured with
    a digital signature when the package is signed. The block map file allows MSIX
    packages to be downloaded and validated incrementally, and also works to support
    differential updates to the app files after they''re installed.


    # AppxSignature.p7x


    AppxSignature.p7x is generated when the package is signed. All MSIX packages are
    required to be signed prior to installation. With AppxBlockmap.xml, the platform
    can install the package and it can be validated.'
  merge: -1
  img_proc: true

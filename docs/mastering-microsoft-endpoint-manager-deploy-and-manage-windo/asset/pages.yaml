- pgno: 373
  md: '# Advanced Policy

    Management


    This is the second chapter on policy management in this book. You will learn about
    the different policy options available to customize and secure the Windows 10
    Enterprise desktops in your environment. This chapter will be very broad in terms
    of content and topics related to Windows OS customizations, Microsoft 365 apps
    (Office, OneDrive, and so on), and group policy management.


    We will cover different scenarios – some partial scenarios and some end-to-end
    scenarios. The most important part of this chapter will give you an insight into
    all the different policy options that exist in Microsoft Intune, and when and
    how you can leverage the different policy types in the best way to accomplish
    the task you need for your enterprise.


    In this chapter, we''ll be covering the following topics:


    +   - Configuring a policy from the Endpoint Manager Security blade

    +   - Configuring your Endpoint security profile

    +   - Windows 10 unhealthy endpoints

    +   - Configuring a policy from the Settings catalog

    +   - Configuring administrative templates

    +   - OneDrive Known Folder Move configuration'
  merge: -1
  img_proc: true
- pgno: 374
  md: '+   - OneDrive – block syncing specific file extensions

    +   - Configure device configuration (template)

    +   - Leveraging a custom policy as the last resort

    +   - Pushing PowerShell scripts – scripted actions to endpoints

    +   - Compliance policies

    +   - Organizational compliance report


    # Policy management


    Using Microsoft Intune, a part of Microsoft Endpoint Manager, to manage your Windows
    10 or 11 Enterprise desktops is all about standardizing and simplifying the management
    layer of your environment. In *Chapter 9, Understanding Policy Management*, we
    covered the basics of how MDM policies work on the client side. We also learned
    how to get started with MDM policy management either from scratch or with Group
    Policy analytics.


    In this chapter, we will look at different ways to configure settings within Microsoft
    Intune. We will start with security baselines as those are best practices for
    securing your desktops.


    # Configuring a policy from the Endpoint Manager Security blade


    You should start with a security baseline if your organization is ready for it.
    Let''s say that your organization is already leveraging a Microsoft security baseline
    such as **Center for Internet Security (CIS)** Benchmarks. With GPOs today, you
    already know the impact that a security baseline can have on your Windows production
    environment. There are multiple different baselines in Microsoft Intune:


    +   - **Windows 10 Security Baseline:** Use the Windows 10 security baseline to
    help you secure and protect your users and devices. This baseline consists of
    recommendations for settings that impact security and is created by the Windows
    Security team. If you are already using some kind of security baseline in your
    **Group Policy Object (GPO)** today, it is highly recommended to adopt the Intune
    Windows 10 security baseline as well.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '+   - **Microsoft Defender for Endpoint Baseline:** The Microsoft Defender
    for Endpoint baseline represents the default recommended configuration for Defender
    for Endpoint and might not match baseline defaults for other security baselines.
    This means that if you are leveraging this baseline in conjunction with the Windows
    10 Security baseline, you can create conflicts between the different policy settings.

    +   - **Windows 365 Security Baseline (Preview):** The Windows 365 Security baseline
    provides a set of policy templates built on security best practices and experience
    from real-world implementations. You can use security baselines to get security
    recommendations that can help lower risks. The Windows 365 baseline is one baseline
    for Cloud PC with security settings for Windows, Microsoft Edge, and Microsoft
    Defender for Endpoints. This also means that you should not assign other security
    baselines to the same group of devices as it can end up in a policy conflict.

    +   - **Microsoft Edge Baseline:** The Microsoft Edge baseline sets the recommended
    configuration for the Microsoft Edge browser. The Microsoft Edge security baseline
    has a very small footprint and only sets security-related settings, so it is easy
    to test out in your organization. If you are allowing your users to use different
    browsers on company-owned Windows 10 devices, you should also create a security
    baseline on those third-party browsers; otherwise, there is a risk that your end
    users will always use the least secure browser.


    Be aware that when a baseline changes its version, the old one will be read-only.
    You can continue to use those profiles but you won''t be able to edit them. You
    should change the baseline version to take advantage of the newest recommendations
    every time a new version is released.


    The Microsoft Edge baseline defaults represent the recommended configuration for
    Microsoft Edge browsers, so they might not match the baseline defaults of other
    security baselines.'
  merge: -1
  img_proc: true

- pgno: 318
  md: '# Community tool – Win32App Migration Tool


    The tool is community-driven and was created by Ben – a Microsoft MVP – and is
    designed to migrate your existing SCCM/MECM Configuration Manager application
    to a deployment type that is supported within Microsoft Endpoint Manager – Intune
    as an application delivery package.


    The tool does everything automatically, so instead of manually checking application
    and deployment types, the tool does it in a bulk manner for you and, by way of
    output, it creates the .intunewin file for you.


    You can download the tool for free here. As mentioned previously, it is community-driven,
    meaning it’s not officially supported by Microsoft support: https://github.com/byteben/win32App-Migration-Tool.


    This is great work by ByteBen – an Enterprise Mobility MVP. The tool runs in PowerShell
    with verbose logging onscreen:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_318_0.png)


    Figure 8.37 – Win32 App Migration Tool


    This concludes the section about Win32 apps in Microsoft Intune. In the next section,
    we will cover Microsoft 365 apps in depth.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Deploying Microsoft 365 apps


    Office Click-to-Run is the new way of deploying Microsoft 365 Apps – Office to
    your endpoints. The installation takes place in the following five different stages,
    as the following example describes, and involves active downloading from the internet.
    Therefore, the installation elements are very small.


    Microsoft 365 apps are not like other apps in Microsoft Intune, as it is a policy
    that is deployed to the managed devices. The policy is similar to other CSPs deployed
    through the MDM channel to the device:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_319_0.png)


    Figure 8.38 – Office CSP


    As it is a policy and not a Win32 app, that is also the reason why you cannot
    use it as a dependency in a Win32 app. The CSP writes to the reg key Computer\HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\OfficeCSP,
    where it created a default key with the value http://go.microsoft.com/fwlink/?LinkID=829801,
    at which point the setup.exe file downloads the file to the local device together
    with the XML file stored in the same registry location with a GUID.


    The combination of setup.exe/configure [the name of the Microsoft 365 Apps XML
    file] will then start downloading all the binaries from Office CDN (the default
    option in the Microsoft Intune UI and configuration XML).


    Once installation is complete, the FinalStatus reg key will be updated as follows:


    +   - When status = 0: 70 (succeeded)

    +   - When status != 0: 60 (failed)'
  merge: -1
  img_proc: true

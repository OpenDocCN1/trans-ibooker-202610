- pgno: 219
  md: '![](img/a3e9f26159d3739e434fe676b2987c1d_219_0.png)


    Figure 6.18 – Update ring policy


    **Option to check for Windows updates** is a setting in Windows Update that, when
    enabled, lets device users check the update service for updates.


    For **Require user approval to dismiss restart notification**, specify the method
    by which the auto-restart required notification is dismissed. For the best end
    user experience, set this to **Yes**, but when your end users are in control,
    it can slow down the update compliance for your devices. It is recommended to
    leave it as the default: **No**. You can find the settings in the following screenshot:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_219_1.png)


    Figure 6.19 – Update ring policy


    For **Remind user prior to required auto-restart with dismissible reminder (hours)**,
    specify the period for auto-restart warning reminder notifications. Allowed values
    are **2, 4, 8, 12, or 24**. The default value is 4 hours. The recommendation is
    to leave it blank.


    For **Remind user prior to required auto-restart with permanent reminder (minutes)**,
    specify the period for auto-restart imminent warning notifications. Allowed values
    are **15, 30, or 60**. The default value is 15. The recommendation is to leave
    it blank.


    **Change notification update level** specifies what Windows Update notifications
    users see. The recommendation is to set it to **Use the default Windows Update
    notifications**, so that the end user gets as many notifications as possible and
    has the option to take action on this accordingly.'

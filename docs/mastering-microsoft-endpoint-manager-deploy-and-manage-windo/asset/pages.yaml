- pgno: 148
  md: 'Now, let''s cover monitoring and analytics.


    # Monitoring and analytics


    Ensuring that the performance and quality level of your cloud PC environment is
    good is just as (or perhaps even more) important as the implementation. Users
    need to be happy about their cloud PC and it should not impair their productivity.


    Windows 365/cloud PC seamlessly integrates with all the monitoring and analytics
    capabilities that you use today for your physical endpoints. This means that you
    can easily distinguish between whether the problem is active on the physical endpoint
    or within the cloud PC session.


    You will learn more about monitoring in Chapter 14, Monitoring and Endpoint Analytics,
    where we will take a much deeper dive into the specific metrics of ensuring the
    performance and quality of your Windows 365/cloud PC environment both proactively
    and reactively!


    Here''s a quick preview list of the reports/dashboards that are available at the
    time of writing:


    +   - Startup performance

    +   - Proactive remediations

    +   - Recommended software

    +   - Application reliability

    +   - Resource performance

    +   - Remoting connection:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_148_0.png)


    | Sign-in phase | Avg time per sign-in (sec) | Percent of sign-ins | Avg time
    per phase (sec) |

    |---|---|---|---|

    | Remoting sign-in ⓘ | 23.76 | 100 | 23.76 |

    | Core sign-in ⓘ | 226.8 | 400 | 56.7 |

    | Core boot ⓘ | 78.17 | 300 | 26.06 |


    Figure 4.71 – Sign-in time – logon duration, Endpoint Analytics'
  merge: -1
  img_proc: true

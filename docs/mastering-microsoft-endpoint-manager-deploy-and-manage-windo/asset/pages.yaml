- pgno: 90
  md: 'In the following screenshot, see the list of roles available in the Microsoft
    Endpoint Manager admin center portal:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_90_0.png)


    Figure 3.11 – Available Cloud PC roles in Microsoft Endpoint Manager


    Assign them directly to your users or Azure AD groups to make them more dynamically
    available.


    # The Watchdog service


    We shared earlier the vision of Windows 365, making things easier to use as a
    replacement for complex VDI-related infrastructure. The Watchdog service is the
    canary in the coal mine and is a great example of taking care of work that you
    normally must troubleshoot yourself.


    After you have finished with the configuration of the on-premises network connection
    (explained later in this chapter in more detail), the Watchdog service will check
    your environment for all the prerequisites to use Windows 365, so think about
    the following items:


    +   - Checking on service URLs

    +   - Network access

    +   - DNS resolving'
  merge: -1
  img_proc: true
- pgno: 91
  md: '+   - Rights to create computer accounts in the right Organization Unit

    +   - Azure AD Connect configuration

    +   - Subnet range – are there enough IP addresses available for your deployment?

    +   - Endpoint connectivity (MEM and AV service URLs)


    The other great thing about this feature/service is that it constantly runs in
    the background. For example, when something changes in your environment, it will
    try to fix it for you – or send you, as the IT admin, a notification with the
    resolution of the problem!


    In the following screenshot, you can find the result of a successful Watchdog
    check. You see that it outlines all the requirements for a successful Windows
    365 deployment, and more:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_91_0.png)


    Figure 3.12 – Watchdog service – checks


    # Optimized Teams on Windows 365


    The image gallery – Windows 10 Enterprise images that Microsoft has prepared –
    includes all the software that is needed to offer an optimized Teams experience
    as part of your Cloud PC. As an IT admin or user, you only need to install and
    configure the Microsoft Teams application and then you are ready to use it.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'The main benefit of this approach is that you set up Teams audio and video
    calls directly, peer to peer, from your physical endpoint to the other person,
    which effectively creates the same experience as you would have on a physical
    endpoint running Microsoft Teams.


    Some of the key benefits of the optimizations are the following:


    +   - High-performance peer-to-peer streaming facilitated by WebRTC – traffic
    will flow peer-to-peer and be rendered via the endpoint.

    +   - Devices will be redirected as the same hardware device, providing better
    hardware redirection support.

    +   - On Windows 10 clients, all the benefits of the modern media stack, including
    hardware video decoding.


    # Microsoft Edge


    Microsoft Edge Chromium has proven to be very fast, and its alignment with other
    Microsoft services, such as Microsoft Endpoint Manager, to set policies as well
    as the cross-platform support for the app to sync, for example, personal history
    and favorites settings, has been greatly received. This resulted in Edge being
    the default browser in Windows 10 Enterprise to date.


    # Sleeping tabs


    The Edge Engineering team added, not so long ago, sleeping tabs to Edge Chromium
    as a new native feature of Edge. This feature makes it possible to reduce RAM
    usage per tab within your browser while you have it in inactive mode. There is
    also a decrease in CPU utilization while you use this feature.


    The feature has been built on top of the core of Chromium''s freezing technology.
    Freezing pauses a tab''s script timers to minimize resource usage. A sleeping
    tab resumes automatically when clicked, which is different than discarded tabs,
    which require the page to fully be reloaded. This setting is enabled by default
    and is set to 1 hour.


    # Startup boost


    Startup boost makes your browser start up to 41% faster! When working and browsing
    online, speed matters. Startup boost maximizes your computer''s performance by
    significantly reducing the time it takes to open the browser after a device reboot
    or reopening the browser. Initial tests show startup times improve from between
    29% and 41% with this feature.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'This setting is by default enabled within our marketplace images and works
    on all Cloud PCs starting with 4 GB RAM upward.


    The following screenshot is the System settings menu within Microsoft Edge. You
    can see both Startup boost and Save resources with sleeping tabs enabled:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_93_0.png)


    Figure 3.13 – Startup boost and sleeping tabs


    # Screen capture protection


    The screen capture protection feature prevents sensitive information from being
    captured on the client endpoints. When you enable this feature, remote content
    will be automatically blocked or hidden in screenshots and screen shares.


    It will also be hidden from malicious software that may be continuously capturing
    your screen''s content. We recommend you disable clipboard redirection to prevent
    the copying of remote content to endpoints while using this feature.


    To enable the screen capture protection feature, you only have to run the following
    command to add the designated registry key to enable the feature in your image:'
  merge: -1
  img_proc: true

- pgno: 476
  md: '# Conditional Access


    Conditional Access is the tool used by AAD to bring signals together, make decisions,
    and enforce organizational policies. It is at the heart of the new identity-driven
    control plane.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_476_0.png)


    Figure 13.14 – Conditional Access


    Administrators must have two primary goals:


    +   - Empower users to be productive wherever and whenever.

    +   - Protect the organization''s assets.


    You can apply the right access controls when needed to keep your organization
    secure and stay out of your users'' way when not needed with the help of Conditional
    Access policies.'
  merge: -1
  img_proc: true
- pgno: 477
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 478
  md: 'The following screenshot is an example of configuring filters based on AAD
    groups:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_478_0.png)


    Figure 13.16 – Including users and groups


    Including and excluding users and group assignments can be configured to fit the
    access control your company needs.


    Next, we will look at cloud apps in a Conditional Access policy.


    # Cloud apps


    Cloud apps are AAD Enterprise applications that represent the Microsoft cloud
    or third-party applications. This could be, for example, Windows 365, a Software
    as a Service (SaaS) application, or Office 365 services.


    To enforce different Conditional Access settings per cloud app(s), you can create
    different policies that only apply to that specific application to customize access:'
  merge: -1
  img_proc: true
- pgno: 479
  md: '# Select


    Cloud apps


    ![](img/a3e9f26159d3739e434fe676b2987c1d_479_0.png)


    Figure 13.17 – Selecting cloud apps


    Cloud apps most likely are named after the service; otherwise, you have to select
    them according to the right app ID, such as 0af06dc6-e4b5-4f28-818e-e78e62d137a5.


    Aside from filtering on cloud apps, you could also apply Conditional Access settings
    during actions, for example, the process of registering and joining devices to
    MEM. You must then select user actions instead of cloud apps:


    +   - Register security information

    +   - Register or join devices


    Control user access based on all or specific cloud apps or actions. Learn more


    Select what this policy applies to


    User actions


    Select the action this policy will apply to


    Register security information


    Register or join devices


    Figure 13.18 – User actions'
  merge: -1
  img_proc: true
- pgno: 480
  md: 'Next, we will look at conditions in a Conditional Access policy.


    # Conditions


    There are four different types of conditions to configure:


    +   - **Device platforms**: Control user access from different device platforms;
    for example, this policy should only apply when users log on from Android, Windows,
    macOS, iOS, or a Windows phone.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_480_0.png)


    Figure 13.19 – Including/excluding a platform


    +   - **Locations**: Control user access based on their physical location, for
    example, based on public IP allow-listing.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_480_1.png)


    Figure 13.20 – Include/exclude locations'
  merge: -1
  img_proc: true
- pgno: 481
  md: 'You can configure IP authorization – IP lists in Conditional Access – in the
    **Named locations** menu.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_481_0.png)


    Figure 13.21 – Conditional Access – Named locations


    +   - **Client apps:** Control user access to target specific client applications
    not using modern authentication.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_481_1.png)


    Figure 13.22 – Select the client apps this policy will apply to'
  merge: -1
  img_proc: true
- pgno: 482
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 483
  md: 'Setting **Grant access** can be configured to have either all or some controls.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_483_0.png)


    Figure 13.24 – Grant access


    MFA should be mandatory; add other settings as you like, for example, controlling
    access from devices that aren''t MEM-managed.


    Control user access based on session controls to enable limited experiences within
    specific cloud applications:


    +   - **Use app-enforced restrictions**: App-enforced restrictions might require
    additional admin configurations within cloud apps. The restrictions will only
    take effect for new sessions.

    +   - **Access control settings**: Conditional Access App Control enables user
    app access and sessions to be monitored and controlled in real time based on access
    and session policies. Access and session policies are used within the cloud app
    security portal to further refine filters and set actions to be taken on a user.

    +   - **Sign-in frequency**: This is the time period before a user is asked to
    sign in again when attempting to access a resource. The default setting is a rolling
    window of 90 days, that is, users will be asked to re-authenticate on the first
    attempt to access a resource after being inactive on their machine for 90 days
    or longer.'
  merge: -1
  img_proc: true
- pgno: 484
  md: '> Tip

    > This setting could be beneficial in enforcing MFA every hour on **bring-your-own-device
    (BYOD)** devices to ensure that access expires after that time!


    +   - **Persistent browser session**: A persistent browser session allows users
    to remain signed in after closing and reopening their browser window:


    > Note

    > Persistent browser session only works correctly when **All cloud apps** is selected


    +   - This does not affect token lifetimes or the sign-in frequency setting.


    +   - This will override the **Show option to stay signed in** policy on company
    branding.


    +   - **Never persistent** will override any persistent SSO claims passed in from
    federated authentication services.


    +   - **Never persistent** will prevent SSO on mobile devices across applications
    and between applications and the user''s mobile browser.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_484_0.png)


    Figure 13.25 – Session control


    This concludes the walk-through of the Conditional Access policies that you can
    configure to secure your corporate data. Next, we will show an option to prevent
    users from carrying out AAD device registration on their BYOD devices.'
  merge: -1
  img_proc: true
- pgno: 485
  md: '# Preventing users from carrying out AAD device registration


    To block your users from adding additional work accounts to your corporate domain-joined,
    AAD-joined, or HAADJ Windows 10 devices, enable the following registry key. This
    policy can also be used to block domain-joined machines from inadvertently getting
    AAD registered with the same user account: HKLM\SOFTWARE\Policies\Microsoft\Windows\WorkplaceJoin,
    "BlockAADWorkplaceJoin"=dword:00000001.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_485_0.png)


    Figure 13.26 – Use this account everywhere on your device


    There is no central way to prevent a user from registering their BYOD device in
    AAD. If AAD automatic MDM enrollment is configured and the checkmark for Allow
    my organization to manage my device is set, the device will be enrolled into Microsoft
    Intune. Next, we will take a look at self-service password reset (SSPR).


    # Self-service password reset


    The SSPR feature allows businesses to give users the ability to reset their own
    passwords without any interaction with the service desk. This could massively
    reduce the number of support tickets in your organization as most users can recover
    themselves.'
  merge: -1
  img_proc: true
- pgno: 486
  md: 'When a user enters their password too many times incorrectly, the account will
    go into a locked state. With the SSPR service, the end user can then change the
    password and will be prompted for MFA during that process.


    > Note

    > Before users can unlock their account or reset a password, they must register
    their contact information.


    SSPR requires an AAD Premium P1 license, which comes with Microsoft 365 E3 or
    higher.


    You must go to AAD in the Azure portal (https://portal.azure.com/#home) to activate
    the feature.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_486_0.png)


    Figure 13.27 – Self service password reset enabled


    It''s also possible to make SSPR available for AAD group members only – via the
    Selected option in the menu.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_486_1.png)


    Figure 13.28 – Password reset – selecting a group for scoping


    Next, we will take a look at AAD password protection.'
  merge: -1
  img_proc: true

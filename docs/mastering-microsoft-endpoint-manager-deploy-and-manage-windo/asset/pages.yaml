- pgno: 210
  md: '# When to use what solution


    It might be a bit confusing to understand when to use what management scenario
    for your organization, so here''s a quick table that clarifies this best:


    | Identity | Management | Provisioning |

    |---|---|---|

    | Active Directory only | Configuration Manager + tenant attach | OS deployment
    |

    | Hybrid AAD-joined | Microsoft Endpoint Manager''s Intune or tenant attach +
    co-management | Microsoft Endpoint Manager and other OS deployments (Configuration
    Manager/Microsoft Deployment Toolkit (MDT)) Windows 365 Cloud PC Enterprise |

    | AAD only | Co-management or Microsoft Endpoint Manager''s Intune | Windows Autopilot
    Windows 365 Cloud PC Business |


    This will help you to make the best decision that aligns with your current and
    perhaps future scenarios. The good thing is that Microsoft Endpoint Manager supports
    them all from a unified manageability perspective while you work on your journey
    toward full modern management in the Microsoft cloud!


    Devices that are co-managed, or devices that are enrolled in Intune, may be joined
    directly to AAD, or they may be hybrid AAD-joined but they must have a cloud identity.


    # Windows Update for Business


    In the first chapter, we covered an overview of Windows Update for Business. In
    this chapter, we will cover how to get it configured.


    When you have devices that use Windows Update for Business to manage and control
    the update workflow, there are several policies that are of interest. To maximize
    the update velocity while remaining mindful of user productivity impact, Microsoft
    suggests a specific set of policies with recommended values. In this section,
    we will walk through these policies and how to configure them.


    Windows Update for Business policies, in this section, apply to Microsoft Intune
    or co-managed devices with the Windows Update policies workload set to Microsoft
    Intune.'
  merge: -1

- pgno: 165
  md: 'You can see screenshots of errors in the Windows 11 installation process in
    the preceding figure. It detects the hardware requirements before starting the
    in-place upgrade process.


    There are also some other differences between Windows 10 and 11 that you must
    know before upgrading. You can find them in the following list:


    +   - Start is significantly changed in Windows 11, including the following key
    deprecations and removals:

    +     - Live tiles

    +     - Dynamic previews

    +     - Named groups and folders of apps

    +   - Pinned apps and sites will not migrate when upgrading from Windows 10.

    +   - New modern icons for Windows.

    +   - Teams is integrated into the OS.

    +   - The Windows Store app has been updated and allows the installation of Win32
    applications.

    +   - A new feature with the flexibility of multiple windows and the ability to
    snap apps side by side.

    +   - Live tiles are no longer available. For glanceable, dynamic content, please
    check out the new widgets feature.

    +   - Tablet mode is removed and new functionality and capability are included
    for keyboard attach and detach postures.

    +   - Taskbar functionality has changed, including the following:

    +     - **People** is no longer present on the taskbar.

    +     - Some icons may no longer appear in the **system tray (systray)**, including
    previous customizations for upgraded devices.

    +     - Only alignment to the bottom of the screen is allowed.

    +     - Apps can no longer customize areas of the taskbar.

    +   - **Timeline** is removed. Some similar functionality is available in Microsoft
    Edge.

    +   - **Internet Explorer** is removed. Edge is the recommended replacement and
    includes IE mode, which may be useful in certain scenarios.

    +   - **Math Input Panel** is removed.'

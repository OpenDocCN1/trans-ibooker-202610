- pgno: 457
  md: '# # OneDrive and Storage Sense


    With Storage Sense, you are able to silently assist your Windows device in managing
    your storage, for example, to free up OneDrive caching space. OneDrive uses Files
    On-Demand to sync only the necessary data to your endpoint. As OneDrive caches
    the data locally, you might want to free up this caching space after a while.
    Storage Sense makes it possible to do this in line with your business preferences.


    OneDrive data always remains visible inside your profile, and only has to be downloaded
    again if you need to access it again and make changes.


    You can find Storage Sense in the **System** settings menu of Windows, under **Storage**.
    You can clean up data with the dropdown under **Content will become online-only
    if not opened for more than:**


    ![](img/a3e9f26159d3739e434fe676b2987c1d_457_0.png)


    Figure 12.9 – Cleaning the cache


    You could also do this only in the event of low space on the OS disk – in case
    of emergency:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_457_1.png)


    Figure 12.10 – Clean up schedules'
  merge: -1
  img_proc: true
- pgno: 458
  md: 'You could also use the feature to clean up your Downloads folder within your
    Windows profile. This is also very handy:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_458_0.png)


    Figure 12.11 – Downloads folder cleanup


    # Microsoft Edge


    Microsoft Edge is more and more becoming the mainstream browser for the vast majority
    of users. This is the result of hard work by the Edge engineering team within
    Microsoft as many features have been added lately to address customer feedback
    and make Edge ready for enterprise adoption.


    In the context of profile management, Microsoft Edge offers great things as well,
    because it supports the synchronization of all your browser-related data as part
    of your Azure AD credentials. This means that your history, favorites, password
    collections, settings, extensions, and open tabs will be stored for you in the
    Microsoft cloud.


    For example, you can have OneDrive KFM configured for your profile-related data
    inside your Windows profile to redirect your Documents, Pictures, and Desktop
    folders as a backup layer – and Edge does the same thing with your browser settings.
    Also, it''s important to note that the Edge browser-specific profile data is shared
    across all your devices that use Edge as the browser. Imagine switching from your
    physical or virtual endpoint to your Surface Duo or iPhone and continuing where
    you left off.


    During the initial configuration process, or at the first launch of Edge, you''ll
    be asked to log on with your Azure AD credentials. After that, it''ll ask you
    to sync your profile. After this first launch, it''ll now start saving your Edge
    profile data – from the second time you launch Edge, all your browser settings
    will be pre-loaded, and your Edge browser will look and feel exactly the same
    as on your other devices.


    You could also pre-set silent logons and auto-sync activation within Edge using
    group policies to enforce this setting to ensure profile synchronization.


    The setting to enable profile syncing manually in Edge looks as in the following
    screenshot:'
  merge: -1
  img_proc: true
- pgno: 459
  md: '![](img/a3e9f26159d3739e434fe676b2987c1d_459_0.png)


    Figure 12.12 – Edge profile sync option


    The following Edge-specific profile data will synchronize automatically after
    enabling the sync setting:


    +   - Favorites

    +   - Passwords

    +   - Form-fill data

    +   - History

    +   - Open tabs (sessions)

    +   - Settings (preferences)

    +   - Extensions


    Another option to highlight is the use of multiple profiles. For example, say
    you have your personal account for private usage, and your business account. You
    can simply create another profile and the personal profile will be completely
    isolated from the other one. Say goodbye to the limit of opening only one private
    mode session, or other browsers that you only use for this reason.


    You can also use the Browse as a guest option to use an isolated session without
    profile creation when you prefer not to save it to the online profile storage
    of your Azure AD account credential.'
  merge: -1
  img_proc: true

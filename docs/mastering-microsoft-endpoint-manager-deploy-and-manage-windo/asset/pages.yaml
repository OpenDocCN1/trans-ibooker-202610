- pgno: 456
  md: 'If you accidentally delete a file in your Windows profile, OneDrive automatically
    takes a file snapshot – and will always provide the option to restore within the
    next 30 days. See the following new message that appears:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_456_0.png)



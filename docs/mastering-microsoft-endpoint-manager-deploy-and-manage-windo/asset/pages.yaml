- pgno: 172
  md: '3. Make sure to select All for MDM user scope:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_172_0.png)


    Figure 5.7 – MEM admin center – MDM user scope


    Here''s what all the options for MDM user scope mean:


    +   - None: MDM automatic enrollment disabled.

    +   - Some: Select the groups that can automatically enroll their Windows devices.

    +   - All: All users can automatically enroll their Windows devices.


    > Important Note

    > Automatic MDM enrollment requires an Azure AD premium subscription.


    For Windows bring your own device (BYOD) devices (personal enrollment), the MAM
    user scope takes precedence if both the MAM user scope and the MDM user scope
    (automatic MDM enrollment) are enabled for all users (or the same groups of users).
    If you have configured them, the device will not be MDM-enrolled, and Windows
    Information Protection (WIP) policies will be applied.



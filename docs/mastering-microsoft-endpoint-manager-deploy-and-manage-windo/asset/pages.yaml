    In the next section, we will explain how you can carry out maintenance and cleanup
    actions on your OneDrive cache from Windows.


    # Windows 10 Storage Sense


    Windows 10 Storage Sense works with OneDrive to automatically free up space by
    taking locally available OneDrive files that you haven''t used recently and making
    them online-only again.


    Any files you haven''t used in the last 30 days can be set to online-only when
    your device runs low on free space. You will also be able to schedule and define
    how often Storage Sense should run:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_456_1.png)


    Figure 12.8 – Storage Sense'
  merge: -1

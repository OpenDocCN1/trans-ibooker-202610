- pgno: 247
  md: 'In the following table, you can see the different types of settings and values
    that can be present in a Windows Autopilot object:


    | Setting | Value |

    |---|---|

    | User | UPN. |

    | User Friendly Name | Can be changed and it will be shown during OOBE provisioning.
    |

    | Serial number | Serial number. |

    | Manufacturer | Example: "Microsoft Corporation." |

    | Model | Example: "Surface Book 2." |

    | Device Name | Can be configured and the device will get this name as part of
    the onboarding process (will cause a reboot while the device name is being set
    during OOBE). |

    | Group Tag | Blank unless it is set in the autopilot upload file. Can be changed
    and will affect a dynamic AAD group. |

    | Profile status | Assigned or not assigned. |

    | Assigned profile | Name of the profile assigned to the device. |

    | Date assigned | Timestamp of when the profile was assigned to the device. |

    | Enrollment state | Specifies whether the device has enrolled in Microsoft Intune.


    Enrolled or Not enrolled. |

    | Associated Intune device | N/A means that there''s no associated device. N/A
    is the state until the device has gone through the Autopilot process for the first
    time, or the Intune object has been deleted. |

    | Associated Azure AD device | N/A means that there''s no associated device AAD
    object. |

    | Last contacted | Timestamp of when the device was last contacted.

    Doesn''t mean that the device has never been in contact with Microsoft Intune.
    |

    | Purchase order | Purchase order ID is sent from the OEM when they are uploading
    devices on behalf of your organization. |'
  merge: -1

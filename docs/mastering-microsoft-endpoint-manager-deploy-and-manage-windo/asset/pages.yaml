- pgno: 587
  md: '# 16

    Troubleshooting Microsoft Endpoint Manager


    In this chapter, you will learn about the methods for requesting help while you
    are configuring your Microsoft Endpoint Manager (MEM) environment and, when you
    run into issues, learn how to resolve them either by yourself or with a little
    bit of help from Microsoft Support.


    In this chapter, we''ll go through the following topics:


    +   - Troubleshooting MEM

    +   - Service health and message center

    +   - Troubleshoot blade in MEM

    +   - Troubleshooting Windows 10 MEM enrollment

    +   - Windows 10 device diagnostics

    +   - Troubleshooting application delivery

    +   - Troubleshooting Autopilot

    +   - Windows 11 Autopilot diagnostics page'
  merge: -1
  img_proc: true
- pgno: 588
  md: '+   - Troubleshooting locating a Windows device

    +   - Troubleshooting Microsoft Edge


    # Troubleshooting MEM


    Under the **Tenant admin** blade, you have **Tenant status**. This is where some
    important information about your tenant is stored, such as the following:


    +   - **Tenant name and Tenant location:** Here, you can see what part of the
    world your tenant is in—in this case, Europe.

    +   - **MDM authority:** MDM stands for **mobile device management**. This is
    not as important as it was in the past.

    +   - **Service release:** This is important. Here, you can follow whether your
    tenant has been upgraded to the latest service release.


    Intune is a service that Microsoft updates monthly, so depending on where your
    tenant is located, you may see that your version of Intune is updated before others,
    based on this deployment schedule:


    +   1. **Day 1: User interface (UI)** rolls out to the Asia Pacific region.

    +   2. **Day 2:** UI rolls out to Europe, the Middle East, and Africa.

    +   3. **Day 3:** UI rolls out to North America.

    +   4. **Day 4+:** UI rolls out to Intune for Government.


    The following screenshot shows an overview of the information stored in **Tenant
    status:**


    ![](img/a3e9f26159d3739e434fe676b2987c1d_588_0.png)


    *Figure 16.1 – Tenant status*


    **Connector status** is where you can see the status of Windows Autopilot sync,
    Microsoft Store for Business sync, and the Microsoft Defender for Endpoint connector,
    which all are Windows-related.'
  merge: -1
  img_proc: true
- pgno: 589
  md: 'You can also see the status of all the other connector types. There are three
    different statuses a connector can have, as outlined here:


    +   - **Unhealthy:**

    +     - The certificate or credentials have expired.

    +     - The last synchronization was 3 or more days ago.

    +   - **Warning:**

    +     - The certificate or credentials will expire within 7 days.

    +     - The last synchronization was more than 1 day ago.

    +   - **Healthy:**

    +     - The certificate or credentials won''t expire within the next 7 days.

    +     - The last synchronization was less than 1 day ago.


    You can see an overview of this in the following screenshot:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_589_0.png)


    Figure 16.2 – Connector status'
  merge: -1
  img_proc: true

- pgno: 242
  md: 'Once you proceed and enter the AAD credentials of your user who has the Autopilot
    and other Microsoft Endpoint Manager profile configurations assigned to their
    account, the device enrollment setup process starts to kick in, as in the following
    example as part of Windows 11:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_242_0.png)


    Figure 7.5 – Autopilot Windows 11 device setup


    In the next section, we''re going to explain how you can add your devices to Windows
    Autopilot with the hardware ID as a unique indicator.


    # Uploading the hardware ID to Windows Autopilot


    The Windows Autopilot hardware hash is a 4K string retrieved from a running Windows
    10 OS on the device by running `Get-WindowsAutoPilotInfo.ps1`:


    ```

    ```powershell

    New-Item -Type Directory -Path "C:\Temp\Autopilot"

    Set-Location -Path "C:\Temp\Autopilot"

    Set-ExecutionPolicy -Scope Process -ExecutionPolicy Unrestricted

    Install-Script -Name Get-WindowsAutoPilotInfo

    Get-WindowsAutoPilotInfo.ps1 -OutputFile AutoPilotHWID.csv

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'Windows Autopilot device registration can be done within your organization
    manually, for testing, or for devices your organization already owns.


    It is used to collect the hardware identity of devices (hardware hashes) and upload
    this information in a **Comma-Separated Values (CSV)** file to the Windows Autopilot
    service from the Microsoft Endpoint Manager admin center, and also to capture
    the hardware hash for manual registration, which requires booting the device into
    Windows 10. Therefore, this process is intended primarily for testing and evaluation
    scenarios.


    The recommended way to get your brand-new devices into the Windows Autopilot service
    is to have your OEM or a Microsoft **Cloud Solution Provider (CSP)** partner upload
    the information.


    For *Microsoft Surface* or *HoloLens* devices, you can open a support case with
    Microsoft Devices Autopilot Support: https://prod.support.services.microsoft.com/supportrequestform/0d8bf192-cab7-6d39-143d-5a17840b9f5f.
    You only need to provide the following information:


    +   - AAD tenant ID

    +   - AAD domain name

    +   - Proof of ownership

    +   - Device serial numbers


    This process can also be used to deregister Autopilot from your tenant.


    You can have a CSP partner upload your devices into Windows Autopilot with very
    little information compared to when you do it in Microsoft Intune yourself:


    +   - `ProductKey only`

    +   - `SerialNumber + OemManufacturerName + ModelName`


    Let''s describe each of these fields:


    +   - `ProductKey`: This is the Windows product ID, that is, the PKID, a 13-digit
    number that corresponds to the Windows product key that was inserted into the
    firmware of the device at the time of manufacture (using OAv3).

    +   - `SerialNumber`: This is the unique value assigned by the OEM to each device
    manufactured.

    +   - `OemManufacturerName`: This is the value specified by the OEM in the **System
    Management Basic Input/Output System (SMBIOS)** firmware of the device, for example,
    *Microsoft Corporation* or LENOVO (more on that later).'
  merge: -1
  img_proc: true
- pgno: 244
  md: '+   - ModelName: This is the value specified by the OEM in the SMBIOS firmware
    of the device for the particular model, for example, *Surface Pro 7*.


    To register Windows Autopilot devices manually, the process is as follows.


    You can have up to 500 rows in the CSV file. The header and line format are shown
    next, which include the device serial number, the Windows product ID, the hardware
    hash, the group tag, and the assigned user:


    ```

    <serialNumber>,<ProductID>,<hardwareHash>,

    <optionalGroupTag>,<optionalAssignedUser>

    ```


    > **Important Note**

    > Import Windows Autopilot devices from a CSV file. When assigning users in the
    CSV file, make sure that you are assigning the correct **User Principal Name (UPN)**
    as there is no validation of UPNs during the import process. This means that if
    an incorrect UPN is in the CSV file, a user will not be assigned to the Windows
    Autopilot device object.


    Assigning a user to a specific Autopilot device does not work if you are using
    **Active Directory Federation Services (ADFS)**.


    # Windows Autopilot Deployment Program


    ![](img/a3e9f26159d3739e434fe676b2987c1d_244_0.png)


    Figure 7.6 – Windows Autopilot Deployment Program


    Go to the Microsoft Endpoint Manager admin center, https://endpoint.microsoft.com/,
    and choose Devices | Windows | Windows enrollment | Devices.'
  merge: -1
  img_proc: true

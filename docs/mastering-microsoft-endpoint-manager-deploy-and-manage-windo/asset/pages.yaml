    Windows devices can be grouped by a correlator ID when enrolling using Autopilot
    for existing devices through Configuration Manager. The correlator ID is a parameter
    of the Autopilot configuration file. The enrollmentProfileName AAD device attribute
    is set to equal OfflineAutopilotprofile-<correlator ID> automatically. So, arbitrary
    AAD dynamic groups can be created based on the correlator ID by using the enrollmentProfileName
    attribute.


    To create a Windows Autopilot profile, perform the following steps:


    +   1. In the Microsoft Endpoint Manager admin center, https://endpoint.microsoft.com/,
    choose Devices | Windows | Windows enrollment | Deployment profiles.

    +   2. Then, choose Create profile | Windows PC.

    +   3. In the Enter a Name for the Profile field, enter Autopilot Default profile.

    +   4. Set Convert all targeted devices to Autopilot to No.

    +      Select Yes to register all targeted devices to Autopilot if they are not
    already registered. The next time registered devices go through the Windows OOBE,
    they will go through the assigned Autopilot scenario.

    +   5. Leave every other setting as its default unless you have a reason to change
    it.


    In the OOBE step, configure the following values and then click Next:


    | Setting | Value |

    |---|---|

    | Deployment mode | User-Driven. |

    | Join to Azure AD as | Azure AD joined. |

    | Microsoft Software License Terms | Hide. |

    | Privacy settings | Hide. |

    | Hide change account options | Hide. |

    | User account type | Standard. |

    | Allow White Glove OOBE | No. |'

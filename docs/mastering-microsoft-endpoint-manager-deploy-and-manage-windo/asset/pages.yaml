  md: 'It is recommended to configure other profiles, such as Windows Defender, Windows
    Update for Business, and other policies that may be relevant to your kiosk scenario.


    This scenario is also possible with kiosk mode for multiple apps; it just requires
    a different configuration in the kiosk profile in Microsoft Endpoint Manager.


    # Autopilot Reset


    Windows Autopilot Reset is only for AAD-joined devices.


    Windows Autopilot Reset takes the device back to a business-ready state, allowing
    the same user or a new user to sign in and get productive quickly and simply.
    The first user who signs in to the device following the Windows Autopilot reset
    becomes the new primary user and owner of the device.


    Here is what makes Windows Autopilot Reset so special:


    +   - It removes personal files, apps, and settings.

    +   - It maintains the device''s identity connection to AAD, so it keeps the same
    AAD object.

    +   - It maintains the device''s management connection to Intune, so it keeps
    the same Microsoft Intune Windows object.


    When using Windows Autopilot Reset, the process automatically keeps the following
    information from the device:


    +   - It keeps the region, language, and keyboard that are configured on the device.

    +   - It keeps the Wi-Fi connection details.

    +   - It provisions packages previously applied to the device.

    +   - A provisioning package is present on a USB drive when the reset process
    is started.

    +   - It retains AAD device membership and Microsoft Intune enrollment information.


    Windows Autopilot Reset will block the user from accessing the desktop until this
    information is restored, including reapplying any provisioning packages until
    the Microsoft Intune sync is completed.


    Perform the following steps in the Microsoft Endpoint Manager admin center, https://endpoint.microsoft.com/:


    +   1. Choose Devices | Windows | Configuration Profiles.

    +   2. Choose Create Profile.'
  merge: -1
  img_proc: true

- pgno: 557
  md: 'More information about the value-adding solution briefs and contact details
    can be found here: http://aka.ms/uppartners.


    # Configuring Universal Print


    Let’s jump into the configuration flow of Universal Print. In this section, we
    explain everything you need to know to purchase licenses and configure and assign
    Universal Print printers to your end users. Let’s start:


    +   1. Go to the Azure portal via portal.azure.com and log on as either the Global
    Administrator or with the account with the Printer admin/tech role assigned.

    +   2. Search for Universal Print:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_557_0.png)


    Figure 15.7 – Universal Print – Azure portal


    +   3. Are you getting this error? Make sure you have a Universal Print license
    assigned.


    ![](img/a3e9f26159d3739e434fe676b2987c1d_557_1.png)


    Figure 15.8 – Universal Print subscription prompt


    +   4. Set up the Universal Print connector to connect to your on-premises location/printers.


    Your own printers are not able to connect with Universal Print directly and require
    a bridge/proxy, which has to be done with the Universal Print connector.


    > **Important note**

    > You can also install the software on one of your legacy print servers to connect
    it to the Universal Print service.


    +   5. Install the Universal Print connector on your local physical desktop, that
    is, on the same network as your printers.'
  merge: -1

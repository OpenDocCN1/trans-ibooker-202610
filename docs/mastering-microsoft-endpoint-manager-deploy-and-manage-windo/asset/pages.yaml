    # Company Portal


    Company Portal is a self-service tool for end users so that they can install apps
    that the IT admin has made available for end users.


    For Windows 10 Autopilot-provisioned devices, it is recommended that you associate
    your Microsoft Store for Business account with Intune. The Company Portal app
    will be installed in the device context when assigned to the Autopilot group and
    will be installed on the device before the user logs in. You can choose to install
    the Company Portal (offline) app using the steps shown next:


    +   1. In the Microsoft Endpoint Manager admin center, `https://endpoint.microsoft.com/`,
    choose **Apps | Windows**.

    +   2. From the list of Windows apps, select **Company Portal** (Offline).

    +   3. Assign Company Portal as a required app to your selected Autopilot device
    group.

    +   4. As this is an offline app, be sure to change **License type** to **Device
    licensing**.


    # Configuring automatic BitLocker encryption for Autopilot devices


    With Windows Autopilot, BitLocker encryption settings can be configured to be
    applied before automatic encryption starts. This configuration ensures that the
    default encryption algorithm is not applied automatically. Other BitLocker policies
    can also be applied before automatic BitLocker encryption begins.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'BitLocker automatic device encryption uses BitLocker drive encryption technology
    to automatically encrypt internal drives after the user completes the OOBE on
    *Modern Standby* or **Hardware Security Testability Specification (HSTI)**-compliant
    hardware.


    In the case of Modern Standby requirements or HSTI validation, this requirement
    is met by one of the following:


    +   - Modern Standby requirements are implemented. These include requirements
    for **Unified Extensible Firmware Interface (UEFI)** Secure Boot and protection
    from unauthorized **Direct Memory Access (DMA)**.

    +   - Starting with *Windows 10 version 1703*, this requirement can be met through
    an HSTI test.

    +   - The Platform Secure Boot self-test (or additional self-tests as configured
    in the registry) must be reported by the HSTI as implemented and passed.

    +   - Excluding Thunderbolt, the HSTI must not report any non-allowed DMA buses.

    +   - If Thunderbolt is present, the HSTI must report that Thunderbolt is configured
    securely (the security level must be SL1 – *User Authorization* or higher).


    *Windows 10 (Modern Standby)* expands the *Windows 8.1 Connected Standby power
    model*. Connected Standby, and consequently Modern Standby, enable an instant
    on/instant off user experience, like smartphone power models. Just like a phone,
    the S0 low-power idle model enables the system to stay connected to the network
    while in a low-power mode.


    By leveraging the `powercfg /a` command, you can see whether your device supports
    Modern Standby (S0 Low Power Idle):


    ![](img/a3e9f26159d3739e434fe676b2987c1d_267_0.png)


    Figure 7.19 – powercfg'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Important Note


    BitLocker automatic device encryption starts during the OOBE experience. However,
    BitLocker drive protection is enabled only after users sign in with an AAD account.
    Until then, protection is suspended, and data is not protected.


    The BitLocker encryption algorithm is used when BitLocker is first enabled. The
    algorithm sets the strength for full volume encryption. Available encryption algorithms
    are AES-CBC 128-bit, AES-CBC 256-bit, XTS-AES 128-bit, and XTS-AES 256-bit encryption.
    BitLocker will use the default encryption method of XTS-AES 128-bit or the encryption
    method specified by any setup script.


    To make sure the BitLocker encryption algorithm you want is set before automatic
    encryption occurs for Autopilot devices, make sure the following requirements
    are fulfilled:


    +   - The device contains a **Trusted Platform Module (TPM)**, either TPM 1.2
    or TPM 2.0.

    +   - UEFI Secure Boot is enabled.

    +   - Platform Secure Boot is enabled.

    +   - DMA protection is enabled.

    +   - Configure the **Encryption method** settings in the Windows 10 Endpoint
    Protection profile to the encryption algorithm you want.

    +   - Assign the policy to your Autopilot device group. The encryption policy
    must be assigned to devices in the group, not users.

    +   - Enable the Autopilot ESP for these devices. If the ESP is not enabled, the
    policy won''t apply before encryption starts.


    # Important Note


    When you enable EncryptionMethodByDriveType, you must specify values for all three
    drives (OS, fixed data, and removable data); otherwise, it will fail (500 return
    status). For example, if you only set the encryption method for the OS and removable
    drives, you will get a 500 return status.


    Create the BitLocker policy in Intune for automatic BitLocker encryption as follows:


    +   1. In the Microsoft Endpoint Manager admin center, `https://endpoint.microsoft.com/`,
    choose **Devices | Windows | Configuration profiles**.

    +   2. Choose **Create Profile**.'
  merge: -1
  img_proc: true
- pgno: 269
  md: "+   3. Select **Platform | Windows 10 and later**.\n+   4. Select **Profile\
    \ type | Templates | Template name | Endpoint Protection**.\n+   5. Select **Name\
    \ | Autopilot Bitlocker | Next**.\n+   6. Expand **Windows Encryption**.\n+  \
    \ 7. Select **Windows Settings | Encrypt devices | Require**.\n\n![](img/a3e9f26159d3739e434fe676b2987c1d_269_0.png)\n\
    \nThe BitLocker base settings should be as follows:\n\n+   1. Select **BitLocker\

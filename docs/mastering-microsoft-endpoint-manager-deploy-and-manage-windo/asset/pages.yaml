- pgno: 29
  md: '# 1


    # Introduction to Microsoft 365


    Understanding the fundamentals of a product is the most important thing for a
    successful deployment. Keeping your resources secure while leveraging other services
    within the Microsoft 365 product suite is what you will learn about in this chapter.


    In this chapter, we''ll go through the following topics:


    +   - Microsoft 365 services

    +   - Azure Virtual Desktop and Windows 365

    +   - Windows 10 and Windows 11


    # An introduction to Microsoft 365


    Microsoft 365 includes many services that you might use in your day job, whether
    as an IT professional or a non-technical user. The services help you to become
    more productive by simplifying tasks that would require a lot of work in on-premises
    environments. A great example would be the shift we''ve made from Exchange Server
    to Exchange Online.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# What do the services achieve?


    In this introductory section of the book, we will briefly explain the Microsoft
    365 core services and features that are relevant to the subject of this book,
    just to get a good baseline understanding of the differences between the various
    services. You''ll also learn about the purpose and benefits of each service.


    # Microsoft Endpoint Manager


    **Microsoft Endpoint Manager (MEM)** is the consolidation of Microsoft Intune
    and **Microsoft Endpoint Configuration Manager (MECM)**. It provides one holistic
    management experience while adding new functionality and intelligent actions without
    any complex migration or disruption of productivity.


    It provides a number of assets to aid your transition to modern management while
    also increasing customers'' security and helping them move to the cloud. MEM now
    also includes management capabilities for different endpoints:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_30_0.png)


    Figure 1.1 – MEM – service portfolio


    MEM helps you manage physical and virtual desktops, laptops, tablets, and other
    mobile devices, including iOS, Android, and macOS devices.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'MEM uses **Azure Active Directory (Azure AD)** as the primary identity and
    directory store. It replaces the traditional Active Directory, includes hybrid
    identity capabilities, and can also integrate with local management infrastructures
    such as Configuration Manager via Kerberos.


    Intune is extremely helpful for devices that are beyond the management scope of
    Group Policy, such as mobile phones, devices that are not **Active Directory Domain
    Services (AD DS)** domain members, or Windows 10 devices that are joined to Azure
    AD:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_31_0.png)


    Figure 1.2 – MEM – management console


    With MEM, you can achieve the following:


    +   - Let your organization''s employees use their personal physical and virtual
    endpoint devices to access organizational data (commonly known as **bring your
    own device (BYOD)**).

    +   - Manage organization-owned phones.

    +   - Control access to Microsoft 365 from unmanaged devices, such as public kiosks
    and mobile devices.

    +   - Help ensure that devices and apps that do connect to corporate data comply
    with security policies.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'For example, when a user attempts to open one of their **line-of-business (LOB)**
    apps on their phone or Windows 10 endpoint, Microsoft 365 checks with Azure AD
    to authenticate the user and verify whether that user can access the data from
    that app on that device. The granting of access depends on the following:


    +   - Conditional Access policies defined within Azure AD

    +   - Whether the app on that device complies with app configuration and data
    protection policies (Intune will confirm this for Azure AD)


    If the device and app are both compliant with all policies, Azure AD notifies
    Microsoft 365 that the data can be accessed.


    # Azure Virtual Desktop


    **Azure Virtual Desktop**, or AVD for short, is a Microsoft-managed platform-as-a-service
    offering on top of the Microsoft Azure cloud. Unlike traditional **virtual desktop
    infrastructure (VDI)** deployments, all the infrastructure services, such as brokering,
    web access, load balancing, management, and monitoring, are all set up for you
    as part of a control plane offering.


    # Windows 365 Cloud PC


    *A new way of experiencing Windows, on any device* – that''s the best way to describe
    the new Microsoft cloud service **Windows 365 Cloud PC**. Microsoft''s vision
    is to have people use Windows 365 the same way as they would manage a physical
    endpoint but with the flexibility of the cloud.


    Windows 365 is everything you need if you are looking for a simple way of running
    your Windows desktops in the cloud. You can decrease the costs and complexity
    of your environment by deploying and managing virtual endpoints in MEM; no additional
    VDI expertise or resources are needed. More about this will be explained later
    in this chapter.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# AVD and Windows 365 Cloud PC – shared responsibility model 1


    As with many cloud services, there is a shared set of security responsibilities.
    You have control and flexibility, and with that comes responsibility. If you are
    adopting Windows 365 Cloud PC, it''s important to understand that while some components
    come already secured for your environment, there are other areas where you will
    need to configure things to fit your organization''s security needs:


    | Responsibility | Traditional VDI | Azure Virtual Desktop | Windows 365 |

    |---|---|---|---|

    | Virtualization Management Plane | Customer/Partner | Microsoft | Microsoft |

    | Identity Platform (Azure AD) | Customer/Partner | Microsoft | Microsoft |

    | Platform Security | Customer/Partner | Microsoft | Microsoft |

    | Networking | Customer/Partner | Microsoft | Microsoft |

    | Data Center | Customer/Partner | Microsoft | Microsoft |

    | Image Management Platform (via MEM) | Customer/Partner | Customer/Partner |
    Microsoft |

    | Operating System Updates | Customer/Partner | Customer/Partner | Customer/Partner
    |

    | End User Devices (Physical PC/Mobile) | Customer/Partner | Customer/Partner
    | Customer/Partner |


    Table 1.1 – Shared responsibility model 1'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# AVD and Windows 365 Cloud PC – shared responsibility model 2


    The following table is an extension of the previous one, but it goes a bit deeper
    in terms of the differences in management experience:


    | Responsibility | Azure Virtual Desktop | Windows 365 |

    |---|---|---|

    | Identity | Azure AD | |

    | End User Devices (Mobile and PCs) | Windows, MacOS, iOS, Android, HTML, Linux
    SDK | |

    | Image Management and Supported Operating System | Windows Server, Windows 10,
    Windows 11 | Windows 10, Windows 11 |

    | Desktops | Personal and Pooled Desktops | Personal Desktops |

    | Deployment | Microsoft Azure and Endpoint Manager | Microsoft Endpoint Manager
    |

    | Configuration/Management/App Deployment | Microsoft Azure and Endpoint Manager
    | Microsoft Endpoint Manager |

    | Virtualization Control Plane | Azure Virtual Desktop | |

    | Physical Hosts | Microsoft Azure | |

    | Physical Network | Microsoft Azure | |

    | Physical Data Center | Microsoft Azure | |


    Table 1.2 – Shared responsibility model 2'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Windows 10 Enterprise


    Windows 10 Enterprise is one of the primary components of your Microsoft 365 subscription.
    Windows 10 meets the needs of large and midsize organizations, providing users
    and organizations with the tools, services, and support to enhance their personal
    and organizational productivity.


    Windows 10 also supports collaboration through Microsoft 365 apps, Microsoft Teams,
    Microsoft Whiteboard, and OneNote.


    Windows 10 helps improve productivity by providing faster, safer ways to get work
    done across all your users'' devices. Users can find apps, settings, documents,
    and messages by using enterprise search and Cortana, and use Timeline to see a
    chronological view of their activities and documents. Windows 10 has hardware
    options ranging from Surface Hub to the new always-connected PCs. These options
    support users wherever they need or prefer to work. Users can move from one device
    to another with Continue on PC in Microsoft Edge or take notes directly on a web
    page with Microsoft Ink. Windows 10 also comes with a robust set of accessibility
    features, such as a narrator, word prediction, and eye control.


    Windows 10 includes tools to help you customize device setup, manage all your
    devices, and control corporate identities, data, and apps on personal devices
    without impacting personal data. Maximize security and productivity by staying
    current with Windows 10. The way to update Windows has changed completely. Major
    upgrades that previously happened every few years have now changed to updates
    that happen twice a year. Windows-as-a-Service, the model for Windows 10, provides
    the flexibility and control needed to manage and distribute updates using your
    current method or by using Microsoft''s infrastructure.


    Windows 10 protects, detects, and automatically responds to the most advanced
    malware and hacking threats, while protecting user identities, devices, and your
    organization''s information. Windows 10 investigates threats as they evolve and
    automates remediation to make response times faster, thanks to Intelligent Security
    Graph (which uses security intelligence, machine learning, and behavioral analytics).
    These security solutions are built in and provide you with full security life
    cycle management for **endpoint protection** (EPP) and **endpoint detection and
    response** (EDR).'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'It also integrates with other Microsoft 365 services, which cover even the
    most complex multi-platform environments:


    +   - **Threat protection:** Windows 10 threat protection includes next-generation
    malware and hacking defense to help protect against threats, including zero-day
    attacks. It provides a hardened platform that can help prevent encounters, isolate
    threats, and prevent the execution of malicious apps and content. Windows 10 can
    detect and respond to the most advanced threats and automatically remediate them.

    +   - **Identity access:** Windows 10 protects user identities against pass-the-hash
    and pass-the-ticket attacks by helping you move to a world without passwords.
    **Windows Hello** is a biometric authentication tool that strengthens authentication
    and helps guard against potential spoofing.

    +   - **Information Protection:** Windows 10 makes it easy to protect data – whether
    that data is at rest or in use. Windows Information Protection helps protect sensitive
    information against leaks. When you combine Windows 10 with Azure Information
    Protection and Microsoft 365, you get a sophisticated solution that meets the
    highest requirements for data loss prevention with minimal input.


    # Windows 11 Enterprise


    Windows 11 is the next evolutionary phase of Windows; it is the most significant
    update to the Windows operating system since Windows 10. It offers a lot of innovations
    focused on enhancing end user productivity in a fresh experience that is flexible
    and fluid. Windows 11 is designed to support today''s hybrid work environment
    and is intended to be the most secure, reliable, connected, and performant Windows
    operating system ever.


    Windows 11 is built on the same foundation as Windows 10, so the investments you
    have made in tools for update and device management are carried forward.


    Windows 11 is Zero Trust ready and secure by design, with new built-in security
    technologies that will add protection from the chip to the cloud, while enabling
    productivity and new experiences. Key security features such as encryption, hardware-based
    isolation, and malware prevention are turned on by default. Going passwordless
    has also been made easier by simplifying the steps to deploy Windows Hello for
    Business.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'To address the need for hybrid working in the market right now, location shouldn''t
    matter. Addressing the new *how, when,* and *where* we work demands simplicity
    and security changes in the Windows operating system as well as the delivery of
    Windows in a simpler way – from the cloud with Windows 365:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_37_0.png)


    Figure 1.3 – Windows 11


    You can have a highly secure and consistent experience for users, with all the
    necessary IT controls, that delivers updates in a non-disruptive way, combined
    with a new, modern look and feel – that''s the best way to describe what Windows
    10 offers in a nutshell.


    We will explain more about Windows 11 in *Chapter 6, Windows Deployment and Management.*'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Productivity Score


    The journey to digital transformation is supported by Productivity Score, which
    provides insights into how your organization uses Microsoft 365 and the technology
    experiences that support it. Your organization''s score reflects the effectiveness
    of your people''s work and technology and can be compared to benchmarks from organizations
    similar in size to yours.


    Productivity Score provides the following:


    +   - Metrics to help you see where you are on your digital transformation journey

    +   - Insights about your data to help you identify opportunities to improve productivity
    and satisfaction in your organization

    +   - Actions you can take to help your organization use Microsoft 365 products
    efficiently


    The following Productivity Score screenshot shows you the level of insights you
    get based on scoring metrics in the Microsoft 365 admin portal:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_38_0.png)


    Figure 1.4 – Productivity Score'
  merge: -1
  img_proc: true
- pgno: 39
  md: <!-- no content -->
  merge: -1

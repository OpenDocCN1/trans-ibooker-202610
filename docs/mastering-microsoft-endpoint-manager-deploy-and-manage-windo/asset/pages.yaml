- pgno: 40
  md: 'Your end-to-end experience can be dramatically improved by Endpoint Analytics
    and the benefits it brings. Another huge benefit is that all service costs are
    included; unlike the case with Azure Monitor, there is no need to pay for storage
    retention!


    # Desktop Analytics


    Desktop Analytics is an important part of the full MEM service; it is cloud-based
    and integrates with Configuration Manager. The service also provides different
    levels of insights and intelligence for IT administrators to make proactive decisions
    about the update readiness of your Windows 10 endpoints. The service combines
    data from your business with data aggregated from millions of devices connected
    to Microsoft cloud services.


    Here is a list of the different benefits of Desktop Analytics with Configuration
    Manager:


    +   - Create an inventory of apps running in your organization.

    +   - Assess app compatibility with the latest Windows 10 feature updates.

    +   - Identify compatibility issues and receive mitigation suggestions based on
    cloud-enabled data insights.

    +   - Create pilot groups that represent the entire application and driver estate
    across a minimal set of devices.

    +   - Deploy Windows 10 to pilot and production-managed devices.


    Here is an example screenshot of how security and feature updates come together
    in a single, unified experience in Desktop Analytics:'
  merge: -1
  img_proc: true
- pgno: 41
  md: '![](img/a3e9f26159d3739e434fe676b2987c1d_41_0.png)


    Figure 1.6 – Desktop Analytics – management console


    Now that we have talked about all the different enhancements to monitor and analyze
    your endpoints, we''re going to talk about the different Microsoft 365 services
    that you can use within your physical and cloud-managed desktops.


    # Microsoft 365 Apps (for Enterprise)


    Microsoft 365 Apps for Enterprise includes the Microsoft productivity suite of
    applications, such as Word, Excel, PowerPoint, Outlook, and Teams, for both Windows
    and Mac devices. Microsoft 365 Apps isn''t a web-based version of Office – instead,
    it''s a full version of Office that your users install and run on their devices.
    You can use the Office applications that come with Microsoft 365 Apps with the
    on-premises or online versions of Exchange, SharePoint, or Skype for Business.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'You can install Microsoft 365 Apps from a network share or directly from the
    internet. After it''s installed, you don''t have to be connected to the internet
    to use it. However, you''ll need to connect at least once every 30 days to ensure
    that your license is still active.


    Microsoft 365 Apps is updated either monthly or semi-annually with new features,
    security updates, and other quality updates from Microsoft. You can choose which
    frequency works best for your organization by selecting specific update channels.


    Microsoft 365 Apps has a few benefits over Office Professional Plus 2019, such
    as support for air-gapped devices and device-based activation, and organizations
    interested in Office 2019 should contact Microsoft for more information.


    # OneDrive for Business (part of Microsoft 365 Apps)


    Microsoft OneDrive is an enterprise file sharing service that allows you to easily
    store and securely access your files from all your physical, virtual, and mobile
    devices. You can work together with people from any location, regardless of whether
    they''re inside or outside your organization, while also exploiting comprehensive
    security capabilities to, for example, only allow data sharing based on several
    security baseline conditions. All your data in OneDrive is protected through advanced
    encryption while in transit and at rest in data centers.


    OneDrive enhances collaboration capabilities within Microsoft 365 apps by connecting
    you to your personal and shared files in Microsoft 365. With OneDrive on the web,
    desktop, or mobile, you can access all your personal files and any files shared
    with you by other people or teams, including files from Microsoft Teams and SharePoint.


    Another great feature is OneDrive cloud backup – also known as OneDrive folder
    backup (previously Known Folder Move). This service automatically syncs your `Desktop`,
    `Documents`, and `Pictures` folders on your physical or virtual endpoints to your
    OneDrive cloud storage. Your files and folders stay protected and are available
    from any device!


    # Microsoft Teams


    Microsoft Teams is a unified communications collaboration tool that brings different
    services together to modernize the way you work with colleagues and external businesses.
    Teams allows you to implement a chat-based workspace as part of your Windows 10
    physical and virtual PCs but also as a mobile app on various platforms, which
    helps you stay up to date both in the office and on the go.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Teams keeps your team in sync by sharing OneDrive and SharePoint documents,
    insights, and status updates while being able to manage important projects and
    easily locate people – from anywhere and on any device!


    With Microsoft Teams, you can do the following:


    +   - **Communicate through chat, meetings, and calls:** Host audio, video, and
    web conferences, and chat with anyone inside or outside of your organization.

    +   - **Collaborate with integrated Microsoft 365 apps:** Teams makes teamwork
    easy by allowing users to co-author and share files with popular Microsoft 365
    apps – from Microsoft Word to Microsoft Power BI.

    +   - **Customize your workplace and achieve more:** Using Teams, you can integrate
    apps from Microsoft and third-party partner services to meet your organization''s
    unique needs.

    +   - **Connect across devices:** Teams and Teams devices work well together for
    intelligent meeting and calling experiences. Find the right devices for your needs
    and bring your best ideas to life.


    # Microsoft Edge


    Microsoft Edge has been around for a while as the next modern iteration of Internet
    Explorer, first released in 2015. After 5 years, a new version of Edge was released,
    built on top of the open source software project Chromium. This uses the same
    core engine as the Google Chrome browser.


    Microsoft Edge has proven to be very fast. Its alignment with other Microsoft
    services such as MEM to set policies, as well as the cross-platform support for
    the app to sync data such as personal history and favorites settings, has been
    well received. This has resulted in Edge being the default browser for Windows
    10 to date.


    Microsoft Edge is available on Windows, macOS, iOS, Android, and Linux. You can
    choose what device you want to use with the same native Edge experience across
    different platforms.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Universal Print


    You might remember the following workflow – or still do it to this day: spin up
    a Windows Server environment, add the print server role, and start adding your
    printers and designated drivers to the server. Not very modern or efficient, is
    it? Universal Print offers the same, and more, features while also eliminating
    the need for on-premises infrastructure. It enables you to manage printers directly
    through a centralized portal in Microsoft Azure. Say goodbye to installing (and
    maintaining) printer drivers on devices and/or golden images. As a bonus, everything
    works with Azure AD. This means that users can use the same set of credentials
    they use for other Microsoft services, whether they log on to a physical desktop
    or a virtual desktop running in the cloud.


    # Microsoft Defender for Endpoint (formerly MDATP)


    Microsoft Defender for Endpoint is the enterprise version of Microsoft Defender
    which is standard enabled in Windows 10 Enterprise and Windows 11 Enterprise.
    It''s a cloud security platform designed to help enterprise networks prevent,
    detect, investigate, and respond to advanced threats.


    The service is integrated end to end into the MEM console and therefore aligns
    easily with other compliance and security settings and roles as part of your security
    baselines.


    One of the great features of integrating Defender within MEM is that after your
    organization onboards a device using the configuration package, you will never
    have to do it again. All your physical and/or cloud PC will be secured out of
    the box:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_44_0.png)


    Figure 1.7 – Defender for Endpoint – management console'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'The Defender for Endpoint configuration process in Intune is very simple and
    is something we will explain in more detail later in the book.


    # Exchange Online


    Exchange Online is a messaging and collaboration platform for your email, calendar,
    contact info, and tasks. You can access all of this with Microsoft Outlook, Outlook
    on the web, or Outlook Mobile. You can access Exchange Online on most devices,
    including Android, iOS, and Windows 10 devices.


    # SharePoint Online


    SharePoint Online is the cloud evolution of Microsoft SharePoint Server. It helps
    you create team- or communication-focused sites for efficient collaboration and
    communication. Internal users with an appropriate Microsoft 365 or SharePoint
    Online license can use SharePoint Online. They can share files or folders with
    others inside or outside the organization. Sharing outside the organization can
    be controlled by site administrators.


    With SharePoint Online, users can do the following:


    +   - Build sites, pages, document libraries, and lists.

    +   - Add web parts to customize their pages.

    +   - Share important visuals, news, and updates with a team.

    +   - Search and discover sites, files, people, and news from across their organization.

    +   - Manage their business processes with flows, forms, and lists.

    +   - Sync and store their files in the cloud so anyone can securely work with
    them.

    +   - Catch up on news on the go with the SharePoint mobile app.


    # Summary


    In this chapter, you learned about all the different Microsoft 365 services you
    might use in your day job or as part of your journey to using MEM to simplify
    the management overhead of your environment.


    This chapter mainly intended to provide context for the later chapters in the
    book; we are now switching gears and taking you on the journey of unified endpoint
    management with MEM.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Questions


    +   1. What are the main benefits of using MEM?

    +      A. MEM ensures that an organization no longer needs credentials to access
    and share company data.

    +      B. MEM prevents remote devices and apps from accessing an organization''s
    resources.

    +      C. MEM helps keep an organization''s cloud and on-premises devices, apps,
    and data secure.

    +   2. What are the main differences between Windows 365 Cloud PC and AVD?

    +      A. Windows 365 Cloud PC is designed for simplicity and AVD for flexibility.

    +      B. Windows 365 Cloud PC has a fixed-price cost model and AVD is consumption-based.


    # Answers


    +   1. (A)

    +   2. (A)


    # Further reading


    If you want to learn more about MEM after reading this chapter, please use the

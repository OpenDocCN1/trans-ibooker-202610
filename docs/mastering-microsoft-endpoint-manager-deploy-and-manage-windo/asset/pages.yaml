- pgno: 628
  md: '# Windows 365 provisioning errors


    In the following section, you will learn more about all the different errors within
    the Windows 365 provisioning process as part of our Watchdog network configuration
    service.


    # Domain join failed


    Windows 365 attempts to join the cloud PC to your on-premises AD domain. This
    step failure can be caused by many factors that are under the control of your
    organization, but you can troubleshoot this as follows:


    +   - Please ensure the AD domain, **organizational unit (OU)**, and credentials
    in the associated **on-premises network connection (OPNC)** are correct.

    +   - Please ensure the domain-join user has sufficient permissions to perform
    the domain join.

    +   - Please ensure the VNet and subnet can reach a domain controller correctly.


    `JsonADDomainExtension` is the Azure function used to perform this domain join.
    Please ensure everything required for this to be successful is in place.


    **Resolution:** Attach an Azure **virtual machine (VM)** to the configured VNet
    and perform a domain join using the credentials provided.


    # Hybrid Azure AD Join failed


    Windows 365 does not perform any **Hybrid Azure AD Join (HAADJ)** functions on
    behalf of the customer. HAADJ must be configured and healthy as a prerequisite
    for a cloud PC.


    If provisioning fails due to HAADJ, it''s likely due to an insufficient sync period
    configured in your AD Connect synchronization service. Please ensure Microsoft
    Azure AD Connect is configured to sync the AD computer objects every 30 minutes
    and no less than every 60 minutes. This step will time out if the Azure AD object
    does not appear within 90 minutes.


    Another factor to consider is your on-premises AD replication time. Ensure the
    domain controller being used for Windows 365 will be replicated fast enough to
    make it into Azure AD within this timeout window.


    **Resolution:** Check to see that the AD object appears in the correct OU and
    that it''s successfully synced to Azure AD before provisioning times out.'
  merge: -1
  img_proc: true
- pgno: 629
  md: '# The SCP record is missing


    You might need to modify your hybrid Azure AD configuration to successfully provision
    cloud PCs. Azure AD Connect synchronizes computer objects, and the computer knows
    which Azure AD domain to register with by looking for a service connection point
    (SCP) object in AD. You can find these in the ADSI Edit tool, under CN=Configuration
    | CN=Services | CN=Device Registration Configuration. You will see a globally
    unique identifier (GUID) and, in that record, a multi-string value with your Azure
    AD tenant name and GUID, as illustrated in the following screenshot:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_629_0.png)


    Figure 17.5 – ADSI Edit'
  merge: -1
  img_proc: true
- pgno: 630
  md: 'If they’re missing, you can create them with Azure AD Connect during the hybrid
    configuration process (https://docs.microsoft.com/azure/active-directory/devices/hybrid-azuread-join-managed-domains),
    as illustrated in the following screenshot:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_630_0.png)


    Figure 17.6 – SCP configuration


    There may be scenarios where you only want specific computers from an individual
    OU to perform a HAADJ. To do this, skip the SCP record creation, and instead create
    a custom Group Policy Object (GPO) and link it to the OU your cloud PC is in (https://docs.microsoft.com/azure/active-directory-domain-services/manage-group-policy#create-a-custom-group-policy-object).
    In the GPO, you need to create two registry keys with the value names TenantId
    and TenantName, as shown in the following example:'

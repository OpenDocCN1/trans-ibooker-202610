  md: '# Auto-subscribing users in the Remote Desktop client


    Note that the following setting only works on Windows 11 as an endpoint and will
    be backported to Windows 10 soon. There’s a chance that when you read this book,
    the feature will already be available!


    Once you have configured the ability to enroll the Remote Desktop client to your
    Windows 10 endpoints, you have performed the most fundamental step. However, if
    you stop here, the user who opens the app will be prompted to log in with their
    Azure AD credentials first before you see your cloud PC(s) to start the session.


    This section explains how you can auto-subscribe users to the Remote Desktop (MSRDC/Store)
    application without the need to enter credentials!


    The settings that make this way of logging on possible have to be implemented
    via Device | Configuration profiles, via the Settings Catalog feature. The steps
    are as follows:



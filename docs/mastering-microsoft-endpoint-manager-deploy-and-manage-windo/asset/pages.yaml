    \ connection with doing OOBE to have any effect; otherwise, this OOBE wizard will\
    \ be shown to the end user.\n\nIf an unattended.xml file is present on the device\
    \ during the OOBE phase, Windows Autopilot will most probably fail, so if you\
    \ are performing the imaging of existing devices, just ensure that the files are\
    \ not present in %WINDIR%\\Panther\\Unattend unattended.xml and %WINDIR%\\Panther\\\
    unattend.xml.\n\n# Windows updates during the Out-of-Box Experience (OOBE)\n\n\
    The IT admin cannot opt out of these critical updates as part of the Windows Autopilot\
    \ provisioning as they are required for the device to operate properly.\n\nCritical\
    \ driver updates and critical Windows **Zero-Day Patch (ZDP)** updates will begin\
    \ downloading automatically during the OOBE after the user has connected to a\
    \ network. Thereafter, Autopilot functional and critical updates are automatically\
    \ downloaded and installed as well.\n\nFeature updates and quality updates will\
    \ not be updated during this phase of the OOBE."

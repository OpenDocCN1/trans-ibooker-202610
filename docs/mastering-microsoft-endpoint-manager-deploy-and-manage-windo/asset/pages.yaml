- pgno: 492
  md: 'Next, we will show a table of where the end user can leverage password-less
    sign-in.


    # What is and isn''t supported in each password-less scenario


    Microsoft''s password-less authentication methods enable different scenarios.
    The organizational needs, prerequisites, and capabilities of each authentication
    method need to be considered before selecting your password-less authentication
    strategy.


    > **Note**

    > There is no additional cost for password-less authentication.


    In the following table, you can see the options based on different scenarios:


    | Scenario | Phone authentication | Security keys | Windows Hello for Business
    |

    |---|---|---|---|

    | Computer sign-in: From an assigned Windows 10 device | No | Yes

    With biometric recognition and/or PIN | Yes

    With biometric recognition and or PIN |

    | Computer sign-in: From a shared Windows 10 device | No | Yes

    With biometric recognition and/or PIN | No |

    | Web app sign-in: From a user-dedicated computer | Yes | Yes


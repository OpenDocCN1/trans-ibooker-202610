- pgno: 239
  md: '# Windows Autopilot overview


    ![](img/a3e9f26159d3739e434fe676b2987c1d_239_0.png)


    Figure 7.1 – Autopilot process


    You get started with Autopilot by getting your devices uploaded to the Autopilot
    service, creating and assigning an Autopilot profile, and then creating and assigning
    an ESP profile (this step is optional, but recommended).


    After your device is shipped, the user simply has to enter their credentials before
    automatic enrollment starts. It is as simple as that:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_239_1.png)


    Figure 7.2 – Autopilot welcome screen'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'After entering the correct credentials, enrollment starts, and all your configuration
    items, policies, certificates, and applications are applied to your physical endpoint
    device.


    As soon as this phase is completed, the user can see the desktop:


    ![](img/a3e9f26159d3739e434fe676b2987c1d_240_0.png)


    Figure 7.3 – Autopilot setup device


    If you use Enterprise State Roaming, you will see your desktop in a familiar way,
    as most pieces of your profile will come from the cloud down to the device.'

    This can include actions that apply to noncompliant devices. Actions for noncompliance
    can alert users to the conditions of noncompliance and safeguard data on noncompliant
    devices.


    See the following example of how you can set the risk level within Microsoft Defender
    when your endpoint does not meet the compliance expectations. Your device will
    show up as a risk in Microsoft Defender for Endpoint as well as in Intune – marked
    as non-compliant.



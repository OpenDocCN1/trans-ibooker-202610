- pgno: 54
  md: 'As part of Endpoint Manager, co-management uses cloud features, including Conditional
    Access. You keep some tasks on-premises, while running other tasks in the cloud
    with Intune.


    Co-management supports the following workloads:


    +   - Compliance policies

    +   - Windows Update policies

    +   - Resource access policies

    +   - Endpoint protection

    +   - Device configuration

    +   - Office Click-to-Run apps

    +   - Client apps


    # Compliance policies


    Compliance policies define the rules and settings that a device must comply with
    to be considered compliant by Conditional Access policies. Also, use compliance
    policies to monitor and remediate compliance issues with devices independently
    of Conditional Access, beginning with the Configuration Manager assessment rule.


    # Windows Update policies


    **Windows Update for Business (WUfB)** policies let you configure WUfB policies
    into a ring concept so you can decide when and how you service Windows 10 and
    later devices.


    You can configure deferral policies for Windows 10 feature updates or quality
    updates for Windows 10 and later devices managed directly by WUfB.


    In Intune, you also have the option to configure Windows 10 feature updates. This
    policy allows a device to be updated to the Windows version you specify and does
    not upgrade to a newer Windows feature release on those devices. The Windows feature
    build you specify in Windows 10 and the later feature updates policy will remain
    on the device until you choose to change the policy setting. While the feature
    build remains static, devices will continue to download and install quality and
    security updates that are available for the feature build.


    # Resource access policies


    Resource access policies configure **virtual private network (VPN)**, Wi-Fi, email,
    and certificate settings on Windows 10 and later devices.'
  merge: -1
  img_proc: true
- pgno: 55
  md: "# Endpoint protection\n\nThe endpoint protection workload includes the Windows\
    \ Defender suite of anti-malware protection features:\n\n+   - **Antivirus:**\
    \ Antivirus policies help security admins focus on managing the settings for Microsoft\
    \ Defender Antivirus, Microsoft Defender exclusions, and the Windows Security\
    \ experience as a policy for Intune-managed devices.\n+   - **Disk encryption:**\
    \ Endpoint security disk encryption profiles focus on only the settings that are\
    \ relevant for a device's built-in encryption method, such as BitLocker. This\
    \ makes it possible for an IT admin to deploy and automatically encrypt end users'\
    \ Windows devices.\n+   - **Firewall:** Use the endpoint security firewall policy\
    \ in Intune to configure a device's built-in firewall for devices that run Windows\
    \ 10. Firewall policies are divided into two, the firewall policy itself and a\
    \ firewall rule policy.\n+   - **Endpoint detection and response:** When you integrate\
    \ Microsoft Defender for Endpoint with Intune, use the endpoint security policies\
    \ for **endpoint detection and response (EDR)** to manage the EDR settings and\
    \ onboard devices for Microsoft Defender for Endpoint.\n+   - **Attack surface\
    \ reduction:** When Defender Antivirus is in use on your Windows 10 devices, use\
    \ Intune endpoint security policies for attack surface reduction to manage those\
    \ settings for your devices.\n\nThe attack surface reduction policy is divided\
    \ into different policies:\n\n+   A. App and browser isolation  \n+   B. Device\
    \ control  \n+   C. Attack surface reduction rules  \n+   D. Exploit protection\
    \  \n+   E. Web protection for Microsoft Edge Legacy  \n+   F. Application control\n\
    \n+   - **Account protection:** Account protection policies help you protect the\
    \ identity and accounts of your users. The account protection policy is focused\
    \ on settings for Windows Hello and Credential Guard, which is part of Windows\
    \ identity and access management.\n\nWhen you switch this workload, the Configuration\
    \ Manager policies stay on the device until the Intune policies overwrite them.\
    \ This behavior makes sure that the device still has protection policies during\
    \ the transition."
  merge: -1
  img_proc: true
- pgno: 56
  md: 'The endpoint protection workload is also part of device configuration. The
    same behavior applies when you switch the device configuration workload. When
    you switch the device configuration workload, it also includes policies for the
    Windows Information Protection feature, which isn''t included in the endpoint
    protection workload.


    The Microsoft Defender Antivirus settings that are part of the device restrictions
    profile type for Intune device configuration are not included in the scope of
    the Endpoint protection slider. To manage Microsoft Defender Antivirus for co-managed
    devices with the endpoint protection slider enabled, use the new Antivirus policies
    in **Microsoft Endpoint manager admin center | Endpoint security | Antivirus**.
    The new policy type has new and improved options available and supports all the
    same settings available in the device restrictions profile.


    The Windows encryption feature includes BitLocker management. We will talk more
    about BitLocker in *Chapter 10, Advanced Policy Management*, and *Chapter 13,
    Identity and Security Management*.


    # Device configuration


    The device configuration workload includes settings that you manage for devices
    in your organization. Switching this workload also moves the resource access and
    endpoint protection workloads.


    You can still deploy settings from Configuration Manager to co-managed devices
    even though Intune is the device configuration authority. This exception might
    be used to configure settings that your organization requires but aren''t yet
    available in Intune. Specify this exception on a Configuration Manager configuration
    baseline. Enable the option to always apply this baseline even for co-managed
    clients when creating the baseline. You can change it later in the **General**
    tab of the properties of an existing baseline.


    For more information on the Intune feature, refer to the **Create a device** profile
    in Microsoft Intune.


    # Office Click-to-Run apps


    This workload manages Microsoft 365 apps on co-managed devices. Remember that
    when moving Microsoft 365 apps that work in Microsoft Intune for existing **System
    Center Configuration Manager (SCCM)**-managed devices, you should not automatically
    change Microsoft 365 app updates to cloud updates from **Content Delivery Network
    (CDN)**. Updates can be managed using administrative templates in Microsoft Intune.


    Office updates may take around 24 hours to show up at clients unless the devices
    are restarted.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Office 365 applications are managed by Intune. This condition in Intune is
    added by default as a requirement to new Microsoft 365 applications. When you
    transition this workload, co-managed clients don''t meet the requirements of the
    application, and then they don''t install Microsoft 365 deployed via Configuration
    Manager.


    After moving the workload, Microsoft 365 apps assigned from Microsoft Intune show
    up in the company portal on the device.


    # Client apps


    Use Intune to manage client apps and PowerShell scripts on co-managed Windows
    10 devices. After you transition this workload, any available apps deployed from
    Intune are available in the company portal. Apps that you deploy from Configuration
    Manager are available in the software center and company portal. The company portal
    can show both SCCM and Intune available apps as one end user software portal.


    # Desktop Analytics


    **Desktop Analytics** is a cloud-based service that integrates with Configuration
    Manager. It provides insight and intelligence for you to make more informed decisions
    about the update readiness of your Windows clients. The service combines data
    from your organization with data aggregated from millions of devices connected
    to the Microsoft cloud. It provides information on security updates, apps, and
    devices in your organization, and identifies compatibility issues with apps and
    drivers. Create a pilot for devices most likely to provide the best insights for
    assets across your organization.


    As part of Endpoint Manager, use the cloud-powered insights of Desktop Analytics
    to keep Windows 10 devices current. Desktop Analytics needs an SCCM client on
    the devices, and Intune alone is not supported.


    **Windows Autopilot**: Windows Autopilot sets up and pre-configures new devices,
    getting them ready for use. It is designed to simplify the life cycle of Windows
    devices, for both IT and end users, from initial deployment through to end of
    life.


    As part of Endpoint Manager, use Autopilot to preconfigure devices and automatically
    enroll devices in Intune. You can also integrate Autopilot with Configuration
    Manager and co-management for more complex device configurations (in preview).


    It is highly recommended to use Windows Autopilot in Azure AD-only environments
    to take advantage of the entire suite of Windows Autopilot features, such as Autopilot
    reset and co-management in Autopilot.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '**Azure AD:** Azure AD is used by Endpoint Manager to identify devices, users,
    groups, and MFA. Azure AD Premium, which is part of the Microsoft 365 license,
    has additional features to help protect devices, apps, and data, including dynamic
    groups, autoenrollment, and Conditional Access. Azure AD Premium is also required
    for Windows Autopilot as automatic enrollment is a pre-requisite.


    **Endpoint Manager admin center:** The admin center is a one-stop website to create
    policies and manage your devices. It plugs into other key device management services,
    including groups, security, Conditional Access, and reporting.


    Microsoft Endpoint Manager is an integrated solution for managing all of your
    devices. Microsoft brings together Configuration Manager and Intune into a single
    console called the Microsoft Endpoint Manager admin center.


    Starting in Configuration Manager version 2002, you can upload your Configuration
    Manager devices to the cloud service and take action from the **Devices** blade
    in the admin center:


    +   - **Client details**: This feature gives the IT admin or helpdesk a fast overview
    of properties and the state of devices.


    +   - **Install applications**: This feature gives the IT admin or helpdesk the
    option to deploy an application to the end users'' devices.


    +   - **Device timeline**: Devices send events once a day to the admin center.
    Only events collected after the client receives the Enable Endpoint analytics
    data collection policy are visible in the admin center. Generate test events easily
    by installing an application or an update from Configuration Manager, or restart
    the device. Events are kept for 30 days. Use the chart to view events that are
    collected.


    +   - **Resource Explorer**: From the Microsoft Endpoint Management admin center,
    you can view the hardware inventory for uploaded Configuration Manager devices
    by using Resource Explorer.


    +   - **Run scripts**: This option allows additional IT admins or the helpdesk
    to run PowerShell scripts from the cloud against an individual Configuration Manager-managed
    device in real time. This provides all the traditional benefits of PowerShell
    scripts that have already been defined and approved by the Configuration Manager
    admin in the on-premises environment.'
  merge: -1

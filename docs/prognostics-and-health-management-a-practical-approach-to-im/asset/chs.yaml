  \ 小时。\n\n## 7.1.2 电子健康解决方案\n\n电子健康解决方案，例如本书中描述的此类解决方案，成为 PHM 系统的一部分。它们有时被称为预测生态系统（见图\
  \ 7.1），在该生态系统中，此类解决方案可按图 7.2 所示的层级进行分类：管芯、组件、板、模块和系统（Ridgetop Group 2018）。还可以添加其他层级，例如板装配和模块集合到可更换单元。\n\
  \n### 生态系统\n\n生态系统可以描述为系统内的预测模型，该系统包括数据的描述、不确定性的量化、模型选择的论证和验证以及应用的局限性（Astfalck et\
  \ al. 2016）。图 7.1 所示的生态系统更广阔视图中的位置如下：位置 1 是一个系统或子系统，由一个或多个可预测启用的线路可更换单元（LRU）组成（监测损伤和/或退化）；位置\
  \ 2 是一个 PHM 系统，它获取、操作、管理并处理数据以产生预测信息，用于启动服务和维护操作；位置 3 是供应商分析故障并改进产品的地点；位置 4 是用于服务和维修的\
  \ LRU、装配、组件和设备的存储库；位置 5 是执行服务和维护的维护人员。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_350_0.png)\n\
  \n**图 7.1** 生态系统广阔视图的示例。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_350_1.png)\n\
  \n**图 7.2** 健康解决方案五级模型的示例。\n\n### 解决方案层级\n\n复杂的 PHM 系统包含设备、组件、板、子装配等。传感器可附加到系统内的任何节点，因此处理传感器数据的健康解决方案可以根据传感器所附着的节点进行分类，如图\
  \ 7.2 所示的健康解决方案五级模型为例（Ridgetop 2018）。\n\n## 7.1.3 关键系统和提前预警\n\n关键系统被认为对日常生活持续运行至关重要，关键性是在评估和选择预测启用节点（预测目标）时需要考虑的关键因素。例如，飞机中的电力系统，或风力涡轮机中的齿轮箱，被认为至关重要，因为其运行对于满足整体系统的设计目标至关重要。关键性的另一个例子是生命和健康的安全：防止和避免生命损失和伤害是系统的首要目标。故障严重性和故障传播也在系统整体关键性的定义中发挥作用。\n\
  \n对任何任务关键或安全关键预测目标即将发生的故障的提前预警，例如警报，是至关重要的：设计良好的 PHM 系统将提供影响系统在规格范围内运行能力的异常检测并发出适当的警报。例如，第\
  \ 6 章包含了由示例原型 PHM 系统发出的消息和警报的示例。PHM 系统将发出警报（健康监测）和/或启动适当的操作（健康管理），例如软关机、负载 shedding\
  \ 和安排维护。也可能存在各种警报级别，其中阈值水平和故障模型可用于确定向飞机操作员、远洋船只或制造车间机床操作员提供哪些信息。这带来了故障严重性、信息访问以及对导致警报的问题采取的缓解措施的概念。\n\
  \n## 7.1.4 维护减少\n\n为了节省资金和资源，维护间隔可以根据退化的实际证据进行优化。例如，一个系统可能具有在运行 250 小时后失效的组件，一些在约\
  \ 600 小时后失效，而其他一些在约 500 小时后失效。基于使用量的 PHM 系统可能设计为执行以下任一操作：\n\n1. 安排所有单元在运行 200 小时或之前进行维修和/或更换维护——相对于失效有\
  \ 20% 的安全裕度。\n2. 安排所有单元在运行 400 小时或之前进行维修和/或更换维护。\n\n在 PHM 系统的首次设计中，一个目标可能是避免所有意外故障，但维护成本增加：例如，每个避免实例平均损失\
  \ 300 小时的使用，以及由于维护操作增加（更频繁的更换）而导致成本增加。第二个设计可能侧重于通过增加维护间隔来降低保障成本——但意外故障会增加。通常，即使不考虑任务和安全问题，意外故障的成本也高于提前的维修更换操作。\n\
  \n因此，我们不提倡基于使用量的 PHM 系统，而是提倡使用 CBD 的 PHM 系统进行 CBM；使用基于特征的检测和预测方法；并采用快速、高度准确的数据处理、预测和计算例程。提倡使用\
  \ CBD 特征的方法是处理由运行环境引入的可变性的有效方法：在亚利桑那州沙漠中运行与在华盛顿州普吉特湾潮湿寒冷的环境中运行设备是截然不同的。\n\n## 7.1.5\
  \ 健康管理、维护和后勤\n\n本书侧重于预测启用以监测节点系统的健康状况：选择的预测目标是因为这些节点具有信号，其会响应设备、组件等退化而变化，当它们失效时，会对系统的运行产生关键影响。它们可能导致任务关键功能停止或超出规格运行，或可能对系统或生命的安全构成危险威胁。\n\
  \n但监测本身并不会避免意外停机，不会修复任何东西，也不会防止生命损失。回顾图 7.1：PHM 系统需要提供健康管理、维护和后勤支持服务，以安排维护、定位和交付零件和设备，并派遣维护团队。\n\
  \n### 管理\n\n鉴于第 6 章中 PHM 系统产生的预测信息的准确性，将维护推迟到检测到的健康状态（SoH）值达到或低于指定水平，例如 25%，是合理的。PHM\
  \ 管理支持可能设计为对警报采取行动，例如图 7.3 所示的警报，其中包括\n\n```\n. . .\nW19: SOH for NODE: 61 IS 24.9286\
  \ PERCENT\nI44: RUL IS 392.3 [hr] AT DATA TIME: 2352 [hr]\n. . .\nW19: SOH for NODE:\
  \ 51 IS 24.5532 PERCENT\nI44: RUL IS 658.2 [hr] AT DATA TIME: 2520 [hr]\n. . .\n\
  W19: SOH for NODE: 62 IS 24.7536 PERCENT\nI44: RUL IS 825.9 [hr] AT DATA TIME: 3528\
  \ [hr]\n. . .\nW19: SOH for NODE: 50 IS 24.8263 PERCENT\nI44: RUL IS 402.2 [hr]\
  \ AT DATA TIME: 3696 [hr]\n. . .\n```\n\n**图 7.3** SoH 达到或低于 25% 时的警报示例。\n\n\n\n\

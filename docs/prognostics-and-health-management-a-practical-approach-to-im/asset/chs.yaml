  \ 表现出失真、噪声和退化速率变化的 FFS 传输曲线。\n\n### 1.6.5 非理想 FFS 与预测\n\n在实践中，通常不可能获得理想的 FFS 传输曲线。相反，曲线会存在噪声和失真，并会表现出与退化速率变化相关的变化\
  \ – 类似于图 1.27 所示。小扰动可能源于测量不确定性，与预测对象的实际 SoH 和/或 RUL 没有关系或意义：在这种情况下，预测算法应采用方法来滤除或以其他方式减轻这些变化。另一方面，FFS\
  \ 变化可能是由预测目标中累积损伤速率的真实、显著变化引起的：在这种情况下，预测算法应采用方法来识别并考虑这些退化速率的变化，这应修改 SoH 和 RUL 的估计。减轻和考虑信号变异性的两种原因是在预测算法设计中相互竞争的目标：在实践中，为了设计满足两个目标的预测算法，算法需要纳入适当的折中设计。在本书后续章节中，您将看到\
  \ FFS 变异性如何被成功处理的示例。\n\n## 1.7 预测信息\n\n预测信息包括以下重要指标：RUL、SoH 和 PH。图 1.28 显示了理想 RUL\
  \ 和理想 PH 的示例图：（i）相对于退化开始的估计失效时间是 PH，且可靠性工程师指定的初始值完全正确；（ii）退化开始被精确地在预测目标开始退化时检测到；（iii）退化达到指定失效水平的时间被精确检测到；以及（iv）预测算法的\
  \ FFS 输入是理想的。PH 和 RUL 图表完全线性，没有噪声或失真 – RUL 是从 200 天到 0 天的精确线性进展。\n\n同样，图 1.29 显示了理想\
  \ SoH 和理想 PH 精度的图。SoH 是从 100% 到 0% 的精确线性进展，且 PH 精度在退化开始之前和之后完全为 100%。\n\n## 理想 PH\
  \ 和 RUL\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_71_0.png)\n\n图 1.28 理想 RUL 和理想\
  \ PH 的示例图。\n\n### 1.7.1 非理想性：初始估计误差与剩余使用寿命（RUL）\n\n预测信息非理想性的主要原因是可靠性工程师定义的预测目标估计\
  \ TTF（初始 RUL 估计）与退化开始到功能失效之间的实际 TTF 之间的差异。估计的初始 TTF 值与实际 TTF 值完全相等的情况极不可能，因此会出现初始估计误差。例如，在图\
  \ 1.28 和 1.29 中，定义的 TTF 值为 200 天，且与功能失效时的真实 TTF 值完全相等。但假设可靠性工程师估计退化开始后的 TTF 为 300\
  \ 天。在这种情况下，当退化被检测到时，估计的 RUL 将为 300 天，而实际 TTF 为 200 天 – 初始误差为 100 天，如图 1.30 所示。\n\
  \n## 理想 SoH 和 PA（PH 精度）\n\n图 1.29 理想 SoH 传输曲线和 PH 精度的示例图。\n\n## 除初始误差外理想的 RUL\n\n\
  图 1.30 具有 100 天初始估计误差的 RUL 示例。\n\n### 1.7.2 存在初始估计误差时 RUL 估计的收敛\n\n设计预测算法是期望的，其（i）减轻非退化引起的\
  \ FFS 变异性且（ii）响应由退化引起的 FFS 变异性。一种设计方法是把 FFS 数据点视为具有惯性和动量的粒子。粒子不会表现出快速变化；相反，它们倾向于保持速度和方向。一个令人满意的设计目标是采用振幅和速度变化的阻尼因子。另一种设计方法是为从零退化状态（左下角）到最大退化状态（右上角）进展的粒子开发随机游走解\
  \ – 该解采用类似卡尔曼的滤波（Hamilton 1994；Bucy and Joseph 2005）：（i）使用 FFS 模型的先前数据点；（ii）计算下一个数据点的预测位置；（iii）将\
  \ FFS 模型调整到下一个数据点的预测位置与实际位置之间的调整位置；（iv）使用阻尼因子和系数调整 FFS 模型；（v）使用调整后的 FFS 模型估计功能失效可能发生的时间；以及（vi）计算\
  \ RUL、SoH 和 PH 等预测信息。\n\n**示例 1.18** 图 1.31 是将此类解应用于初始估计误差的示例。除了高值的初始估计误差外，可靠性工程师可能会指定一个与预测目标相比偏低的\
  \ TTF 值。假设对于一个预测目标，可靠性工程师指定退化开始后的估计 TTF 为 100 天，而该目标实际需要 200 天才会功能失效：具有类似卡尔曼的随机游走解将类似于图\
  \ 1.32 所示。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_73_0.png)\n\n**图 1.31** 高值初始估计误差的随机游走与类似卡尔曼滤波解。\n\
  \n\n\n\n\n- 设计预测算法时所使用的阻尼。阻尼因子越大，收敛到所需精度水平所需的 FFS 数据点数量就越多。\n- 初始估计 TTF 的值。初始误差越大，需要处理的\
  \ FFS 数据点越多才能收敛到所需精度水平。\n- CBD 采样的速率。采样率越慢，即使处理的数据量保持不变，数据点之间的时间间隔也会增加，到达所需精度水平所需的时间也越长。\n\
  \n预测算法未能满足收敛效率要求的失败可能由设计以外的许多因素引起，包括 (i) 规范中的错误，例如 TTF 的初始估计值；(ii) 传感器框架的设计或运行规范；以及\
  \ (iii) 不足的数据处理，导致 FFS 输入中出现过度有害的偏移误差、失真和噪声。\n\n## 1.7.5 FFS 数据中非理想性的其他来源\n\nFFS\
  \ 数据中非理想性的其他来源包括但不限于以下内容：(i) 检测退化开始和功能失效时间时的偏移误差；(ii) 由于使用噪声裕度的效应导致的 FFS 数据失真；(iii)\
  \ 与例如数据转换器的量化误差相关的测量不确定性；(iv) 由环境效应如电压和温度引起的未滤除的变异性；\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_75_0.png)\n\
  \n图 1.33 表现出偏移误差、失真和噪声的 FFS 数据示例。\n\n以及 (v) 预测目标的运行和/或环境变化时自愈效应的影响。图 1.33 说明了非理想的\
  \ FFS 及其非理想性原因的一些影响。\n\n## 1.8 成本与收益的决策\n\n在任何设备的生命周期中，都会出现关于选择购买哪种或最佳设备；选择、检查、维护和维修策略；以及确定预防性更换的最佳时间以避免可能导致额外损坏或事故的昂贵故障的艰难决策。本节简要概述了设备生命周期不同阶段的决策问题及其数学建模，并提供了一些说明性数学模型。\n\
  \n### 1.8.1 产品选择\n\n通常有几种相似设备的替代选择可供购买，选择必须基于多个标准。这就导致我们使用多目标优化技术。(Szidarovszky\
  \ et al. 1986) 总结了求解此类问题的不同概念和算法，因此我们不会给出那些细节；相反，本书的这一节将提供一个说明性示例以提供其使用思路。\n\n**示例\
  \ 1.20** 假设一家公司需要一台特殊机器，并且有几种可能的选择。选择基于多个标准，例如价格、预期寿命、可维护性、可修复故障的修复能力以及操作机器时工人的便利性。表\
  \ 1.2 给出了三种替代方案的估计目标值。\n\n这里，价格和预期寿命是已知数据。在没有具体数据的情况下，其他三个因素只是关于一个选项有多好的主观衡量，只能根据使用相同设备的公司的经验来估计；便利性可通过销售公司的演示进一步评估。没有硬性数值值的目标通常用\
  \ 0–100 标度来表征其好坏程度，其中 0 表示不可接受，100 表示最令人满意的替代方案。\n\n请注意，更低的价格更好；然而，对于所有其他因素，更大的值被认为更好，因为更长的寿命是可取的，其他的是满意度衡量。这些目标按其给出的形式无法比较；我们需要将它们转换为统一的共同度量。最合乎逻辑的方法是将价格和\n\
  \n**表 1.2** 购买机器的决策表。\n\n|  | 价格 ($) | 预期寿命 (年) | 可维护性 | 修复可修复故障 | 便利性 |\n|---|---:|---:|---:|---:|---:|\n\
  | 机器 1 | 5000 | 8 | 60 | 50 | 80 |\n| 机器 2 | 5800 | 15 | 70 | 70 | 50 |\n| 机器 3\
  \ | 6300 | 20 | 90 | 80 | 60 |\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_77_0.png)\n\
  \n**图 1.34** 价格的效用函数。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_77_1.png)\n\n\
  **图 1.35** 预期寿命的效用函数。\n\n预期寿命数据转换为显示决策者对这些值满意程度的度量。为此，决策者为这两个目标构建效用函数，显示其对不同值的满意度。图\
  \ 1.34 和 1.35 显示了这两个目标的效用函数。\n\n如果在预定时间间隔进行维护而不检查项目的状况，我们指的是预定维护。如果项目定期监控，则可以执行基于状态的维护。这可能导致在不改变其所需功能的情况下改善项目；或在项目的所需功能被改变时对其进行修改。如果检测到故障，则在诊断故障后进行纠正。最后，检查项目的运行以确保维修正确且成功完成。\n\
  \n在本节中，将介绍一些最优维护调度的数学模型。\n\n# 预定维护\n\n首先，我们介绍一个预定维护行动的调度模型。考虑一台受预防性维护措施影响的设备，这些措施以均匀的时间网格执行。在维护行动之间，仅在发生故障时执行最小维修。设\
  \ h 表示连续维护行动之间的时间长度。在没有维护的情况下，设 F(t)、f(t)、R(t) 和 ρ(t) 分别表示不可修复故障时间的 CDF、PDF、可靠性函数和故障率。\n\
  \n除了 h 的值外，还可以引入另外两个决策变量。一个表征维护水平，因此每次维护行动后设备的有效年龄减少 u，其中 0 < u < h。还必须确定设备计划运行多长时间，这可以用正整数\
  \ n 表示，表明当第 n 次维护到期时，设备被更换。因此，维护行动在时间 h、2h、...、(n−1)h 执行，并在时间 nh 更换设备。对于 k = 1,\
  \ 2, ..., n，设 Fₖ(t)、fₖ(t) 和 ρₖ(t) 分别表示设备在区间 [(k−1)h, kh] 内的 CDF、PDF 和故障率。那么显然\n\n\
  Fₖ(t) = F(t − (k − 1)u), fₖ(t) = f(t − (k − 1)u) and ρₖ(t) = ρ(t − (k − 1)u)   \
  \   (1.107)\n\n在开发成本最小化模型之前，必须提出一个重要约束。设备的可靠性不得低于用户选择的阈值 r₀：\n\nRₙ(nh) = 1 − Fₙ(nh)\
  \ = 1 − F(nh − (n − 1)u) ≥ r₀      (1.108)\n\n意味着\n\nnh − (n − 1)u ≤ F⁻¹(1 − r₀)\
  \      (1.109)\n\n例如，在 Weibull 分布的情况下，式 (1.108) 可以写为\n\ne^{−((nh−(n−1)u)/η)^β} ≥\
  \ r₀\n\n对两边取对数我们得到\n\n( (nh − (n − 1)u)/η )^β ≤ −ln(r₀)\n\n或\n\nnh − (n − 1)u ≤\
  \ η{−ln(r₀)}^{1/β}      (1.110)\n\n这是一个线性约束。\n\n单位时间内的预期净成本被最小化。必须考虑以下因素：\n\n- 预防性更换的成本为\
  \ $c_p$，而故障更换的成本为 $c_f>c_p$。\n- 可修复故障可能以故障率 $\\rho(t)$ 发生。然后，假设最小维修，任何区间 $(t_1,t_2)$\
  \ 内此类故障的预期数量为 $M(t_1,t_2)=\\int_{t_1}^{t_2}\\rho(\\tau)d\\tau$。每次维修成本为 $c_r$。\n\
  - 每次维护行动的成本取决于维护水平：$a+bu$ 假设线性约束式 (1.110)。\n- 工作设备的收益生成密度假定为 $A-BT$，其中 $T$ 是设备的有效年龄。因此，有效年龄\
  \ $T_1$ 和 $T_2$ 之间产生的收益为积分\n  \n\n  $$\\int_{T_1}^{T_2}(A-BT)dT=\\left[AT-\\frac{BT^2}{2}\\\
  right]_{T_1}^{T_2}=(T_2-T_1)\\left(A-\\frac{B(T_1+T_2)}{2}\\right).$$\n- 在时间 $t$\
  \ 更换设备后，假设其残值为 $Ve^{-wt}$，其中 $V$ 是新设备的价值，随着时间的推移，设备价值呈指数下降。\n\n在计算单位时间预期成本时，我们必须考虑两种情况：\n\
  \n**情况 1.** 设备在计划更换时间之前未发生不可修复故障。则单位时间的净成本为\n\n$$\\frac{1}{nh}\\left\\{c_p+(n-1)(a+bu)+c_r\\\
  sum_{l=1}^{n}\\left(M(lh-(l-1)u)-M((l-1)h-(l-1)u)\\right)-Ve^{-wnh}-\\sum_{k=1}^{n}h\\\
  left(A-\\frac{B((l-1)h-(l-1)u+lh-(l-1)u)}{2}\\right)\\right\\}.$$\n\n第一项是预防性更换的成本，第二项是维护行动的总体成本，第三项是维修的成本。最后两项代表残值和产生的收益。\n\
  \n最后一项可以进一步简化：\n\n$$hAn-\\frac{Bh}{2}\\left[\\sum_{k=1}^{n}\\left(l(2h-2u)+n(-h+2u)\\\
  right)\\right]$$\n$$=hAn-\\frac{Bh}{2}\\left[n(n+1)(h-u)+n(2u-h)\\right]=\\frac{2hAn+Bhn(n(u-h)-u)}{2}.$$\n\
  \n让我们将式 (1.112) 表示为 $COST_1(n,h,u)$。\n\n**情况 2.** 不可修复故障发生在时间 $t\\in((k-1)h,kh]$。则单位时间的净成本为\n\
  \n$$\\frac{1}{t}\\left\\{c_f+(k-1)(a+bu)+c_r\\sum_{l=1}^{k-1}\\left[M(lh-(l-1)u)-M((l-1)h-(l-1)u)\\\
  right]+M(t-(k-1)u)-M((k-1)h-(k-1)u)-Ve^{-wt}\\right\\}.$$\n\n\n\n\n\n\n\\[\n-\\\
  frac{2hA(k-1)+Bh(k-1)((k-1)(u-h)-u)}{2}\n-(t-(k-1)h)\\left[A-\\frac{B(t+(k-1)h-2(k-1)u)}{2}\\\
  right]\\tag{1.114}\n\\]\n\n其中我们使用了式 (1.113) 将 \\(k-1\\) 代替 \\(n\\)，以及式 (1.111) 对区间\
  \ \\(((k-1)h-(k-1)u, t-(k-1)u)\\)。\n\n注意在计算维修成本和产生的收益时，除了区间 \\((0,h]\\)、\\([h,2h]\\\
  )、\\(\\ldots\\)、\\([(k-2)h,(k-1)h]\\) 外，还必须考虑最后一个区间 \\([(k-1)h,t]\\)。式 (1.114) 可记为\
  \ \\(\\mathrm{COST}_2(t,k,h,u)\\)。\n\n那么在一次完整周期（直至更换）期间的单位时间期望净成本为\n\n\\[\n\\mathrm{COST}_1(n,h,u)(1-F_n(nh))+\\\
  sum_{k=1}^{n}\\int_{(k-1)h}^{kh}\\mathrm{COST}_2(t,k,h,u)f_k(t)\\,dt\\tag{1.115}\n\
  \\]\n\n其关于决策变量 \\(0<u<h\\)、\\(n\\in\\{1,2,\\ldots\\}\\) 最小化。我们必须假设收益产生密度为正：\\(A-Bnh\\\
  ge 0\\)；否则机器会产生亏损。\n\n前述公式考虑了一类可修复和不可修复故障。如果考虑 \\(I\\) 类可修复故障，则式 (1.112) 和 (1.114)\
  \ 的第三项在 \\(c_r\\) 前有关于 \\(i\\) 的二次求和，其中 \\(c_r\\) 被 \\(c_{ri}\\) 替换；并且 \\(M\\) 必须被\
  \ \\(M_i\\) 替换。这些表示类型 \\(i\\) 的可修复故障的成本和数量。接下来假设有 \\(J\\) 类不可修复故障，其 CDF 为 \\(F^{(j)}(t)\\\
  )，\\(j=1,2,\\ldots,J\\)。令故障时间记为 \\(X^{(j)}\\)，\\(j=1,2,\\ldots,J\\)。第一次不可修复故障发生在\
  \ \\(X=\\min\\{X^{(1)},X^{(2)},\\ldots,X^{(J)}\\}\\)，其 CDF 为\n\n\\[\n\\begin{aligned}\n\
  F(t)&=P(\\min\\{X^{(j)}\\}\\le t)=1-P(\\min\\{X^{(j)}\\}>t)\\\\\n&=1-P\\left(\\\
  bigcap_{j=1}^{J}(X^{(j)}>t)\\right)\n=1-\\prod_{j=1}^{J}P(X^{(j)}>t)\n=1-\\prod_{j=1}^{J}\\\
  left(1-F^{(j)}(t)\\right)\n\\end{aligned}\n\\]\n\n通过假设不可修复故障彼此独立。\n\n## 最优协调\n\n\
  在下一个相关模型中，将讨论若干台机器维护行动的最优协调。考虑一个拥有 \\(K\\) 台机器的机器车间，其使用寿命均为 \\(N\\) 个时间周期。这些机器的维护必须最优调度以降低设置成本。令\n\
  \n\\[\nx_{ki}=\\begin{cases}\n1 & \\text{if machine } k \\text{ is maintained at\
  \ time period } i\\\\\n0 & \\text{otherwise}\n\\end{cases}\n\\]\n\n对于 \\(i=1,2,\\\
  ldots,N\\) 和 \\(k=1,2,\\ldots,K\\)。\n\n约束条件如下：\n\n- 对于机器 \\(k\\)，连续两次维护行动之间的时间差不得超过\
  \ \\(m_k\\)：必须在前 \\(m_k\\) 个时间周期内至少进行一次维护：\n  \\[\n  \\sum_{j=1}^{m_k} x_{kj}\\\
  ge 1 \\qquad (k=1,2,\\ldots,K)\n  \\]\n  且一般地\n  \\[\n  \\sum_{j=i+1}^{i+m_k} x_{kj}\\\
  ge x_{ki} \\qquad (i=1,2,\\ldots,N-m_k;\\ k=1,2,\\ldots,K)\\tag{1.116}\n  \\]\n\
  \  如果 \\(x_{ki}=0\\)，则该约束无限制。而如果 \\(x_{ki}=1\\)，则 \\(x_{k,i+1},\\ldots,x_{k,i+m_k}\\\
  ) 中至少有一个等于 1。\n\n- 令\n  \\[\n  z_i=\\begin{cases}\n  1 & \\text{if at least one\
  \ maintenance is done at period } i\\\\\n  0 & \\text{otherwise}\n  \\end{cases}\\\
  quad (i=1,\\ldots,N)\n  \\]\n  则我们要求\n  \\[\n  z_i \\le \\sum_{k=1}^{K} x_{ki} \\\
  le Kz_i \\qquad (i=1,\\ldots,N)\\tag{1.117}\n  \\]\n  如果在周期 \\(i\\) 未进行维护，则所有 \\\
  (x_{ki}=0\\)，所以 \\(z_i=0\\)。如果在周期 \\(i\\) 至少进行一次维护，则 \\(\\sum_{k=1}^{K} x_{ki}\\\
  ge 1\\)，所以 \\(z_i\\) 必须不为 0，且该不等式的右边允许其等于 1。\n\n- 每个时间周期内的维护行动最大数量不得超过 \\(M\\)：\n\
  \  \\[\n  \\sum_{k=1}^{K} x_{ki}\\le M \\qquad (i=1,\\ldots,N)\\tag{1.118}\n  \\\
  ]\n\n目标函数是最小化进行维护的时间周期数：\n\n\\[\n\\text{Minimize}\\quad \\sum_{i=1}^{N} z_i\\tag{1.119}\n\
  \\]\n\n该问题是一个线性二元优化问题，可通过常规方法求解。\n\n我们也可以最小化总成本：\n\n\\[\n\\text{Minimize}\\quad\
  \ \\sum_{i=1}^{N} C z_i+\\sum_{i=1}^{N}\\sum_{k=1}^{K} c_{ki}x_{ki}\\tag{1.120}\n\
  \\]\n\n其中 \\(C\\) 为设置成本，\\(c_{ki}\\) 为机器 \\(k\\) 在时间周期 \\(i\\) 的维护成本。\n\n关于最重要的维护模型和方法的一个全面总结，例如见\
  \ (Valdez-Flores and Feldman 1989)、(Nakagawa 2006, 2008)、(Jardine 2006) 和 (Wang\
  \ 2002)。\n\n## 1.8.3 基于状态的维护或更换\n\n接下来，我们介绍一种 CBM 或更换模型，如果维修不可行或不经济时使用 (Hamidi et\
  \ al. 2017)。考虑一台机器在运行 \\(t\\) 个时间周期后以速率 \\(u(t)\\) 产生效用，其中包括其产生的效用价值减去所有运行成本。假设在时间\
  \ \\(T\\) 时传感器显示退化过程的开始，导致效用生产下降，同时由于退化水平增加，运行和更换成本也增加。在制定数学模型以求出维修或更换的最优时间时，使用以下记号：\n\
  \n- \\(\\alpha =\\) 退化系数\n- \\(\\beta =\\) 维修或更换增加成本系数\n- \\(x =\\) 计划的维修或更换时间\n\
  - \\(u(t)e^{-\\alpha(t-T)} =\\) 在时间 \\(t > T\\) 时产生的效用价值密度\n- \\(Ke^{\\beta(x-T)}\
  \ =\\) 在时间 \\(x\\) 时的维修或更换成本\n\n因此，单位时间的总净利润可以表示为\n\n\\[\ng(x)=\\frac{\\int_0^T\
  \ u(t)\\,dt+\\int_T^x u(t)e^{-\\alpha(t-T)}\\,dt-Ke^{\\beta(x-T)}}{x}\\tag{1.121}\n\
  \\]\n\n其关于决策变量 \\(x\\) 最大化。首先注意 \\(g(x)\\) 的导数符号与\n\n\\[\nG(x)=\\left[u(x)e^{-\\\
  alpha(x-T)}-\\beta Ke^{\\beta(x-T)}\\right]x-\\left[\\int_0^T u(t)\\,dt+\\int_T^x\
  \ u(t)e^{-\\alpha(t-T)}\\,dt-Ke^{\\beta(x-T)}\\right]\n\\]\n\n相同，其中\n\n\\[\nG(T)=(u(T)-\\\
  beta K)T-\\int_0^T u(t)\\,dt+K\n\\]\n\n且当 \\(x\\) 趋于无穷时 \\(G(x)\\) 趋于负无穷。\n\n注意\n\
  \n\\[\n\\begin{aligned}\nG'(x)&=u'(x)e^{-\\alpha(x-T)}x-\\alpha u(x)e^{-\\alpha(x-T)}x-\\\
  beta^2Ke^{\\beta(x-T)}x+u(x)e^{-\\alpha(x-T)}\\\\\n&\\quad-\\beta Ke^{\\beta(x-T)}-u(x)e^{-\\\
  alpha(x-T)}+K\\beta e^{\\beta(x-T)}\\\\\n&=u'(x)e^{-\\alpha(x-T)}x-\\alpha u(x)e^{-\\\
  alpha(x-T)}x-\\beta^2Ke^{\\beta(x-T)}x<0\n\\end{aligned}\n\\]\n\n因为 \\(u(x)\\) 为非递增。所以\
  \ \\(G(x)\\) 是 \\(x\\) 的严格递减函数。令 \\(T^*>T\\) 为必须进行维修或更换的最晚时间周期。\n\n因此，我们有以下三种可能性：\n\
  \n- \\(G(T)\\le 0\\)。则对所有 \\(x>T\\) 有 \\(G(x)<0\\)，所以 \\(g(x)\\) 下降，因此 \\(T\\) 是最优的\
  \ \\(x\\) 值。\n- \\(G(T^*)\\ge 0\\)。则对所有 \\(x<T^*\\) 有 \\(G(x)>0\\)，所以 \\(g(x)\\\
  ) 增加，因此 \\(T^*\\) 是最优的 \\(x\\) 值。\n- 否则，\\(G(T)>0\\) 且 \\(G(T^*)<0\\)，存在唯一的 \\(\\\
  bar{T}\\in(T,T^*)\\) 使得 \\(G(\\bar{T})=0\\)。该 \\(\\bar{T}\\) 值是最优的计划维修或更换时间。\n\n\
  在存在多台具有不同参数的机器且需要确定一个共同时间 \\(x\\) 以便一起维修或更换以降低设置成本的情况下，则式 (1.121) 推广为\n\n\\[\ng(x)=\\\
  sum_i \\frac{\\int_0^{T_i} u_i(t)\\,dt+\\int_{T_i}^x u_i(t)e^{-\\alpha_i(t-T_i)}\\\
  ,dt-K_i e^{\\beta_i(x-T_i)}}{x}\\tag{1.122}\n\\]\n\n其中求和是对所有相关机器进行的。与前一种情况类似，\\\
  (g(x)\\) 的导数符号与\n\n\\[\nG(x)=\\left\\{\\sum_i \\left[u_i(x)e^{-\\alpha_i(x-T_i)}-K_i\\\
  beta_i e^{\\beta_i(x-T_i)}\\right]\\right\\}x-\\sum_i \\left\\{\\int_0^{T_i} u_i(t)\\\
  ,dt+\\int_{T_i}^x u_i(t)e^{-\\alpha_i(t-T_i)}\\,dt-K_i e^{\\beta_i(x-T_i)}\\right\\\
  }\n\\]\n\n相同，并且进一步\n\n\\[\n\\begin{aligned}\nG'(x)&=\\sum_i \\left\\{u_i'(x)e^{-\\\
  alpha_i(x-T_i)}x-\\alpha_i u_i(x)e^{-\\alpha_i(x-T_i)}x-K_i\\beta_i^2 e^{\\beta_i(x-T_i)}x\\\
  right.\\\\\n&\\qquad \\left.+u_i(x)e^{-\\alpha_i(x-T_i)}-K_i\\beta_i e^{\\beta_i(x-T_i)}-u_i(x)e^{-\\\
  alpha_i(x-T_i)}+K_i\\beta_i e^{\\beta_i(x-T_i)}\\right\\}\\\\\n&=\\sum_i \\left\\\
  {u_i'(x)e^{-\\alpha_i(x-T_i)}x-\\alpha_i u_i(x)e^{-\\alpha_i(x-T_i)}x-K_i\\beta_i^2\
  \ e^{\\beta_i(x-T_i)}x\\right\\}<0\n\\end{aligned}\n\\]\n\n因此，最优解取决于 \\(G(T)\\)\
  \ 和 \\(G(T^*)\\) 的符号，如前一种情况。\n\n接下来考虑一台机器的特殊情况，其中 \\(u(t)\\equiv u\\) 且 \\(\\beta=0\\\
  )：即恒定生产率且维修/更换成本无增加。\n则\n\n\\[\nG(T)=uT-\\beta KT-uT+K=K(1-\\beta T)\n\\]\n\n如果\
  \ \\(\\beta T<1\\)，则最优时间大于 \\(T\\)。\n\n**例 1.21** 作为说明性例子，令 \\(\\alpha=0.1\\)，\\\
  (\\beta=0.05\\)，\\(K=3.5\\)，\\(T=2\\)，且 \\(T^*=\\infty\\)，效用函数可定义为 \\(u(t)=2.5\\\
  )。可以看出 \\(G(T)>0\\) 且唯一最优值为 \\(\\bar{T}=5.82\\)。对应的单位时间总净效用值为 \\(g(\\bar{T})=1.50\\\
  )。图 1.36 显示了不同维修/更换时间下的目标函数。该图说明在 \\(T=2\\) 时检测到故障后，最好将机器运行至 \\(\\bar{T}=5.82\\\
  )。\n\n## 1.8.4 预防性更换调度\n\n接下来讨论预防性更换的最优时机。在发生故障时，不可预测的时间和可能的额外损害使得更换成本高于预防性更换。如果过早更换，则会损失有用的时间间隔；如果安排过晚，则可能发生故障，并伴随高更换成本和可能的损害及事故。在调度预防性更换时，应考虑多个因素。\n\
  \n令 \\(X\\) 表示不可修复故障时间的随机变量，当对象必须更换时。\\(X\\) 的 CDF、PDF、可靠性函数和故障率分别记为 \\(F(t)\\)、\\\
  (f(t)\\)、\\(R(t)\\) 和 \\(\\rho(t)\\)。令 \\(c_p\\) 和 \\(c_f\\) 分别表示预防性更换和故障更换的成本。假设预防性更换安排在时间\
  \ \\(T\\)；则期望更换成本为\n\n\\[\nc_p R(T)+c_f F(T)\n\\]\n\n\n\n\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_85_0.png)\n\
  \n**图 1.36** 目标函数的形状。\n\n而期望的循环长度表示为 $TR(T)+\\int_0^T tf(t)\\,dt$，可重写为 $\\int_0^T\
  \ R(t)\\,dt$。如果相同的循环无限重复，则基于更新理论，每单位时间的期望成本可表示为\n\n$$\\frac{c_pR(T)+c_fF(T)}{\\\
  int_0^T R(t)\\,dt}$$  (1.123)\n\n其被最小化（Barlow and Proschan 1965; Aven and Jensen\
  \ 1999）。在许多情况下——例如在快速变化的技术中——最优解必须基于单周期准则获得。每单位时间的成本表示为\n\n$$\\begin{cases}\\dfrac{c_f}{X},\
  \ & \\text{if } X\\le T\\\\[4pt]\\dfrac{c_p}{T}, & \\text{if } X\\ge T\\end{cases}$$\n\
  \n其期望值为\n\n$$\\frac{c_p}{T}R(T)+\\int_0^T\\frac{c_f}{t}f(t)\\,dt$$  (1.124)\n\n\
  然后对其进行最小化。在几种分布类型的情况下，最优解可以很容易地获得。\n\n首先考虑式 (1.123) 中的模型。其导数与以下表达式符号相同\n\n$$(-c_pf(T)+c_ff(T))\\\
  int_0^T R(t)\\,dt-(c_pR(T)+c_fF(T))R(T)$$\n\n或\n\n$$(c_f-c_p)\\left\\{\\int_0^T\
  \ R(t)\\,dt\\,p(T)+R(T)\\right\\}-c_f$$  (1.125)\n\n括号内表达式的导数为\n\n```\nR(T)ρ(T)\
  \ + ∫₀ᵀ R(t)dt ρ'(T) − f(T) = ρ'(T) ∫₀ᵀ R(t)dt > 0\n```\n\n若 ρ(T) 为递增。于是式 (1.125)\
  \ 为递增函数，且其在 T = 0 时的值为 −c_p < 0。当 T → ∞ 时，若 ρ(T) → ∞，则其收敛于无穷；否则若\n\n```\n(c_f −\
  \ c_p) ∫₀^∞ R(t)dt ρ(∞) − c_f > 0\n```\n\n则收敛于正的极限。因此，在这些情况下存在唯一的 T̄ > 0 使式 (1.125)\
  \ 为 0，且此即为唯一最优解。如果式 (1.125) 在无穷处的极限非正，则不存在有限最优解，设备必须在失效时更换。\n\n式 (1.124) 的导数形式为\n\
  \n```\n− c_p/T² R(T) − c_p/T f(T) + c_f/T f(T)\n```\n\n其符号与\n\n```\n(c_f − c_p)ρ(T)\
  \ − c_p/T   (1.126)\n```\n\n相同。若 ρ(T) 递增，则该函数也递增；在 T = 0 时，其值收敛于 −∞；而当 T → ∞ 时，其极限为正。因此，同样存在唯一的解即唯一优化器。单调方程的解可通过标准计算机方法获得（Yakowitz\
  \ and Szidarovszky 1989）。\n\n## 示例 1.22  假设威布尔分布参数为 β = 1.5 和 η = 5，且 c_f = 200\
  \ 和 c_p = 100。我们先前已证明威布尔分布的失效率为\n\n```\nρ(t) = β/η^β t^{β−1}\n```\n\n且由式 (1.126)\
  \ 给出的<|message|> 一阶条件可写为\n\n```\n(c_f − c_p) β/η^β T^{β−1} − c_p/T = 0\n```\n\n\
  意味着\n\n```\nT = { c_p η^β / [β(c_f − c_p)] }^{1/β}\n```\n\n在此情况下\n\n```\nT = { 100(5)^{1.5}\
  \ / [1.5(100)] }^{1/1.5} ≈ 3.816\n```\n\n### 1.8.5 模型变体与扩展\n\n这些模型存在许多变体和扩展。其中一些将简要介绍。\n\
  \n首先假设预防性更换需要 $T_p$ 时间进行，而 $T_f$ 对失效更换相同。若我们考虑从更换开始运行的周期，则 $T_p$ 或 $T_f$ 必须计入循环长度。式\
  \ (1.123) 修改为\n\n$$\\frac{c_pR(T)+c_fF(T)}{T_pR(T)+T_fF(T)+\\int_0^T R(t)\\,dt}\
  \ \\tag{1.127}$$\n\n而式 (1.124) 变为\n\n$$\\frac{c_p}{T+T_p}R(T)+\\int_0^T\\frac{c_f}{t+T_f}f(t)\\\
  ,dt \\tag{1.128}$$\n\n这些简单模型未考虑任何额外因素：可修复失效的维修成本、机器生产的产品产生的收益、更换后的残值、备件到达的最优时间，以及执行维修和更换所需的时间。为开发更先进的模型，我们引入以下记号：\n\
  \n- $c_r$ = 每次维修的成本  \n- $M(T)$ = 区间 $[0,T]$ 内可修复失效的期望次数  \n- $u(T)$ = 区间 $[0,T]$\
  \ 内产生的收益  \n- $S(T)$ = 设备使用寿命为 $T$ 后的残值  \n- $\\alpha$ = 备件单位库存成本  \n- $\\beta$\
  \ = 生产延误单位损失\n\n还必须包含一个新的决策变量：\n\n$W$ = 备件到达计划\n\n为数学简便起见，我们引入以下函数。若设备需在时间 $t$ 安排更换，且备件在时间\
  \ $W$ 到达，则额外成本为\n\n$$\\gamma(t,W)=\\begin{cases}(t-W)\\alpha & \\text{if } t\\ge\
  \ W \\\\(W-t)\\beta & \\text{if } t<W\\end{cases}$$\n\n第一种情况下产生库存成本；第二种情况下生产延误导致公司损失。\n\
  \n如果考虑长期期望成本，则式 (1.124) 推广为\n\n$$\\frac{(c_rM(T)+c_p-S(T)-u(T)+\\gamma(T,W))R(T)+\\\
  int_0^T(c_rM(t)+c_p-S(t)-u(t)+\\gamma(t,W))f(t)\\,dt}{T_pR(T)+T_fF(T)+\\int_0^T\
  \ R(t)\\,dt} \\tag{1.129}$$\n\n相应的单周期模型扩展为更复杂的目标函数：\n\n$$\\frac{c_p+c_rM(T)-S(T)-u(T)+\\\
  gamma(T,W)}{T+T_p}R(T)+\\int_0^t\\frac{c_f+c_rM(t)-S(t)-u(t)+\\gamma(t,W)}{t+T_f}f(t)\\\
  ,dt$$  (1.130)\n\n两个模型均有两个决策变量，因此对其优化，商业软件是最好的选择。一种复杂的分析方法如下。先给定 $T$ 的值，对式 (1.129)\
  \ 和 (1.130) 关于 $W$ 进行优化。显然，最优 $W$ 值取决于 $T$：$W=W(T)$。然后将 $W(T)$ 代入目标函数，此时它们仅依赖于 $T$，从而成为简单的单变量搜索算法，可用于寻找最优解。\n\
  \n如果同时考虑短期和长期目标，则必须使用多目标优化方法对这两个目标函数进行处理。\n\n我们还可以在式 (1.121) 和 (1.122) 中纳入不可修复失效的可能性。在这种情况下，必须使用时间\
  \ $T$ 之后的 TTF 的条件 CDF，可按如下方式获得：\n\n$$P(X<t\\mid X>T)=\\frac{P(T<X<t)}{P(X>T)}=\\\
  frac{F(t)-F(T)}{1-F(T)}$$  (1.131)\n\n请注意，这些目标表示每单位时间的期望成本，而未考虑其不确定性，后者由每单位时间成本的方差表征。期望成本及其方差都应最小化，这再次导致应用多目标优化程序。\n\
  \n最后引入一个简单的模型，用于在设备生命周期中的任意区间内确定所需的维修包数量。类似的模型也可用于规划所需劳动力数量。为简化起见，假设在可修复失效情况下执行最小维修。据第\
  \ 1.5.1 节可知，任意区间 $[t,T]$ 内的失效次数服从期望为\n\n$$\\lambda=M(T)-M(t)=\\int_t^T\\rho(\\tau)\\\
  ,d\\tau$$  (1.132)\n\n的泊松分布，意味着失效时间构成非齐次泊松过程。假设每次维修需要一个维修包单位。确定能保证所有失效维修均能以至少给定概率值\
  \ $1-p$ 完成的单位数是一个非常重要的问题。设 $Q$ 表示所需的可用包数；则在记号\n\n$$X_{[t,T]}=\\text{区间 }[t,T]\\\
  text{ 内实际失效次数}$$\n\n下，我们要求\n\n$$P(X_{[t,T]}\\le Q)=\\sum_{k=0}^{Q}\\frac{\\lambda^k}{k!}e^{-\\\
  lambda}=e^{-\\lambda}\\sum_{k=0}^{Q}\\frac{\\lambda^k}{k!}\\ge 1-p$$\n\n意味着\n\n\
  $$\\sum_{k=0}^{Q}\\frac{\\lambda^k}{k!}\\ge (1-p)e^{\\lambda}$$  (1.133)\n\nCox,\

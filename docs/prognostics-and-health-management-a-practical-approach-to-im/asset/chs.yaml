  \n\n\n\n\n## Feature Vector Framework\n\nFeature Vector 块包含三个部分——主部分、数据平滑部分和 FFP\
  \ 到 DPS 转换部分：\n\nFD = feature data = FD0*(1 + dP/P0)\nFFP = (FD – FD0 – NM)/FD0\
  \ where NM = FNM*FD0/100 or\nFFP = (FD – FD0 – NM) when FDNOMDIV = 0\n\n主部分包含六个条目用于指定将\
  \ CBD 转换为 FD 的变换：\n\n- *FNM* 指定 NM，即标称 FD 值（FD0）的百分比\n- *FAILM* 指定百分比失效裕度：70 表示当\
  \ FFP = 0.70 时失效\n- *FDNOM* 指定被视为标称 FD 值（FD0）的数据值\n- *FDNOMV* 指定 FD0 的预期百分比方差\n\
  - *FDNOMMIN* 指定用于 FD0 的最小值。\n  - 当测量的 FD0 小于 FDNOMMIN 时，使用 FDNOMIN。\n  - 否则使用测量的\
  \ FD0。\n- *FDNOMDIV* 指定是否执行除法（非零值）或不执行（零值）。\n\n数据平滑部分包含四个条目用于数据平滑：\n\n- *FD0PTS*\
  \ 指定用于平均的 CBD 点数，以计算 FD0 的值。\n  - 当指定为零（0）时，使用 FDNOM。\n  - 当计算中的方差超过 FDNOMV 时，使用\
  \ FDNOM。\n- *FDPTS* 指定用于平滑的 FD 点数进行平均。\n- *FFPPTS* 指定用于平滑的 FFP 点数进行平均。\n- *FFSPTS*\
  \ 指定用于平滑的 FFS 点数进行平均。\n\nFFP 到 DPS 转换部分包含两个条目用于将 FFP 特征数据转换为 DPS 数据：\n\n- *XDPS*\
  \ 指定用于选择 FFP 到 DPS 转换模型的 FFP 模型：\n  - 0 表示不转换。\n  - 1 表示使用 FFP = FD0*(dP/P0)^n。\n\
  \  - 2 表示使用 FFP = FD0*([1/(1 - dP/P0)]^n - 1)。\n  - 3 表示使用 FFP = FD0*(1-[1/(1 +\
  \ dP/P0)]^n)。\n  - 4 表示使用 FFP = FD0*((1 + dP/P0)^n - 1)。\n  - 5 表示使用 FFP = FD0*(1\
  \ - (1 - dP/P0)^n)。\n  - 6 表示使用 FFP = FD0*(exp(dP/P0) - 1)。\n  - 7 表示使用 FFP = FD0*(1\
  \ - exp(-dP/P0))。\n- *XDPSNV* 指定用于 n 或 lambda（寿命）的值。\n\n## Prediction Framework\n\
  \n预测框架部分（图 6.61）包含两个条目用于指定在生成预测信息时使用的值：\n\n- *PITTFF0* 指定退化开始后失效时间（TTF）值：\n  - 默认值为\
  \ 200 个采样周期。\n- *PIFFSMOD* 指定输入数据的预期形状：\n  - 1 表示凹形特征曲线。\n\n```\n%**Feature Vector\
  \          (A)\nFNM      = 2.5 ;      % Noise margin - % of FD0\nFAILM    = 70 ;\
  \       % Failure margin - % above 0\nFDNOM    = 0 ;        % Feature Data (FD),\
  \ Nominal value\nFDNOMV   = 3 ;        % FD Nominal variance (%)\nFDNOMMIN = 1 ;\
  \        % minimum nominal value: if less, perform DIV\nFDNOMDIV = 0 ;        %\
  \ 0 = subtract only (no division) - small signal\n                      % else FFP\
  \ = (FD - DIV)/DIV\n```\n\n```\n(B)\nFD0PTS   = 20 ;       % # data points to average\
  \ to calculate FD0\nFDPTS    = 4 ;        % Rolling FD (CBD) points to average:\
  \ up to 4\nFFPPTS   = 4 ;        % Rolling FFP points to average: up to 4\nFFSPTS\
  \   = 4 ;        % Rolling FFS points to average: up to 4\n```\n\n```\n%**FFP to\
  \ DPS Transform    (C)\nXDPS     = 0 ;        % none\n%        = 1 ;        % FFP\
  \ = FD0*(dP/P0)^n\n%        = 2 ;        % FFP = FD0*([1/(1 - dP/P0)]^n - 1)\n%\
  \        = 3 ;        % FFP = FD0*[1-{1/(1 + dP/P0)}^n]\n%        = 4 ;        %\
  \ FFP = FD0*([1 + dP/P0]^n - 1)\n%        = 5 ;        % FFP = FD0*(1 - (1 - dP/P0)^n)\n\
  %        = 6 ;        % FFP = FD0*(exp(dP/P0) - 1)\n%        = 7 ;        % FFP\
  \ = FD0*(1 - exp(-dP/P0))\nXDPSNV   = 1 ;        % n or Lambda (life) value\n```\n\
  \nFigure 6.60 NDEF: feature-vector framework – (a) primary, (b) smoothing, (c) FFP-DPS\
  \ transform.\n\n```\n%**Prediction (Prognostic) Information\nPITTFF0  = 4800 ; \
  \    % estimated time (hours) after onset of damage\nPIFFSMOD = 2 ;       % model\
  \ 1=Concave, 2=Linear, 3=Convex, 4=complex\nPIFFSNM  = 3 ;       % noise margin\
  \ (%) for estimating begin degradation\n```\n\nFigure 6.61 NDEF: Prediction Framework.\n\
  \n- 2 表示线性曲线——这是默认值。\n- 3 表示凸形曲线。\n- 4 表示复杂（不规则）曲线。\n\n- *PIFFSNM* 指定用于估计退化开始（BD）的\

  \ = (FD_i - FD_0)\n(6.9)\n```\n\n## 6.6 诊断和预测程序\n\n规范包括对 SMPS 电源和 EMA 的诊断和预测程序的描述。\n\
  \n### 6.6.1 SMPS 电源\n\n电源的诊断程序很直接：将传感器数据转换为 FFP 签名，然后转换为 DPS 数据，然后转换为 FFS 数据；然后将\
  \ FFS 数据输入预测框架。当 SoH 小于 100 且大于 0 时，电源已退化。当 SoH 首次降至 100 以下时，可进行诊断。按节点定义指定的方式发出警报。\n\
  \n### 6.6.2 EMA\n\n传感器框架中的传感器产生三组测量值，每组对应三相电流中的一相——正负标量值。传感器测量数据由计算例程（软件和/或固件）处理，以产生三对峰值-RMS\
  \ 值：每相一对正负值。\n\n**故障树处理：检测和诊断**\n\n检查每相电流的正负特殊峰值 RMS 值的幅值：\n\n- 1. 当某相的两个值均表现出幅值下降时：\n\
  \  - 故障模式：该相开关功率晶体管的导通电阻增加。\n  - 故障隔离：H 桥电路中幅值下降最大的相半部分的晶体管。\n- 2. 当所有三相电流的两个值均表现出幅值增加时：\n\
  \  - 故障模式：EMA 电机负载增加。\n  - 故障隔离：EMA 电机上的摩擦或重量增加（或两者兼有）。\n- 3. 当单个（或两个）相电流的两个值均表现出幅值增加时：\n\
  \  - 故障模式：阻抗降低，例如电机绕组匝间短路。\n  - 故障隔离：电流增加的相的电机绕组。\n- 4. 否则，EMA 状态等于 *未发现故障*。\n\n\
  ## 6.7 规范：鲁棒性和能力\n\n客户批准了您的初始设计规范，并批准进一步设计和开发原型 PHM 系统，以通过同时监控、检测退化程度并为图 6.18 所示的系统配置发出适当的警报和预测信息来展示鲁棒性和能力：（i）未退化的电源，（ii）退化的电源，（iii）未退化的\
  \ EMA，（iv）具有退化功率 MOSFET 的 EMA，以及（v）电机轴上负载过大的 EMA。保存在图 6.29 中标记为 DS2 – |7| 的输出文件以及图\
  \ 6.30 中标记为 DS4 – |24| 的输出文件提供输入数据以测试、验证和演示该系统。\n\n一套用于鲁棒原型示例 PHM 系统的最终规范包括以下内容：（i）用于处理相电流的特殊均方根（RMS）方法；（ii）对电源的预测使能；以及用于功率开关\
  \ MOSFET 和电机负载的 EMA。最终规范需要支持您的主张，即您的团队将开发一个鲁棒的原型示例 PHM 系统，该系统能够提供所需的预测功能。\n\n###\
  \ 6.7.1 基于节点的架构\n\n您的 PHM 系统需要定义每个节点的轮询模式，包括范围、定义和间隔。范围包括例如，用于处理收集数据的程序，以及与数据调理和预测相关的要求。基于这些和其他考虑，您设计了一个在线、基于节点的架构，如图\
  \ 6.52 所示的注释图，其中包括您的 PHM 系统和其他系统。例如，您并非设计用于执行 CBM 的系统、用于执行自主后勤支持的系统，或用于支持和提供故障管理的系统。\n\
  \n您的 PHM 系统应包括以下主要功能和能力：\n\n- - 系统控制和数据流。\n- - 系统节点定义，以及两个 EMA 子系统的节点定义，每个子系统均由一个电源和两个\
  \ EMA 组合而成。\n- - 数据集库：输入、输出和检查点/重启数据集，以支持可中断的 PHM 操作。\n- - 计算库，包含您提供的程序模块和例程，用于执行数据调理、融合、转换以及支持\
  \ PHM 系统所需的任何其他操作。\n- - 系统服务库，用于支持和提供例如图形和终端用户界面、消息和警报、信息显示和打印以及事件处理程序。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_305_0.png)\n\
  \n**图 6.52** 鲁棒 PHM 系统示例的框图。\n\n\n\n\n\n## 工作范围\n\n总体而言，一个健壮的 PHM 系统包括但不限于以下内容：\n\
  \n### 传感器硬件、固件和驱动程序\n\n- 主采样率、突发模式（高频）采样在较低循环率下进行等。\n- 基于频率与基于幅度的区别，电压与电流的区别等。\n\
  - 有源滤波、模数数据转换等。\n\n### 向量程序模块\n\n- 输入数量。\n- 融合 – 数据和领域。\n- 签名建模、变换和平滑。\n\n### 预测程序\n\
  \n- 预测距离、准确性和收敛性。\n\n### 服务程序\n\n- 用户界面，如命令行、图形输入/输出和打印。\n- 资源管理：编辑、选择和修改。\n- 消息、数据记录和报告。\n\
  - 警报。\n- 事件处理。\n\n## 项目范围\n\n对于本项目阶段，你和你的团队的工作范围如下：\n\n- 系统节点定义（SND）的设计。\n- 应用特定节点定义（NDEF）的设计。\n\
  - 任何所需输入、输出和检查点/重启数据集的设计。\n- 根据需要和期望使用团队先前设计和开发的计算程序模块和例程来验证设计要素。那些模块和例程的设计和开发细节不包括在内。\n\
  - 根据需要和期望使用团队先前设计和开发的基础服务程序和例程来验证设计要素。那些服务、程序和例程的设计和开发细节不包括在内。\n- 设计信息应按如下方式提供：\n\
  \  - 使用终端用户界面（EUI，命令行）。图形用户界面（GUI）的设计被推迟。\n  - 假设将有一个消息处理器来包含所有语言特定的文本。\n  - 假设将有一个支持平台用于轮询和采样。\n\
  \  - 异步事件处理被推迟到本项目阶段。\n- 预测服务将包括以下内容：\n  - 预测信息。\n  - 预测准确性：评估和报告服务。\n\n## 6.7.2\
  \ 示例设计\n\n你决定原型 PHM 系统中的节点是逻辑节点，可能包含一个以上的物理节点。例如，每个 EMA 都有三个物理节点，AC 测量传感器附着在其上。更实际的做法是认为一个\
  \ EMA 节点包含三个物理传感器，因此三个信号。参考回图 6.52，总共有六个节点：电源两个，EMA 四个。每个节点定义的架构如图 6.53 所示。\n\n\

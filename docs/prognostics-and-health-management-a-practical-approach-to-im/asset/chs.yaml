  \ 12 台 EMA（下）的测试结果。\n\n磨损；相反，故障最常是由于循环应力和应变导致疲劳损伤累积而引起的（Hofmeister et al. 2006）。随着疲劳损伤的累积，一个或多个可测量的信号发生变化，可作为特征数据捕获。\n\
  \n因此，浴盆曲线中几乎没有任何内容可用于使能或支持基于 CBD 的预测。\n\n### 7.4.1 浴盆曲线：MTBF 和 MTTF\n\n正如您在图 7.16\
  \ 中所见，MTBF（两次故障之间）不是时间轴值：它是一个故障率值。MTTF 也不在典型的浴盆曲线视图中出现，也许是因为图 7.17（Seastrunk 2016）所暗示的关系。\n\
  \n### 7.4.2 触发点和预测距离\n\n图 7.16 中还显示了一个概念图，旨在传达这样的概念：可以采用预测触发器在时间 PD 内提供对可能故障的提前警告，同时传达有用寿命不会延伸到磨损区域的概念。图\
  \ 7.18 传达了更实际的预测触发点视图：\n\n- 设想多个传感器附着在复杂的产品上，例如 EMA，其内置电源，如本书所述。\n\n和 MTBF；相反，提出了使用从退化开始到此类退化导致功能性故障的时间的理由：TTF。确定或计算\
  \ TTF 值的方法包括使用寿命、实际使用测试和基于 MTTF 的方法。关于预测方法成本效益分析的部分包含了以下方法的示例方法：（i）无 PHM；（ii）基于使用量的\
  \ MTTF；（iii）基于使用量的 2/3 MTTF；（iv）损伤检测；以及（v）SoH 在 75% 或更低。之后的部分重点关注浴盆曲线以及它与故障分布、MTBF、MTTF、触发点和\
  \ CBD 特征的关系。\n\n本书绝不涵盖与 PHM 和 CBD——用于 CBM 的调理、建模和处理——相关的全部信息。另一方面，本书包含大量关于基本方法的信息，重要的是\
  \ CBD 特征以及如何处理和线性化这些特征，这减轻了预测程序的负担并提高了预测信息的准确性。第 6 章介绍了假设原型 PHM 系统的设计，以说明设计人员可能面临的挑战并展示本书中讨论的方法的应用。\n\

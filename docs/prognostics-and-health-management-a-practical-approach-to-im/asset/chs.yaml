  \ $e^X$ 服从对数冈贝尔分布；若 $X$ 服从伽马分布，则 $e^X$ 服从对数伽马分布。\n\n指数分布、威布尔分布、伽马分布和对数正态分布的分布函数定义域为\
  \ $[0, \\infty)$ 区间：也就是说，它们对正自变量有定义。然而，在正态情形下，$t$ 可以是任意实值。如果 $X$ 只能取正值，而我们仍想使用正态分布，则必须修改式\
  \ (1.20)：\n\n$$f_+(t) = \\frac{1}{A \\sigma \\sqrt{2\\pi}} e^{-(t-\\mu)^2/(2\\sigma^2)}\
  \ \\tag{1.30}$$\n\n其中\n\n$$A = \\int_0^\\infty f(t)\\,dt = 1 - F(0) = 1 - \\Phi(-\\\
  mu/\\sigma) = \\Phi(\\mu/\\sigma) \\tag{1.31}$$\n\n因此，相应的CDF如下：\n\n$$F_+(t) = \\\
  int_0^t f_+(x)\\,dx = \\frac{1}{A}\\bigl(F(t) - F(0)\\bigr) = \\frac{\\Phi((t-\\\
  mu)/\\sigma) - \\Phi(-\\mu/\\sigma)}{\\Phi(\\mu/\\sigma)} \\tag{1.32}$$\n\n指数随机变量在可靠性分析中很少使用，因为它不能对物体的退化或老化进行建模。为了说明这一缺点，考虑一个年龄为\
  \ $T$ 的物体，求它还能额外工作 $t$ 个单位时间的概率。这是一个条件概率：\n\n$$P(X > T + t \\mid X > T) = \\frac{P(X\
  \ > T + t)}{P(X > T)} = \\frac{R(T + t)}{R(T)} = \\frac{e^{-\\lambda(T+t)}}{e^{-\\\
  lambda T}} = e^{-\\lambda t} = R(t)$$\n\n这表明该概率不依赖于物体的年龄 $T$。也就是说，无论物体的年龄如何，生存概率都保持不变。\n\
  \n不同分布类型之间的其他重要关系可总结如下。若威布尔变量中的 $\\beta = 1$，则它变为参数 $\\lambda = 1/\\eta$ 的指数分布。接下来假设\
  \ $X_1, X_2, \\ldots, X_k$ 是参数相同的独立指数变量，参数为 $\\lambda$；则它们的和 $X_1 + X_2 + \\cdots\
  \ + X_k$ 是参数为 $k$ 和 $\\theta = 1/\\lambda$ 的伽马变量。类似地，若 $X$ 服从参数为 $\\lambda$ 的指数分布，则\
  \ $X^\\alpha$ 服从参数 $\\beta = 1/\\alpha$ 和 $\\eta = 1/\\lambda^\\alpha$ 的威布尔分布。正态变量基于中心极限定理来表征，该定理断言：设\
  \ $X_1, X_2, \\ldots, X_N, \\ldots$ 是一列独立同分布的随机变量；则它们的部分和 $\\sum_{k=1}^N X_k$ 在\
  \ $N \\to \\infty$ 时收敛于正态分布。\n\n### 1.2.5 失效率\n\n失效率（或风险率）在数学上定义如下：\n\n$$\\rho(t)\
  \ = \\lim_{\\Delta t\\to 0} \\frac{P(t < X < t + \\Delta t \\mid t < X)}{\\Delta\
  \ t} \\tag{1.33}$$\n\n分子是在物体在时间 $t$ 正常工作的条件下，它在接下来的 $\\Delta t$ 个时间段内发生故障的概率。若 $\\\
  Delta t = 1$，则该分数给出物体在下一个单位时间间隔内发生故障的概率。通过简单计算，\n\n$$\\frac{P(t < X < t + \\Delta\
  \ t \\mid t < X)}{\\Delta t} = \\frac{P(t < X < t + \\Delta t)}{\\Delta t\\, P(t\
  \ < X)} = \\frac{F(t + \\Delta t) - F(t)}{\\Delta t\\, P(X > t)}$$\n\n它收敛于下式：\n\n\
  $$\\rho(t) = \\frac{f(t)}{R(t)} \\tag{1.34}$$\n\n也就是说，$\\rho(t)$ 可以基于 $X$ 的PDF和可靠度函数容易地计算。TTF分布通过其PDF（$f(t)$）、CDF（$F(t)$）、可靠度函数（$R(t)$）和失效率（$\\\
  rho(t)$）来表征。如果这些函数中任何一个已知，则其余三个可以容易地确定，如下所示。\n\n若 $f(t)$ 已知，则 $F(t) = \\int_0^t\
  \ f(x)\\,dx$，$R(t) = 1 - F(t)$，且 $\\rho(t) = f(t)/R(t)$。\n\n若 $F(t)$ 已知，则 $f(t)\
  \ = F'(t)$，$R(t) = 1 - F(t)$，且 $\\rho(t) = f(t)/R(t)$。\n\n接下来假设 $R(t)$ 已知。则 $F(t)\
  \ = 1 - R(t)$，$f(t) = F'(t)$，且 $\\rho(t) = f(t)/R(t)$。\n\n最后，假设 $\\rho(t)$ 已给出。根据其定义\n\
  \n$$\\rho(t) = \\frac{f(t)}{R(t)} = \\frac{f(t)}{1 - F(t)} = -\\frac{-f(t)}{1 -\
  \ F(t)}$$\n\n并通过积分\n\n$$\\int_0^t \\rho(x)\\,dx = -\\int_0^t \\frac{-f(x)}{1 - F(x)}\\\
  ,dx = \\left[-\\ln(1 - F(x))\\right]_{x=0}^t = -\\ln(1 - F(t)) + \\ln(1)$$\n\n所以\n\
  \n$$\\ln(1 - F(t)) = -\\int_0^t \\rho(x)\\,dx$$\n\n这意味着\n\n$$F(t) = 1 - e^{-\\int_0^t\
  \ \\rho(x)\\,dx} \\tag{1.35}$$\n$$f(t) = F'(t)$$\n$$R(t) = 1 - F(t) = e^{-\\int_0^t\
  \ \\rho(x)\\,dx}$$\n\n### 指数分布的失效率\n\n在指数情形下，\n\n$$\\rho(t) = \\frac{\\lambda e^{-\\\
  lambda t}}{e^{-\\lambda t}} = \\lambda \\tag{1.36}$$\n\n它是一个常数，不依赖于物体的年龄。这一关系也表明指数随机变量不包含退化。\n\
  \n### 威布尔分布的失效率\n\n在威布尔情形下，\n\n$$\\rho(t) = \\frac{\\beta}{\\eta^{\\beta}} t^{\\\
  beta-1} \\tag{1.37}$$\n\n其形状随 $\\beta$ 的值不同而变化，如图1.8所示。\n\n**图1.9.** 伽马变量的失效率。\n\
  \n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_42_0.png)\n\n**图1.10.** 标准正态变量的失效率。\n\
  \n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_42_1.png)\n\n容易证明，$\\rho_n(t)$ 严格递增且关于\
  \ $t$ 是凸的，$\\rho_n(0) = \\sqrt{2/\\pi}$，$\\lim_{t\\to -\\infty} \\rho_n(t) = 0$，且\
  \ $\\lim_{t\\to \\infty} \\rho_n(t) = \\infty$。此外，当 $t \\to \\infty$ 时，$45^\\circ$\
  \ 线是其渐近线。$\\rho_n(t)$ 的形状如图1.10所示。\n\n### 正态分布的失效率\n\n若 $X$ 是参数为 $\\mu$ 和 $\\sigma$\
  \ 的正态变量，则 $\\rho(t) = \\frac{1}{\\sigma} \\rho_n\\left(\\frac{t-\\mu}{\\sigma}\\\
  right)$，$\\lim_{t\\to -\\infty} \\rho(t) = 0$，且 $\\lim_{t\\to \\infty} \\rho(t)\
  \ = \\infty$。此外，当 $t \\to \\infty$ 时，其渐近线为 $(t-\\mu)/\\sigma^2$。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_43_0.png)\n\
  \n**图1.11.** 参数 $\\mu = 0$ 和 $\\sigma = 1$ 的对数正态变量的失效率。\n\n### 对数正态分布的失效率\n\n对数正态变量\
  \ $X$ 的失效率如图1.11所示。它是一条丘形曲线，在 $t^*$ 处取得最大值，$t^*$ 可按如下方式确定。存在唯一值 $\\bar t$ 使得 $\\\
  rho_n(\\bar t) = \\bar t + \\sigma$，于是 $t^* = \\exp(\\mu + \\sigma \\bar t)$。显然\n\
  \n$$\\lim_{t\\to 0+} \\rho(t) = \\lim_{t\\to \\infty} \\rho(t) = 0$$\n\n### 逻辑斯蒂分布的失效率\n\
  \n逻辑斯蒂变量的失效率为\n\n$$\\rho(t) = \\frac{1}{\\sigma(1 + e^{-z})} \\quad \\text{with}\
  \ \\quad z = \\frac{t - \\mu}{\\sigma} \\tag{1.40}$$\n\n### 冈贝尔分布的失效率\n\n对于冈贝尔分布，\n\
  \n$$\\rho(t) = \\frac{1}{\\sigma} e^{z} \\quad \\text{with} \\quad z = \\frac{t\
  \ - \\mu}{\\sigma} \\tag{1.41}$$\n\n这是一个简单的指数函数。\n\n### 对数逻辑斯蒂分布的失效率\n\n类似地，对于对数逻辑斯蒂变量：\n\
  \n$$\\rho(t) = \\frac{e^{x}}{\\sigma t (1 + e^{x})} \\quad \\text{with} \\quad x\
  \ = \\frac{\\ln(t) - \\mu}{\\sigma} \\tag{1.42}$$\n\n### 对数冈贝尔分布的失效率\n\n对于对数冈贝尔分布，\n\
  \n$$\\rho(t) = \\frac{e^{x}}{\\sigma t} = \\frac{1}{\\sigma} e^{x(1-\\sigma)-\\\
  mu} \\quad \\text{with} \\quad x = \\frac{\\ln(t) - \\mu}{\\sigma} \\tag{1.43}$$\n\
  \n如前所述。\n\n\n\n\n## 对数伽马失效率\n\n对数伽马变量的失效率为\n\n\\[\n\\rho(t) = \\frac{y^{\\alpha-1}\
  \ e^{-(\\lambda+1)y}}{\\int_y^\\infty u^{\\alpha-1} e^{-\\lambda u}\\,du}, \\quad\
  \ \\text{其中 } y = \\ln(t) \\tag{1.44}\n\\]\n\n图1.12至图1.14展示了其中一些失效率的图形。\n\n### 示例1.5\n\
  \n假设某变量的失效率为 \\(\\rho(t) = t^2\\)。那么，由式(1.35)可得：\n\n\\[\nF(t) = 1 - e^{-\\int_0^t\
  \ \\tau^2\\,d\\tau} = 1 - e^{-t^3/3}\n\\]\n\n这表明该变量为威布尔变量，其中 \\(\\beta = 3\\)，\\\
  (\\eta = 3^{1/3}\\)。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_44_0.png)\n\n图1.12：Logistic失效率，其中\
  \ \\(\\mu = 0\\)，\\(\\sigma = 1\\)。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_44_1.png)\n\
  \n图1.13：Gumbel失效率。\n\n**表1.1** 期望与方差。\n\n| 分布类型 | 参数 | 定义域 | \\(E(X)\\) | \\(\\\
  operatorname{Var}(X)\\) |\n|---|---|---|---|---|\n| 指数分布 | \\(\\lambda\\) | \\([0,\
  \ \\infty)\\) | \\(1/\\lambda\\) | \\(1/\\lambda^2\\) |\n| 威布尔分布 | \\(\\beta, \\\
  eta\\) | \\([0, \\infty)\\) | \\(\\eta\\Gamma(1 + 1/\\beta)\\) | \\(\\eta^2[\\Gamma(1\
  \ + 2/\\beta) - \\Gamma^2(1 + 1/\\beta)]\\) |\n| 伽马分布 | \\(k, \\theta\\) | \\([0,\
  \ \\infty)\\) | \\(k\\theta\\) | \\(k\\theta^2\\) |\n| 正态分布 | \\(\\mu, \\sigma^2\\\
  ) | \\((-\\infty, \\infty)\\) | \\(\\mu\\) | \\(\\sigma^2\\) |\n| 对数正态分布 | \\(\\\
  mu, \\sigma^2\\) | \\([0, \\infty)\\) | \\(\\exp(\\mu + \\sigma^2/2)\\) | \\((e^{\\\
  sigma^2} - 1)\\exp(2\\mu + \\sigma^2)\\) |\n| Logistic分布 | \\(\\mu, \\sigma\\) |\
  \ \\((-\\infty, \\infty)\\) | \\(\\mu\\) | \\(\\sigma^2\\pi^2/3\\) |\n| Gumbel分布\
  \ | \\(\\mu, \\sigma\\) | \\((-\\infty, \\infty)\\) | \\(\\mu - \\sigma\\gamma\\\
  ) | \\(\\pi^2\\sigma^2/6\\) |\n| 对数Logistic分布 | \\(\\mu, \\sigma\\) | \\((0, \\\
  infty)\\) | \\(e^{\\mu}\\Gamma(1 + \\sigma)\\Gamma(1 - \\sigma)\\) | \\(e^{2\\mu}[\\\
  Gamma(1 + 2\\sigma)\\Gamma(1 - 2\\sigma) - (\\Gamma(1 + \\sigma)\\Gamma(1 - \\sigma))^2]\\\
  ) |\n\n期望值由以下积分给出：\n\n\\[\nE(X) = \\int_0^\\infty 2t e^{-2t}\\,dt = \\left[\\frac{2t\
  \ e^{-2t}}{-2}\\right]_0^\\infty - \\int_0^\\infty \\frac{2 e^{-2t}}{-2}\\,dt\n\\\
  ]\n\n其中使用分部积分，取 \\(u = 2t\\)，\\(v' = e^{-2t}\\)。\n\n因此，\n\n\\[\nE(X) = \\int_0^\\\
  infty e^{-2t}\\,dt = \\left[\\frac{e^{-2t}}{-2}\\right]_0^\\infty = 0 + \\frac12\
  \ = \\frac12\n\\]\n\n\\(X\\) 的二阶矩如下：\n\n\\[\nE(X^2) = \\int_0^\\infty 2t^2 e^{-2t}\\\
  ,dt = \\left[\\frac{2t^2 e^{-2t}}{-2}\\right]_0^\\infty - \\int_0^\\infty \\frac{4t\
  \ e^{-2t}}{-2}\\,dt\n\\]\n\n其中再次使用分部积分，取 \\(u = 2t^2\\)，\\(v = e^{-2t}\\)。由 \\(E(X)\\\
  ) 可得：\n\n\\[\nE(X^2) = \\int_0^\\infty 2t e^{-2t}\\,dt = \\frac12\n\\]\n\n因此\n\n\
  \\[\n\\operatorname{Var}(X) = \\frac12 - \\left(\\frac12\\right)^2 = \\frac14\n\\\
  ]\n\n注意 \\(X\\) 是参数 \\(\\lambda = 2\\) 的指数分布，我们通过积分得到的结果与表1.1中第一行的公式相符。\n\n本节内容可在大多数概率统计入门教材和可靠性工程入门教材中找到。例如，可参见\
  \ Ayyub 和 McCuen (2003)、Ross (1987, 2000)、Milton 和 Arnold (2003)、Elsayed (2012)、Finkelstein\
  \ (2008) 或 Nakagawa (2008)。\n\n### 1.3.2 累积损伤模型\n\n最后，我们简要讨论累积损伤关系，其中首先假定逆幂律成立。设\
  \ \\(V(t)\\) 表示随时间变化的应力；则寿命-应力关系为：\n\n\\[\nL(V(t)) = \\left(\\frac{A}{V(t)}\\right)^n\
  \ \\tag{1.60}\n\\]\n\n其中，与式(1.55)相比，\\(A = K^{-1/n}\\)。\n\n### 指数失效分布\n\n如果TTF分布为指数分布，则\
  \ \\(m(t, V) = L(V(t))\\)。定义\n\n\\[\nI(t, V) = \\int_0^t \\left(\\frac{V(\\tau)}{A}\\\
  right)^n d\\tau \\tag{1.61}\n\\]\n\n该积分为累积损伤，则可靠度函数变为 \\(e^{-I(t,V)}\\)，因此概率密度函数(PDF)的形式为：\n\
  \n\\[\nf(t, V) = \\left(\\frac{V(t)}{A}\\right)^n e^{-I(t,V)} \\tag{1.62}\n\\]\n\
  \n### 威布尔失效分布\n\n如果TTF分布为威布尔分布，则可靠度函数为 \\(e^{-(I(t,V))^\\beta}\\)，其中 \\(I(t, V)\\\
  ) 由式(1.61)给出，相应的概率密度函数变为：\n\n\\[\nf(t, V) = \\beta \\left(\\frac{V(t)}{A}\\right)^n\
  \ (I(t, V))^{\\beta-1} e^{-(I(t,V))^\\beta} \\tag{1.63}\n\\]\n\n### 指数失效分布与阿伦尼乌斯寿命应力\n\
  \n接下来假设采用阿伦尼乌斯寿命应力模型式(1.47)。如果TTF服从指数分布，则类似于式(1.61)，我们有：\n\n\\[\nI(t, V) = \\int_0^t\
  \ \\frac{1}{C} e^{-B / V(\\tau)} d\\tau \\tag{1.64}\n\\]\n\n相应的概率密度函数变为：\n\n\\[\n\
  f(t, V) = \\left(\\frac{1}{C} e^{-B / V(t)}\\right) e^{-I(t,V)} \\tag{1.65}\n\\\
  ]\n\n### 威布尔失效分布与阿伦尼乌斯寿命应力\n\n如果TTF分布为威布尔分布，那么与之前的情况类似，\\(\\eta(t, V) = L(t, V)\\\
  )，因此类似于式(1.62)，我们得到相应的概率密度函数：\n\n\\[\nf(t, V) = \\beta \\left(\\frac{1}{C} e^{-B\
  \ / V(t)}\\right) (I(t, V))^{\\beta-1} e^{-(I(t,V))^\\beta} \\tag{1.66}\n\\]\n\n\
  ### 1.3.3 一般指数模型\n\n接下来，我们展示一般指数关系的情况：\n\n\\[\nL(V(t)) = C e^{B V(t)} \\tag{1.67}\n\
  \\]\n\n在这种情况下\n\n\\[\nI(t, V) = \\int_0^t \\frac{1}{C} e^{-B V(\\tau)} d\\tau \\\
  tag{1.68}\n\\]\n\n其对数形式为：\n\n\\[\nl(C, B) = -N \\ln(C) - B \\sum_{k=1}^{N} \\frac{1}{V_k}\
  \ - \\frac{1}{C} \\sum_{k=1}^{N} \\frac{t_k}{e^{B / V_k}}\n\\]\n\n然后对该式进行极大化。\n\n\
  已有若干关于加速试验的书籍和文章，包括 Nelson (2004)。\n\n## 1.4 参数估计中的不确定度量\n\n首先考虑仅依赖于一个参数 \\(\\theta\\\
  ) 的概率密度函数，该参数通过有限样本来确定。设 \\(f(t|\\theta)\\) 表示概率密度函数，令 \\(t_1, t_2, \\ldots, t_N\\\
  ) 为样本元素。似然函数为：\n\n\\[\nL(\\theta) = \\prod_{k=1}^{N} f(t_k|\\theta)\n\\]\n\n其对数写为：\n\
  \n\\[\nl(\\theta) = \\sum_{k=1}^{N} \\ln(f(t_k|\\theta)) \\tag{1.75}\n\\]\n\n然后对该式进行极大化，以获得未知参数\
  \ \\(\\theta\\) 的最佳估计。通过重复抽样，我们得到不同的样本元素，从而得到不同的 \\(\\theta\\) 估计值。\\(\\theta\\\
  ) 的值取决于样本元素的随机选择，因此它也是一个随机变量。其不确定性可以通过方差来描述。将式(1.75)的极大化解记为 \\(\\theta^*\\)。\n\n\
  Fisher信息量定义为 \\(l(\\theta)\\) 在 \\(\\theta = \\theta^*\\) 处对 \\(\\theta\\) 的二阶导数的负值：\n\
  \n\\[\nI = -\\left.\\frac{\\partial^2 l(\\theta)}{\\partial \\theta^2}\\right|_{\\\
  theta=\\theta^*} \\tag{1.76}\n\\]\n\n并且可以证明，\\(\\theta\\) 的方差是 \\(I\\) 的倒数：\n\n\\\
  [\n\\operatorname{Var}(\\theta) = \\frac{1}{I} \\tag{1.77}\n\\]\n\n(Frieden 2004;\
  \ Pratt 等 1976)。\n\n### 示例1.9\n\n假设 \\(X\\) 服从正态分布，其方差 \\(\\sigma^2\\) 已知，但期望 \\\
  (\\mu\\) 未知。在这种情况下：\n\n\\[\nL(\\mu) = \\prod_{k=1}^{N} \\frac{1}{\\sigma\\sqrt{2\\\
  pi}} e^{\\frac{-(t_k - \\mu)^2}{2\\sigma^2}} = \\frac{1}{(\\sigma\\sqrt{2\\pi})^N}\
  \ e^{-\\frac{1}{2\\sigma^2} \\sum_{k=1}^{N} (t_k - \\mu)^2}\n\\]\n\n因此\n\n\\[\n\
  l(\\mu) = -N \\ln(\\sigma\\sqrt{2\\pi}) - \\frac{1}{2\\sigma^2} \\sum_{k=1}^{N}\
  \ (t_k - \\mu)^2\n\\]\n\n该式必须被极大化。首先注意，当 \\(\\mu \\to -\\infty\\) 或 \\(\\mu \\to\
  \ +\\infty\\) 时，由于 \\(l(\\mu)\\) 趋于 \\(-\\infty\\)，所以最大值在内部取得。通过求导：\n\n\\[\n\\frac{\\\
  partial l(\\mu)}{\\partial \\mu} = \\frac{1}{\\sigma^2} \\sum_{k=1}^{N} (t_k - \\\
  mu) = \\frac{1}{\\sigma^2} \\left(\\sum_{k=1}^{N} t_k - N \\mu\\right) = 0\n\\]\n\
  \n这意味着极大似然估计为：\n\n\\[\n\\mu^* = \\frac{1}{N} \\sum_{k=1}^{N} t_k = \\bar{t}\n\\\
  ]\n\n即样本均值。\n\n这给出了参数 \\(\\mu\\) 的期望。为了得到 \\(\\mu\\) 的方差，我们首先计算Fisher信息量：\n\n\\\
  [\nI = - \\frac{\\partial^2 l(\\mu)}{\\partial \\mu^2} = \\frac{N}{\\sigma^2}\n\\\
  ]\n\n这表明 \\(\\mu\\) 的方差为 \\(\\sigma^2/N\\)，因此对于较大的 \\(N\\)，\\(\\mu\\) 可以用均值为 \\\
  (\\mu^*\\)、标准差为 \\(\\sigma/\\sqrt{N}\\) 的正态分布来近似。\n\n### 示例1.10\n\n接下来假设 \\(X\\\
  ) 服从参数 \\(\\lambda\\) 未知的指数分布。如果 \\(t_1, t_2, \\ldots, t_N\\) 为样本元素，则\n\n\\[\nL(\\\
  lambda) = \\prod_{k=1}^N \\lambda e^{-\\lambda t_k} = \\lambda^N e^{-\\lambda \\\
  sum_{k=1}^N t_k}\n\\]\n\n其对数形式为：\n\n\\[\nl(\\lambda) = N \\ln(\\lambda) - \\lambda\
  \ \\sum_{k=1}^N t_k\n\\]\n\n当 \\(\\lambda \\to 0\\) 或 \\(\\lambda \\to \\infty\\\
  ) 时，\\(l(\\lambda)\\) 的值趋于负无穷，因此最优值在内部取得。由于\n\n\\[\n\\frac{\\partial l(\\lambda)}{\\\
  partial \\lambda} = \\frac{N}{\\lambda} - \\sum_{k=1}^N t_k\n\\]\n\n似然估计为：\n\n\\\
  [\n\\lambda^* = \\frac{N}{\\sum_{k=1}^N t_k} = \\frac{1}{\\bar{t}}\n\\]\n\nFisher信息量显然为：\n\
  \n\\[\nI = - \\frac{\\partial^2 l(\\lambda)}{\\partial \\lambda^2} = \\frac{N}{\\\
  lambda^2}\n\\]\n\n而 \\(\\lambda\\) 的方差为 \\(\\lambda^{*2} / N\\)。\n\n如果分布依赖于多个参数——例如，其概率密度函数为\
  \ \\(f(t|\\theta_1, \\ldots, \\theta_n)\\) ——那么似然函数为：\n\n\\[\nL(\\theta_1, \\ldots,\
  \ \\theta_n) = \\prod_{k=1}^N f(t_k|\\theta_1, \\ldots, \\theta_n)\n\\]\n\n其对数形式为：\n\
  \n\\[\nl(\\theta_1, \\ldots, \\theta_n) = \\sum_{k=1}^N \\ln(f(t_k | \\theta_1,\
  \ \\ldots, \\theta_n))\n\\]\n\n此时Fisher信息量是一个矩阵，即 \\(l(\\theta_1, \\ldots, \\theta_n)\\\
  ) 的负Hessian矩阵：\n\n\\[\nI(\\theta_1, \\ldots, \\theta_n) =\n\\begin{pmatrix}\n-\\\
  frac{\\partial^2 l}{\\partial \\theta_1^2} & -\\frac{\\partial^2 l}{\\partial \\\
  theta_1 \\partial \\theta_2} & \\cdots & -\\frac{\\partial^2 l}{\\partial \\theta_1\
  \ \\partial \\theta_n} \\\\\n-\\frac{\\partial^2 l}{\\partial \\theta_2 \\partial\
  \ \\theta_1} & -\\frac{\\partial^2 l}{\\partial \\theta_2^2} & \\cdots & -\\frac{\\\
  partial^2 l}{\\partial \\theta_2 \\partial \\theta_n} \\\\\n\\vdots & \\vdots &\
  \ \\ddots & \\vdots \\\\\n-\\frac{\\partial^2 l}{\\partial \\theta_n \\partial \\\
  theta_1} & -\\frac{\\partial^2 l}{\\partial \\theta_n \\partial \\theta_2} & \\\
  cdots & -\\frac{\\partial^2 l}{\\partial \\theta_n^2}\n\\end{pmatrix}\n\\]\n\n可以证明，\\\
  (I(\\theta_1, \\ldots, \\theta_n)\\) 的逆矩阵给出 \\((\\theta_1, \\ldots, \\theta_n)\\\
  ) 的协方差矩阵。\n\n### 示例1.11\n\n现在设 \\(X\\) 为具有未知参数 \\(\\mu\\) 和 \\(\\sigma^2\\) 的正态变量。由示例1.9可知：\n\
  \n\\[\nl(\\mu, V) = -\\frac{N}{2} \\ln(V) - N \\ln(\\sqrt{2\\pi}) - \\frac{1}{2V}\
  \ \\sum_{k=1}^N (t_k - \\mu)^2\n\\]\n\n其中我们使用简化记号 \\(V = \\sigma^2\\)。注意：\n\n\\\
  [\n\\frac{\\partial l}{\\partial \\mu} = -\\frac{1}{2V} \\sum_{k=1}^N 2(t_k - \\\
  mu)(-1) = \\frac{1}{V} \\left(\\sum_{k=1}^N t_k - N \\mu\\right)\n\\]\n\n一阶条件意味着\
  \ \\(\\mu\\) 的似然估计为：\n\n\\[\n\\mu^* = \\frac{1}{N} \\sum_{k=1}^N t_k = \\bar{t}\n\
  \\]\n\n类似地\n\n\\[\n\\frac{\\partial l}{\\partial V} = -\\frac{N}{2V} + \\frac{1}{2V^2}\
  \ \\sum_{k=1}^N (t_k - \\mu)^2\n\\]\n\n\n\n$$\n\\frac{\\partial^2 l}{\\partial V^2}=\\\
  frac{N}{2V^2}-\\frac{1}{2}\\cdot\\frac{2}{V^3}\\sum_{k=1}^{N}(t_k-\\mu)^2\n$$\n\n\
  在点 $(\\mu^*,V^*)$ 处，\n\n$$\n\\frac{\\partial^2 l}{\\partial\\mu^2}=-\\frac{N}{V},\\\
  quad \\frac{\\partial^2 l}{\\partial\\mu\\partial V}=0,\\quad \\frac{\\partial^2\
  \ l}{\\partial V^2}=\\frac{N}{2V^2}-\\frac{1}{V^3}NV=-\\frac{N}{2V^2}\n$$\n\n因此\n\
  \n$$\nI(\\mu,V)=\\begin{pmatrix}\\frac{N}{V}&0\\\\0&\\frac{N}{2V^2}\\end{pmatrix}\n\
  $$\n\n其逆矩阵为\n\n$$\n\\operatorname{Cov}(\\mu,V)=\\begin{pmatrix}\\frac{V}{N}&0\\\\\
  0&\\frac{2V^2}{N}\\end{pmatrix}=\\begin{pmatrix}\\frac{\\sigma^2}{N}&0\\\\0&\\frac{2\\\
  sigma^4}{N}\\end{pmatrix}\n$$\n\n所以\n\n$$\n\\operatorname{Var}(\\mu)=\\frac{\\sigma^2}{N},\\\
  quad \\operatorname{Var}(\\sigma^2)=\\frac{2\\sigma^4}{N},\\quad \\operatorname{Cov}(\\\
  mu,\\sigma^2)=0\n$$\n\n## 1.5 预期失效次数\n\n在给定时间段 $[0,t]$ 内的预期失效次数是对象（可以是元件、单元、组件甚至整个系统）可靠运行的一个重要特征。显然，这一期望值取决于我们对失效的处理方式。本节将讨论三种情况：最小维修、部分维修和失效更换。我们还将包括执行维修或更换所需的时间长度。\n\
  \n本节内容基于更新理论，其基础可参见 Cox (1970) 和 Ross (1996) 等文献。\n\n### 1.5.1 最小维修\n\n首先考虑最小维修的情况，每次维修需要\
  \ $T$ 时间，在此期间对象不运行。设 $S_1$ 表示首次失效的时间，$M(t)$ 表示区间 $[0,t]$ 内失效的预期次数，$X_t$ 表示该区间内失效的实际次数。则\n\
  \n$$\nM(t)=E(X_t)=E_{S_1}\\bigl(E(X_t\\mid S_1)\\bigr) \\tag{1.78}\n$$\n\n其中\n\n\
  $$\nE(X_t\\mid S_1)=\\begin{cases}\n0 & \\text{若 } t<S_1\\\\\n1 & \\text{若 } S_1<t<S_1+T\\\
  \\\n1+M(t-T)-M(S_1) & \\text{若 } t>S_1+T\n\\end{cases} \\tag{1.79}\n$$\n\n因此\n\n\
  $$\nM(t)=\\int_0^{t-T}\\bigl(1+M(t-T)-M(s)\\bigr)f(s)\\,ds+\\int_{t-T}^{t}f(s)\\\
  ,ds\n$$\n\n其中 $f(t)$ 是 TTF 的概率密度函数，所以\n\n$$\n\\begin{aligned}\nM(t)&=F(t-T)\\bigl(1+M(t-T)\\\
  bigr)-\\int_{0}^{t-T}M(s)f(s)\\,ds+F(t)-F(t-T)\\\\\n&=M(t-T)F(t-T)+F(t)-\\int_{0}^{t-T}M(s)f(s)\\\
  ,ds\n\\end{aligned} \\tag{1.80}\n$$\n\n在 $T=0$ 的特殊情况下，该积分方程修改为\n\n$$\nM(t)=M(t)F(t)+F(t)-\\\
  int_{0}^{t}M(s)f(s)\\,ds \\tag{1.81}\n$$\n\n其中 $M(0)=0$。我们将证明，对于失效率 $\\rho(\\tau)$，\n\
  \n$$\nM(t)=\\int_{0}^{t}\\rho(\\tau)\\,d\\tau \\tag{1.82}\n$$\n\n通过代入法可解该方程。首先注意到，根据图\
  \ 1.15 所示的积分域，\n\n$$\n\\begin{aligned}\n\\int_{0}^{t}M(s)f(s)\\,ds\n&=\\int_{0}^{t}\\\
  int_{0}^{s}\\rho(\\tau)\\,d\\tau\\,f(s)\\,ds\n=\\int_{0}^{t}\\int_{\\tau}^{t}\\\
  rho(\\tau)f(s)\\,ds\\,d\\tau\\\\\n&=\\int_{0}^{t}\\rho(\\tau)\\bigl[F(t)-F(\\tau)\\\
  bigr]\\,d\\tau\n=\\int_{0}^{t}\\rho(\\tau)\\,d\\tau\\,F(t)-\\int_{0}^{t}\\rho(\\\
  tau)\\bigl(1-R(\\tau)\\bigr)\\,d\\tau\\\\\n&=M(t)F(t)-M(t)+\\int_{0}^{t}\\frac{f(\\\
  tau)}{R(\\tau)}R(\\tau)\\,d\\tau\n=M(t)F(t)-M(t)+F(t)\n\\end{aligned}\n$$\n\n因此式\
  \ (1.81) 的右侧变为\n\n$$\nM(t)F(t)+F(t)-\\bigl[M(t)F(t)-M(t)+F(t)\\bigr]=M(t)\n$$\n\n\
  式 (1.82) 的简单公式表明 $\\{X_t\\}$ 是一个到达率为 $\\rho(t)$ 的非齐次泊松过程，这具有几个重要的推论。\n\n**图 1.15**\
  \ 积分域。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_56_0.png)\n\n如果失效是独立的，则 $X_t$\
  \ 是期望为 $\\lambda=M(t)$ 的泊松变量，因此\n\n$$\nP(X_t=n)=\\frac{M(t)^n}{n!}e^{-M(t)} \\tag{1.83}\n\
  $$\n\n假设可修复失效发生在时间 $0<t_1<t_2<\\cdots$，且维修是即时完成的。设 $F_k(t)$ 表示 $t_k$ 的累积分布函数。则\n\
  \n$$\nF_k(t)=P(t_k\\le t)=P(X_t\\ge k)=\\sum_{n=k}^{\\infty}\\frac{M(t)^n}{n!}e^{-M(t)}\
  \ \\tag{1.84}\n$$\n\n相应的概率密度函数是其导数，\n\n$$\n\\begin{aligned}\nf_k(t)=F_k'(t)\n&=\\\
  sum_{n=k}^{\\infty}\\left(\\frac{nM(t)^{n-1}}{n!}\\rho(t)e^{-M(t)}+\\frac{M(t)^n}{n!}e^{-M(t)}(-\\\
  rho(t))\\right)\\\\\n&=\\sum_{n=k}^{\\infty}\\left(\\frac{M(t)^{n-1}}{(n-1)!}-\\\
  frac{M(t)^n}{n!}\\right)e^{-M(t)}\\rho(t)\\\\\n&=\\frac{M(t)^{k-1}}{(k-1)!}e^{-M(t)}\\\
  rho(t)\n\\end{aligned} \\tag{1.85}\n$$\n\n### 例 1.12\n\n在 $X$ 为指数分布的特殊情况下，$\\rho(t)=\\\
  lambda$ 且 $M(t)=\\lambda t$，因此\n\n$$\nf_k(t)=\\frac{(\\lambda t)^{k-1}}{(k-1)!}\\\
  lambda e^{-\\lambda t}=\\frac{\\lambda^k t^{k-1}e^{-\\lambda t}}{(k-1)!} \\tag{1.86}\n\
  $$\n\n这是一个参数为 $k$ 和 $\\theta=1/\\lambda$ 的伽马概率密度函数。\n\n### 例 1.13\n\n如果 $X$ 服从韦布尔分布，则\
  \ $\\rho(t)=\\frac{\\beta}{\\eta^\\beta}t^{\\beta-1}$ 且 $M(t)=\\left(\\frac{t}{\\\
  eta}\\right)^\\beta$，因此\n\n$$\nf_k(t)=\\frac{\\left(\\frac{t}{\\eta}\\right)^{\\\
  beta(k-1)}}{(k-1)!}\\frac{\\beta}{\\eta^\\beta}t^{\\beta-1}e^{-\\left(\\frac{t}{\\\
  eta}\\right)^\\beta}\n=\\frac{\\beta t^{\\beta k-1}e^{-\\left(\\frac{t}{\\eta}\\\
  right)^\\beta}}{(k-1)!\\,\\eta^{\\beta k}} \\tag{1.87}\n$$\n\n### 1.5.2 失效更换\n\n\
  接下来假设发生失效时进行失效更换，这需要 $T$ 时间来完成。然后，与前面的情况类似，\n\n$$\nE(X_t\\mid S_1)=\\begin{cases}\n\
  0 & \\text{若 } t<S_1\\\\\n1 & \\text{若 } S_1<t<S_1+T\\\\\n1+E(X_{t-S_1-T}) & \\\
  text{若 } t>S_1+T\n\\end{cases} \\tag{1.88}\n$$\n\n因此，式 (1.78) 意味着\n\n$$\n\\begin{aligned}\n\
  M(t)\n&=\\int_{t-T}^{t}f(s)\\,ds+\\int_{0}^{t-T}\\bigl(1+M(t-s-T)\\bigr)f(s)\\,ds\\\
  \\\n&=F(t)-F(t-T)+F(t-T)+\\int_{0}^{t-T}M(t-s-T)f(s)\\,ds\\\\\n&=F(t)+\\int_{0}^{t-T}M(t-s-T)f(s)\\\
  ,ds\n\\end{aligned}\n$$\n\n如果 $t\\le T$，则积分为零，因此\n\n$$\nM(t)=\\begin{cases}\nF(t)\
  \ & \\text{若 } t\\le T\\\\[2pt]\n\\displaystyle F(t)+\\int_{0}^{t-T}M(t-T-s)f(s)\\\
  ,ds & \\text{若 } t>T\n\\end{cases} \\tag{1.89}\n$$\n\n如果更换是瞬时的，则 $T=0$，因此\n\n$$\n\
  M(t)=F(t)+\\int_{0}^{t}M(t-s)f(s)\\,ds \\tag{1.90}\n$$\n\n给出了 $M(t)$ 的方程。这个积分方程的解没有简单的公式。然而，使用拉普拉斯变换提供了一个有趣的见解。设\
  \ $M^*(s)$、$F^*(s)$ 和 $f^*(s)$ 分别表示 $M(t)$、$F(t)$ 和 $f(t)$ 的拉普拉斯变换。则从式 (1.90) 可得\n\
  \n$$\nM^*(s)=F^*(s)+M^*(s)f^*(s)\n$$\n\n这意味着\n\n$$\nM^*(s)=\\frac{F^*(s)}{1-f^*(s)}=\\\
  frac{\\frac{1}{s}f^*(s)}{1-f^*(s)}\n$$\n\n如果 $g(t)$ 表示 $\\frac{f^*(s)}{1-f^*(s)}$\
  \ 的拉普拉斯逆变换，则\n\n$$\nM(t)=\\int_{0}^{t}g(\\tau)\\,d\\tau \\tag{1.91}\n$$\n\n表明 $\\\
  {X_t\\}$ 再次是一个到达率为 $g(t)$ 的非齐次泊松过程。\n\n设 $0<t_1<t_2<\\cdots$ 表示失效的时间。则 $z_k=t_{k+1}-t_k$（$k=0,1,\\\
  ldots$ 且 $t_0=0$）是概率密度函数为 $f(t)$ 的独立随机变量。则 $t_k$ 的密度 $f_k(t)$ 是 $f(t)$ 的 $k$ 重卷积：\n\
  \n$$\nf_k(t)=f(t)*f(t)*\\cdots*f(t)\n$$\n\n注意\n\n$$\nE(t_k)=E(z_1)+E(z_2)+\\cdots+E(z_k)=E(z_1)k=\\\
  mu k,\n$$\n\n其中 $\\mu$ 是 TTF 的均值。类似地，\n\n$$\n\\operatorname{Var}(t_k)=\\operatorname{Var}(z_1)+\\\
  operatorname{Var}(z_2)+\\cdots+\\operatorname{Var}(z_k)=\\operatorname{Var}(z_1)k=\\\
  sigma^2 k\n$$\n\n其中 $\\sigma^2$ 是 TTF 的方差值。如果 $z_k$ 服从指数分布，则 $t_k$ 服从伽马分布；如果 $z_k$\
  \ 服从伽马分布，则 $t_k$ 也服从伽马分布；如果 $z_k$ 服从正态分布，则 $t_k$ 也服从正态变量。\n\n基于这些值，在其他情况下，$t_k$\
  \ 的概率密度函数可以用具有给定期望和方差的对数正态或伽马变量来估计；并且可以为用户选择的任何显著性水平构建置信区间。\n\n如果维修或更换需要 $T$ 时间，则第\
  \ $k$ 次失效的时间为 $\\bar{t}_k=t_k+(k-1)T$，其累积分布函数为\n\n$$\n\\bar{F}_k(t)=P\\bigl(t_k+(k-1)T\\\
  le t\\bigr)=P\\bigl(t_k\\le t-(k-1)T\\bigr)\n=\\begin{cases}\n0 & \\text{若 } t\\\
  le (k-1)T\\\\[2pt]\nF_k\\bigl(t-(k-1)T\\bigr) & \\text{其他情况}\n\\end{cases} \\tag{1.92}\n\
  $$\n\n其中 $F_k(t)$ 是 $f_k(t)$ 的累积分布函数。\n\n### 1.5.3 部分维修导致失效次数减少\n\n接下来假设执行部分维修，导致失效次数减少因子\
  \ $\\alpha<1$。然后，与前面的情况类似，\n\n$$\nE(X_t\\mid S_1)=\\begin{cases}\n0 & \\text{若 }\
  \ t<S_1\\\\\n1 & \\text{若 } S_1<t<S_1+T\\\\\n1+\\alpha\\bigl(M(t-T)-M(S_1)\\bigr)\
  \ & \\text{若 } t>S_1+T\n\\end{cases} \\tag{1.93}\n$$\n\n因此\n\n$$\n\\begin{aligned}\n\
  M(t)\n&=\\int_{t-T}^{t}f(s)\\,ds+\\int_{0}^{t-T}\\Bigl[1+\\alpha\\bigl(M(t-T)-M(s)\\\
  bigr)\\Bigr]f(s)\\,ds\\\\\n&=F(t)-F(t-T)+F(t-T)+\\alpha M(t-T)F(t-T)-\\alpha\\int_{0}^{t-T}M(s)f(s)\\\
  ,ds\\\\\n&=\\begin{cases}\nF(t) & \\text{若 } t\\le T\\\\[2pt]\nF(t)+\\alpha M(t-T)F(t-T)-\\\
  alpha\\displaystyle\\int_{0}^{t-T}M(s)f(s)\\,ds & \\text{若 } t>T\n\\end{cases}\n\
  \\end{aligned} \\tag{1.94}\n$$\n\n再次假设 $T=0$ 的即时维修。则 (1.94) 修改为\n\n$$\nM(t)=F(t)+\\\
  alpha M(t)F(t)-\\alpha\\int_{0}^{t}M(s)f(s)\\,ds \\tag{1.95}\n$$\n\n### 1.5.4 部分维修导致有效役龄减少\n\
  \n最后考虑部分维修将对象的有效役龄减少因子 $\\alpha<1$ 的情况。则我们有\n\n$$\nE(X_t\\mid S_1)=\\begin{cases}\n\
  0 & \\text{若 } t<S_1\\\\\n1 & \\text{若 } S_1<t<S_1+T\\\\\n1+M\\bigl(t-S_1-T+\\alpha\
  \ S_1\\bigr)-M(\\alpha S_1) & \\text{若 } t>S_1+T\n\\end{cases} \\tag{1.96}\n$$\n\
  \n因为在时间 $t$ 时，有效役龄为 $(t-S_1-T)+\\alpha S_1$，其中第一项是区间 $[S_1+T,t]$ 的长度，第二项是维修后时间 $S_1+T$\
  \ 时的有效役龄。因此\n\n$$\n\\begin{aligned}\nM(t)\n&=\\int_{t-T}^{t}f(s)\\,ds+\\int_{0}^{t-T}\\\
  Bigl[1+M\\bigl(t-s-T+\\alpha s\\bigr)-M(\\alpha s)\\Bigr]f(s)\\,ds\\\\\n&=\\begin{cases}\n\
  F(t) & \\text{若 } t\\le T\\\\[2pt]\nF(t)+\\displaystyle\\int_{0}^{t-T}\\Bigl[M\\\
  bigl(t-s-T+\\alpha s\\bigr)-M(\\alpha s)\\Bigr]f(s)\\,ds & \\text{若 } t>T\n\\end{cases}\n\
  \\end{aligned} \\tag{1.97}\n$$\n\n如果 $T=0$，则\n\n$$\nM(t)=F(t)+\\int_{0}^{t}\\Bigl[M\\\
  bigl(t-s+\\alpha s\\bigr)-M(\\alpha s)\\Bigr]f(s)\\,ds \\tag{1.98}\n$$\n\n注意，$\\\
  alpha=1$ 的情况对应于最小维修，且式 (1.95) 和 (1.98) 应按预期简化为式 (1.81)。式 (1.81)、(1.90) 和 (1.95)\
  \ 通常称为更新方程（Mitov 和 Omey 2014）。\n\n\n\n\n\nFFP 签名已被预测算法成功处理，以产生系统健康状况和剩余寿命的准确估计。通过进一步将\
  \ FFP 签名数据转换为退化进展签名（DPS）数据，然后将 DPS 数据转换为功能失效签名（FFS）数据，可提高准确性。由采用卡尔曼类滤波、随机游走和/或其它趋势算法的预测算法处理的\
  \ FFS 数据可产生非常准确的预测估计，并从例如初始误差 50% 快速收敛到 20 个以下数据样本内的 10%。这种快速、准确的收敛对于 PHM 系统中的 CBM\
  \ 非常有用（Hofmeister et al. 2016, 2017a,b）。\n\n### 1.6.1 基于 CBM 的 PHM 系统的通用框架\n\n图\
  \ 1.16 说明了构成 CBM 框架的 PHM 系统。该系统监控、捕获和处理 CBD 以提取指示设备、组件、组件和系统子系统中健康状态（SoH）的签名。提取的签名被处理以产生预测信息，例如\
  \ SoH 和 RUL，然后进一步处理以管理系统的维护和后勤（CALCE 2015；Hofmeister et al. 2016）。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_61_0.png)\n\
  \n图 1.16 PHM 系统的高级框图。\n\n图 1.17 是 CBM 框架的示例说明。该框架由以下部分组成：\n\n- (i) 一个传感器框架，\n- (ii)\
  \ 一个特征向量框架，\n- (iii) 一个预测框架，\n- (iv) 一个健康管理框架，\n- (v) 一个性能验证框架，以及\n- (vi) 一个控制和数据流框架。\n\
  \n传感器框架包括在系统内部节点捕获信号的传感器。智能传感器提供初始数据调理，例如模数数据转换和数字信号处理，并产生并传输 FD，例如标量值。特征向量框架提供额外的数据调理，包括数据融合和转换以创建签名，例如用作预测框架输入数据的\
  \ FFS，后者产生预测信息。健康管理框架处理预测信息以创建诊断、预测和后勤指令和操作，以维护系统的健康和可靠性。性能验证框架提供手段和方法来产生预测性能指标以评估预测信息的准确性。控制和数据流框架管理\
  \ PHM 功能和操作（CALCE 2015；Pecht 2008；Kumar and Pecht 2010）。\n\n预测目标的可靠性 $R(t)$（参见公式\
  \ (1.14)）是预测目标将在所需时间内令人满意运行的概率。可靠性与寿命和平均故障间隔时间（MTBF）之间的关系如下（Speaks 2005）。理论上，平均故障间隔时间可通过概率推理作为\
  \ TTF 的期望值获得：\n\n$$\\mathrm{MTBF}=\\int_0^\\infty tf(t)\\,dt$$\n\n其中 $f(t)$ 是 PDF。通过检查多个测试单元，可以实际获得\n\
  \n$$\\mathrm{MTBF}=(NT)/F$$\n\n其中 $N$ = 测试单元数，$T$ = 测试时间，$F$ = 测试故障数。\n\n到时间 $T$\
  \ 的故障数的相对频率显然为 $F/N$，它是 TTF 在时间 $t=T$ 时的 CDF 的估计量。如果分布是指数分布，则其参数可由下式估计\n\n$$1-e^{-\\\
  lambda T}=F/N \\tag{1.101}$$\n\n因此 $\\lambda$ 的估计值为\n\n$$\\lambda=-\\frac{1}{T}\\\
  ln\\left(1-\\frac{F}{N}\\right) \\tag{1.102}$$\n\n然后 CDF 由 $F(t)=1-e^{-\\lambda\
  \ t}$ 给出，可靠性函数为 $R(t)=e^{-\\lambda t}$，恒定故障率为 $\\lambda$。我们之前推导了这些结果；例如参见公式 (1.2)。如果\
  \ TTF 的分布具有一个以上的参数，则 $\\lambda$ 提供的信息不足以估计 $R(t)$。例如，方差可通过重复测试估计，因此对于通常的两个参数（例如\
  \ Weibull、gamma、正态等）可获得两个方程。\n\nMTBF 是适用于一组预测目标 $N$ 的统计量，不适用于估计系统中特定预测目标的寿命或 RUL。\n\
  \n**示例 1.16** 作为 MTBF 用法的示例，假设 MTBF 被确定为 500 天。那么特定预测目标将在规格范围内继续运行 500 天的概率 = 0.368（36.8%）：指数值\
  \ (−1)。特别注意，MTBF 不用于估计预测目标的故障时间。\n\n### 1.6.2 PHM 与系统可靠性的关系\n\nPHM 与系统可靠性有什么关系？例如，假设\
  \ PHM 系统设计为准确预测系统中每个预测目标的功能失效时间；进一步假设该系统的故障/健康管理框架能够在功能失效的实际时间之前更换和/或修复每个预测目标；还假设对每个预测目标进行维护的时间发生在检测到退化之后；并且还假设在\
  \ PHM 启用系统中更换和/或修复预测目标的时间小于更换和/或修复意外停机的所需时间。在这种 PHM 启用系统中，系统的有效 MTBF 增加，因此系统的可靠性也增加。除了提高系统的可靠性外，PHM\
  \ 还降低了维护系统的成本，因为预测目标的使用寿命增加，并且通常计划性停机比意外停机在时间和材料上花费更少。\n\n任何数量的传统建模方法都可作为 PHM 启用系统的基础平台，可分为基于模型的预测、数据驱动预测或混合驱动预测（见图\
  \ 1.18）。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_64_0.png)\n\n**图 1.18** 预测方法的分类。\n\
  \n基于模型的方法通常在预测估计中提供潜在更高的精度和准确性，但难以应用于复杂系统。数据驱动方法更容易应用，但预测估计的精度和准确性可能较低。混合驱动方法提供高度的精度和准确性，并适用于复杂系统，包括车载和离车系统，利用两种方法（Pecht\
  \ 2008；Medjaher and Zerhouni 2013）。\n\n在第 2 章中，我们将更详细地回到这些概念和方法。\n\n### 1.6.3 退化进展签名（DPS）和预测\n\
  \nCBM 系统，例如本书中介绍的系统，使用 CBD 方法。随着系统中预测目标从无损伤状态（零退化）进展到损伤状态（退化），然后到失效状态，系统一个或多个节点的一个或多个信号会发生变化。这种信号变化可以被\
  \ PHM 系统感知、测量、收集和处理，以产生用于故障和/或健康管理的高度准确的预测信息。例如，假设系统中电源损坏，输出的纹波电压随电源中损坏量（累积退化）增加而变化并增加。进一步假设纹波电压的幅度可以被\
  \ PHM 系统中的传感器框架感知、测量和收集。CBD 幅度的收集形成 FFP 签名，如图 1.19 所示。\n\n显然，由于测量不确定性和噪声的影响，FFP\
  \ 曲线并不平滑。现在假设该 PHM 系统中的特征向量框架由数据调理算法组成，这些算法对基于 CBD 的 FFP 签名进行滤波、平滑、融合和转换，形成 DPS\
  \ 数据：一条传输曲线。理想的 DPS 在无退化时具有恒定的稳态值；它随退化程度线性增加；并且在退化程度达到最大值时达到最大幅度：物理失效发生。对于此示例，这种理想的\
  \ DPS 显示为图 1.20 中具有正斜率的线；还显示了退化开始发生的时间点和物理失效发生的时间点。\n\n\n\n\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_65_0.png)\n\
  \n**图 1.19** FFP 签名的示例 – 曲线状（凸形）、噪声较大的特性曲线。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_65_1.png)\n\
  \n**图 1.20** 叠加在 FFP 签名上的理想 DPS 传输曲线。\n\n## 归一化非理想数据（CAPVR01）及传输曲线\n\n图 1.22 归一化并转换后的\
  \ FFP 和 DPS 转换为 FFS。\n\n### 理想 FFS：CAPVR01 的 CBD 传输曲线\n\n图 1.23 理想 FFS – CBD 的传输曲线。\n\

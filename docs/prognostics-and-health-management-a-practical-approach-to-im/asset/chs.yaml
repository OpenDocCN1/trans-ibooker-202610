  \n我们将使用第 6 章中的 SMPS-EMA 示例作为基础平台来构建一个示例情况，以说明各种方法的成本效益。您和您的客户同意，成本效益分析不包括不可避免的灾难性失效（例如，被另一辆车撞击），并且由于关键性\n\
  \n\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_363_0.png)\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_363_1.png)\n\
  \n**图 7.9** 估计的 PD 和实际 PD：EMA 绕组（上）和 EMA 晶体管（下）。\n\n未能满足意外故障将少于 5% 的要求，它建立了成本的基线估计。\n\
  \n贵客户安排了 6 台电源和 12 台 EMA 的特殊交付。这 18 台设备接受了类似于 HALT 的使用测试（请回顾第 2.2 节）。贵团队协助了实验设计和测试台的搭建；所测试的设备（电源和\
  \ EMA）需要具备预测功能，如第 6 章所述。出于分析目的，测试故障应被评估为好像所有被测试设备同时安装，并在测试中指示的顺序和时间发生故障。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_364_0.png)\n\
  \n**图 7.10** PITTF0 = 4800 和 PITTF0 = 2290 时的 RUL 和 PH 曲线。\n\n用于成本效益分析的数字由客户提供，并列于表\
  \ 7.1 和 7.5。经过检查测试结果（见图 7.15 和表 7.6），贵客户得出结论，电源场景的成本效益分析足以评估五种方法。\n\n**表 7.4** 使用增强程序并采用\
  \ PITTF0 = 4800 进行的汇总计算。\n\n增强 ARULEAV 后 PD(EST) 的比较。\n\nPITTF0 = 4800（h）：初始 PD（PD0）=\
  \ PITTF0 * PITTFADJ。\n\n| LRU 类型 | BD 检测 | 故障检测 | 测得的 PD | PD0 - PD 之前 | PD0 - PD\

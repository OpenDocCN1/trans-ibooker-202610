  ## 测量延迟


  多个变量（如电压和电流）的测量并非完全同时进行：在测量数据的采集、处理和存储之间存在时间差。在示例 5.5 中，电压和电流测量被融合以生成与温度相关的电阻值：


  R = V/I


  随后使用线性电阻-温度表达式和实测温度值，将这些电阻值转换为与温度无关的值：


  R₀ ≈ (V/I)/(1 + TC_R T_M)


  我们设计并执行了一项实验，使用测试平台通过大范围的供电电压和温度变化来模拟退化，以评估示例 5.5 中所述方法的有效性：温度、电压和电流的测量示例图如图 5.12
  所示，计算所得电阻如图 5.13 所示。随着退化的进展，与温度无关的电阻值曲线变得越来越嘈杂。该噪声随后被归因于三个因素：(i) 测量之间的时间差异，(ii)
  使用线性表达式关联电阻和温度时引入的转换误差，以及 (iii) 随电阻增大而产生的放大效应。


  评估：(i) 试图通过改变数据采集和处理方法来降低噪声将代价高昂；(ii) 此类噪声确实会增加测量不确定性，但误差通常微乎其微；因此 (iii) 这种不准确程度是可以接受的。虽然最终没有要求或实施任何更改，但以下更改选项是可行的：(i)
  使用更高的采样率，从而缩短测量之间的时间差，(ii) 使用更快的计算来进一步缩短测量之间的时间差，以及 (iii) 采用并行而非串行的测量方式。


  ## 采样率


  采样是一种低通滤波形式，与传感系统的分辨率和精度有着重要关系。在本书中，我们指三种不同的采样率：系统在节点处执行信号采样的速率、从节点提取特征的速率（特征提取采样），以及
  FD 采样的速率（数据采样）。



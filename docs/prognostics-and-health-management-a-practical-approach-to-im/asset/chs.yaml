  ## 5.2 Heuristic-Based Approach Applied to Non-Ideal CBD Signatures


  CBD特征签名并非理想：它们包含偏移误差、失真和噪声——包括例如由于反馈效应和多失效模式效应引起的信号变化。本章包含用于减轻和/或改善此类非理想性的方法。在CBD特征签名的处理和将这些特征签名转换为作为预测系统输入的FFS的过程中引入了其他误差。


  即使CBD完全没有与退化无关的噪声和变异，将传感器连接到节点以收集数据然后处理该数据也会引入数据误差。传感器可能执行噪声滤波或数据采样，或充当模拟-数字数据转换器（ADC），并且数字化数据使用数字信号处理（DSP）方法和技术进行处理，包括额外的滤波、数据融合、数据和域变换、数据存储和数据传输，所有这些都会引入数据误差。操作和环境变异，例如电压和温度变异，也是导致非理想数据的信号变异的来源（Texas
  Instruments 1995；Jenq and Qiong 2002；Hofmeister et al. 2013, 2016, 2017）。







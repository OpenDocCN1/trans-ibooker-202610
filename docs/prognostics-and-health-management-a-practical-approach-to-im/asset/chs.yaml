  infty} = 0 + e^{-(0.4)^{1.5}} = 0.7765$$\n\n### 1.2.4 分布之间的关系\n\n正态与对数正态、逻辑斯蒂与对数逻辑斯蒂、伽马与对数伽马、冈贝尔与对数冈贝尔分布之间存在紧密的联系。若\

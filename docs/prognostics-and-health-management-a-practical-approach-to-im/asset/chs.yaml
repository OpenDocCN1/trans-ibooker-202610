  \n### PH Convergence\n\n正如你所发现的，一个非常重要的性能指标，如果不是最重要的，就是 PH 收敛到精度 α 以内 ($PH_α$)：所有后续\
  \ PH 估计都在实际 PH 的 α 百分比以内。PH 收敛主要取决于预测算法如何处理数据中的扰动（噪声）和非线性。\n\n那么，预测程序 DXARULE 的表现如何？幸运的是，你设计的\

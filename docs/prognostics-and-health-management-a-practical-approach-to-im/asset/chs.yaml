  \n本章的主要目标是为这一复杂科学领域提供一个总体概述。关于用于支持 PHM 系统中预后预测的基于启发式的方法对基于状态的数据进行建模的详细描述和模型开发将在后续章节中介绍。\n\
  \n### 1.1.2 章节组织\n\n本章其余部分组织如下，以介绍和讨论一种基于启发式的方法来建模 CBD 特征：\n\n- 1.2 可靠性理论基础\n本节介绍了可靠性建立的基础：失效分布、概率和可靠性、概率密度函数及其关系、失效率、以及期望值和方差。\n\
  \n- 1.3 极端应力水平下的失效分布\n本节介绍了失效和极端应力、累积损伤、以及指数和威布尔失效和分布的模型。\n\n- 1.4 参数估计中的不确定性度量\n\
  本节介绍了处理不确定性的度量指标的介绍，如似然、方差和协方差。\n\n- 1.5 预期失效次数\n本节介绍了维修、更换和部分维修活动对评估失效次数以及部分维修导致有效年龄下降的影响和相互作用。\n\
  \n- 1.6 系统可靠性与预后和健康管理\n本节基于基于状态的维护 CBM 提出了一个 PHM 系统的框架，并向读者介绍该框架、CBD 和特征、以及 CBM，后者可以将特征转化为用于处理以产生预后信息的曲线。\n\
  \n- 1.7 预后信息\n本节介绍适用于预后信息的基本概念和度量：RUL、SoH、预后视界 PH、预后距离 PD 和收敛。\n\n- 1.8 成本与效益决策\n\
  本节简要概述了设备生命周期不同阶段的决策问题及其数学建模，并附有若干说明性数学模型。\n\n- 1.9 PHM 简介：总结\n本节总结了本章所介绍的材料。\n\n\
  ## 1.2 可靠性理论基础\n\n工程系统及其组件和元件会受到退化影响，最终导致失效。相比其他组件更早失效的组件被认为可靠性较低。类似物体的失效，例如组件和组件组，并不会在同一时间点发生；失效会随时间分布。\n\
  \n### 1.2.1 失效率分布\n\n特定物体的失效时间 TTF 通常使用概率论建模，表示大量相同物体的平均行为，而不是特定物体的行为。它被视为随机变量，用\
  \ $X$ 表示。$X$ 的累积分布函数 CDF 是失效发生在或早于时间 $t$ 的概率：\n\n$$F(t)=P(X\\leq t) \\tag{1.1}$$\n\
  \n通常假设物体在 $t=0$ 时开始运行，因此 $F(t)=0$ 当 $t\\leq 0$ 时。此外，$F(t)$ 当 $t\\to\\infty$ 时趋于\
  \ 1：该函数是非递减的。在可靠性工程中，最常用的分布类型如下：\n\n- 1. *指数*分布：\n  \n      $$F(t)=1-e^{-\\lambda\
  \ t},\\qquad t\\geq 0 \\tag{1.2}$$\n  \n      其中参数 $\\lambda>0$ 决定寿命。\n  \n- 2.\
  \ *威布尔*分布：\n  \n      $$F(t)=1-e^{-(t/\\eta)^\\beta},\\qquad t\\geq 0 \\tag{1.3}$$\n\
  \  \n      其中 $\\eta>0$ 被称为*尺度*，$\\beta>0$ 被称为*形状*。\n  \n- 3. *伽马*分布：\n  \n    \
  \  $$F(t)=\\int_0^t\\frac{x^{k-1}e^{-x/\\theta}}{\\theta^k\\Gamma(k)}\\,dx,\\qquad\
  \ t\\geq 0 \\tag{1.4}$$\n  \n      其中 $k$ 表示形状参数，$\\theta$ 表示尺度参数。此外，$\\Gamma(k)$\
  \ 是 $k$ 处的伽马函数值。非常经常，变量 $\\lambda=\\frac{1}{\\theta}$ 在应用中使用。\n  \n- 4. *正态*分布：\n\
  \  \n      $$F(t)=\\phi\\left(\\frac{t-\\mu}{\\sigma}\\right),\\qquad -\\infty<t<\\\
  infty \\tag{1.5}$$\n  \n      其中 $\\mu$ 是实参数且 $\\sigma>0$。\n  \n- 5. *对数正态*分布：\n\
  \  \n      $$F(t)=\\phi\\left(\\frac{\\ln(t)-\\mu}{\\sigma}\\right),\\qquad t>0\
  \ \\tag{1.6}$$\n  \n      其中 $\\mu$ 是实值且 $\\sigma>0$。这里 $\\phi(t)$ 是标准正态分布函数，定义在式\
  \ (1.7) 中：\n  \n      $$\\phi(t)=\\int_{-\\infty}^{t}\\frac{1}{\\sqrt{2\\pi}}e^{-x^2/2}\\\
  ,dx \\tag{1.7}$$\n  \n      这没有精确的简单公式；只有函数近似可用，或可从对应函数表获得 $\\phi(t)$ 在任意特定 $t$\
  \ 值下的值。\n  \n- 6. *逻辑*分布：\n  \n      $$F(t)=\\frac{1}{1+e^{-z}}=\\frac{e^z}{1+e^z},\\\
  qquad z=\\frac{t-\\mu}{\\sigma},\\qquad -\\infty<t<\\infty \\tag{1.8}$$\n  \n  \
  \    其中 $\\mu$ 和 $\\sigma>0$ 是模型参数。\n\n7. 耿贝尔分布：\n\n$$F(t) = 1 - e^{-e^{z}} \\text{\
  \ with } z = \\frac{t - \\mu}{\\sigma} \\qquad -\\infty < t < \\infty \\tag{1.9}$$\n\
  \n其中 μ 和 σ 的含义与之前相同。该分布常被称为对数威布尔分布。\n\n8. 对数逻辑分布：\n\n$$F(t) = \\frac{e^{x}}{1 +\

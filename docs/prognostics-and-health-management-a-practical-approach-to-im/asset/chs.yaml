  \n现在假设 PHM 系统及其预测算法被设计为将时钟时间转换为相对于退化检测的相对时间；并且假设 PHM 系统及其预测算法将 FFS 值截断为 0 和 100。则\
  \ FFS 变换的图如图 1.25 所示。\n\n当 FFS 数据为输入时，设计预测算法以产生准确的预测信息变得非常容易。例如，在任意相对采样时间（ST）下，对应的采样振幅（SA）用于使用以下方程计算估计失效时间（FT）、RUL\

  \n$PD_{FOM} = 1 - BD_{OFFSET} / PD_{MAX}$\n\n**(6.12)**\n\n对于你的 SMPS 退化测试（请参考图 6.71），$BD_{OFFSET}$\
  \ 计算为 168 小时，而 $PD_{MAX}$ 为 3000 小时（4200 − 1200），这意味着计算出的 $PD_{FOM}$ 值为 0.944。你的解释是存在约\

- "# 预测使能：选择、评估和其他考虑\n\n# 7.1 预测使能简介\n\n正如你已经学到的，部署预测使能系统的关键目标是监控预测目标，以提供失效的提前预警，支持基于状态的维护（CBM）。与例如设备可用性和其他指标、测试覆盖率和置信水平相关的标准。为了满足这些标准，传感、信号处理和计算（算法）例程需要在整个设计中纳入到预测与健康管理/监控（PHM）¹\
  \ 系统中。CBM 方法和技术——尤其是使用最终转化为功能失效特征（FFS）数据并由非常好的预测信息程序处理的基于状态数据（CBD）特征——相比于（i）基于适用于总体而非总体特定实例的统计或其他方法构建的系统，以及（ii）基于使用\
  \ CBD 检测损伤但不预测该损伤导致系统不再符合规范的系统，具有显著优势。\n\n# 7.1.1 第 6 章回顾\n\n第 6 章介绍了一个示例 PHM 系统原型的设计，该系统对多个系统实例和预测目标实现了预测使能，结果优异（见表\
  \ 7.1）。\n\n该设计支持多个子系统（两个），每个子系统包含预测目标：一个电源和两个机电作动器（EMAs）。该设计包括监控两个电源中的每一个的单一失效模式，并监控四个\

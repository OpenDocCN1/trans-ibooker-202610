  \n本节描述多个节点并发处理的结果。\n\n## 6.13 总结：稳健的原型PHM系统\n\n本节总结本章所呈现的内容。\n\n## 6.2 PHM系统的设计方法\n\
  \n设计PHM系统时面临的主要考虑因素示例包括：\n\n- 哪些故障模式是预测使能的候选目标？\n- 这些故障模式中哪些组成子系统需要进行预测使能？\n- 每个子系统中的组件和子组件，通常称为航线可更换单元（LRU），哪些需要进行预测使能？此类LRU通常被视为一个逻辑节点。\n\
  \n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_273_0.png)\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_273_1.png)\n\
  \n**图 6.16** 多个温度信号：差分距离调理前后对比。\n\n\n\n\n\n- 目标失效模式是否源于可更换单元（SRU）中的退化，例如空气数据单元中的电路板组件（CCA）或传动装置中的齿轮？\n\
  - 是否可以使用现有传感器或传感器来检测与失效模式相关的退化？如果是，很好；否则，是否会增加一个或多个传感器以支持预测使能？如果是，很好；否则，该特定失效模式需要从候选列表中删除。\n\
  - 设计、开发、测试、验证、部署和维护每个预测使能候选目标的成本是多少？成本包括但不限于货币成本、部署解决方案所需的日历时间、解决方案所需的重量和功率、所需的人员技能，以及部署后解决方案的持续和维护成本。\n\
  \n### 6.2.1 选择和评估目标及其失效模式\n\n本章假设您的团队和客户已经创建并筛选出候选目标列表，筛选至图 6.18 所示的执行器子系统，该子系统将用作示例\
  \ PHM 系统的预测目标。执行器子系统包含以下主要模块：电机驱动器（1）带 H 桥输出（2）和无刷直流电机（3）（BLDC）。EMA 驱动位置翼面（4），由开关模式电源（SMPS）（5）供电，并由定位指令（6）控制。\n\
  \n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_276_0.png)\n\nELECTROMECHANICAL ACTUATOR\n\
  \n图 6.18 示例 EMA 子系统的框图。\n\n您的预测使能团队需对四个主要失效模式进行预测使能：（i）SMPS 输出滤波器中的钽氧化物电容器易于短路失效并烧毁开路；（ii）H\
  \ 桥中的功率开关金属氧化物半导体场效应晶体管（MOSFET）易于受损并在导通时表现出高值电阻；（iii）EMA 电机的线圈绕组易于受损导致电机功率损失；以及（iv）EMA\
  \ 电机轴上的负载增加。\n\n目标是设计和开发一个 PHM 系统，该系统收集所有传感器的数据；处理这些数据，每次一个数据点；并对每个数据点做出预测使能系统的预测。所得的\
  \ PHM 系统不仅仅是一个演示，其中每个节点从无退化状态进展到失效状态，然后才进行预测；而是，每个 LRU 都应作为一个完整系统进行处理，其中事先并不知道哪个\
  \ LRU 会退化、何时退化、退化的失效模式来源是什么，以及失效模式何时可能导致功能失效。\n\n### 6.2.2 离线预测方法：选择结果\n\n如前几章所述，需要采用一种或多种离线方法来完成设计和开发支持预测使能所需的模型和计算例程。第一步是评估将可用的传感器和传感器数据。参考图\
  \ 6.18，您可以使用三组传感器数据：\n\n- 定位指令（6）。\n- SMPS（5）的输出电压。\n- H 桥（2）的相电流测量值：相 A、相 B 和相\
  \ C。\n\n您的团队决定在离线阶段使用 CBD 方法（图 6.19）来设计和开发原型 PHM 系统：使用历史、实验、测试和仿真数据以及 FMEA 来创建特征模型；并设计和开发一组计算例程来处理收集的传感器数据（图\
  \ 6.20）。这些计算例程应将传感器数据调理和转换成语义特征数据（FFS）数据，作为预测算法程序模块的输入。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_277_0.png)\n\
  \n图 6.19 离线建模和开发图。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_278_0.png)\n\n图 6.20\
  \ 设计和分析图。\n\n### 6.2.3 为在线阶段选择基础架构\n\n原型 PHM 系统的运行是预测的在线阶段，即使用您的模型处理传感器数据以产生预测信息。评估离线阶段对\
  \ LRU、传感器、传感器数据和模型的成果后，您和您的团队提出使用基于图 6.19 所示的框架架构；客户批准。\n\n现在您已获得批准的架构，需要准备、审查并获得一套初始设计规范的批准。\n\
  \n## 6.3 采样和轮询\n\n采样是 PHM 系统设计中的重要考虑因素：您需要（i）评估、选择和规定连续采样与周期性采样（图 6.21）；以及（ii）确定采样率、采样频率和采样持续时间（图\
  \ 6.22）。您需要为计划收集数据的每个节点提供规范。\n\n### 6.3.1 连续 – 周期性采样\n\n作为一般规则，您应使用连续采样（见图 6.21，顶部）来检测从零损伤状态迅速过渡到失效状态的意外故障——快到实际上检测损伤并估计未来失效时间不可行。采样是为了支持诊断，通过尽快检测损伤，旨在减轻对系统或因未检测到故障而导致的灾难的进一步损伤。使用周期性采样（见图\
  \ 6.21，底部）当预期损伤开始与功能失效之间的时间距离足够长时：（i）在此采样间隔时间内没有紧急检测故障的需要，且（ii）您的客户希望将维护推迟到未来某个时间点——前提是客户对\
  \ PHM 系统提供的预测信息准确性有足够的信心。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_278_1.png)\n\
  \n图 6.21 连续（顶部）和周期性（底部）采样。\n\n### 6.3.2 周期性突发采样\n\n您应注意，仅使用周期性采样通常会导致精度不足。很可能为了支持预测，您应使用周期性突发采样（图\
  \ 6.22）。为此，您需要（i）选择采样周期；（ii）使用突发模式采样；（iii）选择采样频率；以及（iv）选择突发周期。这些设计决策必须满足预测信息精度要求。\n\
  \n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_279_0.png)\n\n图 6.22 周期突发采样：采样周期（TS）和突发周期（TB）。\n\
  \n**示例 6.1** 您要进行预测使能的 SMPS 是一个为 EMA 供电的 DC-DC 转换器（图 6.23）。电源输出为 24 VDC，输出滤波电路电容为\
  \ 4800 µF，由 22 个并联连接的钽氧化物电容器组成，这些电容器已知会短路失效并烧毁开路，因此每个电容器失效都会使滤波电容减少 220 µF。SMPS\
  \ 具有纹波电压\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_279_1.png)\n\n图 6.23 电源和 EMA\
  \ 子系统的示例。\n\n您的团队决定使用调用轮询（等待响应）进行轮询，原因包括系统中的传感器是*智能传感器*。在被轮询后，它们会唤醒并执行以下操作：（i）感测节点；（ii）执行一系列采样（突发模式）；（iii）将模拟数据转换为数字数据；（iv）计算突发模式采样的平均标量值；（v）注册该标量值；（vi）通知调用的\
  \ PHM 系统（*数据就绪*）；然后（vii）进入静止状态（*睡眠*）。这种轮询方式的优点包括以下几点：（i）PHM 系统决定何时收集数据，从而支持根据节点关键性和\
  \ SoH 确定监控速率的概念；（ii）传感器功耗更低；（iii）数据流量减少；以及（iv）支持以不同采样速率运行的多个节点。\n\n## 6.4 初始设计规范\n\
  \n在设计和开发原型 PHM 系统之前，需要准备、审查和批准一套初始设计规范。这些规范包括您计划执行以下操作的计划：（i）使用图 6.6 所示的模型使用阶段；（ii）使用初始设计和分析阶段的结果（图\
  \ 6.19 和 6.20）对多个 EMA 子系统（图 6.18）进行预测使能；以及（iii）对先前图 6.23 所示配置的系统进行预测使能。该系统包括以下内容：（i）每个\
  \ SMPS 输出处的电压传感器；（ii）每个 EMA 中的三个交流电流传感器；以及（iii）每个传感器输入处的定位指令。原型的要求包括以下内容：\n\n1.\
  \ 对每个 SMPS 进行单种失效模式的预测使能：输出滤波器，电容退化。\n2. 对每个 EMA 进行多种失效模式的预测使能：\n   - 功率开关晶体管，导通电阻退化。\n\
  \   - 电机变压器，绕组退化。\n   - 电机轴，负载过大。\n3. 一个支持所有预测使能单元的单一系统（而不是为每个预测使能单元单独的系统）。\n4.\
  \ 对计划和非计划的单元和系统关机提供检查点/重启支持。\n5. 原型中不需要故障管理和服务。\n\n### 6.4.1 运行：测试/演示 vs. 实际\n\n\
  为了测试和/或演示您的原型 PHM 系统，使用实际设备实时进行是不切实际的——即使使用注入故障也需要太多时间。例如，您不应每秒更改一个值来模拟退化；相反，您应使用更大的间隔，也许五分钟，以允许测试设备、组件、组件和/或子系统达到平衡。而且您应注入会产生大量数据点的故障，例如\
  \ 200 个或更多。对于五分钟间隔，对于单一预测使能模式，您的测试/演示将需要超过 15 小时才能完成——您的客户不会等待那么久。您需要规定您的团队将如何测试和验证原型\
  \ PHM 系统的设计和运行。\n\n\n\n\n\n## TEST 模式\n\n解决在短时间内演示逼真退化曲线相关的时间问题的一种方法是执行以下操作：\n\n\
  1. 获取、保存并使用在较长时间内收集的历史数据和/或实验/测试数据。\n2. 从保存的文件中逐点读取获取的数据。\n3. 对于每个这样的数据点，将采集时间转换为系统时钟时间。\n\
  4. 以 TEST 模式运行原型 PHM 系统，其中 PHM 系统时钟被加速。例如，真实时钟的每一秒被转换为采样时间的若干分钟。\n\n您的客户接受您的建议，即原型\
  \ PHM 系统应支持两种操作模式：（i）使用实时进行采样和（ii）使用在加速测试期间收集并保存的数据进行采样。\n\n### TEST 数据：已保存\n\n\
  当您以 TEST 模式操作原型 PHM 系统时，您需要决定如何处理数据被采集的时间与数据在测试和演示期间被处理的时间之间的差异——尤其是在多节点、多退化测试设置中。例如，第一个节点的测试数据可能是在相对真实时钟时间为\
  \ 1.0、2.0、… 小时时采集的，而第二个节点的测试数据可能是在相对真实时钟时间为 20、40、… 分钟时采集的。如果您采用简单的环形轮询方式而不使用逼真的测试时钟，那么在经过四组采样后，原型\
  \ PHM 系统将对第一个节点在例如 4 秒内处理 8 小时的数据，而对第二个节点处理 80 分钟（1.33 小时）的数据。原型 PHM 系统发出的信息和警报将毫无意义：例如，考虑一下当客户看到图\
  \ 6.27 中前两个警报之后的第三个警报时可能会如何反应。虽然您可能能够说服客户接受这种看似无意义的时间作为原型 PHM 系统以 TEST 模式运行的产物，但我们建议您采用更稳健的\
  \ TEST 时钟——尤其是当客户指出测试数据是基于原始历史数据得出的，而在该历史数据中退化已知是在约 50 天后达到，而非 2.0 小时时。\n\n### TEST\
  \ 数据：实时\n\n当您使用实际的、注入故障的预测目标以 TEST 模式操作原型 PHM 系统时，有两个重要考虑：（i）注入故障值的变化分辨率与平衡或稳定时间相比；以及（ii）混合模式测试。您在监控实际预测目标时始终需要使用真实系统时钟，并且在处理带有保存采集时间的数据时需要使用模拟时钟。\n\
  \n模拟时钟的一种方法是使用数据采集时间作为节点时间，而不管实际真实时钟或模拟系统时钟如何。这意味着每个节点可能具有与其他节点不同的时间，如图 6.27 所示，其中\
  \ NODE 1 的时间不同于 NODE 2 的时间。\n\n| Degradation alert | Time | Estimated RUL |\n| ---\
  \ | --- | --- |\n| NODE 1 is 25% degraded | 2.00 hours | 36 hours |\n| NODE 1 is\
  \ 50% degraded | 3.00 hours | 35 hours |\n| NODE 2 is 25% degraded | 1.00 hours\
  \ | 200 hours |\n\n**Figure 6.27** Example of alerts issued using an unrealistic\
  \ PHM system clock and/or polling method.\n\n另一种方法是创建系统 TEST 时钟并将数据采集时间转换为该 TEST\
  \ 时钟。您需要确保您和客户对用于全功能操作、用于处理历史/测试数据以及用于演示的时钟的含义和规范达成完全一致。\n\n### 数据：实时采集与批处理\n\n\
  从传感器实时采集数据，无论是在测试期间还是在实际操作期间，都需要一种设计来解决以下设计要点：（i）每个数据点是否将通过一系列程序步骤从数据采集到预测处理？（ii）是否将一批数据点进行批处理并保存以供以后处理？（iii）除了例如有源滤波和模数数据转换之外，是否会在实时进行其他数据调理（而不是例如近实时或批处理）？（iv）是否需要融合多测量数据以创建可提取的有用特征？如果是，需要哪些算法和/或计算例程？（v）需要哪些变换，例如时频域或特征-特征？\n\
  \n在实时采集和收集数据并不少见——例如，当飞机在飞行时——然后下载收集的数据以供后续处理。当数据被采集的时间与数据被处理的时间之间的间隔足够长时，这种处理被称为近实时。足够长是多长？这需要您和客户达成一致，以避免出现问题：例如，即使时间延迟小于一秒，您的客户也可能断言这太长了，并且您需要修复系统以使延迟小于\
  \ 1 毫秒。另一个考虑因素是节点数据时间之间看似不一致的差异，例如图 6.27 中 NODE 1 的 3.00 小时随后是 NODE 2 的 1.00 小时；时间减少是因为\
  \ NODE 1 的数据是在 NODE 2 的数据之后收集的。\n\n### 数据：注入故障\n\n使用故障注入获得的实验数据可能表现出如图 6.28 所示的阶跃，因为注入故障变化之间的时间不足和/或用于注入故障的增量变化值过大。非真实退化导致的阶跃可能导致以下一项或两项：（i）FMEA\
  \ 的错误分析/结果；以及（ii）过度激进的噪声缓解方法。实验故障注入的处理可能导致数据和时间失真。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_285_0.png)\n\
  \n**Figure 6.28** Steps in test data due to low-resolution fault injection.\n\n\
  ## 6.4.2 测试台\n\n即使您可以使用历史数据，您仍需要设计和开发测试台以满足以下目标：（i）设计并运行实验以验证和演示您能够复制失效模式、检测退化并预测未来失效时间。在本节中，我们描述了一个合适的两部分测试台（Ridgetop\
  \ 2013）：一部分用于电源，另一部分用于 EMA。您需要审查和批准测试台的设计和开发以及您打算如何使用测试数据。例如，您需要指定测试台数据将用于模型开发、模型验证以及测试和演示\
  \ PHM 能力。请记住：您的客户需要接受测试台及其预期用途作为必要且充分的。\n\n### 测试台：电源部分\n\n图 6.29 是您的团队可能为电源[1]设计和开发的测试台示例。电源和\
  \ EMA [2]是图 6.18 中所示的示例。该图说明了为解决实时采集数据并在稍后时间最终处理数据而采用的设计方法。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_285_1.png)\n\
  \n**Figure 6.29** Diagram of a test bed to inject faults into a power supply.\n\n\
  设计解决方案总结如下：\n\n- **3.** 是可编程的故障注入方法。在可选择的间隔时间，电源的滤波电容值被降低。\n- **4.** 是对电源输出进行采样的传感器，在每次故障注入之间的间隔内采样\
  \ 16 次。传感器在半秒间隔内以 32,000 个样本的突发方式采样输出。输出电压被滤波以分离交流分量纹波电压和噪声，这些信号被数字化、变换为标量值并写入输出文件[5]。\n\
  - **6.** 是计算例程，读取 32,000 个标量值，计算平均值并写入单个浮点数。该数字和样本时间被写入为数据点到输出文件[7]。\n- **8.** 是用于从电源和\
  \ EMA 采集的数据的数据整理器。\n\n### 测试台：EMA 部分\n\n图 6.30 是您的团队可能为由电源[1]供电的 EMA [2]设计和开发的测试台示例。该图说明了为解决实时采集数据并在稍后时间最终处理数据而采用的设计方法。设计解决方案总结如下：\n\
  \n- **9.** 是用于检测由 EMA [2]驱动的可移动表面位置的传感器。\n- **10.** 是三个电流传感器，用于测量 EMA [2]中 BLDC\
  \ 电机绕组中的三相电流（A、B 和 C）。\n\n可编程故障注入方法：在可选择的间隔时间，降低滤波电容值。\n\n- **11.** 是 EMA [2]中的控制器。\n\
  - **12.** 是三组两个功率开关晶体管，用于为 BLDC 电机提供交流电。\n- **13.** 是 BLDC 电机中的绕组（三个之一）。\n- **14.**\
  \ 是 BLDC 电机的轴，用于定位可移动表面。\n- **15.** 是输入到连接到 BLDC 电机控制器[11]的测试台控制器[16]的定位命令。\n- **17.**\
  \ 是 BLDC 电机绕组中的电流。当可移动表面被主动定位（移动）时，会出现大振幅电流。\n- **18.** 是用于向任一功率开关晶体管的漏极注入电阻[19]的可编程开关。这模拟了已知的\

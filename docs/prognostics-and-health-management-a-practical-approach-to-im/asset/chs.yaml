  \ NM 值过高。\n\n## 6.9 系统验证与性能指标\n\nPHM 系统验证的一个重要方面体现在如下问题上：预测估计的准确度如何？回答该问题的重要考量包括以下内容（Celaya\
  \ 等，2010；Hofmeister 等，2013、2016、2017、2018a,b）：\n\n- 检测到退化的时间，与退化开始的真实时间相比。偏移类误差不可避免，原因包括：噪声、采样时间点之间的离散间隔、测量不确定性、数据平滑（它往往使特征曲线向下并向左移动），以及数据在不同数据类型和域之间融合和转换时的舍入与精度损失。\n\
  - 检测到功能失效的时间，与功能失效的真实时间相比。偏移类误差不可避免，原因与检测误差相同。\n- 所有后续 RUL 估计值均达到指定精度（α）的时间。一个有用的品质因数称为收敛效率（χ）。\n\
  - 所有后续预测时域（PH）估计值均达到指定精度（α）的时间。PH 定义为样本相对于检测到退化时点的相对时间，再加上 RUL 估计值（见图 6.70）。\n\n\
  表 6.1 列出了用于测量和计算与预测相关的性能指标的基本缩写词和术语。\n\n### 6.9.1 偏移类误差\n\n偏移误差的大小主要取决于你对数据进行了何种程度的调理，尤其是在消除和抑制噪声方面。\n\
  \n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_317_0.png)\n\n图 6.70 PH 与 BD、采样时间、RUL\
  \ 和 EOL 的关系示意图。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_318_0.png)\n\n# 图 6.71\
  \ 退化时间与 FFS 的关系。\n\n## 退化检测\n\n退化偏移误差（可参照图 6.43 和图 6.71）主要源于噪声、你所采用的噪声抑制措施，以及你所选择的采样率和精度。参见图\
  \ 6.71，当测试时间为 1200 小时时，你向 SMPS 引入了退化；你的系统最早能在 FFS 大于 0 的 1350 时刻检测到该退化；而实际检测到退化是在\
  \ 1368 时刻（采样间隔为 24 小时）。因此，退化偏移误差为 168 小时（参见表 6.2）。2,3\n\n如果该误差的幅度不满足要求（即幅度不可接受），你需要执行以下一项或多项操作：\n\
  \n- 降低噪声量，例如在传感器硬件和/或固件中使用噪声滤波，和/或减少数据转换器和/或计算程序中的离散化和舍入误差。\n- 缩短采样周期。例如，如果采样周期为\
  \ 24 小时，而你在退化开始前 1 秒采样，则最小的退化偏移误差为 23 小时 59 秒。通常，你的系统会经历等于采样周期一半的退化偏移误差。\n- 使用 NDEF\
  \ 中的 FNM 减小你指定的 NM 值（见图 6.60）——前提是该裕量至少与信号中噪声的最大正值一样大。\n\n减少和/或抑制退化偏移误差需要在成本（主要是传感器和数据转换器成本）与精度损失之间进行折衷，精度损失例如由数据平滑以及吞吐量/带宽（因采样率提高而降低）造成。\n\
  \n> 2 真实 EOL 也可称为实际 EOL 或基准真实 EOL。\n> 3 美国国家航空航天局（NASA）在 2015 年 6 月使用“ground truth（基准真实）”一词，而非“ideal（理想）”或“actual（实际）”。\n\
  \n## 表 6.2（续）\n\n| PTOF | 预测失效时间。预测目标预计发生功能失效的估计时间。其计算方式为检测到退化时的时间与 PH 估计值之和：PTOF\
  \ = BD + PH |\n| RA | 相对准确度。估计的 RUL 值相对于数据样本时刻实际 RUL 的准确度。RA 是一种仅在功能失效发生（确定 TFF）后才有意义的性能指标：RA\
  \ (%) = 100*(1 − RUL/RUL0)，其中 RUL = 样本 n 处的估计 RUL，RUL0 = 样本 n 处的理想 RUL。将 RA 与准确度进行对比：RUL\
  \ 准确度 (%) = 100*RUL/RUL₀。RA 适用于任何预测或预估，如 SoH 或 EOL。 |\n| RT | 采样数据点与检测到退化时刻之间的相对时间：RT\
  \ = (数据时间) − BDDETECTED |\n| TTF | 失效前时间（参见 RUL）。组件、设备、装配件或系统发生失效所需的时间——即其使用寿命的终点。\
  \ |\n\n图 6.72 精确确定功能失效发生时间的不确定性示意图。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_320_0.png)\n\
  \n## 功能失效时间：不确定性/无法确定\n\n功能失效（使用寿命终点）的检测与退化开始的检测一样存在不确定性，因为采样几乎总是在功能失效之前或之后发生，如图\
  \ 6.72 所示，而不是恰好发生在 EOL₀。这是另一种偏移类误差。\n\n从实际角度看，你不必担心这种偏移误差：请记住，PHM 系统的主要目的是足够早地检测到退化，以便启动并完成任何必要的补救措施，从而防止未来发生失效。为此，有一个有用的度量称为预测距离（PD）：即退化开始到功能失效发生之间的时间段。采样间隔需要远小于\
  \ PD（见图 6.73）。\n\n### 6.9.2 确定预测距离的不确定性\n\n确定 PD 时存在不可避免的误差，原因如下（见图 6.73）：(i) 噪声，尤其是传感器输出中的噪声；(ii)\
  \ 数据调理，尤其是数据平滑；(iii) NM；(iv) 采样，尤其是采样周期。\n\n理想情况下，PHM 系统中的传感器系统应当完全没有噪声——没有热噪声，没有交流声之类的谐波失真，没有电源开关噪声，没有信号耦合，也没有模数转换和数模转换之间的离散化和舍入误差。但实际情况并非如此。因此，PHM\
  \ 系统不可能检测到退化开始的确切时间（真实 BD）：你需要对 BD 进行估计。\n\n理想情况下，PHM 系统会在退化开始时对传感器数据进行采样——但这除非偶然，否则不会发生——即使你使用了不切实际的采样周期（如微秒级）。同样，你需要对\
  \ BD 进行估计。\n\n理想情况下，采样数据中噪声的幅度会足够低，以至于你不必采用噪声抑制手段，例如使用滚动平均方法进行数据调理，或使用噪声裕量（NM）。采用噪声抑制的数据调理会导致传感系统的传递曲线（图\
  \ 6.73 中的 FFS 曲线）向下和向左移动，该传感系统包括从被感测节点到预测程序输入端之间的所有部分，从而产生偏移类误差。\n\n假设你不希望继续使用已退化的预测目标直至其实际失效，那么\
  \ PHM 系统所能做的最好的事情就是估计未来可能发生功能失效的时间。你所使用的预测程序——DXARULE 和 ARULEAV——正是如此：PH 输出是对估计的\
  \ BD 时间与可能发生功能失效时间之间间隔的估计。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_321_0.png)\n\
  \n图 6.73 不确定性：预测距离。\n\n\n\n\n\n其中 OFFSET 按如下方式计算：\n\n设 $NM_{FFS}$ 表示以 FFS 值表示的 NM。\n\
  设 $FL_{FFS}$ 表示用于将 FFP 或 DPS 数据转换为 FFS 数据的值。\n设 $NM_{FD}$ 表示以 FD 值表示的 NM。\n设 $FNM$\
  \ 表示你在 NDEF 中指定的值（请参考图 6.60）。\n设 $FD_0$ 表示无退化时的标称 FD 值。\n设 $FDNOMMIN$ 表示你在 NDEF\
  \ 中指定的值（请参考图 6.60）。\n\n则\n\n$NM_{FD} = (FNM/100)$ 当 $FD_0 \\geq FDNOMMIN$\n\n否则\n\
  \n$NM_{FD} = FNM$\n\n则\n\n$NM_{FFS} = (NM_{FD}/FL_{FFS})$\n\n$OFFSET = NM_{FFS}(PITTFFO/2)$\n\
  \n**(6.11)**\n\n**Example 6.2** 例如，当 PITTFFO 为 2000 小时且 $NM_{FFS}$ 为 0.030（3.0%）时，OFFSET\
  \ 估计为 30 小时（0.03 倍 1000 小时）；并且如果 $TS$ 为 24 小时，则使用式 (6.10) 和 (6.11) 估计的 $PD_{EST\\\
  _MIN}$ 值变为 946 小时。如果该值不满足要求，则假设 PITTFFO 足够准确，你需要通过降低噪声来减小 OFFSET 以减小 NM 和/或你需要提高采样率以减小\
  \ TS。\n\n**Example 6.3** 假设你被给出以下预测要求和规范陈述：\n\n> “退化必须在失效前至少 1000 小时被检测到，并且 RUL\
  \ 估计需要在失效前 240 小时 ±24 小时时至少在 10% 以内。”\n\n其解释如下：\n\n至少 1000 小时意味着 $PD_{EST\\_MIN}$\
  \ 需要至少与 1000 小时一样大。\n“在 240 小时内在 10% 以内”意味着 $PH_{10}$ 必须至少与 240 小时一样大。\n24 小时和“在\
  \ 10% 以内”意味着你需要最小采样率为 (2 次采样 /24 小时)*(100/10)：每 24 小时 20 次采样。这导致你选择设计的采样率为每小时一次；因此，在这种情况下\
  \ TS 为 1 小时。\n\n但等等，$PH_{10}$ 对你的设计有何影响，以及你如何估计你的设计是否可能满足要求？这个问题在下一节中得到解答。\n\n##\
  \ 6.9.3 Estimating Convergence to Within $PH_α$\n\n预测估计收敛到 $PH_α$ 以内的情况主要取决于以下因素，而这些因素是你可以改变的：(i)\
  \ 你的预测程序的效率；(ii) 输入到你的预测程序的噪声程度；(iii) 输入到你的预测程序的线性度（或缺乏线性度）；以及 (iv) 你的设计的采样率和因此的采样周期。\n\
  \n### Convergence Efficiency\n\n假设你在 PHM 系统中使用的预测程序采用类似卡尔曼的算法与随机游走算法相结合，将数据点视为具有权重和动量的粒子（数据点倾向于以给定的速度和方向继续移动）。那么，例如，一个预测程序可能以每数据点\
  \ 20% 的速率从初始振幅误差收敛，而另一个则为 10%。\n\n**Example 6.4** 你通过设计选择了一个 PITTFFO 值，你认为它可能比预期最快失效时间高出\
  \ 50%。假设输入到预测算法接近理想。作为你设计评估的一部分，你创建一个表格，列出需要处理的数据点数预期以收敛到 25%、10% 和 5% 精度。当被问及，预测程序供应商\
  \ ARULEAV 声称该程序以每数据点约 20% 的收敛率校正初始偏移误差。更重要的是，供应商声称收敛还取决于噪声和输入特征中的非线性程度。因此你决定使用以每数据点\
  \ 20% 校正收敛的预测程序与以每数据点 10% 收敛的另一个预测程序来评估你的设计性能。该评估总结在表 6.3 中，其中列出了两种预测程序的数据点数和收敛时间的差异。范围相当大——在示例中从\
  \ 11 小时到 264 小时。\n\n**Table 6.3 SMPS example: table of number of data points and\
  \ times to converge to α.**\n\n| Program | TS | \\# Points (α=25%) | Time (α=25%)\
  \ | \\# Points (α=10%) | Time (α=10%) | \\# Points (α=5%) | Time (α=5%) |\n|---|---|---|---|---|---|---|---|\n\
  | Program 1 (20%) | TS = 12 h | 4 | 48 h | 8 | 96 h | 11 | 132 h |\n| Program 1\
  \ (20%) | TS = 1 h | 4 | 4 h | 8 | 8 h | 11 | 11 h |\n| Program 2 (10%) | TS = 12\

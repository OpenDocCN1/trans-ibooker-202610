  \ 72 小时进行：\n\n- 在 576 小时时修复节点 51 处的 EMA：在故障前超过 3324 小时。\n- 在 1032 小时时修复节点 62 处的\
  \ EMA：在故障前超过 2592 小时。\n- 在 1176 小时时修复节点 61 处的 EMA：在故障前超过 2692 小时。\n- 在 1440 小时时修复节点\
  \ 50 处的 SMPS：在故障前超过 3762 小时。\n\n## 维护\n\nPHM 系统需要在维护所需时根据退化物理证据而非任意经过小时数向用户发出警报，而非基于任意经过小时数。除警报外，PHM\
  \ 还需要提供并支持维护相关服务，以避免不必要的更换，增加系统使用率，降低停机时间并减少保障成本。用于维护的方法和技术是应用特定的，需要与健康管理和物流服务集成，且超出本书范围。\n\
  \n## 物流\n\nPHM 系统的一个关键功能是物流支持。零件和设备必须定位并送达服务和维修现场，且服务和维护团队需要在所需零件到达时或之后但不得早于其到达时抵达\n\
  \n由于保障成本和非计划停机减少带来的节约等等。但你也需要在成本中考虑与任务关键性/安全性相关的难以量化的成本（参见第 1.8 节）。\n\n## 7.2.1\
  \ 评估、选择和筛选的标准\n\n由于你正在设计一个 PHM 系统以实现运行系统的预测功能，你的团队不会执行任何传统的失效模式和影响分析（FMEA）或失效模式影响临界度分析（FMECA）（DAU\
  \ 2018）。相反，你的团队将审查现有的 FMEA 和 FMECA 数据；历史失效、服务和维修数据；以及与失效相关的任何其他数据。重点是识别、选择和筛选预测目标。为了选择和筛选预测候选列表，包括\
  \ FMEA/FMECA 识别为候选的那些，你需要知道以下内容：\n\n- *TTF 或 TTFF.* 失效时间（或功能失效时间）的估计。这是本章的主要关注点。\n\
  - *PD（估计）。* 从退化开始到功能失效之间时间距离的初始估计，预测算法从中向上或向下收敛到真实的 PH。\n- *待检测的失效模式。* 导致一个或多个传感器捕获的特征签名形状的失效机制。\n\
  - *严重性分类。* 功能失效后果的定性评估。\n- *失效成本。* 非计划失效成本与故障前服务和维修成本的估计。\n- *预测使能成本。* 例如传感器、PHM\
  \ 支持、设计、开发、测试、鉴定和部署成本的估计。\n- *成本效益分析。* 例如由于预测使能带来的保障成本变化加上使用时间、实现的有效节约，以及由于预测使能带来的服务行动变化的估计。\n\
  \n## 7.2.2 MTBF 和 MTTF 的含义\n\nPHM 系统通常参考 MTBF 或 MTTF，因此你应该知道并理解它们之间的区别（Speaks 2005）：\n\
  \n- *MTBF.* 可修复系统（或之前 – 取决于上下文）平均故障间隔时间。\n- *MTTF.* 不可修复系统的预期 TTF。\n\n正如你所见，这些术语的含义（因此使用）取决于失效的定义和可修复性的定义。为了理解这些术语，请回忆第\
  \ 2 章引入了时间失效（FIT）Eq. (2.15)：\n\n```\nFailure rate = λ = (number of failures) / [(number\
  \ of tested parts)(hours of test) AF] 10^9 FIT\n```\n\n其中 AF 是指定测试的加速因子值。请参考表 2.3\
  \ 和 2.4 的示例。\n\n## 示例 7.3\n\n假设某个特定系统有一个单元（器件、组件、组件等），根据要求的测试制度为供应商测试，要求 40 个单元测试\
  \ 2500 小时。要求的测试的 AF 值为 10 000 小时/高加速寿命试验（HALT）周期，且 HALT 周期持续时间为 1 小时。当运行 HALT 时，40\
  \ 个中有 1 个失效。失效率将计算为\n\nFailure rate = λ = (1) / [(40)(2,500 cycles)(10,000 hours/cycle)]\
  \ 10⁹ = 1 FIT\n\n但你没有给出失效率：相反，你被告知 FIT 数值为 50。现在你需要知道以下内容以将该 FIT 数值与失效率联系起来（Ellerman\
  \ 2012；NIST 2018）：\n\nFIT = 1/λ (7.1)\n\n其中 1 FIT = 1/10⁹ 小时。\n\n## 示例 7.4\n\n给定\
  \ FIT 数值为 50，你计算失效率：\n\nλ = 1/(50 FIT) = 10⁹/50 = 20,000,000 = 2000 万小时！\n\n即使你的研究证实计算是正确的，由于计算出的失效率如此之大，你决定使用\
  \ Eq. (7.1) 计算 MTBF（平均故障前时间）值（Abernethy 2006；RAC 2005；Speaks 2005；Weibull 2008）：\n\
  \nMTBF = (total time)/(number of failures) (7.2)\n\n但这没有帮助，因为你不知道总时间，你知道它使用 Eq.\
  \ (7.3) 计算：\n\nTotal time = (# of tested units) * (test time) (7.3)\n\n你也不知道测试单元数或测试时间。因此，你找到了\
  \ MTBF 的另一个表达式\n\nMTBF = 10⁹ / FIT (7.4)\n\n对于 FIT = 50，其等于示例 7.4 计算的 λ 值：20 000\
  \ 000 小时。文献研究揭示了以下内容：\n\n- 在 1993 年，MTTF 被定义为“平均首次”失效时间（Seymour 1993），计算该值的表达式为\n\
  \  MTTF = (total time)/(number of failures)\n\n- 因此，MTTF（1993 年左右）与 2018 年 MTBF\
  \ 的计算方式相同，当 B 表示 before 时。\n\n- 你发现 MTBF 也被定义为可修复产品的“平均故障间隔时间”。\n\n- MTTF 被定义为不可修复产品的“平均失效时间”（不提及首次）。\n\
  \n- MTBF 与 MTTF 的关系定义如下（Ellerman 2012）：\n  MTBF = MTTF + MTTR (7.5)\n  其中 MTTR 被定义为“平均修复时间”。\n\
  \n- 因此，你有多个定义和缩写，存在歧义，导致使用和含义不确定。\n\n无论含义和/或定义如何，MTTF 也不适用于预测使能。MTTF 和 MTBF 应仅限于可靠性经典定义（第\
  \ 1.6 节）：在无干预的情况下，系统在 MTTF 或 MTBF 值之前失效的概率为 63%。\n\n## 7.2.3 MTTF 和 MTBF 不确定性\n\n\
  图 7.5 说明了失效分布（失效密度/时间）、MTBF（故障*间隔*失效率）、MTBF（平均*首次*故障前时间）和 MTTF 之间的关系。MTTF 和 MTBF\
  \ 最初是为具有恒定低失效率的指数分布定义的：例如固态（集成电路）器件。这些器件接受一个或多个加速测试，例如 HALT，测试结果使用 AF 外推到正常寿命（Ellerman\
  \ 2012；O’Connor and Kleyner 2012；NIST 2018；RAC 2005；Speaks 2005；Wilkins 2002）。\n\
  \n固态器件的典型商业 FIT 值在 50–1000 范围内，空间应用的 FIT 值在 1–10 范围内（Johnston 2010）。有一些模拟器使用模拟失效时间计算称为\
  \ MTTF 和 MTBF 的值（Weibull 2008），这增加了对特定 MTTF 和/或 MTBF 值含义和/或计算的不确定性。\n\n更糟糕的是，不同的失效分布、不同的\
  \ CBD 签名等可能导致相同的（或几乎相同）可靠性指标，例如 MTTF：比较图 7.5 和 7.6。最后，本书断言，尝试将数十万（或更大）小时的 TTF 值用于基于\
  \ CBD 的预测是不合理的：MTTF 值为 100 000 小时相当于超过 11 年。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_357_0.png)\n\
  \n**图 7.5** MTTF、TTF 和 PITTFF0：CBD 签名和失效分布。\n\n\n\n\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_358_0.png)\n\
  \nFigure 7.6 Same MTTF for different failure distributions and signatures.\n\n#\
  \ 7.2.4 TTF and PITTFF\n\n我们需要知道如何确定、计算和/或估算一个 TTF 值，该值从退化开始时开始，到功能失效发生时结束（参见图 7.5\
  \ 中的 TTF 1 和 TTF 2）。但在退化首次被检测到时，对未来失效时间没有任何先验知识；然而我们的预测程序需要从该时间的初始估计值收敛到失效时间的非常精确的估计值。对诸如\
  \ MTTF、MTBF 和 FIT 等可靠性指标的研究表明，它们在数值上与我们对 TTF 的需求并不真正接近。\n\n我们正在使用的预测程序 ARULEAV 提供了一个名为\
  \ PITTFF0 的参数（在第 6 章中引入），作为指定 TTF 初始值的一种手段。TTF 并不是制造商和/或产品供应商会查看或指定的值；现场的失效通常是由于诸如雷击之类的异常事件或退化造成的。退化通常并不是由部件进入所谓的浴盆曲线磨损区域所引起；相反，退化通常是由于在运行期间由循环应力应变（例如热和机械）引起的疲劳损伤累积造成的（Hofmeister\
  \ et al. 2006）。\n\n我们可以使用多种方法来估算 TTF 的初始值：使用服务寿命确定、使用端用途测试方法或使用基于 MTTF 的方法。但请注意，预测程序的供应商建议，一般而言，当初始估计值高于真实的功能失效时间时，而不是低于时，该程序会更快地收敛到\
  \ 25% 的精度。\n\n## TTF: Service Life Determination\n\n与其使用极低失效率的 MTTF 或 MTBF 值，您可以使用基于供应商服务寿命值的端用途值。例如：\n\
  \n- 一条轮胎的保修期为 5 年或 40 000 英里，在或大约使用该量后，轮胎被认为“磨损”并被更换：轮胎不可修复。\n新轮胎（相同品牌和类型）也保修 40\
  \ 000 英里。可以说该轮胎的 TTF 为 40 000 英里。\n\n- 一台燃油泵的保修期为 5 年或 40 000 英里，以先到者为准。当燃油泵失效时，它会被更换为翻新泵，该泵的保修期为\
  \ 2 年或 25 000 英里，以先到者为准：燃油泵被认为可修复。由于修复后的泵预期寿命更短，因此可以说燃油泵的失效前时间（TBF）为 2 年或 25 000\
  \ 英里：小于原始预期寿命。在这种情况下，选择较大值。\n\n将 PITTFF0 参数设置为您所拥有的基于服务寿命确定的 TTF 值的两倍，原因有三：\n\n\
  - 供应商建议预测程序通常从较高的初始误差收敛到解。\n- 可靠性理论指出，平均寿命 TTF 意味着 63% 的失效可能在该平均值之前发生。\n- 人为因素：较低的初始误差意味着预测程序可能会对健康状态\
  \ SoH 的递减值产生递增的剩余使用寿命 RUL 值。例如，图 7.9 绘制了使用较高 PITTFF0 值（左图）和较低 PITTFF0 值（右图）的相同数据的预测结果：最好的情况是结果令人困惑；最坏的情况是，它们可能导致对\
  \ PHM 系统可靠性信任度下降和信心丧失。\n\n## TTF: End-Use Test Method\n\n您可以使用以下方法以与计算 MTBF 和 MTTF\
  \ 值相同的方式计算 TBF 和 TTF 值（Weibull 2008）：\n\n$$TTF = \\frac{\\text{total operating hours}}{\\\
  #\\text{ failures}}$$ as for MTBF  (7.6)\n\n$$TTF = \\frac{\\text{total failure\
  \ hours}}{\\text{units tested}}$$ as for MTTF  (7.7)\n\n**Example 7.5** 在第 6 章中，使用了一个由六个\
  \ LRU 组成的示例系统：两个电源和四个 EMA，其中六个 LRU 中有四个失效。利用该数据计算 TBF 和 TTF 的值，并制表（见表 7.2）。例如，在测试六个\
  \ LRU 并发生四次失效的 5000 小时结束时：\n\n- TBF = (6*5000)/4 = 7500 小时\n- TTF = (2745 + 3164\
  \ + 4176 + 4434)/4 = 3630 小时\n\nTTF 和 TBF 值之间存在显著差异，如表 7.2 所示。差异的原因是 TTF 值是使用独立失效时间计算的，而\
  \ TBF 值是使用依赖失效时间计算的，因为人们对“之间”一词有共同的理解。由于使用 TTF 而不是 TBF 似乎是合理的，并且 TTF 更一致，因此您决定使用\
  \ TTF：是否在计算 TBF 时包含第一次失效的时间的问题变得无关紧要。\n\n同样，将 PITTFF0 设置为您计算值的两倍。\n\n**Table 7.2**\
  \ Summarized list of TBF and TTF calculations for various periods of operation.\n\
  \n**TBF and TTF for various periods of operation**\n\n| Operating time (h) | Total\
  \ LRUs | Failed LRUs | TBF (h) | TTF (h) |\n|---:|---:|---:|---:|---:|\n| 3 000\
  \ | 6 | 1 | 18 000 / 1 = 18 000 | 2 745 / 1 = 2 745 |\n| 3 500 | 6 | 2 | 21 000\
  \ / 2 = 10 500 | 5 909 / 2 = 2 955 |\n| 4 000 | 6 | 2 | 24 000 / 2 = 12 000 | 5\
  \ 909 / 2 = 2 955 |\n| 4 500 | 6 | 4 | 27 000 / 4 = 6 750 | 14 519 / 4 = 3 630 |\n\
  | 5 000 | 6 | 4 | 30 000 / 4 = 7 500 | 14 519 / 4 = 3 630 |\n\n## TTF: MTTF-Based\
  \ Method\n\n参考图 7.5，一个简化的基于 MTTF 的方法是将 TTF 设置为等于 MTTF，但在大多数失效分布范围相比 MTTF 值较宽的情况下，该方法效果良好。在这种情况下，只需将\
  \ PITTFF0 设置为 MTTF 值的两倍即可。但如果您相当确信情况更像图 7.6 所示，您需要指定较低的 PITTFF0 值。然而，可能出现这种情况：您的\
  \ PHM 系统支持两种不同的运行环境中的同类型 LRU：一种会引发早于预期的失效（类似于图 7.5 所示的情况），第二种变化性较小，导致失效更集中（类似于图\
  \ 7.6 所示的情况）。此外，为了避免误解和/或出于程序原因，假设您必须始终将 PITTFF0 设置为制造商、供应商或政府机构指定的值（例如 MTTF）。在这种情况下，您需要一种方法来使预测程序调整指定的\
  \ PITTFF0 值。您的预测程序供应商同意，并进行了更改以提供节点定义参数 PITTFFADJ，以便您可以调整 PITTFF0 值的处理方式：\n\n- 当未指定\
  \ PITTFFADJ 或小于 1 时，PITTFF0 的值用作计算下一个 RUL 和 PH 值的初始值。\n- 当 PITTADJ ≥ 1 时，初始值计算为\
  \ [1 − exp(-PITTADJ)] (PITTFF0)。\n\n**Example 7.6** 从表 7.1，TTF 计算为 3630 小时；并且根据公式（7.7），PD(EST)\
  \ = 2722 小时。因此，您决定设置 PITTFF0 = 2722 并执行以下操作（图 7.7）：\n\n- 将此计算结果与使用 PITTFF0 = 4800\
  \ 的原始结果进行比较（见表 7.3）。\n- 创建最大 PD 与使用计算的 PITTFF0 值估计的 PD 的比较图（见图 7.8 和 7.9）。\n- 创建使用原始值和计算的\
  \ PITTFF0 值的 RUL 和 PH 的比较图（见图 7.10）。\n- 计算并制表使用新的计算 PITTFF0 值估计的初始 PD 与原始 4800 小时值之间的百分比差异。\n\
  \n结果表明差异有所减少，图表证实预测程序可以从高或低的初始估计值收敛。\n\n# EXAMPLE: FAILURE DISTRIBUTION & TTF\n\n\

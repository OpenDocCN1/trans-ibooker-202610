  ,DPS_i/FL$ | FFS 点（使用 DPS 数据）– 公式 (3.18) |\n\n最终变换使用公式 (3.18) 生成基于 DPS 的 FFS，以实现将\
  \ CBD 特征数据转换为 FFS 数据的目标：理想的基于 DPS 的 FFS 是一条直线\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_160_0.png)\n\
  \n位于 0% 和 100% 数据点之间。在此之前，我们开发了一个模型，即公式 (3.10)，用于将 FFP 特征数据转换为基于 FFP 的 FFS 数据，并做出了以下定性评估：\n\
  \n基于 FFP 的 FFS 数据的一个缺点是特征通常是曲线形的：它与原始 CBD 特征具有相同的特征曲线。\n\n图 3.15 包含三个示例 FFS 数据图：(i)\
  \ 基于 DPS 的 FFS，(ii) 理想 FFS 传递曲线，以及 (iii) 基于 FFP 的 FFS。对这些曲线的定性评估可能包括以下内容：\n\n- 示例基于\
  \ DPS 的 FFS 与理想 FFS 相比更弯曲。\n- 示例基于 FFP 的 FFS 与理想 FFS 相比也更弯曲。\n- 示例基于 DPS 的 FFS 与基于\
  \ FFP 的 FFS 相比弯曲程度更低。\n\n但对图 3.15 中图形的目视检查表明，后一种定性评估并非对基于 DPS 的 FFS 与基于 FFP 的 FFS\
  \ 之间的每个逐数据点比较都成立。我们需要的是定量评估——我们提倡一种基于积分非线性（INL）测量的定量方法来评估 FFS 曲线的非线性，该方法通常用于评估数据转换器输出传递曲线的线性度（Texas\
  \ Instruments 1995; Carr and Brown 2000; Jenq and Qiong 2002）。\n\n## 3.4.1 传感系统\n\
  \n传感系统包含被监测节点与预测系统输入端口之间的所有部分：节点、传感器以及所有中间框架。预测系统作用于传感系统的输入，生成用于提供未来故障预测的预测信息：传感硬件、数据/域转换器、信号调理、数据融合等。\n\
  \n在 PHM 系统中，传感系统向预测系统提供输入，预测系统处理来自传感系统的输入，以生成预测信息，包括 (i) RUL、(ii) SoH 和 (iii) PH。理想的\
  \ RUL 曲线是退化起始时间点与功能失效时间点之间的一条递减直线：该直线的幅度是功能失效与退化起始之间的时间。类似地，理想的 SoH 曲线是退化起始时间点与功能失效时间点之间的一条递减直线：理想\
  \ SoH 曲线的幅度从 100% 线性递减至 0%。理想的 PH 曲线是一条水平直线，由样本的当前时间与该时刻的 RUL 之和组成。\n\n传感系统的线性度是对传感系统产生的测量曲线与理想曲线偏差程度的评估（TI\
  \ 1995; Carr and Brown 2000）。传感系统的输出是 FFS，预测系统的理想 FFS 输入曲线是一条直线，在退化开始时刻之前值为 0，在被监测预测目标被视为功能失效的时刻值为\
  \ 100。例如，图 3.22 左侧是理想 FFS 曲线的图，该图右侧是我们的示例基于 DPS 的 FFS 的图；如图所示，该曲线偏离了理想 FFS 曲线。\n\
  \n## 3.4.2 FFS 非线性\n\n我们将功能失效特征非线性（FNL）定义为实际 FFS 与理想 FFS 之间偏差的度量，非常类似于对模数转换器（ADC）或传感器输出传递曲线的\
  \ INL 评估（Texas Instruments 1995; Carr and Brown 2000; Jenq and Qiong 2002）。逐点 FNL\
  \ 是某个时间点实际 FFS 值与理想 FFS 值之间误差的度量（见图 3.23）。总误差（FNLₑ）提供了对 FFS 曲线非线性的评估（见图 3.24）。\n\
  \n# 计算 FFS 非线性（FNL）\n\n计算 FNL 是使用 FFS 数据进行的一种后处理操作，因为我们需要首先计算退化起始时间点与功能失效发生时间点之间的总时间：\n\
  \n$$TTF = t_{FAILURE} - t_{ONSET} \\tag{3.21}$$\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_162_0.png)\n\
  \n图 3.23 逐点 FNL 比较示意图。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_162_1.png)\n\n\
  图 3.24 总 FNL_E 比较示意图。\n\n然后，对于集合 {FFS_i} 中的每个点，我们创建一个理想点，\nIDEAL_FFS_i = 100(t_i\
  \ − t_ONSET)/TFF (3.22)\n并计算逐点非线性，\nFNL_i = FFS_i − IDEAL_FFS_i (3.23)\n并计算总非线性，\n\
  FNL_E = max(abs({FNL_i})) (3.24)\n\n\n\n\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_163_0.png)\n\
  \nFigure 3.25 Example plot of FFP-based and DPS-based FNL_i.\n\nwhere max is a maximum\
  \ function and abs is an absolute-value function. Example plots on nonlinear errors\
  \ are shown in Figure 3.25.\n\n## Example 3.15\n\nPreviously, you used an FL value\
  \ of 0.7 and created an FFP-based FFS (in 3.7); you transformed the FFP-based FL\
  \ value of 0.7 to a DPS-based value of 0.65; then you created a DPS-based FFS (3.9);\
  \ and you compared the results (Figure 3.15) and qualitatively concluded that the\
  \ DPS-based FFS was less curvilinear compared to the FFP-based FFS. Now, verify\
  \ the qualitative conclusion using Eqs. (3.21–3.24) for both sets of FFS data and\
  \ make a quantitative assessment.\n\n## 3.5 Summary of Data Transforms\n\nUsing\
  \ an SMPS as an example, we described and showed the following signals and the transforms\
  \ that were performed:\n\n- SMPS output (left side of Figure 3.26). Analog voltage\
  \ of direct current (DC) and alternating current (AC) component features and noise.\
  \ One of the features is damped-ringing responses to abrupt changes in load.\n-\
  \ Ringing response (right side of Figure 3.26). An intelligent sensor might do the\
  \ following: present a series of abrupt, low-power changes in load to the SMPS at\
  \ timed intervals (sampling periods); capture the ringing responses; convert analog\
  \ voltage to digital data; calculate an average frequency for each of several sinusoids\
  \ in the response; calculate an average value of the average resonant frequency\
  \ of each of the series of ringing responses; calculate the average frequency as\
  \ a sample value; and output that average as a scalar CBD_i value.\n- CBD signature\
  \ (left side of Figure 3.27). Sensor data is transformed into a CBD signature by\
  \ subtracting the value of a noise margin from each received CBD_i to\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_165_0.png)\n\
  \n**Figure 3.27** CBD signature and FFP signature.\n\ncreate a feature point, $FD_i$.\
  \ The set of $FD_i$ values, $\\{FD_i\\}$, is a CBD signature, as in Eq. (3.7):\n\
  \n$$FD_i = CBD_i - NM$$\n\n- **FFP signature** (right side of Figure 3.27). A set\
  \ of $FD_i$ values is transformed into a set of $FFP_i$ values by subtracting from\
  \ each $FD_i$ value a nominal value of FD and dividing the result by that nominal\
  \ value. The set of $FFP_i$ values, $\\{FFP_i\\}$, is an FFP signature, as in Eq.\
  \ (3.9):\n\n$$FFP_i = (FD_i - FD_0)/FD_0$$\n\n- **FFP-based FFS** (left side of\
  \ Figure 3.28). An FFP set, $\\{FFP_i\\}$, is transformed into $\\{FFS_i\\}$ by\
  \ dividing each value in the set by a functional-failure level, FL, and multiplying\
  \ the result by 100, as in Eq. (3.10):\n\n$$FFS_i = 100\\ FFP_i/FL$$\n\n- **DPS**\
  \ (right side of Figure 3.28). An FFP set, $\\{FFP_i\\}$, is transformed into $\\\
  {DPS_i\\}$ by transforming the FFP model into a new model that is a function of\
  \ a parameter, $P_0$, and a change in that parameter, $dP$, and then solving for\
  \ $dP_i/P_0$ in terms of the feature parameters $FD_i$ and $FD_0$, as in Eq. (3.15):\n\
  \n$$DPS_i = 1 - (FD_0/FD_i)^2$$ for this particular FFP model\n\n- **DPS-based FFS**\
  \ (Figure 3.29). A set of DPS values, $\\{DPS_i\\}$, is transformed into a DPS-based\
  \ FFS, $\\{FFS_i\\}$ by dividing each $DPS_i$ value in the set by an $FL$ value\
  \ and multiplying the result by 100, as in Eq. (3.18),\n\n$$FFS_i = 100\\ DPS_i/FL$$\n\
  \n- where $FL$ is calculated using Eq. (3.17):\n\n$$FL_{DPS} = 1 - (1/(1 + FL_{FFP}))^2$$\n\
  \n### High-Level Procedure for Producing a DPS-Based FFP\n\nA high-level procedure\
  \ for producing a DPS-based FFP is the following (refer to Figure 3.30): (i) select\
  \ one or more output nodes to monitor for prognostic purposes; (ii) develop or acquire\
  \ sensors to isolate CBD leading indicators of interest and to extract selected\
  \ FD; (iii) signal condition and transform the collected FD to produce a CBD-based\
  \ signature – Eq. (3.6); (iv) further condition as necessary and transform CBD signature\
  \ data into FFP signature data – Eqs. (3.7) and (3.8); (v) transform FFP signature\
  \ data into DPS data using Eqs. (3.8) and (3.15); and (vi) transform DPS data into\
  \ an FFS using Eqs. (3.17) and (3.18). You use Eqs. (3.21)–(3.24) to quantitatively\
  \ assess the nonlinearity of FFS data.\n\n### Qualitative Assessment\n\nThe biggest\
  \ advantage of the DPS approach is that DPS-based FFS data is more linear compared\
  \ to that based on FFP data. Additional advantages are the following:\n\n- Similar\
  \ to an FFP signature, the amplitude of $\\{DPS_i\\}$ data is dimensionless.\n-\
  \ The number of required models is reduced.\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_167_0.png)\n\
  \n**Figure 3.28** FFP-based FFS and DPS.\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_168_0.png)\n\
  \n**Figure 3.29** DPS-based FFS.\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_168_1.png)\n\
  \n**Figure 3.30** Procedural diagram for producing a DPS-based FFS.\n\nUsing Eq.\
  \ (3.14) and the results of the examples used to verify modeling, we make the following\
  \ inductive observations regarding the set `{DPS_i}`, regardless of the type of\
  \ an underlying FD model (such as a linear or power function) and regardless of\
  \ how FD changes with respect to time:\n\n- When a parameter `dPi` changes as a\
  \ linear function with respect to time, `{DPS_i}` changes linearly with respect\
  \ to time.\n- When a parameter `dPi` changes as a power function with respect to\
  \ time, `{DPS_i}` changes as a power function with respect to time.\n- When a parameter\
  \ `dPi` changes exponentially with respect to time, `{DPS_i}` changes exponentially\
  \ with respect to time.\n\nThe biggest advantage is the following: `{DPS_i}` is\
  \ less curvilinear than its underlying `{FFP_i}` signature data, and so `{DPS_i}`\
  \ data is particularly useful as input to prediction algorithms for processing to\
  \ predict a future time of failure for a prognostic target.\n\n## 3.6 Degradation\
  \ Rate\n\nIn the previous section of this chapter, we saw that an ideal DPS-based\
  \ FFS is a linearly increasing line from 0 or less (no degradation) to 100 or more\
  \ (functionally failed): an ideal DPS-based FFS is a straight line between the 0%\
  \ and 100% points. Even a non-ideal DPS-based FFS was shown to be less curvilinear\
  \ than its underlying FFP signature (refer back to Figure 3.29). The linearity of\
  \ a DPS-based FFS is dependent on the linearity of the rate of change in a degrading\
  \ parameter, `dD`: if the degradation rate with respect to time is constant, the\
  \ DPS and the DPS-based FFS will be linear; otherwise the degree of non-linearity\
  \ of the DPS and the DPS-based FFS is dependent on the degree of nonlinearity in\
  \ the degradation rate.\n\n### 3.6.1 Constant Degradation Rate: Linear DPS-Based\
  \ FFS\n\nAs we have seen, an idealized DPS for a constant degradation rate results\
  \ in an idealized linear DPS-based FFS. And even when a DPS is not ideal, the DPS-based\
  \ FFS is more linear (less curvilinear) compared to the characteristic curve for\
  \ its DPS. The examples and exemplary data we have been using are a result of assuming\
  \ a constant degradation rate such as that modeled as follows:\n\n$$dP_i = D_0(t_i)^\\\
  delta \\tag{3.25}$$\n\nin which `δ = 1.0` for a constant degradation rate and `t_i`\
  \ equals\n\n$$t_i = (t_S - t_D) \\tag{3.26}$$\n\nwhere `t_S` is the time of a sample\
  \ and `t_D` is the time of the onset of degradation: `t_S ≥ t_D`.\n\n**Example 3.16**\
  \ Show that the DPS-based signature for our example is always linear given a constant\
  \ degradation rate and nonlinear for a nonconstant degradation rate. Using Eqs.\
  \ (3.25) and (3.12),\n\n$$DPS_i = dP_i/P_0 = D_0/P_0(t_i)^\\delta$$\n\nso that for\
  \ `δ = 1`, `DPS_i` is linear and nonlinear otherwise.\n\n**Example 3.17** Show that\
  \ the FFP-based signature for our example is always nonlinear, even when $\\delta\
  \ = 1$. Using Eq. (3.15),\n\n$$DPS_i = 1 - (FD_0/FD_i)^2 \\to FD_i/FD_0 = \\sqrt{1\
  \ - (D_0/P_0)(t_i)^\\delta}$$\n\nand using Eq. (3.8),\n\n$$FFP_i = (FD_i - FD_0)/FD_0\
  \ = FD_i/FD_0 - 1$$\n\n$$= (1/\\sqrt{1 - (D_0/P_0)(t_i)^\\delta}) - 1$$\n\nwhich\
  \ is nonlinear for all nonzero values of $\\delta$.\n\n### 3.6.2 Nonlinear Degradation\
  \ Rate\n\nA non-idealized DPS occurs when the degradation rate is not constant:\
  \ it is nonlinear with respect to time. However, we will see that even when a DPS\
  \ is not ideal, a DPS-based curve is still more linear (less curvilinear) compared\
  \ to its FFP signature.\n\n**Example 3.18** Plot a DPS, $dP/P_0$, using Eq. (3.25),\
  \ where $D_0 = 0.90/200$ is valid after the onset of degradation, degradation begins\

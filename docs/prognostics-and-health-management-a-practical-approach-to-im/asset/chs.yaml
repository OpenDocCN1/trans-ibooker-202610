  \ 1368 | 4200 | 2832 | 3432 | 2782 | 21% | -2% |\n\n### 7.3.2 成本分析\n\n**无 PHM 方法**\n\
  \n在此场景中，系统运行直到单元故障——“故障发生前不采取行动”的方法。故障发生时，故障单元被移除并更换。系统重新启动并运行直到下一个单元故障，以此类推，直到\
  \ 14 400 小时（600 天运行）的可持续期结束：\n\n- 平均而言，#1 电源将故障并被更换：14 400/4200 = 3.4 次：\n    -\
  \ 成本 = 3.4\\*10000 + 0\\*2000 + 3.4\\*4000 = 47 600\n\n对其余五个电源重复此操作，由于退化故障导致的意外停机，共产生\
  \ 24 次移除和更换，基线成本为 $336 000。\n\n**基于使用量的 MTTF 方法**\n\n在此场景中，所有电源在用量等于 3592 小时（MTTF）时被更换。检查表\
  \ 7.6 中的数据可知，电源 #3、#4 和 #6 会在被更换前发生功能性故障。在可持续期内，总共将有 27 台电源被移除和更换，总成本为 $354 000——在可持续期内系统成本增加\
  \ $18 000，以将意外停机次数从 24 次减少到 14 次。然而，52% 的所有维修和移除操作可归因于退化故障。此方法未能满足要求。\n\n**基于使用量的\
  \ 2/3 MTTF 方法**\n\n在此场景中，所有电源在用量等于 2395 小时时被更换。将不会有意外停机，但将有 36 台电源被更换，成本为 $432 000——成本增加\
  \ $96 000，意外故障减少为零。对于 1000 个系统的群体，这 $96 000 将变为 $96.0 百万。\n\n**损伤检测方法**\n\n在此场景中，只要在电源中检测到损伤，就在\
  \ 720 小时内将其移除并更换，这对于这些电源而言，也将导致零意外停机。此方法看似是好的方法，因为将会有\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_367_0.png)\n\
  \n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_367_1.png)\n\n**图 7.12** EMA 51 的 RUL\
  \ 和 PH 曲线：PITTFADJ = 2.0 之前和之后。\n\n**SoH 在 75% 或更低的方法**\n\n在此场景中，只要电源的预测 SoH 估计值在\
  \ 75% 或更低，就在 120 小时内将其移除并更换：对于此方法，也将不会有意外停机。此方法将在可持续期内导致 28 台电源被移除和更换，估计成本为每系统 $336\
  \ 000——与“故障发生前不采取行动”方法的基线成本相比，既没有节省也没有成本增加。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_368_0.png)\n\
  \n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_368_1.png)\n\n**图 7.13** EMA 61 的 RUL\
  \ 和 PH 曲线：PITTFADJ = 2.0 之前和之后。\n\n是的，传感器和 PHM 系统的成本存在，但 SoH 方法具有以下优点：\n\n- 它将由于退化故障导致的意外停机减少为零。\n\
  - 它比下一个最昂贵的方法（基于使用量的 2/3 MTTF）更便宜。\n- 与基于使用量的 2/3 MTTF 方法（36 次）或损伤检测方法（43 次）相比，其维修和更换活动最少（28\
  \ 次）。\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_369_0.png)\n\n![](img/05efaadbca64ad00f9e8d44c1db8cc7b_369_1.png)\n\
  \n**图 7.14** EMA 62 的 RUL 和 PH 曲线：PITTFADJ = 2.0 之前和之后。\n\n- 它需要最少的维修工时，从而提高任务可用时间。\n\
  - 它没有基于使用量的 2/3 MTTF 方法的缺点，即退化过早开始和/或从开始到故障的时间快于预期。\n- 与损伤检测方法相比，在 14 400 小时的可持续期内，1000\
  \ 个系统网络可节省 $180 百万。\n\n**表 7.5** 预测使能效益评估的成本估算。\n\n*估计成本：用于效益分析；可持续性（使用）*\n\n| LRU\

    conditioning.


    and resumed, gracefully ended (shut down) and restarted; and not-so-gracefully
    ended (crashed) and started over. A PHM system is required to support a sufficiently
    robust checkpoint (save the present for use as the past) and restart (restore
    the past and resume operation) that meets customer requirements regarding recovery
    and continuation of prognostic monitoring and prediction accuracy.



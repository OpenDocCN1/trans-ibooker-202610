- pgno: 63
  md: 'of the system. A performance-validation framework provides means and methods
    to produce prognostic-performance metrics for evaluation of the accuracy of prognostic
    information. A control- and data-flow framework manages PHM functions and actions
    (CAVE3 2015; Pecht 2008; Kumar and Pecht 2010).


    Reliability $R(t)$ (refer back to Eq. (1.14) of a prognostic target is the probability
    that the prognostic target will operate satisfactorily for a required period of
    time. Reliability is related to lifetime and mean time before failure (MTBF) by
    the following (Speaks 2005). Theoretically, the mean time before failure is obtained
    from probabilistic reasoning as the expectation of TTF:


    $$\mathrm{MTBF}=\int_0^\infty tf(t)\,dt$$


    where $f(t)$ is a PDF. By examining a number of test units, it can be obtained
    practically as


    $$\mathrm{MTBF}=(NT)/F$$


    where $N$ = number of test units, $T$ = test time, and $F$ = number of test failures.


    The relative frequency of number of the failures until time $T$ is clearly given
    as $F/N$, which is an estimator of the CDF of TTF at time $t=T$. If the distribution
    is exponential, then its parameter can be estimated from


    $$1-e^{-\lambda T}=F/N \tag{1.101}$$


    so an estimate of $\lambda$ is


    $$\lambda=-\frac{1}{T}\ln\left(1-\frac{F}{N}\right) \tag{1.102}$$


    Then the CDF is given $F(t)=1-e^{-\lambda t}$, the reliability function is $R(t)=e^{-\lambda
    t}$, and the constant failure rate is $\lambda$. We previously derived these results;
    refer back to Eq. (1.2), for example. If the distribution of TTF has more than
    one parameter, then the information provided by $\lambda$ is not sufficient to
    estimate $R(t)$. For example, the variance can be estimated by repeated testing,
    so two equations would be obtained for the usual two parameters (such as Weibull,
    gamma, normal, and so on).


    MTBF is a statistical measure that applies to a set of prognostic targets $N$
    and is not applicable for estimating the lifetime or RUL of a specific prognostic
    target in a system.


    **Example 1.16**  As an example of how MTBF is used, suppose that MTBF is determined
    to be 500 days. Then the probability that a specific prognostic target will continue
    to operate within specifications for 500 days = 0.368 (36.8%): the exponential
    value of (−1). In particular, notice that MTBF is not used to estimate the time
    of failure of the prognostic target.


    # 1.6.2  Relationship of PHM to System Reliability


    What is the relationship of PHM to system reliability? As an example, suppose
    a PHM system is designed to accurately predict the time when functional failure
    will occur for every prognostic target in the system; further suppose that the
    fault/health management framework of that system enables replacement and/or repair
    of every prognostic target prior to the actual time of functional failure; also
    suppose that the time when maintenance is performed occurs after the time when
    degradation is detected for each'

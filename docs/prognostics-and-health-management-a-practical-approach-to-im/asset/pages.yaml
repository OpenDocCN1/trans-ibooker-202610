  md: 'given as


    $$m_k=\frac{1}{n}\sum_{i=1}^{n}x_{ik}$$  (2.40)


    The standard deviation of the $k^{th}$ parameter is similarly


    $$s_k^2=\frac{1}{n-1}\sum_{i=1}^{n}(x_{ik}-m_k)^2$$  (2.41)


    And so the standardized value of $x_{ik}$ becomes


    $$z_{ik}=\frac{x_{ik}-m_k}{s_k}$$  (2.42)


    Define


    $$Z_i=(z_{i1},z_{i2},\ldots,z_{im})$$


    Then the correlation matrix of the standardized values is given as


    $$C=\frac{1}{n-1}\sum_{i=1}^{n}Z_iZ_i^T$$


    And finally, the MD value can be obtained as


    $$MD=\frac{1}{m}Z_iC^{-1}Z_i^T$$  (2.43)


    where $T$ denotes the transpose.


    MD values are not normally distributed and need to be further transformed by using
    a Box Cox transformation and maximizing the logarithm of the likelihood function.
    However, in a highly accelerated test experiment, the MD method only predicted
    failure in 14 out of 26 samples (Alan et al. 2011). Even if the degree of accuracy
    were acceptable, that still leaves, for example, the problem of predicting when
    the power supply will fail because of the loss of sufficient capacitance for any
    specific failure mode. To address those kinds of problems, heuristic-based modeling
    of CBD can be used rather than traditional models. We conclude that neither model-based
    nor data-driven approaches is likely to meet the requirements for resolution,
    precision, and prognostic accuracy.


    There are other techniques as well, to reduce multiple measurements into a single
    health indicator. One example, for instance, is the multivariate state estimation
    technique (Cheng and Pecht 2007), which is based on the best healthy estimates
    of the sample vectors obtained by the use of least squares. However, other metrics
    can be also selected for the distance of the sample vectors and their estimates.
    These distances are indicative of SoH, since smaller distances indicate better
    health. Other examples include autoassociative kernel regression (Guo and Bai
    2011), a method based on kernel smoothing (Wand and Jones 1995) discussed in Section
    2.3.1. After the sequence of single health indicators is determined, the resulting
    time series can be used as input data for all procedures being discussed in this
    book.



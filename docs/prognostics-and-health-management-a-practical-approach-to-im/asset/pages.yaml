- pgno: 101
  md: '**Table 2.2** Failure distributions and example applications.


    | Distribution | Example applications |

    |---|---|

    | Exponential | Fatigue, wear caused by constant stress: resistors |

    | Gamma | Failures caused by shock and vibration: boards, package connections
    |

    | Lognormal | Failures caused by failure of insulation resistance, crack growth,
    and rate-dependent processes: encapsulation failures |

    | Gumbel | Failures caused by corrosion, shear breaks (strength), dielectric breakdown:
    conductor connections, interconnects |

    | Weibull | Life (use) and breakdown failures: capacitors, cables |


    The following distributions form characteristic curves that are useful for modeling
    complex failure mechanisms (a more complete list can be found in Chapter 1):


    *Exponential:* \(f(x,\theta)=\frac{1}{\theta}e^{-x/\theta}\)


    *Gamma:* \(f(x,\theta,k)=\frac{1}{\Gamma(\theta)\theta^k}x^{k-1}e^{-x/\theta}\)


    *Lognormal:* \(f(x,\mu,m,\sigma)=[e^{-(\ln(x-\mu)-m)^2/(2\sigma^2)}]/[(x-\mu)\sigma\sqrt{2\pi}]\)


    *Gumbel:* \(f(x,\sigma,\mu)=\frac{1}{\sigma}e^{-(x-\mu)/\sigma}\exp[-e^{-(x-\mu)/\sigma}]\)


    *Weibull:* \(f(x,\beta,\eta,\gamma)=\frac{\beta}{\eta}\left(\frac{x-\gamma}{\eta}\right)^{\beta-1}e^{-((x-\gamma)/\eta)^\beta}\)


    In engineering applications, the Weibull, an extreme-value type of distribution,
    and the lognormal distribution are frequently used for modeling because they can
    be fitted to data from a large number of applications: especially lifetime distributions

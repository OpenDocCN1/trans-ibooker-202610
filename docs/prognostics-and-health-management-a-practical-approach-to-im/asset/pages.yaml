    their uncertainties, which are characterized by the variances of the costs per
    unit time. Both expected costs and their variances should be minimized, leading
    again to the application of multi-objective optimization procedures.


    A simple model is finally introduced to find the needed number of repair kits
    in any interval during the lifecycle of a piece of equipment. A similar model
    can be developed to plan the necessary amount of labor as well. For the sake of
    simplicity, assume that in cases of repairable failures, minimal repairs are performed.
    It is known from Section 1.5.1 that the number of failures in any interval $[t,T]$
    follows a Poisson distribution with expectation


    $$\lambda=M(T)-M(t)=\int_t^T\rho(\tau)\,d\tau$$  (1.132)


    meaning the times of failures form a non-homogeneous Poisson process. Assume that
    each repair requires one unit of repair kit. It is a very important problem to
    determine the number of units that guarantees that all failure repairs can be
    performed with at least a given probability value $1-p$. Let $Q$ denote the required
    available number of kits; then with the notation


    $$X_{[t,T]}=\text{actual number of failures in interval }[t,T]$$


    we require that


    $$P(X_{[t,T]}\le Q)=\sum_{k=0}^{Q}\frac{\lambda^k}{k!}e^{-\lambda}=e^{-\lambda}\sum_{k=0}^{Q}\frac{\lambda^k}{k!}\ge
    1-p$$


    implying that


    $$\sum_{k=0}^{Q}\frac{\lambda^k}{k!}\ge (1-p)e^{\lambda}$$  (1.133)'

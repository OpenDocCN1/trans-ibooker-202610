- pgno: 26
  md: 'Included in this book is a design for a robust prototype of an exemplary PHM
    system comprising a framework architecture and control/data flow that supports
    prognostic enabling of six assemblies (line-replaceable units): two switch-mode
    power supplies and four electro-mechanical actuators. Each power supply is prognostic
    enabled using a single sensor for a single failure mode: loss of filtering capacitance.
    Each actuator is prognostic enabled using a set of phase current sensors for three
    different failure modes: increased on-resistor of power-switching transistor in
    an H bridge controller for the actuator; degradation in the windings of a brushless
    DC motor of the actuator; and excessive loading on the shaft of that DC motor.
    The system comprises two subsystems, each having three prognostic-enabled units:
    a power supply and two electro-mechanical actuators. A design is presented to
    do the following: (i) control polling and sampling of the units to acquire, condition,
    and process CBD to produce prediction information; (ii) support checkpoint/restart
    in which the system can be stopped, paused, or ended and then restarted; and (iii)
    show how alerts could be used to support event-triggered maintenance. A chapter
    on prognostic enabling – selection, evaluation, and other considerations – concludes

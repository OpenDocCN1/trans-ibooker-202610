  md: 'and MTBF; instead, a rationale was presented for using the time between the
    onset of degradation and the time when such degradation results in functional
    failure: TTF. Methods to determine or calculate a value for TTF include service
    life, end-use testing, and MTTF-based methods. A section on cost-benefit analysis
    of prognostic approaches included example approaches for the following approaches:
    (i) no PHM; (ii) usage-based MTTF; (iii) usage-based 2/3 MTTF; (iv) damage-detection;
    and (v) SoH at 75% or less. The section after that focused on the bathtub curve
    and how it relates to failure distributions, MTBF, MTTF, trigger points, and CBD
    signatures.


    By no means does this book cover the entirety of information related to PHM and
    CBD – conditioning, modeling, and processing for CBM. On the other hand, this
    book contains a wealth of information dealing with basic approaches and, importantly,
    CBD signatures and how to process and linearize those signatures, which lessens
    the burden on prediction programs and improves the accuracy of prognostic information.
    Chapter 6 presented the design of a hypothetical prototype PHM system to illustrate
    the challenges a designer might face and to demonstrate the application of the
    approaches discussed in this book.



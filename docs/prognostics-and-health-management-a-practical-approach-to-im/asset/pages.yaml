  md: '![](img/05efaadbca64ad00f9e8d44c1db8cc7b_318_0.png)


    # Figure 6.71 Relationship of degradation times and an FFS.


    # Degradation Detection


    A degradation-offset error (refer back to Figure 6.43 and to Figure 6.71) is primarily
    due to noise, the noise mitigation you employ, and the sampling rate and precision
    you have chosen. Referring to Figure 6.71, you introduced degradation into an
    SMPS when the test time was 1200 hours; the earliest your system could detect
    that degradation is at time 1350 when the FFS becomes greater than 0; and degradation
    was detected at time 1368 (24-hour interval between samples). Thus the degradation-offset
    error is 168 hours (refer to Table 6.2).2,3


    If the magnitude of this error does not meet requirements (the magnitude is unacceptable),
    you need to do one or more of the following:


    +   - Reduce the amount of noise by, for example using noise filtering in your
    sensor hardware and/or firmware and/or by reducing discretization and rounding
    errors in your data converters and/or computational routines.


    +   - Reduce the sampling period. For example, if the sampling period is 24 hours
    and you take a sample 1 second before degradation begins, the smallest degradation-offset
    error is 23 hours and 59 seconds. Generally, your system will experience a degradation-offset
    error equal to one-half of the sampling period.


    +   - Reduce the magnitude of the NM you specify, using FNM in your NDEF (see
    Figure 6.60) – provided the margin is at least as large as the largest positive
    value of noise in your signal.


    Reducing and/or mitigating degradation-offset errors becomes a compromise between
    cost (primarily sensor and data-converter cost) and loss of precision due to,
    for example, data smoothing and throughput/bandwidth (reduced because of higher
    sampling rates).


    > 2 True EOL may also be referred to as actual EOL or ground truth EOL.


    > 3 NASA, in June 2015, used the term ground truth instead of ideal or actual.'

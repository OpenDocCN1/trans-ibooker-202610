    \ respectively. Then from Eq. (1.90), we have\n\nM*(s) = F*(s) + M*(s) f*(s)\n\
    \nimplying that\n\nM*(s) = F*(s) / (1 − f*(s)) = (1/s f*(s)) / (1 − f*(s))\n\n\
    If g(t) denotes the inverse Laplace transform of f*(s)/(1 − f*(s)), then\n\nM(t)\
    \ = ∫₀^{t} g(τ) dτ (1.91)\n\nshowing that {X_t} is again a non-homogenous Poisson\
    \ process with arrival rate g(t).\n\nLet 0 < t₁ < t₂ < ... denote times of failures.\
    \ Then z_k = t_{k+1} − t_k (k = 0, 1, ... and t₀ = 0) are independent random variables\
    \ with PDF f(t). Then the density f_k(t) of t_k is the k-fold convolution of f(t):\n\
    \nf_k(t) = f(t) * f(t) * ... * f(t)\n\nNotice that\n\nE(t_k) = E(z₁) + E(z₂) +\
    \ ... + E(z_k) = E(z₁) k = μ k,\n\nwhere μ is the TTF mean value. Similarly\n\n\
    Var(t_k) = Var(z₁) + Var(z₂) + ... + Var(z_k) = Var(z₁) k = σ² k\n\nwhere σ² is\
    \ the TTF variance value. If z_k is exponential, then t_k is gamma; if z_k is\
    \ gamma, then t_k is also gamma; and if z_k is normal, then t_k is also a normal\
    \ variable.\n\nBased on these values, in other cases the PDF of t_k can be estimated\
    \ by a lognormal or gamma variable with a given expectation and variance; and\
    \ confidence intervals can be constructed for any significance level selected\
    \ by the user.\n\nIf repairs or replacements need T time to perform, then the\
    \ time of the k^{th} failure is \bar{t}_k = t_k + (k − 1) T, with the CDF\n\n\b\
    ar{F}_k(t) = P(t_k + (k − 1) T ≤ t) = P(t_k ≤ t − (k − 1) T)\n= { 0 if t ≤ (k\
    \ − 1) T\nF_k(t − (k − 1) T) otherwise } (1.92)\n\nwhere F_k(t) is the CDF of\
    \ f_k(t)."

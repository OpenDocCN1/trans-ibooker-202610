    |

    | Physical | Radiation, magnetic and electrical fields, altitude |


    how the elimination or reordering of components in a design affects the overall
    operation, or how the elimination of a sensor affects the possible observation
    of a failure. There are many different methods for conducting inductive analysis,
    such as preliminary hazard analysis (PHA), failure mode and effect analysis (FMEA),
    and failure mode effect and criticality analysis (FMECA) and event tree analysis
    (Thomas 2006; Czichos 2013).


    PHA is an initial study used in the early stages of designing systems to avoid
    costly redesign if a hazard is discovered later. It is a broad approach, and its
    main focus consists of the following elements:


    +   1. Identify apparent hazards.

    +   2. Assess the potential accidents (and their severity) that might occur as
    the consequence of a hazard.

    +   3. Identify preventive measures to be used to reduce the risk.'

    a parameter, and *FD₀* is the nominal value of the signature in the absence of
    degradation when *dPᵢ* = 0.


    When *n* is less than 1, *n* < 1.0, the degradation signature has a decreasing
    slope angle (Figure 4.5); when *n* is greater than 1, *n* > 1.0, the signature
    has an increasing slope angle (Figure 4.6); and when *n* = 1, the slope angle
    of the signature is constant. Examination of Eq. (4.3) and the plots reveals that
    the plots might not be applicable when *dPᵢ* > *P₀* unless the parameter is an
    active component that has negative values: passive components have positive values.


    Note that when *dPᵢ* = *P₀*, then regardless of the value of *n*,


    $$-(dP_i/P_0)^n = -(P_0/P_0)^n = -1^n = -1$$


    Notice that Eq. (4.10) is the mirror image of Eq. (4.9) with respect to the horizontal
    axis.


    **Example 4.1**  When asked to calculate the slope angle for Eq. (4.9) when *n*
    = 2.0 for *dPᵢ* = 0 and for *dPᵢ* = *P₀*, the slope angles you calculate are 0°
    and −45°. The slope angles increase as expected and as shown in the plots in Figure
    4.6.


    # Power Function #3: Increasing Signatures, Vertically Asymptotic


    The following model is for a power function that produces characteristic signatures
    that increase and become vertically asymptotic (see Figure 4.7):


    $$f(dP_i,P_0) = [1/(1-dP_i/P_0)]^n - 1 \tag{4.11}$$


    The model implies the following:


    +   - When *dPᵢ* < *P₀*, the signatures are increasing for all values of *n*.'

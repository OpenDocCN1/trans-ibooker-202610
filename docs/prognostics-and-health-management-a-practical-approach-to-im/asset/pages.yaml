    # 7.1.2 Electronic Health Solutions


    Electronic health solutions, such as those described in this book, become part
    of a PHM system. They are sometimes referred to as a prognostic ecosystem (see
    Figure 7.1), within which such solutions can be categorized at levels as shown
    in Figure 7.2: die, component, board, module, and system (Ridgetop Group 2018).
    Other levels could be added, such as an assembly of boards and a collection of
    modules into a replaceable unit.


    # Ecosystems


    An ecosystem can be described as prognostic models within a system that includes
    descriptions of data, quantification of uncertainty, justification and validation
    of model selection, and limitations of application (Astfalck et al. 2016). The
    locations in the broader view of an ecosystem shown in Figure 7.1 are the following:
    location 1 is a system or subsystem comprising one or more line-replaceable units
    (LRUs) that are prognostic enabled (monitored for damage and/or degradation);
    location 2 is a PHM system that acquires, manipulates, manages, and processes
    data to produce prognostic'

- pgno: 61
  md: 'FFP signatures have been successfully processed by prediction algorithms to
    produce accurate estimates of system health and remaining life. Increased accuracy
    is achieved by further transforming FFP signature data in degradation progression
    signature (DPS) data and then transforming DPS data into functional failure signature
    (FFS) data. FFS data processed by predication algorithms employing Kalman-like
    filtering, random-walk, and/or other trending algorithms results in very accurate
    prognostic estimates and rapid convergence from, for example, an initial error
    of 50% to 10% within fewer than 20 data samples. This rapid, accurate convergence
    is very useful for CBM in PHM systems (Hofmeister et al. 2016, 2017a,b).


    # 1.6.1 General Framework for a CBM-Based PHM System


    Figure 1.16 illustrates a PHM system forming a framework for CBM. The system monitors,
    captures, and processes CBD to extract signatures indicative of the state of health
    (SoH) of devices, components, assemblies, and subsystems in systems. Extracted
    signatures are processed to produce prognostic information, such as SoH and RUL,
    which are further processed to manage maintenance and logistics of the system
    (CAVE3 2015; Hofmeister et al. 2016).


    Figure 1.17 is an exemplary illustration of a framework for CBM. The framework
    consists of (i) a sensor framework, (ii) a feature-vector framework, (iii) a prediction
    framework; (iv) a health-management framework, (v) a performance-validation framework,
    and (vi) a control- and data-flow framework.


    A sensor framework comprises sensors to capture signals at nodes within the system.
    Smart sensors provide initial data conditioning such as analog-to-digital data
    conversion and digital-signal processing, and produce and transmit FD such as
    scalar values. A feature-vector framework provides additional data conditioning,
    including data fusion and transformation to create signatures, such as FFS that
    are used as input data to a prediction framework that produces prognostic information.
    A health-management framework processes prognostic information to create diagnostic,
    prognostic, and logistics directives and actions to maintain the health and reliability


    ![](img/05efaadbca64ad00f9e8d44c1db8cc7b_61_0.png)


    Figure 1.16 High-level block diagram of a PHM system.'
  merge: -1

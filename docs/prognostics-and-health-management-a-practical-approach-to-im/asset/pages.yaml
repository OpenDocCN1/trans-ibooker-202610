    # 2.2.6 Failure Distribution


    As the independent variables change in distribution models, the rate of change
    of a given curve varies, which creates a family of failure curves having a failure
    distribution with a TTF as illustrated in Figure 2.11. The failure distribution
    is a probability density function (PDF), and the TTF is the expectation or the
    0.50 value of the cumulative distribution function (CDF) of that PDF: note that
    TTF is not the same entity as MTTF – more on this topic is presented in Chapter

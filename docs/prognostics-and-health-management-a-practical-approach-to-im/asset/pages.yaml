    | FFP-signature model: | [1/(1 − dP_i/P_0)]^n − 1 |

    | FFP-to-DPS transform model: | 1 − 1/(FFP_i + 1)^{1/n} |

    | FL transform from FFP-based to DPS-based: | 1 − 1/(FL_FFP + 1)^{1/n} |


    +   The nominal value of the ripple voltage is 99.3 mV (FD_0 = 99.3 mV): calculated
    average of 10 samples prior to onset of degradation.

    +   Use 0 for the noise margin (NM = 0 mV).

    +   Define functional failure as FL_CBD = 250 mV, when CBD equals 250 mV.

    +   Injected degradation for the experiment began when time equaled 98 hours.'

    +   3. Model degradation signatures and signal-conditioning methods in an offline
    phase, and then use those models and methods to support the transformation of
    data into an FFS.


    +   4. Process transformed data to produce prognostic information.


    In this chapter, we shall use the models (process #3) developed in Chapter 4 to
    transform exemplary data (process #2) to demonstrate causes and effects that reduce
    the quality of signatures (process #1), which reduces the accuracy of prognostic
    information (process #4). The objectives are to present and discuss sources of
    errors, significant effects of those errors on signatures, and methodologies and
    techniques that, when employed, ameliorate and/or mitigate errors by removing,
    reducing, and/or by avoiding such causes and effects. The goal is to improve the
    linearity and accuracy of FFS data used as input to the prediction system of a
    PHM system and, in doing so, improve the accuracy of prognostic information used
    to provide a prognosis of the health of the system being monitored and managed.


    We shall apply a heuristic-based approach to an example of a prognostic-enabled
    component of an assembly in a system that, when subjected to degradation leading
    to failure, produces noisy CBD. That example will be an SMPS in which the capacitance'

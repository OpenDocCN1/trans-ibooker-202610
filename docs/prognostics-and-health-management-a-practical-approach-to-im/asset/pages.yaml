    # 7.2.1 Criteria for Evaluation, Selection, and Winnowing


    Because you are designing a PHM system to prognostic enable an operational system,
    your team will not perform any traditional failure mode and effect analysis (FMEA)
    or failure mode effect and criticality analysis (FMECA) (DAU 2018). Instead, your
    team will review the existing FMEA and FMECA data; the historical failure, service,
    and repair data; and any other data related to failure. The focus is on identifying,
    selecting, and winnowing prognostic targets. To select and winnow a list of prognostic
    candidates, including those identified as candidates by FMEA/FMECA, you need to
    know the following:


    +   - *TTF or TTFF.* An estimate of the time to failure (alternatively, time to
    functional failure). This is a primary focus of this chapter.

    +   - *PD (estimated).* An initial estimate of the distance in time between the
    onset of degradation and functional failure from which a prediction algorithm
    converges upward or downward to a true PH.

    +   - *Failure mode to be detected.* The failure mechanism that causes the characteristic
    shape of the signature captured by one or more sensors.

    +   - *Severity classification.* A qualitative assessment of the consequences
    of functional failure.

    +   - *Cost of failure.* An estimate of the cost of an unplanned failure versus
    the cost of service and repair before failure.

    +   - *Cost of prognostic enabling.* An estimate of, for example, the cost of
    the sensor, PHM support, design, development, testing, qualification, and fielding.

    +   - *Cost-benefit analysis.* An estimate of, for example, the change in sustainment
    cost plus time in use due to prognostic enabling, the effective savings achieved,
    and the change in service actions because of prognostic enabling.


    # 7.2.2 Meaning of MTBF and MTTF


    PHM systems are typically referenced to either MTBF or MTTF, and therefore you
    should know and understand the difference between them (Speaks 2005):


    +   - *MTBF.* Calculated mean time between (or before – context dependent) failures
    of a repairable system.

    +   - *MTTF.* Expected TTF of a nonrepairable system.


    As you can see, the meaning of (and therefore the use of) these terms is dependent
    upon the definition of failure and the definition of repairable. To achieve an
    understanding of those terms, recollect that Chapter 2 introduced failure in time
    (FIT) in Eq. (2.15):


    ```

    Failure rate = λ = (number of failures) / [(number of tested parts)(hours of test)
    AF] 10^9 FIT

    ```


    where AF is the value of an acceleration factor for a specified test. Refer to
    Tables 2.3 and 2.4 for examples.'

  md: '# Table 5.1 FFS nonlinearity procedure.


    | Procedure name | Procedure expression |

    |---|---|

    | Calculate time to failure (TTF) | $TTF = t_{FAILURE} - t_{ONSET}$ |

    | Create set of ideal data {$IDEAL\_FFS_i$} | $IDEAL\_FFS_i = 100\,(t_i - t_{ONSET})/TFF$
    |

    | Calculate point-by-point nonlinearity {$FNL_i$} | $FNL_i = FFS_i - IDEAL\_FFS_i$
    |

    | Calculate positive nonlinearity ($FNL_P$) | $FNL_P = max({FNL_i})$ |

    | Calculate negative nonlinearity ($FNL_N$) | $FNL_N = min({FNL_i})$ |

    | Calculate total nonlinearity error ($FNL_E$) | $FNL_E = FNL_P - FNL_N$ |


    # Evaluate Data Quantitatively


    Because an ideal FFS is a straight-line transfer curve, a quantitative evaluation
    of results is possible by employing the FFS nonlinearity (FNL) method from Chapter
    3. You decide it would be informative to calculate the positive nonlinearity,
    negative nonlinearity, and total nonlinearity:


    ```

    $FNL_P = max({FNL_i})$  (5.2)

    ```


    ```

    $FNL_N = min({FNL_i})$  (5.3)

    ```


    ```

    $FNL_E = FNL_P - FNL_N$  (5.4)

    ```


    Table 5.1 lists the steps in a procedure to quantitatively evaluate the nonlinearity
    of an FFS.


    # Example 5.2  Perform an FNL procedure as outlined in Table 5.1, and then plot
    and evaluate the results. Assume the following:


    +   - The desired FFS nonlinearity is to be within ±10% ($PD_\alpha = PD_{10}$),
    on or before 75% of the maximum prognostic distance (PD), which is known from
    the experiment to be 155 hours starting at the onset of degradation (98 hours)
    and ending at functional failure (253 hours).

    +   - The desired FFS nonlinearity is to be within 5% ($PD_\alpha = PD_{10}$),
    on or before 50% of the maximum PD.

    +   - No positive FFS nonlinearity prior to onset of degradation.


    The nonlinearity of the FFS data on the left in Figure 5.8 is calculated and plotted
    on the right in Figure 5.8. Table 5.2 lists the quantitative calculations, specifications,

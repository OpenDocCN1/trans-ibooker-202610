  md: '# 1.8.3 Condition-Based Maintenance or Replacement


    Next, we present a model of CBM or replacement if repair is not feasible or not
    economical (Hamidi et al. 2017). Consider a machine that produces utility with
    rate u(t) after t time periods of operation, which includes the value of its produced
    utility minus all costs of operation. Assume at time T a sensor shows the start
    of a degradation process, resulting in a decrease in utility production, in addition
    to increased operation and replacement costs because of the increased level of
    degradation. In formulating the mathematical model to find the optimal time of
    repair or replacement, the following notations are used:


    +   α = Degradation coefficient

    +   β = Cost of repair or replacement increase coefficient

    +   x = Planned time of repair or replacement

    +   u(t)e^{-α(t-T)} = Density of utility value produced at time t > T

    +   Ke^{β(x-T)} = Cost of repair or replacement at time x


    So, the total net profit per unit time can be given as


    ```

    g(x) = [∫₀ᵀ u(t)dt + ∫ₜˣ u(t)e^{-α(t-T)}dt - Ke^{β(x-T)}] / x  (1.121)

    ```


    which is maximized with respect to the decision variable x. Notice first that
    the derivative of g(x) has the same sign as


    ```

    G(x) = [u(x)e^{-α(x-T)} - βKe^{β(x-T)}]x - [∫₀ᵀ u(t)dt + ∫ₜˣ u(t)e^{-α(t-T)}dt
    - Ke^{β(x-T)}]

    ```


    where


    ```

    G(T) = (u(T) - βK)T - ∫₀ᵀ u(t)dt + K

    ```


    and G(x) tends to negative infinity as x converges to infinity.


    Notice that


    ```

    G''(x) = u''(x)e^{-α(x-T)}x - αu(x)e^{-α(x-T)}x - β²Ke^{β(x-T)}x + u(x)e^{-α(x-T)}
    - βKe^{β(x-T)} - u(x)e^{-α(x-T)} + Kβe^{β(x-T)} = u''(x)e^{-α(x-T)}x - αu(x)e^{-α(x-T)}x
    - β²Ke^{β(x-T)}x < 0

    ```


    since u(x) is nonincreasing. So G(x) is a strictly decreasing function of x. Let
    T* > T be the latest time period when the repair or replacement must be performed.


    So, we have the following three possibilities:


    +   G(T) ≤ 0. Then G(x) < 0 for all x > T, so g(x) decreases, and therefore T
    is the optimal x value.

    +   G(T*) ≥ 0. Then G(x) > 0 for all x < T*, so g(x) increases, and therefore
    T* is the optimum x value.

    +   Otherwise, G(T) > 0 and G(T*) < 0, and there is a unique T̄ ∈ (T, T*) such
    that G(T̄) = 0. This T̄ value is the optimum scheduled repair or replacement time.


    In cases where there are several machines with different parameters, and a common
    time x is to be determined to repair or replace them together in order to decrease
    setup'

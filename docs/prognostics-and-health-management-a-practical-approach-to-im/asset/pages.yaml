- pgno: 352
  md: 'In a first design of a PHM system, an objective might be to avoid all unexpected
    failures, but at increased maintenance costs: for example, an average 300 hours
    of lost usage for each instance of avoidance, and cost increases due to increased
    maintenance actions (more frequent replacement). A second design might focus on
    reducing sustainment costs by increasing the time between maintenance actions
    – but unexpected failures would increase. Typically, even disregarding mission
    and safety issues, the cost of an unexpected failure is higher than an early repair-and-replace
    action.


    So, instead of a usage-based PHM system, we advocate CBM using a PHM system that
    is CBD-based; uses signature-based detection and prognostic approaches and methods;
    and employs a fast, highly accurate set of data-conditioning, prediction, and
    computational routines. The advocated approach of using CBD signatures is an effective
    method for handling variability introduced by the operational environment: operating
    in the desert of Arizona is very different than operating equipment in a rainy,
    cold environment such as that in Puget Sound, Washington.


    # 7.1.5 Health Management, Maintenance, and Logistics


    This book is focused on prognostic enabling to monitor the health of a system
    of nodes: the prognostic targets chosen because those nodes have signals that
    change in response to degradation of devices, components, and so on that, when
    they fail, have a critical effect on the operation of the system. They may cause
    mission-critical functions to cease or otherwise operate out of specifications,
    or they may create a hazardous threat to the safety of the system or life.


    But monitoring, per se, does not avoid unexpected outages, does not repair anything,
    and does not prevent loss of life. Refer back to Figure 7.1: a PHM system needs
    to provide services for health management, maintenance, and logistic support to
    schedule maintenance, locate and deliver parts and equipment, and dispatch a maintenance
    team.


    # Management


    Given the accuracy of the prognostic information produced by the PHM system in
    Chapter 6, it would not be unreasonable to defer maintenance until a detected
    state of health (SoH) value at or below a specified level, such as 25%. PHM management

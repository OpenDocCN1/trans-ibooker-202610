  md: '# 3.3 Model Verification


    It is important that all models used in a PHM system are verified: simulate each
    model, and compare the model against experimental and/or actual fielded data.
    There needs to be high correlation between the simulated data results and the
    results you obtain using experimental and/or field data. Most likely there will
    be discrepancies, but you should be able to explain those discrepancies to make
    an informed decision as to whether the discrepancies are acceptable and/or modeling
    and processing changes are necessary and/or desirable.


    The verification focus of CBD modeling is comparing the characteristic curve exhibited
    by the CBD signatures against an ideal curve obtained from simulating your PoF-based
    and/or FMEA-based model. The objective of the modeling is not to exactly replicate
    CBD signatures with model-simulated curves; rather, it is to ensure the totality
    of model-simulated curves: the models for CBD signatures, FFP signatures, DPS
    data, and FFS data are sufficiently correlated and accurate. When FFS data is
    input to prediction algorithms in your PHM system, the resultant prognostic information
    needs to meet the accuracy, convergence, and reliability requirements for reliable
    condition-based monitoring.


    # 3.3.1 Signature Classification


    There is little use for prognostic-enabling a component that typically degrades
    from zero degradation (100% health) to functional failure (0% health) in less
    than a second. Instead, diagnostic detection, reporting, and remedial actions
    and/or disaster avoidance and/or remedial measures are really all that can be
    done for such “avalanche” failure modes. We are interested in degradation-induced
    signatures: those signatures having changes that are highly correlated to the
    levels of degradation. Further, the time between the onset of degradation and
    a level of degradation that results in functional failure must be sufficiently
    long to enable the prognostic system to detect degradation, produce prognostic
    estimates that converge to a level of required accuracy, and do so on or before
    a required minimum length of time (a prognostic distance [PD]). We model signatures
    using the following general form we previously developed (Eq. (2.50) in Chapter
    2):


    ```

    FD_i = FD_0 f(dP_i, P_0) (3.20)

    ```


    where f(dP, P_0) is a degradation model, FD_i is a signature data point, FD_0
    is the nominal value of a measurable feature absent any degradation, dP_i is a
    change in value of a parameter, and P_0 is the nominal value of that parameter
    absent any degradation.


    As we shall see in this and the next chapter, the signature identification, conditioning,
    and transform methods used means it is not necessary to determine or use exact
    parameter values, but we need to identify the class of each signature to select
    a correct degradation model. The degradation-related signatures result from failure
    modes that can be modeled as power functions or exponential functions.


    Although degradation signatures are modeled as power functions or exponential
    functions that have either increasing or decreasing amplitudes, constant signatures
    are only applicable in the sense that they indicate the absence of degradation.
    We shall only'

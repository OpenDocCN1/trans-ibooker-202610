    # 1.8.4 Preventive Replacement Scheduling


    The optimum timing of preventive replacement is next discussed. In the case of
    a failure, the unexpected timing and the possible additional damages make the
    replacement more expensive than a preventive replacement. If replacement is done
    early, then a useful time interval is lost; and if it is scheduled late, then
    failure might occur, with a high replacement cost and possible damages and accidents.
    In scheduling preventive replacement, several factors should be considered.


    Let $X$ denote the random variable representing the time to unrepairable failure,
    when the object must be replaced. The CDF, PDF, reliability function, and failure
    rate of $X$ are denoted by $F(t)$, $f(t)$, $R(t)$, and $\rho(t)$, respectively.
    Let $c_p$ and $c_f$ denote the cost of preventive and failure replacements, respectively.
    Assume that the preventive replacement is scheduled at time $T$; then the expected
    replacement cost is $c_p R(T) + c_f F(T)$'

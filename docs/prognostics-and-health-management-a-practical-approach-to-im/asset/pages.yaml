    # 1.4 Uncertainty Measures in Parameter Estimation


    Consider first a PDF that depends on only one parameter, $\theta$, which is determined
    by using a finite sample. Let $f(t|\theta)$ denote the PDF, and let $t_1, t_2,
    ..., t_N$ be the sample elements. The likelihood function is


    $$L(\theta) = \prod_{k=1}^{N} f(t_k|\theta)$$


    and its logarithm is written as


    $$l(\theta) = \sum_{k=1}^{N} \ln(f(t_k|\theta)) \tag{1.75}$$


    which is then maximized to get the best estimate for the unknown parameter $\theta$.
    By sampling repeatedly, we obtain different sample elements and therefore different
    estimates for $\theta$. The value of $\theta$ depends on the random selection
    of the sample elements, so it is also a random variable. Its uncertainty can be
    characterized by its variance. Let the maximizer of Eq. (1.75) be denoted by $\theta^*$.


    The Fisher information is defined as the negative of the second derivative of
    $l(\theta)$ with respect to $\theta$ at $\theta = \theta^*$:


    $$I = -\left.\frac{\partial^2 l(\theta)}{\partial \theta^2}\right|_{\theta=\theta^*}
    \tag{1.76}$$


    And it can be proved that the variance of $\theta$ is the reciprocal of $I$:


    $$\operatorname{Var}(\theta) = \frac{1}{I} \tag{1.77}$$


    (Frieden 2004; Pratt et al. 1976).


    # Example 1.9 Assume $X$ is normal with a known variance $\sigma^2$ but an unknown
    expectation $\mu$. In this case,


    $$L(\mu) = \prod_{k=1}^{N} \frac{1}{\sigma\sqrt{2\pi}} e^{\frac{-(t_k - \mu)^2}{2\sigma^2}}
    = \frac{1}{(\sigma\sqrt{2\pi})^N} e^{-\frac{1}{2\sigma^2} \sum_{k=1}^{N} (t_k
    - \mu)^2}$$


    and so


    $$l(\mu) = -N \ln(\sigma\sqrt{2\pi}) - \frac{1}{2\sigma^2} \sum_{k=1}^{N} (t_k
    - \mu)^2$$'

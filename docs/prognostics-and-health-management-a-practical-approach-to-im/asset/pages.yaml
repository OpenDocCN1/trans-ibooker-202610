    # CBD Signature Evaluation


    Evaluation of the CBD signature as input to an intended prediction algorithm leads
    to the following conclusions:


    +   - The prediction algorithm is likely to produce estimates of prognostic information
    – remaining useful life (RUL), state of health (SoH), and prognostic horizon (PH)
    – that meet the accuracy requirements of your customer, especially with regard
    to a required minimum prognostic distance (PD) within a specified accuracy (PDₐ).


  md: '# Table 6.2 (Continued)


    | PTOF | Predicted time of failure. The estimated time when a prognostic target
    is expected to functionally fail. It is calculated as the sum of the time when
    degradation is detected and the PH estimate:


    PTOF = BD + PH |

    | RA | Relative accuracy. The accuracy of an estimated RUL value with respect
    to the actual RUL at the time of a data sample. RA is a performance metric having
    meaning only after functional failure occurs (TFF is determined):


    RA (%) = 100*(1 − RUL/RUL0)


    where RUL = estimated RUL at sample n and RUL0 = ideal RUL for sample n. Contrast
    RA with accuracy:


    RUL accuracy (%) = 100*RUL/RUL₀


    RA is applicable to any prognostic or predictive estimate such as SoH or EOL.
    |

    | RT | Relative time between a sampled data point and the time when degradation
    was detected:


    RT = (data time) − BDDETECTED |

    | TTF | Time to failure (see RUL). The time it takes a component, device, assembly,
    or system to fail – the end of its useful life. |


    Figure 6.72 Illustration of the uncertainty of determining exactly when functional
    failure occurs.


    ![](img/05efaadbca64ad00f9e8d44c1db8cc7b_320_0.png)


    # Time of Functional Failure: Uncertainty/Indeterminate


    Functional failure (end of useful life) detection is subject to the same uncertainty
    as detection of the onset of degradation, because sampling almost always occurs
    before or after functional failure, as illustrated in Figure 6.72, rather than
    exactly at EOL₀. This is another offset type of error.


    From a practical point of view, you should not be concerned about this offset
    error: remember that the primary purpose of your PHM system is to detect degradation
    far enough in advance to initiate and complete any remedial action necessary to
    prevent a future failure. For that purpose, there is a useful measurement called
    prognostic distance (PD): the period of time between when degradation begins and
    when functional failure occurs. The sampling interval needs to be much less than
    the PD (see Figure 6.73).'

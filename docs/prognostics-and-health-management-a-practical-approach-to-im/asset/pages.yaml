- pgno: 179
  md: '+   - Further, variations related to phase changes are likely to produce insignificant
    changes in estimated values.

    +   - It is not necessary to develop a 100% accurate model of exactly how a dominant
    parameter changes in response to a failure mode for each and every target for
    prognostic enabling.


    The theory predicts the following results, which apply to the soundness of a heuristic
    approach to modeling signatures:


    +   - Different failure modes that result in similar changes in a parameter produce
    similar changes in measurable signals.

    +   - Given a failure mode that causes a signature that is reasonably close to
    a signature from a known model, it is sufficient to use that known model to produce
    an FFS as input to prediction algorithms.

    +   - A caveat is that the use of a known model that significantly differs from
    an exact PoF model might result in FFS data that produces prognostic information
    that fails to sufficiently meet accuracy requirements.


    # 4.1.3  Chapter Objectives


    In this chapter, the primary objective is to present and discuss a heuristic approach
    to modeling CBD signatures, as follows: (i) we first develop degradation-signature
    models that generate signatures with characteristic curves; and (ii) we then develop
    additional models that are used to transform signatures and define failure levels.


    Subsequently, instead of developing specific models for specific CBD signatures,
    CBD signatures are matched to known characteristic curves produced by existing
    degradation-signature models. The corresponding transform models are used.


    This approach is simpler compared to an approach using FMEA and PoF methods, such
    as the following: (i) develop a PoF-based degradation-signal model for every prognostic
    target; (ii) use that model to generate a characteristic curve; (iii) compare
    the generated curve to the curve of the CBD signature; (iv) modify, as necessary,
    the PoF-based model; (v) develop the other models for that CBD signature; and
    then (vi) use the developed models. Those models are for the following functions
    that produce characteristic signatures for matching to CBD signatures:


    +   - Power functions for *n* = 0.25, *n* = 0.5, *n* = 0.75, *n* = 1.0, *n* =
    1.25, *n* = 1.50, and *n* = 2:

    +     - Increasing and decreasing signatures,

    +     - Increasing and decreasing slope angles.¹

    +   - Exponential functions for λ = *P*₀ and *P*₀ = 50, *P*₀ = 100, *P*₀ = 150,
    and *P*₀ = 200:

    +     - Increasing and decreasing signatures,

    +     - Increasing and decreasing slope angles.


    The developed degradation-signature models are simulated and the results examined
    to verify that each model produces data having an expected characteristic signature.
    The sets of signatures are the following: CBD, FFP, degradation progression signature


    > ¹ A special case occurs when a curve is a straight line: the slope angle is
    constant – neither increasing nor decreasing.'

  md: '# Comparison of FFP-Based and DPS-Based Failure Thresholds


    Comparing the DPS and FFP right-side plots of Figure 3.13 indicates the amplitudes
    are different for a given point in time. This means an FFP signature at an amplitude
    ratio of 0.4 is not at the same level of degradation as for a DPS at that same
    amplitude ratio. This is because a failure level for an FFP signature is defined
    as follows:


    $$FL_{FFP} = FFP_i \tag{3.16}$$


    Then from Eq. (3.8),


    $$FL_{FFP} = (FD_i - FD_0)/FD_0$$


    then


    $$FD_i - FD_0 = FD_0FL_{FFP} \rightarrow FD_i = FD_0FL_{FFP} + FD_0$$


    Then we have


    $$FD_0/FD_i = 1/(FL_{FFP} + 1)$$


    And from Eq. (3.15),


    $$FL_{DPS} = 1 - (1/(1 + FL_{FFP}))^2 \tag{3.17}$$


    # Using a DPS-Based Failure Level


    Since an FFP signature is a FFP, it is logical to define a failure level using
    Eq. (3.16) and then calculate the equivalent level for $dP/P_0$ using Eq. (3.17).


    **Example 3.8** Suppose you wish to use $FL_{FFP} = FD_i = 0.4$ as the failure
    level. To calculate the equivalent $FL_{DPS}$, you would use Eq. (3.17):


    $$FL_{DPS} = 1 - (1/(1 + FL_{FFP}))^2 = 1 - (1/(1 + 0.4))^2$$


    $$= 1 - (1/1.4)^2 = 0.49 = 0.5$$


    Figure 3.14 shows an $FL = 0.5$ superimposed on DPS and an $FL = 0.4$ superimposed
    on FFS: functional failure occurs at the same time for both, which is the expected,
    desirable result.


    # 3.2.5  Transforming DPS into DPS-Based FFS


    A DPS, similar to an FFP, is more useful when transformed into a DPS-based FFS:
    divide DPS data signature data by the value of the failure level (FL) and, at
    the same time, multiply the result by 100 to create FFS data related to percent
    of failure:


    $$FFS_{DPS_i} = 100\ DPS_i/FL \tag{3.18}$$


    $$\text{DPS-based FFS} = FFS_{DPS} = \{FFS_{DPS_m}, FFS_{DPS_{m+1}}, \ldots, FFS_{DPS_{m+n}}\}
    \tag{3.19}$$


    Similar to an FFP-based FFS, there is one model for all failure levels, and prediction-algorithm
    processing of FFS signature data is greatly simplified.


    **Example 3.9** Use the results of 3.8 and transform the FFP data into an FFS
    using an FL value of 0.7; transform the DPS data into an FFS using an FL value
    of 0.65; and then'

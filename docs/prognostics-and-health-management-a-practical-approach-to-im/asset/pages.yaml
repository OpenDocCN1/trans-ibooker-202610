- pgno: 32
  md: 'The primary objective of this chapter is to provide a general overview of this
    complex scientific field. Detailed descriptions and model development for a heuristic
    approach to modeling condition-based data (CBD) to support prognosis in a PHM
    system are presented in the later chapters.


    # 1.1.2 Chapter Organization


    The remainder of this chapter is organized to present and discuss a heuristic-based
    approach to modeling CBD signatures as follows:


    1.2 Foundation of Reliability Theory

    This section presents the foundation upon which reliability is built: failure
    distributions, probability and reliability, probability density functions and
    relationships, failure rate, and expected value and variance.


    1.3 Failure Distributions Under Extreme Stress Levels

    This section presents models for failure and extreme stress, cumulative damage,
    and exponential and Weibull failures and distribution.


    1.4 Uncertainty Measures in Parameter Estimation

    This section presents an introduction to measurement metrics dealing with uncertainty,
    such as likelihood, variance, and covariance.


    1.5 Expected Number of Failures

    This section presents the effects and interaction of repair, replacement, and
    partial repair activities on assessing the number of failures and decrease in
    effective age due to partial repairs.


    1.6 System Reliability and Prognosis and Health Management

    This section presents a framework for a PHM system based on condition-based maintenance
    (CBM) and introduces the reader to such a framework, CBD and signatures, and CBM,
    which can transform signatures into curves useful for processing to produce prognostic
    information.


    1.7 Prognostic Information

    This section introduces basic concepts and measures that are applicable to prognostic
    information: RUL, SoH, prognostic horizon (PH), prognostic distance (PD), and
    convergence.


    1.8 Decisions on Cost and Benefits

    This section presents a brief overview of decision problems and their mathematical
    modeling during different stages of the lifetime of equipment, with some illustrative
    mathematical models.


    1.9 Introduction to PHM: Summary

    This section summarizes the material presented in this chapter.


    # 1.2 Foundation of Reliability Theory


    Engineering systems and their components and elements are subject to degradation
    that sooner or later results in failure. A component that fails sooner compared
    to other components is said to be less reliable. Failures of like objects, such
    as components and assemblies, do not all occur at the same point in time; failures
    are distributed over time.'
  merge: -1
  img_proc: true
- pgno: 33
  md: "# 1.2.1  **Time-to-Failure Distributions**\n\nThe time to failure (TTF) of\
    \ a particular object is usually modeled using probability theory, which represents\
    \ the average behavior of a large set of identical objects and not the behavior\
    \ of a particular object. It is considered as a random variable, denoted by $X$.\
    \ The cumulative distribution function (CDF) of $X$ is the probability that failure\
    \ occurs at or before time $t$:\n\n$$F(t)=P(X\\leq t) \\tag{1.1}$$\n\nIt is usually\
    \ assumed that the object starts its operation at $t=0$, so $F(t)=0$ as $t\\leq\
    \ 0$. Furthermore, $F(t)$ tends to unity as $t\\to\\infty$: the function is non-decreasing.\
    \ In reliability engineering, the most frequently used distribution types are\
    \ as follows:\n\n+   1. *Exponential* distribution:\n+   \n+      $$F(t)=1-e^{-\\\
    lambda t},\\qquad t\\geq 0 \\tag{1.2}$$\n+   \n+      where the parameter $\\\
    lambda>0$ determines the lifetime.\n+   \n+   2. *Weibull* distribution:\n+  \
    \ \n+      $$F(t)=1-e^{-(t/\\eta)^\\beta},\\qquad t\\geq 0 \\tag{1.3}$$\n+   \n\
    +      where $\\eta>0$ is referred to as the *scale* and $\\beta>0$ is referred\
    \ to as the *shape*.\n+   \n+   3. *Gamma* distribution:\n+   \n+      $$F(t)=\\\
    int_0^t\\frac{x^{k-1}e^{-x/\\theta}}{\\theta^k\\Gamma(k)}\\,dx,\\qquad t\\geq\
    \ 0 \\tag{1.4}$$\n+   \n+      where $k$ represents a shape parameter and $\\\
    theta$ represents a scale parameter. Furthermore, $\\Gamma(k)$ is the gamma function\
    \ value at $k$. Very often, variable $\\lambda=\\frac{1}{\\theta}$ is used in\
    \ applications.\n+   \n+   4. *Normal* distribution:\n+   \n+      $$F(t)=\\phi\\\
    left(\\frac{t-\\mu}{\\sigma}\\right),\\qquad -\\infty<t<\\infty \\tag{1.5}$$\n\
    +   \n+      where $\\mu$ is a real parameter and $\\sigma>0$.\n+   \n+   5. *Lognormal*\
    \ distribution:\n+   \n+      $$F(t)=\\phi\\left(\\frac{\\ln(t)-\\mu}{\\sigma}\\\
    right),\\qquad t>0 \\tag{1.6}$$\n+   \n+      where $\\mu$ is a real value and\
    \ $\\sigma>0$. Here $\\phi(t)$ is the standard normal distribution function defined\
    \ in Eq. (1.7):\n+   \n+      $$\\phi(t)=\\int_{-\\infty}^{t}\\frac{1}{\\sqrt{2\\\
    pi}}e^{-x^2/2}\\,dx \\tag{1.7}$$\n+   \n+      This does not have an exact simple\
    \ formula; only function approximations are available, or the value of $\\phi(t)$\
    \ for any particular value of $t$ can be obtained from the corresponding function\
    \ table.\n+   \n+   6. *Logistic* distribution:\n+   \n+      $$F(t)=\\frac{1}{1+e^{-z}}=\\\
    frac{e^z}{1+e^z},\\qquad z=\\frac{t-\\mu}{\\sigma},\\qquad -\\infty<t<\\infty\
    \ \\tag{1.8}$$\n+   \n+      where $\\mu$ and $\\sigma>0$ are the model parameters."
  merge: -1
  img_proc: true

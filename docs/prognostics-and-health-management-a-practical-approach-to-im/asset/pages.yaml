  md: 'to the FFP-based FFS. What we need is quantitative assessment – and we advocate
    a quantitative method for assessing the nonlinearity of FFS curves that is based
    on integral nonlinearity (INL) measurements that are commonly used for assessing
    the linearity of output-transfer curves of data converters (Texas Instruments
    1995; Carr and Brown 2000; Jenq and Qiong 2002).


    # 3.4.1  Sensing System


    A sensing system comprises everything between a monitored node and the input port
    of a predication system: the node, the sensor, and all the intervening frameworks.
    The prediction system acts upon the input from the sensing system to produce prognostic
    information used to provide a prognosis about a future failure: sensing hardware,
    data/domain converters, signal conditioning, data fusion, and so on.


    In a PHM system, the sensing system provides input to a prediction system that
    processes the input from the sensing system to produce prognostic information
    that includes (i) RUL, (ii) SoH, and (iii) PH. An ideal RUL curve is a decreasing
    straight line between the point in time of the onset of degradation and the point
    in time of functional failure: the amplitude of that line is the time between
    functional failure and the onset of degradation. Similarly, an ideal SoH curve
    is a decreasing straight line between the point in time of the onset of degradation
    and the point in time of functional failure: an ideal SoH curve decreases linearly
    from 100% to 0% in amplitude. An ideal PH curve is a horizontal straight line
    comprising the sum of the current time of a sample and the RUL at that time.


    The linearity of a sensing system is an assessment of how the measured curve produced
    by the sensing system deviates from the ideal curve (TI 1995; Carr and Brown 2000).
    The output of the sensing system is an FFS, and an ideal FFS input curve to the
    predication system is a straight line having a value of 0 just before the instant
    in time that degradation begins and a value of 100 at the instant when the monitored
    prognostic target is deemed to have functionally failed. For example, the left
    side of Figure 3.22 is a plot of an ideal FFS curve, and the right side of that
    figure is a plot of our example DPS-based FFS; as shown, that curve deviates from
    an ideal FFS curve.


    # 3.4.2  FFS Nonlinearity


    We define functional-failure signature nonlinearity (FNL) as a measure of the
    deviation between the actual FFS and an ideal FFS, very much like an INL assessment
    of an analog-to-digital data converter (ADC) or transducer output transfer curve
    (Texas Instruments 1995; Carr and Brown 2000; Jenq and Qiong 2002). A point-by-point
    FNL is a measurement of the error between an actual FFS value and the ideal FFS
    value at that point in time (see Figure 3.23). A total error (FNLₑ) provides an
    assessment of the nonlinearity of the FFS curve (see Figure 3.24).


    # Calculating FFS Nonlinearity (FNL)


    Calculating FNL is a post-processing type of operation using FFS data, because
    we need to first calculate the total time between the point in time of the onset
    of degradation and the point in time when functional failure occurs:


    $$TTF = t_{FAILURE} - t_{ONSET} \tag{3.21}$$'

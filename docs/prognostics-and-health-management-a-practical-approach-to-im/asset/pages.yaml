- pgno: 40
  md: 'The numerator is the probability that the object will break down in the next
    Δt time periods given that it is working at time t. If Δt = 1, then the fraction
    gives the probability that the object will break down during the next unit time
    interval. By simple calculation,


    P(t < X < t + Δt | t < X) / Δt = P(t < X < t + Δt) / [Δt P(t < X)] = [F(t + Δt)
    − F(t)] / [Δt P(X > t)]


    which converges to the following:


    ρ(t) = f(t) / R(t)  (1.34)


    That is, ρ(t) can be easily computed based on the PDF and reliability function
    of X. TTF distributions are characterized by their PDFs (f(t)), CDFs (F(t)), reliability
    functions (R(t)), and failure rates (ρ(t)). If any of these functions is known,
    then the other three can be easily determined as shown next.


    If f(t) is known, then F(t) = ∫₀ᵗ f(t) dt, R(t) = 1 − F(t), and ρ(t) = f(t)/R(t).


    If F(t) is known, then f(t) = F′(t), R(t) = 1 − F(t), and ρ(t) = f(t)/R(t).


    Assume next that R(t) is known. Then F(t) = 1 − R(t), f(t) = F′(t), and ρ(t) =
    f(t)/R(t).


    And finally, assume that ρ(t) is given. From its definition


    ρ(t) = f(t)/R(t) = f(t)/[1 − F(t)] = − [−f(t)]/[1 − F(t)]


    and by integration


    ∫₀ᵗ ρ(x) dx = − ∫₀ᵗ [−f(x)]/[1 − F(x)] dx = [−ln(1 − F(x))]ₓ₌₀ᵗ = −ln(1 − F(t))
    + ln(1)


    so


    ln(1 − F(t)) = − ∫₀ᵗ ρ(x) dx


    implying that


    F(t) = 1 − e^{−∫₀ᵗ ρ(x) dx}  (1.35)

    f(t) = F′(t)

    R(t) = 1 − F(t) = e^{−∫₀ᵗ ρ(x) dx}


    # Exponential Failure


    In the exponential case,


    ρ(t) = [λ e^{−λt}] / e^{−λt} = λ  (1.36)


    which is a constant and does not depend on the age of the object. This relation
    also shows that the exponential variable does not include degradation.


    # Weibull Failure


    In the Weibull case,


    ρ(t) = (β / η^{β}) t^{β−1}  (1.37)


    which has different shapes depending on the value of β, as shown in Figure 1.8.'

    # TTF: MTTF-Based Method


    Referring to Figure 7.5, a simplistic MTTF-based method would be to set TTF equal
    to MTTF, but that method works well when the spread of the majority of the failures
    is wide compared to the value of MTTF. In such cases, simply setting PITTFF0 to
    twice the value of MTTF suffices. But if you are fairly confident that the situation
    is more like that illustrated in Figure 7.6, you need to specify a lower value
    for PITTFF0. However, it might be the case that your PHM system supports the same
    type of LRUs in two distinct operating environments: one that induces earlier-than-expected
    failures (akin to a situation like that shown in Figure 7.5) and a second that
    is less variable and causes failures to be more closely bunched together (akin
    to a situation like that shown in Figure 7.6). Further, to avoid misunderstanding
    and/or for procedural reasons, suppose you must always set PITTFF0 to a value
    (such as MTTF) specified by a manufacturer, vendor, or governmental agency. In
    such situations, you need a method to cause the prediction program to adjust the
    specified PITTFF0 value. The supplier of your prediction program agrees, and changes
    are made to provide a node-definition parameter, PITTFFADJ, to allow you to adjust
    how the value of PITTFF0 is handled:


    +   - When PITTFFADJ is not specified or is less than 1, the value of PITTFF0
    is used as an initial value for calculating the next RUL and PH values.

    +   - When PITTADJ ≥ 1, the initial value is calculated as [1 − exp(-PITTADJ)]
    (PITTFF0).


    **Example 7.6** From Table 7.1, TTF was calculated at 3630 hours; and from Eq.
    (7.7), PD(EST) = 2722 hours. So, you decide to set PITTFF0 = 2722 and do the following
    (Figure 7.7):


    +   - Compare this calculated result against the original result of using PITTFF0
    = 4800 (see Table 7.3).

    +   - Create comparison plots of the maximum PD versus the estimated PD using
    the calculated value of PITTFF0 (see Figures 7.8 and 7.9).

    +   - Create comparison plots of RUL and PH using the original value and the calculated
    value for PITTFF0 (see Figure 7.10).

    +   - Calculate and tabulate the percentage difference between the estimated,
    initial PD using the new calculated PITTFF0 value and the original value of 4800
    hours.


    The results indicate that there is a reduction in the difference, and the plots
    confirm that the prediction program converges from either a high or low initial
    estimate.'

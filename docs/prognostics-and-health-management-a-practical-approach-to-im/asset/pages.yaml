    # Maintenance


    A PHM system needs to alert users when maintenance is required – based on physical
    evidence of degradation, and not on an arbitrary number of elapsed hours. In addition
    to alerts, a PHM needs to provide for and support maintenance-related services
    to avoid unnecessary replacements, increase usage of systems, decrease downtime,
    and reduce sustainment costs. The approaches and methods used for maintenance
    are application specific, need be integrated with health management and logistic
    services, and are beyond the scope of this book.


    # Logistics


    A critical function of a PHM system is logistics support. Parts and equipment
    must be located and delivered to the service and repair site, and a service and
    maintenance team needs to be dispatched to arrive on or after, but not before,
    the arrival of needed parts'

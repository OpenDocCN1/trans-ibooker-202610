    # 7.2.4 TTF and PITTFF


    We need to know how to determine, calculate, and/or estimate a TTF value that
    begins when degradation begins and ends when functional failure occurs (see TTF
    1 and TTF 2 in Figure 7.5). But at the time when degradation is first detected,
    there is no a priori knowledge of that future time of failure; yet our prediction
    program needs to converge from an initial estimate of that time to a very accurate
    estimate of the time of failure. Research into reliability metrics such as MTTF,
    MTBF, and FIT indicates that they are not really close in value to what we need
    for TTF.


    The prediction program we are using, ARULEAV, provides a parameter called PITTFF0
    (introduced in Chapter 6) as a means to specify an initial value for TTF. TTF
    is not a value that is looked at or specified by manufacturers and/or vendors
    of products; failures in the field are usually due to either an anomalous event
    such as a lightning strike or degradation. Degradation typically is not caused
    by a part entering what is referred to as the wear-out region of a bathtub curve;
    rather, degradation is typically due to an accumulation of fatigue damage caused
    by cyclic stresses and strains (such as thermal and mechanical) during operation
    (Hofmeister et al. 2006).


    We can estimate an initial value for TTF using a number of methods: a service-life
    determination, an end-use test method, or an MTTF-based method. But be aware that
    the supplier of the prediction program advises that, in general, that program
    converges to within 25% accuracy in less time when the initial estimate is higher,
    rather than lower, in comparison to the true time of functional failure.


    # TTF: Service Life Determination


    Instead of using MTTF or MTBF values for an extremely low failure rate, you might
    use end-use values based on service-life values from vendors. For example:


    +   - A tire is warranted to last 5 years or 40 000 miles, and on or about that
    amount of usage, the tire is deemed “worn out” and is replaced: the tire is not
    repairable. The'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'new tire (same brand and type) is also warranted to last 40 000 miles. The
    tire can be said to have a TTF of 40 000 miles.


    +   - A fuel pump is warranted to last 5 years or 40 000 miles, whichever occurs
    first. When the fuel pump fails, it is replaced with a remanufactured pump that
    is warranted to last 2 years or 25 000 miles, whichever occurs first: the fuel
    pump is deemed repairable. Since the repaired pump has a smaller expected lifetime,
    the fuel pump can be said to have a time before failure (TBF) of 2 years or 25
    000 miles: less than the original expected lifetime. In this situation, choose
    the larger value.


    Set the PITTFF0 parameter to twice the value you have of the service-life determined
    value for TTF, for three reasons:


    +   - The supplier advises that the prediction program generally converges to
    a solution from a high initial error.

    +   - Reliability theory states that a mean lifetime, TTF, means 63% of failures
    are likely to occur before that mean.

    +   - Human factors: a low, initial error means that the prediction program is
    likely to produce increasing values of remaining useful life (RUL) for decreasing
    values of SoH. For example, Figure 7.9 plots the prediction results for the same
    data using a high value for PITTFF0 (left-hand plot) and a low value for PITTFF0
    (right-hand plot): at best, the results are perplexing to an operator; at worst,
    they may cause distrust and loss of confidence in the reliability of the PHM system.


    # TTF: End-Use Test Method


    You can calculate TBF and TTF values in the same way as MTBF and MTTF values,
    respectively, using the following (Weibull 2008):


    $$TTF = \frac{\text{total operating hours}}{\#\text{ failures}}$$ as for MTBF  (7.6)


    $$TTF = \frac{\text{total failure hours}}{\text{units tested}}$$ as for MTTF  (7.7)


    **Example 7.5**  In Chapter 6, an example system of six LRUs was used: two power
    supplies and four EMAs, of which four of the six LRUs failed. Use that data to
    calculate the values for TBF and TTF, and tabulate the results (see Table 7.2).
    For example, at the end of 5000 hours of testing six LRUs and four failures:


    +   - TBF = (6*5000)/4 = 7500 hours

    +   - TTF = (2745 + 3164 + 4176 + 4434)/4 = 3630 hours


    There is a significant difference between the TTF and TBF values, as shown in
    Table 7.2. The difference is due to TTF values being calculated using independent
    failure times, whereas TBF values are calculated using dependent failure times,
    because of a common understanding of the word *between*. Since it seems reasonable
    to use TTF rather than TBF, and since the TTFs are more consistent, you decide
    to use TTF: any question of whether to include the time of the first failure when
    calculating TBF becomes moot.


    Again, set PITTFF0 to twice the value you calculate.'

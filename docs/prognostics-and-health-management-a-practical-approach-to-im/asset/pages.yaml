  md: 'In a two-dimensional case, the Euclidean distance of vectors $(x_c, y_c)$ and
    $(x_i, y_i)$ is the following:


    $$D_i = \sqrt{(x_c - x_i)^2 + (y_c - y_i)^2}\tag{2.26}$$


    The Euclidean distance is based on the Pythagorean theorem. If the dimension is
    larger than two, say $n$, then similarly


    $$D_i = \sqrt{\sum_{j=1}^{n} (x_c^{(j)} - x_i^{(j)})^2}\tag{2.27}$$


    where the components of vector $\boldsymbol{x}_c$ are $x_c^{(j)}$ and those of
    vector $\boldsymbol{x}_i$ are $x_i^{(j)}$.


    # Kernel Density Estimation


    This method is based on the following equation:


    $$p(x) = \frac{1}{Nh} \sum_{i=1}^{N} K\left(\frac{x - x_i}{h}\right)\tag{2.28}$$


    which can be interpreted as follows (Wand and Jones 1995). Let $x_1, x_2, ...,
    x_N$ be the sample elements. A kernel function $K(x)$ is selected that is nonnegative
    and that has an integral of one (like the properties of any PDF). A parameter
    $h > 0$ is also chosen, which is called the bandwidth. Then Eq. (2.28) gives an
    estimate of the PDF, from which the sample is generated, at point $x$. Table 2.6
    gives a collection of commonly used kernel functions.


    # Chi-Square Test


    The chi-square test (Ross 1987) is used to test whether a given sample comes from
    a population with a specific distribution, and therefore it does not provide the
    distribution; it can only be used to check whether a user-selected distribution
    is appropriate.


    Table 2.6 Kernel functions.


    | Kernel | $K(x)$ | Domain |

    |---|---|---|

    | Uniform | $\frac{1}{2}$ | $(-1, 1)$ |

    | Triangle | $1 - |x|$ | $(-1, 1)$ |

    | Epanechnikov | $\frac{3}{4}(1 - x^2)$ | $(-1, 1)$ |

    | Quartic | $\frac{15}{16}(1 - x^2)^2$ | $(-1, 1)$ |

    | Triweight | $\frac{35}{32}(1 - x^2)^3$ | $(-1, 1)$ |

    | Gaussian | $\frac{1}{\sqrt{2\pi}} e^{-\frac{x^2}{2}}$ | $(-\infty, \infty)$
    |

    | Cosinus | $\frac{\pi}{4} \cos\left(\frac{\pi}{2} x\right)$ | $(-1, 1)$ |'

    # Minimum Mean Square Error


    Minimum mean square error is mainly used in fitting function forms with unknown
    parameters. For example, a density histogram is obtained from a sample with points
    (t₁, f₁), (t₂, f₂), ..., (t_N, f_N), and it is known that the corresponding PDF
    is f(t|θ). The least square estimate of θ is obtained by minimizing the overall
    squared error:


    ```

    Q = Σ_{i=1}^N [f(t_i|θ) - f_i]^2 (2.22)

    ```


    # Example 2.9


    Assume that f(t|θ) = θ e^{-θ t}; then


    ```

    Q = Σ_{i=1}^N (θ e^{-θ t_i} - f_i)^2 (2.23)

    ```


    The first-order condition can be written as


    ```

    ∂Q/∂θ = 2 Σ_{i=1}^N (θ e^{-θ t_i} - f_i)(e^{-θ t_i} - θ² e^{-θ t_i}) = 0

    ```


    which is a nonlinear equation and can be solved by standard methods.'

- pgno: 92
  md: '# 2


    # Approaches for Prognosis and Health Management/Monitoring (PHM)


    # 2.1 Introduction to Approaches for Prognosis and Health Management/Monitoring
    (PHM)


    You learned in Chapter 1 that the purpose of prognostics is to be able to accurately
    detect and report a future failure in systems – to predict failure progression.
    Prognostic approaches in prognostics and health management/monitoring (PHM) to
    accomplish that purpose can be grouped into broad categories: classical, usage-based,
    and condition-based (Hofmeister et al. 2017; Pecht 2008; Kumar and Pecht 2010;
    O’Connor and Kleyner 2012; Sheppard and Wilmering 2009). Classical prognostic
    approaches can be categorized as model-based, data-driven, or hybrid-driven, as
    shown in Figure 2.1.


    # 2.1.1 Model-Based Prognostic Approaches


    Model-based prognostic approaches include the modeling and use of expressions
    related to reliability, probability, and physics of failure (PoF) models. Such
    models are used to study and compare, for example, the relationships of materials,
    manufacturing, and utilization of the reliability, robustness, and strength of
    a product, often in structured, designed, controlled experiments and life tests.
    Such modeling offers potentially good accuracy, but it is difficult to apply and
    use in complex, fielded systems (Speaks 2005). Those models include distributions
    and probability models; fundamentals of reliability theory; and models based on
    reliability testing, such as acceleration factors (AFs), presented in Chapter
    1. Other methods will be discussed later.


    # 2.1.2 Data-Driven Prognostic Approaches


    Data-driven prognostic approaches include statistical and machine learning (ML)
    methods; are generally simpler to apply, compared to model-based prognostic approaches;
    but can produce less precision and less accuracy in prognostic estimations. Statistical
    methods include both parametric and nonparametric models, such as those shown
    in (Ross 1987) and (Hollander et al. 2014); and K-nearest neighbor (KNN), a nonparametric
    method for classification or regression of an object with respect to its neighbors
    (Medjaher and Zerhouni 2013). Machine learning includes examples such as linear
    discriminant analysis (LDA) to characterize or separate multiple objects, hidden
    Markov modeling (HMM) to model a system having hidden states, and principal component
    analysis (PCA) to convert observations into linearly uncorrelated variables.'
  merge: -1
  img_proc: true

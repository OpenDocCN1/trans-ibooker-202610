- pgno: 64
  md: '![](img/05efaadbca64ad00f9e8d44c1db8cc7b_64_0.png)


    **Figure 1.18** Taxonomy of prognostic approaches.


    prognostic target; and also suppose that the time to replace and/or repair prognostic
    targets in a PHM-enabled system is less than the time to replace and/or repair
    unexpected outages. In such a PHM-enabled system, the effective MTBF of the system
    is increased, and therefore the reliability of the system is also increased. In
    addition to increasing the reliability of the system, PHM reduces the cost of
    maintaining the system because the operating lives of the prognostic targets are
    increased and because it is generally less expensive, in both time and materials,
    to handle planned versus unexpected outages.


    Any number of traditional modeling approaches lend themselves as base platforms
    for PHM-enabling systems that can be classified as model-based prognostics, data-driven
    prognostics, or hybrid-driven prognostics (see Figure 1.18). Model-based approaches
    often offer potentially greater precision and accuracy in prognostic estimations,
    which can be difficult to apply in complex systems. Data-driven approaches are
    simpler to apply but can produce less precision and less accuracy in prognostic
    estimations. Hybrid-driven approaches offer a high degree of precision and accuracy
    and are applicable to complex systems, including on-vehicle and off-vehicle, taking
    advantage of both approaches (Pecht 2008; Medjaher and Zerhouni 2013).


    In Chapter 2, we will return to these concepts and approaches in more detail.


    # 1.6.3  Degradation Progression Signature (DPS) and Prognostics


    A CBM system, such as that presented in this book, uses a CBD approach. As a prognostic
    target in a system progresses from a state of no damage (zero degradation) to
    a state of damage (degraded) and then to a failed state, one or more signals at
    one or more nodes in the system will change. Such signal changes can be sensed,
    measured, collected, and processed by a PHM system to produce highly accurate
    prognostic information for use in fault and/or health management. As an example,
    suppose a power supply in a system becomes damaged, and the ripple voltage of
    the output changes and increases as the amount of damage (accumulated degradation)
    in the power supply increases. Further, suppose the amplitude of the ripple voltage
    can be sensed, measured, and collected by a sensor framework in a PHM system.
    The collection of CBD amplitudes forms an FFP signature, such as that shown in
    Figure 1.19.


    Clearly the FFP curve is not smooth, due to the effects of measurement uncertainty
    and noise. Now suppose a feature-vector framework in that PHM system consists
    of data-conditioning algorithms that filter, smooth, fuse, and transform CBD-based
    FFP signatures into DPS data: a transfer curve. An ideal DPS has a constant steady-state
    value in the absence of degradation; it linearly increases in correlation to the
    level of degradation; and it reaches a maximum amplitude when the level of degradation
    is at its maximum: physical failure occurs. For this example, such an ideal DPS
    is shown as the line with positive slope in Figure 1.20; also shown are the points
    at which the onset of degradation occurs and when physical failure occurs.'

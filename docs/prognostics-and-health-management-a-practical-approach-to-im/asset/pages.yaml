  md: '# Wiley Series in Quality & Reliability Engineering


    Dr. Andre Kleyner


    Series Editor


    The Wiley Series in Quality & Reliability Engineering aims to provide a solid
    educational foundation for both practitioners and researchers in the Q&R field
    and to expand the reader''s knowledge base to include the latest developments
    in this field. The series will provide a lasting and positive contribution to
    the teaching and practice of engineering.


    The series coverage will contain, but is not exclusive to,


    +   - Statistical methods

    +   - Physics of failure

    +   - Reliability modeling

    +   - Functional safety

    +   - Six-sigma methods

    +   - Lead-free electronics

    +   - Warranty analysis/management


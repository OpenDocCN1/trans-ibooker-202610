    # 6.9 System Verification and Performance Metrics


    An important aspect of system verification for a PHM system is exemplified by
    the following: how accurate are the prognostic estimates? Important considerations
    for answering that question include the following (Celaya et al. 2010; Hofmeister
    et al. 2013, 2016, 2017, 2018a,b):


    +   - Time when degradation is detected, compared to the true time of the onset
    of degradation. An offset type of error is unavoidable because of, for example,
    noise, discrete intervals between the times samples are taken, measurement uncertainty,
    data smoothing (which tends to move a signature downward and leftward), and rounding
    and loss of precision as data is fused and transformed from data types and domains
    to other data types and domains.

    +   - Time when functional failure is detected compared to the true time of functional
    failure. An offset type of error is unavoidable, for the same reasons as for detection
    errors.

    +   - Time when all subsequent RUL estimates are within a specified accuracy (α).
    A useful figure of merit is named convergence efficiency (χ).

    +   - Time when all subsequent prognostic horizon (PH) estimates are within a
    specified accuracy (α). PH is defined as the relative time of a sample with respect
    to when degradation was detected plus the RUL estimate (see Figure 6.70).


    Table 6.1 lists base acronyms and terminology used to measure and calculate performance
    metrics related to prognostics.


    # 6.9.1 Offset Types of Errors


    The magnitude of offset errors is primarily dependent on how well you have conditioned
    the data, especially with respect to eliminating and mitigating noise.


    ![](img/05efaadbca64ad00f9e8d44c1db8cc7b_317_0.png)


    Figure 6.70 Illustration and relationship of PH to BD, sample time, RUL, and EOL.'
  merge: -1

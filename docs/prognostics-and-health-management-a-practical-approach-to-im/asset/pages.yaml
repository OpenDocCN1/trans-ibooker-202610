  md: '# Convergence Efficiency


    Suppose the prediction program you use in your PHM system employs a Kalman-like
    algorithm coupled with a random-walk algorithm that treats a data point as a particle
    that has weight and momentum (a data point tends to keep moving at a given velocity
    and direction). Then, for example, one prediction program might converge from
    an initial amplitude error at a rate of 20% per data point and another at 10%.


    # Example 6.4 You have, by design, chosen a PITTFF0 value that you believe is
    likely to be 50% higher than an expected fastest failing time. Assume the input
    to a prediction algorithm is close to being ideal. As part of an evaluation of
    your design, you create a table that lists the expected number of data points
    that need to be processed to converge to within 25%, 10%, and 5% accuracy. When
    asked, the supplier of your prediction program, ARULEAV, asserts that the program
    corrects initial offset errors at a convergence of about 20% per data point. More
    important, the supplier asserts that convergence is also dependent on the noise
    and the degree of nonlinearity in the input signature. So you decide to evaluate
    the performance of your design using a prediction program that converges at 20%
    correction per data point versus another that converges at 10% per data point.
    This evaluation is summarized in Table 6.3, which lists the variation in number
    of data points and time-to-converge for two prediction programs. The range is
    rather large – from 11 hours to 264 hours in the example.


    # 6.9.4 Performance Metrics


    Refer to Figure 6.77 to relate prognostic distance (PD) and another performance
    metric called PH convergence to the FFS input and the RUL and PH output.


    # Prognostic Distance


    PD is the period of time between when degradation begins and when functional failure
    occurs. You can define a performance metric called PD figure of merit ($PD_{FOM}$),
    as follows:


    ```

    $PD_{FOM} = (PD/PD_{MAX}) = (EOL - BD_{DETECTED})/(EOL - BD)$

    ```


    From the definition of $BD_{OFFSET}$, $BD_{DETECTED} = BD_{OFFSET} + BD$, so that


    ```

    $PD_{FOM} = (EOL - BD - BD_{OFFSET})/(EOL - BD) = (1 - BD_{OFFSET}/(EOL - BD))$

    ```


    # Table 6.3 SMPS example: table of number of data points and times to converge
    to α.


    |  |  | Initial error = 50% |  |  |  |  |  |

    |---|---|---|---|---|---|---|---|

    |  |  | α = 25% |  | α = 10% |  | α = 5% |  |

    |  |  | # Points | Time | # Points | Time | # Points | Time |

    | Program 1 20% | TS = 12 h | 4 | 48 h | 8 | 96 h | 11 | 132 h |

    |  | TS = 1 h | 4 | 4 h | 8 | 8 h | 11 | 11 h |

    | Program 2 10% | TS = 12 h | 7 | 84 h | 16 | 192 h | 22 | 264 h |

    |  | TS = 1 h | 7 | 7 h | 16 | 16 h | 22 | 22 h |'

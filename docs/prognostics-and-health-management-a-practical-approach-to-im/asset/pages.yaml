  md: 'that forms leading indicators of failure, which, after suitable signal conditioning,
    are transformed into FD in signatures for use as input to prediction algorithms.


    **Example 3.1** Suppose you have been asked to prognostic-enable an SMPS used
    by a customer for two different applications: a high-end application with conservative
    failure requirements and a low-end application with less stringent failure requirements.
    You decide to select the resonant frequency of a damped-ringing response (example
    presented in Chapter 2) as your leading indicator of failure: (i) loss of filtering
    capacitor is the predominant failure mode; (ii) therefore as the power supply
    degrades due to that loss, the resonant frequency increases; and (iii) changes
    in resonant frequency are less dependent on load changes compared to, for example,
    changes in amplitude of ripple voltage.


    Starting with Eq. (2.49) and letting C₀ represent the value of an undamaged capacitor,


    $$\omega \approx \omega_0\sqrt{\frac{C_0}{C_0-\Delta C}}$$


    where frequency in Hz is given by


    $$f=\omega/2\pi=FD \tag{3.4}$$


    then the signal model becomes


    $$FD=FD_0\sqrt{\frac{C_0}{C_0-\Delta C}} \tag{3.5}$$


    where a scalar value of frequency, FD, is returned by an intelligent sensor attached
    to the output node of the SMPS. Then from Eqs. (3.2) and (3.5),


    $$FD=FD_0\sqrt{\frac{C_0}{C_0-\Delta C}}=CBD-N \tag{3.6}$$



    # 2.2.7 Multiple Modes of Failure: Failure Rate and FIT


    When prognostic targets are prone to more than one dominant failure mode, multiple
    distribution models and/or multiple-parameter models must be used in a PoF approach.
    For example, a transistor device could fail because of temperature cycling and
    also because of failure related to high levels of voltage. Two distribution models
    might then apply: Arrhenius temperature, Eq. (2.7); and Kemeny distribution, Eq.
    (2.8). A simplifying approach is to assume that all failures are random and all
    failure modes are equally dominant. Overall MTTF and failure in time (FIT) values
    can be calculated by applying a sum-of-failure-rate model and an improved AF to
    account for two different temperatures, use and test, as shown in Eq. (2.9). One
    FIT is equal to one failure in 1 billion part hours (White and Bernstein 2008):


    ```

    Failure rate = λ = (number of failures) / ((number of tested parts)(hours of test)
    AF) 10^9 FIT (2.15)

    ```


    # 2.2.8 Advantages and Disadvantages of Model-Based Prognostics


    Advantages of model-based prognostics are many and include the following: (i)
    such modeling leads to a better understanding of how prognostic targets, especially
    devices, fail because of defects and weaknesses in manufacturing processes and
    materials, and how and why they fail because of loading and environmental stresses
    and strain; (ii) manufacturing processes, materials, electrical and physical designs,
    and control of operational loading and environmental conditions can be improved
    to increase reliability; and (iii) simple estimates of state of health (SoH) and
    remaining useful life (RUL) are possible.


    Disadvantages of model-based prognostics are also many and include the following:
    (i) modeling for other than single-mode failures is complex; (ii) simple models
    for'

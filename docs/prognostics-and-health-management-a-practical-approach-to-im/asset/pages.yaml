- pgno: 218
  md: '# 5


    # Non-Ideal Data: Effects and Conditioning


    # 5.1 Introduction to Non-Ideal Data: Effects and Conditioning


    Condition-based data (CBD) contains feature data (FD) that forms signatures that
    are highly correlated to failure, damage, and degradation – especially fatigue
    damage due to the cumulative effects of stresses and strains induced by temperature,
    voltage, current, shock, vibration, and so on. Those signatures form curves that
    are not ideal, such as that shown in Figure 5.1; instead, CBD-based signatures
    contain noise, they are distorted, and they change in response to that noise.
    That non-ideality, when fault-to-failure progression (FFP) signatures are transformed
    into degradation progression signatures (DPS) and then into functional failure
    signatures (FFS), results in a non-ideal transfer curve and errors in prognostic
    information. Those errors include the following: (i) an offset error between the
    time when degradation begins and the time of detection of the onset of degradation;
    and (ii) nonlinearity errors that reduce the accuracy of estimates of remaining
    useful life (RUL), state of health (SoH), and prognostic horizon (PH) – or end
    of life (EOL).


    # 5.1.1 Review of Chapter 4


    Chapter 4 presented a set of seven signature models that resulted in FFP signatures
    having ideal, characteristic curves, such as those plotted on the top of Figure
    5.2. Those ideal signatures were transformed into ideal DPS transfer curves of
    straight lines starting at an origin of 0 amplitude and passing through another
    data point having an amplitude of 1, such as those plotted on the bottom of Figure
    5.2. Two signatures are shown on the top of Figure 5.3: a curvilinear FFP signature
    and its transform into a linear DPS. That DPS was transformed into the FFS shown
    on the bottom of Figure 5.3; that FFS is a transfer curve that is very amenable
    to processing by a prediction system to produce prognostic information.


    # 5.1.2 Data Acquisition, Manipulation, and Transformation


    In this chapter, we continue an offline phase of developing models and methods:
    those oriented toward addressing nonlinearity effects due to noise. We use examples
    and descriptions to illustrate commonly encountered causes and effects of noise
    on the quality of data and on the nonlinearity of the final transfer curve – an
    FFS – of a sensing system. We present methods you might use to mitigate and/or
    ameliorate nonlinearity'
  merge: -1
  img_proc: true

- pgno: 99
  md: '![](img/05efaadbca64ad00f9e8d44c1db8cc7b_99_0.png)


    # Figure 2.6 Transition diagram.


    in the discrete time case; therefore, the rate of change in the probabilities
    P_i(t) can be given. Figure 2.6 shows the diagram of the possible state transitions,
    where the rate of transitions is also given next to the arrows. It is assumed
    that at each time, only one broken part can go through repairs. Four differential
    equations can describe the process; and, similar to the discrete case, P_i(t)
    is the probability that the machine is in state i at time t.


    In computing the rate of change P''_1(t) for state 1, we see that it can change
    four different ways: part 2 breaks down, part 1 breaks down, part 2 is repaired
    from state 2, or part 1 is repaired from state 3. The first two cases decrease
    the value of P_1(t), and the other two cases increase its value:


    ```

    P''_1(t) = μP_2(t) + μP_3(t) - 2λP_1(t)

    ```


    Similarly,


    ```

    P''_2(t) = λP_1(t) + μP_4(t) - μP_2(t) - λP_2(t)

    P''_3(t) = λP_1(t) + μP_4(t) - μP_3(t) - λP_3(t)

    P''_4(t) = λP_2(t) + λP_3(t) - 2μP_4(t)

    ```


    This is a system of linear differential equations that can be solved by simple
    algorithms using any known software packages, such as Mathematica (Yakowitz and

  md: '# 1.3.2 Cumulative Damage Models


    Finally, we briefly discuss the cumulative damage relationship, where first the
    inverse power law is assumed. Let V(t) denote the time-varying stress; then the
    life-stress relationship is


    ```

    L(V(t)) = (A / V(t))^n  (1.60)

    ```


    where A = K^{-1/n} in comparison to Eq. (1.55).


    # Exponential Failure Distribution


    If the TTF distribution is exponential, then m(t, V) = L(V(t)). Defining


    ```

    I(t, V) = ∫₀ᵗ (V(τ)/A)^n dτ  (1.61)

    ```


    as the cumulative damage, the reliability function becomes e^{-I(t,V)} and therefore
    the PDF has the form


    ```

    f(t, V) = (V(t)/A)^n e^{-I(t,V)}  (1.62)

    ```


    # Weibull Failure Distribution


    If the TTF distribution is Weibull, then the reliability function is e^{-(I(t,V))^β},
    where I(t, V) is given by Eq. (1.61), and the corresponding PDF becomes


    ```

    f(t, V) = β (V(t)/A)^n (I(t, V))^{β-1} e^{-(I(t,V))^β}  (1.63)

    ```


    # Exponential Failure Distribution and Arrhenius Life Stress


    Assume next that the Arrhenius life stress model Eq. (1.47) is used. If the TTF
    is exponentially distributed, then similar to Eq. (1.61), we have


    ```

    I(t, V) = ∫₀ᵗ (1/C) e^{-B / V(τ)} dτ  (1.64)

    ```


    and the associated PDF becomes


    ```

    f(t, V) = (1/C e^{-B / V(t)}) e^{-I(t,V)}  (1.65)

    ```


    # Weibull Failure Distribution and Arrhenius Life Stress


    If the TTF distribution is Weibull, then analogous to earlier cases η(t, V) =
    L(t, V), and therefore similar to Eq. (1.62) we get the associated PDF:


    ```

    f(t, V) = β (1/C e^{-B / V(t)}) (I(t, V))^{β-1} e^{-(I(t,V))^β}  (1.66)

    ```


    # 1.3.3 General Exponential Models


    Next, we show the case of a general exponential relationship,


    ```

    L(V(t)) = C e^{B V(t)}  (1.67)

    ```


    in which case


    ```

    I(t, V) = ∫₀ᵗ (1/C) e^{-B V(τ)} dτ  (1.68)

    ```'

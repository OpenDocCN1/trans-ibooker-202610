    # 1.6.5 Non-ideal FFS and Prognostics


    In practice, it generally is not possible to obtain ideal FFS transfer curves.
    Instead, the curves will be noisy and distorted, and will exhibit changes associated
    with changes in the degradation rate – similar to what is shown in Figure 1.27.
    Small perturbations may be due to measurement uncertainty and have no relationship
    or significance with respect to the actual SoH and/or RUL of a prognostic object:
    in such cases, prediction algorithms should employ methods to filter or otherwise
    mitigate these variations. On the other hand, an FFS change might be caused by
    a real, significant change in the rate of accumulated damage in a prognostic target:
    in such cases, prediction algorithms should employ methods to recognize and take
    into account these changes in degradation rates, which should modify the estimates
    of SoH and RUL. Mitigation of and accounting for both causes of signal variability
    are competing objectives in the design of prediction algorithms: in practice,
    to design of prediction algorithms that satisfy both objectives, the algorithms
    need to incorporate appropriate design compromises. In subsequent chapters of
    this book, you will see examples of how FFS variabilities are successfully handled.



    # 2.1.3  Hybrid Prognostic Approaches


    Hybrid approaches employ both model-driven and data-driven approaches to further
    improve the accuracy of and/or to better understand the relationships of parameters
    and objects (Medjaher and Zerhouni 2013). Drawbacks are increased computational
    processing and complexity (see Figure 2.2). We will return to these and other
    methods later in this chapter.


    # 2.1.4  Chapter Objectives


    The objectives of this chapter are to present classical methodologies to support
    prognostics for PHM and then to present an approach to condition-based maintenance
    (CBM) for PHM: an approach based on CBD signatures that lays the foundation for
    Chapter 3.


    # 2.1.5  Chapter Organization


    The remainder of this chapter is organized to present and discuss classical approaches
    to modeling to support prognostics for PHM and to introduce our approach to CBM:


    2.2 Model-Based Prognostics


    This section presents approaches to model-based prognostics, including topics
    on analytical modeling, distribution modeling, PoF and reliability modeling, acceleration'

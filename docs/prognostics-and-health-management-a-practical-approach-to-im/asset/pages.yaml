- pgno: 149
  md: '# Disadvantage of FFP-Based FFS Data


    A disadvantage of FFP-based FFS data is that the signature is generally curvilinear:
    it has the same characteristic curve as the original CBD signature.


    Example 3.7 Referring to Figure 3.12, when you transform FFP signatures using
    FL = 0.6 and FL = 0.7, you obtain the plotted results shown. The plots demonstrate
    that the signatures have been correctly transformed: although the failure amplitude
    is the same (100%), the time of failure for the left-hand plot occurs at time
    ~ 215 days, and the time of failure for the right-hand plot occurs at time ~ 230
    days.


    # 3.2.4 Transforming FFP into a Degradation Progression Signature (DPS)


    The existence of a DPS that is a transform of an FFP signature has been asserted:
    now we present a general definition and a derivation of a particular FFP. We will
    also explain and demonstrate why a DPS approach to prognostic enabling for PHM
    is extremely advantageous compared to other CBD-based approaches, including FFP
    and FFS for FFP signatures. Further, we have already explained and demonstrated
    that CBD-based approaches are advantageous compared to classical model-driven,
    data-driven, and hybrid-driven approaches to prognostic enabling for PHM.


    # Definition of a DPS


    A DPS is a function of a change in value of a parameter of interest, dP:


    +   - When there is no degradation, the value of the parameter is unchanged and
    dP = 0.

    +   - As degradation progresses, the magnitude of dP increases.


    DPS_i = dP_i / P_0 (3.12)

    DPS = { DPS_m, DPS_{m+1}, … DPS_{m+n-1}, DPS_{m+n} } (3.13)


    Then defining dP_i to be an absolute value, dP_i = abs(dP_i), a particular DPS
    point becomes


    DPS_i = abs(dP_i) / P_0 (3.14)


    # Derivation of a DPS Model for an Exemplary FFP Signature


    A derivation of a DPS model begins with the general model for a point in an FFP
    signature, Eq. (3.8),


    FFP_i = (FD_i - FD_0) / FD_0


    to which we apply a model for an FD of interest, such as that for resonant frequency
    of a damped-ringing response of an SMPS, Eq. (3.5):


    FD_i = FD_0 ( sqrt( C_0 / (C_0 - ΔC_i) ) )


    Let P_0 = C_0 and dP_i = ΔC. Then


    FD_i = FD_0 ( sqrt( P_0 / (P_0 - dP_i) ) )


    so that sqrt( P_0 / (P_0 - dP_i) ) = FD_i / FD_0 → P_0 / (P_0 - dP_i) = (FD_i
    / FD_0)^2'

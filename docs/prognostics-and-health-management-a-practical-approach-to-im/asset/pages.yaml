    # CBD: Feature Data and Degradation Function


    From the results of deriving Eq. (2.49), we use the inductive approach to analytical
    modeling to state the following:


    +   - Given a feature, FD, that has a nominal value FD₀ in the absence of degradation,
    then

    +   - Given a degradation of a parameter that has a value of P₀ in the absence
    of degradation, and

    +   - Let dP represent the amount of change in the value of P₀ caused by degradation,

    +   - Then the value of a given feature is the non-degraded value of the feature
    times a degradation function of a parameter that changes.


    In Eq. (2.49), if we let FD = ω, FD₀ = ω₀, P₀ = C₀ and dP = ΔC we have


    ```

    FD = FD₀ (1/√(1 − dP/P₀))

    ```


    and, in general,


    ```

    FD = FD₀ f(dP, P₀) (2.50)

    ```


    The model for a given degradation function, f(dP, P₀), depends on, for example,
    the component that is degrading, the failure mode, and the PoF. This is an important
    result, and more information is presented in following chapters of this book.'

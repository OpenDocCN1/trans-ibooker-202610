    # 1.5 Expected Number of Failures


    The expected number of failures in a given time period $[0,t]$ is an important
    characteristic of the reliable operation of an object, which may be an element,
    a unit, a block, or even an entire system. Clearly, this expectation depends on
    the way we react to failures. Three cases will be discussed in this section: minimal
    repair, partial repair, and failure replacement. We will also include lengths
    of time needed to perform repairs or replacements.


    The material in this section is based on renewal theory, the fundamentals of which
    can be found, for example, in Cox (1970) and Ross (1996).


    # 1.5.1 Minimal Repair


    Consider first the case of minimal repairs, where each repair requires $T$ time
    when the object is not operational. Let $S_1$ denote the time of the first failure,
    $M(t)$ the expected number of failures in the interval $[0,t]$, and $X_t$ the
    actual number of failures in this interval. Then


    $\displaystyle M(t)=E(X_t)=E_{S_1}\big(E(X_t\mid S_1)\big)$ (1.78)


    where


    $\displaystyle E(X_t\mid S_1)=\begin{cases}0&\text{if }t<S_1\\1&\text{if }S_1<t<S_1+T\\1+M(t-T)-M(S_1)&\text{if
    }t>S_1+T\end{cases}$ (1.79)


    Therefore


    $\displaystyle M(t)=\int_0^{t-T}\big(1+M(t-T)-M(s)\big)f(s)\,ds+\int_{t-T}^{t}f(s)\,ds$'

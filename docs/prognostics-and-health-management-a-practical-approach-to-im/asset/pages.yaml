- pgno: 223
  md: 'of the output filter is reduced as degradation proceeds. The purposes include
    the following: (i) illustrate nonlinearity errors related to noise; (ii) identify,
    list, explain, and demonstrate some of the more common causes and effects leading
    to nonlinearity errors; and (iii) present and show methodologies that ameliorate
    and/or mitigate non-ideality and/or the effects of non-ideality.


    # 5.1.4 Chapter Organization


    The remainder of this chapter is organized to present and discuss topics related
    to the cause and effect of non-ideality in signatures that result in nonlinearity
    errors. We present and discuss various methods and techniques to ameliorate and
    mitigate those effects:


    5.2 Heuristic-Based Approach Applied to Non-Ideal CBD Signatures

    This section summarizes a heuristic-based approach for application to CBD signatures
    through the use of examples. Noise is identified as an issue in achieving high
    accuracy in prognostic information.


    5.3 Errors and Non-Ideality in FFS Data

    This section presents and discusses topics related to nonlinearity, such as noise
    margin and offset error; measurement error, uncertainty, and sampling; other sources
    of noise; and data smoothing and non-ideality in FFS data.


    5.4 Heuristic Method for Adjusting FFS Data

    This section describes a method for adjusting FFS data, adjusted FFS data, and
    data-conditioning another example data set.


    5.5 Summary: Non-Ideal Data, Effects, and Conditioning

    This section summarizes the material presented in this chapter.


    # 5.2 Heuristic-Based Approach Applied to Non-Ideal CBD Signatures


    CBD signatures are not ideal: they contain offset errors, distortion, and noise
    – including signal variations due to, for example, feedback effects and multiple
    failure-mode effects. Included in this chapter are methods for mitigating and/or
    ameliorating such non-ideality. Other errors are introduced in the processing
    of CBD signatures and the transformation of those signatures into FFS used as
    input to a prediction system.


    Even if CBD was totally absent of noise and variability not related to degradation,
    attaching a sensor to a node to collect data and then processing that data introduces
    error into the data. Sensors may perform noise filtering or data sampling, or
    act as analog-to-digital data converters (ADCs), and digitized data is processed
    using digital signal processing (DSP) methods and techniques to include additional
    filtering, data fusion, data and domain transforms, data storage, and data transmission,
    all of which introduce errors into the data. Operational and environmental variability,
    such as voltage and temperature variability, are also sources of signal variability
    that result in non-ideal data (Texas Instruments 1995; Jenq and Qiong 2002; Hofmeister
    et al. 2013, 2016, 2017).'

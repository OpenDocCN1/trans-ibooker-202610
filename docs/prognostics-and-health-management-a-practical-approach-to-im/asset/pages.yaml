    | Power function #8 | $1 - (1 + dP_i/P_0)^n$ | $(1 + dP_i/P_0)^n - 1$ |

    | Power function #10 | $(1 - dP_i/P_0)^n - 1$ | $1 - (1 - dP_i/P_0)^n$ |

    | Exponential function #12 | $1 - \exp(dP_i/P_0)$ | $\exp(dP_i/P_0) - 1$ |

    | Exponential function #14 | $\exp(-dP_i/P_0) - 1$ | $1 - \exp(-dP_i/P_0)$ |


    # Example 4.2


    Suppose you have a decreasing FFP signature, and further suppose you determine
    the signature is modeled by Eq. (4.10). Use Eq. (4.23) to transform that signature
    into an increasing signature that is modeled by Eq. (4.9):


    ```

    -f(dP_i, P_0) = -[-(dP_i/P_0)^n] = (dP_i/P_0)^n

    ```


    Using the method of Example 4.2, you can convert all of the decreasing signatures

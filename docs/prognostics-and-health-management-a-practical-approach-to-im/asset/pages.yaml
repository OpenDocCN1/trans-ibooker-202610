    # 4.3.3 Converting Decreasing Signatures to Increasing Signatures


    The following degradation-signature models produce decreasing signatures:


    | Power function #2, Eq. (4.10): | f(dP_i, P_0) = -(dP_i/P_0)^n |

    | Power function #4, Eq. (4.12): | f(dP_i, P_0) = 1 - [1/(1 - dP_i/P_0)]^n |


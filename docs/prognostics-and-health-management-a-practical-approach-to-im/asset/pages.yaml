    In Eqs. (2.30) and (2.32) the coefficients wᵢⱼ and w̄ᵢⱼ are the unknowns, and
    their values are determined so that the resulting input/output relation


    ```

    g(yⱼ) = w̄₁ⱼ Σᵢ₌₁³ w₁ᵢ f(xᵢ) + w̄₂ⱼ Σᵢ₌₁³ wᵢ₂ f(xᵢ)

    ```


    has the best fit to the measured input and output data.


    Assume that we have N input-output data sets:


    ```

    (x₁⁽ᵏ⁾, x₂⁽ᵏ⁾, x₃⁽ᵏ⁾, y₁⁽ᵏ⁾, y₂⁽ᵏ⁾, y₃⁽ᵏ⁾)          (k = 1, 2, …, N)

    ```


    then similar to the least squares method, the overall fit is minimal as measured
    by


    ```

    Q = Σₖ₌₁ᴺ [ g(yⱼ⁽ᵏ⁾) − w̄₁ⱼ Σᵢ₌₁³ w₁ᵢ f(xᵢ⁽ᵏ⁾) − w̄₂ⱼ Σᵢ₌₁³ wᵢ₂ f(xᵢ⁽ᵏ⁾) ]²


    (2.33)

    ```


    where the unknowns are the wᵢⱼ and w̄ᵢⱼ values. The optimization can be done by
    using software packages or by using special neural network algorithms like back
    propagation.


    In practical cases, the structure (number of hidden layers and number of nodes
    on them) of the neural network is selected, and the weights wᵢⱼ and w̄ᵢⱼ are determined.


    For the optimization, usually only half of the data set is used; the other half
    is then used for validation, when Q is computed based on data that was not used
    in determining the weights. If Q is sufficiently small, then the structure and
    weights of the network are accepted; otherwise, a new structure (with new added
    hidden layers and/or added nodes) is chosen, and the procedure is repeated. The
    optimal choice of the weights is usually called the training of the network.


    # Support Vector Machines


    Support vector machines (Cortes and Vapnik 1995) can be described for the case
    of two groups of vectors. Assume there are N training data points (x₁, y₁), …,
    (x_N, y_N), where y_i = +1 or −1, indicating the class the vectors x_i belong
    to. The objective is to find a maximum-margin hyperplane that divides the set
    of data points (x_i, y_i) into two groups. In one, y_i = +1; and in the other,
    y_i = −1. The hyperplane is selected so the distance between the hyperplane and
    the closest point from either group is maximized. If the training vectors are
    heavily separable, then there is a vector w such that the hyperplane w^T x + b
    = 0 satisfies the following property:


    ```

    w^T x_i + b ≥ 1  if y_i = 1


    w^T x_i + b ≤ −1  if y_i = −1

    ```


    These relations can be summarized as


    ```

    y_i (w^T x_i + b) ≥ 1 for all i = 1, 2, …, N


    (2.34)

    ```'

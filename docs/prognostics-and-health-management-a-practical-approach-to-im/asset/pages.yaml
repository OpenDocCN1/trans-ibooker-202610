    # 1.7.1 Non-ideality: Initial-Estimate Error and Remaining Useful Life (RUL)


    A major cause of non-ideality in prognostic information is the difference between
    an estimated TTF of a prognostic target defined by a reliability engineer (an
    initial RUL estimate) and the actual TTF between the onset of degradation and
    functional failure. It is extremely unlikely that estimated initial TTF values
    will exactly equal actual TTF values, and therefore there will be initial-estimate
    errors. For example, in Figures 1.28 and 1.29, the defined TTF value is 200 days
    and is exactly equal to the true TTF value at functional failure. But suppose
    a reliability engineer had estimated the TTF after the onset of degradation to
    be 300 days. In that case, when degradation is detected, the estimated RUL will
    be 300 days, and the actual TTF will be 200 days – an initial error of 100 days,
    as shown in Figure 1.30.'

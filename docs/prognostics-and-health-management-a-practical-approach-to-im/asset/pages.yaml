    # 6.1.6 Chapter Objectives


    The methods presented in the previous chapters provide a solid foundation for
    designing and developing individual prognostic solutions. This chapter illustrates
    important aspects and considerations in the design and development of a robust
    prototype of an exemplary PHM system; this information is presented as though
    you are the lead designer of such a PHM system.


    Although single-node PHM solutions are useful in investigating, characterizing,
    developing, and demonstrating single- or limited-sensing system solutions of simple,
    limited capability, they are impractical in a real, complex system with multiple
    nodes, different types of sensors, single and multivariate signal processing,
    and varying sample rates at different sampling frequencies. And for prognostics,
    system solutions need a robust architecture of frameworks, control and data flow,
    and memory, to do the following: (i) sufficiently remember the past – what has
    previously transpired at each node; (ii) sense the present – collect measurement
    data from each node; (iii) process the present and combine it with the past to
    project the future – produce and act on prediction information for each node.
    A very important consideration is that a PHM system is not going to run forever:
    it will be intentionally and unintentionally paused'
  merge: -1
  img_proc: true

  md: '# Principal Component Analysis


    PCA (Jolliffe 2002) is a statistical method. Assume there are N vectors, which
    are usually closely related to each other. This technique uses a linear transformation
    to convert the observation set into a collection of linearly uncorrected variables
    called the principal components. The method is mathematically based on ideas of
    matrix analysis.


    # Independent Component Analysis


    Independent component analysis (Stone 2004) is a procedure that finds underlying
    factors or components from multivariate or multidimensional data. Let the observation
    of random variables be denoted by x₁(t), x₂(t), ..., x_N(t). The method finds
    a matrix M and variables y_j(t) such that


    y = Mx (2.38)


    where the components of y and x are y_j and x_i, respectively.

    The objective is to find the minimal number of independent components y_j.


    # HMM-Based and SVN-Based Approaches


    The HMM-based approach (Ghahramani 2001) and the support-vector network SVN based
    approach (Cortes and Vapnik 1995) are both often used in unsupervised ML.


    # Particle Filtering


    Particle filtering (Andrieu and Doucet 2002) is a sequential Monte Carlo method
    based on a large sample. The estimate of the PDF converges to the true value as
    the number of sample elements tends to infinity.


    # Hierarchical Classifier


    The KNN process is very close to a well-known clustering algorithm sometimes called
    the hierarchical classifier (Alpaydin 2004). Assume that we have N vectors and
    want to organize them into k clusters where the distances between the vectors
    of the same cluster need to be as small as possible. At the initial step, each
    vector is a one-element cluster. At each subsequent step, the number of clusters
    decreases by one until the required number of clusters is reached. Each cluster
    is represented by the algebraic average of its elements, and then the distances
    of these average vectors are determined. The two closest averages are selected,
    and their clusters are merged. In this way, we will have one less cluster in each
    step.


    # Fuzzy C-Means Classifier


    The fuzzy C-means classifier approach (Bezdek et al. 1999) allows each piece of
    data to belong to two or more clusters. Let x₁, ..., x_N be the data set, and
    let u_ij denote the degree of membership of data vector x_i in cluster j (j =
    1, 2, ..., K). The membership values are determined by using an iterative procedure
    as follows:


    +   Step 1: Select an initial set of u_ij values, u_ij(0).

    +   Step 2: At each later step k, compute the center vectors for each cluster
    as


    c_j = ( Σ_{i=1}^N u_{ij(k)}^m x_i ) / ( Σ_{i=1}^N u_{ij(k)}^m )'

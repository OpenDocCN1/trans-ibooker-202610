    \nand Eq. (1.124) becomes\n\n$$\\frac{c_p}{T+T_p}R(T)+\\int_0^T\\frac{c_f}{t+T_f}f(t)\\\
    ,dt \\tag{1.128}$$\n\nThese simple models do not take any additional elements\
    \ into account: the cost of repairs of repairable failures, revenues generated\
    \ by the product made by the machine, the salvage value after replacement, the\
    \ optimal timing of the arrival of the spare parts, as well as the length of time\
    \ required to perform repairs and the replacement. For the development of more\
    \ advanced models, we introduce the following notations:\n\n+   $c_r$ = Cost of\
    \ each repair  \n+   $M(T)$ = Expected number of repairable failures in interval\
    \ $[0,T]$  \n+   $u(T)$ = Generated revenue in interval $[0,T]$  \n+   $S(T)$\
    \ = Salvage value of the equipment after lifetime $T$  \n+   $\\alpha$ = Unit\
    \ inventory cost of spare part  \n+   $\\beta$ = Unit loss of production delay\n\
    \nA new decision variable must be also included:\n\n$W$ = Arrival schedule of\
    \ spare part\n\nFor the sake of mathematical simplicity, we introduce the following\
    \ function. If the equipment must be scheduled to be replaced at time $t$ and\
    \ the spare part arrives at time $W$, then the additional cost is\n\n$$\\gamma(t,W)=\\\
    begin{cases}(t-W)\\alpha & \\text{if } t\\ge W \\\\(W-t)\\beta & \\text{if } t<W\\\
    end{cases}$$\n\nIn the first case, an inventory cost occurs; and in the second\
    \ case, a production delay causes losses to the company.\n\nIf long-term expected\
    \ costs are considered, then Eq. (1.124) is generalized as\n\n$$\\frac{(c_rM(T)+c_p-S(T)-u(T)+\\\

    # 7.4.1  Bathtub Curve: MTBF and MTTF


    As you can see in Figure 7.16, MTBF (between failures) is not a time-axis value:
    it is a failure-rate value. Neither MTTF nor MTBF is seen in a typical view of
    a bathtub curve, perhaps because of the relationship suggested in Figure 7.17
    (Seastrunk 2016).



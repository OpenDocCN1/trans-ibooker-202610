  md: 'If maintenance is carried out at predetermined time intervals without checking
    the condition of the item, we are referring to predetermined maintenance. If the
    item is regularly monitored, condition-based maintenance can be performed. This
    can result in either improving the item without changing its required function;
    or in modifying it, if the required function of the item is altered. If failure
    is detected, then after the fault is diagnosed, it is corrected. And finally,
    the operation of the item is checked out to be sure the repair was done correctly
    and successfully.


    In this section, some mathematical models for optimal maintenance scheduling will
    be introduced.


    # Predetermined Maintenance


    First, we introduce a model for scheduling predetermined maintenance actions.
    Consider a piece of equipment that is subject to preventive maintenance actions,
    which are performed in a uniform time grid. Between maintenance actions, only
    minimal repairs are performed, in cases of failure. Let h denote the length of
    time between consecutive maintenance actions. Without maintenance, let F(t), f(t),
    R(t), and ρ(t) denote the CDF, PDF, reliability function, and failure rate of
    time to non-repairable failure.


    In addition to the value of h, two other decision variables can be introduced.
    One characterizes the level of maintenance, so as a result of each maintenance
    action the effective age of the equipment decreases by u, where 0 < u < h. It
    must also be determined how long the equipment is scheduled to operate, which
    can be represented by a positive integer n showing that when the nᵗʰ maintenance
    is due, the equipment is replaced. So, maintenance actions are performed at times
    h, 2h, ..., (n−1)h, and the equipment is replaced at time nh. For k = 1, 2, ...,
    n, let Fₖ(t), fₖ(t), and ρₖ(t) denote the CDF, PDF, and failure rate of the equipment
    in interval [(k−1)h, kh]. Then clearly


    Fₖ(t) = F(t − (k − 1)u), fₖ(t) = f(t − (k − 1)u) and ρₖ(t) = ρ(t − (k − 1)u)      (1.107)


    Before the model of cost minimization is developed, an important constraint must
    be presented. The reliability of the equipment must not go below a user-selected
    threshold r₀:


    Rₙ(nh) = 1 − Fₙ(nh) = 1 − F(nh − (n − 1)u) ≥ r₀      (1.108)


    implying that


    nh − (n − 1)u ≤ F⁻¹(1 − r₀)      (1.109)


    For example, in the case of a Weibull distribution, Eq. (1.108) can be written
    as


    e^{−((nh−(n−1)u)/η)^β} ≥ r₀


    By taking the logarithm on both sides we get


    ( (nh − (n − 1)u)/η )^β ≤ −ln(r₀)


    or


    nh − (n − 1)u ≤ η{−ln(r₀)}^{1/β}      (1.110)


    which is a linear constraint.'

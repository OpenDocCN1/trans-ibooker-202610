  md: '# 2.6 Approaches to PHM: Summary


    This chapter presented an overview of traditional approaches to PHM including
    model-based prognostics, data-driven prognostics, and hybrid-driven prognostics.
    Model-based prognostics is potentially the most accurate, but it is the most difficult
    to apply to complex systems; data-driven prognostics is the least difficult to
    apply, but also is the least accurate; and hybrid-driven prognostics provides
    the greatest accuracy and is the most difficult to apply, especially to complex
    systems. A brief presentation of a CBD approach to CBM concluded the chapter:
    the output of an SMPS; identification and selection of a useful FD (resonant frequency)
    extracted from a damped-ringing response from CBD; the effect of prognostic requirements
    on operational requirements and accuracy of prognostic information; and a test
    bed and simulation to assist in and verify modeling of a CBD signature. An important
    result is Eq. (2.50), which relates changes in signatures to a degradation function:


    ```

    FD = FD₀ f(dP, P₀)

    ```


    The next chapter develops and describes in more detail the approach and introduces
    the methods used to transform CBD signatures into signatures that are more amenable
    to be processed by prediction algorithms.



- pgno: 73
  md: '# 1.7.2 Convergence of RUL Estimates Given an Initial Estimate Error


    It is desirable to design prediction algorithms that (i) mitigate FFS variability
    not caused by degradation and (ii) respond to FFS variability caused by degradation.
    A design approach is to treat FFS data points as particles having inertia and
    momentum. Particles do not exhibit rapid changes; instead, they tend to maintain
    velocity and direction. A satisfactory design objective is to employ a dampening
    factor for changes in amplitude and velocity. Another design approach is to develop
    a random-walk solution for particles that progress from a zero-degradation state
    (lower-left corner) to a maximum-degradation state (upper-right corner) — a solution
    that employs Kalman-like filtering (Hamilton 1994; Bucy and Joseph 2005): (i)
    use the previous data point of an FFS model; (ii) calculate the predicted location
    of the next data point; (iii) adapt the FFS model to an adjusted location between
    the predicted and the actual location of the next data point; (iv) use dampening
    factors and coefficients to adjust the FFS model; (v) use the adapted FFS model
    to estimate when functional failure is likely to occur; and (vi) calculate prognostic
    information such as RUL, SoH, and PH.


    **Example 1.18** Figure 1.31 is an example of such a solution applied to an initial-estimate
    error. In addition to a high-value initial-estimate error, a reliability engineer
    might specify a TTF value that is low compared to that for a prognostic target.
    Suppose for a prognostic target a reliability engineer specifies 100 days as the
    estimated TTF after the onset of degradation, and the target actually takes 200
    days to become functionally failed: a random-walk with Kalman-like solution will
    resemble that shown in Figure 1.32.


    ![](img/05efaadbca64ad00f9e8d44c1db8cc7b_73_0.png)


    **Figure 1.31** Random-walk with Kalman-like filtering solution for a high-value
    initial-estimate error.'
  merge: -1

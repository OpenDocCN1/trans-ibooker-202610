- pgno: 321
  md: '# 6.9.2 Uncertainty in Determining Prognostic Distance


    There is an unavoidable error in determining PD because of the following (see
    Figure 6.73): (i) noise, especially in the output of a sensor; (ii) data conditioning,
    especially data smoothing; (iii) NM; and (vi) sampling, especially the sampling
    period.


    Ideally, the sensor system in your PHM system would be absent all noise – no thermal
    noise, no harmonic distortion such as hum, no power-supply-switching noise, no
    coupling of signals, and no discretization and rounding errors between analog-to-digital
    and digital-to-analog conversions. But that is not going to be the case. Therefore,
    it becomes impossible for your PHM system to detect the exact time when degradation
    begins (true BD): you need to estimate BD.


    Ideally, your PHM system would sample your sensor data at the onset of degradation
    – but that is not going to happen except by chance – even if you use an unreasonable
    sampling period (such as microseconds). Again, you need to estimate BD.


    Ideally, the magnitude of the noise in your sampled data would be sufficiently
    low that you would not have to employ noise mitigation, such as data conditioning
    using a rolling average method, or the use of a noise margin (NM). Data conditioning
    employing noise mitigation results in shifting of the transfer curve (the FFS
    curves in Figure 6.73) of your sensing system, which comprises everything between
    the sensed node and the input to your prediction program, downward and to the
    left, which leads to offset type of errors.


    Assuming you do not want to continue to use a degraded prognostic target until
    it actually fails, the best your PHM system can do is to estimate a future time
    when functional failure is likely to occur. The prediction programs you are using
    – DXARULE and ARULEAV – do just that: the PH outputs are estimates of the time
    between an estimated BD and when functional failure is likely to occur.


    ![](img/05efaadbca64ad00f9e8d44c1db8cc7b_321_0.png)


    Figure 6.73 Uncertainty: prognostic distance.'
  merge: -1
  img_proc: true

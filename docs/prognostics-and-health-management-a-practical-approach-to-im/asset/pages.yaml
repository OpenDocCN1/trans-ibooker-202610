    needed to calculate the RUL of the system. The second phase comprises the use
    of models and thresholds to detect the onset of faults, assess the state of SoH
    of the system, and predict future SoH and RUL. The models are verified and fitted
    to data from life-based and stress-based experiments and tests intended to mimic
    real-use conditions. Sensors are then developed and used to collect data from
    fielded systems to monitor and manage the health of those systems (Medjaher and
    Zerhouni 2013).


    An advantage of the hybrid approach is a relative precision that is higher than
    that achieved by using only a model-based approach and higher than that achieved
    by using only a data-driven approach (Figure 2.15). This is especially true when
    a PoF-based model is adapted to sensor data and the adapted model is used to produce
    prognostic information. A disadvantage is the added complexity of adapting the

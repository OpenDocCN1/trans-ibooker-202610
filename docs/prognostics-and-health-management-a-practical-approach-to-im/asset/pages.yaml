  md: 'extreme conditions, to estimate failure times: based on the data, distributions
    of TTFs can be estimated under normal conditions. This idea is known as accelerated
    testing (AT), ALT, and so on.


    Reliability projections, such as MTTF based on accelerated testing (such as a
    HALT) when the object is subject to extreme stress, are projected estimates from
    test results to a future, slower rate of failure at lower levels of stress under
    normal use conditions. Such projections assume the use of a correct model for
    life distribution and the use of a correct acceleration model (Tobias 2003; Nelson
    2004). In an acceleration model, the TTF (or t_F) at a stress level (s) is given
    by the following (Kentved and Schmidt 2012):


    t_F = A G(s) (2.5)


    where A = constant, G(s) = stress function.


    The acceleration factor (AF) is the ratio of the TTFs at two different levels
    of stress:


    AF = t_F1 / t_F2 = G(s1) / G(s2) (2.6)


    AFs used in reliability estimations (or usage modeling) include the following
    (White and Bernstein 2008).


    # Arrhenius Law for Temperature


    AFs used in reliability estimations (or usage modeling) include the following
    (White and Bernstein 2008):


    AF_T = exp[ (E_a / k) (1/T_use - 1/T_test) ] (2.7)


    where


    | T_use = | Product temperature in service use |

    | T_test = | Product temperature in laboratory test |

    | E_a = | Activation energy for damage mechanism and material |

    | k = | Bolzman''s constant = 8.617 * 10^-5 eV/°K |


    # Kemeny Law for Voltage


    AF_T = exp[ C_0 - E_a / (k T_j) ] exp[ C_1 ( V_cb / V_cbmax ) ] (2.8)


    where in addition


    | C_0, C_1 = | Material constants |

    | T_j = | Junction temperature |

    | V_cb = | Collector-base voltage |

    | V_cbmax = | Maximum collector-base voltage before breakdown |


    # Peck''s Law for Temperature and Humidity


    AF_TM = ( M_use / M_test )^-n exp[ (E_a / k) (1/T_use - 1/T_test) ] (2.9)'

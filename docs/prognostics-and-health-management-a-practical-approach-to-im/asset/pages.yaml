- pgno: 231
  md: '# 5.3 Errors and Non-Ideality in FFS Data


    In this section, we present topics related to noise: its sources and effects,
    and methods to ameliorate and/or mitigate errors and noise in FFS data. Noise,
    in the context of this book, is any unwanted signal or measurement that is not
    related to degradation: a specific failure mode or increasing level of damage.
    The topics presented include but are not limited to the following:


    +   - Noise margin and offset error

    +   - Measurement error, uncertainty, and sampling

    +   - Operating and environmental variability

    +   - Nonlinear degradation

    +   - Multiple modes of degradation


    Most errors and noise in FFS data are the result of noise in the original signal
    at monitored nodes. Some errors and noise are introduced by hardware, firmware,
    and software used to acquire, manipulate, and store and retrieve data; other errors
    and noise are introduced by the solutions employed to ameliorate and/or mitigate
    noise and the effects of noise (Stiernberg 2008; Vijayaraghavan et al. (2008).


    It should be understood that due to expense, in terms of both time and money,
    it is not possible to ameliorate all forms of noise. In addition to expense, there
    are operational limitations: often, if not invariably, ameliorating noise results
    in an increase in the weight of the solution(s) and an increase in the power to
    drive the solution(s). Therefore, mitigation methodologies are often used when,
    for whatever reason, amelioration methodologies are deemed too expensive and noise
    is evaluated as being unacceptably high.


    A most important consideration is the following: it is not necessary to eliminate
    and/or mitigate all sources and effects of noise. Instead, eliminate, reduce,
    and/or mitigate appropriate and sufficient sources and effects of noise to meet
    the accuracy requirements related to the prognostic target.


    The topics presented in this section include commonly encountered sources of variability
    that contribute to noise, such as the following:


    +   - Variability due to quantization error and other errors related to digitization.

    +   - Variability due to measurement errors related to sampling.

    +   - Variability due to the operating and ambient environments, including switching
    effects (spikes, glitches, and notches) and environmental effects (temperature,
    pressure, airflow, and so on).


    We could, but will not, devote this entire book to noise and errors that ultimately
    result in noise, the sources of noise, and actions to address issues due to noise.
    Instead, we shall focus on noise that results in accuracy issues you are likely
    to encounter.


    # 5.3.1 Noise Margin and Offset Errors


    A commonly used mitigation method is an NM, such as that in Eq. (5.1), but using
    an NM or other mitigation method often introduces other errors. A primary error
    related to NM is an offset error in detecting the time of the onset of degradation:


    OFFSET_E = t_DETECT − t_ONSET (5.5)'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'This can be expressed as a percentage error related to estimated prognostic
    distance,


    $$OFFSET_{PDE}=100(OFFSET_E/PD_{EST})$$


    $$PD_{EST}=TTF_{EST}=t_{FF}-t_{DETECT}$$


    where $t_{FF}$ is the time when functional failure is detected, and $t_{DETECT}$
    is when degradation is detected


    $$PD_{MAXIMUM}=TTF_{TRUE}=t_{EOL}-t_{ONSET}$$


    where $t_{EOL}$ is the true end of life or time of functional failure, and $t_{ONSET}$
    is the true time of the onset of detection. The error in prognostic distance is
    given by


    $$PD_E=PD_{MAXIMUM}-PD_{EST}$$


    **Example 5.4**  Using the data and results of Examples 5.2 and 5.3, calculate
    the offset and PD errors introduced by the NM value used in Example 5.3. From
    the data and from Eq. (5.8),


    $$PD_{MAXIMUM}=t_{EOL}-t_{ONSET}=253-98=155\ \text{hours}$$


    After the NM is used, the estimated PD and error are calculated using Eqs. (5.7)
    and (5.9)


    $$PD_{EST}=t_{FF}-t_{DETECT}=253.75-102.5=151.25\ \text{hours}$$


    $$PD_E=PD_{MAXIMUM}-PD_{EST}=155-151.25=3.75\ \text{hours}$$


    resulting in a 2.5% error. The offset error is calculated using Eqs. (5.5) and
    (5.6):


    $$OFFSET_E=t_{DETECT}-t_{ONSET}=103.75-98.0=5.75\ \text{hours}$$


    $$OFFSET_{PDE}=100(OFFSET_E/TTF_{TRUE})=100(5.75/155)=3.7\%$$


    An important objective in achieving high accuracy and reliability in prognostic
    information is to reduce NM to the smallest value necessary to reliably prevent
    false detection of degradation and, at the same time, reduce the level of introduced
    errors. Invariably, to do so, you need to consider other methods to ameliorate
    and/or mitigate noise and its effects, and that means you must be aware of commonly
    encountered sources of noise and effects introduced by the sensing system and
    the pros and cons of solutions you might consider employing in the sensing system.
    The system being monitored is not subject to being improved by the sensing or
    prediction systems of a PHM system.


    # 5.3.2  Measurement Error, Uncertainty, and Sampling


    Measurement error, uncertainty, and sampling involve the monitoring, acquisition,
    manipulation, and storage and retrieval of data at points where noise and the
    effects of noise can be amplified and/or injected into signals. You need to take
    this into consideration when designing, developing, and evaluating a sensing system.


    We shall use two cases as examples: one is a sensor that samples a signal at a
    node, digitizes the voltage, performs DSP to extract FD, transforms the FD value
    from a digital value to a scalar value, and then transmits that value to a hub
    for collection and processing as a data point in a signature; the second is a
    resistive-temperature detector'
  merge: -1
  img_proc: true
- pgno: 233
  md: '(RTD) type of sensor across which a known voltage is applied and from which
    the current flowing through the temperature-sensitive element can be measured,
    digitized, and converted to a scalar value that is used as a table-lookup input
    to extract a temperature value (ITS 1990). Both cases are replete with data-acquisition
    and -manipulation points of processing for noise to be injected, amplified, and/or
    transformed:


    +   - Variability due to power sources, the operating environment, and degradation

    +   - Quantization and other errors introduced by data converters

    +   - Transformation errors due to simplifying of expressions

    +   - Delays in time between measurements

    +   - Inappropriate sampling rates

    +   - ADC: input range and sampling rate

    +   - Other sources of noise


    # Variability Due to Power Sources, the Operating Environment, and Degradation


    A major source of noise is the power used in a system: energy sources such as
    voltage and current supplies, generators, and so on. The output of such sources
    is not constant: their outputs vary due to variability in their inputs and because
    of loading effects at their output nodes; they vary in response to their environment,
    such as temperature, humidity, altitude, and pressure; and they vary in response
    to degradation within the sources themselves. That variability often results in
    noise: signal variations that are not related to a failure/degradation mode of
    interest.


    # Example 5.5


    Suppose, for example, you wish to prognostic enable the coil of a starter relay
    that is known to exhibit a change in resistance as the coil degrades due to stresses
    induced by the high currents required to activate the relay. Due to costs and
    other considerations associated with removal and replacement of the relay to perform
    a direct measurement of resistance, you are limited to measuring the voltage source
    for the relay, the current driving the relay, and the ambient temperature of the
    location of the relay.


    You decide to use data fusion, $R_{RELAY} = V_{RELAY}/I_{RELAY}$, to cancel out
    the effects of variability in the voltage source. But $R_{RELAY}$ is temperature
    dependent – as temperature changes, $R_{RELAY}$ changes. You decide to fuse the
    calculated value of $R_{RELAY}$ with measured temperature data using the following


    ```

    $R_{RELAY} \approx R_0(1 + TC_R T_M) \rightarrow R_0 \approx (V_{RELAY}/I_{RELAY})/(1
    + TC_R T_M)$

    ```


    where $R_0$ is the nondegraded value of the resistance of the relay coil, $TC_R$
    is a temperature coefficient of resistance, and $T_M$ is a measured temperature.
    But the calculated value of $R_0$ is subject to the following variability: $V_{RELAY}$
    is a measurement, $I_{RELAY}$ is a measurement, and $T_M$ is a measurement – and
    measurement uncertainty applies to all three. Further, the resistance-to-temperature
    expression provides only an approximation, and the value of $TC_R$ is not constant
    across the entire range of temperature (ITS 1990). In summary, although the two
    data fusions are significant solutions to reducing noise amplitude in this example,
    it is not possible to eliminate the effects of voltage and temperature variations;
    nor is it possible to totally eliminate measurement uncertainty.


    An effective way to ameliorate the effects of noise due to variations in power
    sources is to take at least one other measurement that exhibits similar noise
    effects due to common sources of noise, and then use differential techniques to
    cancel out that noise. An'

    +   11. Adapt and implement data-conditioning steps, such as those just described,
    to provide a solution in the frameworks of the sensing system of the PHM system.
    The solution includes the sensor and all firmware and/or software computational
    routines necessary to acquire and manipulate CBD signatures used to detect, isolate,
    and identify states related to health of the system; see Figures 1.1 and 1.2 in
    Chapter 1 (Carr and Brown 2000; Hofmeister et al. 2013; CAVE3 2015; IEEE 2017).


    # 5.2.2 Example Target for Prognostic Enabling


    For illustrative purposes, the capacitance of the output filter of an SMPS is
    selected as the prognostic target, and the output ripple voltage is selected as
    the CBD feature to be extracted as a condition indicator and processed as a signature.
    That power supply uses a design incorporating a sufficiently large value of output
    filtering capacitance that the amplitude of the ripple voltage is dependent on
    the resistivity of the load and not on the amount of filtering capacitance. Degradation
    effects that result in the loss of filtering capacitance will cause the amplitude
    of the output ripple voltage to increase (Erickson 1999; Judkins et al. 2007;
    Singh 2014).


    # Acquire Data, Transform It, and Evaluate It Qualitatively


    We begin the process of prognostic-enabling the SMPS by running experiments that
    inject faults and capture data. We verify that degrading the filter capacitance
    results in ripple voltage like that shown in Figure 5.6: the signature is noisy
    and clearly not an ideal curve. The exemplary set data is a derived from actual
    experimental data; additional data points have been added, times were changed
    from minutes (an accelerated test) to hours, and noise amplitudes were changed
    for illustrative purposes. The signature results from a square root (n = 0.5)
    power function #3 type of degradation.


    # Example 5.1 Apply the modeling we have developed to the exemplary data shown
    in Figure 5.6, and comment on the results:


    +   From the shape of the curve, and using Table 4.2 in Chapter 4:



    # Data: Real-Time Acquisition with Batch-Mode Processing


    Acquisition of data from sensors in real time, whether during test or during actual
    operation, requires a design that addresses design points such as the following:
    (i) Will each data point be processed from data acquisition through prediction
    processing in a single series of procedural steps? (ii) Will a number of data
    points be batched and saved for processing at a future time? (iii) In addition
    to, for example, active filtering and analog-to-digital data conversion, will
    other data conditioning be performed in real time (as opposed to, for example,
    near-real-time or batch-mode processing? (iv) Is fusion of multiple-measurement
    data necessary to create a useful feature that can be extracted? If so, what algorithms
    and/or computational routines are required? (v) What transforms, such as time-frequency
    domain or signature-signature, are needed?


    It is not uncommon to acquire and collection data in real time – for example,
    when an aircraft is in flight – and then download the collected data for subsequent
    processing. When the time between when the data was acquired and when the data
    is processed is sufficiently long, such processing is said to be near real time.
    How long is sufficiently long? That is a matter for you and your customer to agree
    on, to avoid issues: for example, even if the time delay was less than one second,
    your customer might assert that was too long and that you need to fix the system
    so the delay is less than 1 millisecond. Another consideration is seemingly incongruous
    differences between node-data times, such as the 3.00 hours at NODE 1 followed
    by the 1.00 hour at NODE 2 shown in Figure 6.27; the decrease in time is because
    the data for NODE 1 was collected after the data for NODE 2.



    \ system to a diagnosis/prognosis system in a PHM system. A first consideration\
    \ is the need to filter out as much noise as possible to meet accuracy requirements,\
    \ where *noise* is defined as any variation in signature data that is not 100%\
    \ correlated to degradation. For example, we have a problem if noise introduces\
    \ a 20% variation in amplitude of the CBD-based data and we are asked to produce\
    \ RUL estimates within 10% accuracy. Other considerations include the following:\
    \ definition of a degradation-signature model that produces a characteristic curve;\
    \ the nominal FD value; matching the characteristic curve of an FFP signature\
    \ to a degradation-signal model; and selecting and using a set of models to transform\
    \ data. The set of models related to a degradation-signal model is used to do\
    \ the following: transform FFP signature data to DPS data, transform FFP-based\
    \ failure levels to DPS-based failure levels, and transform DPS data to FFS data."

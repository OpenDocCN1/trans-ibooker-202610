- pgno: 262
  md: '# 6


    # Design: Robust Prototype of an Exemplary PHM System


    # 6.1   PHM System: Review


    The design and development of a system to support prognostics and health management/monitoring
    (PHM) is complex, and there are many approaches to do so. Even though each such
    system (with the possible exception of demonstrations, test beds, and experiments)
    is unique, there are important design considerations. For example, (i) whether
    to use node-based, assembly-based, or some other architecture to sample and acquire
    data from nodes; (ii) data-handling requirements, such as conditioning, transforming,
    and fusing; (iii) resolution, precision, and accuracy requirements for predicting
    information; and (iv) checkpoint/restart (stop and resume operations). A robust
    PHM system needs to address these issues.


    For illustrative purposes, this chapter is written directly to you, the reader,
    in the role of a lead design engineer of prognostic solutions who has been chosen
    to lead the design and development of a robust prototype PHM system. That system
    is to serve as a proof of feasibility for a customer and as a demonstration of
    the capabilities and expertise you and your team possess. This chapter is based
    on historical and case-study data.


    Before introducing new issues and solutions, we will review all of the previous
    chapters, because you will need to appropriately select, adapt, and apply other
    approaches; a large number (but not all) of these have already been presented
    in this book.


    # 6.1.1   Chapter 1: Introduction to Prognostics


    In Chapter 1, you learned that prognostics involves accurately detecting and reporting
    future failures in systems by detecting degradation (diagnostics) and creating
    information such as state of health (SoH) and remaining useful life (RUL). We
    defined core frameworks for a PHM system: a sensor framework, a feature-vector
    framework; and a prediction framework as shown in Figure 1.1 and repeated here
    in Figure 6.1. The primary focuses of that chapter were the foundation of reliability
    theory, failure distributions under extreme stress, uncertainty measures in parameter
    estimation, system reliability and prognostic health management, and prognostic
    information; we presented over 130 equations dealing with those topics for modeling.


    Section 1.6 included a framework diagram for PHM, repeated in Figure 6.2. Section
    1.7 included two figures that are repeated in Figures 6.3 and 6.4.'
  merge: -1
  img_proc: true

    change in temperature. The temperature is an indirect measurement involving two
    analog-to-digital conversions, a data fusion, and then a table lookup that is
    a form of digitization coupled with a transform from one data type (resistance)
    to another data type (temperature). The effects of noise can be compounded and
    become unacceptably high.


    In cases where you determine that an active data converter, such as an ADC, is
    a major contributor to noise issues that require remediation, you could replace
    that data converter with one that has a higher ENOB and/or less nonlinearity,
    and/or a faster sampling rate, and/or a higher input-frequency range, and so on.
    Again, though, you are invariably faced with higher exploitation costs, more weight,
    and more power input to drive your sensing system.


    When noise issues are traced back to quantization errors because of the use of
    lookup tables, you might consider solving a complex expression—tables often are
    used to replace such processing. Consider, however, the complexity of such solutions:
    for example, lookup tables for platinum-wire RTD applications replace solving
    a complex Callendar-Van Dusen expression (ITS 1990),


    $$R/R_0 = 1 + A\,T + B\,T^2 - C\,(T - 100)T^3$$


    for


    $$-200^\circ\mathrm{C} \leq T \leq 0^\circ\mathrm{C}$$



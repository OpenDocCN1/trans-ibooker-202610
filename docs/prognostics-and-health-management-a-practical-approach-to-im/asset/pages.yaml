    # 7.3.2 Cost Analyses


    # No PHM Approach


    In this scenario, the system runs until a unit fails – a “do nothing until failure
    occurs” approach. When failure occurs, the failed unit is removed and replaced.
    The system is restarted and runs until the next unit fails, and so on, until the
    end of a sustainment period of 14 400 hours (600 days of operation):


    +   - On average, #1 power supplies would fail and be replaced: 14 400/4200 =
    3.4 times:

    +     - Cost = 3.4*10000 + 0*2000 + 3.4*4000 = 47 600


    Repeating this for the remaining five power supplies results in 24 removals and
    replacements because of unexpected outages due to degradation failure, at a baseline
    cost of $336 000.


    # Usage-Based MTTF Approach


    In this scenario, all power supplies are replaced when usage equals 3592 hours
    (MTTF). Examination of the data in Table 7.6 shows that power supplies #3, #4,
    and #6 would functionally fail before they are replaced. In the sustainment period,
    a total of 27 power supplies would be removed and replaced, at a total cost of
    $354 000 – an increase of $18 000 per system during the sustainment period to
    reduce the number of unexpected outages from 24 to 14. However, 52% of all repair
    and removal actions would be attributable to degradation failures. This approach
    fails to meet requirements.


    # Usage-Based 2/3 MTTF Approach


    In this scenario, all power supplies are replaced when usage equals 2395 hours.
    There would be no unexpected outages, but 36 power supplies would be replaced
    at a cost of $432 000 – an increase in cost of $96 000 and a reduction of unexpected
    failures to zero. That $96 000 becomes $96.0 million for a population of 1000
    systems.


    # Damage-Detection Approach


    In this scenario, whenever damage is detected in a power supply, it is removed
    and replaced within 720 hours, which would also, for these supplies, result in
    zero unexpected outages. This approach is seemingly a good one because there would

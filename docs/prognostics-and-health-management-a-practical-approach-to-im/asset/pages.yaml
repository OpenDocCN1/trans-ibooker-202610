  md: '![](img/05efaadbca64ad00f9e8d44c1db8cc7b_138_0.png)


    # Figure 3.2 Functional block diagram for CBD signature data and processing flow.


    # 3.2.1 CBD Signature


    As illustrated in Figure 3.2, a sensor is located at a node of prognostic interest,
    such as the output of a switch mode power supply (SMPS). The sensor is designed
    to capture and process CBD, such as that shown in Figure 3.3, to support the isolation
    and extraction of FD: a leading indicator of failure. Isolation and extraction
    of a particular value of FD, such as the resonant frequency of a damped-ringing
    response of an SMPS to an abrupt change in output load, almost always requires
    signal conditioning. Signal conditioning includes, but is not limited to, the
    following: background noise and harmonic filtering and mitigation; gating of the
    signal to specific, timed events to sufficiently isolate a feature of interest;
    fusing of two or more signals to transform two types of data to another data type
    – such as using voltage and current signals to calculate impedance; domain transforms
    such as time-to-frequency and frequency-to-time; and fusing of signals to cancel
    or mitigate environmental variations such as resistive dependence on temperature.
    Chapter 5 provides more information on signal conditioning.


    A CBD data point in a leading indicator of failure comprises a feature of interest,
    FD, in a signal that changes as degradation progresses, plus all other variations,
    referred to as noise (N), that are not related to degradation and the feature
    of interest:


    ```

    CBD data = FD + N

    (3.2)

    ```


    Signals at nodes within a system typically exhibit more than just a particular
    CBD of interest. An example of signals is shown in Figure 3.4; the node is the
    output of a SMPS, and a particular CBD of interest is a damped-ringing response
    such as that shown in Figure 3.5, for which an idealized plot is shown in Figure
    3.6 (Erickson 1999; Judkins et al. 2007; Judkins and Hofmeister 2007; Hofmeister
    et al. 2013, 2016, 2017).


    The signals shown in Figure 3.4 consist of multiple types of CBD and noise, including
    damped-ringing responses, switching noise from power transistors, ripple voltage,
    pulse-width modulator effects, effects of voltage and current regulation and feedback,'

    # 2.3  Data-Driven Prognostics


    Data-driven (DD) prognostics (Figure 2.12) comprises two major approaches, statistical
    and machine learning (ML), that use acquired data to statistically and probabilistically
    produce prognostic information such as decisions, estimates, and predictions.
    Statistical approaches include parametric and nonparametric methods; ML approaches
    include supervised and unsupervised classification and clustering, and regression
    and ranking (Pecht 2008). This book will not discuss regression and ranking.



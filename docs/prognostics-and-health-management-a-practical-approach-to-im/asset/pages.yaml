    # TEST Data: Saved


    When you operate your prototype PHM system in TEST mode, you need to decide how
    to handle the difference in time between when the data was acquired and when the
    data is processed during a test and demonstration — especially in a multiple-node,
    multiple-degradation test setup. For example, the test data for a first node might
    have been acquired in a relative real clock time of 1.0, 2.0, … hours, whereas
    the test data for a second node might have been acquired in a relative real clock
    time of 20, 40, … minutes. If you employ a simple ring type of polling without
    employing a realistic test clock, then after four sets of samples, your prototype
    PHM system will have processed 8 hours of data in, for example, 4 seconds for
    the first node, and 80 minutes (1.33 hours) of data for the second node. Information
    and alerts issued by your prototype PHM system would be nonsensical: for example
    consider how your customer might react when seeing a third alert following the
    first two alerts in Figure 6.27. Although you might be able to convince the customer
    to accept the seemingly nonsensical times as being an artifact of running the
    prototype PHM system in a TEST mode, we recommend you employ a more robust TEST
    clock — especially were the customer to point out that the test data was derived
    and obtained based on original historical data in which degradation was known
    to be reached in about 50 days, not 2.0 hours.



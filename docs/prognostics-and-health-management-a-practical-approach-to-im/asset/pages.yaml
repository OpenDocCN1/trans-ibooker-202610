    # FFP Signature Data: Benefits Compared to CBD Signature Data


    FFP signatures require less modeling compared to CBD signatures: one model for
    each failure level compared to 20 models (refer back to 3.4). In addition, prediction-algorithm
    processing of FFP signature data compared to that for CBD signature is greatly
    simplified:



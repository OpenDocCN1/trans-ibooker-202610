  md: 'speed, and higher exploitation costs. An alternative is to use a simpler but
    less accurate expression, such as the linear expression used in Example 5.5,


    R/R₀ = 1 + A T


    where A is a temperature coefficient of resistance. There are many excellent sources
    of information on fitting using a linear, quadratic, cubic, or rational polynomial
    function: the Mosaic Industries website, for example, produces documentation on
    calibrating resistance.


    You can also employ interpolation, extraction, and data-smoothing methods and
    techniques to reduce the magnitude of the effects of noise.


    # Measurement Delays


    Measurement of multiple variables, such as voltage and current, are not exactly
    simultaneous: there is a time difference between the acquisition, manipulation,
    and storing of measurement data. In Example 5.5, voltage and current measurements
    were fused to create temperature-dependent values of resistance


    R = V/I


    that were then transformed into temperature-independent values using a linear
    resistance-temperature expression and a measured value of temperature:


    R₀ ≈ (V/I)/(1 + TC_R T_M)


    An experiment was designed and performed using a test bed to simulate degradation
    using large variations in supplied voltage and temperature to evaluate the effectiveness
    of the method described in Example 5.5: example plots of the measurements of temperature,
    voltage, and current are shown Figure 5.12, and the calculated resistances are
    plotted in Figure 5.13. The plot of the temperature-independent resistance values
    becomes more and more noisy as degradation progresses. That noise was subsequently
    attributed to three effects: (i) differences in time between the measurements,
    (ii) conversion errors introduced using the linear expression for relating resistance
    and temperature, and (iii) an amplification effect as the resistance increased.


    Evaluation: (i) attempting to reduce noise by changing the data-acquisition and
    -manipulation methods would be very costly; (ii) such noise does increase measurement
    uncertainty, but the error is usually insignificant; and so (iii) the level of
    inaccuracy is acceptable. Although no changes were required or made, the following
    changes were available: (i) use a higher sampling rate, thereby decreasing the
    time differential between measurements; (ii) use faster computations to also decrease
    the time differential between measurements; and (iii) use parallel rather than
    serial measurements.


    # Sampling Rates


    Sampling is a form of low-pass filtering that has an important relationship with
    respect to resolution and accuracy of a sensing system. In this book, we refer
    to three different sampling rates: the rate at which the system performs signal
    sampling at nodes, the rate at which features are extracted from a node (extraction
    sampling), and the rate at which FD is sampled (data sampling).'

    # 2.3 Data-Driven Prognostics


    This section presents approaches to data-driven prognostics including topics on
    statistical methods and machine learning – classification and clustering.


    # 2.4 Hybrid-Driven Prognostics


    This section presents approaches to hybrid-driven prognostics: model-based combined
    with data-driven prognostics.


    # 2.5 An Approach to Condition-Based Maintenance (CBM)


    This section presents an approach to CBM, including topics on modeling CBD signatures,
    comparing life consumption and PoF, and CBD signature methodologies. An illustration
    of CBD-signature modeling is included.


    # 2.6 Approaches to PHM: Summary


    This section summarizes the material presented in this chapter.


    # 2.2  Model-Based Prognostics


    Model-based approaches use analytical and PoF models. Analytical models include
    usage, statistical, and probabilistic models; and they may be validated by other
    models, such as PoF models and/or reliability-based models. Reliability-based
    models are associated with testing, such as accelerated life tests (ALTs) and
    regression analysis: Pecht favors PoF, in which life-cycle loading and failure
    mechanisms are modeled and applied to assess reliability and evaluate new materials,
    structures, and technologies (Pecht 2008). It should be noted that, in general,
    PoF modeling tends to be computationally prohibitive when applied to systems (Sheppard
    and Wilmering 2009). A simplified approach to model-based prognostics, shown in
    Figure 2.3, includes model development and model use.


    ![](img/05efaadbca64ad00f9e8d44c1db8cc7b_94_0.png)


    **Figure 2.3** Model-based approach to development and use.'

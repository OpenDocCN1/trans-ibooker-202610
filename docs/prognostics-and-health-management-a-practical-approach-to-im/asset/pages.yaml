- pgno: 39
  md: '# 1.2.4 Relationships of Distributions


    There is a strong relation between normal and lognormal, logistic and log-logistic,
    gamma and log-gamma, and Gumbel and log-Gumbel distributions. If X is normal,
    then e^X is lognormal; if X is logistic, then e^X is log-logistic; if X is Gumbel,
    then e^X is log-Gumbel and if X is gamma than e^X is log-gamma.


    The domain of exponential, Weibull, gamma, and lognormal distribution functions
    is the [0, ∞) interval: that is, they are defined for positive arguments. However,
    in the normal case, t can be any real value. If the value of X can only be positive
    and we still want to use a normal distribution, then Eq. (1.20) must be modified:


    ```

    f₊(t) = 1/(A σ √2π) e^(-(t-μ)²/(2σ²))    (1.30)

    ```


    where


    ```

    A = ∫₀^∞ f(t)dt = 1 - F(0) = 1 - φ(-μ/σ) = φ(μ/σ)    (1.31)

    ```


    And, therefore, the corresponding CDF is the following:


    ```

    F₊(t) = ∫₀^t f₊(x)dx = 1/A (F(t) - F(0)) = [φ((t-μ)/σ) - φ(-μ/σ)] / φ(μ/σ)    (1.32)

    ```


    An exponential variable is very seldom used in reliability analysis since it doesn’t
    model degradation or the aging of an object. In order to show this disadvantage,
    consider an object of age T, and find the probability that it will work for an
    additional t units of time. It is a conditional probability:


    ```

    P(X > T + t | X > T) = P(X > T + t)/P(X > T) = R(T + t)/R(T) = e^{-λ(T+t)}/e^{-λT}
    = e^{-λt} = R(t)

    ```


    showing that this probability does not depend on the age T of the object. That
    is, the survival probability remains the same regardless of the age of the object.


    Other important relations between different distribution types can be summarized
    as follows. If β = 1 in a Weibull variable, then it becomes exponential with λ
    = 1/η. Assume next that X₁, X₂, ..., Xₖ are independent exponential variables
    with an identical parameter λ; then their sum X₁ + X₂ + ... + Xₖ is a gamma variable
    with parameters k and θ = 1/λ. Similarly, if X is exponential with parameter λ,
    then X^α is Weibull with parameters β = 1/α and η = 1/λ^α. Normal variables are
    characterized based on the central limit theorem, which asserts the following:
    Let X₁, X₂, ..., X_N, ... be a sequence of independent, identically distributed
    random variables; then their partial sum Σ_{k=1}^N X_k converges to a normal distribution
    as N → ∞.


    # 1.2.5 Failure Rate


    The failure rate (or hazard rate) is defined mathematically as follows:


    ```

    ρ(t) = lim_{Δt→0} P(t < X < t + Δt | t < X) / Δt    (1.33)

    ```'

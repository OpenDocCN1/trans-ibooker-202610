  md: '# Maximum a Posteriori Estimation


    The maximum a posteriori estimation (Stein et al. 2002) is based on Bayesian principles.
    Consider again a PDF $f(t|\theta)$ depending on the unknown parameter $\theta$.
    The likelihood function is given as $L(\theta)$, which is maximized in order to
    get the best estimate for $\theta$. In practical cases, usually its logarithm
    is maximized. Assume now that a prior distribution is known for $\theta$, with
    PDF $g(\theta)$. By the Theorem of Bayes


    $$L(\theta|t_1,\dots,t_N)=\frac{L(\theta)g(\theta)}{\int L(\bar{\theta})g(\bar{\theta})d\bar{\theta}}\tag{2.24}$$


    where the integration domain is the domain of all possible values of $\theta$.
    Since the denominator is independent of $\theta$, we need to optimize only $L(\theta)g(\theta)$.


    # Example 2.10 Assume a normal distribution with parameters $\mu$ and $\sigma^2$,
    where $\sigma^2$ is known and only $\mu$ is unknown. Then


    $$L(\mu)=\prod_{i=1}^{N}\frac{1}{\sigma\sqrt{2\pi}}e^{-\frac{(t_i-\mu)^2}{2\sigma^2}}$$


    From statistics, it is known that the normal distribution is its conjugate prior,
    so we can select


    $$g(\mu)=\frac{1}{\bar{\sigma}\sqrt{2\pi}}e^{-\frac{(\mu-\bar{\mu})^2}{2\bar{\sigma}^2}}$$


    And therefore


    $$L(\mu)g(\mu)=\frac{1}{\bar{\sigma}\sqrt{2\pi}}e^{-\frac{(\mu-\bar{\mu})^2}{2\bar{\sigma}^2}}\prod_{i=1}^{N}\frac{1}{\sigma\sqrt{2\pi}}e^{-\frac{(t_i-\mu)^2}{2\sigma^2}}$$


    which can be maximized. Its logarithm equals


    $$-\ln(\bar{\sigma}\sqrt{2\pi})-\frac{(\mu-\bar{\mu})^2}{2\bar{\sigma}^2}-N\ln(\sigma)-N\ln(\sqrt{2\pi})-\sum_{i=1}^{N}\frac{(t_i-\mu)^2}{2\sigma^2}$$


    This is a concave function in $\mu$, and its derivative has the special form


    $$\frac{-2(\mu-\bar{\mu})}{2\bar{\sigma}^2}+\sum_{i=1}^{N}\frac{2(t_i-\mu)}{2\sigma^2}=\frac{1}{\bar{\sigma}^2\sigma^2}\left\{-\sigma^2(\mu-\bar{\mu})+\bar{\sigma}^2\left(\sum_{i=1}^{N}t_i-N\mu\right)\right\}$$


    giving the solution


    $$\mu=\frac{\sigma^2\bar{\mu}+\bar{\sigma}^2\sum_{i=1}^{N}t_i}{\sigma^2+N\bar{\sigma}^2}\tag{2.25}$$


    # K-Nearest Neighbor Classifier


    The $KNN$ classifier (Cover and Hart 1967) is based on the following simple procedure.
    Assume we have $N$ vectors; each of them is attached with a class label. We need
    to put a given vector into the most appropriate class. We select a positive integer
    $k\ge 1$ and determine the $k$ closest vectors from the given $N$ vectors by using
    any distance measure, such as the Euclidean distance. Then the selected $k$ closest
    vectors “vote” about the class by selecting the class that appears the most times
    among the $k$ closest vectors. In this way, we can order any set of vectors into
    given classes based on a given sample.'

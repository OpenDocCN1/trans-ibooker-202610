    # Evaluation of a Reliability-Modeling Approach


    You happen to know that tantalum oxide capacitors are a high-failure-rate component
    in a SMPS. PoF analysis reveals the following as dominant failure modes caused
    by the aging effects of voltage and temperature: changes in (i) capacitance (C),
    (ii) dissipation factor (DF), and (iii) insulation resistance (IR) (Alan et al.
    2011). Loss of IR includes abrupt, avalanche failures that, for example, occur
    when IR drops sufficiently low to cause a high enough increase in leakage current
    to generate sufficient heat to melt the solder connecting the capacitor to the
    external leads of a package.


    # Example 2.11 For the IR failure mode, the following statistical distribution
    model might be used for MTTF as a function of the operating voltage and temperature
    (Alan et al. 2011; Prokpowicz and Vaskas 1969).


    ```

    MTTF = (C / V^n) exp(E_a / kT)    (2.39)


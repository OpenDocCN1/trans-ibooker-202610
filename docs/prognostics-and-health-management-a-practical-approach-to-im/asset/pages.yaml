  md: 'Using Eq. (3.14) and the results of the examples used to verify modeling, we
    make the following inductive observations regarding the set `{DPS_i}`, regardless
    of the type of an underlying FD model (such as a linear or power function) and
    regardless of how FD changes with respect to time:


    +   - When a parameter `dPi` changes as a linear function with respect to time,
    `{DPS_i}` changes linearly with respect to time.

    +   - When a parameter `dPi` changes as a power function with respect to time,
    `{DPS_i}` changes as a power function with respect to time.

    +   - When a parameter `dPi` changes exponentially with respect to time, `{DPS_i}`
    changes exponentially with respect to time.


    The biggest advantage is the following: `{DPS_i}` is less curvilinear than its
    underlying `{FFP_i}` signature data, and so `{DPS_i}` data is particularly useful
    as input to prediction algorithms for processing to predict a future time of failure
    for a prognostic target.


    # 3.6 Degradation Rate


    In the previous section of this chapter, we saw that an ideal DPS-based FFS is
    a linearly increasing line from 0 or less (no degradation) to 100 or more (functionally
    failed): an ideal DPS-based FFS is a straight line between the 0% and 100% points.
    Even a non-ideal DPS-based FFS was shown to be less curvilinear than its underlying
    FFP signature (refer back to Figure 3.29). The linearity of a DPS-based FFS is
    dependent on the linearity of the rate of change in a degrading parameter, `dD`:
    if the degradation rate with respect to time is constant, the DPS and the DPS-based
    FFS will be linear; otherwise the degree of non-linearity of the DPS and the DPS-based
    FFS is dependent on the degree of nonlinearity in the degradation rate.


    # 3.6.1 Constant Degradation Rate: Linear DPS-Based FFS


    As we have seen, an idealized DPS for a constant degradation rate results in an
    idealized linear DPS-based FFS. And even when a DPS is not ideal, the DPS-based
    FFS is more linear (less curvilinear) compared to the characteristic curve for
    its DPS. The examples and exemplary data we have been using are a result of assuming
    a constant degradation rate such as that modeled as follows:


    $$dP_i = D_0(t_i)^\delta \tag{3.25}$$


    in which `δ = 1.0` for a constant degradation rate and `t_i` equals


    $$t_i = (t_S - t_D) \tag{3.26}$$


    where `t_S` is the time of a sample and `t_D` is the time of the onset of degradation:
    `t_S ≥ t_D`.


    **Example 3.16** Show that the DPS-based signature for our example is always linear
    given a constant degradation rate and nonlinear for a nonconstant degradation
    rate. Using Eqs. (3.25) and (3.12),


    $$DPS_i = dP_i/P_0 = D_0/P_0(t_i)^\delta$$


    so that for `δ = 1`, `DPS_i` is linear and nonlinear otherwise.'

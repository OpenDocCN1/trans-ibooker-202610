    # 5.1.3 Chapter Objectives


    CBD-based signatures are not ideal: instead, they contain noise, they are distorted,
    they contain errors, and so on. Although we may have, for example, an intelligent
    sensor that is robust enough to attach to the output node of an SMPS – to sample
    data; perform Bessel, Butterworth, or Chebyshev filtering; digitize analog data;
    perform digital signal processing; and extract a condition indicator such as the
    amplitude of the ripple voltage (V_R, a type of FD) at the output node of that
    SMPS – we might discover that our signature is so noisy, it cannot be used without
    further signal conditioning.'

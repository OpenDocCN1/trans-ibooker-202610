- pgno: 181
  md: '# 4.2.1 Noise Margin


    To filter out all noise is, for practical purposes, neither technically feasible
    nor cost effective. A next step is to mitigate the effects of unfiltered noise
    by using a NM having a value sufficiently large to unambiguously declare that
    a data value is caused by degradation:


    $FD_i = CBD_i - NM$


    which is Eq. (3.7), and where


    $CBD_i = CBD_{FD} + CBD_m + N_n$  (4.1)


    where $CBD_m$ and $N_n$ represent any unfiltered variations in the data not related
    to the degradation of interest and $CBD_{FD}$ represents data related to the degradation
    of interest, and where the magnitude of NM is defined as the following:


    $NM \ge \max\{CBD_m, NM_n, m, n = 1, 2, ...\}$  (4.2)


    Of course, any NM you use introduces an offset type of error in the prognostic
    information; more detail on that is presented in later chapters.


    # 4.2.2 Definition of a Degradation-Signature Model


    The NM in Eq. (4.2) is used to mitigate unfiltered noise. Ideally, all noise is
    filtered and there is no need for a noise margin ($NM = 0$). Then we can consider
    the more general relation:


    $FD_i = CBD_i - NM = CBD_i = g(FD_0)f(dP_i, P_0) + C_0$


    where, in general, $g(FD_0)$ equals a constant value, and $C_0$ is a constant
    including noise. We then define $f(dP_i, P_0)$ to represent a degradation-signature
    model. From this definition,


    $f(dP_i, P_0) = FD_i/FD_0 - C_1 \quad (C_1 = C_0/FD_0)$  (4.3)


    which is a dimensionless, univariate ratio. Later in this chapter, we shall define
    a set of degradation-signature models and their characteristic signatures.


    # 4.2.3 Feature Data: Nominal Value


    An important step is to determine a nominal value, $FD_0$, to use for $FD_i$ in
    the absence of degradation. One method of determination is to measure and average
    a number of data samples for a sample population of the prognostic target: that
    method introduces sampling variation that, as we saw in Chapter 1, is characterized
    by metrics such as variance and standard deviation. Sampling variation occurs
    because it is not possible to manufacture prognostic targets that have exactly
    the same nondegraded value.


    Yet another method is to use a nominal value specified by the manufacturer/supplier
    of the prognostic target – of course, we then have to account for the specified
    or presumed manufacturing/measurement tolerances. A more dynamic method is to
    use data samples taken from each instance of the prognostic target, save the applicable
    sample average or sample mean, and use that value for $FD_0$.


    These are just some of the methods available: we need to evaluate, select, and
    implement whatever methods are necessary to filter, cancel, or otherwise mitigate
    noise and thus enable us to meet the accuracy and precision requirements for our
    PHM system.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# 4.2.4　Feature Data, Fault-to-Failure Progression Signature,

    and Degradation-Signature Model


    From Eqs. (3.8) and (4.3),


    $$FFP_i = (FD_i - FD_0)/FD_0 = FD_i/FD_0 - 1$$


    $$f(dP_i, P_0) = FD_i/FD_0 - C_1$$


    we relate FFP-signature data to a degradation function as follows:


    $$FFP_i = f(dP_i, P_0) \tag{4.4}$$


    We define a degradation-signature model as a function of $dP_i$ and $P_0$ that
    generates a characteristic curve representative of an FFP signature. We shall
    develop a set of such models; and from those models, we shall develop another
    set of models to transform FFP signature data into DPS data.


    We transform a CBD signature of interest to an FFP signature and match that signature
    to one produced by a known degradation-signature model. Then we use FFP-to-DPS
    transform models to transform FFP signature data into DPS data, which we further
    transform into FFS data that is used as input for diagnosis/prognosis of a PHM
    system.


    # 4.2.5　Approach to Transforming CBD Signatures into FFS Data


    The approach to transforming CBD signatures into FFS data comprises a series of
    transforms and computations that are performed in the sensing system:


    +   - Transform CBD signatures into FFP signatures.

    +   - Transform FFP signatures into DPS data.

    +   - Define an FFP-based threshold level at which functional failure occurs:
    $FL_{FFP}$.

    +   - Calculate the DPS-based threshold level, $FL_{DPS}$, using the $FL_{FFP}$
    value.

    +   - Transform DPS data into FFS data: $FFS_i = 100\ DPS_i/FL_{DPS}$.


    # Transforming CBD Signatures into FFP Signatures


    We use Eq. (3.8) to isolate a feature data of interest (a leading indicator of
    failure) and to determine what level of NM we need to unambiguously detect the
    presence of damage:


    $$FD_i = CBD_i - NM$$


    We use a nominal value of feature data, $FD_0$, and the methodology of Eqs. (4.3)
    and (4.4), and complete the transformation of CBD signatures into FFP signatures:


    $$FFP_i = FD_i/FD_0 - C_1$$


    # Transforming FFP Signature Data into DPS Data


    Match sample data, $FFP_i$, to degradation signatures, $f(dP_i, P_0)$, a set of
    which we shall present. For each degradation signature in that set, we shall develop
    a model to transform FFP signature data into DPS data:


    $$dP_i/P_0 = g(FFP_i) \tag{4.5}$$


    which is the result of using Eq. (4.4), a model for $f(dP_i, P_0)$, and solving
    for $dP_i/P_0$.


    In addition to developing the FFP-to-DPS transform models, $g(FFP_i)$, we shall
    create plots to verify results.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Calculating a DPS-Based Failure Threshold


    An FFS, by definition, defines functional failure as occurring when the value
    of a *FFS*ᵢ data point reaches or exceeds 100%. Therefore, to transform DPS data
    into FFS data, we need to specify a value of DPS data at which functional failure
    occurs. Since an FFP signature is a function of degradation, it is better to use
    an FFP signature to define a failure threshold and then transform that threshold
    value into a value related to DPS data


    $$FL_{FFP} = FFP_i$$ (4.6)


    at a defined level of functional failure. Then from Eq. (4.5), a DPS-based failure
    threshold is the following:


    $$FL_{DPS} = g(FL_{FFP})$$ (4.7)


    We shall use Eqs. (4.5) and (4.6) to develop an $FL_{FFP}$ model for each set
    of characteristic degradation signatures and then develop corresponding models
    to transform each $FL_{FFP}$ model into a DPS-based model: $FL_{DPS}$.


    # Transforming DPS Data into FFS Data


    From Eq. (3.18), to transform DPS data into FFS data,


    $$FFS_{DPS_i} = 100\ DPS_i / FL_{DPS}$$ (4.8)


    This is used as input to the prediction system of the PHM system, one data point
    at a time.


    # 4.3　CBD Modeling: Degradation-Signature Models


    In this section, we shall create degradation-signature models that approximate
    CBD signatures of interest: those caused by actual degradation. Eq. (4.4) defined
    FFP data to be functionally related to the degradation of a parameter:


    $$FFP_i = f(dP_i, P_0)$$


    Each unique $f(dP_i, P_0)$ is a degradation-signature model, which has dimensionless
    values. Examination of CBD signatures of interest reveals the following significant
    characteristics as degradation progresses:


    +   - Degradation signatures either increase or decrease in amplitude as degradation
    progresses.

    +   - Degradation signatures exhibit a decreasing or increasing slope angle² or,
    as appropriate, as vertically asymptotic, or as horizontally asymptotic.

    +   - Degradation signatures can be modeled as power or exponential functions.

    +   - Decreasing degradation signatures can be converted to increasing signatures
    to reduce the number of degradation-signature models required to support prognosis.

    +   - A special case of degradation signature is a straight line: the slope angle
    is constant. In plots, such straight lines are included in plot examples of increasing
    or decreasing slope angles.³


    2　For brevity, especially in plots, “decreasing or increasing angle” is used instead
    of “decreasing or increasing slope angle.”

    3　It is understood that a straight-line signature is a special case.'
  merge: -1
  img_proc: true

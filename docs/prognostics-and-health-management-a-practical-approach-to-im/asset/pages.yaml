    # 1.8 Decisions on Cost and Benefits


    Over the lifetime of any equipment, hard decisions arise regarding the choice
    of the right or best equipment to purchase; selection, inspection, maintenance,
    and repair strategies; and finding the optimal time for preventive replacement
    in order to avoid costly failures that might result in additional damage or accidents.
    This section gives a brief overview of the decision problems and their mathematical
    modeling during different stages of the lifetime of equipment, with some illustrative
    mathematical models.


    # 1.8.1 Product Selection


    There are usually several alternative choices of similar equipment available for
    purchase, and the choice must be based on several criteria. This leads us to use
    multi-objective optimization techniques. (Szidarovszky et al. 1986) give a summary
    of the different concepts and algorithms for solving such problems, so we will
    not give those details; instead, this section of the book will provide an illustrative
    example to provide an idea of their usage.


    **Example 1.20** Consider a company that needs a special machine, and assume there
    are several possible choices. The selection is based on multiple criteria such
    as the price, expected lifetime, maintainability, ability to fix repairable failures,
    and worker convenience when working on the machine. Table 1.2 gives the estimated
    objective values for three alternatives.


    Here, Price and Expected Lifetime are known data. In the absence of concrete data,
    the other three factors are only subjective measures of how good an option is
    and can only be estimated from the experience of firms using the same equipment;
    convenience can be further assessed via a demonstration by the selling company.
    Objectives without hard numerical values are usually characterized by measures
    of how good they are on a 0–100 scale, when 0 means unacceptable and 100 indicates
    the most satisfying alternative.


    Notice that a lower price is better; however, for all other factors, a larger
    value is considered better, since a longer lifetime is preferable and the others
    are satisfaction measures. These objectives cannot be compared as they are given;
    we need to transform them to a unified common measure. The most logical way is
    to transform the price and


    **Table 1.2** Decision table for purchasing a machine.


    |  | Price ($) | Expected lifetime (years) | Maintainability | Repairing repairable
    failures | Convenience |

    |---|---:|---:|---:|---:|---:|

    | Machine 1 | 5000 | 8 | 60 | 50 | 80 |

    | Machine 2 | 5800 | 15 | 70 | 70 | 50 |

    | Machine 3 | 6300 | 20 | 90 | 80 | 60 |'

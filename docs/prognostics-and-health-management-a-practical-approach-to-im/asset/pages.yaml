- pgno: 24
  md: '# Preface


    A prognostics and health management/monitoring (PHM) system can be thought of
    as consisting of three major systems: a sensing system consisting of a sensor
    and a feature vector framework, a prognosis system comprising a prediction framework
    and a performance-validation framework, and a health-management framework. Although
    health management is probably the most complex and most expensive, this book presents
    topics related to sensing systems and prognosis. An important goal of those systems
    is to provide accurate prognostic information regarding the prognosis of the health
    of the system being monitored. This book begins by presenting approaches to reliability
    predictions based on traditional model-driven, data-driven, and hybrid-driven
    approaches as necessary background to understanding the rationale for the signature-driven
    approaches presented later in the book. Those traditional, or handbook, methods
    are evaluated as inaccurate and misleading when used for prognostic estimation
    of a future failure.


    This book then develops approaches to modeling and data handling that take into
    account failure modes and operational environment and conditions, and presents
    an approach using signatures created by extracting leading indicators of failure/condition
    indicators as feature data that forms condition-based data (CBD) signatures; such
    signatures can be normalized and converted into dimensionless ratios called fault-to-failure
    progression (FFP) signatures. FFP signatures form families of characteristic curves,
    and each family of such curves is dependent on the totality of the mechanisms
    of failures causing degradation, resulting in changes in monitored signals.


    A set of degradation signature models is developed, each model representing a
    single mode of degradation, and it is shown how those models can be used to transform
    FFP signatures into degradation-progression signature (DPS) data that can then
    be transformed into functional failure signature (FFS) data that is particularly
    amenable to processing by prediction algorithms. FFS data forms linearized transfer
    curves with values of 0 or less in the absence of degradation and 100 or larger
    when the component, assembly, or system being monitored (a prognostic-enabled
    target) reaches or exceeds a level of degradation such that the prognostic target
    is no longer capable of operating within specifications. When all noise – defined
    as any change in data not due to degradation – is removed from monitored signals,
    an FFP signature can be transformed into DPS data that forms a linear straight-line
    transfer curve, which can be converted into FFS data by defining and using a threshold
    value that defines when functional failure occurs.


    However, since it is not practical to remove all noise, this book also presents
    some useful signal-conditioning techniques to ameliorate and/or mitigate the effects
    of'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'noise, including, but not limited to, the following: data fusion, data transforms,
    domain transforms, filtering, threshold margins, data smoothing, and data trending.
    Those techniques are illustrated using example sets of noisy data, including those
    that exhibit signal variations and changes in the shapes of curves caused by the
    effects of temperature and feedback.


    This book also presents the effects of nonlinear rates of degradation and multiple
    modes of degradation, and methods and techniques for handling those effects. A
    heuristic-based approach to using degradation models and data conditioning is
    presented. It is shown that despite not knowing, for example, the exact value
    of the power for a power-function type of degradation or life value for an exponential-function
    type of degradation, or not knowing that the CBD signature is the result of an
    exponential rate of change in the degradation rate of an underlying power-function
    type of degradation, the FFS data becomes sufficiently linear to result in very
    accurate prognostic information. Insufficient accuracy (errors) of prognostic
    information is caused by and/or due to insufficiency in the sensing system, primarily
    due to two factors: (i) the signal-conditioning and data-handling routines to
    fuse, transform, condition, and process data; and (ii) the use of insufficient
    rates of system sampling and data sampling (inexact modeling). It is asserted
    that, given sufficiently high system-sampling rates and data-sampling rates, the
    accuracy of prognostic information approaches a level limited by the system. System
    limits on prognostic accuracy are due to measurement uncertainty and errors: for
    example, digitization, quantization errors, mathematical rounding, manufacturing
    tolerances, variations in measurement values of environmental effects such as
    temperature and pressure, variations in values due to manufacturing, and so on.
    An often-ignored contributor to prognostic accuracy/inaccuracy is the sampling
    method employed by the sensing system: it does not make sense to require a minimum
    prediction horizon for functional failure of 20 weeks within 10% accuracy and
    a time-of-failure precision of ±1 week from a sensing system that samples a node
    to acquire data once every 2 weeks.


    It is shown that despite the effects of noise-induced nonlinearity of the transfer
    curves, the design and development of prediction algorithms for PHM systems is
    fairly straightforward and not very complex, and easily produces very accurate
    prognostic information such as estimates of remaining useful life (RUL) and state
    of health (SoH). For illustration, the authors use computational prediction algorithms
    incorporated in Adaptive Remaining Useful Life Estimator™ (ARULE™) programs.


    A sensing system should acquire and manipulate CBD to sufficiently ameliorate
    and mitigate all noise using methods and means including sampling, filtering,
    masking, fusing, transforming of data types and domains such as time and frequency,
    smoothing, and so on. The ultimate goal of a sensing system used in a PHM system
    should be that of a transducer that transforms monitored signals into a sufficiently
    linear transfer curve to support producing accurate prognostic information. Prediction
    information should minimally contain the following:


    +   - If the amplitude of the input is at or below a degradation threshold, health
    is 100%.

    +   - If the amplitude of the input is at or above a failure threshold, health
    is 0%.

    +   - Otherwise, the prognostic target is degraded: health is between 0% and 100%.

    +   - RUL estimates: estimated time remaining before end of life (EOL) occurs.

    +   - Prognostic horizon (PH) estimates: current time plus estimated RUL.'
  merge: -1

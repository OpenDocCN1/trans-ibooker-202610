- pgno: 97
  md: 'FMEA first focuses on identifying potential failure modes, based on either
    PoF or earlier experience with the same or similar products. This information
    is used in the design and life-cycle phases of equipment, especially in support
    of diagnostics, maintenance, and prognostics. Effective FMEA is useful in identifying
    candidate signals and nodes to measure and capture leading indicators of failure
    that, when conditioned and collected, form signatures that are valuable for producing
    prognostic information (Hofmeister et al. 2017).


    FMECA is an extension of FMEA that adds a criticality analysis to find the probabilities
    of different failure modes and the consequent severity of those failures. It is
    usually combined with event tree analysis, which is a forward, causal analytical
    technique. It gives the failure routes (responses) and consequences of a single
    failure event on related or higher-level system components. Following the path
    from the initial event, it helps to assess the probability of the outcomes; as
    a result, overall system analysis can be performed (ETA 2017).


    # Analytical Modeling: Deductive Approach


    The *deductive* approach is based on reasoning, using quantitative data, from
    general to specific events. For example, if a system failed, we wish to find out
    which component’s behavior was the cause of the problem. A typical example of
    the deductive approach is the well-known fault tree analysis (FTA). It is similar
    to an event tree, where the direction of the analysis starts at the highest level
    and proceeds to lower levels. Any fault tree is based on primary events that are
    not further developed. A directed graph is constructed, where the primary events
    are the nodes; then an arc or line is placed from an event to another event, if
    failure of the initial node might generate failure in the terminal node. Therefore,
    if a failure occurs in any element of the system, we can move along the graph’s
    tree, backward and forward, and find possible immediate reasons for the failing
    element and the failure mode. Thus we have the information required to know what
    to fix and how to fix it, to eliminate the problem (Thomas 2006; Czichos 2013).


    Fault trees are closely related to Bayesian networks, if at each node failures
    are characterized by probability distributions determined by Bayesian rules from
    those of lower levels (Zhang and Poole 1996). A similar approach is offered by
    using Markov chains, when the degradation has several levels and the transition
    probabilities between the different levels are given, or shown from past observations
    (Ahmed and Wu 2013).


    **Example 2.1** Consider a machine with two parts, both of which are subject to
    random failures. The system has four possible states:


    +   1. Both are in working condition.

    +   2. Part 1 is good; part 2 is broken.

    +   3. Part 1 is broken; part 2 is good.

    +   4. Both parts are broken.


    The following conditional probabilities are assumed to be known:


    $P(\text{part 1 breaks down}\mid\text{part 2 is good}) = P_{11}$


    $P(\text{part 1 breaks down}\mid\text{part 2 is down}) = P_{12}$


    $P(\text{part 2 breaks down}\mid\text{part 1 is good}) = P_{21}$


    $P(\text{part 2 breaks down}\mid\text{part 1 is down}) = P_{22}$'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Assume that no repair is possible and that at most one part can break down
    in a single time period. The transition matrix based on the previous probabilities
    is given as follows:


    ```

    $$T = \begin{pmatrix} 1 - P_{11} - P_{21} & P_{21} & P_{11} & 0 \\ 0 & 1 - P_{12}
    & 0 & P_{12} \\ 0 & 0 & 1 - P_{22} & P_{22} \\ 0 & 0 & 0 & 1 \end{pmatrix}$$

    ```


    The matrix elements give the transition probabilities from each state to all states
    (including itself):


    ```

    $$P(1|1) = P(\text{none of the parts breaks down}) = 1 - P_{11} - P_{21}$$

    ```


    ```

    $$P(2|1) = P(\text{part 2 breaks down|part 1 is good}) = P_{21}$$

    ```


    ```

    $$P(3|1) = P(\text{part 1 breaks down|part 2 is good}) = P_{11}$$

    ```


    ```

    $$P(2|2) = 1 - P_{12}$$

    ```


    ```

    $$P(4|2) = P_{12}$$

    ```


    ```

    $$P(3|3) = 1 - P_{22}$$

    ```


    ```

    $$P(4|3) = P_{22}$$

    ```


    ```

    $$P(4|4) = 1$$

    ```


    All other transition probabilities are equal to zero. Notice that the sum of the
    elements in each row equals unity. In this example, we consider discrete time
    scales. Let $P_i(t)$ denote the probability that at time period $t$, the machine
    is in state $i$. Then by using the Total Probability Theorem (Papoulis 1984),
    we see that


    ```

    $$P_1(t+1) = (1 - P_{11} - P_{21})P_1(t)$$

    ```


    ```

    $$P_2(t+1) = P_{21}P_1(t) + (1 - P_{12})P_2(t)$$

    ```


    ```

    $$P_3(t+1) = P_{11}P_1(t) + (1 - P_{22})P_3(t)$$

    ```


    ```

    $$P_4(t+1) = P_{12}P_2(t) + P_{22}P_3(t) + P_4(t)$$

    ```


    If we introduce the vector $P(t) = (P_1(t), P_2(t), P_3(t), P_4(t))$, then these
    equations can be written in a matrix form:


    ```

    $$P(t+1) = P(t) * T \tag{2.1}$$

    ```


    # Example 2.2 Consider the same machine as before, but under different conditions.
    The time to failure (TTF) distribution of both parts is exponential, with failure
    rate $\lambda$. When any part breaks down, repair starts; its length is also exponential,
    with parameter $\mu$. We consider a continuous time scale, when there is no “next
    time period” as'

    # PH Convergence


    As you have discovered, a very important performance metric, if not the most important,
    is PH convergence to within accuracy α (PHα): all subsequent PH estimates are
    within α percent of the actual PH. PH convergence is primarily due to how the
    prediction algorithms handle perturbations (noise) and nonlinearity in data.


    So, how well did the prediction program, DXARULE, perform? Fortunately, The PHM
    system you designed has a log-file capability: you can write an output log file
    of the prognostic file (see Figure 6.78) to support post-processing of prognostic
    information. The last three entries in the header file are visual aids for analysis
    purposes: the PGALPHA value (10) specified in the NDEF file, the node ID (50),
    and the file name of the output file.


    From the output bus file, you obtain the following measurement values: BD$_{DETECTED}$

    # Levels of Solutions


    A complex PHM system contains devices, components, boards, subassemblies, and
    so on. A sensor is attachable to any node within a system, and therefore health
    solutions that process sensor data can be categorized in accordance with the node
    to which the sensor is attached, as exemplified by the five-level model of health
    solutions shown in Figure 7.2 (Ridgetop 2018).


    # 7.1.3 Critical Systems and Advance Warning


    Critical systems are considered vital to the ongoing operation of everyday life,
    and criticality is a key consideration when evaluating and selecting a node for
    prognostic enabling (a prognostic target). For example, a power system in an aircraft,
    or a gear box in a wind turbine, would be considered critical, since their operation
    is essential to meet design objectives of the overall system. Another example
    of criticality is the safety of life and health: prevention and avoidance of loss
    of life and injury is a primary objective of a system. Fault severity and fault
    propagation also play a role in the definition of systemwide criticality.


    Advance warning, such as an alert, of any impending failure of a mission-critical
    or safety-critical prognostic target is vital: a properly designed PHM system
    will provide detection of anomalies that affect the ability of the system to operate
    within specifications and issue appropriate alerts. For example, Chapter 6 included
    examples of messages and alerts issued by an exemplary prototype PHM system. A
    PHM system will issue alerts (health monitoring) and/or initiate appropriate actions
    (health management) such as soft shutdowns, load shedding, and scheduling maintenance.
    There might also be various levels of alerting where threshold levels and fault
    models can be used to prioritize what information is available to an operator
    of an aircraft, or a seagoing ship, or a machine tool on the manufacturing floor.
    This brings in the notion of fault severity, access to the information, and what
    is done to mitigate an issue that results in an alert.


    # 7.1.4 Reduction in Maintenance


    To save money and resources, maintenance intervals can be optimized based on actual
    evidence of degradation. For example, a system might have components that fail
    after 250 hours of operation, some that fail after about 600 hours, and others
    that fail at about 500 hours. A usage-based PHM system might be designed to do
    one of the following:


    +   1. Schedule repair and/or replace maintenance for all units on or before 200
    hours of operation – a 20% safety margin with respect to failure.

    +   2. Schedule repair and/or replace maintenance for all units on or before 400
    hours of operation.'

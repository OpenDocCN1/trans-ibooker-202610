  md: '![](img/05efaadbca64ad00f9e8d44c1db8cc7b_95_0.png)


    **Figure 2.4** Model-use diagram. Source: based on Medjaher and Zerhouni (2013).


    Model development includes the following: (i) identification, selection, and/or
    development of a model; (ii) simulation and/or experimentation to produce data
    to evaluate and verify the model; and (iii) characterization of the data for subsequent
    data measurement, collection, and inputting into the model to produce prognostic
    information when the model is used. Model use includes the following (see Figure
    2.4): (i) acquire data, (ii) process data, (iii) detect fault(s), (iv) perform
    diagnostics, (v) perform prognostics, (vi) make decisions, and (vii) issue maintenance
    and logistic directives (Medjaher and Zerhouni 2013).


    Referring to Figures 2.4 and 2.5, the functionality of the blocks labeled Data
    Acquisition, Data Processing, Fault Detection, Diagnostic Processing, and Prognostic
    Processing are embodied in the Sensor Framework, the Feature Vector Framework,
    the Prediction Framework, and the Performance Validation Framework. Prognostic
    information is passed to a Fault Management (FM) Framework and/or written to output
    files for deferred decisions and actions related to maintenance, logistics, and
    graphical-user interfaces (CAVE3 2015; Hofmeister et al. 2017).


    # 2.2.1  Analytical Modeling


    Analytical models, also referred to as physical models, employ load parameters
    such as those shown in Table 2.1 to estimate how a particular prognostic target
    in a system changes from a state of 100% healthy (not damaged) to zero health
    (failed) as damage accumulates (Pecht 2008; Hofmeister et al. 2016, 2017; Vichare
    2006; Vichare et al. 2007). The PHM system performs health monitoring, detects
    an unhealthy condition, and uses, for example, fault-tree or state-diagram analysis
    to identify and determine the location(s) of the most likely prognostic target(s)
    causing the fault. Analytical approaches can be divided into two major groups:
    *inductive* and *deductive* approach.


    # Analytical Modeling: Inductive Approach


    The *inductive* approach is based on reasoning, using qualitative data, from individual
    case to general conclusions. For example, such an approach might be used to determine'

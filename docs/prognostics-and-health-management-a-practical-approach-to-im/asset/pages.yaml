  md: '![](img/05efaadbca64ad00f9e8d44c1db8cc7b_35_0.png)


    Figure 1.4 Graph of the Weibull CDF with β = 1.2 and η = 5.


    # 1.2.2 Probability and Reliability


    Most probability values can be determined by using the CDF of X. The probability
    that failure occurs at or before time t is given as F(t), and the probability
    that the object is still working at time t is the complement of F(t),


    ```

    P(X > t) = 1 − F(t) = R(t)    (1.14)

    ```


    which is called the reliability function of X. Sometimes it is also denoted by
    F̄(t). The probability that failure occurs during time interval [t₁, t₂] is given
    as


    ```

    P(t₁ < X ≤ t₂) = F(t₂) − F(t₁)    (1.15)

    ```


    # Example 1.1 Assume the random variable X is exponential with parameter λ = 1.
    Then


    ```

    F(t) = 1 − e^{−t}

    ```


    ```

    P(X > 2) = 1 − (1 − e^{−2}) = 0.1353

    ```


    ```

    P(1 < X < 2) = (1 − e^{−2}) − (1 − e^{−1}) = e^{−1} − e^{−2} = 0.3679 − 0.1353
    = 0.2326

    ```


    # Example 1.2 Assume next that random variable X is Weibull with β = 1.5 and η
    = 5.


    Then F(t) = 1 − e^{−(t/5)^{1.5}}, and therefore


    ```

    P(X > 2) = 1 − (1 − e^{−(2/5)^{1.5}}) = e^{−0.2530} ≈ 0.7765

    ```'

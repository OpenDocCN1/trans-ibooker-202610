    # 6.1.7 Chapter Organization


    The remainder of this chapter is organized to present and discuss topics related
    to an exemplary PHM system using frameworks, control and data flow, and a checkpoint/
    restart:


    6.2 Design Approaches for a PHM System

    This section describes major approaches to designing a PHM system: select and
    evaluate candidate targets and their failure modes for prognostic enabling; select
    models and computational routines from an offline phase; and select an architecture
    for online use.


    6.3 Sampling and Polling

    This section describes practical considerations and aspects related to continual
    sampling, periodic sampling, periodic-burst sampling, and polling. Those considerations
    are important in the design and development of a PHM system.'

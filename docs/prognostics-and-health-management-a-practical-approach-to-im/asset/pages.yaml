- pgno: 325
  md: 'where OFFSET is calculated as follows:


    Let $NM_{FFS}$ represent the NM expressed as an FFS value.

    Let $FL_{FFS}$ represent the value used to convert either FFP or DPS data into
    FFS data.

    Let $NM_{FD}$ represent the NM expressed as a FD value.

    Let $FNM$ represent the value you specified in your NDEF (refer back to Figure
    6.60).

    Let $FD_0$ represent the nominal FD value in the absence of degradation.

    Let $FDNOMMIN$ represent the value you specified in your NDEF (refer back to Figure
    6.60).


    Then


    $NM_{FD} = (FNM/100)$ when $FD_0 \geq FDNOMMIN$


    else


    $NM_{FD} = FNM$


    Then


    $NM_{FFS} = (NM_{FD}/FL_{FFS})$


    $OFFSET = NM_{FFS}(PITTFFO/2)$


    **(6.11)**


    **Example 6.2**  For example, when PITTFFO is 2000 hours and $NM_{FFS}$ is 0.030
    (3.0%), then OFFSET is estimated as 30 hours (0.03 times 1000 hours); and if $TS$
    is 24 hours, then an estimated value for $PD_{EST\_MIN}$ using Eqs. (6.10) and
    (6.11) becomes 946 hours. If that value does not meet requirements, then assuming
    PITTFFO is sufficiently correct, you need to either reduce OFFSET by reducing
    noise so you can reduce the NM and/or you need to increase the sampling rate to
    decrease TS.


    **Example 6.3**  Suppose you have been given the following prognostic requirements
    and specifications statements:


    > “Degradation must be detected at least 1000 hours before failure, and the RUL
    estimates need to be within 10% at least 240 hours ±24 hours before failure.”


    This is interpreted as follows:


    At least 1000 hours means $PD_{EST\_MIN}$ needs to be at least as large as 1000
    hours.

    “Within 10% at least 240 hours” means $PH_{10}$ must be at least as large as 240
    hours.

    24 hours and “within 10%” means you need a minimum sampling rate of (2 samples
    /24 hours)*(100/10): 20 samples every 24 hours. This leads you to choose a designed-for-sampling
    rate of once per hour; so TS, in this case, is 1 hour.


    But wait, what effect does $PH_{10}$ have on your design, and how do you estimate
    whether your design is likely to meet requirements? That question is answered
    in the next section.


    # 6.9.3  Estimating Convergence to Within PHα


    Convergence of prognostic estimates to within $PH_α$ is primarily dependent on
    the following factors, which you can change: (i) the efficiency of your prediction
    program; (ii) the noisiness of the input to your prediction program; (iii) the
    linearity (or lack of it) of the input to your prediction program; and (iv) the
    sampling rate and, therefore, the sampling period of your design.'

  md: 'of a parameter having a nominal value ($P_0$) to create a model to transform
    FFP signature data into DPS data (Erickson 1999; Judkins et al. 2007; Judkins
    and Hofmeister 2007).


    Chapter 3 introduced the concept of a sensing system comprising everything between
    a monitored node and the input port of a system that provides diagnosis and/or
    prognosis for the monitored system, to include the remaining useful life (RUL),
    state of health (SoH), and prognostic horizon (PH).


    An important function of a sensing system is transforming CBD into a linearized
    transfer curve. The linearity of a sensing system is an assessment of how the
    measured curve produced by the sensing system deviates from the ideal curve (Texas
    Instruments 1995; Carr and Brown 2000).


    A set of models was developed in Chapter 3, including the following:


    | Formula | Description | Reference |

    |---|---|---|

    | $FD_i = CBD_i - NM$ | FD point | Eq. (3.7) |

    | $FFP_i = (FD_i - FD_0)/FD_0$ | FFP signature point | Eq. (3.8) |

    | $FFS_i = 100\,FFP_i/FL_{FFP}$ | FFP-based FFS point | Eq. (3.10) |

    | $DPS_i = dP_i/P_0 = 1 - (FD_0/FD_i)^2$ | DPS point | Eq. (3.15) |

    | $FL_{DPS} = 1 - (1/(1+FL_{FFP})^2)$ | FL relationship | Eq. (3.17) |

    | $FFS_i = 100\,DPS_i/FL_{DPS}$ | DPS-based FFS point | Eq. (3.18) |


    FMEA and PoF methods were used to create models for an example CBD signature resulting
    from a square root function type of degradation that is inversely proportional
    to $dP$. Those models were used to illustrate signature transforms to create DPS-based
    FFS data particularly amenable to processing by a prediction system to support
    prognosis in a PHM system:


    +   - **FFP.** Transforms unit-of-measure-dependent data into normalized data
    in dimensionless ratio values.

    +   - **$FL_{FFP}$.** Specifies an FFP value at which functional failure is declared
    to occur. This value is used to calculate the equivalent DPS value at which functional
    failure occurs.

    +   - **DPS.** Transforms curvilinear FFP data into linearized data.

    +   - **$FL_{DPS}$.** Transforms FFP-based failure-threshold values to DPS-based
    failure-threshold values.

    +   - **FFS.** Transforms failure-threshold-dependent DPS data into a transfer
    curve in percent values.


    # 4.1.2  Theory: Heuristic Modeling of CBD Signatures


    The theory for heuristic modeling of CBD signatures presented in this chapter
    is based on the following:z


    +   - We are given a failure mode in which the value of one or more parameters
    changes in value within a system.

    +   - PoF analysis shows that a measurable signal based on how that parameter
    changes in response to degradation will produce a family of signatures.

    +   - The difference between each signature in a family is related to the rate
    of change in a degradation parameter.

    +   - In the presence of, for example, phase changes, the characteristics of a
    signature might change; however, all signatures within a family are likely to
    exhibit the same change at approximately the same level of degradation.'

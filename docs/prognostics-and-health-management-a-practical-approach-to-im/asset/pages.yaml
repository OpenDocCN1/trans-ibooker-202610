    # 7.2.3  MTTF and MTBF Uncertainty


    Figure 7.5 illustrates the relationship of a failure distribution (density of
    failures/time), the MTBF (failure rate *between failures*), the MTBF (mean time
    *before a first failure*), and MTTF. MTTF and MTBF were originally defined for
    an exponential distribution having a constant, low failure rate: for example,
    solid-state (integrated circuit) devices. Those devices are subjected to one or
    more accelerated tests, such as a HALT, with test results extrapolated to normal
    life using an AF (Ellerman 2012; O’Connor and Kleyner 2012; NIST 2018; RAC 2005;
    Speaks 2005; Wilkins 2002).


    Typical commercial FIT values for solid-state devices are in the 50–1000 range,
    with FIT values in the range of 1–10 for space applications (Johnston 2010). There
    are simulators that calculate values called MTTF and MTBF using simulated failure
    times (Weibull 2008), which adds even more uncertainty as to the meaning of and/or
    calculation of a particular MTTF and/or MTBF value.


    Even worse, different failure distributions, different CBD signatures, and so
    on, can result in identical (or nearly identical) reliability metrics such as
    MTTF: compare Figures 7.5 and 7.6. Finally, this book asserts that attempts to
    use a TTF value of hundreds of thousands (or larger) of hours for CBD-based prognostics
    is nonsensical: an MTTF value of 100 000 hours is equivalent to more than 11 years.


    ![](img/05efaadbca64ad00f9e8d44c1db8cc7b_357_0.png)


    **Figure 7.5** MTTF, TTF, and PITTFF0: CBD signature and failure distribution.'

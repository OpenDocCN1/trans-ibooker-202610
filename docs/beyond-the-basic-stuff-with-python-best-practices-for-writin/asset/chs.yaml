  \ O 的回合，下一个回合将是玩家 X 的回合。另一种写法只会说如果现在不是玩家 X 的回合，下一个回合将是玩家 X 的回合。即使 if 和 else 语句与布尔条件很契合，PLAYER_X\
  \ 和 PLAYER_O 的值也不等同于 True 和 False：not PLAYER_X 不等于 PLAYER_O。因此，在检查 playerTurn 的值时，直接明了会更有帮助。\n\
  \nAlternatively, I could have performed the same actions in a one-liner:\n\n```\n\
  playerTurn = {PLAYER_X: PLAYER_O, PLAYER_O: PLAYER_X}[ playerTurn]\n```\n\nThis\

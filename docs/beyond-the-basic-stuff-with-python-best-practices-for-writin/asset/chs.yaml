  Desktop\\wizcoin.py\", line 237, in _\n    otherValue = (other[0] * 17 * 29) + (other[1]\
  \ * 29) + other[2]\nIndexError: list index out of range\n```\n\n我们的辅助方法调用 isinstance(other,\
  \ collections.abc.Sequence) 来查看 other 是否是序列数据类型，例如元组或列表。通过使 WizCoin 对象可与序列进行比较，我们可以编写诸如\
  \ purse >= [2, 5, 10] 这样的代码进行快速比较。\n\n## 序列比较\n\n当比较内置序列类型（如字符串、列表或元组）的两个对象时，Python\
  \ 会更重视序列中的前几个项目。也就是说，除非前面的项目值相等，否则它不会比较后面的项目。例如，输入以下内容到交互式 shell 中：\n\n```\n>>>\
  \ 'Azriel' < 'Zelda'\nTrue\n>>> (1, 2, 3) > (0, 8888, 9999)\nTrue\n```\n\n字符串 'Azriel'\
  \ 在 'Zelda' 之前（换句话说，小于 'Zelda'），因为 'A' 在 'Z' 之前。元组 (1, 2, 3) 在 (0, 8888, 9999) 之后（换句话说，大于），因为\
  \ 1 大于 0。另一方面，输入以下内容到交互式 shell 中：\n\n```\n>>> 'Azriel' < 'Aaron'\nFalse\n>>> (1,\
  \ 0, 0) > (1, 0, 9999)\nFalse\n```\n\n字符串 'Azriel' 不在 'Aaron' 之前，因为尽管 'Azriel' 中的\
  \ 'A' 等于 'Aaron' 中的 'A'，但 'Azriel' 中的后续 'z' 不在 'Aaron' 中的 'a' 之前。同样适用于元组 (1, 0,\
  \ 0) 和 (1, 0, 9999)：每个元组的前两个项目相等，因此是第三个项目（分别为 0 和 9999）决定了 (1, 0, 0) 在 (1, 0, 9999)\
  \ 之前。\n\n这迫使我们对 WizCoin 类做出设计决策。WizCoin(0, 0, 9999) 应该在 WizCoin(1, 0, 0) 之前还是之后？如果加隆的数量比锡克尔或纳特的数量更重要，则\
  \ WizCoin(0, 0, 9999) 应该在 WizCoin(1, 0, 0) 之前。或者如果我们根据纳特值比较对象，则 WizCoin(0, 0, 9999)（价值\
  \ 9,999 纳特）在 WizCoin(1, 0, 0)（价值 493 纳特）之后。在 wizcoin.py 中，我决定使用对象的纳特值，因为这种行为与 WizCoin\
  \ 对象与整数和浮点数比较的方式一致。这些是在设计自己的类时你必须做出的决定类型。\n\n没有你需要实现的反射比较 dunder 方法，例如 __req__()\
  \ 或 __rne__()。相反，__lt__() 和 __gt__() 互相反射，__le__() 和 __ge__() 互相反射，而 __eq__() 和\
  \ __ne__() 自身反射。原因是无论运算符左右两侧的值是什么，以下关系都成立：\n\n- purse > [2, 5, 10] 与 [2, 5, 10]\
  \ < purse 相同\n- purse >= [2, 5, 10] 与 [2, 5, 10] <= purse 相同\n- purse == [2, 5,\
  \ 10] 与 [2, 5, 10] == purse 相同\n- purse != [2, 5, 10] 与 [2, 5, 10] != purse 相同\n\
  \n一旦你实现了比较 dunder 方法，Python 的 sort() 函数将自动使用它们对你的对象进行排序。输入以下内容到交互式 shell 中：\n\n\
  ```\n>>> import wizcoin\n>>> oneGalleon = wizcoin.WizCoin(1, 0, 0) # Worth 493 knuts.\n\
  >>> oneSickle = wizcoin.WizCoin(0, 1, 0)  # Worth 29 knuts.\n>>> oneKnuts = wizcoin.WizCoin(0,\
  \ 0, 1)   # Worth 1 knut.\n>>> coins = [oneSickle, oneKnuts, oneGalleon, 100]\n\
  >>> coins.sort() # Sort them from lowest value to highest.\n>>> coins\n[WizCoin(0,\
  \ 0, 1), WizCoin(0, 1, 0), 100, WizCoin(1, 0, 0)]\n```\n\n## 表 17-3：比较 Dunder 方法和\
  \ operator 模块函数\n\n| Dunder 方法 | 操作 | 比较运算符 | operator 模块中的函数 |\n|---|---|---|---|\n\
  | __eq__() | 等于 | == | operator.eq() |\n| __ne__() | 不等于 | != | operator.ne() |\n\
  \n\n\n| Dunder method | Operation | Comparison operator | Function in operator module\
  \ |\n|---|---|---|---|\n| `__lt__()` | **小于** | < | operator.lt() |\n| `__le__()`\
  \ | **小于或等于** | <= | operator.le() |\n| `__gt__()` | **大于** | > | operator.gt()\
  \ |\n| `__ge__()` | **大于或等于** | >= | operator.ge() |\n\n你可以在 https://autbox.com/wizcoinfull\
  \ 查看这些方法的实现。比较双下划线方法的完整文档在 Python 文档中 https://docs.python.org/3/reference/datamodel.html#object.__lt__。\n\
  \n比较双下划线方法让你的类的对象可以使用 Python 的比较运算符，而不必强迫你创建自己的方法。如果你正在创建名为 equals() 或 isGreaterThan()\
  \ 的方法，它们不是 Pythonic 的，这表明你应该使用比较双下划线方法。\n\n## Summary\n\nPython 实现面向对象特性与 Java 或\
  \ C++ 等其他 OOP 语言不同。Python 没有显式的 getter 和 setter 方法，而是具有属性，允许你验证属性或使属性只读。\n\nPython\
  \ 还允许你通过双下划线方法重载其运算符，这些方法以双下划线字符开头和结尾。我们使用数字和反射数字双下划线方法重载常见的数学运算符。这些方法为 Python 内置运算符与你创建的类的对象协同工作提供了一种方式。如果它们无法处理运算符另一侧对象的数据类型，它们将返回内置的\
  \ NotImplemented 值。这些双下划线方法创建并返回新对象，而就地双下划线方法（重载增强赋值运算符）则就地修改对象。比较双下划线方法不仅为对象实现了六个\
  \ Python 比较运算符，还允许 Python 的 sort() 函数对你类的对象进行排序。你可能希望在 operator 模块中使用 eq()、ne()、lt()、le()、gt()\
  \ 和 ge() 函数来帮助你实现这些双下划线方法。\n\n属性和双下划线方法允许你编写一致且可读的类。它们让你避免其他语言（如 Java）要求你编写的大量样板代码。要了解更多关于编写\
  \ Pythonic 代码的信息，Raymond Hettinger 在 PyCon 上的两个演讲扩展了这些想法：“Transforming Code into\
  \ Beautiful, Idiomatic Python” at https://youtu.be/OSGv2VnC0go/ 和 “Beyond PEP 8—Best\
  \ Practices for Beautiful, Intelligible Code” at https://youtu.be/ufBqAjZb8M/ 涵盖了本章及以后的一些概念。\n\
  \n关于如何有效地使用 Python，还有很多东西需要学习。Luciano Ramalho 所著的书籍 *Fluent Python* (O'Reilly Media,\
  \ 2021) 和 Brett Slatkin 所著的 *Effective Python* (Addison-Wesley Professional, 2019)\
  \ 提供了关于 Python 语法和最佳实践的更深入信息，对于任何想要继续了解更多关于 Python 的人来说都是必读之作。\n"

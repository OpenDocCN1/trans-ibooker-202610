  \n![](img/ab52fe24e511e29be73786864ebe0410_383_0.png)\n\n\n\n你已经完成了基础的 Python 编程教程，或读完了\
  \ Al Sweigart 的畅销书《Automate the Boring Stuff with Python》。通往成为一名胜任且自信的软件开发者的下一步是什么？\n\
  \n欢迎阅读《Beyond the Basic Stuff with Python》。这本书不仅仅是一本收集精妙技巧来编写干净代码的书，它还会展示如何导航命令行并使用其他专业工具，包括代码格式化器、类型检查器、代码检查工具和版本控制。Sweigart\
  \ 带你了解设置开发环境的最佳实践、命名变量以及提高可读性，然后涉及文档、组织、性能测量、面向对象设计，甚至 Big-O 算法分析。这些高级技能将显著提升你的编程能力——不仅限于\
  \ Python，而是任何语言。\n\n你将学到：\n\n- 编码风格，以及如何使用 Python 的 Black 自动格式化工具使代码更整洁\n- 错误的常见来源，以及如何通过静态分析器检测它们\n\
  - 如何使用 Cookiecutter 模板工具来组织代码项目中的文件\n- 类似 lambda 和高阶函数的函数式编程技术\n- 如何使用 Python 内置的\
  \ timeit 和 cProfile 模块分析代码速度\n- 如何使你的注释和 docstring 富有信息性，以及多久写一次\n\n当然，没有一本书能让你成为专业的软件开发者。但《Beyond\
  \ the Basic Stuff with Python》会让你在这条道路上更进一步，因为你将学会编写可读性强、易于调试且完全符合 Python 风格的代码。\n\
  \n## ABOUT THE AUTHOR\n\nAl Sweigart 是一位备受赞誉的软件开发者、广受欢迎的 Udemy Python 课程的创建者，以及一名编程教师。作为\
  \ Python 软件基金会的 Fellow，Sweigart 也是 No Starch Press 出版的三本其他 Python 书籍的作者，其中包括全球畅销书《Automate\
  \ the Boring Stuff with Python》。\n"

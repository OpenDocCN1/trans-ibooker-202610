- "### 第 15 章：面向对象编程和类\n\n![](img/ab52fe24e511e29be73786864ebe0410_301_0.png)\n\n\
  *OOP* 是一种编程语言特性，允许你将变量和函数组合成新的数据类型，称为 *classes*，从中可以创建对象。通过将代码组织成类，你可以将单体程序分解为更小、更易于理解和调试的部分。\n\
  \n对于小型程序，OOP 增加的与其说是组织，不如说是官僚主义。尽管某些语言，如 Java，要求你将所有代码组织到类中，但 Python 的 OOP 特性是可选的。程序员如果需要可以使用类，如果不需要也可以忽略。Python\
  \ 核心开发者 Jack Diederich 的 PyCon 2012 演讲，“Stop Writing Classes” (https://youtu.be/o9pEzgHorH0/)，指出了程序员在更简单的函数或模块即可胜任的情况下仍编写类的许多案例。\n\
  \n尽管如此，作为程序员，你应该熟悉类的基本概念以及它们的工作方式。在本章中，你将学习类是什么、为什么在程序中使用它们，以及背后的语法和编程概念。OOP 是一个广泛的主题，本章仅作为入门。\n\
  \n### 真实世界类比：填写表单\n\n你在生活中很可能多次填写过纸质或电子表单：用于医生就诊、在线购买或婚礼 RSVP。表单作为另一种人或组织收集他们需要了解你的信息的统一方式而存在。不同的表单要求不同类型的信息。你会在医生的表单上报告敏感的医疗状况，并在婚礼\
  \ RSVP 上报告你带来的任何客人，但不会反过来。\n\n在 Python 中，class、type 和 data type 含义相同。像纸质或电子表单一样，类是\
  \ Python 对象的蓝图（也称为实例），它们包含代表名词的数据。这个名词可能是医生的病人、电子商务购买或婚礼客人。类就像空白的表单模板，而从该类创建的对象就像填写好的表单，包含有关表单所代表的事物类型的实际数据。例如，在图\
  \ 15-1 中，RSVP 回复表单就像一个类，而填写好的 RSVP 就像一个对象。\n\n![](img/ab52fe24e511e29be73786864ebe0410_302_0.png)\n\
  \n图 15-1：婚礼 RSVP 表单模板就像类，而填写好的表单就像对象。\n\n你也可以将类和对象视为电子表格，如图 15-2 所示。\n\n![](img/ab52fe24e511e29be73786864ebe0410_303_0.png)\n\
  \n图 15-2：所有 RSVP 数据的电子表格\n\n列标题构成类，而每一行则构成一个对象。\n\n类和对象常被谈论为现实世界中事物的的数据模型，但不要混淆地图和领土。类中包含的内容取决于程序需要做什么。图\
  \ 15-3 显示了一些代表同一现实世界人物但来自不同类的对象，除了姓名外，它们存储完全不同的信息。\n\nobj = Customer()\nobj.name\
  \ = 'Alice'\nobj.customerSince = 2015\nobj.numPurchases = 42\n\nobj = Employee()\n\
  obj.name = 'Alice'\nobj.title = 'Software dev'\nobj.employeeID = '1729'\n\n![](img/ab52fe24e511e29be73786864ebe0410_303_1.png)\n\
  \nobj = WeddingGuest()\nobj.name = 'Alice'\nobj.hasRSVPed = True\nobj.hasAccepted\
  \ = True\nobj.guests = 1\n\nobj = Patient()\nobj.name = 'Alice'\nobj.bloodType =\
  \ 'O-'\nobj.allergies = ['eggs', 'pollen']\n\n图 15-3：由不同类创建的四个对象代表同一现实世界人物，具体取决于软件应用程序需要了解该人物的信息\n\
  \n此外，你的类中包含的信息应取决于程序的需求。许多 OOP 教程使用 Car 类作为基本示例，却未指出类中包含的内容完全取决于你编写的软件类型。没有一种通用\
  \ Car 类会明显具有 honkHorn() 方法或 numberOfCupholders 属性，只是因为这些是现实世界汽车的特征。你的程序可能是汽车经销商网站、赛车视频游戏或道路交通模拟。汽车经销商网站的\
  \ Car 类可能具有 milesPerGallon 或 manufacturersSuggestedRetailPrice 属性（就像汽车经销商的电子表格可能会将这些用作列）。但视频游戏和道路交通模拟不会具有这些属性，因为这些信息与它们无关。视频游戏的\
  \ Car 类可能具有 explodeWithLargeFireball() 方法，但汽车经销商和交通模拟 hopefully 不会。\n\n### 从类创建对象\n\
  \n你已经在 Python 中使用过类和对象，即使你自己还没有创建过类。考虑 datetime 模块，它包含一个名为 date 的类。datetime.date\
  \ 类的对象（也简单称为 datetime.date 对象或 date 对象）代表特定日期。在交互式 shell 中输入以下内容以创建 datetime.date\
  \ 类的对象：\n\n```\n>>> import datetime\n>>> birthday = datetime.date(1999, 10, 31)\
  \ # Pass the year, month, and day.\n>>> birthday.year\n1999\n>>> birthday.month\n\
  10\n>>> birthday.day\n31\n>>> birthday.weekday() # weekday() is a method; note the\
  \ parentheses.\n6\n```\n\n属性是与对象关联的变量。对 datetime.date() 的调用创建了一个新的 date 对象，使用参数\
  \ 1999、10、31 初始化，因此该对象代表 1999 年 10 月 31 日。我们将这些参数分配为 date 类的 year、month 和 day 属性，所有\
  \ date 对象都有这些属性。\n\n有了这些信息，类的 weekday() 方法可以计算星期几。在此示例中，它返回 6 代表星期日，因为根据 Python\
  \ 的在线文档，weekday() 的返回值是一个整数，从星期一的 0 开始到星期日的 6。文档列出了 date 类对象拥有的其他几个方法。尽管 date 对象包含多个属性和方法，它仍然是一个单一对象，可以存储在变量中，例如本示例中的\
  \ birthday。\n\n\n\n## 创建一个简单的类：WizCoin\n\n让我们创建一个 WizCoin 类，它代表一种虚构巫师货币中的硬币数量。在这种货币中，面额有\
  \ knuts、sickles（价值 29 knuts）和 galleons（价值 17 sickles 或 493 knuts）。请记住，WizCoin 类中的对象代表硬币的数量，而不是金钱的金额。例如，它会告诉你你持有五枚四分之一和一枚十美分，而不是\
  \ $1.35。\n\n在一个名为 wizcoin.py 的新文件中，输入以下代码来创建 WizCoin 类。请注意，__init__ 方法名在 init 前后各有两个下划线（我们将在本章后面“Methods,\
  \ __init__(), and self”部分讨论 __init__）：\n\n```python\nclass WizCoin:\n    def __init__(self,\
  \ galleons, sickles, knuts):\n        \"\"\"Create a new WizCoin object with galleons,\
  \ sickles, and knuts.\"\"\"\n        self.galleons = galleons\n        self.sickles\
  \ = sickles\n        self.knuts = knuts\n        # NOTE: __init__() methods NEVER\
  \ have a return statement.\n\n    def value(self):\n        \"\"\"The value (in\
  \ knuts) of all the coins in this WizCoin object.\"\"\"\n        return (self.galleons\
  \ * 17 * 29) + (self.sickles * 29) + (self.knuts)\n\n    def weightInGrams(self):\n\
  \        \"\"\"Returns the weight of the coins in grams.\"\"\"\n        return (self.galleons\
  \ * 31.103) + (self.sickles * 11.34) + (self.knuts * 5.0)\n```\n\n此程序使用 class 语句\
  \ ① 定义了一个名为 WizCoin 的新类。创建类会创建一个新的对象类型。使用 class 语句定义类类似于使用 def 语句定义新函数。在 class 语句后面的代码块中定义了三个方法：__init__()（initializer\
  \ 的简写）②、value() ③ 和 weightInGrams() ④。请注意，所有方法都有一个名为 self 的第一个参数，我们将在下一节中探讨它。\n\n\
  按惯例，模块名（如我们 wizcoin.py 文件中的 wizcoin）为小写，而类名（如 WizCoin）以大写字母开头。不幸的是，Python 标准库中的某些类，例如\
  \ date，并不遵循此惯例。\n\n为了练习创建 WizCoin 类的新对象，请在单独的文件编辑器窗口中输入以下源代码，并将文件保存为 wc_example1.py，与\
  \ wizcoin.py 放在同一文件夹中：\n\n```python\nimport wizcoin\n\npurse = wizcoin.WizCoin(2,\
  \ 5, 99) # The ints are passed to __init__().\nprint(purse)\nprint('G:', purse.galleons,\
  \ 'S:', purse.sickles, 'K:', purse.knuts)\nprint('Total value:', purse.value())\n\
  print('Weight:', purse.weightInGrams(), 'grams')\nprint()\ncoinJar = wizcoin.WizCoin(13,\
  \ 0, 0) # The ints are passed to __init__().\nprint(coinJar)\nprint('G:', coinJar.galleons,\
  \ 'S:', coinJar.sickles, 'K:', coinJar.knuts)\nprint('Total value:', coinJar.value())\n\
  print('Weight:', coinJar.weightInGrams(), 'grams')\n```\n\n对 WizCoin() ① ② 的调用会创建一个\
  \ WizCoin 对象并为其运行 __init__() 方法中的代码。我们将三个整数作为参数传递给 WizCoin()，它们会被转发给 __init__()\
  \ 的参数。这些参数会被分配给对象的 self.galleons、self.sickles 和 self.knuts 属性。请注意，就像 time.sleep()\
  \ 函数要求你先导入 time 模块并在函数名前加上 time. 一样，我们也必须导入 wizcoin 并在 WizCoin() 函数名前加上 wizcoin.。运行此程序时，输出将类似于以下内容：\n\
  \n```\n<wizcoin.WizCoin object at 0x000002136F138080>\nG: 2 S: 5 K: 99\nTotal value:\
  \ 1230\nWeight: 613.906 grams\n\n<wizcoin.WizCoin object at 0x000002136F138128>\n\
  G: 13 S: 0 K: 0\nTotal value: 6409\nWeight: 404.339 grams\n```\n\n如果出现错误消息，例如 ModuleNotFoundError:\
  \ No module named 'wizcoin'，请检查你的文件是否命名为 wizcoin.py，并且它与 wc_example1.py 在同一文件夹中。\n\
  \nWizCoin 对象没有有用的字符串表示形式，因此打印 purse 和 coinJar 会显示尖括号之间的内存地址。（你将在第 17 章学习如何更改此设置。）\n\
  \n正如我们可以对字符串对象调用 lower() 字符串方法一样，我们也可以对分配给 purse 和 coinJar 变量的 WizCoin 对象调用 value()\
  \ 和 weightInGrams() 方法。这些方法根据对象的 galleons、sickles 和 knuts 属性计算值。\n\n类和 OOP 可以带来更易维护的代码——也就是说，更容易在未来阅读、修改和扩展的代码。让我们更详细地探索此类的方法和属性。\n\
  \n## 方法、__init__() 和 self\n\n方法是可以与特定类的对象关联的函数。回想一下，lower() 是一个字符串方法，意味着它是在字符串对象上调用的。你可以在字符串上调用\
  \ lower()，例如 'Hello'.lower()，但不能在列表上调用它，例如 ['dog', 'cat'].lower()。另外，请注意方法在对象之后：正确的代码是\
  \ 'Hello'.lower()，而不是 lower('Hello')。与 lower() 这样的方法不同，像 len() 这样的函数与单一数据类型无关；你可以将字符串、列表、字典和许多其他类型的对象传递给\
  \ len()。\n\n正如你在上一节中看到的，我们通过将类名作为函数调用来创建对象。此函数被称为构造函数（或构造器，或缩写为 ctor，发音为“see-tore”），因为它构造了一个新对象。我们也说构造函数实例化了类的一个新实例。\n\
  \n调用构造函数会导致 Python 创建新对象然后运行 __init__() 方法。类不需要有 __init__() 方法，但几乎总是会有。__init__()\
  \ 方法是通常设置属性初始值的地方。例如，回想一下 WizCoin 的 __init__() 方法如下所示：\n\n```python\ndef __init__(self,\
  \ galleons, sickles, knuts):\n    \"\"\"Create a new WizCoin object with galleons,\
  \ sickles, and knuts.\"\"\"\n    self.galleons = galleons\n    self.sickles = sickles\n\
  \    self.knuts = knuts\n# NOTE: __init__() methods NEVER have a return statement.\n\
  ```\n\n当 wc_example1.py 程序调用 WizCoin(2, 5, 99) 时，Python 会创建一个新的 WizCoin 对象，然后将三个参数（2、5\
  \ 和 99）传递给一次 __init__() 调用。但 __init__() 方法有四个参数：self、galleons、sickles 和 knuts。原因在于所有方法都有一个名为\
  \ self 的第一个参数。当在对象上调用方法时，对象会自动作为 self 参数传入。其余参数会正常分配。如果你看到错误消息，例如 TypeError: __init__()\
  \ takes 3 positional arguments but 4 were given，你可能忘记在方法的 def 语句中添加 self 参数。\n\n\
  你不必将方法的第一个参数命名为 self；你可以将其命名为任何名称。但使用 self 是惯例，选择不同的名称会使你的代码对其他 Python 程序员来说可读性降低。当你阅读代码时，self\
  \ 作为第一个参数的存在是你区分方法和函数的最快方式。同样，如果你的方法代码永远不需要使用 self 参数，这表明你的方法可能应该只是一个函数。\n\nWizCoin(2,\
  \ 5, 99) 的 2、5 和 99 参数不会自动分配给新对象的属性；我们需要在 __init__() 中使用三个赋值语句来完成此操作。通常，__init__()\
  \ 参数与属性同名，但 self.galleons 中的 self 表明它是一个对象的属性，而 galleons 是一个参数。将构造函数的参数存储在对象的属性中是类\
  \ __init__() 方法的常见任务。上一节中的 datetime.date() 调用执行了类似的任务，只是我们传递的三个参数用于新创建的 date 对象的\
  \ year、month 和 day 属性。\n\n你之前调用过 int()、str()、float() 和 bool() 函数在数据类型之间转换，例如 str(3.1415)\
  \ 基于浮点值 3.1415 返回字符串值 '3.1415'。之前，我们将这些描述为\n\nfunctions, but int, str, float, and\
  \ bool are actually classes, and the int(), str(), float(), and bool() functions\
  \ are constructor functions that return new integer, string, float, and Boolean\
  \ objects. Python's style guide recommends using capitalized camelcase for your\
  \ class names (like WizCoin), although many of Python's built-in classes don't follow\
  \ this convention.\n\nNote that calling the WizCoin() construction function returns\
  \ the new WizCoin object, but the __init__() method never has a return statement\
  \ with a return value. Adding a return value causes this error: TypeError: __init__()\
  \ should return None.\n\n## Attributes\n\nAttributes are variables associated with\
  \ an object. The Python documentation describes attributes as “any name following\
  \ a dot.” For example, consider the birthday.year expression in the previous section.\
  \ The year attribute is a name following a dot.\n\n每个对象都有自己的属性集合。当 wcexample1.py\
  \ 程序创建了两个 WizCoin 对象并将它们存储在 purse 和 coinJar 变量中时，它们的属性具有不同的值。你可以像访问和设置任何变量一样访问和设置这些属性。为了练习设置属性，打开一个新的文件编辑器窗口并输入以下代码，将其保存为与\
  \ wizcoin.py 文件相同文件夹下的 wcexample2.py：\n\n```\nimport wizcoin\n\nchange = wizcoin.WizCoin(9,\
  \ 7, 20)\nprint(change.sickles) # Prints 7.\nchange.sickles += 10\nprint(change.sickles)\
  \ # Prints 17.\n\npile = wizcoin.WizCoin(2, 3, 31)\nprint(pile.sickles) # Prints\
  \ 3.\npile.someNewAttribute = 'a new attr' # A new attribute is created.\nprint(pile.someNewAttribute)\n\
  ```\n\nWhen you run this program, the output looks like this:\n\n运行此程序时，输出如下所示：\n\
  \n```\n7\n17\n3\na new attr\n```\n\nYou can think of an object's attributes as similar\
  \ to a dictionary's keys. You can read and modify their associated values and assign\
  \ an object new attributes. Technically, methods are considered attributes of a\
  \ class, as well.\n\n你可以将对象的属性视为类似于字典的键。你可以读取和修改其关联的值，并为对象分配新的属性。严格来说，方法也被视为类的属性。\n\
  \n## Private Attributes and Private Methods\n\nIn languages such as C++ or Java,\
  \ attributes can be marked as having private access, which means the compiler or\
  \ interpreter only lets code inside the class's methods access or modify the attributes\
  \ of objects of that class. But\nin Python, this enforcement doesn't exist. All\
  \ attributes and methods are effectively *public access*: code outside of the class\
  \ can access and modify any attribute in any object of that class.\n\n在 C++ 或 Java\
  \ 等语言中，属性可以被标记为私有访问，这意味着编译器或解释器只允许类的方法内部的代码访问或修改该类对象的属性。但在 Python 中，这种强制执行并不存在。所有属性和方法实际上都是\
  \ *公开访问*：类外部的代码可以访问和修改该类对象的任何属性。\n\nBut private access is useful. For example, objects\
  \ of a BankAccount class could have a balance attribute that only methods of the\
  \ BankAccount class should have access to. For those reasons, Python's convention\
  \ is to start *private* attribute or method names with a single underscore. Technically,\
  \ there is nothing to stop code outside the class from accessing private attributes\
  \ and methods, but it's a best practice to let only the class's methods access them.\n\
  \n但私有访问是有用的。例如，BankAccount 类的对象可以有一个 balance 属性，只有 BankAccount 类的方法应该能够访问它。出于这些原因，Python\
  \ 的约定是以单个下划线开头 *私有* 属性或方法名称。严格来说，没有任何东西可以阻止类外部的代码访问私有属性和方法，但最佳实践是只允许类的方法访问它们。\n\n\
  Open a new file editor window, enter the following code, and save it as *privateExample.py*.\
  \ In it, objects of a BankAccount class have private _name and _balance attributes\
  \ that only the deposit() and withdraw() methods should directly access:\n\n打开一个新的文件编辑器窗口，输入以下代码，并将其保存为\
  \ *privateExample.py*。其中，BankAccount 类的对象具有私有 _name 和 _balance 属性，只有 deposit() 和\
  \ withdraw() 方法应该直接访问它们：\n\n```python\nclass BankAccount:\n    def __init__(self,\
  \ accountHolder):\n        # BankAccount methods can access self._balance, but code\
  \ outside of\n        # this class should not:\n        self._balance = 0\n    \
  \    self._name = accountHolder\n        with open(self._name + 'Ledger.txt', 'w')\
  \ as ledgerFile:\n            ledgerFile.write('Balance is 0\\n')\n\n    def deposit(self,\
  \ amount):\n        if amount <= 0:\n            return # Don't allow negative \"\
  deposits\".\n        self._balance += amount\n        with open(self._name + 'Ledger.txt',\
  \ 'a') as ledgerFile:\n            ledgerFile.write('Deposit ' + str(amount) + '\\\
  n')\n            ledgerFile.write('Balance is ' + str(self._balance) + '\\n')\n\n\
  \    def withdraw(self, amount):\n        if self._balance < amount or amount <\
  \ 0:\n            return # Not enough in account, or withdraw is negative.\n   \
  \     self._balance -= amount\n        with open(self._name + 'Ledger.txt', 'a')\
  \ as ledgerFile:\n            ledgerFile.write('Withdraw ' + str(amount) + '\\n')\n\
  \            ledgerFile.write('Balance is ' + str(self._balance) + '\\n')\n\nacct\
  \ = BankAccount('Alice') # We create an account for Alice.\nacct.deposit(120) #\
  \ _balance can be affected through deposit()\nacct.withdraw(40) # _balance can be\
  \ affected through withdraw()\n\n# Changing _name or _balance outside of BankAccount\
  \ is impolite, but allowed:\nacct._balance = 1000000000\nacct.withdraw(1000)\n\n\
  acct._name = 'Bob' # Now we're modifying Bob's account ledger!\nacct.withdraw(1000)\
  \ # This withdrawal is recorded in BobLedger.txt!\n```\n\nWhen you run *privateExample.py*,\
  \ the ledger files it creates are inaccurate because we modified the _balance and\
  \ _name outside the class, which resulted in invalid states. *AliceLedger.txt* inexplicably\
  \ has a lot of money in it:\n\n运行 *privateExample.py* 时，它创建的账本文件不准确，因为我们在类外部修改了\
  \ _balance 和 _name，导致了无效状态。*AliceLedger.txt* 不明原因地有很多钱：\n\n```\nBalance is 0\nDeposit\
  \ 120\nBalance is 120\nWithdraw 40\nBalance is 80\nWithdraw 1000\nBalance is 999999000\n\
  ```\n\nNow there’s a *BobLedger.txt* file with an inexplicable account balance,\
  \ even though we never created a BankAccount object for Bob:\n\n现在有一个 *BobLedger.txt*\
  \ 文件，其中有无法解释的账户余额，即使我们从未为 Bob 创建过 BankAccount 对象：\n\n```\nWithdraw 1000\nBalance\
  \ is 999998000\n```\n\nWell-designed classes will be mostly self-contained, providing\
  \ methods to adjust the attributes to valid values. The _balance and _name attributes\
  \ are marked as private ① ②, and the only valid way of adjusting the BankAccount\
  \ class’s value is through the deposit() and withdraw() methods. These two methods\
  \ have checks ③ ⑤ to make sure _balance isn’t put into an invalid state (such as\
  \ a negative integer value). These methods also record each transaction to account\
  \ for the current balance ④ ⑥.\n\n设计良好的类将主要是自包含的，提供方法将属性调整为有效值。_balance 和 _name\
  \ 属性被标记为私有 ① ②，调整 BankAccount 类值的唯一有效方式是通过 deposit() 和 withdraw() 方法。这两个方法都有检查 ③\
  \ ⑤，以确保 _balance 不会被置于无效状态（例如负整数值）。这些方法还记录每次交易以记账当前余额 ④ ⑥。\n\nCode outside the class\
  \ that modifies these attributes, such as acct._balance = 1000000000 ⑦ or acct._name\
  \ = 'Bob' ⑧ instructions, can put the object into an invalid state and introduce\
  \ bugs (and audits from the bank examiner). By following the underscore prefix convention\
  \ for private access, you make debugging easier. The reason is that you know the\
  \ cause of the bug will be in the code in the class instead of anywhere in the entire\
  \ program.\n\n类外部修改这些属性的代码，例如 acct._balance = 1000000000 ⑦ 或 acct._name = 'Bob'\
  \ ⑧ 指令，会使对象进入无效状态并引入错误（以及银行检查员的审计）。通过遵循私有访问的下划线前缀约定，你可以使调试更容易。原因在于，你知道错误的原因将在类中的代码中，而不是整个程序的任何地方。\n\
  \nNote that unlike Java and other languages, Python has no need for public getter\
  \ and setter methods for private attributes. Instead Python uses properties, as\
  \ explained in Chapter 17.\n\n请注意，与 Java 和其他语言不同，Python 不需要为私有属性提供公共的 getter 和 setter\
  \ 方法。相反，Python 使用属性，如第 17 章所述。\n\n## The type() Function and __qualname__ Attribute\n\
  \nPassing an object to the built-in type() function tells us the object’s data type\
  \ through its return value. The objects returned from the type() function are type\
  \ objects, also called class objects. Recall that the terms type, data type, and\
  \ class all have the same meaning in Python. To see what the type() function returns\
  \ for various values, enter the following into the interactive shell:\n\n将对象传递给内置的\
  \ type() 函数可通过其返回值告诉我们对象的数据类型。type() 函数返回的对象是类型对象，也称为类对象。请记住，在 Python 中，type、数据类型和\
  \ class 这三个术语具有相同的含义。要查看 type() 函数对各种值返回什么，请在交互式 shell 中输入以下内容：\n\n```\n>>> type(42)\
  \  # The object 42 has a type of int.\n<class 'int'>\n>>> int  # int is a type object\
  \ for the integer data type.\n<class 'int'>\n>>> type(42) == int  # Type check 42\
  \ to see if it is an integer.\nTrue\n>>> type('Hello') == int  # Type check 'Hello'\
  \ against int.\nFalse\n>>> import wizcoin\n>>> type(42) == wizcoin.WizCoin  # Type\
  \ check 42 against WizCoin.\nFalse\n>>> purse = wizcoin.WizCoin(2, 5, 10)\n>>> type(purse)\
  \ == wizcoin.WizCoin # Type check purse against WizCoin.\nTrue\n```\n\nNote that\
  \ int is a type object and is the same kind of object as what type(42) returns,\
  \ but it can also be called as the int() constructor function: the int('42') function\
  \ doesn't convert the '42' string argument; instead, it returns an integer object\
  \ based on the argument.\n\n请注意，int 是一个类型对象，与 type(42) 返回的对象是同一种对象，但它也可以作为 int()\
  \ 构造函数调用：int('42') 函数不会转换 '42' 字符串参数；相反，它会基于参数返回一个整数对象。\n\nSay you need to log some\
  \ information about the variables in your program to help you debug them later.\
  \ You can only write strings to a logfile, but passing the type object to str()\
  \ will return a rather messy-looking string. Instead, use the __qualname__ attribute,\
  \ which all type objects have, to write a simpler, human-readable string:\n\n假设你需要记录程序中变量的一些信息以便以后调试。你只能向日志文件写入字符串，但将类型对象传递给\
  \ str() 会返回一个看起来相当杂乱的字符串。相反，使用所有类型对象都有的 __qualname__ 属性来写入更简单、人类可读的字符串：\n\n```\n\
  >>> str(type(42))  # Passing the type object to str() returns a messy string.\n\"\
  <class 'int'>\"\n>>> type(42).__qualname__ # The __qualname__ attribute is nicer\
  \ looking.\n'int'\n```\n\nThe __qualname__ attribute is most often used for overriding\
  \ the __repr__() method, which is explained in more detail in Chapter 17.\n\n__qualname__\
  \ 属性最常用于覆盖 __repr__() 方法，详情请参见第 17 章。\n\n## Non-OOP vs. OOP Examples: Tic-Tac-Toe\n\
  \nAt first, it can be difficult to see how to use classes in your programs. Let's\
  \ look at an example of a short tic-tac-toe program that doesn't use classes, and\
  \ then rewrite it so it does.\n\n起初，很难看出如何在程序中使用类。让我们看一个不使用类的简短井字棋程序的示例，然后将其重写以使用类。\n\
  \nOpen a new file editor window and enter the following program; then save it as\
  \ tictactoe.py:\n\n打开一个新的文件编辑器窗口并输入以下程序；然后将其保存为 tictactoe.py：\n\n```\n# tictactoe.py,\
  \ A non-OOP tic-tac-toe game.\n\nALL_SPACES = list('123456789')  # The keys for\
  \ a TTT board dictionary.\nX, O, BLANK = 'X', 'O', ' '  # Constants for string values.\n\
  \ndef main():\n    \"\"\"Runs a game of tic-tac-toe.\"\"\"\n    print('Welcome to\
  \ tic-tac-toe!')\n    gameBoard = getBlankBoard()  # Create a TTT board dictionary.\n\
  \    currentPlayer, nextPlayer = X, O  # X goes first, O goes next.\n\n    while\
  \ True:\n        print(getBoardStr(gameBoard))  # Display the board on the screen.\n\
  \n        # Keep asking the player until they enter a number 1-9:\n```\n\nmove =\
  \ None\nwhile not isValidSpace(gameBoard, move):\n    print(f\"What is {currentPlayer}'s\
  \ move? (1-9)\")\n    move = input()\nupdateBoard(gameBoard, move, currentPlayer)\
  \  # Make the move.\n\n# Check if the game is over:\nif isWinner(gameBoard, currentPlayer):\
  \  # First check for victory.\n    print(getBoardStr(gameBoard))\n    print(currentPlayer\
  \ + ' has won the game!')\n    break\nelif isBoardFull(gameBoard):  # Next check\
  \ for a tie.\n    print(getBoardStr(gameBoard))\n    print('The game is a tie!')\n\
  \    break\ncurrentPlayer, nextPlayer = nextPlayer, currentPlayer  # Swap turns.\n\
  print('Thanks for playing!')\n\ndef getBlankBoard():\n    \"\"\"Create a new, blank\
  \ tic-tac-toe board.\"\"\"\n    board = {}  # The board is represented as a Python\
  \ dictionary.\n    for space in ALL_SPACES:\n        board[space] = BLANK  # All\
  \ spaces start as blank.\n    return board\n\ndef getBoardStr(board):\n    \"\"\"\
  Return a text-representation of the board.\"\"\"\n    return f'''\n{board['1']}{board['2']}{board['3']}\
  \ 1 2 3\n-+-+\n{board['4']}{board['5']}{board['6']} 4 5 6\n-+-+\n{board['7']}{board['8']}{board['9']}\
  \ 7 8 9'''\n\ndef isValidSpace(board, space):\n    \"\"\"Returns True if the space\
  \ on the board is a valid space number\nand the space is blank.\"\"\"\n    return\
  \ space in ALL_SPACES and board[space] == BLANK\n\ndef isWinner(board, player):\n\
  \    \"\"\"Return True if player is a winner on this TTTBoard.\"\"\"\n    b, p =\
  \ board, player  # Shorter names as \"syntactic sugar\".\n    # Check for 3 marks\
  \ across the 3 rows, 3 columns, and 2 diagonals.\n    return ((b['1'] == b['2']\
  \ == b['3'] == p) or  # Across the top\n            (b['4'] == b['5'] == b['6']\
  \ == p) or  # Across the middle\n            (b['7'] == b['8'] == b['9'] == p) or\
  \  # Across the bottom\n            (b['1'] == b['4'] == b['7'] == p) or  # Down\
  \ the left\n            (b['2'] == b['5'] == b['8'] == p) or  # Down the middle\n\
  \            (b['3'] == b['6'] == b['9'] == p) or  # Down the right\n          \
  \  (b['3'] == b['5'] == b['7'] == p) or  # Diagonal\n            (b['1'] == b['5']\
  \ == b['9'] == p))   # Diagonal\n\ndef isBoardFull(board):\n    \"\"\"Return True\
  \ if every space on the board has been taken.\"\"\"\nfor space in ALL_SPACES:\n\
  \    if board[space] == BLANK:\n        return False  # If a single space is blank,\
  \ return False.\nreturn True  # No spaces are blank, so return True.\n\ndef updateBoard(board,\
  \ space, mark):\n    \"\"\"Sets the space on the board to mark.\"\"\"\n    board[space]\
  \ = mark\n\nif __name__ == '__main__':\n    main() # Call main() if this module\
  \ is run, but not when imported.\n\n运行此程序时，输出看起来会像这样：\n\n```\nWelcome to tic-tac-toe!\n\

  \ 方法 ② 的代码复制并粘贴到了 ChildClass 和 GrandchildClass 类中。我们对 printHello() 中的代码所做的任何更改不仅会更新\
  \ ParentClass，还会更新 ChildClass 和 GrandchildClass。这与更改函数中的代码会更新其所有函数调用相同。你可以在图 16-1\
  \ 中看到这种关系。请注意，在类图中，箭头是从子类指向基类绘制的。这反映了类总是知道其基类但不会知道其子类的事实。\n\n![](img/ab52fe24e511e29be73786864ebe0410_321_0.png)\n\
  \n图 16-1：层次结构图（左）和 Venn 图（右），显示三个类之间以及它们所拥有的方法的关联\n\n通常说父子类表示“是一种”关系。ChildClass\
  \ 对象是一个 ParentClass 对象，因为它拥有 ParentClass 对象所拥有的所有方法，包括它自己定义的一些额外方法。这种关系是单向的：ParentClass\
  \ 对象不是 ChildClass 对象。如果 ParentClass 对象尝试调用 someNewMethod()，而该方法仅存在于 ChildClass 对象（以及\
  \ ChildClass 的子类）中，Python 会引发 AttributeError。\n\n程序员经常认为相关类必须符合某种现实世界的“是一种”层级。OOP\
  \ 教程通常有 Vehicle ▸ FourWheelVehicle ▸ Car、Animal ▸ Bird ▸ Sparrow 或 Shape ▸ Rectangle\
  \ ▸ Square 的父类、子类和孙子类。但请记住，继承的主要目的是代码重用。如果你的程序需要一个类，其方法集合是另一个类方法的完整超集，继承可以让你避免复制和粘贴代码。\n\
  \n我们有时也将子类称为 subclass 或 derived class，并将父类称为 super class 或 base class。\n\n## 重写方法\n\
  \n子类继承其父类的所有方法。但子类可以通过提供自己的代码来重写继承的方法。子类的重写方法将与父类的方法具有相同的名称。\n\n为了说明这一概念，让我们回到上一章中创建的井字游戏。这次，我们将创建一个新类\
  \ MiniBoard，它继承自 TTTBoard 并重写 getBoardStr() 以提供更小的井字棋盘绘制。程序会询问玩家使用哪种棋盘样式。我们不需要复制和粘贴\
  \ TTTBoard 的其余方法，因为 MiniBoard 将继承它们。\n\n将以下内容添加到你的 tictactoe_oop.py 文件末尾，以创建原始 TTTBoard\
  \ 类的子类然后重写 getBoardStr() 方法：\n\n```python\nclass MiniBoard(TTTBoard):\n    def getBoardStr(self):\n\
  \        \"\"\"Return a tiny text-representation of the board.\"\"\"\n        #\
  \ Change blank spaces to a '.'\n        for space in ALL_SPACES:\n            if\
  \ self._spaces[space] == BLANK:\n                self._spaces[space] = '.'\n\n \
  \       boardStr = f'''{self._spaces['1']}{self._spaces['2']}{self._spaces['3']}\
  \ 123\n        {self._spaces['4']}{self._spaces['5']}{self._spaces['6']} 456\n \
  \       {self._spaces['7']}{self._spaces['8']}{self._spaces['9']} 789'''\n\n   \
  \     # Change '.' back to blank spaces.\n        for space in ALL_SPACES:\n   \
  \         if self._spaces[space] == '.':\n                self._spaces[space] =\
  \ BLANK\n        return boardStr\n```\n\n与 TTTBoard 类的 getBoardStr() 方法一样，MiniBoard\
  \ 的 getBoardStr() 方法创建了一个多行字符串的井字棋盘，当传递给 print() 函数时用于显示。但这个字符串要小得多，去掉了 X 和 O 标记之间的线条，并使用句点表示空白。\n\
  \n更改 main() 中的这一行，使其实例化 MiniBoard 对象而不是 TTTBoard 对象：\n\n```python\nif input('Use\
  \ mini board? Y/N: ').lower().startswith('y'):\n    gameBoard = MiniBoard() # Create\
  \ a MiniBoard object.\nelse:\n    gameBoard = TTTBoard() # Create a TTTBoard object.\n\
  ```\n\n除了对 main() 的这一行更改外，其余程序的工作方式与之前相同。现在运行程序时，输出将类似于这样：\n\n```\nWelcome to Tic-Tac-Toe!\n\
  Use mini board? Y/N: y\n\n    ... 123\n    ... 456\n    ... 789\nWhat is X's move?\
  \ (1-9)\n1\n\n    X.. 123\n    ... 456\n    ... 789\nWhat is O's move? (1-9)\n--snip--\n\
  \    XXX 123\n    .OO 456\n    O.X 789\nX has won the game!\nThanks for playing!\n\
  ```\n\n你的程序现在可以轻松拥有这两种井字棋盘类的实现。当然，如果你只想要棋盘的迷你版本，你可以简单地替换 TTTBoard 的 getBoardStr()\
  \ 方法中的代码。但如果两者都需要，继承让你可以通过重用其通用代码轻松创建两个类。\n\n如果我们不使用继承，我们可以，例如，为 TTTBoard 添加一个名为\
  \ useMiniBoard 的新属性，并在 getBoardStr() 内部放置一个 if-else 语句来决定何时显示常规棋盘或迷你棋盘。对于如此简单的更改，这会很好用。但如果\
  \ MiniBoard 子类需要重写 2、3 甚至 100 个方法怎么办？如果我们想创建 TTTBoard 的几个不同子类怎么办？不使用继承会导致方法内部出现\
  \ if-else 语句的爆炸以及代码复杂度的大幅增加。通过使用子类和重写方法，我们可以将代码更好地组织到单独的类中以处理这些不同的用例。\n\n## super()\
  \ 函数\n\n子类的重写方法通常与父类的方法相似。尽管继承是一种代码重用技术，重写方法可能会导致你将父类方法中的相同代码重写为子类方法的一部分。为了防止这种重复代码，内置的\
  \ super() 函数允许重写方法调用父类中的原始方法。\n\n例如，让我们创建一个名为 HintBoard 的新类，它继承自 TTTBoard。新类重写了\
  \ getBoardStr()，因此在绘制井字棋盘后，如果 X 或 O 在下一次移动中可以获胜，它还会添加一个提示。这意味着 HintBoard 类的 getBoardStr()\
  \ 方法必须执行 TTTBoard 类的 getBoardStr() 方法绘制井字棋盘所需的所有相同任务。无需重复执行此操作的代码，我们可以使用 super()\
  \ 从 HintBoard 类的 getBoardStr() 方法调用 TTTBoard 类的 getBoardStr() 方法。将以下内容添加到你的 tictactoe_oop.py\
  \ 文件末尾：\n\n```python\nclass HintBoard(TTTBoard):\n    def getBoardStr(self):\n \
  \       \"\"\"Return a text-representation of the board with hints.\"\"\"\n    \
  \    boardStr = super().getBoardStr() # Call getBoardStr() in TTTBoard.\n\n    \
  \    xCanWin = False\n        oCanWin = False\n        originalSpaces = self._spaces\
  \ # Backup _spaces.\n        for space in ALL_SPACES: # Check each space:\n    \
  \        # Simulate X moving on this space:\n            self._spaces = copy.copy(originalSpaces)\n\
  \            if self._spaces[space] == BLANK:\n                self._spaces[space]\
  \ = X\n            if self.isWinner(X):\n                xCanWin = True\n      \
  \      # Simulate O moving on this space:\n            self._spaces = copy.copy(originalSpaces)\n\
  \            if self._spaces[space] == BLANK:\n                self._spaces[space]\
  \ = O\n            if self.isWinner(O):\n                oCanWin = True\n      \
  \  if xCanWin:\n            boardStr += '\\nX can win in one more move.'\n     \
  \   if oCanWin:\n            boardStr += '\\nO can win in one more move.'\n    \
  \    self._spaces = originalSpaces\n        return boardStr\n```\n\n首先，super().getBoardStr()\
  \ ① 运行父类 TTTBoard 的 getBoardStr() 方法内部的代码，该代码返回井字棋盘的字符串。我们暂时将此字符串保存在名为 boardStr\
  \ 的变量中。通过重用 TTTBoard 类的 getBoardStr() 创建棋盘字符串后，此方法中的其余代码处理生成提示。getBoardStr() 方法随后将\
  \ xCanWin 和 oCanWin 变量设为 False，并将 self._spaces 字典备份到 originalSpaces 变量 ②。然后一个 for\
  \ 循环遍历从 '1' 到 '9' 的所有棋盘空格。在循环内部，self._spaces 属性被设为 originalSpaces 字典的副本，如果当前循环的空格为空，则在那里放置一个\
  \ X。这模拟了 X 在此空白处进行下一次移动。调用 self.isWinner() 将确定这是否会是获胜移动，如果是，则将 xCanWin 设为 True。然后这些步骤对\
  \ O 重复执行，以查看 O 是否可以通过在此空格移动来获胜 ③。此方法使用 copy 模块来复制 self._spaces 中的字典，因此在 tictactoe.py\
  \ 顶部添加以下行：\n\n```python\nimport copy\n```\n\n接下来，修改 main() 中的这一行，使其实例化 HintBoard\
  \ 对象而不是 TTTBoard 对象：\n\n```\ngameBoard = HintBoard() # Create a TTT board object.\n\
  ```\n\n除了对 main() 的这一行更改外，其余程序与之前完全一样。现在运行程序时，输出看起来会像这样：\n\n```\nWelcome to Tic-Tac-Toe!\n\
  --snip--\n    X| |   1 2 3\n    -+-+\n    | |0   4 5 6\n    -+-+\n    | |X   7 8\
  \ 9\nX can win in one more move.\nWhat is O's move? (1-9)\n5\n\n    X| |   1 2 3\n\
  \    -+-+\n    |O|0   4 5 6\n    -+-+\n    | |X   7 8 9\nO can win in one more move.\n\
  --snip--\nThe game is a tie!\nThanks for playing!\n```\n\n在方法末尾，如果 xCanWin 或 oCanWin\
  \ 为 True，则会在 boardStr 字符串中添加一条相应的额外消息。最后返回 boardStr。\n\n并非每个被重写的方法都需要使用 super()！如果一个类的重写方法与父类中被重写的方法完全不同，则无需使用\
  \ super() 调用被重写的方法。super() 函数在类具有多个父方法时尤其有用，如本章后面“多重继承”部分所述。\n\n## 优先使用组合而非继承\n\n\
  继承是代码复用的绝佳技术，你可能想立即在所有类中使用它。但你可能并不总是希望基类和子类紧密耦合。创建多层继承带来的更多是官僚主义，而非组织性。\n\n虽然你可以使用继承来处理具有“is\
  \ a”关系的类（换句话说，当子类是父类的一种时），但对于具有“has a”关系的类，使用一种称为组合的技术往往更有利。组合是一种类设计技术，即在你的类中包含对象，而不是继承这些对象的类。这就是我们在类中添加\n\
  属性时所做的事情。在使用继承设计类时，优先考虑组合而非继承。这正是我们在本章和上一章的所有示例中所做的，如以下列表所述：\n\n- 一个 WizCoin 对象“拥有”加隆、锡克尔和纳特硬币的数量。\n\
  - 一个 TTTBoard 对象“拥有”九个格子的集合。\n- 一个 MiniBoard 对象“是” TTTBoard 对象，因此它也“拥有”九个格子的集合。\n\
  - 一个 HintBoard 对象“是” TTTBoard 对象，因此它也“拥有”九个格子的集合。\n\n让我们回到上一章的 WizCoin 类。如果我们创建一个新的\
  \ WizardCustomer 类来表示魔法世界中的顾客，这些顾客会携带一定数量的金钱，我们可以用 WizCoin 类来表示。但这两个类之间没有“is a”关系；WizardCustomer\
  \ 对象不是 WizCoin 对象的一种。如果使用继承，可能会产生一些别扭的代码：\n\n```\nimport wizcoin\n\nclass WizardCustomer(wizcoin.WizCoin):\n\
  \    def __init__(self, name):\n        self.name = name\n        super().__init__(0,\
  \ 0, 0)\n\nwizard = WizardCustomer('Alice')\nprint(f'{wizard.name} has {wizard.value()}\
  \ knuts worth of money.')\nprint(f'{wizard.name}\\'s coins weigh {wizard.weightInGrams()}\
  \ grams.')\n```\n\n在这个示例中，WizardCustomer 继承了 WizCoin 对象的 方法，例如 value() 和 weightInGrams()。从技术上讲，继承自\
  \ WizCoin 的 WizardCustomer 可以完成与将 WizCoin 对象作为属性包含的 WizardCustomer 相同的任务。但 wizard.value()\
  \ 和 wizard.weightInGrams() 方法名具有误导性：它们似乎会返回巫师的价值和重量，而不是巫师硬币的价值和重量。此外，如果我们以后想为巫师的体重添加\
  \ weightInGrams() 方法，该方法名已经被占用了。\n\n最好将 WizCoin 对象作为属性，因为巫师顾客“拥有”一定数量的巫师硬币：\n\n\
  ```\nimport wizcoin\n\nclass WizardCustomer:\n    def __init__(self, name):\n  \
  \      self.name = name\n        self.purse = wizcoin.WizCoin(0, 0, 0)\n\nwizard\
  \ = WizardCustomer('Alice')\nprint(f'{wizard.name} has {wizard.purse.value()} knuts\
  \ worth of money.')\nprint(f'{wizard.name}\\'s coins weigh {wizard.purse.weightInGrams()}\
  \ grams.')\n```\n\n与其让 WizardCustomer 类继承 WizCoin 的方法，我们给 WizardCustomer 类一个 purse\
  \ 属性 ①，其中包含一个 WizCoin 对象。当你使用组合时，对 WizCoin 类方法的任何更改都不会改变 WizardCustomer 类的方法。这种技术为两个类的未来设计更改提供了更大的灵活性，并带来更易维护的代码。\n\
  \n## 继承的弊端\n\n继承的主要弊端是，对父类所做的任何未来更改都必然会被其所有子类继承。在大多数情况下，这种紧密耦合正是你想要的。但在某些情况下，你的代码需求无法轻松适应你的继承模型。\n\
  \n例如，假设我们在一个车辆模拟程序中有 Car、Motorcycle 和 LunarRover 类。它们都需要类似的方法，例如 startIgnition()\
  \ 和 changeTire()。与其将这段代码复制粘贴到每个类中，我们可以创建一个父类 Vehicle，并让 Car、Motorcycle 和 LunarRover\
  \ 继承它。现在如果我们需要在 changeTire() 方法中修复一个错误，只有一个地方需要更改。这在我们有数十个继承自 Vehicle 的不同车辆相关类时尤其有帮助。这些类的代码看起来像这样：\n\
  \n```\nclass Vehicle:\n    def __init__(self):\n        print('Vehicle created.')\n\
  \    def startIgnition(self):\n        pass  # Ignition starting code goes here.\n\
  \    def changeTire(self):\n        pass  # Tire changing code goes here.\n\nclass\
  \ Car(Vehicle):\n    def __init__(self):\n        print('Car created.')\n\nclass\
  \ Motorcycle(Vehicle):\n    def __init__(self):\n        print('Motorcycle created.')\n\
  \nclass LunarRover(Vehicle):\n    def __init__(self):\n        print('LunarRover\
  \ created.')\n```\n\n但对 Vehicle 的所有未来更改也会影响这些子类。如果我们需要一个 changeSparkPlug() 方法会怎样？汽车和摩托车有带火花塞的内燃机，但月球漫游车没有。通过优先使用组合而非继承，我们可以创建单独的\
  \ CombustionEngine 和 ElectricEngine 类。然后我们设计 Vehicle 类，使其“has an”\nengine 属性，可以是\
  \ CombustionEngine 或 ElectricEngine 对象，并具有适当的方法：\n\n```\nclass CombustionEngine:\n\
  \    def __init__(self):\n        print('Combustion engine created.')\n    def changeSparkPlug(self):\n\
  \        pass  # Spark plug changing code goes here.\n\nclass ElectricEngine:\n\
  \    def __init__(self):\n        print('Electric engine created.')\n\nclass Vehicle:\n\
  \    def __init__(self):\n        print('Vehicle created.')\n        self.engine\
  \ = CombustionEngine()  # Use this engine by default.\n--snip--\n\nclass LunarRover(Vehicle):\n\
  \    def __init__(self):\n        print('LunarRover created.')\n        self.engine\
  \ = ElectricEngine()\n```\n\n这可能需要重写大量代码，特别是如果你有几个类继承自现有的 Vehicle 类：所有 vehicleObj.changeSparkPlug()\
  \ 调用都需要变为 vehicleObj.engine.changeSparkPlug()，适用于 Vehicle 类或其子类的每个对象。由于如此大规模的更改可能会引入错误，你可能只想让\
  \ LunarVehicle 的 changeSparkPlug() 方法什么都不做。在这种情况下，Pythonic 的做法是在 LunarVehicle 类内部将\
  \ changeSparkPlug 设置为 None：\n\n```\nclass LunarRover(Vehicle):\n    changeSparkPlug\
  \ = None\n    def __init__(self):\n        print('LunarRover created.')\n```\n\n\
  changeSparkPlug = None 行遵循本章后面“类属性”部分所述的语法。这会覆盖从 Vehicle 继承的 changeSparkPlug() 方法，因此使用\
  \ LunarRover 对象调用它会引发错误：\n\n```\n>>> myVehicle = LunarRover()\nLunarRover created.\n\
  >>> myVehicle.changeSparkPlug()\nTraceback (most recent call last):\n  File \"<stdin>\"\
  , line 1, in <module>\nTypeError: 'NoneType' object is not callable\n```\n\n此错误使我们能够快速失败，并在尝试使用\
  \ LunarRover 对象调用此不适当方法时立即发现问题。LunarRover 的任何子类也会继承 changeSparkPlug() 的此 None 值。TypeError:\
  \ 'NoneType' object is not callable 错误消息告诉我们程序员\n\nLunarRover 类有意将 changeSparkPlug()\
  \ 方法设为 None。如果一开始根本不存在这样的方法，我们就会收到 NameError: name 'changeSparkPlug' is not defined\
  \ 错误信息。\n\n继承可能会创建出复杂且自相矛盾的类。相比之下，使用组合通常更为有利。\n\n## isinstance() 和 issubclass()\
  \ 函数\n当我们需要知道一个对象的类型时，可以将对象传递给内置的 type() 函数，如前一章所述。但如果要对对象进行类型检查，使用更灵活的内置函数 isinstance()\
  \ 会更好。isinstance() 函数会在对象是给定类或给定类的子类时返回 True。 在交互式 shell 中输入以下内容：\n\n```\n>>> class\
  \ ParentClass:\n...     pass\n...\n>>> class ChildClass(ParentClass):\n...     pass\n\
  ...\n>>> parent = ParentClass() # Create a ParentClass object.\n>>> child = ChildClass()\
  \ # Create a ChildClass object.\n>>> isinstance(parent, ParentClass)\nTrue\n>>>\
  \ isinstance(parent, ChildClass)\nFalse\n① >>> isinstance(child, ChildClass)\nTrue\n\
  ② >>> isinstance(child, ParentClass)\nTrue\n```\n\n注意，isinstance() 表明 child 中的 ChildClass\
  \ 对象是 ChildClass 的实例①，也是 ParentClass 的实例②。这是有道理的，因为 ChildClass 对象“是一种” ParentClass\
  \ 对象。\n\n你也可以将一个类对象的元组作为第二个参数传入，以检查第一个参数是否属于该元组中的任意一个类：\n\n```\n>>> isinstance(42,\
  \ (int, str, bool)) # True if 42 is an int, str, or bool.\nTrue\n```\n\n使用频率较低的内置函数\
  \ issubclass() 可以判断第一个参数传递的类对象是否是第二个参数传递的类对象的子类（或同一类）：\n\n```\n>>> issubclass(ChildClass,\
  \ ParentClass) # ChildClass subclasses ParentClass.\nTrue\n>>> issubclass(ChildClass,\
  \ str) # ChildClass doesn't subclass str.\nFalse\n>>> issubclass(ChildClass, ChildClass)\
  \ # ChildClass is ChildClass.\nTrue\n```\n\n与 isinstance() 类似，你也可以将一个类对象的元组作为 issubclass()\
  \ 的第二个参数，以检查第一个参数是否是对元组中任意一个类的子类。isinstance() 与 issubclass() 的关键区别在于，issubclass()\
  \ 接收两个类对象，而 isinstance() 接收一个对象和一个类对象。\n\n## 类方法\n类方法与类相关联，而不是与单个对象相关联，就像普通方法一样。你可以在代码中通过两个标记来识别类方法：在方法\
  \ def 语句之前使用 @classmethod 装饰器，以及第一个参数使用 cls，如以下示例所示。\n\n```python\nclass ExampleClass:\n\
  \    def exampleRegularMethod(self):\n        print('This is a regular method.')\n\
  \n    @classmethod\n    def exampleClassMethod(cls):\n        print('This is a class\
  \ method.')\n\n# Call the class method without instantiating an object:\nExampleClass.exampleClassMethod()\n\
  \nobj = ExampleClass()\n# Given the above line, these two lines are equivalent:\n\
  obj.exampleClassMethod()\nobj.__class__.exampleClassMethod()\n```\n\ncls 参数的作用类似于\
  \ self，只是 self 引用的是一个对象，而 cls 参数引用的是对象的类。这意味着类方法中的代码无法访问单个对象的属性或调用对象的普通方法。类方法只能调用其他类方法或访问类属性。我们使用名称\
  \ cls 是因为 class 是 Python 的关键字，就像其他关键字 if、while 或 import 一样，我们不能将其用作参数名。我们经常通过类对象调用类属性，如\
  \ ExampleClass.exampleClassMethod()。但我们也可以通过该类的任何对象调用它们，如 obj.exampleClassMethod()。\n\
  \n类方法并不常用。最频繁的用例是提供除 __init__() 之外的替代构造方法。例如，如果构造函数可以接受新对象所需的数据字符串，或包含新对象所需数据的文件名字符串，该怎么办？我们不希望\
  \ __init__() 方法的参数列表冗长且令人困惑。相反，让我们使用类方法来返回一个新对象。\n\n例如，让我们创建一个 AsciiArt 类。如你在第 14\
  \ 章所见，ASCII 艺术使用文本字符来形成图像。\n\n```python\nclass AsciiArt:\n    def __init__(self,\
  \ characters):\n        self._characters = characters\n\n    @classmethod\n    def\
  \ fromFile(cls, filename):\n        with open(filename) as fileObj:\n          \
  \  characters = fileObj.read()\n            return cls(characters)\n\n    def display(self):\n\
  \        print(self._characters)\n\n    # Other AsciiArt methods would go here...\n\
  \nface1 = AsciiArt(' _____ \\n' +\n                 '  . .  \\n' +\n           \
  \      '  \\___/  \\n' +\n                 ' |_____|')\nface1.display()\n\nface2\
  \ = AsciiArt.fromFile('face.txt')\nface2.display()\n```\n\nAsciiArt 类有一个 __init__()\
  \ 方法，可以传入图像的文本字符作为字符串。它还有一个 fromFile() 类方法，可以传入包含 ASCII 艺术的文本文件的字符串文件名。两种方法都会创建\
  \ AsciiArt 对象。\n\n当你运行此程序并且存在包含 ASCII 艺术头像的 face.txt 文件时，输出将如下所示：\n\n![](img/ab52fe24e511e29be73786864ebe0410_331_0.png)\n\
  \n与让 __init__() 做所有事情相比，fromFile() 类方法使你的代码更易于阅读。\n\n类方法的另一个好处是 AsciiArt 的子类可以继承其\
  \ fromFile() 方法（如果需要可以重写它）。这就是为什么我们在 AsciiArt 类的 fromFile() 方法中调用 cls(characters)\
  \ 而不是 AsciiArt(characters)。cls() 调用在 AsciiArt 的子类中无需修改也能工作，因为该方法中没有硬编码 AsciiArt\
  \ 类。但 AsciiArt() 调用总是会调用 AsciiArt 类的 __init__()，而不是子类的 __init__()。你可以把 cls 理解为“表示此类的一个对象”。\n\
  \n请记住，就像普通方法应该在其代码中的某处使用 self 参数一样，类方法也应该始终使用其 cls 参数。如果你的类方法代码从未使用 cls 参数，这表明该类方法可能只是一个函数。\n\
  \n## 类属性\n类属性是一个属于类而不是对象的变量。我们在类内部但在所有方法之外创建类属性，就像我们在 .py 文件中但在所有函数之外创建全局变量一样。以下是名为\
  \ count 的类属性的示例，它跟踪已创建的 CreateCounter 对象数量：\n\n```\nclass CreateCounter:\n    count\
  \ = 0 # This is a class attribute.\n\n    def __init__(self):\n        CreateCounter.count\
  \ += 1\n\nprint('Objects created:', CreateCounter.count)  # Prints 0.\na = CreateCounter()\n\
  b = CreateCounter()\nc = CreateCounter()\nprint('Objects created:', CreateCounter.count)\
  \  # Prints 3.\n```\n\nCreateCounter 类有一个名为 count 的单一类属性。所有 CreateCounter 对象共享此属性，而不是各自拥有独立的\
  \ count 属性。这就是为什么构造函数中的 CreateCounter.count += 1 行可以统计每个创建的 CreateCounter 对象。当你运行此程序时，输出将如下所示：\n\
  \n```\nObjects created: 0\nObjects created: 3\n```\n\n我们很少使用类属性。即使是这个“统计已创建多少个 CreateCounter\
  \ 对象”的示例，也可以通过使用全局变量而不是类属性更简单地实现。\n\n## 静态方法\n静态方法没有 self 或 cls 参数。静态方法本质上只是函数，因为它们无法访问类或其对象的属性或方法。在\
  \ Python 中，几乎不需要使用静态方法。如果你决定使用一个，最好认真考虑直接创建一个普通函数。\n\n我们通过在 def 语句之前放置 @staticmethod\
  \ 装饰器来定义静态方法。以下是静态方法的示例。\n\n\n\n```\nclass ExampleClassWithStaticMethod:\n    @staticmethod\n\
  \    def sayHello():\n        print('Hello!')\n\n# Note that no object is created,\
  \ the class name precedes sayHello():\nExampleClassWithStaticMethod.sayHello()\n\
  ```\n\nExampleClassWithStaticMethod 类中的 sayHello() 静态方法与 sayHello() 函数几乎没有区别。事实上，你可能更喜欢使用函数，因为你可以在不事先输入类名的情况下调用它。\n\
  \n静态方法在没有 Python 灵活语言特性的其他语言中更常见。Python 引入静态方法模仿了其他语言的特性，但并没有提供太多实际价值。\n\n## 何时使用类和静态面向对象特性\n\
  \n你很少需要类方法、类属性和静态方法。它们也容易被过度使用。如果你想“为什么我不能直接使用函数或全局变量代替呢？”，这就是一个提示，说明你可能不需要使用类方法、类属性或静态方法。这本中级书籍之所以涵盖它们，唯一的原因是让你在代码中遇到时能够识别它们，但我并不鼓励你使用它们。如果你在创建自己的框架，并且有一个复杂的类族，而使用该框架的程序员又期望对这些类进行子类化，那么它们可能会有用。但当你编写直接的\
  \ Python 应用时，你很可能不需要它们。\n\n有关这些特性以及为什么需要或不需要它们的更多讨论，请阅读 Phillip J. Eby 的文章“Python\
  \ 不是 Java”，网址为 https://dirtsimple.org/2004/12/python-is-not-java.html，以及 Ryan Tomayko\
  \ 的文章“静态方法的事”，网址为 https://tomayko.com/blog/2004/the-static-method-thing。\n\n## 面向对象的术语\n\
  \nOOP 的解释通常从大量术语开始，例如继承、封装和多态。了解这些术语的重要性被高估了，但你至少应该对其有基本的理解。我已经讲解过继承，所以我在这里描述其他概念。\n\
  \n## 封装\n\n单词封装有两个常见但相关的定义。第一个定义是封装是将相关数据和代码捆绑成一个单一单元。封装意味着打包。这本质上就是类所做的：它们组合相关的属性和方法。例如，我们的\
  \ WizCoin 类将代表纳特、锡克尔和加隆的三个整数封装到单个 WizCoin 对象中。\n\n第二个定义是封装是一种信息隐藏技术，让对象隐藏关于对象如何工作的复杂实现细节。你在第\
  \ 282 页的“私有属性和私有方法”中看到过这一点，其中 BankAccount 对象提供 deposit() 和 withdraw() 方法来隐藏其 _balance\
  \ 属性的处理细节。函数也具有类似的黑盒目的：math.sqrt() 函数如何计算一个数的平方根是隐藏的。你只需要知道该函数返回你传入的数的平方根。\n\n##\
  \ 多态\n\n多态允许将一种类型的对象当作另一种类型的对象来处理。例如，len() 函数返回传入参数的长度。你可以向 len() 传入字符串来查看它有多少个字符，也可以传入列表或字典来分别查看有多少个项目或键值对。这种形式的多态称为泛型函数或参数化多态，因为它可以处理许多不同类型的对象。\n\
  \n多态还指特设多态或运算符重载，其中运算符（如 + 或 *）可以根据其操作对象的类型表现出不同的行为。例如，+ 运算符在操作两个整数或浮点值时执行数学加法，但在操作两个字符串时执行字符串连接。运算符重载在第\
  \ 17 章中介绍。\n\n## 何时不使用继承\n\n使用继承很容易过度设计你的类。正如 Luciano Ramalho 所说，“将对象放置在整洁的层次结构中迎合了我们对秩序的感官；程序员只是为了好玩才这么做。”我们会在单个类或模块中的几个函数就能达到相同效果时，创建类、子类和子子类。但请记住第\
  \ 6 章中 Python 之禅的原则：简单胜于复杂。\n\n使用 OOP 允许你将代码组织成更小的单元（在这种情况下是类），比一个包含数百个函数且定义顺序杂乱的大型\
  \ .py 文件更容易推理。如果有多个函数都操作相同字典或列表数据结构，则继承很有用。在这种情况下，将它们组织成一个类是有益的。\n\n但以下是一些你不需要创建类或使用继承的例子：\n\
  \n- 如果你的类包含的方法从不使用 self 或 cls 参数，请删除该类并用函数代替这些方法。\n- 如果你创建了一个只有一个子类的父类，但从未创建父类对象，你可以将它们合并为一个类。\n\
  - 如果你创建了超过三到四个层级的子类，你可能不必要地使用了继承。将这些子类合并为更少的类。\n\n正如上一章中 tic-tac-toe 程序的非 OOP 和\
  \ OOP 版本所说明的那样，完全有可能不使用类仍然拥有一个运行正常、无 bug 的程序。不要觉得你必须将程序设计成某种复杂的类网络。一个有效简单的解决方案比一个无效复杂的解决方案更好。Joel\
  \ Spolsky 在他的博客文章“不要让宇航员建筑师吓到你”中写到了这一点，网址为 https://www.joelonsoftware.com/2001/04/21/dont-let-architecture-astronauts-scare-you/。\n\
  \n你应该了解像继承这样的面向对象概念的工作原理，因为它们可以帮助你组织代码，使开发和调试更容易。由于 Python 的灵活性，该语言不仅提供 OOP 特性，而且在它们不适合你的程序需求时也不要求你使用它们。\n\
  \n## 多重继承\n\n许多编程语言将类的父类限制为最多一个。Python 通过提供称为多重继承的特性来支持多个父类。例如，我们可以有一个带有 flyInTheAir()\
  \ 方法的 Airplane 类和一个带有 floatOnWater() 方法的 Ship 类。然后我们可以通过在类语句中用逗号分隔列出两者来创建同时继承自 Airplane\
  \ 和 Ship 的 FlyingBoat 类。打开一个新的文件编辑器窗口并将以下内容保存为 flyingboat.py：\n\n```\nclass Airplane:\n\
  \    def flyInTheAir(self):\n        print('Flying...')\n\nclass Ship:\n    def\
  \ floatOnWater(self):\n        print('Floating...')\n\nclass FlyingBoat(Airplane,\
  \ Ship):\n    pass\n```\n\n我们创建的 FlyingBoat 对象将继承 flyInTheAir() 和 floatOnWater()\
  \ 方法，如交互式 shell 所示：\n\n```\n>>> from flyingboat import *\n>>> seaDuck = FlyingBoat()\n\
  >>> seaDuck.flyInTheAir()\nFlying...\n>>> seaDuck.floatOnWater()\nFloating...\n\
  ```\n\n只要父类的方法名不同且不重叠，多重继承就很简单。这类类称为混入。（这只是某种类别的通用术语；Python 没有 mixin 关键字。）但是当我们从多个共享方法名的复杂类继承时会发生什么？\n\
  \n例如，考虑本章前面出现的 MiniBoard 和 HintTTTBoard 井字棋板类。如果我们想要一个类既显示迷你井字棋板又提供提示怎么办？使用多重继承，我们可以重用这些现有类。将以下内容添加到你的\
  \ tictactoe_oop.py 文件末尾，但在调用 main() 函数的 if 语句之前：\n\n```\nclass HybridBoard(HintBoard,\
  \ MiniBoard):\n    pass\n```\n\n这个类里面什么都没有。它通过继承 HintBoard 和 MiniBoard 来重用代码。接下来，修改\
  \ main() 函数中的代码，使其创建一个 HybridBoard 对象：\n\n```\ngameBoard = HybridBoard() # Create\
  \ a TTT board object.\n```\n\n两个父类 MiniBoard 和 HintBoard 都有一个名为 getBoardStr() 的方法，那么\
  \ HybridBoard 继承哪一个呢？运行此程序时，输出显示迷你井字棋板，同时也提供提示：\n\n```\n--snip--\n    X.. 123\n\
  \    .O. 456\n    X.. 789\nX can win in one more move.\n```\n\nPython 似乎神奇地合并了 MiniBoard\
  \ 类的 getBoardStr() 方法和 HintBoard 类的 getBoardStr() 方法以同时实现两者！但这是因为我编写它们时让它们协同工作。事实上，如果你切换\
  \ HybridBoard 类类语句中类的顺序，使其看起来像这样：\n\n```\nclass HybridBoard(MiniBoard, HintBoard):\n\
  ```\n\n你将完全失去提示：\n\n```\n--snip--\n    X.. 123\n    .O. 456\n    X.. 789\n```\n\n\
  要理解为什么会这样，你需要了解 Python 的方法解析顺序（MRO）以及 super() 函数实际的工作方式。\n\n\n\n## 方法解析顺序\n\n我们的井字棋程序现在有四个类来表示棋盘，其中三个定义了\
  \ getBoardStr() 方法，一个继承了 getBoardStr() 方法，如图 16-2 所示。\n\n![](img/ab52fe24e511e29be73786864ebe0410_337_0.png)\n\
  \n图 16-2：我们井字棋板程序中的四个类\n\n当我们在 HybridBoard 对象上调用 getBoardStr() 时，Python 知道 HybridBoard\
  \ 类没有此名称的方法，因此它会检查其父类。但该类有两个父类，两者都有一个 getBoardStr() 方法。哪一个会被调用？\n\n你可以通过检查 HybridBoard\
  \ 类的 MRO 来找到答案，MRO 是 Python 在继承方法或方法调用 super() 函数时检查的类的有序列表。你可以在交互式 shell 中通过调用其\
  \ mro() 方法来查看 HybridBoard 类的 MRO：\n\n```\n>>> from tictactoe_oop import *\n>>> HybridBoard.mro()\n\
  [<class 'tictactoe_oop.HybridBoard'>, <class 'tictactoe_oop.HintBoard'>,\n<class\
  \ 'tictactoe_oop.MiniBoard'>, <class 'tictactoe_oop.TTTBoard'>, <class 'object'>]\n\
  ```\n\n从这个返回值可以看出，当在 HybridBoard 上调用方法时，Python 首先在 HybridBoard 类中检查它。如果没有，Python\
  \ 会检查 HintBoard 类，然后检查 MiniBoard 类，最后检查 TTTBoard 类。每个 MRO 列表的末尾都是内置的 object 类，它是\
  \ Python 中所有类的父类。\n\n对于单继承，确定 MRO 很简单：只需形成父类的链。对于多继承，则更复杂。Python 的 MRO 遵循 C3 算法，其细节超出了本书范围。但你可以通过记住两条规则来确定\
  \ MRO：\n\n- Python 先检查子类再检查父类。\n- Python 按类语句中从左到右列出的顺序检查继承的类。\n\n如果我们在 HybridBoard\
  \ 对象上调用 getBoardStr()，Python 首先检查 HybridBoard 类。然后，由于该类的父类从左到右分别是 HintBoard 和 MiniBoard，Python\
  \ 会检查 HintBoard。该父类有一个 getBoardStr() 方法，因此 HybridBoard 继承并调用它。\n\n但事情并不止于此：接下来，该方法调用\
  \ super().getBoardStr()。Super 是 Python super() 函数的一个有点误导性的名称，因为它不返回父类，而是返回 MRO 中的下一个类。这意味着当我们在\
  \ HybridBoard 对象上调用 getBoardStr() 时，其 MRO 中在 HintBoard 之后的下一个类是 MiniBoard，而不是父类\
  \ TTTBoard。因此，super().getBoardStr() 的调用会调用 MiniBoard 类的 getBoardStr() 方法，该方法返回迷你井字棋盘字符串。super()\
  \ 调用之后 HintBoard 类的 getBoardStr() 中的剩余代码会将提示文本附加到该字符串。\n\n如果我们更改 HybridBoard 类的类语句，使其先列出\
  \ MiniBoard 再列出 HintBoard，其 MRO 将把 MiniBoard 放在 HintBoard 之前。这意味着 HybridBoard 从\
  \ MiniBoard 继承 getBoardStr()，而 MiniBoard 没有对 super() 的调用。这种顺序导致了导致迷你井字棋盘在没有提示的情况下显示的错误：没有\
  \ super() 调用，MiniBoard 类的 getBoardStr() 方法永远不会调用 HintBoard 类的 getBoardStr() 方法。\n\
  \n多继承允许你用少量代码创建大量功能，但很容易导致过度设计、难以理解的代码。优先使用单继承、mixin 类或不使用继承。这些技术通常足以完成程序的任务。\n\n\
  ## 摘要\n\n继承是一种代码重用技术。它允许你创建继承父类方法的子类。你可以重写方法为其提供新代码，也可以使用 super() 函数调用父类中的原始方法。子类与其父类具有“是一种”关系，因为子类的对象是父类对象的一种。\n\
  \n在 Python 中，使用类和继承是可选的。一些程序员认为过度使用继承带来的复杂性不值得其带来的好处。通常使用组合而不是继承更灵活，因为它在某一个类的对象与其它类的对象之间实现“有一个”关系，而不是直接从其它类继承方法。这意味着一个类的对象可以拥有另一个类的对象。例如，Customer\
  \ 对象可以有一个 birthdate 方法，该方法被赋值为 Date 对象，而不是 Customer 类继承 Date。\n\n就像 type() 可以返回传递给它的对象的类型一样，isinstance()\
  \ 和 issubclass() 函数返回传递给它们的对象类型和继承信息。\n\n类可以拥有对象方法和属性，但也可以拥有类方法、类属性和静态方法。虽然这些很少使用，但它们可以实现全局变量和函数无法提供的其它面向对象技术。\n\
  \nPython 允许类从多个父类继承，尽管这可能导致难以理解的代码。super() 函数和类的方 法根据 MRO 确定如何继承方法。你可以在交互式 shell\
  \ 中通过对类调用 mro() 方法来查看类的 MRO。\n\n本章和上一章涵盖了一般的 OOP 概念。在下一章中，我们将探索 Python 特定的 OOP 技术。\n\
  \n### 17\n\n### Pythonic OOP：属性和 Dunder 方法\n\n![](img/ab52fe24e511e29be73786864ebe0410_341_0.png)\n\
  \n许多语言都有 OOP 特性，但 Python 有一些独特的 OOP 特性，包括属性和 dunder 方法。学习如何使用这些 Pythonic 技术可以帮助你编写简洁且可读的代码。\n\
  \n属性允许你在每次读取、修改或删除对象的属性时运行特定代码，以确保对象不会进入无效状态。在其它语言中，这段代码通常称为 *获取器* 或 *设置器*。Dunder\
  \ 方法允许你使用 Python 的内置运算符，如 + 运算符，操作你的对象。这就是你可以将两个 `datetime.timedelta` 对象，如 `datetime.timedelta(days=2)`\
  \ 和 `datetime.timedelta(days=3)`，组合起来创建新的 `datetime.timedelta(days=5)` 对象的方式。\n\n\
  除了使用其它示例外，我们还将通过添加属性并使用 dunder 方法重载运算符，继续扩展我们在第 15 章开始的 `WizCoin` 类。这些特性将使 `WizCoin`\
  \ 对象更具表现力，并在导入 `wizcoin` 模块的任何应用程序中更易于使用。\n\n### 属性\n\n我们在第 15 章中使用的 BankAccount\
  \ 类通过在其名称开头放置下划线将 _balance 属性标记为私有。但请记住，将属性指定为私有只是约定：在 Python 中所有属性技术上都是公开的，这意味着它们可被类外部的代码访问。没有任何东西可以阻止代码故意或恶意地将\
  \ _balance 属性更改为无效值。\n\n但你可以使用属性防止这些私有属性被意外更改为无效值。在 Python 中，属性是具有专门分配的 getter、setter\
  \ 和 deleter 方法的属性，这些方法可以调节属性的读取、更改和删除方式。例如，如果属性只 supposed to have integer values，将其设置为字符串\
  \ '42' 很可能会导致错误。属性会调用 setter 方法运行代码来修复，或至少提供对设置无效值的早期检测。如果你想过“我希望每次访问此属性、用赋值语句修改它或用\
  \ del 语句删除它时都能运行一些代码”，那么你需要使用属性。\n\n### 将属性转换为属性\n\n首先，让我们创建一个具有普通属性而不是属性的简单类。打开一个新的文件编辑器窗口并输入以下代码，保存为\
  \ regularAttributeExample.py：\n\n```\nclass ClassWithRegularAttributes:\n    def\
  \ __init__(self, someParameter):\n        self.someAttribute = someParameter\n\n\
  obj = ClassWithRegularAttributes('some initial value')\nprint(obj.someAttribute)\
  \  # Prints 'some initial value'\nobj.someAttribute = 'changed value'\nprint(obj.someAttribute)\
  \  # Prints 'changed value'\ndel obj.someAttribute  # Deletes the someAttribute\
  \ attribute.\n```\n\n这个 ClassWithRegularAttributes 类有一个名为 someAttribute 的普通属性。__init__()\
  \ 方法将 someAttribute 设置为 'some initial value'，但我们随后直接将属性值更改为 'changed value'。运行此程序时，输出如下：\n\
  \n```\nsome initial value\nchanged value\n```\n\n此输出表明代码可以轻松地将 someAttribute 更改为任何值。使用普通属性的缺点是你的代码可以将\
  \ someAttribute 属性设置为无效值。这种灵活性简单方便，但也意味着 someAttribute 可能被设置为导致错误的一些无效值。\n\n\n\n\
  让我们按照以下步骤使用属性重写这个类，以对名为 someAttribute 的属性执行此操作：\n\n- 1. 使用下划线前缀重命名属性：`_someAttribute`。\n\
  - 2. 创建一个名为 `someAttribute` 的方法，并使用 `@property` 装饰器。这个 getter 方法具有所有方法都有的 `self`\
  \ 参数。\n- 3. 创建另一个名为 `someAttribute` 的方法，并使用 `@someAttribute.setter` 装饰器。这个 setter\
  \ 方法具有名为 `self` 和 `value` 的参数。\n- 4. 创建另一个名为 `someAttribute` 的方法，并使用 `@someAttribute.deleter`\
  \ 装饰器。这个 deleter 方法具有所有方法都有的 `self` 参数。\n\n打开一个新的文件编辑器窗口并输入以下代码，保存为 *propertiesExample.py*：\n\
  \n```python\nclass ClassWithProperties:\n    def __init__(self):\n        self.someAttribute\
  \ = 'some initial value'\n\n    @property\n    def someAttribute(self): # This is\
  \ the \"getter\" method.\n        return self._someAttribute\n\n    @someAttribute.setter\n\
  \    def someAttribute(self, value): # This is the \"setter\" method.\n        self._someAttribute\
  \ = value\n\n    @someAttribute.deleter\n    def someAttribute(self): # This is\
  \ the \"deleter\" method.\n        del self._someAttribute\n\nobj = ClassWithProperties()\n\
  print(obj.someAttribute) # Prints 'some initial value'\nobj.someAttribute = 'changed\
  \ value'\nprint(obj.someAttribute) # Prints 'changed value'\ndel obj.someAttribute\
  \ # Deletes the _someAttribute attribute.\n```\n\n此程序的输出与 *regularAttributeExample.py*\
  \ 代码相同，因为它们本质上执行相同的任务：打印对象的初始属性，然后更新该属性并再次打印。\n\n但请注意，类外部的代码从不直接访问 `_someAttribute`\
  \ 属性（毕竟它是私有的）。相反，外部代码访问的是 `someAttribute` 属性。这个属性的实际构成有点抽象：getter、setter 和 deleter\
  \ 方法组合在一起构成属性。当我们将名为 `someAttribute` 的属性重命名为 `_someAttribute`，同时为其创建 getter、setter\
  \ 和 deleter 方法时，我们称之为 `someAttribute` 属性。\n\n在这种情况下，_someAttribute 属性被称为 *后备字段*\
  \ 或 *后备变量*，它是属性所基于的属性。大多数，但并非所有属性都使用后备变量。我们将在本章后面的“只读属性”中创建一个没有后备变量的属性。\n\n你永远不会在代码中调用\
  \ getter、setter 和 deleter 方法，因为 Python 会在以下情况下为你执行：\n\n- 当 Python 运行访问属性的代码时，例如\
  \ `print(obj.someAttribute)`，在幕后它会调用 getter 方法并使用返回的值。\n- 当 Python 运行带有属性的赋值语句时，例如\
  \ `obj.someAttribute = 'changed value'`，在幕后它会调用 setter 方法，并将 'changed value' 字符串作为\
  \ value 参数传递。\n- 当 Python 运行带有属性的 `del` 语句时，例如 `del obj.someAttribute`，在幕后它会调用 deleter\
  \ 方法。\n\n属性的 getter、setter 和 deleter 方法中的代码直接作用于后备变量。你不希望 getter、setter 或 deleter\
  \ 方法作用于属性本身，因为这可能导致错误。在一个可能的示例中，getter 方法会访问属性，导致 getter 方法调用自身，这会使其再次访问属性，导致它再次调用自身，依此类推直到程序崩溃。打开一个新的文件编辑器窗口并输入以下代码，保存为\
  \ badPropertyExample.py：\n\n```\nclass ClassWithBadProperty:\n    def __init__(self):\n\
  \        self.someAttribute = 'some initial value'\n\n    @property\n    def someAttribute(self):\
  \  # This is the \"getter\" method.\n        # We forgot the _ underscore in `self._someAttribute\
  \ here`, causing\n        # us to use the property and call the getter method again:\n\
  \        return self.someAttribute  # This calls the getter again!\n\n    @someAttribute.setter\n\
  \    def someAttribute(self, value):  # This is the \"setter\" method.\n       \
  \ self._someAttribute = value\n\nobj = ClassWithBadProperty()\nprint(obj.someAttribute)\
  \  # Error because the getter calls the getter.\n```\n\n当你运行此代码时，getter 会不断调用自身，直到\
  \ Python 引发 RecursionError 异常：\n\n```\nTraceback (most recent call last):\n    File\
  \ \"badPropertyExample.py\", line 16, in <module>\n        print(obj.someAttribute)\
  \  # Error because the getter calls the getter.\n    File \"badPropertyExample.py\"\
  , line 9, in someAttribute\n        return self.someAttribute  # This calls the\
  \ getter again!\n```\n\n```\nFile \"badPropertyExample.py\", line 9, in someAttribute\n\
  \    return self.someAttribute  # This calls the getter again!\nFile \"badPropertyExample.py\"\
  , line 9, in someAttribute\n    return self.someAttribute  # This calls the getter\
  \ again!\n[Previous line repeated 996 more times]\nRecursionError: maximum recursion\
  \ depth exceeded\n```\n\n为了防止这种递归，你的 getter、setter 和 deleter 方法内部的代码应始终作用于后备变量（其名称应具有下划线前缀），而不是属性。这些方法外部的代码应使用属性，尽管与私有访问下划线前缀约定一样，没有什么能阻止你直接编写作用于后备变量的代码。\n\
  \n## 使用 Setter 验证数据\n\n使用属性最常见需求是验证数据或确保其格式符合你的要求。你可能不希望类外部的代码能够将属性设置为任意值；这可能导致错误。你可以使用属性添加检查，以确保只有有效值被赋给属性。这些检查让你能在代码开发早期捕获错误，因为它们会在无效值被设置时立即引发异常。\n\
  \n让我们更新第 15 章中的 wizcoin.py 文件，将 galleons、sickles 和 knuts 属性转换为属性。我们将更改这些属性的 setter，使其仅接受正整数。我们的\
  \ WizCoin 对象表示硬币数量，你不能拥有半枚硬币或少于零的硬币数量。如果类外部的代码尝试将 galleons、sickles 或 knuts 属性设置为无效值，我们将引发\
  \ WizCoinException 异常。\n\n打开你在第 15 章保存的 wizcoin.py 文件并将其修改如下：\n\n```\nclass WizCoinException(Exception):\n\
  \    \"\"\"The wizcoin module raises this when the module is misused.\"\"\"\n  \
  \  pass\n\nclass WizCoin:\n    def __init__(self, galleons, sickles, knuts):\n \
  \       \"\"\"Create a new WizCoin object with galleons, sickles, and knuts.\"\"\
  \"\n        self.galleons = galleons\n        self.sickles  = sickles\n        self.knuts\
  \    = knuts\n        # NOTE: __init__() methods NEVER have a return statement.\n\
  \n--snip--\n\n    @property\n    def galleons(self):\n        \"\"\"Returns the\
  \ number of galleon coins in this object.\"\"\"\n        return self._galleons\n\
  ```\n\n```\n@galleons.setter\ndef galleons(self, value):\n    if not isinstance(value,\
  \ int):\n        raise WizCoinException('galleons attr must be set to an int, not\
  \ a ' + value.__class__.__qualname__)\n    if value < 0:\n        raise WizCoinException('galleons\
  \ attr must be a positive int, not ' + value.__class__.__qualname__)\n    self._galleons\
  \ = value\n```\n\n--snip--\n\n新的更改添加了一个继承自 Python 内置 Exception 类的 WizCoinException\
  \ 类 ①。类的 docstring 描述了 wizcoin 模块 ② 如何使用它。这是 Python 模块的最佳实践：WizCoin 类的对象在被误用时可以引发它。这样，如果\
  \ WizCoin 对象引发其他异常类，如 ValueError 或 TypeError，这很可能表示 WizCoin 类存在错误。\n\n在 __init__()\
  \ 方法中，我们将 self.galleons、self.sickles 和 self.knuts 属性 ③ 设置为相应的参数。\n\n在文件的底部，在 total()\
  \ 和 weight() 方法之后，我们为 self._galleons 属性添加了一个 getter ④ 和 setter 方法 ⑤。getter 只是返回\
  \ self._galleons 中的值。setter 检查分配给 galleons 属性的值是否为整数 ⑥ 且为正数 ⑧。如果任一检查失败，将引发 WizCoinException\
  \ 并附带错误消息。只要代码始终使用 galleons 属性，此检查就能防止 _galleons 被设置为无效值。\n\n所有 Python 对象都自动具有一个\
  \ __class__ 属性，它引用对象的类对象。换句话说，value.__class__ 与 type(value) 返回的类对象相同。该类对象具有一个名为\
  \ __qualname__ 的属性，它是类名称的字符串。（具体来说，它是类的限定名称，其中包括类对象嵌套在其中的任何类的名称。嵌套类用途有限，超出本书范围。）例如，如果\
  \ value 存储了 datetime.date(2021, 1, 1) 返回的 date 对象，则 value.__class__.__qualname__\
  \ 将是字符串 'date'。异常消息使用 value.__class__.__qualname__ ⑦ 来获取值对象名称的字符串。类名使错误消息对阅读它的程序员更有用，因为它不仅标识\
  \ value 参数不是正确的类型，还标识了它是什么类型以及它应该是哪种类型。\n\n你需要复制 _galleons 的 getter 和 setter 代码以用于\
  \ _sickles 和 _knuts 属性。它们代码相同，只是使用 _sickles 和 _knuts 属性作为后备变量，而不是 _galleons。\n\n\
  ## 只读属性\n\n你的对象可能需要一些只读属性，这些属性不能使用赋值运算符 = 设置。你可以通过省略 setter 和 deleter 方法来使属性只读。\n\
  \n\n\n例如，WizCoin 类中的 total() 方法返回该对象以 knuts 为单位的值。我们可以将它从一个普通方法改为只读属性，因为没有合理的方式来设置\
  \ WizCoin 对象的 total。毕竟，如果你将 total 设置为整数 1000，这是指 1,000 knuts？还是指 1 galleon 和 493\
  \ knuts？还是指其他某种组合？因此，我们将通过向 wizcoin.py 文件中添加加粗的代码来使 total 成为只读属性：\n\n```\n@property\n\
  def total(self):\n    \"\"\"Total value (in knuts) of all the coins in this WizCoin\
  \ object.\"\"\"\n    return (self.galleons * 17 * 29) + (self.sickles * 29) + (self.knuts)\n\
  \n# Note that there is no setter or deleter method for `total`.\n```\n\n在 total()\
  \ 前面添加 @property 函数装饰器后，每当访问 total 时，Python 都会调用 total() 方法。因为没有 setter 或 deleter\
  \ 方法，如果任何代码尝试通过赋值或 del 语句分别修改或删除 total，Python 会引发 AttributeError。请注意，total 属性的值取决于\
  \ galleons、sickles 和 knuts 属性中的值：该属性不是基于名为 _total 的备份变量。 在交互式 shell 中输入以下内容：\n\n\
  ```\n>>> import wizcoin\n>>> purse = wizcoin.WizCoin(2, 5, 10)\n>>> purse.total\n\
  1141\n>>> purse.total = 1000\nTraceback (most recent call last):\n  File \"<stdin>\"\
  , line 1, in <module>\nAttributeError: can't set attribute\n```\n\n你可能不喜欢程序在尝试更改只读属性时立即崩溃，但这种行为比允许更改只读属性更可取。你的程序能够修改只读属性肯定会在程序运行期间在某个时刻导致错误。如果该错误在修改只读属性之后很久才发生，就很难追踪到原始原因。立即崩溃可以让你更早地注意到问题。\n\
  \n不要将只读属性与常量变量混淆。常量变量全部大写，依赖于程序员不去修改它们。它们的值 supposed 在程序运行期间保持恒定不变。只读属性与任何属性一样，与对象相关联。只读属性不能直接设置或删除。但它可能会计算出一个变化的值。我们的\
  \ WizCoin 类的 total 属性会随着其 galleons、sickles 和 knuts 属性的变化而变化。\n\n## 何时使用属性\n\n正如你在前面的章节中看到的，属性提供了对如何使用类的属性的更多控制，并且它们是编写代码的\
  \ Pythonic 方式。名称类似于 `getSomeAttribute()` 或 `setSomeAttribute()` 的方法表明你可能应该改用属性。\n\
  \n这并不是说以 *获取* 或 *设置* 开头的 *每个* 方法实例都应该立即被属性替换。有些情况下，即使方法名称以 *获取* 或 *设置* 开头，你也应该使用方法。以下是一些示例：\n\
  \n- 对于耗时超过一两秒的慢速操作——例如，下载或上传文件\n- 对于具有副作用的操作，例如对其他属性或对象的更改\n- 对于需要向 get 或 set 操作传递额外参数的操作——例如，在像\
  \ `emailObj.getFileAttachment(filename)` 这样的方法调用中\n\n程序员通常将方法视为动词（因为方法执行某些操作），而将属性和属性视为名词（因为它们代表某些项目或对象）。如果你的代码似乎更像是在执行获取或设置的操作，而不是获取或设置一个项目，那么最好使用\
  \ getter 或 setter 方法。最终，这个决定取决于作为程序员的你认为听起来是否正确。\n\n使用 Python 属性的巨大优势在于，你在最初创建类时不必使用它们。你可以使用普通属性，如果以后需要属性，可以在不破坏类外部任何代码的情况下将属性转换为属性。当我们使用属性的名称创建属性时，我们可以使用下划线前缀重命名属性，我们的程序仍将像以前一样工作。\n\
  \n## Python 的 Dunder 方法\n\nPython 有几个以双下划线开头和结尾的特殊方法名称，简称为 *双下划线*。这些方法被称为 *双下划线方法*、*特殊方法*\
  \ 或 *魔法方法*。你已经熟悉 `__init__()` dunder 方法名称，但 Python 还有更多。我们经常将它们用于 *运算符重载*——即添加自定义行为，允许我们使用类的对象与\
  \ Python 运算符，如 + 或 >=。其他 dunder 方法让类的对象能够与 Python 的内置函数一起工作，例如 `len()` 或 `repr()`。\n\
  \n与 `__init__()` 或属性的 getter、setter 和 deleter 方法一样，你几乎从不直接调用 dunder 方法。当你使用运算符或内置函数使用对象时，Python\
  \ 会在幕后调用它们。例如，如果你为类创建名为 `__len__()` 或 `__repr__()` 的方法，当该类的对象分别传递给 len() 或 repr()\
  \ 函数时，它们会在幕后被调用。这些方法在官方 Python 文档 https://docs.python.org/3/reference/datamodel.html\
  \ 中在线记录。\n\n随着我们探索不同类型的 dunder 方法，我们将扩展我们的 WizCoin 类以利用它们。\n\n### 字符串表示 Dunder 方法\n\
  \n你可以使用 __repr__() 和 __str__() dunder 方法来创建 Python 通常不知道如何处理的对象的字符串表示。通常，Python\
  \ 以两种方式创建对象的字符串表示。repr（读作 \"repper\"）字符串是一段 Python 代码字符串，运行后会创建对象的副本。str（读作 \"stir\"\
  ）字符串是一个人类可读的字符串，提供关于对象的清晰、有用信息。repr 和 str 字符串分别由 repr() 和 str() 内置函数返回。例如，输入以下内容到交互式\
  \ shell 以查看 datetime.date 对象的 repr 和 str 字符串：\n\n```\n>>> import datetime\n>>> newyears\
  \ = datetime.date(2021, 1, 1)\n>>> repr(newyears)\n'datetime.date(2021, 1, 1)'\n\
  >>> str(newyears)\n'2021-01-01'\n>>> newyears\ndatetime.date(2021, 1, 1)\n```\n\n\
  在这个示例中，datetime.date 对象 ② 的 'datetime.date(2021, 1, 1)' repr 字符串 literally 是一段创建该对象\
  \ ① 副本的 Python 代码字符串。这个副本提供了对象的精确表示。另一方面，datetime.date 对象 ③ 的 '2021-01-01' str 字符串是以人类易读的方式表示对象值的字符串。如果我们\
  \ simply 将对象输入到交互式 shell ④，它会显示 repr 字符串。对象的 str 字符串通常显示给用户，而对象的 repr 字符串用于技术上下文，例如错误消息和日志文件。\n\
  \nPython 知道如何显示其内置类型的对象，例如整数和字符串。但它无法知道如何显示我们创建的类的对象。如果 repr() 不知道如何为对象创建 repr 或\
  \ str 字符串，按惯例字符串将被括在角括号中并包含对象的内存地址和类名：'<wizcoin.WizCoin object at 0x00000212B4148EE0>'。要为\
  \ WizCoin 对象创建这种字符串，请在交互式 shell 中输入以下内容：\n\n```\n>>> import wizcoin\n>>> purse =\
  \ wizcoin.WizCoin(2, 5, 10)\n>>> str(purse)\n'<wizcoin.WizCoin object at 0x00000212B4148EE0>'\n\
  >>> repr(purse)\n'<wizcoin.WizCoin object at 0x00000212B4148EE0>'\n>>> purse\n<wizcoin.WizCoin\
  \ object at 0x00000212B4148EE0>\n```\n\n这些字符串不太可读或有用，因此我们可以通过实现 __repr__() 和 __str__()\
  \ dunder 方法来告诉 Python 使用什么字符串。__repr__() 方法指定当对象传递给 repr() 内置函数时 Python 应返回什么字符串，而\
  \ __str__() 方法指定当对象传递给 str() 内置函数时 Python 应返回什么字符串。将以下内容添加到 wizcoin.py 文件的末尾：\n\n\
  ```\n--snip--\ndef __repr__(self):\n    \"\"\"Returns a string of an expression\
  \ that re-creates this object.\"\"\"\n    return f'{self.__class__.__qualname__}({self.galleons},\
  \ {self.sickles}, {self.knuts})'\n\ndef __str__(self):\n    \"\"\"Returns a human-readable\
  \ string representation of this object.\"\"\"\n    return f'{self.galleons}g, {self.sickles}s,\
  \ {self.knuts}k'\n```\n\n当我们将 purse 传递给 repr() 和 str() 时，Python 调用 __repr__() 和\
  \ __str__() dunder 方法。我们在代码中不调用 dunder 方法。请注意，包含对象在花括号中的 f-string 将隐式调用 str() 来获取对象的\
  \ str 字符串。例如，在交互式 shell 中输入以下内容：\n\n```\n>>> import wizcoin\n>>> purse = wizcoin.WizCoin(2,\
  \ 5, 10)\n>>> repr(purse)  # Calls WizCoin's __repr__() behind the scenes.\n'WizCoin(2,\
  \ 5, 10)'\n>>> str(purse)  # Calls WizCoin's __str__() behind the scenes.\n'2g,\
  \ 5s, 10k'\n>>> print(f'My purse contains {purse}.')  # Calls WizCoin's __str__().\n\
  My purse contains 2g, 5s, 10k.\n```\n\n当我们将 purse 中的 WizCoin 对象传递给 repr() 和 str()\
  \ 函数时，在幕后 Python 调用 WizCoin 类的 __repr__() 和 __str__() 方法。我们编程这些方法以返回更可读和有用的字符串。如果你将\
  \ 'WizCoin(2, 5, 10)' repr 字符串的文本输入到交互式 shell，它将创建一个具有与 purse 中的对象相同属性的 WizCoin\
  \ 对象。str 字符串是对象值更人类可读的表示：'2g, 5s, 10k'。如果你在 f-string 中使用 WizCoin 对象，Python 使用对象的\
  \ str 字符串。\n\n如果 WizCoin 对象复杂到无法通过单个构造函数调用创建其副本，我们会将 repr 字符串括在角括号中以表示它不是 Python\
  \ 代码。这就是通用表示字符串，例如 '<wizcoin.WizCoin object at 0x00000212B4148EE0>' 所做的。将此字符串输入到交互式\
  \ shell 会引发 SyntaxError，因此它不可能被误认为是创建对象副本的 Python 代码。\n\n在 __repr__() 方法内部，我们使用\
  \ self.__class__.__qualname__ 而不是硬编码字符串 'WizCoin'；因此，如果我们对 WizCoin 进行子类化，继承的 __repr__()\
  \ 方法将使用子类名称而不是 'WizCoin'。此外，如果我们重命名 WizCoin 类，__repr__() 方法将自动使用更新后的名称。\n\n\n\n\
  但是 WizCoin 对象的 str 字符串以整洁、简洁的形式向我们展示了属性值。我强烈建议你在所有类中实现 __repr__() 和 __str__()。\n\
  \n## repr 字符串中的敏感信息\n\n如前所述，我们通常向用户显示 str 字符串，而在技术上下文（如日志文件）中使用 repr 字符串。但是，如果你创建的对象包含敏感信息，例如密码、医疗细节或个人身份信息，则\
  \ repr 字符串可能会导致安全问题。如果是这种情况，请确保 __repr__() 方法不会在其返回的字符串中包含这些信息。当软件崩溃时，通常会设置包含变量内容到日志文件中以帮助调试。\
  \ often，这些日志文件并未被视为敏感信息。在多起安全事件中，公开共享的日志文件无意中包含了密码、信用卡号、家庭地址和其他敏感信息。在为你的类编写 __repr__()\
  \ 方法时请记住这一点。\n\n## 数值双下划线方法\n\n数值双下划线方法，也称为数学双下划线方法，重载了 Python 的数学运算符，例如 +、-、*、/\
  \ 等。目前，我们无法使用 + 运算符将两个 WizCoin 对象相加。如果尝试这样做，Python 将引发 TypeError 异常，因为它不知道如何添加 WizCoin\
  \ 对象。要查看此错误，请在交互式 shell 中输入以下内容：\n\n```\n>>> import wizcoin\n>>> purse = wizcoin.WizCoin(2,\
  \ 5, 10)\n>>> tipJar = wizcoin.WizCoin(0, 0, 37)\n>>> purse + tipJar\nTraceback\
  \ (most recent call last):\n  File \"<stdin>\", line 1, in <module>\nTypeError:\
  \ unsupported operand type(s) for +: 'WizCoin' and 'WizCoin'\n```\n\n不要为 WizCoin\
  \ 类编写 addWizCoin() 方法，你可以使用 __add__() 双下划线方法使 WizCoin 对象与 + 运算符一起工作。将以下内容添加到 wizcoin.py\
  \ 文件的末尾：\n\n```\n--snip--\n    def __add__(self, other):\n        \"\"\"Adds the\
  \ coin amounts in two WizCoin objects together.\"\"\"\n        if not isinstance(other,\
  \ WizCoin):\n            return NotImplemented\n\n        return WizCoin(other.galleons\
  \ + self.galleons, other.sickles + self.sickles, other.knuts + self.knuts)\n```\n\
  \n当 WizCoin 对象位于 + 运算符的左侧时，Python 会调用 __add__() 方法①，并将 + 运算符右侧的值作为 other 参数传入。（参数可以命名为任何名称，但\
  \ other 是惯例。）\n\n请记住，你可以向 __add__() 方法传递任何类型的对象，因此该方法必须包含类型检查②。例如，将整数或浮点数添加到 WizCoin\
  \ 对象是没有意义的，因为我们不知道它应该添加到 galleons、sickles 还是 knuts 金额中。\n\n__add__() 方法创建一个新的 WizCoin\
  \ 对象，其金额等于 self 和 other 的 galleons、sickles 和 knuts 属性之和③。因为这三个属性包含整数，所以我们可以在它们上使用\
  \ + 运算符。现在我们已经为 WizCoin 类重载了 + 运算符，可以在 WizCoin 对象上使用 + 运算符。\n\n像这样重载 + 运算符使我们能够编写更易读的代码。例如，在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import wizcoin\n>>> purse = wizcoin.WizCoin(2, 5, 10)\
  \  # Create a WizCoin object.\n>>> tipJar = wizcoin.WizCoin(0, 0, 37)  # Create\
  \ another WizCoin object.\n>>> purse + tipJar  # Creates a new WizCoin object with\
  \ the sum amount.\nWizCoin(2, 5, 47)\n```\n\n如果为 other 传递了错误类型的对象，双下划线方法不应引发异常，而应返回内置值\
  \ NotImplemented。例如，在以下代码中，other 是一个整数：\n\n```\n>>> import wizcoin\n>>> purse =\
  \ wizcoin.WizCoin(2, 5, 10)\n>>> purse + 42  # WizCoin objects and integers can't\
  \ be added together.\nTraceback (most recent call last):\n  File \"<stdin>\", line\
  \ 1, in <module>\nTypeError: unsupported operand type(s) for +: 'WizCoin' and 'int'\n\
  ```\n\n返回 NotImplemented 会向 Python 发出信号，让它尝试调用其他方法来执行此操作。（请参阅本章后面的“反射数值双下划线方法”了解更多详情。）在幕后，Python\
  \ 使用 42 调用 __add__() 方法作为 other 参数，这也返回 NotImplemented，导致 Python 引发 TypeError。\n\
  \n虽然我们不应该能够将整数加到 WizCoin 对象上或从中减去整数，但通过定义 __mul__() 双下划线方法来允许代码将 WizCoin 对象乘以正整数是有意义的。将以下内容添加到\
  \ wizcoin.py 的末尾：\n\n```\n--snip--\n    def __mul__(self, other):\n        \"\"\"\
  Multiplies the coin amounts by a non-negative integer.\"\"\"\n        if not isinstance(other,\
  \ int):\n            return NotImplemented\n        if other < 0:\n            #\
  \ Multiplying by a negative int results in negative\n            # amounts of coins,\
  \ which is invalid.\n            raise WizCoinException('cannot multiply with negative\
  \ integers')\n        return WizCoin(self.galleons * other, self.sickles * other,\
  \ self.knuts * other)\n```\n\n此 __mul__() 方法允许你将 WizCoin 对象乘以正整数。如果 other 是整数，则是\
  \ __mul__() 方法期望的数据类型，我们不应返回 NotImplemented。但如果该整数为负数，将 WizCoin 对象乘以它会导致我们的 WizCoin\
  \ 对象中出现负面额的硬币。因为这违背了我们对该类的设计，所以我们会引发带有描述性错误消息的 WizCoinException。\n\n> 注\n> 你不应在数值双下划线方法中更改\
  \ self 对象。相反，该方法应始终创建并返回一个新对象。+ 以及其他数值运算符始终被期望计算为一个新对象，而不是就地修改对象的值。\n\n输入以下内容到交互式\
  \ shell 以查看 __mul__() 双下划线方法的作用：\n\n```\n>>> import wizcoin\n>>> purse = wizcoin.WizCoin(2,\
  \ 5, 10)  # Create a WizCoin object.\n>>> purse * 10  # Multiply the WizCoin object\
  \ by an integer.\nWizCoin(20, 50, 100)\n>>> purse * -2  # Multiplying by a negative\
  \ integer causes an error.\nTraceback (most recent call last):\n  File \"<stdin>\"\
  , line 1, in <module>\n  File \"C:\\Users\\AI\\Desktop\\wizcoin.py\", line 86, in\
  \ __mul__\n    raise WizCoinException('cannot multiply with negative integers')\n\
  wizcoin.WizCoinException: cannot multiply with negative integers\n```\n\n表 17-1\
  \ 显示了数值双下划线方法的完整列表。你并不总是需要为你的类实现所有这些方法。哪些方法相关由你决定。\n\n### 表 17-1：数值双下划线方法\n\n| 双下划线方法\
  \ | 操作 | 运算符或内置函数 |\n|---|---|---|\n| __add__() | 加法 | + |\n| __sub__() | 减法 | -\
  \ |\n| __mul__() | 乘法 | * |\n| __matmul__() | 矩阵乘法 (new in Python 3.5) | @ |\n|\
  \ __truediv__() | 除法 | / |\n| __floordiv__() | 整数除法 | // |\n| __mod__() | 取模 | %\
  \ |\n| __divmod__() | 除法和取模 | divmod() |\n\n(续)\n\n### 表 17-1：数值双下划线方法（续）\n\n| 双下划线方法\
  \ | 操作 | 运算符或内置函数 |\n|---|---|---|\n| __pow__() | 指数运算 | **, pow() |\n| __lshift__()\
  \ | 左移 | << |\n| __rshift__() | 右移 | >> |\n| __and__() | 按位与 | & |\n| __or__() |\
  \ 按位或 | | |\n| __xor__() | 按位异或 | ^ |\n| __neg__() | 取负 | Unary -, as in -42 |\n\
  | __pos__() | 正号 | Unary +, as in +42 |\n| __abs__() | 绝对值 | abs() |\n| __invert__()\
  \ | 按位取反 | ~ |\n| __complex__() | 复数形式 | complex() |\n| __int__() | 整数形式 | int()\
  \ |\n| __float__() | 浮点数形式 | float() |\n| __bool__() | 布尔形式 | bool() |\n| __round__()\
  \ | 四舍五入 | round() |\n| __trunc__() | 截断 | math.trunc() |\n| __floor__() | 向下取整\
  \ | math.floor() |\n| __ceil__() | 向上取整 | math.ceil() |\n\n其中一些方法与我们的 WizCoin 类相关。尝试编写自己的\
  \ __sub__()、__pow__()、__int__()、__float__() 和 __bool__() 方法的实现。你可以在 https://aulbor.com/wizcoinfull\
  \ 查看一个实现示例。数值双下划线方法的完整文档在 Python 文档的 https://docs.python.org/3/reference/datamodel.html#emulating-numeric-types\
  \ 中。\n\n数值双下划线方法允许你的类的对象使用 Python 的内置数学运算符。如果你正在编写名称类似于 multiplyBy()、convertToInt()\
  \ 或类似描述通常由现有运算符或内置函数完成的任务的方法，请使用数值双下划线方法（以及下一两节中描述的反射和就地双下划线方法）。\n\n## 反射数值双下划线方法\n\
  \n当对象位于数学运算符左侧时，Python 会调用数值双下划线方法。但当对象位于数学运算符右侧时，它会调用反射数值双下划线方法（也称为反向或右手双下划线方法）。\n\
  \n反射数值双下划线方法很有用，因为使用你的类的程序员并不总是将对象写在运算符的左侧，这可能导致意外的行为。例如，让我们考虑\n\n当 purse 包含一个 WizCoin\
  \ 对象，且 Python 计算表达式 2 * purse 时会发生什么，其中 purse 位于运算符的右侧：\n\n- 1. 因为 2 是一个整数，所以会调用\
  \ int 类的 `__mul__()` 方法，并将 purse 作为另一个参数传入。\n- 2. int 类的 `__mul__()` 方法不知道如何处理 WizCoin\
  \ 对象，因此返回 NotImplemented。\n- 3. Python 此时不会立即引发 TypeError。因为 purse 包含一个 WizCoin\
  \ 对象，所以会调用 WizCoin 类的 `__rmul__()` 方法，并将 2 作为另一个参数传入。\n- 4. 如果 `__rmul__()` 返回 NotImplemented，Python\
  \ 会引发 TypeError。\n\n否则，`__rmul__()` 返回的对象就是表达式 2 * purse 的求值结果。\n\n但表达式 purse *\
  \ 2，其中 purse 位于运算符的左侧，工作原理不同：\n\n- 1. 因为 purse 包含一个 WizCoin 对象，所以会调用 WizCoin 类的\
  \ `__mul__()` 方法，并将 2 作为另一个参数传入。\n- 2. `__mul__()` 方法创建一个新的 WizCoin 对象并返回它。\n- 3.\
  \ 这个返回的对象就是表达式 purse * 2 的求值结果。\n\n数字 dunder 方法和反射数字 dunder 方法如果可交换则代码相同。可交换运算，如加法，正向和反向结果相同：3\
  \ + 2 与 2 + 3 相同。但其他运算不可交换：3 − 2 不等于 2 − 3。任何可交换运算在调用反射数字 dunder 方法时都可以直接调用原始的数字\
  \ dunder 方法。例如，将以下内容添加到 wizcoin.py 文件末尾，以为乘法运算定义一个反射数字 dunder 方法：\n\n```\n--snip--\n\
  \    def __rmul__(self, other):\n        \"\"\"Multiplies the coin amounts by a\
  \ non-negative integer.\"\"\"\n        return self.__mul__(other)\n```\n\n将整数与 WizCoin\
  \ 对象相乘是可交换的：2 * purse 与 purse * 2 相同。无需复制粘贴 `__mul__()` 中的代码，我们只需调用 self.__mul__()\
  \ 并传入另一个参数即可。\n\n更新 wizcoin.py 后，通过在交互式 shell 中输入以下内容来练习使用反射乘法 dunder 方法：\n\n```\n\
  >>> import wizcoin\n>>> purse = wizcoin.WizCoin(2, 5, 10)\n>>> purse * 10  # Calls\
  \ __mul__() with 10 for the `other` parameter.\nWizCoin(20, 50, 100)\n>>> 10 * purse\
  \  # Calls __rmul__() with 10 for the `other` parameter.\nWizCoin(20, 50, 100)\n\
  ```\n\n请记住，在表达式 10 * purse 中，Python 首先调用 int 类的 __mul__() 方法，以查看整数是否可以与 WizCoin\
  \ 对象相乘。当然，Python 内置的 int 类对我们创建的类一无所知，因此它返回 NotImplemented。这会提示 Python 接下来调用 WizCoin\
  \ 类的 __rmul__()，如果存在，则处理此操作。如果对 int 类的 __mul__() 和 WizCoin 类的 __rmul__() 的调用都返回\
  \ NotImplemented，Python 会引发 TypeError 异常。\n\n只有 WizCoin 对象之间才能相互相加。这保证了第一个 WizCoin\
  \ 对象的 __add__() 方法会处理该操作，因此我们不需要实现 __radd__()。例如，在表达式 purse + tipJar 中，会调用 purse\
  \ 对象的 __add__() 方法，并将 tipJar 作为另一个参数传入。因为此调用不会返回 NotImplemented，所以 Python 不会尝试使用\
  \ purse 作为另一个参数调用 tipJar 对象的 __radd__() 方法。\n\n表 17-2 包含所有可用反射 dunder 方法的完整列表。\n\
  \n## 表 17-2：反射数字 Dunder 方法\n\n| Dunder 方法 | 操作 | 运算符或内置函数 |\n|---|---|---|\n| __radd__()\
  \ | 加法 | + |\n| __rsub__() | 减法 | - |\n| __rmul__() | 乘法 | * |\n| __rmatmul__()\
  \ | 矩阵乘法（Python 3.5 中新增） | @ |\n| __rtruediv__() | 除法 | / |\n| __rfloordiv__() |\
  \ 整数除法 | // |\n| __rmod__() | 取模 | % |\n| __rdivmod__() | 除法和取模 | divmod() |\n|\
  \ __rpow__() | 幂运算 | **, pow() |\n| __rlshift__() | 左移 | >> |\n| __rrshift__() |\
  \ 右移 | << |\n| __rand__() | 按位与 | & |\n| __ror__() | 按位或 | | |\n| __rxor__() | 按位异或\
  \ | ^ |\n\n反射 dunder 方法的完整文档在 Python 文档中：https://docs.python.org/3/reference/datamodel.html#emulating-numeric-types。\n\
  \n## 原地增量赋值 Dunder 方法\n\n数字 dunder 方法和反射数字 dunder 方法总是创建新对象而不是原地修改对象。原地 dunder 方法由增量赋值运算符调用，例如\
  \ += 和 *=，它们原地修改对象而不是创建新对象。（对此有一个例外，我将在本节末尾解释。）这些 dunder 方法名称以 i 开头，例如 += 和 *= 运算符分别对应的\
  \ __iadd__() 和 __imul__()。\n\n例如，当 Python 运行代码 purse *= 2 时，预期的行为并不是 WizCoin 类的\
  \ __imul__() 方法创建一个包含两倍硬币的新 WizCoin 对象并返回，然后将其赋给 purse 变量。相反，__imul__() 方法修改 purse\
  \ 中已有的 WizCoin 对象，使其拥有两倍的硬币。这是一个微妙但重要的区别，如果希望你的类重载增量赋值运算符。\n\n我们的 WizCoin 对象已经重载了\
  \ + 和 * 运算符，因此让我们定义 __iadd__() 和 __imul__() dunder 方法，使它们也能重载 += 和 *= 运算符。在表达式 purse\
  \ += tipJar 和 purse *= 2 中，我们分别调用 __iadd__() 和 __imul__() 方法，并分别将 tipJar 和 2 作为另一个参数传入。将以下内容添加到\
  \ wizcoin.py 文件末尾：\n\n```\n--snip--\ndef __iadd__(self, other):\n    \"\"\"Add the\
  \ amounts in another WizCoin object to this object.\"\"\"\n    if not isinstance(other,\
  \ WizCoin):\n        return NotImplemented\n\n    # We modify the `self` object\
  \ in-place:\n    self.galleons += other.galleons\n    self.sickles += other.sickles\n\
  \    self.knuts += other.knuts\n    return self  # In-place dunder methods almost\
  \ always return self.\n\ndef __imul__(self, other):\n    \"\"\"Multiply the amount\
  \ of galleons, sickles, and knuts in this object\n    by a non-negative integer\
  \ amount.\"\"\"\n    if not isinstance(other, int):\n        return NotImplemented\n\
  \    if other < 0:\n        raise WizCoinException('cannot multiply with negative\
  \ integers')\n\n    # The WizCoin class creates mutable objects, so do NOT create\
  \ a\n    # new object like this commented-out code:\n    #return WizCoin(self.galleons\
  \ * other, self.sickles * other, self.knuts * other)\n\n    # We modify the `self`\
  \ object in-place:\n    self.galleons *= other\n    self.sickles *= other\n    self.knuts\
  \ *= other\n    return self  # In-place dunder methods almost always return self.\n\
  ```\n\nWizCoin 对象可以使用 += 运算符与另一个 WizCoin 对象以及 *= 运算符与正整数。请注意，在确保另一个参数有效后，原地方法会原地修改\
  \ self 对象而不是创建新的 WizCoin 对象。输入以下内容到交互式 shell 中，查看增量赋值运算符如何原地修改 WizCoin 对象：\n\n```\n\
  >>> import wizcoin\n>>> purse = wizcoin.WizCoin(2, 5, 10)\n>>> tipJar = wizcoin.WizCoin(0,\
  \ 0, 37)\n① >>> purse + tipJar\n② WizCoin(2, 5, 46)\n>>> purse\nWizCoin(2, 5, 10)\n\
  ③ >>> purse += tipJar\n>>> purse\nWizCoin(2, 5, 47)\n④ >>> purse *= 10\n>>> purse\n\
  WizCoin(20, 50, 470)\n```\n\n+ 运算符 ① 调用 __add__() 或 __radd__() dunder 方法来创建并返回新对象\
  \ ②。+ 运算符操作过的原始对象保持不变。原地 dunder 方法 ③ ④ 只要对象是可变的（即其值可以改变），就应原地修改对象。例外情况是不可变对象：因为不可变对象不能被修改，所以无法原地修改。在这种情况下，原地\
  \ dunder 方法应创建并返回新对象，就像数字和反射数字 dunder 方法一样。\n\n我们没有使 galleons、sickles 和 knuts 属性只读，这意味着它们可以改变。因此\
  \ WizCoin 对象是可变的。你编写的大多数类都会创建可变对象，因此应设计你的原地 dunder 方法来原地修改对象。\n\n如果你没有实现原地 dunder\
  \ 方法，Python 将改为调用数字 dunder 方法。例如，如果 WizCoin 类没有 __imul__() 方法，表达式 purse *= 10 将改为调用\
  \ __mul__() 并将其返回值赋给 purse。因为 WizCoin 对象是可变的，所以这是可能导致微妙 bug 的意外行为。\n\n## 比较 Dunder\
  \ 方法\n\nPython 的 sort() 方法和 sorted() 函数包含一个高效的排序算法，你可以通过简单调用访问。但如果你想比较和排序你创建的类的对象，你需要通过实现比较\
  \ dunder 方法来告诉 Python 如何比较这两个对象。每当你的对象在包含 <、>、<=、>=、== 和 != 比较运算符的表达式中使用时，Python\
  \ 都会在幕后调用比较 dunder 方法。\n\n在我们探索比较 dunder 方法之前，让我们先检查 operator 模块中的六个函数，它们执行与六个比较运算符相同的操作。我们的比较\
  \ dunder 方法将调用这些函数。输入以下内容到交互式 shell 中。\n\n\n\n```\n>>> import operator\n>>> operator.eq(42,\
  \ 42)      # \"Equal\", same as 42 == 42\nTrue\n>>> operator.ne('cat', 'dog')  #\
  \ \"Not Equal\", same as 'cat' != 'dog'\nTrue\n>>> operator.gt(10, 20)       # \"\
  Greater Than \", same as 10 > 20\nFalse\n>>> operator.ge(10, 10)       # \"Greater\
  \ than or Equal\", same as 10 >= 10\nTrue\n>>> operator.lt(10, 20)       # \"Less\
  \ Than\", same as 10 < 20\nTrue\n>>> operator.le(10, 20)       # \"Less than or\
  \ Equal\", same as 10 <= 20\nTrue\n```\n\noperator 模块为我们提供了比较运算符的函数版本。它们的实现很简单。例如，我们可以用两行代码编写自己的\
  \ operator.eq() 函数：\n\n```\ndef eq(a, b):\n    return a == b\n```\n\n拥有比较运算符的函数形式很有用，因为与运算符不同，函数可以作为参数传递给函数调用。我们将这样做来实现比较\
  \ dunder 方法的辅助方法。\n\n首先，将以下内容添加到 wizcoin.py 的开头。这些导入使我们能够访问 operator 模块中的函数，并允许我们通过将其与\
  \ collections.abc.Sequence 进行比较来检查方法中的另一个参数是否为序列：\n\n```\nimport collections.abc\n\
  import operator\n```\n\n然后将以下内容添加到 wizcoin.py 文件的末尾：\n\n```\n--snip--\n    def _comparisonOperatorHelper(self,\
  \ operatorFunc, other):\n        \"\"\"A helper method for our comparison dunder\
  \ methods.\"\"\"\n        if isinstance(other, WizCoin):\n            return operatorFunc(self.total,\
  \ other.total)\n        elif isinstance(other, (int, float)):\n            return\
  \ operatorFunc(self.total, other)\n        elif isinstance(other, collections.abc.Sequence):\n\
  \            otherValue = (other[0] * 17 * 29) + (other[1] * 29) + other[2]\n  \
  \          return operatorFunc(self.total, otherValue)\n        elif operatorFunc\
  \ == operator.eq:\n            return False\n        elif operatorFunc == operator.ne:\n\
  \            return True\n        else:\n            return NotImplemented\n```\n\
  \n```\ndef __eq__(self, other):  # eq is \"Equal\"\n    return self._comparisonOperatorHelper(operator.eq,\
  \ other)\n\ndef __ne__(self, other):  # ne is \"Not Equal\"\n    return self._comparisonOperatorHelper(operator.ne,\
  \ other)\n\ndef __lt__(self, other):  # lt is \"Less Than\"\n    return self._comparisonOperatorHelper(operator.lt,\
  \ other)\n\ndef __le__(self, other):  # le is \"Less than or Equal\"\n    return\
  \ self._comparisonOperatorHelper(operator.le, other)\n\ndef __gt__(self, other):\
  \  # gt is \"Greater Than\"\n    return self._comparisonOperatorHelper(operator.gt,\
  \ other)\n\ndef __ge__(self, other):  # ge is \"Greater than or Equal\"\n    return\
  \ self._comparisonOperatorHelper(operator.ge, other)\n```\n\n我们的比较 dunder 方法调用 _comparisonOperatorHelper()\
  \ 方法 ① 并为 operatorFunc 参数传递来自 operator 模块的适当函数。当我们调用 operatorFunc() 时，我们调用的是为 operatorFunc\
  \ 参数传递的函数——来自 operator 模块的 eq() ⑤、ne() ⑥、lt() ⑦、le() ⑧、gt() ⑨ 或 ge() ⑩。否则，我们就需要在六个比较\
  \ dunder 方法中的每一个中重复 _comparisonOperatorHelper() 中的代码。\n\n### 注意\n*像 _comparisonOperatorHelper()\
  \ 这样接受其他函数作为参数的函数（或方法）被称为高阶函数。*\n\n我们的 WizCoin 对象现在可以与其他 WizCoin 对象 ②、整数和浮点数 ③ 以及代表加隆、锡克尔和纳特的三个数值序列\

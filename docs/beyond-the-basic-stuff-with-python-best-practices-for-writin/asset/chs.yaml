  \    return board\n```\n\nThis function returns a dictionary that represents a Four-in-a-Row\
  \ board. It has (columnIndex, rowIndex) tuples for keys (where columnIndex and rowIndex\
  \ are integers), and the 'X', 'O', or '.' character for the tile at each place on\
  \ the board. We store these strings in PLAYER_X, PLAYER_O, and EMPTY_SPACE, respectively.\n\
  \nOur Four-in-a-Row game is rather simple, so using a dictionary to represent the\
  \ game board is a suitable technique. Still, we could have used an OOP approach\
  \ instead. We'll explore OOP in Chapters 15 through 17.\n\nThe displayBoard() function\
  \ takes a game board data structure for the board argument and displays the board\
  \ onscreen using the BOARD_TEMPLATE constant:\n\n```\ndef displayBoard(board):\n\
  \    \"\"\"Display the board and its tiles on the screen.\"\"\"\n\n    # Prepare\
  \ a list to pass to the format() string method for the board\n    # template. The\
  \ list holds all of the board's tiles (and empty\n    # spaces) going left to right,\
  \ top to bottom:\n    tileChars = []\n```\n\nRecall that the BOARD_TEMPLATE is a\
  \ multiline string with several brace pairs. When we call the format() method on\
  \ BOARD_TEMPLATE, these braces will be replaced by the arguments passed to format().\n\
  \nThe tileChars variable will contain a list of these arguments. We start by assigning\

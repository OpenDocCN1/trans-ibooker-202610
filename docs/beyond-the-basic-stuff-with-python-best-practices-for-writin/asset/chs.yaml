  \n让我们像对汉诺塔程序那样查看程序的源代码。 我再次使用 Black 格式化了这段代码，行限制为 75 个字符。\n\n我们从程序顶部开始：\n\n```python\n\
  \"\"\"Four-in-a-Row, by Al Sweigart al@inventwithpython.com\nA tile-dropping game\
  \ to get four-in-a-row, similar to Connect Four.\"\"\"\n\nimport sys\n\n# Constants\
  \ used for displaying the board:\nEMPTY_SPACE = \".\"  # A period is easier to count\
  \ than a space.\nPLAYER_X = \"X\"\nPLAYER_O = \"O\"\n```\n\n我们以文档字符串、模块导入和常量赋值开始程序，就像在汉诺塔程序中所做的那样。\
  \ 我们定义 PLAYER_X 和 PLAYER_O 常量，这样就不需要在整个程序中使用字符串 \"x\" 和 \"O\"，从而更容易捕获错误。 如果在使用常量时输入了拼写错误，例如\
  \ PLAYER_XX，Python 将引发 NameError，立即指出问题。 但如果对 \"X\" 字符输入了拼写错误，例如 \"XX\" 或 \"Z\"\
  ，由此产生的错误可能不会立即显而易见。 如第 71 页“Magic Numbers”中所述，使用常量而不是直接使用字符串值不仅提供描述，还能对源代码中的任何拼写错误提供早期警告。\n\
  \n常量在程序运行期间不应更改。 但程序员可以在程序的未来版本中更新它们的值。 因此，我们做了一个说明，告诉程序员如果更改 BOARD_WIDTH 的值，则应更新稍后描述的\
  \ BOARD_TEMPLATE 和 COLUMN_LABELS 常量：\n\n```python\n# Note: Update BOARD_TEMPLATE\
  \ & COLUMN_LABELS if BOARD_WIDTH is changed.\nBOARD_WIDTH = 7\nBOARD_HEIGHT = 6\n\
  ```\n\n接下来，我们创建 COLUMN_LABELS 常量：\n\n```python\nCOLUMN_LABELS = (\"1\", \"2\", \"\
  3\", \"4\", \"5\", \"6\", \"7\")\nassert len(COLUMN_LABELS) == BOARD_WIDTH\n```\n\
  \n我们稍后会使用此常量来确保玩家选择有效的列。 请注意，如果我们将 BOARD_WIDTH 设置为 7 以外的其他值，我们将不得不向 COLUMN_LABELS\
  \ 元组添加标签或从中删除标签。 我本可以通过基于 BOARD_WIDTH 的代码来避免这种情况，例如： COLUMN_LABELS = tuple([str(n)\
  \ for n in range(1, BOARD_WIDTH + 1)])。 但 COLUMN_LABELS 未来不太可能更改，因为标准的四连珠游戏是在 7×6\
  \ 的棋盘上进行的，所以我决定写出一个显式的元组值。\n\n当然，这种硬编码是一种代码坏味道，如第 71 页“Magic Numbers”所述，但它比替代方案更易读。\
  \ 此外，assert 语句提醒我们在更改 BOARD_WIDTH 而未更新 COLUMN_LABELS 时会发出警告。\n\n与汉诺塔一样，四连珠程序使用 ASCII\
  \ 艺术绘制游戏棋盘。 以下几行是一个包含多行字符串的单个赋值语句：\n\n```\n# The template string for displaying\
  \ the board:\nBOARD_TEMPLATE = \"\"\"\n    1234567\n    +-------+\n    |{}{}{}{}{}{}|\n\
  \    |{}{}{}{}{}{}|\n    |{}{}{}{}{}{}|\n    |{}{}{}{}{}{}|\n    |{}{}{}{}{}{}|\n\
  \    |{}{}{}{}{}{}|\n    +-------+\"\"\"\n```\n\n此字符串包含大括号 ({}), format() 字符串方法将用棋盘的内容替换它们。\
  \ （稍后解释的 displayBoard() 函数将处理此事。） 因为棋盘由七列和六行组成，所以我们在六行中的每一行使用七对大括号 {} 来表示每个槽位。 请注意，就像\
  \ COLUMN_LABELS 一样，我们在技术上是将棋盘硬编码为创建固定数量的列和行。 如果我们将 BOARD_WIDTH 或 BOARD_HEIGHT 更改为新的整数，我们还必须更新\
  \ BOARD_TEMPLATE 中的多行字符串。\n\n我们本可以基于 BOARD_WIDTH 和 BOARD_HEIGHT 常量编写代码来生成 BOARD_TEMPLATE，如下所示：\n\
  \n```\nBOARD_EDGE = \"   +\" + (\"-\" * BOARD_WIDTH) + \"+\"\nBOARD_ROW = \"   |\"\
  \ + (\"{}\" * BOARD_WIDTH) + \"|\\n\"\nBOARD_TEMPLATE = \"\\n   \" + \"\".join(COLUMN_LABELS)\
  \ + \"\\n\" + BOARD_EDGE + \"\\n\" + (BOARD_ROW * BOARD_WIDTH) + BOARD_EDGE\n```\n\
  \n但这段代码的可读性不如简单的多行字符串，而且我们不太可能更改游戏棋盘的大小，所以我们将使用简单的多行字符串。\n\n我们开始编写 main() 函数，该函数将调用我们为此游戏制作的所有其他函数：\n\
  \n```\ndef main():\n    \"\"\"Runs a single game of Four-in-a-Row.\"\"\"\n    print(\n\
  \        \"\"\"Four-in-a-Row, by Al Sweigart al@inventwithpython.com\nTwo players\
  \ take turns dropping tiles into one of seven columns, trying\nto make four-in-a-row\
  \ horizontally, vertically, or diagonally.\n\"\"\"\n    )\n\n# Set up a new game:\n\
  gameBoard = getNewBoard()\nplayerTurn = PLAYER_X\n```\n\n我们为 main() 函数提供了一个文档字符串，可通过内置的\
  \ help() 函数查看。 main() 函数还为新游戏准备游戏棋盘并选择第一个玩家。\n\nmain() 函数内部有一个无限循环：\n\n```\nwhile\
  \ True:  # Run a player's turn.\n    # Display the board and get player's move:\n\

  \ the top disk from fromTower to toTower:\n        disk = towers[fromTower].pop()\n\
  \        towers[toTower].append(disk)\n\n        # Check if the user has solved\
  \ the puzzle:\n        if SOLVED_TOWER in (towers[\"B\"], towers[\"C\"]):\n    \
  \        displayTowers(towers)  # Display the towers one last time.\n          \
  \  print(\"You have solved the puzzle! Well done!\")\n            sys.exit()\n\n\
  def getPlayerMove(towers):\n    \"\"\"Asks the player for a move. Returns (fromTower,\
  \ toTower).\"\"\"\n\n    while True:  # Keep asking player until they enter a valid\
  \ move.\n        print('Enter the letters of \"from\" and \"to\" towers, or QUIT.')\n\
  \        print(\"(e.g., AB to moves a disk from tower A to tower B.)\")\n      \
  \  print()\n        response = input(\"> \").upper().strip()\n\n        if response\
  \ == \"QUIT\":\n            print(\"Thanks for playing!\")\n            sys.exit()\n\
  \n        # Make sure the user entered valid tower letters:\n        if response\
  \ not in (\"AB\", \"AC\", \"BA\", \"BC\", \"CA\", \"CB\"):\n            print(\"\
  Enter one of AB, AC, BA, BC, CA, or CB.\")\n            continue  # Ask player again\
  \ for their move.\n\n        # Use more descriptive variable names:\n        fromTower,\
  \ toTower = response[0], response[1]\n\n        if len(towers[fromTower]) == 0:\n\
  \            # The \"from\" tower cannot be an empty tower:\n            print(\"\
  You selected a tower with no disks.\")\n            continue  # Ask player again\
  \ for their move.\n        elif len(towers[toTower]) == 0:\n            # Any disk\
  \ can be moved onto an empty \"to\" tower:\n            return fromTower, toTower\n\
  \        elif towers[toTower][-1] < towers[fromTower][-1]:\n            print(\"\
  Can't put larger disks on top of smaller ones.\")\n            continue  # Ask player\
  \ again for their move.\n        else:\n            # This is a valid move, so return\
  \ the selected towers:\n            return fromTower, toTower\n\ndef displayTowers(towers):\n\
  \    \"\"\"Display the three towers with their disks.\"\"\"\n\n    # Display the\
  \ three towers:\n    for level in range(TOTAL_DISKS, -1, -1):\n        for tower\
  \ in (towers[\"A\"], towers[\"B\"], towers[\"C\"]):\n            if level >= len(tower):\n\
  \                displayDisk(0)  # Display the bare pole with no disk.\n       \
  \     else:\n                displayDisk(tower[level])  # Display the disk.\n  \
  \  print()\n\n    # Display the tower labels A, B, and C:\n    emptySpace = \" \"\
  \ * (TOTAL_DISKS)\n    print(\"{0} A{0}{0} B{0}{0} C\\n\".format(emptySpace))\n\n\
  def displayDisk(width):\n    \"\"\"Display a disk of the given width. A width of\
  \ 0 means no disk.\"\"\"\n    emptySpace = \" \" * (TOTAL_DISKS - width)\n\n   \
  \ if width == 0:\n        # Display a pole segment without a disk:\n        print(f\"\
  {emptySpace}||{emptySpace}\", end=\"\")\n    else:\n        # Display the disk:\n\
  \        disk = \"@\" * width\n        numLabel = str(width).rjust(2, \" \")\n \
  \       print(f\"{emptySpace}{disk}{numLabel}{disk}{emptySpace}\", end=\"\")\n\n\
  # If this program was run (instead of imported), run the game:\nif __name__ == \"\
  __main__\":\n    main()\n```\n\n运行此程序并玩几局游戏，以便在阅读源代码说明之前了解程序的作用。若要检查拼写错误，请将其复制并粘贴到\
  \ https://inventwithpython.com/beyond/diff/ 在线 diff 工具中。\n\n## 编写代码\n\n让我们更仔细地查看源代码，看看它如何遵循本书中描述的最佳实践和模式。\n\
  \n我们从程序顶部开始：\n\n```\n\"\"\"THE TOWER OF HANOI, by Al Sweigart al@inventwithpython.com\n\
  A stack-moving puzzle game.\"\"\"\n```\n\n程序以多行注释开始，该注释用作 towerofhanoi 模块的文档字符串。内置的\
  \ help() 函数将使用此信息来描述模块：\n\n```\n>>> import towerofhanoi\n>>> help(towerofhanoi)\n\
  Help on module towerofhanoi:\n\nNAME\n    towerofhanoi\n\nDESCRIPTION\n    THE TOWER\
  \ OF HANOI, by Al Sweigart al@inventwithpython.com\n    A stack-moving puzzle game.\n\
  ```\n\n```\nFUNCTIONS\n    displayDisk(width)\n    Display a single disk of the\
  \ given width.\n--snip--\n```\n\n如果需要，你可以在模块的文档字符串中添加更多文字，甚至是段落信息。这里我只写了少量内容，因为程序非常简单。\n\
  \n文档字符串之后是导入语句：\n\n```\nimport copy\nimport sys\n```\n\nBlack 将其格式化为单独的语句，而不是像 import\
  \ copy, sys 这样的单条语句。这使得在跟踪程序员所做更改的版本控制系统（如 Git）中，更容易看到导入模块的添加或删除。\n\n接下来，我们定义此程序所需的常量：\n\
  \n```\nTOTAL_DISKS = 5  # More disks means a more difficult puzzle.\n\n# Start with\
  \ all disks on tower A:\nSOLVED_TOWER = list(range(TOTAL_DISKS, 0, -1))\n```\n\n\
  我们在文件顶部附近定义它们，以便将它们分组并使其成为全局变量。我们使用大写 snake_case 书写它们的名字以标记它们为常量。\n\nTOTAL_DISKS\
  \ 常量表示谜题有多少个圆盘。SOLVED_TOWER 变量是包含已解决塔的列表的示例：它包含所有圆盘，最大的在底部，最小的在顶部。我们根据 TOTAL_DISKS\
  \ 值生成此值，对于五个圆盘来说它是 [5, 4, 3, 2, 1]。\n\n请注意，此文件中没有类型提示。原因是我们可以从代码中推断出所有变量、参数和返回值类型。例如，我们已将\
  \ TOTAL_DISKS 常量赋值为整数 5。从中，类型检查器（如 Mypy）会推断 TOTAL_DISKS 只能包含整数。\n\n我们定义了一个 main()\
  \ 函数，程序在文件底部附近调用它：\n\n```\ndef main():\n    \"\"\"Runs a single game of The Tower\
  \ of Hanoi.\"\"\"\n    print(\n        \"\"\"THE TOWER OF HANOI, by Al Sweigart\
  \ al@inventwithpython.com\n\nMove the tower of disks, one disk at a time, to another\
  \ tower. Larger\ndisks cannot rest on top of a smaller disk.\n\nMore info at https://en.wikipedia.org/wiki/Tower_of_Hanoi\n\
  \"\"\"\n    )\n```\n\n\n\n函数也可以有文档字符串。请注意 def 语句下方 main() 的文档字符串。你可以通过在交互式 shell\
  \ 中运行 import towerofhanoi 和 help(towerofhanoi.main) 来查看此文档字符串。\n\n接下来，我们写一个注释，详细描述我们用来表示塔的数据结构，因为它构成了该程序工作原理的核心：\n\
  \n```\n\"\"\"The towers dictionary has keys \"A\", \"B\", and \"C\" and values that\
  \ are lists representing a tower of disks. The list contains integers representing\
  \ disks of different sizes, and the start of the list is the bottom of the tower.\
  \ For a game with 5 disks, the list [5, 4, 3, 2, 1] represents a completed tower.\
  \ The blank list [] represents a tower of no disks. The list [1, 3] has a larger\
  \ disk on top of a smaller disk and is an invalid configuration. The list [3, 1]\
  \ is allowed since smaller disks can go on top of larger ones.\"\"\"\ntowers = {\"\
  A\": copy.copy(SOLVED_TOWER), \"B\": [], \"C\": []}\n```\n\n我们将 SOLVED_TOWER 列表用作栈，它是软件开发中最简单的数据结构之一。栈是有序的值列表，只能通过在栈顶添加（也称为推入）或移除（也称为弹出）值来更改。此数据结构完美地表示了我们程序中的塔。我们可以将\
  \ Python 列表变成栈，如果我们使用 append() 方法进行推入，使用 pop() 方法进行弹出，并且以其他方式避免更改列表。我们将把列表的末尾视为栈顶。\n\
  \n每个 towers 列表中的整数代表一个特定尺寸的圆盘。例如，在一个有五个圆盘的游戏中，列表 [5, 4, 3, 2, 1] 将表示从底部最大的（5）到顶部最小的（1）的完整圆盘堆栈。\n\
  \n请注意，我们的注释还提供了有效和无效塔堆栈的示例。\n\n在 main() 函数内部，我们编写了一个无限循环，在每次迭代中运行我们拼图游戏的一回合：\n\n\
  ```\nwhile True:  # Run a single turn on each iteration of this loop.\n    # Display\
  \ the towers and disks:\n    displayTowers(towers)\n\n    # Ask the user for a move:\n\
  \    fromTower, toTower = getPlayerMove(towers)\n\n    # Move the top disk from\
  \ fromTower to toTower:\n    disk = towers[fromTower].pop()\n    towers[toTower].append(disk)\n\
  ```\n\n在一回合中，玩家查看塔的当前状态并输入移动。程序随后更新 towers 数据结构。我们已将这些任务的细节隐藏在 displayTowers() 和\
  \ getPlayerMove() 函数中。这些描述性的函数名称使 main() 函数能够提供程序所做事情的总体概述。\n\n下一行代码通过将 SOLVED_TOWER\
  \ 中的完整塔与 towers[\"B\"] 和 towers[\"C\"] 进行比较来检查玩家是否已解开谜题：\n\n```\n# Check if the\
  \ user has solved the puzzle:\nif SOLVED_TOWER in (towers[\"B\"], towers[\"C\"]):\n\
  \    displayTowers(towers)  # Display the towers one last time.\n    print(\"You\
  \ have solved the puzzle! Well done!\")\n    sys.exit()\n```\n\n我们不将其与 towers[\"\
  A\"] 进行比较，因为该杆从一开始就有一个完整的塔；玩家需要在 B 或 C 杆上形成塔才能解开谜题。请注意，我们重用 SOLVED_TOWER 来创建起始塔并检查玩家是否解开了谜题。因为\
  \ SOLVED_TOWER 是一个常量，我们可以相信它始终具有我们在源代码开头赋予它的值。\n\n我们使用的条件等价于但比 SOLVED_TOWER == towers[\"\
  B\"] or SOLVED_TOWER == towers[\"C\"] 更短，这是一种我们在第 6 章中介绍的 Python 习惯用法。如果此条件为 True，玩家已解开谜题，我们结束程序。否则，我们返回循环进行另一回合。\n\
  \ngetPlayerMove() 函数要求玩家输入圆盘移动并根据游戏规则验证移动：\n\n```\ndef getPlayerMove(towers):\n\
  \    \"\"\"Asks the player for a move. Returns (fromTower, toTower).\"\"\"\n   \
  \ while True:  # Keep asking player until they enter a valid move.\n        print('Enter\
  \ the letters of \"from\" and \"to\" towers, or QUIT.')\n        print(\"(e.g.,\
  \ AB to move a disk from tower A to tower B.)\")\n        print()\n        response\
  \ = input(\"> \").upper().strip()\n```\n\n我们启动一个无限循环，直到 return 语句导致执行离开循环和函数，或 sys.exit()\
  \ 调用终止程序为止。循环的第一部分要求玩家通过指定 from 和 to 塔来输入移动。\n\n请注意 input(\"> \").upper().strip()\
  \ 指令，它接收玩家的键盘输入。input(\"> \") 调用通过显示 > 提示来接受玩家的文本输入。此符号表示玩家应输入内容。如果程序未显示提示，玩家可能会暂时认为程序已冻结。\n\
  \n我们对 input() 返回的字符串调用 upper() 方法，使其返回字符串的大写形式。这允许玩家输入大写或小写的塔标签，例如塔 A 的 'a' 或 'A'。随后，对大写字符串调用\
  \ strip() 方法，返回一个没有两侧空白字符的字符串，以防用户在输入移动时意外添加了空格。这种用户友好性使我们的程序对玩家来说稍微容易使用一些。\n\n\
  仍在 getPlayerMove() 函数中，我们检查用户输入的内容：\n\n```\nif response == \"QUIT\":\n    print(\"\
  Thanks for playing!\")\n    sys.exit()\n```\n\n```\n# Make sure the user entered\
  \ valid tower letters:\nif response not in (\"AB\", \"AC\", \"BA\", \"BC\", \"CA\"\
  , \"CB\"):\n    print(\"Enter one of AB, AC, BA, BC, CA, or CB.\")\n    continue\
  \ # Ask player again for their move.\n```\n\n如果用户输入 'QUIT'（无论大小写，甚至在字符串开头或结尾有空格，由于调用了\
  \ upper() 和 strip()），程序将终止。我们本可以让 getPlayerMove() 返回 'QUIT' 来指示调用者应调用 sys.exit()，而不是让\
  \ getPlayerMove() 调用 sys.exit()。但这会使 getPlayerMove() 的返回值变得复杂：它将返回一个由两个字符串组成的元组（用于玩家的移动）或一个单独的\
  \ 'QUIT' 字符串。返回单一数据类型值的函数比可以返回多种可能类型值的函数更容易理解。我在第 177 页的“Return Values Should Always\
  \ Have the Same Data Type”中讨论了这一点。\n\n在三座塔之间，只有六种 from-to 塔组合是可能的。尽管我们在检查移动的条件中硬编码了全部六个值，但代码比类似\
  \ len(response) != 2 或 response[0] not in 'ABC' 或 response[1] not in 'ABC' 或 response[0]\
  \ == response[1] 的写法更容易阅读。鉴于这些情况，硬编码方法是最直接的。\n\n通常，将 \"AB\"、\"AC\" 等值作为魔术值硬编码被认为是不良做法，这些值仅在程序有三根杆时有效。但尽管我们可能希望通过更改\
  \ TOTAL_DISKS 常量来调整圆盘数量，但我们不太可能为游戏添加更多杆。在这一行写出每一种可能的杆移动是可以的。\n\n我们创建两个新变量 fromTower\
  \ 和 toTower，作为数据的描述性名称。它们没有功能上的目的，但使代码比 response[0] 和 response[1] 更易于阅读：\n\n```\n\
  # Use more descriptive variable names:\nfromTower, toTower = response[0], response[1]\n\
  ```\n\n接下来，我们检查所选塔是否构成合法移动：\n\n```\nif len(towers[fromTower]) == 0:\n    # The \"\
  from\" tower cannot be an empty tower:\n    print(\"You selected a tower with no\
  \ disks.\")\n    continue # Ask player again for their move.\nelif len(towers[toTower])\
  \ == 0:\n    # Any disk can be moved onto an empty \"to\" tower:\n    return fromTower,\
  \ toTower\nelif towers[toTower][-1] < towers[fromTower][-1]:\n    print(\"Can't\
  \ put larger disks on top of smaller ones.\")\n    continue # Ask player again for\
  \ their move.\n```\n\n如果不是，continue 语句会导致执行返回到循环的开头，重新要求玩家输入移动。请注意，我们检查 toTower\
  \ 是否为空；如果是，我们返回 fromTower, toTower 以强调移动有效，因为你总可以将圆盘放在空杆上。这两个初始条件确保在检查第三个条件时，towers[toTower]\
  \ 和 towers[fromTower] 不会为空或导致 IndexError。我们以这种方式排列这些条件是为了防止 IndexError 或额外的检查。\n\
  \n重要的是，你的程序要处理用户输入的任何无效输入或潜在的错误情况。用户可能不知道输入什么，或者可能出现拼写错误。同样，文件可能会意外丢失，或者数据库可能会崩溃。你的程序需要对异常情况具有弹性；否则，它们会意外崩溃或在以后导致微妙的错误。\n\
  \n如果之前的条件都不为 True，getPlayerMove() 返回 fromTower, toTower：\n\n```python\nelse:\n \
  \   # This is a valid move, so return the selected towers:\n    return fromTower,\
  \ toTower\n```\n\n在 Python 中，return 语句始终返回单个值。虽然此 return 语句看起来返回两个值，但 Python 实际上返回一个包含两个值的单个元组，等价于\
  \ return (fromTower, toTower)。Python 程序员在这种情况下经常省略括号。括号并不是定义元组的关键，逗号才是。\n\n请注意，程序仅从\
  \ main() 函数调用一次 getPlayerMove() 函数。该函数并不能帮我们避免重复代码，而这通常是使用函数最常见的原因。我们完全可以将 getPlayerMove()\
  \ 中的所有代码放在 main() 函数中。但我们也可以使用函数作为将代码组织成独立单元的方式，这就是我们使用 getPlayerMove() 的方式。这样可以防止\
  \ main() 函数变得过长且难以管理。\n\ndisplayTowers() 函数在 towers 参数中显示塔 A、B 和 C 上的圆盘：\n\n```python\n\
  def displayTowers(towers):\n    \"\"\"Display the three towers with their disks.\"\
  \"\"\n\n    # Display the three towers:\n    for level in range(TOTAL_DISKS, -1,\
  \ -1):\n        for tower in (towers[\"A\"], towers[\"B\"], towers[\"C\"]):\n  \
  \          if level >= len(tower):\n                displayDisk(0)  # Display the\
  \ bare pole with no disk.\n            else:\n                displayDisk(tower[level])\
  \  # Display the disk.\n    print()\n```\n\n它依赖于我们接下来会介绍的 displayDisk() 函数来显示塔中的每个圆盘。for\
  \ level 循环检查塔的每个可能的圆盘，而 for tower 循环检查塔 A、B 和 C。\n\n\n\ndisplayTowers() 函数调用 displayDisk()\
  \ 来以特定宽度显示每个圆盘，或者如果传入 0，则显示没有圆盘的杆：\n\n```\n# Display the tower labels A, B, and\
  \ C:\nemptySpace = ' ' * (TOTAL_DISKS)\nprint('{0} A{0}{0} B{0}{0} C\\n'.format(emptySpace))\n\
  ```\n\n我们在屏幕上显示 A、B 和 C 标签。玩家需要这些信息来区分塔，并强化塔的标签是 A、B 和 C，而不是 1、2 和 3 或 左、中、右。我选择不使用\
  \ 1、2 和 3 作为塔的标签，以防止玩家将这些数字与用于圆盘大小的数字混淆。\n\n我们将 emptySpace 变量设置为放置在每个标签之间的空格数，这反过来又基于\
  \ TOTAL_DISKS，因为游戏中圆盘越多，杆子之间的距离就越宽。与其使用 f-string，如 print(f'{emptySpace} A{emptySpace}{emptySpace}\
  \ B{emptySpace}{emptySpace} C\\n')，我们使用 format() 字符串方法。这使我们能够在相关字符串中出现 {0} 的任何位置使用相同的\
  \ emptySpace 参数，从而产生比 f-string 版本更短、更易读的代码。\n\ndisplayDisk() 函数显示单个圆盘及其宽度。如果没有圆盘，则只显示杆：\n\
  \n```\ndef displayDisk(width):\n    \"\"\"Display a disk of the given width. A width\
  \ of 0 means no disk.\"\"\"\n    emptySpace = ' ' * (TOTAL_DISKS - width)\n    if\
  \ width == 0:\n        # Display a pole segment without a disk:\n        print(f'{emptySpace}||{emptySpace}',\
  \ end='')\n    else:\n        # Display the disk:\n        disk = '@' * width\n\
  \        numLabel = str(width).rjust(2, '_')\n        print(f\"{emptySpace}{disk}{numLabel}{disk}{emptySpace}\"\
  , end='')\n```\n\n我们使用前导空格、等于圆盘宽度的 @ 字符数、宽度对应的两个字符（如果宽度为单位数则包括下划线）、另一系列 @ 字符，然后是尾随空格来表示一个圆盘。要仅显示空杆，我们只需要前导空格、两个竖线字符和尾随空格。因此，我们需要六次调用\
  \ displayDisk()，使用六个不同的宽度参数来显示以下塔：\n\n```\n||\n@ 1@\n@@_2@@\n@@@_3@@@\n@@@@_4@@@@\n\
  @@@@@_5@@@@@\n```\n\n注意 displayTowers() 和 displayDisk() 函数如何分担显示塔的职责。尽管 displayTowers()\
  \ 决定如何解释表示每个塔的数据结构，但它依赖于 displayDisk() 来实际显示塔的每个圆盘。像这样将程序分解为更小的函数使每个部分更容易测试。如果程序错误地显示圆盘，问题很可能出在\
  \ displayDisk() 中。如果圆盘出现顺序错误，问题很可能出在 displayTowers() 中。无论哪种情况，你需要调试的代码部分都会小得多。\n\
  \n要调用 main() 函数，我们使用一种常见的 Python 惯用法：\n\n```\n# If this program was run (instead\
  \ of imported), run the game:\nif __name__ == '__main__':\n    main()\n```\n\n如果玩家直接运行\
  \ towerofhanoi.py 程序，Python 会自动将 __name__ 变量设置为 '__main__'。但如果有人使用 import towerofhanoi\
  \ 将程序作为模块导入，那么 __name__ 将被设置为 'towerofhanoi'。if __name__ == '__main__': 行会在有人运行我们的程序时调用\
  \ main() 函数，开始一局汉诺塔游戏。但如果我们只是想将程序作为模块导入，以便例如在单元测试中调用其中的各个函数，则此条件将为 False，且 main()\
  \ 不会被调用。\n\n## Four-in-a-Row\n\n四连珠是一款双人落子游戏。每个玩家都试图创建四个自己棋子的连线，无论是水平、垂直还是对角线。它类似于桌游\
  \ Connect Four 和 Four Up。游戏使用 7×6 的直立棋盘，棋子会落到列中最低的未占用空间。在我们的四连珠游戏中，两名人类玩家 X 和 O\
  \ 将相互对战，而不是一名人类玩家对抗电脑。\n\n### The Output\n\n当你在本章中运行四连珠程序时，输出将如下所示：\n\n```\nFour-in-a-Row,\
  \ by Al Sweigart al@inventwithpython.com\n\nTwo players take turns dropping tiles\
  \ into one of seven columns, trying\nto make four in a row horizontally, vertically,\
  \ or diagonally.\n\n    1234567\n    +-------+\n    |.......|\n    |.......|\n \
  \   |.......|\n    |.......|\n    |.......|\n    +-------+\n```\n\n```\nPlayer X,\
  \ enter 1 to 7 or QUIT:\n> 1\n\n    1234567\n    +-------+\n    |.......|\n    |.......|\n\
  \    |.......|\n    |.......|\n    |.......|\n    |X......|\n    +-------+\nPlayer\
  \ O, enter 1 to 7 or QUIT:\n--snip--\nPlayer O, enter 1 to 7 or QUIT:\n> 4\n\n \
  \   1234567\n    +-------+\n    |.......|\n    |.......|\n    |...O...|\n    |X.OO...|\n\
  \    |X.XO...|\n    |XOXO.X.|\n    +-------+\nPlayer O has won!\n```\n\n尝试找出在阻止对手同时完成的同时获得四连珠的许多微妙策略。\n\

  \ from the bottom, find the first empty space.\nfor rowIndex in range(BOARD_HEIGHT\
  \ - 1, -1, -1):\n    if board[(columnIndex, rowIndex)] == EMPTY_SPACE:\n       \
  \ return (columnIndex, rowIndex)\n```\n\nThis for loop starts at the bottom row\
  \ index, BOARD_HEIGHT - 1 or 6, and moves up until it finds the first empty space.\
  \ The function then returns the indexes of the lowest empty space.\n\nAnytime the\
  \ board is full, the game ends in a tie:\n\n```\ndef isFull(board):\n    \"\"\"\
  Returns True if the `board` has no empty spaces, otherwise returns False.\"\"\"\n\
  \    for rowIndex in range(BOARD_HEIGHT):\n        for columnIndex in range(BOARD_WIDTH):\n\

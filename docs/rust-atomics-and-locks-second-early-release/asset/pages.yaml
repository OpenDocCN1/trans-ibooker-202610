- pgno: 8
  md: "# OUTPUT LOCKING\n\nThe `println` macro uses `io::Stdout::lock()` to make sure\
    \ its output does not get interrupted. A `println!()` expression will wait until\
    \ any concurrently running one is finished before writing any output. If this\
    \ was not the case, we could’ve gotten more interleaved output such as:\n\n```\n\
    Hello fromHello from another thread!\n  another This is my threthreadHello fromthread\
    \ id: ThreadId!\n( the main thread.\n2)This is my thread\nid: ThreadId(3)\n```\n\
    \nRather than passing the name of a function to `thread::spawn`, as in our example\
    \ above, it’s far more common to pass it a *closure*. This allows us to capture\
    \ values to move into the new thread:\n\n```\nlet numbers = vec![1, 2, 3];\n\n\
    thread::spawn(move || {\n    for n in numbers {\n        println!(\"{n}\");\n\
    \    }\n});\n```\n\nHere, ownership of `numbers` is transferred to the newly spawned\
    \ thread. We have to use a `move` closure to transfer ownership. Otherwise, the\
    \ closure would capture `numbers` by reference even though the new thread might\
    \ outlive it, resulting in a compiler error.\n\nSince a thread might run until\
    \ the very end of the program’s execution, the `spawn` function has a `'static`\
    \ bound on its argument type. In other words, it only accepts functions that may\
    \ be kept around forever. A closure capturing a local variable by reference may\
    \ not be kept around forever, since that reference would become invalid the moment\
    \ the local variable ceases to exist."

  md: "was all we had, we’d have to keep locking the mutex to repeatedly check if\
    \ there’s anything in the Vec yet.\n\n# Thread parking\n\nOne way to wait for\
    \ a notification from another thread is called *thread parking*. A thread can\
    \ *park* itself, which puts it to sleep, stopping it from consuming any CPU cycles.\
    \ Another thread can then *unpark* the parked thread, waking it up from its nap.\n\
    \nThread parking is available through the `std::thread::park()` function. For\
    \ unparking, you call the `unpark()` method on a Thread object representing the\
    \ thread that you want to unpark. Such an object can be obtained from the join\
    \ handle returned by `spawn`, or by the thread itself through `std::thread::current()`.\n\
    \nLet’s dive into an example that uses a mutex to share a queue between two threads.\
    \ In the following example, a newly spawned thread will consume items from the\
    \ queue, while the main thread will insert a new item into the queue every second.\
    \ Thread parking is used to make the consuming thread wait when the queue is empty.\n\

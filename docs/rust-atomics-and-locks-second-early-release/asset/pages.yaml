    \ Relaxed);\n    assert!(id < 1000, \"too many IDs!\");\n    id\n}\n```\n\nNow,\
    \ the assert statement will panic after a thousand calls. However, this happens\
    \ after the atomic add operation already happened, meaning that NEXT_ID has already\
    \ been incremented to 1001 when we panic. If another thread then calls the function,\
    \ it’ll increment it to 1002 before panicking, and so on. Although it might take\
    \ significantly longer, we’ll run into the same problem after 4294966296 panics\
    \ when NEXT_ID will overflow to zero again.\n\nThere are three common solutions\
    \ to this problem. The first one is to not panic but instead completely abort\
    \ the process on overflow. The std::process::abort function will abort the entire\
    \ process, ruling out the possibility of anything continuing to call our function.\
    \ While aborting the process might take a brief moment in which the function can\
    \ still be called by other threads, the chance of that happening billions of times\
    \ before the program is truly aborted is negligible.\n\nThis is in fact how the\
    \ overflow check in Arc::clone() in the standard library is implemented, in case\
    \ you somehow manage to clone it isize::MAX times. That’d take hundreds of years\
    \ on a 64-bit computer, but is achieveable in seconds if isize is only 32 bits."

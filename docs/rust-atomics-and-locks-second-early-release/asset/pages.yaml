    \ is allowed to assume `index` is only ever 0, 1, or 2. It may logically conclude\
    \ that the last arm of our `match` statement will only ever match a 2, and thus\
    \ that `z` is only ever called as `z(2)`. That conclusion might be used not only\
    \ to optimize the `match`, but also to optimize `z` itself. This can include throwing\

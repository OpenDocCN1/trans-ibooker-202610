  md: '# THREAD BUILDER


    The `thread::spawn` function is actually just a convenient shorthand for `thread::Builder::new().spawn().unwrap()`.


    A `thread::Builder` allows you to set some settings for the new thread before
    spawning it. You can use it to configure the stack size for the new thread and
    to give the new thread a name. The name of a thread is available through `thread::current().name()`,
    will be used in panic messages, and will be visible in monitoring and debugging
    tools on most platforms.


    Additionally, Builder’s `spawn` function returns an `io::Result`, allowing you
    to handle situations where spawning a new thread fails. This might happen if the
    operating system runs out of memory, or if resource limits have been applied to
    your program. The `thread::spawn` function simply panics if it is unable to spawn
    a new thread.


    # Scoped Threads


    # WARNING



    \ If we try to capture something that’s not Send our mistake is caught, protecting\
    \ us from undefined behavior.\n\n# Locking: Mutexes and RwLocks\n\nThe most commonly\
    \ used tool for sharing (mutable) data between threads is called a mutex, which\
    \ is short for \"mutual exclusion\". The job of a mutex is to ensure threads have\
    \ exclusive access to some data by temporarily blocking other threads that try\
    \ to access it at the same time.\n\nConceptually, a mutex has only two operations:\
    \ lock and unlock, and two states: locked and unlocked. When a thread locks an\
    \ unlocked mutex, the mutex is marked as locked and the thread can immediately\
    \ continue. When a thread then attempts to lock an already locked mutex, that\
    \ operation will block. The thread is put to sleep while it waits for the mutex\
    \ to be unlocked. Unlocking is only possible on a locked mutex, and should be\
    \ done by the same thread that locked it. If other threads are waiting to lock\
    \ the mutex, unlocking will cause one of those threads to be woken up, so it can\
    \ try to lock the mutex again and continue its course."

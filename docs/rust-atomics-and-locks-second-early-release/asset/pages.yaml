- pgno: 22
  md: "The borrowing rules as introduced in the previous section are simple, but can\
    \ be quite limiting. Especially when multiple threads are involved. Following\
    \ these rules makes communication between threads extremely limited and almost\
    \ impossible, since no data that’s accessible by multiple threads can be mutated.\n\
    \nLuckily, there is an escape hatch: something called *interior mutability*. A\
    \ data type with interior mutability slightly bends the borrowing rules. Under\
    \ certain conditions, those types can allow mutation through an “immutable” reference.\n\
    \nIn “Shared Ownership and Reference Counting”, we’ve already seen one subtle\
    \ example involving interior mutability. Both Rc and Arc mutate a reference counter,\
    \ even though there might be multiple clones all using the same reference counter.\n\
    \nAs soon as interior mutable types are involved, calling a reference “immutable”\
    \ or “mutable” become confusing and inaccurate, since some things can be mutated\
    \ though both. The more accurate terms are “shared” and “exclusive”: a *shared\
    \ reference* (&T) can be copied and shared with others, while a *exclusive reference*\
    \ (&mut T) guarantees it’s the only *exclusive borrowing* of that T. For most\
    \ types, shared references do not allow mutation, but there are exceptions. Since\
    \ in this book we will mostly be working with these exceptions, we’ll use the\
    \ more accurate terms in the rest of this book.\n\n> CAUTION\n> \n> Keep in mind\
    \ that interior mutability only bends the rules of shared borrowing, to allow\
    \ mutation when shared. It does not change anything about exclusive borrowing.\
    \ Exclusive borrowing still guarantees that there are no other active borrows.\
    \ Creating multiple exclusive references to something (through unsafe code) is\
    \ always undefined behavior, regardless of interior mutability.\n\nLet’s take\
    \ a look at a few types with interior mutability, and how they can allow mutation\
    \ through shared references without causing undefined"
  merge: -1
  img_proc: true
- pgno: 23
  md: "behavior.\n\n# Cell\n\nA Cell<T> simply wraps a T, but allows mutations through\
    \ a shared reference. To avoid undefined behavior, it only allows you to copy\
    \ the value out (if T is Copy), or replace it with another value as a whole. In\
    \ addition, it can only be used within a single thread.\n\nLet’s take a look at\
    \ similar example as in the previous section, but this time using Cell<i32> instead\
    \ of i32:\n\n```\nfn f(a: &Cell<i32>, b: &Cell<i32>) {\n    let before = a.get();\n\
    \    b.set(b.get() + 1);\n    let after = a.get();\n    if before != after {\n\
    \        x(); // might happen\n    }\n}\n```\n\nUnlike last time, it is now possible\
    \ for the if condition to be true. Because a Cell<i32> has interior mutability,\
    \ the compiler can no longer assume its value won’t change as long as we have\
    \ a shared reference to it. Both a and b might refer to the same value, such that\
    \ mutating through b might affect a as well. It may still assume, however, that\
    \ no other threads are accessing the cells concurrently.\n\nThe restrictions on\
    \ a Cell are not always easy to work with. Since it can’t directly let us borrow\
    \ the value it holds, we need to move a value out (leaving something in its place),\
    \ modify it, then put it back, to mutate its contents.\n\n```\nfn f(v: &Cell<Vec<i32>>)\
    \ {\n    let mut v2 = v.take(); // Replaces the contents of the Cell with an empty\
    \ Vec\n    v2.push(1);\n    v.set(v2); // Put the modified Vec back\n}\n```"
  merge: -1
  img_proc: true
- pgno: 24
  md: "# RefCell\n\nUnlike a regular Cell, a RefCell does allow you to borrow its\
    \ contents, at a small run-time cost. A RefCell<T> does not only hold a T, but\
    \ also holds a counter that keeps track of any outstanding borrows. If you try\
    \ to borrow it while it is already mutably borrowed, it will panic, which avoids\
    \ undefined behavior. Just like a Cell, a RefCell can only be used within a single\
    \ thread.\n\n```\nfn f(v: &RefCell<Vec<i32>>) {\n    v.borrow_mut().push(1); //\
    \ We can modify the `Vec` directly.\n}\n```\n\nWhile Cell and RefCell can be very\
    \ useful, they become rather useless when we need to do something with multiple\
    \ threads. So let’s move on to the types that are relevant for concurrency.\n\n\
    # Mutex and RwLock\n\nAn RwLock or reader-writer lock is the concurrent version\
    \ of a RefCell. An RwLock<T> holds a T, and tracks any outstanding borrows. However,\
    \ unlike a RefCell, it does not panic on conflicting borrows. Instead, it blocks\
    \ the current thread—putting it to sleep—while waiting for conflicting borrows\
    \ to disappear. We’ll just have to patiently wait for our turn with the data,\
    \ after the other threads are done with it.\n\nBorrowing the contents of an RwLock\
    \ is called locking. By locking it we temporarily block concurrent conflicting\
    \ borrows, allowing us to borrow it without causing data races.\n\nA Mutex (short\
    \ for mutual exclusion) is very similar, but conceptually slightly simpler. Instead\
    \ of keeping track of the number of shared and exclusive borrows like an RwLock,\
    \ it only allows exclusive borrows.\n\nWe’ll go more into detail on these types\
    \ in “Locking: Mutexes and RwLocks”."
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Atomics


    The atomic types represent the concurrent version of a Cell, and are the main
    topic of Chapter 2 and X REF HERE FOR CH03. Like a Cell, they avoid undefined
    behavior by making us copy values in and out as a whole, without letting us borrow
    the contents directly.


    Unlike a Cell though, they cannot be of arbitrary size. Because of this, there
    is no generic Atomic<T> type for any T, but there are only specific atomic types
    such as AtomicU32 and AtomicPtr. Which ones are available depends on the platform,
    since they require support from the processor to avoid data races. (We’ll dive
    into that in X REF HERE FOR CH04.)


    Since they are so limited in size, atomics often don’t directly contain the information
    that needs to be shared between threads. Instead, they are often used as a tool
    to make it possible to share other—often bigger—things between threads. When atomics
    are used to say something about other data, things can get surprisingly complicated.


    # UnsafeCell


    An UnsafeCell is the primitive building block for interior mutability.


    An UnsafeCell<T> wraps a T, but does not come with any conditions or restrictions
    to avoid undefined behavior. Instead, its get method just gives a raw pointer
    to the value it wraps, which can only be meaningfully used in unsafe blocks. It
    leaves it up to the user to use it in a way that does cause any undefined behavior.


    Most commonly, an UnsafeCell is not used directly, but wrapped in another type
    that provides safety through a limited interface, such as Cell or Mutex. All types
    with interior mutability—including all types discussed above—are built on top
    of UnsafeCell.


    # Thread Safety: Send and Sync'

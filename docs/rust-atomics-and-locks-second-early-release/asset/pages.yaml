    would need to wait for some event; for some condition about the data to be come
    true. For example, if we have a mutex protecting a Vec, we might want to wait
    until it contains any elements.


    While a mutex does allow threads to wait until it becomes unlocked, it does not
    provide functionality for waiting for any other conditions. If a mutex'

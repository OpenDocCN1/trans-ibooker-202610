  md: '# Chapter 2. Introduction to Atomics


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 2nd chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at shiraevans@gmail.com.


    The word *atomic* comes from the Greek word ἄτομος, meaning *indivisible*, something
    that cannot be cut into smaller pieces. In computer science, it is used to describe
    an operation that is indivisible: it is either fully completed, or it didn’t happen
    yet.


    As mentioned in “Borrowing and Data Races”, multiple threads concurrently reading
    and modifying the same variable normally results in undefined behavior. However,
    atomic operations do allow for different threads to safely read and modify the
    same variable. Since such an operation is indivisible, it either happens completely
    before or completely after another operation, avoiding undefined behavior. Later,
    in X REF HERE FOR CH04, we’ll see how this works at the hardware level.


    Atomic operations are the main building block for anything involving multiple
    threads. All the other concurrency primitives, such as mutexes and condition variables,
    are implemented using atomic operations.'

  md: 'If we had a more complicated system with threads that are interested in different
    conditions, we could define a `Condvar` for each condition. For example, one to
    indicate the queue is non-empty, and another one to indicate it is empty. Then
    each thread can wait for whichever condition is relevant to what they are doing.


    Normally, a `Condvar` is only ever used together with one single `Mutex`. If two
    threads try to concurrently `wait` on a condition variable using two different
    mutexes, it might cause a panic.


    A downside of a `Condvar` is that it only works when used together with a `Mutex`,
    but for almost most use cases that is perfectly fine, as that’s exactly what’s
    already used anyway.


    # Summary


    +   - Multiple threads can run concurrently within the same program, and can be
    spawned at any time.

    +   - When the main thread ends, the entire program ends.

    +   - Data races are undefined behavior, and fully prevented (in safe code) by
    Rust’s type system.

    +   - Data that is `Send` can be sent to other threads, and data that is `Sync`
    can be shared between threads.

    +   - Regular threads might run as long as the program does, and thus can only
    borrow `''static` data such as statics and leaked allocations.

    +   - Reference counting (`Arc`) can be used to share ownership to make sure data
    lives as long as any thread is using it.

    +   - Scoped threads are useful to limit the lifetime of a thread to allow it
    to borrow non-`''static` data, such as local variables.

    +   - `&T` is a *shared* reference. `&mut T` is an *exclusive* reference. Regular
    types do not allow mutation through a shared reference.'

    # Condition Variables


    Condition variables are a more commonly used option for waiting for something
    to happen to data protected by a mutex. They have two basic operations: wait and
    notify. Threads can wait on a condition variable, and will be woken up when someone
    notifies that same condition variable. Multiple threads can wait on the same condition
    variable, and notifications can either be sent to one waiting thread, or to all
    of them.


    This means that we can create a condition variable for specific events or conditions
    we’re interested in, such as the queue being non-empty, and wait on that condition.
    Any thread that causes that event or condition to happen then notifies the condition
    variable, without having to know which or how many threads are interested in that
    notification.


    To avoid the issue of missing notifications in the brief moment between unlocking
    a mutex and waiting for a condition variable, condition variables provide a way
    to atomically unlock the mutex and start waiting. This means there is simply no
    possible moment for notifications to get lost.


    The Rust standard library provides a condition variable as std::sync::Condvar.
    Its wait method takes a MutexGuard that proves we’ve locked the mutex. It unlocks
    the mutex and goes to sleep, and when woken up it re-locks the mutex and returns
    a new MutexGuard, proving that the mutex is locked again.


    It has two notify functions: notify_one to wake up just one waiting thread (if
    any), and notify_all to wake them all up.


    Let’s modify the example we used for thread parking to use Condvar instead:


    ```

    let queue = Mutex::new(VecDeque::new());

    let not_empty = Condvar::new();

    ```'

- pgno: 14
  md: "There are several ways to create something that’s not owned by a single thread.\
    \ The simplest one is a `static` value, which is *owned* by the entire program,\
    \ instead of an invidual thread. In the following example, both threads can access\
    \ X, but neither of them owns it:\n\n```\nstatic X: [i32; 3] = [1, 2, 3];\n\n\
    thread::spawn(|| dbg!(&X));\nthread::spawn(|| dbg!(&X));\n```\n\nA `static` item\
    \ has a constant initializer, is never dropped, and already exists before the\
    \ main function of the program even starts. Every thread can borrow it, since\
    \ it’s guaranteed to always exist.\n\n# Leaking\n\nAnother way to share ownership\
    \ is by *leaking* an allocation. Using `Box::leak`, one can release ownership\
    \ of a Box, promising to never drop it. From that point on, the Box will live\
    \ forever, without owner, allowing it to be borrowed by any thread for as long\
    \ as the program runs.\n\n```\nlet x: &'static [i32; 3] = Box::leak(Box::new([1,\
    \ 2, 3]));\n\nthread::spawn(move || dbg!(x));\nthread::spawn(move || dbg!(x));\n\
    ```\n\nThe `move` closure might make it look like we’re moving ownership into\
    \ the threads, but a closer look at the type of x reveals that we’re only giving\
    \ the threads *a reference* to the data.\n\n> TIP\n> \n> References are `Copy`,\
    \ meaning that when you `move` them, the original still exists, just like with\
    \ an integer or boolean."
  merge: -1
  img_proc: true
- pgno: 15
  md: "Note how the 'static lifetime doesn’t mean that the value lived since the start\
    \ of the program, but only that it lives to the end of the program. The past is\
    \ simply not relevant.\n\nThe downside of leaking a Box is that we’re leaking\
    \ memory. We allocate something, but never drop and deallocate it. This can be\
    \ fine if this only happens a limited number of times. But if we kept doing this,\
    \ the program would slowly run out of memory.\n\n# Reference Counting\n\nTo be\
    \ able to drop and deallocate something, we can’t completely give up its ownership.\
    \ Instead, we can share ownership. By keeping track of the number of owners, we\
    \ can make sure the value is only dropped when there are no owners left.\n\nThe\
    \ Rust standard library provides this functionality through the Rc type, short\
    \ for \"Reference Counted\". It is very similar to a Box, except cloning it will\
    \ not allocate anything new, but instead increment a counter stored next to the\
    \ contained value. Both the original and cloned Rc will refer to the same allocation;\
    \ they share ownership.\n\n```\nlet a = Rc::new([1, 2, 3]);\nlet b = a.clone();\n\
    \nassert_eq!(a.as_ptr(), b.as_ptr()); // Same allocation!\n```\n\nDropping an\
    \ Rc will decrement the counter. Only the last Rc will see the counter drop to\
    \ zero, and will be the one dropping and deallocating the contained data.\n\n\
    If we try to send an Rc to another thread however, we are faced with the following\
    \ compiler error:\n\n```\nerror[E0277]: `Rc` cannot be sent between threads safely\n\
    \  |\n8 |     thread::spawn(move || dbg!(b));\n  |                    ^^^^^^^^^^^^^^^\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 16
  md: 'As it turns out, Rc is not thread safe (more on that in “Thread Safety: Send
    and Sync”). If multiple threads had an Rc to the same allocation, they might try
    to modify the reference counter at the same time, which can give unpredictable
    results.


    Instead, we can use Arc, which stands for "Atomically Reference Counted". It’s
    identical to Rc, except it guarantees that modifications to the reference counter
    are indivisible — atomic — operations, making it safe to use it with multiple
    threads. (More on that in Chapter 2.)


    ```

    let a = Arc::new([1, 2, 3]); ①

    let b = a.clone(); ②


    thread::spawn(move || dbg!(a)); ③

    thread::spawn(move || dbg!(b)); ③

    ```


    ① We put an array in a new allocation together with a reference counter, which
    starts at one.


    ② Cloning the Arc will increment the reference count to two, and provides us with
    a second Arc to the same allocation.


    ③ Both threads get their own Arc through which they can access the shared array.
    Both will decrement the reference counter when they drop their Arc. The last thread
    to drop its Arc will see the counter drop to zero, and will be the one to drop
    and deallocate the array.'
  merge: -1
  img_proc: true
- pgno: 17
  md: "# NAMING CLONES\n\nHaving to give every clone of an Arc a different name can\
    \ quickly make the code quite cluttered and hard to follow. While every clone\
    \ of an Arc is a separate object, each clone represents the same shared value,\
    \ which is not well reflected by naming each one differently.\n\nRust allows (and\
    \ encourages) you to *shadow* variables by defining a new variable with the same\
    \ name. If you do that in the same scope, the original variable cannot be named\
    \ anymore. But by opening a new scope, a statement like `let a = a.clone();` can\
    \ be used to re-use the same name within that scope, while leaving the original\
    \ variable available outside the scope.\n\nBy wrapping a closure in a new scope\
    \ (with { }), we can clone variables before moving them into the closure, without\
    \ having to rename them.\n\n```\nlet a = Arc::new([1, 2, 3]);\n\nlet b = a.clone();\n\
    \nthread::spawn(move || {\n    dbg!(b);\n});\n\ndbg!(a);\n```\n\n```\nlet a =\
    \ Arc::new([1, 2,\n3]);\n\nthread::spawn({\n    let a = a.clone();\n    move ||\
    \ {\n        dbg!(a);\n    }\n});\n\ndbg!(a);\n```\n\nThe clone of the Arc lives\
    \ in the same scope.\nEach thread gets its own clone with a different name.\n\n\
    The clone of the Arc lives in a different scope.\nWe can use the same name in\
    \ each thread."
  merge: -1
  img_proc: true
- pgno: 18
  md: "Because ownership is shared, reference counting pointers (`Rc<T>` and `Arc<T>`)\
    \ have the same restrictions as shared references (`&T`). They do not give you\
    \ mutable access to their contained value, since the value might be borrowed by\
    \ other code at the same time.\n\n```\nerror[E0596]: cannot borrow data in an\
    \ `Arc` as mutable\n  |\n6 |     a.sort();\n  |     ^^^^^^^^\n```\n\n# Borrowing\
    \ and Data Races\n\nIn Rust, values can be borrowed in two ways:\n\n*Immutable\
    \ Borrowing*\n\nBorrowing something with `&` gives an *immutable reference*. Such\
    \ a reference can be copied. Access to the data it references is shared between\
    \ all copies of such a reference. As the name implies, the compiler does normally\
    \ not allow you to *mutate* something through such a reference, since that might\
    \ affect other code that’s currently borrowing the same data.\n\n*Mutable Borrowing*\n\
    \nBorrowing something with `&mut` gives a *mutable reference*. A mutable borrow\
    \ guarantees it’s the only active borrow of that data, making sure that mutating\
    \ the data will not change anything other code is currently looking at.\n\nThese\
    \ two concepts together fully prevent *data races*: situations where one thread\
    \ is mutating data while another is concurrently accessing it. Data races are\
    \ generally *undefined behavior*, which means the compiler does not need to take\
    \ these situations into account. It will simply assume they do not happen."
  merge: -1
  img_proc: true
- pgno: 19
  md: "To clarify what that means, let’s take a look at an example:\n\n```\nfn f(a:\
    \ &i32, b: &mut i32) {\n    let before = *a;\n    *b += 1;\n    let after = *a;\n\
    \    if before != after {\n        x(); // never happens\n    }\n}\n```\n\nHere,\
    \ we get an immutable reference to an integer, and store the value of the integer\
    \ both before and after incrementing the integer that b refers to. The compiler\
    \ is free to assume the fundamental rules about borrowing and data races are upheld,\
    \ which means that b can’t possibly refer to the same integer as a does. In fact,\
    \ nothing in the entire program can mutably borrow the integer that a refers to\
    \ as long as a is borrowing it. Therefore, it can easily conclude that *a will\
    \ not change and the condition of the if statement will never be true, and can\
    \ completely remove the call to x from the program as an optimization.\n\nIt’s\
    \ impossible to write a Rust program that breaks the compiler’s assumptions, other\
    \ than by using an unsafe block to disable some of the compiler’s safety checks."
  merge: -1

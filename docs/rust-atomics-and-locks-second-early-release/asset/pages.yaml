    It has been proposed and implemented as unstable feature, which is available using
    #![feature(scoped_threads)] on nightly versions of Rust.


    If we know for sure that a spawned thread will definitely not outlive a certain
    scope, that thread could safey borrow things that do not live forever, such as
    local variables, as long as they outlive that scope.


    The Rust standard library provides the `thread::scope` function to spawn such
    scoped threads. It allows us to spawn threads that cannot'

  md: '# THE LEAKPOCALYPSE


    Before Rust 1.0, the standard library had a function named `thread::scoped` that
    would directly spawn a thread, just like `thread::spawn`. It allowed non-''`static`
    captures, because instead of a `JoinHandle`, it returned a `JoinGuard` which joined
    the thread when dropped. Any borrowed data only needed to outlive this `JoinGuard`.
    This seemed safe, as long as the `JoinGuard` gets dropped at some point.


    Just before the release of Rust 1.0, it slowly became clear it’s not possible
    to guarantee that something will be dropped. There are many ways, such as a cycle
    of reference counted nodes, that make it possible to forget about something without
    dropping it.


    Eventually, in what some people refer to as “The Leakpocalypse”, `thread::scoped`
    was removed and `mem::forget` was made *safe* to emphasize that forgetting (or
    leaking) things is always possible, and that `Drop` cannot be relied upon for
    correctness.


    Only much later, in Rust 1.63, a new `thread::scoped` function was added with
    a new design that does not rely on `Drop` for correctness.


    # Shared Ownership and Reference Counting


    So far we’ve looked at transferring ownership of a value to a thread using a `move`
    closure (“Threads in Rust”) and borrowing data from longer-living parent threads
    (“Scoped Threads”). When sharing data between two threads where neither thread
    is guaranteed to outlive the other, neither of them can be the owner of that data.
    Any data shared between them will need to live as long as the longest living thread.


    # Statics'
  merge: -1

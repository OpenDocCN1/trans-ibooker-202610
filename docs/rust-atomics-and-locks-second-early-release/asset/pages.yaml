- pgno: 29
  md: "Protecting data with a mutex is simply the agreement between all threads that\
    \ they will only access the data when they have the mutex locked. That way, no\
    \ two threads can ever access that data concurrently and cause a data race.\n\n\
    # Rust’s Mutex\n\nThe Rust standard library provides this functionality through\
    \ `std::sync::Mutex<T>`. It is a generic type over a type T, where T is the type\
    \ of the data the mutex is protecting mutual exclusive access to. By making this\
    \ T part of the mutex, the data can only be accessed through the mutex, allowing\
    \ for a safe interface that can guarantee all threads will uphold the agreement.\n\
    \nTo ensure a locked mutex can only be unlocked by the thread that locked it,\
    \ it does not have an `unlock()` method. Instead, its `lock()` method returns\
    \ a special type called a `MutexGuard`. This guard represents the guarantee that\
    \ we have locked the mutex. It behaves like an exclusive reference through the\
    \ `DerefMut` trait, giving us exclusive access to the data the mutex protects.\
    \ Unlocking the mutex is done by dropping the guard. When we drop the guard, we\
    \ give up our ability to accesss the data, and the `Drop` implementation of the\
    \ guard will unlock the mutex.\n\nLet’s take a look at an example to see a mutex\
    \ in practice:\n\n```\nfn main() {\n    let n = Mutex::new(0);\n    thread::scope(|s|\
    \ {\n        for _ in 0..10 {\n            s.spawn(|| {\n                let mut\
    \ guard = n.lock().unwrap();\n                for _ in 0..100 {\n            \
    \        *guard += 1;\n                }\n            });\n        }\n    });\n\
    \    assert_eq!(n.into_inner().unwrap(), 1000);\n}\n```"

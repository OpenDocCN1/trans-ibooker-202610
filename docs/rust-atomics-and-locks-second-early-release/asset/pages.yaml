  md: '+   - Some types have interior mutability, which allows for mutation through
    shared references, and is always based on `UnsafeCell`.

    +   - `Cell` and `RefCell` are the standard types for single-threaded interior
    mutability. `Atomics`, `Mutex`, and `RwLock` are their multi-threaded equivalents.

    +   - `Cell` and atomics only allow replacing the value as a whole, while `RefCell`,
    `Mutex`, and `RwLock` allow you to mutate the value directly by dynamically enforcing
    access rules.

    +   - Thread parking can be a convenient way to wait for some condition.

    +   - When a condition is about data protected by a `Mutex`, using a `Condvar`
    is more convenient than thread parking.'

  - "[PAGE 33]\n\n# LIFETIME OF THE MUTEX GUARD\n\nWhile it’s convenient and important\
    \ for correctness that implicitly dropping a guard unlocks the mutex, it can sometimes\
    \ lead to subtle surprises. If we assign the guard a name with a let statement\
    \ (as in our examples above), it’s relatively straight forward to see when it\
    \ will be dropped, since local variables are dropped at the end of the scope they\
    \ are defined in. Still, not explicitly dropping a guard might lead to keeping\
    \ the mutex locked for longer than necessary, as demonstrated in the examples\
    \ above.\n\nUsing a guard without assigning it a name is also possible, and can\
    \ be very convenient at times. Since a MutexGuard behaves like an exclusive reference\
    \ to the protected data, we can directly use it without assigning a name to the\
    \ guard first. For example, if you have a Mutex<Vec<i32>>, you can lock the mutex,\
    \ push an item into the Vec, and unlock the mutex again, in a single statement:\n\
    \n```\nlist.lock().unwrap().push(1);\n```\n\nAny temporaries produced within a\
    \ larger expression, such as the guard returned by lock(), will be dropped at\
    \ the end of the statement. While this might seem obvious and reasonable, it leads\
    \ to a common pitfall that usually involves a match, if let or while let statement.\
    \ Here is an example that runs into this pitfall:\n\n```\nif let Some(item) =\
    \ list.lock().unwrap().pop() {\n    process_item(item);\n}\n```\n\nIf our intention\
    \ was to lock the list, pop an item, unlock the list, and then process the item\
    \ after the list is unlocked, we made a subtle but important mistake here. The\
    \ temporary guard is not dropped until the end of the entire if let statement,\
    \ meaning we needlessly hold on to the lock while processing the item."
  - "[PAGE 34]\n\nPerhaps surprisingly, this does not happen for a similar if statement,\
    \ such as in this example:\n\n```\nif list.lock().unwrap().pop() == Some(1) {\n\
    \    do_something();\n}\n```\n\nHere, the temporary guard does get dropped before\
    \ the body of the if statement is executed. The reason is that the condition of\
    \ a regular if statement is always a plain boolean, which cannot borrow anything.\
    \ There is no reason to extend the lifetime of temporaries from the condition\
    \ to the end of the statement. For an if let statement, however, that might not\
    \ be the case. If we had used front() rather than pop() for example, item would\
    \ be borrowing from the list, making it necessary to keep the guard around. Since\
    \ the borrow checker is only really a check and does not influence when or in\
    \ what order things are dropped, the same happens when we use pop(), even though\
    \ that wouldn’t have been necessary.\n\nWe can avoid this by moving the pop operation\
    \ to a separate let statement. Then the guard is dropped at the end of that statement,\
    \ before the if let:\n\n```\nlet item = list.lock().unwrap().pop();\nif let Some(item)\
    \ = item {\n    process_item(item);\n}\n```\n\n# Reader-Writer Lock\n\nA mutex\
    \ is only concerned with exclusive access. The MutexGuard will provide us an exclusive\
    \ reference (&mut T) to the protected data, even if we only wanted to look at\
    \ the data and a shared reference (&T) would have sufficed."

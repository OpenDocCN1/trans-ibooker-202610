    \ a shared reference (e.g. `&AtomicU8`). This is possible thanks to interior mutability,\
    \ as discussed in “Interior Mutability”.\n\nEach of the available atomic types\
    \ has the same interface with methods for storing and loading, methods for atomic\
    \ `fetch and modify` operations, and some more advanced `compare and exchange`\
    \ methods. We’ll discuss them in detail in rest of this chapter.\n\nBut, before\
    \ we can dive into the different atomic operations, we briefly need to touch upon\
    \ a concept called *memory ordering*.\n\n## Memory Ordering\n\nEvery atomic operation\
    \ takes an argument of type `std::sync::atomic::Ordering`, which determines which\
    \ guarantees we get about the relative ordering of operations. The simplest variant\
    \ with the least guarantees is `Relaxed`. `Relaxed` still guarantees consistency\

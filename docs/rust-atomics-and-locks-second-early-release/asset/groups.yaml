  - "[PAGE 26]\n\nIn this chapter, we’ve seen several types that are not *thread safe*,\
    \ types that can only be used on a single thread, such as `Rc`, `Cell`, and others.\
    \ Since that restriction is needed to avoid undefined behavior, it’s something\
    \ the compiler needs to understand and check for you, so you can use these types\
    \ without having to use `unsafe` blocks.\n\nThe language uses two special traits\
    \ to keep track of which types can be safely used across threads:\n\n# Send\n\n\
    A type is `Send` if it can be sent to another thread. That is, if ownership of\
    \ a value of that type can be transferred to another thread. For example, `Arc<i32>`\
    \ is `Send`, but `Rc<i32>` is not.\n\n# Sync\n\nA type is `Sync` if it can be\
    \ shared with another thread. In other words, a type T is `Sync` if and only if\
    \ a shared reference to that type, `&T`, is `Send`. For example, a `i32` is `Sync`,\
    \ but a `Cell<i32>` is not.\n\nAll primitive types such as `i32`, `bool`, and\
    \ `str` are all both `Send` and `Sync`.\n\nBoth of these traits are *auto traits*,\
    \ which means that they are automatically implemented for your types based on\
    \ their fields. A `struct` with fields that are all `Send` and `Sync`, is itself\
    \ also `Send` and `Sync`.\n\nThe way to opt-out of either of these is to add a\
    \ field to your type that does not implement the trait. For that purpose, the\
    \ special `PhantomData<T>` type often comes in handy. That type is treated by\
    \ the compiler as a T, except it doesn’t actually exist at runtime. It’s a zero\
    \ sized type, taking no space.\n\nLet’s take a look at this struct:\n\n```\nstruct\
    \ X {\n    handle: i32,\n```"
  - "[PAGE 27]\n\n```\n_not_sync: PhantomData<Cell<()>>,\n}\n```\n\nIn this example,\
    \ the struct X would be both Send and Sync if handle was its only field. However,\
    \ we added a zero-sized PhantomData<Cell<()>> field, which is treated as if it\
    \ were a Cell<()>. Since a Cell<()> is not Sync, neither is X. It is still Send,\
    \ however, since all its fields implement Send.\n\nRaw pointers (*const T and\
    \ *mut T) are neither Send nor Sync, since the compiler doesn’t know much about\
    \ what they represent.\n\nThe way to opt-in to either of the traits is the same\
    \ as with any other trait: an impl block to implement the trait for you type:\n\
    \n```\nstruct X {\n    p: *mut i32,\n}\n\nunsafe impl Send for X {}\nunsafe impl\
    \ Sync for X {}\n```\n\nNote how implementing these traits requires the unsafe\
    \ keyword, since the compiler cannot check for you if it’s correct. It’s a promise\
    \ you make to the compiler, which it will just have to trust.\n\nIf you try to\
    \ move something into another thread which is not Send, the compiler will politely\
    \ stop you from doing that. Here is a small example to demonstrate that:\n\n```\n\
    fn main() {\n    let a = Rc::new(123);\n    thread::spawn(move || {\n        dbg!(a);\n\
    \    });\n}\n```\n\nHere, we try to send an Rc<i32> to a new thread, but Rc<i32>,\
    \ unlike Arc<i32>, does not implement Send."
  - "[PAGE 28]\n\nIf we try to compile this, we’re faced with the following error:\n\
    \n```\nerror[E0277]: `Rc<i32>` cannot be sent between threads safely\n    -->\
    \ src/main.rs:3:5\n     |\n3   |         thread::spawn(move || {\n     |     \
    \    ^^^^^^^^^^^^^ `Rc<i32>` cannot be sent between\nthreads safely\n     |\n\
    \     = help: within `[closure@src/main.rs:3:19: 5:6]`, the trait\n`Send` is not\
    \ implemented for `Rc<i32>`\n     = note: required because it appears within the\
    \ type\n`[closure@src/main.rs:5:19: 5:6]`\nnote: required by a bound in `spawn`\n\
    ```\n\nThe thread::spawn function requires its argument to be Send, and a closure\
    \ is only Send if all of its captures are. If we try to capture something that’s\
    \ not Send our mistake is caught, protecting us from undefined behavior.\n\n#\
    \ Locking: Mutexes and RwLocks\n\nThe most commonly used tool for sharing (mutable)\
    \ data between threads is called a mutex, which is short for \"mutual exclusion\"\
    . The job of a mutex is to ensure threads have exclusive access to some data by\
    \ temporarily blocking other threads that try to access it at the same time.\n\
    \nConceptually, a mutex has only two operations: lock and unlock, and two states:\
    \ locked and unlocked. When a thread locks an unlocked mutex, the mutex is marked\
    \ as locked and the thread can immediately continue. When a thread then attempts\
    \ to lock an already locked mutex, that operation will block. The thread is put\
    \ to sleep while it waits for the mutex to be unlocked. Unlocking is only possible\
    \ on a locked mutex, and should be done by the same thread that locked it. If\
    \ other threads are waiting to lock the mutex, unlocking will cause one of those\
    \ threads to be woken up, so it can try to lock the mutex again and continue its\
    \ course."

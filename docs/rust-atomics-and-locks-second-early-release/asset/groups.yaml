    In Rust, atomic operations are available through as methods on the standard atomic
    types that live in `std::sync::atomic`. They all have names starting with `Atomic`,
    such as `AtomicI32` or `AtomicUsize`. Which of them are available depends on the
    hardware architecture and sometimes operating system, but almost all platforms
    provide at least all atomic types up to the size of a pointer.


    Unlike most types, they allow modification through a shared reference (e.g. `&AtomicU8`).
    This is possible thanks to interior mutability, as discussed in “Interior Mutability”.


    Each of the available atomic types has the same interface with methods for storing
    and loading, methods for atomic `fetch and modify` operations, and some more advanced
    `compare and exchange` methods. We’ll discuss them in detail in rest of this chapter.


    But, before we can dive into the different atomic operations, we briefly need
    to touch upon a concept called *memory ordering*.


    # Memory Ordering


    Every atomic operation takes an argument of type `std::sync::atomic::Ordering`,
    which determines which guarantees we get about the relative ordering of operations.
    The simplest variant with the least guarantees is `Relaxed`. `Relaxed` still guarantees
    consistency on a single atomic variable, but does not promise anything about the
    relative order of operations between different variables.


    What that means is that two threads might see operations on different variables
    happen in a different order. For example, if one thread writes to one variable
    first and then to a second variable very quickly afterwards, another thread might
    see that happen in opposite order.


    In this chapter we’ll only look at use cases where this is not a problem, and
    simply use `Relaxed` everywhere without going more into detail. We’ll discuss
    all the details of memory ordering and the other available memory orderings in
    X REF HERE FOR CH03.'

  md: "\n## Atomic Loads and Stores\n\nThe first two atomic operations we’ll look\
    \ at are the most basic ones: load and store. Their function signatures are as\
    \ follows:\n\n```\nimpl AtomicI32 {\n    pub fn load(&self, ordering: Ordering)\
    \ -> i32;\n    pub fn store(&self, value: i32, ordering: Ordering);\n}\n```\n\n\
    The load method atomically loads the value stored in the atomic variable, and\
    \ the store method atomically stores a new value in it. Note how the store method\
    \ takes a shared reference (&T) rather than an exclusive reference (&mut T), even\
    \ though it modifies the value.\n\nLet’s take a look at some realistic use cases\
    \ for these two methods.\n\n## Example: Stop Flag\n\nThe first example uses an\
    \ AtomicBool for a stop flag. Such a flag is used to inform other threads to stop\
    \ running.\n\n```\nfn main() {\n    static STOP: AtomicBool = AtomicBool::new(false);\n\
    \n    // Spawn a thread to do the work.\n    let background_thread = thread::spawn(||\
    \ {\n        while !STOP.load(Relaxed) {\n            some_work();\n        }\n\
    \    });\n\n    // Use the main thread to listen for user input.\n    for line\
    \ in std::io::stdin().lines() {\n        match line.unwrap().as_str() {\n    \
    \        \"help\" => println!(\"commands: help, stop\"),\n            \"stop\"\
    \ => break,\n            cmd => println!(\"unknown command: {cmd:?}\"),\n    \
    \    }\n    }\n\n    // Inform the background thread it needs to stop.\n    STOP.store(true,\
    \ Relaxed);\n\n    // Wait until the background thread finishes.\n    background_thread.join().unwrap();\n\
    }\n```\n\nIn this example, the background thread is repeatedly running some_work(),\
    \ while the main thread allows the user to enter some commands to interact with\
    \ the program. In this simple example, the only useful command is stop to make\
    \ the program stop.\n\nTo make the background thread stop, the atomic STOP boolean\
    \ is used to communicate this condition to the background thread. When the foreground\
    \ thread reads the stop command, it sets the flag to true, which is checked by\
    \ the background thread before each new iteration. The main thread waits until\
    \ the background thread is finished with its current iteration using the join\
    \ method.\n\nThis simple solution works great as long as the flag is regularly\
    \ checked by the background thread. If it can get stuck in some_work() for a long\
    \ time, this might result in an unacceptable delay between the stop command and\
    \ the program quitting.\n\n## Example: Progress Reporting\n\nIn our next example\
    \ we process 100 items one by one on a background thread, while the main thread\
    \ gives the user regular updates on the progress.\n\n```\nfn main() {\n    let\
    \ num_done = AtomicUsize::new(0);\n\n    thread::scope(|s| {\n        // A background\
    \ thread to process all 100 items.\n        s.spawn(|| {\n            for i in\
    \ 0..100 {\n                process_item(i);\n                num_done.store(i\
    \ + 1, Relaxed);\n            }\n        });\n\n        // The main thread shows\
    \ status updates, every second.\n        loop {\n            let n = num_done.load(Relaxed);\n\
    \            if n == 100 { break; }\n            println!(\"Working.. {n}/100\
    \ done\");\n            thread::sleep(Duration::from_secs(1));\n        }\n  \
    \  });\n\n    println!(\"Done!\");\n}\n```\n\nThis time, we use a scoped thread\
    \ (“Scoped Threads”), which will automatically handle the joining of the thread\
    \ for us, and also allow us to borrow local variables.\n\nEvery time the background\
    \ thread finishes processing an item, it stores the number of processed items\
    \ in an AtomicUsize. Meanwhile, the main thread shows that number to the user\
    \ to inform them of the progress, about once per second. Once the main thread\
    \ sees all 100 items have been processed, it exits the scope, which implicitly\
    \ joins the background thread, and informs the user everything is done.\n\n##\
    \ Synchronization\n\nOnce the last item is processed, it might take up to one\
    \ whole second for the main thread to know that, introducing an unnecessary delay\
    \ at the end. To solve this, we can use thread parking (“Thread parking”) to wake\
    \ the main thread from its sleep whenever there is new information it might be\
    \ interested in.\n\nHere’s the same example, but now using thread::park_timeout\
    \ rather than thread::sleep:\n\n```\nfn main() {\n    let num_done = AtomicUsize::new(0);\n\
    \n    let main_thread = thread::current();\n\n    thread::scope(|s| {\n      \
    \  // A background thread to process all 100 items.\n        s.spawn(|| {\n  \
    \          for i in 0..100 {\n                process_item(i);\n             \
    \   num_done.store(i + 1, Relaxed);\n                main_thread.unpark(); //\
    \ Wake up the main thread.\n            }\n        });\n\n        // The main\
    \ thread shows status updates.\n        loop {\n            let n = num_done.load(Relaxed);\n\
    \            if n == 100 { break; }\n            println!(\"Working.. {n}/100\
    \ done\");\n            thread::park_timeout(Duration::from_secs(1));\n      \
    \  }\n    });\n\n    println!(\"Done!\");\n}\n```\n\nNot much has changed. We’ve\
    \ obtained a handle to the main thread through thread::current(), that’s now used\
    \ by the background thread to unpark the main thread after every status update.\
    \ The main thread now uses park_timeout rather than sleep, such that it can be\
    \ interrupted.\n\nNow, any status updates are immediately reported to the user,\
    \ while still repeating the last update every second to show the program is still\
    \ running.\n\n## Example: Lazy Initialization\n\nThe last example before we move\
    \ on to more advanced atomic operations is about lazy initialization.\n\nImagine\
    \ there is a value x which we are reading from a file, obtaining from the operating\
    \ system, or calculating in some other way, that we expect to be constant. Maybe\
    \ x is the version of the operating system, or the total amount of memory, or\
    \ the 400th digit of tau. It doesn’t really matter for this example.\n\nSince\
    \ we don’t expect it to change, we can request or calculate it only the first\
    \ time we need it, and remember the result. The first thread that needs it will\
    \ have to calculate the value, but it can store it in an atomic static to make\
    \ it available for all threads, including itself if it needs it again later.\n\
    \nLet’s take a look at an example of this. To keep things simple, we’ll assume\
    \ x is never zero, such that we can use zero as a placeholder before it has been\
    \ calculated.\n\n```\nfn get_x() -> u64 {\n    static X: AtomicU64 = AtomicU64::new(0);\n\
    \    let mut x = X.load(Relaxed);\n    if x == 0 {\n        x = calculate_x();\n\
    \        X.store(x, Relaxed);\n    }\n    x\n}\n```\n\nThe first thread to call\
    \ get_x() will check the static X and see it is still zero, calculate its value,\
    \ and store the result back in the static to make it available for future use.\
    \ Later, any call to get_x() will see the value in the static is nonzero, and\
    \ return it immediately without calculating it again.\n\nHowever, if a second\
    \ thread calls get_x() while the first one is still calculating x, the second\
    \ thread will also see a zero and also calculate x in parallel. One of the threads\
    \ will end up overwriting the result of the other, depending on which one finishes\
    \ first. This is called a race. Not a data race, which is undefined behaviour\
    \ and impossible in Rust without using unsafe, but still a race with an unpredictable\
    \ winner.\n\nSince we expect x to be constant, it doesn’t matter who wins the\
    \ race, as the result will be the same regardless. Depending on how much time\
    \ we expect calculate_x() to take, this might be a very good or very bad strategy.\n\
    \nIf calculate_x() is expected to take a long time, it’s better if threads wait\
    \ while the first thread is still initializing x. You could implement this using\
    \ a condition variable or thread parking (“Waiting: Parking and Condition Variables”),\
    \ but that quickly gets too complicated for a small example. The Rust standard\
    \ library provides exactly this functionality through std::sync::Once and std::lazy::SyncOnceCell,\
    \ so there’s usually no need to implement these yourself.\n\n## Fetch-and-Modify\
    \ Operations\n\nNow that we’ve seen a few use cases for the basic load and store\
    \ operations, let’s move on to more interesting operations: the fetch and modify\
    \ operations. These operations modify the atomic variable, but also load (fetch)\
    \ the original value, as a single atomic operation.\n\nThe most commonly used\
    \ ones are fetch_add and fetch_sub, which perform addition and subtraction respectively.\
    \ Some of the other available operations are fetch_or and fetch_and for bitwise\
    \ operations, and fetch_max and fetch_min which can be used to keep a running\
    \ maximum or minimum.\n\nTheir function signatures are as follows:\n\n```\nimpl\
    \ AtomicI32 {\n    pub fn fetch_add(&self, v: i32, ordering: Ordering) -> i32;\n\
    \    pub fn fetch_sub(&self, v: i32, ordering: Ordering) -> i32;\n    pub fn fetch_or(&self,\
    \ v: i32, ordering: Ordering) -> i32;\n    pub fn fetch_and(&self, v: i32, ordering:\
    \ Ordering) -> i32;\n    pub fn fetch_nand(&self, v: i32, ordering: Ordering)\
    \ -> i32;\n    pub fn fetch_xor(&self, v: i32, ordering: Ordering) -> i32;\n \
    \   pub fn fetch_max(&self, v: i32, ordering: Ordering) -> i32;\n    pub fn fetch_min(&self,\
    \ v: i32, ordering: Ordering) -> i32;\n    pub fn swap(&self, v: i32, ordering:\
    \ Ordering) -> i32; // \"fetch_store\"\n}\n```\n\nThe one outlier is the operation\
    \ that simply stores a new value, regardless of the old value. Instead of fetch_store,\
    \ it has been called swap.\n\nHere’s a quick demonstration showing how fetch_add\
    \ returns the value before the operation:\n\n```\nlet a = AtomicU32::new(100);\n\
    let b = a.fetch_add(23, Relaxed);\n```\n"
  mdcn: "\n\n## 原子加载与存储\n\n我们接下来要查看的第一个两个原子操作是最基本的操作：加载和存储。它们的函数签名如下：\n\n```\nimpl\
    \ AtomicI32 {\n    pub fn load(&self, ordering: Ordering) -> i32;\n    pub fn\
    \ store(&self, value: i32, ordering: Ordering);\n}\n```\n\n`load` 方法会原子地加载原子变量中存储的值，而\
    \ `store` 方法会原子地在其中存储一个新值。注意 `store` 方法接受一个共享引用（&T）而不是独占引用（&mut T），即使它修改了值。\n\n\
    让我们来看一下这两种方法的一些实际用例。\n\n## 示例：停止标志\n\n第一个示例使用 `AtomicBool` 作为停止标志。这种标志用于通知其他线程停止运行。\n\
    \n```\nfn main() {\n    static STOP: AtomicBool = AtomicBool::new(false);\n\n\
    \    // Spawn a thread to do the work.\n    let background_thread = thread::spawn(||\
    \ {\n        while !STOP.load(Relaxed) {\n            some_work();\n        }\n\
    \    });\n\n    // Use the main thread to listen for user input.\n    for line\
    \ in std::io::stdin().lines() {\n        match line.unwrap().as_str() {\n    \
    \        \"help\" => println!(\"commands: help, stop\"),\n            \"stop\"\
    \ => break,\n            cmd => println!(\"unknown command: {cmd:?}\"),\n    \
    \    }\n    }\n\n    // Inform the background thread it needs to stop.\n    STOP.store(true,\
    \ Relaxed);\n\n    // Wait until the background thread finishes.\n    background_thread.join().unwrap();\n\
    }\n```\n\n在这个示例中，后台线程会反复运行 `some_work()`，而主线程允许用户输入一些命令来与程序交互。在这个简单示例中，唯一有用的命令是\
    \ `stop` 用于使程序停止。\n\n为了让后台线程停止，使用原子 `STOP` 布尔值来向后台线程传达此条件。当前台线程读取到停止命令时，它将标志设置为\
    \ true，后台线程在每次新迭代之前都会检查该标志。主线程使用 `join` 方法等待后台线程完成当前迭代。\n\n只要后台线程定期检查标志，这个简单的解决方案就运作良好。如果\
    \ `some_work()` 可能长时间被阻塞，这可能会导致从发出停止命令到程序退出之间出现不可接受的延迟。\n\n## 示例：进度报告\n\n在下一个示例中，我们在后台线程上逐个处理\
    \ 100 个项目，同时主线程定期向用户提供进度更新。\n\n```\nfn main() {\n    let num_done = AtomicUsize::new(0);\n\
    \n    thread::scope(|s| {\n        // A background thread to process all 100 items.\n\
    \        s.spawn(|| {\n            for i in 0..100 {\n                process_item(i);\n\
    \                num_done.store(i + 1, Relaxed);\n            }\n        });\n\
    \n        // The main thread shows status updates, every second.\n        loop\
    \ {\n            let n = num_done.load(Relaxed);\n            if n == 100 { break;\
    \ }\n            println!(\"Working.. {n}/100 done\");\n            thread::sleep(Duration::from_secs(1));\n\
    \        }\n    });\n\n    println!(\"Done!\");\n}\n```\n\n这次，我们使用了一个作用域线程（“Scoped\
    \ Threads”），它会自动为我们处理线程的 join，并允许我们借用局部变量。\n\n每当后台线程完成处理一个项目时，它会将已处理的项目数量存储在 `AtomicUsize`\
    \ 中。与此同时，主线程会将该数字显示给用户以告知进度，大约每秒一次。一旦主线程看到所有 100 个项目都已处理完毕，它就会退出作用域，这会隐式地 join\
    \ 后台线程，并通知用户一切已完成。\n\n## 同步\n\n一旦最后一个项目被处理，主线程可能需要长达一整秒的时间才知道这一点，从而在末尾引入不必要的延迟。为了解决这个问题，我们可以使用线程挂起（“Thread\
    \ parking”）在有新信息时唤醒主线程使其从睡眠中恢复。\n\n下面是同一个示例，但现在使用 `thread::park_timeout` 而不是 `thread::sleep`：\n\
    \n```\nfn main() {\n    let num_done = AtomicUsize::new(0);\n\n    let main_thread\
    \ = thread::current();\n\n    thread::scope(|s| {\n        // A background thread\
    \ to process all 100 items.\n        s.spawn(|| {\n            for i in 0..100\
    \ {\n                process_item(i);\n                num_done.store(i + 1, Relaxed);\n\
    \                main_thread.unpark(); // Wake up the main thread.\n         \
    \   }\n        });\n\n        // The main thread shows status updates.\n     \
    \   loop {\n            let n = num_done.load(Relaxed);\n            if n == 100\
    \ { break; }\n            println!(\"Working.. {n}/100 done\");\n            thread::park_timeout(Duration::from_secs(1));\n\
    \        }\n    });\n\n    println!(\"Done!\");\n}\n```\n\n变化不大。我们通过 `thread::current()`\
    \ 获得了主线程的句柄，后台线程现在在每次状态更新后使用它来取消挂起主线程。主线程现在使用 `park_timeout` 而不是 `sleep`，这样它就可以被中断。\n\
    \n现在，任何状态更新都会立即报告给用户，同时仍会每秒重复上一次更新以显示程序仍在运行。\n\n## 示例：延迟初始化\n\n在我们进入更高级的原子操作之前，最后一个示例是关于延迟初始化的。\n\
    \n假设有一个值 x，我们是从文件中读取、从操作系统获取或以其他方式计算的，我们期望它是恒定的。也许 x 是操作系统的版本，或者总内存量，或者 tau 的第\
    \ 400 位数字。对于这个示例来说并不重要。\n\n由于我们不期望它发生变化，我们可以在第一次需要时才请求或计算它，并记住结果。第一个需要它的线程必须计算该值，但它可以将其存储在原子静态变量中以供所有线程使用，包括如果它以后再次需要时它自己使用。\n\
    \n让我们看一个示例。为了简单起见，我们假设 x 从不为零，这样我们就可以在计算之前使用零作为占位符。\n\n```\nfn get_x() -> u64\
    \ {\n    static X: AtomicU64 = AtomicU64::new(0);\n    let mut x = X.load(Relaxed);\n\
    \    if x == 0 {\n        x = calculate_x();\n        X.store(x, Relaxed);\n \
    \   }\n    x\n}\n```\n\n第一个调用 `get_x()` 的线程会检查静态变量 X，看到它仍然为零，计算其值，并将结果写回静态变量以供将来使用。之后，任何对\
    \ `get_x()` 的调用都会看到静态变量中的值不为零，并立即返回它而不再次计算。\n\n然而，如果第二个线程在第一个线程仍在计算 x 时调用 `get_x()`，第二个线程也会看到零并并行计算\
    \ x。哪个线程先完成，结果就会被另一个线程覆盖。这就是所谓的竞争。不是数据竞争，这在 Rust 中是不确定的行为且在不使用 unsafe 的情况下不可能发生，但仍然是一种具有不可预测获胜者的竞争。\n\
    \n由于我们期望 x 是恒定的，谁赢得竞争并不重要，因为结果无论如何都相同。根据我们期望 `calculate_x()` 花费的时间，这可能是一种非常好或非常糟糕的策略。\n\
    \n如果预计 `calculate_x()` 需要很长时间，最好让线程在第一个线程仍在初始化 x 时等待。你可以使用条件变量或线程挂起（“Waiting:\
    \ Parking and Condition Variables”）来实现这一点，但对于一个小示例来说这很快就会变得过于复杂。Rust 标准库通过 `std::sync::Once`\
    \ 和 `std::lazy::SyncOnceCell` 提供了完全相同的功能，因此通常无需自己实现。\n\n## 获取并修改操作\n\n现在我们已经看到了基本加载和存储操作的几个用例，让我们继续介绍更有趣的操作：获取并修改操作。这些操作会修改原子变量，但也会作为一次原子操作加载（获取）原始值。\n\
    \n最常用的有 `fetch_add` 和 `fetch_sub`，分别执行加法和减法。其他可用的操作包括用于位操作的 `fetch_or` 和 `fetch_and`，以及可用于保持运行最大值或最小值的\
    \ `fetch_max` 和 `fetch_min`。\n\n它们的函数签名如下：\n\n```\nimpl AtomicI32 {\n    pub fn\
    \ fetch_add(&self, v: i32, ordering: Ordering) -> i32;\n    pub fn fetch_sub(&self,\
    \ v: i32, ordering: Ordering) -> i32;\n    pub fn fetch_or(&self, v: i32, ordering:\
    \ Ordering) -> i32;\n    pub fn fetch_and(&self, v: i32, ordering: Ordering) ->\
    \ i32;\n    pub fn fetch_nand(&self, v: i32, ordering: Ordering) -> i32;\n   \
    \ pub fn fetch_xor(&self, v: i32, ordering: Ordering) -> i32;\n    pub fn fetch_max(&self,\
    \ v: i32, ordering: Ordering) -> i32;\n    pub fn fetch_min(&self, v: i32, ordering:\
    \ Ordering) -> i32;\n    pub fn swap(&self, v: i32, ordering: Ordering) -> i32;\
    \ // \"fetch_store\"\n}\n```\n\n唯一的例外是简单地存储新值而不考虑旧值的操作。它没有被命名为 `fetch_store`，而是被命名为\

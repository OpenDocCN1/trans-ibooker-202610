  - "[PAGE 29]\n\nProtecting data with a mutex is simply the agreement between all\
    \ threads that they will only access the data when they have the mutex locked.\
    \ That way, no two threads can ever access that data concurrently and cause a\
    \ data race.\n\n# Rust’s Mutex\n\nThe Rust standard library provides this functionality\
    \ through `std::sync::Mutex<T>`. It is a generic type over a type T, where T is\
    \ the type of the data the mutex is protecting mutual exclusive access to. By\
    \ making this T part of the mutex, the data can only be accessed through the mutex,\
    \ allowing for a safe interface that can guarantee all threads will uphold the\
    \ agreement.\n\nTo ensure a locked mutex can only be unlocked by the thread that\
    \ locked it, it does not have an `unlock()` method. Instead, its `lock()` method\
    \ returns a special type called a `MutexGuard`. This guard represents the guarantee\
    \ that we have locked the mutex. It behaves like an exclusive reference through\
    \ the `DerefMut` trait, giving us exclusive access to the data the mutex protects.\
    \ Unlocking the mutex is done by dropping the guard. When we drop the guard, we\
    \ give up our ability to accesss the data, and the `Drop` implementation of the\
    \ guard will unlock the mutex.\n\nLet’s take a look at an example to see a mutex\
    \ in practice:\n\n```\nfn main() {\n    let n = Mutex::new(0);\n    thread::scope(|s|\
    \ {\n        for _ in 0..10 {\n            s.spawn(|| {\n                let mut\
    \ guard = n.lock().unwrap();\n                for _ in 0..100 {\n            \
    \        *guard += 1;\n                }\n            });\n        }\n    });\n\
    \    assert_eq!(n.into_inner().unwrap(), 1000);\n}\n```"
  - "[PAGE 30]\n\nHere, we have a Mutex<i32>, a mutex protecting an integer, and spawn\
    \ ten threads to each increment the integer one hundred times. Each thread will\
    \ first lock the mutex to obtain a mutex guard through lock(), and then use that\
    \ guard to access the integer and modify it. The guard is implicitly dropped right\
    \ after, when that variable goes out of scope.\n\nAfter the threads are done,\
    \ we can safely remove the protection from the integer through into_inner(). The\
    \ into_inner method takes an exclusive reference to the mutex, which guarantees\
    \ nothing else can have a reference to the mutex anymore, making locking unnecessary.\n\
    \nEven though the increments happen in steps of one, a thread observing the integer\
    \ would only ever see multiples of 100, since it can only look at the integer\
    \ when the mutex is unlocked. Effectively, thanks to the mutex, the one hundred\
    \ increments together are now a single undividable, atomic, operation.\n\nTo clearly\
    \ see the effect of the mutex, we can make each thread wait a second before unlocking\
    \ the mutex:\n\n```\n..    s.spawn(|| {\n        let mut guard = n.lock().unwrap();\n\
    \        for _ in 0..100 {\n            *guard += 1;\n        }\n        thread::sleep(Duration::from_secs(1));\
    \ // Sleep\nbefore unlocking the mutex.\n    });\n..\n```\n\nWhen you run the\
    \ program now, you will see it will take about ten seconds to complete. Each thread\
    \ only waits for one second, but the mutex will ensure only one thread at a time\
    \ can do so.\n\nIf we drop the guard, and therefore unlock the mutex, before sleeping\
    \ one second, we will see it happen in parallel instead.\n\n```\n..    s.spawn(||\
    \ {\n```"
  - "[PAGE 31]\n\n```\nlet mut guard = n.lock().unwrap();\nfor _ in 0..100 {\n   \
    \ *guard += 1;\n}\ndrop(guard); // Drop the guard before sleeping\nthread::sleep(Duration::from_secs(1));\n\
    });\n```\n\none second.\n..\n\nWith this change, this program will only take about\
    \ one second, since now the ten threads can execute their one-second sleep at\
    \ the same time. This shows the importance of keeping the amount of time a mutex\
    \ is locked as short as possible. Keeping a mutex locked longer than necessary\
    \ can completely nullify any benefits of parallelism, effectively forcing everything\
    \ to happen in series instead.\n\n# Lock Poisoning\n\nThe unwrap() calls in the\
    \ examples above relate to lock poisoning.\n\nA Mutex in Rust gets marked as poisoned\
    \ when a thread panics while it was holding the lock. The lock method returns\
    \ an Err if the lock was poisoned.\n\nThis is a mechanism to protect against leaving\
    \ the data that’s protected by a mutex in an inconsistent state. If in our example\
    \ above a thread would panic after incrementing the integer fewer than one hundred\
    \ times, the mutex unlocks and the integer is left in an unexpected state where\
    \ it is not a multiple of 100 anymore, possibly breaking assumptions made by other\
    \ threads. Automatically marking the mutex as poisoned in that case forces the\
    \ user to handle this possibility.\n\nCalling lock() on a poisoned mutex still\
    \ locks the mutex. The Err returned by lock() contains the mutex guard, allowing\
    \ us to correct an inconsistent state or simply ignore the poison.\n\nWhile lock\
    \ poisoning might seem like a good idea, it is not often used in practice. Most\
    \ code either ignores poison, or uses unwrap() to panic if"

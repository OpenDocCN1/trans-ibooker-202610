    \ when a consumer is waiting, and what condition it is waiting for.\n\n## Condition\
    \ Variables\n\nCondition variables are a more commonly used option for waiting\
    \ for something to happen to data protected by a mutex. They have two basic operations:\
    \ wait and notify. Threads can wait on a condition variable, and will be woken\
    \ up when someone notifies that same condition variable. Multiple threads can\
    \ wait on the same condition variable, and notifications can either be sent to\
    \ one waiting thread, or to all of them.\n\nThis means that we can create a condition\
    \ variable for specific events or conditions we’re interested in, such as the\
    \ queue being non-empty, and wait on that condition. Any thread that causes that\
    \ event or condition to happen then notifies the condition variable, without having\
    \ to know which or how many threads are interested in that notification.\n\nTo\
    \ avoid the issue of missing notifications in the brief moment between unlocking\
    \ a mutex and waiting for a condition variable, condition variables provide a\
    \ way to atomically unlock the mutex and start waiting. This means there is simply\
    \ no possible moment for notifications to get lost.\n\nThe Rust standard library\
    \ provides a condition variable as std::sync::Condvar. Its wait method takes a\
    \ MutexGuard that proves we’ve locked the mutex. It unlocks the mutex and goes\
    \ to sleep, and when woken up it re-locks the mutex and returns a new MutexGuard,\
    \ proving that the mutex is locked again.\n\nIt has two notify functions: notify_one\
    \ to wake up just one waiting thread (if any), and notify_all to wake them all\
    \ up.\n\nLet’s modify the example we used for thread parking to use Condvar instead:\n\
    \n```\nlet queue = Mutex::new(VecDeque::new());\nlet not_empty = Condvar::new();\n\
    ```\n\n```\nthread::scope(|s| {\n    s.spawn(|| {\n        loop {\n          \
    \  let mut q = queue.lock().unwrap();\n            let item = loop {\n       \
    \         if let Some(item) = q.pop_front() {\n                    break item;\n\
    \                } else {\n                    q = not_empty.wait(q).unwrap();\n\
    \                }\n            };\n            drop(q);\n            dbg!(item);\n\
    \        }\n    });\n\n    for i in 0.. {\n        queue.lock().unwrap().push_back(i);\n\
    \        not_empty.notify_one();\n        thread::sleep(Duration::from_secs(1));\n\
    \    }\n});\n```\n\nWe had to change a few things:\n\n- We now not only have a\
    \ Mutex containing the queue, but also a Condvar to communicate the not empty\
    \ condition through.\n- We no longer need to know which thread to wake up, so\
    \ we don’t store the return value from spawn anymore. Instead, we notify the consumer\

    \ atomic operations do allow for different threads to safely read and modify the\
    \ same variable. Since such an operation is indivisible, it either happens completely\
    \ before or completely after another operation, avoiding undefined behavior. Later,\
    \ in X REF HERE FOR CH04, we’ll see how this works at the hardware level.\n\n\
    Atomic operations are the main building block for anything involving multiple\
    \ threads. All the other concurrency primitives, such as mutexes and condition\
    \ variables, are implemented using atomic operations.\n\nIn Rust, atomic operations\
    \ are available through as methods on the standard atomic types that live in `std::sync::atomic`.\
    \ They all have names starting with `Atomic`, such as `AtomicI32` or `AtomicUsize`.\
    \ Which of them are available depends on the hardware architecture and sometimes\

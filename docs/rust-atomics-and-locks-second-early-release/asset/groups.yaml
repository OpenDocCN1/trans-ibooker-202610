    \ allows the user to enter some commands to interact with the program. In this\
    \ simple example, the only useful command is stop to make the program stop.\n\n\
    To make the background thread stop, the atomic STOP boolean is used to communicate\
    \ this condition to the background thread. When the foreground thread reads the\
    \ stop command, it sets the flag to true, which is checked by the background thread\
    \ before each new iteration. The main thread waits until the background thread\
    \ is finished with its current iteration using the join method.\n\nThis simple\

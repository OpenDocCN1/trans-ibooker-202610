    \n# Example: Progress Reporting\n\nIn our next example we process 100 items one\
    \ by one on a background thread, while the main thread gives the user regular\
    \ updates on the progress.\n\n```\nfn main() {\n    let num_done = AtomicUsize::new(0);\n\
    \n    thread::scope(|s| {\n        // A background thread to process all 100 items.\n\
    \        s.spawn(|| {\n            for i in 0..100 {\n                process_item(i);\n\
    \                num_done.store(i + 1, Relaxed);\n            }\n        });\n\
    \    });\n```"

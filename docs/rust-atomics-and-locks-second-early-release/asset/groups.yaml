  mdcn: "\n\nA second way to deal with the overflow is to use `fetch_sub` to decrement\
    \ the counter again before panicking, like this:\n\n```\nfn allocate_new_id()\
    \ -> u32 {\n    static NEXT_ID: AtomicU32 = AtomicU32::new(0);\n    let id = NEXT_ID.fetch_add(1,\
    \ Relaxed);\n    if id >= 1000 {\n        NEXT_ID.fetch_sub(1, Relaxed);\n   \
    \     panic!(\"too many IDs!\");\n    }\n    id\n}\n```\n\nIt’s still possible\
    \ for the counter to very briefly be incremented beyond 1000 when multiple threads\
    \ execute this function at the same time, it is limited by the amount of active\
    \ threads. It’s reasonable to assume there will never be billions of active threads\
    \ at once, especially not all simultaneously executing the same function in the\
    \ brief moment between `fetch_add` and `fetch_sub`.\n\nThis is how overflows are\
    \ handled for the number of running threads in the standard library’s `thread::scope`\
    \ implementation.\n\nThe third way of handling overflows is arguably the only\
    \ truly correct one, as it prevents the addition from happening at all if it would\
    \ overflow. However, we cannot implement that with the atomic operations we’ve\
    \ seen so far. For this, we’ll need compare-and-exchange operations.\n\n## Compare-and-Exchange\
    \ Operations\n\nThe most advanced and flexible atomic operation is the *compare\
    \ and exchange* operation. This operation checks if the atomic value is equal\
    \ to a given value, and only if that is the case will it replace it with a new\
    \ value, all atomically as a single operation. It will return the previous value\
    \ and tell us whether it replaced it or not.\n\nIts signature is a bit more complicated\
    \ than the ones we’ve seen so far:\n\n```\nimpl AtomicI32 {\n    pub fn compare_exchange(\n\
    \        &self,\n        expected: i32,\n        new: i32,\n        store_order:\
    \ Ordering,\n        load_order: Ordering\n    ) -> Result<i32, i32>;\n}\n```\n\
    \nIgnoring memory ordering for a moment, it is basically identical to the following\
    \ implementation, except it all happens as a single undividable atomic operation:\n\
    \n```\npub fn compare_exchange(&self, expected: i32, new: i32) -> Result<i32,\
    \ i32> {\n    // In reality, the load, comparison and store,\n    // all happen\
    \ as a single atomic operation.\n    let v = self.load();\n    if v == expected\
    \ {\n        // Value is as expected. Replace it and report success.\n       \
    \ self.store(new);\n        Ok(v)\n    } else {\n        // The value was not\
    \ as expected. Leave it untouched and report failure.\n        Err(v)\n    }\n\
    }\n```\n\nWhat this allows us to do, is to load value, perform any calculation\
    \ we like, and then update the atomic variable to the updated value only if it\
    \ hasn’t changed in the meantime. If we put this in a loop to retry if it did\
    \ change, we could use this to implement all the other atomic operations, making\
    \ this the most generic one.\n\nTo demonstrate, let’s increment an AtomicU32 by\
    \ one without using fetch_add, just to see how compare_exchange is used in practice:\n\
    \n```\nfn increment(a: &AtomicU32) {\n    let mut current = a.load(Relaxed); ①\n\
    \    loop {\n```\n\n```\nlet new = current + 1;\nmatch a.compare_exchange(current,\
    \ new, Relaxed, Relaxed)\n{\n    Ok(_) => return,\n    Err(v) => current = v,\n\
    }\n```\n\nFirst, we load the current value of a.\nWe calculate the new value we\
    \ want to store in a, not taking into account potential concurrent modifications\
    \ of a by other threads.\nWe use compare_exchange to update the value of a, but\
    \ only if its value is still the same value we loaded before.\nIf a was indeed\
    \ still the same as before, it is now replaced by our new value and we are done.\n\
    If a was not the same as before, another thread must’ve changed it in the brief\
    \ moment since we loaded it. The compare_exchange operation gives us the changed\
    \ value that a had, and we’ll try again using that value instead. The brief moment\
    \ between loading and updating is so short, that it’s unlikely for this to loop\
    \ more than a few iterations.\n\nNext to compare_exchange, there is also a very\
    \ similar compare_exchange_weak method. The difference is that the weak version\
    \ might sometimes leave the value untouched and still return an Err, even though\
    \ the atomic value matched the expected value. On some platforms, this method\
    \ can be implemented more efficiently and should be preferred in cases where the\
    \ consequence of a spurious compare and exchange failure are insignificant, such\
    \ as in our increment function above. In X REF HERE FOR CH04, we’ll dive into\
    \ the low level details to find out why the weak version can be more efficient.\n\
    \n## Example: ID Allocation Without Overflow\n\nNow, back to our overflow problem\
    \ in allocate_new_id() from “Example: ID Allocation”.\n\nTo stop incrementing\
    \ NEXT_ID beyond a certain limit to prevent overflows, we can use compare_exchange\
    \ to implement atomic addition with an upper bound. Using that idea, let’s make\
    \ a version of allocate_new_id that always handles overflow correctly, even in\
    \ the practically impossible situations:\n\n```\nfn allocate_new_id() -> u32 {\n\
    \    static NEXT_ID: AtomicU32 = AtomicU32::new(0);\n    let mut id = NEXT_ID.load(Relaxed);\n\
    \    loop {\n        assert!(id < 1000, \"too many IDs!\");\n        match NEXT_ID.compare_exchange_weak(id,\
    \ id + 1, Relaxed, Relaxed) {\n            Ok(_) => return id,\n            Err(v)\
    \ => id = v,\n        }\n    }\n}\n```\n\nNow we check and panic before modifying\
    \ NEXT_ID, guaranteeing it will never be incremented beyond 1000, making overflow\
    \ impossible. We can now raise the upper limit from 1000 to u32::MAX if we want,\
    \ without having to worry about edge cases in which it might get incremented beyond\
    \ the limit.\n\n## Example: Racy Lazy Initialization\n\nIn “Example: Lazy Initialization”,\
    \ we looked at an example of lazy initialization of a constant value. We made\
    \ a function that lazily initializes a value on the first call, but re-uses it\
    \ on later calls. When multiple threads run the function concurrently during the\
    \ first call, more than one thread might execute the initialization, and they\
    \ will overwrite eachothers result in an unpredictable order.\n\nThis is fine\
    \ for values that we expect to be constant, or when we don’t care about changing\
    \ values. However, there are also use cases where such a value gets initialized\
    \ to a different value each time, even though we need\n\nevery invocation of the\
    \ function within a single run of the program to return the same value.\n\nFor\
    \ example, imagine a function get_key() that returns a randomly generated key\
    \ that’s only generated once per run of the program. It might be an encryption\
    \ key used for communication with the program, that needs to be unique every time\
    \ the program is run, but stay constant within a process.\n\nThis means we cannot\
    \ simply use a store operation after generating a key, since that might overwrite\
    \ a key generated by another thread just moments ago, resulting in two threads\
    \ using different keys. Instead, we can use compare_exchange to make sure we only\
    \ store the key if we’re still the first, and otherwise throw our key away and\
    \ use the stored key instead.\n\nHere’s an implementation of this idea:\n\n```\n\
    fn get_key() -> u64 {\n    static KEY: AtomicU64 = AtomicU64::new(0);\n    let\
    \ key = KEY.load(Relaxed);\n    if key == 0 {\n        let new_key = generate_random_key();\n\
    \        match KEY.compare_exchange(0, new_key, Relaxed, Relaxed)\n        {\n\
    \            Ok(_) => new_key,\n            Err(k) => k,\n        }\n    } else\
    \ {\n        key\n    }\n}\n```\n\nWe only generate a new key if KEY was not yet\
    \ initialized.\nWe replace KEY by our newly generated key, but only if it is still\
    \ zero.\nIf we swapped the zero for our new key, we return our newly generated\
    \ key. New invocations of get_key() will now return the same new key that’s now\
    \ stored in KEY.\nIf we lost the race to another thread initializing KEY before\
    \ we could, we forget our newly generated key and use the key from KEY instead.\n\
    \nThis is a good example of a situation where compare_exchange_weak is not appropriate,\
    \ and we want to use the strong version instead. We don’t run our compare and\
    \ exchange operation in a loop, and we don’t want to\n\nreturn zero if the operation\
    \ spuriously failed. Even if we did put this in a loop, generating a new key probably\
    \ takes more than a few simple operations, so risking a spurious failure from\
    \ `compare_exchange_weak` is simply not worth the small performance benefit it\
    \ might bring us.\n\nAs mentioned in “Example: Lazy Initialization”, if `generate_random_key()`\
    \ takes a lot of time, it might make more sense to block threads during initialization,\
    \ to avoid potentially spending time generating keys that will not be used. The\
    \ Rust standard library provides such functionality through `std::sync::Once`\
    \ and `std::lazy::SyncOnceCell`.\n\n## Summary\n\n- Atomic operations are *undividable*;\
    \ they either fully completed, or they haven’t happened yet.\n- Atomic operations\

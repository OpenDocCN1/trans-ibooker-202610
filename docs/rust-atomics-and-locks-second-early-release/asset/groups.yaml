  - '[PAGE 20]


    # UNDEFINED BEHAVIOR


    Languages like C, C++, and Rust have a set of rules that need to be followed to
    avoid something called *undefined behavior*. For example, one of Rust’s rules
    is that there may never be more than one mutable reference to any object.


    In Rust, it’s only possible to break any of these rules when using `unsafe` code.
    That word doesn’t mean that the code is incorrect or never safe to use, but rather
    that the compiler is not validating for you that the code is safe. If the code
    does violate these rules, it is called *unsound*.


    The compiler is allowed to assume, without checking, that these rules are never
    broken. When broken, this results in something called *undefined behavior*, which
    we need to avoid at all costs. If we allow the compiler to make an assumption
    that is not actually true, it can easily result in more wrong conclusions about
    different parts of your code, affecting your whole program.


    As a concrete example, let’s take a look at a small snippet that uses the `get_unchecked`
    method on a slice.


    ```

    let a = [123, 456, 789];

    let b = unsafe { a.get_unchecked(index) };

    ```


    The `get_unchecked` method gives us an element of the slice given its index, just
    like a[`index`], but allows the compiler to assume the index is always within
    bounds, without any checks.


    This mean that in this code snippet, because a is of length 3, the compiler may
    assume that `index` is less than three. It’s up to us to make sure its assumption
    holds.


    If we break this assumption, for example if we run this with `index` equal to
    3, anything might happen. It might result in reading from memory whatever was
    stored in the bytes right after a. It might cause'

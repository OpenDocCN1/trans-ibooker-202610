    \ order. For example, if one thread writes to one variable first and then to a\
    \ second variable very quickly afterwards, another thread might see that happen\
    \ in opposite order.\n\nIn this chapter we’ll only look at use cases where this\
    \ is not a problem, and simply use `Relaxed` everywhere without going more into\
    \ detail. We’ll discuss all the details of memory ordering and the other available\

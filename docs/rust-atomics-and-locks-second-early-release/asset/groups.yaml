    \ and re-locking is all done by the wait method. We had to restructure the control\
    \ flow a bit to be able to pass the guard to the wait method, while still dropping\
    \ it before processing an item.\n\nNow we can spawn as many consuming threads\
    \ as we like, and even spawn more later, without having to change anything. The\

    \n```\nlet a = Arc::new([1, 2, 3]); ①\nlet b = a.clone(); ②\n\nthread::spawn(move\
    \ || dbg!(a)); ③\nthread::spawn(move || dbg!(b)); ③\n```\n\n① 我们将一个数组放入新的分配中，并附带一个引用计数器，其初始值为一。\n\
    \n② 克隆 Arc 会将引用计数增加到二，并为我们提供指向同一分配的第二个 Arc。\n\n③ 两个线程都通过自己的 Arc 访问共享数组。两个线程在丢弃自己的\
    \ Arc 时都会递减引用计数。最后一个丢弃其 Arc 的线程会看到计数降为零，并将是丢弃并释放数组的线程。\n\n## NAMING CLONES\n\n\
    必须为 Arc 的每个克隆赋予不同的名称，很快就会使代码变得混乱且难以跟踪。虽然 Arc 的每个克隆都是一个单独的对象，但每个克隆都代表相同的共享值，这并没有通过为每个克隆赋予不同的名称来体现。\n\
    \nRust 允许（并鼓励）你通过定义同名的新变量来*遮蔽*变量。如果在同一作用域中这样做，则原始变量将无法再命名。但通过打开新的作用域，像 `let a\
    \ = a.clone();` 这样的语句就可以在该作用域内重用相同的名称，同时在作用域之外保留原始变量。\n\n通过用 { } 将闭包包装在新的作用域中，我们可以在将变量移入闭包之前克隆它们，而无需重命名它们。\n\
    \n```\nlet a = Arc::new([1, 2, 3]);\n\nlet b = a.clone();\n\nthread::spawn(move\
    \ || {\n    dbg!(b);\n});\n\ndbg!(a);\n```\n\n```\nlet a = Arc::new([1, 2,\n3]);\n\
    \nthread::spawn({\n    let a = a.clone();\n    move || {\n        dbg!(a);\n \
    \   }\n});\n\ndbg!(a);\n```\n\nArc 的克隆位于同一作用域。\n每个线程都获得一个具有不同名称的克隆。\n\nArc 的克隆位于不同的作用域。\n\
    我们可以在每个线程中使用相同的名称。\n\n由于所有权是共享的，引用计数指针（`Rc<T>` 和 `Arc<T>`）具有与共享引用（`&T`）相同的限制。它们不会提供对其包含值的可变访问，因为该值可能同时被其他代码借用。\n\
    \n```\nerror[E0596]: cannot borrow data in an `Arc` as mutable\n  |\n6 |     a.sort();\n\
    \  |     ^^^^^^^^\n```\n\n## Borrowing and Data Races\n\n在 Rust 中，值可以通过两种方式借用：\n\
    \n*Immutable Borrowing*\n\n使用 `&` 借用某物会得到一个*不可变引用*。此类引用可以被复制。对其所引用数据的访问在该引用的所有副本之间共享。正如名称所示，编译器通常不允许你通过此类引用*变异*某物，因为这可能会影响当前借用相同数据的其他代码。\n\
    \n*Mutable Borrowing*\n\n使用 `&mut` 借用某物会得到一个*可变引用*。可变借用保证它是该数据唯一活动的借用，从而确保变异数据不会改变其他代码当前正在查看的任何内容。\n\
    \n这两种概念共同完全防止了*数据竞争*：一种线程在变异数据而另一线程并发访问该数据的情况。数据竞争通常是*未定义行为*，这意味着编译器无需考虑这些情况。它只需假设它们不会发生。\n\
    \n为了说明这意味着什么，让我们看一个例子：\n\n```\nfn f(a: &i32, b: &mut i32) {\n    let before =\
    \ *a;\n    *b += 1;\n    let after = *a;\n    if before != after {\n        x();\
    \ // never happens\n    }\n}\n```\n\n在这里，我们获得对整数的不可变引用，并存储该整数在递增 b 所指的整数之前和之后的值。编译器可以自由假设关于借用和数据竞争的基本规则得到维护，这意味着\
    \ b 不可能指向与 a 相同的整数。事实上，只要 a 正在借用它，整个程序中就没有任何东西可以可变地借用 a 所指的整数。因此，它可以很容易地得出结论：*a\
    \ 将不会改变，if 语句的条件永远不会为真，并且可以作为优化完全删除对 x 的调用。\n\n除了使用 unsafe 块来禁用编译器的某些安全检查之外，不可能编写破坏编译器假设的\
    \ Rust 程序。\n\n## UNDEFINED BEHAVIOR\n\n像 C、C++ 和 Rust 这样的语言有一组需要遵循的规则，以避免称为*未定义行为*的东西。例如，Rust\
    \ 的一条规则是任何对象上永远不能有超过一个可变引用。\n\n在 Rust 中，只有在使用 `unsafe` 代码时才有可能违反这些规则中的任何一条。那个词并不意味着代码不正确或永远不安全，而是指编译器不会为你验证代码是否安全。如果代码确实违反了这些规则，则称为*\
    \ unsound*。\n\n编译器可以假设这些规则永远不会被破坏，而无需检查。当被破坏时，这会导致所谓的*未定义行为*，我们必须不惜一切代价避免。如果我们允许编译器做出实际上不成立的假设，它很容易对代码的不同部分得出更多错误的结论，影响整个程序。\n\
    \n作为一个具体的例子，让我们看一下使用切片上的 `get_unchecked` 方法的小片段。\n\n```\nlet a = [123, 456, 789];\n\
    let b = unsafe { a.get_unchecked(index) };\n```\n\n`get_unchecked` 方法通过其索引为我们提供切片的一个元素，就像\
    \ a[`index`] 一样，但允许编译器假设索引始终在范围内，而无需任何检查。\n\n这意味着在此代码片段中，因为 a 的长度为 3，编译器可能假设 `index`\
    \ 小于三。确保其假设成立是我们的工作。\n\n如果我们破坏了这一假设，例如如果我们使用等于 3 的 `index` 运行此代码，可能会发生任何事情。它可能导致从\
    \ a 之后内存中存储的字节中读取。它可能导致\n\n程序崩溃。它可能最终执行程序中完全不相关的部分。它可能导致各种混乱。\n\n也许令人惊讶的是，未定义行为甚至可以*倒流回过去*，导致其之前的代码出现问题。要了解这如何发生，想象我们在之前的片段之前有一个\
    \ `match` 语句，如下所示：\n\n```\nmatch index {\n    0 => x(),\n    1 => y(),\n    _\
    \ => z(index),\n}\n\nlet a = [123, 456, 789];\nlet b = unsafe { a.get_unchecked(index)\
    \ };\n```\n\n由于不安全代码，编译器可以假设 `index` 永远只有 0、1 或 2。它可能会逻辑上得出结论，我们的 `match` 语句的最后一个分支只会匹配\
    \ 2，因此 `z` 只会被调用为 `z(2)`。这一结论可能不仅用于优化 `match`，还用于优化 `z` 本身。这可能包括丢弃未使用的代码部分。\n\n\
    如果我们使用 3 的 `index` 执行此操作，我们的程序可能尝试执行已被优化掉的部分，导致在到达最后一行的 `unsafe` 块之前就出现完全不可预测的情况。就像这样，未定义行为可以通过整个程序向后和向前传播，通常以非常出乎意料的方式。\n\
    \n在调用任何 `unsafe` 函数时，请仔细阅读其文档，并确保你完全理解其*安全要求*：作为调用者，你需要维护的假设，以避免未定义行为。\n\n## Interior\
    \ Mutability\n\n上一节中介绍的借用规则很简单，但可能相当有限。尤其是在涉及多个线程时。遵循这些规则使得线程之间的通信极其有限，几乎不可能，因为任何可被多个线程访问的数据都不能被变异。\n\
    \n幸运的是，有一个逃生舱口：称为*内部可变性*。具有内部可变性的数据类型稍微弯曲了借用规则。在某些条件下，这些类型可以通过“不可变”引用允许变异。\n\n\
    在“Shared Ownership and Reference Counting”中，我们已经看到了涉及内部可变性的一个微妙示例。Rc 和 Arc 都变异引用计数，即使可能有多个克隆都在使用相同的引用计数。\n\
    \n一旦涉及内部可变类型，称一个引用为“不可变”或“可变”就会变得令人困惑且不准确，因为有些东西可以通过两者进行变异。更准确的术语是“共享”和“独占”：*共享引用*（&T）可以被复制并与其他人共享，而*独占引用*（&mut\
    \ T）保证它是该 T 的唯一*独占借用*。对于大多数类型，共享引用不允许变异，但有例外。由于在本书中我们将主要使用这些例外，我们将在本书的其余部分使用更准确的术语。\n\
    \n> CAUTION\n> \n> 请记住，内部可变性只弯曲了共享借用的规则，以允许在共享时进行变异。它不会改变独占借用方面的任何内容。独占借用仍然保证没有其他活动借用。通过不安全代码创建对某物的多个独占引用始终是未定义行为，无论内部可变性如何。\n\
    \n让我们看一下具有内部可变性的一些类型，以及它们如何允许通过共享引用进行变异而不导致未定义\n\n"

    \ closure would capture `numbers` by reference even though the new thread might\
    \ outlive it, resulting in a compiler error.\n\nSince a thread might run until\
    \ the very end of the program’s execution, the `spawn` function has a `'static`\
    \ bound on its argument type. In other words, it only accepts functions that may\
    \ be kept around forever. A closure capturing a local variable by reference may\
    \ not be kept around forever, since that reference would become invalid the moment\
    \ the local variable ceases to exist.\n\n"

    \ look at are the most basic ones: load and store. Their function signatures are\
    \ as follows:\n\n```\nimpl AtomicI32 {\n    pub fn load(&self, ordering: Ordering)\
    \ -> i32;\n    pub fn store(&self, value: i32, ordering: Ordering);\n}\n```\n\n\
    The load method atomically loads the value stored in the atomic variable, and\
    \ the store method atomically stores a new value in it. Note how the store method\
    \ takes a shared reference (&T) rather than an exclusive reference (&mut T), even\
    \ though it modifies the value.\n\nLet’s take a look at some realistic use cases\
    \ for these two methods.\n\n# Example: Stop Flag\n\nThe first example uses an\
    \ AtomicBool for a stop flag. Such a flag is used to inform other threads to stop\
    \ running.\n\n```\nfn main() {\n    static STOP: AtomicBool = AtomicBool::new(false);\n\
    \n    // Spawn a thread to do the work.\n    let background_thread = thread::spawn(||\
    \ {\n        while !STOP.load(Relaxed) {\n            some_work();\n        }\n\
    \    });\n\n    // Use the main thread to listen for user input.\n    for line\
    \ in std::io::stdin().lines() {\n        match line.unwrap().as_str() {\n    \
    \        \"help\" => println!(\"commands: help, stop\"),\n            \"stop\"\
    \ => break,\n            cmd => println!(\"unknown command: {cmd:?}\"),\n    \
    \    }\n    }\n\n    // Inform the background thread it needs to stop.\n\n```"

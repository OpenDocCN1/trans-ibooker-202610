    \ in this book, or if you notice missing material within this chapter, please\
    \ reach out to the editor at shiraevans@gmail.com.\n\nThe word *atomic* comes\
    \ from the Greek word ἄτομος, meaning *indivisible*, something that cannot be\
    \ cut into smaller pieces. In computer science, it is used to describe an operation\
    \ that is indivisible: it is either fully completed, or it didn’t happen yet.\n\
    \nAs mentioned in “Borrowing and Data Races”, multiple threads concurrently reading\

    Long before multi-core processors were commonplace, operating systems allowed
    for a single computer to run many programs concurrently. This is achieved by rapidly
    switching between processes, allowing each to repeatedly make a little bit of
    progress, one by one. Nowadays, virtually all our computers and even our phones
    and watches have processors with multiple cores, which can truly execute multiple
    processes in parallel.


    Operating systems isolate processes from each other as much as possible, allowing
    a program to do its thing while completely unaware of what any other processes
    are doing. For example, a process can not normally access the memory of another
    process, or communicate with it in any way without asking the operating system’s
    kernel first.


    However, a program can spawn extra *threads of execution*, as part of the same
    *process*. Threads within the same process are not isolated from each'

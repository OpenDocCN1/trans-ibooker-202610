    A reader-writer lock is a slightly more complicated version of a mutex that does
    understand the difference between exclusive and shared access, and can provide
    either. It has three states, unlocked, locked by a single *writer* (for exclusive
    access), or locked by any number of *readers* (for shared access). It is commonly
    used for data that is often read by multiple threads, but only updated once in
    a while.


    The Rust standard library provides this lock through the `std::sync::RwLock<T>`
    type. It works very similar to the standard `Mutex`, except its interface is mostly
    split in two parts. Instead of a single `lock()` method, it has a `read()` and
    `write()` method for locking as either a reader or a writer. It comes with two
    guard types, one for readers and one for writers: `RwLockReadGuard` and `RwLockWriteGuard`.
    The former only implements `Deref` to behave like a shared reference to the protected
    data, while the latter also implements `DerefMut` to behave like an exclusive
    reference.


    It is effectively the multi-threaded version of `RefCell`: dynamically tracking
    the number of references to ensure the borrow rules are upheld.


    Both `Mutex<T>` and `RwLock<T>` require `T` to be `Send`, because they can be
    used to send a `T` to another thread. An `RwLock<T>` additionally requires `T`
    to also implement `Sync`, because it allows multiple threads to hold a shared
    reference (`&T`) to the protected data. (Strictly speaking, you can create a lock
    for a `T` that doesn’t fulfill these requirements, but you wouldn’t be able to
    share it between threads as the lock itself won’t implement `Sync`.)


    There are many subtle variations between reader-writer lock implementations. Most
    importantly, some prioritize readers and some prioritize writers. In some implementations,
    when there is a writer waiting, new readers are blocked and will have to wait,
    even when the lock is already read-locked. This is done to prevent *writer starvation*,
    a situation where many readers collectively keep the lock from ever unlocking,
    never allowing any writer to update the data.'

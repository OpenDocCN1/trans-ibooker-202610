    \n# Threads in Rust\n\nEvery program starts with exactly one thread: the main\
    \ thread. This thread will execute your main function, and can be used to spawn\
    \ more threads if necessary.\n\nIn Rust, new threads are spawned using the thread::spawn\
    \ function from the standard library. It takes a single argument: the function\
    \ the new thread will execute. The thread stops once this function returns.\n\n\
    Let’s take a look at an example:\n\n```\nuse std::thread;\n\nfn main() {\n   \
    \ thread::spawn(f);\n    thread::spawn(f);\n\n    println!(\"Hello from the main\
    \ thread.\");\n}\n\nfn f() {\n    println!(\"Hello from another thread!\");\n\
    ```"
  - '[PAGE 6]


    ```

    let id = thread::current().id();

    println!("This is my thread id: {id:?}");

    }

    ```


    We spawn two threads that will both execute f as their main function. Both of
    these threads will print a message and show their thread id, while the main thread
    will also print its own message.


    # THREAD ID


    The Rust standard library assigns every thread a unique identifier. This identifier
    is accessible through Thread::id() and is of the type ThreadId. There’s not much
    you can do with a ThreadId other than copying it around and checking for equality.
    There is no guarantee that these IDs will be assigned consecutively; only that
    they will be different for each thread.


    If you run our example program above several times, you might notice the output
    varies between runs. This is the output I got on my machine during one particular
    run:


    ```

    Hello from the main thread.

    Hello from another thread!

    This is my thread id:

    ```


    Surprisingly, part of the output seems to be missing.


    What happened here, is that the main thread finished executing the main function
    before the newly spawned threads finished executing their function.


    Returning from main will exit the entire program, even if other threads are still
    running.


    In this particular example, one of the newly spawned threads had just enough time
    to get to halfway through the second message, before the program was shut down
    by the main thread.'
  - "[PAGE 7]\n\nIf we want to make sure the threads are finished before we return\
    \ from main, we can wait for them by joining them. To do so, we have to use the\
    \ JoinHandle returned by the spawn function:\n\n```\nfn main() {\n    let t1 =\
    \ thread::spawn(f);\n    let t2 = thread::spawn(f);\n\n    println!(\"Hello from\
    \ the main thread.\");\n\n    t1.join().unwrap();\n    t2.join().unwrap();\n}\n\
    ```\n\nThe .join() method will wait until the thread has finished executing, and\
    \ returns a thread::Result. If the thread did not successfully finish its function\
    \ because it panicked, this will contain the panic message.\n\nRunning this version\
    \ of our program will no longer result in truncated output:\n\n```\nHello from\
    \ the main thread.\nHello from another thread!\nThis is my thread id: ThreadId(3)\n\
    Hello from another thread!\nThis is my thread id: ThreadId(2)\n```\n\nThe only\
    \ thing that still changes between runs is the order in which the messages are\
    \ printed:\n\n```\nHello from the main thread.\nHello from another thread!\nHello\
    \ from another thread!\nThis is my thread id: ThreadId(2)\nThis is my thread id:\
    \ ThreadId(3)\n```"
  - "[PAGE 8]\n\n# OUTPUT LOCKING\n\nThe `println` macro uses `io::Stdout::lock()`\
    \ to make sure its output does not get interrupted. A `println!()` expression\
    \ will wait until any concurrently running one is finished before writing any\
    \ output. If this was not the case, we could’ve gotten more interleaved output\
    \ such as:\n\n```\nHello fromHello from another thread!\n  another This is my\
    \ threthreadHello fromthread id: ThreadId!\n( the main thread.\n2)This is my thread\n\
    id: ThreadId(3)\n```\n\nRather than passing the name of a function to `thread::spawn`,\
    \ as in our example above, it’s far more common to pass it a *closure*. This allows\
    \ us to capture values to move into the new thread:\n\n```\nlet numbers = vec![1,\
    \ 2, 3];\n\nthread::spawn(move || {\n    for n in numbers {\n        println!(\"\
    {n}\");\n    }\n});\n```\n\nHere, ownership of `numbers` is transferred to the\
    \ newly spawned thread. We have to use a `move` closure to transfer ownership.\
    \ Otherwise, the closure would capture `numbers` by reference even though the\
    \ new thread might outlive it, resulting in a compiler error.\n\nSince a thread\
    \ might run until the very end of the program’s execution, the `spawn` function\
    \ has a `'static` bound on its argument type. In other words, it only accepts\
    \ functions that may be kept around forever. A closure capturing a local variable\
    \ by reference may not be kept around forever, since that reference would become\
    \ invalid the moment the local variable ceases to exist."

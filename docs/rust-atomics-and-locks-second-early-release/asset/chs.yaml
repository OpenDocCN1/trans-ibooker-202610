- "## Chapter 1. Basics of Rust Concurrency\n\n### A NOTE FOR EARLY RELEASE READERS\n\
  \nWith Early Release ebooks, you get books in their earliest form—the author’s raw\
  \ and unedited content as they write—so you can take advantage of these technologies\
  \ long before the official release of these titles.\n\nThis will be the 1st chapter\
  \ of the final book. Please note that the GitHub repo will be made active later\
  \ on.\n\nIf you have comments about how we might improve the content and/or examples\
  \ in this book, or if you notice missing material within this chapter, please reach\
  \ out to the editor at shiraevans@gmail.com.\n\nLong before multi-core processors\
  \ were commonplace, operating systems allowed for a single computer to run many\
  \ programs concurrently. This is achieved by rapidly switching between processes,\
  \ allowing each to repeatedly make a little bit of progress, one by one. Nowadays,\
  \ virtually all our computers and even our phones and watches have processors with\
  \ multiple cores, which can truly execute multiple processes in parallel.\n\nOperating\
  \ systems isolate processes from each other as much as possible, allowing a program\
  \ to do its thing while completely unaware of what any other processes are doing.\
  \ For example, a process can not normally access the memory of another process,\
  \ or communicate with it in any way without asking the operating system’s kernel\
  \ first.\n\nHowever, a program can spawn extra *threads of execution*, as part of\
  \ the same *process*. Threads within the same process are not isolated from each\
  \ other. Threads share memory, and can interact with each other through that memory.\n\
  \nThis chapter will explain how threads are spawned in Rust, and all the basic concepts\
  \ around them, such as how to safely share data between multiple threads. The concepts\
  \ explained in this chapter are foundational to the rest of the book.\n\n> NOTE\n\
  > If you’re already familiar with these parts of Rust, feel free to skip ahead.\
  \ However, before you continue to the next chapters, make sure you have a good understanding\
  \ of threads, interior mutability, Send and Sync, and know what a mutex, a condition\
  \ variable, and thread parking is.\n\n### Threads in Rust\n\nEvery program starts\
  \ with exactly one thread: the main thread. This thread will execute your main function,\
  \ and can be used to spawn more threads if necessary.\n\nIn Rust, new threads are\
  \ spawned using the thread::spawn function from the standard library. It takes a\
  \ single argument: the function the new thread will execute. The thread stops once\
  \ this function returns.\n\nLet’s take a look at an example:\n\n```\nuse std::thread;\n\
  \nfn main() {\n    thread::spawn(f);\n    thread::spawn(f);\n\n    println!(\"Hello\
  \ from the main thread.\");\n}\n\nfn f() {\n    println!(\"Hello from another thread!\"\
  );\n    let id = thread::current().id();\n    println!(\"This is my thread id: {id:?}\"\
  );\n}\n```\n\nWe spawn two threads that will both execute f as their main function.\
  \ Both of these threads will print a message and show their thread id, while the\
  \ main thread will also print its own message.\n\n### THREAD ID\n\nThe Rust standard\
  \ library assigns every thread a unique identifier. This identifier is accessible\
  \ through Thread::id() and is of the type ThreadId. There’s not much you can do\
  \ with a ThreadId other than copying it around and checking for equality. There\
  \ is no guarantee that these IDs will be assigned consecutively; only that they\
  \ will be different for each thread.\n\nIf you run our example program above several\
  \ times, you might notice the output varies between runs. This is the output I got\
  \ on my machine during one particular run:\n\n```\nHello from the main thread.\n\
  Hello from another thread!\nThis is my thread id:\n```\n\nSurprisingly, part of\
  \ the output seems to be missing.\n\nWhat happened here, is that the main thread\
  \ finished executing the main function before the newly spawned threads finished\
  \ executing their function.\n\nReturning from main will exit the entire program,\
  \ even if other threads are still running.\n\nIn this particular example, one of\
  \ the newly spawned threads had just enough time to get to halfway through the second\
  \ message, before the program was shut down by the main thread.\n\nIf we want to\
  \ make sure the threads are finished before we return from main, we can wait for\
  \ them by joining them. To do so, we have to use the JoinHandle returned by the\
  \ spawn function:\n\n```\nfn main() {\n    let t1 = thread::spawn(f);\n    let t2\
  \ = thread::spawn(f);\n\n    println!(\"Hello from the main thread.\");\n\n    t1.join().unwrap();\n\
  \    t2.join().unwrap();\n}\n```\n\nThe .join() method will wait until the thread\
  \ has finished executing, and returns a thread::Result. If the thread did not successfully\
  \ finish its function because it panicked, this will contain the panic message.\n\
  \nRunning this version of our program will no longer result in truncated output:\n\
  \n```\nHello from the main thread.\nHello from another thread!\nThis is my thread\
  \ id: ThreadId(3)\nHello from another thread!\nThis is my thread id: ThreadId(2)\n\
  ```\n\nThe only thing that still changes between runs is the order in which the\
  \ messages are printed:\n\n```\nHello from the main thread.\nHello from another\
  \ thread!\nHello from another thread!\nThis is my thread id: ThreadId(2)\nThis is\
  \ my thread id: ThreadId(3)\n```\n\n### OUTPUT LOCKING\n\nThe `println` macro uses\
  \ `io::Stdout::lock()` to make sure its output does not get interrupted. A `println!()`\
  \ expression will wait until any concurrently running one is finished before writing\
  \ any output. If this was not the case, we could’ve gotten more interleaved output\
  \ such as:\n\n```\nHello fromHello from another thread!\n  another This is my threthreadHello\
  \ fromthread id: ThreadId!\n( the main thread.\n2)This is my thread\nid: ThreadId(3)\n\
  ```\n\nRather than passing the name of a function to `thread::spawn`, as in our\
  \ example above, it’s far more common to pass it a *closure*. This allows us to\
  \ capture values to move into the new thread:\n\n```\nlet numbers = vec![1, 2, 3];\n\
  \nthread::spawn(move || {\n    for n in numbers {\n        println!(\"{n}\");\n\
  \    }\n});\n```\n\nHere, ownership of `numbers` is transferred to the newly spawned\
  \ thread. We have to use a `move` closure to transfer ownership. Otherwise, the\
  \ closure would capture `numbers` by reference even though the new thread might\
  \ outlive it, resulting in a compiler error.\n\nSince a thread might run until the\
  \ very end of the program’s execution, the `spawn` function has a `'static` bound\
  \ on its argument type. In other words, it only accepts functions that may be kept\
  \ around forever. A closure capturing a local variable by reference may not be kept\
  \ around forever, since that reference would become invalid the moment the local\
  \ variable ceases to exist.\n\n\n\n\n\n从线程中获取返回值只需从闭包中直接返回即可。该返回值可从 `join` 方法返回的\
  \ `thread::Result` 中获得：\n\n```\nlet numbers = Vec::from_iter(0..=1000);\n\nlet t\
  \ = thread::spawn(move || {\n    let len = numbers.len();\n    let sum = numbers.into_iter().sum::<usize>();\n\
  \    sum / len ①\n});\n\nlet average = t.join().unwrap(); ②\n\nprintln!(\"average:\
  \ {average}\");\n```\n\n这里，线程闭包返回的值 (1) 通过 `join` 方法 (2) 发送回主线程。\n\n如果 `numbers`\
  \ 为空，线程在尝试除以零时就会 panic (1)，而 `join` 会返回该 panic 信息，导致主线程因 `unwrap` (2) 也 panic。\n\
  \n### THREAD BUILDER\n\n`thread::spawn` 函数实际上只是 `thread::Builder::new().spawn().unwrap()`\
  \ 的便捷简写。\n\n`thread::Builder` 允许你在 spawn 线程前为新线程设置一些配置。你可以用它来配置新线程的栈大小并为新线程命名。线程的名称可通过\
  \ `thread::current().name()` 获取，会在 panic 消息中使用，并在大多数平台的监控和调试工具中可见。\n\n此外，Builder\
  \ 的 `spawn` 方法返回一个 `io::Result`，允许你在 spawn 新线程失败时进行处理。这可能发生在操作系统内存耗尽时，或对程序施加了资源限制时。`thread::spawn`\
  \ 函数如果无法 spawn 新线程则会直接 panic。\n\n### Scoped Threads\n\n#### WARNING\n\n截至 2022 年\
  \ 6 月，作用域线程尚未成为 Rust 标准库的一部分。它已被提议并作为不稳定特性实现，可在 Rust 的 nightly 版本中使用 `#![feature(scoped_threads)]`。\n\
  \n如果我们确定 spawn 的线程绝对不会超出某个作用域的生命周期，那么该线程就可以安全地借用不会永久存活的东西，例如局部变量，只要它们在该作用域内存活即可。\n\
  \nRust 标准库提供了 `thread::scope` 函数来 spawn 这种作用域线程。它允许我们 spawn 无法超出我们传递给该函数的闭包作用域的线程，从而可以安全地借用局部变量。\n\
  \n其工作原理最好通过示例来说明：\n\n```\nlet numbers = vec![1, 2, 3];\n\nthread::scope(|s| {\n\
  \    s.spawn(|| {\n        println!(\"length: {}\", numbers.len());\n    });\n \
  \   s.spawn(|| {\n        for n in &numbers {\n            println!(\"{n}\");\n\
  \        }\n    });\n});\n```\n\n我们使用一个闭包调用 `thread::scope` 函数。我们的闭包会直接执行并获得一个参数\
  \ `s`，它代表作用域。我们可以使用 `s` 来 spawn 线程，这些线程可以借用像 `numbers` 这样的局部变量。\n\n当作用域结束时，所有尚未被\
  \ join 的线程都会自动被 join。\n\n该模式保证了在作用域中 spawn 的线程都不会超出作用域。因为这样，作用域 spawn 方法在其参数类型上没有\
  \ `'static` 限制，允许我们引用任何只要在作用域内存活的东西，例如 `numbers`。\n\n在上面的示例中，两个新线程并发访问 `numbers`。这是可以的，因为它们（或主线程）都不修改它。如果我们将第一个线程改为修改\
  \ `numbers`，如下所示，编译器将不允许我们 spawn 另一个也使用 `numbers` 的线程：\n\n```\nlet mut numbers =\
  \ vec![1, 2, 3];\n\nthread::scope(|s| {\n    s.spawn(|| {\n        numbers.push(1);\n\
  \    });\n```\n\n```\ns.spawn(|| {\n    numbers.push(2); // Error!\n});\n});\n\n\
  error[E0499]: cannot borrow `numbers` as mutable more than once at a time\n  -->\
  \ example.rs:7:13\n   |\n4 |     s.spawn(|| {\n   |     -- first mutable borrow\
  \ occurs here\n5 |     numbers.push(1);\n   |     ------ first borrow occurs due\
  \ to use of `numbers`\nin closure\n   |\n7 |     s.spawn(|| {\n   |     ^^ second\
  \ mutable borrow occurs here\n8 |     numbers.push(2);\n   |     ------ second borrow\
  \ occurs due to use of `numbers`\nin closure\n```\n\n### THE LEAKPOCALYPSE\n\n在\
  \ Rust 1.0 之前，标准库有一个名为 `thread::scoped` 的函数，它会直接 spawn 一个线程，就像 `thread::spawn` 一样。它允许非\
  \ `'static` 捕获，因为它返回的不是 `JoinHandle`，而是 `JoinGuard`，该 guard 在被 drop 时会 join 线程。任何被借用的数据只需在该\
  \ `JoinGuard` 存活期间存活即可。这似乎是安全的，只要 `JoinGuard` 最终会被 drop。\n\n就在 Rust 1.0 发布前夕，人们逐渐意识到无法保证某物一定会被\
  \ drop。有很多方式，例如引用计数节点的循环，会导致我们忘记某物而不 drop 它。\n\n最终，在一些人所称的“泄漏末日”中，`thread::scoped`\
  \ 被移除，并且 `mem::forget` 被设为 *safe*，以强调忘记（或泄漏）某物始终是可能的，并且不能依赖 `Drop` 来保证正确性。\n\n直到很久以后，在\
  \ Rust 1.63 中，才添加了一个新的 `thread::scoped` 函数，采用了新的设计，不再依赖 `Drop` 来保证正确性。\n\n### Shared\
  \ Ownership and Reference Counting\n\n到目前为止，我们已经研究了使用 `move` 闭包将值的所有权转移给线程（“Rust\
  \ 中的线程”）以及从更长寿命的父线程借用数据（“作用域线程”）。当在两个线程之间共享数据且无法保证任一线程比另一个更长寿时，它们都不能拥有该数据。它们之间共享的任何数据都需要与寿命最长的线程一样长。\n\
  \n### Statics\n\n创建不由单个线程拥有的东西有几种方法。最简单的一种是 `static` 值，它由整个程序 *拥有*，而不是单个线程。在下面的示例中，两个线程都可以访问\
  \ X，但它们都不拥有它：\n\n```\nstatic X: [i32; 3] = [1, 2, 3];\n\nthread::spawn(|| dbg!(&X));\n\
  thread::spawn(|| dbg!(&X));\n```\n\n`static` 项具有常量初始化器，从不被 drop，并且在程序的主函数甚至开始之前就已存在。每个线程都可以借用它，因为它保证始终存在。\n\
  \n### Leaking\n\n另一种共享所有权的方式是通过 *泄漏* 分配。使用 `Box::leak`，可以释放 Box 的所有权，承诺永远不 drop\
  \ 它。从那时起，该 Box 将永远存活，没有所有者，允许任何线程在程序运行期间随时借用它。\n\n```\nlet x: &'static [i32; 3]\
  \ = Box::leak(Box::new([1, 2, 3]));\n\nthread::spawn(move || dbg!(x));\nthread::spawn(move\
  \ || dbg!(x));\n```\n\n`move` 闭包可能看起来像我们将所有权移入线程，但仔细查看 `x` 的类型会发现我们只是在给线程 *一个引用*\
  \ 到数据。\n\n> TIP\n> \n> 引用是 `Copy` 的，这意味着当你 `move` 它们时，原来的引用仍然存在，就像整数或布尔值一样。\n\n\
  注意 `'static` 生命周期并不意味着该值自程序开始就已存在，而只是意味着它会存活到程序结束。过去 simply 与之无关。\n\n泄漏 Box 的缺点是我们泄漏了内存。我们分配了某些东西，但从未\
  \ drop 并释放它。如果这种情况只发生有限次数，这是可以的。但如果我们一直这样做，程序会慢慢耗尽内存。\n\n### Reference Counting\n\
  \n为了能够 drop 并释放某些东西，我们不能完全放弃其所有权。相反，我们可以共享所有权。通过跟踪所有者的数量，我们可以确保只有在没有所有者 left 时才\
  \ drop 该值。\n\nRust 标准库通过 `Rc` 类型提供了此功能，`Rc` 是 “Reference Counted” 的缩写。它与 `Box` 非常相似，只是克隆它不会分配新东西，而是增加存储在包含值旁边的计数器。原始的和克隆的\
  \ `Rc` 都引用相同的分配；它们共享所有权。\n\n```\nlet a = Rc::new([1, 2, 3]);\nlet b = a.clone();\n\
  \nassert_eq!(a.as_ptr(), b.as_ptr()); // Same allocation!\n```\n\nDrop 一个 `Rc` 会递减计数器。只有最后一个\
  \ `Rc` 会看到计数器降到零，并且会是 drop 并释放包含数据的那个。\n\n如果我们尝试将一个 `Rc` 发送到另一个线程，我们会遇到以下编译器错误：\n\
  \n```\nerror[E0277]: `Rc` cannot be sent between threads safely\n  |\n8 |     thread::spawn(move\
  \ || dbg!(b));\n  |                    ^^^^^^^^^^^^^^^\n```\n\n\n\n\n事实证明，Rc 不是线程安全的（“Thread\
  \ Safety: Send and Sync” 中会详细介绍）。如果多个线程拥有指向同一分配的 Rc，它们可能会同时尝试修改引用计数，这会导致不可预测的结果。\n\
  \n相反，我们可以使用 Arc，它代表 \"Atomically Reference Counted\"。它与 Rc 完全相同，只是它保证对引用计数的修改是不可分割的——原子的——操作，使其可以安全地与多个线程一起使用。（第\
  \ 2 章会详细介绍。）\n\n```\nlet a = Arc::new([1, 2, 3]); ①\nlet b = a.clone(); ②\n\nthread::spawn(move\
  \ || dbg!(a)); ③\nthread::spawn(move || dbg!(b)); ③\n```\n\n① 我们将一个数组放入新的分配中，并附带一个引用计数器，其初始值为一。\n\
  \n② 克隆 Arc 会将引用计数增加到二，并为我们提供指向同一分配的第二个 Arc。\n\n③ 两个线程都通过自己的 Arc 访问共享数组。两个线程在丢弃自己的\
  \ Arc 时都会递减引用计数。最后一个丢弃其 Arc 的线程会看到计数降为零，并将是丢弃并释放数组的线程。\n\n### NAMING CLONES\n\n\
  必须为 Arc 的每个克隆赋予不同的名称，很快就会使代码变得混乱且难以跟踪。虽然 Arc 的每个克隆都是一个单独的对象，但每个克隆都代表相同的共享值，这并没有通过为每个克隆赋予不同的名称来体现。\n\
  \nRust 允许（并鼓励）你通过定义同名的新变量来*遮蔽*变量。如果在同一作用域中这样做，则原始变量将无法再命名。但通过打开新的作用域，像 `let a =\
  \ a.clone();` 这样的语句就可以在该作用域内重用相同的名称，同时在作用域之外保留原始变量。\n\n通过用 { } 将闭包包装在新的作用域中，我们可以在将变量移入闭包之前克隆它们，而无需重命名它们。\n\
  \n```\nlet a = Arc::new([1, 2, 3]);\n\nlet b = a.clone();\n\nthread::spawn(move\
  \ || {\n    dbg!(b);\n});\n\ndbg!(a);\n```\n\n```\nlet a = Arc::new([1, 2,\n3]);\n\
  \nthread::spawn({\n    let a = a.clone();\n    move || {\n        dbg!(a);\n   \
  \ }\n});\n\ndbg!(a);\n```\n\nArc 的克隆位于同一作用域。\n每个线程都获得一个具有不同名称的克隆。\n\nArc 的克隆位于不同的作用域。\n\
  我们可以在每个线程中使用相同的名称。\n\n由于所有权是共享的，引用计数指针（`Rc<T>` 和 `Arc<T>`）具有与共享引用（`&T`）相同的限制。它们不会提供对其包含值的可变访问，因为该值可能同时被其他代码借用。\n\
  \n```\nerror[E0596]: cannot borrow data in an `Arc` as mutable\n  |\n6 |     a.sort();\n\
  \  |     ^^^^^^^^\n```\n\n### Borrowing and Data Races\n\n在 Rust 中，值可以通过两种方式借用：\n\
  \n*Immutable Borrowing*\n\n使用 `&` 借用某物会得到一个*不可变引用*。此类引用可以被复制。对其所引用数据的访问在该引用的所有副本之间共享。正如名称所示，编译器通常不允许你通过此类引用*变异*某物，因为这可能会影响当前借用相同数据的其他代码。\n\
  \n*Mutable Borrowing*\n\n使用 `&mut` 借用某物会得到一个*可变引用*。可变借用保证它是该数据唯一活动的借用，从而确保变异数据不会改变其他代码当前正在查看的任何内容。\n\
  \n这两种概念共同完全防止了*数据竞争*：一种线程在变异数据而另一线程并发访问该数据的情况。数据竞争通常是*未定义行为*，这意味着编译器无需考虑这些情况。它只需假设它们不会发生。\n\
  \n为了说明这意味着什么，让我们看一个例子：\n\n```\nfn f(a: &i32, b: &mut i32) {\n    let before = *a;\n\
  \    *b += 1;\n    let after = *a;\n    if before != after {\n        x(); // never\
  \ happens\n    }\n}\n```\n\n在这里，我们获得对整数的不可变引用，并存储该整数在递增 b 所指的整数之前和之后的值。编译器可以自由假设关于借用和数据竞争的基本规则得到维护，这意味着\
  \ b 不可能指向与 a 相同的整数。事实上，只要 a 正在借用它，整个程序中就没有任何东西可以可变地借用 a 所指的整数。因此，它可以很容易地得出结论：*a\
  \ 将不会改变，if 语句的条件永远不会为真，并且可以作为优化完全删除对 x 的调用。\n\n除了使用 unsafe 块来禁用编译器的某些安全检查之外，不可能编写破坏编译器假设的\
  \ Rust 程序。\n\n### UNDEFINED BEHAVIOR\n\n像 C、C++ 和 Rust 这样的语言有一组需要遵循的规则，以避免称为*未定义行为*的东西。例如，Rust\
  \ 的一条规则是任何对象上永远不能有超过一个可变引用。\n\n在 Rust 中，只有在使用 `unsafe` 代码时才有可能违反这些规则中的任何一条。那个词并不意味着代码不正确或永远不安全，而是指编译器不会为你验证代码是否安全。如果代码确实违反了这些规则，则称为*\
  \ unsound*。\n\n编译器可以假设这些规则永远不会被破坏，而无需检查。当被破坏时，这会导致所谓的*未定义行为*，我们必须不惜一切代价避免。如果我们允许编译器做出实际上不成立的假设，它很容易对代码的不同部分得出更多错误的结论，影响整个程序。\n\
  \n作为一个具体的例子，让我们看一下使用切片上的 `get_unchecked` 方法的小片段。\n\n```\nlet a = [123, 456, 789];\n\
  let b = unsafe { a.get_unchecked(index) };\n```\n\n`get_unchecked` 方法通过其索引为我们提供切片的一个元素，就像\
  \ a[`index`] 一样，但允许编译器假设索引始终在范围内，而无需任何检查。\n\n这意味着在此代码片段中，因为 a 的长度为 3，编译器可能假设 `index`\
  \ 小于三。确保其假设成立是我们的工作。\n\n如果我们破坏了这一假设，例如如果我们使用等于 3 的 `index` 运行此代码，可能会发生任何事情。它可能导致从\
  \ a 之后内存中存储的字节中读取。它可能导致\n\n程序崩溃。它可能最终执行程序中完全不相关的部分。它可能导致各种混乱。\n\n也许令人惊讶的是，未定义行为甚至可以*倒流回过去*，导致其之前的代码出现问题。要了解这如何发生，想象我们在之前的片段之前有一个\
  \ `match` 语句，如下所示：\n\n```\nmatch index {\n    0 => x(),\n    1 => y(),\n    _ =>\
  \ z(index),\n}\n\nlet a = [123, 456, 789];\nlet b = unsafe { a.get_unchecked(index)\
  \ };\n```\n\n由于不安全代码，编译器可以假设 `index` 永远只有 0、1 或 2。它可能会逻辑上得出结论，我们的 `match` 语句的最后一个分支只会匹配\
  \ 2，因此 `z` 只会被调用为 `z(2)`。这一结论可能不仅用于优化 `match`，还用于优化 `z` 本身。这可能包括丢弃未使用的代码部分。\n\n\
  如果我们使用 3 的 `index` 执行此操作，我们的程序可能尝试执行已被优化掉的部分，导致在到达最后一行的 `unsafe` 块之前就出现完全不可预测的情况。就像这样，未定义行为可以通过整个程序向后和向前传播，通常以非常出乎意料的方式。\n\
  \n在调用任何 `unsafe` 函数时，请仔细阅读其文档，并确保你完全理解其*安全要求*：作为调用者，你需要维护的假设，以避免未定义行为。\n\n### Interior\
  \ Mutability\n\n上一节中介绍的借用规则很简单，但可能相当有限。尤其是在涉及多个线程时。遵循这些规则使得线程之间的通信极其有限，几乎不可能，因为任何可被多个线程访问的数据都不能被变异。\n\
  \n幸运的是，有一个逃生舱口：称为*内部可变性*。具有内部可变性的数据类型稍微弯曲了借用规则。在某些条件下，这些类型可以通过“不可变”引用允许变异。\n\n在“Shared\
  \ Ownership and Reference Counting”中，我们已经看到了涉及内部可变性的一个微妙示例。Rc 和 Arc 都变异引用计数，即使可能有多个克隆都在使用相同的引用计数。\n\
  \n一旦涉及内部可变类型，称一个引用为“不可变”或“可变”就会变得令人困惑且不准确，因为有些东西可以通过两者进行变异。更准确的术语是“共享”和“独占”：*共享引用*（&T）可以被复制并与其他人共享，而*独占引用*（&mut\
  \ T）保证它是该 T 的唯一*独占借用*。对于大多数类型，共享引用不允许变异，但有例外。由于在本书中我们将主要使用这些例外，我们将在本书的其余部分使用更准确的术语。\n\
  \n> CAUTION\n> \n> 请记住，内部可变性只弯曲了共享借用的规则，以允许在共享时进行变异。它不会改变独占借用方面的任何内容。独占借用仍然保证没有其他活动借用。通过不安全代码创建对某物的多个独占引用始终是未定义行为，无论内部可变性如何。\n\
  \n让我们看一下具有内部可变性的一些类型，以及它们如何允许通过共享引用进行变异而不导致未定义\n\n\n\nbehavior.\n\n### Cell\n\n\
  A Cell<T> simply wraps a T, but allows mutations through a shared reference. To\
  \ avoid undefined behavior, it only allows you to copy the value out (if T is Copy),\
  \ or replace it with another value as a whole. In addition, it can only be used\
  \ within a single thread.\n\nLet’s take a look at similar example as in the previous\
  \ section, but this time using Cell<i32> instead of i32:\n\n```\nfn f(a: &Cell<i32>,\
  \ b: &Cell<i32>) {\n    let before = a.get();\n    b.set(b.get() + 1);\n    let\
  \ after = a.get();\n    if before != after {\n        x(); // might happen\n   \
  \ }\n}\n```\n\nUnlike last time, it is now possible for the if condition to be true.\
  \ Because a Cell<i32> has interior mutability, the compiler can no longer assume\
  \ its value won’t change as long as we have a shared reference to it. Both a and\
  \ b might refer to the same value, such that mutating through b might affect a as\
  \ well. It may still assume, however, that no other threads are accessing the cells\
  \ concurrently.\n\nThe restrictions on a Cell are not always easy to work with.\
  \ Since it can’t directly let us borrow the value it holds, we need to move a value\
  \ out (leaving something in its place), modify it, then put it back, to mutate its\
  \ contents.\n\n```\nfn f(v: &Cell<Vec<i32>>) {\n    let mut v2 = v.take(); // Replaces\
  \ the contents of the Cell with an empty Vec\n    v2.push(1);\n    v.set(v2); //\
  \ Put the modified Vec back\n}\n```\n\n### RefCell\n\nUnlike a regular Cell, a RefCell\
  \ does allow you to borrow its contents, at a small run-time cost. A RefCell<T>\
  \ does not only hold a T, but also holds a counter that keeps track of any outstanding\
  \ borrows. If you try to borrow it while it is already mutably borrowed, it will\
  \ panic, which avoids undefined behavior. Just like a Cell, a RefCell can only be\
  \ used within a single thread.\n\n```\nfn f(v: &RefCell<Vec<i32>>) {\n    v.borrow_mut().push(1);\
  \ // We can modify the `Vec` directly.\n}\n```\n\nWhile Cell and RefCell can be\
  \ very useful, they become rather useless when we need to do something with multiple\
  \ threads. So let’s move on to the types that are relevant for concurrency.\n\n\
  ### Mutex and RwLock\n\nAn RwLock or reader-writer lock is the concurrent version\
  \ of a RefCell. An RwLock<T> holds a T, and tracks any outstanding borrows. However,\
  \ unlike a RefCell, it does not panic on conflicting borrows. Instead, it blocks\
  \ the current thread—putting it to sleep—while waiting for conflicting borrows to\
  \ disappear. We’ll just have to patiently wait for our turn with the data, after\
  \ the other threads are done with it.\n\nBorrowing the contents of an RwLock is\
  \ called locking. By locking it we temporarily block concurrent conflicting borrows,\
  \ allowing us to borrow it without causing data races.\n\nA Mutex (short for mutual\
  \ exclusion) is very similar, but conceptually slightly simpler. Instead of keeping\
  \ track of the number of shared and exclusive borrows like an RwLock, it only allows\
  \ exclusive borrows.\n\nWe’ll go more into detail on these types in “Locking: Mutexes\
  \ and RwLocks”.\n\n### Atomics\n\nThe atomic types represent the concurrent version\
  \ of a Cell, and are the main topic of Chapter 2 and X REF HERE FOR CH03. Like a\
  \ Cell, they avoid undefined behavior by making us copy values in and out as a whole,\
  \ without letting us borrow the contents directly.\n\nUnlike a Cell though, they\
  \ cannot be of arbitrary size. Because of this, there is no generic Atomic<T> type\
  \ for any T, but there are only specific atomic types such as AtomicU32 and AtomicPtr.\
  \ Which ones are available depends on the platform, since they require support from\
  \ the processor to avoid data races. (We’ll dive into that in X REF HERE FOR CH04.)\n\
  \nSince they are so limited in size, atomics often don’t directly contain the information\
  \ that needs to be shared between threads. Instead, they are often used as a tool\
  \ to make it possible to share other—often bigger—things between threads. When atomics\
  \ are used to say something about other data, things can get surprisingly complicated.\n\
  \n### UnsafeCell\n\nAn UnsafeCell is the primitive building block for interior mutability.\n\
  \nAn UnsafeCell<T> wraps a T, but does not come with any conditions or restrictions\
  \ to avoid undefined behavior. Instead, its get method just gives a raw pointer\
  \ to the value it wraps, which can only be meaningfully used in unsafe blocks. It\
  \ leaves it up to the user to use it in a way that does cause any undefined behavior.\n\
  \nMost commonly, an UnsafeCell is not used directly, but wrapped in another type\
  \ that provides safety through a limited interface, such as Cell or Mutex. All types\
  \ with interior mutability—including all types discussed above—are built on top\
  \ of UnsafeCell.\n\n### Thread Safety: Send and Sync\n\nIn this chapter, we’ve seen\
  \ several types that are not *thread safe*, types that can only be used on a single\
  \ thread, such as `Rc`, `Cell`, and others. Since that restriction is needed to\
  \ avoid undefined behavior, it’s something the compiler needs to understand and\
  \ check for you, so you can use these types without having to use `unsafe` blocks.\n\
  \nThe language uses two special traits to keep track of which types can be safely\
  \ used across threads:\n\n#### Send\n\nA type is `Send` if it can be sent to another\
  \ thread. That is, if ownership of a value of that type can be transferred to another\
  \ thread. For example, `Arc<i32>` is `Send`, but `Rc<i32>` is not.\n\n#### Sync\n\
  \nA type is `Sync` if it can be shared with another thread. In other words, a type\
  \ T is `Sync` if and only if a shared reference to that type, `&T`, is `Send`. For\
  \ example, a `i32` is `Sync`, but a `Cell<i32>` is not.\n\nAll primitive types such\
  \ as `i32`, `bool`, and `str` are all both `Send` and `Sync`.\n\nBoth of these traits\
  \ are *auto traits*, which means that they are automatically implemented for your\
  \ types based on their fields. A `struct` with fields that are all `Send` and `Sync`,\
  \ is itself also `Send` and `Sync`.\n\nThe way to opt-out of either of these is\
  \ to add a field to your type that does not implement the trait. For that purpose,\
  \ the special `PhantomData<T>` type often comes in handy. That type is treated by\
  \ the compiler as a T, except it doesn’t actually exist at runtime. It’s a zero\
  \ sized type, taking no space.\n\nLet’s take a look at this struct:\n\n```\nstruct\
  \ X {\n    handle: i32,\n```\n\n```\n_not_sync: PhantomData<Cell<()>>,\n}\n```\n\
  \nIn this example, the struct X would be both Send and Sync if handle was its only\
  \ field. However, we added a zero-sized PhantomData<Cell<()>> field, which is treated\
  \ as if it were a Cell<()>. Since a Cell<()> is not Sync, neither is X. It is still\
  \ Send, however, since all its fields implement Send.\n\nRaw pointers (*const T\
  \ and *mut T) are neither Send nor Sync, since the compiler doesn’t know much about\
  \ what they represent.\n\nThe way to opt-in to either of the traits is the same\
  \ as with any other trait: an impl block to implement the trait for you type:\n\n\
  ```\nstruct X {\n    p: *mut i32,\n}\n\nunsafe impl Send for X {}\nunsafe impl Sync\
  \ for X {}\n```\n\nNote how implementing these traits requires the unsafe keyword,\
  \ since the compiler cannot check for you if it’s correct. It’s a promise you make\
  \ to the compiler, which it will just have to trust.\n\nIf you try to move something\
  \ into another thread which is not Send, the compiler will politely stop you from\
  \ doing that. Here is a small example to demonstrate that:\n\n```\nfn main() {\n\
  \    let a = Rc::new(123);\n    thread::spawn(move || {\n        dbg!(a);\n    });\n\
  }\n```\n\nHere, we try to send an Rc<i32> to a new thread, but Rc<i32>, unlike Arc<i32>,\
  \ does not implement Send.\n\nIf we try to compile this, we’re faced with the following\
  \ error:\n\n```\nerror[E0277]: `Rc<i32>` cannot be sent between threads safely\n\
  \    --> src/main.rs:3:5\n     |\n3   |         thread::spawn(move || {\n     |\
  \         ^^^^^^^^^^^^^ `Rc<i32>` cannot be sent between\nthreads safely\n     |\n\
  \     = help: within `[closure@src/main.rs:3:19: 5:6]`, the trait\n`Send` is not\
  \ implemented for `Rc<i32>`\n     = note: required because it appears within the\
  \ type\n`[closure@src/main.rs:5:19: 5:6]`\nnote: required by a bound in `spawn`\n\
  ```\n\nThe thread::spawn function requires its argument to be Send, and a closure\
  \ is only Send if all of its captures are. If we try to capture something that’s\
  \ not Send our mistake is caught, protecting us from undefined behavior.\n\n###\
  \ Locking: Mutexes and RwLocks\n\nThe most commonly used tool for sharing (mutable)\
  \ data between threads is called a mutex, which is short for \"mutual exclusion\"\
  . The job of a mutex is to ensure threads have exclusive access to some data by\
  \ temporarily blocking other threads that try to access it at the same time.\n\n\
  Conceptually, a mutex has only two operations: lock and unlock, and two states:\
  \ locked and unlocked. When a thread locks an unlocked mutex, the mutex is marked\
  \ as locked and the thread can immediately continue. When a thread then attempts\
  \ to lock an already locked mutex, that operation will block. The thread is put\
  \ to sleep while it waits for the mutex to be unlocked. Unlocking is only possible\
  \ on a locked mutex, and should be done by the same thread that locked it. If other\
  \ threads are waiting to lock the mutex, unlocking will cause one of those threads\
  \ to be woken up, so it can try to lock the mutex again and continue its course.\n\
  \n\n\n\n\n使用互斥锁保护数据本质上是所有线程之间的约定：它们只有在持有互斥锁被锁定的情况下才会访问数据。这样一来，就不会有两个线程同时访问该数据，从而避免数据竞争。\n\
  \n### Rust 的 Mutex\n\nRust 标准库通过 `std::sync::Mutex<T>` 提供了此功能。它是关于类型 T 的泛型类型，其中\
  \ T 是互斥锁所保护的数据的类型。通过将此 T 作为互斥锁的一部分，数据只能通过互斥锁访问，从而提供了一个安全的接口，可以保证所有线程都会遵守约定。\n\n\
  为了确保只有锁定互斥锁的线程才能解锁它，它没有 `unlock()` 方法。相反，其 `lock()` 方法返回一种特殊类型，称为 `MutexGuard`。该守卫代表我们已锁定互斥锁的保证。它通过\
  \ `DerefMut` trait 表现得像一个独占引用，从而为我们提供对互斥锁保护的数据的独占访问。解锁互斥锁是通过丢弃守卫来完成的。当我们丢弃守卫时，我们放弃了访问数据的能力，并且守卫的\
  \ `Drop` 实现将解锁互斥锁。\n\n让我们看一个示例来了解互斥锁的实际使用情况：\n\n```\nfn main() {\n    let n = Mutex::new(0);\n\
  \    thread::scope(|s| {\n        for _ in 0..10 {\n            s.spawn(|| {\n \
  \               let mut guard = n.lock().unwrap();\n                for _ in 0..100\
  \ {\n                    *guard += 1;\n                }\n            });\n    \
  \    }\n    });\n    assert_eq!(n.into_inner().unwrap(), 1000);\n}\n```\n\n这里，我们有一个\
  \ Mutex<i32>，即保护一个整数的互斥锁，并生成十个线程，每个线程将整数递增一百次。每个线程首先通过 lock() 锁定互斥锁以获得互斥锁守卫，然后使用该守卫访问整数并修改它。守卫在该变量超出作用域后会被隐式丢弃。\n\
  \n线程完成后，我们可以通过 into_inner() 安全地移除对整数的保护。into_inner 方法需要对互斥锁的独占引用，这保证了不会再有其他引用指向该互斥锁，从而使锁定变得不必要。\n\
  \n即使递增以 1 为步长进行，观察整数的线程也只能看到 100 的倍数，因为它只能在互斥锁未锁定时查看整数。有效地，由于互斥锁的存在，这一百次递增现在成为一个单一的不可分割的、原子的操作。\n\
  \n为了清楚地看到互斥锁的效果，我们可以让每个线程在解锁互斥锁前等待一秒：\n\n```\n..    s.spawn(|| {\n        let mut\
  \ guard = n.lock().unwrap();\n        for _ in 0..100 {\n            *guard += 1;\n\
  \        }\n        thread::sleep(Duration::from_secs(1)); // Sleep\nbefore unlocking\
  \ the mutex.\n    });\n..\n```\n\n现在运行程序时，你会看到它大约需要十秒钟才能完成。每个线程只等待一秒，但互斥锁会确保一次只有一个线程可以这样做。\n\
  \n如果我们在休眠一秒之前丢弃守卫，从而解锁互斥锁，我们会看到它改为并行发生。\n\n```\n..    s.spawn(|| {\n```\n\n```\n\
  let mut guard = n.lock().unwrap();\nfor _ in 0..100 {\n    *guard += 1;\n}\ndrop(guard);\
  \ // Drop the guard before sleeping\nthread::sleep(Duration::from_secs(1));\n});\n\
  ```\n\none second.\n..\n\n有了这个更改，此程序将只花费大约一秒钟，因为现在十个线程可以同时执行其一秒的休眠。这显示了保持互斥锁锁定时间尽可能短的重要性。保持互斥锁锁定时间超过必要的时间可能会完全抵消并行性的任何好处，有效地强制所有操作按串行发生。\n\
  \n### 锁中毒\n\n上面示例中的 unwrap() 调用与锁中毒有关。\n\n当线程在持有锁时发生 panic 时，Rust 中的 Mutex 会被标记为中毒。lock\
  \ 方法在锁被中毒时会返回 Err。\n\n这是一种防止受互斥锁保护的数据处于不一致状态的机制。如果在上面的示例中，线程在递增整数少于一百次后发生 panic，则互斥锁会解锁，整数会被留在不再是\
  \ 100 的倍数的意外状态中，可能破坏其他线程所做的假设。在这种情况下自动将互斥锁标记为中毒会强制用户处理这种可能性。\n\n在中毒的互斥锁上调用 lock()\
  \ 仍然会锁定互斥锁。lock() 返回的 Err 包含互斥锁守卫，允许我们纠正不一致的状态或简单地忽略中毒。\n\n虽然锁中毒看起来像是个好主意，但在实践中并不常用。大多数代码要么忽略中毒，要么使用\
  \ unwrap() 在\n\n锁被中毒时发生 panic，有效地将 panic 传播给互斥锁的所有使用者。\n\n### MUTEX GUARD 的生命周期\n\
  \n虽然隐式丢弃守卫来解锁互斥锁对于正确性来说很方便也很重要，但有时会导致微妙的意外。如果我们使用 let 语句为守卫分配一个名称（如我们在上面的示例中所做的那样），那么它何时会被丢弃就相对容易看出，因为局部变量会在其定义的作用域结束时被丢弃。尽管如此，不显式丢弃守卫可能会导致互斥锁被锁定比必要的时间更长，正如上面的示例所示。\n\
  \n使用未分配名称的守卫也是可能的，有时非常方便。由于 MutexGuard 表现得像对受保护数据的独占引用，我们可以直接使用它，而无需先为守卫分配名称。例如，如果你有一个\
  \ Mutex<Vec<i32>>，你可以锁定互斥锁，将项目推入 Vec，然后在单个语句中再次解锁互斥锁：\n\n```\nlist.lock().unwrap().push(1);\n\
  ```\n\n在较大表达式中产生的任何临时值，例如 lock() 返回的守卫，都将在语句结束时被丢弃。虽然这看起来很明显且合理，但它会导致一个常见的陷阱，通常涉及\
  \ match、if let 或 while let 语句。以下是遇到此陷阱的示例：\n\n```\nif let Some(item) = list.lock().unwrap().pop()\
  \ {\n    process_item(item);\n}\n```\n\n如果我们的意图是锁定列表，弹出一个项目，解锁列表，然后在列表解锁后处理该项目，我们在这里犯了一个微妙但重要的错误。临时守卫不会在整个\
  \ if let 语句结束之前被丢弃，这意味着我们在处理项目时不必要地持有锁。\n\n也许令人惊讶的是，这对于类似的 if 语句，例如以下示例，并不会发生：\n\
  \n```\nif list.lock().unwrap().pop() == Some(1) {\n    do_something();\n}\n```\n\
  \n这里，临时守卫会在 if 语句的主体执行之前被丢弃。原因在于常规 if 语句的条件始终是一个纯布尔值，不能借用任何东西。没有理由将临时值的生命周期从条件扩展到语句的末尾。对于\
  \ if let 语句来说，情况可能并非如此。例如，如果我们使用 front() 而不是 pop()，item 将从列表中借用，使得有必要保留守卫。由于借用检查器只是一个检查，并不影响何时或按什么顺序丢弃事物，因此在使用\
  \ pop() 时也会发生同样的情况，即使这本是不必要的。\n\n我们可以通过将 pop 操作移动到单独的 let 语句来避免这种情况。然后守卫会在该语句结束时被丢弃，在\
  \ if let 之前：\n\n```\nlet item = list.lock().unwrap().pop();\nif let Some(item) =\
  \ item {\n    process_item(item);\n}\n```\n\n### 读写锁\n\n互斥锁只关心独占访问。MutexGuard 将为我们提供对受保护数据的独占引用（&mut\
  \ T），即使我们只想查看数据并且共享引用（&T）就已足够。\n\n\n\n读写锁是互斥锁的稍微复杂一些的版本，它能够理解独占访问和共享访问的区别，并能提供两者。它有三种状态：未锁定、由单个\
  \ *writer*（用于独占访问）锁定，或由任意数量的 *readers*（用于共享访问）锁定。它常用于多线程频繁读取数据，但只偶尔更新的数据。\n\nRust\
  \ 标准库通过 `std::sync::RwLock<T>` 类型提供这种锁。它的工作方式与标准的 `Mutex` 非常相似，只是其接口主要分为两部分。不是只有一个\
  \ `lock()` 方法，它有 `read()` 和 `write()` 方法用于分别以读者的身份或写者的身份锁定。它带有两种保护类型，一种用于读者，一种用于写者：`RwLockReadGuard`\
  \ 和 `RwLockWriteGuard`。前者仅实现 `Deref` 以表现得像对受保护数据的共享引用，而后者还实现 `DerefMut` 以表现得像独占引用。\n\
  \n它在本质上是 `RefCell` 的多线程版本：动态跟踪对引用的数量以确保借用规则得到遵守。\n\n`Mutex<T>` 和 `RwLock<T>` 都要求\
  \ `T` 实现 `Send`，因为它们可用于将 `T` 发送到另一个线程。`RwLock<T>` 额外要求 `T` 也实现 `Sync`，因为它允许多个线程持有对受保护数据的共享引用（`&T`）。严格来说，你可以为不满足这些要求的\
  \ `T` 创建锁，但你将无法在线程间共享它，因为锁本身不会实现 `Sync`。\n\n读写锁实现之间存在许多微妙的差异。最重要的是，有些优先读者，有些优先写者。在某些实现中，当有写者在等待时，新读者会被阻塞并必须等待，即使锁已经被读锁定。这是为了防止\
  \ *writer starvation*，即许多读者共同导致锁永远无法解锁，从而永远不允许任何写者更新数据的情况。\n\n### MUTEXES IN OTHER\
  \ LANGUAGES\n\nRust 标准库的 Mutex 和 RwLock 看起来与其他语言如 C 或 C++ 中的有所不同。\n\n最大的区别在于 Rust\
  \ 的 `Mutex<T>` 包含它所保护的数据。例如在 C++ 中，`std::mutex` 不包含它保护的数据，甚至根本不知道它在保护什么。这意味着用户有责任记住哪些数据受保护以及由哪个互斥锁保护，并确保每次访问受保护数据时都锁定正确的互斥锁。在阅读其他语言中涉及互斥锁的代码时，或与不熟悉\
  \ Rust 的程序员交流时，记住这一点很有用。Rust 程序员可能会谈论“互斥锁内部的数据”，或说诸如“把它包在互斥锁里”之类的话，这对只熟悉其他语言中互斥锁的人来说会令人困惑。\n\
  \n如果你真的需要一个不包含任何内容的独立互斥锁，例如用于保护某些外部硬件，你可以使用 `Mutex<()>`. 但即使在这些情况下，你最好定义一个（可能是零大小的）类型来与该硬件交互并将其包装在\
  \ Mutex 中。这样，你仍然被迫在与硬件交互之前锁定互斥锁。\n\n### Waiting: Parking and Condition Variables\n\
  \n当数据被多个线程修改时，存在许多情况需要它们等待某个事件；等待数据上的某个条件变为真。例如，如果我们有一个互斥锁保护一个 Vec，我们可能想等待它包含任何元素。\n\
  \n虽然互斥锁确实允许线程等待其解锁，但它不提供等待其他条件的功功能。如果互斥锁是我们唯一拥有的东西，我们就必须不断锁定互斥锁以反复检查 Vec 中是否已有内容。\n\
  \n#### Thread parking\n\n等待另一个线程通知的一种方法称为 *thread parking*。一个线程可以 *park* 自己，这会使其进入睡眠状态，停止消耗任何\
  \ CPU 周期。另一个线程随后可以 *unpark* 已停靠的线程，使其从小睡中唤醒。\n\n线程停靠可通过 `std::thread::park()` 函数获得。对于取消停靠，你在表示要取消停靠的线程的\
  \ Thread 对象上调用 `unpark()` 方法。这样的对象可以从 `spawn` 返回的 join handle 获得，或由线程本身通过 `std::thread::current()`\
  \ 获得。\n\n让我们深入研究一个使用互斥锁在两个线程之间共享队列的示例。在下面的示例中，一个新生成的线程将从队列中消费项目，而主线程将每秒向队列中插入一个新项目。线程停靠用于使消费线程在队列为空时等待。\n\
  \n```\nlet queue = Mutex::new(VecDeque::new());\n\nthread::scope(|s| {\n    // Consuming\
  \ thread\n    let t = s.spawn(|| loop {\n        let item = queue.lock().unwrap().pop_front();\n\
  \        if let Some(item) = item {\n            dbg!(item);\n        } else {\n\
  \            thread::park();\n        }\n    });\n\n    // Producing thread\n  \
  \  for i in 0.. {\n        queue.lock().unwrap().push_back(i);\n        t.thread().unpark();\n\
  \        thread::sleep(Duration::from_secs(1));\n    }\n});\n```\n\n消费线程在一个无限循环中运行，从队列中弹出项目并使用\
  \ `dbg` 宏显示它们。当队列为空时，它会停止并使用 `park` 函数睡眠。如果它被取消停靠，它会重新开始并再次从队列中弹出项目，直到它为空。如此循环。\n\
  \n生产线程每秒生产一个新数字，将其推入队列。每次添加项目时，它都会在引用消费线程的 `Thread` 对象上使用 `unpark` 方法来取消停靠它。这样，消费线程就会被唤醒以处理新元素。\n\
  \n这里一个重要的观察是，如果我们移除停靠，这个程序在理论上仍然是正确的，只是效率低下。这很重要，因为 `park()` 不保证它只会因为匹配的 `unpark()`\
  \ 而返回。虽然有点罕见，但它可能会有 *spurious wake-ups*。我们的示例对此处理得很好，因为消费线程会锁定队列，发现它是空的，然后直接解锁并再次停靠自己。\n\
  \n线程停靠的一个重要属性是，在线程停靠自己之前对 `unpark()` 的调用不会丢失。取消停靠请求仍会被记录，下一次线程尝试停靠自己时，它会清除该请求并直接继续，而不会真正进入睡眠。要了解这对正确操作为何至关重要，让我们回顾一下两个线程执行的步骤的可能顺序：\n\
  \n- 1. 消费线程，我们称之为 C，锁定队列。\n- 2. C 尝试从队列中弹出项目，但它是空的，结果为 `None`。\n- 3. C 解锁队列。\n-\
  \ 4. 生产线程，我们称之为 P，锁定队列。\n- 5. P 将新项目推到队列上。\n- 6. P 再次解锁队列。\n- 7. P 调用 `unpark()`\
  \ 来通知 C 有新项目。\n- 8. C 调用 `park()` 去睡眠，等待更多项目。\n\n虽然在第 3 步释放队列和第 8 步停靠之间只有很短的一瞬间，但在那短暂的瞬间，步骤\
  \ 4 到 7 可能会发生。如果 `unpark()` 在线程未停靠时被忽略，通知就会丢失。消费线程仍在等待，即使队列中有项目。由于取消停靠请求会为未来的 `park()`\
  \ 调用保存，我们不必担心这个问题。\n\n然而，取消停靠请求不会堆积。调用 `unpark()` 两次然后之后调用 `park()` 两次仍然会导致线程进入睡眠。第一次\
  \ `park()` 清除请求并直接返回，但第二次则正常进入睡眠。\n\n这意味着在我们上面的示例中很重要，我们只有在看到队列为空时才停靠线程，而不是在处理完每个项目后停靠。虽然在这个示例中由于巨大的（一秒）睡眠而极不可能发生，但多个\
  \ `unpark()` 调用可能最终只唤醒一次 `park()` 调用。\n\n不幸的是，这也意味着如果在 `park()` 返回后但在队列被锁定并清空之前调用了\
  \ `unpark()`，该 `unpark()` 调用是不必要的，但仍会导致下一次 `park()` 调用立即返回。这会导致（空的）队列被额外锁定和解锁一次。虽然这不影响程序的正确性，但确实会影响其效率和性能。\n\
  \n这种机制对于像我们示例中这样的简单情况效果很好，但在事情变得更复杂时很快就会失效。例如，如果我们有多个消费者线程从同一个队列中取项目，生产者线程将无法知道\n\
  \n\n\n实际上正在等待并且应该被唤醒。生产者必须确切知道消费者何时在等待，以及它在等待什么条件。\n\n### 条件变量\n\n条件变量是等待受互斥锁保护的数据发生某些变化时更常用的选项。它们有两个基本操作：wait\
  \ 和 notify。线程可以在条件变量上等待，并在有人通知同一个条件变量时被唤醒。多个线程可以等待同一个条件变量，通知可以发送给其中一个等待线程，也可以发送给所有线程。\n\
  \n这意味着我们可以为我们感兴趣的特定事件或条件创建一个条件变量，例如队列非空，并在该条件上等待。任何导致该事件或条件发生的线程都会通知条件变量，而无需知道有多少线程对该通知感兴趣。\n\
  \n为了避免在解锁互斥锁和等待条件变量之间的短暂瞬间丢失通知的问题，条件变量提供了一种原子地解锁互斥锁并开始等待的方式。这意味着通知根本没有可能丢失的时刻。\n\
  \nRust 标准库提供了一个条件变量 `std::sync::Condvar`。它的 wait 方法接受一个 MutexGuard 来证明我们已锁定互斥锁。它会解锁互斥锁并进入睡眠，并在被唤醒时重新锁定互斥锁并返回一个新的\
  \ MutexGuard，证明互斥锁再次被锁定。\n\n它有两个 notify 函数：`notify_one` 用于唤醒一个等待线程（如果有），以及 `notify_all`\
  \ 用于唤醒所有线程。\n\n让我们修改我们用于线程挂起的示例以使用 Condvar 代替：\n\n```\nlet queue = Mutex::new(VecDeque::new());\n\
  let not_empty = Condvar::new();\n```\n\n```\nthread::scope(|s| {\n    s.spawn(||\
  \ {\n        loop {\n            let mut q = queue.lock().unwrap();\n          \
  \  let item = loop {\n                if let Some(item) = q.pop_front() {\n    \
  \                break item;\n                } else {\n                    q =\
  \ not_empty.wait(q).unwrap();\n                }\n            };\n            drop(q);\n\
  \            dbg!(item);\n        }\n    });\n\n    for i in 0.. {\n        queue.lock().unwrap().push_back(i);\n\
  \        not_empty.notify_one();\n        thread::sleep(Duration::from_secs(1));\n\
  \    }\n});\n```\n\n我们不得不改变一些东西：\n\n- 我们现在不仅有一个包含队列的 Mutex，还有一个 Condvar 来通过它传递非空条件。\n\
  - 我们不再需要知道唤醒哪个线程，因此不再存储 spawn 的返回值。相反，我们通过条件变量的 notify_one 方法通知消费者。\n- 解锁、等待和重新锁定都由\
  \ wait 方法完成。我们不得不稍微重构控制流，以便能够将 guard 传递给 wait 方法，同时在处理项目之前仍然丢弃它。\n\n现在我们可以按需生成任意数量的消费者线程，甚至稍后生成更多，而无需更改任何内容。条件变量会负责将通知传递给感兴趣的线程。\n\
  \n如果我们有一个更复杂的系统，其中线程对不同的条件感兴趣，我们可以为每个条件定义一个 `Condvar`。例如，一个表示队列非空，另一个表示队列为空。然后每个线程都可以等待与其正在执行的操作相关的条件。\n\
  \n通常，`Condvar` 只与单个 `Mutex` 一起使用。如果两个线程尝试使用两个不同的互斥锁并发地 `wait` 在同一个条件变量上，可能会导致 panic。\n\
  \n`Condvar` 的一个缺点是它只能与 `Mutex` 一起使用，但对于几乎大多数用例来说这完全没问题，因为这本来就是已经使用的东西。\n\n### 总结\n\
  \n- 多个线程可以在同一个程序中并发运行，并且可以在任何时候生成。\n- 当主线程结束时，整个程序结束。\n- 数据竞争是未定义行为，并且在安全代码中由 Rust\
  \ 的类型系统完全防止。\n- 可以发送到其他线程的数据是 `Send`，可以在线程之间共享的数据是 `Sync`。\n- 普通线程可能与程序一样长时间运行，因此只能借用\
  \ `'static` 数据，例如静态数据和泄漏的分配。\n- 引用计数（`Arc`）可用于共享所有权，以确保数据在任何线程使用它时都存活。\n- 作用域线程对于限制线程的生命周期很有用，以便它可以借用非\
  \ `'static` 数据，例如局部变量。\n- `&T` 是一个 *共享* 引用。`&mut T` 是一个 *独占* 引用。常规类型不允许通过共享引用进行突变。\n\
  - 一些类型具有内部可变性，这允许通过共享引用进行突变，并且始终基于 `UnsafeCell`。\n- `Cell` 和 `RefCell` 是单线程内部可变性的标准类型。`Atomics`、`Mutex`\
  \ 和 `RwLock` 是它们的多线程等价物。\n- `Cell` 和原子操作只允许整体替换值，而 `RefCell`、`Mutex` 和 `RwLock`\
  \ 允许你通过动态强制访问规则直接突变值。\n- 线程挂起可以是一种方便的方式来等待某个条件。\n- 当条件涉及受 `Mutex` 保护的数据时，使用 `Condvar`\
  \ 比线程挂起更方便。\n"
- "## 第 2 章. 原子操作的介绍\n\n### 早期发布读者的说明\n\n使用 Early Release 电子书，您可以在官方发布这些标题之前很久就利用这些技术——作者在写作时的原始未编辑内容。\n\
  \n这将是最终书籍的第 2 章。请注意 GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何评论，或者如果您注意到本章中缺少材料，请联系编辑\
  \ shiraevans@gmail.com。\n\n单词 *atomic* 来自希腊语 ἄτομος，意思是 *不可分割*，不能被切成更小块的东西。在计算机科学中，它用于描述不可分割的操作：它要么完全完成，要么尚未发生。\n\
  \n如“借用和数据竞争”中所述，多个线程并发读取和修改同一个变量通常会导致未定义行为。然而，原子操作确实允许不同线程安全地读取和修改同一个变量。由于此类操作是不可分割的，它要么完全发生在另一个操作之前，要么完全发生在之后，从而避免未定义行为。稍后，在\
  \ X REF HERE FOR CH04 中，我们将看到这在硬件层面上是如何工作的。\n\n原子操作是涉及多个线程的任何事物的主要构建块。所有其他并发原语，例如互斥锁和条件变量，都是使用原子操作实现的。\n\
  \n在 Rust 中，原子操作可通过 `std::sync::atomic` 中标准原子类型的方法获得。它们都以 `Atomic` 开头，例如 `AtomicI32`\
  \ 或 `AtomicUsize`。可用的类型取决于硬件架构，有时还取决于操作系统，但几乎所有平台至少提供指针大小的所有原子类型。\n\n与大多数类型不同，它们允许通过共享引用进行修改（例如\
  \ `&AtomicU8`）。这得益于内部可变性，如“内部可变性”中所述。\n\n每种可用的原子类型都有相同的接口，具有用于存储和加载的方法、用于原子 `fetch\
  \ and modify` 操作的方法，以及一些更高级的 `compare and exchange` 方法。我们将在本章的其余部分详细讨论它们。\n\n但是，在深入研究不同的原子操作之前，我们需要简要介绍一个称为\
  \ *内存排序* 的概念。\n\n### 内存排序\n\n每个原子操作都接受一个类型为 `std::sync::atomic::Ordering` 的参数，它决定了我们对操作相对顺序的保证。最简单、保证最少的变体是\
  \ `Relaxed`。`Relaxed` 仍然保证单个原子变量的一致性，但不承诺不同变量之间操作的相对顺序。\n\n这意味着两个线程可能会以不同的顺序看到对不同变量的操作。例如，如果一个线程先写入一个变量，然后很快写入第二个变量，另一个线程可能会看到相反的顺序。\n\
  \n在本章中，我们只会查看这不是问题的情况，并且在不深入细节的情况下到处使用 `Relaxed`。我们将在 X REF HERE FOR CH03 中讨论内存排序的所有细节以及其他可用的内存排序。\n\
  \n\n\n\n### 原子加载与存储\n\n我们接下来要查看的第一个两个原子操作是最基本的操作：加载和存储。它们的函数签名如下：\n\n```\nimpl AtomicI32\
  \ {\n    pub fn load(&self, ordering: Ordering) -> i32;\n    pub fn store(&self,\
  \ value: i32, ordering: Ordering);\n}\n```\n\n`load` 方法会原子地加载原子变量中存储的值，而 `store`\
  \ 方法会原子地在其中存储一个新值。注意 `store` 方法接受一个共享引用（&T）而不是独占引用（&mut T），即使它修改了值。\n\n让我们来看一下这两种方法的一些实际用例。\n\
  \n### 示例：停止标志\n\n第一个示例使用 `AtomicBool` 作为停止标志。这种标志用于通知其他线程停止运行。\n\n```\nfn main()\
  \ {\n    static STOP: AtomicBool = AtomicBool::new(false);\n\n    // Spawn a thread\
  \ to do the work.\n    let background_thread = thread::spawn(|| {\n        while\
  \ !STOP.load(Relaxed) {\n            some_work();\n        }\n    });\n\n    //\
  \ Use the main thread to listen for user input.\n    for line in std::io::stdin().lines()\
  \ {\n        match line.unwrap().as_str() {\n            \"help\" => println!(\"\
  commands: help, stop\"),\n            \"stop\" => break,\n            cmd => println!(\"\
  unknown command: {cmd:?}\"),\n        }\n    }\n\n    // Inform the background thread\
  \ it needs to stop.\n    STOP.store(true, Relaxed);\n\n    // Wait until the background\
  \ thread finishes.\n    background_thread.join().unwrap();\n}\n```\n\n在这个示例中，后台线程会反复运行\
  \ `some_work()`，而主线程允许用户输入一些命令来与程序交互。在这个简单示例中，唯一有用的命令是 `stop` 用于使程序停止。\n\n为了让后台线程停止，使用原子\
  \ `STOP` 布尔值来向后台线程传达此条件。当前台线程读取到停止命令时，它将标志设置为 true，后台线程在每次新迭代之前都会检查该标志。主线程使用 `join`\
  \ 方法等待后台线程完成当前迭代。\n\n只要后台线程定期检查标志，这个简单的解决方案就运作良好。如果 `some_work()` 可能长时间被阻塞，这可能会导致从发出停止命令到程序退出之间出现不可接受的延迟。\n\
  \n### 示例：进度报告\n\n在下一个示例中，我们在后台线程上逐个处理 100 个项目，同时主线程定期向用户提供进度更新。\n\n```\nfn main()\
  \ {\n    let num_done = AtomicUsize::new(0);\n\n    thread::scope(|s| {\n      \
  \  // A background thread to process all 100 items.\n        s.spawn(|| {\n    \
  \        for i in 0..100 {\n                process_item(i);\n                num_done.store(i\
  \ + 1, Relaxed);\n            }\n        });\n\n        // The main thread shows\
  \ status updates, every second.\n        loop {\n            let n = num_done.load(Relaxed);\n\
  \            if n == 100 { break; }\n            println!(\"Working.. {n}/100 done\"\
  );\n            thread::sleep(Duration::from_secs(1));\n        }\n    });\n\n \
  \   println!(\"Done!\");\n}\n```\n\n这次，我们使用了一个作用域线程（“Scoped Threads”），它会自动为我们处理线程的\
  \ join，并允许我们借用局部变量。\n\n每当后台线程完成处理一个项目时，它会将已处理的项目数量存储在 `AtomicUsize` 中。与此同时，主线程会将该数字显示给用户以告知进度，大约每秒一次。一旦主线程看到所有\
  \ 100 个项目都已处理完毕，它就会退出作用域，这会隐式地 join 后台线程，并通知用户一切已完成。\n\n### 同步\n\n一旦最后一个项目被处理，主线程可能需要长达一整秒的时间才知道这一点，从而在末尾引入不必要的延迟。为了解决这个问题，我们可以使用线程挂起（“Thread\
  \ parking”）在有新信息时唤醒主线程使其从睡眠中恢复。\n\n下面是同一个示例，但现在使用 `thread::park_timeout` 而不是 `thread::sleep`：\n\
  \n```\nfn main() {\n    let num_done = AtomicUsize::new(0);\n\n    let main_thread\
  \ = thread::current();\n\n    thread::scope(|s| {\n        // A background thread\
  \ to process all 100 items.\n        s.spawn(|| {\n            for i in 0..100 {\n\
  \                process_item(i);\n                num_done.store(i + 1, Relaxed);\n\
  \                main_thread.unpark(); // Wake up the main thread.\n           \
  \ }\n        });\n\n        // The main thread shows status updates.\n        loop\
  \ {\n            let n = num_done.load(Relaxed);\n            if n == 100 { break;\
  \ }\n            println!(\"Working.. {n}/100 done\");\n            thread::park_timeout(Duration::from_secs(1));\n\
  \        }\n    });\n\n    println!(\"Done!\");\n}\n```\n\n变化不大。我们通过 `thread::current()`\
  \ 获得了主线程的句柄，后台线程现在在每次状态更新后使用它来取消挂起主线程。主线程现在使用 `park_timeout` 而不是 `sleep`，这样它就可以被中断。\n\
  \n现在，任何状态更新都会立即报告给用户，同时仍会每秒重复上一次更新以显示程序仍在运行。\n\n### 示例：延迟初始化\n\n在我们进入更高级的原子操作之前，最后一个示例是关于延迟初始化的。\n\
  \n假设有一个值 x，我们是从文件中读取、从操作系统获取或以其他方式计算的，我们期望它是恒定的。也许 x 是操作系统的版本，或者总内存量，或者 tau 的第 400\
  \ 位数字。对于这个示例来说并不重要。\n\n由于我们不期望它发生变化，我们可以在第一次需要时才请求或计算它，并记住结果。第一个需要它的线程必须计算该值，但它可以将其存储在原子静态变量中以供所有线程使用，包括如果它以后再次需要时它自己使用。\n\
  \n让我们看一个示例。为了简单起见，我们假设 x 从不为零，这样我们就可以在计算之前使用零作为占位符。\n\n```\nfn get_x() -> u64 {\n\
  \    static X: AtomicU64 = AtomicU64::new(0);\n    let mut x = X.load(Relaxed);\n\
  \    if x == 0 {\n        x = calculate_x();\n        X.store(x, Relaxed);\n   \
  \ }\n    x\n}\n```\n\n第一个调用 `get_x()` 的线程会检查静态变量 X，看到它仍然为零，计算其值，并将结果写回静态变量以供将来使用。之后，任何对\
  \ `get_x()` 的调用都会看到静态变量中的值不为零，并立即返回它而不再次计算。\n\n然而，如果第二个线程在第一个线程仍在计算 x 时调用 `get_x()`，第二个线程也会看到零并并行计算\
  \ x。哪个线程先完成，结果就会被另一个线程覆盖。这就是所谓的竞争。不是数据竞争，这在 Rust 中是不确定的行为且在不使用 unsafe 的情况下不可能发生，但仍然是一种具有不可预测获胜者的竞争。\n\
  \n由于我们期望 x 是恒定的，谁赢得竞争并不重要，因为结果无论如何都相同。根据我们期望 `calculate_x()` 花费的时间，这可能是一种非常好或非常糟糕的策略。\n\
  \n如果预计 `calculate_x()` 需要很长时间，最好让线程在第一个线程仍在初始化 x 时等待。你可以使用条件变量或线程挂起（“Waiting: Parking\
  \ and Condition Variables”）来实现这一点，但对于一个小示例来说这很快就会变得过于复杂。Rust 标准库通过 `std::sync::Once`\
  \ 和 `std::lazy::SyncOnceCell` 提供了完全相同的功能，因此通常无需自己实现。\n\n### 获取并修改操作\n\n现在我们已经看到了基本加载和存储操作的几个用例，让我们继续介绍更有趣的操作：获取并修改操作。这些操作会修改原子变量，但也会作为一次原子操作加载（获取）原始值。\n\
  \n最常用的有 `fetch_add` 和 `fetch_sub`，分别执行加法和减法。其他可用的操作包括用于位操作的 `fetch_or` 和 `fetch_and`，以及可用于保持运行最大值或最小值的\
  \ `fetch_max` 和 `fetch_min`。\n\n它们的函数签名如下：\n\n```\nimpl AtomicI32 {\n    pub fn\
  \ fetch_add(&self, v: i32, ordering: Ordering) -> i32;\n    pub fn fetch_sub(&self,\
  \ v: i32, ordering: Ordering) -> i32;\n    pub fn fetch_or(&self, v: i32, ordering:\
  \ Ordering) -> i32;\n    pub fn fetch_and(&self, v: i32, ordering: Ordering) ->\
  \ i32;\n    pub fn fetch_nand(&self, v: i32, ordering: Ordering) -> i32;\n    pub\
  \ fn fetch_xor(&self, v: i32, ordering: Ordering) -> i32;\n    pub fn fetch_max(&self,\
  \ v: i32, ordering: Ordering) -> i32;\n    pub fn fetch_min(&self, v: i32, ordering:\
  \ Ordering) -> i32;\n    pub fn swap(&self, v: i32, ordering: Ordering) -> i32;\
  \ // \"fetch_store\"\n}\n```\n\n唯一的例外是简单地存储新值而不考虑旧值的操作。它没有被命名为 `fetch_store`，而是被命名为\
  \ `swap`。\n\n下面是一个快速演示，展示 `fetch_add` 如何返回操作之前的值：\n\n```\nlet a = AtomicU32::new(100);\n\
  let b = a.fetch_add(23, Relaxed);\n```\n\n\n\n\n```\nlet c = a.load(Relaxed);\n\n\
  assert_eq!(b, 100);\nassert_eq!(c, 123);\n```\n\n`fetch_add` 操作将 a 从 100 增加到 123，但返回给我们的是旧值\
  \ 100。之后的任何操作都会看到 123 的值。\n\n这些操作的返回值并不总是相关。如果只需要对原子值应用操作，而对值本身不感兴趣，那么完全忽略返回值是完全可以的。\n\
  \n需要注意的重要一点是，`fetch_add` 和 `fetch_sub` 对溢出实现了 *wrapping* 行为。递增到超出最大可表示值的值会回绕并导致最小可表示值。这与常规整数的加法和减法运算符的行为不同，后者在调试模式下溢出时会\
  \ panic。\n\n在“Compare-and-Exchange Operations”中，我们将看到如何使用溢出检查进行原子加法。\n\n但首先，让我们看看这些方法的一些实际用例。\n\
  \n### Example: Progress Reporting from Multiple Threads\n\n在“Example: Progress Reporting”中，我们使用了一个\
  \ `AtomicUsize` 来报告后台线程的进度。如果我们将工作拆分到例如四个线程，每个线程处理 25 个项目，我们就需要知道来自四个线程的进度。\n\n\
  我们可以使用一个单独的 `AtomicUsize` 为每个线程，并在主线程中全部加载并求和，但更简单的解决方案是使用单个 `AtomicUsize` 来跟踪所有线程处理的项目总数。\n\
  \n要使其工作，我们不能再使用 `store` 方法，因为那样会覆盖其他线程的进度。相反，我们可以在每次处理完一个项目后使用原子加操作来递增计数器。\n\n让我们更新“Example:\
  \ Progress Reporting”中的示例，将工作拆分到四个线程：\n\n```\nfn main() {\n    let num_done = &AtomicUsize::new(0);\n\
  \n    thread::scope(|s| {\n        // Four background threads to process all 100\
  \ items, 25 each.\n        for t in 0..4 {\n            s.spawn(move || {\n    \
  \            for i in 0..25 {\n                    process_item(t * 25 + i);\n \
  \                   num_done.fetch_add(1, Relaxed);\n                }\n       \
  \     });\n        }\n\n        // The main thread shows status updates, every second.\n\
  \        loop {\n            let n = num_done.load(Relaxed);\n            if n ==\
  \ 100 { break; }\n            println!(\"Working.. {n}/100 done\");\n          \
  \  thread::sleep(Duration::from_secs(1));\n        }\n    });\n\n    println!(\"\
  Done!\");\n}\n```\n\n有一些变化。最重要的是，我们现在生成四个后台线程而不是一个，并且使用 fetch_add 而不是 store 来修改\
  \ num_done 原子变量。\n\n更微妙的是，我们现在为后台线程使用 move 闭包，并且 num_done 现在是一个引用。这与我们使用 fetch_add\
  \ 无关，而是与我们在循环中生成四个线程的方式有关。此闭包捕获 t 以知道它是四个线程中的哪一个，从而确定从项目 0、25、50 还是 75 开始。如果没有 move\
  \ 关键字，闭包将尝试通过引用捕获 t。这是不允许的，因为它在循环期间只存在很短的时间。\n\n作为 move 闭包，它移动（或复制）其捕获的内容而不是借用它们，从而为其提供\
  \ t 的副本。因为它还捕获了 num_done，所以我们将该变量更改为引用，因为我们仍然希望借用同一个 AtomicUsize。请注意，原子类型未实现 Copy\
  \ trait，因此如果我们尝试将一个移动到多个线程中，我们会收到错误。\n\n撇开闭包捕获的细微差别，使用 fetch_add 的更改在这里非常简单。我们不知道线程会以什么顺序递增\
  \ num_done，但由于加法是原子的，我们不必担心任何事情，并且可以确定当所有线程完成时它将恰好为 100。\n\n### Example: Statistics\n\
  \n继续使用通过原子来报告其他线程正在做什么的概念，让我们扩展示例以收集并报告处理一个项目所需时间的统计信息。\n\n除了 num_done，我们还添加了两个原子变量\
  \ total_time 和 max_time，以跟踪处理项目所花费的时间。我们将使用这些来报告平均和峰值处理时间。\n\n```\nfn main() {\n\
  \    let num_done = &AtomicU32::new(0);\n    let total_time = &AtomicU64::new(0);\n\
  \    let max_time = &AtomicU64::new(0);\n\n    thread::scope(|s| {\n        // Four\
  \ background threads to process all 100 items, 25 each.\n        for t in 0..4 {\n\
  \            s.spawn(move || {\n                for i in 0..25 {\n             \
  \       let start = Instant::now();\n                    process_item(t * 25 + i);\n\
  \                    let time_taken = start.elapsed().as_micros() as u64;\n\n  \
  \                  num_done.fetch_add(1, Relaxed);\n                    total_time.fetch_add(time_taken,\
  \ Relaxed);\n                    max_time.fetch_max(time_taken, Relaxed);\n    \
  \            }\n            });\n        }\n    }\n```\n\n```\n});\n\n// The main\
  \ thread shows status updates, every second.\nloop {\n    let total_time =\nDuration::from_micros(total_time.load(Relaxed));\n\
  \    let max_time =\nDuration::from_micros(max_time.load(Relaxed));\n    let n =\
  \ num_done.load(Relaxed);\n    if n == 100 { break; }\n    if n == 0 {\n       \
  \ println!(\"Working.. nothing done yet.\");\n    } else {\n        println!(\n\
  \            \"Working.. {n}/1000 done, {:?} average, {:?} peak\",\n           \
  \ total_time / n,\n            max_time,\n        );\n    }\n    thread::sleep(Duration::from_secs(1));\n\
  }\n});\n\nprintln!(\"Done!\");\n}\n```\n\n后台线程现在使用 Instant::now() 和 Instant::elapsed()\
  \ 来测量它们在 process_item() 中花费的时间。原子加操作用于将微秒数添加到 total_time，原子 max 操作用于跟踪 max_time\
  \ 中的最高测量值。\n\n主线程将总时间除以已处理的项目数以获得平均处理时间，并将其与来自 max_time 的峰值时间一起报告。\n\n由于三个原子变量是分开更新的，主线程可能在线程递增\
  \ num_done 之后，但在它更新 total_time 之前加载值，从而导致平均值的低估。更微妙的是，由于 Relaxed 内存排序对从另一个线程看到的操作的相对顺序没有任何保证，它甚至可能在仍看到旧的\
  \ num_done 值时短暂地看到新的更新的 total_time 值，从而导致平均值的过高估计。\n\n在我们的示例中，这都不是大问题。最坏的情况是短暂地向用户报告不准确的平均值。\n\
  \n如果我们想避免这种情况，可以将三个统计信息放在 Mutex 中。然后我们在更新三个数字时短暂锁定互斥锁，这些数字本身不再需要是原子的。这有效地将三次更新变成一次原子操作，以换取锁定和解锁互斥锁的成本，以及可能暂时阻塞线程。\n\
  \n### Example: ID Allocation\n\n让我们继续讨论一个用例，在该用例中我们确实需要 fetch_add 的返回值。\n\n假设我们需要一个\
  \ allocate_new_id() 函数，每次调用时都提供一个新的唯一数字。我们可能会使用这些数字来标识程序中的任务或其他事物；这些事物需要通过可以轻松存储并在线程之间传递的小东西唯一标识，例如整数。\n\
  \n使用 fetch_add 实现此函数 turns out 非常简单：\n\n```\nfn allocate_new_id() -> u32 {\n   \
  \ static NEXT_ID: AtomicU32 = AtomicU32::new(0);\n    NEXT_ID.fetch_add(1, Relaxed)\n\
  }\n```\n\n我们只需跟踪要发放的下一个数字，并在每次加载时递增它。第一个调用者将得到 0，第二个得到 1，以此类推。\n\n这里唯一的问题是溢出时的回绕行为。第\
  \ 4294967296 次调用将溢出 32 位整数，使得下一次调用将再次返回 0。\n\n这是否是个问题取决于用例：调用这么多次的可能性有多大，如果数字不唯一会发生什么最坏的情况？虽然这似乎是一个巨大的数字，但现代计算机可以在几秒钟内轻松执行我们的函数这么多次。如果内存安全依赖于这些数字的唯一性，我们上面的实现是不可接受的。\n\
  \n为了解决这个问题，我们可以尝试在调用次数过多时让函数 panic，如下所示：\n\n```\n// This version is problematic.\n\
  fn allocate_new_id() -> u32 {\n    static NEXT_ID: AtomicU32 = AtomicU32::new(0);\n\
  \    let id = NEXT_ID.fetch_add(1, Relaxed);\n    assert!(id < 1000, \"too many\
  \ IDs!\");\n    id\n}\n```\n\n现在，assert 语句将在一千次调用后 panic。然而，这发生在原子加操作已经发生之后，这意味着\
  \ NEXT_ID 在我们 panic 时已经递增到 1001。如果另一个线程随后调用该函数，它将在 panic 之前将其递增到 1002，依此类推。虽然可能需要更长的时间，但我们在\
  \ NEXT_ID 再次溢出到零时会在 4294966296 次 panic 后遇到相同的问题。\n\n解决此问题的三种常见方法。第一种是不 panic 而是完全在溢出时中止进程。std::process::abort\
  \ 函数将中止整个进程，排除了任何继续调用我们函数的可能性。虽然中止进程可能需要短暂的时间，在此期间函数仍可能被其他线程调用，但在程序真正中止之前发生数十亿次的可能性可以忽略不计。\n\
  \n事实上，这就是标准库中 Arc::clone() 的溢出检查的实现方式，以防你以某种方式克隆它 isize::MAX 次。在 64 位计算机上这需要数百年，但在\
  \ isize 只有 32 位时可以在几秒钟内实现。\n\n\n\n\n\nA second way to deal with the overflow is\
  \ to use `fetch_sub` to decrement the counter again before panicking, like this:\n\
  \n```\nfn allocate_new_id() -> u32 {\n    static NEXT_ID: AtomicU32 = AtomicU32::new(0);\n\
  \    let id = NEXT_ID.fetch_add(1, Relaxed);\n    if id >= 1000 {\n        NEXT_ID.fetch_sub(1,\
  \ Relaxed);\n        panic!(\"too many IDs!\");\n    }\n    id\n}\n```\n\nIt’s still\
  \ possible for the counter to very briefly be incremented beyond 1000 when multiple\
  \ threads execute this function at the same time, it is limited by the amount of\
  \ active threads. It’s reasonable to assume there will never be billions of active\
  \ threads at once, especially not all simultaneously executing the same function\
  \ in the brief moment between `fetch_add` and `fetch_sub`.\n\nThis is how overflows\
  \ are handled for the number of running threads in the standard library’s `thread::scope`\
  \ implementation.\n\nThe third way of handling overflows is arguably the only truly\
  \ correct one, as it prevents the addition from happening at all if it would overflow.\
  \ However, we cannot implement that with the atomic operations we’ve seen so far.\
  \ For this, we’ll need compare-and-exchange operations.\n\n### Compare-and-Exchange\
  \ Operations\n\nThe most advanced and flexible atomic operation is the *compare\
  \ and exchange* operation. This operation checks if the atomic value is equal to\
  \ a given value, and only if that is the case will it replace it with a new value,\
  \ all atomically as a single operation. It will return the previous value and tell\
  \ us whether it replaced it or not.\n\nIts signature is a bit more complicated than\
  \ the ones we’ve seen so far:\n\n```\nimpl AtomicI32 {\n    pub fn compare_exchange(\n\
  \        &self,\n        expected: i32,\n        new: i32,\n        store_order:\
  \ Ordering,\n        load_order: Ordering\n    ) -> Result<i32, i32>;\n}\n```\n\n\
  Ignoring memory ordering for a moment, it is basically identical to the following\
  \ implementation, except it all happens as a single undividable atomic operation:\n\
  \n```\npub fn compare_exchange(&self, expected: i32, new: i32) -> Result<i32, i32>\
  \ {\n    // In reality, the load, comparison and store,\n    // all happen as a\
  \ single atomic operation.\n    let v = self.load();\n    if v == expected {\n \
  \       // Value is as expected. Replace it and report success.\n        self.store(new);\n\
  \        Ok(v)\n    } else {\n        // The value was not as expected. Leave it\
  \ untouched and report failure.\n        Err(v)\n    }\n}\n```\n\nWhat this allows\
  \ us to do, is to load value, perform any calculation we like, and then update the\
  \ atomic variable to the updated value only if it hasn’t changed in the meantime.\
  \ If we put this in a loop to retry if it did change, we could use this to implement\
  \ all the other atomic operations, making this the most generic one.\n\nTo demonstrate,\
  \ let’s increment an AtomicU32 by one without using fetch_add, just to see how compare_exchange\
  \ is used in practice:\n\n```\nfn increment(a: &AtomicU32) {\n    let mut current\
  \ = a.load(Relaxed); ①\n    loop {\n```\n\n```\nlet new = current + 1;\nmatch a.compare_exchange(current,\
  \ new, Relaxed, Relaxed)\n{\n    Ok(_) => return,\n    Err(v) => current = v,\n\
  }\n```\n\nFirst, we load the current value of a.\nWe calculate the new value we\
  \ want to store in a, not taking into account potential concurrent modifications\
  \ of a by other threads.\nWe use compare_exchange to update the value of a, but\
  \ only if its value is still the same value we loaded before.\nIf a was indeed still\
  \ the same as before, it is now replaced by our new value and we are done.\nIf a\
  \ was not the same as before, another thread must’ve changed it in the brief moment\
  \ since we loaded it. The compare_exchange operation gives us the changed value\
  \ that a had, and we’ll try again using that value instead. The brief moment between\
  \ loading and updating is so short, that it’s unlikely for this to loop more than\
  \ a few iterations.\n\nNext to compare_exchange, there is also a very similar compare_exchange_weak\
  \ method. The difference is that the weak version might sometimes leave the value\
  \ untouched and still return an Err, even though the atomic value matched the expected\
  \ value. On some platforms, this method can be implemented more efficiently and\
  \ should be preferred in cases where the consequence of a spurious compare and exchange\
  \ failure are insignificant, such as in our increment function above. In X REF HERE\
  \ FOR CH04, we’ll dive into the low level details to find out why the weak version\
  \ can be more efficient.\n\n### Example: ID Allocation Without Overflow\n\nNow,\
  \ back to our overflow problem in allocate_new_id() from “Example: ID Allocation”.\n\
  \nTo stop incrementing NEXT_ID beyond a certain limit to prevent overflows, we can\
  \ use compare_exchange to implement atomic addition with an upper bound. Using that\
  \ idea, let’s make a version of allocate_new_id that always handles overflow correctly,\
  \ even in the practically impossible situations:\n\n```\nfn allocate_new_id() ->\
  \ u32 {\n    static NEXT_ID: AtomicU32 = AtomicU32::new(0);\n    let mut id = NEXT_ID.load(Relaxed);\n\
  \    loop {\n        assert!(id < 1000, \"too many IDs!\");\n        match NEXT_ID.compare_exchange_weak(id,\
  \ id + 1, Relaxed, Relaxed) {\n            Ok(_) => return id,\n            Err(v)\
  \ => id = v,\n        }\n    }\n}\n```\n\nNow we check and panic before modifying\
  \ NEXT_ID, guaranteeing it will never be incremented beyond 1000, making overflow\
  \ impossible. We can now raise the upper limit from 1000 to u32::MAX if we want,\
  \ without having to worry about edge cases in which it might get incremented beyond\
  \ the limit.\n\n### Example: Racy Lazy Initialization\n\nIn “Example: Lazy Initialization”,\
  \ we looked at an example of lazy initialization of a constant value. We made a\
  \ function that lazily initializes a value on the first call, but re-uses it on\
  \ later calls. When multiple threads run the function concurrently during the first\
  \ call, more than one thread might execute the initialization, and they will overwrite\
  \ eachothers result in an unpredictable order.\n\nThis is fine for values that we\
  \ expect to be constant, or when we don’t care about changing values. However, there\
  \ are also use cases where such a value gets initialized to a different value each\
  \ time, even though we need\n\nevery invocation of the function within a single\
  \ run of the program to return the same value.\n\nFor example, imagine a function\
  \ get_key() that returns a randomly generated key that’s only generated once per\
  \ run of the program. It might be an encryption key used for communication with\
  \ the program, that needs to be unique every time the program is run, but stay constant\
  \ within a process.\n\nThis means we cannot simply use a store operation after generating\
  \ a key, since that might overwrite a key generated by another thread just moments\
  \ ago, resulting in two threads using different keys. Instead, we can use compare_exchange\
  \ to make sure we only store the key if we’re still the first, and otherwise throw\
  \ our key away and use the stored key instead.\n\nHere’s an implementation of this\
  \ idea:\n\n```\nfn get_key() -> u64 {\n    static KEY: AtomicU64 = AtomicU64::new(0);\n\
  \    let key = KEY.load(Relaxed);\n    if key == 0 {\n        let new_key = generate_random_key();\n\
  \        match KEY.compare_exchange(0, new_key, Relaxed, Relaxed)\n        {\n \
  \           Ok(_) => new_key,\n            Err(k) => k,\n        }\n    } else {\n\
  \        key\n    }\n}\n```\n\nWe only generate a new key if KEY was not yet initialized.\n\
  We replace KEY by our newly generated key, but only if it is still zero.\nIf we\
  \ swapped the zero for our new key, we return our newly generated key. New invocations\
  \ of get_key() will now return the same new key that’s now stored in KEY.\nIf we\
  \ lost the race to another thread initializing KEY before we could, we forget our\
  \ newly generated key and use the key from KEY instead.\n\nThis is a good example\
  \ of a situation where compare_exchange_weak is not appropriate, and we want to\
  \ use the strong version instead. We don’t run our compare and exchange operation\
  \ in a loop, and we don’t want to\n\nreturn zero if the operation spuriously failed.\
  \ Even if we did put this in a loop, generating a new key probably takes more than\
  \ a few simple operations, so risking a spurious failure from `compare_exchange_weak`\
  \ is simply not worth the small performance benefit it might bring us.\n\nAs mentioned\
  \ in “Example: Lazy Initialization”, if `generate_random_key()` takes a lot of time,\
  \ it might make more sense to block threads during initialization, to avoid potentially\
  \ spending time generating keys that will not be used. The Rust standard library\
  \ provides such functionality through `std::sync::Once` and `std::lazy::SyncOnceCell`.\n\
  \n### Summary\n\n- Atomic operations are *undividable*; they either fully completed,\
  \ or they haven’t happened yet.\n- Atomic operations in Rust are done through the\
  \ atomic types in `std::sync::atomic`, such as `AtomicI32`.\n- Not all atomic types\
  \ are available on all platforms.\n- The relative ordering of atomic operations\
  \ is tricky when multiple variables are involved. More in X REF HERE FOR CH03.\n\
  - Simple loads and stores are nice for very basic inter-thread communication, like\
  \ stop flags and status reporting.\n- Lazy initialization can be done as a *race*,\
  \ without causing a *data race*.\n- Fetch-and-modify operations allow for a small\
  \ set of basic atomic modifications that are especially useful when multiple threads\
  \ are modifying the same atomic variable.\n- Atomic addition and subtraction silently\
  \ wrap around on overflow.\n\n\n\n\n- 比较并交换操作是最灵活、最通用的，并且是构建任何其他原子操作的基础构建块。\n- 一个\
  \ *弱* 的比较并交换操作可能略微更高效。\n"

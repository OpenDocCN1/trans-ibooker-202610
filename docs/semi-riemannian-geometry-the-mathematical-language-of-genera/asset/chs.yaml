  PDF 文件。图 19.5.1 是使用保罗·泰勒开发的 TeX 宏包 diagrams.sty 制作的。我非常感谢华盛顿大学的约翰·李教授审阅了部分手稿。当然，任何剩余的差错或不足之处均由我个人负责。


  我非常欢迎您的评论，可以通过电子邮件发送至 stephen.newman@ualberta.ca。更正列表将发布在网站 https://sites.ualberta.ca/~sn2/
  上。如果该电子邮件地址不可用，将在更正列表中提供替代地址。





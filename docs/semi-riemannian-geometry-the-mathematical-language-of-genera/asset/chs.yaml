  overline{M}) \\tag{19.12.1}$$\n\n以及\n\n$$\\nabla:\\mathfrak{X}(M)\\times\\mathfrak{X}(M)\\\
  longrightarrow\\mathfrak{X}(M),$$\n\n其中 $\\mathfrak{X}(\\overline{M})$ 是 $\\overline{M}$\
  \ 上光滑向量场的 $C^\\infty(\\overline{M})$-模，$\\mathfrak{X}(M)$ 是 $M$ 上光滑向量场的 $C^\\infty(M)$-模。回顾第15.1节，$\\\
  mathfrak{X}_{\\overline{M}}(M)$ 是沿 $M$ 的光滑向量场的 $C^\\infty(M)$-模，并且 $\\mathfrak{X}(M)$\
  \ 是 $\\mathfrak{X}_{\\overline{M}}(M)$ 的一个 $C^\\infty(M)$-子模。\n\n对于 $M$ 中每一点 $p$，由定义和(14.8.1)可知，$\\\
  overline{g}_p$ 在 $T_p(\\overline{M})$ 的子空间 $T_p(M)$ 上是非退化的。由定理4.1.3，\n\n$$T_p(\\\
  overline{M})=T_p(M)\\oplus T_p(M)^\\perp.$$\n\n为简洁起见，我们将投影映射 $\\mathcal{P}_{T_p(M)}$\
  \ 和 $\\mathcal{P}_{T_p(M)^\\perp}$ 分别记为 $\\tan_p$ 和 $\\operatorname{nor}_p$，即\n\n\

  \   (b) $\\epsilon M = \\langle G_q, G_q\\rangle$ 对所有 $q$ 在 $U$ 中成立。\n+   \n+  \
  \ (c) $G\\circ\\varphi^{-1}$ 是 $\\mathbb{R}^3_\\nu(\\varphi(U))$ 中的单位法向量场。\n\n**证明.**\
  \ (a), (c): 由定理 12.2.7，$(\\varphi(U),g|_{\\varphi(U)})$ 是 $\\mathbb{R}^3$ 中的正则曲面，所以\

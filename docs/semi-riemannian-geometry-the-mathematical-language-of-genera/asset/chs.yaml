  \n$$=\\sum_p\\left(\\sum_q g^{pq}\\mathcal A^{i_1\\ldots i_{n-1}\\,i_{n+1}}_{j_1\\\
  ldots j_{k-1}\\,p\\,q\\,j_{k+1}\\ldots j_{s-1}}\\right)$$\n\n$$=\\sum_{pq}g^{pq}\\\
  mathcal A^{i_1\\ldots i_{n-1}\\,i_{n+1}}_{j_1\\ldots j_{k-1}\\,p\\,q\\,j_{k+1}\\\
  ldots j_{s-1}},$$\n\n这给出了第一个等式。将指标 $(i_{n+1},\\ldots,i_{r+1})$ 重新标记为 $(i_n,\\ldots,i_r)$，并将\
  \ $(j_{k+1},\\ldots,j_{s-1})$ 重新标记为 $(j_k,\\ldots,j_{s-2})$，即得第二个等式。 ■\n\n我们观察到，在\
  \ (6.3.2) 中 $p$ 和 $q$ 分别位于 $\\mathcal A$ 的第 $k$ 和第 $l$ 个协变位置，而在 (6.3.3) 中 $p$ 和\
  \ $q$ 分别位于 $\\mathcal A$ 的第 $k$ 和第 $(k+1)$ 个协变位置。我们还注意到，(6.3.2) 的右边与 $n$ 无关。参见定理\
  \ 6.2.5 之后的相应评注。\n\n**示例 6.3.6.** 对于 $\\mathcal T^2_2(V)$ 中的张量 $\\mathcal A$，由示例\
  \ 6.2.3 我们有\n\n$$F_1^2(\\mathcal A)^{ij}_{pkl}=\\sum_q g_{pq}\\mathcal A^{iq}_{kl}.$$\n\
  \n将 $\\mathcal B=F_1^2(\\mathcal A)$（如上式所给出）代入 (6.3.1)，得到\n\n$$S_1^2\\circ F_1^2(\\\
  mathcal A)^{ij}_{kl}=\\sum_p g^{jp}F_1^2(\\mathcal A)^i_{pkl}=\\sum_p g^{jp}\\left(\\\
  sum_q g_{pq}\\mathcal A^{iq}_{kl}\\right)$$\n$$=\\sum_q\\left(\\sum_p g^{jp}g_{pq}\\\
  right)\\mathcal A^{iq}_{kl}=\\sum_q\\delta^j_q\\mathcal A^{iq}_{kl}=\\mathcal A^{ij}_{kl}.$$\n\
  \n因此，$S_1^2\\circ F_1^2(\\mathcal A)=\\mathcal A$。类似地，$F_1^2\\circ S_1^2(\\mathcal\
  \ A)=\\mathcal A$。由于 $\\mathcal A$ 是任意的，由定理 A.4 可知 $F_1^2$ 和 $S_1^2$ 互为逆映射，因而是线性同构。\
  \ ◇\n\n### 定理 6.3.7.\n\n若 $(V,\\mathfrak g)$ 是标量积空间，且 $1\\leq k\\leq r$、$1\\leq\
  \ l\\leq s$ 为整数，则 $F_l^k$ 和 $S_l^k$ 是互为逆的线性同构。\n\n**证明。** 该证明是示例 6.3.6 的细化。设 $\\\
  mathcal H$ 为 $V$ 的一组基，$\\mathcal A$ 和 $\\mathcal B$ 分别为 $\\mathcal T_s^r(V)$ 和 $\\\

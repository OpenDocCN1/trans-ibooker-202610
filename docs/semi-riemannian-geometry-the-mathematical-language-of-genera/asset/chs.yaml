  ，其中我们注意到 (−1)^ν 的存在。 当 ν = 0 时，上式简化为 (11.4.3)，此时，Grad(f)_p = grad(f)_p。\n\n## 定理\
  \ 12.2.10 (函数的水平集)。 在上述设定下，设 c 是 f(\U0001D4B0) 中的实数，且 M = f⁻¹(c)。 则：\n\n- (a) 若\
  \ Grad(f) 在 M 上处处非零，则 M 是正则曲面。\n- (b) 若 Grad(f) 满足 [V2]，则 (M,\U0001D524) 是 ℝ³_ν\
  \ 中的正则曲面且 Grad(f)/‖Grad(f)‖ 是 \U0001D51B_{ℝ³_ν}(M) 中的单位法向量场。\n\n注。 我们由定理 12.2.1(d)\
  \ 得到当 ν = 0 时，(a) 和 (b) 中的假设是等价的。\n\n证明。 为简便起见，设 V = Grad(f)。\n(a): 由于 V 在 M 上处处非零，故\
  \ grad(f) 也是。 根据定理 11.4.4，M 是正则曲面。\n(b): 设 p 是 M 中的一点，且 v 是 T_p(M) 中的向量。 根据定义，存在光滑曲线\
  \ λ = (λ¹,λ²,λ³) : (a,b) ⟶ M 使得 λ(t₀) = p 且 (dλ/dt)(t₀) = v 对某个 t₀∈(a,b)。 由于 f ∘\
  \ λ(t) = c 对所有 t∈(a,b)，根据定理 10.1.10，\n\n```\n0 = d/dt (f ∘ λ)(t₀) = Σ_i ∂f/∂x^i\

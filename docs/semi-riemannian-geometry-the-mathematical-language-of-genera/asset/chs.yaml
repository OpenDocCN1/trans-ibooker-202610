  \ δⁱ_j 的张量。因此，我们考虑 (1,1)-张量\n\nδ = ∑_{ij} δⁱ_j h_i ⊗ θ^j .\n\n(c) $(B \\circ A)^*\
  \ = A^* \\circ B^*.$\n\n证明。显而易见。\n\n## 5.3 张量的表示\n\n设 $V$ 为向量空间，设 $\\mathcal{H}\
  \ = (h_1, \\dots, h_m)$ 为 $V$ 的基，设 $(\\theta^1, \\dots, \\theta^m)$ 为其对偶基，设 $s \\\
  ge 1$ 为整数。沿用第 B.5 节和第 B.6 节，我们用 $\\mathrm{Mult}(V^s, V)$ 表示从 $V^s$ 到 $V$ 的 $\\mathbb{R}$-多线性映射的向量空间。令我们定义一个映射\n\
  \n$\\mathfrak{R}_s : \\mathrm{Mult}(V^s, V) \\longrightarrow \\mathcal{T}_s^1(V),$\n\

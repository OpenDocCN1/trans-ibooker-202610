  ## 定理 12.2.7 (开集)。 若 $(M,\\mathfrak{g})$ 是 ℝ³_ν 中的正则曲面且 $W$ 是 $M$ 中的开集，则 $(W,\\\
  mathfrak{g}|_W)$ 是 ℝ³_ν 中的正则曲面。 特别地，若 $(U,\\varphi)$ 是 $M$ 上的一个坐标图，则 $(\\varphi(U),\\\
  mathfrak{g}|_{\\varphi(U)})$ 是 ℝ³_ν 中的正则曲面。\n\n证明。 根据定理 11.4.1，$W$ 是正则曲面且 $T_p(W)\
  \ = T_p(M)$ 对所有 $p\\in W$ 成立。 可知 $(\\mathfrak{g}|_W)|_p$ 在 $T_p(W)$ 上非退化且 $\\operatorname{ind}(\\\

  ⟨V_p, V_p⟩ = 4⟨p, p⟩ = 4 q(p). (12.2.11)\n\n(b): 如 (12.2.6)–(12.2.8) 所评论的那样，每个 $p$\
  \ 在 $Q^2$ 中都是单位向量。则 (12.2.11) 给出\n\n||V_p|| = √|4⟨p, p⟩| = 2.\n\n结果现在由 (12.2.10)\
  \ 得出。\n\n(a), (c): 我们由 (12.2.6)–(12.2.8) 得到 $Q^2$ 是 $q$ 的水平集，且由 (12.2.11) 得到 $V$\
  \ 满足 [V2]。由定理 12.2.10(b) 和部分 (b) 可得 $Q^2$ 是 $\\mathbb{R}^3_\\nu$ 中的正则曲面且 $p$ 是 $p$\
  \ 处的单位法向量。\n\n(d): 第两列和第三列的条目直接来自 (12.2.9)。由 (12.2.3) 和部分 (c) 可得 $\\epsilon_{Q^2}\
  \ = \\langle p, p\\rangle$，所以第五列的条目由第三列的条目得出。利用 (12.2.4)，第四列的条目由第二列和第五列的条目得出 [见\
  \ (12.2.5)]。\n\n有趣的是观察到，根据定理 12.2.12 部分 (d) 中的表格，$H^2$ 的指标为 0。因此，对每个 $p$ 在 $H^2$\
  \ 中，切平面 $T_p(H^2)$ 是一个内积空间，尽管 $T_p(H^2)$ 是洛伦兹向量空间 $\\mathbb{R}^3_1$ 的子空间。\n\n##\
  \ 例 12.2.13（$\\mathcal{S}^2$）。\n\n在例 11.2.6 中以及再次在例 11.4.5 中已证明 $\\mathcal{S}^2$\
  \ 是一个正则曲面。由定理 12.2.12(a)，$\\mathcal{S}^2$ 是 $\\mathbb{R}^3_0$ 中的正则曲面。\n\n我们用一些后面会用到的定义来结束本节。设\

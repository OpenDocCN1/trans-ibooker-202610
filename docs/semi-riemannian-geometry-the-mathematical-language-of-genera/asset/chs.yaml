  \ 的任意 2 维子空间可由通过原点的一个平面 $\\Pi$ 表示。这恰好有三种可能性，如图 4.8.2 所示，其中虚线表示交点。$\\Pi_1$ 不与 $\\\
  Lambda_3$ 相交：它是类空的且只包含类空向量。$\\Pi_2$ 与 $\\Lambda_3$ 相交于一对直线（去掉原点）：它是类时的且包含类空、类时和类光向量。$\\\

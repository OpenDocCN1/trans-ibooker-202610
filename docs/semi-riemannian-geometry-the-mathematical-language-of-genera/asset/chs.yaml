  \ A^{i_1\\ldots\\widehat{i_n}\\ldots i_{r+1}}_{j_1\\ldots j_{k-1}\\,q\\,j_{k+1}\\\
  ldots j_{s-1}}$$\n\n$$=\\sum_{pq}g^{pq}\\mathcal A^{i_1\\ldots\\widehat{i_n}\\ldots\
  \ i_{r+1}}_{j_1\\ldots j_{k-1}\\,p\\,q\\,j_{k+1}\\ldots j_{s-1}}$$\n\n以及\n\n$$C_k^n\\\
  circ S_{k+1}^n(\\mathcal A)^{i_1\\ldots\\widehat{i_k}\\ldots i_{r+1}}_{j_1\\ldots\\\

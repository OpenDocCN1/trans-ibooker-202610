  mathcal{A}}\\) 为 \\(\\mathcal{T}_s^r(V)\\) 中的张量，定义为\n\\[\n\\widetilde{\\mathcal{A}}\
  \ = \\sum_{\\substack{1\\le i_1,\\dots,i_r\\le m \\\\ 1\\le j_1,\\dots,j_s\\le m}}\
  \ \\mathcal{A}^{i_1\\dots i_r}_{j_1\\dots j_s}\\, h_{i_1} \\otimes \\cdots \\otimes\

  ldots k_r}_{l_1\\ldots l_s}.\n\\]\n\n正如下一个结果所示，张量的乘积的分量由相应分量的乘积给出。\n\n## 定理 5.1.5（张量的乘积）。\n\
  \n设 \\(V\\) 为向量空间，设 \\(\\mathcal A\\) 和 \\(\\mathcal B\\) 分别为 \\(T^r_s(V)\\) 和 \\\
  (T^{r'}_{s'}(V)\\) 中的张量，设 \\(\\mathcal H=(h_1,\\ldots,h_m)\\) 为 \\(V\\) 的基，设 \\\
  ((\\theta^1,\\ldots,\\theta^m)\\) 为其对偶基。设 \\(A^{i_1\\ldots i_r}_{j_1\\ldots j_s}\\\
  ) 和 \\(B^{k_1\\ldots k_{r'}}_{l_1\\ldots l_{s'}}\\) 分别为 \\(\\mathcal A\\) 和 \\(\\\
  mathcal B\\) 关于 \\(\\mathcal H\\) 的分量，使得\n\n\\[\n\\mathcal A=\\sum_{\\substack{1\\\
  le i_1,\\ldots,i_r\\le m\\\\1\\le j_1,\\ldots,j_s\\le m}}A^{i_1\\ldots i_r}_{j_1\\\
  ldots j_s}h_{i_1}\\otimes\\cdots\\otimes h_{i_r}\\otimes\\theta^{j_1}\\otimes\\\
  cdots\\otimes\\theta^{j_s}\n\\]\n\n且\n\n\\[\n\\mathcal B=\\sum_{\\substack{1\\le\

  \ $\\Psi$、$V^*$ 中的余向量 $\\eta$ 以及 $V$ 中的向量 $v_1, \\dots, v_s$ 成立。当 $s = 1$ 时，我们记\n\
  \n$\\mathfrak{R}_1$ 为 $\\mathfrak{R}$。\n\n## 定理 5.3.1（张量的表示）。在上述设定下：\n\n+   (a)\

  $$\n\n对 \\(i=1,\\ldots,m\\)。\n\n**Proof.** 根据定义，\n\n$$\n\\operatorname{Grad}(f)\
  \ = \\sum_i \\operatorname{Grad}(f)^i \\frac{\\partial}{\\partial x^i}.\n$$\n\n\
  由 Theorem 20.3.1 可得\n\n$$\n\\frac{\\partial f}{\\partial x^j}\n= \\left\\langle\
  \ \\frac{\\partial}{\\partial x^j}, \\operatorname{Grad}(f) \\right\\rangle\n= \\\

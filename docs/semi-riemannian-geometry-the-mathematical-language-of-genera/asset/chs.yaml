  psi(s)(\\exp_p)\\left(\\frac{d\\psi}{ds}(s)\\right)\\right\\rangle \\\\ &= r(s)\\\
  left\\langle \\psi(s),\\frac{d\\psi}{ds}(s)\\right\\rangle. \\end{aligned} \\tag{21.1.6}$$\n\
  \n其中第一个等式由 $d_{r(s)}\\psi(s)(\\exp_p)$ 的线性性推出，第二个等式由定理 19.7.5 推出。我们由 (21.1.3) 得到\n\

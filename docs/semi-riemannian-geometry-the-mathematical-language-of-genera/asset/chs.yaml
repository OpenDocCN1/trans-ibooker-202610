  \n\\[\n\\mathfrak{R}_s(\\Psi)(\\omega,X_1,\\ldots,X_s)=\\omega(\\Psi(X_1,\\ldots,X_s))\
  \ \\tag{19.5.1}\n\\]\n\n对所有 \\(\\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^s,\\\
  mathfrak{X}(M))\\) 中的映射 \\(\\Psi\\)，所有 \\(\\mathfrak{X}^*(M)\\) 中的余向量场 \\(\\omega\\\
  )，以及所有 \\(\\mathfrak{X}(M)\\) 中的向量场 \\(X_1,\\ldots,X_s\\) 成立。我们注意到 \\(\\mathfrak{R}_s\\\
  ) 是由 (5.3.1) 定义的映射的光滑流形对应物。当 \\(s=1\\) 时，我们记\n\n\\[\n\\mathfrak{R}_1\\quad\\text{为}\\\
  quad\\mathfrak{R}\n\\]\n\n并得到\n\n\\[\n\\mathfrak{R}:\\operatorname{Lin}_{C^\\infty(M)}(\\\
  mathfrak{X}(M),\\mathfrak{X}(M))\\longrightarrow\\operatorname{Mult}_{C^\\infty(M)}(\\\
  mathfrak{X}^*(M)\\times\\mathfrak{X}(M),C^\\infty(M)).\n\\]\n\n则\n\n\\[\n\\mathfrak{R}(\\\
  Psi)(\\omega,X)=\\omega(\\Psi(X)) \\tag{19.5.2}\n\\]\n\n对所有 \\(\\operatorname{Lin}_{C^\\\
  infty(M)}(\\mathfrak{X}(M),\\mathfrak{X}(M))\\) 中的映射 \\(\\Psi\\)，所有 \\(\\mathfrak{X}^*(M)\\\
  ) 中的余向量场 \\(\\omega\\)，以及所有 \\(\\mathfrak{X}(M)\\) 中的向量场 \\(X\\) 成立。\n\n**定理 19.5.2.**\
  \ 若 \\((M,g)\\) 是半黎曼流形，则 \\(\\mathfrak{R}_s\\) 是 \\(C^\\infty(M)\\)-模同构：\n\n\\[\n\
  \\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^s,\\mathfrak{X}(M))\\cong \\\
  operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}^*(M)\\times\\mathfrak{X}(M)^s,C^\\\
  infty(M)).\n\\]\n\n**证明.** 回顾第 15.7 节中定义的刻画映射 \\(\\mathcal{C}_s^r\\)。让我们定义“尖锐”映射\n\
  \n\\[\n\\mathfrak{P}_1^1:\\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^{s+1},C^\\\
  infty(M))\\longrightarrow \\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}^*(M)\\\
  times\\mathfrak{X}(M)^s,C^\\infty(M))\n\\]\n\n为\n\n\\[\n\\mathfrak{P}_1^1=\\mathcal{C}_s^1\\\
  circ S_1^1\\circ(\\mathcal{C}_{s+1}^0)^{-1}. \\tag{19.5.3}\n\\]\n\n由定理 15.7.2 和定理\
  \ 19.4.3，我们知道 \\(\\mathcal{C}_s^1\\)、\\(\\mathcal{C}_{s+1}^0\\) 和 \\(S_1^1\\) 是\
  \ \\(C^\\infty(M)\\)-模同构，因此 \\(\\mathfrak{P}_1^1\\) 也是。\n\n我们断言\n\n\\[\n\\mathfrak{R}_s=\\\
  mathfrak{P}_1^1\\circ\\mathcal{C}_s, \\tag{19.5.4}\n\\]\n\n这是定理 6.4.1(d) 的流形版本。一旦证明了这一点，结果可由定理\
  \ 19.5.1 得出。设 \\(\\Upsilon\\) 是 \\(\\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^{s+1},C^\\\
  infty(M))\\) 中的映射。利用定理 15.7.2 中固有的等同，可以证明\n\n\\[\n\\mathfrak{P}_1^1(\\Upsilon)(\\\
  omega,X_1,\\ldots,X_s)=\\Upsilon(\\omega^\\sharp,X_1,\\ldots,X_s)\n\\]\n\n对所有 \\\
  (\\mathfrak{X}^*(M)\\) 中的余向量场 \\(\\omega\\) 和所有 \\(\\mathfrak{X}(M)\\) 中的向量场 \\\
  (X_1,\\ldots,X_s\\) 成立。对于 \\(\\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^s,\\\

  (\\Psi,\\omega\\) 和 \\(X_1,\\ldots,X_s\\) 是任意的，这证明了该断言。◻\n\n**定理 19.5.3.** 在上述设定下，图\
  \ 19.5.1 是 \\(C^\\infty(M)\\)-模同构的交换图。也就是说，任意两个 \\(C^\\infty(M)\\)-模都可通过取中间各 \\\
  (C^\\infty(M)\\)-模同构的复合而构成的 \\(C^\\infty(M)\\)-模同构相连。\n\n**证明.** 由 (19.5.3) 和 (19.5.4)\
  \ 可得\n\n\\[\n\\mathfrak{R}_s=\\mathcal{C}_s^1\\circ S_1^1\\circ(\\mathcal{C}_{s+1}^0)^{-1}\\\
  circ\\mathcal{C}_s.\n\\]\n◻\n\n**定理 19.5.4（协变张量场的表示）。** 若 \\((M,g)\\) 是半黎曼流形，则\n\
  \n\\[\n\\mathcal{T}^0_{s+1}(M)\\cong\\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^s,\\\
  mathfrak{X}(M))\\cong\\mathcal{T}^1_s(M).\n\\]\n\n**证明.** 这是定理 6.4.2 的流形版本，可由定理\
  \ 19.5.3 得出。◻\n\n\n\n\n\n![](img/d712710a8eb78c0959204afd5dde4c91_547_0.png)\n\n\
  **Figure 19.5.1.** Commutative diagram for Theorem 19.5.3\n\n本节以及我们在“表示”领域先前所做的许多工作，最终都是为了得到以下结果。它为使用“张量”一词来指代挠率张量和曲率张量提供了期待已久的\
  \ justification。\n\n**Theorem 19.5.5 (Representation of $T$ and $R$).** Let $(M,g)$\
  \ be a semi-Riemannian manifold, and let $T$ and $R$ be the torsion tensor and curvature\

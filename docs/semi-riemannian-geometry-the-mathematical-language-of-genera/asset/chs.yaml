  le m}}A^{i_1\\ldots i_r}_{j_1\\ldots j_s}B^{k_1\\ldots k_{r'}}_{l_1\\ldots l_{s'}}h_{i_1}\\\
  otimes\\cdots\\otimes h_{i_r}\\otimes h_{k_1}\\otimes\\cdots\\otimes h_{k_{r'}}\\\
  otimes\\theta^{j_1}\\otimes\\cdots\\otimes\\theta^{j_s}\\otimes\\theta^{l_1}\\otimes\\\
  cdots\\otimes\\theta^{l_{s'}}.\n\\]\n\n证明。由定理 5.1.2 可知\n\n\U0001D49C ⊗ ℬ = ∑_{1\
  \ ≤ i₁,...,i_r,k₁,...,k_{r'} ≤ m \n1 ≤ j₁,...,j_s,l₁,...,l_{s'} ≤ m} \U0001D49C\
  ^{i₁...i_r}_{j₁...j_s} ℬ^{k₁...k_{r'}}_{l₁...l_{s'}} (h_{i₁} ⊗ ⋯ ⊗ h_{i_r} ⊗ θ^{j₁}\
  \ ⊗ ⋯ ⊗ θ^{j_s}) ⊗ (h_{k₁} ⊗ ⋯ ⊗ h_{k_{r'}} ⊗ θ^{l₁} ⊗ ⋯ ⊗ θ^{l_{s'}}).\n\n我们需要验证\n\
  \n(h_{i₁} ⊗ ⋯ ⊗ h_{i_r} ⊗ θ^{j₁} ⊗ ⋯ ⊗ θ^{j_s}) ⊗ (h_{k₁} ⊗ ⋯ ⊗ h_{k_{r'}} ⊗ θ^{l₁}\
  \ ⊗ ⋯ ⊗ θ^{l_{s'}}) = (h_{i₁} ⊗ ⋯ ⊗ h_{i_r} ⊗ h_{k₁} ⊗ ⋯ ⊗ h_{k_{r'}}) ⊗ (θ^{j₁}\
  \ ⊗ ⋯ ⊗ θ^{j_s} ⊗ θ^{l₁} ⊗ ⋯ ⊗ θ^{l_{s'}}).\n\n设 η¹,...,η^{r+r'} 为 \\(V^*\\) 中的余向量，设\
  \ v₁,...,v_{s+s'} 为 \\(V\\) 中的向量。我们由 (5.1.4) 知，将上述表达式的左端作用于 (η¹,...,η^{r+r'}, v₁,...,v_{s+s'})\

- '## 第三部分


  ## 光滑流形和

  半黎曼流形


  在第二部分中，我们涵盖了曲线和曲面的诸多主题。尽管数学有时具有抽象性，但由于我们处理的是位于三维空间中的一维和二维几何对象，使得这一工作相对具体。第二部分中对维度的限制反映了曲线和曲面研究的经典性质。只需付出相对较少的努力，就有可能将结果推广到
  m 维空间中 m−1 维的“曲面”。然而，这并不能解决这种方法的一个重要固有局限——需要一个环境空间。也许半黎曼几何最重要的应用，也是历史上推动这一数学领域发展的动机之一，是爱因斯坦的广义相对论。根据这一宇宙学构造，我们所居住的宇宙恰好有四个维度；我们的宇宙并不存在于一个五维环境空间中。当然，数学上可以构造一个，但那不会反映物理现实。为了建模广义相对论，我们需要一种“曲面”的数学描述，它完全摆脱了环境空间。


  让我们考虑 R³ 在我们对曲面的讨论中出现（以及未出现）的地方，以期看是否可以规避环境空间的作用。回想一下，最初曲面被定义为一个拓扑空间，这并不依赖于环境空间。然而，在此之后我们很快就会遇到障碍。任何依赖于切向量的概念，尤其是法向量，似乎都与环境空间不可分割。我们把
  Christoffel 符号、协变导数甚至高斯曲率视为“内在”量，但它们的初始表述依赖于环境空间。看起来作为第一步，我们需要找到一种在不诉诸这种外部性的情况下定义“切向量”的方法。一旦完成，我们就可以继续讨论“切空间”、“微分映射”以及微分几何的其他基本概念。这就是第
  14–17 章的目标。


  R³ 的一个“问题”在于其数学结构的丰富性。如前所述，R³ 可以被视为内积空间、洛伦兹向量空间、拓扑空间、度量空间等等。在我们对曲线和曲面的研究中，这迫使我们在讨论的每个阶段澄清对
  R³ 的假设。我们即将开始发展一种基于我们对曲线和曲面所知、但在许多方面是全新的数学理论。这给了我们一个机会，在每个环节只假设本质的东西，这种方法极具启发性。因此，我们推迟到第
  18 章才引入“联络”的概念，而“度量”的概念则推迟到第 19 和 20 章。第 21 章使用我们可用的新语言呈现了向量分析的一些经典结果，第 22 章以与狭义相对论和广义相对论密切相关的物理学领域的应用作为结尾。


  rho_{p,v}).$$\n\n对定理 21.1.1 的一个观察是，在几何上，(21.1.8) 表明纬度曲线 σ_r 与经度曲线 σ_s 沿径向测地线 σ_s\
  \ 正交相交，这在某些情况下，如球面， intuitively 清楚。\n\n## 21.2 经典向量分析定理\n\n第 10.6 节给出了微分向量分析的若干经典定理。在本书的各处，我们遇到了它们的现代对应物，如下表所概括：\n\
  \n| 经典 | 现代 |\n|---|---|\n| 定理 10.6.1(a) | 定理 20.3.3 |\n| 定理 10.6.1(b) | 定理 20.4.4\

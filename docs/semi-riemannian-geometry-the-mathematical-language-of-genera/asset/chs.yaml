  (f\\) 的**梯度**。\n\n### Theorem 20.3.1\n\n设 \\((M,\\mathfrak{g})\\) 为半黎曼流形，\\(X\\\
  ) 为 \\(\\mathfrak{X}(M)\\) 中的向量场，\\(f\\) 为 \\(C^\\infty(M)\\) 中的函数。则：\n\n$$\n\\\
  langle \\operatorname{Grad}(f), X \\rangle = d(f)(X) = X(f).\n$$\n\n**Proof.** 我们有\n\

  \ \\operatorname{Grad}(f)^k,\n$$\n\n故\n\n$$\n\\sum_j \\mathfrak{g}^{ij} \\frac{\\\
  partial f}{\\partial x^j}\n= \\sum_j \\mathfrak{g}^{ij} \\left( \\sum_k \\mathfrak{g}_{jk}\

  \ = φ(U) ∩ \U0001D4B0，\n\n所以 F 与 F|φ(U) 在 M ∩ (\U0001D4B0 ∩ \U0001D4B1) 上一致，其中我们注意到\
  \ \U0001D4B0 ∩ \U0001D4B1 在 ℝ³ 中是开的。由于 p 是任意的，结论成立。\n\n# 定理 11.6.2. 设 M、N 和 P 是正则曲面，F\
  \ : M ⟶ N 和 G : N ⟶ P 是映射。若 F 和 G 是（广义）光滑的，则 G ∘ F 也是（广义）光滑的。\n\n证明。设 p 是 M 中的一点。由定理\
  \ 11.6.1，在 M 上 p 处有一个坐标卡 (U, φ)，在 N 上 F(p) 处有一个坐标卡 (V₁, ψ₁)，使得 ψ₁⁻¹ ∘ F ∘ φ 是（欧几里得）光滑的。同理，在\
  \ N 上 F(p) 处有一个坐标卡 (V₂, ψ₂)，在 G(F(p)) 处有一个坐标卡 (W, μ)，使得 μ⁻¹ ∘ G ∘ ψ₂ 是（欧几里得）光滑的。由定理\
  \ 11.2.9，ψ₂⁻¹ ∘ ψ₁ 是（欧几里得）光滑的。由定理 10.1.12 可知，\n\nμ⁻¹ ∘ (G ∘ F) ∘ φ = (μ⁻¹ ∘ G ∘\
  \ ψ₂) ∘ (ψ₂⁻¹ ∘ ψ₁) ∘ (ψ₁⁻¹ ∘ F ∘ φ)\n\n是（欧几里得）光滑的。由于 p 是任意的，结论由定理 11.6.1 得出。\n\n\
  设 M 和 N 是正则曲面，F : M ⟶ N 是一个光滑映射，p 是 M 中的一点。F 在 p 处的微分是映射\n\ndₚ(F) : Tₚ(M) ⟶ T_F(p)(N)\n\
  \n定义为\n\ndₚ(F)(v) = d(F ∘ λ)/dt (t₀)   (11.6.1)\n\n对于 Tₚ(M) 中的所有向量 v，其中 λ(t) : (a,\
  \ b) ⟶ M 是任意光滑曲线，使得对某个 t₀ ∈ (a, b) 有 λ(t₀) = p 且 (dλ/dt)(t₀) = v。见图 11.6.1。\n\n\
  # 定理 11.6.3. 在上述设定下：\n\n+   (a) dₚ(F)(v) 与用于表示 v 的光滑曲线的选取无关。\n+   (b) dₚ(F) 是线性的。\n\
  \n证明。该证明与定理 11.5.2 的证明类似。设 (U, φ) 是 M 在 p 处的坐标卡，设 (V, ψ) 是 N 在 F(p) 处的坐标卡，并设 λ(t)\
  \ : (a, b) ⟶ M 是一条光滑曲线，使得对某个 t₀ ∈ (a, b) 有 λ(t₀) = p 且 (dλ/dt)(t₀) = v。不失一般性，假设\
  \ λ((a, b)) ⊂ φ(U)，并令 q = φ(p)。由定理 10.1.17 和定理 11.2.8 可知，映射\n\nμ = (μ¹, μ²) = φ⁻¹\
  \ ∘ λ : (a, b) ⟶ U\n\n是（欧几里得）光滑的，并且由定理 10.1.9 可知\n\nv = dλ/dt (t₀) = d(φ ∘ μ)/dt\

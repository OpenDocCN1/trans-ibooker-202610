  \ 第二行的 5 元组 $(4,5,1,3,2)$。我们寻求一系列对换将 $(4,5,1,3,2)$ 重排为 $(1,2,3,4,5)$。根据前述的说明，它们的乘积（按正确顺序）给出\
  \ $\\sigma^{-1}$ 的轮换分解。在一个明显的记号下，我们有\n\n```\n$(1\\ 5)(4,5,1,3,2)=(4,1,5,3,2)$, 然后\
  \  \n$(3\\ 5)(4,1,5,3,2)=(4,1,3,5,2)$, 然后  \n$(2\\ 5)(4,1,3,5,2)=(4,1,3,2,5)$, 然后\
  \  \n$(4\\ 1)(4,1,3,2,5)=(1,4,3,2,5)$, 然后  \n$(3\\ 4)(1,4,3,2,5)=(1,3,4,2,5)$, 然后\
  \  \n$(2\\ 4)(1,3,4,2,5)=(1,3,2,4,5)$, 然后  \n$(2\\ 3)(1,3,2,4,5)=(1,2,3,4,5)$.\n\
  ```\n\n收集对换在一起得到\n\n$(2\\ 3)(2\\ 4)(3\\ 4)(4\\ 1)(2\\ 5)(3\\ 5)(1\\ 5)=(1\\ 3\\\
  \ 4)(2\\ 5)=\\sigma^{-1}$。\n\n设 $x_1,\\ldots,x_m$ 为不定元，并考虑多项式\n\n```\n$$\\Delta=\\\
  prod_{1\\le i<j\\le m}(x_i-x_j).$$\n```\n\n对每个 $\\sigma\\in S_m$，令\n\n```\n$$\\\
  sigma(\\Delta)=\\prod_{1\\le i<j\\le m}(x_{\\sigma(i)}-x_{\\sigma(j)}).$$\n```\n\
  \n$\\sigma$ 的 **符号** 定义为\n\n```\n$$\\operatorname{sgn}(\\sigma)=\\frac{\\sigma(\\\
  Delta)}{\\Delta}=\\prod_{1\\le i<j\\le m}\\frac{x_{\\sigma(i)}-x_{\\sigma(j)}}{x_i-x_j}.$$\n\
  ```\n\n显然，$\\operatorname{sgn}(\\sigma)$ 等于 $1$ 或 $-1$。\n\n### **定理 B.2.2.** 如果\
  \ $\\sigma,\\rho$ 是 $S_m$ 中的置换，则：\n\n- (a) $\\operatorname{sgn}(\\sigma\\rho)=\\\
  operatorname{sgn}(\\sigma)\\operatorname{sgn}(\\rho)$。  \n- (b) $\\operatorname{sgn}(\\\
  sigma)=\\operatorname{sgn}(\\sigma^{-1})$。  \n- (c) $\\operatorname{sgn}(\\sigma\\\
  rho\\sigma^{-1})=\\operatorname{sgn}(\\rho)$。\n\n*证明.* (a): 由于 $\\rho(\\Delta)=\\\
  pm\\Delta$，我们有\n\n```\n$$\\frac{(\\sigma\\rho)(\\Delta)}{\\rho(\\Delta)}=\\frac{\\\
  sigma(\\rho(\\Delta))}{\\rho(\\Delta)}=\\frac{\\sigma(\\pm\\Delta)}{\\pm\\Delta}=\\\
  frac{\\pm\\sigma(\\Delta)}{\\pm\\Delta}=\\frac{\\sigma(\\Delta)}{\\Delta}=\\operatorname{sgn}(\\\
  sigma),$$\n```\n\n故\n\n```\n$$\\operatorname{sgn}(\\sigma\\rho)=\\frac{(\\sigma\\\
  rho)(\\Delta)}{\\Delta}=\\frac{(\\sigma\\rho)(\\Delta)}{\\rho(\\Delta)}\\frac{\\\
  rho(\\Delta)}{\\Delta}=\\operatorname{sgn}(\\sigma)\\operatorname{sgn}(\\rho).$$\n\
  ```\n\n\n\n\n\n证明. 我们使用例B.2.1中说明的算法，基于将\\((m-k+1,\\ldots,m;\\;1,\\ldots,m-k)\\)置换为\\\
  ((1,\\ldots,k;\\;k+1,\\ldots,m)\\)所需的换位次数来计算\\(\\operatorname{sgn}(\\sigma)\\)。要将\\\

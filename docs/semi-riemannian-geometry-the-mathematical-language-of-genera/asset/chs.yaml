  flat(X) \\qquad [(19.4.1)] \\\\\n&= d(f)(X) \\qquad [(20.3.2)] \\\\\n&= X(f). \\\
  qquad [\\mathrm{Th}\\ 15.4.5(b)]\n\\end{aligned}\n$$\n\n### Theorem 20.3.2 (Local\
  \ Coordinate Expression for Gradient)\n\n若 \\((M,\\mathfrak{g})\\) 为半黎曼 \\(m\\)-流形且\

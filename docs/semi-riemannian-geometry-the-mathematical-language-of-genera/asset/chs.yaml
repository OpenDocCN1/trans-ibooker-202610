  mathcal A)$ 是 $\\mathcal T_{s+1}^{r-1}(V)$ 中的张量，其关于 $\\mathcal H$ 的分量为\n\n$$F_l^k(\\\
  mathcal A)^{i_1\\ldots i_{k-1}i_k}_{j_1\\ldots j_{s+1}}=\\sum_q g_{j_1q}\\mathcal\
  \ A^{i_1\\ldots i_{k-1}q i_{k+1}\\ldots i_r}_{j_2\\ldots j_{s+1}}$$\n\n将指标 $(i_k,\\\
  ldots,i_{r-1})$ 重新标记为 $(i_{k+1},\\ldots,i_r)$，并将 $(j_1,\\ldots,j_{s+1})$ 重新标记为 $(p,j_1,\\\
  ldots,j_s)$，得到\n\n$$F_l^k(\\mathcal A)^{i_1\\ldots i_k\\ldots i_r}_{j_1\\ldots j_{l-1}p\

  langle v,w\\rangle=0$ 对所有 $w$ 在 $U$ 中蕴含 $v=0$\n$\\Leftrightarrow\\quad v$ 在 $U$\
  \ 中，且 $v$ 在 $U^\\perp$ 中蕴含 $v=0$\n$\\Leftrightarrow\\quad U\\cap U^\\perp=\\{0\\\
  }$。\n\n(b) $\\Rightarrow$ (c): 由\n\n$\\dim(V)=\\dim(U)+\\dim(U^\\perp) \\qquad\\\
  text{[Th 4.1.2(b)]}$\n$\\qquad=\\dim(U+U^\\perp)+\\dim(U\\cap U^\\perp) \\qquad\\\
  text{[Th 1.1.15]}$\n\n以及 $U\\cap U^\\perp=\\{0\\}$ 可得 $\\dim(V)=\\dim(U+U^\\perp)$，然后由定理\
  \ 1.1.7(b) 得 $V=U+U^\\perp$。由定理 1.1.7，$U+U^\\perp=U\\oplus U^\\perp$，故 $V=U\\oplus\
  \ U^\\perp$。\n\n(c) $\\Rightarrow$ (b): 这由定理 1.1.7 得出。\n(c) $\\Leftrightarrow$ (d):\
  \ 这由 (a) $\\Leftrightarrow$ (c) 和定理 4.1.2(c) 得出。\n\n继续使用定理 4.1.3 的记号，设 $\\mathfrak{g}$\
  \ 在 $U$ 上非退化，此时 $V=U\\oplus U^\\perp$。仅在此设定下，我们称 $U^\\perp$（先前称为关于 $\\mathfrak{g}$\
  \ 在 $V$ 中 $U$ 的 perp）为 $U$ 的**正交补（在 $V$ 中关于 $\\mathfrak{g}$）**。由定理 4.1.2(c) 可知 $U$\
  \ 是 $U^\\perp$ 在 $V$ 中关于 $\\mathfrak{g}$ 的正交补。因此，$U$ 与 $U^\\perp$ 在 $V$ 中关于 $\\\
  mathfrak{g}$ 互为正交补。为了说明，设 $v\\ne0$。易证 $\\mathbb{R}^{m-\\nu}\\times\\{0\\}^{\\nu}$\
  \ 和 $\\{0\\}^{m-\\nu}\\times\\mathbb{R}^{\\nu}$ 是 $\\mathbb{R}^m$ 在 $\\mathfrak{g}$\
  \ 关于 $\\mathfrak{g}$ 的正交补。于是定理 4.1.3 给出\n\n$\\mathbb{R}^m_\\nu=(\\mathbb{R}^{m-\\\
  nu}\\times\\{0\\}^{\\nu})\\oplus(\\{0\\}^{m-\\nu}\\times\\mathbb{R}^{\\nu}).$ \\\
  tag{4.1.2}\n\n在做明显的识别并稍作滥用记号后，这可以简洁地表示为 $\\mathbb{R}^m_\\nu=\\mathbb{R}^{m-\\nu}\\\
  oplus\\mathbb{R}^{\\nu}$。\n\n## 定理 4.1.4.\n\n若 $(V,\\mathfrak{g})$ 是一个数量积空间且 $U$\
  \ 是 $\\mathfrak{g}$ 在其上非退化的 $V$ 的子空间，则 $V$ 中每个向量 $v$ 都能唯一地表示为\n\n$v=P_U(v)+P_{U^\\\
  perp}(v)$,\n\n其中 $P_U(v)$ 是 $U$ 中的向量且 $P_{U^\\perp}(v)$ 是 $U^\\perp$ 中的向量。\n\n**证明.**\
  \ 这由定理 4.1.3 得出。\n\n在定理 4.1.4 的记号中，**正交投影**到 $U$ 上是线性映射\n\n$$\\mathcal{P}_U: V \\\
  longrightarrow U$$\n\n由赋值\n\n$$v \\longmapsto \\mathcal{P}_U(v)$$\n\n定义。\n\n更一般地，对于\
  \ $V$ 的子集 $S$，令我们定义\n\n$$\\mathcal{P}_U(S)=\\{\\mathcal{P}_U(s):s\\in S\\}.$$\n\n\
  当 $S$ 由单个向量组成时，例如 $v$，我们记\n\n$$\\mathcal{P}_U(\\{v\\}) \\quad \\text{为} \\quad \\\
  mathcal{P}_U(v).$$\n\n## 定理 4.1.5.\n\n若 $(V,\\mathfrak{g})$ 是一个数量积空间且 $v,w$ 是 $V$\
  \ 中的向量使得 $\\langle v,v\\rangle\\neq 0$，则\n\n$$\\mathcal{P}_{\\mathbb{R}v}(w)=\\\
  frac{\\langle v,w\\rangle}{\\langle v,v\\rangle}v.$$\n\n*证明.* 由于 $\\langle v,v\\\
  rangle\\neq 0$，$\\mathfrak{g}$ 在 $\\mathbb{R}v$ 上非退化，所以定理 4.1.4 适用。于是 $\\mathcal{P}_{\\\
  mathbb{R}v}(w)=cv$ 且 $w=cv+\\mathcal{P}_{(\\mathbb{R}v)^\\perp}(w)$ 对某个实数 $c$ 成立。则\n\
  \n$$\\langle v,w\\rangle=\\langle v,cv+\\mathcal{P}_{(\\mathbb{R}v)^\\perp}(w)\\\
  rangle=c\\langle v,v\\rangle,$$\n\n所以 $c=\\langle v,w\\rangle/\\langle v,v\\rangle$。\n\
  \n与 (4.1.2) 相关的观察是 $\\mathfrak{g}$ 在 $\\mathbb{R}^{m-\\nu}\\times\\{0\\}^{\\nu}$\
  \ 上正定，在 $\\{0\\}^{m-\\nu}\\times\\mathbb{R}^{\\nu}$ 上负定。下一个结果表明这是更一般现象的一个特例。\n\n\
  ## 定理 4.1.6 (Sylvester 的惯性定律)。\n\n若 $(V,\\mathfrak{g})$ 是一个数量积空间，则：\n- (a) 存在 $V$\
  \ 的子空间 $V^+$ 和 $V^-$ 使得 $V=V^+\\oplus V^-$，且 $\\mathfrak{g}$ 在 $V^+$ 上正定，在 $V^-$\
  \ 上负定。\n- (b) 维数 $\\dim(V^+)$ 和 $\\dim(V^-)$ 由 $\\mathfrak{g}$ 唯一确定，意义如下：若 $W^+$\
  \ 和 $W^-$ 是 $V$ 的子空间使得 $V=W^+\\oplus W^-$，且 $\\mathfrak{g}$ 在 $W^+$ 上正定，在 $W^-$\
  \ 上负定，则 $\\dim(V^+)=\\dim(W^+)$ 且 $\\dim(V^-)=\\dim(W^-)$。\n\n*证明.* (a): 若 $\\mathfrak{g}=0$，结果是平凡的，故假设并非如此。由定理\
  \ 3.2.4(b)，存在 $V$ 中非零向量 $v$ 使得要么 $\\langle v,v\\rangle>0$ 要么 $\\langle v,v\\rangle<0$。设\
  \ $\\langle v,v\\rangle>0$；当 $\\langle v,v\\rangle<0$ 时的论证类似。则 $\\mathbb{R}v$ 是\
  \ $V$ 的非零子空间，且 $\\mathfrak{g}$ 在其上正定。设 $V^+$ 是 $V$ 的（不一定唯一的）子空间，其维数在 $\\mathfrak{g}$\
  \ 正定的子空间中最大，且设 $V^-=(V^+)^\\perp$。则 $\\mathfrak{g}$ 在 $V^+$ 上非退化，所以定理 4.1.3 给出\n\
  \n$$V=V^+\\oplus V^- \\tag{4.1.3}$$\n\n且\n\n$$V^+ \\cap V^- = \\{0\\}. \\tag{4.1.4}$$\
  \ \n\n我们断言 g 在 $V^-$ 上负半定。设为反证，设 $V^-$ 中存在非零向量 $v^-$ 使得 $\\langle v^-, v^-\\rangle\
  \ > 0$，并考虑 $V$ 的子空间 $V^+ + \\mathbb{R}v^-$。由于 $\\mathbb{R}v^- \\subseteq V^-$，由\
  \ (4.1.3) 可得\n\n$$V^+ + \\mathbb{R}v^- = V^+ \\oplus \\mathbb{R}v^- . \\tag{4.1.5}$$\
  \ \n\n设 $v^+ + a v^-$ 是 $V^+ + \\mathbb{R}v^-$ 中的向量。则\n\n$$\\langle v^+ + a v^-,\
  \ v^+ + a v^-\\rangle = \\langle v^+, v^+\\rangle + a^2\\langle v^-, v^-\\rangle\
  \ \\ge 0,$$\n\n且\n\n$$\\begin{aligned}\n\\langle v^+ + a v^-, v^+ + a v^-\\rangle\
  \ &= 0 \\\\\n\\Leftrightarrow \\quad \\langle v^+, v^+\\rangle &= 0 \\text{ 且 }\
  \ a^2\\langle v^-, v^-\\rangle = 0 \\\\\n\\Leftrightarrow \\quad v^+ &= 0 \\text{\
  \ 且 } a = 0 \\\\\n\\Leftrightarrow \\quad v^+ + a v^- &= 0.\n\\end{aligned}\\tag{[4.1.5]}$$\
  \ \n\n这表明 g 在 $V^+ + \\mathbb{R}v^-$ 上正定。由 $V^+$ 的极大性可得 $V^+ + \\mathbb{R}v^- =\
  \ V^+$，所以 $v^-$ 在 $V^+$ 中，这与 (4.1.4) 矛盾。这证明了断言。\n\n我们现在断言 g 在 $V^-$ 上负定。设 $w^-$\
  \ 是 $V^-$ 中的向量使得 $\\langle w^-, w^-\\rangle = 0$。由于 g 在 $V^-$ 上负半定，定理 3.2.6 适用。于是\
  \ $\\langle w^-, v^-\\rangle^2 \\le \\langle w^-, w^-\\rangle\\langle v^-, v^-\\\
  rangle = 0$ 对 $V^-$ 中所有向量 $v^-$ 成立，故 $\\langle w^-, v^-\\rangle = 0$ 对 $V^-$ 中所有向量\
  \ $v^-$ 成立。由于 $w^-$ 在 $V^- = (V^+)^\\perp$ 中，$\\langle w^-, v^+\\rangle = 0$ 对 $V^+$\
  \ 中所有向量 $v^+$ 成立。由 (4.1.3) 可知 $V = V^+ + V^-$，所以 $\\langle w^-, v\\rangle = 0$ 对\
  \ $V$ 中所有向量 $v$ 成立。由于 g 非退化，$w^- = 0$。于是 g 在 $V^-$ 上负定。这证明了断言。\n\n(b): 设 $V^+ \\\
  cap W^-$ 中存在非零向量 $v$。由假设，g 在 $V^+$ 上正定，所以 $\\langle v, v\\rangle > 0$。也由假设，g 在 $W^-$\
  \ 上负定，故 $\\langle v, v\\rangle < 0$，矛盾。因此，$V^+ \\cap W^- = \\{0\\}$。由定理 1.1.17 可得\
  \ $V^+ + W^- = V^+ \\oplus W^-$，然后由定理 1.1.18 可得\n\n$$\\dim(V^+) + \\dim(W^-) = \\\
  dim(V^+ + W^-) \\le \\dim(V).$$\n\n由定理 1.1.18 和 (4.1.3)，\n\n$$\\dim(V^+) + \\dim(V^-)\
  \ = \\dim(V).$$\n\n由此可得 $\\dim(W^-) \\le \\dim(V^-)$。类似地，由于 g 在 $W^+$ 上正定且在 $V^-$\
  \ 上负定，我们有 $\\dim(V^-) \\le \\dim(W^-)$。于是 $\\dim(V^-) = \\dim(W^-)$。相应的论证表明 $\\\
  dim(V^+) = \\dim(W^+)$。\n\n\n\n\n\n## 4.2 正交基\n\n设 $(V,\\mathfrak{g})$ 为维数为 $m$\
  \ 的数量积空间，$v, w$ 为 $V$ 中的向量。回顾第 3.1 节，若 $\\langle v, w\\rangle = 0$ 则称 $v$ 与 $w$\
  \ 正交。由于 $\\mathfrak{g}$ 是对称的，$v$ 与 $w$ 正交当且仅当 $w$ 与 $v$ 正交。对于整数 $k \\ge 2$，$V$ 中\
  \ $k$ 个不同的非零向量 $(v_1,\\dots,v_k)$ 被称为正交 $k$-元组，如果当 $i \\ne j = 1,\\dots,k$ 时 $v_i$\
  \ 与 $v_j$ 正交。这允许 $v_i$ 与自身正交的可能性；即 $v_i$ 可能是光状向量，对于一个或多个 $1 \\le i \\le m$。如果正交\
  \ $k$-元组 $(v_1,\\dots,v_k)$ 由单位向量组成，则称其为标准正交 $k$-元组，此时排除了光状向量。当正交 $m$-元组是 $V$ 的基时，称其为正交基。由定理\
  \ 4.2.3 可知，标准正交 $m$-元组必然是 $V$ 的基，称为标准正交基。因此，若 $(e_1,\\dots,e_m)$ 是 $V$ 的标准正交基，则根据定义，$e_1,\\\
  dots,e_m$ 各自为单位向量，所以 $\\langle e_i,e_j\\rangle = \\pm \\delta_{ij}$ 对于 $i,j = 1,\\\
  dots,m$，其中 $\\delta_{ij}$ 为克罗内克 delta。特别地，$\\mathbb{R}_\\mathfrak{g}^m$ 的标准基是标准正交的。\n\
  \n标准正交基在计算上很方便。事实证明数量积空间总是具有一个，如我们现在所示。\n\n### 定理 4.2.1. 每个非零数量积空间都包含一个单位向量。\n\n\
  证明. 这由定理 3.2.4(b) 和定理 3.3.4 可得。\n\n### 定理 4.2.2. 若 $(V,\\mathfrak{g})$ 为维数为 $m$\
  \ 的数量积空间且 $1 \\le k \\le m-1$ 为整数，则 $V$ 中任意标准正交 $k$-元组都可以延拓为 $V$ 中的标准正交 $(k+1)$-元组。\n\
  \n证明. 设 $\\mathcal{E} = (e_1,\\dots,e_k)$ 为 $V$ 中标准正交 $k$-元组。则 $\\mathcal{E}$ 是子空间\
  \ $U = \\mathbb{R}e_1 + \\cdots + \\mathbb{R}e_k$ 的标准正交基。由定理 1.1.16，$U = \\mathbb{R}e_1\
  \ \\oplus \\cdots \\oplus \\mathbb{R}e_k$。由于 $(\\mathfrak{g}|_U)_{\\mathcal{E}}$，即\
  \ $\\mathfrak{g}|_U$ 关于 $\\mathcal{E}$ 的矩阵，是对角矩阵且每个对角元为 $1$ 或 $-1$，$(\\mathfrak{g}|_U)_{\\\
  mathcal{E}}$ 可逆。由定理 3.3.3 可知 $\\mathfrak{g}$ 在 $U$ 上非退化，进而由定理 4.1.3 可知 $\\mathfrak{g}$\
  \ 在 $U^\\perp$ 上非退化。因此，$(U^\\perp,\\mathfrak{g}|_{U^\\perp})$ 是一个非零数量积空间。由定理 4.2.1，$U^\\\
  perp$ 包含一个单位向量 $e_{k+1}$。则 $(e_1,\\dots,e_{k+1})$ 是 $V$ 中所求的标准正交 $(k+1)$-元组。\n\n\
  ### 定理 4.2.3. 若 $(V,\\mathfrak{g})$ 为数量积空间且 $(e_1,\\dots,e_k)$ 为 $V$ 中标准正交 $k$-元组，则\
  \ $e_1,\\dots,e_k$ 线性无关。\n\n证明. 若 $\\sum_i a_i e_i = 0$，则\n\n$$0 = \\left\\langle\
  \ e_i, \\sum_j a_j e_j \\right\\rangle = \\sum_j a_j \\langle e_i, e_j \\rangle\
  \ = a_i \\langle e_i, e_i \\rangle = \\pm a_i,$$\n\n故 $a_i = 0$ 对于 $i = 1,\\dots,m$。\n\
  \n### 定理 4.2.4. 每个非零数量积空间都有一个标准正交基。\n\n证明. 设 $(V,\\mathfrak{g})$ 为维数 $m \\ge 1$\
  \ 的数量积空间。由定理 4.2.1，$V$ 包含一个单位向量。归纳地应用定理 4.2.2，我们构造 $V$ 中一个标准正交 $m$-元组。由定理 4.2.3\
  \ 可知这是一个标准正交基。\n\n为方便起见，我们限制关注满足一定条件的标准正交基。\n\n**在整个讨论中，所有标准正交基 $(e_1,\\dots,e_m)$\
  \ 都假定是有序的，使得 $\\langle e_1,e_1\\rangle,\\dots,\\langle e_m,e_m\\rangle$ 中所有 +1 位于所有\
  \ -1 之前。**\n\n举例说明，设 $\\mathcal{E} = (e_1,\\dots,e_{m-2},e_{m-1},e_m)$ 为 $\\mathbb{R}_\\\
  nu^m$ 的标准基，$\\mathcal{F} = (e_1,\\dots,e_{m-2},e_m,e_{m-1})$。则 $\\mathcal{E}$ 和\
  \ $\\mathcal{F}$ 都是 $\\mathbb{R}_\\nu^m$ 的标准正交基。由于 $\\langle e_1,e_1\\rangle = \\\
  cdots = \\langle e_{m-1}\\rangle = 1$ 且 $\\langle e_m,e_m\\rangle = -1$，我们看到 $\\\
  mathcal{E}$ 满足上述约定但 $\\mathcal{F}$ 不满足。\n\n设 $(V,\\mathfrak{g})$ 为数量积空间，且 $V = V^+\
  \ \\oplus V^-$ 为定理 4.1.6(a) 给出的类型直和。$\\mathfrak{g}$ 的指标，也称为 $V$ 的指标，定义为\n\n$$\\\
  operatorname{ind}(\\mathfrak{g}) = \\dim(V^-).$$\n\n我们经常用\n\n$$\\operatorname{ind}(\\\
  mathfrak{g})\\quad\\text{表示为}\\quad\\nu.$$\n\n根据定理 4.1.6(b)，$\\operatorname{ind}(\\\
  mathfrak{g})$ 与直和的选择无关。以 $\\mathbb{R}_\\nu^m = (\\mathbb{R}^m,\\mathfrak{s})$ 为例，我们由\
  \ (4.1.2) 可知 $\\operatorname{ind}(\\mathfrak{s}) = \\nu$。\n\n设 $\\mathcal{E} = (e_1,\\\
  dots,e_m)$ 为 $V$ 的标准正交基。$\\mathfrak{g}$ 的符号，也称为 $V$ 的符号，定义为 $m$-元组\n\n$$\\bigl(\\\
  langle e_1,e_1\\rangle,\\dots,\\langle e_m,e_m\\rangle\\bigr).$$\n\n鉴于上述关于标准正交基的约定，$\\\
  mathfrak{g}$ 的符号在前 $m-\\nu$ 个位置有 +1，在剩余 $\\nu$ 个位置有 -1。设我们记\n\n$$\\langle e_i,e_i\\\
  rangle\\quad\\text{为}\\quad\\varepsilon_i$$\n\n对于 $i = 1,\\dots,m$。则\n\n$$\\langle\
  \ e_i,e_j\\rangle = \\varepsilon_i\\delta_{ij}\\tag{4.2.1}$$\n\n对于 $i,j = 1,\\dots,m$，其中\
  \ $\\delta_{ij}$ 为克罗内克 delta。在此记号下，$\\mathfrak{g}$ 的符号为\n\n$$(\\varepsilon_1,\\\
  dots,\\varepsilon_m).$$\n\n我们注意到\n\n$$\\mathfrak{g}_{\\mathcal{E}} = \\operatorname{diag}(\\\
  varepsilon_1,\\dots,\\varepsilon_m),\\tag{4.2.2}$$\n\n故\n\n$$\\det(\\mathfrak{g}_{\\\
  mathcal{E}}) = \\varepsilon_1\\cdots\\varepsilon_m = (-1)^\\nu.\\tag{4.2.3}$$\n\n\
  以下是上述恒等的推广。\n\n### 定理 4.2.5. 设 $(V, \\mathfrak{g})$ 为符号为 $(\\varepsilon_1, \\dots,\
  \ \\varepsilon_m)$ 且指标为 $\\nu$ 的数量积空间。设 $\\mathcal{E}$ 和 $\\mathcal{H}$ 为 $V$ 的基，$\\\
  mathcal{E}$ 为标准正交基，且 $A : V \\longrightarrow V$ 为由 $A(\\mathcal{E}) = \\mathcal{H}$\
  \ 定义的线性同构。则\n\n$\\det(\\mathfrak{g}_\\mathcal{H}) = \\varepsilon_1\\cdots\\varepsilon_m\
  \ \\det(A)^2 = (-1)^\\nu \\det(A)^2$。\n\n证明. 我们有\n\n$\\mathfrak{g}_\\mathcal{H}\
  \ = ([id_V]^\\mathcal{E}_{A(\\mathcal{E})})^\\top \\mathfrak{g}_\\mathcal{E} [id_V]^\\\
  mathcal{E}_{A(\\mathcal{E})}$ [Th 3.1.3] $= ([A]^\\mathcal{E}_\\mathcal{E})^\\top\
  \ \\mathfrak{g}_\\mathcal{E} [A]^\\mathcal{E}_\\mathcal{E}$, [Th 2.2.5(a)]\n\n故\
  \ $\\det(\\mathfrak{g}_\\mathcal{H}) = \\det(\\mathfrak{g}_\\mathcal{E}) \\det(A)^2$。结果现在由\
  \ (4.2.3) 可得。\n\n### 定理 4.2.6. 设 $(V,\\mathfrak{g})$ 为数量积空间，且 $U$ 为 $V$ 的子空间。若 $\\\
  mathfrak{g}$ 在 $U$ 上非退化，则\n\n$\\operatorname{ind}(\\mathfrak{g}) = \\operatorname{ind}(\\\
  mathfrak{g}|_U) + \\operatorname{ind}(\\mathfrak{g}|_{U^\\perp})$。\n\n注. 由定理 4.1.3，$\\\
  mathfrak{g}$ 在 $U^\\perp$ 上非退化。因此，$(U, \\mathfrak{g}|_U)$ 和 $(U^\\perp, \\mathfrak{g}|_{U^\\\
  perp})$ 都是数量积空间，故断言有意义。\n\n证明. 设 $\\dim(V) = m$ 且 $\\dim(U) = k$。我们由定理 4.1.3 有 $V\
  \ = U \\oplus U^\\perp$，然后由定理 1.1.18 有 $\\dim(U^\\perp) = m - k$。设 $(f_1, \\dots,\
  \ f_k)$ 和 $(f_{k+1}, \\dots, f_m)$ 分别为 $U$ 和 $U^\\perp$ 的标准正交基，且 $e_1, \\dots, e_m$\
  \ 为 $f_1, \\dots, f_m$ 的一个重排，使得 $(e_1, \\dots, e_m)$ 为满足上述符号排序约定的 $V$ 的标准正交基。显然，$(e_1,\
  \ \\dots, e_m)$ 中 -1 的个数等于 $(f_1, \\dots, f_k)$ 中 -1 的个数加上 $(f_{k+1}, \\dots, f_m)$\
  \ 中 -1 的个数。结果得证。\n\n### 定理 4.2.7. 设 $(V,\\mathfrak{g})$ 为符号为 $(\\varepsilon_1, \\\
  dots, \\varepsilon_m)$ 的数量积空间，$(e_1, \\dots, e_m)$ 为 $V$ 的标准正交基，且 $v$ 为 $V$ 中的向量。则\n\
  \n$v = \\sum_i \\varepsilon_i \\langle v, e_i \\rangle e_i$。\n\n证明. 设 $v = \\sum_j\
  \ a^j e_j$。则 $\\langle v, e_i \\rangle = \\langle \\sum_j a^j e_j, e_i \\rangle\
  \ = \\sum_j a^j \\langle e_j, e_i \\rangle = \\varepsilon_i a^i$，故 $a^i = \\varepsilon_i\
  \ \\langle v, e_i \\rangle$ 对于 $i = 1, \\dots, m$。\n\n### 定理 4.2.8. 设 $(V,\\mathfrak{g})$\
  \ 为符号为 $(\\varepsilon_1, \\dots, \\varepsilon_m)$ 的数量积空间，$(e_1, \\dots, e_m)$ 为\
  \ $V$ 的标准正交基，且 $v, w$ 为 $V$ 中的向量，其中 $v = \\sum_i a^i e_i$ 且 $w = \\sum_j b^j e_j$。则\n\
  \n$\\langle v, w \\rangle = \\sum_i \\varepsilon_i a^i b^i$。\n\n## 4.3 伴随\n\n*证明.*\
  \ 我们有\n\n$$\\langle v,w\\rangle=\\left\\langle\\sum_i a^i e_i,\\sum_j b^j e_j\\\
  right\\rangle=\\sum_{ij}a^i b^j\\langle e_i,e_j\\rangle=\\sum_i\\varepsilon_i a^i\
  \ b^i.$$\n\n## 4.3 伴随\n\n我们先前定义了矩阵对称的含义。在本节中，我们引入一种线性映射，在某些情况下具有相关的对称性质（见定理 4.6.10）。\n\
  \n设 $(V,\\mathfrak g)$ 和 $(W,\\mathfrak h)$ 为数量积空间，且 $A:V\\to W$ 为线性映射。我们定义映射\n\n\
  $$A^\\dagger:W\\longrightarrow V,$$\n\n称为 $A$ 的**伴随**，由\n\n$$A^\\dagger=S\\circ\
  \ A^*\\circ\\mathcal F,$$  (4.3.1)\n\n给出，其中 $S$ 和 $\\mathcal F$ 分别对应于 $\\mathfrak\
  \ g$ 和 $\\mathfrak h$ 的锐映射和平映射，且 $A^*$ 为由 $A$ 诱导的拉回。设我们记\n\n$$(A^\\dagger)^\\dagger\\\
  quad\\text{为}\\quad A^{\\dagger\\dagger}.$$\n\n### 定理 4.3.1. 在上述设定下：\n(a) $A^\\\
  dagger$ 是唯一的线性映射，使得\n\n$$\\langle A(v),w\\rangle=\\langle v,A^\\dagger(w)\\rangle$$\n\
  \n对所有 $V$ 中的向量 $v$ 和 $W$ 中的向量 $w$ 成立。\n\n(b) 若 $V=W$，则 $\\det(A^\\dagger)=\\det(A)$。\n\
  \n证明. (a): 我们有\n\n$$A^\\dagger=S\\circ A^*\\circ\\mathcal F$$\n$$\\Longleftrightarrow\\\
  quad A^*\\circ\\mathcal F=F\\circ A^\\dagger$$\n$$\\Longleftrightarrow\\quad (A^*\\\
  circ\\mathcal F)(w)=(F\\circ A^\\dagger)(w)\\ \\text{对所有 }w\\text{ 在 }W\\text{ 中}$$\n\
  $$\\Longleftrightarrow\\quad A^*(\\mathcal F(w))(v)=F(A^\\dagger(w))(v)\\ \\text{对所有\
  \ }v\\text{ 在 }V\\text{ 中和 }w\\text{ 在 }W\\text{ 中}$$\n$$\\Longleftrightarrow\\\
  quad \\mathcal F(w)(A(v))=F(A^\\dagger(w))(v)\\ \\text{对所有 }v\\text{ 在 }V\\text{\
  \ 中和 }w\\text{ 在 }W\\text{ 中}$$\n$$\\Longleftrightarrow\\quad \\langle w,A(v)\\\
  rangle=\\langle A^\\dagger(w),v\\rangle\\ \\text{对所有 }v\\text{ 在 }V\\text{ 中和 }w\\\
  text{ 在 }W\\text{ 中}$$\n$$\\Longleftrightarrow\\quad \\langle A(v),w\\rangle=\\\
  langle v,A^\\dagger(w)\\rangle\\ \\text{对所有 }v\\text{ 在 }V\\text{ 中和 }w\\text{ 在\
  \ }W\\text{ 中}.$$\n\n这表明 $A^\\dagger$ 具有所需性质，同时也表明它由该性质唯一确定。\n(b): 当 $\\mathcal\
  \ F=F$ 时，我们有 $S=F^{-1}$，故结果由定理 2.4.5 和 (4.3.1) 可得。\n\n\n\n\n\n伴随算子对基本代数结构表现良好。\n\
  \n### 定理 4.3.2\n\n若 \\((V,\\mathfrak{g})\\) 是一个数量积空间且 \\(A, B : V \\longrightarrow\
  \ V\\) 是线性映射，则：\n\n- (a) \\((A + B)^{\\dagger} = A^{\\dagger} + B^{\\dagger}\\)。\n\
  - (b) \\((A \\circ B)^{\\dagger} = B^{\\dagger} \\circ A^{\\dagger}\\)。\n- (c) \\\
  (A^{\\dagger\\dagger} = A\\)。\n- (d) 若 \\(A\\) 是线性同构，则 \\((A^{-1})^{\\dagger} =\
  \ (A^{\\dagger})^{-1}\\)。\n- (e) \\(A\\) 是线性同构当且仅当 \\(A^{\\dagger}\\) 是线性同构。\n\n\
  *Proof.* 我们有 \\(A^{\\dagger} = \\mathsf{S} \\circ A^{*} \\circ \\mathsf{F}\\) 且\
  \ \\(B^{\\dagger} = \\mathsf{S} \\circ B^{*} \\circ \\mathsf{F}\\)。\n\n(a): 由定理\
  \ 1.3.1(a)，\n\n\\[\n(A + B)^{\\dagger} = \\mathsf{S} \\circ (A + B)^{*} \\circ \\\
  mathsf{F} = \\mathsf{S} \\circ (A^{*} + B^{*}) \\circ \\mathsf{F}\n= (\\mathsf{S}\
  \ \\circ A^{*} \\circ \\mathsf{F}) + (\\mathsf{S} \\circ B^{*} \\circ \\mathsf{F})\
  \ = A^{\\dagger} + B^{\\dagger}.\n\\]\n\n(b): 由定理 1.3.1(b)，\n\n\\[\n(A \\circ B)^{\\\
  dagger} = \\mathsf{S} \\circ (A \\circ B)^{*} \\circ \\mathsf{F} = \\mathsf{S} \\\
  circ (B^{*} \\circ A^{*}) \\circ \\mathsf{F}\n= (\\mathsf{S} \\circ B^{*} \\circ\
  \ \\mathsf{F}) \\circ (\\mathsf{S} \\circ A^{*} \\circ \\mathsf{F}) = B^{\\dagger}\
  \ \\circ A^{\\dagger}.\n\\]\n\n(c): 由定理 1.3.1(c) 和定理 3.3.5，\n\n\\[\nA^{\\dagger\\\
  dagger} = \\mathsf{S} \\circ (A^{\\dagger})^{*} \\circ \\mathsf{F} = \\mathsf{S}\
  \ \\circ (\\mathsf{S} \\circ A^{*} \\circ \\mathsf{F})^{*} \\circ \\mathsf{F}\n\
  = \\mathsf{S} \\circ (\\mathsf{F}^{*} \\circ A^{**} \\circ \\mathsf{S}^{*}) \\circ\
  \ \\mathsf{F} = A.\n\\]\n\n(d): 由定理 1.3.1(d)，\n\n\\[\n(A^{-1})^{\\dagger} = \\mathsf{S}\
  \ \\circ (A^{-1})^{*} \\circ \\mathsf{F} = \\mathsf{F}^{-1} \\circ (A^{*})^{-1}\
  \ \\circ \\mathsf{S}^{-1}\n= (\\mathsf{S} \\circ A^{*} \\circ \\mathsf{F})^{-1}\
  \ = (A^{\\dagger})^{-1}.\n\\]\n\n(e): 由于 \\(A^{\\dagger} = \\mathsf{S} \\circ A^{*}\
  \ \\circ \\mathsf{F}\\)，且 \\(\\mathsf{F}\\) 与 \\(\\mathsf{S}\\) 都是同构，故结果成立。\n\n\
  对于数量积空间 \\((V,\\mathfrak{g})\\)，我们称线性映射 \\(A : V \\longrightarrow V\\) 为自伴的，如果 \\\
  (A = A^{\\dagger}\\)。根据定理 4.3.1(a)，该条件等价于\n\n\\[\n\\langle A(v), w \\rangle = \\\
  langle v, A(w) \\rangle\n\\]\n\n对 \\(V\\) 中所有向量 \\(v, w\\) 成立。\n\n### 定理 4.3.3\n\
  \n设 \\((V,\\mathfrak{g})\\) 为数量积空间，\\(A : V \\longrightarrow V\\) 为线性映射，且 \\(\\\
  mathcal{H}\\) 为 \\(V\\) 的一个基。则\n\n\\[\n[A^{\\dagger}]_{\\mathcal{H}} = \\mathfrak{g}_{\\\
  mathcal{H}}^{-1} [A]_{\\mathcal{H}}^{\\mathsf{T}} \\mathfrak{g}_{\\mathcal{H}}.\n\
  \\]\n\n*Remark.* 由定理 3.3.3 可知 \\(\\mathfrak{g}_{\\mathcal{H}}\\) 的逆存在，故断言有意义。\n\n\
  *Proof.* 设 \\(\\mathcal{H} = (h_1, \\dots, h_m)\\)，且 \\([A] = [A]_{\\mathcal{H}}^{\\\
  mathcal{H}} = [a_i^j]\\) 以及 \\([A^{\\dagger}] = [A^{\\dagger}]_{\\mathcal{H}}^{\\\
  mathcal{H}} = [b_j^i]\\)。我们有\n\n\\[\n[\\langle A(h_i), h_j \\rangle] = [\\langle\
  \ h_i, A^{\\dagger}(h_j) \\rangle].\n\\]\n\n由定理 2.1.6(b)、(2.2.2) 和 (2.2.3)，\n\n\\\
  [\n\\begin{aligned}\n\\langle A(h_i), h_j \\rangle\n&= \\left\\langle \\sum_k a_i^k\
  \ h_k, h_j \\right\\rangle\n= \\sum_k a_i^k \\langle h_k, h_j \\rangle\n= \\sum_k\
  \ a_i^k g_{kj} \\\\\n&= ([A]_{(i)})^{\\mathsf{T}} (\\mathfrak{g}_{\\mathcal{H}})_{(j)}\n\
  = ([A]^{\\mathsf{T}})^{(i)} (\\mathfrak{g}_{\\mathcal{H}})_{(j)},\n\\end{aligned}\n\
  \\]\n\n故\n\n\\[\n[\\langle A(h_i), h_j \\rangle] = [A]^{\\mathsf{T}} \\mathfrak{g}_{\\\
  mathcal{H}}.\n\\]\n\n另一方面，\n\n\\[\n\\begin{aligned}\n\\langle h_i, A^{\\dagger}(h_j)\
  \ \\rangle\n&= \\left\\langle h_i, \\sum_k b_j^k h_k \\right\\rangle\n= \\sum_k\
  \ b_j^k \\langle h_i, h_k \\rangle\n= \\sum_k g_{ik} b_j^k \\\\\n&= (\\mathfrak{g}_{\\\
  mathcal{H}})^{(i)} [A^{\\dagger}]_{(j)},\n\\end{aligned}\n\\]\n\n所以\n\n\\[\n[\\\
  langle h_i, A^{\\dagger}(h_j) \\rangle] = \\mathfrak{g}_{\\mathcal{H}} [A^{\\dagger}].\n\
  \\]\n\n综合上述恒等式得 \\([A]^{\\mathsf{T}} \\mathfrak{g}_{\\mathcal{H}} = \\mathfrak{g}_{\\\
  mathcal{H}} [A^{\\dagger}]\\)，由此可得结果。\n\n### 定理 4.3.4\n\n设 \\((V, \\mathfrak{g})\\\
  ) 和 \\((W, \\mathfrak{h})\\) 为数量积空间，且 \\(A : V \\longrightarrow W\\) 为线性映射。则：\n\n\
  - (a) \\(\\operatorname{rank}(A^{\\dagger}) = \\operatorname{rank}(A)\\)。\n- (b)\
  \ 若 \\(\\dim(V) = \\dim(W)\\)，则 \\(\\operatorname{null}(A^{\\dagger}) = \\operatorname{null}(A)\\\
  )。\n- (c) \\(\\ker(A^{\\dagger}) = \\operatorname{im}(A)^{\\perp}\\)。\n- (d) \\\
  (\\operatorname{im}(A^{\\dagger}) = \\ker(A)^{\\perp}\\)。\n\n*Proof.* 证明模仿定理 1.4.3\
  \ 的证明。\n\n(c): 我们有\n\n\\[\n\\begin{aligned}\nw \\in \\ker(A^{\\dagger})\n&\\iff\
  \ A^{\\dagger}(w) = 0 \\\\\n&\\iff \\langle A^{\\dagger}(w), v \\rangle = 0 \\text{\
  \ 对所有 } v \\in V\n&& [\\mathfrak{h} \\text{ 是非退化的}] \\\\\n&\\iff \\langle w, A(v)\
  \ \\rangle = 0 \\text{ 对所有 } v \\in V\n&& [\\text{Th 4.3.1(a)}] \\\\\n&\\iff w \\\
  in \\operatorname{im}(A)^{\\perp}.\n\\end{aligned}\n\\]\n\n(d): 由定理 4.3.2(c) 和部分\
  \ (c) 可得\n\n\\[\n\\ker(A) = \\ker(A^{\\dagger\\dagger}) = \\operatorname{im}(A^{\\\
  dagger})^{\\perp},\n\\]\n\n然后由定理 4.1.2(c) 可得\n\n\\[\n\\ker(A)^{\\perp} = \\operatorname{im}(A^{\\\
  dagger})^{\\perp\\perp} = \\operatorname{im}(A^{\\dagger}).\n\\]\n\n(a): 我们有\n\n\
  \\[\n\\begin{aligned}\n\\operatorname{rank}(A^{\\dagger})\n&= \\dim(\\operatorname{im}(A^{\\\
  dagger})) \\\\\n&= \\dim(\\ker(A)^{\\perp}) && [\\text{部分 (d)}] \\\\\n&= \\dim(V)\
  \ - \\dim(\\ker(A)) && [\\text{Th 4.1.2(b)}] \\\\\n&= \\operatorname{rank}(A). &&\
  \ [\\text{Th 1.1.11}]\n\\end{aligned}\n\\]\n\n(b): 我们有\n\n\\[\n\\begin{aligned}\n\
  \\operatorname{rank}(A^{\\dagger}) + \\operatorname{null}(A^{\\dagger})\n&= \\dim(W)\
  \ && [\\text{Th 1.1.11}] \\\\\n&= \\dim(V) && [\\text{假设}] \\\\\n&= \\operatorname{rank}(A)\
  \ + \\operatorname{null}(A). && [\\text{Th 1.1.11}]\n\\end{aligned}\n\\]\n\n由部分\
  \ (a) 即得结果。\n\n设 \\((V,\\mathfrak{g})\\) 为数量积空间，\\(A : V \\longrightarrow V\\) 为线性映射，且\
  \ \\(U\\) 为 \\(\\mathfrak{g}\\) 在其上非退化的 \\(V\\) 的子空间。下表左侧总结了关于零化子与拉回的若干结果，而右侧则对应地给出关于正交补与伴随的结果。零化子与正交补之间，以及拉回与伴随之间的对应关系是显而易见的，它展示了\
  \ \\(U^0\\) 与 \\(U^{\\perp}\\) 所起的相似作用。\n\n| Annihilators and pullbacks | Perps\
  \ and adjoints |\n|---|---|\n| \\(\\dim(V) = \\dim(U) + \\dim(U^0)\\) | \\(\\dim(V)\
  \ = \\dim(U) + \\dim(U^{\\perp})\\) |\n| \\(U^{00} = U\\) | \\(U^{\\perp\\perp}\
  \ = U\\) |\n| \\(A^{**} = A\\) | \\(A^{\\dagger\\dagger} = A\\) |\n| \\(\\operatorname{rank}(A^*)\
  \ = \\operatorname{rank}(A)\\) | \\(\\operatorname{rank}(A^{\\dagger}) = \\operatorname{rank}(A)\\\
  ) |\n| \\(\\operatorname{null}(A^*) = \\operatorname{null}(A)\\) | \\(\\operatorname{null}(A^{\\\
  dagger}) = \\operatorname{null}(A)\\) |\n| \\(\\ker(A^*) = \\operatorname{im}(A)^0\\\
  ) | \\(\\ker(A^{\\dagger}) = \\operatorname{im}(A)^{\\perp}\\) |\n| \\(\\operatorname{im}(A^*)\
  \ = \\ker(A)^0\\) | \\(\\operatorname{im}(A^{\\dagger}) = \\ker(A)^{\\perp}\\) |\n\
  \n## 4.4 线性等距\n\n线性映射是指保持向量空间线性结构的映射。在数量积空间中，还有数量积这一额外结构。本节引入一类同时保持数量积的线性映射。\n\n\
  设 \\((V,\\mathfrak{g})\\) 和 \\((W,\\mathfrak{h})\\) 为数量积空间，且 \\(A : V \\longrightarrow\
  \ W\\) 为线性映射。我们称 \\(A\\) 为线性等距（或正交变换），如果\n\n\\[\n\\langle A(v), A(w) \\rangle =\
  \ \\langle v, w \\rangle\n\\]\n\n对 \\(V\\) 中所有向量 \\(v, w\\) 成立。\n\n### 定理 4.4.1\n\
  \n若 \\((V,\\mathfrak{g})\\) 和 \\((W,\\mathfrak{h})\\) 为具有相同维数的数量积空间，且 \\(A : V \\\
  longrightarrow W\\) 为线性等距，则：\n\n- (a) \\(A\\) 是线性同构。\n- (b) \\(A\\) 将 \\(V\\) 的每一个标准正交基映射为\
  \ \\(W\\) 的标准正交基。\n\n*Proof.* (a): 设 \\(v\\) 为 \\(\\ker(A)\\) 中的向量。则 \\(\\langle\
  \ v,w \\rangle = \\langle A(v), A(w) \\rangle = 0\\) 对 \\(V\\) 中所有向量 \\(w\\) 成立。由于\
  \ \\(\\mathfrak{g}\\) 是非退化的，故 \\(v = 0\\)。于是 \\(\\ker(A) = \\{0\\}\\)。由定理 1.1.12\
  \ 和定理 1.1.14，\\(A\\) 是线性同构。\n\n(b): 设 \\(\\mathcal{E} = (e_1, \\ldots, e_m)\\) 为\
  \ \\(V\\) 的一个标准正交基。由定理 1.1.13(a) 和部分 (a)，\\(A(\\mathcal{E})\\) 是 \\(W\\) 的一个基。由于\
  \ \\(A\\) 是线性等距，\\(\\langle A(e_i), A(e_j) \\rangle = \\langle e_i, e_j \\rangle\\\
  ) 对 \\(i,j = 1, \\ldots, m\\) 成立。于是 \\(A(\\mathcal{E})\\) 是 \\(W\\) 的一个标准正交基。\n\n\
  ### 定理 4.4.2\n\n设 \\((V,\\mathfrak{g})\\) 为数量积空间，且 \\(A : V \\longrightarrow V\\\
  ) 为线性映射。则以下条件等价：\n\n- (a) \\(A\\) 是线性等距。\n- (b) \\(A\\) 是线性同构且 \\(A^{\\dagger} =\
  \ A^{-1}\\)。\n- (c) 对某个（从而对每一个）基 \\(\\mathcal{H}\\)，\n\n\\[\n\\mathfrak{g}_{\\mathcal{H}}\
  \ = [A]_{\\mathcal{H}}^{\\mathsf{T}} \\mathfrak{g}_{\\mathcal{H}} [A]_{\\mathcal{H}}.\n\
  \\]\n\n*Proof.* (a) \\(\\Rightarrow\\) (b): 由定理 4.4.1(a)，\\(A\\) 是线性同构。设 \\(v,w\\\
  ) 为 \\(V\\) 中的向量。则\n\n\\[\n\\langle v,w \\rangle = \\langle A(v), A(w) \\rangle\
  \ = \\langle A^{\\dagger}(A(v)), w \\rangle,\n\\]\n\n故\n\n\\[\n0 = \\langle A^{\\\
  dagger}(A(v)) - v, w \\rangle = \\langle ((A^{\\dagger} \\circ A) - \\operatorname{id}_V)(v),\
  \ w \\rangle.\n\\]\n\n由于 \\(\\mathfrak{g}\\) 是非退化的且 \\(w\\) 任意，故 \\(((A^{\\dagger}\
  \ \\circ A) - \\operatorname{id}_V)(v) = 0\\) 对所有 \\(v \\in V\\) 成立。即 \\(A^{\\dagger}\
  \ \\circ A = \\operatorname{id}_V\\)，故 \\(A^{\\dagger} = A^{-1}\\)。\n\n(b) \\(\\\
  Rightarrow\\) (c): 由于 \\(A^{\\dagger} = A^{-1}\\)，由定理 2.2.5(b) 可得\n\n\\[\n[A^{\\\
  dagger}]_{\\mathcal{H}} = [A^{-1}]_{\\mathcal{H}} = ([A]_{\\mathcal{H}})^{-1}.\n\
  \\]\n\n结果现在由定理 4.3.3 得出。\n\n(c) \\(\\Rightarrow\\) (a): 对 \\(V\\) 中的向量 \\(v,w\\\
  )，我们有\n\n\\[\n\\begin{aligned}\n\\langle A(v), A(w) \\rangle\n&= ([A(v)]_{\\mathcal{H}})^{\\\
  mathsf{T}} \\mathfrak{g}_{\\mathcal{H}} [A(w)]_{\\mathcal{H}}\n&& [\\mathrm{Th\\\
  \ 3.1.2(a)}] \\\\\n&= ([A]_{\\mathcal{H}} [v]_{\\mathcal{H}})^{\\mathsf{T}} \\mathfrak{g}_{\\\
  mathcal{H}} [A]_{\\mathcal{H}} [w]_{\\mathcal{H}}\n&& [\\mathrm{Th\\ 2.2.4}] \\\\\
  \n&= ([v]_{\\mathcal{H}})^{\\mathsf{T}} [A]_{\\mathcal{H}}^{\\mathsf{T}} \\mathfrak{g}_{\\\
  mathcal{H}} [A]_{\\mathcal{H}} [w]_{\\mathcal{H}} \\\\\n&= ([v]_{\\mathcal{H}})^{\\\
  mathsf{T}} \\mathfrak{g}_{\\mathcal{H}} [w]_{\\mathcal{H}} \\\\\n&= \\langle v,w\
  \ \\rangle\n&& [\\mathrm{Th\\ 3.1.2(a)}].\n\\end{aligned}\n\\]\n\n### 定理 4.4.3\n\
  \n若 \\((V,\\mathfrak{g})\\) 为数量积空间且 \\(A : V \\longrightarrow V\\) 为线性等距，则 \\(\\\
  det(A) = \\pm 1\\)。\n\n\n\n\n*证明.* 设 \\(\\mathcal{H}\\) 是 \\(V\\) 的一组基。由定理4.4.2，我们有\
  \ \\(\\det(g_{\\mathcal{H}})=\\det(g_{\\mathcal{H}})\\det(A)^2\\)，由定理3.3.3，有 \\\
  (\\det(g_{\\mathcal{H}})\\ne 0\\)。因此，\\(\\det(A)^2=1\\)，结论得证。\n\n线性等距映射之所以特别重要，是因为它们“保持范数”，如下述结果所示。\n\
  \n**定理4.4.4.**\n\n设 \\((V,\\mathfrak{q})\\) 是一个标量积空间，设 \\(A:V\\longrightarrow V\\\
  ) 是一个线性映射。则：\n\n- (a) 若 \\(A\\) 是线性等距映射，则对所有向量 \\(v \\in V\\)，有 \\(\\|A(v)\\|=\\\
  |v\\|\\)。\n- (b) 若对所有向量 \\(v \\in V\\) 都有 \\(\\|A(v)\\|=\\|v\\|\\)，且 \\(A\\) 将类空（相应地，类时、类光）向量映射到类空（相应地，类时、类光）向量，则\
  \ \\(A\\) 是线性等距映射。\n\n*证明.* (a)：我们有\n\n\\[\n\\|A(v)\\|=\\sqrt{\\langle A(v),A(v)\\\
  rangle}=\\sqrt{\\langle v,v\\rangle}=\\|v\\|.\n\\]\n\n(b)：由于 \\(\\|A(v)\\|=\\|v\\\
  |\\) 等价于 \\(\\langle A(v),A(v)\\rangle=\\langle v,v\\rangle\\)，关于 \\(A\\) 映射向量方式的假设给出\
  \ \\(\\langle A(v),A(v)\\rangle=\\langle v,v\\rangle\\)。\n\n**定理4.4.5.**\n\n设 \\\
  ((V,\\mathfrak{q})\\) 是一个标量积空间，设 \\(A:V\\longrightarrow V\\) 是一个线性映射。则 \\(A\\) 是线性等距映射当且仅当\
  \ \\(A^{\\dagger}\\) 是线性等距映射。\n\n*证明.* (\\(\\Rightarrow\\))：由定理4.4.2，\\(A\\) 是一个线性同构且\
  \ \\(A^{\\dagger}=A^{-1}\\)。对 \\(V\\) 中的向量 \\(v,w\\)，我们有\n\n\\[\n\\begin{aligned}\n\
  \\langle A^{\\dagger}(v),A^{\\dagger}(w)\\rangle &= \\langle v,A^{\\dagger}(A^{\\\
  dagger}(w))\\rangle && [\\mathrm{Th}\\ 4.3.1(a)]\\\\\n&= \\langle v,A\\circ A^{\\\
  dagger}(w)\\rangle && [\\mathrm{Th}\\ 4.3.2(c)]\\\\\n&= \\langle v,w\\rangle.\n\\\
  end{aligned}\n\\]\n\n(\\(\\Leftarrow\\))：这可由定理4.3.2(c)和(\\(\\Rightarrow\\))推出。\n\
  \n设 \\((V,\\mathfrak{q})\\) 是一个维数为 \\(m\\)、指数为 \\(\\nu\\) 的标量积空间，设 \\(\\mathcal{E}\\\
  ) 是 \\(V\\) 的一个标准正交基，设 \\(A:V\\longrightarrow V\\) 是一个线性等距映射。为简化记号，我们将 \\([A]_{\\\
  mathcal{E}}^{\\mathcal{E}}\\) 记为 \\([A]\\)，并对其他矩阵采用类似的缩写。考虑 \\([A]\\) 的如下分块：\n\n\
  \\[\n[A]=\\begin{bmatrix}\n[A_1^1] &[A_2^1]\\\\\n[A_1^2] &[A_2^2]\n\\end{bmatrix},\\\
  tag{4.4.1}\n\\]\n\n其中子矩阵的维数如下：\n\n- \\([A_1^1]\\quad (m-\\nu)\\times(m-\\nu)\\)\n\
  - \\([A_2^1]\\quad (m-\\nu)\\times\\nu\\)\n- \\([A_1^2]\\quad \\nu\\times(m-\\nu)\\\
  )\n- \\([A_2^2]\\quad \\nu\\times\\nu\\)。\n\n\\[\n\\begin{bmatrix}\n([A^1_1])^\\\
  mathsf{T} & -([A^2_1])^\\mathsf{T} \\\\\n-([A^1_2])^\\mathsf{T} & ([A^2_2])^\\mathsf{T}\n\
  \\end{bmatrix}\n\\begin{bmatrix}\n[A^1_1] & [A^1_2] \\\\\n[A^2_1] & [A^2_2]\n\\\
  end{bmatrix}\n=\n\\begin{bmatrix}\nI_{m-\\nu} & O_{(m-\\nu)\\times\\nu} \\\\\nO_{\\\
  nu\\times(m-\\nu)} & I_\\nu\n\\end{bmatrix},\n\\]\n因此\n\n\\[\n([A^1_1])^\\mathsf{T}[A^1_1]-([A^2_1])^\\\
  mathsf{T}[A^2_1]=I_{m-\\nu}\n\\]\n\n\\[\n([A^1_1])^\\mathsf{T}[A^1_2]-([A^2_1])^\\\
  mathsf{T}[A^2_2]=O_{(m-\\nu)\\times\\nu}\n\\]\n\n\\[\n-([A^1_2])^\\mathsf{T}[A^1_1]+([A^2_2])^\\\
  mathsf{T}[A^2_1]=O_{\\nu\\times(m-\\nu)}\n\\]\n\n\\[\n-([A^1_2])^\\mathsf{T}[A^1_2]+([A^2_2])^\\\
  mathsf{T}[A^2_2]=I_\\nu.\n\\tag{4.4.4}\n\\]\n\n- (a)：这由(4.4.3)的第一个恒等式得出。\n- (b)：这由(4.4.3)的第二个或第三个恒等式得出。\n\
  - (c)：这由(4.4.3)的第四个恒等式得出。\n- (d)：这由(4.4.4)的第一个恒等式得出。\n- (e)：这由(4.4.4)的第二个或第三个恒等式得出。\n\
  - (f)：这由(4.4.4)的第四个恒等式得出。\n\n## 4.5 对偶标量积空间\n\n本节中，我们证明向量空间上的标量积在其对偶空间上诱导出相应的标量积。\n\
  \n设 \\((V,\\mathfrak{g})\\) 是一个标量积空间，设 \\(V^*\\) 是其对偶空间，设 \\(F\\) 和 \\(S\\) 是对应于\
  \ \\(\\mathfrak{g}\\) 的平坦映射和尖锐映射。我们定义函数\n\n\\[\n\\mathfrak{g}^* = \\langle\\cdot,\\\
  cdot\\rangle^* : V^*\\times V^*\\to\\mathbb{R}\n\\]\n\n如下：\n\n\\[\n\\langle\\eta,\\\
  zeta\\rangle^* = \\langle\\eta^S,\\zeta^S\\rangle\n\\tag{4.5.1}\n\\]\n\n对 \\(V^*\\\
  ) 中的所有余向量 \\(\\eta,\\zeta\\) 成立。根据(3.3.1)，\\(\\langle\\eta^S,\\zeta^S\\rangle=(\\\
  eta^S)^F(\\zeta^S)=\\eta(\\zeta^S)\\)，因此\n\n\\[\n\\langle\\eta,\\zeta\\rangle^*\
  \ = \\eta(\\zeta^S).\n\\tag{4.5.2}\n\\]\n\n**定理4.5.1.** *在上述设定下，\\((V^*,\\mathfrak{g}^*)\\\
  ) 是一个标量积空间，称为对应于 \\((V,\\mathfrak{g})\\) 的对偶标量积空间。*\n\n*证明.* 显然，\\(\\mathfrak{g}^*\\\
  ) 是双线性的且对称的。设 \\(\\eta\\) 是 \\(V^*\\) 中的一个余向量，使得对所有余向量 \\(\\zeta \\in V^*\\)，都有\
  \ \\(\\langle\\eta,\\zeta\\rangle^*=0\\)，即 \\(\\langle\\eta^S,\\zeta^S\\rangle=0\\\
  )。由于 \\(S\\) 是满射，当 \\(\\zeta\\) 遍历 \\(V^*\\) 时，\\(\\zeta^S\\) 遍历 \\(V\\)。因为 \\(\\\
  mathfrak{g}\\) 是非退化的，所以 \\(\\eta^S=0\\)；又由于 \\(S\\) 是单射，由定理1.1.12，\\(\\eta=0\\)。因此，\\\
  (\\mathfrak{g}^*\\) 是非退化的。\n\n设 \\(\\mathcal{F}\\) 和 \\(\\mathcal{S}\\) 分别为对应于 \\\
  (\\mathfrak{g}^*\\) 的平坦映射和尖锐映射。由等同 \\(V^{**}=V\\)，我们有\n\n\\[\n\\mathcal{F}: V^*\
  \ \\longrightarrow V \\quad \\text{and} \\quad \\mathcal{S}: V \\longrightarrow\
  \ V^*.\n\\]\n\n也许更明显的记号选择是用 \\(\\mathrm{F}^*\\) 代替 \\(\\mathcal{F}\\)，用 \\(\\mathrm{S}^*\\\
  ) 代替 \\(\\mathcal{S}\\)。然而，回顾定理3.3.5，这会把我们现在用 \\(\\mathcal{F}\\) 和 \\(\\mathcal{S}\\\
  ) 表示的对象与 \\(\\mathrm{F}\\) 的拉回和 \\(\\mathrm{S}\\) 的拉回混淆。\n\n**定理4.5.2.** 若 \\((V,\\\
  mathfrak{g})\\) 是一个标量积空间，且 \\(\\mathrm{F}\\) 和 \\(\\mathrm{S}\\) 是对应于 \\(\\mathfrak{g}\\\
  ) 的平坦映射和尖锐映射，则：\n\n- (a) \\(\\mathcal{F}=\\mathrm{S}\\)。\n- (b) \\(\\mathcal{S}=\\\
  mathrm{F}\\)。\n\n*证明.* (a)：对于 \\(V^*\\) 中的余向量 \\(\\eta,\\zeta\\)，我们有\n\n\\[\n\\\
  begin{aligned}\n\\eta^{\\mathcal{F}}(\\zeta)&=\\langle\\eta,\\zeta\\rangle^* \\\
  quad [(3.3.1)]\\\\\n&=\\langle\\eta^{\\mathrm{S}},\\zeta^{\\mathrm{S}}\\rangle \\\
  quad [(4.5.1)]\\\\\n&=\\langle\\zeta^{\\mathrm{S}},\\eta^{\\mathrm{S}}\\rangle\\\
  \\\n&=(\\zeta^{\\mathrm{S}})^{\\mathrm{F}}(\\eta^{\\mathrm{S}}) \\quad [(3.3.1)]\\\
  \\\n&=\\zeta(\\eta^{\\mathrm{S}})\\\\\n&=\\eta^{\\mathrm{S}}(\\zeta). \\quad [(1.2.3)]\n\
  \\end{aligned}\n\\]\n\n由于 \\(\\eta\\) 和 \\(\\zeta\\) 是任意的，所以 \\(\\mathcal{F}=\\\
  mathrm{S}\\)。\n\n(b)：我们有\n\n\\[\n\\begin{aligned}\n\\mathcal{S}&=\\mathcal{F}^{-1}\
  \ \\quad [(3.3.5)]\\\\\n&=\\mathrm{S}^{-1} \\quad [\\text{part (a)}]\\\\\n&=\\mathrm{F}.\
  \ \\quad [(3.3.5)]\n\\end{aligned}\n\\]\n\n**定理4.5.3.** 设 \\((V,\\mathfrak{g})\\\
  ) 是一个标量积空间，设 \\(\\mathcal{H}=(h_1,\\dots,h_m)\\) 是 \\(V\\) 的一组基，设 \\(\\Theta=(\\\
  theta^1,\\dots,\\theta^m)\\) 是其对偶基，设 \\(\\mathfrak{g}_{\\mathcal{H}}^{-1}=[\\mathfrak{g}^{ij}]\\\
  )。则：\n\n- (a) 对 \\(j=1,\\dots,m\\)，\\(\\theta^{j\\mathrm{S}}=\\sum_i \\mathfrak{g}^{ij}\
  \ h_i\\)。\n- (b) \\([\\mathrm{S}]_{\\Theta}^{\\mathcal{H}}=\\mathfrak{g}_{\\Theta}^*=\\\
  mathfrak{g}_{\\mathcal{H}}^{-1}\\)。\n\n*证明.* (b)：由于标量积是对称的，其关于给定基的矩阵也是对称的。因此，定理3.3.1(b)中的转置可以省略。于是我们有\n\
  \n\\[\n\\begin{aligned}\n\\mathfrak{g}_{\\Theta}^{*} &= [\\mathcal{F}]_{\\Theta}^{\\\
  mathcal{H}} && \\text{[Th 3.3.1(b)]}\\\\\n&= [\\mathrm{S}]_{\\Theta}^{\\mathcal{H}}\
  \ && \\text{[Th 4.5.2(a)]}\\\\\n&= [\\mathrm{F}^{-1}]_{\\Theta}^{\\mathcal{H}}\\\
  \\\n&= \\left([\\mathrm{F}]_{\\mathcal{H}}^{\\Theta}\\right)^{-1} && \\text{[Th\
  \ 2.2.5(b)]}\\\\\n&= \\mathfrak{g}_{\\mathcal{H}}^{-1}. && \\text{[Th 3.3.1(b)]}\n\
  \\end{aligned}\n\\]\n\n(a)：这由(2.2.2)、(2.2.3)以及(b)部分得出。\n\n**定理4.5.4（指标提升）。**\n\n\
  设 \\((V,g)\\) 是一个标量积空间，设 \\(\\mathcal{H}=(h_1,\\ldots,h_m)\\) 是 \\(V\\) 的一组基，设 \\\
  (\\Theta=(\\theta^1,\\ldots,\\theta^m)\\) 是其对偶基。设 \\(g_{\\mathcal{H}}^{-1}=[g^{ij}]\\\
  )，设 \\(\\eta\\) 是 \\(V^*\\) 中的一个余向量，且\n\n\\[\n\\eta=\\sum_i a_i\\theta^i.\n\\tag{4.5.3}\n\
  \\]\n\n则\n\n\\[\n\\eta^{\\mathrm{S}}=\\sum_i a^i h_i,\n\\]\n\n其中\n\n\\[\na^i=\\\
  sum_j g^{ij}a_j.\n\\tag{4.5.4}\n\\]\n\n对 \\(i=1,\\ldots,m\\) 成立。更简洁地表示为：\n\n\\[\n\
  [\\eta^{\\mathrm{S}}]_{\\mathcal{H}}=g_{\\mathcal{H}}^{-1}[\\eta]_{\\Theta}.\n\\\
  ]\n\n*证明.* 这可由定理3.3.2和定理4.5.2(a)推出，但单独演算细节是有启发性的。设 \\(\\zeta\\) 是 \\(V^*\\) 中的一个余向量，并注意到\
  \ \\(g_{\\Theta}^{*}=\\left[\\langle\\theta^i,\\theta^j\\rangle^*\\right]\\)。则\n\
  \n\\[\n\\begin{aligned}\n\\eta^{\\mathrm{S}}(\\zeta) &= \\eta^{\\mathcal{F}}(\\\
  zeta) && \\text{[Th 4.5.2(a)]}\\\\\n&=\\langle\\eta,\\zeta\\rangle^* && \\text{[(3.3.1)]}\\\
  \\\n&=\\langle\\zeta,\\eta\\rangle^*\\\\\n&=\\left\\langle\\sum_i\\zeta(h_i)\\theta^i,\\\
  sum_j a_j\\theta^j\\right\\rangle^* && \\text{[Th 1.2.1(e)]}\\\\\n&=\\sum_{ij}\\\
  zeta(h_i)a_j\\langle\\theta^i,\\theta^j\\rangle^*\\\\\n&=\\sum_{ij}g^{ij}a_jh_i(\\\
  zeta) && \\text{[(1.2.3), Th 4.5.3(b)]}\\\\\n&=\\left(\\sum_i\\left[\\sum_jg^{ij}a_j\\\
  right]h_i\\right)(\\zeta)\\\\\n&=\\left(\\sum_i a^ih_i\\right)(\\zeta).\n\\end{aligned}\n\
  \\]\n\n\n由于ζ是任意的，η^♯ = Σ_i a^i h_i。为了直接证明简洁版本：\n\n[η^♯]_ℋ = [S(η)]_ℋ = [S]_Θ^ℋ [η]_Θ\
  \   [Th 2.2.4] = \U0001D524_ℋ^{-1} [η]_Θ .   [Th 4.5.3]\n\n从(4.5.3)和(4.5.4)我们可以看出，为什么取η的sharp（升映射）得到η^♯在经典文献中被称为通过\U0001D524\
  提升指标。因此，flat映射\U0001D53D和sharp映射S分别降低和提升指标。在数学文献中，这些映射被生动地称为音乐同构。\n\n标量积空间与其对偶标量积空间在降映射和升映射下是同构的。本节其余结果表明，其他熟悉的结构之间也存在密切的联系。\n\
  \n## 定理 4.5.5. 设(V,\U0001D524)是具有符号(ε₁,…,ε_m)的标量积空间，设(e₁,…,e_m)是V的标准正交基，并设(ξ¹,…,ξ^m)是其对偶基。则对于i\
  \ = 1,…,m：\n\n- (a) e_i^\U0001D53D = ε_i ξ^i.\n- (b) ξ^i♯ = ε_i e_i.\n\n证明. (a)：这由定理3.3.1(a)得出。\n\
  (b)：这由定理4.5.3(a)或由(a)部分得出。\n\n## 定理 4.5.6. 设(V,\U0001D524)是一个标量积空间，设ℰ是V的一个标准正交基，并设Ξ是其对偶基。则：\n\
  \n- (a) Ξ是(V*, \U0001D524*)的一个标准正交基。\n- (b) (V,\U0001D524)和(V*,\U0001D524*)具有相同的符号。\n\
  \n证明. 设V的符号为(ε₁,…,ε_m)，并设ℰ = (e₁,…,e_m)，Ξ = (ξ¹,…,ξ^m)。由(4.5.1)和定理4.5.5(b)，⟨ξ^i,\
  \ ξ^j⟩* = ⟨ξ^i♯, ξ^j♯⟩ = ε_i ε_j ⟨e_i, e_j⟩ = { ε_i 若i = j，0 若i ≠ j }，因此对于i, j =\
  \ 1,…,m，⟨ξ^i, ξ^j⟩* = ⟨e_i, e_j⟩。结论得证。\n\n## 4.6 内积空间\n\n在相当详细地讨论了标量积空间的特征之后，我们现在专门讨论在线性代数入门中通常作为重点的那类标量积空间。\n\
  \n设V是一个向量空间，设\U0001D524是V上的一个双线性函数。如果\U0001D524在V上对称且正定，则称\U0001D524是V上的一个内积，并称对(V,\U0001D524\
  )是一个内积空间。回忆第3.1节，如果对于V中所有向量v,w有⟨v,w⟩ = ⟨w,v⟩，则称\U0001D524在V上对称；如果对于V中所有非零向量v有⟨v,v⟩\
  \ > 0，则称\U0001D524在V上正定。\n\n假设$(V,\\mathfrak{g})$实际上是一个内积空间。如果$v$是$V$中的一个向量，使得对于$V$中的所有向量$w$都有$\\\
  langle v,w\\rangle = 0$，则$\\langle v,v\\rangle = 0$，因此$v = 0$。从而$\\mathfrak{g}$在$V$上非退化，这表明$(V,\\\
  mathfrak{g})$自动是一个标量积空间。在当前背景下，由(4.1.1)给出的与$\\mathfrak{g}$对应的范数简化为函数\n\n```\n||·||\
  \ : V → ℝ\n```\n\n定义为\n\n```\n||v|| = √⟨v,v⟩ = √q(v)    (4.6.1)\n```\n\n对于$V$中的所有向量$v$。由于内积空间是标量积空间的一种类型，第4.2节中给出的正交、正交$k$-元组、正交基、标准正交、标准正交$k$-元组和标准正交基的定义在这里也适用。设$(e_1,...,e_m)$是$V$的一个标准正交基。由于$\\\
  mathfrak{g}$是一个内积，对于$i = 1,...,m$有$\\langle e_i,e_i\\rangle = 1$。因此，ind$(\\mathfrak{g})\
  \ = 0$，且$\\mathfrak{g}$的符号是$m$个$+1$组成的$m$-元组。\n\n内积正定这一事实以根本性的方式将其与标量积空间区分开来。例如，在内积空间中，只有零向量与自身正交；等价地，只有零向量的范数为零。也许最重要的是，在内积空间中，内积在每个子空间上都是正定的（因此是非退化的）。因此，将内积空间的任何子空间与内积的相应限制配对，就得到一个内积空间。\n\
  \n## 例 4.6.1 (ℝ₀ᵐ). 继续例4.1.1，设ν = 0。在这种情况下，我们将\U0001D530记作\U0001D522。则\n\n```\n\U0001D522\
  \ : ℝᵐ × ℝᵐ → ℝ\n```\n\n由\n\n```\n\U0001D522((x¹,...,xᵐ),(y¹,...,yᵐ)) = x¹y¹ + ⋯\
  \ + xᵐyᵐ.\n```\n\n给出。我们称\n\n```\nℝ₀ᵐ = (ℝᵐ,\U0001D522)\n```\n\n为欧几里得m-空间，并称\U0001D522\
  为欧几里得内积。容易证明\U0001D522确实是ℝᵐ上的一个内积。按照例4.1.1，ℝ₀ᵐ的标准基就是ℝᵐ的标准基。与\U0001D522对应的范数由\n\n\
  ```\n||(x¹,...,xᵐ)|| = √((x¹)² + ⋯ + (xᵐ)²)\n```\n\n给出，称为欧几里得范数。读者可能熟悉||·||作为ℝᵐ中“长度”的度量，这一概念将在第9.3节进一步探讨。◇\n\
  \n## 定理 4.6.2. 设(V,\U0001D524)是指标为ν的标量积空间。则\U0001D524是内积当且仅当ν = 0。\n\n证明. (⇒)：这由上述评述得出。\n\
  (⇐)：设$(e_1,\\dots,e_m)$是$V$的一个标准正交基，设$v$是$V$中的一个向量，且$v = \\sum_i a^i e_i$。由于$\\\
  nu = 0$，\n\n$\\langle v, v \\rangle = \\left\\langle \\sum_i a^i e_i, \\sum_j a^j\
  \ e_j \\right\\rangle = \\sum_{ij} \\langle e_i, e_j \\rangle a^i a^j = \\sum_i\
  \ (a^i)^2,$\n\n因此$\\langle v, v \\rangle \\ge 0$，等号成立当且仅当每个$a^i = 0$，即当且仅当$v = 0$。\n\
  \n## 定理 4.6.3. 如果$(V,\\mathfrak{g})$是一个内积空间，且$\\mathcal{H}$是$V$的一个基，则$\\det(\\mathfrak{g}_{\\\
  mathcal{H}}) > 0$。\n\n证明. 由定理4.2.5和定理4.6.2，我们有$\\det(\\mathfrak{g}_{\\mathcal{H}})\
  \ = \\det(A)^2 \\ge 0$。由定理3.3.3，$\\det(\\mathfrak{g}_{\\mathcal{H}}) \\ne 0$。\n\n\
  我们在定理3.2.6中遇到过柯西-施瓦茨不等式的一个版本，其证明较为复杂。对于内积空间，我们可以用更少的力气得到更强的结果。\n\n## 定理 4.6.4（柯西-施瓦茨不等式）。如果$(V,\\\
  mathfrak{g})$是一个内积空间，且$v, w$是$V$中的向量，则\n\n$\\langle v, w \\rangle^2 \\le \\langle\
  \ v, v \\rangle \\langle w, w \\rangle,$\n(4.6.2)\n\n等号成立当且仅当$v, w$线性相关。\n\n证明.\
  \ 如果$v = 0$或$w = 0$，则结论是平凡的，因此假设$v, w \\ne 0$。由于\n\n$\\langle w, w \\rangle \\bigl(\\\
  langle v, v \\rangle \\langle w, w \\rangle - \\langle v, w \\rangle^2\\bigr)$\n\
  $= \\bigl\\langle \\langle w, w \\rangle v - \\langle v, w \\rangle w, \\langle\
  \ w, w \\rangle v - \\langle v, w \\rangle w \\bigr\\rangle \\ge 0,$\n(4.6.3)\n\n\
  我们有\n$\\langle v, v \\rangle \\langle w, w \\rangle - \\langle v, w \\rangle^2 \\\
  ge 0,$\n由此得出(4.6.2)。如果(4.6.2)中等号成立，则(4.6.3)中等号成立，即\n\n$\\bigl\\langle \\langle w,\
  \ w \\rangle v - \\langle v, w \\rangle w, \\langle w, w \\rangle v - \\langle v,\
  \ w \\rangle w \\bigr\\rangle = 0,$\n\n因此$\\langle w, w \\rangle v - \\langle v,\
  \ w \\rangle w = 0$，所以$v, w$线性相关。反之，如果$w = c v$对于某个非零实数$c$成立，则\n$\\langle v, v \\\
  rangle \\langle w, w \\rangle = \\langle v, w/c \\rangle \\langle c v, w \\rangle\
  \ = \\langle v, w \\rangle^2.$\n\n## 定理 4.6.5（三角不等式）。如果$(V,\\mathfrak{g})$是一个内积空间，且$v,\
  \ w$是$V$中的向量，则\n\n$\\|v + w\\| \\le \\|v\\| + \\|w\\|,$\n\n等号成立当且仅当$v, w$线性相关。\n\
  \n**证明。** 由定理4.6.4，\n\n\\[\n\\langle v,w\\rangle \\le |\\langle v,w\\rangle|=\\\
  sqrt{\\langle v,w\\rangle^2}\\le \\sqrt{\\langle v,v\\rangle}\\sqrt{\\langle w,w\\\
  rangle}=\\|v\\|\\,\\|w\\|,\n\\]\n\n因此\n\n\\[\n\\begin{aligned}\n\\|v+w\\|^2&=\\\
  langle v+w,v+w\\rangle\\\\\n&=\\langle v,v\\rangle+2\\langle v,w\\rangle+\\langle\
  \ w,w\\rangle\\\\\n&\\le \\|v\\|^2+2\\|v\\|\\|w\\|+\\|w\\|^2=(\\|v\\|+\\|w\\|)^2.\n\
  \\end{aligned}\n\\]\n\n所以$\\|v+w\\|\\le \\|v\\|+\\|w\\|$。等号成立当且仅当$\\langle v,w\\\
  rangle=\\|v\\|\\|w\\|$，这等价于$\\langle v,w\\rangle\\ge 0$和$\\langle v,w\\rangle^2=\\\
  langle v,v\\rangle\\langle w,w\\rangle$，而由定理4.6.4，这又等价于$v,w$线性相关。\n\n几何而言，三角不等式有如下直观解释：在内积空间中，沿矩形场地对角线行走比“绕角落”更短。正如我们将在第4.8节看到的，这一常见观察结果关键取决于内积的性质。\n\
  \n## 例 4.6.6 $(\\mathbb{R}_0^m)$。对于$\\mathbb{R}_0^m$中的向量$(x^1,\\ldots,x^m)$和$(y^1,\\\
  ldots,y^m)$，柯西-施瓦茨不等式和三角不等式分别变为\n\n\\[\n\\left(\\sum_i x^i y^i\\right)^2\\le \\\
  left(\\sum_i (x^i)^2\\right)\\left(\\sum_i (y^i)^2\\right)\n\\]\n\n和\n\n\\[\n\\\
  sqrt{\\sum_i (x^i+y^i)^2}\\le \\sqrt{\\sum_i (x^i)^2}+\\sqrt{\\sum_i (y^i)^2},\n\
  \\]\n\n。\n\n## 定理 4.6.7（毕达哥拉斯定理）。\n\n如果$(V,g)$是一个内积空间，且$U$是$V$的一个子空间，则\n\n\\[\n\\\
  |v\\|^2=\\|P_U(v)\\|^2+\\|P_{U^\\perp}(v)\\|^2,\n\\]\n\n其中$P_U$和$P_{U^\\perp}$是第4.1节定义的正交投影映射。\n\
  \n**证明。** 由定理4.1.4，\n\n\\[\n\\begin{aligned}\n\\|v\\|^2&=\\langle P_U(v)+P_{U^\\\
  perp}(v),P_U(v)+P_{U^\\perp}(v)\\rangle\\\\\n&=\\langle P_U(v),P_U(v)\\rangle+\\\
  langle P_{U^\\perp}(v),P_{U^\\perp}(v)\\rangle\\\\\n&=\\|P_U(v)\\|^2+\\|P_{U^\\\
  perp}(v)\\|^2.\n\\end{aligned}\n\\]\n\n下一个结果是**定理4.2.3**的内积空间对应版本。\n\n## 定理 4.6.8.\n\
  \n如果$(V,g)$是一个内积空间，且$(e_1,\\ldots,e_k)$是$V$中向量组成的一个正交（但不一定是标准正交）$k$-元组，则$e_1,\\\
  ldots,e_k$线性无关。\n\n\n\n\n# 4.6 内积空间\n\n**证明。** 若 $\\sum_i a_i e_i=0$，则\n\n$$0=\\\
  left\\langle e_i,\\sum_j a_j e_j\\right\\rangle=\\sum_j a_j\\langle e_i,e_j\\rangle=a_i\\\
  langle e_i,e_i\\rangle.$$\n\n根据定义，$e_i$ 非零，故 $\\langle e_i,e_i\\rangle\\ne 0$，所以\
  \ $a_i=0$ 对 $i=1,\\ldots,m$。\n\n定理 4.2.4 保证了每个数量积空间都存在标准正交基，但并未提供构造的显式机制。在内积空间中，存在一种逐步算法来产生所需的基。\n\
  \n## 定理 4.6.9 （Gram–Schmidt 正交化过程）。\n\n设 $(V,\\mathbf g)$ 为内积空间，且 $\\mathcal H=(h_1,\\\
  ldots,h_m)$ 为 $V$ 的基。按顺序计算，令\n\n$$f_1=h_1$$\n\n$$f_2=h_2-\\frac{\\langle h_2,f_1\\\
  rangle}{\\langle f_1,f_1\\rangle}f_1$$\n\n$$f_3=h_3-\\frac{\\langle h_3,f_1\\rangle}{\\\
  langle f_1,f_1\\rangle}f_1-\\frac{\\langle h_3,f_2\\rangle}{\\langle f_2,f_2\\rangle}f_2$$\n\
  \n$$\\vdots$$\n\n$$f_m=h_m-\\frac{\\langle h_m,f_1\\rangle}{\\langle f_1,f_1\\rangle}f_1-\\\
  frac{\\langle h_m,f_2\\rangle}{\\langle f_2,f_2\\rangle}f_2-\\cdots-\\frac{\\langle\
  \ h_m,f_{m-1}\\rangle}{\\langle f_{m-1},f_{m-1}\\rangle}f_{m-1}.$$\n\n**则：**\n\n\
  - (a) $\\mathcal F=(f_1,\\ldots,f_m)$ 是 $V$ 的正交基。\n- (b) $\\mathcal E=(f_1/\\|f_1\\\
  |,\\ldots,f_m/\\|f_m\\|)$ 是 $V$ 的标准正交基。\n\n**证明。** 顺序过程的前三步如下，其中我们反复使用了定理 4.1.4。\n\
  \n*步骤 1.* 令 $f_1=h_1$。根据定义，$f_1$ 非零。\n\n*步骤 2.* 令 $f_2=\\mathcal P_{(\\mathbb R\
  \ f_1)^\\perp}(h_2)$。则 $h_2=a^1f_1+f_2$ 对某个实数 $a^1$ 成立，故\n\n$$\\langle h_2,f_1\\\
  rangle=\\langle a^1f_1+f_2,f_1\\rangle=a^1\\langle f_1,f_1\\rangle,$$\n\n所以\n\n\
  $$a^1=\\frac{\\langle h_2,f_1\\rangle}{\\langle f_1,f_1\\rangle}.$$\n\n于是，\n\n$$f_2=h_2-\\\
  frac{\\langle h_2,f_1\\rangle}{\\langle f_1,f_1\\rangle}f_1.$$\n\n由于 $h_2$ 不在 $\\\
  mathbb R f_1=\\mathbb R h_1$ 中，故 $f_2$ 非零。\n\n*步骤 3.* 令 $f_3=\\mathcal P_{(\\mathbb\
  \ R f_1+\\mathbb R f_2)^\\perp}(h_3)$。则 $h_3=b^1f_1+b^2f_2+f_3$ 对某个实数 $b^1,b^2$\
  \ 成立，故\n\n$$\\langle h_3,f_1\\rangle=\\langle b^1f_1+b^2f_2+f_3,f_1\\rangle=b^1\\\
  langle f_1,f_1\\rangle$$\n\n且\n\n$\\langle h_3,f_2\\rangle=\\langle b^1f_1+b^2f_2+f_3,f_2\\\
  rangle=b^2\\langle f_2,f_2\\rangle,$\n\n所以\n\n$b^1=\\dfrac{\\langle h_3,f_1\\rangle}{\\\
  langle f_1,f_1\\rangle}\\quad\\text{and}\\quad b^2=\\dfrac{\\langle h_3,f_2\\rangle}{\\\
  langle f_2,f_2\\rangle}.$\n\n于是，\n\n$f_3=h_3-\\dfrac{\\langle h_3,f_1\\rangle}{\\\
  langle f_1,f_1\\rangle}f_1-\\dfrac{\\langle h_3,f_2\\rangle}{\\langle f_2,f_2\\\
  rangle}f_2.$\n\n由于 $h_3$ 不在 $\\mathbb{R}f_1\\oplus\\mathbb{R}f_2=\\mathbb{R}h_1\\\
  oplus\\mathbb{R}h_2$ 中，故 $f_3$ 非零。\n\n以此类推，经过 $m$ 步后我们得到 $\\mathcal{F}=(f_1,\\ldots,f_m)$。显然，由构造可知，$\\\
  mathcal{F}$ 是 $V$ 的正交基，且 $\\mathcal{E}$ 是 $V$ 的标准正交基。\n\n借助定理 4.6.9，我们现在能够给出定理 4.2.4\
  \ 的另一种证明。设 $(V,\\mathfrak{g})$ 为维数为 $m$ 且指标 $\\nu\\ne0$ 的数量积空间。由定理 4.1.6(a) 可知存在\
  \ $V$ 的子空间 $V^+$ 和 $V^-$ 使得 $V=V^+\\oplus V^-$，且 $\\mathfrak{g}$ 在 $V^+$ 上为内积，$-\\\
  mathfrak{g}$ 在 $V^-$ 上为内积。根据定理 4.6.9，$V^+$ 具有基 $(e_1,\\ldots,e_{m-\\nu})$，其关于内积\
  \ $\\mathfrak{g}|_{V^+}$ 标准正交。类似地，$V^-$ 具有基 $(e_{m-\\nu+1},\\ldots,e_m)$，其关于内积 $-\\\
  mathfrak{g}|_{V^-}$ 标准正交。则 $(e_1,\\ldots,e_{m-\\nu},e_{m-\\nu+1},\\ldots,e_m)$ 是\
  \ $V$ 的基，其关于数量积 $\\mathfrak{g}$ 标准正交（除非需要重新排序以符合签名中符号出现的约定）。\n\n在第 4.3 节中提到线性映射的伴随具有一种类似于矩阵对称性的对称性质。下一个结果的第\
  \ (b) 部分证实了这一观察。\n\n## 定理 4.6.10. 设 $(V,\\mathfrak{g})$ 为内积空间，$A:V\\longrightarrow\
  \ V$ 为线性映射，且 $\\mathcal{E}$ 为 $V$ 的标准正交基。则：\n\n- (a) $[A^\\dagger]_{\\mathcal{E}}=[A]_{\\\
  mathcal{E}}^{\\mathsf{T}}$。\n- (b) 若 $A$ 为自伴，则 $[A]_{\\mathcal{E}}$ 为对称矩阵。\n\n*证明。*\
  \ (a)：由于 $g_{\\mathcal{E}}$ 为单位矩阵，结果由定理 4.3.3 得出。\n\n(b)：由第 (a) 部分得出。\n\n## 定理 4.6.11.\
  \ 若 $(V,\\mathfrak{g})$ 和 $(W,\\mathfrak{h})$ 为具有相同维数的内积空间且 $A:V\\longrightarrow\
  \ W$ 为线性映射，则以下等价：\n\n- (a) $A$ 为线性等距。\n- (b) $A$ 将 $V$ 的某个标准正交基映射为 $W$ 的标准正交基。\n\
  - (c) $A$ 将 $V$ 的每个标准正交基映射为 $W$ 的标准正交基。\n\n*证明。* (a) $\\Rightarrow$ (c)：这由定理 4.4.1(b)\
  \ 得出。\n\n(c) $\\Rightarrow$ (b)：显而易见。\n\n(b) $\\Rightarrow$ (a)：设 $\\mathcal{E}=(e_1,\\\
  ldots,e_m)$ 为 $V$ 的标准正交基使得 $A(\\mathcal{E})$ 为 $W$ 的标准正交基。由于 $V$ 和 $W$ 为内积空间，\n\n\
  它们的签名均为 (+1,...,+1)。设 v, w 为 $V$ 中的向量，其中 v = Σ_i a^i e_i 且 w = Σ_j b^j e_j，故 A(v)\
  \ = Σ_i a^i A(e_i) 且 A(w) = Σ_j b^j A(e_j)。由定理 4.2.8，\n\n```\n⟨A(v), A(w)⟩ = Σ_i\
  \ a^i b^i = ⟨v, w⟩.\n```\n\n## 定理 4.6.12. 若 $(V, g)$ 为内积空间且 $A : V ⟶ V$ 为线性映射，则以下等价：\n\
  \n- (a) $A$ 为线性等距。\n- (b) $A$ 将 $V$ 的某个标准正交基映射为 $V$ 的标准正交基。\n- (c) $A$ 将 $V$ 的每个标准正交基映射为\
  \ $V$ 的标准正交基。\n- (d) ‖A(v)‖ = ‖v‖ 对所有 $V$ 中的向量 v 成立。\n- (e) 对每个 $V$ 的标准正交基 $\\mathcal{E}$，矩阵\
  \ $[A]_{\\mathcal{E}}^{\\mathcal{E}}$ 在第 2.4 节定义的正交群 $O(m)$ 中。\n\n证明。 (a) ⇔ (b)\
  \ ⇔ (c)：这只是将 $W = V$ 代入定理 4.6.11。\n\n(a) ⇔ (d)：这由定理 4.4.4 得出。\n\n(c) ⇔ (e)：设 $\\\
  mathcal{E} = (e₁, …, e_m)$，并注意到 $\\mathfrak{g}_\\mathcal{E} = I_m$。则\n\n```\n⟨A(e_i),\
  \ A(e_j)⟩ = ([A(e_i)]_ℰ)^T [A(e_j)]_ℰ [Th 3.1.2(a)]\n= ([A]_ℰ^ℰ [e_i]_ℰ)^T ([A]_ℰ^ℰ\
  \ [e_j]_ℰ) [Th 2.2.4]\n= (([A]_ℰ^ℰ)_(i))^T ([A]_ℰ^ℰ)_(j)\n= (([A]_ℰ^ℰ)^T)_(i) ([A]_ℰ^ℰ)_(j),\
  \ [Th 2.1.6(b)]\n```\n\n故\n\n```\n[⟨A(e_i), A(e_j)⟩] = ([A]_ℰ^ℰ)^T [A]_ℰ^ℰ.\n```\n\
  \n可得\n\n```\nA(ℰ) is orthonormal\n⇔ [⟨A(e_i), A(e_j)⟩] = I_m\n⇔ ([A]_ℰ^ℰ)^T [A]_ℰ^ℰ\
  \ = I_m\n⇔ [A]_ℰ^ℰ is in O(m).\n```\n\n## 4.7 特征值和特征向量\n\n设 $P$ 为 $Mat_{m×m}$ 中的矩阵，且\
  \ $x$ 为“不定元”。$P$ 的特征多项式定义为\n\n```\nchar_P(x) = det(x I_m − P).\n```\n\n## 定理 4.7.1.\
  \ 若 $P$ 和 $Q$ 为 $Mat_{m×m}$ 中的矩阵，且 $Q$ 可逆，则\n\n```\nchar_{Q^{-1} P Q}(x) = char_P(x).\n\
  ```\n\n证明。我们有\n\n$$xI_m - Q^{-1}PQ = Q^{-1}(xI_m - P)Q,$$\n\n故 $\\det(xI_m - Q^{-1}PQ)\
  \ = \\det(xI_m - P)$。\n\n设 $V$ 为维数为 $m$ 的向量空间，且 $A : V \\longrightarrow V$ 为线性映射。我们称实数\
  \ $\\kappa$ 为 $\\boldsymbol{A}$ 的特征值，如果存在 $V$ 中非零向量 $v$ 使得 $A(v) = \\kappa v$，或等价地，$(\\\
  kappa \\,\\mathrm{id}_V - A)(v) = 0$。在这种情况下，$v$ 称为对应于 $\\kappa$ 的 $\\boldsymbol{A}$\
  \ 的特征向量。由于 $A(c v) = c \\kappa v$ 对所有实数 $c$ 成立，若 $A$ 对应于 $\\kappa$ 存在一个特征向量，则存在无穷多个。\n\
  \n设 $\\mathcal{H}$ 为 $V$ 的基。$\\boldsymbol{A}$ 的特征多项式记为 $\\mathrm{char}_A(x)$ 并定义为\
  \ $[A]_{\\mathcal{H}}^{\\mathcal{H}}$ 的特征多项式：\n\n$$\\mathrm{char}_A(x) = \\det\\\
  left(xI_m - [A]_{\\mathcal{H}}^{\\mathcal{H}}\\right).$$\n\n我们注意到\n\n$$\\mathrm{char}_A(0)\
  \ = (-1)^m \\det(A). \\tag{4.7.1}$$\n\n## 定理 4.7.2. 在上述设定下，$\\mathrm{char}_A(x)$\
  \ 与基的选择无关。\n\n证明。设 $\\mathcal{F}$ 为另一基。由定理 2.2.6，\n\n$$xI_m - [A]_{\\mathcal{F}}^{\\\
  mathcal{F}} = [x \\,\\mathrm{id}_V - A]_{\\mathcal{F}}^{\\mathcal{F}}$$\n\n$$= \\\
  left([\\mathrm{id}_V]_{\\mathcal{F}}^{\\mathcal{H}}\\right)^{-1} [x \\,\\mathrm{id}_V\
  \ - A]_{\\mathcal{H}}^{\\mathcal{H}} [\\mathrm{id}_V]_{\\mathcal{F}}^{\\mathcal{H}}.$$\n\
  \n结果现在由定理 4.7.1 得出。\n\n## 定理 4.7.3. 设 $V$ 为向量空间，$A : V \\longrightarrow V$ 为线性映射，且\
  \ $\\kappa$ 为实数。则以下等价：\n\n- (a) $\\kappa$ 为 $A$ 的特征值。\n- (b) $\\det(\\kappa \\,\\\
  mathrm{id}_V - A) = 0$。\n- (c) $\\mathrm{char}_A(\\kappa) = 0$。\n\n证明。设 $\\mathcal{H}$\
  \ 为 $V$ 的基。我们有\n\n$\\kappa$ 为 $A$ 的特征值\n$\\iff$ $(\\kappa \\,\\mathrm{id}_V - A)(v)\
  \ = 0$ 对某个 $V$ 中非零向量 $v$ 成立\n$\\iff$ $\\ker(\\kappa \\,\\mathrm{id}_V - A) \\neq\
  \ \\{0\\}$\n$\\iff$ $\\kappa \\,\\mathrm{id}_V - A$ 不是线性同构\n$\\iff$ $\\det(\\kappa\
  \ \\,\\mathrm{id}_V - A) = 0$\n$\\iff$ $\\det\\left([\\kappa \\,\\mathrm{id}_V -\
  \ A]_{\\mathcal{H}}^{\\mathcal{H}}\\right) = 0$\n$\\iff$ $\\det\\left(\\kappa I_m\
  \ - [A]_{\\mathcal{H}}^{\\mathcal{H}}\\right) = 0$\n$\\iff$ $\\mathrm{char}_A(\\\
  kappa) = 0,$\n\n\n\n其中第三个等价性由定理 1.1.12 和定理 1.1.14 推出，第四个等价性由定理 2.5.3 推出。\n\n设 $V$\
  \ 是一个维数为 $m$ 的向量空间，设 $A:V\\to V$ 是一个线性映射。容易证明 $\\operatorname{char}_A(x)$ 是一个次数为\
  \ $m$、系数为实数的多项式。根据代数基本定理，$\\operatorname{char}_A(x)$ 在复数域中有 $m$ 个（不一定互不相同）根。在没有进一步假设的情况下，并不能保证其中任何一个是实数。以下我们关注\
  \ $m=2$ 的情形。\n\n## 定理 4.7.4.\n设 $(V,g)$ 是一个 2 维内积空间，设 $A:V\\to V$ 是一个自伴线性映射。则 $A$\
  \ 有两个实特征值，并且它们相等当且仅当 $A=c\\operatorname{Id}_V$ 对某个实数 $c$ 成立。\n\n*证明.* 设 $\\mathcal\
  \ E$ 是 $V$ 的一个标准正交基。根据定理 4.6.10(b)，$[A]_{\\mathcal E}^{\\mathcal E}$ 是对称的，所以\n\n\
  $$[A]_{\\mathcal E}^{\\mathcal E}=\\begin{bmatrix}a&b\\\\b&c\\end{bmatrix}$$\n\n\
  其中 $a$, $b$ 和 $c$ 为某些实数。则\n\n$$\\operatorname{char}_A(x)=\\det\\begin{pmatrix}x-a&-b\\\
  \\-b&x-c\\end{pmatrix}=x^2-(a+c)x+ac-b^2.$$\n\n由求根公式，$\\operatorname{char}_A(x)$\
  \ 的两个根为\n\n$$\\frac{a+c\\pm\\sqrt{(a-c)^2+4b^2}}{2}.$$\n\n由于 $(a-c)^2+4b^2\\ge 0$，两个根都是实数。它们相等当且仅当\
  \ $(a-c)^2+4b^2=0$，这等价于 $a=c$ 且 $b=0$；即 $[A]_{\\mathcal E}^{\\mathcal E}=cI_2$。\n\
  \n## 定理 4.7.5.\n设 $(V,g)$ 是一个 2 维内积空间，设 $A:V\\to V$ 是一个自伴线性映射，设 $\\kappa_1,\\kappa_2$\
  \ 为 $A$ 的（实数但不一定互不相同）特征值。则\n\n$$\\det(A)=\\kappa_1\\kappa_2.$$\n\n*证明.* 由于 $\\kappa_1$\
  \ 和 $\\kappa_2$ 是 $\\operatorname{char}_A(x)$ 的根，我们由多项式理论得到\n\n$$\\operatorname{char}_A(x)=(x-\\\
  kappa_1)(x-\\kappa_2),$$\n\n故 $\\operatorname{char}_A(0)=\\kappa_1\\kappa_2$。另一方面，(4.7.1)\
  \ 给出 $\\operatorname{char}_A(0)=\\det(A)$。\n\n## 定理 4.7.6 (欧拉旋转定理)。\n设 $(V,g)$ 是一个奇数维内积空间，设\
  \ $A:V\\to V$ 是一个线性等距映射。若 $\\det(A)=1$，则 $1$ 是 $A$ 的特征值。\n\n*注.* 回顾定理 4.4.3 可知 $\\\
  det(A)=\\pm1$，因此该断言是有意义的。\n\n**证明.** 设 $\\dim(V)=m$，设 $\\mathcal E$ 是 $V$ 的一个标准正交基。根据定理\
  \ 4.6.12，矩阵 $[A]_{\\mathcal E}$ 在 $O(m)$ 中，所以 $([A]_{\\mathcal E})^{\\mathsf T}[A]_{\\\
  mathcal E}=I_m$。则\n\n\\[\n\\left([\\operatorname{id}_V-A]_{\\mathcal E}\\right)^{\\\
  mathsf T}\n=\\left(I_m-[A]_{\\mathcal E}\\right)^{\\mathsf T}\n=\\left(-[A]_{\\\
  mathcal E}\\right)^{\\mathsf T}\\left(I_m-[A]_{\\mathcal E}\\right)\n=\\left(-[A]_{\\\
  mathcal E}\\right)\\left([\\operatorname{id}_V-A]_{\\mathcal E}\\right),\n\\]\n\n\
  故\n\n\\[\n\\det(\\operatorname{id}_V-A)=(-1)^m\\det(A)\\det(\\operatorname{id}_V-A)=-\\\
  det(\\operatorname{id}_V-A),\n\\]\n\n所以 $\\det(\\operatorname{id}_V-A)=0$。根据定理 4.7.3，$\\\
  kappa=1$ 是 $A$ 的特征值。\n\n根据定理 4.6.12，内积空间上的线性等距映射“保持范数”，并且正如我们在第 9.3 节中将看到的，这意味着它也“保持距离”。这样的线性等距映射被称为关于原点的“刚体运动”。定理\
  \ 4.7.10 有一个解释，与这些观察非常契合。假设 1 是 $A$ 的特征值，对应的特征向量为 $v$。则 $A(cv)=cv$ 对所有实数 $c$ 成立，所以\
  \ $A$ 固定子空间 $\\mathbb Rv$。因此，$A$ 的作用是对原点进行刚性旋转，以 $\\mathbb Rv$ 作为“旋转轴”。\n\n## 4.8\
  \ 洛伦兹向量空间\n\n洛伦兹向量空间在狭义相对论中起着核心作用，并由此在广义相对论中也起作用。洛伦兹向量空间的几何比内积空间的几何复杂得多。正如我们将看到的，翻译成物理术语，其含义对我们的欧几里得直觉来说可能是惊人的。\n\
  \n设 $(V,g)$ 是一个非零标量积空间。我们称 $g$ 为 **洛伦兹标量积**，并称对 $(V,g)$ 为 **洛伦兹向量空间**，如果 $\\operatorname{ind}(g)=1$。根据我们的符号约定，$g$\
  \ 的符号因此为 $(+1,\\ldots,+1,-1)$。回顾第 3.1 节中，向量 $v$ 在 $V$ 中为：\n\n- **类空** 若 $v=0$ 或\
  \ $\\langle v,v\\rangle>0$。\n- **类时** 若 $\\langle v,v\\rangle<0$。\n- **类光** 若 $v\\\
  ne0$ 且 $\\langle v,v\\rangle=0$。\n\n因此，根据定义，$e_1,\\ldots,e_{m-1}$ 是类空的而 $e_m$ 是类时的。这里采用的符号约定并不是文献中唯一的约定。例如，一些作者取符号为\
  \ $(-1,+1,\\ldots,+1)$。选择一种方法而非另一种方法可能导致表达式中负号的数量和位置不同，但不影响实质。\n\n设 $U$ 是 $V$ 的一个非零子空间。若\
  \ $g$ 在 $U$ 上非退化，则根据定理 4.2.6，\n\n\\[\n\\operatorname{ind}(g|_U)+\\operatorname{ind}(g|_{U^\\\
  perp})=1.\n\\]\n\n因此，ind(g|_U) 等于 0 或 1。我们称 $U$ 为：\n\n- **类空** 若 $g$ 在 $U$ 上非退化且\
  \ ind(g|_U) = 0；即 $g$ 在 $U$ 上是内积。\n- **类时** 若 $g$ 在 $U$ 上非退化且 ind(g|_U) = 1；即 $g$\
  \ 在 $U$ 上是洛伦兹标量积。 (4.8.1)\n- **类光** 若 $g$ 在 $U$ 上退化。\n\n显然，$V$ 的每个子空间都是类空、类时或类光的。根据约定，$V$\
  \ 的零子空间被视为类空。我们由 (4.8.1) 看到，与内积的情况不同，$V$ 上的洛伦兹标量积可能在 $U$ 上退化，因此在 $U$ 上不是标量积（更不用说洛伦兹标量积了）。回顾第\
  \ 3.1 节，$V$ 的光集为\n\nΛ = { v ∈ V : ⟨v, v⟩ = 0 } \\ {0}.\n\n在当前背景下，我们将 Λ 称为 $V$ 的光锥，原因将在不久后变得清楚。\n\
  \n## 例 4.8.1 (ℝ₁^m)。继续例 4.1.1，设 ν = 1。在此情形下，我们用 m 表示 s。则\n\nm : ℝ^m × ℝ^m ⟶ ℝ\n\n\
  是函数\n\nm((x¹, …, x^m), (y¹, …, y^m)) = Σ_{i=1}^{m-1} x^i y^i − x^m y^m.\n\n我们称\n\
  \nℝ₁^m = (ℝ^m, m)\n\n为闵可夫斯基 m-空间，并称 m 为闵可夫斯基标量积。ℝ₁^m 的标准基与 ℝ₀^m（和 ℝ^m）的标准基相同。对应于\
  \ m 的范数由\n\n‖(x¹, …, x^m)‖ = √| Σ_{i=1}^{m-1} (x^i)² − (x^m)² | ,\n\n给出，且 ℝ₁^m 的光锥记为\
  \ Λ_m。在 ℝ₁³ 中，例如，我们有\n\n‖(x, y, z)‖ = √|x² + y² − z²|\n\n且\n\nΛ₃ = { (x, y, z) ∈\
  \ ℝ₁³ : x² + y² − z² = 0 } \\ { (0,0,0) }.\n\n见图 4.8.1。在几何上，Λ₃ 是去掉顶点的一对锥的并集。稍作解析几何可知，$\\\

  )(v₁,…,vₗ₋₁,eᵢ,vₗ,…,vₛ₋₁), eᵢ⟩\n- \n- 对所有向量 v₁,…,vₛ₋₁ 在 V 中成立，其中 ℛₛ 由 (5.3.1) 给出。\n\
  \n- (b) 对于 s = 1，实数 C₁¹(\U0001D49C) 由下式给出\n- \n- C₁¹(\U0001D49C) = Σᵢ εᵢ⟨ℛ⁻¹(\U0001D49C\
  )(eᵢ), eᵢ⟩,\n- \n- 其中 ℛ 由 (5.3.2) 给出。\n\n证明。 (a)：根据定理 5.4.5，Cₗ¹(\U0001D49C) 关于 (e₁,…,eₘ)\
  \ 的分量为\n\nCₗ¹(\U0001D49C)(eⱼ₁,…,eⱼₛ₋₁) = Cₗ¹(\U0001D49C)ⱼ₁…ⱼₛ₋₁ = Σₚ \U0001D49C\
  ⱼ₁…ⱼₗ₋₁ p p jₗ…ⱼₛ₋₁. (6.1.1)\n\n我们由定理 5.3.1(c) 得到\n\n\U0001D505ₛ⁻¹(\U0001D49C)(e_{j₁},…,e_{j_{i-1}},e_p,e_{j_i},…,e_{j_{s-1}})\
  \ = Σ_q \U0001D49C_{j₁…j_{i-1}p j_i…j_{s-1}}^q e_q,\n\n故\n\n⟨\U0001D505ₛ⁻¹(\U0001D49C\

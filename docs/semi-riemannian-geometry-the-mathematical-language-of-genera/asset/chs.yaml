  \n$\\langle\\star(\\xi^I),\\xi^J\\rangle^{\\Lambda}\\Omega_V = \\xi^I \\wedge \\\
  xi^J.$\n\n对于 $J = I^c$，我们有\n\n$\\xi^I \\wedge \\xi^{I^c} = \\operatorname{sgn}(\\\

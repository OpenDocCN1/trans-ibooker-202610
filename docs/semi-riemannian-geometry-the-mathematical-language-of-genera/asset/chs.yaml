  _i^j = Σ_i \U0001D49C_i^i\n= C₁¹(\U0001D49C). [Th 5.4.2]\n\n## 6.2 平坦映射\n\n设 (V,\U0001D524\
  ) 为标量积空间，设 ℋ = (h₁,…,h_m) 为 V 的基，设 (θ¹,…,θ^m) 为其对偶基。由 (5.1.1) 回顾可知 \U0001D4AF₀¹(V)\

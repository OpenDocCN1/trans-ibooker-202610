  gamma].$$\n\n将 (22.1.8)、(22.1.16) 和 (22.1.18) 代入 (22.1.15)，得到\n\n$$[F\\circ A\\\
  circ G]=\\begin{bmatrix} I_{m-2} & O_{(m-2)\\times1}\\\\ O_{1\\times(m-2)} & \\\
  varepsilon\\gamma\\\\ 0&\\cdots&0&-\\varepsilon\\beta\\gamma\\end{bmatrix}\\begin{bmatrix}0\\\
  \\ \\vdots\\\\ 0\\\\ -\\beta\\gamma\\\\ \\gamma\\end{bmatrix} = \\begin{bmatrix}\
  \ I_{m-2} & O_{(m-2)\\times2}\\\\ O_{2\\times(m-2)} & \\begin{bmatrix}\\varepsilon\\\
  gamma&-\\beta\\gamma\\\\ -\\varepsilon\\beta\\gamma&\\gamma\\end{bmatrix}\\end{bmatrix}.$$\n\
  \n由构造可知，$(P_1,\\ldots,P_{m-1})$ 和 $(Q_1,\\ldots,Q_{m-2},R_{m-1})$ 是 $\\operatorname{Mat}_{(m-1)\\\
  times1}$ 的正定向标准正交基。由 (22.1.7)、定理 22.1.10(b) 和 (22.1.13) 可得\n\n$$\\det(P)=\\det(R)=1.$$\n\
  \n由于 $A$ 属于 $L_m^{+\\dagger}$，\n\n$$\\begin{aligned}1&=\\det([A])\\\\ &=\\det(P[A]R^T)\
  \ &&[(22.1.20)]\\\\ &=\\det([F][A][G]) &&[(22.1.14)]\\\\ &=\\det([F\\circ A\\circ\
  \ G]) &&[\\text{Th 2.2.2(c)}]\\\\ &=\\varepsilon(\\gamma^2-\\beta^2\\gamma^2) &&[(22.1.19)]\\\
  \\ &=\\varepsilon, &&[(22.1.3)]\\end{aligned}$$\n\n所以 (22.1.19) 变为\n\n$$[F\\circ\
  \ A\\circ G]=\\begin{bmatrix} I_{m-2} & O_{(m-2)\\times2}\\\\ O_{2\\times(m-2)}\
  \ & \\begin{bmatrix}\\gamma&-\\beta\\gamma\\\\ -\\beta\\gamma&\\gamma\\end{bmatrix}\\\
  end{bmatrix}.$$\n\n根据定义，$\\beta$ 和 $\\gamma$ 满足 (22.1.2)。因此，$F\\circ A\\circ G$\
  \ 属于 $B_m$。由 (22.1.6)、(22.1.7)、定理 22.1.10(c) 和 (22.1.14) 可知 $F$ 属于 $R_m$。类似地，由 (22.1.12)、(22.1.13)、定理\
  \ 22.1.10(c) 和 (22.1.14) 可知 $G$ 属于 $R_m$。由定理 22.1.6 可知 $F^{-1}$ 和 $G^{-1}$ 属于 $R_m$。令\
  \ $B=F\\circ A\\circ G$，$R_1=F^{-1}$，$R_2=G^{-1}$，则 $A=R_1\\circ B\\circ R_2$，这就是用两个旋转和一个推进表示\
  \ $A$ 的所需表达式。\n\n# 22.2 麦克斯韦方程组\n\n设 $(x, y, z, t)$ 是 $\\mathbb{R}_0^3 \\times \\\
  mathbb{R}$ 上的标准坐标。在下文中，我们把 $x, y, z$ 看作“空间”变量，把 $t$ 看作“时间”变量。利用 10.6 节中的微分算子，$\\\
  mathbb{R}_0^3 \\times \\mathbb{R}$ 中的**电磁场**由**麦克斯韦方程组**刻画：\n\n[M1] $\\operatorname{div}(E)\
  \ = \\frac{1}{\\epsilon_0} \\rho$\n[M2] $\\operatorname{div}(B) = 0$\n[M3] $\\operatorname{curl}(E)\
  \ = -\\frac{\\partial B}{\\partial t}$\n[M4] $\\operatorname{curl}(B) = \\mu_0 J\
  \ + \\mu_0 \\epsilon_0 \\frac{\\partial E}{\\partial t}$，\n\n其中 $\\mathfrak{X}(\\\
  mathbb{R}_0^3 \\times \\mathbb{R})$ 中的向量场 $E, B, J$ 分别是**电场**、**磁场**和**电流密度**；$C^\\\
  infty(\\mathbb{R}_0^3 \\times \\mathbb{R})$ 中的函数 $\\rho$ 是**电荷密度**；实数 $\\epsilon_0$\
  \ 和 $\\mu_0$ 分别是**真空电容率**和**真空磁导率**。我们将上述恒等式中的算子 div 和 curl 解释为仅作用于空间变量，对后面出现的其他向量微积分算子也是如此。让我们假设已选定单位使得\
  \ $c = 1$，其中 $c = \\mu_0 \\epsilon_0$ 是光速。因此，[M4] 变为\n\n[M4'] $\\operatorname{curl}(B)\
  \ = \\mu_0 J + \\frac{\\partial E}{\\partial t} = \\frac{1}{\\epsilon_0} J + \\\
  frac{\\partial E}{\\partial t}$.\n\n我们注意到 $J$ 和 $\\rho$ 不是彼此独立的：\n\n$0 = \\operatorname{div}(\\\
  operatorname{curl}(B))$ [Th 10.6.1(d)]\n$= \\operatorname{div}\\left(\\frac{\\partial\
  \ E}{\\partial t} + \\mu_0 J\\right)$ [M4']\n$= \\frac{\\partial(\\operatorname{div}(E))}{\\\
  partial t} + \\mu_0 \\operatorname{div}(J)$\n$= \\frac{1}{\\epsilon_0} \\frac{\\\
  partial \\rho}{\\partial t} + \\mu_0 \\operatorname{div}(J)$. [M1]\n\n于是由 $\\mu_0\
  \ \\epsilon_0 = 1$ 得\n\n$\\operatorname{div}(J) + \\frac{\\partial \\rho}{\\partial\
  \ t} = 0,$ (22.2.1)\n\n这称为**连续性方程**。\n\n本节其余部分致力于寻找麦克斯韦方程组的其他表达形式，尤其是用微分形式表达的形式。这是展示前面开发的一些计算工具的一个机会。\n\
  \n让我们使用所谓的势来重新表述麦克斯韦方程组。由定理 10.6.3 和 [M2] 可知，存在 $\\mathfrak{X}(\\mathbb{R}_0^3 \\\
  times \\mathbb{R})$ 中的一个向量场 $A$，称为**磁势**，使得\n\n$B = \\operatorname{curl}(A).$ (22.2.2)\n\
  \n\n\n\n于是，[M3] 给出\n\ncurl(E) = -curl(∂A/∂t)\n\n因此\n\ncurl(E + ∂A/∂t) = 0.\n\n由定理\
  \ 10.6.2，存在一个函数 φ ∈ C^∞(ℝ₀³ × ℝ)，称为电势，使得\n\nE + ∂A/∂t = -grad(φ)\n\n所以\n\nE = -(grad(φ)\
  \ + ∂A/∂t)    (22.2.3)\n\n方程 (22.2.2) 和 (22.2.3) 用 A 和 φ 表示 E 和 B。就目前而言，这一表示并不唯一。例如，设\
  \ ψ 是 C^∞(ℝ₀³ × ℝ) 中的任意函数，并令\n\nÃ = A + grad(ψ)      且       φ̃ = φ - ∂ψ/∂t\n\n\
  这称为 A 和 φ 的规范变换。于是\n\ngrad(φ̃) + ∂Ã/∂t = grad(φ - ∂ψ/∂t) + ∂/∂t(A + grad(ψ))\n\n\
  = grad(φ) + ∂A/∂t\n\n并且由定理 10.6.1(c)，\n\ncurl(Ã) = curl(A) + curl(grad(ψ)) = curl(A).\n\
  \n因此，Ã 和 φ̃ 也满足 (22.2.2) 和 (22.2.3)。势的范围受到约束\n\ndiv(A) + ∂φ/∂t = 0,    (22.2.4)\n\
  \n的限制，该约束称为洛伦兹规范。\n\n## 定理 22.2.1. 在洛伦兹规范下，麦克斯韦方程组等价于：\n\n□(A) = -μ₀J\n\n□(φ) =\
  \ -1/ε₀ ρ\n\n其中 □ 是达朗贝尔算子，如例 20.7.3 所定义。\n\n证明. 假设麦克斯韦方程组成立。由 (22.2.4) 有\n\ndiv(∂A/∂t)\
  \ + ∂²φ/∂t² = 0,  (22.2.5)\n\n因此\n\n1/ε₀ ρ = div(E)  [M1]\n= −div(grad(φ)) − div(∂A/∂t)\
  \  [(22.2.3)]\n= −lap(φ) − div(∂A/∂t)  [表 10.6.1]\n= −(lap(φ) − ∂²φ/∂t²)  [(22.2.5)]\n\
  = −□(φ).\n\n同样地，我们有\n\nμ₀ J = curl(B) − ∂E/∂t  [M4′]\n= curl(curl(A)) + ∂/∂t(grad(φ)\
  \ + ∂A/∂t)  [(22.2.2), (22.2.3)]\n= grad(div(A)) − lap(A) + grad(∂φ/∂t + ∂²A/∂t²)\
  \  [定理 10.6.1(e)]\n= −lap(A) + ∂²A/∂t²  [(22.2.4)]\n= −□(A).\n\n反过来，假设 □(A) = −μ₀\
  \ J 和 □(φ) = −ρ/ε₀ 成立。前面的计算“反过来”表明麦克斯韦方程组成立。\n\n现在，我们把关注点从 ℝ₀³ × ℝ 转到 ℝ₁⁴，并用微分形式重新表述前面的讨论。设\
  \ J = (J¹, J², J³), E = (E¹, E², E³), A = (A¹, A², A³)，B = (B¹, B², B³)，并定义 \U0001D51B\
  *(ℝ₁⁴) 中相应的余向量场 \U0001D4A5、ℰ、\U0001D49C 以及 Λ²(ℝ₁⁴) 中的形式 ℬ、ℱ 如下：\n\n\U0001D4A5 =\
  \ 1/ε₀ [J¹ d(x) + J² d(y) + J³ d(z) − ρ d(t)],\nℰ = E¹ d(x) + E² d(y) + E³ d(z),\n\
  \U0001D49C = A¹ d(x) + A² d(y) + A³ d(z) − φ d(t),  (22.2.6)\nℬ = B¹ d(y) ∧ d(z)\
  \ + B² d(z) ∧ d(x) + B³ d(x) ∧ d(y),\n\n以及\n\nℱ = ℰ ∧ d(t) + ℬ\n= E¹ d(x) ∧ d(t)\
  \ + E² d(y) ∧ d(t) + E³ d(z) ∧ d(t)\n+ B¹ d(y) ∧ d(z) + B² d(z) ∧ d(x) + B³ d(x)\
  \ ∧ d(y).\n\n这证明了连续性方程的恒等式。由定理 4.5.4 的流形版本和 (22.2.6) 可得 \U0001D49C^S=(A^1,A^2,A^3,φ)，因此\n\
  \n-δ(\U0001D49C)=Div(\U0001D49C^S) [定理 20.4.3(b)]\n\n=∂A^1/∂x+∂A^2/∂y+∂A^3/∂z+∂φ/∂t\
  \ [例 20.4.6]\n\n=div(A)+∂φ/∂t,\n\n这证明了洛伦兹规范的恒等式。\n\n## 定理 22.2.4. 在洛伦兹规范 (22.2.4)\
  \ 下，麦克斯韦方程组等价于：\n\nd(\U0001D49C)=ℱ\n\nΔ(\U0001D49C)=\U0001D4A5,\n\n其中 Δ 是拉普拉斯–德拉姆算子，如\
  \ (20.8.1) 所定义。\n\n证明. 我们需要几个预备观察。在例 16.1.9 中令 ω=\U0001D49C，于是 (α₁,α₂,α₃,α₄)=(A¹,A²,A³,−φ)，得到\n\
  \nd(\U0001D49C)= (−∂φ/∂x−∂A¹/∂t)d(x)∧d(t)+(−∂φ/∂y−∂A²/∂t)d(y)∧d(t)\n+(−∂φ/∂z−∂A³/∂t)d(z)∧d(t)\n\
  +(∂A³/∂y−∂A²/∂z)d(y)∧d(z)+(∂A¹/∂z−∂A³/∂x)d(z)∧d(x)\n+(∂A²/∂x−∂A¹/∂y)d(x)∧d(y).\n\
  \n我们还有\n\ngrad(φ)+∂A/∂t=(∂φ/∂x+∂A¹/∂t,∂φ/∂y+∂A²/∂t,∂φ/∂z+∂A³/∂t)\n\n以及\n\ncurl(A)=(∂A³/∂y−∂A²/∂z,∂A¹/∂z−∂A³/∂x,∂A²/∂x−∂A¹/∂y).\n\
  \n因此，d(\U0001D49C)=ℱ 当且仅当 (22.2.2) 和 (22.2.3) 成立，这就是我们的第一个预备观察。由 (20.8.1) 和定理 22.2.3\
  \ 可得\n\nΔ(\U0001D49C)=dδ(\U0001D49C)+δd(\U0001D49C)=dδ(\U0001D49C), (22.2.7)\n\n\
  这就是我们的第二个预备观察。\n\n现在进行主要证明。假设麦克斯韦方程组成立。那么 (22.2.2) 和 (22.2.3) 成立，从而 d(\U0001D49C\
  )=ℱ，这证明了第一个恒等式。由于 d(\U0001D49C)=ℱ，由定理 22.2.2 和 (22.2.7) 可得 Δ(\U0001D49C)=δd(\U0001D49C\
  )=δ(ℱ)=\U0001D4A5，这证明了第二个恒等式。反过来，假设 d(\U0001D49C)=ℱ 和 Δ(\U0001D49C)=\U0001D4A5 成立。由定理\
  \ 16.1.1(c) 可得 d(ℱ)=d²(\U0001D49C)=0，并由 (22.2.7) 可得 \U0001D4A5=Δ(\U0001D49C)=δd(\U0001D49C\
  )=δ(ℱ)。根据定理 22.2.2，麦克斯韦方程组成立。\n\n## 22.3 爱因斯坦张量\n\n设 $(M,\\mathfrak{g})$ 是一个半黎曼流形，并设\
  \ $\\mathcal{R}$ 为黎曼曲率张量。$\\mathcal{T}_2^0(M)$ 中的里奇曲率张量（场）定义为\n\nR = C_{14}(\\mathcal{R})\n\
  \n(22.3.1)\n\n$C^{\\infty}(M)$ 中的标量曲率（函数）定义为\n\nS = C_{12}(R)\n\n(22.3.2)\n\n并且\
  \ $\\mathcal{T}_2^0(M)$ 中的爱因斯坦张量（场）定义为\n\nG = R - \\frac{1}{2} S\\mathfrak{g}.\n\
  \n在物理学中，术语“里奇曲率张量”、“标量曲率”和“爱因斯坦张量”通常只在 $M$ 是洛伦兹 4-流形时使用，但我们将继续在更一般的背景下讨论。\n\n##\
  \ 定理 22.3.1（里奇曲率的局部坐标表达式）。\n\n设 $(M,\\mathfrak{g})$ 是一个半黎曼流形，则在局部坐标下有：\n\n(a)\n\n\
  R_{ij} = \\sum_{k} R_{kij}^{k}\n\n= \\sum_{k} \\left( \\frac{\\partial \\Gamma_{ij}^{k}}{\\\
  partial x^{k}} - \\frac{\\partial \\Gamma_{jk}^{k}}{\\partial x^{i}} \\right) +\
  \ \\sum_{kl} (\\Gamma_{kl}^{k} \\Gamma_{ij}^{l} - \\Gamma_{il}^{k} \\Gamma_{jk}^{l}).\n\
  \n(22.3.3)\n\n(b) R 是对称的；即对所有 $i,j = 1,\\dots,m$，有 $R_{ij} = R_{ji}$。\n\n证明. 一个预备结果是\n\
  \nR_{ij} = C_{14}(\\mathcal{R})_{ij} [(22.3.1)]\n\n= C_{1} \\circ S_{4}^{1}(\\mathcal{R})_{ij}\
  \ [(19.6.2)]\n\n= \\sum_{kl} \\mathfrak{g}^{kl} \\mathcal{R}_{kijl}. [流形版本定理 6.3.5(a)]\n\
  \n(22.3.4)\n\n(a)：我们有\n\nR_{ij} = \\sum_{kl} \\mathfrak{g}^{kl} \\mathcal{R}_{kijl}\
  \ [(22.3.4)]\n\n= \\sum_{kl} \\mathfrak{g}^{kl} \\left( \\sum_{n} \\mathfrak{g}_{ln}\
  \ R_{kij}^{n} \\right) [定理 19.8.2(a)]\n\n= \\sum_{kn} \\left( \\sum_{l} \\mathfrak{g}^{kl}\
  \ \\mathfrak{g}_{ln} \\right) R_{kij}^{n} = \\sum_{kn} \\delta_{n}^{k} R_{kij}^{n}\
  \ = \\sum_{k} R_{kij}^{k},\n\n这证明了第一个等式。第二个等式由定理 18.7.2 得出。\n\n(b)：定理 19.8.5 中黎曼曲率对称性的局部坐标版本给出\n\
  \n\\mathcal{R}_{kijl}=\\mathcal{R}_{jlki}=\\mathcal{R}_{ljik}.\n\n于是\n\nR_{ij}=\\\
  sum_{kl}g^{kl}R_{kijl}\n=\\sum_{kl}g^{lk}R_{ljik}\n=R_{ji}.\n\n## 定理 22.3.2（里奇曲率的标准正交标架表达式）。\n\
  \n设 $(M,g)$ 是一个带符号差 $(\\varepsilon_1,\\ldots,\\varepsilon_m)$ 的半黎曼 $m$-流形，设 $(E_1,\\\
  ldots,E_m)$ 是 $M$ 中开集 $U$ 上的标准正交标架，并设 $X,Y$ 是 $\\mathfrak{X}(M)$ 中的向量场。则：\n\n(a)\n\
  \nR(X,Y)=\\sum_i \\varepsilon_i\\mathcal{R}(E_i,X,Y,E_i)\n\n在 $U$ 上成立。\n\n(b) $R$\
  \ 是对称的；即对所有向量场 $X,Y \\in \\mathfrak{X}(M)$，有 $R(X,Y)=R(Y,X)$。\n\n证明. (a)：这由定理 19.6.2(a)\
  \ 和 (22.3.1) 得出。\n\n(b)：由定理 19.8.5，\n\n\\mathcal{R}(E_i,X,Y,E_i)=\\mathcal{R}(Y,E_i,E_i,X)=\\\
  mathcal{R}(E_i,Y,X,E_i).\n\n现在由 (a) 部分得出结果。\n\n## 定理 22.3.3（标量曲率的局部坐标表达式）。\n\n设\
  \ $(M,g)$ 是一个半黎曼流形，则在局部坐标下有\n\nS=\\sum_{ij}g^{ij}R_{ij}.\n\n证明. 由 (19.6.3) 和 (22.3.2)\
  \ 可得\n\nS=C_{12}(R)=C^1_\\circ S^1_1(R).\n\n现在由定理 6.3.5(b) 的流形版本得出结果。\n\n## 定理 22.3.4（标量曲率的标准正交标架表达式）。\n\
  \n设 $(M,g)$ 是一个带符号差 $(\\varepsilon_1,\\ldots,\\varepsilon_m)$ 的半黎曼流形，且 $(E_1,\\\
  ldots,E_m)$ 是 $M$ 中开集 $U$ 上的标准正交标架，则\n\nS=\\sum_i\\varepsilon_i\\mathcal{R}(E_i,E_i)\n\
  \n在 $U$ 上成立。\n\n\n\n\n## 22.3 爱因斯坦张量\n\n证明。这由定理 19.6.2(b) 和 (22.3.2) 可得。\n\n**定理\
  \ 22.3.5 (Ricci 曲率散度的正交标架表达式)。** 设 \\((M,\\mathfrak{g})\\) 为签名为 \\((\\varepsilon_1,\\\
  dots,\\varepsilon_m)\\) 的半黎曼 \\(m\\)-流形，设 \\((E_1,\\dots,E_m)\\) 为 \\(M\\) 上开集 \\\
  (U\\) 上的一个正交标架，且 \\(X\\) 为 \\(\\mathfrak{X}(M)\\) 中的一个向量场。则\n\n\\[\n\\operatorname{Div}(\\\
  mathrm{R})(X)=\\sum_i \\varepsilon_i \\nabla_{E_i}(\\mathrm{R})(X,E_i)=\\sum_i \\\
  varepsilon_i \\nabla_{E_i}(\\mathrm{R})(E_i,X)\n\\]\n\n在 \\(U\\) 上成立。\n\n证明。这由定理\
  \ 20.9.1 和定理 22.3.2(b) 可得。\n\n**定理 22.3.6。** 若 \\((M,\\mathfrak{g})\\) 为半黎曼 \\(m\\\
  )-流形，则：\n\n- (a) \\[\n\\operatorname{Div}(\\mathrm{R})=\\frac12 d(\\mathrm{S})=\\\

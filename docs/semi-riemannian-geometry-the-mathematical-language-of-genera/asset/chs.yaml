  \ dλ³/dt(t₀))⟩\n= ⟨V_p, v⟩.\n```\n\n由于 $p$ 和 $v$ 是任意的，可知 $V$ 是沿 $M$ 的法向量场且 $T_p(M)\\\
  subseteq (\\mathbb{R}V_p)^\\perp$ 对所有 $p\\in M$ 成立。 我们由定理 12.2.1 的部分 (a) 和 (c) 得到\
  \ $V$ 在 $M$ 上处处非零且 $W=V/\\|V\\|$ 是沿 $M$ 的单位法向量场。 由于 $f$ 光滑，故 $V$ 也是，由定理 12.2.1(c)，$W$\
  \ 也是；即 $W$ 是 $\\mathfrak{X}_{\\mathbb{R}^3_\\nu}(M)$ 中的向量场。 显然，$W$ 满足 [V2]。 由于 $T_p(M)\\\
  subseteq (\\mathbb{R}V_p)^\\perp=(\\mathbb{R}W_p)^\\perp$，且根据定理 11.3.1(a)，$T_p(M)$\
  \ 是 2 维的，可知 $(\\mathbb{R}W_p)^\\perp$ 是 2 维或 3 维的。 后一种可能性被排除，因为此时 $(\\mathbb{R}W_p)^\\\
  perp=\\mathbb{R}^3_\\nu$，故 $\\langle W_p,W_p\\rangle=0$，这与 $W$ 满足 [V2] 的事实矛盾。 从而，$(\\\
  mathbb{R}W_p)^\\perp$ 是 2 维的，所以 $T_p(M)=(\\mathbb{R}W_p)^\\perp$。 根据定理 4.1.2(c)，$T_p(M)=(\\\
  mathbb{R}V_p)^\\perp$ 对所有 $p\\in M$ 成立；即 $W$ 满足 [V1]。 由部分 (a) 和定理 12.2.5 可知 $(M,g)$\
  \ 是 ℝ³_ν 中的正则曲面。\n\n设 $(M,g)$ 是 ℝ³_ν 中的正则曲面。 我们由定理 12.2.5 得到存在沿 $M$ 的 (不一定光滑的) 单位法向量场\
  \ $V$ 满足 [V1] 和 [V2]。 如定理 12.2.4 的证明中所指出的，由于 $V$ 是单位向量场，[V2] 等价于：$\\langle V_p,V_p\\\
  rangle=1$ 对所有 $p\\in M$ 成立，或 $\\langle V_p,V_p\\rangle=-1$ 对所有 $p\\in M$ 成立。 $\\\
  langle V_p,V_p\\rangle$ 的共同值记为 $\\epsilon_M$ 并称为 $M$ 的符号。 从而，\n\n$$\\epsilon_M=\\\

  \ v₁, ..., \\widehat{v_l}, ..., v_{s+1}).\n\n[F2] 对于 r ≥ 2 且 1 ≤ k ≤ r − 1：\n\n\
  F_l^k(\U0001D49C)(η¹, ..., η^{r−1}, v₁, ..., v_{s+1}) = \U0001D49C(η¹, ..., η^{k−1},\
  \ v_l^F, η^k, ..., η^{r−1}, v₁, ..., \\widehat{v_l}, ..., v_{s+1}).\n\n[F3] 对于 r\
  \ ≥ 2 且 k = r：\n\nF_l^r(\U0001D49C)(η¹, ..., η^{r−1}, v₁, ..., v_{s+1}) = \U0001D49C\
  (η¹, ..., η^{r−1}, v_l^F, v₁, ..., \\widehat{v_l}, ..., v_{s+1}).\n\n计算过程对 [F2]\
  \ 最为透明：提取第 l 个协变位置的向量，使其平坦化，并将结果插入第 k 个逆变位置。\n\n例 6.2.1。 为说明 [F1]，设 r = 1（从而 k =\
  \ 1）且 s = 0（从而 l = 1），并设 w 为 \U0001D4AF₀¹(V) = V 中的向量。则 \U0001D4AF₁⁰(V) = V* 中的余向量\
  \ F₁¹(w) 由下式给出\n\nF₁¹(w)(v) = w(v^F) 对所有向量 v 在 V 中成立。我们由 (1.2.3) 和 (3.3.1) 得到 w(v^F)\
  \ = v^F(w) = ⟨v, w⟩ = ⟨w, v⟩ = w^F(v) = F(w)(v)，故 F₁¹(w)(v) = F(w)(v)。由于 v 和 w 是任意的，F₁¹\
  \ = F。\n\n为说明 [F2]，设 r = 2（从而 k = 1）且 s = 0（从而 l = 1），并设 \U0001D49C 为 \U0001D4AF\
  ₀²(V) 中的张量。则 \U0001D4AF₁¹(V) 中的张量 F₁¹(\U0001D49C) 由 F₁¹(\U0001D49C)(η, v) = \U0001D49C\
  (v^F, η) 给出。\n\n为说明 [F3]，设 r = 2（从而 k = 2）且 s = 0（从而 l = 1），并设 \U0001D49C 为 \U0001D4AF\
  ₀²(V) 中的张量。则 \U0001D4AF₁¹(V) 中的张量 F₁²(\U0001D49C) 由 F₁²(\U0001D49C)(η, v) = \U0001D49C\
  (η, v^F) 给出。\n\n例 6.2.2。 设 \U0001D49C 为 \U0001D4AF₁¹(V) 中的张量。对于 r = s = 1，存在 k =\
  \ 1 且 l = 1,2 的平坦映射。对于 k = 1 且 l = 1，张量 F₁¹(\U0001D49C) 在 \U0001D4AF₂⁰(V) 中由 F₁¹(\U0001D49C\
  )(v₁, v₂) = \U0001D49C(v₁^F, v₂) 给出。对于 k = 1 且 l = 2，张量 F₂¹(\U0001D49C) 在 \U0001D4AF\
  ₂⁰(V) 中由 F₂¹(\U0001D49C)(v₁, v₂) = \U0001D49C(v₂^F, v₁) 给出。\n\n例 6.2.3。 对于 \U0001D4AF\
  ₂²(V) 中的张量 \U0001D49C，张量 F₁²(\U0001D49C) 在 \U0001D4AF₃¹(V) 中由下式给出\n\nF₁²(\U0001D49C\
  )(η¹, v₁, v₂, v₃) = \U0001D49C(η¹, v₁^F, v₂, v₃).\n\n由定理 3.3.1(a)，hⱼ^F = Σₚ gⱼₚ\
  \ θᵖ，所以 F₁²(\U0001D49C) 具有分量\n\n```\nF₁²(\U0001D49C)ⁱ_{jkl} = F₁²(\U0001D49C)(θⁱ,\
  \ hⱼ, hₖ, hₗ) = \U0001D49C(θⁱ, hⱼ^F, hₖ, hₗ)\n= \U0001D49C(θⁱ, Σₚ gⱼₚ θᵖ, hₖ, hₗ)\
  \ = Σₚ gⱼₚ \U0001D49C(θⁱ, θᵖ, hₖ, hₗ)\n= Σₚ gⱼₚ \U0001D49Cⁱᵖ_{kl}\n```\n\n关于 ℋ。\n\
  \n定理 6.2.4。 设 (V, g) 为标量积空间，设 ℋ 为 V 的基，并设 g_ℋ = [gᵢⱼ]。设 \U0001D49C 为 \U0001D4AF\
  ₛʳ(V) 中的张量，并设 1 ≤ k ≤ r 且 1 ≤ l ≤ s+1 为整数。则 \U0001D4AF_{s+1}^{r-1}(V) 中的张量 Fₗᵏ(\U0001D49C\
  ) 具有分量\n\n```\nFₗᵏ(\U0001D49C)^{i₁...i_{k-1} p i_k...i_{r-1}}_{j₁...j_{l-1} j_{l+1}...j_{s+1}}\
  \ = Σₚ gⱼₗₚ \U0001D49C^{i₁...i_{k-1} p i_k...i_{r-1}}_{j₁...ĵₗ...j_{s+1}}\n```\n\
  \n关于 ℋ。\n\n证明。证明是例 6.2.3 的详细阐述。我们仅考虑 [F2] 的情形。\U0001D4AF_{s+1}^{r-1}(V) 中的张量 Fₗᵏ(\U0001D49C\
  ) 由下式给出\n\n```\nFₗᵏ(\U0001D49C)(η¹,...,η^{r-1}, v₁,...,v_{s+1})\n= \U0001D49C(η¹,...,η^{k-1},\
  \ vₗ^F, η^k,...,η^{r-1}, v₁,...,v̂ₗ,...,v_{s+1})\n```\n\n对所有余向量 η¹,...,η^{r-1} 在\
  \ V* 中以及所有向量 v₁,...,v_{s+1} 在 V 中成立。设 ℋ = (h₁,...,h_m)，并设 (θ¹,...,θ^m) 为其对偶基。由定理\
  \ 3.3.1(a)，hⱼ^F = Σₚ gⱼₚ θᵖ，所以 Fₗᵏ(\U0001D49C) 具有分量\n\n```\nFₗᵏ(\U0001D49C)^{i₁...i_{r-1}}_{j₁...j_{s+1}}\
  \ = Fₗᵏ(\U0001D49C)(θ^{i₁},...,θ^{i_k},...,θ^{i_{r-1}}, h_{j₁},...,h_{j_{s+1}})\n\
  = \U0001D49C(θ^{i₁},...,θ^{i_{k-1}}, h_{jₗ}^F, θ^{i_k},...,θ^{i_{r-1}}, h_{j₁},...,h_{j_{l-1}},\
  \ h_{j_{l+1}},...,h_{j_{s+1}})\n= \U0001D49C(θ^{i₁},...,θ^{i_{k-1}}, Σₚ gⱼₗₚ θᵖ,\
  \ θ^{i_k},...,θ^{i_{r-1}}, h_{j₁},...,h_{j_{l-1}}, h_{j_{l+1}},...,h_{j_{s+1}})\n\
  = Σₚ gⱼₗₚ \U0001D49C(θ^{i₁},...,θ^{i_{k-1}}, θᵖ, θ^{i_k},...,θ^{i_{r-1}}, h_{j₁},...,h_{j_{l-1}},\
  \ h_{j_{l+1}},...,h_{j_{s+1}})\n= Σₚ gⱼₗₚ \U0001D49C^{i₁...i_{k-1} p i_k...i_{r-1}}_{j₁...ĵₗ...j_{s+1}}\n\
  ```\n\n关于 ℋ。\n\n## 6.2 平坦映射\n\n**定理 6.2.5.**\n\n设 $(V,\\mathfrak g)$ 为标量积空间，设 $\\\
  mathcal H$ 为 $V$ 的基，并设 $\\mathfrak g=[g_{ij}]$。设 $\\mathcal A$ 为 $T^r_s(V)$ 中的张量，并设\
  \ $r\\ge 2$ 且 $s>0$ 为整数。则：\n\n- (a) 对于整数 $1\\le k<l\\le r$ 和 $1\\le n\\le s$，张量\
  \ $C_n^k\\circ F_n^l(\\mathcal A)$ 在 $T^{r-2}_{s}(V)$ 中关于 $\\mathcal H$ 的分量为\n\n\
  $$C_n^k\\circ F_n^l(\\mathcal A)^{i_1\\cdots i_{r-2}}_{j_1\\cdots j_s}=\\sum_{pq}g_{pq}\\\
  mathcal A^{i_1\\cdots i_{k-1}\\,p\\,i_{k}\\cdots i_{l-2}\\,q\\,i_{l-1}\\cdots i_{r-2}}_{j_1\\\
  cdots j_s}. \\tag{6.2.1}$$\n\n- (b) 对于整数 $1\\le k\\le r$ 和 $1\\le n\\le s$，张量 $C_n^k\\\
  circ F_n^k(\\mathcal A)$ 在 $T^{r-2}_{s}(V)$ 中关于 $\\mathcal H$ 的分量为\n\n$$C_n^k\\\
  circ F_n^k(\\mathcal A)^{i_1\\cdots i_{r-2}}_{j_1\\cdots j_s}=C_n^k\\circ F_n^{k+1}(\\\
  mathcal A)^{i_1\\cdots i_{r-2}}_{j_1\\cdots j_s}$$\n$$=\\sum_{pq}g_{pq}\\mathcal\
  \ A^{i_1\\cdots i_{k-1}\\,p\\,q\\,i_k\\cdots i_{r-2}}_{j_1\\cdots j_s}. \\tag{6.2.2}$$\n\
  \n**证明.** 由定理 6.2.4，张量 $F_n^l(\\mathcal A)$ 在 $T^{r-1}_{s+1}(V)$ 中关于 $\\mathcal\
  \ H$ 的分量为\n\n$$F_n^l(\\mathcal A)^{i_1\\cdots i_{r-1}}_{j_1\\cdots j_{s+1}}=\\sum_q\
  \ g_{j_nq}\\mathcal A^{i_1\\cdots i_{l-1}\\,q\\,i_l\\cdots i_{r-1}}_{j_1\\cdots\
  \ \\widehat{j_n}\\cdots j_{s+1}}. \\tag{6.2.3}$$\n\n(a): 我们有\n\n$$C_n^k\\circ F_n^l(\\\
  mathcal A)^{i_1\\cdots\\widehat{i_k}\\cdots i_{r-1}}_{j_1\\cdots\\widehat{j_n}\\\
  cdots j_{s+1}}=\\sum_pF_n^l(\\mathcal A)^{i_1\\cdots i_{k-1}\\,p\\,i_{k+1}\\cdots\
  \ i_{r-1}}_{j_1\\cdots j_{n-1}\\,p\\,j_{n+1}\\cdots j_{s+1}}$$\n\n$$=\\sum_p\\left(\\\
  sum_qg_{pq}\\mathcal A^{i_1\\cdots i_{k-1}\\,p\\,i_{k+1}\\cdots i_{l-1}\\,q\\,i_l\\\
  cdots i_{r-1}}_{j_1\\cdots\\widehat{j_n}\\cdots j_{s+1}}\\right)$$\n\n$$=\\sum_{pq}g_{pq}\\\
  mathcal A^{i_1\\cdots i_{k-1}\\,p\\,i_{k+1}\\cdots i_{l-1}\\,q\\,i_l\\cdots i_{r-1}}_{j_1\\\
  cdots\\widehat{j_n}\\cdots j_{s+1}}.$$\n\n重标指标 $(i_{k+1},\\ldots,i_{l-1},q,i_l,\\\
  ldots,i_{r-1})$ 为 $(i_k,\\ldots,i_{l-2},q,i_{l-1},\\ldots,i_{r-2})$，以及 $(j_{n+1},\\\
  ldots,j_{s+1})$ 为 $(j_n,\\ldots,j_s)$，得到结果。\n\n(b): 我们有\n\n$$C_n^k\\circ F_n^k(\\\
  mathcal A)^{i_1\\cdots\\widehat{i_k}\\cdots i_{r-1}}_{j_1\\cdots\\widehat{j_n}\\\
  cdots j_{s+1}}=\\sum_pF_n^k(\\mathcal A)^{i_1\\cdots i_{k-1}\\,p\\,i_{k+1}\\cdots\
  \ i_{r-1}}_{j_1\\cdots j_{n-1}\\,p\\,j_{n+1}\\cdots j_{s+1}}$$\n\n$$=\\sum_p\\left(\\\
  sum_qg_{pq}\\mathcal A^{i_1\\cdots i_{k-1}\\,q\\,p\\,i_{k+1}\\cdots i_{r-1}}_{j_1\\\
  cdots\\widehat{j_n}\\cdots j_{s+1}}\\right)$$\n\n$$=\\sum_{pq}g_{pq}\\mathcal A^{i_1\\\
  cdots i_{k-1}\\,q\\,p\\,i_{k+1}\\cdots i_{r-1}}_{j_1\\cdots\\widehat{j_n}\\cdots\
  \ j_{s+1}}$$\n\n$$=\\sum_{pq}g_{qp}\\mathcal A^{i_1\\cdots i_{k-1}\\,p\\,q\\,i_{k+1}\\\
  cdots i_{r-1}}_{j_1\\cdots\\widehat{j_n}\\cdots j_{s+1}}.$$\n\n\n\n\n\nand\n\nC_n^k\
  \ ∘ F_n^{k+1}(\U0001D49C)^{i_1...î_k...i_{r-1}}_{j_1...ĵ_n...j_{s+1}} = Σ_p F_n^{k+1}(\U0001D49C\
  )^{i_1...i_{k-1} p i_{k+1}...i_{r-1}}_{j_1...j_n-1 p j_{n+1}...j_{s+1}} [Th 5.4.5]\
  \ = Σ_p ( Σ_q \U0001D524_{pq} \U0001D49C^{i_1...i_{k-1} p q i_{k+1}...i_{r-1}}_{j_1...j_n...j_{s+1}}\
  \ ) [(6.2.3)] = Σ_{pq} \U0001D524_{pq} \U0001D49C^{i_1...i_{k-1} p q i_{k+1}...i_{r-1}}_{j_1...j_n...j_{s+1}},\n\
  \n这给出了第一个等式。重新标记指标 (i_{k+1},...,i_{r-1}) 为 (i_k,...,i_{r-2})，并将 (j_{n+1},...,j_{s+1})\
  \ 重新标记为 (j_m,...,j_s)，得到第二个等式。\n\n我们观察到 p 和 q 在 (6.2.1) 中分别位于 \U0001D49C 的第 k 个和第\
  \ l 个逆变位置，而 p 和 q 在 (6.2.2) 中分别位于 \U0001D49C 的第 k 个和第 (k+1) 个逆变位置。我们还注意到 (6.2.1)\
  \ 右边与 n 无关。这是有意义的，因为 F_n^l 将第 l 个逆变指标降低到第 n 个协变位置，然后 C_n^k 对第 k 个逆变指标和第 n 个协变指标进行收缩。可以说，第\
  \ n 个协变位置只是降低后的第 l 个逆变指标在与第 k 个逆变指标收缩之前暂时驻留的位置。\n\n## 定理 6.2.6. 设 (V,\U0001D524\
  ) 为数量积空间，设 \U0001D49C 为 \U0001D4AF_s^r(V) 中的张量，且 1 ≤ k ≤ r 为整数。则\n\nF_1^k(\U0001D49C\
  ) = C_1^k(\U0001D524 ⊗ \U0001D49C).\n\n证明。以下所有分量均相对于 V 的基 ℋ 计算。根据定理 6.2.4，张量 F_1^k(\U0001D49C\
  ) 在 \U0001D4AF_{s+1}^{r-1}(V) 中具有分量\n\nF_1^k(\U0001D49C)^{i_1...i_{r-1}}_{j_1...j_{s+1}}\
  \ = Σ_p \U0001D524_{j_1 p} \U0001D49C^{i_1...i_{k-1} p i_k...i_{r-1}}_{j_2...j_{s+1}}.\
  \ (6.2.4)\n\n根据定理 5.1.5，张量 \U0001D524 ⊗ \U0001D49C 在 \U0001D4AF_{s+2}^r(V) 中具有分量\n\
  \n(\U0001D524 ⊗ \U0001D49C)^{i_1...i_r}_{j_1...j_{s+2}} = \U0001D524_{j_1 j_2} \U0001D49C\
  ^{i_1...i_r}_{j_3...j_{s+1}},\n\n然后根据定理 5.4.5，张量 C_1^k(\U0001D524 ⊗ \U0001D49C)\
  \ 在 \U0001D4AF_{s+1}^{r-1}(V) 中具有分量\n\nC_1^k(\U0001D524 ⊗ \U0001D49C)^{i_1...î_k...i_r}_{j_2...j_{s+2}}\
  \ = Σ_p \U0001D524_{p j_2} \U0001D49C^{i_1...i_{k-1} p i_{k+1}...i_r}_{j_3...j_{s+2}}.\n\
  \n重新标记 (i_{k+1},...,i_r) 为 (i_k,...,i_{r-1})，并将 (j_2,...,j_{s+2}) 重新标记为 (j_1,...,j_{s+1})，得到\n\
  \nC_1^k(\U0001D524 ⊗ \U0001D49C)^{i_1...i_{r-1}}_{j_1...j_{s+1}} = Σ_p \U0001D524\
  _{p j_1} \U0001D49C^{i_1...i_{k-1} p i_k...i_{r-1}}_{j_2...j_{s+1}}. (6.2.5)\n\n\
  结果现在由 (6.2.4) 和 (6.2.5) 推出。\n\n## 6.3 尖映射\n\n设 $(V,\\mathfrak{g})$ 为数量积空间，设 $\\\
  mathcal{H} = (h_1,\\dots,h_m)$ 为 V 的基，设 $(\\theta^1,\\dots,\\theta^m)$ 为其对偶基。回顾\
  \ (5.1.1) 中 $\\mathcal{T}_0^1(V)=V$ 且 $\\mathcal{T}_1^0(V)=V^*$。尖映射因此可以表示为\n\nS\
  \ : $\\mathcal{T}_1^0(V) \\longrightarrow \\mathcal{T}_0^1(V)$.\n\n更一般地，设 $1 \\\
  le k \\le r+1$ 且 $1 \\le l \\le s$ 为整数（从而 $r \\ge 0$ 且 $s \\ge 1$）。$(\\boldsymbol{k},\\\
  boldsymbol{l})$-尖映射记为\n\nS$_l^k : \\mathcal{T}_s^r(V) \\longrightarrow \\mathcal{T}_{s-1}^{r+1}(V)$\n\
  \n并对所有张量 $\\mathcal{A}$ 在 $\\mathcal{T}_s^r(V)$ 中，所有余向量 $\\eta^1,\\dots,\\eta^{r+1}$\
  \ 在 $V^*$ 中，以及所有向量 $v_1,\\dots,v_{s-1}$ 在 $V$ 中定义如下，其中 $\\widehat{\\phantom{x}}$\
  \ 表示省略表达式：\n\n[S1] 对于 $s = 1$（从而 $l = 1$）：\n\nS$_1^k(\\mathcal{A})(\\eta^1,\\dots,\\\
  eta^{r+1}) = \\mathcal{A}(\\eta^1,\\dots,\\widehat{\\eta^k},\\dots,\\eta^{r+1},\\\
  eta^{k\\sharp})$\n\n[S2] 对于 $s \\ge 2$ 且 $1 \\le l \\le s-1$：\n\nS$_l^k(\\mathcal{A})(\\\
  eta^1,\\dots,\\eta^{r+1},v_1,\\dots v_{s-1}) = \\mathcal{A}(\\eta^1,\\dots,\\widehat{\\\
  eta^k},\\dots,\\eta^{r+1},v_1,\\dots,v_{l-1},\\eta^{k\\sharp},v_l,\\dots,v_{s-1})$\n\
  \n[S3] 对于 $s \\ge 2$ 且 $l = s$：\n\nS$_s^k(\\mathcal{A})(\\eta^1,\\dots,\\eta^{r+1},v_1,\\\
  dots,v_{s-1}) = \\mathcal{A}(\\eta^1,\\dots,\\widehat{\\eta^k},\\dots,\\eta^{r+1},v_1,\\\
  dots,v_{s-1},\\eta^{k\\sharp})$\n\n计算过程对 [S2] 最为透明：提取第 $k$ 个逆变位置中的余向量，对其进行尖化，并将结果插入第\
  \ $l$ 个协变位置。\n\n## 例 6.3.1. 为说明 [S1]，设 $r = 0$（从而 $k = 1$）且 $s = 1$（从而 $l = 1$），并设\
  \ $\\zeta$ 为 $\\mathcal{T}_1^0(V)=V^*$ 中的余向量。则张量 S$_1^1(\\zeta)$ 在 $\\mathcal{T}_0^1(V)=V$\
  \ 中由\n\nS$_1^1(\\zeta)(\\eta) = \\zeta(\\eta^{\\sharp})$\n\n对所有 $V^*$ 中的余向量 $\\\
  eta$ 给出。我们由 (1.2.3) 和 (4.5.2) 得\n\n$\\zeta(\\eta^{\\sharp}) = \\langle \\zeta,\\\
  eta \\rangle^* = \\langle \\eta,\\zeta \\rangle^* = \\eta(\\zeta^{\\sharp}) = \\\
  zeta^{\\sharp}(\\eta) = S(\\zeta)(\\eta)$\n\n故 S$_1^1(\\zeta)(\\eta) = S(\\zeta)(\\\
  eta)$。由于 $\\eta$ 和 $\\zeta$ 为任意，\n\nS$_1^1 = S.$\n\n为说明 [S2]，设 $r = 0$（从而 $k = 1$）且\
  \ $s = 2$（从而 $l = 1$），并设 $\\mathcal{A}$ 为 $\\mathcal{T}_2^0(V)$ 中的张量。则张量 S$_1^1(\\\
  mathcal{A})$ 在 $\\mathcal{T}_1^1(V)$ 中由\n\nS$_1^1(\\mathcal{A})(\\eta, v) = \\mathcal{A}(\\\
  eta^{\\sharp}, v)$.\n\n给出。\n\n为说明 [S3]，设 $r=0$（从而 $k=1$）且 $s=2$（从而 $l=2$），并设 $\\\
  mathcal A$ 为 $\\mathcal T^0_2(V)$ 中的张量。则张量 $S^1_2(\\mathcal A)$ 在 $\\mathcal T^1_1(V)$\
  \ 中由\n\n$$S^1_2(\\mathcal A)(\\eta,v)=\\mathcal A(v,\\eta^S).$$\n\n给出。\n\n**例 6.3.2.**\
  \ 设 $\\mathcal A$ 为 $\\mathcal T^1_1(V)$ 中的张量。对于 $r=s=1$，存在 $k=1,2$ 且 $l=1$ 的尖映射。对于\
  \ $k=1$ 且 $l=1$，张量 $S^1_1(\\mathcal A)$ 在 $\\mathcal T^0_2(V)$ 中由\n\n$$S^1_1(\\\
  mathcal A)(\\eta^1,\\eta^2)=\\mathcal A(\\eta^2,\\eta^{1S}).$$\n\n给出。对于 $k=2$ 且\
  \ $l=1$，张量 $S^2_1(\\mathcal A)$ 在 $\\mathcal T^0_2(V)$ 中由\n\n$$S^2_1(\\mathcal A)(\\\
  eta^1,\\eta^2)=\\mathcal A(\\eta^1,\\eta^{2S}).$$\n\n给出。\n\n**例 6.3.3.** 对于 $\\\
  mathcal T^1_3(V)$ 中的张量 $\\mathcal B$，张量 $S^2_1(\\mathcal B)$ 在 $\\mathcal T^2_2(V)$\
  \ 中由\n\n$$S^2_1(\\mathcal B)(\\eta^1,\\eta^2,v_1,v_2)=\\mathcal B(\\eta^1,\\eta^{2S},v_1,v_2).$$\n\
  \n给出。根据定理 4.5.3(a)，$\\theta^jS=\\sum_p g^{jp}h_p$，所以 $S^2_1(\\mathcal B)$ 具有分量\n\
  \n$$S^2_1(\\mathcal B)^{ij}_{kl}=S^2_1(\\mathcal B)(\\theta^i,\\theta^j,h_k,h_l)=\\\
  mathcal B(\\theta^i,\\theta^{jS},h_k,h_l)$$\n$$=\\mathcal B\\left(\\theta^i,\\sum_p\
  \ g^{jp}h_p,h_k,h_l\\right)=\\sum_p g^{jp}\\mathcal B(\\theta^i,h_p,h_k,h_l)$$\n\
  $$=\\sum_p g^{jp}\\mathcal B^i_{pkl}.$$\n\n相对于 $\\mathcal H$。\n\n## 定理 6.3.4. 设\
  \ $(V,\\mathfrak g)$ 为数量积空间，设 $\\mathcal H$ 为 V 的基，并设 $g_{\\mathcal H}^{-1}=[g^{ij}]$。设\
  \ $\\mathcal A$ 为 $\\mathcal T^r_s(V)$ 中的张量，并设 $1\\leq k\\leq r+1$ 且 $1\\leq l\\\
  leq s$ 为整数。则张量 $S^k_l(\\mathcal A)$ 在 $\\mathcal T^{r+1}_{s-1}(V)$ 中具有分量\n\n$$S^k_l(\\\
  mathcal A)^{i_1\\cdots i_{r+1}}_{j_1\\cdots j_{s-1}}=\\sum_p g^{i_kp}\\mathcal A^{i_1\\\
  cdots \\widehat{i_k}\\cdots i_{r+1}}_{j_1\\cdots j_{l-1}\\,p\\,j_l\\cdots j_{s-1}}.$$\n\

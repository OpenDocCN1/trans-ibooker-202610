  ) 称为 \\(\\mathcal{A}\\) 与 \\(\\mathcal{B}\\) 的张量积。与加法不同，张量的乘积不要求 \\(\\mathcal{A}\\\
  ) 和 \\(\\mathcal{B}\\) 具有相同的秩。通常，\\(\\mathcal{A} \\otimes \\mathcal{B} \\ne \\mathcal{B}\
  \ \\otimes \\mathcal{A}\\)，因此张量积一般不可交换。\n\n下一个结果给出张量的基本代数性质。\n\n**定理5.1.2.** 设 \\\
  (V\\) 为向量空间，设 \\(\\mathcal{A}, \\mathcal{A}_1, \\mathcal{A}_2\\)、\\(\\mathcal{B},\
  \ \\mathcal{B}_1, \\mathcal{B}_2\\) 和 \\(\\mathcal{C}\\) 分别为 \\(\\mathcal{T}_s^r(V)\\\
  )、\\(\\mathcal{T}_{s'}^{r'}(V)\\) 和 \\(\\mathcal{T}_{s''}^{r''}(V)\\) 中的张量，并设 \\\
  (c\\) 为实数。则：\n\n- (a) \\((\\mathcal{A}_1 + \\mathcal{A}_2) \\otimes \\mathcal{B}\
  \ = \\mathcal{A}_1 \\otimes \\mathcal{B} + \\mathcal{A}_2 \\otimes \\mathcal{B}\\\
  )。\n- (b) \\(\\mathcal{A} \\otimes (\\mathcal{B}_1 + \\mathcal{B}_2) = \\mathcal{A}\
  \ \\otimes \\mathcal{B}_1 + \\mathcal{A} \\otimes \\mathcal{B}_2\\)。\n- (c) \\((c\\\
  mathcal{A}) \\otimes \\mathcal{B} = c(\\mathcal{A} \\otimes \\mathcal{B}) = \\mathcal{A}\
  \ \\otimes (c\\mathcal{B})\\)。\n- (d) \\((\\mathcal{A} \\otimes \\mathcal{B}) \\\
  otimes \\mathcal{C} = \\mathcal{A} \\otimes (\\mathcal{B} \\otimes \\mathcal{C})\\\
  )。\n\n*证明.* 直接计算即可。\n\n鉴于定理5.1.2(d)，我们在张量积周围省略括号，例如将 \\((\\mathcal{A} \\otimes \\\
  mathcal{B}) \\otimes \\mathcal{C}\\) 和 \\(\\mathcal{A} \\otimes (\\mathcal{B} \\\
  otimes \\mathcal{C})\\) 记为 \\(\\mathcal{A} \\otimes \\mathcal{B} \\otimes \\mathcal{C}\\\
  )，对多于三项的张量积也有相应的记号。通过对向量和余向量的集合形成张量积，我们可以构造任意秩的张量。举例来说，由 \\(V\\) 中的向量 \\(w_1,\\\
  dots,w_r\\) 和 \\(V^*\\) 中的余向量 \\(\\zeta^1,\\dots,\\zeta^s\\)，我们得到 \\(\\mathcal{T}_s^r(V)\\\
  ) 中的张量 \\(w_1 \\otimes \\cdots \\otimes w_r \\otimes \\zeta^1 \\otimes \\cdots \\\
  otimes \\zeta^s\\)。于是(5.1.4)给出\n\\[\nw_1 \\otimes \\cdots \\otimes w_r \\otimes\
  \ \\zeta^1 \\otimes \\cdots \\otimes \\zeta^s(\\eta^1,\\dots,\\eta^r,v_1,\\dots,v_s)\n\
  = w_1(\\eta^1)\\cdots w_r(\\eta^r)\\,\\zeta^1(v_1)\\cdots\\zeta^s(v_s)\n\\]\n对所有余向量\
  \ \\(\\eta^1,\\dots,\\eta^r \\in V^*\\) 和所有向量 \\(v_1,\\dots,v_s \\in V\\) 成立。\n\n\
  设 \\(V\\) 为向量空间，设 \\(\\mathcal{A}\\) 为 \\(\\mathcal{T}_s^r(V)\\) 中的张量，设 \\(\\mathcal{H}\
  \ = (h_1,\\dots,h_m)\\) 为 \\(V\\) 的一组基，并设 \\(\\Theta = (\\theta^1,\\dots,\\theta^m)\\\
  ) 为其对偶基。\\(\\mathcal{A}\\) 关于 \\(\\mathcal{H}\\) 的分量定义为\n\\[\n\\mathcal{A}^{i_1\\\
  dots i_r}_{j_1\\dots j_s} = \\mathcal{A}(\\theta^{i_1},\\dots,\\theta^{i_r},h_{j_1},\\\
  dots,h_{j_s})\n\\]\n对所有 \\(1 \\le i_1,\\dots,i_r \\le m\\) 和 \\(1 \\le j_1,\\dots,j_s\
  \ \\le m\\) 成立。\n\n**定理5.1.3（\\(\\mathcal{T}_s^r(V)\\) 的基）。** 在上述设定下：\n\n*证明.* (a)、(b)：根据前面的评注，每个\
  \ \\(h_{i_1} \\otimes \\cdots \\otimes h_{i_r} \\otimes \\theta^{j_1} \\otimes \\\

  \ f}{\\partial y}(x,y)\\right)^2 - 1.$$\n\n结果现在由定理 12.2.6 推出。\n\n## 定理 12.2.9 (旋转曲面)。\
  \ 在定理 11.4.3 的记号下，rev(σ) 是 ℝ³_ν 中的正则曲面当且仅当 ḣ(t)² − ρ̇(t)² 对所有 t 在 (a,b) 中均为正，或对所有\
  \ t 在 (a,b) 中均为负。\n\n证明。 如与定理 12.2.6 相关的评述中所指出的，$\\nu = 0$ 的情形是直接的，故设 $\\nu = 1$。\
  \ 我们由例 11.2.5 得到 rev(σ) 是正则曲面，由定理 11.4.3 得到 $(U, φ)$ 是覆盖坐标图，且由定理 12.10.4 的部分 (b)\
  \ 的证明得到\n\n```\n⟨H₁|_(t,φ) × H₂|_(t,φ), H₁|_(t,φ) × H₂|_(t,φ)⟩ = ρ(t)²[ḣ(t)² − ρ̇(t)²].\n\
  ```\n\n根据定义，ρ(t) 对所有 t 在 (a,b) 中均为正，故非零。 结果现在由定理 12.2.6 推出。\n\n设 \U0001D4B0 是 ℝ³_ν\
  \ 中的开集，且 f 是 C^∞(\U0001D4B0) 中的函数。 f 的梯度 (在 ℝ³_ν 中) 是映射\n\nGrad(f) : \U0001D4B0\

- '## 第 17 章


  ## 带边界的光滑流形


  在实践中遇到原本是光滑流形但因某种“边界”的存在而有所不同的情况并不罕见。本章中，我们引入带边界的光滑流形并证明微分几何中最重要的结果之一——Stokes 定理。


  ### 17.1 带边界的光滑流形


  ℝ^m 的闭上半空间，由


  ℍ^m = {(x¹, …, x^m) ∈ ℝ^m : x^m ≥ 0}


  定义，是我们后来所称的带边界光滑 m-流形的模型。容易证明


  int_ℝ^m(ℍ^m) = {(x¹, …, x^m) ∈ ℝ^m : x^m > 0}

  ext_ℝ^m(ℍ^m) = {(x¹, …, x^m) ∈ ℝ^m : x^m < 0}

  bd_ℝ^m(ℍ^m) = {(x¹, …, x^m) ∈ ℝ^m : x^m = 0}.


  例如，ℍ³ = {(x, y, z) ∈ ℝ³ : z ≥ 0} 是包含 xy-平面的 ℝ³ 的上半部分，int_ℝ³(ℍ³) 是不含 xy-平面的 ℝ³ 的上半部分，ext_ℝ³(ℍ³)
  是不含 xy-平面的 ℝ³ 的下半部分，而 bd_ℝ³(ℍ³) 是 xy-平面。


  在整个讨论中，ℍ^m 假定具有由 ℝ^m 诱导的子空间拓扑。


  我们的第一个目标是利用 ℍ^m 来拓广我们先前对“图表”的概念。设 M 是一个拓扑空间，并考虑对第 14.1 节中图表定义的一种修改。M 上的图表是一个对 (U,
  φ)，其中 U 是 M 中的开集且 φ : U ⟶ ℍ^m 是一个映射，使得：


  - [C1] φ(U) 是 ℍ^m 中的开集。

  - [C2] φ : U ⟶ φ(U) 是一个同胚。


  与先前表述的不同之处在于 [C1] 中出现了 ℍ^m 而不是 ℝ^m。我们把 m 称为图表的维数。对于 φ(U) 中的每个点 p，(U, φ) 称为在 p 处的图表。如前所述，M
  的一个图册 𝔄 = {(Uα, φα) : α ∈ A} 是 M 上图表的集合，使得 Uα 构成 M 的一个开覆盖。


  带边界的拓扑 m-流形是一个对 (M, 𝔄)，其中 M 是一个拓扑空间且 𝔄 是 M 的一个图册，使得：


  - [T1] 𝔄 中每个图表的维数为 m。

  - [T2] M 的拓扑具有可数基。

  - [T3] 对于 M 中任意一对不同点 p1, p2，存在 M 中不相交的开集 U1 和 U2，使得 p1 在 U1 中且 p2 在 U2 中。


  设 M 是一个带边界的拓扑 m-流形，设 (U, φ) 是 M 上的一个图表。我们说 (U, φ) 是内部图表，如果 φ(U) 包含于 intℝ^m(ℍ^m)，并且是边界图表，如果
  φ(U) 与 bdℝ^m(ℍ^m) 相交。显然，M 上的任何图表要么是内部图表要么是边界图表。由于 intℝ^m(ℍ^m) 是 ℝ^m 中的开集，根据定理 9.1.5
  可知，如果 (U, φ) 是内部图表，则它是第 14.1 节意义下的图表。另一方面，如果 φ(U) 与 bdℝ^m(ℍ^m) 相交，我们就有了全新的东西。


  ![](img/d712710a8eb78c0959204afd5dde4c91_465_0.png)


  图 17.1.1. 内部图表和边界图表


  设 p 是 M 中的一点。我们说 p 是 M 的内部点，如果存在在 p 处的图表 (U, φ) 使得 φ(p) 在 intℝ^m(ℍ^m) 中，并且说 p 是
  M 的边界点，如果存在在 p 处的图表 (V, ψ) 使得 ψ(p) 在 bdℝ^m(ℍ^m) 中。见图 17.1.1，其中 p1 和 p2 是内部点，而 p3
  是边界


  点。我们注意到，在内部点处的图表要么是内部图表要么是边界图表，但边界点处的图表必然是边界图表。由于 M 中任意点 p 都包含于至少一个图表中，它要么是内部点（相对于该图表）要么是边界点（相对于该图表）。这就引出了这样一个问题：p
  是否可能相对于一个图表是内部点，同时相对于另一个图表是边界点。这是一个关键事实：这种情况不可能发生。


  ### 定理 17.1.1 （边界的拓扑不变性）。带边界的拓扑流形中的每个点要么是内部点要么是边界点，但不是两者兼有。


  设 M 是一个带边界的拓扑流形，设 p 是 M 中的一点。定理 17.1.1 的一个推论是，判断 p 是内部点还是边界点与在 p 处选择的图表无关。M 的内部点的集合记为
  M° 并称为 M 的（流形）内部，M 的边界点的集合记为 ∂M 并称为 M 的（流形）边界。因此，M 是 M° 与 ∂M 的不交并。


  有了图表的概念，第 14.1 节中提出的其它核心定义——过渡映射、切空间、光滑图册等——几乎逐字逐句地转移到本设定中。然而，必须考虑 ℍ^m 的边界。为此，在考虑光滑性时，我们采用第
  10.1 节中引入的“扩展”光滑性定义。


  带边界的拓扑流形 (M,𝔄) 称为带边界的光滑 m-流形，如果 𝔄 是 M 的一个光滑图册。


  ### 例 17.1.2 （ℍ^m）。带边界的光滑 m-流形的明显例子是拓扑空间 ℍ^m 配上由单个图表 (ℍ^m, id_ℍ^m = (r¹,…,r^m))
  构成的光滑图册。ℍ^m 的内部和边界分别为


  (ℍ^m)° = int_ℝ^m(ℍ^m)      且      ∂ℍ^m = bd_ℝ^m(ℍ^m)，


  分别。我们模仿 ℝ^m 的情况，称 (r¹,…,r^m) 为 ℍ^m 上的标准坐标，称 (∂/∂r¹,…,∂/∂r^m) 和 (d(r¹),…,d(r^m))
  分别为 ℍ^m 的相应标准坐标标架和标准对偶坐标标架，并称由 d(r¹)∧⋯∧d(r^m) 诱导的 ℍ^m 的定向为标准定向。


  ### 例 17.1.3 （闭区间）。ℝ 中的闭区间 [a,b] 是一个带边界的光滑 1-流形，其中 [a,b]° = (a,b) 且 ∂[a,b] = {a,b}。该例子在第
  16.8 节中已有预示。


  设 M 是一个带边界的光滑流形，设 (U,φ) 是 M 上的一个边界图表，设 p 是 ∂M∩U 中的一点。根据定义，p 是边界点，所以由定理 17.1.1 可知
  φ(p) 在 ∂ℍ^m 中。因此，坐标映射把边界点映到边界点。更一般地，我们有以下结果。






  ## 定理17.1.4（边界的微分同胚不变性）。


  *若* $M$ *和* $N$ *是带边光滑流形，且* $F:M\to N$ *是微分同胚，则* $F(\partial M)=\partial N$，*因此*
  $F(M^\circ)=F(N^\circ)$。


  带边光滑流形的定义中并没有要求边界非空。若边界实际上为空，则光滑图册完全由内部坐标卡组成。在这种情况下，所得到的光滑结构就是第14.1节所定义的光滑流形结构。因此，边界为空的带边光滑流形将简称为**光滑流形**。另一方面，我们确立如下约定。


  **今后，带边光滑流形默认具有非空边界。**


  第14.8节给出的子流形定义可以直接推广到当前情形。光滑流形或带边光滑流形的子流形可能有边界，也可能没有边界。必要时我们使用术语**子流形**和**带边子流形**来明确情况。例如，$\mathbb{H}^m$
  是光滑 $m$ 流形 $\mathbb{R}^m$ 的一个带边 $m$ 子流形。在处理光滑流形或带边光滑流形时，我们以一般意义使用术语**坐标卡**，指内部坐标卡或边界坐标卡，仅在需要明确区分时使用“边界坐标卡”这一术语。


  流形边界与拓扑边界之间的区别值得强调。例如，考虑 $\mathbb{R}^2$ 中的单位开圆盘 $D$。作为光滑 2 流形 $\mathbb{R}^2$ 的一个开
  2 子流形，$D$ 本身是一个光滑 2 流形，因此没有边界。另一方面，作为拓扑空间 $\mathbb{R}^2$ 的子集，$D$ 的拓扑边界由单位圆周组成。


  根据下面的结果，带边光滑流形的边界自动具有光滑结构。


  ### 定理17.1.5。


  *若* $M$ *是带边的光滑* $m$ *流形，其中* $m\ge 2$，*则* $\partial M$ *是* $M$ *的一个* $(m-1)$*-子流形，从而是*
  $M$ *的一个超曲面。*


  例如，$\partial\mathbb{H}^m$ 是 $\mathbb{H}^m$ 的一个超曲面。有时将光滑 $(m-1)$ 流形 $\partial\mathbb{H}^m$
  与 $\mathbb{R}^{m-1}$ 等同起来是方便的。



  \ \\setminus \\{(0,0,1)\\}]$ 在 $\\mathcal{S}^2$ 中开。\n\n[C3]：我们上面已观察到 $\\varphi$\
  \ 为双射，且由 (11.2.2) 与 (11.2.3) 的形式可知 $\\varphi$ 与 $\\varphi^{-1}$ 均连续。\n\n这证明了断言。\n\

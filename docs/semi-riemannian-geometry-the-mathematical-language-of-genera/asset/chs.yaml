  \ B}$ 是 X 上的拓扑，称为由 $\\mathcal B$ 生成的拓扑。*\n\n*证明.* 我们需要证明 [T1]–[T3] 得到满足。 显然 $\\\
  varnothing$ 在 $\\mathcal T_{\\mathcal B}$ 中是空真成立的，且根据 [B1]，$X$ 也是如此。 于是，[T1] 得到满足。\
  \ 显然，[T2] 得到满足。 对于 [T3]，设 $B_1,B_2$ 是 $\\mathcal B$ 中的基元素。 我们断言 $B_1\\cap B_2$ 在\
  \ $\\mathcal T_{\\mathcal B}$ 中。 这在 $B_1\\cap B_2=\\varnothing$ 时显然成立，故假设并非如此。 根据\
  \ [B2]，对于 $B_1\\cap B_2$ 中的每个 $x$，存在 $\\mathcal B$ 中的基元素 $B_x$ 使得 $x$ 在 $B_x$ 中且\
  \ $B_x\\subseteq B_1\\cap B_2$。 可得 $B_1\\cap B_2=\\bigcup_{x\\in B_1\\cap B_2}B_x$，故\
  \ $B_1\\cap B_2$ 在 $\\mathcal T_{\\mathcal B}$ 中。 这证明了断言。 设 $U_1$ 和 $U_2$ 是 $\\\
  mathcal T_{\\mathcal B}$ 的元素，其中 $U_1=\\bigcup_{\\alpha_1\\in A_1}B_{\\alpha_1}$\
  \ 且 $U_2=\\bigcup_{\\alpha_2\\in A_2}B_{\\alpha_2}$。 根据定理 A.1(a)，\n\n$$U_1\\cap\
  \ U_2=\\left(\\bigcup_{\\alpha_1\\in A_1}B_{\\alpha_1}\\right)\\cap\\left(\\bigcup_{\\\
  alpha_2\\in A_2}B_{\\alpha_2}\\right)=\\bigcup_{\\alpha_1\\in A_1,\\,\\alpha_2\\\
  in A_2}(B_{\\alpha_1}\\cap B_{\\alpha_2}).$$\n\n由于每个 $B_{\\alpha_1}\\cap B_{\\alpha_2}$\
  \ 在 $\\mathcal T_{\\mathcal B}$ 中，故 $U_1\\cap U_2$ 也是如此。 使用归纳论证，可以很容易地证明 $\\mathcal\
  \ T_{\\mathcal B}$ 中任意有限子族的交集在 $\\mathcal T_{\\mathcal B}$ 中。 于是，[T3] 得到满足。\n\n\
  **定理 9.1.4 (子空间拓扑)。** *如果 $(X,\\mathcal T)$ 是拓扑空间且 S 是 X 的子集，则*\n\n$$\\mathcal T_S=\\\
  {U\\cap S:U\\in\\mathcal T\\}$$\n\n\n\n\n\n证明。 (a) ⇒ (b)：设 x 是 F⁻¹(V) 中的一点。由于 F\
  \ 在 x 处连续且 V 是 Y 中 F(x) 的邻域，F⁻¹(V) 包含 X 中 x 的邻域 Uₓ。于是 F⁻¹(V) = ⋃ₓ∈U Uₓ 在 X 中是开集。\n\
  \n(b) ⇒ (a)：设 x 是 X 中的一点，且 V 是 Y 中 F(x) 的邻域。由于 V 在 Y 中是开集，F⁻¹(V) 在 X 中是开集，因此是 X\
  \ 中 x 的邻域。\n\n(b) ⇒ (c)：我们有\nK 在 Y 中是闭集\n⇒ Y\\K 在 Y 中是开集\n⇒ F⁻¹(Y\\K) = X\\F⁻¹(K)\
  \ 在 X 中是开集\n⇒ X\\[X\\F⁻¹(K)] = F⁻¹(K) 在 X 中是闭集，\n\n其中第二个蕴含由定理 A.3(e) 推出。\n\n(c)\
  \ ⇒ (b)：我们有\nV 在 Y 中是开集\n⇒ Y\\V 在 Y 中是闭集\n⇒ F⁻¹(Y\\V) = X\\F⁻¹(V) 在 X 中是闭集\n⇒ X\\\
  [X\\F⁻¹(V)] = F⁻¹(V) 在 X 中是开集，\n\n其中第二个蕴含由定理 A.3(e) 推出。\n\n## 定理 9.1.8. 设 X、Y 和\
  \ Z 为拓扑空间，且 F : X ⟶ Y 和 G : Y ⟶ Z 为映射。若 F 和 G 连续，则 G ∘ F 也连续。\n\n证明。设 V 是 Z 中的开集。由于\
  \ G 连续，根据定理 9.1.7，G⁻¹(V) 在 Y 中是开集，而由于 F 连续，再次根据定理 9.1.7，F⁻¹(G⁻¹(V)) = (G ∘ F)⁻¹(V)\
  \ 在 X 中是开集。结果现在由定理 9.1.7 推出。\n\n## 定理 9.1.9. 设 X 和 Y 为拓扑空间，F : X ⟶ Y 为映射，且 ℬ 是生成\
  \ Y 拓扑的基。若对 ℬ 中每个基元素 B，F⁻¹(B) 在 X 中是开集，则 F 连续。\n\n证明。设 V 是 Y 中的开集。根据定理 9.1.3，V 可表示为\
  \ V = ⋃ₐ∈ₐ Bₐ 的基元素的并，且然后定理 A.3(b) 给出 F⁻¹(V) = ⋃ₐ∈ₐ F⁻¹(Bₐ)。根据假设，每个 F⁻¹(Bₐ) 在 X 中是开集，因此\
  \ F⁻¹(V) 也是开集。结果现在由定理 9.1.7 推出。\n\n## 定理 9.1.10. 设 X₁, …, Xₘ 为拓扑空间，且假设 X₁ × ⋯ ×\
  \ Xₘ 具有乘积拓扑。定义映射 \U0001D4ABᵢ : X₁ × ⋯ × Xₘ ⟶ Xᵢ，称为 X₁ × ⋯ × Xₘ 上的第 i 个投影映射，由\n\n\
  \U0001D4ABᵢ(x₁, …, xᵢ, …, xₘ) = xᵢ\n\n对所有 (x₁, …, xₘ) 在 X₁ × ⋯ × Xₘ 中成立，i = 1, …,\
  \ m。则每个 \U0001D4ABᵢ 都是连续的。\n\n## 9.1 拓扑\n\n设 $X$ 和 $Y$ 为拓扑空间，$F:X\\to Y$ 为映射，且 $S$\
  \ 为 $X$ 的子集（拓扑子空间）。我们说 $F$ 在 $S$ 上**连续**，如果限制映射 $F|_S:S\\to Y$ 在 $S$ 上连续。\n\n###\
  \ 定理 9.1.13. *在上述设定下，若 $F$ 连续，则 $F|_S$ 也连续。*\n\n*证明.* 设 $V$ 为 $Y$ 中的开集。由于 $F$ 连续，根据定理\
  \ 9.1.7，$F^{-1}(V)$ 在 $X$ 中是开集，故 $F^{-1}(V)\\cap S=(F|_S)^{-1}(V)$ 在 $S$ 中是开集。结果现在由定理\
  \ 9.1.7 推出。\n\n设 $X$ 和 $Y$ 为拓扑空间，且 $F:X\\to Y$ 为连续映射。我们说 $F$ 是**同胚**，且 $X$ 和 $Y$\
  \ 是**同胚**，如果 $F$ 是双射且 $F^{-1}$ 连续。下一个结果表明同胚是一个保持拓扑结构（与线性同构保持线性结构的方式非常相似）的映射。\n\n\
  ### 定理 9.1.14. *设 $X$ 和 $Y$ 为拓扑空间，且 $F:X\\to Y$ 为双射映射。则以下等价：*\n\n(a) $F$ 是同胚。\n\n\
  (b) $U$ 在 $X$ 中是开集当且仅当 $F(U)$ 在 $Y$ 中是开集。\n\n(c) $K$ 在 $X$ 中是闭集当且仅当 $F(K)$ 在 $Y$\
  \ 中是闭集。\n\n*证明.* 这由定理 9.1.7 推出。\n\n我们说拓扑空间 $X$ 是**不连通**的，如果存在不相交的非空开集 $U$ 和 $V$\
  \ 在 $X$ 中使得 $X=U\\cup V$。在这种情况下，$U$ 和 $V$ 称为**分离** $X$。如果 $X$ 不是不连通的，我们说它是**连通**的。$X$\
  \ 的子集 $S$ 称为在 $X$ 中**不连通（连通）**或简单地**不连通（连通）**，如果它作为 $X$ 的拓扑子空间是不连通（连通）的。我们说 $X$\
  \ 的子集 $C$ 是 $X$ 的**连通分支**，如果它在 $X$ 中是连通集且是极大的，即 $C$ 不真包含于 $X$ 中的任何其他连通集中。\n\n下一个结果给出了拓扑空间的子集在该拓扑空间中不连通的等价条件。\n\
  \n### 定理 9.1.15. *设 $X$ 为拓扑空间，且 $S$ 为 $X$ 的子集。则：*\n\n(a) $S$ 在 $X$ 中不连通当且仅当存在 $X$\
  \ 中的非空开集 $U$ 和 $V$ 使得 (i) $(U\\cap V)\\cap S=\\varnothing$，(ii) $S\\subset (U\\\
  cup V)$，且 (iii) $U\\cap S\\ne\\varnothing$ 且 $V\\cap S\\ne\\varnothing$。\n\n(b)\
  \ $S$ 在 $X$ 中连通当且仅当对所有 $X$ 中的非空开集 $U$ 和 $V$ 使得 $(U\\cap V)\\cap S=\\varnothing$\
  \ 且 $S\\subset (U\\cup V)$，要么 $S\\subset U$ 要么 $S\\subset V$。\n\n*证明.* 设 $U$ 和 $V$\
  \ 为 $X$ 中的开集。则\n\n$$(U\\cap V)\\cap S=\\varnothing \\quad\\Longleftrightarrow\\\
  quad (U\\cap S)\\cap(V\\cap S)=\\varnothing,$$\n\n且由定理 A.1(a)，\n\n$$S\\subset (U\\\
  cup V) \\quad\\Longleftrightarrow\\quad S=(U\\cup V)\\cap S=(U\\cap S)\\cup(V\\\
  cap S).$$\n\n(a): 根据定义，$S$ 不连通当且仅当存在 $S$ 中的开集 $U'$ 和 $V'$ 使得 (i) $U'\\cap V'=\\\
  varnothing$，(ii) $S=U'\\cup V'$，且 (iii) $U'\\neq\\varnothing$ 且 $V'\\neq\\varnothing$。由于任何这样的\
  \ $U'$ 和 $V'$ 均可表示为 $U'=U\\cap S$ 和 $V'=V\\cap S$，其中 $U$ 和 $V$ 为 $X$ 中的开集，结果由 (9.1.1)\
  \ 和 (9.1.2) 推出。\n\n(b): 我们由第 (a) 部分得到 $S$ 在 $X$ 中连通当且仅当对所有 $X$ 中的非空开集 $U$ 和 $V$\
  \ 使得 $(U\\cap V)\\cap S=\\varnothing$ 且 $S\\subset (U\\cup V)$，要么 $U\\cap S=\\varnothing$\
  \ 要么 $V\\cap S=\\varnothing$，这进而由 (9.1.1) 和 (9.1.2) 等价于第 (b) 部分的陈述。\n\n## 定理 9.1.16.\n\
  \n设 $X$ 为拓扑空间，且 $\\{S_\\alpha:\\alpha\\in A\\}$ 为 $X$ 中在 $X$ 中连通的子集的集合。若 $\\bigcap_{\\\
  alpha\\in A}S_\\alpha$ 非空，则 $\\bigcup_{\\alpha\\in A}S_\\alpha$ 在 $X$ 中连通。\n\n**证明.**\
  \ 设 $S=\\bigcup_{\\alpha\\in A}S_\\alpha$，且 $U$ 和 $V$ 为 $X$ 中的非空开集使得 $(U\\cap V)\\\
  cap S=\\varnothing$ 且 $S\\subset (U\\cup V)$。则 $(U\\cap V)\\cap S_\\alpha=\\varnothing$\
  \ 且 $S_\\alpha\\subset (U\\cup V)$ 对所有 $\\alpha\\in A$ 成立。由于每个 $S_\\alpha$ 在 $X$\
  \ 中连通，我们由定理 9.1.15(b) 得到对所有 $\\alpha\\in A$ 要么 $S_\\alpha\\subset U$ 要么 $S_\\alpha\\\
  subset V$。根据假设，存在点 $x$ 在 $\\bigcap_{\\alpha\\in A}S_\\alpha\\subset (U\\cup V)$\
  \ 中。设不失一般性 $x$ 在 $U$ 中，故 $U\\cap S_\\alpha\\neq\\varnothing$ 对所有 $\\alpha$ 成立。若对某个\
  \ $\\alpha$ 有 $S_\\alpha\\subset V$，则 $(U\\cap V)\\cap S_\\alpha=\\varnothing$ 简化为\
  \ $U\\cap S_\\alpha=\\varnothing$，这是矛盾的。于是可推出 $S_\\alpha\\subset U$ 对所有 $\\alpha\\\
  in A$ 成立，故 $S\\subset U$。再次由定理 9.1.15(b)，$S$ 在 $X$ 中连通。\n\n## 定理 9.1.17.\n\n拓扑空间的不同的连通分支构成拓扑空间的一个划分。\n\
  \n**证明.** 设 $X$ 为拓扑空间，且 $x$ 为 $X$ 中的点。显然，$\\{x\\}$ 在 $X$ 中连通。设 $C$ 为包含 $x$ 的 $X$\
  \ 中所有连通子集的并集。由定理 9.1.16，$C$ 在 $X$ 中连通，且显然是 $X$ 的一个连通分支。于是 $X$ 有一个或多个连通分支，其并集等于 $X$。剩下要证明不同的连通分支是互不相交的。我们证明逻辑等价的断言：如果连通分支不相交，则它们相等。设\
  \ $C$ 和 $D$ 为不相交的连通分支。由定理 9.1.16，$C\\cup D$ 在 $X$ 中连通。于是由极大性可得 $C=C\\cup D=D$。\n\
  \n## 定理 9.1.18.\n\n设 $X$ 和 $Y$ 为拓扑空间，且 $F:X\\longrightarrow Y$ 为连续映射。若 $X$ 连通，则\
  \ $F(X)$ 在 $Y$ 中连通。\n\n**证明.** 我们证明逻辑等价的断言：如果 $F(X)$ 在 $Y$ 中不连通，则 $X$ 不连通。由定理 9.1.15(a)，存在\
  \ $Y$ 中的非空开集 $U$ 和 $V$ 使得 (i) $(U\\cap V)\\cap F(X)=\\varnothing$，(ii) $F(X)\\subset\
  \ (U\\cup V)$，且 (iii) $U\\cap F(X)\\neq\\varnothing$ 且 $V\\cap F(X)\\neq\\varnothing$。由定理\
  \ 9.1.7 及定理 A.3 的 (b) 和 (c) 部分可得 $F^{-1}(U)$ 和 $F^{-1}(V)$ 是 $X$ 中不相交的非空开集使得 $X=F^{-1}(U)\\\
  cup F^{-1}(V)$。于是 $X$ 不连通。\n\n## 定理 9.1.19 (介值定理)。\n\n设 $X$ 为连通拓扑空间，且 $f:X\\longrightarrow\\\
  mathbb{R}$ 为连续函数。若 $x_1,x_2$ 为 $X$ 中的点且 $c$ 为实数使得 $f(x_1)<c<f(x_2)$，则存在 $X$ 中的点\
  \ $x_0$ 使得 $f(x_0)=c$。\n\n\n\n\n\n**证明.** 考虑集合 $S_1=f(X)\\cap(-\\infty,c)$ 和 $S_2=f(X)\\\
  cap(c,+\\infty)$。显然 $S_1$ 和 $S_2$ 是不相交且非空的。由于 $(-\\infty,c)$ 和 $(c,+\\infty)$ 在\
  \ $\\mathbb{R}$ 中是开集，$S_1$ 和 $S_2$ 在 $f(X)$ 中是开的。假设不存在点 $x_0$ 在 $X$ 中使得 $f(x_0)=c$。则\
  \ $f(X)=S_1\\cup S_2$。于是，$f(X)$ 在 $\\mathbb{R}$ 中是不连通的，这与定理 9.1.18 矛盾。◻\n\n## 定理\
  \ 9.1.20.\n\n*若 $X$ 是一个连通拓扑空间且 $f:X\\to\\mathbb{R}$ 是一个处处非零的连续函数，则 $f$ 要么严格为正，要么严格为负。*\n\
  \n**证明.** 设 $x_1$ 和 $x_2$ 是 $X$ 中不同的点。由于 $f$ 处处非零，$f(x_1),f(x_2)\\ne0$。若 $f(x_1)>0$，则\
  \ $f(x_2)>0$；否则，由定理 9.1.19，存在点 $x_0$ 在 $X$ 中使得 $f(x_0)=0$，这与 $f$ 的处处非零假设矛盾。类似地，若\
  \ $f(x_1)<0$，则 $f(x_2)<0$。由于 $x_1$ 和 $x_2$ 是任意的，结果得证。◻\n\n设 $X$ 是一个拓扑空间，且 $\\mathcal{U}=\\\
  {U_\\alpha:\\alpha\\in A\\}$ 是 $X$ 中一族开集。我们称 $\\mathcal{U}$ 是 $X$ 的一个**开覆盖**，如果\
  \ $X=\\bigcup_{\\alpha\\in A}U_\\alpha$。$\\mathcal{U}$ 的一个子族如果也是 $X$ 的开覆盖，则称其为 $\\\
  mathcal{U}$ 的一个**子覆盖**。若子覆盖是有限集，则称为**有限子覆盖**。我们称 $X$ 为**紧**拓扑空间，如果 $X$ 的每一个开覆盖都有有限子覆盖。$X$\
  \ 的子集 $S$ 称为 $X$ 中的**紧集**或简称为 $X$ 中**紧**，如果它作为拓扑子空间是紧的。\n\n## 定理 9.1.21.\n\n*设 $X$\
  \ 和 $Y$ 为拓扑空间，且 $F:X\\to Y$ 为连续映射。若 $X$ 紧，则 $F(X)$ 在 $Y$ 中紧。*\n\n**证明.** 设 $\\mathcal{V}$\
  \ 是 $F(X)$ 的一个开覆盖。则 $\\mathcal{V}=\\{V_\\alpha\\cap F(X):\\alpha\\in A\\}$，其中每个\
  \ $V_\\alpha$ 是 $Y$ 中的开集。由定理 A.1(a)，\n\n$$F(X)=\\left(\\bigcup_{\\alpha\\in A}V_\\\
  alpha\\right)\\cap F(X)=\\bigcup_{\\alpha\\in A}[V_\\alpha\\cap F(X)],$$\n\n且由定理\
  \ A.3(b)，\n\n$$X=F^{-1}(F(X))=\\bigcup_{\\alpha\\in A}F^{-1}(V_\\alpha\\cap F(X))=\\\
  bigcup_{\\alpha\\in A}F^{-1}(V_\\alpha).$$\n\n由定理 9.1.7 可知 $\\{F^{-1}(V_\\alpha):\\\
  alpha\\in A\\}$ 是 $X$ 的一个开覆盖。由于 $X$ 紧，存在有限子覆盖 $\\{F^{-1}(V_i):i=1,\\ldots,k\\}$，于是\n\
  \n$$X=\\bigcup_iF^{-1}(V_i).$$\n\n由定理 A.3 的 (a) 和 (d) 部分，\n\n$$F(X)=\\bigcup_iF(F^{-1}(V_i))=\\\
  bigcup_i[V_i\\cap F(X)].$$\n\n于是，$\\{V_i\\cap F(X):i=1,\\ldots,k\\}$ 是 $\\mathcal{V}$\
  \ 的一个有限子覆盖。◻\n\n设 X 为拓扑空间，且 f : X ⟶ ℝ 为函数。我们称 f 在 X 上有界或简称为有界，如果存在实数 c > 0 使得对所有点\
  \ x ∈ X 都有 |f(x)| < c。设 S 为 ℝ 的非空子集。元素 s1 ∈ S 称为 S 中的最小元素，如果对所有 s ∈ S 都有 s1 ≤ s。类似地，元素\
  \ s2 ∈ S 称为 S 中的最大元素，如果对所有 s ∈ S 都有 s ≤ s2。若 S 有最小元素 s1 和最大元素 s2，则对所有 s ∈ S 都有 s1\
  \ ≤ s ≤ s2。考虑开集族 \U0001D4B0 = {(-∞, s) ∩ S : s ∈ S} 在 S 中。若 S 有最大元素 s2，则 s2 不在 ∪_{s∈S}(-∞,\
  \ s) 中，所以 \U0001D4B0 不是 S 在 ℝ 中的开覆盖。另一方面，若 S 没有最大元素，则 \U0001D4B0 是 S 在 ℝ 中的开覆盖。\n\
  \n## 定理 9.1.22 (极值定理). 若 X 是紧拓扑空间且 f : X ⟶ ℝ 是连续函数，则：\n\n- (a) 存在点 x1 和 x2 在 X 中使得对所有\
  \ x ∈ X 都有 f(x1) ≤ f(x) ≤ f(x2)。\n- (b) f 有界。\n\n证明. (a): 该断言等价于：存在点 x1 和 x2 在 X\
  \ 中使得 f(x1) 是 f(X) 中的最小元素，且 f(x2) 是 f(X) 中的最大元素。假设为矛盾，设 f(X) 没有最大元素。根据上述说明，{(-∞,\
  \ f(x)) ∩ f(X) : x ∈ X} 是 f(X) 的一个开覆盖。由于 X 紧且 f 连续，由定理 9.1.21，f(X) 在 ℝ 中紧。于是存在有限子覆盖\
  \ {(-∞, f(xi)) ∩ f(X) : i = 1, …, m}，其中不失一般性假设 f(x1) < ⋯ < f(xm)。由定理 A.1(a)，f(X)\
  \ = ⋃_{i=1}^m [(-∞, f(xi)) ∩ f(X)] = [⋃_{i=1}^m (-∞, f(xi))] ∩ f(X) = (-∞, f(xm))\
  \ ∩ f(X)，故 f(X) ⊆ (-∞, f(xm))。由于 f(xm) ∈ f(X) 但不在 (-∞, f(xm)) 中，我们得到矛盾。于是 f(X) 有最大元素。证明\
  \ f(X) 有最小元素是类似的。(b): 这由 (a) 得出。\n\n设 X 为拓扑空间，且 f : X ⟶ ℝ 为函数。f 的支集记为 supp(f) 并定义为\
  \ f 非零点集在 X 中的闭包：supp(f) = cl_X({x ∈ X : f(x) ≠ 0})。于是，supp(f) 是包含 f 非零点的最小闭集。我们称\
  \ f 有紧支集，如果 supp(f) 在 X 中紧。给定 X 的子集 S，我们称 f 的支集在 S 中，如果 supp(f) ⊆ S。\n\n证明. 对开球而言，这由定义可知。设\
  \ \\overline{B}_r(x) 为 X 中的闭球，且 y 为 X\\setminus\\overline{B}_r(x) 中的点，于是 d(x,y)\
  \ > r。设 s = d(x,y) − r，且 z 为 B_s(y) 中的点，这意味着 d(y,z) < s。见图 9.2.1。由 [D2] 和 [D3]，\n\
  \n```\nr + s = d(x,y) ≤ d(x,z) + d(z,y) < d(x,z) + s,\n```\n\n故 d(x,z) > r，所以 z\
  \ 在 X\\setminus\\overline{B}_r(x) 中。于是 B_s(y) ⊆ X\\setminus\\overline{B}_r(x)。可知\
  \ X\\setminus\\overline{B}_r(x) 是基元素的一个并集。由定理 9.1.3 和定理 9.2.2，X\\setminus\\overline{B}_r(x)\
  \ 对由 d 诱导的度量拓扑是开的，故 \\overline{B}_r(x) = X\\setminus[X\\setminus\\overline{B}_r(x)]\

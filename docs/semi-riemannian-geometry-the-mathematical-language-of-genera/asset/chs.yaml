  \ G^i}{\\partial r^j}(q)\\right]=\\mathcal J_{\\widetilde\\varphi^{-1}\\circ F\\\
  circ\\varphi}(q).$$\n\n# ### 11.7 $\\mathbb R^3$ 中正则曲面上的向量场\n\n设 $M$ 为正则曲面，设 $V:M\\\
  longrightarrow\\mathbb R^3$ 为映射，且 $p$ 为 $M$ 中的点。在本上下文中，我们称 $V$ 为沿 $M$ 的**向量场**。我们称\
  \ $V$ 在 $p$ 处**消失**如果 $V_p=(0,0,0)$，在 $p$ 处**非消失**如果 $V_p\\ne(0,0,0)$，并且在 $M$ 上**处处非消失**如果它在\
  \ $M$ 中每个 $p$ 处都非消失。\n\n设 $\\mathfrak X_{\\mathbb R^3}(M)$ 表示沿 $M$ 的光滑向量场的集合。则 $\\\
  mathfrak X_{\\mathbb R^3}(M)$ 只是从 $M$ 到 $\\mathbb R^3$ 的（延拓）光滑映射的集合。以与第 10.3 节类似的方式定义\
  \ $\\mathfrak X_{\\mathbb R^3}(M)$ 上的运算，$\\mathfrak X_{\\mathbb R^3}(M)$ 是 $\\mathbb\
  \ R$ 上的向量空间且是 $C^\\infty(M)$ 上的模。我们称沿 $M$ 的向量场 $X:M\\to\\mathbb R^3$ 为 $M$ 上的**（切）向量场**如果对所有\
  \ $p\\in M$ 都有 $X_p$ 在 $T_p(M)$ 中。$M$ 上的光滑向量场的集合记为 $\\mathfrak X(M)$。显然，$\\mathfrak\
  \ X(M)\\subset\\mathfrak X_{\\mathbb R^3}(M)$。事实上，$\\mathfrak X(M)$ 是 $\\mathfrak\
  \ X_{\\mathbb R^3}(M)$ 的向量子空间和 $C^\\infty(M)$-子模。作为例子，对于具有覆盖坐标图的正则曲面，对应的坐标标架的每个分量都是切向量场。\n\
  \n**定理 11.7.1 (向量场的光滑性准则).** 若 $M$ 为正则曲面且 $V:M\\longrightarrow\\mathbb R^3$ 为沿 $M$\
  \ 的向量场，则以下等价：\n\n(a) $V$ 是（延拓）光滑的。\n\n(b) 对 $M$ 中每一点 $p$，存在 $M$ 在 $p$ 处的图 $(U,\\\
  varphi)$ 使得映射 $V\\circ\\varphi:U\\longrightarrow\\mathbb R^3$ 是（欧几里得）光滑的。\n\n(c)\
  \ 对 $M$ 上的每个图 $(U,\\varphi)$，映射 $V\\circ\\varphi:U\\longrightarrow\\mathbb R^3$\
  \ 是（欧几里得）光滑的。\n\n*证明.* 将 $n=3$ 且 $F=V$ 代入定理 11.2.12 即得结果。\n\n# 11.7 $\\mathbb{R}^3$\
  \ 中沿正则曲面的向量场\n\n设 $M$ 为正则曲面，设 $V$ 为 $\\mathfrak{X}_{\\mathbb{R}^3}(M)$ 中的向量场，且 $p$\
  \ 为 $M$ 中的点。$V$ 在 $p$ 处的微分是映射\n\n\\[d_p(V):T_p(M)\\longrightarrow \\mathbb{R}^3\\\
  ]\n\n定义为\n\n\\[d_p(V)(v)=\\left.\\frac{d(V\\circ\\lambda)}{dt}\\right|_{t_0}\\tag{11.7.1}\\\
  ]\n\n对所有 $v\\in T_p(M)$，其中 $\\lambda(t):(a,b)\\longrightarrow M$ 是任意光滑曲线使得 $\\lambda(t_0)=p$\
  \ 且 $(d\\lambda/dt)(t_0)=v$ 对某个 $t_0\\in(a,b)$ 成立。注意这不是 (11.6.1) 的特例，因为 $\\mathbb{R}^3$\
  \ 不是正则曲面。\n\n**定理 11.7.2.** *在上述设定下，若* $V=(\\alpha^1,\\alpha^2,\\alpha^3)$，*则*\n\
  \n\\[d_p(V)(v)=\\bigl(d_p(\\alpha^1)(v),d_p(\\alpha^2)(v),d_p(\\alpha^3)(v)\\bigr).\\\
  ]\n\n*证明.* 由于 $V\\circ\\lambda=(\\alpha^1\\circ\\lambda,\\alpha^2\\circ\\lambda,\\\
  alpha^3\\circ\\lambda)$，我们有\n\n\\[d_p(V)(v)=\\left.\\frac{d(V\\circ\\lambda)}{dt}\\\
  right|_{t_0}\\]\n\n\\[=\\left(\\left.\\frac{d(\\alpha^1\\circ\\lambda)}{dt}\\right|_{t_0},\\\
  left.\\frac{d(\\alpha^2\\circ\\lambda)}{dt}\\right|_{t_0},\\left.\\frac{d(\\alpha^3\\\
  circ\\lambda)}{dt}\\right|_{t_0}\\right)\\]\n\n\\[=\\bigl(d_p(\\alpha^1)(v),d_p(\\\
  alpha^2)(v),d_p(\\alpha^3)(v)\\bigr).\\]\n\n**定理 11.7.3.** *在上述设定下：*  \n(a) $d_p(V)(v)$\
  \ 与用于表达 $v$ 的光滑曲线的选取无关。  \n(b) $d_p(V)$ 是线性的。\n\n*证明.* 鉴于定理 11.7.2，结果由将定理 11.5.2\
  \ 应用于 $d_p(V)(v)$ 的每个分量可得。\n\nand in the latter case,\n\ng^{-1}(a) = d,      g^{-1}(b)\
  \ = c,      and      \\frac{dg}{du}(u) = -\\left|\\frac{dg}{du}(u)\\right|.\n\n\
  Either way,\n\n\\int_{g^{-1}(a)}^{g^{-1}(b)} \\left\\|\\frac{d\\lambda}{dt}(g(u))\\\
  right\\| \\frac{dg}{du}(u) du = \\int_{d}^{c} \\left\\|\\frac{d\\lambda}{dt}(g(u))\\\
  right\\| \\left|\\frac{dg}{du}(u)\\right| du = \\int_{c}^{d} \\left\\|\\frac{d(\\\
  lambda \\circ g)}{du}(u)\\right\\| du = L(\\lambda \\circ g).\n\nThe result follows.\n\
  \n# 12.2 $\\mathbb{R}^3_{\\nu}$ 中的正则曲面\n\n正则曲面按定义是 $\\mathbb{R}^3$ 的子集。我们现在将正则曲面视为\
  \ $\\mathbb{R}^3_{\\nu}$ 的子集，其中 $\\nu$ 未指定。$\\mathbb{R}^3_{\\nu}$ 上的标量积由\n\n\\langle\\\
  cdot,\\cdot\\rangle = \\begin{cases} \\mathfrak{e} & \\text{if } \\nu = 0 \\\\ \\\
  mathfrak{m} & \\text{if } \\nu = 1, \\end{cases}\n\n给出，其中 $\\mathfrak{e}$ 和 $\\\
  mathfrak{m}$ 分别是欧几里得内积和闵可夫斯基标量积。\n\n设 $M$ 为正则曲面，且 $p$ 为 $M$ 中的点。我们通过将 $\\mathbb{R}^3_{\\\
  nu}$ 上的标量积限制到 $T_p(M) \\times T_p(M)$ 得到 $ \\mathcal{T}^0_2(T_p(M))$ 中的对称张量 $\\\
  mathfrak{g}_p$：\n\n\\mathfrak{g}_p = \\begin{cases} \\mathfrak{e}|_{T_p(M)} & \\\
  text{if } \\nu = 0 \\\\ \\mathfrak{m}|_{T_p(M)} & \\text{if } \\nu = 1. \\end{cases}\
  \ \\quad (12.2.1)\n\n为简便起见，我们通常用\n\n\\mathfrak{g}_p(\\cdot,\\cdot) \\quad \\text{记为}\
  \ \\quad \\langle\\cdot,\\cdot\\rangle.\n\n记号 $\\langle\\cdot,\\cdot\\rangle$ 指\
  \ $\\mathbb{R}^3_{\\nu}$ 上的标量积还是张量 $\\mathfrak{g}_p$ 将由上下文明确。\n\n$M$ 上的第一基本形式是记为\
  \ $\\mathfrak{g}$ 且由赋值 $p \\longmapsto \\mathfrak{g}_p$ 对所有 $p\\in M$ 定义的映射。在文献中，$\\\
  mathfrak{g}$ 常记为 $I$。对 $\\mathfrak{X}(M)$ 中的向量场 $X,Y$，我们定义函数\n\n\\mathfrak{g}(X,Y)\
  \ = \\langle X,Y\\rangle : M \\longrightarrow \\mathbb{R}\n\n在 $C^{\\infty}(M)$\
  \ 中由赋值\n\np \\longmapsto \\mathfrak{g}_p(X_p,Y_p) = \\langle X_p,Y_p\\rangle\n\n\
  给出\n\n# ## 定理 12.2.1.\n\n*在上述设定下，若* $V$ *满足* [V2]，*则：*\n\n+   (a) $V$ 在 $M$ 上处处非消失；即对所有\
  \ $p\\in M$ 有 $V_p \\ne (0,0,0)$。\n+   \n+   (b) $\\|V\\|$ 在 $M$ 上处处非消失；即对所有 $p\\\
  in M$ 有 $\\|V_p\\| \\ne 0$。\n+   \n+   (c) $V/\\|V\\|$ 是沿 $M$ 的单位向量场，且若 $V$ 在 $M$\
  \ 上光滑，则 $V/\\|V\\|$ 亦光滑。\n+   \n+   (d) 若 $\\nu \\ne 0$，则部分 (a) 的逆命题成立：$V$ 满足 [V2]\
  \ 当且仅当 $V$ 处处非消失。\n\n*证明.* (a), (b), (d): 显而易见。\n\n(c): 第一个断言由部分 (b) 可得。对于第二个断言，由于\
  \ $V$ 满足 [V2]，要么 $\\langle V,V\\rangle=\\langle V,V\\rangle$ 在 $M$ 上成立，要么 $\\langle\
  \ V,V\\rangle=-\\langle V,V\\rangle$ 在 $M$ 上成立。由于 $V$ 在 $M$ 上光滑，故 $\\langle V,V\\\
  rangle$ 亦光滑，因此 $\\|V\\|=\\sqrt{|\\langle V,V\\rangle|}$ 亦光滑。于是 $V/\\|V\\|$ 光滑。\n\
  \n我们现在证明性质 [G1]–[G2] 和 [V1]–[V2] 密切相关。为叙述方便起见，以下大部分结果均对任意 $\\nu$ 给出。然而，$\\nu=0$\
  \ 的情形本质上是平凡的；$\\nu=1$ 的情形才是主要关注的对象。\n\n# ## 定理 12.2.2.\n\n*设* $M$ *为正则曲面，设* $g$\
  \ *为* $M$ *上的第一基本形式，且* $p$ *为* $M$ *中* $g_p$ *非退化的点。则：*\n\n+   (a) 在 $p$ 处恰有两个单位法向量。\n\
  +   \n+   (b) 若 $v$ 为 $p$ 处的单位法向量，则\n\n$$T_p(M)^\\perp=\\mathbb{R}v \\qquad\\text{and}\\\
  qquad \\langle v,v\\rangle=(-1)^{\\nu-\\operatorname{ind}(g_p)}.$$\n\n*证明.* 由定理\
  \ 4.1.3 可知 $\\mathbb{R}^3_\\nu=T_p(M)\\oplus T_p(M)^\\perp$，然后由定理 1.1.18 可知 $T_p(M)^\\\
  perp$ 为 1 维的。因此，$T_p(M)^\\perp=\\mathbb{R}v$，其中 $v$ 为 $T_p(M)^\\perp$ 中的两个单位向量之一，另一个为\
  \ $-v$。设 $(e_1,e_2)$ 为 $T_p(M)$ 的标准正交基。则 $(e_1,e_2,v)$ 为 $\\mathbb{R}^3_\\nu$ 的标准正交基。两次使用\
  \ (4.2.3) 得到\n\n$$(-1)^\\nu=\\langle e_1,e_1\\rangle\\langle e_2,e_2\\rangle\\langle\
  \ v,v\\rangle=(-1)^{\\operatorname{ind}(g_p)}\\langle v,v\\rangle.$$\n\n# ## 定理\
  \ 12.2.3.\n\n*设* $M$ *为正则曲面，且* $g$ *为第一基本形式。则：*\n\n+   (a) $g$ 满足 [G1] 当且仅当存在沿 $M$\
  \ 满足 [V1] 的单位法向量场 $V$。\n+   \n+   (b) 若 $V$ 和 $\\widetilde V$ 为沿 $M$ 满足 [V1] 的单位法向量场，则对所有\
  \ $p\\in M$ 有 $\\langle V_p,V_p\\rangle=\\langle\\widetilde V_p,\\widetilde V_p\\\
  rangle$。\n\n*证明.* (a) (⇒): 这由定理 12.2.2 的部分 (a) 和 (b) 可得。\n\n(a) (⇐): 设 $p$ 为 $M$\
  \ 中的点。若 $v$ 为 $T_p(M)\\cap T_p(M)^\\perp$ 中的向量，则 $\\langle v,v\\rangle=0$。由于 $T_p(M)^\\\
  perp=\\mathbb{R}V_p$，我们有 $v=cV_p$ 对某个实数 $c$ 成立。则\n\n$$0=\\langle cV_p,cV_p\\rangle=c^2\\\
  langle V_p,V_p\\rangle=\\pm c^2,$$\n\n故 $c=0$。因此，$T_p(M)\\cap T_p(M)^\\perp=\\{0\\\
  }$。由定理 4.1.3，$g_p$ 在 $T_p(M)$ 上非退化。由于 $p$ 任意，结果得证。\n\n\n\n\n\n(b): 设 p 是 M 中的一点。\
  \ 由于 ℝV_p = T_p(M)⊥ = ℝṼ_p，我们有 Ṽ_p = c V_p 对某个实数 c。 然后 ±1 = ⟨Ṽ_p, Ṽ_p⟩ = c²⟨V_p,\
  \ V_p⟩ = ±c²，故 c = ±1。 从而，⟨Ṽ_p, Ṽ_p⟩ = ⟨±V_p, ±V_p⟩ = ⟨V_p, V_p⟩。 由于 p 是任意的，结果得证。\n\
  \n## 定理 12.2.4. 设 M 是一个正则曲面，V 是沿 M 的单位法向量场，且 \U0001D524 是 M 上的第一基本形式满足 [G1]。 则 \U0001D524\
  \ 满足 [G2] 当且仅当 V 满足 [V2]。\n\n证明。 由于 V 是沿 M 的单位向量场，[V2] 等价于：⟨V_p, V_p⟩ = 1 对所有 p∈M\
  \ 成立，或 ⟨V_p, V_p⟩ = −1 对所有 p∈M 成立。 根据定理 12.2.2(b)，(−1)^{ν−ind(\U0001D524_p)} = ⟨V_p,\
  \ V_p⟩。 结果得证。\n\n设 M 是一个正则曲面，且 \U0001D524 是 M 上的第一基本形式。 当 \U0001D524 为度量时，称对 (M,\
  \ \U0001D524) 为 ℝ³_ν 中的正则曲面。 在这种情况下，我们将 \U0001D524 的那些与 p 无关的 \U0001D524_p 的性质归于\
  \ \U0001D524。 相应地，\U0001D524 被称为双线性的、对称的、非退化的，等等。 ind(\U0001D524_p) 的共同值记为 ind(\U0001D524\
  ) 并称为 \U0001D524 的指标或 M 的指标。\n\n下面的结果表明，我们本可以使用性质 [V1] 和 [V2] 而不是 [G1] 和 [G2] 来定义\
  \ ℝ³_ν 中的正则曲面。\n\n## 定理 12.2.5. 设 M 是一个正则曲面。 则 (M, \U0001D524) 是 ℝ³_ν 中的正则曲面当且仅当存在沿\
  \ M 的单位法向量场满足 [V1] 和 [V2]。\n\n证明。 这由定理 12.2.3(a) 和定理 12.2.4 推出。\n\n## 定理 12.2.6.\
  \ 设 M 是一个正则曲面，且 \U0001D524 是 M 上的第一基本形式。 设 (U, φ) 是 M 上的一个坐标图，(H₁, H₂) 是相应的坐标标架，且利用例\
  \ 11.2.5 将 φ(U) 视为正则曲面。 则 (φ(U), \U0001D524|_{φ(U)}) 是 ℝ³_ν 中的正则曲面当且仅当 ⟨H₁|_q ×\

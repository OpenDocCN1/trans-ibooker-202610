  \ M)\\) 中的唯一外指向单位法向量场（由定理 19.11.3 给出），且 \\(\\partial_M\\) 为由 \\(W\\) 诱导的（Stokes）定向，使得\
  \ \\((\\partial M,\\epsilon|_{\\partial M},\\mathcal{D}_{\\partial M})\\) 为 \\((M,\\\
  epsilon|_M,\\mathcal{D}_M)\\) 的一个定向黎曼超曲面。设 \\(\\Omega_{\\partial M}\\) 为其体积形式，且\
  \ \\(U = V \\times W\\)。若 \\(X\\) 为 \\(\\mathfrak{X}(\\mathbb{R}^3_0)\\) 中的一个向量场，则\n\
  \n\\[\n\\int_M \\langle \\operatorname{Curl}(X), V \\rangle\\, \\Omega_M = \\int_{\\\
  partial M} \\langle X, U \\rangle\\, \\Omega_{\\partial M}.\n\\]\n\n证明。根据 Stokes\
  \ 定理，\n\n\\[\n\\int_M d(X^\\flat) = \\int_{\\partial M} X^\\flat. \\tag{21.2.1}\n\
  \\]\n\n我们寻求 (21.2.1) 中被积函数的替代表达式。对于左边，定理 19.11.2(b) 和定理 20.5.1 给出\n\n\\[\nd(X^\\\
  flat) = i_{\\operatorname{Curl}(X)}(\\Omega_{\\mathbb{R}^3_0})|_M = \\langle \\\
  operatorname{Curl}(X), V \\rangle\\, \\Omega_M, \\tag{21.2.2}\n\\]\n\n其中 \\(\\Omega_{\\\
  mathbb{R}^3_0}\\) 为 \\(\\mathbb{R}^3_0\\) 上的体积形式。对于右边，根据定理 19.11.4(e)，\n\n\\[\n\\\
  Omega_{\\partial M}(U) = \\pm 1_{\\partial M}. \\tag{21.2.3}\n\\]\n\n由于 \\(X^\\\
  flat|_{\\partial M}\\) 为 \\(\\mathfrak{X}^*(\\partial M) = \\Lambda^1(\\partial\
  \ M)\\) 中的一个协向量场，由定理 3.3.3、定理 15.8.5 和定理 19.10.2 可知存在唯一的函数 \\(f\\) 在 \\(C^\\infty(\\\
  partial M)\\) 中使得\n\n\\[\nX^\\flat|_{\\partial M} = f\\, \\Omega_{\\partial M}.\
  \ \\tag{21.2.4}\n\\]\n\n我们有\n\n\\[\n\\begin{aligned}\nf &= f\\, \\Omega_{\\partial\
  \ M}(U) && [(21.2.3)]\\\\\n&= X^\\flat|_{\\partial M}(U) && [(21.2.4)]\\\\\n&= \\\
  langle X|_{\\partial M}, U \\rangle. && [(19.4.1)]\n\\end{aligned} \\tag{21.2.5}\n\
  \\]\n\n然后 (21.2.4) 和 (21.2.5) 给出\n\n\\[\nX^\\flat|_{\\partial M} = \\langle X|_{\\\
  partial M}, U \\rangle\\, \\Omega_{\\partial M}. \\tag{21.2.6}\n\\]\n\n将 (21.2.2)\
  \ 和 (21.2.6) 代入 (21.2.1) 得到结果。\n\n### 定理 21.2.5（经典散度定理）\n\n设 \\((M,\\mathfrak{e}|_M,\\\
  mathfrak{O}_M)\\) 为 \\(\\mathbb{R}^3_0 = (\\mathbb{R}^3,\\mathfrak{e})\\) 的一个紧致定向黎曼\
  \ 3-子流形带边界，使得 \\((\\partial M,\\mathfrak{e}|_{\\partial M})\\) 为 \\((M,\\mathfrak{e}|_M,\\\
  mathfrak{O}_M)\\) 的一个黎曼超曲面，且 \\(X\\) 为 \\(\\mathfrak{X}(M)\\) 中的一个向量场。设 \\(V\\)\
  \ 为 \\(\\mathfrak{X}_M(\\partial M)\\) 中的唯一外指向单位法向量场（由定理 19.11.3 给出），且 \\(\\partial\
  \ M\\) 具有由 \\(V\\) 诱导的定向 \\(\\mathfrak{O}_{\\partial M}\\)，使得 \\((\\partial M,\\\
  mathfrak{e}|_{\\partial M},\\mathfrak{O}_{\\partial M})\\) 为 \\((M,\\mathfrak{e}|_M,\\\
  mathfrak{O}_M)\\) 的一个定向黎曼超曲面。设 \\(\\Omega_{\\partial M}\\) 为其体积形式。则\n\n\\[\n\\int_M\

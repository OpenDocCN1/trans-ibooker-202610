  \n$= \\operatorname{sgn}(\\sigma_{(I,I^c)})\\Omega_V, \\quad [\\text{Th 8.3.4}]$\n\
  \n因此 $\\langle\\star(\\xi^I),\\xi^{I^c}\\rangle^{\\Lambda}\\Omega_V = \\operatorname{sgn}(\\\

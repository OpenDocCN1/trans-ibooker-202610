  right)\\mathcal A^{i_1\\ldots i_{k-1}q i_{k+1}\\ldots i_r}_{j_1\\ldots j_s}\\\\\n\
  &=\\sum_q\\delta_q^{i_k}\\mathcal A^{i_1\\ldots i_{k-1}q i_{k+1}\\ldots i_r}_{j_1\\\
  ldots j_s}\\\\\n&=\\mathcal A^{i_1\\ldots i_{k-1}i_k i_{k+1}\\ldots i_r}_{j_1\\\
  ldots j_s}.\n\\end{aligned}$$\n\n证明的其余部分使用示例 6.3.6 中给出的论证。\n\n## 6.4 张量的表示\n\n第\
  \ 5.3 节讨论了向量空间上张量的表示问题。现在我们将该讨论推广到标量积空间上的张量。\n\n设 $(V,\\mathfrak g)$ 为标量积空间，$\\\
  mathcal H=(h_1,\\ldots,h_m)$ 为 $V$ 的一组基，$(\\theta^1,\\ldots,\\theta^m)$ 为其对偶基，并设\
  \ $\\mathfrak g_\\mathcal H=[g_{ij}]$。遵循第 B.5 节和第 B.6 节，我们用 $\\operatorname{Mult}(V^s,V)$\
  \ 表示从 $V^s$ 到 $V$ 的 $\\mathbb R$-多重线性映射构成的向量空间。我们定义一个映射\n\n$$\\widetilde S_s:\\\
  operatorname{Mult}(V^s,V)\\longrightarrow\\mathcal T^0_{s+1}(V),$$\n\n称之为 **标量积映射**，定义为\n\
  \n$$\\mathcal{S}_s(\\Psi)(v_1,\\ldots,v_{s+1})=\\langle v_1,\\Psi(v_2,\\ldots,v_{s+1})\\\
  rangle \\tag{6.4.1}$$\n\n其中 $\\Psi$ 为 $\\operatorname{Mult}(V^s,V)$ 中的任意映射，$v_1,\\\
  ldots,v_{s+1}$ 为 $V$ 中的任意向量。当 $s=1$ 时，我们将\n\n$$\\mathcal{S}_1\\quad\\text{记作}\\\
  quad\\mathcal{S}.$$\n\n### 定理 6.4.1（张量的表示）。*使用上述设置：*\n\n+   (a) $\\mathcal{S}_s$\
  \ 是一个线性同构：\n+   \n+   $$\\mathcal{T}^{0}_{s+1}(V)\\cong\\operatorname{Mult}(V^s,V).$$\n\
  \n+   (b) *对于* $\\operatorname{Mult}(V^s,V)$ *中的所有映射* $\\Psi$，张量 $\\mathcal{S}_s(\\\
  Psi)$ *在* $\\mathcal{T}^{0}_{s+1}(V)$ *中关于* $\\mathcal{H}$ *的分量为*\n+   \n+   $$\\\
  mathcal{S}_s(\\Psi)_{j_1\\ldots j_{s+1}}=\\sum_i g_{ij_1}\\,\\theta^i\\bigl(\\Psi(h_{j_2},\\\
  ldots,h_{j_{s+1}})\\bigr).$$\n\n+   (c) *对于* $\\mathcal{T}^{0}_{s+1}(V)$ *中的所有张量*\
  \ $\\mathcal{A}$，\n+   \n+   $$\\mathcal{S}_s^{-1}(\\mathcal{A})(h_{j_1},\\ldots,h_{j_s})=\\\
  sum_i \\mathcal{S}_1^1(\\mathcal{A})_{j_1\\ldots j_s i}h_i,$$\n+   \n+   其中 $\\\
  mathcal{S}_1^1$ 在第 6.3 节中定义。\n\n+   (d)\n+   \n+   $$\\mathcal{R}_s=\\mathcal{S}_1^1\\\
  circ\\mathcal{S}_s,$$\n+   \n+   其中 $\\mathcal{R}_s$ 由 (5.3.1) 给出。\n\n**证明。** (a)：容易证明\
  \ $\\mathcal{S}_s$ 是线性映射。若 $\\mathcal{S}_s(\\Psi)=0$，则对于 $V$ 中的所有向量 $v_1,\\ldots,v_{s+1}$，有\
  \ $\\langle\\Psi(v_2,\\ldots,v_{s+1}),v_1\\rangle=0$。由于 $\\mathfrak{g}$ 非退化，我们有\
  \ $\\Psi(v_2,\\ldots,v_{s+1})=0$，又因为 $v_2,\\ldots,v_{s+1}$ 是任意的，所以 $\\Psi=0$。因此，$\\\
  ker(\\mathcal{S}_s)=\\{0\\}$。由定理 5.1.3(c)，$\\mathcal{T}^{0}_{s+1}(V)$ 的维数为 $m^{s+1}$，且可以证明\
  \ $\\operatorname{Mult}(V^s,V)$ 具有相同维数。由定理 1.1.12 和定理 1.1.14 可知，$\\mathcal{S}_s$\
  \ 是线性同构。\n\n(b)：由于 $\\Psi(h_{j_2},\\ldots,h_{j_{s+1}})$ 是 $V$ 中的向量，由定理 1.2.1(d)\
  \ 有\n\n$$\\Psi(h_{j_2},\\ldots,h_{j_{s+1}})=\\sum_i\\theta^i\\bigl(\\Psi(h_{j_2},\\\
  ldots,h_{j_{s+1}})\\bigr)h_i,$$\n\n再由 (6.4.1) 有\n\n$$\\begin{aligned}\n\\mathcal{S}_s(\\\
  Psi)_{j_1\\ldots j_{s+1}}&=\\mathcal{S}_s(\\Psi)(h_{j_1},\\ldots,h_{j_{s+1}})=\\\
  langle h_{j_1},\\Psi(h_{j_2},\\ldots,h_{j_{s+1}})\\rangle\\\\\n&=\\left\\langle\
  \ h_{j_1},\\sum_i\\theta^i\\bigl(\\Psi(h_{j_2},\\ldots,h_{j_{s+1}})\\bigr)h_i\\\
  right\\rangle\\\\\n&=\\sum_i g_{ij_1}\\,\\theta^i\\bigl(\\Psi(h_{j_2},\\ldots,h_{j_{s+1}})\\\
  bigr).\n\\end{aligned}$$\n\n(c)：由于 \U0001D516_s⁻¹(\U0001D49C) 是 Mult(V^s, V) 中的映射，所以\
  \ \U0001D516_s⁻¹(\U0001D49C)(h_{j2},…,h_{js+1}) 是 V 中的向量。由定理 1.2.1(d) 有\n\n\U0001D516\
  _s⁻¹(\U0001D49C)(h_{j2},…,h_{js+1}) = Σ_i θ^i(\U0001D516_s⁻¹(\U0001D49C)(h_{j2},…,h_{js+1}))\
  \ h_i.  (6.4.2)\n\n于是\n\n\U0001D49C_{j1…js+1} = \U0001D49C(h_{j1},…,h_{js+1})\n\
  = \U0001D516_s(\U0001D516_s⁻¹(\U0001D49C))(h_{j1},…,h_{js+1})  [由 (a)]\n= ⟨h_{j1},\
  \ \U0001D516_s⁻¹(\U0001D49C)(h_{j2},…,h_{js+1})⟩  [(6.4.1)]\n= ⟨h_{j1}, Σ_i θ^i(\U0001D516\
  _s⁻¹(\U0001D49C)(h_{j2},…,h_{js+1})) h_i⟩  [(6.4.2)]\n= Σ_i \U0001D524_{ij1} θ^i(\U0001D516\
  _s⁻¹(\U0001D49C)(h_{j2},…,h_{js+1})),\n\n因此\n\nΣ_{j1} \U0001D524^{ij1} \U0001D49C\
  _{j1…js+1} = Σ_{j1} \U0001D524^{ij1} ( Σ_k \U0001D524_{kj1} θ^k(\U0001D516_s⁻¹(\U0001D49C\
  )(h_{j2},…,h_{js+1})) )\n= Σ_k ( Σ_{j1} \U0001D524^{ij1} \U0001D524_{j1k} ) θ^k(\U0001D516\
  _s⁻¹(\U0001D49C)(h_{j2},…,h_{js+1}))\n= Σ_k δ^i_k θ^k(\U0001D516_s⁻¹(\U0001D49C\
  )(h_{j2},…,h_{js+1}))\n= θ^i(\U0001D516_s⁻¹(\U0001D49C)(h_{j2},…,h_{js+1})),\n\n\
  所以\n\nΣ_{ij1} \U0001D524^{ij1} \U0001D49C_{j1…js+1} h_i = Σ_i θ^i(\U0001D516_s⁻¹(\U0001D49C\
  )(h_{j2},…,h_{js+1})) h_i.  (6.4.3)\n\n由定理 6.3.4，\n\nS₁¹(\U0001D49C)^i_{j2…js+1}\
  \ = Σ_{j1} \U0001D524^{ij1} \U0001D49C_{j1…js+1},\n\n因此\n\nΣ_i S₁¹(\U0001D49C)^i_{j2…js+1}\
  \ h_i = Σ_{ij1} \U0001D524^{ij1} \U0001D49C_{j1…js+1} h_i.  (6.4.4)\n\n综合 (6.4.2)–(6.4.4)\
  \ 得到\n\n\U0001D516_s⁻¹(\U0001D49C)(h_{j2},…,h_{js+1}) = Σ_i S₁¹(\U0001D49C)^i_{j2…js+1}\
  \ h_i,\n\n并将指标 (j2,…,js+1) 重新标记为 (j1,…,js) 即得结果。\n\n\n\n\n## 6.5 张量的度量缩并\n\n(d)\n\
  \n\U0001D505 = S₁¹ ∘ \U0001D516，\n\n其中 \U0001D505 由 (5.3.2) 给出。\n\n证明. (a)、(b)、(d)：这些可由定理\
  \ 6.4.1 的相应部分推出。\n\n(c)：由定理 6.4.1(c)，\n\n\U0001D516⁻¹(\U0001D49C)(hⱼ) = Σᵢ S₁¹(\U0001D49C\
  )ⁱⱼ hᵢ，\n\n因此由 (2.2.2) 和 (2.2.3) 得\n\n[\U0001D516⁻¹(\U0001D49C)]ᴴᵧ = [S₁¹(\U0001D49C\
  )ⁱⱼ]。\n\n由定理 6.3.4，\n\nS₁¹(\U0001D49C)ⁱⱼ = Σₚ \U0001D524ⁱᵖ \U0001D49Cₚⱼ，\n\n因此\n\
  \n[S₁¹(\U0001D49C)ⁱⱼ] = [\U0001D524ⁱʲ][\U0001D49Cᵢⱼ]。\n\n结论由此得出。\n\n对于向量空间上的张量，我们只能在一个逆变指标和一个协变指标上进行缩并。然而，对于标量积空间上的张量，平映射和尖映射使得在两个逆变指标或两个协变指标上进行缩并成为可能，由此得到的缩并称为度量缩并。\n\
  \n设 (V, \U0001D524) 是标量积空间。下面的定义受定理 6.2.5 和定理 6.3.5 启发。\n\n对于整数 r ≥ 2、s ≥ 0 以及 1\
  \ ≤ k < l ≤ r，定义 (k,l)-逆变度量缩并为线性映射\n\nC^{kl} : \U0001D4AF_s^r(V) ⟶ \U0001D4AF_s^{r-2}(V)\n\
  \n其定义为\n\nC^{kl} = C₁^k ∘ F₁^l. (6.5.1)\n\n由定理 6.2.5(b) 可得\n\nC^{k,k+1} = C₁^k ∘\
  \ F₁^k. (6.5.2)\n\n对于整数 r ≥ 0、s ≥ 2 以及 1 ≤ k < l ≤ s，定义 (k,l)-协变度量缩并为线性映射\n\nC_{kl}\
  \ : \U0001D4AF_s^r(V) ⟶ \U0001D4AF_{s-2}^r(V)\n\n其定义为\n\nC_{kl} = C_k^1 \\circ S_l^1.\
  \  (6.5.3)\n\n由定理 6.3.5(b) 可得\n\nC_{k,k+1} = C_k^1 \\circ S_k^1.  (6.5.4)\n\n为了避免将度量缩并与第\
  \ 5.4 节中定义的缩并混淆，我们指出后者有时被称为普通缩并。\n\n## 定理 6.5.1（度量缩并的标准正交基表达式）. 设 (V,\U0001D524\
  ) 是符号差为 (ε₁,…,ε_m) 的标量积空间，设 (e₁,…,e_m) 是 V 的标准正交基，并设 \U0001D49C 是 \U0001D4AF_s^0(V)\
  \ 中的张量。则：\n\n- (a) 对于整数 s ≥ 3 和 1 ≤ k < l ≤ s，\U0001D4AF_{s-2}^0(V) 中的张量 C_{kl}(\U0001D49C\
  ) 由下式给出\n\nC_{kl}(\U0001D49C)(v₁,…,v_{s-2}) = Σ_i ε_i \U0001D49C(v₁,…,v_{k-1},e_i,v_k,…,v_{l-2},e_i,v_{l-1},…,v_{s-2})\
  \  (6.5.5)\n\n对所有 V 中的向量 v₁,…,v_{s-2} 成立。\n\n- (b) 当 s = 2 时，实数 C₁₂(\U0001D49C)\
  \ 由下式给出：C₁₂(\U0001D49C) = Σ_i ε_i \U0001D49C(e_i,e_i)。\n\n证明. (a)：设 ℰ = (e₁,…,e_m)，\U0001D524\
  ℰ = [\U0001D524_{ij}]，并注意 \U0001D524^{ij} = \U0001D524_{ij} = ε_i δ_{ij}。由定理 6.3.5(a)\
  \ 和 (6.5.3) 可得，C_{kl}(\U0001D49C) 关于 ℋ 的分量为\n\nC_{kl}(\U0001D49C)_{j₁…j_{s-2}} =\
  \ Σ_{pq} \U0001D524^{pq} \U0001D49C_{j₁…j_{k-1}p j_k…j_{l-2}q j_{l-1}…j_{s-2}} =\
  \ Σ_p ε_p \U0001D49C_{j₁…j_{k-1}p j_k…j_{l-2}p j_{l-1}…j_{s-2}} = Σ_p ε_p \U0001D49C\
  (e_{j₁},…,e_{j_{k-1}},e_p,e_{j_k},…,e_{j_{l-2}},e_p,e_{j_{l-1}},…,e_{j_{s-2}})\n\
  \n任意向量 v₁,…,v_{s-2} ∈ V 时的结果由 \U0001D49C 和 C_{kl}(\U0001D49C) 的多重线性性得出。\n\n(b)：我们有\n\
  \nC₁₂(\U0001D49C) = C₁¹ ∘ S₁¹(\U0001D49C)    [(6.5.4)]\n= Σᵢ εᵢ⟨ℜ⁻¹ ∘ S₁¹(\U0001D49C\
  )(eᵢ), eᵢ⟩    [定理 6.1.1(b)]\n= Σᵢ εᵢ⟨eᵢ, \U0001D516⁻¹(\U0001D49C)(eᵢ)⟩    [定理 6.4.3(d)]\n\
  = Σᵢ εᵢ \U0001D516(\U0001D516⁻¹(\U0001D49C))(eᵢ, eᵢ)    [(6.4.5)]\n= Σᵢ εᵢ \U0001D49C\
  (eᵢ, eᵢ)。\n\n注意在 (6.5.5) 中，eᵢ 出现在第 k 个和第 l 个位置。\n\n我们在定理 5.4.1 中看到“缩并”与“迹”是相关的。下面是同一现象的又一体现。\n\
  \n## 定理 6.5.2. 设 (V, g) 是标量积空间，则\n\nC₁₂ = tr ∘ \U0001D516⁻¹，\n\n其中 tr 是迹，\U0001D516\
  \ 由 (6.4.5) 给出。\n\n证明. 我们有\n\nC₁₂ = C₁¹ ∘ S₁¹    [(6.5.4)]\n= (tr ∘ ℜ⁻¹) ∘ (ℜ ∘\
  \ \U0001D516⁻¹)    [定理 5.4.1，定理 6.4.3(d)]\n= tr ∘ \U0001D516⁻¹。\n\n## 6.6 (0, 4)-张量的对称性\n\
  \n设 V 是向量空间，设 \U0001D49C 是 \U0001D4AF₄^0(V) 中的张量。考虑 \U0001D49C 对所有 V 中的向量 v₁、v₂、v₃、v₄\
  \ 可能满足的以下对称性：\n\n- [S1] \U0001D49C(v₁, v₂, v₃, v₄) = −\U0001D49C(v₂, v₁, v₃, v₄)。\n\
  - [S2] \U0001D49C(v₁, v₂, v₃, v₄) = −\U0001D49C(v₁, v₂, v₄, v₃)。\n- [S3] \U0001D49C\
  (v₁, v₂, v₃, v₄) = \U0001D49C(v₃, v₄, v₁, v₂)。\n- [S4] \U0001D49C(v₁, v₂, v₃, v₄)\
  \ + \U0001D49C(v₂, v₃, v₁, v₄) + \U0001D49C(v₃, v₁, v₂, v₄) = 0。\n\n注意 [S4] 的左边是通过循环置换\
  \ v₁、v₂、v₃ 而保持 v₄ 不动得到的。由 [S1] 可得\n\n\U0001D49C(v₁, v₁, v₂, v₃) = 0，    (6.6.1)\n\
  \n由 [S2] 可得\n\n\U0001D49C(v₁, v₂, v₃, v₃) = 0    (6.6.2)\n\n对所有 V 中的向量 v₁、v₂、v₃\
  \ 成立。\n\n下面的结果表明，[S1]–[S4] 并非彼此独立。\n\n## 定理 6.6.1. 设 V 是向量空间，\U0001D49C 是 \U0001D4AF\
  ₄^0(V) 中的张量。如果 \U0001D49C 满足 [S1]、[S2] 和 [S4]，则它满足 [S3]。\n\n证明. 四次使用 [S4] 可得\n\n\
  ```\n\U0001D49C(v₃, v₁, v₄, v₂) + \U0001D49C(v₁, v₄, v₃, v₂) + \U0001D49C(v₄, v₃,\
  \ v₁, v₂) = 0\n\U0001D49C(v₁, v₄, v₂, v₃) + \U0001D49C(v₄, v₂, v₁, v₃) + \U0001D49C\
  (v₂, v₁, v₄, v₃) = 0\n\U0001D49C(v₄, v₂, v₃, v₁) + \U0001D49C(v₂, v₃, v₄, v₁) +\
  \ \U0001D49C(v₃, v₄, v₂, v₁) = 0\n\U0001D49C(v₂, v₃, v₁, v₄) + \U0001D49C(v₃, v₁,\
  \ v₂, v₄) + \U0001D49C(v₁, v₂, v₃, v₄) = 0.  (6.6.3)\n```\n\n将 [S1] 和 [S2] 应用到 (6.6.3)\
  \ 的第二列和第三列，得到\n\n```\n\U0001D49C(v₃, v₁, v₄, v₂) − \U0001D49C(v₁, v₄, v₂, v₃) −\
  \ \U0001D49C(v₃, v₄, v₁, v₂) = 0\n\U0001D49C(v₁, v₄, v₂, v₃) − \U0001D49C(v₄, v₂,\
  \ v₃, v₁) + \U0001D49C(v₁, v₂, v₃, v₄) = 0\n\U0001D49C(v₄, v₂, v₃, v₁) − \U0001D49C\
  (v₂, v₃, v₁, v₄) − \U0001D49C(v₃, v₄, v₁, v₂) = 0\n\U0001D49C(v₂, v₃, v₁, v₄) −\
  \ \U0001D49C(v₃, v₁, v₄, v₂) + \U0001D49C(v₁, v₂, v₃, v₄) = 0.  (6.6.4)\n```\n\n\
  将 (6.6.4) 两边相加得\n\n```\n2\U0001D49C(v₁, v₂, v₃, v₄) − 2\U0001D49C(v₃, v₄, v₁, v₂)\
  \ = 0，\n```\n\n由此即得结果。\n\n设 V 是向量空间，设 \U0001D4AE(V) 是 \U0001D4AF₄^0(V) 中满足 [S1]\
  \ 和 [S2] 的张量构成的集合。容易证明 \U0001D4AE(V) 是 \U0001D4AF₄^0(V) 的子空间。设 \U0001D49C 是 \U0001D4AF\
  ₄^0(V) 中的张量，考虑由下式定义的函数 \U0001D49C̅：\n\n```\n\U0001D49C̅(v₁, v₂) = \U0001D49C(v₁,\
  \ v₂, v₂, v₁)\n```\n\n对所有 V 中的向量 v₁、v₂ 成立。注意若 \U0001D49C ∈ \U0001D4AE(V)，则\n\n```\n\
  \U0001D49C̅(v₁, v₂) = \U0001D49C(v₁, v₂, v₂, v₁) = \U0001D49C(v₂, v₁, v₁, v₂) =\
  \ \U0001D49C̅(v₂, v₁)，\n```\n\n所以 \U0001D49C̅ 是对称的。\n\n## 定理 6.6.2. 设 V 是二维向量空间，\U0001D49C\
  \ 是 \U0001D4AE(V) 中的张量。则以下命题等价：\n\n- (a) \U0001D49C 是零张量。\n- (b) 对 V 的某个基 (h₁, h₂)，\U0001D49C\
  ̅(h₁, h₂) = 0。\n- (c) 对 V 的每一个基 (h₁, h₂)，\U0001D49C̅(h₁, h₂) = 0。\n\n证明. 设 ℋ = (h₁,\
  \ h₂) 是 V 的一个基。我们暂时不对 \U0001D49C 和 ℋ 做进一步假设。设 v₁、v₂、v₃、v₄ 是 V 中的向量，且\n\n```\n[v₁]ℋ\
  \ = [a¹; a²]    [v₂]ℋ = [b¹; b²]    [v₃]ℋ = [c¹; c²]    [v₄]ℋ = [d¹; d²].\n```\n\
  \n由 [S1] 和 (6.6.1) 可得\n\n\U0001D49C(v₁, v₂, v₃, v₄) = \U0001D49C(a¹h₁ + a²h₂, b¹h₁\

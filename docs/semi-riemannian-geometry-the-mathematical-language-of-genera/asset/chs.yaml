- "# 第 18 章\n\n# 带联络的光滑流形\n\n在第三部分的引言中，我们提出了在先前对曲线和曲面的研究基础上发展微分几何理论的任务，但不需要涉及环境空间。这项工作的隐含目标是尽可能恢复为曲线和曲面所呈现的结果。第\
  \ 14–17 章已经完成了这一议程的重要部分。然而，明显缺少的是关于“协变导数”和“度量”的讨论。本章通过在光滑流形的讨论中加入“联络”来弥补前一个缺失。\n\
  \n## 18.1 协变导数\n\n设 $M$ 是一个光滑流形。$M$ 上的一个**联络**是一个映射\n\n$$\\nabla : \\mathfrak{X}(M)\
  \ \\times \\mathfrak{X}(M) \\longrightarrow \\mathfrak{X}(M)$$\n\n+   使得对于 $\\mathfrak{X}(M)$\
  \ 中的所有向量场 $X,Y,Z$ 以及 $C^\\infty(M)$ 中的所有函数 $f$：\n+   \n+   [V1] $\\nabla(X+Y,Z)=\\\
  nabla(X,Z)+\\nabla(Y,Z)$.\n+   \n+   [V2] $\\nabla(fX,Y)=f\\nabla(X,Y)$.\n+   \n\
  +   [V3] $\\nabla(X,Y+Z)=\\nabla(X,Y)+\\nabla(X,Z)$.\n+   \n+   [V4] $\\nabla(X,fY)=X(f)Y+f\\\
  nabla(X,Y)$.\n\n我们将二元组 $(M,\\nabla)$ 称为一个**带联络的光滑流形**。一个给定的光滑流形可以有多个联络。因此，联络不是流形的基本组成部分，不像例如边界构成带边界光滑流形的一部分那样。\n\
  \n### 例 18.1.1。\n\n联络有两个明显的例子。设 U 是 ℝ^m 中的开集。将 U 视为光滑 m-流形，令\n\nD : \U0001D51B(U)\
  \ × \U0001D51B(U) ⟶ \U0001D51B(U)\n\n是由\n\nD(X, Y) = D_X(Y)\n\n对 \U0001D51B(U) 中的所有向量场\
  \ X, Y 定义的映射，其中 D_X 是关于 X 的欧几里得导数。由定理 10.3.1 可知，D 是 U 上的联络。\n\n类似地，设 (M, \U0001D524\
  ) 是 ℝ³ 中的正则曲面。根据例 14.1.5，M 是光滑 2-流形。令\n\n∇ : \U0001D51B(M) × \U0001D51B(M) ⟶ \U0001D51B\
  (M)\n\n是由\n\n∇(X, Y) = ∇_X(Y)\n\n对 \U0001D51B(M) 中的所有向量场 X, Y 定义的映射，其中 ∇_X 是关于 X\
  \ 的协变导数。我们从定理 12.4.1 得到 ∇ 是 M 上的联络。◇\n\n在前面的每个例子中，我们都从一个“导数”出发，并用它来定义联络。给定一个带联络的光滑流形，我们可以反过来进行这个过程。\n\
  \n设 (M, ∇) 是一个带联络的光滑流形，设 X 是 \U0001D51B(M) 中的一个向量场。我们定义映射\n\n∇_X : \U0001D51B(M)\
  \ ⟶ \U0001D51B(M)\n\n为\n\n∇_X(Y) = ∇(X, Y)\n\n对 \U0001D51B(M) 中的所有向量场 Y。从 [∇3] 和\
  \ [∇4] 可知 ∇_X 是 ℝ^m-线性的，并且从 [∇4] 可知\n\n∇_X(fY) = X(f)Y + f∇_X(Y)\n\n对所有 C^∞(M) 中的函数\
  \ f 和 \U0001D51B(M) 中的所有向量场 Y 成立。根据定理 16.2.7，存在一个唯一的张量导数\n\n∇_X : \U0001D4AF_s^r(M)\
  \ ⟶ \U0001D4AF_s^r(M)\n\n在 M 上，称为关于 X 的协变导数，其中 (∇_X)_s^r 已简写为 ∇_X。特别地，我们有\n\n∇_X(f)\
  \ = X(f) (18.1.1)\n\n对所有 C^∞(M) 中的函数 f 成立。\n\n### 定理 18.1.2（协变导数的向量场性质）。\n\n设 (M,\
  \ ∇) 是一个带联络的光滑流形，设 X, Y, Z 是 \U0001D51B(M) 中的向量场，设 f 是 C^∞(M) 中的函数。则：\n\n+   (a)\
  \ ∇_{X+Y}(Z) = ∇_X(Z) + ∇_Y(Z).\n+   (b) ∇_{fX}(Y) = f∇_X(Y).\n+   (c) ∇_X(Y + Z)\
  \ = ∇_X(Y) + ∇_X(Z).\n+   (d) ∇_X(fY) = X(f)Y + f∇_X(Y).\n\n证明。这直接从性质 [∇1]–[∇4]\
  \ 得出。\n\n### 定理 18.1.3（协变导数的张量场性质）。\n\n设 (M,∇) 是一个带联络的光滑流形，设 X 是 \U0001D51B(M) 中的一个向量场，设\
  \ \U0001D49C,ℬ 和 \U0001D49E 分别是 \U0001D4AF_s^r(M) 和 \U0001D4AF_{s'}^r'(M) 中的张量场。则：\n\
  \n+   (a) ∇_X(\U0001D49C + ℬ) = ∇_X(\U0001D49C) + ∇_X(ℬ).\n+   (b) ∇_X(\U0001D49C\
  \ ⊗ \U0001D49E) = ∇_X(\U0001D49C) ⊗ \U0001D49E + \U0001D49C ⊗ ∇_X(\U0001D49E).\n\
  \n证明。这由第 16.2 节给出的张量导数的定义性质得出。\n\n### 定理 18.1.4（协变导数的整体表达式）。\n\n设 (M,∇) 是一个带联络的光滑流形，设\
  \ \U0001D49C 是 \U0001D4AF_s^r(M) 中的一个张量场，设 X, Y₁,...,Y_s 是 \U0001D51B(M) 中的向量场，设\
  \ ω¹,...,ω^r 是 \U0001D51B*(M) 中的余向量场。则\n\n∇_X(\U0001D49C)(ω¹,...,ω^r, Y₁,...,Y_s)\n\
  = X(\U0001D49C(ω¹,...,ω^r, Y₁,...,Y_s))\n− ∑_{i=1}^r \U0001D49C(ω¹,...,ω^{i−1},\
  \ ∇_X(ω^i), ω^{i+1},...,ω^r, Y₁,...,Y_s)\n− ∑_{j=1}^s \U0001D49C(ω¹,...,ω^r, Y₁,...,Y_{j−1},\
  \ ∇_X(Y_j), Y_{j+1},...,Y_s).\n\n证明。这由定理 16.2.4 得出。\n\n### 例 18.1.5。\n\n设 (M,∇)\
  \ 是一个带联络的光滑流形，设 \U0001D49C 是 \U0001D4AF₂⁰(M) 中的一个张量场，设 X,Y,Z 是 \U0001D51B(M) 中的向量场，设\
  \ ω 是 \U0001D51B*(M)=\U0001D4AF₁⁰(M) 中的一个余向量场。我们从 (18.1.1) 和定理 18.1.4 得到\n\n∇_X(ω)(Y)\
  \ = X(ω(Y)) − ω(∇_X(Y)) = ∇_X(ω(Y)) − ω(∇_X(Y))    (18.1.2)\n\n以及\n\n∇_X(\U0001D49C\
  )(Y,Z) = X(\U0001D49C(Y,Z)) − \U0001D49C(∇_X(Y),Z) − \U0001D49C(Y,∇_X(Z))\n= ∇_X(\U0001D49C\
  (Y,Z)) − \U0001D49C(∇_X(Y),Z) − \U0001D49C(Y,∇_X(Z)).    (18.1.3)\n\n容易证明，如果 \U0001D49C\
  \ 在其两个参数上是对称的，那么 ∇_X(\U0001D49C) 也是对称的。\n\n设 $(M,\\nabla)$ 是一个带联络的光滑流形，设 $X$ 是 $\\\
  mathfrak{X}(M)$ 中的一个向量场。可以证明，$\\nabla_X$ 在以下意义上是逐点确定的：对于 $M$ 中的所有点 $p$ 和 $\\mathfrak{X}(M)$\
  \ 中的所有向量场 $Y$，\n\n$$\\nabla_X(Y)_p = \\nabla_{\\tilde{X}}(Y)_p$$\n\n对于 $\\mathfrak{X}(M)$\
  \ 中所有满足 $X_p = \\tilde{X}_p$ 的向量场 $X,\\tilde{X}$。对于 $M$ 中的每个点 $p$ 和 $T_p(M)$ 中的向量\
  \ $v$，我们通过\n\n$$\\nabla_v(Y) = \\nabla_X(Y)_p \\tag{18.1.4}$$\n\n定义 $T_p(M)$ 中的向量\
  \ $\\nabla_v(Y)$，其中 $X$ 是 $\\mathfrak{X}(M)$ 中满足 $X_p = v$ 的任意向量场。由定理 15.1.2，这样的\
  \ $X$ 总是存在。由于 $\\nabla_X$ 是逐点确定的，$\\nabla_v(Y)$ 与向量场的选择无关，因此是良定义的。由 (18.1.4) 可知，对于\
  \ $\\mathfrak{X}(M)$ 中的所有向量场 $X,Y$，\n\n$$\\nabla_{X_p}(Y) = \\nabla_X(Y)_p \\tag{18.1.5}$$\n\
  \n根据定义，$\\operatorname{Lin}(\\mathfrak{X}(M),\\mathfrak{X}(M))$ 是从向量空间 $\\mathfrak{X}(M)$\
  \ 到自身的所有 $\\mathbb{R}$-线性映射构成的向量空间。我们通过将乘法定义为映射的复合，使 $\\operatorname{Lin}(\\mathfrak{X}(M),\\\
  mathfrak{X}(M))$ 成为 $\\mathbb{R}$ 上的环。设 $\\Theta,\\Upsilon,\\Psi$ 是三个这样的映射，并定义 $\\\
  Theta$ 和 $\\Upsilon$ 的括号为\n\n$$[\\Theta,\\Upsilon] = \\Theta \\circ \\Upsilon -\
  \ \\Upsilon \\circ \\Theta.$$\n\n容易证明，在这个定义下，$\\operatorname{Lin}(\\mathfrak{X}(M),\\\
  mathfrak{X}(M))$ 是 $\\mathbb{R}$ 上的李代数。特别地，雅可比恒等式成立：\n\n$$[[\\Theta,\\Upsilon],\\\
  Psi] + [[\\Upsilon,\\Psi],\\Theta] + [[\\Psi,\\Theta],\\Upsilon] = 0.$$\n\n对于 $\\\
  mathfrak{X}(M)$ 中的向量场 $X,Y,Z$，从定理 18.1.2 的 (c) 和 (d) 部分可知，$\\nabla_X,\\nabla_Y,\\\
  nabla_Z$ 是 $\\operatorname{Lin}(\\mathfrak{X}(M),\\mathfrak{X}(M))$ 中的映射，因此\n\n\
  $$[[\\nabla_X,\\nabla_Y],\\nabla_Z] + [[\\nabla_Y,\\nabla_Z],\\nabla_X] + [[\\nabla_Z,\\\
  nabla_X],\\nabla_Y] = 0. \\tag{18.1.6}$$\n\n## 18.2 Christoffel 符号\n\n在我们对 $\\mathbb{R}_p^3$\
  \ 中正则曲面的研究中，我们定义了 Christoffel 符号，并用它们来构造协变导数，现在我们将其视为与联络等价（参见例 18.1.1）。我们对带联络的光滑流形的处理方法则是相反的：我们从一个联络开始，然后用它来定义\
  \ Christoffel 符号。\n\n设 $(M,\\nabla)$ 是一个带联络的光滑 $m$-流形，设 $X$ 是 $\\mathfrak{X}(M)$\
  \ 中的一个向量场，设 $(U,(x^i))$ 是 $M$ 上的一个坐标卡，设 $\\mathcal{X} = (\\partial/\\partial x^1,\\\
  dots,\\partial/\\partial x^m)$ 是对应的坐标标架。可以证明，$\\nabla$ 无歧义地限制到光滑 $m$-流形 $U$ 上。为简化记号，我们将限制\n\
  \n$$\\nabla|_U \\quad \\text{记为} \\quad \\nabla.$$\n\n\n\n\n\nhence\n\\[\n\\nabla_X(Y)\
  \ = \\sum_i \\alpha^i \\nabla_{\\partial/\\partial x^i}(Y) = \\sum_j \\left( \\\
  sum_i \\alpha^i \\beta^j_{;i} \\right) \\frac{\\partial}{\\partial x^j}.\n\\]\n\n\
  (b): The components of \\(\\nabla_{\\partial/\\partial x^i}(d(x^j))\\) are\n\n\\\
  [\n\\nabla_{\\partial/\\partial x^i}(d(x^j))\\left(\\frac{\\partial}{\\partial x^k}\\\
  right)\n= \\frac{\\partial}{\\partial x^i}\\left( d(x^j)\\left(\\frac{\\partial}{\\\
  partial x^k}\\right) \\right)\n- d(x^j)\\left( \\nabla_{\\partial/\\partial x^i}\\\
  left(\\frac{\\partial}{\\partial x^k}\\right) \\right)\n\\quad [(18.1.2)]\n\\]\n\
  \\[\n= - d(x^j)\\left( \\sum_l \\Gamma^l_{ik} \\frac{\\partial}{\\partial x^l} \\\
  right)\n\\quad [(18.2.1)]\n\\]\n\\[\n= - \\sum_l \\Gamma^l_{ik} d(x^j)\\left(\\\
  frac{\\partial}{\\partial x^l}\\right) = -\\Gamma^j_{ik},\n\\]\nhence\n\\[\n\\nabla_{\\\
  partial/\\partial x^i}(d(x^j)) = - \\sum_k \\Gamma^j_{ik} d(x^k). \\tag{18.2.4}\n\
  \\]\n\nThen\n\\[\n\\nabla_{\\partial/\\partial x^i}(\\omega)\n= \\nabla_{\\partial/\\\
  partial x^i}\\left( \\sum_j \\gamma_j d(x^j) \\right)\n= \\sum_j \\nabla_{\\partial/\\\
  partial x^i}(\\gamma_j d(x^j))\n\\]\n\\[\n= \\sum_j \\left( \\nabla_{\\partial/\\\
  partial x^i}(\\gamma_j) d(x^j) + \\gamma_j \\nabla_{\\partial/\\partial x^i}(d(x^j))\
  \ \\right)\n\\]\n\\[\n= \\sum_j \\left( \\frac{\\partial \\gamma_j}{\\partial x^i}\
  \ d(x^j) - \\gamma_j \\sum_k \\Gamma^j_{ik} d(x^k) \\right)\n\\quad [(18.2.4)]\n\
  \\]\n\\[\n= \\sum_j \\frac{\\partial \\gamma_j}{\\partial x^i} d(x^j) - \\sum_{j,k}\
  \ \\gamma_j \\Gamma^j_{ik} d(x^k)\n\\]\n\\[\n= \\sum_j \\frac{\\partial \\gamma_j}{\\\
  partial x^i} d(x^j) - \\sum_{j,k} \\gamma_k \\Gamma^k_{ij} d(x^j)\n\\]\n\\[\n= \\\
  sum_j \\left( \\frac{\\partial \\gamma_j}{\\partial x^i} - \\sum_k \\gamma_k \\\
  Gamma^k_{ij} \\right) d(x^j)\n= \\sum_j \\gamma_{j;i} d(x^j),\n\\]\nso\n\\[\n\\\
  nabla_X(\\omega)\n= \\sum_i \\alpha^i \\nabla_{\\partial/\\partial x^i}(\\omega)\n\
  = \\sum_i \\alpha^i \\left( \\sum_j \\gamma_{j;i} d(x^j) \\right)\n= \\sum_j \\\
  left( \\sum_i \\alpha^i \\gamma_{j;i} \\right) d(x^j). \\quad \\square\n\\]\n\n\
  We observe that the expressions for \\(\\nabla_X(Y)\\) and \\(\\nabla_X(\\omega)\\\
  ) in parts (a) and (b) of Theorem 18.2.1 involve the \\(\\alpha^i\\) but not their\
  \ partial derivatives. In order to compute \\(\\nabla_X(Y)\\) and \\(\\nabla_X(\\\
  omega)\\) at a given point, all we need to know about \\(X\\) is its value at that\
  \ point. This is consistent with \\(\\nabla_X\\) being determined pointwise, as\
  \ was remarked in conjunction with (18.1.4).\n\nIn the notation of Theorem 18.2.1,\
  \ we have as special cases\n\n\\[\n\\nabla_{\\partial/\\partial x^i}(Y) = \\sum_j\
  \ \\beta^j_{;i} \\frac{\\partial}{\\partial x^j}\n\\quad\\text{and}\\quad\n\\nabla_{\\\
  partial/\\partial x^i}(\\omega) = \\sum_j \\gamma_{j;i} d(x^j).\n\\]\n\nThese formulas\
  \ tell us that to take the covariant derivatives of \\(Y\\) and \\(\\omega\\) with\
  \ respect to \\(\\partial/\\partial x^i\\), we simply add a subscript “;i” to each\
  \ of the components in the local coordinate expressions.\n\n### Theorem 18.2.2 (Local\
  \ Coordinate Expression for Covariant Derivative).\n\nLet \\((M,\\nabla)\\) be a\
  \ smooth \\(m\\)-manifold with a connection, let \\(\\mathcal{A}\\) be a tensor\
  \ field in \\(T^r_s(M)\\), and, in local coordinates, let \\(\\mathcal{A}^{i_1\\\
  cdots i_r}_{j_1\\cdots j_s}\\) be the components of \\(\\mathcal{A}\\). Then the\
  \ components of \\(\\nabla_{\\partial/\\partial x^k}(\\mathcal{A})\\) are\n\n\\\
  [\n\\nabla_{\\partial/\\partial x^k}(\\mathcal{A})^{i_1\\cdots i_r}_{j_1\\cdots\
  \ j_s}\n= \\frac{\\partial \\mathcal{A}^{i_1\\cdots i_r}_{j_1\\cdots j_s}}{\\partial\
  \ x^k}\n+ \\sum_{l=1}^{r} \\left( \\sum_{p=1}^{m} \\Gamma^{i_l}_{kp} \\mathcal{A}^{i_1\\\
  cdots i_{l-1} p i_{l+1}\\cdots i_r}_{j_1\\cdots j_s} \\right)\n- \\sum_{l=1}^{s}\
  \ \\left( \\sum_{p=1}^{m} \\Gamma^p_{k j_l} \\mathcal{A}^{i_1\\cdots i_r}_{j_1\\\
  cdots j_{l-1} p j_{l+1}\\cdots j_s} \\right).\n\\]\n\n**Proof.** By Theorem 18.1.4,\n\
  \n\\[\n\\begin{aligned}\n\\nabla_{\\partial/\\partial x^k}(\\mathcal{A})^{i_1\\\
  cdots i_r}_{j_1\\cdots j_s}\n&= \\nabla_{\\partial/\\partial x^k}(\\mathcal{A})\\\
  left(d(x^{i_1}),\\ldots,d(x^{i_r}),\\frac{\\partial}{\\partial x^{j_1}},\\ldots,\\\
  frac{\\partial}{\\partial x^{j_s}}\\right) \\\\\n&= \\frac{\\partial}{\\partial\
  \ x^k}\\left( \\mathcal{A}\\left(d(x^{i_1}),\\ldots,d(x^{i_r}),\\frac{\\partial}{\\\
  partial x^{j_1}},\\ldots,\\frac{\\partial}{\\partial x^{j_s}}\\right) \\right) \\\
  \\\n&\\quad - \\sum_{l=1}^{r} \\mathcal{A}\\left(d(x^{i_1}),\\ldots,\\nabla_{\\\
  partial/\\partial x^k}(d(x^{i_l})),\\ldots,d(x^{i_r}),\\frac{\\partial}{\\partial\
  \ x^{j_1}},\\ldots,\\frac{\\partial}{\\partial x^{j_s}}\\right) \\\\\n&\\quad -\
  \ \\sum_{l=1}^{s} \\mathcal{A}\\left(d(x^{i_1}),\\ldots,d(x^{i_r}),\\frac{\\partial}{\\\
  partial x^{j_1}},\\ldots,\\nabla_{\\partial/\\partial x^k}\\left(\\frac{\\partial}{\\\
  partial x^{j_l}}\\right),\\ldots,\\frac{\\partial}{\\partial x^{j_s}}\\right).\n\
  \\end{aligned}\n\\]\n\nWe have\n\n\\[\n\\frac{\\partial}{\\partial x^k}\\left( \\\
  mathcal{A}\\left(d(x^{i_1}),\\ldots,d(x^{i_r}),\\frac{\\partial}{\\partial x^{j_1}},\\\
  ldots,\\frac{\\partial}{\\partial x^{j_s}}\\right) \\right)\n= \\frac{\\partial\
  \ \\mathcal{A}^{i_1\\cdots i_r}_{j_1\\cdots j_s}}{\\partial x^k}.\n\\]\n\n## 18.2\
  \ Christoffel Symbols\n\n**Proof.** We have\n\n\\[\n\\nabla_{\\partial/\\partial\
  \ \\tilde{x}^p}\\left(\\frac{\\partial}{\\partial \\tilde{x}^q}\\right)\n= \\sum_l\
  \ \\tilde{\\Gamma}^{l}_{pq}\\frac{\\partial}{\\partial \\tilde{x}^l}\n\\tag{18.2.1}\n\
  \\]\n\\[\n= \\sum_l \\tilde{\\Gamma}^{l}_{pq}\\left(\\sum_k \\frac{\\partial x^k}{\\\
  partial \\tilde{x}^l}\\frac{\\partial}{\\partial x^k}\\right)\n\\quad \\text{(Theorem\
  \ 15.1.8)}\n\\]\n\\[\n= \\sum_k\\left(\\sum_l \\tilde{\\Gamma}^{l}_{pq}\\frac{\\\
  partial x^k}{\\partial \\tilde{x}^l}\\right)\\frac{\\partial}{\\partial x^k}.\n\\\
  tag{18.2.5}\n\\]\n\nOn the other hand,\n\n\\[\n\\nabla_{\\partial/\\partial \\tilde{x}^p}\\\
  left(\\frac{\\partial}{\\partial \\tilde{x}^q}\\right)\n= \\nabla_{\\sum_i \\frac{\\\
  partial x^i}{\\partial \\tilde{x}^p}\\frac{\\partial}{\\partial x^i}}\n\\left(\\\
  sum_j \\frac{\\partial x^j}{\\partial \\tilde{x}^q}\\frac{\\partial}{\\partial x^j}\\\
  right)\n\\]\n\\[\n= \\sum_{ij}\\frac{\\partial x^i}{\\partial \\tilde{x}^p}\n\\\
  nabla_{\\partial/\\partial x^i}\n\\left(\\frac{\\partial x^j}{\\partial \\tilde{x}^q}\\\
  frac{\\partial}{\\partial x^j}\\right)\n\\]\n\\[\n= \\sum_{ij}\\frac{\\partial x^i}{\\\
  partial \\tilde{x}^p}\n\\left[\n\\nabla_{\\partial/\\partial x^i}\n\\left(\\frac{\\\
  partial x^j}{\\partial \\tilde{x}^q}\\right)\\frac{\\partial}{\\partial x^j}\n+\
  \ \\frac{\\partial x^j}{\\partial \\tilde{x}^q}\n\\nabla_{\\partial/\\partial x^i}\n\
  \\left(\\frac{\\partial}{\\partial x^j}\\right)\n\\right]\n\\]\n\\[\n= \\sum_{ij}\\\
  frac{\\partial x^i}{\\partial \\tilde{x}^p}\n\\left[\n\\nabla_{\\partial/\\partial\
  \ x^i}\n\\left(\\frac{\\partial x^j}{\\partial \\tilde{x}^q}\\right)\\frac{\\partial}{\\\
  partial x^j}\n+ \\frac{\\partial x^j}{\\partial \\tilde{x}^q}\n\\sum_k \\Gamma^k_{ij}\\\
  frac{\\partial}{\\partial x^k}\n\\right].\n\\tag{18.2.6}\n\\]\n\nwhere the first\
  \ equality follows from Theorem 15.1.8, and the last equality from (18.2.1). We\
  \ also have\n\n\\[\n\\nabla_{\\partial/\\partial x^i}\\left(\\frac{\\partial x^j}{\\\
  partial \\tilde{x}^q}\\right)\n= \\sum_k \\frac{\\partial \\tilde{x}^k}{\\partial\
  \ x^i}\n\\nabla_{\\partial/\\partial \\tilde{x}^k}\n\\left(\\frac{\\partial x^j}{\\\
  partial \\tilde{x}^q}\\right)\n= \\sum_k \\frac{\\partial \\tilde{x}^k}{\\partial\
  \ x^i}\n\\frac{\\partial^2 x^j}{\\partial \\tilde{x}^k\\partial \\tilde{x}^q},\n\
  \\tag{18.2.7}\n\\]\n\nwhere the first equality follows from Theorem 15.1.8. Combining\
  \ (18.2.6) and (18.2.7) yields\n\n\\[\n\\nabla_{\\partial/\\partial \\tilde{x}^p}\\\
  left(\\frac{\\partial}{\\partial \\tilde{x}^q}\\right)\n= \\sum_{ij}\\frac{\\partial\
  \ x^i}{\\partial \\tilde{x}^p}\n\\left[\n\\left(\\sum_k\\frac{\\partial \\tilde{x}^k}{\\\
  partial x^i}\n\\frac{\\partial^2 x^j}{\\partial \\tilde{x}^k\\partial \\tilde{x}^q}\\\
  right)\\frac{\\partial}{\\partial x^j}\n+ \\frac{\\partial x^j}{\\partial \\tilde{x}^q}\n\
  \\sum_k \\Gamma^k_{ij}\\frac{\\partial}{\\partial x^k}\n\\right]\n\\tag{18.2.8}\n\
  \\]\n\\[\n= \\sum_{ijk}\\frac{\\partial x^i}{\\partial \\tilde{x}^p}\n\\frac{\\\
  partial x^j}{\\partial \\tilde{x}^q}\n\\Gamma^k_{ij}\\frac{\\partial}{\\partial\
  \ x^k}\n+ \\sum_{ijk}\\frac{\\partial x^i}{\\partial \\tilde{x}^p}\n\\frac{\\partial\
  \ \\tilde{x}^k}{\\partial x^i}\n\\frac{\\partial^2 x^j}{\\partial \\tilde{x}^k\\\
  partial \\tilde{x}^q}\n\\frac{\\partial}{\\partial x^j}.\n\\]\n\nThe second term\
  \ in the last line of (18.2.8) can be expressed as\n\n\\[\n\\begin{aligned}\n\\\
  sum_{ijk}\\frac{\\partial x^i}{\\partial \\tilde{x}^p}\n\\frac{\\partial \\tilde{x}^k}{\\\
  partial x^i}\n\\frac{\\partial^2 x^j}{\\partial \\tilde{x}^k\\partial \\tilde{x}^q}\n\
  \\frac{\\partial}{\\partial x^j}\n&= \\sum_{jk}\\left[\n\\left(\\sum_i \\frac{\\\
  partial \\tilde{x}^k}{\\partial x^i}\n\\frac{\\partial x^i}{\\partial \\tilde{x}^p}\\\
  right)\n\\frac{\\partial^2 x^j}{\\partial \\tilde{x}^k\\partial \\tilde{x}^q}\n\\\
  frac{\\partial}{\\partial x^j}\n\\right] \\\\\n&= \\sum_{jk}\\frac{\\partial \\\
  tilde{x}^k}{\\partial \\tilde{x}^p}\n\\frac{\\partial^2 x^j}{\\partial \\tilde{x}^k\\\
  partial \\tilde{x}^q}\n\\frac{\\partial}{\\partial x^j} \\\\\n&= \\sum_j \\frac{\\\
  partial^2 x^j}{\\partial \\tilde{x}^p\\partial \\tilde{x}^q}\n\\frac{\\partial}{\\\
  partial x^j} \\\\\n&= \\sum_k \\frac{\\partial^2 x^k}{\\partial \\tilde{x}^p\\partial\
  \ \\tilde{x}^q}\n\\frac{\\partial}{\\partial x^k},\n\\end{aligned}\n\\]\n\nso (18.2.8)\
  \ becomes\n\n\\[\n\\nabla_{\\partial/\\partial \\tilde{x}^p}\\left(\\frac{\\partial}{\\\
  partial \\tilde{x}^q}\\right)\n= \\sum_k \\left(\n\\sum_{ij}\\frac{\\partial x^i}{\\\
  partial \\tilde{x}^p}\n\\frac{\\partial x^j}{\\partial \\tilde{x}^q}\n\\Gamma^k_{ij}\n\
  + \\frac{\\partial^2 x^k}{\\partial \\tilde{x}^p\\partial \\tilde{x}^q}\n\\right)\\\
  frac{\\partial}{\\partial x^k}.\n\\tag{18.2.9}\n\\]\n\nComparing (18.2.5) and (18.2.9)\
  \ shows that\n\n\\[\n\\sum_{ij}\\frac{\\partial x^i}{\\partial \\tilde{x}^p}\n\\\
  frac{\\partial x^j}{\\partial \\tilde{x}^q}\n\\Gamma^k_{ij}\n+ \\frac{\\partial^2\
  \ x^k}{\\partial \\tilde{x}^p\\partial \\tilde{x}^q}\n= \\sum_l \\tilde{\\Gamma}^l_{pq}\\\
  frac{\\partial x^k}{\\partial \\tilde{x}^l}.\n\\]\n\nMultiplying both sides of the\
  \ preceding identity by \\(\\partial \\tilde{x}^r/\\partial x^k\\) and summing over\
  \ \\(k\\) yields\n\n\\[\n\\begin{aligned}\n\\sum_{ijk}\\frac{\\partial x^i}{\\partial\
  \ \\tilde{x}^p}\n\\frac{\\partial x^j}{\\partial \\tilde{x}^q}\n\\frac{\\partial\
  \ \\tilde{x}^r}{\\partial x^k}\n\\Gamma^k_{ij}\n+ \\sum_k \\frac{\\partial^2 x^k}{\\\
  partial \\tilde{x}^p\\partial \\tilde{x}^q}\n\\frac{\\partial \\tilde{x}^r}{\\partial\
  \ x^k}\n&= \\sum_{kl}\\tilde{\\Gamma}^l_{pq}\n\\frac{\\partial \\tilde{x}^r}{\\\
  partial x^k}\n\\frac{\\partial x^k}{\\partial \\tilde{x}^l} \\\\\n&= \\sum_l \\\
  tilde{\\Gamma}^l_{pq}\n\\left(\\sum_k \\frac{\\partial \\tilde{x}^r}{\\partial x^k}\n\
  \\frac{\\partial x^k}{\\partial \\tilde{x}^l}\\right) \\\\\n&= \\sum_l \\tilde{\\\
  Gamma}^l_{pq}\n\\frac{\\partial \\tilde{x}^r}{\\partial \\tilde{x}^l} \\\\\n&= \\\
  tilde{\\Gamma}^r_{pq}.\n\\end{aligned}\n\\]\n\nWe see from Theorem 15.6.3 and Theorem\
  \ 18.2.3 that, despite appearances, the Christoffel symbols are not the components\
  \ of a tensor. In classical terminology it is said that the Christoffel symbols\
  \ “do not transform” like the components of a tensor.\n\n## 18.3 Covariant Derivative\
  \ on Curves\n\nThe definition of covariant derivative given in Section 18.1 refers\
  \ to an entire smooth manifold. We now discuss a version of covariant derivative\
  \ that applies only to smooth curves on a smooth manifold.\n\n### Theorem 18.3.1\
  \ (Existence of Covariant Derivative on a Curve).\n\nIf \\((M,\\nabla)\\) is a smooth\
  \ manifold with a connection and \\(\\lambda(t):(a,b)\\longrightarrow M\\) is a\
  \ smooth curve, then there is a unique linear map\n\n\\[\n\\frac{\\nabla}{dt}: \\\
  mathfrak{X}_M(\\lambda)\\longrightarrow \\mathfrak{X}_M(\\lambda),\n\\]\n\ncalled\
  \ the covariant derivative on \\(\\lambda\\), such that for all vector fields \\\
  (J,K\\) in \\(\\mathfrak{X}_M(\\lambda)\\), all functions \\(f\\) in \\(C^\\infty(M)\\\
  ), all vector fields \\(X\\) in \\(\\mathfrak{X}(M)\\), and all points \\(t\\) in\
  \ \\((a,b)\\):\n\n- (a) \\(\\displaystyle \\frac{\\nabla(J+K)}{dt}(t)=\\frac{\\\
  nabla J}{dt}(t)+\\frac{\\nabla K}{dt}(t)\\).\n- (b) \\(\\displaystyle \\frac{\\\
  nabla(fJ)}{dt}(t)=\\frac{df}{dt}(t)J(t)+f(t)\\frac{\\nabla J}{dt}(t)\\).\n- (c)\
  \ \\(\\displaystyle \\frac{\\nabla(X\\circ\\lambda)}{dt}(t)=\\nabla_{(d\\lambda/dt)(t)}(X)\\\
  ).\n\n**Remark.** The notation \\(\\nabla_{(d\\lambda/dt)(t)}(X)\\) in part (c)\
  \ is justified by the discussion surrounding (18.1.4).\n\n### Theorem 18.3.2 (Local\
  \ Coordinate Expression for Covariant Derivative on a Curve).\n\nLet \\((M,\\nabla)\\\
  ) be a smooth manifold with a connection, let \\(\\lambda(t):(a,b)\\longrightarrow\
  \ M\\) be a smooth curve, and let \\(J\\) be a vector field in \\(\\mathfrak{X}_M(\\\
  lambda)\\). Let \\((U,(x^i))\\) be a chart on \\(M\\) such that \\(\\lambda((a,b))\\\
  subset U\\), and, in local coordinates, let\n\n\\[\nJ(t)=\\sum_i \\alpha^i(t)\\\
  left.\\frac{\\partial}{\\partial x^i}\\right|_{\\lambda(t)}.\n\\]\n\nThen\n\n\\\
  [\n\\frac{\\nabla J}{dt}(t)\n= \\sum_k \\left(\n\\frac{d\\alpha^k}{dt}(t)\n+ \\\
  sum_{ij}\\frac{d(x^i\\circ\\lambda)}{dt}(t)\\alpha^j(t)\\Gamma^k_{ij}(\\lambda(t))\n\
  \\right)\n\\left.\\frac{\\partial}{\\partial x^k}\\right|_{\\lambda(t)}\n\\]\n\n\
  for all \\(t\\) in \\((a,b)\\).\n\n**Proof.** Theorem 18.3.1 is used repeatedly\
  \ in what follows. We have\n\n\\[\n\\frac{\\nabla}{dt}\\left(\\left.\\frac{\\partial}{\\\
  partial x^j}\\right|_{\\lambda(t)}\\right)\n= \\nabla_{(d\\lambda/dt)(t)}\\left(\\\
  frac{\\partial}{\\partial x^j}\\right),\n\\]\n\nso\n\n\\[\n\\begin{aligned}\n\\\
  frac{\\nabla J}{dt}(t)\n&= \\sum_j \\frac{\\nabla}{dt}\\left(\\alpha^j(t)\\left.\\\
  frac{\\partial}{\\partial x^j}\\right|_{\\lambda(t)}\\right) \\\\\n&= \\sum_j \\\
  frac{d\\alpha^j}{dt}(t)\\left.\\frac{\\partial}{\\partial x^j}\\right|_{\\lambda(t)}\n\
  + \\sum_j \\alpha^j(t)\\nabla_{(d\\lambda/dt)(t)}\\left(\\frac{\\partial}{\\partial\
  \ x^j}\\right).\n\\tag{18.3.1}\n\\end{aligned}\n\\]\n\nBy Theorem 14.7.1(b),\n\n\
  \\[\n\\frac{d\\lambda}{dt}(t)\n= \\sum_i \\frac{d(x^i\\circ\\lambda)}{dt}(t)\\left.\\\
  frac{\\partial}{\\partial x^i}\\right|_{\\lambda(t)},\n\\]\n\n\n\nhence\n\n$$\\\
  nabla_{(d\\lambda/dt)(t)}\\left(\\frac{\\partial}{\\partial x^j}\\right) = \\sum_i\
  \ \\frac{d(x^i\\circ\\lambda)}{dt}(t)\\nabla_{(\\partial/\\partial x^i)(\\lambda(t))}\\\
  left(\\frac{\\partial}{\\partial x^j}\\right)$$\n$$= \\sum_i \\frac{d(x^i\\circ\\\
  lambda)}{dt}(t)\\left(\\sum_k \\Gamma^k_{ij}(\\lambda(t))\\frac{\\partial}{\\partial\
  \ x^k}\\bigg|_{\\lambda(t)}\\right)$$\n$$= \\sum_{ik}\\frac{d(x^i\\circ\\lambda)}{dt}(t)\\\
  Gamma^k_{ij}(\\lambda(t))\\frac{\\partial}{\\partial x^k}\\bigg|_{\\lambda(t)}.$$\n\
  \nThe second term in the last line of (18.3.1) can therefore be expressed as\n\n\
  $$\\sum_j \\alpha^j(t)\\nabla_{(d\\lambda/dt)(t)}\\left(\\frac{\\partial}{\\partial\
  \ x^j}\\right)\n= \\sum_j\\alpha^j(t)\\left(\\sum_{ik}\\frac{d(x^i\\circ\\lambda)}{dt}(t)\\\
  Gamma^k_{ij}(\\lambda(t))\\frac{\\partial}{\\partial x^k}\\bigg|_{\\lambda(t)}\\\
  right)$$\n$$= \\sum_k\\left(\\sum_{ij}\\frac{d(x^i\\circ\\lambda)}{dt}(t)\\alpha^j(t)\\\
  Gamma^k_{ij}(\\lambda(t))\\right)\\frac{\\partial}{\\partial x^k}\\bigg|_{\\lambda(t)}.$$\n\
  \nThen (18.3.1) becomes\n\n$$\\frac{\\nabla J}{dt}(t)\n= \\sum_k\\frac{d\\alpha^k}{dt}(t)\\\
  frac{\\partial}{\\partial x^k}\\bigg|_{\\lambda(t)}\n+ \\sum_k\\left(\\sum_{ij}\\\
  frac{d(x^i\\circ\\lambda)}{dt}(t)\\alpha^j(t)\\Gamma^k_{ij}(\\lambda(t))\\right)\\\
  frac{\\partial}{\\partial x^k}\\bigg|_{\\lambda(t)}$$\n$$= \\sum_k\\left(\\frac{d\\\
  alpha^k}{dt}(t)+\\sum_{ij}\\frac{d(x^i\\circ\\lambda)}{dt}(t)\\alpha^j(t)\\Gamma^k_{ij}(\\\
  lambda(t))\\right)\\frac{\\partial}{\\partial x^k}\\bigg|_{\\lambda(t)}.$$\n\n##\
  \ Theorem 18.3.3.\n\nLet $(M,\\nabla)$ be a smooth manifold with a connection, let\
  \ $\\lambda(t):(a,b)\\longrightarrow M$ be a smooth curve, let $J$ be a vector field\
  \ in $\\mathfrak X_M(\\lambda)$, and let $g(u):(c,d)\\longrightarrow(a,b)$ be a\
  \ diffeomorphism. Then, for all $u$ in $(c,d)$:\n\n- (a)\n  \n  $$\\frac{\\nabla(J\\\
  circ g)}{du}(u)=\\frac{dg}{du}(u)\\frac{\\nabla J}{dt}(g(u)).$$\n  \n- (b)\n  \n\
  \  $$\\frac{\\nabla}{du}\\left(\\frac{d(\\lambda\\circ g)}{du}\\right)(u)=\\frac{d^2g}{du^2}(u)\\\
  frac{d\\lambda}{dt}(g(u))+\\left(\\frac{dg}{du}(u)\\right)^2\\frac{\\nabla}{dt}\\\
  left(\\frac{d\\lambda}{dt}\\right)(g(u)).$$\n\n> *Remark.* $\\nabla/dt$ and $\\\
  nabla/du$ denote covariant differentiation on $\\lambda$ and $\\lambda\\circ g$,\
  \ respectively.\n\n*Proof.* We consider only the case where $(U,(x^i))$ is a chart\
  \ on $M$ such that $\\lambda(a,b)\\subset U$.\n\n(b): The components of $\\nabla(X)$\
  \ are\n\n$$\n\\begin{aligned}\n\\nabla(X)\\left(d(x^i),\\frac{\\partial}{\\partial\
  \ x^j}\\right)\n&=d(x^i)\\left(\\nabla_{\\partial/\\partial x^j}(X)\\right)\\\\\n\
  &=d(x^i)\\left(\\sum_k\\alpha^k_{;j}\\frac{\\partial}{\\partial x^k}\\right)\\\\\
  \n&=\\sum_k\\alpha^k_{;j}d(x^i)\\left(\\frac{\\partial}{\\partial x^k}\\right)=\\\
  alpha^i_{;j},\n\\end{aligned}\n$$\n\nfrom which the result follows.\n\n## Theorem\
  \ 18.4.5.\n\nLet $(M,\\nabla)$ be a smooth manifold with a connection, let $X,Y$\
  \ be vector fields in $\\mathfrak{X}(M)$, and let $\\omega$ be a covector field\
  \ in $\\mathfrak{X}^*(M)$. Then:\n\n- (a) $$\\nabla(\\omega)(X,Y)=X(\\omega(Y))-\\\
  omega(\\nabla_X(Y)).$$\n- (b) If $\\omega=\\sum_k\\gamma_kd(x^k)$ in local coordinates,\
  \ then\n  \n  $$\\nabla(\\omega)=\\sum_{ij}\\gamma_{j;i}\\,d(x^i)\\otimes d(x^j).$$\n\
  \n*Proof.* (a): We have\n\n$$\n\\begin{aligned}\n\\nabla(\\omega)(X,Y)&=\\nabla_X(\\\
  omega)(Y)\\\\\n&=X(\\omega(Y))-\\omega(\\nabla_X(Y)).\n\\end{aligned}\n$$\n\n(b):\
  \ The components of $\\nabla(\\omega)$ are\n\n$$\n\\begin{aligned}\n\\nabla(\\omega)\\\
  left(\\frac{\\partial}{\\partial x^i},\\frac{\\partial}{\\partial x^j}\\right)\n\
  &=\\nabla_{\\partial/\\partial x^i}(\\omega)\\left(\\frac{\\partial}{\\partial x^j}\\\
  right)\\\\\n&=\\left(\\sum_k\\gamma_kd(x^k)\\right)\\left(\\frac{\\partial}{\\partial\
  \ x^j}\\right)\\\\\n&=\\sum_k\\gamma_{k;i}d(x^k)\\left(\\frac{\\partial}{\\partial\
  \ x^j}\\right)=\\gamma_{j;i},\n\\end{aligned}\n$$\n\nfrom which the result follows.\n\
  \n## Theorem 18.4.6.\n\nLet $(M,\\nabla)$ be a smooth manifold with a connection,\
  \ let $\\mathcal{A}$ be a tensor field in $\\mathcal{T}^0_2(M)$, and let $X,Y,Z$\
  \ be vector fields in $\\mathfrak{X}(M)$. Then\n\n$$\\nabla(\\mathcal{A})(X,Y,Z)=X(\\\
  mathcal{A}(Y,Z))-\\mathcal{A}(\\nabla_X(Y),Z)-\\mathcal{A}(Y,\\nabla_X(Z)).$$\n\n\
  *Proof.* We have\n\n$$\n\\begin{aligned}\n\\nabla(\\mathcal{A})(X,Y,Z)\n&=\\nabla_X(\\\
  mathcal{A})(Y,Z)\\\\\n&=X(\\mathcal{A}(Y,Z))-\\mathcal{A}(\\nabla_X(Y),Z)-\\mathcal{A}(Y,\\\
  nabla_X(Z)).\n\\end{aligned}\n$$\n\n## 18.5 Parallel Translation\n\n## Theorem 18.4.7\n\
  \nLet $(M,\\nabla)$ be a smooth manifold with a connection, let $f$ be a function\
  \ in $C^\\infty(M)$, and let $X,Y$ be vector fields in $\\mathfrak{X}(M)$. Then\n\
  \n$$\\nabla^2(f)(X,Y)=X(Y(f))-\\nabla_X(Y)(f).$$\n\n*Proof.* We have\n\n$$\\begin{aligned}\n\
  \\nabla^2(f)(X,Y)&=\\nabla(\\nabla(f))(X,Y)\\\\\n&=\\nabla(df)(X,Y) && [\\mathrm{Th\\\
  \ 18.4.3}]\\\\\n&=X(df(Y))-df(\\nabla_X(Y)) && [\\mathrm{Th\\ 18.4.5(a)}]\\\\\n\
  &=X(Y(f))-\\nabla_X(Y)(f). && [\\mathrm{Th\\ 15.4.5(b)}]\n\\end{aligned}$$\n\nAdopting\
  \ the notation of Theorem 18.4.7 and using (18.1.1) three times, we obtain\n\n$$\\\
  begin{aligned}\n\\nabla^2(f)(X,Y)&=X(Y(f))-\\nabla_X(Y)(f)\\\\\n&=\\nabla_X(\\nabla_Y(f))-\\\
  nabla_{\\nabla_X(Y)}(f).\n\\end{aligned}\\tag{18.4.3}$$\n\nThis shows that in the\
  \ context of regular surfaces in $\\mathbb{R}^3$, $\\nabla^2(f)(X,Y)$ is precisely\
  \ $\\nabla^2_{X,Y}(f)$, the second order covariant derivative of $f$ with respect\
  \ to $X$ and $Y$, as given by (12.4.3).\n\n## 18.5 Parallel Translation\n\nLet $(M,\\\
  nabla)$ be a smooth manifold with a connection, and let $\\lambda:(a,b)\\longrightarrow\
  \ M$ be a smooth curve. We say that a vector field $J$ in $\\mathfrak{X}_M(\\lambda)$\
  \ is **parallel** (with respect to $\\nabla$) if\n\n$$\\frac{\\nabla J}{dt}(t)=0$$\n\
  \nfor all $t$ in $(a,b)$.\n\n## Theorem 18.5.1 (Existence of Parallel Vector Field\
  \ on a Curve).\n\nLet $(M,\\nabla)$ be a smooth $m$-manifold with a connection,\
  \ let $\\lambda(t):(a,b)\\longrightarrow M$ be a smooth curve, let $t_0$ be a point\
  \ in $(a,b)$, and let $v$ be a vector in $T_{\\lambda(t_0)}(M)$. Then:\n\n- (a)\
  \ There is a unique parallel vector field $J$ in $\\mathfrak{X}_M(\\lambda)$ such\
  \ that $J(t_0)=v$.\n- (b) Let $(U,(x^i))$ be a chart on $M$ such that $\\lambda((a,b))\\\
  subset U$, and, in local coordinates, let\n\n$$J(t)=\\sum_i\\alpha^i(t)\\left.\\\
  frac{\\partial}{\\partial x^i}\\right|_{\\lambda(t)}.\\tag{18.5.1}$$\n\nThen the\
  \ $\\alpha^i$ satisfy the following system of differential equations, with initial\
  \ condition $J(t_0)=v$:\n\n$$\\frac{d\\alpha^k}{dt}(t)+\\sum_{i,j}\\frac{d(x^i\\\
  circ\\lambda)}{dt}(t)\\,\\alpha^j(t)\\,\\Gamma^k_{ij}(\\lambda(t))=0$$\n\nfor all\
  \ $t$ in $(a,b)$ for $k=1,\\ldots,m$.\n\nProof. By Theorem 18.3.2, the identity\
  \ $(\\nabla J/dt)(t)=0$ for all $t$ in $(a,b)$ is equivalent to the above system\
  \ of ordinary differential equations. The result now follows from the theory of\
  \ differential equations.\n\nContinuing with the notation of Theorem 18.5.1, let\
  \ us denote\n\nJ(t) by $\\Pi_{\\lambda(t_0)}^{\\lambda(t)}(v)$.\n\nThen (18.5.1)\
  \ becomes\n\n$\\Pi_{\\lambda(t_0)}^{\\lambda(t)}(v) = \\sum_i \\alpha^i(t) \\partial/\\\
  partial x^i |_{\\lambda(t)}$.\n\nFixing $t_0$ and $t$ in $(a,b)$ and allowing $v$\
  \ to vary, the assignment\n\n$v \\longmapsto \\Pi_{\\lambda(t_0)}^{\\lambda(t)}(v)$\n\
  \nfor all vectors $v$ in $T_{\\lambda(t_0)}(M)$ defines a map\n\n$\\Pi_{\\lambda(t_0)}^{\\\
  lambda(t)} : T_{\\lambda(t_0)}(M) \\longrightarrow T_{\\lambda(t)}(M)$\n\ncalled\
  \ parallel translation on $\\lambda$ from $\\lambda(t_0)$ to $\\lambda(t)$. We say\
  \ that $\\Pi_{\\lambda(t_0)}^{\\lambda(t)}(v)$ is the parallel translate of $v$.\
  \ Let us observe that the initial condition of Theorem 18.5.1 can now be expressed\
  \ as $\\Pi_{\\lambda(t_0)}^{\\lambda(t_0)}(v)=v$.\n\n## Example 18.5.2 (Smooth 2-Manifolds).\n\
  \nFor smooth 2-manifolds with a connection, the differential equations in Theorem\
  \ 18.5.1 are simply\n\n$d\\alpha^1/dt (t) + d(x^1\\circ\\lambda)/dt (t)[\\alpha^1(t)\\\
  Gamma^1_{11}(\\lambda(t)) + \\alpha^2(t)\\Gamma^1_{12}(\\lambda(t))] + d(x^2\\circ\\\
  lambda)/dt (t)[\\alpha^1(t)\\Gamma^1_{21}(\\lambda(t)) + \\alpha^2(t)\\Gamma^1_{22}(\\\
  lambda(t))] = 0$\n\nand\n\n$d\\alpha^2/dt (t) + d(x^1\\circ\\lambda)/dt (t)[\\alpha^1(t)\\\
  Gamma^2_{11}(\\lambda(t)) + \\alpha^2(t)\\Gamma^2_{12}(\\lambda(t))] + d(x^2\\circ\\\
  lambda)/dt (t)[\\alpha^1(t)\\Gamma^2_{21}(\\lambda(t)) + \\alpha^2(t)\\Gamma^2_{22}(\\\
  lambda(t))] = 0$.\n\nIn particular, these equations apply to regular surfaces with\
  \ the connection defined in Example 18.1.1.\n\n## Example 18.5.3 (Pln).\n\nLet us\
  \ view the regular surface Pln, discussed in Section 13.1, as a smooth 2-manifold\
  \ with the connection defined in Example 18.1.1. Let $\\lambda(t) : (a,b) \\longrightarrow\
  \ Pln$ be a smooth curve, let $t_0$ be a point in $(a,b)$, and let $v$ be a vector\
  \ in Pln. The Christoffel symbols have constant value 0, so $\\Pi_{\\lambda(t_0)}^{\\\
  lambda(t)}(v) = (\\alpha^1(t),\\alpha^2(t))$. From Example 18.5.2, the differential\
  \ equations are $(d\\alpha^k/dt)(t)=0$ for $k=1,2$, with the initial condition $\\\
  Pi_{\\lambda(t_0)}^{\\lambda(t_0)}(v)=v$. It\n\n\n\n\n\n# 18.5 平行移动\n\n可知 $\\alpha^k$\
  \ 与 $t$ 无关，所以对所有 $t$ 在 $(a,b)$ 中有 $\\Pi^{\\lambda(t)}_{\\lambda(t_0)}(v)=v$。这表明在\
  \ $\\mathrm{PIn}$ 中将一个向量从一个点平行移动到另一个点，与连接这两个点的光滑曲线的选择无关。特别地，沿着 $\\mathrm{PIn}$ 中闭合光滑曲线（如圆）的整个轨迹对向量进行平行移动，会使向量回到自身。\n\
  \n**例 18.5.4 ($S^2$)。** 设我们将正则曲面 $S^2$，在第 13.4 节中讨论过，视为一个光滑 2-流形，其联络由例 18.1.1 定义。设\n\
  \n$\\theta(t):(a,b)\\longrightarrow(0,\\pi)\\qquad\\text{and}\\qquad\\phi(t):(a,b)\\\
  longrightarrow(-\\pi,\\pi)$\n\n为微分同胚，并考虑光滑曲线 $\\lambda(t):(a,b)\\longrightarrow\
  \ S^2$ 由\n\n$$\\lambda(t)=\\varphi(\\theta(t),\\phi(t))=\\bigl(\\sin(\\theta(t))\\\
  cos(\\phi(t)),\\sin(\\theta(t))\\sin(\\phi(t)),\\cos(\\theta(t))\\bigr).$$\n\n在\
  \ $\\lambda(t)$ 处的坐标基为 $(H_1|_{(\\theta(t),\\phi(t))},H_2|_{(\\theta(t),\\phi(t))})$，其中\n\
  \n$$H_1|_{(\\theta(t),\\phi(t))}=\\bigl(\\cos(\\theta(t))\\cos(\\phi(t)),\\cos(\\\
  theta(t))\\sin(\\phi(t)),-\\sin(\\theta(t))\\bigr)$$\n\n$$H_2|_{(\\theta(t),\\phi(t))}=\\\
  bigl(-\\sin(\\theta(t))\\sin(\\phi(t)),\\sin(\\theta(t))\\cos(\\phi(t)),0\\bigr).$$\n\
  \n设\n\n$$v=\\frac{d\\lambda}{dt}(t_0) \\tag{18.5.2}$$\n\n在定理 18.5.1 中并回顾第 13.4 节中关于\
  \ Christoffel 符号的结果，例 18.5.2 中的微分方程变为\n\n$$\\frac{d\\alpha^1}{dt}(t)-\\cos(\\theta(t))\\\
  sin(\\theta(t))\\frac{d\\phi}{dt}(t)\\alpha^2(t)=0$$\n\n$$\\frac{d\\alpha^2}{dt}(t)+\\\
  cot(\\theta(t))\\left(\\frac{d\\phi}{dt}(t)\\alpha^1(t)+\\frac{d\\theta}{dt}(t)\\\
  alpha^2(t)\\right)=0, \\tag{18.5.3}$$\n\n其中我们使用了\n\n$(x\\circ\\lambda(t),x^2\\circ\\\
  lambda(t))=(x^1,x^2)\\circ\\lambda(t)=\\varphi^{-1}\\circ\\lambda(t)=(\\theta(t),\\\
  phi(t)).$\n\n对于 $(0,\\pi)$ 中的给定点 $\\theta_0$，设 $\\theta$ 为常值为 $\\theta_0$ 的函数，并设\
  \ $\\phi$ 为恒等函数。此外，设我们用 $\\phi$ 表示 $t$，使得 $\\phi_0=t_0$ 且 $\\phi$ 在 $(-\\pi,\\pi)$\
  \ 中。设 $c_0=\\cos(\\theta_0)$ 且 $s_0=\\sin(\\theta_0)$，我们有\n\n$$\\lambda(\\phi)=(s_0\\\
  cos(\\phi),s_0\\sin(\\phi),c_0) \\tag{18.5.4}$$\n\n$$\\frac{d\\lambda}{d\\phi}(\\\
  phi)=(-s_0\\sin(\\phi),s_0\\cos(\\phi),0) \\tag{18.5.5}$$\n\n$$H_1|_{(\\theta_0,\\\
  phi)}=(c_0\\cos(\\phi),c_0\\sin(\\phi),-s_0) \\tag{18.5.6}$$\n\n$$H_2|_{(\\theta_0,\\\
  phi)}=(-s_0\\sin(\\phi),s_0\\cos(\\phi),0).$$\n\ndα¹/dφ (φ) − c₀ s₀ α²(φ) = 0\n\n\
  dα²/dφ (φ) + c₀/s₀ α¹(φ) = 0,  (18.5.7)\n\n其中我们假设 s₀ ≠ 0，或等价地，θ₀ ≠ π/2。注意 λ 的像落在\
  \ $S^2$ 对应于 θ₀ 的纬度曲线上。见图 13.4.1。\n\n现在设 φ₀ = 0。则由 (18.5.2) 和 (18.5.5) 得 v = (0,\
  \ s₀, 0)。我们寻求显式表达式\n\nΠ_{λ(0)}^{λ(φ)} ((0, s₀, 0)) = α¹(φ) H₁|_{(θ₀,φ)} + α²(φ)\
  \ H₂|_{(θ₀,φ)},  (18.5.8)\n\n满足初始条件\n\n(0, s₀, 0) = Π_{λ(0)}^{λ(0)} ((0, s₀, 0))\
  \ = α¹(0) H₁|_{(θ₀,0)} + α²(0) H₂|_{(θ₀,0)}.  (18.5.9)\n\n(18.5.7) 的解为\n\nα¹(φ)\
  \ = A cos(c₀ φ) − B sin(c₀ φ)\nα²(φ) = −1/s₀ [A sin(c₀ φ) + B cos(c₀ φ)]  (18.5.10)\n\
  \n对于某些实数 A, B。令 φ = 0 代入 (18.5.6) 和 (18.5.10) 得\n\nH₁|_{(θ₀,0)} = (c₀, 0, −s₀) \
  \     H₂|_{(θ₀,0)} = (0, s₀, 0)  (18.5.11)\n\n且\n\nα¹(0) = A      α²(0) = −B/s₀.\
  \  (18.5.12)\n\n由 (18.5.9)、(18.5.11) 和 (18.5.12) 可得\n\n(0, s₀, 0) = A(c₀, 0, −s₀)\
  \ − B/s₀ (0, s₀, 0) = (A c₀, −B, −A s₀),\n\n故 A = 0 且 B = −s₀。于是由 (18.5.10) 得\n\n\
  α¹(φ) = s₀ sin(c₀ φ)      α²(φ) = cos(c₀ φ).  (18.5.13)\n\n最后，将 (18.5.6) 和 (18.5.13)\
  \ 代入 (18.5.8) 得\n\nΠ_{λ(0)}^{λ(φ)} ((0, s₀, 0)) = s₀ sin(c₀ φ)(c₀ cos(φ), c₀ sin(φ),\
  \ −s₀) + cos(c₀ φ)(−s₀ sin(φ), s₀ cos(φ), 0).\n\n为研究 v = (0, s₀, 0) 的平行移动性质，将 φ\
  \ 的定义域延拓到整个 ℝ 并无害。特别地，我们有 φ = 2π 时\n\nΠ_{λ(0)}^{λ(2π)} ((0, s₀, 0)) = s₀ sin(2π\
  \ c₀)(c₀, 0, −s₀) + cos(2π c₀)(0, s₀, 0).\n\n易证 Π_{λ(0)}^{λ(2π)}((0, s₀, 0)) = (0,\
  \ s₀, 0) 当且仅当 θ₀ = π/2；即当且仅当 λ 的像位于“赤道”上。因此我们得到惊人的发现：沿着除赤道外的其他纬度曲线的整个轨迹对 v 进行平行移动，并不会使\
  \ v 回到自身。这是球面“曲率”的体现。\n\n$S^2$ 与通过原点的平面的交集称为 $S^2$ 的大圆，赤道就是明显的例子。我们起初选择的参数化包含了赤道，但这只是出于方便。由于\
  \ $S^2$ 的对称性，任何大圆都适用。\n\n# 定理 18.5.5（曲线的平行性的微分同胚不变性）。\n\n设 $(M, \\nabla)$ 为带联络的光滑流形，设\
  \ $\\lambda(t) : (a, b) ⟶ M$ 为光滑曲线，且 $g(u) : (c, d) ⟶ (a, b)$ 为微分同胚。则向量场 $J$ 在 $\\\
  mathfrak{X}_M(\\lambda)$ 中平行当且仅当向量场 $J \\circ g$ 在 $\\mathfrak{X}_M(\\lambda \\\
  circ g)$ 中平行。\n\n证明。由定理 10.2.4(a) 和定理 18.3.3(a) 可得。\n\n# 定理 18.5.6。\n\n设 $(M, \\\
  nabla)$ 为带联络的光滑流形，设 $\\lambda : (a, b) ⟶ M$ 为光滑曲线，且 $t_0$ 和 $t$ 为 $(a, b)$ 中的点。则\
  \ $\\Pi_{λ(t₀)}^{λ(t)} : T_{λ(t₀)}(M) ⟶ T_{λ(t)}(M)$ 为线性同构，且其逆\n\n(Π_{λ(t₀)}^{λ(t)})⁻¹\
  \ : T_{λ(t)}(M) ⟶ T_{λ(t₀)}(M)\n\n由\n\n(Π_{λ(t₀)}^{λ(t)})⁻¹(v) = Π_{λ(t)}^{λ(t₀)}(v)\n\
  \n对所有 $T_{λ(t)}(M)$ 中的向量 $v$ 给出。\n\n证明。设 $v, w$ 为 $T_{λ(t₀)}(M)$ 中的向量。由定理 18.5.1，存在\
  \ $\\mathfrak{X}_M(λ)$ 中的平行向量场 $J, K$ 使得 $J(t₀) = v$ 且 $K(t₀) = w$。对于实数 $c$，我们有\n\
  \n∇(cJ + K)/dt (t) = c ∇J/dt (t) + ∇K/dt (t) = 0\n\n对所有 $t$ 在 $(a, b)$ 中成立。因此，$cJ\
  \ + K$ 是 $\\mathfrak{X}_M(λ)$ 中的平行向量场，使得 $(cJ + K)(t₀) = cJ(t₀) + K(t₀) = cv + w$。\n\
  \n由定理 18.5.1 中的唯一性性质可得 Π_{λ(t₀)}^{λ(t)}(cv + w) = (cJ + K)(t) = cJ(t) + K(t) = c\
  \ Π_{λ(t₀)}^{λ(t)}(v) + Π_{λ(t₀)}^{λ(t)}(w)。\n\n因此，Π_{λ(t₀)}^{λ(t)} 是线性的。\n\n设 $v$\
  \ 和 $w$ 分别为 $T_{λ(t₀)}(M)$ 和 $T_{λ(t)}(M)$ 中的向量。由常微分方程的性质可知，$w$ 是 $v$ 的平行平移当且仅当\
  \ $v$ 是 $w$ 的平行平移。因此，Π_{λ(t₀)}^{λ(t)} 是双射映射，因而是线性同构，其逆为 $(Π_{λ(t₀)}^{λ(t)})⁻¹ =\
  \ Π_{λ(t)}^{λ(t₀)}$。\n\n# 定理 18.5.7（曲线上的平行标架存在性）。设 $(M, \\nabla)$ 为带联络的光滑 $m$-流形，设\
  \ $\\lambda(t): (a,b) \\longrightarrow M$ 为光滑曲线，设 $t_0$ 为 $(a,b)$ 中的点，且 $(v_1,\\\
  dots,v_m)$ 为 $T_{\\lambda(t_0)}(M)$ 的基。则存在 $\\lambda$ 上的唯一标架 $\\mathcal{J}$ 由 $\\\
  mathfrak{X}_M(\\lambda)$ 中的平行向量场组成，使得 $\\mathcal{J}(t_0) = (v_1,\\dots,v_m)$ 且 $\\\
  mathcal{J}(t)$ 对所有 $t$ 在 $(a,b)$ 中为 $T_{\\lambda(t)}(M)$ 的基。\n\n证明。根据定理 18.5.1，存在\
  \ $\\mathfrak{X}_M(\\lambda)$ 中的唯一平行向量场 $J_i$ 使得 $J_i(t_0)=v_i$，$i=1,\\dots,m$。根据定义，$J_i(t)=\\\
  Pi_{\\lambda(t_0)}^{\\lambda(t)}(v_i)$ 对所有 $t$ 在 $(a,b)$ 中成立。假设存在 $(a,b)$ 中的点 $t$\
  \ 使得 $\\sum_i a^i J_i(t)=0$ 对某些实数 $a^1,\\dots,a^m$ 成立。利用定理 18.5.6 将 $(\\Pi_{\\lambda(t_0)}^{\\\
  lambda(t)})^{-1}$ 应用于上述恒等式的两边得到 $\\sum_i a^i v_i=0$，故 $a^i=0$，$i=1,\\dots,m$。因此，$J_1(t),\\\
  dots,J_m(t)$ 是 $T_{\\lambda(t)}(M)$ 中的线性无关向量。由定理 14.3.4(c)，$T_{\\lambda(t)}(M)$\
  \ 的维数为 $m$，所以 $\\mathcal{J}(t)$ 对所有 $t$ 在 $(a,b)$ 中为 $T_{\\lambda(t)}(M)$ 的基。\n\n\
  在本节开头，沿曲线协变微分被用来定义平行移动。下一个结果表明平行移动可用来定义沿曲线的协变微分。在此意义上，协变微分和平行移动是等价的概念。\n\n# 定理 18.5.8。设\
  \ $(M,\\nabla)$ 为带联络的光滑流形，设 $\\lambda(t): (a,b) \\longrightarrow M$ 为光滑曲线，设 $t_0$\
  \ 为 $(a,b)$ 中的点，且 $K$ 为 $\\mathfrak{X}_M(\\lambda)$ 中的向量场。则\n\n$$\\frac{\\nabla\
  \ K}{dt}(t_0)=\\lim_{t\\to t_0}\\frac{\\Pi_{\\lambda(t)}^{\\lambda(t_0)}(K(t))-K(t_0)}{t}$$\n\
  \n证明。设 $\\mathcal{J}=(J_1,\\dots,J_m)$ 为定理 18.5.7 给出的标架。则 $K(t)$ 可表示为\n\n$$K(t)=\\\
  sum_i \\alpha^i(t)J_i(t),\\qquad(18.5.14)$$\n\n其中 $\\alpha^i$ 为 $C^\\infty((a,b))$\
  \ 中唯一确定的函数。特别地\n\n$$K(t_0)=\\sum_i \\alpha^i(t_0)v_i.$$\n\n由于每个 $J_i$ 都是 $\\mathfrak{X}_M(\\\
  lambda)$ 中的平行向量场，我们有 $(\\nabla J_i/dt)(t)=0$，故\n\n$$\\frac{\\nabla K}{dt}(t)=\\\
  sum_i\\left(\\frac{d\\alpha^i}{dt}(t)J_i(t)+\\alpha^i(t)\\frac{\\nabla J_i}{dt}(t)\\\
  right)=\\sum_i\\frac{d\\alpha^i}{dt}(t)J_i(t),$$\n\n所以\n\n$$\\frac{\\nabla K}{dt}(t_0)=\\\
  sum_i\\frac{d\\alpha^i}{dt}(t_0)J_i(t_0)=\\sum_i\\frac{d\\alpha^i}{dt}(t_0)v_i.\\\
  qquad(18.5.15)$$\n\n\n\n\n\n根据定义，$J_i(t) = \\Pi_{\\lambda(t_0)}^{\\lambda(t)}(v_i)$\
  \ 对所有 $t$ 在 $(a,b)$ 中成立。利用定理 18.5.6 对等式 (18.5.14) 两边同时应用 $(\\Pi_{\\lambda(t_0)}^{\\\
  lambda(t)})^{-1}$ 得到\n\n$$\\Pi_{\\lambda(t)}^{\\lambda(t_0)}(K(t)) = \\sum_i \\\
  alpha^i(t) v_i.$$\n\n于是，\n\n$$\\lim_{t\\to t_0}\\frac{\\Pi_{\\lambda(t)}^{\\lambda(t_0)}(K(t))-K(t_0)}{t}=\\\
  sum_i\\left(\\lim_{t\\to t_0}\\frac{\\alpha^i(t)-\\alpha^i(t_0)}{t}\\right)v_i\\\
  tag{18.5.16}$$\n\n$$=\\sum_i \\frac{d\\alpha^i}{dt}(t_0)v_i.$$\n\n结果现在由 (18.5.15)\
  \ 和 (18.5.16) 得出。\n\n## 18.6 挠率张量\n\n设 $(M,\\nabla)$ 为带联络的光滑流形。对应于 $\\nabla$ 的挠率张量（场）是映射\n\
  \n$$T : \\mathfrak{X}(M) \\times \\mathfrak{X}(M) \\longrightarrow \\mathfrak{X}(M)$$\n\
  \n定义为\n\n$$T(X,Y)=\\nabla_X(Y)-\\nabla_Y(X)-[X,Y]\\tag{18.6.1}$$\n\n对所有向量场 $X,Y$\
  \ 在 $\\mathfrak{X}(M)$ 中。我们称 $\\nabla$ 为对称的（或无挠的）如果 $T=0$；即\n\n$$\\nabla_X(Y)-\\\
  nabla_Y(X)=[X,Y]$$\n\n对所有向量场 $X,Y$ 在 $\\mathfrak{X}(M)$ 中。\n\n由于 $T$ 的取值在 $\\mathfrak{X}(M)$\
  \ 中，将 $T$ 称为“张量场”，尽管在文献中很常见，但与定理 15.7.2 不一致。我们将在第 19.5 节讨论此问题。\n\n### 例 18.6.1（$\\\
  mathbb{R}^3_\\nu$ 中的正则曲面）。\n\n将正则曲面视为带由例 18.1.1 定义的联络的光滑 2-流形，由 (12.6.1) 可知该联络是对称的。\n\
  \n## 定理 18.6.2. 若 $(M,\\nabla)$ 为带联络的光滑流形且 $X,Y$ 为 $\\mathfrak{X}(M)$ 中的向量场，则：\n\
  \n- (a) $T(Y,X) = -T(X,Y)$\n- (b) $T$ 是 $C^\\infty(M)$-双线性的。\n\n证明. (a)：这由定理 15.3.2(a)\
  \ 得出。\n\n(b)：利用定理 15.3.2 和定理 18.1.2，可容易证明 $T$ 在两个变元中都可加。对 $C^\\infty(M)$ 中的函数 $f,g$，由同一两个定理可得\n\
  \n$$\\begin{aligned}\nT(fX,gY)&=\\nabla_{fX}(gY)-\\nabla_{gY}(fX)-[fX,gY]\\\\\n\
  &=(fX(g)Y+fg\\,\\nabla_X(Y))-(gY(f)X+fg\\,\\nabla_Y(X))\\\\\n&\\quad -(fg[X,Y]+fX(g)Y-gY(f)X)\\\
  \\\n&=fg(\\nabla_X(Y)-\\nabla_Y(X)-[X,Y])\\\\\n&=fgT(X,Y),\n\\end{aligned}$$\n\n\
  故 $T$ 是 $C^\\infty(M)$-双线性的。\n\n设 $(M,\\nabla)$ 为带联络的光滑 $m$-流形，且 $(U,(x^i))$ 为 $M$\
  \ 上的一个坐标图。在局部坐标下，$T(\\partial/\\partial x^i,\\partial/\\partial x^j)$ 可表示为\n\n$$T\\\
  left(\\frac{\\partial}{\\partial x^i},\\frac{\\partial}{\\partial x^j}\\right)=\\\
  sum_k T^k_{ij}\\frac{\\partial}{\\partial x^k}.$$\n\n其中 $T^k_{ij}$ 是 $C^\\infty(U)$\
  \ 中唯一确定的函数。\n\n## 定理 18.6.3. 在上述设定下：\n\n- (a) $T^k_{ij}=\\Gamma^k_{ij}-\\Gamma^k_{ji}$\
  \ 对 $i,j,k=1,\\ldots,m$。\n- (b) $\\nabla$ 对称当且仅当对所有此类局部坐标表达式，$\\Gamma^k_{ij}=\\\
  Gamma^k_{ji}$ 对 $i,j,k=1,\\ldots,m$。\n\n*证明.* (a)：由定理 15.3.3(b) 和 (18.2.1) 可得\n\n\
  $$\\begin{aligned}\nT\\left(\\frac{\\partial}{\\partial x^i},\\frac{\\partial}{\\\
  partial x^j}\\right)\n&=\\nabla_{\\partial/\\partial x^i}\\left(\\frac{\\partial}{\\\
  partial x^j}\\right)-\\nabla_{\\partial/\\partial x^j}\\left(\\frac{\\partial}{\\\
  partial x^i}\\right)-\\left[\\frac{\\partial}{\\partial x^i},\\frac{\\partial}{\\\
  partial x^j}\\right]\\\\\n&=\\sum_k(\\Gamma^k_{ij}-\\Gamma^k_{ji})\\frac{\\partial}{\\\
  partial x^k}.\n\\end{aligned}$$\n\n(b)：由定理 18.6.2(b)，$T$ 是 R-双线性的，故对称性由 $T$ 在坐标标架上的行为决定。由\
  \ (a) 部分，$T^k_{ij}=0$ 当且仅当 $\\Gamma^k_{ij}=\\Gamma^k_{ji}$。结果得证。\n\n## 定理 18.6.4.\
  \ 若 $(M,\\nabla)$ 为带对称联络的光滑流形且 $\\sigma(r,s):(a,b)\\times(-\\epsilon,\\epsilon)\\\
  longrightarrow M$ 为一个参数化曲面，则\n\n$$\\frac{\\nabla}{\\partial r}\\left(\\frac{\\partial\\\
  sigma}{\\partial s}\\right)=\\frac{\\nabla}{\\partial s}\\left(\\frac{\\partial\\\
  sigma}{\\partial r}\\right).$$\n\n其中 $\\partial\\sigma/\\partial r$ 和 $\\partial\\\
  sigma/\\partial s$ 由 (14.9.1) 和定理 15.1.5 给出，且 $\\nabla/\\partial r$ 和 $\\nabla/\\\
  partial s$ 由 (18.3.3) 给出。\n\n## 18.6 挠率张量\n\n**证明.** 设 $(U,(x^i))$ 为 $M$ 上的一个坐标图，它与\
  \ $\\sigma((a,b)\\times(-\\epsilon,\\epsilon))$ 相交。由定理 14.9.2，\n\n\\[\n\\frac{\\\
  partial\\sigma}{\\partial r}=\\sum_i\\frac{\\partial(x^i\\circ\\sigma)}{\\partial\
  \ r}\\left(\\frac{\\partial}{\\partial x^i}\\circ\\sigma\\right).\n\\tag{18.6.2}\n\
  \\]\n\n且\n\n\\[\n\\frac{\\partial\\sigma}{\\partial s}=\\sum_i\\frac{\\partial(x^i\\\
  circ\\sigma)}{\\partial s}\\left(\\frac{\\partial}{\\partial x^i}\\circ\\sigma\\\
  right).\n\\tag{18.6.3}\n\\]\n\n由定理 18.3.1(c) 和 (18.6.3) 可得\n\n\\[\n\\nabla_{\\partial\
  \ r}\\left(\\frac{\\partial\\sigma}{\\partial s}\\right)\n=\\sum_i\\nabla_{\\partial\
  \ r}\\left(\\frac{\\partial(x^i\\circ\\sigma)}{\\partial s}\\left(\\frac{\\partial}{\\\
  partial x^i}\\circ\\sigma\\right)\\right)\n\\]\n\n\\[\n=\\sum_i\\frac{\\nabla}{\\\
  partial r}\\left(\\frac{\\partial(x^i\\circ\\sigma)}{\\partial s}\\right)\\left(\\\
  frac{\\partial}{\\partial x^i}\\circ\\sigma\\right)+\\sum_i\\frac{\\partial(x^i\\\
  circ\\sigma)}{\\partial s}\\frac{\\nabla}{\\partial r}\\left(\\frac{\\partial}{\\\
  partial x^i}\\right)\n\\]\n\n\\[\n=\\sum_k\\frac{\\partial^2(x^k\\circ\\sigma)}{\\\
  partial r\\partial s}\\left(\\frac{\\partial}{\\partial x^k}\\circ\\sigma\\right)+\\\
  sum_i\\frac{\\partial(x^i\\circ\\sigma)}{\\partial s}\\nabla_{\\partial\\sigma/\\\
  partial r}\\left(\\frac{\\partial}{\\partial x^i}\\right).\n\\]\n\n且由 (18.2.1) 和\
  \ (18.6.2) 可得\n\n\\[\n\\sum_i\\frac{\\partial(x^i\\circ\\sigma)}{\\partial s}\\\
  nabla_{\\partial\\sigma/\\partial r}\\left(\\frac{\\partial}{\\partial x^i}\\right)\n\
  \\]\n\n\\[\n=\\sum_i\\frac{\\partial(x^i\\circ\\sigma)}{\\partial s}\\left[\\sum_j\\\
  frac{\\partial(x^j\\circ\\sigma)}{\\partial r}\\nabla_{(\\partial/\\partial x^j)\\\
  circ\\sigma}\\left(\\frac{\\partial}{\\partial x^i}\\right)\\right]\n\\]\n\n\\[\n\
  =\\sum_{ij}\\left[\\frac{\\partial(x^j\\circ\\sigma)}{\\partial r}\\frac{\\partial(x^i\\\
  circ\\sigma)}{\\partial s}\\nabla_{(\\partial/\\partial x^j)\\circ\\sigma}\\left(\\\
  frac{\\partial}{\\partial x^i}\\right)\\right]\n\\]\n\n\\[\n=\\sum_{ij}\\left\\\
  {\\frac{\\partial(x^j\\circ\\sigma)}{\\partial r}\\frac{\\partial(x^i\\circ\\sigma)}{\\\
  partial s}\\left[\\sum_k(\\Gamma^k_{ji}\\circ\\sigma)\\left(\\frac{\\partial}{\\\
  partial x^k}\\circ\\sigma\\right)\\right]\\right\\}\n\\]\n\n\\[\n=\\sum_k\\left[\\\
  sum_{ij}\\frac{\\partial(x^j\\circ\\sigma)}{\\partial r}\\frac{\\partial(x^i\\circ\\\
  sigma)}{\\partial s}(\\Gamma^k_{ji}\\circ\\sigma)\\right]\\left(\\frac{\\partial}{\\\
  partial x^k}\\circ\\sigma\\right),\n\\]\n\n故\n\n\\[\n\\nabla_{\\partial r}\\left(\\\
  frac{\\partial\\sigma}{\\partial s}\\right)\n=\\sum_k\\left[\\frac{\\partial^2(x^k\\\
  circ\\sigma)}{\\partial r\\partial s}\n+\\sum_{ij}\\left(\\frac{\\partial(x^j\\\
  circ\\sigma)}{\\partial r}\\frac{\\partial(x^i\\circ\\sigma)}{\\partial s}(\\Gamma^k_{ji}\\\
  circ\\sigma)\\right)\\right]\\left(\\frac{\\partial}{\\partial x^k}\\circ\\sigma\\\
  right).\n\\]\n\n在上述恒等式中交换 $r$ 与 $s$ 的角色并利用定理 10.1.6 得\n\n$$\\frac{\\nabla}{\\partial\
  \ s}\\left(\\frac{\\partial\\sigma}{\\partial r}\\right)=\\sum_k\\left[\\frac{\\\
  partial^2(x^k\\circ\\sigma)}{\\partial s\\partial r}\\right]+\\sum_{ij}\\left[\\\
  frac{\\partial(x^j\\circ\\sigma)}{\\partial s}\\frac{\\partial(x^i\\circ\\sigma)}{\\\
  partial r}(\\Gamma^k_{ji}\\circ\\sigma)\\right]\\left(\\frac{\\partial}{\\partial\
  \ x^k}\\circ\\sigma\\right)$$\n\n$$=\\sum_k\\left[\\frac{\\partial^2(x^k\\circ\\\
  sigma)}{\\partial r\\partial s}\\right]+\\sum_{ij}\\left[\\frac{\\partial(x^j\\\
  circ\\sigma)}{\\partial r}\\frac{\\partial(x^i\\circ\\sigma)}{\\partial s}(\\Gamma^k_{ij}\\\
  circ\\sigma)\\right]\\left(\\frac{\\partial}{\\partial x^k}\\circ\\sigma\\right).$$\n\
  \n比较最后两个恒等式并引用定理 18.6.3(b) 即得结果。\n\n## 18.7 曲率张量\n\n在本节中，我们将黎曼曲率张量推广到带联络的光滑流形，该张量原本定义在\
  \ $\\mathbb{R}^3$ 中的正则曲面上。\n\n设 $(M,\\nabla)$ 为带联络的光滑流形。**曲率张量（场）** 是映射\n\n$$R:\\\
  mathfrak{X}(M)^3\\longrightarrow\\mathfrak{X}(M)$$\n\n定义为\n\n$$R(X,Y)Z=\\nabla_X(\\\
  nabla_Y(Z))-\\nabla_Y(\\nabla_X(Z))-\\nabla_{[X,Y]}(Z) \\tag{18.7.1}$$\n\n对所有向量场\
  \ $X,Y,Z$ 在 $\\mathfrak{X}(M)$ 中。由于 $R$ 的取值在 $\\mathfrak{X}(M)$ 中，将 $R$ 称为“张量场”，尽管在文献中普遍使用，但与第\
  \ 18.6 节中挠率张量所遇到的术语问题相同。此问题将在第 19.5 节中解决。\n\n## 定理 18.7.1. 若 $(M,\\nabla)$ 为带联络的光滑流形且\
  \ $X,Y,Z$ 为 $\\mathfrak{X}(M)$ 中的向量场，则：\n\n(a) $R(Y,X)Z=-R(X,Y)Z$。\n\n(b) $R$ 是\
  \ $C^\\infty(M)$-多线性的。\n\n**证明.** (a)：这由定理 15.3.2(a) 得出。\n\n(b)：利用定理 15.3.2 和定理\
  \ 18.1.2，可容易证明 $R$ 在每个变元中都可加。对 $C^\\infty(M)$ 中的函数 $f$，由定理\n\n\n\n## 18.7 曲率张量\n\
  \n15.3.2(d) 和定理 18.1.2 可得\n\n$$\\begin{aligned}\nR(fX,Y)Z &= \\nabla_X(\\nabla_Y(Z))-\\\
  nabla_Y(\\nabla_X(Z))-\\nabla_{[X,Y]}(Z)\\\\\n&=f\\nabla_X(\\nabla_Y(Z))-\\nabla_Y(f\\\
  nabla_X(Z))-\\nabla_{[fX,Y]}(Z)\\\\\n&=f\\nabla_X(\\nabla_Y(Z))-\\{Y(f)\\nabla_X(Z)+f\\\
  nabla_Y(\\nabla_X(Z))\\}\\\\\n&\\quad-(f\\nabla_{[X,Y]}(Z)-Y(f)\\nabla_X(Z))\\\\\
  \n&=f(\\nabla_X(\\nabla_Y(Z))-\\nabla_Y(\\nabla_X(Z))-\\nabla_{[X,Y]}(Z))\\\\\n\
  &=fR(X,Y)Z.\n\\end{aligned}$$\n\n同样，\n\n$$R(X,fY)Z=fR(X,Y)Z.$$\n\n我们也有\n\n$$\\begin{aligned}\n\
  R(X,Y)(fZ)&=\\nabla_X(\\nabla_Y(fZ))-\\nabla_Y(\\nabla_X(fZ))-\\nabla_{[X,Y]}(fZ),\\\
  \\\n\\nabla_X(\\nabla_Y(fZ))&=\\nabla_X(Y(f)Z+f\\nabla_Y(Z))=\\nabla_X(Y(f)Z)+\\\
  nabla_X(f\\nabla_Y(Z))\\\\\n&=X(Y(f))Z+Y(f)\\nabla_X(Z)+X(f)\\nabla_Y(Z)+f\\nabla_X(\\\
  nabla_Y(Z)),\\\\\n\\nabla_Y(\\nabla_X(fZ))&=Y(X(f))Z+X(f)\\nabla_Y(Z)+Y(f)\\nabla_X(Z)+f\\\
  nabla_Y(\\nabla_X(Z)),\n\\end{aligned}$$\n\n并且\n\n$$\\begin{aligned}\n\\nabla_{[X,Y]}(fZ)&=[X,Y](f)Z+f\\\
  nabla_{[X,Y]}(Z)\\\\\n&=X(Y(f))Z-Y(X(f))Z+f\\nabla_{[X,Y]}(Z),\n\\end{aligned}$$\n\
  \n因此\n\n$$\\begin{aligned}\nR(X,Y)(fZ)&=f\\{\\nabla_X(\\nabla_Y(Z))-\\nabla_Y(\\\
  nabla_X(Z))-\\nabla_{[X,Y]}(Z)\\}\\\\\n&=fR(X,Y)(Z).\n\\end{aligned}$$\n\n于是，$R$\
  \ 是 $C^\\infty(M)$-多线性的。\n\n设 $(M,\\nabla)$ 是一个带有联络的光滑 $m$-流形，设 $(U,(x^i))$ 是 $M$\
  \ 上的一个坐标图。在局部坐标下，$R(\\partial/\\partial x^i,\\partial/\\partial x^j)\\partial/\\\
  partial x^k$ 可以表示为\n\n$$R\\left(\\frac{\\partial}{\\partial x^i},\\frac{\\partial}{\\\
  partial x^j}\\right)\\frac{\\partial}{\\partial x^k}=\\sum_l R^l_{ijk}\\frac{\\\
  partial}{\\partial x^l}. \\tag{18.7.2}$$\n\n其中 $R^l_{ijk}$ 是 $C^\\infty(U)$ 中唯一确定的函数。\n\
  \n**定理 18.7.2（曲率张量的局部坐标表达式）。**\n\n*在上述设定下，*\n\n$$R^l_{ijk}=\\frac{\\partial\\Gamma^l_{jk}}{\\\
  partial x^i}-\\frac{\\partial\\Gamma^l_{ik}}{\\partial x^j}+\\sum_n(\\Gamma^l_{in}\\\
  Gamma^n_{jk}-\\Gamma^l_{jn}\\Gamma^n_{ik})$$\n\n对于 $i,j,k,l=1,\\ldots,m$。\n\n**证明。**\
  \ 我们由 (18.7.1) 和 (18.7.2) 可得\n\n$$\\sum_{l} R^{l}_{ijk}\\,\\frac{\\partial}{\\partial\
  \ x^{l}} = R\\left(\\frac{\\partial}{\\partial x^{i}},\\frac{\\partial}{\\partial\
  \ x^{j}}\\right)\\frac{\\partial}{\\partial x^{k}}$$\n\n$$= \\nabla_{\\partial/\\\
  partial x^{i}}\\left(\\nabla_{\\partial/\\partial x^{j}}\\left(\\frac{\\partial}{\\\
  partial x^{k}}\\right)\\right) - \\nabla_{\\partial/\\partial x^{j}}\\left(\\nabla_{\\\
  partial/\\partial x^{i}}\\left(\\frac{\\partial}{\\partial x^{k}}\\right)\\right)$$\
  \ \n\n$$- \\nabla_{[\\partial/\\partial x^{i},\\partial/\\partial x^{j}]}\\left(\\\
  frac{\\partial}{\\partial x^{k}}\\right).$$\n\n然后 (18.2.1) 给出\n\n$$\\nabla_{\\partial/\\\
  partial x^{i}}\\left(\\nabla_{\\partial/\\partial x^{j}}\\left(\\frac{\\partial}{\\\
  partial x^{k}}\\right)\\right) = \\nabla_{\\partial/\\partial x^{i}}\\left(\\sum_{l}\\\
  Gamma^{l}_{jk}\\frac{\\partial}{\\partial x^{l}}\\right) = \\sum_{l}\\nabla_{\\\
  partial/\\partial x^{i}}\\left(\\Gamma^{l}_{jk}\\frac{\\partial}{\\partial x^{l}}\\\
  right)$$ \n\n$$= \\sum_{l}\\left[\\frac{\\partial\\Gamma^{l}_{jk}}{\\partial x^{i}}\\\
  frac{\\partial}{\\partial x^{l}} + \\Gamma^{l}_{jk}\\nabla_{\\partial/\\partial\
  \ x^{i}}\\left(\\frac{\\partial}{\\partial x^{l}}\\right)\\right]$$\n\n$$= \\sum_{l}\\\
  left(\\frac{\\partial\\Gamma^{l}_{jk}}{\\partial x^{i}}\\frac{\\partial}{\\partial\
  \ x^{l}} + \\Gamma^{l}_{jk}\\sum_{n}\\Gamma^{n}_{il}\\frac{\\partial}{\\partial\
  \ x^{n}}\\right)$$ \n\n$$= \\sum_{l}\\frac{\\partial\\Gamma^{l}_{jk}}{\\partial\
  \ x^{i}}\\frac{\\partial}{\\partial x^{l}} + \\sum_{ln}\\Gamma^{l}_{jk}\\Gamma^{n}_{il}\\\
  frac{\\partial}{\\partial x^{n}}$$\n\n$$= \\sum_{l}\\frac{\\partial\\Gamma^{l}_{jk}}{\\\
  partial x^{i}}\\frac{\\partial}{\\partial x^{l}} + \\sum_{ln}\\Gamma^{n}_{jk}\\\
  Gamma^{l}_{in}\\frac{\\partial}{\\partial x^{l}}$$\n\n$$= \\left(\\sum_{l}\\frac{\\\
  partial\\Gamma^{l}_{jk}}{\\partial x^{i}} + \\sum_{ln}\\Gamma^{n}_{jk}\\Gamma^{l}_{in}\\\
  right)\\frac{\\partial}{\\partial x^{l}}$$\n\n并且\n\n$$\\nabla_{\\partial/\\partial\
  \ x^{j}}\\left(\\nabla_{\\partial/\\partial x^{i}}\\left(\\frac{\\partial}{\\partial\
  \ x^{k}}\\right)\\right) = \\left(\\sum_{l}\\frac{\\partial\\Gamma^{l}_{ik}}{\\\
  partial x^{j}} + \\sum_{ln}\\Gamma^{n}_{ik}\\Gamma^{l}_{jn}\\right)\\frac{\\partial}{\\\
  partial x^{l}},$$\n\n而定理 15.3.3(b) 给出\n\n$$\\nabla_{[\\partial/\\partial x^{i},\\\
  partial/\\partial x^{j}]}\\left(\\frac{\\partial}{\\partial x^{k}}\\right) = 0.$$\n\
  \n综合上述恒等式即得结果。\n\n在文献中，$R^{l}_{ijk}$ 的指标有时定义为\n\n$$R\\left(\\frac{\\partial}{\\\
  partial x^{j}},\\frac{\\partial}{\\partial x^{k}}\\right)\\frac{\\partial}{\\partial\
  \ x^{i}} = \\sum_{l} R^{l}_{ijk}\\,\\frac{\\partial}{\\partial x^{l}}.$$\n\n这会改变某些恒等式的指标，但没有实质性影响。\n\
  \n其中最后一个等式由 (18.7.3) 和 (18.7.4) 可得。我们也由 (18.6.1) 和 (18.7.1) 可得\n\n$$R(X,Y)Z$$\n\
  $$=\\nabla_X(\\nabla_Y(Z))-\\nabla_Y(\\nabla_X(Z))-\\nabla_{[X,Y]}(Z)$$\n$$=\\nabla_X(T(Y,Z)+\\\
  nabla_Z(Y)+[Y,Z])-\\nabla_Y(\\nabla_X(Z))-\\nabla_{[X,Y]}(Z)$$\n$$=\\nabla_X(T(Y,Z))+\\\
  nabla_X(\\nabla_Z(Y))+\\nabla_X([Y,Z])-\\nabla_Y(\\nabla_X(Z))-\\nabla_{[X,Y]}(Z).$$\n\
  \n然后 (18.7.3) 给出\n\n$$\\sum_{(X,Y,Z)} R(X,Y)Z$$\n$$=\\sum_{(X,Y,Z)}\\nabla_X(T(Y,Z))+\\\
  sum_{(X,Y,Z)}\\nabla_X(\\nabla_Z(Y))+\\sum_{(X,Y,Z)}\\nabla_X([Y,Z])$$\n$$\\quad-\\\
  sum_{(X,Y,Z)}\\nabla_Y(\\nabla_X(Z))-\\sum_{(X,Y,Z)}\\nabla_{[X,Y]}(Z)$$\n$$=\\\
  sum_{(X,Y,Z)}\\nabla_X(T(Y,Z))+\\sum_{(X,Y,Z)}\\nabla_X([Y,Z])-\\sum_{(X,Y,Z)}\\\
  nabla_{[X,Y]}(Z).$$\n\n结果现在由 (18.7.6) 和 (18.7.7) 可得。\n\n(b)：这由部分 (a) 可得。\n\n**定理\
  \ 18.7.4（第二 Bianchi 恒等式）。**\n\n*若 $(M,\\nabla)$ 是一个带有联络的光滑流形且 $X,Y,Z,W$ 是 $\\mathfrak{X}(M)$\
  \ 中的向量场，则*\n\n$$\\sum_{(X,Y,Z)}\\nabla_X(R(Y,Z)W)=\\sum_{(X,Y,Z)}R(X,Y)\\nabla_Z(W)+\\\
  sum_{(X,Y,Z)}R([X,Y],Z)W.$$\n\n*证明。* 回顾第 18.1 节末尾关于 Lie 代数 $\\operatorname{Lin}(\\\
  mathfrak{X}(M),\\mathfrak{X}(M))$ 的讨论，$R(X,Y)Z$ 可以表示为\n\n$$R(X,Y)Z=\\nabla_X(\\\
  nabla_Y(Z))-\\nabla_Y(\\nabla_X(Z))-\\nabla_{[X,Y]}(Z)$$\n$$=(\\nabla_X\\circ\\\
  nabla_Y-\\nabla_Y\\circ\\nabla_X-\\nabla_{[X,Y]})(Z)$$\n$$=([\\nabla_X,\\nabla_Y]-\\\
  nabla_{[X,Y]})(Z).$$\n\n因此\n\n$$\\nabla_Z(R(X,Y)W)=\\nabla_Z(([\\nabla_X,\\nabla_Y]-\\\
  nabla_{[X,Y]})(W))$$\n$$=(\\nabla_Z\\circ[\\nabla_X,\\nabla_Y]-\\nabla_Z\\circ\\\
  nabla_{[X,Y]})(W),$$\n\n$$R(X,Y)\\nabla_Z(W)=([\\nabla_X,\\nabla_Y]-\\nabla_{[X,Y]})(\\\
  nabla_Z(W))$$\n$$=([\\nabla_X,\\nabla_Y]\\circ\\nabla_Z-\\nabla_{[X,Y]}\\circ\\\
  nabla_Z)(W),$$\n\n并且\n\n$$R([X,Y],Z)W=([\\nabla_{[X,Y]},\\nabla_Z]-\\nabla_{[[X,Y],Z]})(W).$$\n\
  \n综合前述三个恒等式可得\n\n$$\\begin{aligned}\n\\nabla_Z(R(X,Y)W)-R(X,Y)\\nabla_Z(W)-R([X,Y],Z)W\n\
  &=(\\nabla_Z\\circ[\\nabla_X,\\nabla_Y]-\\nabla_Z\\circ\\nabla_{[X,Y]}-([\\nabla_X,\\\
  nabla_Y]\\circ\\nabla_Z-\\nabla_{[X,Y]}\\circ\\nabla_Z))(W)\\\\\n&=([\\nabla_Z\\\
  circ[\\nabla_X,\\nabla_Y]-[\\nabla_X,\\nabla_Y]\\circ\\nabla_Z]-(\\nabla_Z\\circ\\\
  nabla_{[X,Y]}-\\nabla_{[X,Y]}\\circ\\nabla_Z))(W)\\\\\n&\\quad+([\\nabla_Z,\\nabla_{[X,Y]}]-\\\
  nabla_{[Z,[X,Y]]})(W)\\\\\n&=([\\nabla_Z,[\\nabla_X,\\nabla_Y]]-[\\nabla_Z,\\nabla_{[X,Y]}]+[\\\
  nabla_Z,\\nabla_{[X,Y]}]-\\nabla_{[Z,[X,Y]]})(W)\\\\\n&=[\\nabla_Z,[\\nabla_X,\\\
  nabla_Y]](W)-\\nabla_{[Z,[X,Y]]}(W).\n\\end{aligned}$$\n\n然后 (18.7.3)–(18.7.5) 给出\n\
  \n$$\\sum_{(X,Y,Z)}\\nabla_X(R(Y,Z)W)-\\sum_{(X,Y,Z)}R(X,Y)\\nabla_Z(W)-\\sum_{(X,Y,Z)}R([X,Y],Z)W=\\\
  left(\\sum_{(X,Y,Z)}[\\nabla_X,[\\nabla_Y,\\nabla_Z]]\\right)(W)-\\left(\\nabla_{\\\
  sum_{(X,Y,Z)}[X,[Y,Z]]}\\right)(W)=0.$$\n\n**定理 18.7.5。** 设 $(M,\\nabla)$ 是一个带有联络的光滑流形，设\
  \ $\\sigma(r,s):(a,b)\\times(-\\varepsilon,\\varepsilon)\\longrightarrow M$ 是一个参数化曲面，且\
  \ $V$ 是 $\\mathfrak{X}_M(\\sigma)$ 中的一个向量场。则\n\n$$R\\left(\\frac{\\partial\\sigma}{\\\
  partial r},\\frac{\\partial\\sigma}{\\partial s}\\right)V=\\frac{\\nabla}{\\partial\
  \ r}\\left(\\frac{\\nabla V}{\\partial s}\\right)-\\frac{\\nabla}{\\partial s}\\\
  left(\\frac{\\nabla V}{\\partial r}\\right). \\tag{18.7.8}$$\n\n**证明。** 证明是一个冗长的计算。我们寻求\
  \ (18.7.8) 两边的另两种表达式。设 $(U,(x^i))$ 是 $M$ 上的一个坐标图，它与 $\\sigma((a,b)\\times(-\\varepsilon,\\\
  varepsilon))$ 相交。由定理 14.9.2，\n\n$$\\frac{\\partial\\sigma}{\\partial r}=\\sum_i\\\
  frac{\\partial(x^i\\circ\\sigma)}{\\partial r}\\left(\\frac{\\partial}{\\partial\
  \ x^i}\\circ\\sigma\\right). \\tag{18.7.9}$$\n\n并且\n\n$$\\frac{\\partial\\sigma}{\\\
  partial s}=\\sum_j\\frac{\\partial(x^j\\circ\\sigma)}{\\partial s}\\left(\\frac{\\\
  partial}{\\partial x^j}\\circ\\sigma\\right). \\tag{18.7.10}$$\n\n\n\n\n我们首先考虑 $V\
  \ = (\\partial/\\partial x^k)\\circ\\sigma$ 的情形。对于 (18.7.8) 的左边，有\n\n$R\\left(\\\
  frac{\\partial\\sigma}{\\partial r}, \\frac{\\partial\\sigma}{\\partial s}\\right)\\\
  left(\\frac{\\partial}{\\partial x^k}\\circ\\sigma\\right)$\n$= R\\left(\\sum_i\
  \ \\frac{\\partial(x^i\\circ\\sigma)}{\\partial r}\\left(\\frac{\\partial}{\\partial\
  \ x^i}\\circ\\sigma\\right), \\sum_j \\frac{\\partial(x^j\\circ\\sigma)}{\\partial\
  \ s}\\left(\\frac{\\partial}{\\partial x^j}\\circ\\sigma\\right)\\right)\\left(\\\
  frac{\\partial}{\\partial x^k}\\circ\\sigma\\right)$\n$= \\sum_{ij} \\frac{\\partial(x^i\\\
  circ\\sigma)}{\\partial r}\\frac{\\partial(x^j\\circ\\sigma)}{\\partial s} R\\left(\\\
  frac{\\partial}{\\partial x^i}\\circ\\sigma, \\frac{\\partial}{\\partial x^j}\\\
  circ\\sigma\\right)\\left(\\frac{\\partial}{\\partial x^k}\\circ\\sigma\\right)$\n\
  $= \\sum_{ij} \\frac{\\partial(x^i\\circ\\sigma)}{\\partial r}\\frac{\\partial(x^j\\\
  circ\\sigma)}{\\partial s} \\left[\\nabla_{(\\partial/\\partial x^i)\\circ\\sigma}\\\
  left(\\nabla_{\\partial/\\partial x^j}\\left(\\frac{\\partial}{\\partial x^k}\\\
  right)\\right) - \\nabla_{(\\partial/\\partial x^j)\\circ\\sigma}\\left(\\nabla_{\\\
  partial/\\partial x^i}\\left(\\frac{\\partial}{\\partial x^k}\\right)\\right)\\\
  right],$ (18.7.11)\n\n其中最后一个等式由定理15.3.3(b)和(18.7.1)得出。\n\n对于 (18.7.8) 的右边，由定理18.3.1(c)和(18.7.10)给出\n\
  \n$\\frac{\\nabla}{\\partial s}\\left(\\frac{\\partial}{\\partial x^k}\\circ\\sigma\\\
  right) = \\nabla_{\\partial\\sigma/\\partial s}\\left(\\frac{\\partial}{\\partial\
  \ x^k}\\right) = \\sum_j \\frac{\\partial(x^j\\circ\\sigma)}{\\partial s} \\nabla_{(\\\
  partial/\\partial x^j)\\circ\\sigma}\\left(\\frac{\\partial}{\\partial x^k}\\right),$\n\
  \n因此\n\n$\\frac{\\nabla}{\\partial r}\\left(\\frac{\\nabla}{\\partial s}\\left(\\\
  frac{\\partial}{\\partial x^k}\\circ\\sigma\\right)\\right) = \\sum_j \\frac{\\\
  nabla}{\\partial r}\\left(\\frac{\\partial(x^j\\circ\\sigma)}{\\partial s} \\nabla_{(\\\
  partial/\\partial x^j)\\circ\\sigma}\\left(\\frac{\\partial}{\\partial x^k}\\right)\\\
  right)$\n$= \\sum_j \\frac{\\nabla}{\\partial r}\\left(\\frac{\\partial(x^j\\circ\\\
  sigma)}{\\partial s}\\right) \\nabla_{(\\partial/\\partial x^j)\\circ\\sigma}\\\
  left(\\frac{\\partial}{\\partial x^k}\\right)$\n$+ \\sum_j \\frac{\\partial(x^j\\\
  circ\\sigma)}{\\partial s} \\nabla_{\\partial\\sigma/\\partial r}\\left(\\nabla_{\\\
  partial/\\partial x^j}\\left(\\frac{\\partial}{\\partial x^k}\\right)\\right) \\\
  quad (18.7.12)$\n$= \\sum_j \\frac{\\partial^2 x^j}{\\partial r\\partial s} \\nabla_{(\\\
  partial/\\partial x^j)\\circ\\sigma}\\left(\\frac{\\partial}{\\partial x^k}\\right)$\n\
  $+ \\sum_j \\frac{\\partial(x^j\\circ\\sigma)}{\\partial s} \\nabla_{\\partial\\\
  sigma/\\partial r}\\left(\\nabla_{\\partial/\\partial x^j}\\left(\\frac{\\partial}{\\\
  partial x^k}\\right)\\right).$\n\n利用(18.7.9)，(18.7.12)最后一行中的项可表示为\n\n$\\sum_j \\\
  partial(x^j \\circ \\sigma)/\\partial s \\nabla_{\\partial\\sigma/\\partial r} (\\\
  nabla_{\\partial/\\partial x^j} (\\partial/\\partial x^k)) = \\sum_j \\partial(x^j\
  \ \\circ \\sigma)/\\partial s [\\sum_i \\partial(x^i \\circ \\sigma)/\\partial r\
  \ \\nabla_{(\\partial/\\partial x^i)\\circ\\sigma} (\\nabla_{\\partial/\\partial\
  \ x^j} (\\partial/\\partial x^k))] = \\sum_{ij} \\partial(x^i \\circ \\sigma)/\\\
  partial r \\partial(x^j \\circ \\sigma)/\\partial s \\nabla_{(\\partial/\\partial\
  \ x^i)\\circ\\sigma} (\\nabla_{(\\partial/\\partial x^j)\\circ\\sigma} (\\partial/\\\
  partial x^k)).$\n\n于是(18.7.12)变为\n\n$\\nabla_{\\partial/\\partial r} (\\nabla_{\\\
  partial/\\partial s} (\\partial/\\partial x^k \\circ \\sigma)) = \\sum_j \\partial^2\
  \ x^j/\\partial r\\partial s \\nabla_{(\\partial/\\partial x^j)\\circ\\sigma} (\\\
  partial/\\partial x^k) + \\sum_{ij} \\partial(x^i \\circ \\sigma)/\\partial r \\\
  partial(x^j \\circ \\sigma)/\\partial s \\nabla_{(\\partial/\\partial x^i)\\circ\\\
  sigma} (\\nabla_{\\partial/\\partial x^j} (\\partial/\\partial x^k)).$\n\n在上述恒等式中交换\
  \ r 和 s，并利用定理10.1.6，可得\n\n$\\nabla_{\\partial/\\partial s} (\\nabla_{\\partial/\\\
  partial r} (\\partial/\\partial x^k \\circ \\sigma)) = \\sum_j \\partial^2 x^j/\\\
  partial s\\partial r \\nabla_{(\\partial/\\partial x^j)\\circ\\sigma} (\\partial/\\\
  partial x^k) + \\sum_{ij} \\partial(x^i \\circ \\sigma)/\\partial s \\partial(x^j\
  \ \\circ \\sigma)/\\partial r \\nabla_{(\\partial/\\partial x^i)\\circ\\sigma} (\\\
  nabla_{\\partial/\\partial x^j} (\\partial/\\partial x^k)) = \\sum_j \\partial^2\
  \ x^j/\\partial r\\partial s \\nabla_{(\\partial/\\partial x^j)\\circ\\sigma} (\\\
  partial/\\partial x^k) + \\sum_{ij} \\partial(x^i \\circ \\sigma)/\\partial r \\\
  partial(x^j \\circ \\sigma)/\\partial s \\nabla_{(\\partial/\\partial x^j)\\circ\\\
  sigma} (\\nabla_{\\partial/\\partial x^i} (\\partial/\\partial x^k)).$\n\n将上述两个恒等式相减，得到\n\
  \n$\\nabla_{\\partial/\\partial r} (\\nabla_{\\partial/\\partial s} (\\partial/\\\
  partial x^k \\circ \\sigma)) - \\nabla_{\\partial/\\partial s} (\\nabla_{\\partial/\\\
  partial r} (\\partial/\\partial x^k \\circ \\sigma)) = \\sum_{ij} \\partial(x^i\
  \ \\circ \\sigma)/\\partial r \\partial(x^j \\circ \\sigma)/\\partial s [\\nabla_{(\\\
  partial/\\partial x^i)\\circ\\sigma} (\\nabla_{\\partial/\\partial x^j} (\\partial/\\\
  partial x^k)) - \\nabla_{(\\partial/\\partial x^j)\\circ\\sigma} (\\nabla_{\\partial/\\\
  partial x^i} (\\partial/\\partial x^k))] \\quad (18.7.13)$\n\n这就是(18.7.8)右边所期望的表达式。\n\
  \n由(18.7.11)和(18.7.13)，我们得到\n\n$R\\left(\\frac{\\partial \\sigma}{\\partial r},\
  \ \\frac{\\partial \\sigma}{\\partial s}\\right)\\left(\\frac{\\partial}{\\partial\
  \ x^{k}} \\circ \\sigma\\right) = \\frac{\\nabla}{\\partial r}\\left(\\frac{\\nabla}{\\\
  partial s}\\left(\\frac{\\partial}{\\partial x^{k}} \\circ \\sigma\\right)\\right)\
  \ - \\frac{\\nabla}{\\partial s}\\left(\\frac{\\nabla}{\\partial r}\\left(\\frac{\\\
  partial}{\\partial x^{k}} \\circ \\sigma\\right)\\right). \\tag{18.7.14}$\n\n这证明了\
  \ $V = (\\partial/\\partial x^k) \\circ \\sigma$ 情形的断言。\n\n更一般地，在局部坐标中，考虑\n\n$V\
  \ = \\sum_{k} \\alpha^{k}\\left(\\frac{\\partial}{\\partial x^{k}} \\circ \\sigma\\\
  right).$\n\n那么\n\n$R\\left(\\frac{\\partial \\sigma}{\\partial r}, \\frac{\\partial\
  \ \\sigma}{\\partial s}\\right)V = R\\left(\\frac{\\partial \\sigma}{\\partial r},\
  \ \\frac{\\partial \\sigma}{\\partial s}\\right)\\left(\\sum_{k} \\alpha^{k}\\left(\\\
  frac{\\partial}{\\partial x^{k}} \\circ \\sigma\\right)\\right) = \\sum_{k} \\alpha^{k}\
  \ R\\left(\\frac{\\partial \\sigma}{\\partial r}, \\frac{\\partial \\sigma}{\\partial\
  \ s}\\right)\\left(\\frac{\\partial}{\\partial x^{k}} \\circ \\sigma\\right) = \\\
  sum_{k} \\alpha^{k}\\left[\\frac{\\nabla}{\\partial r}\\left(\\frac{\\nabla}{\\\
  partial s}\\left(\\frac{\\partial}{\\partial x^{k}} \\circ \\sigma\\right)\\right)\
  \ - \\frac{\\nabla}{\\partial s}\\left(\\frac{\\nabla}{\\partial r}\\left(\\frac{\\\
  partial}{\\partial x^{k}} \\circ \\sigma\\right)\\right)\\right], \\tag{18.7.15}$\n\
  \n其中最后一个等式由(18.7.14)得出。我们还有\n\n$\\frac{\\nabla V}{\\partial s} = \\sum_{k} \\frac{\\\
  nabla}{\\partial s}\\left(\\alpha^{k}\\left(\\frac{\\partial}{\\partial x^{k}} \\\
  circ \\sigma\\right)\\right) = \\sum_{k} \\frac{\\partial \\alpha^{k}}{\\partial\
  \ s}\\left(\\frac{\\partial}{\\partial x^{k}} \\circ \\sigma\\right) + \\sum_{k}\
  \ \\alpha^{k} \\frac{\\nabla}{\\partial s}\\left(\\frac{\\partial}{\\partial x^{k}}\
  \ \\circ \\sigma\\right),$\n\n因此\n\n$\\frac{\\nabla}{\\partial r}\\left(\\frac{\\\
  nabla V}{\\partial s}\\right) = \\sum_{k} \\frac{\\nabla}{\\partial r}\\left(\\\
  frac{\\partial \\alpha^{k}}{\\partial s}\\left(\\frac{\\partial}{\\partial x^{k}}\
  \ \\circ \\sigma\\right)\\right) + \\sum_{k} \\frac{\\nabla}{\\partial r}\\left(\\\
  alpha^{k} \\frac{\\nabla}{\\partial s}\\left(\\frac{\\partial}{\\partial x^{k}}\
  \ \\circ \\sigma\\right)\\right) = \\sum_{k} \\frac{\\partial^{2} \\alpha^{k}}{\\\
  partial r \\partial s}\\left(\\frac{\\partial}{\\partial x^{k}} \\circ \\sigma\\\
  right) + \\sum_{k} \\frac{\\partial \\alpha^{k}}{\\partial s} \\frac{\\nabla}{\\\
  partial r}\\left(\\frac{\\partial}{\\partial x^{k}} \\circ \\sigma\\right) + \\\
  sum_{k} \\frac{\\partial \\alpha^{k}}{\\partial r} \\frac{\\nabla}{\\partial s}\\\
  left(\\frac{\\partial}{\\partial x^{k}} \\circ \\sigma\\right) + \\sum_{k} \\alpha^{k}\
  \ \\frac{\\nabla}{\\partial r}\\left(\\frac{\\nabla}{\\partial s}\\left(\\frac{\\\
  partial}{\\partial x^{k}} \\circ \\sigma\\right)\\right).$\n\n在上述恒等式中交换 r 和 s，并利用定理10.1.6，可得\n\
  \n$\\nabla/\\partial s (\\nabla V/\\partial r) = \\Sigma_k \\partial^2\\alpha^k/\\\
  partial r\\partial s (\\partial/\\partial x^k \\circ \\sigma) + \\Sigma_k \\partial\\\
  alpha^k/\\partial r \\nabla/\\partial s (\\partial/\\partial x^k \\circ \\sigma)\
  \ + \\Sigma_k \\partial\\alpha^k/\\partial s \\nabla/\\partial r (\\partial/\\partial\
  \ x^k \\circ \\sigma) + \\Sigma_k \\alpha^k \\nabla/\\partial s (\\nabla/\\partial\
  \ r (\\partial/\\partial x^k \\circ \\sigma)).$\n\n将上述两个恒等式相减，得到\n\n$\\nabla/\\\
  partial r (\\nabla V/\\partial s) - \\nabla/\\partial s (\\nabla V/\\partial r)\
  \ = \\Sigma_k \\alpha^k [ \\nabla/\\partial r (\\nabla/\\partial s (\\partial/\\\
  partial x^k \\circ \\sigma)) - \\nabla/\\partial s (\\nabla/\\partial r (\\partial/\\\
  partial x^k \\circ \\sigma)) ]. \\quad (18.7.16)$\n\n现在由(18.7.15)和(18.7.16)即可得到结果。\n\
  \n## 18.8 测地线\n\n在本节中，我们为带联络的光滑流形引入一类“直线”。欧氏空间中直线的一个基本特征是它们给出不同点之间的最短距离。这在当前背景下没有意义，因为在带联络的光滑流形上没有距离的概念。然而，在牛顿物理学中，零加速度的粒子在欧氏空间中描绘出一条直线。我们将这一观察作为出发点。\n\
  \n设$(M,\\nabla)$为带联络的光滑流形，设$\\lambda(t) : (a,b) \\longmapsto M$为光滑曲线。回顾定理15.1.3，$\\\
  lambda$的速度是$\\mathfrak{X}_M(\\lambda)$中的向量场$d\\lambda/dt$，并且如果$\\lambda$的速度处处非零，则称$\\\
  lambda$是正则的。$\\lambda$的加速度定义为速度的协变导数，即$\\mathfrak{X}_M(\\lambda)$中的向量场$(\\nabla/dt)(d\\\
  lambda/dt)$。如果$\\lambda$的加速度为零，则称$\\lambda$为测地线；即\n\n$\\nabla/dt (d\\lambda/dt)(t)\
  \ = 0$\n\n对所有$t\\in(a,b)$成立；等价地，如果$d\\lambda/dt$是$\\mathfrak{X}_M(\\lambda)$中的平行向量场。\n\
  \n例如，考虑$\\mathbb{R}^3$中的直线，其参数化为$\\lambda(t) = (t,t,t) : \\mathbb{R} \\longmapsto\
  \ \\mathbb{R}^3$。速度和加速度分别为$(d\\lambda/dt)(t) = (1,1,1)$和$(\\nabla/dt)(d\\lambda/dt)(t)\
  \ = (0,0,0)$对所有$t\\in\\mathbb{R}$成立，因此$\\lambda$是测地线。现在考虑另一个参数化$\\tilde{\\lambda}(t)\
  \ = (t^3,t^3,t^3) : \\mathbb{R} \\longmapsto \\mathbb{R}^3$。那么$(d\\tilde{\\lambda}/dt)(t)\
  \ = (3t^2,3t^2,3t^2)$和$(\\nabla/dt)(d\\tilde{\\lambda}/dt)(t) = (6t,6t,6t)$，所以$\\\
  tilde{\\lambda}$不是测地线。这说明判断一条光滑曲线是否为测地线不仅取决于其“几何”，还取决于其参数化。\n\n\n\n\n**证明.** 我们证明逻辑上等价的断言：如果\
  \ $\\gamma$ 不是正则的，则它是常值。假设 $(d\\gamma/dt)(t_0)=0$ 对某个点 $t_0$ 在 $(a,b)$ 中成立。令 $g(u):(a-t_0,b-t_0)\\\
  longrightarrow(a,b)$ 为由 $g(u)=u+t_0$ 给出的微分同胚。由于 $g$ 是双射的，随着 $u$ 在 $(c,d)$ 上变化，$g(u)$\
  \ 在 $(a,b)$ 上变化。因为 $\\gamma$ 是测地线，由定理 18.3.3(b) 可知\n\n$$\\frac{\\nabla}{du}\\left(\\\
  frac{d(\\gamma\\circ g)}{du}\\right)(u)=\\frac{d^2g}{du^2}(u)\\frac{d\\gamma}{dt}(g(u))=0$$\n\
  \n对所有 $u$ 在 $(c,d)$ 中成立。因此，$\\gamma\\circ g$ 是测地线。令 $p=\\gamma(t_0)$，使得 $\\gamma\\\
  circ g(0)=p$。由定理 14.4.5，\n\n$$\\frac{d(\\gamma\\circ g)}{du}(0)=\\frac{dg}{du}(0)\\\
  frac{d\\gamma}{dt}(g(0))=\\frac{d\\gamma}{dt}(t_0)=0.$$\n\n我们由定理 18.8.2(b) 知 $\\\
  gamma\\circ g$ 是 $\\gamma_{p,0}$ 在 $(a-t_0,b-t_0)$ 上的限制。由定理 18.8.3，$\\gamma_{p,0}$\
  \ 具有常值 $p$，因此 $\\gamma$ 也是如此。\n\n## **定理 18.8.5.**\n\n设 $(M,\\nabla)$ 为带联络的光滑流形，设\
  \ $\\gamma(t):(a,b)\\longrightarrow M$ 为非常值测地线，且 $g(u):(c,d)\\longrightarrow(a,b)$\
  \ 为微分同胚。则 $\\gamma\\circ g(u):(c,d)\\longrightarrow(a,b)$ 是测地线当且仅当 $g$ 是线性的。\n\n\
  **证明.** 由于 $\\gamma$ 是测地线，由定理 18.3.3(b)，\n\n$$\\frac{\\nabla}{du}\\left(\\frac{d(\\\
  gamma\\circ g)}{du}\\right)(u)=\\frac{d^2g}{du^2}(u)\\frac{d\\gamma}{dt}(g(u)),$$\n\
  \n并且因为 $\\gamma$ 是非常值的，由定理 18.8.4，$(d\\gamma/dt)(g(u))\\ne0$ 对所有 $u$ 在 $(c,d)$ 中成立。由于\
  \ $g$ 是双射的，随着 $u$ 在 $(c,d)$ 上变化，$g(u)$ 在 $(a,b)$ 上变化。因此，\n\n$$\\begin{aligned}\n\
  \\gamma\\circ g\\text{ is a geodesic}\n&\\iff \\frac{\\nabla}{du}\\left(\\frac{d(\\\
  gamma\\circ g)}{du}\\right)=0\\\\\n&\\iff \\frac{d^2g}{du^2}=0\\\\\n&\\iff g\\text{\
  \ is linear.}\n\\end{aligned}$$\n\n## **定理 18.8.6.**\n\n设 $(M,\\nabla)$ 为带联络的光滑流形，设\
  \ $p$ 为 $M$ 中的点，且 $v$ 为 $T_p(M)$ 中的向量。设 $\\gamma_{p,v}(t):(a,b)\\longrightarrow\
  \ M$ 为起点为 $p$ 且初始速度为 $v$ 的最大测地线，且 $\\epsilon>0$ 为实数。则起点为 $p$ 且初始速度为 $\\epsilon v$\
  \ 的最大测地线是 $\\gamma_{p,\\epsilon v}(t):(a/\\epsilon,b/\\epsilon)\\longrightarrow\
  \ M$，其中\n\n$$\\gamma_{p,\\epsilon v}(t)=\\gamma_{p,v}(\\epsilon t)$$\n\n对所有 $t$\
  \ 在 $(a/\\epsilon,b/\\epsilon)$ 中成立。\n\n证明. 考虑微分同胚 g(u) : (a/ε, b/ε) ⟶ (a, b) 由\
  \ g(u) = εu 给出。由定理 18.8.5，γ_{p,v} ∘ g(u) : (a/ε, b/ε) ⟶ M 是测地线。由于 γ_{p,v} 是最大的，所以\
  \ γ_{p,v} ∘ g 也是最大的，否则 γ_{p,v} 可被延拓。我们由定理 18.8.2(a) 知 γ_{p,v} ∘ g(0) = γ_{p,v}(0)\
  \ = p，且由定理 14.4.5 和定理 18.8.2(a) 知\n\n```\nd(γ_{p,v} ∘ g)/du (0) = dg/du (0) dγ_{p,v}/dt\
  \ (g(0)) = ε dγ_{p,v}/dt (0) = εv.\n```\n\n由定理 18.8.2 可知 γ_{p,εv} = γ_{p,v} ∘ g。因此，γ_{p,εv}(u)\
  \ = γ_{p,v}(εu) 对所有 u 在 (a/ε, b/ε) 中成立。\n\n### 例 18.8.7 (光滑 2-流形)。\n\n对于带对称联络的光滑\
  \ 2-流形，定理 18.8.1 中的测地线方程简化为\n\n```\nd²(x¹ ∘ λ)/dt² (t) + (d(x¹ ∘ λ)/dt (t))² Γ¹₁₁(λ(t))\
  \ + 2 d(x¹ ∘ λ)/dt (t) d(x² ∘ λ)/dt (t) Γ¹₁₂(λ(t)) + (d(x² ∘ λ)/dt (t))² Γ¹₂₂(λ(t))\
  \ = 0\n```\n\n和\n\n```\nd²(x² ∘ λ)/dt² (t) + (d(x¹ ∘ λ)/dt (t))² Γ²₁₁(λ(t)) + 2\
  \ d(x¹ ∘ λ)/dt (t) d(x² ∘ λ)/dt (t) Γ²₁₂(λ(t)) + (d(x² ∘ λ)/dt (t))² Γ²₂₂(λ(t))\
  \ = 0.\n```\n\n将正则曲面视为带例 18.1.1 中定义的联络的光滑 2-流形，我们由例 18.6.1 知联络是对称的。因此，上面的测地线方程适用。\n\
  \n### 例 18.8.8 (Pln)。\n\n设我们将第 13.1 节中讨论的正则曲面 Pln 视为带例 18.1.1 中定义的联络的光滑 2-流形。设 γ(t)\
  \ = (γ¹, γ²) : ℝ ⟶ ℝ² 为测地线。由于 Christoffel 符号恒为 0，由定理 18.8.1，测地线方程为 (d²γᵏ/dt²)(t)\
  \ = 0 对 k = 1,2。这些方程的解为 γᵏ(t) = aᵏ + bᵏ t 对任意实数 a¹, b¹, a², b² 的选择。因此，\n\n```\n\
  γ(t) = (a¹, a²) + t(b¹, b²).\n```\n\n毫不奇怪，γ 的像是直线。这表明 Pln 中以给定起点为起点的最大测地线是通过该点的直线。\n\
  \n### 例 18.8.9 (Cyl)。\n\n设我们将第 13.2 节中讨论的正则曲面 Cyl 视为带例 18.1.1 中定义的联络的光滑 2-流形。设 γ(u)\
  \ : ℝ ⟶ Cyl 为由\n\n```\nγ(u) = (cos(φ(u)), sin(φ(u)), t(u)).\n```\n\n参数化的测地线。我们由例\
  \ 18.8.7 知测地线方程为\n\n```\nd²t/du²(u) = 0      and      d²φ/du²(u) = 0,\n```\n\n这些方程的解为\
  \ t(u) = a¹ + b¹ u 且 φ(u) = a² + b² u 对任意实数 a¹, b¹, a², b² 的选择。因此，\n\n```\nγ(u)\
  \ = (cos(a¹ + b¹ u), sin(a¹ + b¹ u), a² + b² u).\n```\n\n若 b¹ = 0，则 γ 的像是平行于 z 轴的直线；若\
  \ b² = 0，则 γ 的像是位于平行于 xy 平面的平面内的圆。否则，γ 的像是螺旋线。这表明 Cyl 中以给定起点为起点的最大测地线是通过该点的直线、圆和螺旋线。是否为其中之一由最大测地线的初始速度决定。\n\
  \n### 例 18.8.10 (S²)。\n\n设我们将第 13.4 节中讨论的正则曲面 S² 视为带例 18.1.1 中定义的联络的光滑 2-流形。继续例\
  \ 18.5.4，设 γ(t) : (a, b) ⟶ S² 为测地线。令 α¹ = dθ/dt 且 α² = dφ/dt 在 (18.5.3) 中给出测地线方程\n\
  \n```\nd²θ/dt²(t) − cos(θ(t)) sin(θ(t)) (dφ/dt(t))² = 0\n\nd²φ/dt²(t) + 2 cot(θ(t))\
  \ dθ/dt(t) dφ/dt(t) = 0.   (18.8.1)\n```\n\n为便于计算，我们将 S² 视为我们稍后将称之为黎曼 2-流形的对象。在当前背景下，这意味着将\
  \ S² 视为 ℝ₀³ 中的正则曲面并允许涉及欧几里得内积的计算。\n\n令\n\n```\nμ = (μ¹, μ²) = (θ, φ)   (18.8.2)\n\
  ```\n\n在 (12.5.2) 中，我们由定理 12.5.2(d) 知\n\n```\n⟨dγ/dt(t), dγ/dt(t)⟩ = (dθ/dt(t))²\
  \ + sin²(θ(t)) (dφ/dt(t))².\n```\n\n由定理 19.9.1(a)，γ 具有常速，设为 c。上述恒等式则变为\n\n```\n\
  (dθ/dt(t))² + sin²(θ(t)) (dφ/dt(t))² = c².   (18.8.3)\n```\n\n利用 (18.8.1) 和 (18.8.3)，一个冗长但直接的计算给出\n\
  \n```\n\\frac{d^2\\gamma}{dt^2}(t) + c^2\\gamma(t) = 0. \\tag{18.8.4}\n```\n\n另由定理\
  \ 12.5.2(c)、第 13.4 节中的 Christoffel 符号结果以及 (18.8.2) 可知\n\n```\n\\frac{d^2\\gamma}{dt^2}(t)\
  \ = \\left[\\frac{d^2\\theta}{dt}(t) - \\cos(\\theta(t))\\sin(\\theta(t))\\left(\\\
  frac{d\\phi}{dt}(t)\\right)^2\\right] H_{1\\mid(\\theta(t),\\phi(t))} + \\left[\\\
  frac{d^2\\phi}{dt}(t) + 2\\cot(\\theta(t))\\frac{d\\theta}{dt}\\frac{d\\phi}{dt}\\\
  right] H_{2\\mid(\\theta(t),\\phi(t))} - \\left[\\left(\\frac{d\\theta}{dt}(t)\\\
  right)^2 + \\sin^2(\\theta(t))\\left(\\frac{d\\phi}{dt}(t)\\right)^2\\right] G_{(\\\
  theta(t),\\phi(t))},\n```\n\n由 (18.8.1)–(18.8.3) 代入得 $(d^2\\gamma/dt^2)(t) + c^2\
  \ G_{(\\theta(t),\\phi(t))} = 0$。由定理 12.7.3(a) 和第 13.4 节末尾的注记可知\n\n```\nG_{(\\theta(t),\\\
  phi(t))} = \\mathcal{N}_{\\varphi(\\theta(t),\\phi(t))} = \\varphi(\\theta(t),\\\
  phi(t)) = \\gamma(t),\n```\n\n于是我们再次得到 (18.8.4)。\n\n(18.8.4) 的解为\n\n```\n\\gamma(t)\
  \ = \\cos(ct)v + \\sin(ct)w, \\tag{18.8.5}\n```\n\n对于尚待确定的向量 $v, w$ 在 $\\mathbb{R}^3$\
  \ 中。若 $c = 0$，则 $\\gamma$ 具有常值 $\\gamma(0) = v$。我们排除此情形并设 $\\pi/(2c)$ 在 $(a,b)$\
  \ 中。则\n\n```\n\\gamma(0) = v, \\quad \\gamma\\left(\\frac{\\pi}{2c}\\right) = w,\
  \ \\quad \\text{and} \\quad \\frac{d\\gamma}{dt}(0) = c w.\n```\n\n由定理 18.8.2 可知\
  \ $\\gamma$ 是 $\\gamma_{v,cw}$ 在 $(a,b)$ 上的限制，由 (18.8.5) 可知 $\\gamma$ 的像位于 $\\mathcal{S}^2$\
  \ 与由 $v$ 和 $w$ 张成的 $\\mathbb{R}^3_0$ 子空间的交集中。因此，$\\gamma$ 的像是大圆的全部或一部分。更一般地，$\\\
  mathcal{S}^2$ 中以给定起点为起点的最大测地线是通过该点的大圆。\n\n## 18.9 径向测地线和指数映射\n\n设 $(M,\\nabla)$\
  \ 为带联络的光滑流形，设 $p$ 为 $M$ 中的点，且设 $T_p(M)$ 具有标准光滑结构。设 $\\mathcal{E}_p$ 为 $T_p(M)$ 中使\
  \ $\\gamma_{p,v}(1)$ 有定义的向量 $v$ 的集合；即 $1$ 在 $\\gamma_{p,v}$ 的定义域中，其中 $\\gamma_{p,v}$\
  \ 为起点为 $p$ 且初始速度为 $v$ 的最大测地线。\n\n## 定理 18.9.1. 在上述设定下：\n\n- (a) $\\mathcal{E}_p$\
  \ 在 $T_p(M)$ 中是开集。\n- (b) $\\mathcal{E}_p$ 关于 $T_p(M)$ 中的零向量是星形的。\n\n\n\n\n\n(c)\
  \ 若 $v$ 是 $\\mathcal{E}_p$ 中的向量，则 $\\gamma_{p,v}$ 定义在 $[0,1]$ 上。\n\n**证明.** 我们仅考虑部分\
  \ (b) 和 (c)。\n\n(b)：设 $v$ 是 $T_p(M)$ 中的向量，且 $0<\\epsilon\\leq 1$。若 $\\gamma_{p,v}$\
  \ 的定义域为 $(a,b)$，则由定理 18.8.6，$\\gamma_{p,\\epsilon v}$ 的定义域为 $(a/\\epsilon,b/\\epsilon)$，它包含\
  \ $(a,b)$。由此可知若 $\\gamma_{p,v}(1)$ 有定义，则 $\\gamma_{p,\\epsilon v}(1)$ 也有定义；即若 $v$\
  \ 在 $\\mathcal{E}_p$ 中，则 $\\epsilon v$ 也在其中。\n\n(c)：由部分 (b) 可知 $\\gamma_{p,tv}(1)$\
  \ 对所有 $t$ 在 $[0,1]$ 中都有定义，且由定理 18.8.6 可知 $\\gamma_{p,v}(t)=\\gamma_{p,tv}(1)$。结论得证。\n\
  \n在上述设定下继续，设 $v$ 是 $\\mathcal{E}_p$ 中的向量。利用定理 18.9.1(c)，我们将 $\\gamma_{p,v}$ 限制到\
  \ $[0,1]$ 并得到测地线\n\n$\\rho_{p,v}(t)=\\gamma_{p,v}|_{[0,1]}:[0,1]\\longrightarrow\
  \ M,$  \\hfill (18.9.1)\n\n称为以 $p$ 为起点、以 $v$ 为初速度的**径向测地线**。由定理 18.8.2(a) 可知 $\\\
  rho_{p,v}(0)=p$。改变 $v$，我们得到以 $p$ 为起点的径向测地线族。\n\n## 例 18.9.2 (Pln 和 $S^2$)。设 $p$\
  \ 是 Pln 中的点。由例 18.8.8 可知，以 $p$ 为起点的径向测地线是 Pln 中从 $p$ 辐射出的线段。由此可知 $\\mathcal{E}_p=T_p(\\\
  mathrm{Pln})$。设 $q$ 是 Pln 中的另一点。由底层的欧几里得几何可知，存在唯一的径向测地线从 $p$ 开始并结束于 $q$。\n\n现在设\
  \ $p$ 是 $S^2$ 中的点。由例 18.8.10 可知，以 $p$ 为起点的径向测地线是 $S^2$ 上从 $p$ 发出的大圆的部分（或全部）。由此可知\
  \ $\\mathcal{E}_p=T_p(S^2)$。设 $q$ 是 $S^2$ 中的另一点。存在唯一的大圆经过 $p$ 和 $q$，它由 $S^2$ 与经过\
  \ $p$、$q$ 和 $(0,0,0)$ 的平面相交得到。这给出了两条从 $p$ 开始并结束于 $q$ 的径向测地线。\n\n在本节余下部分，我们致力于获得一个条件，以确保径向测地线的唯一性条件。\n\
  \n设 $(M,\\nabla)$ 是一个带有联络的光滑 $m$ 流形，设 $p$ 是 $M$ 中的点。**在 $p$ 处的指数映射**是光滑映射\n\n$\\\
  exp_p:\\mathcal{E}_p\\longrightarrow M$\n\n定义为\n\n$\\exp_p(v)=\\gamma_{p,v}(1)$\
  \  \\hfill (18.9.2)\n\n对所有 $\\mathcal{E}_p$ 中的向量 $v$。\n\n## 定理 18.9.3。设 $(M,\\nabla)$\
  \ 是带有联络的光滑流形，设 $p$ 是 $M$ 中的点，设 $v$ 是 $\\mathcal{E}_p$ 中的向量。设 $\\gamma_{p,v}(t):(a,b)\\\
  to M$ 是以 $p$ 为起点、以 $v$ 为初速度的最大测地线，设 $\\rho_{p,v}(t):[0,1]\\to M$ 是以 $p$ 为起点、以 $v$\
  \ 为初速度的径向测地线。则\n\n$\\gamma_{p,v}(t)=\\exp_p(tv)\\qquad\\text{for all }t\\text{ in\
  \ }(a,b)$\n\n且\n\n$\\rho_{p,v}(t)=\\exp_p(tv)\\qquad\\text{for all }t\\text{ in\
  \ }[0,1].$  \\hfill (18.9.3)\n\n证明。我们有\n\nt is in (a,b)\n⇔ γ_{p,v}(t) is defined\n\
  ⇔ γ_{p,tv}(1) is defined      [Th 18.8.6]\n⇔ exp_p(tv) is defined.      [(18.9.2)]\n\
  \n因此，当 $\\gamma_{p,v}(t)$、$\\gamma_{p,tv}(1)$ 或 $\\exp_p(tv)$ 中的任一个有定义时，它们都已定义，此时等式成立：\n\
  \nγ_{p,v}(t) = γ_{p,tv}(1) = exp_p(tv).\n\n这证明了第一个等式。第二个等式由 (18.9.1) 得出。\n\n粗略地说，定理\
  \ 18.9.3 表明指数函数将通过切空间中零向量的直线（或直线部分）映射到通过该点的光滑流形中的测地线。见图 18.9.1。\n\n![](img/d712710a8eb78c0959204afd5dde4c91_519_0.png)\n\
  \n# 图 18.9.1. 指数映射\n\n由定理 14.8.4 和定理 18.9.1(a)，ℰ_p 是 $T_p(M)$ 的开 $m$ 子流形，且由定理 14.3.3(b)，我们有对每个\
  \ $\\mathcal{E}_p$ 中的向量 $v$ 的等同 $T_v(\\mathcal{E}_p) = T_v(T_p(M))$。因此 $\\exp_p\
  \ : \\mathcal{E}_p ⟶ M$ 在 $v$ 处的微分映射可以表示为\n\nd_v(exp_p) : T_v(T_p(M)) ⟶ T_{exp_p(v)}(M).\
  \      (18.9.4)\n\n见图 18.9.2，且为上下文，也见图 11.6.1。设 $w$ 是 $T_p(M)$ 中的向量，并考虑光滑曲线 μ_v(t)\
  \ : (−ε, ε) ⟶ T_p(M) 定义为 μ_v(t) = v + t w。根据 (14.7.4)，(dμ_v/dt)(t) 是 $T_{μ_v(t)}(T_p(M))$\
  \ 中的向量。在文献中，(dμ_v/dt)(0) 有时记为 w_v。因此，w_v 是 $T_v(T_p(M))$ 中的向量，且由 (18.9.4) 可知 d_v(exp_p)(w_v)\
  \ 是 $T_{exp_p(v)}(M)$ 中的向量。在几何上，我们可以将 $T_v(T_p(M))$ 视为 $T_p(M)$ 平移到 $v$，w_v 是 $w$\
  \ 的相应平移。有时方便将 w_v 仅记为 w 并允许底层的平移被理解。作为进一步简化，当 v = 0 时，我们利用 (14.3.4) 将 $T_0(T_p(M))$\
  \ 与 $T_p(M)$ 等同，并写\n\nT_0(T_p(M)) = T_p(M).\n\n由于 exp_p(0) = p，我们由 (18.9.4) 可知对\
  \ v = 0 微分映射可表示为\n\nd₀(exp_p) : T_p(M) ⟶ T_p(M).\n\n![](img/d712710a8eb78c0959204afd5dde4c91_520_0.png)\n\
  \n# 图 18.9.2. 指数映射的微分映射\n\n## 定理 18.9.4。若 $(M, ∇)$ 是带有联络的光滑流形且 $p$ 是 $M$ 中的点，则 d₀(exp_p)\
  \ 是 $T_p(M)$ 上的恒等映射。\n\n证明。设 $v$ 是 $T_p(M)$ 中的向量，设 γ_{p,v}(t) : (a, b) ⟶ M 是以 $p$\
  \ 为起点、以 $v$ 为初速度的最大测地线。考虑光滑曲线 λ(t) : (a, b) ⟶ E_p 定义为 λ(t) = t v。由定理 18.9.3，γ_{p,v}\
  \ = exp_p ∘ λ。由于 λ(0) = 0 且 (dλ/dt)(0) = v，我们由定理 14.7.4(a) 和定理 18.8.2(b) 可知\n\n\
  d₀(exp_p)(v) = d/dt (exp_p ∘ λ)(0) = dγ_{p,v}/dt (0) = v.\n\n设 $(M, ∇)$ 是带有联络的光滑流形，设\
  \ $p$ 是 $M$ 中的点。我们称 $M$ 中 $p$ 的邻域 $V$ 为正规的，如果存在零向量在 $T_p(M)$ 中的星形邻域 $\\tilde{V}\
  \ ⊆ E_p$ 使得 $\\exp_p|_{\\tilde{V}} : \\tilde{V} ⟶ V$ 是微分同胚。为简洁起见，我们经常记\n\nexp_p|_{\\\
  tilde{V}} : \\tilde{V} ⟶ V   by   exp_p : \\tilde{V} ⟶ V.\n\n## 定理 18.9.5 (正规邻域的存在性)。带有联络的光滑流形中的每一点都有一个正规邻域。\n\
  \n**证明。** 设 $(M,\\nabla)$ 是带有联络的光滑流形，设 $p$ 是 $M$ 中的点。由定理 14.6.2 和定理 18.9.4，存在 $T_p(M)$\
  \ 中零向量的邻域 $\\widetilde{W}\\subset\\mathcal{E}_p$ 和 $M$ 中 $p$ 的邻域 $W$ 使得 $\\exp_p|_{\\\
  widetilde{W}}:\\widetilde{W}\\longrightarrow W$ 是微分同胚。假设 $T_p(M)$ 具有标准光滑结构，并设 $(T_p(M),A)$\
  \ 是 $T_p(M)$ 上的（覆盖）坐标图，其中 $A:T_p(M)\\longrightarrow\\mathbb{R}^m$ 是任意线性同构。由定理 9.1.14，$A(\\\
  widetilde{W})$ 是 $\\mathbb{R}^m$ 中的开集。设 $B\\subset A(\\widetilde{W})$ 是 $\\mathbb{R}^m$\
  \ 中以 $(0,\\ldots,0)$ 为中心的开球，并注意到 $B$ 关于 $(0,\\ldots,0)$ 是星形的。设 $v$ 是 $A^{-1}(B)$\
  \ 中的向量。则 $A(tv)=tA(v)$ 对所有 $t$ 在 $[0,1]$ 中都在 $B$ 中，故 $tv$ 对所有 $t$ 在 $[0,1]$ 中都在\
  \ $A^{-1}(B)$ 中。因此，$A^{-1}(B)\\subset\\mathcal{E}_p$ 关于 $T_p(M)$ 中的零向量是星形的。设 $\\\
  widetilde{V}=A^{-1}(B)$，我们发现 $V=\\exp_p(A^{-1}(B))$ 是 $M$ 中 $p$ 的正规邻域。\n\n如我们现在所示，正规邻域上的径向测地线具有唯一性性质。\n\
  \n## 定理 18.9.6 (径向测地线的唯一性)。\n\n设 $(M,\\nabla)$ 是带有联络的光滑流形，设 $p$ 是 $M$ 中的点，设 $V$\
  \ 是 $M$ 中 $p$ 的正规邻域，设 $\\exp_p:\\widetilde{V}\\longrightarrow V$ 是相应的微分同胚。设 $q$\
  \ 是 $V$ 中的点，设 $v=\\exp_p^{-1}(q)$，设 $\\rho_{p,v}:[0,1]\\longrightarrow M$ 是以 $p$\
  \ 为起点、以 $v$ 为初速度的径向测地线。则 $\\rho_{p,v}$ 是满足 $\\rho_{p,v}(0)=p$、$\\rho_{p,v}(1)=q$\
  \ 且 $\\rho_{p,v}([0,1])\\subset V$ 的唯一径向测地线。\n\n**注。** 由于 $q$ 在 $V$ 中且 $\\exp_p^{-1}(V)=\\\
  widetilde{V}\\subset\\mathcal{E}_p$，我们看到 $v$ 在 $\\mathcal{E}_p$ 中，故 $\\rho_{p,v}$\
  \ 有定义，所以断言有意义。\n\n**证明。** 如 (18.9.1) 所述，$\\rho_{p,v}(0)=p$，且由 (18.9.3) 可知 $\\rho_{p,v}(1)=\\\
  exp_p(v)=q$。由假设，$\\widetilde{V}$ 关于 $T_p(M)$ 中的零向量是星形的且 $\\exp_p(\\widetilde{V})=V$，所以由\
  \ (18.9.3) 亦可知 $\\rho_{p,v}(t)$ 对所有 $t$ 在 $[0,1]$ 中都在 $V$ 中。因此，$\\rho_{p,v}$ 满足三个指定的性质。为证明唯一性，设\
  \ $\\rho_{r,w}$ 是另一条满足这些性质的径向测地线；即 (i) $\\rho_{r,w}(0)=p$，(ii) $\\rho_{r,w}(1)=q$，且\
  \ (iii) $\\rho_{r,w}([0,1])\\subset V$。我们需要证明 $r=p$ 且 $v=w$。由定理 18.8.2(a)、(18.9.1)\
  \ 和 (i) 可知 $r=\\rho_{r,w}(0)=p$。由 $r=p$ 和 (iii) 可知 $\\rho_{p,w}(t)\\in V$，故 $\\\
  rho_{p,w}$ 有定义，然后由 (18.9.3) 可知 $\\rho_{p,w}(1)=\\exp_p(w)$。然后由 (18.9.3)、$r=p$ 和\
  \ (ii) 得\n\n$$\\exp_p(v)=\\rho_{p,v}(1)=q=\\rho_{p,w}(1)=\\rho_{p,w}(1)=\\exp_p(w).$$\n\
  \n由于 $\\exp_p|_{\\widetilde{V}}$ 是微分同胚，$v=w$。因此，$\\rho_{r,w}=\\rho_{p,v}$。\n\n##\
  \ 例 18.9.7 (Pln 和 $S^2$)。\n\n我们继续例 18.9.2。显然 $\\mathrm{Pln}$ 是其任意点的正规邻域。然而 $S^2$\
  \ 不是，因为 $S^2$ 与欧几里得平面中的开集不同胚（更不用说微分同胚）。然而 $S^2$ 的适当子集，如一个半球，是其任意点的正规邻域。\n\n\n\n\n\
  \n## 18.10 正则坐标\n\n设 $(M,\\nabla)$ 为带有联络的光滑 $m$-流形，$p$ 为 $M$ 中的一点，$(\\widetilde{e}_1,\\\
  dots,\\widetilde{e}_m)$ 为 $T_p(M)$ 的一个基。映射\n\n$\\ell_p : \\mathbb{R}^m \\longrightarrow\
  \ T_p(M)$\n\n定义为\n\n$\\ell_p(r^1,\\dots,r^m)=\\sum_i r^i\\widetilde{e}_i \\qquad\
  \ (18.10.1)$\n\n是线性同构。设 $V$ 为 $p$ 在 $M$ 中的一个正规邻域，$\\exp_p : \\widetilde{V} \\longrightarrow\
  \ V$ 为相应的微分同胚，并考虑光滑映射\n\n$\\ell_p^{-1}\\circ\\exp_p^{-1} : V \\longrightarrow \\\
  ell_p^{-1}(\\widetilde{V})$\n\n则\n\n$(V,\\ell_p^{-1}\\circ\\exp_p^{-1}=(x^1,\\dots,x^m))\
  \ \\qquad (18.10.2)$\n\n是在 $p$ 处的坐标系，称为 $p$ 处的**正规坐标**。设 $\\mathcal{X}_p=((\\partial/\\\
  partial x^1)|_p,\\dots,(\\partial/\\partial x^m)|_p)$ 和 $(d_p(x^1),\\dots,d_p(x^m))$\
  \ 为 $p$ 处相应的坐标基和对偶坐标基。\n\n### 定理 18.10.1. 在上述设定下：\n\n(a)\n\n$\\widetilde{e}_i =\
  \ \\left.\\frac{\\partial}{\\partial x^i}\\right|_p$\n\n对 $i=1,\\dots,m$。\n\n(b)\n\
  \n$x^i\\circ\\exp_p = d_p(x^i)$\n\n对 $i=1,\\dots,m$。\n\n(c)\n\n$\\exp_p^{-1}(q)=\\\
  sum_i x^i(q)\\left.\\frac{\\partial}{\\partial x^i}\\right|_p$\n\n对所有 $q$ 在 $V$\
  \ 中。\n\n证明. (a): 设 $\\mathcal{E}=(e_1,\\dots,e_m)$ 为 $\\mathbb{R}^m$ 的标准基，并设 $\\\
  varphi=\\ell_p^{-1}\\circ\\exp_p^{-1}$。我们有\n\n$d_{\\varphi(p)}(\\varphi^{-1})=d_{\\\
  varphi(p)}(\\exp_p\\circ\\ell_p)=d_{\\ell_p(\\varphi(p))}(\\exp_p)\\circ d_{\\varphi(p)}(\\\
  ell_p)\\quad[\\text{Th 14.4.5}] =d_0(\\exp_p\\circ\\ell_p)\\quad[\\text{Th 14.4.4}]=\\\
  ell_p.\\quad[\\text{Th 18.9.4}]$\n\n则定理 14.8.5(d) 和 (18.10.1) 给出\n\n$\\left.\\frac{\\\
  partial}{\\partial x^i}\\right|_p = \\ell_p(e_i)=\\widetilde{e}_i.$\n\n对 i, j =\
  \ 1, ..., m。注意 $\\Gamma^k_{ij}(p)$ 与 $(r^1, ..., r^m)$ 的选取无关。令\n\n```\n(r^1, ...,\
  \ r^i, ..., r^m) = (0, ..., 1, ..., 0)\n```\n\n得到\n\n```\nΓ^k_ii(p) = 0    (18.10.4)\n\
  ```\n\n对 $i = 1, ..., m$；并令\n\n```\n(r^1, ..., r^i, ..., r^j, ..., r^m) = (0, ...,\
  \ 1, ..., 1, ..., 0)\n```\n\n得到\n\n```\n0 = Γ^k_ii(p) + Γ^k_ij(p) + Γ^k_ji(p) +\
  \ Γ^k_jj(p) = 2Γ^k_ij(p)\n```\n\n对 $i \\neq j = 1, ..., m$，其中最后的等式由定理 18.6.3(b)\
  \ 和 (18.10.4) 推出。\n\n## 18.11 Jacobi 场\n\n从直观上看，似乎测地线从光滑流形上给定点辐射的方式，以及它们扩散的快慢，应该与该点处光滑流形的“曲率”有关。这一推理线索导致了对\
  \ Jacobi 场的考虑。\n\n设 $(M, \\nabla)$ 为带有联络的光滑流形，并设 $\\gamma(r) : (a, b) \\longrightarrow\
  \ M$ 为一条测地线。我们说向量场 $J$ 在 $\\mathfrak{X}_M(\\gamma)$ 中是 Jacobi 场，如果它满足 Jacobi 方程：\n\
  \n```\nR(J, dγ/dr) dγ/dr + ∇²J/dr² = 0,    (18.11.1)\n```\n\n其中我们记\n\n```\n∇/dr\
  \ ∘ ∇/dr  by  ∇²/dr².\n```\n\n由定理 18.7.1(a)，Jacobi 方程等价于\n\n```\nR(dγ/dr, J) dγ/dr\
  \ = ∇²J/dr².\n```\n\n### 定理 18.11.1 (Jacobi 场的存在性)。设 $(M, \\nabla)$ 为带有联络的光滑流形，$p$\
  \ 为 $M$ 中的一点。设 $\\gamma(r) : (a, b) \\longrightarrow M$ 为一条测地线，且 $\\gamma(0) = p$，并设\
  \ $v, w$ 为 $T_p(M)$ 中的向量。则存在唯一的 Jacobi 场 $J$ 在 $\\mathfrak{X}_M(\\gamma)$ 中使得 $J(0)\
  \ = v$ 且 $(\\nabla J/\\partial r)(0) = w$。\n\n证明. 可以证明 Jacobi 方程等价于常微分方程组。结果现在由微分方程理论得出。\n\
  \n设 $(M, \\nabla)$ 为带有联络的光滑流形，并设\n\n$\\sigma(r,s): (a,b) \\times (-\\varepsilon,\\\
  varepsilon) \\longrightarrow M$\n\n为一个参数化曲面。回顾第 14.9 节，对于 $(-\\varepsilon,\\varepsilon)$\
  \ 中的给定点 $s$，相应的经线曲线 $\\sigma_s(r): (a,b) \\longrightarrow M$ 定义为 $\\sigma_s(r) =\
  \ \\sigma(r,s)$。设 $\\gamma(r): (a,b) \\longrightarrow M$ 为一条测地线。我们说 $\\sigma$ 是\
  \ $\\gamma$ 的**测地线变分**，如果 $\\sigma_0 = \\gamma$ 且每个 $\\sigma_s$ 都是测地线。\n\n假设 $\\\
  sigma$ 确实是 $\\gamma$ 的测地线变分。则\n\n$\\frac{d\\gamma}{dr}(r) = \\frac{\\partial \\\
  sigma}{\\partial r}(r,0)$\n\n(18.11.2)\n\n对所有 $r$ 在 $(a,b)$ 中。$\\sigma$ 的**变分场**是向量场\
  \ $J$ 在 $\\mathfrak{X}_M(\\gamma)$ 中定义为\n\n$J(r) = \\frac{\\partial \\sigma}{\\\
  partial s}(r,0)$\n\n(18.11.3)\n\n对所有 $r$ 在 $(a,b)$ 中。由于 $\\sigma_s$ 是测地线且 $\\partial\
  \ \\sigma / \\partial r$ 是其速度，我们有\n\n$\\frac{\\nabla}{\\partial r}\\left(\\frac{\\\
  partial \\sigma}{\\partial r}\\right)(r,s) = 0$\n\n(18.11.4)\n\n对所有 $(r,s)$ 在 $(a,b)\
  \ \\times (-\\varepsilon,\\varepsilon)$ 中。见图 18.11.1。\n\n![](img/d712710a8eb78c0959204afd5dde4c91_525_0.png)\n\
  \n**图 18.11.1. 测地线变分**\n\n### 例 18.11.2 ($\\mathcal{S}^2$)。在第 13.4 节的记号下，考虑参数化曲面\n\
  \n$\\varphi(\\theta,\\phi): (0,\\pi) \\times (-\\pi,\\pi) \\longrightarrow \\mathcal{S}^2$\n\
  \n给定为\n\n$\\varphi(\\theta,\\phi)=(\\sin(\\theta)\\cos(\\phi),\\sin(\\theta)\\sin(\\\
  phi),\\cos(\\theta)).$\n\n光滑曲线\n\n$\\gamma(\\theta)=\\varphi(\\theta,0)=(\\sin(\\\
  theta),0,\\cos(\\theta)):(0,\\pi)\\longrightarrow S^2$\n\n的像是原点为中心的 $xz$-平面内的单位圆的一部分，这是\
  \ $S^2$ 的一个大圆。由例 18.8.10 可知 $\\gamma$ 是测地线。因此，$\\varphi$ 是 $\\gamma$ 的测地线变分。\n\n\
  ### 定理 18.11.3.\n\n如果 $(M,\\nabla)$ 是带有对称联络的光滑流形且 $\\gamma$ 是测地线，则任意测地线变分的变分场是 $\\\
  mathcal{X}_M(\\gamma)$ 中的 Jacobi 场。\n\n*证明.* 设 $\\sigma(r,s):(a,b)\\times(-\\varepsilon,\\\
  varepsilon)\\longrightarrow M$ 为 $\\gamma$ 的测地线变分，并设 $J$ 为其变分场。则\n\n```\n$$\\begin{aligned}\n\
  0&=\\frac{\\nabla}{\\partial s}\\left(\\frac{\\nabla}{\\partial r}\\left(\\frac{\\\
  partial\\sigma}{\\partial r}\\right)\\right)\\\\\n&=\\frac{\\nabla}{\\partial r}\\\
  left(\\frac{\\nabla}{\\partial s}\\left(\\frac{\\partial\\sigma}{\\partial r}\\\
  right)\\right)+R\\left(\\frac{\\partial\\sigma}{\\partial s},\\frac{\\partial\\\
  sigma}{\\partial r}\\right)\\frac{\\partial\\sigma}{\\partial r}\\\\\n&=\\frac{\\\
  nabla}{\\partial r}\\left(\\frac{\\nabla}{\\partial r}\\left(\\frac{\\partial\\\
  sigma}{\\partial s}\\right)\\right)+R\\left(\\frac{\\partial\\sigma}{\\partial s},\\\
  frac{\\partial\\sigma}{\\partial r}\\right)\\frac{\\partial\\sigma}{\\partial r}\\\
  \\\n&=\\frac{\\nabla^2}{\\partial r^2}\\left(\\frac{\\partial\\sigma}{\\partial\
  \ s}\\right)+R\\left(\\frac{\\partial\\sigma}{\\partial s},\\frac{\\partial\\sigma}{\\\
  partial r}\\right)\\frac{\\partial\\sigma}{\\partial r}.\n\\end{aligned}$$\n```\n\
  \n令 $s=0$ 并利用 (18.11.2) 和 (18.11.3) 得到 (18.11.1)。\n\n### 定理 18.11.4.\n\n设 $(M,\\\
  nabla)$ 为带有联络的光滑流形，$p$ 为 $M$ 中的一点，并设 $\\psi(s):(-\\varepsilon,\\varepsilon)\\longrightarrow\
  \ T_p(M)$ 为光滑曲线。考虑参数化曲面 $\\sigma(r,s):[0,1]\\times(-\\varepsilon,\\varepsilon)\\\
  longrightarrow M$ 给定为\n\n$$\\sigma(r,s)=\\exp_p(r\\psi(s)),$$\n\n其中假设 $r\\psi(s)$\
  \ 对所有 $(r,s)$ 在 $[0,1]\\times(-\\varepsilon,\\varepsilon)$ 中属于 $\\mathcal{E}_p$。则：\n\
  \n- (a) 对 $(-\\varepsilon,\\varepsilon)$ 中的每个点 $s$，$\\sigma_s$ 是以 $p$ 为起点、初速度为 $\\\
  psi(s)$ 的径向测地线 $\\rho_{p,\\psi(s)}$。\n- (b) $\\sigma$ 是 $\\sigma_0$ 的测地线变分。\n- (c)\
  \ $$\\frac{\\partial\\sigma}{\\partial r}(r,s)=d_{r\\psi(s)}(\\exp_p)(\\psi(s)).$$\n\
  - (d) $$\\frac{\\partial\\sigma}{\\partial s}(r,s)=r\\,d_{r\\psi(s)}(\\exp_p)\\\
  left(\\frac{d\\psi}{ds}(s)\\right).$$\n\n**证明.** (a): 由定理 18.9.3，\n\n\\[\n\\sigma_s(r)=\\\
  sigma(r,s)=\\exp_p(r\\psi(s))=\\rho_{p,\\psi(s)}(r)\n\\]\n\n对所有 \\(r\\) 在 \\([0,1]\\\
  ) 中。\n\n(b): 这由 (a) 部分得出。\n\n(c), (d): 我们定义光滑映射\n\n\\[\n\\widetilde{\\sigma}(r,s):[0,1]\\\
  times(-\\varepsilon,\\varepsilon)\\longrightarrow T_p(M)\n\\]\n\n为\n\n\\[\n\\widetilde{\\\
  sigma}(r,s)=r\\psi(s),\n\\]\n\n使得 $\\sigma=\\exp_p\\circ\\widetilde{\\sigma}$。则\n\
  \n\\[\n\\frac{\\partial\\widetilde{\\sigma}}{\\partial r}(r,s)=\\psi(s)\n\\qquad\\\
  text{and}\\qquad\n\\frac{\\partial\\widetilde{\\sigma}}{\\partial s}(r,s)=r\\frac{d\\\
  psi}{ds}(s).\n\\]\n\n故\n\n\\[\n\\frac{\\partial\\sigma}{\\partial r}(r,s)\n=\\frac{\\\
  partial(\\exp_p\\circ\\widetilde{\\sigma})}{\\partial r}(r,s)\n=d_{\\sigma(r,s)}(\\\
  exp_p)\\left(\\frac{\\partial\\widetilde{\\sigma}}{\\partial r}(r,s)\\right)\n=d_{r\\\
  psi(s)}(\\exp_p)(\\psi(s)).\n\\]\n\n类似地，\n\n\\[\n\\frac{\\partial\\sigma}{\\partial\
  \ s}(r,s)\n=\\frac{\\partial(\\exp_p\\circ\\widetilde{\\sigma})}{\\partial s}(r,s)\n\
  =d_{\\sigma(r,s)}(\\exp_p)\\left(\\frac{\\partial\\widetilde{\\sigma}}{\\partial\
  \ s}(r,s)\\right)\n=d_{r\\psi(s)}(\\exp_p)\\left(r\\frac{d\\psi}{ds}(s)\\right)\n\
  =r\\,d_{r\\psi(s)}(\\exp_p)\\left(\\frac{d\\psi}{ds}(s)\\right).\n\\]\n\n### 定理\
  \ 18.11.5.\n\n*设 $(M,\\nabla)$ 为带有联络的光滑流形，$p$ 为 $M$ 中的一点，并设 $v,w$ 为 $T_p(M)$ 中的向量。设\
  \ $\\rho_{p,v}(r)=\\exp_p(rv):[0,1]\\to M$ 为以 $p$ 为起点、初速度为 $v$ 的径向测地线。设 $\\sigma(r,s):[0,1]\\\
  times(-\\varepsilon,\\varepsilon)\\to M$ 为 $\\rho_{p,v}(r)$ 的测地线变分，定义为*\n\n\\[\n\
  \\sigma(r,s)=\\exp_p(r(v+sw)),\n\\]\n\n*其中假设 $r(v+sw)$ 对所有 $(r,s)\\in[0,1]\\times(-\\\
  varepsilon,\\varepsilon)$ 属于 $E_p$。则：*\n\n(a) *变分场 $J$ 的 $\\sigma$ 给出为*\n\n\\[\n\
  J(r)=r\\,d_{rv}(\\exp_p)(w)\n\\]\n\n*对所有 $r$ 在 $[0,1]$ 中。*\n\n\n\n\n\n(b) 若 ∇ 是对称的，则\
  \ J 是 \U0001D51B_M(ρ_{p,v}) 中唯一的 Jacobi 场，使得 J(0) = 0 且 (∇J/dr)(0) = w。\n\n注。ρ_{p,v}(r)\
  \ = exp_p(rv) 由定理 18.9.3 可得。由定理 18.11.4(b)，σ 是 ρ_{p,v} 的测地线变分。我们由 (18.9.4) 可知 exp_p\
  \ : ℰ_p ⟶ M 在 rv 处的微分映射为\n\nd_{rv}(exp_p) : T_{rv}(T_p(M)) ⟶ T_{exp_p(rv)}(M)。\n\
  \n在部分 (a) 中更精确的写法是 J(r) = r d_{rv}(exp_p)(w_{rv})。将部分 (a) 如上所述表述相当于作了等同 T_{rv}(T_p(M))\
  \ = T_p(M)。\n\n证明。 (a)：在定理 18.11.4(d) 中令 ψ(s) = v + sw 得\n\n∂σ/∂s (r, s) = r d_{r(v+sw)}(exp_p)(w)。\n\
  \n在前述恒等式中令 s = 0 并利用 (18.11.3) 即得结果。\n\n(b)：由于 ∇ 是对称的，由定理 18.11.3 和部分 (a) 可知 J 是\
  \ \U0001D51B_M(ρ_{p,v}) 中的 Jacobi 场。由部分 (a) 中的恒等式可得 J(0) = 0 且\n\n∇J/dr (r) = d_{rv}(exp_p)(w)\
  \ + r ∇/dr (d_{rv}(exp_p)(w))。\n\n由定理 18.9.4，d_0(exp_p) 是恒等微分同胚。在前述恒等式中令 r = 0 得\
  \ (∇J/dr)(0) = w。J 的唯一性性质现在由定理 18.11.1 可得。\n\n## 例 18.11.6。设 (M, ∇) 为带联络的光滑流形，γ(r)\
  \ : [0,1] ⟶ M 为 (径向) 测地线。考虑 \U0001D51B_M(γ) 中定义的向量场 J 和 K\n\nJ(r) = dγ/dr (r)  \
  \    且      K(r) = r dγ/dr (r)。\n\n我们有\n\n∇/dr (dγ/dr) = 0      且      R∘γ (dγ/dr,\
  \ dγ/dr) dγ/dr = 0，\n\n其中第二个恒等式由定理 18.7.1(a) 可得。现在容易证明 J 和 K 都是 Jacobi 场。\n"
- "## 第 19 章\n\n## 半黎曼流形\n\n回顾关于光滑流形和带联络的光滑流形所呈现的材料，我们看到许多由我们对正则曲面和 ℝ³ 中正则曲面的研究所激励的概念和结果已被恢复——但并非全部。最近的工作中缺少的是对“长度”和“面积”的任何讨论。为弥补这一不足，有必要为光滑流形赋予额外的结构，这就涉及半黎曼流形的考虑。\n\
  \n### 19.1  半黎曼流形\n\n以下材料基于第 12.2 节中的讨论部分。设 M 为光滑 m-流形，设 \U0001D524 为 \U0001D4AF\
  ⁰₂(M) 中的对称张量场，使得对所有 p ∈ M，\U0001D524_p 是 \U0001D4AF⁰₂(T_p(M)) 中的对称张量。我们称 \U0001D524\
  \ 为 M 上的度量，如果：\n\n+   [G1] 对所有 p ∈ M，\U0001D524_p 在 T_p(M) 上非退化。  \n+   [G2] ind(\U0001D524\
  _p) 与 p ∈ M 无关。\n\n当 [G1] 成立时，对所有 p ∈ M，\U0001D524_p 是 T_p(M) 上的标量积；或等价地，对所有 p ∈\
  \ M，(T_p(M),\U0001D524_p) 是标量积空间。\n\n设 \U0001D524 确实为度量。在这种情况下，称对 (M,\U0001D524\
  ) 为半黎曼 m-流形。我们将 \U0001D524_p 的那些与 p 无关的性质归于 \U0001D524。因此，\U0001D524 被称为双线性的、对称的、非退化的，等等。ind(\U0001D524\
  _p) 的共同值记为 ν 并称为 \U0001D524 的指标或 M 的指标。\U0001D524_p 的共同符号记为 (ε₁,…,ε_m) 并称为 \U0001D524\
  \ 的符号或 M 的符号。为简便起见，我们通常记\n\n$$\\mathbf{g}_p(\\cdot,\\cdot) \\quad\\text{by}\\quad\
  \ \\langle\\cdot,\\cdot\\rangle.$$\n\n当 ν = 0 时，我们称 M 为黎曼 m-流形，而当 m ≥ 2 且 ν = 1\
  \ 时，M 称为洛伦兹 m-流形。带联络的半黎曼 m-流形是一个三元组 (M, \U0001D524, ∇)，其中 (M, \U0001D524) 是半黎曼 m-流形且\
  \ ∇ 是 M 上的联络。暂时我们不假设 \U0001D524 和 ∇ 相关。\n\n我们已经遇到过若干半黎曼流形，尽管当时我们还不能使用此类术语。例如，半欧几里得\
  \ (m, ν)-空间 ℝᵥᵐ = (ℝᵐ, \U0001D530) 是指标为 ν 的半黎曼 m-流形。特别地，欧几里得 m-空间 ℝ₀ᵐ = (ℝᵐ, \U0001D522\
  ) 是黎曼 m-流形，而闵可夫斯基 m-空间 ℝ₁ᵐ = (ℝᵐ, \U0001D52A) 是洛伦兹 m-流形。有了张量记号，我们现在可以在局部坐标下将 \U0001D530\
  \ 表示为\n\n```\n\U0001D530 = { Σᵢ=1ᵐ d(xⁱ) ⊗ d(xⁱ)                     if ν = 0\n\
  \       Σᵢ=1ᵐ⁻ᵛ d(xⁱ) ⊗ d(xⁱ) − Σᵢ=m−ν+1ᵐ d(xⁱ) ⊗ d(xⁱ)   if 1 ≤ ν ≤ m − 1\n   \
  \   − Σᵢ=1ᵐ d(xⁱ) ⊗ d(xⁱ)                     if ν = m. }\n```\n\n在我们的半黎曼流形列表中，让我们加上单位球面\
  \ \U0001D4E2² 和双曲空间 ℋ²，它们是黎曼 2-流形，以及伪球面 \U0001D4AB²，它是洛伦兹 2-流形。事实上，第 13.1–13.8 节中描述的\
  \ ℝ₀³ 中的每个正则曲面都是黎曼 2-流形。我们现在给出一个不太明显的黎曼 2-流形的例子。\n\n## 例 19.1.1。\n\n设 ℙ² = {(r,\
  \ s) ∈ ℝ² : s > 0}，它是光滑 2-流形 ℝ² 中的开集。由定理 14.3.3(b)、(14.3.4) 和定理 14.8.4 可知 ℙ² 是 ℝ²\
  \ 的 2-子流形，且 T₍ᵣ,ₛ₎(ℙ²) 可与 ℝ² 识别。我们在 \U0001D4AF₂⁰(ℙ²) 中定义一个张量场 \U0001D52D 为\n\n\U0001D52D\
  ₍ᵣ,ₛ₎(v, w) = 1/s² ⟨v, w⟩\n\n对所有点 (r, s) ∈ ℙ² 和所有向量 v, w ∈ T₍ᵣ,ₛ₎(ℙ²)，其中 ⟨·,·⟩ 为欧几里得内积。容易证明对所有\
  \ (r, s) ∈ ℙ²，\U0001D52D₍ᵣ,ₛ₎ 是内积。因此，(ℙ², \U0001D52D) 是黎曼 2-流形，称为庞加莱半平面。◇\n\n##\
  \ 定理 19.1.2 (开集)。\n\n若 (M, \U0001D524) 是指标为 ν 的半黎曼 m-流形且 U 是 M 中的开集，则 (U, \U0001D524\
  |ᵤ) 是 (M, \U0001D524) 的指标为 ν 的半黎曼 m-子流形。\n\n证明。由定理 14.8.4，U 是 M 的 m-子流形。由定理 14.3.3(b)，我们有等同\
  \ Tₚ(U) = Tₚ(M) 对所有 p ∈ U 成立。由此可知 (\U0001D524|ᵤ)|ₚ 在 Tₚ(U) 上对所有 p ∈ U 非退化，且 ind((\U0001D524\
  |ᵤ)ₚ) = ind(\U0001D524ₚ) = ν 对所有 p ∈ U 成立。因此 \U0001D524|ᵤ 满足 [G1] 和 [G2]。□\n\n本节余下部分给出稍后会起作用的定义。\n\
  \n### 19.1  半黎曼流形\n\n设 $(M,g)$ 为半黎曼 $m$-流形，设 $X,Y$ 为 $\\mathfrak{X}(M)$ 中的向量场。我们称\
  \ $X$ 为 **单位向量场** 如果对所有 $p\\in M$，$X_p$ 为单位向量；并称 $X$ 和 $Y$ 为 **正交向量场** 如果对所有 $p\\\
  in M$，$X_p$ 和 $Y_p$ 正交。\n\n我们定义一个函数\n\n$$\\langle X,Y\\rangle:M\\longrightarrow\\\
  mathbb{R}$$\n\n在 $C^\\infty(M)$ 中，通过赋值\n\n$$p\\longmapsto\\langle X_p,Y_p\\rangle$$\n\
  \n对所有 $p\\in M$。类似地，对光滑曲线 $\\lambda:(a,b)\\longrightarrow M$ 和 $\\mathfrak{X}_M(\\\
  lambda)$ 中的向量场 $J,K$，我们定义一个函数\n\n$$\\langle J,K\\rangle:(a,b)\\longrightarrow\\\
  mathbb{R}$$\n\n在 $C^\\infty((a,b))$ 中，通过赋值\n\n$$t\\longmapsto\\langle J(t),K(t)\\\
  rangle$$\n\n对所有 $t\\in(a,b)$。\n\n设 $(U,(x^i))$ 为 $M$ 上的一个坐标图，设 $\\mathcal{X}=(\\\
  partial/\\partial x^1,\\ldots,\\partial/\\partial x^m)$ 为相应的坐标标架。我们在 $C^\\infty(U)$\
  \ 中定义函数 $g_{ij}$ 为\n\n$$g_{ij}(p)=\\left\\langle\\left.\\frac{\\partial}{\\partial\
  \ x^i}\\right|_p,\\left.\\frac{\\partial}{\\partial x^j}\\right|_p\\right\\rangle\
  \ \\tag{19.1.1}$$\n\n对所有 $p\\in U$，$i,j=1,\\ldots,m$。$g$ 关于 $\\mathcal{X}$ 的 **矩阵**\
  \ 记为 $g_{\\mathcal{X}}$ 并定义为\n\n$$g_{\\mathcal{X}}(p)=\\begin{bmatrix}g_{11}(p)&\\\
  cdots&g_{1m}(p)\\\\ \\vdots&\\ddots&\\vdots\\\\ g_{m1}(p)&\\cdots&g_{mm}(p)\\end{bmatrix}$$\n\
  \n对所有 $p\\in U$。回想第 3.1 节，$g_p$ 关于 $\\mathcal{X}_p$ 的矩阵为 $(g_p)_{\\mathcal{X}_p}=[g_{ij}(p)]$。因此就记号而言，\n\
  \n$$g_{\\mathcal{X}}(p)=(g_p)_{\\mathcal{X}_p}.$$\n\n$g$ 关于 $\\mathcal{X}$ 的 **逆矩阵**\
  \ 记为 $g_{\\mathcal{X}}^{-1}$ 并定义为\n\n$$g_{\\mathcal{X}}^{-1}(p)=g_{\\mathcal{X}}(p)^{-1}$$\n\
  \n对所有 $p\\in U$。通常用上标表示 $g_{\\mathcal{X}}^{-1}(p)$ 的条目：\n\n$$g_{\\mathcal{X}}^{-1}(p)=\\\
  begin{bmatrix}g_{11}(p)&\\cdots&g_{1m}(p)\\\\ \\vdots&\\ddots&\\vdots\\\\ g_{m1}(p)&\\\
  cdots&g_{mm}(p)\\end{bmatrix}^{-1}=\\begin{bmatrix}g^{11}(p)&\\cdots&g^{1m}(p)\\\
  \\ \\vdots&\\ddots&\\vdots\\\\ g^{m1}(p)&\\cdots&g^{mm}(p)\\end{bmatrix}.$$\n\n\
  赋值 $p\\longmapsto g^{ij}(p)$ 定义了 $C^\\infty(U)$ 中的函数 $g^{ij}$，$i,j=1,\\ldots,m$。由于\
  \ $[g_{ij}]$ 和 $[g^{ij}]$ 都是对称矩阵，函数 $g_{ij}$ 和 $g^{ij}$ 在 $i,j$ 上对称。\n\n\n\n\n\n\
  ## 定理 19.1.3.\n\n设 $(M,\\mathfrak{g})$ 是一个 $m$ 维半黎曼流形，设 $p$ 是 $M$ 中的一点，设 $(U,(x^i))$\
  \ 与 $(\\widetilde{U},(\\widetilde{x}^i))$ 是 $p$ 处的坐标卡，并设 $\\mathcal{X}_p$ 与 $\\\
  widetilde{\\mathcal{X}}_p$ 是 $p$ 处相应的坐标基。则\n\n$$\\mathfrak{g}_{\\widetilde{\\mathcal{X}}}(p)=\\\
  left(\\left[\\mathrm{id}_{T_p(M)}\\right]_{\\mathcal{X}_p}^{\\widetilde{\\mathcal{X}}_p}\\\
  right)^{\\mathrm{T}}\\,\\mathfrak{g}_{\\mathcal{X}}(p)\\left[\\mathrm{id}_{T_p(M)}\\\
  right]_{\\mathcal{X}_p}^{\\widetilde{\\mathcal{X}}_p},$$\n\n其中\n\n$$\\left[\\mathrm{id}_{T_p(M)}\\\
  right]_{\\mathcal{X}_p}^{\\widetilde{\\mathcal{X}}_p}=\\begin{bmatrix}\\frac{\\\
  partial x^1}{\\partial \\widetilde{x}^1}(p)&\\cdots&\\frac{\\partial x^1}{\\partial\
  \ \\widetilde{x}^m}(p)\\\\\\vdots&\\ddots&\\vdots\\\\\\frac{\\partial x^m}{\\partial\
  \ \\widetilde{x}^1}(p)&\\cdots&\\frac{\\partial x^m}{\\partial \\widetilde{x}^m}(p)\\\
  end{bmatrix}.$$\n\n证明：这由定理 3.1.3 和定理 14.3.5(b) 得出。\n\n设 $(\\overline{M},\\overline{\\\
  mathfrak{g}})$ 是一个半黎曼流形，并设 $M$ 是 $\\overline{M}$ 的子流形。若 $\\overline{\\mathfrak{g}}|_M$\
  \ 是 $M$ 上的度量，则称 $(M,\\overline{\\mathfrak{g}}|_M)$ 是 $(\\overline{M},\\overline{\\\
  mathfrak{g}})$ 的半黎曼子流形。在这种情况下，根据定义：(i) 对 $M$ 中所有 $p$，$(\\overline{\\mathfrak{g}}|_M)_p$\
  \ 在 $T_p(M)$ 上非退化；(ii) $\\mathrm{ind}((\\overline{\\mathfrak{g}}|_M)_p)$ 与 $M$ 中的\
  \ $p$ 无关。$\\mathrm{ind}((\\overline{\\mathfrak{g}}|_M)_p)$ 的公共值记为 $\\mathrm{ind}(\\\
  overline{\\mathfrak{g}}|_M)$，称为 $\\overline{\\mathfrak{g}}|_M$ 的指标或 $M$ 的指标。$(\\\
  overline{\\mathfrak{g}}|_M)_p$ 的公共符号差称为 $\\overline{\\mathfrak{g}}|_M$ 的符号差或 $M$\
  \ 的符号差。若 $(M,\\overline{\\mathfrak{g}}|_M)$ 在本身作为半黎曼流形来看时是黎曼（洛伦兹）流形，则称 $(M,\\overline{\\\
  mathfrak{g}}|_M)$ 是黎曼（洛伦兹）子流形。当 $(M,\\overline{\\mathfrak{g}}|_M)$ 是 $\\overline{M}$\
  \ 的黎曼（洛伦兹）子流形且同时是超曲面时，我们称 $(M,\\overline{\\mathfrak{g}}|_M)$ 为 $\\overline{M}$ 的黎曼（洛伦兹）超曲面。注意到，若\
  \ $(\\overline{M},\\overline{\\mathfrak{g}})$ 是黎曼流形，则 $(M,\\overline{\\mathfrak{g}}|_M)$\
  \ 自动是黎曼子流形。另一方面，若 $(\\overline{M},\\overline{\\mathfrak{g}})$ 是洛伦兹流形，且 $(M,\\overline{\\\
  mathfrak{g}}|_M)$ 是半黎曼子流形，则后者既可能是黎曼子流形，也可能是洛伦兹子流形。举例说明，由定理 12.2.12(d) 和定理 14.8.2\
  \ 可知，$\\mathcal{S}^2$ 是黎曼 3-流形 $\\mathbb{R}^3$ 的黎曼超曲面，而 $\\mathcal{H}^2$ 是洛伦兹 3-流形\
  \ $\\mathbb{R}^3_1$ 的黎曼超曲面，$\\mathcal{P}^2$ 是 $\\mathbb{R}^3_1$ 的洛伦兹超曲面。\n\n设 $(M,\\\
  overline{\\mathfrak{g}}|_M)$ 是 $(\\overline{M},\\overline{\\mathfrak{g}})$ 的半黎曼超曲面，并设\
  \ $p$ 是 $M$ 中的一点。根据 (14.8.1)，$T_p(M)$ 可以看作 $T_p(\\overline{M})$ 的向量子空间。由定理 4.1.3\
  \ 可得 $T_p(\\overline{M})=T_p(M)\\oplus T_p(M)^\\perp$，再由定理 1.1.18 可得 $T_p(M)^\\\
  perp$ 是 1 维的。若 $T_p(\\overline{M})$ 中的向量 $v$ 属于 $T_p(M)^\\perp$，则称 $v$ 在 $p$ 处为法向量。若\
  \ $v$ 同时是单位向量，则称它为 $p$ 处的单位法向量。此时，由于 $v$ 非零，我们有 $T_p(M)^\\perp=\\mathbb{R}v$。设 $V$\
  \ 是沿 $M$ 的（未必光滑的）向量场。若对 $M$ 中所有 $p$，$V_p$ 都在 $p$ 处为法向量，则称 $V$ 是法向量场。当 $V$ 既是单位向量场又是法向量场时，称它为单位法向量场。\n\
  \n定理 12.2.2–12.2.5 可以直接推广到半黎曼流形的半黎曼超曲面的情形。由定理 12.2.5 的推广可知，存在沿 M 的（未必光滑的）单位法向量场\
  \ V，使得 ⟨V_p, V_p⟩ 与 M 中的 p 无关。⟨V_p, V_p⟩ 的公共值记为 ε_M，称为 M 的符号。因此，对所有 p ∈ M，ε_M =\
  \ ⟨V_p, V_p⟩。由定理 12.2.2(b) 的推广可得 ε_M = (−1)^{μ−ind(\U0001D524|_M)}。\n\n## 19.2 曲线\n\
  \n设 (M, \U0001D524) 是一个半黎曼流形，λ(t) : (a, b) ⟶ M 是一条光滑曲线，g(u) : (c, d) ⟶ (a, b) 是一个微分同胚。光滑曲线\
  \ λ ∘ g(u) : (c, d) ⟶ ℝ³ 称为 λ 的光滑重参数化。回顾第 15.1 节，λ 的速度是光滑曲线 (dλ/dt)(t) : (a, b)\
  \ ⟶ M，并且若 λ 的速度处处非零，则称 λ 是正则的。λ 的速率是（未必光滑的）曲线 ‖(dλ/dt)(t)‖ : (a, b) ⟶ M。当 ν = 0\
  \ 时，λ 正则当且仅当其速率处处非零。若存在实数 c，使得对所有 t ∈ (a, b) 都有 ‖(dλ/dt)(t)‖ = c，则称 λ 具有常速率。若对所有\
  \ t ∈ (a, b)，(dλ/dt)(t) 都是类空（相应地，类时、类光）的，则称 λ 是类空（相应地，类时、类光）的。另外，若对所有 t ∈ (a, b)，(dλ/dt)(t)\
  \ 都是未来指向（过去指向）的，则称 λ 是未来指向（过去指向）的。\n\n设 λ(t) : [a, b] ⟶ M 是闭区间上的光滑曲线。λ 的长度定义为 L(λ)\
  \ = ∫_a^b ‖ dλ/dt (t) ‖ dt。 (19.2.1)\n\n## 定理 19.2.1（长度的微分同胚不变性）\n\n设 (M, \U0001D524\
  ) 是一个半黎曼流形，λ(t) : [a, b] ⟶ M 是一条光滑曲线，g(u) : [c, d] ⟶ [a, b] 是一个微分同胚。则 L(λ) = L(λ\
  \ ∘ g)。\n\n证明：该证明与定理 12.1.1 的证明相同。\n\n## 19.3 半黎曼流形的基本定理\n\n设 (M, \U0001D524, ∇)\
  \ 是带联络的半黎曼流形。如果没有进一步假设，就没有理由期望 \U0001D524 和 ∇ 之间存在联系。若对所有向量场 X, Y, Z ∈ \U0001D51B\
  (M)，都有 X(⟨Y, Z⟩) = ⟨∇_X Y, Z⟩ + ⟨Y, ∇_X Z⟩ = ∇_X(⟨Y, Z⟩) (19.3.1)，则称 ∇ 与 \U0001D524\
  \ 相容，其中第二个等号由 (18.1.1) 得出。根据第 18.4 节给出的定义，∇(\U0001D524) 是 T_3^0(M) 中的张量场；如果 ∇(\U0001D524\
  ) = 0，则 \U0001D524 是（关于 ∇）平行的。\n\n## 定理 19.3.1.\n\n设 $(M,\\mathfrak{g},\\nabla)$\
  \ 是带联络的半黎曼流形。则以下条件等价：\n\n- (a) $\\nabla$ 与 $\\mathfrak{g}$ 相容。\n- (b) $\\mathfrak{g}$\
  \ 关于 $\\nabla$ 平行。\n- (c) 若 $\\lambda(t): (a,b)\\longrightarrow M$ 是正则光滑曲线，且 $J,K$\
  \ 是 $\\mathfrak{X}_M(\\lambda)$ 中的向量场，则\n\n$$\\frac{d\\langle J,K\\rangle}{dt}(t)=\\\
  left\\langle\\frac{\\nabla J}{dt}(t),K(t)\\right\\rangle+\\left\\langle J(t),\\\
  frac{\\nabla K}{dt}(t)\\right\\rangle$$\n\n对所有 $t\\in(a,b)$ 成立。\n- (d) 若 $\\lambda(t):\
  \ (a,b)\\longrightarrow M$ 是光滑曲线，且 $J,K$ 是 $\\mathfrak{X}_M(\\lambda)$ 中的平行向量场，则函数\
  \ $\\langle J,K\\rangle(t): (a,b)\\longrightarrow\\mathbb{R}$ 是常值函数。\n\n证明：(a) ⇔\
  \ (b)：由定理 18.4.6，对所有向量场 $X,Y,Z\\in\\mathfrak{X}(M)$，有\n\n$$\\nabla(\\mathfrak{g})(X,Y,Z)=X\\\
  langle Y,Z\\rangle-\\langle\\nabla_X(Y),Z\\rangle-\\langle Y,\\nabla_X(Z)\\rangle$$\n\
  \n由此即得结论。\n\n(a) ⇒ (c)：设 $\\lambda(t): (a,b)\\longrightarrow M$ 是正则光滑曲线，设 $J,K$\
  \ 是 $\\mathfrak{X}_M(\\lambda)$ 中的向量场，设 $t_0$ 是 $(a,b)$ 中的一点，并设 $p=\\lambda(t_0)$。由定理\
  \ 15.1.2，存在 $\\mathfrak{X}(M)$ 中的向量场 $X$，使得 $X_p=(d\\lambda/dt)(t_0)$。由于 $\\lambda$\
  \ 是正则的，可以证明存在包含 $t_0$ 的区间 $(c,d)\\subseteq(a,b)$ 以及 $\\mathfrak{X}(M)$ 中的向量场 $Y,Z$，使得\
  \ $J|_{(c,d)}=Y\\circ\\lambda|_{(c,d)}$，$K|_{(c,d)}=Z\\circ\\lambda|_{(c,d)}$。于是\n\
  \n$$\\frac{d\\langle J,K\\rangle}{dt}(t_0)=\\frac{d\\langle Y\\circ\\lambda,Z\\\
  circ\\lambda\\rangle}{dt}(t_0)=\\frac{d\\langle Y,Z\\rangle\\circ\\lambda}{dt}(t_0)$$\n\
  $$=\\frac{d\\lambda}{dt}(t_0)\\langle Y,Z\\rangle=X_p\\langle Y,Z\\rangle=X\\langle\
  \ Y,Z\\rangle(p)$$\n$$=\\langle\\nabla_X(Y)_p,Z_p\\rangle+\\langle Y_p,\\nabla_X(Z)_p\\\
  rangle$$\n$$=\\langle\\nabla_{X_p}(Y),Z_p\\rangle+\\langle Y_p,\\nabla_{X_p}(Z)\\\
  rangle$$\n$$=\\langle\\nabla_{(d\\lambda/dt)(t_0)}(Y),Z_p\\rangle+\\langle Y_p,\\\
  nabla_{(d\\lambda/dt)(t_0)}(Z)\\rangle$$\n$$=\\left\\langle\\frac{\\nabla(Y\\circ\\\
  lambda)}{dt}(t_0),Z_p\\right\\rangle+\\left\\langle Y_p,\\frac{\\nabla(Z\\circ\\\
  lambda)}{dt}(t_0)\\right\\rangle$$\n$$=\\left\\langle\\frac{\\nabla J}{dt}(t_0),K(t_0)\\\
  right\\rangle+\\left\\langle J(t_0),\\frac{\\nabla K}{dt}(t_0)\\right\\rangle,$$\n\
  \n其中第三个等号由 (14.7.5) 得出，第五个等号由 (15.1.2) 得出，第六个等号根据假设，第七个等号由 (18.1.5) 得出，第九个等号由定理\
  \ 18.3.1(c) 得出。由于 $t_0$ 是任意的，结论得证。\n\n(c) ⇒ (a)：设 $X,Y,Z$ 是 $\\mathfrak{X}(M)$ 中的向量场，设\
  \ $p$ 是 $M$ 中的一点，并设 $\\lambda(t): (a,b)\\longrightarrow M$ 是光滑曲线，使得 $\\lambda(t_0)=p$\
  \ 且 $(d\\lambda/dt)(t_0)=X_p$\n\n\n对某个 $t_0\\in(a,b)$。于是\n\n$$\nX(\\langle Y,Z\\\
  rangle)(p)=X_p(\\langle Y,Z\\rangle)=\\frac{d\\lambda}{dt}(t_0)(\\langle Y,Z\\rangle)\n\
  $$\n\n$$\n=\\frac{d(\\langle Y,Z\\rangle\\circ\\lambda)}{dt}(t_0)=\\frac{d(\\langle\
  \ Y\\circ\\lambda,Z\\circ\\lambda\\rangle)}{dt}(t_0)\n$$\n\n$$\n=\\left\\langle\\\
  frac{\\nabla(Y\\circ\\lambda)}{dt}(t_0),Z|_{\\lambda(t_0)}\\right\\rangle+\\left\\\
  langle Y|_{\\lambda(t_0)},\\frac{\\nabla(Z\\circ\\lambda)}{dt}(t_0)\\right\\rangle\n\
  $$\n\n$$\n=\\langle(\\nabla_{d\\lambda/dt})_{(t_0)}(Y),Z_p\\rangle+\\langle Y_p,(\\\
  nabla_{d\\lambda/dt})_{(t_0)}(Z)\\rangle\n$$\n\n$$\n=\\langle\\nabla_{X_p}(Y),Z_p\\\
  rangle+\\langle Y_p,\\nabla_{X_p}(Z)\\rangle\n$$\n\n$$\n=\\langle\\nabla_X(Y)_p,Z_p\\\
  rangle+\\langle Y_p,\\nabla_X(Z)_p\\rangle\n$$\n\n$$\n=\\langle\\nabla_X(Y),Z\\\
  rangle(p)+\\langle Y,\\nabla_X(Z)\\rangle(p),\n$$\n\n其中第一个等号来自(15.1.2)，第三个等号来自(14.7.5)，第五个等号由假设得出，第六个等号来自定理18.3.1(c)，第八个等号来自(18.1.5)。由于\
  \ $p$ 是任意的，结论得证。\n\n$(c)\\Rightarrow(d)$：由假设，$\\nabla J/dt=0$ 且 $\\nabla K/dt=0$，因此(c)部分中的恒等式变为\
  \ $(d(\\langle J,K\\rangle)/dt)(t)=0$ 对所有 $t\\in(a,b)$ 成立，从而函数 $\\langle J,K\\rangle$\
  \ 是常数。\n\n$(d)\\Rightarrow(c)$：设 $(e_1,\\ldots,e_m)$ 为 $T_{\\lambda(0)}(M)$ 的标准正交基。定理18.5.1给出\
  \ $e_i$ 的平行平移 $E_i(t)=\\Pi^{\\lambda(t)}_{\\lambda(0)}(e_i)$，对所有 $t\\in(a,b)$，其中\
  \ $E_i(0)=e_i$，$i=1,\\ldots,m$。由假设，函数 $\\langle E_i,E_j\\rangle$ 是常数，因此 $\\langle\
  \ E_i(t),E_j(t)\\rangle=\\langle e_i,e_j\\rangle$。从而 $(E_1(t),\\ldots,E_m(t))$ 是\
  \ $T_{\\lambda(t)}(M)$ 的标准正交基，对所有 $t\\in(a,b)$。将 $J$ 和 $K$ 表示为\n\n$$\nJ=\\sum_i\\\
  alpha^iE_i\\qquad\\text{and}\\qquad K=\\sum_j\\beta^jE_j,\n$$\n\n其中 $\\alpha^i,\\\
  beta^j$ 是 $C^\\infty((a,b))$ 中唯一确定的函数，我们得到\n\n$$\n\\langle J,K\\rangle=\\sum_{ij}\\\
  langle E_i,E_j\\rangle\\alpha_i\\beta_j=\\sum_i\\langle e_i,e_i\\rangle\\alpha_i\\\
  beta_i,\n$$\n\n因此\n\n$$\n\\frac{d(\\langle J,K\\rangle)}{dt}=\\sum_i\\langle e_i,e_i\\\
  rangle\\left(\\frac{d\\alpha^i}{dt}\\beta^i+\\alpha^i\\frac{d\\beta^i}{dt}\\right).\n\
  $$\n\n由于 $E_i$ 是平行的，\n\n$$\n\\frac{\\nabla J}{dt}=\\sum_i\\frac{\\nabla}{dt}(\\\
  alpha^iE_i)=\\sum_i\\frac{d\\alpha^i}{dt}E_i+\\sum_i\\alpha^i\\frac{\\nabla E_i}{dt}=\\\
  sum_i\\frac{d\\alpha^i}{dt}E_i.\n$$\n\n类似地，\n\n$$\n\\frac{\\nabla K}{dt}=\\sum_j\\\
  frac{d\\beta^j}{dt}E_j.\n$$\n\n因此，\n\n$$\n\\left\\langle \\frac{\\nabla J}{dt},K\\\
  right\\rangle=\\left\\langle\\sum_i\\frac{d\\alpha^i}{dt}E_i,\\sum_j\\beta^jE_j\\\
  right\\rangle=\\sum_{ij}\\langle E_i,E_j\\rangle\\frac{d\\alpha^i}{dt}\\beta^j\n\
  $$\n\n$$\n=\\sum_i\\langle e_i,e_i\\rangle\\frac{d\\alpha^i}{dt}\\beta^i.\n$$\n\n\
  类似地，\n\n$$\n\\left\\langle\\frac{\\nabla K}{dt},J\\right\\rangle=\\sum_i\\langle\
  \ e_i,e_i\\rangle\\frac{d\\beta^i}{dt}\\alpha_i.\n$$\n\n结合(19.3.2)–(19.3.4)即得结论。\n\
  \n下一个结果有时被称为“半黎曼几何的奇迹”。\n\n### **定理19.3.2（半黎曼流形基本定理）。**\n\n若 $(M,\\mathfrak{g})$\
  \ 是半黎曼流形，则 $M$ 上存在唯一的连接，称为**Levi-Civita连接**，它是对称的且与 $\\mathfrak{g}$ 相容。\n\n*证明。唯一性。*\
  \ 假设这样的连接 $\\nabla$ 存在。由于它是对称的，\n\n$$\n\\nabla_X(Z)=\\nabla_Z(X)+[X,Z]\n$$\n\n$$\n\
  \\nabla_Y(X)=\\nabla_X(Y)+[Y,X]\n$$\n\n$$\n\\nabla_Z(Y)=\\nabla_Y(Z)+[Z,Y],\n$$\n\
  \n并且因为它与 $\\mathfrak{g}$ 相容，\n\n$$\nX(\\langle Y,Z\\rangle)=\\langle\\nabla_X(Y),Z\\\
  rangle+\\langle Y,\\nabla_X(Z)\\rangle\n$$\n\n$$\nY(\\langle Z,X\\rangle)=\\langle\\\
  nabla_Y(Z),X\\rangle+\\langle Z,\\nabla_Y(X)\\rangle\n$$\n\n$$\nZ(\\langle X,Y\\\
  rangle)=\\langle\\nabla_Z(X),Y\\rangle+\\langle X,\\nabla_Z(Y)\\rangle.\n$$\n\n\
  结合上述恒等式得到\n\n$$\nX(\\langle Y,Z\\rangle)=\\langle\\nabla_X(Y),Z\\rangle+\\langle\
  \ Y,\\nabla_Z(X)\\rangle+\\langle Y,[X,Z]\\rangle\n$$\n\n$$\nY(\\langle Z,X\\rangle)=\\\
  langle\\nabla_Y(Z),X\\rangle+\\langle Z,\\nabla_X(Y)\\rangle+\\langle Z,[Y,X]\\\
  rangle\n$$\n\n$$\nZ(\\langle X,Y\\rangle)=\\langle\\nabla_Z(X),Y\\rangle+\\langle\
  \ X,\\nabla_Y(Z)\\rangle+\\langle X,[Z,Y]\\rangle.\n$$\n\n将上述三式中的前两个恒等式相加并减去第三个得到\n\
  \n$$\nX(\\langle Y,Z\\rangle)+Y(\\langle Z,X\\rangle)-Z(\\langle X,Y\\rangle)\n\
  $$\n\n$$\n=2\\langle\\nabla_X(Y),Z\\rangle-\\langle X,[Z,Y]\\rangle+\\langle Y,[X,Z]\\\
  rangle+\\langle Z,[Y,X]\\rangle\n$$\n\n$$\n=2\\langle\\nabla_X(Y),Z\\rangle+\\langle\
  \ X,[Y,Z]\\rangle-\\langle Y,[Z,X]\\rangle-\\langle Z,[X,Y]\\rangle,\n$$\n\n从而\n\
  \n$$\n2\\langle\\nabla_X(Y),Z\\rangle=X(\\langle Y,Z\\rangle)+Y(\\langle Z,X\\rangle)-Z(\\\
  langle X,Y\\rangle)\n$$\n\n$$\n\\qquad-\\langle X,[Y,Z]\\rangle+\\langle Y,[Z,X]\\\
  rangle+\\langle Z,[X,Y]\\rangle,\n$$\n\n这称为Koszul公式。假设 $\\widetilde{\\nabla}$ 是满足Koszul公式的另一个连接。Koszul公式的右端不依赖于连接的选择，因此对所有\
  \ $\\mathfrak{X}(M)$ 中的向量场 $X,Y,Z$，有 $\\langle\\nabla_X(Y)-\\widetilde{\\nabla}_X(Y),Z\\\
  rangle=0$。由于 $\\mathfrak{g}$ 在 $M$ 上非退化，对所有 $\\mathfrak{X}(M)$ 中的向量场 $X,Y$，有 $\\\
  nabla_X(Y)=\\widetilde{\\nabla}_X(Y)$。因此，$\\nabla=\\widetilde{\\nabla}$。\n\n存在性。设\
  \ $\\mathfrak{R}(X,Y,Z)$ 为Koszul公式的右端。暂时将 $X$ 和 $Y$ 视为固定的，我们通过赋值 $Z\\longmapsto\\\
  mathfrak{R}(X,Y,Z)$ 定义映射 $\\overline{\\mathfrak{R}}:\\mathfrak{X}(M)\\longrightarrow\
  \ C^{\\infty}(M)$，对所有 $Z\\in\\mathfrak{X}(M)$。容易证明 $\\overline{\\mathfrak{R}}$ 是\
  \ $C^{\\infty}(M)$-线性的，因此 $\\overline{\\mathfrak{R}}\\in\\mathrm{Lin}_{C^{\\infty}(M)}(\\\
  mathfrak{X}(M),C^{\\infty}(M))$。由定理15.5.3可知，$\\overline{\\mathfrak{R}}$ 可与 $\\mathfrak{X}^*(M)$\
  \ 中的余向量场等同；再由定理19.4.2可知，存在唯一的向量场 $\\nabla(X,Y)\\in\\mathfrak{X}(M)$，使得对所有 $Z\\in\\\
  mathfrak{X}(M)$，有 $2\\langle\\nabla(X,Y),Z\\rangle=\\mathfrak{R}(X,Y,Z)$。这定义了一个映射\
  \ $\\nabla:\\mathfrak{X}(M)\\times\\mathfrak{X}(M)\\longrightarrow\\mathfrak{X}(M)$。我们需要验证连接的条件\
  \ $[\\nabla 1]$–$[\\nabla 4]$ 被满足。显然，$[\\nabla 1]$ 和 $[\\nabla 3]$ 被满足，而类似于证明 $\\\
  mathfrak{R}$ 是 $C^{\\infty}(M)$-线性的计算表明 $[\\nabla 2]$ 和 $[\\nabla 4]$ 也被满足。\n\n\
  ### 例19.3.3（$\\mathbb{R}_\\nu^3$ 中的正则曲面）。\n\n将 $\\mathbb{R}_\\nu^3$ 中的正则曲面 $(M,\\\
  mathfrak{g})$ 视为带有例18.1.1中定义的连接 $\\nabla$ 的光滑2-流形，由(12.6.1)可知 $\\nabla$ 是对称的，由定理12.4.1(e)可知它与\
  \ $\\mathfrak{g}$ 相容。根据定理19.3.2，$\\nabla$ 是 $M$ 上对应于 $\\mathfrak{g}$ 的Levi-Civita连接。\n\
  \n除非另有说明，半黎曼流形上的连接均指Levi-Civita连接。\n\n按照这一约定，当我们说 $(M,\\mathfrak{g})$ 是半黎曼流形时，隐含着\
  \ $M$ 上存在一个连接，且该连接就是Levi-Civita连接。另一方面，记号 $(M,\\mathfrak{g},\\nabla)$ 表示 $(M,\\\
  mathfrak{g})$ 是一个带连接（但不一定是Levi-Civita连接）的半黎曼流形。\n\n$\\mathbb{R}_\\nu^3$ 中正则曲面的Christoffel符号在第12.3节引入，带连接的光滑流形的Christoffel符号在第18.2节引入。如下一个结果所示，有了度量，我们就可以恢复定理12.3.3(b)中给出的Christoffel符号恒等式。\n\
  \n### 定理19.3.4（Christoffel符号的局部坐标表达式）。\n\n若 $(M,\\mathfrak{g})$ 是半黎曼流形，则在局部坐标中，\n\
  \n$$\n\\Gamma_{ij}^k = \\frac{1}{2} \\sum_l \\mathfrak{g}^{kl} \\left( \\frac{\\\
  partial \\mathfrak{g}_{jl}}{\\partial x^i} + \\frac{\\partial \\mathfrak{g}_{il}}{\\\
  partial x^j} - \\frac{\\partial \\mathfrak{g}_{ij}}{\\partial x^l} \\right)\n$$\n\
  \n对 $i,j,k=1,\\ldots,m$。\n\n*证明。* 我们有\n\n$$\n2\\sum_n \\Gamma^n_{ij}g_{ln}\n$$\n\
  \n$$\n=2\\sum_n\\Gamma^n_{ij}\\left\\langle\\frac{\\partial}{\\partial x^n},\\frac{\\\
  partial}{\\partial x^l}\\right\\rangle=2\\left\\langle\\sum_n\\Gamma^n_{ij}\\frac{\\\
  partial}{\\partial x^n},\\frac{\\partial}{\\partial x^l}\\right\\rangle=2\\left\\\
  langle\\nabla_{\\partial/\\partial x^i}\\left(\\frac{\\partial}{\\partial x^j}\\\
  right),\\frac{\\partial}{\\partial x^l}\\right\\rangle\n$$\n\n$$\n=\\frac{\\partial}{\\\
  partial x^i}\\left\\langle\\frac{\\partial}{\\partial x^j},\\frac{\\partial}{\\\
  partial x^l}\\right\\rangle+\\frac{\\partial}{\\partial x^j}\\left\\langle\\frac{\\\
  partial}{\\partial x^l},\\frac{\\partial}{\\partial x^i}\\right\\rangle-\\frac{\\\
  partial}{\\partial x^l}\\left\\langle\\frac{\\partial}{\\partial x^i},\\frac{\\\
  partial}{\\partial x^j}\\right\\rangle\n$$\n\n$$\n-\\left\\langle\\frac{\\partial}{\\\
  partial x^i},\\left[\\frac{\\partial}{\\partial x^j},\\frac{\\partial}{\\partial\
  \ x^l}\\right]\\right\\rangle+\\left\\langle\\frac{\\partial}{\\partial x^j},\\\
  left[\\frac{\\partial}{\\partial x^l},\\frac{\\partial}{\\partial x^i}\\right]\\\
  right\\rangle+\\left\\langle\\frac{\\partial}{\\partial x^l},\\left[\\frac{\\partial}{\\\
  partial x^i},\\frac{\\partial}{\\partial x^j}\\right]\\right\\rangle\n$$\n\n$$\n\
  =\\frac{\\partial g_{jl}}{\\partial x^i}+\\frac{\\partial g_{il}}{\\partial x^j}-\\\
  frac{\\partial g_{ij}}{\\partial x^l}.\n$$\n\n其中第三个等号来自(18.2.1)，第四个等号来自Koszul公式，最后一个等号来自定理15.3.3(b)。因此，\n\
  \n$$\n\\frac{1}{2}\\left(\\frac{\\partial g_{jl}}{\\partial x^i}+\\frac{\\partial\
  \ g_{il}}{\\partial x^j}-\\frac{\\partial g_{ij}}{\\partial x^l}\\right)=\\sum_n\
  \ g_{ln}\\Gamma^n_{ij}.\n$$\n\n将上述恒等式两边乘以 $g^{kl}$ 并对 $l$ 求和得到\n\n$$\n\\frac{1}{2}\\\
  sum_l g^{kl}\\left(\\frac{\\partial g_{jl}}{\\partial x^i}+\\frac{\\partial g_{il}}{\\\
  partial x^j}-\\frac{\\partial g_{ij}}{\\partial x^l}\\right)=\\sum_l g^{kl}\\left(\\\
  sum_n g_{ln}\\Gamma^n_{ij}\\right)\n$$\n\n$$\n=\\sum_n\\left(\\sum_l g^{kl}g_{ln}\\\
  right)\\Gamma^n_{ij}=\\sum_n\\delta^k_n\\Gamma^n_{ij}=\\Gamma^k_{ij}.\n$$\n\n###\
  \ **定理19.3.5（标准坐标）。**\n\n若 $(\\epsilon_1,\\ldots,\\epsilon_m)$ 是 $\\mathbb{R}^m_\\\
  nu=(\\mathbb{R}^m,\\mathfrak{s})$ 的符号差，则在标准坐标中，\n\n$$\n\\mathfrak{s}_{ij}(p)=\\\
  epsilon_i\\delta_{ij}\\qquad\\text{and}\\qquad \\Gamma^k_{ij}(p)=0\n$$\n\n对所有 $p\\\
  in\\mathbb{R}^m_\\nu$，$i,j,k=1,\\ldots,m$。\n\n*证明。* 设 $(e_1,\\ldots,e_m)$ 为 $\\\
  mathbb{R}^m_\\nu$ 的标准基。由(4.2.1)、定理14.5.7和(19.1.1)我们有\n\n$$\n\\mathfrak{s}_{ij}(p)=\\\
  left\\langle\\left.\\frac{\\partial}{\\partial r^i}\\right|_p,\\left.\\frac{\\partial}{\\\
  partial r^j}\\right|_p\\right\\rangle=\\langle e_i,e_j\\rangle=\\epsilon_i\\delta_{ij},\n\
  $$\n\n这证明了第一个恒等式。第二个恒等式由第一个恒等式和定理19.3.1得出。\n\n下一个结果表明，在给定点的法坐标中，指标为 $\\nu$ 的半黎曼\
  \ $m$-流形在*该点*处的度量与Christoffel符号方面表现得像 $\\mathbb{R}^m_\\nu$。\n\n\n\n\n## 19.3 半黎曼流形的基石定理\n\
  \n**定理 19.3.6（正规坐标）。**\n\n若 $(M,g)$ 是一个签名为 $(\\epsilon_1,\\ldots,\\epsilon_m)$ 的半黎曼\
  \ $m$-流形，$p$ 是 $M$ 中的一点，则在 $p$ 处的正规坐标下，\n\n$$g_{ij}(p)=\\epsilon_i\\delta_{ij}\\\
  qquad\\text{and}\\qquad \\Gamma^k_{ij}(p)=0$$\n\n对 $i,j,k=1,\\ldots,m$ 成立。\n\n**证明。**\
  \ 继续采用第 18.10 节开头建立的设定，设 $(\\tilde e_1,\\ldots,\\tilde e_m)$ 是 $T_p(M)$ 的一个正交基。由定理\
  \ 18.10.1(a) 和 (19.1.1) 可得，\n\n$$g_{ij}(p)=\\left\\langle\\left.\\frac{\\partial}{\\\
  partial x^i}\\right|_p,\\left.\\frac{\\partial}{\\partial x^j}\\right|_p\\right\\\
  rangle=\\langle\\tilde e_i,\\tilde e_j\\rangle.$$\n\n根据定义，$T_p(M)$ 与 $M$ 具有相同的签名，故\
  \ $\\langle\\tilde e_i,\\tilde e_j\\rangle=\\epsilon_i\\delta_{ij}$。这证明了第一个恒等式。第二个恒等式是定理\
  \ 18.10.2 的重复。\n\n设 $(M,g)$ 为半黎曼流形，$U$ 为 $M$ 中的开集，$\\mathcal X=(X_1,\\ldots,X_m)$\
  \ 为 $U$ 上的一个标架。我们称 $\\mathcal X$ 为 **正交** 的，如果 $\\mathcal X_p=(X_{1|p},\\ldots,X_{m|p})$\
  \ 对 $U$ 中所有 $p$ 都是 $T_p(M)$ 的正交基。当 $M$ 可定向时，若 $\\mathcal X_p$ 对 $U$ 中所有 $p$ 都是正定向的，则称\
  \ $\\mathcal X$ 为 **正定向** 的。\n\n**定理 19.3.7（正交标架的存在性）。**\n\n半黎曼流形中每一点都存在一个邻域，在该邻域上存在正交标架。若半黎曼流形可定向，则正交标架可以选为正定向的。\n\
  \n**证明。** 设 $(M,g)$ 为半黎曼流形，$p$ 为 $M$ 中的一点，$(e_1,\\ldots,e_m)$ 为 $T_p(M)$ 的正交基。设\
  \ $V$ 为 $p$ 在 $M$ 中的一个正规邻域，$\\exp_p:\\widetilde V\\longrightarrow V$ 为相应的微分同胚，$\\\
  gamma(t):[0,1]\\longrightarrow M$ 为起点为 $p$ 的径向测地线。由定理 18.5.7，存在唯一的标架 $(E_{1\\gamma},\\\
  ldots,E_{m\\gamma})$ 在 $\\gamma$ 上，由 $\\mathcal X_m(\\gamma)$ 中的平行向量场组成，使得 $(E_{1\\\
  gamma}(0),\\ldots,E_{m\\gamma}(0))=(e_1,\\ldots,e_m)$ 且 $(E_{1\\gamma}(t),\\ldots,E_{m\\\
  gamma}(t))$ 对所有 $t\\in[0,1]$ 都是 $T_{\\gamma(t)}(M)$ 的基。由定理 19.3.1 可知 $\\langle E_{i\\\
  gamma}(t),E_{j\\gamma}(t)\\rangle=\\langle e_i,e_j\\rangle$ 对所有 $t\\in[0,1]$ 及 $i,j=1,\\\
  ldots,m$ 成立。因此，每个 $(E_{1\\gamma}(t),\\ldots,E_{m\\gamma}(t))$ 都是正交基。可以证明，将这些向量场在所有以\
  \ $p$ 为起点的径向测地线上组合起来，可得到 $V$ 上的正交标架 $(E_1,\\ldots,E_m)$。\n\n现在假设 $M$ 可定向。若必要，可将\
  \ $e_1$ 替换为 $-e_1$，不失一般性地假设 $(E_{1|p},\\ldots,E_{m|p})=(e_1,\\ldots,e_m)$ 是 $T_p(M)$\
  \ 的正定向正交基，并且上述构造已相应地修改。由定理 16.6.5，存在一个诱导 $M$ 的定向的定向形式 $\\varpi$。则 $\\varpi_p(E_{1|p},\\\
  ldots,E_{m|p})>0$，故 $f=\\varpi|_V(E_1,\\ldots,E_m)$ 是 $C^\\infty(V)$ 中的一个函数且 $f(p)>0$。由于\
  \ $f$ 是光滑的，由定理 14.2.2，它是连续的。设 $\\epsilon>0$ 为实数，使得开区间 $I=(f(p)-\\epsilon,f(p)+\\\
  epsilon)$ 由正实数组成。由定理 9.1.5 和定理 9.1.7，$W=f^{-1}(I)$ 是 $p$ 在 $M$ 中的一个邻域，在该邻域上 $f$\
  \ 取正值。由此可知 $(E_1,\\ldots,E_m)$ 在 $W$ 上是正定向的。\n\n我们经常调用定理 19.3.7，但通常不加引用。\n\n**定理\
  \ 19.3.8。** 设 $(M,\\mathfrak g)$ 为半黎曼流形，$X$ 为 $\\mathfrak X(M)$ 中的向量场，$\\mathcal\
  \ A$ 为 $\\mathcal T_s^r(M)$ 中的张量场。则\n\n$\\nabla_X(\\mathfrak g \\otimes \\mathcal\
  \ A) = \\mathfrak g \\otimes \\nabla_X(\\mathcal A)$。\n\n证明。我们有\n\n$\\nabla_X(\\\
  mathfrak g \\otimes \\mathcal A) = \\nabla_X(\\mathfrak g) \\otimes \\mathcal A\
  \ + \\mathfrak g \\otimes \\nabla_X(\\mathcal A)$ [Th 18.1.3(b)] = $\\mathfrak g\
  \ \\otimes \\nabla_X(\\mathcal A)$。 [Th 18.4.1, Th 19.3.1]\n\n## 19.4 平坦映射与锐映射\n\
  \n在本节中，我们给出第 3.3 节、第 6.2 节和第 6.3 节中定义的平坦映射和锐映射的流形版本。\n\n设 $(M,\\mathfrak g)$ 为半黎曼流形。对\
  \ $\\mathfrak X(M)$ 中的给定向量场 $X$，我们定义一个映射\n\n$X^f : \\mathfrak X(M) \\longrightarrow\
  \ C^\\infty(M)$\n\n由\n\n$X^f(Y) = \\langle X, Y \\rangle$ (19.4.1)\n\n对所有 $\\mathfrak\
  \ X(M)$ 中的向量场 $Y$ 定义。\n\n**定理 19.4.1。** 在上述设定下，$X^f$ 是 $\\mathfrak X^*(M)$ 中的一个余向量场。\n\
  \n证明。设 $Y,Z$ 为 $\\mathfrak X(M)$ 中的向量场，$f$ 为 $C^\\infty(M)$ 中的函数。则\n\n$X^f(Y + Z)\
  \ = \\langle X, Y + Z \\rangle = \\langle X, Y \\rangle + \\langle X, Z \\rangle\
  \ = X^f(Y) + X^f(Z)$\n\n且 $(fX)^f(Y) = \\langle fX, Y \\rangle = f\\langle X, Y\
  \ \\rangle = f X^f(Y)$，所以 $X^f$ 是 $\\operatorname{Lin}_{C^\\infty(M)}(\\mathfrak\
  \ X(M), C^\\infty(M))$ 中的映射。结果现在由定理 15.5.3 得出。\n\n$M$ 上的平坦映射是映射\n\n$F : \\mathfrak\
  \ X(M) \\longrightarrow \\mathfrak X^*(M)$\n\n由赋值\n\n$X \\mapsto X^f$\n\n对所有 $\\\
  mathfrak X(M)$ 中的向量场 $X$ 定义。因此，作为记号，\n\n$F(X) = X^f$。\n\n## 定理 19.4.2。\n\n在上述设定下，$F$\
  \ 是 $C^\\infty(M)$-模同构：\n\n$$\\mathfrak{X}(M) \\cong \\mathfrak{X}^*(M).$$\n\n**证明。**\
  \ 易证 $F$ 是 $C^\\infty(M)$-模同态。我们需要证明 $F$ 是双射。\n\n**单射性。** 由于 $\\mathbf g$ 非退化，$\\\
  ker(F)=0$。由定理 B.5.3 可知 $F$ 是单射。\n\n**满射性。** 设 $\\omega$ 为 $\\mathfrak{X}^*(M)$ 中的余向量场，$(U,(x^i))$\
  \ 为 $M$ 上的一个坐标图，在局部坐标下设 $\\omega|_U=\\sum_i\\alpha_i d(x^i)$。定义 $U$ 上的向量场 $X|_U$\
  \ 为\n\n$$X|_U=\\sum_{ij}g^{ij}\\alpha_i\\frac{\\partial}{\\partial x^j}.$$\n\n则\n\
  \n$(X|_U)^F\\left(\\frac{\\partial}{\\partial x^i}\\right)=\\left\\langle X|_U,\\\
  frac{\\partial}{\\partial x^i}\\right\\rangle=\\left\\langle\\sum_{jk}g^{jk}\\alpha_j\\\
  frac{\\partial}{\\partial x^k},\\frac{\\partial}{\\partial x^i}\\right\\rangle=\\\
  sum_{jk}\\alpha_jg^{jk}g_{ki}$\n\n$=\\sum_j\\alpha_j\\left(\\sum_kg^{jk}g_{ki}\\\
  right)=\\sum_j\\delta_i^j\\alpha_j=\\alpha_i$\n\n对 $i=1,\\ldots,m$，故\n\n$$\\omega|_U=\\\
  sum_i(X|_U)^F\\left(\\frac{\\partial}{\\partial x^i}\\right)d(x^i)$$\n\n由流形版本的定理\
  \ 1.2.1(e) 可知 $(X|_U)^F=\\omega|_U$。\n\n设 $(\\widetilde U,\\widetilde\\varphi)$\
  \ 为 $M$ 上的一个与 $(U,\\varphi)$ 重叠的坐标图，在局部坐标下设 $\\omega|_{\\widetilde U}=\\sum_i\\\
  widetilde\\alpha_i d(\\widetilde x^i)$。我们有\n\n$$\\frac{\\partial}{\\partial\\widetilde\
  \ x^i}=\\sum_q\\frac{\\partial x^q}{\\partial\\widetilde x^i}\\frac{\\partial}{\\\
  partial x^q},\\qquad \\widetilde\\alpha_j=\\sum_p\\frac{\\partial x^p}{\\partial\\\
  widetilde x^j}\\alpha_p,\\qquad \\widetilde g^{ij}=\\sum_{kl}\\frac{\\partial\\\
  widetilde x^i}{\\partial x^k}g^{kl}\\frac{\\partial\\widetilde x^j}{\\partial x^l},$$\n\
  \n其中第一个恒等式由定理 15.1.8 得出，第二个恒等式由定理 15.6.3 得出，第三个恒等式由流形版本的定理 2.2.5(b)、定理 14.3.5(b)\
  \ 和定理 19.1.3 得出。则\n\n$X|_{\\widetilde U}=\\sum_{ij}\\widetilde g^{ij}\\widetilde\\\
  alpha_i\\frac{\\partial}{\\partial\\widetilde x^j}=\\sum_{ijkl p q}\\left(\\frac{\\\
  partial\\widetilde x^i}{\\partial x^k}g^{kl}\\frac{\\partial\\widetilde x^j}{\\\
  partial x^l}\\right)\\left(\\frac{\\partial\\widetilde x^j}{\\partial x^p}\\alpha_p\\\
  right)\\left(\\frac{\\partial x^q}{\\partial\\widetilde x^i}\\frac{\\partial}{\\\
  partial x^q}\\right)$\n\n$=\\sum_{klp q}\\left[g^{kl}\\alpha_p\\left(\\sum_i\\frac{\\\
  partial\\widetilde x^i}{\\partial x^k}\\frac{\\partial x^q}{\\partial\\widetilde\
  \ x^i}\\right)\\left(\\sum_j\\frac{\\partial\\widetilde x^j}{\\partial x^l}\\frac{\\\
  partial x^p}{\\partial\\widetilde x^j}\\right)\\frac{\\partial}{\\partial x^q}\\\
  right]$\n\n$=\\sum_{klpq}\\delta_k^q\\delta_l^p g^{kl}\\alpha_p\\frac{\\partial}{\\\
  partial x^q}$\n\n$=\\sum_{kl}g^{kl}\\alpha_k\\frac{\\partial}{\\partial x^l}=X|_U,$\n\
  \n所以在重叠处有相容性。综合起来，对每个点在 $M$ 中的 $X|_U$ 定义一个 $\\mathfrak X(M)$ 中的向量场 $X$，使得 $X^F =\
  \ \\omega$。因此，$F$ 是满射。\n\n$M$ 上的锐映射\n\n$S : \\mathfrak X^*(M) \\longrightarrow \\\
  mathfrak X(M)$\n\n定义为 $F$ 的逆；即\n\n$S = F^{-1}$。\n\n设 $1 \\le k \\le r$ 且 $1 \\le\
  \ l \\le s + 1$ 为整数（从而 $r \\ge 1$ 且 $s \\ge 0$）。$(k,l)$-平坦映射记为\n\n$F_l^k : \\mathcal\
  \ T_s^r(M) \\longrightarrow \\mathcal T_{s+1}^{r-1}(M)$\n\n并定义（使用定理 15.7.2）对所有 $\\\
  mathcal T_s^r(M)$ 中的张量场 $\\mathcal A$、所有 $\\mathfrak X^*(M)$ 中的余向量场 $\\omega^1,\\\
  dots,\\omega^{r-1}$ 以及所有 $\\mathfrak X(M)$ 中的向量场 $X_1,\\dots,X_{s+1}$ 如下，其中 $^\\\
  wedge$ 表示省略一个表达式：\n\n- 对 $r = 1$（从而 $k = 1$）：\n\n$F_l^1(\\mathcal A)(X_1, \\dots,\
  \ X_{s+1}) = \\mathcal A(X_l^F, X_1, \\dots, \\hat X_l, \\dots, X_{s+1})$。\n\n-\
  \ 对 $r \\ge 2$ 且 $1 \\le k \\le r - 1$：\n\n$F_l^k(\\mathcal A)(\\omega^1, \\dots,\
  \ \\omega^{r-1}, X_1, \\dots, X_{s+1}) = \\mathcal A(\\omega^1, \\dots, \\omega^{k-1},\
  \ X_l^F, \\omega^k, \\dots, \\omega^{r-1}, X_1, \\dots, \\hat X_l, \\dots, X_{s+1})$。\n\
  \n- 对 $r \\ge 2$ 且 $k = r$：\n\n$F_l^r(\\mathcal A)(\\omega^1, \\dots, \\omega^{r-1},\
  \ X_1, \\dots, X_{s+1}) = \\mathcal A(\\omega^1, \\dots, \\omega^{r-1}, X_l^F, X_1,\
  \ \\dots, \\hat X_l, \\dots, X_{s+1})$。\n\n类似地，设 $1 \\le k \\le r + 1$ 且 $1 \\le\
  \ l \\le s$ 为整数（从而 $r \\ge 0$ 且 $s \\ge 1$）。$(k,l)$-锐映射记为\n\n$S_l^k : \\mathcal\
  \ T_s^r(M) \\longrightarrow \\mathcal T_{s-1}^{r+1}(M)$\n\n并定义（使用定理 15.7.2）对所有 $\\\
  mathcal T_s^r(M)$ 中的张量场 $\\mathcal A$、所有 $\\mathfrak X^*(M)$ 中的余向量场 $\\omega^1,\\\
  dots,\\omega^{r+1}$ 以及所有 $\\mathfrak X(M)$ 中的向量场 $X_1,\\dots,X_{s-1}$ 如下：\n\n- 对\
  \ $s = 1$（从而 $l = 1$）：\n\n$S_1^k(\\mathcal A)(\\omega^1, \\dots, \\omega^{r+1})\
  \ = \\mathcal A(\\omega^1, \\dots, \\hat\\omega^k, \\dots, \\omega^{r+1}, \\omega^k\
  \ S)$。\n\n- 对 $s \\ge 2$ 且 $1 \\le l \\le s - 1$：\n\n$S_l^k(\\mathcal A)(\\omega^1,\
  \ \\dots, \\omega^{r+1}, X_1, \\dots, X_{s-1}) = \\mathcal A(\\omega^1, \\dots,\
  \ \\hat\\omega^k, \\dots, \\omega^{r+1}, X_1, \\dots, X_{l-1}, \\omega^k S, X_l,\
  \ \\dots, X_{s-1})$。\n\n\n\n\n\n对于 \\(s \\ge 2\\) 且 \\(l=s\\)：\n\n\\[\nS_s^k(A)(\\\
  omega^1,\\ldots,\\omega^{r+1},X_1,\\ldots,X_{s-1})\n= A(\\omega^1,\\ldots,\\widehat{\\\
  omega^k},\\ldots,\\omega^{r+1},X_1,\\ldots,X_{s-1},\\omega^k S).\n\\]\n\n**定理 19.4.3.**\
  \ 在上述设定下，\\(\\Gamma_l^k\\) 与 \\(S_l^k\\) 是互逆的 \\(C^\\infty(M)\\)-模同构。\n\n*证明.* 容易证明\
  \ \\(\\Gamma_l^k\\) 和 \\(S_l^k\\) 是 \\(C^\\infty(M)\\)-模同态。它们互为 \\(C^\\infty(M)\\\
  )-模同构并且互逆，分别由定理 6.3.7 和定理 19.4.2 的流形版本得出。\n\n## 19.5 张量场的表示\n\n光滑流形上张量场的表示已在第 15.7\
  \ 节中讨论过。现在我们利用半黎曼流形所提供的额外结构回到该主题。我们引入第 5.3 节和第 6.4 节中分别介绍的表示映射和标量积映射的光滑流形对应物，并通过第\
  \ 15.5 节和第 15.7 节中定义的刻画映射将它们联系起来。诚然，符号相当繁琐，但其思想本质上是在简单得多的标量积空间背景下引入的那些思想。\n\n设 \\\
  ((M,g)\\) 为半黎曼流形。遵循第 B.5 节，我们记\n\n\\[\n\\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^s,\\\
  mathfrak{X}(M))\n\\]\n\n为从 \\(\\mathfrak{X}(M)^s\\) 到 \\(\\mathfrak{X}(M)\\) 的 \\\
  (C^\\infty(M)\\)-多重线性映射构成的 \\(C^\\infty(M)\\)-模，并记\n\n\\[\n\\operatorname{Mult}_{C^\\\
  infty(M)}(\\mathfrak{X}^*(M)^r\\times\\mathfrak{X}(M)^s,C^\\infty(M))\n\\]\n\n为从\
  \ \\(\\mathfrak{X}^*(M)^r\\times\\mathfrak{X}(M)^s\\) 到 \\(C^\\infty(M)\\) 的 \\\
  (C^\\infty(M)\\)-多重线性映射构成的 \\(C^\\infty(M)\\)-模。\n\n我们定义一个映射\n\n\\[\n\\mathcal{S}_s:\\\
  operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^s,\\mathfrak{X}(M))\\longrightarrow\
  \ \\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^{s+1},C^\\infty(M)),\n\\\
  ]\n\n称为**标量积映射**，定义为\n\n\\[\n\\mathcal{S}_s(\\Psi)(X_1,\\ldots,X_{s+1})=\\langle\
  \ X_1,\\Psi(X_2,\\ldots,X_{s+1})\\rangle\n\\]\n\n对所有 \\(\\operatorname{Mult}_{C^\\\
  infty(M)}(\\mathfrak{X}(M)^s,\\mathfrak{X}(M))\\) 中的映射 \\(\\Psi\\) 以及 \\(\\mathfrak{X}(M)\\\
  ) 中所有向量场 \\(X_1,\\ldots,X_{s+1}\\) 成立。我们注意到 \\(\\mathcal{S}_s\\) 是由 (6.4.1) 定义的映射的光滑流形对应物。\n\
  \n**定理 19.5.1.** 若 \\((M,g)\\) 是半黎曼流形，则 \\(\\mathcal{S}_s\\) 是 \\(C^\\infty(M)\\\
  )-模同构：\n\n\\[\n\\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^s,\\mathfrak{X}(M))\\\
  cong \\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^{s+1},C^\\infty(M)).\n\
  \\]\n\n**证明.** 容易证明 \\(\\mathcal{S}_s\\) 是 \\(C^\\infty(M)\\)-模同态。我们需要证明 \\(\\mathcal{S}_s\\\
  ) 是双射。\n\n**单射性.** 假设 \\(\\Psi\\) 是 \\(\\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^s,\\\
  mathfrak{X}(M))\\) 中的映射且 \\(\\mathcal{S}_s(\\Psi)=0\\)。则对 \\(\\mathfrak{X}(M)\\\
  ) 中所有向量场 \\(X_1,\\ldots,X_{s+1}\\) 以及 \\(M\\) 中所有 \\(p\\)，有 \\(\\langle X_1|_p,\\\
  Psi(X_2,\\ldots,X_{s+1})|_p\\rangle=0\\)。由于 \\(g\\) 非退化，对 \\(\\mathfrak{X}(M)\\\
  ) 中所有向量场 \\(X_2,\\ldots,X_{s+1}\\) 以及 \\(M\\) 中所有 \\(p\\)，有 \\(\\Psi(X_2,\\ldots,X_{s+1})|_p=0\\\
  )。因此，对 \\(\\mathfrak{X}(M)\\) 中所有向量场 \\(X_2,\\ldots,X_{s+1}\\)，有 \\(\\Psi(X_2,\\\
  ldots,X_{s+1})=0\\)。因此 \\(\\Psi=0\\)，所以 \\(\\ker(\\mathcal{S}_s)=\\{0\\}\\)。由定理\
  \ B.5.3，\\(\\mathcal{S}_s\\) 是单射。\n\n**满射性.** 设 \\(\\Upsilon\\) 是 \\(\\operatorname{Mult}_{C^\\\
  infty(M)}(\\mathfrak{X}(M)^{s+1},C^\\infty(M))\\) 中的映射。我们需要找到 \\(\\operatorname{Mult}_{C^\\\
  infty(M)}(\\mathfrak{X}(M)^s,\\mathfrak{X}(M))\\) 中的映射 \\(\\widetilde{\\Upsilon}\\\
  ) 使得 \\(\\mathcal{S}_s(\\widetilde{\\Upsilon})=\\Upsilon\\)。根据定理 19.4.2，定义 \\(\\\
  mathfrak{X}^*(M)\\) 中的余向量场等价于定义 \\(\\mathfrak{X}(M)\\) 中的向量场。对于给定的 \\(\\mathfrak{X}(M)\\\
  ) 中向量场 \\(X_2,\\ldots,X_{s+1}\\)，定义 \\(\\mathfrak{X}^*(M)\\) 中的余向量场 \\(\\widetilde{\\\
  Upsilon}(X_2,\\ldots,X_{s+1})^\\flat\\) 为\n\n\\[\n\\widetilde{\\Upsilon}(X_2,\\\
  ldots,X_{s+1})^\\flat(X_1)=\\Upsilon(X_1,\\ldots,X_{s+1})\n\\]\n\n对所有 \\(\\mathfrak{X}(M)\\\
  ) 中的向量场 \\(X_1\\) 成立。则\n\n\\[\n\\mathcal{S}_s(\\widetilde{\\Upsilon})(X_1,\\ldots,X_{s+1})\n\
  =\\langle X_1,\\widetilde{\\Upsilon}(X_2,\\ldots,X_{s+1})\\rangle\n=\\langle\\widetilde{\\\
  Upsilon}(X_2,\\ldots,X_{s+1}),X_1\\rangle\n=\\widetilde{\\Upsilon}(X_2,\\ldots,X_{s+1})^\\\
  flat(X_1)\n=\\Upsilon(X_1,\\ldots,X_{s+1}).\n\\]\n\n由于 \\(X_1,\\ldots,X_{s+1}\\\
  ) 是任意的，\\(\\mathcal{S}_s(\\widetilde{\\Upsilon})=\\Upsilon\\)。因此，\\(\\mathcal{S}_s\\\
  ) 是满射。□\n\n现在我们来定义一个映射\n\n\\[\n\\mathfrak{R}_s:\\operatorname{Mult}_{C^\\infty(M)}(\\\
  mathfrak{X}(M)^s,\\mathfrak{X}(M))\\longrightarrow\\operatorname{Mult}_{C^\\infty(M)}(\\\

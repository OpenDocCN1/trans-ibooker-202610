  \ \\mathfrak{g}_{jk} \\right) \\operatorname{Grad}(f)^k\n= \\sum_k \\delta^i_k \\\
  operatorname{Grad}(f)^k\n= \\operatorname{Grad}(f)^i.\n$$\n\n### Theorem 20.3.3\n\
  \n若 \\((M,\\mathfrak{g})\\) 为半黎曼 \\(m\\)-流形且 \\(f,g\\) 为 \\(C^\\infty(M)\\) 中的函数，则\n\
  \n$$\n\\operatorname{Grad}(fg) = f\\operatorname{Grad}(g) + g\\operatorname{Grad}(f).\n\
  $$\n\n**Proof.** 根据 Theorem 19.4.3，\\(\\flat\\) 是 \\(C^\\infty(M)\\)-线性的。结果现在由 Theorem\
  \ 15.4.6(b) 和 (20.3.1) 得出。\n\n前述结果与 Theorem 10.6.1(a) 有明显的相似性。\n\n### Example 20.3.4\
  \ \\((\\mathbb{R}_\\nu^m)\\)\n\n设 \\((r^1,\\ldots,r^m)\\)，\\(\\left(\\partial/\\\
  partial r^1,\\ldots,\\partial/\\partial r^m\\right)\\)，和 \\((\\varepsilon_1,\\ldots,\\\
  varepsilon_m)\\) 分别为 \\(\\mathbb{R}_\\nu^m = (\\mathbb{R}^m,\\mathfrak{g})\\) 的标准坐标、对应的标准坐标标架和符号。\
  \ 由于 \\(\\mathfrak{g}^{ij} = \\mathfrak{g}_{ij} = \\varepsilon_i\\delta_{ij}\\)，我们由\
  \ Theorem 20.3.2 得 \\(\\operatorname{Grad}(f)^i = \\varepsilon_i(\\partial f/\\\
  partial r^i)\\)，故\n\n$$\n\\operatorname{Grad}(f) = \\left( \\varepsilon_1 \\frac{\\\
  partial f}{\\partial r^1}, \\ldots, \\varepsilon_m \\frac{\\partial f}{\\partial\
  \ r^m} \\right).\n$$\n\n在 \\(\\mathbb{R}_0^3\\) 中，标准坐标为 \\((x,y,z)\\)，这变为\n\n$$\n\
  \\operatorname{Grad}(f) = \\left( \\frac{\\partial f}{\\partial x}, \\frac{\\partial\
  \ f}{\\partial y}, \\frac{\\partial f}{\\partial z} \\right) = \\operatorname{grad}(f),\n\
  $$\n\n而在 \\(\\mathbb{R}_1^4\\) 中，标准坐标为 \\((x,y,z,t)\\)，它变为\n\n$$\n\\operatorname{Grad}(f)\
  \ = \\left( \\frac{\\partial f}{\\partial x}, \\frac{\\partial f}{\\partial y},\
  \ \\frac{\\partial f}{\\partial z}, -\\frac{\\partial f}{\\partial t} \\right).\n\
  $$\n\nfor \\(i = 1, \\ldots, m\\), where the \\(\\alpha^{ij}\\) are uniquely determined\
  \ functions in \\(C^\\infty(U)\\). Then\n\n$$\n\\langle [X,E_i], E_i \\rangle =\
  \ \\sum_j \\langle E_i, E_j \\rangle \\alpha^{ij} = \\varepsilon_i \\alpha^{ii},\n\
  $$\n\nwhere \\((\\varepsilon_1, \\ldots, \\varepsilon_m)\\) is the signature of\
  \ \\(M\\). It follows from Theorem 20.4.2 that\n\n$$\n\\operatorname{Div}(X)|_U\
  \ = - \\sum_i \\alpha^{ii}.\n$$\n\nThen\n\n$$\n\\begin{aligned}\nf &= f\\,\\Omega_M|_U(E_1,\\\
  ldots,E_m) \\qquad [\\mathrm{Th}\\ 19.10.1] \\\\\n&= \\mathcal{L}_X(\\Omega_M|_U)(E_1,\\\
  ldots,E_m) \\\\\n&= X(\\Omega_M|_U(E_1,\\ldots,E_m)) \\\\\n&\\quad - \\sum_i \\\
  Omega_M|_U(E_1,\\ldots,E_{i-1},[X,E_i],E_{i+1},\\ldots,E_m) \\qquad [\\mathrm{Th}\\\
  \ 16.4.4] \\\\\n&= - \\sum_i \\Omega_M|_U(E_1,\\ldots,E_{i-1},[X,E_i],E_{i+1},\\\
  ldots,E_m) \\qquad [\\mathrm{Th}\\ 19.10.1] \\\\\n&= - \\sum_{ij} \\alpha^{ij}\\\
  ,\\Omega_M|_U(E_1,\\ldots,E_{i-1},E_j,E_{i+1},\\ldots,E_m) \\qquad [(20.4.3)] \\\
  \\\n&= - \\sum_i \\alpha^{ii}\\,\\Omega_M|_U(E_1,\\ldots,E_{i-1},E_i,E_{i+1},\\\
  ldots,E_m) \\qquad [\\mathrm{cf.\\ Th}\\ 7.1.2] \\\\\n&= - \\sum_i \\alpha^{ii}.\
  \ \\qquad [\\mathrm{Th}\\ 19.10.1]\n\\end{aligned}\n$$\n\nThus, \\(\\operatorname{Div}(X)|_U\
  \ = f\\). Since \\(p\\) was arbitrary, the first equality follows. For the second\
  \ equality, we have\n\n$$\n\\begin{aligned}\n\\operatorname{Div}(X)\\,\\Omega_M\n\
  &= \\mathcal{L}_X(\\Omega_M) \\qquad \\text{[first equality]} \\\\\n&= d \\circ\
  \ i_X(\\Omega_M) + i_X \\circ d(\\Omega_M) \\qquad [\\mathrm{Th}\\ 16.5.3] \\\\\n\
  &= d \\circ i_X(\\Omega_M). \\qquad [\\mathrm{cf.\\ Th}\\ 7.2.12(b)]\n\\end{aligned}\n\
  $$\n\n(b): Since \\(X^\\flat\\) is a covector field in \\(\\mathfrak{X}^*(M) = \\\
  Lambda^1(M)\\), we have from (20.2.1) that \\(\\delta = (-1)^{\\nu+1} \\star d \\\
  star\\), where \\(\\nu\\) is the index of \\(M\\). Then\n\n$$\n\\begin{aligned}\n\
  \\operatorname{Div}(X)\n&= \\operatorname{Div}(X)\\,\\star(\\Omega_M) \\qquad [\\\
  mathrm{Th}\\ 20.1.1(b)] \\\\\n&= \\star(\\operatorname{Div}(X)\\,\\Omega_M) \\\\\
  \n&= \\star\\, d(i_X(\\Omega_M)) \\qquad \\text{[part (a)]} \\\\\n&= (-1)^\\nu \\\
  star d \\star (X^\\flat) \\qquad [\\mathrm{Th}\\ 20.1.2] \\\\\n&= -\\delta(X^\\\
  flat).\n\\end{aligned}\n$$\n\n### Theorem 20.4.4\n\n设 \\((M,\\mathfrak{g},\\mathfrak{O})\\\
  ) 为定向半黎曼流形，\\(f\\) 为 \\(C^\\infty(M)\\) 中的函数，\\(X\\) 为 \\(\\mathfrak{X}(M)\\) 中的向量场。则\n\
  \n$$\n\\operatorname{Div}(fX) = f\\operatorname{Div}(X) + \\langle \\operatorname{Grad}(f),\
  \ X \\rangle.\n$$\n\n\n证明：在定理16.5.1(e)中令ω = d(f)和ξ = Ω_M，得到\n\nd(f) ∧ i_X(Ω_M) =\
  \ i_X(d(f)) ∧ Ω_M − i_X(d(f) ∧ Ω_M) = X(f) Ω_M [(16.5.2), 定理7.2.12(b)] = ⟨Grad(f),\
  \ X⟩ Ω_M, [定理20.3.1]\n\n因此\n\nDiv(f X) Ω_M = d(i_{f X}(Ω_M)) [定理20.4.3(a)] = d(f\
  \ i_X(Ω_M)) [定理16.5.1(b)] = d(f) ∧ i_X(Ω_M) + f d(i_X(Ω_M)) [(16.1.1)] = [⟨Grad(f),\
  \ X⟩ + f Div(X)]Ω_M. [定理20.4.3(a)]\n\n由于(Ω_M)是Λ^m(M)的一个基，结论成立。\n\n前面的结果与定理10.6.1(b)明显相似。\n\
  \n## 定理20.4.5（半黎曼流形的散度定理）。设(M, g, \U0001D512)是紧致带边界的定向半黎曼流形，Ω_M为其体积形式，X为\U0001D51B\
  (M)中的向量场。则 ∫_M Div(X) Ω_M = ∫_{∂M} i_X(Ω_M)。\n\n证明：我们有 ∫_M Div(X) Ω_M = ∫_M d(i_X(Ω_M))\
  \ [定理20.4.3(a)] = ∫_{∂M} i_X(Ω_M)。 [定理17.4.1]\n\n## 例20.4.6（ℝ_ν^m）。设(r^1, …, r^m)、(∂/∂r^1,\
  \ …, ∂/∂r^m)和(ε_1, …, ε_m)分别是ℝ_ν^m的标准坐标、相应的标准坐标标架和符号差。由例15.1.6，(∂/∂r^1, …, ∂/∂r^m)\
  \ = (e_1, …, e_m)，其中(e_1, …, e_m)是ℝ_ν^m的标准基。设X = (α^1, …, α^m) = Σ_i α^i e_i = Σ_i\
  \ α^i ∂/∂r^i 是\U0001D51B(ℝ_ν^m)中的向量场。由(18.2.2)、定理19.3.5和定理20.4.1可得Div(X) = Σ_i ∂α^i/∂r^i。\n\
  \n在ℝ_0^3中，使用标准坐标(x, y, z)，这变为Div(X) = ∂α^1/∂x + ∂α^2/∂y + ∂α^3/∂z = div(X)，\n\n\
  而在ℝ_1^4中，使用标准坐标(x, y, z, t)，它变为Div(X) = ∂α^1/∂x + ∂α^2/∂y + ∂α^3/∂z + ∂α^4/∂t。\n\
  \n## 20.5 旋度\n\n设(M,g,\U0001D49F)是指标为ν的定向半黎曼3-流形，Ω_M为其体积形式。旋度是映射\n\n\\[\\operatorname{Curl}:\\\
  mathfrak{X}(M)\\longrightarrow\\mathfrak{X}(M)\\]\n\n定义为\n\n\\[\\operatorname{Curl}(X)^\\\
  mathrm{F}=\\star d(X^\\mathrm{F}) \\tag{20.5.1}\\]\n\n对所有\U0001D51B(M)中的向量场X成立。由于X^F是\U0001D51B\
  ^*(M)=Λ^1(M)中的余向量场，可知d(X^F)是Λ^2(M)中的形式，因此⋆ d(X^F)是Λ^1(M)中的向量场，所以该定义有意义。我们将Curl(X)称为X的旋度。\n\
  \n## 定理20.5.1. 在上述设定下，\n\n\\[i_{\\operatorname{Curl}(X)}(\\Omega_M)=d(X^\\mathrm{F}).\\\
  ]\n\n证明：我们有\n\n\\[i_{\\operatorname{Curl}(X)}(\\Omega_M)=(-1)^\\nu\\star(\\operatorname{Curl}(X)^\\\
  mathrm{F})\\qquad [\\mathrm{Th\\ 20.1.2}]\\]\n\\[\\phantom{i_{\\operatorname{Curl}(X)}(\\\
  Omega_M)}=(-1)^\\nu\\star^2d(X^\\mathrm{F}).\\qquad [(20.5.1)]\\]\n\n由于d(X^F)是Λ^2(M)中的形式，在定理20.1.1(c)中令m=3和s=2可得\n\
  \n\\[\\star^2(d(X^\\mathrm{F}))=(-1)^\\nu d(X^\\mathrm{F}).\\]\n\n结论成立。\n\n尽管定义(20.5.1)显得陌生，下面的例子表明在ℝ^3_0中Curl与经典旋度算子是一致的。\n\
  \n## 例20.5.2.\n\n设(x,y,z)和(d(x),d(y),d(z))分别是ℝ^3_0上的标准坐标和相应的标准对偶坐标标架，并设X=(α^1,α^2,α^3)是\U0001D51B\
  (ℝ^3_0)中的向量场。由定理3.3.2的流形版本，\n\n\\[X^\\mathrm{F}=\\alpha^1d(x)+\\alpha^2d(y)+\\alpha^3d(z).\\\
  ]\n\n则(16.1.2)给出\n\n\\[\nd(X^\\mathrm{F})=\\left(\\frac{\\partial\\alpha^3}{\\partial\
  \ y}-\\frac{\\partial\\alpha^2}{\\partial z}\\right)d(y)\\wedge d(z)+\\left(\\frac{\\\
  partial\\alpha^1}{\\partial z}-\\frac{\\partial\\alpha^3}{\\partial x}\\right)d(z)\\\
  wedge d(x)\n\\]\n\\[\n\\qquad+\\left(\\frac{\\partial\\alpha^2}{\\partial x}-\\\
  frac{\\partial\\alpha^1}{\\partial y}\\right)d(x)\\wedge d(y).\n\\]\n\n因此\n\nCurl(X)^F\
  \ = *d(X^F)\n= (∂α³/∂y - ∂α²/∂z) * (d(y) ∧ d(z)) + (∂α¹/∂z - ∂α³/∂x) * (d(z) ∧ d(x))\n\
  + (∂α²/∂x - ∂α¹/∂y) * (d(x) ∧ d(y))\n= (∂α³/∂y - ∂α²/∂z) d(x) + (∂α¹/∂z - ∂α³/∂x)\
  \ d(y)\n+ (∂α²/∂x - ∂α¹/∂y) d(z)\n= (∂α³/∂y - ∂α²/∂z, ∂α¹/∂z - ∂α³/∂x, ∂α²/∂x -\
  \ ∂α¹/∂y)^F\n= curl(X)^F,\n\n其中第三个等号由例8.5.4得出，第四个等号由定理3.3.2的流形版本得出，最后一个等号由表10.6.1得出。因此，Curl(X)\
  \ = curl(X)。\n\n## 20.6 Hesse算子\n\n设(M, \U0001D524)是半黎曼流形。Hesse算子是映射\n\nHess : C^∞(M)\
  \ ⟶ T₂⁰(M)\n\n定义为\n\nHess(f) = ∇²(f)  (20.6.1)\n\n对所有C^∞(M)中的函数f成立，其中我们记∇ ∘ ∇为∇²。\n\
  \n我们将Hess(f)称为f的海塞（Hessian）。\n\n## 定理20.6.1. 设(M, \U0001D524)是半黎曼m-流形，f是C^∞(M)中的函数，X、Y是\U0001D51B\
  (M)中的向量场。则：\n\n- (a)\n\nHess(f)(X, Y) = X(Y(f)) - ∇_X(Y)(f)\n= ∇_X(∇_Y(f)) - ∇_{∇_X(Y)}(f)\n\
  = ⟨∇_X(Grad(f)), Y⟩。\n\n- (b) Hess(f)是对称的。\n\n证明：(a)：前两个等号由(18.4.3)得出。我们有\n\nX(Y(f))\
  \ = X(⟨Grad(f), Y⟩)  [定理20.3.1]\n= ⟨∇_X(Grad(f)), Y⟩ + ⟨Grad(f), ∇_X(Y)⟩  [(19.3.1)]\n\
  = ⟨∇_X(Grad(f)), Y⟩ + ∇_X(Y)(f)。  [定理20.3.1]\n\n第三个等号现在由第一个等号得出。\n\n(b)：由于Levi-Civita联络∇是对称的，\n\
  \n∇_X(Y)(f) − ∇_Y(X)(f) = [X,Y](f) = X(Y(f)) − Y(X(f)),\n\n所以\n\nHess(f)(X, Y) =\
  \ X(Y(f)) − ∇_X(Y)(f)  [部分(a)]\n= Y(X(f)) − ∇_Y(X)(f)\n= Hess(f)(Y, X)。  [部分(a)]\n\
  \n## 定理20.6.2（Hesse算子的局部坐标表达式）。如果(M, g)是半黎曼m-流形，且f是C^∞(M)中的函数，则在局部坐标下，Hess(f)的分量为\n\
  \nHess(f)_{ij} = ∂²f/∂x^i∂x^j − Σ_k Γ^k_{ij} ∂f/∂x^k\n\n对i, j = 1, …, m。\n\n证明：我们有\n\
  \nHess(f)_{ij} = Hess(f)(∂/∂x^i, ∂/∂x^j)\n= ∂/∂x^i (∂f/∂x^j) − ∇_{∂/∂x^i}(∂/∂x^j)(f)\
  \  [定理20.6.1(a)]\n= ∂²f/∂x^i∂x^j − Σ_k Γ^k_{ij} ∂f/∂x^k。  [(18.2.1)]\n\n## 例20.6.3（ℝ^m_ν）。设(r¹,\
  \ …, r^m)和(∂/∂r¹, …, ∂/∂r^m)分别是ℝ^m_ν上的标准坐标和相应的标准坐标标架。由定理19.3.5和定理20.6.2可得\n\nHess(f)_{ij}\
  \ = ∂²f/∂r^i∂r^j\n\n对i, j = 1, …, m。\n\n## 20.7 拉普拉斯算子\n\n设$(M,\\mathfrak{g})$是半黎曼流形。拉普拉斯算子是映射\n\
  \nLap : $C^{\\infty}(M) \\longrightarrow C^{\\infty}(M)$\n\n定义为\n\nLap$(f) = \\\
  text{Div} \\circ \\text{Grad}(f)$ (20.7.1)\n\n对所有$C^{\\infty}(M)$中的函数$f$成立。我们将Lap$(f)$称为$f$的拉普拉斯量（Laplacian）。\n\
  \n## 定理20.7.1. 如果$(M,\\mathfrak{g})$是半黎曼流形，且$f$是$C^{\\infty}(M)$中的函数，则\n\nLap$(f)\
  \ = C_{12} \\circ \\text{Hess}(f)$。\n\n证明：我们有\n\nLap$(f) = \\text{Div} \\circ \\\
  text{Grad}(f)$\n$= C_{1}^{1} \\circ \\nabla \\circ S_{1}^{1}(d(f))$ [流形版本的练习6.3.1,\
  \ (20.3.1), (20.4.1)]\n$= C_{1}^{1} \\circ S_{1}^{1} \\circ \\nabla(\\nabla(f))$\
  \ [定理18.4.3, 定理19.6.3]\n$= C_{1}^{1} \\circ S_{1}^{1} \\circ \\nabla^{2}(f)$\n$=\
  \ C_{12} \\circ \\text{Hess}(f)$。 [(19.6.3), (20.6.1)]\n\n## 定理20.7.2（拉普拉斯算子的标准正交标架表达式）。设$(M,\\\
  mathfrak{g})$是带有符号差$(\\varepsilon_{1},...,\\varepsilon_{m})$的半黎曼流形，$f$是$C^{\\infty}(M)$中的函数，$(E_{1},...,E_{m})$是$M$中开集$U$上的标准正交标架。则\n\
  \nLap$(f) = \\sum_{i} \\varepsilon_{i} \\text{Hess}(f)(E_{i},E_{i})$\n\n在$U$上成立。\n\
  \n证明：这可由定理19.6.2(b)和定理20.7.1得出。\n\n## 例20.7.3（$\\mathbb{R}_{\\nu}^{m}$）。设$(r^{1},...,r^{m})$、$(\\\
  partial/\\partial r^{1},...,\\partial/\\partial r^{m})$和$(\\varepsilon_{1},...,\\\
  varepsilon_{m})$分别是$\\mathbb{R}_{\\nu}^{m}$的标准坐标、相应的标准坐标标架和符号差。由例20.6.3，我们有\n\n\
  Hess$(f)\\left(\\frac{\\partial}{\\partial r^{i}},\\frac{\\partial}{\\partial r^{j}}\\\
  right) = \\text{Hess}(f)_{ij} = \\frac{\\partial^{2} f}{\\partial r^{i}\\partial\
  \ r^{j}}$,\n\n并且由例15.1.6，$(\\partial/\\partial r^{1},...,\\partial/\\partial r^{m})\
  \ = (e_{1},...,e_{m})$，其中$(e_{1},...,e_{m})$是$\\mathbb{R}_{\\nu}^{m}$的标准基。因此，$(\\\
  partial/\\partial r^{1},...,\\partial/\\partial r^{m})$是$\\mathbb{R}_{\\nu}^{m}$上的一个标准正交标架。那么定理20.7.2给出\n\
  \nLap$(f) = \\sum_{i} \\varepsilon_{i} \\frac{\\partial^{2} f}{\\partial (r^{i})^{2}}$。\n\
  \n\n\n\n在 ℝ₀³ 中，使用标准坐标 (x, y, z)，它变为\n\nLap(f) = ∂²f/∂x² + ∂²f/∂y² + ∂²f/∂z² = lap(f),\n\
  \n而在 ℝ₁⁴ 中，使用标准坐标 (x, y, z, t)，它为\n\nLap(f) = ∂²f/∂x² + ∂²f/∂y² + ∂²f/∂z² − ∂²f/∂t².\n\
  \n在物理文献中，Lap 在 ℝ₁⁴ 的上下文中通常用 □ 表示（有时用 □²）并称为 d’Alembert 算子。\n\n## 20.8 Laplace–de\
  \ Rham 算子\n\n设 (M, \U0001D524, \U0001D512) 为定向半黎曼流形。Laplace–de Rham 算子是线性映射族\n\n\
  Δ : Λˢ(M) ⟶ Λˢ(M)\n\n定义为 1 ≤ s ≤ m 时\n\nΔ = dδ + δd;  (20.8.1)\n\n即\n\nΔ(ω) = dδ(ω)\
  \ + δd(ω)\n\n对所有 Λˢ(M) 中的形式 ω 成立。由定理 16.1.1(c) 回顾 d² = 0，且由定理 20.2.1(a) 得 δ² = 0。因此，\n\
  \n(d + δ) ∘ (d + δ) = d² + dδ + δd + δ² = Δ,\n\n可表示为\n\nΔ = (d + δ)².\n\n下一个结果表明，除符号外，Laplace–de\
  \ Rham 算子是 Laplace 算子的推广。\n\n## 定理 20.8.1. 若 (M, \U0001D524, \U0001D512) 为定向半黎曼流形且\
  \ f 为 C^∞(M) 中的函数，则\n\nLap(f) = −Δ(f).\n\n证明. 我们有\n\nLap(f) = Div(Grad(f))  [(20.7.1)]\n\
  = −δ(Grad(f)^♭)  [Th 20.4.3(b)]\n= −δd(f)  [(20.3.2)]\n= −(dδ + δd)(f)  [(20.2.2)]\n\
  = −Δ(f).  [(20.8.1)]\n\n### 20.9 对称 2-协变张量场的散度\n\n设 (M,g) 为半黎曼流形，且 Σ(M) 为 \U0001D4AF\
  ⁰₂(M) 的子空间，由对称 (2-协变) 张量场组成。例如，g 在 Σ(M) 中。**对称 2-协变张量场的散度** 是映射\n\n$$\\operatorname{Div}:\\\
  Sigma(M)\\longrightarrow \\mathfrak{X}^*(M)$$\n\n定义为\n\n$$\\operatorname{Div}(\\\
  mathcal{A})=C_{13}\\circ\\nabla(\\mathcal{A})$$\n\n对所有 Σ(M) 中的张量场 \U0001D49C 成立。由于\
  \ ∇(\U0001D49C) 在 \U0001D4AF⁰₃(M) 中，C₁₃(∇(\U0001D49C)) 在 \U0001D4AF⁰₁(M)=\U0001D51B\
  *(M) 中，故定义有意义。顺便指出，由定理 19.3.1，∇(g)=0，故 Div(g)=0.\n\n**定理 20.9.1 (散度的正交标架表达式).**\
  \ 设 (M,g) 为签名为 (ε₁,…,εₘ) 的半黎曼流形，(E₁,…,Eₘ) 为 M 中开集 U 上的正交标架，\U0001D49C 为 \U0001D4AF\
  ⁰₂(M) 中的对称张量场，X 为 \U0001D51B(M) 中的向量场。则\n\n$$\\operatorname{Div}(\\mathcal{A})(X)=\\\
  sum_i\\epsilon_i\\nabla_{E_i}(\\mathcal{A})(X,E_i)=\\sum_i\\epsilon_i\\nabla_{E_i}(\\\
  mathcal{A})(E_i,X)$$\n\n在 U 上成立。\n\n*证明.* 我们有\n\n$$\\begin{aligned}\n\\operatorname{Div}(\\\
  mathcal{A})(X)&=C_{13}(\\nabla(\\mathcal{A}))(X)\\\\\n&=\\sum_i\\epsilon_i\\nabla(\\\
  mathcal{A})(E_i,X,E_i)\\qquad [\\text{Th 19.6.2(a)}]\\\\\n&=\\sum_i\\epsilon_i\\\
  nabla_{E_i}(\\mathcal{A})(X,E_i),\\qquad [(18.4.1)]\n\\end{aligned}$$\n\n这证明了第一个等式。容易利用\
  \ (18.1.3) 证明由于 \U0001D49C 对称，∇_{E_i}(\U0001D49C) 也是对称的。第二个等式现在由第一个等式得出。□\n\n**定理\
  \ 20.9.2.** 若 (M,g) 为半黎曼流形且 f 为 C^∞(M) 中的函数，则\n\n$$\\operatorname{Div}(fg)=d(f).$$\n\
  \n*证明.* 设 (ε₁,…,εₘ) 为 M 的签名，p 为 M 中的点。由定理 19.3.7，存在 p 的邻域 U 上的正交标架 (E₁,…,Eₘ)。设 X\
  \ 为 \U0001D51B(M) 中的向量场，且 X=∑ᵢαⁱEᵢ 在 U 上，其中 αⁱ 为 C^∞(U) 中唯一确定的函数。由流形版本的定理 4.2.7，\n\
  \n$$X=\\sum_i\\epsilon_i\\langle X,E_i\\rangle E_i.\\tag{20.9.1}$$\n\n由定理 19.3.8，\n\
  \n$$\\nabla_{E_i}(fg)=\\nabla_{E_i}(g\\otimes f)=g\\otimes\\nabla_{E_i}(f)=\\nabla_{E_i}(f)g,$$\n\
  \n故\n\n$$\\nabla_{E_i}(fg)(X,E_i)=\\nabla_{E_i}(f)g(X,E_i)=\\langle X,E_i\\rangle\\\
  nabla_{E_i}(f). \\tag{20.9.2}$$\n\n则\n\n$$d(f)(X)=X(f) \\qquad\\text{[Th 15.4.5(b)]}$$\n\
  \n$$\\qquad=\\sum_i\\varepsilon_i\\langle X,E_i\\rangle\\nabla_{E_i}(f) \\qquad\\\
  text{[(18.1.1), (20.9.1)]}$$\n\n$$\\qquad=\\sum_i\\varepsilon_i\\nabla_{E_i}(fg)(X,E_i)\
  \ \\qquad\\text{[(20.9.2)]}$$\n\n$$\\qquad=\\operatorname{Div}(fg)(X). \\qquad\\\
  text{[Th 20.9.1]}$$\n\n由于 X 和 p 任意，结果得证。\n\n其中第二个等式由定理 14.7.1(b) 推出，第三个等式由定理 10.1.10\
  \ 推出，最后一个等式由定理 14.9.2 推出。则\n\n$$\\left\\langle \\frac{d\\lambda}{ds}(s),\\frac{d\\\
  lambda}{ds}(s)\\right\\rangle = \\left(\\frac{dr}{ds}(s)\\right)^2\\left\\langle\
  \ \\frac{\\partial\\sigma}{\\partial r}(r(s),s),\\frac{\\partial\\sigma}{\\partial\

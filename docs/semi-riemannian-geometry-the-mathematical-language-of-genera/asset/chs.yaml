  j₁...jₛ₋₂ = Cₖⁿ ∘ Sₖ₊₁ⁿ(\U0001D49C)ⁱ₁...ⁱʳ\nj₁...jₛ₋₂\n= ∑ₚq \U0001D524ᵖq \U0001D49C\
  ⁱ₁...ⁱʳ\nj₁...jₖ₋₁ p q jₖ...jₛ₋₂. (6.3.3)\n\n证明。由定理 6.3.4，张量 Sₗⁿ(\U0001D49C) 在 \U0001D4AF\

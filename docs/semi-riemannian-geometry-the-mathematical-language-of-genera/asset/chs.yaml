  dots,h_{l_s})\\) 得到 \\(a^{k_1\\dots k_r}_{l_1\\dots l_s} = 0\\)。因此，\\(h_{i_1} \\\
  otimes \\cdots \\otimes h_{i_r} \\otimes \\theta^{j_1} \\otimes \\cdots \\otimes\
  \ \\theta^{j_s}\\) 是线性无关的。(c)：由(a)部分直接得出。\n\n我们从定理5.1.3可以看出，一个张量完全由其关于给定基的分量决定。事实上，这正是定义张量的经典方式。选择另一组基通常会使分量取不同的值。下一个结果展示了当从一组基变换到另一组基时如何转换分量。\n\
  \n**定理5.1.4（基变换）。** 设 \\(V\\) 为向量空间，设 \\(\\mathcal{H}\\) 和 \\(\\widetilde{\\mathcal{H}}\\\
  ) 为 \\(V\\) 的基，并设 \\([\\mathrm{id}_V]_{\\widetilde{\\mathcal{H}}}^{\\mathcal{H}}\

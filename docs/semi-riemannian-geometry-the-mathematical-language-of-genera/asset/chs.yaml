  \ \\star(\\zeta) = (-1)^{\\nu}\\langle\\eta,\\zeta\\rangle^{\\Lambda}\\Omega_V$。\n\
  \n\n\n\n\n证明. (b): 回顾 (7.1.3) 中 Λ⁰(V) = ℝ。 由于 1 和 ⋆(Ω_V) 都在 Λ⁰(V) 中，根据定理 8.5.1，\n\
  \nΩ_V = Ω_V ∧ 1 = ⟨⋆(Ω_V), 1⟩^∧ Ω_V = ⋆(Ω_V) Ω_V,\n\n故 ⋆(Ω_V) = 1。\n\n(c): 我们有\n\
  ⋆²(ξ^I) = ⋆(⋆(ξ^I))\n= ⋆(sgn(σ_(I,I^c))⟨ξ^{I^c}, ξ^{I^c}⟩^∧ ξ^{I^c})   [Th 8.5.2]\n\
  = sgn(σ_(I,I^c))⟨ξ^{I^c}, ξ^{I^c}⟩^∧ ⋆(ξ^{I^c})\n= sgn(σ_(I,I^c))⟨ξ^{I^c}, ξ^{I^c}⟩^∧\
  \ sgn(σ_(I^c,I))⟨ξ^I, ξ^I⟩^∧ ξ^I   [Th 8.5.2]\n= (−1)^{s(m−s)+ν} ξ^I.   [Th 7.5.2,\
  \ Th B:2.5]\n\n由于 ξ^I 张成 Λ^s(V)，⋆ 的线性性可得 η 的结果。\n\n(a): 我们有\n⋆(1) = ⋆²(Ω_V)    \
  \  [部分 (b)]\n= (−1)^ν Ω_V.      [部分 (c), s = m]\n\n(d): 我们有\nη ∧ ⋆(ζ) = (−1)^{s(m−s)}\
  \ ⋆(ζ) ∧ η      [Th 7.2.3(a)]\n= (−1)^{s(m−s)} ⋆²(ζ), η⟩^∧ Ω_V      [Th 8.5.1]\n\
  = (−1)^{s(m−s)} (−1)^{s(m−s)+ν}⟨ζ, η⟩^∧ Ω_V      [部分 (c)]\n= (−1)^ν⟨η, ζ⟩^∧ Ω_V.\n\
  \n## 示例 8.5.4 (ℝ₀³ 上的 Hodge 星)。 设 ℰ 为 ℝ₀³ 的标准基，(ξ¹, ξ², ξ³) 为其对偶基。 利用定理 7.5.2 和定理\

  \ |\n\n## 定理 12.2.12（超二次曲面）。设 $q$ 为对应于 $\\mathbb{R}^3_\\nu$ 的二次函数，设 $Q^2$ 为 $\\\
  mathbb{R}^3_\\nu$ 中的超二次曲面，且 $p$ 为 $Q^2$ 中的一点。则：\n\n+   (a) $Q^2$ 是 $\\mathbb{R}^3_\\\
  nu$ 中的正则曲面；即 $S^2$ 是 $\\mathbb{R}^3_0$ 中的正则曲面，且 $P^2$ 和 $H^2$ 是 $\\mathbb{R}^3_1$\
  \ 中的正则曲面。\n\n+   (b)\n\nGrad(q)_p / ||Grad(q)_p|| = p.\n\n+   (c) $p$ 是 $T_p(Q^2)^\\\

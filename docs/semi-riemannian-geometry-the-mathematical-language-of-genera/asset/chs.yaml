  \ U$，使得 $F|_{U'}$ 光滑，则 $F$ 光滑。\n\n### 定理 10.1.12.\n\n设 $U$ 和 $V$ 分别是 $\\mathbb{R}^m$\
  \ 和 $\\mathbb{R}^n$ 中的开集，并设 $F : U \\longrightarrow \\mathbb{R}^n$ 与 $G : V \\longrightarrow\
  \ \\mathbb{R}^k$ 是映射，且 $F(U) \\subseteq V$。若 $F$ 和 $G$ 光滑，则 $G \\circ F$ 也光滑。\n\n\
  $\\mathbb{R}^m$ 中的一条（参数化）曲线是一个映射 $\\lambda : I \\longrightarrow \\mathbb{R}^m$，其中\
  \ $I$ 是 $\\mathbb{R}$ 中的一个区间，可以是开的、闭的、半开的或半闭的，并且不排除 $I$ 为无限区间的可能。我们将重点讨论 $I$ 为有限开区间的情形，通常记为\
  \ $(a,b)$。我们不必单独说明曲线的自变量（通常记为 $t$，有时记为 $u$），而是将其直接纳入 $\\lambda$ 的记号中，如 $\\lambda(t)\
  \ : (a,b) \\longrightarrow \\mathbb{R}^m$。设 $\\lambda = (\\lambda^1,\\dots,\\lambda^m)$。按定义，$\\\
  lambda$ 在 $(a,b)$ 上光滑当且仅当 $\\lambda^i$ 对 $i = 1,\\dots,m$ 都光滑。\n\n假设 $\\lambda$\
  \ 确实是光滑的。$\\lambda$ 的（欧氏）速度和 $\\lambda$ 的（欧氏）加速度分别是光滑曲线\n$$\n\\frac{d\\lambda}{dt}(t)\
  \ : (a,b) \\longrightarrow \\mathbb{R}^m\n\\quad \\text{与} \\quad\n\\frac{d^2\\\
  lambda}{dt^2}(t) : (a,b) \\longrightarrow \\mathbb{R}^m,\n$$\n即\n$$\n\\frac{d\\\
  lambda}{dt}(t) = \\left(\\frac{d\\lambda^1}{dt}(t),\\dots,\\frac{d\\lambda^m}{dt}(t)\\\
  right)\n$$\n且\n$$\n\\frac{d^2\\lambda}{dt^2}(t) = \\left(\\frac{d^2\\lambda^1}{dt^2}(t),\\\
  dots,\\frac{d^2\\lambda^m}{dt^2}(t)\\right)\n$$\n对所有 $t \\in (a,b)$ 成立。\n\n### 定理\
  \ 10.1.13.\n\n设 $U$ 是 $\\mathbb{R}^m$ 中的一个开集，$p$ 是 $U$ 中的一点，$v$ 是 $\\mathbb{R}^m$\
  \ 中的一个向量。则存在实数 $\\varepsilon > 0$ 和一条光滑曲线 $\\lambda(t):(-\\varepsilon,\\varepsilon)\\\
  longrightarrow U$，使得 $\\lambda(0)=p$ 且 $(d\\lambda/dt)(0)=v$。\n\n**证明：** 定义光滑曲线\
  \ $\\lambda(t):(-\\varepsilon,\\varepsilon)\\longrightarrow U$ 为 $\\lambda(t)=p+tv$，其中\
  \ $\\varepsilon$ 取得足够小，使得 $\\lambda((-\\varepsilon,\\varepsilon))\\subset U$。显然，$\\\
  lambda$ 具有所需性质。\n\n下一个结果是后续讨论“向量”和“切空间”的关键。\n\n### 定理 10.1.14.\n\n设 $U$ 是 $\\mathbb{R}^m$\
  \ 中的一个开集，$F:U\\longrightarrow\\mathbb{R}^n$ 是一个映射，$p$ 是 $U$ 中的一点，$v$ 是 $\\mathbb{R}^m$\
  \ 中的一个向量。则：\n\n- (a) 若 $F$ 在 $p$ 处可微，则\n\n$$\nd_p(F)(v)=\\frac{d(F\\circ\\lambda)}{dt}(t_0),\n\
  $$\n\n其中 $\\lambda(t):(a,b)\\longrightarrow U$ 是任意满足 $\\lambda(t_0)=p$ 且 $(d\\lambda/dt)(t_0)=v$\
  \ 的光滑曲线，$t_0$ 是 $(a,b)$ 中的某一点（如定理 10.1.13 所保证）。\n\n- (b) 若 $\\psi(t):(a,b)\\longrightarrow\
  \ U$ 是一条光滑曲线，则\n\n$$\nd_{\\psi(t)}(F)\\left(\\frac{d\\psi}{dt}(t)\\right)=\\frac{d(F\\\
  circ\\psi)}{dt}(t)\n$$\n\n对所有 $t \\in (a,b)$ 成立。\n\n**证明： (a)：** 设 $v=(a^1,\\ldots,a^m)$，$\\\
  lambda=(\\lambda^1,\\ldots,\\lambda^m)$，$F=(F^1,\\ldots,F^n)$。则 $F\\circ\\lambda=(F^1\\\
  circ\\lambda,\\ldots,F^n\\circ\\lambda)$，所以\n\n$$\n\\frac{d(F\\circ\\lambda)}{dt}(t_0)=\\\
  left(\\frac{d(F^1\\circ\\lambda)}{dt}(t_0),\\ldots,\\frac{d(F^n\\circ\\lambda)}{dt}(t_0)\\\
  right).\n$$\n\n我们有\n\n$$\n\\frac{d(F^j\\circ\\lambda)}{dt}(t_0)\n=\\sum_i\\frac{\\\
  partial F^j}{\\partial x^i}(\\lambda(t_0))\\frac{d\\lambda^i}{dt}(t_0)\n\\quad[\\\
  text{Thm. 10.1.10}]\n$$\n$$\n=\\sum_i a^i\\frac{\\partial F^j}{\\partial x^i}(p)\n\
  =d_p(F^j)(v)\n\\quad[\\text{Thm. 10.1.2}]\n$$\n\n对 $j=1,\\ldots,n$ 成立。因此，\n\n$$\n\
  \\frac{d(F\\circ\\lambda)}{dt}(t_0)=\\left(d_p(F^1)(v),\\ldots,d_p(F^n)(v)\\right)=d_p(F)(v),\n\
  $$\n\n其中最后一个等式由定理 10.1.8(b) 得出。\n\n(b)：这由 (a) 部分直接得出。\n\n并非所有我们感兴趣的映射的定义域都是开集。因此，我们需要一个“推广”的光滑性定义来处理定义在未必是开集的集合上的映射。设\
  \ $S$ 是 $\\mathbb{R}^m$ 的任意子集，并设 $F:S\\to\\mathbb{R}^n$ 是一个映射。若对 $S$ 中每一点 $p$，都存在\
  \ $p$ 在 $\\mathbb{R}^m$ 中的一个邻域 $\\mathcal{U}$ 以及一个（欧氏）光滑映射 $\\widetilde F:\\mathcal{U}\\\
  to\\mathbb{R}^n$，使得 $F$ 与 $\\widetilde F$ 在 $S\\cap\\mathcal{U}$ 上一致，即 $F|_{S\\\
  cap\\mathcal{U}}=\\widetilde F|_{S\\cap\\mathcal{U}}$，则称 $F$ 在 $S$ 上是（推广）光滑的。尽管在上述定义中\
  \ $\\mathcal{U}$ 和 $\\widetilde F$ 都可能取决于 $p$，下一个结果表明这种依赖性是可以避免的。\n\n### 定理 10.1.15.\n\
  \n设 $S$ 是 $\\mathbb{R}^m$ 的一个子集，并设 $F:S\\to\\mathbb{R}^n$ 是一个映射。则 $F$ 是（推广）光滑的，当且仅当存在\
  \ $\\mathbb{R}^m$ 中包含 $S$ 的一个开集 $\\mathcal{U}$ 以及一个（欧氏）光滑映射 $\\widetilde F:\\mathcal{U}\\\
  to\\mathbb{R}^n$，使得 $F$ 与 $\\widetilde F$ 在 $S$ 上一致，即 $F=\\widetilde F|_S$。\n\n\
  例如，曲线 $\\lambda(t):[a,b]\\to\\mathbb{R}^m$ 是光滑的，当且仅当存在包含 $[a,b]$ 的区间 $(\\widetilde\
  \ a,\\widetilde b)$ 以及一条光滑曲线 $\\widetilde\\lambda(t):(\\widetilde a,\\widetilde\
  \ b)\\to\\mathbb{R}^m$，使得 $\\lambda=\\widetilde\\lambda|_{[a,b]}$。\n\n### 定理 10.1.16.\n\
  \n设 $S$ 是 $\\mathbb{R}^m$ 的一个子集，并设 $F:S\\to\\mathbb{R}^n$ 是一个映射。若 $F$ 是（推广）光滑的，则它是连续的。\n\
  \n### 定理 10.1.17.\n\n设 $S$ 和 $T$ 分别是 $\\mathbb{R}^m$ 和 $\\mathbb{R}^n$ 的子集，并设 $F:S\\\
  to\\mathbb{R}^n$ 与 $G:T\\to\\mathbb{R}^k$ 是映射，且 $F(S)\\subseteq T$。若 $F$ 和 $G$ 是（推广）光滑的，则\
  \ $G\\circ F$ 也是（推广）光滑的。\n\n## 10.2 浸入与微分同胚\n\n设 $U$ 是 $\\mathbb{R}^m$ 中的一个开集，$F:U\\\
  to\\mathbb{R}^n$ 是一个光滑映射，其中 $m\\le n$，$p$ 是 $U$ 中的一点。由于 $F$ 在 $U$ 上光滑，从而在 $p$ 处可微，由第\
  \ 10.1 节的注记可知，$d_p(F)(\\mathbb{R}^m)$ 可以被看作 $F$ 的图像在 $F(p)$ 处的“切空间”。若微分映射 $d_p(F):\\\
  mathbb{R}^m\\to\\mathbb{R}^n$ 是单射，则称 $F$ 在 $p$ 处是浸入；若 $F$ 在 $U$ 中每一点 $p$ 处都是浸入，则称\
  \ $F$（在 $U$ 上）是浸入。\n\n下面的结果给出了刻画浸入的其他等价方式。\n\n### 定理 10.2.1.\n\n设 $U$ 是 $\\mathbb{R}^m$\
  \ 中的一个开集，$F:U\\to\\mathbb{R}^n$ 是一个光滑映射，其中 $m\\le n$，$p$ 是 $U$ 中的一点。则下列条件等价：\n\n\
  - (a) $F$ 在 $p$ 处是浸入。\n- (b) $d_p(F)(\\mathbb{R}^m)$ 是 $m$ 维的。\n- (c) $J_F(p)$ 的秩为\
  \ $m$。\n\n若 $m=n$，则下列每个条件都与上述条件等价：\n\n- (d) $d_p(F)$ 是线性同构。\n- (e) $\\det(J_F(p))\\\
  ne 0$。\n\n**证明：** (a) 与 (b) 的等价性由定理 1.1.12 得出，(b) 与 (c) 的等价性由 (10.1.3) 得出。(d) 与\
  \ (e) 的等价性由定理 2.5.3 得出。当 $m=n$ 时，(c) 与 (e) 的等价性由定理 2.4.8 得出。\n\n设 $U$ 是 $\\mathbb{R}^m$\
  \ 中的一个开集，并设 $F,G:U\\to\\mathbb{R}^m$ 是光滑映射，$p$ 是 $U$ 中的一点，这里注意 $F$ 和 $G$ 的定义域和陪域都是\
  \ $\\mathbb{R}^m$ 的子集。若 $F(U)$ 在 $\\mathbb{R}^m$ 中是开的，$F:U\\to F(U)$ 是双射，且 $F^{-1}:F(U)\\\
  to\\mathbb{R}^m$ 光滑，则称 $F:U\\to F(U)$ 是一个**微分同胚**，并称 $U$ 与 $F(U)$ 是**微分同胚的**。若存在\
  \ $p$ 在 $\\mathbb{R}^m$ 中的邻域 $U'\\subset U$ 以及 $G(p)$ 在 $\\mathbb{R}^m$ 中的邻域 $V$，使得\
  \ $G|_{U'}:U'\\to V$ 是一个微分同胚，则称 $G$ 在 $p$ 处是一个**在 $p$ 处的局部微分同胚**。若 $G$ 在 $U$ 中每一点\
  \ $p$ 处都是局部微分同胚，则称 $G$（在 $U$ 上）是一个**（在 $U$ 上的）局部微分同胚**。显然，每个微分同胚都是局部微分同胚。\n\n利用第\
  \ 10.1 节中给出的光滑性的推广定义，可以直接得到上述定义的“推广”版本。\n\n### 例 10.2.2.\n\n设 $D=\\{(x,y)\\in\\\
  mathbb{R}^2:\\sqrt{x^2+y^2}<1\\}$ 是 $\\mathbb{R}^2$ 中的单位开圆盘，并回忆第 9.4 节中的映射 $F:D\\\
  to\\mathbb{R}^2$，其定义为\n\n$$\nF(x,y)=\\frac{1}{\\sqrt{1-x^2-y^2}}(x,y).\n$$\n\n可以证明\
  \ $F$ 是一个微分同胚。因此，$D$ 与整个 $\\mathbb{R}^2$ 微分同胚。\n\n### 定理 10.2.3（逆映射定理）.\n\n设 $U$\
  \ 是 $\\mathbb{R}^m$ 中的一个开集，$F:U\\to\\mathbb{R}^m$ 是一个光滑映射，$p$ 是 $U$ 中的一点。则 $F$ 在\
  \ $p$ 处是局部微分同胚，当且仅当它在 $p$ 处是浸入。因此，$F$ 在 $U$ 上是局部微分同胚，当且仅当它在 $U$ 上是浸入。\n\n逆映射定理（也称为反函数定理）强调了“光滑性”与“切空间”之间的密切联系。它是分析学中最重要的结果之一，我们将会反复引用它。\n\
  \n### 定理 10.2.4.\n\n设 $f(t):(a,b)\\to(c,d)$ 是一个光滑函数。则：\n\n- (a) 若 $f$ 是一个微分同胚，则\
  \ $df/dt$ 处处非零。\n- (b) 若 $df/dt$ 处处非零，则 $f$ 要么严格递增，要么严格递减。\n- (c) 若 $f$ 是一个微分同胚，则它要么严格递增，要么严格递减。\n\
  \n**证明：** (a)：由于 $f^{-1}\\circ f(t)=t$，由定理 10.1.10，\n\n$$\n\\frac{df^{-1}}{dt}(f(t))\\\
  frac{df}{dt}(t)=1\n$$\n\n对所有 $t \\in (a,b)$ 成立。结论得证。\n\n(b)：对 $(a,b)$ 中的一点 $t_2$，有\
  \ $(df/dt)(t_2)\\ne0$。假设 $(df/dt)(t_2)>0$。由于 $f$ 光滑，$df/dt$ 也光滑，因此，由定理 10.1.1，$df/dt$\
  \ 是\n\n\n连续。若存在点 $t_1\\in(a,b)$ 使得 $(df/dt)(t_1)<0$，则由定理 9.1.19，存在点 $t_0\\in(c,d)$\
  \ 使得 $(df/dt)(t_0)=0$，这与 $df/dt$ 处处非零的假设矛盾。因此，对所有 $t\\in(a,b)$ 有 $(df/dt)(t)>0$；即\
  \ $f$ 严格递增。类似地，若 $(df/dt)(t_2)<0$，则 $f$ 严格递减。\n\n$(c)$：这由（a）和（b）部分得出。\n\n## 10.3\
  \ 欧几里得导数与向量场\n\n设 $U$ 是 $\\mathbb{R}^m$ 中的开集，$X:U\\to\\mathbb{R}^m$ 是一个映射，这里我们注意到\
  \ $X$ 的定义域和陪域都是 $\\mathbb{R}^m$ 的子集。在当前语境下，我们把 $X$ 称为**（$U$ 上的）向量场**。为了突出向量场的形式并将其与其他类型的映射区分开来，我们记\n\
  \n$X(p)\\quad\\text{用}\\quad X_p$\n\n表示，对所有 $p\\in U$。我们说 $X$ 在 $p$ 处**为零**，若 $X_p=(0,\\\
  ldots,0)$；在 $p$ 处**非零**，若 $X_p\\ne(0,\\ldots,0)$；并且**在 $U$ 上处处非零**，若它在每个 $p\\in\
  \ U$ 处都非零。\n\n我们用 $\\mathfrak{X}(U)$ 表示 $U$ 上光滑向量场的集合。通过如下定义运算，我们使 $\\mathfrak{X}(U)$\
  \ 同时成为 $\\mathbb{R}$ 上的向量空间和 $C^\\infty(U)$ 上的模：对所有向量场 $X,Y\\in\\mathfrak{X}(U)$、所有函数\
  \ $f\\in C^\\infty(U)$ 以及所有实数 $c$，令\n\n$(X+Y)_p=X_p+Y_p,$\n\n$cX_p=cX_p,$\n\n以及\n\
  \n$(fX)_p=f(p)X_p$\n\n对所有 $p\\in U$ 成立。设\n\n$X=(\\alpha^1,\\ldots,\\alpha^m)\\quad\\\
  text{且}\\quad Y=(\\beta^1,\\ldots,\\beta^m),$\n\n其中 $\\alpha^i,\\beta^j$ 是 $C^\\\
  infty(U)$ 中的函数，$i,j=1,\\ldots,m$。则\n\n$(X+Y)_p=(\\alpha^1(p)+\\beta^1(p),\\ldots,\\\
  alpha^m(p)+\\beta^m(p))$\n\n且\n\n$(fX)_p=(f(p)\\alpha^1(p),\\ldots,f(p)\\alpha^m(p)).$\n\
  \n$\\alpha^i$ 称为 **$X$ 的分量**。设 $E_i$ 是由下式定义的 $\\mathfrak{X}(U)$ 中的（常值）向量场：\n\n$E_i=(0,\\\
  ldots,1,\\ldots,0),$\n\n其中对于 $i=1,\\ldots,m$，第 $i$ 个位置为 1，其余位置为 0。\n\n**关于 $X$ 的欧几里得导数**由两个映射组成，都记为\
  \ $D_X$。第一个是\n\n$D_X:C^\\infty(U)\\longrightarrow C^\\infty(U)$\n\n由下式定义\n\n$$D_X(f)(p)=d_p(f)(X_p)$$\
  \  (10.3.2)\n\n对所有函数 $f\\in C^\\infty(U)$ 及所有 $p\\in U$ 成立。第二个是\n\n$$D_X:\\mathfrak{X}(U)\\\
  longrightarrow\\mathfrak{X}(U)$$\n\n由下式定义\n\n$$D_X(Y)_p=d_p(Y)(X_p)$$  (10.3.3)\n\
  \n对所有向量场 $Y\\in\\mathfrak{X}(U)$ 及所有 $p\\in U$ 成立。由定理 10.1.14（a）可知，（10.3.2）和（10.3.3）可分别表示为\n\
  \n$$D_X(f)(p)=\\frac{d(f\\circ\\lambda)}{dt}(t_0)$$\n\n和\n\n$$D_X(Y)_p=\\frac{d(Y\\\
  circ\\lambda)}{dt}(t_0),$$\n\n其中 $\\lambda(t):(a,b)\\longrightarrow U$ 是任意光滑曲线，满足\
  \ $\\lambda(t_0)=p$ 且 $(d\\lambda/dt)(t_0)=X_p$（对某个 $t_0\\in(a,b)$）。这样的光滑曲线的存在性由定理\
  \ 10.1.13 保证。\n\n显然，$f$ 和 $Y$ 关于 $X$ 的欧几里得导数在 $p$ 处的取值，与 $f$ 和 $Y$ 在 $p$ 处的微分作用于\
  \ $X_p$ 所得结果具有相同的数学内容。它们之间的差异，如果有的话，不过是记号的改变，用以强调 $X$ 在欧几里得导数中的作用。\n\n对于 $\\mathfrak{X}(U)$\
  \ 中的向量场 $X,Y$，定义函数\n\n$$\\langle X,Y\\rangle:U\\longrightarrow\\mathbb{R}$$\n\n\
  且 $\\langle X,Y\\rangle\\in C^\\infty(U)$，通过赋值\n\n$$p\\longmapsto\\langle X_p,Y_p\\\
  rangle$$\n\n对所有 $p\\in U$ 成立。\n\n关于 $X$ 的欧几里得导数满足若干基本代数性质，这些性质的不同版本稍后会在多种场景中再次出现。\n\
  \n### 定理 10.3.1.\n\n设 $U$ 是 $\\mathbb{R}^m$ 中的开集，$X,Y,Z\\in\\mathfrak{X}(U)$ 是向量场，$f\\\
  in C^\\infty(U)$ 是函数。则：\n\n- (a) $D_{X+Y}(Z)=D_X(Z)+D_Y(Z)$.\n- (b) $D_{fX}(Y)=fD_X(Y)$.\n\
  - (c) $D_X(Y+Z)=D_X(Y)+D_X(Z)$.\n- (d) $D_X(fY)=D_X(f)Y+fD_X(Y)$.\n- (e) $D_X(\\\
  langle Y,Z\\rangle)=\\langle D_X(Y),Z\\rangle+\\langle Y,D_X(Z)\\rangle$.\n\n*证明.*\
  \ 利用定理 10.1.3 和定理 10.1.8(b) 即得结论。\n\n### 定理 10.3.2.\n\n设 $U$ 是 $\\mathbb{R}^m$ 中的开集，$f\\\
  in C^\\infty(U)$ 是函数，$X,Y\\in\\mathfrak{X}(U)$ 是向量场，且\n\\[\nX=(\\alpha^1,\\ldots,\\\
  alpha^m) \\qquad\\text{且}\\qquad Y=(\\beta^1,\\ldots,\\beta^m).\n\\]\n则：\n\n- (a)\n\
  \n$$D_X(f)=\\sum_i \\alpha^i\\frac{\\partial f}{\\partial x^i}.$$\n\n- (b)\n\n$$D_X(D_Y(f))=\\\
  sum_{ij}\\left(\\alpha^i\\frac{\\partial\\beta^j}{\\partial x^i}\\frac{\\partial\
  \ f}{\\partial x^j}+\\alpha^i\\beta^j\\frac{\\partial^2f}{\\partial x^i\\partial\
  \ x^j}\\right).$$\n\n**证明.** (a)：对于 $p\\in U$，我们有\n\\[\nD_X(f)(p)=d_p(f)(X_p)\n\
  =d_p(f)(\\alpha^1(p),\\ldots,\\alpha^m(p))\n=\\sum_i\\alpha^i(p)\\frac{\\partial\
  \ f}{\\partial x^i}(p).\n\\]\n由于 $p$ 是任意的，结论得证。\n\n(b)：由 (a) 部分，\n\\[\nD_X(D_Y(f))=D_X\\\
  left(\\sum_j\\beta^j\\frac{\\partial f}{\\partial x^j}\\right)=\\sum_i\\alpha^i\\\
  frac{\\partial}{\\partial x^i}\\left(\\sum_j\\beta^j\\frac{\\partial f}{\\partial\
  \ x^j}\\right)\n\\]\n\\[\n=\\sum_{ij}\\alpha^i\\frac{\\partial}{\\partial x^i}\\\
  left(\\beta^j\\frac{\\partial f}{\\partial x^j}\\right)=\\sum_{ij}\\left(\\alpha^i\\\
  frac{\\partial\\beta^j}{\\partial x^i}\\frac{\\partial f}{\\partial x^j}+\\alpha^i\\\
  beta^j\\frac{\\partial^2f}{\\partial x^i\\partial x^j}\\right).\\quad\\square\n\\\
  ]\n\n### 定理 10.3.3.\n\n设 $U$ 是 $\\mathbb{R}^m$ 中的开集，$X,Y,Z\\in\\mathfrak{X}(U)$\
  \ 是向量场，且\n\\[\nX=(\\alpha^1,\\ldots,\\alpha^m),\\qquad Y=(\\beta^1,\\ldots,\\beta^m),\\\
  qquad Z=(\\gamma^1,\\ldots,\\gamma^m).\n\\]\n则：\n\n- (a)\n\n$$D_X(Y)=\\sum_j\\left(\\\
  sum_i\\alpha^i\\frac{\\partial\\beta^j}{\\partial x^i}\\right)E_j.$$\n\n- (b)\n\n\
  $$D_X(D_Y(Z))=\\sum_k\\left[\\sum_{ij}\\left(\\alpha^i\\frac{\\partial\\beta^j}{\\\
  partial x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}+\\alpha^i\\beta^j\\frac{\\\
  partial^2\\gamma^k}{\\partial x^i\\partial x^j}\\right)\\right]E_k.$$\n\n- (c)\n\
  \n$$D_{D_X(Y)}(Z)=\\sum_k\\left(\\sum_{ij}\\alpha^i\\frac{\\partial\\beta^j}{\\\
  partial x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}\\right)E_k.$$\n\n证明。我们将反复使用定理\
  \ 10.3.1 和定理 10.3.2。设 $f\\in C^{\\infty}(U)$，并注意到\n\n$$D_X(E_i)=0\\quad\\text{且}\\\
  quad D_{E_i}(f)=\\frac{\\partial f}{\\partial x^i}$$\n\n对 $i=1,\\dots,m$ 成立。\n\n\
  (a)：我们有\n\n$$D_X(Y)=D_{\\sum_i\\alpha^i E_i}\\left(\\sum_j\\beta^j E_j\\right)=\\\
  sum_{ij}\\alpha^i D_{E_i}(\\beta^j E_j)$$ $$=\\sum_{ij}\\alpha^i\\left[D_{E_i}(\\\
  beta^j)E_j+\\beta^j D_{E_i}(E_j)\\right]$$ $$=\\sum_{ij}\\alpha^i\\frac{\\partial\\\
  beta^j}{\\partial x^i}E_j=\\sum_j\\left(\\sum_i\\alpha^i\\frac{\\partial\\beta^j}{\\\
  partial x^i}\\right)E_j.$$\n\n(b)：由 (a) 部分，\n\n$$D_Y(Z)=\\sum_k\\left(\\sum_j\\\
  beta^j\\frac{\\partial\\gamma^k}{\\partial x^j}\\right)E_k,$$\n\n因此\n\n$$D_X(D_Y(Z))=D_{\\\
  sum_i\\alpha^i E_i}\\left(\\sum_{jk}\\beta^j\\frac{\\partial\\gamma^k}{\\partial\
  \ x^j}E_k\\right)=\\sum_{ijk}\\alpha^i D_{E_i}\\left(\\beta^j\\frac{\\partial\\\
  gamma^k}{\\partial x^j}E_k\\right)$$ $$=\\sum_{ijk}\\alpha^i\\left[D_{E_i}(\\beta^j)\\\
  frac{\\partial\\gamma^k}{\\partial x^j}E_k+\\beta^j D_{E_i}\\left(\\frac{\\partial\\\
  gamma^k}{\\partial x^j}\\right)E_k+\\beta^j\\frac{\\partial\\gamma^k}{\\partial\
  \ x^j}D_{E_i}(E_k)\\right]$$ $$=\\sum_{ijk}\\alpha^i\\left(\\frac{\\partial\\beta^j}{\\\
  partial x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}E_k+\\beta^j\\frac{\\partial^2\\\
  gamma^k}{\\partial x^i\\partial x^j}E_k\\right)$$ $$=\\sum_k\\left[\\left(\\sum_{ij}\\\
  alpha^i\\frac{\\partial\\beta^j}{\\partial x^i}\\frac{\\partial\\gamma^k}{\\partial\
  \ x^j}\\right)+\\sum_{ij}\\alpha^i\\beta^j\\frac{\\partial^2\\gamma^k}{\\partial\
  \ x^i\\partial x^j}\\right]E_k.$$\n\n(c)：由 (a) 部分，\n\n$$D_{D_X(Y)}(Z)=D_{\\sum_{ij}\\\
  alpha^i(\\partial\\beta^j/\\partial x^i)E_j}\\left(\\sum_k\\gamma^k E_k\\right)$$\
  \ $$=\\sum_{ijk}\\left(\\alpha^i\\frac{\\partial\\beta^j}{\\partial x^i}\\right)D_{E_j}(\\\
  gamma^k E_k)$$ $$=\\sum_{ijk}\\left(\\alpha^i\\frac{\\partial\\beta^j}{\\partial\
  \ x^i}\\right)\\left[D_{E_j}(\\gamma^k)E_k+\\gamma^k D_{E_i}(E_k)\\right]$$ $$=\\\
  sum_{ijk}\\alpha^i\\frac{\\partial\\beta^j}{\\partial x^i}\\frac{\\partial\\gamma^k}{\\\
  partial x^j}E_k=\\sum_k\\left(\\sum_{ij}\\alpha^i\\frac{\\partial\\beta^j}{\\partial\
  \ x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}\\right)E_k.$$\n\n设 $U$ 是 $\\mathbb{R}^m$\
  \ 中的开集，$X,Y\\in\\mathfrak{X}(U)$ 是向量场。**关于 $X$ 和 $Y$ 的二阶欧几里得导数**由两个映射组成，都记为 $D^2_{X,Y}$。第一个是\n\
  \n$$D^2_{X,Y}:C^\\infty(U)\\longrightarrow C^\\infty(U)$$\n\n由下式定义\n\n$$D^2_{X,Y}(f)=D_X(D_Y(f))-D_{D_X(Y)}(f)$$\n\
  \n对所有函数 $f\\in C^\\infty(U)$ 成立。第二个是\n\n$$D^2_{X,Y}(Z):\\mathfrak{X}(U)\\longrightarrow\\\
  mathfrak{X}(U)$$\n\n由下式定义\n\n$$D^2_{X,Y}(Z)=D_X(D_Y(Z))-D_{D_X(Y)}(Z)$$\n\n对所有向量场\
  \ $Z\\in\\mathfrak{X}(U)$ 成立。\n\n**定理 10.3.4.** 设 $U$ 是 $\\mathbb{R}^m$ 中的开集，$X,Y,Z\\\
  in\\mathfrak{X}(U)$ 是向量场，且\n\n$$X=(\\alpha^1,\\ldots,\\alpha^m),\\qquad Y=(\\beta^1,\\\
  ldots,\\beta^m),\\qquad \\text{且}\\qquad Z=(\\gamma^1,\\ldots,\\gamma^m).$$\n\n\
  则\n\n- (a) $$D^2_{X,Y}(Z)=\\sum_k\\left(\\sum_{ij}\\alpha^i\\beta^j\\frac{\\partial^2\\\
  gamma^k}{\\partial x^i\\partial x^j}\\right)E_k.$$\n- (b) $$D^2_{Y,X}(Z)=D^2_{X,Y}(Z).$$\n\
  \n*证明.* (a)：这由定理 10.3.3(b) 和定理 10.3.3(c) 得出。  \n(b)：这由定理 10.1.6 和 (a) 部分得出。\n\n\
  ## 10.4 李括号\n\n设 $U$ 是 $\\mathbb{R}^m$ 中的开集。**李括号**是映射\n\n$$[\\cdot,\\cdot]:\\mathfrak{X}(U)\\\
  times\\mathfrak{X}(U)\\longrightarrow\\mathfrak{X}(U)$$\n\n由下式定义\n\n$$[X,Y]=D_X(Y)-D_Y(X)$$\n\
  \n对所有向量场 $X,Y\\in\\mathfrak{X}(U)$ 成立。我们称 $[X,Y]$ 为 **$X$ 与 $Y$ 的李括号**。\n\n**定理\
  \ 10.4.1.** 设 $U$ 是 $\\mathbb{R}^m$ 中的开集，$X,Y\\in\\mathfrak{X}(U)$ 是向量场，且\n\n$$X=(\\\
  alpha^1,\\ldots,\\alpha^m)\\qquad\\text{且}\\qquad Y=(\\beta^1,\\ldots,\\beta^m).$$\n\
  \n则\n\n$$[X,Y]=\\sum_j\\left\\{\\sum_i\\left(\\alpha^i\\frac{\\partial\\beta^j}{\\\
  partial x^i}-\\beta^i\\frac{\\partial\\alpha^j}{\\partial x^i}\\right)\\right\\\
  }E_j.$$\n\n\n\n\n\n证明。由定理 10.3.3(a)，\n\n$$D_X(Y)=\\sum_{j}\\left(\\sum_{i}\\alpha^{i}\\\
  frac{\\partial\\beta^{j}}{\\partial x^{i}}\\right)E_{j}\\qquad\\text{and}\\qquad\
  \ D_Y(X)=\\sum_{j}\\left(\\sum_{i}\\beta^{i}\\frac{\\partial\\alpha^{j}}{\\partial\
  \ x^{i}}\\right)E_{j},$$\n\n由此可得结果。\n\n## 定理 10.4.2. 设 $U$ 是 $\\mathbb{R}^m$ 中的一个开集，设\
  \ $X,Y,Z$ 是 $\\mathfrak{X}(U)$ 中的向量场，且 $f,g$ 是 $C^{\\infty}(U)$ 中的函数。则：\n\n- (a)\
  \ $[Y,X]=-[X,Y]$。\n- (b) $[X+Y,Z]=[X,Z]+[Y,Z]$。\n- (c) $[X,Y+Z]=[X,Y]+[X,Z]$。\n\
  - (d) $[fX,gY]=fg[X,Y]+fD_X(g)Y-gD_Y(f)X$。\n- (e) $[X,[Y,Z]]+[Y,[Z,X]]+[Z,[X,Y]]=(0,\\\
  dots,0).\\qquad\\text{(Jacobi's identity)}$\n- (f) $[E_i,E_j]=(0,\\dots,0)$ 对于 $i,j=1,\\\
  dots,m$。\n\n证明。 (a)：显而易见。\n\n(b), (c)：这由定理 10.3.1 的部分 (a) 和 (c) 可得。\n\n(d)：设\n\n\
  $$X=(\\alpha^1,\\dots,\\alpha^m),\\qquad Y=(\\beta^1,\\dots,\\beta^m),\\qquad\\\
  text{and}\\qquad Z=(\\gamma^1,\\dots,\\gamma^m),$$\n\n使得 $fX=(f\\alpha^1,\\dots,f\\\
  alpha^m)$ 且 $gY=(g\\beta^1,\\dots,g\\beta^m)$。由定理 10.3.2 和定理 10.4.1，\n\n$$[fX,gY]=\\\
  sum_{j}\\left\\{\\sum_{i}\\left(f\\alpha^{i}\\frac{\\partial(g\\beta^{j})}{\\partial\
  \ x^{i}}-g\\beta^{i}\\frac{\\partial(f\\alpha^{j})}{\\partial x^{i}}\\right)\\right\\\
  }E_{j}$$\n\n对于 $j,k=1,\\dots,m$。我们有\n\n$[X,[Y,Z]]=[\\sum_i\\alpha^iE_i,[\\sum_j\\\
  beta^jE_j,\\sum_k\\gamma^kE_k]]=\\sum_{ijk}[\\alpha^iE_i,[\\beta^jE_j,\\gamma^kE_k]]=\\\
  sum_{ijk}[\\alpha^iE_i,\\beta^j\\frac{\\partial\\gamma^k}{\\partial x^j}E_k-\\gamma^k\\\
  frac{\\partial\\beta^j}{\\partial x^k}E_j]=\\sum_{ijk}^{(1)}[\\alpha^iE_i,\\beta^j\\\
  frac{\\partial\\gamma^k}{\\partial x^j}E_k]-\\sum_{ijk}^{(2)}[\\alpha^iE_i,\\gamma^k\\\
  frac{\\partial\\beta^j}{\\partial x^k}E_j],\\quad(10.4.1)$\n\n其中求和按后续引用编号。我们也有\n\
  \n$[\\alpha^iE_i,\\beta^j\\frac{\\partial\\gamma^k}{\\partial x^j}E_k]=\\alpha^i\\\
  beta^j[E_i,E_k]+\\alpha^iD_{E_i}(\\beta^j\\frac{\\partial\\gamma^k}{\\partial x^j})E_k-\\\
  beta^j\\frac{\\partial\\gamma^k}{\\partial x^j}D_{E_k}(\\alpha^i)E_i=\\alpha^i\\\
  frac{\\partial}{\\partial x^i}(\\beta^j\\frac{\\partial\\gamma^k}{\\partial x^j})E_k-\\\
  beta^j\\frac{\\partial\\gamma^k}{\\partial x^j}\\frac{\\partial\\alpha^i}{\\partial\
  \ x^k}E_i=\\alpha^i\\frac{\\partial\\beta^j}{\\partial x^i}\\frac{\\partial\\gamma^k}{\\\
  partial x^j}E_k+\\alpha^i\\beta^j\\frac{\\partial^2\\gamma^k}{\\partial x^i\\partial\
  \ x^j}E_k-\\beta^j\\frac{\\partial\\gamma^k}{\\partial x^j}\\frac{\\partial\\alpha^i}{\\\
  partial x^k}E_i,$\n\n故\n\n$\\sum_{ijk}^{(1)}[\\alpha^iE_i,\\beta^j\\frac{\\partial\\\
  gamma^k}{\\partial x^j}E_k]=\\sum_{ijk}\\alpha^i\\beta^j\\frac{\\partial^2\\gamma^k}{\\\
  partial x^i\\partial x^j}E_k+\\sum_{ijk}\\alpha^i\\frac{\\partial\\beta^j}{\\partial\
  \ x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}E_k-\\sum_{ijk}\\beta^j\\frac{\\\
  partial\\gamma^k}{\\partial x^j}\\frac{\\partial\\alpha^i}{\\partial x^k}E_i=\\\
  sum_{ijk}\\alpha^i\\beta^j\\frac{\\partial^2\\gamma^k}{\\partial x^i\\partial x^j}E_k+\\\
  sum_{ijk}\\alpha^i\\frac{\\partial\\beta^j}{\\partial x^i}\\frac{\\partial\\gamma^k}{\\\
  partial x^j}E_k-\\sum_{ijk}\\beta^i\\frac{\\partial\\gamma^j}{\\partial x^i}\\frac{\\\
  partial\\alpha^k}{\\partial x^j}E_k=\\sum_k\\{\\sum_{ij}(\\alpha^i\\beta^j\\frac{\\\
  partial^2\\gamma^k}{\\partial x^i\\partial x^j}+\\alpha^i\\frac{\\partial\\beta^j}{\\\
  partial x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}-\\frac{\\partial\\alpha^k}{\\\
  partial x^j}\\beta^i\\frac{\\partial\\gamma^j}{\\partial x^i})\\}E_k,\\quad(10.4.2)$\n\
  \n将 $(\\alpha,\\beta,\\gamma)$ 在 $\\sum^{(1)}$ 中替换为 $(\\alpha,\\gamma,\\beta)$ 得\n\
  \n$\\sum_{ijk}^{(2)}[\\alpha^iE_i,\\gamma^j\\frac{\\partial\\beta^k}{\\partial x^j}E_k]=\\\
  sum_k\\{\\sum_{ij}(\\alpha^i\\gamma^j\\frac{\\partial^2\\beta^k}{\\partial x^i\\\
  partial x^j}+\\alpha^i\\frac{\\partial\\gamma^j}{\\partial x^i}\\frac{\\partial\\\
  beta^k}{\\partial x^j}-\\frac{\\partial\\alpha^k}{\\partial x^j}\\gamma^i\\frac{\\\
  partial\\beta^j}{\\partial x^i})\\}E_k,$\n\n所以\n\n$\\sum_{ijk}^{(2)}[\\alpha^iE_i,\\\
  gamma^k\\frac{\\partial\\beta^j}{\\partial x^k}E_j]=\\sum_k\\{\\sum_{ij}(\\alpha^i\\\
  gamma^j\\frac{\\partial^2\\beta^k}{\\partial x^i\\partial x^j}+\\alpha^i\\frac{\\\
  partial\\gamma^j}{\\partial x^i}\\frac{\\partial\\beta^k}{\\partial x^j}-\\frac{\\\
  partial\\alpha^k}{\\partial x^j}\\gamma^i\\frac{\\partial\\beta^j}{\\partial x^i})\\\
  }E_k\\quad(10.4.3)=\\sum_k\\{\\sum_{ij}(\\alpha^i\\frac{\\partial^2\\beta^k}{\\\
  partial x^i\\partial x^j}\\gamma^j+\\alpha^i\\frac{\\partial\\beta^k}{\\partial\
  \ x^j}\\frac{\\partial\\gamma^j}{\\partial x^i}-\\frac{\\partial\\alpha^k}{\\partial\
  \ x^j}\\frac{\\partial\\beta^j}{\\partial x^i}\\gamma^i)\\}E_k.$\n\n由 $(10.4.1)$–$(10.4.3)$\
  \ 可得 $[X,[Y,Z]]$ 的第 $k$ 个分量为 $[X,[Y,Z]]^k=\\sum_{ij}^{(3)}(\\alpha^i\\beta^j\\frac{\\\
  partial^2\\gamma^k}{\\partial x^i\\partial x^j}+\\alpha^i\\frac{\\partial\\beta^j}{\\\
  partial x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}-\\frac{\\partial\\alpha^k}{\\\
  partial x^j}\\beta^i\\frac{\\partial\\gamma^j}{\\partial x^i}-\\alpha^i\\frac{\\\
  partial^2\\beta^k}{\\partial x^i\\partial x^j}\\gamma^j-\\alpha^i\\frac{\\partial\\\
  beta^k}{\\partial x^j}\\frac{\\partial\\gamma^j}{\\partial x^i}+\\frac{\\partial\\\
  alpha^k}{\\partial x^j}\\frac{\\partial\\beta^j}{\\partial x^i}\\gamma^i).\\quad(10.4.4)$\n\
  \n将 $(\\alpha,\\beta,\\gamma)$ 在 $\\sum^{(3)}$ 中替换为 $(\\beta,\\gamma,\\alpha)$ 得\
  \ $[Y,[Z,X]]^k=\\sum_{ij}(\\beta^i\\gamma^j\\frac{\\partial^2\\alpha^k}{\\partial\
  \ x^i\\partial x^j}+\\beta^i\\frac{\\partial\\gamma^j}{\\partial x^i}\\frac{\\partial\\\
  alpha^k}{\\partial x^j}-\\frac{\\partial\\beta^k}{\\partial x^j}\\gamma^i\\frac{\\\
  partial\\alpha^j}{\\partial x^i}-\\beta^i\\frac{\\partial^2\\gamma^k}{\\partial\
  \ x^i\\partial x^j}\\alpha^j-\\beta^i\\frac{\\partial\\gamma^k}{\\partial x^j}\\\
  frac{\\partial\\alpha^j}{\\partial x^i}+\\frac{\\partial\\beta^k}{\\partial x^j}\\\
  frac{\\partial\\gamma^j}{\\partial x^i}\\alpha^i)=\\sum_{ij}(\\frac{\\partial^2\\\
  alpha^k}{\\partial x^i\\partial x^j}\\beta^i\\gamma^j+\\frac{\\partial\\alpha^k}{\\\
  partial x^j}\\beta^i\\frac{\\partial\\gamma^j}{\\partial x^i}-\\frac{\\partial\\\
  alpha^j}{\\partial x^i}\\frac{\\partial\\beta^k}{\\partial x^j}\\gamma^i-\\alpha^j\\\
  beta^i\\frac{\\partial^2\\gamma^k}{\\partial x^i\\partial x^j}-\\frac{\\partial\\\
  alpha^j}{\\partial x^i}\\beta^i\\frac{\\partial\\gamma^k}{\\partial x^j}+\\alpha^i\\\
  frac{\\partial\\beta^k}{\\partial x^j}\\frac{\\partial\\gamma^j}{\\partial x^i}).\\\
  quad(10.4.5)$\n\n将 $(\\alpha,\\beta,\\gamma)$ 在 $\\sum^{(3)}$ 中替换为 $(\\gamma,\\\
  alpha,\\beta)$ 得 $[Z,[X,Y]]^k=\\sum_{ij}(\\gamma^i\\alpha^j\\frac{\\partial^2\\\
  beta^k}{\\partial x^i\\partial x^j}+\\gamma^i\\frac{\\partial\\alpha^j}{\\partial\
  \ x^i}\\frac{\\partial\\beta^k}{\\partial x^j}-\\frac{\\partial\\gamma^k}{\\partial\
  \ x^j}\\alpha^i\\frac{\\partial\\beta^j}{\\partial x^i}-\\gamma^i\\frac{\\partial^2\\\
  alpha^k}{\\partial x^i\\partial x^j}\\beta^j-\\gamma^i\\frac{\\partial\\alpha^k}{\\\
  partial x^j}\\frac{\\partial\\beta^j}{\\partial x^i}+\\frac{\\partial\\gamma^k}{\\\
  partial x^j}\\frac{\\partial\\alpha^j}{\\partial x^i}\\beta^i)=\\sum_{ij}(\\alpha^j\\\
  frac{\\partial^2\\beta^k}{\\partial x^i\\partial x^j}\\gamma^i+\\frac{\\partial\\\
  alpha^j}{\\partial x^i}\\frac{\\partial\\beta^k}{\\partial x^j}\\gamma^i-\\alpha^i\\\
  frac{\\partial\\beta^j}{\\partial x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}-\\\
  frac{\\partial^2\\alpha^k}{\\partial x^i\\partial x^j}\\beta^j\\gamma^i-\\frac{\\\
  partial\\alpha^k}{\\partial x^j}\\frac{\\partial\\beta^j}{\\partial x^i}\\gamma^i+\\\
  frac{\\partial\\alpha^j}{\\partial x^i}\\beta^i\\frac{\\partial\\gamma^k}{\\partial\
  \ x^j}).\\quad(10.4.6)$\n\n合并 $(10.4.4)$–$(10.4.6)$ 并利用定理 10.1.6 得结果。\n\n## 定理 10.4.3.\
  \ 若 $U$ 是 $\\mathbb{R}^m$ 中的一个开集且 $X,Y,Z$ 是 $\\mathfrak{X}(U)$ 中的向量场，则：\n\n$D_{D_X(Y)}(Z)-D_{D_Y(X)}(Z)=D_{[X,Y]}(Z)=D_X(D_Y(Z))-D_Y(D_X(Z)).$\n\
  \n证明。设\n\n$X=(\\alpha^1,\\dots,\\alpha^m),\\quad Y=(\\beta^1,\\dots,\\beta^m),\\\
  quad\\text{and}\\quad Z=(\\gamma^1,\\dots,\\gamma^m).$\n\n(a)：由定理 10.3.3(c)，\n\n\
  $D_{D_X(Y)}(Z)=\\sum_k(\\sum_{ij}\\alpha^i\\frac{\\partial\\beta^j}{\\partial x^i})\\\
  frac{\\partial\\gamma^k}{\\partial x^j}E_k$\n\n且\n\n$D_{D_Y(X)}(Z)=\\sum_k(\\sum_{ij}\\\
  beta^i\\frac{\\partial\\alpha^j}{\\partial x^i})\\frac{\\partial\\gamma^k}{\\partial\
  \ x^j}E_k,$\n\n故\n\n$D_{D_X(Y)}(Z)-D_{D_Y(X)}(Z)=\\sum_{kj}\\{\\sum_i(\\alpha^i\\\
  frac{\\partial\\beta^j}{\\partial x^i}-\\beta^i\\frac{\\partial\\alpha^j}{\\partial\
  \ x^i})\\frac{\\partial\\gamma^k}{\\partial x^j}\\}E_k=\\sum_k(\\sum_j[X,Y]^j\\\
  frac{\\partial\\gamma^k}{\\partial x^j})E_k\\quad[\\text{Th 10.4.1}]=D_{[X,Y]}(Z),\\\
  quad[\\text{Th 10.3.3(a)}]$\n\n这证明了第一个等式。\n\n由定理 10.3.3(b) 可知 $D_X(D_Y(Z))$ 的第 $k$\
  \ 个分量为\n\n$(D_X(D_Y(Z)))^k=\\sum_{ij}(\\alpha^i\\frac{\\partial\\beta^j}{\\partial\
  \ x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}+\\alpha^i\\beta^j\\frac{\\partial^2\\\
  gamma^k}{\\partial x^i\\partial x^j}).\\quad(10.4.7)$\n\n将 $(\\alpha,\\beta,\\gamma)$\
  \ 替换为 $(\\beta,\\alpha,\\gamma)$ 在前述恒等式中得\n\n$(D_Y(D_X(Z)))^k=\\sum_{ij}(\\beta^i\\\
  frac{\\partial\\alpha^j}{\\partial x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}+\\\
  beta^i\\alpha^j\\frac{\\partial^2\\gamma^k}{\\partial x^i\\partial x^j}).\\quad(10.4.8)$\n\
  \n$D_X(D_Y(Z))-D_Y(D_X(Z))$ 与 $D_{[X,Y]}(Z)$ 的第 $k$ 个分量相等：\n\n$$\n\\begin{aligned}\n\
  \\left(D_X(D_Y(Z))-D_Y(D_X(Z))\\right)^k\n&=\\sum_{ij}\\left(\\alpha^i\\frac{\\\
  partial\\beta^j}{\\partial x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}-\\beta^i\\\
  frac{\\partial\\alpha^j}{\\partial x^i}\\frac{\\partial\\gamma^k}{\\partial x^j}\\\
  right)\\\\\n&=\\sum_j\\left\\{\\sum_i\\left(\\alpha^i\\frac{\\partial\\beta^j}{\\\
  partial x^i}-\\beta^i\\frac{\\partial\\alpha^j}{\\partial x^i}\\right)\\right\\\
  }\\frac{\\partial\\gamma^k}{\\partial x^j}\\\\\n&=\\sum_j[X,Y]^j\\frac{\\partial\\\
  gamma^k}{\\partial x^j}\\\\\n&=\\left(D_{[X,Y]}(Z)\\right)^k,\n\\end{aligned}\n\
  $$\n\n这证明了第二个等式。\n\n## 10.5 积分\n\n在第 10.1–10.4 节讨论了导数之后，我们现在简要地将注意力转向积分。\n\n设 $[a_i,b_i]$\
  \ 是 $\\mathbb{R}$ 中的闭区间，其中 $a_i\\le b_i$ 对于 $i=1,\\ldots,m$。集合\n\n$$C=[a_1,b_1]\\\
  times\\cdots\\times[a_m,b_m]$$\n\n称为 $\\mathbb{R}^m$ 中的一个 **闭胞**。$C$ 的 **含量** 定义为\n\
  \n$$\\operatorname{cont}(C)=(b_1-a_1)\\cdots(b_m-a_m).$$\n\n我们注意到 $\\operatorname{cont}(C)=0$\
  \ 当且仅当存在某个 $1\\le i\\le m$ 使得 $a_i=b_i$。当 $m=1,2,3$ 时，“含量”分别称为“长度”、“面积”、“体积”。例如，考虑\
  \ $\\mathbb{R}$ 的子集 $[0,1]$ 和 $\\mathbb{R}^2$ 的“几何等价”子集 $[0,1]\\times[0,1]$。则 $[0,1]$\
  \ 的长度为 $1$，而 $[0,1]\\times[0,1]$ 的面积为 $1$。$\\mathbb{R}^m$ 的子集 $S$ 称为具有 **含量零**，如果对于每一个实数\
  \ $\\epsilon>0$，存在有限个闭胞的集合 $\\{C_i:1=1,\\ldots,k\\}$ 使得 $S\\subseteq\\bigcup_{i=1}^k\
  \ C_i$ 且 $\\sum_{i=1}^k\\operatorname{cont}(C_i)<\\epsilon$。例如，$[0,1]\\times[0,1]$\
  \ 具有含量零。\n\n设 $C$ 是 $\\mathbb{R}^m$ 中的一个闭胞，且 $f:C\\to\\mathbb{R}$ 是一个有界函数。我们说 $\\\
  mathbb{R}^m$ 中闭胞的有限集合 $\\{C_i:i=1,\\ldots,k\\}$ 是 $C$ 的一个 **划分**，如果每个 $C_i$ 是 $C$\
  \ 的子集，$C_i$ 仅在它们的边界上相交，且 $C=\\bigcup_{i=1}^k C_i$。例如，$\\{[0,1]\\times[0,1],[1,2]\\\
  times[0,1]\\}$ 是 $[0,2]\\times[0,1]$ 的一个划分。给定 $C_i$ 中的点 $p_i$ 对于 $i=1,\\ldots,k$，和\
  \ $\\sum_i f(p_i)\\operatorname{cont}(C_i)$ 是我们直观认为的“$f$ 图形下方含量”的一个近似。对于 $C$ 的每个划分的选择和\
  \ $p_i$ 的每个选择，我们得到一个相应的和。采用与一元实变积分演算中类似的方法，其中使用内接和外接矩形来近似一元实值函数图形下的面积，我们定义 $f$ 在\
  \ $C$ 上的下积分和上积分，分别记为 $\\int_C f$ 和 $\\overline{\\int_C} f$，为上述近似和的极限。可以证明由于 $f$\
  \ 有界，$\\int_C f$ 和 $\\overline{\\int_C} f$ 都是有限的。我们说 $f$ 是 **(Riemann) 可积的** 如果\
  \ $\\int_C f$ 和 $\\overline{\\int_C} f$ 相等。在这种情况下，它们的共同值，称为 $f$ 在 $C$ 上的 **(Riemann)\
  \ 积分**，记为\n\n$$\\int_C f\\,dx^1\\cdots dx^m \\qquad\\text{or}\\qquad \\int_C f(x^1,\\\
  ldots,x^m)\\,dx^1\\cdots dx^m.$$\n\n我们需要能够对比闭胞更宽松的集合上的函数进行积分。设 $S$ 是 $\\mathbb{R}^m$\
  \ 中的有界集，且 $f:S\\to\\mathbb{R}$ 是有界函数。由于 $S$ 有界，存在包含 $S$ 的闭胞 $C$。设我们定义函数 $f_C:C\\\
  to\\mathbb{R}$ 为\n\n$$f_C(p)=\\begin{cases}f(p)&\\text{if }p\\in S,\\\\0&\\text{if\
  \ }p\\in C\\setminus S.\\end{cases}$$\n\n我们说 $f$ 是 **(Riemann) 可积的** 如果 $f_C$ 可积。在这种情况下，$f$\
  \ 在 $S$ 上的 **(Riemann) 积分** 记为 $\\int_S f\\,dx^1\\cdots dx^m$ 并定义为\n\n$$\\int_S\
  \ f\\,dx^1\\cdots dx^m=\\int_C f_C\\,dx^1\\cdots dx^m. \\tag{10.5.2}$$\n\n可以证明 $f$\
  \ 的可积性以及 $\\int_S f\\,dx^1\\cdots dx^m$ 的值与包含 $S$ 的闭胞的选择无关。\n\n我们现在引入 $\\mathbb{R}^m$\
  \ 中一类有界集，在其上某类函数总是可积的。$\\mathbb{R}^m$ 的子集 $D$ 称为一个 **积分域**，如果它是 有界的 且其在 $\\mathbb{R}^m$\
  \ 中的边界具有含量零。例如，$\\mathbb{R}^m$ 中的闭胞是一个积分域。\n\n**定理 10.5.1 (可积性准则).** 如果 $D$ 是 $\\\
  mathbb{R}^m$ 中的一个积分域且 $f:D\\to\\mathbb{R}$ 是有界连续函数，则 $f$ 是可积的。\n\n**定理 10.5.2.**\
  \ 设 $D$ 是 $\\mathbb{R}^m$ 中的一个积分域，设 $f,g:D\\to\\mathbb{R}$ 是有界连续函数，且 $c$ 是实数。则 $cf+g$\
  \ 是可积的且\n\n$$\\int_D(cf+g)\\,dx^1\\cdots dx^m=c\\int_D f\\,dx^1\\cdots dx^m+\\int_D\
  \ g\\,dx^1\\cdots dx^m.$$\n\n设 $U$ 是 $\\mathbb{R}^m$ 中的一个开集，且 $f:U\\to\\mathbb{R}$\
  \ 是一个具有紧支集的连续函数；即 $\\operatorname{supp}(f)$ 在 $U$ 中是紧的。由定理 9.2.2，$U$ 是 $\\mathbb{R}^m$\
  \ 中一族开球的并。利用定理 9.1.5，可以很容易地证明由于 $\\operatorname{supp}(f)$ 在 $U$ 中是紧的，它包含于开球的有限子族的并\
  \ $D$ 中。因此，$\\operatorname{supp}(f)\\subseteq D\\subseteq U$。此外，还可以证明 $D$ 是一个积分域。\n\
  \n\n\n\\(f\\) 在 \\(U\\) 上的（黎曼）积分记为 \\(\\int_U f\\,dx^1\\cdots dx^m\\)，并由下式定义：\n\n\
  \\[\n\\int_U f\\,dx^1\\cdots dx^m=\\int_D f\\,dx^1\\cdots dx^m,\n\\tag{10.5.3}\n\
  \\]\n\n其中右端由 (10.5.2) 给出。由定理 9.1.13，\\(f\\) 在 \\(D\\) 上连续；由定理 9.1.22(b)，\\(f\\)\
  \ 在 \\(\\operatorname{supp}(f)\\) 上有界，因此在 \\(D\\) 上有界。由定理 10.5.1 可知该积分存在。可以证明，积分的值不依赖于包含\
  \ \\(\\operatorname{supp}(f)\\) 的积分区域的选择。\n\n### 定理 10.5.3（变量替换）\n\n设 \\(U\\) 和\
  \ \\(V\\) 是 \\(\\mathbb{R}^m\\) 中的开集，设 \\(F:U\\to V\\) 是一个微分同胚，并设 \\(f:V\\to\\mathbb{R}\\\
  ) 是一个具有紧支集的连续函数。则\n\n\\[\n\\int_V f\\,dx^1\\cdots dx^m=\\int_U(f\\circ F)|\\det(J_F)|\\\
  ,dx^1\\cdots dx^m,\n\\]\n\n其中 \\(J_F\\) 是 \\(F\\) 的 Jacobi 矩阵。\n\n### 定理 10.5.4（累次积分）\n\
  \n若 \\(C=[a^1,b^1]\\times\\cdots\\times[a^m,b^m]\\) 是 \\(\\mathbb{R}^m\\) 中的一个闭胞腔，且\
  \ \\(f:C\\to\\mathbb{R}\\) 是连续函数，则\n\n\\[\n\\int_C f=\\int_{a^m}^{b^m}\\left\\{\\\
  cdots\\left[\\int_{a^2}^{b^2}\\left(\\int_{a^1}^{b^1}f(x^1,\\ldots,x^m)\\,dx^1\\\
  right)dx^2\\right]\\cdots\\right\\}dx^m.\n\\]\n\n此外，\\(\\int_C f\\) 的值不依赖于变量积分的顺序。\n\
  \n### 定理 10.5.5（积分号下求导）\n\n设 \\(U\\) 是 \\(\\mathbb{R}^m\\) 中的开集，并设\n\n\\[\nf:U\\\
  times[a,b]\\to\\mathbb{R}\n\\]\n\n是连续函数，使得 \\(\\partial f/\\partial x^i\\) 存在且在\
  \ \\(U\\times[a,b]\\) 上连续，其中 \\(i=1,\\ldots,m\\)。定义函数 \\(F:U\\to\\mathbb{R}\\) 为\n\
  \n\\[\nF(x^1,\\ldots,x^m)=\\int_a^b f(x^1,\\ldots,x^m,t)\\,dt\n\\]\n\n对 \\(U\\)\
  \ 中所有的 \\((x^1,\\ldots,x^m)\\) 成立。则 \\(F\\in C^1(U)\\)，且\n\n\\[\n\\frac{\\partial\
  \ F}{\\partial x^i}(x^1,\\ldots,x^m)=\\int_a^b\\frac{\\partial f}{\\partial x^i}(x^1,\\\
  ldots,x^m,t)\\,dt\n\\]\n\n其中 \\(i=1,\\ldots,m\\)。\n\n设 \\(D\\) 是 \\(\\mathbb{R}^m\\\
  ) 中的一个积分区域。显然，恒取值 \\(1\\) 的函数 \\(1_D:D\\to\\mathbb{R}\\) 是连续且有界的，因此定理 10.5.1 适用。\\\
  (D\\) 的**容度**定义为\n\n\\[\n\\operatorname{cont}(D)=\\int_D 1_D\\,dx^1\\cdots dx^m.\n\
  \\tag{10.5.4}\n\\]\n\n可以证明，当 \\(D\\) 是 \\(\\mathbb{R}^m\\) 中的闭胞腔时，由 (10.5.1) 和 (10.5.4)\
  \ 给出的 \\(\\operatorname{cont}(D)\\) 的定义一致。\n\n### 定理 10.6.2\n\n在上述设定下，以下命题等价：\n\n\
  - (a) \\(\\operatorname{curl}(F)=0\\)。\n- (b) \\(F=\\operatorname{grad}(f)\\)，其中\
  \ \\(f\\in C^\\infty(U)\\)。\n- (c) 对 \\(U\\) 中任意闭路径 \\(P\\)，线积分 \\(\\int_P F\\cdot\
  \ ds\\) 等于 \\(0\\)。\n\n### 定理 10.6.3\n\n在上述设定下，以下命题等价：\n\n- (a) \\(\\operatorname{div}(F)=0\\\
  )。\n- (b) \\(F=\\operatorname{curl}(G)\\)，其中 \\(G:U\\to\\mathbb{R}^3\\) 是某个光滑映射。\n\
  \n### 定理 11.1.1\n\n设 \\(\\lambda:(a,b)\\to\\mathbb{R}^3\\) 是一条光滑曲线，并设 \\(g:(c,d)\\\
  to(a,b)\\) 是一个微分同胚。则 \\(\\lambda\\) 是正则的当且仅当 \\(\\lambda\\circ g\\) 是正则的。\n\n**证明。**\
  \ 由定理 10.1.10，\n\n\\[\n\\frac{d(\\lambda\\circ g)}{du}(u)=\\frac{dg}{du}(u)\\frac{d\\\
  lambda}{dt}(g(u)),\n\\]\n\n并由定理 10.2.4(a)，\\(dg/du\\) 处处非零。由于 \\(g\\) 是双射，当 \\(u\\\
  ) 在 \\((c,d)\\) 中变化时，\\(g(u)\\) 在 \\((a,b)\\) 中变化。因此，\\(d\\lambda/dt\\) 处处非零当且仅当\
  \ \\(d(\\lambda\\circ g)/du\\) 处处非零。\n\n定理 11.1.1 可用于在光滑曲线的集合上定义一个等价关系如下：对于两条这样的曲线\
  \ \\(\\lambda\\) 和 \\(\\psi\\)，若 \\(\\psi\\) 是 \\(\\lambda\\) 的光滑重新参数化，则记 \\(\\\
  lambda\\sim\\psi\\)。这里不再深入探讨这一想法，但它说明了一个要点：我们的关注点应当是“曲线”的内在性质，例如它是否正则，而不是某一特定参数化的具体细节。\n\
  \n## 11.2 \\(\\mathbb{R}^3\\) 中的正则曲面\n\n本节当前的直接目标是定义我们暂时称之为“光滑曲面”的对象。对于“光滑”对一个几何对象意味着什么，我们都有一种直观的认识。例如，球面显然具有这一性质，但立方体则不然。难点在于把这种直觉转化为严格的数学语言。球面之所以具有“光滑性”，一个特征就是能够在它的每一个点处附着一个唯一的“切平面”，而这对立方体来说是不可能的。\n\
  \n设 \\(U\\) 是 \\(\\mathbb{R}^2\\) 中的开集，\\(\\varphi:U\\to\\mathbb{R}^3\\) 是一个光滑映射。在当前语境下，我们称\
  \ \\(\\varphi\\) 为一个参数化曲面。\\(\\varphi\\) 在 \\(U\\) 中一点 \\(q\\) 处的微分映射为 \\(d_q(\\\
  varphi):\\mathbb{R}^2\\to\\mathbb{R}^3\\)。由定理 10.2.1 可得，若 \\(\\varphi\\) 在 \\(q\\\
  ) 处是浸入，则 \\(d_q(\\varphi)(\\mathbb{R}^2)\\) 是一个 2 维向量空间，我们可以把它看作 \\(\\varphi\\)\
  \ 的图像在 \\(\\varphi(q)\\) 处的“切平面”。这表明，“光滑曲面”可以被合理地定义为参数化曲面的像，只需后者额外具有浸入这一性质。在探讨这一概念之前，我们需要建立\
  \ \\(\\mathbb{R}^2\\) 和 \\(\\mathbb{R}^3\\) 中坐标的记号。\n\n在本章及下一章中，\\(\\mathbb{R}^2\\\
  ) 上的坐标记作 \\((r^1,r^2)\\) 或 \\((r,s)\\)，\\(\\mathbb{R}^3\\) 上的坐标记作 \\((x^1,x^2,x^3)\\\
  ) 或 \\((x,y,z)\\)。\n\n有时，特别是在例子中，我们把 \\(\\mathbb{R}^2\\) 等同于 \\(\\mathbb{R}^3\\\
  ) 中的 \\(xy\\) 平面。在这种设定下，\\(\\mathbb{R}^2\\) 上的坐标记作 \\((x,y)\\)。\n\n设 \\(U\\) 是 \\\
  (\\mathbb{R}^2\\) 中的开集，并设 \\(\\varphi=(\\varphi^1,\\varphi^2,\\varphi^3):U\\to\\\
  mathbb{R}^3\\) 是一个参数化曲面。由于 \\(\\varphi\\) 是光滑的，按定义，\\(\\varphi^1\\)、\\(\\varphi^2\\\
  ) 和 \\(\\varphi^3\\) 也是光滑的。对 \\(U\\) 中的每个 \\(q\\)，有\n\n\\[\n\\varphi(q)=(\\varphi^1(q),\\\
  varphi^2(q),\\varphi^3(q)),\n\\]\n\n因此\n\n\\[\n\\frac{\\partial\\varphi}{\\partial\
  \ r^i}(q)=\\left(\\frac{\\partial\\varphi^1}{\\partial r^i}(q),\\frac{\\partial\\\
  varphi^2}{\\partial r^i}(q),\\frac{\\partial\\varphi^3}{\\partial r^i}(q)\\right)\n\
  \\tag{11.2.1}\n\\]\n\n其中 \\(i=1,2\\)。为简洁起见，我们把 \\(\\frac{\\partial\\varphi}{\\partial\
  \ r^i}(q)\\) 记作 \\(H_i|_q\\)。\n\n### 定理 11.2.1\n\n设 \\(\\varphi:U\\to\\mathbb{R}^3\\\
  ) 是一个参数化曲面，设 \\(q\\) 是 \\(U\\) 中的一点，并设 \\((e_1,e_2)\\) 是 \\(\\mathbb{R}^2\\) 的标准基。则：\n\
  \n- (a) 对 \\(i=1,2\\)，\\(d_q(\\varphi)(e_i)=H_i|_q\\)。\n- (b) \\(d_q(\\varphi)(\\\
  mathbb{R}^2)=\\operatorname{span}\\{H_1|_q,H_2|_q\\}\\)。\n\n**证明。** 对 \\(\\mathbb{R}^2\\\
  ) 中的向量 \\(v=(a^1,a^2)\\)，有\n\n\\[\nd_q(\\varphi)(v)=\\bigl(d_q(\\varphi^1)(v),d_q(\\\
  varphi^2)(v),d_q(\\varphi^3)(v)\\bigr)\n\\quad [\\text{定理 10.1.8(b)}]\n\\]\n\n\\\
  [\n=\\left(\\sum_i a^i\\frac{\\partial\\varphi^1}{\\partial r^i}(q),\\sum_i a^i\\\
  frac{\\partial\\varphi^2}{\\partial r^i}(q),\\sum_i a^i\\frac{\\partial\\varphi^3}{\\\
  partial r^i}(q)\\right)\n\\quad [\\text{定理 10.1.2}]\n\\]\n\n\\[\n=\\sum_i a^i\\\
  left(\\frac{\\partial\\varphi^1}{\\partial r^i}(q),\\frac{\\partial\\varphi^2}{\\\
  partial r^i}(q),\\frac{\\partial\\varphi^3}{\\partial r^i}(q)\\right)\n=\\sum_i\
  \ a^i H_i|_q,\n\\]\n\n由此即得结论。\n\n### 定理 11.2.2\n\n若 \\(\\varphi:U\\to\\mathbb{R}^3\\\
  ) 是一个参数化曲面，且 \\(q\\) 是 \\(U\\) 中的一点，则以下命题等价：\n\n- (a) \\(\\varphi\\) 在 \\(q\\) 处是浸入。\n\
  - (b) \\(d_q(\\varphi)(\\mathbb{R}^2)\\) 是 2 维的。\n- (c) \\(J_\\varphi(q)\\) 的秩为\
  \ 2。\n- (d) \\(H_1|_q\\) 与 \\(H_2|_q\\) 线性无关。\n- (e) \\(H_1|_q\\times H_2|_q\\neq(0,0,0)\\\
  )。\n\n**注记。** 正如在定理 8.4.8 的相关讨论中指出的，我们可以任意选用内积和标准正交基来计算 (e) 中的向量积。在当前情境下，使用欧几里得内积和标准基较为方便。换言之，计算将在\
  \ \\(\\mathbb{R}^3_0\\) 中进行。\n\n**证明。**\n\n(a) ⇔ (b) ⇔ (c)：这由定理 10.2.1 可得。\n\n(c)\
  \ ⇔ (d)：由 (10.1.2) 有\n\n\\[\nJ_\\varphi(q)=\n\\begin{bmatrix}\n\\frac{\\partial\\\
  varphi^1}{\\partial r^1}(q) & \\frac{\\partial\\varphi^1}{\\partial r^2}(q)\\\\\
  [2mm]\n\\frac{\\partial\\varphi^2}{\\partial r^1}(q) & \\frac{\\partial\\varphi^2}{\\\
  partial r^2}(q)\\\\[2mm]\n\\frac{\\partial\\varphi^3}{\\partial r^1}(q) & \\frac{\\\
  partial\\varphi^3}{\\partial r^2}(q)\n\\end{bmatrix},\n\\]\n\n且相应的向量积为\n\n\\[\n\
  (3r^2-1,2r,0)\\times(0,0,1)=(2r,-3r^2+1,0),\n\\]\n\n它永远不会等于 \\((0,0,0)\\)。由定理 11.2.2，\\\
  (\\varphi\\) 是一个浸入。自交部分由\n\n\\[\n\\varphi(1,s)=(0,0,s)=\\varphi(-1,s)\n\\]\n\n参数化，其中\
  \ \\(s\\) 取遍所有实数。由定理 11.2.1(b) 有\n\n\\[\nd_{(1,s)}(\\varphi)(\\mathbb{R}^2)=\\operatorname{span}\\\
  {(2,2,0),(0,0,1)\\}\n\\]\n\n以及\n\n\\[\nd_{(-1,s)}(\\varphi)(\\mathbb{R}^2)=\\operatorname{span}\\\
  {(2,-2,0),(0,0,1)\\}.\n\\]\n\n这表明，在自交线上每个点处，存在两个“切平面”的候选对象。\n\n![](img/d712710a8eb78c0959204afd5dde4c91_244_0.png)\n\
  \n**图 11.2.2.** 例 11.2.4 的图示。\n\n前述例子的要点是：\\(\\varphi\\) 是浸入对于 \\(\\varphi(U)\\\
  ) 是“光滑的”是必要的，但不充分。至少，我们还需要加上 \\(\\varphi(U)\\) 不自交这一要求；等价地，即要求 \\(\\varphi\\) 是单射。进一步的例子（这里不再展示）揭示了把“光滑曲面”定义为某种参数化曲面的像所固有的其他不足。\n\
  \n现在我们换一种方法来处理这个问题，可以粗略地描述如下：一个“光滑曲面”被定义为 \\(\\mathbb{R}^3\\) 的一个拓扑子空间，它可以被一族参数化曲面以分片方式覆盖，使得这些片“彼此良好拼接”。我们需要把这一切精确化。\n\
  \n设 \\(M\\) 是 \\(\\mathbb{R}^3\\) 的一个拓扑子空间。\\(M\\) 上的一个**坐标卡（chart）**是二元组 \\((U,\\\
  varphi)\\)，其中 \\(U\\) 是 \\(\\mathbb{R}^2\\) 中的开集，\\(\\varphi:U\\to\\mathbb{R}^3\\\
  ) 是一个参数化曲面，并且满足：\n\n\n\n+   [C1] φ : U ⟶ ℝ³ 是浸入。\n+   [C2] φ(U) 是 M 中的开集。\n+   [C3]\
  \ φ : U ⟶ φ(U) 是同胚。\n\n条件 [C1] 已详细讨论过。条件 [C2] 和 [C3] 远非直观，但我们至少可以说关于 [C3]，它保证 φ\
  \ 是单射，从而避免了上面讨论的自相交问题。\n\n当需要在 (U, φ) 中明确 φ 的分量时，我们使用记号 (U, φ = (φⁱ)) 或 (U, φ =\
  \ (φ¹, φ², φ³))。我们称 U 为该图的坐标域，并称 φ 为其坐标映射。对于 φ(U) 中的每一点 p，(U, φ) 称为 p 处的图。当 φ(U)\
  \ = M 时，我们称 (U, φ) 为 M 上的覆盖图，且 M 被 (U, φ) 覆盖。两个图 (U, φ) 和 (Ũ, φ̃) 在 M 上被称为重叠，如果\
  \ V = φ(U) ∩ φ̃(Ũ) 非空。在这种情况下，映射\n\nφ̃⁻¹ ∘ φ|φ⁻¹(V) : φ⁻¹(V) ⟶ φ̃⁻¹(V)\n\n称为过渡映射。为简便起见，我们通常记\n\
  \nφ̃⁻¹ ∘ φ|φ⁻¹(V) 为 φ̃⁻¹ ∘ φ。\n\nM 的一个图册是 \U0001D504 = {(Uα, φα) : α ∈ A} 的集合，其中\
  \ (Uα, φα) 是 M 上的图，且 φα(Uα) 构成 M 的一个开覆盖；即\n\nM = ⋃_{α ∈ A} φα(Uα)。\n\n我们现在可以把对“光滑曲面”的初步描述替换为一个确定的描述。正则曲面（在\
  \ ℝ³ 中）是一个对 (M, \U0001D504)，其中 M 是 ℝ³ 的拓扑子空间，\U0001D504 是 M 的一个图册。该定义的显著特征是，它对构成图册的图的选取除了其坐标域覆盖\
  \ M 外没有其他要求。我们通常采用简写，称 M 为正则曲面，\U0001D504 由上下文理解。\n\n## Example 11.2.5 (Chart).\
  \ 设 M 为正则曲面，且 (U, φ) 为 M 上的图。则 φ(U) 为正则曲面且 (U, φ) 为覆盖图。◇\n\n## 在此之后，任何正则曲面上的图都视为正则曲面。\n\
  \n## Example 11.2.6 (\U0001D54A²). 单位球面（以原点为中心）为\n\n\U0001D54A² = {(x, y, z) ∈ ℝ³\
  \ : x² + y² + z² = 1}。\n\n回想\n\nD = {(r, s) ∈ ℝ² : r² + s² < 1}\n\n是单位开圆盘。以下我们将\
  \ ℝ² 视为 ℝ³ 中的 xy 平面。设我们定义函数 φ₁, …, φ₆ : D ⟶ ℝ³ 为：\n\n```\nφ₁(x, y) = (x, y, √1 −\
  \ x² − y²)\nφ₂(x, y) = (x, y, −√1 − x² − y²)\nφ₃(x, y) = (x, √1 − x² − y², y)\n\
  φ₄(x, y) = (x, −√1 − x² − y², y)\nφ₅(x, y) = (√1 − x² − y², x, y)\nφ₆(x, y) = (−√1\
  \ − x² − y², x, y).\n```\n\n可以证明 (D, φ₁), …, (D, φ₆) 是 S² 上的图，且 S² = φ¹(D) ∪ ⋯ ∪\
  \ φ⁶(D)。因此，{(D, φ₁), …, (D, φ₆)} 是 S² 的一个图册，故 S² 是正则曲面。\n\n## Theorem 11.2.7. 正则曲面不是\
  \ ℝ³ 中的开集。\n\nProof. 设 M 为正则曲面，且 (U, φ) 为 M 上的图。根据 [C2]，φ(U) 在 M 中是开的。由定义，存在 ℝ³\
  \ 中的开集 \U0001D4B0 使得 φ(U) = M ∩ \U0001D4B0。由此可知 M 在 ℝ³ 中不是开的；若它是开的，则 φ(U) 将在 ℝ³\
  \ 中开，且然后定理 9.4.1 和 [C3] 将导致矛盾。\n\n定理 11.2.7 的一个推论是，为了研究以正则曲面为定义域的函数或映射是否光滑，我们需要依赖第\
  \ 10.1 节末尾所述的扩展光滑性。下述结果就是一个重要例子。\n\n## Theorem 11.2.8 (Smoothness of Inverse Coordinate\
  \ Map). 若 M 为正则曲面且 (U, φ) 为 M 上的图，则 φ⁻¹ : φ(U) ⟶ U 是（扩展）光滑的。\n\nProof. 设 φ = (φ¹,\
  \ φ², φ³)，且 q 为 U 中的一点。根据 [C2]，存在 φ(q) 在 ℝ³ 中的邻域 \U0001D4B1 使得 φ(U) = M ∩ \U0001D4B1\
  。由 [C1] 和定理 11.2.2 可知 J_φ(q) 的秩为 2。若必要则重新标记 ℝ³ 中的坐标，我们由定理 2.3.2 和定理 2.4.8 得到 det(J_φ(q)^(1,2))\
  \ ≠ 0。定义光滑映射 F : U × ℝ ⟶ ℝ³ 为\n\n```\nF(r, s, t) = φ(r, s) + (0, 0, t) = (φ¹(r,\
  \ s), φ²(r, s), φ³(r, s) + t),\n```\n\n使得 F(r, s, 0) = φ(r, s) 对所有 (r, s) ∈ U 成立。在几何上，F\
  \ 可视为将 U 上的“无限圆柱”的“水平切片”发送到 φ(U) 上的“无限圆柱”的“水平切片”。特别地，F 发送\n\nU × {(0, 0, 0)} 到 φ(U)。见图\
  \ 11.2.3。 由于 φ 光滑，故 F 也光滑。我们有\n\n$$J_F(q,0)=\\begin{bmatrix}\\dfrac{\\partial \\\
  varphi^1}{\\partial r}(q)&\\dfrac{\\partial \\varphi^1}{\\partial s}(q)&0\\\\[4pt]\\\
  dfrac{\\partial \\varphi^2}{\\partial r}(q)&\\dfrac{\\partial \\varphi^2}{\\partial\
  \ s}(q)&0\\\\[4pt]\\dfrac{\\partial \\varphi^3}{\\partial r}(q)&\\dfrac{\\partial\
  \ \\varphi^3}{\\partial s}(q)&1\\end{bmatrix},$$\n\n故 det($J_F(q,0)$) ≠ 0。由定理 10.2.1\
  \ 和定理 10.2.3，存在 (q,0) 在 ℝ³ 中的邻域 $W \\subset U \\times \\mathbb{R}$ 和 φ(q) 在 ℝ³ 中的邻域\
  \ $V$ 使得 $F|_W : W \\to V$ 是微分同胚。由于 $V$ 和 $\\mathcal V$ 都是 ℝ³ 中的开集，故 $V \\cap \\\
  mathcal V$ 是 ℝ³ 中的开集，故 $V \\cap \\mathcal V$ 是 φ(q) 的邻域。若必要则用 $V \\cap \\mathcal\
  \ V$ 替换 $V$，并用 $(F|_W)^{-1}(V \\cap \\mathcal V)$ 替换 $W$，我们不失一般性地假设 $W \\subseteq\
  \ U \\times \\mathbb{R}$。以类似方式，我们不失一般性地假设 $W$ 是 rs 平面上 q 的邻域 $U' \\subseteq U$ 上的“有限圆柱”。由此可知\
  \ $V \\cap M$ 是 M 中 φ(q) 的邻域且 φ(U') = V ∩ M。设 $\\mathcal P : \\mathbb{R}^3 \\to\
  \ \\mathbb{R}^2$ 为投影映射，定义为 $\\mathcal P(x,y,z)=(x,y)$。由于 $\\mathcal P$ 和 $(F|_W)^{-1}$\
  \ 光滑，由定理 10.1.12，$\\mathcal P \\circ (F|_W)^{-1}:V\\to U'$ 也光滑。我们有\n\n$$\\mathcal\
  \ P\\circ(F|_W)^{-1}(\\varphi(r,s))=\\mathcal P\\circ(F|_W)^{-1}(F(r,s,0))=\\mathcal\
  \ P(r,s,0)=(r,s)$$\n\n对所有 $(r,s)$ ∈ $U'$ 成立，故 $\\mathcal P\\circ(F|_W)^{-1}|_{\\\
  varphi(U')}=\\varphi^{-1}|_{\\varphi(U')}$。因此，$\\mathcal P\\circ(F|_W)^{-1}$ 是 ℝ³\
  \ 中 φ(q) 的邻域上的光滑映射，其在 M 中 φ(q) 的邻域上限制为 φ⁻¹。由于 q 是任意的，结果得证。\n\n## **Theorem 11.2.9.**\n\
  \n*若 $M$ 为正则曲面，且 $(U,\\varphi)$ 和 $(\\widetilde U,\\widetilde\\varphi)$ 为 $M$ 上的重叠图，则过渡映射*\n\

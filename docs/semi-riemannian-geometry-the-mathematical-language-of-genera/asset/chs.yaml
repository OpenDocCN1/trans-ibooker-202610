  \n而将右端作用则得\n\n[h_{i₁}(η¹)⋯h_{i_r}(η^{r})][h_{k₁}(η^{r+1})⋯h_{k_{r'}}(η^{r+r'})]\
  \ · [θ^{j₁}(v₁)⋯θ^{j_s}(v_s)][θ^{l₁}(v_{s+1})⋯θ^{l_{s'}}(v_{s+s'})].\n\n结论随之得出。\n\
  \n定理 5.1.5表明，每个张量均以 (5.1.5) 给出的标准格式表示时，张量的乘积仍可表示为该相同格式。\n\n### 例 5.1.6（克罗内克 Delta）。设\
  \ \\(V\\) 为向量空间，设 ℋ = (h₁,...,h_m) 为 \\(V\\) 的基，设 (θ¹,...,θ^m) 为其对偶基。如上所述，在经典文献中，张量是通过给出其关于\

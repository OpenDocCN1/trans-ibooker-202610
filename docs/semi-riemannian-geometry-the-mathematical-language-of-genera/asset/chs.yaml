  \ 也是光滑的。我们随后由定理 10.1.17 得到 $G=(G\\circ\\varphi^{-1})\\circ\\varphi$ 在 $U$ 上光滑。\n\
  \n(b): 这由 (12.2.3) 和部分 (c) 得出。\n\n继续定理 12.2.11 的设定，我们注意到，对 $M$ 上每个图表存在一个单位法光滑向量场，并不保证沿\
  \ $M$ 存在一个单位法光滑向量场。原因在于，对不同图表对应的单位法向量场可能在它们坐标域像的重叠上不一致。在第 12.7 节，我们对 $M$ 施加额外的结构来解决此问题。\n\
  \n现在让我们把注意力转向 $\\mathbb{R}^3_\\nu$ 中一类特殊的正则曲面。回顾第 3.1 节，对应于 $\\mathbb{R}^3_\\nu$\
  \ 的二次函数 $q$ 由 $q(\\cdot)=\\langle\\cdot,\\cdot\\rangle$ 给出。我们考虑 $q$ 的三个水平集，其中第一个我们之前见过。对\
  \ $\\nu=0$，**单位球面**为\n\n$$S^2=\\{p\\in\\mathbb{R}^3_0:q(p)=1\\}=q^{-1}(1). \\tag{12.2.6}$$\n\
  \n对 $\\nu=1$，我们定义 **伪球面** 为\n\n$$P^2=\\{p\\in\\mathbb{R}^3_1:q(p)=1\\}=q^{-1}(1),\
  \ \\tag{12.2.7}$$\n\n以及 **双曲空间** 为\n\n$$H^2=\\{p\\in\\mathbb{R}^3_1:q(p)=-1\\}=q^{-1}(-1).\
  \ \\tag{12.2.8}$$\n\n因此，$S^2$ 是 $\\mathbb{R}^3_0$ 中（类空）单位向量的集合，$P^2$ 是 $\\mathbb{R}^3_1$\
  \ 中类空单位向量的集合，而 $H^2$ 是 $\\mathbb{R}^3_1$ 中类时单位向量的集合。合起来，$S^2$、$P^2$ 和 $H^2$ 被称为\

  ne (0,0,0)$，并且由定理 8.4.4 和定理 11.4.1(b)，$H_1|_{\\varphi^{-1}(p)}\\times H_2|_{\\varphi^{-1}(p)}$\
  \ 在所有 $p$ 在 $\\varphi(U)$ 中属于 $T_p(\\varphi(U))^\\perp$。由此可得 $G\\circ\\varphi^{-1}$\
  \ 是沿 $\\varphi(U)$ 的单位法向量场。我们由 [G2] 和定理 12.2.4 得到 $G\\circ\\varphi^{-1}$ 满足 [V2]。由于\
  \ $H_1$ 和 $H_2$ 在 $U$ 上光滑，由定理 10.1.17 和定理 11.2.8，$H_1\\circ\\varphi^{-1}\\times\

  ,2\\,4)(3\\,6\\,5)=(1\\,2)(2\\,4)(3\\,6)(6\\,5).\n\\]\n\n## B.3 环\n\n一个**环**是一个三元组\\\
  ((R,+,\\circ)\\)，其中\\(R\\)是一个集合，\\(+:R\\times R\\longrightarrow R\\)和\\(\\circ:R\\\
  times R\\longrightarrow R\\)是映射，分别称为**加法**和**乘法**，满足对所有\\(R\\)中的\\(a,b,c\\)：\n\n\
  - [R1] \\((R,+)\\)是交换群。\n\n- [R2] 乘法是**结合的**：\n  \\[\n  a\\circ(b\\circ c)=(a\\\
  circ b)\\circ c.\n  \\]\n\n- [R3] 加法和乘法满足**分配律**：\n  \\[\n  \\begin{aligned}\n \
  \ a\\circ(b+c)&=(a\\circ b)+(a\\circ c),\\\\\n  (a+b)\\circ c&=(a\\circ c)+(b\\\
  circ c).\n  \\end{aligned}\n  \\]\n\n通常将\\(a\\circ b\\)简写为\\(ab\\)。如果乘法是交换的，即对\\\
  (R\\)中所有\\(a,b\\)有\\(ab=ba\\)，则称\\(R\\)是**交换的**。此外，如果\\(R\\)中存在一个元素\\(\\mathrm{id}_R\\\
  )，称为（乘法）**单位元**，使得对\\(R\\)中所有\\(a\\)有\n\n\\[\n\\mathrm{id}_R\\,a=a\\,\\mathrm{id}_R=a\n\
  \\]\n\n则称\\(R\\)为**含单位元的环**。例如，整数集\\(\\{\\ldots,-2,-1,0,1,2,\\ldots\\}\\)是含单位元的交换环。\n\
  \n## B.4 域\n\n一个**域**是含单位元的交换环\\((F,+,\\circ)\\)，且\\((F\\setminus\\{0\\},\\circ)\\\
  )是一个群。即，对于\\(F\\)中每个非零元素\\(a\\)，在\\(F\\)中存在一个元素\\(a^{-1}\\)，称为\\(a\\)的（乘法）**逆元**，使得\n\
  \n\\[\na a^{-1}=a^{-1}a=\\mathrm{id}_F.\n\\]\n\n例如，实数集是一个域。\n\n## B.5 多重线性映射\n\n\
  设\\(V_1,\\ldots,V_m\\)为\\(R\\)-模。我们通过如下定义加法和数乘，使\\(V_1\\times\\cdots\\times V_m\\\
  )成为\\(R\\)-模：对所有\\(V_1\\times\\cdots\\times V_m\\)中的\\((v_1,\\ldots,v_m)\\)、\\((w_1,\\\
  ldots,w_m)\\)以及所有\\(c\\in R\\)，令\n\n\\[\n(v_1,\\ldots,v_m)+(w_1,\\ldots,w_m)=(v_1+w_1,\\\
  ldots,v_m+w_m)\n\\]\n\n且\n\n\\[\nc(v_1,\\ldots,v_m)=(cv_1,\\ldots,cv_m).\n\\]\n\n\
  如果\\(V\\)和\\(W\\)是\\(R\\)-模，且\\(V_1=\\cdots=V_r=V\\)、\\(V_{r+1}=\\cdots=V_s=W\\\
  )，其中\\(r+s=m\\)，我们记\n\n\\[\nV\\times\\cdots\\times V\\times W\\times\\cdots\\times\
  \ W\n\\qquad\\text{为}\\qquad\nV^r\\times W^s.\n\\]\n\n对于\\(R\\)-模\\(V_1,\\ldots,V_m,W\\\
  )，如果映射\n\n\\[\n\\mathcal A:V_1\\times\\cdots\\times V_m\\longrightarrow W\n\\]\n\
  \n在每一个自变量上都是\\(R\\)-线性的，则称它是**\\(R\\)-多重线性的**。即，对所有\\(V_i\\)中的\\(v_i,w_i\\)和所有\\\
  (c\\in R\\)，\n\n\\[\n\\mathcal A(v_1,\\ldots,cv_i+w_i,\\ldots,v_m)=\nc\\mathcal\
  \ A(v_1,\\ldots,v_i,\\ldots,v_m)+\\mathcal A(v_1,\\ldots,w_i,\\ldots,v_m)\n\\]\n\
  \n其中\\(i=1,\\ldots,m\\)。从\\(V_1\\times\\cdots\\times V_m\\)到\\(W\\)的\\(R\\)-多重线性映射的集合记为\n\
  \n\\[\n\\operatorname{Mult}_R(V_1\\times\\cdots\\times V_m,W).\n\\]\n\n我们通过如下定义加法和数乘，使\\\
  (\\operatorname{Mult}_R(V_1\\times\\cdots\\times V_m,W)\\)成为\\(R\\)-模：对所有\\(\\operatorname{Mult}_R(V_1\\\
  times\\cdots\\times V_m,W)\\)中的映射\\(\\mathcal A,\\mathcal B\\)和所有\\(c\\in R\\)，令\n\
  \n\\[\n(\\mathcal A+\\mathcal B)(v_1,\\ldots,v_m)=\n\\mathcal A(v_1,\\ldots,v_m)+\\\
  mathcal B(v_1,\\ldots,v_m)\n\\]\n\n且\n\n\\[\n(c\\mathcal A)(v_1,\\ldots,v_m)=c\\\
  mathcal A(v_1,\\ldots,v_m)\n\\]\n\n对所有\\((v_1,\\ldots,v_m)\\in V_1\\times\\cdots\\\
  times V_m\\)成立。\\(\\operatorname{Mult}_R(V_1\\times\\cdots\\times V_m,W)\\)的**零元素**记为\\\
  (0\\)，即零映射，也就是将\\(V_1\\times\\cdots\\times V_m\\)的所有元素映至\\(W\\)的零元素的映射。当\\(m=1\\\
  )时，\\(R\\)-多重线性映射就是\\(R\\)-线性映射。在这种情况下，我们使用记号\\(\\operatorname{Lin}_R(V,W)\\)。由于\\\
  (R\\)是自身的\\(R\\)-模，上述考虑也涵盖了\\(R\\)-模\\(\\operatorname{Mult}_R(V_1\\times\\cdots\\\
  times V_m,R)\\)、\\(\\operatorname{Mult}_R(V^m,R)\\)和\\(\\operatorname{Lin}_R(V,R)\\\
  )。\n\n## B.6 向量空间\n\n域\\(F\\)（视为含单位元的交换环）上的模\\(V\\)称为**\\(F\\)上的向量空间**（或**\\(F\\\
  )-向量空间**）。\\(V\\)的\\(F\\)-子模称为\\(V\\)的**子空间**，\\(F\\)-模同态（同构）称为**\\(F\\)-线性映射（\\\
  (F\\)-线性同构）**。\n\n设\\(W\\)是\\(F\\)上的向量空间。在B.5节的记号下，我们有\\(F\\)-向量空间\\(\\mathrm{Mult}_F(V_1\\\
  times\\cdots\\times V_m,W)\\)、\\(\\mathrm{Mult}_F(V^m,W)\\)和\\(\\mathrm{Lin}_F(V,W)\\\
  )。为简洁起见，当\\(F=\\mathbb R\\)时，我们在记号中省略下标\\(\\mathbb R\\)，记作\\(\\mathrm{Mult}(V_1\\\
  times\\cdots\\times V_m,W)\\)、\\(\\mathrm{Mult}(V^m,W)\\)和\\(\\mathrm{Lin}(V,W)\\\
  )。特别地，当\\(F=W=\\mathbb R\\)时，我们得到\\(\\mathrm{Mult}(V_1\\times\\cdots\\times V_m,\\\
  mathbb R)\\)、\\(\\mathrm{Mult}(V^m,\\mathbb R)\\)和\\(\\mathrm{Lin}(V,\\mathbb R)\\\
  )。\n\n## B.7 李代数\n\n设\\(R\\)是含单位元的交换环。一个**\\(R\\)上的李代数**是一个四元组\\((V,+,\\circ,[\\\
  cdot,\\cdot])\\)，其中\\((V,+,\\circ)\\)是一个\\(R\\)-模，\\([\\cdot,\\cdot]:V\\times V\\\
  longrightarrow V\\)是一个映射，称为**李括号**，满足对所有\\(V\\)中的\\(u,v,w\\)和所有\\(c\\in R\\)：\n\n\
  - [L1] 李括号是**\\(R\\)-双线性的**：\n  \\[\n  [cu+v,w]=c[u,w]+[v,w],\n  \\qquad\n  [u,cv+w]=c[u,v]+[u,w].\n\
  \  \\]\n\n- [L2] 李括号是**交错的**：\n  \\[\n  [v,w]=-[w,v].\n  \\]\n\n- [L3] 李括号满足**雅可比恒等式**：\n\
  \  \\[\n  [u,[v,w]]+[v,[w,u]]+[w,[u,v]]=0.\n  \\]\n\n例如，设\\(R\\)是含单位元的（不一定交换的）环，定义映射\\\
  ([\\cdot,\\cdot]:R\\times R\\longrightarrow R\\)为对\\(R\\)中所有\\(a,b\\)有\\([a,b]=ab-ba\\\
  )。则\\((R,+,\\circ,[\\cdot,\\cdot])\\)是\\(R\\)上的李代数。\n"

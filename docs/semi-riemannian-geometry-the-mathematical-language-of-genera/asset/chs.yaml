  \ 的示意图\n\n## 11.3 $\\mathbb{R}^3$ 中的切平面\n\n在定义了正则曲面并建立了其一些基本性质之后，我们现在能够给出“切平面”的严格定义。\n\
  \n设 $M$ 为正则曲面。曲线（在 $M$ 上）为曲线 $\\lambda(t) : I \\longrightarrow M$ 如第 11.1 节所定义，且额外要求其取值在\
  \ $M$ 中。设 $p$ 为 $M$ 中一点。我们称 $\\mathbb{R}^3$ 中的向量 $v$ 为 $M$ 在 $p$ 处的切向量，如果存在光滑曲线\
  \ $\\lambda(t) : (a, b) \\longrightarrow M$ 使得 $\\lambda(t_0) = p$ 且 $(d\\lambda/dt)(t_0)\
  \ = v$ 对某个 $t_0$ 在 $(a, b)$ 中成立。$M$ 在 $p$ 处的切平面记为 $T_p(M)$ 并定义为所有此类切向量的集合：\n\n```\n\
  Tₚ(M) = { dλ/dt (t₀) : λ(t) : (a, b) ⟶ M is smooth, λ(t₀) = p, t₀ ∈ (a, b) }.\n\
  ```\n\n## 定理 11.3.1. 设 $M$ 为正则曲面，$p$ 为 $M$ 中一点，$(U, \\varphi)$ 为 $p$ 处的坐标图，且 $q\
  \ = \\varphi^{-1}(p)$。则：\n\n- (a) $T_p(M)$ 为 $\\mathbb{R}^3$ 的 2 维子空间。\n- (b) $(H_1|_q,\
  \ H_2|_q)$ 为 $T_p(M)$ 的基，称为对应于 $(U, \\varphi)$ 的坐标基。\n- (c) $T_p(M) = d_q(\\varphi)(\\\
  mathbb{R}^2)$。\n- (d) $d_q(\\varphi) : \\mathbb{R}^2 \\longrightarrow T_p(M)$ 为线性同构。\n\
  \n证明。 (a), (b)：我们断言 $T_p(M) = \\text{span}(\\{H_1|_q, H_2|_q\\})$。\n\n(⊆)：设 $v$\
  \ 为 $T_p(M)$ 中的向量。由定义，存在光滑曲线 $\\lambda(t) : (a, b) \\longrightarrow M$ 使得 $\\lambda(t_0)\
  \ = p$ 且 $(d\\lambda/dt)(t_0) = v$ 对某个 $t_0$ 在 $(a, b)$ 中成立。若不失一般性，设 $\\lambda((a,\
  \ b)) \\subset \\varphi(U)$。由此可得\n\n\n\n定理 10.1.17 和定理 11.2.8 表明映射\n\n\\[ \\mu =\
  \ (\\mu^1, \\mu^2) = \\varphi^{-1} \\circ \\lambda : (a,b) \\longrightarrow U \\\
  ]\n\n是光滑的。由定理 10.1.10，\n\n\\[ v = \\frac{d\\lambda}{dt}(t_0) = \\frac{d(\\varphi\
  \ \\circ \\mu)}{dt}(t_0) = \\sum_i \\frac{d\\mu^i}{dt}(t_0) H_i|_q, \\]\n\n所以 $v$\
  \ 在 $H_1|_q$ 和 $H_2|_q$ 的张成空间中。因此，$T_p(M) \\subseteq \\operatorname{span}\\{H_1|_q,\
  \ H_2|_q\\}$。\n\n$(\\supseteq)$：设 $(e_1,e_2)$ 为 $\\mathbb{R}^2$ 的标准基。对给定的 $1 \\\
  le i \\le 2$，我们定义光滑映射\n\n\\[ \\zeta = (\\zeta^1,\\zeta^2) : (-\\varepsilon,\\varepsilon)\
  \ \\longrightarrow U \\]\n\n为 $\\zeta(t)=q+t e_i$，其中 $\\varepsilon>0$ 选得足够小使得 $(q-\\\
  varepsilon e_i,q+\\varepsilon e_i)\\subset U$。考虑光滑曲线 $\\lambda(t):(-\\varepsilon,\\\
  varepsilon)\\longrightarrow M$ 定义为 $\\lambda=\\varphi\\circ\\zeta$，并注意到 $\\lambda(0)=\\\
  varphi(q)$。由定理 10.1.10，\n\n\\[ \\frac{d\\lambda}{dt}(0)=\\frac{d(\\varphi\\circ\\\
  zeta)}{dt}(0)=\\sum_j \\frac{d\\zeta^j}{dt}(0)H_j|_q = H_i|_q, \\qquad (11.3.1)\
  \ \\]\n\n所以 $H_i|_q$ 在 $T_p(M)$ 中，$i=1,2$。因此，$\\operatorname{span}\\{H_1|_q, H_2|_q\\\
  }\\subseteq T_p(M)$。\n\n这证明了断言。我们由第 11.2 节的 [C1] 和定理 11.2.2 得到 $H_1|_q$ 和 $H_2|_q$\
  \ 线性无关。结果得证。\n\n(c)：这由定理 11.2.1(b) 和部分 (b) 得出。\n\n(d)：我们由部分 (c) 得到 $d_q(\\varphi):\\\
  mathbb{R}^2\\longrightarrow T_p(M)$ 是良定义的，且由第 11.2 节的 [C1] 得到它是单射。结果现在由部分 (a) 和定理\
  \ 1.1.14 得出。\n\n在定理 11.3.1 的记号中，令我们记\n\n\\[ (H_1, H_2) \\quad \\text{by} \\quad\
  \ \\mathcal{H}, \\]\n\n和\n\n\\[ (H_1|_q, H_2|_q) \\quad \\text{by} \\quad \\mathcal{H}_q.\
  \ \\]\n\n我们称 $\\mathcal{H}$ 为对应于 $(U,\\varphi)$ 的坐标标架。尽管有把 $T_p(M)$ 视为在点 $p$ 处“切”于\
  \ $M$ 的倾向，由定理 11.3.1(a)，$T_p(M)$ 是 $\\mathbb{R}^3$ 的一个子空间。作为子空间，$T_p(M)$ 经过 $\\\
  mathbb{R}^3$ 的原点 $(0,0,0)$。在几何术语中，是 $T_p(M)+p$，即 $T_p(M)$ 由 $p$ 平移后，才是切于 $p$ 处的\
  \ $M$。话虽如此，在图中把切平面标记为 $T_p(M)$ 而非 $T_p(M)+p$ 是方便的。\n\n## 例 11.3.2 ($\\mathcal{S}^2$)。\n\
  \n继续例 11.2.6，考虑图表 $(D,\\varphi_1)$，其中 $\\varphi_1(x,y)=(x,y,\\sqrt{1-x^2-y^2})$。相应的坐标标架由\n\
  \n\\[ \\left(\\frac{\\partial\\varphi_1}{\\partial x}(x,y),\\frac{\\partial\\varphi_1}{\\\
  partial y}(x,y)\\right)=\\left(\\left(1,0,-\\frac{x}{\\sqrt{1-x^2-y^2}}\\right),\\\
  left(0,1,-\\frac{y}{\\sqrt{1-x^2-y^2}}\\right)\\right). \\]\n\n例如，在 $\\varphi_1(0,0)=(0,0,1)$\
  \ 处，坐标基是 $((1,0,0),(0,1,0))$，它张成 $\\mathbb{R}^3$ 中的 $xy$-平面。\n\n### 定理 11.3.3 (坐标基变换)。\n\
  \n设 $M$ 为正则曲面，$p$ 为 $M$ 中的点，$(U,\\varphi)$ 和 $(\\widetilde U,\\widetilde\\varphi)$\
  \ 为 $p$ 处的图表，且 $\\mathcal H$ 和 $\\widetilde{\\mathcal H}$ 为相应的坐标标架。则\n\n$$[\\operatorname{id}_{T_p(M)}]_{\\\
  mathcal H_q}^{\\widetilde{\\mathcal H}_{\\widetilde q}}=J_{\\widetilde\\varphi^{-1}\\\
  circ\\varphi}(q),$$\n\n其中 $q=\\varphi^{-1}(p)$ 且 $\\widetilde q=\\widetilde\\varphi^{-1}(p)$。\n\
  \n**证明。** 设 $\\mathcal H=(H_1,H_2)$ 且 $\\widetilde{\\mathcal H}=(\\widetilde H_1,\\\
  widetilde H_2)$，且 $(r^1,r^2)$ 和 $(\\widetilde r^1,\\widetilde r^2)$ 分别为 $U$ 和 $\\\
  widetilde U$ 上的坐标。由定理 11.2.9， transition map $F=(F^1,F^2)=\\widetilde\\varphi^{-1}\\\
  circ\\varphi$ 是微分同胚，因而光滑。由定理 10.1.10 可得\n\n$$H_{\\widetilde j\\mid q}=\\frac{\\\
  partial\\varphi}{\\partial r^j}(q)=\\frac{\\partial(\\widetilde\\varphi\\circ F)}{\\\
  partial r^j}(q)=\\sum_i\\frac{\\partial F^i}{\\partial r^j}(q)\\widetilde H_{i\\\
  mid\\widetilde q},$$\n\n然后由 (2.2.6)、(2.2.7) 和 (10.1.2) 可得\n\n$$[\\operatorname{id}_{T_p(M)}]_{\\\
  mathcal H_q}^{\\widetilde{\\mathcal H}_{\\widetilde q}}=\\left[\\frac{\\partial\
  \ F^i}{\\partial r^j}(q)\\right]=J_{\\widetilde\\varphi^{-1}\\circ\\varphi}(q).$$\n\
  \n### 例 11.3.4 (极坐标)。\n\n$\\mathbb R^3$ 中的 $xy$-平面，这里记为 $\\operatorname{Pln}$，显然是一个正则曲面。考虑\
  \ $\\mathbb R^2$ 中的开集\n\n$$U=\\{(\\rho,\\phi)\\in\\mathbb R^2:\\rho>0,\\ 0<\\phi<2\\\
  pi\\}$$\n\n并定义映射 $\\varphi:U\\to\\mathbb R^3$ 为\n\n$$\\varphi(\\rho,\\phi)=(\\rho\\\
  cos(\\phi),\\rho\\sin(\\phi),0)$$\n\n对所有 $(\\rho,\\phi)$ 在 $U$ 中。$\\varphi$ 的像为去掉非负\
  \ $x$-轴的 $\\operatorname{Pln}$。易证 $(U,\\varphi)$ 是 $\\operatorname{Pln}$ 上的一个图表，我们称之为\
  \ **极坐标**。\n\n$\\operatorname{Pln}$ 上的一个覆盖图表由 $(\\widetilde U=\\mathbb R^2,\\widetilde\\\
  varphi)$ 给出，其中 $\\widetilde\\varphi:\\mathbb R^2\\to\\operatorname{Pln}$ 定义为 $\\\
  widetilde\\varphi(x,y)=(x,y,0)$。对应于 $(U,\\varphi)$ 和 $(\\widetilde U,\\widetilde\\\
  varphi)$ 的坐标标架由\n\n$$\\mathcal H_{(\\rho,\\phi)}=\\left(\\frac{\\partial\\varphi}{\\\
  partial\\rho}(\\rho,\\phi),\\frac{\\partial\\varphi}{\\partial\\phi}(\\rho,\\phi)\\\
  right)=\\big((\\cos(\\phi),\\sin(\\phi),0),(-\\rho\\sin(\\phi),\\rho\\cos(\\phi),0)\\\
  big)$$\n\n和\n\n$$\\widetilde{\\mathcal H}_{(x,y)}=\\left(\\frac{\\partial\\widetilde\\\
  varphi}{\\partial x}(x,y),\\frac{\\partial\\widetilde\\varphi}{\\partial y}(x,y)\\\
  right)=((1,0,0),(0,1,0)),$$\n\n分别给出。 transition map $\\widetilde\\varphi^{-1}\\\
  circ\\varphi:U\\to\\widetilde U$ 定义为\n\n$$\\widetilde\\varphi^{-1}\\circ\\varphi(\\\
  rho,\\phi)=(\\rho\\cos(\\phi),\\rho\\sin(\\phi)).$$\n\n经典地，$x$ 和 $y$ 被视为 $\\rho$\
  \ 和 $\\phi$ 的函数，并表示为\n\n$$x(\\rho,\\phi)=\\rho\\cos(\\phi)\\qquad\\text{and}\\qquad\
  \ y(\\rho,\\phi)=\\rho\\sin(\\phi).$$\n\n## 正则曲面中的开集。\n\n正如我们现在所示，正则曲面中的开集本身就是一个正则曲面。\n\
  \n## 定理 11.4.1 (开集)。设 $M$ 为正则曲面，$V$ 为 $M$ 中的开集，并把 $V$ 视为 $\\mathbb{R}^3$ 的拓扑子空间。则：\n\
  \n- (a) $V$ 是正则曲面。\n- (b) 对所有点 $p$ 在 $V$ 中，$T_p(V) = T_p(M)$。\n\n证明。 (a)：设 $p$ 为\
  \ $V$ 中的点，且 $(U, \\varphi)$ 为 $M$ 上在 $p$ 处的图表。我们有第 11.2 节的性质 [C1]–[C3] 可用。根据 [C2]，$\\\
  varphi(U)$ 在 $M$ 中是开的，因此 $\\varphi(U) \\cap V$ 也是开的。由 [C3] 和定理 9.1.14 可得 $U′ = \\\
  varphi^{-1}(V \\cap \\varphi(U))$ 在 $U$ 中是开的。由定理 11.2.10，$(U′, \\varphi|U′)$ 是在\
  \ $p$ 处的图表使得 $\\varphi|U′(U′) \\subseteq V$。由于 $p$ 是任意的，结果得证。\n(b)：设 $v$ 为 $T_p(V)$\
  \ 中的向量，且 $\\lambda(t) : (a, b) \\longrightarrow V$ 为光滑曲线使得 $\\lambda(t₀) = p$ 且\
  \ $(d\\lambda/dt)(t₀) = v$ 对某个 $t₀$ 在 $(a, b)$ 中。 由于 $V \\subseteq M$，同一光滑曲线表明 $v$\
  \ 也是 $T_p(M)$ 中的向量。因此，$T_p(V) \\subseteq T_p(M)$。由定理 11.3.1(a)，$T_p(V)$ 和 $T_p(M)$\
  \ 都是 2 维的，然后定理 1.1.7(b) 给出 $T_p(V) = T_p(M)$。\n\n## 在此之后，正则曲面中的任何开集都被视为正则曲面。\n\n\
  ## 函数的图像。\n\n根据定理 11.2.11，正则曲面被函数的图像所覆盖。我们现在孤立地考虑函数的图像。设 $U$ 为 $\\mathbb{R}^2$ 中的开集，且\
  \ $f$ 为 $C^\\infty(U)$ 中的函数。回顾定理 11.2.11，\n\ngraph(f) = { (x, y, f(x, y)) ∈ ℝ³ :\
  \ (x, y) ∈ U },\n\n其中我们把 $\\mathbb{R}^2$ 识别为 $\\mathbb{R}^3$ 中的 $xy$-平面。定义映射 $\\\
  varphi : U ⟶ ℝ³$ 为\n\nφ(x, y) = (x, y, f(x, y))\n\n对所有 $(x, y)$ 在 $U$ 中，我们看到 graph(f)\
  \ 是 $\\varphi$ 的像；即\n\ngraph(f) = φ(U)。\n\n## 定理 11.4.2 (函数图像)。在上述设定下，graph(f)，视为\
  \ $\\mathbb{R}^3$ 的拓扑子空间，是正则曲面，且 $(U, φ)$ 是 graph(f) 上的覆盖图表。\n\n证明。显然，φ : U ⟶ ℝ³\
  \ 是参数化曲面。我们需要证明：\n\n- [C1] φ : U ⟶ ℝ³ 是浸入。\n- [C2] φ(U) 在 graph(f) 中是开集。\n- [C3]\
  \ φ : U ⟶ φ(U) 是同胚。\n\n证明如下：\n\n[C1]：雅可比矩阵为\n\n| 1 | 0 |\n| 0 | 1 |\n| ∂f/∂x (x,y)\
  \ | ∂f/∂y (x,y) |\n\n相应的向量积为\n\n```\n(1,0,∂f/∂x(x,y)) × (1,0,∂f/∂y(x,y)) = (-∂f/∂x(x,y),\
  \ -∂f/∂y(x,y),1)\n```\n\n它永不等于 $(0,0,0)$。由定理 11.2.2，φ 是浸入。\n\n[C2]：这由 φ(U) = graph(f)\
  \ 得出。\n\n[C3]：显然，φ 是双射的。由于 φ 是光滑的，由定理 10.1.7 它是连续的。设 P: ℝ³ ⟶ ℝ² 为投影映射定义为 P(x,y,z)\
  \ = (x,y)，其中我们把 ℝ² 识别为 ℝ³ 中的 $xy$-平面。由于 P 是连续的且 φ⁻¹|graph(f) = P|graph(f)，结果得证。\n\
  \n因此，$(U,φ)$ 是 graph(f) 上的图表，且由于 φ(U) = graph(f)，它是覆盖图表。\n\n## 旋转曲面。\n\n设 ρ(t),\
  \ h(t) : (a,b) ⟶ ℝ 为光滑函数使得：\n\n- [R1] ρ 在 $(a,b)$ 上严格为正。\n- [R2] h 在 $(a,b)$ 上严格递增或严格递减。\n\
  \n我们称 ρ 和 h 分别为半径函数和高度函数。在此之后，方便地用上点表示 ρ 和 h 关于 $t$ 的导数。考虑光滑曲线 σ(t) : (a,b) ⟶ ℝ³\
  \ 定义为\n\n```\nσ(t) = (ρ(t),0,h(t))\n```\n\n对所有 $t$ 在 $(a,b)$ 中。我们观察到 [R2] 等价于 ḣ\
  \ 在 $(a,b)$ 上严格为正或严格为负，由此可得 σ 是正则曲线。设\n\n```\nU = (a,b) × (-π,π)\n```\n\n并考虑光滑映射\
  \ φ : U ⟶ ℝ³ 定义为\n\n```\nφ(t,φ) = (ρ(t)cos(φ), ρ(t)sin(φ), h(t))\n```\n\n对应于 σ 的旋转曲面记为\
  \ rev(σ) 并定义为 φ 的像：\n\n```\nrev(σ) = φ(U)\n```\n\n因此，rev(σ) 是通过绕 $z$-轴旋转 σ 的像得到的。注意在定义\
  \ $U$ 时选择了 $(-π,π)$ 而非例如 $[-π,π)$ 或 $[0,2π)$，以确保 $U$ 是 $\\mathbb{R}^2$ 中的开集。因此，旋转曲面并不完全绕\
  \ $z$-轴转一圈。\n\n\n\n\n## 11.4 \\(\\mathbb{R}^3\\) 中正则曲面的类型\n\n对于 \\((a,b)\\) 中给定的点\
  \ \\(t\\)，我们定义一条光滑曲线\n\n$$\\varphi_t(\\phi):(-\\pi,\\pi)\\longrightarrow\\mathbb{R},$$\n\
  \n称其为对应于 \\(t\\) 的**纬线曲线**，由下式给出：\n\n$$\\varphi_t(\\phi)=\\varphi(t,\\phi).$$\n\n\
  类似地，对于 \\((-\\pi,\\pi)\\) 中给定的点 \\(\\phi\\)，我们定义一条光滑曲线\n\n$$\\varphi_\\phi(t):(a,b)\\\
  longrightarrow\\mathbb{R},$$\n\n称其为对应于 \\(\\phi\\) 的**经线曲线**，由下式给出：\n\n$$\\varphi_\\\
  phi(t)=\\varphi(t,\\phi).$$\n\n由\n\n$$\\varphi_t(\\phi)=\\rho(t)(\\cos(\\phi),\\\
  sin(\\phi),0)+(0,0,h(t)),$$\n\n可以看出，\\(\\varphi_t\\) 的像（除一个缺失点外）是半径为 \\(\\rho(t)\\\
  ) 的圆，圆心在 \\(z\\) 轴上，且位于与 \\(xy\\)-平面平行、高度为 \\(h(t)\\) 的平面内。\n\n**定理 11.4.3（旋转曲面）。**\
  \ *在上述设定下，\\(\\operatorname{rev}(\\sigma)\\) 作为 \\(\\mathbb{R}^3\\) 的拓扑子空间，是一个正则曲面，且\
  \ \\((U,\\varphi)\\) 是 \\(\\operatorname{rev}(\\sigma)\\) 上的一个覆盖坐标卡。*\n\n*证明.* 由于\
  \ \\(\\rho\\) 和 \\(h\\) 光滑，根据定义，\\(\\varphi\\) 也光滑。因此，\\(\\varphi:U\\longrightarrow\\\
  mathbb{R}^3\\) 是一个参数化曲面。我们需要证明：\n\n+   [C1] \\(\\varphi:U\\longrightarrow\\mathbb{R}^3\\\
  ) 是一个浸入。\n+   \n+   [C2] \\(\\varphi(U)\\) 是 \\(\\operatorname{rev}(\\sigma)\\)\
  \ 中的开集。\n+   \n+   [C3] \\(\\varphi:U\\longrightarrow\\varphi(U)\\) 是一个同胚。\n\n证明如下：\n\
  \n[C1]：雅可比矩阵为\n\n$$J_\\varphi(t,\\phi)=\\begin{bmatrix}\\dot{\\rho}(t)\\cos(\\phi)&-\\\
  rho(t)\\sin(\\phi)\\\\\\dot{\\rho}(t)\\sin(\\phi)&\\rho(t)\\cos(\\phi)\\\\\\dot{h}(t)&0\\\
  end{bmatrix},$$\n\n相应的向量积为\n\n$$(\\dot{\\rho}(t)\\cos(\\phi),\\dot{\\rho}(t)\\sin(\\\
  phi),\\dot{h}(t))\\times(-\\rho(t)\\sin(\\phi),\\rho(t)\\cos(\\phi),0)$$\n$$=\\\
  rho(t)(-\\dot{h}(t)\\cos(\\phi),-\\dot{h}(t)\\sin(\\phi),\\dot{\\rho}(t)),$$\n\n\
  它永远不会等于 \\((0,0,0)\\)；因为若它等于零，则将前述向量与自身取欧几里得内积可得\n\n$$0=\\rho(t)^2\\left([-\\dot{h}(t)\\\
  cos(\\phi)]^2+[-\\dot{h}(t)\\sin(\\phi)]^2+\\dot{\\rho}(t)^2\\right)=\\rho(t)^2[\\\
  dot{h}(t)^2+\\dot{\\rho}(t)^2]$$\n\n## 11.5  **\\(\\mathbb{R}^3\\) 中正则曲面上的函数**\n\
  \n**定理 11.5.1（函数的光滑性判据）。** *若 \\(M\\) 是一个正则曲面，且 \\(f:M\\to\\mathbb{R}\\) 是一个函数，则下列条件等价：*\n\
  \n(a) \\(f\\) *是（广义）光滑的。*\n\n(b) *对每一点* \\(p\\in M\\)，*在* \\(M\\) *上* \\(p\\) *处有一个坐标卡*\
  \ \\((U,\\varphi)\\)，*使得函数* \\(f\\circ\\varphi:U\\to\\mathbb{R}\\) *是（欧几里得）光滑的。*\n\
  \n(c) *对* \\(M\\) *上的每个坐标卡* \\((U,\\varphi)\\)，*函数* \\(f\\circ\\varphi:U\\to\\mathbb{R}\\\
  ) *是（欧几里得）光滑的。*\n\n*证明.* 在定理 11.2.12 中令 \\(n=1\\)、\\(F=f\\) 即得结果。\n\n设 \\(M\\) 是一个正则曲面。\\\
  (M\\) 上光滑函数的集合记为 \\(C^\\infty(M)\\)。我们通过如下定义的运算使 \\(C^\\infty(M)\\) 同时成为 \\(\\mathbb{R}\\\
  ) 上的向量空间和一个环：对于 \\(C^\\infty(M)\\) 中的所有函数 \\(f,g\\) 和所有实数 \\(c\\)，定义\n\n\\[(f+g)(p)=f(p)+g(p),\\\
  ]\n\\[(fg)(p)=f(p)g(p),\\]\n以及\n\\[(cf)(p)=cf(p).\\]\n\n对所有 \\(p\\in M\\) 成立。该环的单位元是常值函数\
  \ \\(1_M\\)，它将 \\(M\\) 中的所有点映射到实数 1。\n\n设 \\(f\\) 是 \\(C^\\infty(M)\\) 中的一个函数，并设\
  \ \\(p\\) 是 \\(M\\) 中的一点。\\(f\\) **在 \\(p\\) 处的微分**是映射\n\n\\[d_p(f):T_p(M)\\longrightarrow\\\
  mathbb{R}\\]\n\n定义为\n\n\\[d_p(f)(v)=\\frac{d(f\\circ\\lambda)}{dt}(t_0) \\tag{11.5.1}\\\
  ]\n\n对于 \\(T_p(M)\\) 中的所有向量 \\(v\\)，其中 \\(\\lambda(t):(a,b)\\to M\\) 是任意光滑曲线，且对某个\
  \ \\(t_0\\in(a,b)\\) 有 \\(\\lambda(t_0)=p\\) 和 \\((d\\lambda/dt)(t_0)=v\\)。\n\n\
  **定理 11.5.2.** *设 \\(M\\) 是一个正则曲面，\\(f\\) 是 \\(C^\\infty(M)\\) 中的一个函数，\\(p\\) 是\
  \ \\(M\\) 中的一点，\\(v\\) 是 \\(T_p(M)\\) 中的一个向量。则：*\n\n(a) \\(d_p(f)(v)\\) *与用来表示*\
  \ \\(v\\) *的光滑曲线的选取无关。*\n\n(b) \\(d_p(f)\\) *是线性的。*\n\n*证明.* 设 \\((U,\\varphi)\\\
  ) 是 \\(p\\) 处的一个坐标卡，并设 \\(\\lambda(t):(a,b)\\to M\\) 是一条光滑曲线，使得对某个 \\(t_0\\in(a,b)\\\
  ) 有 \\(\\lambda(t_0)=p\\) 和 \\((d\\lambda/dt)(t_0)=v\\)。不失一般性，假设 \\(\\lambda((a,b))\\\
  subset\\varphi(U)\\)，并令 \\(q=\\varphi^{-1}(p)\\)。由定理 10.1.17 和定理 11.2.8 可知，映射\n\n\
  \\[\\mu=(\\mu^1,\\mu^2)=\\varphi^{-1}\\circ\\lambda:(a,b)\\longrightarrow U\\]\n\
  \n是（欧几里得）光滑的，且由定理 10.1.9 可知\n\n\\[v=\\frac{d\\lambda}{dt}(t_0)=\\frac{d(\\varphi\\\
  circ\\mu)}{dt}(t_0)=d_q(\\varphi)\\left(\\frac{d\\mu}{dt}(t_0)\\right).\\]\n\n由定理\
  \ 11.3.1(d)，$d_q(\\varphi)$ 是可逆的，所以\n\n$$\\frac{d\\mu}{dt}(t_0)=d_q(\\varphi)^{-1}(v).$$\n\
  \n于是\n\n$$\\begin{aligned}\nd_p(f)(v)&=\\frac{d(f\\circ\\lambda)}{dt}(t_0)\\\\\n\
  &=\\frac{d(f\\circ\\varphi\\circ\\mu)}{dt}(t_0)\\\\\n&=d_{\\mu(t_0)}(f\\circ\\varphi)\\\
  left(\\frac{d\\mu}{dt}(t_0)\\right)\\\\\n&=d_q(f\\circ\\varphi)\\circ d_q(\\varphi)^{-1}(v).\n\
  \\end{aligned}$$\n\n上述恒等式是有意义的，因为我们有映射 $d_q(\\varphi)^{-1}:T_p(M)\\longrightarrow\\\
  mathbb{R}^2$ 和 $d_q(f\\circ\\varphi):\\mathbb{R}^2\\longrightarrow\\mathbb{R}$，因此\
  \ $d_p(f):T_p(M)\\longrightarrow\\mathbb{R}$。\n\n(a)：这由 (11.5.3) 得出。\n\n(b)：由于 $v$\
  \ 是任意的，由 (11.5.3) 可得\n\n$$d_p(f)=d_q(f\\circ\\varphi)\\circ d_q(\\varphi)^{-1}.$$\n\
  \n因此，$d_p(f)$ 是线性映射的复合，所以它也是线性的。\n\n下一个结果是定理 10.1.3 的对应结论。\n\n**定理 11.5.3.**\n\n\
  设 $M$ 是一个正则曲面，$f,g$ 是 $C^\\infty(M)$ 中的函数，$p$ 是 $M$ 中的一点，$c$ 是一个实数。则：\n\n(a) $d_p(cf+g)=c\\\
  ,d_p(f)+d_p(g)$。\n\n(b) $d_p(fg)=f(p)\\,d_p(g)+g(p)\\,d_p(f)$。\n\n*证明.* 设 $v$ 是\
  \ $T_p(M)$ 中的一个向量，并设 $\\lambda(t):(a,b)\\longrightarrow M$ 是一条光滑曲线，使得对某个 $t_0\\\
  in(a,b)$ 有 $\\lambda(t_0)=p$ 和 $(d\\lambda/dt)(t_0)=v$。则\n\n$$\\begin{aligned}\n\
  d_p(cf+g)(v)&=\\frac{d((cf+g)\\circ\\lambda)}{dt}(t_0)\\\\\n&=\\frac{d((cf\\circ\\\
  lambda)+(g\\circ\\lambda))}{dt}(t_0)\\\\\n&=c\\frac{d(f\\circ\\lambda)}{dt}(t_0)+\\\
  frac{d(g\\circ\\lambda)}{dt}(t_0)\\\\\n&=c\\,d_p(f)(v)+d_p(g)(v)\\\\\n&=(c\\,d_p(f)+d_p(g))(v).\n\
  \\end{aligned}$$\n\n由第 11.2 节可知，φ(U) 在 M 中是开的，因此存在 ℝ³ 中的开集 \U0001D4B1，使得 φ(U) =\

- "## 第 14 章\n\n## 光滑流形\n\n### 14.1 光滑流形\n\n本章及后续章节中提出的许多定义都是我们在研究曲线和曲面时所遇到的定义的改编。\n\
  \n设 $M$ 为拓扑空间。$M$ 上的一个 **图** 是一个对 $(U,\\varphi)$，其中 $U$ 是 $M$ 中的开集且 $\\varphi: U\
  \ \\longrightarrow \\mathbb{R}^m$ 是一个映射，使得：\n\n- [C1] $\\varphi(U)$ 是 $\\mathbb{R}^m$\
  \ 中的开集。\n- [C2] $\\varphi: U \\longrightarrow \\varphi(U)$ 是一个同胚。\n\n我们称 $U$ 为该图的\
  \ **坐标域**，称 $\\varphi$ 为其 **坐标映射**，称 $m$ 为该图的 **维数**。对于 $U$ 中的每一点 $p$，我们说 $(U,\\\
  varphi)$ 是 $p$ 处的 **图**。（注意在正则曲面的定义中，坐标映射是从 $\\mathbb{R}^2$ 中的开集到正则曲面中的开集，而现在方向相反。）当\
  \ $U=M$ 时，我们说 $(M,\\varphi)$ 是 $M$ 上的一个 **覆盖图**，并且 $M$ 被 $(M,\\varphi)$ 覆盖。在当前背景下，$\\\
  varphi$ 的分量函数记为 $\\varphi=(x^1,\\ldots,x^m)$ 而不是 $\\varphi=(\\varphi^1,\\ldots,\\\
  varphi^m)$，并且被称为 $U$ 上的 **局部坐标**。这种记号的选择专门用于鼓励将点 $p$ 在 $M$ 中与它的局部坐标对应物 $\\varphi(p)=(x^1(p),\\\
  ldots,x^m(p))$ 在 $\\mathbb{R}^m$ 中进行非正式的识别。我们经常用\n\n$(U,\\varphi) \\quad\\text{by}\\\
  quad (U,(x^i)) \\quad\\text{or}\\quad (U,\\varphi=(x^i)),$\n\n其中 $(x^i)=(x^1,\\\
  ldots,x^m)$。$M$ 上的图 $(U,\\varphi)$ 和 $(\\widetilde{U},\\widetilde{\\varphi})$ 被称为\
  \ **重叠** 如果 $U\\cap\\widetilde{U}$ 非空。在这种情况下，映射\n\n$\\widetilde{\\varphi}\\circ\\\
  varphi^{-1}\\big|_{\\varphi(U\\cap\\widetilde{U})}:\\varphi(U\\cap\\widetilde{U})\\\
  longrightarrow\\widetilde{\\varphi}(U\\cap\\widetilde{U})$\n\n\n称为转移映射。为简洁起见，我们通常采用如下记法：\n\
  \n\\[\n\\widetilde{\\varphi}\\circ\\varphi^{-1}\\big|_{\\varphi(U\\cap\\widetilde\
  \ U)} \\quad\\text{记作}\\quad \\widetilde{\\varphi}\\circ\\varphi^{-1},\n\\]\n\n\
  并且类似地，当上下文含义清楚时，我们常常（但并非总是）在其他记号中省略“限制”下标。$M$ 的一个图册是 $M$ 上坐标卡的一个集合 $\\mathcal A=\\\
  {(U_\\alpha,\\varphi_\\alpha):\\alpha\\in A\\}$，使得 $U_\\alpha$ 构成 $M$ 的一个开覆盖；即 $M=\\\
  bigcup_{\\alpha\\in A}U_\\alpha$。目前并不要求各坐标卡具有相同的维数。\n\n## 拓扑 $m$-流形\n\n是一个二元组 $(M,\\\
  mathcal A)$，其中 $M$ 是一个拓扑空间，$\\mathcal A$ 是 $M$ 的一个图册，并且满足：\n\n- [T1] $\\mathcal\
  \ A$ 中每个坐标卡都具有维数 $m$。\n- [T2] $M$ 的拓扑具有可数基。\n- [T3] 对 $M$ 中每一对不同的点 $p_1,p_2$，存在\
  \ $M$ 中不相交的开集 $U_1$ 和 $U_2$，使得 $p_1\\in U_1$ 且 $p_2\\in U_2$。\n\n注意，[T1] 仅涉及图册 $\\\
  mathcal A$，而 [T2] 和 [T3] 与 $M$ 的拓扑结构有关。性质 [T2] 和 [T3] 是某些构造所需的技术性条件，此处不再进一步阐述。\n\
  \n**例 14.1.1（$\\mathbb R^m$）。** $\\mathbb R^m$ 赋予欧几里得拓扑，并配以由单个坐标卡 $(\\mathbb R^m,\\\
  operatorname{id}_{\\mathbb R^m}=(r^1,\\ldots,r^m))$ 组成的图册，是一个拓扑 $m$-流形。\n\n**定理\
  \ 14.1.2.** *设 $M$ 是一个拓扑空间。若 $\\mathcal A$ 和 $\\mathcal B$ 是 $M$ 的图册，且 $(M,\\mathcal\
  \ A)$ 是拓扑 $m$-流形，$(M,\\mathcal B)$ 是拓扑 $n$-流形，则 $m=n$。*\n\n**证明。** 设 $(U,\\varphi)$\
  \ 和 $(V,\\psi)$ 分别是 $\\mathcal A$ 和 $\\mathcal B$ 中的坐标卡，且 $U\\cap V$ 非空。因为 $U\\\
  cap V$ 在 $M$ 中是开集，由 [C2] 和定理 9.1.14 可知 $\\varphi(U\\cap V)$ 在 $\\varphi(U)$ 中是开集；再由\
  \ [C1] 和定理 9.1.5 可知 $\\varphi(U\\cap V)$ 在 $\\mathbb R^m$ 中是开集。类似的推理表明 $\\varphi|_{U\\\
  cap V}:U\\cap V\\to\\varphi(U\\cap V)$ 是一个同胚。同样，$\\psi(U\\cap V)$ 在 $\\mathbb R^n$\
  \ 中是开集，且 $\\psi|_{U\\cap V}:U\\cap V\\to\\psi(U\\cap V)$ 是一个同胚。于是 $\\psi^{-1}\\\
  circ\\varphi|_{\\varphi(U\\cap V)}:\\varphi(U\\cap V)\\to\\psi(U\\cap V)$ 是一个同胚。由定理\
  \ 9.4.1，$m=n$。\n\n设 $(M,\\mathcal A)$ 是一个拓扑 $m$-流形。由定理 14.1.2 可知，$m$ 是 $(M,\\mathcal\
  \ A)$ 的一个不变量，我们称之为 **$M$ 的维数**，并记作 $\\dim(M)$。\n\n可以证明，拓扑空间的连通分支是该拓扑空间中的闭集。对于拓扑流形，其连通分支还具有额外的性质。\n\
  \n**定理 14.1.3.** *若 $(M,\\mathcal A)$ 是一个拓扑流形，则 $M$ 有可数个连通分支，且每个连通分支在 $M$ 中既是开集又是闭集。*\n\
  \n设 $(M, \\mathfrak{A})$ 是一个拓扑 $m$-流形，并设 $(U, \\varphi)$ 和 $(\\widetilde{U}, \\\
  widetilde{\\varphi})$ 是 $M$ 上相交的坐标卡。如果转移映射 $\\widetilde{\\varphi} \\circ \\varphi^{-1}$\
  \ 和 $\\varphi \\circ \\widetilde{\\varphi}^{-1}$ 是（欧几里得）光滑的，则称 $(U, \\varphi)$ 与\
  \ $(\\widetilde{U}, \\widetilde{\\varphi})$ **光滑相容**。由于 $(\\varphi \\circ \\widetilde{\\\
  varphi}^{-1})^{-1} = \\widetilde{\\varphi} \\circ \\varphi^{-1}$，这等价于 $\\widetilde{\\\
  varphi} \\circ \\varphi^{-1}$ 或 $\\varphi \\circ \\widetilde{\\varphi}^{-1}$ 是（欧几里得）微分同胚。如果\
  \ $\\mathfrak{A}$ 中任意两个相交的坐标卡都光滑相容，则称图册 $\\mathfrak{A}$ 是**光滑的**。$M$ 的光滑图册也称为 $M$\
  \ 上的**光滑结构**。回想我们在正则曲面坐标卡的研究中，假设坐标映射是光滑的，其中光滑性是利用 $\\mathbb{R}^2$ 中坐标域和外围空间 $\\\
  mathbb{R}^3$ 的相关性质来定义的。由于 $M$ 不具备这样的内在性质，我们将定理 11.2.9（一个关于正则曲面转移映射光滑性的结果）转变成拓扑流形光滑性的定义。随着内容的推进，我们将看到这种方法的更多例子：有关“曲面”的定理变成了“流形”的定义。\n\
  \n如果 $\\mathfrak{A}$ 是光滑图册，则称拓扑 $m$-流形 $(M, \\mathfrak{A})$ 为**光滑 $m$-流形**。为方便起见，我们经常简称为\
  \ $M$ 是光滑 $m$-流形，而 $\\mathfrak{A}$ 由上下文理解。此外，当不需要指明 $M$ 的维数时，我们将 $(M, \\mathfrak{A})$\
  \ 或简称为 $M$ 称为**光滑流形**。\n\n$M$ 的光滑图册 $\\mathfrak{A}$ 称为**极大**的，如果它不被 $M$ 的任何更大的光滑图册真包含。这意味着，$M$\
  \ 上任何与 $\\mathfrak{A}$ 中所有坐标卡都光滑相容的坐标卡已经在 $\\mathfrak{A}$ 中。可以证明，$M$ 的每个光滑图册都包含在唯一的极大光滑图册中。一个给定的拓扑空间可以有不同的光滑图册，它们生成同一个极大光滑图册。另一方面，一个拓扑空间也可能有不同的光滑图册，它们产生不同的极大光滑图册。因此，我们采用以下约定。\n\
  \n## 全文约定：光滑流形上的任意坐标卡均来自其底层的光滑图册或其相应的极大图册。\n\n## 例 14.1.4（$\\mathbb{R}^m$）。\n\n\
  继续例 14.1.1，显然由单个坐标卡 $(\\mathbb{R}^m, \\mathrm{id}_{\\mathbb{R}^m} = (r^1, \\dots,\
  \ r^m))$ 组成的图册是光滑的。因此，$\\mathbb{R}^m$ 不仅是拓扑 $m$-流形，还是光滑 $m$-流形。在此上下文中，坐标卡 $(\\mathbb{R}^m,\
  \ \\mathrm{id}_{\\mathbb{R}^m} = (r^1, \\dots, r^m))$ 称为 $\\mathbb{R}^m$ 上的**标准坐标**。为方便起见，我们常简称\
  \ $(r^1, \\dots, r^m)$ 是 $\\mathbb{R}^m$ 上的标准坐标。\n\n## 例 14.1.5（正则曲面）。\n\n借助定理 11.2.9\
  \ 可以证明，正则曲面是光滑 2-流形。\n\n我们在定理 1.1.10 的讨论中已经指出，所有 $m$ 维向量空间都与 $\\mathbb{R}^m$（视为向量空间）同构。鉴于例\
  \ 14.1.4，任何 $m$ 维向量空间都具有由 $\\mathbb{R}^m$（现在视为光滑 $m$-流形）诱导的光滑结构，也就不足为奇了。\n\n## 定理\
  \ 14.1.6（标准光滑结构）。\n\n*若 $V$ 是一个 $m$ 维向量空间，则 $V$ 上存在唯一的拓扑和极大光滑图册，*\n\n称为 $V$ 上的*标准光滑结构*，它使\
  \ $V$ 成为光滑 $m$-流形，并且对每个线性同构 $A : V \\longrightarrow \\mathbb{R}^m$，二元组 $(V, A)$\
  \ 是 $V$ 上的一个（覆盖）坐标卡。\n\n回顾定理 9.1.6 和定理 9.1.12 中关于积拓扑的讨论。\n\n## 定理 14.1.7（积流形）。\n\
  \n设 $(M_i, \\mathfrak{A}_i)$ 是光滑 $m_i$-流形，对 $i = 1, \\dots, k$，设 $(U_i, \\varphi_i)$\
  \ 是 $\\mathfrak{A}_i$ 中的坐标卡，并假设 $M_1 \\times \\cdots \\times M_k$ 具有积拓扑。则：\n\n-\
  \ (a) $(U_1 \\times \\cdots \\times U_k, \\varphi_1 \\times \\cdots \\times \\varphi_k)$\
  \ 是 $M_1 \\times \\cdots \\times M_k$ 上的一个坐标卡。\n- (b) 拓扑空间 $M_1 \\times \\cdots\
  \ \\times M_k$ 配以由第 (a) 部分定义的坐标卡集合所构成的光滑图册，是一个光滑 $(m_1 + \\cdots + m_k)$-流形，称为 $M_1,\
  \ \\dots, M_k$ 的*积流形*。\n\n例如，可以证明 $m$ 个 $\\mathbb{R}$ 的积流形正是带有标准光滑结构的 $\\mathbb{R}^m$。\n\
  \n## 14.2 函数与映射\n\n设 $M$ 是一个光滑流形，$f : M \\longrightarrow \\mathbb{R}$ 是一个函数。由于 $M$\
  \ 和 $\\mathbb{R}$ 都是拓扑空间，我们知道 $f$ 在 $M$ 上**连续**意味着什么。受定理 11.5.1 的启发，如果对 $M$ 中每一点\
  \ $p$，存在 $p$ 处的坐标卡 $(U, \\varphi)$，使得函数 $f \\circ \\varphi^{-1} : \\varphi(U) \\\
  longrightarrow \\mathbb{R}$ 是（欧几里得）光滑的，则称 $f$ 在 $M$ 上**光滑**。$M$ 上光滑函数的集合记为 $C^\\\
  infty(M)$。我们通过如下方式定义运算，使 $C^\\infty(M)$ 同时成为向量空间和环：对所有 $f,g\\in C^\\infty(M)$ 以及所有实数\
  \ $c$，令\n\n$(f + g)(p) = f(p) + g(p)$，\n$(fg)(p) = f(p)g(p)$，\n以及\n$(cf)(p) = c\
  \ f(p)$\n\n对所有 $p\\in M$ 成立。\n\n下一个结果与定理 11.5.1 类似。\n\n## 定理 14.2.1（函数的光滑性判别准则）。\n\
  \n设 $M$ 是一个光滑流形，$f : M \\longrightarrow \\mathbb{R}$ 是一个函数。则 $f$ 光滑当且仅当对 $M$ 上的每个坐标卡\
  \ $(U, \\varphi)$，函数 $f \\circ \\varphi^{-1} : \\varphi(U) \\longrightarrow \\mathbb{R}$\
  \ 都是（欧几里得）光滑的。\n\n*证明。* $(\\Rightarrow)$：设 $p$ 是 $M$ 中的一点。根据假设，在 $p$ 处存在一个坐标卡 $(\\\
  widetilde{U}, \\widetilde{\\varphi})$，使得 $f \\circ \\widetilde{\\varphi}^{-1} :\
  \ \\varphi(\\widetilde{U}) \\longrightarrow \\mathbb{R}$ 是（欧几里得）光滑的。由于 $\\widetilde{\\\
  varphi} \\circ \\varphi^{-1} : \\varphi(U \\cap \\widetilde{U}) \\longrightarrow\
  \ \\mathbb{R}^m$ 是转移映射，所以它也是（欧几里得）光滑的。由定理 10.1.12 可得\n\n$f \\circ \\varphi^{-1}\
  \ = (f \\circ \\widetilde{\\varphi}^{-1}) \\circ (\\widetilde{\\varphi} \\circ \\\
  varphi^{-1}) : \\varphi(U \\cap \\widetilde{U}) \\longrightarrow \\mathbb{R}$\n\n\
  \n\n如图 14.2.2(a) 所示，\n\n```\n\\begin{cases} g(t)=0 & \\text{if } t\\le 0 \\\\ 0<g(t)<1\
  \ & \\text{if } t\\in(0,1) \\\\ g(t)=1 & \\text{if } t\\ge 1 \\end{cases}\n```\n\
  \n并且\n\n```\n\\begin{cases} \\beta(t)=0 & \\text{if } t\\le -b \\\\ 0<\\beta(t)<1\
  \ & \\text{if } t\\in(-b,-a) \\\\ \\beta(t)=1 & \\text{if } t\\in[-a,a] \\\\ 0<\\\
  beta(t)<1 & \\text{if } t\\in(a,b) \\\\ \\beta(t)=0 & \\text{if } t\\ge b, \\end{cases}\n\
  ```\n\n从而 supp(β) = [−b, b]。取 U = ℝ 且 Ũ = (−a, a)，例如，我们发现 β 是在 0 处的 bump 函数。\n\n\
  ![](img/d712710a8eb78c0959204afd5dde4c91_358_0.png)\n\n![](img/d712710a8eb78c0959204afd5dde4c91_358_1.png)\n\
  \n## 图 14.2.2. 定理 14.2.6 的示意图\n\n对图 14.2.2(b) 的一瞥解释了为什么像 β 这样的函数被称为 bump 函数。bump\
  \ 函数经常被用来扩展光滑映射的定义域，如下个结果的证明中所做的那样。\n\n## 定理 14.2.7（函数延拓）。设 M 是一个光滑流形，p 是 M 中的一点，U\
  \ 是 M 中 p 的一个邻域，f 是 C^∞(U) 中的一个函数。则存在一个函数 \\tilde{f} ∈ C^∞(M) 和一个邻域 \\tilde{U} ⊆\
  \ U，它是 M 中 p 的邻域，使得 f 与 \\tilde{f} 在 \\tilde{U} 上一致；即 f|_{\\tilde{U}} = \\tilde{f}|_{\\\
  tilde{U}}。\n\n证明。设 β 是 C^∞(M) 中在 U 内有支集且在 M 中 p 的邻域 \\tilde{U} ⊆ U 上恒等于 1 的 bump\
  \ 函数。我们定义一个函数 \\tilde{f} : M ⟶ ℝ 为\n\n```\n\\tilde{f}(q)=\\begin{cases} \\beta(q)f(q)\
  \ & \\text{if } q\\in U \\\\ 0 & \\text{if } q\\in M\\setminus U. \\end{cases}\n\
  ```\n\n由于 β 和 f 在 U 上光滑，故 \\tilde{f} 也是光滑的。设 q 是 M\\setminus U 中的一点。由于 β 的支集在 U\
  \ 中，q 在 M\\setminus supp(β) 中，而由于 supp(β) 在 M 中是闭集，M\\setminus supp(β) 在 M 中是开集。因此，\\\
  tilde{f}=0 在 q 的邻域 M\\setminus supp(β) 上成立。由于 q 是任意的，\\tilde{f} 在 M\\setminus U\
  \ 上光滑。这表明 \\tilde{f} 在 M 上光滑。最后，由于 β=1 在 \\tilde{U} 上，f 与 \\tilde{f} 在 \\tilde{U}\
  \ 上一致。\n\n## 定理 14.2.8（单位分解）。若 M 是一个光滑流形且 \U0001D4B0 = {Uα : α ∈ A} 是 M 的一个开覆盖，则存在一个族\
  \ {π α ∈ C∞(M) : α ∈ A} 的光滑函数在 M 上，称为关于 \U0001D4B0 的 M 上的单位分解，使得：\n\n- (a) 0 ≤ π\
  \ α(p) ≤ 1 对所有 α ∈ A 和所有 p ∈ M 成立。\n- (b) supp(π α) ⊂ Uα 对所有 α ∈ A 成立。\n- (c) M\
  \ 中每一点 p 都有一个邻域 U 在 M 中，它仅与有限多个 α 的 supp(π α) 相交。\n- (d) ∑ α∈A π α(p) = 1 对所有 p\
  \ ∈ M 成立。\n\n尽管远非直观，单位分解对于微分几何中的某些构造是不可或缺的，我们将看到若干这样的应用。基本思想是在给定开覆盖的每个集合上定义所关心的数学对象（例如函数、向量场或积分），然后使用\
  \ π α 作为权重形成加权平均，将各个贡献组合成在整个 M 上定义的数学对象。由于部分 (c)，无限级数收敛的问题不存在。\n\n## 14.3 切空间\n\n\
  在第三部分引言中曾提到，发展我们现在所称的光滑流形的理论的一个关键步骤是设法在没有环境空间的情况下定义“切向量”。由微分几何学家创造并在此提供的定义以巧妙的方式解决了这一挑战。用代数术语表述，它在数学上优雅且计算方便。然而，与针对曲面的方法相比，它缺乏直观吸引力，在曲面中，切向量被定义为光滑曲线的导数，可以被视为“箭头”。稍后我们将看到，代数方法导致了与曲面所发展的理论非常相似的理论，从而使代数理论具有一定的几何味道。\n\
  \n在继续之前，我们需要建立一些记号。在第 10 章中，ℝ^m 上的坐标用 (x¹, …, x^m) 或 (y¹, …, y^m) 表示。在第 11 章和第 12\
  \ 章中，有必要清楚地区分 ℝ² 和 ℝ³ 上的坐标。对于 ℝ²，使用了 (r¹, r²) 或 (r, s) 的记号，对于 ℝ³，则为 (x¹, x², x³)\
  \ 或 (x, y, z)。在第 13 章中，ℝ² 和 ℝ³ 上的坐标分别用 (x, y) 和 (x, y, z) 表示。前一种选择之所以采用，是因为在函数图像的设定中，ℝ²\
  \ 被等同于 ℝ³ 中的 xy 平面。这就引出了本章及以后。\n\n从此以后，坐标映射将用 (x¹, …, x^m) 或 (y¹, …, y^m) 表示，标准坐标在\
  \ ℝ^m 上除外，后者将用 (r¹, …, r^m) 或 (s¹, …, s^m) 表示。\n\n证明。 (a)：这源于欧几里得偏导数的性质。\n(b)：显而易见。\n\
  \n## 定理 14.3.2。设 M 是一个光滑 m-流形，p 是 M 中的一点，v 是 T_p(M) 中的一个向量。则：\n\n- (a) 若 f 和 g 是\
  \ C^∞(M) 中的函数且在 M 中 p 的一个邻域上相等，则 v(f) = v(g)。\n- (b) 若 h 是 C^∞(M) 中的函数且在 M 中 p 的一个邻域上为常数，则\
  \ v(h) = 0。\n\n证明。 (a)：由于 v 是线性的，只需证明若 f 在 p 的邻域 U 上为零，则 v(f) = 0。第一个观察是\nv(0_M)\
  \ = v(0_M + 0_M) = v(0_M) + v(0_M),\n故 v(0_M) = 0。设 β 是在 p 处的 bump 函数，其支集在 U 中。由于\
  \ f 在 U 上为零且 supp(β) ⊂ U，我们有 β f = 0_M。由 β(p) = 1，f(p) = 0 以及 (14.3.1) 可得\n0 = v(β\
  \ f) = β(p) v(f) + f(p) v(β) = v(f)。\n\n(b)：由部分 (a)，只需考虑 h 在 M 上为常数的情形。我们由 (14.3.1)\
  \ 得到\nv(1_M) = v(1_M 1_M) = 1_M(p) v(1_M) + 1_M(p) v(1_M) = 2 v(1_M),\n故 v(1_M)\
  \ = 0。由于 h = c 1_M 对某个实数 c，\nv(h) = v(c 1_M) = c v(1_M) = 0。\n\n下一个结果让人想起定理 11.4.1。\n\
  \n## 定理 14.3.3（开集）。设 (M, \U0001D504) 是一个光滑 m-流形，U 是 M 中的一个开集，且\n\U0001D504_U = {(V\
  \ ∩ U, ψ|_{V∩U}) : (V, ψ) ∈ \U0001D504}。\n\n则：\n\n- (a) \U0001D504_U 是 U 上的一个光滑图册，故\
  \ (U, \U0001D504_U) 是具有由 M 诱导的子空间拓扑的 U 上的光滑 m-流形。\n- (b) 对所有点 p ∈ U，T_p(U) 可以与 T_p(M)\
  \ 识别，写成\nT_p(U) = T_p(M)。\n\n证明。 (a)：显而易见。\n(b)：利用定理 14.3.4(c) 和定理 14.7.3，与定理 11.4.1(b)\
  \ 的证明中采用的论证类似可得结果。或者，考虑映射 ι : T_p(U) ⟶ T_p(M) 定义为 ι(v)(f) = v(f|_U) 对所有向量 v ∈ T_p(U)\
  \ 和所有函数 f ∈ C^∞(M)。易证 ι(v) 是 T_p(M) 中的一个向量，故 ι 是良定义的。此外，还可以证明 ι 是线性同构。\n\n另一方面，由定理\
  \ 10.1.10，\n\ndh/dt(t) = Σ_i r^i ∂g/∂r^i (tr^1, ..., tr^m),\n\n所以\n\n∫_0^1 dh/dt(t)\
  \ dt = Σ_i ( r^i ∫_0^1 ∂g/∂r^i (tr^1, ..., tr^m) ) dt\n= Σ_i r^i g_i(r^1, ..., r^m).\
  \ (14.3.6)\n\n结合 (14.3.5) 和 (14.3.6) 得到\n\ng(r^1, ..., r^m) = g(0, ..., 0) + Σ_i\
  \ r^i g_i(r^1, ..., r^m). (14.3.7)\n\n由假设，\n\n(x^1(p), ..., x^m(p)) = φ(p) = (0,\
  \ ..., 0). (14.3.8)\n\n设 q = φ^{-1}(r^1, ..., r^m)，从而\n\n(x^1(q), ..., x^m(q)) =\
  \ φ(q) = (r^1, ..., r^m). (14.3.9)\n\n由 (14.3.7)–(14.3.9)，我们得到\n\ng ∘ φ(q) = g ∘\
  \ φ(p) + Σ_i x^i(q) (g_i ∘ φ)(q). (14.3.10)\n\n设 f 是 C^∞(M) 中的一个函数。令 g = f ∘ φ^{-1}\
  \ 且 f_i = g_i ∘ φ 在 (14.3.10) 中得到\n\nf(q) = f(p) + Σ_i x^i(q) f_i(q).\n\n由于 (r^1,\
  \ ..., r^m)，从而 q，是任意的，\n\nf = f(p) + Σ_i x^i f_i.\n\n对 T_p(M) 中的向量 v，我们有\n\nv(f)\
  \ = v( f(p) + Σ_i x^i f_i )\n= Σ_i v(x^i f_i) [Th 14.3.2(b)]\n= Σ_i x^i(p) v(f_i)\
  \ + Σ_i f_i(p) v(x^i) [(14.3.1)]\n= Σ_i f_i(p) v(x^i). [(14.3.8)] (14.3.11)\n\n\
  作为特例，\n\n∂/∂x^i |_p (f) = Σ_j ∂/∂x^i |_p (x^j) f_j(p) [Th 14.3.1(a)] = Σ_j ∂x^j/∂x^i\
  \ (p) f_j(p) [(14.3.3)] (14.3.12) = f_i(p) [Th 14.3.1(b)]\n\n对 i = 1, …, m。由 (14.3.11)\
  \ 和 (14.3.12) 可得\n\nv(f) = ( Σ_i v(x^i) ∂/∂x^i |_p ) (f).\n\n由于 f 是任意的，\n\nv = Σ_i\
  \ v(x^i) ∂/∂x^i |_p .\n\n(a)：由部分 (b) 可知切向量 (∂/∂x^i)|_p 张成 T_p(M)。设\n\nΣ_i a^i ∂/∂x^i\
  \ |_p = 0\n\n对某些实数 a^i 成立。对上式两边作用于 x^j 并利用定理 14.3.1(b) 得到\n\n0 = Σ_i a^i ∂x^j/∂x^i\
  \ (p) = a^j\n\n对 j = 1, …, m。因此，(∂/∂x^i)|_p 线性无关。\n\n(c)：这由部分 (a) 可得。\n\n## 定理 14.3.5（坐标基变换）。设\
  \ M 是一个光滑 m-流形，p 是 M 中的一点，(U, φ = (x^i)) 和 (Ũ, φ̃ = (x̃^i)) 是在 p 处的图，且 X_p = ((∂/∂x^1)|_p,\
  \ …, (∂/∂x^m)|_p) 和 X̃_p = ((∂/∂x̃^1)|_p, …, (∂/∂x̃^m)|_p) 是在 p 处的相应坐标基。则：\n\n(a)\n\
  \n∂/∂x^j |_p = Σ_i ∂x̃^i/∂x^j (p) ∂/∂x̃^i |_p = Σ_i ∂(x̃^i ∘ φ^{-1})/∂r^j (φ(p))\
  \ ∂/∂x̃^i |_p .\n\n\n\n\n\n(b)\n\\[\n\\left[\\mathrm{id}_{T_p(M)}\\right]_{\\mathcal{X}_p}^{\\\
  tilde{\\mathcal{X}}_p}\n=\n\\begin{bmatrix}\n\\frac{\\partial \\tilde{x}^1}{\\partial\
  \ x^1}(p) & \\cdots & \\frac{\\partial \\tilde{x}^1}{\\partial x^m}(p)\\\\\n\\vdots\
  \ & \\ddots & \\vdots\\\\\n\\frac{\\partial \\tilde{x}^m}{\\partial x^1}(p) & \\\
  cdots & \\frac{\\partial \\tilde{x}^m}{\\partial x^m}(p)\n\\end{bmatrix}\n=\n\\\
  begin{bmatrix}\n\\frac{\\partial (\\tilde{x}^1 \\circ \\varphi^{-1})}{\\partial\
  \ r^1}(\\varphi(p)) & \\cdots & \\frac{\\partial (\\tilde{x}^1 \\circ \\varphi^{-1})}{\\\
  partial r^m}(\\varphi(p))\\\\\n\\vdots & \\ddots & \\vdots\\\\\n\\frac{\\partial\
  \ (\\tilde{x}^m \\circ \\varphi^{-1})}{\\partial r^1}(\\varphi(p)) & \\cdots & \\\
  frac{\\partial (\\tilde{x}^m \\circ \\varphi^{-1})}{\\partial r^m}(\\varphi(p))\n\
  \\end{bmatrix}.\n\\]\n\n**Remark.** 第 (a) 部分和第 (b) 部分中的第二个等式，两者均由 (14.3.2) 推出，作为提醒，偏导数最终是使用欧几里得方法计算的。\n\
  \n**Proof.** (a): 设 \\([a_j^i] = [\\mathrm{id}_{T_p(M)}]_{\\mathcal{X}_p}^{\\tilde{\\\
  mathcal{X}}_p}\\)，则由 (2.2.6) 和 (2.2.7) 可得，\n\\[\n\\left.\\frac{\\partial}{\\partial\
  \ x^j}\\right|_p = \\sum_k a_j^k \\left.\\frac{\\partial}{\\partial \\tilde{x}^k}\\\
  right|_p.\n\\]\n将前述恒等式的两边同时作用于 \\(\\tilde{x}^i\\) 并使用定理 14.3.1(b) 和 (14.3.3) 得\n\
  \\[\n\\frac{\\partial \\tilde{x}^i}{\\partial x^j}(p) = \\sum_k a_j^k \\frac{\\\
  partial \\tilde{x}^i}{\\partial \\tilde{x}^k}(p) = a_j^i.\n\\]\n\n(b): 这由第 (a) 部分得出。\n\
  \n设 \\(M\\) 为光滑 \\(m\\)-流形，\\(p\\) 为 \\(M\\) 中的一点，\\((U, \\varphi = (x^i))\\) 为\
  \ \\(p\\) 处的坐标图。**在 \\(p\\) 处关于 \\(x^i\\) 和 \\(x^j\\) 的二阶偏导数** 是映射\n\\[\n\\left.\\\
  frac{\\partial^2}{\\partial x^i \\partial x^j}\\right|_p : C^\\infty(M) \\longrightarrow\
  \ \\mathbb{R}\n\\]\n定义为\n\\[\n\\frac{\\partial^2 f}{\\partial x^i \\partial x^j}(p)\
  \ = \\frac{\\partial}{\\partial x^i}\\left(\\frac{\\partial f}{\\partial x^j}\\\
  right)(p)\n\\]\n对所有 \\(C^\\infty(M)\\) 中的函数 \\(f\\) 成立，其中我们记\n\\[\n\\left.\\frac{\\\
  partial^2}{\\partial x^i \\partial x^j}\\right|_p (f)\\quad\\text{为}\\quad \\frac{\\\
  partial^2 f}{\\partial x^i \\partial x^j}(p).\n\\]\n\n### Theorem 14.3.6 (Equality\
  \ of Mixed Partial Derivatives).\n\n在上述设定下，\n\\[\n\\frac{\\partial^2 f}{\\partial\
  \ x^i \\partial x^j}(p) = \\frac{\\partial^2 f}{\\partial x^j \\partial x^i}(p)\n\
  \\]\n对 \\(i, j = 1, \\ldots, m\\) 成立。\n\n**Proof.** 这由定理 10.1.6 得出。\n\n## 14.4 Differential\
  \ of Maps\n\n为了定义两个流形之间的微分映射，我们需要一种方法将一个切空间中的向量以线性方式发送到另一个切空间中的向量。采用向量的代数方法，这 turns\
  \ out  surprisingly straightforward. 设 \\(M\\) 和 \\(N\\) 为光滑流形，\\(F : M \\longrightarrow\
  \ N\\) 为光滑映射，\\(p\\) 为 \\(M\\) 中的一点。对 \\(T_p(M)\\) 中的每个向量 \\(v\\)，定义映射\n\\[\nd_p(F)(v)\
  \ : C^\\infty(N) \\longrightarrow \\mathbb{R}\n\\]\n为\n\\[\nd_p(F)(v)(g) = v(g \\\
  circ F) \\quad (14.4.1)\n\\]\n对所有 \\(C^\\infty(N)\\) 中的函数 \\(g\\) 成立。由于 \\(g \\\
  circ F\\) 属于 \\(C^\\infty(M)\\)，定义是有意义的。\n\n### Theorem 14.4.1.\n\n在上述设定下，\\(d_p(F)(v)\\\
  ) 是 \\(T_{F(p)}(N)\\) 中的一个向量。\n\n**Proof.** 显然，\\(d_p(F)(v)\\) 是线性的。为证明 \\(d_p(F)(v)\\\
  ) 满足 (14.3.1)，设 \\(g, h\\) 为 \\(C^\\infty(N)\\) 中的函数。则\n\\[\n\\begin{aligned}\n\
  d_p(F)(v)(gh)\n&= v(gh \\circ F) && \\text{[(14.4.1)]} \\\\\n&= v((g \\circ F)(h\
  \ \\circ F)) \\\\\n&= (g \\circ F)(p) \\cdot v(h \\circ F) + (h \\circ F)(p) \\\
  cdot v(g \\circ F) && \\text{[(14.3.1)]} \\\\\n&= g(F(p)) \\cdot d_p(F)(v)(h) +\
  \ h(F(p)) \\cdot d_p(F)(v)(g) && \\text{[(14.4.1)]}\n\\end{aligned}\n\\]\n因此，\\\
  (d_p(F)(v)\\) 是 \\(F(p)\\) 处的切向量。\n\n继续使用上述记号，\\(F\\) 在 \\(p\\) 处的微分是映射\n\\[\nd_p(F)\
  \ : T_p(M) \\longrightarrow T_{F(p)}(N)\n\\]\n定义为赋值\n\\[\nv \\longmapsto d_p(F)(v)\n\
  \\]\n对所有 \\(T_p(M)\\) 中的向量 \\(v\\) 成立。\n\n### Theorem 14.4.2.\n\n在上述设定下，\\(d_p(F)\\\
  ) 是线性的。\n\n**Proof.** 设 \\(v, w\\) 为 \\(T_p(M)\\) 中的向量，\\(g\\) 为 \\(C^\\infty(N)\\\
  ) 中的函数，\\(c\\) 为实数。则\n\\[\n\\begin{aligned}\nd_p(F)(cv + w)(g)\n&= (cv + w)(g \\\
  circ F) && \\text{[(14.4.1)]} \\\\\n&= c\\,v(g \\circ F) + w(g \\circ F) \\\\\n\
  &= c\\,d_p(F)(v)(g) + d_p(F)(w)(g) && \\text{[(14.4.1)]} \\\\\n&= \\bigl(c\\,d_p(F)(v)\
  \ + d_p(F)(w)\\bigr)(g).\n\\end{aligned}\n\\]\n由于 \\(g\\) 是任意的，结果得证。\n\n本节的其余结果给出了微分映射的基本性质。\n\
  \n### Theorem 14.4.3.\n\n设 \\(M\\) 为光滑流形，\\(\\mathrm{id}_M : M \\longrightarrow\
  \ M\\) 为恒等映射，\\(p\\) 为 \\(M\\) 中的一点。则\n\\[\nd_p(\\mathrm{id}_M) = \\mathrm{id}_{T_p(M)}.\n\
  \\]\n\n**Proof.** 对 \\(T_p(M)\\) 中的向量 \\(v\\) 和 \\(C^\\infty(M)\\) 中的函数 \\(f\\)，我们由\
  \ (14.4.1) 有\n\\[\nd_p(\\mathrm{id}_M)(v)(f) = v(f \\circ \\mathrm{id}_M) = v(f).\n\
  \\]\n由于 \\(v\\) 和 \\(f\\) 都是任意的，结果得证。\n\n### Theorem 14.4.4.\n\n设 \\(V\\) 和 \\(W\\\
  ) 为向量空间，\\(A : V \\longrightarrow W\\) 为线性映射，\\(v\\) 为 \\(V\\) 中的向量。假设 \\(V\\) 和\
  \ \\(W\\) 具有标准光滑结构，并作等同 \\(T_v(V) = V\\) 和 \\(T_{A(v)}(W) = W\\)。则\n\\[\nd_v(A)\
  \ = A.\n\\]\n\n**Proof.** 显而易见。\n\n### Theorem 14.4.5 (Chain Rule).\n\n设 \\(M, N\\\
  ) 和 \\(P\\) 为光滑流形，\\(F : M \\longrightarrow N\\) 和 \\(G : N \\longrightarrow P\\\
  ) 为光滑映射，\\(p\\) 为 \\(M\\) 中的一点。则\n\\[\nd_p(G \\circ F) = d_{F(p)}(G) \\circ d_p(F).\n\
  \\]\n\n**Proof.** 对 \\(T_p(M)\\) 中的向量 \\(v\\) 和 \\(C^\\infty(P)\\) 中的函数 \\(f\\)，我们有\n\
  \\[\n\\begin{aligned}\nd_p(G \\circ F)(v)(f)\n&= v(f \\circ G \\circ F) && \\text{[(14.4.1)]}\
  \ \\\\\n&= d_p(F)(v)(f \\circ G) && \\text{[(14.4.1)]} \\\\\n&= d_{F(p)}(G)(d_p(F)(v)(f))\
  \ && \\text{[(14.4.1)]} \\\\\n&= \\bigl(d_{F(p)}(G) \\circ d_p(F)\\bigr)(v)(f).\n\
  \\end{aligned}\n\\]\n由于 \\(v\\) 和 \\(f\\) 都是任意的，结果得证。\n\n下一个结果是定理 14.3.5 的推广。\n\n\
  ### Theorem 14.4.6 (Matrix of Differential Map).\n\n设 \\(M\\) 为光滑 \\(m\\)-流形，\\\
  (N\\) 为光滑 \\(n\\)-流形，\\(F : M \\longrightarrow N\\) 为光滑映射。设 \\(p\\) 为 \\(M\\) 中的一点，\\\
  ((U, \\varphi = (x^i))\\) 和 \\((V, (y^j))\\) 分别为 \\(p\\) 和 \\(F(p)\\) 处的坐标图，且 \\\
  (X_p = ((\\partial/\\partial x^1)|_p, \\ldots, (\\partial/\\partial x^m)|_p)\\)\
  \ 和 \\(Y_{F(p)} = ((\\partial/\\partial y^1)|_{F(p)}, \\ldots, (\\partial/\\partial\
  \ y^n)|_{F(p)})\\) 分别为 \\(p\\) 和 \\(F(p)\\) 处的相应坐标基。则：\n\n(a)\n\\[\nd_p(F)\\left(\\\
  left.\\frac{\\partial}{\\partial x^j}\\right|_p\\right)\n= \\sum_i \\frac{\\partial\
  \ (y^i \\circ F)}{\\partial x^j}(p) \\left.\\frac{\\partial}{\\partial y^i}\\right|_{F(p)}\n\
  = \\sum_i \\frac{\\partial (y^i \\circ F \\circ \\varphi^{-1})}{\\partial r^j}(\\\
  varphi(p)) \\left.\\frac{\\partial}{\\partial y^i}\\right|_{F(p)}.\n\\]\n\n(b)\n\
  \\[\n\\left[d_p(F)\\right]_{X_p}^{Y_{F(p)}}\n=\n\\begin{pmatrix}\n\\frac{\\partial\
  \ (y^1 \\circ F)}{\\partial x^1}(p) & \\cdots & \\frac{\\partial (y^1 \\circ F)}{\\\
  partial x^m}(p)\\\\\n\\vdots & \\ddots & \\vdots\\\\\n\\frac{\\partial (y^n \\circ\
  \ F)}{\\partial x^1}(p) & \\cdots & \\frac{\\partial (y^n \\circ F)}{\\partial x^m}(p)\n\
  \\end{pmatrix}\n=\n\\begin{pmatrix}\n\\frac{\\partial (y^1 \\circ F \\circ \\varphi^{-1})}{\\\
  partial r^1}(\\varphi(p)) & \\cdots & \\frac{\\partial (y^1 \\circ F \\circ \\varphi^{-1})}{\\\
  partial r^m}(\\varphi(p))\\\\\n\\vdots & \\ddots & \\vdots\\\\\n\\frac{\\partial\
  \ (y^n \\circ F \\circ \\varphi^{-1})}{\\partial r^1}(\\varphi(p)) & \\cdots & \\\
  frac{\\partial (y^n \\circ F \\circ \\varphi^{-1})}{\\partial r^m}(\\varphi(p))\n\
  \\end{pmatrix}.\n\\]\n\n**Remark.** 第 (a) 部分和第 (b) 部分中的第二个等式，两者均由 (14.3.2) 推出，作为提醒，偏导数最终是使用欧几里得方法计算的。\n\
  \n**Proof.** (a): 设 \\([a_j^k] = [d_p(F)]_{X_p}^{Y_{F(p)}}\\)，则由 (2.2.6) 和 (2.2.7)\
  \ 可得，\n\\[\nd_p(F)\\left(\\left.\\frac{\\partial}{\\partial x^j}\\right|_p\\right)\
  \ = \\sum_k a_j^k \\left.\\frac{\\partial}{\\partial y^k}\\right|_{F(p)}.\n\\]\n\
  将前述恒等式的两边同时作用于 \\(y^i\\) 并使用定理 14.3.1(b) 和 (14.3.3) 得\n\\[\nd_p(F)\\left(\\left.\\\
  frac{\\partial}{\\partial x^j}\\right|_p\\right)(y^i)\n= \\sum_k a_j^k \\frac{\\\
  partial y^i}{\\partial y^k}(F(p))\n= a_j^i.\n\\]\n另一方面，我们由 (14.3.3) 和 (14.4.1) 有\n\
  \\[\nd_p(F)\\left(\\left.\\frac{\\partial}{\\partial x^j}\\right|_p\\right)(y^i)\n\
  = \\left(\\left.\\frac{\\partial}{\\partial x^j}\\right|_p\\right)(y^i \\circ F)\n\
  = \\frac{\\partial (y^i \\circ F)}{\\partial x^j}(p).\n\\]\n结合上述恒等式即得结果。\n\n(b):\
  \ 这由 (2.2.6)、(2.2.7) 和第 (a) 部分得出。\n\n## 14.5 Differential of Functions\n\n设 \\(M\\\
  ) 为光滑流形，\\(f\\) 为 \\(C^\\infty(M)\\) 中的函数，\\(p\\) 为 \\(M\\) 中的一点，\\((U, \\varphi\
  \ = (x^i))\\) 为 \\(p\\) 处的坐标图。将 \\(\\mathbb{R}\\) 视为光滑 \\(1\\)-流形，我们有微分映射\n\\[\n\
  d_p(f) : T_p(M) \\longrightarrow T_{f(p)}(\\mathbb{R}). \\tag{14.5.1}\n\\]\n\\(\\\
  mathbb{R}\\) 的覆盖坐标图为 \\((\\mathbb{R}, \\mathrm{id}_{\\mathbb{R}} = r)\\)，其中 \\(r\\\
  ) 为 \\(\\mathbb{R}\\) 上的标准坐标。相应的 \\(f(p)\\) 处的坐标基为 \\(((d/dr)|_{f(p)})\\)。则定理 14.4.6(a)\
  \ 和 \\(\\mathrm{id}_{\\mathbb{R}} = r\\) 给出\n\\[\nd_p(f)\\left(\\left.\\frac{\\\
  partial}{\\partial x^i}\\right|_p\\right)\n= \\frac{\\partial (r \\circ f)}{\\partial\
  \ x^i}(p) \\left.\\frac{d}{dr}\\right|_{f(p)}\n= \\frac{\\partial f}{\\partial x^i}(p)\
  \ \\left.\\frac{d}{dr}\\right|_{f(p)}. \\tag{14.5.2}\n\\]\n使用 (14.3.4)，我们将 \\(T_{f(p)}(\\\
  mathbb{R})\\) 与 \\(\\mathbb{R}\\) 等同，并写 \\(T_{f(p)}(\\mathbb{R}) = \\mathbb{R}\\\
  )。为保持一致，我们也将基 \\(((d/dr)|_{f(p)})\\) 与 \\(\\mathbb{R}\\) 的基 \\((1)\\) 等同。则 (14.5.1)\
  \ 和 (14.5.2) 变为\n\\[\nd_p(f) : T_p(M) \\longrightarrow \\mathbb{R} \\tag{14.5.3}\n\
  \\]\n和\n\\[\nd_p(f)\\left(\\left.\\frac{\\partial}{\\partial x^i}\\right|_p\\right)\
  \ = \\frac{\\partial f}{\\partial x^i}(p) \\tag{14.5.4}\n\\]\n对 \\(i = 1, \\ldots,\
  \ m\\) 成立。设我们用 \\(T_p^*(M)\\) 表示对偶空间 \\(T_p(M)^*\\)。向量空间与其双对偶的通常等同给出 \\(T_p^{**}(M)\
  \ = T_p(M)\\)。\n\n### Theorem 14.5.1.\n\n在上述设定下，\\(d_p(f)\\) 是 \\(T_p^*(M)\\) 中的一个余向量。\n\
  \n**Proof.** 这由定理 14.4.2 和 (14.5.3) 得出。\n\n### Theorem 14.5.2 (Existence of Dual\
  \ Coordinate Basis).\n\n设 \\(M\\) 为光滑 \\(m\\)-流形，\\(p\\) 为 \\(M\\) 中的一点，\\((U, (x^i))\\\
  ) 为 \\(p\\) 处的坐标图，且 \\(X_p = ((\\partial/\\partial x^1)|_p, \\ldots, (\\partial/\\\
  partial x^m)|_p)\\) 为 \\(p\\) 处的相应坐标基。则 \\((d_p(x^1), \\ldots, d_p(x^m))\\) 是 \\\
  (X_p\\) 的对偶基，称为对应于 \\((U, (x^i))\\) 的 \\(p\\) 处的对偶坐标基。\n\n**Proof.** 将 \\(f = x^j\\\
  ) 代入 (14.5.4) 并使用定理 14.3.1(b) 即得结果。\n\n下一个结果使我们恢复了来自若干实变量微分学的熟悉恒等式，只是这里“微分”取代了“无穷小”。\n\
  \n### Theorem 14.5.3.\n\n设 \\(M\\) 为光滑 \\(m\\)-流形，\\(f\\) 为 \\(C^\\infty(M)\\) 中的函数。设\
  \ \\(p\\) 为 \\(M\\) 中的一点，\\((U, (x^i))\\) 为 \\(p\\) 处的坐标图，且 \\(((\\partial/\\partial\
  \ x^1)|_p, \\ldots, (\\partial/\\partial x^m)|_p)\\) 和 \\((d_p(x^1), \\ldots, d_p(x^m))\\\
  ) 分别为 \\(p\\) 处的相应坐标基和对偶坐标基。则在局部坐标下，\n\\[\nd_p(f) = \\sum_i \\frac{\\partial f}{\\\
  partial x^i}(p)\\, d_p(x^i).\n\\]\n\n\n\n证明：根据定理14.5.2，对某些实数\\(a_j\\)，有\\(d_p(f)=\\\
  sum_j a_j d_p(x^j)\\)。于是\n\\[\n\\begin{aligned}\n\\frac{\\partial f}{\\partial x^i}(p)\n\
  &= d_p(f)\\left(\\frac{\\partial}{\\partial x^i}\\bigg|_p\\right) \\qquad [(14.5.4)]\
  \ \\\\\n&= \\left(\\sum_j a_j d_p(x^j)\\right)\\left(\\frac{\\partial}{\\partial\
  \ x^i}\\bigg|_p\\right) \\\\\n&= \\sum_j a_j d_p(x^j)\\left(\\frac{\\partial}{\\\
  partial x^i}\\bigg|_p\\right) \\\\\n&= a_i \\qquad [\\text{定理 }14.5.2]\n\\end{aligned}\n\
  \\]\n对\\(i=1,\\dots,m\\)成立。\n\n### 定理14.5.4 (对偶坐标基的变换)\n\n设\\(M\\)是一个光滑\\(m\\)维流形，设\\\
  (p\\)是\\(M\\)中的一点。设\\((U,(x^i))\\)和\\((\\tilde U,(\\tilde x^i))\\)是\\(p\\)处的坐标卡，设\\\
  (\\mathcal X_p=((\\partial/\\partial x^1)|_p,\\dots,(\\partial/\\partial x^m)|_p)\\\
  )和\\(\\tilde{\\mathcal X}_p=((\\partial/\\partial \\tilde x^1)|_p,\\dots,(\\partial/\\\
  partial \\tilde x^m)|_p)\\)是\\(p\\)处相应的坐标基，并设\\(\\mathcal X_p^*=(d_p(x^1),\\dots,d_p(x^m))\\\
  )和\\(\\tilde{\\mathcal X}_p^*=(d_p(\\tilde x^1),\\dots,d_p(\\tilde x^m))\\)是\\(p\\\
  )处相应的对偶坐标基。则：\n\n- (a) \\[\n  d_p(x^j)=\\sum_i \\frac{\\partial x^j}{\\partial \\\
  tilde x^i}(p)\\,d_p(\\tilde x^i)\n  \\]\n  对\\(j=1,\\dots,m\\)成立。\n\n- (b) \\[\n\
  \  [\\mathrm{id}_{T_p(M)}]_{\\mathcal X_p^*}^{\\tilde{\\mathcal X}_p^*}\n  =\n \
  \ \\begin{bmatrix}\n  \\frac{\\partial x^1}{\\partial \\tilde x^1}(p) & \\dots &\
  \ \\frac{\\partial x^m}{\\partial \\tilde x^1}(p) \\\\\n  \\vdots & \\ddots & \\\
  vdots \\\\\n  \\frac{\\partial x^1}{\\partial \\tilde x^m}(p) & \\dots & \\frac{\\\
  partial x^m}{\\partial \\tilde x^m}(p)\n  \\end{bmatrix}\n  =\n  \\left( [\\mathrm{id}_{T_p(M)}]_{\\\
  tilde{\\mathcal X}_p}^{\\mathcal X_p} \\right)^{\\mathrm T}.\n  \\]\n\n**证明：** (a)\
  \ 在定理14.5.3中令\\(f=x^j\\)且\\(x^i=\\tilde x^i\\)，即得结论。  \n(b) 第一个等式由(2.2.6)、(2.2.7)和(a)得到。第二个等式由定理14.3.5(b)得到。\n\
  \n### 定理14.5.5\n\n设\\(M\\)是一个光滑流形，设\\(f\\)是\\(C^\\infty(M)\\)中的函数，设\\(p\\)是\\(M\\\
  )中的一点，并设\\(v\\)是\\(T_p(M)\\)中的向量。则\n\\[\nd_p(f)(v)=v(f).\n\\]\n\n**证明：** 由定理1.2.1(d)和定理14.5.2，\n\
  \\[\nv=\\sum_i d_p(x^i)(v)\\,\\frac{\\partial}{\\partial x^i}\\bigg|_p,\n\\]\n因此\n\
  \\[\n\\begin{aligned}\nv(f)\n&= \\left(\\sum_i d_p(x^i)(v)\\frac{\\partial}{\\partial\
  \ x^i}\\bigg|_p\\right)(f) \\\\\n&= \\sum_i d_p(x^i)(v)\\frac{\\partial f}{\\partial\
  \ x^i}(p) \\qquad [(14.3.3)] \\\\\n&= \\left(\\sum_i \\frac{\\partial f}{\\partial\
  \ x^i}(p)\\,d_p(x^i)\\right)(v) \\\\\n&= d_p(f)(v). \\qquad [\\text{定理 }14.5.3]\n\
  \\end{aligned}\n\\]\n\n### 定理14.5.6\n\n设\\(M\\)是一个光滑流形，设\\(p\\)是\\(M\\)中的一点，设\\\
  (f,g\\)是\\(C^\\infty(M)\\)中的函数，并设\\(c\\)是一个实数。则：\n\n- (a) \\(d_p(cf+g)=c\\,d_p(f)+d_p(g)\\\
  )。\n- (b) \\(d_p(fg)=f(p)d_p(g)+g(p)d_p(f)\\)。\n\n**证明：** 对于\\(T_p(M)\\)中的向量\\(v\\\
  )，我们有\n\\[\n\\begin{aligned}\nd_p(cf+g)(v)\n&= v(cf+g) \\qquad [\\text{定理 }14.5.5]\
  \ \\\\\n&= c\\,v(f)+v(g) \\\\\n&= c\\,d_p(f)(v)+d_p(g)(v) \\qquad [\\text{定理 }14.5.5]\
  \ \\\\\n&= (c\\,d_p(f)+d_p(g))(v)\n\\end{aligned}\n\\]\n以及\n\\[\n\\begin{aligned}\n\
  d_p(fg)(v)\n&= v(fg) \\qquad [\\text{定理 }14.5.5] \\\\\n&= f(p)v(g)+g(p)v(f) \\qquad\
  \ [(14.3.1)] \\\\\n&= f(p)d_p(g)(v)+g(p)d_p(f)(v) \\qquad [\\text{定理 }14.5.5] \\\
  \\\n&= (f(p)d_p(g)+g(p)d_p(f))(v).\n\\end{aligned}\n\\]\n由于\\(v\\)是任意的，结论成立。\n\n\
  ### 定理14.5.7\n\n设\\((e_1,\\dots,e_m)\\)是\\(\\mathbb{R}^m\\)的标准基，设\\((\\xi^1,\\dots,\\\
  xi^m)\\)是它的对偶基。设\\((r^1,\\dots,r^m)\\)是\\(\\mathbb{R}^m\\)上的标准坐标，设\\(p\\)是\\(\\\
  mathbb{R}^m\\)中的一点，设\\(((\\partial/\\partial r^1)|_p,\\dots,(\\partial/\\partial\
  \ r^m)|_p)\\)是\\(p\\)处相应的坐标基，称为\\(p\\)处的标准坐标基，并设\\((d_p(r^1),\\dots,d_p(r^m))\\\
  )是\\(p\\)处相应的对偶坐标基，称为\\(p\\)处的标准对偶坐标基。则\\(((\\partial/\\partial r^1)|_p,\\dots,(\\\
  partial/\\partial r^m)|_p)\\)可以与\\((e_1,\\dots,e_m)\\)等同，\\((d_p(r^1),\\dots,d_p(r^m))\\\
  )可以与\\((\\xi^1,\\dots,\\xi^m)\\)等同，写为\n\\[\n\\left(\\frac{\\partial}{\\partial r^1}\\\
  bigg|_p,\\dots,\\frac{\\partial}{\\partial r^m}\\bigg|_p\\right)=(e_1,\\dots,e_m)\n\
  \\]\n以及\n\\[\n(d_p(r^1),\\dots,d_p(r^m))=(\\xi^1,\\dots,\\xi^m).\n\\]\n\n**证明：**\
  \ 只需证明上述两个恒等式之一即可，另一个通过对偶得到。遵循(14.3.4)，我们做等同\n\\[\nT_p(\\mathbb{R}^m)=\\mathbb{R}^m.\n\
  \\]\n根据定义，\\((r^1,\\dots,r^m)\\)是坐标卡\\((\\mathbb{R}^m,\\mathrm{id}_{\\mathbb{R}^m}=(r^1,\\\
  dots,r^m))\\)的坐标映射。由于\\(r^i\\)是线性的，由定理14.4.4，对\\(i=1,\\dots,m\\)有\\(d_p(r^i)=r^i\\\
  )。对于点\\(q\\in\\mathbb{R}^m\\)，\n\\[\n\\begin{aligned}\n\\sum_i d_p(r^i)(q)e_i\n\
  &= \\sum_i r^i(q)e_i \\\\\n&= (r^1(q),\\dots,r^m(q)) \\\\\n&= (r^1,\\dots,r^m)(q)\
  \ \\\\\n&= \\mathrm{id}_{\\mathbb{R}^m}(q) \\\\\n&= q \\\\\n&= \\sum_i \\xi^i(q)e_i,\n\
  \\end{aligned}\n\\]\n其中最后一个等式由定理1.2.1(d)得到。由于\\(q\\)是任意的，对\\(i=1,\\dots,m\\)有\\\
  (d_p(r^i)=\\xi^i\\)。\n\n## 14.6 浸入与微分同胚\n\n在这一简短的小节中，我们将第10.2节中关于浸入与微分同胚的讨论推广到光滑流形的框架中。\n\
  \n设\\(M\\)和\\(N\\)是光滑流形，其中\\(\\dim(M)\\leq\\dim(N)\\)，设\\(F:M\\longrightarrow N\\\
  )是一个光滑映射，并设\\(p\\)是\\(M\\)中的一点。如果微分映射\\(d_p(F):T_p(M)\\longrightarrow T_{F(p)}(N)\\\
  )是单射，则称\\(F\\)在\\(p\\)处是**浸入**；如果\\(F\\)在\\(M\\)中的每一点\\(p\\)处都是浸入，则称\\(F\\)是（在\\\
  (M\\)上的）**浸入**。\n\n现在假设\\(M\\)和\\(N\\)有相同的维数，并设\\(G,H:M\\longrightarrow N\\)是光滑映射。如果\\\
  (G\\)是双射且\\(G^{-1}:N\\longrightarrow M\\)是光滑的，则称\\(G\\)是一个**微分同胚**，并称\\(M\\)和\\\
  (N\\)是**微分同胚的**。如果存在\\(M\\)中\\(p\\)的一个邻域\\(U\\)和\\(N\\)中\\(H(p)\\)的一个邻域\\(V\\)，使得\\\
  (H|_U:U\\longrightarrow V\\)是一个微分同胚，则称\\(H\\)在\\(p\\)处是一个**局部微分同胚**。如果\\(H\\)在\\\
  (M\\)中的每一点\\(p\\)处都是局部微分同胚，则称\\(H\\)是（在\\(M\\)上的）**局部微分同胚**。\n\n### 定理14.6.1\n\n\
  设\\(M\\)和\\(N\\)是具有相同维数的光滑流形，设\\(F:M\\longrightarrow N\\)是一个微分同胚，并设\\(p\\)是\\(M\\\
  )中的一点。则微分映射\\(d_p(F):T_p(M)\\longrightarrow T_{F(p)}(N)\\)是一个线性同构，其逆为\\(d_p(F)^{-1}=d_{F(p)}(F^{-1})\\\
  )。\n\n**证明：** 由定理14.4.2，\\(d_p(F)\\)是一个线性映射。由定理14.4.3和定理14.4.5，我们有\n\\[\n\\mathrm{id}_{T_p(M)}\n\
  =d_p(\\mathrm{id}_M)\n=d_p(F^{-1}\\circ F)\n=d_{F(p)}(F^{-1})\\circ d_p(F).\n\\\
  ]\n类似地，\\(\\mathrm{id}_{T_{F(p)}(N)}=d_p(F)\\circ d_{F(p)}(F^{-1})\\)。由定理A.4，\\\
  (d_p(F)\\)是双射。\n\n### 定理14.6.2 (逆映射定理)\n\n设\\(M\\)和\\(N\\)是具有相同维数的光滑流形，设\\(F:M\\\
  longrightarrow N\\)是一个光滑映射，并设\\(p\\)是\\(M\\)中的一点。则\\(F\\)在\\(p\\)处是局部微分同胚当且仅当它在\\\
  (p\\)处是浸入。因此，\\(F\\)是局部微分同胚当且仅当它是浸入。\n\n## 14.7 曲线\n\n以下定义或多或少直接借自第10.1节和第11.1节。\n\
  \n光滑流形\\(M\\)上的（参数化）曲线是一个映射\\(\\lambda:I\\longrightarrow M\\)，其中\\(I\\)是\\(\\mathbb{R}\\\
  )中的一个区间，该区间可以是开的、闭的、半开的或半闭的，并且不排除\\(I\\)为无穷区间的可能性。我们将重点关注\\(I\\)为有限开区间的情形，通常记为\\\
  ((a,b)\\)。与其单独说明曲线的自变量（通常记为\\(t\\)，有时记为\\(u\\)），不如将其纳入\\(\\lambda\\)的记号中，如\\(\\\
  lambda(t):I\\longrightarrow M\\)。当\\(I\\)是闭区间\\([a,b]\\)且\\(\\lambda\\)连续时，我们称\\\
  (\\lambda\\)连接\\(\\lambda(a)\\)与\\(\\lambda(b)\\)。采用以下约定是方便的。\n\n此后，当上下文需要时，假定区间\\\
  (I\\)包含\\(0\\)。\n\n考虑曲线\\(\\lambda(t):(a,b)\\longrightarrow M\\)。将\\((a,b)\\)视为光滑\\\
  (1\\)维流形，如果\\(\\lambda\\)作为光滑流形之间的映射是光滑的，则称\\(\\lambda\\)在\\((a,b)\\)上是光滑的。假设\\\
  (\\lambda\\)确实是光滑的。对于\\((a,b)\\)中的给定点\\(t\\)，我们有微分映射\n\\[\nd_t(\\lambda):T_t((a,b))\\\
  longrightarrow T_{\\lambda(t)}(M).\n\\]\n\\((a,b)\\)的一个覆盖坐标卡是\\(((a,b),\\mathrm{id}_{(a,b)}=r)\\\
  )，其中\\(r\\)是\\((a,b)\\)上的标准坐标。在\\(t\\)处相应的坐标基是\\(((d/dr)|_t)\\)。由此得出\n\\[\nd_t(\\\
  lambda)\\left(\\frac{d}{dr}\\bigg|_t\\right)\\in T_{\\lambda(t)}(M) \\tag{14.7.1}\n\
  \\]\n对所有\\(t\\in(a,b)\\)成立。因此，对所有函数\\(f\\in C^\\infty((a,b))\\)，\n\\[\nd_t(\\lambda)\\\
  left(\\frac{d}{dr}\\bigg|_t\\right)(f)\n= \\frac{d}{dr}\\bigg|_t (f\\circ\\lambda)\n\
  \\quad [(14.4.1)]\n= \\frac{d(f\\circ\\lambda)}{dr}(t).\n\\quad [(14.3.3)]\n\\tag{14.7.2}\n\
  \\]\n\n\n\n\n## 定理 14.7.3. 若 M 是光滑流形，p 是 M 中的一点，则\n\n```\nT_p(M) = { dλ/dt (t0)\
  \ : λ(t) : (a,b) ⟶ M is smooth, λ(t0) = p, t0 ∈ (a,b) }.\n```\n\n证明。这由定理 14.7.2\
  \ 与 (14.7.4) 得出。\n\n设 M 是光滑流形，p 是 M 中的一点，v 是 T_p(M) 中的向量。由前述定理可知，存在光滑曲线 λ(t) : (a,b)\
  \ ⟶ M，使得对某 t0 ∈ (a,b)，有 λ(t0) = p 且 (dλ/dt)(t0) = v。设 X 是 \U0001D51B(M) 中的向量场。则\
  \ X_p 是 T_p(M) 中的向量，因此它对应这样一条光滑曲线。我们将频繁使用这些观察结论。\n\n## 定理 14.7.4. 设 M 与 N 是光滑流形，F\
  \ : M ⟶ N 是光滑映射，p 是 M 中的一点，v 是 T_p(M) 中的向量。则：\n\n- (a)\n\n```\nd_p(F)(v) = d(F ∘\
  \ λ)/dt (t0),\n```\n\n其中 λ(t) : (a,b) ⟶ M 是任意光滑曲线，使得对某 t0 ∈ (a,b)，有 λ(t0) = p 且\
  \ (dλ/dt)(t0) = v。\n\n- (b) 若 ψ(t) : (a,b) ⟶ M 是光滑曲线，则\n\n```\nd_{ψ(t)}(F)( dψ/dt\
  \ (t) ) = d(F ∘ ψ)/dt (t)\n```\n\n对所有 t ∈ (a,b) 成立。\n\n注记。由于 F ∘ λ、F ∘ ψ : (a,b)\
  \ ⟶ N 是光滑曲线，所以这些断言是有意义的。\n\n证明。 (a) 对 C^∞(N) 中的函数 g，我们有\n\n```\nd_p(F)(v)(g) = v(g\
  \ ∘ F)    [(14.4.1)]\n= dλ/dt (t0)(g ∘ F)\n= d(g ∘ F ∘ λ)/dt (t0)    [(14.7.5)]\n\
  = d(F ∘ λ)/dt (t0)(g).    [(14.7.5)]\n```\n\n由于 g 是任意的，结论成立。\n\n(b) 这由 (a) 部分得出。\n\
  \n## 14.8 子流形\n\n在定义了光滑流形之后，自然会考虑具有相应性质的子集。设 $\\overline{M}$ 是一个光滑 $\\overline{m}$\
  \ 流形，并设 $M$ 是 $\\overline{M}$ 的一个子集，且 $M$ 本身是一个光滑 $m$ 流形。若不添加进一步假设，则没有理由期望 $\\overline{M}$\
  \ 与 $M$ 的拓扑之间有何联系，它们的光滑结构亦然。若下列条件成立，则称 $M$ 是 $\\overline{M}$ 的一个 $m$ 子流形：\n\n- [S1]\
  \ $M$ 具有子空间拓扑。\n- [S2] 包含映射 $\\iota:M\\to\\overline{M}$ 是浸入。\n\n设 $M$ 实际上是 $\\overline{M}$\
  \ 的一个 $m$ 子流形。由 [S2] 可得 $m\\leq\\overline{m}$。若 $\\dim(M)=\\dim(\\overline{M})-1$，则称\
  \ $M$ 是 $\\overline{M}$ 的一个超曲面。由于 $\\iota:M\\to\\overline{M}$ 是浸入，对 $M$ 中每一点 $p$，微分映射\
  \ $d_p(\\iota):T_p(M)\\to T_p(\\overline{M})$ 都是单射。给定 $T_p(M)$ 中的一个向量 $v$，像向量 $d_p(\\\
  iota)(v)$ 满足：对所有 $f\\in C^\\infty(\\overline{M})$，\n\n$$d_p(\\iota)(v)(f)=v(f\\\
  circ\\iota)=v(f|_M).$$\n\n我们沿用已确立的约定，将 $T_p(M)$ 与它在 $d_p(\\iota)$ 下的像等同。因此，$T_p(M)$\
  \ 被视作 $T_p(\\overline{M})$ 的一个向量子空间，并写成\n\n$$T_p(M)\\subseteq T_p(\\overline{M}).\
  \ \\tag{14.8.1}$$\n\n**定理 14.8.1.** *光滑流形的子集至多只能以一种方式成为子流形。因此，光滑流形的子集要么是子流形，要么不是。*\n\
  \n**定理 14.8.2（正则曲面）。** *任何正则曲面都是 $\\mathbb{R}^3$ 的超曲面。*\n\n注记。根据示例 14.1.4 和示例 14.1.5，正则曲面是光滑\
  \ 2 流形，而 $\\mathbb{R}^3$ 是光滑 3 流形，因此该断言有意义。\n\n证明。我们需要验证 [S1] 和 [S2] 成立。\n\n[S1]：根据定义，$M$\
  \ 具有子空间拓扑。\n\n[S2]：要证明包含映射 $\\iota:M\\to\\mathbb{R}^3$ 是浸入，必须证明它是光滑的，并且对所有 $p\\\
  in M$，微分映射 $d_p(\\iota):T_p(M)\\to T_p(\\mathbb{R}^3)$ 都是单射。\n\n*光滑性。* 设 $(U,\\\
  varphi)$ 和 $(V,\\psi)$ 分别是 $M$ 和 $\\mathbb{R}^3$ 上的图表，且满足 $\\iota(U)=U\\subset V$。由定理\
  \ 11.2.9，映射\n\n$$\\psi\\circ\\iota\\circ\\varphi^{-1}=\\psi\\circ\\varphi^{-1}:\\\
  varphi(U)\\to\\mathbb{R}^3$$\n\n是光滑的。由于 $(U,\\varphi)$ 与 $(V,\\psi)$ 是任意的，由定理 14.2.3\
  \ 可知 $\\iota$ 是光滑的。\n\n*单射性。* 设 $p$ 是 $M$ 中的一点，令 $(U,\\varphi=(\\varphi^1,\\varphi^2,\\\
  varphi^3))$ 是 $p$ 处按第 11.2 节意义下的图表。则 $(\\varphi(U),\\varphi^{-1})$ 是 $p$ 处按第 14.1\
  \ 节意义下的图表。设 $\\mathcal{X}_p$ 是 $p$ 处相应的坐标基，并设 $(r^1,r^2)$ 与 $(s^1,s^2,s^3)$ 分别是\
  \ $\\mathbb{R}^2$ 与 $\\mathbb{R}^3$ 上的标准坐标。\n\n则 $(\\mathbb{R}^3,(s^1,s^2,s^3))$\
  \ 是 $\\mathbb{R}^3$ 上的一个图表。设 $\\mathcal{Y}_p$ 是 $p=\\iota(p)$ 处相应的坐标基。由定理 14.4.6(b)\
  \ 可得\n\n$$\n[d_p(\\iota)]^{\\mathcal{Y}_p}_{\\mathcal{X}_p}=\\left[\\frac{\\partial(s^i\\\
  circ\\iota\\circ\\varphi)}{\\partial r^j}(\\varphi^{-1}(p))\\right]=\\left[\\frac{\\\
  partial s^i}{\\partial r^j}(\\varphi^{-1}(p))\\right],\n$$\n\n再由第 11.2 节的性质 [C1]\
  \ 及定理 11.2.2 可知 $d_p(\\iota)$ 是单射。\n\n反思上述子流形的定义，[S1] 看起来是一个显然的要求，但 [S2] 则并非如此。定理\
  \ 14.8.2 对 [S2] 给出了一些洞察，但其理由远非一目了然。我们不再寻求对 [S2] 的更深理解，而是改变方向，提供看待子流形的另一种视角。\n\n\
  对给定的整数 $1\\le k\\le m$，我们定义一类投影映射 $P_k:\\mathbb{R}^m\\longrightarrow\\mathbb{R}^k\\\
  times\\{0\\}^{m-k}$，其定义为\n\n$$\nP_k(r^1,\\ldots,r^k,r^{k+1},\\ldots,r^m)=(r^1,\\\
  ldots,r^k,0,\\ldots,0).\n$$\n\n设 $U$ 是 $\\mathbb{R}^m$ 中的开集，$S$ 是 $U$ 的子集。若 $S\\\
  subseteq P_k(U)$，则称 $S$ 是 $U$ 的一个 **$k$ 切片**。\n\n## 定理 14.8.3（子流形的切片准则）。设 $\\overline{M}$\
  \ 是一个光滑 $\\overline{m}$ 流形，$M$ 是 $\\overline{M}$ 的具有子空间拓扑的子集，并设 $1\\le m\\le\\overline{m}$。则：\n\
  \n- (a) $M$ 是 $\\overline{M}$ 的 $m$ 子流形，当且仅当对 $M$ 中每一点 $p$，在 $\\overline{M}$ 上有\
  \ $p$ 处的一个图表 $(U,\\varphi=(x^1,\\ldots,x^{\\overline{m}}))$，称为 **$M$ 在 $\\overline{M}$\
  \ 中的切片图表**，使得 $\\varphi(M\\cap U)$ 是 $\\varphi(U)$ 的一个 $m$ 切片。\n- (b) 若 $M$ 是 $\\\
  overline{M}$ 的 $m$ 子流形，则对应于 $\\overline{M}$ 上 $p$ 处的切片图表 $(U,\\varphi=(x^1,\\ldots,x^{\\\
  overline{m}}))$，在 $M$ 上有 $p$ 处的图表 $(M\\cap U,(x^1|_{M\\cap U},\\ldots,x^m|_{M\\\
  cap U}))$，使得\n\n$$\n\\left(\\left.\\frac{\\partial}{\\partial(x^1|_{M\\cap U})}\\\
  right|_q,\\ldots,\\left.\\frac{\\partial}{\\partial(x^m|_{M\\cap U})}\\right|_q\\\
  right)\n$$\n\n可以与\n\n$$\n\\left(\\left.\\frac{\\partial}{\\partial x^1}\\right|_q,\\\
  ldots,\\left.\\frac{\\partial}{\\partial x^m}\\right|_q\\right)\n$$\n\n等同，对所有 $q\\\
  in M\\cap U$ 成立。因此，对所有 $q\\in M\\cap U$，$T_q(M)$ 可以与 $T_q(\\overline{M})$ 中由 $(\\\
  partial/\\partial x^1)|_q,\\ldots,(\\partial/\\partial x^m)|_q$ 张成的子空间等同。\n\n上述记号相当繁琐。此后，$x^i|_{M\\\
  cap U}$ 将缩写为 $x^i$（$i=1,\\ldots,m$）。在这一修订记号下，我们将\n\n$$\n(M\\cap U,(x^1|_{M\\cap\
  \ U},\\ldots,x^m|_{M\\cap U}))\\quad\\text{记为}\\quad(M\\cap U,(x^1,\\ldots,x^m)),\n\
  $$\n\n并将\n\n$$\n\\left(\\left.\\frac{\\partial}{\\partial(x^1|_{M\\cap U})}\\right|_q,\\\
  ldots,\\left.\\frac{\\partial}{\\partial(x^m|_{M\\cap U})}\\right|_q\\right)\\quad\\\
  text{记为}\\quad\\left(\\left.\\frac{\\partial}{\\partial x^1}\\right|_q,\\ldots,\\\
  left.\\frac{\\partial}{\\partial x^m}\\right|_q\\right).\n$$\n\n我们还需要两个关于子流形的进一步结论，它们都是定理\
  \ 14.8.3 的直接推论。\n\n我们在定理 14.3.3(a) 中看到，光滑流形中的开集本身是光滑流形。下面的结论说明它也是子流形。\n\n**定理 14.8.4（开子流形）。**\
  \ _若 M 是光滑 m 流形，U 是 M 中的开集，则 U 是 M 的 m 子流形，称为 M 中对应于 U 的开子流形。_\n\n> **此后，光滑流形中的任何开集均视为开子流形。**\n\
  \n**定理 14.8.5（图表）。** 设 M 是光滑 m 流形，p 是 M 中的一点，$(U,\\varphi)$ 是 p 处的一个图表，并设 $X_p =\
  \ ((\\partial/\\partial x^1)|_p, \\ldots, (\\partial/\\partial x^m)|_p)$ 是 p 处相应的坐标基。设\
  \ $(r^1, \\ldots, r^m)$ 是 $\\mathbb{R}^m$ 上的标准坐标，并设 $((\\partial/\\partial r^1)|_p,\
  \ \\ldots, (\\partial/\\partial r^m)|_p)$ 是 p 处的标准坐标基。将 U 和 φ(U) 分别视作 M 和 $\\mathbb{R}^m$\
  \ 的开 m 子流形，并作等同 $T_p(U)=T_p(M)$、$T_{\\varphi(p)}(\\varphi(U))=\\mathbb{R}^m$。设 $\\\
  mathcal{E}=(e_1,\\ldots,e_m)$ 是 $\\mathbb{R}^m$ 的标准基，并作等同 $((\\partial/\\partial\
  \ r^1)|_p,\\ldots,(\\partial/\\partial r^m)|_p)=\\mathcal{E}$（如定理 14.5.7 所给出）。则：\n\
  \n- (a) $\\varphi: U \\to \\varphi(U)$ 是一个微分同胚。\n- (b) $X_p$ 是 $T_p(U)$ 的一组基。\n\
  - (c) $[d_p(\\varphi)]_{X_p}^{\\mathcal{E}} = I_m = [d_{\\varphi(p)}(\\varphi^{-1})]_{\\\
  mathcal{E}}^{X_p}$。\n- (d) $d_{\\varphi(p)}(\\varphi^{-1})(e_i)=\\left.\\frac{\\\
  partial}{\\partial x^i}\\right|_p$，其中 $i=1,\\ldots,m$。\n\n**证明。** (a) 直接得出。\n\n\
  (b) 这由定理 14.3.3(b) 和定理 14.3.4(a) 得出。或者，在定理 14.8.3(b) 中取 $M=U$、$\\overline{M}=M$\
  \ 即可得到该结论。\n\n(c) 我们有\n\n$$\\frac{\\partial(r^i\\circ\\varphi)}{\\partial x^j}(p)=\\\
  frac{\\partial(r^i\\circ\\varphi\\circ\\varphi^{-1})}{\\partial r^j}(\\varphi(p))\
  \ \\quad [(14.3.2)]$$\n$$=\\frac{\\partial r^i}{\\partial r^j}(\\varphi(p))$$\n\
  $$=\\delta^i_j \\quad [\\text{定理 14.3.1(b)}]$$\n\n其中 $i,j=1,\\ldots,m$。于是由定理 14.4.6(b)\
  \ 可得 $[d_p(\\varphi)]_{X_p}^{\\mathcal{E}}=I_m$，这证明了第一个等式。我们还得到\n\n$$[d_{\\varphi(p)}(\\\
  varphi^{-1})]_{\\mathcal{E}}^{X_p}=[d_p(\\varphi)^{-1}]_{X_p}^{\\mathcal{E}} \\\
  quad [\\text{定理 14.6.1，}(a)\\text{ 部分}]$$\n$$=\\left([d_p(\\varphi)]_{X_p}^{\\mathcal{E}}\\\
  right)^{-1} \\quad [\\text{定理 2.2.5(b)}]$$\n$$=I_m. \\quad [\\text{由第一个等式}]$$\n\n\
  \n\n\n这证明了第二个等式。\n(d): 这由(2.2.2)、(2.2.3)及(c)部分得出。\n\n## 14.9 参数化曲面\n\n光滑流形 $M$ 上的**参数化曲面**是如下形式的光滑映射\n\
  \n$$\n\\sigma(r,s):(a,b)\\times(-\\epsilon,\\epsilon)\\longrightarrow M,\n$$\n\n\
  其中 $\\epsilon>0$ 是实数。对于 $(a,b)$ 中的给定点 $r$，我们定义一条光滑曲线\n\n$$\n\\sigma_r(s):(-\\epsilon,\\\
  epsilon)\\longrightarrow M\n$$\n\n为\n\n$$\n\\sigma_r(s)=\\sigma(r,s)\n$$\n\n对所有\
  \ $s\\in(-\\epsilon,\\epsilon)$ 成立。类似地，对于 $(-\\epsilon,\\epsilon)$ 中的给定点 $s$，我们定义一条光滑曲线\n\
  \n$$\n\\sigma_s(r):(a,b)\\longrightarrow M\n$$\n\n为\n\n$$\n\\sigma_s(r)=\\sigma(r,s)\n\
  $$\n\n对所有 $r\\in(a,b)$ 成立。为了与旋转曲面语境中引入的术语保持一致，我们将 $\\sigma_r$ 称为对应于 $r$ 的**纬线曲线**（或**横向曲线**），将\
  \ $\\sigma_s$ 称为对应于 $s$ 的**经线曲线**。在大多数应用中，我们倾向于将 $\\sigma$ 视为由 $s$ 索引的经线曲线族。\n\n\
  现在让我们从第 14.7 节的视角来考虑光滑曲线 $\\sigma_s$。对于 $(-\\epsilon,\\epsilon)$ 中的给定点 $s$，并使用 (14.7.3)，我们用\
  \ $\\frac{\\partial\\sigma}{\\partial r}(r,s)$ 表示 $\\frac{d\\sigma_s}{dr}(r)$。根据\
  \ (14.7.4)，\n\n$$\n\\frac{\\partial\\sigma}{\\partial r}(r,s)\\quad\\text{is a vector\
  \ in}\\quad T_{\\sigma(r,s)}(M).\n$$\n\n我们类似地定义 $(\\partial\\sigma/\\partial s)(r,s)$。\n\
  \n**例 14.9.1。** 根据定理 11.4.3，旋转曲面是具有形式 $((a,b)\\times(-\\pi,\\pi),\\varphi=(t,\\\
  phi))$ 的坐标卡的正则曲面，其中\n\n$$\n\\varphi(t,\\phi)=(\\rho(t)\\cos(\\phi),\\rho(t)\\sin(\\\
  phi),h(t))\n$$\n\n对所有 $(t,\\phi)\\in(a,b)\\times(-\\pi,\\pi)$ 成立。因此，$\\varphi$ 在上述意义下是一个参数化曲面，且\
  \ $\\varphi_t$ 和 $\\varphi_\\phi$ 分别是第 11.4 节所定义的纬线曲线和经线曲线。\n\n## 定理 14.9.2. 设 M\
  \ 是一个光滑 m-流形，设 σ(r,s) : (a,b) × (−ε,ε) ⟶ M 是一个参数化曲面，并设 (U, (x^i)) 是 M 上与 σ((a,b)\
  \ × (−ε,ε)) 相交的一个坐标卡。则在局部坐标下，\n\n```\n∂σ/∂r (r,s) = Σ_i ∂(x^i ∘ σ)/∂r (r,s) ∂/∂x^i\
  \ |_{σ(r,s)}\n```\n\n以及\n\n```\n∂σ/∂s (r,s) = Σ_i ∂(x^i ∘ σ)/∂s (r,s) ∂/∂x^i |_{σ(r,s)}\n\
  ```\n\n对所有交集中的 (r,s) 成立。\n\n注：我们注意到 ∂(x^i ∘ σ)/∂r 和 ∂(x^i ∘ σ)/∂s 是通常的（欧氏）偏导数。\n\
  \n证明：由定理 14.7.1(b) 和 (14.9.1) 可得\n\n```\n∂σ/∂r (r,s) = dσ_s/dr (r) = Σ_i d(x^i ∘\
  \ σ_s)/dr (r) ∂/∂x^i |_{σ_s(r)}\n```\n\n```\n= Σ_i ∂(x^i ∘ σ)/∂r (r,s) ∂/∂x^i |_{σ(r,s)}\
  \ ,\n```\n\n这给出了第一个恒等式。第二个恒等式类似地证明。\n"
- "## 第15章\n\n## 光滑流形上的场\n\n在本章中，我们将向量场推广到光滑流形，并定义一系列其他类型的“场”。\n\n## 15.1 向量场\n\n\
  向量场出现在多种情境中。在本节中，我们讨论光滑流形、曲线、参数化曲面和子流形上的向量场。\n\n*光滑流形。* 设 $M$ 是一个光滑流形。**$M$ 上的向量场**是映射\
  \ $X$，它为 $M$ 中的每个点 $p$ 指定 $T_p(M)$ 中的一个向量 $X_p$。与正则曲面上的向量场情形一样，我们有时使用“$|_p$”记号作为“下标\
  \ $p$”记号的替代，尤其是在涉及其他下标时。根据 (14.3.1)，$X_p$ 满足乘积法则\n\n$X_p(fg) = f(p)\\,X_p(g) + g(p)\\\
  ,X_p(f)$  (15.1.1)\n\n对所有 $f,g\\in C^\\infty(M)$ 成立。\n\n设 $f\\in C^\\infty(M)$，并令\n\
  \n$X(f) : M \\longrightarrow \\mathbb{R}$\n\n为如下定义的函数：\n\n$X(f)(p) = X_p(f)$  (15.1.2)\n\
  \n对所有 $p\\in M$ 成立。由 (15.1.1) 可得\n\n$X(fg) = fX(g) + gX(f).$  (15.1.3)\n\n如果 $X(f)\\\
  in C^\\infty(M)$ 对所有 $f\\in C^\\infty(M)$ 成立，则称 $X$ 是**（在 $M$ 上）光滑的**。$M$ 上光滑向量场的集合记为\
  \ $\\mathfrak{X}(M)$。我们通过定义如下运算使 $\\mathfrak{X}(M)$ 同时成为 $\\mathbb{R}$ 上的向量空间和 $C^\\\
  infty(M)$ 上的模：对所有向量场 $X,Y\\in\\mathfrak{X}(M)$、所有函数 $f\\in C^\\infty(M)$ 以及所有实数\
  \ $c$，令\n\n$(X + Y)_p = X_p + Y_p,$\n\n$(fX)_p = f(p)X_p,$\n\n以及\n\n$(cX)_p = cX_p$\n\
  \n对所有 $p\\in M$ 成立。\n\n回顾第 10.3 节中欧氏空间之间光滑向量场 $X : U \\longrightarrow \\mathbb{R}^m$\
  \ 的定义，我们注意到对于 $U$ 中每个点 $p$，向量 $X_p$ 取自 $\\mathbb{R}^m$。事后看来，我们当时实际上是隐式地将切空间 $T_p(\\\
  mathbb{R}^m)$ 与 $\\mathbb{R}^m$ 等同起来。\n\n## 定理 15.1.1. 设 M 是一个光滑流形，设 X 是 \U0001D51B\
  (M) 中的向量场，设 p 是 M 中的一点。如果 λ(t) : (a,b) ⟶ M 是一条光滑曲线，使得对于某个 t0 ∈ (a,b) 有 λ(t0) = p\
  \ 且 (dλ/dt)(t0) = X_p，则\n\nX(f)(p) = d(f ∘ λ)/dt (t0)\n\n对所有函数 f ∈ C^∞(M) 成立。\n\n\
  证明：我们有\n\nX(f)(p) = X_p(f)      [(15.1.2)]\n= dλ/dt (t0)(f)\n= d(f ∘ λ)/dt (t0).\
  \      [(14.7.5)]\n\n下一个结果保证了对于切空间中的给定向量，总存在一个以该向量为值的光滑向量场。其证明（未给出）依赖于隆起函数。\n\n\
  ## 定理 15.1.2（向量的光滑延拓）。设 M 是一个光滑流形，设 p 是 M 中的一点，v 是 T_p(M) 中的一个向量。则存在 \U0001D51B\
  (M) 中的向量场 X 使得 X_p = v。\n\n设 M 是一个光滑 m-流形，U 是 M 中的开集。将 U 视为 m-流形，设 X1,...,Xm 是 \U0001D51B\
  (U) 中的向量场。如果对于所有 p ∈ U，\U0001D4B3_p = (X1|p,...,Xm|p) 是 T_p(U) 的一个基，则 m-元组 \U0001D4B3\
  \ = (X1,...,Xm) 被称为 U 上的一个**标架**。我们将在本节后面看到，对于 M 中的每个点 p，总存在 p 的一个邻域，该邻域上有标架。然而，整个\
  \ M 上可能没有标架。\n\n曲线。设 M 是一个光滑流形，λ : (a,b) ⟶ M 是一条光滑曲线。λ 上的向量场是映射 J，它为 (a,b) 中的每个点\
  \ t 指定 $T_{\\lambda(t)}(M)$ 中的一个向量 $J(t)$。我们注意到不要求 $\\lambda$ 是单射，因此 $\\lambda$\
  \ 的像可能自交。因此，对于 $\\lambda((a,b))$ 中的给定点，可能指派两个（或更多）不同的向量。这代表了曲线上的向量场与光滑流形上的向量场之间的显著区别。\n\
  \n设 $f\\in C^\\infty(M)$，考虑函数\n\n$$J(f):(a,b)\\longrightarrow\\mathbb{R}$$\n\n定义为\n\
  \n$$J(f)(t)=J(t)(f)$$\n\n对所有 $t\\in(a,b)$ 成立。如果 $J(f)\\in C^\\infty((a,b))$ 对所有\
  \ $f\\in C^\\infty(M)$ 成立，则称 $J$ 是**（在 $\\lambda$ 上）光滑的**。$\\lambda$ 上光滑向量场的集合记为\
  \ $\\mathfrak{X}_M(\\lambda)$。回忆第 14.7 节，$\\lambda$ 在 $t$ 处的速度为 $(d\\lambda/dt)(t)$。$\\\
  lambda$ 的**速度**是 $\\lambda$ 上的向量场，由映射 $t\\mapsto(d\\lambda/dt)(t)$ 对所有 $t\\in(a,b)$\
  \ 定义。如果 $\\lambda$ 的速度处处非零，即对于任何 $t\\in(a,b)$，$(d\\lambda/dt)(t)$ 都不是 $T_{\\lambda(t)}(M)$\
  \ 中的零向量，则称 $\\lambda$ 是正则的。\n\n**定理 15.1.3.** *在上述记号下，$d\\lambda/dt$ 是 $\\mathfrak{X}_M(\\\
  lambda)$ 中的向量场。*\n\n*证明.* 在 (15.1.4) 中令 $J=d\\lambda/dt$，由 (14.7.5) 可得\n\n$$\\frac{d\\\
  lambda}{dt}(f)(t)=\\frac{d\\lambda}{dt}(t)(f)=\\frac{d(f\\circ\\lambda)}{dt}(t)$$\n\
  \n对所有 $t\\in(a,b)$ 成立。由于 $f$ 和 $\\lambda$ 光滑，根据定理 14.2.4，$f\\circ\\lambda$ 也光滑。因此，$(d\\\
  lambda/dt)(f)\\in C^\\infty((a,b))$ 对所有 $f\\in C^\\infty(M)$ 成立。\n\n**定理 15.1.4.**\
  \ *继续使用上述记号，如果 $X$ 是 $\\mathfrak{X}(M)$ 中的向量场，则 $X\\circ\\lambda$ 是 $\\mathfrak{X}_M(\\\
  lambda)$ 中的向量场。*\n\n*注.* 显然，$X\\circ\\lambda$ 是 $\\lambda$ 上的向量场，因此断言有意义。\n\n*证明.*\
  \ 在 (15.1.4) 中令 $J=X\\circ\\lambda$，由 (15.1.2) 可得\n\n$$(X\\circ\\lambda)(f)(t)=(X\\\
  circ\\lambda)(t)(f)=X_{\\lambda(t)}(f)=X(f)(\\lambda(t))=(X(f)\\circ\\lambda)(t)$$\n\
  \n对所有 $t\\in(a,b)$ 成立。由于 $X$ 和 $f$ 光滑，根据定义 $X(f)$ 也光滑，又因为 $\\lambda$ 光滑，根据定理 14.2.4，$X(f)\\\
  circ\\lambda$ 也光滑。因此，$(X\\circ\\lambda)(f)\\in C^\\infty((a,b))$ 对所有 $f\\in C^\\\
  infty(M)$ 成立。\n\n取决于 $\\lambda$，并非 $\\mathfrak{X}_M(\\lambda)$ 中的每个向量场 $J$ 都能表示为\
  \ $\\lambda$ 与 $\\mathfrak{X}(M)$ 中某个向量场的复合。例如，假设 $\\lambda$ 的像在 $(a,b)$ 中的点 $t_1,t_2$\
  \ 处自交，且 $J(t_1)\\ne J(t_2)$。由于 $\\mathfrak{X}(M)$ 中的每个向量场为 $M$ 中每个点 $p$ 指派一个确定的向量，因此不存在\
  \ $X\\in\\mathfrak{X}(M)$ 使得 $J=X\\circ\\lambda$。\n\n\n\n\n设 $J_1,\\dots,J_m$ 为\
  \ $\\mathfrak{X}_M(\\lambda)$ 中的向量场。 $m$-元组 $\\mathcal{J}=(J_1,\\dots,J_m)$ 在 $\\\
  lambda$ 上称为一个 frame，若 $\\mathcal{J}(t)=(J_1(t),\\dots,J_m(t))$ 对所有 $t$ 在 $(a,b)$\
  \ 中都是 $T_{\\lambda(t)}(M)$ 的基。\n\n## *参数化曲面。*\n\n设 $M$ 为光滑流形，设 $\\sigma(r,s):(a,b)\\\
  times(-\\varepsilon,\\varepsilon)\\longrightarrow M$ 为参数化曲面。 $\\sigma$ 上的向量场是一个映射\
  \ $V$，它将 $(a,b)\\times(-\\varepsilon,\\varepsilon)$ 中的每一点 $(r,s)$ 赋予 $T_{\\sigma(r,s)}(M)$\
  \ 中的向量 $V(r,s)$。再次强调，$\\sigma$ 不要求是单射。设 $f$ 为 $C^\\infty(M)$ 中的函数，并考虑函数\n\n$V(f):(a,b)\\\
  times(-\\varepsilon,\\varepsilon)\\longrightarrow\\mathbb{R}$\n\n定义为\n\n$V(f)(r,s)=V(r,s)(f)\\\
  qquad(15.1.5)$\n\n对所有 $(r,s)$ 在 $(a,b)\\times(-\\varepsilon,\\varepsilon)$ 中。我们说\
  \ $V$ 是光滑的（在 $\\sigma$ 上），如果对所有 $f$ 在 $C^\\infty(M)$ 中，$V(f)$ 在 $C^\\infty((a,b)\\\
  times(-\\varepsilon,\\varepsilon))$ 中。 $\\sigma$ 上的光滑向量场的集合记为 $\\mathfrak{X}_M(\\\
  sigma)$。\n\n回顾 (14.9.1) 中的记号，我们定义 $\\sigma$ 上的向量场 $\\partial\\sigma/\\partial r$\
  \ 为赋值 $(r,s)\\longmapsto(\\partial\\sigma/\\partial r)(r,s)$，$\\partial\\sigma/\\\
  partial s$ 亦然。\n\n### 定理 15.1.5. 在上述设定下，$\\partial\\sigma/\\partial r$ 和 $\\partial\\\
  sigma/\\partial s$ 是 $\\mathfrak{X}_M(\\sigma)$ 中的向量场。\n\n证明. 我们有\n\n$\\frac{\\\
  partial\\sigma}{\\partial r}(f)(r,s)=\\frac{\\partial\\sigma}{\\partial r}(r,s)(f)\\\
  quad[(15.1.5)]$ $=\\frac{d\\sigma_s}{dr}(r)(f)\\quad[(14.9.1)]$ $=\\frac{d(f\\circ\\\
  sigma_s)}{dr}(r)\\quad[(14.7.5)]$ $=\\frac{\\partial(f\\circ\\sigma)}{\\partial\
  \ r}(r,s)$\n\n对所有 $(r,s)$ 在 $(a,b)\\times(-\\varepsilon,\\varepsilon)$ 中。由于 $f$\
  \ 和 $\\sigma$ 是光滑的，根据定理 14.2.4，$f\\circ\\sigma$ 也是光滑的，因此 $\\partial(f\\circ\\sigma)/\\\
  partial r$ 也是光滑的。于是，$(\\partial\\sigma/\\partial r)(f)$ 对所有 $f$ 在 $C^\\infty(M)$\
  \ 中都在 $C^\\infty((a,b)\\times(-\\varepsilon,\\varepsilon))$ 中，$(\\partial\\sigma/\\\
  partial s)(f)$ 亦然。\n\n## *子流形。*\n\n设 $\\overline{M}$ 为光滑流形，$M$ 为子流形。沿 $M$ 的向量场是一个映射\
  \ $V$，它将 $M$ 中的每一点 $p$ 赋予 $T_p(\\overline{M})$ 中的向量 $V_p$。我们注意到 $V_p$ 要求在 $T_p(\\\
  overline{M})$ 中，但不一定在 $T_p(M)$ 中。这解释了术语从“在 $M$ 上”改为“沿 $M$”的原因。\n\n设 $f$ 为 $C^\\\
  infty(\\overline{M})$ 中的函数，并考虑函数\n\n$V(f):M\\longrightarrow\\mathbb{R}$\n\n定义为\n\
  \n$V(f)(p)=V_p(f)$\n\n对所有 $p$ 在 $M$ 中。我们说 $V$ 是光滑的（沿 $M$），如果对所有 $f$ 在 $C^\\infty(\\\
  overline{M})$ 中，$V(f)$ 在 $C^\\infty(M)$ 中。沿 $M$ 的光滑向量场的集合记为 $\\mathfrak{X}_{\\overline{M}}(M)$。特别地，对每个向量场\
  \ $X$ 在 $\\mathfrak{X}(\\overline{M})$ 中，限制 $X|_M$ 在 $\\mathfrak{X}_{\\overline{M}}(M)$\
  \ 中。带有通常的加法和数量乘法定义，$\\mathfrak{X}_{\\overline{M}}(M)$ 是 $\\mathbb{R}$ 上的向量空间且是 $C^\\\
  infty(M)$ 上的模。此外，经过适当的等同，$\\mathfrak{X}(M)$ 是 $\\mathfrak{X}_{\\overline{M}}(M)$\
  \ 的 $C^\\infty(M)$-子模。根据 (14.8.1)，对每个点 $p$ 在 $M$ 中，$T_p(M)$ 是 $T_p(\\overline{M})$\
  \ 的子空间。我们说 $\\mathfrak{X}_{\\overline{M}}(M)$ 中的向量场 $V$ 在无处与 $M$ 相切，如果 $V_p$ 对所有\
  \ $p$ 在 $M$ 中都不在 $T_p(M)$ 中，或等价地，如果 $V_p$ 对所有 $p$ 在 $M$ 中都在 $T_p(\\overline{M})\
  \ \\setminus T_p(M)$ 中。\n\n设 $M$ 为光滑 $m$-流形，$U$ 为 $M$ 中的开集。回顾定理 14.8.4，$U$ 是 $M$\
  \ 的开 $m$-子流形。设 $U$ 是 $M$ 上图表 $(U, (x^i))$ 的坐标域。$(U, (x^i))$ 的第 $i$ 个坐标向量场是向量场\n\n\
  ∂/∂x^i   in   \U0001D51B(U)\n\n定义为赋值\n\np ↦ ∂/∂x^i|_p\n\n对所有 $p$ 在 $U$ 中，$i = 1,\
  \ …, m$，其中我们记\n\n∂/∂x^i(p)   by   ∂/∂x^i|_p.\n\n则 $(∂/∂x^1, …, ∂/∂x^m)$ 是 $U$ 上的一个\
  \ frame，称为对应于 $(U, (x^i))$ 的坐标 frame。\n\n设 $X$ 为 $M$ 上的（不一定光滑的）向量场。则 $X|_U$ 可表示为\n\
  \nX|_U = Σ_i α^i ∂/∂x^i,   (15.1.6)\n\n其中 α^i 是 $U$ 上的唯一确定的函数，称为 $X$ 关于 $(U, (x^i))$\
  \ 的分量。为简便起见，我们记\n\nX|_U   by   X.\n\n式 (15.1.6) 的右端称为 $X$ 关于 $(U, (x^i))$ 在局部坐标下的表达式。我们经常在不提及底层图表的情况下给出向量场的局部坐标表达式。这不会引起任何混淆，因为坐标\
  \ frame 的记号已嵌入式 (15.1.6) 中使用的记号中，且坐标域的具体细节通常不是立即关心的。\n\n### 例 15.1.6 (ℝ^m)。设 $(r^1,\
  \ …, r^m)$ 为 ℝ^m 上的标准坐标，设 $(∂/∂r^1, …, ∂/∂r^m)$ 为相应的坐标 frame，称为标准坐标 frame，设 $(e_1,\
  \ …, e_m)$ 为 ℝ^m 的标准基。\n\n由定理 14.5.7 可知 $(∂/∂r¹, …, ∂/∂rᵐ)$ 可与 $(e₁, …, eₘ)$ 识别，写成\n\
  \n\\(\\left(\\frac{\\partial}{\\partial r^1},...,\\frac{\\partial}{\\partial r^m}\\\
  right) = (e_1,...,e_m).\\)\n\n### 定理 15.1.7 (向量场的光滑性准则)。设 $M$ 为光滑流形，$X$ 为 $M$ 上的（不一定光滑的）向量场。则\
  \ $X$ 在 \U0001D51B(M) 中当且仅当对 $M$ 上的每个图表 $(U, (xⁱ))$，$X$ 的分量都在 $C^∞(U)$ 中。\n\n证明.\
  \ (⇒): 设 $X = Σᵢ αⁱ(∂/∂xⁱ)$ 为 $X$ 关于 $(U, (xⁱ))$ 的局部坐标表达式，设 $p$ 为 $U$ 中的点。由于 $xⁱ$\
  \ 是 $C^∞(U)$ 中的函数，根据定理 14.2.7，存在 $C^∞(M)$ 中的函数 $\\tilde{x}ⁱ$ 和 $p$ 在 $M$ 中的邻域 $\\\
  tilde{U} ⊆ U$，使得 $xⁱ$ 与 $\\tilde{x}ⁱ$ 在 $\\tilde{U}$ 上一致。根据定理 14.3.1(b)，\n\n\\[\
  \ X(\\tilde{x}ⁱ) = \\left(\\sum_j αʲ \\frac{∂}{∂xʲ}\\right)(\\tilde{x}ⁱ) = \\sum_j\
  \ αʲ \\frac{∂\\tilde{x}ⁱ}{∂xʲ} = αⁱ \\]\n\n在 $\\tilde{U}$ 上。由于 $X$ 在 \U0001D51B\
  (M) 中且 $\\tilde{x}ⁱ$ 在 $C^∞(M)$ 中，根据定义，$X(\\tilde{x}ⁱ)$ 在 $C^∞(M)$ 中。于是 αⁱ 在 $\\\
  tilde{U}$ 上光滑。由于 $p$ 是任意的，αⁱ 对 $i = 1, …, m$ 在 $U$ 上光滑。\n\n(⇐): 设 $X = Σᵢ αⁱ(∂/∂xⁱ)$\
  \ 为 $X$ 关于 $(U, (xⁱ))$ 的局部坐标表达式。对 $C^∞(M)$ 中的函数 $f$，我们有\n\n\\[ X(f) = \\sum_i αⁱ\
  \ \\frac{∂f}{∂xⁱ} \\]\n\n在 $U$ 上。根据假设，αⁱ 在 $U$ 上光滑，因此 $X(f)$ 也是光滑的。由于 $M$ 被其 atlas\
  \ 的坐标域覆盖，$X(f)$ 在 $M$ 上光滑。\n\n### 定理 15.1.8 (坐标 frame 的变换)。设 $M$ 为光滑 $m$-流形，设 $(U,\
  \ (xⁱ))$ 和 $(\\tilde{U}, (\\tilde{x}ʲ))$ 为 $M$ 上的重叠图表，设 $(∂/∂x¹, …, ∂/∂xᵐ)$ 和 $(∂/∂\\\
  tilde{x}¹, …, ∂/∂\\tilde{x}ᵐ)$ 为相应的坐标 frame。则\n\n\\[ \\frac{∂}{∂xⁱ} = \\sum_j \\\
  frac{∂\\tilde{x}ʲ}{∂xⁱ} \\frac{∂}{∂\\tilde{x}ʲ} \\]\n\n在 $U ∩ \\tilde{U}$ 上，对 $i\
  \ = 1, …, m$。\n\n证明. 这由定理 14.3.5(a) 可得。\n\n## 15.2 向量场的表示\n\n设 $M$ 为光滑流形。线性映射\n\n\
  \\[ \\mathcal{D} : C^∞(M) \\longrightarrow C^∞(M) \\]\n\n称为 $C^{\\infty}(M)$ 上的导子，如果它满足以下乘积法则：\n\
  \n```\n$\\mathcal{D}(fg) = f\\mathcal{D}(g) + g\\mathcal{D}(f)$\n```\n\n对所有 $f,\
  \ g$ 在 $C^{\\infty}(M)$ 中；即\n\n```\n$\\mathcal{D}(fg)(p) = f(p)\\,\\mathcal{D}(g)(p)\
  \ + g(p)\\,\\mathcal{D}(f)(p)$\n```\n\n对所有 $p$ 在 $M$ 中。$C^{\\infty}(M)$ 上的导子的集合记为\
  \ $\\operatorname{Der}(M)$。$\\operatorname{Der}(M)$ 中的零导子，记为 $0$，是把 $C^{\\infty}(M)$\
  \ 中的所有函数映射到 $C^{\\infty}(M)$ 中的零函数的导子。我们把 $\\operatorname{Der}(M)$ 设为 $\\mathbb{R}$\
  \ 上的向量空间和 $C^{\\infty}(M)$ 上的模，定义运算如下：对所有导子 $\\mathcal{D}, \\mathcal{E}$ 在 $\\operatorname{Der}(M)$\
  \ 中，所有函数 $f, g$ 在 $C^{\\infty}(M)$ 中，以及所有实数 $c$，令\n\n```\n$(\\mathcal{D} + \\mathcal{E})(f)(p)\
  \ = \\mathcal{D}(f)(p) + \\mathcal{E}(f)(p)$\n```\n\n```\n$(f\\mathcal{D})(g)(p)\
  \ = f(p)\\,\\mathcal{D}(g)(p)$\n```\n\n且\n\n```\n$(c\\mathcal{D})(f)(p) = c\\,\\\
  mathcal{D}(f)(p)$\n```\n\n对所有 $p$ 在 $M$ 中。\n\n我们由 (15.1.3) 可见，$M$ 上的向量场可以看作 $C^{\\\
  infty}(M)$ 上的导子。沿着这一思路，考虑映射\n\n```\n$\\mathfrak{F}: \\mathfrak{X}(M) \\longrightarrow\
  \ \\operatorname{Der}(M)$\n```\n\n定义为\n\n```\n$\\mathfrak{F}(X)(f) = X(f)$\n```\n\
  \n对所有向量场 $X$ 在 $\\mathfrak{X}(M)$ 中和所有函数 $f$ 在 $C^{\\infty}(M)$ 中；即\n\n```\n$\\\
  mathfrak{F}(X)(f)(p) = X(f)(p)$\n```\n\n对所有 $p$ 在 $M$ 中，其中右端由 (15.1.2) 给出。\n\n###\
  \ **定理 15.2.1 (向量场的表示)。** *若 $M$ 为光滑流形，则 $\\mathfrak{F}$ 是 $C^{\\infty}(M)$-模同构：*\n\
  \n```\n$\\mathfrak{X}(M) \\approx \\operatorname{Der}(M)$.\n```\n\n*证明.* 易证 $\\\
  mathfrak{F}$ 是 $C^{\\infty}(M)$-模同态。剩下要证明 $\\mathfrak{F}$ 是双射。\n\n*单射性.* 设 $X$ 为\
  \ $\\mathfrak{X}(M)$ 中的向量场使得 $\\mathfrak{F}(X)=0$；即 $X(f)=0$ 对所有 $f$ 在 $C^{\\infty}(M)$\
  \ 中。根据定义，$X=0$，所以 $\\ker(\\mathfrak{F}) = \\{0\\}$。由定理 B.5.3 可知 $\\mathfrak{F}$\
  \ 是单射。\n\n*满射性.* 设 $\\mathcal{D}$ 为 $C^{\\infty}(M)$ 上的导子。对 $M$ 中的每一点 $p$，定义函数\n\
  \n```\n$X_{\\mathcal{D}|p}: C^{\\infty}(M) \\longrightarrow \\mathbb{R}$\n```\n\n\
  \n\nby\n\\[ X_{\\mathcal{D}}|_{p}(f) = \\mathcal{D}(f)(p) \\tag{15.2.2} \\]\n对所有\
  \ $C^{\\infty}(M)$ 中的函数 $f$ 成立。由于 $\\mathcal{D}$ 是线性的，所以 $X_{\\mathcal{D}}|_{p}$\
  \ 也是线性的。对 $C^{\\infty}(M)$ 中的函数 $f, g$，由 (15.2.1) 可得\n\\[ X_{\\mathcal{D}}|_{p}(fg)\
  \ = \\mathcal{D}(fg)(p) = f(p)\\,\\mathcal{D}(g)(p) + g(p)\\,\\mathcal{D}(f)(p)\
  \ = f(p)\\,X_{\\mathcal{D}}|_{p}(g) + g(p)\\,X_{\\mathcal{D}}|_{p}(f), \\]\n\n故\
  \ $X_{\\mathcal{D}}|_{p}$ 满足 (14.3.1)。于是，$X_{\\mathcal{D}}|_{p}$ 是 $p$ 处的切向量。令 $X_{\\\
  mathcal{D}}$ 为 $M$ 上的向量场，由赋值 $p \\longmapsto X_{\\mathcal{D}}|_{p}$ 对所有 $p \\in\
  \ M$ 定义。则\n\\[ X_{\\mathcal{D}}(f)(p) = X_{\\mathcal{D}}|_{p}(f) \\quad [(15.1.2)]\
  \ = \\mathcal{D}(f)(p) \\quad [(15.2.2)] \\]\n对所有 $p \\in M$ 成立，故 $X_{\\mathcal{D}}(f)\
  \ = \\mathcal{D}(f)$。根据定义，$\\mathcal{D}(f)$ 对所有 $C^{\\infty}(M)$ 中的函数 $f$ 属于 $C^{\\\
  infty}(M)$，因此 $X_{\\mathcal{D}}(f)$ 也是如此。于是根据定义，$X_{\\mathcal{D}}$ 是 $M$ 上的光滑向量场；即\
  \ $X_{\\mathcal{D}}$ 属于 $\\mathfrak{X}(M)$。由于 $\\mathfrak{F}(X_{\\mathcal{D}}) =\
  \ \\mathcal{D}$ 且 $\\mathcal{D}$ 是任意的，$\\mathfrak{F}$ 是满射。\n\n这表明 $\\mathfrak{F}$\
  \ 是一个 $C^{\\infty}(M)$-模同构。\n\n从现在起，我们经常（但不总是）将 $\\mathfrak{X}(M)$ 与 $\\mathrm{Der}(M)$\
  \ 识别起来。然而，我们仍将继续使用之前的术语和记号，例如说“$X$ 是 $\\mathfrak{X}(M)$ 中的向量场”而不是“$X$ 是 $\\mathrm{Der}(M)$\
  \ 中的导子”。通常可以根据上下文判断是否进行了识别，但有时为强调起见，我们会明确指出。\n\n## 15.3 Lie 括号\n\n设 $M$ 为光滑流形，$X$\
  \ 和 $Y$ 为 $\\mathfrak{X}(M)$ 中的向量场。$X$ 与 $Y$ 的 Lie 括号是映射\n\\[ [X,Y] : C^{\\infty}(M)\
  \ \\longrightarrow C^{\\infty}(M) \\]\n定义为\n\\[ [X,Y](f) = X(Y(f)) - Y(X(f)) \\\
  tag{15.3.1} \\]\n对所有 $C^{\\infty}(M)$ 中的函数 $f$ 成立。注意此定义使用了定理 15.2.1 给出的向量场的表示。暂时回到向量场表述，由\
  \ (15.1.2) 可得\n\\[ X(Y(f))(p) = X_{p}(Y(f)) \\quad \\text{and} \\quad Y(X(f))(p)\
  \ = Y_{p}(X(f)), \\]\n从而\n\\[ [X,Y](f)(p) = X_{p}(Y(f)) - Y_{p}(X(f)) \\]\n对所有 $p\
  \ \\in M$ 成立。\n\n## 定理 15.3.1. 在上述设定下，[X, Y] 是 $C^{\\infty}(M)$ 上的导子。\n\n证明。由于 $Y$\
  \ 属于 $\\mathfrak{X}(M)$ 且 $f$ 属于 $C^{\\infty}(M)$，根据定义，$Y(f)$ 属于 $C^{\\infty}(M)$。此外，由于\
  \ $X$ 属于 $\\mathfrak{X}(M)$ 且 $Y(f)$ 属于 $C^{\\infty}(M)$，根据定义，$X(Y(f))$ 属于 $C^{\\\
  infty}(M)$。同理，$Y(X(f))$ 属于 $C^{\\infty}(M)$。于是 $[X, Y](f)$ 属于 $C^{\\infty}(M)$。其余的验证是直接的。\n\
  \nLie 括号是映射\n\n[·,·] : \U0001D51B(M) × \U0001D51B(M) ⟶ \U0001D51B(M)\n\n定义为赋值\n\n\
  (X, Y) ⟼ [X, Y] = X ∘ Y − Y ∘ X\n\n对所有 $\\mathfrak{X}(M)$ 中的向量场 $X, Y$ 成立。\n\n##\
  \ 定理 15.3.2. 设 $M$ 为光滑流形，$X, Y, Z$ 为 $\\mathfrak{X}(M)$ 中的向量场，$f, g$ 为 $C^{\\infty}(M)$\
  \ 中的函数。则：\n\n- (a) [Y, X] = −[X, Y]。\n- (b) [X + Y, Z] = [X, Z] + [Y, Z]。\n- (c)\
  \ [X, Y + Z] = [X, Y] + [X, Z]。\n- (d) [fX, gY] = fg[X, Y] + fX(g)Y − gY(f)X。\n\
  - (e) [X, [Y, Z]] + [Y, [Z, X]] + [Z, [X, Y]] = 0。 (Jacobi 恒等式)\n\n证明。 (a)–(d)：直接可得。\n\
  \n(e)：我们有\n\n[X, [Y, Z]] = X ∘ [Y, Z] − [Y, Z] ∘ X = X ∘ (Y ∘ Z − Z ∘ Y) − (Y ∘\
  \ Z − Z ∘ Y) ∘ X = X ∘ Y ∘ Z − X ∘ Z ∘ Y − Y ∘ Z ∘ X + Z ∘ Y ∘ X.\n\n同理，\n\n[Y,\
  \ [Z, X]] = Y ∘ Z ∘ X − Y ∘ X ∘ Z − Z ∘ X ∘ Y + X ∘ Z ∘ Y\n[Z, [X, Y]] = Z ∘ X ∘\
  \ Y − Z ∘ Y ∘ X − X ∘ Y ∘ Z + Y ∘ X ∘ Z.\n\n将恒等式相加即得结果。\n\n在第 15.1 节中已观察到 $\\mathfrak{X}(M)$\
  \ 是 $C^{\\infty}(M)$ 上的模。由定理 15.3.2 可知 $\\mathfrak{X}(M)$ 也是 $\\mathbb{R}$ 上的 Lie\
  \ 代数。\n\n## 定理 15.3.3. 设 $M$ 为光滑流形，$X, Y$ 为 $\\mathfrak{X}(M)$ 中的向量场，且在局部坐标下，\n\n\
  X = Σ_i α^i ∂/∂x^i    and    Y = Σ_j β^j ∂/∂x^j.\n\n则：\n\n(a)\n\n[X, Y] = Σ_j {\
  \ Σ_i (α^i ∂β^j/∂x^i - β^i ∂α^j/∂x^i) } ∂/∂x^j .\n\n(b)\n\n[ ∂/∂x^i , ∂/∂x^j ] =\
  \ 0\n\n对 i, j = 1, …, m。\n\n证明。 (a)：对 $C^{\\infty}(M)$ 中的函数 $f$，我们有\n\n(X ∘ Y)(f)\
  \ = X(Y(f)) = ( Σ_i α^i ∂/∂x^i ) ( Σ_j β^j ∂f/∂x^j ) = Σ_{ij} α^i ∂/∂x^i ( β^j ∂f/∂x^j\
  \ )\n\n= Σ_{ij} α^i ( ∂β^j/∂x^i ∂f/∂x^j + β^j ∂²f/∂x^i∂x^j )\n\n= ( Σ_{ij} α^i ∂β^j/∂x^i\
  \ ∂/∂x^j + Σ_{ij} α^i β^j ∂²/∂x^i∂x^j ) (f).\n\n由于 $f$ 是任意的，\n\nX ∘ Y = Σ_{ij} α^i\
  \ ∂β^j/∂x^i ∂/∂x^j + Σ_{ij} α^i β^j ∂²/∂x^i∂x^j .\n\n同理，\n\nY ∘ X = Σ_{ij} β^i ∂α^j/∂x^i\
  \ ∂/∂x^j + Σ_{ij} β^i α^j ∂²/∂x^i∂x^j .\n\n上述两个恒等式与定理 14.3.6 给出结果。\n\n(b)：由部分 (a)\
  \ 可得。\n\n## 15.4 余向量场\n\n设 $M$ 为光滑 $m$ 流形。$M$ 上的余向量场是映射 $\\omega$，它将每个点 $p \\in\
  \ M$ 赋予一个余向量 $\\omega_p \\in T_p^*(M)$。我们说 $\\omega$ 在 $p$ 处消失如果 $\\omega_p = 0$，在\
  \ $p$ 处非零如果 $\\omega_p \\neq 0$，并且在 $M$ 上处处非零如果它在每个 $p \\in M$ 处都非零。\n\n设 $X$ 为\
  \ $\\mathfrak{X}(M)$ 中的向量场，并令\n\nω(X) : M ⟶ ℝ\n\n为函数，定义为\n\nω(X)(p) = ω_p(X_p) \
  \   (15.4.1)\n\n对所有 $p \\in M$ 成立。我们说 $\\omega$ 是光滑的（在 $M$ 上）如果函数 $\\omega(X)$ 属于\
  \ $C^{\\infty}(M)$ 对所有 $\\mathfrak{X}(M)$ 中的向量场 $X$ 成立。光滑余向量场的集合\n\n## 例 15.4.1\
  \ ($\\mathbb{R}^m$).\n\n设 $(r^1,\\dots,r^m)$ 为 $\\mathbb{R}^m$ 上的标准坐标，$(d(r^1),\\\
  dots,d(r^m))$ 为相应的对偶坐标标架，称为标准对偶坐标标架，$(\\xi^1,\\dots,\\xi^m)$ 为对应于 $\\mathbb{R}^m$\
  \ 标准基的对偶基。由定理 14.5.7 可知 $(d(r^1),\\dots,d(r^m))$ 可与 $(\\xi^1,\\dots,\\xi^m)$ 识别，写为\n\
  \n$(d(r^1),\\dots,d(r^m)) = (\\xi^1,\\dots,\\xi^m).$\n\n接下来的三个结果是定理 15.1.2、定理 15.1.7\
  \ 和定理 15.1.8 的余向量场对应物。\n\n## 定理 15.4.2 (余向量场的光滑性判据).\n\n设 $M$ 为光滑流形，$\\omega$ 为\
  \ $M$ 上的（不一定光滑的）余向量场。则 $\\omega$ 属于 $\\mathfrak{X}^*(M)$ 当且仅当对 $M$ 上的每个坐标图 $(U,(x^i))$，$\\\
  omega$ 的分量属于 $C^\\infty(U)$。\n\n## 定理 15.4.3 (对偶坐标标架的变换).\n\n设 $M$ 为光滑 $m$ 流形，$(U,(x^i))$\
  \ 和 $(\\widetilde{U},(\\widetilde{x}^j))$ 为 $M$ 上重叠的坐标图，$\\mathcal{X}^* = (d(x^1),\\\
  dots,d(x^m))$ 和 $\\widetilde{\\mathcal{X}}^* = (d(\\widetilde{x}^1),\\dots,d(\\\
  widetilde{x}^m))$ 为相应的对偶坐标标架。则\n\n$d(x^j) = \\sum_i \\frac{\\partial x^j}{\\partial\
  \ \\widetilde{x}^i} d(\\widetilde{x}^i)$\n\n在 $U \\cap \\widetilde{U}$ 上对 $j = 1,\\\
  dots,m$ 成立。\n\n证明。这由定理 14.5.4(a) 可得。\n\n## 定理 15.4.4 (余向量的光滑延拓).\n\n设 $M$ 为光滑流形，$p$\
  \ 为 $M$ 中的点，$\\eta$ 为 $T_p^*(M)$ 中的余向量。则存在余向量场 $\\omega$ 属于 $\\mathfrak{X}^*(M)$\
  \ 使得 $\\omega_p = \\eta.$\n\n设 $M$ 为光滑流形，并定义映射\n\n$d : C^\\infty(M) \\longrightarrow\
  \ \\mathfrak{X}^*(M),$\n\n称为外微分，由\n\n$d(f)_p(v) = d_p(f)(v) = v(f)$  (15.4.4)\n\n\
  对所有 $C^\\infty(M)$ 中的函数 $f$、$M$ 中的点 $p$ 和 $T_p(M)$ 中的向量 $v$ 成立，其中第二个等式由定理 14.5.5\
  \ 可得。下一结果的部分 (a) 表明此定义是有意义的。\n\n## 定理 15.4.5.\n\n设 $M$ 为光滑流形，$f$ 为 $C^\\infty(M)$\
  \ 中的函数，$X$ 为 $\\mathfrak{X}(M)$ 中的向量场。则：\n\n- (a) $d(f)$ 是 $\\mathfrak{X}^*(M)$\
  \ 中的余向量场。\n- (b) $d(f)(X) = X(f)$。\n\n证明。 (b)：由定理 14.5.1，$d(f)_p$ 是 $T_p^*(M)$ 中的余向量，故\
  \ $d(f)$ 是余向量场。对 $M$ 中的点 $p$，我们有\n\n```\nd(f)(X)(p) = d(f)_p(X_p)    [(15.4.1)]\n\
  = X_p(f)                [(15.4.4)]\n= X(f)(p).              [(15.1.2)]\n```\n\n\
  由于 $p$ 是任意的，结果得证。\n\n(a)：由于 $X$ 和 $f$ 都是光滑的，根据定义，$X(f)$ 也是光滑的。因为 $X$ 是任意的，由部分 (b)\
  \ 可知，根据定义，$d(f)$ 是光滑的。\n\n## 定理 15.4.6. 设 $M$ 为光滑流形，$f, g$ 为 $C^\\infty(M)$ 中的函数，$c$\
  \ 为实数。则：\n\n- (a) d(cf + g) = c d(f) + d(g)。\n- (b) d(fg) = f d(g) + g d(f)。\n\n\
  证明。这由定理 14.5.6 和 (15.4.4) 可得。\n\n## 定理 15.4.7. 若 $M$ 为光滑流形且 $f$ 为 $C^\\infty(M)$\
  \ 中的函数，则在局部坐标下，\n\n```\nd(f) = Σ_i ∂f/∂x^i d(x^i).\n```\n\n证明。对 $M$ 中的点 $p$ 和 $T_p(M)$\
  \ 中的向量 $v$，我们有\n\n```\nd(f)_p(v) = d_p(f)(v)                     [(15.4.4)]\n= Σ_i\
  \ ∂f/∂x^i (p) d_p(x^i)(v)            [Th 14.5.3]\n= Σ_i ∂f/∂x^i (p) d(x^i)_p(v)\
  \            [(15.4.4)]\n= ( Σ_i ∂f/∂x^i d(x^i) |_p )(v).\n```\n\n由于 $p$ 和 $v$ 是任意的，结果得证。\n\
  \n## 15.5 余向量场的表示\n\n## 定理 15.5.1. 若 $M$ 为光滑流形且 $\\omega$ 为 $\\mathfrak{X}^*(M)$\
  \ 中的余向量场，则 $\\omega$ 是 $C^\\infty(M)$-线性的。即对所有 $\\mathfrak{X}(M)$ 中的向量场 $X, Y$ 和\
  \ $C^\\infty(M)$ 中的函数 $f$：\n\n- (a) ω(X + Y) = ω(X) + ω(Y)\n- (b) ω(f X) = f ω(X)。\n\
  \n\n\n\n证明。对于M中的一点p，我们有\n\n```\nω(X + Y)(p) = ω_p((X + Y)_p)    [(15.4.1)]\n= ω_p(X_p\
  \ + Y_p)\n= ω_p(X_p) + ω_p(Y_p)\n= ω(X)(p) + ω(Y)(p)    [(15.4.1)]\n= (ω(X) + ω(Y))(p)\n\
  ```\n\n并且\n\n```\nω(fX)(p) = ω_p((fX)_p)    [(15.4.1)]\n= ω_p(f(p)X_p)\n= f(p) ω_p(X_p)\n\
  = (f ω)_p(X_p)\n= (f ω(X))(p).    [(15.4.1)]\n```\n\n由于p是任意的，结论成立。\n\n按照第B.5节，我们用\n\
  \n```\nLin_{C^∞(M)}(\U0001D51B(M), C^∞(M))\n```\n\n表示从\U0001D51B(M)到C^∞(M)的所有C^∞(M)-线性映射构成的C^∞(M)-模。我们定义一个映射\n\
  \n```\n\U0001D520 : \U0001D51B*(M) ⟶ Lin_{C^∞(M)}(\U0001D51B(M), C^∞(M)),\n```\n\
  \n称为特征映射，其定义如下：\n\n```\n\U0001D520(ω)(X) = ω(X)    (15.5.1)\n```\n\n对所有\U0001D51B\
  *(M)中的余向量场ω和\U0001D51B(M)中的向量场X成立，其中(15.5.1)的右边由(15.4.1)给出。由定理15.5.1可知，\U0001D520\
  (ω)是Lin_{C^∞(M)}(\U0001D51B(M), C^∞(M))中的一个映射，因此该定义是有意义的。此时，\U0001D520(ω)只不过是从(15.4.1)的角度看待\U0001D51B\
  *(M)中余向量场ω的一种记号简写：它作为一种将向量场变为函数的机制。这种形式化的目的将在后续变得清晰。\n\n我们称一个ℝ-线性映射ℱ : \U0001D51B\
  (M) ⟶ C^∞(M)是逐点确定的，如果对于M中的所有点p，只要X、Ẋ是\U0001D51B(M)中满足X_p = Ẋ_p的向量场，就有ℱ(X)(p) = ℱ(Ẋ)(p)。由于ℱ(X)(p)\
  \ = ℱ(Ẋ)(p)等价于ℱ(X − Ẋ)(p) = 0，且X_p = Ẋ_p等价于(X − Ẋ)_p = 0，因此ℱ是逐点确定的当且仅当对于M中的每一点p，只要Y是\U0001D51B\
  (M)中满足Y_p = 0的向量场，就有ℱ(Y)(p) = 0。\n\n设ω是\U0001D51B*(M)中的一个余向量场，p是M中的一点，X是\U0001D51B\
  (M)中满足X_p = 0的向量场。由(15.4.1)和(15.5.1)可得\U0001D520(ω)(X)(p) = 0。因此，\U0001D520(ω)是Lin_{C^∞(M)}(\U0001D51B\
  (M), C^∞(M))中逐点确定的映射。值得注意的是，如下一个结果所示，Lin_{C^∞(M)}(\U0001D51B(M), C^∞(M))中的所有映射都具有这一性质。\n\
  \n## 15.5 余向量场的表示\n\n**定理 15.5.2.** 若$M$是光滑流形，且$\\mathfrak{Y}$是$\\operatorname{Lin}_{C^\\\
  infty(M)}(\\mathfrak{X}(M),C^\\infty(M))$中的一个映射，则$\\mathfrak{Y}$是逐点确定的。\n\n*证明.*\
  \ 设$p$是$M$中的一点，$X$是$\\mathfrak{X}(M)$中满足$X_p=0$的向量场。我们需要证明$\\mathfrak{Y}(X)(p)=0$。这里只考虑$M$被单个坐标卡$(M,(x^i))$覆盖的情形。在局部坐标下，设$X=\\\
  sum_i\\alpha^i(\\partial/\\partial x^i)$。这给出了$X$在整个$M$上的表达式，因此我们可以对$X$应用$\\mathfrak{Y}$得到\n\
  \n$$\\mathfrak{Y}(X)=\\sum_i\\alpha^i\\mathfrak{Y}\\left(\\frac{\\partial}{\\partial\
  \ x^i}\\right),$$\n\n因此\n\n$$\\mathfrak{Y}(X)(p)=\\sum_i\\alpha^i(p)\\,\\mathfrak{Y}\\\
  left(\\frac{\\partial}{\\partial x^i}\\right)(p).$$\n\n由于$X_p=0$，可得每个$\\alpha^i(p)=0$，因此$\\\
  mathfrak{Y}(X)(p)=0$。\n\n**定理 15.5.3（余向量场特征定理）.** 若$M$是光滑流形，则$\\mathfrak{C}$是一个$C^\\\
  infty(M)$-模同构：\n\n$$\\mathfrak{X}^*(M)\\cong\\operatorname{Lin}_{C^\\infty(M)}(\\\
  mathfrak{X}(M),C^\\infty(M)).$$\n\n*证明.* 容易证明$\\mathfrak{C}$是$C^\\infty(M)$-模同态。我们需要证明$\\\
  mathfrak{C}$是双射。\n\n*单射性.* 假设存在$\\mathfrak{X}^*(M)$中的余向量场$\\omega$使得$\\mathfrak{C}(\\\
  omega)=0$。由(15.5.1)可知，对所有$\\mathfrak{X}(M)$中的向量场$X$，有$\\omega(X)=0$。设$p$是$M$中的一点，$v$是$T_p(M)$中的一个向量。根据定理15.1.2，存在$\\\
  mathfrak{X}(M)$中的向量场$Y$使得$Y_p=v$。于是$\\omega(Y)=0$，所以(15.4.1)给出\n\n$$\\omega_p(v)=\\\
  omega_p(Y_p)=\\omega(Y)(p)=0.$$\n\n由于$p$和$v$是任意的，所以$\\omega=0$。因此，$\\ker(\\mathfrak{C})=\\\
  {0\\}$。根据定理B.5.3，$\\mathfrak{C}$是单射。\n\n*满射性.* 设$\\mathfrak{Y}$是$\\operatorname{Lin}_{C^\\\
  infty(M)}(\\mathfrak{X}(M),C^\\infty(M))$中的一个映射。我们需要找到一个$\\mathfrak{X}^*(M)$中的余向量场$\\\
  widetilde{\\mathfrak{Y}}$，使得$\\mathfrak{C}(\\widetilde{\\mathfrak{Y}})=\\mathfrak{Y}$。设$p$是$M$中的一点，定义映射$\\\
  widetilde{\\mathfrak{Y}}_p:T_p(M)\\longrightarrow\\mathbb{R}$如下：\n\n$$\\widetilde{\\\
  mathfrak{Y}}_p(v)=\\mathfrak{Y}(X)(p) \\tag{15.5.2}$$\n\n对所有$T_p(M)$中的向量$v$成立，其中$X$是$\\\
  mathfrak{X}(M)$中满足$X_p=v$的任意向量场。根据定理15.1.2，这样的向量场总是存在的。由定理15.5.2可知，$\\widetilde{\\\
  mathfrak{Y}}_p$不依赖于$X$的选择，因此$\\widetilde{\\mathfrak{Y}}_p$是良定义的。设$w$是$T_p(M)$中的一个向量，$Y$是$\\\
  mathfrak{X}(M)$中满足$Y_p=w$的向量场，$c$是一个实数。则$cX+Y$是$\\mathfrak{X}(M)$中的向量场，且\n\n$$(cX+Y)_p=cX_p+Y_p=cv+w,$$\n\
  \n因此\n\\widetilde{\\mathfrak{Y}}_p(cv + w) = \\mathfrak{Y}(cX + Y)(p) \\quad [(15.5.2)]\n\
  = c\\mathfrak{Y}(X)(p) + \\mathfrak{Y}(Y)(p)\n= c\\widetilde{\\mathfrak{Y}}_p(v)\
  \ + \\widetilde{\\mathfrak{Y}}_p(w), \\quad [(15.5.2)]\n\n所以\\widetilde{\\mathfrak{Y}}_p是线性的。因此，\\\
  widetilde{\\mathfrak{Y}}_p是T_p^*(M)中的一个余向量。我们通过赋值p \\longmapsto \\widetilde{\\mathfrak{Y}}_p在M上定义一个余向量场\\\
  widetilde{\\mathfrak{Y}}。我们断言\\widetilde{\\mathfrak{Y}}是光滑的；也就是说，对所有\\mathfrak{X}(M)中的向量场Z，函数\\\
  widetilde{\\mathfrak{Y}}(Z)是光滑的。由(15.4.1)和(15.5.2)，\n\n\\widetilde{\\mathfrak{Y}}(Z)(p)\
  \ = \\widetilde{\\mathfrak{Y}}_p(Z_p) = \\mathfrak{Y}(Z)(p)\n\n对所有M中的p成立，因此\n\\\
  widetilde{\\mathfrak{Y}}(Z) = \\mathfrak{Y}(Z). \\quad (15.5.3)\n\n由于\\mathfrak{Y}在Lin_{C^\\\
  infty(M)}(\\mathfrak{X}(M), C^\\infty(M))中且Z在\\mathfrak{X}(M)中，根据定义，\\mathfrak{Y}(Z)是光滑函数，因此\\\
  widetilde{\\mathfrak{Y}}(Z)也是光滑的。这证明了上述断言。由(15.5.1)和(15.5.3)可得\\mathfrak{C}(\\widetilde{\\\
  mathfrak{Y}})(Z) = \\mathfrak{Y}(Z)。由于Z是任意的，所以\\mathfrak{C}(\\widetilde{\\mathfrak{Y}})\
  \ = \\mathfrak{Y}。因此，\\mathfrak{C}是满射。\n\n将定理15.5.3证明的某个方面单独提出来是有益的。设\\mathfrak{Y}是Lin_{C^\\\
  infty(M)}(\\mathfrak{X}(M), C^\\infty(M))中的一个映射。我们证明了\\mathfrak{C}^{-1}(\\mathfrak{Y})是\\\
  mathfrak{X}^*(M)中的余向量场，其定义为\n\\mathfrak{C}^{-1}(\\mathfrak{Y})_p(v) = \\mathfrak{Y}(X)(p)\
  \ \\quad (15.5.4)\n\n对所有M中的点p和T_p(M)中的向量v成立，其中X是\\mathfrak{X}(M)中满足X_p = v的任意向量场，其存在性由定理15.1.2保证。\n\
  \n现在我们有了定理15.5.3，通常（但并不总是）将\\mathfrak{X}^*(M)视为由所有从\\mathfrak{X}(M)到C^\\infty(M)的C^\\\
  infty(M)-线性映射构成的\\mathbb{R}上的向量空间和C^\\infty(M)上的模。我们将在15.7节看到定理15.5.3的一个重要推广。\n\n\
  ## 15.6 张量场\n\n本节中，我们推广15.4节的部分内容。\n\n设M是光滑m-流形，r, s ≥ 0是整数。M上的一个(r,s)-张量场是一个映射\\\
  mathcal{A}，它为M中的每一点p指定T_s^r(T_p(M))中的一个(r,s)-张量\\mathcal{A}_p。我们也称\\mathcal{A}为r-反变-s-协变张量场，或简称为张量场，并定义\\\
  mathcal{A}的秩为(r,s)。当s = 0时，\\mathcal{A}被称为r-反变张量场，或简称反变张量场；当r = 0时，\\mathcal{A}被称为s-协变张量场，或简称为协变张量场。\n\
  \n设\\omega^1, ..., \\omega^r是\\mathfrak{X}^*(M)中的余向量场，X_1, ..., X_s是\\mathfrak{X}(M)中的向量场，并考虑函数\n\
  \\mathcal{A}(\\omega^1, ..., \\omega^r, X_1, ..., X_s) : M \\longrightarrow \\mathbb{R}\n\
  \n其定义为\n\n\\[\n\\mathcal{A}(\\omega^1,\\ldots,\\omega^r,X_1,\\ldots,X_s)(p)=\\mathcal{A}_p(\\\
  omega^1|_p,\\ldots,\\omega^r|_p,X_1|_p,\\ldots,X_s|_p)\n\\tag{15.6.1}\n\\]\n\n对所有$M$中的$p$成立。我们说$\\\
  mathcal{A}$是**光滑的（在$M$上）**，如果函数$\\mathcal{A}(\\omega^1,\\ldots,\\omega^r,X_1,\\\
  ldots,X_s)$对所有$\\mathfrak{X}^*(M)$中的余向量场$\\omega^1,\\ldots,\\omega^r$和所有$\\mathfrak{X}(M)$中的向量场$X_1,\\\
  ldots,X_s$都属于$C^\\infty(M)$。$M$上光滑$(r,s)$-张量场的集合记为$\\mathcal{T}^r_s(M)$。特别地，\n\n\
  \\[\n\\mathcal{T}^0_1(M)=\\mathfrak{X}^*(M) \\qquad\\text{and}\\qquad \\mathcal{T}^1_0(M)=\\\
  mathfrak{X}(M).\n\\tag{15.6.2}\n\\]\n\n为完整起见，我们定义\n\n\\[\n\\mathcal{T}^0_0(M)=C^\\\
  infty(M).\n\\tag{15.6.3}\n\\]\n\n将恒等式(15.6.2)和(15.6.3)与恒等式(5.1.1)和(5.1.2)进行比较是有益的。从现在起，我们避免以下平凡情形。\n\
  \n> **除非另有说明，下文始终假设$(r,s)\\ne(0,0)$。**\n\n以类似于向量场和余向量场的方式在$\\mathcal{T}^r_s(M)$上定义运算，我们使$\\\
  mathcal{T}^r_s(M)$成为$\\mathbb{R}$上的向量空间和$C^\\infty(M)$上的模。\n\n为光滑流形引入的许多定义都以逐点的方式表述（不要与“逐点确定”混淆），并最终依赖于在向量空间背景下给出的早期定义。例如，光滑流形上的张量场本质上是一族张量，每个张量对应光滑流形中的一个点。逐点方法的一个重要结果是，为向量空间给出的早期定理可以直接推广到光滑流形。我们将所得的光滑流形定理称为早期向量空间定理的**流形版本**（缩写为**mv**）。下面是一个例子。\n\
  \n**定理 15.6.1.**\n\n*设$M$是光滑流形，设$\\mathcal{A},\\mathcal{A}_1,\\mathcal{A}_2$、$\\\
  mathcal{B},\\mathcal{B}_1,\\mathcal{B}_2$和$\\mathcal{C}$分别是$\\mathcal{T}^r_s(M)$、$\\\
  mathcal{T}^{r'}_{s'}(M)$和$\\mathcal{T}^{r''}_{s''}(M)$中的张量场，并设$f$是$C^\\infty(M)$中的函数。则：*\n\
  \n(a) $(\\mathcal{A}_1+\\mathcal{A}_2)\\otimes\\mathcal{B}=\\mathcal{A}_1\\otimes\\\
  mathcal{B}+\\mathcal{A}_2\\otimes\\mathcal{B}$.\n\n(b) $\\mathcal{A}\\otimes(\\\
  mathcal{B}_1+\\mathcal{B}_2)=\\mathcal{A}\\otimes\\mathcal{B}_1+\\mathcal{A}\\otimes\\\
  mathcal{B}_2$.\n\n(c) $(f\\mathcal{A})\\otimes\\mathcal{B}=f(\\mathcal{A}\\otimes\\\
  mathcal{B})=\\mathcal{A}\\otimes(f\\mathcal{B})$.\n\n(d) $(\\mathcal{A}\\otimes\\\
  mathcal{B})\\otimes\\mathcal{C}=\\mathcal{A}\\otimes(\\mathcal{B}\\otimes\\mathcal{C})$.\n\
  \n*证明.* 这是定理5.1.2的流形版本。\n\n设$M$是光滑$m$-流形，$(U,(x^i))$是$M$上的一个坐标卡。设$1\\le i_1,\\ldots,i_r\\\
  le m$和$1\\le j_1,\\ldots,j_s\\le m$是整数，并考虑张量场\n\n\\[\n\\frac{\\partial}{\\partial\
  \ x^{i_1}}\\otimes\\cdots\\otimes\\frac{\\partial}{\\partial x^{i_r}}\\otimes d(x^{j_1})\\\
  otimes\\cdots\\otimes d(x^{j_s})\n\\qquad\\text{in}\\qquad \\mathcal{T}^r_s(U)\n\
  \\]\n\n\n由如下对应关系定义\n\n$$p\\longmapsto \\left.\\frac{\\partial}{\\partial x^{i_1}}\\\
  right|_p\\otimes\\cdots\\otimes\\left.\\frac{\\partial}{\\partial x^{i_r}}\\right|_p\\\
  otimes d_p(x^{j_1})\\otimes\\cdots\\otimes d_p(x^{j_s})$$\n\n对所有 $p\\in U$ 成立。设\
  \ $\\mathcal A$ 是 $M$ 上的（未必光滑的）$(r,s)$ 型张量场。则 $\\mathcal A|_U$ 可表示为\n\n$$\\mathcal\
  \ A|_U=\\sum_{\\substack{1\\le i_1,\\ldots,i_r\\le m\\\\1\\le j_1,\\ldots,j_s\\\
  le m}}\\mathcal A^{i_1\\ldots i_r}_{j_1\\ldots j_s}\\frac{\\partial}{\\partial x^{i_1}}\\\
  otimes\\cdots\\otimes\\frac{\\partial}{\\partial x^{i_r}}\\otimes d(x^{j_1})\\otimes\\\
  cdots\\otimes d(x^{j_s}),\\quad (15.6.4)$$\n\n其中 $\\mathcal A^{i_1\\ldots i_r}_{j_1\\\
  ldots j_s}$ 是 $U$ 上唯一确定的函数，称为 $\\mathcal A$ 关于 $(U,(x^i))$ 的**分量**。为简洁起见，我们将\n\n\
  $$\\mathcal A|_U\\quad\\text{记为}\\quad\\mathcal A.$$\n\n称 (15.6.4) 的右端为 $\\mathcal\
  \ A$ 关于 $(U,(x^i))$ 的**局部坐标**表示。\n\n## 定理 15.6.2（$(r,s)$ 型张量场的光滑性判别法）. 在上述设定下，$\\\
  mathcal A\\in T^r_s(M)$ 当且仅当对 $M$ 上的每个坐标卡 $(U,(x^i))$，$\\mathcal A$ 的分量都属于 $C^\\\
  infty(U)$。\n\n## 定理 15.6.3（坐标架的变换）. 设 $M$ 是一个光滑 $m$ 维流形，$\\mathcal A$ 是 $T^r_s(M)$\
  \ 中的张量场，$(U,(x^i))$ 与 $(\\widetilde U,(\\widetilde x^i))$ 是 $M$ 上相互重叠的坐标卡，并设 $\\\
  mathcal A^{i_1\\ldots i_r}_{j_1\\ldots j_s}$ 与 $\\widetilde{\\mathcal A}^{i_1\\\
  ldots i_r}_{j_1\\ldots j_s}$ 分别是 $\\mathcal A$ 关于 $(U,(x^i))$ 和 $(\\widetilde U,(\\\
  widetilde x^i))$ 的分量。则在 $U\\cap\\widetilde U$ 上有\n\n$$\\widetilde{\\mathcal A}^{i_1\\\
  ldots i_r}_{j_1\\ldots j_s}=\\sum_{\\substack{1\\le k_1,\\ldots,k_r\\le m\\\\1\\\
  le l_1,\\ldots,l_s\\le m}}\\frac{\\partial\\widetilde x^{i_1}}{\\partial x^{k_1}}\\\
  cdots\\frac{\\partial\\widetilde x^{i_r}}{\\partial x^{k_r}}\\frac{\\partial x^{l_1}}{\\\
  partial\\widetilde x^{j_1}}\\cdots\\frac{\\partial x^{l_s}}{\\partial\\widetilde\
  \ x^{j_s}}\\mathcal A^{k_1\\ldots k_r}_{l_1\\ldots l_s}$$\n\n*证明.* 这是定理 5.1.4 的流形版本，但详细推导仍具有启发意义。由定理\
  \ 15.1.8 和定理 15.4.3，有\n\n\\[\n\\widetilde{\\mathcal A}^{\\widetilde{i}_1\\cdots\\\
  widetilde{i}_r}_{\\widetilde{j}_1\\cdots\\widetilde{j}_s}\n=\\mathcal A\\left(d(\\\
  widetilde{x}^{i_1}),\\ldots,d(\\widetilde{x}^{i_r}),\\frac{\\partial}{\\partial\\\
  widetilde{x}^{j_1}},\\ldots,\\frac{\\partial}{\\partial\\widetilde{x}^{j_s}}\\right)\n\
  \\]\n\n\\[\n=\\mathcal A\\left(\\sum_{k_1}\\frac{\\partial\\widetilde{x}^{i_1}}{\\\
  partial x^{k_1}}d(x^{k_1}),\\ldots,\\sum_{k_r}\\frac{\\partial\\widetilde{x}^{i_r}}{\\\
  partial x^{k_r}}d(x^{k_r}),\\sum_{l_1}\\frac{\\partial x^{l_1}}{\\partial\\widetilde{x}^{j_1}}\\\
  frac{\\partial}{\\partial x^{l_1}},\\ldots,\\sum_{l_s}\\frac{\\partial x^{l_s}}{\\\
  partial\\widetilde{x}^{j_s}}\\frac{\\partial}{\\partial x^{l_s}}\\right)\n\\]\n\n\
  \\[\n=\\sum_{\\substack{1\\le k_1,\\ldots,k_r\\le m\\\\1\\le l_1,\\ldots,l_s\\le\
  \ m}}\n\\frac{\\partial\\widetilde{x}^{i_1}}{\\partial x^{k_1}}\\cdots\\frac{\\\
  partial\\widetilde{x}^{i_r}}{\\partial x^{k_r}}\n\\frac{\\partial x^{l_1}}{\\partial\\\
  widetilde{x}^{j_1}}\\cdots\\frac{\\partial x^{l_s}}{\\partial\\widetilde{x}^{j_s}}\n\
  \\cdot\\mathcal A\\left(d(x^{k_1}),\\ldots,d(x^{k_r}),\\frac{\\partial}{\\partial\
  \ x^{l_1}},\\ldots,\\frac{\\partial}{\\partial x^{l_s}}\\right)\n\\]\n\n\\[\n=\\\
  sum_{\\substack{1\\le k_1,\\ldots,k_r\\le m\\\\1\\le l_1,\\ldots,l_s\\le m}}\n\\\
  frac{\\partial\\widetilde{x}^{i_1}}{\\partial x^{k_1}}\\cdots\\frac{\\partial\\\
  widetilde{x}^{i_r}}{\\partial x^{k_r}}\n\\frac{\\partial x^{l_1}}{\\partial\\widetilde{x}^{j_1}}\\\
  cdots\\frac{\\partial x^{l_s}}{\\partial\\widetilde{x}^{j_s}}\n\\mathcal A^{k_1\\\
  cdots k_r}_{l_1\\cdots l_s}.\n\\]\n\n## 15.7 张量场的表示\n\n本节我们给出第 15.5 节中定义与结果的推广。\n\
  \n设 $M$ 是光滑流形，$r,s\\ge 0$ 是整数。沿用第 15.5 节的记号，用 $\\operatorname{Mult}_{C^\\infty(M)}(\\\
  mathfrak X^*(M)^r\\times\\mathfrak X(M)^s,C^\\infty(M))$ 表示从 $\\mathfrak X^*(M)^r\\\
  times\\mathfrak X(M)^s$ 到 $C^\\infty(M)$ 的 $C^\\infty(M)$-多重线性映射所构成的 $C^\\infty(M)$-模。定义映射\n\
  \n$\\mathcal C_s^r:T_s^r(M)\\longrightarrow\\operatorname{Mult}_{C^\\infty(M)}(\\\
  mathfrak X^*(M)^r\\times\\mathfrak X(M)^s,C^\\infty(M)),$\n\n称为**特征映射**，如下：\n\n\\\
  [\n\\mathcal C_s^r(\\mathcal A)(\\omega^1,\\ldots,\\omega^r,X_1,\\ldots,X_s)=\\\
  mathcal A(\\omega^1,\\ldots,\\omega^r,X_1,\\ldots,X_s) \\tag{15.7.1}\n\\]\n\n对所有张量场\
  \ $\\mathcal A\\in T_s^r(M)$、所有余向量场 $\\omega^1,\\ldots,\\omega^r\\in\\mathfrak X^*(M)$\
  \ 以及所有向量场 $X_1,\\ldots,X_s\\in\\mathfrak X(M)$ 成立，其中 (15.7.1) 的右端由 (15.6.1) 给出。由定理\
  \ 15.5.1 的推广可知 $\\mathcal C_s^r(\\mathcal A)$ 属于 $\\operatorname{Mult}_{C^\\infty(M)}(\\\
  mathfrak X^*(M)^r\\times\\mathfrak X(M)^s,C^\\infty(M))$，因此该定义是合理的。\n\n称一个 $\\mathbb\
  \ R$-线性映射 $\\mathcal F:\\mathfrak X^*(M)^r\\times\\mathfrak X(M)^s\\longrightarrow\
  \ C^\\infty(M)$ 是**逐点确定的**，如果对 $M$ 中所有点 $p$，有\n\n\\[\n\\mathcal F(\\omega^1,\\ldots,\\\
  omega^r,X_1,\\ldots,X_s)(p)=\\mathcal F(\\widetilde\\omega^1,\\ldots,\\widetilde\\\
  omega^r,\\widetilde X_1,\\ldots,\\widetilde X_s)(p)\n\\]\n\n只要 $\\omega^i,\\widetilde\\\
  omega^i$ 是 $\\mathfrak X^*(M)$ 中的余向量场，且对 $i=1,\\ldots,r$ 有 $\\omega^i|_p=\\widetilde\\\
  omega^i|_p$；$X_j,\\widetilde X_j$ 是 $\\mathfrak X(M)$ 中的向量场，且对 $j=1,\\ldots,s$ 有\
  \ $X_j|_p=\\widetilde X_j|_p$。\n\n## 定理 15.7.1. 若 $M$ 是光滑流形，且 $\\Upsilon$ 是 $\\\
  operatorname{Mult}_{C^\\infty(M)}(\\mathfrak X^*(M)^r\\times\\mathfrak X(M)^s,C^\\\
  infty(M))$ 中的映射，则 $\\Upsilon$ 是逐点确定的。\n\n## 定理 15.7.2（张量场特征定理）. 若 $M$ 是光滑流形，则 $\\\
  mathfrak c_s^r$ 是一个 $C^\\infty(M)$-模同构：\n\n\\[\n\\mathcal T_s^r(M)\\approx\\operatorname{Mult}_{C^\\\
  infty(M)}(\\mathfrak X^*(M)^r\\times\\mathfrak X(M)^s,C^\\infty(M)).\n\\]\n\n设 $\\\
  Upsilon$ 是 $\\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak X^*(M)^r\\times\\mathfrak\
  \ X(M)^s,C^\\infty(M))$ 中的映射。类似于 (15.5.4)，$(\\mathfrak c_s^r)^{-1}(\\Upsilon)$ 是\
  \ $\\mathcal T_s^r(M)$ 中的张量场，由下式定义：\n\n\\[\n(\\mathfrak c_s^r)^{-1}(\\Upsilon)_p(\\\
  eta^1,\\ldots,\\eta^r,v_1,\\ldots,v_s)=\\Upsilon(\\omega^1,\\ldots,\\omega^r,X_1,\\\
  ldots,X_s)(p) \\tag{15.7.2}\n\\]\n\n对 $M$ 中所有点 $p$、$T_p^*(M)$ 中所有余向量 $\\eta^1,\\\
  ldots,\\eta^r$ 以及 $T_p(M)$ 中所有向量 $v_1,\\ldots,v_s$ 成立，其中 $\\omega^1,\\ldots,\\omega^r$\
  \ 是 $\\mathfrak X^*(M)$ 中满足 $\\omega^i|_p=\\eta^i$（$i=1,\\ldots,r$）的任意余向量场，$X_1,\\\
  ldots,X_s$ 是 $\\mathfrak X(M)$ 中满足 $X_j|_p=v_j$（$j=1,\\ldots,s$）的任意向量场。\n\n在本节的其余部分，我们试图将上述技术性内容置于更大的背景中。\n\
  \n设 $\\mathcal A$ 是 $\\mathcal T_s^r(M)$ 中的张量场。对 $M$ 中给定的点 $p$，$\\mathcal A_p$ 是\
  \ $\\mathcal T_s^r(T_p(M))$ 中的一个张量；对于给定的余向量 $\\eta^1,\\ldots,\\eta^r\\in T_p^*(M)$\
  \ 和向量 $v_1,\\ldots,v_s\\in T_p(M)$，$\\mathcal A_p(\\eta^1,\\ldots,\\eta^r,v_1,\\\
  ldots,v_s)$ 是它在 $\\mathbb R$ 中的值。利用定理 15.7.2 中的同构进行等同后，$\\mathcal A$ 现在可以看作 $\\\
  operatorname{Mult}_{C^\\infty(M)}(\\mathfrak X^*(M)^r\\times\\mathfrak X(M)^s,C^\\\
  infty(M))$ 中的一个映射。对于给定的余向量场 $\\omega^1,\\ldots,\\omega^r\\in\\mathfrak X^*(M)$ 和向量场\
  \ $X_1,\\ldots,X_s\\in\\mathfrak X(M)$，$\\mathcal A(\\omega^1,\\ldots,\\omega^r,X_1,\\\
  ldots,X_s)$ 是 $C^\\infty(M)$ 中的一个函数；对于给定的点 $p\\in M$，$\\mathcal A(\\omega^1,\\ldots,\\\
  omega^r,X_1,\\ldots,X_s)(p)$ 是它在 $\\mathbb R$ 中的值。定理 15.7.2 引入的创新在于：我们已经从在余向量和向量处求张量\
  \ $\\mathcal A_p$ 的值，转变为在微分形式和向量场处求函数 $\\mathcal A$ 的值。\n\n现在我们已经掌握了定理 15.7.2，因此我们通常（但并非总是）将\
  \ $\\mathcal T_s^r(M)$ 看作由所有从 $\\mathfrak X^*(M)^r\\times\\mathfrak X(M)^s$ 到 $C^\\\
  infty(M)$ 的 $C^\\infty(M)$-多重线性映射组成的 $\\mathbb R$-向量空间和 $C^\\infty(M)$-模。我们不会过于拘泥于记号中是否包含“$\\\
  mathfrak c_s^r$”，而是让上下文来表明具体含义，由此获得一种令人欢迎的记号简化。\n\n我们处理张量场的这一新方法的一个优点是，它提供了一种判定机制，可以判断给定映射\
  \ $\\mathcal F:\\mathfrak X^*(M)^r\\times\\mathfrak X(M)^s\\longrightarrow C^\\\
  infty(M)$ 是否是（或至少可等同于）$\\mathcal T_s^r(M)$ 中的张量场。根据定理 15.7.2，只要 $\\mathcal F$ 能被证明是\
  \ $C^\\infty(M)$-多重线性的，就可以进行这种等同。在实践中，判断 $\\mathcal F$ 是否可加通常是直接的。难点通常在于判断 $C^\\\
  infty(M)$ 中的函数能否从 $\\mathcal F$ 中“提出来”。也就是说，若对所有余向量场 $\\omega^1,\\ldots,\\omega^r\\\
  in\\mathfrak X^*(M)$、所有向量场 $X_1,\\ldots,X_s\\in\\mathfrak X(M)$ 以及所有函数 $f\\in C^\\\
  infty(M)$，都有\n\n\\[\n\\mathcal F(\\omega^1,\\ldots,f\\omega^i,\\ldots,\\omega^r,X_1,\\\
  ldots,X_s)=f\\,\\mathcal F(\\omega^1,\\ldots,\\omega^i,\\ldots,\\omega^r,X_1,\\\
  ldots,X_s).\n\\]\n\n\n对于 \\(i=1,\\ldots,r\\)，并且\n\n\\[\n\\mathcal{F}(\\omega^1,\\\
  ldots,\\omega^r,X_1,\\ldots,fX_j,\\ldots,X_s)=f\\mathcal{F}(\\omega^1,\\ldots,\\\
  omega^r,X_1,\\ldots,X_j,\\ldots,X_s)\n\\]\n\n对于 \\(j=1,\\ldots,s\\)。在后续章节中，我们会遇到此类计算的若干例子。\n\
  \n在本节结束时，让我们就“表示”作几点说明。在 15.2 节中，我们说明了 \\(\\mathfrak{X}(M)\\) 中的一个向量场等价于从 \\(C^\\\
  infty(M)\\) 到 \\(C^\\infty(M)\\) 的一类映射。在 15.5 节中，我们证明了 \\(\\mathfrak{X}^*(M)\\)\
  \ 中的一个向量场等价于从 \\(\\mathfrak{X}(M)\\) 到 \\(C^\\infty(M)\\) 的一类映射。在本节中，我们说明了（或至少断言）\\\
  (\\mathcal{T}^r_s(M)\\) 中的一个张量场等价于从 \\(\\mathfrak{X}^*(M)^r\\times\\mathfrak{X}(M)^s\\\
  ) 到 \\(C^\\infty(M)\\) 的一类映射。粗略地说，我们一直在进行一项将“场”表示为生成“函数”的映射的工作。\n\n## 15.8 微分形式\n\
  \n设 \\(M\\) 是一个光滑 \\(m\\)-流形，令 \\(0\\le s\\le m\\) 是一个整数。**\\(M\\) 上的微分 \\(s\\)-形式**是一个映射\
  \ \\(\\omega\\)，它给 \\(M\\) 中的每个点 \\(p\\) 指派 \\(\\Lambda^s(T_p(M))\\) 中的一个 \\(s\\\
  )-余向量 \\(\\omega_p\\)。在文献中，微分 \\(s\\)-形式通常被称为 **\\(s\\)-形式** 或简称为 **形式**。注意，1-形式与余向量场是同一个概念。设\
  \ \\(X_1,\\ldots,X_s\\) 是 \\(\\mathfrak{X}(M)\\) 中的向量场，并定义一个函数\n\n\\[\n\\omega(X_1,\\\
  ldots,X_s):M\\longrightarrow\\mathbb{R}\n\\]\n\n如下：\n\n\\[\n\\omega(X_1,\\ldots,X_s)(p)=\\\
  omega_p(X_1|_p,\\ldots,X_s|_p)\n\\]\n\n其中 \\(p\\) 取遍 \\(M\\) 中的所有点。我们说 \\(\\omega\\\
  ) 是 **在 \\(M\\) 上光滑** 的，如果对于 \\(\\mathfrak{X}(M)\\) 中的所有向量场 \\(X_1,\\ldots,X_s\\\
  )，函数 \\(\\omega(X_1,\\ldots,X_s)\\) 都在 \\(C^\\infty(M)\\) 中。\\(M\\) 上光滑 \\(s\\)-形式的集合记为\
  \ \\(\\Lambda^s(M)\\)。显然，\\(\\Lambda^s(M)\\) 是 \\(\\mathcal{T}^0_s(M)\\) 的一个 \\\
  (\\mathbb{R}\\)-子空间和 \\(C^\\infty(M)\\)-子模，并且\n\n\\[\n\\Lambda^1(M)=\\mathfrak{X}^*(M)=\\\
  mathcal{T}^0_1(M). \\tag{15.8.1}\n\\]\n\n为完整起见，并且为了与 (15.6.3) 保持一致，我们定义\n\n\\[\n\
  \\Lambda^0(M)=C^\\infty(M). \\tag{15.8.2}\n\\]\n\n根据定理 7.2.12(b)，当 \\(s>m\\) 时，我们令\
  \ \\(\\Lambda^s(M)=\\{0\\}\\)。\n\n设 \\(\\omega\\) 和 \\(\\xi\\) 分别是 \\(\\Lambda^s(M)\\\
  ) 和 \\(\\Lambda^{s'}(M)\\) 中的形式。我们定义一个 \\(\\Lambda^{s+s'}(M)\\) 中的形式 \\(\\omega\\\
  wedge\\xi\\)，称为 \\(\\omega\\) 和 \\(\\xi\\) 的**楔积**，定义为\n\n\\[\n(\\omega\\wedge\\\
  xi)_p=\\omega_p\\wedge\\xi_p\n\\]\n\n其中 \\(p\\) 取遍 \\(M\\) 中的所有点。特别地，对于 \\(C^\\\
  infty(M)=\\Lambda^0(M)\\) 中的函数 \\(f\\)，有\n\n\\[\nf\\wedge\\omega=f\\omega. \\tag{15.8.3}\n\
  \\]\n\n设 \\((U,(x^i))\\) 是 \\(M\\) 上的一个坐标卡，令 \\(1\\le i_1<\\cdots<i_s\\le m\\) 是整数，并令\n\
  \n\\[\nd(x^{i_1})\\wedge\\cdots\\wedge d(x^{i_s}):U\\longrightarrow \\Lambda^s(U)\n\
  \\]\n\n为根据对应关系\n\n\\[\np\\longmapsto d_p(x^{i_1})\\wedge\\cdots\\wedge d_p(x^{i_s})\n\
  \\]\n\n定义的映射，其中 \\(p\\) 取遍 \\(U\\) 中的所有点。设 \\(\\omega\\) 是 \\(\\Lambda^s(M)\\) 中的一个形式。那么\
  \ \\(\\omega|_U\\) 可以表示为\n\n\\[\n\\omega|_U=\\sum_{1\\le i_1<\\cdots<i_s\\le m}\\\
  alpha_{i_1,\\ldots,i_s}\\,d(x^{i_1})\\wedge\\cdots\\wedge d(x^{i_s}),\\tag{15.8.4}\n\
  \\]\n\n其中 \\(\\alpha_{i_1,\\ldots,i_s}\\) 是 \\(C^\\infty(U)\\) 中唯一确定的函数，称为 \\(\\\
  omega\\) 关于 \\((U,(x^i))\\) 的**分量**。为简洁起见，我们用 \\(\\omega\\) 表示 \\(\\omega|_U\\)。\n\
  \n(15.8.4) 的右端称为在 **局部坐标** 下关于 \\((U,(x^i))\\) 表达 \\(\\omega\\)。\n\n**定理 15.8.1.**\
  \ 设 \\(M\\) 是一个光滑流形，设 \\(\\omega,\\omega^1,\\omega^2\\) 和 \\(\\xi,\\xi^1,\\xi^2\\\
  ) 分别是 \\(\\Lambda^s(M)\\) 和 \\(\\Lambda^{s'}(M)\\) 中的形式，并设 \\(f\\) 是 \\(C^\\infty(M)\\\
  ) 中的一个函数。则：\n\n- (a) \\((\\omega^1+\\omega^2)\\wedge\\xi=\\omega^1\\wedge\\xi+\\\
  omega^2\\wedge\\xi.\\)\n- (b) \\(\\omega\\wedge(\\xi^1+\\xi^2)=\\omega\\wedge\\\
  xi^1+\\omega\\wedge\\xi^2.\\)\n- (c) \\((f\\omega)\\wedge\\xi=f(\\omega\\wedge\\\
  xi)=\\omega\\wedge(f\\xi)\\)。\n\n*证明.* 这是定理 7.2.2 的流形版本。\n\n**定理 15.8.2.** 设 \\\
  (M\\) 是一个光滑流形，设 \\(\\omega\\) 和 \\(\\xi\\) 分别是 \\(\\Lambda^s(M)\\) 和 \\(\\Lambda^{s'}(M)\\\
  ) 中的形式。则：\n\n- (a) \\(\\omega\\wedge\\xi=(-1)^{ss'}\\xi\\wedge\\omega.\\)\n- (b)\
  \ 若 \\(s=s'=1\\)，则 \\(\\omega\\wedge\\xi=-\\xi\\wedge\\omega.\\)\n- (c) 若 \\(s=1\\\
  )，则 \\(\\omega\\wedge\\omega=0.\\)\n\n*证明.* 这是定理 7.2.3 的流形版本。\n\n**定理 15.8.3.**\
  \ 设 \\(M\\) 是一个光滑流形，设 \\(\\omega^1,\\ldots,\\omega^s\\) 是 \\(\\mathfrak{X}^*(M)\\\
  ) 中的余向量场，并设 \\(X_1,\\ldots,X_s\\) 是 \\(\\mathfrak{X}(M)\\) 中的向量场。则：\n\n- (a)\n\\\
  [\n\\omega^1\\wedge\\cdots\\wedge\\omega^s(X_1,\\ldots,X_s)=\n\\det\\begin{pmatrix}\n\
  \\omega^1(X_1)&\\cdots&\\omega^1(X_s)\\\\\n\\vdots&\\ddots&\\vdots\\\\\n\\omega^s(X_1)&\\\
  cdots&\\omega^s(X_s)\n\\end{pmatrix}.\n\\]\n\n- (b) 若对于某个 \\(1\\le i<j\\le s\\)\
  \ 有 \\(\\omega^i=\\omega^j\\)，则 \\(\\omega^1\\wedge\\cdots\\wedge\\omega^s=0\\)。\n\
  \n*证明.* 这是定理 7.2.6 的流形版本与定理 7.2.8 的流形版本的结合。\n\n**定理 15.8.4.** 设 \\(M\\) 是一个光滑 \\\
  (m\\)-流形，并设 \\(U\\) 是 \\(M\\) 中的一个开集。若 \\((X_1,\\ldots,X_m)\\) 是 \\(U\\) 上的一个标架，且\
  \ \\((\\omega^1,\\ldots,\\omega^m)\\) 是其对偶标架，则\n\n\\[\n\\omega^{j_1}\\wedge\\cdots\\\
  wedge\\omega^{j_s}(X_{i_1},\\ldots,X_{i_s})=\n\\begin{cases}\n1 & \\text{if } (i_1,\\\
  ldots,i_s)=(j_1,\\ldots,j_s),\\\\\n0 & \\text{if } (i_1,\\ldots,i_s)\\neq(j_1,\\\
  ldots,j_s).\n\\end{cases}\n\\]\n\n对一切 \\(1\\le i_1<\\cdots<i_s\\le m\\) 和 \\(1\\\
  le j_1<\\cdots<j_s\\le m\\) 成立。特别地，若 \\((U,(x^i))\\) 是 \\(M\\) 上的一个坐标卡，且 \\((\\\
  partial/\\partial x^1,\\ldots,\\partial/\\partial x^m)\\) 和 \\((d(x^1),\\ldots,d(x^m))\\\
  ) 分别是相应的坐标标架和对偶坐标标架，则\n\n\\[\nd(x^{j_1})\\wedge\\cdots\\wedge d(x^{j_s})(\\partial/\\\
  partial x^{i_1},\\ldots,\\partial/\\partial x^{i_s})=\n\\begin{cases}\n1 & \\text{if\
  \ } (i_1,\\ldots,i_s)=(j_1,\\ldots,j_s),\\\\\n0 & \\text{if } (i_1,\\ldots,i_s)\\\
  neq(j_1,\\ldots,j_s).\n\\end{cases}\n\\]\n\n对一切 \\(1\\le i_1<\\cdots<i_s\\le m\\\
  ) 和 \\(1\\le j_1<\\cdots<j_s\\le m\\) 成立。\n\n*证明.* 这是定理 7.2.9 的流形版本。\n\n**定理 15.8.5.**\
  \ 设 \\(M\\) 是一个光滑 \\(m\\)-流形，设 \\((U,(x^i))\\) 是 \\(M\\) 上的一个坐标卡，并设 \\((d(x^1),\\\
  ldots,d(x^m))\\) 是相应的对偶坐标标架。若 \\(\\omega\\) 是 \\(\\Lambda^m(U)\\) 中的一个形式，则存在唯一确定的函数\
  \ \\(f\\in C^\\infty(U)\\)，使得 \\(\\omega = f\\, d(x^1)\\wedge\\cdots\\wedge d(x^m)\\\
  )。\n\n*证明.* 设 \\((\\partial/\\partial x^1,\\ldots,\\partial/\\partial x^m)\\) 是与\
  \ \\((U,(x^i))\\) 对应的坐标标架，为简洁起见，令 \\(\\Omega = d(x^1)\\wedge\\cdots\\wedge d(x^m)\\\
  )。对于 \\(U\\) 中的每个点 \\(p\\)，根据定义，\\(\\omega_p\\) 是 \\(T_p^*(U)\\) 中的一个余向量。由定理 7.2.12(d)\
  \ 可知，存在某个实数 \\(f(p)\\) 使得 \\(\\omega_p = f(p)\\Omega_p\\)。对应关系 \\(p\\longmapsto\
  \ f(p)\\) 定义了函数 \\(f:U\\longrightarrow\\mathbb{R}\\)，使得 \\(\\omega = f\\Omega\\\
  )。由于 \\(\\omega\\) 属于 \\(\\Lambda^m(U)\\)，根据定义，对 \\(\\mathfrak{X}(U)\\) 中的所有向量场\
  \ \\(X_1,\\ldots,X_m\\)，\\(\\omega(X_1,\\ldots,X_m)\\) 都是 \\(C^\\infty(U)\\) 中的函数。特别地，对\
  \ \\(\\partial/\\partial x^1,\\ldots,\\partial/\\partial x^m\\) 也如此。由定理 15.8.4，\n\
  \n\\[\nf = f\\,\\Omega\\left(\\frac{\\partial}{\\partial x^1},\\ldots,\\frac{\\\
  partial}{\\partial x^m}\\right) = \\omega\\left(\\frac{\\partial}{\\partial x^1},\\\
  ldots,\\frac{\\partial}{\\partial x^m}\\right),\n\\]\n\n因此 \\(f\\in C^\\infty(U)\\\
  )。\\(f\\) 的唯一性由前面的计算得出。\n\n## 15.9 函数的前推与拉回\n\n设 \\(M\\) 是一个光滑流形，并设 \\(F : M \\\
  longrightarrow N\\) 是一个微分同胚。由 \\(F\\) 诱导的前推（对于函数）是如下映射\n\n\\[\nF_* : C^\\infty(M)\
  \ \\longrightarrow C^\\infty(N)\n\\]\n\n定义为\n\n\\[\nF_*(f) = f \\circ F^{-1} \\\
  tag{15.9.1}\n\\]\n\n其中 \\(f\\) 取遍 \\(C^\\infty(M)\\) 中的所有函数。\n\n**定理 15.9.1.** 若\
  \ \\(M, N\\) 和 \\(P\\) 都是光滑流形，且 \\(F : M \\longrightarrow N\\) 和 \\(G : N \\longrightarrow\
  \ P\\) 都是微分同胚，则\n\n\\[\n(G \\circ F)_* = G_* \\circ F_*.\n\\]\n\n*证明.* 对于 \\(C^\\\
  infty(M)\\) 中的一个函数 \\(f\\)，我们有\n\n\\[\n(G \\circ F)_*(f) = f \\circ (G \\circ F)^{-1}\
  \ = (f \\circ F^{-1}) \\circ G^{-1} = F_*(f) \\circ G^{-1} = G_*(F_*(f)) = (G_*\
  \ \\circ F_*)(f).\n\\]\n\n由于 \\(f\\) 是任意的，结论得证。\n\n设 \\(M\\) 和 \\(N\\) 是光滑流形，并设\
  \ \\(F : M \\longrightarrow N\\) 是一个光滑映射（但不一定是微分同胚）。由 \\(F\\) 诱导的拉回（对于函数）是如下映射\n\
  \n\\[\nF^* : C^\\infty(N) \\longrightarrow C^\\infty(M)\n\\]\n\n定义为\n\n\\[\nF^*(g)\
  \ = g \\circ F \\tag{15.9.2}\n\\]\n\n其中 \\(g\\) 取遍 \\(C^\\infty(N)\\) 中的所有函数。\n\n\
  **定理 15.9.2.** 若 \\(M, N\\) 和 \\(P\\) 都是光滑流形，且 \\(F : M \\longrightarrow N\\) 和\
  \ \\(G : N \\longrightarrow P\\) 都是光滑映射，则\n\n\\[\n(G \\circ F)^* = F^* \\circ G^*.\n\
  \\]\n\n*证明.* 对于 \\(C^\\infty(P)\\) 中的一个函数 \\(g\\)，我们有\n\n\\[\n(G \\circ F)^*(g)\
  \ = (g \\circ G) \\circ F = G^*(g) \\circ F = F^*(G^*(g)) = (F^* \\circ G^*)(g).\n\
  \\]\n\n由于 \\(g\\) 是任意的，结论得证。\n\n**定理 15.9.3.** 若 \\(M\\) 是一个光滑流形且 \\(F : M \\longrightarrow\
  \ N\\) 是一个微分同胚，则：\n\n- (a) \\(F^*\\) 是双射，其逆为 \\((F^*)^{-1} = (F^{-1})^* = F_*\\\
  )。\n- (b) \\(F_*\\) 是双射，其逆为 \\((F_*)^{-1} = (F^{-1})_* = F^*\\)。\n\n*证明.* (a)：由定理\
  \ 15.9.2，\n\n\\[\n\\mathrm{id}_{C^\\infty(M)} = (\\mathrm{id}_M)^* = (F^{-1} \\\
  circ F)^* = F^* \\circ (F^{-1})^*\n\\]\n\n且\n\n\\[\n\\mathrm{id}_{C^\\infty(N)}\
  \ = (\\mathrm{id}_N)^* = (F \\circ F^{-1})^* = (F^{-1})^* \\circ F^*.\n\\]\n\n由定理\
  \ A.4 可知 \\(F^*\\) 是双射。前面的恒等式给出第一个等式。对于 \\(C^\\infty(M)\\) 中的一个函数 \\(f\\)，我们有\n\n\
  \\[\n(F^{-1})^*(f) = f \\circ F^{-1} = F_*(f).\n\\]\n\n由于 \\(f\\) 是任意的，第二个等式成立。\n\
  \n(b)：由 (a) 直接得出。\n\n\n\n\n## 15.10 向量场的前推与拉回\n\n设 $M$ 和 $N$ 是光滑流形，$F : M \\longrightarrow\
  \ N$ 是光滑映射，$X$ 是 $\\mathfrak{X}(M)$ 中的向量场，$p$ 是 $M$ 中的一个点。根据定义，$d_p(F)(X_p)$ 是 $T_{F(p)}(N)$\
  \ 中的一个向量。在没有任何额外假设的情况下，指派 $p \\longmapsto d_p(F)(X_p)$ 不一定产生 $\\mathfrak{X}(N)$\
  \ 中的向量场。例如，若 $F$ 不是满射，则无法在 $F$ 的像之外的点上指定向量。此外，若 $F$ 不是单射，则存在 $M$ 中不同的点 $p_1, p_2$，使得\
  \ $F(p_1)=F(p_2)$。当 $d_{p_1}(F)(X_{p_1}) \\neq d_{p_2}(F)(X_{p_2})$ 时，为 $F(p_1)$\
  \ 指定向量就不会有明确的方式。解决这一困境的办法是像我们现在这样假设 $F$ 是一个微分同胚。在下面的讨论中，我们使用定理 15.2.1 将 $\\mathfrak{X}(M)$\
  \ 中的向量场与 $\\mathrm{Der}(M)$ 中的导子等同起来。\n\n**$X$ 由 $F$ 的前推**是 $\\mathfrak{X}(N)$ 中由\n\
  \n$$\nF_*(X) = F_\\bullet \\circ X \\circ F^\\bullet. \\tag{15.10.1}\n$$\n\n定义的向量场\
  \ $F_*(X)$。这一定义是合理的，因为我们有映射 $F^\\bullet : C^\\infty(N) \\longrightarrow C^\\infty(M)$，$X\
  \ : C^\\infty(M) \\longrightarrow C^\\infty(M)$ 和 $F_\\bullet : C^\\infty(M) \\\
  longrightarrow C^\\infty(N)$，因此\n\n$$\nF_*(X) : C^\\infty(N) \\longrightarrow C^\\\
  infty(N).\n$$\n\n**$F$ 的前推（就向量场而言）**是映射\n\n$$\nF_* : \\mathfrak{X}(M) \\longrightarrow\
  \ \\mathfrak{X}(N)\n$$\n\n由指派\n\n$$\nX \\longmapsto F_*(X)\n$$\n\n对所有 $\\mathfrak{X}(M)$\
  \ 中的向量场 $X$ 定义。**$F$ 的拉回（就向量场而言）**是映射\n\n$$\nF^* : \\mathfrak{X}(N) \\longrightarrow\
  \ \\mathfrak{X}(M)\n$$\n\n由\n\n$$\nF^* = (F^{-1})_*;\n$$\n\n即\n\n$$\nF^*(Y) = (F^{-1})_*(Y)\
  \ \\tag{15.10.2}\n$$\n\n对所有 $\\mathfrak{X}(N)$ 中的向量场 $Y$ 定义。我们称 $F^*(Y)$ 为 **$Y$\
  \ 由 $F$ 的拉回**，并注意到它等于 $Y$ 由 $F^{-1}$ 的前推。\n\n**记号 $F_*$ 和 $F^*$ 仅当 $F$ 是微分同胚时才使用。**\n\
  \n下一个结果说明，前推对引言中提出的问题给出了回答。\n\n### 定理 15.10.1。\n\n设 $M$ 和 $N$ 是光滑流形，$F : M \\longrightarrow\
  \ N$ 是微分同胚，$X$ 是 $\\mathfrak{X}(M)$ 中的向量场。则\n\n$$\nd_p(F)(X_p) = F_*(X)_{F(p)}\n\
  $$\n\n对所有 $p \\in M$ 成立。\n\n**注。** 仔细查看定义，我们发现 $d_p(F)(X_p)$ 和 $F_*(X)_{F(p)}$ 都是\
  \ $T_{F(p)}(N)$ 中的向量，因此这一断言是有意义的。在文献中，记号 $F_{*p}$ 或简写 $F_*$ 常常用来代替 $d_p(F)$。实际上，即使\
  \ $F$ 不是微分同胚，这种记号也经常被采用。\n\n**证明。** 对于 $C^\\infty(N)$ 中的函数 $g$，我们有\n\n$$\n\\begin{aligned}\n\
  d_p(F)(X_p)(g)\n&= X_p(g \\circ F) & [(14.4.1)] \\\\\n&= X(g \\circ F)(p) & [(15.1.2)]\
  \ \\\\\n&= (X(F^\\bullet(g)) \\circ F^{-1})(F(p)) & [(15.9.2)] \\\\\n&= F_\\bullet(X(F^\\\
  bullet(g)))(F(p)) & [(15.9.1)] \\\\\n&= (F_\\bullet \\circ X \\circ F^\\bullet)(g)(F(p))\
  \ \\\\\n&= F_*(X)(g)(F(p)) & [(15.10.1)] \\\\\n&= F_*(X)_{F(p)}(g). & [(15.1.2)]\n\
  \\end{aligned}\n$$\n\n由于 $g$ 是任意的，结论成立。\n\n### 定理 15.10.2。\n\n设 $M$、$N$ 和 $P$ 是光滑流形，$F\
  \ : M \\longrightarrow N$ 和 $G : N \\longrightarrow P$ 是微分同胚，$Y$ 是 $\\mathfrak{X}(N)$\
  \ 中的向量场。则：\n\n- (a) $(G \\circ F)_* = G_* \\circ F_*$\n- (b) $(G \\circ F)^* = F^*\
  \ \\circ G^*$\n- (c) $F^*(Y) = F^\\bullet \\circ Y \\circ F_\\bullet$。\n\n**证明。**\
  \ (a)：对于 $\\mathfrak{X}(M)$ 中的向量场 $X$，我们有\n\n$$\n\\begin{aligned}\n(G \\circ F)_*(X)\n\
  &= (G \\circ F)_\\bullet \\circ X \\circ (G \\circ F)^\\bullet & [(15.10.1)] \\\\\
  \n&= G_\\bullet \\circ (F_\\bullet \\circ X \\circ F^\\bullet) \\circ G^\\bullet\
  \ & [\\mathrm{Th}\\ 15.9.1,\\ \\mathrm{Th}\\ 15.9.2] \\\\\n&= G_\\bullet \\circ\
  \ F_*(X) \\circ G^\\bullet & [(15.10.1)] \\\\\n&= G_*(F_*(X)) & [(15.10.1)] \\\\\
  \n&= (G_* \\circ F_*)(X).\n\\end{aligned}\n$$\n\n由于 $X$ 是任意的，结论成立。\n\n(b)：对于 $\\\
  mathfrak{X}(P)$ 中的向量场 $Z$，我们有\n\n$$\n\\begin{aligned}\n(G \\circ F)^*(Z)\n&= ((G\
  \ \\circ F)^{-1})_*(Z) & [(15.10.2)] \\\\\n&= (F^{-1} \\circ G^{-1})_*(Z) \\\\\n\
  &= ((F^{-1})_* \\circ (G^{-1})_*)(Z) & [\\text{part (a)}] \\\\\n&= (F^* \\circ G^*)(Z).\
  \ & [(15.10.2)]\n\\end{aligned}\n$$\n\n由于 $Z$ 是任意的，结论成立。\n\n(c)：我们有\n\n$$\n\\begin{aligned}\n\
  F^*(Y)\n&= (F^{-1})_*(Y) & [(15.10.2)] \\\\\n&= (F^{-1})_\\bullet \\circ Y \\circ\
  \ (F^{-1})^\\bullet & [(15.10.1)] \\\\\n&= F^\\bullet \\circ Y \\circ F_\\bullet\
  \ & [\\mathrm{Th}\\ 15.9.3]\n\\end{aligned}\n$$\n\n### 定理 15.10.3。\n\n若 $M$ 和 $N$\
  \ 是光滑流形，且 $F : M \\longrightarrow N$ 是微分同胚，则：\n\n- (a) $F^*$ 是双射，其逆为 $(F^*)^{-1}\
  \ = (F^{-1})^* = F_*$。\n- (b) $F_*$ 是双射，其逆为 $(F_*)^{-1} = (F^{-1})_* = F^*$。\n\n\
  **证明。** 其论证与定理 15.9.3 的证明中所用的论证类似。\n\n### 定理 15.10.4。\n\n设 $M$ 和 $N$ 是光滑流形，$F :\
  \ M \\longrightarrow N$ 是微分同胚，$Y$ 是 $\\mathfrak{X}(N)$ 中的向量场，$g$ 是 $C^\\infty(N)$\
  \ 中的函数。则\n\n$$\nF^\\bullet(Y(g)) = F^*(Y)(F^\\bullet(g)).\n$$\n\n**证明。** 我们有\n\n\
  $$\n\\begin{aligned}\nF^*(Y)(F^\\bullet(g))\n&= (F^\\bullet \\circ Y \\circ F_\\\
  bullet)(F^\\bullet(g)) & [\\mathrm{Th}\\ 15.10.2(c)] \\\\\n&= F^\\bullet(Y(g)).\
  \ & [\\mathrm{Th}\\ 15.9.3]\n\\end{aligned}\n$$\n\n## 15.11 余向量场的拉回\n\n设 $M$ 和 $N$\
  \ 是光滑流形，$F : M \\longrightarrow N$ 是光滑映射，$p$ 是 $M$ 中的一个点。相应的微分映射为 $d_p(F) : T_p(M)\
  \ \\longrightarrow T_{F(p)}(N)$。根据 (7.1.2)，$\\Lambda^1(T_p(M)) = T_p^*(M)$ 且 $\\\
  Lambda^1(T_{F(p)}(N)) = T_{F(p)}^*(N)$，因此由 (7.3.1) 可知，对余向量而言，由 $d_p(F)$ 诱导的拉回是映射\n\
  \n$$\nd_p(F)^* : T_{F(p)}^*(N) \\longrightarrow T_p^*(M)\n$$\n\n定义为\n\n$$\nd_p(F)^*(\\\
  eta)(v) = \\eta(d_p(F)(v)) \\tag{15.11.1}\n$$\n\n对所有 $T_{F(p)}^*(N)$ 中的余向量 $\\eta$\
  \ 和 $T_p(M)$ 中的所有向量 $v$ 成立。$F$ 的拉回（就余向量场而言）是线性映射\n\n$$\nF^* : \\mathfrak{X}^*(N)\
  \ \\longrightarrow \\mathfrak{X}^*(M)\n$$\n\n定义为\n\n$$\nF^*(\\omega)_p(v) = d_p(F)^*(\\\
  omega_{F(p)})(v) = \\omega_{F(p)}(d_p(F)(v)) \\tag{15.11.2}\n$$\n\n对所有 $\\mathfrak{X}^*(N)$\
  \ 中的余向量场 $\\omega$、$M$ 中的所有点 $p$ 以及 $T_p(M)$ 中的所有向量 $v$ 成立，其中第二个等式由在 (15.11.1) 中令\
  \ $\\eta = \\omega_{F(p)}$ 得到。我们称\n\n**注。** 对于 (15.11.3) 的左边，我们有映射 $d : C^\\infty(N)\
  \ \\to \\mathfrak{X}^*(N)$ 和 $F^* : \\mathfrak{X}^*(N) \\to \\mathfrak{X}^*(M)$；对于右边，我们有映射\
  \ $F^\\bullet : C^\\infty(N) \\to C^\\infty(M)$ 和 $d : C^\\infty(M) \\to \\mathfrak{X}^*(M)$，因此该断言是有意义的。\n\
  \n**证明。** 对于点 $p \\in M$ 和向量 $v \\in T_p(M)$，我们有\n\n$$\n\\begin{aligned}\nF^*(d(g))_p(v)\n\
  &= (d(g))_{F(p)}(d_p(F)(v)) & [(15.11.2)] \\\\\n&= d_{F(p)}(g)(d_p(F)(v)) & [(15.4.4)]\
  \ \\\\\n&= d_{F(p)}(g) \\circ d_p(F)(v) \\\\\n&= d_p(g \\circ F)(v) & [\\mathrm{Th}\\\
  \ 14.4.5] \\\\\n&= d(g \\circ F)_p(v) & [(15.4.4)] \\\\\n&= d(F^\\bullet(g))_p(v).\
  \ & [(15.9.2)]\n\\end{aligned}\n$$\n\n由于 $p$、$v$ 和 $g$ 都是任意的，结论成立。\n\n### 定理 15.11.3（余向量场的拉回）。\n\
  \n设 $M$ 和 $N$ 是光滑流形，$F : M \\longrightarrow N$ 是光滑映射，$(U,(x^i))$ 和 $(V,(y^j))$ 分别是\
  \ $M$ 和 $N$ 上的坐标卡，且 $U \\cap F^{-1}(V)$ 非空。设 $\\omega$ 是 $\\mathfrak{X}^*(N)$ 中的余向量场，在局部坐标下记\n\
  \n$$\n\\omega = \\sum_j \\alpha_j d(y^j).\n$$\n\n则\n\n$$\nF^*(\\omega) = \\sum_i\
  \ \\left(\\sum_j (\\alpha_j \\circ F)\\frac{\\partial(y^j \\circ F)}{\\partial x^i}\\\
  right)d(x^i).\n$$\n\n**证明。** 我们有\n\n$$\n\\begin{aligned}\nF^*(\\omega)\n&= F^*\\\
  left(\\sum_j \\alpha_j d(y^j)\\right) \\\\\n&= \\sum_j F^\\bullet(\\alpha_j)F^*(d(y^j))\
  \ & [\\mathrm{Th}\\ 15.11.1] \\\\\n&= \\sum_j F^\\bullet(\\alpha_j)d(F^\\bullet(y^j))\
  \ & [\\mathrm{Th}\\ 15.11.2] \\\\\n&= \\sum_j (\\alpha_j \\circ F)d(y^j \\circ F),\
  \ & [(15.9.2)]\n\\end{aligned}\n$$\n\n并且由定理 15.4.7 可得\n\n$$\nd(y^j \\circ F) = \\\
  sum_i \\frac{\\partial(y^j \\circ F)}{\\partial x^i}\\,d(x^i).\n$$\n\n综合上述等式即得结论。\n\
  \n### 例 15.11.4。\n\n设 $f : \\mathbb{R} \\to \\mathbb{R}$ 是由 $f(t)=t^2$ 给出的函数，并设\
  \ $\\omega$ 是 $\\mathfrak{X}^*(\\mathbb{R})$ 中由 $\\omega_r = \\alpha(r)d(r)$ 定义的余向量场，其中\
  \ $\\alpha$ 是 $C^\\infty(\\mathbb{R})$ 中的函数。由定理 15.11.3，\n\n$$\nf^*(\\omega)_t =\
  \ \\alpha(f(t))\\frac{df}{dt}(t)d(t) = 2t\\,\\alpha(t^2)d(t).\n$$\n\n另一种做法是，在 $\\\
  alpha(r)d(r)$ 中代入 $r=t^2$ 和 $d(r)=2t\\,d(t)$，同样得到 $2t\\,\\alpha(t^2)d(t)$。这说明“拉回”运算不过是一元实变量微分学中熟悉的“代入”技巧。\n\
  \n### 例 15.11.5。\n\n设 $(r,s)$ 和 $(x,y,z)$ 分别是 $\\mathbb{R}^2$ 和 $\\mathbb{R}^3$\
  \ 上的标准坐标，$F : \\mathbb{R}^3 \\to \\mathbb{R}^2$ 是由\n\n$$\nF(x,y,z) = (x^2y,\\ y\\\
  sin(z)),\n$$\n\n给出的光滑映射，并考虑 $\\mathfrak{X}^*(\\mathbb{R}^2)$ 中的余向量场\n\n$$\n\\omega_{(r,s)}\
  \ = s\\,d(r) + r\\,d(s)\n$$\n\n在定理 15.11.3 中令 $(U,(x^i)) = (\\mathbb{R}^3,(x,y,z))$、$(V,(y^j))\
  \ = (\\mathbb{R}^2,(r,s))$，得到\n\n$$\n\\begin{aligned}\nF^*(\\omega)_{(x,y,z)}\n\
  ={}&\\left((s \\circ F)\\frac{\\partial(r \\circ F)}{\\partial x} + (r \\circ F)\\\
  frac{\\partial(s \\circ F)}{\\partial x}\\right)d(x)\\\\\n&+\\left((s \\circ F)\\\
  frac{\\partial(r \\circ F)}{\\partial y} + (r \\circ F)\\frac{\\partial(s \\circ\
  \ F)}{\\partial y}\\right)d(y)\\\\\n&+\\left((s \\circ F)\\frac{\\partial(r \\circ\
  \ F)}{\\partial z} + (r \\circ F)\\frac{\\partial(s \\circ F)}{\\partial z}\\right)d(z)\\\
  \\\n={}&\\left(y\\sin(z)\\frac{\\partial(x^2y)}{\\partial x} + x^2y\\frac{\\partial(y\\\
  sin(z))}{\\partial x}\\right)d(x)\\\\\n&+\\left(y\\sin(z)\\frac{\\partial(x^2y)}{\\\
  partial y} + x^2y\\frac{\\partial(y\\sin(z))}{\\partial y}\\right)d(y)\\\\\n&+\\\
  left(y\\sin(z)\\frac{\\partial(x^2y)}{\\partial z} + x^2y\\frac{\\partial(y\\sin(z))}{\\\
  partial z}\\right)d(z)\\\\\n={}&2xy^2\\sin(z)\\,d(x) + 2x^2y\\sin(z)\\,d(y) + x^2y^2\\\
  cos(z)\\,d(z).\n\\end{aligned}\n$$\n\n### 例 15.11.6（极坐标）。\n\n设 $(r,s)$ 是 $\\mathbb{R}^2$\
  \ 上的标准坐标，$(\\rho,\\phi)$ 是\n\n$$\nU = \\{(\\rho,\\phi) \\in \\mathbb{R}^2 : \\rho\
  \ > 0,\\ 0 \\leq \\phi < 2\\pi\\}.\n$$\n\n上的极坐标。设 $F : U \\to \\mathbb{R}^2$ 是由\n\
  \n$$\nF(\\rho,\\phi) = (\\rho\\cos(\\phi),\\rho\\sin(\\phi)),\n$$\n\n给出的光滑映射。\n\n\
  \n\n\nand consider the covector field\n\n\\[\n\\omega_{(r,s)}=-s\\,d(r)+r\\,d(s)\n\
  \\]\n\nin \\(\\mathfrak{X}^*(\\mathbb{R}^2)\\). Setting \\((U,(x^i))=(U,(\\rho,\\\
  phi))\\) and \\((V,(y^j))=(\\mathbb{R}^2,(r,s))\\) in Theorem 15.11.3 yields\n\n\
  \\[\n\\begin{aligned}\nF^*(\\omega)_{(\\rho,\\phi)}\n&=\\left((-s\\circ F)\\frac{\\\
  partial(r\\circ F)}{\\partial \\rho}\n+(r\\circ F)\\frac{\\partial(s\\circ F)}{\\\
  partial \\rho}\\right)d(\\rho)\\\\\n&\\quad+\\left((-s\\circ F)\\frac{\\partial(r\\\
  circ F)}{\\partial \\phi}\n+(r\\circ F)\\frac{\\partial(s\\circ F)}{\\partial \\\
  phi}\\right)d(\\phi)\\\\\n&=\\left(-\\rho\\sin(\\phi)\\frac{\\partial(\\rho\\cos(\\\
  phi))}{\\partial \\rho}\n+\\rho\\cos(\\phi)\\frac{\\partial(\\rho\\sin(\\phi))}{\\\
  partial \\rho}\\right)d(\\rho)\\\\\n&\\quad+\\left(-\\rho\\sin(\\phi)\\frac{\\partial(\\\
  rho\\cos(\\phi))}{\\partial \\phi}\n+\\rho\\cos(\\phi)\\frac{\\partial(\\rho\\sin(\\\
  phi))}{\\partial \\phi}\\right)d(\\phi)\\\\\n&=\\rho^2 d(\\phi).\n\\end{aligned}\n\
  \\]\n\n### Example 15.11.7 (Polar Coordinates and Punctured Plane)\n\nLet \\((r,s)\\\
  ) be standard coordinates on the set \\(\\mathbb{R}^2\\setminus\\{(0,0)\\}\\), called\
  \ the punctured plane, and let \\((\\rho,\\phi)\\) be polar coordinates on\n\n\\\
  [\nU=\\{(\\rho,\\phi)\\in\\mathbb{R}^2:\\rho>0,\\ 0\\le\\phi<2\\pi\\}.\n\\]\n\n\
  Let \\(F:U\\longrightarrow\\mathbb{R}^2\\setminus\\{(0,0)\\}\\) be the smooth map\
  \ given by\n\n\\[\nF(\\rho,\\phi)=(\\rho\\cos(\\phi),\\rho\\sin(\\phi)),\n\\]\n\n\
  and consider the covector field\n\n\\[\n\\omega_{(r,s)}=-\\frac{s}{r^2+s^2}\\,d(r)+\\\
  frac{r}{r^2+s^2}\\,d(s)\n\\]\n\nin \\(\\mathfrak{X}^*(\\mathbb{R}^2\\setminus\\\
  {(0,0)\\})\\). Setting \\((U,(x^i))=(U,(\\rho,\\phi))\\) and \\((V,(y^j))=(\\mathbb{R}^2\\\
  setminus\\{(0,0)\\},(r,s))\\) in Theorem 15.11.3 yields\n\n\\[\n\\begin{aligned}\n\
  F^*(\\omega)_{(\\rho,\\phi)}\n&=\\left[\\left(-\\frac{s}{r^2+s^2}\\circ F\\right)\n\
  \\frac{\\partial(r\\circ F)}{\\partial \\rho}\n+\\left(\\frac{r}{r^2+s^2}\\circ\
  \ F\\right)\n\\frac{\\partial(s\\circ F)}{\\partial \\rho}\\right]d(\\rho)\\\\\n\
  &\\quad+\\left[\\left(-\\frac{s}{r^2+s^2}\\circ F\\right)\n\\frac{\\partial(r\\\
  circ F)}{\\partial \\phi}\n+\\left(\\frac{r}{r^2+s^2}\\circ F\\right)\n\\frac{\\\
  partial(s\\circ F)}{\\partial \\phi}\\right]d(\\phi)\\\\\n&=\\left(-\\frac{\\rho\\\
  sin(\\phi)}{[\\rho\\cos(\\phi)]^2+[\\rho\\sin(\\phi)]^2}\n\\frac{\\partial(\\rho\\\
  cos(\\phi))}{\\partial \\rho}\n+\\frac{\\rho\\cos(\\phi)}{[\\rho\\cos(\\phi)]^2+[\\\
  rho\\sin(\\phi)]^2}\n\\frac{\\partial(\\rho\\sin(\\phi))}{\\partial \\rho}\\right)d(\\\
  rho)\\\\\n&\\quad+\\left(-\\frac{\\rho\\sin(\\phi)}{[\\rho\\cos(\\phi)]^2+[\\rho\\\
  sin(\\phi)]^2}\n\\frac{\\partial(\\rho\\cos(\\phi))}{\\partial \\phi}\n+\\frac{\\\
  rho\\cos(\\phi)}{[\\rho\\cos(\\phi)]^2+[\\rho\\sin(\\phi)]^2}\n\\frac{\\partial(\\\
  rho\\sin(\\phi))}{\\partial \\phi}\\right)d(\\phi)\\\\\n&=d(\\phi).\n\\end{aligned}\n\
  \\]\n\n### Theorem 15.11.8\n\nLet \\(M\\) be a smooth manifold, let \\(\\lambda:(a,b)\\\
  longrightarrow M\\) be a smooth curve, let \\(\\omega\\) be a covector field in\
  \ \\(\\mathfrak{X}^*(M)\\), and view \\((a,b)\\) as a smooth \\(1\\)-manifold. Then\n\
  \n\\[\n\\lambda^*(\\omega)_t=\\omega_{\\lambda(t)}\\!\\left(\\frac{d\\lambda}{dt}(t)\\\
  right)d(t)\n\\]\n\nfor all \\(t\\in(a,b)\\).\n\n**Proof.** Let \\(p\\) be a point\
  \ in \\(M\\), let \\((U,(x^i))\\) be a chart at \\(p\\), and, in local coordinates,\
  \ let\n\n\\[\n\\omega=\\sum_i\\alpha_i\\,d(x^i).\n\\]\n\nBy Theorem 15.11.3,\n\n\
  \\[\n\\lambda^*(\\omega)_t=\\left(\\sum_i\\alpha_i(\\lambda(t))\n\\frac{d(x^i\\\
  circ\\lambda)}{dt}(t)\\right)d(t). \\tag{15.11.5}\n\\]\n\nOn the other hand, (15.4.4)\
  \ gives\n\n\\[\n\\omega_{\\lambda(t)}=\\sum_j\\alpha_j(\\lambda(t))\\,d(x^j)_{\\\
  lambda(t)}\n=\\sum_j\\alpha_j(\\lambda(t))\\,d_{\\lambda(t)}(x^j),\n\\]\n\nhence\n\
  \n\\[\n\\omega_{\\lambda(t)}\\!\\left(\\left.\\frac{\\partial}{\\partial x^i}\\\
  right|_{\\lambda(t)}\\right)\n=\\sum_j\\left[\\alpha_j(\\lambda(t))\\,d_{\\lambda(t)}(x^j)\n\
  \\left(\\left.\\frac{\\partial}{\\partial x^i}\\right|_{\\lambda(t)}\\right)\\right]\n\
  =\\alpha_i(\\lambda(t))\n\\]\n\nfor \\(i=1,\\dots,m\\). By Theorem 14.7.1(b),\n\n\
  \\[\n\\frac{d\\lambda}{dt}(t)=\\sum_i\\frac{d(x^i\\circ\\lambda)}{dt}(t)\n\\left.\\\
  frac{\\partial}{\\partial x^i}\\right|_{\\lambda(t)},\n\\]\n\nso\n\n\\[\n\\omega_{\\\
  lambda(t)}\\!\\left(\\frac{d\\lambda}{dt}(t)\\right)\n=\\sum_i\\frac{d(x^i\\circ\\\
  lambda)}{dt}(t)\\,\n\\omega_{\\lambda(t)}\\!\\left(\\left.\\frac{\\partial}{\\partial\
  \ x^i}\\right|_{\\lambda(t)}\\right)\n=\\sum_i\\alpha_i(\\lambda(t))\\frac{d(x^i\\\
  circ\\lambda)}{dt}(t). \\tag{15.11.6}\n\\]\n\nSubstituting (15.11.6) into (15.11.5)\
  \ gives the result. \\(\\square\\)\n\n## 15.12 Pullback of Covariant Tensor Fields\n\
  \nLet \\(M\\) and \\(N\\) be smooth manifolds, let \\(F:M\\longrightarrow N\\) be\
  \ a smooth map, and let \\(p\\) be a point in \\(M\\). The corresponding differential\
  \ map is \\(d_p(F):T_p(M)\\longrightarrow T_{F(p)}(N)\\). According to (5.2.1),\
  \ the pullback by \\(d_p(F)\\) for covariant tensors is the family of linear maps\n\
  \n\\[\nd_p(F)^*:\\mathcal{T}_s^0(T_{F(p)}(N))\\longrightarrow\\mathcal{T}_s^0(T_p(M))\n\
  \\]\n\ndefined for \\(s\\ge 1\\) by\n\n\\[\nd_p(F)^*(\\mathcal{B})(v_1,\\dots,v_s)\n\
  =\\mathcal{B}(d_p(F)(v_1),\\dots,d_p(F)(v_s)) \\tag{15.12.1}\n\\]\n\nfor all tensors\
  \ \\(\\mathcal{B}\\) in \\(\\mathcal{T}_s^0(T_{F(p)}(N))\\) and all vectors \\(v_1,\\\
  dots,v_s\\in T_p(M)\\). Pullback by \\(F\\) (for covariant tensor fields) is the\
  \ family of linear maps\n\n\\[\nF^*:\\mathcal{T}_s^0(N)\\longrightarrow\\mathcal{T}_s^0(M)\n\
  \\]\n\ndefined for \\(s\\ge 1\\) by\n\n\\[\nF^*(\\mathcal{A})_p(v_1,\\dots,v_s)\n\
  =d_p(F)^*(\\mathcal{A}_{F(p)})(v_1,\\dots,v_s)\n=\\mathcal{A}_{F(p)}(d_p(F)(v_1),\\\
  dots,d_p(F)(v_s)) \\tag{15.12.2}\n\\]\n\nfor all tensor fields \\(\\mathcal{A}\\\
  ) in \\(\\mathcal{T}_s^0(N)\\), all points \\(p\\in M\\), and all vectors \\(v_1,\\\
  dots,v_s\\in T_p(M)\\), where the second equality follows from setting \\(\\mathcal{B}=\\\
  mathcal{A}_{F(p)}\\) in (15.12.1). We refer to \\(F^*(\\mathcal{A})\\) as the pullback\
  \ of \\(\\mathcal{A}\\) by \\(F\\).\n\nTo give meaning to \\(F^*\\) when \\(s=0\\\
  ), recall from (15.6.3) that \\(\\mathcal{T}_0^0(N)=C^\\infty(N)\\). We therefore\
  \ define\n\n\\[\nF^*(g)(p)=g(F(p))=F^\\bullet(g)(p)\n\\]\n\nfor all functions \\\
  (g\\in C^\\infty(N)\\) and all \\(p\\in M\\); that is, we define\n\n\\[\nF^*=F^\\\
  bullet. \\tag{15.12.3}\n\\]\n\n### Theorem 15.12.1\n\nLet \\(M\\), \\(N\\), and\
  \ \\(P\\) be smooth manifolds, let \\(F:M\\longrightarrow N\\) and \\(G:N\\longrightarrow\
  \ P\\) be smooth maps, let \\(\\mathcal{A}\\), \\(\\mathcal{B}\\), and \\(\\mathcal{C}\\\
  ) be tensor fields in \\(\\mathcal{T}_s^0(N)\\) and \\(\\mathcal{T}_{s'}^0(N)\\\
  ), respectively, and let \\(g\\) be a function in \\(C^\\infty(N)\\). Then:\n\n\
  - (a) \\(F^*(\\mathcal{A}+\\mathcal{B})=F^*(\\mathcal{A})+F^*(\\mathcal{B})\\).\n\
  - (b) \\(F^*(g\\mathcal{A})=F^*(g)F^*(\\mathcal{A})\\).\n- (c) \\(F^*(\\mathcal{A}\\\
  otimes\\mathcal{C})=F^*(\\mathcal{A})\\otimes F^*(\\mathcal{C})\\).\n- (d) \\((G\\\
  circ F)^*=F^*\\circ G^*\\).\n\nSince \\(g\\otimes\\mathcal{A}=g\\mathcal{A}\\),\
  \ part (b) of Theorem 15.12.1 follows from part (c). Identity (15.12.3) has several\
  \ implications: Theorem 15.9.2 follows from Theorem 15.12.1(d); the identity in\
  \ Theorem 15.10.4 can be expressed as\n\n\\[\nF^*(Y(g))=F^*(Y)(F^*(g))\n\\]\n\n\
  for all vector fields \\(Y\\in\\mathfrak{X}(N)\\) and all functions \\(g\\in C^\\\
  infty(N)\\); Theorem 15.11.1(b) follows from Theorem 15.12.1(b); and (15.11.4) can\
  \ be expressed as\n\n\\[\nF^*(d(g))=d(F^*(g))\n\\]\n\nfor all functions \\(g\\in\
  \ C^\\infty(N)\\).\n\n### Theorem 15.12.2 (Pullback of Covariant Tensor Field)\n\
  \nLet \\(M\\) be a smooth \\(m\\)-manifold, let \\(N\\) be a smooth \\(n\\)-manifold,\
  \ let \\(F:M\\to N\\) be a smooth map, and let \\((U,(x^j))\\) and \\((V,(y^i))\\\
  ) be charts on \\(M\\) and \\(N\\), respectively, such that \\(U\\cap F^{-1}(V)\\\
  ) is nonempty. Let \\(\\mathcal{A}\\) be a tensor field in \\(\\mathcal{T}_s^0(N)\\\
  ), and, in local coordinates, let\n\n\\[\n\\mathcal{A}=\\sum_{1\\le i_1,\\ldots,i_s\\\
  le n}A_{i_1\\ldots i_s}\\,d(y^{i_1})\\otimes\\cdots\\otimes d(y^{i_s}).\n\\]\n\n\
  Then\n\n\\[\nF^*(\\mathcal{A})=\\sum_{1\\le j_1,\\ldots,j_s\\le m}\\left(\\sum_{1\\\
  le i_1,\\ldots,i_s\\le n}(A_{i_1\\ldots i_s}\\circ F)\n\\frac{\\partial(y^{i_1}\\\
  circ F)}{\\partial x^{j_1}}\\cdots\n\\frac{\\partial(y^{i_s}\\circ F)}{\\partial\
  \ x^{j_s}}\\right)\nd(x^{j_1})\\otimes\\cdots\\otimes d(x^{j_s}).\n\\]\n\n**Proof.**\
  \ We have from Theorem 15.12.1 that\n\n\\[\nF^*(\\mathcal{A})=\nF^*\\left(\\sum_{1\\\
  le i_1,\\ldots,i_s\\le n}A_{i_1\\ldots i_s}\\,d(y^{i_1})\\otimes\\cdots\\otimes\
  \ d(y^{i_s})\\right)\n=\\sum_{1\\le i_1,\\ldots,i_s\\le n}F^*(A_{i_1\\ldots i_s})\n\
  F^*\\left(d(y^{i_1})\\otimes\\cdots\\otimes d(y^{i_s})\\right), \\tag{15.12.4}\n\
  \\]\n\n\\[\nF^*(A_{i_1\\ldots i_s})=A_{i_1\\ldots i_s}\\circ F.\n\\]\n\nWe also\
  \ have\n\n\\[\nF^*\\left(d(y^{i_1})\\otimes\\cdots\\otimes d(y^{i_s})\\right)\n\
  =F^*(d(y^{i_1}))\\otimes\\cdots\\otimes F^*(d(y^{i_s})) \\qquad [\\mathrm{Th\\ 15.12.1(c)}]\n\
  =d(F^*(y^{i_1}))\\otimes\\cdots\\otimes d(F^*(y^{i_s})) \\qquad [\\mathrm{Th\\ 15.11.2,\\\
  \ (15.12.3)}]\n=d(y^{i_1}\\circ F)\\otimes\\cdots\\otimes d(y^{i_s}\\circ F). \\\
  qquad [(15.9.2),\\ (15.12.3)] \\tag{15.12.5}\n\\]\n\nand, from Theorem 15.4.7,\n\
  \n\\[\nd(y^{i_k}\\circ F)=\\sum_{j_k}\\frac{\\partial(y^{i_k}\\circ F)}{\\partial\
  \ x^{j_k}}\\,d(x^{j_k})\n\\]\n\nfor \\(k=1,\\ldots,s\\). Thus,\n\n\\[\nF^*\\left(d(y^{i_1})\\\
  otimes\\cdots\\otimes d(y^{i_s})\\right)\n=\\left(\\sum_{j_1}\\frac{\\partial(y^{i_1}\\\
  circ F)}{\\partial x^{j_1}}d(x^{j_1})\\right)\\otimes\\cdots\\otimes\n\\left(\\\
  sum_{j_s}\\frac{\\partial(y^{i_s}\\circ F)}{\\partial x^{j_s}}d(x^{j_s})\\right)\n\
  =\\sum_{1\\le j_1,\\ldots,j_s\\le m}\n\\frac{\\partial(y^{i_1}\\circ F)}{\\partial\
  \ x^{j_1}}\\cdots\n\\frac{\\partial(y^{i_s}\\circ F)}{\\partial x^{j_s}}\nd(x^{j_1})\\\
  otimes\\cdots\\otimes d(x^{j_s}). \\tag{15.12.6}\n\\]\n\nSubstituting (15.12.5)\
  \ and (15.12.6) into (15.12.4) and reversing summations gives the result. \\(\\\
  square\\)\n\n### Example 15.12.3 (Polar Coordinates)\n\nLet \\((r,s)\\) be standard\
  \ coordinates on \\(\\mathbb{R}^2\\), and let \\((\\rho,\\phi)\\) be polar coordinates.\n\
  \n\\[\nU=\\{(\\rho,\\phi)\\in\\mathbb{R}^2:\\rho>0,\\ 0\\le\\phi<2\\pi\\}.\n\\]\n\
  \nLet \\(F:U\\to\\mathbb{R}^2\\) be the smooth map given by\n\n\\[\nF(\\rho,\\phi)=(\\\
  rho\\cos(\\phi),\\rho\\sin(\\phi)),\n\\]\n\nand consider the tensor field\n\n\\\
  [\n\\mathbf{e}_{(r,s)}=d(r)\\otimes d(r)+d(s)\\otimes d(s)\n\\]\n\nin \\(\\mathcal{T}_2^0(\\\
  mathbb{R}^2)\\). Setting \\((U,(x^i))=(U,(\\rho,\\phi))\\) and \\((V,(y^j))=(\\\
  mathbb{R}^2,(r,s))\\) in Theorem 15.12.2, and observing that \\(\\mathbf{e}_{11}\\\
  circ F=\\mathbf{e}_{22}\\circ F=1\\) and \\(\\mathbf{e}_{12}\\circ F=\\mathbf{e}_{21}\\\
  circ F=0\\), yields\n\n\\[\n\\begin{aligned}\nF^*(\\mathbf{e})_{(\\rho,\\phi)}={}\n\
  &\\left(\\frac{\\partial(r\\circ F)}{\\partial\\rho}\\frac{\\partial(r\\circ F)}{\\\
  partial\\rho}\n+\\frac{\\partial(s\\circ F)}{\\partial\\rho}\\frac{\\partial(s\\\
  circ F)}{\\partial\\rho}\\right)d(\\rho)\\otimes d(\\rho)\\\\\n&+\\left(\\frac{\\\
  partial(r\\circ F)}{\\partial\\rho}\\frac{\\partial(r\\circ F)}{\\partial\\phi}\n\
  +\\frac{\\partial(s\\circ F)}{\\partial\\rho}\\frac{\\partial(s\\circ F)}{\\partial\\\
  phi}\\right)d(\\rho)\\otimes d(\\phi)\\\\\n&+\\left(\\frac{\\partial(r\\circ F)}{\\\
  partial\\phi}\\frac{\\partial(r\\circ F)}{\\partial\\rho}\n+\\frac{\\partial(s\\\
  circ F)}{\\partial\\phi}\\frac{\\partial(s\\circ F)}{\\partial\\rho}\\right)d(\\\
  phi)\\otimes d(\\rho)\\\\\n&+\\left(\\frac{\\partial(r\\circ F)}{\\partial\\phi}\\\
  frac{\\partial(r\\circ F)}{\\partial\\phi}\n+\\frac{\\partial(s\\circ F)}{\\partial\\\
  phi}\\frac{\\partial(s\\circ F)}{\\partial\\phi}\\right)d(\\phi)\\otimes d(\\phi)\\\
  \\\n={}\n&\\left(\\frac{\\partial(\\rho\\cos(\\phi))}{\\partial\\rho}\\frac{\\partial(\\\
  rho\\cos(\\phi))}{\\partial\\rho}\n+\\frac{\\partial(\\rho\\sin(\\phi))}{\\partial\\\
  rho}\\frac{\\partial(\\rho\\sin(\\phi))}{\\partial\\rho}\\right)d(\\rho)\\otimes\
  \ d(\\rho)\\\\\n&+\\left(\\frac{\\partial(\\rho\\cos(\\phi))}{\\partial\\rho}\\\
  frac{\\partial(\\rho\\cos(\\phi))}{\\partial\\phi}\n+\\frac{\\partial(\\rho\\sin(\\\
  phi))}{\\partial\\rho}\\frac{\\partial(\\rho\\sin(\\phi))}{\\partial\\phi}\\right)d(\\\
  rho)\\otimes d(\\phi)\\\\\n&+\\left(\\frac{\\partial(\\rho\\cos(\\phi))}{\\partial\\\
  phi}\\frac{\\partial(\\rho\\cos(\\phi))}{\\partial\\rho}\n+\\frac{\\partial(\\rho\\\
  sin(\\phi))}{\\partial\\phi}\\frac{\\partial(\\rho\\sin(\\phi))}{\\partial\\rho}\\\
  right)d(\\phi)\\otimes d(\\rho)\\\\\n&+\\left(\\frac{\\partial(\\rho\\cos(\\phi))}{\\\
  partial\\phi}\\frac{\\partial(\\rho\\cos(\\phi))}{\\partial\\phi}\n+\\frac{\\partial(\\\
  rho\\sin(\\phi))}{\\partial\\phi}\\frac{\\partial(\\rho\\sin(\\phi))}{\\partial\\\
  phi}\\right)d(\\phi)\\otimes d(\\phi)\\\\\n={}\n&[\\cos^2(\\phi)+\\sin^2(\\phi)]d(\\\
  rho)\\otimes d(\\rho)\\\\\n&+[-\\rho\\cos(\\phi)\\sin(\\phi)+\\rho\\sin(\\phi)\\\
  cos(\\phi)]d(\\rho)\\otimes d(\\phi)\\\\\n&+[-\\rho\\sin(\\phi)\\cos(\\phi)+\\rho\\\
  cos(\\phi)\\sin(\\phi)]d(\\phi)\\otimes d(\\rho)\\\\\n&+[\\rho^2\\sin^2(\\phi)+\\\
  rho^2\\cos^2(\\phi)]d(\\phi)\\otimes d(\\phi)\\\\\n={}\n&d(\\rho)\\otimes d(\\rho)+\\\
  rho^2d(\\phi)\\otimes d(\\phi).\n\\end{aligned}\n\\]\n\n## 15.13 Pullback of Differential\
  \ Forms\n\nLet \\(M\\) and \\(N\\) be smooth manifolds, and let \\(F:M\\to N\\)\
  \ be a smooth map. In Section 15.12, we defined \\(F^*:\\mathcal{T}_s^0(N)\\to\\\
  mathcal{T}_s^0(M)\\), the pullback by \\(F\\) for\n\n\n\n协变张量场。我们寻求微分形式对应的拉回。注意到\
  \ Λ^s(M) 是 T_s^0(M) 的子空间，Λ^s(N) 是 T_s^0(N) 的子空间，且 F*(Λ^s(N)) 是 Λ^s(M) 的子空间，因此我们可以通过限制\
  \ (15.12.1)–(15.12.3) 中定义的映射来继续进行。由 F 拉回（对于微分形式）是线性映射族\n\nF* : Λ^s(N) ⟶ Λ^s(M)\n\
  \n定义为 s ≥ 1 时\n\nF*(ω)_p(v1,…,vs) = d_p(F)*(ω_{F(p)})(v1,…,vs) = ω_{F(p)}(d_p(F)(v1),…,d_p(F)(vs))\n\
  \n对所有微分形式 ω ∈ Λ^s(N)、所有点 p ∈ M 以及所有向量 v1,…,vs ∈ T_p(M) 成立。我们将 F*(ω) 称为 ω 由 F 拉回。如前所述，当\
  \ s = 0 时，我们定义 F* = F•。\n\n## 定理 15.13.1. 设 M、N 和 P 为光滑流形，设 F : M ⟶ N 和 G : N ⟶\
  \ P 为光滑映射，设 ω、ξ 和 ζ 为 Λ^s(N) 和 Λ^{s'}(N) 中的形式，分别设 g 为 C^∞(N) 中的函数。则：\n- (a) F*(ω\
  \ + ξ) = F*(ω) + F*(ξ)。\n- (b) F*(gω) = F*(g)F*(ω)。\n- (c) F*(ω ∧ ζ) = F*(ω) ∧ F*(ζ)。\n\
  - (d) (G ∘ F)* = F* ∘ G*。\n\n## 定理 15.13.2. 设 M 为光滑 m-流形，设 f^1,…,f^s 为 C^∞(M) 中的函数，其中\
  \ s ≤ m。设 (U,(x^j)) 为 M 上的一个坐标图，设 (∂/∂x^1,…,∂/∂x^m) 和 (d(x^1),…,d(x^m)) 为相应的坐标和对偶坐标标架。则在局部坐标下，\n\
  \nd(f^1) ∧ ⋯ ∧ d(f^s) = Σ_{1≤j1<⋯<js≤m} det[ ∂f^1/∂x^1 … ∂f^1/∂x^m ; ⋮ ⋱ ⋮ ; ∂f^s/∂x^1\
  \ … ∂f^s/∂x^m ]_{(j1,…,js)} d(x^{j1}) ∧ ⋯ ∧ d(x^{js}).\n\n证明. 在局部坐标下，设\n\n在 (14.5.4)\
  \ 和定理 15.8.3(a) 的帮助下，前述恒等式的左边可以表示为\n\nd(f¹) ∧ ⋯ ∧ d(fˢ) ( ∂/∂x^{i₁}, …, ∂/∂x^{iₛ}\
  \ ) = det ⎛⎜⎝ d(f¹)(∂/∂x^{i₁}) … d(f¹)(∂/∂x^{iₛ}) ⋮ ⋱ ⋮ d(fˢ)(∂/∂x^{i₁}) … d(fˢ)(∂/∂x^{iₛ})\
  \ ⎞⎟⎠ = det ⎛⎜⎝ ∂f¹/∂x^{i₁} … ∂f¹/∂x^{iₛ} ⋮ ⋱ ⋮ ∂fˢ/∂x^{i₁} … ∂fˢ/∂x^{iₛ} ⎞⎟⎠ =\
  \ det ⎛⎜⎝ ∂f¹/∂x¹ … ∂f¹/∂xᵐ ⋮ ⋱ ⋮ ∂fˢ/∂x¹ … ∂fˢ/∂xᵐ ⎞⎟⎠_{(i₁,…,iₛ)}.\n\n于是，\n\n\
  α_{j₁,…,jₛ} = det ⎛⎜⎝ ∂f¹/∂x¹ … ∂f¹/∂xᵐ ⋮ ⋱ ⋮ ∂fˢ/∂x¹ … ∂fˢ/∂xᵐ ⎞⎟⎠_{(j₁,…,jₛ)}.\
  \ (15.13.2)\n\n将 (15.13.2) 代入 (15.13.1) 得到结果。\n\n## 定理 15.13.3 (微分形式的拉回). 设 M 为光滑\
  \ m-流形，设 N 为光滑 n-流形，设 F : M ⟶ N 为光滑映射，设 (U, (xⁱ)) 和 (V, (yʲ)) 为 M 和 N 上的坐标图，分别使得\
  \ U ∩ F⁻¹(V) 非空。设 ω 为 Λˢ(N) 中的形式，且在局部坐标下，设\n\nω = Σ_{1 ≤ j₁ < ⋯ < jₛ ≤ n} α_{j₁…jₛ}\
  \ d(y^{j₁}) ∧ ⋯ ∧ d(y^{jₛ}), 其中 s ≤ min(m, n)。则：\n\n(a) F*(ω) = Σ_{1 ≤ i₁ < ⋯ <\
  \ iₛ ≤ m} [ Σ_{1 ≤ j₁ < ⋯ < jₛ ≤ n} (α_{j₁…jₛ} ∘ F) det( (J_F)_{(i₁,…,iₛ)}^{(j₁,…,jₛ)}\
  \ ) ] · d(x^{i₁}) ∧ ⋯ ∧ d(x^{iₛ}), 其中\n\nJ_F = ⎡ ∂(y¹ ∘ F)/∂x¹ … ∂(y¹ ∘ F)/∂xᵐ ⎤\
  \ ⋮ ⋱ ⋮ ⎣ ∂(yⁿ ∘ F)/∂x¹ … ∂(yⁿ ∘ F)/∂xᵐ ⎦ (15.13.3)\n\n为相应的雅可比矩阵。\n\n(b) 若 $s =\
  \ m = n$ 且 $\\omega = \\alpha\\, d(y^1) \\wedge \\cdots \\wedge d(y^m)$，则\n\n$$F^*(\\\
  omega) = (\\alpha \\circ F)\\,\\det(J_F)\\, d(x^1) \\wedge \\cdots \\wedge d(x^m).$$\n\
  \n证明. (a): 我们由定理 15.13.1 有\n\n$$F^*(\\omega) = F^*\\left(\\sum_{1 \\le j_1 < \\\
  cdots < j_s \\le n} \\alpha_{j_1 \\dots j_s}\\, d(y^{j_1}) \\wedge \\cdots \\wedge\
  \ d(y^{j_s})\\right)$$ \n\n$$= \\sum_{1 \\le j_1 < \\cdots < j_s \\le n} F^*(\\\
  alpha_{j_1 \\dots j_s})\\, F^*\\left(d(y^{j_1}) \\wedge \\cdots \\wedge d(y^{j_s})\\\
  right), \\qquad (15.13.4)$$ \n\n且由 (15.9.2) 和 (15.12.3) 有\n\n$$F^*(\\alpha_{j_1\
  \ \\dots j_s}) = \\alpha_{j_1 \\dots j_s} \\circ F^*. \\qquad (15.13.5)$$ \n\n我们还有\n\
  \n$$F^*\\left(d(y^{j_1}) \\wedge \\cdots \\wedge d(y^{j_s})\\right)$$ \n\n$$= F^*\\\
  left(d(y^{j_1})\\right) \\wedge \\cdots \\wedge F^*\\left(d(y^{j_s})\\right) \\\
  qquad [\\text{Th 15.13.1(c)}]$$\n\n$$= d\\left(F^*(y^{j_1})\\right) \\wedge \\cdots\
  \ \\wedge d\\left(F^*(y^{j_s})\\right) \\qquad [\\text{Th 15.11.2, (15.12.3)}]$$\n\
  \n$$= d(y^{j_1} \\circ F) \\wedge \\cdots \\wedge d(y^{j_s} \\circ F), \\qquad [(15.9.2),\\\
  \ (15.12.3)]$$\n\n且由定理 15.13.2 有\n\n$$d(y^{j_1} \\circ F) \\wedge \\cdots \\wedge\
  \ d(y^{j_s} \\circ F)$$ \n\n$$= \\sum_{1 \\le i_1 < \\cdots < i_s \\le m} \\det\\\
  left(\\begin{bmatrix} \\dfrac{\\partial(y^{j_1} \\circ F)}{\\partial x^1} & \\cdots\
  \ & \\dfrac{\\partial(y^{j_s} \\circ F)}{\\partial x^m} \\\\ \\vdots & \\ddots &\
  \ \\vdots \\\\ \\dfrac{\\partial(y^{j_s} \\circ F)}{\\partial x^1} & \\cdots & \\\
  dfrac{\\partial(y^{j_s} \\circ F)}{\\partial x^m} \\end{bmatrix}_{(i_1,\\dots,i_s)}\\\
  right) \\cdot d(x^{i_1}) \\wedge \\cdots \\wedge d(x^{i_s})$$\n\n$$= \\sum_{1 \\\
  le i_1 < \\cdots < i_s \\le m} \\det\\left(\\begin{bmatrix} \\dfrac{\\partial(y^1\
  \ \\circ F)}{\\partial x^1} & \\cdots & \\dfrac{\\partial(y^1 \\circ F)}{\\partial\
  \ x^m} \\\\ \\vdots & \\ddots & \\vdots \\\\ \\dfrac{\\partial(y^n \\circ F)}{\\\
  partial x^1} & \\cdots & \\dfrac{\\partial(y^n \\circ F)}{\\partial x^m} \\end{bmatrix}_{(i_1,\\\
  dots,i_s)}^{(j_1,\\dots,j_s)}\\right) \\cdot d(x^{i_1}) \\wedge \\cdots \\wedge\
  \ d(x^{i_s})$$\n\n$$= \\sum_{1 \\le i_1 < \\cdots < i_s \\le m} \\det\\left((J_F)_{(i_1,\\\
  dots,i_s)}^{(j_1,\\dots,j_s)}\\right) d(x^{i_1}) \\wedge \\cdots \\wedge d(x^{i_s}).$$\n\
  \n于是，\n\n$$F^*\\left(d(y^{j_1}) \\wedge \\cdots \\wedge d(y^{j_s})\\right)$$ \n\n\
  $$= \\sum_{1 \\le i_1 < \\cdots < i_s \\le m} \\det\\left((J_F)_{(i_1,\\dots,i_s)}^{(j_1,\\\
  dots,j_s)}\\right) d(x^{i_1}) \\wedge \\cdots \\wedge d(x^{i_s}). \\qquad (15.13.6)$$\n\
  \n将 (15.13.5) 和 (15.13.6) 代入 (15.13.4) 并交换求和次序即得结果。\n(b): 这由 (a) 部分可得。\n\n## 例 15.13.4\
  \ (极坐标).\n\n设 $(r,s)$ 为 $\\mathbb{R}^2$ 上的标准坐标，设 $(\\rho,\\phi)$ 为\n\n$$U = \\{(\\\
  rho,\\phi) \\in \\mathbb{R}^2 : \\rho > 0, 0 \\le \\phi < 2\\pi\\}$$\n\n上的极坐标。\n\
  \n设 $F : U \\longrightarrow \\mathbb{R}^2$ 为由\n\n$$F(\\rho,\\phi) = (\\rho \\cos(\\\
  phi), \\rho \\sin(\\phi)),$$\n\n给出的光滑映射，并考虑形式\n\n$$\\omega_{(r,s)} = d(r) \\wedge\
  \ d(s)$$\n\n在 $\\Lambda^2(\\mathbb{R}^2)$ 中。设 $(U,(x^i)) = (U,(\\rho,\\phi))$ 且\
  \ $(V,(y^j)) = (\\mathbb{R}^2,(r,s))$ 如定理 15.13.3(b) 中，则\n\n$F^*(d(r) \\wedge d(s))\
  \ = \\det\\begin{pmatrix} \\dfrac{\\partial(r \\circ F)}{\\partial \\rho} & \\dfrac{\\\
  partial(r \\circ F)}{\\partial \\phi} \\\\ \\dfrac{\\partial(s \\circ F)}{\\partial\
  \ \\rho} & \\dfrac{\\partial(s \\circ F)}{\\partial \\phi} \\end{pmatrix} d(\\rho)\
  \ \\wedge d(\\phi)$\n\n$= \\det\\begin{pmatrix} \\dfrac{\\partial(\\rho \\cos(\\\
  phi))}{\\partial \\rho} & \\dfrac{\\partial(\\rho \\cos(\\phi))}{\\partial \\phi}\
  \ \\\\ \\dfrac{\\partial(\\rho \\sin(\\phi))}{\\partial \\rho} & \\dfrac{\\partial(\\\
  rho \\sin(\\phi))}{\\partial \\phi} \\end{pmatrix} d(\\rho) \\wedge d(\\phi)$\n\n\
  $= \\det\\begin{pmatrix} \\cos(\\phi) & -\\rho \\sin(\\phi) \\\\ \\sin(\\phi) &\
  \ \\rho \\cos(\\phi) \\end{pmatrix} d(\\rho) \\wedge d(\\phi)$\n\n$= \\rho \\, d(\\\
  rho) \\wedge d(\\phi).$\n\n## 15.14 张量场的收缩\n\n本节简要给出第 5.4 节中若干结果的流形版本。\n\n## 定理\
  \ 15.14.1.\n\n若 $M$ 为光滑流形，则存在唯一的 $C^\\infty(M)$-线性映射\n\n$$\\mathrm{C}_1^1 : \\mathcal{T}_1^1(M)\
  \ \\longrightarrow C^\\infty(M),$$\n\n称为 $(1,1)$-收缩，使得\n\n$$\\mathrm{C}_1^1(X \\\
  otimes \\omega) = \\omega(X)$$\n\n对所有向量场 $X$ 在 $\\mathfrak{X}(M)$ 中以及所有余向量场 $\\\
  omega$ 在 $\\mathfrak{X}^*(M)$ 中成立。\n\n## 定理 15.14.2. 设 \\(M\\) 为光滑流形，设 \\(\\mathcal\
  \ A\\) 为 \\(\\mathcal T^1_1(M)\\) 中的张量场，且在局部坐标下，设\n\n$$\\mathcal A=\\sum_{ij} A^i_j\\\
  frac{\\partial}{\\partial x^i}\\otimes d(x^j).$$\n\n则\n\n$$C^1_1(\\mathcal A)=\\\
  sum_i A^i_i.$$\n\n## 定理 15.14.3. 若 \\(M\\) 为光滑流形，且 \\(1\\leq k\\leq r\\) 和 \\(1\\\
  leq l\\leq s\\) 为整数，则存在唯一的 \\(C^\\infty(M)\\)-线性映射\n\n$$C^k_l:\\mathcal T^r_s(M)\\\
  longrightarrow\\mathcal T^{r-1}_{s-1}(M),$$\n\n称为 **\\((k,l)\\)-收缩**，使得\n\n$$C^k_l(X_1\\\
  otimes\\cdots\\otimes X_r\\otimes\\omega^1\\otimes\\cdots\\otimes\\omega^s)$$\n\
  $$=X_k(\\omega^l)X_1\\otimes\\cdots\\otimes\\widehat{X_k}\\otimes\\cdots\\otimes\
  \ X_r\\otimes\\omega^1\\otimes\\cdots\\otimes\\widehat{\\omega^l}\\otimes\\cdots\\\
  otimes\\omega^s$$\n\n对所有向量场 \\(X_1,\\ldots,X_r\\) 在 \\(\\mathfrak X(M)\\) 中以及所有余向量场\
  \ \\(\\omega^1,\\ldots,\\omega^s\\) 在 \\(\\mathfrak X^*(M)\\) 中成立，其中 \\(\\widehat{\\\
  phantom X}\\) 表示省略一项。\n\n## 定理 15.14.4. 设 \\(M\\) 为光滑流形，设 \\(\\mathcal A\\) 为 \\\
  (\\mathcal T^r_s(M)\\) 中的张量场，设 \\(\\omega^1,\\ldots,\\omega^r\\) 为 \\(\\mathfrak\
  \ X^*(M)\\) 中的余向量场，设 \\(X_1,\\ldots,X_s\\) 为 \\(\\mathfrak X(M)\\) 中的向量场。则存在一个在\
  \ \\(M\\) 上的收缩 \\(C\\) 使得\n\n$$\\mathcal A(\\omega^1,\\ldots,\\omega^r,X_1,\\ldots,X_s)=C(X_1\\\
  otimes\\cdots\\otimes X_s\\otimes\\mathcal A\\otimes\\omega^1\\otimes\\cdots\\otimes\\\
  omega^r).$$\n\n\n\n"
- "## 第16章\n## 光滑流形上的微分与积分\n### 16.1 外微分\n\n设 $M$ 是一个光滑 $m$ 维流形，回顾 $C^{\\infty}(M)=\\\
  Lambda^{0}(M)$ 且 $\\mathfrak{X}^{*}(M)=\\Lambda^{1}(M)$。因此，15.4节的外微分 $d : C^{\\\
  infty}(M) \\longrightarrow \\mathfrak{X}^{*}(M)$ 可表示为\n\n$d : \\Lambda^{0}(M) \\\
  longrightarrow \\Lambda^{1}(M).$\n\n根据定理15.4.6，$d$ 是线性的，并满足一种乘积法则。在本节中，我们描述 $d$\
  \ 的一个具有相应性质的推广。这一理论有三种等价的处理方式——公理化、局部和整体。\n\n### 定理16.1.1（外微分公理）。若 $M$ 是一个光滑 $m$\
  \ 维流形，则存在唯一一族线性映射\n\n$d : \\Lambda^{s}(M) \\longrightarrow \\Lambda^{s+1}(M)$\n\n\
  对 $s \\ge 0$ 定义，称为外微分，使得：\n\n- (a) $d : \\Lambda^{0}(M) \\longrightarrow \\Lambda^{1}(M)$\
  \ 是15.4节定义的外微分。\n- (b) 对所有 $\\Lambda^{s}(M)$ 中的形式 $\\omega$ 和 $\\Lambda^{s'}(M)$\
  \ 中的形式 $\\xi$，$d(\\omega \\wedge \\xi) = d(\\omega) \\wedge \\xi + (-1)^{s} \\omega\
  \ \\wedge d(\\xi)$。\n- (c) $d^{2}=0$；即对所有 $\\Lambda^{s}(M)$ 中的形式 $\\omega$，$d \\\
  circ d(\\omega)=0$。\n\n我们注意到，当 $s \\ge m$ 时，$\\Lambda^m(M)$ 是零向量空间，此时 $d$ 是零映射。对于\
  \ $C^\\infty(M) = \\Lambda^0(M)$ 中的任意函数 $f$ 以及 $\\Lambda^s(M)$ 中的任意形式 $\\omega$，由(15.8.3)有\
  \ $f\\omega = f \\wedge \\omega$，再由定理16.1.1(b)得\n\n$d(f\\omega) = d(f \\wedge \\\
  omega) = d(f) \\wedge \\omega + f \\wedge d(\\omega) = d(f) \\wedge \\omega + f\
  \ d(\\omega).    (16.1.1)$\n\n### 定理16.1.2（外微分的局部坐标表达式）。设 $M$ 是一个光滑 $m$ 维流形，$\\\
  omega$ 是 $\\Lambda^s(M)$ 中的一个形式，在局部坐标下设\n\n$\\omega = \\sum_{1 \\le i_1 < ... <\
  \ i_s \\le m} \\alpha_{i_1...i_s} d(x^{i_1}) \\wedge \\cdots \\wedge d(x^{i_s}).$\n\
  \n则\n\n$d(\\omega) = \\sum_{1 \\le i_1 < ... < i_s \\le m} d(\\alpha_{i_1...i_s})\
  \ \\wedge d(x^{i_1}) \\wedge \\cdots \\wedge d(x^{i_s}).$\n\n定理16.1.2以后会经常使用，通常不再注明。\n\
  \n### 定理16.1.3（外微分的整体表达式）。设 $M$ 是一个光滑 $m$ 维流形，$\\omega$ 是 $\\Lambda^s(M)$ 中的一个形式，且\
  \ $X_1, ..., X_{s+1}$ 是 $\\mathfrak{X}(M)$ 中的向量场。则\n\n$d(\\omega)(X_1, ..., X_{s+1})$\n\
  $= \\sum_{i=1}^{s+1} (-1)^{i-1} X_i(\\omega(X_1, ..., \\hat{X_i}, ..., X_{s+1}))$\n\
  $+ \\sum_{1 \\le i < j \\le s+1} (-1)^{i+j} \\omega([X_i, X_j], X_1, ..., \\hat{X_i},\
  \ ..., \\hat{X_j}, ..., X_{s+1}),$\n\n其中 ^ 表示省略了相应项。\n\n### 例16.1.4. 在定理16.1.3中令\
  \ $s = 1$ 得\n\n$d(\\omega)(X_1, X_2) = X_1(\\omega(X_2)) - X_2(\\omega(X_1)) - \\\
  omega([X_1, X_2]).$\n\n下一个结果是定理15.11.2的推广。\n\n### 定理16.1.5（形式的拉回与外微分的交换性）。若 $M$\
  \ 和 $N$ 是光滑流形，且 $F : M \\longrightarrow N$ 是光滑映射，则\n\n$F^* \\circ d = d \\circ F^*;$\n\
  \n即对所有 $\\Lambda^s(M)$ 中的形式 $\\omega$，有\n\n$F^*(d(\\omega)) = d(F^*(\\omega)).$\n\
  \n下面三个例子表明，外微分与10.6节中介绍的经典旋度、梯度和散度算子有关。\n\n### 例16.1.6（旋度）。\n\n设 $\\alpha_1,\\alpha_2,\\\
  alpha_3$ 是 $C^\\infty(\\mathbb{R}^3)$ 中的函数，并通过下式定义 $\\mathfrak{X}^*(\\mathbb{R}^3)=\\\
  Lambda^1(\\mathbb{R}^3)$ 中的余向量场 $\\omega$：\n\n$$\\omega=\\alpha_1d(x)+\\alpha_2d(y)+\\\
  alpha_3d(z).$$\n\n暂时将 $(x,y,z)$ 记为 $(x^1,x^2,x^3)$，则有\n\n$$\\begin{aligned}\nd(\\\
  omega)&=d\\left(\\sum_i\\alpha_i d(x^i)\\right)=\\sum_i d\\left(\\alpha_i d(x^i)\\\
  right)=\\sum_i\\left[d(\\alpha_i)\\wedge d(x^i)+\\alpha_i d^2(x^i)\\right]\\\\\n\
  &=\\sum_i\\left[\\left(\\sum_j\\frac{\\partial\\alpha_i}{\\partial x^j}d(x^j)\\\
  right)\\wedge d(x^i)\\right]=\\sum_{ij}\\frac{\\partial\\alpha_i}{\\partial x^j}d(x^j)\\\
  wedge d(x^i)\\\\\n&=\\sum_{1\\le i<j\\le m}\\frac{\\partial\\alpha_i}{\\partial\
  \ x^j}d(x^j)\\wedge d(x^i)+\\sum_{1\\le j<i\\le m}\\frac{\\partial\\alpha_i}{\\\
  partial x^j}d(x^j)\\wedge d(x^i)\\\\\n&=-\\sum_{1\\le i<j\\le m}\\frac{\\partial\\\
  alpha_i}{\\partial x^j}d(x^i)\\wedge d(x^j)+\\sum_{1\\le i<j\\le m}\\frac{\\partial\\\
  alpha_j}{\\partial x^i}d(x^i)\\wedge d(x^j)\\\\\n&=\\sum_{1\\le i<j\\le m}\\left(\\\
  frac{\\partial\\alpha_j}{\\partial x^i}-\\frac{\\partial\\alpha_i}{\\partial x^j}\\\
  right)d(x^i)\\wedge d(x^j).\n\\end{aligned}$$\n\n其中第三个等号由(16.1.1)得到，第四个等号由定理15.4.7和定理16.1.1(c)得到，第六个等号由定理15.8.2(c)得到，第七个等号由定理15.8.2(b)得到。回到先前的记号，得\n\
  \n$$\\begin{aligned}\nd(\\omega)&=\\left(\\frac{\\partial\\alpha_2}{\\partial x}-\\\
  frac{\\partial\\alpha_1}{\\partial y}\\right)d(x)\\wedge d(y)+\\left(\\frac{\\partial\\\
  alpha_3}{\\partial x}-\\frac{\\partial\\alpha_1}{\\partial z}\\right)d(x)\\wedge\
  \ d(z)\\\\\n&\\quad+\\left(\\frac{\\partial\\alpha_3}{\\partial y}-\\frac{\\partial\\\
  alpha_2}{\\partial z}\\right)d(y)\\wedge d(z)\\\\\n&=\\left(\\frac{\\partial\\alpha_3}{\\\
  partial y}-\\frac{\\partial\\alpha_2}{\\partial z}\\right)d(y)\\wedge d(z)+\\left(\\\
  frac{\\partial\\alpha_1}{\\partial z}-\\frac{\\partial\\alpha_3}{\\partial x}\\\
  right)d(z)\\wedge d(x)\\\\\n&\\quad+\\left(\\frac{\\partial\\alpha_2}{\\partial\
  \ x}-\\frac{\\partial\\alpha_1}{\\partial y}\\right)d(x)\\wedge d(y).\n\\end{aligned}\\\
  tag{16.1.2}$$\n\n与 $\\omega$ 对应，我们定义光滑映射 $F=(\\alpha_1,\\alpha_2,\\alpha_3):\\mathbb{R}^3\\\
  to\\mathbb{R}^3$。回顾第10.6节，\n\n$$\\operatorname{curl}(F)=\\left(\\frac{\\partial\\\
  alpha_3}{\\partial y}-\\frac{\\partial\\alpha_2}{\\partial z},\\frac{\\partial\\\
  alpha_1}{\\partial z}-\\frac{\\partial\\alpha_3}{\\partial x},\\frac{\\partial\\\
  alpha_2}{\\partial x}-\\frac{\\partial\\alpha_1}{\\partial y}\\right).$$\n\n因此，$d(\\\
  omega)$ 的分量与 $\\operatorname{curl}(F)$ 的分量相同。\n\n### 例16.1.7（梯度）。\n\n设 $f$ 是 $C^\\\
  infty(M)=\\Lambda^0(M)$ 中的函数。由第10.6节和式(11.4.3)有\n\n$$\\operatorname{grad}(f)=\\\
  left(\\frac{\\partial f}{\\partial x},\\frac{\\partial f}{\\partial y},\\frac{\\\
  partial f}{\\partial z}\\right).$$\n\n并由定理15.4.7，有\n\n$d(f) = \\frac{\\partial f}{\\\
  partial x} d(x) + \\frac{\\partial f}{\\partial y} d(y) + \\frac{\\partial f}{\\\
  partial z} d(z).$\n\n将 $\\omega = d(f)$ 和 $(\\alpha_1, \\alpha_2, \\alpha_3) = \\\
  operatorname{grad}(f)$ 代入(16.1.2)，得\n\n$d^2(f) = \\left(\\frac{\\partial^2 f}{\\\
  partial y \\partial z} - \\frac{\\partial^2 f}{\\partial z \\partial y}\\right)\
  \ d(y) \\wedge d(z) + \\left(\\frac{\\partial^2 f}{\\partial z \\partial x} - \\\
  frac{\\partial^2 f}{\\partial x \\partial z}\\right) d(z) \\wedge d(x)$\n\n$+ \\\
  left(\\frac{\\partial^2 f}{\\partial x \\partial y} - \\frac{\\partial^2 f}{\\partial\
  \ y \\partial x}\\right) d(x) \\wedge d(y).$\n\n由混合偏导数的相等性（定理10.1.6）可知 $d^2(f) =\
  \ 0$，这与定理16.1.1(c)的预期一致。换一个角度看，$d^2 = 0$ 是用外微分表达混合偏导数相等性的一种方式。鉴于例16.1.6中提到的 $d(\\\
  omega)$ 与 $\\operatorname{curl}(F)$ 之间的联系，我们现在看到 $d^2(f) = 0$ 等价于 $\\operatorname{curl}(\\\
  operatorname{grad}(f)) = 0$，即定理10.6.1(c)。\n\n### 例16.1.8（散度）。\n\n设 $\\alpha_1, \\\
  alpha_2, \\alpha_3$ 是 $C^\\infty(\\mathbb{R}^3)$ 中的函数，并通过下式定义 $\\Lambda^2(\\mathbb{R}^3)$\
  \ 中的形式 $\\xi$：\n\n$\\xi = \\alpha_1 d(y) \\wedge d(z) + \\alpha_2 d(z) \\wedge d(x)\
  \ + \\alpha_3 d(x) \\wedge d(y).$\n\n按照例16.1.6的方式计算得\n\n$d(\\xi) = \\left(\\frac{\\\
  partial \\alpha_1}{\\partial x} + \\frac{\\partial \\alpha_2}{\\partial y} + \\\
  frac{\\partial \\alpha_3}{\\partial z}\\right) d(x) \\wedge d(y) \\wedge d(z). \\\
  qquad (16.1.3)$\n\n与 $\\xi$ 对应，我们定义光滑映射 $F = (\\alpha_1, \\alpha_2, \\alpha_3) :\
  \ \\mathbb{R}^3 \\longrightarrow \\mathbb{R}^3$。回顾第10.6节，\n\n$\\operatorname{div}(F)\
  \ = \\frac{\\partial \\alpha_1}{\\partial x} + \\frac{\\partial \\alpha_2}{\\partial\
  \ y} + \\frac{\\partial \\alpha_3}{\\partial z}.$\n\n因此，$d(\\xi)$ 的唯一分量等于 $\\operatorname{div}(F)$。\n\
  \n取 $\\omega$ 如例16.1.6中所示，由(16.1.2)知 $d(\\omega)$ 是 $\\Lambda^2(\\mathbb{R}^3)$\
  \ 中的一个形式。在(16.1.3)中令 $\\xi = d(\\omega)$，得\n\n$d^2(\\omega) = \\left[\\frac{\\partial}{\\\
  partial x}\\left(\\frac{\\partial \\alpha_3}{\\partial y} - \\frac{\\partial \\\
  alpha_2}{\\partial z}\\right) + \\frac{\\partial}{\\partial y}\\left(\\frac{\\partial\
  \ \\alpha_1}{\\partial z} - \\frac{\\partial \\alpha_3}{\\partial x}\\right) + \\\
  frac{\\partial}{\\partial z}\\left(\\frac{\\partial \\alpha_2}{\\partial x} - \\\
  frac{\\partial \\alpha_1}{\\partial y}\\right)\\right]$ \n$\\cdot d(x) \\wedge d(y)\
  \ \\wedge d(z)$\n\n$= \\left[\\left(\\frac{\\partial^2 \\alpha_3}{\\partial x \\\
  partial y} - \\frac{\\partial^2 \\alpha_2}{\\partial x \\partial z}\\right) + \\\
  left(\\frac{\\partial^2 \\alpha_1}{\\partial y \\partial z} - \\frac{\\partial^2\
  \ \\alpha_3}{\\partial y \\partial x}\\right) + \\left(\\frac{\\partial \\alpha_2}{\\\
  partial z \\partial x} - \\frac{\\partial^2 \\alpha_1}{\\partial z \\partial y}\\\
  right)\\right]$ \n$\\cdot d(x) \\wedge d(y) \\wedge d(z).$\n\n由混合偏导数的相等性（定理10.1.6）可知\
  \ $d^2(\\omega) = 0$，这与定理16.1.1(c)的预期一致。鉴于例16.1.6中提到的 $d(\\omega)$ 与 $\\operatorname{curl}(F)$\
  \ 之间的联系，我们现在看到 $d^2(\\omega) = 0$ 等价于 $\\operatorname{div}(\\operatorname{curl}(F))\
  \ = 0$，即定理10.6.1(d)。\n\n\n\n\n我们以两个与电动力学相关的计算来结束本节，它们将在第 22.2 节中用到。\n\n### 例 16.1.9（电动力学）。\n\
  \n设 $(x, y, z, t)$ 是 $\\mathbb{R}^4$ 上的标准坐标，设 $\\alpha_1, \\alpha_2, \\alpha_3,\
  \ \\alpha_4$ 是 $C^\\infty(\\mathbb{R}^4)$ 中的函数，并定义 $\\mathfrak{X}^*(\\mathbb{R}^4)$\
  \ 中的余向量场 $\\omega$ 如下：\n\n$$\n\\omega = \\alpha_1 d(x) + \\alpha_2 d(y) + \\alpha_3\
  \ d(z) + \\alpha_4 d(t).\n$$\n\n则\n\n$$\nd(\\omega) = d(\\alpha_1) \\wedge d(x)\
  \ + d(\\alpha_2) \\wedge d(y) + d(\\alpha_3) \\wedge d(z) + d(\\alpha_4) \\wedge\
  \ d(t).\n$$\n\n我们有\n\n$$\nd(\\alpha_1) \\wedge d(x) = \\left(\\frac{\\partial \\\
  alpha_1}{\\partial x} d(x) + \\frac{\\partial \\alpha_1}{\\partial y} d(y) + \\\
  frac{\\partial \\alpha_1}{\\partial z} d(z) + \\frac{\\partial \\alpha_1}{\\partial\
  \ t} d(t)\\right) \\wedge d(x)\n$$\n\n$$\n= \\frac{\\partial \\alpha_1}{\\partial\
  \ y} d(y) \\wedge d(x) + \\frac{\\partial \\alpha_1}{\\partial z} d(z) \\wedge d(x)\
  \ + \\frac{\\partial \\alpha_1}{\\partial t} d(t) \\wedge d(x)\n$$\n\n$$\n= - \\\
  frac{\\partial \\alpha_1}{\\partial y} d(x) \\wedge d(y) - \\frac{\\partial \\alpha_1}{\\\
  partial z} d(x) \\wedge d(z) - \\frac{\\partial \\alpha_1}{\\partial t} d(x) \\\
  wedge d(t).\n$$\n\n类似地，\n\n$$\nd(\\alpha_2) \\wedge d(y) = \\frac{\\partial \\alpha_2}{\\\
  partial x} d(x) \\wedge d(y) - \\frac{\\partial \\alpha_2}{\\partial z} d(y) \\\
  wedge d(z) - \\frac{\\partial \\alpha_2}{\\partial t} d(y) \\wedge d(t)\n$$\n\n\
  $$\nd(\\alpha_3) \\wedge d(z) = \\frac{\\partial \\alpha_3}{\\partial x} d(x) \\\
  wedge d(z) + \\frac{\\partial \\alpha_3}{\\partial y} d(y) \\wedge d(z) - \\frac{\\\
  partial \\alpha_3}{\\partial t} d(z) \\wedge d(t)\n$$\n\n$$\nd(\\alpha_4) \\wedge\
  \ d(t) = \\frac{\\partial \\alpha_4}{\\partial x} d(x) \\wedge d(t) + \\frac{\\\
  partial \\alpha_4}{\\partial y} d(y) \\wedge d(t) + \\frac{\\partial \\alpha_4}{\\\
  partial z} d(z) \\wedge d(t).\n$$\n\n因此，\n\n$$\nd(\\omega) = \\left(\\frac{\\partial\
  \ \\alpha_4}{\\partial x} - \\frac{\\partial \\alpha_1}{\\partial t}\\right) d(x)\
  \ \\wedge d(t) + \\left(\\frac{\\partial \\alpha_4}{\\partial y} - \\frac{\\partial\
  \ \\alpha_2}{\\partial t}\\right) d(y) \\wedge d(t) + \\left(\\frac{\\partial \\\
  alpha_4}{\\partial z} - \\frac{\\partial \\alpha_3}{\\partial t}\\right) d(z) \\\
  wedge d(t) + \\left(\\frac{\\partial \\alpha_3}{\\partial y} - \\frac{\\partial\
  \ \\alpha_2}{\\partial z}\\right) d(y) \\wedge d(z) + \\left(\\frac{\\partial \\\
  alpha_1}{\\partial z} - \\frac{\\partial \\alpha_3}{\\partial x}\\right) d(z) \\\
  wedge d(x) + \\left(\\frac{\\partial \\alpha_2}{\\partial x} - \\frac{\\partial\
  \ \\alpha_1}{\\partial y}\\right) d(x) \\wedge d(y).\n$$\n\n### 例 16.1.10（电动力学）。\n\
  \n设 $(x, y, z, t)$ 是 $\\mathbb{R}^4$ 上的标准坐标，并设 $\\alpha_1, \\alpha_2, \\alpha_3,\
  \ \\beta_1, \\beta_2, \\beta_3$ 是 $C^\\infty(\\mathbb{R}^4)$ 中的函数。定义 $\\mathfrak{X}^*(\\\
  mathbb{R}^4)$ 中的余向量场 $\\xi$ 以及 $\\Lambda^2(\\mathbb{R}^4)$ 中的微分形式 $\\zeta, \\varphi$\
  \ 如下：\n\n$$\n\\xi = \\alpha_1 d(x) + \\alpha_2 d(y) + \\alpha_3 d(z),\n$$\n\n$$\n\
  \\zeta = \\beta_1 d(y) \\wedge d(z) + \\beta_2 d(z) \\wedge d(x) + \\beta_3 d(x)\
  \ \\wedge d(y),\n$$\n\n以及\n\n$$\n\\varphi=\\xi\\wedge d(t)+\\zeta\n$$\n\n$$\n=\\\
  alpha_1d(x)\\wedge d(t)+\\alpha_2d(y)\\wedge d(t)+\\alpha_3d(z)\\wedge d(t)\n$$\n\
  \n$$\n\\quad+\\beta_1d(y)\\wedge d(z)+\\beta_2d(z)\\wedge d(x)+\\beta_3d(x)\\wedge\
  \ d(y).\n$$\n\n我们求下式的另一种表达式：\n\n$$\nd(\\varphi)=d(\\alpha_1)\\wedge d(x)\\wedge\
  \ d(t)+d(\\alpha_2)\\wedge d(y)\\wedge d(t)+d(\\alpha_3)\\wedge d(z)\\wedge d(t)\n\
  $$\n\n$$\n\\quad+d(\\beta_1)\\wedge d(y)\\wedge d(z)+d(\\beta_2)\\wedge d(z)\\wedge\
  \ d(x)+d(\\beta_3)\\wedge d(x)\\wedge d(y).\n$$\n\n我们有\n\n$$\nd(\\alpha_1)\\wedge\
  \ d(x)\\wedge d(t)\n$$\n\n$$\n=\\left(\\frac{\\partial\\alpha_1}{\\partial x}d(x)+\\\
  frac{\\partial\\alpha_1}{\\partial y}d(y)+\\frac{\\partial\\alpha_1}{\\partial z}d(z)+\\\
  frac{\\partial\\alpha_1}{\\partial t}d(t)\\right)\\wedge d(x)\\wedge d(t)\n$$\n\n\
  $$\n=\\frac{\\partial\\alpha_1}{\\partial x}d(x)\\wedge d(x)\\wedge d(t)+\\frac{\\\
  partial\\alpha_1}{\\partial y}d(y)\\wedge d(x)\\wedge d(t)\n$$\n\n$$\n\\quad+\\\
  frac{\\partial\\alpha_1}{\\partial z}d(z)\\wedge d(x)\\wedge d(t)+\\frac{\\partial\\\
  alpha_1}{\\partial t}d(t)\\wedge d(x)\\wedge d(t)\n$$\n\n$$\n=-\\frac{\\partial\\\
  alpha_1}{\\partial y}d(x)\\wedge d(y)\\wedge d(t)-\\frac{\\partial\\alpha_1}{\\\
  partial z}d(x)\\wedge d(z)\\wedge d(t).\n$$\n\n类似地，\n\n$$\nd(\\alpha_2)\\wedge d(y)\\\
  wedge d(t)=\\frac{\\partial\\alpha_2}{\\partial x}d(x)\\wedge d(y)\\wedge d(t)-\\\
  frac{\\partial\\alpha_2}{\\partial z}d(y)\\wedge d(z)\\wedge d(t)\n$$\n\n$$\nd(\\\
  alpha_3)\\wedge d(z)\\wedge d(t)=\\frac{\\partial\\alpha_3}{\\partial x}d(x)\\wedge\
  \ d(z)\\wedge d(t)+\\frac{\\partial\\alpha_3}{\\partial y}d(y)\\wedge d(z)\\wedge\
  \ d(t)\n$$\n\n$$\nd(\\beta_1)\\wedge d(y)\\wedge d(z)=\\frac{\\partial\\beta_1}{\\\
  partial x}d(x)\\wedge d(y)\\wedge d(z)+\\frac{\\partial\\beta_1}{\\partial t}d(y)\\\
  wedge d(z)\\wedge d(t)\n$$\n\n$$\nd(\\beta_2)\\wedge d(z)\\wedge d(x)=\\frac{\\\
  partial\\beta_2}{\\partial y}d(x)\\wedge d(y)\\wedge d(z)-\\frac{\\partial\\beta_2}{\\\
  partial t}d(x)\\wedge d(z)\\wedge d(t)\n$$\n\n$$\nd(\\beta_3)\\wedge d(x)\\wedge\
  \ d(y)=\\frac{\\partial\\beta_3}{\\partial z}d(x)\\wedge d(y)\\wedge d(z)+\\frac{\\\
  partial\\beta_3}{\\partial t}d(x)\\wedge d(y)\\wedge d(t).\n$$\n\n因此，\n\n$$\nd(\\\
  varphi)=\\left(\\frac{\\partial\\beta_1}{\\partial x}+\\frac{\\partial\\beta_2}{\\\
  partial y}+\\frac{\\partial\\beta_3}{\\partial z}\\right)d(x)\\wedge d(y)\\wedge\
  \ d(z)\n$$\n\n$$\n\\quad+\\left(\\frac{\\partial\\alpha_2}{\\partial x}-\\frac{\\\
  partial\\alpha_1}{\\partial y}+\\frac{\\partial\\beta_3}{\\partial t}\\right)d(x)\\\
  wedge d(y)\\wedge d(t)\n$$\n\n$$\n\\quad-\\left(\\frac{\\partial\\alpha_1}{\\partial\
  \ z}-\\frac{\\partial\\alpha_3}{\\partial x}+\\frac{\\partial\\beta_2}{\\partial\
  \ t}\\right)d(x)\\wedge d(z)\\wedge d(t)\n$$\n\n$$\n\\quad+\\left(\\frac{\\partial\\\
  alpha_3}{\\partial y}-\\frac{\\partial\\alpha_2}{\\partial z}+\\frac{\\partial\\\
  beta_1}{\\partial t}\\right)d(y)\\wedge d(z)\\wedge d(t).\n$$\n\n## 16.2 张量导子\n\n\
  光滑流形 $M$ 上的一个张量导子是一个线性映射族 $\\mathbf{D}$：\n\n$$\n\\mathbf{D}^{r}_{s}:\\mathcal{T}^{r}_{s}(M)\\\
  longrightarrow \\mathcal{T}^{r}_{s}(M)\n$$\n\n它对 $r,s\\geq 0$ 有定义，并且使得对于所有 $\\mathcal{T}^{r}_{s}(M)$\
  \ 中的张量场 $\\mathcal{A}$ 和 $\\mathcal{T}^{r'}_{s'}(M)$ 中的张量场 $\\mathcal{B}$，以及所有 $(k,l)$-缩并\
  \ $C^k_l$，有：\n\n**[D1]**\n$$\n\\mathbf{D}^{r+r'}_{s+s'}(\\mathcal{A}\\otimes\\mathcal{B})=\\\
  mathbf{D}^{r}_{s}(\\mathcal{A})\\otimes\\mathcal{B}+\\mathcal{A}\\otimes\\mathbf{D}^{r'}_{s'}(\\\
  mathcal{B}).\n$$\n\n**[D2]**\n$$\nC^k_l\\circ\\mathbf{D}^{r}_{s}(\\mathcal{A})=\\\
  mathbf{D}^{r-1}_{s-1}\\circ C^k_l(\\mathcal{A}).\n$$\n\n[D1] 是张量场的一种乘积法则，而 [D2]\
  \ 说明“缩并与张量导子可交换”。\n\n**定理 16.2.1.** 设 $M$ 是一个光滑流形，$\\mathbf{D}$ 是 $M$ 上的一个张量导子，并设\
  \ $\\mathcal{A}_i$ 是 $\\mathcal{T}^{r_i}_{s_i}(M)$ 中的张量场，$i=1,\\ldots,k$。则\n\n$$\n\
  \\mathbf{D}^{r_1+\\cdots+r_k}_{s_1+\\cdots+s_k}(\\mathcal{A}_1\\otimes\\cdots\\\
  otimes\\mathcal{A}_k)=\\sum_{i=1}^{k}\\mathcal{A}_1\\otimes\\cdots\\otimes\\mathbf{D}^{r_i}_{s_i}(\\\
  mathcal{A}_i)\\otimes\\cdots\\otimes\\mathcal{A}_k.\n$$\n\n*证明.* 这可由 [D1] 通过归纳论证得到。\n\
  \n**定理 16.2.2.** 设 $M$ 是一个光滑流形，$\\mathbf{D}$ 是 $M$ 上的一个张量导子，设 $f$ 是 $C^\\infty(M)$\
  \ 中的一个函数，并设 $\\mathcal{A}$ 是 $\\mathcal{T}^{r}_{s}(M)$ 中的张量场。则：\n\n(a) $\\mathbf{D}^{0}_{0}$\
  \ 是 $\\mathfrak{X}(M)$ 中的一个向量场。\n\n(b) $\\mathbf{D}^{r}_{s}(f\\mathcal{A})=\\mathbf{D}^{0}_{0}(f)\\\
  mathcal{A}+f\\mathbf{D}^{r}_{s}(\\mathcal{A})$。\n\n*证明.* (a)：对于 $C^\\infty(M)=\\\
  mathcal{T}^{0}_{0}(M)$ 中的函数 $f,g$，由 [D1] 我们有\n\n$$\n\\mathbf{D}^{0}_{0}(fg)=f\\\
  mathbf{D}^{0}_{0}(g)+g\\mathbf{D}^{0}_{0}(f).\n$$\n\n因此，$\\mathbf{D}^{0}_{0}$ 是\
  \ $C^\\infty(M)$ 上的一个导子。此结论现在可由定理 15.2.1 给出的等同关系推出。\n\n(b)：由于 $f$ 是 $C^\\infty(M)=\\\
  mathcal{T}^{0}_{0}(M)$ 中的函数，$\\mathbf{D}^{0}_{0}(f)$ 也是。根据定义，$f\\otimes\\mathcal{A}=f\\\
  mathcal{A}$，且 $\\mathbf{D}^{0}_{0}(f)\\otimes\\mathcal{A}=\\mathbf{D}^{0}_{0}(f)\\\
  mathcal{A}$。于是 [D1] 给出\n\n$$\n\\mathbf{D}^{r}_{s}(f\\mathcal{A})=\\mathbf{D}^{0}_{0}(f)\\\
  otimes\\mathcal{A}+f\\otimes\\mathbf{D}^{r}_{s}(\\mathcal{A})=\\mathbf{D}^{0}_{0}(f)\\\
  mathcal{A}+f\\mathbf{D}^{r}_{s}(\\mathcal{A}).\n$$\n\n**例 16.2.3.** 设 $M$ 是一个光滑流形，$\\\
  mathbf{D}$ 是 $M$ 上的一个张量导子，并设 $\\mathcal{A}$ 是 $\\mathcal{T}^{1}_{1}(M)$ 中的张量场。我们寻求\
  \ $\\mathbf{D}^{1}_{1}(\\mathcal{A})$ 的显式表达式。设 $X=\\mathbf{D}^{0}_{0}$ 为由定理 16.2.2(a)\
  \ 给出的 $\\mathfrak{X}(M)$ 中的向量场，并令 $C=C^1_1\\circ C^2_2$。两次使用 [D2] 可得 $\\mathbf{D}^{0}_{0}\\\
  circ C=C\\circ\\mathbf{D}^{2}_{2}$。对于余向量\n\n\n\n对于 \\(\\mathfrak{X}^*(M)\\) 中的余向量场\
  \ \\(\\omega\\) 和 \\(\\mathfrak{X}(M)\\) 中的向量场 \\(Y\\)，我们有\n\n\\[\nX(\\mathcal{A}(\\\
  omega,Y))\n= D_0^0(\\mathcal{A}(\\omega,Y))\n= D_0^0(C(Y\\otimes\\mathcal{A}\\otimes\\\
  omega))\n= C(D_2^2(Y\\otimes\\mathcal{A}\\otimes\\omega))\n= C(D_1^0(Y)\\otimes\\\
  mathcal{A}\\otimes\\omega + Y\\otimes D_1^1(\\mathcal{A})\\otimes\\omega + Y\\otimes\\\
  mathcal{A}\\otimes D_1^0(\\omega))\n= C(D_1^0(Y)\\otimes\\mathcal{A}\\otimes\\omega)\
  \ + C(Y\\otimes D_1^1(\\mathcal{A})\\otimes\\omega) + C(Y\\otimes\\mathcal{A}\\\
  otimes D_1^0(\\omega))\n= \\mathcal{A}(\\omega,D_0^1(Y)) + D_1^1(\\mathcal{A})(\\\
  omega,Y) + \\mathcal{A}(D_1^0(\\omega),Y),\n\\]\n\n其中第二个和第六个等号由例 5.4.6 的流形版本得到，第三个等号由\
  \ [D2] 得到。因此，\n\n\\[\nD_1^1(\\mathcal{A})(\\omega,Y)\n= X(\\mathcal{A}(\\omega,Y))\
  \ - \\mathcal{A}(D_1^0(\\omega),Y) - \\mathcal{A}(\\omega,D_0^1(Y)).\n\\]\n\n注意，在上述计算中，我们隐式地使用了定理\
  \ 15.7.2，将 \\(\\mathcal{A}\\) 等同于 \\(\\operatorname{Mult}_{C^\\infty(M)}(\\mathfrak{X}^*(M)\\\
  times\\mathfrak{X}(M),C^\\infty(M))\\) 中的一个映射。下一个结果用同样的方法推广了例 16.2.3。\n\n### 定理\
  \ 16.2.4（张量导子的整体表达式）。\n\n设 \\(M\\) 为光滑流形，\\(D\\) 为 \\(M\\) 上的张量导子，并令 \\(X = D_0^0\\\
  ) 为定理 16.2.2(a) 给出的 \\(\\mathfrak{X}(M)\\) 中的向量场。设 \\(\\mathcal{A}\\) 为 \\(\\mathcal{T}_s^r(M)\\\
  ) 中的张量场，\\(\\omega^1,\\ldots,\\omega^r\\) 为 \\(\\mathfrak{X}^*(M)\\) 中的余向量场，\\(Y_1,\\\
  ldots,Y_s\\) 为 \\(\\mathfrak{X}(M)\\) 中的向量场。则\n\n\\[\n\\begin{aligned}\nD_s^r(\\\
  mathcal{A})(\\omega^1,\\ldots,\\omega^r,Y_1,\\ldots,Y_s)\n&= X(\\mathcal{A}(\\omega^1,\\\
  ldots,\\omega^r,Y_1,\\ldots,Y_s)) \\\\\n&\\quad -\\sum_{i=1}^{r}\\mathcal{A}(\\\
  omega^1,\\ldots,\\omega^{i-1},D_1^0(\\omega^i),\\omega^{i+1},\\ldots,\\omega^r,Y_1,\\\
  ldots,Y_s) \\\\\n&\\quad -\\sum_{j=1}^{s}\\mathcal{A}(\\omega^1,\\ldots,\\omega^r,Y_1,\\\
  ldots,Y_{j-1},D_0^1(Y_j),Y_{j+1},\\ldots,Y_s).\n\\end{aligned}\n\\tag{16.2.1}\n\\\
  ]\n\n**证明。** 该证明是对例 16.2.3 的详细展开。我们有\n\n\\[\n\\begin{aligned}\nX(\\mathcal{A}(\\\
  omega^1,\\ldots,\\omega^r,Y_1,\\ldots,Y_s))\n&= D_0^0(\\mathcal{A}(\\omega^1,\\\
  ldots,\\omega^r,Y_1,\\ldots,Y_s)) \\\\\n&= D_0^0(C(Y_1\\otimes\\cdots\\otimes Y_s\\\
  otimes\\mathcal{A}\\otimes\\omega^1\\otimes\\cdots\\otimes\\omega^r)) \\\\\n&= C(D_{s+r}^{s+r}(Y_1\\\
  otimes\\cdots\\otimes Y_s\\otimes\\mathcal{A}\\otimes\\omega^1\\otimes\\cdots\\\
  otimes\\omega^r)) \\\\\n&= C\\Bigl(\\sum_{j=1}^{s}Y_1\\otimes\\cdots\\otimes D_0^1(Y_j)\\\
  otimes\\cdots\\otimes Y_s\\otimes\\mathcal{A}\\otimes\\omega^1\\otimes\\cdots\\\
  otimes\\omega^r \\\\\n&\\qquad + Y_1\\otimes\\cdots\\otimes Y_s\\otimes D_s^r(\\\
  mathcal{A})\\otimes\\omega^1\\otimes\\cdots\\otimes\\omega^r \\\\\n&\\qquad + \\\
  sum_{i=1}^{r}Y_1\\otimes\\cdots\\otimes Y_s\\otimes\\mathcal{A}\\otimes\\omega^1\\\
  otimes\\cdots\\otimes D_1^0(\\omega^i)\\otimes\\cdots\\otimes\\omega^r\\Bigr) \\\
  \\\n&= \\sum_{j=1}^{s}C(Y_1\\otimes\\cdots\\otimes D_0^1(Y_j)\\otimes\\cdots\\otimes\
  \ Y_s\\otimes\\mathcal{A}\\otimes\\omega^1\\otimes\\cdots\\otimes\\omega^r) \\\\\
  \n&\\quad + C(Y_1\\otimes\\cdots\\otimes Y_s\\otimes D_s^r(\\mathcal{A})\\otimes\\\
  omega^1\\otimes\\cdots\\otimes\\omega^r) \\\\\n&\\quad + \\sum_{i=1}^{r}C(Y_1\\\
  otimes\\cdots\\otimes Y_s\\otimes\\mathcal{A}\\otimes\\omega^1\\otimes\\cdots\\\
  otimes D_1^0(\\omega^i)\\otimes\\cdots\\otimes\\omega^r) \\\\\n&= \\sum_{j=1}^{s}\\\
  mathcal{A}(\\omega^1,\\ldots,\\omega^r,Y_1,\\ldots,Y_{j-1},D_0^1(Y_j),Y_{j+1},\\\
  ldots,Y_s) \\\\\n&\\quad + D_s^r(\\mathcal{A})(\\omega^1,\\ldots,\\omega^r,Y_1,\\\
  ldots,Y_s) \\\\\n&\\quad + \\sum_{i=1}^{r}\\mathcal{A}(\\omega^1,\\ldots,\\omega^{i-1},D_1^0(\\\
  omega^i),\\omega^{i+1},\\ldots,\\omega^r,Y_1,\\ldots,Y_s),\n\\end{aligned}\n\\]\n\
  \n其中第二个和第六个等号由定理 15.14.4 得到，第三个等号由 [D2] 得到。结论得证。\n\n### 例 16.2.5。\n\n对于 \\(\\mathfrak{X}^*(M)=\\\
  mathcal{T}_1^0(M)\\) 中的余向量场 \\(\\omega\\) 和 \\(\\mathfrak{X}(M)\\) 中的向量场 \\(Y\\\
  )，在定理 16.2.4 中令 \\(r=0\\)、\\(s=1\\)，可得\n\n\\[\nD_1^0(\\omega)(Y)=X(\\omega(Y))-\\\
  omega(D_0^1(Y)),\n\\tag{16.2.2}\n\\]\n\n其中 \\(X=D_0^0\\)。\n\n### 定理 16.2.6。\n\n\
  光滑流形 \\(M\\) 上的张量导子 \\(D\\) 由其在 \\(C^\\infty(M)\\) 和 \\(\\mathfrak{X}(M)\\) 上的取值唯一确定。\n\
  \n**证明。** 由定理 16.2.4 可以看出，\\(D\\) 由其在 \\(C^\\infty(M)\\)、\\(\\mathfrak{X}(M)\\)\
  \ 和 \\(\\mathfrak{X}^*(M)\\) 上的取值唯一确定。然而，(16.2.2) 表明 \\(D\\) 在 \\(\\mathfrak{X}^*(M)\\\
  ) 上的取值由其在 \\(\\mathfrak{X}(M)\\) 上的取值唯一确定。\n\n### 定理 16.2.7（张量导子的存在性）。\n\n设 \\(M\\\
  ) 为光滑流形，\\(X\\) 为 \\(\\mathfrak{X}(M)\\) 中的向量场，并设\n\n\\[\n\\mathcal{D}_X:\\mathfrak{X}(M)\\\
  longrightarrow\\mathfrak{X}(M)\n\\]\n\n是一个线性映射，使得\n\n\\[\n\\mathcal{D}_X(fY)=X(f)Y+f\\\
  mathcal{D}_X(Y)\n\\tag{16.2.3}\n\\]\n\n对所有 \\(C^\\infty(M)\\) 中的函数 \\(f\\) 和 \\\
  (\\mathfrak{X}(M)\\) 中的所有向量场 \\(Y\\) 成立。则在 \\(M\\) 上存在唯一一个张量导子 \\(D\\)，使得\n\n\\\
  [\nD_0^0=X \\quad\\text{且}\\quad D_0^1=\\mathcal{D}_X.\n\\tag{16.2.4}\n\\]\n\n**证明。**\
  \ 结合 (16.2.6) 和 (16.2.7) 可得\n\n\\[\nD_1^0(\\omega)(fY+Z)=fD_1^0(\\omega)(Y)+D_1^0(\\\
  omega)(Z),\n\\]\n\n这就证明了该结论。\n\n下一步是定义一个映射\n\n\\[\nD_1^0:\\mathfrak{X}^*(M)\\longrightarrow\\\
  operatorname{Lin}_{C^\\infty(M)}(\\mathfrak{X}(M),C^\\infty(M))\n\\tag{16.2.8}\n\
  \\]\n\n通过如下对应关系\n\n\\[\n\\omega\\longmapsto D_1^0(\\omega)\n\\]\n\n对所有 \\(\\mathfrak{X}^*(M)\\\
  ) 中的余向量场 \\(\\omega\\) 成立。我们有 \\(\\mathfrak{X}^*(M)=\\mathcal{T}_1^0(M)\\)，且由定理\
  \ 15.5.3，\\(\\operatorname{Lin}_{C^\\infty(M)}(\\mathfrak{X}(M),C^\\infty(M))\\\
  ) 可以与 \\(\\mathfrak{X}^*(M)\\) 等同。因此，(16.2.8) 可以表示为 \\(D_1^0:\\mathcal{T}_1^0(M)\\\
  longrightarrow\\mathcal{T}_1^0(M)\\)，这正是对应于 \\((r,s)=(0,1)\\) 的张量导子所需要的。\n\n还需证明\
  \ [D1] 和 [D2] 成立。设 \\(f\\) 为 \\(C^\\infty(M)\\) 中的函数，\\(\\omega\\) 为 \\(\\mathfrak{X}^*(M)\\\
  ) 中的余向量场，\\(Y\\) 为 \\(\\mathfrak{X}(M)\\) 中的向量场。则\n\n\\[\n\\begin{aligned}\nD_{0+1}^{0+0}(f\\\
  otimes\\omega)(Y)\n&= D_1^0(f\\omega)(Y) \\\\\n&= X(f\\omega(Y))-f\\omega(\\mathcal{D}_X(Y))\
  \ \\qquad [(16.2.5)] \\\\\n&= X(f)\\omega(Y)+fX(\\omega(Y))-f\\omega(\\mathcal{D}_X(Y))\
  \ \\qquad [(15.1.3)] \\\\\n&= D_0^0(f)\\omega(Y)+fD_1^0(\\omega)(Y) \\qquad [(16.2.4),\
  \ (16.2.5)] \\\\\n&= (D_0^0(f)\\otimes\\omega+f\\otimes D_1^0(\\omega))(Y).\n\\\
  end{aligned}\n\\]\n\n由于 \\(Y\\) 是任意的，\n\n\\[\nD_{0+1}^{0+0}(f\\otimes\\omega)=D_0^0(f)\\\
  otimes\\omega+f\\otimes D_1^0(\\omega),\n\\]\n\n因此 [D1] 成立。对于 \\((r,s)=(0,1)\\)，不可能进行缩并，所以\
  \ [D2] 平凡地成立。\n\n**唯一性。** 由 (16.2.2) 和 (16.2.4) 可知，(16.2.5) 是定义 \\(D_1^0\\) 的唯一选择。\n\
  \n## 16.3 形式导子\n\n光滑流形 \\(M\\) 上的形式导子是一族线性映射 \\(\\mathfrak{D}\\)\n\n\\[\n\\mathfrak{D}_s:\\\
  Lambda^s(M)\\longrightarrow\\Lambda^s(M)\n\\]\n\n对所有 \\(s\\ge 0\\) 定义，使得\n\n\\[\n\
  \\mathfrak{D}_{s+s'}(\\omega\\wedge\\xi)=\\mathfrak{D}_s(\\omega)\\wedge\\xi+\\\
  omega\\wedge\\mathfrak{D}_{s'}(\\xi)\n\\tag{16.3.1}\n\\]\n\n对所有 \\(\\Lambda^s(M)\\\
  ) 中的形式 \\(\\omega\\) 和 \\(\\Lambda^{s'}(M)\\) 中的 \\(\\xi\\) 成立。\n\n### 定理 16.3.1。\n\
  \n若 \\(M\\) 是光滑流形且 \\(\\mathfrak{D}\\) 是 \\(M\\) 上的形式导子，则在局部坐标下，\n\n\\[\n\\mathfrak{D}_s(d(x^1)\\\
  wedge\\cdots\\wedge d(x^s))=\\sum_i d(x^1)\\wedge\\cdots\\wedge\\mathfrak{D}_1(d(x^i))\\\
  wedge\\cdots\\wedge d(x^s).\n\\]\n\n**证明。** 证明采用归纳法。当 \\(s=1\\) 时，结论是平凡的。设 \\(s>1\\\
  )，并假设该断言对所有小于 \\(s\\) 的指标成立。由 (16.3.1) 我们有\n\n\\[\n\\mathfrak{D}_s(d(x^1)\\wedge\\\
  cdots\\wedge d(x^s))\n=\\mathfrak{D}_1(d(x^1))\\wedge d(x^2)\\wedge\\cdots\\wedge\
  \ d(x^s)\n+d(x^1)\\wedge\\mathfrak{D}_{s-1}(d(x^2)\\wedge\\cdots\\wedge d(x^s)).\n\
  \\tag{16.3.2}\n\\]\n\n根据归纳假设，\n\n\\[\n\\mathfrak{D}_{s-1}(d(x^2)\\wedge\\cdots\\\
  wedge d(x^s))\n=\\sum_{i=2}^{s}d(x^2)\\wedge\\cdots\\wedge\\mathfrak{D}_1(d(x^i))\\\
  wedge\\cdots\\wedge d(x^s),\n\\]\n\n因此\n\n\\[\nd(x^1)\\wedge\\mathfrak{D}_{s-1}(d(x^2)\\\
  wedge\\cdots\\wedge d(x^s))\n=\\sum_{i=2}^{s}d(x^1)\\wedge d(x^2)\\wedge\\cdots\\\
  wedge\\mathfrak{D}_1(d(x^i))\\wedge\\cdots\\wedge d(x^s).\n\\tag{16.3.3}\n\\]\n\n\
  结合 (16.3.2) 和 (16.3.3) 即得 \\(s\\) 时的结论。\n\n### 定理 16.3.2。\n\n光滑流形 \\(M\\) 上的形式导子\
  \ \\(\\mathfrak{D}\\) 由其在 \\(C^\\infty(M)\\) 和 \\(\\{d(f):f\\in C^\\infty(M)\\}\\\
  ) 上的取值唯一确定。\n\n**证明。** 设 \\(\\dim(M)=m\\)，\\(\\omega\\) 为 \\(\\Lambda^s(M)\\) 中的形式，且在局部坐标下，令\n\
  \n\\[\n\\omega=\\sum_{1\\le i_1<\\cdots<i_s\\le m}\\alpha_{i_1\\ldots i_s}d(x^{i_1})\\\
  wedge\\cdots\\wedge d(x^{i_s}).\n\\]\n\n则\n\n\\[\n\\begin{aligned}\n\\mathfrak{D}_s(\\\
  omega)\n&=\\sum_{1\\le i_1<\\cdots<i_s\\le m}\\mathfrak{D}_{0+s}(\\alpha_{i_1\\\
  ldots i_s}d(x^{i_1})\\wedge\\cdots\\wedge d(x^{i_s})) \\\\\n&=\\sum_{1\\le i_1<\\\
  cdots<i_s\\le m}\\Bigl[\\mathfrak{D}_0(\\alpha_{i_1\\ldots i_s})\\wedge d(x^{i_1})\\\
  wedge\\cdots\\wedge d(x^{i_s})+\\alpha_{i_1\\ldots i_s}\\wedge\\mathfrak{D}_s(d(x^{i_1})\\\
  wedge\\cdots\\wedge d(x^{i_s}))\\Bigr] \\\\\n&=\\sum_{1\\le i_1<\\cdots<i_s\\le\
  \ m}\\Bigl[\\mathfrak{D}_0(\\alpha_{i_1\\ldots i_s})d(x^{i_1})\\wedge\\cdots\\wedge\
  \ d(x^{i_s})+\\alpha_{i_1\\ldots i_s}\\sum_{j=1}^{s}d(x^{i_1})\\wedge\\cdots\\wedge\\\
  mathfrak{D}_1(d(x^{i_j}))\\wedge\\cdots\\wedge d(x^{i_s})\\Bigr],\n\\end{aligned}\n\
  \\]\n\n其中第二个等号由 (16.3.1) 得到，第三个等号由定理 16.3.1 得到。结论得证。\n\n## 16.4 李导数\n\n设 \\(M\\\
  ) 为光滑流形，\\(X\\) 为 \\(\\mathfrak{X}(M)\\) 中的向量场，并考虑由 \\(\\mathcal{L}_X(Y)=[X,Y]\\\
  ) 对所有 \\(\\mathfrak{X}(M)\\) 中的向量场 \\(Y\\) 定义的映射 \\(\\mathcal{L}_X:\\mathfrak{X}(M)\\\
  longrightarrow\\mathfrak{X}(M)\\)。由定理 15.3.2 的 (c) 和 (d) 部分可知，\\(\\mathcal{L}_X\\\
  ) 是线性的，并且满足\n\n\\[\n\\mathcal{L}_X(fY)=X(f)Y+f\\mathcal{L}_X(Y)\n\\]\n\n对所有 \\(C^\\\
  infty(M)\\) 中的函数 \\(f\\) 和 \\(\\mathfrak{X}(M)\\) 中的所有向量场 \\(Y\\) 成立。由定理 16.2.7\
  \ 可知，在 \\(M\\) 上存在唯一的张量导子\n\n\\[\n\\mathcal{L}_X:\\mathcal{T}_s^r(M)\\longrightarrow\\\
  mathcal{T}_s^r(M)\n\\]\n\n称为**关于 \\(X\\) 的李导数**，使得\n\n\\[\n\\mathcal{L}_X(f)=X(f)\
  \ \\quad\\text{且}\\quad \\mathcal{L}_X(Y)=[X,Y]\n\\tag{16.4.1}\n\\]\n\n对所有 \\(C^\\\
  infty(M)\\) 中的函数 \\(f\\) 和 \\(\\mathfrak{X}(M)\\) 中的所有向量场 \\(Y\\) 成立，其中 \\((\\mathcal{L}_X)_s^r\\\
  ) 已被简写为 \\(\\mathcal{L}_X\\)。\n\n李导数具有丰富的代数性质。\n\n### 定理 16.4.1（李导数的向量场性质）。\n\n\
  设 \\(M\\) 为光滑流形，\\(X,Y,Z\\) 为 \\(\\mathfrak{X}(M)\\) 中的向量场，\\(f,g\\) 为 \\(C^\\infty(M)\\\
  ) 中的函数。则：\n\n- (a) \\(\\mathcal{L}_X(Y)=-\\mathcal{L}_Y(X)\\)。\n- (b) \\(\\mathcal{L}_{X+Y}(Z)=\\\
  mathcal{L}_X(Z)+\\mathcal{L}_Y(Z)\\)。\n- (c) \\(\\mathcal{L}_X(Y+Z)=\\mathcal{L}_X(Y)+\\\
  mathcal{L}_X(Z)\\)。\n- (d) \\(\\mathcal{L}_{fX}(gY)=fg\\mathcal{L}_X(Y)+fX(g)Y-gY(f)X\\\
  )。\n- (e) \\(\\mathcal{L}_X([Y,Z])=[\\mathcal{L}_X(Y),Z]+[Y,\\mathcal{L}_X(Z)]\\\
  )。\n\n**证明。** 这由定理 15.3.2 得出。\n\n我们注意到，定理 15.3.2 的 (e) 部分中的雅可比恒等式引出了上述定理 (e) 部分中李括号的乘积法则。接下来的结果给出了张量积的乘积法则，其后的一个结果给出了楔积的乘积法则。\n\
  \n### 定理 16.4.2（李导数的张量场性质）。\n\n设 \\(M\\) 为光滑流形，\\(X\\) 为 \\(\\mathfrak{X}(M)\\)\
  \ 中的向量场，\\(\\mathcal{A},\\mathcal{B}\\) 为 \\(\\mathcal{T}_s^r(M)\\) 中的张量场，\\(\\\
  mathcal{C}\\) 为 \\(\\mathcal{T}_{s'}^{r'}(M)\\) 中的张量场，\\(f\\) 为 \\(C^\\infty(M)\\\
  ) 中的函数。则：\n\n- (a) \\(\\mathcal{L}_X(\\mathcal{A}+\\mathcal{B})=\\mathcal{L}_X(\\\
  mathcal{A})+\\mathcal{L}_X(\\mathcal{B})\\)。\n- (b) \\(\\mathcal{L}_X(f\\mathcal{A})=X(f)\\\
  mathcal{A}+f\\mathcal{L}_X(\\mathcal{A})\\)。\n- (c) \\(\\mathcal{L}_X(\\mathcal{A}\\\
  otimes\\mathcal{C})=\\mathcal{L}_X(\\mathcal{A})\\otimes\\mathcal{C}+\\mathcal{A}\\\
  otimes\\mathcal{L}_X(\\mathcal{C})\\)。\n\n**证明。** 这由 \\(\\mathcal{L}_X\\) 作为 \\\
  (M\\) 上张量导子的性质得出。\n\n### 定理 16.4.3（李导数的形式导子性质）。\n\n若 \\(M\\) 是光滑流形且 \\(X\\) 是 \\\
  (\\mathfrak{X}(M)\\) 中的向量场，则 \\(\\mathcal{L}_X\\) 是形式导子；也就是说，\n\n\\[\n\\mathcal{L}_X(\\\
  omega\\wedge\\xi)=\\mathcal{L}_X(\\omega)\\wedge\\xi+\\omega\\wedge\\mathcal{L}_X(\\\
  xi)\n\\]\n\n对所有 \\(\\Lambda^s(M)\\) 中的形式 \\(\\omega\\) 和 \\(\\Lambda^{s'}(M)\\)\
  \ 中的形式 \\(\\xi\\) 成立。\n\n### 定理 16.4.4（李导数的整体表达式）。\n\n设 \\(M\\) 为光滑流形，\\(X\\) 为\
  \ \\(\\mathfrak{X}(M)\\) 中的向量场。设 \\(\\mathcal{A}\\) 为 \\(\\mathcal{T}_s^r(M)\\)\
  \ 中的张量场，\\(\\omega^1,\\ldots,\\omega^r\\) 为 \\(\\mathfrak{X}^*(M)\\) 中的余向量场，\\(Y_1,\\\
  ldots,Y_s\\) 为 \\(\\mathfrak{X}(M)\\) 中的向量场。则\n\n\\[\n\\begin{aligned}\n\\mathcal{L}_X(\\\
  mathcal{A}(\\omega^1,\\ldots,\\omega^r,Y_1,\\ldots,Y_s))\n&=X(\\mathcal{A}(\\omega^1,\\\
  ldots,\\omega^r,Y_1,\\ldots,Y_s)) \\\\\n&\\quad-\\sum_{i=1}^{r}\\mathcal{A}(\\omega^1,\\\
  ldots,\\omega^{i-1},\\mathcal{L}_X(\\omega^i),\\omega^{i+1},\\ldots,\\omega^r,Y_1,\\\
  ldots,Y_s) \\\\\n&\\quad-\\sum_{j=1}^{s}\\mathcal{A}(\\omega^1,\\ldots,\\omega^r,Y_1,\\\
  ldots,Y_{j-1},[X,Y_j],Y_{j+1},\\ldots,Y_s).\n\\end{aligned}\n\\]\n\n**注。** 由 (16.4.1)\
  \ 可知，上述恒等式中的 \\(X(\\mathcal{A}(\\omega^1,\\ldots,\\omega^r,Y_1,\\ldots,Y_s))\\)\
  \ 可以替换为 \\(\\mathcal{L}_X(\\mathcal{A}(\\omega^1,\\ldots,\\omega^r,Y_1,\\ldots,Y_s))\\\
  )。\n\n**证明。** 因为 \\(\\mathcal{L}_X(Y_j)=[X,Y_j]\\)，所以由定理 16.2.4 可得结论。\n\n### 例 16.4.5。\n\
  \n对于 \\(\\mathfrak{X}^*(M)=\\mathcal{T}_1^0(M)\\) 中的余向量场 \\(\\omega\\) 和 \\(\\mathfrak{X}(M)\\\
  ) 中的向量场 \\(X,Y\\)，在定理 16.4.4 中令 \\(r=0\\)、\\(s=1\\)，可得\n\n\\[\n\\mathcal{L}_X(\\\
  omega)(Y)=X(\\omega(Y))-\\omega([X,Y]).\n\\]\n\n### 定理 16.4.6（李导数与函数外导数的交换性）。\n\n\
  若 \\(M\\) 是光滑流形且 \\(X\\) 是 \\(\\mathfrak{X}(M)\\) 中的向量场，则\n\n\\[\n\\mathcal{L}_X\\\
  circ d=d\\circ\\mathcal{L}_X;\n\\]\n\n也就是说，\n\n\\[\n\\mathcal{L}_X(d(f))=d(\\mathcal{L}_X(f))\n\
  \\]\n\n对所有 \\(C^\\infty(M)\\) 中的函数 \\(f\\) 成立。\n\n**证明。** 对于 \\(\\mathfrak{X}(M)\\\
  ) 中的向量场 \\(Y\\)，我们有\n\n\\[\n\\begin{aligned}\n\\mathcal{L}_X(d(f))(Y)\n&=X(d(f)(Y))-d(f)([X,Y])\
  \ \\qquad [\\mathrm{Ex\\ 16.4.5}] \\\\\n&=X(Y(f))-[X,Y](f) \\qquad [\\mathrm{Th\\\
  \ 15.4.5(b)}] \\\\\n&=Y(X(f)) \\qquad [(15.3.1)] \\\\\n&=d(X(f))(Y) \\qquad [\\\
  mathrm{Th\\ 15.4.5(b)}] \\\\\n&=d(\\mathcal{L}_X(f))(Y). \\qquad [(16.4.1)]\n\\\
  end{aligned}\n\\]\n\n由于 \\(f\\) 和 \\(Y\\) 是任意的，结论得证。\n\n### 定理 16.4.7。\n\n设 \\(M\\\
  ) 为光滑 \\(m\\) 维流形，\\(X\\) 为 \\(\\mathfrak{X}(M)\\) 中的向量场，且在局部坐标下，令\n\n\\[\nX=\\\
  sum_i\\alpha^i\\frac{\\partial}{\\partial x^i}.\n\\]\n\n\n\n\n然后\n\\[\n\\mathcal{L}_X(d(x^i))\
  \ = d(\\alpha^i)\n\\]\n对 \\(i=1,\\ldots,m\\)。\n\n**证明。** 由 (16.4.1) 可知\n\\[\n\\\
  mathcal{L}_X(x^i)=X(x^i)=\\left(\\sum_j\\alpha^j\\frac{\\partial}{\\partial x^j}\\\
  right)(x^i)=\\sum_j\\alpha^j\\frac{\\partial x^i}{\\partial x^j}=\\alpha^i,\n\\\
  ]\n然后由定理 16.4.6 可知\n\\[\n\\mathcal{L}_X(d(x^i))=d(\\mathcal{L}_X(x^i))=d(\\alpha^i).\n\
  \\]\n\n### 定理 16.4.8（李导数的局部坐标表达式）。\n\n设 \\(M\\) 为光滑 \\(m\\)-流形，设 \\(X\\) 为 \\(\\\
  mathfrak{X}(M)\\) 中的向量场，设 \\(\\mathcal{A}\\) 为 \\(T^r_s(M)\\) 中的张量场。在局部坐标下，设\n\\\
  [\nX=\\sum_{i=1}^{m}\\alpha^i\\frac{\\partial}{\\partial x^i},\n\\]\n并且设 \\(\\mathcal{A}^{i_1\\\
  ldots i_r}_{j_1\\ldots j_s}\\) 为 \\(\\mathcal{A}\\) 的分量。则 \\(\\mathcal{L}_X(\\mathcal{A})\\\
  ) 的分量为\n\\[\n\\mathcal{L}_X(\\mathcal{A})^{i_1\\ldots i_r}_{j_1\\ldots j_s}\n= \\\
  sum_{k=1}^{m}\\alpha^k\\frac{\\partial\\mathcal{A}^{i_1\\ldots i_r}_{j_1\\ldots\
  \ j_s}}{\\partial x^k}\n-\\sum_{l=1}^{r}\\left(\\sum_{k=1}^{m}\\mathcal{A}^{i_1\\\
  ldots i_{l-1}\\,k\\,i_{l+1}\\ldots i_r}_{j_1\\ldots j_s}\\frac{\\partial\\alpha^{i_l}}{\\\
  partial x^k}\\right)\n+\\sum_{l=1}^{s}\\left(\\sum_{k=1}^{m}\\mathcal{A}^{i_1\\\
  ldots i_r}_{j_1\\ldots j_{l-1}\\,k\\,j_{l+1}\\ldots j_s}\\frac{\\partial\\alpha^k}{\\\
  partial x^{j_l}}\\right).\n\\]\n\n**证明。** 由定理 16.4.4，\n\\[\n\\mathcal{L}_X(\\mathcal{A})^{i_1\\\
  ldots i_r}_{j_1\\ldots j_s}\n= \\mathcal{L}_X(\\mathcal{A})\\left(d(x^{i_1}),\\\
  ldots,d(x^{i_r}),\\frac{\\partial}{\\partial x^{j_1}},\\ldots,\\frac{\\partial}{\\\
  partial x^{j_s}}\\right)\n\\]\n\\[\n= X\\left(\\mathcal{A}\\left(d(x^{i_1}),\\ldots,d(x^{i_r}),\\\
  frac{\\partial}{\\partial x^{j_1}},\\ldots,\\frac{\\partial}{\\partial x^{j_s}}\\\
  right)\\right)\n-\\sum_{l=1}^{r}\\mathcal{A}\\left(d(x^{i_1}),\\ldots,\\mathcal{L}_X(d(x^{i_l})),\\\
  ldots,d(x^{i_r}),\\frac{\\partial}{\\partial x^{j_1}},\\ldots,\\frac{\\partial}{\\\
  partial x^{j_s}}\\right)\n-\\sum_{l=1}^{s}\\mathcal{A}\\left(d(x^{i_1}),\\ldots,d(x^{i_r}),\\\
  frac{\\partial}{\\partial x^{j_1}},\\ldots,\\left[X,\\frac{\\partial}{\\partial\
  \ x^{j_l}}\\right],\\ldots,\\frac{\\partial}{\\partial x^{j_s}}\\right). \\tag{16.4.2}\n\
  \\]\n\n我们寻求 (16.4.2) 最后三行中各项的另一种表达式。对于第一项，\n\\[\nX\\left(\\mathcal{A}\\left(d(x^{i_1}),\\\
  ldots,d(x^{i_r}),\\frac{\\partial}{\\partial x^{j_1}},\\ldots,\\frac{\\partial}{\\\
  partial x^{j_s}}\\right)\\right)\n= X\\left(\\mathcal{A}^{i_1\\ldots i_r}_{j_1\\\
  ldots j_s}\\right)\n= \\left(\\sum_{k=1}^{m}\\alpha^k\\frac{\\partial}{\\partial\
  \ x^k}\\right)\\left(\\mathcal{A}^{i_1\\ldots i_r}_{j_1\\ldots j_s}\\right)\n= \\\
  sum_{k=1}^{m}\\alpha^k\\frac{\\partial\\mathcal{A}^{i_1\\ldots i_r}_{j_1\\ldots\
  \ j_s}}{\\partial x^k}. \\tag{16.4.3}\n\\]\n\n对于第二项，定理 15.4.7 和定理 16.4.7 给出\n\\\
  [\n\\mathcal{L}_X\\left(d(x^{i_l})\\right)=d(\\alpha^{i_l})=\\sum_{k=1}^{m}\\frac{\\\
  partial\\alpha^{i_l}}{\\partial x^k}\\,d(x^k),\n\\]\n故\n\\[\n\\sum_{l=1}^{r}\\mathcal{A}\\\
  left(d(x^{i_1}),\\ldots,\\mathcal{L}_X(d(x^{i_l})),\\ldots,d(x^{i_r}),\\frac{\\\
  partial}{\\partial x^{j_1}},\\ldots,\\frac{\\partial}{\\partial x^{j_s}}\\right)\n\
  = \\sum_{l=1}^{r}\\mathcal{A}\\left(d(x^{i_1}),\\ldots,\\sum_{k=1}^{m}\\frac{\\\
  partial\\alpha^{i_l}}{\\partial x^k}\\,d(x^k),\\ldots,d(x^{i_r}),\\frac{\\partial}{\\\
  partial x^{j_1}},\\ldots,\\frac{\\partial}{\\partial x^{j_s}}\\right)\n\\]\n\\[\n\
  = \\sum_{l=1}^{r}\\left\\{\\sum_{k=1}^{m}\\frac{\\partial\\alpha^{i_l}}{\\partial\
  \ x^k}\\,\\mathcal{A}\\left(d(x^{i_1}),\\ldots,d(x^k),\\ldots,d(x^{i_r}),\\frac{\\\
  partial}{\\partial x^{j_1}},\\ldots,\\frac{\\partial}{\\partial x^{j_s}}\\right)\\\
  right\\} \\tag{16.4.4}\n\\]\n\\[\n= \\sum_{l=1}^{r}\\left(\\sum_{k=1}^{m}\\mathcal{A}^{i_1\\\
  ldots i_{l-1}\\,k\\,i_{l+1}\\ldots i_r}_{j_1\\ldots j_s}\\frac{\\partial\\alpha^{i_l}}{\\\
  partial x^k}\\right).\n\\]\n\n对于第三项，\n\\[\n\\left[X,\\frac{\\partial}{\\partial\
  \ x^{j_l}}\\right]\n= \\sum_{k=1}^{m}\\left[\\alpha^k\\frac{\\partial}{\\partial\
  \ x^k},\\frac{\\partial}{\\partial x^{j_l}}\\right] \\qquad[\\text{Th 15.3.2(b)}]\n\
  \\]\n\\[\n= \\sum_{k=1}^{m}\\left(\\alpha^k\\left[\\frac{\\partial}{\\partial x^k},\\\
  frac{\\partial}{\\partial x^{j_l}}\\right]-\\frac{\\partial\\alpha^k}{\\partial\
  \ x^{j_l}}\\frac{\\partial}{\\partial x^k}\\right) \\qquad[\\text{Th 15.3.2(d)}]\n\
  \\]\n\\[\n= -\\sum_{k=1}^{m}\\frac{\\partial\\alpha^k}{\\partial x^{j_l}}\\frac{\\\
  partial}{\\partial x^k}, \\qquad[\\text{Th 15.3.3(b)}]\n\\]\n故\n\\[\n\\sum_{l=1}^{s}\\\
  mathcal{A}\\left(d(x^{i_1}),\\ldots,d(x^{i_r}),\\frac{\\partial}{\\partial x^{j_1}},\\\
  ldots,\\left[X,\\frac{\\partial}{\\partial x^{j_l}}\\right],\\ldots,\\frac{\\partial}{\\\
  partial x^{j_s}}\\right)\n= \\sum_{l=1}^{s}\\mathcal{A}\\left(d(x^{i_1}),\\ldots,d(x^{i_r}),\\\
  frac{\\partial}{\\partial x^{j_1}},\\ldots,-\\sum_{k=1}^{m}\\frac{\\partial\\alpha^k}{\\\
  partial x^{j_l}}\\frac{\\partial}{\\partial x^k},\\ldots,\\frac{\\partial}{\\partial\
  \ x^{j_s}}\\right)\n\\]\n\\[\n= -\\sum_{l=1}^{s}\\left\\{\\sum_{k=1}^{m}\\frac{\\\
  partial\\alpha^k}{\\partial x^{j_l}}\\,\\mathcal{A}\\left(d(x^{i_1}),\\ldots,d(x^{i_r}),\\\
  frac{\\partial}{\\partial x^{j_1}},\\ldots,\\frac{\\partial}{\\partial x^k},\\ldots,\\\
  frac{\\partial}{\\partial x^{j_s}}\\right)\\right\\}\n\\]\n\\[\n= -\\sum_{l=1}^{s}\\\
  left(\\sum_{k=1}^{m}\\mathcal{A}^{i_1\\ldots i_r}_{j_1\\ldots j_{l-1}\\,k\\,j_{l+1}\\\
  ldots j_s}\\frac{\\partial\\alpha^k}{\\partial x^{j_l}}\\right). \\tag{16.4.5}\n\
  \\]\n\n将 (16.4.3)–(16.4.5) 代入 (16.4.2) 即得结果。\n\n### 例 16.4.9。\n\n设 \\(M\\) 为光滑流形，设\
  \ \\(X\\) 为 \\(\\mathfrak{X}(M)\\) 中的向量场，设 \\(\\omega\\) 为 \\(\\mathfrak{X}^*(M)\\\
  ) 中的余向量场，并且在局部坐标下，设\n\\[\nX=\\sum_{i=1}^{m}\\alpha^i\\frac{\\partial}{\\partial\
  \ x^i}\\quad\\text{and}\\quad \\omega=\\sum_{j=1}^{m}\\beta_j\\,d(x^j).\n\\]\n由定理\
  \ 16.4.8，余向量场 \\(\\mathcal{L}_X(\\omega)\\) 在 \\(\\mathfrak{X}^*(M)\\) 中的分量为\n\\\
  [\n\\mathcal{L}_X(\\omega)_j=\\sum_{k=1}^{m}\\alpha^k\\frac{\\partial\\beta_j}{\\\
  partial x^k}+\\sum_{k=1}^{m}\\beta_k\\frac{\\partial\\alpha^k}{\\partial x^j}.\n\
  \\]\n\n## 16.5 内乘\n\n下面的定义是第 7.4 节中出现的流形版本。设 \\(M\\) 为光滑流形，设 \\(X\\) 为 \\(\\mathfrak{X}(M)\\\
  ) 中的向量场。**由 \\(X\\) 的内乘** 是线性映射族\n\\[\ni_X:\\Lambda^s(M)\\longrightarrow\\Lambda^{s-1}(M)\n\
  \\]\n对 \\(s\\ge 2\\) 定义为\n\\[\ni_X(\\omega)(Y_1,\\ldots,Y_{s-1})=\\omega(X,Y_1,\\\
  ldots,Y_{s-1})\n\\]\n对所有 \\(\\Lambda^s(M)\\) 中的形式 \\(\\omega\\) 和所有 \\(\\mathfrak{X}(M)\\\
  ) 中的向量场 \\(Y_1,\\ldots,Y_{s-1}\\) 成立。回顾由 (15.8.1) 和 (15.8.2) 可知 \\(\\Lambda^1(M)=\\\
  mathfrak{X}^*(M)\\) 且 \\(\\Lambda^0(M)=C^\\infty(M)\\)，我们现在将前述定义推广到 \\(s=1\\) 如下：\n\
  \\[\ni_X:\\Lambda^1(M)\\longrightarrow\\Lambda^0(M)\n\\]\n由\n\\[\ni_X(\\omega)=\\\
  omega(X)\n\\]\n对所有 \\(\\mathfrak{X}^*(M)\\) 中的余向量场 \\(\\omega\\) 给出。特别地，对任意函数 \\\
  (f\\) 在 \\(C^\\infty(M)\\) 中，由定理 15.4.5(b) 和 (16.5.1) 可知\n\\[\ni_X(df)=df(X)=X(f).\n\
  \\]\n对 \\(s=0\\)，我们平凡地定义 \\(i_X=0\\)；即\n\\[\ni_X(f)=0\n\\]\n对所有 \\(C^\\infty(M)\\\
  ) 中的函数 \\(f\\) 成立。\n\n### 定理 16.5.1。\n\n设 \\(M\\) 为光滑流形，设 \\(X,Y\\) 为 \\(\\mathfrak{X}(M)\\\
  ) 中的向量场，设 \\(\\omega,\\xi\\) 为 \\(\\Lambda^s(M)\\) 中的形式，设 \\(\\zeta\\) 为 \\(\\Lambda^{s'}(M)\\\
  ) 中的形式，设 \\(f\\) 为 \\(C^\\infty(M)\\) 中的函数。则：\n\n- (a) \\(i_{X+Y}(\\omega)=i_X(\\\
  omega)+i_Y(\\omega)\\)。\n- (b) \\(i_{fX}(\\omega)=f\\,i_X(\\omega)\\)。\n- (c) \\\
  (i_X(\\omega+\\xi)=i_X(\\omega)+i_X(\\xi)\\)。\n- (d) \\(i_X(f\\omega)=f\\,i_X(\\\
  omega)\\)。\n- (e) \\(i_X(\\omega\\wedge\\zeta)=i_X(\\omega)\\wedge\\zeta+(-1)^s\\\
  omega\\wedge i_X(\\zeta)\\)。\n\n**证明。** 这是定理 7.4.1 的流形版本结合定理 7.4.3 的流形版本。\n\n###\
  \ 例 16.5.2。\n\n对 \\(\\mathfrak{X}(M)\\) 中的向量场 \\(X\\) 和 \\(\\Lambda^1(M)=\\mathfrak{X}^*(M)\\\
  ) 中的余向量场 \\(\\omega,\\xi\\)，由 (15.8.3)、(16.5.1) 和定理 16.5.1(e) 可知\n\\[\ni_X(\\omega\\\
  wedge\\xi)=i_X(\\omega)\\wedge\\xi-\\omega\\wedge i_X(\\xi)=\\omega(X)\\wedge\\\
  xi-\\omega\\wedge\\xi(X)\n=\\omega(X)\\xi-\\xi(X)\\omega.\n\\]\n\n我们已在光滑流形上定义了两个微分算子——外微分和李导数。尽管它们在构造和性质上明显不同，但它们通过一个涉及内乘的\
  \ remarkable 恒等式相关联。\n\n### 定理 16.5.3（Cartan 恒等式）。\n\n若 \\(M\\) 为光滑流形且 \\(X\\) 为\
  \ \\(\\mathfrak{X}(M)\\) 中的向量场，则\n\\[\n\\mathcal{L}_X=d\\circ i_X+i_X\\circ d;\n\
  \\]\n即\n\\[\n\\mathcal{L}_X(\\omega)=d(i_X(\\omega))+i_X(d\\omega)\n\\]\n对所有 \\\
  (\\Lambda^s(M)\\) 中的形式 \\(\\omega\\) 成立。\n\n**证明。** 设 \\(\\omega\\) 和 \\(\\xi\\\
  ) 分别为 \\(\\Lambda^s(M)\\) 和 \\(\\Lambda^{s'}(M)\\) 中的形式。我们有\n\\[\n(d\\circ i_X+i_X\\\
  circ d)(\\omega\\wedge\\xi)=d(i_X(\\omega\\wedge\\xi))+i_X(d(\\omega\\wedge\\xi)),\n\
  \\]\n\\[\n\\begin{aligned}\nd(i_X(\\omega\\wedge\\xi))\n&=d(i_X(\\omega)\\wedge\\\
  xi+(-1)^s\\omega\\wedge i_X(\\xi))\\\\\n&=d(i_X(\\omega)\\wedge\\xi)+(-1)^s d(\\\
  omega\\wedge i_X(\\xi))\\\\\n&=d(i_X(\\omega))\\wedge\\xi+(-1)^{s-1}i_X(\\omega)\\\
  wedge d\\xi\\\\\n&\\quad+(-1)^s\\left[d(\\omega)\\wedge i_X(\\xi)+(-1)^s\\omega\\\
  wedge d(i_X(\\xi))\\right]\\\\\n&=(d\\circ i_X)(\\omega)\\wedge\\xi-(-1)^s i_X(\\\
  omega)\\wedge d\\xi\\\\\n&\\quad+(-1)^s d(\\omega)\\wedge i_X(\\xi)+\\omega\\wedge(d\\\
  circ i_X)(\\xi),\n\\end{aligned}\n\\]\n并且\n\\[\n\\begin{aligned}\ni_X(d(\\omega\\\
  wedge\\xi))\n&=i_X(d\\omega\\wedge\\xi+(-1)^s\\omega\\wedge d\\xi)\\\\\n&=i_X(d\\\
  omega)\\wedge\\xi+(-1)^s i_X(\\omega\\wedge d\\xi)\\\\\n&=i_X(d\\omega)\\wedge\\\
  xi+(-1)^{s+1}d\\omega\\wedge i_X(\\xi)\\\\\n&\\quad+(-1)^s\\left[i_X(\\omega)\\\
  wedge d\\xi+(-1)^s\\omega\\wedge i_X(d\\xi)\\right]\\\\\n&=(i_X\\circ d)(\\omega)\\\
  wedge\\xi-(-1)^s d\\omega\\wedge i_X(\\xi)\\\\\n&\\quad+(-1)^s i_X(\\omega)\\wedge\
  \ d\\xi+\\omega\\wedge(i_X\\circ d)(\\xi).\n\\end{aligned}\n\\]\n结合上述恒等式得\n\\[\n\
  \\begin{aligned}\n(d\\circ i_X+i_X\\circ d)(\\omega\\wedge\\xi)\n&=(d\\circ i_X)(\\\
  omega)\\wedge\\xi+(i_X\\circ d)(\\omega)\\wedge\\xi\\\\\n&\\quad+\\omega\\wedge(d\\\
  circ i_X)(\\xi)+\\omega\\wedge(i_X\\circ d)(\\xi)\\\\\n&=(d\\circ i_X+i_X\\circ\
  \ d)(\\omega)\\wedge\\xi+\\omega\\wedge(d\\circ i_X+i_X\\circ d)(\\xi).\n\\end{aligned}\n\
  \\]\n\n\n\n因此，$d \\circ i_X + i_X \\circ d$ 是 $M$ 上的一个形式导数。根据定理 16.4.3，$\\mathcal{L}_X$\
  \ 也有同样的性质。\n\n设 $f$ 是 $C^\\infty(M)$ 中的一个函数。则\n\n```\n(d \\circ i_X + i_X \\circ\
  \ d)(f) = d(i_X(f)) + i_X(d(f)) = X(f) [(16.5.2), (16.5.3)] = \\mathcal{L}_X(f)\
  \ [(16.4.1)]\n```\n\n并且\n\n```\n(d \\circ i_X + i_X \\circ d)(d(f)) = d(i_X(d(f)))\
  \ + i_X(d^2(f)) = d(X(f)) [Th 16.1.1(c), (16.5.2)] = d(\\mathcal{L}_X(f)) [(16.4.1)]\
  \ = \\mathcal{L}_X(d(f)). [Th 16.4.6]\n```\n\n由于 $f$ 是任意的，$d \\circ i_X + i_X \\\
  circ d$ 与 $\\mathcal{L}_X$ 在 $C^\\infty(M)$ 和 $\\{d(f) : f \\in C^\\infty(M)\\}$\
  \ 上一致。结果现在由定理 16.3.2 得出。\n\n下一个结果是定理 16.4.6 的推广。\n\n## 定理 16.5.4（李导数与外导数的交换性）。若\
  \ $M$ 是一个光滑流形且 $X$ 是 $\\mathfrak{X}(M)$ 中的一个向量场，则\n\n```\n\\mathcal{L}_X \\circ\
  \ d = d \\circ \\mathcal{L}_X;\n```\n\n也就是说，\n\n```\n\\mathcal{L}_X(d(\\omega))\
  \ = d(\\mathcal{L}_X(\\omega))\n```\n\n对所有 $\\Lambda^s(M)$ 中的形式 $\\omega$ 成立。\n\n\
  证明。由定理 16.1.1(c) 和定理 16.5.3 可得\n\n```\n\\mathcal{L}_X \\circ d = (d \\circ i_X +\
  \ i_X \\circ d) \\circ d = d \\circ i_X \\circ d + i_X \\circ d^2 = d \\circ i_X\
  \ \\circ d\n```\n\n并且\n\n```\nd \\circ \\mathcal{L}_X = d \\circ (d \\circ i_X +\
  \ i_X \\circ d) = d^2 \\circ i_X + d \\circ i_X \\circ d = d \\circ i_X \\circ d.\n\
  ```\n\n结果得证。\n\n## 16.6 定向\n\n本节的材料大量借鉴了第 8.2 节和第 12.7 节。\n\n设 $M$ 是一个光滑流形，设 $(U,\
  \ (x^i))$ 和 $(\\widetilde{U}, (\\widetilde{x}^i))$ 是 $M$ 上的重叠图表，且 $\\mathcal{X}$\
  \ 和 $\\widetilde{\\mathcal{X}}$ 为相应的坐标标架。召回\n\n是 $M$ 上的一个图表，对应的坐标标架为\n\n```\n-\U0001D4B3\
  \ = ( -∂/∂x¹ , ∂/∂x² , … , ∂/∂xᵐ ).\n```\n\n利用定理 14.3.5(b) 易证\n\n```\n-\U0001D504\
  \ = { (U, (-x¹, …, xᵐ)) : (U, (x¹, …, xᵐ)) ∈ \U0001D504 }\n```\n\n是 $M$ 的一个一致光滑图册。由\
  \ -\U0001D504 诱导的 $M$ 的定向为\n\n```\n-\U0001D512 = { -\U0001D512(p) : p ∈ M },\n```\n\
  \n其中\n\n```\n-\U0001D512(p) = [ -\U0001D4B3_p ] = [ ( ∂/∂x¹|_p , ∂/∂x²|_p , … ,\
  \ ∂/∂xᵐ|_p ) ].\n```\n\n我们说定向 -\U0001D512 是 \U0001D512 的相反。\n\n向量空间总是有且仅有两个定向，但光滑流形的情况不同。如我们在例\
  \ 12.7.9 中所见，莫比乌斯带没有光滑的单位法向量场，因此根据定理 12.7.6，它没有定向。另一方面，如果一个光滑流形有一个定向，那么它至少有两个定向，即给定的定向及其相反——但可能还有更多。\n\
  \n用图册定义光滑流形的定向最终依赖于切空间基的定向方式，这在几何上很有吸引力。然而，这种方法在计算上并不方便。我们现在给出一种代数替代方案，可以缓解这个问题，但代价是抽象性更大。\n\
  \n设 $M$ 是一个光滑 $m$ 流形。我们说 $\\Lambda^m(M)$ 中的形式 $\\omega$ 是定向形式（在 $M$ 上），如果它是处处非零的；等价地，如果对所有\
  \ $p \\in M$，$\\omega_p$ 是 $\\Lambda^m(T_p(M))$ 中的一个非零多余向量；等价地，如果对所有 $p \\in M$，$\\\
  omega_p$ 是 $T_p(M)$ 上的一个定向多余向量。在文献中，这样的形式通常被称为体积形式，但我们保留此术语用于一种特定的定向形式，它使得在某些设定下能够度量“体积”。正如我们很快会看到的，并不能保证给定的光滑流形具有定向形式。\n\
  \n## 定理 16.6.1。设 $M$ 是一个光滑流形，且 $\\omega, \\vartheta$ 是 $M$ 上的定向形式。则：\n\n- (a) 存在唯一确定的处处非零函数\
  \ $f \\in C^\\infty(M)$ 使得 $\\omega = f \\vartheta$。\n- (b) 如果 $M$ 作为拓扑空间是连通的，则\
  \ $f$ 要么严格为正，要么严格为负。\n\n证明。 (a)：设 $p$ 是 $M$ 中的一点。根据定义，$\\omega_p$ 和 $\\vartheta_p$\
  \ 是 $T_p^*(M)$ 中的余向量，所以由定理 7.2.12(d) 可得 $\\omega_p = f(p) \\vartheta_p$，其中 $f(p)$\
  \ 为某个实数。根据定义，$\\omega$ 和 $\\vartheta$ 是处处非零的，所以 $f(p) \\neq 0$。映射 $p \\longmapsto\
  \ f(p)$ 定义了一个处处非零的函数 $f : M \\longrightarrow \\mathbb{R}$ 使得 $\\varpi = f\\vartheta$。设\
  \ $(U,(x^i))$ 是 $M$ 上的一个图表，且 $(d(x^1),\\ldots,d(x^m))$ 为相应的对偶标架。由定理 14.3.3(b) 可得\
  \ $\\varpi|_U$ 和 $\\vartheta|_U$ 是 $U$ 上的定向形式，然后由定理 15.8.5 可得 $\\varpi|_U = g\\\
  ,d(x^1)\\wedge\\cdots\\wedge d(x^m)$ 且 $\\vartheta|_U = h\\,d(x^1)\\wedge\\cdots\\\
  wedge d(x^m)$，其中 $g$ 和 $h$ 是 $C^\\infty(U)$ 中唯一确定的函数。由于 $\\varpi|_U$ 和 $\\vartheta|_U$\
  \ 是处处非零的，所以 $g$ 和 $h$ 也是处处非零的。于是 $\\varpi|_U = (g/h)\\vartheta|_U$，故 $f|_U = g/h$\
  \ 是 $C^\\infty(U)$ 中的函数。由于 $p$ 是任意的，$f$ 在 $C^\\infty(M)$ 中。$f$ 的唯一性由前述论证得出。\n\n\
  (b)：这由定理 9.1.20 和定理 10.1.1 得出。\n\n设 $M$ 是一个光滑流形，且 $\\varpi$ 和 $\\vartheta$ 是 $M$\
  \ 上的定向形式。根据定理 16.6.1(a)，存在唯一确定的处处非零函数 $f \\in C^\\infty(M)$ 使得 $\\varpi = f\\vartheta$。我们说\
  \ $\\varpi$ 和 $\\vartheta$ 是**一致的（在 $M$ 上）**，并记 $\\varpi \\sim \\vartheta$，如果 $f$\
  \ 在 $M$ 上严格为正。易证 $\\sim$ 是 $M$ 上定向形式集合上的一个等价关系。包含 $\\varpi$ 的等价类记为 $[\\varpi]$。由于\
  \ $\\varpi$ 和 $-\\varpi$ 不一致，$[\\varpi]$ 和 $[-\\varpi]$ 是不同的等价类。我们再次强调，并不能保证给定的光滑流形甚至有一个定向形式，因此前述等价关系可能为空。另一方面，如果等价关系确实存在，则可能有不止两个等价类。\n\
  \n## 定理 16.6.2。设 $M$ 是一个光滑 $m$ 流形，设 $(U,(x^i))$ 和 $(\\widetilde{U},(\\widetilde{x}^i))$\
  \ 是 $M$ 上的重叠图表，设 $\\mathcal{X}$ 和 $\\widetilde{\\mathcal{X}}$ 为相应的坐标标架，且 $(d(x^1),\\\
  ldots,d(x^m))$ 和 $(d(\\widetilde{x}^1),\\ldots,d(\\widetilde{x}^m))$ 为相应的对偶坐标标架。则\
  \ $(U,(x^i))$ 和 $(\\widetilde{U},(\\widetilde{x}^i))$ 一致当且仅当 $d(x^1)\\wedge\\cdots\\\
  wedge d(x^m)$ 和 $d(\\widetilde{x}^1)\\wedge\\cdots\\wedge d(\\widetilde{x}^m)$ 在\
  \ $U\\cap\\widetilde{U}$ 上一致。\n\n*证明。* 设 $p$ 是 $U\\cap\\widetilde{U}$ 中的一点。则 $\\\
  mathcal{X}_p$ 和 $\\widetilde{\\mathcal{X}}_p$ 是 $p$ 处的坐标基，且 $(d_p(x^1),\\ldots,d_p(x^m))$\
  \ 和 $(d_p(\\widetilde{x}^1),\\ldots,d_p(\\widetilde{x}^m))$ 为相应的对偶坐标基。由定理 7.3.3(a)\
  \ 可得\n\n$d_p(\\widetilde{x}^1)\\wedge\\cdots\\wedge d_p(\\widetilde{x}^m) = f(p)\\\
  ,d_p(x^1)\\wedge\\cdots\\wedge d_p(x^m)$，\n\n其中\n\n$f(p) = \\det\\big([\\mathrm{id}_{T_p(M)}]_{\\\
  mathcal{X}_p}^{\\widetilde{\\mathcal{X}}_p}\\big)$。\n\n映射 $p\\longmapsto f(p)$ 定义了一个\
  \ $C^\\infty(U\\cap\\widetilde{U})$ 中的函数 $f$ 使得\n\n$d(\\widetilde{x}^1)\\wedge\\\
  cdots\\wedge d(\\widetilde{x}^m) = f\\,d(x^1)\\wedge\\cdots\\wedge d(x^m)$\n\n在\
  \ $U\\cap\\widetilde{U}$ 上成立。由定理 2.5.3，$f$ 是处处非零的。结果得证。\n\n## 定理 16.6.3。设 $M$ 是一个光滑流形，且\
  \ $\\varpi$ 是 $M$ 上的一个定向形式。对每个点 $p \\in M$，设 $\\mathfrak{O}(p)$ 为由定向多余向量 $\\varpi_p$\
  \ 诱导的 $T_p(M)$ 的定向（由定理 8.2.3 给出）。则 $\\mathfrak{O} = \\{\\mathfrak{O}(p) : p \\in\
  \ M\\}$ 是 $M$ 的一个定向，称为由 $\\varpi$ 诱导的**定向。**\n\n## 16.6 定向\n\n*证明。* 我们需要构造一个一致的光滑图册\
  \ $\\mathcal A$，其诱导定向为 $\\mathcal D$。设 $\\mathcal B$ 是 $M$ 的一个光滑图册。按照定理 12.7.4 的证明的论证，我们不失一般性地假设\
  \ $\\mathcal B$ 中每个图表的坐标域在 $M$ 中是连通集。设 $(U,(x^1,x^2,\\ldots,x^m))$ 是 $\\mathcal\
  \ B$ 中的一个图表，且 $d(x^1)\\wedge\\cdots\\wedge d(x^m)$ 为相应的对偶坐标标架。则 $\\varpi_U$ 和 $d(x^1)\\\
  wedge\\cdots\\wedge d(x^m)$ 是 $U$ 上的定向形式。将 $U$ 视为光滑 $m$ 流形，由定理 16.6.1 可得存在唯一确定的\
  \ $C^\\infty(U)$ 中的函数 $f$ 使得 $\\varpi|_U=f\\,d(x^1)\\wedge\\cdots\\wedge d(x^m)$，且\
  \ $f$ 要么严格为正要么严格为负。在前一种情况下，$\\varpi|_U$ 与 $d(x^1)\\wedge d(x^2)\\wedge\\cdots\\\
  wedge d(x^m)$ 一致，我们将 $(U,(x^1,x^2,\\ldots,x^m))$ 包含在 $\\mathcal A$ 中。在后一种情况下，$\\\
  varpi|_U$ 与 $d(-x^1)\\wedge d(x^2)\\wedge\\cdots\\wedge d(x^m)$ 一致，我们将 $(U,(-x^1,x^2,\\\
  ldots,x^m))$ 包含在 $\\mathcal A$ 中。根据构造，$\\mathcal A$ 中任意一对重叠图表对应的对偶坐标标架都与 $\\varpi$\
  \ 的一个限制一致，因而彼此一致。由定理 16.6.2 可得 $\\mathcal A$ 中任意一对重叠图表是一致的。因此，$\\mathcal A$ 是 $M$\
  \ 的一个一致光滑图册。\n\n设 $p$ 是 $M$ 中的一点，设 $(U,(x^1,\\ldots,x^m))$ 是 $\\mathcal A$ 中在 $p$\
  \ 处的图表，且 $\\mathcal X=(\\partial/\\partial x^1,\\ldots,\\partial/\\partial x^m)$\
  \ 和 $(d(x^1),\\ldots,d(x^m))$ 为相应的坐标和对偶坐标标架。由上述构造，存在唯一确定的 $C^\\infty(U)$ 中的严格正函数\
  \ $f$ 使得 $\\varpi|_U=f\\,d(x^1)\\wedge\\cdots\\wedge d(x^m)$。则定理 7.2.9 给出\n\n$$\\\
  varpi_p\\left(\\left.\\frac{\\partial}{\\partial x^1}\\right|_p,\\ldots,\\left.\\\
  frac{\\partial}{\\partial x^m}\\right|_p\\right)=f(p)\\,d_p(x^1)\\wedge\\cdots\\\
  wedge d_p(x^m)\\left(\\left.\\frac{\\partial}{\\partial x^1}\\right|_p,\\ldots,\\\
  left.\\frac{\\partial}{\\partial x^m}\\right|_p\\right)$$\n\n$$=f(p)>0.$$\n\n因此，$\\\
  mathcal X_p$ 在 $\\mathcal D(p)$ 中，或等价地，$\\mathcal D(p)=[\\mathcal X_p]$。由于 $p$ 和\
  \ $(U,(x^1,\\ldots,x^m))$ 都是任意的，$\\mathcal D$ 是由 $\\mathcal A$ 诱导的定向。\n\n## 定理 16.6.4。如果\
  \ $(M,\\mathcal D)$ 是一个定向光滑流形，则存在一个诱导 $\\mathcal D$ 的定向形式在 $M$ 上。\n\n*证明。* 设 $\\\
  mathcal A=\\{(U_\\alpha,(x_\\alpha^i)):\\alpha\\in A\\}$ 是 $M$ 的一个一致光滑图册，且 $\\mathcal\
  \ X_\\alpha=(\\partial/\\partial x_\\alpha^1,\\ldots,\\partial/\\partial x_\\alpha^m)$\
  \ 和 $(d(x_\\alpha^1),\\ldots,d(x_\\alpha^m))$ 为 $(U_\\alpha,(x_\\alpha^i))$ 对应的坐标和对偶坐标标架。设\
  \ $\\pi_\\alpha=d(x_\\alpha^1)\\wedge\\cdots\\wedge d(x_\\alpha^m)$，且 $\\{\\pi_\\\
  alpha:\\alpha\\in A\\}$ 是 $M$ 的开覆盖 $\\{U_\\alpha:\\alpha\\in A\\}$ 的一个单位分解。可以证明\
  \ $\\pi_\\alpha\\varpi_\\alpha$ 的一个光滑延拓到整个 $M$ 存在，且该延拓，仍记为 $\\pi_\\alpha\\varpi_\\\
  alpha$，在 $M\\setminus\\operatorname{supp}(\\pi_\\alpha)$ 上恒为 0。也可以证明 $\\Omega=\\\
  sum_\\alpha\\pi_\\alpha\\varpi_\\alpha$ 是 $\\Lambda^m(M)$ 中的一个形式。我们断言 $\\Omega$\
  \ 是一个诱导 $\\mathcal D$ 的定向形式。对给定的点 $p \\in M$，设 $(U_\\beta,(x_\\beta^i))$ 是 $\\mathcal\
  \ A$ 中在 $p$ 处的图表，并考虑\n\n$$\\Omega_p\\left(\\left.\\frac{\\partial}{\\partial x_\\\
  beta^1}\\right|_p,\\ldots,\\left.\\frac{\\partial}{\\partial x_\\beta^m}\\right|_p\\\
  right)=\\sum_\\alpha\\pi_\\alpha(p)\\,\\varpi_{\\alpha|p}\\left(\\left.\\frac{\\\
  partial}{\\partial x_\\beta^1}\\right|_p,\\ldots,\\left.\\frac{\\partial}{\\partial\
  \ x_\\beta^m}\\right|_p\\right).$$\n\n由单位分解的性质，对所有 $\\alpha$，$\\pi_\\alpha(p)\\\
  ge 0$，且对至少一个 $\\alpha$，$\\pi_\\alpha(p)>0$。由于 $\\mathcal X_{\\beta|p}$ 与所有 $\\alpha$\
  \ 的 $\\mathcal X_{\\alpha|p}$ 一致，由定理\n\n\n根据定理8.2.2，\n\n\\[\n\\varpi_{\\alpha}\\\
  big|_{p}\\left(\\left.\\frac{\\partial}{\\partial x_{\\beta}^{1}}\\right|_{p},\\\
  ldots,\\left.\\frac{\\partial}{\\partial x_{\\beta}^{m}}\\right|_{p}\\right)>0\n\
  \\]\n\n对所有\\(\\alpha\\)成立，因此\n\n\\[\n\\Omega_{p}\\left(\\left.\\frac{\\partial}{\\\
  partial x_{\\beta}^{1}}\\right|_{p},\\ldots,\\left.\\frac{\\partial}{\\partial x_{\\\
  beta}^{m}}\\right|_{p}\\right)>0.\n\\]\n\n由于\\(p\\)是任意的，由前面的不等式可知\\(\\Omega\\)处处非零，因此是一个定向形式。由于\\\
  ((U_{\\beta},x_{\\beta}^{i})\\)也是任意的，由前面的不等式和定理16.6.3同样可知\\(\\Omega\\)诱导\\(\\mathfrak{D}\\\
  )。\n\n### 定理16.6.5（光滑流形的可定向性准则）。\n\n一个光滑流形是可定向的当且仅当它有一个定向形式。\n\n**证明。**（⇒）：这由定理16.6.4得出。\
  \  \n（⇐）：这由定理16.6.3得出。\n\n### 定理16.6.6。\n\n设\\((r^{1},\\ldots,r^{m})\\)是\\(\\mathbb{R}^{m}\\\
  )上的标准坐标，并设\\((d(r^{1}),\\ldots,d(r^{m}))\\)是相应的标准对偶坐标标架。则\\(d(r^{1})\\wedge\\cdots\\\
  wedge d(r^{m})\\)诱导\\(\\mathbb{R}^{m}\\)的标准定向。\n\n**证明。** 根据例15.1.6，我们有等同\\((\\\
  partial/\\partial r^{1},\\ldots,\\partial/\\partial r^{m})=(e_{1},\\ldots,e_{m})\\\
  )，其中\\((e_{1},\\ldots,e_{m})\\)是\\(\\mathbb{R}^{m}\\)的标准基。由定理15.8.4，\\(d(r^{1})\\\
  wedge\\cdots\\wedge d(r^{m})(e_{1},\\ldots,e_{m})=1\\)。因此，\\(d(r^{1})\\wedge\\cdots\\\
  wedge d(r^{m})\\)是\\(\\mathbb{R}^{m}\\)上的一个定向形式。由定理16.6.3，\\([(e_{1},\\ldots,e_{m})]\\\
  )属于由\\(d(r^{1})\\wedge\\cdots\\wedge d(r^{m})\\)诱导的\\(\\mathbb{R}^{m}\\)的定向。\n\n\
  ### 定理16.6.7。\n\n设\\(M\\)是一个可定向的光滑流形，设\\(\\{[\\varpi]\\}\\)是\\(M\\)上定向形式的等价类的集合，并设\\\
  (\\{\\mathfrak{D}\\}\\)是\\(M\\)的定向的集合。则映射\\(\\iota:\\{[\\varpi]\\}\\longrightarrow\\\
  {\\mathfrak{D}\\}\\)（定义为将\\([\\varpi]\\)指派给由\\(\\varpi\\)诱导的定向）是双射。\n\n在本节引言中已经指出，如果一个光滑流形有一个定向，那么它至少有两个定向。下一个结果给出了恰好有两个定向的条件。\n\
  \n### 定理16.6.8。\n\n连通的可定向光滑流形恰好有两个定向。\n\n**证明。** 设\\(M\\)是连通的可定向光滑流形。由定理16.6.5，\\\
  (M\\)有一个定向形式\\(\\varpi\\)。\\([\\varpi]\\)中的每个定向形式都诱导相同的定向，而\\([-\\varpi]\\)中的每个定向形式诱导其相反的定向。设\\\
  (\\vartheta\\)是\\(M\\)上的另一个定向形式。由定理16.6.1(a)，存在唯一确定的处处非零函数\\(f\\in C^{\\infty}(M)\\\
  )使得\\(\\vartheta=f\\varpi\\)，再由定理16.6.1(b)得\\(\\vartheta\\)要么属于\\([\\varpi]\\)，要么属于\\\
  ([-\\varpi]\\)。\n\n由定理14.1.3可知，一个光滑流形具有可数个连通分支，每个连通分支都是该光滑流形中的开集。设\\(M\\)是具有有限个连通分支\\\
  (C_{1},\\ldots,C_{k}\\)的光滑流形。假设\\(C_{i}\\)作为\\(M\\)的开子流形，对\\(i=1,\\ldots,k\\)都是可定向的。则\\\
  (C_{i}\\)可以独立于其他连通分支而被赋予一个定向\\(\\mathfrak{D}_{i}\\)。综合起来，这些\\(\\mathfrak{D}_{i}\\\
  )给出\\(M\\)的一个定向，我们将其记为\\((\\mathfrak{D}_{1},\\ldots,\\mathfrak{D}_{k})\\)。由定理16.6.8可知，取\\\
  ((\\pm\\mathfrak{D}_{1},\\ldots,\\pm\\mathfrak{D}_{k})\\)中所有符号组合，我们得到\\(M\\)的\\\
  (2^{k}\\)个可能的定向。\n\n设\\((\\overline{M},\\overline{\\mathfrak{D}})\\)是一个定向光滑\\(\\\
  bar{m}\\)-流形，其中\\(\\bar{m}\\ge 2\\)，并设\\(M\\)是\\(\\overline{M}\\)的一个子流形。一般来说，不存在从\\\
  (\\overline{\\mathfrak{D}}\\)构造\\(M\\)的定向的机制。然而，当\\(M\\)是\\(\\overline{M}\\)的超曲面时，这可能可行，如下一结果所示。\n\
  \n### 定理16.6.9。\n\n设\\((\\overline{M},\\overline{\\mathfrak{D}})\\)是一个定向光滑\\(\\\
  bar{m}\\)-流形，其中\\(\\bar{m}\\ge 2\\)，设\\(M\\)是\\(\\overline{M}\\)的超曲面，并假设在\\(\\widetilde{\\\
  mathfrak X}_{M}(M)\\)中存在一个处处非切向量场\\(V\\)。则：\n\n- (a) 存在\\(M\\)的一个唯一定向\\(\\mathfrak{D}_{M}\\\
  )，称为由\\(V\\)诱导的定向，使得对所有点\\(p\\in M\\)，\\((v_{1},\\ldots,v_{\\bar{m}-1})\\)是\\(T_{p}(M)\\\
  )的一个相对于\\(\\mathfrak{D}_{M}(p)\\)为正定向的基，当且仅当\\((V_{p},v_{1},\\ldots,v_{\\bar{m}-1})\\\
  )是\\(T_{p}(\\overline{M})\\)的一个相对于\\(\\overline{\\mathfrak{D}}(p)\\)为正定向的基。\n\n\
  - (b) 如果\\(\\varpi\\)是\\(\\overline{M}\\)上诱导\\(\\overline{\\mathfrak{D}}\\)的一个定向形式，则\\\
  (i_{V}(\\varpi)|_{M}\\)是\\(M\\)上诱导\\(\\mathfrak{D}_{M}\\)的一个定向形式。\n\n- (c) \\(\\\
  mathfrak{D}_{M}\\)不依赖于\\(\\overline{M}\\)上诱导\\(\\overline{\\mathfrak{D}}\\)的定向形式的选择。\n\
  \n**证明。** 这是定理8.2.5的流形版本，但我们给出详细证明。\n\n(a), (b)：设\\(\\varpi\\)是\\(\\overline{M}\\\
  )上诱导\\(\\overline{\\mathfrak{D}}\\)的一个定向形式。根据定理16.6.3，由定义可知，\\(\\varpi_{q}\\)是\\\
  (T_{q}(\\overline{M})\\)上的一个定向多重余向量，对所有\\(q\\in\\overline{M}\\)诱导\\(\\overline{\\\
  mathfrak{D}}(q)\\)。由定理8.2.5(b)可知，\\((i_{V}(\\varpi)|_{M})|_{p}=i_{V_{p}}(\\varpi_{p})|_{T_{p}(M)}\\\
  )是\\(T_{p}(M)\\)上的一个定向多重余向量，对所有\\(p\\in M\\)成立。因此，\\(i_{V}(\\varpi)|_{M}\\)是\\(M\\\
  )上的一个处处非零形式。对于向量场\\(X_{1},\\ldots,X_{\\bar{m}-1}\\in\\mathfrak X(M)\\)，我们有\n\n\\\
  [\ni_{V}(\\varpi)|_{M}(X_{1},\\ldots,X_{\\bar{m}-1})=\\varpi(V,X_{1},\\ldots,X_{\\\
  bar{m}-1}).\n\\]\n\n由于\\(\\varpi\\)是光滑的且\\(X_{1},\\ldots,X_{\\bar{m}-1}\\)是任意的，由定义可知，\\\
  (i_{V}(\\varpi)|_{M}\\)是光滑的。这表明\\(i_{V}(\\varpi)|_{M}\\)是\\(M\\)上的一个定向形式。由定理8.2.5(a)和定理16.6.3可知，由\\\
  (i_{V}(\\varpi)|_{M}\\)诱导的定向正是(a)部分陈述中所描述的定向。\n\n(c)：这由(a)部分得出。\n\n关于定理16.6.9，有几点评述是必要的。首先，虽然\\\
  (\\mathfrak{D}_{M}\\)不依赖于\\(\\overline{M}\\)上诱导\\(\\overline{\\mathfrak{D}}\\)的定向形式\\\
  (\\varpi\\)的选择，但对于\\(\\widetilde{\\mathfrak X}_{M}(M)\\)中处处非切向量场\\(V\\)的选择则不能这样说。特别地，由\\\
  (-V\\)诱导的定向是\\(-\\mathfrak{D}_{M}\\)。其次，即使\\(M\\)满足上述假设，也不能保证\\(\\widetilde{\\mathfrak\
  \ X}_{M}(M)\\)中一开始就存在处处非切向量场，这个问题我们将在定理19.11.1中重新讨论。\n\n设\\((M,\\mathfrak{D})\\\
  )和\\((\\overline{M},\\overline{\\mathfrak{D}})\\)是定向光滑\\(m\\)-流形，并设\\(F:M\\longrightarrow\\\
  overline{M}\\)是一个微分同胚。如果对所有\\(p\\in M\\)，线性映射\\(d_{p}(F):T_{p}(M)\\longrightarrow\
  \ T_{F(p)}(\\overline{M})\\)都是保定向的，则称\\(F\\)是保定向的。\n\n### 定理16.6.10。\n\n设\\(U\\\
  )和\\(V\\)是\\(\\mathbb{R}^{m}\\)中的开集，并设\\(F:U\\longrightarrow V\\)是一个微分同胚。则\\(F\\\
  )是保定向的当且仅当对所有\\(p\\in U\\)，\\(\\det(J_{F}(p))>0\\)，其中\\(J_{F}(p)\\)是\\(F\\)在\\(p\\\
  )处的雅可比矩阵。\n\n**证明。** 设\\(\\mathcal E\\)是\\(\\mathbb{R}^{m}\\)的标准基。由(10.1.3)，我们有\\\
  ([d_{p}(F)]_{\\mathcal E}^{\\mathcal E}=J_{F}(p)\\)，因此\\(\\det(d_{p}(F))=\\det(J_{F}(p))\\\
  )。现在由定理8.2.8可得结论。\n\n## 16.7 微分形式的积分\n\n在本节中，我们介绍光滑流形上的积分理论。了解到在此情形下被积分的对象不是函数而是微分形式，可能会令人感到惊讶。为了使函数的积分成为可能，我们需要一种光滑流形，它具有到目前为止尚未考虑过的额外结构。这个主题将在第19.10节中讨论。\n\
  \n设\\(M\\)是一个光滑\\(m\\)-流形，并设\\(\\omega\\)是\\(\\Lambda^{m}(M)\\)中的一个形式。\\(\\omega\\\
  )的**支集**记为\\(\\operatorname{supp}(\\omega)\\)，定义为\\(M\\)中\\(\\omega\\)非零点集的闭包：\n\
  \n\\[\n\\operatorname{supp}(\\omega)=\\operatorname{cl}_{M}(\\{p\\in M:\\omega_{p}\\\
  ne 0\\}).\n\\]\n\n如果\\(\\operatorname{supp}(\\omega)\\)在\\(M\\)中是紧的，则称\\(\\omega\\\
  )具有**紧支集**。设\\(U\\)是\\(M\\)中的一个开集。如果\\(\\operatorname{supp}(\\omega)\\subseteq U\\\
  )，则称\\(\\omega\\)具有**在\\(U\\)中的支集**；如果\\(\\operatorname{supp}(\\omega)\\subseteq\
  \ U\\)且\\(\\operatorname{supp}(\\omega)\\)在\\(M\\)中是紧的，则称\\(\\omega\\)具有**在\\(U\\\
  )中的紧支集**。\n\n我们首先在欧几里得空间的背景下定义微分形式的积分，然后推广到光滑流形。\n\n设\\(V\\)是\\(\\mathbb{R}^{m}\\\
  )中的一个开集，并设\\(\\omega\\)是\\(\\Lambda^{m}(V)\\)中具有紧支集的一个形式。由定理15.8.5，\\(\\omega\\\
  )可以表示为\n\n\\[\n\\omega=f\\,d(r^{1})\\wedge\\cdots\\wedge d(r^{m}), \\tag{16.7.1}\n\
  \\]\n\n可以证明，\\(\\int_{M}\\omega\\)不依赖于开覆盖的选择或单位分解的选择。\n\n微分形式的积分具有积分所期望的性质。\n\n\
  ### 定理16.7.2。\n\n设\\((M,\\mathcal D)\\)是一个定向光滑\\(m\\)-流形，设\\(\\omega,\\xi\\)是\\\
  (\\Lambda^{m}(M)\\)中具有紧支集的形式，并设\\(c\\)是一个实数。则：\n\n- (a) \\(\\displaystyle\\int_{M}(c\\\
  omega+\\xi)=c\\int_{M}\\omega+\\int_{M}\\xi.\\)\n\n- (b) \\(\\displaystyle\\int_{-M}\\\
  omega=-\\int_{M}\\omega,\\) 其中\\(-M\\)表示\\((M,-\\mathcal D)\\)。\n\n## 16.8 线积分\n\
  \n由于端点问题，\\(\\mathbb{R}\\)中的闭区间\\([a,b]\\)不是光滑1-流形。然而，正如第17.1节所讨论的，\\([a,b]\\)是我们稍后将称为带边界的光滑1-流形。就目前而言，忽略这一区别并将\\\
  ([a,b]\\)视为光滑1-流形是方便的。\n\n设\\(M\\)是一个光滑流形，并设\\(\\lambda(t):[a,b]\\longrightarrow\
  \ M\\)是一条（不一定光滑的）曲线。如果存在一个有限的实数序列\\(a=a_{0}<a_{1}<a_{2}<\\cdots<a_{k}=b\\)，使得\\\
  (\\lambda\\)在\\([a_{i},a_{i+1}]\\)上的限制对\\(i=0,\\ldots,k-1\\)是光滑曲线，则称\\(\\lambda\\\
  )是分段光滑的。假设\\(\\lambda\\)确实是分段光滑的，并设\\(\\omega\\)是\\(\\mathfrak X^{*}(M)\\)中的一个余向量场。受(16.7.3)的启发，\\\
  (\\omega\\)在\\(\\lambda\\)上的线积分记为\\(\\int_{\\lambda}\\omega\\)，定义为\n\n\\[\n\\int_{\\\
  lambda}\\omega=\\sum_{i=0}^{k-1}\\int_{[a_{i},a_{i+1}]}\\lambda^{*}(\\omega), \\\
  tag{16.8.1}\n\\]\n\n其中右端第\\(i\\)个被积式被解释为\\(\\lambda^{*}(\\omega)\\)限制到\\([a_{i},a_{i+1}]\\\
  )上的结果。当\\(\\lambda\\)光滑时，(16.8.1)简化为\n\n\\[\n\\int_{\\lambda}\\omega=\\int_{[a,b]}\\\
  lambda^{*}(\\omega). \\tag{16.8.2}\n\\]\n\n显然，\\([a_{i},a_{i+1}]\\)是\\(\\mathbb{R}\\\
  )中的一个积分域，并且由定理9.4.2，它对\\(i=0,\\ldots,k-1\\)是紧的。由定理15.11.8、(16.7.2)和(16.8.1)可得\n\n\
  \\[\n\\int_{\\lambda}\\omega=\\sum_{i=0}^{k-1}\\int_{a_{i}}^{a_{i+1}}\\omega_{\\\
  lambda(t)}\\left(\\frac{d\\lambda}{dt}(t)\\right)\\,dt. \\tag{16.8.3}\n\\]\n\n当\\\
  (\\lambda\\)光滑时，(16.8.3)简化为\n\n\\[\n\\int_{\\lambda}\\omega=\\int_{a}^{b}\\omega_{\\\
  lambda(t)}\\left(\\frac{d\\lambda}{dt}(t)\\right)\\,dt. \\tag{16.8.4}\n\\]\n\n\n\
  \n\n\n设 $g(u):[c,d]\\to[a,b]$ 为一个微分同胚，且 $c_i=g^{-1}(a_i)$ 对 $i=1,\\ldots,k+1$。根据定理\
  \ 10.2.4(c)，$g$ 要么严格递增，要么严格递减，所以我们有要么 $c=c_1<c_2<\\cdots<c_{k+1}=d$ 要么 $c=c_{k+1}<c_k<\\\
  cdots<c_1=d$。由 (16.8.1)，$\\omega$ 沿 $\\lambda\\circ g$ 的线积分是\n\n$$\\int_{\\lambda\\\
  circ g}\\omega=\\sum_{i=1}^{k}\\int_{g^{-1}([a_i,a_{i+1}])}(\\lambda\\circ g)^*(\\\
  omega). \\tag{16.8.5}$$\n\n其中\n\n$$g^{-1}([a_i,a_{i+1}])=\\begin{cases}[c_i,c_{i+1}]&\\\
  text{if }g\\text{ is strictly increasing},\\\\[2pt][c_{k+2-i},c_{k+1-i}]&\\text{if\
  \ }g\\text{ is strictly decreasing},\\end{cases}$$\n\n对 $i=1,\\ldots,k$。当 $\\lambda$\
  \ 光滑时，(16.8.5) 化简为\n\n$$\\int_{\\lambda\\circ g}\\omega=\\int_{[c,d]}(\\lambda\\\
  circ g)^*(\\omega). \\tag{16.8.6}$$\n\n下一个结果是定理 16.7.1 的线积分对应物。\n\n## 定理 16.8.1\
  \ (线积分的微分同胚不变性)。\n\n设 $M$ 为光滑流形，$\\omega$ 为 $\\mathfrak{X}^*(M)$ 中的余向量场，$\\lambda(t):[a,b]\\\
  to M$ 为分段光滑曲线，且 $g(u):[c,d]\\to[a,b]$ 为微分同胚。则\n\n$$\\int_{\\lambda\\circ g}\\omega=\\\
  pm\\int_{\\lambda}\\omega,$$\n\n其中正号（负号）是在 $g$ 严格递增（严格递减）时选取的。\n\n*证明.* 我们仅考虑 $\\\
  lambda$ 光滑的情形。则\n\n$$\\begin{aligned}\\int_{\\lambda}\\omega&=\\int_{[a,b]}\\lambda^*(\\\
  omega) &&[(16.8.2)]\\\\ &=\\pm\\int_{[c,d]}g^*(\\lambda^*(\\omega)) &&[\\text{Th\
  \ 16.7.1}]\\\\ &=\\pm\\int_{[c,d]}(\\lambda\\circ g)^*(\\omega) &&[\\text{Th 15.9.2,\
  \ (15.12.3)}]\\\\ &=\\pm\\int_{\\lambda\\circ g}\\omega. &&[(16.8.6)]\\end{aligned}$$\n\
  \n定理 16.8.1 表明，除以重参数化微分同胚的“方向”决定的符号外，$\\omega$ 的线积分与 $\\lambda$ 的参数化方式无关。\n\n下一个结果可以看作是微积分基本定理的推广。\n\
  \n## 定理 16.8.2 (线积分的微积分基本定理)。 设 $M$ 为光滑流形，$f$ 为 $C^\\infty(M)$ 中的函数，且 $\\lambda(t)\
  \ : [a, b] \\longrightarrow M$ 为分段光滑曲线。则\n\n$$\\int_{\\lambda} d(f) = f(\\lambda(b))\
  \ - f(\\lambda(a)).$$\n\n证明. 我们仅考虑 $\\lambda$ 光滑的情形。则\n\n$$\\int_{\\lambda} d(f)\
  \ = \\int_{a}^{b} d(f)_{\\lambda(t)} ( d\\lambda/dt (t) ) dt \\quad [(16.8.4)]$$\n\
  $$= \\int_{a}^{b} d_{\\lambda(t)}(f) ( d\\lambda/dt (t) ) dt \\quad [(15.4.4)]$$\n\
  $$= \\int_{a}^{b} d(f \\circ \\lambda)/dt (t) dt \\quad [\\text{Th 14.7.4(b)}]$$\n\
  $$= f(\\lambda(b)) - f(\\lambda(a)),$$\n\n其中最后的等式由微积分基本定理得出。\n\n## 16.9 闭的和恰当的余向量场\n\
  \n设 $M$ 为光滑流形，且 $\\omega$ 为 $\\mathfrak{X}^*(M)$ 中的余向量场。我们称 $\\omega$ 为闭的如果 $d(\\\
  omega)=0$，恰当的如果存在 $C^\\infty(M)$ 中的函数 $f$ 使得 $\\omega=d(f)$，保守的如果 $\\int_\\lambda\
  \ \\omega=0$ 对所有分段光滑曲线 $\\lambda(t):[a,b]\\longrightarrow M$ 且 $\\lambda(a)=\\lambda(b)$\
  \ 成立，以及路径无关的如果 $\\int_\\mu \\omega=\\int_\\psi \\omega$ 对所有分段光滑曲线 $\\mu(t):[a,b]\\\
  longrightarrow M$ 和 $\\psi(u):[c,d]\\longrightarrow M$ 且 $\\mu(a)=\\psi(c)$ 且 $\\\
  mu(b)=\\psi(d)$ 成立。在本节中，我们探讨这些性质之间的各种关系。\n\n## 定理 16.9.1。 设 $M$ 为光滑 $m$-流形，$\\omega$\
  \ 为 $\\mathfrak{X}^*(M)$ 中的余向量场，且在局部坐标下，\n\n$$\\omega = \\sum_i \\alpha^i d(x^i).$$\n\
  \n则 $\\omega$ 为闭的当且仅当对每一个这样的局部坐标表达式，\n\n$$\\partial\\alpha^i / \\partial x^j = \\\
  partial\\alpha^j / \\partial x^i$$\n\n对 $i,j=1,\\ldots,m$ 成立。\n\n证明. 如例 16.1.6 中计算那样给出\n\
  \n$$d(\\omega) = \\sum_{1 \\le i < j \\le m} ( \\partial\\alpha^j/\\partial x^i\
  \ - \\partial\\alpha^i/\\partial x^j ) d(x^i) \\wedge d(x^j),$$\n\n由此结果得出。\n\n##\
  \ 定理 16.9.2。 若 $M$ 为光滑流形且 $\\omega$ 为 $\\mathfrak{X}^*(M)$ 中的余向量场，则以下等价：\n\n- (a)\
  \ $\\omega$ 是恰当的。\n- (b) $\\omega$ 是保守的。\n- (c) $\\omega$ 是路径无关的。\n\n证明. (a) $\\\
  Rightarrow$ (b)：设 $f$ 为 $C^\\infty(M)$ 中的函数使得 $\\omega=d(f)$，且 $\\lambda(t):[a,b]\\\
  longrightarrow M$ 为分段光滑曲线使得 $\\lambda(a)=\\lambda(b)$。由定理 16.8.2，\n\n$$\\displaystyle\
  \ \\int_{\\lambda} \\omega = \\int_{\\lambda} d(f) = f(\\lambda(b)) - f(\\lambda(a))\
  \ = 0.$$\n\n(b) $\\Rightarrow$ (c)：设 $\\mu(t):[a,b]\\longrightarrow M$ 和 $\\psi(u):[c,d]\\\
  longrightarrow M$ 为光滑曲线使得 $\\mu(a)=\\psi(c)$ 且 $\\mu(b)=\\psi(d)$。不失一般性，我们假设 $[a,b]=[-1,0]$\
  \ 且 $[c,d]=[0,1]$，使得 $\\mu(-1)=\\psi(0)$ 且 $\\mu(0)=\\psi(1)$。定义光滑曲线 $g(s):[0,1]\\\
  longrightarrow[0,1]$ 为 $g(s)=1-s$，以及分段光滑曲线 $\\lambda(s):[-1,1]\\longrightarrow M$\
  \ 为\n\n$$\\displaystyle \\lambda(s)=\\begin{cases}\\mu(s) & \\text{if } s\\in[-1,0]\
  \ \\\\ \\psi\\circ g(s) & \\text{if } s\\in[0,1].\\end{cases}$$\n\n$\\lambda$ 的像是一条从\
  \ $\\mu(-1)=\\psi(0)$ 开始并结束于 $\\mu(-1)=\\psi(0)$ 的路径，并经过 $\\mu(0)=\\psi(1)$。我们有\n\
  \n$$\\displaystyle 0 = \\int_{\\lambda} \\omega = \\int_{\\mu} \\omega + \\int_{\\\
  psi\\circ g} \\omega = \\int_{\\mu} \\omega - \\int_{\\psi} \\omega,$$\n\n其中最后的等式来自定理\
  \ 16.8.1。结果得证。\n\n(c) $\\Rightarrow$ (a)：仅给出证明的概要。以下构造可在 $M$ 的每个连通分支上进行，所以不失一般性我们假设\
  \ $M$ 是连通的。设 $p_0$ 为 $M$ 中的给定点。由于 $M$ 是连通的，可以证明对 $M$ 中任意点 $p$，存在分段光滑曲线 $\\mu(t):[a,b]\\\
  longrightarrow M$ 使得 $\\mu(a)=p_0$ 且 $\\mu(b)=p$。设\n\n$$\\displaystyle f(p)=\\int_{\\\
  mu} \\omega.$$\n\n根据假设，$\\omega$ 的线积分是路径无关的，所以实数 $f(p)$ 不依赖于连接 $p_0$ 与 $p$ 的曲线的选择。因此，映射\
  \ $p\\longmapsto f(p)$ 定义了函数 $f:M\\longrightarrow\\mathbb{R}$。可以证明 $f$ 是光滑的。\n\n\
  我们断言 $d(f)=\\omega$。设 $\\lambda_1(t):[a,b]\\longrightarrow M$ 和 $\\lambda_2(t):[b,c]\\\
  longrightarrow M$ 为分段光滑曲线使得 $\\lambda_1(a)=p_0$ 且 $\\lambda_1(b)=\\lambda_2(b)$。定义分段光滑曲线\
  \ $\\lambda(t):[a,c]\\longrightarrow M$ 为\n\n$$\\displaystyle \\lambda(t)=\\begin{cases}\\\
  lambda_1(t) & \\text{if } t\\in[a,b] \\\\ \\lambda_2(t) & \\text{if } t\\in[b,c],\\\
  end{cases}$$\n\n使得 $\\lambda(a)=p_0$ 且 $\\lambda(b)=\\lambda_2(b)$。则\n\nf(λ₂(c))\
  \ = ∫_λ ω = ∫_{λ₁} ω + ∫_{λ₂} ω = f(λ₁(b)) + ∫_{λ₂} ω = f(λ₂(b)) + ∫_{λ₂} ω,\n\n\
  故\n\n∫_{λ₂} ω = f(λ₂(c)) − f(λ₂(b)) = ∫_{λ₂} d(f),\n\n其中最后的等式由定理 16.8.2 得出。于是，\n\
  \n∫_{λ₂} [ω − d(f)] = 0.\n\n可以证明由于 λ₂ 是任意的，ω − d(f) 必须是零形式；即 ω = d(f)。\n\n## 定理\
  \ 16.9.3。 设 $M$ 为光滑流形，且 $\\omega$ 为 $\\mathfrak{X}^*(M)$ 中的余向量场。若 $\\omega$ 是恰当的，则它是闭的。\n\
  \n证明. 这由定理 16.1.1(c) 得出。\n\n鉴于定理 16.9.3，余向量场关于是否恰当、是否闭有三种可能性：(i) 恰当（从而闭），(ii) 闭但不恰当，以及\
  \ (iii) 不闭（从而不恰当）。以下例子说明这三种情形。\n\n## 例 16.9.4。 设 $\\omega$ 为 $\\mathfrak{X}^*(\\\
  mathbb{R}^2)$ 中的余向量场，定义为\n\nω_{(r,s)} = s d(r) + r d(s).\n\n由于 ω = d(rs)，它是恰当的。\n\
  \n## 例 16.9.5 (穿孔平面)。 设 φ 为 [0,2π] 上的标准坐标，且 (r,s) 为 ℝ²\\{(0,0)} 上的标准坐标，穿孔平面。设 λ(φ)\
  \ : [0,2π] ⟶ ℝ²\\{(0,0)} 为光滑曲线 λ(φ) = (cos(φ), sin(φ))，并考虑形式\n\nω_{(r,s)} = − s/(r²\
  \ + s²) d(r) + r/(r² + s²) d(s)\n\n在 Λ²(ℝ²\\{(0,0)}) 中。利用定理 16.9.1，容易证明 ω 是闭的。设\
  \ (U, (xⁱ)) = ([0,2π], (φ)) 且 (V, (yʲ)) = (ℝ², (r,s)) 在定理 15.11.3 的推广中给出\n\nλ*(ω)(φ)\
  \ = [ (− s/(r² + s²) ∘ λ) ∂(r ∘ λ)/∂φ + ( r/(r² + s²) ∘ λ) ∂(s ∘ λ)/∂φ ] d(φ) =\
  \ ( − sin(φ)/(cos²(φ)+sin²(φ)) ∂(cos(φ))/∂φ + cos(φ)/(cos²(φ)+sin²(φ)) ∂(sin(φ))/∂φ\
  \ ) d(φ) = d(φ).\n\n则 (16.8.2) 给出\n\n∫_λ ω = ∫_[0,2π] λ*(ω) = ∫_0^{2π} dφ = 2π.\n\
  \n因此，ω 不是保守的。由定理 16.9.2，它不是恰当的。\n\n## 例 16.9.6。 设 ω 为 \U0001D51B*(ℝ²) 中的余向量场，定义为\n\
  \nω_(r,s) = rs d(r) + rs d(s).\n\n由定理 16.9.1 可知 ω 不是闭的。\n\n设 M 为光滑流形，且 ω 为 Λ^s(M)\
  \ 中的形式。推广先前的定义，我们称 ω 为闭的如果 d(ω)=0，且恰当的如果存在 Λ^{s−1}(M) 中的形式 ξ 使得 ω = d(ξ)。\n\n定理\
  \ 16.9.3 有一个直接的推广。\n\n## 定理 16.9.7。 设 M 为光滑流形，且 ω 为 Λ^s(U) 中的形式。若 ω 是恰当的，则它是闭的。\n\
  \n证明. 这由定理 16.1.1(c) 得出。\n\n我们回忆说 ℝ^m 的子集 S 关于点 p0 ∈ S 被称为星形，如果 t p + (1 − t) p0\
  \ 属于 S 对所有 p ∈ S 和所有 t ∈ [0,1]；即对所有 p ∈ S，连接 p0 与 p 的线段包含于 S。\n\n## 定理 16.9.8 (Poincaré\
  \ 引理)。 设 U 为 ℝ^m 中的星形开集，且 ω 为 Λ^s(U) 中的形式。若 ω 是闭的，则它是恰当的。\n\n证明. 我们寻求 Λ^{s−1}(U)\
  \ 中的形式 ξ 使得 d(ξ)=ω。不失一般性假设 U 关于 (0,…,0) 为星形，设我们把 U 视为具有覆盖坐标图 (U, id_U = (r^i)) 的光滑\
  \ m-流形，以及相应的坐标和对偶坐标框架 (∂/∂r^1,…,∂/∂r^m) 和 (d(r^1),…,d(r^m))。Λ^s(U) 中的任意形式都可以唯一地表示为\
  \ f d(r^{i1}) ∧ ⋯ ∧ d(r^{is}) 形式的和，其中 f 为 C^∞(U) 中的函数且 1 ≤ i1 < ⋯ < is ≤ m。我们定义一族线性映射\n\
  \nh : Λ^s(U) ⟶ Λ^s(U)\n\n对 s ≥ 1 指定 h 在此类形式上的作用，然后通过线性延拓到整个 Λ^s(U)：\n\nh( f(r^1,…,r^m)\
  \ d(r^{i1}) ∧ ⋯ ∧ d(r^{is}) ) = ( ∫_0^1 t^{s−1} f(t r^1,…,t r^m) dt ) d(r^{i1})\
  \ ∧ ⋯ ∧ d(r^{is})\n\n对所有 (r^1,…,r^m) ∈ U。由于 U 关于 (0,…,0) 为星形，f(t r^1,…,t r^m) 对所有\
  \ t ∈ [0,1] 有定义。\U0001D51B(U) 中的向量场 R 定义为\n\nR = Σ_i r^i ∂/∂r^i\n\n\n\n\n\n命题2.\
  \ \\(d \\circ h = h \\circ d.\\)\n\n我们有\n\\[\n\\begin{aligned}\nd\\left(\\int_{0}^{1}\
  \ t^{s-1} f(tr^{1},\\dots,tr^{m})\\,dt\\right) \\\\\n&= \\sum_{j} \\frac{\\partial}{\\\
  partial r^{j}}\\left(\\int_{0}^{1} t^{s-1} f(tr^{1},\\dots,tr^{m})\\,dt\\right)\
  \ d(r^{j}) \\quad [\\text{定理 15.4.7}] \\\\\n&= \\sum_{j}\\left(\\int_{0}^{1} \\\
  frac{\\partial}{\\partial r^{j}}\\left(t^{s-1} f(tr^{1},\\dots,tr^{m})\\right) dt\\\
  right) d(r^{j}) \\quad [\\text{定理 10.5.5}] \\\\\n&= \\sum_{j}\\left(\\int_{0}^{1}\
  \ t^{s} \\frac{\\partial f}{\\partial r^{j}}(tr^{1},\\dots,tr^{m})\\,dt\\right)\
  \ d(r^{j}),\n\\end{aligned}\n\\]\n因此\n\\[\n\\begin{aligned}\nh\\left(d\\left(f(r^{1},\\\
  dots,r^{m}) d(r^{i_{1}}) \\wedge \\cdots \\wedge d(r^{i_{s}})\\right)\\right) \\\
  \\\n&= h\\left(d(f)^{(r^{1},\\dots,r^{m})} \\wedge d(r^{i_{1}}) \\wedge \\cdots\
  \ \\wedge d(r^{i_{s}})\\right) \\\\\n&= h\\left(\\left[\\sum_{j} \\frac{\\partial\
  \ f}{\\partial r^{j}}(r^{1},\\dots,r^{m}) d(r^{j})\\right] \\wedge d(r^{i_{1}})\
  \ \\wedge \\cdots \\wedge d(r^{i_{s}})\\right) \\\\\n&= \\sum_{j} h\\left(\\frac{\\\
  partial f}{\\partial r^{j}}(r^{1},\\dots,r^{m}) d(r^{j}) \\wedge d(r^{i_{1}}) \\\
  wedge \\cdots \\wedge d(r^{i_{s}})\\right) \\\\\n&= \\sum_{j}\\left[\\left(\\int_{0}^{1}\
  \ t^{s} \\frac{\\partial f}{\\partial r^{j}}(tr^{1},\\dots,tr^{m}) dt\\right) d(r^{j})\
  \ \\wedge d(r^{i_{1}}) \\wedge \\cdots \\wedge d(r^{i_{s}})\\right] \\\\\n&= \\\
  left[\\sum_{j} \\frac{\\partial}{\\partial r^{j}}\\left(\\int_{0}^{1} t^{s-1} f(tr^{1},\\\
  dots,tr^{m}) dt\\right) d(r^{j})\\right] \\wedge d(r^{i_{1}}) \\wedge \\cdots \\\
  wedge d(r^{i_{s}}) \\\\\n&= d\\left(\\int_{0}^{1} t^{s-1} f(tr^{1},\\dots,tr^{m})\
  \ dt\\right) \\wedge d(r^{i_{1}}) \\wedge \\cdots \\wedge d(r^{i_{s}}) \\\\\n&=\
  \ d\\left(\\left[\\int_{0}^{1} t^{s-1} f(tr^{1},\\dots,tr^{m}) dt\\right] d(r^{i_{1}})\
  \ \\wedge \\cdots \\wedge d(r^{i_{s}})\\right) \\\\\n&= d\\left(h\\left(f(r^{1},\\\
  dots,r^{m}) d(r^{i_{1}}) \\wedge \\cdots \\wedge d(r^{i_{s}})\\right)\\right),\n\
  \\end{aligned}\n\\]\n其中第一个和第七个等式由定理16.1.2得出，第二个和第六个等式由定理15.4.7得出，第五个等式由定理10.5.5得出。这证明了该命题。\n\
  \n然后\n\\[\n\\begin{aligned}\n\\omega &= h \\circ \\mathcal{L}_{R}(\\omega) & [\\\
  text{命题1}] \\\\\n&= (h \\circ d \\circ i_{R} + h \\circ i_{R} \\circ d)(\\omega)\
  \ & [\\text{定理 16.5.3}] \\\\\n&= h \\circ d \\circ i_{R}(\\omega) & [\\omega \\\
  text{ 是闭形式}] \\\\\n&= d \\circ h \\circ i_{R}(\\omega) & [\\text{命题2}] \\\\\n&=\
  \ d\\left(h \\circ i_{R}(\\omega)\\right).\n\\end{aligned}\n\\]\n\n我们取 ξ = h(i_R(ω))。\n\
  \n定理16.9.8解释了为何例16.9.6中的形式不是恰当的：穿孔平面在原点处不是星形的。\n\n## 16.10 流\n\n我们在第15.1节中看到，光滑流形上光滑曲线的速度是曲线上的向量场。在本节中，我们将这一观察反过来，探讨光滑流形上给定的光滑向量场是否可以由一族光滑曲线的速度来实现。\n\
  \n设 M 为光滑流形，X 为 \U0001D51B(M) 中的向量场，p 为 M 中的一点。以 p 为起点的 X 的积分曲线是一条光滑曲线 λ(t) : (a,b)\
  \ ⟶ M，使得\n\nλ(0) = p 且 dλ/dt (t) = X_{λ(t)}\n\n对所有 t ∈ (a,b) 成立。若 λ 无法延拓到更大的开区间上仍满足这些性质的光滑曲线，则称\
  \ λ 是极大的。\n\n### 定理 16.10.1（极大积分曲线的存在性）。设 M 为光滑流形，X 为 \U0001D51B(M) 中的向量场，p 为 M\
  \ 中的一点。则以 p 为起点的 X 的极大积分曲线\n\nΦ_p(t) : (a_p, b_p) ⟶ M\n\n存在且唯一。\n\n注记。根据定义，\n\n\
  Φ_p(0) = p 且 dΦ_p/dt (t) = X_{Φ_p(t)} （16.10.1）\n\n对所有 t ∈ (a_p, b_p) 成立。\n\n证明。我们只考虑\
  \ Φ_p((a_p, b_p)) ⊂ U 的情形，其中 (U, (x^i)) 是 M 上的一个图。由定理14.7.1(b)可知，在局部坐标下，Φ_p 满足\n\
  \ndΦ_p/dt (t) = Σ_i d(x^i ∘ Φ_p)/dt (t) ∂/∂x^i |_{Φ_p(t)}\n\n对所有 t ∈ (a_p, b_p)\
  \ 成立。在局部坐标下，设 X = Σ_i α^i (∂/∂x^i)，于是\n\nX_{Φ_p(t)} = Σ_i α^i(Φ_p(t)) ∂/∂x^i |_{Φ_p(t)}。\n\
  \n（16.10.1）中的第二个恒等式现在可以表示为\n\nΣ_i d(x^i ∘ Φ_p)/dt (t) ∂/∂x^i |_{Φ_p(t)} = Σ_i α^i(Φ_p(t))\
  \ ∂/∂x^i |_{Φ_p(t)} ，\n\n这等价于常微分方程组\n\n$$\\frac{d(x^i \\circ \\Phi_p)}{dt}(t) =\
  \ \\alpha^i(\\Phi_p(t)) \\tag{16.10.2}$$\n\n其中 $i = 1, \\dots, m$。结论由微分方程理论得出。\n\
  \n### 例 16.10.2。设 $(r,s)$ 为 $\\mathbb{R}^2$ 上的标准坐标，考虑 $\\mathfrak{X}(\\mathbb{R}^2)$\
  \ 中的向量场 $X = (-s,r)$。设 $\\Phi_{(1,0)}(t) : \\mathbb{R} \\longrightarrow \\mathbb{R}^2$\
  \ 为以 $(1,0)$ 为起点的 $X$ 的积分曲线。对应于（16.10.2）的微分方程组为\n\n$$\\frac{d(r \\circ \\Phi_{(1,0)})}{dt}(t)\
  \ = -s \\circ \\Phi_{(1,0)}(t) \\quad \\text{和} \\quad \\frac{d(s \\circ \\Phi_{(1,0)})}{dt}(t)\
  \ = r \\circ \\Phi_{(1,0)}(t),$$\n\n初始条件为 $\\Phi_{(1,0)}(0) = (1,0)$。将 $\\Phi_{(1,0)}\
  \ = (\\Phi_{(1,0)}^1, \\Phi_{(1,0)}^2)$ 写出，方程组变为\n\n$$\\frac{d(\\Phi_{(1,0)}^1)}{dt}(t)\
  \ = -\\Phi_{(1,0)}^2(t) \\quad \\text{和} \\quad \\frac{d(\\Phi_{(1,0)}^2)}{dt}(t)\
  \ = \\Phi_{(1,0)}^1(t),$$\n\n初始条件为 $\\Phi_{(1,0)}^1(0) = 1$ 且 $\\Phi_{(1,0)}^2(0)\
  \ = 0$。显然的解是 $\\Phi_{(1,0)}(t) = (\\cos(t), \\sin(t))$，它显然是极大的。图16.10.1将向量场用箭头表示，积分曲线用虚线圆表示。\n\
  \n![](img/d712710a8eb78c0959204afd5dde4c91_459_0.png)\n\n# 图 16.10.1. 例 16.10.2\
  \ 的图示\n\n继续上述设定，设 $\\Phi_p(t) : (a_p, b_p) \\longrightarrow M$ 为以 $p$ 为起点的 $X$ 的极大积分曲线。极大流定义域定义为\n\
  \n$$D = \\{(t,p) : t \\in (a_p, b_p), p \\in M\\},$$\n\n$X$ 的极大流是映射 $\\Phi : D \\\
  longrightarrow M$，定义为\n\n$$\\Phi(t,p) = \\Phi_p(t)$$\n\n对所有 $(t,p) \\in D$ 成立。对每个\
  \ $t \\in \\mathbb{R}$，设\n\n$M_t = \\{p \\in M : t \\in (a_p, b_p)\\}$，\n\n并考虑映射\n\
  \n$\\Phi_t : M_t \\longrightarrow M$\n\n定义为\n\n$\\Phi_t(p) = \\Phi(t,p)$\n\n对所有\
  \ $p \\in M_t$ 成立。我们注意到，对于足够大的 $t$，$M_t$ 可能为空集。\n\n用物理术语来说，$M_t$ 是 $M$ 中这样的点 $p$\
  \ 的集合：从 $p$ 出发的“粒子”能在 $\\Phi$ 的“作用”下“流动”$t$ 个单位时间。将 $\\Phi_t$ 视为一个映射，使向量场的一部分在底层光滑流形上整体“流动”$t$\
  \ 个单位的“距离”，这有助于理解。我们观察到，利用上述定义，\n\n$\\Phi_p(t) = \\Phi(t,p) = \\Phi_t(p).$ \\quad\
  \ (16.10.3)\n\n### 定理 16.10.3（流的基本定理）。设 $M$ 为光滑流形，$X$ 为 $\\mathfrak{X}(M)$ 中的向量场，$\\\
  Phi(t,p) : D \\longrightarrow M$ 为 $X$ 的极大流。则：\n\n- (a) $D$ 是 $\\mathbb{R} \\times\
  \ M$ 中的开集。\n- (b) $\\Phi$ 是光滑的。\n- (c) $\\Phi$ 满足群法则：对所有 $p \\in M$，$\\Phi_p(0)\
  \ = p$；对所有 $s \\in (a_p, b_p)$ 以及 $t \\in (a_{\\Phi_p(s)}, b_{\\Phi_p(s)})$，且满足\
  \ $s+t \\in (a_p, b_p)$ 时，有 $\\Phi_{\\Phi_p(s)}(t) = \\Phi_p(s+t)$。\n- (d) 对每个 $t\
  \ \\in \\mathbb{R}$ 且 $M_t$ 非空，$M_t$ 是 $M$ 中的开集，且 $\\Phi_t : M_t \\longrightarrow\

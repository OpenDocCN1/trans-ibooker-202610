  \n```\n\U0001D524_ℋ(q) = (\U0001D524_p)_ℋ_q.\n```\n\n$\\mathfrak{g}$ 关于 $\\mathcal{H}$\
  \ 的逆矩阵记为 $\\mathfrak{g}_{\\mathcal{H}}^{-1}$ 并定义为\n\n```\n\U0001D524_ℋ⁻¹(q) = \U0001D524\
  _ℋ(q)⁻¹\n```\n\n对所有 $q$ 在 $U$ 中。通常用上标表示 $\\mathfrak{g}_{\\mathcal{H}}(q)^{-1}$ 的条目：\n\
  \n```\n\U0001D524_ℋ⁻¹(q) = [ \U0001D524₁₁(q)  \U0001D524₁₂(q) ; \U0001D524₂₁(q)\
  \  \U0001D524₂₂(q) ]⁻¹ = [ \U0001D524¹¹(q)  \U0001D524¹²(q) ; \U0001D524²¹(q)  \U0001D524\
  ²²(q) ].\n```\n\n映射 $q \\mapsto \\mathfrak{g}^{ij}(q)$ 定义了 $C^\\infty(U)$ 中的函数 $\\\
  mathfrak{g}^{ij}$，$i, j = 1, 2$。由于 $[\\mathfrak{g}_{ij}]$ 和 $[\\mathfrak{g}^{ij}]$\
  \ 都是对称矩阵，函数 $\\mathfrak{g}_{ij}$ 和 $\\mathfrak{g}^{ij}$ 在 $i, j$ 上对称。\n\n## 12.3\
  \ $\\mathbb{R}^3_\\nu$ 中的诱导欧几里得导数\n\n设 $M$ 为正则曲面，且 $X$ 为 $\\mathfrak{X}(M)$ 中的向量场。关于\
  \ $X$ 的诱导欧几里得导数由两个映射组成，均记为 $D_X$。第一个是\n\n```\nD_X : C^∞(M) ⟶ C^∞(M)\n```\n\n定义为\n\
  \n```\nD_X(f)(p) = d_p(f)(X_p)   (12.3.1)\n```\n\n对所有函数 $f$ 在 $C^\\infty(M)$ 中和所有\
  \ $p$ 在 $M$ 中。第二个是\n\n```\nD_X : \U0001D51B_ℝ³(M) ⟶ \U0001D51B_ℝ³(M)\n```\n\n定义为\n\
  \n```\nD_X(V)_p = d_p(V)(X_p)   (12.3.2)\n```\n\n对所有向量场 $V$ 在 $\\mathfrak{X}_{\\\
  mathbb{R}^3_\\nu}(M)$ 中和所有 $p$ 在 $M$ 中。（从上下文中将清楚 $D_X$ 的记号是指关于 $X$ 的诱导欧几里得导数而不是第\
  \ 10.3 节中讨论的关于 $X$ 的欧几里得导数。）\n\n我们由 (11.5.1) 和 (11.7.1) 得到 $D_X(f)(p)$ 和 $D_X(V)_p$\
  \ 可以表示为\n\n$$D_X(f)(p)=\\frac{d(f\\circ\\lambda)}{dt}(t_0)$$  (12.3.3)\n\n和\n\n\
  $$D_X(V)_p=\\frac{d(V\\circ\\lambda)}{dt}(t_0),$$  (12.3.4)\n\n其中 $\\lambda(t):(a,b)\\\
  longrightarrow M$ 是任意光滑曲线使得 $\\lambda(t_0)=p$ 且 $(d\\lambda/dt)(t_0)=X_p$。设 $V=(\\\
  alpha^1,\\alpha^2,\\alpha^3)$。由定理 11.7.2 和 (12.3.2) 可得 $D_X(V)_p$ 也可以表示为\n\n$$D_X(V)_p=\\\
  bigl(d_p(\\alpha^1)(X_p),d_p(\\alpha^2)(X_p),d_p(\\alpha^3)(X_p)\\bigr).$$  (12.3.5)\n\
  \n遵循 (12.2.2)，对向量场 $V,W$ 在 $\\mathfrak{X}_{\\mathbb{R}^3_\\nu}(M)$ 中，我们定义函数\n\n\
  $$\\langle V,W\\rangle:M\\longrightarrow\\mathbb{R}$$\n\n在 $C^\\infty(M)$ 中，通过赋值\n\
  \n$$p\\longmapsto\\langle V_p,W_p\\rangle$$\n\n对所有 $p$ 在 $M$ 中。\n\n下一个结果是定理 10.3.1\
  \ 的对应物。\n\n## **定理 12.3.1。**\n\n设 $M$ 为正则曲面，设 $X,Y$ 和 $V,W$ 分别为 $\\mathfrak{X}(M)$\
  \ 和 $\\mathfrak{X}_{\\mathbb{R}^3_\\nu}(M)$ 中的向量场，且 $f$ 为 $C^\\infty(M)$ 中的函数。则：\n\
  \n+   (a) $D_{X+Y}(V)=D_X(V)+D_Y(V)$。\n+   \n+   (b) $D_{fX}(V)=fD_X(V)$。\n+   \n\
  +   (c) $D_X(V+W)=D_X(V)+D_X(W)$。\n+   \n+   (d) $D_X(fV)=D_X(f)V+fD_X(V)$。\n+ \
  \  \n+   (e) $D_X(\\langle V,W\\rangle)=\\langle D_X(V),W\\rangle+\\langle V,D_X(W)\\\
  rangle$。\n\n**证明.** (a)–(d): 利用定理 11.5.3 和定理 11.7.2 得到结果。\n\n(e): 设 $p$ 为 $M$ 中的一点，且\
  \ $\\lambda(t):(a,b)\\longrightarrow M$ 为光滑曲线使得 $\\lambda(t_0)=p$ 且 $(d\\lambda/dt)(t_0)=X_p$\
  \ 对某个 $t_0$ 在 $(a,b)$ 中成立。另设 $(\\epsilon_1,\\epsilon_2,\\epsilon_3)=(1,1,(-1)^\\\
  nu)$ 为 $\\mathbb{R}^3_\\nu$ 的符号，且 $V=(\\alpha^1,\\alpha^2,\\alpha^3)$ 和 $W=(\\beta^1,\\\
  beta^2,\\beta^3)$。由定理 4.2.8，\n\n$$\\langle V,W\\rangle\\circ\\lambda=\\langle V\\\
  circ\\lambda,W\\circ\\lambda\\rangle=\\sum_i\\epsilon_i(\\alpha^i\\circ\\lambda)(\\\
  beta^i\\circ\\lambda),$$\n\n\n因此\n\n\\[\nD_X(\\langle V,W\\rangle)_p = \\frac{d(\\\
  langle V,W\\rangle \\circ \\lambda)}{dt}(t_0)\n= \\sum_i \\varepsilon_i \\left[\
  \ \\frac{d(\\alpha^i \\circ \\lambda)}{dt}(t_0) (\\beta^i \\circ \\lambda)(t_0)\
  \ + (\\alpha^i \\circ \\lambda)(t_0) \\frac{d(\\beta^i \\circ \\lambda)}{dt}(t_0)\
  \ \\right]\n= \\left\\langle \\frac{d(V \\circ \\lambda)}{dt}(t_0), W \\circ \\\
  lambda(t_0) \\right\\rangle + \\left\\langle V \\circ \\lambda(t_0), \\frac{d(W\
  \ \\circ \\lambda)}{dt}(t_0) \\right\\rangle\n= \\langle D_X(V)_p, W_p \\rangle\
  \ + \\langle V_p, D_X(W)_p \\rangle,\n\\]\n\n其中第一个等式由(12.3.3)得出，第三个等式由定理4.2.8得出，最后一个等式由(12.3.4)得出。由于\
  \ \\(p\\) 是任意的，结论成立。\n\n根据定义，若 \\(V\\) 是 \\(\\mathfrak{X}_{\\mathbb{R}^3_\\nu}(M)\\\
  ) 中的向量场，则 \\(D_X(V)\\) 是 \\(\\mathfrak{X}_{\\mathbb{R}^3_\\nu}(M)\\) 中的向量场。特别地，若\
  \ \\(Y\\) 是 \\(\\mathfrak{X}(M) \\subset \\mathfrak{X}_{\\mathbb{R}^3_\\nu}(M)\\\
  ) 中的向量场，则 \\(D_X(Y)\\) 是 \\(\\mathfrak{X}_{\\mathbb{R}^3_\\nu}(M)\\) 中的向量场。然而，如下例所示，\\\
  (D_X(Y)\\) 可能不是 \\(\\mathfrak{X}(M)\\) 中的向量场。换言之，即使对所有 \\(M\\) 中的 \\(p\\)，\\(Y_p\\\
  ) 是 \\(T_p(M)\\) 中的向量，对 \\(D_X(Y)_p\\) 却未必如此。\n\n### 例 12.3.2（半球面）\n\n继续例 11.2.6\
  \ 和例 11.3.2，由例 11.2.5 可知\n\n\\[\n\\varphi_1(D) = \\{(x, y, \\sqrt{1 - x^2 - y^2})\
  \ : (x, y) \\in D\\}\n\\]\n\n是一个正则曲面。那么 \\((D, \\varphi_1)\\) 是 \\(\\varphi_1(D)\\\
  ) 上的一个覆盖图，并且\n\n\\[\nX = \\left(1, 0, -\\frac{x}{\\sqrt{1 - x^2 - y^2}}\\right),\n\
  \\]\n\n它是与 \\((D, \\varphi_1)\\) 对应的坐标标架中的第一个向量场，是 \\(\\varphi_1(D)\\) 上的切向量场。因此，\\\
  (X_{(x,y)}\\) 属于 \\(T_{p(x,y)}(\\varphi_1(D))\\)，其中 \\(p(x,y) = (x, y, \\sqrt{1\
  \ - x^2 - y^2})\\)。考虑光滑曲线 \\(\\lambda(t) : (-1,1) \\longrightarrow \\varphi_1(D)\\\
  )，由 \\(\\lambda(t) = (t, 0, \\sqrt{1 - t^2})\\) 给出，其像是 \\(\\varphi_1(D)\\) 与 \\\
  (\\mathbb{R}^3_\\nu\\) 中 \\(xz\\)-平面的交集。我们有\n\n\\[\nX_{\\lambda(t)} = \\left(1,\
  \ 0, -\\frac{t}{\\sqrt{1 - t^2}}\\right).\n\\]\n\n设 \\((M,\\mathbf{g})\\) 是 \\(\\\
  mathbb{R}^3_\\nu\\) 中的正则曲面，设 \\((U,\\varphi)\\) 是 \\(M\\) 上的图，并设 \\(\\mathcal{H}=(H_1,H_2)\\\
  ) 和 \\(G\\) 为相应的坐标标架和坐标单位法向量场。沿用之前对向量值映射的记号，我们记\n\n\\[\n\\frac{\\partial H_i}{\\\
  partial r^j}(q)\\qquad\\text{为}\\qquad\\left.\\frac{\\partial H_i}{\\partial r^j}\\\
  right|_q\n\\]\n\n对所有 \\(U\\) 中的 \\(q\\) 以及 \\(i,j=1,2\\)。由定理 8.4.10(b) 和定理 12.2.11\
  \ 可知 \\((G_q,H_1|_q,H_2|_q)\\) 是 \\(\\mathbb{R}^3_\\nu\\) 的一组基。那么 \\(\\partial H_i/\\\
  partial r^j\\) 可以表示为\n\n\\[\n\\frac{\\partial H_i}{\\partial r^j}=\\sum_k\\Gamma_{ij}^k\
  \ H_k+\\vartheta_{ij}G,\\qquad(12.3.6)\n\\]\n\n其中 \\(\\Gamma_{ij}^k\\) 称为克里斯托费尔符号，并且\
  \ \\(\\vartheta_{ij}\\) 是 \\(U\\) 上唯一确定的函数，\\(i,j,k=1,2.\\)\n\n### 定理 12.3.3\n\n\
  在上述设定下，对 \\(i,j,k=1,2\\)：\n\n- (a) \\(\\Gamma_{ij}^k\\) 和 \\(\\vartheta_{ij}\\)\
  \ 是 \\(C^\\infty(U)\\) 中的函数。\n- (b)\n  \\[\n  \\Gamma_{ij}^k=\\frac12\\sum_l\\mathfrak{g}^{kl}\\\
  left(\\frac{\\partial\\mathfrak{g}_{jl}}{\\partial r^i}+\\frac{\\partial\\mathfrak{g}_{il}}{\\\
  partial r^j}-\\frac{\\partial\\mathfrak{g}_{ij}}{\\partial r^l}\\right).\n  \\]\n\
  - (c)\n  \\[\n  \\vartheta_{ij}=\\epsilon_M\\left\\langle\\frac{\\partial H_i}{\\\
  partial r^j},G\\right\\rangle.\n  \\]\n- (d) \\(\\Gamma_{ij}^k\\) 和 \\(\\vartheta_{ij}\\\
  ) 关于 \\(i,j\\) 对称；即\n  \\[\n  \\Gamma_{ij}^k=\\Gamma_{ji}^k\\qquad\\text{且}\\qquad\\\
  vartheta_{ij}=\\vartheta_{ji}.\n  \\]\n\n**证明。**\n\n(b)：由(12.3.6)可知\n\n\\[\n\\left\\\
  langle\\frac{\\partial H_i}{\\partial r^j},H_k\\right\\rangle\n=\\left\\langle\\\
  sum_n\\Gamma_{ij}^n H_n+\\vartheta_{ij}G,H_k\\right\\rangle\n=\\sum_n\\Gamma_{ij}^n\\\
  langle H_k,H_n\\rangle\n=\\sum_n\\mathfrak{g}_{kn}\\Gamma_{ij}^n,\n\\]\n\n再由 \\\
  (\\mathfrak{g}_{ij}=\\langle H_i,H_j\\rangle\\) 可得\n\n\\[\n\\frac{\\partial\\mathfrak{g}_{ij}}{\\\
  partial r^k}\n=\\left\\langle\\frac{\\partial H_i}{\\partial r^k},H_j\\right\\rangle\n\
  +\\left\\langle H_i,\\frac{\\partial H_j}{\\partial r^k}\\right\\rangle\n=\\sum_n\\\
  left(\\mathfrak{g}_{jn}\\Gamma_{ik}^n+\\mathfrak{g}_{in}\\Gamma_{jk}^n\\right).\\\
  qquad(12.3.7)\n\\]\n\n因此，\n\n\\[\n\\frac{\\partial\\mathfrak{g}_{jl}}{\\partial\
  \ r^i}\n=\\sum_n\\left(\\mathfrak{g}_{ln}\\Gamma_{ij}^n+\\mathfrak{g}_{jn}\\Gamma_{il}^n\\\
  right)\n\\]\n\n\\[\n\\frac{\\partial\\mathfrak{g}_{il}}{\\partial r^j}\n=\\sum_n\\\
  left(\\mathfrak{g}_{ln}\\Gamma_{ij}^n+\\mathfrak{g}_{in}\\Gamma_{jl}^n\\right)\n\
  \\]\n\n\\[\n\\frac{\\partial\\mathfrak{g}_{ij}}{\\partial r^l}\n=\\sum_n\\left(\\\
  mathfrak{g}_{jn}\\Gamma_{il}^n+\\mathfrak{g}_{in}\\Gamma_{jl}^n\\right),\n\\]\n\n\
  因此\n\n\\[\n\\frac12\\left(\\frac{\\partial\\mathfrak{g}_{jl}}{\\partial r^i}\n+\\\
  frac{\\partial\\mathfrak{g}_{il}}{\\partial r^j}\n-\\frac{\\partial\\mathfrak{g}_{ij}}{\\\
  partial r^l}\\right)\n=\\sum_n\\mathfrak{g}_{ln}\\Gamma_{ij}^n.\n\\]\n\n将上述恒等式两边乘以\
  \ \\(\\mathfrak{g}^{kl}\\) 并对 \\(l\\) 求和，得到\n\n\\[\n\\frac12\\sum_l\\mathfrak{g}^{kl}\\\
  left(\\frac{\\partial\\mathfrak{g}_{jl}}{\\partial r^i}\n+\\frac{\\partial\\mathfrak{g}_{il}}{\\\
  partial r^j}\n-\\frac{\\partial\\mathfrak{g}_{ij}}{\\partial r^l}\\right)\n=\\sum_l\\\
  mathfrak{g}^{kl}\\left(\\sum_n\\mathfrak{g}_{ln}\\Gamma_{ij}^n\\right)\n=\\sum_n\\\
  left(\\sum_l\\mathfrak{g}^{kl}\\mathfrak{g}_{ln}\\right)\\Gamma_{ij}^n\n=\\sum_n\\\
  delta_n^k\\Gamma_{ij}^n\n=\\Gamma_{ij}^k.\n\\]\n\n(c)：由定理 12.2.11(b) 和(12.3.6)可得\n\
  \n\\[\n\\left\\langle\\frac{\\partial H_i}{\\partial r^j},G\\right\\rangle\n=\\\
  left\\langle\\sum_k\\Gamma_{ij}^k H_k+\\vartheta_{ij}G,G\\right\\rangle\n=\\sum_k\\\
  Gamma_{ij}^k\\langle H_k,G\\rangle+\\vartheta_{ij}\\langle G,G\\rangle\n=\\epsilon_M\\\
  vartheta_{ij}.\n\\]\n\n(a)：这由部分(b)和(c)得出。\n\n(d)：\\(\\Gamma_{ij}^k\\) 的对称性由部分(b)和\
  \ \\(\\mathfrak{g}_{ij}\\) 的对称性得出。由定理 10.1.6 和(11.2.1)可得\n\n\\[\n\\frac{\\partial\
  \ H_i}{\\partial r^j}=\\frac{\\partial H_j}{\\partial r^i}.\n\\]\n\n\\(\\vartheta_{ij}\\\
  ) 的对称性现在由部分(c)得出。\n\n我们将频繁使用定理 12.3.3(d)所给出的克里斯托费尔符号的对称性，通常不再注明。如果一个量的定义仅依赖于度量，则称该量是\
  \ \\(\\mathbb{R}^3_\\nu\\) 中正则曲面几何的内禀量。据此，定理 12.3.3(b)表明克里斯托费尔符号是内禀的。\n\n我们稍后将看到，克里斯托费尔符号与\
  \ \\(\\mathbb{R}^3_\\nu\\) 中正则曲面的“曲率”密切相关。特别地，当所有克里斯托费尔符号恒为常数 0 时，曲面是“平坦的”。例如，考虑第\
  \ 13.1 节中讨论的 \\(\\mathbb{R}^3_0\\) 中的 \\(xy\\)-平面 Pln。由于 \\(\\mathfrak{g}_H=I_2\\\
  )，由定理 12.3.3(b)可知每个 \\(\\Gamma_{ij}^k=0\\)。因此，毫不奇怪，Pln 是“平坦的”。\n\n设 \\((M,\\mathfrak{g})\\\
  ) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面，设 \\(X\\) 是 \\(M\\) 上的（不一定光滑的）向量场。设 \\((U,\\\
  varphi)\\) 是 \\(M\\) 上的图，并设 \\((H_1,H_2)\\) 为相应的坐标标架。那么 \\(X\\circ\\varphi\\) 可以表示为\n\
  \n\\[\nX\\circ\\varphi=\\sum_i\\alpha^iH_i,\\qquad(12.3.8)\n\\]\n\n其中 \\(\\alpha^i\\\
  ) 是 \\(U\\) 上唯一确定的函数，称为 \\(X\\) 关于 \\((U,\\varphi)\\) 的分量。(12.3.8)的右端称为 \\(X\\)\
  \ 关于 \\((U,\\varphi)\\) 的局部坐标表示。我们引入记号\n\n\\[\n\\alpha^i_{;j}=\\frac{\\partial\\\
  alpha^i}{\\partial r^j}+\\sum_k\\alpha^k\\Gamma_{jk}^i\\qquad(12.3.9)\n\\]\n\n其中\
  \ \\(i,j=1,2\\)。\n\n### 定理 12.3.4\n\n在上述设定下，若 \\(X\\) 属于 \\(\\mathfrak{X}(M)\\)，则对\
  \ \\(i=1,2\\)，\\(\\alpha^i\\) 是 \\(C^\\infty(U)\\) 中的函数。\n\n**证明。** 我们有\n\n\\[\n\
  \\langle X\\circ\\varphi,H_k\\rangle\n=\\left\\langle\\sum_j\\alpha^jH_j,H_k\\right\\\
  rangle\n=\\sum_j\\alpha^j\\langle H_j,H_k\\rangle\n=\\sum_j\\alpha^j\\mathfrak{g}_{jk},\n\
  \\]\n\n因此\n\n\\[\n\\sum_k\\mathfrak{g}^{ik}\\langle X\\circ\\varphi,H_k\\rangle\n\
  =\\sum_k\\mathfrak{g}^{ik}\\left(\\sum_j\\alpha^j\\mathfrak{g}_{jk}\\right)\n=\\\
  sum_j\\alpha^j\\left(\\sum_k\\mathfrak{g}^{ik}\\mathfrak{g}_{kj}\\right)\n=\\sum_j\\\
  alpha^j\\delta^i_j\n=\\alpha^i.\n\\]\n\n根据假设，\\(X\\) 是光滑的。由定理 11.7.1 可知 \\(X\\circ\\\
  varphi\\) 是光滑的，因此 \\(\\alpha^i\\) 也是光滑的。\n\n### 定理 12.3.5\n\n设 \\((M,\\mathfrak{g})\\\
  ) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面，设 \\((U,\\varphi)\\) 是 \\(M\\) 上的图，并设 \\((H_1,H_2)\\\
  ) 为相应的坐标标架。设 \\(X,Y\\) 是 \\(\\mathfrak{X}(M)\\) 中的向量场，且在局部坐标下，\n\n\\[\nX\\circ\\\
  varphi=\\sum_i\\alpha^iH_i\\qquad\\text{且}\\qquad Y\\circ\\varphi=\\sum_j\\beta^jH_j.\n\
  \\]\n\n那么，对 \\(i,j=1,2\\)：\n\n- (a)\n  \\[\n  D_{H_i\\circ\\varphi^{-1}}(H_j\\circ\\\
  varphi^{-1})\\circ\\varphi\n  =\\sum_k\\Gamma_{ij}^kH_k+\\vartheta_{ij}G.\n  \\\
  ]\n- (b)\n  \\[\n  D_{H_i\\circ\\varphi^{-1}}(Y)\\circ\\varphi\n  =\\sum_j\\beta^j_{;i}H_j+\\\
  left(\\sum_j\\beta^j\\vartheta_{ij}\\right)G.\n  \\]\n- (c)\n  \\[\n  D_X(Y)\\circ\\\
  varphi\n  =\\sum_j\\left(\\sum_i\\alpha^i\\beta^j_{;i}\\right)H_j\n  +\\left(\\\
  sum_{ij}\\alpha^i\\beta^j\\vartheta_{ij}\\right)G.\n  \\]\n\n**证明。** 在以下证明中反复使用定理\
  \ 12.3.1。\n\n(a)：设 \\(p\\) 是 \\(\\varphi(U)\\) 中的一点，设 \\(q=\\varphi^{-1}(p)\\)，并设\
  \ \\((e_1,e_2)\\) 是 \\(\\mathbb{R}^2\\) 的标准基。对于给定的 \\(1\\le i\\le 2\\)，我们定义一个光滑映射\n\
  \n\\[\n\\zeta=(\\zeta^1,\\zeta^2):(-\\varepsilon,\\varepsilon)\\longrightarrow U\n\
  \\]\n\n由 \\(\\zeta(t)=q+te_i\\) 给出，其中选择 \\(\\varepsilon>0\\) 足够小，使得 \\((q-\\varepsilon\
  \ e_i,q+\\varepsilon e_i)\\subset U\\)。考虑由 \\(\\lambda=\\varphi\\circ\\zeta\\) 定义的光滑曲线\
  \ \\(\\lambda(t):(-\\varepsilon,\\varepsilon)\\longrightarrow M\\)，并观察到 \\(\\lambda(0)=\\\
  varphi(q)=p\\)。由定理 10.1.10，\n\n\\[\n\\frac{d\\lambda}{dt}(0)\n=\\frac{d(\\varphi\\\
  circ\\zeta)}{dt}(0)\n=\\sum_k\\frac{d\\zeta^k}{dt}(0)H_k\\big|_q\n=H_i\\big|_q.\n\
  \\]\n\n且\n\n\\[\n\\frac{d(H_j\\circ\\zeta)}{dt}(0)\n=\\sum_k\\frac{d\\zeta^k}{dt}(0)\\\
  left.\\frac{\\partial H_j}{\\partial r^k}\\right|_q\n=\\left.\\frac{\\partial H_j}{\\\
  partial r^i}\\right|_q.\n\\]\n\n由定理 10.1.17 和定理 11.2.8 可知 \\(H_j\\circ\\varphi^{-1}\\\
  ) 是光滑的。我们有\n\n\\[\nD_{H_i\\circ\\varphi^{-1}}(H_j\\circ\\varphi^{-1})\\big|_p\n\
  =\\frac{d(H_j\\circ\\varphi^{-1}\\circ\\lambda)}{dt}(0)\n=\\frac{d(H_j\\circ\\zeta)}{dt}(0)\n\
  =\\left.\\frac{\\partial H_j}{\\partial r^i}\\right|_q\n=\\sum_k\\Gamma_{ij}^k(q)H_k\\\
  big|_q+\\vartheta_{ij}(q)G_q\n=\\left.\\left(\\sum_k\\Gamma_{ij}^kH_k+\\vartheta_{ij}G\\\
  right)\\right|_{\\varphi^{-1}(p)}\n=\\left.\\left(\\left[\\sum_k\\Gamma_{ij}^kH_k+\\\
  vartheta_{ij}G\\right]\\circ\\varphi^{-1}\\right)\\right|_p.\n\\]\n\n由于 \\(p\\)\
  \ 是任意的，\n\n\\[\nD_{H_i\\circ\\varphi^{-1}}(H_j\\circ\\varphi^{-1})\n=\\left(\\sum_k\\\
  Gamma_{ij}^kH_k+\\vartheta_{ij}G\\right)\\circ\\varphi^{-1},\n\\]\n\n由此结论成立。\n\n\
  (b)：如同部分(a)那样论证可得\n\n\\[\n\\frac{d(\\beta^j\\circ\\zeta)}{dt}(0)=\\frac{\\partial\\\
  beta^j}{\\partial r^i}(q).\n\\]\n\n\n由定理 10.1.17 和定理 11.2.8 可知，$\\beta^j \\circ\
  \ \\varphi^{-1}$ 是光滑的。我们有\n\n$D_{H_i \\circ \\varphi^{-1}}(\\beta^j \\circ \\varphi^{-1})(p)\
  \ = \\frac{d(\\beta^j \\circ \\varphi^{-1} \\circ \\lambda)}{dt}(0) \\quad [(12.3.3)]$\n\
  $= \\frac{d(\\beta^j \\circ \\zeta)}{dt}(0)$\n$= \\frac{\\partial \\beta^j}{\\partial\
  \ r^i}(q) \\quad [(12.3.12)]$\n$= \\frac{\\partial \\beta^j}{\\partial r^i}(\\varphi^{-1}(p))\
  \ = \\left(\\frac{\\partial \\beta^j}{\\partial r^i} \\circ \\varphi^{-1}\\right)(p).$\n\
  \n由于 $p$ 是任意的，\n\n$D_{H_i \\circ \\varphi^{-1}}(\\beta^j \\circ \\varphi^{-1}) =\
  \ \\frac{\\partial \\beta^j}{\\partial r^i} \\circ \\varphi^{-1}. \\qquad (12.3.13)$\n\
  \n于是\n\n$D_{H_i \\circ \\varphi^{-1}}(Y) = D_{H_i \\circ \\varphi^{-1}}\\left(\\\
  left[\\sum_j \\beta^j H_j\\right] \\circ \\varphi^{-1}\\right)$\n$= D_{H_i \\circ\
  \ \\varphi^{-1}}\\left(\\sum_j (\\beta^j \\circ \\varphi^{-1})(H_j \\circ \\varphi^{-1})\\\
  right)$\n$= \\sum_j D_{H_i \\circ \\varphi^{-1}}\\left((\\beta^j \\circ \\varphi^{-1})(H_j\
  \ \\circ \\varphi^{-1})\\right)$\n$= \\sum_j \\left[D_{H_i \\circ \\varphi^{-1}}(\\\
  beta^j \\circ \\varphi^{-1})(H_j \\circ \\varphi^{-1}) + (\\beta^j \\circ \\varphi^{-1})\
  \ D_{H_i \\circ \\varphi^{-1}}(H_j \\circ \\varphi^{-1})\\right]$\n$= \\sum_j \\\
  left(\\frac{\\partial \\beta^j}{\\partial r^i} \\circ \\varphi^{-1}\\right)(H_j\
  \ \\circ \\varphi^{-1}) + \\sum_j (\\beta^j \\circ \\varphi^{-1})\\left[\\left(\\\
  sum_k \\Gamma^k_{ij} H_k + \\vartheta_{ij} G\\right) \\circ \\varphi^{-1}\\right]$\n\
  $= \\left[\\sum_j \\frac{\\partial \\beta^j}{\\partial r^i} H_j + \\sum_j \\beta^j\
  \ \\left(\\sum_k \\Gamma^k_{ij} H_k + \\vartheta_{ij} G\\right)\\right] \\circ \\\
  varphi^{-1}, $\n\n其中第五个等号由 (12.3.13) 和第 (a) 部分得到。因此，\n\n$$D_{H_i\\circ\\varphi^{-1}}(Y)\\\
  circ\\varphi=\\sum_j\\frac{\\partial\\beta^j}{\\partial r^i}H_j+\\sum_j\\beta^j\\\
  left(\\sum_k\\Gamma^k_{ij}H_k+\\vartheta_{ij}G\\right)$$\n$$=\\sum_j\\frac{\\partial\\\
  beta^j}{\\partial r^i}H_j+\\sum_k\\beta^k\\left(\\sum_j\\Gamma^j_{ik}H_j+\\vartheta_{ik}G\\\
  right)$$\n$$=\\sum_j\\left(\\frac{\\partial\\beta^j}{\\partial r^i}+\\sum_k\\beta^k\\\
  Gamma^j_{ik}\\right)H_j+\\left(\\sum_k\\beta^k\\vartheta_{ik}\\right)G$$\n$$=\\\
  sum_j\\beta^j_{;i}H_j+\\left(\\sum_j\\beta^j\\vartheta_{ij}\\right)G. \\tag{12.3.9}$$\n\
  \n(c)：我们有\n$$D_X(Y)=D_{\\sum_i(\\alpha^i\\circ\\varphi^{-1})(H_i\\circ\\varphi^{-1})}(Y)=\\\
  sum_i(\\alpha^i\\circ\\varphi^{-1})D_{H_i\\circ\\varphi^{-1}}(Y)$$\n$$=\\left(\\\
  sum_i\\alpha^i[D_{H_i\\circ\\varphi^{-1}}(Y)\\circ\\varphi]\\right)\\circ\\varphi^{-1},$$\n\
  因此\n$$D_X(Y)\\circ\\varphi=\\sum_i\\alpha^i[D_{H_i\\circ\\varphi^{-1}}(Y)\\circ\\\
  varphi]$$\n$$=\\sum_i\\alpha^i\\left[\\sum_j\\beta^j_{;i}H_j+\\left(\\sum_j\\beta^j\\\
  vartheta_{ij}\\right)G\\right]$$\n$$=\\sum_j\\left(\\sum_i\\alpha^i\\beta^j_{;i}\\\
  right)H_j+\\left(\\sum_{ij}\\alpha^i\\beta^j\\vartheta_{ij}\\right)G.$$\n\n## 12.4\
  \ $\\mathbb{R}^3_\\nu$ 中正则曲面上的协变导数\n\n设 $(M,g)$ 是 $\\mathbb{R}^3_\\nu$ 中的正则曲面，并设\
  \ $X,Y$ 是 $\\mathfrak{X}(M)$ 中的向量场。正如结合示例 12.3.2 所述，尽管向量场 $D_X(Y)$ 属于 $\\mathfrak{X}_{\\\
  mathbb{R}^3_\\nu}(M)$，但它不一定属于 $\\mathfrak{X}(M)$。换言之，即使对所有 $p\\in M$，$Y_p$ 都是 $T_p(M)$\
  \ 中的向量，$D_X(Y)_p$ 却未必如此。我们需要一种“导数”的定义，把 $\\mathfrak{X}(M)$ 中的向量场映到 $\\mathfrak{X}(M)$\
  \ 中的向量场，从而避免这个问题。我们的做法是实用性的：通过消去与 $M$ 不相切的部分，来修改第 12.3 节讨论的诱导欧几里得导数。\n\n对 $M$ 中的每一点\
  \ $p$，按定义 $g_p$ 在 $\\mathbb{R}^3_\\nu$ 的子空间 $T_p(M)$ 上非退化。由定理 4.1.3 可知，$\\mathbb{R}^3_\\\
  nu$ 是直和 $\\mathbb{R}^3_\\nu=T_p(M)\\oplus T_p(M)^\\perp$。为简洁起见，我们将投影映射 $\\mathcal{P}_{T_p(M)}$\
  \ 和 $\\mathcal{P}_{T_p(M)}^\\perp$ 分别记为 $\\tan_p$ 和 $\\operatorname{nor}_p$，于是\n\
  \ntan_p : ℝ³_ν ⟶ T_p(M)      and      nor_p : ℝ³_ν ⟶ T_p(M)⊥.\n\n关于 $X$ 的协变导数由两个映射组成，二者都记作\
  \ $\\nabla_X$。第一个是\n\n∇_X : C^∞(M) ⟶ C^∞(M)\n\n由\n\n∇_X(f)(p) = d_p(f)(X_p)    \
  \  (12.4.1)\n\n定义，其中 $f$ 是 $C^\\infty(M)$ 中的任意函数，$p$ 是 $M$ 中的任意一点。第二个是\n\n∇_X :\
  \ \U0001D51B(M) ⟶ \U0001D51B(M)\n\n由\n\n∇_X(Y)_p = tan_p(D_X(Y)_p)      (12.4.2)\n\
  \n定义，其中 $Y$ 是 $\\mathfrak{X}(M)$ 中的任意向量场，$p$ 是 $M$ 中的任意一点，而 $D_X(Y)_p$ 由 (12.3.2)\
  \ 给出。注意，在协变导数的定义中，所有向量场都位于 $\\mathfrak{X}(M)$ 中。这与第 12.3 节中诱导欧几里得导数的定义形成对比，后者的定义中还出现了\
  \ $\\mathfrak{X}_{\\mathbb{R}^3_\\nu}(M)$ 中的向量场。\n\n对于 $\\mathfrak{X}(M)$ 中的向量场\
  \ $X,Y$，我们通过如下赋值定义一个 $C^\\infty(M)$ 中的函数 $\\langle X,Y\\rangle:M\\longrightarrow\\\
  mathbb{R}$：\n\np ↦ ⟨X_p, Y_p⟩\n\n对所有 $p\\in M$ 成立。\n\n### 定理 12.4.1. 设 $(M,g)$ 是\
  \ $\\mathbb{R}^3_\\nu$ 中的正则曲面，$X,Y,Z$ 是 $\\mathfrak{X}(M)$ 中的向量场，$f$ 是 $C^\\infty(M)$\
  \ 中的函数。则：\n\n+   (a) $\\nabla_{X+Y}(Z)=\\nabla_X(Z)+\\nabla_Y(Z)$.\n+   (b) $\\\
  nabla_{fX}(Y)=f\\nabla_X(Y)$.\n+   (c) $\\nabla_X(Y+Z)=\\nabla_X(Y)+\\nabla_X(Z)$.\n\
  +   (d) $\\nabla_X(fY)=\\nabla_X(f)Y+f\\nabla_X(Z)$.\n+   (e) $\\nabla_X(\\langle\
  \ Y,Z\\rangle)=\\langle\\nabla_X(Y),Z\\rangle+\\langle Y,\\nabla_X(Z)\\rangle$.\n\
  \n证明。(a)–(d)：这由定理 12.3.1 的 (a)–(d) 部分得到。\n\n(e)：设 $p$ 是 $M$ 中的一点。我们有\n\n∇_X(⟨Y,\
  \ Z⟩)(p) = D_X(⟨Y, Z⟩)(p)      [(12.3.1), (12.4.1)]\n= ⟨D_X(Y)_p, Z_p⟩ + ⟨Y_p, D_X(Z)_p⟩.\
  \      [Th 12.3.1(e)]\n\n我们还有\n\nD_X(Y)_p = tan_p(D_X(Y)_p) + nor_p(D_X(Y)_p)  \
  \    [Th 4.1.4]\n= ∇_X(Y)_p + nor_p(D_X(Y)_p),      [(12.4.2)]\n\n其中\n\nγ_{i;j}^l\
  \ = ∂γ^l/∂r^j + Σ_n γ^n Γ^l_{jn}. (12.4.8)\n\n我们寻求 (12.4.7) 第二行中两项的另一些表达式。\n\n由\
  \ (12.4.5) 可得\n\n∂μ^l/∂r^i = Σ_j ∂β^j/∂r^i γ_{i;j}^l + Σ_j β^j ∂γ_{i;j}^l/∂r^i,\
  \ (12.4.9)\n\n并由 (12.4.8) 可得\n\nΣ_j ∂β^j/∂r^i γ_{i;j}^l = Σ_j ∂β^j/∂r^i ∂γ^l/∂r^j\
  \ + Σ_{jn} ∂β^j/∂r^i γ^n Γ^l_{jn} (12.4.10)\n\n以及\n\n∂γ_{i;j}^l/∂r^i = ∂²γ^l/∂r^i∂r^j\
  \ + Σ_n ∂γ^n/∂r^i Γ^l_{jn} + Σ_n γ^n ∂Γ^l_{jn}/∂r^i. (12.4.11)\n\n于是由 (12.4.11)\
  \ 可得\n\nΣ_j β^j ∂γ_{i;j}^l/∂r^i = Σ_j β^j ∂²γ^l/∂r^i∂r^j + Σ_{jn} β^j ∂γ^n/∂r^i\
  \ Γ^l_{jn} + Σ_{jn} β^j γ^n ∂Γ^l_{jn}/∂r^i. (12.4.12)\n\n结合 (12.4.9)、(12.4.10) 和\
  \ (12.4.12) 得出\n\n∂μ^l/∂r^i = Σ_j ∂β^j/∂r^i ∂γ^l/∂r^j + Σ_{jn} ∂β^j/∂r^i γ^n Γ^l_{jn}\
  \ + Σ_j β^j ∂²γ^l/∂r^i∂r^j + Σ_{jn} β^j ∂γ^n/∂r^i Γ^l_{jn} + Σ_{jn} β^j γ^n ∂Γ^l_{jn}/∂r^i,\
  \ (12.4.13)\n\n这就是 (12.4.7) 第二行中第一项所需的表达式。由 (12.4.8) 可得\n\nΣ_{jk} β^j γ_{i;j}^k\
  \ Γ^l_{ik} = Σ_{jk} β^j (∂γ^k/∂r^j + Σ_n γ^n Γ^k_{jn}) Γ^l_{ik} = Σ_{jk} β^j ∂γ^k/∂r^j\
  \ Γ^l_{ik} + Σ_{jkn} β^j γ^n Γ^k_{jn} Γ^l_{ik}, (12.4.14)\n\n这就是 (12.4.7) 第二行中第二项所需的表达式。将\
  \ (12.4.13) 和 (12.4.14) 代入 (12.4.7)，得到\n\n```\nμ^l_{i;} = Σ_j ∂β^j/∂r^i ∂γ^l/∂r^j\
  \ + Σ_{jn} ∂β^j/∂r^i γ^n Γ^l_{jn} + Σ_j β^j ∂²γ^l/∂r^i∂r^j + Σ_{jn} β^j ∂γ^n/∂r^i\
  \ Γ^l_{jn} + Σ_{jn} β^j γ^n ∂Γ^l_{jn}/∂r^i + Σ_{jk} β^j ∂γ^k/∂r^j Γ^l_{ik} + Σ_{jkn}\
  \ β^j γ^n Γ^k_{jn} Γ^l_{ik}. (12.4.15)\n```\n\n由 (12.4.6) 和 (12.4.15) 可知，$\\nabla_X(\\\
  nabla_Y(Z))\\circ\\varphi$ 的第 $l$ 个分量为\n\n```\n(∇_X(∇_Y(Z)) ∘ φ)^l = Σ_i α^i μ^l_{i;}\
  \ = Σ_{ij} α^i ∂β^j/∂r^i ∂γ^l/∂r^j + Σ_{ijn} α^i ∂β^j/∂r^i γ^n Γ^l_{jn} + Σ_{ij}\
  \ α^i β^j ∂²γ^l/∂r^i∂r^j + Σ_{ijn} α^i β^j ∂γ^n/∂r^i Γ^l_{jn} + Σ_{ijn} α^i β^j\
  \ γ^n ∂Γ^l_{jn}/∂r^i + Σ_{ijk} α^i β^j ∂γ^k/∂r^j Γ^l_{ik} + Σ_{ijkn} α^i β^j γ^n\
  \ Γ^k_{jn} Γ^l_{ik} (12.4.16) = Σ_{ij}^{(1)} α^i ∂β^j/∂r^i ∂γ^l/∂r^j + Σ_{ijk}^{(2)}\
  \ α^i ∂β^j/∂r^i γ^k Γ^l_{jk} + Σ_{ij}^{(3)} α^i β^j ∂²γ^l/∂r^i∂r^j + Σ_{ijk}^{(4)}\
  \ α^i β^j ∂γ^k/∂r^i Γ^l_{jk} + Σ_{ijk}^{(5)} α^i β^j γ^k ∂Γ^l_{jk}/∂r^i + Σ_{ijk}^{(6)}\
  \ α^i β^j ∂γ^k/∂r^j Γ^l_{ik} + Σ_{ijkn}^{(7)} α^i β^j γ^k Γ^n_{jk} Γ^l_{in},\n```\n\
  \n其中求和已被编号以便参考。\n\n## 步骤 2：计算 $\\nabla_{\\nabla_X(Y)}(Z)$\n\n由定理 12.4.2(c)，\n\n\
  ```\n∇_X(Y) = Σ_j ( Σ_i (α^i ∘ φ^{-1})(β^j_{i;} ∘ φ^{-1}) ) H_j ∘ φ^{-1},\n```\n\
  \n所以\n\n$$\\nabla_{\\nabla_X(Y)}(Z)=\\nabla\\sum_j(\\Sigma_i(\\alpha^i\\circ\\varphi^{-1})(\\\
  beta^j_{;i}\\circ\\varphi^{-1})H_j\\circ\\varphi^{-1}(Z))$$\n\n$$=\\sum_{ij}(\\\
  alpha^i\\circ\\varphi^{-1})(\\beta^j_{;i}\\circ\\varphi^{-1})\\nabla_{H_j\\circ\\\
  varphi^{-1}}(Z)$$\n\n$$=\\sum_{ij}(\\alpha^i\\circ\\varphi^{-1})(\\beta^j_{;i}\\\
  circ\\varphi^{-1})\\left(\\sum_l(\\gamma^l_{;j}\\circ\\varphi^{-1})H_l\\circ\\varphi^{-1}\\\
  right)$$\n\n$$=\\sum_l\\left(\\sum_{ij}(\\alpha^i\\circ\\varphi^{-1})(\\beta^j_{;i}\\\
  circ\\varphi^{-1})(\\gamma^l_{;j}\\circ\\varphi^{-1})\\right)H_l\\circ\\varphi^{-1}$$\n\
  \n$$=\\left(\\sum_l\\left[\\sum_{ij}\\alpha^i\\beta^j_{;i}\\gamma^l_{;j}\\right]H_l\\\
  right)\\circ\\varphi^{-1},$$\n\n其中第三个等号由定理 12.4.2(b) 得到。于是\n\n$$\\nabla_{\\nabla_X(Y)}(Z)\\\
  circ\\varphi=\\sum_l\\left(\\sum_{ij}\\alpha^i\\beta^j_{;i}\\gamma^l_{;j}\\right)H_l,$$\
  \ (12.4.17)\n\n其中\n\n$$\\beta^j_{;i}=\\frac{\\partial\\beta^j}{\\partial r^i}+\\\
  sum_k\\beta^k\\Gamma^j_{ik}\\qquad\\text{and}\\qquad\\gamma^l_{;j}=\\frac{\\partial\\\
  gamma^l}{\\partial r^j}+\\sum_n\\gamma^n\\Gamma^l_{jn}.$$ (12.4.18)\n\n由 (12.4.17)\
  \ 和 (12.4.18) 可知，$\\nabla_{\\nabla_X(Y)}(Z)\\circ\\varphi$ 的第 $l$ 个分量为\n\n$$(\\\
  nabla_{\\nabla_X(Y)}(Z)\\circ\\varphi)^l$$\n$$=\\sum_{ij}\\alpha^i\\beta^j_{;i}\\\
  gamma^l_{;j}$$\n$$=\\sum_{ij}\\alpha^i\\left(\\frac{\\partial\\beta^j}{\\partial\
  \ r^i}+\\sum_k\\beta^k\\Gamma^j_{ik}\\right)\\left(\\frac{\\partial\\gamma^l}{\\\
  partial r^j}+\\sum_n\\gamma^n\\Gamma^l_{jn}\\right)$$\n$$=\\sum_{ij}\\alpha^i\\\
  frac{\\partial\\beta^j}{\\partial r^i}\\frac{\\partial\\gamma^l}{\\partial r^j}+\\\
  sum_{ijn}\\alpha^i\\frac{\\partial\\beta^j}{\\partial r^i}\\gamma^n\\Gamma^l_{jn}$$\n\
  $$+\\sum_{ijk}\\alpha^i\\beta^k\\frac{\\partial\\gamma^l}{\\partial r^j}\\Gamma^j_{ik}+\\\
  sum_{ijkn}\\alpha^i\\beta^k\\gamma^n\\Gamma^j_{ik}\\Gamma^l_{jn}$$\n$$=\\sum_{ij}^{(1)}\\\
  alpha^i\\frac{\\partial\\beta^j}{\\partial r^i}\\frac{\\partial\\gamma^l}{\\partial\
  \ r^j}+\\sum_{ijk}^{(2)}\\alpha^i\\frac{\\partial\\beta^j}{\\partial r^i}\\gamma^k\\\
  Gamma^l_{jk}$$\n$$+\\sum_{ijk}^{(8)}\\alpha^i\\beta^j\\frac{\\partial\\gamma^l}{\\\
  partial r^k}\\Gamma^k_{ij}+\\sum_{ijkn}^{(9)}\\alpha^i\\beta^j\\gamma^k\\Gamma^n_{ij}\\\
  Gamma^l_{kn}.$$\n\n\n\n\n## 第 3 步：计算 \\(\\nabla^2_{X,Y}(Z)\\)。\n\n根据定义，\n\n\\[\n\
  \\nabla^2_{X,Y}(Z)=\\nabla_X(\\nabla_Y(Z))-\\nabla_{\\nabla_X(Y)}(Z).\n\\]\n\n由\
  \ (12.4.16) 和 (12.4.19) 可知，\\(\\nabla^2_{X,Y}(Z)\\circ\\varphi\\) 的第 \\(l\\) 个分量为\n\
  \n\\[\n\\begin{aligned}\n(\\nabla^2_{X,Y}(Z)\\circ\\varphi)^l\n&=\\left([\\nabla_X(\\\
  nabla_Y(Z))-\\nabla_{\\nabla_X(Y)}(Z)]\\circ\\varphi\\right)^l\\\\\n&=\\left(\\\
  sum^{(1)}+\\sum^{(2)}+\\sum^{(3)}+\\sum^{(4)}+\\sum^{(5)}+\\sum^{(6)}+\\sum^{(7)}\\\
  right)\n-\\left(\\sum^{(1)}+\\sum^{(2)}+\\sum^{(8)}+\\sum^{(9)}\\right)\\\\\n&=\\\
  sum_{ij}^{(3)}\\alpha^i\\beta^j\\frac{\\partial^2\\gamma^l}{\\partial r^i\\partial\
  \ r^j}+\\sum_{ijk}^{(4)}\\alpha^i\\beta^j\\frac{\\partial\\gamma^k}{\\partial r^i}\\\
  Gamma^l_{jk}+\\sum_{ijk}^{(5)}\\alpha^i\\beta^j\\gamma^k\\frac{\\partial\\Gamma^l_{jk}}{\\\
  partial r^i}\\\\\n&\\quad+\\sum_{ijk}^{(6)}\\alpha^i\\beta^j\\frac{\\partial\\gamma^k}{\\\
  partial r^j}\\Gamma^l_{ik}+\\sum_{ijkn}^{(7)}\\alpha^i\\beta^j\\gamma^k\\Gamma^n_{jk}\\\
  Gamma^l_{in}\\\\\n&\\quad-\\sum_{ijk}^{(8)}\\alpha^i\\beta^j\\frac{\\partial\\gamma^l}{\\\
  partial r^k}\\Gamma^k_{ij}-\\sum_{ijkn}^{(9)}\\alpha^i\\beta^j\\gamma^k\\Gamma^n_{ij}\\\
  Gamma^l_{nk}.\n\\end{aligned}\n\\]\n\n由于\n\n\\[\n\\sum_{ijk}^{(4)}\\alpha^i\\beta^j\\\
  frac{\\partial\\gamma^k}{\\partial r^i}\\Gamma^l_{jk}+\\sum_{ijk}^{(6)}\\alpha^j\\\
  beta^i\\frac{\\partial\\gamma^k}{\\partial r^i}\\Gamma^l_{jk}=\\sum_{ijk}^{(4)+(6)}(\\\
  alpha^i\\beta^j+\\alpha^j\\beta^i)\\frac{\\partial\\gamma^k}{\\partial r^i}\\Gamma^l_{jk}\n\
  \\tag{12.4.21}\n\\]\n\n以及\n\n\\[\n\\begin{aligned}\n&\\sum_{ijk}^{(5)}\\alpha^i\\\
  beta^j\\gamma^k\\frac{\\partial\\Gamma^l_{jk}}{\\partial r^i}+\\sum_{ijkn}^{(7)}\\\
  alpha^i\\beta^j\\gamma^k\\Gamma^n_{jk}\\Gamma^l_{in}-\\sum_{ijkn}^{(9)}\\alpha^i\\\
  beta^j\\gamma^k\\Gamma^n_{ij}\\Gamma^l_{kn}\\\\\n&=\\sum_{ijk}^{(5)}\\alpha^i\\\
  beta^j\\gamma^k\\frac{\\partial\\Gamma^l_{jk}}{\\partial r^i}+\\sum_{ijk}^{(7)}\\\
  left(\\alpha^i\\beta^j\\gamma^k\\sum_n\\Gamma^n_{jk}\\Gamma^l_{in}\\right)-\\sum_{ijk}^{(9)}\\\
  left(\\alpha^i\\beta^j\\gamma^k\\sum_n\\Gamma^n_{ij}\\Gamma^l_{kn}\\right)\\\\\n\
  &=\\sum_{ijk}^{(5)+(7)-(9)}\\left[\\alpha^i\\beta^j\\gamma^k\\left(\\frac{\\partial\\\
  Gamma^l_{jk}}{\\partial r^i}+\\sum_n(\\Gamma^l_{in}\\Gamma^n_{jk}-\\Gamma^l_{kn}\\\
  Gamma^n_{ij})\\right)\\right].\n\\end{aligned}\n\\tag{12.4.22}\n\\]\n\n因此由 (12.4.20)–(12.4.22)\
  \ 可得\n\n\\[\n(\\nabla^2_{X,Y}(Z)\\circ\\varphi)^l\n= \\sum_{ij}^{(3)}\\alpha^i\\\
  beta^j\\frac{\\partial^2\\gamma^l}{\\partial r^i\\partial r^j}\n+\\sum_{ijk}^{(4)+(6)}(\\\
  alpha^i\\beta^j+\\alpha^j\\beta^i)\\frac{\\partial\\gamma^k}{\\partial r^i}\\Gamma^l_{jk}\n\
  -\\sum_{ijk}^{(8)}\\alpha^i\\beta^j\\frac{\\partial\\gamma^l}{\\partial r^k}\\Gamma^k_{ij}\\\
  \\\n+\\sum_{ijk}^{(5)+(7)-(9)}\\alpha^i\\beta^j\\gamma^k\\left(\\frac{\\partial\\\
  Gamma^l_{jk}}{\\partial r^i}+\\sum_n(\\Gamma^l_{in}\\Gamma^n_{jk}-\\Gamma^l_{kn}\\\
  Gamma^n_{ij})\\right).\n\\]\n\n(b)：这可由定理 10.1.6 和 (a) 部分得到。\n\n在定理 12.3.3 之后曾指出，与\
  \ \\(\\mathbb{R}^n\\) 对应的 Christoffel 符号恒为 0，这与 \\(\\mathbb{R}^n\\) 是“平坦的”有关。我们从定理\
  \ 12.4.3(b) 看到，在 \\(\\mathbb{R}^n\\) 的情形中，计算二阶协变导数时向量场的次序无关紧要。这让人想起 \\(\\mathbb{R}^m\\\
  ) 中的欧几里得情形[见（定理 10.3.4(b)）]。下面的例子表明，对于球面 \\(S^2\\)，次序是重要的。\n\n### 示例 12.4.4（\\(S^2\\\
  )）。\n\n在下面的推导中，我们使用第 13.4 节的 Christoffel 符号结果。在定理 12.4.3(a) 中取 \\(X=H_1\\circ\\\
  varphi^{-1}\\)、\\(Y=H_2\\circ\\varphi^{-1}\\)（于是 \\(\\alpha^1=\\beta^2=1\\)，\\(\\\
  alpha^2=\\beta^1=0\\)），并令 \\(r^1=\\theta\\)、\\(r^2=\\phi\\)，经过冗长但直接的计算可得\n\n\\[\n\
  (\\nabla^2_{H_1\\circ\\varphi^{-1},H_2\\circ\\varphi^{-1}}(Z)-\\nabla^2_{H_2\\circ\\\
  varphi^{-1},H_1\\circ\\varphi^{-1}}(Z))\\circ\\varphi\n=\\sin^2(\\theta)\\gamma^2H_1-\\\
  gamma^1H_2.\n\\]\n\n由于球面的对称性，上述表达式与 \\(\\phi\\) 无关并不令人意外。\n\n## 12.5 \\(\\mathbb{R}^3_\\\
  nu\\) 中曲线上的协变导数\n\n设 \\((M,\\alpha)\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面，设 \\(\\\
  lambda(t):(a,b)\\to M\\) 是光滑曲线，并设 \\(J(t):(a,b)\\to\\mathbb{R}^3_\\nu\\) 是一个映射。在当前上下文中，我们将\
  \ \\(J\\) 称为**沿 \\(\\lambda\\) 的向量场**。沿 \\(\\lambda\\) 的光滑向量场的集合记为 \\(\\mathfrak{X}_{\\\
  mathbb{R}^3_\\nu}(\\lambda)\\)。例如，若 \\(V\\) 是 \\(\\mathfrak{X}_{\\mathbb{R}^3_\\\
  nu}(M)\\) 中的向量场，则 \\(V\\circ\\lambda\\) 是 \\(\\mathfrak{X}_{\\mathbb{R}^3_\\nu}(\\\
  lambda)\\) 中的向量场。如果对所有 \\(t\\in(a,b)\\)，\\(J(t)\\) 都属于 \\(T_{\\lambda(t)}(M)\\)，则称\
  \ \\(J\\) 是 \\(\\lambda\\) 上的**（切）向量场**。我们用 \\(\\mathfrak{X}_M(\\lambda)\\) 表示 \\\
  (\\lambda\\) 上光滑向量场的集合。例如，\\(\\lambda\\) 的速度 \\(d\\lambda/dt\\) 属于 \\(\\mathfrak{X}_M(\\\
  lambda)\\)。又如，若 \\(X\\) 是 \\(\\mathfrak{X}(M)\\) 中的向量场，则 \\(X\\circ\\lambda\\) 是\
  \ \\(\\mathfrak{X}_M(\\lambda)\\) 中的向量场。\n\n对于 \\(\\mathfrak{X}_M(\\lambda)\\) 中的向量场\
  \ \\(J\\)，根据定义，对所有 \\(t\\in(a,b)\\)，\\(J(t)\\) 是 \\(T_{\\lambda(t)}(M)\\) 中的向量。但对\
  \ \\(dJ/dt\\) 来说未必如此。特别地，虽然 \\(\\lambda\\) 的速度属于 \\(\\mathfrak{X}_M(\\lambda)\\\
  )，其（欧几里得）加速度却未必属于 \\(\\mathfrak{X}_M(\\lambda)\\)。我们需要一个避免这一问题的“导数”定义。我们的应对与第 12.4\
  \ 节采用的方法类似。\n\n\\(\\lambda\\) 上的**协变导数**由两个映射组成，二者均记作 \\(\\nabla/dt\\)。第一个是\n\n\\\
  [\n\\frac{\\nabla}{dt}:C^\\infty((a,b))\\longrightarrow C^\\infty((a,b)).\n\\]\n\
  \n定义为\n\n\\[\n\\frac{\\nabla f}{dt}(t)=\\frac{df}{dt}(t)\n\\]\n\n对所有函数 \\(f\\in\
  \ C^\\infty((a,b))\\) 和所有 \\(t\\in(a,b)\\) 成立。第二个是\n\n\\[\n\\frac{\\nabla}{dt}:\\\
  mathfrak{X}_M(\\lambda)\\longrightarrow\\mathfrak{X}_M(\\lambda)\n\\]\n\n定义为\n\n\
  \\[\n\\frac{\\nabla J}{dt}(t)=\\tan_{\\lambda(t)}\\left(\\frac{dJ}{dt}(t)\\right)\n\
  \\]\n\n对所有向量场 \\(J\\in\\mathfrak{X}_M(\\lambda)\\) 和所有 \\(t\\in(a,b)\\) 成立，其中，沿用第\
  \ 12.4 节，\\(\\tan_{\\lambda(t)}\\) 表示投影映射 \\(\\mathcal{P}_{T_{\\lambda(t)}(M)}\\\
  )。\n\n\\(\\lambda\\) 的**（协变）加速度**定义为如下光滑曲线\n\n\\[\n\\frac{\\nabla}{dt}\\left(\\\
  frac{d\\lambda}{dt}\\right)(t):(a,b)\\longrightarrow M.\n\\]\n\n对于 \\(\\mathfrak{X}_M(\\\
  lambda)\\) 中的向量场 \\(J,K\\)，我们定义一个函数\n\n\\[\n\\langle J,K\\rangle:(a,b)\\longrightarrow\\\
  mathbb{R}\n\\]\n\n它属于 \\(C^\\infty((a,b))\\)，定义方式为对所有 \\(t\\in(a,b)\\)，\n\n\\[\n\
  t\\longmapsto\\langle J(t),K(t)\\rangle.\n\\]\n\n曲线上的协变导数的定义具有一个引人入胜的物理解释。设想一只“虫子”被限制在\
  \ \\(\\mathbb{R}^3\\) 中某个给定正则曲面的二维世界里。对这种生物来说，不存在“上”或“下”，只有“在”曲面上的运动。假设这只虫子正匆忙爬行，沿途划出一条光滑曲线。从我们在\
  \ \\(\\mathbb{R}^3\\) 中的有利位置出发，并借助一些牛顿力学知识，我们可以断定虫子具有某个速度和不为零的（欧几里得）加速度。无论对我们还是对虫子而言，速度都完全是一种切向现象。另一方面，我们观察到加速度既有切向分量又有法向分量。但对虫子来说并非如此，它对任何此类法向现象都毫无感知。这表明，为了量化我们认为虫子所感受到的加速度，我们应当把注意力限制在切向分量上。实现这一点的方式是向切平面作投影。\n\
  \n### 定理 12.5.1。\n\n设 \\((M,g)\\) 是 \\(\\mathbb{R}^3\\) 中的正则曲面，设 \\(\\lambda(t):(a,b)\\\
  longrightarrow M\\) 是光滑曲线。设 \\(J,K\\) 是 \\(\\mathfrak{X}_M(\\lambda)\\) 中的向量场，设\
  \ \\(f\\) 是 \\(C^\\infty((a,b))\\) 中的函数，并设 \\(g(u):(c,d)\\longrightarrow(a,b)\\\
  ) 是一个微分同胚。则对所有 \\(t\\in(a,b)\\) 和所有 \\(u\\in(c,d)\\)：\n\n- (a) \\(\\displaystyle\
  \ \\frac{\\nabla(J+K)}{dt}(t)=\\frac{\\nabla J}{dt}(t)+\\frac{\\nabla K}{dt}(t).\\\
  )\n- (b) \\(\\displaystyle \\frac{\\nabla(fJ)}{dt}(t)=\\frac{df}{dt}(t)J(t)+f(t)\\\
  frac{\\nabla J}{dt}(t).\\)\n- (c) \\(\\displaystyle \\frac{d\\langle J,K\\rangle}{dt}(t)=\\\
  left\\langle\\frac{\\nabla J}{dt}(t),K(t)\\right\\rangle+\\left\\langle J(t),\\\
  frac{\\nabla K}{dt}(t)\\right\\rangle.\\)\n- (d) \\(\\displaystyle \\frac{\\nabla(J\\\
  circ g)}{du}(u)=\\frac{dg}{du}(u)\\frac{\\nabla J}{dt}(g(u)).\\)\n\n设 \\((M,\\mathfrak{g})\\\
  ) 是 \\(\\mathbb{R}^3_{\\nu}\\) 中的正则曲面，设 \\((U,\\varphi)\\) 是 \\(M\\) 上的一个坐标卡，并设\
  \ \\((H_1,H_2)\\) 和 \\(G\\) 分别为相应的坐标标架和坐标单位法向量场。设 \\(\\lambda:(a,b)\\longrightarrow\
  \ M\\) 是满足 \\(\\lambda((a,b))\\subset U\\) 的光滑曲线，设 \\(J\\) 是 \\(\\mathfrak{X}_M(\\\
  lambda)\\) 中的向量场。由定理 10.1.17 和定理 11.2.8，映射\n\n\\[\n\\mu = \\varphi^{-1}\\circ\\\
  lambda = (\\mu^1,\\mu^2):(a,b)\\longrightarrow U\n\\tag{12.5.2}\n\\]\n\n是光滑的。于是\
  \ \\(J(t)\\) 可以表示为\n\n\\[\nJ(t)=\\sum_i \\alpha^i(t) H_i|_{\\mu(t)},\n\\tag{12.5.3}\n\
  \\]\n\n其中 \\(\\alpha^i\\) 是 \\(C^\\infty((a,b))\\) 中唯一确定的函数，称为 \\(J\\) 关于 \\((U,\\\
  varphi)\\) 的分量。称 (12.5.3) 的右端是在局部坐标 \\((U,\\varphi)\\) 下对 \\(J\\) 的表示。\n\n### 定理\
  \ 12.5.2。\n\n在上述设定下，对所有 \\(t\\in(a,b)\\)：\n\n- (a) \\(\\displaystyle \\frac{dJ}{dt}(t)=\\\
  sum_k\\left(\\frac{d\\alpha^k}{dt}(t)+\\sum_{ij}\\alpha^i(t)\\frac{d\\mu^j}{dt}(t)\\\
  Gamma^k_{ij}(\\mu(t))\\right)H_k|_{\\mu(t)}+\\left(\\sum_{ij}\\alpha^i(t)\\frac{d\\\
  mu^j}{dt}(t)\\vartheta_{ij}(\\mu(t))\\right)G_{\\mu(t)}.\\)\n- (b) \\(\\displaystyle\
  \ \\frac{\\nabla J}{dt}(t)=\\sum_k\\left(\\frac{d\\alpha^k}{dt}(t)+\\sum_{ij}\\\
  alpha^i(t)\\frac{d\\mu^j}{dt}(t)\\Gamma^k_{ij}(\\mu(t))\\right)H_k|_{\\mu(t)}.\\\
  )\n- (c) \\(\\displaystyle \\frac{d^2\\lambda}{dt^2}(t)=\\sum_k\\left(\\frac{d^2\\\
  mu^k}{dt^2}(t)+\\sum_{ij}\\frac{d\\mu^i}{dt}(t)\\frac{d\\mu^j}{dt}(t)\\Gamma^k_{ij}(\\\
  mu(t))\\right)H_k|_{\\mu(t)}+\\left(\\sum_{ij}\\frac{d\\mu^i}{dt}(t)\\frac{d\\mu^j}{dt}(t)\\\
  vartheta_{ij}(\\mu(t))\\right)G_{\\mu(t)}.\\)\n- (d) \\(\\displaystyle \\left\\\
  langle\\frac{d\\lambda}{dt}(t),\\frac{d\\lambda}{dt}(t)\\right\\rangle=\\sum_{ij}\\\
  frac{d\\mu^i}{dt}(t)\\frac{d\\mu^j}{dt}(t)\\mathfrak{g}_{ij}(\\mu(t)).\\)\n\n\n\n\
  \n\n**证明.** (a)：由 (12.5.3) 和定理 10.1.10，我们有\n\n\\[\n\\frac{dJ}{dt}(t)=\\sum_i\\left(\\\
  frac{d\\alpha^i}{dt}(t)H_i|_{\\mu(t)}+\\alpha^i(t)\\frac{d(H_i\\circ\\mu)}{dt}(t)\\\
  right)\n\\]\n\n\\[\n=\\sum_i\\frac{d\\alpha^i}{dt}(t)H_i|_{\\mu(t)}+\\sum_i\\alpha^i(t)\\\
  left(\\sum_j\\frac{d\\mu^j}{dt}(t)\\frac{\\partial H_i}{\\partial r^j}\\bigg|_{\\\
  mu(t)}\\right)\n\\]\n\n\\[\n=\\sum_k\\frac{d\\alpha^k}{dt}(t)H_k|_{\\mu(t)}+\\sum_{ij}\\\
  alpha^i(t)\\frac{d\\mu^j}{dt}(t)\\frac{\\partial H_i}{\\partial r^j}\\bigg|_{\\\
  mu(t)}. \\tag{12.5.4}\n\\]\n\n利用 (12.3.6)，(12.5.4) 最后一行中的第二项可以表示为\n\n\\[\n\\sum_{ij}\\\
  alpha^i(t)\\frac{d\\mu^j}{dt}(t)\\frac{\\partial H_i}{\\partial r^j}\\bigg|_{\\\
  mu(t)}\n\\]\n\n\\[\n=\\sum_{ij}\\alpha^i(t)\\frac{d\\mu^j}{dt}(t)\\left(\\sum_k\\\
  Gamma^k_{ij}(\\mu(t))H_k|_{\\mu(t)}+\\vartheta_{ij}(\\mu(t))G_{\\mu(t)}\\right)\n\
  \\]\n\n\\[\n=\\sum_k\\left(\\sum_{ij}\\alpha^i(t)\\frac{d\\mu^j}{dt}(t)\\Gamma^k_{ij}(\\\
  mu(t))\\right)H_k|_{\\mu(t)}\n\\]\n\n\\[\n+\\left(\\sum_{ij}\\alpha^i(t)\\frac{d\\\
  mu^j}{dt}(t)\\vartheta_{ij}(\\mu(t))\\right)G_{\\mu(t)}. \\tag{12.5.5}\n\\]\n\n\
  将 (12.5.4) 和 (12.5.5) 合并即得结果。\n\n- (b)：这可由 (12.5.1) 和 (a) 部分得出。\n- (c)：在 (a) 部分中令\
  \ \\(J=d\\Lambda/dt\\) 和 \\(\\alpha^i=d\\mu^i/dt\\)，即得结果。\n- (d)：由定理 10.1.10，\n\n\
  \\[\n\\frac{d\\lambda}{dt}(t)=\\frac{d(\\varphi\\circ\\mu)}{dt}=\\sum_i\\frac{d\\\
  mu^i}{dt}(t)H_i|_{\\mu(t)},\n\\]\n\n由此得出结果。\n\n## 12.6 \\(\\mathbb{R}^3_\\nu\\)\
  \ 中的李括号\n\n设 \\((M,\\mathfrak{g})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面。**李括号**是映射\n\
  \n\\[\n[\\cdot,\\cdot]:\\mathfrak{X}(M)\\times\\mathfrak{X}(M)\\longrightarrow\\\
  mathfrak{X}(M)\n\\]\n\n定义为\n\n\\[\n[X,Y]=\\nabla_X(Y)-\\nabla_Y(X) \\tag{12.6.1}\n\
  \\]\n\n其中 \\(X,Y\\) 是 \\(\\mathfrak{X}(M)\\) 中的任意向量场。\n\n### 定理 12.6.1\n\n设 \\((M,\\\
  mathfrak{g})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面，设 \\((U,\\varphi)\\) 是 \\(M\\\
  ) 上的一个坐标卡，设 \\(X,Y\\) 是 \\(\\mathfrak{X}(M)\\) 中的向量场，且在局部坐标下设\n\n\\[\nX\\circ\\\
  varphi=\\sum_i\\alpha^i H_i \\quad\\text{且}\\quad Y\\circ\\varphi=\\sum_j\\beta^j\
  \ H_j.\n\\]\n\n则\n\n\\[\n[X,Y]\\circ\\varphi=\\sum_j\\left\\{\\sum_i\\left(\\alpha^i\\\
  frac{\\partial\\beta^j}{\\partial r^i}-\\beta^i\\frac{\\partial\\alpha^j}{\\partial\
  \ r^i}\\right)\\right\\}H_j\n\\]\n\n\\[\n=\\sum_j\\left(\\sum_i(\\alpha^i\\beta^j_{;i}-\\\
  beta^i\\alpha^j_{;i})\\right)H_j.\n\\]\n\n**证明.** 由定理 12.4.2(c)，\n\n\\[\n\\nabla_X(Y)\\\
  circ\\varphi=\\sum_j\\left(\\sum_i\\alpha^i\\beta^j_{;i}\\right)H_j\n\\]\n\n并且\n\
  \n\\[\n\\nabla_Y(X)\\circ\\varphi=\\sum_j\\left(\\sum_i\\beta^i\\alpha^j_{;i}\\\
  right)H_j,\n\\]\n\n因此\n\n\\[\n[X,Y]\\circ\\varphi=\\nabla_X(Y)\\circ\\varphi-\\\
  nabla_Y(X)\\circ\\varphi\n=\\sum_j\\left(\\sum_i(\\alpha^i\\beta^j_{;i}-\\beta^i\\\
  alpha^j_{;i})\\right)H_j.\n\\]\n\n由 (12.3.9)，我们有\n\n\\[\n\\sum_i(\\alpha^i\\beta^j_{;i}-\\\
  beta^i\\alpha^j_{;i})\n=\n\\sum_i\\left\\{\\alpha^i\\left(\\frac{\\partial\\beta^j}{\\\
  partial r^i}+\\sum_k\\beta^k\\Gamma^j_{ik}\\right)\n-\\beta^i\\left(\\frac{\\partial\\\
  alpha^j}{\\partial r^i}+\\sum_k\\alpha^k\\Gamma^j_{ik}\\right)\\right\\}\n\\]\n\n\
  \\[\n=\n\\sum_i\\left(\\alpha^i\\frac{\\partial\\beta^j}{\\partial r^i}-\\beta^i\\\
  frac{\\partial\\alpha^j}{\\partial r^i}\\right)\n+\\sum_{ik}\\alpha^i\\beta^k\\\
  Gamma^j_{ik}\n-\\sum_{ik}\\alpha^k\\beta^i\\Gamma^j_{ik}\n\\]\n\n\\[\n=\n\\sum_i\\\
  left(\\alpha^i\\frac{\\partial\\beta^j}{\\partial r^i}-\\beta^i\\frac{\\partial\\\
  alpha^j}{\\partial r^i}\\right),\n\\]\n\n其中最后一个等号依赖于定理 12.3.3(d)。结论得证。\n\n下一个结果表明，\\\
  (\\mathbb{R}^3_\\nu\\) 中正则曲面上的李括号（上面用协变导数表述）也可以用诱导的欧几里得导数来表述。\n\n### 定理 12.6.2\n\
  \n若 \\((M,\\mathfrak{g})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面，且 \\(X,Y\\) 是 \\(\\\
  mathfrak{X}(M)\\) 中的向量场，则\n\n\\[\n\\nabla_X(Y)-\\nabla_Y(X)=D_X(Y)-D_Y(X).\n\\]\n\
  \n**证明.** 由定理 12.3.5(c)，我们有\n\n\\[\nD_X(Y)\\circ\\varphi=\\sum_j\\left(\\sum_i\\\
  alpha^i\\beta^j_{;i}\\right)H_j\n+\\left(\\sum_{ij}\\alpha^i\\beta^j\\vartheta_{ij}\\\
  right)G\n\\]\n\n并且\n\n\\[\nD_Y(X)\\circ\\varphi=\\sum_j\\left(\\sum_i\\beta^i\\\
  alpha^j_{;i}\\right)H_j\n+\\left(\\sum_{ij}\\beta^i\\alpha^j\\vartheta_{ij}\\right)G.\n\
  \\]\n\n于是定理 12.3.3(d) 给出\n\n\\[\n(D_X(Y)-D_Y(X))\\circ\\varphi\n=\n\\sum_j\\left(\\\
  sum_i\\alpha^i\\beta^j_{;i}-\\beta^i\\alpha^j_{;i}\\right)H_j.\n\\]\n\n现在结论由定理 12.6.1\
  \ 得出。\n\n下面是与定理 10.4.2 对应的结论。\n\n### 定理 12.6.3\n\n设 \\((M,\\mathfrak{g})\\) 是 \\\
  (\\mathbb{R}^3_\\nu\\) 中的正则曲面，设 \\(X,Y,Z\\) 是 \\(\\mathfrak{X}(M)\\) 中的向量场，并设 \\\
  (f,g\\) 是 \\(C^\\infty(M)\\) 中的函数。设 \\((U,\\varphi)\\) 是 \\(M\\) 上的一个坐标卡，并设 \\((H_1,H_2)\\\
  ) 是对应的坐标架。则：\n\n- (a) \\([Y,X]=-[X,Y]\\)。\n- (b) \\([X+Y,Z]=[X,Z]+[Y,Z]\\)。\n- (c)\
  \ \\([X,Y+Z]=[X,Y]+[X,Z]\\)。\n- (d) \\([fX,gY]=fg[X,Y]+f\\nabla_X(g)Y-g\\nabla_Y(f)X\\\
  )。\n- (e) \\([X,[Y,Z]]+[Y,[Z,X]]+[Z,[X,Y]]=(0,0,0)\\)。（雅可比恒等式）\n- (f) 对于 \\(i,j=1,2\\\
  )，\\([H_i\\circ\\varphi^{-1},H_j\\circ\\varphi^{-1}]=(0,0,0)\\)。\n\n**证明.** (a)–(d)：定理\
  \ 12.4.1 的 (a)–(d) 部分以及 (12.6.1) 即得结论。\n\n(e)：由定理 12.4.1 的 (a) 和 (c) 部分以及 (12.6.1)，我们有\n\
  \n\\[\n[X,[Y,Z]]\n=\\nabla_X([Y,Z])-\\nabla_{[Y,Z]}(X)\n=\\nabla_X(\\nabla_Y(Z)-\\\
  nabla_Z(Y))-\\nabla_{\\nabla_Y(Z)-\\nabla_Z(Y)}(X)\n\\]\n\\[\n=\\nabla_X(\\nabla_Y(Z))-\\\
  nabla_X(\\nabla_Z(Y))-\\nabla_{\\nabla_Y(Z)}(X)+\\nabla_{\\nabla_Z(Y)}(X).\n\\]\n\
  \n同样地，\n\n\\[\n[Y,[Z,X]]\n=\\nabla_Y(\\nabla_Z(X))-\\nabla_Y(\\nabla_X(Z))-\\nabla_{\\\
  nabla_Z(X)}(Y)+\\nabla_{\\nabla_X(Z)}(Y)\n\\]\n\n\\[\n[Z,[X,Y]]\n=\\nabla_Z(\\nabla_X(Y))-\\\
  nabla_Z(\\nabla_Y(X))-\\nabla_{\\nabla_X(Y)}(Z)+\\nabla_{\\nabla_Y(X)}(Z).\n\\]\n\
  \n将上述恒等式相加并利用 (12.4.4) 可得\n\n\\[\n[X,[Y,Z]]+[Y,[Z,X]]+[Z,[X,Y]]\n\\]\n\\[\n=[\\\
  nabla^2_{X,Y}(Z)-\\nabla^2_{Y,X}(Z)]\n+[\\nabla^2_{Y,Z}(X)-\\nabla^2_{Z,Y}(X)]\n\
  +[\\nabla^2_{Z,X}(Y)-\\nabla^2_{X,Z}(Y)]\n\\]\n\\[\n=R(X,Y)Z+R(Y,Z)X+R(Z,X)Y=(0,0,0),\n\
  \\]\n\n其中第二个等号由定理 12.9.1 得到，最后一个等号由定理 12.9.13 得到。\n\n(f)：这可由定理 12.6.1 得出。\n\n##\
  \ 12.7 \\(\\mathbb{R}^3_\\nu\\) 中的定向\n\n在第 12.2 节中，我们将第一基本形式满足某些性质的正则曲面称为 \\(\\\
  mathbb{R}^3_\\nu\\) 中的正则曲面。接着，我们证明了基于某类特定单位法向量场存在的等价表述。除了增加几何直观性外，后一种方法还具有计算上的优势。例如，正如\
  \ (12.2.4) 的相关讨论所指出的，通常利用其符号间接计算 \\(\\mathbb{R}^3_\\nu\\) 中正则曲面的指标更为方便。在本节中，我们探讨\
  \ \\(\\mathbb{R}^3_\\nu\\) 中正则曲面的定向。基本定义是以图册的形式给出的，但单位法向量场再次发挥了重要作用。在下面的讨论中，我们大量依赖第\
  \ 8.2 节中关于向量空间定向的讨论。\n\n### 定理 12.7.1\n\n设 \\((M,\\mathfrak{g})\\) 是 \\(\\mathbb{R}^3_\\\
  nu\\) 中的正则曲面，设 \\((U,\\varphi)\\) 是 \\(M\\) 上的一个坐标卡，设 \\(\\mathcal{H}=(H_1,H_2)\\\
  ) 和 \\(G\\) 分别为对应的坐标架和坐标单位法向量场，并设 \\(q\\) 是 \\(U\\) 中的一点。则 \\((G_q,H_1|_q,H_2|_q)\\\
  ) 是 \\(\\mathbb{R}^3_\\nu\\) 的一个具有标准定向的基。\n\n**证明.** 这可由定理 8.4.10(b) 和定理 12.2.11\
  \ 得出。\n\n设 \\((M,\\mathfrak{g})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面，并设 \\((U,\\\
  varphi)\\) 和 \\((\\tilde{U},\\tilde{\\varphi})\\) 是 \\(M\\) 上重叠的坐标卡。设 \\(\\mathcal{H}\\\
  ) 和 \\(\\tilde{\\mathcal{H}}\\) 为对应的坐标架，设 \\(G\\) 和 \\(\\tilde{G}\\) 为对应的坐标单位法向量场。设\
  \ \\(W=\\varphi(U)\\cap\\tilde{\\varphi}(\\tilde{U})\\)，并设 \\(p\\) 是 \\(W\\) 中的一点。回顾第\
  \ 8.2 节，坐标基 \\(\\mathcal{H}_{\\varphi^{-1}(p)}\\) 和 \\(\\tilde{\\mathcal{H}}_{\\\
  tilde{\\varphi}^{-1}(p)}\\) 称为相容的，如果\n\n\\[\n\\det\\left([\\mathrm{id}_{T_p(M)}]_{\\\
  tilde{\\mathcal{H}}_{\\tilde{\\varphi}^{-1}(p)}}^{\\mathcal{H}_{\\varphi^{-1}(p)}}\\\
  right)>0.\n\\]\n\n若对所有 \\(p\\in W\\)，\\(\\mathcal{H}_{\\varphi^{-1}(p)}\\) 和 \\\
  (\\tilde{\\mathcal{H}}_{\\tilde{\\varphi}^{-1}(p)}\\) 相容，则称 \\((U,\\varphi)\\) 和\
  \ \\((\\tilde{U},\\tilde{\\varphi})\\) 是相容的。\n\n### 定理 12.7.2\n\n在上述设定下，\\((U,\\\
  varphi)\\) 和 \\((\\tilde{U},\\tilde{\\varphi})\\) 相容当且仅当对所有 \\(p\\in W\\)，有 \\(G_{\\\
  varphi^{-1}(p)}=\\tilde{G}_{\\tilde{\\varphi}^{-1}(p)}\\)。\n\n**证明.** 这可由定理 8.4.11(b)\
  \ 得出。\n\n设 \\((M,\\mathfrak{g})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面。若 \\(M\\) 的一个图册中任意两个重叠的坐标卡都相容，则称该图册是相容的。若\
  \ \\(M\\) 具有一个相容的图册，则称 \\(M\\) 是可定向的。假设 \\(M\\) 确实是可定向的，并设 \\(\\mathfrak{A}\\) 是\
  \ \\(M\\) 的一个相容图册。三元组 \\((M,\\mathfrak{g},\\mathfrak{A})\\) 称为 \\(\\mathbb{R}^3_\\\
  nu\\) 中的定向正则曲面。设 \\(p\\) 是 \\(M\\) 中的一点，设 \\((U,\\varphi)\\) 是 \\(\\mathfrak{A}\\\
  ) 中在 \\(p\\) 处的坐标卡，并设 \\(\\mathcal{H}\\) 是对应的坐标架。令\n\n\\[\n\\mathfrak{O}(p)=[\\\
  mathcal{H}_{\\varphi^{-1}(p)}],\n\\]\n\n其中我们回顾第 8.2 节，\\([\\mathcal{H}_{\\varphi^{-1}(p)}]\\\
  ) 表示与 \\(\\mathcal{H}_{\\varphi^{-1}(p)}\\) 相容的 \\(T_p(M)\\) 的所有基（不仅是坐标基）的等价类。\n\
  \n\n\n\n\n设 \\((\\widetilde{U}, \\widetilde{\\varphi})\\) 是 \\(\\mathfrak{A}\\)\
  \ 中 \\(p\\) 处的另一个坐标卡，并令 \\(\\widetilde{\\mathcal{H}}\\) 为相应的坐标标架。由于 \\(\\mathfrak{A}\\\
  ) 是相容的，\\((U, \\varphi)\\) 与 \\((\\widetilde{U}, \\widetilde{\\varphi})\\) 相容，因此\
  \ \\([\\mathcal{H}_{\\varphi^{-1}(p)}] = [\\widetilde{\\mathcal{H}}_{\\widetilde{\\\
  varphi}^{-1}(p)}]\\)。这表明 \\(\\mathfrak{O}(p)\\) 的定义与在 \\(p\\) 处代表坐标卡的选择无关。我们将等价类集合\n\
  \n\\[\n\\mathfrak{O} = \\{\\mathfrak{O}(p) : p \\in M\\}\n\\]\n\n称为由 \\(\\mathfrak{A}\\\
  ) 诱导的定向，并说 \\(M\\) 由 \\(\\mathfrak{A}\\) 定向。记号 \\((M, \\mathfrak{g}, \\mathfrak{O})\\\
  )（有时也使用 \\((M, \\mathfrak{g}, \\mathfrak{A}, \\mathfrak{O})\\)）用作 \\((M, \\mathfrak{g},\
  \ \\mathfrak{A})\\) 的替代。\n\n考虑映射 \\(\\iota : \\mathbb{R}^2 \\longrightarrow \\mathbb{R}^2\\\
  )，其定义为 \\(\\iota(r^1, r^2) = (-r^1, r^2)\\)。由于 \\(\\iota\\) 是微分同胚且 \\(\\iota^{-1}\
  \ = \\iota\\)，\\((\\iota(U), \\varphi \\circ \\iota)\\) 是 \\(M\\) 上的一个坐标卡，其中为简洁起见，我们将\
  \ \\(\\iota|_{\\iota(U)}\\) 记作 \\(\\iota\\)。因为\n\n\\[\n\\varphi \\circ \\iota(r^1,\
  \ r^2) = (\\varphi^1(-r^1, r^2), \\varphi^2(-r^1, r^2), \\varphi^3(-r^1, r^2)),\n\
  \\]\n\n相应的坐标标架和坐标单位法向量场分别为\n\n\\[\n-\\mathcal{H} = (-H_1, H_2)\n\\]\n\n和 \\(-G\\\
  )。利用定理 11.3.3 容易证明\n\n\\[\n-\\mathfrak{A} = \\{(\\iota(U), \\varphi \\circ \\iota)\
  \ : (U, \\varphi) \\in \\mathfrak{A}\\}\n\\]\n\n是 \\(M\\) 的一个相容图册。由 \\(-\\mathfrak{A}\\\
  ) 诱导的 \\(M\\) 的定向为\n\n\\[\n-\\mathfrak{O} = \\{-\\mathfrak{O}(p) : p \\in M\\},\n\
  \\]\n\n其中\n\n\\[\n-\\mathfrak{O}(p) = [-\\mathcal{H}_{\\varphi^{-1}(p)}] = [(-H_1|_{\\\
  varphi^{-1}(p)}, H_2|_{\\varphi^{-1}(p)})].\n\\]\n\n我们说定向 \\(-\\mathfrak{O}\\) 是\
  \ \\(\\mathfrak{O}\\) 的相反定向。\n\n**定理 12.7.3.** 若 \\((M, \\mathfrak{g}, \\mathfrak{A})\\\
  ) 是 \\(\\mathbb{R}^3_\\nu\\) 中的定向正则曲面，则：\n\n- (a) 存在 \\(\\mathfrak{X}_{\\mathbb{R}^3_\\\
  nu}(M)\\) 中的单位法向量场 \\(\\mathcal{N}\\)，称为高斯映射，使得对 \\(\\mathfrak{A}\\) 中的每个坐标卡 \\\
  ((U, \\varphi)\\)，\\(\\mathcal{N} \\circ \\varphi\\) 都是相应的坐标单位法向量场。\n- (b) \\(\\\
  mathcal{N}\\) 满足第 12.2 节的性质 [V1] 和 [V2]。\n\n**注.** 将 \\(\\mathcal{N}\\) 称为“映射”是合理的，因为根据定义，\\\
  (\\mathfrak{X}_{\\mathbb{R}^3_\\nu}(M)\\) 是映射的集合。\n\n**证明.** (a): 由于 \\(\\mathfrak{A}\\\
  ) 是 \\(M\\) 的相容图册，由定理 12.7.2 可知，只要 \\(\\mathfrak{A}\\) 中两个坐标卡有重叠，相应的坐标单位法向量场就在重叠部分一致。因此，我们可以给\
  \ \\(M\\) 中的每一点 \\(p\\) 指定一个在 \\(p\\) 处为单位法向量的向量 \\(\\mathcal{N}_p\\)，并且使得 \\(\\\
  mathcal{N}_p\\) 与从 \\(\\mathfrak{A}\\) 中选取的 \\(p\\) 处坐标卡的选择无关。更具体地说，给定 \\(\\mathfrak{A}\\\
  ) 中的坐标卡 \\((U, \\varphi)\\) 以及相应的坐标单位法向量场 \\(G\\)，对所有 \\(p\\in \\varphi(U)\\)，定义\
  \ \\(\\mathcal{N}_p = G_{\\varphi^{-1}(p)}\\)。由于 \\(G\\) 在 \\(U\\) 上光滑，因此\n\n回顾定理\
  \ 12.2.12 的证明，我们看到前面的例子依赖于所涉及的梯度满足第 12.2 节的性质 [V2]。更一般地，我们有以下定理 12.2.10(b) 的推广。\n\
  \n**定理 12.7.8（函数的水平集）。** 设 \\(U\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的开集，\\(f\\) 是 \\\
  (C^\\infty(U)\\) 中的函数，\\(c\\) 是 \\(f(U)\\) 中的实数，且 \\(M = f^{-1}(c)\\)。若 \\(\\operatorname{Grad}(f)\\\
  ) 满足第 12.2 节的性质 [V2]，则 \\((M, \\mathfrak{g})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的可定向正则曲面。\n\
  \n**证明.** 这可由定理 12.2.10(b) 和定理 12.7.6 推出。\n\n**例 12.7.9（莫比乌斯带）。** 莫比乌斯带是 \\(\\mathbb{R}^3\\\
  ) 的如下子集：\n\n\\[\n\\text{Möb} = \\{\\sigma(t, \\varphi) \\in \\mathbb{R}^3 : (t,\
  \ \\varphi) \\in U\\},\n\\]\n\n其中\n\n\\[\n\\sigma(t, \\varphi) = ([1 - t \\sin(\\\
  varphi/2)] \\cos(\\varphi), [1 - t \\sin(\\varphi/2)] \\sin(\\varphi), t \\cos(\\\
  varphi/2))\n\\]\n\n且\n\n\\[\nU = (-1/2, 1/2) \\times (-\\pi, \\pi).\n\\]\n\n将一条纸带扭转半圈，再把两端粘在一起，就可以得到\
  \ Möb 的一个模型。见图 12.7.1。可以证明 Möb 是 \\(\\mathbb{R}^3_0\\) 中的正则曲面，这一点从图中可以直观地看出。然而，\\\
  (\\mathfrak{X}_{\\mathbb{R}^3_0}(\\text{Möb})\\) 中不包含单位法向量场。这可以通过如下方式看出：在沿纵向平分 Möb\
  \ 的曲线上（图 12.7.1 中的虚线）选取一个起点，然后将给定的单位法向量（看作箭头）沿该曲线滑动，其基点始终在曲线上，同时保持箭杆与曲面垂直。绕行一整圈后，该单位法向量回到起点，但此时却从带的“另一侧”伸出。这表明沿\
  \ Möb 的任何单位法向量场都不是连续的，更不用说光滑了。然而，再绕行一圈则恢复原来的向量。可以说，Möb 只有“一面”。\n\n![](img/d712710a8eb78c0959204afd5dde4c91_306_0.png)\n\
  \n**图 12.7.1.** 莫比乌斯带：例 12.7.9 的示意图。\n\n## 12.8 \\(\\mathbb{R}^3_\\nu\\) 中的高斯曲率\n\
  \n在本节中，我们描述一种度量 \\(\\mathbb{R}^3_\\nu\\) 中正则曲面“曲率”的方法。\n\n在第 12.2 节中，作为对 \\(\\mathbb{R}^3_\\\
  nu\\) 中超二次曲面 \\(Q^2\\) 讨论的一部分，我们观察到：\\(S^2\\) 是 \\(\\mathbb{R}^3_0\\) 中（类空）单位向量的集合，\\\
  (P^2\\) 是 \\(\\mathbb{R}^3_1\\) 中类空单位向量的集合，而 \\(H^2\\) 是 \\(\\mathbb{R}^3_1\\) 中类时单位向量的集合。事实上，根据定理\
  \ 12.2.12(a)，它们不仅仅是集合：\\(S^2\\) 是 \\(\\mathbb{R}^3_0\\) 中的正则曲面，\\(P^2\\) 和 \\(H^2\\\
  ) 是 \\(\\mathbb{R}^3_1\\) 中的正则曲面。\n\n设 \\((M, \\mathfrak{g}, \\mathcal{N}, \\mathfrak{O})\\\
  ) 是 \\(\\mathbb{R}^3_\\nu\\) 中的定向正则曲面，令 \\(\\mathcal{N} : M \\longrightarrow \\\
  mathbb{R}^3_\\nu\\) 为高斯映射，并令 \\(p\\) 为 \\(M\\) 中的一点。由于 \\(\\mathcal{N}_p\\) 是 \\\
  (p\\) 处的单位法向量，由 (12.2.3) 可得 \\(q(\\mathcal{N}_p) = \\langle \\mathcal{N}_p, \\mathcal{N}_p\
  \ \\rangle = \\epsilon_M\\)，其中 \\(q\\) 是与 \\(\\mathfrak{g}\\) 对应的二次函数。因此，对所有 \\\
  (p\\in M\\)，\\(\\mathcal{N}_p\\) 都在同一个超二次曲面中。将该超二次曲面记为 \\(Q^2\\)，现在我们就可以说，对所有 \\\
  (p\\in M\\)，\\(\\mathcal{N}_p\\) 都在 \\(Q^2\\) 中。因此，\\(\\mathcal{N}\\) 可以更精确地表示为\n\
  \n\\[\n\\mathcal{N} : M \\longrightarrow Q^2.\n\\]\n\n图 12.8.1 描绘了 \\(S^2\\) 的情形，其中\
  \ \\(\\mathcal{N}_i\\) 表示 \\(\\mathcal{N}_{p_i}\\)，\\(i=1,2,3\\)。\n\n![](img/d712710a8eb78c0959204afd5dde4c91_307_0.png)\n\
  \n**图 12.8.1.** 高斯映射\n\n\\(\\mathcal{N}\\) 在 \\(p\\) 处的微分为 \\(d_p(\\mathcal{N})\
  \ : T_p(M) \\longrightarrow T_{\\mathcal{N}_p}(Q^2)\\)。根据定义，\\(\\mathcal{N}_p\\\
  ) 属于 \\(T_p(M)^\\perp\\)。另一方面，由于 \\(\\mathcal{N}_p\\) 在 \\(Q^2\\) 中，由定理 12.2.12(c)\
  \ 可得，\\(\\mathcal{N}_p\\) 也属于 \\(T_{\\mathcal{N}_p}(Q^2)^\\perp\\)。由于 \\(T_p(M)^\\\
  perp\\) 与 \\(T_{\\mathcal{N}_p}(Q^2)^\\perp\\) 均为一维的，因此 \\(T_p(M)^\\perp = T_{\\\
  mathcal{N}_p}(Q^2)^\\perp\\)，进而由定理 4.1.2(c) 可得\n\n\\[\nT_p(M) = T_{\\mathcal{N}_p}(Q^2).\n\
  \\]\n\n因此，我们可以将 \\(\\mathcal{N}\\) 在 \\(p\\) 处的微分表示为\n\n\\[\nd_p(\\mathcal{N}) :\
  \ T_p(M) \\longrightarrow T_p(M).\n\\]\n\n因此，\\(d_p(\\mathcal{N})\\) 是从 \\(T_p(M)\\\
  ) 到其自身的线性映射。\n\n对 \\(M\\) 中的每一点 \\(p\\)，**\\(p\\) 处的魏因加滕映射**记为\n\n\\[\n\\mathcal{W}_p\
  \ : T_p(M) \\longrightarrow T_p(M)\n\\]\n\n并定义为\n\n\\[\n\\mathcal{W}_p = -d_p(\\\
  mathcal{N}). \\tag{12.8.1}\n\\]\n\n对于 \\(T_p(M)\\) 中的所有向量 \\(v\\)，由 (11.6.1) 可得\n\
  \n\\[\n\\mathcal{W}_p(v) = -\\frac{d(\\mathcal{N} \\circ \\lambda)}{dt}(t_0), \\\
  tag{12.8.2}\n\\]\n\n其中 \\(\\lambda : (a,b) \\longrightarrow M\\) 是任意光滑曲线，且对某个 \\\
  (t_0\\in(a,b)\\) 满足 \\(\\lambda(t_0)=p\\)、\\((d\\lambda/dt)(t_0)=v\\)。**魏因加滕映射**是线性映射\n\
  \n\\[\n\\mathcal{W} : \\mathfrak{X}(M) \\longrightarrow \\mathfrak{X}(M)\n\\]\n\n\
  定义为\n\n\\[\n\\mathcal{W}(X)_p = \\mathcal{W}_p(X_p) \\tag{12.8.3}\n\\]\n\n对所有向量场\
  \ \\(X\\in\\mathfrak{X}(M)\\) 和所有 \\(p\\in M\\) 成立。\n\n设 \\((U, \\varphi)\\) 是 \\\
  (\\mathfrak{A}\\) 中的一个坐标卡，令 \\(\\mathcal{H} = (H_1, H_2)\\) 为相应的坐标标架，并令 \\(q\\)\
  \ 为 \\(U\\) 中的一点。向量 \\(\\mathcal{W}_p(H_j|_q)\\) 可以表示为\n\n\\[\n\\mathcal{W}_p(H_j|_q)\
  \ = \\sum_i \\mathfrak{w}_j^i(q) H_i|_q, \\tag{12.8.4}\n\\]\n\n其中 \\(\\mathfrak{w}_j^i\\\
  ) 是 \\(C^\\infty(U)\\) 中唯一确定的函数。于是由 (2.2.2) 和 (2.2.3) 可得\n\n\\[\n[\\mathcal{W}_p]_{\\\
  mathcal{H}_q} = \\begin{bmatrix} \\mathfrak{w}_1^1(q) & \\mathfrak{w}_1^2(q) \\\\\
  \ \\mathfrak{w}_2^1(q) & \\mathfrak{w}_2^2(q) \\end{bmatrix}. \\tag{12.8.5}\n\\\
  ]\n\n**定理 12.8.1.** *若 \\((M, \\mathfrak{g}, \\mathfrak{A}, \\mathfrak{O})\\) 是\
  \ \\(\\mathbb{R}^3_\\nu\\) 中的定向正则曲面且 \\(X\\) 是 \\(\\mathfrak{X}(M)\\) 中的向量场，则*\n\
  \n\\[\n\\mathcal{W}(X) = -D_X(\\mathcal{N}).\n\\]\n\n**证明.** 令 \\(p\\) 为 \\(M\\\
  ) 中的一点，并令 \\(\\lambda : (a,b) \\longrightarrow M\\) 为光滑曲线，使得对某个 \\(t_0\\in(a,b)\\\
  )，\\(\\lambda(t_0)=p\\) 且 \\((d\\lambda/dt)(t_0)=X_p\\)。则\n\n\\[\n\\begin{aligned}\n\
  -D_X(\\mathcal{N})_p\n&= -\\frac{d(\\mathcal{N} \\circ \\lambda)}{dt}(t_0) \\quad\
  \ [(12.3.4)] \\\\\n&= \\mathcal{W}_p(X_p) \\quad [(12.8.2)] \\\\\n&= \\mathcal{W}(X)_p.\
  \ \\quad [(12.8.3)]\n\\end{aligned}\n\\]\n\n由于 \\(p\\) 是任意的，结论成立。\n\n\n\n\n\n设 \\\
  ((M,\\mathfrak{g},\\mathfrak{A},\\mathfrak{D})\\) 为 \\(\\mathbb{R}^3_{\\nu}\\) 中的一个定向正则曲面，设\
  \ \\(p\\) 为 \\(M\\) 中的一点。由于 \\(\\mathfrak{g}_p\\) 是双线性的且 \\(\\mathcal{W}_p\\) 是线性的，我们在\
  \ \\(\\mathcal{T}_2^0(T_p(M))\\) 中有张量 \\(\\mathfrak{h}_p\\) 定义为\n\n\\[\n\\mathfrak{h}_p(v,w)=\\\
  langle\\mathcal{W}_p(v),w\\rangle\\tag{12.8.6}\n\\]\n\n对所有 \\(T_p(M)\\) 中的向量 \\\
  (v,w\\) 成立。**\\(M\\) 上的第二基本形式** 是记为 \\(\\mathfrak{h}\\) 的映射，由赋值 \\(p\\longmapsto\\\
  mathfrak{h}_p\\) 对所有 \\(p\\in M\\) 定义。在文献中，\\(\\mathfrak{h}\\) 常记为 \\(II\\)。\n\n\
  对 \\(\\mathfrak{X}(M)\\) 中的向量场 \\(X,Y\\)，我们定义函数\n\n\\[\n\\mathfrak{h}(X,Y)=\\langle\\\
  mathcal{W}(X),Y\\rangle: M\\longrightarrow\\mathbb{R}\n\\]\n\n在 \\(C^{\\infty}(M)\\\
  ) 中由赋值\n\n\\[\np\\longmapsto\\mathfrak{h}_p(X_p,Y_p)=\\langle\\mathcal{W}(X)_p,Y_p\\\
  rangle\\tag{12.8.7}\n\\]\n\n对所有 \\(p\\in M\\) 定义。\n\n设 \\((U,\\varphi)\\) 为 \\(\\\
  mathfrak{A}\\) 中的一个坐标图，设 \\(\\mathcal{H}=(H_1,H_2)\\) 为相应的坐标标架。我们在 \\(C^{\\infty}(U)\\\
  ) 中定义函数 \\(\\mathfrak{h}_{ij}\\) 为\n\n\\[\n\\mathfrak{h}_{ij}(q)=\\mathfrak{h}_p(H_i|_q,H_j|_q)\\\
  tag{12.8.8}\n\\]\n\n对所有 \\(q\\in U\\) 且 \\(i,j=1,2\\) 成立，其中 \\(p=\\varphi(q)\\)。**\\\
  (\\mathfrak{h}\\) 关于 \\(\\mathcal{H}\\) 的矩阵** 记为 \\(\\mathfrak{h}_{\\mathcal{H}}\\\
  ) 并定义为\n\n\\[\n\\mathfrak{h}_{\\mathcal{H}}(q)=\n\\begin{bmatrix}\n\\mathfrak{h}_{11}(q)&\\\
  mathfrak{h}_{12}(q)\\\\\n\\mathfrak{h}_{21}(q)&\\mathfrak{h}_{22}(q)\n\\end{bmatrix}\n\
  \\]\n\n对所有 \\(q\\in U\\) 成立。\n\n## 定理 12.8.2.\n\n设 \\((M,\\mathfrak{g},\\mathfrak{A},\\\
  mathfrak{D})\\) 为 \\(\\mathbb{R}^3_{\\nu}\\) 中的一个定向正则曲面，设 \\(\\mathcal{N}\\) 为高斯映射，设\
  \ \\(p\\) 为 \\(M\\) 中的一点。设 \\((U,\\varphi)\\) 为 \\(p\\) 处的 \\(\\mathfrak{A}\\) 中的一个坐标图，设\
  \ \\((H_1,H_2)\\) 为相应的坐标标架，设 \\(q=\\varphi^{-1}(p)\\)。则：\n\n- (a) \\(\\mathfrak{h}_{ij}(q)=\\\
  left\\langle\\left.\\frac{\\partial H_i}{\\partial r^j}\\right|_q,\\mathcal{N}_p\\\
  right\\rangle=\\epsilon_M\\vartheta_{ij}(q)\\)，其中 \\(\\vartheta_{ij}\\) 由 (12.3.6)\
  \ 给出。\n- (b) \\(\\mathcal{W}_p\\) 关于 \\(\\mathfrak{g}_p\\) 是自伴的；即 \\(\\langle\\\
  mathcal{W}_p(v),w\\rangle=\\langle v,\\mathcal{W}_p(w)\\rangle\\) 对所有 \\(T_p(M)\\\
  ) 中的向量 \\(v,w\\) 成立。\n- (c) \\(\\mathfrak{h}_p\\) 是一个对称双线性函数。\n\n**证明.** (a): 设\
  \ \\((e_1,e_2)\\) 为 \\(\\mathbb{R}^2\\) 的标准基。对给定的 \\(1\\le i\\le2\\)，我们定义光滑映射\n\n\
  \\[\n\\zeta=(\\zeta^1,\\zeta^2):(-\\varepsilon,\\varepsilon)\\longrightarrow U\n\
  \\]\n\n为 \\(\\zeta(t)=q+t e_i\\)，其中 \\(\\varepsilon>0\\) 选得足够小使得 \\((q-\\varepsilon\
  \ e_i,q+\\varepsilon e_i)\\subset U\\)。考虑光滑曲线 \\(\\lambda(t):(-\\varepsilon,\\varepsilon)\\\
  longrightarrow M\\) 定义为 \\(\\lambda=\\varphi\\circ\\zeta\\)，并注意到 \\(\\lambda(0)=\\\
  varphi(q)=p\\)。由定理 10.1.10，\n\n\\[\n\\left.\\frac{d\\lambda}{dt}\\right|_0\n=\\\
  left.\\frac{d(\\varphi\\circ\\zeta)}{dt}\\right|_0\n=\\sum_j\\left.\\frac{d\\zeta^j}{dt}\\\
  right|_0 H_j|_q\n=H_i|_q.\n\\]\n\n它还由定理 10.1.10 可得\n\n\\[\n\\left.\\frac{d(\\mathcal{N}\\\
  circ\\lambda)}{dt}\\right|_0\n=\\left.\\frac{d(\\mathcal{N}\\circ\\varphi\\circ\\\
  zeta)}{dt}\\right|_0\n=\\sum_j\\left.\\frac{d\\zeta^j}{dt}\\right|_0 \\left.\\frac{\\\
  partial(\\mathcal{N}\\circ\\varphi)}{\\partial r^j}\\right|_q\n=\\left.\\frac{\\\
  partial(\\mathcal{N}\\circ\\varphi)}{\\partial r^i}\\right|_q,\n\\]\n\n然后由 (12.8.2)\
  \ 和 (12.8.9) 可得\n\n\\[\n\\mathcal{W}_p(H_i|_q)=-\\left.\\frac{d(\\mathcal{N}\\circ\\\
  lambda)}{dt}\\right|_0\n=-\\left.\\frac{\\partial(\\mathcal{N}\\circ\\varphi)}{\\\
  partial r^i}\\right|_q.\n\\]\n\n对 \\(\\langle\\mathcal{N}_p,H_j|_q\\rangle=0\\)\
  \ 两边关于 \\(r^i\\) 求偏导数得到\n\n\\[\n0=\n\\left\\langle\\left.\\frac{\\partial(\\mathcal{N}\\\
  circ\\varphi)}{\\partial r^i}\\right|_q,H_j|_q\\right\\rangle\n+\n\\left\\langle\\\
  mathcal{N}_p,\\left.\\frac{\\partial H_j}{\\partial r^i}\\right|_q\\right\\rangle.\n\
  \\]\n\n我们由定理 10.1.6 和 (11.2.1) 可得\n\n\\[\n\\frac{\\partial H_i}{\\partial r^j}=\\\
  frac{\\partial H_j}{\\partial r^i},\n\\]\n\n故\n\n\\[\n\\left\\langle-\\left.\\frac{\\\
  partial(\\mathcal{N}\\circ\\varphi)}{\\partial r^i}\\right|_q,H_j|_q\\right\\rangle\n\
  =\n\\left\\langle\\mathcal{N}_p,\\left.\\frac{\\partial H_i}{\\partial r^j}\\right|_q\\\
  right\\rangle.\n\\]\n\n于是\n\n\\[\n\\begin{aligned}\n\\mathfrak{h}_{ij}(q)\n&=\\\
  langle\\mathcal{W}_p(H_i|_q),H_j|_q\\rangle & &[(12.8.6),\\ (12.8.8)]\\\\\n&=\\\
  left\\langle-\\left.\\frac{\\partial(\\mathcal{N}\\circ\\varphi)}{\\partial r^i}\\\
  right|_q,H_j|_q\\right\\rangle & &[(12.8.10)]\\\\\n&=\\left\\langle\\left.\\frac{\\\
  partial H_i}{\\partial r^j}\\right|_q,\\mathcal{N}_p\\right\\rangle, & &[(12.8.11)]\n\
  \\end{aligned}\n\\]\n\n这证明了第一个等式。我们还有\n\n\\[\n\\begin{aligned}\n\\left\\langle\\\
  left.\\frac{\\partial H_i}{\\partial r^j}\\right|_q,\\mathcal{N}_p\\right\\rangle\n\
  &=\\left\\langle\\left.\\frac{\\partial H_i}{\\partial r^j}\\right|_q,G_q\\right\\\
  rangle & &[\\text{Th 12.7.3(a)}]\\\\\n&=\\epsilon_M\\vartheta_{ij}(q), & &[\\text{Th\
  \ 12.3.3(c)}]\n\\end{aligned}\n\\]\n\n这证明了第二个等式。\n\n**(b):** 我们有\n\n\\[\n\\begin{aligned}\n\
  \\langle\\mathcal{W}_p(H_i|_q),H_j|_q\\rangle\n&=\\mathfrak{h}_p(H_i|_q,H_j|_q)\
  \ & &[(12.8.6)]\\\\\n&=\\mathfrak{h}_{ij}(q) & &[(12.8.8)]\\\\\n&=\\epsilon_M\\\
  vartheta_{ij}(q) & &[\\text{part (a)}]\\\\\n&=\\epsilon_M\\vartheta_{ji}(q) & &[\\\
  text{Th 12.3.3(d)}]\\\\\n&=\\mathfrak{h}_{ji}(q) & &[\\text{part (a)}]\\\\\n&=\\\
  mathfrak{h}_p(H_j|_q,H_i|_q) & &[(12.8.8)]\\\\\n&=\\langle\\mathcal{W}_p(H_j|_q),H_i|_q\\\
  rangle & &[(12.8.6)]\\\\\n&=\\langle H_i|_q,\\mathcal{W}_p(H_j|_q)\\rangle.\n\\\
  end{aligned}\n\\]\n\n结果现在由以下观察可得：\\((H_1|_q,H_2|_q)\\) 是 \\(T_p(M)\\) 的基，\\(\\mathfrak{g}_p\\\
  ) 是双线性的，且 \\(\\mathcal{W}_p\\) 是线性的。\n\n**(c):** \\(\\mathfrak{h}_p\\) 的双线性性已在与\
  \ (12.8.6) 相关的讨论中建立。对 \\(T_p(M)\\) 中的向量 \\(v,w\\)，我们有\n\n\\[\n\\begin{aligned}\n\
  \\mathfrak{h}_p(v,w)\n&=\\langle\\mathcal{W}_p(v),w\\rangle & &[(12.8.6)]\\\\\n\
  &=\\langle v,\\mathcal{W}_p(w)\\rangle & &[\\text{part (b)}]\\\\\n&=\\langle\\mathcal{W}_p(w),v\\\
  rangle\\\\\n&=\\mathfrak{h}_p(w,v). & &[(12.8.6)]\n\\end{aligned}\n\\]\n\n由于 \\\
  (v\\) 和 \\(w\\) 是任意的，结果得证。\n\n## 定理 12.8.3.\n\n设 \\((M,\\mathfrak{g},\\mathfrak{A},\\\
  mathfrak{D})\\) 为 \\(\\mathbb{R}^3_{\\nu}\\) 中的一个定向正则曲面，设 \\(p\\) 为 \\(M\\) 中的一点。设\
  \ \\((U,\\varphi)\\) 为 \\(p\\) 处的 \\(\\mathfrak{A}\\) 中的一个坐标图，设 \\(\\mathcal{H}\\\
  ) 为相应的坐标标架，设 \\(q=\\varphi^{-1}(p)\\)。则：\n\n- (a)\n\\[\n\\begin{bmatrix}\n\\mathfrak{h}_{11}(q)&\\\
  mathfrak{h}_{12}(q)\\\\\n\\mathfrak{h}_{21}(q)&\\mathfrak{h}_{22}(q)\n\\end{bmatrix}\n\
  =\n\\begin{bmatrix}\n\\mathfrak{g}_{11}(q)&\\mathfrak{g}_{12}(q)\\\\\n\\mathfrak{g}_{21}(q)&\\\
  mathfrak{g}_{22}(q)\n\\end{bmatrix}\n\\begin{bmatrix}\n\\mathfrak{w}_1^1(q)&\\mathfrak{w}_2^1(q)\\\
  \\\n\\mathfrak{w}_1^2(q)&\\mathfrak{w}_2^2(q)\n\\end{bmatrix}.\n\\]\n\n- (b)\n\\\
  [\n[\\mathcal{W}_p]_{\\mathcal{H}_q}^{\\mathcal{H}_q}\n=\n\\begin{bmatrix}\n\\mathfrak{g}^{11}(q)&\\\
  mathfrak{g}^{12}(q)\\\\\n\\mathfrak{g}^{21}(q)&\\mathfrak{g}^{22}(q)\n\\end{bmatrix}\n\
  \\begin{bmatrix}\n\\mathfrak{h}_{11}(q)&\\mathfrak{h}_{12}(q)\\\\\n\\mathfrak{h}_{21}(q)&\\\
  mathfrak{h}_{22}(q)\n\\end{bmatrix}.\n\\]\n\n**证明.** (a): 设 \\(\\mathcal{H}=(H_1,H_2)\\\
  )。我们有\n\n\\[\n\\begin{aligned}\n\\mathfrak{h}_{ij}(q)\n&=\\langle\\mathcal{W}_p(H_i|_q),H_j|_q\\\
  rangle & &[(12.8.6),\\ (12.8.8)]\\\\\n&=\\langle H_i|_q,\\mathcal{W}_p(H_j|_q)\\\
  rangle & &[\\text{Th 12.8.2(b)}]\\\\\n&=\\left\\langle H_i|_q,\\sum_k\\mathfrak{w}_j^k(q)H_k|_q\\\
  right\\rangle & &[(12.8.4)]\\\\\n&=\\sum_k\\mathfrak{g}_{ik}(q)\\mathfrak{w}_j^k(q),\n\
  \\end{aligned}\n\\]\n\n由此结果得证。\n\n**(b):** 这由 (12.8.5) 和部分 (a) 可得。\n\n设 \\((M,\\\
  mathfrak{g},\\mathfrak{A},\\mathfrak{D})\\) 为 \\(\\mathbb{R}^3_{\\nu}\\) 中的一个定向正则曲面。高斯曲率是光滑函数\n\
  \n\\[\n\\mathcal{K}: M\\longrightarrow\\mathbb{R}\n\\]\n\n定义为\n\n\\[\n\\mathcal{K}(p)=\\\
  epsilon_M\\det(\\mathcal{W}_p)\\qquad(12.8.12)\n\\]\n\n对所有 \\(p\\in M\\) 成立。对此定义的直观令人信服的解释如下给出。目前，我们仅注意到由\
  \ (12.8.1)，\\(\\mathcal{W}_p\\) 是关于 \\(d_p(\\mathcal{N})\\) 定义的，而后者与单位法向量场 \\(\\\
  mathcal{N}\\) 在 \\(p\\) 处的“变化率”相关。在几何上，\\(\\mathcal{N}\\) 的变化率越大，我们期望 \\(M\\) 在\
  \ \\(p\\) 处的“曲率”越大。\n\n由定理 4.7.4 和定理 12.8.2(b) 可知 \\(\\mathcal{W}_p\\) 有两个（不一定不同）的实特征值，我们记为\
  \ \\(\\kappa_1(p)\\) 和 \\(\\kappa_2(p)\\)。\n\n## 定理 12.8.4.\n\n设 \\((M,\\mathfrak{g},\\\
  mathfrak{A},\\mathfrak{D})\\) 为 \\(\\mathbb{R}^3_{\\nu}\\) 中的一个定向正则曲面，设 \\(p\\)\
  \ 为 \\(M\\) 中的一点。设 \\((U,\\varphi)\\) 为 \\(p\\) 处的 \\(\\mathfrak{A}\\) 中的一个坐标图，设\
  \ \\(\\mathcal{H}\\) 为相应的坐标标架，设 \\(q=\\varphi^{-1}(p)\\)。则\n\n\\[\n\\mathcal{K}(p)=\\\
  epsilon_M\\frac{\\det(\\mathfrak{h}_{\\mathcal{H}}(q))}{\\det(\\mathfrak{g}_{\\\
  mathcal{H}}(q))}=\\epsilon_M\\,\\kappa_1(p)\\kappa_2(p).\n\\]\n\n**证明.** 由定理 4.7.5，\n\
  \n\\[\n\\det(\\mathcal{W}_p)=\\kappa_1(p)\\kappa_2(p),\n\\]\n\n且由定理 12.8.3(b)，\n\
  \n\\[\n\\det(\\mathcal{W}_p)=\\frac{\\det(\\mathfrak{h}_{\\mathcal{H}}(q))}{\\det(\\\
  mathfrak{g}_{\\mathcal{H}}(q))}.\n\\]\n\n结果现在由 (12.8.12) 得证。\n\n下一个结果使用了第 14.6 节中关于“局部微分同胚”的材料和第\
  \ 19.10 节中关于“面积”的材料。它包含在此处，因为它为 \\(\\nu=0\\) 时高斯曲率的定义提供了合理性。\n\n## 定理 12.8.5.\n\n\
  设 \\((M,\\mathfrak{g},\\mathfrak{A},\\mathfrak{D})\\) 为 \\(\\mathbb{R}^3_{0}\\)\
  \ 中的一个定向正则曲面，设 \\(\\mathcal{N}\\) 为高斯映射，设 \\(p\\) 为 \\(M\\) 中的一点。设 \\((U,\\varphi)\\\
  ) 为 \\(p\\) 处的 \\(\\mathfrak{A}\\) 中的一个坐标图，设 \\(q=\\varphi^{-1}(p)\\)，设 \\(\\varepsilon>0\\\
  ) 为一个足够小的实数使得开圆盘 \\(B_{\\varepsilon}=B_{\\varepsilon}(q)\\) 包含于 \\(U\\) 中。若 \\(\\\
  mathcal{K}(p)\\neq0\\)，则\n\n\\[\n|\\mathcal{K}(p)|=\\lim_{\\varepsilon\\to0}\\frac{\\\
  operatorname{area}(\\mathcal{N}\\circ\\varphi(B_{\\varepsilon}))}{\\operatorname{area}(\\\
  varphi(B_{\\varepsilon}))}.\n\\]\n\n**证明.** 由定理 11.2.10，\\((B_{\\varepsilon},\\\
  varphi|_{B_{\\varepsilon}})\\) 是 \\(M\\) 上的一个坐标图。设 \\((H_1,H_2)\\) 为 \\((U,\\varphi)\\\
  ) 对应的坐标标架。由于 \\(\\mathcal{K}(p)\\neq0\\)，我们由 (12.8.1) 和 (12.8.12) 可得 \\(\\det(d_p(\\\
  mathcal{N}))\\neq0\\)，然后由定理 2.5.3 可得 \\(d_p(\\mathcal{N})\\) 是一个线性同构。因此，\\(\\mathcal{N}\\\
  ) 在 \\(p\\) 处是一个浸入。由于 \\(M\\) 和 \\(\\mathcal{S}^2\\) 都是 2 维的，由定理 14.6.2，\\(\\mathcal{N}\\\
  ) 在 \\(p\\) 处是一个局部微分同胚。若必要，取 \\(\\varepsilon\\) 更小，则 \\((B_{\\varepsilon},\\mathcal{N}\\\
  circ\\varphi|_{B_{\\varepsilon}})\\) 是 \\(\\mathcal{S}^2\\) 上的一个坐标图。见图 12.8.2。我们由例\
  \ 19.10.3 可得\n\n\\[\n\\operatorname{area}(\\varphi(B_{\\varepsilon}))=\\iint_{B_{\\\
  varepsilon}}\\|H_1\\times H_2\\|\\,dr^1dr^2.\n\\]\n\n且\n\n\\[\n\\begin{aligned}\n\
  \\operatorname{area}(\\mathcal{N}\\circ\\varphi(B_{\\varepsilon}))\n&=\\iint_{B_{\\\
  varepsilon}}\\left\\|\\frac{\\partial(\\mathcal{N}\\circ\\varphi)}{\\partial r^1}\\\
  times\\frac{\\partial(\\mathcal{N}\\circ\\varphi)}{\\partial r^2}\\right\\|\\,dr^1dr^2\\\
  \\\n&=\\iint_{B_{\\varepsilon}}\\|\\mathcal{W}(H_1)\\times\\mathcal{W}(H_2)\\|\\\
  ,dr^1dr^2 & &[(12.8.10)]\\\\\n&=\\iint_{B_{\\varepsilon}}|\\det(\\mathcal{W})|\\\
  ,\\|H_1\\times H_2\\|\\,dr^1dr^2. & &[\\text{Th 8.4.7}]\n\\end{aligned}\n\\]\n\n\
  可利用定理 10.5.6 证明\n\n\\[\n\\lim_{\\varepsilon\\to0}\\frac{\\operatorname{area}(\\\
  mathcal{N}\\circ\\varphi(B_{\\varepsilon}))}{\\operatorname{area}(\\varphi(B_{\\\
  varepsilon}))}\n=\\lim_{\\varepsilon\\to0}\\frac{\\iint_{B_{\\varepsilon}}|\\det(\\\
  mathcal{W})|\\,\\|H_1\\times H_2\\|\\,dr^1dr^2}{\\iint_{B_{\\varepsilon}}\\|H_1\\\
  times H_2\\|\\,dr^1dr^2}\n=|\\det(\\mathcal{W}_p)|=|\\mathcal{K}(p)|.\n\\]\n\n![](img/d712710a8eb78c0959204afd5dde4c91_313_0.png)\n\
  \n**图 12.8.2.** 定理 12.8.5 的示意图\n\n图 12.8.2 为定理 12.8.5 提供了几何直观。由于如图所示的 \\(M\\) 在\
  \ \\(p\\) 处高度弯曲，\\(\\mathcal{N}\\circ\\varphi(B_{\\varepsilon})\\) 的面积相应地大于 \\(\\\
  varphi(B_{\\varepsilon})\\) 的面积，导致 \\(|\\mathcal{K}(p)|\\) 的值更大。\n\n## 例 12.8.6.\n\
  \n下表总结了 \\(\\mathbb{R}^3_0\\) 和 \\(\\mathbb{R}^3_1\\) 中第 13 章详细描述的正则曲面的高斯曲率。记号在该章的相关部分中解释。有几点观察是必要的。\n\
  \n在 \\(\\mathbb{R}^3_0\\) 中，平板、圆柱和圆锥都具有常数高斯曲率 \\(0\\)。这对平面来说并不令人惊讶，但对\n\n\n圆柱和圆锥。原因在于，圆柱和圆锥可以通过对平面（的一部分）进行光滑变形得到，这种变形涉及弯曲但不涉及拉伸。这使得变形后的平面的“内在”几何保持不变，从而保持每一点的高斯曲率。球面具有恒定的正高斯曲率，而曳物面（形状类似喇叭）具有恒定的负高斯曲率。单叶双曲面（双叶双曲面）的高斯曲率为负（正）但不恒定。环面上存在一个高斯曲率为正的区域和一个为负的区域，其间有一个高斯曲率为0的过渡带。\n\
  \n| 节 | ℝ³₀ 中的几何对象 | 高斯曲率 |\n|---|---|---|\n| 13.1 | 平面 | 0 |\n| 13.2 | 圆柱 | 0 |\n\
  | 13.2 | 圆锥 | 0 |\n| 13.4 | 球面 | 1/R² |\n| 13.5 | 曳物面 | −1 |\n| 13.6 | 单叶双曲面 | −1/(2x²\
  \ + 2y² − 1)² |\n| 13.7 | 双叶双曲面 | 1/(2x² + 2y² + 1)² |\n| 13.8 | 环面 | cos(φ)/[cos(φ)\
  \ + R] |\n\n在 ℝ³₁ 中，伪球面具有恒定的正高斯曲率，而双曲空间具有恒定的负高斯曲率。有趣的是，单叶双曲面和伪球面是由同一基础曲面定义的。它们高斯曲率的差异完全源于一个位于内积空间\
  \ ℝ³₀ 中，另一个位于洛伦兹向量空间 ℝ³₁ 中。类似的说明也适用于双叶双曲面和双曲空间。\n\n| 节 | ℝ³₁ 中的几何对象 | 高斯曲率 |\n|---|---|---|\n\
  | 13.9 | 伪球面 | 1 |\n| 13.10 | 双曲空间 | −1 |\n\n## 12.9 ℝ³_ν 中的黎曼曲率张量\n\n对于 \\(\\mathbb{R}^3_\\\
  nu\\) 中的正则曲面 \\((M,g)\\)，黎曼曲率张量是如下映射\n\n\\[\nR: \\mathfrak{X}(M)^3 \\to \\mathfrak{X}(M)\n\
  \\]\n\n定义为\n\n\\[\nR(X,Y)Z = \\nabla_X(\\nabla_Y(Z)) - \\nabla_Y(\\nabla_X(Z)) -\
  \ \\nabla_{[X,Y]}(Z) \\tag{12.9.1}\n\\]\n\n对所有 \\(\\mathfrak{X}(M)\\) 中的向量场 \\(X,Y,Z\\\
  ) 成立；也就是说，\n\n\\[\n(R(X,Y)Z)_p = (\\nabla_X(\\nabla_Y(Z)))_p - (\\nabla_Y(\\nabla_X(Z)))_p\
  \ - (\\nabla_{[X,Y]}(Z))_p\n\\]\n\n对所有 \\(M\\) 中的 \\(p\\) 成立。加上大括号是为了明确前面恒等式中的四项都是在点\
  \ \\(p\\) 处取值的 \\(\\mathfrak{X}(M)\\) 中的向量场，因此是 \\(T_p(M)\\) 中的向量。由于 \\((R(X,Y)Z)_p\\\
  ) 不是实数，用“张量”一词来描述 \\(R\\) 有点用词不当。这一矛盾在定理 19.5.5 中得到解决。表达式 \\(R_p(X_p,Y_p)Z_p\\)\
  \ 目前没有意义——至少现在还没有。\n\n我们在示例 12.4.4 中给出了一个二阶协变导数 \\(\\nabla^2_{X,Y}(Z)\\) 和 \\(\\\
  nabla^2_{Y,X}(Z)\\) 不相等的例子。下一个结果表明，这两个向量场之差正是 \\(R(X,Y)Z\\)。\n\n### 定理 12.9.1。\n\
  \n若 \\((M,\\mathfrak{g})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面，则\n\n\\[\nR(X,Y)Z\
  \ = \\nabla^2_{X,Y}(Z) - \\nabla^2_{Y,X}(Z)\n\\]\n\n对所有 \\(\\mathfrak{X}(M)\\) 中的向量场\
  \ \\(X,Y,Z\\) 成立。\n\n证明。由定理 12.4.1(a) 和 (12.6.1) 可得\n\n\\[\n\\nabla_{[X,Y]}(Z) =\
  \ \\nabla_{\\nabla_X(Y)-\\nabla_Y(X)}(Z) = \\nabla_{\\nabla_X(Y)}(Z) - \\nabla_{\\\
  nabla_Y(X)}(Z).\n\\]\n\n于是\n\n\\[\n\\begin{aligned}\nR(X,Y)Z\n&= \\nabla_X(\\nabla_Y(Z))\
  \ - \\nabla_Y(\\nabla_X(Z)) - \\nabla_{[X,Y]}(Z)\\\\\n&= [\\nabla_X(\\nabla_Y(Z))\
  \ - \\nabla_{\\nabla_X(Y)}(Z)] - [\\nabla_Y(\\nabla_X(Z)) - \\nabla_{\\nabla_Y(X)}(Z)]\\\
  \\\n&= \\nabla^2_{X,Y}(Z) - \\nabla^2_{Y,X}(Z),\n\\end{aligned}\n\\]\n\n其中最后一个等号由\
  \ (12.4.4) 得到。\n\n为了计算的目的，给出 \\(R\\) 的局部坐标表达式是有帮助的。\n\n### 定理 12.9.2。\n\n设 \\((M,\\\
  mathfrak{g})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面，设 \\(X,Y,Z\\) 是 \\(\\mathfrak{X}(M)\\\
  ) 中的向量场，并在局部坐标下令\n\n\\[\nX\\circ\\varphi = \\sum_i \\alpha^i H_i, \\qquad Y\\circ\\\
  varphi = \\sum_j \\beta^j H_j, \\qquad Z\\circ\\varphi = \\sum_k \\gamma^k H_k.\n\
  \\]\n\n则\n\n\\[\nR(X,Y)Z\\circ\\varphi = \\sum_l \\left(\\sum_{ijk} \\alpha^i\\\
  beta^j\\gamma^k R^l_{ijk}\\right) H_l, \\tag{12.9.2}\n\\]\n\n其中\n\n\\[\nR^l_{ijk}\
  \ = \\frac{\\partial\\Gamma^l_{jk}}{\\partial r^i} - \\frac{\\partial\\Gamma^l_{ik}}{\\\
  partial r^j} + \\sum_n \\left(\\Gamma^l_{in}\\Gamma^n_{jk} - \\Gamma^l_{jn}\\Gamma^n_{ik}\\\
  right) \\tag{12.9.3}\n\\]\n\n对 \\(i,j,k,l=1,2\\) 成立。\n\n证明。由 (12.4.20) 可得\n\n\\\
  [\n\\begin{aligned}\n(\\nabla^2_{X,Y}(Z)\\circ\\varphi)^l\n&= \\sum_{ij}^{(3)}\\\
  alpha^i\\beta^j \\frac{\\partial^2\\gamma^l}{\\partial r^i\\partial r^j}\n+ \\sum_{ijk}^{(4)}\\\
  alpha^i\\beta^j \\frac{\\partial\\gamma^k}{\\partial r^i}\\Gamma^l_{jk}\n+ \\sum_{ijk}^{(5)}\\\
  alpha^i\\beta^j\\gamma^k \\frac{\\partial\\Gamma^l_{jk}}{\\partial r^i}\\\\\n&\\\
  quad + \\sum_{ijk}^{(6)}\\alpha^i\\beta^j \\frac{\\partial\\gamma^k}{\\partial r^j}\\\
  Gamma^l_{ik}\n+ \\sum_{ijkn}^{(7)}\\alpha^i\\beta^j\\gamma^k \\Gamma^n_{jk}\\Gamma^l_{in}\n\
  - \\sum_{ijk}^{(8)}\\alpha^i\\beta^j \\frac{\\partial\\gamma^k}{\\partial r^k}\\\
  Gamma^l_{ij}\n- \\sum_{ijkn}^{(9)}\\alpha^i\\beta^j\\gamma^k \\Gamma^n_{ij}\\Gamma^l_{kn}.\n\
  \\end{aligned}\n\\]\n\n交换 \\(X\\) 和 \\(Y\\) 的角色可得\n\n\\[\n\\begin{aligned}\n(\\\
  nabla^2_{Y,X}(Z)\\circ\\varphi)^l\n&= \\sum_{ij}\\alpha^j\\beta^i \\frac{\\partial^2\\\
  gamma^l}{\\partial r^i\\partial r^j}\n+ \\sum_{ijk}\\alpha^j\\beta^i \\frac{\\partial\\\
  gamma^k}{\\partial r^i}\\Gamma^l_{jk}\n+ \\sum_{ijk}\\alpha^j\\beta^i\\gamma^k \\\
  frac{\\partial\\Gamma^l_{jk}}{\\partial r^i}\\\\\n&\\quad + \\sum_{ijk}\\alpha^j\\\
  beta^i \\frac{\\partial\\gamma^k}{\\partial r^j}\\Gamma^l_{ik}\n+ \\sum_{ijkn}\\\
  alpha^j\\beta^i\\gamma^k \\Gamma^n_{jk}\\Gamma^l_{in}\n- \\sum_{ijk}\\alpha^j\\\
  beta^i \\frac{\\partial\\gamma^k}{\\partial r^k}\\Gamma^l_{ij}\n- \\sum_{ijkn}\\\
  alpha^j\\beta^i\\gamma^k \\Gamma^n_{ij}\\Gamma^l_{kn}\\\\\n&= \\sum_{ij}^{(3)}\\\
  alpha^i\\beta^j \\frac{\\partial^2\\gamma^l}{\\partial r^i\\partial r^j}\n+ \\sum_{ijk}^{(6)}\\\
  alpha^i\\beta^j \\frac{\\partial\\gamma^k}{\\partial r^j}\\Gamma^l_{ik}\n+ \\sum_{ijk}^{(10)}\\\
  alpha^i\\beta^j\\gamma^k \\frac{\\partial\\Gamma^l_{ik}}{\\partial r^j}\n+ \\sum_{ijk}^{(4)}\\\
  alpha^i\\beta^j \\frac{\\partial\\gamma^k}{\\partial r^i}\\Gamma^l_{jk}\\\\\n&\\\
  quad + \\sum_{ijkn}^{(11)}\\alpha^i\\beta^j\\gamma^k \\Gamma^n_{ik}\\Gamma^l_{jn}\n\
  - \\sum_{ijk}^{(8)}\\alpha^i\\beta^j \\frac{\\partial\\gamma^k}{\\partial r^k}\\\
  Gamma^l_{ij}\n- \\sum_{ijkn}^{(9)}\\alpha^i\\beta^j\\gamma^k \\Gamma^n_{ij}\\Gamma^l_{kn},\n\
  \\end{aligned}\n\\]\n\n其中继续使用了定理 12.4.3 的证明中开始使用的求和编号。由定理 12.9.1 可得，\\(R(X,Y)Z\\\
  ) 的第 \\(l\\) 个分量为\n\n\\[\n\\begin{aligned}\n((\\nabla^2_{X,Y}(Z) - \\nabla^2_{Y,X}(Z))\\\
  circ\\varphi)^l\n&= \\sum_{ijk}^{(5)}\\alpha^i\\beta^j\\gamma^k \\frac{\\partial\\\
  Gamma^l_{jk}}{\\partial r^i}\n+ \\sum_{ijkn}^{(7)}\\alpha^i\\beta^j\\gamma^k \\\
  Gamma^n_{jk}\\Gamma^l_{in}\\\\\n&\\quad - \\sum_{ijk}^{(10)}\\alpha^i\\beta^j\\\
  gamma^k \\frac{\\partial\\Gamma^l_{ik}}{\\partial r^j}\n- \\sum_{ijkn}^{(11)}\\\
  alpha^i\\beta^j\\gamma^k \\Gamma^n_{ik}\\Gamma^l_{jn}\\\\\n&= \\sum_{ijk}\\alpha^i\\\
  beta^j\\gamma^k \\left(\\frac{\\partial\\Gamma^l_{jk}}{\\partial r^i} - \\frac{\\\
  partial\\Gamma^l_{ik}}{\\partial r^j} + \\sum_n (\\Gamma^l_{in}\\Gamma^n_{jk} -\
  \ \\Gamma^l_{jn}\\Gamma^n_{ik})\\right)\\\\\n&= \\sum_{ijk}\\alpha^i\\beta^j\\gamma^k\
  \ R^l_{ijk}.\n\\end{aligned}\n\\]\n\n我们在第 12.3 节观察到克里斯托费尔符号是内蕴的。由 (12.9.2) 和 (12.9.3)\
  \ 可知，黎曼曲率张量也是如此。\n\n### 示例 12.9.3 (S²)。\n\n将第 13.4 节给出的 \\(S^2\\) 的克里斯托费尔符号值代入 (12.9.3)\
  \ 可得\n\n\\[\nR^1_{122} = \\sin^2(\\theta), \\quad R^1_{212} = -\\sin^2(\\theta),\
  \ \\quad R^2_{121} = -1, \\quad R^2_{211} = 1,\n\\]\n\n其余 \\(R^l_{ijk}\\) 等于 \\\
  (0\\)。注意，\\(R^l_{ijk}\\) 与 \\(\\varphi\\) 无关，这是球面对称性所预期的。\n\n(12.9.2) 的一个显著特点是表达式中不出现分量函数的偏导数。这一关键观察是接下来两个结果的基础。\n\
  \n### 定理 12.9.4。\n\n若 \\((M,\\mathfrak{g})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面，则\
  \ \\(R\\) 在 \\(M\\) 上逐点确定，其含义如下：对 \\(M\\) 中所有点 \\(p\\)，若 \\(X,Y,Z\\) 和 \\(\\tilde{X},\\\
  tilde{Y},\\tilde{Z}\\) 是 \\(\\mathfrak{X}(M)\\) 中的向量场，且满足\n\n\\[\n(X_p,Y_p,Z_p)\
  \ = (\\tilde{X}_p,\\tilde{Y}_p,\\tilde{Z}_p),\n\\]\n\n则\n\n\\[\n(R(X,Y)Z)_p = (R(\\\
  tilde{X},\\tilde{Y})\\tilde{Z})_p.\n\\]\n\n证明。在局部坐标下，令\n\n\\[\nX\\circ\\varphi =\
  \ \\sum_i \\alpha^i H_i \\quad \\text{and} \\quad \\tilde{X}\\circ\\varphi = \\\
  sum_i \\tilde{\\alpha}^i H_i.\n\\]\n\n则 \\(X_p = \\tilde{X}_p\\) 转化为对 \\(i=1,2\\\
  ) 有 \\(\\alpha^i(p) = \\tilde{\\alpha}^i(p)\\)，另外两个向量场也有相应的恒等式。于是由 (12.9.2) 可得结论。\n\
  \n### 定理 12.9.5。\n\n若 \\((M,\\mathfrak{g})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的正则曲面，则\
  \ \\(R\\) 是 \\(C^\\infty(M)\\)-多重线性的，其含义如下：对所有 \\(\\mathfrak{X}(M)\\) 中的向量场 \\(X,Y,Z,W\\\
  ) 和所有 \\(C^\\infty(M)\\) 中的函数 \\(f\\)，\n\n\\[\nR(fX+W,Y)Z = fR(X,Y)Z + R(W,Y)Z,\n\
  \\]\n\n对于 \\(R\\) 的另外两个参数也有相应的恒等式。\n\n证明。这可由与定理 12.9.4 的证明类似的推理得到。\n\n### 定理 12.9.6。\n\
  \n设 \\((M,\\mathfrak{g},\\mathfrak{O})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的定向正则曲面，设\
  \ \\(\\mathcal{N}\\) 为高斯映射，设 \\(X,Y\\) 是 \\(\\mathfrak{X}(M)\\) 中的向量场。则：\n\n(a)\n\
  \n\\[\n\\langle D_X(Y), \\mathcal{N}\\rangle = \\langle \\mathcal{W}(X), Y\\rangle.\n\
  \\]\n\n(b)\n\n\\[\nD_X(Y) = \\nabla_X(Y) + \\epsilon_M \\langle \\mathcal{W}(X),\
  \ Y\\rangle \\mathcal{N}. \\tag{12.9.4}\n\\]\n\n证明。 (a)：将 \\(D_X\\) 作用于 \\(\\langle\
  \ Y,\\mathcal{N}\\rangle = 0\\) 两边，并利用定理 12.3.1(e)，可得 \\(\\langle D_X(Y),\\mathcal{N}\\\
  rangle = \\langle -D_X(\\mathcal{N}),Y\\rangle\\)。现在由定理 12.8.1 即得结论。\n\n(b)：设 \\\
  (p\\) 是 \\(M\\) 中一点，并回顾第 12.4 节给出的 \\(\\tan_p\\) 和 \\(\\operatorname{nor}_p\\) 的定义。由定理\
  \ 4.1.4，\n\n\\[\nD_X(Y)_p = \\tan_p(D_X(Y)_p) + \\operatorname{nor}_p(D_X(Y)_p),\n\
  \\]\n\n且由 (12.4.2)，\n\n\\[\n\\tan_p(D_X(Y)_p) = \\nabla_X(Y)_p.\n\\]\n\n由定理 12.7.3(b)\
  \ 可得 \\(T_p(M)^\\perp = \\mathbb{R}\\mathcal{N}_p\\)，再由定理 4.1.5 和 (12.2.3) 可得\n\n\
  \\[\n\\operatorname{nor}_p(D_X(Y)_p) = \\frac{\\langle \\mathcal{N}_p, D_X(Y)_p\\\
  rangle}{\\langle \\mathcal{N}_p,\\mathcal{N}_p\\rangle}\\mathcal{N}_p\n= \\epsilon_M\
  \ \\langle D_X(Y)_p,\\mathcal{N}_p\\rangle\\mathcal{N}_p.\n\\]\n\n因此，\n\n\\[\nD_X(Y)_p\
  \ = \\nabla_X(Y)_p + \\epsilon_M \\langle D_X(Y)_p,\\mathcal{N}_p\\rangle\\mathcal{N}_p.\n\
  \\]\n\n由于 \\(p\\) 是任意的，\n\n\\[\nD_X(Y) = \\nabla_X(Y) + \\epsilon_M \\langle D_X(Y),\\\
  mathcal{N}\\rangle\\mathcal{N}.\n\\]\n\n现在由 (a) 部即得结论。\n\n### 定理 12.9.7。\n\n若 \\\
  ((M,\\mathfrak{g},\\mathfrak{O})\\) 是 \\(\\mathbb{R}^3_\\nu\\) 中的定向正则曲面，且 \\(X,Y,Z\\\
  ) 是 \\(\\mathfrak{X}(M)\\) 中的向量场，则：\n\n(a)\n\n\\[\nR(X,Y)Z = \\epsilon_M[\\mathfrak{h}(Y,Z)\\\
  mathcal{W}(X) - \\mathfrak{h}(X,Z)\\mathcal{W}(Y)].\n\\]\n\n(b)\n\n\\[\n\\nabla_X(\\\
  mathcal{W}(Y)) - \\nabla_Y(\\mathcal{W}(X)) = \\mathcal{W}([X,Y]).\n\\]\n\n证明。由定理\
  \ 12.9.6(b)，\n\n\\[\nD_X(D_Y(Z)) = D_X(\\nabla_Y(Z) + \\epsilon_M \\langle \\mathcal{W}(Y),Z\\\
  rangle\\mathcal{N}) \\tag{12.9.5}\n\\]\n\n\\[\n= D_X(\\nabla_Y(Z)) + \\epsilon_M\
  \ D_X(\\langle \\mathcal{W}(Y),Z\\rangle\\mathcal{N})\n\\]\n\n且\n\n\\[\nD_X(\\nabla_Y(Z))\
  \ = \\nabla_X(\\nabla_Y(Z)) + \\epsilon_M \\langle \\mathcal{W}(X),\\nabla_Y(Z)\\\
  rangle\\mathcal{N}, \\tag{12.9.6}\n\\]\n\n并由定理 12.3.1 的 (d) 和 (e) 部以及定理 12.8.1，\n\
  \n\\[\nD_X(\\langle \\mathcal{W}(Y),Z\\rangle\\mathcal{N})\n= D_X(\\langle \\mathcal{W}(Y),Z\\\
  rangle)\\mathcal{N} + \\langle \\mathcal{W}(Y),Z\\rangle D_X(\\mathcal{N}) \\tag{12.9.7}\n\
  \\]\n\n\\[\n= [\\langle D_X(\\mathcal{W}(Y)),Z\\rangle + \\langle \\mathcal{W}(Y),D_X(Z)\\\
  rangle]\\mathcal{N} - \\langle \\mathcal{W}(Y),Z\\rangle\\mathcal{W}(X).\n\\]\n\n\
  \n将(12.9.6)和(12.9.7)代入(12.9.5)，得到\n\n$$\n\\begin{aligned}\nD_X(D_Y(Z)) &= \\nabla_X(\\\
  nabla_Y(Z)) - \\epsilon_M\\langle\\mathcal{W}(Y), Z\\rangle\\mathcal{W}(X) \\\\\n\
  &\\quad + \\epsilon_M\\big[\\langle D_X(\\mathcal{W}(Y)), Z\\rangle + \\langle\\\
  mathcal{W}(Y), D_X(Z)\\rangle \\\\\n&\\quad + \\langle\\mathcal{W}(X), \\nabla_Y(Z)\\\
  rangle\\big]\\mathcal{N}.\n\\end{aligned} \\tag{12.9.8}\n$$\n\n又由定理12.9.6(b)，\n\n\
  $$\n\\begin{aligned}\n\\langle D_X(\\mathcal{W}(Y)), Z\\rangle\n&= \\langle\\nabla_X(\\\
  mathcal{W}(Y)) + \\epsilon_M\\langle\\mathcal{W}(X), \\mathcal{W}(Y)\\rangle\\mathcal{N},\
  \ Z\\rangle \\\\\n&= \\langle\\nabla_X(\\mathcal{W}(Y)), Z\\rangle + \\epsilon_M\\\
  langle\\mathcal{W}(X), \\mathcal{W}(Y)\\rangle\\langle\\mathcal{N}, Z\\rangle \\\
  \\\n&= \\langle\\nabla_X(\\mathcal{W}(Y)), Z\\rangle.\n\\end{aligned} \\tag{12.9.9}\n\
  $$\n\n以及\n\n$$\n\\begin{aligned}\n\\langle\\mathcal{W}(Y), D_X(Z)\\rangle\n&= \\\
  langle\\mathcal{W}(Y), \\nabla_X(Z) + \\epsilon_M\\langle\\mathcal{W}(X), Z\\rangle\\\
  mathcal{N}\\rangle \\\\\n&= \\langle\\mathcal{W}(Y), \\nabla_X(Z)\\rangle + \\epsilon_M\\\
  langle\\mathcal{W}(X), Z\\rangle\\langle\\mathcal{W}(Y), \\mathcal{N}\\rangle \\\
  \\\n&= \\langle\\mathcal{W}(Y), \\nabla_X(Z)\\rangle.\n\\end{aligned} \\tag{12.9.10}\n\
  $$\n\n将(12.9.9)和(12.9.10)代入(12.9.8)，得到\n\n$$\n\\begin{aligned}\nD_X(D_Y(Z)) &= \\\
  nabla_X(\\nabla_Y(Z)) - \\epsilon_M\\langle\\mathcal{W}(Y), Z\\rangle\\mathcal{W}(X)\
  \ \\\\\n&\\quad + \\epsilon_M\\big[\\langle\\nabla_X(\\mathcal{W}(Y)), Z\\rangle\
  \ + \\langle\\mathcal{W}(Y), \\nabla_X(Z)\\rangle \\\\\n&\\quad + \\langle\\mathcal{W}(X),\
  \ \\nabla_Y(Z)\\rangle\\big]\\mathcal{N}.\n\\end{aligned} \\tag{12.9.11}\n$$\n\n\
  在(12.9.11)中交换\\(X\\)和\\(Y\\)的角色，得到\n\n$$\n\\begin{aligned}\nD_Y(D_X(Z)) &= \\nabla_Y(\\\
  nabla_X(Z)) - \\epsilon_M\\langle\\mathcal{W}(X), Z\\rangle\\mathcal{W}(Y) \\\\\n\
  &\\quad + \\epsilon_M\\big[\\langle\\nabla_Y(\\mathcal{W}(X)), Z\\rangle + \\langle\\\
  mathcal{W}(X), \\nabla_Y(Z)\\rangle \\\\\n&\\quad + \\langle\\mathcal{W}(Y), \\\
  nabla_X(Z)\\rangle\\big]\\mathcal{N}.\n\\end{aligned} \\tag{12.9.12}\n$$\n\n再次利用定理12.9.6(b)，\n\
  \n$$\nD_{[X,Y]}(Z) = \\nabla_{[X,Y]}(Z) + \\epsilon_M\\langle\\mathcal{W}([X,Y]),\
  \ Z\\rangle\\mathcal{N}. \\tag{12.9.13}\n$$\n\n我们注意到，在当前上下文中，\\([X,Y]\\)表示\\(\\\
  nabla_X(Y) - \\nabla_Y(X)\\)，而不是\\(D_X(Y) - D_Y(X)\\)。但根据定理12.6.2，这两个向量场是相等的。根据定理10.1.15，在\\\
  (\\mathbb{R}^3\\)中存在包含\\(M\\)的开集\\(U\\)，以及\\(\\mathfrak{X}(U)\\)中的向量场\\(\\tilde{X},\
  \ \\tilde{Y}, \\tilde{Z}\\)，它们分别在\\(M\\)上限制为\\(X, Y, Z\\)。根据定理10.4.3，\n\n$$\n\\\
  tilde{D}_{\\tilde{X}}(\\tilde{D}_{\\tilde{Y}}(\\tilde{Z}))\n- \\tilde{D}_{\\tilde{Y}}(\\\
  tilde{D}_{\\tilde{X}}(\\tilde{Z}))\n- \\tilde{D}_{\\tilde{D}_{\\tilde{X}}(\\tilde{Y})\
  \ - \\tilde{D}_{\\tilde{Y}}(\\tilde{X})}(\\tilde{Z})\n= (0,0,0)\n$$\n\n在\\(U\\)上成立，其中\\\
  (\\tilde{D}\\)表示欧几里得导数（见第10.3节）。因此\n\n$$\n\\begin{aligned}\n(0,0,0) &= D_X(D_Y(Z))\
  \ - D_Y(D_X(Z)) - D_{D_X(Y)-D_Y(X)}(Z) \\\\\n&= D_X(D_Y(Z)) - D_Y(D_X(Z)) - D_{[X,Y]}(Z).\n\
  \\end{aligned} \\tag{12.9.14}\n$$\n\n在\\(M\\)上成立。将(12.9.11)–(12.9.13)代入(12.9.14)，并利用(12.9.1)，得到\n\
  \n$$\nR(X,Y)Z - \\epsilon_M[\\langle\\mathcal{W}(Y),Z\\rangle\\mathcal{W}(X) - \\\
  langle\\mathcal{W}(X),Z\\rangle\\mathcal{W}(Y)]\n+ \\epsilon_M\\langle\\nabla_X(\\\
  mathcal{W}(Y)) - \\nabla_Y(\\mathcal{W}(X)) - \\mathcal{W}([X,Y]), Z\\rangle\\mathcal{N}\
  \ = (0,0,0).\n$$\n\n由此可见，上式左端的切向分量和法向分量都等于\\((0,0,0)\\)，因此\n\n$$\nR(X,Y)Z = \\epsilon_M[\\\
  langle\\mathcal{W}(Y),Z\\rangle\\mathcal{W}(X) - \\langle\\mathcal{W}(X),Z\\rangle\\\
  mathcal{W}(Y)] \\tag{12.9.15}\n$$\n\n并且\n\n$$\n\\langle\\nabla_X(\\mathcal{W}(Y))\
  \ - \\nabla_Y(\\mathcal{W}(X)) - \\mathcal{W}([X,Y]), Z\\rangle = 0. \\tag{12.9.16}\n\
  $$\n\n由(12.8.7)和(12.9.15)，我们得到\n\n$$\nR(X,Y)Z = \\epsilon_M[\\mathfrak{h}(Y,Z)\\\
  mathcal{W}(X) - \\mathfrak{h}(X,Z)\\mathcal{W}(Y)],\n$$\n\n这就证明了(a)部分。由于\\(\\mathfrak{g}\\\
  )是非退化的，且(12.9.16)对\\(\\mathfrak{X}(M)\\)中的所有向量场\\(Z\\)成立，因此\n\n$$\n\\nabla_X(\\\
  mathcal{W}(Y)) - \\nabla_Y(\\mathcal{W}(X)) - \\mathcal{W}([X,Y]) = (0,0,0),\n$$\n\
  \n这就证明了(b)部分。\n\n设\\((M,\\mathfrak{g})\\)是\\(\\mathbb{R}^3_\\nu\\)中的正则曲面，并定义映射\n\
  \n$$\n\\mathcal{R}\\colon \\mathfrak{X}(M)^4 \\longrightarrow C^\\infty(M),\n$$\n\
  \n也称为黎曼曲率张量，定义为\n\n$$\n\\mathcal{R}(X,Y,Z,W) = \\langle R(X,Y)Z, W\\rangle\n$$\n\
  \n对所有\\(\\mathfrak{X}(M)\\)中的向量场\\(X, Y, Z, W\\)成立；即\n\n$$\n\\mathcal{R}(X,Y,Z,W)(p)\
  \ = \\langle (R(X,Y)Z)_p, W_p\\rangle \\tag{12.9.17}\n$$\n\n对所有\\(p\\in M\\)成立。根据定义，\\\
  (\\mathcal{R}(X,Y,Z,W)\\)是\\(C^\\infty(M)\\)中的函数。由于\\(\\mathcal{R}(X,Y,Z,W)(p)\\\
  )是一个实数，称\\(\\mathcal{R}\\)为“张量”或许是有道理的。我们稍后再讨论这个问题。\n\n### 定理12.9.8.\n\n设\\((M,\\\
  mathfrak{g})\\)是\\(\\mathbb{R}^3_\\nu\\)中的正则曲面，设\\(X, Y, Z, W\\)是\\(\\mathfrak{X}(M)\\\
  )中的向量场，并且在局部坐标下，设\n\n$$\nX\\circ\\varphi=\\sum_i \\alpha^i H_i,\\qquad Y\\circ\\\
  varphi=\\sum_j \\beta^j H_j,\\qquad Z\\circ\\varphi=\\sum_k \\gamma^k H_k,\\qquad\
  \ W\\circ\\varphi=\\sum_l \\delta^l H_l.\n$$\n\n则\n\n$$\n\\mathcal{R}(X,Y,Z,W)\\\
  circ\\varphi = \\sum_{i j k l n} \\alpha^i \\beta^j \\gamma^k \\delta^l g_{ln} R^n_{ijk}.\
  \ \\tag{12.9.18}\n$$\n\n**证明。** 由(12.9.2)我们有\n\n$$\n\\begin{aligned}\n\\mathcal{R}(X,Y,Z,W)\\\
  circ\\varphi\n&= \\langle R(X,Y)Z\\circ\\varphi, W\\circ\\varphi\\rangle \\\\\n\
  &= \\left\\langle\\sum_n\\left(\\sum_{ijk}\\alpha^i\\beta^j\\gamma^kR^n_{ijk}\\\
  right)H_n,\\sum_l\\delta^lH_l\\right\\rangle \\\\\n&= \\sum_{ijkln}\\alpha^i\\beta^j\\\
  gamma^k\\delta^l g_{ln}R^n_{ijk}.\n\\end{aligned}\n$$\n\n我们在讨论(12.9.2)和(12.9.3)时已经指出，黎曼曲率张量\\\
  (R\\)是内蕴的。鉴于(12.9.18)，同样可以说黎曼曲率张量\\(\\mathcal{R}\\)也是内蕴的。正如(12.9.2)的情形，(12.9.18)中不涉及分量函数的偏导数。这一观察是接下来两个结果的基础，它们分别对应定理12.9.4和定理12.9.5，并且证明方法类似。\n\
  \n### 定理12.9.9.\n\n若\\((M,g)\\)是\\(\\mathbb{R}^3_\\nu\\)中的正则曲面，则\\(\\mathcal{R}\\\
  )按如下意义逐点确定：对\\(M\\)中所有点\\(p\\)，若\\(X,Y,Z,W\\)和\\(\\widetilde X,\\widetilde Y,\\\
  widetilde Z,\\widetilde W\\)是\\(\\mathfrak{X}(M)\\)中的向量场，且满足\n\n$$\n(X_p,Y_p,Z_p,W_p)=(\\\
  widetilde X_p,\\widetilde Y_p,\\widetilde Z_p,\\widetilde W_p),\n$$\n\n则\n\n$$\n\
  \\mathcal{R}(X,Y,Z,W)(p)=\\mathcal{R}(\\widetilde X,\\widetilde Y,\\widetilde Z,\\\
  widetilde W)(p).\n$$\n\n### 定理12.9.10.\n\n若\\((M,g)\\)是\\(\\mathbb{R}^3_\\nu\\)中的正则曲面，则\\\
  (\\mathcal{R}\\)按如下意义是\\(C^\\infty(M)\\)-多重线性的：对\\(\\mathfrak{X}(M)\\)中所有向量场\\(X,Y,Z,V,W\\\
  )以及\\(C^\\infty(M)\\)中所有函数\\(f\\)，\n\n$$\n\\mathcal{R}(fX+W,Y,Z,V)=f\\mathcal{R}(X,Y,Z,V)+\\\
  mathcal{R}(W,Y,Z,V),\n$$\n\n对\\(\\mathcal{R}\\)的其余三个自变量也有相应的恒等式。\n\n设\\((M,g)\\\
  )是\\(\\mathbb{R}^3_\\nu\\)中的正则曲面，设\\(p\\)是\\(M\\)中的一点，设\\(v\\)是\\(T_p(M)\\)中的一个向量。根据定理15.1.22，存在\\\
  (\\mathfrak{X}(M)\\)中的向量场\\(X\\)使得\\(X_p=v\\)。结合定理12.9.4、定理12.9.5、定理12.9.9和定理12.9.10，这使我们能够对\\\
  (R\\)和\\(\\mathcal{R}\\)给出有趣的解释。我们定义映射\n\n$$\nR_p\\colon T_p(M)^3\\longrightarrow\
  \ T_p(M)\n$$\n\n如下：\n\n$$\nR_p(v_1,v_2)v_3=(R(X_1,X_2)X_3)_p, \\tag{12.9.19}\n$$\n\
  \n并定义映射\n\n$$\n\\mathcal{R}_p\\colon T_p(M)^4\\longrightarrow\\mathbb{R}\n$$\n\n\
  如下：\n\n$$\n\\mathcal{R}_p(v_1,v_2,v_3,v_4)=\\mathcal{R}(X_1,X_2,X_3,X_4)(p)\n$$\n\
  \n对所有\\(T_p(M)\\)中的向量\\(v_1,v_2,v_3,v_4\\)成立，其中\\(X_1,X_2,X_3,X_4\\)是\\(\\mathfrak{X}(M)\\\
  )中满足如下条件的任意向量场：\n\n$$\n(X_1|_p,X_2|_p,X_3|_p,X_4|_p)=(v_1,v_2,v_3,v_4).\n$$\n\n\
  分别根据定理12.9.4和定理12.9.9，\\(R_p\\)和\\(\\mathcal{R}_p\\)不依赖于向量场的选取，因此上述定义是有意义的。由(12.9.17)及上述恒等式可得\n\
  \n$$\n\\mathcal{R}_p(v_1,v_2,v_3,v_4)\n= \\mathcal{R}(X_1,X_2,X_3,X_4)(p)\n= \\\
  langle (R(X_1,X_2)X_3)_p, X_4|_p\\rangle\n= \\langle R_p(v_1,v_2)v_3, v_4\\rangle.\n\
  $$\n\n根据定理12.9.10，\\(\\mathcal{R}_p\\)属于\\(\\mathcal{T}_4^0(T_p(M))\\)；根据定理12.9.5，\\\
  (R_p\\)属于\\(\\operatorname{Mult}(T_p(M)^3,T_p(M))\\)。这就为称\\(\\mathcal{R}\\)为“张量”提供了理由，也在较小程度上为对\\\
  (R\\)作同样称呼提供了依据。\\(\\mathcal{T}_4^0(T_p(M))\\)中另一个值得关注的张量是由(6.6.7)定义的\\(\\mathcal{D}_p\\\
  )：\n\n$$\n\\mathcal{D}_p(v_1,v_2,v_3,v_4) = \\det\\left(\\begin{bmatrix}\\langle\
  \ v_1,v_3\\rangle & \\langle v_1,v_4\\rangle \\\\ \\langle v_2,v_3\\rangle & \\\
  langle v_2,v_4\\rangle\\end{bmatrix}\\right). \\tag{12.9.20}\n$$\n\n### 定理12.9.11（高斯方程）。\n\
  \n若\\((M,g,\\mathfrak{O})\\)是\\(\\mathbb{R}^3_\\nu\\)中的定向正则曲面，且\\(X,Y,Z,W\\)是\\\
  (\\mathfrak{X}(M)\\)中的向量场，则\n\n$$\n\\mathcal{R}(X,Y,Z,W) = -\\epsilon_M \\det\\\
  left(\\begin{bmatrix}\\mathfrak{h}(X,Z) & \\mathfrak{h}(X,W) \\\\ \\mathfrak{h}(Y,Z)\
  \ & \\mathfrak{h}(Y,W)\\end{bmatrix}\\right).\n$$\n\n**证明。** 由(12.8.7)和定理12.9.7(a)可得\n\
  \n$$\n\\begin{aligned}\n\\mathcal{R}(X,Y,Z,W)\n&= \\epsilon_M \\langle \\mathfrak{h}(Y,Z)\\\
  mathcal{W}(X) - \\mathfrak{h}(X,Z)\\mathcal{W}(Y), W\\rangle \\\\\n&= \\epsilon_M[\\\
  mathfrak{h}(Y,Z)\\langle\\mathcal{W}(X),W\\rangle - \\mathfrak{h}(X,Z)\\langle\\\
  mathcal{W}(Y),W\\rangle] \\\\\n&= \\epsilon_M[\\mathfrak{h}(Y,Z)\\mathfrak{h}(X,W)\
  \ - \\mathfrak{h}(X,Z)\\mathfrak{h}(Y,W)] \\\\\n&= -\\epsilon_M \\det\\left(\\begin{bmatrix}\\\
  mathfrak{h}(X,Z) & \\mathfrak{h}(X,W) \\\\ \\mathfrak{h}(Y,Z) & \\mathfrak{h}(Y,W)\\\
  end{bmatrix}\\right).\n\\end{aligned}\n$$\n\n### 定理12.9.12（黎曼曲率张量的对称性）。\n\n若\\((M,g,\\\
  mathfrak{O})\\)是\\(\\mathbb{R}^3_\\nu\\)中的定向正则曲面，且\\(X,Y,Z,W\\)是\\(\\mathfrak{X}(M)\\\
  )中的向量场，则\\(\\mathcal{R}\\)满足以下对称性：\n\n- [S1] \\(\\mathcal{R}(X,Y,Z,W) = -\\mathcal{R}(Y,X,Z,W).\\\
  )\n- [S2] \\(\\mathcal{R}(X,Y,Z,W) = -\\mathcal{R}(X,Y,W,Z).\\)\n- [S3] \\(\\mathcal{R}(X,Y,Z,W)\
  \ = \\mathcal{R}(Z,W,X,Y).\\)\n\n**证明。** 这由定理12.9.11推出。\n\n\n\n\nand from (12.8.8)\
  \ and Theorem 12.9.11 that\n\nR_p(f1, f2, f2, f1) = -ε_M det( [h_p(f1, f2)  h_p(f1,\
  \ f1); h_p(f2, f2)  h_p(f2, f1)] ) = ε_M det( [h11(q)  h12(q); h21(q)  h22(q)] )\
  \ = ε_M det(h_H(q)).\n\nWe also have\n\nD_p(f1, f2, f2, f1) = -det( [g11(q)  g12(q);\
  \ g21(q)  g22(q)] ) = -det(g_H(q)).\n\nCombining the above identities yields\n\n\
  R_p(h1, h2, h2, h1) / D_p(h1, h2, h2, h1) = -ε_M det(h_H(q)) / det(g_H(q)).\n\n\
  The result now follows from Theorem 12.8.4.\n\n(b): By (4.2.3) and (12.9.20),\n\n\
  D_p(e1, e2, e2, e1) = -⟨e1, e1⟩⟨e2, e2⟩ = (-1)^{ind(g)+1}.\n\nThe result now follows\
  \ from part (a).\n\nAs remarked earlier, the Riemann curvature is intrinsic, whether\
  \ we are dealing with R or R. The Gauss curvature is defined using the Gauss map,\
  \ which in turn is defined using the second fundamental form. For this reason, it\
  \ would appear that the Gauss curvature depends on factors that are “external”.\
  \ However, part (b) of the Theorema Egregium shows that the Gauss curvature is in\
  \ fact intrinsic, something that is unexpected and indeed “remarkable”. The next\
  \ result makes the same point using local coordinates.\n\n## Theorem 12.9.15. Let\
  \ (M, g, A, D) be an oriented regular surface in R^3_ν, and let p be a point in\
  \ M. Then:\n\n(a)\n\nR_p(v1, v2) v3 = K(p) [⟨v2, v3⟩ v1 - ⟨v1, v3⟩ v2]\n\nfor all\
  \ vectors v1, v2, v3 in T_p(M).\n\n(b) If (U, φ) is a chart in A at p and q = φ^{-1}(p),\
  \ then, in local coordinates,\n\nR^l_{ijk}(p) = K(p) [g_{jk}(q) δ^l_i - g_{ik}(q)\
  \ δ^l_j]\n\nfor i, j, k, l = 1, 2.\n\nProof. (a): We recall from Section 6.6 that\
  \ S(T_p(M)) is the subspace of T^0_4(T_p(M)) consisting of tensors satisfying [S1]\
  \ and [S2]. By Theorem 6.6.3(a), D_p is such a tensor, and by parts (a) and (b)\
  \ of Theorem 12.9.12, so is R_p.\n\nIt follows from Theorem 6.6.3(b) that \\mathcal{R}_p\
  \ = c\\mathcal{D}_p for some real number c. Let (e_1, e_2) be an orthonormal basis\
  \ for T_p(M). We have\n\n(-1)^{\\mathrm{ind}(\\mathfrak{g})}\\mathcal{K}(p) = \\\
  mathcal{R}_p(e_1, e_2, e_2, e_1) [Th 12.9.14(b)]\n= c\\mathcal{D}_p(e_1, e_2, e_2,\
  \ e_1)\n= -c\\langle e_1, e_1\\rangle\\langle e_2, e_2\\rangle [(12.9.20)]\n= c(-1)^{\\\
  mathrm{ind}(\\mathfrak{g})+1}, [(4.2.3)]\n\nhence c = -\\mathcal{K}(p), so \\mathcal{R}_p\
  \ = -\\mathcal{K}(p)\\mathcal{D}_p. Then (12.9.20) gives\n\n\\langle R_p(v_1, v_2)v_3,\
  \ v_4\\rangle = \\mathcal{K}(p)\\left\\langle\\langle v_2, v_3\\rangle v_1 - \\\
  langle v_1, v_3\\rangle v_2, v_4\\right\\rangle\n\nfor all vectors v_1, v_2, v_3,\
  \ v_4 in T_p(M). Since \\mathfrak{g} is nondegenerate,\n\nR_p(v_1, v_2)v_3 = \\\
  mathcal{K}(p)\\left[\\langle v_2, v_3\\rangle v_1 - \\langle v_1, v_3\\rangle v_2\\\
  right]\n\nfor all vectors v_1, v_2, v_3 in T_p(M).\n\n(b): Let (H_1, H_2) be the\
  \ coordinate frame corresponding to (U, \\varphi). We have from part (a) that\n\n\
  R_p(H_i|_q, H_j|_q)H_k|_q = \\mathcal{K}(p)\\left[\\langle H_j|_q, H_k|_q\\rangle\
  \ H_i|_q - \\langle H_i|_q, H_k|_q\\rangle H_j|_q\\right]\n= \\mathcal{K}(p)\\left[\\\
  mathfrak{g}_{jk}(q)H_i|_q - \\mathfrak{g}_{ik}(q)H_j|_q\\right].\n\nOn the other\
  \ hand, (12.9.2) and (12.9.19) give\n\nR_p(H_i|_q, H_j|_q)H_k|_q = \\sum_l R_{ijk}^l(p)H_l|_q.\n\
  \nIt follows that\n\nR_{ijk}^l(p) = \\begin{cases}\n\\mathcal{K}(p)\\mathfrak{g}_{jk}(q)\
  \ & \\text{if } l = i\\\\\n-\\mathcal{K}(p)\\mathfrak{g}_{ik}(q) & \\text{if } l\
  \ = j\\\\\n0 & \\text{otherwise}\n\\end{cases}\n= \\mathcal{K}(p)\\left[\\mathfrak{g}_{jk}(q)\\\
  delta_i^l - \\mathfrak{g}_{ik}(q)\\delta_j^l\\right]\n\nfor i, j, k, l = 1, 2.\n\
  \n## 12.10 Computations for Regular Surfaces in \\mathbb{R}_\\nu^3\n\nWe showed\

  \ = 0\n对 i = 1, …, m − 2 成立，并且由 (22.1.11) 和 (22.1.17) 可得\n[A]₁² Rₘ₋₁ = -β (Qₘ₋₁)ᵀ\
  \ Rₘ₋₁ = -εβγ，\n因此\n\n$$[A]^2_1(R^1_1)^T = [ [A]^2_1Q_1 \\ \\cdots \\ [A]^2_1Q_{m-2}\

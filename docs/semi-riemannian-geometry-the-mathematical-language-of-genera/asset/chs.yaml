  mathbb{R}_\\nu^3 and develop specific formulas for computing the coordinate frame,\
  \ Gauss map, first and second fundamental forms, Gauss curvature, and sign. For\
  \ surfaces of revolution in \\mathbb{R}_0^3, formulas for the Christoffel symbols\
  \ and eigenvalues are also provided.\n\n## Theorem 12.10.1 (Graph of Function in\
  \ \\mathbb{R}_0^3). Let \\nu = 0 and continue with the setup of Theorem 11.4.2.\

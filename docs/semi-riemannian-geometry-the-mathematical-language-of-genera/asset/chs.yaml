  \ 满足 [V1] 和 [V2] 的单位法向量场的选取无关。 我们由定理 12.2.2(b) 得到\n\n$$\\epsilon_M=(-1)^{\\nu-\\\
  operatorname{ind}(g)}.$$\n\n一种方便的确定 $\\operatorname{ind}(g)$ 的方法，避免构造正交基，是利用 (12.2.3)\
  \ 求出 $\\epsilon_M$，然后利用 (12.2.4) 计算 $\\operatorname{ind}(g)$。 $\\nu$、$\\operatorname{ind}(g)$\
  \ 和 $\\epsilon_M$ 之间的关系如下：\n\n| ν | ind(g) | ε_M |\n|---:|---:|---:|\n| 0 | 0 |\
  \ 1 |\n| 1 | 1 | 1 |\n| 1 | 0 | -1 |\n\n## 定理 12.2.11.\n\n*设 $(M,g)$ 是 ℝ³_ν 中的正则曲面，$(U,\\\
  varphi)$ 是 $M$ 上的一个坐标图，$(H_1,H_2)$ 是相应的坐标标架，且利用例 11.2.5 将 $\\varphi(U)$ 视为正则曲面。\
  \ 定义映射 $G:U\\longrightarrow\\mathbb{R}^3_\\nu$，称为对应于 $(U,\\varphi)$ 的坐标单位法向量场，由*\n\
  \n$$G_q=\\epsilon_M\\frac{H_1|_q\\times H_2|_q}{\\|H_1|_q\\times H_2|_q\\|}$$\n\n\

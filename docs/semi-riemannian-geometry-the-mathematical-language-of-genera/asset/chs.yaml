  mathcal H})^{-1}\\right)^{\\mathsf T}\\quad [\\mathrm{Th\\ 2.1.3(c)}]\n\\]\n\\[\n\
  =[b_j^i]^{\\mathsf T}.\n\\]\n\n利用 (2.2.6) 和 (2.2.7) 得\n\n\\[\n\\widetilde A^{i_1\\\
  ldots i_r}_{j_1\\ldots j_s}=A(\\widetilde\\theta^{i_1},\\ldots,\\widetilde\\theta^{i_r},\\\

- "## 第 9 章\n\n## 拓扑\n\n### 9.1 拓扑\n\n在概述了线性代数和多线性代数之后，我们现在将注意力转向拓扑学。 这是数学的一个庞大领域，出于必要性，这里呈现的覆盖是高度选择性的。\
  \ 对初学者来说，拓扑可能令人望而生畏地抽象。 拓扑的一个最佳例子（也是下面许多内容的动机）是 ℝ^m 上的欧几里得拓扑，在第 9.4 节中简要介绍，并在第 9.2\
  \ 节和第 9.3 节的准备材料之前介绍。 对拓扑学的新读者可能会发现先浏览这些章节是有帮助的，以便对下面讨论的方向有一个大致的了解。\n\n集合 X 上的拓扑\
  \ \U0001D4AF 是 X 的子集的集合，使得：\n\n+   [T1] ∅ 和 X 在 \U0001D4AF 中。\n+   [T2] \U0001D4AF\
  \ 中元素的任意子集的并集在 \U0001D4AF 中。\n+   [T3] \U0001D4AF 中元素的任意有限子集的交集在 \U0001D4AF 中。\n\
  \n对 (X,\U0001D4AF) 称为拓扑空间，\U0001D4AF 的每个元素称为 \U0001D4AF 中的开集或简称为 \U0001D4AF 中开。\
  \ X 的每个元素称为 X 中的点。 \U0001D4AF 中包含 X 中给定点 x 的任何开集称为 X 中 x 的邻域。 我们说 X 的子集 K 是 \U0001D4AF\
  \ 中的闭集或简称为 \U0001D4AF 中闭，如果 X\\K 是 X 中的开集。 采用 X 作为拓扑空间的简写是很方便的，其中 \U0001D4AF 从上下文中理解。\
  \ 相应地，如果 U 是 \U0001D4AF 中的开集且 K 是 \U0001D4AF 中的闭集，我们说 U 是 X 中的开集或简称为 X 中开，且 K 是\
  \ X 中的闭集或简称为 X 中闭。\n\n定理 9.1.1. 如果 X 是拓扑空间，则以下在 X 中是闭集：\n\n+   (a) ∅ 和 ℝ^m。\n+ \
  \  (b) *X 中任意闭集族的交集。*\n+   (c) *X 中任意有限闭集族的并集。*\n\n*证明.* (a): 显而易见。\n\n(b): 设 {$K_\\\
  alpha : \\alpha \\in A$} 是 X 中闭集的族，设 $K = \\bigcap_{\\alpha \\in A} K_\\alpha$。\
  \ 由于每个 $X \\setminus K_\\alpha$ 在 X 中开且根据定理 A.1(d)，\n\n$X \\setminus K = \\bigcup_{\\\
  alpha \\in A} (X \\setminus K_\\alpha)$,\n\n可得 $X \\setminus K$ 在 X 中开。 因此，$K =\
  \ X \\setminus (X \\setminus K)$ 在 X 中闭。\n\n(c): 设 {$K_i : i = 1, \\dots, m$} 是\
  \ X 中有限闭集族，设 $K = \\bigcup_{i=1}^n K_i$。 由于每个 $X \\setminus K_i$ 在 X 中开且根据定理 A.1(c)，\n\
  \n$X \\setminus K = \\bigcap_{i=1}^m (X \\setminus K_i)$,\n\n可得 $X \\setminus K$\
  \ 在 X 中开。 因此，$K = X \\setminus (X \\setminus K)$ 在 X 中闭。\n\n设 X 是拓扑空间，S 是 X 的子集。\
  \ **S 在 X 中的内部** 用 $\\operatorname{int}_X(S)$ 表示，定义为包含在 S 中的 X 中所有开集的并集。 **S 在 X\
  \ 中的外部** 用 $\\operatorname{ext}_X(S)$ 表示，定义为包含在 $X \\setminus S$ 中的 X 中所有开集的并集。\
  \ **S 在 X 中的边界** 用 $\\operatorname{bd}_X(S)$ 表示，定义为 X 中既不在 $\\operatorname{int}_X(S)$\
  \ 中也不在 $\\operatorname{ext}_X(S)$ 中的所有点的集合。 于是，X 是不相交并\n\n$X = \\operatorname{int}_X(S)\
  \ \\cup \\operatorname{ext}_X(S) \\cup \\operatorname{bd}_X(S)$。\n\n**S 在 X 中的闭包**\
  \ 用 $\\operatorname{cl}_X(S)$ 表示，定义为包含 S 的 X 中所有闭集的交集。\n\n以下是关于内部、外部、边界和闭包的一些基本事实。\n\
  \n### **定理 9.1.2.** *如果 X 是拓扑空间且 S 是 X 的子集，则：*\n\n+   (a) $\\operatorname{int}_X(S)$\

- '## 第一部分：预备知识


  微分几何建立在线性代数——多线性代数与拓扑——分析的双重支柱之上。本书第一部分提供了来自这些数学领域的选定主题的概述。这里呈现的大部分线性代数内容读者可能已经熟悉，但多线性代数的情况可能并非如此，除去行列式相关的内容。拓扑和分析都是庞大的学科，这里仅涉及最基本的要点。为了使本书保持在可管理的规模内，并非所有定理都附有证明，这一说明同样适用于第二部分和第三部分。

  '
- '### 第1章：向量空间


  #### 1.1 向量空间


  向量空间在域上的定义以及向量空间的子空间的定义在第 B.6 节给出。本书的关注点完全集中在实数域上的向量空间上，而非复数域或其他域。


  在整个论述中，所有向量空间都在 \(\mathbb{R}\) 上，即实数域。


  为简洁起见，我们在可能的情况下省略对 \(\mathbb{R}\) 的引用，例如写“线性”而非“\(\mathbb{R}\)-线性”。


  特别重要的是向量空间 \(\mathbb{R}^n\)，但还会遇到许多其他向量空间的例子。很容易证明，向量空间的子空间的任意族的交集本身也是一个子空间。向量空间的零向量记为
  \(0\)，向量空间的零子空间记为 \(\{0\}\)。零向量空间也记为 \(\{0\}\)，它是仅由零向量组成的向量空间。我们通常会避免对零向量空间进行显式考虑。关于向量空间的大多数结果要么直接适用于零向量空间，要么在对定义和证明做少量修改后即可适用。细节通常留给读者。


  **例 1.1.1.** 设 \(V\) 和 \(W\) 为向量空间。沿用第 B.5 节和第 B.6 节，我们用 \(\operatorname{Lin}(V,W)\)
  表示从 \(V\) 到 \(W\) 的线性映射的向量空间，其中加法和标量乘法定义如下：对于所有映射 \(A,B\) 在 \(\operatorname{Lin}(V,W)\)
  中以及所有实数 \(c\)，


  \[

  (A+B)(v)=A(v)+B(v)

  \]


  并且


  \[

  (cA)(v)=cA(v)

  \]


  对于所有向量 \(v\) 在 \(V\) 中。\(\operatorname{Lin}(V,W)\) 的零元记为 \(0\)，它是零映射，即将 \(V\) 中的所有向量映射到
  \(W\) 中的零向量 \(0\) 的映射。当 \(V=W\) 时，我们通过定义乘法为映射的复合使 \(\operatorname{Lin}(V,V)\) 成为一个环：对于所有映射
  \(A,B\) 在 \(\operatorname{Lin}(V,V)\) 中，令


  \[

  (A\circ B)(v)=A(B(v))

  \]


  对于所有向量 \(v\) 在 \(V\) 中。环 \(\operatorname{Lin}(V,V)\) 的单位元是 \(V\) 上的恒等映射，记为 \(\mathrm{id}_V\)。


  向量空间 \(V\) 中向量的线性组合定义为形如 \(a^1v_1+\cdots+a^kv_k\) 的有限和，其中 \(a^1,\ldots,a^k\) 为实数，\(v_1,\ldots,v_k\)
  为 \(V\) 中的向量。不排除 \(a^1,\ldots,a^k\) 中某些或全部等于零的可能性。


  让我们在此暂停一下，对记号的一个方面做一下说明。遵循微分几何中的通常约定，我们用上标和下标分别对线性组合中的标量和向量进行索引。这为爱因斯坦求和约定打开了大门，根据该约定，例如
  \(a^1v_1+\cdots+a^kv_k\) 和 \(\sum_{i=1}^k a^i v_i\) 被简写为 \(a^i v_i\)。其逻辑是，当一个表达式中上标和下标相同时，就理解为该指标在求和。尽管这种记号在涉及多个指标时具有潜在的优势，但这里不会采用爱因斯坦求和约定。


  设 \(S\) 为 \(V\) 的一个非空且不一定有限的子集。\(S\) 的张成记为 \(\operatorname{span}(S)\) 并定义为 \(S\)
  中向量的线性组合的集合：


  \[

  \operatorname{span}(S)=\{a^1v_1+\cdots+a^kv_k : a^1,\ldots,a^k\in\mathbb{R};\ v_1,\ldots,v_k\in
  S;\ k=1,2,\ldots\}.

  \]


  对于 \(V\) 中的向量 \(v\)，令我们记


  \[

  \operatorname{span}(\{v\})=\{av: a\in\mathbb{R}\}

  \]


  为 \(\mathbb{R}v\)。


  例如，在 \(\mathbb{R}^2\) 中，我们有


  \[

  \operatorname{span}(\{(1,0),(0,1)\})=\mathbb{R}^2

  \]


  并且


  \[

  \operatorname{span}(\{(1,0)\})=\mathbb{R}(1,0)=\{(a,0)\in\mathbb{R}^2: a\in\mathbb{R}\}.

  \]


  很容易证明 \(\operatorname{span}(S)\) 是 \(V\) 的一个子空间。事实上，\(\operatorname{span}(S)\) 是包含
  \(S\) 的 \(V\) 的最小子空间，其含义是 \(V\) 的任何包含 \(S\) 的子空间也包含 \(\operatorname{span}(S)\)。当
  \(\operatorname{span}(S)=V\) 时，称 \(S\) 张成 \(V\) 或称 \(S\) 中的向量张成 \(V\)，并且 \(V\) 中的每个向量都在
  \(S\) 的张成中。


  我们称 \(S\) 线性无关或称 \(S\) 中的向量线性无关，如果使之等于零向量的 \(S\) 中不同向量的唯一线性组合是所有系数都等于 \(0\) 的组合。也就是说，如果
  \(v_1,\ldots,v_k\) 是 \(S\) 中不同的向量，\(a^1,\ldots,a^k\) 是实数，使得 \(a^1v_1+\cdots+a^kv_k=0\)，则
  \(a^1=\cdots=a^k=0\)。显然，线性无关集的任意子集也是线性无关的。当 \(S\) 不是线性无关时，称其为 **线性相关**。特别地，任意向量空间中的零向量是线性相关的。作为进一步的例子，\(\mathbb{R}^2\)
  中的向量 \((1,0),(0,1)\) 是线性无关的，而 \((0,0),(1,0)\) 和 \((1,0),(2,0)\) 是线性相关的。


  下一个结果表明，当线性无关集不张成一个向量空间时，它具有线性无关的 **扩张**。


  **定理 1.1.2.** 设 \(V\) 为向量空间，\(S\) 为 \(V\) 的非空子集使得 \(\operatorname{span}(S)\ne V\)，且
  \(v\) 为 \(V\setminus\operatorname{span}(S)\) 中的向量。则 \(S\) 线性无关当且仅当 \(S\cup\{v\}\)
  线性无关。


  *证明.* \((\Rightarrow)\): 假设 \(av+b^1s_1+\cdots+b^ks_k=0\) 对于 \(S\) 中不同的向量 \(s_1,\ldots,s_k\)
  以及实数 \(a,b^1,\ldots,b^k\) 成立。则 \(a=0\)；否则


  \[

  v=-\left[\left(\frac{b^1}{a}\right)s_1+\cdots+\left(\frac{b^k}{a}\right)s_k\right],

  \]


  于是 \(v\) 在 \(\operatorname{span}(S)\) 中，这是一个矛盾。因此，\(b^1s_1+\cdots+b^ks_k=0\)，由于
  \(S\) 线性无关，我们有 \(b^1=\cdots=b^k=0\)。


  \((\Leftarrow)\): 如上所述，线性无关集的任意子集都是线性无关的。


  向量空间 \(V\) 的一个不一定有限的子集 \(\mathcal{H}\) 称为 \(V\) 的 **无序基**，如果它张成 \(V\) 且线性无关。


  **定理 1.1.3.** 如果 \(V\) 是向量空间且 \(\mathcal{H}\) 是 \(V\) 的无序基，则 \(V\) 中的每个向量都可以唯一地表示为
  \(\mathcal{H}\) 中向量的线性组合，唯一性仅限于项的顺序。


  *证明.* 由于 \(\mathcal{H}\) 张成 \(V\)，\(V\) 中的每个向量都可以表示为 \(\mathcal{H}\) 中向量的线性组合。假设
  \(V\) 中的向量 \(v\) 可以用两种方式表示为线性组合。设 \(h_1,\ldots,h_k\) 为线性组合中不同的向量。则


  \[

  v=a_1h_1+\cdots+a_kh_k \qquad\text{并且}\qquad v=b_1h_1+\cdots+b_kh_k,

  \]


  对于某些实数 \(a_1,\ldots,a_k,b_1,\ldots,b_k\)，于是


  \[

  (a_1-b_1)h_1+\cdots+(a_k-b_k)h_k=0.

  \]


  由于 \(\mathcal{H}\) 线性无关，\(a_i-b_i=0\) 对 \(i=1,\ldots,k\) 成立。


  **定理 1.1.4.** 设 \(V\) 为向量空间，\(S\) 和 \(T\) 为 \(V\) 的非空子集，其中 \(S\) 线性无关，且 \(T\) 有限并张成
  \(V\)。则 \(S\) 有限且 \(\operatorname{card}(S)\le\operatorname{card}(T)\)，其中 \(\operatorname{card}\)
  表示基数。


  *证明.* 由于 \(S\) 线性无关，它不包含零向量。设 \(\operatorname{card}(T)=m\) 且 \(T=\{t_1,\ldots,t_m\}\)。我们分步进行。对于第一步，设
  \(s_1\) 为 \(S\) 中的向量。由于 \(V=\operatorname{span}(T)\)，\(s_1\) 是 \(t_1,\ldots,t_m\)
  的线性组合。因为 \(s_1\) 不是零向量，线性组合中至少有一个系数非零。若必要则重新编号 \(t_1,\ldots,t_m\)，假设它是 \(t_1\) 的系数，并令
  \(S_1=\{s_1,t_2,\ldots,t_m\}\)。则 \(t_1\) 可以表示为 \(S_1\) 中向量的线性组合，于是 \(V=\operatorname{span}(S_1)\)。对于第二步，设
  \(s_2\) 为 \(S\setminus\{s_1\}\) 中的向量。由于 \(V=\operatorname{span}(S_1)\)，\(s_2\) 是
  \(s_1,t_2,\ldots,t_m\) 的线性组合。因为 \(s_1,s_2\) 线性无关，\(t_2,\ldots,t_m\) 的系数中至少有一个非零。若必要则重新编号
  \(t_2,\ldots,t_m\)，假设它是 \(t_2\) 的系数，并令 \(S_2=\{s_1,s_2,t_3,\ldots,t_m\}\)。则 \(t_2\)
  可以表示为 \(S_2\) 中向量的线性组合，于是 \(V=\operatorname{span}(S_2)\)。以此类推，经过 \(k\le m\) 步后，我们得到集合
  \(S_k=\{s_1,\ldots,s_k,t_{k+1},\ldots,t_m\}\)，且 \(V=\operatorname{span}(S_k)\)。则
  \(\operatorname{card}(S)\le\operatorname{card}(T)\)；否则在第 \(m\) 步时，我们将有 \(S_m=\{s_1,\ldots,s_m\}\)，且
  \(V=\operatorname{span}(S_m)\) 且 \(S\setminus S_m\) 非空。则 \(S\setminus S_m\) 中的任意向量都可以表示为
  \(S_m\) 中向量的线性组合，这与 \(S\) 线性无关的假设矛盾。


  我们称向量空间为有限维的，如果它具有有限的无序基。有限维向量空间具有一个相关联的不变量，正如我们将看到的，它在很大程度上刻画了它们。


  **定理 1.1.5.** 如果 \(V\) 是有限维向量空间，则 \(V\) 的每个无序基都有相同有限数量的向量。该不变量记为 \(\dim(V)\)，称为
  \(V\) 的维数。


  *证明.* 设 \(\mathcal{H}\) 和 \(F\) 为 \(V\) 的基，且 \(F\) 有限。根据定理 1.1.4，\(\mathcal{H}\)
  有限且 \(\operatorname{card}(\mathcal{H})\le\operatorname{card}(F)\)。则 \(\mathcal{H}\)
  有限，于是再次使用定理 1.1.4 得到 \(\operatorname{card}(F)\le\operatorname{card}(\mathcal{H})\)。因此，\(\operatorname{card}(\mathcal{H})=\operatorname{card}(F)\)。


  为完整起见，我们将零向量空间赋予维数 \(0\)：


  \[

  \dim(\{0\})=0.

  \]


  **定理 1.1.6.** 如果 \(V\) 是维数为 \(m\) 的向量空间，则：


  - (a) 张成 \(V\) 的 \(V\) 的每个子集都包含至少 \(m\) 个向量。

  - (b) \(V\) 的每个线性无关子集都包含至多 \(m\) 个向量。


  *证明.* (a): 设 \(\mathcal{H}\) 为 \(V\) 的无序基，假设 \(T\) 为张成 \(V\) 的 \(V\) 的子集。若 \(T\)
  无限则结果是平凡的，故假设其有限。则定理 1.1.4 和定理 1.1.5 给出 \(m=\operatorname{card}(\mathcal{H})\le\operatorname{card}(T)\)。


  (b): 假设 \(S\) 为 \(V\) 的线性无关子集。则定理 1.1.4 和定理 1.1.5 推出 \(\operatorname{card}(S)\le\operatorname{card}(\mathcal{H})=m\)。


  **定理 1.1.7.** 设 \(V\) 为维数为 \(m\) 的向量空间，\(U\) 为 \(V\) 的子空间。则：


  - (a) \(U\) 是有限维的且 \(\dim(U)\le\dim(V)\)。






  +   (b) *若 dim(U) = dim(V)，则 U = V。*

  +   (c) *若 dim(U) < dim(V)，则 U 的任意无序基都可以扩充为 V 的无序基。也就是说，给定 U 的无序基 {h₁, …, hₖ}，存在
  V 中的向量 hₖ₊₁, …, hₘ，使得 {h₁, …, hₖ, hₖ₊₁, …, hₘ} 是 V 的无序基。*


  *证明.* (a)：我们分步进行。对于第一步，设 u₁ 是 U 中的一个向量。若 span({u₁}) = U，则完成。若不然，对于第二步，设 u₂ 是 U\span({u₁})
  中的一个向量。根据定理 1.1.2 可知 u₁, u₂ 线性无关。若 span({u₁, u₂}) = U，则完成，依此类推。根据定理 1.1.6(b)，该过程在
  k ≤ m 步后结束。然后 u₁, …, uₖ 线性无关且张成 U，也就是说 {u₁, …, uₖ} 是 U 的无序基。


  (b)：设 ℋ 和 ℱ 分别是 U 和 V 的基，且假设 U ≠ V。由于 U = span(ℋ)，存在 V\span(ℋ) 中的向量 v。根据定理 1.1.2，ℋ
  ∪ {v} 线性无关。我们由定理 1.1.5 得到


  card(ℋ ∪ {v}) > card(ℋ) = dim(U) = dim(V) = card(ℱ)，


  这与定理 1.1.6(b) 矛盾。


  (c)：给定 U 的无序基 {h₁, …, hₖ}，可在第 (a) 部分描述的算法用于找到 V 中的向量 hₖ₊₁, …, hₘ，使得 {h₁, …, hₖ,
  hₖ₊₁, …, hₘ} 是 V 的无序基。□


  ## 在第一部分余下的内容中，除非另有说明，所有向量空间都是有限维的。


  设 V 是一个向量空间，且 {h₁, …, hₘ} 是 V 的一个无序基。m-元组 (h₁, …, hₘ) 称为 V 的一个有序基，任何通过置换 h₁, …,
  hₘ 而得到的 m-元组也是如此。例如，(h₁, h₂, …, hₘ) 和 (h₂, h₁, …, hₘ) 是 V 的两个不同的有序基。


  ## 例 1.1.8 (ℝᵐ)。设 eᵢ 是 ℝᵐ 中的向量定义为


  eᵢ = (0, …, 0, 1, 0, …, 0)，


  其中 1 在第 i 个位置，0 在其他位置，i = 1, …, m。对于实数 a¹, …, aᵐ，我们有


  a¹ e₁ + ⋯ + aᵐ eₘ = (a¹, …, aᵐ)，


  由此可知 e₁, …, eₘ 张成 ℝᵐ 且线性无关。我们称 {e₁, …, eₘ} 为 ℝᵐ 的标准无序基，称 (e₁, …, eₘ) 为 ℝᵐ 的标准有序基。因此，不出所料，ℝᵐ
  的维数为 m。◇


  ## 在第一部分余下的内容中，除非另有说明，所有基都是有序的。


  由此可知 A 是唯一的。


  存在性。设我们定义 A : V ⟶ W 使用 (1.1.1) 对 V 中的所有向量 v。m-元组 (a¹, ..., aᵐ) 的唯一性保证了 A 是良定义的。显然，A(H)
  = (w₁, ..., wₘ)。设 u = b¹h₁ + ⋯ + bᵐhₘ 是 V 中的一个向量，设 c 为实数。则


  cv + u = (ca¹ + b¹)h₁ + ⋯ + (caᵐ + bᵐ)hₘ，


  故


  A(cv + u) = (ca¹ + b¹)A(h₁) + ⋯ + (caᵐ + bᵐ)A(hₘ) = (ca¹ + b¹)w₁ + ⋯ + (caᵐ + bᵐ)wₘ
  = c(a¹w₁ + ⋯ + aᵐwₘ) + (b¹w₁ + ⋯ + bᵐwₘ) = cA(v) + A(u)。


  因此，A 是线性的。


  从线性结构的观点看，同构的向量空间是不可区分的。事实上，利用定理 1.1.10 很容易证明所有 m 维向量空间都是同构的。更进一步，它们都同构于 ℝᵐ。利用定理
  1.1.10 构造的同构依赖于向量空间的基的选择。然而，我们将在第 1.2 节看到一个例子，其中同构可以在不诉诸这种任意选择的情况下定义。


  设 V 和 W 为向量空间，且 A : V ⟶ W 为线性映射。A 的核定义为


  ker(A) = {v ∈ V : A(v) = 0}，


  A 的像由


  im(A) = {A(v) ∈ W : v ∈ V}。


  很容易证明 ker(A) 是 V 的子空间，且 im(A) 是 W 的子空间。A 的零度定义为


  null(A) = dim(ker(A))，


  A 的秩由


  rank(A) = dim(im(A))。


  线性映射的零度和秩满足一个重要的恒等式。


  ## 定理 1.1.11 (秩-零度定理)。若 V 和 W 为向量空间且 A : V ⟶ W 为线性映射，则


  dim(V) = rank(A) + null(A)。 (1.1.2)


  **证明.** 根据定理 1.1.7(c)，ker(A) 的任意基 $(h_1,\ldots,h_k)$ 可以扩充为 V 的基 $(h_1,\ldots,h_k,h_{k+1},\ldots,h_m)$。我们断言
  $(A(h_{k+1}),\ldots,A(h_m))$ 是 $\operatorname{im}(A)$ 的基。设 v 是 V 中的向量。由于 $\mathcal
  H$ 张成 V，我们有 $v=a^1h_1+\cdots+a^mh_m$ 对于某些实数 $a^1,\ldots,a^m$。则


  $$A(v)=a^1A(h_1)+\cdots+a^kA(h_k)+a^{k+1}A(h_{k+1})+a^mA(h_m)$$

  $$=a^{k+1}A(h_{k+1})+a^mA(h_m)，$$


  故 $A(h_{k+1}),\ldots,A(h_m)$ 张成 $\operatorname{im}(A)$。假设


  $$c^{k+1}A(h_{k+1})+\cdots+c^mA(h_m)=0$$


  对于某些实数 $c^{k+1},\ldots,c^m$。则 $A(c^{k+1}h_{k+1}+\cdots+c^mh_m)=0$，所以 $c^{k+1}h_{k+1}+\cdots+c^mh_m$
  在 $\ker(V)$ 中。由于 $h_1,\ldots,h_k$ 张成 $\ker(A)$，存在实数 $b^1,\ldots,b^k$ 使得


  $$b^1h_1+\cdots+b^kh_k=c^{k+1}h_{k+1}+\cdots+c^mh_m，$$


  故


  $$b^1h_1+\cdots+b^kh_k+(-c^{k+1})h_{k+1}+\cdots+(-c^m)h_m=0。$$


  由 $h_1,\ldots,h_k,h_{k+1},\ldots,h_m$ 的线性无关性，可得 $c^{k+1}=\cdots=c^m=0$。因此，$A(h_{k+1}),\ldots,A(h_m)$
  线性无关。这证明了断言。由此可得


  $$\operatorname{rank}(A)=\dim(\operatorname{im}(A))=m-k=\dim(V)-\dim(\ker(A))$$

  $$=\dim(V)-\operatorname{null}(A)。$$


  作为秩-零度恒等式的一个例子，考虑线性映射 $A:\mathbb R^3\longrightarrow\mathbb R^2$ 给出 $A(x,y,z)=(x+y,0)$。则


  $$\ker(A)=\{(x,y,z)\in\mathbb R^3:x+y=0\}$$


  且


  $$\operatorname{im}(A)=\{(x,y)\in\mathbb R^2:y=0\}。$$


  在几何术语中，$\ker(A)$ 是 $\mathbb R^3$ 中的一个平面，$\operatorname{im}(A)$ 是 $\mathbb R^2$ 中的一条直线。因此，$\operatorname{null}(A)=2$
  且 $\operatorname{rank}(A)=1$，这与定理 1.1.11 一致。


  在定理 1.1.11 的记号中，我们由 (1.1.2) 观察到 $\operatorname{rank}(A)\leq\dim(V)$。因此，线性映射至多“保持”维数，但永远不会增加它。


  ## **定理 1.1.12。**


  *若 $V$ 和 $W$ 为向量空间且 $A:V\longrightarrow W$ 为线性映射，则以下条件等价：*


  -   (a) $\operatorname{rank}(A)=\dim(V)$。

  -   (b) $\operatorname{null}(A)=0$。

  -   (c) $\ker(A)=\{0\}$。

  -   (d) $A$ 是单射。


  证明。 (a) ⇔ (b) ⇔ (c)：根据定理 1.1.11，


  rank(A) = dim(V)

  ⇔ null(A) = 0

  ⇔ dim(ker(A)) = 0

  ⇔ ker(A) = {0}。


  (c) ⇒ (d)：对于 V 中的向量 v, w，我们有


  A(v) = A(w)

  ⇔ A(v − w) = 0

  ⇔ v − w 在 ker(A) 中

  ⇒ v − w = 0。


  (d) ⇒ (c)：显然，0 在 ker(V) 中。对于 V 中的向量 v，我们有


  v 在 ker(A) 中

  ⇔ A(v) = 0

  ⇔ A(v) = A(0)

  ⇒ v = 0。


  ## 定理 1.1.13。设 V 和 W 为向量空间，设 ℋ 为 V 的基，且 A : V ⟶ W 为线性映射。则：


  -   (a) A 是线性同构当且仅当 A(ℋ) 是 W 的基。

  -   (b) 若 A 是线性同构，则 dim(V) = dim(W)。


  证明。设 ℋ = (h₁, …, hₘ)。


  (a)(⇒)：由于 A 是满射，对于 W 中的每个向量 w，存在 V 中的向量 v 使得 A(v) = w。设 v = a¹h₁ + ⋯ + aᵐhₘ 对于某些实数
  a¹, …, aᵐ。则


  w = A(v) = a¹ A(h₁) + ⋯ + aᵐ A(hₘ)，


  所以 A(ℋ) 张成 W。假设 b¹A(h₁) + ⋯ + bᵐA(hₘ) = 0 对于某些实数 b¹, …, bᵐ。则 A(b¹h₁ + ⋯ + bᵐhₘ)
  = 0，故 b¹h₁ + ⋯ + bᵐhₘ 在 ker(A) 中。由于 A 是单射，根据定理 1.1.12 可知 b¹h₁ + ⋯ + bᵐhₘ = 0，故 b¹
  = ⋯ = bᵐ = 0。因此，A(ℋ) 线性无关。


  (a)(⇐)：设 w 是 W 中的向量。由于 A(ℋ) 张成 W，我们有 w = b¹A(h₁) + ⋯ + bᵐA(hₘ) 对于某些实数 b¹, …, bᵐ。则
  w = A(b¹h₁ + ⋯ + bᵐhₘ)，所以 A 是满射。设 v = a¹h₁ + ⋯ + aᵐhₘ 是 ker(A) 中的向量。则 0 = A(v) =
  a¹A(h₁) + ⋯ + aᵐA(hₘ)。由于 A(ℋ) 线性无关，可知 a¹ = ⋯ = aᵐ = 0，所以 v = 0。因此，ker(A) = {0}。根据定理
  1.1.12，A 是单射。


  (b)：这由第 (a) 部分得出。


  我们在此暂停一下，评论一下当方程或其他类型的显示跨越文本的几行时证明的呈现方式。诸如方程编号、定理编号、例题编号等逻辑步骤的必要依据，通常在相应行的末尾以方括号提供。为了节省空间，“[Theorem
  x.y.z]”和 “[Example x.y.z]”被缩写为 “[Th x.y.z]”和 “[Ex x.y.z]”。下一个结果的证明说明了这些惯例。


  ## 定理 1.1.14。若 V 和 W 为维数为 m 的向量空间且 A : V ⟶ W 为线性映射，则以下条件等价：


  -   (a) A 是线性同构。

  -   (b) A 是单射。

  -   (c) A 是满射。

  -   (d) rank(A) = m。


  证明。 (a) ⇒ (b)：这是由定义可知。


  (b) ⇔ (c)：根据定理 1.1.11，


  dim(W) = dim(V) = rank(A) + null(A) = dim(im(A)) + null(A)，


  故


  W = im(A)

  ⇔ null(A) = 0 [Th 1.1.7(b)]

  ⇔ A 是单射。 [Th 1.1.12]


  (c) ⇒ (a)：由于 A 是满射，我们由 (b) ⇔ (c) 可知 A 也是单射。


  (d) ⇔ (b)：这由定理 1.1.12 可知。


  设 V 为向量空间，且 U₁,…,Uₖ 为子空间。U₁,…,Uₖ 的和记为 U₁ + ⋯ + Uₖ 并定义为


  U₁ + ⋯ + Uₖ = {u₁ + ⋯ + uₖ : u₁ ∈ U₁,…, uₖ ∈ Uₖ}。


  例如，ℝ(1,0) + ℝ(0,1) = ℝ²。很容易证明


  U₁ + ⋯ + Uₖ = span(U₁ ∪ ⋯ ∪ Uₖ)，


  由此可知 U₁ + ⋯ + Uₖ 是包含 U₁,…,Uₖ 的最小子空间，在意义上任何包含 U₁,…,Uₖ 的子空间也包含 U₁ + ⋯ + Uₖ。我们观察到


  U₁ + ⋯ + Uₖ + {0} = U₁ + ⋯ + Uₖ，


  这表明添加零向量空间不会改变和。对于 V 中的向量 v₁,…,vₖ，我们有以下关于张成和和的联系：


  span({v₁,…,vₖ}) = ℝv₁ + ⋯ + ℝvₖ。






  ## 定理 1.1.15. 若 V 是一个向量空间，且 U₁ 和 U₂ 是 V 的子空间，则


  dim(U₁ + U₂) = dim(U₁) + dim(U₂) − dim(U₁ ∩ U₂).


  证明. 设 ℋ = (h₁, …, hₖ) 是 U₁ ∩ U₂ 的一个基. 根据定理 1.1.7(c)，ℋ 可扩充为 U₁ 的基 (h₁, …, hₖ, f₁,
  …, fₘ)，也可扩充为 U₂ 的基 (h₁, …, hₖ, g₁, …, gₙ). 设


  𝒱 = {h₁, …, hₖ, f₁, …, fₘ, g₁, …, gₙ}.


  我们断言 𝒱 是 U₁ + U₂ 的基. 显然，𝒱 张成 U₁ + U₂. 为证明 𝒱 线性无关，设


  (a¹ h₁ + ⋯ + aᵏ hₖ) + (b¹ f₁ + ⋯ + bᵐ fₘ) + (c¹ g₁ + ⋯ + cⁿ gₙ) = 0


  对某些实数 a¹, …, aᵏ, b¹, …, bᵐ, c¹, …, cⁿ 成立. 则


  c¹ g₁ + ⋯ + cⁿ gₙ = −(a¹ h₁ + ⋯ + aᵏ hₖ) − (b¹ f₁ + ⋯ + bᵐ fₘ). (1.1.3)


  由于 h₁, …, hₖ, f₁, …, fₘ 属于 U₁，故 c¹ g₁ + ⋯ + cⁿ gₙ 也属于 U₁，而因为 g₁, …, gₙ 属于 U₂，故 c¹
  g₁ + ⋯ + cⁿ gₙ 也属于 U₂. 因此，c¹ g₁ + ⋯ + cⁿ gₙ 属于 U₁ ∩ U₂，故


  c¹ g₁ + ⋯ + cⁿ gₙ = d¹ h₁ + ⋯ + dᵏ hₖ


  对某些实数 d¹, …, dᵏ 成立，于是


  (−d¹) h₁ + ⋯ + (−dᵏ) hₖ + c¹ g₁ + ⋯ + cⁿ gₙ = 0.


  ## 1.2 对偶空间


  设 V1, …, Vk 为向量空间. 按照第 B.5 节，我们将 V1 × ⋯ × Vk 构成一个向量空间，称为 V1, …, Vk 的乘积，具体如下：对所有向量
  (v1, …, vk), (w1, …, wk) ∈ V1 × ⋯ × Vk 及所有实数 c，令


  (v1, …, vk) + (w1, …, wk) = (v1 + w1, …, vk + wk)


  且


  c(v1, …, vk) = (cv1, …, cvk).


  当 V1 = ⋯ = Vk = V 时，我们记


  V × ⋯ × V 为 V^k.


  本节以两个具有明显几何意义的定义结束. 设 V 为向量空间. V 的子集 S 称为星形集，如果存在 S 中的向量 v0 使得对 S 中所有向量 v 及所有实数
  0 ≤ t ≤ 1，向量 tv + (1 − t)v0 属于 S. 在此情况下，我们称 S 关于 v0 是星形的. 由于 tv + (1 − t)v0 = v0
  + t(v − v0)，我们可将 {tv + (1 − t)v0 : 0 ≤ t ≤ 1} 视为连接 v0 与 v 的“线段”. V 的子集 C 称为锥形集，如果对
  C 中所有向量 v, v1, v2 及所有实数 c > 0，向量 cv 和 v1 + v2 都属于 C. 易证若 C 为锥形，则它关于其所含的任意向量都是星形的.
  例如，闭胞形 {(x, y) : x, y ∈ [−1, 1]} 在 R^2 中关于 (0, 0) 是星形的，但不是锥形的；而半平面 {(x, y) ∈ R^2
  : x > 0} 在 R^2 中是锥形的，因而关于 (0, 0) 是星形的.


  在本节中，我们定义向量空间的对偶（向量）空间. 从这一谦逊的起点出发，微分形式理论最终会涌现出来（见第 15.8 节）.


  设 V 为向量空间. 按照第 B.5 节和第 B.6 节，我们用 Lin(V, R) 表示从 V 到 R 的线性映射的向量空间. 根据定义，对所有映射 η, ζ
  ∈ Lin(V, R) 及所有实数 c，


  (η + ζ)(v) = η(v) + ζ(v)


  且


  (cη)(v) = cη(v)


  对 V 中所有向量 v 成立. 为简洁起见，以下我们记


  Lin(V, R) 为 V*.


  我们称 V* 为 V 的对偶（向量）空间，并称 V* 中的每个映射为余向量. 例如，映射 η : R^2 ⟶ R 给出为 η(x, y) = x + y 属于
  (R^2)*. 设我们记


  (V*)* 为 V**


  并称 V** 为 V 的双对偶.


  ## 定理 1.2.1.


  若 V 为向量空间且 ℋ=(h₁,…,hₘ) 为 V 的基，则：


  - (a) 存在 V* 中的唯一余向量 θⁱ 使得

  θⁱ(hⱼ)=δⁱⱼ

  对 i,j=1,…,m 成立，其中 δⁱⱼ 为克罗内克 delta.

  - (b) (θ¹,…,θᵐ) 是 V* 的基，称为对应于 ℋ 的对偶基.

  - (c) dim(V*)=dim(V).

  - (d) 对 V 中所有向量 v，

  v=∑ᵢθⁱ(v)hᵢ.

  - (e) 对 V* 中所有余向量 η，

  η=∑ᵢη(hᵢ)θⁱ.


  证明. (a): 这由定理 1.1.10 可得.


  (d): 设 v=∑ᵢ aⁱ hᵢ. 根据部分 (a)，

  θⁱ(v)=θⁱ(∑ⱼ aʲ hⱼ)=∑ⱼ aʲθⁱ(hⱼ)=aⁱ.


  (e): 对 V 中的向量 v，由部分 (d) 有

  η(v)=η(∑ᵢθⁱ(v)hᵢ)=∑ᵢθⁱ(v)η(hᵢ)=(∑ᵢη(hᵢ)θⁱ)(v).

  由于 v 是任意的，结果得证.


  (b): 由部分 (e) 可知 θ¹,…,θᵐ 张成 V*. 设 ∑ᵢ aⁱθⁱ=0 对某些实数 a¹,…,aᵐ 成立. 根据部分 (a)，

  0=(∑ⱼ aʲθʲ)(hᵢ)=∑ⱼ aʲθʲ(hᵢ)=aⁱ

  对 1=1,…,m 成立，故 θ¹,…,θᵐ 线性无关.


  (c): 这由部分 (b) 可得.


  ## 定理 1.2.2.


  设 V 为向量空间，且 ι:V⟶V** 为映射

  ι(v)(η)=η(v)  (1.2.1)

  对所有向量 v ∈ V 及所有余向量 η ∈ V* 成立. 则 ι 是线性同构：

  V≅V**.


  注. 我们注意到 ι 是在不选取 V 和 V* 的特定基的情况下定义的. 若我们记 ι(v) 为 v**，则 (1.2.1) 可更“对称”地表述为

  v**(η)=η(v).  (1.2.2)


  证明. 显然 ι 是线性映射. 设 (h₁,…,hₘ) 为 V 的基，且 (θ¹,…,θᵐ) 为其对偶基. 若 V 中的向量 v 满足 ι(v)=0，则对 V*
  中所有余向量 η 都有 η(v)=0. 特别地，θⁱ(v)=0 对 i=1,…,m 成立. 由定理 1.2.1(d) 可得 v=0，故 ker(ι)={0}.
  根据定理 1.1.12，ι 是单射. 利用定理 1.2.1(c) 两次得到


  dim(V)=dim(V*)=dim(V**).


  结果现在由定理 1.1.14 得出.


  鉴于定理 1.2.2，尤其是因为 ι 是在不选取 V 和 V* 的特定基的情况下定义的，我们采用以下约定：


  今后我们将 V** 与 V 识别，并写 V**=V.


  设 v 为 V 中的向量，η 为 V* 中的余向量. 在作出识别 V**=V 后，我们今后记


  ι(v) 为 v.


  于是，(1.2.1) 和 (1.2.2) 都变为


  v(η)=η(v).  (1.2.3)


  特别地，我们有


  hⱼ(θⁱ)=θⁱ(hⱼ)


  对 i,j=1,…,m 成立.


  ### 1.3 余向量的拉回


  在第 1.2 节中，我们引入了向量空间的对偶空间. 延续这一主题，我们现在对给定的线性映射关联其对偶空间之间的相应线性映射.


  设 V 和 W 为向量空间，且 A:V⟶W 为线性映射. 拉回由 A 定义为线性映射


  A*:W*⟶V*


  由


  A*(η)=η∘A


  对所有余向量 η ∈ W* 成立；即


  A*(η)(v)=η(A(v)).  (1.3.1)


  对所有向量 v ∈ V 成立. 我们称 A*(η) 为 η 关于 A 的拉回. 注意拉回“逆转”了向量空间的顺序. 设我们记


  (A*)* 为 A**.


  易证 U⁰ 是 V* 的子空间. 设我们记


  (U⁰)⁰ 为 U⁰⁰


  并注意到在识别 V**=V 下，U⁰⁰ 是 V 的子空间.


  ## 定理 1.4.1. 若 V 为向量空间且 U 为 V 的子空间，则


  dim(V)=dim(U)+dim(U⁰).


  证明. 若 U 为零子空间，结果是平凡的，故假设并非如此. 设 (h₁,…,hₖ) 为 U 的基. 利用定理 1.1.7(c)，我们将 (h₁,…,hₖ) 扩充为
  V 的基 (h₁,…,hₖ,hₖ₊₁,…,hₘ). 设 (θ¹,…,θᵏ,θᵏ⁺¹,…,θᵐ) 为其对偶基，于是 (θᵏ⁺¹,…,θᵐ) 为 (hₖ₊₁,…,hₘ)
  的对偶基. 由 θⁱ(h₁)=…=θⁱ(hₖ)=0 对 i=k+1,…,m 可知 θᵏ⁺¹,…,θᵐ 为 U⁰ 中的余向量. 我们断言 (θᵏ⁺¹,…,θᵐ)
  是 U⁰ 的基. 对 U⁰ 中的余向量 η，由定理 1.2.1(e) 有


  η = ∑ᵢ₌₁ᵐ η(hᵢ)θⁱ = ∑ᵢ₌ₖ₊₁ᵐ η(hᵢ)θⁱ,


  故 θᵏ⁺¹,…,θᵐ 张成 U⁰. 由于 (θ¹,…,θᵐ) 是 V* 的基，故 θᵏ⁺¹,…,θᵐ 线性无关. 这证明了断言. 根据定理 1.1.5，dim(U⁰)=m−k=dim(V)−dim(U).


  ## 定理 1.4.2. 若 V 为向量空间且 U 为 V 的子空间，则 U⁰⁰=U.


  证明. 若 u ∈ U，则 u(η)=η(u)=0 对所有 U⁰ 中的余向量 η 成立，故 u ∈ U⁰⁰. 因此，U⊆U⁰⁰. 我们有 dim(U)+dim(U⁰)=dim(V)
  [Th 1.4.1] =dim(V*) [Th 1.2.1(c)] =dim(U⁰)+dim(U⁰⁰), [Th 1.4.1] 故 dim(U)=dim(U⁰⁰).
  结果现在由定理 1.1.7(b) 得出.


  ## 定理 1.4.3. 设 V 和 W 为向量空间，且 A:V⟶W 为线性映射. 则：


  - (a) rank(A*)=rank(A).

  - (b) 若 dim(V)=dim(W)，则 null(A*)=null(A).

  - (c) ker(A*)=im(A)⁰.

  - (d) im(A*)=ker(A)⁰.






  **证明。** (c)：我们有


  $\eta$ 在 $\ker(A^*)$

  $\Leftrightarrow\quad A^*(\eta)=0$

  $\Leftrightarrow\quad A^*(\eta)(v)=0$ 对所有 $v$ 在 $V$

  $\Leftrightarrow\quad \eta(A(v))=0$ 对所有 $v$ 在 $V$ \quad [(1.3.1)]

  $\Leftrightarrow\quad \eta$ 在 $\operatorname{im}(A)^0$。


  (d)：由定理 1.3.1(c) 和部分 (c) 可得


  $$\ker(A)=\ker(A^{**})=\operatorname{im}(A^*)^0,$$


  然后由定理 1.4.2 可得


  $$\ker(A)^0=\operatorname{im}(A^*)^{00}=\operatorname{im}(A^*).$$


  (a)：我们有


  $$\begin{aligned}

  \operatorname{rank}(A^*) &= \dim(\operatorname{im}(A^*)) \\

  &= \dim(\ker(A)^0) && [\text{part (d)}]\\

  &= \dim(V)-\dim(\ker(A)) && [\text{Th 1.4.1}]\\

  &= \operatorname{rank}(A). && [\text{Th 1.1.11}]

  \end{aligned}$$


  (b)：我们有


  $$\begin{aligned}

  \operatorname{rank}(A^*)+\operatorname{null}(A^*) &= \dim(W^*) && [\text{Th 1.1.11}]\\

  &= \dim(W) && [\text{Th 1.2.1(c)}]\\

  &= \dim(V) && [\text{assumption}]\\

  &= \operatorname{rank}(A)+\operatorname{null}(A). && [\text{Th 1.1.11}]

  \end{aligned}$$


  结果现在由部分 (a) 得出。


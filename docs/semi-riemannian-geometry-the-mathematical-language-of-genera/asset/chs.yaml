  \ $(G,+)$，单位元记为 $0_G$ 或 $0$，$g$ 的逆元记为 $-g$。\n\n$G$ 的子集 $G'$ 被称为 $G$ 的 **子群** 如果：(i)\
  \ $G'$ 本身是一个群（当乘法在 $G$ 上限制到 $G'$ 时），且 (ii) $G'$ 与 $G$ 具有相同的单位元。我们说一个群是 **有限的** 如果它作为集合是有限的。\n\

  \ v₄) + a²b¹\U0001D49C(h₂, h₁, v₃, v₄) + a²b²\U0001D49C(h₂, h₂, v₃, v₄) = (a¹b²\
  \ − a²b¹)\U0001D49C(h₁, h₂, v₃, v₄)，\n\n由 [S2] 和 (6.6.2) 可得\n\n\U0001D49C(h₁, h₂,\
  \ v₃, v₄) = \U0001D49C(h₁, h₂, c¹h₁ + c²h₂, d¹h₁ + d²h₂) = c¹d¹\U0001D49C(h₁, h₂,\
  \ h₁, h₁) + c¹d²\U0001D49C(h₁, h₂, h₁, h₂) + c²d¹\U0001D49C(h₁, h₂, h₂, h₁) + c²d²\U0001D49C\
  (h₁, h₂, h₂, h₂) = −(c¹d² − c²d¹)\U0001D49C(h₁, h₂, h₂, h₁) = −(c¹d² − c²d¹)\U0001D49C\
  ̅(h₁, h₂)。\n\n因此，\n\n\U0001D49C(v₁, v₂, v₃, v₄) = −(a¹b² − a²b¹)(c¹d² − c²d¹)\U0001D49C\
  ̅(h₁, h₂)。 (6.6.5)\n\n(a) ⇒ (b)：由于 \U0001D49C 是零张量，所以 \U0001D49C̅(h₁, h₂) = \U0001D49C\
  (h₁, h₂, h₂, h₁) = 0。\n\n(b) ⇒ (a)：由于 \U0001D49C̅(h₁, h₂) = 0，由 (6.6.5) 可知 \U0001D49C\
  (v₁, v₂, v₃, v₄) = 0。因为 v₁、v₂、v₃、v₄ 是任意的，所以 \U0001D49C 是零张量。\n\n(b) ⇔ (c)：设 (f₁,\
  \ f₂) 是 V 的另一个基。令 v₁ = v₄ = f₁，v₂ = v₃ = f₂，则对 i = 1,2 有 aⁱ = dⁱ，bⁱ = cⁱ。于是 (6.6.5)\
  \ 给出\n\n\U0001D49C̅(f₁, f₂) = (a¹b² − a²b¹)²\U0001D49C̅(h₁, h₂)。 (6.6.6)\n\n由 (2.2.6)、(2.2.7)\
  \ 和定理 2.4.12，\n\n0 ≠ det([id_V]ℱℋ) = det([[a¹ b¹][a² b²]]) = a¹b² − a²b¹。\n\n结论由此得出。\n\
  \n## 定理 6.6.3. 设 (V, g) 是二维标量积空间，设 \U0001D49F 是由下式定义的函数\n\n\U0001D49F(v₁, v₂, v₃,\
  \ v₄) = det([[⟨v₁, v₃⟩ ⟨v₁, v₄⟩][⟨v₂, v₃⟩ ⟨v₂, v₄⟩]]) (6.6.7)\n\n对所有 V 中的向量 v₁、v₂、v₃、v₄\
  \ 成立。则：\n\n(a) \U0001D49F 是 \U0001D4AE(V) 中的一个非零张量，且 \U0001D49F̅ 由下式给出\n\n\U0001D49F\
  ̅(v₁, v₂) = −det([[⟨v₁, v₁⟩ ⟨v₁, v₂⟩][⟨v₂, v₁⟩ ⟨v₂, v₂⟩]])\n\n对所有 V 中的向量 v₁、v₂ 成立。\n\
  \n(b) \\(S(V)\\) 是由 \\(\\mathcal D\\) 张成的 \\(T^0_4(V)\\) 的一维子空间。\n\n**证明.** (a)：断言\
  \ \\(\\mathcal D\\) 是 \\(S(V)\\) 中的张量可由行列式的性质推出，或者更简单地从以下观察得出：\n\n\\[\\mathcal D(v_1,v_2,v_3,v_4)=\\\
  langle v_1,v_3\\rangle\\langle v_2,v_4\\rangle-\\langle v_2,v_3\\rangle\\langle\
  \ v_1,v_4\\rangle.\\]\n\n设 \\((e_1,e_2)\\) 是 \\(V\\) 的标准正交基。则\n\n\\[\\mathcal D(e_1,e_2,e_2,e_1)=-\\\
  langle e_1,e_1\\rangle\\langle e_2,e_2\\rangle\\ne 0，\\]\n\n因此 \\(\\mathcal D\\\
  ) 非零。\n\n(b)：设 \\(\\mathcal A\\) 是 \\(S(V)\\) 中的张量。由 (6.6.5) 有\n\n\\[\\mathcal A(v_1,v_2,v_3,v_4)=-(a^1b^2-a^2b^1)(c^1d^2-c^2d^1)\\\
  overline{\\mathcal A}(h_1,h_2)\\]\n\n且\n\n\\[\\mathcal D(v_1,v_2,v_3,v_4)=-(a^1b^2-a^2b^1)(c^1d^2-c^2d^1)\\\
  overline{\\mathcal D}(h_1,h_2)，\\]\n\n因此\n\n\\[\\mathcal A(v_1,v_2,v_3,v_4)=\\frac{\\\
  overline{\\mathcal A}(h_1,h_2)}{\\overline{\\mathcal D}(h_1,h_2)}\\mathcal D(v_1,v_2,v_3,v_4)，\\\
  ]\n\n其中定理 6.6.2 和 (a) 部分保证分母非零。由于 \\(v_1,v_2,v_3,v_4\\) 是任意的，\n\n\\[\\mathcal A=\\\
  frac{\\overline{\\mathcal A}(h_1,h_2)}{\\overline{\\mathcal D}(h_1,h_2)}\\mathcal\
  \ D，\\]\n\n所以 \\(\\mathcal D\\) 张成 \\(S(V)\\)。\n\n## **定理 6.6.4.** 设 (V,g) 是二维标量积空间，设\
  \ \\(\\mathcal A\\) 是 \\(S(V)\\) 中的张量，并设 \\((h_1,h_2)\\) 和 \\((f_1,f_2)\\) 是 \\\
  (V\\) 的基。则\n\n\\[\\frac{\\overline{\\mathcal A}(h_1,h_2)}{\\overline{\\mathcal D}(h_1,h_2)}=\\\
  frac{\\overline{\\mathcal A}(f_1,f_2)}{\\overline{\\mathcal D}(f_1,f_2)}.\\]\n\n\
  **证明.** 仿照定理 6.6.3 (b) 部分的证明，并将 (6.6.5) 换成 (6.6.6)，即可得到结论。\n\n\n\n\n\n这一点隐含在(7.1.1)的表述方式中。令\
  \ \\((w_1,w_2,w_3)=(v_1,v_3,v_2)\\)，由(7.1.1)可得\n\n$$\\sigma(\\mathcal A)(v_1,v_3,v_2)=\\\
  sigma(\\mathcal A)(w_1,w_2,w_3)=\\mathcal A(w_{\\sigma(1)},w_{\\sigma(2)},w_{\\\
  sigma(3)})$$\n$$=\\mathcal A(w_2,w_3,w_1)=\\mathcal A(v_3,v_2,v_1).$$\n\n在接下来的大多数计算中，指标都是按顺序排列的，从而避免了这一问题。\n\
  \n## 定理 7.1.1.\n设 $V$ 是一个向量空间，$\\sigma,\\rho$ 是 $S_s$ 中的置换，$\\mathcal A$ 是 $T_s^0(V)$\
  \ 中的一个张量。则\n\n$$(\\sigma\\rho)(\\mathcal A)=\\sigma(\\rho(\\mathcal A)).$$\n\n*证明.*\
  \ 设 $v_1,\\ldots,v_s$ 是 $V$ 中的向量，令 $(w_1,\\ldots,w_s)=(v_{\\sigma(1)},\\ldots,v_{\\\
  sigma(s)})$。则\n\n$$(\\sigma\\rho)(\\mathcal A)(v_1,\\ldots,v_s)=\\mathcal A(v_{(\\\
  sigma\\rho)(1)},\\ldots,v_{(\\sigma\\rho)(s)})=\\mathcal A(v_{\\sigma(\\rho(1))},\\\
  ldots,v_{\\sigma(\\rho(s))})$$\n$$=\\mathcal A(w_{\\rho(1)},\\ldots,w_{\\rho(s)})=\\\
  rho(\\mathcal A)(w_1,\\ldots,w_s)$$\n$$=\\rho(\\mathcal A)(v_{\\sigma(1)},\\ldots,v_{\\\
  sigma(s)})=\\sigma(\\rho(\\mathcal A))(v_1,\\ldots,v_s).$$\n\n由于 $v_1,\\ldots,v_s$\
  \ 是任意的，结论得证。\n\n我们称 $T_s^0(V)$ 中的张量 $\\mathcal A$ 是**对称的**，如果对所有 $S_s$ 中的置换 $\\\
  sigma$ 都有 $\\sigma(\\mathcal A)=\\mathcal A$；也就是说，\n\n$$\\mathcal A(v_{\\sigma(1)},\\\
  ldots,v_{\\sigma(s)})=\\mathcal A(v_1,\\ldots,v_s)$$\n\n对所有 $V$ 中的向量 $v_1,\\ldots,v_s$\
  \ 成立。我们用 $\\Sigma_s(V)$ 表示 $T_s^0(V)$ 中对称张量的集合。容易证明 $\\Sigma_s(V)$ 是 $T_s^0(V)$\
  \ 的子空间。\n\n$T_s^0(V)$ 中的张量 $\\mathcal B$ 被称为**交错的**，如果对 $S_s$ 中的所有对换 $\\tau$ 都有\
  \ $\\tau(\\mathcal B)=-\\mathcal B$，或者等价地，如果\n\n$$\\mathcal B(v_1,\\ldots,v_j,\\\
  ldots,v_i,\\ldots,v_s)=-\\mathcal B(v_1,\\ldots,v_i,\\ldots,v_j,\\ldots,v_s)$$\n\
  \n对所有 $V$ 中的向量 $v_1,\\ldots,v_s$ 以及所有 $1\\le i<j\\le s$ 成立。$T_s^0(V)$ 中交错张量的集合记为\
  \ $\\Lambda^s(V)$。不难证明 $\\Lambda^s(V)$ 是 $T_s^0(V)$ 的子空间。$\\Lambda^s(V)$ 的元素称为**s-余向量**或**多重余向量**。当\
  \ $s=1$ 时，交错性条件是空泛的，1-余向量就是余向量。因此，\n\n$$\\Lambda^1(V)=V^*.$$ \\tag{7.1.2}\n\n由于\
  \ $\\Lambda^s(V)$ 是 $T_s^0(V)$ 的子空间，$\\Lambda^s(V)$ 中的**零多重向量**正是 $T_s^0(V)$ 中的零张量。$\\\
  Lambda^s(V)$ 中的多重向量是**非零**的，当它作为 $T_s^0(V)$ 中的张量非零时。为了与(5.1.2)保持一致，我们定义\n\n$$\\\
  Lambda^0(V)=\\mathbb R.$$ \\tag{7.1.3}\n\n在这些定义下，行列式函数 $\\det:(\\operatorname{Mat}_{m\\\
  times1})^m\\to\\mathbb R$ 可看作 $\\Lambda^m(\\operatorname{Mat}_{m\\times1})$ 中的一个多重向量。\n\
  \n有几种等价的方式来刻画 $\\Lambda^s(V)$ 中的多重向量。\n\n## 定理 7.1.2.\n设 $V$ 是一个向量空间，$\\eta$ 是 $T^0_s(V)$\
  \ 中的一个张量。则以下命题等价：\n\n- (a) $\\eta$ 是 $\\Lambda^s(V)$ 中的多重向量。\n- (b) 对所有 $S_s$ 中的置换\
  \ $\\sigma$，有 $\\sigma(\\eta)=\\operatorname{sgn}(\\sigma)\\eta$。\n- (c) 如果 $v_1,\\\
  ldots,v_s$ 是 $V$ 中的向量，且其中有两个（或更多）相等，则 $\\eta(v_1,\\ldots,v_s)=0$。\n- (d) 如果 $v_1,\\\
  ldots,v_s$ 是 $V$ 中的向量，且 $\\eta(v_1,\\ldots,v_s)\\ne0$，则 $v_1,\\ldots,v_s$ 线性无关。\n\
  \n**证明.** 证明与定理 2.4.2 的证明类似。\n\n$(a)\\Rightarrow(b)$：设 $\\sigma=\\tau_1\\cdots\\\
  tau_k$ 是将 $\\sigma$ 分解为对换的分解式。由定理 7.1.1，\n\n$$\\sigma(\\eta)=(\\tau_1\\cdots\\tau_k)(\\\
  eta)=(\\tau_1\\cdots\\tau_{k-1})(\\tau_k(\\eta))$$\n$$\\qquad=(\\tau_1\\cdots\\\
  tau_{k-1})(-\\eta)=-(\\tau_1\\cdots\\tau_{k-1})(\\eta).$$\n\n再重复该过程 $k-1$ 次，得到 $\\\
  sigma(\\eta)=(-1)^k\\eta$。由定理 B.2.3，$\\operatorname{sgn}(\\sigma)=(-1)^k$。\n\n$(b)\\\
  Rightarrow(a)$：如果 $\\tau$ 是 $S_s$ 中的一个对换，则由定理 B.2.3，$\\tau(\\eta)=\\operatorname{sgn}(\\\
  tau)\\eta=-\\eta$。\n\n$(a)\\Rightarrow(c)$：如果对某个 $1\\le i<j\\le s$ 有 $v_i=v_j$，则\n\
  \n$$\\eta(v_1,\\ldots,v_i,\\ldots,v_j,\\ldots,v_s)=\\eta(v_1,\\ldots,v_j,\\ldots,v_i,\\\
  ldots,v_s).$$\n\n另一方面，由于 $\\eta$ 是交错的，\n\n$$\\eta(v_1,\\ldots,v_j,\\ldots,v_i,\\\
  ldots,v_s)=-\\eta(v_1,\\ldots,v_i,\\ldots,v_j,\\ldots,v_s).$$\n\n因此，\n\n$$\\eta(v_1,\\\
  ldots,v_i,\\ldots,v_j,\\ldots,v_s)=-\\eta(v_1,\\ldots,v_i,\\ldots,v_j,\\ldots,v_s),$$\n\
  \n由此结论得证。\n\n$(c)\\Rightarrow(a)$：对所有 $1\\le i<j\\le s$，我们有\n\n$$0=\\eta(v_1,\\\
  ldots,v_i+v_j,\\ldots,v_i+v_j,\\ldots,v_s)$$\n$$\\quad=\\eta(v_1,\\ldots,v_i,\\\
  ldots,v_i,\\ldots,v_s)+\\eta(v_1,\\ldots,v_i,\\ldots,v_j,\\ldots,v_s)$$\n$$\\quad+\\\
  eta(v_1,\\ldots,v_j,\\ldots,v_i,\\ldots,v_s)+\\eta(v_1,\\ldots,v_j,\\ldots,v_j,\\\
  ldots,v_s)$$\n$$\\quad=\\eta(v_1,\\ldots,v_i,\\ldots,v_j,\\ldots,v_s)+\\eta(v_1,\\\
  ldots,v_j,\\ldots,v_i,\\ldots,v_s),$$\n\n由此结论得证。\n\n为了证明 $(c)\\Leftrightarrow(d)$，我们将(d)部分中的断言替换为以下逻辑上等价的断言：\n\
  \n$(d')$：如果 $v_1,\\ldots,v_s$ 是 $V$ 中线性相关的向量，则 $\\eta(v_1,\\ldots,v_s)=0$。\n\n$(c)\\\
  Rightarrow(d')$：由于 $v_1,\\ldots,v_s$ 线性相关，其中一个可以表示为其余向量的线性组合，不妨设 $v_1=\\sum_{i=2}^s\
  \ a^i v_i$。则\n\n$$\\eta(v_1,\\ldots,v_s)=\\eta\\left(\\sum_{i=2}^s a^i v_i,v_2,\\\
  ldots,v_s\\right)=\\sum_{i=2}^s a^i\\eta(v_i,v_2,\\ldots,v_s).$$\n\n由于 $\\eta(v_i,v_2,\\\
  ldots,v_s)$ 在（至少）两个位置含有 $v_i$，对 $i=2,\\ldots,s$ 有 $\\eta(v_i,v_2,\\ldots,v_s)=0$。因此，$\\\
  eta(v_1,\\ldots,v_s)=0$。\n\n$(d')\\Rightarrow(c)$：如果 $v_1,\\ldots,v_s$ 中有两个（或更多）相等，则它们线性相关，所以\
  \ $\\eta(v_1,\\ldots,v_s)=0$。\n\n现在我们介绍一种将多重向量与给定张量联系起来的方法。设 $V$ 是一个向量空间。**交错映射**是如下线性映射族\n\
  \n$$\\operatorname{Alt}:\\mathcal{T}^0_s(V)\\longrightarrow\\mathcal{T}^0_s(V)$$\n\
  \n对 $s\\ge 0$ 定义为\n\n$$\\operatorname{Alt}(\\mathcal{A})=\\frac{1}{s!}\\sum_{\\\
  sigma\\in S_s}\\operatorname{sgn}(\\sigma)\\,\\sigma(\\mathcal{A}) \\tag{7.1.4}$$\n\
  \n其中 $\\mathcal{A}$ 是 $\\mathcal{T}^0_s(V)$ 中的任意张量。\n\n## 定理 7.1.3.\n设 $V$ 是一个向量空间，$\\\
  mathcal{A}$ 是 $\\mathcal{T}^0_s(V)$ 中的张量，$\\sigma$ 是 $S_s$ 中的置换，$\\eta$ 是 $\\Lambda^s(V)$\
  \ 中的多重向量。则：\n\n(a) $\\sigma(\\operatorname{Alt}(\\mathcal{A}))=\\operatorname{sgn}(\\\
  sigma)\\operatorname{Alt}(\\mathcal{A})=\\operatorname{Alt}(\\sigma(\\mathcal{A}))$。\n\
  \n(b) $\\operatorname{Alt}(\\mathcal{A})$ 是 $\\Lambda^s(V)$ 中的多重向量。\n\n(c) $\\operatorname{Alt}(\\\
  eta)=\\eta$。\n\n(d) $\\operatorname{Alt}(\\operatorname{Alt}(\\mathcal{A}))=\\operatorname{Alt}(\\\
  mathcal{A})$。\n\n(e) $\\operatorname{Alt}(\\mathcal{T}^0_s(V))=\\Lambda^s(V)$。\n\
  \n**证明.** (a)：我们有\n\n$$\\begin{aligned}\n\\sigma(\\operatorname{Alt}(\\mathcal{A}))\n\
  &=\\sigma\\left(\\frac{1}{s!}\\sum_{\\rho\\in S_s}\\operatorname{sgn}(\\rho)\\,\\\
  rho(\\mathcal{A})\\right) &&\\text{[(7.1.4)]}\\\\\n&=\\frac{1}{s!}\\sum_{\\rho\\\
  in S_s}\\operatorname{sgn}(\\rho)\\,\\sigma(\\rho(\\mathcal{A}))\\\\\n&=\\frac{1}{s!}\\\
  sum_{\\rho\\in S_s}\\operatorname{sgn}(\\rho)\\,(\\sigma\\rho)(\\mathcal{A}) &&\\\
  text{[定理 7.1.1]}\\\\\n&=\\operatorname{sgn}(\\sigma)\\frac{1}{s!}\\sum_{\\rho\\\
  in S_s}\\operatorname{sgn}(\\sigma\\rho)\\,(\\sigma\\rho)(\\mathcal{A}) &&\\text{[定理\
  \ B.2.2]}\\\\\n&=\\operatorname{sgn}(\\sigma)\\operatorname{Alt}(\\mathcal{A}),\
  \ &&\\text{[(7.1.4)]}\n\\end{aligned}$$\n\n其中最后一个等号源自这样的观察：当 $\\rho$ 遍历 $S_s$ 时，$\\\
  sigma\\rho$ 也遍历 $S_s$。我们还\n\n$$\\begin{aligned}\n\\operatorname{Alt}(\\sigma(\\\
  mathcal{A}))\n&=\\frac{1}{s!}\\sum_{\\rho\\in S_s}\\operatorname{sgn}(\\rho)\\,\\\
  rho(\\sigma(\\mathcal{A})) &&\\text{[(7.1.4)]}\\\\\n&=\\operatorname{sgn}(\\sigma)\\\
  frac{1}{s!}\\sum_{\\rho\\in S_s}\\operatorname{sgn}(\\rho\\sigma)\\,(\\rho\\sigma)(\\\
  mathcal{A}) &&\\text{[定理 7.1.1, 定理 B.2.2]}\\\\\n&=\\operatorname{sgn}(\\sigma)\\\
  operatorname{Alt}(\\mathcal{A}).\n\\end{aligned}$$\n\n其中最后一个等号的理由同上。\n\n(b)：对所有\
  \ S_s 中的对换 τ，由(a)部分可得 τ(Alt(A)) = −Alt(A)，所以 Alt(A) 是交错的。\n\n(c)：我们有\n\nAlt(η) =\
  \ 1/s! ∑_{σ∈S_s} sgn(σ) σ(η)   [(7.1.4)]\n= 1/s! ∑_{σ∈S_s} η   [定理 7.1.2(b)]\n=\
  \ η。   [基数(S_s) = s!]\n\n(d)：这由(b)和(c)部分得出。\n\n(e)：由(b)部分我们有 Alt(T_s^0(V)) ⊆ Λ^s(V)。由于\
  \ Λ^s(V) ⊆ T_s^0(V)，由(c)部分，\n\nΛ^s(V) = Alt(Λ^s(V)) ⊆ Alt(T_s^0(V))。\n\n鉴于定理 7.1.3(b)，我们可以将(7.1.4)中的映射替换为\n\
  Alt : T_s^0(V) ⟶ Λ^s(V)。\n\n## 7.2 楔积\n\n在第 5.1 节中，我们介绍了一种张量乘法，称为张量积。我们的下一个任务是为多重余向量定义相应的运算。\n\
  \n设 V 是一个向量空间。楔积是如下线性映射族\n∧ : Λ^s(V) × Λ^{s'}(V) ⟶ Λ^{s+s'}(V)\n\n对 s, s' ≥ 0 定义为\n\
  \nη ∧ ζ = (s + s')! / (s! s'!) Alt(η ⊗ ζ)   (7.2.1)\n\n对所有 Λ^s(V) 中的多重余向量 η 和 Λ^{s'}(V)\
  \ 中的多重余向量 ζ。也就是说，\n\n(η ∧ ζ)(v₁, …, v_{s+s'}) = (s + s')! / (s! s'!) [ 1/(s + s')!\
  \ ∑_{σ∈S_{s+s'}} sgn(σ) σ(η ⊗ ζ)(v_{σ(1)}, …, v_{σ(s+s')}) ] = 1/(s! s'!) ∑_{σ∈S_{s+s'}}\
  \ sgn(σ) η(v_{σ(1)}, …, v_{σ(s)}) ζ(v_{σ(s+1)}, …, v_{σ(s+s')})\n\n对所有 V 中的向量 v₁,\
  \ …, v_{s+s'}，其中第一个等号由(7.2.1)得出，第二个等号由(5.1.4)和(7.1.1)得出。\n\n\n\n\n\n## 例 7.2.1.\n\
  \n设 \\(\\eta,\\zeta\\) 是 \\(\\Lambda^1(V)=V^*\\) 中的余向量，设 \\(v_1,v_2\\) 是 \\(V\\\
  ) 中的向量。取 \\(\\mathcal{S}_2=\\{\\mathrm{id},(1\\,2)\\}\\)，我们有\n\n\\[\n(\\eta\\wedge\\\
  zeta)(v_1,v_2)=\\frac{1}{1!1!}\\sum_{\\sigma\\in\\mathcal{S}_2}\\operatorname{sgn}(\\\
  sigma)\\,\\eta(v_{\\sigma(1)})\\zeta(v_{\\sigma(2)})=\\eta(v_1)\\zeta(v_2)-\\eta(v_2)\\\
  zeta(v_1).\n\\]\n\n现在设 \\(\\eta\\) 是 \\(\\Lambda^2(V)\\) 中的多重余向量，设 \\(\\zeta\\)\
  \ 是 \\(\\Lambda^1(V)=V^*\\) 中的余向量，并设 \\(v_1,v_2,v_3\\) 是 \\(V\\) 中的向量。取\n\n\\[\n\
  \\mathcal{S}_3=\\{\\mathrm{id},(1\\,2),(1\\,3),(2\\,3),(1\\,2\\,3),(1\\,3\\,2)\\\
  },\n\\]\n\n我们有\n\n\\[\n\\begin{aligned}\n(\\eta\\wedge\\zeta)(v_1,v_2,v_3)\n&=\\\
  frac{1}{2!1!}\\sum_{\\sigma\\in\\mathcal{S}_3}\\operatorname{sgn}(\\sigma)\\,\\\
  eta(v_{\\sigma(1)},v_{\\sigma(2)})\\zeta(v_{\\sigma(3)})\\\\\n&=\\frac{1}{2}\\left[\\\
  eta(v_1,v_2)\\zeta(v_3)-\\eta(v_2,v_1)\\zeta(v_3)-\\eta(v_3,v_2)\\zeta(v_1)-\\eta(v_1,v_3)\\\
  zeta(v_2)+\\eta(v_2,v_3)\\zeta(v_1)+\\eta(v_3,v_1)\\zeta(v_2)\\right]\\\\\n&=\\\
  frac{1}{2}\\left[\\eta(v_1,v_2)\\zeta(v_3)+\\eta(v_1,v_2)\\zeta(v_3)+\\eta(v_2,v_3)\\\
  zeta(v_1)+\\eta(v_3,v_1)\\zeta(v_2)+\\eta(v_2,v_3)\\zeta(v_1)+\\eta(v_3,v_1)\\zeta(v_2)\\\
  right]\\\\\n&=\\eta(v_1,v_2)\\zeta(v_3)+\\eta(v_2,v_3)\\zeta(v_1)+\\eta(v_3,v_1)\\\
  zeta(v_2).\n\\end{aligned}\n\\]\n\n楔积在基本代数结构方面具有良好性质。\n\n## 定理 7.2.2.\n\n设 \\(V\\\
  ) 是向量空间，设 \\(\\eta,\\eta^1,\\eta^2\\) 和 \\(\\zeta,\\zeta^1,\\zeta^2\\) 分别是 \\(\\\
  Lambda^s(V)\\) 和 \\(\\Lambda^{s'}(V)\\) 中的多重余向量，设 \\(c\\) 是实数。则：\n\n- (a) \\((\\\
  eta^1+\\eta^2)\\wedge\\zeta=\\eta^1\\wedge\\zeta+\\eta^2\\wedge\\zeta\\).\n- (b)\
  \ \\(\\eta\\wedge(\\zeta^1+\\zeta^2)=\\eta\\wedge\\zeta^1+\\eta\\wedge\\zeta^2\\\
  ).\n- (c) \\((c\\eta)\\wedge\\zeta=\\eta\\wedge(c\\zeta)=c(\\eta\\wedge\\zeta)\\\
  ).\n\n证明. 直接可得。\n\n## 定理 7.2.3.\n\n如果 \\(V\\) 是向量空间，\\(\\eta\\) 和 \\(\\zeta\\) 分别是\
  \ \\(\\Lambda^s(V)\\) 和 \\(\\Lambda^{s'}(V)\\) 中的多重余向量，则：\n\n- (a) \\(\\eta\\wedge\\\
  zeta=(-1)^{ss'}\\zeta\\wedge\\eta\\).\n- (b) 若 \\(s=s'=1\\)，则 \\(\\eta\\wedge\\\
  zeta=-\\zeta\\wedge\\eta\\).\n- (c) 若 \\(s=1\\)，则 \\(\\eta\\wedge\\eta=0\\).\n\n\
  证明. (a)：设 \\(v_1,\\dots,v_{s+s'}\\) 是 \\(V\\) 中的向量，定义 \\(\\mathcal{S}_{s+s'}\\)\
  \ 中的置换 \\(\\sigma\\) 为\n\n\\[\n\\sigma=\n\\begin{pmatrix}\n1 & \\cdots & s & s+1\
  \ & \\cdots & s+s'\\\\\ns'+1 & \\cdots & s'+s & 1 & \\cdots & s'\n\\end{pmatrix}.\n\
  \\]\n\n我们有\n\n\\[\n\\begin{aligned}\n\\sigma(\\eta\\otimes\\zeta)(v_1,\\dots,v_{s+s'})\n\
  &=\\eta\\otimes\\zeta(v_{\\sigma(1)},\\dots,v_{\\sigma(s)},v_{\\sigma(s+1)},\\dots,v_{\\\
  sigma(s+s')})\\\\\n&=\\eta\\otimes\\zeta(v_{s'+1},\\dots,v_{s'+s},v_1,\\dots,v_{s'})\\\
  \\\n&=\\eta(v_{s'+1},\\dots,v_{s'+s})\\,\\zeta(v_1,\\dots,v_{s'})\\\\\n&=\\zeta(v_1,\\\
  dots,v_{s'})\\,\\eta(v_{s'+1},\\dots,v_{s'+s})\\\\\n&=\\zeta\\otimes\\eta(v_1,\\\
  dots,v_{s'},v_{s'+1},\\dots,v_{s+s'}).\n\\end{aligned}\n\\]\n\n由于 \\(v_1,\\dots,v_{s+s'}\\\
  ) 是任意的，所以 \\(\\sigma(\\eta\\otimes\\zeta)=\\zeta\\otimes\\eta\\)。于是\n\n\\[\n\\operatorname{Alt}(\\\
  zeta\\otimes\\eta)\n=\\operatorname{Alt}(\\sigma(\\eta\\otimes\\zeta))\n=\\operatorname{sgn}(\\\
  sigma)\\operatorname{Alt}(\\eta\\otimes\\zeta)\\quad[\\text{定理 7.1.3(a)}]\n=(-1)^{ss'}\\\
  operatorname{Alt}(\\eta\\otimes\\zeta),\\quad[\\text{定理 B.2.4}]\n\\]\n\n因此\n\n\\\
  [\n\\eta\\wedge\\zeta\n=\\frac{(s+s')!}{s!s'!}\\operatorname{Alt}(\\eta\\otimes\\\
  zeta)\n=(-1)^{ss'}\\frac{(s'+s)!}{s'!s!}\\operatorname{Alt}(\\zeta\\otimes\\eta)\n\
  =(-1)^{ss'}\\zeta\\wedge\\eta.\n\\]\n\n- (b)：由 (a) 部分可得。\n- (c)：由 (b) 部分可得。\n\n\
  ## 定理 7.2.4.\n\n设 \\(V\\) 是向量空间，\\(\\mathcal{A}\\) 和 \\(\\mathcal{B}\\) 分别是 \\(\\\
  Lambda^s(V)\\) 和 \\(\\Lambda^{s'}(V)\\) 中的多重余向量，则\n\n\\[\n\\operatorname{Alt}(\\\
  operatorname{Alt}(\\mathcal{A})\\otimes\\mathcal{B})\n=\\operatorname{Alt}(\\mathcal{A}\\\
  otimes\\mathcal{B})\n=\\operatorname{Alt}(\\mathcal{A}\\otimes\\operatorname{Alt}(\\\
  mathcal{B})).\n\\]\n\n证明. 如下定义映射 \\(\\iota:\\mathcal{S}_s\\longrightarrow\\mathcal{S}_{s+s'}\\\
  )。对于 \\(\\mathcal{S}_s\\) 中的每个置换 \\(\\sigma\\)，令 \\(\\iota(\\sigma)\\) 为 \\(\\mathcal{S}_{s+s'}\\\
  ) 中的置换，它在 \\(\\{1,\\dots,s\\}\\) 上限制为 \\(\\sigma\\)，并固定 \\(s+1,\\dots,s+s'\\)；即\n\
  \n\\[\n\\iota(\\sigma)=\n\\begin{pmatrix}\n1 & \\cdots & s & s+1 & \\cdots & s+s'\\\
  \\\n\\sigma(1) & \\cdots & \\sigma(s) & s+1 & \\cdots & s+s'\n\\end{pmatrix}.\n\\\
  ]\n\n显然，\\(\\iota\\) 是 \\(\\mathcal{S}_s\\) 与 \\(\\mathcal{S}_{s+s'}\\) 的子群 \\(\\\
  iota(\\mathcal{S}_s)\\) 之间的群同构。容易证明\n\n\\[\n\\operatorname{sgn}(\\iota(\\sigma))=\\\
  operatorname{sgn}(\\sigma)\n\\quad\\text{and}\\quad\n\\iota(\\sigma)(\\mathcal{A}\\\
  otimes\\mathcal{B})=\\sigma(\\mathcal{A})\\otimes\\mathcal{B}. \\tag{7.2.2}\n\\\
  ]\n\n于是\n\n\\[\n\\begin{aligned}\n\\operatorname{Alt}(\\operatorname{Alt}(\\mathcal{A})\\\
  otimes\\mathcal{B})\n&=\\operatorname{Alt}\\left(\\left[\\frac{1}{s!}\\sum_{\\sigma\\\
  in\\mathcal{S}_s}\\operatorname{sgn}(\\sigma)\\sigma(\\mathcal{A})\\right]\\otimes\\\
  mathcal{B}\\right)\\quad[(7.1.4)]\\\\\n&=\\operatorname{Alt}\\left(\\frac{1}{s!}\\\
  sum_{\\sigma\\in\\mathcal{S}_s}\\operatorname{sgn}(\\sigma)\\left(\\sigma(\\mathcal{A})\\\
  otimes\\mathcal{B}\\right)\\right)\\quad[\\text{定理 5.1.2(a)}]\\\\\n&=\\frac{1}{s!}\\\
  sum_{\\sigma\\in\\mathcal{S}_s}\\operatorname{sgn}(\\sigma)\\operatorname{Alt}\\\
  left(\\sigma(\\mathcal{A})\\otimes\\mathcal{B}\\right)\\\\\n&=\\frac{1}{s!}\\sum_{\\\
  sigma\\in\\mathcal{S}_s}\\operatorname{sgn}(\\iota(\\sigma))\\operatorname{Alt}\\\
  left(\\iota(\\sigma)(\\mathcal{A}\\otimes\\mathcal{B})\\right)\\quad[(7.2.2)]\\\\\
  \n&=\\frac{1}{s!}\\sum_{\\sigma\\in\\mathcal{S}_s}\\operatorname{Alt}(\\mathcal{A}\\\
  otimes\\mathcal{B})\\quad[\\text{定理 7.1.3(a)}]\\\\\n&=\\operatorname{Alt}(\\mathcal{A}\\\
  otimes\\mathcal{B}),\\quad[\\operatorname{card}(\\mathcal{S}_s)=s!]\n\\end{aligned}\n\
  \\]\n\n这就证明了第一个等式。第二个等式的证明类似。\n\n用归纳法证明。设 \\(k\\ge 4\\)，并假设对所有小于 \\(k\\) 的指标，断言成立。则\n\
  \n\\[\n\\begin{aligned}\n(\\eta^1\\wedge\\eta^2)\\wedge\\eta^3\\wedge\\cdots\\wedge\\\
  eta^k\n&=\\frac{(s_1+s_2+s_3+\\cdots+s_k)!}{(s_1+s_2)!s_3!\\cdots s_k!}\n\\operatorname{Alt}\\\
  left((\\eta^1\\wedge\\eta^2)\\otimes\\eta^3\\otimes\\cdots\\otimes\\eta^k\\right)\\\
  \\\n&=\\frac{(s_1+s_2+s_3+\\cdots+s_k)!}{(s_1+s_2)!s_3!\\cdots s_k!}\n\\operatorname{Alt}\\\
  left(\\frac{(s_1+s_2)!}{s_1!s_2!}\\operatorname{Alt}(\\eta^1\\otimes\\eta^2)\\otimes(\\\
  eta^3\\otimes\\cdots\\otimes\\eta^k)\\right)\\\\\n&=\\frac{(s_1+\\cdots+s_k)!}{s_1!\\\
  cdots s_k!}\n\\operatorname{Alt}\\left(\\operatorname{Alt}(\\eta^1\\otimes\\eta^2)\\\
  otimes(\\eta^3\\otimes\\cdots\\otimes\\eta^k)\\right)\\\\\n&=\\frac{(s_1+\\cdots+s_k)!}{s_1!\\\
  cdots s_k!}\n\\operatorname{Alt}(\\eta^1\\otimes\\cdots\\otimes\\eta^k),\n\\end{aligned}\n\
  \\]\n\n其中第一个等式由归纳假设得出，第二个等式由 (7.2.1) 得出，最后一个等式由定理 7.2.4 得出。\n\n下一个结果说明楔积与行列式密切相关，这一点并不令人意外。\n\
  \n## 定理 7.2.8.\n\n设 \\(V\\) 是向量空间，设 \\(\\eta^1,\\dots,\\eta^s\\) 是 \\(V^*\\) 中的余向量，设\
  \ \\(v_1,\\dots,v_s\\) 是 \\(V\\) 中的向量。则\n\n\\[\n\\eta^1\\wedge\\cdots\\wedge\\eta^s(v_1,\\\
  dots,v_s)\n=\n\\det\n\\begin{pmatrix}\n\\eta^1(v_1) & \\cdots & \\eta^1(v_s)\\\\\
  \n\\vdots & \\ddots & \\vdots\\\\\n\\eta^s(v_1) & \\cdots & \\eta^s(v_s)\n\\end{pmatrix}.\n\
  \\]\n\n证明. 我们有\n\n\\[\n\\begin{aligned}\n\\eta^1\\wedge\\cdots\\wedge\\eta^s(v_1,\\\
  dots,v_s)\n&=s!\\,\\operatorname{Alt}(\\eta^1\\otimes\\cdots\\otimes\\eta^s)(v_1,\\\
  dots,v_s) && [\\text{定理 7.2.7}]\\\\\n&=\\sum_{\\sigma\\in S_s}\\operatorname{sgn}(\\\
  sigma)\\,\\sigma(\\eta^1\\otimes\\cdots\\otimes\\eta^s)(v_1,\\dots,v_s) && [(7.1.4)]\\\
  \\\n&=\\sum_{\\sigma\\in S_s}\\operatorname{sgn}(\\sigma)\\,\\eta^1\\otimes\\cdots\\\
  otimes\\eta^s(v_{\\sigma(1)},\\dots,v_{\\sigma(s)}) && [(7.1.1)]\\\\\n&=\\sum_{\\\
  sigma\\in S_s}\\operatorname{sgn}(\\sigma)\\,\\eta^1(v_{\\sigma(1)})\\cdots\\eta^s(v_{\\\
  sigma(s)})\\\\\n&=\\det([\\eta^i(v_j)]). && [(2.4.1)]\n\\end{aligned}\n\\]\n\n##\
  \ 定理 7.2.9.\n\n设 \\(V\\) 是向量空间，设 \\((h_1,\\dots,h_m)\\) 是 \\(V\\) 的基，设 \\((\\theta^1,\\\
  dots,\\theta^m)\\) 是它的对偶基。则根据定理 7.2.8，\n\n\\[\n\\theta^{j_1}\\wedge\\cdots\\wedge\\\
  theta^{j_s}(h_{i_1},\\dots,h_{i_s})\n=\n\\det\\left((\\theta^i(h_j))_{(i_1,\\dots,i_s)}^{(j_1,\\\
  dots,j_s)}\\right)\n=\n\\det\\left((I_m)_{(i_1,\\dots,i_s)}^{(j_1,\\dots,j_s)}\\\
  right).\n\\]\n\n若 \\((i_1,\\dots,i_s)=(j_1,\\dots,j_s)\\)，则 \\((I_m)_{(i_1,\\dots,i_s)}^{(j_1,\\\
  dots,j_s)}=I_s\\)；若 \\((i_1,\\dots,i_s)\\ne(j_1,\\dots,j_s)\\)，则 \\((I_m)_{(i_1,\\\
  dots,i_s)}^{(j_1,\\dots,j_s)}\\) 至少有一行（且至少有一列）为 \\(0\\)。结论得证。\n\n## 定理 7.2.10.\n\
  \n设 \\(V\\) 是向量空间，设 \\(\\eta^1,\\dots,\\eta^s\\) 是 \\(V^*\\) 中的余向量，设 \\(\\sigma\\\
  ) 是 \\(S_s\\) 中的置换。则\n\n\\[\n\\eta^{\\sigma(1)}\\wedge\\cdots\\wedge\\eta^{\\sigma(s)}\n\
  =\\operatorname{sgn}(\\sigma)\\,\\eta^1\\wedge\\cdots\\wedge\\eta^s.\n\\]\n\n证明.\
  \ 对于 \\(V\\) 中的向量 \\(v_1,\\dots,v_s\\)，我们有\n\n\\[\n\\begin{aligned}\n\\eta^{\\sigma(1)}\\\
  wedge\\cdots\\wedge\\eta^{\\sigma(s)}(v_1,\\dots,v_s)\n&=\\det\\left([\\eta^{\\\
  sigma(i)}(v_j)]\\right) && [\\text{定理 7.2.8}]\\\\\n&=\\det\\left([\\eta^{\\sigma(j)}(v_i)]\\\
  right) && [\\text{定理 2.4.5(c)}]\\\\\n&=\\operatorname{sgn}(\\sigma)\\det\\left([\\\
  eta^i(v_i)]\\right) && [\\text{定理 2.4.2}]\\\\\n&=\\operatorname{sgn}(\\sigma)\\\
  det\\left([\\eta^i(v_j)]\\right) && [\\text{定理 2.4.5(c)}]\\\\\n&=\\operatorname{sgn}(\\\
  sigma)\\,\\eta^1\\wedge\\cdots\\wedge\\eta^s(v_1,\\dots,v_s), && [\\text{定理 7.2.8}]\n\
  \\end{aligned}\n\\]\n\n其中 \\([\\eta^{\\sigma(j)}(v_i)]=([\\eta^{\\sigma(i)}(v_j)])^T\\\
  )。由于 \\(v_1,\\dots,v_s\\) 是任意的，结论得证。\n\n## 定理 7.2.11.\n\n设 \\(V\\) 是向量空间，设 \\(H=(h_1,\\\
  dots,h_m)\\) 和 \\(F\\) 是 \\(V\\) 的基，设 \\((\\varphi^1,\\dots,\\varphi^m)\\) 是对应于\
  \ \\(F\\) 的对偶基。则\n\n\\[\n\\varphi^1\\wedge\\cdots\\wedge\\varphi^m(h_1,\\dots,h_m)=\\\
  det\\left([\\mathrm{id}_V]^F_H\\right).\n\\]\n\n证明. 根据定理 1.2.1(d)，对于 \\(j=1,\\dots,m\\\
  )，有 \\(h_j=\\sum_i\\varphi^i(h_j)f_i\\)。于是由 (2.2.6) 和 (2.2.7) 得 \\([\\mathrm{id}_V]^F_H=[\\\
  varphi^i(h_j)]\\)。现在由定理 7.2.8 即得结论。\n\n## 定理 7.2.12（\\(\\Lambda^s(V)\\) 的基）.\n\n\
  设 \\(V\\) 是向量空间，设 \\((h_1,\\dots,h_m)\\) 是 \\(V\\) 的基，设 \\((\\theta^1,\\dots,\\\
  theta^m)\\) 是它的对偶基。则：\n\n- (a) 若 \\(1\\le s\\le m\\)，则\n\n  \\[\n  \\{\\theta^{i_1}\\\
  wedge\\cdots\\wedge\\theta^{i_s}:1\\le i_1<\\cdots<i_s\\le m\\}\n  \\]\n\n  是 \\\
  (\\Lambda^s(V)\\) 的一个无序基。\n\n- (b) 若 \\(s>m\\)，则 \\(\\Lambda^s(V)=\\{0\\}\\)。\n\
  - (c) \\(\\Lambda^s(V)\\) 的维数为 \\(\\binom{m}{s}\\)。\n- (d) \\(\\Lambda^m(V)\\) 中任何非零多重余向量都张成\
  \ \\(\\Lambda^m(V)\\)。\n- (e) \\((\\eta^1,\\dots,\\eta^m)\\) 是 \\(\\Lambda^{m-1}(V)\\\
  ) 的基，其中\n\n  \\[\n  \\eta^i=(-1)^{i-1}\\theta^1\\wedge\\cdots\\wedge\\widehat{\\\
  theta^i}\\wedge\\cdots\\wedge\\theta^m\n  \\]\n\n  对 \\(i=1,\\dots,m\\) 成立，且 \\\
  (\\widehat{\\theta^i}\\) 表示省略一个表达式。\n\n证明. 设\n\n\\[\n\\Omega_s=\\{\\theta^{i_1}\\\
  otimes\\cdots\\otimes\\theta^{i_s}:1\\le i_1,\\dots,i_s\\le m\\}\n\\]\n\n和\n\n\\\
  [\n\\Theta_s=\\{\\theta^{i_1}\\wedge\\cdots\\wedge\\theta^{i_s}:1\\le i_1<\\cdots<i_s\\\
  le m\\}.\n\\]\n\n则\n\n\\[\n\\begin{aligned}\n\\operatorname{span}(\\Theta_s)\n&=\\\
  operatorname{span}(\\operatorname{Alt}(\\Omega_s)) && [\\text{定理 7.2.7}]\\\\\n&=\\\
  operatorname{Alt}(\\operatorname{span}(\\Omega_s))\\\\\n&=\\operatorname{Alt}(\\\
  mathcal{T}_s^0(V)) && [\\text{定理 5.1.3(b)}]\\\\\n&=\\Lambda^s(V), && [\\text{定理\
  \ 7.1.3(e)}]\n\\end{aligned}\n\\]\n\n所以 \\(\\Theta_s\\) 对所有 \\(s\\ge1\\) 张成 \\(\\\
  Lambda^s(V)\\)。\n\n- (a)：若\n\n  \\[\n  \\sum_{1\\le i_1<\\cdots<i_s\\le m} a_{i_1\\\
  dots i_s}\\,\\theta^{i_1}\\wedge\\cdots\\wedge\\theta^{i_s}=0\n  \\]\n\n  对某些实数\
  \ \\(a_{i_1\\dots i_s}\\) 成立，则在 \\((h_{j_1},\\dots,h_{j_s})\\) 处求上述恒等式两边的值，并利用定理\
  \ 7.2.9，可得对所有 \\(1\\le j_1<\\cdots<j_s\\le m\\)，有 \\(a_{j_1\\dots j_s}=0\\)。因此，\\\
  (\\Theta_s\\) 线性无关。\n\n- (b)：由于 \\(s>m\\)，\\(\\Theta_s\\) 的每个元素都含有重复的余向量，所以由定理 7.2.6\
  \ 即得结论。\n- (c)：由 (a) 和 (b) 部分可得。\n- (d)：由 (c) 部分，\\(\\Lambda^m(V)\\) 是一维的。\n- (e)：对于\
  \ \\(s=m-1\\)，有 \\(\\Theta_{m-1}=\\{(-1)^{i-1}\\eta^i:i=1,\\dots,m\\}\\)，所以由 (a)\
  \ 部分即得结论。\n\n下一个结果的 (a) 部分是定理 1.2.1(e) 的推广。\n\n## 定理 7.2.13.\n\n设 \\(V\\) 是向量空间，设\
  \ \\(\\eta\\) 是 \\(\\Lambda^s(V)\\) 中的多重余向量，设 \\((h_1,\\dots,h_m)\\) 是 \\(V\\) 的基，设\
  \ \\((\\theta^1,\\dots,\\theta^m)\\) 是它的对偶基。则：\n\n- (a)\n\n  \\[\n  \\eta=\\sum_{1\\\
  le i_1<\\cdots<i_s\\le m}\\eta(h_{i_1},\\dots,h_{i_s})\\,\\theta^{i_1}\\wedge\\\
  cdots\\wedge\\theta^{i_s}.\n  \\]\n\n- (b) 若 \\(s=m\\)，则\n\n  \\[\n  \\eta=\\eta(h_1,\\\
  dots,h_m)\\,\\theta^1\\wedge\\cdots\\wedge\\theta^m.\n  \\]\n\n证明. (a)：根据定理 7.2.12(a)，\n\
  \n\\[\n\\eta=\\sum_{1\\le i_1<\\cdots<i_s\\le m}a_{i_1\\dots i_s}\\,\\theta^{i_1}\\\
  wedge\\cdots\\wedge\\theta^{i_s}\n\\]\n\n对某些实数 \\(a_{i_1\\dots i_s}\\) 成立。在 \\((h_{j_1},\\\
  dots,h_{j_s})\\) 处求上述恒等式两边的值，并利用定理 7.2.9，可得对所有 \\(1\\le j_1<\\cdots<j_s\\le m\\\
  )，有 \\(a_{j_1\\dots j_s}=\\eta(h_{j_1},\\dots,h_{j_s})\\)。\n\n(b)：由 (a) 部分可得。\n\n\
  \n\n\n\n## 7.3 多协向量的拉回\n\n协变张量的拉回已在第 5.2 节中简要讨论过。多协向量的相应理论则丰富得多。\n\n在继续之前，我们先暂停来考虑多指标记法，该记法在第\
  \ 2.1 节中已在矩阵的上下文中讨论过。设 \\(V\\) 为向量空间，设 \\((h_1,\\dots,h_m)\\) 为 \\(V\\) 的一组基，设 \\\
  ((\\theta^1,\\dots,\\theta^m)\\) 为其对偶基。对于整数 \\(1 \\le s \\le m\\)，设 \\(I = (i_1,\\\
  dots,i_s)\\) 为 \\(\\mathcal{I}_{s,m}\\) 中的一个多指标，并令我们记\n\n\\[\n(h_{i_1},\\dots,h_{i_s})\
  \ \\quad\\text{by}\\quad h_I\n\\]\n\n和\n\n\\[\n\\theta^{i_1}\\wedge\\cdots\\wedge\\\
  theta^{i_s} \\quad\\text{by}\\quad \\theta^I.\n\\]\n\n在此记法下，定理 7.2.12(a) 中 \\(\\\
  Lambda^s(V)\\) 的无序基可以简洁地表示为 \\(\\{\\theta^I : I \\in \\mathcal{I}_{s,m}\\}\\)，而定理\
  \ 7.2.13(a) 中的恒等式变为\n\n\\[\n\\eta = \\sum_{I\\in\\mathcal{I}_{s,m}} \\eta(h_I)\\\
  ,\\theta^I.\n\\]\n\n如果我们以某种方式对 \\(\\mathcal{I}_{s,m}\\) 进行排序，例如字典序，那么定理 7.2.12(a)\
  \ 的基 \\(\\{\\theta^I : I \\in \\mathcal{I}_{s,m}\\}\\) 也可以类似地排序，从而得到 \\(\\Lambda^s(V)\\\
  ) 的一个有序基，我们记为\n\n\\[\n(\\theta^I : I \\in \\mathcal{I}_{s,m}).\n\\]\n\n克罗内克 delta\
  \ 可以推广到多指标情形。设 \\(J = (j_1,\\dots,j_s)\\) 为 \\(\\mathcal{I}_{s,m}\\) 中的另一个多指标，并定义\n\
  \n\\[\n\\delta^J_I = \\begin{cases} 1 & \\text{if } I=J \\\\ 0 & \\text{if } I\\\
  ne J. \\end{cases}\n\\]\n\n则定理 7.2.9 中的条件恒等式就是 \\(\\theta^J(h_I)=\\delta^J_I\\)。如附录\
  \ A 中所讨论的，\\(\\mathcal{I}_{1,m}\\) 中多指标 \\((i)\\) 的补为\n\n\\[\n(i)^c = (1,\\dots,\\\
  hat{i},\\dots,m) = (1,\\dots,i-1,i+1,\\dots,m)\n\\]\n\n对于 \\(i=1,\\dots,m\\)。在此记法下，定理\
  \ 7.2.12(e) 中基的组成多协向量可以表示为 \\(\\eta^i = (-1)^{i-1}\\theta^{(i)^c}\\)。我们将在下文中发现多指标记法非常有用。\n\
  \n设 \\(V\\) 和 \\(W\\) 为向量空间，设 \\(A: V \\longrightarrow W\\) 为线性映射。由 \\(A\\) 的拉回（针对多协向量）是线性映射族\n\
  \n\\[\nA^*: \\Lambda^s(W) \\longrightarrow \\Lambda^s(V)\n\\]\n\n对 \\(s\\ge1\\)\
  \ 定义为\n\n\\[\nA^*(\\eta)(v_1,\\dots,v_s) = \\eta(A(v_1),\\dots,A(v_s)) \\tag{7.3.1}\n\
  \\]\n\n对于所有 \\(\\Lambda^s(W)\\) 中的多协向量 \\(\\eta\\) 和所有 \\(V\\) 中的向量 \\(v_1,\\dots,v_s\\\
  )。由 \\(\\eta\\) 的多线性与交替性质以及 \\(A\\) 的线性可知 \\(A^*(\\eta)\\) 在 \\(\\Lambda^s(V)\\\
  ) 中，因此定义是有意义的。我们称 \\(A^*(\\eta)\\) 为 \\(\\eta\\) 由 \\(A\\) 拉回。\n\n### 定理 7.3.1\n\
  \n设 \\(V\\) 和 \\(W\\) 为向量空间，设 \\(A: V \\longrightarrow W\\) 为线性映射，设 \\(\\eta\\)、\\\
  (\\zeta\\) 为 \\(\\Lambda^s(W)\\) 中的多协向量，设 \\(\\xi\\) 为 \\(\\Lambda^{s'}(W)\\) 中的多协向量。则：\n\
  \n- (a) \\(A^*(\\eta+\\zeta)=A^*(\\eta)+A^*(\\zeta)\\)。\n- (b) \\(A^*(\\eta\\wedge\\\
  xi)=A^*(\\eta)\\wedge A^*(\\xi)\\)。\n\n**证明。** (a) 显而易见。\n\n(b) 我们先给出一个初步结果。设 \\\
  (\\zeta^1,\\dots,\\zeta^{s+s'}\\) 为 \\(W^*\\) 中的（不一定相异）协向量。对于 \\(V\\) 中的向量 \\(v_1,\\\
  dots,v_{s+s'}\\)，我们有\n\n\\[\n\\begin{aligned}\nA^*(\\zeta^1\\wedge\\cdots\\wedge\\\
  zeta^{s+s'})(v_1,\\dots,v_{s+s'})\n&=\\bigl(\\zeta^1\\wedge\\cdots\\wedge\\zeta^{s+s'}\\\
  bigr)(A(v_1),\\dots,A(v_{s+s'}))\\\\\n&=\\det([\\zeta^i(A(v_j))]) &&\\text{[Th 7.2.8]}\\\
  \\\n&=\\det([A^*(\\zeta^i)(v_j)])\\\\\n&=A^*(\\zeta^1)\\wedge\\cdots\\wedge A^*(\\\
  zeta^{s+s'})(v_1,\\dots,v_{s+s'}). &&\\text{[Th 7.2.8]}\n\\end{aligned}\n\\]\n\n\
  由于 \\(v_1,\\dots,v_{s+s'}\\) 是任意的，\n\n\\[\nA^*(\\zeta^1\\wedge\\cdots\\wedge\\zeta^{s+s'})\
  \ = A^*(\\zeta^1)\\wedge\\cdots\\wedge A^*(\\zeta^{s+s'}). \\tag{7.3.2}\n\\]\n\n\
  现在进行主要证明。设 \\((\\varphi^1,\\dots,\\varphi^n)\\) 为对应于 \\(W\\) 的一组基的对偶基。根据定理 7.2.12(a)，\\\
  (\\eta\\) 和 \\(\\xi\\) 可以表示为\n\n\\[\n\\eta = \\sum_{I\\in\\mathcal{I}_{s,n}} a_I\
  \ \\varphi^I \\qquad \\text{and}\\qquad \\xi = \\sum_{J\\in\\mathcal{I}_{s',n}}\
  \ b_J \\varphi^J.\n\\]\n\n则\n\n\\[\n\\eta\\wedge\\xi = \\left(\\sum_{I\\in\\mathcal{I}_{s,n}}\
  \ a_I\\varphi^I\\right)\\wedge \\left(\\sum_{J\\in\\mathcal{I}_{s',n}} b_J\\varphi^J\\\
  right)\n= \\sum_{I\\in\\mathcal{I}_{s,n},\\,J\\in\\mathcal{I}_{s',n}} a_I b_J\\\
  , \\varphi^I\\wedge\\varphi^J,\n\\]\n\n故\n\n\\[\n\\begin{aligned}\nA^*(\\eta\\wedge\\\
  xi)\n&= \\sum_{I\\in\\mathcal{I}_{s,n},\\,J\\in\\mathcal{I}_{s',n}} a_I b_J\\, A^*(\\\
  varphi^I\\wedge\\varphi^J)\\\\\n&= \\sum_{I\\in\\mathcal{I}_{s,n},\\,J\\in\\mathcal{I}_{s',n}}\
  \ a_I b_J\\, A^*(\\varphi^I)\\wedge A^*(\\varphi^J)\\\\\n&= \\left(\\sum_{I\\in\\\
  mathcal{I}_{s,n}} a_I A^*(\\varphi^I)\\right)\\wedge \\left(\\sum_{J\\in\\mathcal{I}_{s',n}}\
  \ b_J A^*(\\varphi^J)\\right)\\\\\n&= A^*(\\eta)\\wedge A^*(\\xi),\n\\end{aligned}\n\
  \\]\n\n其中第二个等式由 (7.3.2) 推出。\n\n### 定理 7.3.2（多协向量的拉回）\n\n设 \\(V\\) 和 \\(W\\) 分别为维数为\
  \ \\(m\\) 和 \\(n\\) 的向量空间，设 \\(\\mathcal{H}\\) 和 \\(\\mathcal{F}\\) 为各自的基，设 \\((\\\
  theta^1,\\dots,\\theta^m)\\) 和 \\((\\varphi^1,\\dots,\\varphi^n)\\) 为相应的对偶基。设 \\\
  (A:V\\longrightarrow W\\) 为线性映射，设 \\(I\\) 为 \\(\\mathcal{I}_{s,n}\\) 中的多指标，其中 \\\
  (s\\le \\min(m,n)\\)。则\n\n\\[\nA^*(\\varphi^I) = \\sum_{J\\in\\mathcal{I}_{s,m}}\
  \ \\det\\!\\left(\\left([A]_{\\mathcal{H}}^{\\mathcal{F}}\\right)^I_J\\right)\\\
  theta^J.\n\\]\n\n**证明。** 设 \\(\\mathcal{H}=(h_1,\\dots,h_m)\\)。根据定理 7.2.13(a)，\n\
  \n\\[\nA^*(\\varphi^I) = \\sum_{J\\in\\mathcal{I}_{s,m}} A^*(\\varphi^I)(h_J)\\\
  ,\\theta^J. \\tag{7.3.3}\n\\]\n\n设 \\([A]_{\\mathcal{H}}^{\\mathcal{F}}=[a^i_j]\\\
  )。则 (2.2.2) 和 (2.2.3) 给出\n\n\\[\n\\varphi^i(A(h_j)) = \\varphi^i\\!\\left(\\sum_k\
  \ a^k_j f_k\\right)=\\sum_k a^k_j\\,\\varphi^i(f_k)=a^i_j,\n\\]\n\n故\n\n\\[\n[A]_{\\\
  mathcal{H}}^{\\mathcal{F}} = [\\varphi^i(A(h_j))]. \\tag{7.3.4}\n\\]\n\n设 \\(I=(i_1,\\\
  dots,i_s)\\) 且 \\(J=(j_1,\\dots,j_s)\\)。我们有\n\n\\[\n\\begin{aligned}\nA^*(\\varphi^I)(h_J)\n\
  &= A^*(\\varphi^{i_1}\\wedge\\cdots\\wedge\\varphi^{i_s})(h_{j_1},\\dots,h_{j_s})\\\
  \\\n&= \\bigl(A^*(\\varphi^{i_1})\\wedge\\cdots\\wedge A^*(\\varphi^{i_s})\\bigr)(h_{j_1},\\\
  dots,h_{j_s}) &&\\text{[Th 7.3.1(b)]}\\\\\n&= \\det\\!\\left(\\left[A^*(\\varphi^i)(h_j)\\\
  right]_{(i_1,\\dots,i_s)}^{(j_1,\\dots,j_s)}\\right) &&\\text{[Th 7.2.8]} \\tag{7.3.5}\\\
  \\\n&= \\det\\!\\left(\\left[\\varphi^i(A(h_j))\\right]_{(i_1,\\dots,i_s)}^{(j_1,\\\
  dots,j_s)}\\right)\\\\\n&= \\det\\!\\left(\\left([A]_{\\mathcal{H}}^{\\mathcal{F}}\\\
  right)^I_J\\right). &&\\text{[(7.3.4)]}\n\\end{aligned}\n\\]\n\n将 (7.3.5) 代入 (7.3.3)\
  \ 得到结果。\n\n定理 7.3.2 的特殊情形提供了若干有用的恒等式。\n\n### 定理 7.3.3\n\n设 \\(V\\) 和 \\(W\\) 为维数均为\
  \ \\(m\\) 的向量空间，设 \\(\\mathcal{H}=(h_1,\\dots,h_m)\\) 和 \\(\\mathcal{F}=(f_1,\\\
  dots,f_m)\\) 为各自的基，设 \\((\\theta^1,\\dots,\\theta^m)\\) 和 \\((\\varphi^1,\\dots,\\\
  varphi^m)\\) 为相应的对偶基。设 \\(A:V\\longrightarrow W\\) 为线性映射，设 \\(\\eta\\) 为 \\(\\Lambda^m(W)\\\
  ) 中的多协向量。则：\n\n- (a) \\(A^*(\\varphi^1\\wedge\\cdots\\wedge\\varphi^m) = \\det\\\
  !\\left([A]_{\\mathcal{H}}^{\\mathcal{F}}\\right)\\,\\theta^1\\wedge\\cdots\\wedge\\\
  theta^m\\)。\n- (b) \\(A^*(\\eta)(h_1,\\dots,h_m) = \\det\\!\\left([A]_{\\mathcal{H}}^{\\\
  mathcal{F}}\\right)\\,\\eta(f_1,\\dots,f_m)\\)。\n\n**证明。** (a) 由于 \\(\\mathcal{I}_{m,m}=\\\
  {(1,\\dots,m)\\}\\)，这由定理 7.3.2 推出。\n\n(b) 由定理 7.2.13(b) 可知\n\n\\[\n\\eta = \\eta(f_1,\\\
  dots,f_m)\\,\\varphi^1\\wedge\\cdots\\wedge\\varphi^m,\n\\]\n\n然后由 (a) 部分可得\n\n\\\
  [\n\\begin{aligned}\nA^*(\\eta)\n&= \\eta(f_1,\\dots,f_m)\\,A^*(\\varphi^1\\wedge\\\
  cdots\\wedge\\varphi^m)\\\\\n&= \\eta(f_1,\\dots,f_m)\\det\\!\\left([A]_{\\mathcal{H}}^{\\\
  mathcal{F}}\\right)\\theta^1\\wedge\\cdots\\wedge\\theta^m. \\tag{7.3.6}\n\\end{aligned}\n\
  \\]\n\n将上述恒等式的两边同时作用于 \\((h_1,\\dots,h_m)\\) 并使用定理 7.2.9 得到结果。\n\n### 定理 7.3.4\n\
  \n设 \\(V\\) 为维数为 \\(m\\) 的向量空间，设 \\(A:V\\to V\\) 为线性映射，设 \\(\\eta\\) 为 \\(\\Lambda^m(V)\\\
  ) 中的多协向量，设 \\(v_1,\\dots,v_m\\) 为 \\(V\\) 中的向量。则：\n\n- (a) \\(A^*(\\eta)=\\det(A)\\\
  ,\\eta\\)。\n- (b) \\(\\eta(A(v_1),\\dots,A(v_m))=\\det(A)\\,\\eta(v_1,\\dots,v_m)\\\
  )。\n\n**证明。** (a) 取 \\(W=V\\) 且 \\(\\mathcal{F}=\\mathcal{H}\\) 于定理 7.3.3 中。则利用\
  \ (7.3.6)，\n\n\\[\nA^*(\\eta)=\\det\\left([A]_{\\mathcal{H}}^{\\mathcal{H}}\\right)\\\
  eta(h_1,\\dots,h_m)\\,\\theta^1\\wedge\\cdots\\wedge\\theta^m\n=\\det(A)\\,\\eta,\n\
  \\]\n\n其中最后一个等式由定理 7.2.13(b) 推出。\n\n(b) 由 (a) 部分，\n\n\\[\n\\eta(A(v_1),\\dots,A(v_m))\
  \ = A^*(\\eta)(v_1,\\dots,v_m) = \\det(A)\\,\\eta(v_1,\\dots,v_m).\n\\]\n\n下一个结果让人联想到定理\
  \ 2.4.9。\n\n### 定理 7.3.5\n\n设 \\(V\\) 为维数为 \\(m\\) 的向量空间，设 \\(\\eta\\) 为 \\(\\Lambda^m(V)\\\
  ) 中的非零多协向量，设 \\(v_1,\\dots,v_m\\) 为 \\(V\\) 中的向量。则 \\(v_1,\\dots,v_m\\) 线性无关当且仅当\
  \ \\(\\eta(v_1,\\dots,v_m)\\ne 0\\)。\n\n**证明。** 设 \\(\\mathcal{H}=(h_1,\\dots,h_m)\\\
  ) 为 \\(V\\) 的一组基，设 \\((\\theta^1,\\dots,\\theta^m)\\) 为其对偶基。设 \\(\\mathcal{V}=(v_1,\\\
  dots,v_m)\\)，设 \\(A:V\\to V\\) 为由 \\(A(\\mathcal{H})=\\mathcal{V}\\) 定义的线性映射。由于\
  \ \\(\\eta\\) 非零，由定理 7.2.13(b) 可得\n\n\\[\n\\eta(h_1,\\dots,h_m)\\ne 0, \\tag{7.3.7}\n\
  \\]\n\n且由定理 7.3.4(b) 可得\n\n\\[\n\\eta(v_1,\\dots,v_m) = \\det(A)\\,\\eta(h_1,\\\
  dots,h_m). \\tag{7.3.8}\n\\]\n\n则\n\n\\[\n\\begin{aligned}\nv_1,\\dots,v_m \\text{\
  \ 线性无关}\n&\\Longleftrightarrow \\mathcal{V} \\text{ 是 } V \\text{ 的一组基}\\\\\n&\\\
  Longleftrightarrow A \\text{ 是线性同构} \\quad [\\mathrm{Th\\ 1.1.13(a)}]\\\\\n&\\Longleftrightarrow\
  \ \\det(A)\\ne 0 \\quad [\\mathrm{Th\\ 2.5.3}]\\\\\n&\\Longleftrightarrow \\eta(v_1,\\\
  dots,v_m)\\ne 0. \\quad [(7.3.7), (7.3.8)]\n\\end{aligned}\n\\]\n\n顺便提及，\\((\\Longleftarrow)\\\
  ) 由定理 7.1.2 推出。\n\n### 定理 7.3.6（基变换）\n\n设 \\(V\\) 为向量空间，设 \\(\\mathcal{H}\\) 和 \\\
  (\\mathcal{F}\\) 为 \\(V\\) 的基，设 \\((\\theta^1,\\dots,\\theta^m)\\) 和 \\((\\varphi^1,\\\
  dots,\\varphi^m)\\) 为相应的对偶基，设 \\((\\theta^I:I\\in\\mathcal{I}_{s,m})\\) 和 \\((\\\
  varphi^J:J\\in\\mathcal{I}_{s,m})\\) 为 \\(\\Lambda^s(V)\\) 的相应基。设 \\(\\eta\\) 为\
  \ \\(\\Lambda^s(V)\\) 中的多协向量，且\n\n\\[\n\\eta=\\sum_{I\\in\\mathcal{I}_{s,m}} a_I\\\
  theta^I \\qquad\\text{and}\\qquad \\eta=\\sum_{J\\in\\mathcal{I}_{s,m}} b_J\\varphi^J.\n\
  \\]\n\n则\n\n\\[\na_I = \\sum_{J\\in\\mathcal{I}_{s,m}} b_J \\det\\!\\left(\\left([\\\
  operatorname{id}_V]_{\\mathcal{H}}^{\\mathcal{F}}\\right)^J_I\\right).\n\\]\n\n\
  **证明。** 将 \\(W=V\\) 且 \\(A=\\operatorname{id}_V\\) 代入定理 7.3.2 得到\n\n\\[\n\\varphi^J\
  \ = \\sum_{I\\in\\mathcal{I}_{s,m}} \\det\\!\\left(\\left([\\operatorname{id}_V]_{\\\
  mathcal{H}}^{\\mathcal{F}}\\right)^J_I\\right)\\theta^I,\n\\]\n\n故\n\n\\[\n\\begin{aligned}\n\
  \\sum_{I\\in\\mathcal{I}_{s,m}} a_I\\theta^I\n&=\\sum_{J\\in\\mathcal{I}_{s,m}}\
  \ b_J\\varphi^J\\\\\n&=\\sum_{J\\in\\mathcal{I}_{s,m}} b_J\\left[\\sum_{I\\in\\\
  mathcal{I}_{s,m}} \\det\\!\\left(\\left([\\operatorname{id}_V]_{\\mathcal{H}}^{\\\
  mathcal{F}}\\right)^J_I\\right)\\theta^I\\right]\\\\\n&=\\sum_{I\\in\\mathcal{I}_{s,m}}\\\
  left[\\sum_{J\\in\\mathcal{I}_{s,m}} b_J \\det\\!\\left(\\left([\\operatorname{id}_V]_{\\\
  mathcal{H}}^{\\mathcal{F}}\\right)^J_I\\right)\\right]\\theta^I,\n\\end{aligned}\n\
  \\]\n\n由此得到结果。\n\n## 7.4 内乘\n\n设 \\(V\\) 为维数为 \\(m\\) 的向量空间，设 \\(v\\) 为 \\(V\\)\
  \ 中的向量。**由 \\(v\\) 的内乘** 是线性映射族\n\n\\[\ni_v:\\Lambda^s(V)\\longrightarrow\\Lambda^{s-1}(V)\n\
  \\]\n\n对 \\(s\\ge2\\) 定义为\n\n\\[\ni_v(\\eta)(w_1,\\dots,w_{s-1}) = \\eta(v,w_1,\\\
  dots,w_{s-1})\n\\]\n\n对于所有 \\(\\Lambda^s(V)\\) 中的多协向量 \\(\\eta\\) 和所有 \\(V\\) 中的向量\
  \ \\(w_1,\\dots,w_{s-1}\\)。由于 \\(V\\) 中任意 \\(m+1\\) 个向量线性相关，由定理 7.3.5 可知 \\(i_v\\\
  ) 在 \\(s>m\\) 时为零映射。回顾由 (7.1.2) 和 (7.1.3) 可知 \\(\\Lambda^1(V)=V^*\\) 且 \\(\\Lambda^0(V)=\\\
  mathbb R\\)，我们将上述定义推广到 \\(s=1\\) 如下：\n\n\\[\ni_v:\\Lambda^1(V)\\longrightarrow\\\
  Lambda^0(V)\n\\]\n\n由\n\n\\[\ni_v(\\eta)=\\eta(v)\n\\]\n\n给出。\n\n\n\n\n\n## 7.4\
  \ 内乘\n\n对所有余向量 η ∈ Λ¹(V)。当 s = 0 时，我们平凡地定义 iᵥ = 0。令我们记\n\n\\[\ni_v \\circ i_v \\\
  quad \\text{by} \\quad i_v^2.\n\\]\n\n毫不奇怪，内乘对于基本代数结构表现良好，但它对楔积的处理更为复杂。\n\n**定理\
  \ 7.4.1.** 设 V 为向量空间，v, w 为 V 中的向量，η, ζ 为 Λˢ(V) 中的多向量，c 为实数。则：\n\n(a) \\(i_{v+w}(η)=i_v(η)+i_w(η)\\\
  )。\n\n(b) \\(i_{cv}(η)=c\\,i_v(η)\\)。\n\n(c) \\(i_v(η+ζ)=i_v(η)+i_v(ζ)\\)。\n\n(d)\
  \ \\(i_v(cη)=c\\,i_v(η)\\)。\n\n*证明.* 显而易见。\n\n**定理 7.4.2.** 设 V 为向量空间，v 为 V 中的向量，且\
  \ η¹, η², ⋯, ηˢ 为 V* 中的余向量。则\n\n\\[\ni_v(η^1 \\wedge \\cdots \\wedge η^s)=\\sum_{j=1}^{s}(-1)^{j-1}η^j(v)\\\
  ,η^1\\wedge\\cdots\\wedge\\widehat{η^j}\\wedge\\cdots\\wedge η^s.\n\\]\n\n其中 ^ 表示省略一个表达式。\n\
  \n*证明.* 对 V 中的向量 w₁, ⋯, wₛ₋₁，我们有\n\n\\[\n\\begin{aligned}\ni_v(η^1\\wedge\\cdots\\\
  wedge η^s)(w_1,\\ldots,w_{s-1})\n&=(η^1\\wedge\\cdots\\wedge η^s)(v,w_1,\\ldots,w_{s-1})\\\
  \\\n&=\\det\\begin{pmatrix}\nη^1(v)&η^1(w_1)&\\cdots&η^1(w_{s-1})\\\\\n\\vdots&\\\
  vdots&&\\vdots\\\\\nη^s(v)&η^s(w_1)&\\cdots&η^s(w_{s-1})\n\\end{pmatrix}\\\\\n&=\\\
  sum_{j=1}^{s}(-1)^{j-1}η^j(v)\\det\\begin{pmatrix}\nη^1(w_1)&\\cdots&η^1(w_{s-1})\\\
  \\\n\\vdots&&\\vdots\\\\\nη^s(w_1)&\\cdots&η^s(w_{s-1})\n\\end{pmatrix}^{(j)}\\\\\
  \n&=\\sum_{j=1}^{s}(-1)^{j-1}η^j(v)η^1\\wedge\\cdots\\wedge\\widehat{η^j}\\wedge\\\
  cdots\\wedge η^s(w_1,\\ldots,w_{s-1}),\n\\end{aligned}\n\\]\n\n其中第二个等式由定理 7.2.8\
  \ 推出，第三个等式由沿第一列展开行列式得到。由于 w₁, ⋯, wₛ₋₁ 是任意的，结果得证。\n\n下一个结果表明内乘满足一种新颖的乘积法则。\n\n##\
  \ 定理 7.4.3. 设 V 为向量空间，v 为 V 中的向量，且 η 和 ζ 分别为 Λ^s(V) 和 Λ^{s'}(V) 中的多余向量。则\n\ni_v(η\
  \ ∧ ζ) = i_v(η) ∧ ζ + (-1)^s η ∧ i_v(ζ).\n\n# 证明.\n\n由定理 7.3.1(b) 的证明所展示的原因，只需考虑形如\
  \ η = ξ^1 ∧ ⋯ ∧ ξ^s 和 ζ = ξ^{s+1} ∧ ⋯ ∧ ξ^{s+s'} 的多余向量，其中 ξ^j 为 V* 中的余向量，j = 1,2,…,s\
  \ + s'。由定理 7.4.2，\n\ni_v(η ∧ ζ) = i_v(ξ^1 ∧ ⋯ ∧ ξ^s ∧ ξ^{s+1} ∧ ⋯ ∧ ξ^{s+s'}) =\
  \ Σ_{j=1}^s (-1)^{j-1} ξ^j(v) (ξ^1 ∧ ⋯ ∧ \\widehat{ξ^j} ∧ ⋯ ∧ ξ^s) ∧ (ξ^{s+1} ∧\
  \ ⋯ ∧ ξ^{s+s'}) + Σ_{j=s+1}^{s+s'} (-1)^{j-1} ξ^j(v) (ξ^1 ∧ ⋯ ∧ ξ^s) ∧ (ξ^{s+1}\
  \ ∧ ⋯ ∧ \\widehat{ξ^j} ∧ ⋯ ∧ ξ^{s+s'}) = ( Σ_{j=1}^s (-1)^{j-1} ξ^j(v) ξ^1 ∧ ⋯ ∧\
  \ \\widehat{ξ^j} ∧ ⋯ ∧ ξ^s ) ∧ ξ^{s+1} ∧ ⋯ ∧ ξ^{s+s'} + (-1)^s ξ^1 ∧ ⋯ ∧ ξ^s ∧ (\
  \ Σ_{j=s+1}^{s+s'} (-1)^{j-(s+1)} ξ^j(v) ξ^{s+1} ∧ ⋯ ∧ \\widehat{ξ^j} ∧ ⋯ ∧ ξ^{s+s'}\
  \ ) = i_v(η) ∧ ζ + (-1)^s η ∧ i_v(ζ).\n\n## 7.5 多余向量数量积空间\n\n在第 4.5 节中，我们展示了如何构造数量积空间的对偶。基于这一基础，我们现在将其推广到多向量。\n\
  \n设 (V, g) 为数量积空间，H 为 V 的基，Θ = (θ^1, …, θ^m) 为其对偶基。由定理 7.2.12(a)，(θ^I : I ∈ I_{s,m})\
  \ 为 Λ^s(V) 的基。我们定义一个双线性函数\n\ng^Λ = ⟨·,·⟩^Λ : Λ^s(V) × Λ^s(V) ⟶ ℝ\n\n如下。对于 Λ^s(V)\
  \ 中的多余向量 η, ζ，其中\n\nη = Σ_{I ∈ I_{s,m}} a_I θ^I    and    ζ = Σ_{J ∈ I_{s,m}} b_J\
  \ θ^J,    (7.5.1)\n\n令\n\n⟨η, ζ⟩^Λ = Σ_{I,J ∈ I_{s,m}} det((g_Θ^*)_I^J) a_I b_J,\
  \    (7.5.2)\n\n其中 \U0001D524* 为 V* 上的数量积，且\n\n\U0001D524*_Θ = [ ⟨θ¹,θ¹⟩* … ⟨θ¹,θᵐ⟩*\
  \ ; ⋮ ⋱ ⋮ ; ⟨θᵐ,θ¹⟩* … ⟨θᵐ,θᵐ⟩* ]\n\n为 Θ 关于 \U0001D524* 的矩阵。\n\n看起来 \U0001D524^∧\
  \ 的定义依赖于 V 的基的选择。令人惊讶的是，这并非如此。\n\n## 定理 7.5.1. 在上述设定下，\U0001D524^∧ 与 V 基的选择无关。\n\
  \n证明. 设 ℱ 为 V 的另一基，Φ = (φ¹,…,φᵐ) 为其对偶基，且 (φᴶ : J ∈ ℐ_{s,m}) 为 Λˢ(V) 的相应基。设\n\nη\
  \ = Σ_{I∈ℐ_{s,m}} c_I φ^I   and   ζ = Σ_{J∈ℐ_{s,m}} d_J φ^J.\n\n在 (7.5.1) 和 (7.5.2)\
  \ 的记号下，我们需要证明\n\nΣ_{I,J∈ℐ_{s,m}} det((\U0001D524*_Θ)_J^I) a_I b_J = Σ_{I,J∈ℐ_{s,m}}\
  \ det((\U0001D524*_Φ)_J^I) c_I d_J.   (7.5.3)\n\n设\n\nP = [id_V]_{ℱ}^{ℋ}   and \
  \  Q = \U0001D524*_Φ.   (7.5.4)\n\n我们先进行几个初步计算。由于 Q 是对称的，我们由定理 2.1.6 得到\n\nP^L (Q^I)^T\
  \ = P^L (Q^T)_I = P^L Q_I = (P Q)_I^L   (7.5.5)\n\n和\n\nP^K ((P Q)^L)^T = P^K ((P\
  \ Q)^T)_L = (P Q^T P^T)^K_L = (P Q P^T)^K_L.   (7.5.6)\n\n我们也有\n\nP Q P^T = [id_V]_{ℱ}^{ℋ}\
  \ \U0001D524*_Φ ([id_V]_{ℱ}^{ℋ})^T = ([id_V]_{ℋ}^{ℱ})^{-1} \U0001D524_{ℱ}^{-1} (([id_V]_{ℋ}^{ℱ})^{-1})^T\
  \   [Th 2.2.5(b), Th 4.5.3(b)] = ((([id_V]_{ℋ}^{ℱ})^T) \U0001D524_{ℱ} [id_V]_{ℋ}^{ℱ})^{-1}\
  \   [Th 2.1.3] = \U0001D524_{ℋ}^{-1}   [Th 3.1.3] = \U0001D524*_Θ,   [Th 4.5.3(b)]\
  \   (7.5.7)\n\n且由定理 7.3.6 得\n$c_I = \\sum_{K \\in \\mathcal{I}_{s,m}} a_K \\det(P_I^K)\
  \ \\quad \\text{and} \\quad d_J = \\sum_{L \\in \\mathcal{I}_{s,m}} b_L \\det(P_J^L).\
  \ \\tag{7.5.8}$\n利用 (7.5.4) 和 (7.5.8)，(7.5.3) 的右边可表示为\n$\\sum_{I,J \\in \\mathcal{I}_{s,m}}\
  \ \\det\\big((\\mathfrak{g}_\\Phi^*)_J^I\\big) c_I d_J$\n$= \\sum_{I,J \\in \\mathcal{I}_{s,m}}\
  \ \\left[ \\det(Q_J^I) \\left( \\sum_{K \\in \\mathcal{I}_{s,m}} a_K \\det(P_I^K)\
  \ \\right) \\left( \\sum_{L \\in \\mathcal{I}_{s,m}} b_L \\det(P_J^L) \\right) \\\
  right] \\tag{7.5.9}$\n$= \\sum_{K,L \\in \\mathcal{I}_{s,m}} \\left[ \\left( \\\
  sum_{I,J \\in \\mathcal{I}_{s,m}} \\det(P_I^K) \\det(P_J^L) \\det(Q_J^I) \\right)\
  \ a_K b_L \\right] .$\n\n(7.5.9) 最后一行中的大括号项可表示为\n$\\sum_{I,J \\in \\mathcal{I}_{s,m}}\
  \ \\det(P_I^K) \\det(P_J^L) \\det(Q_J^I)$\n$= \\sum_{I \\in \\mathcal{I}_{s,m}}\
  \ \\left[ \\det(P_I^K) \\left( \\sum_{J \\in \\mathcal{I}_{s,m}} \\det(P_J^L) \\\
  det(Q_J^I) \\right) \\right]$\n$= \\sum_{I \\in \\mathcal{I}_{s,m}} \\left( \\det(P_I^K)\
  \ \\det\\big(P^L (Q^I)^\\mathsf{T}\\big) \\right) \\quad \\text{[Th 2.4.10(b)]}$\n\
  $= \\sum_{I \\in \\mathcal{I}_{s,m}} \\left( \\det(P_I^K) \\det\\big((PQ)_I^L\\\
  big) \\right) \\quad \\text{[(7.5.5)]}$\n$= \\det\\left(P^K \\big((PQ)^L\\big)^\\\
  mathsf{T}\\right) \\quad \\text{[Th 2.4.10(b)]}$\n$= \\det\\left((PQ P^\\mathsf{T})_L^K\\\
  right) \\quad \\text{[(7.5.6)]}$\n$= \\det\\left((\\mathfrak{g}_\\Theta^*)_L^K\\\
  right). \\quad \\text{[(7.5.7)]}$\n\n然后 (7.5.9) 和 (7.5.10) 给出\n$\\sum_{I,J \\in\
  \ \\mathcal{I}_{s,m}} \\det\\big((\\mathfrak{g}_\\Phi^*)_J^I\\big) c_I d_J = \\\
  sum_{K,L \\in \\mathcal{I}_{s,m}} \\det\\big((\\mathfrak{g}_\\Theta^*)_L^K\\big)\
  \ a_K b_L,$\n这等价于 (7.5.3)。\n\n## 定理 7.5.2.\n\n设 $(V,\\mathfrak{g})$ 为签名为 $(\\varepsilon_1,\\\
  dots,\\varepsilon_m)$ 的数量积空间，$\\mathcal{E}$ 为 $V$ 的标准正交基，$(\\xi^1,\\dots,\\xi^m)$\
  \ 为其对偶基，且 $I = (i_1,\\dots,i_s)$ 和 $J$ 为 $\\mathcal{I}_{s,m}$ 中的多指标。则\n$\\langle\
  \ \\xi^I, \\xi^J \\rangle^\\Lambda = \\begin{cases} \\varepsilon_{i_1}\\cdots\\\
  varepsilon_{i_s} & \\text{if } I = J \\\\ 0 & \\text{if } I \\neq J, \\end{cases}$\n\
  故每个 $\\xi^I$ 都是单位向量。\n\n证明. 设 Ξ = (ξ¹, …, ξᵐ)。由于 \U0001D524_ℰ = diag(ε₁, …, εₘ)，我们由定理\
  \ 4.5.3(b) 得到\n\n\U0001D524_Ξ* = \U0001D524_ℰ⁻¹ = \U0001D524_ℰ = diag(ε₁, …, εₘ),\n\
  \n然后由 (7.5.2) 得到\n\n⟨ξ^I, ξ^J⟩^∧ = det(diag(ε₁, …, εₘ)^I_J).\n\n若 I = J，则 diag(ε₁,\
  \ …, εₘ)^I_J = diag(ε_{i₁}, …, ε_{i_s})。另一方面，若 I ≠ J，则 diag(ε₁, …, εₘ)^I_J 至少有一行（且至少有一列）为\
  \ 0。结果得证。\n\n我们现在处于定义第 4.5 节所述对偶数量积空间的多余向量对应物的位置。\n\n## 定理 7.5.3. 设 (V, \U0001D524\
  ) 为数量积空间，ℰ 为 V 的标准正交基，且 (ξ¹, …, ξᵐ) 为其对偶基。则：\n\n+   (a) (Λ^s(V), \U0001D524^∧) 是数量积空间，称为与\
  \ (V, \U0001D524) 对应的多余向量数量积空间\n+   (b) (ξ^I : I ∈ ℐ_{s,m}) 是 Λ^s(V) 的标准正交基。\n+\
  \   (c) 若 (V, \U0001D524) 为内积空间，则 (Λ^s(V), \U0001D524^∧) 也是内积空间。\n\n证明. (a): 我们需要证明\
  \ \U0001D524^∧ 是数量积。由构造，\U0001D524^∧ 是双线性的，且显然是对称的。根据定理 7.2.12(a)，(ξ^I : I ∈ ℐ_{s,m})\
  \ 是 Λ^s(V) 的基。设 η 为 Λ^s(V) 中的多余向量，使得对所有 Λ^s(V) 中的多余向量 ζ 都有 ⟨η, ζ⟩^∧ = 0，且令\n\nη\
  \ = Σ_{I ∈ ℐ_{s,m}} a_I ξ^I.   (7.5.11)\n\n则定理 7.5.2 给出\n\n0 = ⟨η, ξ^I⟩^∧ = ⟨ Σ_{J\
  \ ∈ ℐ_{s,m}} a_J ξ^J, ξ^I ⟩^∧ = Σ_{J ∈ ℐ_{s,m}} a_J ⟨ξ^J, ξ^I⟩^∧ = ± a_I,\n\n故 a_I\
  \ = 0 对所有多指标 I ∈ ℐ_{s,m} 成立，所以 η = 0。于是，\U0001D524^∧ 是非退化的。\n\n(b): 刚刚观察到 (ξ^I :\
  \ I ∈ ℐ_{s,m}) 是 Λ^s(V) 的基。由定理 7.5.2，它是标准正交的。\n\n(c): 由于 \U0001D524 是内积，我们由定理 7.5.2\
  \ 得到\n\n⟨ξ^I, ξ^J⟩^∧ = { 1 if I = J\n                  0 if I ≠ J. }\n\n以 (7.5.11)\
  \ 中的 η 为例，\n\n⟨η, η⟩^∧ = ⟨ Σ_{I ∈ ℐ_{s,m}} a_I ξ^I, Σ_{J ∈ ℐ_{s,m}} a_J ξ^J ⟩^∧\
  \ = Σ_{I,J ∈ ℐ_{s,m}} ⟨ξ^I, ξ^J⟩^∧ a_I a_J\n          = Σ_{I ∈ ℐ_{s,m}} (a_I)² ≥\
  \ 0,\n\n且等号成立当且仅当每个 a_I = 0，此时 η = 0。\n\n\n\n\n\n现在我们已经有了标量积空间 $(\\Lambda^s(V),\
  \ \\mathfrak{g}^\\Lambda)$，第 4.5 节中的构造将产生相应的对偶标量积空间 $(\\Lambda^s(V)^*, \\mathfrak{g}^{\\\
  Lambda^*})$ 以及相关的平映射和尖映射：\n\n```\nF^\\Lambda : \\Lambda^s(V) \\longrightarrow \\\
  Lambda^s(V)^* \\quad \\text{and} \\quad S^\\Lambda : \\Lambda^s(V)^* \\longrightarrow\
  \ \\Lambda^s(V).\n```\n\n根据定义，\n\n```\n\\eta^{F^\\Lambda}(\\zeta) = \\langle \\\
  eta, \\zeta \\rangle^\\Lambda \\tag{7.5.12}\n```\n\n对于 $\\Lambda^s(V)$ 中的所有多重余向量\
  \ $\\eta, \\zeta$。\n"
- "## 第8章\n\n## 定向\n\n定向与“侧向性”有关。这个概念在直觉上显而易见，但要将其以数学上严格的方式表述却出乎意料地困难。在第8.1节中，我们基于具体例子作一些观察，然后给出\
  \ $\\mathbb{R}^m$ 定向的初步定义。在第8.2节中，利用我们最近掌握的多重向量知识，这些想法将发展成为一个适用于任意向量空间的计算框架。\n\n\
  ### 8.1 $\\mathbb{R}^m$ 的定向\n\n设 $\\mathcal{H}=(h_1,\\ldots,h_m)$ 是 $\\mathbb{R}^m$\
  \ 的一个基。$\\mathbb{R}^m$ 中每一个点对应一个由该点关于 $\\mathcal{H}$ 的分量组成的 $m$ 元实数组。当 $m=1,2,3$\
  \ 时，我们可以将这个 $m$ 元组绘制在轴标签为 $h_1,\\ldots,h_m$ 的直角坐标系中。我们利用这种方法的几何直观来引出定向的定义。\n\n考虑\
  \ $\\mathbb{R}^2$ 的基 $\\mathcal{E}=(e_1,e_2)$、$(e_2,-e_1)$ 和 $(e_2,e_1)$，其中 $\\\
  mathcal{E}$ 是标准基。在图 8.1.1(a)–(c) 中，这些基被描绘为直角坐标系的坐标轴。图 8.1.1(a) 中的构型，我们称之为 $\\mathbb{R}^2$\
  \ 的标准构型，被认为具有**逆时针定向**，因为将 $e_1$ 转到 $e_2$ 的 90° 旋转是逆时针方向的。图 8.1.1(b) 中的构型也被认为具有逆时针定向，因为其坐标轴可以绕原点刚性旋转，得到与图\
  \ 8.1.1(a) 相同的构型。另一方面，图 8.1.1(c) 中的构型被认为具有**顺时针定向**，因为其坐标轴不能以这种方式刚性旋转（等价地，将 $e_1$\
  \ 转到 $e_2$ 的 90° 旋转是顺时针方向的）。这些观察结果总结在表 8.1.1 的前三列中。\n\n现在考虑 $\\mathbb{R}^3$ 的基 $\\\
  mathcal{E}=(e_1,e_2,e_3)$、$(e_2,-e_1,e_3)$ 和 $(e_2,e_1,e_3)$，其中 $\\mathcal{E}$ 是标准基。在图\
  \ 8.1.2(a)–(c) 中，这些基被描绘\n\n![](img/d712710a8eb78c0959204afd5dde4c91_171_0.png)\n\
  \n**图 8.1.1.** $\\mathbb{R}^2$ 中的定向\n\n| 图 | $\\mathcal{H}$ | 定向 | $[\\operatorname{id}_{\\\
  mathbb{R}^2}]_{\\mathcal{E}}^{\\mathcal{H}}$ | $\\det([\\operatorname{id}_{\\mathbb{R}^2}]_{\\\
  mathcal{E}}^{\\mathcal{H}})$ |\n|---|---|---|---|---|\n| 8.1.1(a) | $(e_1,e_2)$\
  \ | 逆时针 | $\\begin{bmatrix}1&0\\\\0&1\\end{bmatrix}$ | $1$ |\n| 8.1.1(b) | $(e_2,-e_1)$\
  \ | 逆时针 | $\\begin{bmatrix}0&1\\\\-1&0\\end{bmatrix}$ | $1$ |\n| 8.1.1(c) | $(e_2,e_1)$\
  \ | 顺时针 | $\\begin{bmatrix}0&1\\\\1&0\\end{bmatrix}$ | $-1$ |\n\n**表 8.1.1.** $\\\
  mathbb{R}^2$ 中的定向\n\n为直角坐标系的坐标轴。图 8.1.2(a) 中的构型，我们称之为 $\\mathbb{R}^3$ 的标准构型，被认为具有**右手定向**，因为你可以用右手握住正\
  \ $e_3$ 轴，拇指指向正 $e_3$ 轴方向，其余手指绕 $e_3$ 轴相对于 $e_1e_2$ 平面逆时针弯曲。图 8.1.2(b) 中的构型也被认为具有右手定向，因为其坐标轴可以刚性旋转，得到与图\
  \ 8.1.2(a) 相同的构型。另一方面，图 8.1.2(c) 中的构型被认为具有**左手定向**，因为它不能以这种方式刚性旋转（等价地，你可以用左手握住正\
  \ $e_3$ 轴，拇指指向正 $e_3$ 轴方向，其余手指绕 $e_3$ 轴相对于 $e_1e_2$ 平面顺时针弯曲）。这些观察结果总结在表 8.1.2 的前三列中。\n\
  \n在表中，我们还给出了将标准基 $\\mathcal{E}$ 变为基 $\\mathcal{H}$ 的基变换矩阵及其行列式的值。关键观察结果是，对于这些例子，定向保持不变当且仅当\
  \ $\\det\\left([\\operatorname{id}_{\\mathbb{R}^m}]_{\\mathcal{E}}^{\\mathcal{H}}\\\
  right)>0$。特别地，$\\mathcal{E}$ 具有标准定向。\n\n### 8.2 向量空间的定向\n\n在第 8.1 节中，我们通过将 $\\mathbb{R}^m$\
  \ 的基与标准基进行比较，定义了它具有一定定向的含义。这种定向方法在 $\\mathbb{R}^m$ 中有效，因为存在一个明显的参考基选择，而对于任意向量空间，情况可能并非如此。\n\
  \n设 $V$ 是维数为 $m$ 的向量空间，并设 $\\mathcal{H}$ 和 $\\mathcal{F}$ 是 $V$ 的基。由定理 2.4.12 可知\
  \ $\\det([\\operatorname{id}_V]_{\\mathcal{H}}^{\\mathcal{F}})\\neq 0$。我们称 $\\mathcal{H}$\
  \ 和 $\\mathcal{F}$ 是**一致的**，并记作 $\\mathcal{H}\\sim\\mathcal{F}$，如果\n\n\\[\\det\\\
  left([\\operatorname{id}_V]_{\\mathcal{H}}^{\\mathcal{F}}\\right)>0.\\]\n\n利用定理\
  \ 2.2.2(c) 和定理 2.2.5(b)，可以容易地证明 $\\sim$ 是 $V$ 的基集合上的一个等价关系，并且恰好有两个等价类。每个等价类都称为 **$V$\
  \ 的一个定向**。含给定基 $\\mathcal{H}$ 的等价类记作 $[\\mathcal{H}]$。设 $\\mathcal{H}=(h_1,h_2,\\\
  ldots,h_m)$，并设\n\n\\[-\\mathcal{H}=(-h_1,h_2,\\ldots,h_m).\\]\n\n显然，$-\\mathcal{H}$\
  \ 是 $V$ 的一个基，且 $\\det([\\operatorname{id}_V]_{\\mathcal{H}}^{-\\mathcal{H}})=-1$，因此\
  \ $\\mathcal{H}$ 与 $-\\mathcal{H}$ 不一致。我们称定向 $[-\\mathcal{H}]$ 为 $[\\mathcal{H}]$\
  \ 的**相反定向**。于是，对于 $V$ 的任意基 $\\mathcal{H}$，$V$ 的两个定向为 $[\\mathcal{H}]$ 和 $[-\\mathcal{H}]$。例如，$\\\
  mathbb{R}^m$ 的两个定向是 $[\\mathcal{E}]$ 和 $[-\\mathcal{E}]$，其中 $\\mathcal{E}$ 是 $\\\
  mathbb{R}^m$ 的标准基。我们将 $[\\mathcal{E}]$ 称为 $\\mathbb{R}^m$ 的标准定向。按照这一术语，$\\mathcal{E}$\
  \ 是处于标准定向中的一个基，这与第 8.1 节中称 $\\mathcal{E}$ 具有标准定向略有不同。推广采用这种语言是方便的：对于任何向量空间，处于一个定向中的基称为具有该定向。\n\
  \n一旦选定了 $V$ 的一个定向 $\\mathcal{O}$，二元组 $(V,\\mathcal{O})$ 就称为一个**定向向量空间**，并称 $V$ 具有定向\
  \ $\\mathcal{O}$。另一个定向记作 $-\\mathcal{O}$，称为 **$\\mathcal{O}$ 的相反定向**。如果 $V$ 的一个基在\
  \ $\\mathcal{O}$ 中，则称它是**正定向的（关于 $\\mathcal{O}$）**。我们通常会认为这样说更方便，例如“$\\mathcal{H}$\
  \ 是 $V$ 中关于 $\\mathcal{O}$ 正定向的基”，而不是更简洁的“$\\mathcal{H}$ 在 $\\mathcal{O}$ 中”。尽管惯例或具体情况往往会影响赋予给定向量空间的定向，但必须强调的是，归根结底这是一个选择问题。$\\\
  mathcal{O}$ 或 $-\\mathcal{O}$ 作为 $V$ 的定向，并没有内在属性使其中之一比另一个更可取。话虽如此，对于 $\\mathbb{R}^m$\
  \ 的情况，我们采用以下约定。\n\n\n\n\n\n## 8.2 向量空间的方向\n\n**在整个章节中，** \\(\\mathbb{R}^m\\) 假定具有标准方向。\n\
  \n我们现在用多向量给出方向的一个等价方法。设 \\(V\\) 是一个维数为 \\(m\\) 的向量空间。在本上下文中，\\(\\Lambda^m(V)\\)\
  \ 中的一个非零多向量称为 \\(V\\) 上的 **方向多向量**。例如，设 \\((h_1,\\ldots,h_m)\\) 是 \\(V\\) 的一个基，\\\
  ((\\theta^1,\\ldots,\\theta^m)\\) 是其对偶基。由定理 7.2.9，\\(\\theta^1\\wedge\\cdots\\wedge\\\
  theta^m(h_1,\\ldots,h_m)=1\\)，所以 \\(\\theta^1\\wedge\\cdots\\wedge\\theta^m\\) 是\
  \ \\(V\\) 上的一个方向多向量。更一般地，我们有以下结果。\n\n### 定理 8.2.1.\n\n设 \\(V\\) 是一个维数为 \\(m\\) 的向量空间，\\\
  (\\varpi\\) 是 \\(\\Lambda^m(V)\\) 中的一个多向量。那么 \\(\\varpi\\) 是方向多向量当且仅当 \\(\\varpi(h_1,\\\
  ldots,h_m)\\neq 0\\) 对某个（从而对每一个）基 \\((h_1,\\ldots,h_m)\\) 成立。\n\n**证明.** 设 \\(\\\
  mathcal{H}=(h_1,\\ldots,h_m)\\) 是 \\(V\\) 的一个基，\\((\\theta^1,\\ldots,\\theta^m)\\\
  ) 是其对偶基。我们由定理 7.2.13(b) 得到\n\n\\[\n\\varpi=\\varpi(h_1,\\ldots,h_m)\\,\\theta^1\\\
  wedge\\cdots\\wedge\\theta^m.\n\\]\n\n因此，\\(\\varpi\\) 非零当且仅当 \\(\\varpi(h_1,\\\
  ldots,h_m)\\neq 0\\)。设 \\(\\mathcal{F}=(f_1,\\ldots,f_m)\\) 是 \\(V\\) 的另一个基。由定理\
  \ 7.3.3(b)，\n\n\\[\n\\varpi(h_1,\\ldots,h_m)=\\det\\left([\\operatorname{id}_V]_{\\\
  mathcal{H}}^{\\mathcal{F}}\\right)\\varpi(f_1,\\ldots,f_m),\n\\]\n\n并且由定理 2.4.12，\\\
  (\\det([\\operatorname{id}_V]_{\\mathcal{H}}^{\\mathcal{F}})\\neq 0\\)。因此，\\(\\\
  varpi(h_1,\\ldots,h_m)\\neq 0\\) 当且仅当 \\(\\varpi(f_1,\\ldots,f_m)\\neq 0\\)。结果得证。\n\
  \n### 定理 8.2.2.\n\n设 \\(V\\) 是一个向量空间，\\(\\mathcal{H}=(h_1,\\ldots,h_m)\\) 和 \\(\\\
  mathcal{F}=(f_1,\\ldots,f_m)\\) 是 \\(V\\) 的基，\\((\\theta^1,\\ldots,\\theta^m)\\\
  ) 是对应于 \\(\\mathcal{H}\\) 的对偶基。那么以下等价：\n\n- (a) \\(\\mathcal{H}\\) 和 \\(\\mathcal{F}\\\
  ) 是相容的。\n- (b) \\(\\theta^1\\wedge\\cdots\\wedge\\theta^m(f_1,\\ldots,f_m)>0\\)。\n\
  - (c) 对某个（从而对每一个）\\(V\\) 上的方向多向量 \\(\\varpi\\)，\\(\\varpi(h_1,\\ldots,h_m)\\) 与\
  \ \\(\\varpi(f_1,\\ldots,f_m)\\) 具有相同的符号。\n\n**注.** 由定理 8.2.1，我们有 \\(\\varpi(h_1,\\\
  ldots,h_m),\\varpi(f_1,\\ldots,f_m)\\neq 0\\)，所以部分 (c) 中的断言是有意义的。\n\n**证明.** (a)\
  \ \\(\\Longleftrightarrow\\) (b)：由定理 7.2.9 和定理 7.3.3(b)，\n\n\\[\n\\det\\left([\\\
  operatorname{id}_V]_{\\mathcal{H}}^{\\mathcal{F}}\\right)\\theta^1\\wedge\\cdots\\\
  wedge\\theta^m(f_1,\\ldots,f_m)=\\theta^1\\wedge\\cdots\\wedge\\theta^m(h_1,\\ldots,h_m)=1.\n\
  \\]\n\n结果得证。\n\n(a) \\(\\Longleftrightarrow\\) (c)：由定理 7.3.3(b)，\n\n\\[\n\\varpi(h_1,\\\
  ldots,h_m)=\\det\\left([\\operatorname{id}_V]_{\\mathcal{H}}^{\\mathcal{F}}\\right)\\\
  varpi(f_1,\\ldots,f_m),\n\\]\n\n并且由定理 2.4.12，\\(\\det([\\operatorname{id}_V]_{\\\
  mathcal{H}}^{\\mathcal{F}})\\neq 0\\)。结果得证。\n\n### 定理 8.2.3.\n\n设 \\(V\\) 是一个向量空间，\\\
  (\\varpi\\) 是 \\(V\\) 上的一个方向多向量，\\(\\mathfrak{D}\\) 是满足 \\(\\varpi(h_1,\\ldots,h_m)>0\\\
  ) 的基 \\((h_1,\\ldots,h_m)\\) 的集合。那么 \\(\\mathfrak{D}\\) 是 \\(V\\) 的一个方向，称为由 \\(\\\
  varpi\\) **诱导的方向**。\n\n**证明.** 设 \\(\\mathcal{H}=(h_1,\\ldots,h_m)\\) 和 \\(\\mathcal{F}=(f_1,\\\
  ldots,f_m)\\) 是 \\(V\\) 的基，且 \\(\\varpi(h_1,\\ldots,h_m)>0\\)。那么\n\n- \\(\\mathcal{F}\\\
  ) 在 \\(\\mathfrak{D}\\) 中\n- \\(\\Leftrightarrow \\varpi(f_1,\\ldots,f_m)>0\\)\n\
  - \\(\\Leftrightarrow \\varpi(h_1,\\ldots,h_m)\\) 与 \\(\\varpi(f_1,\\ldots,f_m)\\\
  ) 具有相同的符号\n- \\(\\Leftrightarrow \\mathcal{H}\\) 与 \\(\\mathcal{F}\\) 相容，\n\n其中最后的等价由定理\
  \ 8.2.2 得到。因此，\\(\\mathfrak{D}\\) 是与 \\(\\mathcal{H}\\) 相容的 \\(V\\) 的基的集合；即 \\(\\\
  mathfrak{D}=[\\mathcal{H}]\\)。\n\n### 例 8.2.4 (\\(\\mathbb{R}^m\\))。\n\n设 \\(\\\
  mathcal{E}=(e_1,\\ldots,e_m)\\) 是 \\(\\mathbb{R}^m\\) 的标准基，\\((\\xi^1,\\ldots,\\\
  xi^m)\\) 是其对偶基，\\(\\Omega=\\xi^1\\wedge\\cdots\\wedge\\xi^m\\)。由定理 7.2.9 可知 \\(\\\
  Omega(e_1,\\ldots,e_m)=1\\)，所以 \\(\\Omega\\) 是 \\(\\mathbb{R}^m\\) 上的一个方向多向量，且 \\\
  (\\mathcal{E}\\) 在由 \\(\\Omega\\) 诱导的 \\(\\mathbb{R}^m\\) 的方向中。因此，\\(\\Omega\\)\
  \ 诱导出 \\(\\mathbb{R}^m\\) 的标准方向。\n\n设 \\(V\\) 是一个向量空间，\\(\\varpi\\) 和 \\(\\vartheta\\\
  ) 是 \\(V\\) 上的方向多向量。由定理 7.2.12(d) 和定理 8.2.1，\\(\\varpi\\) 张成 \\(\\Lambda^m(V)\\\
  )（\\(\\vartheta\\) 亦然）。于是 \\(\\varpi=c\\vartheta\\) 对某个非零实数 \\(c\\) 成立。我们称 \\(\\\
  varpi\\) 与 \\(\\vartheta\\) 相容，并记作 \\(\\varpi\\sim\\vartheta\\)，如果 \\(c>0\\)。容易证明\
  \ \\(\\sim\\) 是 \\(V\\) 上方向多向量集合上的一个等价关系，并且恰好有两个等价类。包含 \\(\\varpi\\) 的等价类记作 \\([\\\
  varpi]\\)。根据定义，\\([\\varpi]\\) 包含所有与 \\(\\varpi\\) 相容的 \\(V\\) 上的多向量。显然，\\(\\varpi\\\
  ) 与 \\(-\\varpi\\) 不相容。因此，对任意 \\(V\\) 上的方向多向量 \\(\\varpi\\)，方向多向量的等价类为 \\([\\varpi]\\\
  ) 和 \\([-\\varpi]\\)。\n\n设 \\(\\mathcal{H}\\) 是 \\(V\\) 的一个基。显然，同一等价类中的方向多向量诱导出相同的方向，而不同等价类中的方向多向量诱导出相反的方向。因此我们有一个双射\n\
  \n\\[\n\\iota : \\{[\\varpi], [-\\varpi]\\} \\longrightarrow \\{[\\mathcal{H}],\
  \ [-\\mathcal{H}]\\}\n\\]\n\n它把 \\([\\varpi]\\) 和 \\([-\\varpi]\\) 分别赋给由 \\(\\varpi\\\
  ) 和 \\(-\\varpi\\) 诱导的方向。这表明我们可以用 \\(V\\) 的基（的等价类）或 \\(V\\) 上的方向多向量（的等价类）来指定方向。对于计算而言，后一种方法通常更方便。\n\
  \n### 定理 8.2.5（子空间的诱导方向）。\n\n设 \\((V,\\mathfrak{D})\\) 是一个维数 \\(m\\ge 2\\) 的定向向量空间，\\\
  (U\\) 是 \\(V\\) 的一个 \\((m-1)\\) 维子空间，\\(v\\) 是 \\(V\\setminus U\\) 中的一个向量。那么：\n\n\
  - (a) 存在唯一的 \\(U\\) 的方向 \\(\\mathcal{D}_U\\)，称为由 \\(v\\) **诱导的方向**，使得 \\((h_1,\\\
  ldots,h_{m-1})\\) 是相对于 \\(\\mathcal{D}_U\\) 正向的 \\(U\\) 的基当且仅当 \\((v,h_1,\\ldots,h_{m-1})\\\
  ) 是相对于 \\(\\mathcal{D}\\) 正向的 \\(V\\) 的基。\n- (b) 如果 \\(\\varpi\\) 是诱导 \\(\\mathcal{D}\\\
  ) 的 \\(V\\) 上的方向多向量，则 \\(\\iota_v(\\varpi)|_U\\) 是诱导 \\(\\mathcal{D}_U\\) 的 \\(U\\\
  ) 上的方向多向量。\n- (c) \\(\\mathcal{D}_U\\) 与诱导 \\(\\mathcal{D}\\) 的 \\(V\\) 上方向多向量的选择无关。\n\
  \n**证明.** (a), (b)：设 \\((h_1,\\ldots,h_{m-1})\\) 是 \\(U\\) 中 \\((m-1)\\) 个向量。因为\
  \ \\(v\\) 在 \\(V\\setminus U\\) 中，由定理 1.1.2，\\((h_1,\\ldots,h_{m-1})\\) 是 \\(U\\\
  ) 的基当且仅当 \\((v,h_1,\\ldots,h_{m-1})\\) 是 \\(V\\) 的基。假设 \\((h_1,\\ldots,h_{m-1})\\\
  ) 确实是 \\(U\\) 的基。显然 \\(\\iota_v(\\varpi)|_U\\) 是 \\(\\Lambda^{m-1}(U)\\) 中的一个多向量。由定义，\n\
  \n\\[\n\\iota_v(\\varpi)|_U(h_1,\\ldots,h_{m-1})=\\varpi(v,h_1,\\ldots,h_{m-1}).\
  \ \\tag{8.2.2}\n\\]\n\n我们由定理 8.2.1 得到 \\(\\varpi(v,h_1,\\ldots,h_{m-1})\\ne 0\\\
  )，然后由 (8.2.2) 得到 \\(\\iota_v(\\varpi)|_U(h_1,\\ldots,h_{m-1})\\ne 0\\)。这表明 \\(\\\
  iota_v(\\varpi)|_U\\) 是非零的，因而是 \\(U\\) 上的方向多向量。设 \\(\\mathcal{D}_U\\) 是由 \\(\\iota_v(\\\
  varpi)|_U\\) 诱导的 \\(U\\) 的方向。由 (8.2.2) 和定理 8.2.3 可知，\\((h_1,\\ldots,h_{m-1})\\)\
  \ 相对于 \\(\\mathcal{D}_U\\) 正向当且仅当 \\((v,h_1,\\ldots,h_{m-1})\\) 相对于 \\(\\mathcal{D}\\\
  ) 正向。因此，\\(\\mathcal{D}_U\\) 具有所需性质。唯一性由（几乎是显然的）观察可知，向量空间的方向由它包含的基决定。\n\n(c)：这由部分\
  \ (a) 可得。\n\n需要说明的是，与定理 8.2.5 的部分 (c) 相反，\\(U\\) 上诱导的方向与 \\(V\\setminus U\\) 中向量的选择无关。特别地，如果\
  \ \\(v\\) 诱导出 \\(\\mathcal{D}_U\\)，则 \\(-v\\) 诱导出 \\(-\\mathcal{D}_U\\)。\n\n###\
  \ 定理 8.2.6.\n\n设 \\((V,\\mathcal{D})\\) 和 \\((\\widetilde V,\\widetilde{\\mathcal{D}})\\\
  ) 是定向向量空间，\\(A:V\\longrightarrow\\widetilde V\\) 是一个线性同构，且 \\(A(\\mathcal{D})=\\\
  {A(\\mathcal{H}):\\mathcal{H}\\in\\mathcal{D}\\}\\)。那么要么 \\(A(\\mathcal{D})=\\widetilde{\\\
  mathcal{D}}\\)，此时 \\(A\\) 称为 **保向** 的，要么 \\(A(\\mathcal{D})=-\\widetilde{\\mathcal{D}}\\\
  )，此时 \\(A\\) 称为 **反向** 的。\n\n**证明.** 设 \\(\\mathcal{H}\\) 和 \\(\\mathcal{F}\\) 是\
  \ \\(\\mathcal{D}\\) 中的基，注意到由定理 1.1.13(a)，\\(A(\\mathcal{H})\\) 和 \\(A(\\mathcal{F})\\\
  ) 是 \\(\\widetilde V\\) 的基。设 \\([\\operatorname{id}_V]_{\\mathcal{H}}^{\\mathcal{F}}=[a^i_j]\\\
  )。我们由 (2.2.6) 和 (2.2.7) 得到 \\(h_j=\\sum_i a^i_j f_i\\)，于是 \\(A(h_j)=\\sum_i a^i_j\
  \ A(f_i)\\)，所以 \\([\\operatorname{id}_{A(\\mathcal{H})}^{A(\\mathcal{F})}]=[\\operatorname{id}_{\\\
  mathcal{H}}^{\\mathcal{F}}]\\)。根据定义，\\(\\mathcal{H}\\) 与 \\(\\mathcal{F}\\) 相容，因此\
  \ \\(A(\\mathcal{H})\\) 与 \\(A(\\mathcal{F})\\) 也是相容的。因此，要么 \\(A(\\mathcal{H})\\\
  ) 与 \\(A(\\mathcal{F})\\) 在 \\(\\widetilde{\\mathcal{D}}\\) 中，要么它们在 \\(-\\widetilde{\\\
  mathcal{D}}\\) 中。因为 \\(\\mathcal{H}\\) 与 \\(\\mathcal{F}\\) 是任意的，要么 \\(A(\\mathcal{D})\\\
  subseteq\\widetilde{\\mathcal{D}}\\) 要么 \\(A(\\mathcal{D})\\subseteq-\\widetilde{\\\
  mathcal{D}}\\)。由定理 1.1.9，\\(A^{-1}\\) 是线性同构，所以类似的论证表明要么 \\(A^{-1}(\\widetilde{\\\
  mathcal{D}})\\subseteq\\mathcal{D}\\) 要么 \\(A^{-1}(\\widetilde{\\mathcal{D}})\\\
  subseteq-\\mathcal{D}\\)，于是要么 \\(\\widetilde{\\mathcal{D}}\\subseteq A(\\mathcal{D})\\\
  ) 要么 \\(\\widetilde{\\mathcal{D}}\\subseteq A(-\\mathcal{D})\\)。容易用 (8.2.1) 证明对\
  \ \\(\\mathcal{D}\\) 中的任意基 \\(\\mathcal{H}\\) 都有 \\(A(-\\mathcal{H})=-A(\\mathcal{H})\\\
  )，所以要么 \\(\\widetilde{\\mathcal{D}}\\subseteq A(\\mathcal{D})\\) 要么 \\(-\\widetilde{\\\
  mathcal{D}}\\subseteq A(\\mathcal{D})\\)。结果得证。\n\n\n\n\n\n## 定理 8.2.7. 若 $(V,\\\
  mathfrak{O})$ 和 $(\\widetilde{V},\\widetilde{\\mathfrak{O}})$ 为定向向量空间且 $A : V \\\
  longrightarrow \\widetilde{V}$ 为线性同构，则以下条件等价：\n\n- (a) $A$ 为保定向的。\n- (b) $\\det\\\
  left([A]_{\\mathcal{H}}^{\\widetilde{\\mathcal{H}}}\\right) > 0$ 对某个（从而每个）$\\mathfrak{O}$\
  \ 中的基 $\\mathcal{H}$ 以及某个（从而每个）$\\widetilde{\\mathfrak{O}}$ 中的基 $\\widetilde{\\\
  mathcal{H}}$ 成立。\n- (c) $A^*(\\widetilde{\\varpi})$ 为 $V$ 上的定向多余向量，它对某个（从而每个）诱导\
  \ $\\widetilde{\\mathfrak{O}}$ 的 $\\widetilde{V}$ 上的定向多余向量 $\\widetilde{\\varpi}$\
  \ 诱导 $\\mathfrak{O}$。\n\n注. 易证由于 $A$ 为线性同构，$A^*(\\widetilde{\\varpi})$ 为 $V$ 上的定向多余向量，故部分\
  \ (c) 中的断言是有意义的。\n\n证明. (a) $\\Leftrightarrow$ (b): 我们有\n\n$A$ 为保定向的\n$\\Leftrightarrow$\
  \ $A(\\mathcal{H})$ 与 $\\widetilde{\\mathcal{H}}$ 对某个（从而每个）$\\mathfrak{O}$ 中的 $\\\
  mathcal{H}$ 和 $\\widetilde{\\mathfrak{O}}$ 中的 $\\widetilde{\\mathcal{H}}$ 相容\n$\\\
  Leftrightarrow$ $\\det\\left([\\mathrm{id}_{\\widetilde{V}}]_{A(\\mathcal{H})}^{\\\
  widetilde{\\mathcal{H}}}\\right) > 0$ 对某个（从而每个）$\\mathfrak{O}$ 中的 $\\mathcal{H}$\
  \ 和 $\\widetilde{\\mathfrak{O}}$ 中的 $\\widetilde{\\mathcal{H}}$ 成立\n$\\Leftrightarrow$\
  \ $\\det\\left([A]_{\\mathcal{H}}^{\\widetilde{\\mathcal{H}}}\\right) > 0$ 对某个（从而每个）$\\\
  mathfrak{O}$ 中的 $\\mathcal{H}$ 和 $\\widetilde{\\mathfrak{O}}$ 中的 $\\widetilde{\\\
  mathcal{H}}$ 成立，\n\n其中第一个等价由定理 8.2.6 可得，最后一个等价由定理 2.2.5(a) 可得。\n\n(b) $\\Leftrightarrow$\
  \ (c): 设 $\\mathcal{H} = (h_1,\\dots,h_m)$ 和 $\\widetilde{\\mathcal{H}} = (\\widetilde{h}_1,\\\
  dots,\\widetilde{h}_m)$ 分别为 $\\mathfrak{O}$ 和 $\\widetilde{\\mathfrak{O}}$ 中的基，且设\
  \ $\\widetilde{\\varpi}$ 为诱导 $\\widetilde{\\mathfrak{O}}$ 的定向多余向量。我们由定理 7.3.3(b)\
  \ 可得\n\n$A^*(\\widetilde{\\varpi})(h_1,\\dots,h_m) = \\det\\left([A]_{\\mathcal{H}}^{\\\
  widetilde{\\mathcal{H}}}\\right)\\,\\widetilde{\\varpi}(\\widetilde{h}_1,\\dots,\\\
  widetilde{h}_m).$\n\n由定理 8.2.3，$\\widetilde{\\varpi}(\\widetilde{h}_1,\\dots,\\\
  widetilde{h}_m) > 0$，故\n\n$A^*(\\widetilde{\\varpi})$ 诱导 $\\mathfrak{O}$\n$\\Leftrightarrow$\
  \ $A^*(\\widetilde{\\varpi})(h_1,\\dots,h_m) > 0$ 对某个（从而每个）$\\mathfrak{O}$ 中的 $\\\
  mathcal{H}$ 成立\n$\\Leftrightarrow$ $\\det\\left([A]_{\\mathcal{H}}^{\\widetilde{\\\
  mathcal{H}}}\\right)\\,\\widetilde{\\varpi}(\\widetilde{h}_1,\\dots,\\widetilde{h}_m)\
  \ > 0$ 对某个（从而每个）$\\mathfrak{O}$ 中的 $\\mathcal{H}$ 和 $\\widetilde{\\mathfrak{O}}$\
  \ 中的 $\\widetilde{\\mathcal{H}}$ 成立\n$\\Leftrightarrow$ $\\det\\left([A]_{\\mathcal{H}}^{\\\
  widetilde{\\mathcal{H}}}\\right) > 0$ 对某个（从而每个）$\\mathfrak{O}$ 中的 $\\mathcal{H}$\
  \ 和 $\\widetilde{\\mathfrak{O}}$ 中的 $\\widetilde{\\mathcal{H}}$ 成立，\n\n其中第一个等价由定理\
  \ 8.2.3 可得。\n\n## 定理 8.2.8. 设 $(V,\\mathfrak{O})$ 为定向向量空间，且 $A : V \\longrightarrow\
  \ V$ 为线性同构。则 $A$ 为保定向的当且仅当 $\\det(A) > 0$。\n\n证明. 在定理 8.2.7 中取 $(V,\\mathfrak{O})\
  \ = (\\widetilde{V},\\widetilde{\\mathfrak{O}})$ 且 $\\mathcal{H} = \\widetilde{\\\
  mathcal{H}}$ 即得结果。\n\n## 8.3 数量积空间的定向\n\n在第 8.2 节中，我们考虑了向量空间的定向。现在我们将我们的覆盖扩展到数量积空间。\n\
  \n## 定理 8.3.1. 设 $(V,\\mathfrak{g})$ 为指标为 $\\nu$ 的数量积空间，设 $\\mathcal{E} = (e_1,\\\
  dots,e_m)$ 和 $\\mathcal{H} = (h_1,\\dots,h_m)$ 为 $V$ 的基，其中 $\\mathcal{E}$ 正交归一，且设\
  \ $(\\xi^1,\\dots,\\xi^m)$ 和 $(\\theta^1,\\dots,\\theta^m)$ 为相应的对偶基。则：\n\n(a)\n\n\
  $\\det(\\mathfrak{g}_{\\mathcal{H}}) = (-1)^\\nu (\\det([id_V]_{\\mathcal{H}}^{\\\
  mathcal{E}}))^2$.\n\n(b)\n\n$\\xi^1 \\wedge \\cdots \\wedge \\xi^m = \\pm\\sqrt{|\\\
  det(\\mathfrak{g}_{\\mathcal{H}})|}\\ \\theta^1 \\wedge \\cdots \\wedge \\theta^m,$\n\
  \n其中若 $\\mathcal{E}$ 与 $\\mathcal{H}$ 相容则取正号，若不相容则取负号。\n\n(c) 若 $\\mathcal{H}$ 正交归一，则\n\
  \n$\\xi^1 \\wedge \\cdots \\wedge \\xi^m = \\pm\\theta^1 \\wedge \\cdots \\wedge\
  \ \\theta^m,$\n\n其中符号的选取如部分 (b) 所述。\n\n证明. (a): 我们由定理 3.1.3 可得\n\n$\\mathfrak{g}_{\\\
  mathcal{H}} = ([id_V]_{\\mathcal{H}}^{\\mathcal{E}})^T \\mathfrak{g}_{\\mathcal{E}}\
  \ [id_V]_{\\mathcal{H}}^{\\mathcal{E}},$\n\n且由 (4.2.3) 可得 $\\det(\\mathfrak{g}_{\\\
  mathcal{E}}) = (-1)^\\nu$。结果随之可得。\n\n(b): 由定理 7.3.3(a)，\n\n$\\xi^1 \\wedge \\cdots\
  \ \\wedge \\xi^m = \\det([id_V]_{\\mathcal{H}}^{\\mathcal{E}})\\ \\theta^1 \\wedge\
  \ \\cdots \\wedge \\theta^m,$\n\n且由部分 (a)，$|\\det(\\mathfrak{g}_{\\mathcal{H}})|\
  \ = (\\det([id_V]_{\\mathcal{H}}^{\\mathcal{E}}))^2$，故\n\n$\\det([id_V]_{\\mathcal{H}}^{\\\
  mathcal{E}}) = \\pm\\sqrt{|\\det(\\mathfrak{g}_{\\mathcal{H}})|},$\n\n其中若 $\\mathcal{H}$\
  \ 与 $\\mathcal{E}$ 相容则取正号，若不相容则取负号。结果随之可得。\n\n(c): 这由 (4.2.3) 和部分 (b) 可得。\n\n##\
  \ 定理 8.3.2. 设 $(V,\\mathfrak{g})$ 为数量积空间，设 $\\mathcal{E} = (e_1,\\dots,e_m)$ 和 $\\\
  mathcal{F} = (f_1,\\dots,f_m)$ 为 $V$ 的正交归一基，且设 $\\varpi$ 为 $V$ 上的定向多余向量。则\n\n$\\\
  varpi(e_1,\\dots,e_m) = \\pm\\varpi(f_1,\\dots,f_m),$\n\n其中若 $\\mathcal{E}$ 与 $\\\
  mathcal{F}$ 相容则取正号，若不相容则取负号。\n\n**证明.** 设 $(\\xi^1,\\ldots,\\xi^m)$ 和 $(\\varphi^1,\\\
  ldots,\\varphi^m)$ 分别为对应于 $\\mathcal E$ 和 $\\mathcal F$ 的对偶基。我们有\n\n$$\\varpi(e_1,\\\
  ldots,e_m)\\,\\xi^1\\wedge\\cdots\\wedge\\xi^m$$\n\n$$=\\varpi(f_1,\\ldots,f_m)\\\
  ,\\varphi^1\\wedge\\cdots\\wedge\\varphi^m \\qquad [\\mathrm{Thm\\ 7.2.13(b)}]$$\n\
  \n$$=\\pm\\varpi(f_1,\\ldots,f_m)\\,\\xi^1\\wedge\\cdots\\wedge\\xi^m, \\qquad [\\\
  mathrm{Thm\\ 8.3.1(c)}]$$\n\n其中若 $\\mathcal E$ 与 $\\mathcal F$ 相容则取正号，若不相容则取负号。于是定理\
  \ 7.2.9 给出结果。\n\n## 定理 8.3.3.\n\n*设 $(V,g)$ 为数量积空间，设 $\\mathcal E=(e_1,\\ldots,e_m)$\
  \ 和 $\\mathcal F$ 为 $V$ 的正交归一基，且设 $(\\varphi^1,\\ldots,\\varphi^m)$ 为对应于 $\\mathcal\
  \ F$ 的对偶基。则：*\n\n$$\\det\\left([\\operatorname{id}_V]_{\\mathcal E}^{\\mathcal F}\\\
  right)=\\varphi^1\\wedge\\cdots\\wedge\\varphi^m(e_1,\\ldots,e_m)=\\pm1,$$\n\n其中若\
  \ $\\mathcal E$ 与 $\\mathcal F$ 相容则取正号，若不相容则取负号。\n\n**证明.** 第一个等式由定理 7.2.11 可得。取\
  \ $\\varpi=\\varphi^1\\wedge\\cdots\\wedge\\varphi^m$ 于定理 8.3.2 中并利用定理 7.2.9 即得第二个等式。\n\
  \n## 定理 8.3.4 (体积多余向量的存在性)。\n\n*若 $(V,g,\\mathcal D)$ 为定向数量积空间，则存在唯一的 $V$ 上的定向多余向量\
  \ $\\Omega_V$，称为* **体积多余向量** *，使得：(i) $\\Omega_V$ 诱导 $\\mathcal D$，且 (ii) 若 $(e_1,\\\
  ldots,e_m)$ 为相对于 $\\mathcal D$ 正定向的 $V$ 的正交归一基，则 $\\Omega_V(e_1,\\ldots,e_m)=1$。事实上，若\
  \ $(f_1,\\ldots,f_m)$ 为相对于 $\\mathcal D$ 正定向的 $V$ 的任意正交归一基且 $(\\varphi^1,\\ldots,\\\
  varphi^m)$ 为其对偶基，则 $\\Omega_V=\\varphi^1\\wedge\\cdots\\wedge\\varphi^m$。*\n\n**证明.**\
  \ *存在性.* 由定理 7.2.9，$\\varphi^1\\wedge\\cdots\\wedge\\varphi^m(f_1,\\ldots,f_m)=1$，故\
  \ $\\varphi^1\\wedge\\cdots\\wedge\\varphi^m$ 为 $V$ 上的定向多余向量。于是 $\\varphi^1\\wedge\\\
  cdots\\wedge\\varphi^m$ 诱导 $V$ 的一个定向，其可能有两种，分别是 $\\mathcal D$ 和 $-\\mathcal D$。由于\
  \ $(f_1,\\ldots,f_m)$ 相对于 $\\mathcal D$ 正定向且 $\\varphi^1\\wedge\\cdots\\wedge\\\
  varphi^m(f_1,\\ldots,f_m)>0$，由定理 8.2.3，$\\varphi^1\\wedge\\cdots\\wedge\\varphi^m$\
  \ 诱导 $\\mathcal D$。由于 $(e_1,\\ldots,e_m)$ 相对于 $\\mathcal D$ 正定向，它们是相容的。由定理 8.3.3\
  \ 可得 $\\varphi^1\\wedge\\cdots\\wedge\\varphi^m(e_1,\\ldots,e_m)=1$。\n\n*唯一性.* 设\
  \ $\\varpi$ 为 $V$ 上的定向多余向量使得 $\\varpi(f_1,\\ldots,f_m)=1$。由定理 7.2.13(b) 可得\n\n$$\\\
  varpi=\\varpi(f_1,\\ldots,f_m)\\,\\varphi^1\\wedge\\cdots\\wedge\\varphi^m=\\varphi^1\\\
  wedge\\cdots\\wedge\\varphi^m.$$\n\n## 定理 8.3.5 (体积多余向量的表达式)。\n\n*设 $(V,g,\\mathcal\
  \ D)$ 为定向数量积空间，设 $\\mathcal H$ 为相对于 $\\mathcal D$ 正定向的 $V$ 的基，且设 $(\\theta^1,\\\
  ldots,\\theta^m)$ 为其对偶基。则*\n\n$$\\Omega_V=\\sqrt{|\\det(g_{\\mathcal H})|}\\,\\\
  theta^1\\wedge\\cdots\\wedge\\theta^m.$$\n\n\n\n\n证明。设 $(e_1,\\dots,e_m)$ 是 $V$\
  \ 的一个关于 $\\mathfrak{O}$ 为正定向的标准正交基，并设 $(\\xi^1,\\dots,\\xi^m)$ 是它的对偶基。由于 $(e_1,\\\
  dots,e_m)$ 和 $\\mathcal{H}$ 都是正定向的，所以它们是相容的。结果由定理 8.3.1(b) 和定理 8.3.4 得出。\n\n设 $(V,\\\
  mathfrak{g},\\mathfrak{O})$ 是一个维数 $m \\ge 2$ 的定向标量积空间，并设 $\\Omega_V$ 是其体积多重余向量。由定理\
  \ 8.3.4，$\\Omega_V$ 诱导出 $\\mathfrak{O}$。设 $U$ 是 $V$ 的一个维数为 $m-1$ 的子空间，且 $\\mathfrak{g}$\
  \ 在 $U$ 上非退化。由定理 4.1.2(b) 得 $U^\\perp$ 是 $V$ 的 1 维子空间，由定理 4.1.3 得 $V = U \\oplus\
  \ U^\\perp$。设 $u$ 是 $U^\\perp$ 中的单位向量，则 $\\mathbb{R}u = U^\\perp$，从而 $V = U \\oplus\
  \ \\mathbb{R}u$。因为 $\\mathfrak{g}$ 在 $U$ 上非退化，所以 $\\mathfrak{g}|_U$ 是 $U$ 上的一个标量积。由定理\
  \ 8.2.5 的 (a) 和 (b) 部分，$i_u(\\Omega_V)|_U$ 是 $U$ 上的一个定向多重余向量，它诱导出 $U$ 的某个定向，记为 $\\\
  mathfrak{O}_U$。因此，$(U,\\mathfrak{g}|_U,\\mathfrak{O}_U)$ 是维数 $m-1$ 的定向标量积空间。设 $\\\
  Omega_U$ 是其体积多重余向量。问题在于：定向多重余向量 $i_u(\\Omega_V)|_U$ 与 $\\Omega_U$ 是否相关？如下一个结果所示，它们是同一个对象。\n\
  \n## 定理 8.3.6。在上述设定下：\n\n(a)\n$i_u(\\Omega_V)|_U = \\Omega_U.$\n\n(b) 更一般地，若 $v$\
  \ 是 $V$ 中的向量，$\\epsilon$ 是 $\\langle u,u\\rangle$ 的符号，则\n\n$i_v(\\Omega_V)|_U =\
  \ \\epsilon\\langle u,v\\rangle\\Omega_U.$\n\n证明。(a)：设 $(e_1,\\dots,e_{m-1})$ 是\
  \ $U$ 的一个关于 $\\mathfrak{O}_U$ 为正定向的标准正交基。由定理 8.2.5(a) 得，$(u,e_1,\\dots,e_{m-1})$\
  \ 是 $V$ 的一个关于 $\\mathfrak{O}$ 为正定向的标准正交基，再由定理 8.3.4（应用于 $V$）得 $\\Omega_V(u,e_1,\\\
  dots,e_{m-1}) = 1$。根据定义，\n\n$i_u(\\Omega_V)|_U(e_1,\\dots,e_{m-1}) = \\Omega_V(u,e_1,\\\
  dots,e_{m-1})$，\n\n因此 $i_u(\\Omega_V)|_U(e_1,\\dots,e_{m-1}) = 1$。现在，由定理 8.3.4（应用于\
  \ $U$）给出的 $\\Omega_U$ 的唯一性，即可得结果。\n\n(b)：因为 $V = U \\oplus \\mathbb{R}u$，所以 $v =\
  \ (v - \\bar{v}) + \\bar{v}$，其中 $v - \\bar{v}$ 和 $\\bar{v}$ 分别是 $U$ 和 $\\mathbb{R}u$\
  \ 中的（唯一）向量。由定理 7.4.1(a)，\n\n$i_v(\\Omega_V)|_U = i_{v - \\bar{v}}(\\Omega_V)|_U\
  \ + i_{\\bar{v}}(\\Omega_V)|_U. \\quad (8.3.1)$\n\n由于 $w_1,\\ldots,w_{m-1}$ 是任意的，\n\
  \n$$i_{v-\\bar v}(\\Omega_V)|_U=0.$$\n\n对于第二项，由定理 4.1.5 得\n\n$$\\bar v=\\mathcal\
  \ P_{\\mathop{\\rm Rm}(U)}(v)=\\epsilon\\langle v,u\\rangle u,$$\n\n再由定理 7.4.1(b)\
  \ 和 (a) 部分得\n\n$$i_{\\bar v}(\\Omega_V)|_U=\\epsilon\\langle v,u\\rangle i_u(\\\
  Omega_V)|_U=\\epsilon\\langle v,u\\rangle\\Omega_U.$$\n\n将 (8.3.2) 和 (8.3.3) 代入\
  \ (8.3.1)，即得结果。\n\n## 8.4 向量积\n\n本节我们将 $\\mathbb R^3$ 中众所周知的向量积推广到任意标量积空间。\n\n设\
  \ $(V,g)$ 是符号差为 $(\\epsilon_1,\\ldots,\\epsilon_m)$ 的标量积空间，$\\mathcal E=(e_1,\\\
  ldots,e_m)$ 是 $V$ 的一个标准正交基，$v_1,\\ldots,v_{m-1}$ 是 $V$ 中的向量。$v_1,\\ldots,v_{m-1}$（按该顺序）关于\
  \ $\\mathcal E$ 的**向量积**（或叉积）定义为\n\n$$v_1\\times\\cdots\\times v_{m-1}=\\sum_{i=1}^{m}\\\
  epsilon_i(-1)^{i-1}\\det\\left(\\left[\\, [v_1]_{\\mathcal E}\\ \\cdots\\ [v_{m-1}]_{\\\
  mathcal E}\\,\\right]^{(i)c}\\right)e_i.$$\n\n其中 $(i)^c$ 是多重指标\n\n$$(i)^c=(1,\\\
  ldots,\\hat{i},\\ldots,m).$$\n\n显然，给定向量的向量积取决于它们被取出的顺序以及标准正交基的选取。\n\n> 在本章中，$V$\
  \ 上的向量积 $\\times$ 是关于 $V$ 的给定标准正交基 $\\mathcal E$ 计算的。\n\n> 在全文，$\\mathbb R^m_\\\
  nu$ 上的向量积 $\\times$ 是关于 $\\mathbb R^m_\\nu$ 的标准基计算的。\n\n我们可以如下得到 (8.4.1) 的一个计算上方便的替代形式。令\n\
  \n$$v_j=\\sum_i a_j^i e_i$$\n\n其中 $j=1,\\ldots,m-1$，于是由 (2.2.3)，\n\n$$\\left[\\\
  ,[v_1]_{\\mathcal E}\\ \\cdots\\ [v_{m-1}]_{\\mathcal E}\\,\\right]=\\begin{bmatrix}a_1^1&\\\
  cdots&a_{m-1}^1\\\\ \\vdots&\\ddots&\\vdots\\\\ a_1^m&\\cdots&a_{m-1}^m\\end{bmatrix}.$$\n\
  \n则 (8.4.1) 可以表示为如下形式恒等式\n\nv₁ × ⋯ × vₘ₋₁ = det( ⎛⎜⎝ ε₁e₁ a¹₁ ⋯ a¹ₘ₋₁ ⋮ ⋮ ⋱ ⋮ εₘeₘ\
  \ aᵐ₁ ⋯ aᵐₘ₋₁ ⎞⎟⎠ ), (8.4.3)\n\n只要我们将这个“行列式”沿第一列展开。\n\n当 $m = 2$ 时，即使 (8.4.1) 和\
  \ (8.4.3) 左端的记号简化为单个向量，右端仍然可以计算。设 $v = a^1e_1 + a^2e_2$。则 $v$ 的“向量积”为\n\ndet( ⎛⎜⎝\
  \ ε₁e₁ a¹ ε₂e₂ a² ⎞⎟⎠ ) = ε₁a²e₁ − ε₂a¹e₂.\n\n在上下文有意义的情况下，这个量与 $m \\ge 3$ 时的向量积具有相同的性质。\n\
  \n### 例 8.4.1（ℝ₀² 和 ℝ₀³ 上的向量积）。\n\n设 (e₁, e₂) 是 ℝ₀² 的标准基，并设 (a¹, a²) 是 ℝ₀² 中的向量。则\
  \ (a¹, a²) 的“向量积”为 (a², −a¹)。\n\n再设 (e₁, e₂, e₃) 是 ℝ₀³ 的标准基，并设 v = (a¹, a², a³)\
  \ 和 w = (b¹, b², b³) 是 ℝ₀³ 中的向量。则\n\n[v]ℰ = ⎡a¹⎤   以及   [w]ℰ = ⎡b¹⎤\n          ⎢a²⎥\
  \             ⎢b²⎥\n          ⎣a³⎦             ⎣b³⎦\n\n因此\n\nv × w = det( ⎛⎜⎝ e₁\
  \ a¹ b¹ e₂ a² b² e₃ a³ b³ ⎞⎟⎠ ) = (det(⎡a² b²⎤), −det(⎡a¹ b¹⎤), det(⎡a¹ b¹⎤)) =\
  \ (a²b³ − a³b², a³b¹ − a¹b³, a¹b² − a²b¹).\n\n特别地，\n\ne₁ × e₂ = e₃,      e₁ × e₃\
  \ = −e₂,      以及      e₂ × e₃ = e₁.\n\n### 例 8.4.2（ℝ₁² 和 ℝ₁³ 上的向量积）。\n\n设 (e₁, e₂)\
  \ 是 ℝ₁² 的标准基，并设 (a¹, a²) 是 ℝ₁² 中的向量。则 (a¹, a²) 的“向量积”为 (a², a¹)。\n\n再设 (e₁, e₂,\
  \ e₃) 是 ℝ₁³ 的标准基，并设 v = (a¹, a², a³) 和 w = (b¹, b², b³) 是 ℝ₁³ 中的向量。则\n\n[v]ℰ = ⎡a¹⎤\
  \   以及   [w]ℰ = ⎡b¹⎤\n          ⎢a²⎥             ⎢b²⎥\n          ⎣a³⎦          \
  \   ⎣b³⎦\n\n因此\n\nv × w = det( ⎛⎜⎝ e1 a1 b1 e2 a2 b2 −e3 a3 b3 ⎞⎟⎠ ) = ( det( [a2\
  \ b2; a3 b3] ), −det( [a1 b1; a3 b3] ), −det( [a1 b1; a2 b2] ) ) = (a2 b3 − a3 b2,\
  \ a3 b1 − a1 b3, a2 b1 − a1 b2).\n\n特别地，\n\ne1 × e2 = −e3,      e1 × e3 = −e2, \
  \     以及      e2 × e3 = e1.\n\n向量积具有许多有趣的代数性质，其中若干（不足为奇地）用行列式和楔积表示。\n\n## 定理 8.4.3。设\
  \ (V,g) 是维数 m ≥ 2 的标量积空间，ℰ 是 V 的一个标准正交基，v1,...,vm−1,w 是 V 中的向量，c 是实数。则对 i,j = 1,...,m−1：\n\
  \n- (a) ⟨vi, v1 × ⋯ × vm−1⟩ = 0.\n- (b) v1 × ⋯ × c vi × ⋯ × vm−1 = c(v1 × ⋯ × vi\
  \ × ⋯ × vm−1).\n- (c) v1 × ⋯ × (c vi + w) × ⋯ × vm−1 = c(v1 × ⋯ × vi × ⋯ × vm−1)\
  \ + v1 × ⋯ × w × ⋯ × vm−1.\n- (d) v1 × ⋯ × vi × ⋯ × vj × ⋯ × vm−1 = −(v1 × ⋯ × vj\
  \ × ⋯ × vi × ⋯ × vm−1).\n- (e) 若 vi = vj，则 v1 × ⋯ × vi × ⋯ × vj × ⋯ × vm−1 = 0.\n\
  \n证明。(a)：由 (8.4.1) 和 (8.4.2)，\n\n⟨vi, v1 × ⋯ × vm−1⟩ = ⟨∑j ai j ej, ∑k εk (−1)k−1\
  \ det( [ [v1]ℰ … [vi]ℰ … [vm−1]ℰ ]^(k)c ) ek ⟩ = ∑jk ai j ⟨ej, ek⟩ εk (−1)k−1 det(\
  \ [ [v1]ℰ … [vi]ℰ … [vm−1]ℰ ]^(k)c ) = ∑j (−1)j−1 ai j det( [ [v1]ℰ … [vi]ℰ … [vm−1]ℰ\
  \ ]^(j)c ) = det( [ [vi]ℰ [v1]ℰ … [vi]ℰ … ] ).\n\n由于 [[v_i]_E  [v_1]_E … [v_i]_E\
  \ … [v_{m-1}]_E] 的（至少）两列相等，由定理 2.4.2 可知其行列式等于 0。\n\n(b)–(d)：直接可证。\n\n根据定理 8.4.3(b)，我们去掉括号，并将\
  \ $c(v_1 \\times \\cdots \\times v_i \\times \\cdots \\times v_{m-1})$ 记作 $c v_1\
  \ \\times \\cdots \\times v_i \\times \\cdots \\times v_{m-1}$。\n\n下一个结果是考虑向量积的主要原因。\n\
  \n## 定理 8.4.4。设 (V,g) 是维数 m ≥ 2 的标量积空间，E 是 V 的一个标准正交基，v_1,…,v_{m-1} 是 V 中的向量，U 是由\
  \ v_1,…,v_{m-1} 张成的 V 的子空间。则 v_1 × ⋯ × v_{m-1} 是 U^⊥ 中的向量。\n\n证明。这可由定理 8.4.3(a)\
  \ 得出。\n\n乍一看，定理 8.4.4 似乎承诺得比它实际给出的更多。为了使结果真正有意义，我们需要 v_1 × ⋯ × v_{m-1} 是非零向量，且 U^⊥\
  \ 是 V 的 1 维子空间。这些条件可以通过进一步的假设来满足：参见定理 8.4.8 和定理 8.4.10(a)。\n\n前面曾指出，向量积取决于取用向量的顺序以及标准正交基的选取。根据定理\
  \ 8.4.3(d)，改变向量的顺序最多影响所得向量积的符号。鉴于 (8.4.1)，人们可能预期，相对于不同的标准正交基进行计算会对结果产生重大影响。正如定理\
  \ 8.4.4 所示，情况不一定如此：无论选择何种标准正交基，向量积总是在组成它的向量所张成的子空间的正交补中。事实上，后面的一些结果也具有这一特点：参见定理\
  \ 8.4.5、定理 8.4.6、定理 8.4.8 和定理 8.4.9。\n\n## 定理 8.4.5。设 (V,g) 是维数 m ≥ 2 且指标为 ν 的标量积空间。设\
  \ E 是 V 的一个标准正交基，$(\\xi^1,\\ldots,\\xi^m)$ 是它的对偶基，令 u, v_1,\\ldots,v_{m-1} 是 V 中的向量。则：\n\
  \n\n\n\n证明。设 ℰ = (e₁, …, eₘ)，且 V 的符号为 (ε₁, …, εₘ)。\n\n(a)：设 u = Σᵢ bⁱ eᵢ，于是 [u]ℰ\
  \ = [b¹ … bᵐ]ᵀ。我们由定理 2.4.6 和 (8.4.1) 得\n\n⟨u, v₁ × ⋯ × vₘ₋₁⟩\n= ⟨ Σᵢ bⁱ eᵢ, Σⱼ εⱼ\
  \ (−1)ʲ⁻¹ det( [[v₁]ℰ … [vₘ₋₁]ℰ]⁽ʲ⁾ᶜ ) eⱼ ⟩\n= Σᵢⱼ bⁱ ⟨eᵢ, eⱼ⟩ εⱼ (−1)ʲ⁻¹ det( [[v₁]ℰ\
  \ … [vₘ₋₁]ℰ]⁽ʲ⁾ᶜ )\n= Σᵢ (−1)ⁱ⁻¹ bⁱ det( [[v₁]ℰ … [vₘ₋₁]ℰ]⁽ⁱ⁾ᶜ )\n= det( [[u]ℰ [v₁]ℰ\
  \ … [vₘ₋₁]ℰ] ),\n\n这证明了第一个等式。由定理 1.2.1(d)，u = Σᵢ ξⁱ(u) eᵢ，故\n\n[u]ℰ = [ξ¹(u) … ξᵐ(u)]ᵀ,\n\
  \n[v₁]ℰ, …, [vₘ₋₁]ℰ 有相应的表达式。于是定理 7.2.8 给出\n\nξ¹ ∧ ⋯ ∧ ξᵐ(u, v₁, …, vₘ₋₁) = det(\
  \ [ ξ¹(u) ξ¹(v₁) … ξ¹(vₘ₋₁) ; ⋮ ⋮ ⋱ ⋮ ; ξᵐ(u) ξᵐ(v₁) … ξᵐ(vₘ₋₁) ] )\n= det( [[u]ℰ\
  \ [v₁]ℰ … [vₘ₋₁]ℰ] ),\n\n这证明了第二个等式。\n\n(b)：设\n\nP = [[u]ℰ [v₁]ℰ … [vₘ₋₁]ℰ],\n\n\
  并注意到 \U0001D52Eℰ = diag(ε₁, …, εₘ)。于是\n\ndet( [ ⟨u,u⟩ ⟨u,v₁⟩ … ⟨u,vₘ₋₁⟩ ; ⟨v₁,u⟩\
  \ ⟨v₁,v₁⟩ … ⟨v₁,vₘ₋₁⟩ ; ⋮ ⋮ ⋱ ⋮ ; ⟨vₘ₋₁,u⟩ ⟨vₘ₋₁,v₁⟩ … ⟨vₘ₋₁,vₘ₋₁⟩ ] )\n= det(Pᵀ\
  \ \U0001D52Eℰ P) [Th 3.1.2(b)]\n= det(\U0001D52Eℰ) det(P)²\n= (−1)ᵛ det(P)² [(4.2.3)]\n\
  = (−1)ᵛ ⟨u, v₁ × ⋯ × vₘ₋₁⟩². [part (a)]\n\n## 定理 8.4.6。设 (V, \U0001D524) 为维数 m ≥\
  \ 2 且指标为 ν 的数量积空间，设 ℰ 为 V 的标准正交基，且 v₁, …, vₘ₋₁, w₁, …, wₘ₋₁ 为 V 中的向量。则：\n\n由于 [[v_j]ℰ\
  \ [v₂]ℰ … [vₘ₋₁]ℰ] 在 (至少) 两个位置含有 [v_j]ℰ，故由定理 2.4.2 可知 det([[v_j]ℰ [v₂]ℰ … [vₘ₋₁]ℰ]^{(i)^c})\
  \ = 0 对 j = 2, …, m − 1 成立。于是，\n\ndet([[v₁]ℰ [v₂]ℰ … [vₘ₋₁]ℰ]^{(i)^c}) = 0\n\n对\
  \ i = 1, …, m 成立。由 (8.4.1) 可知 v₁ × ⋯ × vₘ₋₁ = 0。\n\n(⇐)：由于 span({v₁, …, vₘ₋₁}) 的维数至多为\
  \ m − 1，故存在向量 v₀ ∈ V \\ span({v₁, …, vₘ₋₁})。于是\n\n⟨v₀, v₁ × ⋯ × vₘ₋₁⟩ = 0\n⇔ det([[v₀]ℰ\
  \ [v₁]ℰ … [vₘ₋₁]ℰ]) = 0 [Th 8.4.5(a)]\n⇔ [v₀]ℰ, [v₁]ℰ, …, [vₘ₋₁]ℰ 线性相关 [Th 2.4.9]\n\
  ⇔ v₀, v₁, …, vₘ₋₁ 线性相关 [Th 2.2.1]\n⇔ v₁, …, vₘ₋₁ 线性相关。 [Th 1.1.2]\n\n因此，若 v₁ × ⋯\
  \ × vₘ₋₁ = 0，则 v₁, …, vₘ₋₁ 线性相关。\n\n向量在向量空间中是否线性无关或线性相关与是否存在数量积无关。这意味着在定理 8.4.8\
  \ 中，线性无关性可使用任意方便的数量积和标准正交基来检验。\n\n## 定理 8.4.9。设 (V, g) 为维数 m ≥ 2 的数量积空间，设 ℰ 为 V\
  \ 的标准正交基，设 U 为 V 的维数为 m − 1 的子空间，且 (u₁, …, uₘ₋₁) 为 U 的基。则 g 在 U 上非退化当且仅当 ||u₁ ×\
  \ ⋯ × uₘ₋₁|| ≠ 0。\n\n证明。g|_U 关于 (u₁, …, uₘ₋₁) 的矩阵为 [⟨u_i, u_j⟩]，于是\n\n- g 在 U 上非退化\n\
  - ⇔ g|_U 在 U 上非退化 [按定义]\n- ⇔ det([⟨u_i, u_j⟩]) ≠ 0 [Th 3.3.3]\n- ⇔ ⟨u₁ × ⋯ × uₘ₋₁,\
  \ u₁ × ⋯ × uₘ₋₁⟩ ≠ 0 [Th 8.4.6(a)]\n- ⇔ ||u₁ × ⋯ × uₘ₋₁|| ≠ 0.\n\n## 定理 8.4.10。设\
  \ (V, g) 为维数 m ≥ 2 的数量积空间，且 ℰ 为 V 的标准正交基。设 U 为 V 的维数为 m − 1 且 g 在其上非退化的子空间，设 (u₁,\
  \ …, uₘ₋₁) 为 U 的基，且 ε 为 ⟨u₁ × ⋯ × uₘ₋₁, u₁ × ⋯ × uₘ₋₁⟩ 的符号，于是\n\nε = ⟨ u₁ × ⋯ ×\
  \ uₘ₋₁ / ||u₁ × ⋯ × uₘ₋₁|| , u₁ × ⋯ × uₘ₋₁ / ||u₁ × ⋯ × uₘ₋₁|| ⟩ . (8.4.5)\n\n则：\n\
  \n- (a) $U^\\perp = \\mathbb{R}(u_1 \\times \\cdots \\times u_{m-1})$ 是 $V$ 的 1\
  \ 维子空间。\n\n- (b) $(\\epsilon u_1 \\times \\cdots \\times u_{m-1}, u_1, \\ldots,\
  \ u_{m-1})$ 是与 $\\mathcal{E}$ 相容的 $V$ 的基。\n\n- (c) 若 $(u_1, \\ldots, u_{m-1})$ 是\
  \ $U$ 的标准正交基，则 $(\\epsilon u_1 \\times \\cdots \\times u_{m-1}, u_1, \\ldots, u_{m-1})$\
  \ 是 $V$ 的标准正交基。\n\n*注。* 由定理 8.4.9，$\\langle u_1 \\times \\cdots \\times u_{m-1},\
  \ u_1 \\times \\cdots \\times u_{m-1} \\rangle \\neq 0$，故 ε 有定义且 (8.4.5) 中的分母非零。\n\
  \n*证明。* (a)：由定理 4.1.2(b) 可知 $U^\\perp$ 是 $V$ 的 1 维子空间，由定理 8.4.3(a) 可知 $u_1 \\times\
  \ \\cdots \\times u_{m-1}$ 在 $U^\\perp$ 中，且由定理 8.4.8 可知 $u_1 \\times \\cdots \\\
  times u_{m-1} \\neq 0$。结论得证。\n\n(b)：由定理 4.1.3，$V = U \\oplus U^\\perp$。由于 $(u_1,\
  \ \\ldots, u_{m-1})$ 是 $U$ 的基，由定理 1.1.2 和 (a) 可知 $\\mathcal{U} = (\\epsilon u_1\
  \ \\times \\cdots \\times u_{m-1}, u_1, \\ldots, u_{m-1})$ 是 $V$ 的基。我们由 (2.2.7)\
  \ 和定理 8.4.5(a) 得\n\n$\\det\\big([\\mathrm{id}_V]^\\mathcal{E}_\\mathcal{U}\\big)\
  \ = \\det\\big([\\epsilon u_1 \\times \\cdots \\times u_{m-1}]_\\mathcal{E}\\ [u_1]_\\\
  mathcal{E}\\ \\cdots\\ [u_{m-1}]_\\mathcal{E}\\big)$\n\n$= \\epsilon \\langle u_1\
  \ \\times \\cdots \\times u_{m-1}, u_1 \\times \\cdots \\times u_{m-1} \\rangle$\n\
  \n$= |\\langle u_1 \\times \\cdots \\times u_{m-1}, u_1 \\times \\cdots \\times\
  \ u_{m-1} \\rangle| > 0,$\n\n故 $\\mathcal{U}$ 与 $\\mathcal{E}$ 相容。\n\n(c)：由于 $(u_1,\
  \ \\ldots, u_{m-1})$ 正交，由定理 8.4.6(b) 可知 $||\\epsilon u_1 \\times \\cdots \\times\
  \ u_{m-1}|| = 1$，故 $\\epsilon u_1 \\times \\cdots \\times u_{m-1}$ 为单位向量。由定理 8.4.3(a)，$\\\
  langle \\epsilon u_1 \\times \\cdots \\times u_{m-1}, u_j \\rangle = 0$ 对 $j = 1,\
  \ \\ldots, m-1$ 成立。结论得证。$\\square$\n\n## 定理 8.4.11。设 $(V, \\mathfrak{g})$ 为维数 $m\
  \ \\ge 2$ 的数量积空间，设 $\\mathcal{E}$ 为 $V$ 的标准正交基，设 $U$ 为 $V$ 的维数为 $m-1$ 且 $\\mathfrak{g}$\
  \ 在其上非退化的子空间，且 $\\mathcal{U} = (u_1, \\ldots, u_{m-1})$ 和 $\\mathcal{V} = (v_1,\
  \ \\ldots, v_{m-1})$ 为 $U$ 的基。则：\n\n- (a)\n\n$u_1 \\times \\cdots \\times u_{m-1}\
  \ = \\det\\big([\\mathrm{id}_U]^\\mathcal{V}_\\mathcal{U}\\big)\\, v_1 \\times \\\
  cdots \\times v_{m-1}.$\n\n- (b)\n\n$\\frac{u_1 \\times \\cdots \\times u_{m-1}}{||u_1\
  \ \\times \\cdots \\times u_{m-1}||} = \\pm \\frac{v_1 \\times \\cdots \\times v_{m-1}}{||v_1\
  \ \\times \\cdots \\times v_{m-1}||},$\n\n其中正号（负号）是在 $\\mathcal{U}$ 和 $\\mathcal{V}$\
  \ 相容（不相容）时选取。\n\n*注。* 由定理 8.4.9，(b) 部分的分母非零。\n\n*证明。* (a)：设 $P = [\\mathrm{id}_U]^\\\
  mathcal{V}_\\mathcal{U}$ 且设 $A : U \\longrightarrow U$ 为线性同构，定义为 $A(\\mathcal{U})\
  \ = \\mathcal{V}$。由定理 8.4.7，\n\n$v_1 \\times \\cdots \\times v_{m-1} = \\det(A)\\\
  , u_1 \\times \\cdots \\times u_{m-1},$\n\n故 det(A) = det(P)^{-1}。结论得证。\n\n(b)：由定理\
  \ 2.4.12 和定理 8.4.9 可知 det(P)、||u₁ × ⋯ × uₘ₋₁|| 和 ||v₁ × ⋯ × vₘ₋₁|| 均非零。于是 (a) 给出\n\
  \nu₁ × ⋯ × uₘ₋₁ / ||u₁ × ⋯ × uₘ₋₁|| = det(P)/|det(P)| · v₁ × ⋯ × vₘ₋₁ / ||v₁ × ⋯\
  \ × vₘ₋₁|| = sgn(det(P)) · v₁ × ⋯ × vₘ₋₁ / ||v₁ × ⋯ × vₘ₋₁||.\n\n## 定理 8.4.12。设\
  \ (V, g) 为维数 m ≥ 2 的数量积空间，设 ℰ = (e₁, …, e_m) 和 ℱ 为 V 的标准正交基，且 ⊠ 表示对应于 ℱ 的向量积运算。则\n\
  \ne₁ ⊠ ⋯ ⊠ ê_i ⊠ ⋯ ⊠ e_m = ε_i (−1)^{i−1} det([id_V]_ℰ^ℱ) e_i\n\n对 i = 1, …, m 成立，其中\
  \ ^ 表示省略该表达式。\n\n证明。设 U_i 为由 e₁, …, ê_i, …, e_m 张成的 V 的子空间。由于 g 在 ℝe_i 上非退化，由定理\
  \ 4.1.3 可知 V = ℝe_i ⊕ (ℝe_i)⊥ 且 g 在 (ℝe_i)⊥ 上非退化。按定义，每个 e₁, …, ê_i, …, e_m 都与 e_i\
  \ 正交，故 U_i ⊆ (ℝe_i)⊥。由定理 1.1.18，\n\nm = dim(V) = dim(ℝe_i) + dim((ℝe_i)⊥) = 1 +\
  \ dim((ℝe_i)⊥),\n\n故 dim((ℝe_i)⊥) = m − 1 = dim(U_i)。\n\n由定理 1.1.7(b)，U_i = (ℝe_i)⊥，故\
  \ g 在 U_i 上非退化。由定理 4.1.2(c) 和定理 8.4.10(a) 可知 ℝe_i = U_i⊥ = ℝ(e₁ ⊠ ⋯ ⊠ ê_i ⊠ ⋯ ⊠\
  \ e_m)，\n\n故 e₁ ⊠ ⋯ ⊠ ê_i ⊠ ⋯ ⊠ e_m = c_i e_i 对某个实数 c_i 成立。我们有\n\nc_i ε_i = ⟨e_i,\
  \ c_i e_i⟩ = ⟨e_i, e₁ ⊠ ⋯ ⊠ ê_i ⊠ ⋯ ⊠ e_m⟩ = det([[e_i]_ℱ [e₁]_ℱ … [ê_i]_ℱ … [e_m]_ℱ])\
  \ [Th 8.4.5(a)] = (−1)^{i−1} det([[e₁]_ℱ … [e_i]_ℱ … [e_m]_ℱ]) [Th 8.4.3(d)] = (−1)^{i−1}\
  \ det([id_V]_ℰ^ℱ), [(2.2.7)]\n\n故 c_i = ε_i (−1)^{i−1} det([id_V]_ℰ^ℱ)。\n\n结论得证。\n\
  \n\n\n\n\n## 定理 8.4.13. 设 $(V,\\mathfrak{g})$ 是维数为 $m \\geq 2$ 的标量积空间，设 $\\mathcal{E}$\
  \ 和 $\\mathcal{F}$ 是 $V$ 的标准正交基，并设 $\\times$ 和 $\\boxtimes$ 表示相应的向量积运算。设 $U$ 是 $V$\
  \ 的维数为 $m-1$ 的子空间，且 $\\mathfrak{g}$ 在 $U$ 上非退化，并设 $(u_1,\\dots,u_{m-1})$ 是 $U$ 的一组基。则：\n\
  \n(a)\n$$u_1 \\boxtimes \\cdots \\boxtimes u_{m-1} = \\det\\big([\\mathrm{id}_V]_{\\\
  mathcal{E}}^{\\mathcal{F}}\\big)\\, u_1 \\times \\cdots \\times u_{m-1}.$$\n\n(b)\n\
  $$\\frac{u_1 \\boxtimes \\cdots \\boxtimes u_{m-1}}{\\|u_1 \\boxtimes \\cdots \\\
  boxtimes u_{m-1}\\|}= \\pm \\frac{u_1 \\times \\cdots \\times u_{m-1}}{\\|u_1 \\\
  times \\cdots \\times u_{m-1}\\|},$$\n其中，若 $\\mathcal{E}$ 和 $\\mathcal{F}$ 一致（不一致），则取正（负）号。\n\
  \n注记. 由定理 8.4.9，(b) 部分中的分母均非零。\n\n证明. (a)：设 $\\mathcal{E} = (e_1,\\dots,e_m)$，并设\n\
  $$P = [\\mathrm{id}_V]_{\\mathcal{E}}^{\\mathcal{F}} = \\big[[e_1]_{\\mathcal{F}}\\\
  ,\\cdots\\,[e_m]_{\\mathcal{F}}\\big],$$\n其中第二个等式来自 (2.2.7)。设\n$$Q = \\big[[u_1]_{\\\
  mathcal{E}}\\,\\cdots\\,[u_{m-1}]_{\\mathcal{E}}\\big],$$\n并设\n$$R_i = \\big(P^{(i)^c}\\\
  big)^{\\mathsf{T}}$$\n对 $i=1,\\dots,m$。由定理 2.1.6(b)，\n$$R_i^{(j)^c} = \\big(P_{(j)^c}^{(i)^c}\\\
  big)^{\\mathsf{T}}$$\n对 $j=1,\\dots,m$。由 (2.2.5) 可得\n$$\\big[[u_1]_{\\mathcal{F}}\\\
  ,\\cdots\\,[u_{m-1}]_{\\mathcal{F}}\\big] = [\\mathrm{id}_V]_{\\mathcal{E}}^{\\\
  mathcal{F}}\\big[[u_1]_{\\mathcal{E}}\\,\\cdots\\,[u_{m-1}]_{\\mathcal{E}}\\big]\
  \ = PQ,$$\n再由定理 2.1.6(c) 可得\n$$\\big[[u_1]_{\\mathcal{F}}\\,\\cdots\\,[u_{m-1}]_{\\\
  mathcal{F}}\\big]^{(i)^c} = P^{(i)^c}Q.$$\n\n于是 (8.4.1) 给出\n$$u_1 \\boxtimes \\\
  cdots \\boxtimes u_{m-1} = \\sum_i \\varepsilon_i (-1)^{i-1} \\det\\Big(\\big[[u_1]_{\\\
  mathcal{F}}\\,\\cdots\\,[u_{m-1}]_{\\mathcal{F}}\\big]^{(i)^c}\\Big) e_i$$\n$$=\
  \ \\sum_i \\varepsilon_i (-1)^{i-1} \\det\\big(P^{(i)^c}Q\\big) e_i.$$\n\n由定理 2.4.10(a)，\n\
  \n$$\\det(P^{(i)c}Q)=\\det(R_i^TQ)=\\sum_j\\det(R_i^{(j)c})\\det(Q^{(j)c})$$\n\n\
  $$=\\sum_j\\det\\left(P_{(j)}^{(i)c}\\right)\\det\\left(Q^{(j)c}\\right).$$\n\n\
  我们有\n\n$$P_{(j)}^{(i)c}=\\left(\\left[e_1\\right]_F\\ \\cdots\\ \\left[e_m\\right]_F\\\
  right)_{(j)c}^{(i)c}$$\n\n$$=\\left(\\left[e_1\\right]_F\\ \\cdots\\ \\widehat{\\\
  left[e_j\\right]_F}\\ \\cdots\\ \\left[e_m\\right]_F\\right)^{(i)c},$$\n\n其中 $\\\
  widehat{\\phantom{x}}$ 表示省略了一个表达式。上述三个恒等式合起来给出\n\n$$u_1\\boxtimes\\cdots\\boxtimes\
  \ u_{m-1}$$\n\n$$=\\sum_i\\varepsilon_i(-1)^{i-1}\\left(\\sum_j\\det\\left(P_{(j)}^{(i)c}\\\
  right)\\det\\left(Q^{(j)c}\\right)\\right)e_i$$\n\n$$=\\sum_j\\det\\left(Q^{(j)c}\\\
  right)\\left(\\sum_i\\varepsilon_i(-1)^{i-1}\\det\\left(\\left[\\left[e_1\\right]_F\\\
  \ \\cdots\\ \\widehat{\\left[e_j\\right]_F}\\ \\cdots\\ \\left[e_m\\right]_F\\right]^{(i)c}\\\
  right)e_i\\right)$$\n\n$$=\\sum_j\\det\\left(Q^{(j)c}\\right)e_1\\boxtimes\\cdots\\\
  boxtimes\\widehat{e_j}\\boxtimes\\cdots\\boxtimes e_m,$$\n\n其中最后一个等式来自 (8.4.1)。由定理\
  \ 8.4.12，\n\n$$e_1\\boxtimes\\cdots\\boxtimes\\widehat{e_j}\\boxtimes\\cdots\\boxtimes\
  \ e_m=\\varepsilon_j(-1)^{j-1}\\det(P)e_j$$\n\n对 $j=1,\\ldots,m$。因此，\n\n$$u_1\\\
  boxtimes\\cdots\\boxtimes u_{m-1}=\\det(P)\\sum_j\\varepsilon_j(-1)^{j-1}\\det\\\
  left(Q^{(j)c}\\right)e_j$$\n\n$$=\\det(P)\\sum_j\\varepsilon_j(-1)^{j-1}\\det\\\
  left(\\left[\\left[u_1\\right]_E\\ \\cdots\\ \\left[u_{m-1}\\right]_E\\right]^{(j)c}\\\
  right)e_j$$\n\n$$=\\det(P)u_1\\times\\cdots\\times u_{m-1},$$\n\n其中最后一个等式来自 (8.4.1)。\n\
  \n(b)：由定理 8.4.12 和定理 8.4.9，我们得到 $\\det(P)$、$\\|u_1\\times\\cdots\\times u_{m-1}\\\
  |$ 和 $\\|u_1\\boxtimes\\cdots\\boxtimes u_{m-1}\\|$ 均非零。于是定理 8.3.3 和 (a) 部分给出\n\n\
  $$\\frac{u_1\\boxtimes\\cdots\\boxtimes u_{m-1}}{\\|u_1\\boxtimes\\cdots\\boxtimes\
  \ u_{m-1}\\|}=\\frac{\\det(P)}{|\\det(P)|}\\frac{u_1\\times\\cdots\\times u_{m-1}}{\\\
  |u_1\\times\\cdots\\times u_{m-1}\\|}$$\n\n$$=\\operatorname{sgn}(\\det(P))\\frac{u_1\\\
  times\\cdots\\times u_{m-1}}{\\|u_1\\times\\cdots\\times u_{m-1}\\|}.$$\n\n## 8.4\
  \ 向量积\n\n## 8.5 霍奇星算子\n\n在本节中，我们定义一个映射，它为给定的多向量指派另一个“互补”的多向量。由此产生的方法进一步丰富了我们对多向量进行计算的技术储备。\n\
  \n### 定理 8.5.1. 设 $(V,g,\\mathcal{Q})$ 是维数为 $m$ 的定向标量积空间，设 $\\Omega_V$ 是其体积多向量，并设\
  \ $\\eta$ 是 $\\Lambda^s(V)$ 中的一个多向量，其中 $s\\le m$。则存在唯一的 $\\Lambda^{m-s}(V)$ 中的多向量\
  \ $\\star(\\eta)$，使得\n\n$$\\eta\\wedge\\zeta=\\langle\\star(\\eta),\\zeta\\rangle^\\\
  Lambda\\Omega_V$$\n\n对所有 $\\Lambda^{m-s}(V)$ 中的多向量 $\\zeta$ 成立，其中 $\\langle\\cdot,\\\
  cdot\\rangle^\\Lambda$ 是第 7.5 节中定义的标量积。\n\n**证明.** *存在性.* 由定理 7.2.12(d)，$(\\Omega_V)$\
  \ 是 $\\Lambda^m(V)$ 的一组基，因此\n\n$$\\eta\\wedge\\zeta=f_\\eta(\\zeta)\\,\\Omega_V$$\n\
  \n对某个实数 $f_\\eta(\\zeta)$ 成立。映射 $\\zeta\\mapsto f_\\eta(\\zeta)$ 定义了一个函数 $f_\\eta:\\\
  Lambda^{m-s}(V)\\to\\mathbb{R}$。显然，$f_\\eta$ 是线性的，所以 $f_\\eta$ 是 $\\Lambda^{m-s}(V)^*$\
  \ 中的一个多向量。回顾第 7.5 节末尾引入的平坦映射和尖锐映射：\n\n$$F^\\Lambda:\\Lambda^{m-s}(V)\\longrightarrow\\\
  Lambda^{m-s}(V)^*\\qquad\\text{and}\\qquad S^\\Lambda:\\Lambda^{m-s}(V)^*\\longrightarrow\\\
  Lambda^{m-s}(V).$$\n\n我们定义 $\\star(\\eta)=(f_\\eta)^{S^\\Lambda}$。则 $\\star(\\eta)$\
  \ 是 $\\Lambda^{m-s}(V)$ 中的一个多向量，且 $f_\\eta=(\\star(\\eta))^{F^\\Lambda}$。根据 (7.5.12)，$f_\\\
  eta(\\zeta)=\\langle\\star(\\eta),\\zeta\\rangle^\\Lambda$，所以\n\n$$\\eta\\wedge\\\
  zeta=\\langle\\star(\\eta),\\zeta\\rangle^\\Lambda\\Omega_V \\tag{8.5.1}$$\n\n对所有\
  \ $\\Lambda^{m-s}(V)$ 中的多向量 $\\zeta$ 成立。因此，$\\star(\\eta)$ 满足所要求的性质。\n\n*唯一性.* 假设\
  \ $\\zeta$ 是 $\\Lambda^{m-s}(V)$ 中满足指定性质的一个多向量；即\n\n$$\\eta\\wedge\\zeta=\\langle\\\

  \ 是一个有限非交换群。\n\n### B.2 置换群\n\n设 $m$ 为正整数，且 $Sₘ$ 为 $\\{1,2,\\ldots,m\\}$ 上的双射函数集合。在当前上下文中，$Sₘ$\

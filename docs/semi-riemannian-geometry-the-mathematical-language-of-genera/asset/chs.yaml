  gamma$ 和 $\\beta$ 具有相同的符号。然后\n\n$$-1<\\beta<1 \\qquad\\text{and}\\qquad \\gamma^2(1-\\\
  beta^2)=1. \\tag{22.1.3}$$\n\n当 $\\gamma\\ge 1$ 时，即最感兴趣的情况，\n\n$$0\\le\\beta<1 \\\
  qquad\\text{and}\\qquad \\gamma=\\frac{1}{\\sqrt{1-\\beta^2}}.$$\n\n给定 $L_m$ 中的映射\
  \ $A$，我们由定理 4.4.3 得 $\\det(A)=\\pm1$，由 (22.1.1) 得 $\\gamma\\ge1$ 或 $\\gamma\\le-1$。考虑集合\n\
  \n$$L_m^+ = \\{A\\in L_m:\\det(A)=1\\},$$\n\n$$L_m^{\\uparrow}=\\{A\\in L_m:\\gamma\\\
  ge1\\},$$\n\n和\n\n$$L_m^{+\\uparrow}=L_m^+\\cap L_m^{\\uparrow}.$$\n\n在当前语境中，保向（反向）的映射被称为\
  \ **proper（improper）**。\n\n## 定理 22.1.3. *设 $A$ 是 $L_m$ 中的映射。则 $A$ 在 $L_m^{+\\uparrow}$\
  \ 中的充要条件是 $A$ 为 proper。*\n\n*证明.* 由于 $\\det(A)=+1$，结果由定理 8.2.8 得出。\n\n让我们回顾第 4.9\
  \ 节中采用的约定：对于 $V$ 的给定标准正交基 $(e_1,\\ldots,e_m)$，未来时间锥 $\\mathcal T^+$ 定义为包含类时单位向量\
  \ $e_m$ 的那个锥。\n\n## 定理 22.1.4. *若 $A$ 是 $L_m$ 中的映射，则以下条件等价：*  \n(a) $A$ 在 $L_m^{\\\
  uparrow}$ 中。  \n(b) $A(e_m)$ 在 $\\mathcal T^+$ 中。  \n(c) $A$ 为 orthochronous。\n\n\
  *证明.* (a) $\\Longleftrightarrow$ (b)：根据关于 $e_m$ 的上述约定，我们由 (4.9.8) 得 $A(e_m)$ 在 $\\\
  mathcal T^+$ 中当且仅当 $\\langle A(e_m),e_m\\rangle<0$。由于 $[e_m]=[0\\ \\cdots\\ 0\\\
  \ 1]^{\\mathsf T}$，由定理 2.2.4，\n\n$$[A(e_m)]=\\begin{bmatrix}[A^1_m]_2\\\\ \\gamma\\\
  end{bmatrix},$$\n\n并且因为 $g_{\\mathcal E}=\\operatorname{diag}(1,\\ldots,1,-1)$，由定理\
  \ 3.1.2(a)，\n\n$$\\langle A(e_m),e_m\\rangle=[A(e_m)]^{\\mathsf T}g_{\\mathcal E}[e_m]=-\\\
  gamma.$$\n\n由此可得 $\\langle A(e_m),e_m\\rangle<0$ 当且仅当 $\\gamma>0$。由于 $\\gamma^2\\\
  ge1$，我们有 $\\gamma>0$ 当且仅当 $\\gamma\\ge1$。因此，$A(e_m)$ 在 $\\mathcal T^+$ 中当且仅当 $\\\
  gamma\\ge1$。\n\n(b) $\\Longleftrightarrow$ (c)：给定关于 $e_m$ 的上述约定，这由定理 4.9.6 得出。\n\
  \n鉴于前述两个结果，我们可以如下刻画 $L_m^+$、$L_m^{\\uparrow}$ 和 $L_m^{+\\uparrow}$：\n\n$$L_m^+ =\
  \ \\{A \\in L_m : A\\text{ is proper}\\},$$\n\n$$L_m^{\\uparrow} = \\{A \\in L_m\
  \ : A\\text{ is orthochronous}\\},$$\n\n和\n\n$$L_m^{+\\uparrow} = \\{A \\in L_m\
  \ : A\\text{ is proper and orthochronous}\\}.$$\n\n## 定理 22.1.5. $L_m^+$、$L_m^{\\\
  uparrow}$ 和 $L_m^{+\\uparrow}$ 都是 $L_m$ 的子群。\n\n*证明.* 易证 $L_m^+$ 是 $L_m$ 的子群。利用定理\
  \ 4.9.6，可知 $L_m^{\\uparrow}$ 是 $L_m$ 的子群。由于子群的交集是子群，$L_m^{+\\uparrow}$ 的结果即得。\n\n\
  在物理文献中，$L_m^{+\\uparrow}$ 被称为 $V$ 上的 **proper orthochronous Lorentz group**。\n\n\
  回顾第 2.4 节， 正交群 $O(m)$ 由 $\\operatorname{Mat}_{m\\times m}$ 中满足 $P^\\mathsf{T}P=I_m$\
  \ 的所有矩阵 $P$ 组成，而特殊正交群 $SO(m)$ 是 $O(m)$ 的子群，由满足 $\\det(P)=1$ 的矩阵 $P$ 组成。\n\n我们说 $\\\
  operatorname{Lin}(V,V)$ 中的映射 $A$ 是关于 $\\vartheta$ 的 **rotation**（旋转）如果 $[A]$ 的形式为\n\
  \n$$[A]=\\begin{bmatrix}[A]^1_1 & O_{(m-1)\\times 1}\\\\ O_{1\\times(m-1)} & 1\\\
  end{bmatrix},$$\n\n其中 $[A]^1_1$ 在 $SO(m-1)$ 中。按定义，$\\det([A]^1_1)=1$，故 $\\det(A)=1$。旋转的集合为\n\
  \n$$R_m=\\{A\\in\\operatorname{Lin}(V,V): A\\text{ a rotation}\\}.$$\n\n## 定理 22.1.6.\
  \ $R_m$ 是 $L_m^{+\\uparrow}$ 的子群。\n\n*证明.* 由于 $SO(m-1)$ 是群，易证 $R_m$ 也是群。设 $A$ 是\
  \ $R_m$ 中的映射。我们由 $\\mathfrak g=\\operatorname{diag}(1,\\ldots,1,-1)$ 得\n\n$$[A]^\\\
  mathsf{T}\\mathfrak g[A]=\\begin{bmatrix}([A]^1_1)^\\mathsf{T}[A]^1_1 & O_{(m-1)\\\
  times1}\\\\ O_{1\\times(m-1)} & -1\\end{bmatrix}=\\begin{bmatrix}I_{m-1} & O_{(m-1)\\\
  times1}\\\\ O_{1\\times(m-1)} & -1\\end{bmatrix}=\\mathfrak g.$$\n\n由定理 4.4.2，$A$\
  \ 是线性等距映射，因而在 $L_m$ 中。由于 $\\det(A)=1$，$A$ 在 $L_m^+$ 中。按定义 $\\gamma=1$，故 $A$ 在 $L_m^{\\\
  uparrow}$ 中。这表明 $A$ 在 $L_m^{+\\uparrow}$ 中。因此 $R_m\\subseteq L_m^{+\\uparrow}$。\n\
  \n## 定理 22.1.7. 若 $A$ 是 $L_m^{+\\uparrow}$ 中的映射，则以下条件等价：\n\n- (a) $A$ 在 $R_m$ 中。\
  \  \n- (b) $\\gamma=1$。  \n- (c) $[A]^1_2=O_{(m-1)\\times1}$。  \n- (d) $[A]^2_1=O_{1\\\
  times(m-1)}$。\n\n证明. (b) ⇒ (c)：我们由定理 22.1.2(d) 得\n\n$$(a_m^1)^2 + \\cdots + (a_m^{m-1})^2\
  \ = 0,$$\n\n由此结果得证。\n\n(c) ⇒ (b)：由定理 22.1.2(d)，$\\gamma^2 = 1$，故 $\\gamma = \\pm\
  \ 1$。由于 $A$ 在 $\\mathrm{L}_m^\\uparrow$ 中，我们有 $\\gamma = 1$。\n\n(c) ⇔ (d)：我们由定理\
  \ 22.1.2(d) 得\n\n$$(a_m^1)^2 + \\cdots + (a_m^{m-1})^2 = (a_1^m)^2 + \\cdots + (a_{m-1}^m)^2,$$\n\
  \n由此结果得证。\n\n(a) ⇒ (b)：由定义。\n\n(b) ⇒ (a)：我们刚刚证明了 (b)、(c) 和 (d) 等价，故 $[A]$ 的形式为\n\
  \n$$[A] = \\begin{bmatrix} [A]_1^1 & O_{(m-1)\\times 1} \\\\ O_{1\\times (m-1)}\
  \ & 1 \\end{bmatrix}$$\n\n对于某个矩阵 $[A]_1^1$ 在 $\\mathrm{Mat}_{(m-1)\\times (m-1)}$\
  \ 中。由定理 22.1.2(a)，$[A]_1^1 ([A]_1^1)^\\mathrm{T} = I_{m-1}$，故 $[A]_1^1$ 在 $\\mathrm{O}(m-1)$\
  \ 中。由于 $A$ 在 $\\mathrm{L}_m^\\uparrow$ 中，我们有 $\\det([A]_1^1) = \\det([A]) = 1$，所以\
  \ $[A]_1^1$ 在 $\\mathrm{SO}(m-1)$ 中。因此 $A$ 在 $\\mathrm{R}_m$ 中。\n\n我们说 $\\mathrm{Lin}(V,V)$\
  \ 中的映射 $A$ 是 boost（关于 $\\mathcal{E}$ 在第 $(m-1)$ 个类空方向）如果 $[A]$ 的形式为\n\n$$[A] = \\\
  begin{bmatrix} I_{m-2} & O_{(m-2)\\times 2} \\\\ O_{2\\times (m-2)} & \\begin{bmatrix}\
  \ \\gamma & -\\beta\\gamma \\\\ -\\beta\\gamma & \\gamma \\end{bmatrix} \\end{bmatrix},$$\n\
  \n其中 $\\gamma \\ge 1$ 且 $\\beta$ 由 (22.1.2) 计算。为记号方便，我们已在第 $(m-1)$ 个类空方向定义了 boost，但任何其他类空方向亦可。例如，第一类空方向的\
  \ boost 形式为\n\n$$\\begin{bmatrix} \\gamma & O_{1\\times (m-2)} & -\\beta\\gamma\
  \ \\\\ O_{(m-2)\\times 1} & I_{m-2} & O_{(m-2)\\times 1} \\\\ -\\beta\\gamma & O_{1\\\
  times (m-2)} & \\gamma \\end{bmatrix}.$$\n\nboost 的集合为\n\n$$\\mathrm{B}_m = \\{A\
  \ \\in \\mathrm{Lin}(V,V) : A \\text{ a boost}\\}.$$\n\n显然 $\\mathrm{B}_m$ 包含恒等映射。设\
  \ $A'$ 是另一个 boost，且\n\n$$[A'] = \\begin{bmatrix} I_{m-2} & O_{(m-2)\\times 2} \\\
  \\ O_{2\\times (m-2)} & \\begin{bmatrix} \\gamma' & -\\beta'\\gamma' \\\\ -\\beta'\\\
  gamma' & \\gamma' \\end{bmatrix} \\end{bmatrix}.$$\n\n则\n\n$$[A][A'] = \\begin{bmatrix}\
  \ I_{m-2} & O_{(m-2)\\times 2} \\\\ O_{2\\times (m-2)} & \\begin{bmatrix} \\gamma''\
  \ & -\\beta''\\gamma'' \\\\ -\\beta''\\gamma'' & \\gamma'' \\end{bmatrix} \\end{bmatrix},$$\n\
  \n其中\n\\[\\gamma'' = \\gamma\\gamma'(1 + \\beta\\beta')\\quad\\text{and}\\quad\\\
  beta'' = \\frac{\\beta + \\beta'}{1 + \\beta\\beta'}.\\]\n\n易证 $\\gamma'' \\ge 1$，且\
  \ $\\gamma''$ 与 $\\beta''$ 满足 (22.1.2)。因此 $A \\circ A'$ 是 boost。这证明了 $\\mathrm{B}_m$\
  \ 在乘法下封闭。然而，\n\n\\[\\begin{bmatrix} I_{m-2} & O_{(m-2)\\times 2} \\\\ O_{2\\times(m-2)}\
  \ & \\begin{bmatrix} \\gamma & -\\beta\\gamma \\\\ -\\beta\\gamma & \\gamma \\end{bmatrix}\
  \ \\end{bmatrix}^{-1} = \\begin{bmatrix} I_{m-2} & O_{(m-2)\\times 2} \\\\ O_{2\\\
  times(m-2)} & \\begin{bmatrix} \\gamma & \\beta\\gamma \\\\ \\beta\\gamma & \\gamma\
  \ \\end{bmatrix} \\end{bmatrix}.\\]\n\n由于右边的矩阵缺少使之成为 boost 所需的负号，$\\mathrm{B}_m$\
  \ 不包含逆元（除恒等映射情形外）。因此 $\\mathrm{B}_m$ 不是群。\n\n## 定理 22.1.8. $\\mathrm{B}_m$ 是 $\\\
  mathrm{L}_m$ 的子集。\n\n*证明.* 设 $A$ 是 $\\mathrm{B}_m$ 中的映射。我们由 $\\mathfrak{g}_\\mathcal{E}\
  \ = \\operatorname{diag}(1,\\dots,1,-1)$ 及 (22.1.3) 中的恒等式得\n\n\\[[A]^\\mathrm{T}\\\
  ,\\mathfrak{g}_\\mathcal{E}\\,[A] = \\begin{bmatrix} I_{m-2} & O_{(m-2)\\times 2}\
  \ \\\\ O_{2\\times(m-2)} & \\begin{bmatrix} \\gamma & \\beta\\gamma \\\\ -\\beta\\\
  gamma & -\\gamma \\end{bmatrix} \\begin{bmatrix} \\gamma & -\\beta\\gamma \\\\ -\\\
  beta\\gamma & \\gamma \\end{bmatrix} \\end{bmatrix}\n= \\begin{bmatrix} I_{m-2}\
  \ & O_{(m-2)\\times 2} \\\\ O_{2\\times(m-2)} & \\begin{bmatrix} 1 & 0 \\\\ 0 &\
  \ -1 \\end{bmatrix} \\end{bmatrix} = \\mathfrak{g}_\\mathcal{E}.\\]\n\n由定理 4.4.2，$A$\
  \ 是线性等距映射，因而在 $\\mathrm{L}_m$ 中。\n\n## 定理 22.1.9. $\\mathrm{R}_m \\cap \\mathrm{B}_m\
  \ = \\{\\mathrm{id}_V\\}$。\n\n*证明.* 若 $A$ 在 $\\mathrm{R}_m \\cap \\mathrm{B}_m$\
  \ 中，则在上述记号下，\n\n\\[\\begin{bmatrix} [A]^1_1 & O_{(m-1)\\times 1} \\\\ O_{1\\times(m-1)}\
  \ & 1 \\end{bmatrix} = [A] = \\begin{bmatrix} I_{m-2} & O_{(m-2)\\times 2} \\\\\
  \ O_{2\\times(m-2)} & \\begin{bmatrix} \\gamma & -\\beta\\gamma \\\\ -\\beta\\gamma\
  \ & \\gamma \\end{bmatrix} \\end{bmatrix},\\]\n\n其中按定义 $[A]^1_1$ 在 $\\mathrm{SO}(m-1)$\
  \ 中，$\\gamma \\ge 1$，且 $\\beta$ 由 (22.1.2) 计算。由此可得 $\\gamma = 1$，再由 (22.1.2) 得 $\\\
  beta = 0$。因此 $[A] = I_m$。\n\n基于定理 22.1.5、定理 22.1.6、定理 22.1.8 和定理 22.1.9，图 22.1.1\
  \ 描述了 $\\mathrm{R}_m$、$\\mathrm{B}_m$ 与 $\\mathrm{L}_m^{\\pm\\uparrow}$ 作为 $\\mathrm{L}_m$\
  \ 子集之间的关系，其中点表示 $\\mathrm{id}_V$。\n\n回顾第 2.4 节，列矩阵的向量空间 $\\mathrm{Mat}_{m\\times\
  \ 1}$ 及其基 $\\mathbb{E}_m = (E_1,\\dots,E_m)$。我们通过选取定向 $\\mathbb{O}_m = [\\mathbb{E}_m]$\
  \ 并利用矩阵乘法定义内积，使 $\\mathrm{Mat}_{m\\times 1}$ 成为定向内积空间：对于 $\\mathrm{Mat}_{m\\times\
  \ 1}$ 中的矩阵 $P,Q$，内积为 $P^T Q$。赋予此结构后，我们以明显的方式将 $\\mathrm{Mat}_{m\\times 1}$ 与内积空间\
  \ $\\mathbb{R}_0^m$ 识别。\n\n\n\n\n\n![](img/d712710a8eb78c0959204afd5dde4c91_608_0.png)\n\
  \n# 图 22.1.1. R_m、B_m、L_m^{+↑} 和 L_m\n\n# 定理 22.1.10.\n\n设 P₁, …, P_{m−1} 是 Mat_{(m−1)×1}\
  \ 中的矩阵，并考虑矩阵\n\n\U0001D561 = (P₁, …, P_{m−1}),      P₁¹ = [P₁ ⋯ P_{m−1}],\n\n以及\n\
  \nP = [ P₁¹   O_{(m−1)×1} ; O_{1×(m−1)}   1 ].\n\n则：\n\n+   (a) \U0001D561 是 Mat_{(m−1)×1}\
  \ 的标准正交基，当且仅当 P₁¹ 属于 O(m−1)。\n+   (b) \U0001D561 是 Mat_{(m−1)×1} 的正定向标准正交基，当且仅当\
  \ P₁¹ 属于 SO(m−1)。\n+   (c) 若 \U0001D561 是 Mat_{(m−1)×1} 的正定向标准正交基，且 A 是 Lin(V,V)\
  \ 中的映射，满足 [A] = P 或 [A] = Pᵀ，则 A 属于 R_m。\n\n证明. 为简洁起见，设 \U0001D544 = Mat_{(m−1)×1}，\U0001D53C\
  \ = \U0001D53C_{m−1}。由 (2.2.7) 有\n\nP₁¹ = [[P₁]_\U0001D53C ⋯ [P_{m−1}]_\U0001D53C\
  ] = [id_\U0001D544]_\U0001D561^\U0001D53C,\n\n因此\n\ndet(P₁¹) = det( [id_\U0001D544\
  ]_\U0001D561^\U0001D53C ).    (22.1.4)\n\n由此可见，若 \U0001D561 是 \U0001D544 的基，则：\U0001D561\
  \ 与 \U0001D53C 一致（从而正定向）当且仅当 det(P₁¹) > 0。\n\n(a)：根据定义，P₁¹ 属于 O(m−1) 当且仅当 (P₁¹)ᵀ\
  \ P₁¹ = I_{m−1}，这等价于 (P_i)ᵀ P_j = δ^i_j, i, j = 1, …, m−1。\n\n(b)(⇒)：由于 \U0001D561\
  \ 是标准正交基，由 (a) 部分可知 P₁¹ 属于 O(m−1)。于是\n\n1 = det(I_{m−1}) = det((P₁¹)ᵀ P₁¹) = det(P₁¹)²,\n\
  \n所以 det(P₁¹) = ±1。由于 \U0001D561 正定向，因此与 \U0001D53C 一致，由 (22.1.4) 得 det(P₁¹) = 1。因此，P₁¹\
  \ 属于 SO(m − 1)。\n\n(b)(⇐)：由于 P₁¹ 属于 SO(m − 1)，而 SO(m − 1) 是 O(m − 1) 的子群，由 (a) 部分可知\
  \ \U0001D561 是 \U0001D544 的标准正交基。又因为 P₁¹ 属于 SO(m − 1)，所以 det(P₁¹) = 1。由 (22.1.4)\
  \ 得 \U0001D561 与 \U0001D53C 一致，从而正定向。\n\n(c)：若 [A] = P，则结果由 (b) 部分得出。假设 [A] = Pᵀ，此时\
  \ [A] = [(P₁¹)ᵀ  O_{(m−1)×1}; O_{1×(m−1)} 1]。\n\n设 (P₁¹)ᵀ = [Q₁ … Q_{m−1}]，其中 Q₁,…,Q_{m−1}\
  \ 是 \U0001D544 中的矩阵，并设 ℚ = (Q₁,…,Q_{m−1})。由于 \U0001D561 是 \U0001D544 的基，由定理 2.3.2\
  \ 可知 ℚ 也是 \U0001D544 的基。此外，因为 \U0001D561 是标准正交的，ℚ 也是标准正交的。类似上面的论证给出 (P₁¹)ᵀ = [[Q₁]_\U0001D53C\
  \ … [Q_{m−1}]_\U0001D53C] = [id_\U0001D544]_\U0001D53C^ℚ，\n\n因此 det(P₁¹) = det([id_\U0001D544\
  ]_ℚ^\U0001D53C)。由于 \U0001D561 正定向，由 (22.1.4) 可知 ℚ 也正定向。我们已证明 ℚ 是 \U0001D544 的正定向标准正交基。结果现在由\
  \ (b) 部分得出。\n\n我们通过证明固有正时洛伦兹群中的任何映射都可以表示为一个旋转、一个推进和另一个旋转的复合来结束本节。\n\n# 定理 22.1.11.\
  \ L_m^{↑+} 中的任何映射 A 都可以表示为 A = R₁ ∘ B ∘ R₂，其中 R₁, R₂ 是 R_m 中的映射，B 是 B_m 中的映射。\n\n\
  证明. 若 ([A]₂¹)ᵀ[A]₂¹ = 0，则 [A]₂¹ = O_{(m−1)×1}。由定理 22.1.7，A 属于 R_m，因此在这种情况下我们设 R₁\
  \ = A，B = R₂ = id_V。\n\n现在假设 ([A]₂¹)ᵀ[A]₂¹ ≠ 0，并令 P_{m−1} = − 1/βγ [A]₂¹, (22.1.5)\n\
  \n则 (22.1.5) 给出\n\n$$P_1^1[A]_2^1=-\\beta\\gamma\\begin{bmatrix}(P_1)^\\mathrm{T}P_{m-1}\\\
  \\ \\vdots\\\\ (P_{m-1})^\\mathrm{T}P_{m-1}\\end{bmatrix}=[0\\ \\cdots\\ 0\\ -\\\
  beta\\gamma]^\\mathrm{T}.$$\n\n设\n\n$$P_1^1[A]_1^1=[Q_1\\ \\cdots\\ Q_{m-1}]^\\\
  mathrm{T},$$\n\n其中 $Q_1,\\ldots,Q_{m-1}$ 是 $\\operatorname{Mat}_{(m-1)\\times 1}$\
  \ 中的矩阵。我们有\n\n$$\\begin{bmatrix}(Q_1)^\\mathrm{T}\\\\ \\vdots\\\\ (Q_{m-1})^\\mathrm{T}\\\
  end{bmatrix}[Q_1\\ \\cdots\\ Q_{m-1}]$$\n\n$$=(P_1^1[A]_1^1)(P_1^1[A]_1^1)^\\mathrm{T}$$\n\
  $$=P_1^1\\big([A]_1^1([A]_1^1)^\\mathrm{T}\\big)(P_1^1)^\\mathrm{T}$$\n$$=P_1^1\\\
  big(I_{m-1}+[A]_2^1([A]_2^1)^\\mathrm{T}\\big)(P_1^1)^\\mathrm{T}\\quad[\\text{Th\
  \ 22.1.2(a)}]$$\n$$=I_{m-1}+(P_1^1[A]_2^1)(P_1^1[A]_2^1)^\\mathrm{T}\\quad[\\text{Th\
  \ 22.1.10(a)}]$$\n$$=I_{m-1}+\\operatorname{diag}(0,\\ldots,0,\\beta^2\\gamma^2)\\\
  quad[(22.1.8)]$$\n$$=\\begin{bmatrix}I_{m-2}&O_{(m-2)\\times1}\\\\O_{1\\times(m-2)}&\\\
  gamma^2\\end{bmatrix}\\quad[(22.1.3)].$$\n\n这表明 $(Q_1,\\ldots,Q_{m-1})$ “接近”于 $\\\
  operatorname{Mat}_{(m-1)\\times1}$ 的标准正交基。由于 $A$ 属于 $L_m^+$，根据定义有 $\\gamma\\geq1$。令\
  \ $\\varepsilon=\\pm1$，并令\n\n$$R_{m-1}=\\frac{\\varepsilon}{\\gamma}Q_{m-1}.$$\n\
  \n由 (22.1.10) 可知 $R_{m-1}$ 是单位向量，且\n\n$$(Q_{m-1})^\\mathrm{T}R_{m-1}=\\varepsilon\\\
  gamma.$$\n\n对于适当选取的 $\\varepsilon$，$(Q_1,\\ldots,Q_{m-2},R_{m-1})$ 是 $\\operatorname{Mat}_{(m-1)\\\
  times1}$ 的正定向标准正交基。（我们很快会看到，事实上 $\\varepsilon=1$。）设\n\n$$R_1^1=[Q_1\\ \\cdots\\\
  \ Q_{m-2}\\ R_{m-1}]^\\mathrm{T}$$\n\n以及\n\n$$R=\\begin{bmatrix}R_1^1&O_{(m-1)\\\
  times1}\\\\O_{1\\times(m-1)}&1\\end{bmatrix}.$$\n\n由定理 2.2.3(a) 可知，存在 $\\operatorname{Lin}(V,V)$\
  \ 中的映射 $F$ 和 $G$，使得\n\n$$[F]=P\\quad\\text{and}\\quad[G]=R^\\mathrm{T}.$$\n\n因此\n\
  [F ○ A ○ G] = [F][A][G]      [Th 2.2.2(c)]\n= P[A]Rᵀ      [(22.1.14)]\n= ⎡ P₁¹[A]₁¹(R₁¹)ᵀ\
  \   P₁¹[A]₁² ⎤ .      [(22.1.7), (22.1.13)]\n  ⎣ [A]₁²(R₁¹)ᵀ      γ      ⎦\n(22.1.15)\n\
  \n我们寻求 P₁¹[A]₁¹(R₁¹)ᵀ 和 [A]₁²(R₁¹)ᵀ 的替代表达式。对于前者，\n\nP₁¹[A]₁¹(R₁¹)ᵀ\n= ⎡ (Q₁)ᵀ ⎤\
  \ ⎡ Q₁ ⋯ Qₘ₋₂  Rₘ₋₁ ⎤  [(22.1.9), (22.1.12)]\n  ⎢  ⋮  ⎥\n  ⎢(Qₘ₋₂)ᵀ⎥\n  ⎣(Qₘ₋₁)ᵀ⎦\n\
  (22.1.16)\n= ⎡ Iₘ₋₂   O₍ₘ₋₂₎×₁ ⎤ .      [(22.1.10), (22.1.11)]\n  ⎣ O₁×₍ₘ₋₂₎  εγ\
  \   ⎦\n\n对于后者，\n\n[Q₁ ⋯ Qₘ₋₁] = ([A]₁¹)ᵀ (P₁¹)ᵀ      [(22.1.9)]\n= [ ([A]₁¹)ᵀ P₁\
  \ ⋯ ([A]₁¹)ᵀ Pₘ₋₁ ],      [(22.1.6)]\n\n因此\nQₘ₋₁ = ([A]₁¹)ᵀ Pₘ₋₁\n= -1/βγ ([A]₁¹)ᵀ\

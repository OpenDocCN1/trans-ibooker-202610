  \  ...   [p_1^m ... p_n^m]\n```\n\n而 $P$ 的列矩阵为\n\n[p1^1; :; p1^m]   [p2^1; :; p2^m]\
  \   ...   [p_n^1; :; p_n^m].\n\n### 例 2.1.1. 对于\n\nP = [1 2 3; 4 5 6; 7 8 9],\n\n\
  其转置为\n\nP^T = [1 4 7; 2 5 8; 3 6 9]\n\n而列矩阵为\n\n[1;4;7]   [2;5;8]   [3;6;9].\n\n\
  ### 定理 2.1.2. 若 $P$ 和 $Q$ 分别是 $\\mathrm{Mat}_l\\times m$ 和 $\\mathrm{Mat}_m\\times\
  \ n$ 中的矩阵，则：\n\n- (a) $(P^T)^T = P$.\n- (b) $(PQ)^T = Q^T P^T$.\n\n证明。直接可证。\n\n\
  我们称 $\\mathrm{Mat}_m\\times m$ 中的矩阵 $Q = [q^i_j]$ 为对称的，如果 $Q = Q^T$，并且为对角的，如果对所有\
  \ $i \\neq j$ 有 $q^i_j = 0$。显然，对角矩阵是对称的。给定 $\\mathbb{R}^m$ 中的向量 $(a^1, …, a^m)$，相应的对角矩阵定义为\n\
  \ndiag(a^1, …, a^m) = [a^1 … 0; : ⋱ :; 0 … a^m],\n\n其中不在（左上到右下）对角线上的所有元素都等于 0。例如，\n\
  \ndiag(1) = [1]      diag(1,2) = [1 0; 0 2]      diag(1,2,3) = [1 0 0; 0 2 0; 0\
  \ 0 3].\n\n$\\mathrm{Mat}_m\\times n$ 中的零矩阵，用 $O_m\\times n$ 表示，是所有元素都等于 0 的矩阵。$\\\
  mathrm{Mat}_m\\times m$ 中的单位矩阵定义为\n\nI_m = diag(1, …, 1),\n\n因此，例如，\n\n```\nI₁ =\
  \ [1]      I₂ = [1 0; 0 1]      I₃ = [1 0 0; 0 1 0; 0 0 1].\n```\n\n我们称 $\\mathrm{Mat}_m\\\
  times m$ 中的矩阵 $Q$ 为可逆的，如果存在 $\\mathrm{Mat}_m\\times m$ 中的矩阵，记为 $Q^{-1}$ 并称为 $Q$\
  \ 的逆，使得\n\n```\nQQ⁻¹ = Q⁻¹Q = Iₘ.\n```\n\n容易证明，如果矩阵的逆存在，则它是唯一的。\n\n### 定理 2.1.3.\
  \ 若 $P$ 和 $Q$ 是 $\\mathrm{Mat}_m\\times m$ 中的可逆矩阵，则：\n\n- (a) $(P^{-1})^{-1} = P$.\n\
  - (b) $(PQ)^{-1} = Q^{-1}P^{-1}$.\n- (c) $(P^{-1})ᵀ = (Pᵀ)^{-1}$.\n\n证明。 (a), (b)：直接可证。\n\
  \n(c)：由定理 2.1.2(b)，\n\n```\nIₘ = (Iₘ)ᵀ = (PP⁻¹)ᵀ = (P⁻¹)ᵀPᵀ,\n```\n\n由此可得结果。\n\n\
  多指标记号，引入于附录 A，提供了一种指定矩阵子矩阵的便捷方法。设 $1 \\le r \\le m$ 且 $1 \\le s \\le n$ 为整数，并设 $I\
  \ = (i₁,…,iᵣ)$ 和 $J = (j₁,…,jₛ)$ 分别为 $\\mathcal{I}_{r,m}$ 和 $\\mathcal{I}_{s,n}$\
  \ 中的多指标。对于 $\\mathrm{Mat}_{m\\times n}$ 中的矩阵 $P = [pⱼⁱ]$，我们用\n\n```\nP₍ⱼ₁,…,ⱼₛ₎⁽ⁱ¹,…,ⁱʳ⁾,\
  \    P_J^I,    [pⱼⁱ]₍ⱼ₁,…,ⱼₛ₎⁽ⁱ¹,…,ⁱʳ⁾,    or    [pⱼⁱ]_J^I\n```\n\n表示 $P$ 的 $r \\\
  times s$ 子矩阵，由行 $i₁,i₂,…,iᵣ$ 和列 $j₁,j₂,…,jₛ$ 的重叠构成（按该顺序）；即\n\n```\nP₍ⱼ₁,…,ⱼₛ₎⁽ⁱ¹,…,ⁱʳ⁾\
  \ = [pⱼ₁ⁱ¹ … pⱼₛⁱ¹; ⋮ ⋱ ⋮; pⱼ₁ⁱʳ … pⱼₛⁱʳ].\n```\n\n当 $r = m$，此时 $(i₁,…,iₘ) = (1,…,m)$，我们记\n\
  \n```\nP₍ⱼ₁,…,ⱼₛ₎⁽¹,…,ᵐ⁾   为   P₍ⱼ₁,…,ⱼₛ₎,\n```\n\n并且当 $s = n$，此时 $(j₁,…,jₙ) = (1,…,n)$，我们记\n\
  \n```\nP₍₁,…,ₙ₎⁽ⁱ¹,…,ⁱʳ⁾   为   P⁽ⁱ¹,…,ⁱʳ⁾.\n```\n\n当 $r = 1$，即 $I = (i)$ 对某个 $1\
  \ \\le i \\le m$ 时，我们有\n\n```\nP⁽ⁱ⁾ = [p₁ⁱ … pₙⁱ],\n```\n\n对于 $\\mathrm{Mat}_{m\\\
  times m}$ 中的矩阵 $P = [p^i_j]$，$P$ 的迹定义为\n\n$\\operatorname{tr}(P) = \\sum_i p^i_i.$\n\
  \n### 定理 2.1.7. 若 $P$ 和 $Q$ 是 $\\mathrm{Mat}_{m\\times m}$ 中的矩阵，则：\n\n- (a) $\\\
  operatorname{tr}(P+Q)=\\operatorname{tr}(P)+\\operatorname{tr}(Q)$.\n- (b) $\\operatorname{tr}(PQ)=\\\
  operatorname{tr}(QP)$.\n- (c) 若 $Q$ 可逆，则 $\\operatorname{tr}(Q^{-1}PQ)=\\operatorname{tr}(P)$。\n\
  \n证明。 (a)：直接可证。\n\n(b)：设 $P = [p^i_j]$ 且 $Q = [q^i_j]$。由定理 2.1.5(a)，\n\n$\\operatorname{tr}(PQ)=\\\
  sum_i P^{(i)}Q_{(i)}=\\sum_i\\left(\\sum_j p^i_j q^j_i\\right)=\\sum_j\\left(\\\
  sum_i q^i_j p^j_i\\right)$\n$=\\sum_j Q^{(j)}P_{(j)}=\\operatorname{tr}(QP)$。\n\n\
  (c)：这由部分 (b) 得出。\n\n### 2.2 矩阵表示\n\n矩阵具有许多理想的计算性质。因此，在向量空间中计算时，通常将论证重新表述为矩阵形式是很方便的。我们经常使用这种方法。\n\
  \n设 $V$ 为向量空间，设 $\\mathcal{H}=(h_1,\\dots,h_m)$ 为 $V$ 的基，设 $v$ 为 $V$ 中的向量，其中\n\n\
  $v = \\sum_i a^i h_i.$\n\n$v$ 关于 $\\mathcal{H}$ 的矩阵表示记为 $[v]_{\\mathcal{H}}$ 并定义为\n\
  \n$[v]_{\\mathcal{H}} = \\begin{bmatrix} a^1 \\\\ \\vdots \\\\ a^m \\end{bmatrix}.$\n\
  \n我们称 $a^1,\\dots,a^m$ 为 $v$ 关于 $\\mathcal{H}$ 的分量。特别地，\n\n$[h_i]_{\\mathcal{H}}\
  \ = \\begin{bmatrix} 0 \\\\ \\vdots \\\\ 1 \\\\ \\vdots \\\\ 0 \\end{bmatrix}, \\\
  qquad (2.2.1)$\n\n其中 1 在第 $i$ 个位置，其余为 0，对 $i=1,\\dots,m$。\n\n### 定理 2.2.1（向量的表示）\n\
  \n若 $V$ 为维数为 $m$ 的向量空间且 $\\mathcal{H}$ 为 $V$ 的基，则映射\n\n$$\\mathcal{L}_{\\mathcal{H}}:\
  \ V \\longrightarrow \\operatorname{Mat}_{m\\times 1}$$\n\n定义为\n\n$$\\mathcal{L}_{\\\
  mathcal{H}}(v)=[v]_{\\mathcal{H}}$$\n\n对所有 $V$ 中的向量 $v$ 为线性同构：\n\n$$V\\cong\\operatorname{Mat}_{m\\\
  times 1}.$$\n\n*证明。* 直接可证。\n\n设 $V$ 和 $\\mathcal{H}$ 如上，设 $W$ 为另一个向量空间，并设 $\\mathcal{F}=(f_1,\\\
  ldots,f_n)$ 为 $W$ 的基。设 $A:V\\longrightarrow W$ 为线性映射，其中\n\n$$A(h_j)=\\sum_i a_j^i\
  \ f_i,$$\n\n从而\n\n$$[A(h_j)]_{\\mathcal{F}}=\\begin{bmatrix}a_j^1\\\\\\vdots\\\\\
  a_j^n\\end{bmatrix}$$\n\n对 $j=1,\\ldots,m$。$A$ 关于 $\\mathcal{H}$ 和 $\\mathcal{F}$\
  \ 的矩阵表示记为 $[A]_{\\mathcal{H}}^{\\mathcal{F}}$ 并定义为 $n\\times m$ 矩阵\n\n$$[A]_{\\\
  mathcal{H}}^{\\mathcal{F}}=\\begin{bmatrix}a_1^1&\\cdots&a_m^1\\\\\\vdots&\\ddots&\\\
  vdots\\\\a_1^n&\\cdots&a_m^n\\end{bmatrix}=\\left[\\,[A(h_1)]_{\\mathcal{F}}\\ \\\
  cdots\\ [A(h_m)]_{\\mathcal{F}}\\,\\right].$$\n\n例如，考虑线性映射 $A:\\mathbb{R}^2\\longrightarrow\\\
  mathbb{R}^3$ 给出为 $A(x,y)=(y,2x,3x+4y)$，并设 $\\mathcal{E}$ 和 $\\mathcal{F}$ 分别为 $\\\
  mathbb{R}^2$ 和 $\\mathbb{R}^3$ 的标准基。则\n\n$$[A]_{\\mathcal{E}}^{\\mathcal{F}}=\\\
  begin{bmatrix}0&1\\\\2&0\\\\3&4\\end{bmatrix}.$$\n\n### 定理 2.2.2.\n\n设 $U$、$V$ 和\
  \ $W$ 为向量空间，设 $\\mathcal{H}$、$\\mathcal{F}$ 和 $\\mathcal{G}$ 为各自的基，设 $A,B:U\\longrightarrow\
  \ V$ 和 $C:V\\longrightarrow W$ 为线性映射，设 $c$ 为实数。则：\n\n- (a) $[A+B]_{\\mathcal{H}}^{\\\
  mathcal{F}}=[A]_{\\mathcal{H}}^{\\mathcal{F}}+[B]_{\\mathcal{H}}^{\\mathcal{F}}$.\n\
  - (b) $[cA]_{\\mathcal{H}}^{\\mathcal{F}}=c[A]_{\\mathcal{H}}^{\\mathcal{F}}$.\n\
  - (c) $[C\\circ A]_{\\mathcal{H}}^{\\mathcal{G}}=[C]_{\\mathcal{F}}^{\\mathcal{G}}[A]_{\\\
  mathcal{H}}^{\\mathcal{F}}$.\n\n\n\n\n\n**证明。** (a)、(b)：直接可得。\n\n(c)：设 \\(\\mathcal{H}=(h_1,\\\
  ldots,h_m)\\)，\\(\\mathcal{F}=(f_1,\\ldots,f_n)\\)，以及 \\(\\mathcal{G}=(g_1,\\ldots,g_r)\\\
  )，并设 \\([A]_{\\mathcal{H}}^{\\mathcal{F}}=[a_j^i]\\) 和 \\([C]_{\\mathcal{F}}^{\\\
  mathcal{G}}=[c_l^k]\\)。根据 (2.2.2) 和 (2.2.3)，\n\n\\[\nA(h_j)=\\sum_i a_j^i f_i \\\
  qquad\\text{and}\\qquad C(f_l)=\\sum_k c_l^k g_k.\n\\]\n\n于是\n\n\\[\n\\begin{aligned}\n\
  C(A(h_j))\n&=C\\left(\\sum_k a_j^k f_k\\right)\n=\\sum_k a_j^k C(f_k)\n=\\sum_k\
  \ a_j^k\\left(\\sum_i c_k^i g_i\\right)\\\\\n&=\\sum_i\\left(\\sum_k c_k^i a_j^k\\\
  right)g_i\n=\\sum_i\\left([C]_{\\mathcal{F}}^{\\mathcal{G}}\\right)^{(i)}_{(\\cdot)}\n\
  \\left([A]_{\\mathcal{H}}^{\\mathcal{F}}\\right)_{(\\cdot)j}g_i,\n\\end{aligned}\n\
  \\]\n\n由此可得结果。\n\n### 定理 2.2.3（线性映射的表示）\n\n设 \\(V\\) 和 \\(W\\) 分别是维数为 \\(m\\) 和\
  \ \\(n\\) 的向量空间，并设 \\(\\mathcal{H}\\) 和 \\(\\mathcal{F}\\) 分别为其基。定义映射\n\n\\[\n\\\
  mathcal{L}_{\\mathcal{H}}^{\\mathcal{F}}:\\operatorname{Lin}(V,W)\\longrightarrow\
  \ \\operatorname{Mat}_{n\\times m}\n\\]\n\n为\n\n\\[\n\\mathcal{L}_{\\mathcal{H}}^{\\\
  mathcal{F}}(A)=[A]_{\\mathcal{H}}^{\\mathcal{F}}\n\\]\n\n其中 \\(A\\) 是 \\(\\operatorname{Lin}(V,W)\\\
  ) 中的所有映射，\\(\\operatorname{Lin}(V,W)\\) 在例 1.1.1 中定义。\n\n则：\n\n- (a) \\(\\mathcal{L}_{\\\
  mathcal{H}}^{\\mathcal{F}}\\) 关于 \\(\\operatorname{Lin}(V,W)\\) 的加法结构是一个线性同构：\n\n\
  \  \\[\n  \\operatorname{Lin}(V,W)\\cong\\operatorname{Mat}_{n\\times m}.\n  \\\
  ]\n\n- (b) 若 \\(V=W\\)，则 \\(\\mathcal{L}_{\\mathcal{H}}^{\\mathcal{F}}\\) 关于 \\\
  (\\operatorname{Lin}(V,V)\\) 的乘法结构是一个环同构。\n\n**注。** 我们在例 1.1.1 中说明了 \\(\\operatorname{Lin}(V,V)\\\
  ) 既是向量空间又是环，并且在 2.1 节开头提到 \\(\\operatorname{Mat}_{m\\times m}\\) 也是如此，因此 (b) 部分的断语是有意义的。\n\
  \n**证明。** (a)：由定理 2.2.2 的 (a) 和 (b) 部分，\\(\\mathcal{L}_{\\mathcal{H}}^{\\mathcal{F}}\\\
  ) 是一个线性映射，且容易证明 \\(\\mathcal{L}_{\\mathcal{H}}^{\\mathcal{F}}\\) 是单射。我们断言 \\(\\\
  operatorname{Mat}_{n\\times m}\\) 和 \\(\\operatorname{Lin}(V,W)\\) 的维数均为 \\(mn\\\
  )。设 \\(E_{ij}\\) 是 \\(\\operatorname{Mat}_{n\\times m}\\) 中的矩阵，其第 \\(ij\\) 位为 1，其余位置为\
  \ 0，其中 \\(i=1,\\ldots,n\\)，\\(j=1,\\ldots,m\\)。容易验证这些 \\(E_{ij}\\) 构成 \\(\\operatorname{Mat}_{n\\\
  times m}\\) 的一组基，因此 \\(\\operatorname{Mat}_{n\\times m}\\) 的维数为 \\(mn\\)。设 \\(\\\
  mathcal{H}=(h_1,\\ldots,h_m)\\) 和 \\(\\mathcal{F}=(f_1,\\ldots,f_n)\\)，利用定理 1.1.10\
  \ 定义 \\(\\operatorname{Lin}(V,W)\\) 中的线性映射 \\(L_{ij}\\) 如下：\n\n\\[\nL_{ij}(h_k)=\n\
  \\begin{cases}\nf_i & \\text{if } k=j,\\\\\n0 & \\text{if } k\\ne j.\n\\end{cases}\n\
  \\]\n\n其中 \\(i=1,\\ldots,n\\)，\\(j=1,\\ldots,m\\)。于是\n\n\\[\n\\left(\\sum_{ij}a^i_jL_{ij}\\\
  right)(h_k)=\\sum_{ij}a^i_jL_{ij}(h_k)=\\sum_i a^i_kf_i\n\\]\n\n对所有实数 \\(a^i_j\\\
  ) 成立。设 \\(B\\) 是 \\(\\operatorname{Lin}(V,W)\\) 中的一个映射，且 \\([B]_{\\mathcal H}^{\\\
  mathcal F}=[b^i_j]\\)。由 (2.2.4) 可得\n\n\\[\n\\left(\\sum_{ij}b^i_jL_{ij}\\right)(h_k)=\\\
  sum_i b^i_kf_i=B(h_k)\n\\]\n\n对 \\(k=1,\\ldots,m\\) 成立。根据定理 1.1.10，\\(\\sum_{ij}b^i_jL_{ij}=B\\\
  )，因此 \\(L_{ij}\\) 张成 \\(\\operatorname{Lin}(V,W)\\)。设存在实数 \\(a^i_j\\) 使得 \\(\\sum_{ij}a^i_jL_{ij}=0\\\
  )，其中 \\(0\\) 表示 \\(\\operatorname{Lin}(V,W)\\) 中的零映射。由 (2.2.4) 可知 \\(\\sum_i a^i_kf_i=0\\\
  ) 对 \\(k=1,\\ldots,m\\) 成立。由于 \\(\\mathcal F\\) 是 \\(W\\) 的基，所以对 \\(i=1,\\ldots,n\\\
  ) 和 \\(k=1,\\ldots,m\\) 有 \\(a^i_k=0\\)，因此 \\(L_{ij}\\) 线性无关。因此，\\(L_{ij}\\) 构成\
  \ \\(\\operatorname{Lin}(V,W)\\) 的一组基，从而 \\(\\operatorname{Lin}(V,W)\\) 的维数为 \\\
  (mn\\)。这完成了断言的证明。设存在 \\(\\operatorname{Lin}(V,W)\\) 中的映射 \\(A\\) 使得 \\(\\mathcal\
  \ L^{\\mathcal F}_{\\mathcal H}(A)=O_{n\\times m}\\)。由定理 1.1.10、(2.2.2) 和 (2.2.3)\
  \ 可知 \\(A\\) 是零映射，因此 \\(\\ker(\\mathcal L^{\\mathcal F}_{\\mathcal H})=\\{0\\}\\\
  )。于是结论由定理 1.1.12 和定理 1.1.14 得出。\n\n(b)：这可由定理 2.2.2(c) 和 (a) 部分得出。\n\n### 定理 2.2.4\n\
  \n设 \\(V\\) 和 \\(W\\) 是向量空间，\\(\\mathcal H\\) 和 \\(\\mathcal F\\) 分别为其基，设 \\(A:V\\\
  to W\\) 是线性映射，并设 \\(v\\) 是 \\(V\\) 中的一个向量。则\n\n\\[\n[A(v)]_{\\mathcal F}=[A]_{\\\
  mathcal H}^{\\mathcal F}[v]_{\\mathcal H}.\n\\]\n\n**证明。** 设 \\(\\mathcal H=(h_1,\\\
  ldots,h_m)\\) 且 \\(v=\\sum_i a^i h_i\\)。由 (2.2.1) 和 (2.2.2) 可得\n\n\\[\n[A(h_i)]_{\\\
  mathcal F}=[A]_{\\mathcal H}^{\\mathcal F}[h_i]_{\\mathcal H}.\n\\]\n\n根据定理 2.2.2\
  \ 的 (a) 和 (b) 部分，\n\n\\[\n\\begin{aligned}\n[A(v)]_{\\mathcal F}\n&=\\left[A\\left(\\\
  sum_i a^i h_i\\right)\\right]_{\\mathcal F}\n=\\left[\\sum_i a^i A(h_i)\\right]_{\\\
  mathcal F}\n=\\sum_i a^i [A(h_i)]_{\\mathcal F}\\\\\n&=\\sum_i a^i\\left([A]_{\\\
  mathcal H}^{\\mathcal F}[h_i]_{\\mathcal H}\\right)\n=[A]_{\\mathcal H}^{\\mathcal\
  \ F}\\left(\\sum_i a^i [h_i]_{\\mathcal H}\\right)\n=[A]_{\\mathcal H}^{\\mathcal\
  \ F}\\begin{bmatrix}a^1\\\\ \\vdots\\\\ a^m\\end{bmatrix}\n=[A]_{\\mathcal H}^{\\\
  mathcal F}[v]_{\\mathcal H}.\n\\end{aligned}\n\\]\n\n设 \\(V\\) 是一个向量空间，并设 \\(\\\
  mathcal H\\) 和 \\(\\mathcal F\\) 是 \\(V\\) 的基。在定理 2.2.4 中取 \\(A=\\operatorname{id}_V\\\
  ) 可得\n\n\\[\n[v]_{\\mathcal F}=[\\operatorname{id}_V]_{\\mathcal H}^{\\mathcal F}[v]_{\\\
  mathcal H}.\n\\]\n\n这表明 \\([\\operatorname{id}_V]_{\\mathcal H}^{\\mathcal F}\\\
  ) 是将关于 \\(\\mathcal H\\) 的分量变换为关于 \\(\\mathcal F\\) 的分量的矩阵。因此，\\([\\operatorname{id}_V]_{\\\
  mathcal H}^{\\mathcal F}\\) 被称为从 \\(\\mathcal H\\) 到 \\(\\mathcal F\\) 的基变换矩阵。设\
  \ \\([\\operatorname{id}_V]_{\\mathcal H}^{\\mathcal F}=[a^i_j]\\)。那么 (2.2.2) 和\
  \ (2.2.3) 变为\n\n\\[\nh_j=\\sum_i a^i_j f_i\n\\]\n\n对 \\(j=1,\\ldots,m\\) 成立，以及\n\
  \n\\[\n[\\operatorname{id}_V]_{\\mathcal H}^{\\mathcal F}\n=\\left[\\,[h_1]_{\\\
  mathcal F}\\quad\\cdots\\quad [h_m]_{\\mathcal F}\\,\\right].\n\\]\n\n### 定理 2.2.5\n\
  \n设 \\(V\\) 和 \\(W\\) 是向量空间，\\(\\mathcal H\\) 和 \\(\\mathcal F\\) 分别为其基，并设 \\(A:V\\\
  to W\\) 是一个线性同构。则：\n\n- (a) \\([A]_{\\mathcal H}^{\\mathcal F}=[\\operatorname{id}_W]_{A(\\\
  mathcal H)}^{\\mathcal F}\\)\n- (b) \\([A^{-1}]_{\\mathcal F}^{\\mathcal H}=\\left([A]_{\\\
  mathcal H}^{\\mathcal F}\\right)^{-1}.\\)\n\n**注。** 根据定理 1.1.13(a)，\\(A(\\mathcal\
  \ H)\\) 是 \\(W\\) 的基，因此 (a) 部分的断语是有意义的。\n\n**证明。** (a)：设 \\(\\mathcal H=(h_1,\\\
  ldots,h_m)\\)，则\n\n\\[\n[A]_{\\mathcal H}^{\\mathcal F}=\\left[\\,[A(h_1)]_{\\mathcal\
  \ F}\\quad\\cdots\\quad[A(h_m)]_{\\mathcal F}\\,\\right]\n= [\\operatorname{id}_W]_{A(\\\
  mathcal H)}^{\\mathcal F}.\n\\]\n\n(b)：由定理 2.2.2(c)，\n\n\\[\nI_m=[\\operatorname{id}_V]_{\\\
  mathcal H}^{\\mathcal H}=[A^{-1}\\circ A]_{\\mathcal H}^{\\mathcal H}\n=[A^{-1}]_{\\\
  mathcal F}^{\\mathcal H}[A]_{\\mathcal H}^{\\mathcal F},\n\\]\n\n由此可得结论。\\(\\square\\\
  )\n\n### 定理 2.2.6（基变换）\n\n设 \\(V\\) 是一个向量空间，\\(\\mathcal H\\) 和 \\(\\mathcal F\\\
  ) 是 \\(V\\) 的基，并设 \\(A:V\\to V\\) 是一个线性映射。则\n\n\\[\n[A]_{\\mathcal F}^{\\mathcal\
  \ F}=\\left([\\operatorname{id}_V]_{\\mathcal F}^{\\mathcal H}\\right)^{-1}[A]_{\\\
  mathcal H}^{\\mathcal H}[\\operatorname{id}_V]_{\\mathcal F}^{\\mathcal H}.\n\\\
  ]\n\n**证明。** 由定理 2.2.2(c)，\n\n\\[\n[A]_{\\mathcal F}^{\\mathcal F}=[\\operatorname{id}_V\\\
  circ A\\circ\\operatorname{id}_V]_{\\mathcal F}^{\\mathcal F}\n=[\\operatorname{id}_V]_{\\\
  mathcal H}^{\\mathcal F}[A]_{\\mathcal H}^{\\mathcal H}[\\operatorname{id}_V]_{\\\
  mathcal F}^{\\mathcal H}.\n\\]\n\n结论现在由定理 2.2.5(b) 得出。\\(\\square\\)\n\n### 定理 2.2.7\n\
  \n设 \\(V\\) 是一个向量空间，\\(\\mathcal H\\) 和 \\(\\widetilde{\\mathcal H}\\) 是 \\(V\\\
  ) 的基，设 \\(\\Theta\\) 和 \\(\\widetilde{\\Theta}\\) 是对应的对偶基，并设 \\(A:V\\to V\\) 是一个线性映射。则\n\
  \n\\[\n[A^*]_{\\widetilde{\\Theta}}^{\\Theta}=\\left([A]_{\\mathcal H}^{\\widetilde{\\\
  mathcal H}}\\right)^T,\n\\]\n\n其中 \\(A^*\\) 是 \\(A\\) 的拉回（pullback）。\n\n**证明。**\
  \ 设 \\(\\mathcal H=(h_1,\\ldots,h_m)\\) 和 \\(\\widetilde{\\mathcal H}=(\\tilde h_1,\\\
  ldots,\\tilde h_m)\\)，设 \\(\\Theta=(\\theta^1,\\ldots,\\theta^m)\\) 和 \\(\\widetilde{\\\
  Theta}=(\\tilde\\theta^1,\\ldots,\\tilde\\theta^m)\\)，并设 \\([A]_{\\mathcal H}^{\\\
  widetilde{\\mathcal H}}=[a^i_j]\\)。由 (2.2.2) 和 (2.2.3)，\\(A(h_j)=\\sum_i a^i_j \\\
  tilde h_i\\)。于是\n\n\\[\n\\begin{aligned}\nA^*(\\tilde\\theta^j)\n&=\\sum_i A^*(\\\
  tilde\\theta^j)(h_i)\\,\\theta^i\\\\\n&=\\sum_i \\tilde\\theta^j(A(h_i))\\,\\theta^i\\\
  \\\n&=\\sum_i \\tilde\\theta^j\\left(\\sum_k a^k_i \\tilde h_k\\right)\\theta^i\n\
  =\\sum_{i,k} a^k_i \\tilde\\theta^j(\\tilde h_k)\\,\\theta^i\\\\\n&=\\sum_i a^j_i\\\
  ,\\theta^i.\n\\end{aligned}\n\\]\n\n再次由 (2.2.2) 和 (2.2.3)，\n\n\\[\n[A^*]_{\\widetilde{\\\
  Theta}}^{\\Theta}=[a^j_i]=\\left([a^i_j]\\right)^T=\\left([A]_{\\mathcal H}^{\\\
  widetilde{\\mathcal H}}\\right)^T.\n\\]\n\n## 2.3 矩阵的秩\n\n考虑由行矩阵构成的 \\(n\\) 维向量空间\
  \ \\(\\operatorname{Mat}_{1\\times n}\\) 和由列矩阵构成的 \\(m\\) 维向量空间 \\(\\operatorname{Mat}_{m\\\
  times 1}\\)。设 \\(P\\) 是 \\(\\operatorname{Mat}_{m\\times n}\\) 中的一个矩阵。矩阵 \\(P\\\
  ) 的行秩定义为由 \\(P\\) 的各行张成的 \\(\\operatorname{Mat}_{1\\times n}\\) 的子空间的维数：\n\n\\[\n\
  \\operatorname{rowrank}(P)=\\dim(\\operatorname{span}\\{P^{(1)},\\ldots,P^{(m)}\\\
  }).\n\\]\n\n类似地，矩阵 \\(P\\) 的列秩定义为由 \\(P\\) 的各列张成的 \\(\\operatorname{Mat}_{m\\times\
  \ 1}\\) 的子空间的维数：\n\n\\[\n\\operatorname{colrank}(P)=\\dim(\\operatorname{span}\\\
  {P_{(1)},\\ldots,P_{(n)}\\}).\n\\]\n\n例如，对于\n\n\\[\nP=\\begin{bmatrix}1&0&0\\\\\
  0&1&0\\end{bmatrix},\n\\]\n\n有 \\(\\operatorname{rowrank}(P)=\\operatorname{colrank}(P)=2\\\
  )。如下所示，\\(P\\) 的行秩和列秩相等并非巧合。\n\n### 定理 2.3.1\n\n设 \\(V\\) 和 \\(W\\) 是向量空间，\\(\\\
  mathcal H\\) 和 \\(\\mathcal F\\) 分别为其基，并设 \\(A:V\\to W\\) 是一个线性映射。则\n\n\\[\n\\operatorname{rank}(A)=\\\
  operatorname{colrank}([A]_{\\mathcal H}^{\\mathcal F}).\n\\]\n\n**证明。** 设 \\(\\\
  mathcal H=(h_1,\\ldots,h_m)\\)。由定理 2.2.1 和 (2.2.3) 可得\n\n\\[\n([A]_{\\mathcal H}^{\\\
  mathcal F})_{(j)}=[A(h_j)]_{\\mathcal F}=\\mathcal{L}_{\\mathcal F}(A(h_j)).\n\\\
  ]\n\n\n\nfor $j = 1, \\ldots, m$. Since $\\mathfrak{L}_{\\mathcal{F}}$ is an isomorphism\
  \ and $A(h_1), \\ldots, A(h_m)$ span the image of $A$, we have\n\ncolrank$\\left([A]_{\\\
  mathcal{H}}^{\\mathcal{F}}\\right) = \\dim\\left(\\operatorname{span}\\left(\\{A(h_1),\
  \ \\ldots, A(h_m)\\}\\right)\\right) = \\dim(\\operatorname{im}(A))$ $= \\operatorname{rank}(A)$.\n\
  \n## Theorem 2.3.2. If $P$ is a matrix in $\\operatorname{Mat}_{m\\times n}$, then\n\
  \nrowrank$(P) = $ colrank$(P)$.\n\nProof. Let $\\mathcal{E}$ and $\\mathcal{F}$\
  \ be the standard bases for $\\mathbb{R}^n$ and $\\mathbb{R}^m$, respectively, and\
  \ let $\\Xi$ and $\\Phi$ be the corresponding dual bases. Let $P = [p_j^i]$, and\
  \ let $A : \\mathbb{R}^n \\longrightarrow \\mathbb{R}^m$ be the linear map defined\
  \ by\n\n$A(x^1, \\ldots, x^n) = \\left(\\sum_j p_j^1 x^j, \\ldots, \\sum_j p_j^m\
  \ x^j\\right)$.\n\nThen $[A]_{\\mathcal{E}}^{\\mathcal{F}} = P$. By Theorem 2.3.1,\n\
  \nrank$(A) = $ colrank$(P)$.\n\nWe have from Theorem 2.2.7 that $[A^*]_{\\Phi}^{\\\
  Xi} = ([A]_{\\mathcal{E}}^{\\mathcal{F}})^\\mathrm{T} = P^\\mathrm{T}$, so a similar\
  \ argument gives\n\nrank$(A^*) = $ colrank$(P^\\mathrm{T}) = $ rowrank$(P)$.\n\n\
  The result now follows from Theorem 1.4.3(a).\n\nIn light of Theorem 2.3.2, the\
  \ common value of the row rank and column rank of $P$ is denoted by rank$(P)$ and\
  \ called the rank of $P$. Thus,\n\nrank$(P) = $ rowrank$(P) = $ colrank$(P)$. (2.3.1)\n\
  \n## 2.4 Determinant of Matrices\n\nThis section presents the basic results on the\
  \ determinant of matrices.\n\nConsider the $m$-dimensional vector space $\\operatorname{Mat}_{m\\\
  times 1}$ of column matrices and the corresponding product vector space $(\\operatorname{Mat}_{m\\\
  times 1})^m$. We denote by $(E_1, \\ldots, E_m)$ the standard basis for $\\operatorname{Mat}_{m\\\
  times 1}$, where $E_j$ has 1 in the $j$th row and 0s elsewhere for $j = 1, \\ldots,\
  \ m$. Let\n\n$\\Delta : (\\operatorname{Mat}_{m\\times 1})^m \\longrightarrow \\\
  mathbb{R}$\n\nbe an arbitrary function, and let $\\sigma$ be a permutation in $\\\
  mathcal{S}_m$, the symmetric group on $\\{1,2,\\ldots,m\\}$. We define a function\n\
  \n$\\sigma(\\Delta) : (\\operatorname{Mat}_{m\\times 1})^m \\longrightarrow \\mathbb{R}$\n\
  \nby\n\n$\\sigma(\\Delta)(P_1, \\ldots, P_m) = \\Delta(P_{\\sigma(1)}, \\ldots,\
  \ P_{\\sigma(m)})$\n\nfor all matrices $P_1, \\ldots, P_m$ in $\\operatorname{Mat}_{m\\\
  times 1}$.\n\n## Theorem 2.4.1. If Δ : (Mat_{m×1})^m ⟶ ℝ is a function, and σ and\
  \ ρ are permutations in S_m, then\n\n(σρ)(Δ) = σ(ρ(Δ)).\n\nProof. Setting P_{σ(1)}\
  \ = Q_1, …, P_{σ(m)} = Q_m, we have\n\n(σρ)(Δ)(P_1,…,P_m) = Δ(P_{σρ(1)},…,P_{σρ(m)})\
  \ = Δ(P_{σ(ρ(1))},…,P_{σ(ρ(m))}) = Δ(Q_{ρ(1)},…,Q_{ρ(m)}) = ρ(Δ)(Q_1,…,Q_m) = ρ(Δ)(P_{σ(1)},…,P_{σ(m)})\
  \ = σ(ρ(Δ))(P_1,…,P_m).\n\nSince P_1,…,P_m were arbitrary, the result follows.\n\
  \nA function Δ : (Mat_{m×1})^m ⟶ ℝ is said to be multilinear if for all matrices\
  \ P_1,…,P_m,Q in Mat_{m×1} and all real numbers c, Δ(P_1,…,cP_i+Q,…,P_m) = c Δ(P_1,…,P_i,…,P_m)\
  \ + Δ(P_1,…,Q,…,P_m) for i = 1,…,m. We say that Δ is alternating if for all matrices\
  \ P_1,…,P_m in Mat_{m×1}, Δ(P_1,…,P_i,…,P_j,…,P_m) = −Δ(P_1,…,P_j,…,P_i,…,P_m) for\
  \ all 1 ≤ i < j ≤ m. Equivalently, Δ is alternating if τ(Δ) = −Δ for all transpositions\
  \ τ in S_m.\n\n## Theorem 2.4.2. If Δ : (Mat_{m×1})^m ⟶ ℝ is a multilinear function,\
  \ then the following are equivalent:\n\n- (a) Δ is alternating.\n- (b) σ(Δ) = sgn(σ)\
  \ Δ for all permutations σ in S_m.\n- (c) If P_1,…,P_m are matrices in Mat_{m×1}\
  \ and two (or more) of them are equal, then Δ(P_1,…,P_m) = 0.\n- (d) If P_1,…,P_m\
  \ are matrices in Mat_{m×1} and Δ(P_1,…,P_m) ≠ 0, then P_1,…,P_m are linearly independent.\n\
  \nProof. (a) ⇒ (b): Let σ = τ_1⋯τ_k be a decomposition of σ into transpositions.\
  \ By Theorem 2.4.1, σ(Δ) = (τ_1⋯τ_k)(Δ) = (τ_1⋯τ_{k−1})(τ_k(Δ)) = (τ_1⋯τ_{k−1})(−Δ)\
  \ = −(τ_1⋯τ_{k−1})(Δ). Repeating the process k − 1 more times gives σ(Δ) = (−1)^k\
  \ Δ. By Theorem B.2.3, sgn(σ) = (−1)^k.\n\n(b) ⇒ (a): If τ is a transposition in\
  \ S_m, then, by Theorem B.2.3, τ(Δ) = sgn(τ) Δ = −Δ.\n\n(a) ⇒ (c): If P_i = P_j\
  \ for some 1 ≤ i < j ≤ m, then Δ(P_1,…,P_i,…,P_j,…,P_m) = Δ(P_1,…,P_j,…,P_i,…,P_m).\n\
  \nOn the other hand, since Δ is alternating,\n\nΔ(P₁, …, Pⱼ, …, Pᵢ, …, Pₘ) = −Δ(P₁,\
  \ …, Pᵢ, …, Pⱼ, …, Pₘ).\n\nThus,\n\nΔ(P₁, …, Pᵢ, …, Pⱼ, …, Pₘ) = −Δ(P₁, …, Pᵢ, …,\
  \ Pⱼ, …, Pₘ),\n\nfrom which the result follows.\n\n(c) ⇒ (a): For 1 ≤ i < j ≤ m,\
  \ we have\n\n0 = Δ(P₁, …, Pᵢ + Pⱼ, …, Pᵢ + Pⱼ, …, Pₘ)\n= Δ(P₁, …, Pᵢ, …, Pᵢ, …,\
  \ Pₘ) + Δ(P₁, …, Pᵢ, …, Pⱼ, …, Pₘ)\n+ Δ(P₁, …, Pⱼ, …, Pᵢ, …, Pₘ) + Δ(P₁, …, Pⱼ,\
  \ …, Pⱼ, …, Pₘ)\n= Δ(P₁, …, Pᵢ, …, Pⱼ, …, Pₘ) + Δ(P₁, …, Pⱼ, …, Pᵢ, …, Pₘ),\n\n\
  from which the result follows.\n\nTo prove (c) ⇔ (d), we replace the assertion in\
  \ part (d) with the following logically equivalent assertion:\n(d′): If P₁, …, Pₘ\
  \ are linearly dependent matrices in Matₘ×₁, then Δ(P₁, …, Pₘ) = 0.\n\n(c) ⇒ (d′):\
  \ Since P₁, …, Pₘ are linearly dependent, one of them can be expressed as a linear\
  \ combination of the others, say, P₁ = Σᵢ₌₂ᵐ aⁱ Pᵢ. Then\n\nΔ(P₁, …, Pₘ) = Δ( Σᵢ₌₂ᵐ\
  \ aⁱ Pᵢ, P₂, …, Pₘ ) = Σᵢ₌₂ᵐ aⁱ Δ(Pᵢ, P₂, …, Pₘ).\n\nSince Δ(Pᵢ, P₂, …, Pₘ) has\
  \ Pᵢ in (at least) two positions, Δ(Pᵢ, P₂, …, Pₘ) = 0 for i = 2, …, m. Thus, Δ(P₁,\
  \ …, Pₘ) = 0.\n\n(d′) ⇒ (c): If two (or more) of P₁, …, Pₘ are equal, then P₁, …,\
  \ Pₘ are linearly dependent, so Δ(P₁, …, Pₘ) = 0.\n\nA function Δ : (Matₘ×₁)ᵐ ⟶\
  \ ℝ is said to be a determinant function (on Matₘ×₁) if it is both multilinear and\
  \ alternating.\n\n## Theorem 2.4.3. Let Δ : (Matₘ×₁)ᵐ ⟶ ℝ be a determinant function,\
  \ and let P₁, …, Pₘ be matrices in Matₘ×₁, with\n\nP₁ = [p₁¹; ⋮; p₁ᵐ],      …  \
  \    Pₘ = [pₘ¹; ⋮; pₘᵐ].\n\nThen\n\nΔ(P₁, …, Pₘ) = Δ(E₁, …, Eₘ) Σ_{σ ∈ Sₘ} sgn(σ)\
  \ p₁^{σ(1)} … pₘ^{σ(m)}.\n\n**Proof.** We have\n\n\\[\nP_1=\\sum_{i_1=1}^{m}p_{1}^{i_1}E_{i_1},\\\
  qquad \\cdots \\qquad P_m=\\sum_{i_m=1}^{m}p_{m}^{i_m}E_{i_m},\n\\]\n\nhence\n\n\
  \\[\n\\begin{aligned}\n\\Delta(P_1,\\ldots,P_m)\n&=\\Delta\\left(\\sum_{i_1=1}^{m}p_1^{i_1}E_{i_1},\\\
  ldots,\\sum_{i_m=1}^{m}p_m^{i_m}E_{i_m}\\right)\\\\\n&=\\sum_{1\\le i_1,\\ldots,i_m\\\
  le m}p_1^{i_1}\\cdots p_m^{i_m}\\Delta(E_{i_1},\\ldots,E_{i_m})\\\\\n&=\\sum_{\\\
  substack{1\\le i_1,\\ldots,i_m\\le m\\\\i_1,\\ldots,i_m\\text{ distinct}}}p_1^{i_1}\\\
  cdots p_m^{i_m}\\Delta(E_{i_1},\\ldots,E_{i_m})\\\\\n&=\\sum_{\\sigma\\in S_m}p_1^{\\\
  sigma(1)}\\cdots p_m^{\\sigma(m)}\\Delta(E_{\\sigma(1)},\\ldots,E_{\\sigma(m)})\\\
  \\\n&=\\sum_{\\sigma\\in S_m}p_1^{\\sigma(1)}\\cdots p_m^{\\sigma(m)}\\sigma(\\\
  Delta)(E_1,\\ldots,E_m)\\\\\n&=\\Delta(E_1,\\ldots,E_m)\\sum_{\\sigma\\in S_m}\\\
  operatorname{sgn}(\\sigma)p_1^{\\sigma(1)}\\cdots p_m^{\\sigma(m)}.\n\\end{aligned}\n\
  \\]\n\n\n## Theorem 2.4.4 (Existence of Determinant Function).\n\nThere is a unique\
  \ determinant function\n\n\\[\n\\det:(\\operatorname{Mat}_{m\\times1})^m\\longrightarrow\\\
  mathbb{R}\n\\]\n\non $\\operatorname{Mat}_{m\\times1}$ such that $\\det(E_1,\\ldots,E_m)=1$.\
  \ More specifically,\n\n\\[\n\\det(P_1,\\ldots,P_m)=\\sum_{\\sigma\\in S_m}\\operatorname{sgn}(\\\
  sigma)p_1^{\\sigma(1)}\\cdots p_m^{\\sigma(m)}\n\\]\n\\[\n=\\sum_{\\sigma\\in S_m}\\\
  operatorname{sgn}(\\sigma)p_{\\sigma(1)}^1\\cdots p_{\\sigma(m)}^m.\n\\tag{2.4.1}\n\
  \\]\n\nfor all matrices $P_1,\\ldots,P_m$ in $\\operatorname{Mat}_{m\\times1}$,\
  \ where\n\n\\[\nP_1=\\begin{bmatrix}p_1^1\\\\\\vdots\\\\p_1^m\\end{bmatrix},\\qquad\
  \ \\cdots \\qquad P_m=\\begin{bmatrix}p_m^1\\\\\\vdots\\\\p_m^m\\end{bmatrix}.\n\
  \\]\n\n**Proof.** Let us begin by showing that the right-hand sides of (2.4.1) are\
  \ equal. We have\n\n\\[\n\\begin{aligned}\n\\sum_{\\sigma\\in S_m}\\operatorname{sgn}(\\\
  sigma)p_1^{\\sigma(1)}\\cdots p_m^{\\sigma(m)}\n&=\\sum_{\\sigma\\in S_m}\\operatorname{sgn}(\\\
  sigma)p_{\\sigma^{-1}(1)}^1\\cdots p_{\\sigma^{-1}(m)}^m\\\\\n&=\\sum_{\\sigma\\\
  in S_m}\\operatorname{sgn}(\\sigma^{-1})p_{\\sigma^{-1}(1)}^1\\cdots p_{\\sigma^{-1}(m)}^m\\\
  \\\n&=\\sum_{\\sigma\\in S_m}\\operatorname{sgn}(\\sigma)p_{\\sigma(1)}^1\\cdots\
  \ p_{\\sigma(m)}^m.\n\\end{aligned}\n\\]\n\nwhere the second equality follows from\
  \ Theorem B.2.2(b), and the third equality from the observation that as $\\sigma$\
  \ varies over $S_m$, so does $\\sigma^{-1}$.\n\n**Existence.** With $P_1,\\ldots,P_m$\
  \ as above, define a function $\\det:(\\mathrm{Mat}_{m\\times1})^m\\to\\mathbb{R}$\
  \ using the first equality in (2.4.1). It is easily shown that $\\det$ is multilinear.\
  \ For a given permutation $\\rho\\in S_m$, we have\n\n$$P_{\\rho(1)}=\\begin{bmatrix}p^1_{\\\
  rho(1)}\\\\ \\vdots\\\\ p^m_{\\rho(1)}\\end{bmatrix},\\quad\\ldots\\quad P_{\\rho(m)}=\\\
  begin{bmatrix}p^1_{\\rho(m)}\\\\ \\vdots\\\\ p^m_{\\rho(m)}\\end{bmatrix},$$\n\n\
  hence\n\n$$\\begin{aligned}\n\\rho(\\det)(P_1,\\ldots,P_m)&=\\det(P_{\\rho(1)},\\\
  ldots,P_{\\rho(m)})\\\\\n&=\\sum_{\\sigma\\in S_m}\\operatorname{sgn}(\\sigma)p^1_{\\\
  rho(\\sigma(1))}\\cdots p^m_{\\rho(\\sigma(m))}\\\\\n&=\\sum_{\\sigma\\in S_m}\\\
  operatorname{sgn}(\\sigma)p^{\\sigma\\rho^{-1}(1)}_1\\cdots p^{\\sigma\\rho^{-1}(m)}_m\\\
  \\\n&=\\operatorname{sgn}(\\rho)\\sum_{\\sigma\\in S_m}\\operatorname{sgn}(\\sigma\\\
  rho^{-1})p^{\\sigma\\rho^{-1}(1)}_1\\cdots p^{\\sigma\\rho^{-1}(m)}_m\\\\\n&=\\\
  operatorname{sgn}(\\rho)\\det(P_1,\\ldots,P_m),\n\\end{aligned}$$\n\nwhere the fourth\
  \ equality follows from Theorem B.2.2, and the last equality follows from the observation\
  \ that as $\\sigma$ varies over $S_m$, so does $\\sigma\\rho^{-1}$. Since $P_1,\\\
  ldots,P_m$ were arbitrary, $\\rho(\\det)=\\operatorname{sgn}(\\rho)\\det$. By Theorem\
  \ 2.4.2, $\\det$ is alternating. Thus, $\\det$ is a determinant function. A straightforward\
  \ computation shows that $\\det(E_1,\\ldots,E_m)=1$.\n\n**Uniqueness.** This follows\
  \ from Theorem 2.4.3.\n\nLet $P$ be a matrix in $\\mathrm{Mat}_{m\\times m}$, and\
  \ recall that in multi-index notation the column matrices of $P$ are $P_{(1)},\\\
  ldots,P_{(m)}$. Setting\n\n$$P=[P_{(1)}\\ \\cdots\\ P_{(m)}],$$\n\nwe henceforth\
  \ view $P$ as an $m$-tuple of column matrices. In this way, the vector spaces $\\\
  mathrm{Mat}_{m\\times m}$ and $(\\mathrm{Mat}_{m\\times1})^m$ are identified. Accordingly,\
  \ we now express the determinant function in Theorem 2.4.4 as\n\n$$\\det:\\mathrm{Mat}_{m\\\
  times m}\\longrightarrow\\mathbb{R},$$\n\nso that\n\n$$\\det(P)=\\det(P_{(1)},\\\
  ldots,P_{(m)}),$$\n\nwhere $\\det(P)$ is referred to as the **determinant of $P$**.\
  \ In particular, the condition $\\det(E_1,\\ldots,E_m)=1$ in Theorem 2.4.4 becomes\n\
  \n$$\\det(I_m)=1. \\tag{2.4.2}$$\n\n\n\n\n\n## 2.4 矩阵的行列式\n\n### 定理 2.4.5\n\n若 \\\
  (P\\) 和 \\(Q\\) 是 \\(\\operatorname{Mat}_{m\\times m}\\) 中的矩阵，则：\n\n- (a) \\(\\\
  det(PQ)=\\det(P)\\det(Q)\\)。\n- (b) 若 \\(P\\) 可逆，则 \\(\\det(P^{-1})=\\det(P)^{-1}\\\
  )。\n- (c) \\(\\det(P^{\\mathsf T})=\\det(P)\\)。\n\n**Proof.** (a): 设我们定义一个函数 \\\
  (\\Delta:(\\operatorname{Mat}_{m\\times 1})^m\\to\\mathbb R\\) 为\n\n\\[\n\\Delta(R_1,\\\
  ldots,R_m)=\\det([PR_1\\ \\cdots\\ PR_m])\n\\]\n\n对所有 \\(\\operatorname{Mat}_{m\\\
  times 1}\\) 中的矩阵 \\(R_1,\\ldots,R_m\\)。容易证明 \\(\\Delta\\) 是一个行列式函数。我们有\n\n\\[\n\\\
  begin{aligned}\n\\det([PQ_{(1)}\\ \\cdots\\ PQ_{(m)}])\n&=\\Delta(Q_{(1)},\\ldots,Q_{(m)})\\\
  \\\n&=\\Delta(E_1,\\ldots,E_m)\\det([Q_{(1)}\\ \\cdots\\ Q_{(m)}]) \\qquad [(2.4.1),\\\
  text{ Th 2.4.3}]\\\\\n&=\\det(P)\\det(Q).\n\\end{aligned}\n\\]\n\n(b): 我们由 (2.4.1)\
  \ 和部分 (a) 得到\n\n\\[\n1=\\det(I_m)=\\det(PP^{-1})=\\det(P)\\det(P^{-1}),\n\\]\n\n\
  由此结果得出。\n\n(c): 设 \\(P^{\\mathsf T}=[p_j^i]^{\\mathsf T}=[q_j^i]\\)。则\n\n\\[\n\\\
  det(P^{\\mathsf T})\n=\\sum_{\\sigma\\in S_m}\\operatorname{sgn}(\\sigma)\\,q_{\\\
  sigma(1)}^1\\cdots q_{\\sigma(m)}^m\n=\\sum_{\\sigma\\in S_m}\\operatorname{sgn}(\\\
  sigma)\\,p_1^{\\sigma(1)}\\cdots p_m^{\\sigma(m)}\n=\\det(P),\n\\]\n\n其中第一个和最后一个等式由\
  \ (2.4.1) 得出，而第二个等式由观察 \\(q_{\\sigma(i)}^i=p_i^{\\sigma(i)}\\) 对所有 \\(S_m\\) 中的置换\
  \ \\(\\sigma\\) 成立得出。\n\n设 \\(P\\) 是 \\(\\operatorname{Mat}_{m\\times m}\\) 中的矩阵。\\\
  (P\\) 的 \\(ij\\)-余子式定义为\n\n\\[\nc_j^i=(-1)^{i+j}\\det\\left(P^{(1,\\ldots,\\hat\
  \ i,\\ldots,m)}_{(1,\\ldots,\\hat j,\\ldots,m)}\\right),\n\\]\n\n其中帽子表示省略一个表达式。于是，\\\
  (P^{(1,\\ldots,\\hat i,\\ldots,m)}_{(1,\\ldots,\\hat j,\\ldots,m)}\\) 是通过删除 \\(P\\\
  ) 的第 \\(i\\) 行和第 \\(j\\) 列得到的 \\(\\operatorname{Mat}_{(m-1)\\times(m-1)}\\) 中的矩阵。\\\
  (P\\) 的伴随矩阵是 \\(\\operatorname{Mat}_{m\\times m}\\) 中定义的矩阵\n\n\\[\n\\operatorname{adj}(P)=[c_j^i]^{\\\
  mathsf T}.\n\\]\n\n### 定理 2.4.6 (行列式的列展开)\n\n若 \\(P=[p_j^i]\\) 是 \\(\\operatorname{Mat}_{m\\\
  times m}\\) 中的矩阵且 \\(1\\le j\\le m\\)，则\n\n\\[\n\\det(P)=\\sum_i c_j^i p_j^i,\n\\\
  ]\n\n这称为 \\(\\det(P)\\) 沿 \\(P\\) 的第 \\(j\\) 列的展开。\n\n**Proof.** 我们有\n\n\\[\nP=\\\
  begin{bmatrix} P_{(1,\\ldots,j-1)} & \\sum_i p_j^i E_i & P_{(j+1,\\ldots,m)} \\\
  end{bmatrix}\n\\]\n\n故\n\n\\[\n\\det(P)=\\sum_i p_j^i\\det\\left(\\begin{bmatrix}\
  \ P_{(1,\\ldots,j-1)} & E_i & P_{(j+1,\\ldots,m)} \\end{bmatrix}\\right).\n\\]\n\
  \n我们也有\n\n\\[\n\\begin{aligned}\n\\det\\left(\\begin{bmatrix} P_{(1,\\ldots,j-1)}\
  \ & E_i & P_{(j+1,\\ldots,m)} \\end{bmatrix}\\right)\n&=\\det\\left(\\begin{bmatrix}\n\
  P^{(1,\\ldots,i-1)}_{(1,\\ldots,j-1)} & O_{(i-1)\\times1} & P^{(1,\\ldots,i-1)}_{(j+1,\\\
  ldots,m)}\\\\\nP^{(i)}_{(1,\\ldots,j-1)} & 1 & P^{(i)}_{(j+1,\\ldots,m)}\\\\\nP^{(i+1,\\\
  ldots,m)}_{(1,\\ldots,j-1)} & O_{(m-i)\\times1} & P^{(i+1,\\ldots,m)}_{(j+1,\\ldots,m)}\n\
  \\end{bmatrix}\\right)\\\\\n&=(-1)^{(i-1)+(j-1)}\\det\\left(\\begin{bmatrix}\n1\
  \ & P^{(i)}_{(1,\\ldots,j-1)} & P^{(i)}_{(j+1,\\ldots,m)}\\\\\nO_{(i-1)\\times1}\
  \ & P^{(1,\\ldots,i-1)}_{(1,\\ldots,j-1)} & P^{(1,\\ldots,i-1)}_{(j+1,\\ldots,m)}\\\
  \\\nO_{(m-i)\\times1} & P^{(i+1,\\ldots,m)}_{(1,\\ldots,j-1)} & P^{(i+1,\\ldots,m)}_{(j+1,\\\
  ldots,m)}\n\\end{bmatrix}\\right)\\\\\n&=(-1)^{i+j}\\det\\left(\\begin{bmatrix}\n\
  1 & P^{(i)}_{(1,\\ldots,\\hat j,\\ldots,m)}\\\\\nO_{(m-1)\\times1} & P^{(1,\\ldots,\\\
  hat i,\\ldots,m)}_{(1,\\ldots,\\hat j,\\ldots,m)}\n\\end{bmatrix}\\right)\\\\\n\
  &=(-1)^{i+j}\\det\\left(P^{(1,\\ldots,\\hat i,\\ldots,m)}_{(1,\\ldots,\\hat j,\\\
  ldots,m)}\\right)=c_j^i,\n\\end{aligned}\n\\]\n\n其中第二个等式是通过交换 \\(i-1\\) 个相邻行，然后交换\
  \ \\(j-1\\) 个相邻列得到的，其中第四个等式由 (2.4.1) 得出。结合上述恒等式得到结果。\n\n### 定理 2.4.7\n\n若 \\(P\\\
  ) 是 \\(\\operatorname{Mat}_{m\\times m}\\) 中的矩阵，则\n\n\\[\nP\\operatorname{adj}(P)=\\\
  det(P)I_m.\n\\]\n\n**Proof.** 设 \\(P=[p_j^i]\\)。对于给定的整数 \\(1\\le k,l\\le m\\)，设\
  \ \\(Q=[q_j^i]\\) 是通过用 \\(P\\) 的第 \\(l\\) 列替换 \\(P\\) 的第 \\(k\\) 列得到的 \\(\\operatorname{Mat}_{m\\\
  times m}\\) 中的矩阵；即\n\n\\[\nQ=[P_{(1)}\\ \\cdots\\ P_{(k-1)}\\ P_{(l)}\\ P_{(k+1)}\\\
  \ \\cdots\\ P_{(m)}].\n\\]\n\n设 \\(\\operatorname{adj}(P)=[c_j^i]^{\\mathsf T}\\\
  ) 且 \\(\\operatorname{adj}(Q)=[d_j^i]^{\\mathsf T}\\)。由定理 2.4.6，\n\n\\[\n\\sum_i\
  \ c_k^i p_k^i=\\det(P).\n\\]\n\n若 \\(k\\ne l\\)，则 \\(Q\\) 的两列相等且\n\n\\[\nQ^{(1,\\\
  ldots,\\hat i,\\ldots,m)}_{(1,\\ldots,\\hat k,\\ldots,m)}=P^{(1,\\ldots,\\hat i,\\\
  ldots,m)}_{(1,\\ldots,\\hat k,\\ldots,m)}.\n\\]\n\n由定理 2.4.2 和 2.4.6 可得\n\n\\[\n\
  \\sum_i c_k^i p_l^i=\\sum_i d_k^i q_l^i=\\det(Q)=0.\n\\]\n\n于是，\n\n\\[\n\\sum_i\
  \ c_k^i p_l^i=\\det(P)\\,\\delta_{kl}\n\\]\n\n对 \\(k,l=1,\\ldots,m\\) 成立，其中 \\(\\\
  delta_{kl}\\) 是克罗内克 delta。则 \\([c_j^i][p_j^i]^{\\mathsf T}=\\det(P)I_m\\)。取转置得到结果。\n\
  \n### 定理 2.4.8\n\n若 \\(P\\) 是 \\(\\operatorname{Mat}_{m\\times m}\\) 中的矩阵，则以下条件等价：\n\
  \n- (a) \\(P\\) 可逆。\n- (b) \\(\\det(P)\\ne 0\\)。\n- (c) \\(\\operatorname{rank}(P)=m\\\
  )。\n\n若上述等价条件之一成立，则\n\n\\[\nP^{-1}=\\frac{1}{\\det(P)}\\operatorname{adj}(P).\n\\\
  ]\n\n**Proof.** (a) \\(\\Rightarrow\\) (b): 由定理 2.4.5(b)，\\(\\det(P)\\det(P^{-1})=1\\\
  )，故 \\(\\det(P)\\ne 0\\)。\n\n(b) \\(\\Rightarrow\\) (c): 由于 \\(\\det([P_{(1)}\\\
  \ \\cdots\\ P_{(m)}])=\\det(P)\\ne0\\)，由定理 2.4.2 可知 \\(P_{(1)},\\ldots,P_{(m)}\\\
  ) 线性无关，所以\n\n\\[\n\\operatorname{rank}(P)=\\operatorname{rank}([P_{(1)}\\ \\cdots\\\
  \ P_{(m)}])=m.\n\\]\n\n(c) \\(\\Rightarrow\\) (a): 由于 \\(\\operatorname{rank}(P)=m\\\
  )，\\(\\mathscr P=(P_{(1)},\\ldots,P_{(m)})\\) 是 \\(\\operatorname{Mat}_{m\\times1}\\\
  ) 的基。设 \\(Q=[[E_1]_{\\mathscr P}\\ \\cdots\\ [E_m]_{\\mathscr P}]\\)。根据定义，\\(E_j=P[E_j]_{\\\
  mathscr P}\\) 对 \\(j=1,\\ldots,m\\) 成立，故\n\n\\[\nI_m=[E_1\\ \\cdots\\ E_m]=PQ,\n\
  \\]\n\n所以 \\(Q=P^{-1}\\)。最后的断言由定理 2.4.7 得出。\n\n### 定理 2.4.9\n\n\\(\\operatorname{Mat}_{m\\\
  times1}\\) 中的矩阵 \\(P_1,\\ldots,P_m\\) 线性无关当且仅当 \\(\\det([P_1\\ \\cdots\\ P_m])\\\
  ne0\\)。\n\n**Proof.** 我们有\n\n\\[\n\\begin{aligned}\nP_1,\\ldots,P_m\\text{ 线性无关}\n\
  &\\Longleftrightarrow \\operatorname{rank}([P_1\\ \\cdots\\ P_m])=m\\\\\n&\\Longleftrightarrow\
  \ \\det([P_1\\ \\cdots\\ P_m])\\ne0. \\qquad [\\text{Th 2.4.8}]\n\\end{aligned}\n\
  \\]\n\n下一个结果通常不包含在行列式的概述中，但它在以后将证明非常有价值。\n\n### 定理 2.4.10 (Cauchy–Binet 恒等式)\n\n\
  设 \\(1\\le k\\le m\\) 为整数。\n\n- (a) 若 \\(P\\) 和 \\(Q\\) 是 \\(\\operatorname{Mat}_{m\\\
  times k}\\) 中的矩阵，则\n\n\\[\n\\det(P^{\\mathsf T}Q)=\\sum_{I\\in\\mathcal I_{k,m}}\\\
  det(P^I)\\det(Q^I).\n\\]\n\n- (b) 若 \\(R\\) 和 \\(S\\) 是 \\(\\operatorname{Mat}_{k\\\
  times m}\\) 中的矩阵，则\n\n\\[\n\\det(RS^{\\mathsf T})=\\sum_{J\\in\\mathcal I_{k,m}}\\\
  det(R_J)\\det(S_J).\n\\]\n\n**Proof.** (a): 设 \\(Q=[q_j^i]\\)，于是\n\n\\[\nQ=[Q_{(1)}\\\
  \ \\cdots\\ Q_{(k)}],\\qquad Q_{(j)}=[q_j^1\\ \\cdots\\ q_j^m]^{\\mathsf T},\n\\\
  ]\n\n且\n\n\\[\nP^{\\mathsf T}Q_{(j)}=\\sum_i q_j^i(P^{\\mathsf T})_{(i)}\n\\]\n\n\
  对 \\(j=1,\\ldots,k\\)。我们有\n\n\\[\n\\begin{aligned}\n\\det(P^{\\mathsf T}Q)\n&=\\\
  det\\left([P^{\\mathsf T}Q_{(1)}\\ \\cdots\\ P^{\\mathsf T}Q_{(k)}]\\right)\\\\\n\
  &=\\det\\left(\\left[\\sum_{i_1}q_1^{i_1}(P^{\\mathsf T})_{(i_1)}\\ \\cdots\\ \\\
  sum_{i_k}q_k^{i_k}(P^{\\mathsf T})_{(i_k)}\\right]\\right)\\\\\n&=\\sum_{1\\le i_1,\\\
  ldots,i_k\\le m}q_1^{i_1}\\cdots q_k^{i_k}\\det\\left([(P^{\\mathsf T})_{(i_1)}\\\
  \ \\cdots\\ (P^{\\mathsf T})_{(i_k)}]\\right)\\\\\n&=\\sum_{\\substack{1\\le i_1,\\\
  ldots,i_k\\le m\\\\ i_1,\\ldots,i_k\\text{ 互不相同}}}q_1^{i_1}\\cdots q_k^{i_k}\\det\\\
  left([(P^{\\mathsf T})_{(i_1)}\\ \\cdots\\ (P^{\\mathsf T})_{(i_k)}]\\right)\\\\\
  \n&=\\sum_{1\\le i_1<\\cdots<i_k\\le m}\\left(\\sum_{\\sigma\\in S_k}q_1^{i_{\\\
  sigma(1)}}\\cdots q_k^{i_{\\sigma(k)}}\\det\\left([(P^{\\mathsf T})_{(i_{\\sigma(1)})}\\\
  \ \\cdots\\ (P^{\\mathsf T})_{(i_{\\sigma(k)})}]\\right)\\right).\n\\end{aligned}\n\
  \\]\n\n其中第三个等式由定理 2.4.2 得出。前一显示中最后一行的带大括号的项可以表示为\n\n\\[\n\\begin{aligned}\n&\\sum_{\\\
  sigma\\in S_k}q_1^{i_{\\sigma(1)}}\\cdots q_k^{i_{\\sigma(k)}}\\det\\left([(P^{\\\
  mathsf T})_{(i_{\\sigma(1)})}\\ \\cdots\\ (P^{\\mathsf T})_{(i_{\\sigma(k)})}]\\\
  right)\\\\\n&=\\sum_{\\sigma\\in S_k}q_1^{i_{\\sigma(1)}}\\cdots q_k^{i_{\\sigma(k)}}\\\
  operatorname{sgn}(\\sigma)\\det\\left([(P^{\\mathsf T})_{(i_1)}\\ \\cdots\\ (P^{\\\
  mathsf T})_{(i_k)}]\\right)\\\\\n&=\\det\\left([(P^{\\mathsf T})_{(i_1)}\\ \\cdots\\\
  \ (P^{\\mathsf T})_{(i_k)}]\\right)\\left(\\sum_{\\sigma\\in S_k}\\operatorname{sgn}(\\\
  sigma)q_1^{i_{\\sigma(1)}}\\cdots q_k^{i_{\\sigma(k)}}\\right)\\\\\n&=\\det\\left(P^{\\\
  mathsf T}_{(i_1,\\ldots,i_k)}\\right)\\det\\left(Q^{(i_1,\\ldots,i_k)}\\right).\n\
  \\end{aligned}\n\\]\n\n于是，\n\n\\[\n\\det(P^{\\mathsf T}Q)=\\sum_{1\\le i_1<\\cdots<i_k\\\
  le m}\\det\\left(P^{\\mathsf T}_{(i_1,\\ldots,i_k)}\\right)\\det\\left(Q^{(i_1,\\\
  ldots,i_k)}\\right),\n\\]\n\n这就是 Cauchy–Binet 恒等式的经典版本。\n\n### 定理 2.4.12\n\n若 \\\
  (V\\) 是向量空间，且 \\(\\mathcal H\\) 和 \\(\\mathcal F\\) 是 \\(V\\) 的基，则\n\n\\[\n\\det([\\\
  operatorname{id}_V]_{\\mathcal H}^{\\mathcal F})\\ne 0.\n\\]\n\n**Proof.** 我们有\n\
  \n\\[\n1=\\det([\\operatorname{id}_V]_{\\mathcal H}^{\\mathcal H}) \\qquad [(2.4.2)]\n\
  \\]\n\n\\[\n=\\det([\\operatorname{id}_V]_{\\mathcal F}^{\\mathcal H})\\det([\\\
  operatorname{id}_V]_{\\mathcal H}^{\\mathcal F}) \\qquad [\\text{Th 2.2.2(c), Th\
  \ 2.4.5(a)}],\n\\]\n\n由此结果得出。\n\n在与定理 2.2.3 相关的讨论中提到，\\(\\operatorname{Mat}_{m\\\
  times m}\\) 在通常的矩阵加法和矩阵乘法运算下是一个环，故它在矩阵加法下是一个群。但 \\(\\operatorname{Mat}_{m\\times\
  \ m}\\) 显然不是在矩阵乘法下是一个群，因为并非所有矩阵都有逆。然而，\\(\\operatorname{Mat}_{m\\times m}\\) 包含若干矩阵群。其中最大的是由所有可逆矩阵组成的一般线性群：\n\
  \n\\[\nGL(m)=\\{P\\in\\operatorname{Mat}_{m\\times m}:\\det(P)\\ne0\\},\n\\]\n\n\
  其中使用行列式的刻画由定理 2.4.8 得出。\n\n我们说 \\(\\operatorname{Mat}_{m\\times m}\\) 中的矩阵 \\(P\\\
  ) 是正交的，如果 \\(P^{\\mathsf T}P=I_m\\)。如果是，则 \\(P^{\\mathsf T}=P^{-1}\\)，故 \\(PP^{\\\
  mathsf T}=PP^{-1}=I_m\\)。于是，\\(P^{\\mathsf T}P=I_m\\) 当且仅当 \\(PP^{\\mathsf T}=I_m\\\
  )。正交群是 \\(GL(m)\\) 的子群，由所有正交矩阵组成：\n\n\\[\nO(m)=\\{P\\in GL(m):P^{\\mathsf T}P=I_m\\\
  }.\n\\]\n\n对于 \\(O(m)\\) 中的矩阵 \\(P\\)，我们有\n\n\\[\n1=\\det(I_m)=\\det(P^{\\mathsf\
  \ T}P)=\\det(P^{\\mathsf T})\\det(P)=\\det(P)^2,\n\\]\n\n故 \\(\\det(P)=\\pm1\\)。特殊正交群是\
  \ \\(O(m)\\) 的子群，由所有行列式等于 \\(1\\) 的矩阵组成：\n\n\\[\nSO(m)=\\{P\\in O(m):\\det(P)=1\\\
  }.\n\\]\n\n## 2.5 线性映射的迹与行列式\n\n矩阵的迹在第 2.1 节中定义，行列式在第 2.4 节中定义。我们现在将这些概念推广到线性映射。\n\
  \n设 \\(V\\) 是向量空间，\\(\\mathcal H\\) 是 \\(V\\) 的基，\\(A:V\\longrightarrow V\\) 是线性映射。\\\
  (A\\) 的迹定义为\n\n\\[\n\\operatorname{tr}(A)=\\operatorname{tr}([A]_{\\mathcal H}^{\\\
  mathcal H}), \\qquad (2.5.1)\n\\]\n\n\\(A\\) 的行列式定义为\n\n\\[\n\\det(A)=\\det([A]_{\\\
  mathcal H}^{\\mathcal H}). \\qquad (2.5.2)\n\\]\n\n\n\n\n\n## 定理 2.5.1. 在上述设定下，$\\\
  operatorname{tr}(A)$ 和 $\\det(A)$ 与 $V$ 的基的选择无关。\n\n*证明.* 设 $\\mathcal{F}$ 是 $V$\
  \ 的另一组基。由定理 2.2.6，\n\n$$[A]_{\\mathcal{H}}^{\\mathcal{H}}=\\left([\\operatorname{id}_V]_{\\\
  mathcal{H}}^{\\mathcal{F}}\\right)^{-1}[A]_{\\mathcal{F}}^{\\mathcal{F}}[\\operatorname{id}_V]_{\\\
  mathcal{H}}^{\\mathcal{F}}.$$\n\n我们由定理 2.1.7(c) 得到\n\n$$\\operatorname{tr}\\left([A]_{\\\
  mathcal{H}}^{\\mathcal{H}}\\right)=\\operatorname{tr}\\left([A]_{\\mathcal{F}}^{\\\
  mathcal{F}}\\right),$$\n\n并且由定理 2.4.5 得到\n\n$$\\det\\left([A]_{\\mathcal{H}}^{\\\
  mathcal{H}}\\right)=\\det\\left([A]_{\\mathcal{F}}^{\\mathcal{F}}\\right).$$\n\n\
  ## 定理 2.5.2. 若 $V$ 是一个向量空间且 $A,B:V\\longrightarrow V$ 是线性映射，则：\n\n- (a) $\\det(\\\
  operatorname{id}_V)=1$。\n- (b) $\\det(A\\circ B)=\\det(A)\\det(B)$。\n- (c) 若 $A$\
  \ 是线性同构，则 $\\det(A^{-1})=\\det(A)^{-1}$。\n- (d) $\\det(A^*)=\\det(A)$。\n\n*证明.*\
  \ (a): 这由定理 2.2.3(b) 和 (2.4.2) 推出。\n\n(b): 这由定理 2.2.3(b) 和定理 2.4.5(a) 推出。\n\n(c):\
  \ 这由定理 2.2.3(b) 和定理 2.4.5(b) 推出。\n\n(d): 这由定理 2.2.7 和定理 2.4.5(c) 推出。\n\n## 定理 2.5.3.\
  \ 设 $V$ 是一个向量空间，且 $A:V\\longrightarrow V$ 是一个线性映射。则 $A$ 是线性同构当且仅当 $\\det(A)\\ne\
  \ 0$。\n\n*证明.* 这由定理 2.2.3(b) 和定理 2.4.8 推出。\n"
- "## 第 3 章\n\n## 双线性函数\n\n内积是读者可能熟悉的双线性函数的例子。在本书中，我们更感兴趣的是称为标量积的、限制较少的双线性函数类型，但我们不会完全忽略内积。为了判断一个双线性函数是否为标量积，我们需要确定它是否对称且非退化。双线性函数的这些性质将是本章的重点。\n\
  \n### 3.1 双线性函数\n\n设 $V$ 是一个向量空间。函数\n\n$$\\mathfrak{b}: V \\times V \\longrightarrow\
  \ \\mathbb{R}$$\n\n被称为 **双线性（在 $V$ 上）**，如果它在两个变量上都是线性的；也就是说，\n\n$$\\mathfrak{b}(cu+v,w)=c\\\
  mathfrak{b}(u,w)+\\mathfrak{b}(v,w)$$\n\n并且\n\n$$\\mathfrak{b}(u,cv+w)=c\\mathfrak{b}(u,v)+\\\
  mathfrak{b}(u,w)$$\n\n对所有 $V$ 中的向量 $u,v,w$ 和所有实数 $c$ 成立。在文献中，双线性函数有时被称为 **二次型**。我们通常用\n\
  \n$$\\mathfrak{b}(\\cdot,\\cdot)\\quad\\text{by}\\quad\\langle\\cdot,\\cdot\\rangle,$$\n\
  \n记作 $\\langle v,w\\rangle$ 代替 $\\mathfrak{b}(v,w)$。\n\n我们说 b 是：\n\n- **对称** 的，如果\
  \ $\\langle v, w\\rangle = \\langle w, v\\rangle$ 对所有 $v, w$ 在 $V$ 中成立。\n- **交错**\
  \ 的，如果 $\\langle v, w\\rangle = -\\langle w, v\\rangle$ 对所有 $v, w$ 在 $V$ 中成立。\n\
  - **非退化** 的，如果对所有 $v$ 在 $V$ 中，$\\langle v, w\\rangle = 0$ 对所有 $w$ 在 $V$ 成立蕴含 $v\
  \ = 0$。\n- **退化** 的，如果 b 不是非退化的。\n- **正定** 的，如果对所有非零 $v$ 在 $V$ 中 $\\langle v, v\\\
  rangle > 0$。\n- **负定** 的，如果对所有非零 $v$ 在 $V$ 中 $\\langle v, v\\rangle < 0$。\n- **定**\
  \ 的，如果 b 是正定或负定。\n- **不定** 的，如果 b 不是定的。\n- **正半定** 的，如果对所有 $v$ 在 $V$ 中 $\\langle\
  \ v, v\\rangle \\ge 0$。\n- **负半定** 的，如果对所有 $v$ 在 $V$ 中 $\\langle v, v\\rangle \\\
  le 0$。\n- **半定** 的，如果 b 是正半定或负半定。\n\n设 $U$ 是 $V$ 的子空间。为简便起见，我们用 $b|_{U\\times U}$\
  \ 表示限制\n\n$b|_{U\\times U}$ 由 $b|_U$ 表示。\n\n事实上，我们通常完全省略 “$|_U$” 的记号，例如说 b 在 $U$\
  \ 上对称，如果 $b|_U$ 对称。显然，b 在 $U$ 上是双线性的，并且如果 b 在 $V$ 上对称（分别地，交错、定、半定），则 b 在 $U$ 上对称（分别地，交错、定、半定）。非退化的情况更为复杂。如果\
  \ b 在 $V$ 上非退化，则不一定推出 b 在 $U$ 上非退化。我们稍后会探讨这一现象。\n\n### 例 3.1.1. 下表给出了 $\\mathbb{R}^3$\
  \ 上双线性函数的例子。注意双线性函数可以是对称的也可以不是，与此独立，可以是非退化的也可以不是。\n\n| $\\langle(x^1, x^2, x^3),\
  \ (y^1, y^2, y^3)\\rangle$ | 对称 | 定 | 半定 | 非退化 |\n|---|---|---|---|---|\n| $x^1y^1\
  \ + x^2y^2 + x^3y^3$ | yes | yes | yes | yes |\n| $x^1y^1 + x^2y^2$ | yes | no |\
  \ yes | no |\n| $x^1y^1 + x^2y^2 - x^3y^3$ | yes | no | no | yes |\n| $x^1y^1 -\
  \ x^3y^3$ | yes | no | no | no |\n| $x^1y^1 + x^2y^3 - x^3y^2$ | no | no | yes |\
  \ yes |\n| $x^1y^1 + x^2y^3$ | no | no | no | no |\n\n借用狭义相对论的术语，我们说（相对于 b）$V$ 中的向量\
  \ $v$ 是：\n\n- **类空** 的，如果 $v = 0$ 或 $\\langle v, v\\rangle > 0$。\n- **类时** 的，如果\
  \ $\\langle v, v\\rangle < 0$。\n- **类光** 的，如果 $v \\neq 0$ 且 $\\langle v, v\\rangle\
  \ = 0$。\n\n零向量通常被认为是类空的（这里也是如此），但在某些文献中它被认为是类光的。显然，每个向量都是类空、类时或类光的，这导致了 $V$ 的相应划分。（本书在不同地方对“划分”一词有几种标准但不同的用法。这里所指的定义见附录\
  \ A。）\n\n设 b 是向量空间 $V$ 上的双线性函数，且 $H = (h_1, \\dots, h_m)$ 是 $V$ 的一组基。b 相对于 $H$ 的矩阵记为\
  \ $b_H$ 并定义为\n\n```\nb_H = [ b_{11} … b_{1m} ; ⋮ ⋱ ⋮ ; b_{m1} … b_{mm} ]\n```\n\n\
  其中\n\n```\nb_{ij} = ⟨h_i, h_j⟩\n```\n\n对 $i, j = 1, …, m$。\n\n接下来的两个结果说明了矩阵表示如何有助于涉及双线性函数的计算。\n\
  \n## 定理 3.1.2. 设 $V$ 是一个维数为 $m$ 的向量空间，b 是 $V$ 上的双线性函数，且 $H$ 是 $V$ 的一组基。则：\n\n- (a)\
  \ 对所有 $V$ 中的向量 $v, w$，\n  $\\langle v, w\\rangle = ([v]_H)^T b_H [w]_H$。\n- (b)\
  \ 对所有整数 $1 \\le k \\le m$ 和所有向量 $v_1, …, v_k, w_1, …, w_k$ 在 $V$ 中，\n  $\\begin{bmatrix}\
  \ \\langle v_1,w_1\\rangle & \\dots & \\langle v_1,w_k\\rangle \\\\ \\vdots & \\\
  ddots & \\vdots \\\\ \\langle v_k,w_1\\rangle & \\dots & \\langle v_k,w_k\\rangle\
  \ \\end{bmatrix} = [ [v_1]_H \\dots [v_k]_H ]^T b_H [ [w_1]_H \\dots [w_k]_H ]$。\n\
  \n证明. (a): 设 $H = (h_1, …, h_m)$，且 $v = \\sum_i a^i h_i$ 且 $w = \\sum_j b^j h_j$。则\n\
  \n```\n([v]_H)^T = [a^1 … a^m] and [w]_H = [b^1 … b^m]^T,\n```\n\n故\n\n```\n⟨v,\
  \ w⟩ = ⟨ Σ_i a^i h_i, Σ_j b^j h_j ⟩ = Σ_{ij} a^i b^j ⟨h_i, h_j⟩ = Σ_{ij} a^i b^j\
  \ b_{ij} = ([v]_H)^T b_H [w]_H.\n```\n\n(b): 它由定理 2.1.5(b) 和部分 (a) 推出\n\n$[[v_1]_H\
  \ ... [v_k]_H]^T b_H [[w_1]_H ... [w_k]_H] = [([v_i]_H)^T b_H [w_j]_H] = [\\langle\
  \ v_i, w_j\\rangle]$\n\n## 定理 3.1.3（基变换）。设 $V$ 是一个向量空间，b 是 $V$ 上的双线性函数，且 $H$ 和 $F$\
  \ 是 $V$ 的基。则\n\n$b_F = ([id_V]_F^H)^T b_H [id_V]_F^H$。\n\n证明. 我们有\n\n$([id_V]_F^H)^T\
  \ b_H [id_V]_F^H = [[f_1]_H ... [f_m]_H]^T b_H [[f_1]_H ... [f_m]_H]$ [(2.2.7)]\
  \ $= [\\langle f_i, f_j\\rangle]$ [Th 3.1.2(b)] $= b_F$。\n\n我们以几个稍后有用的定义结束本节。设 $V$\
  \ 是一个向量空间，且 b 是 $V$ 上的双线性函数。对应于 b 的二次函数是函数\n\n$q : V \\longrightarrow \\mathbb{R}$\n\
  \n定义为\n\n$q(v) = \\langle v, v\\rangle$\n\n对所有 $V$ 中的向量 $v$。容易证明\n\n$q(v + w) -\
  \ q(v) - q(w) = b(v, w) + b(w, v)$ (3.1.1)\n\n对所有 $V$ 中的向量 $v, w$。\n\n若干先前的定义可以用\
  \ $q$ 表示。具体地，b 是：\n\n- 正定的，如果 $q(v) > 0$ 对所有非零 $v$ 在 $V$ 中。\n- 负定的，如果 $q(v) < 0$\
  \ 对所有非零 $v$ 在 $V$ 中。\n- 正半定的，如果 $q(v) \\ge 0$ 对所有 $v$ 在 $V$ 中。\n- 负半定的，如果 $q(v)\
  \ \\le 0$ 对所有 $v$ 在 $V$ 中。\n- 类空的，如果 $v = 0$ 或 $q(v) > 0$。\n- 类时的，如果 $q(v) < 0$。\n\
  - 类光的，如果 $v \\neq 0$ 且 $q(v) = 0$。\n\n我们说 $v$ 是单位向量，如果 $\\langle v, v\\rangle =\
  \ \\pm 1$，并且 $v$ 与 $w$ 正交，如果 $\\langle v, w\\rangle = 0$。特别地，零向量与 $V$ 中的每个向量正交，\n\
  \n并且类光向量与自身正交。除非 **b** 对称，$\\langle w,v\\rangle$ 可能不等于 $\\langle v,w\\rangle$。因此，即使\
  \ $v$ 与 $w$ 正交，也不一定推出 $w$ 与 $v$ 正交。\n\n设 $U$ 是 $V$ 的子空间。**$U$ 的 perp（在 $V$ 中相对于\
  \ $\\mathbf b$）** 记为 $U^\\perp$ 并定义为与 $U$ 中每个向量正交（垂直）的 $V$ 中向量的集合：\n\n$U^\\perp\
  \ = \\{v \\in V : \\langle v, u\\rangle = 0 \\text{ for all } u \\in U\\}.$\n\n\
  容易证明 $U^\\perp$ 是 $V$ 的子空间。设我们记\n\n$(U^\\perp)^\\perp$ 为 $U^{\\perp\\perp}$。\n\n\
  $V$ 的 **光集** 记为 $\\Lambda$ 并定义为 $V$ 中类光向量的集合：\n\n$\\Lambda = \\{v \\in V : \\langle\
  \ v, v\\rangle = 0\\} \\setminus \\{0\\}.$\n\n### 3.2 对称双线性函数\n\n设 $V$ 是一个向量空间，且\
  \ **b** 是 $V$ 上的双线性函数。回顾第 3.1 节，**b** 在 $V$ 上被称为对称，如果 $\\langle v,w\\rangle = \\\
  langle w,v\\rangle$ 对所有向量 $v,w$ 在 $V$ 中。\n\n## 定理 3.2.1. 若 $V$ 是一个向量空间且 **b** 是\
  \ $V$ 上的双线性函数，则以下等价：\n\n(a) **b** 是对称的（作为双线性函数）。\n\n(b) $\\mathbf b_{\\mathcal H}$\
  \ 是对称的（作为矩阵）对某个 $V$ 的基 $\\mathcal H$。\n\n(c) $\\mathbf b_{\\mathcal H}$ 是对称的（作为矩阵）对每个\
  \ $V$ 的基 $\\mathcal H$。\n\n**证明.** (a) ⇒ (c): 显然。\n\n(c) ⇒ (b): 显然。\n\n(b) ⇒ (a):\
  \ 我们有\n\n\\[\n\\begin{aligned}\n\\langle v,w\\rangle &= ([v]_{\\mathcal H})^{\\\
  mathsf T}\\mathbf b_{\\mathcal H}[w]_{\\mathcal H} && [\\text{Th 3.1.2(a)}]\\\\\n\
  &=([v]_{\\mathcal H})^{\\mathsf T}\\mathbf b_{\\mathcal H}^{\\mathsf T}[w]_{\\mathcal\
  \ H} &&\\\\\n&=(([w]_{\\mathcal H})^{\\mathsf T}\\mathbf b_{\\mathcal H}[v]_{\\\
  mathcal H})^{\\mathsf T} && [\\text{Th 2.1.2(b)}]\\\\\n&=\\langle w,v\\rangle^{\\\
  mathsf T} && [\\text{Th 3.1.2(a)}]\\\\\n&=\\langle w,v\\rangle.\n\\end{aligned}\n\
  \\]\n\n## 定理 3.2.2. 设 $V$ 是一个向量空间，**b** 是 $V$ 上的双线性函数，且 $q$ 是相应的二次函数。则 **b** 对称当且仅当\n\
  \n\\[\n\\mathbf b(v,w)=\\frac{q(v+w)-q(v)-q(w)}{2}\n\\]\n\n（极化恒等式）\n\n对所有向量 $v,w$\
  \ 在 $V$ 中。\n\n\n\n\n\n**证明。** $(\\Rightarrow)$：这由 (3.1.1) 可得。  \n$(\\Leftarrow)$：显而易见。\n\
  \n定理 3.2.2 表明，只要 $\\mathbf b$ 是对称的，$\\mathbf b$ 和 $q$ 完全相互确定。\n\n## 定理 3.2.3.\n\
  设 $V$ 为向量空间，$\\mathbf b$ 为 $V$ 上的双线性函数，$q$ 为相应的二次函数。则以下条件等价：\n\n- (a) $\\mathbf\
  \ b$ 是交错的。  \n- (b) $q=0$。  \n- (c) $V$ 没有单位向量。\n\n**证明。** (a) $\\Rightarrow$ (b)：由于对\
  \ $V$ 中所有向量 $v,w$ 都有 $\\langle v,w\\rangle=-\\langle w,v\\rangle$，令 $w=v$ 得 $q(v)=-q(v)$，故\
  \ $q(v)=0$，对 $V$ 中所有向量 $v$ 成立。\n\n(b) $\\Rightarrow$ (a)：这由 (3.1.1) 可得。  \n(b) $\\\
  Leftrightarrow$ (c)：我们证明逻辑等价的断言：$q\\ne0$ 当且仅当 $V$ 有单位向量。若 $q\\ne0$，则存在 $V$ 中非零向量\
  \ $v$ 使 $q(v)\\ne0$，故 $v/\\sqrt{|q(v)|}$ 是单位向量。逆命题同样显而易见。\n\n我们特别感兴趣的是存在非零对称双线性函数的向量空间。原因在于此类向量空间具有单位向量，如今我们来证明。\n\
  \n## 定理 3.2.4.\n设 $V$ 为向量空间，$\\mathbf b$ 为 $V$ 上的对称双线性函数，$q$ 为相应的二次函数。则：\n\n- (a)\
  \ $\\mathbf b=0$ 当且仅当 $q=0$。  \n- (b) 若 $\\mathbf b\\ne0$，则 $V$ 有单位向量。\n\n**证明。**\
  \ (a) $(\\Rightarrow)$：显而易见。  \n(a) $(\\Leftarrow)$：这由定理 3.2.2 可得。  \n(b)：由部分 (a)，$q\\\
  ne0$。结果现在由定理 3.2.3 可得。\n\n向量空间的光锥集是一个相当神秘的实体。下一个结果提供了在双线性函数满足某些性质时其刻画。\n\n## 定理\
  \ 3.2.5.\n若 $V$ 为向量空间且 $\\mathbf b$ 为 $V$ 上的对称半定双线性函数，则\n\n$$\\Lambda=V^\\perp\\\
  setminus\\{0\\}.$$\n\n**注。** 上述恒等式等价于说，对 $V$ 中每个非零向量 $v$，$\\langle v,v\\rangle=0$\
  \ 当且仅当对 $V$ 中所有向量 $w$ 都有 $\\langle w,w\\rangle=0$。\n\n**证明。** 显然，$V^\\perp\\setminus\\\
  {0\\}\\subseteq\\Lambda$。为证明反向包含，设 $q$ 为对应于 $\\mathbf b$ 的二次函数，并设 $v$ 和 $w$ 分别为\
  \ $\\Lambda$ 和 $V$ 中的向量。考虑多项式 $p(t):\\mathbb R\\to\\mathbb R$ 定义为\n\n$$p(t)=q(tv+w)=2\\\
  langle v,w\\rangle t+\\langle w,w\\rangle.$$\n\n我们有 $\\langle v, w\\rangle = 0$；否则\
  \ $p(t)$ 取正负值，这与 $\\mathbf b$ 的半定性矛盾。由于 $w$ 是任意的，$v$ 在 $V^\\perp\\setminus\\{0\\\
  }$ 中。于是，$\\Lambda \\subseteq V^\\perp\\setminus\\{0\\}$。\n\n下一个结果只是柯西-施瓦茨不等式在数学多个领域出现的众多版本之一。我们将在第\
  \ 4.6 节看到另一个可能更熟悉的变体。\n\n## 定理 3.2.6 (柯西-施瓦茨不等式)。\n若 $V$ 为向量空间且 $\\mathbf b$ 为 $V$\
  \ 上的对称半定双线性函数，则\n\n$$\\langle v, w\\rangle^2 \\le \\langle v, v\\rangle\\langle\
  \ w, w\\rangle \\tag{3.2.1}$$\n\n对 $V$ 中所有向量 $v, w$ 成立。\n\n证明。结果在 $v = 0$ 或 $w =\
  \ 0$ 时是平凡的，故设 $v, w \\ne 0$。设 $q$ 为对应于 $\\mathbf b$ 的二次函数，并考虑多项式 $p(t) : \\mathbb\
  \ R \\longrightarrow \\mathbb R$ 定义为\n\n$p(t) = q(tv + w) = \\langle v, v\\rangle\
  \ t^2 + 2\\langle v, w\\rangle t + \\langle w, w\\rangle$.\n\n若 $\\langle v, v\\\
  rangle$ 或 $\\langle w, w\\rangle = 0$，即若 $v$ 或 $w$ 在 $\\Lambda$ 中，则由定理 3.2.5，$\\\
  langle v, w\\rangle = 0$，故 (3.2.1) 成立。现在设 $\\langle v, v\\rangle, \\langle w, w\\\
  rangle \\ne 0$。根据二次公式，$p(t)$ 有两个（不一定不同）的根\n\n$-2\\langle v, w\\rangle \\pm \\sqrt{\\\
  langle v, w\\rangle^2 - \\langle v, v\\rangle\\langle w, w\\rangle} / \\langle v,\
  \ v\\rangle$.\n\n根据假设，$\\mathbf b$ 是半定的。设 $\\mathbf b$ 是正半定的，此时 $p(t) \\ge 0$。若\
  \ $p(t) > 0$ 对所有 $t$ 在 $\\mathbb R$ 中成立，则 $p(t)$ 关于 $t$ 的图像不与 $t$ 轴相交。可知 $p(t)$\
  \ 有两个非实复根，这等价于 $\\langle v, w\\rangle^2 - \\langle v, v\\rangle\\langle w, w\\rangle\
  \ < 0$。于是，(3.2.1) 成立。若对某个 $t_0$ 在 $\\mathbb R$ 中有 $p(t_0) = 0$，则 $p(t)$ 关于 $t$ 的图像在单点\
  \ $t_0$ 处与 $t$ 轴相交。可知 $t_0$ 是重根，这等价于 $\\langle v, w\\rangle^2 - \\langle v, v\\\
  rangle\\langle w, w\\rangle = 0$。再次，(3.2.1) 成立。这证明了正半定情形。若 $\\mathbf b$ 是负半定，则 $-\\\
  mathbf b$ 是正半定，我们再次得到 (3.2.1)。\n\n## 3.3 平坦映射与尖锐映射\n\n熟悉张量分析的读者，尤其是在理论物理的背景下，可能对涉及“降指标”和“升指标”的计算有所熟悉。本节和第\
  \ 4.5 节使用平坦映射和尖锐映射来发展这些思想。\n\n设 $V$ 为向量空间，$\\mathbf b$ 为 $V$ 上的双线性函数。对应于 $\\mathbf\
  \ b$ 的平坦映射是线性映射\n\n$F : V \\longrightarrow V^*$\n\n**证明。** 对 $V$ 中向量 $w$，定理 1.2.1(d)\
  \ 给出 $w=\\sum_j\\theta^j(w)b_j$。则\n\n$$v^F(w)=\\langle v,w\\rangle=\\left\\langle\\\
  sum_i a^i h_i,\\sum_j\\theta^j(w)h_j\\right\\rangle=\\sum_{ij}a^i\\theta^j(w)\\\
  langle h_i,h_j\\rangle$$\n\n$$=\\sum_{ij}a^i\\theta^j(w)b_{ij}=\\left(\\sum_{ij}b_{ji}a^i\\\
  theta^j\\right)(w)$$\n\n$$=\\left(\\sum_i\\left[\\sum_j b_{ji}a^j\\right]\\theta^i\\\
  right)(w)=\\left(\\sum_i a_i\\theta^i\\right)(w).$$\n\n由于 $w$ 是任意的，$v^F=\\sum_i\
  \ a_i\\theta^i$。为直接证明简洁版本：\n\n$$[v^F]_\\Theta=[F(v)]_\\Theta$$\n$$=[F]^\\Theta_\\\
  mathcal{H}[v]_\\mathcal{H}\\qquad\\text{[Th 2.2.4]}$$\n$$=b^T_\\mathcal{H}[v]_\\\
  mathcal{H}.\\qquad\\text{[Th 3.3.1(b)]}$$\n\n我们从 (3.3.2)–(3.3.4) 看出，将 $v$ 的平坦映射取为\
  \ $v^F$ 在经典上被称为通过 $\\flat$ **降低指标**。\n\n设 $V$ 为向量空间，$\\mathfrak b$ 为 $V$ 上的双线性函数。回顾第\
  \ 3.1 节，$\\mathfrak b$ 在 $V$ 上称为非退化，如果对 $V$ 中所有向量 $v$，$\\langle v,w\\rangle=0$ 对所有向量\
  \ $w$ 在 $V$ 中成立蕴含 $v=0$。\n\n## 定理 3.3.3.\n*若 $V$ 为向量空间且 $\\mathfrak b$ 为 $V$ 上的双线性函数，则以下条件等价：*\n\
  \n(a) $\\mathfrak b$ *在 $V$ 上非退化。*\n\n(b) $V^\\perp=\\{0\\}$。\n\n(c) $F$ *是线性同构。*\n\
  \n(d) *对某个（从而每个）$V$ 的基 $\\mathcal{H}$，$b_\\mathcal{H}$ 的行（从而列）线性无关。*\n\n(e) $b_\\\
  mathcal{H}$ *对某个（从而每个）基 $\\mathcal{H}$ 为 $V$ 可逆。*\n\n(f) $\\det(b_{ij})\\ne0$ *对某个（从而每个）基\
  \ $\\mathcal{H}$ 为 $V$ 成立。*\n\n**证明。** (a) $\\Leftrightarrow$ (b)：显而易见。\n\n(b) $\\\
  Leftrightarrow$ (c)：我们有\n\n$$V^\\perp=\\{v\\in V:v^F(w)=0\\text{ for all }w\\in\
  \ V\\}$$\n$$=\\{v\\in V:v^F=0\\}=\\ker(F).$$\n\n结果现在由定理 1.1.12、定理 1.1.14 和定理 1.2.1(c)\
  \ 可得。\n\n(c) $\\Leftrightarrow$ (d)：设 $\\dim(V)=m$，并设 $\\Theta$ 为对应于 $\\mathcal{H}$\
  \ 的对偶基。则\n\n$$\\operatorname{rank}(F)=\\operatorname{rank}\\left([F]^\\Theta_\\\
  mathcal{H}\\right)\\qquad\\text{[Th 2.3.1, (2.3.1)]}$$\n$$=\\operatorname{rank}(b^T_\\\
  mathcal{H})\\qquad\\text{[Th 3.3.1(b)]}$$\n$$=\\operatorname{rank}(b_\\mathcal{H}),\\\
  qquad\\text{[Th 2.3.2]}$$\n\n证明。 (a)：对 $V$ 中向量 $v$ 和 $w$，我们有\n\n$$\\mathrm{F}^*(v)(w)\
  \ = v(\\mathrm{F}(w)) \\qquad [(1.3.1)]$$\n$$= \\mathrm{F}(w)(v) \\qquad [(1.2.3)]$$\n\
  $$= \\langle w, v\\rangle = \\langle v, w\\rangle$$\n$$= \\mathrm{F}(v)(w). \\qquad\
  \ [(1.2.3)]$$\n\n由于 $v$ 和 $w$ 是任意的，$\\mathrm{F}^* = \\mathrm{F}$。\n\n(b)：证明与部分 (a)\
  \ 类似。\n"

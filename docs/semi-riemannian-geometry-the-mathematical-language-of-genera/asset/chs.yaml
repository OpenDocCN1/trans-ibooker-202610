  \ j_i…j_{s-1}}^q e_q, e_p⟩\n= Σ_q \U0001D49C_{j₁…j_{i-1}p j_i…j_{s-1}}^q ⟨e_q, e_p⟩\n\
  = ε_p \U0001D49C_{j₁…j_{i-1}p j_i…j_{s-1}}^p,\n\n所以\n\n\U0001D49C_{j₁…j_{i-1}p j_i…j_{s-1}}^p\
  \ = ε_p ⟨\U0001D505ₛ⁻¹(\U0001D49C)(e_{j₁},…,e_{j_{i-1}},e_p,e_{j_i},…,e_{j_{s-1}}),\
  \ e_p⟩. (6.1.2)\n\n于是 (6.1.1) 和 (6.1.2) 给出\n\nC_l¹(\U0001D49C)(e_{j₁},…,e_{j_{s-1}})\
  \ = Σ_p ε_p ⟨\U0001D505ₛ⁻¹(\U0001D49C)(e_{j₁},…,e_{j_{i-1}},e_p,e_{j_i},…,e_{j_{s-1}}),\
  \ e_p⟩.\n\n对任意向量 v₁,…,v_{s-1} 在 V 中的结果由 C_l¹(\U0001D49C) 和 \U0001D505ₛ⁻¹(\U0001D49C\
  ) 的多线性性得出。\n\n(b)：我们有\n\nΣ_i ε_i ⟨\U0001D505⁻¹(\U0001D49C)(e_i), e_i⟩ = Σ_i ε_i\

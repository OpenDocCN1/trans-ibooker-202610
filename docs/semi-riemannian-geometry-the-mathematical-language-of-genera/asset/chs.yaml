  \ $\\zeta$ 成立。由于 $(\\Omega_V)$ 是 $\\Lambda^m(V)$ 的一组基，由 (8.5.1) 和 (8.5.2) 可得 $\\\
  langle\\xi,\\zeta\\rangle^\\Lambda=\\langle\\star(\\eta),\\zeta\\rangle^\\Lambda$，从而\
  \ $\\langle\\xi-\\star(\\eta),\\zeta\\rangle^\\Lambda=0$。因为 $\\zeta$ 是任意的，且由定理 7.5.3(a)，$\\\
  langle\\cdot,\\cdot\\rangle^\\Lambda$ 是非退化的，所以 $\\xi-\\star(\\eta)=0$。\n\n**霍奇星算子**\
  \ 是如下线性映射族\n\n$$\\star:\\Lambda^s(V)\\longrightarrow\\Lambda^{m-s}(V)$$\n\n对 $s\\\
  le m$ 由映射\n\n$$\\eta\\longmapsto\\star(\\eta)$$\n\n对所有 $\\Lambda^s(V)$ 中的多向量 $\\\
  eta$ 定义。我们记\n\n$$\\star\\circ\\star\\qquad\\text{by}\\qquad\\star^2.$$\n\n### 定理\
  \ 8.5.2. 设 $(V,\\mathfrak{g},\\mathfrak{O})$ 是定向标量积空间，设 $(e_1,\\dots,e_m)$ 是 $V$\
  \ 的关于 $\\mathfrak{O}$ 正定向的标准正交基，设 $(\\xi^1,\\dots,\\xi^m)$ 是其对偶基，并设 $I$ 是 $\\mathcal{I}_{s,m}$\
  \ 中的一个多重指标。则\n\n$\\star(\\xi^I) = \\operatorname{sgn}(\\sigma_{(I,I^c)})\\langle\\\
  xi^{I^c},\\xi^{I^c}\\rangle^{\\Lambda}\\xi^{I^c}$,\n\n其中 $\\sigma_{(I,I^c)}$ 是第\
  \ B.2 节中定义的置换。\n\n证明. 由定理 7.5.3(b) 可知 $(\\xi^I : I \\in \\mathcal{I}_{s,m})$ 是 $(\\\
  Lambda^s(V),\\mathfrak{g}^{\\Lambda})$ 的标准正交基，再由定理 4.2.7 可得\n\n$\\star(\\xi^I) =\
  \ \\sum_{J \\in \\mathcal{I}_{m-s,m}} \\langle\\xi^J,\\xi^J\\rangle^{\\Lambda}\\\

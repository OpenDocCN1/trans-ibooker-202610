  \ k_r}_{l_1\\dots l_s}\\, \\delta^{i_1}_{k_1}\\cdots\\delta^{i_r}_{k_r}\\,\\delta^{l_1}_{j_1}\\\
  cdots\\delta^{l_s}_{j_s}\\\\\n&= \\mathcal{A}^{i_1\\dots i_r}_{j_1\\dots j_s}\\\\\
  \n&= \\mathcal{A}(\\theta^{i_1},\\dots,\\theta^{i_r},h_{j_1},\\dots,h_{j_s}).\n\\\

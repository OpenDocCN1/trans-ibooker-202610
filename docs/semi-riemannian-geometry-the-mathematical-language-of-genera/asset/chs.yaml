  \n**图 11.6.1.** 微分映射\n\n由定理 11.3.1(d) 可知，$d_q(\\varphi)$ 可逆，所以\n\n$$\\frac{d\\mu}{dt}(t_0)=d_q(\\\
  varphi)^{-1}(v).$$\n\n我们由定理 11.6.1 可知 $G=\\psi^{-1}\\circ F\\circ\\varphi$ 是（欧几里得）光滑的，然后由定理\

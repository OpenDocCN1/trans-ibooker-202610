  \ and Theorem 19.5.4.\n\n(b): This follows from Theorem 18.7.1(b) and Theorem 19.5.4.\
  \ □\n\n## 19.6 Contraction of Tensor Fields\n\nThe contraction of tensor fields\
  \ on smooth manifolds was considered in Section 15.14. We now return to this topic\
  \ armed with the properties of semi-Riemannian manifolds.\n\n**Theorem 19.6.1 (Orthonormal\
  \ Frame Expression for Ordinary Contraction).** Let $(M,g)$ be a semi-Riemannian\
  \ $m$-manifold with signature $(\\varepsilon_1,\\ldots,\\varepsilon_m)$, let $(E_1,\\\
  ldots,E_m)$ be an orthonormal frame on an open set $U$ in $M$, and let $\\mathcal{A}$\
  \ be a tensor field in $\\mathcal{T}^1_s(M)$. Then:\n\n- **(a)** For integers $s\
  \ \\ge 2$ and $1 \\le l \\le s-1$, the tensor field $\\mathrm{C}_l^1(\\mathcal{A})$\
  \ in $\\mathcal{T}_{s-1}^0(M)$ is given on $U$ by\n  $$\n  \\mathrm{C}_l^1(\\mathcal{A})(X_1,\\\
  ldots,X_{s-1})\n  = \\sum_i \\varepsilon_i \\left\\langle \\mathfrak{R}_s^{-1}\\\
  circ \\mathrm{C}_s^1(\\mathcal{A})(X_1,\\ldots,X_{l-1},E_i,X_l,\\ldots,X_{s-1}),\
  \ E_i\\right\\rangle,\n  $$\n  for all vector fields $X_1,\\ldots,X_{s-1}$ in $\\\
  mathfrak{X}(M)$, where $\\mathfrak{R}_s$ and $\\mathrm{C}_s^1$ are given by (19.5.1)\
  \ and (15.7.1), respectively.\n\n- **(b)** For $s = 1$, the function $\\mathrm{C}_1^1(\\\
  mathcal{A})$ in $C^\\infty(M)$ is given by\n  $$\n  \\mathrm{C}_1^1(\\mathcal{A})\
  \ = \\sum_i \\varepsilon_i \\left\\langle \\mathfrak{R}^{-1}\\circ \\mathrm{C}_1^1(\\\
  mathcal{A})(E_i), E_i\\right\\rangle,\n  $$\n  where $\\mathfrak{R}$ is given by\
  \ (19.5.2).\n\n**Remark.** According to Figure 19.5.1, $\\mathfrak{R}_s^{-1}\\circ\
  \ \\mathrm{C}_s^1(\\mathcal{A})$ is in $\\mathrm{Mult}_{C^\\infty(M)}(\\mathfrak{X}(M)^s,\\\
  mathfrak{X}(M))$, so the scalar product in part (a) makes sense.\n\n*Proof.* This\
  \ is the manifold version of Theorem 6.1.1.\n\nLet $(M,g)$ be a semi-Riemannian\
  \ manifold. Corresponding to the $(k,l)$-flat map $F_l^k$ and the $(k,l)$-sharp\
  \ map $S_l^k$ introduced in Section 19.4, we now define manifold versions of the\
  \ metric contraction maps described in Section 6.5.\n\nFor integers $r \\ge 2$,\
  \ $s \\ge 0$, and $1 \\le k < l \\le r$, and motivated by (6.5.1), the $(k,l)$-contravariant\
  \ metric contraction is the map\n\n$$\nC^{kl} : \\mathcal{T}_s^r(M) \\longrightarrow\
  \ \\mathcal{T}_s^{r-2}(M)\n$$\n\ndefined by\n\n$$\nC^{kl} = \\mathrm{C}_1^k \\circ\
  \ F_1^l. \\tag{19.6.1}\n$$\n\nCorresponding to (6.5.2), we have\n\n$$\nC^{k,k+1}\
  \ = \\mathrm{C}_1^k \\circ F_1^k.\n$$\n\nFor integers $r \\ge 0$, $s \\ge 2$, and\
  \ $1 \\le k < l \\le s$, and motivated by (6.5.3), the $(k,l)$-covariant metric\
  \ contraction is the map\n\n$$\nC_{kl} : \\mathcal{T}_s^r(M) \\longrightarrow \\\
  mathcal{T}_{s-2}^r(M)\n$$\n\ndefined by\n\n$$\nC_{kl} = \\mathrm{C}_k^1 \\circ S_l^1.\
  \ \\tag{19.6.2}\n$$\n\n**Theorem 19.6.2 (Orthonormal Frame Expression for Metric\
  \ Contraction).** Let $(M,\\mathfrak{g})$ be a semi-Riemannian manifold with signature\
  \ $(\\varepsilon_1,\\dots,\\varepsilon_m)$, let $(E_1,\\dots,E_m)$ be an orthonormal\
  \ frame on an open set $U$ in $M$, and let $\\mathcal{A}$ be a tensor field in $\\\
  mathcal{T}^0_s(M)$. Then:\n\n- **(a)** For integers $s \\ge 3$ and $1 \\le k < l\
  \ \\le s$, the tensor field $\\mathrm{C}_{kl}(\\mathcal{A})$ in $\\mathcal{T}^0_{s-2}(M)$\
  \ is given on $U$ by\n  $$\n  \\mathrm{C}_{kl}(\\mathcal{A})(X_1,\\dots,X_{s-2})\n\
  \  = \\sum_i \\varepsilon_i \\mathcal{A}(X_1,\\dots,X_{k-1},E_i,X_k,\\dots,X_{l-2},E_i,X_{l-1},\\\
  dots,X_{s-2})\n  $$\n  for all vector fields $X_1,\\dots,X_{s-2}$ in $\\mathfrak{X}(M)$.\n\
  \n- **(b)** For $s = 2$, the function $\\mathrm{C}_{12}(\\mathcal{A})$ in $C^\\\
  infty(M)$ is given by\n  $$\n  \\mathrm{C}_{12}(\\mathcal{A}) = \\sum_i \\varepsilon_i\
  \ \\mathcal{A}(E_i,E_i).\n  $$\n\n**Remark.** Observe that in part (a), the $E_i$\
  \ appear in the $k$th and $l$th positions.\n\n*Proof.* This is the manifold version\
  \ of Theorem 6.5.1.\n\n**Theorem 19.6.3.** If $(M,\\mathfrak{g})$ is a semi-Riemannian\
  \ manifold, then covariant derivatives and total covariant derivatives commute with\
  \ flat maps, sharp maps, ordinary contractions, and metric contractions.\n\n*Proof.*\
  \ We illustrate the proof with a few representative cases. Let $X$ be a vector field\
  \ in $\\mathfrak{X}(M)$, and let $\\mathcal{A}$ be a tensor field in $\\mathcal{T}^r_s(M)$.\
  \ Since $\\nabla_X$ is a tensor derivation, property [D2] in Section 16.2 gives\n\
  \n$$\n\\nabla_X \\circ \\mathrm{C}^k_l = \\mathrm{C}^k_l \\circ \\nabla_X. \\tag{19.6.4}\n\
  $$\n\nWe have\n\n$$\n\\begin{aligned}\n\\nabla_X \\circ \\mathrm{F}^k_1(\\mathcal{A})\n\
  &= \\nabla_X\\left(\\mathrm{C}^k_1(\\mathfrak{g}\\otimes\\mathcal{A})\\right) &&\
  \ \\text{[mv Th 6.2.6]}\\\\\n&= \\mathrm{C}^k_1\\left(\\nabla_X(\\mathfrak{g}\\\
  otimes\\mathcal{A})\\right) && \\text{[(19.6.4)]}\\\\\n&= \\mathrm{C}^k_1\\left(\\\
  mathfrak{g}\\otimes\\nabla_X(\\mathcal{A})\\right) && \\text{[Th 19.3.8]}\\\\\n\
  &= \\mathrm{F}^k_1\\left(\\nabla_X(\\mathcal{A})\\right) && \\text{[mv Th 6.2.6]}\\\
  \\\n&= \\mathrm{F}^k_1 \\circ \\nabla_X(\\mathcal{A}),\n\\end{aligned}\n$$\n\n##\
  \ 19.7 Isometries\n\nLinear isometries on scalar product spaces were introduced\
  \ in Section 4.4. We now describe their counterpart for semi-Riemannian manifolds.\n\
  \nLet $(M,\\mathfrak{g})$ and $(\\widetilde{M},\\widetilde{\\mathfrak{g}})$ be semi-Riemannian\
  \ manifolds with the same dimension, and let $F,G : M \\longrightarrow \\widetilde{M}$\
  \ be smooth maps. We say that $F$ is an **isometry**, and that $M$ and $\\widetilde{M}$\
  \ are **isometric**, if $F$ is a diffeomorphism and $F^*(\\widetilde{\\mathfrak{g}})=\\\
  mathfrak{g}$, where, by definition, the latter condition is equivalent to $F^*(\\\
  widetilde{\\mathfrak{g}})_p = \\mathfrak{g}_p$ for all $p$ in $M$. We say that $G$\
  \ is a **local isometry**, and that $M$ is **locally isometric** to $\\widetilde{M}$,\
  \ if for every point $p$ in $M$, there is a neighborhood $U$ of $p$ in $M$ and a\
  \ neighborhood $\\widetilde{U}$ of $G(p)$ in $\\widetilde{M}$ such that $G|_U :\
  \ U \\longrightarrow \\widetilde{U}$ is an isometry. We have from Theorem 19.1.2\
  \ that $(U,\\mathfrak{g}|_U)$ and $(\\widetilde{U},\\widetilde{\\mathfrak{g}}|_{\\\
  widetilde{U}})$ are semi-Riemannian manifolds with the same dimension and index,\
  \ so the preceding definition makes sense. Since every diffeomorphism is a local\
  \ diffeomorphism, it follows that every isometry is a local isometry.\n\n**Theorem\
  \ 19.7.1.** Let $(M,\\mathfrak{g})$ and $(\\widetilde{M},\\widetilde{\\mathfrak{g}})$\
  \ be semi-Riemannian manifolds with the same dimension, and let $F : M \\longrightarrow\
  \ \\widetilde{M}$ be a smooth map. Then the following are equivalent:\n\n- **(a)**\
  \ $F$ is a local isometry.\n- **(b)** $F^*(\\widetilde{\\mathfrak{g}})=\\mathfrak{g}$.\n\
  - **(c)** The differential map $d_p(F) : T_p(M) \\longrightarrow T_{F(p)}(\\widetilde{M})$\
  \ is a linear isometry for all $p$ in $M$.\n\n*Proof.* (b) $\\Leftrightarrow$ (c):\
  \ For a point $p$ in $M$,\n\n$$\n\\begin{aligned}\nF^*(\\widetilde{\\mathfrak{g}})_p\
  \ = \\mathfrak{g}_p\n&\\Leftrightarrow\\quad F^*(\\widetilde{\\mathfrak{g}})_p(v,w)\
  \ = \\mathfrak{g}_p(v,w) \\text{ for all } v,w \\text{ in } T_p(M)\\\\\n&\\Leftrightarrow\\\
  quad \\widetilde{\\mathfrak{g}}_{F(p)}(d_p(F)(v), d_p(F)(w)) = \\mathfrak{g}_p(v,w)\
  \ \\text{ for all } v,w \\text{ in } T_p(M)\\\\\n&\\Leftrightarrow\\quad d_p(F)\
  \ \\text{ is a linear isometry,}\n\\end{aligned}\n$$\n\nwhere the second equivalence\
  \ follows from (15.12.2). Since $p$ was arbitrary, the result follows.\n\n(a) $\\\
  Rightarrow$ (b): Straightforward.\n\n(b) $\\Rightarrow$ (a): We have\n\n$$\n\\begin{aligned}\n\
  F^*(\\widetilde{\\mathfrak{g}})=\\mathfrak{g}\n&\\Rightarrow\\quad d_p(F) \\text{\
  \ is a linear isometry for all } p \\text{ in } M \\qquad [(b)\\Rightarrow(c)]\\\
  \\\n&\\Rightarrow\\quad d_p(F) \\text{ is a linear isomorphism for all } p \\text{\
  \ in } M \\qquad [\\text{Th 4.4.1(a)}]\\\\\n&\\Rightarrow\\quad d_p(F) \\text{ is\
  \ injective for all } p \\text{ in } M \\qquad [\\text{Th 1.1.14}] \\quad (19.7.1)\\\
  \\\n&\\Rightarrow\\quad F \\text{ is an immersion} \\qquad [\\text{by definition}]\\\
  \\\n&\\Rightarrow\\quad F \\text{ is a local diffeomorphism,} \\qquad [\\text{Th\
  \ 14.6.2}]\n\\end{aligned}\n$$\n\nfrom which the result follows.\n\n**Theorem 19.7.2.**\
  \ Let $(M,\\mathfrak{g})$ and $(\\widetilde{M},\\widetilde{\\mathfrak{g}})$ be semi-Riemannian\
  \ manifolds with the same dimension, and let $F : M \\longrightarrow \\widetilde{M}$\
  \ be a smooth map. Then $F$ is an isometry if and only if it is a bijective local\
  \ isometry.\n\n*Proof.* ($\\Rightarrow$): By definition, a diffeomorphism (hence\
  \ an isometry) is bijective. As remarked above, an isometry is a local isometry.\n\
  \n($\\Leftarrow$): Since $F$ is a local isometry, by Theorem 19.7.1, $F^*(\\widetilde{\\\
  mathfrak{g}}) = \\mathfrak{g}$. It follows from (19.7.1) that $F$ is a local diffeomorphism.\
  \ Since a bijective local diffeomorphism is a diffeomorphism, $F$ is a diffeomorphism.\n\
  \nLet $(M,\\mathfrak{g})$ be a semi-Riemannian $m$-manifold of index $\\nu$, let\
  \ $p$ be a point in $M$, and let $(\\widetilde{e}_1,\\dots,\\widetilde{e}_m)$ be\
  \ an orthonormal basis for $T_p(M)$. Replacing $\\mathbb{R}^m$ with $\\mathbb{R}_\\\
  nu^m$ in (18.10.1), we obtain the linear isomorphism\n\n$$\n\\ell_p : \\mathbb{R}_\\\
  nu^m \\longrightarrow T_p(M)\n$$\n\ndefined by\n\n$$\n\\ell_p(r^1,\\dots,r^m) =\
  \ \\sum_i r^i \\widetilde{e}_i. \\tag{19.7.2}\n$$\n\nUsing Theorem 14.1.6 and Theorem\
  \ 14.2.5, let us now view $\\mathbb{R}_\\nu^m$ and $(T_p(M),\\mathfrak{g}_p)$ as\
  \ semi-Riemannian $m$-manifolds of index $\\nu$, and $\\ell_p$ as a diffeomorphism.\n\
  \n**Theorem 19.7.3.** With the above setup, $\\ell_p$ is an isometry (between semi-Riemannian\
  \ $m$-manifolds of index $\\nu$).\n\n*Proof.* Let $q$ be a point in $\\mathbb{R}_\\\
  nu^m$, and make the identifications $T_q(\\mathbb{R}_\\nu^m)=\\mathbb{R}_\\nu^m$\
  \ and $T_q(T_p(M))=T_p(M)$. Since $\\ell_p$ is linear, we have from Theorem 14.4.4\
  \ that $d_q(\\ell_p)=\\ell_p$. Let $(e_1,\\dots,e_m)$ be the standard basis for\
  \ $\\mathbb{R}_\\nu^m$. Because $\\mathbb{R}_\\nu^m$ and $T_p(M)$ have the same\
  \ index, hence the same signature,\n\n$$\n\\begin{aligned}\n\\|d_q(\\ell_p)(r^1,\\\
  dots,r^m)\\| &= \\|\\ell_p(r^1,\\dots,r^m)\\| = \\sqrt{\\left|\\left\\langle\\sum_i\
  \ r^i\\widetilde{e}_i,\\sum_j r^j\\widetilde{e}_j\\right\\rangle\\right|}\\\\\n\
  &= \\sqrt{\\left|\\sum_i \\langle\\widetilde{e}_i,\\widetilde{e}_i\\rangle (r^i)^2\\\
  right|} = \\sqrt{\\left|\\sum_i \\langle e_i,e_i\\rangle (r^i)^2\\right|}\\\\\n\
  &= \\sqrt{\\left|\\left\\langle\\sum_i r^i e_i,\\sum_j r^j e_j\\right\\rangle\\\
  right|} = \\|(r^1,\\dots,r^m)\\|,\n\\end{aligned}\n$$\n\nso $d_q(\\ell_p)$ is a\
  \ linear isometry for all $q$ in $\\mathbb{R}_\\nu^m$. By Theorem 19.7.1, $\\ell_p$\
  \ is a local isometry. Since $\\ell_p$ is a diffeomorphism, and therefore bijective,\
  \ it follows from Theorem 19.7.2 that $\\ell_p$ is an isometry.\n\n**Theorem 19.7.4.**\
  \ Let $(M,\\mathfrak{g})$ be a semi-Riemannian manifold, let $p$ be a point in $M$,\
  \ and let $\\psi : (-\\varepsilon,\\varepsilon) \\longrightarrow T_p(M)$ be a smooth\
  \ curve. Consider the parametrized surface $\\sigma : [0,1] \\times (-\\varepsilon,\\\
  varepsilon) \\longrightarrow M$ given by\n\n$$\n\\sigma(r,s) = \\exp_p\\bigl(r\\\
  psi(s)\\bigr),\n$$\n\n\n\n## 19.7 等距映射\n\n其中假设 $r\\psi(s)$ 在 $\\mathcal{E}_p$ 中对所有\
  \ $(r,s)$ 在 $[0,1]\\times(-\\varepsilon,\\varepsilon)$ 成立。则，对所有 $(r,s)$ 在 $[0,1]\\\
  times(-\\varepsilon,\\varepsilon)$：\n\n-   (a)\n\n$$\\left\\langle \\frac{\\partial\\\
  sigma}{\\partial r}(r,s),\\frac{\\partial\\sigma}{\\partial r}(r,s)\\right\\rangle=\\\
  langle\\psi(s),\\psi(s)\\rangle.$$\n\n-   (b)\n\n$$\\left\\langle\\frac{\\partial\\\
  sigma}{\\partial r}(r,s),\\frac{\\partial\\sigma}{\\partial s}(r,s)\\right\\rangle=r\\\
  left\\langle\\frac{d\\psi}{ds}(s),\\psi(s)\\right\\rangle.$$\n\n**证明。** (a): 回顾第\
  \ 14.9 节，对于 $(-\\varepsilon,\\varepsilon)$ 中的给定点 $s$，经度曲线 $\\sigma_s(r):[0,1]\\\
  longrightarrow M$ 定义为 $\\sigma_s(r)=\\sigma(r,s)$。根据定理 18.11.4(a)，$\\sigma_s$ 是以\
  \ $\\psi(s)$ 为初速度的测地线；即，$(d\\sigma_s/dr)(0)=\\psi(s)$。由定理 19.9.1(a) 可知，函数 $\\langle\
  \ d\\sigma_s/dr,d\\sigma_s/dr\\rangle:[0,1]\\longrightarrow M$ 为常数，故\n\n$$\\left\\\
  langle\\frac{\\partial\\sigma}{\\partial r}(r,s),\\frac{\\partial\\sigma}{\\partial\
  \ r}(r,s)\\right\\rangle=\\left\\langle\\frac{d\\sigma_s}{dr}(r),\\frac{d\\sigma_s}{dr}(r)\\\
  right\\rangle=\\left\\langle\\frac{d\\sigma_s}{dr}(0),\\frac{d\\sigma_s}{dr}(0)\\\
  right\\rangle=\\langle\\psi(s),\\psi(s)\\rangle.$$\n\n(b): 根据定理 19.3.1，\n\n$$\\\
  frac{\\partial}{\\partial r}\\left(\\left\\langle\\frac{\\partial\\sigma}{\\partial\
  \ r},\\frac{\\partial\\sigma}{\\partial s}\\right\\rangle\\right)=\\left\\langle\\\
  nabla_{\\frac{\\partial}{\\partial r}}\\left(\\frac{\\partial\\sigma}{\\partial\
  \ r}\\right),\\frac{\\partial\\sigma}{\\partial s}\\right\\rangle+\\left\\langle\\\
  frac{\\partial\\sigma}{\\partial r},\\nabla_{\\frac{\\partial}{\\partial r}}\\left(\\\
  frac{\\partial\\sigma}{\\partial s}\\right)\\right\\rangle.$$\n\n由于 $\\sigma_s$\
  \ 是测地线，\n\n$$\\nabla_{\\frac{\\partial}{\\partial r}}\\left(\\frac{\\partial\\sigma}{\\\
  partial r}\\right)=0,$$\n\n并且根据定理 18.6.4，\n\n$$\\left\\langle\\frac{\\partial\\\
  sigma}{\\partial r},\\nabla_{\\frac{\\partial}{\\partial r}}\\left(\\frac{\\partial\\\
  sigma}{\\partial s}\\right)\\right\\rangle=\\left\\langle\\frac{\\partial\\sigma}{\\\
  partial r},\\nabla_{\\frac{\\partial}{\\partial s}}\\left(\\frac{\\partial\\sigma}{\\\
  partial r}\\right)\\right\\rangle.$$\n\n将上述三个恒等式合并得到\n\n$$\\frac{\\partial}{\\partial\
  \ r}\\left(\\left\\langle\\frac{\\partial\\sigma}{\\partial r},\\frac{\\partial\\\
  sigma}{\\partial s}\\right\\rangle\\right)=\\left\\langle\\frac{\\partial\\sigma}{\\\
  partial r},\\nabla_{\\frac{\\partial}{\\partial s}}\\left(\\frac{\\partial\\sigma}{\\\
  partial r}\\right)\\right\\rangle.$$\n\n我们有\n\n$$2\\left\\langle\\frac{\\partial\\\
  sigma}{\\partial r},\\nabla_{\\frac{\\partial}{\\partial s}}\\left(\\frac{\\partial\\\
  sigma}{\\partial r}\\right)\\right\\rangle=\\frac{\\partial}{\\partial s}\\left(\\\
  left\\langle\\frac{\\partial\\sigma}{\\partial r},\\frac{\\partial\\sigma}{\\partial\
  \ r}\\right\\rangle\\right)\\qquad[\\text{Th 19.3.1}]$$\n\n$$=\\frac{d}{ds}(\\langle\\\
  psi,\\psi\\rangle)\\qquad[\\text{part (a)}]$$\n\n$$=2\\left\\langle\\frac{d\\psi}{ds},\\\
  psi\\right\\rangle.\\qquad[\\text{Th 19.3.1}]$$\n\n于是前两个恒等式给出\n\n$$\\frac{\\partial}{\\\
  partial r}\\left\\langle\\frac{\\partial\\sigma}{\\partial r}(r,s),\\frac{\\partial\\\
  sigma}{\\partial s}(r,s)\\right\\rangle=\\left\\langle\\frac{d\\psi}{ds}(s),\\psi(s)\\\
  right\\rangle,$$\n\n其中我们注意到右端与 $r$ 无关。由一元实变量微分学，\n\n$$\\left\\langle\\frac{\\partial\\\
  sigma}{\\partial r}(r,s),\\frac{\\partial\\sigma}{\\partial s}(r,s)\\right\\rangle=c+r\\\
  left\\langle\\frac{d\\psi}{ds}(s),\\psi(s)\\right\\rangle \\tag{19.7.3}$$\n\n对于某个实数\
  \ $c$。由定理 18.9.4 和定理 18.11.4(c) 可知\n\n$$\\frac{\\partial\\sigma}{\\partial r}(0,s)=d_0(\\\
  exp_p)(\\psi(s))=\\psi(s),$$\n\n并且由定理 18.11.4(d) 可知\n\n$$\\frac{\\partial\\sigma}{\\\
  partial s}(0,s)=0.$$\n\n在 (19.7.3) 中令 $r=0$ 并利用前述两个恒等式得到 $c=0$。\n\n设 $(M,\\mathfrak\
  \ g)$ 为半黎曼流形，$p$ 为 $M$ 中的一点。设 $v$ 和 $w$ 为 $\\mathcal E_p$ 中的向量，并回顾由 (18.9.4) 给出的微分映射\n\
  \n$$d_v(\\exp_p):T_v(T_p(M))\\longrightarrow T_{\\exp_p(v)}(M).$$\n\n下一个结果表明 $d_v(\\\
  exp_p)$ 可以被视为沿径向测地线的“线性等距映射”。\n\n### **定理 19.7.5（高斯引理）。** *在上述设定下，*\n\n$$\\langle\
  \ v,w\\rangle=\\left\\langle d_v(\\exp_p)(v),d_v(\\exp_p)(w)\\right\\rangle.$$\n\
  \n*证明。* 设 $\\psi(s):(-\\varepsilon,\\varepsilon)\\longrightarrow T_p(M)$ 为光滑曲线，使得\
  \ $\\psi(0)=v$ 且 $(d\\psi/ds)(0)=w$，例如 $\\psi(s)=v+sw$。考虑参数化曲面 $\\sigma(r,s):[0,1]\\\
  times(-\\varepsilon,\\varepsilon)\\longrightarrow M$ 定义为 $\\sigma(r,s)=\\exp_p(r\\\
  psi(s))$，其中我们假设 $r\\psi(s)$ 在所有 $(r,s)$ 在 $[0,1]\\times(-\\varepsilon,\\varepsilon)$\
  \ 时属于 $\\mathcal E_p$。由定理 18.11.4 的 (c) 和 (d) 部分可知\n\n$$\\frac{\\partial\\sigma}{\\\
  partial r}(1,0)=d_v(\\exp_p)(v)\\quad\\text{and}\\quad\\frac{\\partial\\sigma}{\\\
  partial s}(1,0)=d_v(\\exp_p)(w),$$\n\n然后由定理 19.7.4(b) 可知\n\n$$\\left\\langle d_v(\\\
  exp_p)(v),d_v(\\exp_p)(w)\\right\\rangle=\\left\\langle\\frac{d\\psi}{ds}(0),\\\
  psi(0)\\right\\rangle=\\langle w,v\\rangle.$$\n\n## 19.8 黎曼曲率张量\n\n设 $(M,\\mathfrak{g})$\
  \ 为半黎曼流形。在此设定下，曲率张量（场）$R$，最初在具有联络的光滑流形背景下引入，被称为 **黎曼曲率张量（场）**。我们定义映射\n\n```\n\\\
  mathcal{R}: \\mathfrak{X}(M)^4 \\longrightarrow C^{\\infty}(M),\n```\n\n也称为黎曼曲率张量（场）由\n\
  \n```\n\\mathcal{R}(X, Y, Z, W) = \\langle R(X, Y) Z, W \\rangle\n```\n\n对所有向量场\
  \ $X, Y, Z, W$ 在 $\\mathfrak{X}(M)$ 中成立。\n\n### **定理 19.8.1（$\\mathcal{R}$ 的表示）。**\
  \ 若 $(M,\\mathfrak{g})$ 为半黎曼流形，则 $\\mathcal{R}$ 为 $\\mathrm{Mult}_{C^{\\infty}(M)}(\\\
  mathfrak{X}(M)^4, C^{\\infty}(M))$ 中的映射并且可以等同于 $\\mathcal{T}_4^0(M)$ 中的张量场。\n\n\
  *证明。* 由定理 18.7.1(b) 可知 $\\mathcal{R}$ 在其前三个自变量上为 $C^{\\infty}(M)$-线性，显然它在其第四个自变量上也为\
  \ $C^{\\infty}(M)$-线性。这证明了第一个断言。第二个断言由定理 15.7.2 得出。\n\n通过详细研究图 19.5.1、定理 19.5.5(b)\
  \ 和定理 19.8.1，我们发现 $\\mathcal{R}$ 可以与 $R$ 等同。通常认为 $\\mathcal{R}$ 是通过“降低一个指标”从 $R$\
  \ 得到。这解释了将 $\\mathcal{R}$ 和 $R$ 都称为黎曼曲率张量的做法。\n\n### **定理 19.8.2。** 若 $(M,\\mathfrak{g})$\
  \ 为具有联络的半黎曼 $m$-流形，则在局部坐标下，对 $i,j,k,l = 1,\\dots,m$：\n(a) $\\mathcal{R}$ 关于坐标标架的分量为\n\
  \n```\n\\mathcal{R}_{ijkl} = \\sum_{n} \\mathfrak{g}_{ln} R^{n}_{ijk}.\n```\n\n\
  (b)\n\n```\nR^{l}_{ijk} = \\sum_{n} \\mathfrak{g}^{ln} \\mathcal{R}_{ijkn}.\n```\n\
  \n*证明。* (a): 由 (18.7.2) 可知\n\n```\n\\mathcal{R}_{ijkl} = \\mathcal{R}\\left(\\frac{\\\
  partial}{\\partial x^{i}}, \\frac{\\partial}{\\partial x^{j}}, \\frac{\\partial}{\\\
  partial x^{k}}, \\frac{\\partial}{\\partial x^{l}}\\right) = \\left\\langle R\\\
  left(\\frac{\\partial}{\\partial x^{i}}, \\frac{\\partial}{\\partial x^{j}}\\right)\\\
  frac{\\partial}{\\partial x^{k}}, \\frac{\\partial}{\\partial x^{l}}\\right\\rangle\n\
  ```\n\n```\n= \\left\\langle \\sum_{n} R^{n}_{ijk} \\frac{\\partial}{\\partial x^{n}},\
  \ \\frac{\\partial}{\\partial x^{l}}\\right\\rangle = \\sum \\mathfrak{g}_{ln} R^{n}_{ijk}.\n\
  ```\n\n(b): 由 (a) 部分，\n\n```\n\\sum_{n} \\mathfrak{g}^{ln} \\mathcal{R}_{ijkn} =\
  \ \\sum_{n} \\mathfrak{g}^{ln} \\left(\\sum_{p} \\mathfrak{g}_{np} R^{p}_{ijk}\\\
  right) = \\sum_{p} \\left(\\sum_{n} \\mathfrak{g}^{ln} \\mathfrak{g}_{np}\\right)\
  \ R^{p}_{ijk}\n```\n\n```\n= \\sum_{p} \\delta^{l}_{p} R^{p}_{ijk} = R^{l}_{ijk}.\n\
  ```\n\n### 定理 19.8.3（第一 Bianchi 恒等式）。\n\n设 $(M,g,\\nabla)$ 为具有联络的半黎曼流形，设 $X,Y,Z,W$\
  \ 为 $\\mathfrak{X}(M)$ 中的向量场。则：\n\n-   (a)\n\n$$\\sum_{(X,Y,Z)} \\mathcal{R}(X,Y,Z,W)=\\\
  sum_{(X,Y,Z)}\\langle\\nabla_X(T(Y,Z)),W\\rangle+\\sum_{(X,Y,Z)}\\langle T(X,[Y,Z]),W\\\
  rangle,$$\n\n其中 $T$ 为挠率张量。\n\n-   (b) 若 $\\nabla$ 为对称的（尤其是若 $\\nabla$ 为 Levi-Civita\
  \ 联络），则\n\n$$\\sum_{(X,Y,Z)}\\mathcal{R}(X,Y,Z,W)=0.$$\n\n*证明。* 这由定理 18.7.3 得出。\n\
  \n### 定理 19.8.4（第二 Bianchi 恒等式）。\n\n设 $(M,g,\\nabla)$ 为具有联络的半黎曼流形，设 $X,Y,Z,V,W$\
  \ 为 $\\mathfrak{X}(M)$ 中的向量场。则：\n\n-   (a)\n\n$$\\sum_{(X,Y,Z)}\\nabla_X(\\mathcal{R})(Y,Z,V,W)=-\\\
  sum_{(X,Y,Z)}\\mathcal{R}(T(X,Y),Z,V,W),\\tag{19.8.1}$$\n\n其中 $T$ 为挠率张量。\n\n-  \
  \ (b) 若 $\\nabla$ 为对称的（尤其是若 $\\nabla$ 为 Levi-Civita 联络），则\n\n$$\\sum_{(X,Y,Z)}\\\
  nabla_X(\\mathcal{R})(Y,Z,V,W)=0.$$\n\n*证明。* (a): 我们反复使用 (18.7.3)。由定理 18.1.4，\n\n\
  $$\\nabla_X(\\mathcal{R})(Y,Z,V,W)=X(\\mathcal{R}(Y,Z,V,W))-\\mathcal{R}(\\nabla_X(Y),Z,V,W)$$\n\
  $$\\qquad-\\mathcal{R}(Y,\\nabla_X(Z),V,W)-\\mathcal{R}(Y,Z,\\nabla_X(V),W)$$\n\
  $$\\qquad-\\mathcal{R}(Y,Z,V,\\nabla_X(W)).$$\n\n\n\n\n\n于是 (19.8.1) 的左边可以表示为\n\n\
  ```\n$$\\begin{aligned}\n\\sum_{(X,Y,Z)} \\nabla_X(\\mathcal{R})(Y,Z,V,W)\n&= \\\
  sum_{(X,Y,Z)} X(\\mathcal{R}(Y,Z,V,W)) - \\sum_{(X,Y,Z)} \\mathcal{R}(\\nabla_X(Y),Z,V,W)\
  \ \\\\\n&\\quad - \\sum_{(X,Y,Z)} \\mathcal{R}(Y,\\nabla_X(Z),V,W) - \\sum_{(X,Y,Z)}\
  \ \\mathcal{R}(Y,Z,\\nabla_X(V),W) \\\\\n&\\quad - \\sum_{(X,Y,Z)} \\mathcal{R}(Y,Z,V,\\\
  nabla_X(W)) \\\\\n&= \\sum_{(X,Y,Z)} X(\\mathcal{R}(Y,Z,V,W)) - \\sum_{(X,Y,Z)}\
  \ \\mathcal{R}(\\nabla_X(Y),Z,V,W) \\\\\n&\\quad - \\sum_{(X,Y,Z)} \\mathcal{R}(X,\\\
  nabla_Z(Y),V,W) - \\sum_{(X,Y,Z)} \\mathcal{R}(X,Y,\\nabla_Z(V),W) \\\\\n&\\quad\
  \ - \\sum_{(X,Y,Z)} \\mathcal{R}(X,Y,V,\\nabla_Z(W)).\n\\end{aligned}$$\n```\n\n\
  我们由 (18.6.1) 和定理 18.7.1(a) 得到\n\n```\n$$\\begin{aligned}\n\\mathcal{R}(T(X,Y),Z)V\
  \ &= \\mathcal{R}(\\nabla_X(Y)-\\nabla_Y(X)-[X,Y],Z)V \\\\\n&= \\mathcal{R}(\\nabla_X(Y),Z)V\
  \ - \\mathcal{R}(\\nabla_Y(X),Z)V - \\mathcal{R}([X,Y],Z)V \\\\\n&= \\mathcal{R}(\\\
  nabla_X(Y),Z)V + \\mathcal{R}(Z,\\nabla_Y(X))V - \\mathcal{R}([X,Y],Z)V,\n\\end{aligned}$$\n\
  ```\n\n因此 (19.8.1) 右边之和可以表示为\n\n```\n$$\\begin{aligned}\n\\sum_{(X,Y,Z)} \\mathcal{R}(T(X,Y),Z,V,W)\n\
  &= \\sum_{(X,Y,Z)} \\mathcal{R}(\\nabla_X(Y),Z,V,W) + \\sum_{(X,Y,Z)} \\mathcal{R}(Z,\\\
  nabla_Y(X),V,W) \\\\\n&\\quad - \\sum_{(X,Y,Z)} \\mathcal{R}([X,Y],Z,V,W) \\\\\n\
  &= \\sum_{(X,Y,Z)} \\mathcal{R}(\\nabla_X(Y),Z,V,W) + \\sum_{(X,Y,Z)} \\mathcal{R}(X,\\\
  nabla_Z(Y),V,W) \\\\\n&\\quad - \\sum_{(X,Y,Z)} \\mathcal{R}([X,Y],Z,V,W).\n\\end{aligned}$$\n\
  ```\n\n我们需要证明 (19.8.2) 最后三行中的项之和与 (19.8.3) 最后两行中的项之和相差一个符号。两个和\n\n有两项是共同的但符号相反，所以我们需要证明\n\
  \n∑_{(X,Y,Z)} ℛ([X,Y], Z, V, W) = ∑_{(X,Y,Z)} X(ℛ(Y,Z,V,W)) − ∑_{(X,Y,Z)} ℛ(X,Y,∇_Z(V),W)\
  \ − ∑_{(X,Y,Z)} ℛ(X,Y,V,∇_Z(W)). (19.8.4)\n\n利用 (19.3.1) 得\n\nX(ℛ(Y,Z,V,W)) = X(⟨R(Y,Z)V,W⟩)\
  \ = ⟨∇_X(R(Y,Z)V),W⟩ + ⟨R(Y,Z)V,∇_X(W)⟩ = ⟨∇_X(R(Y,Z)V),W⟩ + ℛ(Y,Z,V,∇_X(W)),\n\n\
  故\n\n∑_{(X,Y,Z)} X(ℛ(Y,Z,V,W)) = ∑_{(X,Y,Z)} ⟨∇_X(R(Y,Z)V),W⟩ + ∑_{(X,Y,Z)} ℛ(Y,Z,V,∇_X(W))\
  \ = ∑_{(X,Y,Z)} ⟨∇_X(R(Y,Z)V),W⟩ + ∑_{(X,Y,Z)} ℛ(X,Y,V,∇_Z(W)). (19.8.5)\n\n由定理\
  \ 18.7.4，\n\n∑_{(X,Y,Z)} ⟨∇_X(R(Y,Z)V),W⟩ = ∑_{(X,Y,Z)} ℛ(X,Y,∇_Z(V),W) + ∑_{(X,Y,Z)}\
  \ ℛ([X,Y],Z,V,W). (19.8.6)\n\n把 (19.8.6) 代入 (19.8.5) 得\n\n∑_{(X,Y,Z)} X(ℛ(Y,Z,V,W))\
  \ = ∑_{(X,Y,Z)} ℛ(X,Y,∇_Z(V),W) + ∑_{(X,Y,Z)} ℛ([X,Y],Z,V,W) + ∑_{(X,Y,Z)} ℛ(X,Y,V,∇_Z(W)),\n\
  \n这等价于 (19.8.4)。\n\n(b): 这由 (a) 推出。\n\n## ### 定理 19.8.5 (黎曼曲率张量的对称性)。\n\n若 $(M,g)$\
  \ 是半黎曼流形且 $X,Y,Z,W$ 是 $\\mathfrak{X}(M)$ 中的向量场，则 $\\mathcal{R}$ 满足以下对称性：\n\n- [S1]\
  \ $\\mathcal{R}(X,Y,Z,W)=-\\mathcal{R}(Y,X,Z,W)$。\n- [S2] $\\mathcal{R}(X,Y,Z,W)=-\\\
  mathcal{R}(X,Y,W,Z)$。\n- [S3] $\\mathcal{R}(X,Y,Z,W)=\\mathcal{R}(Z,W,X,Y)$。\n-\
  \ [S4] $\\mathcal{R}(X,Y,Z,W)+\\mathcal{R}(Y,Z,X,W)+\\mathcal{R}(Z,X,Y,W)=0$。\n\n\
  **证明.** [S1]: 这由定理 18.7.1(a) 推出。\n\n[S2]: 由于\n\n$$\\mathcal{R}(X,Y,Z+W,Z+W)$$\n\
  $$=\\mathcal{R}(X,Y,Z,Z)+\\mathcal{R}(X,Y,Z,W)+\\mathcal{R}(X,Y,W,Z)+\\mathcal{R}(X,Y,W,W),$$\n\
  \n只需证明 $\\mathcal{R}(X,Y,Z,Z)=0$ 对所有向量场 $X,Y,Z$ 在 $\\mathfrak{X}(M)$ 中成立。利用 (19.3.1)\
  \ 得\n\n$$\\langle\\nabla_X(\\nabla_Y(Z)),Z\\rangle=X(\\langle\\nabla_Y(Z),Z\\rangle)-\\\
  langle\\nabla_Y(Z),\\nabla_X(Z)\\rangle$$\n\n$$\\langle\\nabla_Y(\\nabla_X(Z)),Z\\\
  rangle=Y(\\langle\\nabla_X(Z),Z\\rangle)-\\langle\\nabla_X(Z),\\nabla_Y(Z)\\rangle$$\n\
  \n$$\\langle\\nabla_Y(Z),Z\\rangle=\\frac{1}{2}Y(\\langle Z,Z\\rangle)$$\n\n$$\\\
  langle\\nabla_X(Z),Z\\rangle=\\frac{1}{2}X(\\langle Z,Z\\rangle)$$\n\n$$\\langle\\\
  nabla_{[X,Y]}(Z),Z\\rangle=\\frac{1}{2}[X,Y](\\langle Z,Z\\rangle),$$\n\n故\n\n$$\\\
  mathcal{R}(X,Y,Z,Z)=\\langle\\mathcal{R}(X,Y)Z,Z\\rangle$$\n$$=\\langle\\nabla_X(\\\
  nabla_Y(Z))-\\nabla_Y(\\nabla_X(Z))-\\nabla_{[X,Y]}(Z),Z\\rangle$$\n$$=\\langle\\\
  nabla_X(\\nabla_Y(Z)),Z\\rangle-\\langle\\nabla_Y(\\nabla_X(Z)),Z\\rangle-\\langle\\\
  nabla_{[X,Y]}(Z),Z\\rangle$$\n$$=X(\\langle\\nabla_Y(Z),Z\\rangle)-Y(\\langle\\\
  nabla_X(Z),Z\\rangle)-\\langle\\nabla_{[X,Y]}(Z),Z\\rangle$$\n$$=\\frac{1}{2}\\\
  {X(Y(\\langle Z,Z\\rangle))-Y(X(\\langle Z,Z\\rangle))-[X,Y](\\langle Z,Z\\rangle)\\\
  }=0.$$\n\n[S4]: 这由定理 19.8.3(b) 推出。\n\n[S3]: 这由 [S1]、[S2]、[S4] 和定理 6.6.1 推出。\n\n\
  ## ### 例 19.8.6。\n\n定理 19.8.5 中的对称性极大地简化了涉及 $\\mathcal{R}$ 的计算，尤其当某些向量场相等时。例如，在\
  \ [S1] 中令 $X=Y$ 得 $\\mathcal{R}(X,X,Z,W)=0$。对于半黎曼二维流形，我们有以下表格：\n\n| (i, j, k, l)\
  \ | $\\mathcal{R}_{ijkl}$ |\n| (i, j, k, l) | $\\mathcal{R}_{ijkl}$ |\n\n因此，16 个\
  \ $\\mathcal{R}_{ijkl}$ 值中有 12 个恒为 0，其余四个值等于 $\\pm\\mathcal{R}_{1221}$。\n\n# 定理\
  \ 19.8.7. 若 $R$ 和 $\\mathcal{R}$ 是 $\\mathbb{R}^m_\\nu$ 上的黎曼曲率张量，则 $R$ 的常数 (向量)\
  \ 值为 0，且 $\\mathcal{R}$ 的常数 (实数) 值为 0。\n\n证明. 我们由定理 19.3.5 知在标准坐标下 $\\mathbb{R}^m_\\\
  nu$ 中的 Christoffel 符号恒为 0，然后由定理 18.7.2 知 $R$ 恒为 0。$\\mathcal{R}$ 的相应结果由定理 19.8.2(a)\
  \ 推出。\n\n# 定理 19.8.8. 设 $(M,\\mathfrak{g})$ 和 $(\\widetilde{M},\\widetilde{\\mathfrak{g}})$\
  \ 是同维数的半黎曼流形，并设 $\\mathcal{R}$ 和 $\\widetilde{\\mathcal{R}}$ 为相应的黎曼曲率张量。若 $F : M\
  \ \\longrightarrow \\widetilde{M}$ 是等距映射，则 $F^*(\\widetilde{\\mathcal{R}})=\\mathcal{R}$。\n\
  \n证明. 设 $p$ 是 $M$ 中的点，设 $(U,(x^i))$ 是 $p$ 处的坐标图。由于 $F$ 是微分同胚，$(\\widetilde{U},(\\\
  widetilde{x}^i))=(F(U),(x^i\\circ F^{-1}))$ 是 $F(p)$ 处的坐标图。由定理 14.4.6(a)，\n\n$d_p(F)\\\
  left(\\left.\\frac{\\partial}{\\partial x^i}\\right|_p\\right)=\\left.\\frac{\\\
  partial}{\\partial \\widetilde{x}^i}\\right|_{F(p)}$ ,\n\n故\n\n$\\widetilde{\\mathfrak{g}}_{ij}(F(p))=\\\
  widetilde{\\mathfrak{g}}_{F(p)}\\left(\\left.\\frac{\\partial}{\\partial \\widetilde{x}^i}\\\
  right|_{F(p)},\\left.\\frac{\\partial}{\\partial \\widetilde{x}^j}\\right|_{F(p)}\\\
  right)$ [(19.1.1)]\n$=\\widetilde{\\mathfrak{g}}_{F(p)}\\left(d_p(F)\\left(\\left.\\\
  frac{\\partial}{\\partial x^i}\\right|_p\\right),d_p(F)\\left(\\left.\\frac{\\partial}{\\\
  partial x^j}\\right|_p\\right)\\right)$\n$=F^*(\\widetilde{\\mathfrak{g}})_p\\left(\\\
  left.\\frac{\\partial}{\\partial x^i}\\right|_p,\\left.\\frac{\\partial}{\\partial\
  \ x^j}\\right|_p\\right)$ [(15.12.2)]\n$=\\mathfrak{g}_p\\left(\\left.\\frac{\\\
  partial}{\\partial x^i}\\right|_p,\\left.\\frac{\\partial}{\\partial x^j}\\right|_p\\\
  right)$ [$F^*(\\widetilde{\\mathfrak{g}})=\\mathfrak{g}$]\n$=\\mathfrak{g}_{ij}(p)$\
  \ [(19.1.1)]\n\n对 $i,j=1,\\ldots,m$。我们然后由定理 18.7.2、定理 19.3.4 和定理 19.8.2(a) 得 $\\\
  widetilde{\\mathcal R}_{ijkl}(F(p))=\\mathcal R_{ijkl}(p)$ 对 $i,j,k,l=1,\\ldots,m$。由于\
  \ $p$ 是任意的，结果得证。\n\n设 $(M,g)$ 是指标为 $\\nu$ 的半黎曼 $m$ 流形。我们称 $M$ 为平坦的，如果对 $M$ 中每一点\
  \ $p$，存在等距映射 $F_p:(V,g|_V)\\to(U,\\tilde g|_U)$，其中 $V$ 是 $M$ 中 $p$ 的邻域，且 $U$ 是 $\\\
  mathbb R^m_\\nu=(\\mathbb R^m,\\tilde g)$ 中的开集。根据定理 19.1.2，半黎曼流形中的开集本身就是半黎曼流形，因此该定义是有意义的。前述条件与要求\
  \ $M$ 局部等距于 $\\mathbb R^m_\\nu$ 不同，因为没有保证 $F_p$ 能组合成从 $M$ 到 $\\mathbb R^m_\\nu$\
  \ 的光滑映射。\n\n黎曼曲率张量（以其任一形式）是一个复杂的数学对象。下一个结果表明，至少在一种情况下，它对“曲率”有明确的几何意义。\n\n# **定理\
  \ 19.8.9 (黎曼定理)。**\n\n设 $(M,g)$ 是半黎曼流形，并设 $\\mathcal R$ 为黎曼曲率张量。则 $\\mathcal R$\
  \ 恒为 0 当且仅当 $M$ 是平坦的。\n\n*证明.* 设 $M$ 的维数为 $m$ 且指标为 $\\nu$。\n\n$(\\Rightarrow)$:\
  \ 设 $p$ 是 $M$ 中的点，设 $V$ 是 $M$ 中 $p$ 的正规邻域，并设 $\\exp_p|_{\\widetilde V}:\\widetilde\
  \ V\\longrightarrow V$ 为相应的微分同胚。由于 $(T_p(M),g_p)$ 和 $(M,g)$ 是指标为 $\\nu$ 的半黎曼 $m$\
  \ 流形，由定理 19.1.2，$\\widetilde V$ 和 $V$ 也是。我们断言 $\\exp_p|_{\\widetilde V}$ 是等距映射。\n\
  \n设 $v,w_1,w_2$ 是 $\\widetilde V\\subseteq\\mathcal E_p$ 中的向量，并设 $\\rho_{p,v}(r)=\\\
  exp_p|_{\\widetilde V}(rv):[0,1]\\longrightarrow M$ 为起点为 $p$、初速为 $v$ 的径向测地线。由定理\
  \ 18.5.1，存在 $\\mathcal J_i$ 在 $\\mathcal X_M(\\rho_{p,v})$ 中平行向量场使得 $\\mathcal J_i(0)=w_i$\
  \ 对 $i=1,2$。设我们定义向量场 $\\widetilde{\\mathcal J}_i$ 在 $\\mathcal X_M(\\rho_{p,v})$\
  \ 中为 $\\widetilde{\\mathcal J}_i(r)=r\\mathcal J_i(r)$。由于 $\\nabla\\mathcal J_i/dr$\
  \ 恒为 0，我们有\n\n$$\\frac{\\nabla\\widetilde{\\mathcal J}_i}{dr}(r)=\\mathcal J_i(r)+r\\\
  frac{\\nabla\\mathcal J_i}{dr}(r)=\\mathcal J_i(r),$$\n\n故\n\n$$\\frac{\\nabla^2\\\
  widetilde{\\mathcal J}_i}{dr^2}(r)=\\frac{\\nabla\\mathcal J_i}{dr}(r)=0$$\n\n对所有\
  \ $r$ 在 $[0,1]$ 中。由定理 19.8.2，黎曼曲率张量 $\\mathcal R$ 恒为 0 (实数) 当且仅当黎曼曲率张量 $R$ 恒为 0\
  \ (向量)。于是 $\\widetilde{\\mathcal J}_i$ 满足 Jacobi 方程 (18.11.1) 且因此是 Jacobi 场。注意 $\\\
  widetilde{\\mathcal J}_i(0)=0$ 且 $(\\nabla\\widetilde{\\mathcal J}_i/dr)(0)=w_i$。由定理\
  \ 18.11.1，$\\widetilde{\\mathcal J}_i$ 是 $\\mathcal X_M(\\rho_{p,v})$ 中满足前述两个恒等式的唯一\
  \ Jacobi 场。\n\n回顾定理 18.11.4(b)，并设 $\\sigma_i(r,s):[0,1]\\times(-\\varepsilon,\\\
  varepsilon)\\longrightarrow M$ 为 $\\rho_{p,v}(r)$ 的测地线变分，定义为\n\n$$\\sigma_i(r,s)=\\\
  exp_p|_{\\widetilde V}(r(v+sw_i)).$$\n\n\n其中假设对所有 $(r,s)\\in[0,1]\\times(-\\varepsilon,\\\
  varepsilon)$，$r(v+sw_i)$ 属于 $\\mathcal{E}_p$。由定理18.11.5可知，$\\widetilde{J}_i$ 是 $\\\
  sigma_i$ 的变分场，并且对所有 $r\\in[0,1]$，$\\widetilde{J}_i(r)=r\\,d r_v(\\exp_p|_{\\widetilde\
  \ V})(w_i)$。因此，\n\n$$J_i(1)=\\widetilde{J}_i(1)=d_v(\\exp_p|_{\\widetilde V})(w_i)$$\n\
  \n对 $i=1,2$ 成立。由定理19.3.1，函数 $\\langle J_1,J_2\\rangle$ 与 $r$ 无关，所以\n\n$$\\langle\
  \ w_1,w_2\\rangle=\\langle J_1(0),J_2(0)\\rangle=\\langle J_1(1),J_2(1)\\rangle$$\n\
  \n$$=\\langle d_v(\\exp_p|_{\\widetilde V})(w_1),d_v(\\exp_p|_{\\widetilde V})(w_2)\\\
  rangle.$$\n\n由于 $v,w_1,w_2$ 是任意的，$d_v(\\exp_p|_{\\widetilde V}):T_v(\\widetilde\
  \ V)\\longrightarrow T_{\\exp_p|_{\\widetilde V}(v)}(V)$ 对所有 $v\\in\\widetilde V$\
  \ 都是线性等距。由定理19.7.1，$\\exp_p|_{\\widetilde V}$ 是局部等距。因为 $\\exp_p|_{\\widetilde V}$\
  \ 是微分同胚，因此是双射，所以由定理19.7.2可得 $\\exp_p|_{\\widetilde V}$ 是等距。这就证明了该断言。\n\n对于如(19.7.2)所定义的映射\
  \ $\\ell_p$，令 $U=\\ell_p^{-1}(\\widetilde V)$。由定理19.7.1和定理14.2.2，$U$ 在 $\\mathbb{R}^m_v$\
  \ 中是开集。由定理19.7.3可知 $\\ell_p|_U:U\\longrightarrow\\widetilde V$ 是等距。等距的复合仍是等距，等距的逆也是等距，因此\
  \ $(\\exp_p|_{\\widetilde V}\\circ\\ell_p|_U)^{-1}:V\\longrightarrow U$ 是等距。由于 $p$\
  \ 是任意的，结论成立。\n\n$(\\Leftarrow)$：这由定理19.8.7和定理19.8.8得出。\n\n## 19.9 测地线\n\n在第18.8节中，测地线被定义为加速度为零的曲线。现在我们利用半黎曼流形的度量性质来加深对测地线的理解。特别地，我们将找到测地线与长度之间的关系。\n\
  \n**定理19.9.1.** 设 $(M,g)$ 为半黎曼流形，$\\gamma(t):(a,b)\\longrightarrow M$ 为一条测地线，则：\n\
  \n(a) $\\langle d\\gamma/dt,d\\gamma/dt\\rangle:(a,b)\\longrightarrow\\mathbb{R}$\
  \ 是常值函数，因此 $\\gamma$ 具有恒定速率。\n\n(b) $\\gamma$ 或者是类空的、类时的，或者是类光的。\n\n(c) $\\gamma$\
  \ 具有恒定速率 $0$ 当且仅当它是类光的。\n\n*证明.* (a)：由于 $\\gamma$ 是测地线，$d\\gamma/dt$ 是 $\\widetilde\
  \ X(M)$ 中的平行向量场。由定理19.3.1即可得到结果。\n\n(b)：这由(a)得出。\n\n(c)：显然。\n\n**定理19.9.2.** 设 $p$\
  \ 和 $q$ 是 $\\mathbb{R}^m_v$ 中两个不同的点，$a<b$ 为实数，则：\n\n(a) 由\n\n$$\\gamma(t)=p+\\frac{t-a}{b-a}(q-p)$$\n\
  \n定义的光滑曲线 $\\gamma(t):[a,b]\\longrightarrow\\mathbb{R}^m_v$ 是满足 $\\gamma(a)=p$ 和\
  \ $\\gamma(b)=q$ 的唯一测地线。\n\n那么\n\n$$L(\\lambda)=\\int_a^b\\left\\|\\frac{d\\lambda}{dt}(t)\\\
  right\\|dt$$  \\quad [(19.2.1)]\n\n$$\\geq \\int_a^b\\left|\\frac{d\\alpha^m}{dt}(t)\\\
  right|dt$$  \\quad [(19.9.1)]\n\n$$\\geq \\left|\\int_a^b\\frac{d\\alpha^m}{dt}(t)\\\
  ,dt\\right|$$\n\n$$=|\\alpha^m(b)-\\alpha^m(a)|$$  \\quad [FTC]\n\n$$=\\|q-p\\|$$\
  \  \\quad [(19.9.2)]\n\n$$=L(\\gamma),$$  \\quad [Th 19.9.2(b)]\n\n其中FTC代表微积分基本定理。\n\
  \n## 定理19.9.4.\n\n设 $\\lambda(t):[a,b]\\longrightarrow\\mathbb{R}_1^m$ 为一条未来指向的类时光滑曲线。则：\n\
  \n- (a) $\\lambda(b)-\\lambda(a)$ 属于 $\\mathcal{T}_m^+$。\n- (b) 若 $\\lambda(a)$\
  \ 属于 $\\mathcal{T}_m^+$，则对所有 $t\\in[a,b]$，$\\lambda(t)$ 属于 $\\mathcal{T}_m^+$。\n\
  \n**证明.** (b)：定义光滑函数 $f(t):[a,b]\\longrightarrow\\mathbb{R}$ 为 $f(t)=\\langle\\\
  lambda(t),\\lambda(t)\\rangle$，于是\n\n$$\\frac{df}{dt}(t)=2\\left\\langle\\frac{d\\\
  lambda}{dt}(t),\\lambda(t)\\right\\rangle.$$\n\n由于对所有 $t\\in[a,b]$，$\\lambda(a)$\
  \ 和 $(d\\lambda/dt)(t)$ 都属于 $\\mathcal{T}_m^+$，因此 $f(a)<0$ 且 $(df/dt)(a)<0$。所以，$f$\
  \ 最初为负，并且至少在开始时刻是严格递减的。事实上，只要 $\\lambda(t)$ 保持在 $\\mathcal{T}_m^+$ 中，$f$ 就随 $t$\
  \ 的增大而持续递减。从 $\\mathbb{R}_1^m$ 中时间锥的几何性质可以清楚地看到，$\\lambda(t)$ 不能对所有 $t\\in[a,b]$\
  \ 都保持在 $\\mathcal{T}_m^+$ 中，当且仅当存在 $t_0\\in[a,b]$ 使得 $\\lambda(t_0)$ 属于 $\\Lambda_m^+$\
  \ 或 $\\lambda(t_0)=(0,\\ldots,0)$；无论哪种情况，都有 $f(t_0)=0$。假设这样的 $t_0$ 存在。由于 $f$ 光滑，由定理10.1.1，它是连续的。由实数域的基本性质和\
  \ $f$ 的连续性可知，存在一个最小的这样的 $t_0$。那么 $f$ 在 $[a,t_0)$ 上取负值且严格递减，并有 $f(t_0)=0$，这意味着 $f$\
  \ 在 $t_0$ 处不连续。这个矛盾表明这样的 $t_0$ 不存在。\n\n(a)：考虑由 $\\lambda'(t)=\\lambda(t)-\\lambda(a)$\
  \ 给出的光滑曲线 $\\lambda'(t):[a,b]\\longrightarrow\\mathbb{R}_1^m$。由于对所有 $t\\in[a,b]$，$(d\\\
  lambda'/dt)(t)=(d\\lambda/dt)(t)$，$\\lambda'$ 是未来指向的类时曲线，因此\n\n$$\\frac{d\\lambda'}{dt}(a)=\\\
  lim_{\\varepsilon\\to0^+}\\frac{\\lambda'(a+\\varepsilon)-\\lambda'(a)}{\\varepsilon}=\\\
  lim_{\\varepsilon\\to0^+}\\frac{\\lambda'(a+\\varepsilon)}{\\varepsilon}$$\n\n属于\
  \ $\\mathcal{T}_m^+$。对于足够小的实数 $\\varepsilon_0>0$，$\\lambda'(a+\\varepsilon_0)/\\\
  varepsilon_0$ 属于 $\\mathcal{T}_m^+$，从而由定理4.9.3(a)，$\\lambda'(a+\\varepsilon_0)$\
  \ 也属于 $\\mathcal{T}_m^+$。因此，光滑曲线 $\\lambda''(t)=\\lambda'|_{[a+\\varepsilon_0,b]}(t):[a+\\\
  varepsilon_0,b]\\longrightarrow\\mathbb{R}_1^m$ 是未来指向的类时曲线，且 $\\lambda''(a+\\varepsilon_0)$\
  \ 属于 $\\mathcal{T}_m^+$。由(b)部分，$\\lambda'(b)=\\lambda(b)-\\lambda(a)=\\lambda''(b)$\
  \ 属于 $\\mathcal{T}_m^+$。\n\n定理19.9.3和下一个结果生动地说明了 $\\mathbb{R}_0^m$ 与 $\\mathbb{R}_1^m$\
  \ 的几何性质有多么不同。\n\n那么\n\\[ L(\\lambda) = \\int_a^b \\left\\| \\frac{d\\lambda}{dt}(t)\
  \ \\right\\| dt \\quad \\text{[(19.2.1)]} \\]\n\\[ \\le \\int_a^b \\frac{d\\alpha^m}{dt}(t)\
  \ dt \\quad \\text{[(19.9.4)]} \\]\n\\[ = \\alpha^m(b) - \\alpha^m(a) \\quad \\\
  text{[FTC]} \\]\n\\[ = \\|q - p\\| \\quad \\text{[(19.9.5)]} \\]\n\\[ = L(\\gamma),\
  \ \\quad \\text{[Th 19.9.2(b)]} \\]\n\n其中FTC代表微积分基本定理。\n\n定理19.9.3到任意黎曼流形的推广见定理21.1.1。定理19.9.5到任意洛伦兹流形也有相应的推广，但此处未包含。\n\
  \n## 19.10 体积形式\n\n在第16.7节中，我们讨论了光滑流形上微分形式的积分。半黎曼流形的结构使得将该理论推广到光滑函数的积分成为可能。\n\n\
  **定理19.10.1（体积形式的存在性）。** *如果 $(M, \\mathfrak{g}, \\mathfrak{O})$ 是一个定向半黎曼 $m$ 维流形或带边界的定向半黎曼\
  \ $m$ 维流形，则在 $M$ 上存在唯一的定向形式 $\\Omega_M$，称为**体积形式**，使得：(i) $\\Omega_M$ 诱导 $\\mathfrak{O}$；(ii)\
  \ 若 $U$ 是 $M$ 中的开集，且 $(E_1,\\dots,E_m)$ 是 $U$ 上的正定向标准正交标架，则函数 $\\Omega_M|_U(E_1,\\\
  dots,E_m)$ 在 $U$ 上取常值 $1$。*\n\n*证明.* 这是定理8.3.4的流形版本。\n\n**定理19.10.2（体积形式的局部坐标表达式）。**\
  \ *设 $(M, \\mathfrak{g}, \\mathfrak{O})$ 为定向半黎曼 $m$ 维流形或带边界的定向半黎曼 $m$ 维流形，设 $(U,\
  \ (x^i))$ 为 $M$ 上的正定向坐标卡，并设 $\\mathcal{X}$ 和 $(d(x^1),\\dots,d(x^m))$ 分别为相应的坐标标架和对偶坐标标架。则*\n\
  \n\\[ \\Omega_M|_U = \\sqrt{|\\det(\\mathfrak{g}_\\mathcal{X})|}\\, d(x^1) \\wedge\
  \ \\cdots \\wedge d(x^m). \\]\n\n*证明.* 这是定理8.3.5的流形版本。\n\n设 $(M, \\mathfrak{g},\
  \ \\mathfrak{O})$ 为定向半黎曼 $m$ 维流形，$\\Omega_M$ 为其体积形式，$f$ 为 $C^\\infty(M)$ 中具有紧支撑的函数。则\
  \ $f\\,\\Omega_M$ 是 $\\Lambda^m(M)$ 中具有紧支撑的形式。**$f$ 在 $M$ 上的积分**定义为\n\n\\[ \\int_M\
  \ f\\,\\Omega_M. \\]\n\n\n\n\n\nM 的体积是通过取 C^∞(M) 中常值为 1 的函数 f 获得的：\n\nvol(M) = ∫_M\
  \ Ω_M.\n\n## Example 19.10.3 (Area of Regular Surface in ℝ₀³).\n\n设 (M, \U0001D524\
  , \U0001D512) 是 ℝ₀³ 中的紧致定向正则曲面，设 (U, φ) 是 M 上的正定向坐标图，设 ℋ = (H₁, H₂) 为相应的坐标标架。 这里“图”的用法与第\
  \ 11.2 节中的意义相同：U 是 ℝ² 中的开集且 φ : U ⟶ ℝ₀³ 是一个光滑映射。 在本设定中，我们将“体积”称为“面积”。 经过第 16.7 节中定义的推导并使用定理\
  \ 19.10.2，我们发现\n\narea(φ(U)) = ∬_U √det(\U0001D524_ℋ) dr¹ dr².\n\n我们由定理 4.6.3 知\
  \ det(\U0001D524_ℋ) > 0 在 U 上成立，因此上述积分是良定义的。 由定理 8.4.6(b)，‖H₁ × H₂‖ = √det(\U0001D524\
  _ℋ)，故\n\narea(φ(U)) = ∬_U ‖H₁ × H₂‖ dr¹ dr².\n\n这就是来自两个实变量积分学的熟悉的面积定义。\n\n## Example\
  \ 19.10.4 (\U0001D4E2²).\n\n设我们将 (\U0001D4E2², \U0001D522|\U0001D4E2²) 视为黎曼 3 流形\
  \ ℝ₀³ = (ℝ³, \U0001D522) 的黎曼 2 子流形。 回顾第 13.4 节的结果，并考虑 \U0001D4E2² 上的图 (U, φ = (θ,\
  \ φ))，其中 U = (0, π) × (−π, π) 且 φ : U ⟶ \U0001D4E2² 由\n\nφ(θ, φ) = (sin(θ) cos(φ),\
  \ sin(θ) sin(φ), cos(θ)).\n\n给出。 由\n\n\U0001D524_ℋ(θ, φ) = [1 0; 0 sin²(θ)]\n\n\
  和定理 19.10.2，体积形式由\n\nΩ_\U0001D4E2²|_(θ,φ) = √det(\U0001D524_ℋ(θ, φ)) d(θ) ∧ d(φ)\
  \ = sin(θ) d(θ) ∧ d(φ).\n\n给出。 由于 φ(U) 等于 \U0001D4E2² 除去一个大圆的一部分（其面积为 0），\U0001D4E2\
  ² 的面积为\n\narea(\U0001D4E2²) = ∬_U Ω_\U0001D4E2²|_(θ,φ) dθ dφ = ∫_{-π}^{π} ∫_0^{π}\
  \ sin(θ) dθ dφ = 4π.\n\n## 19.11 Orientation of Hypersurfaces\n\n在本节中，我们总结并扩展了关于超曲面定向的先前结果。\n\

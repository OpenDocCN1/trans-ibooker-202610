  \ (e₁,...,eₘ) 为 ℝᵐ 的标准基，且设 v = (a¹,...,aᵐ) 是 ℝᵐ 中的一个向量，使得对 ℝᵐ 中所有向量 w 都有 ⟨v,w⟩ =\

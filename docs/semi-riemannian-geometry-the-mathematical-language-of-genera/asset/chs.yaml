  \ & \\text{if } J = I^c \\\\ 0 & \\text{if } J \\neq I^c.\\end{cases}$\n\n代入 (8.5.3)\
  \ 即得结果。\n\n定理 8.5.2 提供了在 $\\Lambda^s(V)$ 的标准正交基上使用 $\\star$ 进行计算的方法。然后通过 $\\star$\
  \ 的线性性将计算推广到整个 $\\Lambda^s(V)$。\n\n### 定理 8.5.3. 设 $(V,\\mathfrak{g},\\mathfrak{O})$\

  \ 中构造的坐标图截然不同的坐标图的例子作结。\n\n## 例 11.2.13（立体投影）。\n\n考虑集合 $\\Sigma^2 = \\mathcal{S}^2\\\
  {(0,0,1)\\}$，即去掉“北极”的单位球。我们定义映射 $\\sigma : \\Sigma^2 \\longrightarrow \\mathbb{R}^2$，称为立体投影，如下。对于\n\
  \n每个 $(x,y,z)$ 在 $\\Sigma^2$ 中，令 $\\sigma(x,y,z) = (r,s)$ 为直线通过 $(0,0,1)$ 与 $(x,y,z)$\
  \ 与 $xy$ 平面的交点，其中我们将后者等同于 $\\mathbb{R}^2$。见图 11.2.5。则\n\n$(x,y,z) - (0,0,1) = c[(r,s,0)\
  \ - (0,0,1)]$\n\n对某个实数 $c$ 成立，故 $x = cr$，$y = cs$，且 $z = 1 - c$。由此可得\n\n$1 = x^2\
  \ + y^2 + z^2 = c^2 r^2 + c^2 s^2 + (1 - c)^2$,\n\n所以\n\n$c = 1 - z = \\frac{2}{r^2\
  \ + s^2 + 1}.$\n\n于是，\n\n$\\sigma(x,y,z) = (r,s) = \\frac{1}{1 - z}(x,y)$ \\hfill\
  \ (11.2.2)\n\n对所有 $(x,y,z)$ 在 $\\Sigma^2$ 成立。由图 11.2.5 可见 $\\sigma$ 为双射。令 $\\varphi\
  \ = \\sigma^{-1}$。则 $\\varphi(\\mathbb{R}^2) = \\Sigma^2$ 且\n\n$\\varphi(r,s) =\
  \ (x,y,z) = \\frac{1}{r^2 + s^2 + 1}(2r, 2s, r^2 + s^2 - 1)$ \\hfill (11.2.3)\n\n\
  对所有 $(r,s)$ 在 $\\mathbb{R}^2$ 成立。\n\n我们断言 $(\\mathbb{R}^2, \\varphi)$ 为 $\\mathcal{S}^2$\
  \ 上的坐标图。易证 $\\varphi : \\mathbb{R}^2 \\longrightarrow \\mathbb{R}^3$ 为参数化曲面。我们需要证明：\n\

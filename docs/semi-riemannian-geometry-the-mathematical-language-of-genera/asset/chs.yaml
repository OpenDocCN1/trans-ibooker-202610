  在下面的结果序列中，我们证明例 4.8.1 中对 ℝ₁³ 的 2 维子空间的特征更一般地成立。\n\n## 定理 4.8.2. 设 $(V,\U0001D524\
  )$ 是一个洛伦兹向量空间，设 $v$ 是 $V$ 中的一个向量。则 $v$ 是类空（分别、类时、类光）向量当且仅当 ℝv 是类空（分别、类时、类光）子空间。\n\
  \n证明. ℝv 中的每个向量都形如 $cv$，其中 $c$ 为实数，所以我们有 ⟨cv, cv⟩ = c²⟨v, v⟩。结论由此得出。\n\n## 定理 4.8.3.\
  \ 设 $(V,\U0001D524)$ 是一个洛伦兹向量空间，设 $U$ 是 $V$ 的一个子空间。则 $U$ 是类空的当且仅当它完全由类空向量组成。\n\n\
  证明. 我们有\n\n- U 是类空的\n- ⇔ \U0001D524 在 U 上是内积 [(4.8.1)]\n- ⇔ \U0001D524 在所有 $u$ 在\
  \ $U$ 中的 ℝu 上是内积\n- ⇔ 所有 $u$ 在 $U$ 中的 ℝu 是类空的 [(4.8.1)]\n- ⇔ 所有 $u$ 在 $U$ 中的 $u$\
  \ 是类空的。 [Th 4.8.2]\n\n## 定理 4.8.4. 设 $(V,\U0001D524)$ 是一个洛伦兹向量空间，设 $U$ 是 $V$ 的一个子空间。则：\n\
  (a) U 是类空的当且仅当 U⊥ 是类时的。\n(b) U 是类时的当且仅当 U⊥ 是类空的。\n(c) U 是类光的当且仅当 U⊥ 是类光的。\n\n证明.\
  \ (a)(⇒): 由于 U 是类空的，\U0001D524 在 U 上非退化且 ind(\U0001D524|U)=0。由定理 4.1.3 可知 \U0001D524\

  证明。 如与定理 12.2.6 相关的评述中所指出的，$\\nu = 0$ 的情形是直接的，故设 $\\nu = 1$。 我们由例 11.2.5 得到 graph$(f)$\
  \ 是正则曲面，由定理 11.4.2 得到 $(U,\\varphi)$ 是覆盖坐标图，且由定理 12.10.2 的部分 (b) 的证明得到\n\n$$\\langle\
  \ H_1|_{(x,y)} \\times H_2|_{(x,y)}, H_1|_{(x,y)} \\times H_2|_{(x,y)} \\rangle\

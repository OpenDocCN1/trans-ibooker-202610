  \ \\(\\int_C X \\cdot ds\\)（还有其他记法）并定义为\n\n\\[\n\\int_C X \\cdot ds = \\int_a^b\
  \ \\langle X_{\\lambda(t)}, d\\lambda/dt(t) \\rangle\\, dt,\n\\]\n\n其中 \\(C\\) 为\
  \ \\(\\lambda\\) 的像。下一个结果表明，除向量场到等价协向量场的转换之外，经典线积分与第 16.8 节中引入的线积分本质上是相同的。\n\n###\
  \ 定理 21.2.1（经典线积分）\n\n在上述设定下继续，设 \\(\\omega\\) 为 \\(\\mathfrak{X}^*(\\mathbb{R}^3_0)\\\
  ) 中的协向量场，由\n\n\\[\n\\omega = \\alpha^1 d(x) + \\alpha^2 d(y) + \\alpha^3 d(z).\n\
  \\]\n\n给出。则\n\n\\[\n\\int_C X \\cdot ds = \\int_\\lambda \\omega.\n\\]\n\n证明。设 \\\
  (\\lambda = (\\lambda^1,\\lambda^2,\\lambda^3)\\)。我们有\n\n\\[\n\\begin{aligned}\n\
  \\omega_{\\lambda(t)}(d\\lambda/dt(t)) &= \\alpha^1(\\lambda(t)) d(x)(d\\lambda/dt(t))\
  \ + \\alpha^2(\\lambda(t)) d(y)(d\\lambda/dt(t)) + \\alpha^3(\\lambda(t)) d(z)(d\\\
  lambda/dt(t))\\\\\n&= \\alpha^1(\\lambda(t)) d\\lambda^1/dt(t) + \\alpha^2(\\lambda(t))\
  \ d\\lambda^2/dt(t) + \\alpha^3(\\lambda(t)) d\\lambda^3/dt(t)\\\\\n&= \\langle\
  \ X_{\\lambda(t)}, d\\lambda/dt(t) \\rangle.\n\\end{aligned}\n\\]\n\n结果现在由 (16.8.4)\
  \ 得出。\n\n设 \\(U\\) 为 \\(\\mathbb{R}^2\\) 中的一个开集，\\(S\\) 为 \\(\\mathbb{R}^3\\) 中的一个集合，\\\
  (F = (F^1,F^2,F^3) : U \\longrightarrow S\\) 为具有紧支集的微分同胚，且 \\(X = (\\alpha^1,\\\
  alpha^2,\\alpha^3)\\) 为 \\(\\mathfrak{X}(\\mathbb{R}^3_0)\\) 中的一个向量场。\\(X\\) 的经典面积分记为\
  \ \\(\\iint_S X \\cdot dA\\)（还有其他记法）并定义为\n\n\\[\n\\iint_S X \\cdot dA = \\iint_U\

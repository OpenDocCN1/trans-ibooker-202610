  \ ∧ d(x) + z d(x) ∧ d(y).\n```\n\n\n\n\n\n### 19.12 诱导联络\n\n在本节中，我们将关于向量场的欧几里得导数（第10.3节）和关于向量场的诱导欧几里得导数（第12.3节）置于半黎曼流形的更大背景中。\n\
  \n设 $\\overline{M},\\overline{g},\\overline{\\nabla}$ 为半黎曼 $\\overline{m}$-流形，设\

  \ 是类光的。\n(a)(⇐): 这由定理 4.1.2(c) 和 (b)(⇒) 推出。\n(b)(⇐): 这由定理 4.1.2(c) 和 (a)(⇒) 推出。\n\
  (c)(⇐): 这由定理 4.1.2(c) 和 (c)(⇒) 推出。\n\n## 定理 4.8.5. 若 $(V,\U0001D524)$ 是一个洛伦兹向量空间且\
  \ $v$ 是 $V$ 中的一个类时向量，则 V = (ℝv)⊥ ⊕ ℝv，其中 (ℝv)⊥ 是类空的且 ℝv 是类时的。因此，每个向量 w 在 V 中可以唯一地表示为形式\n\
  \n\n\n证明。因为 v 是类时的，由定理 4.8.2 可知 ℝv 是类时的，进而由定理 4.8.4(b) 可知 (ℝv)⊥ 是类空的。因此，\U0001D524\
  \ 在 (ℝv)⊥ 上是非退化的。由定理 4.1.2(c) 和定理 4.1.3 得 V = (ℝv)⊥ ⊕ ℝv。\n\n在定理 4.8.5 的记号下，由于 (ℝv)⊥\
  \ 是类空的而 ℝv 是类时的，可知 \U0001D524 在 (ℝv)⊥ 上是正定的，在 ℝv 上是负定的。因此，V = (ℝv)⊥ ⊕ ℝv 是定理 4.1.6(a)\
  \ 所给类型的直和。\n\n## 定理 4.8.6. 设 (V,\U0001D524) 是一个洛伦兹向量空间，且 v, w 是 V 中的类光向量。则 v 和 w\
  \ 正交当且仅当它们线性相关。\n\n证明。 (⇒): 设 (e₁, …, eₘ) 是 V 的一个标准正交基。则 eₘ 是类时的，故由定理 4.8.5 可知 v\
  \ 和 w 可表示为\n\nv = v̄ + a eₘ      且      w = w̄ + b eₘ,    (4.8.2)\n\n其中 v̄, w̄ 是\
  \ (ℝ eₘ)⊥ 中的（类空）向量，a, b 是实数。则\n\n0 = ⟨v, v⟩ = ⟨v̄, v̄⟩ − a²\n0 = ⟨w, w⟩ = ⟨w̄, w̄⟩\
  \ − b²\n0 = ⟨v, w⟩ = ⟨v̄, w̄⟩ − ab,\n\n故\n\na² = ⟨v̄, v̄⟩      b² = ⟨w̄, w̄⟩   \
  \   ab = ⟨v̄, w̄⟩,    (4.8.3)\n\n于是\n\n⟨v̄, w̄⟩² = ⟨v̄, v̄⟩⟨w̄, w̄⟩.    (4.8.4)\n\
  \n由于 eₘ 是类时的，由定理 4.8.2 可知 ℝ eₘ 是类时的，进而由定理 4.8.4(b) 可知 (ℝ eₘ)⊥ 是类空的。因此，\U0001D524\
  \ 是 (ℝ eₘ)⊥ 上的内积。由定理 4.6.4 和 (4.8.4) 可知\n\nv̄ = c w̄    (4.8.5)\n\n对某个实数 c。则 (4.8.5)\
  \ 与 (4.8.3) 中的第二、第三个恒等式给出 ab = b² c。我们有 b ≠ 0；否则 w = w̄，其中 w 是类光的而 w̄ 是类空的，这是一个矛盾。因此，\n\
  \na = b c.    (4.8.6)\n\n结合 (4.8.2)、(4.8.5) 和 (4.8.6) 得 v = c w。\n(⇐): 若 v, w 线性相关，则\
  \ w = c v 对某个实数 c，故 ⟨v, w⟩ = c⟨v, v⟩ = 0。\n\n## 定理 4.8.7. 若 (V,\U0001D524) 是洛伦兹向量空间且\
  \ U 是 V 的维数 m ≥ 2 的子空间，则以下等价：\n- (a) U 是类时的。\n- (b) U 包含两个线性无关的类光向量。\n- (c) $U$\
  \ 包含一个类时向量。\n\n**证明.** (a) ⇒ (b): 根据假设，$U$ 是类时的，故 $\\mathbf{g}$ 是 $U$ 上的（洛伦兹）标量积。由定理\
  \ 4.2.4，存在 $U$ 的标准正交基 $(e_1,\\ldots,e_k)$。则 $e_1$ 是类空单位向量，$e_k$ 是类时单位向量，且 $e_1$\
  \ 与 $e_k$ 正交。可知\n\n$\\langle e_1+e_k,e_1+e_k\\rangle=0\\qquad\\text{and}\\qquad\\\
  langle e_1-e_k,e_1-e_k\\rangle=0,$\n\n故 $e_1+e_k$ 与 $e_1-e_k$ 是类光的。设\n\n$0=a(e_1+e_k)+b(e_1-e_k)=(a+b)e_1+(a-b)e_k$\n\
  \n对某些实数 $a,b$。由于 $e_1,e_k$ 线性无关，我们有 $a=b=0$。因此，$e_1+e_k,e_1-e_k$ 线性无关。\n\n(b) ⇒\
  \ (c): 根据假设，$U$ 包含两个线性无关的类光向量 $v$ 和 $w$。则\n\n$\\langle v+w,v+w\\rangle=2\\langle\
  \ v,w\\rangle\\qquad\\text{and}\\qquad\\langle v-w,v-w\\rangle=-2\\langle v,w\\\
  rangle.$\n\n由定理 4.8.6 可知 $\\langle v,w\\rangle\\ne0$，故 $v+w$ 或 $v-w$ 是类时的。\n\n(c)\
  \ ⇒ (a): 根据假设，$U$ 包含一个类时向量 $v$。由定理 4.8.2 可知 $\\mathbb{R}v$ 是类时的，进而由定理 4.8.4(b) 可知\
  \ $(\\mathbb{R}v)^\\perp$ 是类空的。由于 $\\mathbb{R}v\\subset U$，我们有 $U^\\perp\\subset(\\\
  mathbb{R}v)^\\perp$，进而由定理 4.8.3 可知 $U^\\perp$ 是类空的。由定理 4.1.2(c) 和定理 4.8.4(a)，$U=U^{\\\
  perp\\perp}$ 是类时的。\n\n## 定理 4.8.8.\n\n若 $(V,\\mathbf{g})$ 是洛伦兹向量空间且 $U$ 是 $V$ 的子空间，则以下等价：\n\
  - (a) $U$ 是类光的。\n- (b) $U$ 包含一个类光向量但不包含类时向量。\n- (c) $U\\cap\\Lambda=\\mathbb{R}v\\\
  setminus\\{0\\}$ 对某个 $U$ 中的类光向量 $v$。\n\n**证明.** 若 $V$ 是 1 维的，结果是平凡的，故设 $\\dim(V)\\\
  ge2$。\n\n(a) ⇒ (b): 根据假设，$U$ 是类光的。则 $\\sigma$ 在 $U$ 上退化，故存在 $U$ 中非零向量 $v$ 使得对所有\
  \ $U$ 中的向量 $w$ 有 $\\langle v,w\\rangle=0$。特别地，$\\langle v,v\\rangle=0$，故 $v$ 是类光的。此外，$U$\
  \ 不包含类时向量；若包含，则由定理 4.8.7，$U$ 将是类时的，这与 $U$ 的假设矛盾。\n\n(b) ⇒ (c): 根据假设，$U$ 包含一个类光向量\
  \ $v$。则 $U\\cap\\Lambda$ 不包含与 $v$ 线性无关的类光向量；否则，由定理 4.8.7，$U$ 将包含一个类时向量，这与 $U$ 的假设矛盾。因此，$U\\\
  cap\\Lambda=\\mathbb{R}v\\setminus\\{0\\}$。\n\n(c) ⇒ (a): 根据假设，$U\\cap\\Lambda=\\\
  mathbb{R}v\\setminus\\{0\\}$ 对某个 $U$ 中的类光向量 $v$。由定理 4.8.3 可知 $U$ 不是类空的。由于 $U\\cap\\\
  Lambda$ 包含在 $V$ 的 1 维子空间 $\\mathbb{R}v$ 中，它不包含两个线性无关的（类光）向量。由定理 4.8.7，$U$ 不是类时的。因此，$U$\
  \ 是类光的。\n\n## 定理 4.8.9. 若 (V,\U0001D524) 是洛伦兹向量空间且 U 是 V 的维数 m ≥ 2 的子空间，则 U 包含一个非零类空向量。\n\
  \n证明。需考虑三种情况。\n\n情况 1. U 是类空的。\n由定理 4.8.3，U 中任意非零向量都是类空的。\n\n情况 2. U 是类时的。\n设 dim(V)\
  \ = m。根据定理 4.8.7，U 包含一个类时向量 v。由于类时向量是非零的，dim(ℝv) = 1，故定理 4.1.2(b) 给出 dim((ℝv)⊥)\
  \ = m − 1。由假设，dim(U) ≥ 2。由定理 1.1.15 得\n\n```\nm ≥ dim((ℝv)⊥ + U)\n= dim((ℝv)⊥) +\
  \ dim(U) − dim((ℝv)⊥ ∩ U)\n≥ m + 1 − dim((ℝv)⊥ ∩ U),\n```\n\n故 dim((ℝv)⊥ ∩ U) ≥\
  \ 1。因此，(ℝv)⊥ ∩ U 不是零子空间。由定理 4.8.2 可知 ℝv 是类时的，进而由定理 4.8.4(b) 可知 (ℝv)⊥ 是类空的。由定理 4.8.3，(ℝv)⊥\
  \ ∩ U 中任意非零向量都是类空的。\n\n情况 3. U 是类光的。\n由定理 4.8.8，U 包含一个类光向量 v。设 w 是 U\\ℝv 中的向量。需考虑三种情况：w\
  \ 是类空的、类时的或类光的。若 w 是类空的，则我们已完成。设 w 不是类空的。由定理 4.8.8，w 不能是类时的，故它是类光的。由定理 1.1.2 可知\
  \ v, w 线性无关，进而由定理 4.8.6 可知它们不正交。因此，\n\n```\n⟨v + w, v + w⟩ = 2⟨v, w⟩ ≠ 0,\n```\n\
  \n故 U 中的向量 v + w 非零且不是类光的。由定理 4.8.8，v + w 不能是类时的，故它是类空的。\n\n下表总结了上述关于洛伦兹向量空间的一些发现。可以看出，例\
  \ 4.8.1 中对 ℝ₁³ 的 2 维子空间所做的观察一般适用于洛伦兹向量空间。\n\n| 子空间的类型 (维数 ≥ 2) | 子空间中的向量类型 (排除零向量)\
  \ | | |\n| | 类空 | 类时 | 类光 |\n| 类空 | yes | no | no |\n| 类时 | yes | yes | yes |\n\
  | 类光 | yes | no | yes |\n\n再次看图 4.8.2，我们分别利用定理 4.8.3、定理 4.8.7 和定理 4.8.8 确认 $\\Pi_1$\
  \ 是类空的，$\\Pi_2$ 是类时的，且 $\\Pi_3$ 是类光的。\n\n我们用又一个版本的柯西-施瓦茨不等式结束本节。它被称为“反向”，因为不等号的方向不同。这提醒我们洛伦兹向量空间与内积空间相比行为迥异。\n\
  \n## 定理 4.8.10 (反向柯西-施瓦茨不等式)。\n\n*若 $(V,g)$ 是洛伦兹向量空间且 $v,w$ 是类时向量，则*\n\n\\[\\langle\
  \ v,w\\rangle^2 \\ge \\langle v,v\\rangle\\langle w,w\\rangle,\\]\n\n*当且仅当 $v,w$\
  \ 线性相关时取等号。*\n\n*证明.* 由于 $v$ 是类时的，由定理 4.8.2 可知 $\\mathbb{R}v$ 是类时的，进而由定理 4.8.4(b)\
  \ 可知 $(\\mathbb{R}v)^\\perp$ 是类空的。因此，$g$ 是 $(\\mathbb{R}v)^\\perp$ 上的内积。由定理 4.8.5，$w=\\\
  overline{w}+cv$，其中 $\\overline{w}$ 是 $(\\mathbb{R}v)^\\perp$ 中的（类空）向量，$c$ 是实数。则\n\
  \n\\[\\langle v,w\\rangle=c\\langle v,v\\rangle \\qquad\\text{and}\\qquad \\langle\
  \ w,w\\rangle=\\langle\\overline{w},\\overline{w}\\rangle+c^2\\langle v,v\\rangle,\\\
  ]\n\n故\n\\[\n\\langle v,w\\rangle^2=c^2\\langle v,v\\rangle^2\n=\\langle v,v\\rangle\\\
  bigl(\\langle w,w\\rangle-\\langle\\overline{w},\\overline{w}\\rangle\\bigr)\n=\\\
  langle v,v\\rangle\\langle w,w\\rangle-\\langle v,v\\rangle\\langle\\overline{w},\\\
  overline{w}\\rangle.\n\\]\n\n由于 $v$ 和 $w$ 是类时的，$\\langle v,v\\rangle\\langle w,w\\\
  rangle>0$，并且因为 $v$ 是类时而 $\\overline{w}$ 是类空，$\\langle v,v\\rangle\\langle\\overline{w},\\\
  overline{w}\\rangle\\le 0$。可知 $\\langle v,w\\rangle^2\\ge\\langle v,v\\rangle\\\
  langle w,w\\rangle$，当且仅当 $\\langle\\overline{w},\\overline{w}\\rangle=0$ 时取等号。由于\
  \ $g$ 是 $(\\mathbb{R}v)^\\perp$ 上的内积，$\\langle\\overline{w},\\overline{w}\\rangle=0$\
  \ 当且仅当 $\\overline{w}=0$，这等价于 $w=cv$，进而等价于 $v$ 和 $w$ 线性相关。\n\n## 4.9 时间锥\n\n设 $(V,g)$\
  \ 是洛伦兹向量空间。$V$ 的 **时间锥** 用 $\\mathcal{T}$ 表示，定义为 $V$ 中类时向量的集合：\n\n\\[\\mathcal{T}=\\\
  {v\\in V:\\langle v,v\\rangle<0\\}.\\]\n\n在 $\\mathbb{R}^m_1$ 中，时间锥用 $\\mathcal{T}_m$\
  \ 表示。例如，\n\n\\[\\mathcal{T}_3=\\{(x,y,z)\\in\\mathbb{R}^3_1:x^2+y^2-z^2<0\\}.\\\
  ]\n\n回顾例 4.8.1，$\\mathbb{R}^3_1$ 的光锥为\n\n\\[\\Lambda_3=\\{(x,y,z)\\in\\mathbb{R}^3_1:x^2+y^2-z^2=0\\\
  }\\setminus\\{(0,0,0)\\}.\\]\n\n因此，$\\mathcal{T}_3$ 在 $\\Lambda_3$ 的“内部”。\n\n\n\n\
  \n\n## 定理 4.9.1.\n\n设 \\((V,g)\\) 为洛伦兹向量空间。若 \\(v\\) 是 \\(V\\) 中的类时向量且 \\(w\\) 是\
  \ \\(V\\) 中的类时或类光向量，则 \\(\\langle v,w\\rangle \\ne 0\\)。\n\n*证明.* 由于 \\(v\\) 是类时的，由定理\
  \ 4.8.2 可知 \\(\\mathbb{R}v\\) 是类时的，进而由定理 4.8.4(b) 可知 \\((\\mathbb{R}v)^\\perp\\\
  ) 是类空的。由于 \\(w\\) 不是类空的，由定理 4.8.3 可知它不在 \\((\\mathbb{R}v)^\\perp\\) 中，故 \\(\\langle\
  \ v,w\\rangle \\ne 0\\)。\n\n设 \\((V,g)\\) 为洛伦兹向量空间，且 \\(v,w\\) 为 \\(V\\) 中的类时向量。由定理\
  \ 4.9.1 可知要么 \\(\\langle v,w\\rangle<0\\) 要么 \\(\\langle v,w\\rangle>0\\)。令我们写\n\
  \n$$v\\sim w \\qquad\\text{if}\\qquad \\langle v,w\\rangle<0.$$\n\n## 定理 4.9.2.\n\
  \n在上述设定下，\\(\\sim\\) 是 \\(\\mathcal{T}\\) 上的等价关系。\n\n*证明.* 显然，\\(\\sim\\) 是自反的和对称的。只需证明\
  \ \\(\\sim\\) 是传递的；即，若 \\(u,v,w\\) 是 \\(\\mathcal{T}\\) 中的向量且 \\(\\langle u,v\\\
  rangle<0\\) 且 \\(\\langle u,w\\rangle<0\\)，则 \\(\\langle v,w\\rangle<0\\)。不失一般性，设\
  \ \\(u\\) 为（类时）单位向量。由定理 4.8.5，\n\n$$v=\\bar v+au \\qquad\\text{and}\\qquad w=\\\
  bar w+bu,$$\n\n其中 \\(\\bar v,\\bar w\\) 是 \\((\\mathbb{R}u)^\\perp\\) 中的（类空）向量且\
  \ \\(a,b\\) 为实数。可得\n\n$$\\langle u,v\\rangle=-a \\qquad \\langle u,w\\rangle=-b\
  \ \\tag{4.9.1}$$\n\n$$\\langle v,w\\rangle=\\langle\\bar v,\\bar w\\rangle-ab \\\
  tag{4.9.2}$$\n\n$$\\langle v,v\\rangle=\\langle\\bar v,\\bar v\\rangle-a^2 \\qquad\
  \ \\langle w,w\\rangle=\\langle\\bar w,\\bar w\\rangle-b^2. \\tag{4.9.3}$$\n\n根据假设，\\\
  (\\langle v,v\\rangle<0\\) 且 \\(\\langle w,w\\rangle<0\\)。由于 \\(\\bar v\\) 和 \\\
  (\\bar w\\) 是类空的，我们有 \\(\\langle\\bar v,\\bar v\\rangle\\ge0\\) 且 \\(\\langle\\\
  bar w,\\bar w\\rangle\\ge0\\)。由 (4.9.3) 可得\n\n$$0\\le\\langle\\bar v,\\bar v\\rangle<a^2\
  \ \\qquad\\text{and}\\qquad 0\\le\\langle\\bar w,\\bar w\\rangle<b^2,$$\n\n故\n\n\
  $$(ab)^2>\\langle\\bar v,\\bar v\\rangle\\langle\\bar w,\\bar w\\rangle\\ge0. \\\
  tag{4.9.4}$$\n\n根据假设，\\(\\langle u,v\\rangle<0\\) 且 \\(\\langle u,w\\rangle<0\\\
  )，所以 \\(\\langle u,v\\rangle\\langle u,w\\rangle>0\\)。则由 (4.9.1) 得\n\n$$ab>0. \\\
  tag{4.9.5}$$\n\n由于 \\(u\\) 是类时的，由定理 4.8.2 可知 \\(\\mathbb{R}u\\) 是类时的，进而由定理 4.8.4(b)\
  \ 可知 \\((\\mathbb{R}u)^\\perp\\) 是类空的。于是，\\(g\\) 是 \\((\\mathbb{R}u)^\\perp\\) 上的内积。由定理\
  \ 4.6.4，\n\n$$\\langle\\bar v,\\bar v\\rangle\\langle\\bar w,\\bar w\\rangle\\ge\\\

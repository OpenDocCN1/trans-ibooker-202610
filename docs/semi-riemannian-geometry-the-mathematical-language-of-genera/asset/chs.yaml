  ldots i_r}_{j_1\\ldots j_{l-1}p j_{l+1}\\ldots j_s}. \\tag{6.3.6}$$\n\n将 $\\mathcal\
  \ B=F_l^k(\\mathcal A)$（由 (6.3.5) 给出）代入 (6.3.6)，得到\n\n$$\\begin{aligned}\nS_l^k\\\
  circ F_l^k(\\mathcal A)^{i_1\\ldots i_r}_{j_1\\ldots j_s}\n&=\\sum_p g^{i_kp}F_l^k(\\\
  mathcal A)^{i_1\\ldots \\widehat{i_k}\\ldots i_r}_{j_1\\ldots j_{l-1}p j_{l+1}\\\
  ldots j_s}\\\\\n&=\\sum_p g^{i_kp}\\left(\\sum_q g_{pq}\\mathcal A^{i_1\\ldots i_{k-1}q\

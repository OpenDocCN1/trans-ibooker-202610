  \n## 参考文献\n\nMcDonough, W. 和 Braungart, M.（2002）。《从摇篮到摇篮：重塑我们制造事物的方式》。North Point\
  \ Press。\n\n\n\n\n此类报告、声明或证词应注明其所依据的日期。\n- b. 工程师可以公开表达基于事实了解和专业知识的专业技术意见。\n- c.\
  \ 工程师不得就技术问题发表任何由利益相关方启发或付费的声明、批评或论点，除非他们在评论前明确指明代表其发言的利益相关方，并披露工程师在该事项中可能拥有的任何利益。\n\
  - 4. 工程师应作为每个雇主或客户的忠实代理人或受托人行事。\n- a. 工程师应披露所有已知或潜在的利益冲突，这些冲突可能影响或似乎影响其判断或服务的质量。\n\
  - b. 工程师不得就同一项目或与同一项目有关的服务从多个当事人接受报酬，无论是财务或其他形式的报酬，除非情况已完全披露并得到所有利益相关方的同意。\n- c.\
  \ 工程师不得就其负责的工作直接或间接地从外部代理人处招揽或接受财务或其他有价值的报酬。\n- d. 作为政府或准政府机构或部门的成员、顾问或雇员的公共服务工程师，不得参与与其或其组织在私人或公共工程实践中招揽或提供的服务有关的决策。\n\
  - e. 工程师不得从其组织的负责人或官员担任成员的政府机构招揽或接受合同。\n- 5. 工程师应避免欺骗行为。\n- a. 工程师不得伪造其资格或允许对其或其同事资格的误述。他们不得歪曲或夸大其在先前任务的主题事项中的责任或职责。用于招揽雇用的宣传册或其他介绍不得对雇主、员工、合作伙伴、合资企业或过去的成就的有关事实进行误述。\n\
  - b. 工程师不得直接或间接提供、给予、招揽或接受任何捐款以影响公共当局的合同授予，或可能被公众合理地解释为具有影响合同授予的效果或意图。他们不得提供任何礼物或其他有价值的考虑以获取工作。他们不得支付佣金、百分比或经纪费以获取工作，除非支付给其真正的雇员或其保留的真正的成立的商业或营销机构。\n\
  \n## J.1.1.3 专业义务\n\n- 1. 工程师在所有关系中应以最高的诚实和正直标准为指导。\n- a. 工程师应承认其错误，不得歪曲或篡改事实。\n\
  - b. 工程师应在认为项目不会成功时告知其客户或雇主。\n- c. 工程师不得接受损害其常规工作或利益的外部工作。在接受任何外部工程工作之前，他们应通知其雇主。\n\
  - d. 工程师不得通过虚假或误导性的借口试图从另一雇主处吸引工程师。\n- e. 工程师不得以牺牲职业尊严和完整性为代价来促进自身利益。\n- 2. 工程师应始终努力服务公众利益。\n\
  - a. 鼓励工程师参与公民事务；为青年提供职业指导；并为其社区的安全、健康和福祉的提升而工作。\n- b. 工程师不得完成、签署或盖章不符合适用工程标准的计划和/或规范。如果客户或雇主坚持这种不专业行为，他们应通知有关当局并退出该项目的进一步服务。\n\
  - c. 鼓励工程师扩展公众对工程及其成就的了解和欣赏。\n- d. 鼓励工程师遵循可持续发展¹原则，以保护环境造福子孙后代。\n- e. 工程师应在其整个职业生涯中继续专业发展，并在其专业领域保持最新，通过从事专业实践、参加继续教育课程、阅读技术文献以及参加专业会议和研讨会。\n\
  \n> ¹ “可持续发展”是满足人类对自然资源、工业产品、能源、食品、交通、住房和有效废物管理的需求，同时保护环境质量和未来发展所必需的自然资源基础的挑战。\n\
  \n- 3. 工程师应避免所有欺骗公众的行为或做法。\n- a. 工程师应避免使用包含重大事实虚假陈述或遗漏重大事实的声明。\n- b. 在与上述内容一致的情况下，工程师可以为招聘人员做广告。\n\
  - c. 在与上述内容一致的情况下，工程师可以为通俗或技术性新闻媒体准备文章，但此类文章不得暗示作者对他人完成的工作享有署名权。\n\n- 4. 工程师不得未经同意披露任何现任或前任客户或雇主，或其服务的公共机构的业务事务或技术流程的保密信息。\n\
  - a. 工程师未经所有利益相关方的同意，不得在与工程师已获得特定专门知识的特定项目有关的新的就业或实践方面进行推广或安排。\n- b. 工程师未经所有利益相关方的同意，不得参与或代表与特定项目或程序有关的对抗性利益，而工程师已代表前客户或雇主在该项目或程序中获得特定专门知识。\n\
  \n- 5. 工程师在专业职责上不得受冲突利益的影响。\n- a. 工程师不得从材料或设备供应商处接受财务或其他考虑，包括免费工程设计，以指定其产品。\n- b.\
  \ 工程师不得直接或间接从与工程师的客户或雇主交易的承包商或其他当事人处接受佣金或津贴，而该工作由工程师负责。\n\n- 6. 工程师不得通过不实批评其他工程师或其他不当或可疑的方法来获取就业或晋升或专业委托。\n\
  - a. 工程师不得在可能损害其判断的情况下，以或有为基础请求、提议或接受佣金。\n- b. 受薪职位的工程师仅在与雇主政策一致并符合道德考虑的情况下才能接受兼职工程工作。\n\
  - c. 工程师未经同意，不得使用雇主的设备、用品、实验室或办公设施从事外部私人执业。\n\n- 7. 工程师不得恶意或虚假地直接或间接损害其他工程师的专业声誉、前途、执业或就业。认为他人有不道德或非法行为的工程师应向主管当局提出此类信息以采取行动。\n\
  - a. 私人执业的工程师不得在未经该工程师知情的情况下，或除非该工程师与该工作的联系已终止，否则不得为同一客户审查另一工程师的工作。\n- b. 在政府、工业或教育机构任职的工程师有权在就业职责要求时审查和评估其他工程师的工作。\n\
  - c. 在销售或工业任职的工程师有权对所代表的产品与其它供应商的产品进行工程比较。\n\n- 8. 工程师应对其专业活动承担个人责任，但工程师可在因其执业而产生的服务中寻求赔偿，但不包括重大过失，前提是工程师的利益无法以其他方式得到保护。\n\
  - a. 工程师应遵守工程执业的州注册法律。\n- b. 工程师不得将与非工程师、公司或合伙企业的关联作为从事不道德行为的“掩护”。\n\n- 9. 工程师应将工程工作的功劳归于应得者，并承认他人的所有权利益。\n\
  - a. 工程师应尽可能指明可能对设计、发明、著作或其他成就单独负责的人或人员。\n- b. 使用客户提供的设计的工程师承认设计仍属客户所有，未经明确许可不得为他人复制。\n\
  - c. 工程师在为他人从事可能产生改进、计划、设计、发明或其他可证明版权或专利的记录的工作之前，应就所有权达成明确协议。\n- d. 工程师的设计、数据、记录和笔记如果仅涉及雇主的工作，则为雇主所有。雇主应对为除原始目的以外的任何目的使用该信息的情况给予工程师赔偿。\n\

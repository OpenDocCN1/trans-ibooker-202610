  ### 6.2.3.2 Define the Goal(s) of the Project


  The primary goal of the LCA is to choose the best product, process, or service with
  the least effect on human health and the environment. There may also be secondary
  goals for performing an LCA, which would vary depending on the type of project.
  Some typical secondary goals are as follows:


  - To prove one product is environmentally superior to a competitive product

  - To identify stages within the life cycle of a product or process where a reduction
  in resource use and emissions might be achieved

  - To determine the impacts to particular stakeholders or affected parties

  - To establish a baseline of information on a system’s overall resource use, energy
  consumption, and environmental loadings

  - To help guide the development of new products, process, or activities toward a
  net reduction of resource requirements and emissions


  ### 6.2.3.3 Determine the Type of Information Needed to Inform the Decision-Makers


  LCA can help answer a number of important questions. Identifying the questions that
  the decision-makers care about will help define the study parameters. Some examples
  include the following:


  - What is the impact to particular interested parties and stakeholders?

  - Which product or process causes the least environmental impact (quantifiably)
  overall or in each stage of its life cycle?

  - How will changes to the current product/process affect the environmental impacts
  across all life cycle stages?

  - Which technology or process causes the least amount of acid rain, smog formation,
  or damage to local trees (or any other impact category of concern)?

  - How can the process be changed to reduce a specific environmental impact of concern
  (e.g. global warming)?


  Once the appropriate questions have been identified, the types of information needed
  to answer them will be apparent.


  ### 6.2.3.4 Determine How the Data Should Be Organized and the Results Displayed


  LCA practitioners like to organize data in terms of a functional unit that appropriately
  describes the function of the product/process being studied. Comparisons between
  products and processes must be made on the basis of the same function, quantified
  by the same functional unit. This ensures that the activities being compared are
  true substitutes for each other. Careful selection of the functional unit to measure
  and display the LCA results will improve the accuracy of the study and the usefulness
  of the results.


  An LCA study comparing two types of wall insulation to determine environmental preferability
  must be evaluated on the same function, the ability to decrease heat flow. Six square
  feet of 4-in. thick insulation Type A is not necessarily the same as 6 ft² of 4-in.
  thick insulation Type B. Insulation type A may have an R factor equal to 10, whereas
  insulation type B may have an R factor equal to 20. Therefore, types A and B do
  not provide the same amount of insulation and cannot be compared on an equal basis.
  If Type A decreases heat flow by 80%, you must determine how thick Type B must be
  to also decrease heat flow by 80%.






  ## 6.2.3.5 将包括和将不包括的内容


  理想情况下，LCA 涵盖产品或过程生命周期的全部四个阶段：原材料获取、制造、使用/再利用/维护，以及回收/废物管理。下文将更详细地解释这些产品阶段。要确定应在
  LCA 范围中纳入一个阶段还是所有阶段，必须评估以下方面：研究目标、所需结果的准确性，以及可用的时间和资源。图6.3展示了与处理技术相关的制造项目中可纳入的一组生命周期阶段。请注意“系统边界”，它涵盖了
  LCA 的所有方面。下面对这四个生命周期阶段的其他示例进行了更详细的说明。


  原材料获取 产品的生命周期始于从地球获取原材料和能源。例如，采伐树木或开采不可再生材料均属原材料获取。将这些材料从获取点运输到加工点的过程也包含在此阶段（USEPA
  1993）。


  制造 在制造阶段，原材料被转化为产品或包装，然后交付给消费者。制造阶段分为三个部分：材料制造、产品加工、以及灌装/包装/分销（USEPA 1993）。虽然这些活动不言而喻，但需要指出的是，将成品运送到零售店或直接运送给消费者的分销环节，会因运输方式（卡车运输、航运或其他）而产生环境影响。


  使用/再利用/维护 一旦产品到达消费者手中，就必须识别与该物品使用寿命相关的所有活动：产品储存和消耗所产生的能源需求与环境废物，以及可能需要的任何整修、维修或保养服务（USEPA
  2012）。当消费者不再需要该产品时，它将被回收或处置。


  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_290_0.png)


  图6.3 工业制造过程的示例生命周期阶段。


  ## 回收/废物管理


  任何产品或材料的处置——无论是通过回收、焚烧、倾倒还是其他废物管理方式——都需要能源，并会产生其他环境废物（USEPA 1993, 2012）。这些都必须预先考虑并列出。


  ## 6.2.3.6 数据所需的准确性


  项目所需的数据准确性水平取决于最终结果的用途和目标受众（结果将用于支持内部流程的决策？还是在公共论坛中使用？）。例如，如果意图是在公共论坛上使用结果，向当地社区或监管机构支持产品或工艺选择，那么估算数据或最佳工程判断可能不足以作为政策决策的依据。相反，如果
  LCA 仅用于内部决策，则可以更频繁地采用估算和最佳工程判断。这可以降低执行 LCA 的总体成本和时间，并能在缺乏精确一手数据的情况下完成研究。待做决策的关键性和涉及的金额大小，也会影响所需数据准确性水平的确定。


  ## 6.2.3.7 开展工作的基本规则


  在进入清单分析阶段之前，确定项目的一些程序性安排非常重要。


  - 1) 记录假设——整个项目中做出的所有假设或决策，必须与 LCA 项目的最终结果一并报告。如果省略假设，最终结果可能会脱离背景或被轻易误解。随着 LCA 过程从一个阶段推进到另一个阶段，可能还需要增加额外的假设和范围限制，以便利用可用资源完成项目。


  - 2) 质量保证程序——质量保证程序对于确保在项目结束时实现执行 LCA 的目标和目的非常重要。项目采用的质量保证程序水平取决于可用的时间和资源以及结果的使用方式。如果结果将在公共论坛中使用，建议采用正式审查流程。评估者可能包括内部和外部的
  LCA 专家，以及希望其支持最终结果的相关方。如果结果仅供内部决策使用，那么一位熟悉 LCA 实践且不参与该 LCA 研究的内部审查者，就可以有效满足质量保证目标。每位审查者都应就其对该
  LCA 过程每个阶段的评估出具正式声明，并将其纳入最终项目报告。


  - 3) 报告要求——为确保 LCA 符合适当预期，参与者应从一开始就知道最终结果将如何记录，以及最终报告应包含哪些内容。在报告最终结果或某一 LCA 阶段的结果时，必须详尽描述分析中使用的方法。报告应明确定义所分析的系统以及设定的边界。系统间比较的依据以及在开展工作过程中做出的所有假设都应清楚说明。结果的呈现应与研究目的保持一致，不应仅为呈现效果而过度简化。


  ## 6.2.4 生命周期清单


  生命周期清单（LCI）量化了产品、过程或活动整个生命周期中的能源和原材料需求、大气排放、水体排放、固体废物以及其他释放（USEPA 1993）。这种清单以列表形式列出释放到环境中的污染物数量以及消耗的能源和材料数量。结果可以按生命周期阶段、介质（空气、水、土地）、特定过程或其任意组合进行分类。


  没有 LCI，就不存在评估相对环境影响或潜在改进的基础。所收集数据的准确性和详细程度会在 LCA 过程的其余部分中得到反映。工业界可将 LCI 分析用于比较产品、工艺和材料。政府政策制定者也可在制定针对资源使用和环境排放的法规时使用
  LCI 分析。


  USEPA 发布了两份指导文件：《生命周期评价：清单指南与原则》（USEPA 1993）和《生命周期清单分析质量评估指南》（USEPA 1995）。这些联邦指南为执行清单分析以及评估所用数据和结果的质量提供了框架。这两份文件定义了
  LCI 的以下步骤：


  - 编制所评估过程的流程图

  - 制定数据收集计划

  - 收集数据

  - 评估并报告结果


  ## 6.2.4.1 第1步：编制流程图


  流程图是一种工具，用于绘制过程或系统的输入和输出。LCA 的系统边界在目标定义和范围界定阶段确定，并扩展到包括过程输入和输出，作为流程图的系统边界。系统边界内的单元过程相互连接，形成系统所需输入和输出（物质和能量）的完整生命周期图景。图6.4展示了给定系统边界内流程图中一个通用单元过程的组成部分。流程图越复杂，结果的准确性和实用性就越高。但复杂度的增加也意味着需要为这一步骤以及数据收集和分析步骤投入更多时间和资源。


  流程图用于对所有考虑中的替代方案（例如基线系统和替代系统）进行建模。对于比较研究，重要的是基线和替代方案使用相同的系统边界，并以相同的详细程度进行建模。否则，结果的准确性可能会产生偏差。


  ## 6.2.4.2 第2步：制定 LCI 数据收集计划


  LCI 数据收集计划可确保在目标定义和范围界定阶段所确定的数据质量和准确性满足决策者的期望。


  数据收集计划的关键要素包括：


  - 确定数据质量目标

  - 确定数据来源和类型

  - 确定数据质量指标

  - 制定数据收集工作表和检查清单


  确定数据质量目标——数据质量目标提供了一个框架，用于在可用时间和资源与就整体环境或人类健康影响做出决策所需的数据质量之间取得平衡（USEPA 1989a）。数据质量目标与总体研究目标密切相关，既帮助
  LCA 实践者制定适当的数据收集方法，又作为数据质量绩效标准。


  尽管数据质量目标的数量和性质必然取决于特定 LCA 所需的准确性水平，但以下假设性数据质量目标列表是典型的。原材料和能源输入、用水量、大气排放、废水排放和固体废物产生量需要特定场地的数据。对于能源数据类别，近似数据值即可满足要求。大气排放数据应能代表美国境内类似场所的情况。LCI
  中至少应说明95%的材料和能源输入。


  确定数据质量指标——数据质量指标是衡量所收集数据的基准，用以确定数据质量要求是否已满足。其选择取决于现有指标中哪些最适合并适用于所评估的特定数据源。指标示例包括精确性、完整性、代表性、一致性和可再现性。


  确定数据来源和类型——对于每个生命周期阶段、单元过程或环境释放类型，指定能够提供足够准确性和质量以满足研究目标的数据来源和/或类型。在数据收集之前完成这一工作，有助于降低数据收集的成本和时间。数据来源包括：


  - 设备运行日志或记录中的仪表读数；行业数据报告、数据库或顾问的实验室测试结果；政府文件、报告和数据库；其他公开来源


  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_292_0.png)


  图6.4 单元过程输入/输出模板





  可用的数据库或清算所；期刊和论文、书籍；参考书籍；专利；以及行业协会。相关的 LCI 研究也很有用，设备和工艺规范、最佳工程判断也很有用。


  数据类型的示例包括完整测量的、建模的和抽样的数据；非现场特定（即替代）数据；非 LCI 数据（即不用于 LCI）；以及供应商数据。


  所需汇总数据水平也应予以说明。例如，读者应能够迅速确定数据是否代表一个工艺还是多个工艺。


  制定数据收集工作表和清单 – LCI 清单应涵盖库存执行过程中大部分的决策领域。该文件可用于指导数据收集和验证，并可实现构建数据库以电子方式存储收集的数据。以下一般决策领域应在库存清单中得到解决：


  - 库存的目的

  - 系统边界

  - 地理范围

  - 使用的数据类型

  - 数据收集程序

  - 数据质量措施

  - 计算模型构建

  - 结果呈现


  流程图中建模的每个工艺的所有输入和输出都应记录在随附的数据工作表上。


  清单和工作表是确保完整性、准确性和一致性的有价值工具。对于大型项目，当多人从多个来源收集数据时尤其重要。清单和工作表应根据特定 LCI 的需求进行定制。


  ## 6.2.4.3 第 3 步：收集数据


  第 1 步中开发的流程图为需要收集的数据提供了路线图。第 2 步规定了所需的数据来源、类型、质量、准确性和收集方法。第 3 步包括查找并用数值数据填充流程图和工作表。这可能不是一项简单的任务。如果某些数据难以或无法获得，并且可用数据难以转换为适当的功能单位；因此，研究系统边界或数据质量目标将不得不进行完善，以描述可以从可用数据中可靠获得的结果。这种迭代过程对于大多数
  LCA 来说很常见。


  数据收集工作涉及研究、现场访问和与专家直接联系的结合，从而产生大量数据。电子数据库或电子表格对于保存和操作数据非常有用。或者，购买商用 LCA 软件包（见第 6.3
  节）可能更具成本效益。在购买 LCA 软件包之前，决策者或 LCA 从业者应确保其能提供所需的数据分析水平。


  减少数据收集时间和资源的一种第二种方法是获取非现场特定库存数据。几个组织已专门为 LCA 开发了数据库，其中包含构建 LCI 时通常需要的一些基本数据。其中一些数据库与
  LCI 数据收集软件一起销售；其他则是独立资源。许多拥有专有软件的公司还提供 LCA 设计的咨询服务。


  ## 6.2.4.4 第 4 步：评估和记录 LCI 结果


  当数据收集并整理后，必须验证结果的准确性。在记录 LCI 结果时，重要的是彻底描述分析中使用的分析方法，定义所分析的系统和设定的边界，并说明在执行库存分析时所做的所有假设。使用清单和工作表（见第
  2 步）支持记录此信息的清晰流程。库存分析的结果是包含释放到环境中的污染物数量以及消耗的能源和材料数量的清单。信息可以按生命周期阶段、按介质（空气、水、土地）、按具体工艺或其一致于基本规则的任何组合进行组织。


  如果在进入下一阶段生命周期影响评价（LCIA）之前未正确确定 LCI 数据收集工作的敏感性，则 LCA 本身可能不得不重复，因为发现数据不足以得出所需结论。


  ## 6.2.5 生命周期影响评价


  LCIA 阶段是对 LCI 期间识别的环境资源和排放的潜在人类健康和环境影响的评估。影响评价应解决生态和人类健康影响；它也可以解决资源枯竭问题。LCIA 试图在产品或工艺与其潜在环境影响之间建立联系。例如，LCIA
  可以确定一种产品或工艺是否比另一种产生更多的温室气体，或可能杀死更多的鱼。


  该组件的关键概念是压力源。压力源是一组可能导致影响的条件。例如，如果产品或工艺排放温室气体，大气中温室气体的增加*可能导致*全球变暖。导致过量营养物排放到水体中的工艺*可能导致*富营养化。LCIA
  为分类和表征这些类型的环境影响提供了一个系统程序。


  ### 6.2.5.1 为什么进行 LCIA？


  虽然通过考虑 LCI 数据可以学到很多关于工艺的知识，但 LCIA 提供了进行比较的更精确基础。因此，我们知道二氧化碳和甲烷的大量排放都有害；LCIA 可以确定
  9000T 的 CO₂ 还是 5000T 的甲烷会产生更大的潜在影响。利用基于科学的特征化因子，LCIA 可以计算每种环境排放对诸如烟雾或全球变暖等问题的影响。影响评价还可以纳入价值判断。例如，在空气非达标区，空气排放可能比在空气质量更好的地区同等排放水平更令人担忧（ISO
  2000）。


  ### 6.2.5.2 LCIA 的关键步骤


  以下步骤构成 LCIA。


  - 1. *选择和定义影响类别* – 识别相关的环境影响类别（例如全球变暖、酸化、陆地毒性）。

  - 2. *分类* – 将 LCI 结果分配到影响类别（例如将 CO₂ 排放分类为全球变暖）。

  - 3. *特征化* – 使用基于科学的转换因子对影响类别内的 LCI 影响进行建模（例如建模 CO₂ 和甲烷对全球变暖的潜在影响）。

  - 4. *归一化* – 以可比较的方式表达潜在影响（例如比较两种方案中 CO₂ 和甲烷的全球变暖影响）。

  - 5. *分组* – 对指标进行排序或排名（例如按位置排序：本地、区域和全球）。

  - 6. *加权* – 强调最重要的潜在影响。

  - 7. *评估和报告 LCIA 结果* – 更好地了解 LCIA 结果的可靠性。


  国际标准化组织关于进行影响评价的标准规定，影响类别选择、分类和特征化是 LCIA 和数据评估（第 7 步）的强制性步骤（ISO 1998a）。是否使用其他步骤将取决于研究的目标和范围。


  **第 1 步：选择和定义影响类别**  作为整体 LCA 的一部分将考虑的影响类别已在初始目标和范围定义阶段选定。为了指导 LCI 数据收集过程和为 LCIA
  所需的重新考虑，影响被定义为系统输入和输出流对人类健康、对植物和动物（即生态健康）或对自然资源未来可用性（即资源枯竭）的影响。表 6.1 显示了一些常用的影响类别。


  **第 2 步：分类**  对于仅贡献于一个影响类别的 LCI 项目，分类程序是直接分配。例如，二氧化碳排放可以替换为全球变暖类别。


  对于贡献于两个或多个不同影响类别的 LCI 项目，必须建立分类规则。有两种方法可将 LCI 结果分配到多个影响类别（ISO 1998a）：


  - 将 LCI 结果的代表性部分分配给其所贡献的影响类别。这通常允许在影响相互依赖的情况下使用。

  - 将所有 LCI 结果分配给其所贡献的所有影响类别。这通常允许在影响相互独立的情况下使用。


  例如，由于一分子二氧化硫（SO₂）可能停留在地面或进入大气，它有可能影响人类健康或酸化（但不能同时影响两者）。因此，SO₂ 排放通常在这两个影响类别之间分配（例如
  50% 分配给人类健康，50% 分配给酸化）。另一方面，由于二氧化氮（NO₂）可能同时影响地面臭氧形成和酸化，NO₂ 的全部数量将分配给这两个影响类别（例如 100%
  分配给地面臭氧和 100% 分配给酸化）。分配程序必须清楚记录。


  **第 3 步：特征化**  影响特征化使用基于科学的转换因子，称为特征化因子，将 LCI 结果转换为人类和生态健康影响的代表性指标。特征化因子也常被称为当量因子。特征化因子将不同的
  LCI 输入——例如铅、铬和锌的毒性数据——转换为可直接比较的影响指标。掌握此类数据后，可以对这些金属的相对陆地毒性进行估计。





  ### 表 6.1 常用生命周期影响类别。


  | 影响类别 | 规模 | 相关 LCI 数据（即分类） | 常见特征化因子 | 特征化因子描述 |

  | :--- | :--- | :--- | :--- | :--- |

  | 全球变暖 | 全球 | 二氧化碳（CO₂）二氧化氮（NO₂）甲烷（CH₄）氯氟烃（CFCs）氢氯氟烃（HCFCs）溴甲烷（CH₃Br） | 全球变暖潜势 |
  将 LCI 数据转换为二氧化碳（CO₂）当量 注：全球变暖潜势可以是 50、100 或 500 年潜势 |

  | 平流层臭氧损耗 | 全球 | 氯氟烃（CFCs）氢氯氟烃（HCFCs）哈龙 溴甲烷（CH₃Br） | 臭氧损耗潜势 | 将 LCI 数据转换为三氯氟甲烷（CFC-11）当量
  |

  | 酸化 | 区域 地方 | 硫氧化物（SOₓ）氮氧化物（NOₓ）盐酸（HCl）氢氟酸（HF）氨（NH₃） | 酸化潜势 | 将 LCI 数据转换为氢离子（H⁺）当量
  |

  | 富营养化 | 地方 | 磷酸盐（PO₄）氮氧化物（NOₓ）二氧化氮（NO₂）硝酸盐 氨（NH₃） | 富营养化潜势 | 将 LCI 数据转换为磷酸盐（PO₄）当量
  |

  | 光化学烟雾 | 地方 | 非甲烷烃（NMHC） | 光化学氧化剂生成潜势 | 将 LCI 数据转换为乙烷（C₂H₄）当量 |

  | 陆地毒性 | 地方 | 有报道对啮齿动物致死浓度的有毒化学品 | LC₅₀ | 将 LC₅₀ 数据转换为当量 |

  | 水生毒性 | 地方 | 有报道对鱼类致死浓度的有毒化学品 | LC₅₀ | 将 LC₅₀ 数据转换为当量 |

  | 人类健康 | 全球、区域、地方 | 向空气、水和土壤的总排放量 | LC₅₀ | 将 LC₅₀ 数据转换为当量 |

  | 资源耗竭 | 全球、区域、地方 | 使用的矿物数量 使用的化石燃料数量 | 资源耗竭潜势 | 将 LCI 数据转换为资源使用量与剩余资源储量之比 |

  | 土地利用 | 全球、区域、地方 | 填埋处置的数量 | 固体废物 | 使用估算密度将固体废物质量转换为体积 |


  表 6.1 中列出的影响类别具有许多可能的终点，包括以下内容：


  **全球影响**

  - *全球变暖*：极地融化、土壤湿度丧失、季节延长、森林丧失/变化，以及风和洋流模式变化

  - *臭氧损耗*：紫外线辐射增加

  - *资源耗竭*：未来世代可用的资源减少


  **区域影响**

  - *光化学烟雾*：“烟雾”、能见度下降、眼睛刺激、呼吸道和肺部刺激，以及植被损害

  - *酸化*：建筑物腐蚀、水体酸化、植被效应和土壤效应


  **地方影响**

  - *人类健康*：发病率和死亡率增加

  - *陆地毒性*：生产力和生物多样性下降，以及用于狩猎或观赏的野生动物减少

  - *水生毒性*：水生植物和昆虫生产力和生物多样性下降，以及商业或休闲捕鱼减少

  - *土地利用*：野生动物陆地栖息地丧失和填埋场空间减少


  影响指标通常使用以下方程进行特征化：


  ```

  Inventory data × characterization factor = impact indicators

  ```


  例如，所有温室气体都可以通过将相关 LCI 结果乘以 CO₂ 特征化因子，然后合并所得的影响指标来表示为二氧化碳当量，从而提供全球变暖潜势的总体指标。


  政府间气候变化专门委员会为多种工业污染物提供了转换因子。在以下示例中，对不同量的氯仿（CHCl₃）和甲烷（CH₄）的全球变暖影响进行了特征化。转换因子的值，称为
  GWP，即全球变暖潜势，CHCl₃ 为 9，CH₄ 为 21。


  因此，我们写道：


  ```

  GWP$_{\mathrm{CHCl}_3}$ $= 9 \times 20 = 180$

  GWP$_{\mathrm{CH}_4}$ $= 21 \times 10 = 210$

  ```


  转换因子的使用表明，10 磅甲烷对全球变暖的影响大于 20 磅氯仿。


  影响特征化的关键在于使用适当的特征化因子。对于一些影响类别，如全球变暖和臭氧损耗，已就可接受的特征化因子达成共识。对于其他影响类别，如资源耗竭，共识仍在形成中。表
  6.1 包括了一些常用生命周期影响类别的可能特征化因子的描述。经过适当引用的 LCIA 将记录每个特征化因子的来源，以确保其与研究的 goal 和 scope
  相关。例如，许多基于欧洲研究制定的特征化因子，除非能验证其适用于美国条件，否则不能应用于美国数据。


  ### 第 4 步：归一化


  归一化是 LCIA 的一种工具，用于以可在影响类别之间进行比较的方式表达影响指标数据。在此过程中，指标结果除以为此目的选择的参考值。参考值可从众多方法中选择。


  以下为代表性方法：


  - 某一特定区域的总排放量或资源使用量，该区域可能为全球、区域或地方。

  - 某一特定区域的人均总排放量或资源使用量。

  - 一个替代方案与另一个替代方案的比率（即基线）。

  - 所有选项中的最高值。


  LCA 的 goal 和 scope 可能会影响适当参考值的选择。请注意，归一化后的数据只能在同一影响类别内进行比较。例如，酸化的影响不能直接与水生毒性进行比较，因为特征化因子是使用不同的科学方法计算的。


  ### 第 5 步：分组


  分组将影响类别划分为一个或多个集合，以促进将结果解释为特定关注领域。通常分组涉及对指标进行排序或排名。ISO（1998a）列出了两种可能的 LCIA 数据分组方式：


  - 1) 按排放物（如空气和水排放物）或位置（如地方、区域或全球）等特征对指标进行排序

  - 2) 按价值选择进行排序的指标排序系统，例如高、低或中等优先级。


  ### 第 6 步：加权


  加权（也称为估值）根据其 perceived 重要性或相关性为不同影响类别分配相对价值。


  加权很重要，因为影响类别还应反映研究目标和利益相关者价值观。但由于加权不是科学过程，其方法必须清楚地解释和记录。加权阶段是影响评估步骤中最不成熟的阶段，也是最有可能因
  integrity 而受到质疑的阶段。


  总体而言，加权包括以下活动：


  - 识别利益相关者的潜在价值观

  - 确定对影响的权重

  - 将权重应用于影响指标


  除非加权程序有明确记录，否则加权数据不应跨影响类别合并。未加权数据应与加权结果一起显示，以确保对所分配权重的清晰理解。


  在某些情况下，影响评估结果非常明确，可以在不进行加权步骤的情况下做出决策。例如，当最佳表现的替代方案在至少一个影响类别中显著且有意义地优于其他方案，并且在剩余影响类别中与替代方案相等时，则一个替代方案明显更好。


  加权存在若干挑战。第一个问题是主观性。根据 ISO 14042，任何优越性判断都是对一个影响类别相对于另一个影响类别相对重要性的主观陈述（ISO 1998a）。此外，这些价值判断可能会随地点或季节而变化。例如，洛杉矶的居民可能比怀俄明州谢延的人更重视光化学烟雾的数值。


  第二个问题源于第一个问题：鉴于加权的客观性，用户应如何公平、一致地基于环境优越性做出决策？试图制定真正客观（或普遍可接受）的权重或加权方法集是不可行的。然而，确实存在几种加权方法，并且在决策中被成功使用。


  ### 第 7 步：评估和记录 LCIA 结果


  现在每个选定影响类别的影响潜势已计算完毕，必须验证结果的准确性。LCIA 结果的记录包括彻底描述分析中使用的 methodology，定义所分析的系统和设定的边界，并列出库存分析所依据的所有假设。


  LCIA 与所有其他评估工具一样，具有固有的局限性，包括以下内容：


  - 空间分辨率不足（例如，在小溪中释放 4000 加仑氨比在大河中更糟）

  - 时间分辨率不足（例如，在一个月内释放 5 T 颗粒物比全年分散释放更糟）

  - 库存规范（例如，“VOC”或“金属”等宽泛的库存清单无法提供准确评估环境影响所需的信息）

  - 阈值和非阈值影响（例如，10T 污染并不一定比 1T 污染糟 10 倍）


  选择更复杂或更具 site-specific 的影响模型可以帮助减少影响评估准确性的局限性。必须记录这些局限性，并将 LCIA 方法的全面描述以及影响模型中潜在假设、价值选择和已知不确定性的讨论与
  LCIA 的数值结果一起提供，以便用于解释 LCA 的结果。


  ## 6.2.6 生命周期解释


  生命周期解释是一种系统技术，用于识别、量化、检查和评估 LCI 和 LCIA 结果的信息，并有效传达它们。生命周期解释是 LCA 过程的最后阶段。ISO 已定义了生命周期解释的以下目标：


  - 1) 分析结果、得出结论、解释局限性，并根据 LCA 前期阶段的发现提供建议，并以透明的方式报告生命周期解释的结果。

  - 2) 根据研究的 goal 和 scope（ISO 1998b），提供对 LCA 研究结果易于理解、完整且一致的表述。


  并非总是可以用 LCA 作为开始的依据，因为一个替代方案优于其他方案。这并不意味着工作白费了。尽管最终结果存在不确定性，LCA 过程仍为决策者提供了对每个替代方案相关的环境和健康影响、它们发生的位置（地方、区域或全球）以及可归因于所调查的每个拟议替代方案的每种类型影响的相对大小的更好理解。这些信息更充分地揭示了替代方案的利弊。


  进行 LCA 的目的是通过提供一种特定类型的信息（通常未被考虑），以生命周期视角为决策者提供有关每个产品或工艺相关的环境和人类健康影响的更好信息。然而，LCA
  并未考虑技术性能、成本或政治和社会



  可接受性。因此，建议将LCA与这些其他参数结合使用。


  ## 6.2.6.1 解读LCA结果的关键步骤


  到目前为止提供的指导总结了ISO草案标准《环境管理——生命周期评估——生命周期解读》（ISO 1998b）中关于生命周期解读的信息。该ISO草案标准涵盖了进行生命周期解读的以下步骤：


  - 1) 识别重大问题

  - 2) 评估数据的完整性、敏感性和一致性

  - 3) 得出结论和建议


  图6.5 展示了生命周期解读过程的步骤与LCA过程其他阶段的关系。


  ### 第一步：识别重大问题


  重大“问题”是指对每个产品、过程或服务的LCI和LCIA结果贡献最大的数据要素。例如：


  - 清单参数（如能源使用、排放、废弃物）

  - 影响类别指标（如资源使用、排放、废弃物）

  - 对LCI或LCIA结果有重要贡献的生命周期阶段，如单个单元过程或过程组（如运输、能源生产）


  当识别出这些问题后，结果将用于评估LCA研究的完整性、敏感性和一致性（第二步）。重大问题的识别为评估步骤提供指导。


  在确定LCI和LCIA的哪些部分对每个备选方案的结果影响最大之前，应全面审查LCA的先前阶段（例如研究目标、基本规则、影响类别权重、结果和外部参与等）。


  对所收集信息以及形成的结果展示进行审查，可以判断LCA研究的目标和范围是否已达成。如果已达成，则可以确定结果的显著性。有几种分析方法可用。


  - 贡献分析——将生命周期阶段或过程组的贡献与总结果进行比较，并检验其相关性。

  - 优势分析——使用统计工具或其他技术（如定量或定性排序，例如ABC分析）来识别需要检验相关性的重大贡献。

  - 异常评估——根据以往经验，观察与预期或正常结果的异常或惊人偏差，并检验其相关性。


  ### 第二步：评估数据的完整性、敏感性和一致性


  解读阶段的评估步骤确立了LCA结果的置信度和可靠性。通过执行完整性、敏感性和一致性检查，确保产品/过程得到公平比较。


  生命周期评估框架


  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_298_0.png)


  图6.5 解读步骤与LCA其他阶段的关系（ISO 1998b）。


  *完整性检查*——完整性检查确保解读所需的所有相关信息与数据都可用且完整。应制定一个核对表，以标明结果中涉及的每个重要领域。使用已建立的核对表，可以验证构成结果各领域的数据是否与系统边界一致（例如是否包含所有生命周期阶段），以及数据是否具有指定领域的代表性（例如占所有原材料和环境排放的90%）。


  这一工作的结果将是一份核对表，表明每个产品/过程的结果都是完整的，并反映了LCA研究所陈述的目标和范围。如果发现不足之处，必须设法加以纠正。如果由于数据不可用而无法纠正，则必须在最终结果中突出显示因数据不足而描述不充分的领域，并定量（百分比不确定性）或定性（备选方案A的汇报结果可能更高，因为其评估中未包含“X”）估计这些领域对比较的影响。


  *敏感性检查*——敏感性检查的目的是通过确定第一步中识别的重大问题的不确定性是否影响决策者自信地得出比较结论的能力，来评估结果的可靠性。执行敏感性检查时可使用三种常用的数据分析技术。


  - 1. 重力分析——识别对影响指标结果贡献最大的数据。

  - 2. 不确定性分析——描述LCA数据的变异性，以确定影响指标结果的显著性。

  - 3. 敏感性分析——衡量LCI结果和特征化模型的变化对影响指标结果的影响程度。


  关于如何进行重力分析、不确定性分析或敏感性分析的进一步指导，可参见EPA文件《生命周期清单分析质量评估指南》（USEPA 1995）。如果这些分析中的某一种已在LCI和LCIA阶段作为一部分进行，则可以使用其结果。然后，敏感性检查将用于验证研究早期定义的数据质量和准确性目标是否已达成。如果存在不足，则需要额外努力来提高所收集的LCI数据和/或LCIA中所用影响模型的准确性。如果无法获得更好的数据或影响模型，则必须报告每个相关重大问题的不足，并像完整性检查一样，定量或定性估计其对比较的影响。


  *一致性检查*——一致性检查确定整个LCA过程中使用的假设、方法和数据是否与研究的目标和范围以及所评估的每个产品/过程一致。在结论中验证并记录研究已按预期完成，可以增强最终结果的置信度。应制定正式的核对表来传达一致性检查的结果。表6.2列出了七个类别，并提供了可能渗入数据的不一致示例。LCA的目标和范围决定了应使用哪些类别。


  如果在完成第一步和第二步后，确定影响评估结果和基础清单数据完整、可比，并且可作为得出结论和提出建议的基础，那么就可以到此为止！如果检测到任何不一致之处，请记录其在整体一致性评估中的作用。虽然某些不一致可能是可接受的，具体取决于LCA的目标和范围，但不一致的存在通常意味着有必要重复第一步和第二步，直到结果能够支持进行LCA的原始目标。


  **表6.2** 核对表类别和潜在不一致的示例。


  | 类别 | 不一致示例 |

  |---|---|

  | 数据来源 | 备选方案A基于文献数据，备选方案B基于实测数据。 |

  | 数据准确性 | 对于备选方案A，使用详细的工艺流程图来编制LCI数据。对于备选方案B，可用的过程信息有限，所编制的LCI数据针对的是未详细描述或分析的过程。
  |

  | 数据年代 | 备选方案A使用1980年代的原材料制造数据。备选方案B使用一项一年前的研究。 |

  | 技术代表性 | 备选方案A是实验室规模的模型。备选方案B是全面生产工厂的运营。 |

  | 时间代表性 | 备选方案A的数据描述的是最近开发的技术。备选方案B描述的是技术组合，包括新建工厂和旧工厂。 |

  | 地理代表性 | 备选方案A的数据来自欧洲环境标准下采用的技术。备选方案B使用美国环境标准下采用的技术数据。 |

  | 系统边界、假设和模型 | 备选方案A使用基于500年潜势的全球变暖潜势模型。备选方案B使用基于100年潜势的全球变暖潜势模型。 |





  ## 第 3 步：得出结论和建议


  本步骤的目标是对 LCIA 的结果（而非 LCI）进行解释，以确定哪种产品/工艺对人类健康和环境，或对研究目标和范围所定义的一个或多个特定关注领域的影响总体最小。根据
  LCA 的范围，影响评估的结果将返回每个影响类别下每个替代方案的未归一化且未加权的影响指标列表，或每个替代方案的单个分组、归一化且加权后的评分。在后一种情况下，建议可能只是接受得分最低的产品/工艺。然而，分析所依据的假设应牢记在心。如果
  LCIA 止步于特征化阶段，则 LCIA 的解释就不那么明确。结论和建议取决于在研究目标和利益相关者关切的背景下权衡潜在的人类健康和环境影响。


  必须理解并传达产生最终建议的程序中的不确定性和局限性。也许由于进行 LCA 所用方法的固有不确定性和局限性，没有一种产品或工艺比另一种更好。也许缺乏足够的好数据，或者时间或资源的限制阻止分析人员彻底探索问题的某些方面。即使如此，LCA
  的结果仍可用于帮助决策者了解人类健康和环境方面的利弊，并理解每种影响的显著性。此类 LCA 结果将揭示影响发生在本地、区域还是全球，并将提供每种影响类型相对于所调查的拟议替代方案的量级的大致估计。


  ### 6.2.6.2 报告结果


  完成 ACA 后，必须将材料汇编成一份全面报告，以清晰、有条理的方式记录研究。这将有助于公平、完整、准确地向对结果感兴趣的其他人传达评估结果。报告以足够的细节呈现结果、数据、方法、假设和局限性，以便读者能够理解
  LCA 研究中固有的复杂性和权衡。


  如果结果将传达给未参与 LCA 研究的各方（例如利益相关者），该报告将作为参考文件，并有助于防止结果被歪曲。


  ### 6.2.6.3 结论


  将 LCA 添加到决策过程中，为负责选择产品或工艺的人员提供了传统上无法获得的人类健康和环境影响的理解水平。这些宝贵的信息提供了一种方法来核算决策的全部影响，尤其是那些在场外做出的、直接受产品或工艺选择影响的决策。如前所述，LCA
  是一种更好地为决策者提供信息的工具，必须权衡成本和性能等其他决策标准才能做出平衡的决策。


  正如我们所见，LCA 和 LCI 可以成为环境分析中的有价值工具。要理解任何此类研究中收集的众多大型数据集，显然是一项过于复杂的任务，无法在没有计算机帮助的情况下进行。第
  6.3 节描述了一些为此目的而开发的软件工具。



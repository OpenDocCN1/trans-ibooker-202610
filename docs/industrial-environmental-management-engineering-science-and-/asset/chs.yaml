  1973；Kozloff 1974）。


  ### 实验室生物测定结果


  几项研究（Dondoroff and Katz 1950；Merkens 1958；Thatcher 1977）表明，鲑科鱼类是最敏感的鱼类。实验室生物测定支持这一概括。0.006
  mg/l 的残留氯浓度在 2 天内对鳟鱼稚鱼是致命的，而虹鳟的 7 天耐受中值极限，或 TL50，为 0.08 mg/l，在 0.004 mg/l 时估计的中位存活期为
  1 年（Merkens 1958）。在海水中，粉红鲑和银鲑在 23 天内最大无害残留氯浓度为 0.05 mg/l（Holland 1960）。虹鳟在 0.01
  mg/l 下 12 天死亡，并在 0.001 mg/l 下避开（Sprague and Drury 1969）。溪鳟在 0.35 mg/l 下平均存活时间为 9
  小时，在 0.08 mg/l 下为 18 小时，在 0.04 mg/l 下为 48 小时。在 0.01 mg/l 下 4 天后死亡率为 67%（Dandy 1967,
  1972）。在 10.5 小时内，50% 的棕鳟在 0.02 mg/l 下死亡，在 0.01 mg/l 下在 43.5 小时内死亡（Pike 1971）。鳟鱼、鲑鱼和一些鱼类食物生物比暖水鱼、蜗牛和
  crayfish 更敏感（表 6.9 和 6.10）。


  ## 6.5.4 紫外线消毒工艺


  紫外线消毒系统将汞弧灯的电磁能量传递到生物的遗传物质，即含有 DNA 和 RNA 的染色体。当紫外线辐射穿透生物的细胞壁时，会破坏细胞繁殖的能力。在消毒过程中，由汞蒸气放电产生的紫外线辐射穿透微生物的遗传物质并引起分子重排，从而减缓其繁殖能力。Das
  对杀菌作用的机制、紫外线的工作原理、紫外线损伤 DNA 的修复以及废水水质参数对消毒效率的影响进行了详细综述（Das 2004）。



  利用气化黑液生产氢气也已被研究。Andersson和Harvey（2004）评估了在化学纸浆厂中集成化利用黑液气化（BLG）生产氢气的能耗和净二氧化碳排放后果。该纸浆厂的基础产能为每天2000风干吨（ADt）纸浆。在参考KAM纸浆厂生产氢气需要进口21万吨生物质用于蒸汽生产和0.43太瓦时/年的电力。如果瑞典所有纸浆厂的黑液都被气化来生产氢气，则预计生物质进口量为4.9太瓦时/年，电力进口量为2.3太瓦时/年。结果表明氢气生产潜力巨大，即每天可生产188吨氢燃料，相当于261兆瓦[低热值（LHV），120兆焦/千克]（KAM报告2003）。


  Larson等人（2006a，b）对美国硫酸盐浆厂将BLG用于液体燃料生产与BLGCC用于发电进行了“从油井到车轮”（WTW）比较环境评估。在美国引入BLGCC系统，有可能在25年内净减少多达3500万吨CO₂、1.6万吨SO₂和10万吨NOx（Naqvi等2010）。





  (600°C, 300 bar)。催化水热气化过程涉及三个步骤：


  - 1) *Heat up phase*（分解单元）：在此阶段，由于木质素的存在，黑液中的大分子水解形成醇。木质素中的纤维素在约 250°C 时在水中迅速分解。

  - 2) *Salt separation*：在盐分离器中，黑液中存在的无机盐沉淀并返回造纸厂。

  - 3) *Catalytic reactor*：这是实际的甲烷合成单元，其中较小的有机分子，如羧酸、醇和醛，被转化为 CH₄、CO₂、H₂ 和 CO。


  羧酸被转化为甲烷、二氧化碳和氢。由于超临界条件和催化剂的存在，焦油形成被避免。


  Sricharoenchaikul（2009）研究了超临界水氧化技术将黑液转化为增值燃料产品并回收制浆化学品的可行性。实验是在基于重要操作参数的流化床反应器中加热的石英毛细管中进行的，这些参数为压力、温度、进料浓度和反应时间。研究人员发现，220
  至 400 bar 之间的压力对合成气和碳转化的影响不显著。但将温度和停留时间提高到 375–650°C 和 5–120 秒，可实现高碳转化率、更高的合成气产量和更高的能源效率。


  ## 9.8.8 Fischer–Tropsch 液体


  商业 Fischer–Tropsch 催化剂包括铁基和钴基材料。钴催化剂产生大量重蜡馏分，可以通过随后的加氢裂化（在富氢环境中将大烃分子分解为所需最终产品的过程）以高选择性轻松精炼成所需的较轻产品。FT
  合成形成的长链直链烃的加氢裂化可以在比常规石油化工精炼中芳香分子加氢裂化所需的条件更温和的温度条件下进行（裂解至 C5–C18 范围烃为 350–400°C）。铁基催化剂产生更广的产品混合物，需要比钴催化剂更高的精炼水平。此外，与钴催化剂不同，铁催化剂促进水煤气变换活性（CO
  + H₂O → H₂ + CO₂），使其非常适合用于 H₂/CO 比低于 FT 合成化学计量值 2.2 的合成气。


  ## 9.8.9 混合醇


  与 FTL 或 DME 合成相比，甲基-、乙基-和丙醇混合醇（MA）合成技术的商业化程度明显较低，且缺乏可用于基于详细反应器性能估计的已发表文献。过去研究的催化剂可分为四类（Liu
  et al. 1997）：钌基催化剂、改性甲醇催化剂、改性 Fischer–Tropsch 催化剂和硫化钼基催化剂。其中，MoS₂ 基催化剂（最初由 1980
  年代 Dow 和 Union Carbide 的研究人员发现）因其对含硫合成气的高耐受性、水煤气变换活性以及对线性醇的高活性和选择性而受到近期大量关注。选择性是一个特别重要的特性，因为如果允许
  CO 和 H₂ 之间所有可能的化学反应在没有限制的情况下竞争，合成更高醇以外的反应在热力学上将超过合成更高醇的反应。特别是，CO 和 H₂ 形成 Fischer–Tropsch
  烃（α-烯烃和正烷烃）在热力学上比形成更高醇更有利。因此，为了最大化醇合成催化剂的性能，高选择性是必不可少的特征。


  采用的更高醇简化反应方案如下：


  ```

  CO + H₂O ↔ CO₂ + H₂


  CO + 2H₂ ↔ CH₃OH


  CH₃OH + 2H₂ → C₂H₅OH + H₂O


  2CH₃OH + CO + 2H₂ → C₃H₇OH + 2H₂O

  ```


  ## 9.8.10 “WTW” 黑液气化环境影响


  除了前面讨论的生物炼制系统能源方面外，我们还研究了环境属性。水排放物、空气排放物和固体废物都可能成为关注点。在评估生物炼制系统相对于汤林森动力/回收系统所发现的水平对这些排放物的影响时，可以考虑直接排放物和电网电力生产以及常规石油基机动车燃料替代所相关排放物的变化。特别是，为了有效估计生物炼制的全部环境影响，当前分析涉及从资源开采到最终使用的排放影响估计。这种所谓的
  WTW 分析是比较不同替代和常规燃料的有意义比较的常用方法。这种方法之所以必要，是因为不同上游生产和转换过程、不同燃料的不同下游车辆/发动机类型以及燃料特性和燃烧特性的显著差异。


  由 BLG 工艺生产的生物燃料在 WTW 二氧化碳排放减少和能源效率方面表现出色。此外，由 BLG 路线生产的林业收获残留物合成柴油和 DME 也显示出最高的
  WTW 温室气体减排和能源效率。美国可用的黑液总量按该工艺的转化效率计算相当于每年约 50 亿加仑乙醇当量。可再生燃料标准要求到 2022 年生产 160 亿加仑纤维素生物燃料。因此，该路线可以为实现这一目标做出重大贡献。


  美国的造纸公司目前正面临海外低成本生产商以及包装和印刷媒体替代解决方案的激烈竞争。工厂运营商及其投资者现在选择将纸浆厂转变为使用林业燃料工艺的生物炼制厂。这种转变完全改变了纸浆厂的竞争地位，通过典型的
  25–40% 内部收益率增加 30–50% 的盈利收入。它还使必要的再投资成为可能，通过用高维护成本和低性能的老化回收锅炉替换来实现。燃料厂投资还可用于提供额外的回收能力，在许多情况下可提高纸浆产量。仅生产
  500 t BLS/天的工厂作为燃料-林业生物炼制厂是可行的，采用该方法。大多数工厂规模明显更大。这样的生物炼制厂在最低产能下每年可生产超过 800 万加仑绿色机动车燃料，按汽油当量计算。在投资第二代生物燃料技术的工厂中，就业不仅得以保留，而且还创造了额外的就业机会，主要是从森林中提取生物质以及运营和维护生物燃料厂。其他经济和社会效益也很重要，例如可能的税收优惠和空气排放减少（Bajpai
  2014）。


  使用林业燃料的生物炼制项目典型的资本投资为 2 亿至 4 亿美元，具体取决于工厂规模和与工厂互联的成本。BLG 行业正在积极寻求联邦和州的赠款和贷款担保，以尽快将该技术提升到大规模商业化能力。作为超清洁、可再生机动车燃料的来源，将纸浆和造纸厂转变为炼油厂的
  BLG 路线正经受作为生产替代、可再生能源的切实可行且实用方式的严格审查，同时合理利用土地并对环境温和（Bajpai 2014）。


  利用气化在 BLGCC 配置中而非汤林森锅炉的森林生物炼制厂预计会产生显著更少的污染物排放，这是由于 BLGCC 技术固有的特性。合成气净化调理去除大量污染物，燃气轮机燃烧比锅炉燃烧更高效、更完全。由化石能源资源制造的化学品和燃料的更清洁生产也可能导致污染物排放和危险废物减少。此外，一般认为，从生物质资源生产电力、燃料、化学品和其他产品产生的二氧化碳净生成量为零，因为植物是可再生的碳汇。森林生物炼制概念的一个关键组成部分是可持续林业。森林生物炼制概念利用先进技术将可持续木质生物质转化为电力和其他有价值的产品，并将支持森林土地的可持续管理（Farmer
  2005）。此外，森林生物炼制为可再生资源如木材疏伐和林业残留物以及城市废物提供了富有成效的增值用途（Mabbe et al. 2005; Miller et
  al. 2005）。


  无论是在高温还是低温下进行的 BLG，仍优于当前的回收锅炉燃烧技术（Bajpai 2008, 2012）。气化器的热效率估计为 74%，而现代回收锅炉为 64%，而集成气化和联合循环（IGCC）发电厂有可能产生相同数量的燃料（Dance
  2005; Farmer and Singlefield 2003）。而常规回收锅炉发电厂的电力生产比为 0.025–0.10 MW/tMWt，IGCC 发电厂可估计产生
  0.20–0.22 MW/tMWt（Farmer and Singlefield 2003; Sricharoenchakul 2001）。这种电力效率的提高足以使纸浆和造纸厂成为可再生电力的潜在出口商。或者，纸浆厂可以通过成为生物炼制厂来成为生物基产品的制造商。此外，新技术有可能每年节省超过
  100 万亿 Btu 的能源消耗，并在实施 25 年内可节省多达每年 360 万亿 Btu 的化石燃料能源（Larsen et al. 2003）。新技术还提供了改进纸浆产量的好处，如果包括替代制浆化学品，以及减少固体废物排放。此外，该工艺本质上更安全，因为气化器不像回收锅炉那样含有用于焦油熔融的床，从而降低了致命的熔渣-水爆炸风险（Argonne
  National Laboratory 2006; Sricharoenchaikul 2001）。





  ## 9.8.11 水和固体废物


  水质、水温和水消耗都是生物炼制厂的潜在关注点。随着对有限淡水资源需求的上升，这些问题很可能变得更加重要。简而言之，这些问题如下：


  - 水量：任何节水都会给造纸厂带来直接的财务效益，同时也能解决对其他用途淡水可用性日益增长的担忧（例如农业、人类消费）。

  - 水质：对于稀有和濒危物种、休闲活动以及对下游其他使用者（如市政）的影响而言，水质是主要关注点。

  - 热排放：冷却水排放的温度对其对动植物的影响也是关注点。


  根据配置（生产的燃料和电力量），生物炼制厂会对造纸厂的水量和热排放产生不同的影响，但总体而言，转向生物炼制厂预计不会显著影响水质，尤其是在考虑被取代电网电力的影响时（Larson
  et al. 2003）。此外，IGCC 发电厂将减少造纸厂的冷却水和补水排放，并且由于高效的气化炉会减少电网电力需求，发电厂的冷却水需求也将大幅减少（Larson
  et al. 2003）。总体而言，IGCC 发电厂的实施将导致冷却水需求净节约和废水排放净减少。另一个好处是避免了传统燃料生产中的用水，但尚未量化。此外，石油和石油产品运输泄漏的后果也减少了。此外，一些生物燃料，尤其是
  DME 和 MA，在燃料泄漏或溢出时（例如在加油站）对地下水污染的风险要低得多。FT 液体由于芳香烃含量极低，也应比传统柴油和汽油的风险更低。


  固体废物问题与必须处置的固体的数量和毒性有关。在这方面，预计生物炼制厂不会在造纸厂造成显著变化，部分原因是产生的固体（主要是生物质灰）处理起来并不成问题。需要定期更换催化剂和保护床，例如氧化锌（用于
  H₂S）和活性炭（用于其他痕量污染物）。尽管如此，与用水情况一样，被取代电网电力（特别是该电网电力中的煤炭部分）和传统运输燃料使用的影响很可能导致固体废物产生量大幅减少（Larson
  et al. 2003）。


  ## 9.8.12 与造纸厂相关的空气排放


  生物炼制厂与汤林森系统之间最显著的排放差异预计出现在空气排放方面。在 WTW 情况下尤其如此。如下面所述，生物炼制厂和汤林森动力/回收系统的空气排放已进行了详细估算。为了比较，我们还展示了之前研究中的
  BLGCC 案例，并采用了与当前分析一致的更新假设（例如电网电力排放）。现代汤林森系统的实际空气排放数据是可用的。由于 BLGCC 或生物炼制厂系统不存在排放数据，因此估算以煤炭
  IGCC 和天然气联合循环动力系统的数据为起点并进行适当调整。需要注意的是，相对于 BLGCC 配置，生物炼制厂的空气排放源预计相似，即动力岛。生物燃料本身的生产并不会在生物炼制厂产生显著的额外空气排放源。


  下面提出的空气排放分析并非旨在作为生物炼制厂排放的完整生命周期分析。相反，这些估算提供了生物炼制厂选项相对于造纸业“照常营业”的潜在影响的指示性结果。例如，未包含电网电力的上游排放（即燃料生产和运输到发电厂），但这些排放与发电厂本身的排放以及传统机动车燃料链的总排放相比相对较小。在大多数生物炼制厂配置产生的被取代电网电力多于汤林森案例的程度上，本研究估算的排放效益可以被认为是保守的，因为它们没有同时考虑与发电厂燃料供应相关的排放减少。


  空气排放可分为三类：标准污染物、危险空气污染物（HAPs）和温室气体。本研究对标准污染物进行了定量估算：二氧化硫（SO₂）、氮氧化物（NOₓ）、一氧化碳（CO）、挥发性有机化合物（VOC）、PM
  和总还原硫（TRS）。还对主要的温室气体二氧化碳（CO₂）进行了估算。HAPs 和其他排放问题进行了定性讨论。


  ## 9.8.13 汤林森锅炉空气排放


  现代汤林森锅炉的特征是标准污染物排放总体上与电网电力相似（有些更高，如 CO 和 PM，而有些更低，如 SO₂ 和 NOₓ）。就环境影响和汤林森锅炉的相对排放率而言，最重要的污染物是
  NOₓ 和颗粒物。虽然许多炉子已安装颗粒物控制装置，但没有有效的 NOₓ 后处理形式。炉子重建和更换会触发新源审查（NSR）流程，通常会导致采取工艺修改以减少
  TRS 排放。安装更高效的颗粒物控制装置在 NSR 后也很常见，通常现代炉子的设计和控制比旧炉子更好，从而导致总体排放更低。表 9.8 提供了不同造纸厂排放的相对环境影响的定性分析，以及受控和不受控汤林森炉和生物炼制厂技术的相对排放率（Argonne
  National Laboratory 2006；USEPA 2002）。


  术语、能源和其他源自生物质的产品。在全国范围内，这些影响可能很小，但在某些地区或州（尤其是东南、美国上中西部），影响可能非常显著。然而，如果生物炼制厂有助于催化一个更大、新的生物能源产业，经济影响在国家层面也会更[content]


  ## 9.8.11 水和固体废物


  水质、水温和水消耗都是生物炼制厂的潜在关注点。随着对有限淡水资源需求的上升，这些问题很可能变得更加重要。简而言之，这些问题如下：


  - 水量：任何节水都会给造纸厂带来直接的财务效益，同时也能解决对其他用途淡水可用性日益增长的担忧（例如农业、人类消费）。

  - 水质：对于稀有和濒危物种、休闲活动以及对下游其他使用者（如市政）的影响而言，水质是主要关注点。

  - 热排放：冷却水排放的温度对其对动植物的影响也是关注点。


  根据配置（生产的燃料和电力量），生物炼制厂会对造纸厂的水量和热排放产生不同的影响，但总体而言，转向生物炼制厂预计不会显著影响水质，尤其是在考虑被取代电网电力的影响时（Larson
  et al. 2003）。此外，IGCC 发电厂将减少造纸厂的冷却水和补水排放，并且由于高效的气化炉会减少电网电力需求，发电厂的冷却水需求也将大幅减少（Larson
  et al. 2003）。总体而言，IGCC 发电厂的实施将导致冷却水需求净节约和废水排放净减少。另一个好处是避免了传统燃料生产中的用水，但尚未量化。此外，石油和石油产品运输泄漏的后果也减少了。此外，一些生物燃料，尤其是
  DME 和 MA，在燃料泄漏或溢出时（例如在加油站）对地下水污染的风险要低得多。FT 液体由于芳香烃含量极低，也应比传统柴油和汽油的风险更低。


  固体废物问题与必须处置的固体的数量和毒性有关。在这方面，预计生物炼制厂不会在造纸厂造成显著变化，部分原因是产生的固体（主要是生物质灰）处理起来并不成问题。需要定期更换催化剂和保护床，例如氧化锌（用于
  H₂S）和活性炭（用于其他痕量污染物）。尽管如此，与用水情况一样，被取代电网电力（特别是该电网电力中的煤炭部分）和传统运输燃料使用的影响很可能导致固体废物产生量大幅减少（Larson
  et al. 2003）。



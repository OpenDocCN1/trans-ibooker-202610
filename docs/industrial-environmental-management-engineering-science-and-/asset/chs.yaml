  在考虑这些数据时，应牢记，氯废物在河流中的毒性并不取决于加入的氯量，而取决于溶解液中残留的氯浓度（Merkens 1958）。这种残留氯的毒性将取决于其组成（即游离氯和氯胺的相对比例）。确定该比例，其本身取决于至少五个其他变量，这是一个复杂的工作。尽管游离氯比氯胺更具毒性，但自

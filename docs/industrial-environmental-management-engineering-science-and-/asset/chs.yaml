  |---|---:|---:|---:|\n| 3 | 1.023 | 0 | 2.575 |\n| 4 | 0.729 | 0 | 2.282 |\n| 5\
  \ | 0.577 | 0 | 2.114 |\n| 6 | 0.483 | 0 | 2.004 |\n| 7 | 0.419 | 0.076 | 1.924\
  \ |\n| 8 | 0.373 | 0.136 | 1.864 |\n| 9 | 0.337 | 0.184 | 1.816 |\n| 10 | 0.308\
  \ | 0.223 | 1.777 |\n\n在步骤 2 中，我们计算样本平均值的总均值。\n\n```\nx̄ = (2.008 + 1.998 + … +\
  \ 1.999) / (8) = 2.000\n```\n\n在步骤 3 中，计算 R̄ 的均值。\n\n```\nR̄ = (0.027 + 0.011 +\
  \ … + 0.018) / (8) = 0.0175\n```\n\n在步骤 4 中，基于表 8.1 中的因子确定 LCL 和 UCL 的值。首先，使用公式\
  \ (8.6) 和 (8.7) 对 x̄ 图，\n\n```\nLCL = 2.000 − 0.729(0.0175) = 1.9872\nUCL = 2.000\
  \ + 0.729(0.0175) = 2.0128\n```\n\n对于 R 图，使用公式 (8.8) 和 (8.9)，\n\n```\nLCL = 0(0.0175)\
  \ = 0\nUCL = 2.282(0.0175) = 0.0399\n```\n\n两个控制图在图 8.7 中构建，样本数据已绘制在图表中。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_392_0.png)\n\
  \n**Figure 8.7** Control charts for Example 8.7.\n\n如果已知过程的均值和标准差，则计算 x̄ 图的中心线、UCL\
  \ 和 LCL 的另一种方法如下：\n\n```\nLCL = μ − 3σ / (√n)  (8.10)\nUCL = μ + 3σ / (√n)  (8.11)\n\
  ```\n\n其中 μ，过程均值；σ，过程的标准差；n，样本大小。公式 (8.10) 和 (8.11) 给出的 LCL 和 UCL 值在理论上与公式 (8.6)–(8.9)\
  \ 计算的值相同。然而，在首次为过程设置 x̄ 图时，感兴趣的过程变量的均值和标准差通常是未知的。因此，基于测量的 x̄ 和 R̄ 值的公式 (8.6)–(8.9)\
  \ 可以方便地用于计算控制图参数。控制限设置为公式 (8.6)–(8.9) 或公式 (8.10) 和 (8.11) 定义的值时，99.73% 的随机样本来自处于统计控制中的过程会落在控制限之内。\n\
  \n请注意，样本均值的标准差与总体标准差的关系为样本中单位数 n 的平方根的倒数，即\n\n```\nσₓ = σ / (√n)  (8.12)\n```\n\n\
  其中 σₓ 是样本均值的标准差，其他项如上所述定义。\n\n### 8.4.3 PC Analysis\n\n通常需要获得有关 PC 分析的一些信息——即过程在受控状态下运行时的性能。PC\
  \ 也是一个数学计算，用于确定制造过程（过程的声音）与工程规范的比较。目的是使工程规范与使用我们生产的产品和服务的客户的迫切需求和愿望相匹配（客户的声音）。多年来已开发出几种不同的计算方法，其中最流行的是\
  \ PC 比率（Cₚ）。Cₚ 可以表示为如下定义的指数：\n\n```\nCₚ = (USL − LSL) / 6σ  (8.13)\n```\n\nCₚ 的分子是规范的宽度。过程均值两侧的三个西格玛限有时称为自然公差限，因为这些代表了受控过程应满足的大多数生产单元的限值。因此，六西格玛通常被称为过程的宽度。Cₚ\
  \ 是过程潜能计算。Cₚ 将工程规范限作为分子，将制造过程在六个标准差上的分布作为分母。如果在制造过程中使用可变过程行为图，则可以使用极差值来估计六个标准差值，并且工程图纸将包含制造应遵循的规范。Cₚ\
  \ 的数值永远不会为负。Cₚ = 1.0 的值表示六个标准差计算的尾部与工程规范宽度相遇。\n\n### 8.5 Lean Manufacturing\n\n\
  精益制造或精益生产，通常简称为精益，其起源于二战后日本的时代。它由丰田生产主管大野耐一开发，以应对困扰日本工业的一系列问题。主要问题是为满足日本国内市场而需要的高品种生产。亨利·福特为经济地生产大量相同产品而开发的大规模生产技术，不适合丰田所面临的情况。丰田在\
  \ 1940 年代末面临的这些条件在整个行业中都很常见，精益正被世界各地的企业采用，以提高效率并更好地服务客户。\n\n精益方法（术语 *Lean* 最早由麻省理工学院的研究人员约翰·F·克拉夫契克\
  \ [1988] 在 1980 年代末首次提出）系统地最小化价值流中的浪费——称为 *muda*。克拉夫契克的研究由麻省理工学院国际汽车车辆项目继续，该项目产生了由沃马克、琼斯和罗斯合著的国际畅销书\
  \ *The Machine That Changed the World*（1990）。\n\n*Muda* 包括所有类型的缺陷工作，而不仅仅是缺陷产品。浪费的时间、动作和材料都是\
  \ *muda*。大野（1988）确定了企业中以下类型的 *muda*：\n\n- 1) 缺陷\n- 2) 过度生产\n- 3) 库存（在制品或产成品）\n-\
  \ 4) 不必要的加工\n- 5) 人员不必要的移动\n- 6) 货物不必要的运输\n- 7) 等待\n\n沃马克和琼斯（2003）增加了另一种类型的 *muda*：\n\
  \n- 8) 设计不符合客户需求的商品和服务。\n\n“精益思维”就是向 *muda* 宣战。它是关注 *muda* 的对立面价值。定义价值意味着回答以下问题：\n\
  \n- 客户愿意为哪些东西付费？\n- 这些价值是通过什么过程创造的？\n- 过程中的每个活动如何帮助满足客户的愿望和需求？\n- 我们如何使价值创造过程流动得更高效？\n\
  - 我们如何确保我们只生产所需的东西，在需要时生产？\n- 我们如何做到完美地创造价值？\n\n精益对这些问题的回答可以归为五类：价值、价值流、流动、拉动和完美。\n\
  \n### 8.5.1 Overview\n\n对于许多人来说，精益是 *协助识别和持续消除浪费的“工具”集合*。随着浪费的消除，质量提高，而生产时间和成本降低。精益制造的第二种方法是由丰田推广的，称为丰田生产系统（TPS），其中重点是改善工作的“流动”或顺畅性，从而通过系统持续消除\
  \ *mura*（“不均匀性”），而不是专门针对“浪费减少”。改善流动的技术包括生产均衡、“拉动”生产（通过 *kanban*）和 *Heijunka box*。这与大多数改进方法学有根本不同，并且需要比基本应用工具更多的坚持，这可能部分解释了其缺乏普及性（Liker\
  \ 和 Hoseus 2008）。这两种方法之间的区别不在于目标本身，而在于实现它的主要方法。平滑流动的实现暴露了已经存在的质量问题，因此浪费减少自然成为其后果。声称这种方法的优势在于它自然采取系统范围的视角，而浪费重点有时错误地假设了这一视角。\n\
  \n精益和 TPS 都可以被视为一组密切相关且可能相互竞争的原则，其目标是通过消除浪费来降低成本（大野 1988）。这些原则包括拉动加工、首次合格质量、浪费最小化、持续改进、灵活性、与供应商建立和维护长期关系、自主自动化（智能自动化）、负荷均衡和生产流动，以及目视控制。某些原则的脱节性质或许源于\
  \ TPS 自 1948 年以来根据其在自身生产设施中看到的问题而务实成长的事实。因此，今天看到的是“需求”驱动的学习改进的结果，每一步都建立在先前的想法之上，而不是基于理论框架。\n\
  \n丰田的观点是，精益的主要方法不是工具，而是减少三种类型的浪费：*muda*（不增值工作）、*muri*（过载）和 *mura*（不均匀性），以系统地暴露问题并在理想无法实现时使用工具。从这个角度来看，工具是适应不同情况的工作方案，这解释了上述原则的任何明显不一致（大野\
  \ 1988）。\n\n也被称为柔性大规模生产，TPS 有两个支柱概念：*准时制*（JIT）或“流动”，和“自主自动化”（大野 1988）。丰田方法的支持者会说，价值的顺畅流动会作为副作用实现所有其他改进。如果生产完美流动（意味着它既是“拉动”且没有中断），则没有库存；如果只生产客户重视的功能，则产品设计简化，并且只在客户重视的功能上花费精力。TPS\
  \ 的另外一个支柱是自动化的非常人性化的方面，即自动化以人为本。在这种情况下，“人性化”意味着自动化设计以帮助人类专注于人类最擅长的事情（大野 1988）。\n\
  \n精益实施强调通过战略运营程序优化工作流程的重要性，同时最小化浪费并保持适应性。需要灵活性以允许使用诸如 *研究与开发*（R&D）等工具进行生产均衡（*Heijunka*）。然而，适应性通常受到限制，因此可能不需要大量投资。更重要的是，所有这些概念都必须为开发产品并启动交付价值的过程的员工所认可。精益的文化和管理方面可能比生产本身的实际工具或方法论更重要。存在许多精益工具实施但没有持续收益的例子，这些例子通常归咎于整个组织对精益的理解薄弱。\n\
  \n精益旨在通过简化运营结构以便理解、执行和管理工作环境来提高生产率。为了同时实现这三个目标，可以使用丰田的一种指导方法（松散地称为 *Senpai* 和 *Kohai*，日语中意为资深和初级）来从下而上在整个组织结构中培养精益思维。最接近丰田指导过程的概念是\
  \ *Lean Sensei* 的概念，它鼓励公司、组织和团队寻求可以提供建议和指导的第三方专家（沃马克和琼斯 2003）。斯皮尔和鲍恩（1999）确定了四个特征“丰田\
  \ DNA”的规则：\n\n\n- 1) 所有工作都应明确具体地规定内容、顺序、时间和结果。\n- 2) 每个客户-供应商连接都必须是直接的，并且必须有一种明确的“是”或“否”的方式来发送请求和接收响应。\n\
  - 3) 每种产品和服务的路径都必须是简单直接的。\n- 4) 任何改进都必须按照科学方法，在教师的指导下，在组织中尽可能低的层级进行。\n\n## 8.5.2\
  \ 历史：二十世纪前\n\n### 8.5.2.1 本杰明·富兰克林\n\n本杰明·富兰克林（图8.8）对减少浪费的思想做出了巨大贡献。精益制造和减少浪费的大部分基本目标都源于本杰明·富兰克林，并有文献记载的实例为证。《穷理查年鉴》谈到浪费时间时说：“一个人无所事事地损失了价值5先令的时间，就是损失了5先令，还不如明智地把5先令扔进河里。”他补充说，避免不必要的开支可能比增加销售额更有利可图：“省下一便士，净赚两便士。一天省一针，一年省一克朗。省则有所。”\n\
  \n富兰克林在《致富之路》中再次谈到了持有不必要库存的问题。“你们称这些为商品；但是，如果你们不小心，它们对你们中的某些人来说将变成祸害。你们预期它们会便宜卖出去，也许它们可以以低于成本的价格被买走；但如果你们用不着它们，它们对你们来说必然很昂贵。记住穷理查的话：‘买你不需要的东西，不久之后你就得卖掉你的必需品。’他在另一处说：‘许多人因为买便宜货而破产。’”亨利·福特称富兰克林对自己包括准时制生产在内的商业实践产生了重大影响。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_394_0.png)\n\n图8.8 本杰明·富兰克林。来源：https://commons.wikimedia.org/wiki/File:Benjamin-Franklin-U.S.-$100-bill.jpg.\
  \ 公共领域。\n\n工作环境中浪费和能量的积累被动作效率专家弗兰克·吉尔布雷斯注意到，他目睹了泥瓦匠经常弯腰从地上捡砖的低效做法。引入一种无需弯腰的脚手架，将砖块运送到腰部高度，使泥瓦匠能以大约三倍的速度工作，并且花费的力气最少。\n\
  \n### 8.5.2.2 威廉·波音\n\n威廉·E·波音（图8.9）于1881年10月1日出生于密歇根州底特律。波音移居到华盛顿州霍奎厄姆的太平洋西北地区，购买了奥林匹克半岛太平洋（西）侧格雷斯港周围的大片林地，并投资了木材业务。他成功经营了这项事业，部分原因是通过新建的巴拿马运河将木材运往东海岸，积累了资金，这些资金后来被他用于一个非常\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_394_1.png)\n\n图8.9 威廉（比尔）·波音。来源：https://en.wikipedia.org/org/wiki/William_Boeing.\n\
  \n不同的行业。威廉·波音于1903年离开耶鲁大学，以抓住西北木材行业风险高、周期性波动但经济回报丰厚的机会。这段经历后来在航空业中对他大有裨益。\n\n1916年，波音与乔治·韦斯特维尔特合作创办了“B\
  \ & W”公司，并创立了太平洋航空产品公司。该公司的第一架飞机是波音1型（B & W水上飞机）。1917年4月8日美国加入第一次世界大战，一个多月后，波音将太平洋航空产品公司更名为波音飞机公司，并获得了美国海军50架飞机的订单。战争结束后，波音开始专注于商用飞机。他获得了提供航空邮件服务的合同，建立了成功的航空邮件运营业务，后来又发展为客运服务，最终演变为联合航空公司。\n\
  \n在他的指导下，一家小型飞机制造公司成长为拥有相关产业的大型企业。1934年，大萧条后的立法强制要求公司拆分，波音出售了他在波音飞机公司的权益，但他继续从事其他商业项目。\n\
  \n他成为美国最成功的纯种马饲养者之一。他从未失去对航空的兴趣，在第二次世界大战期间，他自愿担任该公司的顾问。他活到1956年，得以看到自己创办的公司进入喷气时代。\n\
  \n威廉·E·波音是一个注重隐私的人，一个有远见的人，一个完美主义者，也是一个坚持事实的人。他外间办公室的墙上挂着一块标语牌，上面写着：“2329 希波克拉底说过：1.\
  \ 除了事实，没有权威。2. 事实通过准确的观察获得。3. 推论只能基于事实。4. 经验证明了这些规则的真实性。”据他的儿子小威廉·波音说，波音读书又快又贪婪，并且记住所读的一切。他还是一个完美主义者。1916年，在参观杜瓦米什造船厂的飞机制造车间时，波音看到一组锯得不正确的云杉肋条。他把它们扫到地上，踩来踩去，直到它们断裂。一根磨损的副翼钢索让他说：“我宁愿关门停业，也不愿把这种工作成果交付出去。”\n\
  \n### 8.5.2.3 弗雷德里克·温斯洛·泰勒\n\n弗雷德里克·温斯洛·泰勒（图8.10），科学管理之父，引入了现在所谓的标准化和最佳实践部署。在《科学管理原理》（泰勒\
  \ 1911）中，泰勒说：“每当工人提出改进建议，管理层的政策都应对新方法进行仔细分析，如有必要，进行一系列实验，以准确确定新建议与旧标准的相对优劣。每当发现新方法明显优于旧方法时，就应采用它作为整个企业的标准。”\n\
  \n泰勒还明确警告，当效率改进减少了对新劳动力的需求时，不要削减计件工资（或暗示削减工资或解雇工人）：“……当一个工人由于更加努力工作并增加了产量，而使自己正在做的工作的每件价格被降低了两次或三次，他很可能会完全忽视雇主这边的立场，并充满一种坚决的决心：如果‘磨洋工’（混时间，只做被告知的事）能够阻止再被削减工资，就绝不再容忍。”\n\
  \n新乡重夫，单分钟换模（SMED）和防错法（poka-yoke）最著名的倡导者，将《科学管理原理》视为自己的灵感来源（新乡重夫 1987）。美国工业家在1910年代认识到廉价海外劳动力对美国工人构成的威胁，并明确提出了如今所谓的精益制造的目标作为应对措施。美国机械工程师学会前会长亨利·汤在弗雷德里克·温斯洛·泰勒的《车间管理》（1911）前言中写道：“我们理应为我国普遍存在的高工资水平感到自豪，并警惕他国更廉价劳动力的产品对此的任何干扰。”为了维持这种状况，加强我们对国内市场的控制，尤其是扩大我们在国外市场的机会（在那里我们必须与其他工业国家的产品竞争），我们应当欢迎并鼓励一切有助于提高我们生产流程效率的影响。\n\
  \n### 8.5.2.4 亨利·福特\n\n亨利·福特（图8.11）在发展大规模装配制造系统时，最初忽视了浪费积累的影响。查尔斯·巴克斯顿·戈因在1915年写道：“福特的成功震惊了全国，几乎震惊了整个世界，无论是资金、工业还是机械方面。它比大多数人认为可能的程度更高地展示了真正效率的那些看似矛盾的要求，即：质量不断提高，工人工资大幅增加，消费者成本一再降低。与此同时，还出现了一个绝对令人难以置信的产量扩大，不到十年就达到约一百倍，以及制造商获得巨大利润，这既是原因又是结果”（阿诺德和福罗特\
  \ 1915）。\n\n福特在《我的生活与工作》（福特和克劳瑟 1922）中，用一段话描述了浪费的全部概念：\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_396_0.png)\n\
  \n图8.11 亨利·福特。来源：https://simple.wikipedia.org/wiki/Henry_Ford. 公共领域。\n\n我相信，普通农民真正用于有效用途的能量只占他所消耗能量的5%左右。……不仅一切都靠手工完成，而且很少考虑合理的布局。一个干农活的农民会在一架摇摇晃晃的梯子上爬上爬下十几次。他会多年提水，也不愿装几段水管。当有额外工作时，他的全部想法就是雇更多人手。他把花钱改进视为一种开支……正是浪费的动作——浪费的精力——使得农产品价格高昂而利润微薄。\n\
  \n工作场所布局不当——现代改善（kaizen）的一个主要关注点——以及出于习惯而低效地做事——即使在现代工作场所中也是主要的浪费形式。\n\n福特还指出，物质浪费是多么容易被忽视。一位前雇员哈里·贝内特写道：“有一天，我和福特先生在一起，他在给D.T.\
  \ & I [铁路]道床压载的矿渣中发现了一些锈迹。这些矿渣是我们自己炉子里倒在那里的。‘你知道吗，’福特先生对我说，‘那些矿渣里有铁。’你让把矿渣倒在那里的吊车工人们把它分拣一下，然后送回工厂”（贝内特和马库斯\
  \ 1951）。\n\n换句话说，福特看到了锈迹，并意识到钢厂并没有回收所有的铁。\n\n然而，福特的早期成功并不可持续。正如詹姆斯·沃麦克和丹尼尔·琼斯在《精益思想》中所指出的，福特所取得的成就代表了一种“特殊情况”，而非稳健的精益解决方案（沃麦克和琼斯\
  \ 2003）。福特面临的主要挑战是，他的方法是为稳定环境而构建的，而不是为当今企业日益面临的动态条件而构建的（鲁法 2008）。尽管他僵化的自上而下控制使得将工作活动中的变异保持在极低水平成为可能，但他的方法对不确定、动态的商业条件反应不佳；对新产品创新的需求反应尤其糟糕。这一点从福特公司的急剧衰落中可以看出：公司最终被迫推出T型车的后继车型。\n\
  \n面向制造的设计（DFM）是一个源自福特的概念，它强调在《我的生活与工作》（福特和克劳瑟 1922）中标准化单个零件以及消除冗余部件的重要性。这种标准化是福特大规模生产概念的核心，而制造“公差”，即确保零件互换性的尺寸上下限，在制造业中得到了广泛应用。几十年后，著名的日本质量大师田口玄一证明了这种“球门柱”\n\
  \n测量方法是不充分的。他指出，能力的“损失”并不仅仅在超出这些容差后才开始，而是在任何偏离标称条件的条件下，都会按照田口损失函数所描述的那样增加。这成为20世纪80年代W·爱德华兹·戴明质量运动的重要组成部分，后来帮助深化了对关键关注领域的理解，例如在航空航天及其他行业中，缩短周期时间变异对提高制造质量和效率的作用。\n\
  \n尽管福特以其生产线而闻名，但人们往往没有认识到他为消除装配工的工作以使生产线成为可能而付出了多少努力。在使用生产线之前，福特的汽车部件在使用点由熟练工程师进行装配和整形，以确保它们能够正确连接。通过对部件制造实施非常严格的规格和质量标准，他几乎完全消除了这项工作，将制造工作量减少了60%到90%（豪恩谢尔，1984年）。然而，福特的大规模生产系统未能纳入“拉动生产”的概念，因此常常遭受过度生产的困扰。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_397_0.png)\n\n图8.12 丰田佐吉。*来源：* https://commons.\
  \ wikimedia.org/wiki/File:Sakichi_TOYODA.jpg。\n\n## 8.5.3 丰田开发TPS\n\n### 8.5.3.1\
  \ 丰田佐吉\n\n丰田对后来成为精益的思想的发展，可能始于20世纪初的丰田佐吉（图8.12），当时他在一家纺织厂工作，那里的织机在断线时会自动停止。这成为自动化和*自働化*的雏形。丰田与*JIT*的渊源可能始于1934年，当时它从纺织业转向生产第一辆汽车。丰田汽车公司的创始人丰田喜一郎指导了发动机铸造工作，并发现了制造过程中的许多问题。他决定必须通过对每个工艺阶段的深入研究来停止修复劣质产品。1936年，当丰田赢得与日本政府的第一份卡车合同时，他处理了新的问题，并组建了“改善”团队。\n\
  \n战后日本经济中的需求水平较低，因此通过规模经济实现单位最低成本的大规模生产重点几乎无用武之地。在参观并看到美国的超市后，大野耐一（1988年）认识到，工作的调度不应由销售或生产目标驱动，而应由实际销售驱动。鉴于这一时期的财务状况，必须避免过度生产，因此拉动（按订单生产而非目标驱动的推动）的概念开始支撑生产调度。\n\
  \n在丰田，正是大野耐一将这些主题汇集在一起。他在已有的内部思想流派基础上进行了发展，并将其广度和应用扩展为如今所谓的*丰田生产系统*（TPS）。精益生产主要源于TPS（在20世纪80年代被广泛称为*JIT制造*），但现在也包含了许多其他来源，并不断发展。\n\
  \n诺曼·博德克在为福特《今天与明天》重印本所写的前言中写道：\n\n丰田于1980年首次接触到JIT和TPS的概念。随后，丰田（贵司）先生在我们多次赴日学习考察中有机会目睹了其在丰田的实际应用。在那里，我见到了该系统的创建者大野耐一先生。当被我们团队问及是什么启发了他的思考时，他只是笑着说，他这一切都是从亨利·福特的书中学来的。TPS的规模、严谨性和持续学习的特性使其成为精益的核心概念。\n\
  \n在丰田，正是大野耐一将这些主题汇集在一起。他在已有的内部思想流派基础上进行了发展，并将其广度和应用扩展为如今所谓的*丰田生产系统*（TPS）。精益生产主要源于TPS（在20世纪80年代被广泛称为*JIT制造*），但现在也包含了许多其他来源，并不断发展。\n\
  \n## 8.5.4 塔塔集团\n\n*贾姆希德吉·塔塔*，全名*贾姆希德吉·努塞尔万吉·塔塔*（1839年3月3日生于印度古吉拉特邦纳夫萨里 – 1904年5月19日卒于德国巴特瑙海姆），印度慈善家和企业家，创立了塔塔集团（图8.13）。他雄心勃勃的事业帮助推动了印度跻身工业化国家之列。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_398_0.png)\n\n**图8.13** 贾姆希德吉·塔塔。*来源：*\
  \ https://en.wikipedia.org/wiki/File:NTata.jpg。公有领域。\n\n贾姆希德吉出生于一个帕西家庭，是努塞尔万吉·塔塔的第一个孩子和唯一的儿子。1858年从孟买（现孟买）的埃尔芬斯通学院毕业后，他加入了父亲的出口贸易公司，并帮助其在日本、中国、欧洲和美国建立了分公司。1868年，贾姆希德吉创办了一家贸易公司，该公司后来发展成为塔塔集团。1872年，他专注于棉纺制造，随后在那格浦尔、孟买和库尔拉建立了工厂。他的企业以高效、改善劳工保护政策以及引入更精细的纤维等级而闻名。他还规划了孟买地区的水力发电厂，这些电厂于1906年成为塔塔电力公司。\n\
  \n1901年，贾姆希德吉开始筹办印度第一家大型钢铁厂，六年后，该厂注册为塔塔钢铁公司（现为塔塔钢铁）。在他的儿子们——多尔布吉·贾姆希德吉·塔塔爵士（1859–1932年）和拉坦吉·塔塔爵士（生于1937年\
  \ – 2012年退休）——的指导下，塔塔钢铁公司成为印度最大的私营钢铁制造商，并成为一个企业集团的核心，其产品不仅包括纺织、钢铁和水力发电，还包括化学品、农业设备、卡车、机车和水泥。贾姆希德吉的其他商业项目包括泰姬陵皇宫酒店，这是印度第一家豪华酒店。1904年贾姆希德吉去世后，他的家族保持了对塔塔集团的控制，并将其打造为一个全球性的企业集团，到21世纪初，该集团已包括100多家公司。\n\
  \n作为一位著名的慈善家，贾姆希德吉于1892年设立了J.N.塔塔基金会，鼓励印度学生追求高等教育。1898年，他为班加罗尔（现为本加卢鲁）的一个研究所捐地，他的儿子们最终于1911年在那里建立了印度科学研究所。塔塔家族后来成为印度也许是技术教育和科学研究最重要的私人资助者。\n\
  \n## 8.6 浪费的类型\n\n尽管消除浪费看似是一个简单明了的话题，但值得注意的是，浪费通常被非常保守地识别。这极大地降低了此类目标的潜在效果。消除浪费是精益的目标，丰田定义了三大类浪费：*muda*、*muri*和*mura*；在许多精益实施中，这个列表往往缩减为仅第一类浪费，从而相应减少了收益。\n\
  \n为了说明这种思维状态，新乡重夫观察到，螺栓只有最后一圈拧紧才起作用——其余的都是移动。这种对浪费日益精细的区分，是区分增值活动、浪费和非增值工作的关键（大野耐一，1988年）。非增值工作是在当前工作条件下必须完成的浪费。一个关键点是衡量或估计这些浪费的规模，以展示所实现变革的效果，从而体现向目标迈进的步伐。\n\
  \n基于“流动”（或顺畅性）的方法旨在通过消除工作调度引起的变异来实现JIT，从而使用各种技术为实施提供驱动力、理由或目标和优先级。实现JIT的努力会暴露许多被缓冲库存掩盖的质量问题；通过强制仅使增值步骤顺畅流动，这些问题变得可见，并且必须被明确处理。\n\
  \n*Muri*是指管理层由于组织不善而强加给工人和机器的所有不合理工作，例如搬运重物、到处移动东西、危险任务，甚至工作速度显著快于平时。这是把人或机器推向超出其自然极限。这可能仅仅是要求一个流程在其无法承受的性能水平下运行，而无需采取捷径和非正式地修改决策标准。不合理的工作几乎总是导致多种变异的根源。\n\
  \n在TPS和精益中，将这三个概念联系起来很简单。首先，*muri*关注流程的准备和规划，或者通过设计可以主动避免哪些工作。接下来，*mura*则关注工作设计如何实施，以及在调度或操作层面消除波动，例如\n\
  \n\n\n质量和数量。Muda 是在流程建立后才被发现，并以被动的方式处理。它通过产出变化体现出来。管理层的职责是检查流程中的 muda，并通过考虑系统与 muri\
  \ 和 mura 的联系来消除其深层原因。muda 和 mura 的不一致必须反馈到 muri，即规划阶段，以便用于下一个项目。\n\n这些浪费相互作用的典型例子是企业在报告期结束时“做数字”的行为。当“数字”偏低时，需求被提高以“完成计划”，从而增加（mura），这会导致生产试图从流程中挤出额外产能，进而导致例行工作和标准被修改或拉伸。这种拉伸和即兴发挥导致\
  \ muri 式的浪费，进而导致停机、错误和逆流，以及等待，从而产生等待、返工和搬运的 muda。\n\n原始的七大浪费（TIM WOOD）如下：\n\n- 运输（移动实际不需要进行加工的产品）\n\
  - 库存（所有未加工的零部件、在制品和成品）\n- 动作（人员或设备移动或行走超过进行加工所需的距离）\n- 等待（等待下一个生产步骤，换班期间生产中断）\n\
  - 过量生产（超需求生产）\n- 过度加工（因工具或产品设计不良而产生的活动）\n- 缺陷（检验和修复缺陷所花费的精力）（Womack and Jones 2003）。\n\
  \n最终，Womack 等人（1990）定义了第八个“muda”；它被描述为制造不符合客户需求或规格的商品或服务。许多人还将“未利用的人才浪费”添加到原始七大浪费中。例如，六西格玛包括技能浪费，被称为“未充分利用能力并在培训不足的情况下委派任务”。其他新增的浪费例如“空间”。这些浪费最初并不是丰田生产方式（TPS）中由大野耐一定义的七大浪费的一部分，但在实践中被发现是有用的补充。1999年，Geoffrey\
  \ Mika 在其著作《Kaizen Event Implementation Manual》中增加了三种现在被普遍接受的浪费形式：为错误指标或无指标而工作的浪费、因不允许员工提出想法和建议并参与参与式管理而不充分利用完整员工的浪费，以及最后因计算机使用不当而产生的浪费；没有合适的软件、培训\n\
  \n使用方法，以及花费时间冲浪、玩游戏或只是浪费时间。有关“旧”和“新”浪费的完整列表，请参阅 Bicheno 和 Holweg（2009）。\n\n将非增值工作与浪费工作区分开来对于识别当前工作流程背后的假设并在适当时候对其提出质疑至关重要（Ohno\
  \ 1988）。SMED 和其他流程变更技术的突破依赖于在挑战加工假设时明确识别可能存在未开发机会的地方。\n\n## 8.7 六西格玛在工业中的应用\n\n\
  Sigma（σ）表示总体标准差。六西格玛是在工业中用来描述一个过程的缺陷不超过每百万 3.4 个的术语。六西格玛的提法暗示远离正态分布中心六个标准差，但对完美稳定过程的假设与过程会轻微漂移的假设相联系，因此每百万缺陷数。该缺陷率如此之低，以至于缺陷被认为几乎被消除。采用六西格玛质量目标，摩托罗拉在数年内节省了超过\
  \ 9.5 亿美元。艾利森公司报告节省了 15 亿美元。通用电气、宝丽来和德州仪器是其他采用六西格玛目标的主要公司。\n\n## 8.8 精益实施源于 TPS\n\
  \n### 8.8.1 精益领导力\n\n组织内领导者的作用是持续推进精益思维进展的根本要素。例如，丰田的资深 kaizen 成员经常提出 Senpai、Kohai\
  \ 和 Sensei 的概念，因为他们强烈认为，只有当更有经验的丰田 Sensei 不断指导和引领经验较少的精益冠军时，丰田文化的传递才能在丰田内部向下和横向进行。\n\
  \n精益的一个失调效应体现在关键绩效指标（KPI）领域。用于评判工厂/设施的 KPI 通常会驱动行为，因为 KPI 本身就假设了对所做工作的特定方法。当例如真正精益的、固定重复计划和\
  \ JIT 方法被采用时，这可能成为一个问题，因为这些 KPI 将不再反映绩效，因为其基础假设变得无效。管理组织内这种 KPI 混乱的影响是领导者面临的关键挑战。\n\
  \n同样，传统上用于支持大规模生产的会计系统对于追求精益的公司已不再适用。精益会计为业务管理和财务报告提供了真正精益的方法。\n\n在 TPS 中制定了精益制造方法的指导原则后，丰田于\
  \ 2001 年正式确定了其精益管理的基石：为长期持续改进所需的关键管理价值观和态度。这些核心管理原则围绕持续改进（无情消除浪费）和尊重人（基于持续改进和相互信任的长期关系）的双支柱展开。\n\
  \n这种正式化源于问题解决。随着丰田在过去 20 年里扩展到本土基地之外，它在 TPS 的正确应用上遇到了与西方其他公司复制 TPS 时相同的问题。像任何其他问题一样，它一直在尝试一系列对策来解决这一特定问题。这些对策集中在文化上：人们的行为方式，这是所有挑战中最困难的。没有适当的价值观和行为原则，TPS\
  \ 可能会被完全误用而无法取得成果。就像 TPS 一样，这些价值观最初是以师徒的方式传递的，从上司到下属，没有任何书面说明。就像 TPS 一样，内部曾争论正式化价值观会扼杀它们并导致进一步的误解。然而，随着丰田老员工最终写下\
  \ TPS 的基本原则，丰田着手将丰田之道写下来以教育新员工。\n\n持续改进分解为三个基本原则：\n\n- 1) *挑战*：要有长期的愿景，面对实现自己雄心的挑战（我们需要学习什么而不是我们想做什么，然后有勇气面对挑战）。为此，我们必须每天挑战自己，看看是否实现了目标。\n\
  - 2) *Kaizen*：足够好永远不够，任何流程都不能被认为完美，因此必须持续改进，追求创新和进化。\n- 3) *Genchi Genbutsu*：亲临现场了解事实并做出正确决策、形成共识并确保以最佳速度实现目标。\n\
  \n尊重人原则在丰田之外鲜为人知，本质上涉及两个定义原则：\n\n- 1) *尊重*：认真对待每个利益相关者的问题，并尽一切努力建立相互信任。为他人实现目标承担责任。\n\
  - 2) *团队合作*：这关乎通过团队解决问题来培养个人。其思想是通过对团队绩效的贡献来培养和调动员工。车间团队、整个工厂作为团队，以及从一开始的团队丰田。\n\
  \n### 8.8.2 与 TPS 的差异\n\n虽然许多人认为精益是将 TPS 推广到其他行业和背景的概括，但在实施中出现了一些公认的差异。\n\n- 1)\
  \ *追求利润* 是丰田的无情关注点，以利润最大化原则（价格 − 成本 = 利润）为例，因此需要通过 TPS 或其他方式进行系统化的成本削减以实现收益。精益实施往往倾向于淡化这一关键衡量标准，从而痴迷于“流动”或“拉动”改进概念的实施。然而，“价值曲线分析”的出现有望将精益改进直接与底线绩效衡量联系起来。\n\
  - 2) *工具导向* 是许多项目中存在的倾向，即将单纯的工具 [标准化作业、价值流图（VSM）、目视管理等] 提升到超出其实用意图的不健康地位。工具只是处理特定类型问题的方法，但它们并不会为你解决问题或总是突出许多类型问题的根本原因。丰田使用的工具通常用于暴露特定问题，然后再处理这些问题，因为每个工具的局限性或盲点可能被更好地理解。例如，价值流图侧重于物料和信息流动问题（该活动名称已内置于丰田的标题中），但在指标、人员或方法方面并不强。内部他们非常清楚工具的局限性，并理解它从未打算成为查看和分析每种浪费或与质量、停机时间、人员发展、交叉培训相关问题、产能瓶颈或与利润、安全、指标或士气等有关的每个问题的最佳方式。没有一种工具能做到所有这些。为了浮现这些问题，其他工具被更广泛、更有效地使用。\n\
  - 3) *管理技术而非变革推动者* 自 1950 年代初丰田开始强调培养生产经理和主管在指导自然工作团队方面的技能组合，而不依赖员工层面的变革推动者来推动改进以来，这一直是丰田的原则。这可能表现为精益的“推”式实施，而非团队自身的“拉”式实施。这一技能发展领域并非变革推动者专家的领域，而是\n\
  \n\n\n制造业可以及时更新和改变生产战略。\n\n供应链通过在主要市场附近部署第二家工厂或仓库来做出改变，以便迅速响应消费者的需求，而不是在低成本国家投资制造工厂。例如，戴尔直接从其网站销售电脑，将特许经销商排除在供应链之外。然后，该公司使用外包合作伙伴生产其零部件，并将零部件交付到世界各地这些主要市场的装配工厂。\n\
  \nZara 决定通过与西班牙当地合作伙伴在五周内快速生产服装来加快时尚进入消费者市场，并且从未参与大规模生产以追求新款式并保持产品新鲜。\n\n避免市场风险并有效控制供应的另一种方法是减少库存。宝洁已与沃尔玛和其他批发公司合作，通过建立直接面向供应商公司的库存响应系统来实现目标（Martin\
  \ 2005）。随着全球规模供应链的改善，企业在全球企业和供应商之间密集应用精益实践（JIT、供应商合作伙伴关系和客户参与），以便有效地与消费者市场建立联系。\n\
  \n## 8.8.5.2 危机\n\n在丰田精益生产多年成功之后，供应链网络的整合使丰田在快速扩张中成为世界最大的汽车制造商。2010年，丰田安全相关问题的危机使复制了丰田供应链系统的其他汽车制造商担心同样的召回问题也可能发生在他们身上。\n\
  \nJames Womack曾警告丰田，与单一外包供应商合作可能会带来意想不到的问题（Hopp 2011；Ohno 1988）。事实上，这场危机耗费了巨额资金，并让丰田思考\
  \ JIT 实践是否存在问题，因为缺乏足够经验和资深工程师的外包供应商无法在日本以外的地方对供应商进行近距离监控。这被证明为经济规模全球化时，软性学习实践在外包供应商中变得更加重要，如果他们能与合作伙伴保持良好的师傅关系并不断完善生产流程。否则，丰田开始考虑是否要有更多供应商生产同一零部件；这可能会在风险控制上带来更多安全保障，并减少未来可能发生的巨大成本。\n\
  \nJIT 在供应链系统中的应用是全球规模精益实施的关键问题。供应合作伙伴如何避免造成生产流程？全球企业应让更多能够相互竞争的供应商，以便获得最佳质量，同时降低生产流程中断的风险。\n\
  \n## 8.8.6 实现精益系统的步骤\n\n应实施以下步骤来创建理想的精益制造系统：\n\n- 设计一个简单的制造系统\n- 认识到总是有改进的空间\n-\
  \ 持续改进精益制造系统设计（Ohno 1988）\n\n### 8.8.6.1 设计一个简单的制造系统\n\n精益制造的一个基本原则是基于需求的流程制造。在这种生产环境中，库存只有在需要满足客户订单时才会被拉动通过每个生产中心。此目标的好处包括以下几点：\n\
  \n- 周期时间减少\n- 库存减少\n- 生产率提高\n- 资本设备利用率提高\n\n### 8.8.6.2 持续改进\n\n持续改进的思维方式对于实现公司的目标至关重要。“持续改进”一词意味着随着时间的推移对产品、流程或服务进行增量改进，目标是减少浪费以提高工作场所功能、客户服务或产品性能。精益建立在对产品和流程进行持续和增量改进的概念之上，同时消除冗余活动。“增加活动的价值仅仅是客户愿意付费的东西，其他一切都是浪费，应该被消除、简化、减少或整合。”通过以客户所需速度在新理想系统布局中改善物料流动，可以减少物料搬运和库存中的浪费（Bicheno\
  \ and Holweg 2009）。\n\n## 8.8.7 衡量\n\n整体设备效率是一组在精益环境中适用良好的绩效指标。此外，技术人员主要成员（PMTS）、方法时间测量、成本分析和也许时间研究可用于评估运营流程中的浪费和\
  \ IT 效率。例如，Jun-Ing Ker 和 Yichuan Wang 分析了两种处方技术，即无碳需求和数字扫描技术，以量化多医院健康系统中药物订购、转录和配药流程的优势。通过对这两种技术的比较，统计分析结果显示，采用数字扫描技术可显著减少流程时间。结果表明，使用数字扫描技术后，排队时间减少了\
  \ 54.5%，订单录入时间减少了 32.4%，发出延迟时间减少了 76.9%，发出运输时间减少了 67.7%（Ker et al. 2014）。\n\n##\
  \ 8.8.8 实施困境\n\n精益的一个批评是，其从业者可能更关注工具和方法，而非精益的哲学和文化。因此，需要适当的管控以避免精益方法实施失败（Hopp and\
  \ Spearman 2008）。另一个陷阱是管理层在不了解真正问题且未咨询车间人员的情况下决定使用何种解决方案。因此，精益实施往往看起来对管理者不错，但未能改善状况（Hopp\
  \ and Spearman 2008）。\n\n此外，许多源自丰田生产方式的流行精益举措，都是针对丰田当时面临的具体问题的解决方案。丰田在不理想的现状下，确定了最终状态应是什么样。通过大量研究，差距被缩小，这就形成了今天许多工具。经常，当一种工具在丰田生产方式之外实施时，企业认为解决方案具体存在于其中一种流行的精益举措中。曾是特定公司特定问题的解决方案的工具，可能无法以设计的完全相同方式应用。因此，解决方案与问题不匹配，形成了临时解决方案而非实际根本原因（Ohno\
  \ 1988）。\n\n精益哲学旨在降低成本同时优化和改善绩效。价值流图和 5S 是企业迈向精益组织第一步时最常用的方法。精益行动可以专注于具体的物流流程，或覆盖整个供应链。进行差距分析可确定企业“必须采取”的步骤以改善价值流并实现目标。基于该评估，改进小组进行失效模式影响分析，以识别和预防风险因素。让一线员工参与价值流图活动至关重要，因为他们了解流程并能直接提高效率。虽然每次精益活动的影响可能很小且有限，但在供应链沿线逐步实施一系列小改进，可以带来生产率的提升（Merrill\
  \ 2013）。\n\n采用精益方法后，管理人员和员工都会经历变化。因此，在精益之旅开始时需要果断的领导者。控制精益之旅有几个要求。首先也是最重要的是，专家建议组织应拥有自己的精益计划，由精益领导层制定。换句话说，精益团队为领导者提供建议，然后领导者做出实际的实施决策。第二，在组织开始精益之旅时建议进行辅导。他们将把知识和技能传授给车间员工，精益实施将更加高效。第三，用于衡量精益和改进的指标或测量极其重要。它将使领导者能够收集进行明智决策所需的数据。没有足够的流程和产出测量能力，就无法成功实施精益。为了控制和改进未来的结果，必须看到并测量，即绘制当前正在发生的情况（Ohno\
  \ 1988）。\n\n## 8.9 制造系统特征：工艺规划基础\n\n对计算机集成制造系统的投资是由对高质量零部件、小批量、敏捷性和短交货期的渴望所驱动的。在零件规格的早期阶段，建立集成\
  \ CAD/CAM 环境是快速离线模拟和验证新零件设计的关键。设计、工艺规划和制造集成在多个层面上发生，这取决于练习的目标和“灵活性”程度（即设计或工艺固定的程度）。设计、制造和精加工之间可实现的集成水平取决于几个因素（Stein\
  \ and Dornfeld 1996）：\n\n- 1) 设计、制造或精加工任务的性质\n- 2) 执行任务的环境\n- 3) 可用于协助设计者完成任务的工具\n\
  \n在当今和未来的生产环境中，已识别出设计、制造和精加工任务之间四个不同的集成水平（Stein and Dornfeld 1997）。集成水平可以用在每个水平上在整个零件生产过程的各个阶段预测、影响和优化零件生产目标的能力来描述。这些目标涵盖了多种工艺指标，这些指标影响保持形状公差、形态公差、所需表面特性以及亚表面损伤/残余应力的目标。从工艺规划角度来看，这四个集成水平使用特征质量作为工艺指标，示于表\
  \ 8.2。\n\n\n\n\n\n## 表8.2 设计到制造周期中集成的四个层级\n\n| 集成层级 | 工艺规划软件专家和智能体任务 | 调整自由度 |\n\
  |---|---|---|\n| 第一级 | 在迭代设计和工艺规划环境中的特征预测、控制和优化 | 设计：高<br>制造：高<br>精加工：高 |\n| 第二级\
  \ | 在“隔墙式”设计到制造环境中，通过选择制造计划进行特征预测、控制和优化 | 设计：低<br>制造：高<br>精加工：高 > 低 |\n| 第三级 | 通过对预设定制造工艺进行有限调整来实现特征预测和控制\
  \ | 设计：低<br>制造：有限<br>精加工：高 |\n| 第四级 | 用于精加工工艺规划、精加工刀具轨迹和传感器反馈策略的特征预测 | 设计：低<br>制造：低<br>精加工：高\
  \ |\n\n> 来源：Stein和Dornfeld（1997）。\n\n在集成度最高的第一级，设计者正在考虑部件的设计。在此级别，任何将设计、工艺规划和制造关联起来的信息都可用于改善部件的整体“可制造性”。在集成度稍低一级的第二级，设计可能是固定的，但仍然可以制定工艺规划和制造配置，以确保满足零件规格。在更低的第三级，设计、工艺计划以及制造设备都可能是固定的。然而，即使在这个级别，仍然可能且有必要考虑对制造过程进行优化和微调，以通过改变整体几何形状或集成水平来应对意外问题；而且这可能仅仅有助于确保后续制造过程（例如精加工）得到高效、准确的执行。随着设计、制造和精加工之间的集成水平从第四级提高到第一级，软件工具（以及设计者）影响和优化特征尺寸、形状或质量等工艺指标的能力也随之增强。让设计者在更高集成级别下工作的结果是，提高了设计决策对某一工艺指标（如毛刺形成）的敏感性，并使设计者能够通过分析、仿真和决策评估来优化和平衡相互冲突的工艺指标。\n\
  \n## 8.10 生命周期设计\n\n生命周期设计涉及产品制造完成后的阶段。在许多情况下，产品除了购买价格之外，还会给客户带来可观的成本。\n\n这些成本包括安装、维护和修理、备件、产品未来升级、运行期间的安全性，以及产品在其使用寿命结束时的处置。表8.3列出了与产品生命周期设计相关的大部分因素。\n\
  \n## 表8.3 生命周期设计中的因素\n\n| 因素 | 典型问题和注意事项 |\n|---|---|\n| 交付 | 运输成本、交付时间、大批量生产物品的存储和分销、所需承运商类型（卡车、铁路、航空运输）\
  \ |\n| 可安装性 | 公用设施要求（电力、气压等）、建设成本、现场装配、安装期间的支持 |\n| 可靠性 | 产品的使用寿命、故障率、可靠性测试要求、产品中使用的材料、公差\
  \ |\n| 可维护性 | 设计模块化、装配中使用的紧固件类型、预防性维护要求、客户维护的便利性 |\n| 可维修性 | 产品复杂性、诊断技术、现场服务人员的培训、产品内部结构（工作部件）的可达性、所需工具、备件的可用性\
  \ |\n| 人为因素 | 使用的简易性和便利性、控制系统的复杂性、潜在危险、操作期间受伤的风险 |\n| 可升级性 | 当前设计与未来模块和软件的兼容性、升级成本\
  \ |\n| 可处置性 | 产品中使用的材料、部件的回收利用、废物危害 |\n\n> 来源：改编自Groover（1999）。\n\n产品成本是决定其商业成功与否的主要因素。成本影响产品的定价和利润。面向产品成本的设计是指公司努力识别设计决策对整体产品成本的影响，并通过优化设计来控制这些成本。许多DFM指南都旨在降低产品成本。公司建立一个产品成本模型来预测不同设计选择可能如何影响材料、制造和检验成本，这通常很有用。\n\
  \n对于客户而言，如果将生命周期成本（LCC）计算在内，为产品支付的价格可能只是其总成本的一小部分。一些客户（例如联邦政府）在采购决策中会考虑LCC。制造商通常必须提供服务合同，以限制客户在失控的维护和服务成本方面的风险。此时，必须将这些LCC的准确估算纳入产品总成本中（Groover\
  \ 1999）。\n\n## 8.11 可持续设计与环境意识设计制造\n\n在本节中，我们将围绕精密制造技术，详细讨论能源及其紧密相关的环境问题。能源与环境这两者将在未来推动精密制造的技术和实践。当然，遵循摩尔定律的更多增量式发展——更高密度的数据存储、先进光学、更复杂的医疗设备、纳米级器件、复杂的电信和IT进步等等——仍将存在并不断推动我们前进。但真正主导我们未来的，是产品设计、制造、使用和再利用或处置过程中的能源和环境影响这一双重主题。这预计将促使我们朝着以下方向发展：\n\
  \n- 先进能源技术（例如电池、光伏/太阳能、氢燃料发动机、光合作用、混合动力汽车、高效发动机、水力发电、风力发电、先进生物燃料制造）\n\n- 可持续制造（例如绿色机器、绿色工厂、绿色工艺和系统（包括供应链），最大限度地减少或消除废物、耗材、能源，绿色产品（零缺陷和零影响），再利用或再制造）。\n\
  \n对于可持续制造，我们需要重新思考产品设计和制造的方法。例如，我们如何为全球变暖、过度的能源和资源消耗、制造业相关的大气污染等重大问题提供增量式解决方案？\n\
  \n### 8.11.1 可持续制造技术\n\n人们对能源和原材料的可得性与成本、工业活动的影响以及消费产品在其使用寿命结束后的有效再利用的关注日益增加，这些正在推动绿色制造的努力。这是国际上对设计和制造中整体实现可持续性这一更大关切的组成部分。这里所定义的可持续性，意味着一种在范围上非常全面的资源利用水平。它必须与这样一个必要的水平相一致，以确保随着时间的推移，资源（i）不仅仍然可用，而且（ii）需求被降低到接近自然可持续的水平。也就是说，必须理解当前使用与可持续使用之间的“差距”。这是一个难以达到的衡量标准，但归根结底，这是必需的（Dornfeld和Lee\
  \ 2008）。\n\n“绿色商业”这一话题如今在商界非常流行。从GE（其“环保”活动）到福特（其部分产品的可持续“供应链”），企业都发现推广绿色产品和绿色经济既有利可图，又负责任。像丰田这样的汽车制造商强调整个制造过程（包括供应链）都必须是绿色的。其他公司，如康明斯发动机，则从事发动机部件的“再制造”，这些部件在首次使用后仍具有使用寿命。\n\
  \n接下来将对绿色制造进行简要介绍，然后回顾在讨论绿色制造时理应包含的系统要素和范围。还将讨论“技术楔子”的概念，以及如何应用该概念来识别环境友好型制造的机会，并将解决方案与现有工艺或供应链相结合。\n\
  \n### 8.11.2 绿色制造流程\n\nSheng等人（1995）很早就考虑了将绿色组件和分析集成到制造系统中。一些研究人员已更详细地成功解决了制造过程的特定部分，例如最小量润滑/干式加工，目前已在国际上许多制造作业中实施（Zimmerman等人，2003）。这些具体成果通常被称为“技术楔子”，是综合解决方案的一部分。下一节将更详细地解释这些楔子。Ishii研究了在产品设计时纳入报废考虑因素（1999）。\n\
  \n图8.14展示了设计和制造的绿色要素示意图。“生命周期”的\n\n\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_406_0.png)\n\
  \n图 8.14 示意图显示了从产品定义到产品寿命终止的设计与制造绿色要素之间的关系。\n\n从设计到寿命终止时产品回收或再利用必须被考虑。该图提及生命周期分析\
  \ LCA 工具（见第 6.3 节）(Das 2002, 2005; Das and Houtman 2004)、设计用于装配 DFA 以及设计用于环境 DFE。该图区分了产品的设计与制造产品的工艺或系统。重要的是，既要考虑工艺的设计，也要考虑工艺制造产品时的运行方式。在制造产品的机器设计中存在巨大的机会（Taniguchi\
  \ et al. 2005），以及在它们的生产运行中[例如宏观和微观规划，见 Srinivasan and Sheng (1999a, b)]。\n\n关于绿色制造实践，有必要考虑产品生命周期中所有要素的环境影响，如图\
  \ 8.15 所示。该图涵盖了从原材料原始来源\n\n的尽可能广的范围（包括采矿成本）到使用后产品最终处置。每个要素都包括废物（或未利用资源和副产品）。这些工艺各个阶段消耗的能源和资源，以及废物输出，将“抵消”新产品或机器因工艺而带来的任何益处。事实上，为了完整，我们可以认为制造包括产品生命周期大部分阶段的要素，因为采矿、转换和运输可以说都是制造的一部分。在更详细的层面上，可持续制造可以通过改进制造的各个组成部分来解决（图\
  \ 8.16）。在这里我们看到促进可持续制造的因素包括能源来源和工艺。\n\n要有效，任何以“环境友好”方式生产的产品或工艺在其生命周期内必须实现净能源、资源或环境影响节约，以满足可持续性定义。通俗地说可以说：“如果你在制造产品时消耗的资源与产品使用时节省的资源一样多，你就没成功！”这需要仔细核算整个工艺链要素的影响，而这往往不容易做到。\n\
  \n## 8.11.3 可持续制造：绿色等同于可持续吗？\n\n如果我们观察资源（任何资源）的消耗或该消耗随时间的影响，我们可以识别出一种趋势，通常随时间递增。可持续的消耗率或影响往往要低得多。在这里我们可以在一个广为引用的\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_406_1.png)\n\n图 8.15 示意图显示了在产品生命周期内绿色制造实践中考虑环境影响的要素。\n\
  \n提出“技术楔子”——类似于“稳定化楔子”——为解决这些能源挑战提供了一个框架和潜在的度量指标。\n\n有一系列基本规则支配着楔形技术在制造中的应用。按任意顺序，它们如下（Dornfeld\
  \ and Wright 2007）：\n\n规则 1. 楔子相关的材料和制造成本[以能源消耗和温室气体 GHG 排放等计]不得超过在该楔子所应用的工艺或系统或产品生命周期内实施楔子所产生的节约（见第\
  \ 8.11.4 节）。\n\n规则 2. 技术必须应用于工艺链的最低层级。\n\n规则 3. 技术的成本和影响必须以制造系统和环境的基本指标来计算。也就是说，成本和影响必须可以用美元（或欧元、日元等）、碳当量、全球变暖气体产生或减少、焦耳、周期时间和生产率、质量指标、交货期、营运资本等单位表达，相对于当前消耗、使用、时间等的水平。\n\
  \n规则 4. 技术必须同时考虑社会关切以及商业和经济（Hawken 1993）。\n\n规则 5. 必须有相应的分析手段或设计工具，以便在工艺或系统的设计阶段对其进行评估。它必须是一个集成的方法。\n\
  \n这些规则在应用时将确保从环境角度对技术影响进行平衡和准确的评估，并确保规则在商业角度上可行。这将避免因收益导致全球净损失而在供应链中造成的异常。社会上目前存在许多净损失的例子，例如所谓的“高科技/低成本”产品，其中一些运行高效，但使用寿命短。消费者“学会”期望这一点，因此期望在短时间内更换产品。这种趋势破坏了大量产品价值和资源，更糟的是，它助长了环境破坏。如此“一次性”产品的生命周期在设计、制造、使用或再利用中往往未被考虑。\n\
  \n## 8.12 精益六西格玛\n\n### 8.12.1 引言\n\n精益六西格玛是一种依赖协作团队努力通过系统地消除浪费和减少变异来提高绩效的方法。它结合了精益制造/精益企业和六西格玛，以消除八种浪费（muda）：\n\
  \n- 1) 运输\n- 2) 库存\n- 3) 动作\n- 4) 等待\n- 5) 过度加工\n- 6) 过度生产\n- 7) 缺陷\n- 8) 员工利用不足\n\
  \n六西格玛寻求通过识别和消除缺陷（错误）的原因并最小化（制造和商业）过程中的变异性来提高过程输出的质量。协同地，精益旨在通过收紧工艺步骤之间的联系来实现连续流动，而六西格玛则专注于减少工艺步骤的工艺变异性（以其各种形式），从而实现这些联系的收紧。简而言之，精益暴露了工艺变异的来源，而六西格玛旨在减少该变异，使迭代改进的良性循环得以实现，目标是实现连续流动。\n\
  \n六西格玛是一种旨在提高质量、降低成本并提高客户满意度的业务流程。该名称来自统计学，其中高水平的质量代表每百万缺陷不超过 3.4 个。六西格玛的目标是识别并消除缺陷的原因。计划-执行-检查-行动（PDCA）或计划-执行-研究-行动（PDSA）是一种持续改进的迭代方法。它也与改进循环\
  \ DMAIC（定义、测量、分析、改进和控制）相关。DMAIC 循环用于现有产品，与产品开发期间使用的 DMADV（定义、测量、分析、设计、验证）相关。\n\n\
  ### 8.12.2 六西格玛的历史：1980 年代–2000 年代\n\n#### 8.12.2.1 Motorola 故事\n\n六西格玛的起源在摩托罗拉。在对产品现场寿命的研究中，一名摩托罗拉工程师观察到，在制造中无缺陷的产品很少在客户早期使用时失效。然而，在生产过程中失效并经过返工的产品更容易在客户手中早期失效。似乎那些最初制造良好的产品工作良好，而那些最初有缺陷的产品可能还有其他缺陷。发现并修复一个缺陷并不能保证产品良好。\n\
  \n仅仅发现和修复缺陷是不够的，它们必须被预防。\n\n只有当生产产品的工艺设置成缺陷不可能或不会发生时，才能预防缺陷。摩托罗拉专注于“如何”在每个和每一个工艺中完成工作。如果缺陷被预防，就不需要返工，质量会更高。由于工艺很多，摩托罗拉开发了一种可应用于每个工艺的六西格玛工作度量。\n\
  \n摩托罗拉开发的度量称为每个与工艺相关的关键质量特性 CTQ 的西格玛水平或西格玛值。CTQ 分析是一种研究工艺流程图以寻找问题的方法。该分析研究输入和输出并识别影响工艺及其输出质量的步骤。如果工艺处于理想状态，它是稳定、可预测的并满足\
  \ CTQ。如果它稳定、可预测但不满足 CTQ，则处于阈值状态。如果它没有特殊原因，应该相对容易通过 DMAIC 项目将其移入理想状态（见第 8.12.2.3\
  \ 节）。\n\n西格玛水平基于统计分析，将每百万机会缺陷数 DPMO 与 CTQ 相对于客户要求的水平能力联系起来。DPMO 为 3.4 的 CTQ 与能力值\
  \ Cp = 2.0 和 Cpk = 1.5 相关，被认为达到了六西格玛水平。摩托罗拉成功地将六西格玛的概念、哲学和技术应用于 Bandit 分页器的设计、开发和生产。该分页器的质量水平无与伦比。摩托罗拉表明，传统的检测和修复缺陷的方法导致\
  \ CTQ 达到四西格玛质量水平。六西格玛质量，或 3.4 DPMO，导致消除昂贵的检验和返工，进而导致制造时间减少和客户满意度提高。客户满意，摩托罗拉获得了惊人的财务节约。\n\
  \n#### 8.12.2.2 通用电气故事\n\n1995 年，AlliedSignal 的 Larry Bossidy 向通用电气 GE 高层介绍了六西格玛。Bossidy\
  \ 关于 AlliedSignal 实现的益处的描述促使时任 GE 首席执行官 Jack Welch 启动了六西格玛计划，目标是到 2000 年将 GE 的所有产品提升到六西格玛水平。当时，GE\
  \ 的工艺运行在三到四西格玛之间，这意味着平均 35 000 DPMO。从三或四西格玛到六西格玛需要一次巨大的培训和教育工作。GE 推出了严格的六西格玛方法培训，重点\
  \ heavily 放在统计方法上。1996 年至 1998 年间，GE 的培训投资接近 10 亿美元，而该投资的回报已经跟上步伐。到 1999 年他们预计节省\
  \ 15 亿美元。GE 的业务范围从各种产品到各种服务，包括 GE 资本。在整个 GE，六西格玛计划为组织的底线及其为客户服务的<|message|> 带来了益处。\n\
  \n#### 8.12.2.3 DMAIC 模型\n\nDMAIC 模型的五个阶段是定义、测量、分析、改进和控制（图 8.18）。虽然该模型建议线性进展，每个阶段导致下一个阶段，但阶段之间总会有一些迭代工作。每个阶段涉及一定量的工作以完成，这是成功完成六西格玛项目不可或缺的（Ward\
  \ and Poling 2004）。\n\nDMAIC 的阶段 定义阶段用于聚焦六西格玛项目并创建具有时间线的路线图，以指导所有项目活动顺利完成。在冠军领导下，项目团队开展与项目相关的流程映射并与流程的所有利益相关者建立沟通。关于团队成员和会议时间的后勤决策被决定。章程最终确定并由所有人签署。如果关于时间或人员等资源可用性出现问题，冠军会帮助解决这些问题。\n\
  \n测量阶段专注于收集数据以评估当前流程绩效。它涉及确定与项目相关的所有度量。这些包括与组织记分板挂钩的记分卡指标以及流程的所有 CTQ 特征。所有度量必须明确识别并为每个度量设置数据收集计划。然后可以定期收集数据用于分析阶段。\n\
  \n在分析阶段，使用各种技术来确定当前流程绩效与项目章程中的绩效目标相比如何。数据被分析，其明确目的是了解当前流程为何以这种方式工作。特别重要的是确定流程是否具有可预测或不可预测的行为。可预测的流程具有始终存在并每天影响流程的常规变异来源。不可预测的流程具有常规变异来源加上特殊、不可预测的变异来源，这些来源可能使流程脱轨。\n\
  \n改进阶段的活动旨在找出如何改进流程。该阶段涉及调查流程的哪些变化会使\n\n图 8.18 DMAIC 模型的五个主要组成部分。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_409_0.png)\n\
  \n\n\n\n\n使流程更好地满足项目目标。项目团队可以进行实验，了解可以实现什么目标以及相关成本。一旦确定了几个解决方案，项目团队可以评估并试点这些方案，以了解其潜在收益。在最终改进方案被选定和实施之前，项目团队需要评估所有解决方案的潜在问题。解决所有潜在问题将确保该解决方案在未来不会受到损害。\n\
  \n最后，DMAIC模型中的*控制阶段*必须专注于使变革持久化，以实现持续的过程改进。这意味着项目团队将致力于那些关键活动，以便将改进后的流程移交给流程所有者。要从任何六西格玛项目中获益，改进必须由组织而非项目团队来维持。控制阶段包括员工培训、控制计划和持续关注流程的过程度量。项目团队将DMAIC模型的控制阶段交还给组织，这一过渡伴随着标准化和制度化阶段。\n\
  \n## 8.12.2.4 计算过程西格玛值\n\n过程西格玛值提供了一种比较不同流程性能的方法，可以帮助您确定项目的优先次序。过程西格玛值代表首次即正确满足CTQ的案例总体。西格玛值通常以*百万机会缺陷数*表示，而不是每百或每千，以强调对世界级绩效的需求。并非所有使用六西格玛的组织都计算过程西格玛值。有些组织仅使用缺陷数量或满足CTQ的订单百分比来展示其绩效。无论哪种方式，如果要让基准测试有意义，计算必须以一致的方式进行。\n\
  \n表H.2包含了“合格率”百分比、西格玛水平和DPMO——即首次正确数据。您可以看到，六西格玛绩效仅相当于3.4 DPMO（Morgan和Brenig-Jones，2016）。\n\
  \n精益六西格玛使用与六西格玛类似的DMAIC阶段。精益六西格玛项目既包含精益消除浪费的内容，也包含六西格玛基于关键质量特性减少缺陷的重点。精益六西格玛的DMAIC工具包包含了所有精益和六西格玛工具。精益六西格玛的培训是通过类似于六西格玛的带级培训体系提供的。带级人员被指定为白带、黄带、绿带、黑带和黑带大师，类似于柔道。\n\
  \n## 8.12.2.5 精益六西格玛组织结构\n\n对于每个带级，都有相应的技能集，说明在特定带级中应掌握哪些精益六西格玛工具。这些技能集详细描述了参与者在完成培训计划后将获得的学习要素。还描述了这些学习要素可应用的层级。这些技能集反映了来自六西格玛、精益以及约束理论、全面生产维护等其他流程改进方法的要素。\n\
  \n## 8.12.3 5S\n\n5S是一种精益实践，用于保持生产工作场所井然有序，并让员工致力于维护秩序。\n\n### 日文术语\n\n- 1) *Seiri*（整理）–\
  \ 将物品摆放有序\n- 2) *Seiton*（整顿）– 适当布置\n- 3) *Seiso*（清扫）– 清洁（保持整洁）\n- 4) *Seiketsu*（清洁）–\
  \ 纯净（保持清洁）\n- 5) *Shitsuke*（素养）– 灌输维持5S的态度/氛围的承诺\n\n### 英文术语\n\n- 1) *Sort*（整理）–\
  \ 清除不必要的东西\n- 2) *Straighten*（整顿）– 每样东西都有其位置并放置其中\n- 3) *Shine*（清扫）– 保持机器/工作场所清洁\n\
  - 4) *Standardize*（标准化）– 维持1–3的系统与程序\n- 5) *Sustain*（维持）– 维持系统/程序（1–4）\n\n## 8.13\
  \ 六西格玛与精益制造\n\n六西格玛与精益理念之间有许多相似之处。两者都专注于流程及流程改进。每一种方法的技术都对另一种形成补充，并能产生增强的效果。\n\n\
  ### 8.13.1 比较两种方法论\n\n六西格玛专注于改进现有流程，以产生基本无缺陷的结果。达到六西格玛水平的CTQ特性或CTQ将只有3.4 DPMO。这里有两个理念在起作用：第一，预防缺陷更具成本效益，并减少对检验和返工的需求；第二，所有产品和服务都有多个CTQ特性。如果每个CTQ都达到六西格玛水平，那么产品或服务就会按照客户的期望运行。\n\
  \n消除非增值步骤的收益可能尚未得到评估或解决。此外，贯穿整个组织的流动是精益拉动系统的核心，可能也尚未得到考虑。我们今天所知的精益制造始于福特汽车公司在密歇根州鲁日工厂开创的理念。基于原料钢进厂、成品车出厂的理念，鲁日工厂将生产提升到了新的高度。随后，丰田将这一理念进一步推进。精益的卓越之处在于超越手工艺和大规模生产技术，转向基本上无需设置时间的小批量生产。由于小批量、小批次的生产方式，质量问题会被立即发现，并且不会有内部零件或材料的积压。小批量使质量立即可见，并带来了质量改进（见表8.4）。\n\
  \n时间的浪费、材料的浪费和金钱的浪费——这些都推动着精益理念。原始精益思想已衍生出许多分支。通过消除流程中的非增值步骤来消除浪费，催生了VSM（价值流图）。消除过剩库存并采用小批量生产，带来了“拉动”式生产系统。所有精益努力都旨在消除生产系统中各种类型的浪费。精益方法为缩短上市时间、降低成本并提高产品质量提供了机会。\n\
  \n这两种理念都聚焦于流程。精益技术可能正是用来实现质量改进和成本降低的方法，而这些是六西格玛行动的目标。六西格玛则可能提供统计技术，将精益行动提升到一个新水平。两者都至关重要，如果协同配合，将比单独使用任何一种都有效得多（Snee和Hoerl，2003）。\n\
  \n## 8.14 成本与质量分析\n\n成本-质量分析是一种研究流程的流程图以识别问题的方法。该分析帮助团队以批判的眼光审视流程中的各个步骤，以寻找改进机会。质量成本是指因质量不佳而产生的成本，如果事情首次就能做对并且每次都做对，这些成本就不会发生。在成本-质量分析中，人们寻找会产生质量成本的活动。\n\
  \n何时使用：\n\n- 在绘制过程流程图时，确保将质量成本活动包含在内。\n- 在绘制过程流程图之后，用于识别问题、潜在原因以及集中改进的领域。\n\n步骤：\n\
  \n- 1) 绘制过程的详细流程图。\n- 2) 识别所有会产生质量成本的过程步骤（包括循环回路）：检查、修复和损坏控制。（本节稍后的“注意事项”中给出了这些成本的定义。）在这些步骤或回路周围画红色圆圈（红色表示停止）。\n\
  - 3) 如果没有或很少有步骤带有红色圆圈，请问：“可能出什么问题？我们如何判断出了问题？流程如何处理出错情况？”如有必要，在流程图中添加步骤。\n- 4) 对于每个红色圆圈，问问自己：哪个流程步骤如果完美执行，就能让我们消除这个带红圈的步骤？在此确定的每个步骤周围画绿色圆圈（绿色表示通行）。\n\
  - 5) 绿色圆圈显示了寻找预防问题方法以及总体寻求改进的领域。绿色圆圈将包含红色圆圈所识别问题的根本原因。\n\n示例：\n\n图8.19显示了填写订单流程图的成本-质量分析。假设虚线圆圈是红色的：检查、修复（包括返工）和损坏控制。这些圆圈是先画出来的。请注意，在此流程图上，所有决策菱形都是检查或检验步骤。此外，两个循环回路是修复步骤。\n\
  \n表8.4 两种方法论比较：六西格玛与精益制造。\n\n|  | 目标 | 关注点 | 缺失之处 |\n|---|---|---|---|\n| 六西格玛 |\
  \ • 提高客户满意度<br>• 改进质量<br>• 提高盈利能力 | • 减少产品和服务中的变异<br>• 消除缺陷，达到六西格玛质量水平 | • 速度和效率<br>•\
  \ 精简流程 |\n| 精益制造 | • 减少浪费<br>• 降低库存<br>• 降低成本<br>• 提高速度 | • 精简流程<br>• 提高效率 | • 减少变异<br>•\
  \ 预防缺陷 |\n\n\n\n\n\n# 填写订单\n\n图 8.19 成本与质量分析示例。\n\n= 红色 = 检验、返工、损害控制\n\n= 绿色 = 寻找预防措施\n\
  \n图中没有损害控制步骤，因为该流程图未显示外部客户出现问题时会发生什么。如果一位优质客户被错误地拒绝赊账怎么办？或者客户对交货日期不满意怎么办？或者发错了产品怎么办？或者账单有误怎么办？如果这些可能性都显示出来，它们会被红色圆圈圈出。\n\
  \n在分析的下一步，针对每个虚线圆圈，在流程图前面的方框中寻找预防措施。对于“产品是否合格？”这一检验环节以及从“否”答案流出的再循环回路，其预防措施是“制造产品”。如果每次都能完美地制造产品，那么“产品是否合格？”这一问题就不必要了。想象一下，“制造产品”周围的实线圆圈是绿色的。对于“材料是否合格？”以及从该判定菱形流出的再循环回路，其预防措施是“订购材料”和“供应商”。请注意，虽然我们无法控制供应商的行为，但他们的流程导致我们增加了一个检验步骤。这就是为什么让供应商参与你的质量改进工作非常重要。\n\
  \n如果外部客户的问题已被绘制成流程图并用红色圈出，那么“检查信用”“安排发货”“发运产品”和“准备账单”周围就会被画上绿色圆圈。正确做到这一点可以防止日后的损害控制。对于三个红色（虚线）圆圈，在此流程图上找不到任何预防机会。“材料是否在库存中？”取决于材料库存流程；“产品是否在库存中？”取决于产品库存流程；“信用是否良好？”取决于信用流程（也取决于客户）。这些流程的名称已被写入并用绿色圈出。团队可能会决定，为了改进订单填写流程，应研究与之相关联的材料库存流程。\n\
  \n## 8.14.1 注意事项\n\n- 有三种需要消除的会产生成本的活动类型：\n  1) *检验*：通过测试、检查或核查来确定是否发生了故障或错误。例如，校对、会签文件。\n\
  \  2) *返工*：对在客户受到影响之前发现的错误或不良产出进行纠正、返工或处置。例如，在发现报告中有错误信息时重新制作报告。\n  3) *损害控制*：对在客户受到影响之后发现的错误或不良产出进行纠正、返工或处置。此外，还要处理因客户受到影响而产生的问题。例如，向客户解释我们如何解决问题。\n\
  \n- 还有第四种质量成本：预防。通常最好（更便宜、更容易）通过预防来处理问题，而不是等到需要检验、返工或损害控制。质量改进基于预防问题的发生。通过质量成本分析，你可以识别出属于检验、返工或损害控制（红色圆圈）的流程步骤，从而确定能够减少甚至消除这些步骤的预防措施（绿色圆圈）。\n\
  - 被红色圈出的流程步骤可能实际上永远不会消失。我们都是人，所以我们永远不会完美。然而，思考理想中的完美世界有助于我们看清应将改进工作重点放在何处。例如，我们可能总是希望做最终检验来检查产品是否合格。但为了改进流程，我们应该致力于改进产品制造本身，而不是改进检验方法。\n\
  - 如果一个流程图的红色圆圈很少或没有，那么它可能是以非常少的细节绘制的，属于宏观概览。这种分析只能针对包含足够细节的流程图进行，以显示问题和修复措施。\n-\
  \ 通常，改进机会会在你所绘制的流程图边界之外被发现。狭窄的范围可能是绘制你所关注的流程部分的最佳方式。然而，在确定改进机会时，不要将自己局限于该范围（Tague\
  \ 2004）。\n\n## 8.15 评估并降低设计中的风险：制造成本\n\n遵循螺旋方法的设计过程优于当前的“循环”，后者代表反馈。也就是说，客户可以推断设计正在推进，但为了融入各种观点，它正在失去优势（并且花费更多的金钱和时间）。然而，通常一个协同创新设计从来不会倒退。事实上，更好、更频繁且更具成本效益的特性正在被持续集成到项目中。这超越了“现在支付还是以后支付”的决策，尽管考虑整个生命周期将节省时间和金钱，更不用说完工后未来的责任了（见图\
  \ 8.20）（Vallero 和 Brasier 2008）。通过在产品和系统设计中考虑次要成本，可以获得更高的安全性和可持续性。这是生命周期视角的开端，尤其是在除了财务指标之外还考虑成本和影响时。\n\
  \n对于工程产品而言，安全性的任何提高通常都伴随着产品成本的增加。另一方面，不安全的产品会给制造商带来超出主要（生产）成本的次要成本，这些成本也必须被考虑在内——包括保修费用、客户商誉损失，甚至因使用产品造成伤害而失去客户、诉讼、制造过程中可能的停机时间等相关的成本（见图\
  \ 8.20）。因此，对于制造商和用户来说，就任何给定产品相关的风险达成一定共识，并了解降低这些风险（或不降低）可能需要付出什么代价，这一点非常重要。\n\n\
  ## 8.16 丰田方式的精髓：精益流程\n\n丰田方式将丰田的管理原则总结为 4P 模型：理念（Philosophy）、流程（Process）、人员（People）和问题解决（Problem\
  \ Solving）（见图 8.21）。4P 构成了一个金字塔，其基础是专注于为客户和社会创造价值的长期理念。在此基础上，是丰田对精益流程的投入，其重点是消除浪费以缩短交付周期。消除浪费是通过人员使用严谨的问题解决方法来实现的——即金字塔的上面两层。丰田的管理体系在这\
  \ 4 个层级内由 14 项原则来描述（图 8.21）。\n\n### 8.16.1 丰田方式的十四项原则\n\n### 8.16.1.1 长期理念\n\n原则\
  \ 1. 管理决策以长期理念为基础，即使牺牲短期财务目标也在所不惜。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_414_0.png)\n\
  \n图 8.20 与主要成本和次要成本相关的安全和环境风险。风险增加以及较低的制造成本和产品成本会导致未来的责任（这超越了“现在支付还是以后支付”的说法）。来源：摘自\
  \ Martin 和 Schinzinger（2004）。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_414_1.png)\n\
  \n图 8.21 丰田方式的 4P 模型。\n\n### 8.16.1.2 精益流程：正确的流程将产生正确的结果\n\n原则 2. 建立连续流程“流动”以将问题暴露出来。\n\
  原则 3. 使用“拉动”系统以避免过量生产。\n原则 4. 使工作量均衡——像乌龟，而不是兔子。\n原则 5. 建立停下来解决问题的文化，以第一次就把质量做对。\n\
  原则 6. 标准化的任务和流程是持续改进和员工赋能的基础。\n原则 7. 使用可视化控制，使问题无处隐藏。\n原则 8. 只使用可靠的、经过充分测试的技术，服务于你的员工和流程。\n\
  \n### 8.16.1.3 通过长期关系培养和挑战你的员工与合作伙伴\n\n原则 9. 培养能够透彻理解工作、践行理念并将其传授给他人的领导者。\n原则 10.\
  \ 培养遵循公司理念的优秀人才和团队。\n原则 11. 尊重供应商，向他们提出挑战并帮助他们改进。\n\n### 8.16.1.4 问题解决与持续改进驱动组织学习\n\
  \n原则 12. 亲临现场查看，以透彻了解情况。\n原则 13. 通过共识缓慢做出决策，充分考虑所有意见；快速实施决策。\n原则 14. 通过不断反思和持续改进成为学习型组织（Liker\
  \ 2004）。\n\n如果我们仔细审视这 14 项原则，我们会发现它们都是关于信念和价值观的陈述。它们关乎丰田的文化。\n理念关乎丰田的目的及其存在的原因。\n\
  流程关乎丰田认为什么能带来卓越运营——不断消除浪费。\n人员是推动公司前进的动力，而文化则教导人员如何行动、思考和感受，从而朝着共同目标协同工作。\n问题解决是丰田人员集中精力持续改进的方式。\n\
  \n### 8.16.2 生命周期成本分析（LCCA）\n\n生命周期成本分析（LCCA）是一种工具，用于在不同竞争方案中确定最具成本效益的方案，这些方案涉及制造流程、采购、拥有、运营、维护以及最终处置某对象或流程，前提是每个方案在技术上都同样适合实施。例如，对于高速公路路面，除了初始建设成本外，LCCA\
  \ 还考虑了所有用户成本（例如工作区的通行能力降低）以及与未来活动相关的机构成本，包括未来的定期维护和大修。所有成本通常都会折现，并合计为当前价值，即净现值。这个示例可以推广到任何类型的材料、产品或系统。\n\
  \n为了执行 LCCA，确定范围至关重要——哪些方面应包含在内，哪些不应包含？如果范围变得太大，该工具可能变得不切实际，并且在帮助决策和考虑替代方案方面能力有限；如果范围太小，则结果可能会因所考虑因素的选择而产生偏差，使得输出变得不可靠或带有偏见。通常，LCCA\
  \ 一词意味着不包括环境成本，而类似的整体生命周期成本或仅 LCA 通常具有更广泛的范围，包括环境成本。\n\n### 8.16.3 质量成本：劣质质量与优质质量\n\
  \n在计算六西格玛项目的商业案例时，劣质质量成本（COPQ），即因产生缺陷而导致的成本，是一个常用的概念。然而，在质量成本总额中，COPQ 仅代表一定比例。成本不仅仅来自产生故障和修复故障；大量成本来自确保生产出优质产品。本节将质量成本解释为一个更全面的概念，涵盖\
  \ COPQ 和优质质量成本。简而言之，任何在质量完美的情况下本不会支出的成本都属于质量成本。\n\n### 8.16.4 质量成本：不仅仅是故障成本\n\n\
  质量成本有两个主要组成部分：优质质量成本（或符合性成本）和 COPQ（或不符合性成本）。图 8.22 显示了以下内容。\n\n- COPQ 影响：\n  - 因未能满足要求而产生的内部和外部成本。\n\
  - 优质质量成本影响：\n  - 投资于预防不符合要求的成本。\n  - 为评估产品或服务是否符合要求而进行检验的成本。\n\n\n\n\n\n| Sigma\
  \ 等级 | 每百万机会缺陷数 (DPMO) | 质量成本占销售额百分比 (%) |\n|---|---|---|\n| 2 | 308 000 | >40 |\n\
  | 3 | 66 800 | 25–40 |\n| 4 | 6 210 | 15–25 |\n| 5 | 230 | 5–15 |\n| 6 | 3.4 | <1\
  \ |\n\n在工业流程中，目标是以最少的资金生产出高质量、安全水平高的产品——即对其进行衡量。能源效率是精益和可持续制造不可或缺的一部分，能源效率在这一努力中发挥着关键作用。我们应将能源视为一种原材料——那么明智的做法就是管理这一资源——使用更少的原材料来生产相同数量、相同质量的产品（零缺陷）——同时减少二氧化碳排放。\n\
  \n管理任何事物——财务、健康、排放等——的第一步是衡量它。能源强度是量化能源效率的有用指标，因为它不仅考虑了消耗的能源量，还考虑了生产的产量。许多追求能源效率项目的设施都有一名能源经理，对能源使用决策负责。不管你安装的新泵有多高效，如果它设计过度且在低负荷下运行，就不会很高效，例如一台\
  \ 5 hp 的泵仅以 0.5 hp 的功率输送流体。因此，设计和选择最佳泵尺寸对节能工艺很重要。\n\n美国能源部（DOE）的 Better Plants 项目一直与美国的制造商和工业规模能源用户合作，以提高能源绩效。美国能源部的\
  \ Better Plants 项目还提供技术援助、培训、软件和工具，帮助制造商提高能源绩效。该自愿项目为参与者提供广泛的工具和资源，以克服障碍并发现节省成本的机会。超过\
  \ 200 个组织是 Better Plants 合作伙伴，它们共同节省了超过 1 千万亿 Btu 的能源，总计相当于约 53 亿美元的能源成本节约（Lung\
  \ 2018）。\n\n## 8.16.11 成为 ISO 50001 就绪\n\n国际标准化组织（ISO）创建了 ISO 50001，作为一项自愿能源管理标准，帮助组织高效使用能源并降低成本。美国能源部开发了\
  \ 50001 Ready 认可计划，作为指导组织使用 ISO 50001 结构建立能源管理体系的一种方式。50001 Ready 允许组织自我证明这些努力，可以成为追求\
  \ ISO 50001 认证的有用第一步（Lung 2018）。获得 50001 Ready 认可涉及三个步骤：\n\n- 1) 完成 50001 Ready\
  \ Navigator 的 25 项任务，这是一个免费的在线工具，可帮助指导和跟踪进展。\n- 2) 自我证明已完成 25 项 Navigator 工具任务。\n\
  - 3) 随着时间的推移衡量和改进现场能源绩效。\n\n## 8.16.12 能源分析的十步大纲：了解将原材料转化为成品所使用的能源以提高能源效率（Stowe\
  \ 2018）\n\n- Step 1. 识别原材料\n- Step 2. 特征化最终产品\n- Step 3. 参观工厂\n- Step 4. 开发工艺流程（或模块）图\n\
  - Step 5. 编目能源输入\n- Step 6. 识别能源浪费\n- Step 7. 识别能源回收可能性\n- Step 8.  pinpoint 能源效率机会\n\
  - Step 9. 识别新技术机会\n- Step 10. 实施解决方案；能源分析对于能源效率计划应是一个持续的过程\n\n## 8.17 工业环境经理的核心角色\n\
  \n在制造设施环境项目中工作的工业环境经理（IEMs）负责以全面、系统、计划和有文件记录的方式总体管理环境管理体系（EMS），涉及废物最小化或减少以及遵守环境法规和标准。这些经理充当环境伦理的守护者。IEMs\
  \ 与环境管理流程（EMP）团队密切合作，包括工艺操作工程师、质量控制工程师，目标是生产高质量的制造产品，同时优化资源使用并减少废物。他们的任务包括但不限于支持培训新环境工程师和人员：安全、采样、监测、分析、汇总和管理环境数据；准备各种许可以确保合规，并向行业内部和外部利益相关者报告专门的环境绩效信息。这些活动促进了\
  \ EMP 团队、组织结构、规划和资源，以制定、实施和维护环境保护政策（Sroufe 2003）。\n\n## 8.18 IEMs 的目标\n\nIEMs 的主要目标是持续提高行业和企业监管合规性，同时减少废物。通常，环境经理遵循\
  \ PDCA 循环（图 8.25）。该图显示了首先制定环境政策、规划环境管理流程，然后实施它的过程。该过程还包括检查系统并采取行动。该模型流程通过组织审查和修订系统持续指导改进（ISO\
  \ 2018b）。这是一个可被广泛组织使用的模型——从制造设施到服务行业再到政府机构。\n\n## 8.19 环境合规与合规保证\n\n环境合规及其保证意味着符合环境法律法规、标准以及其他要求，例如运营许可。近年来，环境问题导致全球各监管环境中合规要求的数量和范围显著增加。密切相关的是，环境问题和合规活动越来越多地与\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_419_0.png)\n\n企业绩效目标保持一致，并在一定程度上得到整合，以避免冲突、浪费的重叠和差距（Tarantino\
  \ 2008）。\n\n遵守上述要求和义务需要满足某些条件。通常包括\n\n- 开发全面的电子表格和合规保证矩阵\n- 管理监测项目或计划，确保各种许可中要求的监测已在正确位置、对正确参数并以正确频率完成\n\
  - 预处理、执行计算并验证数据是否符合任何警报或报告水平\n- 为州和联邦监管机构生成常规合规报告\n\n上述管理可能复杂且耗时，导致设计用于管理环境合规的软件系统使用量不断增加。这些通常被称为环境数据管理系统。选择环境合规软件时必须考虑标准：经过验证的能力、高性能、透明、可追溯的数据处理、强大的计算引擎、先进的因子处理、简单集成、自动化工作流程和质量保证，以及灵活的报告和数据提取。\n\
  \n## 8.20 废物减少\n\n废物减少或最小化是一套旨在减少产生的废物量的流程和实践。通过减少或消除有害和持久性废物的产生，废物最小化支持促进更可持续社会的努力。废物减少涉及重新设计产品和流程和/或改变社会消费和生产模式。\n\
  \n管理废物最具环境资源效率、经济高效且成本效益最高的方式通常是首先避免出现问题。管理人员将废物减少视为大多数废物管理策略的主要重点。适当的废物处理和处置可能需要大量时间和资源；因此，如果以有效、安全和可持续的方式进行，废物最小化或减少的好处可能相当可观。\n\
  \n传统的废物管理侧重于废物产生后的处理，集中于再利用、回收和废物能源化（另见附录 G）。\n\n\n\n\n废物减量涉及在制造过程中避免产生废物的努力。为了有效实施废物减量，IEM\
  \ 需要了解生产过程、从摇篮到坟墓分析（从材料开采到其回归地球的追踪）以及废物组成的细节。\n\n各国废物的主要来源各不相同。在工业化国家和发展中国家，大多数废物来自各种制造业，其次是采矿、建筑和建筑拆除以及商业。工业废物通常与供应链中的要求相关。在\
  \ 1980 年代，供应链管理（SCM）一词被提出，以表达将关键业务流程整合的需要，从终端用户到原始供应商（Oliver and Webber 1992）。原始供应商是指为客户和其他利益相关者提供增值产品、服务和信息的供应商。SCM\
  \ 背后的基本思想是，公司和企业通过交换有关市场波动和生产能力的信息而参与供应链。\n\n例如，一家德国造纸厂每天以 100 吨可回收纸作为其原材料供应。处理产品的公司可能会坚持要求使用特定的包装进行运输，因为它符合下游需求。另一个例子，一家巴西废金属回收公司接收超过\
  \ 50 吨的废铝罐进行再加工和回收。巴西回收了其铝罐产量的 90.4%，相当于每年 145 亿个饮料罐，位居世界第一，超过日本 83.2%的回收率。巴西已连续八年位居铝罐回收榜首（AFG\
  \ 2018）。\n\n## 8.20.1 再利用和回收工艺\n\n- **废料再利用**\n  废料可以立即在制造线的开始处重新纳入生产，从而不成为废物产品。许多行业常规地这样做；例如，造纸厂会将任何损坏的卷筒退回生产线的起点，而在塑料制品的制造中，边角料和废料会被重新纳入新产品中。\n\
  - **改进质量控制和过程监控**\n  可以采取措施确保拒收批次的数量降至最低。这是通过增加检验频率和检验点数量来实现的。例如，安装自动连续监测设备可以帮助及早发现生产问题。\n\
  - **废物交换**\n  这是指一个过程的废物产品成为第二个过程的原材料。废物交换是减少无法消除的废物处置量的另一种方式。\n- **运送至使用点**\n \
  \ 这涉及将 incoming 原材料或组件直接运送到组装或在制造过程中使用的地点，以最大限度地减少搬运和保护性包装或外壳的使用。\n- **零废物**\n \
  \ 这是一种整体系统方法，旨在消除源头以及供应链各环节的废物，意图不产生废物。这是一种设计理念，强调废物预防而非末端废物管理（Das 2005）。\n\n##\
  \ 8.20.2 废物最小化的益处\n\n废物最小化可以保护环境，并且通常会带来积极的经济效益。废物最小化可以改善以下方面：\n\n- **高效的生产实践。**\
  \ 废物最小化可以实现每单位原材料投入的产品产出更多。\n- **经济回报。** 更有效地使用产品意味着降低采购新材料成本，从而改善公司的财务绩效。\n- **公众形象。**\
  \ 公司的环境形象是其整体声誉的重要组成部分，而废物最小化反映了积极的环境保护举措。\n- **产品质量。** 新的创新和技术实践可以减少废物产生并提高生产阶段投入的质量。\n\
  - **环境责任。** 最小化或消除废物产生使得更容易满足环境法规、政策和标准的目标。废物的环境影响将被降低。\n\n## 8.20.3 关键特征：工业环境管理流程\n\
  \n工业环境管理流程（IEMP）及环境管理人员的角色：\n\n- 作为改善环境绩效和信息的主要工具或流程，“设计、污染控制和废物最小化、培训、向高层管理汇报以及目标设定。”\n\
  - 为组织的环境事务提供系统化的管理方式。\n- 是行业整体管理结构中处理其产品、服务和流程对环境产生的即时和长期影响的方面。IEMP 协助组织制定、控制和监控政策。制定一些详细的电子表格和合规矩阵。\n\
  - 为组织通过资源分配、责任分配以及对实践、程序和流程的持续评估来解决环境问题提供秩序和一致性。\n- 创造来自高级管理人员和员工的环境认同感，并分配问责和责任。\n\
  - 为实现目标和期望绩效设定培训框架。\n- 帮助所有参与流程的人员更好地理解立法要求，以确定产品或服务的影响、重要性、优先事项和目标。\n- 专注于系统的持续改进以及实施政策和目标以达到预期结果的方式。这也有助于审查和审计\
  \ IEMP 以发现未来机会。\n- 鼓励承包商和供应商建立自己的 IEMP。\n- 通过直接上传促进向联邦、州和地方政府环境机构的记录保存和报告/电子报告。\n\
  \n## 问题\n\n8.1 一所主要大学的工程学院希望开发一个经验模型来预测其本科生完成学业的成功率。\nA 在这项研究中你会用什么作为响应或结果变量？\n\

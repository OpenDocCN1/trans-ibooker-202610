  \ CO 几乎全部来自火灾；杂项 PM-10 几乎全部来自铺装和未铺装道路、建筑工地和农业来源产生的逸散性粉尘。\n\nᵃ 非公路包括船只、飞机、火车、建筑设备、园林和园艺设备等。\n\
  \n列出排放一种或多种空气有毒物质的来源类别并公布对这些类别进行监管的时间表。\n\n《清洁空气法》将 HAPs 的主要来源定义为具有排放潜在量的固定源，该潜在量为名单上任一种\
  \ HAP 为 10 T/Y 或任何组合 HAP 为 25 T/Y。示例包括化学品综合体和石油炼油厂。《清洁空气法》为 HAPs 规定了非常高的污染控制技术水平，即\
  \ MACT（最大可行控制技术）。小型区域源，如干洗店，排放的 HAP 吨位较低，但总体上它们是 HAPs 的重要来源。可以通过工作实践的改变，例如材料替代和其他污染预防策略来实现排放减少。\n\
  \nHAPs 通过典型的吸入或摄入途径影响人类健康。HAPs 可在鱼类组织中积累，污染物浓度会沿着食物链向人类累积。许多这些持久性和生物累积性化学物质是已知的或疑似致癌物。汞已特别成为监管的重点，因为它在煤炭燃烧过程中释放。因此，它是少数在环境中广泛存在的\
  \ HAPs 之一。特别令人担忧的是，儿童在产前接触甲基汞（USEPA 1997, 2004a）。\n\n第四章涉及酸沉降，要求全国 SO₂ 排放量从 1980\
  \ 年水平减少 1000 万 T/Y，主要来自发电厂。它促进节能和洁净煤技术，并利用创新的基于市场的 SO₂ 减排体系，其中公用事业的 SO₂ 排放配额可以买卖。此外，USEPA\
  \ 必须制定公用事业锅炉的 NOₓ 新源性能标准（NSPS）修订版。\n\n第五章建立了新的联邦运营许可计划，由各州管理。各州有三年时间在 EPA 批准下实施许可计划，到\
  \ 1998 年所有州均已遵守。许可费将用于支付该计划的费用。许可计划必须至少包括适用于每个来源的全部《清洁空气法》要求、合规时间表以及监测和报告要求。\n\n\
  ## 4.12 显著恶化预防（PSD）许可程序\n\n### 4.12.1 引言\n\n显著恶化预防（PSD）计划于 1977 年 8 月 7 日建立，此后美国国会大幅修订了联邦《清洁空气法》，并概述了详细的\
  \ PSD 计划。联邦 PSD 计划载于联邦《清洁空气法》第 C 部分（第 160 条至第 169B 条）。PSD 计划的制定是为了防止美国大型工业空气污染源对“达标区”造成重大的环境影响。达标区是指空气质量符合\
  \ EPA 规定的标准（也称为 NAAQS）的美国地区。在 PSD 计划制定之前，大型工业设施的建设项目在许可时主要目标是不使问题地区的空气污染恶化，如果可能的话加以改善。国会认识到，这需要扩展以确保那些拥有清洁健康空气的地区保持现状，并且工业活动不会对受保护的（例如\
  \ I 类、荒野）地区造成重大影响。\n\n### 4.12.2 PSD 计划目标\n\n- 经济增长与保护清洁空气资源相协调。\n- 保护公众免受空气污染的不利影响。\n\
  - 保护和改善国家公园和荒野地区的空气质量。\n\nPSD 计划并不完全阻止来源增加排放。事实上，要使项目受 PSD 审查，需在采用控制设备后排放量有显著增加。相反，PSD\
  \ 计划旨在（USEPA 1990）\n\n- 防止环境空气质量显著恶化\n- 确保符合所有 NAAQS\n- 保护公众健康和福祉免受即使在低于 NAAQS 的空气污染水平下可能发生的任何不利影响\n\
  - 保护、保护和改善分类的 I 类地区的空气质量（包括国家公园、国家荒野地区、国家纪念碑、国家海滨和具有特殊国家或区域自然、娱乐、风景或历史价值的其他地区）\n\
  - 确保经济增长以与保护现有清洁空气资源一致的方式进行，并防止任何新的不达标地区的形成\n- 确保对任何适用 PSD 许可要求的地区增加空气污染的任何决定，只有在对该决定的一切后果进行仔细评估，并在决策过程中为知情公众参与提供充分程序机会后才作出\n\
  \nPSD 计划通过审查 PSD 申请以确保应用 BACT 的要求，并符合 NAAQS、适用的 PSD 增量浓度，以及评估能见度影响、能源和环境影响、土壤和植被影响以及增长影响，从而保护当地空气质量并保护具有特殊价值的地区。该计划包括公众参与决策过程的机会。\n\
  \nPSD 规章适用于新的“主要固定源”和“主要改动”。固定源包括属于同一工业分组、位于毗邻或相邻物业上并受共同控制的所有排放活动。“主要改动”是指对主要固定源的物理改变或运行方法改变，该改变将导致任何受管制污染物的同期净排放量显著增加。在确定拟议增加是否会导致显著净增加时，必须执行若干详细的计算。\n\
  \n只有当主要来源或改动的预期或现有位置已被 EPA 正式指定为任何存在 NAAQS 的污染物的“达标”或“未分类”时，才会触发 PSD 审查。相反，非达标新源审查（NNSR）适用于位于不符合\
  \ NAAQS 的地区的新主要来源或现有来源的主要改动。NNSR 要求根据非达标地区进行定制。所有非达标 NSR 计划都必须要求\n\n- 安装最低可实现排放率（LAER）\n\
  - 排放抵消\n- 公众参与机会\n\n整个建设前许可计划，包括 PSD 和 NNSR 许可计划，均称为新源审查（NSR）计划。PSD 审查和 NNSR 均按污染物进行。例如，设施可能排放多种空气污染物；然而，根据每种污染物的排放量大小，可能只有一种或少数几种受\
  \ PSD 许可要求约束。由于 EPA 未为温室气体（GHG）制定 NAAQS，因此 NNSR 计划不适用于温室气体。\n\n\n\n\n\n# 表 4.8 燃煤发电厂\

  \ 95 | 3.0 | 4 |\n| 110 | 0.5 | 0.5 |\n\n## 5.14 需要多少新鲜外部空气才能将工作场所空气中的甲乙酮浓度维持在100\
  \ ppm以下（即TLV–TWA）？\n\n在脱脂操作中，预计一个8小时班次内蒸发3加仑的MEK，而通风质量被评为平均水平。另外，如果操作在带有50 ft²开口和100\
  \ ft/min面速度的封闭通风柜中进行，请计算所需空气量。温度为81 °F，压力为1 atm。MEK的比重为0.81，分子量为72.1。k值为1/8（0.125）。使用以下方程计算所需的通风稀释空气量。\n\
  \n$$Q_v = \\left(\\frac{Q_m R_g T}{k C_{ppm} P M}\\times 10^6\\right)$$\n\n其中$Q_v$是通风稀释空气流量，单位ft³/min；$Q_m$是蒸发速率；$M$是挥发性化学品的分子量；$R_g$是理想气体常数；$T$是绝对温度；$k$是通风安全系数；$C$是蒸汽浓度，以ppm为单位。\n\

  # 工业废物最小化方法论


  工业生态学、生态工业园区以及制造过程的强化与集成


  ## 9.1 引言


  在美国，工业界每年产生并处置约20亿吨非危险废物。这一数量相当于每人每天产生超过200磅工业废物。非危险废物的最大工业来源是制造业（约76亿吨/年）、油气生产（21亿至36亿吨/年）以及采矿业（超过14亿吨/年）。贡献量较小的来源包括发电厂（粉煤灰和烟气脱硫废物）、建筑废物、医院传染性废物以及废轮胎。美国工业危险废物的产生速率约为每年7.5亿吨（Allen
  and Shonnard 2012; Allen and Rosselet 1997）。一旦这些物料被认定为危险废物，其管理、处理、储存和处置的成本便会急剧上升。本章描述了一些已经成功运行的特定工业废物最小化工艺和技术，并提供了其他方法论，包括工业生态学、生态工业园区（EIP）、制造过程强化与集成。制造过程中产生的废物（气态、液态或固态）或副产物将被回收。从废物流中回收的材料和能源要么在工厂内重复使用，要么作为原料出售给另一家工厂。无论在实践上还是理论上，都有可能通过将所有废物回收为可制成消费产品的材料，从而使某些工业设施几乎完全与环境隔离。此类设施的一个例子是燃煤发电厂。一种电子束-氨转化装置将氨加入废气中，然后对废气进行电子辐照，生成硝酸铵和硫酸铵，作为原料出售给化肥制造商；此外还有通过吸附从烟气中强化回收汞，以及从燃煤电厂回收汞的工艺。这两个工艺的详细内容将在本章后面的案例研究中给出。此外，还提供了两个独立的案例研究，重点介绍了一种盈利的工业“副产物转能源”回收方式，即利用热电联产发电，以及通过气化制浆过程的副产物黑液来生产化学品和能源。


  我们的目标是改进工业过程，使服务和制成品能够在无废物的情况下生产。但重要的是要认识到，即使在污染预防方面做出了所有合理努力之后，某些制造过程仍不可避免地会产生废物。因此，在某些情况下，使用转化技术可能比实施污染预防计划更为合适：许多工业废物可以通过加工处理，使其成为另一个行业的可行物料输入，或者成为由若干关联行业组成的工业集群的一部分——这正是“工业生态学”运动的一部分。


  ## 9.2 工业生态学


  工业生态学（IE）是研究工业系统中物质和能量流动的学科。全球工业经济可以被建模为一个工业过程网络，该网络从地球提取资源，并将这些资源转化为可买卖的商品，以满足人类的需求。工业生态学力求量化物质流动，并记录支撑现代社会运转的工业过程。工业生态学家通常关注工业活动对环境的影响、地球自然资源供应量的使用以及废物处置问题。工业生态学是一个不断发展的多学科研究领域，融合了工程学、经济学、社会学、毒理学和自然科学等方面（Alleby
  2006; Ashton 2009; Jensen 2011）。


  工业生态学为理解当前实践并在此基础上进行合理改进提供了理论科学依据。它涵盖了能源供应与使用、新材料、新技术、基础科学、经济学、法律、管理和社会科学等方面的研究。它还包括并行工程、环境设计（DFE）、去物质化、过程污染预防、废物转化、废物交换、副产物利用以生产新产品、废物最小化和回收利用，其中“零排放”是一个重要的子集。工业生态学也可以作为一种政策工具。它是对一个系统的视角，在该系统中，人们寻求优化从原始材料到成品材料、到部件、到产品、到废弃产品、再到最终处置的整个物料循环。需要优化的因素包括资源、能源和资本。


  工业生态学是一个动态的、基于系统的框架，通过最大限度地减少能源和材料的使用、确保人们可接受的生活质量、将人类活动对生态的影响降至自然系统能够维持的水平，以及保持工业、贸易和商业系统的经济可行性，来实现对人类活动的可持续管理。工业生态学的方法包括：（i）将科学应用于工业系统，（ii）界定包含自然世界的系统边界，以及（iii）寻求优化该系统。在这种背景下，工业系统不仅适用于私营部门的制造业和服务业，也适用于政府运营，包括基础设施的提供。


  工业生态学是一个将工业作为与自然系统相互依存的生命系统进行设计和运营的框架，因此理解工业代谢的概念至关重要。生物圈的代谢近乎完美的回收系统，因为其众多组成部分都具有生物再生的能力；而在工业中，代谢在很大程度上依赖于系统内无法再生的化石燃料的燃烧。


  因此，工业代谢的研究者会调查具有环境意义的关键工业物料的物质流量及其相关排放。有了这些信息，工业生态学家就能更好地平衡环境问题与经济绩效，将不可再生资源的真实价值和环境污染的真实成本纳入考量。对地方和全球生态约束理解的加深，进一步推动了这些努力。


  工业生态学支持在产品与过程的整个生命周期内协调设计。工业生态学能够在长期背景下创造短期创新。虽然工业生态学的许多初期工作集中在制造业，但工业系统的完整定义包括服务、农业、制造业、军事和其他公共运营，以及垃圾填埋场、供水和污水处理系统、交通系统等基础设施。


  当《科学美国人》发表了一篇由通用汽车公司两位研究人员撰写的文章时，“工业生态系统”的概念受到了广泛关注，该文章指出，为工业活动副产物寻找“村门之外空地”的日子正在迅速消逝（Frosch
  and Gallopoulos 1989）。工业生态学的概念催生了越来越多的研究和活动。在最基本的层面上，工业生态学描述了一个系统，其中一个行业的废物（输出）成为另一个行业的原材料（输入）。在这个“如图9.1所示的闭环”中，被浪费的材料将会减少。因此，如果企业能够将废物转化为“食物”，它们就能大幅减少污染和对原材料的需求（Van
  der Ryn and Cowan 1996）。


  许多行业长期以来一直存在着共生关系，废物和材料在内部或由他人转化。例如，金属工业在生产过程中使用废料；电弧炉（EAF）的出现提高了钢铁制造商使用废料的能力。石化和化学公司擅长为废料寻找新的生产用途或市场（Richards
  et al. 1994）。橡胶、塑料、纸张和玻璃回收的增长为以前被丢弃的材料创造了新的用途。正如欧内斯特·洛（Ernest Lowe）所建议的那样，工业生态学是一个指导工业系统转型的广泛整体框架。从线性模型（矿坑到生产者、到消费者、再到垃圾场）向更接近生态系统循环流动的闭环模型的转变，激发了许多具有前瞻性的公司、多所大学以及美国环境保护局和能源部等政府机构的新思维方式（Low
  and Warren 1996; Lowe 1995, 2001）。


  ### 9.2.1 什么是生态工业园区？


  根据欧内斯特·洛、约翰·沃伦、安德烈亚斯·海因等人的说法，生态工业园区（EIP）是一个制造业和服务业企业的社区，这些企业通过在管理环境与资源问题（包括能源、水和材料）方面的协作，寻求增强的环境和经济绩效（Lowe
  and Warren 1996）。通过合作，该企业社区寻求获得一种集体利益，这种利益大于每个公司仅优化其自身绩效所能实现的个体利益之和。生态工业园区的目标是在参与公司提高经济绩效的同时，最大限度地减少其环境影响。


  工业活动将废物释放到地方、区域，并最终释放到全球生态系统中。自20世纪70年代以来，各国颁布了无数法律法规，以限制对空气和水的排放，并规范固体和危险废物的处置。此外，工业活动还会导致非点源




  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_428_0.png)

  **图 9.1** 末端治理与零排放方法的示意图。*来源：* 引自日本东京荏原株式会社（2010）和 Das（2005）。


  由一般径流、泄漏或非法倾倒造成的污染。传统上，商业与环境被视为天生的敌人。长期以来一直认为“环境保护越多，企业成本越高”；然而，研究和业务运营的新发展正在挑战这一假设。许多公司如
  3M 早已认识到将环境原则应用于业务运营的经济效益。EIP 的目标是最大限度地减少工业活动的生态影响并改善业务绩效。在美国和加拿大，多个项目正在测试这一理念，该理念已在欧洲证明了其有效性，或许最引人注目的是丹麦卡伦堡，如
  Hein 等人（2015）；EIO（2012）；Lowe（2001）及其他人所讨论的。


  EIP 是一组共享资源以提高盈利能力和减少环境影响的企业。EIP 的实施可显著促进可持续经济的创建。尽管有这一前景，EIP 的实际发展仍具挑战性，因为必须考虑多种因素。不仅技术、经济和环境因素相关，而且


  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_430_0.png)

  **图 9.2** 电子束-氨法将 $SO_2$ 和 $NO_x$ 转化为肥料的示意图（Das 2005）。


  其他机械收集器用于去除颗粒物，例如飞灰。气体随后被输送至喷雾冷却器并加湿冷却至 160–200°F 范围内的温度，即最佳温度。此时按化学计量量引入无水氨。氨化烟气被送入电子束反应室，在那里被辐照（1.5
  Mrad 剂量），产生硝酸盐和硫酸盐阴离子。这些物质与氨反应生成 $NH_4NO_3$ 和 $(NH_4)_2SO_4$ 的干颗粒混合物。


  ### 9.2.3.1 优点和缺点


  电子束工艺至少有五大优点：


  - 1) $SO_2$ 和 $NO_x$ 在同一台设备中通过添加一种化学物质一起被去除。该方法可以满足所有新源性能标准（NSPS）对 $SO_2$ 去除的要求，因为它有潜力去除
  98% 的 $SO_2$ 和 70–90% $NO_x$，取决于工艺条件（CFR-40 1999）。在极低的功率消耗（占机组的 1%）下可实现高 $SO_2$
  去除。大多数能量消耗用于 $NO_x$ 减排。NSPS 标准很复杂，但在 3–6% 硫煤的情况下，需要 90% 的减排量。

  - 2) 挥发性有机化合物也在工艺中被去除。

  - 3) 由于没有废物产生，因此无需制定处置方案。

  - 4) 由于工艺产生的是干产品，避免了与磨蚀性和腐蚀性浆料相关的高维护成本。

  - 5) 产生可销售的产品。


  与该工艺相关的相应缺点和挑战包括需要将氨注入保持在化学计量点附近以缓解任何氨泄漏。此外，大型电子束发生器对于大规模工厂是必需的，因为当前电子束的射程有限。该工艺的技术问题包括关于能否将电子加速器放大到全尺寸应用以及该技术相关的电力需求的问题。为了加速辐射，已开发并申请专利了一种联合微波-电子束工艺，这种混合辐射系统适用于大规模工厂（Das
  2005；Ebara 2010）。


  ### 9.2.3.2 成本分析


  表 9.1 提供了年度成本分析，包括安装和运行 $SO_2$ 和 $NO_x$ 的电子束-氨转化系统的预计整体投资回报。成本分析显示，燃煤发电行业可从该工艺中每年赚取约
  1100 万美元。该系统本身比传统的烟气处理便宜得多——建设成本低 25%，运行成本低 20%——并且需要的空间明显更少。



  ## 9.8.14 经济开发机会


  生物炼制厂可能具有重要的经济开发效益，源于增强造纸/纸浆行业的竞争力。财务分析说明了相对于汤林森系统而言具有吸引力的财务回报和显著增加的现金流的潜力。相关的经济开发效益包括在该行业保留和增加就业，并可能通过增加对纸张生产和生物质供应原材料的需求，在农村和半农村地区增加就业，并在更长


  采用 BLG 专门取代锅炉并生产更多电力的制浆厂可以盈利（Larson et al. 2003, 2006a）。但目前，具有多样化产品范围的高度开发的生物炼制厂增加了许多新的选择，如果
  BLG 技术能解决几个技术挑战，这些选择可能在经济上变得有吸引力（Bajpai 2008）。当前的 BLG 技术重新激发了人们对生物炼制厂的兴趣，并具有将 BLG
  扩展到广泛产品组合的能力，可改造为不同类型的工厂，包括面临关闭的中型工厂。Chemrec 在瑞典皮特奥的开发工厂是发展最成熟的 BLG 模型，具有强大的行业势头。Volvo
  Technology Transfer AB 及其附属公司现持有多数股份。生物炼制厂旨在生产纸浆（和纸张）并利用 BLG 合成气生产 DME 燃料。DME 燃料清洁燃烧且优于柴油。Chemrec
  已在皮特奥成功实施了 DME 演示。Chemrec 2020 计划预计有五座大型和三座小型 BLG DME 和 BLG MF 工厂。



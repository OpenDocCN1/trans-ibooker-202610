  \ 60、61 和 63 部分下任何适用性能标准的排放限制。使用量增加的设备和设备不 subject 于 BACT 审查。PSD BACT 仅适用于触发 PSD\
  \ 的污染物。其他污染物可由次要许可机构评估。\n\n- 3) 进行环境空气质量分析。每个 PSD 新源或现有源的修改都必须\n\n\n\n进行空气质量分析，以证明其新增污染物排放不会违反适用的\
  \ NAAQS 或适用的 PSD 增量。年利用率影响增加的设备将纳入长期空气质量分析。\n\n空气质量影响分析（AQIA）首先对每种污染物进行初步建模，以确定申请人是否可以免于详细分析和施工前监测。如果某一污染物在给定平均时段内的预计环境浓度增加低于\
  \ PSD *显著影响水平*（SILs）和*显著监测浓度*（SMCs），则无需对该污染物进行进一步的环境影响分析。对于那些平均时段内影响超过 SIL 的污染物，则进行完整影响分析（考虑其他消耗增量的源），以证明符合\
  \ PSD 增量和 NAAQS。建模的基准年份应为最近两年的排放量。\n\n*联邦土地管理者*（FLMs）关于评估重大项目对一类区域影响的指南是 FLMs 的*空气质量价值*工作组（FLAG）第一阶段报告（修订版）（国家公园管理局\
  \ 2010）。FLAG 工作重点关注空气污染物——主要是 PM、二氧化氮、二氧化硫、硝酸盐、硫酸盐和臭氧——如何影响国家公园管理局、美国鱼类和野生动物管理局以及美国农业部林务局管理的区域中的健康和状态资源。FLAG\
  \ 子组集中在四个关键领域：（i）能见度；（ii）湿沉降和干沉降对水生和陆地的影响；（iii）臭氧对陆地的影响；（iv）流程和政策问题。\n\n- 1）*分析对土壤、植被和能见度的影响。*申请人必须分析其拟议的排放增量是否会损害能见度、影响土壤或植被。申请人不仅需要考察源排放对这些资源的直接影响，还必须考虑与拟议排放或改造相关的商业、住宅、工业及其他增长所带来的影响。\n\
  \n- 2）*不得对一个一类区域产生不利影响。*如果州机构收到可能影响一类区域的 PSD 许可申请，州环境监管机构将通知*联邦土地管理者*（FLM）和负责直接管理这些土地的联邦官员。这些官员负责保护一类区域中与空气质量相关的价值，并与州机构协商，以确定是否有任何拟议项目会对一类区域产生不利影响。\n\
  \n如果 FLM 证明拟议源或改造的排放将损害与空气质量相关的价值，即使排放水平不会导致违反 NAAQS 或允许的空气质量增量，FLM 仍可建议审查机构拒绝发放许可证。如果州环境监管机构确定所有要求均已满足，则仍可颁发许可证。\n\
  \n- 3）*进行充分的公众参与。*在州对 PSD 申请采取最终行动之前，需要满足具体的公众通知要求，包括《州环境政策法案》和公众评议期。\n\n## 4.14\
  \ 最佳可用控制技术\n\n### 4.14.1 引言\n\nBACT 定义为：\n\n> 一种排放限制……基于对每种污染物的最大减排程度……考虑能源、环境和经济影响及其他成本……通过应用生产工艺或可用方法、系统和工艺……\n\
  \n本节回顾该定义中的重要要素，并描述为拟议的新源或现有源的改造满足 BACT 要求所必须采用的方法。\n\nNSR 和其他空气质量许可证要求新建或改造的源采用\
  \ BACT 建设。由于新建或改造的源需要满足 BACT 要求，这为控制技术开发者提供了巨大的激励，以证明其产品比竞争产品更好或以更低成本提供最大程度的污染物减排。如果一项新技术在考虑能源、环境和经济影响及其他成本后，能够比现有设备更大幅度地减少排放，则\
  \ BACT 要求采用该技术。这种持续迫使空气污染排放源采用改进技术的要求被称为*技术强制*。\n\nBACT 旨在包括末端控制措施，如洗涤器或袋式除尘器；工艺变更，如从有机溶剂改为水性涂料；以及操作措施，如检查和维护阀门和法兰以减少逸散性排放。其意图是确保没有其他可行技术能够实现更低的排放。\n\
  \n然而，该定义也规定，对某一源的 BACT 评估应在逐案基础上进行，并考虑该源的特征和限制。定义要求评估针对所考虑源的特定能源、环境和经济影响及其他成本。如果一项污染控制技术应用于特定源时这些影响过大，则该技术在该案例中不被视为\
  \ BACT。在另一种情况下，不同条件可能导致不同结论。\n\n在以下各节中，将提供几个与 BACT 类似但适用于特殊情况的术语的附加定义。接下来讨论拟议项目\
  \ BACT 确定所采用的策略。然后描述确定 BACT 的“自上而下”方法。这是大多数许可机构所要求的方法。最后，给出若干确定 BACT 的示例。\n\n###\
  \ 4.14.2 控制技术要求定义\n\n除 BACT 外，在空气质量许可中还会遇到若干其他技术要求术语。它们在概念上都与 BACT 类似——它们定义了适用于不同源类型、不同污染物和/或不同达标状态的排放限值。它们以类似方式确定，在某些情况下可能更为严格。下文讨论其中几个：\n\
  \n- 有多种不同的控制技术要求\n  - RACT——合理可用控制技术\n  - BACT——最佳可用控制技术\n  - MACT——最大可实现控制技术\n\
  \  - LAER——最低可实现排放率\n  - GACT——通用可用控制技术\n- 其他包括 T-BACT、BARCT、RACM 和 BACM。\n\n####\
  \ 4.14.2.1 合理可用控制技术\n\nRACT 是在州实施计划（SIP）要求非达标区现有源减少排放以实现达标时使用的术语。通常，RACT 以禁止性规则的形式实施，适用于州或地区的非达标区。例如，对设计能力大于\
  \ 50,000 Btu/h 的锅炉的 NOx 排放进行限制。RACT 规则要求所有大于该规模的锅炉的 NOx 排放低于 0.5 lb/MMBtu 热输入，并且现有锅炉须在规则颁布之日起三年内达标。RACT\
  \ 要求从未比 BACT 更严格，且通常更宽松，因为它们必须改造现有设备。由于 RACT 适用于现有源，因此新源无需满足这一要求。然而，当新源希望从退役现有源获得抵消量时，这可能会成为一个问题。\n\
  \n#### 4.14.2.2 最佳可用改造控制技术\n\n最佳可用改造控制技术（BARCT）是一个加州术语，指针对不符合加州环境空气质量标准的现有源的改造控制措施。它在《加州清洁空气法》中有定义。RACT\
  \ 和 BARCT 很难区分。两者都适用于现有源。两者都仅适用于非达标区。对于特定源类型，BARCT 有时比 RACT 更严格。加州空气资源委员会定期发布技术备忘录，确定特定源类型的\
  \ BARCT。与 RACT 一样，BARCT 通过加州 34 个空气污染控制区内的禁止性规则实施。\n\n#### 4.14.2.3 最大可实现控制技术\n\n\
  MACT 是 1990 年《清洁空气法修正案》（CAAA）要求对有害空气污染物排放源实施的控制水平。该法案中的定义是：\n\n> ……管理者在考虑实现此类减排的成本以及任何非空气质量健康和环境及能源需求后，确定对于适用此类排放标准的类别或子类别中的新建或现有源而言，受[该法第112条]约束的有害空气污染物排放所能实现的最大削减程度（包括在可实现的情况下禁止排放）……\n\
  \nMACT 法规针对 HAP 的主要排放源，因为 HAP 是不完全燃烧源的副产物。主要源定义为任何每年排放任何一种 HAP 超过 10 吨或所有 HAP 合计超过\
  \ 25 吨的设施。因此，所有大型工业锅炉、工艺炉和固定式内燃机都是潜在的主要源。除钢铁厂或石化设施等主要源外，干洗店、加油站和印刷厂等小型面源在美国也受到管制。MACT\
  \ 可包括工艺变更、材料替代或空气污染控制设备。MACT 在其定义上与 LAER 有所不同，因为它并不打算忽视经济方面的考虑。\n\n\n\n\n\n## 4.14.2.4\
  \ LAER\n\nLAER 是未达标污染物源必须采用的控制技术。如果一个地区臭氧未达标，则对排放臭氧前体物——氮氧化物（NOx）和挥发性有机化合物（VOCs）——的新建或改建源，将要求采用\
  \ LAER。LAER 定义如下：\n\n- 对任何源而言，其排放速率应反映：\n- a) 任何州实施计划中对此类或该类源所规定的最严格排放限制，除非拟建源的业主或运营者证明该等限制无法达到；或\n\
  - b) 此类或该类源在实践中达到的最严格排放限制，以两者中更严格者为准。\n\nLAER 的严格性在于它没有 BACT 定义中那样的可通融情形。虽然仍有“除非拟建源的业主或运营者证明此类限制无法实现”的规定，但该规定仅适用于实施计划中确定的控制措施，且任何“在实践中实现”的控制措施都必须采用。这一措辞的后果是，经济可行性不被考虑，拟建源必须安装已在“实践中实现”的最严格控制措施。在实际应用中，对于“实践”发生在美国境外时是否算“在实践中实现”，一直存在一些争议（USEPA\
  \ 1995c）。\n\nEPA 根据州实施计划（SIP）指南，使用 LAER 来判断新建或改建的主要固定源的排放是否可接受。当新建固定源位于未达标空气质量区域时，必须采用\
  \ LAER 标准。它是严于最佳可用控制技术（BACT）和合理可用控制技术（RACT）标准的最严格空气污染标准，无论该控制技术的成本如何。\n\n## 4.14.2.5\
  \ 一般可用控制技术（GACT）\n\nGACT 与 MACT 一样，都是针对有害空气污染物控制的术语。GACT 是适用于非主要有害空气污染物源的控制技术标准。由于这些源排放的有害空气污染物量较小，GACT\
  \ 可能不如 MACT 严格，不过对于某些已颁布 MACT 标准的有害空气污染物源类别，GACT 标准与之相同。\n\n## 4.14.2.6 毒性最佳可用控制技术（T-BACT）\n\
  \n毒性最佳可用控制技术（T-BACT）一词由加利福尼亚州南海岸空气质量管理局（SCAQMD）首创，用于确定适合控制有毒空气污染物的技术。该术语被加利福尼亚州其他几个地区采用，适用于这些辖区内新建的有毒空气污染物源，这些源因排放而导致的估算健康风险超过阈值，即每\
  \ 100 000 人中出现 1 例由这些排放导致的癌症。在实践中，T-BACT 控制技术几乎在所有情况下都与 PM 和 VOC 的控制技术相同，因此该术语并未广泛使用。关于有毒空气污染物和健康风险的更完整讨论，请参阅\
  \ SCAQMD（1995）和 CAPCOA（1993）。\n\n## 4.14.2.7 合理可用控制措施与最佳可用控制措施\n\n合理可用控制措施（RACM）和最佳可用控制措施（BACM）是\
  \ EPA 制定的控制措施指南，旨在纳入州实施计划（SIP）。虽然这些术语可适用于任何污染物，但最常用于 PM10 源。RACM 和 BACM 分别针对中度和严重\
  \ PM10 未达标区域。RACM 和 BACM 技术指南是根据1990年《清洁空气法修正案》（CAAA）第190条的要求，针对三类主要 PM10 源制定的：城市逸散性粉尘、住宅木材燃烧，以及有计划的林业和农业烧除。制定这些措施是为了用作禁止性规则，类似于实施\
  \ RACT 的规则，旨在减少 PM10 排放，以使这些 PM10 未达标区域达标。被认定为 RACM 和 BACM 的措施几乎肯定会列入备选技术清单，作为 PM\
  \ 源可能采用的 BACT 加以考虑。\n\n## 4.14.3 BACT 选择策略\n\n大多数辖区要求所有新建或改建源均采用 BACT。法规除了定义该术语外，很少具体说明如何确定\
  \ BACT。4.14.4 节描述了 EPA 为正式确定 BACT 而制定的“自上而下”方法。该“自上而下”过程全面、有序且完整。然而，实施过程可能代价高昂，并可能导致申请人被要求采用其不想要的技术。这种两难境地有时可以避免。\n\
  \n在大多数情况下，申请人和许可机构会就所许可源的最严格技术达成一致。如果申请人决定使用该控制技术，则无需进行“自上而下”的 BACT 过程；在许可过程早期接受这一最严格技术，可以大大加快其他审批步骤。\n\
  \n在其他情况下，可通过与许可机构事先达成协议，限制“自上而下”过程中审查的技术数量。可以通过引用在类似环境中对类似工艺已完成的 BACT 分析，并让机构认可这些分析适用，来限制数量。\n\
  \n在 BACT 方案中，可以总结项目描述、陈述假设，并确定将作为 BACT 分析一部分考虑的技术。该文件可以明确划定 BACT 分析的边界，避免在后续过程中出现意外。通常以技术可行性作为纳入技术的依据，不可行的技术可在分析“正式”开始前排除。提交\
  \ BACT 方案后，通常只需一个电话即可就分析边界达成一致。\n\n在很多情况下，BACT 分析中只考虑少数（往往只有两种）技术，此时许可机构可能接受正式程度远低于“自上而下”方法的分析。简洁通常使分析更易理解，并让人有机会清晰阐述要点，而不必使用不必要的套话。\n\
  \n## 4.14.4 自上而下的 BACT 分析\n\n1987 年，EPA 发布了一份备忘录，描述了如何采用“自上而下”方法确定特定源的 BACT 构成。该备忘录随后在\
  \ 1996 年以法规条文的形式得到落实。“自上而下”方法的基本准则是：在审查何种控制技术构成 BACT 时，应从最严格的技术——即减排量最大的技术——开始。申请人若想否决这一最严格技术，必须证明其不可行。不可行的依据可以是技术不可行，或能源、环境、经济或其他成本影响不可接受。分析开始时的假设是，最严格的技术可行且应采用，除非有相反证明。对严格程度依次降低的技术逐一证伪其可行性的过程会持续进行，直到找到一种可行的控制技术，该技术随即成为该特定源的\
  \ BACT。以下小节将描述“自上而下”BACT 分析所要求的步骤。\n\n## 4.14.5 识别技术\n\n“自上而下”过程的第一步是识别将在分析中考虑的控制技术。从历史上看，围绕这一问题曾发生过激烈争论，主要涉及监管机构提议列入“自上而下”清单的技术是否可获得。在解决这一问题时，BACT\
  \ 条款中关于纳入“加州空气污染控制官员组织认定技术上可行的任何其他排放控制技术……”的规定，可能会引起人们提议考虑许多尚未商业化的不同技术（CAPCOA 1993）。\n\
  \nSCAQMD 使用的可获得性标准包含其他地方所用标准的大部分要素。SCAQMD 清单包括以下各项：\n\n- 1) 该技术可在商业上获得。\n- 2) 该技术可靠。在类似现场条件下已有至少\
  \ 12 个月的性能验证记录。\n- 3) 该技术有效，已通过源测试或其他性能文件得到证明。\n- 4) 该技术已在实践中实现，或技术上可行且具有成本效益。\n\
  \n已针对不同设备或工艺编制了控制技术清单。也可以获得控制技术的描述资料。这些参考文献所含信息非常相似，足以提供大多数辖区在“自上而下”分析中必须考虑的备选技术清单，并且会定期更新。其中一些清单将视为\
  \ LAER 的技术作为所列最严格技术收录。将 LAER 纳入清单的逻辑在于，它是最严格的技术，申请人必须证明其不适用，才能在“自上而下”过程中将其排除。\n\n\
  能降低排放的工艺变更也可被视为 BACT。在某些情况下，工艺变更（例如从溶剂型涂料改为水性涂料）可大幅降低排放并减少危险废物产生。\n\n在筛选“自上而下”清单上的技术时，存在很大的判断空间，不同州或地区的机构行使这种判断的方式各不相同。在最初的“自上而下”清单中纳入对特定源而言几乎没有或根本没有技术可行性的技术，会增加为在该过程中排除该技术而必须完成的工作量。\n\
  \n就控制技术而言，available（可获得）一词指的是商业可获得性。你能购买到这项技术吗？它是否已在商业环境中得到验证？商业环境意味着该技术必须是商业过程的一部分，而不是研究工作、中试试验或示范项目。\n\
  \n\n\n\n\ncountry 被认为在美国“可用”。通常没有关于外国“商业技术”的良好信息可用来确定使用是否在商业环境中进行，并且没有由技术供应商补贴或如果该技术被采用为美国的\
  \ BACT 而可向使用者提供补偿的协议。通常，如果在其他国家有若干个“看似商业”的应用，则在将该技术纳入 BACT 列表的目的上，会做出商业可用的假设。然而，上述所引用的\
  \ BACT 技术列表的参考中，并未包含外国的使用情况。\n\n## 4.14.6 确定技术可行性\n\n所识别的每项技术必须对拟许可的源具有技术可行性。该技术必须在拟许可的源的特定情况下使用。例如，减少燃烧涡轮机\
  \ NOₓ 的技术是向燃烧室注入水。然而，对于位于偏远、干旱地区且无水可用的天然气管道压缩站而言，水注入不被认为具有技术可行性。另一个例子是使用浮顶有机液体储罐。该技术在大多数地区被认为具有技术可行性，但在北坡等极寒、冰冻环境中，浮顶罐的滑动密封往往会冻结在原位，阻止顶盖移动。因此，在北极地区，浮顶罐被认为在技术上不可行。\n\
  \n在某些情况下，可以与机构事先协商，排除在最近类似分析中已被证明不可行的技术。此类协议应始终以书面形式确认，以确保不会因后续申请而发出缺陷通知。\n\n关于某项技术对特定应用是否在技术上不可行，或是否只是被认为成本过高，可能存在一些不确定性。如果问题是成本，则需要在“自上而下”流程后期的成本评估中加以解决。\n\
  \n对于大多数技术不可行的论点，可以设想一种昂贵的方法使其可行。例如，对于 NOₓ 控制用水注入的情况，可以进行钻探取水，在一定深度可能找到水。获取水的成本会极高但可行！BACT\
  \ 分析中应采用的策略是提出技术不可行的限制。然后估计成本所需的额外工作就不需要了——该技术被排除在列表之外。如果技术不可行的论点被驳回，则需要进行额外分析以证明该技术成本过高或该技术可被定义为\
  \ BACT。请注意，在需要 LAER 的申请中，成本论点不可用，因此提出技术不可行可能是唯一的选择。\n\n## 4.14.7 排序技术可行的替代方案\n\n\
  一旦制定出“短名单”技术可行的控制替代方案，就根据其减少拟建源排放的有效性，从最有效到最不有效进行排序。通常，通过以多种方式表达控制水平，例如控制百分比和排气流中污染物的浓度，可以提供更清晰的说明。衡量控制有效性的最有用通用指标是使用所识别控制技术后源的年总排放量。技术按“自上而下”方式列出，从技术可行的最有效技术开始。\n\
  \n该短名单应提交给许可机构，并在继续 BACT 分析之前达成一致。一旦机构与申请人就技术列表达成一致，“自上而下”流程的剩余步骤将一次针对一项技术进行，从“顶部”或最有效的技术开始。后续步骤的目的是确定是否有理由拒绝将该“顶部”技术应用于拟许可的工艺或设备。\n\
  \n## 4.14.8 评估技术影响\n\n“自上而下”流程的下一步是确定使用该顶层技术是否会产生能源、环境或成本影响，从而使其不可行。\n\n### 4.14.8.1\
  \ 能源影响\n\n能源影响包括控制技术消耗的能源，或如果许可的是能源生产工艺，则能源产量的减少。一个能源影响的例子是需要向低温烟气中添加热量以提高其温度，使其达到可用于\
  \ NOₓ 控制的选择性催化还原系统的工作温度，该系统最低运行温度约为 600 °F（315 °C）。尚未公布能源影响的定量阈值，因此对顶层技术的能源影响拒绝是酌情决定的。许多年前，曾对减少电力公用事业发电厂\
  \ CO₂ 排放的可能技术进行过分析。当时，减少 CO₂ 的唯一工艺是高压胺洗涤器。该替代方案的分析表明，为了从发电厂排气中洗脱 CO₂，需要的能量超过发电厂生产的能量。此类技术可基于能源影响而被淘汰。\n\
  \n### 4.14.8.2 环境影响\n\n如果拟议控制技术的使用导致其他环境影响，则该技术可能因其他环境影响而被拒绝。例如，该技术的使用可能导致产生危险废物、产生除被控制污染物以外的其他空气污染物、在水资源供应不足的地区过度用水、产生大量固体废物或难以处置的固体废物，甚至如果控制技术安装的占地面积超出当前受扰区域，则可能破坏关键栖息地。\n\
  \n### 4.14.8.3 成本效益\n\n控制技术的成本效益以每吨去除污染物的美元数衡量。首先计算污染物去除率（吨/年）。该速率是安装控制前的排放与控制后的速率之差。然后确定技术的年成本（US$/年）。成本效益是技术年成本与污染物去除速率之比（美元/吨）。控制效率和污染物去除速率在第\
  \ 3.7.6.7 节和第 7.11 节中讨论。\n\n## 4.14.9 全厂适用性限制\n\n全厂适用性限制（PAL）是一种自愿限制，基于全厂实际排放，按污染物具体确定（也称为实际排放\
  \ PAL）。PAL 是以 12 个月滚动为基础，以 T/Y 表示的对主要固定源污染物的排放限制。PAL 在实际操作中可执行，并根据 40 CFR §52.21(aa)(1)\
  \ 至 (15)（40 CFR）全源建立。\n\n拥有 PAL 的设施被允许对设施或单个排放单元进行更改，导致源或单个单元的污染物排放增加，只要其全厂实际排放不超过\
  \ PAL 限值。作为这种灵活性的回报，设施必须监测 PAL 下所有排放单元的排放，并遵守记录保存、监测和报告要求。PAL 必须包含在监管州颁发的许可证中。对没有\
  \ PAL 的空气污染物，重大 NSR 适用性规定继续适用。PAL 流程在美国的使用很少。\n\n## 4.15 大气扩散建模\n\n大气扩散建模是对空气污染物在大气环境中扩散的数学模拟。它使用包含求解污染物扩散控制数学方程算法的计算机程序进行。扩散模型用于估算工业厂、车辆交通或意外化学释放等源排放的下风向环境空气污染物或毒物浓度。它们也可用于在特定情景下预测未来浓度（即排放源变化）。因此，它们是空气质量政策制定中使用的主要模型类型。它们对在大范围内扩散并可能在大气中反应的污染物最有用。对于具有非常高的时空变异性（即源距离衰减非常陡峭，如黑碳）的污染物以及流行病学研究，也使用统计土地利用回归模型。\n\
  \n扩散模型对负责保护和管理环境空气质量的政府机构非常重要。模型通常用于确定现有或拟建的新工业设施是否或将符合美国和其他国家的 NAAQS。模型还有助于设计减少有害空气污染物排放的有效控制策略。在\
  \ 20 世纪 60 年代末，美国环保署空气污染控制办公室启动了研究项目，这将导致为城市和交通规划者使用模型的发展（Fensterstock et al. 1971）。\n\
  \n空气扩散模型也由公共安全响应人员和应急管理人员用于意外化学释放的应急规划。模型用于确定危险或有毒物质意外释放的后果。意外释放可能由涉及危险材料（如化学品或放射性核素）的火灾、泄漏或爆炸引起。使用最坏情况意外释放源项和气象条件进行扩散建模的结果，可以提供受影响区域位置、环境浓度的估计，并可用于确定在发生释放时适当的保护措施。适当的保护措施可能包括疏散或就地避难，以保护下风向方向的人员。\n\
  \n\n\n\n\n在工业设施中，此类后果评估或应急规划根据《清洁空气法》（CAA）第40篇《联邦法规汇编》第68部分的规定是必需的。\n\n扩散模型因用于开发模型的数学方法而有所不同，但所有模型都需要输入数据，可能包括以下内容：\n\
  \n- 气象条件，例如风速和风向、大气湍流的量（用所谓的“稳定度等级”表征）、环境空气温度、可能存在的上层逆温层的底部高度、云量和太阳辐射\n- 源项（排放或事故释放源项中有毒物质的浓度或数量）和材料的温度\n\
  - 排放或释放参数，例如源位置和高度、源类型（即火灾、池或排气烟囱）和出口速度、出口温度以及质量流量或释放速率\n- 源位置和受体位置（例如附近的住宅、学校、商业区和医院）的地形高程\n\
  - 排放气体羽流路径上任何障碍物（例如建筑物或其他结构）的<|message|>位置、高度和宽度、地表粗糙度，或使用更通用的参数“乡村”或“城市”地形\n\n\
  许多现代先进的扩散建模程序包括用于输入气象和其他数据的预处理器模块，许多还包括用于绘制输出数据和/或在地图上绘制空气污染物影响区域的后处理器模块。受影响区域的图还可能包括显示从最小到高浓度的区域的等值线，从而定义健康风险最高的区域。等值线图有助于确定公众和应急人员的保护措施。\n\
  \n大气扩散模型也称为大气扩散模型、空气扩散模型、空气质量模型和空气污染扩散模型。\n\n## 4.15.1 大气层\n\n讨论地球大气层的层是理解空气污染物在大气中扩散位置所必需的。最靠近地球表面的层称为对流层。它从海平面延伸到约18\
  \ km的高度，包含整体大气质量的约80%。平流层是下一层，从18 km延伸到约50 km。第三层是中间层，从50 km延伸到约80 km。\n\n80 km以上还有其他层，但对于大气扩散建模而言并不重要。在中尺度上，图2.2显示了大气中随高度变化的温度而变化的四个区域，因此密度也会变化。\n\
  \n对流层的最低部分称为大气边界层（ABL）或行星边界层，从地球表面延伸到约1.5–2.0 km的高度。大气边界层的空气温度随高度增加而降低，直到达到所谓的逆温层（温度随高度增加而增加）为止，该逆温层限制了大气边界层。对流层的上部（即逆温层以上）称为自由对流层，延伸至对流层的18\
  \ km高度。\n\nABL对于排放、输送和扩散空气污染物而言是最重要的。ABL中地球表面与逆温层底部之间的部分称为混合层。几乎所有排放到环境大气中的空气污染物都在混合层内输送和扩散。部分排放物穿透逆温层并进入ABL上方的自由对流层。\n\
  \n总之，从地面向上，地球大气层的层为由逆温层封顶的混合层组成的ABL、自由对流层、平流层、中间层及其他。许多大气扩散模型被称为边界层模型，因为它们主要模拟ABL内的空气污染物扩散。为了避免混淆，被称为中尺度模型\
  \ 的模型具有水平延伸至数百公里的扩散建模能力。这并不意味着它们模拟中间层的扩散。\n\n### 示例 4.11 一台500-MW燃煤电厂正在燃烧热值为12 000\
  \ Btu/lb的煤。煤中含有2.0%的硫和150 ppb的水银。电厂的热效率为38%，空气/燃料比为14 : 1（质量基准）。计算 (a) 煤燃烧速率（lb/h），(b)\
  \ 烟气流量（scfm），(c) 为满足1.4 lb/MWh（按总发电量计）的标准所需的SO₂去除效率，以及 (d) 为满足0.015 lb/GWh（按总能量输出计）的汞标准所需的整体汞捕获百分比。\n\
  \n已知：热值 = 12 000 Btu/lb\n煤含量：2.0% S，150 ppb Hg\nηthermal = 38%\nA/F = 14 : 1（质量基准）\n\

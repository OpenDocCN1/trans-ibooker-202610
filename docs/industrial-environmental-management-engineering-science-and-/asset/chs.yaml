  \ Asante-Duah (2002), Kammen and Hassenzahl (1999), Roberts and Abernathy (1997)\
  \ 和 Federal Focus (1991)。\n\n## 5.1.2 问题制定\n\n问题制定包括生态风险评估（ERA）的目标、空间和时间尺度的定义、场地概念模型（SCM）的开发，以及终点和非人类受体物种的选择。最后一步是识别潜在关注污染物，并确定例如是否已超过阈值限值（TLVs）。示例\
  \ 5.1 和 5.2 说明了如何将三种常见工业污染物的环境监测结果用于计算其存在量。\n\n### 示例 5.1 监测\n\n空气采样器在 6 小时工作班次中收集了\
  \ 16 mg 的甲基氯。采样器具有以下特性：\n\n平均流量 = 1.2 l/min\n\n收集效率 = 0.9\n\n甲基氯的八小时加权平均值（TWA）是多少？\n\
  \n### 解答\n\n收集的空气总量为\n\n```\n1.2 l/min • 60 min/h = 4320 l\n4320 / 1000 l/m³ = 0.432\
  \ m³\n```\n\n采样器内容为 16 mg 或 16/0.9 = 17.8 mg 在采样空气中\n\n空气中二氯甲烷浓度 = 17.8 mg / 0.432\
  \ m³ = 41.2 mg/m³\n\n六小时收集时间内的平均空气浓度\n\n```\n= 41.2 mg/m³ • 6 hours / 8 hours =\
  \ 31 mg/m³\n```\n\n是否超过了 TLV？\n\n甲基氯的 TWA 为 50 ppm（mg/m³）且未被超过。\n\n### 示例 5.2 连续监测\n\
  \n在铅燃烧作业中产生铅烟。工作室内连续监测器连续运行五天。已知如下：\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_215_0.png)\n\
  \n初始采样率 | 1 cfm（立方英尺/分钟）  \n最终采样率 | 0.7 cfm  \n过滤效率 | ≥20µm 平均平均直径（AMD）颗粒物的 0.999\
  \  \n | <20µm AMD 颗粒物的 0.83  \n收集的粉尘质量 | 1.7 g  \n粉尘中铅的 % | 23\n\n假设铅的产生仅在八小时工作日内发生，则\
  \ TWA 为\n\n```\nTWA = 0.0022 mg/m³ • 24/8 = 0.007 mg/m³\n```\n\n### 解答\n\n粉尘在确定可接受的空气浓度方面存在特定问题。需要考虑颗粒尺寸分布，并必须使用文献中公布的特定可呼吸分数来确定暴露。粉尘颗粒尺寸可以通过尺寸选择性采样器，通常是多级冲击器来完成。\n\
  \n确定工作空气中的 TWA 铅浓度。\n\n这些采样示例仅触及问题制定中使用的技术的表面。它们是说明性的。有时，如示例 5.1 中，监测显示现有的污染预防措施运行正常且不存在问题。示例\
  \ 5.2 显示，确定污染物的 TWA 并不足以制定问题。\n\n采样空气质量 = 平均采样率 × 采样时间\n\n## 5.1.3 暴露评估\n\n假设随着过滤器负载，采样率呈近似线性降低。因此，平均采样率为\n\
  \n衡量持续的健康风险暴露需要确定浓度。在第 5.1.3.1 节中，示例 5.3 显示如何确定生物浓缩，示例 5.4 解释了斜率因子的使用，斜率因子常用于量化癌症风险。\n\
  \n```\n(1 + 0.7)/2 = 0.85 cfm\n```\n\n### 5.1.3.1 分配系数和生物浓缩因子\n\n和总采样空气为\n\n虽然广泛的研究仍在继续完善现有方法并开发新的暴露和效应标志物，但经验已确定了几种对\n\
  \n```\n0.85 cfm × 5 days × 1440 min/day = 6120 ft³\n```\n\n总收集粉尘 = 1.7 g 或 1.7 •\
  \ 0.23 = 0.39 g 铅，因为粉尘中 23% 为铅。由于铅以烟雾形式存在，AMD <20 µm 且收集的总铅为\n\n```\n0.39 g / 0.83\
  \ = 0.47 g\n```\n\n平均铅浓度为总量除以样品体积或\n\n```\n0.47 g / 6120 ft³ = 470 mg / 6120 ft³\
  \ • 1 / 35.31 m³/ft³\n= 0.0022 mg/m³\n```\n\n## 5.1.3.4 受体剂量\n\n暴露评估阶段的最后一步是估计受体在暴露点可能暴露于不同类别化学物质的剂量。有三种剂量类型：给药剂量（摄入、吸入或与皮肤接触的量）、摄入剂量（被身体吸收的量）和靶剂量（到达靶器官的量）。\n\
  \n为了计算风险的目的，剂量应与针对特定化学物质和研究中的暴露途径报告的剂量-反应关系的形式相同。这几乎总是给药剂量或吸收剂量。给定暴露点处的污染物浓度，计算给药剂量是直接的。相比之下，基于给药剂量计算吸收剂量需要考虑一些复杂因素。影响身体摄取污染物的关键因素简化如下：\n\
  \n| 摄入 | 摄入介质中的污染物浓度 |\n| | 摄入材料的量 |\n| | 对胃肠系统的生物可利用性 |\n| 吸入 | 空气和粉尘中的浓度 |\n|\
  \ | 颗粒尺寸分布 |\n| | 对肺系统的生物可利用性 |\n| | 呼吸速率 |\n| 皮肤接触 | 土壤和粉尘中的浓度 |\n| | 粉尘从空气中沉积的速率\
  \ |\n| | 与土壤的直接接触 |\n| | 生物可利用性 |\n| | 暴露的皮肤面积 |\n\n确定污染物摄入时需要考虑的其他因素包括生活方式、暴露频率和持续时间（例如慢性、亚慢性或急性）以及受体的体重考虑。在大多数危险废物场址，长期（即慢性）暴露通常是最令人担忧的。\n\
  \n给药剂量的计算总结在以下通用方程中：\n\n```\nI = (C × CR × EF × ED) / (BW × AT)   (5.2)\n```\n\n\
  其中\n\n+ I = 摄入量（mg/kg 体重-日）\n+ C = 暴露点处的浓度（例如水中 mg/l 或空气中 mg/m³）\n+ CR = 接触率（例如\
  \ l/天或 mg/m³/天）\n\nEF = 频率（天/年）\nED = 暴露持续时间（年）\nBW = 体重（kg）\nAT = 平均时间（天）\n\n方程（5.2）通常针对特定暴露途径进行修改。例如，逸散粉尘吸入的摄入剂量可计算为\n\
  \n```\nI = (C × CR × EF × ED × RR × ABS) / (BW × AT)   (5.3)\n```\n\n其中\n\n+ RR\
  \ = 保留率（小数分数）\n+ ABS = 进入血液的吸收（小数分数）\n\n对于逸散粉尘，空气中的浓度由下式确定\n\n```\nC = Cs × Pc\n\
  ```\n\n其中\n\n+ Cs = 逸散粉尘中化学物质的浓度（mg/mg）\n+ Pc = 空气中逸散粉尘的浓度（mg/m³）\n\n通常，适当的参数可以在文献中找到。近年来已进行了大量研究以定义许多基本参数，例如皮肤表面积、土壤摄入率和吸入率。其他参数，例如暴露频率和持续时间，通常基于现场特定信息（如果有）或专业判断。例如，在非法入侵者情景的评估中，现场调查活动期间对非法入侵者的观察可能会决定用于暴露频率（例如每年天数或每年事件数）和暴露持续时间（例如活动发生的年数）的值。常识在选择暴露参数中也发挥着重要作用。例如，如果评估两个场址的住宅使用，一个在北达科他州，一个在佛罗里达州，就不合理地假设在两个风险评估中儿童因在后院玩耍而暴露于地表土壤的暴露频率（例如活动发生的每年天数）相同。\n\
  \n平均时间（AT）是摄入方程中必须定义的另一个重要参数。所选的平均时间将取决于所评估的成分类型。例如，为了评估与非致癌物暴露相关的长期或慢性效应，摄入量在暴露持续时间（以天表示）上平均。然而，致癌物的暴露在寿命（假设为\
  \ 70 年或 25 550 天）上平均，以与用于开发斜率因子的方法保持一致。\n\n用于此类计算的一些参数如表 5.3 所示。应注意，这些值可以\n\n\n\n\
  ### 表5.3 为垃圾填埋场确定的剂量和摄入量计算标准参数\n\n| 参数 | 成人（男性） | 儿童（6–12岁） | 儿童（2–6岁） |\n|---|---|---|---|\n\
  | 平均体重（kg） | 70 | 29 | 16 |\n| 皮肤表面积（cm²） | 18150 | 10470 | 6980 |\n| 饮水摄入量（L/day）\
  \ | 2 | 2 | 1 |\n| 呼吸空气量（m³/h） | 0.83 | 0.46 | 0.25 |\n| 滞留率（吸入空气）（%） | 100 | 100\
  \ | 100 |\n| 吸收率（吸入空气）（%） | 100 | 100 | 100 |\n| 土壤摄入量（mg/day） | 100 | 100 | 200\
  \ |\n| 沐浴时间（分钟） | 30 | 30 | 30 |\n| 暴露频率（天） | 365 | 365 | 365 |\n| 暴露持续时间（年） | 30\
  \ | 6 | 4 |\n\n这些参数因假定的暴露条件（即所选暴露情景）不同而差异很大。例如，表5.3中成年男性的空气呼吸速率为0.83 m³/h。然而，该速率可相差一个数量级，从静息时的0.6\
  \ m³/h到剧烈体育锻炼时的7.1 m³/h。\n\n例5.5和例5.6分别说明了通过吸入途径和皮肤接触途径计算污染物摄入量的方法。\n\n### 例5.5\
  \ 污染物摄入量计算\n\n确定成年人对一种非致癌性化学物质的慢性每日吸入摄入量，该摄入量为ABC垃圾填埋场逸散性粉尘中该物质浓度的函数（表5.3）。\n\n\
  ### 解\n\n对于暴露于非致癌性组分的成人，摄入量I_N可由式（5.2）计算：\n\n```\nI_N = (C × CR × EF × ED × RR ×\
  \ ABS) / (BW × AT)\n```\n\n由表5.3，取成人的空气呼吸速率为0.83 m³/h，并写出\n\n- CR = 0.83 × 24 =\
  \ 19.92 m³/day\n- EF = 365天\n- ED = 30年（慢性暴露于非致癌物）\n\n在没有更充分信息的情况下，保守的做法会假定RR和血液吸收率均等于1.0。\n\
  \n- BW = 70 kg（表5.3）\n- AT = 365天 × 30年\n\n```\nI_N = (C × 19.92 × (365 × 30) ×\
  \ 1.0 × 1.0) / (70 × (365 × 30))\n```\n\n```\nI_N = 0.285 m³/kg/day × C\n```\n\n\
  C = 暴露点浓度（mg/m³）\n\n### 例5.6 通过皮肤接触土壤的平均每日摄入量\n\n确定现场工人在一年暴露期内通过皮肤接触土壤摄入氯苯的平均每日摄入量：\n\
  \n假设以下附加参数：\n\n- A = 暴露皮肤面积 = 20% × 18150 cm² = 0.2 × 18150 cm² = 3630 cm²\n- DA\
  \ = 土壤黏附量 = 0.51 mg/cm²\n- ABS = 皮肤吸收率 = 6%\n- SM = 土壤基质效应 = 15%（即由于土壤基质的影响，实际可供接触的污染物仅为15%）\n\
  - EF = 每天2次暴露事件；每年156个暴露日\n- ED = 1年\n- BW = 70 kg\n- AT = 365天\n\n### 解\n\n```\n\
  I_N = [C (mg/kg) × A (cm²) × DA (mg/cm²) × ABS × SM × 2 exposure events/day × 156\
  \ days/year × ED × 10⁻⁶ kg·soil/mg·soil] / (BW × AT)\n```\n\n```\nI_N = (C × 3630\
  \ × 0.51 × 0.06 × 0.15 × 2 × 156 × 10⁻⁶) / (70 × 365)\n```\n\n```\nI_N = C × 2.03\
  \ × 10⁻⁷ /day\n```\n\n已知土壤中氯苯的平均浓度为1.39 mg/kg。氯苯的每日摄入量为\n\n1.39 mg/kg × 2.03 × 10⁻⁷\
  \ /day\n\n因此，I_N = 2.82 × 10⁻⁷ (mg/kg·day)\n\n同样，上述示例仅代表了暴露评估过程中计算污染物摄入量的两种方法。接下来要分析的因素是毒性。\n\
  \n## 5.1.4 毒性评估\n\n广义上，毒性是物质有毒的程度。大多数化学品，无论有毒与否，都会通过眼睛、呼吸道、消化道和皮肤进入人体。毒性分为两个级别：急性“短期”暴露会引发中毒，慢性“长期”暴露会导致贫血、白血病和死亡。\n\
  \n在风险评估过程第三阶段的语境中，毒性由每种替代化学物质的剂量-反应关系来定义。其输出采取数学常数的形式，用于代入风险计算方程。除了提供一组用于计算风险的数学常数外，毒理学评估还应分析这些数字中固有的不确定性，并描述这种不确定性可能如何影响风险估计。\n\
  \n在审慎保护公众健康的方法中，EPA在其制定参考剂量和致癌斜率因子的方法中纳入了多个安全系数（USEPA 2002a, 2002b, 2005）。几乎所有不确定性误差都朝着公共卫生保护的方向设定，以确保风险被高估而不是被低估。这种保护性方法的四个示例如下：\n\
  \n- 对于非致癌物，将动物参考剂量外推到人类时使用两个10倍安全系数，一个用于动物到人的外推，另一个用于人群中毒性敏感性的差异。\n- 对于致癌物，线性化多阶段模型假定外推数据的95%置信水平上限（即20次中有19次可能是保守的）。\n\
  - 对于致癌物，线性化多阶段模型将实验动物中观察到的10%–90%致癌范围的数据外推到0.0001%致癌率的监管目标，这一步可能使风险高估几个数量级。\n- 尽管有证据表明，非遗传毒性致癌物与非致癌物一样，存在一个阈值，低于该阈值时它们不会影响细胞分化或分裂，但根据线性化多阶段剂量-反应模型，它们在数学上仍被当作遗传毒性致癌物处理。\n\
  \n## 5.1.5 风险表征\n\n四阶段人体健康风险评估的最后阶段是估计风险。癌症并非污染唯一的不良健康后果：例如，暴露于电离辐射和煤尘可导致辐射病、出生缺陷以及癌症。然而，为了说明风险表征，我们将重点放在那些能够对所考虑的所有暴露情景下受体面临的致癌和非致癌风险进行定量估计的计算上。通常需要对所有三种暴露途径、最大暴露个体以及最可能暴露的人群进行计算估计。这类计算很简单，并能得出定量的风险估计。挑战不在于计算本身，而在于解读结果，以便在决策中恰当应用。这一整体工作被称为风险表征。有毒化学品的风险，视具体情境而定，可以通过不同方式定义、描述和计算。\n\
  \n风险通常被定义为个体因某一事件而遭受不良影响的概率。接触花生制品中的黄曲霉毒素或汽油中的苯的人，患上某些类型癌症的概率是多少？接触铅的工人患上神经系统疾病的可能性有多大？在本文的语境中，化学品释放是事件的一个例子。与任何表达或使用概率的关系一样，对于一个本质上是概率性的现象，并没有既定的方法（在数学上或以科学严谨的方式）来表达单一的确定性数值。表达化学风险的一种概念性方法，是将其写成危害和暴露的函数。\n\
  \n危害是物质或情况对人或环境造成伤害或不良影响的可能性。危害的程度反映了潜在的不良后果，包括死亡、寿命缩短、身体功能受损、对环境化学物质的致敏或生殖能力下降。暴露表示生物体与环境污染物（包括化学、辐射或生物污染物）接触的程度和时间长短。\n\
  \n当风险以概率表示时，以没有单位的小数形式表达。其值介于0.0（绝对确定没有风险）和1.0（绝对确定不良后果将发生）之间。\n\n对于化学品而言，危害一词通常与化学品在特定暴露类型下的毒性特性相关。类似的化学品具有相似的固有危害。然而，要确定风险，必须考察对该危害的暴露情况。例如，假设你有三台泵，都在输送同一种化学品（危害相同），但其中一台泵的密封件泄漏。哪台泵对工人造成的风险最大？密封泄漏的泵暴露可能性最大，而危害相同（同一种化学品），因此密封泄漏的泵风险最大。进一步展开，假设我们有三台泵，输送不同的化学品；哪一台对工人造成的风险最大？在这种情况下，工程师需要考察每种化学品的危害或固有毒性，以及泵的运行情况，才能确定哪一台风险最大。\n\
  \n\n\n\n## 5.1.5.1 平均暴露和最大暴露的风险\n\n在 Superfund 场地的风险评估练习中，平均暴露点浓度和最大暴露点浓度均用于估算风险。使用这两个值进行具体的风险计算可以估算潜在风险的范围，这在提供特定暴露条件相关潜在危害的视角时通常很有用。两种测量的意义取决于数据量以及对该数据的置信度。然而，一般而言，使用平均浓度计算潜在风险可以更好地估算慢性暴露相关的风险，因为平均值更有可能代表受体在一段时间内所暴露的暴露点浓度。最大值的用途最适合估算短期、亚慢性风险，尽管其使用可以提供潜在风险的有用上限估计。\n\
  \n需要注意的是，目前的风险评估指南强调在计算潜在风险时使用单一的暴露点浓度上限估计值。该值通常取为 95% CI，即算术平均值的 95% 置信上限。使用该数值通常会提供最坏情况的风险估计，并且在该值与其他最坏情况假设结合以定义合理最大暴露时，可能会显著高估潜在风险。\n\
  \n## 5.1.5.2 致癌风险\n\n致癌风险可定义为慢性日摄入量（在暴露评估中得出）乘以致癌斜率因子（由毒性评估选定）。其乘积是一个实际术语：暴露于该化学物质所致的超额终生癌症概率。计算如下：\n\
  \nRisk = CDI × SF\n\n其中\n\n- CDI = 慢性日摄入量 (mg/kg/day)\n- SF = 致癌物斜率因子 (mg/day/mg)$^{-1}$\n\
  \n致癌风险的表征首先涉及确定适用于所研究暴露途径和途径的每种化学物质的摄入量，然后将每一项乘以适当的暴露点浓度和斜率因子。经典的风险评估方法假设来自单个有毒物质的风险具有可加性。对于致癌物，这意味着总致癌风险等于所有单个物质通过各暴露途径的致癌风险之和。这些计算针对每个暴露情景和暴露人群重复进行。必须强调，斜率因子特定于暴露途径（例如经口），并且只有在暴露数据适用于相同途径时才可使用。考虑到这一警告，我们可以继续考虑评估一些常见环境污染物相关风险。\n\
  \n## 5.2 评估一些常见污染物的风险\n\n风险评估建立在这样一个原则之上：微小暴露会带来某种不良健康效应的风险，例如在未来某个时间发展为恶性肿瘤或白血病。此类风险通常被认为具有随机性或概率性，并以风险系数表示，即每单位暴露发生特定健康效应的概率或几率。虽然电离辐射的反应通常被认为与剂量呈线性关系，但化学致癌物的风险可能并非如此；因此，风险评估需要考虑诸如阈值剂量是否存在以及剂量-反应曲线的形状等效应。\n\
  \n此外，还需要考虑潜伏期，即暴露与疾病发作之间的时间。例如，如果潜伏期为 25 年，而暴露发生在 50 岁时，个体可能在该特定健康效应出现之前死于其他原因。即使个体活得足够长以使健康效应显现，由于暴露发生在较早年龄，损失的生命年数和生产性生命年数也会少于暴露发生在较早年龄的情况。健康和安全风险有时以每千工人年的生产性（或健康）生命损失年数表示，如例\
  \ 5.7 所示。\n\n### Example 5.7 Cancer Risk Assessment\n\n估算 50 年内 100000 人暴露于平均年剂量\
  \ 500 µGy 的人群中致死性白血病的总数，如果风险系数为 0.03 Gy$^{-1}$。\n\n### Solution\n\nFatalLeukemias\
  \ = $\\frac{0.03}{Gy} \\times \\frac{500 \\mu Gy}{person\\ year} \\times 50 years\
  \ \\times 100000 persons = 75$\n\n## 5.2.1 NOₓ、烃类和 VOC：地面臭氧\n\n地面臭氧是美国最普遍且最棘手的空气污染问题之一。在\
  \ 20 多个城市地区，其浓度超过一个或多个环境空气质量标准。用监管者的语言来说，这些地区被称作“未达标”。（我们强调“坏”臭氧——在地面或近地面形成——与保护我们免受紫外线辐射的“好”或平流层臭氧之间的区别。）\n\
  \n地面臭氧是光化学烟雾的组成部分，实际上是一种二次污染物，因为需要某些前体污染物才能形成它。前体污染物是氮氧化物（NOₓ，主要是 NO 和 NO₂）和烃类。氮氧化物与阳光共同导致臭氧形成，但烃类的作用是加速和增强臭氧的积累。\n\
  \n### 5.2.1.1 烟雾形成\n\n大气低层臭氧形成的最重要过程是 NO₂ 的光解离：\n\n```\nNO₂ + hν → O(³P) + NO\n\
  O(³P) + O₂ + M → O₃ + M\nO₃ + NO → NO₂ + O₃\n```\n\n其中 M 为分子氧或氮氧化物。该循环导致 O₃ 浓度处于由\
  \ NO₂ 光解速率和 [NO₂]/[NO] 比值决定的光稳态。VOC 在烟雾形成中的作用是形成自由基，将 NO 转化为 NO₂ 而不导致 O₃ 破坏，从而增加\
  \ [NO₂]/[NO] 比值并增加 O₃。\n\n```\nVOC + •OH → •RO₂ + other oxidation products\n•RO₂\
  \ + NO → NO₂ + radicals\nRadicals → •OH + other oxidation products\n```\n\n单个 VOC\
  \ 影响 O₃ 水平的能力取决于其羟基自由基（•OH）速率常数及其反应机理的要素，包括自由基引发、自由基终止和去除 NOₓ 的反应。基于仅 VOC 羟基自由基速率常数的简化烟雾形成潜力指数已被提出。\n\
  \n氮氧化物（NOₓ）是在高温工业和交通燃烧过程中形成的。\n\n2016 年，美国交通来源占 NOₓ 总排放量的 56.6%，非交通燃料燃烧贡献了 34.4%。与短期暴露于\
  \ NO₂（<3 小时高浓度）相关的健康影响是儿童呼吸系统疾病增加以及已有呼吸系统问题个体呼吸功能受损。\n\n烃类排放的主要来源是化工和石油炼制工业以及机动车。2016\
  \ 年，工业过程占人为（非生物源）烃类来源总量的 80.5%，而交通部门贡献了 19.5%；交通来源占总 VOC（人为和生物源）排放量的 18.1%，非交通来源占\
  \ 81.9%。溶剂占工业排放量的 66% 和总 VOC 排放量的 34%。应注意，存在天然（生物源）HC/VOC 来源，如异戊二烯和单萜烯，可显著贡献于区域烃类排放和低水平臭氧。\n\
  \n此外，某些物理和大气因素会加剧地面臭氧浓度。高强度太阳辐射、低盛行风速（稀释）、大气逆温以及靠近山脉或海岸线（静止气团）均有助于光化学烟雾形成。图 5.2\
  \ 显示了洛杉矶市中心天空被烟雾覆盖导致能见度变差的照片（《纽约时报》，2018 年 2 月 17 日 b）。\n\n人类暴露于臭氧可能导致急性（短期）和慢性（长期）健康影响。臭氧的高反应性使其即使在低浓度下也是强烈的肺部刺激物。甲醛、过氧乙酰硝酸酯（PAN）和其他烟雾相关含氧有机物是眼部刺激物。地面臭氧进入叶片气孔后还会破坏叶绿素，从而破坏光合作用，对作物和植被产生不利影响。由于臭氧是氧化剂，与其接触的材料，如橡胶和乳胶涂漆表面，会发生劣化。\n\
  \n使我们闻起来好闻的香水、除臭剂、肥皂正以与今日汽车和卡车排放相当的水平污染空气——一种有害类型的污染。研究人员发现，香水、油漆和其他消费品中使用的石油基化学品，综合起来可排放与机动车相当的\
  \ VOC 形式的空气污染。VOC 与空气中其他颗粒相互作用，形成烟雾的构建模块，即臭氧，可诱发哮喘并永久性损伤肺部，以及另一种被称为 PM2.5 的污染物，即与心脏病发作、中风和肺癌相关的细颗粒。烟雾通常与汽车相关联，但自\
  \ 1970 年代以来，监管机构推动汽车制造商投资技术，实质性地减少了 VOC\n\n\n\n\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_223_0.png)\n\
  \n图 5.2 加利福尼亚州洛杉矶的烟雾。来源：《纽约时报》，2018年2月17日（2018b）。摄影：弗雷德里克·J·布朗/法新社-盖蒂图片社。\n\n来自汽车的排放。加州空气资源委员会关于消费品与空气质量的初步结果也表明，来自这些产品和工艺的排放（包括点源和无组织排放源）均高于此前的估计（《纽约时报》，2018年2月17日2018b）。\n\
  \n消费品中含有数以万计的化学物质，研究人员尚未确定哪些化学物质最有可能形成臭氧或 PM$_{2.5}$ 颗粒。我们需要提醒自己，我们日常使用的能源和消费品正在不断改变大气的组成。\n\
  \n## 5.2.2 一氧化碳\n\n一氧化碳（CO）是一种无色、无味的气体，主要是不完全燃烧的副产物。CO 的主要健康危害在于它能与血液中的血红蛋白结合，从而降低血液的携氧能力。交通源占全国\
  \ CO 排放总量的大部分（76.6%）。过去二十年间，由于车辆控制技术的改进，环境空气中的 CO 浓度已显著下降。交通拥堵严重的地区通常环境 CO 浓度较高：美国有\
  \ 80 个城市地区 CO 未达标。高浓度的局部和室内 CO 可来自香烟（二手烟）、燃木壁炉和煤油取暖器。示例 5.8 讨论了工作场所中的 CO 暴露。\n\n\
  ## 示例 5.8 总加权平均浓度\n\n- a) 在某工厂，员工全天暴露于不同浓度的环境 CO，具体如下：\n\n| 时间 | 浓度（ppm） |\n| :---\
  \ | :--- |\n| 上午8-9点 | 0 |\n| 上午9-11:30 | 225 |\n| 上午11:30-下午12:30 | 100 |\n| 下午12:30-2:00\
  \ | 165 |\n| 下午2:00-4:00 | 45 |\n\nTWA 以 ppm 计是多少？如果国家环境空气质量 8 小时标准为 50 ppm，员工的暴露水平是否超标？\n\
  \n- b) 工作环境中的 CO 浓度为 150 ppm。工作面积为 1 150 000 ft$^{3}$。需要向室内通入多少空气才能使 CO 浓度降低至 50\
  \ ppm？\n\n- c) 出于安全原因，不建议采用通风稀释。为什么？（注意 CO 的分子量与空气相近。）\n\n## 解答\n\n- a) 八小时加权平均\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_224_0.png)\n\n因此，125 ppm 的 8 小时 TWA 浓度超过了国家环境空气质量标准\
  \ 50 ppm。\n\nb) 假设稳态、完全混合和指数衰减。\n$$C = C_0 \\times \\exp\\left(\\frac{-t}{L_d}\\\
  right)$$\n$$50 = 150 \\exp\\left(\\frac{-t}{1.6}\\right)$$\n$\\therefore t_d = 0.91\
  \ \\text{ hour} = 54.6 \\text{ minutes}$\n$\\therefore \\text{volume of air need\
  \ to ventilate} = \\frac{\\text{area}}{\\text{time}} = \\frac{1\\,500\\,000}{54.6}\
  \ = 27\\,472 \\text{ cfm}$\n\nc) 加热装置中的不完全燃烧可能会增加 CO 浓度，并向仓库空气中添加其他有害污染物。同样，在 CO\
  \ 产生高峰期，固定的稀释通风速率可能不足以去除 CO。此外，在封闭的仓库环境中，稀释通风可能无法充分去除 CO 浓度较高的气穴。无论如何，CO 具有急性毒性，不建议对急性有毒气体采用稀释通风。\n\
  \n## 5.2.3 铅与汞\n\n大气中的铅主要存在于细颗粒物中，直径可达 10 微米，可在空气中悬浮相当长的时间。四乙基铅曾作为辛烷值提升剂和抗爆剂使用多年，此后人们才完全了解其毒理学效应。1970\
  \ 年的《清洁空气法》禁止了所有含铅添加剂，铅浓度和排放量的大幅下降是过去 25 年中最重要但未获充分宣传的环境改善之一。1997 年，工业过程占剩余铅排放量的\
  \ 74.2%，其中交通源占 13.3%，非交通燃料燃烧占 12.6%（USEPA 1997）。\n\n铅还通过城市径流和工业废水进入水体，并附着在受纳水体中的沉积物颗粒上。水生生物吸收后可导致畸形、死亡和水生生态系统不稳定。另一个值得关注的问题是，酸沉降会增加铅在水中的溶解度从而提高其生物可利用性，可能导致局部铅水平升高。铅在环境中持久存在，并被水生生物富集。\n\
  \n铅通过吸入和摄入食物（受污染的鱼）、饮用水、土壤、涂料和空气粉尘进入人体。它也是铜管中高铅焊点、连接水主管服务管线的旧铅管鹅颈管和旧黄铜配件的腐蚀副产物。环境铅对人类健康的主要影响是对器官、组织和大脑发育的影响，尤其是对儿童。血液中铅水平升高与智商下降有直接相关性，尤其是在尚未禁止铅作为汽油添加剂的发展中国家城市地区。\n\
  \n据美国环保署称，目前美国燃煤发电企业每年排放超过 50 吨汞。毫无疑问，这些浓度很高，对人类和野生动植物构成潜在健康威胁。食用受汞污染的鱼类可引发多种问题，从成人的脱发和慢性疲劳，到胎儿和儿童的神经系统损伤。\n\
  \n汞污染全球大气，但不同地点降落到陆地或水中的汞量差异很大。最近的实验开始识别氧化性气体，如臭氧和含有卤素溴和氯的分子，作为汞沉降的诱因。哪种氧化剂在该过程中占主导地位，似乎取决于环境、季节、空中汞的高度，甚至日照量。\n\
  \n汞很容易进入空气。当煤炭燃烧、金矿开采、某些氯气制造，甚至荧光灯泡破碎时，汞都会释放。空气中约 99% 的汞以元素态存在。该形态的汞相当不溶且不活泼，可在全球循环长达两年。因此，污染大沼泽地的汞可能来源于迈阿密、印度或西伯利亚。\n\
  \n然而，大气化学家发现，当元素态汞遇到某些氧化剂时，会转化为所谓的活性气态汞。与该元素不同，这种形态既高度活泼又可溶于水，但只能在大气中停留数小时至数天，并会以雨雪形式或附着在尘埃上，在形成地附近沉降。在湖泊或海洋中，细菌将其转化为甲基汞，这是汞的有害形态，鱼类以及食鱼的人类和其他捕食者会将其蓄积在组织中。甲基汞中毒的症状包括精神障碍以及言语、听力、视力和运动功能损害。\n\
  \n## 示例 5.9 汞的去除\n\n含汞的医疗污泥在焚烧炉中燃烧。汞的进料速率为 0.92 lb/h。产生的 500°F 产物（气体 40000 lb/h，分子量\
  \ MW = 32）用水急冷至 150°F。将所得气流过滤以去除所有颗粒物。汞会怎样？假设过程压力为 14.7 psi，且 Hg 在 150°F 下的蒸气压为\
  \ 0.005 psi。\n\n### 解\n\n若要让汞被过滤器去除，它必须冷凝并形成颗粒物。因此，需要回答的问题是去除过程中汞的分压与其在 150°F 时蒸气压的比较。\n\
  \n汞的摩尔流量 = $(9.3 lb/h)/(200.6 lb Hg/lbmol)$\n$= 0.046 lbmol/h$\n\n气体的摩尔流量 = $(40\\\
  \ 000 lb gas)/(32 lb gas/lbmol)$\n$= 1250 lbmol/h$\n\n$y_{i} = \\frac{lbmol Hg}{lbmol\
  \ Hg + lbmol gas} = \\frac{\\frac{0.046 lbmol}{h}}{\\frac{0.046 lbmol}{h} + \\frac{1250\
  \ lbmol}{h}}$\n\n$= 3.68 \\times 10^{-5}$\n\n分压 $= y_{i}P = 3.68 \\times 10^{-5}(14.7\
  \ psi) = 5.41 \\times 10^{-4} psi$。\n\n由于分压远小于 $5 \\times 10^{-3}$ psi 的蒸气压，汞不会冷凝，因此不会被过滤器去除。\n\
  \n## **示例 5.10 可吸入的多氯联苯（PCBs）和多环芳烃（PAHs）**\n\n一些工业设施排放可吸入污染物，包括环氧乙烷（EO）、多氯联苯（PCBs）和多环芳烃（PAHs）。工人对\
  \ EO、PCBs 和 PAHs 的年均暴露浓度分别为 10、2 和 $5\\mu g/m^3$。\n\n计算每种污染物引起的致癌风险及总致癌风险。结果以每百万人中额外癌症病例数表示。使用下面表格中给出的数据以及公式（5.5）来求解本题。\n\
  \n污染物的致癌风险 $= \\frac{(\\text{年平均浓度})}{(\\text{单位风险})}$\n(5.5)\n\n| 单位风险数据 |\n|---|\n\
  | **污染物** | **单位风险（$m^3/\\mu g$）** |\n| EO | $8.8 \\times 10^{-5}$ |\n| PCBs | $1.4\
  \ \\times 10^{-3}$ |\n| PAHs | $1.7 \\times 10^{-3}$ |\n\n### 解\n\n利用公式（5.5）和问题陈述中给出的数据，可确定环氧乙烷引起的致癌风险：\n\
  \nEO 的致癌风险 $= \\frac{10 \\mu g/m^3}{(8.8 \\times 10^{-5} m^3/\\mu g)}$\n$= \\frac{88\
  \ \\times 10^{-5}}{880 \\times 10^{-6}}$\n\n$= 880$ 例每百万人额外癌症病例。\n\nPCBs 的致癌风险估计为\n\
  \nPCBs 的致癌风险 $= \\frac{2 \\mu g/m^3}{(1.4 \\times 10^{-3} m^3/\\mu g)}$\n$= \\frac{2.8\
  \ \\times 10^{-3}}{2800 \\times 10^{-6}}$\n\n$= 2800$ 例每百万人额外癌症病例。\n\nPAHs 的致癌风险估计为\n\
  \nPAHs 的致癌风险 $= \\frac{5 \\mu g/m^3}{(1.7 \\times 10^{-3} m^3/\\mu g)}$\n$= \\frac{8.5\
  \ \\times 10^{-3}}{8500 \\times 10^{-6}}$\n\n$= 8500$ 例每百万人额外癌症病例。\n\n吸入致癌总风险由上述个体致癌风险的算术和计算，并假定各污染物在致癌效应方面不存在相互作用。\n\
  \n总致癌风险 $= 880 + 2800 + 8500 = 12 180$ 例每百万人额外癌症病例。\n\n这一比率极高，是通常用作空气毒物管理基准的百万分之一致癌风险的\
  \ 12180 倍。应尽快通过大幅减少空气毒物排放来纠正这种情况。还要注意，PAHs 对该设施工人的风险贡献最大。\n\n### 5.2.4 颗粒物\n\n颗粒物（PM）是悬浮在空气中微观固态或液态（气溶胶）颗粒的总称。PM\
  \ 有各种尺寸，直径范围从几埃到几百微米。颗粒要么直接由一次源排放，要么通过气相反应在大气中形成（二次气溶胶）。\n\n由于颗粒大小决定了颗粒被吸入肺部的深度，PM\
  \ 有两项国家环境空气质量标准（NAAQS），即 $PM_{2.5}$ 和 $PM_{10}$，其下标表示以微米为单位的颗粒直径。小于 2.5 $\\mu m$\
  \ 的颗粒称为“细颗粒”，主要由无机盐（主要是硫酸铵和硝酸铵）、有机物和痕量金属组成。细 PM 可沉积在肺部深处，难以清除。大于 2.5 $\\mu m$ 的颗粒称为“粗颗粒”，主要由悬浮粉尘组成。粗\
  \ PM 往往沉积在上呼吸道，更容易被清除。1997 年，工业过程占传统清单所列 $PM_{10}$ 排放率的 42.0%。非交通燃料燃烧和交通源占……\n\n\
  \n\n分别为34.9%和23.0%。与其他标准污染物一样，由于污染控制措施，PM10浓度和排放率已适度下降。\n\n吸入粗颗粒物常常引发或加重上呼吸道疾病，包括哮喘。吸入细颗粒物会降低肺功能并导致慢性支气管炎。现已证实，吸入石棉、煤矿粉尘或纺织纤维等特定有毒物质会分别引发相关的特定癌症（石棉肺、黑肺病和褐肺病）。\n\
  \nPM的环境影响之一是美国许多地区（包括一些国家公园）的能见度受限。此外，沉降在陆地上的含氮和含硫颗粒会增加土壤酸度并改变养分平衡。当沉降到水体中时，酸性颗粒会改变水的pH值，导致水生生物死亡。PM沉降还会弄脏和腐蚀文化古迹和建筑物，尤其是那些由石灰石建造的。美国有100多个地区PM10未达标。\n\
  \n### 5.2.4.1 能见度损害\n\n《清洁空气法》确立了一项国家能见度保护目标，即防止一类联邦地区因人为污染造成的能见度损害进一步恶化，并补救任何现有的此类损害。NOx和SOx都会导致区域雾霾，并扰乱生态系统中其他养分和金属的生物地球化学循环（*《纽约时报》*，2018年2月17日）。沉降到陆地上的氮会导致土地氮饱和，使更多可利用的氮流入附近水域，从而加剧土壤和水体的酸化。硝酸盐氮的增加会从土壤中带走钙和镁。\n\
  \n硫酸盐和硝酸盐是SO2和NOx转化为颗粒形态后形成的二次气溶胶。大气中的转化速率取决于多种因素，包括天气条件、相对湿度以及大气中氨等化学物质的可用性。硫酸盐（SO4）和硝酸盐（NO3）气溶胶均被视为PM2.5。无论湿度是否存在，这些大气中的细气溶胶都会吸收和散射光线，从而导致该地区能见度降低（图5.2）。\n\
  \n### 5.2.5 SO2、NOx与酸沉降\n\n二氧化硫（SO2）是硫氧化物（SOx）气体中最常见的一种，在含硫固体和液体燃料（主要是煤和油）燃烧时形成。SOx主要来自电力设施、金属冶炼和其他工业过程。氮氧化物（NOx）也在燃烧反应中产生；然而，大多数NOx的来源是燃烧空气中氮的氧化。排放后，SOx和NOx可长距离传输，并在大气中通过气相和水相反应转化为酸性成分（H2SO4和HNO3）。气相反应产生含酸成分的微小气溶胶，而水相反应发生在现有颗粒内部。酸以两种形式沉降到地球表面：在无降水时期以气溶胶的*干沉降*形式，或以含酸的雨或其他降水的*湿沉降*形式。硫和含氮化合物也有天然排放源，它们会导致酸沉降。考虑到硫和氮酸性雨前体物的天然来源，“天然”背景雨水的pH值预计约为5.0。基于这些考虑，“酸雨”被定义为pH值低于5.0的降水。图5.3显示了酸雨导致地表水酸化的主要环境因果步骤。\n\
  \n在美国，SO2排放的主要来源是非运输燃料燃烧（72.6%）、工业过程（18.7%）、运输（5.8%）和其他（2.9%）（见表4.6）。美国有15个城市地区SO2未达标。随着环保局根据《清洁空气法》第四章于1997年制定的酸雨计划的实施，排放量预计将继续下降。该计划的目标是，通过控制公用事业、冶炼厂和硫酸制造厂的SO2及其他排放，并降低工业、商业和住宅锅炉燃料的平均硫含量，大幅减少酸沉降。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_226_0.png)\n\nSO2、NOx和酸沉降对健康和环境有许多影响（图5.4a、b）。SO2很容易被上呼吸道湿润的组织内壁吸收，导致该组织受刺激和肿胀以及气道收缩。长期暴露于高浓度SO2可导致肺部疾病，并加重心血管疾病。酸沉降在土壤、植物、湖泊和河流上会造成森林和植物破坏、地表水酸化、植被和古迹等受损，尤其是在SO2浓度较高且土壤和地表水的缓冲能力和离子交换能力较低的地区。水体酸化会通过使鱼类接触重金属（如从土壤中淋溶出的铝）而危害鱼类种群。植物过度接触SO2会降低植物生长和产量，并已被证明会减少一个地区植物物种的数量和多样性（McLaughlin\
  \ and Taylor 1985；USEPA 1998a）。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_227_0.png)\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_227_1.png)\n\n**图5.4** （a）北卡罗来纳州米切尔山被酸雨杀死的树木。（b）被SO2杀死的玉米树。\n\
  \n## 5.2.6 空气有毒物质\n\n危险空气污染物（HAPs），又称空气毒物，是已知对人体健康有不良影响（如致癌）的空气污染物。《清洁空气法》C.2节所列的HAPs清单中确定了180多种化学物质（USEPA\
  \ 1998c）。空气毒物的例子包括重金属汞和铬，以及有机化学品，如苯、己烷、全氯乙烯（perc）、1,3-丁二烯、二噁英和多环芳烃（PAHs）。\n\n《清洁空气法》将HAPs的主要来源定义为固定源，其有可能排放清单中任何一种HAPs每年10吨，或任何HAPs组合每年25吨。主要来源的例子包括化工联合企业和炼油厂。《清洁空气法》为HAPs规定了一种非常高水平的污染控制技术，称为最大可达控制技术。小型面源，如干洗店，排放的HAPs吨位较低，但合计起来却是HAPs的重要来源。通过改变工作实践，如材料替代和其他污染预防策略，可以实现减排。\n\
  \nHAPs通过典型的吸入或摄入途径影响人体健康。HAPs可在鱼类组织中积累，污染物的浓度会沿食物链向上增加，最终到达人类。许多这些持久性和生物累积性化学物质是已知或可疑的致癌物。\n\
  \n## 5.3 生态风险评估\n\nERA范式的四大组成部分是问题表述、暴露评估、效应评估和风险表征（Anderson and Albert 1998；Suter\
  \ et al. 2000；USEPA 1992、1997、1998a）。ERA从问题表述开始。此阶段开展的活动包括：定义ERA的目标及空间和时间尺度、制定SCM、选择终点和非人类受体物种，以及初步识别潜在关注污染物。随后进行暴露评估和效应评估，两者可同时进行。暴露评估评估化学品在环境中的归宿、迁移和转化，以及受体生物对这些物质的定量摄取和摄入。效应评估建立暴露水平与受体毒性效应之间的关系。风险表征是ERA的最后一步，在这一步中，将暴露信息和毒性效应信息结合起来，描述不良效应发生的可能性。\n\
  \n\n\n\nreceptors. 许多用于评估 ERA 的评估标准与人类健康风险评估（HHRA）中已呈现的标准相同。本节主要关注 ERAs 的独特方面，并且不重复适用于两个主题的\
  \ HHRA 中已涵盖的材料。\n\n返回受污染的河流产卵；迁徙鸟类临时使用某地）。\n\n## 5.3.1 生态问题表述的技术方面\n\n确定为解决 ERA\
  \ 目标所需的数据量是满足项目数据质量目标（DQO）过程的一部分。所有风险评估利益相关者（例如美国环保署、州政府、鱼类和野生动物管理局等）都应参与此过程。DQO\
  \ 在评估开始时即被断言，以定义完成评估所需的数据量和质量。在 ERA 开始时安排时间完成 DQO 最终可能为项目节省时间和金钱。一旦目标和 DQO 确定后，问题的其余表述即可进行。\n\
  \n问题表述的最终目标是 SCM。问题表述期间可考虑多种生态系统特征。这些包括非生物因素（例如气候、地质、土壤/沉积物特性）和生态系统结构（例如不同营养级物种的丰度、栖息地大小和破碎化）。环境描述可使用近期照片和地图记录。应编制植物和动物物种名录。\n\
  \n评估的规模尤其重要，如果一个大型复杂场地被细分为几个较小的场地。超级基金场地彼此相邻的情况也不少见。因此，必须定义评估的面积范围。例如，如果评估中包含场外区域，则必须指定场外距离。SCM\
  \ 的开发和评估终点的选择将直接与空间尺度相关。例如，由于鹿的活动范围较大，如果场地仅占两英亩，则不会评估土壤污染对鹿的影响；评估活动范围较小的终点物种，如小型哺乳动物，则更为合适。\n\
  \n必须决定评估是否必须考虑时间变化。应评估所有历史信息。然后，可确定需要多少新信息才能充分评估影响和风险。评估的采样季节中可能需要包含一年中的某些部分。例如，由于化学形态或生物行为的各种季节性影响，环境暴露可能在一年或数年内发生变化（例如鲑鱼\n\
  \n### 5.3.1.1 场地概念模型\n\nSCM 描述了一系列工作假设，说明污染物或其他压力源如何影响生态受体（ASTM 2003）。SCM 清晰地说明了风险评估中受污染的介质、暴露途径和受体。除了文字描述外，图表式\
  \ SCM 易于理解，有助于确保评估中没有遗漏任何相关组成部分。该模型确保考虑所有暴露情景，并允许对选择和省略途径和受体的理由进行完整记录。SCM 的思想是，虽然问题表述期间可能制定许多假设，但只有那些预计会对现场风险产生显著贡献的假设才会被带入\
  \ ERA 过程的其余部分。\n\n在 SCM 开发期间，确定所有污染源（例如垃圾填埋场、掩埋场、贮水池、空气烟囱、废水排放管），并表示所有受污染介质（例如土壤、水、沉积物、空气、生物）。地下水通常在成为地表水之前不被视为暴露介质，但地下水中的污染物可从土壤迁移到地表水和生物体。一个例外是浅层地下水或渗出点，植物可能通过根系暴露。所有暴露途径均有表示，除非能提供充分理由将某途径从评估中排除。例如，排放金属到溪流的废水排放管不需要空气暴露途径，且仅需考虑洪泛平原的土壤。因此，陆生受体可通过直接接触或饮用溪流、生活在洪泛平原土壤中、或摄食来自溪流和洪泛平原的受污染食物而暴露。必须提出适当的食物网。从受污染土壤到蚯蚓再到鼩鼱的食物网可能适用于一英亩的场地，但面积显著更大的场地可能需要食物网继续延伸到具有更大活动范围的大型捕食者（见图\
  \ 5.5）。\n\n对于非化学压力源，如水位或温度变化，或栖息地干扰，SCM 描述了哪些生态受体暴露于物理干扰，以及改变的时间和空间尺度。\n\nERAs 可能有多个\
  \ SCM。在预测性 ERAs 中，各种活动对生态系统不同组成部分的影响可能需要多个 SCM。在回顾性 ERAs 中，通常需要评估假设的未来情景。例如，目前为野生动物提供很少栖息地的工业区（因此暴露很少且风险很小）未来可能长出植被。它将更具野生动物栖息地吸引力，因此对污染物暴露的风险将变得更大。同样，目前不污染池塘的受污染地下水羽流在几年后可能成为水源。未来风险必须进行评估。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_229_0.png)\n\n**图 5.5** 环境风险评估多途径分析。来源：改编自\
  \ USEPA（1995）。\n\n### 5.3.1.2 识别终点\n\n在 SCM 完成之前，必须定义 ERA 的评估终点并给出其选择的理由。评估终点是要保护的实际环境价值（Suter\
  \ 1993；Suter et al. 2000）。评估终点的示例为“溪流中大口黑鲈种群的存活、生长或繁殖下降不超过 20%”。评估终点物种的理想特征如下（Suter\
  \ 1993；Suter et al. 2000）：\n\n- 评估终点必须与决策相关。\n- 必须了解生态系统组成部分的结构和功能，才能确定终点的生态相关性或重要性。控制其他物种丰度和分布的物种以及参与养分循环和能量流动的物种通常被认为在生态上相关。\n\
  - 社会参与和关注可能影响终点的选择。\n- 只有在现场存在或可能存在的物种才应用于风险评估，无论该物种的价值或重要性如何。\n- 由于现场只能评估部分物种，因此必须选择对现场污染物敏感且可能接受高暴露的终点物种。这样，其他可能较不敏感的物种\n\
  \n## 5.3.2 生态暴露评估\n\nERA 有一些 HHRA 所没有的考虑因素。影响暴露评估的最重要因素之一是评估的空间和时间尺度。空间上，暴露估计必须考虑受体物种的活动范围以及相对于污染面积范围的适宜栖息地的可获得性。时间考虑包括受体物种是留居种还是迁徙种，以及由于季节性变化污染物浓度是否在一年中发生变化。\n\
  \nHHRA 中很少涉及的另一个概念是不同物种获得的不同保护水平。HHRAs 设计用于保护个体。在 ERA 中，只有受威胁和濒危物种，或其他具有特殊法律（如候鸟）或公众关注的物种，才在个体水平上评估影响。对于其他物种，保护主要在种群水平上。例如，保护现场的鹿群很重要；不会保护个体鹿。实际上，这意味着评估与整个种群相关的指标，如存活和繁殖。个体生活质量不予考虑。\n\
  \n与 HHRA 一样，要使暴露途径完整，必须存在受污染介质、传输介质、受体物种以及使污染物进入生物体的暴露途径。然而，ERA 具有独特的暴露途径，例如鱼类通过呼吸水。\
  \ 在暴露评估中，确定暴露点的污染物浓度，或计算摄入率。在风险表征中，这些浓度与毒理学基准相关；基准是假设对受体物种无害的污染物浓度。\n\nERA 中的暴露情景可能与\
  \ HHRA 的情景不同。ERA 没有默认的“住宅情景”或“工业情景”。然而，危险废物场地通常具有工业性质。会制定适合当前土地利用的情景。与人类健康评估一样，ERA\
  \ 可能对未来土地利用做出假设。这一未来情景可能假设场地被废弃并自然演替。因此，不能合理假设当前和未来情景中存在相同的野生动物物种，特别是如果栖息地发生变化。所有关于暴露情景的假设必须在\
  \ ERA 过程早期记录。\n\n在暴露环境表征期间，详细说明受体物种与环境之间的关系。生态系统特征可改变污染物的性质和程度。化学物质可通过微生物群落或水解和光解等物理过程发生转化。环境还可能影响污染物的生物可利用性。物理压力源如溪流淤积和水温波动可能对生态风险产生\
  \ considerable 影响，因此必须描述。\n\n作为暴露环境表征的一部分，考虑受体物种的栖息地需求以及现场可用的适宜栖息地数量也很重要。栖息地的可获得性将决定现场的使用量。因为如果受体物种不存在则不会发生暴露，而如果没有适宜栖息地受体物种也不会存在，所以在暴露评估早期识别栖息地需求和可获得性很重要。选择暴露途径取决于要评估的终点。几类终点和暴露途径在第\
  \ 5.3.2.1–5.3.2.5 节中讨论。\n\n### 5.3.2.1 鱼类群落\n\n鱼类通过呼吸和皮肤吸收暴露于地表水中的污染物。它们还可能通过摄食受污染沉积物或食物而暴露。鱼类群落有两个重要考虑因素。首先，对于无机污染物，鱼类通过吸入（即鳃摄取）暴露的是地表水中污染物的溶解部分。实际上，这涉及在分析前通过纳米滤器过滤水样。HHRA\
  \ 使用水中的总无机浓度计算暴露。然而，颗粒结合部分在鳃处不可用于鱼类。其次，皮肤吸收作为单独的暴露途径不予评估，因为鱼类的现有毒性数据要么是通过喂食受污染食物给鱼类产生，要么是通过将鱼类暴露于水中的污染物产生，而没有尝试对各种摄取途径进行单独评估。\n\
  \n### 5.3.2.2 底栖大型无脊椎动物群落\n\n底栖大型无脊椎动物生活在受污染沉积物中或其上。它们可能通过摄食沉积物或受污染食物而暴露。此外，底栖生物可能呼吸覆盖水或沉积物孔隙水。该终点的特殊考虑包括需要沉积物整体污染物浓度和孔隙水分析，以便将这些浓度与基准浓度进行比较。对于非离子/非极性有机污染物，使用沉积物整体浓度。还需要沉积物的有机碳含量。\n\
  \n\n\n\n暴露评估应记录并表征每一种不确定性的来源，包括与分析数据、暴露模型变量、污染物分布和生物可利用性、受体物种的存在和敏感性以及其他不完整的暴露信息相关的不确定性。\n\
  \n## 5.3.3 生态效应评估\n\n生态效应评估包括评估中使用的生态毒理学基准的描述、关注污染物的毒性特征以及现场采样工作的结果。现场数据可能包括现场调查信息和毒性测试结果。\n\
  \n生态毒理学基准代表环境介质（即水、土壤、沉积物、生物体）中化学物质的浓度，被认为对生物体无害。每种介质和每种终点物种可能有多个基准，这使得可以根据现场的污染物浓度估算可能出现的效应的大小。例如，可能存在“无效应水平”、“低效应水平”、“慢性效应水平”、“种群效应水平”和“急性效应水平”的基准。使用所有这些基准将为决策者提供比其中任何一个都更多的信息。\n\
  \n目前在美国或其他地方可用的联邦或州基准很少。被用作基准的标准是《水生生物保护国家环境水质标准》（NAWQC）（USEPA 1986）。这些是 ARARs，并被用作鱼类群落和其他水柱物种（例如无脊椎动物如溞）的基准。然而，并非所有污染物都有这些标准。因此，需要其他基准。鱼类、底栖、土壤无脊椎动物和植物群落以及野生动物的基准在第\
  \ 5.3.3.1–5.3.3.4 节中简要描述。这些基准开发中使用的主要毒性信息来源是公开文献（Risk Assessment Forum 1996, 1999）。\n\
  \n### 5.3.3.1 鱼类群落\n\n急性期和慢性期 NAWQC 或州水质标准是 ARARs，必须用作基准。然而，这些是作为广泛适用的值开发的，因此更合适的做法是为地理位置和现场存在的物种确定基准。应查阅文献，查找与现场系统相似的系统中的慢性值，无论是淡水、河口、海水、硬水还是软水系统。对许多不同水生物种和许多污染物已进行了实验室毒性测试。事实上，水生系统目前拥有最大、最易获得的污染物浓度/效应数据数据库。\n\
  \n### 5.3.3.2 底栖群落\n\n可用于计算底栖群落沉积物基准的几种方法。对于非离子/非极性有机污染物，通常采用平衡分配法。对于无机污染物，可使用文献中现有的沉积物整体毒性值，或将污染物孔隙水浓度与现有的\
  \ NAWQC 进行比较。不幸的是，沉积物单污染物暴露/效应数据的数据库有限。大多数数据来自受污染的场地，因此存在多种污染物。然而，沉积物污染正受到更多关注，风险评估人员和管理人员必须紧跟沉积物毒理学和政策方面的进展。\n\
  \n### 5.3.3.3 土壤无脊椎动物和植物群落\n\n植物群落在生态系统的能量流动和养分循环中发挥主导作用。土壤无脊椎动物和植物构成了许多食物网的基础。土壤污染物数据库非常广泛。然而，研究人员使用的多数终点是粮食作物物种。虽然这些信息对人类健康风险评估人员至关重要，但不能直接适用于生态风险问题。初级文献将是开发毒性基准时必须使用的毒性信息的主要来源。土壤污染对植物、无脊椎动物甚至微生物群落的影响是近期的重要问题。同样，这也是\
  \ ERA 中必须保持最新信息的一个领域。\n\n### 5.3.3.4 野生动物\n\n野生动物基准尤其复杂，因为野生动物可能通过饮用水、周围土壤以及其饮食（来自植物和动物来源）接触污染物。因此，野生动物基准必须考虑这些多重暴露途径。基准可为每条暴露途径单独制定（在仅通过一条途径暴露的情况下），也可为总暴露制定。在多途径暴露的情况下，选择如\
  \ NOAEL 或 LOAEL（无/最低观察到不良效应水平）之类的基准，并以剂量表示，例如每公斤体重（每天）污染物毫克。野生动物基准具有物种特异性，以考虑不同物种的敏感性、体重、觅食习惯和饮食差异。在选择适当的基准值时，必须查阅毒理学文献，重点关注繁殖终点。污染物毒性特征有助于风险评估读者清楚了解环境中污染物的毒性效应。风险评估中的毒性特征可以提供相关毒性信息的简明总结。值得重申的是，信息必须与废弃物现场和关注的终点相关。那就是，特征不应仅仅是老鼠和大鼠的中位致死剂量（LD₅₀）的清单。应为现场发现的污染物以及感兴趣的受体物种汇编剂量-反应信息。\n\
  \n感兴趣物种的毒性特征和生物效应数据也有助于风险评估人员和风险管理者评估风险的程度和大小。应列出观察到致死和亚致死效应（包括行为改变）的污染物浓度（即剂量-反应信息）。诸如化学物质的迁移性（例如水溶性、土壤吸附、辛醇-水分配系数）、环境持久性以及与其他污染物的相互作用等信息将有助于风险管理者做出明智的决策并教育公众。\n\
  \n## 5.3.4 生态风险评估的附加组成部分\n\n### 5.3.4.1 采样和调查\n\n尽管在 ERA 进入效应评估阶段之前，总体采样问题必然已得到解决，但在本文中提及其中一些问题仍然是值得的。这将确保风险评估人员已提及并考虑了这些问题可能产生的潜在影响。现场调查和环境介质化学分析也已涉及。\n\
  \n### 5.3.4.2 现场采样\n\n在确定采样位置之前，必须定义采样“河段”。这些是可能受特定污染物源影响的区域。例如，一条溪流沿其长度可能有几个污染物源；河段可定义为两个源之间的区域。在河段内采样可确定各种来源对观察到的毒性的相对贡献。切记不要忘记采样适当的背景（或参考）地点。事实上，最好有几个参考地点，以考虑环境中的自然变异性。过去，背景（意味着原始）和参考（意味着不受该特定场地影响）之间存在区别。然而，由于这种区别正在失去时效性，因此有必要知道使用的是哪种定义。\n\
  \n当制定时间表时，现场参数的季节性问题是经常被遗忘的一个方面。对于全国大部分地区，冬季会阻碍采样工作。例如，当地面和溪流结冰时，很难采集蠕虫或鱼类。蝙蝠在冬季冬眠，鸟类迁徙，稀有植物在不开花时更难识别。与其在不适当的时间收集数据，不如推迟风险评估的完成。\n\
  \n废弃物现场调查必然涉及协调各种调查人员完成各种采样任务。协调很重要，以便获得对 ERA 有用的结果。例如，虽然水浓度可能在短时间内发生巨大变化，但用于毒性测试的水样应与用于化学分析的水样在同一时间和同一地点采集。协调其他活动，如沉积物样品的采集，则不太关键，因为沉积物浓度需要更长时间才能显示污染。\n\
  \n在 ERA 中，环境介质样品不仅包括地下水、地表水、沉积物、土壤和空气；还必须包括生物体，以便评估污染物暴露和效应。这一重要信息来源可供生态风险评估人员使用，可能使\
  \ ERA 结果更具确定性。\n\n### 5.3.4.3 现场调查\n\n现场调查的优点是能给出效应的真实世界指示。然而，任何观察到的效应的原因可能未知。例如，年幼鱼数量的减少可能是由于影响鱼卵或幼鱼的污染物，也可能是由于自然原因，例如导致水流增加、侵蚀产卵床的风暴事件。另一个缺点是，很难检测到小的变化。通常，现场参数（例如种群大小、物种数量）下降超过\
  \ 20% 才能检测到有害变化。如果没有适当且可比较的参考地点，现场调查可能变得更加复杂，因为对现场观察到的效应的解释将极其困难。\n\n在预测性 ERA 的情况下，现场调查提供了可能在未来接收污染物的环境的信息。为了记录任何未来的不利影响，必须拥有这些信息。调查可能包括受威胁和濒危物种调查、水生和陆生群落调查以及湿地调查。我们在转向物种形成问题之前顺便提及后者。\n\
  \n在美国，必须对场地进行湿地调查以识别并在必要时划定湿地。请注意，识别湿地比划定湿地更容易（且成本更低）。只有在修复或其他活动需要破坏全部或部分湿地时，才需要划定湿地。\n\
  \n\n\n\n## 5.3.4.4 物种化\n\n有关化学物质在各种介质中的物种化信息对于砷或铬等污染物可能很有用，因为这些污染物的不同物种具有非常不同的相对毒性。在样品送去分析之前，必须确定所使用的分析方法是否具有低于所关注的监管浓度（如\
  \ ARAR）以及会产生不可接受风险的浓度的检出限，除非在技术上或经济上不可行。如果无法达到这些检出限，风险评估中将存在额外的不确定性，因为无法知道这些污染物是否存在，因而无法判断它们是否构成风险。\n\
  \n某一场地的介质中的化学浓度以及文献中可获得的大量单一化学毒性数据可用于确定在实地调查或毒性测试中观察到的影响的具体原因，并界定污染来源。这些数据用于预测性\
  \ ERA 中模拟污染物暴露的影响。然而，测得的浓度可能并不能反映生物可利用的比例（例如，化学物质可能与土壤颗粒结合，因此无法被生物吸收）。\n\n## 5.3.4.5\
  \ 其他影响信息来源\n\n有助于解释生态数据的补充信息包括生物标志物分析。生物标志物是生物个体暴露于污染物或其他亚致死应激源的敏感指标。它们通常是生理或生化反应，例如酶浓度、遗传异常、组织病理学异常或污染物体内负荷。虽然生物标志物可表明暴露于应激源，但它们无法提供这种暴露对个体的影响信息。这是因为\
  \ ERA 主要关注的是生物种群的生存能力，而非单条鱼或鸟类的生理效应。然而，一些生物标志物是化学特异性的，因此可能为观察到的毒性效应的潜在原因提供有价值的信息。例如，酶\
  \ δ-氨基乙酰丙酸脱水酶的血液水平升高表明暴露于铅。\n\n## 5.3.4.6 许多 ERA 中涉及的额外影响 *全球变暖*\n\n大气允许来自太阳的太阳辐射几乎无显著能量吸收地通过。到达地球表面的部分太阳辐射被吸收，加热陆地和水。红外辐射从地球表面发出，但大气中的某些气体吸收这种红外辐射，并将其中一部分反射回表面，从而使地球变暖，使我们所知的生命成为可能。该过程通常被称为\
  \ *温室效应*。地球的表面温度将上升，直到太阳辐射吸收速率与红外辐射发射速率之间达到辐射平衡。人类活动，例如化石燃料燃烧、森林砍伐、农业和大规模化学生产，已可衡量地改变了大气中气体的组成。有人认为，这些变化将通过增强温室效应导致地球-大气系统的变暖。\n\
  \n主要的温室气体（GHGs）是水蒸气、二氧化碳、甲烷、氧化亚氮、氯氟烃和对流层（地面）臭氧。水蒸气是最丰富的温室气体，但由于其通常并非人为来源而被省略。二氧化碳由于其高排放率和浓度对全球变暖有显著贡献。化学物质的全球变暖潜势的主要因素是红外吸收能力和在大气中的驻留时间。\n\
  \n## 5.3.5 对流层臭氧污染及其对植物的影响\n\n臭氧在对流层中形成，在那里阳光引起涉及主要来自汽油发动机和其他化石燃料燃烧的氮氧化物（$NO_x$）和\
  \ VOC 的复杂光化学反应。木本植被也是 VOC 的主要来源（例如异戊二烯或萜烯、甲醛、乙醛、甲乙酮、丙酮等）。$NO_x$ 和 VOC 可通过区域天气模式长距离输送，然后在反应形成大气中的臭氧之前，可在数周内持续存在。导致臭氧形成的光化学主要反应如下所示。\n\
  \n```\n$2NO + O_2 \\to 2NO_2$ \n$RH + OH \\cdot \\rightleftharpoons RH \\cdot \\\
  rightleftharpoons RO \\cdot + NO \\to NO_2$ \n$NO_2 + h\\nu \\to NO + O$ \n$O +\
  \ O_2 + M \\to O_3$ \nNet reaction : $NO_x + RH + h\\nu \\to O_3$\n```\n\n### 5.3.5.1\
  \ 视程和区域霾\n\n氧化剂、臭氧（$O_3$）、PAN、过氧苯甲酰硝酸盐和其他微量物质与氮氧化物和 VOC 反应并产生烟雾。这些光化学烟雾的成分对植物最具破坏性，对人类健康最不利，是这些光化学氧化剂。烟雾形成过程中产生的气溶胶导致能见度明显降低和区域霾，并使大气呈现棕色。区域霾发生在羽流已均匀分散到大气中、无法辨认羽流的距离。区域霾的主要原因是硫酸盐和硝酸盐（主要为铵盐），它们由大气中\
  \ SO₂ 和 NOₓ 的化学反应形成（图 5.2）。\n\n### 5.3.5.2 富营养化：一种广泛的生态效应\n\n富营养化是水体老化的自然过程。它是微观生物自然沉积的非常缓慢过程的结果，需要地质时间才能完成。过程完成会导致水体灭绝。\n\
  \n富营养化过程由生物活动所需营养物质浓度的增加所推动。首先，设想清洁清澈的水。在这种条件下，由于可用的营养物质极少，水柱中没有可支持沉积的显著生物活动。水体健康，条件称为贫营养。随着时间的推移，营养物质会积累。营养浓度支持生物活动但不令人反感且高于贫营养条件的淡水体被认为是中营养。在生命周期的下一个阶段，水体变得富营养——其特征是浑浊的水和微生物沉积加速。灭绝前的最后生命阶段是池塘、沼泽或沼地。\n\
  \n尽管在自然条件下富营养化发生非常缓慢，历经地质时间，人类活动促进了营养物质的产生并缩短了周期。拥有绿草如茵草坪的人是营养物质的 prolific 生产者。农田是营养物质的极佳来源。例如，马里兰州的切萨皮克湾就装载着来自远至纽约的农田的营养物质。\n\
  \n为了生存，微生物必须供给含有其组分的营养物质：碳、氢、氧、氮、磷和微量元素。由于碳、氢和氧在环境中已十分丰富，富营养化控制侧重于限制氮和磷的输入。生物以 NH₄⁺、NO₂⁻\
  \ 和 NO₃⁻ 的形式利用氮；磷以正磷酸盐的形式利用。藻类是富营养化的主要原因，可通过限制其获取氮或磷来控制。应选择哪一种？研究发现，蓝绿藻可在几乎任何地方生存，并在不利条件下可轻松超过其他藻类生长，它们可从空气中固定氮。出于此及其他原因，默认选择是推荐磷控制。\n\
  \n富营养化是我们生态风险分析中包含的影响的最后一个例子。当然还有许多其他影响；文献十分丰富。现在，我们准备考虑 ERA 中的下一步：毒性测试。\n\n## 5.3.6\
  \ 毒性测试\n\n生态毒性测试根据持续时间（短期、中期和/或长期）、测试溶液添加方法（静态、循环、更新或连续流动）以及（为满足拟议污染物排放消除系统的许可要求，并确定混合区等）进行分类。详细的当代测试方案在法规文献中进行了总结（USEPA\
  \ 1985a, b, 1988, 1989）。\n\n近年来，毒性测试已得到广泛验证。即使生物体对废物流毒性的敏感性各不相同，美国环保署已记录到，当废物流稀释度被测定时，废物流毒性与受纳水体中发现的毒性相关性良好，并且来自废物流和受纳水体毒性测试的影响预测与受纳水体中生态群落的响应相比非常有利。美国环保署已在全国范围内对淡水、河口和海洋生态系统进行了测试。方法包括急性以及慢性暴露。\n\
  \n目前的生物测定方法可在四到七天内评估多个不同的系统发育类群（USEPA 1988）。测试基于几乎全国分布的物种，这些物种具有大量生活史和毒性敏感性数据。适当的测试方案涉及评估测试物种对特定废物流的一系列敏感性。通常考虑两种或三种物种以消除该因素的不确定性。\n\
  \n常见的海洋物种包括 Champia parvula，红藻；Mysidopsis bahia，糠虾；Menidia beryllina，内陆银鱼；以及 Cyprinodon\
  \ variegatus，羊头鲈。常见的淡水物种包括 Pimephales promelas，肥头鲫，以及 Ceriodaphnia dubia，水蚤虾。\n\n\
  测试结束时，确定存活率并测量生长（与对照相比干重增加）。急性终点是鱼的死亡。\n\n### 5.3.6.1 毒性测试结果的评价\n\n表达毒性测试结果使用了许多术语。急性毒性是严重到足以产生\n\
  \n\n\n\n\n风险分析师和风险管理者，我们简要讨论风险管理。风险分析师不为风险管理者执行决策过程，风险管理者也不规定分析师使用的数据、模型和假设，但他们必须沟通，才能使风险分析具有相关性，决策具有充分依据。\n\
  \n如前所述，这种关系应始于对关注的来源、环境和终点的定义。因为科学家/风险分析师的这些活动需要做出不基于科学的价值判断，避免分析师不当注入自身价值观的唯一方法是通过政策声明或临时判断来介入风险管理者的价值观。然而，风险管理者往往不是环境科学家，因此风险分析师有义务协助风险管理者获得足够的科学背景以做出明智的判断。此外，风险分析师必须足够了解风险管理者的需求和利益，才能进行风险表征。\n\
  \n图 5.6 是设定空气、水或其他环境介质中化学物质允许浓度的标准所涉及因素的简单示意图。风险分析的理想输入是与关注终点上不可接受影响的概率相关的函数，该函数与标准水平相关，或更可能的是，每个终点各自的函数。一位前\
  \ EPA 主任曾说，概率分布比数值对决策者更清晰（Ruckelshaus 1984）。从该函数中，风险管理者可以选择一条不太可能从曲线上端过度保护的标准，也可能选择一条不太可能从曲线下端保护不足的标准，或选择中间标准。虽然并非所有风险管理者都同样适应概率，但监管机构承认和量化不确定性的压力正在增加（Finkel\
  \ 1990）。\n\n除了人类健康和 ERA 的结果外，决策还将基于各种社会、政治、法律、工程和经济考虑。法律考虑包括所实施法律的措辞以及任何表明适当保护程度的司法判决。主要工程考虑是满足标准的实用技术是否可用。满足标准成本和受风险资源价值可能是正式风险-收益或成本-收益分析的主题。其他更模糊的考虑包括公众关注程度和现任政府的政治哲学。管理者可以设定标准，也可以推迟决策并要求进行更多测试、测量或研究，以减少不确定性对函数斜率的贡献。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_238_0.png)\n\n图 5.6 设定环境质量标准的风险管理示意图。\n\
  \n## 5.4.1 生态资源的估值\n\n为了进行成本-效益分析或设定环境损害的罚款或补偿水平，有必要预测、衡量或估计系统潜在或实际价值损失，然后将该损失转换为货币或等价单位。许多生态学家和环保主义者反对对自然环境组成部分进行货币估值的行为，因为他们认为经济分析不可避免地会低估环境相对于新化学品或开发的价值，或相对于处理或清理成本的价值。反驳的论点是，决策者在判断中不可避免地会考虑经济因素，如果环境科学家不开发货币化环境价值的方法，决策者很可能会低估环境的经济价值。例如，在美国，EPA\
  \ 被要求通过进行成本-效益分析来证明新的环境法规的合理性。\n\n反对估值环境组成部分的一个基本论点是，它们具有独立于人类价值的内在价值（Rolston 1988）。然而，即使接受这一前提，人类也无法确定森林的价值是什么（即它更愿意是原始林还是年轻且生长旺盛的？），因此对森林内在价值的诗意描述并非功利性的，但它也不比美元价值更少的人类中心主义。人类设计的所有价值体系不可避免地基于人类价值观。\n\
  \n在估值生态资源时，考虑存在各种功利性和非功利性价值类别是有帮助的。每类环境价值都必须有其自身的方法进行估计和估值。\n\n### 5.4.1.1 功利主义\n\
  \n功利主义价值通常按商品、潜在商品、娱乐和自然服务分类。\n\n- **商品价值：** 树木、牧场、商业鱼类以及其他物种和群落被出售或租赁，因此它们具有可通过常规市场调查轻松确定的市场价值。\n\
  - **潜在商品价值：** 植物和动物是可直接营销或合成后作为药物、农药等营销的化学品来源。此外，所有物种都构成可用于作物、牲畜、工业微生物等基因工程的遗传资源。因此，所有物种都具有潜在商品价值，很难估计。然而，这种价值仅在灭绝的情况下才会丧失。\n\
  - **娱乐：** 鱼类和野生动物对渔民、猎人、观鸟者和在自然栖息地欣赏动物的人具有娱乐价值。自然区域对露营者、徒步旅行者和环境学习者具有娱乐价值。\n- **自然服务：**\
  \ 生态系统调节洪水、控制局部和全球气候、降解和封存污染物、减少土壤和养分流失，并提供其他具有明显经济效益的服务。这些可估计为替代服务的成本（例如额外的废物处理）或缺乏服务造成的成本（例如洪水损失）。\n\
  \n### 5.4.1.2 非功利主义\n\n非功利主义价值从存在性和美学到科学和文化不等。\n\n- **存在：** 许多人仅仅因为物种和生态系统存在而赋予其价值。这些人可能不期望看到金狮狨或北极国家野生动物保护区，但如果狨猴灭绝或保护区被改造成油田，他们会感受到损失。\n\
  - **美学：** 生物体和生态系统提供的审美体验具有与绘画或舞蹈表演等价的价值，但不易量化。\n- **科学：** 物种和生态系统可能具有科学价值，因为它们可能成为自然未被认识属性的特别恰当例证，或因为它们是长期研究的主题，可能被破坏。其中，只有商品价值和娱乐价值是现有方法能够合理描述的。需要研究以确定是否可以开发出可为其他价值损失估计并货币化这些损失的可靠方法。可以认为，试图货币化非市场价值本质上是人为的，苹果和橙子的权衡应由决策者而非经济学家来执行（NRC\
  \ 1975）。关于范畴错误的问题，以及贴现任何价值的适当性和对后代的义务等问题，由 Costanza（1991）、Desvousges 和 Skahen（1987）以及期刊\
  \ *Ecological Economics* 的许多撰稿人讨论。\n- **文化和伦理：** 某些生态系统和物种具有文化意义。这一价值由更大的\n\n\n\n\
  \n美国公众对秃鹰数量下降的情感冲击，超过了同期且更为严重的游隼和棕鹈鹕数量下降。\n\n最后，必须强调成本效益分析不应被视为决策制定的唯一可靠依据。它是一种描述特定标准的输入。特别是，它忽略了道德和伦理方面的考虑。现代西方文化中的许多人，如果不是大多数人，都会认为我们对环境负有道德责任，这种责任超越了效用考虑。然而，这些责任必须与对穷人、饥饿者、传统文化从业者等的责任相平衡（Randall\
  \ 1991）。因此，即使从道德角度来看，环境价值也不是绝对的，而必须与竞争价值相平衡。诸如此类的复杂性使风险管理超出了正式分析的范围。\n\n## 5.4.2\
  \ 风险管理建模\n\n确定风险严重程度是风险管理者首要的任务之一。在此基础上，他或她必须决定给定的风险是否不可接受，因此必须通过监测来降低或预防风险，还是可以接受，至少在目前可以接受。可能替代方案相关的风险也必须考虑。例如，杀死每年\
  \ x 只鸟的农药的替代方案可能是清洁农业，它破坏了害虫的避难所，但也消除了 y 只鸟的栖息地。即使 y 远大于 x，清洁农业可能更受青睐，因为它更易被环境和动物权利团体接受。整合此类考虑几乎总是非正式的过程。\n\
  \n我们提供的简短示例似乎只有一种暴露模型、一种效应模型，以及关于如何参数化它们并将其组合成风险估计的一组假设。这种方法通常适用于人类健康风险评估，其中终点、模型和参数处理是标准化的。然而，它不适用于\
  \ ERA。人们可以用生态系统模型、种群模型和个体水平毒性测试的统计模型来估计对渔业的影响。生态系统层面的影响可能由微宇宙测试、湖泊生态系统模型和溪流生态系统模型的结果表示。每种风险估计都将有其自身的假设和相关的不确定性，而这些不确定性可能无法以等效的方式表达。必须以某种连贯的方式评估、组织这些单独的证据线，并向风险管理者解释，以便进行证据权重评估。\n\
  \n呈现替代证据线的一种方法是使用共同轴进行图形化呈现。轴\n\n应从风险估计的四个维度中选择，以便阐明对决策最重要的风险估计差异。那就是，决策主要取决于效应发生的浓度、恢复时间、死亡的生物数量，还是这些轴的某种组合？替代模型、假设或数据的输出应绘制在这些轴上。\n\
  \n## 5.4.3 风险表征的其他考虑\n\n负责人类健康风险管理的相关人员完全清楚，有些风险的后果如此严重，以至于无论成本如何都必须避免。如此明显不可接受的风险被称为\
  \ de manifestis。伴随的概念 de minimis，我们稍后将探讨，指出存在后果如此微不足道以至于不值得处理的风险，无论成本多么低。Whipple（1987）撰写了关于\
  \ de minimis 风险的文章，而 Travis 等人（1987）和 Kocher 和 Hoffman（1991）讨论了这两个概念与癌症预防的关系。\n\n\
  de manifestis 和 de minimis 边界之间的风险水平会根据成本、补救措施的技术可行性和其他考虑来平衡，以确定其可接受性。由于生态效应没有标准评估终点，因此没有\
  \ de minimis 或 de manifestis 生态风险水平。然而，美国对濒危物种的保护为 de manifestis 风险水平提供了一个依据，因为它显然排除了经济和社会政治方面的考虑。建立\
  \ de manifestis 和 de minimis 风险将使评估者在进行最小评估后即可快速处理明显不可接受或微不足道的风险，而无需确定确切的预期风险水平，或权衡成本和收益。考虑哪些水平和类型的生态效应是明显且必然可接受的，哪些是明显且必然不可接受的，将为风险评估者和风险管理者提供良好的基础，以确定社会价值与生态原则之间的关系。\n\
  \n风险表征和管理中的最后一点考虑是，除了风险管理者之外，其他受众也需要理解风险和决策的基础。这些包括公众、环境倡导团体和受监管方。向非专业人士进行风险沟通一直是关于健康风险的研究和讨论的主要话题，但对于生态风险则不是（NRC\
  \ 1989）。这是可以理解的，因为普通公民更关心个人和家庭健康，而不是生态效应。然而，当外部各方变得\n\n偶尔，时间是一维评估的基础。如果释放的浓度相对恒定，则风险管理者需要知道在没有不可接受风险的情况下可以释放多长时间。例如，废水处理厂可能因维修而停机，操作员希望知道可以释放未经处理的废水多长时间。最常见的以时间定义的测试终点是中位致死时间（LT₅₀）。事实上，许多释放具有相对恒定的浓度，时间将比浓度更适合作为评估的单一维度。然而，由于时间通常被认为不如浓度重要，因此它更常在更高维模型中考虑。\n\
  \n风险估计最常见的模型是商值法（Barnhouse et al. 1982；Urban and Cook 1986），它依赖于一维尺度。该方法包括将预期环境浓度除以测试终点浓度（即确定它们在浓度尺度上的相对位置）；风险被认为随着商值的增大而增加。\n\
  \n### 5.4.5.2 二维模型\n\n**浓度/反应** 生态毒理学中最常见的二维模型是浓度-反应函数。这种主导地位可以用对化学物质浓度增加时反应增加的渴望来解释，从而建立化学物质与反应之间的因果关系。在此模型中，时间被折叠，只考虑测试结束时，并且要么严重程度要么反应比例被消除，以便有一个单一的反应变量。最常见的是保留反应比例并通过只考虑一种类型的反应，通常是死亡率，将严重程度折叠。严重程度最常用于当种群或群落的生物的功能反应，如初级生产力，而非个体间反应的分布是感兴趣时。\n\
  \n对测试中获得的浓度-反应数据拟合正态概率单位、logit 或其他函数。通常，该函数用于通过逆回归生成标准 LC₅₀ 或 LD₅₀ 或中位有效剂量（ED₅₀），从而回到一维模型并丢弃大量信息。由于评估更常关注防止死亡或至少防止种群中显著比例的死亡，因此计算\
  \ LC₁、LC₁₀ 或其他阈值水平会更有用，但信息仍会被丢弃。如果保留两个维度，浓度-反应函数可以在每次新评估中用于估计预测暴露浓度下的反应比例，或为显著效应选择特定地点的阈值。当只有\
  \ LC₅₀ 可用且评估需要估计反应比例时，可以通过假设函数标准斜率并使用 LC₅₀ 将线定位在浓度尺度上来近似浓度-反应曲线。浓度-反应函数比被困在 LC₅₀\
  \ 上有所改进，但在许多情况下，反应比例不如反应开始所需的时间重要。\n\n浓度-反应函数的一项改进是使测试持续时间与暴露持续时间相匹配，而不是使用标准测试持续时间并假设暴露持续时间相当匹配。理想情况下，暴露的时间模式应被预期并在毒性测试中再现。例如，如果发电厂将定期“吹扫”氯化冷却水，按固定时间表持续固定时间，则这种间歇性暴露可以在实验室毒性测试中再现（Brooks\
  \ and Seegert 1977；Heath 1977）。\n\n**时间-反应函数** 时间-反应函数与浓度-反应函数类似，主要用于计算一维终点，在本例中为\
  \ LT₅₀。当浓度相对恒定但暴露持续时间可变时，时间-反应函数很有用。确定时间-反应函数后，评估者可以考虑暴露时间变化对效应严重程度或反应比例的影响。\n\n\
  **时间-浓度** 包含时间的毒性最有用的二维模型是时间-浓度函数或毒性曲线（Sprague 1969）。它由实验数据创建，通过在测试期间多个时间点记录数据，并对每个时间计算\
  \ LC₅₀、EC₅₀ 或导致其他反应比例或严重程度的浓度，如上所述。然后将这些浓度随时间绘制并拟合函数（图 5.7）。此类函数已被著名科学家在重要出版物中提倡（Lloyd\
  \ 1979；Sprague 1969），但它们很少被使用，即使它们所需的数据量与标准方法用于鱼类连续流动 LC₅₀ 所需的数据量相同（ASTM 1991；USEPA\
  \ 1982）。如果使用的反应对应于评估终点上显著效应的阈值，则该函数可用于确定任何暴露浓度和持续时间的组合是否会超过该阈值（即图 5.8 中的线以上区域）。\n\
  \n当时间是关注点但没有时间测试数据时，有必要近似时间动态。\n\n\n\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_243_0.png)\n\
  \n**图5.7** 毒性效应随浓度和时间的变化。该函数通过以LC$_{50}$或其他试验终点对测定时间（即24、48、72和96小时）作图得出。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_243_1.png)\n\
  \n**图5.8** 毒性效应随浓度和时间的变化，其中时间以二分变量表示，即急性和慢性。急性时间终止于96小时，即鱼类标准急性致死试验的结束时间。\n\n最简单的方法是将效应水平和暴露浓度在设定的时间类别内视为常数。这种方法在大多数环境评估中使用。评估者面对以标准试验终点表示的毒性效应，试图以某种合理的方式将试验持续时间与种群的时间动态相匹配。时间被分为急性和慢性两类，标准急性和慢性试验终点被用作区分可接受和不可接受浓度的基准。这种分类存在严重的概念性问题，我们现在就来讨论这些问题。\n\
  \n## “急性”和“慢性”作为时间类别\n\n术语的歧义使试验持续时间与暴露持续时间的匹配复杂化。由于“急性”和“慢性”分别指短时间和长时间，人们很容易将急性试验的终点与短期暴露联系起来，将慢性试验的终点与长期暴露联系起来。然而，这些术语已经获得了额外的含义，用它们来描述严重程度和持续时间会导致复杂化。人们假设急性暴露和反应比慢性暴露和毒性持续时间更短且更严重。这一假设背后的隐含模型是，慢性效应是长期暴露中毒物或毒物诱导的损伤累积而产生的亚致死反应。相反，由于慢性毒性试验的成本高昂，毒理学家试图通过识别那些发生迅速、严重到足以容易观察、但发生在与慢性试验中引起效应的浓度同样低的浓度下的反应来降低试验成本（McKim\
  \ 1995）。结果，急性-慢性二分法与时间和严重程度梯度之间的关系变得混乱。\n\n鱼类标准试验终点说明了这种混乱。标准急性终点是成鱼或幼鱼的96小时半数致死浓度（LC$_{50}$）（ASTM\
  \ 1991; OECD 1981; USEPA 1982）。标准慢性试验终点一直是最大可接受毒物浓度（MATC，也称为“慢性值”），即对存活、生长或繁殖产生统计学显著效应的阈值（ASTM\
  \ 1991; USEPA 1982）。由于该慢性终点仅基于最敏感的反应，那些总体上似乎较不敏感的生命阶段已从慢性试验中剔除，从而使这些试验从生命周期（12～30个月）缩短为早期生命阶段（28～60天）（McKim\
  \ 1995）。目前已有人提出，仅将幼鱼暴露11天或5～7天的试验可与较长的慢性试验等效。因此，鱼类慢性试验终点现在与短期事件（幼鱼的存在和反应）相关联，而急性终点适用于持续时间相似的暴露和持续存在的生命阶段。\n\
  \n即使是急性和慢性试验之间的严重程度区别也不明确。虽然LC$_{50}$明确表示对高比例种群的严重影响，但MATC与统计阈值而非特定效应幅度相关联的事实意味着它也可能对应种群中许多个体的严重影响。例如，在MATC下暴露于氯丹的雌性溪鳟中，超过一半未能产卵。\n\
  \n通过恢复原始的时间区分并以通用术语表达效应来澄清急性和慢性毒性之间的区别将是有利的。没有这种明确的区分，像图5.8这样的浓度-时间函数便毫无信息量。\n\n\
  ## 以浓度和持续时间替代浓度和时间\n\n在缺乏来自试验数据的可靠时间-浓度信息的情况下，可以假定一个浓度-持续时间函数。例如，用于A类损害评估的海洋溢油效应模型第一版只是简单地假设了一个线性函数（USDOI\
  \ 1986, 1987）。Lee和Jones（1982）将急性暴露中时间效应的线性假设与慢性暴露中时间独立性的假设相结合，生成了图5.8所示的浓度-持续时间函数。选择这种线性假设是出于其简单性，而非任何理论或经验证据。Parkhurst等人（1981）假设24、48和96小时的$LC_{50}$值可用，在这些值之间进行线性插值，并假设超过96小时的暴露具有时间独立性，从而生成了图5.9所示的函数。\n\
  \n这些方法依赖于这样的假设，即时间动态可以根据规定浓度下的不同暴露持续时间来处理。实际上，由于水体稀释体积或大气扩散的变化、废水水质和水量的变化、废水的间歇性排放以及意外泄漏或事故性排放，生物体所面临的暴露浓度存在连续波动的谱系。如果满足以下条件，则可以用常规方式处理这些波动：\n\
  \n- (i) 事件之间的时间足以恢复，从而可以将它们视为独立的；\n- (ii) 波动的频率足够高且振幅足够低，使生物体能够有效地对其取平均；或\n- (iii)\
  \ 某些频率占主导地位，因此可以如上所述确定暴露的时间类别。\n\n第三种可能性的一个例子是Tebo（1986）对水基点源废水波动的分类：性质相当均匀的蓄积且混合良好的废水、受短期日常波动的废水，以及受剧烈波动的分批处理废水。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_244_0.png)\n\n**图5.9** 毒性效应随浓度和时间的变化，其中急性时间在实测值之间插值，并外推至零和慢性时间的值，慢性时间以恒定离散变量表示。*来源*：引自Parkhurst等人（1981）。\n\
  \n## 最坏情况\n\n如果无法以这些方式中的任何一种来表征波动，则可以定义一个最坏情况的浓度和持续时间，并假设如果该事件在单独发生时不会引起不可接受的效应，那么当它作为波动暴露历史的一部分发生时也将是可接受的（图5.10）。这种假设在废水排放监管中被普遍采用。例如，水基废水的最坏情况稀释条件传统上是平均重现期为10年的7日最低流量，称为*7Q10*。EPA建议使用平均每三年重现一次的最低一小时平均稀释流量和四天平均稀释流量（USEPA\
  \ 1985c）。这些对应于最高的一小时和四天暴露。假设三年重现频率允许系统恢复，从而使峰值暴露可以被视为独立事件。\n\n## 寻找折中方案\n\n最好的解决方案是识别暴露或生物反应的特征时间模式，并要么进行毒性试验以模拟这些模式，要么将试验结果归类到其持续时间所落入的基于环境的时间类别中，从而避免急性-慢性二分法和最坏情况假设。也就是说，可以将时间缩放到决定这些过程的特征时间尺度上\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_244_1.png)\n\n**图5.10** 在评估中，波动的环境暴露浓度可以由与最坏情况峰值暴露相对应的连续暴露来表示，如垂直条所突出显示。\n\
  \n\n\n\n风险。例如，来自点源的气态污染物暴露可分为：(i) 烟羽冲击（一小时或更短），(ii) 停滞事件（数小时至一周），以及 (iii) 生长季节平均暴露。关于引起植物毒性效应的空气污染物浓度的现有数据，可以按这些类别相对于时间绘制（图5.11），然后与这三类事件中每一类的估计地面浓度进行比较。无论如何，暴露持续时间与毒理学终点的匹配应基于对所评估情况的分析，而不是基于对急性和慢性毒性的先入之见。\n\
  \n空气污染对植物的影响被称为“暴露剂量”。例如，McLaughlin和Taylor（1985）汇编了用SO₂对大豆和菜豆进行田间熏蒸的数据，并将产量减少百分比与以ppm·小时为单位的剂量作图。Newcombe和MacDonald（1991）发现悬浮沉积物对水生生物的影响严重程度是浓度与时间乘积的对数线性函数。\n\
  \n剂量的最严格定义是递送剂量，即化学物质在其毒作用部位的浓度或浓度的时间积分。这个概念的实证应用是测量给药化学物质在靶器官或组织、某些容易采样的替代组织（如血液）中的浓度，或者在小型生物的情况下测量全身浓度。通过将效应与体内浓度联系起来，而不是（或除了）环境暴露浓度，这种方法可以更好地理解试验期间观察到的化学物质的作用，并且作为环境监测的辅助手段是很有用的。它可以将野外采集的死亡、垂死或表面健康生物体内的污染物负荷与受控试验结果进行比较，以解释野外效应。毒物动力学模型提供了一种根据外部暴露数据预测靶器官剂量的方法。\n\
  \n效应可能不仅仅是峰值体内负荷（即mg/kg）的函数，而可能是体内负荷与时间的乘积，或更一般地，体内负荷的时间积分的函数。这个变量被称为“剂量负担”，用于评估放射性核素暴露的影响，也可能适用于某些重金属和其他环境污染物。\n\
  \n## 剂量-反应函数\n\n尽管剂量的定义多种多样，但所有定义都涉及生物体摄入的物质量。传统上，剂量只是生物体一次摄入、注射或以其他方式给予的物质量。对于这个定义，暴露持续时间不是问题（尽管反应时间可能是），结果以剂量-反应函数表示。这些函数，连同由其计算出的LD₅₀值，对环境评估者很有用，例如在施用杀虫剂时，由于摄入、吸入或表面暴露而发生极短时间暴露的情况下。\n\
  \n剂量的另一种定义是浓度与时间的乘积，如前文结合图5.7所讨论的，或者，如果浓度不是恒定的，则是浓度对时间的积分。这个概念适用于暴露浓度以及体内负荷，允许计算暴露于受污染介质中的剂量-反应函数。它已被普遍用于评估\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_245_0.png)\n\n图5.11 毒性效应作为浓度和时间的函数，其中时间表示为按暴露类别定义的划分变量（PS，烟羽冲击；SE，停滞事件；GS，生长季节）。\n\
  \n## 5.4.5.3 三维模型\n\n毒性效应的三维表示很少见。只有浓度-时间-反应模型可以容易地从常规试验数据中推导出来。这类函数可以从ASTM和EPA规程所要求的鱼类流水式96小时LC₅₀试验数据中推导出来（ASTM\
  \ 1991；USEPA 1982）。这类模型的明显优点是允许评估者从暴露浓度和持续时间的不同组合中估计效应水平。Richardson和Burton（1981）为暴露于臭氧化水中的两种河口物种以及暴露于SO₂的树木开发的响应曲面就是很好的例子。\n\
  \n浓度-时间-反应关系也可以是处理不同数据的有效工具。如果试验数据在效应持续时间和严重程度上都存在差异，那么如果要计算监管标准浓度，这两个维度都必须与浓度相关。Dourson（1986）解释了如何用这种方法估算人类每日允许摄入量。各种暴露被分类为：未观察到效应、未观察到有害效应、有害效应或明显效应。然后将这个严重程度等级转换为一组符号，绘制在剂量-时间平面上。然后通过目测拟合出曲线，将严重程度类别分开，并确定无有害效应水平、有害效应水平和明显效应水平。EPA也采用了同样的方法来制定空气污染物对植物毒性的空气质量标准。美国农业部报告称，地面臭氧对植物造成的损害（生长和产量）比其他空气污染物的总和还要大（图5.12和图5.13a、b）（USDA\
  \ 2011）。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_246_0.png)\n\n图5.12 NO₂对植物效应的分类，按暴露浓度和持续时间排列。\n\
  来源：摘自USEPA（1982）。\n\n环境。目前只有14%的塑料包装被收集回收。图5.14显示了在伦敦泰晤士河老Queenhithe码头现场冲上来的部分塑料垃圾（《西雅图时报》，2018年2月22日）。据估计，仅2010年就有440万至1320万公吨塑料进入海洋环境。该报告还强调，如果目前的趋势继续下去，到2050年海洋中塑料的重量将等于鱼类的重量。\n\
  \n在确定了化学品向空气、水和土地释放的暴露风险以及与该风险相关的不确定性程度之后，下一步是利用这些信息改进决策基础。这通常涉及公众，或者至少要考虑公众的关注和态度。这需要审视一个问题：“什么风险是可接受的？”其中一个重要部分是风险沟通——以公开和透明的方式进行沟通，理解和吸引利益相关者参与，以及提供平衡的信息，让公众能够就如何应对风险做出决定。\n\

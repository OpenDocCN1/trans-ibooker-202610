  \ | 9~15 |\n| 氯酚制造 | 氯化物 | 27 000 |\n| | 苯酚 | 140 |\n\n## 3.6 工业废水流变量\n\n### 3.6.1\
  \ 稀溶液\n\n连续制造过程的排放通常是相容的、有时是非常规污染物的稀溶液。它们可以被排放到行业的预处理系统，或不经任何预处理直接排放到POTW。电镀槽漂洗、生鲜食品清洗和原油脱水等制造过程都是可能直接排放到POTW生活污水管道的污染物稀溶液的示例。如果制造过程中出现问题，可能的结果是废水水质发生变化；可能含有更多污染物。来自公用事业服务的一些废水流，如冷却塔和锅炉排污，是连续性的，代表稀溶液的排放。\n\
  \n另一种低强度废水是来自化学品处理和储存区域的雨水径流。可能洒落在工业场地上的产品在暴雨或春季解冻时被冲刷掉。污染物浓度通常太低，排入下水道前无需预处理，但超过了排入地表水的排放标准。虽然暴雨径流的强度可能较低，但除正常流量外还必须处理的体积，进入预处理系统或POTW，可能会造成水力容量问题。过量的流量可以分流到储存水库或水池中，然后逐渐排放到预处理系统。\n\
  \n目前，大量注意力集中在清理受泄漏地下储罐污染的地下水源上。此类清理项目通常涉及大量废物，可能含有高浓度的溶剂、燃料、重金属和农药。由于公众对地下水清理项目的关注，几乎总是需要对受污染的水进行预处理，其结果通常是“优质”的工业废水。\n\
  \n### 3.6.2 浓溶液\n\n通常，浓溶液是分批产生的，产生频率通常不是每天，而是每周、每月、每年甚至更长时间。这些溶液是在同一制造过程中无法再生或回用的工艺化学品或产品。诸如废弃电镀液、酸、碱、静态带出液和废品等浓溶液，其污染物浓度可能比POTW的排放限值高数百或数千倍，或者如果一次性排放，可能高于预处理系统能充分处理的水平。必须花时间检查和理解每个制造过程，然后识别这些浓溶液，并采取必要措施防止对处理设施造成损害。\n\
  \n有些废物可能被POTW视为浓溶液，但行业并不这样认为。例如，用于零件酸洗的10%硫酸溶液，与该行业用于配制酸洗液的98%或50%原液相比，被视为“稀”溶液。当该溶液报废或不能再用作酸洗液时，需要进行适当的处理和处置。从工业制造商的角度来看，该溶液已经报废，不再浓缩。然而，从废水处理的角度来看，该溶液是浓缩的，因为与正常的pH\
  \ 1.0–4.0和重金属浓度低于100 mg/l（TWT 1999）相比，它含有高浓度的酸（pH < 1.0）和重金属（1000 mg/l）。浓溶液的另一个来源是设备清洗产生的废水。虽然工艺化学槽中的物料量按行业标准可能被视为稀溶液，但在制造设备清洗期间排放时，它形成浓废水流。清洗废水流在第一次清洗罐、管道或泵时含有高浓度的产品。这种浓缩废物的排放之后是连续的漂洗，漂洗液中的污染物越来越少。如果清洗流量浓度不均化，清洗周期可能会在工业废物处理系统（IWTS）中造成问题。溅到地面的工艺化学品，如果不能被围堵，可能直接流入地面排水沟和预处理系统或下水道系统。对预处理系统和POTW的不利影响与任何其他浓溶液相同。这就是为什么化学品围堵区域不得有排水沟。\n\
  \n## 3.7 污染物浓度与质量\n\n要确定工业废水中污染物的浓度和质量对行业预处理系统、POTW收集、处理和处置系统以及行业排放采样的影响，需要了解其浓度和质量。废水中的物质浓度通常以毫克/升表示，是单位体积质量的度量。物质的质量通常以磅或千克表示，是重量度量。质量排放速率是单位时间重量的度量，通常以磅/天或千克/天表示。许多电镀和所有金属精整分类标准以浓度表示，而大多数其他分类标准则以质量排放速率标准表示。排放速率标准认识到，随着产量和水量的增加，污染物质量也会增加。这种方法可防止稀释污染物以满足浓度限值。通过了解废水中污染物的浓度和废水体积，可以计算物质的质量排放速率。\n\
  \n污染物浓度和质量对POTW收集、处理和处置系统的影响，通常与其对IWTS的影响相同。然而，POTW系统任何部分的水力问题都可能导致污染物未经处理就穿过POTW，即使污染物质量没有变化。如果日质量负荷相同，但瞬时质量排放速率变化很大，POTW的收集系统可能无法均衡高浓度溶液的冲击负荷。结果可能干扰处理系统，导致违反出水或污泥处置限值，或两者兼有。\n\
  \n### 3.7.1 产生和排放频率\n\n对于行业预处理系统的运行以及POTW的收集、处理和处置系统而言，重要的是工业废物的产生频率\n\n\n\n\n##\
  \ 3.7.2 运行时间与排水时间\n\n通常情况下，运行时间也是向工业废水系统（IWTS）的排水时间。因此，运营人员通常可以预期在运行时间内接收到用于处理的流量。如果生产是恒定的，排水量和化学成分也将保持恒定。以下描述了几种常见情况，在这些情况下，工业废水必须在正常生产时间之外进行处理：\n\
  \n- 1. “湿法”工艺运行一个班次，但“干法”工艺运行两个班次。干法工艺可能需要公用设施，例如压缩空气或锅炉，每种设施都有废水排放。\n- 2. 在拥有较长收集系统的行业中，生产和废水流向系统可能会停止，但\
  \ IWTS 可能会继续运行和排水，直到收集系统中的废水被处理完。\n- 3. 泄漏、意外排放或流向 IWTS 的风雨洪水流可能导致 IWTS 在正常生产时间之外运行。\n\
  - 4. 食品加工厂运行一个或两个班次，产生少量废水，但大部分设备清洗操作发生在非生产班次。清洗过程产生了大部分的废水体积。\n- 5. IWTS 在 IWTS\
  \ 的起始处或制造系统的末端设有调节池（均化池）。由于程序设置为将水泵送至下一个单元工艺直到达到低液位，调节池向 IWTS 其余部分的排水可能在生产停止后继续。\n\
  \n废水的均化（调节）是影响向 IWTS 和下水道实际废水排放时间的重要因素。为了向 IWTS 输送相对恒定的流量和污染物浓度，可以使用大型废水收集池、调节池或储罐。如上所述，这些均化装置还可能延长排水时间，超出制造设施的实际运行时间。工业废水流量的均化对市政污水处理厂（POTW）也可能有益。通过延长工业排水时间，由于工业流量率降低，POTW\
  \ 收集系统的可用水力容量实际上增加了。由于生活废水流量的正常昼夜变化（峰值流量通常出现在上午 8:00 至下午 6:00 之间），如果允许大量工业废水在短时间内排放到下水道中，可能会超过下水道的液压容量。因此，工业部门可能需要仅在夜间进行排水。然后，对这种排放的采样将移至夜间时段。\n\
  \n## 3.7.3 排水量的变化\n\n具有每日、每周或季节性制造周期的工业部门将表现出废水生成的变化。工业社区各个细分领域的商业周期将影响生产；因此，也会影响废水的生成。食品加工业提供了排水量和排水质量在每日、每周和季节上变化的良好例子。例如，一家加工柑橘皮制作果胶的企业取决于果皮何时到达工厂。这可能意味着每周三天到六天。随着季节的推进，果皮类型从橙子变为柠檬，糖分含量发生变化，从而产生略有不同的废水类型。柑橘季结束后，工厂完全关闭。在某些行业中，废水量的变化反映了业务性质或特定业务细分的商业周期。在一家生产印制电路板的小型工厂中，典型情况是\
  \ 30 天的周转，销售、订购和开发发生在月初。在生产测试板时生产缓慢，但一旦电路板开发完成，生产就会以快节奏进行，以便在月底最后一周发货。印制电路板行业受到市场下行和上行周期的影响。该行业的主要污染物是铜，因此，排放到工业污水系统中的铜量根据市场和生产周期波动。\n\
  \n工业废水质量的变化也可能由市场力量或环境顾虑引起，要求生产不同类型的产品。例如，在金属表面处理行业中，公司正在从使用镉电镀金属（一种环境危害更大且排水限制更严格的物质）转向使用锌电镀部件。了解行业、制造工艺和市场力量是工业废水处理厂运营人员预测工业排水变化所需的宝贵工具。\n\
  \n## 3.7.4 连续排放和间歇排放\n\n制造设施的排放通常反映设施所使用的制造过程类型。连续工艺倾向于以连续方式产生废水，且体积和质量相对恒定。批次工艺或每个班次、每天或每周发生一次的活动倾向于产生间歇性排放。此外，作为一个一般经验法则，制造工艺规模越大，发生连续排放的可能性越大。具有连续排放的制造工艺例子包括部件或食品的冲洗或清洗、原油加工（在井口或炼油厂）、空气或烟气洗涤、造纸和皮革鞣制。间歇性废水排放的特征是两次排放之间存在时间间隔的废水排放。\n\
  \n这些通常发生在制造工艺的开始或结束，或在设备清洗、泄漏、废液置换或不合格产品处置期间。间歇性排放往往比正常排放的废水更浓、体积更小。对于工业预处理设施而言，间歇性排放和废水生成的变化决定了系统的设计容量。\n\
  \n## 3.7.5 工业废水\n\n尽管生活废水的性质相对恒定，但工业废水的极端多样性要求对每种行业进行单独调查，通常涉及使用特定的处理工艺。因此，深入了解生产流程和系统组织至关重要。\n\
  \n需要考虑四种类型的工业废水：\n\n- 1) *一般制造废水*：大多数工艺都会产生由于水与气体、液体或固体接触而产生的污染废水。废水要么是连续的，要么是间歇的。它们甚至可能一年中只在几个月内产生（例如农业和食品行业中的运动，甜菜糖生产为两个月）。通常，如果生产规律，污染流量是已知的。然而，对于从事特定运动（如合成化学、制药及相关化学工业）的行业，由于废水始终在变化，分析起来更为困难。\n\
  - 2) *特定废水*：某些废水可能会分离出来，要么是为了进行特定处理后回收，要么是为了储存在储罐中，准备好以加权流量重新注入处理线，例如酸洗和电镀槽液，或废烧碱。\n\
  - 3) *一般服务废水*：这些废水可能包括废水（如食堂废水）、用于加热水（锅炉排污、失效树脂再生剂）等。\n- 4) *间歇废水*：这些不可忽略；它们可能来自处理或储存期间的产品意外泄漏、地板冲洗水以及被污染的水，其中雨水也可能导致水力过载。\n\
  \n为了正确设计工业废水处理厂，必须仔细确定以下参数（IWT 1999）：\n\n- 1) 生产类型、产能和周期，使用的原材料\n- 2) 工业工厂使用的补充水的组成\n\
  - 3) 分离废水和/或循环利用的可能性\n- 4) 每种类型废水的日排放量\n- 5) 平均和最大每小时流量（持续时间、频率，按类型）\n- 6) 每种废物及考虑中的特定行业产生的特定污染类型的平均和最大污染流量（频率和持续时间），因为它可能会严重干扰处理设施的某些部分的工作（胶水、焦油、纤维、油、沙子等）\n\
  \n在淀粉工业中，淀粉从木薯和土豆的块茎中提取。使用湿法工艺从富含淀粉的谷物（小麦、大米、玉米）中提取淀粉。该工艺的一般污染如表 3.5 所示。废水的性质取决于在共同清洗后对原材料使用何种特定处理。\n\
  \n废水通常呈酸性，这是由于乳酸发酵或白砂糖制造中的亚硫酸化工艺（pH 4–5）。当使用湿法技术提取淀粉时，污染来自水的蒸发，由挥发性有机酸组成。来自葡萄糖车间的蛋白质含量高且溶解度特别高的污染也是可能的。土豆加工的一般废物如表\
  \ 3.6 所示。\n\n## 3.7.6 废水质量指标：选定的污染参数\n\n### 3.7.6.1 固体物质\n\n废水中的固体物质可以是溶解的、悬浮的或沉降的。总溶解固体或\
  \ TDS（有时称为可滤残渣）测量为残渣的质量\n\n表 3.5 淀粉生产的湿法工艺一般污染情况。\n\n| 原材料 | 水量 (m³/T) | BOD₅ (kg/T)\
  \ |\n|---|---|---|\n| 玉米淀粉 | 2–4 | 5–12 |\n| 大米淀粉 | 8–12 | 5–10 |\n| 小麦淀粉（重力分离）\
  \ | 10–12 | 40–60 |\n\n\n\n\n\n可降解污染物的需氧量加上不可降解可氧化污染物的需氧量。\n\n## 3.7.6.5 氮\n\n氮是植物和动物生长的重要营养元素。大气氮的生物可利用性低于以氨和硝酸盐形式溶解的氮。溶解态氮的可用性可能导致藻类大量繁殖。氨和有机态氮通常以总凯氏氮的形式测定，而无机态氮的分析可用于更准确地估算总氮含量。\n\
  \n## 3.7.6.6 磷酸盐\n\n磷酸盐通过非点源和点源进入水体。非点源污染是指来自分散源的水污染。非点源污染可与点源污染形成对比，点源污染是在单一地点向水体排放。磷酸盐的非点源包括岩石和矿物的自然分解、雨水径流、农业径流、侵蚀和沉积、大气沉降以及动物/野生动物的直接输入，而点源可能包括污水处理厂和许可的工业排放。总体而言，非点源污染通常明显高于点源污染。因此，健全管理的关键在于限制点源和非点源磷酸盐的输入。水体中磷酸盐的高浓度是污染的迹象，并且在很大程度上导致富营养化。\n\
  \n## 3.7.6.7 废水中污染物浓度与负荷\n\n废水处理单元的负荷通常以每日起的 BOD 或 TSS 磅数或每日起的固体磅数以及每日起的流量数量表示。浓度与流量参数之间的关系基于以下换算系数：1.0\
  \ mg/l，即按重量计 1.0 百万分之一 ppm，等于 8.34 或 62.4 lb/百万加仑 MG，因为 1 加仑水重 8.34 lb。\n\n## mg/l\
  \ (ppm) 换算为 lb/MG\n\n```\nConversion of mg/l (ppm) to lb/MG\nlb/MG = mg/l | g/10^3\
  \ mg | lb/453.6 g | 3.7851 US gal | 10^6 gal/MG\n= 3.785×10^6 / 10^3 ×453.6 MG =\
  \ 8.34 / MG (3.1)\nor lb/day = ppm (mg/l) ×8.34 × (MG/day) (MGD)\n```\n\nPounds\
  \ of A per day = Concentration of A (mg / l) × Q (MGD) × 8.34 from Eq.(3.1)\n\n\
  or\n\n```\nPounds of A = Concentration of A (mg / l) × Q (million ft³) × 62.4 (3.2)\n\
  ```\n\nwhere\nA = BOD, TSS, or other constituents (mg/l)\nQ = volume of wastewater\
  \ (MG or million ft³)\n8.34 = (lb/MG)/(mg/l)\n62.4 = (lb/million ft³)/(mg/l)\n\n\
  ## Example 3.1 You recorded 4.0 ppm of TSS in an industrial wastewater flowing into\
  \ Wisconsin River at a rate of 25 million gallons per day (MGD). Find out how many\
  \ pounds (lb) of TSS are entering into Wisconsin River per day.\n\n## Solution\n\
  \n```\nlb / day = 8.34 × ppm × MGD\n= 8.34 × 4.0 × 25 = 834 lb / day\n```\n\n##\
  \ Example 3.2 Industrial wastewaters have a total flow of 2 930 000 gpd, BOD of\
  \ 21 600 lb/day, and suspended solids of 13 400 lb/day. Calculate the BOD and SS\
  \ concentrations.\n\n## Solution\n\nFrom the relationship in Eq. (3.1),\n\n```\n\
  BOD concentration = (21 600 lb / day) / (2.93 MGD × 8.34)\n= 880 mg / l\nSS concentration\
  \ = (13 400 lb / day) / (2.93 MGD × 8.34)\n= 550 mg / l\n```\n\n## 3.8 工业废水处理\n\n\
  ## 3.8.1 工业废水的变化\n\n工业运营产生的废水成分因行业的功能和活动而差异很大（表 3.3 和 3.4）。从这些例子可以看出，BOD 和 TSS 的日平均浓度可能存在显著差异。高短期负荷问题最常发生在小型处理厂，这些处理厂处理“冲击负荷”的储备能力有限。如果工业废水要排入收集系统在\
  \ POTW 中处理，\n\n则有必要充分表征废水以确定组分浓度和质量负荷的范围。这种表征也是为了确定在废水被允许排入 POTW 收集系统之前是否需要预处理。如果需要预处理，则预处理设施的出水也必须进行表征。此外，任何拟议的未来工艺变更也应进行评估，以确定它们可能对排放的废水产生的影响。\n\
  \n## 3.8.2 预处理计划目的\n\nUSEPA 国家预处理计划的目的是保护 POTW 和环境免受“冲击负荷”标准污染物或危险或有毒废物排入 POTW 系统时可能发生的负面影响。这主要通过规范排放有毒废物或异常强常规废物的非生活污水\
  \ POTW 用户来实现。联邦水污染控制法，即《清洁水法》，于 1972 年通过，旨在维持和改善环境水体的质量。其目标是消除向可航行水域引入污染物并实现可垂钓和可游泳的水质。NPDES\
  \ 及其许可计划为向水环境直接排放的点源制定要求。国家预处理计划是 NPDES 的一个组成部分，要求间接工业和商业废水排放者，或向 POTW 排放废水的排放者获得许可，规定在排放到\
  \ POTW 系统之前通过预处理或其他控制措施应达到的排放水质。因此，《清洁水法》赋予 EPA 制定和执行向 POTW 设施排放工业废水的预处理标准的权力。\n\
  \n### 3.8.2.1 预处理具体目标\n\n- 1) 防止向 POTW 引入会干扰 POTW 运行的污染物，包括干扰其市政污泥的使用或处置。\n- 2)\
  \ 防止向 POTW 引入会通过处理设施进入受纳水体或导致处理设施紊乱的污染物。\n- 3) 保护污泥质量并提高市政和工业废水循环再用的可能性。\n- 4) 减少通过收集系统和\
  \ POTW 排放有毒污染物造成的健康和环境风险。\n\n## 3.8.3 牙科废水预处理管理\n\n牙科诊所产生各种废物，需要正确预处理或管理以保护我们的健康和环境。本指南解释了最佳管理实践\
  \ BMP，有助于牙医遵守环境法规并防止污染。请注意，本指导仅适用于接入 POTW 的牙科诊所。操作废物绝不能排入化粪系统或 POTW，即使安装了汞合金分离器也不行。\n\
  \n牙科汞合金废物是 POTW 接收汞的重要来源，而它们无法处理废水中的汞，因此会污染天然水体和施用固体所在的土地。如需更多信息，请参阅美国牙科协会的牙科汞合金\
  \ BMP。\n\n2016 年 12 月 15 日，EPA 管理员签署了与牙科分类标准相关的最终规则，并将该规则提交联邦公报出版。用于合规目的的规则官方版本已在联邦公报出版物中公布。出版规则可在\
  \ https://www.epa.gov/eg/dental-effluent-guidelines-documents 找到。\n\n## 3.9 空气质量\n\
  \n术语环境空气、环境空气污染、环境水平、环境浓度、环境空气监测、环境空气质量等在空气污染术语中经常出现。其目的是将风的输送和扩散造成的室外空气污染，即环境空气污染，与室内由相同物质造成的空气污染区分开来。\n\
  \n工厂建筑内部的空气可能因工业过程向作业室空气释放污染物而受到污染。这是职业病的主要原因。防止和控制此类污染是工业卫生的实践的一部分。为了防止工人接触此类污染，工业卫生专家使用工业通风系统，将受污染的空气从作业室中移除并排放到工厂建筑外部的环境空气中，有时在排放前会进行去除污染物的处理。\n\
  \n家庭、办公室或公共建筑内部的空气备受关注，被称为室内空气污染或室内空气质量。这些内部空间可能受到以下来源的污染：燃料燃烧的烹饪或空间加热炉灶、烤箱或炉具，其燃烧产物排放到房间；从油墨、油漆、粘合剂、清洁剂或其他产品中蒸发的溶剂；以及从\n\
  \n\n建筑材料；以及室内其他污染源。如果这些源中的某些存在于建筑物内部，室内空气污染水平可能高于室外空气。然而，如果这些源都不在建筑物内部，则由于建筑物内部表面——墙壁、地板、天花板、家具和固定装置——具有吸附或反应气态污染物以及吸引并保留颗粒污染物的能力，从而部分地从居住者呼吸的空气中去除这些污染物，因此预计室内的污染水平将低于室外环境浓度。即使门窗敞开，这种吸附和保留作用也会发生，但如果门窗关闭，室内外浓度之间的差异会更大，在这种情况下，空气只能通过缝隙和墙壁的渗透进入建筑物。\n\
  \n在许多建筑物和其他封闭空间中使用和产生的许多材料以及粉尘对其居住者具有致敏性。不吸烟的居住者会暴露在吸烟者产生的烟草及其相关气态和颗粒排放中。这种情况在室内比在室外空气中更为普遍。已制定了许多条例来限制或禁止在公共场所和工作场所吸烟。人们曾尝试通过使用紫外线（UV）灯或化学品对空气进行消毒，以保护教室居住者免受感染和传染病的侵害。由于疾病传播实际上发生在室外和未受保护的房间，这些尝试均告失败。当然，在保持医院手术室无菌状态以及制药厂和类似工厂的生产操作方面，已有成熟的技术。\n\
  \n## 3.9.1  大气\n\n在中尺度上（图 3.2），随着高度变化，温度变化，密度也随之变化。一般来说，当我们从对流层向上经过平流层和中间层到达电离层时，空气变得越来越不稠密。在电离层的上部，与对流层相比，气体分子非常稀疏。\n\
  \n电离层和中间层引起了航天科学家的兴趣，因为航天器在往返月球或行星的途中必须穿越这些区域，并且卫星也在地球轨道的这些区域运行。由于这些区域对无线电通信的影响，通信科学家也对它们感兴趣；而大气污染科学家主要对其感兴趣，是因为它们吸收和散射太阳能量，这会影响到达平流层和对流层的太阳能量和宇宙射线的数量及光谱分布。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_105_0.png)\n\n温度 (°F)\n\n**图 3.2**  大气层区域\n\
  \n平流层引起了航空科学家的兴趣，因为飞机在此飞行；引起了通信科学家的兴趣，因为涉及无线电和电视通信；并引起了大气污染科学家的兴趣，因为污染物的全球传输，特别是地上核试验的碎片和火山喷发物就发生在这个区域，并且太阳能量的吸收和散射也发生在此处。该区域的下部包含平流层臭氧层，它吸收有害的紫外线太阳辐射。全球变化科学家对氯氟烃和其他在地球表面或由高空飞机释放的气体长期积累对该层造成改变所感兴趣。\n\
  \n对流层是我们居住的区域，也是本书的主要关注点。\n\n## 3.9.2 无污染空气\n\n无污染对流层空气的气体成分见表 3.7。无污染空气是一个概念，即如果地球上没有人类及其活动，空气的成分会是什么。我们将永远无法知道无污染空气的精确成分，因为当我们拥有手段和愿望来确定其成分时，人类已经污染空气数千年了。现在，即使在海上最偏远的地点、极地、沙漠和山区，空气最好被描述为稀释的污染空气。它非常接近无污染空气，但因其含有扩散且老化的人为污染残留物而与之不同。\n\
  \n真实的大气不仅仅是干燥的永久气体混合物。它包含其他成分——水和有机液体的蒸气以及悬浮的颗粒物质。在其凝结温度之上，蒸气分子在空气中的行为与永久气体分子一样。空气中的主要蒸气是水蒸气。当其凝结温度之下且空气饱和时，水会从蒸气变为液体。由于这种现象在空气中表现为雾或薄雾，并在暴露于空气的窗户和其他冷表面表现为凝结的液态水，因此我们都熟悉它。空气中水蒸气的数量从几乎完全干燥到过饱和变化很大，即重量百分比在\
  \ 0 到 4% 之间。表 3.7 中的气体成分以体积百万分率表示 – ppm (vol)（当浓度简单表示为 ppm 时）。\n\n## 3.9.3 移动源和排放清单\n\
  \n通常，移动源指交通，但诸如施工、设备、汽油动力割草机和汽油动力工具等源也包含在该类别中。因此，移动源由许多不同类型的车辆组成，这些车辆使用不同循环的发动机，使用多种产品作为燃料，并排放不同数量的简单和复杂污染物。汽油动力车辆的排放来自许多来源。随着当今大多数汽车使用无铅汽油，铅排放不再是一个主要关注点。\n\
  \n排放清单是给定时间段内进入空气的所有来源的污染物数量列表。该区域的边界是固定的。排放清单对管制机构以及规划和分区机构都非常有用。它们可以指出主要来源，控制这些来源可以大幅减少该区域的污染。它们可以与适当的数学模型结合使用，以确定达到环境空气质量标准所需总体控制程度。如果所选区域足够小，它们还可以用于指示采样网络的类型以及各个采样站的位置。例如，如果一个区域使用非常少量的含硫燃料，在该区域建立广泛的\
  \ SO₂ 监测网络将不是公共资金的最佳使用方式。排放清单可用于宣传和政治目的：“如果天然气无法满足我们区域的需求，我们将不得不燃烧更多的高硫燃料，SO₂ 排放每年将增加\
  \ 8 吨。”\n\n制定排放清单所使用的方法确实存在一些误差，但另外两种选择既昂贵又存在其自身的误差。第一种选择是连续监测该区域内的每个主要来源。第二种方法是在许多点连续监测环境空气中的污染物，并应用适当的扩散方程来计算排放量。在实践中，信息量最大的系统是所有三种方法的有机结合，并加以知识性地应用。\n\
  \n1990 年《美国清洁空气法修正案》(CAAA) 加强了对未达标地区计划和许可的排放清单要求。修正案规定：\n\n> **清单** – 此类计划条款应包括一个全面、准确、最新的清单，列出该区域所有相关污染物来源的实际排放量，包括局长认为必要的定期修订，以确保满足本部分的要求。\n\
  \n> **识别和量化** – 此类计划条款应明确识别和量化（如有）任何此类污染物或污染物，这些污染物将因在每个此类区域建设或运营新的或改造的主要固定源而允许排放。计划应向局长证明，为此目的量化的排放将与实现合理进一步进展相一致，并且不会干扰在适用的达标日期前达到适用的国家环境空气质量标准。\n\
  \n## 3.9.4 清单技术\n\n要为某区域制定排放清单，必须：(i) 列出该区域的源类型，如炉子、汽车和家庭壁炉；(ii) 确定每个列出的源排放的空气污染物类型，如颗粒物和\
  \ SO₂；(iii) 查阅文献以找到每种关注污染物的有效排放因子（例如，“露天燃烧废木材或锯末的颗粒物排放量为每吨消耗残渣 10 公斤”）；(iv) 通过实际计数或某种估计技术，确定该区域中特定源的数量和规模（钢铁冶炼炉的数量可以计数，但家庭壁炉的数量可能必须估算）；以及\
  \ (v) 将 (iii) 和 (iv) 中的相应数字相乘以获得总排放量，然后求和类似的排放以获得该区域的总数。\n\n一个典型示例将说明该程序。假设我们要确定在一个人口\
  \ 50,000 人的小城市中，供暖季节期间每天由燃油炉排放的一氧化碳量：\n\n- 来源是城市边界区域内的燃油炉。\n- 关注的污染物是一氧化碳。\n- 一氧化碳的排放因子以不同方式列出（每\
  \ 1000 升燃油 240 克，每燃烧器每天 50 克，废气中体积百分比 1½% 等）。对于此示例，使用每 1000 升燃油 240 克。\n\n从当地经销商协会获得的燃油销售数字，平均每天为\
  \ 40,000 升。\n\n$$ \\frac{240 \\text{ gm } CO}{1000 \\text{ L}} = \\frac{40000 \\\
  text{ L}}{\\text{day}} = 10 \\text{ kg CO / day} $$\n\n## 3.9.5 数据缩减和汇编\n\n最终的排放清单可以在计算机上编制。这将使信息存储在磁带或磁盘上，从而能够在新数据或新来源出现时快速且经济地进行更新。可以编写计算机程序，以便轻松地进行修改。有时会发生重大变化，清单必须完全更改。想象一下，当天然气首次在一个以前使用油和煤进行加热的商业住宅区可用时，将会发生的变化。\n\
  \n为了确定排放数据以及燃料变化将产生的影响，有必要使用从一种燃料到另一种燃料的适当热转换系数。表 3.2 列出了常用燃料的这些系数。\n\n如果安装了控制设备，该区域的排放量将发生重大变化。这可以在排放清单中显示，以说明其对社区的影响。\n\
  \n通过保持排放清单的最新状态，并至少每年更新一次，以应对燃料使用变化、工业和人口变化以及增加控制设备，可以获得该区域的现实记录。\n\n**表 3.7** 无污染空气的气体成分（干基）。\n\

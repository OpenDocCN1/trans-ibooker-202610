  \ |\n| 对二甲苯 | 100 ppm |\n\n危险废物管理中的慢性毒性通常由长期低水平接触危险化学品引起。慢性毒性难以量化，因为与急性毒性评估相比，对化学品的长期影响了解较少。工业卫生学家使用的参数TLV，是指工人在其整个职业寿命期间（即每天8小时、每周5天，整个工作寿命）可安全接触的空气中的化学物质浓度。目前已为数百种空气污染物规定了TLV。一些污染物（如致癌物）的TLV被设为零，因为没有阈值存在。TLV是美国政府工业卫生学家会议（ACGIH）的版权术语，该组织制定政策并不断更新TLV数据。表5.10列出了一些常见危险化合物的TLV。TLV上限值是指在任何时间都不应超过的浓度（ACGIH\
  \ 1986）。\n\n## 例5.11 如果一名工人接触100 ppm浓度1小时、90 ppm浓度2小时、80 ppm浓度5小时，估算8小时的时间加权平均浓度。\n\
  \n### 解答\n\n利用式（5.8），可得\n\n```\nTWA = (100×1 + 90×2 + 80×5) / (1 + 2 + 5) = 85 ppm\n\
  ```\n\n如果工作场所中存在多种化学物质，一种做法是假设这些毒物的效应是叠加的。对于具有不同TLV-TWA的多种毒物，其综合暴露量通过以下方程确定：\n\n\
  > 来源：摘自ACGIH（1986）。\n\n\n\n\n\n$$\n\\sum_{i=1}^{n}\\frac{C_i}{(TLV-TWA)_i}\\tag{5.9}\n\
  $$\n\n其中\n\n- *n* 是有毒物质的总数量  \n- *Cᵢ* 是相对于其他有毒物质的化学物质 *i* 的浓度  \n- (TLV–TWA)ᵢ 是化学物质\
  \ *i* 的 TLV–TWA。\n\n如果式 (5.9) 中的该和超过 1，则工人处于过度暴露状态。\n\n混合物 TLV–TWA 可由下式计算\n\n$$\n\
  TLV\\text{-}TWA_{mix}=\\frac{\\sum_{i=1}^{n}C_i}{\\sum_{i=1}^{n}\\frac{C_i}{(TLV-TWA)_i}}\\\
  tag{5.10}\n$$\n\n如果混合物中有毒物质的浓度之和超过该数值，则工人处于过度暴露状态。\n\n对于具有不同作用的有毒物质混合物（如酸性蒸气与铅烟混合），TLV\
  \ 不能假定为可加性（Crowl and Louvar 2011）。\n\n**例 5.12**  确定一名在 RCRA 溶剂回收作业空气中暴露于 42 ppm\
  \ PCE、38 ppm TCE、86 ppm MEK 和 35 ppm MIBK 的工人的混合 TLV–TWA。这些化学物质的浓度是否超过 TLV–TWA<sub>mixture</sub>？\n\
  \n根据表 5.10，这些化学物质的 TLV 为\n\n| Compound | TLV (ppm) |\n|---|---:|\n| PCE | 50 |\n\
  | TCE | 50 |\n| MEK | 200 |\n| MIBK | 50 |\n\n使用式 (5.9)，这些数值用于确定 8 小时工作日的 TLV–TWA<sub>mixture</sub>。\n\
  \n$$\n(TLV-TWA)_{mix}=\\frac{42+38+86+35}{\\frac{42}{50}+\\frac{38}{50}+\\frac{86}{200}+\\\
  frac{35}{50}}\n$$\n\n$$\n(TLV-TWA)_{mix}=73.6\\,ppm\n$$\n\n总暴露量 ΣCᵢ = 42 + 38 +\
  \ 86 + 35 = 201 ppm；由于 ΣCᵢ/(TLV − TWA)<sub>mix</sub> 的比值大于 1，这些 RCRA 化学物质的浓度超过了限值。根据\
  \ TLV，溶剂回收设施的空气质量不健康。\n\n## 5.11  安全设备\n\n认识与在各行业和制造厂工作相关的物理和大气危害很重要。然而，仅承认危害并不能保证安全的工作条件。雇主有义务根据\
  \ OSHA 提供安全设备并为员工建立培训计划。需要记住的重要一点是，使用设备和遵守安全程序的责任在于个人员工。下面的讨论将使员工和工厂工人熟悉正确的安全技术。\n\
  \n### 5.11.1  个人防护设备\n\n如果工程控制不能消除暴露，选择 PPE 的第一步是尽量减少需要保护的身体部位（眼睛、面部、耳朵、脚趾、全身等）。个人防护设备（PPE）的选择取决于覆盖范围以及暴露的严重程度和类型。更高风险的暴露需要更谨慎地选择\
  \ PPE 并进行严格的培训和认证（Ibrahim et al. 2018）。\n\n公司应选择经认证符合广泛接受标准的 PPE，以确保 PPE 足以用于预期用途。表\
  \ 5.11 列出了各种危害的标准和最佳实践及其适用性。了解每种 PPE 的局限性以及员工的潜在暴露非常重要。暴露途径需同时考虑危害源和靶受体。常见危害以及环境危害包括冷空气和表面、热应激和烟雾。靶受体可包括皮肤和眼睛（皮肤途径）和肺部（吸入途径）（Ibrahim\
  \ et al. 2018；ISO 2015；NFPA 2006, 2015, 2017, 2018a, b, c, d）。\n\n**表 5.11** 安全标准有助于选择合适的\
  \ PPE。\n\n| Regulation | Target area | Hazard | Intended users |\n| :--- | :---\
  \ | :--- | :--- |\n| NFPA 70E – Standard for Electrical Safety in the Workplace\
  \ | Full body | Electrical | All |\n| NFPA 1852 – Standard on Selection, Care, and\
  \ Maintenance of Open-Circuit Self-Contained Breathing Apparatus (SCBA) | Inhalation\
  \ | Biological, chemical, radiological, and/or nuclear (CBRN) | All |\n| NFPA 1891\
  \ – Standard on Selection, Care, and Maintenance of Hazardous Materials Clothing\
  \ and Equipment | Dermal | Physical and health | All |\n| NFPA 1986 – Standard on\
  \ Respiratory Protection Equipment for Technical and Tactical Operations | Inhalation\
  \ | Health | First responders |\n| NFPA 1992 – Standard on Liquid Splash-Protective\
  \ Ensembles and Clothing for Hazardous Materials Emergencies | Dermal | Liquid chemicals\
  \ | First responders and trained personnel |\n| NFPA 2112 – Standard on Selection,\
  \ Care, Use, and Maintenance of Flame-Resistant Clothing for Protection of Industrial\
  \ Personnel against Short-Duration Thermal Exposures from Fire | Dermal | Fire |\
  \ Industrial personnel |\n| NFPA 2113 – Standard on Selection, Care, Use, and Maintenance\
  \ of Flame-Resistant Garments for Protection of Industrial Personnel against Short-Duration\
  \ Thermal Exposures from Fire | Dermal | Fire | Industrial personnel |\n| ISO 11612\
  \ – Protective Clothing – Clothing to Protect against Heat and Flame – Minimum Performance\
  \ Requirements | Dermal | Fire | All |\n\n### 5.11.1.1  热暴露\n\n大多数行业特定指导重点关注防止火焰和热的\
  \ PPE。NFPA 2113（NFPA 2015）建议进行工作场所危害分析，以确定何时需要阻燃服装、手套。标准的第 A.5.2 节列出了建议使用阻燃服装的具体材料和任务（NFPA\
  \ 2015）。\n\n### 5.11.1.2  电暴露\n\n电气危害的 PPE 要求在 NFPA 70E《工作场所电气安全》中已明确规定，该标准涵盖了广泛的电气活动（NFPA\
  \ 2018a）。NFPA 70E 2018 版增加了电气危害和非电气危害（如防坠落、头部保护、足部保护等）的全面 PPE 清单（Ibrahim et al.\
  \ 2018）。\n\n### 5.11.1.3  化学暴露\n\n*安全数据表*（或以前的 *材料安全数据表*（SDS/MSDS））通常在标准温度和压力（STP）条件下推荐使用\
  \ PPE，并且通常不考虑化学品的全部潜力。化学过程的危害潜力取决于工艺操作条件的严重程度。某些工艺操作参数（如高压）可能会提高化学品的危害，而其他参数（如低温）可能会降低其危害。某些防护措施，例如容器的密封，也可降低化学品的危害潜力。\n\
  \nPPE 评估还应考虑任何潜在的副产物。两种相对无害的化学品的反应可能形成特别有害的化学品。例如，含有单质铜的稀硝酸溶液会形成一氧化氮，一种高毒性气体。\n\n\
  ### 5.11.1.4  吸入风险\n\n防止吸入危害可能是 PPE 选择中最艰巨的任务之一。NIOSH 提供了一个在线工具，*认证设备* 清单，提供有关呼吸器和呼吸装置如何防止化学、生物、放射性和/或核（CBRN）危害的信息（NIOSH\
  \ 2016）。该参考和附带的 URL 允许用户搜索满足其需求的 NIOSH 认证设备。在为有毒吸入物确定 PPE 时，了解毒性类型、慢性与急性暴露的影响以及毒性的其他特征非常重要。\n\
  \n### 5.11.1.5  眼部风险\n\n眼部保护极其重要，应佩戴以保护工人的眼睛。安全眼镜可防止外部碎屑、粉尘，并应通过包覆式设计或侧护板提供侧面保护。此外，护目镜提供更好的保护，有效防止化学品飞溅、撞击和粉尘环境中的眼部伤害。焊接需要特殊护目镜或防护罩（ANSI\
  \ 2015）。ANSI Z87.1 工作用安全眼镜标准概述了针对撞击、飞溅、粉尘和细粉尘（包括易燃粉尘和/或工厂建筑外“风吹粉尘”，例如煤堆和锯末）等各种危害的眼部保护要求。选择眼部保护时，应考虑人员的舒适度以及部分员工需要佩戴处方眼镜的需求。还应考虑某些化学品与隐形眼镜之间的相互作用。\n\
  \n### 5.11.2  个人防护服\n\n防护服是安全的重要方面，在工业设施工作时应遵循此处提供的指南。\n\n- **安全帽** – 所有进入受限空间的人员均要求佩戴安全帽。全强度安全帽应具有\n\
  \n\n\n帽檐和下颌带可防止头部受伤。硬帽在流程区域巡检时也可能防止受伤。\n\n- **连体服** – 人员的皮肤应尽可能覆盖，以防止擦伤和割伤，并避免与危险物质接触皮肤。\n\
  - **手套** – 在使用和/或操作机器以及处理液体、气体和固体材料时需要手部防护。除了防止有害化学品（例如溶剂、生物危害等）和/或热量通过皮肤吸收外，手套还能保护手免受割伤、擦伤或热应激。\n\
  - **鞋子** – 在受限空间内或周围、在流程区域、化学品储存区等处必须始终穿着橡胶底、防滑、防砸鞋（例如钢头、复合材料）和靴子。安全鞋旨在防止冲击和/或有害化学品。\n\
  - **耳塞** – 在噪音水平高的区域工作时应佩戴耳塞（例如一般制造区域）。该设备可保护员工和人员免受工作场所大声噪音的累积影响。\n- **安全护目镜**\
  \ – 在制造行业工作期间需要佩戴安全护目镜，以防止眼睛接触有害物质。接触镜在某些工业流程（如电镀作业）周围通常被禁止。如果有害物质通过飞溅或暴露于雾气或蒸气而进入人员眼睛，该物质可能会被困在镜片后面，很难冲洗干净，并可能造成严重的眼部损伤。\n\
  - **安全背心** – 在有车辆通行的工业工作区域中，安全背心是必要的警示装置。\n\n## 5.12 通讯设备\n\n对讲机和手机是与主要安全办公室保持联系的有效方式。对于危险场所，采样小组应在到达和离开每个采样地点时进行联系。工业外场通常位于无人居住的地区；因此，保持无线电或手机处于工作状态非常重要，以防需要呼叫求助。如果发生事故，救援人员必须在提供任何帮助给受害者之前先呼叫求助。\n\
  \n### 5.12.1 空气监测设备\n\n进入受限空间前，应进行测试以检测 (i) 爆炸性气体、(ii) 有毒气体的存在以及 (iii) 氧气不足。检测这些状况最有效的方法是使用大气监测仪。\n\
  \n以下讨论的气体探测器是用于大气监测最常用的。\n\n- *单一用途探测器* – 设计用于检测特定气体，例如一氧化碳、甲烷或硫化氢。这些气体通常存在于各种系统和受限空间中。用于测量较少见气体的单检测单元或管也可用。\n\
  - *双用途探测器* – 能够检测区域内氧气缺乏和爆炸性状况。\n- *组合探测器* – 能够检测氧气缺乏、爆炸性和有毒气体的存在。此类仪表通过检测全部三种危害提供最大保护。硫化氢和一氧化碳是通常测量的气体，因为它们在受限区域或缺氧系统中出现最频繁。\n\
  \n受限空间内的气氛可能会突然变化；因此，建议使用持续监测气氛的探测器。此外，探测器应配备在特定危险状况或电池电量低时激活的听觉和视觉报警装置，从而无需花费时间读取表盘或量规。\n\
  \n必须记住，使用大气测试仪并不能确保安全条件。气体探测器只是与潜在危险情况相关的信息来源之一。大多数气体探测器设计用于检测常见气体，如硫化氢，对于检测较少见物质如三氯乙烯蒸气则无效。有用于检测较少见气体的测试套件。该套件由活塞式泵和装有指示化学品的玻璃管组成，管的两端在使用前密封。探测管中的指示化学品针对特定污染物或一组气体。预定体积的空气通过管抽取，污染物与指示化学品反应，产生颜色变化，可与校准色卡比较以确定近似浓度。\n\
  \n在测量爆炸性时，气体仪表测量校准气体，通常为甲烷的下爆炸极限（LEL）百分比。气体在多种空气混合物中可燃。\n\n仪表不会区分气体，但仅相对于校准气体指示爆炸性。范围从下爆炸极限开始，下爆炸极限是可燃气体或蒸气在空气中支持燃烧所需的最低浓度。爆炸范围向上延伸至上爆炸极限（UEL），即支持燃烧的最大浓度。如果气体浓度低于\
  \ LEL，则燃料不足以\n\n建议使用带肩部连接救生绳的全身降落伞式安全带。此类安全带可使身体保持垂直，防止松软的身体在被拉出区域时掉落。\n\n救生绳应连接到包括防坠落机构的救援系统。此类安全系统的工作方式与汽车安全带类似，其中离心锁定机构在坠落时被激活。如果需要救援，此类救援系统可消除进入空间的需要。约有一半发生在受限空间的死亡事故是未计划的救援尝试，工人在本能冲动下冲入受限空间协助受伤的同事。\n\
  \n救援系统应从信誉良好的制造商或授权经销商处购买为完整系统，包括正确使用的维修和培训。救援系统的多数部件必须符合某些制造商规格，替换这些部件可能会导致人身伤害的责任。\n\
  \n安全设备必须定期维护和检查。安全带和救援绳应检查是否有纤维断裂、割伤或撕裂、化学损伤、腐烂以及扭结或极度僵硬。在每次使用前应对该设备进行目视检查，并应实施正式程序进行定期检查和维护。\n\
  \n### 5.12.4 呼吸\n\n呼吸器的主要功能是防止暴露于有害气氛。选择呼吸器时应根据要执行的作业和员工可能暴露的潜在危害。呼吸器的基本类型如下：\n\n\
  - *空气净化* – 过滤空气中有害物质的面罩。\n- *供气* – 从罐中提供安全呼吸空气的装置。\n\n空气净化呼吸器可去除粉尘颗粒和少量气体或蒸气，但不能防止重度气体浓度。此外，此类呼吸器提供的氧气仅为通过面罩过滤的氧气。空气净化呼吸器包括以下类型：\n\
  \n- *气体和蒸气呼吸器* – 受污染空气通过活性炭，活性炭捕获气体和蒸气。\n- *颗粒物呼吸器* – 受污染空气通过过滤器去除颗粒物。\n- *动力空气净化呼吸器*\
  \ – 鼓风机将受污染空气通过去除污染物并向面罩提供净化空气的装置。\n- *组合气体、蒸气和颗粒物呼吸器*（称为防毒面具）– 气体、蒸气和颗粒物通过装有过滤器和吸收气体和蒸气装置的罐过滤受污染空气。\n\
  \n空气净化呼吸器*绝不*应在缺氧气氛中使用。由于此限制，供气呼吸器更适合进入可能缺氧的受限空间。\n\n供气呼吸器与空气净化呼吸器不同之处在于佩戴者呼吸的空气来自外部来源。供气呼吸器的类型包括以下：\n\
  \n- *自给式呼吸器* – 通过提供可运输的呼吸空气供应来防止有毒气体和氧气不足。例如自给式呼吸器（SCBA）。\n- *供气呼吸器* – 通过空气软管从压缩机向佩戴者供应呼吸空气。\n\
  - *组合自给式和供气呼吸器* – 辅助气瓶在空气软管供应中断时提供帮助。\n\n人员必须意识到可能遇到的气氛危害，并应使用适合这些危害的呼吸器。仅使用已获国家职业安全卫生研究所批准的呼吸器（见\
  \ 29 CFR 1910.134）可在 https://www.osha.gov/pls/owadisp.show_document?p_id=12716&p_table=standards\
  \ 找到。在紧急情况下，呼吸器设备成为必不可少的防护装备。该设备故障可能导致受伤或死亡。必须严格遵守使用、清洁和维护说明以安全使用任何呼吸器。员工必须接受对其呼吸器使用和局限性的充分培训。\n\
  \n### 5.12.5 受限空间进入\n\n由于可能暴露于物理和呼吸危害，受限空间进入必须始终被视为危险任务。到达受车辆和行人交通影响的采样现场后，采样小组必须立即放置工作车辆并正确放置交通锥和警示旗，如有必要。完成此项后，必须对受限空间的大气条件进行测试，以检测氧气不足、爆炸性和有毒\n\
  \n\ngases. 应遵循以下空气监测程序：\n\n- 校准空气监测设备。每种气体探测器都有其自身的校准方法，人员必须接受对其可使用设备的校准和操作程序的培训。此外，人员必须知道如何解读设备的读数。校准数据应记录在案并纳入现场记录中。\n\
  - 将空气监测探头的尖端置入检查井的通风孔中以测试大气。应使用非金属探头，以免意外产生火花。\n- 如果读数可接受，则取下检查井盖并测试检查井。由于气体和蒸气可能比空气重，检查井内的气氛应从顶部到底部在多个深度进行测试。\n\
  - 如果受限空间内的读数可接受，则继续进行受限空间进入程序。如果读数因爆炸性气氛而不被接受，检查井盖可能会产生火花，因此不应打开。当遇到爆炸性气氛时，应立即联系相关部门（当地消防部门）。如果读数因缺氧或气体积聚而不被接受，则必须通风直至读数可接受。通风时间长短取决于空间大小。\n\
  \n所有进入受限空间的人员除所需的安全设备（即安全帽、安全手套等）外必须佩戴全身安全带。受限空间绝不能单独或无人协助进入。必须始终有一名第二人在场以应对紧急情况。此外，进入受限空间时，除安全带外应始终佩戴\
  \ SCBA，除非您拥有适当的通风和空气监测设备。安全带必须系在安全绳上，而安全绳又系在地面以上的救援系统上。在紧急情况下，待命人员应使用救援系统迅速将受伤人员移除。\n\
  \n## 5.12.6 安全培训\n\n充分安全培训的重要性不容过分强调。如果发生紧急情况，采样人员必须能够确定事故原因并做好相应准备。过于频繁地，由于准备不足，救援者会成为另一个受害者。安全程序应成为常规，最好的实现方式是通过持续培训。应为所有需要在受限空间工作或与在受限空间工作的人员团队一起工作的人员提供以下方面的培训：\n\
  \n- 心肺复苏和基本急救\n- 相关安全设备的使用\n- 受限空间进入程序\n\n进入和退出程序包括以下步骤：\n\n- *识别* – 采样人员必须能够识别检查和采样相关的潜在危害。培训应强调不当安全程序可能产生的后果。\n\
  - *测试* – 进入前必须对所有受限空间进行测试。\n- *评估* – 测试必须评估氧气水平、爆炸性和潜在有毒物质。采样和作业人员还应考虑所需的安全设备。\n\
  - *监测* – 受限空间内的气氛可能发生变化。因此，在采样和其他活动期间应持续监测该区域。\n\n必须为采样人员可能遇到的每种类型的受限空间制定救援程序。应保存培训和安全演练的书面记录。救援程序应经常练习，以确保在任何必要的救援情况下具备熟练程度。在制定成功的培训计划时，行业应鼓励征求其他机构（例如当地消防和救援部门）的帮助，这些机构在上述任何领域具有专业知识。\n\
  \n此外，化学和相关工业厂卫生方法的摘要见表 E.1。\n\n## 5.13 噪声\n\n噪声，通常定义为不需要的声音，是我们在出生前及一生中都会接触到的环境现象。噪声被视为一种环境污染物，是与各种人为活动同时产生的废物。噪声是任何声音——无论响度如何——它可能对个人产生不期望的生理或心理效应，并可能干扰个人或群体的社会目的。这些社会目的包括我们所有的活动——交流、工作、休息、娱乐和睡眠。\n\
  \n### 5.13.1 职业性噪声暴露\n\n噪声，或不需要的声音，是最普遍的职业健康问题之一。它也是许多工业过程的副产品。声音是由振动或湍流引起的介质（通常为空气）中的压力变化。这些压力变化产生远离湍流或振动源传播的波。暴露于高水平的噪声会导致听力损失，也可能导致其他有害健康影响。损害程度主要取决于噪声强度和暴露持续时间。噪声引起的听力损失可能是暂时性的或永久性的。暂时性听力损失源于短期噪声暴露，经过一段时间休息后听力会恢复。一般来说，长时间暴露于高噪声水平会逐渐造成永久性损伤。OSHA\
  \ 的听力保护计划旨在保护在整个工作生涯中可能暴露于此类噪声的工人免受听力损伤。\n\n更响；40 dB 是 10 000 倍更响，等等。因此在高水平下，即使是水平值的微小降低也会对噪声强度产生显著差异。\n\
  \n### 5.13.2 职业性噪声和听力保护基础\n\n### 5.13.3 噪声：物理原理\n\n估计有 2500 万美国人——其中许多是工人——暴露于威胁其听力的噪声。每个人在某个时候都经历过噪声污染的影响。许多人不知道导致他们严重健康威胁的声音是噪声污染的结果。噪声污染传统上并未被列为国家面临的主要环境问题之一；然而，它是日常生活中最常遇到的污染源之一。噪声通常被视为一种烦恼而不是污染源。这部分是因为与其它污染源不同，噪声不会在环境中留下可见的影响。\n\
  \n声音的频率是指源产生完整的高压和低压区域循环的速率。这以赫兹（Hz）为单位测量：1 Hz 为每秒一个完整循环。年轻人可听频率范围为 20 Hz 至 20 KHz。随着人年龄增长或暴露于过度噪声，听高频的能力会下降。老年人可能的有效截止频率为\
  \ 10 KHz 或更低。\n\n传统空气和水污染造成的损害已被广泛认可。证据就在眼前——在受污染的水、藻类爆发、石油泄漏和死鱼中，以及在灼伤眼睛和灼伤肺部的烟雾中。然而，噪声是一种更微妙的污染物。据估计，超过\
  \ 2000 万美国人不知不觉中暴露于来自卡车、飞机、摩托车、立体声、割草机和厨房家电等危险噪声水平。声音像水中的波浪一样通过空气传播波。波越高，其功率越大。声音的波数越多，其频率和音调就越大。\n\
  \n声强（I）是声能在垂直于声传播方向的单位面积上平均传输速率。它表示为能量通量率，通常以分贝为单位。分贝被定义为 10⁻¹² W/m²。声强是声源声功率（P）的函数。声强与声功率的关系由下式给出\n\
  \nI = P / 4πd²\n\n(5.12)\n\n声音强度或声级以分贝（dB）为单位测量。分贝刻度范围从 0，即正常健康耳朵的听觉阈值，到 94，即纯音的理论最大值。由于分贝刻度与\
  \ pH 刻度一样是对数刻度，20 dB 比 0 响 100 倍；30 dB 是 1 000 倍\n\n不应将声功率与声压（p）混淆。声压是指声源产生的超过环境大气水平的压力变化的均方根（rms）值。它通常以帕斯卡、牛顿每平方米（N/m²）或\
  \ dB 为单位测量。用于声压的 dB 以 20 µPa 或 2×10⁻⁵ N/m² 为参考，这被认为是正常人的听觉阈值。日常生活中遇到的声压范围相当广。代表性水平见表\
  \ 5.12。\n\n它由声级计测量，声压级（SPL），Lp，以 dB 为单位表征并以 dB 表示。\n\nLp = 20 log (p / p0)\n\n(5.13)\n\
  \n其中 p 为测量的 rms 声压，p0 为参考值，0.00002 N/m²。\n\n声强 I 与声参考强度的关系为\n\nLI = 10 log (I /\
  \ I0)\n\n(5.14)\n\n参考强度 I0 为 10⁻¹² W/m²。\n\n\n\n表5.12 代表性声压级。\n| 活动 | dB | N/m²\
  \ | 瓦特 |\n|---|---|---|---|\n| 最大感知级 | 1 | 0.00002 | 10⁻¹² |\n| 夜间，安静乡村地区 | 20 |\
  \ 0.0002 | 10⁻¹⁰ |\n| 安静房间 | 40 | 0.002 | 10⁻⁸ |\n| 正常交谈（3英尺） | 60 | 0.02 | 10⁻⁶\
  \ |\n| 重型车辆高速公路交通（汽车，50英尺） | 80 | 0.20 | 10⁻⁴ |\n| 直升机内部 | 90 | 0.70 | 10⁻³ |\n\
  | 电动割草机 | 95 | 1.0 | 0.04 |\n| 喷气式飞机 | 110 | 7.0 | 0.10 |\n| 疼痛阈值 | 120 | 20 | 1.0\
  \ |\n\n较短的时间间隔；每半段暴露时间（0.4小时/15分钟）可允许增加5 dBA，上限为115 dBA。因此，95 dBA可允许每天4小时，100 dBA可允许2小时，以此类推。一般而言，噪声水平超过85\
  \ dBA会使电话使用变得不可能，语音交流非常困难且受限，需要在仅2至3英尺的距离内大喊大叫。\n\n雇主必须向所有暴露于8小时时间加权平均噪声水平为85 dB或以上的工人提供听力保护器。这一要求确保员工在经历任何听力损失之前就能获得保护器：\n\
  \n- 1) 从他们首次暴露于8小时TWA噪声水平85 dB或以上起，直至接受基线听力图检查的任何超过6个月的期间。\n- 2) 如果他们出现了标准阈值偏移，表明其对噪声敏感。\n\
  - 3) 如果他们在8小时TWA中暴露于超过允许暴露限值90 dB的噪声。\n\n## 示例5.15 声压/声强关系\n\n某工厂安装了一台声级为83 dB的新噪声源，背景噪声水平为75\
  \ dB。组合声级是否会超过8小时工作日噪声的TLV？\n\n**解答**\n\nACGIH指南给出的8小时噪声TLV为85 dB。计算可使用式(5.14)进行。\n\
  \n$L = \\log(I/I_0)$ dB；参考值 $I_0 = 10^{-12} \\text{ W/m}^2$（表5.12），并根据新声源计算声压\n\n\
  $L = 83 = 10\\log\\left(\\frac{I}{10^{-12}}\\right)$ 或 $\\frac{83}{10} = \\log\\\
  left(\\frac{I}{10^{-12}}\\right)$\n\n取反对数并整理得 $I = 2 \\times 10^8 \\times 10^{-12}\
  \ = 2 \\times 10^{-4}$\n\n对背景声压级进行相同运算得\n\n$75 = 10\\log(I/10^{-12})$\n$3.2 \\times\
  \ 10^{-4} \\times 10^{-12} = I$；因此，$I = 3.2 \\times 10^{-5}$。\n\n将两个声强相加得 $2 \\\
  times 10^{-4} + 0.32 \\times 10^{-4} = 2.32 \\times 10^{-4}$，然后可用其确定组合声压级。$L = 10\\\
  log(2.32 \\times 10^{-4}/10^{-12}) = 10\\log(2.32 \\times 10^8) = 10 \\times 8.37\
  \ = 83.7 \\text{ dB（平均）}$，低于85 dB（平均）的TLV限值。\n\n## 示例5.16 噪声暴露\n\n一名工人每天暴露于94 dBA噪声水平30分钟，并暴露于88\
  \ dBA噪声水平3小时。该暴露是否超过噪声TLV？\n\n**解答**\n\n94 dBA噪声的TLV为1小时。\n85 dBA的TLV为4小时。\n组合噪声TLV可表示为\n\
  \n$C_1/T_1 + C_2/T_2 + C_3/T_3 + C_n/T_n = \\text{TLV的分数}$\n\n对于两种噪声水平的暴露，\n\n$0.5/1\
  \ + \\frac{3}{4} = 1.25$，\n\n大于1；因此，超过了TLV。\n\n## 5.13.4 噪声暴露与噪声防护\n\n对于8小时工作日的连续噪声暴露，OSHA设定的限值为90\
  \ dB平均，作为8小时TWA。\n\n雇主必须为平均每日8小时暴露超过85 dBA的员工提供听力保护计划、噪声监测、年度听力图检查和听力保护。更高的水平允许用于\n\
  \n## 5.13.5 噪声控制\n\n噪声控制可通过多种方式实现。可以重新设计机械以降低噪声。基本原理类似于控制室内空气污染：消除噪声源。这可以通过改进机械设计和维护，或通过增加刚度或使用橡胶或塑料缓冲垫或减震器来阻尼振动来实现。较大、较慢的机器通常比较小、较快的设备产生更少的噪声。可以使用皮带传动代替齿轮和凸轮，并且可以用液压或电动装置替代机械装置。\n\
  \n可以设计和建造各种类型的噪声屏障。噪声挡板是有效的，特别是对于较高\n\n频率。装饰性修正，如植树或视觉屏障，可能会提高对噪声水平的接受度，但对降低实际声压级作用甚微。距离是一种非常有效的噪声控制策略。值得注意的是，较高的声音频率比较低的频率更容易被衰减。\n\
  \n还有其他减少运动部件和机器噪声的手段和方法，如下所示：\n\n- • 减少摩擦阻力\n- • 减少旋转面积\n- • 减少噪声泄漏\n- • 隔离和阻尼振动元件\n\
  - • 提供消声器或其他消音装置\n- • 在传播路径上进行噪声控制\n- • 应用吸声材料\n- • 隔声罩\n\n## 示例5.17 噪声控制\n\n一台涡轮机的声功率输出为10\
  \ W。工作站计划位于距涡轮机10英尺处，位于可提供29 dB降噪的隔声 booth 中。 booth 内的声压级将是多少？它是否足够低以允许正常交谈？\n\n\
  # 解答\n\n对于自由场、全向声源，使用式(5.12)计算在d = 10英尺处的声强。\n\n```\nI = 10/4\\pi(3.05)^2 [将d转换为米：\n\
  10 ft \\times 0.305m/ft = 3.05m]\n= 0.086 W/m^2\n```\n\n使用式(5.14)转换为声压：\n\n```\n\
  L_t = 10log(I/I_0) = 10log(0.086/10^-12) = 109.3 dB\n```\n\n无衰减时\n\n```\n隔声 booth\
  \ 内 SPL = 109.3 - 29 = 80.3 dB\n```\n\n80.3 dB（未加权），高于正常交谈时的60 dB（表5.12）；因此，它会干扰正常交谈。\n\
  \n## 5.14 辐射\n\n### 5.14.1 定义\n\n辐射被定义为能量通过真空或物质的传播。任何能够通过与物质相互作用直接或间接产生离子的电磁辐射或粒子辐射，称为电离辐射。医疗用途通常涉及X射线和伽马射线，以及高能电子和低能β粒子。放射性物质或其他来源发出的微粒辐射，通常是α粒子、β粒子、重离子和中子，也是电离辐射的形式。波形式的辐射根据波长分类。辐射波长、速度和频率的关系如式(5.15)所示：\n\
  \n```\n辐射波长 = 辐射速度 / 辐射频率 (5.15)\n```\n\n### 5.14.2 不同辐射源\n\n太阳是一座巨大的核熔炉。它制造了大部分撞击地球大气层外部的宇宙辐射。大气层阻挡了大部分宇宙射线。生活在高海拔地区的人或喷气式飞机的机组人员，其上方的空气较少，因此他们比其他人受到更多的宇宙射线辐射。人们也暴露于人造辐射。大部分来自医疗和牙科使用的X射线和伽马射线。这些平均约为自然本底辐射的四分之一。\n\
  \n我们可以使铀原子分裂（裂变）来产生大量能量。裂变也会产生大量放射性同位素（“裂变产物”）和中子。稳定原子和中子可以结合产生放射性同位素。大多数裂变产物释放β粒子和伽马射线。β粒子是高能电子。伽马射线是高能波。一些放射性原子释放α粒子。α粒子是由两个质子和两个中子组成的高能粒子。它们比β粒子重数千倍。\n\
  \n### 5.14.3 外部暴露和内部暴露\n\n外部暴露：伽马射线可以穿透进入或穿过身体。β粒子可以穿透皮肤。α粒子甚至不能穿透皮肤外层。除了眼睛外，α粒子在体外是无害的。β粒子可被纸或铝等常见轻质材料的薄层阻挡。阻挡伽马射线需要厚层的常见材料（如混凝土）或厚层的高密度材料（如铅）。\n\
  \n内部暴露：任何放射性物质都可能随食物或饮料进入体内（摄入），或通过呼吸（吸入），或通过开放性伤口（皮肤）。如果发生这种情况，任何类型的辐射都可能直接伤害活细胞。一定量的放射性物质所造成的伤害存在差异\n\
  \n\nmaterial can do. That depends on how quickly it decays and the kind of radiation\
  \ it produces. It also depends on the kind of element it is. Some elements decay\
  \ quickly, while some elements are eliminated by normal body functions. But some\
  \ are long-lived and attach to tissues. They can stay in the body for a long time.\
  \ Some stay in the body indefinitely.\n\n## 5.14.4 放射性核素衰变\n\n所有放射性核素，即 α、β 等，均以特定的物理或放射性半衰期为特征，即一半放射性核衰变所需的时间。放射性衰变是指数过程，并由基本衰变定律描述，其数学表达式为\n\
  \n```\nA = A₀ e^(-λt)  (5.16)\n```\n\n其中 A 表示任意时刻 t 的活度，A₀ 表示零时刻的活度。衰变常数 λ 以时间的倒数为单位，表示衰变的速率或概率。λ\
  \ 值越大，半衰期 T₁/₂ 越短，其表达式为\n\n```\nT = 0.693/λ  (5.17)\n```\n\n经验法则是，经过 7 个半衰期后，活度降至原始量的\
  \ 1% 以下，经过 10 个半衰期后，降至 0.1% 以下。活度是指单位时间内放射性转化的次数。在旧单位制中，活度以居里 Ci 为单位表示。1 Ci 定义为\
  \ 3.7×10¹⁰ 次/秒的衰变。SI 单位中的对应单位是贝可勒尔 Bq，即每秒一次衰变。\n\n### 例 5.18 放射性衰变\n\n如果某放射性核素的衰变常数为\
  \ 0.086/天，750 Bq 的该核素衰变到 200 Bq 需要多长时间？其半衰期是多少？\n\n### 解\n\nA₀ = 750 Bq\nA = 200\
  \ Bq\nλ = 0.086/天\n衰变时间，使用式 (5.16)：\n\n```\nA = A₀ e^(-λt);  200 = 750 e^(-0.086t);\
  \  ln(200/750) = 0.086t\nt = 15.4 days\n```\n\n半衰期，使用式 (5.17)\n\n```\nT = 0.693\
  \ / 0.086 = 8.06 days\n```\n\n## 5.14.5 放射剂量\n\n从根本上讲，电离辐射对活体有害的后果是由于细胞和组织吸收的能量。吸收的能量或剂量会产生对活细胞中分子进行化学分解。分解的机制似乎与辐射与组织内原子之间的电离和激发相互作用有关。电离辐射在细胞或组织中产生的电离量或离子对数可作为由给定剂量或剂量预期产生的分解或生理损伤量的某种衡量。因此，辐射剂量测量的理想基础可以是感兴趣介质中发生的离子对数。出于某些实际原因，用于定义照射的介质选择为空气。\n\
  \n### 5.14.5.1 辐射剂量单位\n\n照射剂量：伦琴 Roentgen  用于表示 X 射线或伽马辐射照射的单位中 X 射线或伽马辐射的照射剂量为伦琴\
  \ R。其优点在于，伦琴表示的照射剂量通常可以与吸收剂量相关，而吸收剂量对于预测或量化辐射引起的预期生物效应 或损伤非常重要。\n\n伦琴是 X 射线或伽马辐射的照射剂量，使得每\
  \ 0.001293 g 空气产生的相关微粒发射在空气中产生携带一个静电单位电量的离子，无论正负。注意，标准状况下 1 cm³ 空气的质量为 0.001293\
  \ g。\n\n吸收剂量：戈瑞 Gray  任何电离辐射的吸收剂量是电离辐射赋予物质的能量除以受照物质在感兴趣处的单位质量。吸收剂量的 SI 单位是戈瑞 Gy。1\
  \ 戈瑞相当于吸收 1 J/kg 焦耳/千克。吸收剂量的旧单位为拉德。1 拉德相当于吸收 100 erg/g。1 Gy = 100 rads。希沃特 Sv 是将以\
  \ Gy 表示的吸收剂量乘以辐射加权因子得到的。\n\n## 5.14.6 电离辐射的生物效应\n\n进入体内的放射性物质通过两种机制排出：物理衰变和生物过程，每种机制都有其自身的特征半衰期。这两种机制的联合排出称为有效半衰期\
  \ T_eff，其由下式确定\n\n```\nT_eff = (T_rad × T_bio / (T_rad + T_bio))   (5.18)\n```\n\
  \n有效半衰期始终小于生物半衰期或放射性半衰期中的任一个。如果生物半衰期远小于另一个，则其近似等于有效半衰期。\n\n### 例 5.19 生物半衰期\n\n\
  一名工人一次急性暴露吸入放射性核素。体液样本显示半衰期为 6.1 天。该核素的衰变常数为 0.08/天。工人的生物半衰期是多少？\n\n### 解\n\n放射性半衰期由式\
  \ (5.17) 确定：\n\n```\nT = 0.693/λ = 0.693/0.08 = 8.7 days\n```\n\n生物半衰期由式 (5.18)\
  \ 得到：\n\n```\nT_eff = (T_rad × T_bio / (T_rad + T_bio))\n6.1 = (8.7 × T_bio / (8.7\
  \ + T_bio))\n6.1(8.7) + 6.1 T_bio = 8.7 T_bio\n53.1 = 8.7 T_bio - 6.1 T_bio = 2.6\
  \ T_bio; Therefore, T_bio = 20.41 days\n```\n\n#### 5.14.7 放射防护原则\n\n基本辐射照射限值为每年\
  \ 5 rem 50 mSv，称为最大允许剂量 MPD。来自所有来源的剂量，无论是内部还是外部辐射，均包括在内。对各种放射性核素制定了特定的年摄入量限值 ALI。摄入一个\
  \ ALI 将产生相当于 5 rem 50 mSv 的 MPD。特定放射性核素的允许空气浓度是通过将 ALI 除以年呼吸率并换算为空气体积的比活度得到的。这称为导出空气浓度，通常以旧单位制中的\
  \ μCi/ml 或 SI 单位中的 Bq/m³ 表示。\n\n上面描述的基本衰变定律的形式与 X 射线和伽马射线的屏蔽方程相同。基本屏蔽或衰减可表示如下：\n\
  \n```\n- dI/dx = μ I₀   (5.19)\n```\n\n其中\ndI = 辐射的减少量\nI₀ = 入射辐射\nμ = 比例常数\ndx\
  \ = 吸收体或屏蔽材料的厚度\n积分后得到\n\n```\nI = I₀ e^(-μx)   (5.20)\n```\n\n比值 I/I₀ 有时称为透射率。线性衰减系数\
  \ μ 是光子能量和屏蔽材料的特定函数，通常以厘米的倒数为单位。这是线性衰减系数除以密度并用 μ/ρ 表示。如果使用质量衰减系数，则屏蔽材料的厚度必须以可比较的倒数单位表示，该单位是通过将线性厚度乘以密度得到的。表和图表提供了通过实验确定的\
  \ μ 值，或不同厚度和不同屏蔽材料下的透射率值 图 5.17 和 5.18。\n\n### 5.14.7.1 外照射危害的降低\n\n采用三种基本方法来降低外照射危害：屏蔽、距离和减少照射时间。\n\
  \n### 屏蔽\n\n屏蔽是辐射防护最重要的方法之一。它是通过在源与受保护人员之间放置某种吸收材料来实现的。辐射在吸收介质中被衰减。常用的屏蔽材料有铅、水泥和铁，取决于辐射源。\n\
  \n### 距离\n\n距离不仅非常有效，而且在许多情况下也是最易应用的辐射防护原则。单一能量的 β 粒子在空气中具有有限的射程。有时使用遥控操作装置提供的距离可提供完全保护。\n\
  \n点源 X 射线、伽马和中子辐射的辐射强度降低适用平方反比定律。平方反比定律指出，点源的辐射强度随距源距离的平方成反比变化。\n\n```\nI₁/I₂ =\
  \ (R₂)²/(R₁)²   (5.21)\n```\n\n\n\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_272_0.png)\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_272_1.png)\n\n图 5.17  铅屏蔽材料厚度与辐射透射率。\n\
  \n图 5.18  混凝土屏蔽材料厚度与辐射透射率。\n\n其中，I₁ 是距源 R₁ 处的辐射强度，I₂ 是距源 R₂ 处的辐射强度。反平方定律不适用于扩展源或来自多个源的辐射场。\n\
  \n- a) 1.000 − 0.995 = 0.005\n- b) 根据图 5.17，使用 ⁶⁰Co 线\n  所需铅厚度 = 8.5 cm\n  （根据图表读数允许一定误差）\n\
  \n**减少暴露时间** 通过限制暴露于所有辐射源的持续时间，并在暴露之间提供充足的恢复时间，可以将辐射的不利影响降至最低。在紧急情况下，偶尔可能需要在剂量率很高的区域工作。可以通过限制总暴露时间来安全地完成这一点，使以一天为基础计算的平均允许值不超过辐射防护指南剂量，即每周\
  \ 1×10⁻³ Gy（0.1 rad）。\n\n## 示例 5.20 铅厚度\n\n需要多厚的铅（单位：cm）来屏蔽 ⁶⁰Co 源，使透射率降低 99.5%？\n\
  \n## 示例 5.21 混凝土厚度\n\n为实现与问题 5.20 中铅相同的屏蔽效果，所需混凝土的等效厚度（单位：cm）是多少？\n\n## 解\n\n- a)\
  \ 使用问题 5.20 中的透射率 0.005，以及图 5.18 中的 ⁶⁰Co 线。\n  混凝土厚度 = 53 cm\n  （根据图表读数允许一定误差。）\n\
  \n## 示例 5.22 放射性衰变\n\n应用公式 (5.21)\n\n```\nI₁/I₂ = (R₂)²/(R₁)²\n```\n\n```\nI₁/I₂\
  \ = (2.0)²/(1.0)²\n```\n\n```\nI₂ = 1.0/4.0 I₁ = 0.25 I₁\n```\n\n## 示例 5.23 放射性衰变\n\
  \n如前面所述，指数一级衰变可以用反应速率系数 (k) 或半衰期 (τ) 来描述。联系这两个参数的方程如下：\n\n```\nτ = 0.693 / k\n```\n\
  \n指数衰变可以用以下方程表示：\n\n```\nN = N₀ e⁻ᵏᵗ\n```\n\n其中\n\n- k = 反应速率系数（每单位时间）\n- N₀ = 初始量\n\
  - N = 时刻 t 的量\n\n使用以下方法确定 100 g 的 Po-210 样品在 5.52 天后剩余多少：\n\n- 1) 反应速率系数\n- 2) 半衰期\n\
  - 3) 计算两种方法之间的百分误差\n\nPo-210 的半衰期为 1.38 天。\n\n## 解\n\n- 1) 确定反应速率系数：\n  k = 0.693/τ\
  \ = 0.693/1.38 day = 0.502/day\n  5.52 天后剩余的物质数量如下：\n  N = N₀e⁻ᵏᵗ = 100e⁻⁰·⁵⁰²×⁵·⁵²\
  \ = 6.26 g\n\n- 2) 第一步是确定 100 g 样品在给定时间段内经历了几次半衰期：\n  半衰期次数 = (5.52 天)/(1.38 天)\
  \ = 4.0\n  因此，在 5.52 天的时间段内，100 g 样品经历了 4 个半衰期。\n  一个半衰期后剩余的物质数量计算如下：\n  (0.5)¹(100\
  \ g) = 50 g\n  因此，四个半衰期后剩余的物质数量为\n  (0.5)⁴(100 g) = 6.25 g\n\n3) 由于这两个方程在原理上是相同的，两个值之间没有差异。两个结果之间的微小差异是由舍入误差造成的。\n\
  \n## 5.15 全球变暖的影响：气候变化——世界的健康\n\n大约 40 年前，一小群科学家和政策制定者开始意识到人类正走在一条剧烈的碰撞轨道上：快速增长的世界经济和人口有可能与地球有限的资源和脆弱的生态系统发生碰撞。这一危险最早在\
  \ 1972 年斯德哥尔摩联合国人类环境会议上得到全球关注。同年出版的一本著名且有影响力的书《增长的极限》警告说，一切照旧可能导致 21 世纪的崩溃。\n\n\
  地球正在升温。自 1880 年开始有记录以来，陆地和海洋现在都更暖了，而且气温仍在上升。简言之，这种温度上升就是全球变暖。总而言之，气候变化因此是一个非常棘手的问题，而且时间所剩无几！导致人为气候变化的主要温室气体排放量每年都在增加，对地球的威胁也在增加。尽管地球面临的风险极高，我们却正在失去时间。\n\
  \n以下是美国国家海洋和大气管理局（NOAA）给出的基本数据。1880 年至 2016 年间，地表平均温度总计上升了 0.95 °C（1.71 °F）。变化速度为每十年额外上升\
  \ 0.07 °C（0.13 °F），其中陆地表面升温快于海洋表面——分别为每十年 0.10 °C（0.18 °F）和 0.06 °C（0.11 °F）。过去\
  \ 140 年的全球平均温度距平绘制在图 3.2 中。从图 3.2 可以看出，大部分变暖发生在两个时期——1910 年至 1940 年以及 1980 年至今。\n\
  \n截至 2017 年夏天，197 个国家中有 174 个国家批准了《巴黎协定》，其目标是将变暖控制在比工业化前地球平均温度高 1.5 °C（2.7 °F）的水平——大多数科学家和政策制定者都认为这是一个难以实现的目标。这就是人类如何设法让地球升温的。\n\
  \n### 5.15.1 温室效应\n\n19 世纪，科学家们已经弄清了基本物理原理和人为引起的气候变化。一位伟大的科学天才、瑞典诺贝尔化学奖得主斯万特·阿伦尼乌斯（Svante\
  \ Arrhenius）在没有计算机的情况下，徒手精确计算了大气中二氧化碳（CO₂）浓度翻倍的影响（Arrhenius 1896）。而且他是在 1896 年就完成了这一计算！他正确计算出，大气中\
  \ CO₂ 浓度翻倍将导致地球平均温度上升约 5 °C。这一估计在今天看来处于可能的范围之内，而这一范围是基于先进的计算机模型以及远比阿伦尼乌斯当时掌握的更广泛的数据得出的。\n\
  \n3500 磅。进一步假设汽油密度为 5.9 磅/加仑，按重量计含有 85% 的碳。“每辆汽车每年排放的二氧化碳相当于其自身重量”这一说法是否属实？接下来，鉴于全球约有\
  \ 8 亿辆机动车，请估算机动车每年的全球碳排放量。以每年太克（Tg）为单位给出答案（1 Tg = 1 万亿克 = 1 MT）。\n\n## 解\n\n每年燃烧的汽油中所含的碳为\n\
  (1200 mi/year) × (1 gal/20 mi) × (5.9 lb/gal) × 0.85\n= 3010 lb C/year\n\n排放的二氧化碳为\n\
  (3010 lb C/year) × (44 lb CO₂/12 lb C) = 11040 lb CO₂/year\n\n因此，美国普通汽车每年排放的二氧化碳远远超过其自身重量！\n\
  \n为了估算全球机动车的排放量，我们必须对世界上的平均车辆（包括轿车、卡车、公交车、摩托车等）做出一系列粗略的假设。假设世界上平均每辆车每年行驶 24 000\
  \ 公里，每升油行驶 9 公里，燃烧的燃料密度为 0.75 千克/升，碳含量为 87%。在这些假设下，年碳排放量为\n\n(24 000 km/year) ×\
  \ (1 l/9 km) × (0.75 kg/l)\n× 0.87 × 800 × 10⁶ vehicles\n× (1 Tg/10⁹ kg) = 1392\
  \ Tg/year\n（约 14 亿公吨/年，或约 1.4 Gt/年）。\n\n森林砍伐也是大气中 CO₂ 过量的一大因素。事实上，森林砍伐是第二大人为（人类活动）二氧化碳来源。当树木被砍伐时，它们会释放出在光合作用中储存的碳。根据\
  \ 2010 年《全球森林资源评估》，森林砍伐每年向大气中释放近 10 亿吨碳。\n\n甲烷是第二常见的温室气体，但它捕获热量的效率要高得多。据美国环保署称，2012\
  \ 年甲烷约占美国温室气体排放总量的 9%。美国环保署报告称，在 100 年时间里，甲烷对气候变化的影响是二氧化碳的 20 倍。\n\n### 5.15.3 全球变暖的影响真的是我们未来的担忧吗？\n\
  \n简短回答：是的。即使看似轻微的平均气温上升，也足以导致我们星球发生剧烈转变。\n\n8 华氏度——听起来可能不算什么，也许就像早春时节穿不穿毛衣的区别。但对我们所生活的世界而言，如果全球排放量继续沿着当前轨迹发展，气候专家预计到\
  \ 2100 年气温将至少升高 8 华氏度，这一小小的上升将对每个生态系统和生物——包括我们——造成严重后果，而这些后果已经开始显现。\n\n根据《国家气候评估》，人类影响是全球变暖的首要原因，尤其是我们通过燃烧化石燃料造成的碳污染，以及我们通过毁坏森林而失去的碳汇能力。我们释放到大气中的二氧化碳、甲烷、烟尘和其他污染物就像一条毯子，困住太阳的热量，导致地球变暖。证据表明，2000—2009\
  \ 年比至少过去 1300 年中的任何其他十年都要热。这种变暖正在以深远的方式改变着地球的气候系统，包括陆地、大气、海洋和冰层。\n\n### 5.15.4 更频繁、更严重的天气\n\
  \n更高的温度正在加剧多种灾害，包括风暴、热浪、洪水、干旱和野火。气候变暖使大气能够收集、保持和释放更多水分，从而改变天气模式，使湿润地区变得更湿润，干旱地区变得更干旱。\n\
  \n据自然资源保护委员会（NRDC）的清洁电力计划倡议（2015）称：“极端天气事件造成的代价越来越高，‘十亿美元级’天气灾害的数量预计还会增加。”\n\n根据美国国家海洋和大气管理局的数据，2015\
  \ 年美国发生了 10 起天气和气候灾害事件——包括严重风暴、洪水、干旱和野火——每起造成的损失至少为 10 亿美元。作为参照，1980 年至 2015 年间，年均灾害损失为\
  \ 52 亿美元（经通胀调整）。如果关注 2011 年至 2015 年，年均损失为 108 亿美元。\n\n随着变暖的大气容纳并倾泻更多水分，我们看到干旱、强风暴和洪水日益增多，这也对公众健康和安全构成风险。长时间的干旱不仅仅意味着草坪枯萎。干旱状况危及清洁饮用水的获取，助长失控的野火，并在美国导致风沙尘暴、极端高温事件和突发性洪水。在世界其他地方，缺水是死亡和严重疾病的主要原因。相反，强降雨导致溪流、河流和湖泊泛滥，损害生命和财产，污染饮用水，造成危险物质泄漏，并滋生霉菌……\n\
  \n\n\n不健康的空气。更温暖、更潮湿的世界也为食源性和水源性疾病以及携带疾病的昆虫，如蚊子、跳蚤和蜱虫，提供了便利。\n\n## 5.15.5 死亡率升高\n\
  \n今天的科学家将气候变化视为“二十一世纪最大的全球健康威胁”。这是一种影响我们所有人的威胁——尤其是儿童、老年人、低收入社区和少数群体——并且以多种直接和间接的方式影响。我们。随着气温飙升，疾病发病率、急诊室就诊次数和死亡人数也在上升。\n\
  \n## 5.15.6 空气更脏\n\n气温升高还会通过增加地面臭氧而加剧空气污染，地面臭氧是在汽车、工厂和其他来源的污染物与阳光和热量反应时产生的。地面*臭氧*是烟雾的主要成分，气温越高，我们拥有的就越多。空气更脏与哮喘患者的住院率和死亡率升高有关。它会恶化患有心脏病或肺部疾病的人的健康。而且更暖的气温还会显著增加空气中的花粉，这对患有花粉热和其他过敏的人来说是不好的消息。\n\
  \n## 5.15.7 野生动物灭绝率升高\n\n作为人类，我们面临着诸多挑战，但我们显然不是唯一承受高温的人。随着陆地和海洋发生快速变化，如果它们不能足够快地适应，栖息其中的动物注定会消失。有些会存活下来，有些则不会。根据政府间气候变化专门委员会（IPCC）2014年的评估，许多陆地、淡水和海洋物种正在将其地理分布范围向较凉爽的气候或更高海拔迁移，以试图逃离变暖。它们也在改变季节性行为和传统的迁徙模式。然而，许多物种仍然面临“由于气候变化而灭绝风险增加”。事实上，一项2015年的研究表明，具有脊椎的动物——鱼类、鸟类、哺乳动物、两栖动物和爬行动物等——的灭绝速度比应有的速度快114倍，这一现象与气候变化、污染和森林砍伐有关。\n\
  \n## 5.15.8 海洋更酸化\n\n由于气候变化，地球的海洋生态系统正承受压力。海洋正变得越来越酸化，这在很大程度上是由于它们吸收了我们过量的排放。随着酸化加速，它对水下生命构成了严重威胁，特别是具有碳酸钙外壳或骨骼的生物，包括软体动物、螃蟹和珊瑚。这可能对贝类渔业产生巨大影响。事实上，截至2015年，酸化据信已使太平洋西北部牡蛎产业损失近1.1亿美元。15个州的沿海社区依赖全国每年10亿美元的牡蛎、蛤蜊和其他有壳软体动物收获，也面临类似的长期经济风险。\n\
  \n## 5.15.9 海平面升高\n\n极地地区对变暖的大气特别脆弱。北极的平均气温上升速度是地球其他地区的两倍，世界冰盖正在快速融化。这不仅对该地区的人们、野生动物和植物造成严重后果；其最严重的影响可能是海平面上升。到2100年，预计我们的海洋将升高一到四英尺，威胁沿海系统和低洼地区，包括整个岛国和世界最大的城市，包括纽约、洛杉矶和迈阿密，以及孟买、悉尼和里约热内卢。\n\
  \n## 5.15.10 全球变暖对人类的影响\n\n气候变化带来了对地球地质、生物和生态系统的可能永久性改变（NAP 2011）。这些变化导致了对人类健康等不太大规模的环境危害的出现，例如极端天气（MPR\
  \ 2013）、臭氧层破坏、野外火灾危险增加、（Tang et al. 2014）生物多样性丧失（Sahney et al. 2010a）、粮食生产系统压力以及传染病的全球传播（McMichael\
  \ et al. 2003）。世界卫生组织估计，自1950年以来，有160,000例可以直接归因于气候变化。\n\n迄今为止，气候变化辩论中被忽视的一个方面，与全球变暖相关的地球物理变化相比，对气候变化对健康、粮食供应、经济增长、迁移、安全、社会变革以及饮用水等公共产品的影响所开展的研究要少得多。人类影响既可以是负面的也可以是正面的。例如，西伯利亚的气候变化预计将改善粮食生产和当地经济活动，至少在短期至中期如此。然而，许多研究表明，气候变化对人类社会当前和未来的影响是并且将继续以压倒性的负面为主。\n\
  \n气候变化的绝大多数不利影响由世界各地的贫困和低收入社区承受，他们对健康、财富等环境决定因素以及其他因素的脆弱性要高得多，而应对环境变化的能力却要低得多。全球人道主义论坛于2009年发表的一份关于气候变化对全球人类影响的报告估计，每年有超过30万死亡和约1250亿美元的经济损失，并指出大多数气候变化引起的死亡是由于发展中国家洪水和干旱加剧造成的。\n\
  \n2013年的一项研究得出结论，在当前排放情景下，热应激将大大降低劳动能力（Dunne et al. 2013）。有证据表明，高温会增加胎儿和儿童的死亡率。虽然主要关注点通常是更高温度的健康影响和风险，但应记住它们也会降低学习和工作生产力，这会影响一个国家的经济和发展。\n\
  \n## 5.16 关键脆弱性\n\n## 5.16.1 健康\n\n气候变化对人口健康构成广泛的风险——如果全球气候变化继续沿着当前轨迹发展，这些风险将在未来几十年增加，往往达到关键水平（McMichael\
  \ et al. 2003）。健康风险的三大主要类别包括（i）直接作用效应（例如由于热浪、加剧的空气污染和物理天气灾害），（ii）通过气候相关生态系统和关系变化介导的影响（例如作物产量、蚊子生态、海洋生产力），以及（iii）与贫困、流离失所、资源冲突（例如水）和灾后心理健康问题相关的更分散（间接）后果。\n\
  \n## 5.16.2 极端天气事件\n\n这种向更大变异性和波动性的趋势可能比长期逐渐升高的平均气温趋势更重要，因为它对人类健康的影响更大（Epstein 2002）。传染病通常伴随着极端天气事件，如洪水、地震和干旱。这些地方性流行病是由于基础设施丧失，例如医院和卫生服务，但也是由于当地生态和环境的变化。\n\
  \n## 5.16.3 环境\n\n气候变化可能会对栖息地丧失产生巨大影响，例如，干旱条件可能导致雨林的森林砍伐，正如过去所发生的那样（Sahney et al.\
  \ 2010b）。\n\n## 5.16.4 温度\n\n持续的湿球温度超过35°C是一个阈值，此时人类系统的韧性已不再能够充分冷却皮肤。美国国家海洋和大气管理局的一项研究\n\
  \n## 5.16.5 水\n\n人类所依赖的淡水资源对天气和气候变化高度敏感。2007年，IPCC高度确信地报告说，气候变化对所有地区的淡水资源和淡水生态系统都有净负面影响。IPCC还非常确信地发现，干旱和半干旱地区特别容易受到淡水影响（Kundzewicz\
  \ et al. 2007）。\n\n随着气候变暖，它改变了全球降雨、蒸发、降雪、径流和其他影响水供应和水质的因素。具体影响包括以下几点：\n\n- 更暖的水温影响水质并加速水污染（Miller\
  \ 2007）。\n- 海平面上升预计会在某些地区增加海水入侵地下水。这减少了可用于饮用和耕作的淡水量（Miller 2007；USEPA 2015）。\n-\
  \ 在一些地区，冰川和积雪的减少威胁着水供应。依赖融水径流的地区可能会看到径流减少，晚夏的流量减少，春季高峰提前（Miller 2007）。这会影响灌溉作物的能力。（这种情况对南美洲的灌溉、中央亚洲的灌溉和饮用水供应以及挪威、阿尔卑斯山和北美太平洋西北部的水力发电尤其严重。）\n\
  - 极端天气增加意味着更多的水落在无法吸收的硬化地面上，导致山洪暴发，而不是补充土壤水分或地下水位。\n- 蒸发增加将降低水库的有效性。\n- 与此同时，人类对水的需求将因冷却和补水目的而增长。\n\
  \n## 5.16.6 极端天气的社会影响\n\n世界气象组织解释说，“热带气旋对社会的近期影响增加”\n\n\n\n“在很大程度上是由沿海地区人口和基础设施集中度的上升造成的。”\
  \ Pielke 等人（2008 年）将 1900 年至 2005 年美国本土飓风损失标准化后发现，绝对损失增加的趋势已不复存在。1970 年代和 1980 年代之所以引人注目，是因为与其它年代相比，损失金额极低。1996–2005\
  \ 年十年是过去 11 个十年中损失第二严重的十年，仅次于 1926–1935 年十年。损失最严重的单场风暴是 1926 年迈阿密飓风，标准化损失为 1570\
  \ 亿美元（Pielke 等人 2008）。\n\n美国保险杂志预测，“由于建筑成本的增加、建筑物数量的增加及其特征的变化，预计灾难损失大约每 10 年就会翻一番。”\
  \ 英国保险人协会（ABI）表示，限制碳排放将避免到 2080 年代热带气旋额外年均成本的 80%。成本也在部分增加，因为在暴露区域如海岸和洪泛区进行建设。ABI\
  \ 称，减少对气候变化某些不可避免影响的脆弱性，例如通过更具韧性的建筑和改善的防洪设施，也可能在长期内带来相当可观的成本节约（ABI 2005）。\n\n##\
  \ 5.17 能源部门\n\n### 5.17.1 石油、煤炭和天然气\n\n石油和天然气基础设施容易受到气候变化以及风暴、气旋、洪水和海平面长期上升等灾害风险增加的影响。通过在灾害较少发生的地区建设来最大限度地降低这些风险可能代价高昂，并且对于沿海地区或岛国而言是不可能的。所有火力发电站都依赖水进行冷却。不仅淡水需求增加，而且气候变化可能增加干旱和淡水短缺的可能性。热电厂的另一个影响是，运行温度的升高会降低其效率，从而降低其输出。石油的来源通常来自容易发生自然灾害的地区，例如热带风暴、飓风、气旋和洪水。一个例子是卡特里娜飓风对墨西哥湾石油开采的影响，它摧毁了\
  \ 126 个石油和天然气平台，并损坏了另外 183 个（Urban and Mitchell 2011）。然而，以前 pristine 的北极地区现在将可用于资源开采。\n\
  \n### 5.17.2 核能\n\n气候变化以及极端天气和自然灾害可能会以与使用石油、煤炭和天然气的方式类似的方式影响核电站。然而，水短缺对由河流冷却的核电站的影响将大于对其它热电厂的影响。这是因为旧式水冷堆芯反应堆设计必须在较低的内部温度下运行，因此，\
  \ paradoxically，必须向环境排放更多的热量才能产生相同数量的电力。这种情况迫使一些核反应堆关闭，并且如果这些工厂的冷却系统不增强以提供更多容量，将再次发生这种情况。低河流水位和干旱导致河流达到冷却的最大温度，从而降低了核电供应。法国在\
  \ 2003 年和 2006 年热浪期间发生了此类停机。在热浪期间，17 个反应堆不得不限制输出或关闭。在法国，77% 的电力由核能生产；2009 年出现了类似情况，造成\
  \ 8 GW 的短缺，并迫使法国政府进口电力。德国也报告了其它案例，极端高温导致 1979 年至 2007 年间核电生产因高温而九次下降。\n\n### 5.17.3\
  \ 水电\n\n河流流量的变化量将与大坝产生的能源量相关。由于干旱、气候变化或上游大坝和分流导致河流流量降低，会减少水库中的活储量，从而减少可用于水电的水量。河流流量减少的结果可能是严重依赖水电的地区出现电力短缺。随着气候变化，流量短缺的风险可能会增加。美国科罗拉多河的研究表明，适度的气候变化（例如\
  \ 2°C 的变化，可能导致降水减少 10%）可能会使河流径流减少多达 40%。巴西尤其脆弱，因为其依赖水电，随着气温升高、水流量减少以及降雨制度改变，到本世纪末总能源生产每年可能减少\
  \ 7%（Urban and Mitchell 2011）。\n\n### 5.17.4 运输\n\n道路、机场跑道、铁路线路和管道（包括石油管道、下水道、自来水主管道等）可能会因承受更大的温度变化而需要增加维护和更新。已受不利影响的地区包括永久冻土区，其沉降水平高，导致道路弯曲、基础下沉和跑道严重开裂。\n\
  \n## 问题\n\n5.1 一个 RCRA 填埋场由于现场温度、风速和活动的变化，导致污染物挥发出现昼夜变化。最主要的污染物苯遵循以下模式：\n\n| 时长（小时）\
  \ | 苯浓度（ppm） |\n|---|---|\n| 8–9 a.m. | 5 |\n| 9–10 a.m. | 8 |\n| 10–11 a.m. | 8\
  \ |\n| 11 a.m.–12 p.m. | 9 |\n| 12–1 p.m. | 11 |\n| 1–2 p.m. | 14 |\n| 2–3 p.m.\
  \ | 11 |\n| 3–4 p.m. | 10 |\n\n确定填埋场苯浓度的 TWA。\n\n5.2 在一个 RCRA 90 天储存设施中采集的空气样品含有\
  \ 8 ppm 甲苯、12 ppm PCE 和 25 ppm MEK。\nA) 混合物的 TLV–TWA 是多少？\nB) 是否超过了 TLV？\n\n5.3\
  \ 确定在 RCRA 溶剂回收作业中暴露于 41 ppm PCE、38 ppm TCE、86 ppm MEK 和 35 ppm MIBK 的工人的混合物 TLV–TWA。化学品浓度是否超过\
  \ TLV–TWA混合物？\n\n5.4 一个地下储罐泄漏导致地下水羽流形成，烟雾已迁移到附近工厂的地下室。工厂室内空气样品显示甲苯和苯浓度分别为 50 和 70\
  \ µg/m³。\n\n确定在该工厂工作、暴露于这些蒸气 15 年的成年男性所产生的健康风险，假设呼吸量为 15 m³/天，两种物质均为甲苯和苯。通过吸入途径的致癌斜率因子-风险特定剂量为\
  \ 0.021（mg/kg day）⁻¹ 和 0.029（mg/kg day）⁻¹，分别对应甲苯和苯。假设甲苯和苯的环境风险是相加的。\n\n5.5 OSHA\
  \ 规定了雇主必须履行的基本职责。讨论这些基本职责。另请说明 NIOSH 和 OSHA 的主要作用。\n\n5.6 提供对典型 MSDS 表格上每项信息的简短（几句话）说明其必要性。\n\

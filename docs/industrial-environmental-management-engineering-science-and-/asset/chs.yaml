  #### 6.5.4.4 成本


  具体而言，必须考虑环境问题如何影响我们的经济思维，以及反过来经济决策如何影响环境。成本考虑是决策过程中在确定流程、产品或活动潜在改进措施阶段不可或缺的一部分。


  1、10 和 50 百万加仑/天 (mgd) (1 mgd = 3785 m³/天) 厂的估计资本成本分别为 $150 000、$700 000 和 $3 000
  000。O&M 成本估计分别为 2.6、1.4 和 0.8 美元美分/1000 加仑 (或 3.785 m³)，平均剂量为 6 mg/l。当剂量为 10 mg/l
  时，这些成本上升至 4.0、3.0 和 1.5 美元美分/1000 加仑。


  氯气和次氯酸盐的化学成本因地区、需求和供应情况而有很大差异。Cl₂ 的当前价格范围为：$0.0425–0.06/lb (或 454 g) 用于 90 T (或
  ~90 000 kg) 槽车；$0.10/lb 用于 55 T (或 ~55 000 kg) 铁路车；$0.25–0.275/lb 用于 1 T (或 ~1 000
  kg) 气瓶；以及 $0.50–0.55/lb 用于 150 lb (或 ~68 kg) 气瓶。液态次氯酸钠 (12.5%) 报价为 $0.50–1.75/gal。


  对处理污水处理设施的氯化/脱氯和紫外线消毒工艺进行简要成本分析，处理能力为 18 mgd，见图 6.12。这些成本会因地区、需求和供应而有很大差异。替代方案的年化成本值基于
  20 年期间 5.5% 的利率和设计平均厂流量 18 mgd (F. Soroushian, 个人交流; Temmer et al. 2000)。



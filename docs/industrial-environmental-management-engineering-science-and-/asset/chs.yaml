  #### 6.5.4.5 能源来源的环境影响及可再生能源的启示


  与氯化一样，紫外线消毒系统也需要能源供应。能够促进可持续发展实现的最重要因素之一是需要一种本身完全可持续的能源资源供应。有效高效地利用能源资源要求这些资源能够以合理成本随时获得，用于所有所需任务而不造成负面社会影响。显然，可再生能源与可持续发展之间存在密切联系
  (Das 2002)。



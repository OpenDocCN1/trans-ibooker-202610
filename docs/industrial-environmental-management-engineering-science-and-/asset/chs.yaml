  quad 0.015\\mathrm{lb}}{\\mathrm{GWh}\\quad\\mathrm{GWh}}\\right]$ $\\frac{0.1122\\\
  mathrm{lb}}{\\mathrm{GWh}}$ $\\times 100 = 86.66\\%$\n\n### 4.16 扩散模型：室内浓度\n\n工作场所空气中污染物的扩散导致污染物从高浓度区域向低浓度区域的净迁移。污染物的扩散得到通风系统驱动的平流传质的帮助。这两种影响的结合导致污染物从其源头向周围房间迁移。\n\
  \n质量平衡模型假定工作区域内化学污染物的浓度是均匀的。扩散模型具有显著优势；它们描述了污染物浓度随距源距离的变化。浓度梯度由以下方程描述，当平流仅在 *x*\
  \ 方向发生且扩散在各方向相等时：\n\n```\nu dC/dx = D/r^2 d/dr [r dc/dr]    (4.14)\n```\n\n- *u*\
  \ 是 *x* 方向的空气速度（长度/时间）\n- *C* 是空气污染物的浓度（质量/长度）\n- *D* 是扩散系数（长度$^2$/时间）\n- *x* 是距源的下风向距离（长度）\n\
  - *r* 是从源到采样点的距离（长度）\n\n\n\n\n对于排放到无限空间中的源，该方程已求解出浓度如下：\n\n$$C=\\frac{G}{4\\pi D\
  \ r}\\exp\\left[-\\frac{u}{2D}(r-x)\\right]\\qquad\\qquad\\qquad\\quad(4.15)$$\n\
  \n式中，G 为源的污染物排放速率（质量/时间）。\n\n扩散系数（D）可由采样点的测量值推导，也可根据文献中的现有值进行估算。在室内工业环境中，扩散系数的测量值范围为\
  \ 0.05 至 11.5 m²/min，其中 0.2 m²/min 为典型值。\n\n### 示例 4.12\n\n氟利昂以 0.74 g/min 的速率从敞开式蒸汽脱脂槽中释放。若空气流速为\
  \ 0.79 m/min，试估算脱脂槽下风向 3 m 处工人吸入空气中的浓度。\n\n### 解\n\n由于工人在脱脂槽的下风向，在扩散-对流方程（式 4.15）中\
  \ x = r，因此\n\n$$C=\\frac{0.74\\ \\mathrm{g/min}}{(4)(3.1416)(0.2\\ \\mathrm{m^2/min})(3\\\
  \ \\mathrm{m})}=0.1\\ \\mathrm{g/m^3}$$\n\n分子扩散理论严格适用于蒸气和气体；然而，空气动力学直径小于 10 μm 的颗粒物（PM）在工作场所空气中的分布方式与此类似。对于小颗粒物，使用扩散模型来描述粉尘和烟气的分布是合理的。\n\
  \n## 4.16.1 高斯扩散模型\n\n高斯扩散模型最常用于描述有毒空气污染物随距源距离增加而稀释的特征。该模型与实验数据具有良好的一致性，并且在其最简单的形式下计算简便。对于在完全反射的地面上方高度\
  \ H 处、沿烟羽中心线的连续点源（源强为 Q）排放所产生的平均浓度 C，可由下式给出：\n\n$$C=Q\\left(\\pi U \\sigma_y \\\
  sigma_z\\right)^{-1}\\exp\\left(-0.5H^{2}\\sigma_z^{-2}\\right)\\qquad\\qquad\\\
  quad(4.16)$$\n\n式中：\n\n- C 是有毒空气污染物的浓度（μg/m³）\n- Q 是源释放速率（μg/s）\n- U 是烟囱高度处的平均风速（m/s）\n\
  - H 是排放点在地面以上的有效高度（m）\n- y 是垂直于风向方向的距离（m）\n- z 是观测点的高度（m）\n- \\(\\sigma_y\\) 和 \\\
  (\\sigma_z\\) 分别为烟羽浓度在垂直于风向和垂直于地面方向上的标准差（m）。\n\n已发表的 \\(\\sigma_y\\) 和 \\(\\sigma_z\\\
  ) 值基于多种大气条件下速度波动的实验室和现场测量结果。大气稳定度用于表示大气中的混合程度，通常分为稳定、中性和不稳定三类。稳定大气的特征是温度随距地表距离的增加而升高，垂直混合减弱；夜间大气条件通常视为稳定。随着太阳加热地表，较暖且密度较低的空气在地表附近积聚，预计大气混合将更加剧烈；最终，重力会将暖空气与上方的较冷空气置换。白天的大气条件通常表示为中性或不稳定。\n\
  \n标准差之积已用如下形式的方程表示：\n\n$$\\sigma_y\\sigma_z = a x^b\\qquad\\qquad\\qquad\\qquad(4.17)$$\n\
  \n式中：\n\n- a 和 b 是常数（无量纲）\n- x 是距源的下风向距离（长度）\n\nKumar（1998，1999）进行了回归分析，得出了城市和乡村环境以及中性和稳定大气条件下常数\
  \ a 和 b 的表达式。当排放点附近区域存在许多障碍物时，适合采用城市环境；障碍物包括建筑物和树木。当排放点附近区域没有建筑物，且地形一般平坦无障碍时，适合采用乡村环境。表\
  \ 4.10 列出了当距源距离以米为单位时的回归结果。\n\n**表 4.10 扩散系数的回归方程。**\n\n| 条件 | 回归方程 |\n| --- | ---\
  \ |\n| a. 乡村排放，中性大气，x < 500 m | \\(\\sigma_y\\sigma_z = 0.01082 x^{1.78}\\) |\n\
  | b. 乡村排放，中性大气，x > 500 m | \\(\\sigma_y\\sigma_z = 0.04487 x^{1.56}\\) |\n| c. 乡村排放，稳定大气，x\
  \ < 2000 m | \\(\\sigma_y\\sigma_z = 0.0049 x^{1.66}\\) |\n| d. 乡村排放，稳定大气，x > 2000\
  \ m | \\(\\sigma_y\\sigma_z = 0.01901 x^{1.46}\\) |\n| e. 城市排放，中性大气，x < 500 m |\
  \ \\(\\sigma_y\\sigma_z = 0.0224 x^{2}\\) |\n| f. 城市排放，中性大气，x > 500 m | \\(\\sigma_y\\\
  sigma_z = 0.394 x^{1.54}\\) |\n| g. 城市排放，稳定大气，x < 500 m | \\(\\sigma_y\\sigma_z\
  \ = 0.008 x^{2}\\) |\n| h. 城市排放，稳定大气，x > 500 m | \\(\\sigma_y\\sigma_z = 0.34 x^{1.37}\\\
  ) |\n\n### 示例 4.13\n\n硫化氢以 0.025 kg/s 的速率从乡村地区的低架排气口释放。计算在白天风速为 4 m/s 时和夜间风速为 2.5\
  \ m/s 时，位于排气口下风向 300 m 处的工厂边界处的浓度。(a) 如果硫化氢的关注浓度为 42 mg/m³，工厂边界处是否会超过该浓度？(b) 对于居住在所述设施下风向\
  \ 300 m 处的人，如果其静息时吸入环境空气的速率为 0.9 m³/h，估算其在（i）白天和（ii）夜间接触硫化氢的量。\n\n### 解\n\na) 将地面以上高度设为零，即可使用式（4.16）计算地面浓度。白天和夜间条件下适用的扩散系数相关式分别由表\
  \ 4.10 中的第（a）项和第（c）项给出。对于白天条件：\n\n$$C = \\frac{0.025\\ \\mathrm{kg/s}}{\\pi(0.01082)(300\\\
  \ \\mathrm{m})^{1.78}(4\\ \\mathrm{m/s})} = 7.17\\times10^{-6}\\ \\mathrm{kg/m^3}\
  \ = 7.17\\ \\mathrm{mg/m^3}$$\n\n对于夜间条件：\n\n$$C = \\frac{0.025\\ \\mathrm{kg/s}}{\\\
  pi(0.0049)(300\\ \\mathrm{m})^{1.66}(2.5\\ \\mathrm{m/s})} = 5.02\\times10^{-5}\\\
  \ \\mathrm{kg/m^3} = 50.2\\ \\mathrm{mg/m^3}$$\n\n硫化氢浓度在白天条件下低于关注浓度，但在大气混合较弱的夜间超过了关注浓度。\n\
  \nb) 对于白天条件，(7.17 mg/m³)(0.9 m³/h) = 6.45 mg/h。对于夜间条件，(50.2 mg/m³)(0.9 m³/h) = 45.2\
  \ mg/h。\n\n## 4.16.2 建模协议\n\n建模协议的制定是作为法规许可分析一部分而进行的扩散建模分析的第一步。建模协议描述了建模将如何开展。通常需要向监管机构提交建模协议，以便在实施建模之前获得机构对建模的批准。建模协议包含以下要素：\n\
  \n- 扩散模型的选择\n- 建模方法和假设\n- 源输入的选择和准备\n- 气象数据的选择和处理\n- 环境污染物浓度的依据\n- 受体网格的建立\n\n##\
  \ 4.16.3 扩散模型的选择\n\n空气质量影响分析（AQIA）使用高斯扩散模型进行——这类模型采用高斯扩散的基本假设。此类模型有多种，不同的模型适用于不同的源类型和地形。\n\
  \n模型选择的主要参考是 EPA 的《空气质量模型指南》。该指南列出了由 EPA 开发和验证、被认为可可靠用于许可审批的模型。其中，指南中包含的两个模型最为常用，它们是：\n\
  \n- AERSCREEN\n- AERMOD\n\n### 4.16.3.1 AERSCREEN\n\nAERSCREEN 不是编写一个在精细模型更新时也需要更新的独立筛选模型，而是\
  \ AERMOD 及相关辅助程序的交互式包装器，用户通过响应程序提示来提供输入。这些响应用于为 AERMOD 和针对当前问题所需的其他程序编写输入文件。\n\n\
  AERSCREEN 是基于 AERMOD 的推荐筛选模型。该模型可针对单一源估算“最坏情况”下的一小时浓度，无需逐时气象数据，并且还包含用于估算“最坏情况”下\
  \ 3 小时、8 小时、24 小时和年平均浓度的换算系数。AERSCREEN 旨在产生等于或大于 AERMOD 在完整的气象和地形数据下估算结果的浓度值，但保守程度因应用而异。\n\
  \n\n\n\n\n- AERMET 用户指南 (USEPA 2019b)\n- AERSCREEN 用户指南 (USEPA 2016b)\n- AERSURFACE\
  \ 用户指南 (USEPA 2008)\n- 《固定源空气质量影响估算筛选程序》 (USEPA 1992)\n\n## 4.16.3.2 AERMOD\n\n\
  AERMOD 大气扩散建模系统是一个集成系统，包括三个模块 (Prater and Midgley 2008; Turner 1994; USEPA 2004b)：\n\
  \n+   1) 一种稳态扩散模型，设计用于短距离（最远 50 公里）固定工业源空气污染物排放的扩散。\n+   2) 一个气象数据预处理器（AERMET），可接受地表气象数据、高空探空数据，以及可选的现场仪器塔数据。然后计算扩散模型所需的参数，如大气湍流特征、混合高度、摩擦速度、Monin–Obukhov\
  \ 长度和地表热通量。\n+   3) 一个地形预处理器（AERMAP），其主要目的是在地形特征与空气污染羽流行为之间建立物理关系。它为每个受体位置生成位置和高度数据。它还提供信息，使扩散模型能够模拟空气流经山丘或绕过山丘流动的效果。\n\
  \nAERMOD 还包括 PRIME（羽流抬升模型增强）(Turner 1994; USEPA 2004b)，这是一种用于模拟污染羽流流经附近建筑物时产生的下洗效应的算法。\n\
  \n## 4.16.4 CALPUFF\n\nCALPUFF 是一个先进的集成拉格朗日烟团建模系统，用于模拟大气污染扩散 (Code of Federal Register,\
  \ 40 CFD)。该模型已被 USEPA 在其《空气质量模型指南》中采纳为评估污染物长距离传输及其对联邦 I 类区域影响的首选模型，并在涉及复杂气象条件的特定近场应用中逐案使用\
  \ (Scire et al. 1990; Turner 1994)。\n\n集成建模系统由三个主要组件和一组预处理和后处理程序组成。建模系统的主要组件是 CALMET（诊断性三维气象模型）、CALPUFF（空气质量扩散模型）和\
  \ CALPOST（后处理包）。这些程序 each 都有图形用户界面。除这些组件外，还有许多其他处理器可用于以多种标准格式准备地理物理（土地利用和地形）数据、气象数据（地表、高空、降水和浮标数据），以及与诸如宾夕法尼亚州立大学/NCAR\
  \ 中尺度模型（MM5）、国家环境预报中心 Eta 模型和 RAMS 气象模型等其他模型的接口。\n\nCALPUFF 模型旨在模拟浮力、烟团或连续点源和面源污染的扩散，以及浮力连续线源的扩散。该模型还包括处理污染羽流路径附近建筑物下洗效应的算法\
  \ (Turner 1994)。\n\n更多见解在第 D.5 节关于扩散建模中给出，了解如何预测从单个高架源或具有多个排放点的复杂工业综合体排放到大气中的污染物的时间平均浓度。\n\
  \n## 4.16.5 达标区和未达标区\n\n各州划分为空气质量控制区（AQRs）。空气质量等于或优于 NAAQS 中列出的主要标准的 AQR 称为达标区。而未达到主要标准的区域称为未达标区。图\
  \ 4.14 显示了美国所有未达标县，包括阿拉斯加和关岛的六种 NAAQS 污染物。\n\n## 4.17 国家实施计划\n\n《清洁空气法》要求各州制定个性化的\
  \ SIP，概述其实现 NAAQS 的计划。SIP 是由州、领地或地方空气区用来减少未达到 NAAQS 区域空气污染的法规和文件集合。\n\n### 4.17.1\
  \ SIP 必须满足哪些国家标准？\n\nEPA 已为六种“标准”空气污染物制定了 NAAQS——这些是广泛存在的常见污染物，已知对人类健康有害：\n\n+ \
  \  1) 一氧化碳污染\n+   2) 铅空气污染\n+   3) 氮氧化物污染\n+   4) 臭氧污染\n+   5) PM 污染\n+   6) 二氧化硫污染\n\
  \n《清洁空气法》确定了各州必须作为其 SIP 的一部分提交给 EPA 的具体要求，以实现和维持 NAAQS。SIP 为每个州实施、维持和执行 NAAQS 提供了计划。\n\
  \n### 被指定为“未达标”的县\n\n适用于《清洁空气法》国家环境空气质量标准（NAAQS） *\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_183_0.png)\n\
  \n图例 **\n6 种 NAAQS 污染物未达标指定县\n5 种 NAAQS 污染物未达标指定县\n4 种 NAAQS 污染物未达标指定县\n3 种 NAAQS\
  \ 污染物未达标指定县\n2 种 NAAQS 污染物未达标指定县\n1 种 NAAQS 污染物未达标指定县\n\n关岛- Piti 和 Tanguisson 县被指定为\
  \ SO2 NAAQS 未达标\n\n* 国家环境空气质量标准（NAAQS）是针对一氧化碳、铅（1978 年和 2008 年）、二氧化氮、8 小时臭氧（2008\
  \ 年）、颗粒物（PM-10 和 PM-2.5（1997 年、2006 年和 2012 年））和二氧化硫（1971 年和 2010 年）的健康标准。\n\n**\
  \ 计数中包括针对 NAAQS 和修订 NAAQS 污染物的指定县。已撤销的 1 小时（1979 年）和 8 小时臭氧（1997 年）被排除。部分县，即县的一部分被指定为未达标而另一部分为达标，在地图上显示为完整县。\n\
  \n图 4.14 美国 NAAQS 污染物的未达标县。\n\n### 4.17.2 SIP 包含什么内容？\n\n典型 SIP 的内容分为三类：\n\n+  \
  \ 1) 州采用的控制措施，包括法规或源特定要求（如命令和同意令）\n+   2) 州提交的“非监管”组成部分（见下例）\n+   3) EPA 为满足《清洁空气法》第\
  \ 110 条或第 D 部分的强制性要求而颁布的额外要求\n\n与 SIP 相关的 EPA 批准的文件和材料示例包括但不限于以下内容：\n\n+   - SIP\
  \ 叙述\n+   - PM 计划\n+   - 一氧化碳计划\n+   - 臭氧计划\n+   - 维持计划\n\n+   - 车辆检查和维护（I/M）SIP\n\
  +   - 排放清单\n+   - 监测网络\n+   - 为证明法律授权而提交的州法规\n+   - 第 D 部分未达标区计划\n+   - 达标证明\n+\
  \   - 交通控制措施（TCMs）\n+   - 承诺措施\n+   - 应急措施\n+   - 非监管和非 TCM 控制措施\n+   - 15% 进展率计划\n\
  +   - 紧急事件计划\n+   -  visibility 计划\n\n### 4.17.3 谁负责执行 SIP？\n\nSIP 通常由州执行。然而，EPA\
  \ 有权对联邦批准的 SIP 的违规者采取执法行动。\n\n如果 SIP 已由州批准但尚未由 EPA 批准，则在 EPA 批准之前仅可由州执行，而不可在联邦层面执行。\n\
  \n公众还可以根据《清洁空气法》提起公民诉讼，以解决 SIP 违规问题。\n\n## 4.18 合规\n\n### 4.18.1 合规要求\n\n一旦源获得空气质量许可证，保持遵守许可证中包含的所有许可条件就很重要。联邦\
  \ PSD 许可程序和 Title V 程序要求每个 PSD 许可证、Title V 许可证规定适用于许可源的法规。此外，PSD 许可证还规定了如何确定每项适用法规的合规性。确定合规性的方法和\
  \ EPA 合规保障监测计划在下面讨论。\n\n#### 4.18.1.1 确定合规性的方法\n\nPSD 许可证和 Title V 许可证申请必须确定适用于该设施和任何排放单元的要求以及如何确定对这些适用要求的合规性。证明合规性的要素包括合规监测、记录保存和报告。\n\
  \n#### 4.18.1.2 空气排放速率的直接测量\n\n直接测量的基础是 EPA 在 40 CFR 第 60 部分附录 A 中公布的一组程序（Title\
  \ 40 – 环境保护；Part 60 – 新固定源性能标准以及截至 1991 年 7 月 1 日修订的所有测试方法）。表 4.11 介绍了 EPA 用于直接测量固定源空气排放速率的方法以及在附录\
  \ A 中提出的程序组，包括气体污染物、特定金属和 VOC 的测量。这些方法包含执行程序的精确标准、QA/QC 步骤，并规定记录哪些数据。不严格按照程序执行会严重危及结果的完整性并危及其批准。收集烟囱样品进行分析的一般程序可在方法\
  \ 1–5 中找到，作为设置测试列车的指南。任何测试的完整性都取决于确保采样列车是一个密闭系统，且外部（清洁）空气泄漏最少，这会稀释废气样品中污染物的浓度。\n\
  \n**表 4.11** USEPA 用于直接测量空气排放的方法以及 EPA 在 40 CFR 第 60 部分附录 A 中公布的程序组。\n\n| 方法，固定源\
  \ | 程序和关注污染物 |\n| :--- | :--- |\n| 1 | 固定源的采样和速度遍历 |\n| 2 | 烟囱气体速度和体积流量测定（S 型皮托管）\
  \ |\n| 4 | 烟囱气体中水分含量的测定 |\n| 5 | 固定源 PM 排放的测定 |\n| 6 | 二氧化硫 |\n| 7 | 氮氧化物 |\n| 8\
  \ | 硫酸和二氧化硫 |\n| 9 |  opacity 监测 |\n| 10 | 一氧化碳 |\n| 11 | 石油炼油厂烟气流中的硫化氢含量 |\n| 12\
  \ | 铅 |\n| 13 | 氟化物 |\n| 15 | 硫化氢；硫化羰；二硫化碳 |\n| 16, 16A | 含硫还原化合物 |\n| 18, 24, 25\
  \ | VOCs |\n| 201, 202 | PM$_{10}$<sup>a</sup> |\n\n<sup>a</sup>直径为 $10 \\mu m$\
  \ 或更小的 PM。\n\n方法 1 包含采样口和遍历点的选择指南，以对废气进行可接受的代表性采样。关键问题是随时间均匀收集样品。它包含确定是否存在旋流或旋转流动的程序。方法\
  \ 2 包含测量废气速度和体积流量的程序。\n\n图 4.15 是典型采样列车的示意图（此特定设置用于测量 PM 排放）。方法 5 包含测量来自两个来源的 PM\
  \ 的指南：可过滤 PM 和冷凝 PM（后者在过滤器下游的冲击器中冷凝）。通常，两处测量的 PM 必须合并。针对特定情况的特定源类型（即木材加热器、沥青工业等）存在其他方法\
  \ 5 程序。方法 201 和 202 是应考虑用于冷凝超细 PM 的测试 (Cooper and Alley 2011; Karel 2017)。\n\n\n\
  \n\n\n**图 4.15** 测量 PM 排放的工艺流程。来源：改编自 USEPA (1991b)。\n\n## 例 4.14 排放标准符合性检查\n\n\
  作为一名咨询工程师，你受聘修改用于除去飞灰的现有控制装置。排放标准已更改为基于总颗粒数。确定该装置是否能满足 \\(10^{5.7}\\) particles/acf\
  \ 的排放标准。装置数据如下：\n\n- 平均颗粒尺寸，\\(d_p = 10\\ \\mu m\\)，假设恒定\n- 颗粒比重 = 2.3\n- 入口负荷，\\\
  (IL = 3.0\\ \\text{gr/ft}^3\\)\n- 效率（质量基准），\\(E = 99.5\\% = 0.995\\)\n\n### 解\n\n\
  出口负荷（OL）由下式给出\n\n\\[\nOL = (1.0 - E)(IL)\n    = (1.0 - 0.995)(3.0\\ \\text{gr/ft}^3)\n\
  \    = 0.015\\ \\text{gr/ft}^3\n\\]\n\n假设基准为 \\(1.0\\ \\text{ft}^3\\)。\n\n颗粒质量：\n\
  \n\\[\nM = \\rho_p V_p = \\rho_p \\frac{\\pi d_p^3}{6}\n\\]\n\n\\[\n= (7000\\ \\\
  text{gr/lb})\n\\left[\n\\frac{\\pi}{6}\n\\left(10\\ \\mu m \\times 0.328\\times10^{-5}\\\
  \ \\frac{\\text{ft}}{\\mu m}\\right)^3\n(2.3)(62.4\\ \\text{lb/ft}^3)\n\\right]\n\
  = 1.881\\times10^{-8}\\ \\text{gr/particle}\n\\]\n\n颗粒数：\n\n\\[\n\\frac{0.015\\\
  \ \\text{gr/ft}^3}{1.881\\times10^{-8}\\ \\text{gr/particle}}\n= 8.0\\times10^5\\\
  \ \\text{particles/ft}^3\n\\]\n\n允许的颗粒数/ft³：\n\n\\[\n10^{5.7} = 5.01\\times10^5\\\
  \ \\text{particles/ft}^3\n\\]\n\n由于\n\n\\[\n5.01\\times10^5\\ \\text{particles/ft}^3\
  \ < 8.0\\times10^5\\ \\text{particles/ft}^3\n\\]\n\n因此，该装置将无法满足颗粒物排放标准。\n\n## 例\
  \ 4.15\n\n正在从烟囱中抽取干气样。烟囱气体温度为 200 °C，压力为 730 mm Hg。气流通过加热过滤器、一组冷却冲击器、小型空气泵，然后通过流量计，如图\
  \ 4.15 所示。流量测定为 30.0 L/min，条件为 20 °C 和 790 mm Hg。\n\n1. 计算通过过滤器的实际体积流量（在 T = 200\
  \ °C 和 P = 730 mm Hg 时）。\n2. 如果在 30 分钟内在过滤器上收集到 1.32 mg 的固体颗粒，则计算烟囱气体中颗粒物的浓度（以 μg/m³\
  \ 计）。\n\n### 解\n\n1. \\[\nQ_{\\text{filter}} = (30.0)\\left(\\frac{790}{730}\\right)\\\
  left(\\frac{473}{293}\\right) = 52.41\\ \\text{L/min}\n\\]\n\n2. 在烟囱条件下采样气体的总体积：\n\
  \n\\[\n52.41\\ \\frac{\\text{L}}{\\text{min}} \\times \\frac{1\\ \\text{m}^3}{1000\\\
  \ \\text{L}} \\times 30\\ \\text{min} = 1.572\\ \\text{m}^3\n\\]\n\n\\[\nC_{\\text{particulate}}\
  \ = \\frac{1.32\\ \\text{mg}}{1.572\\ \\text{m}^3} \\times \\frac{10^3\\ \\mu g}{1\\\
  \ \\text{mg}}\n= 841\\ \\mu g/\\text{m}^3\n\\]\n\n## 例 4.16\n\n一座烟囱（T = 550 °F 和\
  \ P = 750 mm Hg）使用 EPA 方法 5 进行采样（见图 4.15）。通过干气表的总气体体积为 2.785 m³（在 T = 60 °F 和 P\
  \ = 800 mm Hg 时）。收集的 PM 质量为 1.50 g。此外，在冲击器中收集了 72.0 g 的 H₂O。\n\na) 计算烟囱中 PM 的浓度（μg/m³），条件为烟囱条件。\
  \  \nb) 烟囱气体以平均速度 20 m/s 排出，烟囱内径为 5 m。PM 的排放速率是多少 kg/day？  \nc) PM 浓度为 μg/dscm 时是多少？\n\
  \n已知：\n\n\\[\nT_{\\text{stack}} = 550^\\circ\\text{F} = 560.85\\ \\text{K} \\qquad\n\
  P_{\\text{stack}} = 750\\ \\text{mm Hg} = 0.987\\ \\text{atm}\n\\]\n\n\\[\nT_{\\\
  text{DG}} = 60^\\circ\\text{F} = 288.71\\ \\text{K} \\qquad\nP_{\\text{DG}} = 800\\\
  \ \\text{mm Hg} = 1.053\\ \\text{atm}\n\\]\n\n\\[\n\\text{Vol}_{\\text{DG}} = 2.785\\\
  \ \\text{m}^3 = 2785\\ \\text{L} \\qquad\nm_{\\text{PM}} = 1.50\\ \\text{g}\n\\\
  ]\n\n\\[\nm_{\\text{H}_2\\text{O}} = 72.0\\ \\text{g} \\qquad\nV_{\\text{exit}}\
  \ = 20\\ \\text{m/s}\n\\]\n\n\\[\nD_{\\text{stack}} = 5.0\\ \\text{m}\n\\]\n\n###\
  \ 解\n\n**部分 (a)**\n\n使用理想气体定律（式 3.5）计算干气摩尔数：\n\n\\[\nR = 0.08206\\ \\frac{\\text{atm}\\\
  cdot\\text{L}}{\\text{gmol}\\cdot\\text{K}}\n\\]\n\n\\[\nn_{\\text{DG}} = \\frac{P_{\\\
  text{DG}}\\text{Vol}_{\\text{DG}}}{RT_{\\text{DG}}}\n= \\frac{(1.053\\ \\text{atm})(2785\\\
  \ \\text{L})}{\n0.08206\\ \\frac{\\text{atm}\\cdot\\text{L}}{\\text{gmol}\\cdot\\\
  text{K}}(288.71\\ \\text{K})\n}\n= 123.8\\ \\text{gmol}\n\\]\n\n计算水的摩尔数：\n\n\\[\n\
  \\text{MW}_{\\text{H}_2\\text{O}} = 18\\ \\frac{\\text{g}}{\\text{gmol}}\n\\]\n\n\
  \\[\nn_{\\text{H}_2\\text{O}} = \\frac{m_{\\text{H}_2\\text{O}}}{\\text{MW}_{\\\
  text{H}_2\\text{O}}}\n= \\frac{72.0\\ \\text{g}}{18\\ \\frac{\\text{g}}{\\text{gmol}}}\n\
  = 4.0\\ \\text{gmol}\n\\]\n\n\\[\nV_{\\text{stack}} = \\frac{n_{\\text{DG}}RT_{\\\
  text{stack}}}{P_{\\text{stack}}}\n\\]\n\n\\[\n= \\frac{(123.8\\ \\text{gmol})\n\
  (0.08206\\ \\frac{\\text{atm}\\cdot\\text{L}}{\\text{gmol}\\cdot\\text{K}})\n(560.85\\\
  \ \\text{K})}{0.987\\ \\text{atm}}\n= 5770\\ \\text{L} = 5.77\\ \\text{m}^3\n\\\
  ]\n\n计算烟囱条件下 PM 的浓度：\n\n\\[\nC_{\\text{PM}} = \\frac{M_{\\text{PM}}}{V_{\\text{stack}}}\n\
  = \\frac{1.50\\ \\text{g}}{5.77\\ \\text{m}^3}\n\\left(\\frac{10^6\\ \\mu g}{1\\\
  \ \\text{g}}\\right)\n\\]\n\n\\[\nC_{\\text{PM}} = 2.6\\times10^5\\ \\mu g/\\text{m}^3\n\
  \\]\n\n**部分 (b)**\n\n计算流量然后 PM 的排放速率。\n\n\\[\nA_{\\text{stack}} = \\frac{\\pi(D_{\\\
  text{stack}})^2}{4}\n= \\frac{\\pi(5.0\\ \\text{m})^2}{4}\n= 19.63\\ \\text{m}^2\n\
  \\]\n\n\\[\nQ_{\\text{stack}} = A_{\\text{stack}}V_{\\text{exit}}\n= (19.63\\ \\\
  text{m}^2)\\left(20\\ \\frac{\\text{m}}{\\text{s}}\\right)\n= 392.6\\ \\frac{\\\
  text{m}^3}{\\text{s}}\n\\]\n\n\\[\n\\text{Rate}_{\\text{PM}} = Q_{\\text{stack}}C_{\\\
  text{PM}}\n\\]\n\n\\[\n= \\left(392.6\\ \\frac{\\text{m}^3}{\\text{s}}\\right)\n\
  \\left(2.6\\times10^5\\ \\frac{\\mu g}{\\text{m}^3}\\right)\n\\left(\\frac{1\\ \\\
  text{kg}}{10^9\\ \\mu g}\\right)\n\\left(\\frac{3600\\ \\text{s}}{1\\ \\text{h}}\\\
  right)\n\\left(\\frac{24\\ \\text{h}}{1\\ \\text{day}}\\right)\n\\]\n\n\\[\n\\text{Rate}_{\\\
  text{PM}} = 8820\\ \\frac{\\text{kg}}{\\text{day}}\n\\]\n\n**部分 (c)**\n\n使用式 (3.5)\
  \ 将体积调整至标准温度压力条件。\n\n\\[\nP_{\\text{standard}} = 1\\ \\text{atm}\n\\]\n\n\\[\nT_{\\\
  text{standard}} = 298.15\\ \\text{K}\n\\]\n\n\\[\n\\text{Vol}_{\\text{STP}} = \\\
  text{Vol}_{\\text{DG}}\n\\left(\\frac{P_{\\text{DG}}}{P_{\\text{standard}}}\\right)\n\
  \\left(\\frac{T_{\\text{standard}}}{T_{\\text{DG}}}\\right)\n\\]\n\n\\[\n= 2.785\\\
  \ \\text{m}^3\n\\left(\\frac{1.053\\ \\text{atm}}{1\\ \\text{atm}}\\right)\n\\left(\\\
  frac{298.15\\ \\text{K}}{288.71\\ \\text{K}}\\right)\n= 3.028\\ \\text{m}^3\n\\\
  ]\n\n计算 PM 浓度：\n\n\\[\nC_{\\text{PM}} = \\frac{m_{\\text{PM}}}{\\text{Vol}_{\\text{STP}}}\n\
  = \\left(\\frac{1.50\\ \\text{g}}{3.028\\ \\text{m}^3}\\right)\n\\left(\\frac{10^6\\\
  \ \\mu g}{1\\ \\text{g}}\\right)\n\\]\n\n\\[\nC_{\\text{PM}} = 4.95\\times10^5\\\
  \ \\mu g/\\text{m}^3\n\\]\n\n## 4.18.1.3 监测\n\n监测可以包括从连续排放监测（CEM）到记录收到的投诉等一切内容。监测可能相当昂贵。即使用于监测的设备并不昂贵，也必须满足监测频率要求，而进行监测需要占用人员资源，对于大型设施而言，这可能相当可观。\n\
  \n最近开发的一种最有前景的排放监测技术称为参数排放监测系统（PEMS）。PEMS 使用多变量计算机代码，将排放源上的参数监测器的数据与便携式租赁 CEM 系统的测量结果相关联。在初始安装期间，所有可用参数监测器的信息都提供给计算机。PEMS\
  \ 代码随后评估哪些参数是独立的并识别这些参数。长期监测随后仅限于独立参数。PEMS 代码随后将参数变化与排放变化相关联——在 PEMS 预测排放与 CEM 数据进行比较的测试之后，CEM\
  \ 系统被移除，PEMS 提供排放估计。由于燃料流量和温度等参数监测器通常比 CEM 监测器更可靠，因此 PEMS 的可用性通常高于 CEM 系统。运行成本也更低，因为不需要每日校准和其他\
  \ CEM 维护要求。\n\n## 4.18.1.4 不透明度监测\n\n几乎所有 Title V 许可证都必须解决不透明度合规问题。不透明度限制既存在于机构禁止性规则中，也存在于\
  \ NSPS 中，并存在于单个设备条件中。可以考虑以下几种不透明度测量水平：\n\n- 连续不透明度监测系统（COMS）\n- EPA 方法 9 不透明度监测\n\
  - EPA 方法 22 不透明度监测\n- 投诉报告和响应\n\na) **连续不透明度监测系统。** COMS 是安装在烟囱或排气口顶部的光学监测器，通过测量光束穿过烟囱气体的衰减来工作。它们提供连续的不透明度读数并以电子方式记录。尽管可靠，但它们需要定期清洁光学元件，以确保读数反映的是气体不透明度而不是外部污染。此外，它们通常无法区分\
  \ PM 和水蒸气。水蒸气引起的不透明度不被视为违规，因此该设备限制可能很重要。区分 PM 不透明度和水蒸气的一种技术是在烟囱中安装不透明度监测器于任何水分的冷凝温度以上的点。\n\
  \nb) **EPA 方法 9 不透明度监测。** EPA 方法 9 监测是由合格观察员或“烟雾阅读员”对点源排放进行目视监测。认证是由机构或商业学校提供的课程和考试，并且为了保持认证，人员必须每六个月重新认证一次。监测包括\
  \ 24 次每次 15 秒的观测，并将排放的不透明度与标准灰度进行比较。如果 24 次测量的平均不透明度超过标准，则视为违规。\n\n要将方法 9 用作合规证明，设施必须有合格的“烟雾阅读员”可用，并且必须在许可证条件规定的间隔内进行读数。通常会认证两名员工，以便在其中一名认证人员不可用时仍可进行读数。一家利用方法\
  \ 9 来证明不透明度合规的水泥窑在员工中拥有 18 名认证烟雾阅读员，以确保在窑 24 小时运行期间任何时间都可进行读数。尽管如此，认证读数只能在白天且无降水时进行（40\
  \ CFR 第 60 部分）。\n\n只有 COMS 和方法 9 观测才能用于量化不透明度以与指定标准进行比较。下面描述的额外方法属于定性方法。\n\n\n\n\
  \n\n- **c) EPA方法22不透明度监测。** EPA方法22也是一种目视观察方法，但不需要经过认证的烟尘读数员。方法22建议观察者熟悉方法9中的技术，但仅要求观察者在观察期间记录可见排放不透明度被观察到的时间百分比。观察期必须至少持续六分钟。可见不透明度必须持续适用法规规定的时间段，才能构成显著事件，并且要求对这些事件进行记录、响应和报告（40\
  \ CFR Part 60, USEPA 1992）。方法9的替代方法还可使用激光雷达（LIDAR 1980）。\n\n- **d) 投诉报告与响应。** 最简单的不透明度监测方法是承诺记录设施收到的任何不透明度投诉，并通过纠正措施回应这些投诉以消除观察到的可见不透明度。还必须保留所采取纠正措施的文件记录。投诉和纠正措施的记录随后作为定期报告的一部分提供给机构。\n\
  \n一种常用的不透明度检查方法是方法22与投诉记录和响应的结合。工厂经理或其他工作人员定期在工厂周围巡视，查看是否有可见排放。对于连续运营的工厂，一位工厂经理每天到达工厂时进行此检查。\n\
  \n## 4.18.1.5 记录保存\n\n记录保存必须用于提供已实施监测的文件证明。对于物料平衡合规演示，记录所使用物料及其组成是演示的核心。对于使用替代参数或活动数据结合排放因子来证明合规的方法，必须保留活动记录，例如燃料使用量或运行时间。\n\
  \n建设和Title V许可的标准条件之一是，许可机构工作人员或其代表有权在“任何合理时间”且无需事先通知的情况下进入设施场所，检查监测方法和证明合规的记录。\n\
  \n记录不一定是纸质副本。磁性或其他电子记录也可以接受，只要能够显示并接受审计。在某些情况下，机构要求数据可以从机构办公室以电子方式获取，以便随时核实合规情况。尽管这一要求不常见，但完全符合当前监测和数据传输系统的技术水平。\n\
  \n良好的记录保存纪律对于证明符合Title V许可至关重要。在记录日志中使用“同上”标记或复印记录页表明记录保存纪律不佳，通常也是记录错误的指标。电子记录保存的一个优点是重复记录可以复制，然后进行适当修改以更新输入内容。\n\
  \n由不熟悉操作的人员定期检查记录，可以快速发现只有设备操作员或记录人员才能理解的条目。记录（包括记录人员的签名或缩写）必须能让其他人理解。\n\n## 4.18.1.6\
  \ 报告\n\n对于Title V许可持有人，必须定期报告合规监测结果。Title V许可要求每六个月或每年报告一次。报告是公共记录，如果报告显示不合规，可能导致执法行动。\n\
  \n## 4.18.1.7 良好行为条款\n\n对于Title V许可中包含的任何合规监测，应考虑设置良好行为条款。此类条款已包含在NSPS中。它们规定：初始阶段应频繁进行定期监测；如果未监测到不合规，则降低监测频率。可包含几个降低等级，如果在降低频率后的任何监测中观察到不合规，监测将恢复到更频繁的间隔并重新开始该过程。这一良好行为条款激励设施保持合规，从而限制定期监测的费用。\n\
  \n## 4.19 CAA执法条款\n\n根据《清洁空气法》（CAA），EPA有多种执法选择，包括：\n\n- 发布行政罚款令\n- 发布要求合规或禁止的命令\n\
  - 向法院提起民事诉讼\n- 请求总检察长提起刑事诉讼\n\n以下分别讨论这些选项。个别州可能对违反州法规有类似规定，并且对于联邦法规授权州执行的条款，州的规定至少应与联邦法规同样严格。\n\
  \n### 根据《清洁空气法》可评估民事罚款\n\n- 现场传票：每天不超过5 000美元，最高不超过25 000美元\n- 民事罚款：每次违规每天最高25 000美元\n\
  - EPA可给予举报人最高10 000美元的奖励\n- 可评估追偿律师费和专家证人费\n\n### 4.19.1 行政罚款令\n\n对违反CAA任何条款（包括违反许可条件）的行为，可进行行政罚款评估。检查员可签发现场传票。这些传票罚款为每天5\
  \ 000美元，累计最高可达25 000美元。收到现场传票的个人可在合理时间内要求听证；他们将有机会提供证据进行辩护。\n\n民事罚款每次违规每天最高可评估25\
  \ 000美元。行政罚款类别还包括EPA可向举报违规的个人提供的最高10 000美元举报人奖励。收到行政罚款的个人可在30天内对评估提出上诉，或在额外的30天窗口期内向联邦地区法院对最终裁决提出上诉。EPA局长有权和解、修改或对罚款附加条件。\n\
  \n收到行政罚款的个人应及时联系监管机构，以澄清有关违规的任何疑问，说明从轻情节，表明已被指出的不合规行为已经纠正，并协商减少罚款。机构会考虑从轻情节，最终罚款通常很少保持原金额那么高。\n\
  \n### 4.19.2 发布要求合规或禁止的命令\n\n发布命令是对违规行为更正式、更严重的回应。它通常用于必须解决特定问题，且存在损害人类健康或对环境造成严重或不可逆转损害的可能性时。处理命令需要进行听证，之后可评估民事或刑事处罚。\n\
  \n### 4.19.3 向法院提起民事诉讼\n\n民事诉讼执法比上述行政行为更严重，且可能昂贵得多。法规中有规定，在民事诉讼期间可从被告处追偿律师费和专家证人费。根据1990年《清洁空气法修正案》（CAAA）第七章，公民诉讼可作为民事诉讼提起。此类诉讼可基于指出当前不合规情况的Title\
  \ V许可申请，即使申请中包含合规计划。但如果该不合规行为已被裁定，且合规计划是法院已批准的同意法令的一部分，则不能对当前不合规行为提起公民诉讼。\n\n###\
  \ 4.19.4 请求总检察长提起刑事诉讼\n\n联邦法律以及许多州法律中的规定都对组织和个人规定了刑事制裁。通常，刑事诉讼保留用于公然、故意的违法行为。包括：虚假陈述或不合规的监测或记录保存可判处2年监禁；过失危害可判处1年；明知可能导致死亡或严重人身伤害的行为可判处最高15年监禁并处罚款最高1\
  \ 000 000美元。\n\n### 《清洁空气法》还规定了包括监禁在内的刑事执法\n\n- 虚假陈述、不合规的监测和记录保存：两年\n- 过失危害：一年\n\
  - 明知危害，包括明知释放有害空气污染物（HAP）或极危险物质（EHS）导致迫在眉睫的危险：十五年\n- 明知违反SIP、NSPS、NESHAP、Title V或第114条要求：五年\n\
  - 个人罚款约250 000美元，组织罚款约500 000美元\n\n### 4.19.5 紧急情况作为抗辩理由\n\n如果发生本应被视为违规的污染物释放，可以辩称这是紧急情况。为此，紧急情况定义为：排放源控制范围之外的任何突发的、合理不可预见的事件，需要立即采取纠正措施以恢复正常运行，并导致超出基于技术的排放限值。\n\
  \n如果违规是由设备设计不当、缺乏预防性维护、粗心或操作不当或操作员错误引起的，则不被视为\n\n\n\n紧急情况。紧急情况可作为抗辩理由，前提是有经适当签署的操作日志或其他证据表明发生了紧急情况且原因可被识别，设施在当时正处于正常运行状态，且许可方已采取一切合理措施以将超标排放降至最低。\n\
  \n要使用此抗辩，必须在两个工作日内向许可机构提供通知，其中包含对紧急情况的描述以及为减轻排放和执行纠正措施所采取的步骤。如果将排放降至允许水平唯一的办法是停止或减少工厂活动，而未采取此措施，则不能使用紧急情况抗辩。也就是说，如果你不关停，你就承担责任。\n\
  \n与其它合规问题一样，良好的记录保存对于在使用紧急情况抗辩时免于被起诉至关重要。必须有记录表明工厂一直处于正常运行状态，并且已努力停止或减少超额排放。\n\n\
  ## 4.19.6 第114条：事实调查\n\nEPA有权在预期起诉前从来源处获取信息。如果某来源收到EPA援引第114条的信函，应将其视为至少与美国国税局审计一样严重。EPA可能会就排放以及公司环境管理结构提出问题或寻求信息。EPA可要求提供记录、监测、采样或合规认证。EPA在出示证件时有权进入存放记录的公司场所。\n\
  \n| 第114条是预期起诉的事实调查 |\n|------------------------------------------------------------|\n\
  | • EPA可要求提供记录、监测、采样或合规认证。 |\n| • 收到第114条信函相当于IRS审计。 |\n| • 可能会就排放以及环境管理组织方式提出问题。\
  \ |\n| • 对第114条的回复应及时、准确，且仅限于所问问题。 |\n\n通常，信函是由EPA获得的证据所引发，表明发生了超额排放。这可能包括作为EPCRA\
  \ 313表格R报告的一部分报告的环境释放、报纸报道，或收到州排放限值豁免通知。\n\n对第114条信函的回复应及时、准确，且仅限于所问问题。律师应参与准备或审阅回复，并在与机构工作人员的任何后续会议中参与。\n\
  \n## 4.19.7 检查协议\n\n检查是许可机构工作人员的标准活动，设施应预期会定期接受检查。一些非常大的设施，例如石油炼油厂，由监管机构指派全职检查员，且该人员每天都在设施内。其他设施的检查频率较低。对于任何设施，制定检查协议都是值得的。\n\
  \n检查协议应确定检查员到访时应由谁响应，适当的响应方式，以及检查员的权利以及公司的权利。\n\n机构工作人员或其授权代表有权进入设施。接待员或门卫应被告知在检查员出示证件并要求进入时应联系谁。环境部门的一名成员应迎接检查员，并在检查未被预期且为常规检查的情况下，将检查员带至会议室进行检查前会议。询问检查员想要查看什么内容是适当的。虽然公司不能阻止进入，但访问工厂某些区域通常需要安全措施，且根据工厂安全规则，通常需要规划此类访问。检查员应被要求使用员工和其他访客所需的所有安全设备，在某些情况下，在参观工厂前需要进行安全简报。\n\
  \n一旦要访问的区域或所需信息被确定，检查员应被迅速且直接护送至该区域。检查员在无人陪同下参观设施既可能构成安全隐患，也可能存在提供误导性信息的风险。在检查员要求停靠原始请求未涵盖的另一区域的情况下，在进行另一次初步访谈之前可以禁止此类停靠，因为该请求未在原始访谈中涵盖。\n\
  \n如果检查员使用录音机或任何测试仪器，公司也应记录相同信息并测试同一位置。在某些情况下，录制检查视频可能是适当的。\n\n检查结束时应举行离场会议。应询问检查员获得了哪些信息，并请求提供任何信息的副本。\n\
  \n大多数公司与定期访问其工厂的空气质量检查员建立了良好的工作关系，重要的是用于应对检查的程序不应具有敌意或不必要地阻碍。然而，检查员在与某设施工作一段时间后，常常会认为自己对设施运行的了解与工厂操作员一样。由于这种情况几乎从未发生，因此即使对于经验丰富的检查员，也需要陪同和操作说明。\n\
  \n## 4.19.8 连续排放监测\n\n替代一次性测量的做法是使用CEM（也称为CEM系统）对污染物进行连续测量。CEM具有与烟囱测试（第4.19.8节和第4.19.9节）许多相同的属性。探头插入烟囱，样品在进入分析仪进行浓度测定前进行适当处理。数据采集系统（DAS）计算、存储和整理数据。通常，CEM以固定间隔取样，结果可按需平均（Karell\
  \ 2017）。\n\n连续排放监测系统（CEMS）历史上曾被用作监测烟气中氧气、一氧化碳和二氧化碳的工具，以为工业环境中的燃烧控制提供信息（Stultz and\
  \ Kitto 2005）。目前，它们被用作遵守空气排放标准的一种手段，例如USEPA酸雨计划（CFR，标题40，第72部分，附录A 2011），或其他联邦排放计划，或州许可排放标准。\n\
  \n标准CEM系统由采样探头、过滤器、采样管线（脐带）、气体调节系统、校准气体系统以及一系列反映所监测参数的气体分析仪组成。典型的监测排放物包括：二氧化硫、氮氧化物、一氧化碳、二氧化碳、氯化氢、空气颗粒物、汞、挥发性有机化合物和氧气。CEM系统还可以测量气流、烟气不透明度和湿度。\n\
  \n在美国，EPA要求数据采集和处理系统收集和报告数据。SO₂排放必须以每小时磅为单位测量，使用SO₂污染物浓度监测仪和体积流量监测仪。对于NOₓ，需要NOₓ污染物浓度监测仪和稀释气体监测仪来确定排放速率（lb/MBtu）。不透明度也必须监测。NOₓ测量不是当前要求，但如果进行监测，应使用CO₂或氧气监测仪加流量监测仪。在监测这些排放时，系统必须连续运行，并且必须能够至少每15分钟采样、分析和记录数据，然后按小时平均（USEPA\
  \ 2009a）。\n\n### 4.19.8.1 运行\n\n通过泵经采样探头将少量烟气抽取到CEM系统。燃烧化石燃料的设施通常使用稀释抽取探头，将样品与清洁干燥空气按通常在50:1至200:1之间、通常为100:1的比例稀释。稀释的原因是纯烟气可能很热、很湿，并且对某些污染物而言具有粘性。稀释至适当比例后，样品通过采样管线（通常称为脐带）输送至歧管，各分析仪可从中抽取样品。气体分析仪采用各种技术来准确测量浓度。一些常用技术包括：红外和紫外吸收、化学发光、荧光、气相色谱、火焰离子化检测器、质谱仪和β射线吸收。分析后，气体从分析仪排出至所有分析仪的公共歧管，然后排至室外。DAS接收每个分析仪的信号输出以收集和记录排放数据（PNM\
  \ 2018）。\n\n在工业源和低排放率的公用事业源中使用的另一种采样提取方法通常称为“热干”抽取法或“直接”CEMS。样品不经稀释，而是沿加热的采样管线在高温下输送至样品调节单元。样品经过滤去除颗粒物，并通常用冷却器干燥以去除水分。调节后，样品进入采样歧管并使用上述相同方法进行测量。此方法的一个优点是能够测量样品中氧气的百分比，这在排放校正的法规计算中通常是必需的。由于稀释会将清洁干燥空气与样品混合，稀释系统无法测量氧气百分比（PNM\
  \ 2018）。\n\n## 4.19.9 空气排放速率的QA和QC\n\nEPA为确保CEM用于合规目的的准确性而规定了QA/QC程序。必须在法规要求指定的间隔内进行校准和零漂移评估，例如运行已知浓度的化合物样品并在同一时间运行CEM与另一台最近校准的CEM的“相对准确性”测试（相对准确性）。\n\
  \n直接测量涉及在工艺运行期间从排气或烟囱收集代表性气体样品，对气体样品进行预热以去除可能干扰测试的任何成分，并进行化学分析以测量感兴趣成分的浓度。同时测量排气流速可将浓度转换为\n\
  \n\n排放率（通常以磅/小时为单位）。每一步都伴随有质量保证（QA）和/或质量控制（QC）程序。\n\n系统的准确性通过多种方式得以验证。内部QA检查通过每日向采样探头引入已知浓度的气体来完成。EPA还允许使用连续排放监测校准系统，这些系统通过稀释气体来生成校准标准（USEPA\
  \ 1993）。分析仪的读数必须精确到一定百分比。百分比精度可能有所不同，但大多在2.5%至5%之间。在受酸雨计划影响的发电厂中，系统的年度（或两年一次）认证必须由独立公司执行。该公司将临时安装一套独立的CEM系统，与工厂的CEMS并行收集排放数据。这种测试被称为相对准确度测试审计（RATA）。\n\
  \n在美国，设备的定期评估必须记录并报告（USEPA 2009a）。这包括每日校准误差测试、流量监测仪的每日干扰测试，以及半年（或年度）RATA和偏差测试（USEPA\
  \ 2018a）。CEMS设备价格昂贵，并非所有设施都能负担得起。在这种情况下，设施可能会在排放点安装不符合EPA标准的分析设备。每年一次，为了设备评估，移动式CEMS公司会使用合规设备测量排放。然后将结果与不合规的分析仪系统进行比较（Nova\
  \ Gas 2018）。\n\n## 4.19.10 执行烟囱测试\n\n执行烟囱测试可能非常复杂。许多事情可能出错或导致结果误差。因此，几乎所有的机构都要求排放报告为至少三次成功运行的平均值，每次运行包括足够的样品收集（例如通过等速采样）和成功的泄漏测试。每次运行通常持续一小时。然而，对于浓度较低的污染物（例如痕量金属），需要更长的采样时间以收集足够的样品进行测量。\n\
  \n由于测试方法的复杂性，大多数监管机构要求制定一份正式的书面协议，并在测试开始前获得批准。这些协议通常由测试公司编写，应列出测试方法，详细描述方法和采样设备，并提供必要的计算，例如遍历点的数量和位置。\n\
  \n协议获得批准后，设施和测试公司应与监管机构确定一个双方都同意的日期。将测试与工厂运营协调至关重要，以确保相关设备在烟囱测试期间按预期运行，并且任何偏离标准操作条件的情况都会被记录。\n\
  \n现场工作完成后，必须向监管机构提交一份烟囱测试报告，该报告总结方法学，呈现结果，并包含原始数据。结果通常以基于实测排气流量的浓度或质量排放率形式提供。通常定义一个下限，低于该限值时污染物无法被测量（Karell\
  \ 2017; USEPA 2009b）。\n\n## 示例4.17 标准体积的计算\n\n大多数大气采样技术使用采样系统，含有目标污染物的空气进入系统并穿过样品收集装置。收集到的污染物重量与通过排气和系统抽取的空气体积进行比较，从而计算出污染物的浓度。浓度通常表示为校正到EPA标准条件下的浓度，即298\
  \ K（25°C）和760 mmHg（1 atm）。\n\n用于将样品体积（V_s）校正为EPA标准体积（V_std）的方程基于查尔斯定律。\n\n```\n\
  V_STD = V_s (P_atm / P_std) (T_std / T_atm) (4.18)\n```\n\n其中\nV_std = 气体的校正体积；V_s\
  \ = 气体的采样体积\nT_std = EPA标准温度；T_atm = 样品标准温度\nP_std = EPA标准压力；P_atm = 样品标准压力\n\n\
  如果从平均温度为80°F、压力为14.3 psia的排气空气中采样了10 ft³的空气，请确定校正后的样品体积。\n\n### 解决方案\n\n将环境温度和压力转换为适当的单位。\n\
  T(K) = (F - 32)/1.8 + 273 = (80 - 32)/1.8 + 273 = 300 K\nP(atm) = P_s (1atm / 14.7\
  \ psi) = 14.3 psi (1atm / 14.7) = 0.97 atm\n\n使用公式(4.15)计算校正后的体积。\n\n```\nV_std\
  \ = V_s (P_atm / P_std) (T_std / T_atm) = 10 ft³ (0.97 atm / 1 atm) (273 K / 300\
  \ K) = 8.83 ft³\n```\n\n## 示例4.18 烟囱流速\n\n某设施的废气流量为$1500 \\mathrm{scfm}$。所有气体通过一个小烟囱排出，烟囱入口面积为$2.3\
  \ \\mathrm{ft}^2$。废气温度为$350^\\circ\\mathrm{F}$。气体通过烟囱入口的速度是多少（$\\mathrm{ft} / \\\
  mathrm{s}$）？假设标准条件为$70^\\circ\\mathrm{F}$和1 atm。忽略烟囱内的压降。\n\n### 解决方案\n\n首先注意，温度必须转换为绝对温标。因此，\n\
  \n```\n$$\\begin{aligned} & T_x=350+460=810^\\circ\\mathrm{R} \\\\ & T_s=70+460=530^\\\
  circ\\mathrm{R} \\end{aligned}$$\n```\n\n且\n\n```\n$$\\begin{aligned} Q_a &= Q\\\
  left(\\frac{T_x}{T_s}\\right) \\\\ &=1500\\left(\\frac{810}{530}\\right)=2292 \\\
  mathrm{acfm} \\end{aligned}$$\n```\n\n现在可以计算平均速度：\n\n```\n$$\\begin{aligned} V &=\
  \ \\frac{Q_a}{A} \\\\ &= \\frac{2292 \\mathrm{acfm}}{\\left(2.3 \\mathrm{ft}^2\\\
  right)\\left(60 \\mathrm{seconds}\\right)}=16.61 \\mathrm{ft} / \\mathrm{s} \\end{aligned}$$\n\
  ```\n\n## 4.20 工业固体废物及其管理\n\n处理。要看到再利用、回收和堆肥固体废物的价值，只需考虑容纳这些材料所需的处理空间。\n\n通过实施环境友好的废物管理策略（以及资源管理策略），一个群体可以减少对焚烧炉和填埋场的依赖。当回收材料替代原生塑料、金属矿石、矿物、玻璃和木材时，扩大化工、采矿和林业的压力就会减小。向工业供应回收材料比从矿山和森林中提取原生资源更为可取，这不仅因为它保护了稀缺的自然资源，还因为它减少了危险的空气和水污染物，如温室气体排放，并节省了能源。\n\
  \n节约能源是回收利用的重要环境效益之一，因为产生能源通常需要消耗化石燃料，并导致污染空气和水的排放。用回收材料制造纸张、塑料、玻璃和金属所需的能源通常少于用原生材料生产所需的能源。此外，回收材料的收集、加工和运输通常比原生材料在工业使用前必须经历的提取、精炼、运输和加工步骤消耗更少的能源。\n\
  \n众所周知，工业过程和运输中使用的大量能源来自化石燃料的燃烧。回收利用通过减少工业使用的能源量，从而减少温室气体排放，有助于遏制全球气候变化的危险。\n\n\
  ### 4.20.1 固体废物处理：关于回收利用的一些观点\n\n2010年，美国人产生了约2.5亿吨城市固体废物（MSW）（回收前），比2000年增长约8%，比1990年增长17%，比1980年增长36%（USEPA\
  \ 2002a, 2014）。因此，MSW的管理仍然是21世纪美国和其他高度工业化国家面临的重要挑战。固体废物管理在发展中国家也至关重要，在这些地方，古老的“零浪费”传统常常被遵循，而很少考虑零排放概念的意义和影响。\n\
  \n### 4.20.2 为什么要回收？\n\n每吨从处置中转移出来的固体废物，无论是再利用、回收、在废物转化为能源计划中转换，还是堆肥，都意味着需要处理的固体废物减少一吨。\n\
  \n### 4.20.3 什么是回收利用\n\n回收利用是一种工业过程，利用机械、化学和/或生物方法将废弃产品中的材料重新利用或转化为可再次使用的回收物、原料或能源。回收利用不仅仅是一种废物管理策略；它也是减少工业生产环境影响的重要策略。\n\
  \n回收利用的目标是闭合材料在制造、营销、消费和处置各阶段流动的循环。在闭环回收中，一组指定的操作在连续的每个循环中重复，操作根据所回收废料的类型而变化。因此，回收利用不同于再利用，再利用是指在性能没有任何变化的情况下，对在使用寿命结束时被回收的废弃产品进行进一步使用。\n\
  \n\n\n\n废弃物回收主要有三种方式：\n\n1. *机械回收*，可分为 *初级回收*，即在厂内对清洁的单一等级生产边角料进行加工，制成与原产品质量相当的产品，以及\
  \ *次级（消费后）回收*，即对来自各种来源的丢弃废物进行再加工，制成质量较差（针对塑料和纸张）或与原产品质量相当（针对铝、玻璃和金属）的再生产品。\n2. *三级或化学或原料回收工艺*，例如堆肥可降解废物，将混合塑料转化为液体或气体形式的单体或低分子量低聚物，以及将混合塑料碎片用作炼钢的还原剂。\n\
  3. *四级回收工艺*，例如带能量回收的废物焚烧，其中可燃市政或农业废物的部分能量含量被回收并加以利用，例如产生蒸汽（Brophy et al. 1997; Frisch\
  \ et al. 1999; Mader 1997; Van Beukering 1999; Walker 1995）。\n\n由于回收是一种工业过程，其成功程度高度取决于经济、技术、社会和政治因素，而这些因素在不同国家之间差异很大（Bell\
  \ 1998; Haque 1998）。然而，废物的机械回收历史悠久，在发达国家和发展中国家都很流行（Gandy 1994; Haque 1998; Shah\
  \ 2000）。\n\n## 4.20.4 美国和英国回收概况简述\n\n对丢弃产品的初级回收，特别是塑料废料的回收，其历史几乎与从原生材料工业化生产产品的历史一样久远（Saba\
  \ and Pearson 1995）。事实上，纽约市和伦敦的废物管理体系会例行收集来自街道清洁企业、商业场所、垃圾场和垃圾转运站的可重复使用物品（主要是纸张、布料、玻璃瓶和金属）进行次级回收。美国第一座垃圾分拣厂于1898年在纽约开业，20世纪20年代初，伦敦拥有了一座配备长传送带的示范分拣厂，可从中取出可回收材料（Gandy\
  \ 1994）。\n\n第二次世界大战后，超越废物经济价值进行思考的规划者意识到，回收可以减少废物流的体积，而将不可燃的玻璃和金属分离可以提高焚烧厂的运行效率。\n\
  \n在今天的美国，大多数地区回收约20–30%的垃圾，接近、达到或超过数十年前设定的全国回收目标。在英国，商业和工业产生的废物比生活垃圾更容易回收，这种差异反映了前者废物纯度更高的水平。该国回收工业废物25%，生活废物5%（Haque\
  \ 1998）。中央政府已设定修订后的目标，即到2010年实现市政废物45%的回收利用，其中包括30%的回收和堆肥（DETR 1999）。\n\n两国废物收集和分离方案包括为家庭提供户外回收容器、使用战略性布置的瓶罐回收箱，以及在中央物料回收设施进行分拣。罐装、纸制品、玻璃、铅酸电池、汽车和纺织品已有成熟的回收渠道。相比之下，丢弃的塑料产品和包装——废物流中日益增加的组成部分——在回收方面存在诸多问题。识别、分离和回收不同类型塑料所带来的技术困难和高成本，再加上再生料缺乏市场，进一步加剧了问题。\n\
  \n## 4.20.5 当今的回收\n\n在美国和英国，今天推动回收的压力主要来自环境关切以及旨在降低原材料和生产成本的工业政策，即最小化能源和材料消耗。进一步支持回收活动的是对填埋和焚烧——固体废物常规处置方式——所带来的环境污染的担忧。\n\
  \n因此，在许多发达国家，消费后废物的回收正通过新立法以及自20世纪70年代以来实施的经济激励措施而得到积极鼓励。德国要求零售商回收其包装的法律导致了大量可回收材料的供应。事实上，该倡议的成功造成了盈余，压低了欧洲回收材料的价格，从而阻碍了其他地方的回收工作。德国的经验或许曾被美国环保署前任局长预见，他称回收“是一个好主意，但已经走得太远”（Bickerstaffe\
  \ 1997）。\n\n与发达国家不同，人均废物产生量在工业化程度较低的国家要少得多，但某些材料的回收率却接近100%。回收于20世纪20年代引入发展中国家，但直到20世纪50年代末才大规模开展（Nahar\
  \ 1990; Ratra 1994）。从一开始，这些废物回收系统就由经济 necessity 驱动，因为穷人通过拾荒废弃的玻璃、塑料、纸张、金属和其他材料谋生，然后通过非正式系统将其出售，供在设施各异的场所进行回收。\n\
  \n## 4.20.6 回收作为可持续生产力和增长的途径\n\n尽管大规模的回收计划和污染预防工作正在进行中，但正如一开始所指出的，需要处置的废物数量仍在增加。我们以远快于自然补充的速度使用自然资源。在我们使用从地球提取的资源后，我们将其丢弃，往往以更有害的形式丢弃到我们依赖的环境中，以提供呼吸的空气、饮用的水和种植食物的土壤。对这种做法的担忧一再被提出，并且众所周知。\n\
  \n与废物相关且同样令人担忧的是社区安全问题，其影响更为广泛。公众越来越意识到有多少吨危险和非危险材料通过公路、铁路和海上运输。鉴于事故风险，尤其是涉及危险废物时，运输物质的体积持续增长，担忧与日俱增。\n\
  \n可持续生产和增长的计划旨在引领通向一个未来，即社会需求所需材料和有毒物质很少，材料被重复使用或回收，而不是被焚烧、掩埋或倾倒。这种转变将随着我们重新设计工艺、消费者和企业行为、重复使用更多材料以及改进技术而发生。各层级的工业、企业和政府需要利用成功的项目并投资于基础设施和活动以实现这些目标。\n\
  \n有趣的是，回收的经济性与回收者的经济发展水平成反比，更一般地说，回收倾向也与他们的社会经济地位成反比。在发达国家，塑料废物再加工设施在已知条件下运行，生产出已知质量的产品。然而，在发展中国家，塑料废物通常在未记录的条件下被多次回收，并暴露于外来污染物的累积影响之下。这种不受控制的重复加工对材料质量的有害影响不难想象。因此，据建议，塑料可行的最大回收次数上限会因不同国家的社会经济条件而异。\n\
  \n## 4.20.7 资源保护和回收法\n\n《资源保护和回收法》（RCRA）于1976年颁布，是美国规范固体废物和危险废物处置的主要联邦法律（RCRA 1976）。\n\
  \n### 4.20.7.1 历史和目标\n\n国会颁布RCRA是为了应对国家面临的不断增长的市政和工业废物问题。RCRA修订了1965年的《固体废物处置法》。它设定了国家目标\n\
  \n- 保护人类健康和自然环境免受废物处置潜在危害\n- 节约能源和自然资源\n- 通过源头减量和回收减少废物产生量\n- 以环境友好方式管理废物（USEPA\
  \ 2010b）\n\n它现在最广为人知的是根据RCRA颁布的法规，设定了美国危险废物处理、贮存和处置（TSD）的标准。\n\n### 4.20.7.2 RCRA实施\n\
  \n美国环保署已发布废物管理法规，其编入《联邦法规汇编》第40篇第239至282部分（USEPA 2011a）。有关危险废物管理的法规从第260部分开始（USEPA\
  \ 2011b）。如以下所述，大多数州已颁布至少与联邦法规一样严格的法律并制定了法规。此外，RCRA法案授权各州通过其自己的危险废物计划（以及州法律）执行联邦法律的许多职能，前提是这些计划已获得环保署批准。\n\
  \n### 4.20.7.3 危险废物的识别和表征\n\n要将一种材料归类为危险废物，它首先必须被视为废物，并且至少满足以下其中一项标准：\n\n1) 它表现出危险废物的任何特性。\n\
  2) 它已被命名为危险废物并在环保署法规中列出（表 C.2）。\n3) 它是含有列出的危险废物和非危险固体废物的混合物。\n4) 它是含有列出的或具有特征的危险废物和特殊核材料的混合物。\n\
  5) 它是从列出的危险废物的TSD中产生的废物残留物（即“源自”废物）。\n\n\n\n\n\n## 4.20.7.4 特征\n\n特征性废物是指表现出可测量的特性，表明该废物构成的威胁足以作为危险废物进行管制的废物。美国环保署（USEPA）决定，危险废物的特征应可通过使用标准化测试方法或应用对废物特性的一般知识来检测。根据这些标准，EPA\
  \ 确定了四种危险废物特征：易燃性、腐蚀性、反应性和毒性。\n\n1) 易燃性 – 易燃废物易于燃烧或可燃，在运输、储存或处置过程中可能引发火灾。示例包括油漆废物、某些脱脂剂或其他溶剂。描述易燃性特征的法规见\
  \ 40 CFR 261.21。具有以下任何特性的废物被视为由废物代码 D001 识别的危险废物：\n\n- 除水溶液外的液体，含酒精量小于 24%，且闪点低于\
  \ 60°C（140°F）。\n- 在正常条件下能够自发且持续燃烧的非液体。\n- 根据美国交通部法规定义的易燃压缩气体。\n- 根据美国交通部法规定义的氧化剂。\n\
  \n2) 腐蚀性 – 腐蚀性废物可能与其它废物危险反应，溶解金属或其他材料，或灼伤皮肤。示例包括废锈蚀清除剂、废酸或碱性清洁液以及废电池酸。描述腐蚀性特征的法规见\
  \ 40 CFR 261.22。具有以下任一特性的废物被视为由废物代码 D002 识别的危险废物。\n\n- pH 值小于或等于 2 或大于或等于 12.5 的水性物质。\n\
  - 在 55°C（130°F）温度下腐蚀钢的速率大于 0.25 in./year 的液体。\n\n3) 反应性 – 反应性废物不稳定，在与水或其他物质接触时会发生快速或剧烈的化学反应。示例包括氰化物电镀废物、废漂白剂和其他废氧化剂。反应性特征在\
  \ 40 CFR 261.23 的法规中有所描述。具有以下任何特性的废物被视为由废物代码 D003 识别的危险废物。\n\n- 通常不稳定且剧烈反应而不发生爆炸。\n\
  - 与水剧烈反应（即引起突然闪火伴随飞溅）。\n- 与水形成爆炸性混合物（即引起爆炸），可能损坏容器及其附近的任何物体或人员。\n- 与水混合时产生有毒气体、蒸气或烟雾，而不一定伴随剧烈反应或爆炸。\n\
  - 含有氰化物或硫化物，并在 pH 值在 2 至 12.5 之间时产生有毒气体、蒸气或烟雾。\n\n4) 毒性 – 由于废物中含有超过规定监管水平的毒性成分，毒性废物被视为危险废物。为了确定废物是否显示毒性特征，会进行测试方法（即毒性特征浸出程序或\
  \ TCLP）。描述毒性特征的 TCLP 法规见 40 CFR 261.24。\n\n5) 其他特征 – 可能具有传染性的医疗废物包括使用过的绷带和皮下注射针头、人体组织和血液，以及医院和研究机构产生的生物物质。由于其具有传染性，该废物根据特定的\
  \ EPA 指南进行处理和处置。\n\n## 4.20.7.5 列出的危险废物\n\n列出的危险废物由特定行业和工艺产生，仅根据产生它们的工艺就自动被视为危险废物，而不论废物测试是否显示出危险废物的“特征”。列出废物的示例包括\n\
  \n- 电镀工艺留下的许多污泥\n- 铁钢制造的某些废物\n- 某些清洁和/或脱脂工艺的废物\n\n危险废物被纳入 USEPA 公布的清单中。这些清单分为三个类别：\n\
  \n1) F 清单（非特定来源废物）。该清单确定了来自常见制造和工业工艺的废物，例如用于清洁或脱脂作业的溶剂。由于产生这些废物的工艺可在不同行业部门中发生，F\
  \ 清单废物被称为来自非特定来源的废物（见 40 CFR 261.31）。\n\n2) K 清单（来源特定废物）。该清单包括来自特定行业的某些废物，例如石油精炼或农药制造。这些行业处理和生产工艺中的某些污泥和废水是来源特定废物的示例（见\
  \ 40 CFR 261.32）。\n\n3) 丢弃废物：P 清单和 U 清单废物实际上是同一主要丢弃废物清单的子清单。这些废物适用于当被丢弃时被视为危险的商业化学产品，并受以下美国联邦法规管制：40\
  \ C.F.R. 261.33 (e) 和 (f)。P 清单废物在被丢弃时被视为“急性危险”，并受更严格的管制。硝酸是 P 清单废物的示例，编号为 P076。U\
  \ 清单废物在被丢弃时被视为“危险”，其管制程度略低于 P 清单废物。丙酮是 U 清单废物的示例，编号为 U002。\n\n## 4.20.8 RCRA 的若干规定：从摇篮到坟墓要求\n\
  \nEPA 的从摇篮到坟墓危险废物管理体系旨在追踪危险废物从其产生点（“摇篮”）到其最终处置点（“坟墓”）的整个过程（图 4.16）。可以说，RCRA 法案中最值得注意的规定包含在\
  \ C 标题中，该标题指示 EPA 对危险废物从产生点开始，经运输和 TSD 的整个管理过程建立控制。由于 RCRA 要求对危险废物产生者（即产生危险废物的场所）、运输者以及处理、储存和处置设施（TSDF）（即最终处理/处置或回收危险废物的设施）进行控制，整体监管框架被称为“从摇篮到坟墓”体系。该计划对处理危险废物的产生者、运输者和\
  \ TSDF 运营商施加了严格的记录保存和报告要求。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_197_0.png)\n\
  \n统一危险废物清单（*清单*）是从摇篮到坟墓废物管理的关键（第 D.6 节）。通过使用清单，产生者可以追踪危险废物从产生点到最终 TSD 点的移动。\n\n\
  ## 4.20.8.1 非危险固体废物\n\n非危险固体废物包括被免除 C 标题法规的某些危险废物，例如来自家庭和有条件豁免少量产生者的危险废物。石油和天然气勘探与生产废物，如钻屑、产出水和钻井液，被归类为“特殊废物”，也免于\
  \ C 标题（USEPA 2002b）。C 标题还包括垃圾（例如食品容器、咖啡渣）、未回收的家用电器、焚烧汽车轮胎的残渣、金属废料、建筑材料等废物，以及工业和市政废水处理设施和饮用水处理厂的污泥。\n\
  \n## 4.20.8.2 地下储罐\n\n### 背景\n地下储罐（UST）的运行在 1984 年《危险废物和固体废物修正案》颁布后成为 RCRA 监管计划的管制对象。当时约有\
  \ 210 万个储罐受联邦监管，EPA 计划导致大多数不合格储罐关闭和移除。截至 2019 年 3 月 31 日，约有 548 700 个活跃 UST 分布在\
  \ 198 000 个场所受联邦监管（USEPA 2019a）。新法规包括若干排除项：\n\n- 危险废物 UST 系统\n- 受管制的废水处理设施\n- 容量小于\
  \ 41.5l 的任何 UST 系统\n- 含有 *de minimis*（可忽略）浓度受管制物质的任何 UST 系统\n- 使用后迅速排空的任何应急溢出或溢流\
  \ containment 系统\n\n## 4.20.8.3 危险废物的运输\n\n本节涵盖运输危险废物的重要方面。这应使读者熟悉所涉及的风险和挑战的复杂性。1975\
  \ 年，美国国会通过了《危险材料运输法》。该法的意图是通过赋予交通部长广泛的权力来监管危险材料运输的各个方面，从而改善监管和执法活动。运输方式包括飞机、水运、机动车和铁路。\n\
  \n\n\n\n\n**表 4.12** 运输和包装危险品的分类。\n\n| 危险 | 类别 | 分区 |\n|---|---|---:|\n| 禁止运输材料\
  \ | — | — |\n| 禁止爆炸物 | — | — |\n| 爆炸物（具有质量爆炸危险） | 1 | 1.1 |\n| 爆炸物（具有质量抛射危险） | 1\
  \ | 1.2 |\n| 爆炸物（主要具有火灾危险） | 1 | 1.3 |\n| 爆炸物（无显著爆破危险） | 1 | 1.4 |\n| 极强感度炸药、炸药\
  \ | 1 | 1.5 |\n| 极不敏感的起爆物质 | 1 | 1.6 |\n| 易燃气体 | 2 | 2.1 |\n| 不可燃压缩气体 | 2 | 2.2\
  \ |\n| 有毒气体 | 2 | 2.3 |\n| 易燃和可燃液体 | 3 | — |\n| 易燃固体 | 4 | 4.1 |\n| 自燃材料 | 4 | 4.2\
  \ |\n| 遇湿危险材料 | 4 | 4.3 |\n| 氧化剂 | 5 | 5.1 |\n| 有机过氧化物 | 5 | 5.2 |\n| 有毒材料 | 6 |\
  \ 6.1 |\n| 传染性物质（病原体） | 6 | 6.2 |\n| 放射性物质 | 7 | — |\n| 腐蚀性物质 | 8 | — |\n| 其他危险材料\
  \ | 9 | — |\n| 其他受管制材料 | — | — |\n\n*来源：40 CFR 173.*\n\n美国联邦航空管理局执行有关航空运输的法规。美国海岸警卫队执行有关水路运输的法规。同样，美国联邦公路管理局执行有关危险废物通过公路和铁路运输的法规。\n\
  \n表 4.12 列出了受联邦运输法规管制的危险品的分类。其目的是规范在运输过程中若意外释放可能对公众和承运人员造成伤害的材料。49 CFR 172.101 中的危险品表进一步定义了特定危险化学品的标签、包装和承运人要求（见第\
  \ 4.5.13 节）。\n\n## 4.20.9 TSDFs 许可\n\nTSDFs 根据 RCRA 第 C 子标题管理危险废物，通常必须获得许可才能运营。虽然大多数设施拥有\
  \ RCRA 许可证，但一些设施仍在所谓的“临时状态”下运营。临时状态要求见 40 CFR 第 265 部分（USEPA 2012）。TSDFs 的许可要求见\
  \ 40 CFR 第 264 和 270 部分。TSDFs 在可能包括容器储存区、储罐、地表蓄水池、废物堆、土地处理单元、填埋场、焚化炉、 containment\
  \ 建筑物和/或滴液垫的单元中管理（处理、储存或处置）危险废物。单元特定的许可和运营要求在 40 CFR 第 264 部分第 J 至 DD 分部中进一步详细描述（USEPA\
  \ 1999）。\n\n### 4.20.9.1 回收\n\n一些危险废物可以回收再制成新产品。示例可能包括铅酸电池或电子电路板。当这些类型的灰烬中的重金属经过适当处理时，它们可以与其它污染物结合并将其转化为更易于处置的固体，或者可作为路面填充物使用。此类处理降低了有害化学品如飞灰和底灰的威胁水平，同时也回收了安全产品。\n\
  \n### 4.20.9.2 波特兰水泥\n\n另一种常用的处理方法是水泥基固化和稳定化（Chaudhary and Rachana 2006）。水泥被使用是因为它可以通过改善物理特性并降低污染物的毒性和传播来处理多种危险废物。所生产的水泥根据其强度和成分分为五个不同的等级。将污泥转化为水泥的过程可能包括添加\
  \ pH 调节剂、磷酸盐或硫试剂，以减少沉降或固化时间，增加抗压强度，或降低污染物的浸出能力。\n\n### 4.20.9.3 焚烧、销毁和废物能源化\n\n\
  焚烧的三大要素——温度、时间和湍流的重要性已得到多年的认可。最近关于三大要素的一般指南包括更高的温度（1200–2000°F）和更长的停留时间（0.2–2.0\
  \ 秒），以促进 HAPs 的更完全破坏。危险废物可能被“销毁”。例如，通过高温焚烧，可燃废物有时可作为能源来源燃烧。例如，许多水泥窑焚烧危险废物如废油或溶剂。如今，焚烧处理不仅减少了危险废物的数量，还从过程中释放的气体中产生能量。众所周知，这种特定的废物处理会释放由副产品或其他材料燃烧产生的有毒气体，可能影响环境。然而，目前的技术已开发出更高效的焚烧装置，可将这些排放控制到一定程度，使这种处理被认为是一种更有益的选择（例如废物能源化\
  \ – 见第 7.13.5 节和附录 G）。\n\n### 示例 4.19 汞废物\n\n一台焚化炉焚烧含汞医疗废物。废物材料的灰分含量为 1%。固体废物进料速率为\
  \ 1000 lb/h，气体流量为 20000 dscf。据报道，当蒸气浓度为 0.3 mg/dscm（干标准立方米）时，颗粒物中汞的平均含量为 2.42 µg/g。对于焚化炉排放物满足颗粒物标准\
  \ 0.08 gr/dscf（0.1832 g/dscm）且使用 99.5% 高效静电除尘器（ESP）的情况下，计算\n\n- 1) 被 ESP 捕获的与飞灰结合的汞量，单位为克/天\n\
  - 2) 以蒸气形式和随飞灰离开烟囱的汞量，单位为克/天。\n\n### 解答\n\n离开烟囱的灰量为：\n\n```\n(0.08 gr/dscf)(1 lb/7000\
  \ gr)(20000 dscf/min)(60 min/h)(24 h/day) = 329 lb ash/d\n```\n\n使用 99.5% 高效 ESP\
  \ 在 ESP 中收集的灰量为\n\n```\n= (329 lb/day)/(1.0 - 0.995 collected) = 65800 lb/day\n\
  ```\n\n随飞灰离开烟囱的汞量为\n\n```\n= (329 lb ash/day)(2.42×10⁻⁶ g Hg/g ash) = 7.96×10⁻⁴\
  \ lb Hg/day × 454 g/lb = 0.361 g Hg/day\n```\n\n以蒸气形式离开烟囱的汞量为\n\n```\n= (3×10⁻⁴\
  \ g Hg/dscm)(20000 dscf/min)(1 m³/35.31 ft³)(60 min/h)(24 h/day) = 244.689 g/day\n\
  ```\n\n因此，离开烟囱的总汞量 = 244.689 + 0.361 = 245 g/day。\n\n### 4.20.9.4 热解\n\n一些危险废物类型可在超高温电弧中惰性条件下进行热解以避免燃烧而被消除。这种处理方法在某些情况下可能优于高温焚烧，例如在破坏浓缩有机废物类型时，包括\
  \ PCBs、POHCs、农药和其他持久性有机污染物。\n\nUSEPA 对危险废物焚烧（HWI）设施的法规要求主要有机危险成分（例如 PCBs、POHCs）的破坏和去除效率（DRE）至少为\
  \ 99.99%。在这些情况下，EPA 几乎总是要求最终运营许可证具有高温（1800°F 或更高）和在二燃室中至少 2.0 秒的停留时间。医院（生物医学）废物焚烧炉通常利用\
  \ HWI 类型的设施。\n\nDRE 是根据引入焚烧炉的废物的质量平衡为每个指定的 POHC 确定的：\n\n```\nDRE = (W_in - W_out)/W_in\
  \ × 100% (4.19)\n```\n\n其中\n\nDRE = 破坏和去除效率（百分比）\nW_in = 送入焚烧炉的 POHC 的质量进料速率（lb/h\
  \ 或 kg/h）\nW_out = POHC 排放到大气中的质量排放速率（lb/h 或 kg/h）\n\n### 示例 4.20\n\n在一次试验焚烧中，焚烧炉以\
  \ 5000 lb/h 的废物进料速率和烟气中 7% O₂ 干体积运行。烟囱中测得的气体流量为 19200 dscfm。在这些条件下，主要有机危险成分的测量浓度为\n\
  \n- 三氯乙烯（1）= 4.9 µg/dscf\n- 1,1,1-三氯乙烷（2）= 1.0 µg/dscf\n- 二氯甲烷（3）= 49 µg/dscf\n\
  - 四氯乙烯（4）= 490 µg/dscf\n\n这里列出的每种危险成分约占总废物进料速率的 5%。计算 POHCs 的 DRE。该装置是否符合法规？\n\n\
  ### 解答\n\n每种危险成分占总废物进料的 5%，因此，\n\n```\nW_in = (0.05)(总进料速率) = (0.05)(5000 lb/h)\
  \ = 250 lb/h\n```\n\n烟囱中每种危险成分的质量流量由\n\n\n\n(W_out)_i = q_s C_i / 7.57×10^6\n其中\n\
  q_s = 体积气体流量 (dscfm)\nC_i = 组分 i 的浓度 (µg/dscf)\n7.57×10^6 = 将 µg/min 转换为 lb/h 的浓度因子\n\
  (注意 (454 g/h)(10^6 µg/g)(h/60 min) = 7.57×10^6)\n因此，\n(W_out)_1 = ((19200)(4.9)\
  \ / 7.57×10^6) = 0.01243 lb/h\n(W_out)_2 = ((19200)(1.0) / 7.57×10^6) = 0.00254\
  \ lb/h\n(W_out)_3 = ((19200)(49) / 7.57×10^6) = 0.1243 lb/h\n(W_out)_4 = ((19200)(490)\
  \ / 7.57×10^6) = 1.243 lb/h\n\n组分 i 的 DRE，DRE_i，由式 (4.16) 给出：\nDRE = [((W_in)_i\
  \ - (W_out)_i) / W_in] 100%\nDRE_1 = ((250 - 0.01243)/250)100 = 99.995%\nDRE_2 =\
  \ ((250 - 0.00254)/250)100 = 99.999%\nDRE_3 = ((250 - 0.1243)/250)100 = 99.95%\n\
  DRE_4 = ((250 - 1.1243)/250)100 = 99.55%\n\n法规要求必须达到最低 99.99% 的 DRE。在此情况下，只有两个主要有机危险组分\
  \ (1 和 2) 达到了这一标准。假设组分 3 或 4 (或两者) 为指定的 POHC，则该装置将不符合规定。\n\n## 4.21 危险废物填埋场 (封存、隔离等)\n\
  \n危险废物可封存在危险废物填埋场或永久处置设施中。“就危险废物而言，填埋场被定义为处置设施或设施的一部分，其中危险废物被放置在土地上，且不是堆场、土地处理设施、地表蓄水池、地下注入井、盐穹构造、盐床构造、地下矿井、洞穴或纠正措施管理单元”\
  \ (40 CFR 260.10)。\n\n### 4.21.1 危险废物的最终处置\n\n历史上，一些危险废物曾被处置在普通填埋场。这导致不利数量的危险物质渗入地下。这些化学物质最终进入自然水文系统。许多填埋场现在要求采取防止地下水污染的对策。例如，必须在填埋场基础沿线安装屏障，以容纳处置废物中可能残留的危险物质。目前，危险废物通常必须在进入填埋场前进行稳定化和固化，并且必须经过不同处理以稳定和处置它们。大多数易燃材料可以回收为工业燃料。一些含有危险成分的材料可以回收，例如铅酸电池。\n\
  \n## 例 4.21 土地处置日覆盖\n\n填埋场-DNR 询问：我们拟建的危险废物填埋场的日覆盖需要多少材料？在填埋场使用寿命期间，我们的总容积 (空气空间)\
  \ 有多少将被用作日覆盖？如果不使用日覆盖，填埋场可以使用多久？填埋场平均平面为 500 m × 250 m，高 15 m。日填埋率为 15 m × 10 m\
  \ × 2 m，日覆盖为 0.3 m。\n\n## 解\n\n填埋场总空气空间为\nV1 = 500 × 250 × 15 = 1.88 × 10^6 m³。\n\
  每个日层 (升层) 的体积为\nV2 = 15 × 10 × 2 = 300 m³\n日覆盖的体积为\nV3 = 1.5 × 10 × 0.3 = 45 m³\n\
  日覆盖使用的空气空间体积 (百分比) 为\nV_pc = (V3/V1) × 100 = 45/300 × 100 = 15%\n使用日覆盖的填埋场寿命为\n\
  t1 = V1/(V2 + V3) = 5449 天\n= 每周 5 天工作 21 年\n\n已有的管理体系，并评估受监管和未受监管材料和做法的风险。\n\n\
  环境审计是一种管理工具，被认为通常能改善制造设施的整体环境绩效。这些审计通常侧重于可能涉及加工、制造、材料采购、储存、维护、分销和废物管理的运营设施。环境审计应能发现诸如不合规和不当或不充分的废物管理操作等问题，并\
  \ hopefully 允许及时纠正。然而，危险废物设施的管理人员持怀疑态度，并担心商业秘密的保密性以及可能由可能竞争类似制造或加工业务的外部人员披露。\n\n\
  ## 4.23 综合环境响应、赔偿和责任法及超级基金\n\n*超级基金* 是美国联邦政府设计用于资助清理受危险物质和污染物污染场地的计划。该计划管理的场地被称为“超级基金”场地。它于\
  \ 1980 年以《综合环境响应、赔偿和责任法》 (CERCLA) (USEPA 1980) 的形式设立。它授权联邦自然资源机构，主要是 EPA、各州和美洲原住民部落追回由危险物质造成的自然资源损害，尽管大多数州都有自己的\
  \ CERCLA 版本，并且最常使用。CERCLA 成立了有毒物质和疾病登记署。EPA 可以识别对环境中危险物质释放负责的各方 (污染者)，并要么迫使其清理场地，要么自行使用超级基金\
  \ (信托基金) 进行清理，并通过向美国司法部提出申请从污染者处收回成本。\n\n历史上约 70% 的超级基金清理活动由负责清理污染的各方 (PRPs) 支付。例外情况发生在责任方无法找到或无力支付清理费用时。直到\
  \ 1990 年代中期，大部分资金来自石油和化工行业的税收，体现了污染者付费原则，但自 2001 年以来，清理危险废物场地的资金大部分来自纳税人。尽管名称如此，该计划一直因资金不足而受苦，超级基金清理工作已减少到\
  \ 2014 年仅 8 项，而总数超过 1200 项。因此，EPA 通常与潜在责任方 (PRPs) 协商同意令，以研究场地并制定清理替代方案，须经 EPA 监督和批准所有此类活动。\n\
  \nEPA 和州机构使用危害排名系统 (HRS) 根据场地危险物质的实际或潜在释放计算场地评分 (范围 0 至 100)。28.5 分的评分使场地列入国家优先名单，有资格在超级基金计划下进行长期补救行动\
  \ (即清理)。截至 2019 年 6 月 12 日，有 1344 个场地列入名单，另外 255 个已被除名，41 个新场地已被提议。\n\n### 4.23.1\
  \ 历史\n\nCERCLA 由国会于 1980 年通过，以应对危险废物场地的威胁，其典型代表是纽约的 Love Canal 灾难和肯塔基州的 Valley of\
  \ the Drums。用于清理无法识别污染者、无法或不愿支付 (破产或拒绝) 的场地的初始信托基金约为 16 亿美元 (Beins and Lester 2015)。\n\
  \nEPA 于 1981 年发布了首个 HRS，并于 1983 年发布了首个国家优先名单 (NPL)。实施初期，仅 799 个超级基金场地中的 16 个得到清理，且仅收回了\
  \ 7 亿美元可回收资金中的 4000 万美元。里根的政策被描述为放任自流。\n\n1986 年的《超级基金修正和再授权法》在第 121 节中增加了最低清理要求，并要求与污染者的大多数清理协议必须作为同意令在联邦法院提交并接受公众评论\
  \ (第 122 节)。这是为了解决国会发现的行业与里根时代 EPA 之间的“甜心交易”。\n\n根据美国政府问责办公室 (2015) 报告，自 2001 年以来，清理危险废物场地的资金大部分来自纳税人：州通常支付\
  \ 10% 的清理成本，至少 50% 由造成污染的设施运营。到 2013 年，资金已从 1999 年的 20 亿美元下降到不足 11 亿美元 (Ryan 2004)。\n\
  \n### 4.23.2 条款\n\nCERCLA 授权两种响应行动：\n\n- 1) *清除行动*。这些通常是短期响应行动，可采取行动应对需要及时响应的释放或威胁释放。\n\
  \n\n\n\n清除行动被分为 (i) 紧急；(ii) 时间关键；和 (iii) 非时间关键。清除响应通常用于解决局部风险，例如含有危险物质的废弃油桶，以及对人类健康或环境构成急性风险的受污染地表土壤。\n\
  \n- 2) *补救行动。* 这些通常是长期响应行动。补救行动旨在永久且显著地降低危险物质释放或威胁释放相关的风险，通常规模更大、费用更高。它们可以包括使用围堵措施防止污染物迁移，以及移除、处理或中和有毒物质的组合。这些行动只能在美国及其领土上列入\
  \ EPA 国家优先名单的场地上使用联邦资金进行。在 EPA 监督下，根据同意令或单方面行政命令由责任方进行的补救行动可在国家优先名单和非国家优先名单场地进行，通常在\
  \ EPA 已发布的指导和政策文件中称为超级基金替代场地。\n\nPRP 是可能最终根据 CERCLA 对特定财产或资源造成的污染或误用承担责任的潜在污染者。可能对超级基金场地污染承担责任的\
  \ PRP 有四类：\n\n- 1) 场地当前所有者或运营者\n- 2) 在危险物质、污染物或污染物处置发生时场地的所有者或运营者\n- 3) 安排在某场地处置危险物质、污染物或污染物的个人\n\
  - 4) 将危险物质、污染物或污染物运输到某场地并选择该场地处置这些危险物质、污染物或污染物的个人。\n\n## 4.23.3 程序\n\n超级基金场地地图。红色表示目前在最终国家优先名单上，黄色为拟议中，绿色为已删除（通常意味着已清理完毕）。该地图截至\
  \ 2018 年 9 月 13 日。在接到潜在危险废物场地的通知后，EPA 会进行初步评估/场地检查（PA/SI），其中包括记录审查、访谈、目视检查和有限的现场采样。PA/SI\
  \ 的信息由 EPA 用于制定 HRS 评分，以确定场地的 CERCLA 状态。得分足够高而被列入名单的场地通常会进入补救调查/可行性研究（RI/FS）。RI\
  \ 包括广泛的采样计划\n\n和风险评估，界定场地污染的性质和范围以及风险。FS 用于制定和评估各种修复替代方案。首选替代方案以《建议计划》形式提交公众审查和评论，随后在《决策记录》（ROD）中选定替代方案。场地随后进入补救设计阶段，然后进入补救行动阶段。许多场地包括长期监测。在补救行动完成后，只要场地内仍残留对非限制性使用不安全的危险物质，就必须进行五年审查。\n\
  \n- CERCLA 信息系统（CERCLIS）是由 EPA 和各州维护的数据库，列出可能发生过、必须处理或已处理的释放场地。CERCLIS 由三个清单组成：CERCLIS\
  \ 清除清单、CERCLIS 补救清单和 CERCLIS 执法清单。\n- *超级基金创新技术评估*（SITE）计划支持为评估和处理超级基金场地废物而开发技术。EPA\
  \ 评估该技术并提供对其在超级基金修复行动中未来使用潜力的评估。SITE 计划由四个相关组成部分构成：示范计划、新兴技术计划、监测与测量技术计划以及技术转让活动。\n\
  - *报告数量*是指如果释放，必须报告的危险物质的最低数量。\n- *源控制行动*是指为防止危险物质（主要来自地面上方或内部、建筑物或其他结构中的源）持续释放到环境中而进行的建设或安装及启动所需行动（40\
  \ C.F.R. 300.5）。\n- *第 104(e) 条信函*是政府要求提供有关某场地信息的请求。它可能包括向潜在责任方发出一般通知，称可能在该责任方可能负责的场地采取\
  \ CERCLA 相关行动（42 U.S.C. 9604 e）。该条款还授权 EPA 进入设施并获取与 PRP、危险物质释放和责任相关的信息，并下令为 CERCLA\
  \ 活动提供通道。104(e) 信函的信息收集类似于民事诉讼中的书面质询。\n- *第 106 条命令*是 EPA 向 PRP(s) 发出的单方面行政命令，要求其在\
  \ EPA 认定可能对\n\n暴露于铅污染。市政府于 1974 年起诉铅冶炼厂，随后于 1976 年降低了其铅法规。直到 1981 年，EPA 才委托对该社区的铅污染进行研究，并发现了十年前发现的相同结果。1983\
  \ 年，由于铅暴露，周边的日托中心被迫关闭，而铅冶炼厂仍在运营。后来揭露 EPA 副局长 John Hernandez 故意拖延了铅污染热点区域的清理工作。直到\
  \ 1993 年，该场地才被宣布为超级基金场地，当时它是最大的场地之一。然而，直到 2004 年，EPA 才完成清理工作并消除了该场地的铅污染源。\n\n北卡罗来纳州沃伦县的\
  \ Afton 社区是环境不公正案例中最突出的之一，常被认为是环境正义运动的根源。PCB 被非法倾倒到社区中，最终成为 PCB 填埋场。社区领袖敦促州政府整整十年清理该场地，直到最终被解毒（Braithwaite\
  \ et al. 2009）。然而，这种去污染并没有使该场地恢复到 1982 年之前的状况。社区要求赔偿的呼声至今未得到满足。\n\n旧金山的 Bayview-Hunters\
  \ Point 是一个历史上以非裔美国人为主的社区，由于联邦宣布的超级基金场地旧金山海军造船厂的修复工作不力，长期面临持续的环境歧视。多个机构未能充分清理该场地，导致\
  \ Bayview 居民遭受高污染率、士绅化，并与旧金山其他地区相比癌症、哮喘和整体健康危害率更高有关。\n\n## 4.23.8 原住民社区案例研究\n\n\
  一个例子是纳瓦霍族的 Church Rock 铀矿厂泄漏事件。这是美国最大的放射性泄漏事件，但在被列为低优先级场地后，政府的响应和清理工作被长期拖延。国会制定了两套五年清理计划，但\
  \ Church Rock 事件造成的污染至今尚未完全清理。今天，冷战时期采矿造成的铀污染仍遍布纳瓦霍族领地，对纳瓦霍社区构成健康风险。\n\n削减 EPA 的资金和资源将阻碍超级基金场地的监管和修复。这将延续邻近社区因靠近超级基金场地而面临的健康风险暴露。政府对超级基金状况的响应延迟会增加邻近社区的健康风险暴露（Konisky\
  \ 2015；美国政府问责局 2015）。\n\n社区因靠近超级基金场地而面临健康风险。政府对超级基金状况的响应延迟会增加邻近社区的健康风险暴露（Konisky\
  \ 2015；美国政府问责局 2015）。\n\n## 4.24 印度工业废物管理：换挡\n\n随着印度人口增长，加上快速工业化和城市化，废物产生量预计将从 6200\
  \ 万吨/年增加到 2030 年约 1.65 亿吨（ASSOCHAM India 2017；TERI 2014）。印度在政策、视角和工业化（印度制造倡议）方面正在经历范式转变，同时还有\
  \ Swachh Bharat Abhiyan（清洁印度运动）倡议。工业和公司致力于发挥催化作用，通过敦促包括城市、州和联邦废物管理在内的所有利益相关者作为“清洁印度倡议”的一部分共同努力，推动“绿色经济”概念。图\
  \ 4.17 显示了废物的一般分类，包括工业危险和非危险废物、城市废物、电子废物和生物医学废物。这些是在提取原材料为中间产品和最终产品、消费最终产品以及其他人类活动过程中产生的。\n\
  \n### 4.24.1 综合固体废物管理\n\n综合固体废物管理（ISWM）是指对固体废物的可持续管理采取的战略方法，涵盖所有来源和所有方面，如产生、分拣、转运、分选、处理、回收和处置的综合管理，重点是最大化资源利用效率。有效的\
  \ ISWM 系统考虑如何以最有效地保护人类健康和环境的方式预防、回收和管理固体废物。ISWM 涉及评估当地需求和条件，然后为这些条件选择和组合最合适的废物管理活动。主要\
  \ ISWM 活动是废物预防、回收和堆肥，以及焚烧（废物能源）和在设计、建设和管理良好的垃圾填埋场中处置。\n\n选择最合适的废物管理系统和可持续技术也是提供最佳和可持续\
  \ ISWM 系统所必需的。结合经济和社会考虑，这种方法将有助于废物管理者设计更可持续的废物管理系统。\n\n\n\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_206_0.png)\n\
  \n因此，对于固体废物的管理，以下是优先的处理方法层级：\n\n- 源头减量：指在消费的每个阶段都贯彻废物管理的原则，从材料的设计、制造、购买或使用开始，以减少产生的废物数量或毒性。\n\
  - 环境适宜的再利用和回收：通过系统的分类、收集和再加工来节约自然资源和能源。\n\nISWM 概念必须适应这样一种观点：有效的管理方案需要设计、适应和系统的灵活性，以最好地满足当前的社会、经济和环境条件。这些条件可能随时间变化并因地而异。ISWM\
  \ 涉及三个方面的生命周期废物产生和废物管理（TERI 2014）。\n\n## 4.24.2 危险废物处理和管理规则\n\n为应对工业废物问题，部于 1989\
  \ 年发布了《危险废物（管理和处理）规则》（2000 年和 2003 年修订），并于 2008 年发布了《危险废物（管理、处理和越境转移）规则》。1989 年的规则旨在使监管机构能够控制本国产生的危险废物的处理、移动和处置。2000\
  \ 年和 2003 年的修订主要旨在使危险废物的定义与《巴塞尔公约》的规定保持一致。2008 年的规则将电子废物管理纳入危险废物管理的范围（Gadgil 等 2011；Khwaja\
  \ 等 2010）。\n\n## 4.24.3 医疗废物规则\n\n《医疗废物（管理和处理）规则》于 1998 年发布（2000 年和 2003 年修订）。该规则基于将一般废物与医疗废物（BMW）分离的原则。它们为容器规定了颜色编码，并为\
  \ 10 类废物规定了处理和处置选项。各邦政府已采取措施建立共同医疗废物处理设施（CBWTFs）用于废物的处理和处置。用于处理和处置本国产生的 BMW，目前有\
  \ 177 个共同处理和处置设施正在运行，这些设施由私营企业开发（Gadgil 等 2011；Khwaja 等 2010）。\n\n## 4.24.4 电子废物规则\n\
  \n《电子废物（管理和处理）规则》于 2011 年 5 月发布，自 2012 年 5 月起实施。该规则引入了生产者延伸责任的概念，使生产者对其生命周期结束产品的环境无害管理负责，包括收集并将其送至注册拆解商或回收商。这些规则适用于制造、销售或购买以及处理《附表\
  \ I》所列电气和电子设备或部件的每位制造商、消费者或大宗消费者，以及电子废物的收集中心、拆解商和回收商（Gadgil 等 2011）。\n\n## 4.24.5\
  \ 塑料非危险废物规则\n\n环境与森林部发布了《塑料制造、使用和废物管理规则，2009 年（草案）》，以取代 1999 年《再生塑料制造和使用规则》（2003\
  \ 年修订），以规范塑料手提袋的制造和使用。草案规则已广泛公布征求公众意见。部成立了一个专家委员会来审查这些意见并提出经济手段。这些规则最终确定为《塑料废物（管理和处理）规则\
  \ 2011》，并于 2011 年 2 月 4 日发布（Khwaja 等 2010）。\n\n## 问题\n\n**4.1** 水以 47.8 ft³/s 的速率流经帕歇尔量水槽。喉宽为\

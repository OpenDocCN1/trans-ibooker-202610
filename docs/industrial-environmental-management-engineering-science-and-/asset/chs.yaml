  ### 7.14.2.1 生物质燃烧发电\n\n以生物质为燃料的蒸汽发电厂的资本和运营成本相对广为人知，因为这些系统具有丰富的运行经验。新建电厂的资本成本在每千瓦1400至1800美元之间。因此，一座基于直接燃烧的50兆瓦生物质电厂大约耗资8000万美元。基于生物质每千兆焦41.90美元的目标价格，直接燃烧生物质发电的生产成本约为每千瓦时0.06美元（Environmental\
  \ Law & Policy Center 2001）。\n\n### 7.14.2.2 生物质气化发电\n\n气化厂的资本成本，包括燃料供给和气体净化，取决于系统的规模和运行压力。在美国，一座产生50兆瓦热能的大气压气化炉成本约为1500万美元。一座发电量为50兆瓦的气化/燃气轮机发电厂，总资本成本在7500万至1.38亿美元之间（即每千瓦1500至2750美元），较小的数字反映了在建成后技术知识的改进。\n\
  \n\n\n\n至少十座工厂。如果燃料以乐观的价格范围 $1.00–$1.50/GJ 可获得，电力生产成本将介于 $0.05 至 $0.09/kWh 之间。\n\
  \n目前适用于集成气化/燃料电池发电厂的高温燃料电池的资本成本为 $3000/kW。预计熔融碳酸盐燃料电池在进入市场时为 $1500/kW，降至商业成熟单元约\
  \ $1000/kW。成熟单元以天然气运行的电力成本预计在 $0.049 至 $0.085/kWh 之间。如果有更便宜的燃料可用，则经济性更具吸引力。使用成熟燃料电池技术从垃圾填埋气产生的电力的成本预计与内燃机/发电机组相当，即约\
  \ $0.05/kWh（Bridgewater 1995；Hirschenhofer et al. 1994；William and Larson 1993）。\n\
  \n## 7.14.2.3 来自厌氧消化的沼气\n\n厌氧消化已商业化用于废水处理。厌氧消化发电尚处于起步阶段。产生的甲烷通常在内燃机中燃烧以产生电力，以期抵消废水处理成本，但目前没有取代天然气的即时前景。处理超过\
  \ 200 T/天挥发性固体厌氧消化设施的资本成本估计为每处理 1 T/天挥发性固体 $44 000 至 $132 000。甲烷产量约为每千克挥发性固体 0.38\
  \ m³。因此，200 T/天厌氧消化厂每年可生产 2800 万 m³ 甲烷，相当于几乎 2900 GJ/天的化学能。1986 年美元计，生产专用能源作物的甲烷的预计运行成本在\
  \ $5–6/GJ 范围内。相比之下，美国天然气的价格因季节和地理位置差异很大，在 $1.90 至 $4/GJ 之间。在利基市场中，当原料便宜且天然气不可用时，沼气可以成为一种可行的替代能源（Benson\
  \ et al. 1986）。使用催化蒸汽气化工艺的家禽 WTE 类似的沼气制造在第 10 章中进行了描述。\n\n## 7.14.2.4 来自生物质的乙醇\n\
  \n乙醇从生物质生产成本因所用原料、设施规模和管理以及作为某些转化过程一部分产生的副产品的市场价值而大不相同。美国拟建乙醇厂的成本信息对于使用玉米淀粉的工厂最为可靠，这是美国乙醇工业的基础。从零开始建造的\
  \ 5000 桶/天工厂（约 265 百万升/天）的资本成本约为 1987 年美元的 $140 百万，或每年产能的 $0.53/升。较小的设施的资本成本可能高达每年产能的\
  \ $0.79/升，任何规模设计不良的设施可能花费 $1.06/升的年产能。另一方面，从现有设施（如炼油厂或化工厂）或与更大工业设施集成的乙醇厂建造的乙醇厂的资本成本可大幅降低，通常在每年产能的\
  \ $0.26–0.40/升范围内。\n\n低端生产成本约为 $0.26/升。然而，乙醇的体积热值仅为汽油的 66%。因此，该生产成本相当于在税费、运输或利润之前汽油售价为\
  \ $0.39/升。相比之下，1990 年美元计的炼油厂汽油价格为 $0.20/升。目前，发酵的经济性使得乙醇的商业可行性完全依赖于政府激励措施形式的税收抵免，目前每升用于燃料混合的乙醇为\
  \ $0.16。此外，发酵副产品的强劲市场是玉米乙醇经济可行性的关键因素。\n\n预计将木质纤维素转化为糖的技术将降低燃料乙醇的成本，尽管目前没有专门的经济信息。生产乙醇的\
  \ 5000 桶/天工厂的资本成本估计为 $175 百万（1994 年美元），使用同时糖化和发酵的木质纤维素。假设木材成本为 $42/干吨，乙醇可生产约 $0.31/升。将规模经济与加工技术进步相结合预计将使生产成本降至\
  \ $0.31/升。然而，一些报告表明，纤维素乙醇的成本必须低至 $0.08–0.11/升才能与 21 世纪初预期汽油价格竞争（Lynd et al. 1996；National\
  \ Advisory Panel 1987）。\n\n## 7.14.2.5 来自生物质衍生合成气的甲醇\n\n生产甲醇的 7500 桶/天工厂的资本投资约为\
  \ 1991 年美元的 $280 百万。从 $40/干吨木材生产的甲醇成本预计约为 $0.27/升。由于甲醇的体积热值仅为汽油的 49%，该工厂的生产成本相当于汽油售价为\
  \ $0.55/升。从天然气生产甲醇的成本可显著降低，但这假设了更大的工厂产能以获取规模经济。对于分散的生物质原料而言，这样的规模化工厂是不可行的。新的甲醇合成技术可能能够显著降低这一价格。美国能源部的生物质甲醇计划的目标为\
  \ $0.15/升（$7.90/GJ），基于 $1.90/GJ 的原料成本（Klass 1998）。\n\n## 7.14.2.6 来自快速热解的生物油\n\n\
  生产热解液的 5000 桶/天工厂的资本投资为 1987 年美元的 $63 百万。假设生物质原料在 $1.70/GJ 可获得，该规模工厂可生产热解液 $0.18/升，其能量价值为\
  \ $6.70/GJ（Elliott et al. 1990）。\n\n## 7.14.2.7 来自植物油的生物柴油\n\n生物柴油设施的资本成本相对适中，50\
  \ 桶/天（320 万升/年）的成本约为 $250 000。然而，生物柴油生产的原料成本相对高于其他燃料生产的原料，废弃脂肪的范围为 $0.16 至 $0.26/升，植物油为\
  \ $0.53–0.79/升。在最佳情况下，生物柴油厂可能以 $0.44/升的价格生产燃料。石油生产的柴油通常售价低于 $0.25/升（Gavett et al.\
  \ 1993）。\n\n## 7.14.2.8 琥珀酸\n\n琥珀酸用于生产食品和药品产品、表面活性剂和洗涤剂、可生物降解溶剂和塑料，以及刺激动物和植物生长的成分。尽管它是植物、动物和微生物形成的常见代谢物，其目前的商业生产量为\
  \ 15 000 T/Y 来自石油。\n\n## 问题\n\n7.1 一个制造过程目前的年运行成本为 $10.9 百万，年废物处置成本为 3.3 百万。工厂经理希望通过安装新设备以\
  \ $23.3 百万的资本成本升级该过程。这将使年运行和废物处置成本分别降至 $7.1 和 $1.4 百万。在无残值的情况下，以 12% 利率 10 年为基准，比较两个过程的现值。\n\
  \n7.2 （a）收益/成本之和 = 0.85 的项目是否应实施？解释你的答案；（b）依赖收益/成本比来证明项目存在哪些缺点？\n\n7.3 一个社区计划建设一个垃圾填埋场以处置未来\
  \ 20 年的废物。成本估算和预期收入如下：\n\n| 项目 | 金额 |\n|---|---|\n| 垃圾填埋场建设成本 | $7 600 000 |\n|\
  \ 启动成本 | $500 000 |\n| 每年运营维护成本 | $1 000 000 |\n| 每年收取的倾倒费 | $4 500 000 |\n\n然而，最近发现的瘤胃生物体\
  \ Actinobacillus succinogenes 以高达 110 g/l 的产量生产琥珀酸，为从生物可再生资源生产这种化学品提供了前景。与大多数其他商业发酵不同，该过程消耗\
  \ CO₂，并且与乙醇发酵等过程集成时，琥珀酸生产可有助于减少温室气体排放。\n\n在最佳 pH 条件下，琥珀酸盐而非游离酸被生产。因此，回收涉及盐的浓缩、转回游离酸以及对酸进行抛光以达到所需纯度。下游纯化可占产品成本的\
  \ 60–70%。\n\n## 7.14.2.9 乳酸\n\n乳酸是一种三碳分子，用于生产聚乳酸树脂，一种可生物降解聚合物，预计将在合成纤维和塑料市场与聚乙烯和聚苯乙烯竞争。乳酸目前通过研磨玉米、分离淀粉、水解淀粉为葡萄糖，并用\
  \ Bacillus dextrolactius 或 Lactobacillus delbrueckii 厌氧发酵葡萄糖为乳酸来生产。用乙醇酯化产生乳酸乙酯，可聚合为聚乳酸树脂。\n\
  \n假设公民只有在收益/成本比大于 1.5 时才会支持新的垃圾填埋场设施。在 7% 利率、20 年使用寿命下，确定是否应建设垃圾填埋场。\n\n7.4\n\n\
  一个县希望在河流上建造一座免收费大桥，以便缩短穿过山区的路线。收益是减少旅行时间、减少事故、减少燃油使用、减少污染等。是否应建造大桥？收益和成本数据如下。\n\n\

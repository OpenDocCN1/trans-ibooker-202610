  图 9.5 生产吉瓦级太阳能光伏的 EIP 示意图。来源：引自 Pearce（2008）。


  透明导体，如氧化锡、氧化锌或氧化铟锡，作为基板使用。玻璃工厂中利用大量热量的生产阶段将集成热回收，为其他设施和温室综合体（3a）提供较低等级的热能。在温室综合体中，即使在北方气候下，利用
  EIP 制造厂的废热也能全年种植异国植物。同样，废热可用于提供蘑菇生长室（3b）。在这两个农业工厂中，食品或其他农产品将销往园区外，而栽培基质将由回收设施（1）提供，用于温室（3a）的堆肥，以及用于蘑菇种植设施（3b）的木浆或堆肥。在较温暖的气候中，废热可用于驱动吸收式制冷机，或许可为办公园区提供制冷。


  基板随后将直接送入光伏组件厂（4）。然后，一组半导体和金属薄膜沉积系统将制造并图案化太阳电池的有源层。所有废弃的半导体和金属将被捕获并返回半导体回收厂（5），以补充进入沉积系统的通常昂贵的高纯度材料。光伏沉积和图案化线的输出将是准备进行保护涂层和包装的光伏太阳能板。


  回收中心（1）从普通饮用罐中提取的铝将被送入铝加工厂（6），该厂将生产用于固定玻璃太阳能板的涂层铝轨。铝轨将挤压成型，用于提供一种简单且经济的安装方式，可安装在屋顶、地面安装系统或建筑一体化光伏上。此外，挤压铝轨可设计成地面和平屋顶安装的平衡系统组件。与玻璃制造厂（2）类似，废热将被回收并用于共生集体，或用于加热温室（3a）或蘑菇生长室（3b）。


  接下来，在包装厂（7）中，太阳能板如有必要将被互连，并喷涂保护性聚合物涂层以将其密封于环境中。聚合物涂层的主要成分可再次从回收厂（1）和普通塑料中获取。随后，板件将配装快速连接器，以便在现场通过相互连接、逆变器或电池组轻松安装。最后，板件将被包装在纸箱中以防止运输损坏，并用碎报纸填充缓冲。报纸再次来自回收厂（1），而纸箱可来自纸箱厂（8），该厂的原材料来自回收厂（1）。


  通过将这些工厂共同布局在 EIP 中，它们之间的运输成本和能源可以最小化，并且太阳能光伏工厂的许多投入实际上可以来自周边人口中心的废弃物。应注意，每个工厂都将根据共生系统进行适当规模设计，并且应各自盈利，以便独立企业可以通过共同选址复制这一模式，并在未来的设施中受益于工业共生。


  ## 9.3 水-能源 Nexus


  当今的水和能源系统紧密交织。水在能源生产和电力生成的各个阶段都被使用。能源是提取、输送和输送适当质量的水以满足多样化人类需求所必需的，然后再次用于在水返回环境之前处理废水。历史上，能源与水之间的相互作用是按区域或按技术进行考虑的。在国家和国际层面，能源和水系统是独立开发、管理和监管的。水和能源是关键的相互依存资源——能源生产需要大量水，而水基础设施需要大量能源（Das
  2017；Das and Cabezas 2018；EPRI 2011；USDOE 2014a, 2013a, b）。


  水是发电所必需的：热电冷却、水力发电、能源矿物开采和采矿、燃料生产（包括化石燃料、生物燃料和其他非常规燃料）以及排放控制都依赖于大量水。在美国，热电发电行业是取水量最大的用户。据美国地质调查局
  USGS 称，2005 年美国每天取用的淡水为 3490 亿加仑。最大用途是热电，占取水淡水的 41%，为 1430 亿加仑/天。然而，与灌溉等其他用水类别相比，热电用途的淡水消耗量很低（仅
  3%），灌溉用水占水消耗量的 81%。


  - 取水：从湖泊或河流等水源中移除的总水量。通常，其中很大一部分水会返回水源，可再次使用。

  - 耗水：取水用于使用且未返回其水源的水量。


  供水也需要能源使用：提取、输送、处理和输送饮用水需要大量能源。此外，收集、处理、




  and dispose of wastewater. In 2010, the US water system consumed over 600 billion
  kWh, or approximately 12.6% of the nation’s energy according to a study by researchers
  at the University of Texas at Austin. The study found water systems use about 25%
  more energy than is used for residential or commercial lighting in the United States.


  Water and energy are both multifaceted issues with many variables impacting their
  supply, demand, and management. Lawmakers should consider the following variables
  which add complexity to the management of water and energy:


  - *Growing population:* According to a 2012 United States Census Bureau projection,
  the US population could reach 400 million people by 2051. Population growth affects
  energy use through increases in housing, commercial floor space, transportation,
  and economic activity. The US Energy Information Administration (EIA) estimates
  that total electricity consumption will grow from 3841 billion kWh in 2011 to 4930
  billion kWh in 2040, an average annual rate of 0.9%. With a higher generating capacity,
  the United States will require additional water withdrawals.

  - *Agriculture:* Feeding a growing population may require greater agricultural water
  use. Agriculture accounts for approximately 37% of total freshwater withdrawals
  in the United States, and 81% of water consumption.

  - *Geographical water demand:* Water supply and demand are not geographically linked.
  From 1990 to 2010, the second largest regional population growth, 13.8%, occurred
  in the west, which is one of the most water-deficient regions in the United States.
  Additionally, water consumption in the western United States is much higher than
  other regions due to agricultural demands. It is estimated that it takes over one
  million gallons of water a year to irrigate one acre of farmland in arid conditions.
  In other words, about 86% of irrigation water withdrawals were in western states
  in 2000.

  - *Climate change:* Climate change could affect water supply and electricity use.
  Warmer or colder weather patterns could result in increases or decreases in energy
  use. Changes in precipitation in a region could increase or decrease the ability
  to store water, agricultural production and water use, and overall water supply.


  States are beginning to assess their energy options and promote policies that allocate
  financial support to a diverse range of technologies to encourage responsible, sustainable
  energy production. States are also becoming aware of the limitations to accessible
  water, and as our energy demands grow, competition for water among municipalities,
  farmers, industrial, and power suppliers will increase. Water and energy are linked
  at both the supply side (electric generation and water/wastewater facilities) and
  the end-use side (residential, commercial, industrial, and agriculture sectors)
  (Figure 9.6). In order to sustain energy production and a dependable water supply,
  the United States must gain a


  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_435_0.png)


  The energy requirements for water systems also have regional variability, based
  on the quality of water sources and pumping needs.


  Water availability will affect the future of the water–energy nexus. While there
  is significant uncertainty regarding the magnitude of effects, water availability
  and predictability may be altered by changing temperatures, shifting precipitation
  patterns, increasing variability, and more extreme weather. Shifts in precipitation
  and temperature patterns – including changes in snowmelt – will likely lead to more
  regional variation in water availability for hydropower, biofeedstock production,
  thermoelectric generation, and other energy needs. Rising temperatures have the
  potential to increase the demand for electricity for cooling and decrease the efficiency
  of thermoelectric generation, as well as increase water consumption for agricultural
  crops and domestic use. These changes and variations pose challenges for energy
  infrastructure resilience.


  Water and energy needs will also be shaped by population growth and migration patterns,
  as well as changes in fuels used and energy technologies deployed. For example,
  projected population growth in the arid southwest will amplify pressure on water
  and energy systems in that region. Increased production of oil and gas may increase
  both localized demand for water and generation of produced water that requires management.
  According to EIA data, planned retirements and additions of electricity generation
  units and cooling systems will likely decrease water withdrawals, increase water
  consumption, and increase the diversity of water sources used. While many of the
  forces affecting the water–energy nexus are out of the federal government’s direct
  control, the future of the nexus hinges on a number of factors that are within the
  DOE’s scope of influence, including technology options, location of energy activities,
  and energy mix.


  The decision-making landscape for the nexus is shaped by political, regulatory,
  economic, environmental, and social factors, as well as available technologies.
  The landscape is fragmented, complex, and changing; the incentive structures are
  overlapping but not necessarily consistent. Water is inherently a multi-jurisdictional
  management issue and is primarily a state and local responsibility. States and localities
  vary in philosophies regarding water rights. There is also variation across states
  in relevant energy policies, including renewable portfolio standards, regulation
  of oil and gas development activities, and regulation of thermoelectric water intake
  and discharge. Regulations for both oil and gas development and thermoelectric water
  use are currently undergoing substantial change. Energy for water is also the subject
  of policy activity at multiple scales, from appliance standards to municipal water
  treatment funding mechanisms. A more integrated approach to the interconnected energy
  and water challenges could stimulate the development and deployment of solutions
  that address objectives in both domains (Table 9.2; AGU 2012; Clark and Veil 2009;
  DOE 2013a, b; EPRI 2011).


  ### 9.3.1 Technology Roadmaps and R&D


  There are a number of technologies that support water-efficient energy systems or
  energy-efficient water systems. These technologies are at various stages of research,
  development, demonstration, and deployment. Figure 9.8 illustrates a range of technologies
  optimizing water use for energy in waste heat recovery, cooling, alternate fluids,
  and process water efficiency.


  Cooling for thermoelectric generation is an important target for water efficiency
  because it withdraws large quantities of water for cooling and dissipates tremendous
  amounts of primary energy. One approach to reduce thermoelectric and other cooling
  requirements, along with associated water use, is to reduce the generation of waste
  heat through more efficient power cycles (e.g. the recompression closed-loop Brayton
  cycle). Another option is to increase the productive use of the waste heat, such
  as through thermoelectric materials, enhancements in heat exchanger technologies,
  or low-temperature co-produced geothermal power. A third approach to improve the
  water efficiency of cooling systems is through advancements in technologies, including
  air flow designs, water recovery systems, hybrid or dry cooling, and treatment of
  water from blowdown.


  Opportunities to optimize water use also exist in other parts of the overall energy
  system. With further research, alternative fluids may replace freshwater in hydraulic
  fracturing, geothermal operations, and power cycles. Process freshwater efficiency
  can be improved in carbon capture, bioenergy feedstock production, and industrial
  processes. Many of the technologies that improve water efficiency are enhanced by
  advances in materials, including thermoelectric properties, heat-driven state change,
  scaling/fouling resistance, and temperature and pressure tolerance.


  Figure 9.9 shows water treatment technologies that can potentially enhance energy
  efficiency of water systems and enable the productive, economical, and safe use
  of nontraditional water resources for energy and nonenergy applications. Such improvements
  in water treatment and management have particular use for treating oil- and gas-produced
  waters, as well as saline aquifers, brackish groundwater, brines, seawater, and
  municipal wastewater. For saline sources, promising water treatment technologies
  include membrane distillation, forward osmosis, evaporation, nanomembranes, and
  capacitive deionization. For municipal wastewater, treatment technologies include





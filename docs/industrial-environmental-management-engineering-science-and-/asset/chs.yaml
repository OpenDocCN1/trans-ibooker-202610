  \ 58, 里约宣言原则16。\n\n本章概述了工业废水来源、废水特性、废水处理、再利用和排放、工业空气污染源、清单、空气污染控制、固体废物和危险废物特性、处理和管理。\n\
  \n工业废物是由工业活动产生的废物，包括在制造过程中变得无用的任何材料，例如工厂、工业、磨坊和采矿作业的产品。它自工业革命开始以来就已存在（Pink 2006）。工业废物的一些例子有化学溶剂、油漆、砂纸、纸制品、工业副产品、金属、塑料和放射性废物。\n\
  \n有毒废物、化学废物、工业固体废物和市政固体废物是工业废物的分类。污水处理厂可以处理一些工业废物，即由常规污染物如生化需氧量（BOD）、化学需氧量（COD）、悬浮固体（SS）和总悬浮固体（TSS）组成的废物。含有有毒污染物的工业废物需要专门的处理系统（美国法典，清洁水法，第402(p)节\
  \ 33 U.S. Code §1342(p) 1999）。\n\n## 3.2 废水来源\n\n### 3.2.1 点源\n\n点源水污染是指污染物从单一、可识别的来源，如管道或沟渠进入水体的情况。此类来源的例子包括工厂、污水处理厂或公共所有处理设施（POTWs）或城市雨水排水口的排放。美国《清洁水法》（CWA）为监管执法目的定义了点源（美国法典《清洁水法》第502(14)节\
  \ 33 U.S.C. §1362(14) 1999）。CWA 对点源的定义于1987年进行了修订\n\n以包括市政雨水 sewer 系统，以及工业雨水，例如来自建筑工地的雨水。\n\
  \n### 3.2.2 非点源\n\n非点源（NPS）污染是指不源于单一离散来源的弥散污染。NPS 污染通常是来自大面积累积的小量污染物的累积效应。常见例子是从施肥的农业用地渗漏出的氮化合物（Moss\
  \ 2008）。农业用地或森林上“片流”产生的雨水中的营养物质径流也被引为 NPS 污染的例子。\n\n从停车场、道路和高速公路冲刷下来的受污染雨水，即城市径流，有时被归入\
  \ NPS 污染的范畴。然而，由于这种径流通常被导入雨水排水系统并通过管道排放到当地地表水，因此成为点源。\n\n逸散排放也是 NPS 污染，因为气体或蒸气的排放发生在加压设备因泄漏和其他非预期或不规则的气体释放而发生，主要是工业活动。除了丢失商品的经济成本外，逸散排放还会导致空气污染和气候变化。\n\
  \n## 3.3 废水特性\n\n在1940年之前，大多数市政废水来自生活来源。1940年后，随着美国工业发展显著增长，越来越多的工业废水被排放并继续排放到市政收集系统。工业活动产生的重金属和合成有机污染物的数量有所增加；每年新增约10000种有机化合物。这些化合物中的许多现在都出现在废水中。\n\
  \n\n\n\n随着制造业的技术变革，排放的化合物以及由此产生的废水特性也在发生变化。工业过程中产生的许多化合物通过常规废水处理工艺处理起来既困难又昂贵。因此，有效的工业预处理成为整体水质管理计划的重要组成部分。执行工业预处理计划是一项艰巨的任务；一些受管制的污染物仍然会逃逸到市政污水收集系统中，必须进行处理。未来，以污染预防为目标，工业排放方应尽一切努力，在任何新的化合物获准使用之前，评估其可能进入废水流的潜在环境影响。如果一种化合物无法用现有技术有效处理，就不应使用。\n\
  \n工业废水在流量和污染物浓度方面差异很大。因此，不可能为其组分设定固定值。一般来说，工业废水可能含有悬浮固体、胶体固体和溶解固体（矿物性和有机性）。此外，它们可能过度酸性或碱性，并可能含有高浓度或低浓度的有色物质。这些废水可能含有惰性、有机或有毒物质，以及可能的病原菌。只要这些废水对处理效率没有不利影响，或对下水道系统没有不良影响，就可以排放到下水道系统中。在排放到市政系统之前，可能需要对废水进行预处理（见第3.5.2节），或者当废水直接排入地表水或地下水时，则需要进行完全处理。\n\
  \n下文给出的物理和化学特性描述适用于大多数废水，包括工业废水和市政废水。\n\n### 3.3.1 物理特性\n\n废水的主要物理特性包括固体含量、颜色、气味和温度。\n\
  \n### 3.3.2 总悬浮固体\n\n废水中的总固体由不溶性固体（即总悬浮固体）和溶解在水中的可溶性化合物组成。悬浮固体含量通过干燥并称量样品过滤后残留的固体来确定。当此残留物被点燃时，挥发性固体被烧尽。挥发性固体被认为是有机物，尽管有些有机物不会燃烧，有些无机盐在高温下会分解。有机物主要包括蛋白质、碳水化合物和脂肪。普通废水中40%至65%的固体是悬浮的。可沉降固体以毫克/升（mg/L）表示，是指通过沉淀去除的固体。通常，废水中约60%的悬浮固体是可沉降的（Crites\
  \ 和 Tchobanoglous，1998）。固体也可以按另一种方式分类：在高温（600°C）下挥发的固体和不能挥发的固体。前者称为挥发性固体，后者称为固定固体。通常，挥发性固体是有机物。\n\
  \n### 3.3.3 颜色\n\n颜色是一种定性特征，可用于评估废水的一般状况。颜色为浅棕色的废水龄期不足六小时，而浅灰色至中灰色则是已经发生一定程度的分解或在收集系统中停留了一段时间的废水的特征。最后，如果颜色为深灰色或黑色，则废水通常是腐化的，表示在厌氧条件下经历了大量细菌分解。废水变黑通常是由于各种硫化物的形成，特别是硫化亚铁。这是厌氧条件下产生的硫化氢与可能存在二价金属（如铁）结合的结果。颜色通过与标准进行比较来测量。\n\
  \n### 3.3.4 气味\n\n随着公众对污水处理设施的正常运行越来越关注，气味的测定变得越来越重要。新鲜废水的气味通常不难闻，但当废水在非好氧条件下被生物分解时，会释放出各种有气味的化合物。某些工业废水产生的不同难闻气味见表3.1。\n\
  \n### 3.3.5 温度\n\n由于加入了温暖的市政用水，废水的温度通常高于供水温度。温度测量很重要，因为大多数污水处理方案都包含依赖温度的生物过程。废水的温度随季节和地理位置而变化。在寒冷地区，温度变化范围约为7至18°C，而在温暖地区，温度变化范围为13至24°C（Crites\
  \ 和 Tchobanoglous，1998）。\n\n表3.1 某些工业产生的难闻气味\n\n| 工业类型 | 气味来源 |\n|---|---|\n| 水泥厂、石灰窑\
  \ | 二丁胺、硫醇、二丁基硫醚、硫化氢、二氧化硫 |\n| 食品工业 | 乙酸、乙醛 |\n| 食品工业（鱼类） | 丁胺、硫醇、二甲基硫醚、胺类 |\n|\
  \ 制药工业 | 发酵副产物 |\n| 纸浆和造纸工业（硫酸盐法） | 总还原硫化合物（TRS）：（硫化氢、硫醇、甲基二硫、二甲基二硫）、二氧化硫 |\n| 橡胶工业\
  \ | 硫化物、硫醇 |\n| 纺织工业ᵃ | 苯硫酚、酚类化合物 |\n| 番茄罐头厂 | 乙酸、乙醛、苯硫酚 |\n\n来源：引自Eckenfelder（2000）。\n\
  ᵃ Yohe和Rich（1995）。\n\n## 3.4 化学特性\n\n### 3.4.1 无机化学物质\n\n主要的化学测试包括游离氨、无机氮（以硝酸盐、亚硝酸盐形式）、有机磷和无机磷。氮和磷很重要，因为这两种营养元素是水生植物生长的原因。还进行其他测试，如氯化物、硫酸盐、pH值和碱度，以评估处理后的废水回用的适宜性，并控制各种处理工艺（Rouessac\
  \ 和 Rouessac，2007）。\n\n微量元素（包括一些重金属）不是常规测定的，但微量元素可能是废水生物处理的一个因素。所有生物体都需要不同量的某些微量元素（如铁、铜、锌和钴）才能正常生长。重金属也会产生毒性效应；因此，在评估处理后的出水或污泥的进一步利用时，重金属含量的测定尤为重要。许多金属也被归类为优先污染物，如砷、镉、铬、汞等。\n\
  \n对硫化氢、氧气、甲烷和二氧化碳等气体的测量有助于系统运行。需要测定硫化氢的存在，不仅因为它是一种有臭味且剧毒的气体，还因为它会影响位于平缓坡度上的长下水道的维护，因为它会造成腐蚀。测量溶解氧是为了监测和控制好氧生物处理过程。甲烷和二氧化碳的测量与厌氧消化器的运行有关。\n\
  \n### 3.4.2 有机化学物质\n\n多年来，已经开发了许多不同的测试方法来确定废水中的有机含量。通常，这些测试可分为两类：一类用于测量大于约1 mg/L的有机物总浓度，另一类用于测量10⁻¹²–10⁻³\
  \ mg/L范围内的痕量浓度。目前常用的测量废水中有机物总量（>1 mg/L）的实验室方法包括：（i）生化需氧量（BOD），（ii）化学需氧量（COD），以及（iii）总有机碳（TOC）。10⁻¹²–10⁻³\
  \ mg/L范围内的痕量有机物通过仪器方法测定，包括气相质谱法和色谱法。测定特定有机化合物是为了评估优先污染物的存在（Metcalf & Eddy，2003）。BOD、COD和TOC测试是有机含量的总体度量，因此不能反映废水对各种生物处理技术的响应。\n\
  \n### 3.4.3 挥发性有机化合物\n\n挥发性有机化合物（VOCs），如苯、甲苯、二甲苯、三氯乙烷、二氯甲烷和三氯乙烯（TCE），是工业化和商业化地区常见的土壤污染物。这些污染物的一个更常见来源是泄漏的地下储罐。不当弃置的溶剂以及现行严格法规出台之前建造的填埋场也是土壤VOCs的重要来源。许多有机物质被归类为优先污染物，如多氯联苯（PCBs）、多环芳烃、乙醛、甲醛、1,3-丁二烯、1,2-二氯乙烷、二氯甲烷、六氯苯等。表3.2列出了工业废水中典型的无机和有机物质。\n\
  \n### 3.4.4 重金属排放\n\n一些工业会排放重金属。可以看出，在所有重金属中，铬是使用最广泛且从不同来源排放到环境中的重金属。如图3.1所示，许多进入水生态系统的污染物（如汞、铅、农药和除草剂）对生物体具有很高的毒性。它们会降低繁殖成功率，妨碍正常的生长发育，甚至导致死亡。\n\
  \n\n\n## 表 3.2 工业排放物中存在的物质。\n\n| 物质 | 存在于来自以下行业的废水中 |\n|---|---|\n| 乙酸 | 乙酸盐粘胶纤维、甜菜根加工\
  \ |\n| 酸类 | 化工制造、采矿、纺织制造 |\n| 碱类 | 棉和草料蒸煮、羊毛洗涤 |\n| 氨 | 煤气、焦炭及化工制造 |\n| 砷 | 木材处理、镀锌工艺\
  \ |\n| 苯 | 水力压裂 |\n| 镉 | 电镀 |\n| 铬 | 电镀、铬鞣、铝阳极氧化 |\n| 柠檬酸 | 软饮料和柑橘水果加工 |\n| 铜 |\
  \ 铜电镀、铜酸洗 |\n| 氰化物 | 煤气制造、电镀、金属清洗 |\n| 脂肪、油脂 | 羊毛洗涤、洗衣房、纺织工业 |\n| 氟化物 | 烟气洗涤、玻璃蚀刻\
  \ |\n| 甲醛 | 合成树脂和青霉素制造 |\n| 游离氯 | 洗衣房、造纸厂、纺织漂白 |\n| 烃类 | 石化和橡胶工厂 |\n| 游离氯 | 洗衣房、造纸厂、纺织漂白\
  \ |\n| 硫醇 | 石油精炼、纸浆 |\n| 镍 | 电镀 |\n| 硝基化合物 | 炸药和化工厂 |\n| 有机酸 | 蒸馏厂和发酵厂 |\n| 酚类 |\
  \ 煤气和焦炭制造、化工厂 |\n| 淀粉 | 食品加工业、纺织工业 |\n| 糖类 | 乳品厂、酿酒厂、甜业 |\n| 硫化物 | 纺织工业、制革厂、煤气制造、压裂\
  \ |\n| 亚硫酸盐 | 纸浆加工、粘胶薄膜制造 |\n| 单宁酸 | 鞣制、锯木厂 |\n| 酒石酸 | 染色、葡萄酒、皮革、化工制造 |\n| 甲苯、挥发性有机化合物\
  \ (VOC) | 水力压裂 |\n\n来源：Bond 和 Straub (1974)。\n\n然而，铬并非对生物体最危险的金属。**镉、铅和汞**的毒性要大得多。这些金属对硫具有极强的亲和力，通过与酶中的硫基团形成键而破坏酶的活性。蛋白质的羧基（−CO₂H）和氨基（−NH₂）基团也会被重金属化学结合。镉、铜、铅和汞离子会结合到细胞膜上，阻碍细胞壁内的运输过程。重金属还可能使磷酸生物化合物沉淀或催化其分解。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_95_0.png)\n\n图 3.1 未经处理的工业废水排入河流。\n\n\
  ## 3.4.5 一些令人担忧的无机污染物\n\n氰根离子（CN⁻）可能是废水中各种无机物质中最重要的。氰化物是一种致命的有毒物质，在水中以 HCN 的形式存在，HCN\
  \ 是一种弱酸。氰根离子对许多金属离子具有强亲和力，例如与铁（II）形成毒性相对较弱的亚铁氰化物 Fe(CN)₆⁴⁻。易挥发的 HCN 毒性极强，曾在美国用于毒气室处决。氰化物在工业中应用广泛，特别用于金属清洗和电镀。它也是煤气厂和焦炉煤气及焦油洗涤器的主要排放污染物之一。氰化物在矿物加工操作中也有广泛应用。\n\
  \n氨是含氮有机废物分解的初级产物，它的存在通常指示此类废物的存在。氨是某些地下水来源的正常成分，有时也会添加到饮用水中，以去除游离氯的异味和气味。由于铵离子（NH₄⁺）的\
  \ pKₐ（酸电离常数的负对数）为 9.26，水中大部分氨以 NH₄⁺ 而非 NH₃ 的形式存在。\n\n硫化氢（H₂S）是含硫有机物厌氧分解的产物。它也是由微生物厌氧还原硫酸盐产生的，并作为气体污染物从地热水中释放出来。化工厂、造纸厂、纺织厂和制革厂的废水中也可能含有\
  \ H₂S。亚硝酸根离子（NO₂⁻）作为氮的中间氧化态存在于水中。在一些工业过程中添加亚硝酸盐以抑制腐蚀；在饮用水中，其含量极少超过 0.1 mg/l。亚硫酸根离子（SO₃²⁻）存在于一些工业废水中。硫酸钠常作为除氧剂添加到锅炉给水：\n\
  \n2SO₃²⁻ + O₂ → 2SO₄²⁻\n\n## 3.4.6 一些令人担忧的有机污染物\n\n工业源排放物含有各种各样的污染物，包括有机污染物。初级和二级污水处理工艺可以去除其中的一些污染物，特别是耗氧物质、油脂和固体。其他物质，如难降解有机物（有机氯、硝基化合物等）、盐和重金属，则无法被有效去除。肥皂、洗涤剂及相关化学品是有机污染物的潜在来源。目前归因于洗涤剂的大部分环境问题并非主要由表面活性剂引起，表面活性剂主要是改善水的润湿性能。在环境污染物中，引发最大担忧的是作为助调剂添加到复合钙中的聚磷酸盐。\n\
  \n生物难降解有机物是生物降解性差的物质，其中显著的是芳香族或氯化烃类（如苯、莰醇、溴苯、氯仿、樟脑、二硝基甲苯、硝基苯、苯乙烯等）。许多这些化合物也已在饮用水中被发现。被这些化合物污染的水必须使用物理和化学方法进行处理，包括汽提、溶剂萃取、臭氧氧化和活性炭吸附。\n\
  \n多氯联苯（PCB 化合物）于 1966 年首次被发现作为环境污染物，在全球范围的水体、沉积物以及鸟类和鱼类组织中均有发现。它们是通过在联苯芳香结构上取代 1\
  \ 到 10 个 Cl 原子制成的。这种取代可以产生 209 种不同的化合物（Rouessac 和 Rouessac 2007）。\n\n## 3.4.7 热污染\n\
  \n自科学界和监管机构正式认识到向受纳水体中排放大量热量具有造成生态危害的潜力以来，已经过去相当长的时间了。真正显著的热负荷来自于数量不断增加的蒸汽发电站以及同等规模的核反应堆的冷凝器冷却水排放。目前，大量电厂所需的冷却水比同等规模的化石燃料电厂多约\
  \ 50%（针对给定的温升）。热污染的程度取决于热效率，而热效率由排入冷却系统的热量决定。从热力学角度看，为了获得最大的效果并实现最佳的热效率，应在尽可能高的温度下输入热量，并在尽可能低的温度下排出热量。目前传统热电站公认的最大运行条件约为\
  \ 500°C 和 24MPa，对应的热耗率为 2.5 kWh，其中 1.0 kWh 用于发电，1.5 kWh 被浪费。已有电厂设计为 680°C 和 34MPa；然而，冶金问题使得运行条件保持在较低水平。\n\
  \n核电站在 250 到 300°C 的温度和最高 7MPa 的压力下运行，导致热耗率约为 3.1 kWh。因此，对于核电站，1.0 kWh 可用于有效生产，而\
  \ 2.1 kWh 被浪费。大多数蒸汽发电站以变化的负荷因子运行，因此加热排放随时间表现出巨大差异。因此，生物不仅受到温度升高或降低的影响，还受到突然或“冲击性”温度变化的影响。温度升高会导致受纳水体自净能力的显著降低，并导致不良藻类的生长（Krenkel\
  \ 和 Novotny 1980）。向受纳水体中加入加热的水可被视为等同于加入污水或其他有机废物，因为这两种污染物都可能减少受纳水体的氧气资源。此外，受纳水体中的温度升高可能导致不良的藻类水华（Hauser\
  \ 2018; USEPA 2018）。\n\n## 3.5 工业废水的变化\n\n### 3.5.1 污染负荷和浓度\n\n在大多数行业中，废水排放源自以下用水：\n\
  \n- 1) 卫生废水（来自洗涤、饮用等）\n- 2) 冷却（将多余热量排放到环境中）\n- 3) 工艺废水（包括用于制造和清洗产品的水，以及用于移除和运输废物和副产物的水）\n\
  - 4) 清洗（包括清洗和维护工业区产生的废水）\n\n\n\n\n除电力工业排放的大量冷却水外，城市地区的废水产生量在工业源和市政源之间大致均分。因此，工业用水会显著影响受纳水体的水质。工业来源的废水负荷水平随监管机构强制执行的水质目标的不同而显著变化。\n\
  \n通过许多可能的厂内改造、工艺调整和节水措施，可以显著减少工业废水负荷。最近废水减量的高达90%是由工业界采用诸如循环利用、操作改进、废水回用或更高效运行等方法实现的。通常，若不采取节水措施，工业废水的处理费用远高于厂内改造和剩余废水处理的总成本。工业废水排放通常变化很大，水量和水质的变化由槽液排放、操作启动与停机、工作时间分布等因素引起。在就某行业造成的污染影响得出结论之前，通常需要进行长期详细的调查。由于行业种类和污染物水平差异很大，我们只能呈现特征的一个概貌。不同工业废水排放中常规污染物（BOD5、COD、TSS）和pH的典型浓度值见表3.3。非常规污染物的类似抽样见表3.4。\n\
  \n### 3.5.2 工业预处理\n\n工业废水可能含有常规污水处理无法去除的污染物。此外，与生产周期相关的工业废水流量变化可能会扰乱生物处理单元（如活性污泥法）的种群动态。因此，工业废水可能对市政系统构成严重危害，因为收集和处理系统并非为输送或处理这些废水而设计。\n\
  \n受到严格监管的工业废水在排入下水道之前，通常至少要在工厂内进行预处理（若非完全处理），以降低污染物负荷。通过使用经证明的处理技术和促进回收利用的制造实践，工业界可以在废水排放前去除或消除污染物。这种做法称为工业废水处理或预处理。\n\
  \n预处理计划是美国环保署（USEPA）国家污染物排放消除系统（NPDES）计划的一个组成部分。它是联邦、州和地方环境监管机构为保护水质而建立的合作努力。类似于USEPA授权州、部落和领地政府执行NPDES许可证计划，对排放到地表水的行为执行许可、行政和执法任务（NPDES计划），EPA和经授权的NPDES州预处理计划批准地方政府对排放到市政公有处理厂（POTW）的行为执行许可、行政和执法任务。处理厂（按《清洁水法》（CWA）第212条定义）由州或市政当局拥有（按CWA第502(4)条定义）。该定义包括用于储存、处理、循环利用和回收液态性质的市政污水或工业废物的任何装置或系统。它还包括下水道、管道或其他输送设施，但前提是它们将废水输送到POTW处理厂。\n\
  \n国家预处理计划确定了适用于排入POTW的非生活废水来源的具体排放标准和规定。通过在工业界减少或消除废物（“源头削减”），更少的有毒污染物被排放到POTW并接受其处理，这对POTW和工业用户都有好处。该计划的监督由POTW、州或EPA负责。控制管理机构颁发向POTW排放工业废水的许可证。许可证包含受控污染物的数值限值以及采样、流量测量、实验室测试和报告的要求。\n\
  \n### 表3.3 工业废水常规污染物的相对浓度\n\n| 废物类型 | BOD5 (mg/l) | COD (mg/l) | TSS (mg/l) | pH\
  \ |\n|---|---|---|---|---|\n| **服装** | | | | |\n| 棉 | 200–1000 | 400–1800 | 200\

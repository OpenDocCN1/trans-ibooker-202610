  ## 9.5.3.2 AC 与再生焦


  AC 是一种通过蒸汽活化（约 900 °C）生产的碳质材料。它具有很高的抗磨损和抗压机械强度。其表面积为 150–300 m²/g，小于传统活性炭，但比冶金煤高不了多少。AC
  呈片剂或杏仁状，通常比活性炭大得多。AC 生产更容易，成本也更低。图 9.15 展示了 AC 的内部模型及其孔隙结构。图 9.16 显示了汞蒸气去除效率随时间的变化。


  ## 9.5.3.3 AC 的热再生


  在再生器加热段的温度下，吸附的硫酸、硫酸铵和硫酸氢铵会分解为 SO₂。AC 颗粒通过锁斗进入，并与脱附气体和 N₂ 载气形成重力逆流。富含 SO₂、CO₂、N₂
  和 H₂O 的富硫气体从再生器出口进入酸厂，反应如下：


  H₂SO₄* + ½ C → SO₂ + ½ CO₂ + H₂O


  (NH₄)₂SO₄* → SO₃ + NH₃ + 2H₂O


  NH₄HSO₄* → SO₃ + 2NH₃ + 2H₂O


  3SO₃ + 2NH₃ → 3SO₂ + 3H₂O + N₂


  （*表示吸附物种；非等温脱附动力学在 300 °C 时达到峰值速率，至 450 °C 完成）。



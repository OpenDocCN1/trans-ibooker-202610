  ## 9.8 纸浆和造纸厂的化学品回收与动力/蒸汽热电联产


  ### 9.8.1 纸浆和造纸工业


  纸浆和造纸工业是世界上最大的工业之一，也是许多国家重要的就业来源。可持续管理的纸浆和造纸工业可以为当地经济和人民带来诸多好处，尤其是在农村地区。该工业以北美、北欧和日本等东亚国家为主。拉丁美洲和大洋洲也有重要的纸浆和造纸工业。预计在未来几年，印度和中国将成为该工业增长的关键。


  纸浆和纸主要由来自天然森林或纸浆材种植园的木材纤维制成。回收纤维以及其他纤维来源（如农业残留物）也被利用，并且回收纤维在纸浆和造纸中的使用越来越普遍。现有两种在工艺上差异很大的重要制浆技术，即机械制浆和化学制浆。欧盟约30%的纸浆总产量来自机械制浆，其余通过化学制浆生产（Das
  2005；Das和Houtman 2004；瑞典森林署2008）。北美拥有重要的纸浆和造纸工业；约21%的纸浆总产量来自机械制浆，其余为化学制浆。


  生产漂白硫酸盐浆的纸浆厂每生产1吨纸浆会产生1.7–1.8吨黑液（以干物质计）。因此，黑液代表了每座工厂250–500兆瓦的潜在能源。由于现代硫酸盐浆厂有能源盈余，它们可能成为未来能源系统中可再生燃料的关键供应者。如今，黑液是生物质能最重要的来源。因此，将黑液中的一次能源转化为高价值的能源载体具有重大意义。表9.7给出了几种主要燃料的相对年产量（Farmer和Sinquefield
  2009）。与生物燃料和化石燃料相比，黑液的一个关键优势是它已经在工厂内；处理基础设施已经存在，并且没有收集和运输成本。



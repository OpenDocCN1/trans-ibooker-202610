  # 10.6 六大核心特征


  Tueth（2010）重申了 Paul Hawken（*《商业生态学》* 和 *《自然资本主义》*）、Bill McDonough 和 Michael Braungart（*《从摇篮到摇篮：重塑我们制造事物的方式》*）以及
  Janine Benyus（*《仿生学》*）等作者提出的观点，他提出一个成熟且真正的可持续企业包含六大核心特征。


  ## 1) *三重顶线（TTL）价值创造*


  “TTL 确立了可持续商业活动的三个同时 *要求* —— 公司获得财务收益、自然世界得以改善，以及员工和当地社区成员获得社会优势 —— 这三者被视为地位平等。”
  与许多企业使用的三重底线相比，“三重顶线”强调初始设计的重要性，是一个可归因于 Braungart 和 McDonough（2002）的术语。


  ## 2) *仿生学 – 基于自然的知识和技术*


  “这一基于仿生学的原则涉及有意识地模仿自然世界的精妙之处，以种植我们的食物、利用我们的能源、建造事物、开展业务、治愈自身、处理信息和设计我们的社区”（Benyus
  1997）。


  ## 3) *服务型产品与消费型产品*


  “*服务型产品* 是客户常规租赁的耐用品，由技术材料制成，使用完毕后退回制造商并再加工成新一代产品。（这些产品对人类和环境健康大多无毒，但所使用的有毒材料将被置于封闭循环型系统中，无法逸入环境）。*消费型产品*
  是仅由可生物降解材料制成的寿命较短的物品。产品失去用途后会被分解者生物体分解。（这些对人类或环境健康也无害）。这一原则要求我们只制造这两种类型的产品，并需要在技术进步允许的情况下，逐步但持续地减少服务型产品，并用消费型产品取而代之”（Braungart
  和 McDonough 2002）。


  ## 4) *太阳能、风能、地热能和海洋能*


  “这一原则主张只采用可持续的能源技术——太阳能、风能、海洋能和地热能——这些技术能够在不产生对地球生命负面影响的情况下无限期满足我们的能源需求。” 其他作者将其称为利用当前的太阳收入（Hawken
  1999）。


  ## 5) *地方型组织和经济*


  “这一要素包括拥有耐用、美丽和健康的社区，拥有当地所有和运营的企业以及当地管理的非营利组织，以及与区域公司和股东一起在密集的伙伴关系和协作网络中共同工作”（Tueth
  2010）。


  ## 6) *持续改进过程*


  “成功组织的内部运营流程包括为公司开展业务时不断进步和升级提供保障。持续的监测、分析、重新设计和实施过程被用来随着条件变化和新机遇出现而强化 TTL 价值创造”（Tueth
  2010）。


  企业可持续性还要求企业遵守上述可持续发展原则（WCED 1987）。因此，要使工业发展更可持续，就必须在宏观层面解决重要问题，例如经济效率（创新、繁荣、生产力）、社会公平（贫困、社区、健康和福祉）、人权以及环境问责（气候变化、土地利用和生物多样性）。有许多最佳实践促进企业可持续性，并帮助组织从落后者走向领先者。这些实践包括以下内容：


  - 利益相关者参与：组织可以从客户、员工及其周边社区学习。参与不仅是传播信息，还包括理解反对意见、寻找共同点，并让利益相关者参与联合决策。

  - 环境管理体系：这些体系提供了结构和流程，帮助将环境效率嵌入企业的文化并减轻风险。全球最广为人知的标准是 ISO 14001，但还存在许多其他行业特定和国家特定的标准。

  - 报告与披露：衡量和控制是建立可持续实践的核心。组织不仅可以收集和整理信息，还可以对外部完全透明。全球报告倡议是众多规范的报告标准中的一个例子。

  - LCA：希望取得长足进步的组织应通过 LCA 系统地分析其使用和生产的产品、流程或活动或服务的环境和社会影响，LCA 可更准确地衡量影响（Das 2005d）。


  # 10.7 社会服务


  组织通过员工志愿服务或慈善捐赠回馈社区，通常被认为具有社会可持续性。组织还可以通过培训员工并为社区年轻成员提供实习机会来鼓励社区教育。这些做法提高了社区的教育水平和生活质量。为了使企业真正可持续，它必须维持的不仅是必要的环境资源，还包括其社会资源，包括员工、客户（社区）及其声誉（Earth
  Charter Principles 2019；Hahn 2008）。


  # 10.8 环境监管法：命令与控制、市场导向和反思型


  环境法和政策至关重要且极富魅力。只要想象一下，如果没有联邦对空气和水质、农药使用以及固体和危险废物处置的监管，今天的美国会是什么样子，就能看出其重要性。尽管国家在解决环境问题方面已取得很大进展，但在环境可持续性方面仍有许多工作要做。联邦和州法律仅开始解决全球气候变化、点源和非点源水污染、环境和室内空气污染、地下水污染和地下水枯竭以及渔业崩溃等重要环境问题。科学不确定性、市场失灵、风险权衡、认知偏差和根本性的政策分歧使得就许多这些剩余问题达成解决方案变得极其困难。诸如控制全球变暖气体排放、气候变化、臭氧层破坏和跨境废物处置等国际污染问题需要与其国内对应问题相整合。此外，关于
  WTO、GATT 和 NAFTA 的日益有争议的贸易与环境辩论，以及国际危险化学品贸易问题也需要探讨。环境法和政策已经摘到了低垂的果实。剩余的问题仍然挑战着即使是最睿智和最有耐心的政策专家（Salzman
  和 Thompson 2010）。


  Orts（1995）列出了三种环境监管法律类型：命令与控制、市场导向和反思型。这三种监管类型都旨在保护环境，但每种都通过强化和从属于不同的伦理和经济价值观及关系来实现。


  命令与控制法为污染设定标准，并对超过标准的公司处以罚款和处罚。从监管者的角度来看，这种监管可以被视为严格执行公众对清洁环境渴望的伦理授权。然而，从企业家的角度来看，这种监管可能具有压迫性和不切实际性，并侵犯了企业管理者和所有者的自由。Orts
  提出了对命令与控制环境法方法的四点反对意见。


  - “命令与控制过于依赖行政机构，而这些机构容易受到政治影响。” 例如，如果总统任命不关心环境的主管，环境保护可能会严重削弱。

  - “命令与控制过于静态。” 技术在变化，监管机构无法跟上步伐。另一个问题是如何设定污染的适当标准。我们如何知道什么是正确的污染量？

  - “命令与控制变得过于复杂和难以管理。” 监管机构不断出台更多规则，以至于几乎不可能跟踪它们。

  - “命令与控制过于严厉和惩罚性。” 它不是奖励和鼓励良好的环境行为，而是惩罚不良的环境行为。


  Orts（1995）指出，在某些情况下，命令与控制法规是合适的。例如，如果我们处理的是汞等高毒性物质，这种物质在极小剂量下就能杀死人类，那么保护人类生命的价值显然超过了我们将汞处置在垃圾填埋场或水道中的自由。在其他领域，例如控制燃煤发电厂的排放，Orts
  指出命令与控制方法已让位于市场导向方法。这种方法强化了自主和自由的价值，但也存在局限性。Orts 对四个问题提出了担忧。


  1) “污染收费和税收。” 公司必须为污染环境的特权付费。这可以使市场更有效率。这种方法的一个问题可能是如何确定适当的收费和税率水平。

  2) “将自然环境纳入财产权。” 如果我们能为濒危环境界定财产权，我们就可以利用现有的控制手段，如法院，来保护环境。不幸的是，一些环境问题，如空气污染，并不容易以财产权的形式重新表述。

  3) “可交易的污染权。” 公司可以在公开市场上交易其购买的污染权，从而允许



  环境可持续发展（CPHA 1992）。什么才构成社会可持续发展？有人认为它是满足


  -   食物、住所、教育、工作、收入以及安全的生活和工作条件等基本需求；

  -   公平，确保发展的利益在社会各界公平分配；

  -   增强，或至少不损害人口的身体、精神和社会福祉；

  -   促进教育、创造力和全民的人类潜能发展；

  -   保护我们的文化和生物遗产，从而加强我们与历史和环境的联系感；

  -   促进相处融洽，人们和谐共处并相互支持；

  -   民主，促进公民参与和参与，以及

  -   可宜居，联系“城市公共场所的形式与城市居民的社会、情感和身体福祉。”


  我们为实现这些目标而建立的制度和流程可以被视为社区的“软基础设施”，这一术语由加州大学伯克利分校公共卫生学教授兼城市规划学教授 Len Duhl 提出，用来描述社区中促进社会福祉的要素。这种“软”基础设施包括正式的人类服务（健康、教育、社会服务、休闲和文化等），以及社区的非正式结构——由志愿组织和社会关系组成的网络即社区。城市规划需要将其这些要素整合到其所有工作中，对软基础设施给予与硬基础设施同等的重视，如果我们要创造一个运作良好的社区。


  ## 10.13 结论


  -   LCA 是表征产品、工艺或活动环境可持续性的有效工具。

  -   工业生态学和零排放是未来许多制造业、化学及相关工艺的关键方法论。生态工业园区能够交换废物和材料的能力核心在于能够将前废物制备用于其他用途的转化或分离技术。

  -   对环境的未来关注将会增长，资源将变得更加稀缺且不可靠，对质量和成本竞争力的需求将会增加。为应对这些挑战，需要一种新的商业和工业组织范式，将多样化的个体社区、企业和其他利益相关者聚集在一起，考虑如何共同更明智地使用资源。

  -   希望，也许是要求，这个不断演进的世纪的可持续经济将以产品材料和能源含量的节约和减少以及其知识含量的增加为特征。

  -   企业和政府面临的挑战将是确保持续的经济发展在环境、生态、伦理和社会上都是可持续的。政府需要指导的领域包括改变消费和生产模式；对文化多样性和传统的欣赏；健康社会系统的开发；以及对可持续性和可持续发展的广泛教育和意识。

  -   一些专家已将可持续发展描述为二十一世纪工业的主要驱动力。工程师、科学家、企业和行业所有者、律师、政府和政策制定者以及教育工作者将在这一事业中发挥关键作用。

  -   可持续性和可持续发展是一段旅程，而非终点。


  ### 10.13.1 商业


  最广泛接受的企业可持续性标准构成了一个公司对自然资本的高效利用。这种生态效率通常被计算为公司创造的经济价值与其总体生态影响之比。这一概念由 WBCSD 普及，其定义如下：“生态效率是通过提供满足人类需求并带来生活质量的具有竞争力的商品和服务来实现的，同时在整个生命周期中逐步减少生态影响和资源强度，使其至少与地球承载能力保持一致”（DeSimone
  and Popoff 2000）。与生态效率概念相似但迄今探索较少的是企业可持续性的第二个标准。社会效率描述了公司价值增值与其社会影响之间的关系。尽管可以假设大多数公司对环境的影响是负面的（除极少数例外，如植树），但这对社会影响并不成立。这些影响可以是正面的（例如企业捐赠、创造就业）或负面的（例如工伤事故、员工欺凌、人权侵害）。因此，根据影响类型，社会效率要么试图最小化



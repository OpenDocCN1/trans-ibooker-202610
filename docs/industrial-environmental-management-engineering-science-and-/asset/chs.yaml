- "## 工业废水、空气污染以及固体废物与危险废物\n\n监测、许可、样品采集与分析、质量控制/质量保证、遵守州法规及联邦标准\n\n### 4.1 引言\n\n\
  本章描述并探讨了选择最佳污染物修复控制技术、废物管理、监测、工业水、空气、固体废物及危险材料的采样与分析、样品采集方式、由政府机构批准的多种分析、物理化学方法对样品进行分析、质量控制\
  \ (QC) 和质量保证 (QA)、实验室审计、测试、监测、许可、记录保存、报告，以及遵守地方、州和联邦政府关于排放废水、排放空气污染物和安全处置固体废物及危险材料的规定。\n\
  \n### 4.2 工业过程水\n\n在工业过程中，过程水质量的控制可能对产品最终质量至关重要。水常用作试剂的载体，必须持续监测试剂在产品中的损失，以确保以正确的比率进行补充。所测量的参数具体取决于正在使用的工艺以及可能作为副产品产生的任何预期污染物。这可能包括在无机化学工艺中，由于机器油污污染而出现的非预期有机化学品。监测从工业场所排放的废水质量是控制和减少环境污染的关键因素。在此类应用中，监测系统分析过程中产生的所有可能污染物，特别是那些对环境可能有特别不利影响\
  \ 的污染物，如氰化物以及许多有机物质（如农药）(USEPA 1973)。在核工业中，分析\n\n集中在特定的同位素或感兴趣元素上。如果核工业向有饮用水取水点的河流排放废水，那些可能有害或具有长半衰期的放射性同位素，例如氚，将成为常规监测套件的一部分。\n\
  \n取决于工业类型，过程水的特性，包括物理、化学和生物特性，在操作期间可能会因故障、溢出、地面冲洗、换班及其他原因而发生变化。由于废水潜在的可变性，与市政进水和水质的采样和分析相比，过程水的采样频率、样品类型（例如瞬时抓取或连续采样）、采集位置、采样和分析通常需要更仔细地关注细节。\n\
  \n采样和分析的目的是记录峰值负荷浓度、峰值负荷持续时间或全天内的变化发生情况。\n\n### 4.3 水质分析中的常见元素、基团和化学物质\n\n表4.1列出了水和废水技术中常见元素名称及其符号、原子量、常见价态和当量。某些原子组合在许多不同的分子中作为单元共同作用；这些被称为基团，具有特定的名称，例如羟基\
  \ (OH⁻)。最常见的离子形式基团列于表4.2中。基团本身不是化合物，但它们与其他元素结合形成化合物。表4.3给出了水和废水化学中常见无机化合物的数据。所有化合物的正确名称、公式、分子量和当量均包括在\n\

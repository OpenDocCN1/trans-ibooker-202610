  \ 加仑范围内，而在华盛顿东部，水费更高，如果经济上可获得的话。\n\n对于非电厂应用，当地电价高昂时，可通过寻求替代能源来源来克服。盐水浓缩器厂中压缩机（主要耗能用户）已安装蒸汽驱动或天然气（通过天然气发动机）驱动的设备。表\
  \ 7.6 提供了典型运行成本的 breakdown（Dalan 2005；Haussman and Rosain 1996）。\n\n对于现有设施，在以下情况下安装零排放厂是有意义的\n\
  \n- 排放许可条件发生变化，导致现有设施无法经济运行\n- 水权成本加上处理费超过零排放设施的运行成本\n\n最后一点由一个迷你案例研究说明。\n\n## 迷你案例研究\n\
  \n## 零排放系统投资回报计算\n\n一座电厂在厂后有 300 gpm 的排放。初步估算显示，零排放厂的运行成本为 $4.55/1000 加仑。地方公用事业将水费和处置费提高到\
  \ $3.00/1000 加仑，工厂总成本为 $6.00/1000 加仑。\n300 gpm 蒸馏流量容量的资本成本约为 $7.5 百万美元（Dalan 2005）。年度节省为\
  \ ($1.45 × 300 × 1 440 × 365)/1 000，或 $228 636/年。这代表了一个简单投资回报率为 3%，简单投资回收期为 32 年的项目。\n\
  \n## 7.9 将处理过的市政废水用作电厂冷却系统补水：三级处理 vs. 循环水水质管理的扩展化学处理方案\n\n### 7.9.1 引言\n\n每天，美国的水冷热电厂从河流、湖泊、溪流和含水层中抽取\
  \ 60 亿至 1700 亿加仑的淡水，其中消耗 28 亿至 59 亿加仑。热电生产中用于冷却的淡水取水量约占所有取水量的 40%，\n\n与农业灌溉的取水量基本相同，如美国地质调查局所记录。全国持续的干旱凸显了使用处理过的市政废水（MWW）用于电力发电冷却的迫切需要。它需要大量水用于电力生产，以在电厂蒸汽系统中冷凝蒸汽。空气冷却是可能的，但成本更高且效率更低。水将继续成为新建热电厂的首选冷却剂（Dzombak\
  \ 2013）。\n\n项目动机：电力需求的增加带来了冷却所需水的增加。热电厂的冷却占美国所有淡水取水量的 41%，即大约与农业灌溉取水量相同。美国一些地区几乎没有或没有淡水可用。新的电力生产需要替代水源。美国能源部一直在进行并赞助研究，以调查使用替代水源用于电厂冷却的可行性和成本，尤其是在循环冷却系统中，这在美国大多数新建电力生产中是必需的。\n\
  \n项目目标和亮点：处理过的 MWW 是美国热电厂循环冷却系统补水的常见且广泛可用的替代水源，这是在项目团队由 DOE 开展的前期项目（2006–2009）中确定的。然而，处理过的废水中的可生物降解有机物、氨氮、碳酸盐和磷酸盐分别对增强生物污损、腐蚀和结垢构成挑战。本研究的总体目标是评估在循环冷却系统使用前对二级处理\
  \ MWW 进行三级处理的好处和 LCC。\n\n该研究包括三种不同三级处理 MWW 的 bench- 和 pilot-scale 实验研究，以及各种三级处理方案的\
  \ LCC 和环境分析。还评估了将处理过的废水再用于电厂冷却系统的可持续性因素和指标。研究的三种三级处理废水为：二级处理 MWW 经酸添加进行 pH 控制（MWW_pH）；二级处理\
  \ MWW 经硝化和砂滤（MWW_SF）；以及二级处理 MWW 经硝化、砂滤和 GAC 吸附（MWW_NFG）。\n\n确定三级处理对于实现二级处理 MWW 在电厂冷却系统中使用所需的腐蚀、结垢和生物污损控制是必不可少的。特别是，与二级处理废水相比，发现三级处理废水显著提高了控制结垢的能力。MWW_pH\
  \ 处理水（调整至 pH 7.8）在减少结垢形成方面有效，但它增加了腐蚀和实现适当生物污损控制所需的杀生物剂用量。然而，腐蚀可以通过甲苯三氮唑添加（4–5 ppm\
  \ TTA）得到充分控制，这对于所有三级处理水都是如此。对于 MWW_NF 处理水，通过硝化去除氨有助于降低腐蚀性和杀生物剂需求。额外的 GAC 吸附处理，MWW_NFG，未产生净效益。对于所有三级处理，生物污损控制是可实现的，且最有效的是预成单氯胺（2–3\
  \ ppm），与 NaOCl 和 ClO2 相比。\n\n与二级处理废水相比，废水。MWW_pH 处理水（调整至 pH 7.8）在减少结垢形成方面有效，但它增加了腐蚀和实现适当生物污损控制所需的杀生物剂用量。然而，腐蚀可以通过甲苯三氮唑添加（4–5\
  \ ppm TTA）得到充分控制，这对于所有三级处理水都是如此。对于 MWW_NF 处理水，通过硝化去除氨有助于降低腐蚀性和杀生物剂需求。额外的 GAC 吸附处理，MWW_NFG，未产生净效益。对于所有三级处理，生物污损控制是可实现的，且最有效的是预成单氯胺（2–3\
  \ ppm），与 NaOCl 和 ClO2 相比。\n\n对实验研究的三级处理系统以及其他几种处理方案进行了 LCC 分析。为此开发了一个公共领域的概念成本工具（LC3\
  \ 模型）。MWW_SF（石灰软化和砂滤）和 MWW_NF 在考虑的三级处理替代方案中是最具成本效益的处理方案，因为其出水水质较高且基础设施成本适中，且所需调质化学品剂量相对较低（Dzombak\
  \ 2013）。\n\n进行了生命周期清单（LCI）分析，并整合了排放物的外部成本与 DC，以评估三级处理替代方案建设和运行相关的环境排放和外部成本的相对情况。综合\
  \ LCI 和 LCC 分析表明，MWW_MW 和 MWW_SF 替代方案表现出中等外部影响成本，且基础设施和化学调质剂投加量适中，这使得它们（尤其是 MWW_NF）成为更好的处理替代方案，从环境可持续性角度来看，因为它们对排放造成的环境损害贡献最小（Dzombak\
  \ 2013）。\n\n### 7.9.2 关键要点\n\n- 1) 本研究采用了全面、综合的方法，通过研究采用处理过的 MWW 作为补水水的循环冷却系统中水质控制问题的所有方面，并以综合方式确定了三级处理的最佳方法，同时考虑了替代水处理/管理方法的直接经济成本和环境影响。\n\
  - 2) 该工作除了实验室和建模工作外，还与一家 MWW 处理设施合作，在现场进行了 pilot-scale 演示。\n- 3) 关于原创性和创新性，本研究是公共领域中第一个全面研究水质控制问题的研究\n\
  \n\n\n\n\ndomain of the use of treated MWW as makeup water in recirculating cooling\
  \ systems of electric power plants.\n\n+   4) 使用处理后的 MWW 作为电力厂循环冷却系统补水面临诸多挑战，包括在采用低质量补水水的循环冷却系统中控制腐蚀、结垢和生物污堵的技术挑战；在水在循环冷却系统中浓缩四倍或更多倍的复杂运行环境中确定资本和运行成本的挑战；以及评估将处理后的废水用作冷却系统补水水的环境和社会风险与效益的挑战。这是一个复杂的问题，且因所涉及的经济、社会接受度和可持续性问题而更加复杂。\n\
  \n+   5) 在没有新的淡水来源的地区，需要替代水源用于新的电力生产。我们的研究将有助于推动在电力生产中使用处理后的 MWW，从而有助于促进经济发展。此外，在本研究中，我们通过在考虑直接经济成本的同时考虑环境影响和社会接受度因素，明确评估了各种水处理/管理替代方案的相对可持续性。\n\
  \n## 7.9.3 世界首个零排放纸浆厂梅多湖：闭环概念\n\n耗资 2.5 亿美元的 Millar Western Meadow Lake Mill 位于萨斯喀彻温省萨斯卡通西北约\
  \ 200 英里、占地 247 英亩的厂址上。它使用机械作用辅以温和化学品将杨木屑加工成漂白化学机械浆（BCTMP），年产量约 240 000 吨。比硫酸盐法更高效，这种方法用一半的树木生产相同量的纸浆，在无水基础上每吨木材可生产近一吨纸浆。Millar\
  \ Western BCTMP 工艺还消除了氯化合物和有气味的硫基浸渍化学品。该环保型纸厂使用过氧化氢提高纸浆亮度，使其适用于印刷和书写等级纸张以及卫生纸和纸巾。该厂是世界上首家成功运行零液体排放系统的纸浆厂。热机械制浆工艺的废水由三个降膜蒸汽压缩蒸发器从\
  \ 2% 固体浓缩至 35% 固体，然后由两个蒸汽驱动浓缩器进一步浓缩\n\n其将废水进一步浓缩至约 70% 固体。送入系统的 1760 加仑/分钟废水中，1720\
  \ 加仑被回收为高纯度水用于制浆工艺再利用。固体埋入锅炉；熔块铸成锭并存放在现场以备将来化学回收。20 世纪 90 年代初，Millar Western Pulp（Meadow\
  \ Lake）Ltd. 宣布计划在萨斯喀彻温省北部建设一家纸厂时，当地社区担心其会产生污染，尤其是排放到比弗河的废水。尽管纸厂计划的生物处理系统会使废水比河水更清洁，Millar\
  \ Western 还是更进一步，决定消除纸浆厂的所有废水排放。梅多湖的零排放系统是世界上首个此类系统。蒸发器系统是水回收过程中的关键设备，由 Resources\
  \ Conservation Company 设计并供应（Fosberg 1992）。所有从工厂流出的废水都在水回收厂进行处理。因此，工厂仅需约 300 gpm\
  \ 的补水来补充因蒸发而损失到大气中的水。没有水回收厂的同类纸厂需要约 2500 gpm 的原水补水。废水处理系统于 1992 年 1 月启动，当时工厂投产。Millar\
  \ Western 的 Meadow Lake BCTMP 纸厂是机械纸浆厂成功实现水循环闭合的范例。加拿大此前曾尝试通过将漂白厂废水循环回硫酸盐化学品回收工艺来关闭硫酸盐厂，但由于腐蚀性物质的积累而失败（Smook\
  \ 1992）。因此，有必要详细研究梅多湖的先进系统。梅多湖 BCTMP 工艺产生的废水排放速率接近 1800 gpm。温度为 150 °F，pH 约为 8，含有约\
  \ 20 000 ppm 溶解固体。图 7.5 显示了系统的水回收部分的更详细视图，由五个阶段组成：澄清、蒸发、浓缩、汽提和焚烧。\n\n### 7.9.3.1\
  \ 澄清\n\n接收纸浆厂废水的第一个单元操作是浮选澄清器。由于去除纤维对蒸发器性能非常重要，工厂决定安装两个澄清器而不是一个。这可以实现最大去除效率和灵活性。添加化学品以促进固体絮凝和浮选。为确保纸浆厂的波动不会直接影响蒸发器，在线仪表测量澄清器接受流中的悬浮固体。当悬浮固体超过\
  \ 900 ppm 时，澄清器接受物被导向沉淀池。澄清器接受物在冬季通常直接进入蒸发器以节约热量。\n\nback end of the mill. 干净冷凝水的平衡部分进入蒸馏液均化池，在那里与来自梅多湖的补水混合并作为工厂的冷水供应。含有挥发性有机物的污冷凝水在蒸汽汽提器中汽提后重复使用。蒸汽汽提器顶部产品（含有浓缩有机物）被焚烧。\n\
  \n### 7.9.3.3 浓缩\n\n与三个蒸发器一样，两个浓缩器也是垂直管降膜设计。与使用蒸汽压缩机驱动系统不同，浓缩器使用回收锅炉产生的蒸汽运行。浓缩器中的操作过程与蒸发器中的基本相同，但废水被进一步浓缩至约\
  \ 67% 固体。浓缩废水在回收锅炉中焚烧。首台浓缩器将液体从 35% 浓缩至 50%，而末台浓缩器将固体从 50% 浓缩至 67%。\n\n### 7.9.3.4\
  \ 汽提\n\n污冷凝水仅占总冷凝水的约 10%，在填料塔汽提器中去除挥发性有机化合物。由于蒸发器加热元件内置的冷凝物分离功能，VOC 选择性地富集在污冷凝水中。来自浓缩器的工艺蒸汽被送至再沸器，从部分被汽提的冷凝水中产生汽提蒸汽。被汽提的冷凝水与干净冷凝水混合并在工厂中重复使用。浓缩的\
  \ VOC 以浓缩蒸汽的形式在回收锅炉中焚烧。\n\n### 7.9.3.5 焚烧\n\n在回收锅炉中，废水的有机成分被焚烧，该过程还产生蒸汽以运行浓缩器。废水中的无机化学品在锅炉熔块中回收，铸成锭并存放在现场。该厂正在考虑回收碳酸钠，然后将其转化为氢氧化钠，这是\
  \ BCTMP 工艺中使用的主要化学品。\n\n## 7.9.4 零排放计划的成功实施\n\n1996 年 7 月，位于密西西比河西岸的一家造纸公司启动了一项计划，以消除向河流排放工业废水。由泵、缓冲罐和过滤系统组成的废水回收系统使排放量减少了\
  \ 99%。成功的\n\n污染预防包括每年消除 5.62 亿加仑废水、149 000 磅总悬浮固体和 57 000 磅生化需氧量。该厂主要生产彩色建筑级纸张，由二次纤维、石磨木浆和硫酸盐浆混合而成。\n\
  \n该公司启动了零排放计划，Klinker（1996）对此进行了详细描述，具有两个目标：\n\n+   1) 消除向密西西比河排放废水。\n+   2) 提高制造用水效率，减少工厂对河水的依赖。\n\
  \n将处理后的废水循环回工厂供水系统将实现这些目标。\n\n除了废水再利用的监管动机外，公司还担心向工厂供水流量周期性中断。位于上游的当地电力公司水电站造成了这些中断。有时，公用事业公司通过停止通过运河的水流来降低河流水位，该运河还为造纸厂从密西西比河输送水。当这种情况发生时，工厂必须停止生产过程，直到有足够的水量运行工厂。通过重复使用废水，公司可以减少对河水的依赖并避免对生产的这种干扰。\n\
  \n零排放计划的核心是工厂内的闭环废水回收系统，不仅提供环境效益，还因制造中使用的回收废水量增加以及解决这些问题相关的费用而产生困难。\n\n### 7.9.4.1\
  \ 闭环\n\n图 7.6 是公司闭环废水回收系统的示意图。在零排放计划开始之前，密西西比河为工厂提供所有工艺和冷却用水。来自河流的淡水进入工厂，经过细网筛后进入\
  \ 2700 加仑淡水罐。厂内泵将其输送至工厂的工艺和冷却用水需求点。\n\n由此产生的工艺废水在公司拥有的活性污泥废水处理厂进行处理。排放通过指定为排放口 01\
  \ 的工艺废水排放口进行。冷却废水排放位于排放口 02。废水污泥在带式压滤机上脱水，然后在公司拥有的农业用地进行土地施用。\n\n在零排放计划之前，该厂每天平均向河流排放\
  \ 607 000 加仑工艺废水和 114 万加仑冷却废水。通过\n\n\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_359_0.png)\n\
  \n**Figure 7.6** 零排放系统造纸厂和纸浆厂闭环回收系统的示意图。\n\n利用闭环系统将增加量的处理后废水泵入淡水箱，该厂能够声明其工艺用水和冷却水几乎完全由\
  \ 100% 回收废水组成。排入河流的废水总量减少了 82%（Klinker 1996）。\n\n再生水可以提供与更昂贵的自来水相同的性能。随着世界各地水资源的日益珍贵，工业用水再利用预计将扩大（DaSilva\
  \ and Goodman 2014）。\n\n## 7.9.5 结论\n\n美国造纸和纸浆工业通过创新技术和工艺改造，在减少用水量和增加水回收与再利用方面取得了重大进展。一些工厂实施了“闭环”工艺，并证明了成功的零排放漂白厂系统。2001\
  \ 年 4 月 15 日开始适用的 EPA 集群规则的影响尚未完全显现。然而，可以合理预期，旨在减少空气和水污染的联邦法规的新联系，将导致未来十年或二十年内加工水回收、工厂内再利用以及水、空气和固体废物领域的污染预防和零排放水平进一步提高。随着减少工厂用水、化学品和能源使用的技术不断进步，其他化学工业，如造纸和发电行业，越来越多地采用再生水用于广泛的用途：从工艺用水、锅炉给水和冷却塔使用到冲洗厕所和场地灌溉。当前技术可生产\n\
  \n## 7.10 脏空气的后果：成本-效益\n\n氮氧化物（NOₓ）、二氧化硫（SO₂）、挥发性有机化合物（VOCs）和汞以及二氧化碳（CO₂）的排放，以及更热的气候，正在破坏公共健康、环境和整体州经济。美国空气质量最差的地方在加利福尼亚，该州以提高环境标准、削减温室气体排放和对抗气候变化而闻名（加州空气资源委员会最佳可行控制技术指南\
  \ 2000）。根据美国肺脏协会“2017 年空气状况”报告，加利福尼亚的臭氧水平是任何州中最高的，该报告根据臭氧和颗粒物污染水平分析了全国各县。加利福尼亚的情况在稳步改善，但该州仍落后于美国其他地区。三个加州县——洛杉矶-长滩、贝克斯菲尔德和弗雷斯诺-马德拉——的烟雾水平在全国最差。据美国肺脏协会称，加州超过\
  \ 90% 的居民生活在空气不健康县（见图 5.2）。\n\n为什么加州的臭氧问题如此极端？\n根据美国人口普查局的数据，加州人口迅速增长，从 1960 年的\
  \ 1580 万增加到 2016 年的 3920 万。像洛杉矶这样的大城市以汽车出行设计为主。此外，臭氧是在阳光将氧分子分解时自然产生的——这意味着加州的阳光加剧了其现有的烟雾问题。\n\
  \n### 7.10.1 公共卫生\n\n全国范围内，该报告发现近十分之四的美国人生活在空气污染水平经常危险的地区。但总体而言，暴露于不健康空气污染水平的美国人数量降至约\
  \ 1.25 亿人，低于去年报告中的 1.66 亿人（涵盖 2012 年至 2014 年期间）。\n空气污染可导致哮喘发作、心力衰竭、肺癌、生殖危害和过早死亡。全球范围内，世界卫生组织称每年有\
  \ 300 万人因呼吸污染空气而过早死亡，儿童尤其处于高风险。空气中的汞落入河流和河口，污染淡水和咸水鱼类种群。汞化合物在食物链中生物累积，使旗鱼、鲈鱼（在某些地区）和弓鳍鱼对儿童和育龄妇女不适合食用。\n\
  \n### 7.10.2 可见度\n\n东南地区的可视度已从自然水平下降了 75%。在平均一天中本应能看到 93 英里，但现在空气污染已将其降低到平均 20 英里。在任何夏季的一天，由于区域性烟雾，在区域内，视野可能完全被污染物遮挡的可能性很大。\n\
  \n### 7.10.3 生态系统\n\n空气污染导致酸雨和氮沉降，使植被更容易受到疾病和害虫的侵害，导致生长受阻和红杉、山茱萸、云杉、冷杉、山毛榉和其他树种种群显著下降。区域降雨比正常降雨更酸性。在西部，空气中的氮增加了敏感沿海流域的营养污染，导致藻类大量繁殖和鱼类死亡。\n\
  \n### 7.10.4 经济后果\n\n加州的脏空气威胁着该州经济的活力。估计脏空气每年给该州造成的发病率和死亡率成本超过 200 亿美元。\n\n臭氧对植物的影响是“农业生产中的重大压力因素”。空气污染降低作物产量，导致加州农民每年损失估计超过\
  \ 3 亿美元。臭氧-烟雾不达标地区的频繁烟雾警报阻碍了徒步旅行和其他户外活动。可视度的受损削弱了加州 100 亿美元的旅游业。该州国家公园的经济活动损失估计每年超过\
  \ 5 亿美元。\n\n### 7.10.5 全球气候变化\n\n来自移动源和点源的二氧化碳污染是导致全球变暖的主要污染物之一，预计未来 30 年内将导致加州海岸线海平面上升。\n\
  \n### 7.10.6 生活质量\n\n空气质量的丧失显然降低了所有加州人的生活质量，但给其定价是困难的。尽管如此，一些间接衡量是可能的。例如，生活质量长期以来一直是说服新企业落户该州的主要因素，这意味着随着空气质量下降，该州吸引新投资和就业将变得更加困难。\n\
  \n### 7.10.7 成本-效益分析\n\n《1990 年清洁空气法修正案》第 812 节提供了一个需要特别详细的风险评估（或成本-效益）的案例研究的状况。该法案这一部分的目的是评估清洁空气法的成本。它要求美国环保署估计法案涵盖的空气污染物的危险性（USEPA\
  \ 2011）。\n\n所给出的统计数据并不全面：酸雨、富营养化、汞暴露和其他环境问题的经济影响未包含在内。因此，脏空气的实际成本远高于所引用的美元金额所反映的成本。而且没有任何经济计算能够量化哮喘儿童所承受的痛苦或因暴露于高水平细颗粒物而导致死亡加速的心肺疾病老人所承受的痛苦。\n\
  \n## 7.11 一些正在进行的污染预防技术\n\n工业空气污染预防（P²）工作已集中于源头和废物减少，以及再利用和回收。一个关键的方法是防止公司制造工艺中的空气污染，特别是在化学工艺工业中。经常我们未能考虑到控制系统本身是消耗能源并可能向大气排放大量污染物的工业过程。人们倾向于独立追求每种目标污染物的控制而忽视次生污染物。通过选择可持续的污染控制技术仅通过减少能源消耗和次生污染物来减少的机会正在增加。\n\
  \n空气污染来自多种来源：固定源如工厂和其他制造过程；移动源如汽车、休闲车辆、雪地摩托和水上交通工具；以及区域源，即与人类活动相关的所有其他排放。空气质量问题与工业和交通部门经济中发生的燃烧过程密切相关。\n\
  \n空气污染控制是 P² 和可持续性概念相对较新且刚刚开始应用的领域，其显著的环境和经济效益的承诺很强。然而，法规发展过程和框架尚未充分采纳它们。\n\n由于大型工业可以合理地将控制成本纳入其经营成本，美国的空气质量监管方法首先从这些来源开始，具有最立即的环境改善潜力。监管要求已逐步收紧标准并将限制适用于更小的来源。法规开始针对优先污染物作为单独且不同的实体进行控制。这些趋势是国会通过\
  \ 1990 年《污染预防法》所要解决问题的部分内容，其第 3 条发现如下：\n\n> 由于现有法规以及其为合规所需的工业资源侧重于处理和处置而非源头削减；现有法规不强调污染的多媒体管理；企业需要信息和技术援助以克服采用源头削减做法的制度障碍，因此源头削减的机会往往未被实现。（Pollution\
  \ Prevention 1997；State of California January 2001；United State Congress, Pollution\
  \ Prevention Act of 1990；CFR 2019）\n\n然而，一些 P² 概念和对较小来源缺乏具有成本效益的处理技术也指导了监管方法。例如，许多涂料和油漆行业法规已将产品配方中的\
  \ VOC 限值设定为主要合规模式，而末端处理作为替代合规选项（State of California 2001）。另一方面，当前法规也具有诸如 BACT 等要求，要求大型来源对每种目标污染物实现高水平的处理，仅有限考虑成本，无论是金钱还是次生环境影响。\n\
  \n一个特别的机会领域是 VOC 和气味的控制。传统的控制技术，如热氧化和催化氧化，在减少 VOC 排放方面非常有效，减少率超过 95%。它们已成为通过监管概念如\
  \ BACT 衡量其他 VOC 控制技术可接受性的标准。然而，这些技术经常需要大量能源并产生诸如 NOₓ、SOₓ 和温室气体等次生废物。设施因其 VOC 去除系统的次生排放而难以满足\
  \ NOₓ 排放标准的情况并不少见。VOC 控制技术经常燃烧大量天然气以维持破坏 VOC 所需的温度，导致大量温室气体排放。\n\n### 示例 7.3 干洗店的溶剂排放\n\
  \n洛杉矶一家干洗店正在估算是否需要对其运营应用合理可得控制技术（RACT）。洛杉矶清洁空气法案主要来源的阈值为 10T（1T = 2000 lb）每年 VOC\
  \ 排放量。该店每天运营清洁设施 8 小时，每周 6 天，每年 51 周。该店新的蒸气回收设备有一个 250 加仑的储罐，运营期间平均每小时损失 0.70 加仑溶剂。溶剂为四氯乙烯，其液体密度为\
  \ 1483 kg/m³（12.17 lb/gal）。\n\n- 1) 这家店是否需要应用 RACT？\n- 2) 如果不是洛杉矶，而是位于纽约市，这家店是否需要应用\
  \ RACT？纽约市的 VOC 排放阈值为 25 T/Y。\n\n### 解答\n\n为计算该店的每小时质量排放量，使用以下表达式：\n\n```\nMass\
  \ rate = (volumetric solvent loss rate)(solvent density)\n        = (0.70 gal /\
  \ h)(12.71 lb/gal) = 8.66 lb/h\n```\n\n质量排放率以 lb/天计为：\n\n```\n= lb/day = (8.66 lb/h)\
  \ 8 h/day = 69.3 lb/day\n```\n\n\n\n质量排放速率随后换算为年排放量 lb/year，计算如下\n\nlb/year = (69.3\
  \ lb/day)(6 day/week)(51 week/year)\n= 21 206 lb/year\n\n排放速率随后换算为 T/Y，计算如下\n\n\
  ton/year = (21 206 lb/year)(1 ton/2 000 lb)\n= 10.6 ton/year.\n\n实际年排放速率随后与洛杉矶的主要污染源阈值\
  \ 10 T/Y 进行比较，即 10.6 T/Y 实际 > 10 T/Y。由于结果略微超过 10 T/Y 阈值，因此该店必须因此适用 RACT。\n\n纽约市的主要污染源阈值为\
  \ 25 T/Y。由于该店排放 10.6 T/Y，低于纽约市 25 T/Y 的阈值，因此无需适用 RACT。\n\n作为经验法则，释放 1 gal/h 比重为\
  \ 1.0 的溶剂相当于大约 10 T/Y，按 52 周、8 小时工作制计算，以及 24 小时工作制下约为 30 T/Y。\n\n## 示例 7.4 催化/热焚烧炉的成本\n\
  \n研究催化焚烧炉以替代在 750°C 下运行的热焚烧炉，燃料气体流量速率为 2.53 lb/min。由于所需温度较低，所需燃料气体流量下降至 1.44 lb/min。燃料气体成本为\
  \ $4.00/MBtu，计算催化系统的最大合理成本。假设两个系统的壳体成本相同，因此唯一额外成本是催化剂本身。假设催化剂每五年必须更换一次，且焚烧炉运行 24\
  \ h/day，300 days/year。\n\n### 解答\n\n计算节省的燃料量。\n\nFuel_saved = (2.53 − 1.44) lb/min\
  \ = 1.09 lb/min\n\n计算全年节省的燃料量。\n\nEnergy_saved = (1.09 lb/min)(21 560 Btu/lb) =\
  \ 23 500 Btu/min\n\n根据焚烧炉运行时间计算全年燃料节省量。\n\nYearly_savings = (23 500 Btu/min)($4.00/MBtu)(1\
  \ MBtu/10^6 Btu)(60 min/h)(24 h/day)(300 day/year) = $40 608/year.\n\n计算五年内可节省的资金。\n\
  \nTotal_saved = (40 608/year)(5 year) = $203 040\n\n综合考虑，催化剂可花费的最大金额约为 $203 000，以使热焚烧炉和催化焚烧炉的成本相等。\n\
  \nCost = $203 000 (answer).\n\n## 7.11.1 经济绩效指标\n\n与环境和社会绩效不佳相关的成本可能非常巨大。废物处置费用、许可成本和责任成本都可能相当可观。原材料浪费、能源浪费以及制造吞吐量降低也是废物和排放的后果。如果绩效不达标，企业形象以及与员工和社区的关系也可能受损。但这些成本如何量化？本节将回顾用于估算环境和社会成本和收益的工具。这些包括传统概念，如货币的时间价值、PV、PP、内部\
  \ ROR 以及其他财务评估计算。非传统工具包括将隐藏于正常会计程序之外的环境成本货币化的方法。我们还将涉及一些不太切实但仍可货币化的成本和收益。\n\n总体而言，传统的会计做法一直是可持续工程项目实施的障碍，因为它们隐藏了环境和社会绩效不佳的成本。许多组织现在更重视所有重大的环境和社会成本来源。原则是，如果成本得到正确核算，那么促进良好经济和社会绩效的管理实践也将促进卓越的环境和社会绩效（USEPA\
  \ 1995c）。\n\n## 7.11.2 环境成本估算\n\n通常认为，在环境和社会成本核算中，像全面（例如全面成本核算）、总计（例如总成本评估）、真实和生命周期（例如生命周期成本）等词语用于表示并非所有成本都包含在传统会计和资本预算做法中。最容易追踪的环境成本之一是与排放处理和废物处置相关的成本。美国人口普查局追踪污染防治成本，且成本一直在稳步增长。1972\
  \ 年的支出总额为 $52 billion（1990 年美元），预计到 2000 年将增长至约 $140 billion（1990 年美元），占国民生产总值的\
  \ 2.0–2.2%（有关这些数据的回顾和分析，见 United States Congress 1994）。\n\n**表 7.7** 美国制造业行业的污染防治支出。\n\

  \ must be performed, space constraints can significantly influence the cost of installation,\
  \ and the purchase of additional land may be a significant factor in the development\
  \ of the project’s capital costs. Land retains its value over time; however, land\
  \ is not treated the same as other capital investments, retains its value over time,\
  \ the purchase price of new land needed for siting a pollution control device can\
  \ be added to the TCI, but it must not be depreciated. Instead, if the firm plans\
  \ to dismantle the device at some future time, either the land should be excluded\
  \ from the analysis or its value included at the disposal point as an “income” to\
  \ the project, to net it out of the cash flow (CF) analysis.\n\nOne might expect\
  \ to include initial operational costs (the initial costs of fuel, chemicals, and\
  \ other materials, as well as labor and maintenance related to start-up) in the\
  \ operating cost section of the cost analysis instead of in the capital component,\
  \ but such an allocation would be inappropriate. Routine operation of the control\
  \ does not begin until the system has been tested, balanced, and adjusted to work\
  \ within its design parameters. Until then, all utilities consumed, all labor expended,\
  \ and all maintenance and repairs performed are a part of the construction phase\
  \ of the project and are included in the TCI in the “start-up” component of the\
  \ indirect installation costs.\n\n## 7.3.2 Elements of Total Annual Cost\n\nTotal\
  \ annual cost (TAC) has three elements: direct costs (DC), indirect costs (IC),\
  \ and recovery credits (RC), which are related by the following equation:\n\n> TAC\
  \ = DC + IC − RC                                                     (7.1)\n\nClearly,\
  \ the basis of these costs is one year, a period that allows for seasonal variations\
  \ in production (and emissions generation) and is directly usable in financial analyses.\
  \ The various annual costs and their interrelationships are displayed in Figure\
  \ 7.2.\n\nDC are those that tend to be directly proportional (variable costs) or\
  \ partially proportional (semi-variable costs) to some measure of productivity –\
  \ generally the company’s productive output, but for purposes of pollution control,\
  \ the proper metric may be the quantity of exhaust gas processed by the control\
  \ system per unit time. Conceptually, a variable cost can be graphed in cost/output\
  \ space as a positive sloped straight line that passes through the origin. The slope\
  \ of the line is the factor by which output is multiplied to derive the total variable\
  \ cost of the system. Semi-variable costs can be graphed as a positive sloped straight\
  \ line that passes through the cost axis at a value greater than zero – that value\
  \ being the “fixed” portion of the semi-variable cost and the slope of the line\
  \ being analogous to that of the variable cost line discussed above.\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_339_0.png)\n\
  \nNPV is the sum of the PVs of a series of CFs:\n\nNPV = CF₀ + (CF₁ × D₁) + (CF₂\
  \ × D₂) + (CF₃ × D₃) + ⋯  (7.3)\n\nwhere, CF₀, CF₁, CF₂ represent CF in year 0,\
  \ 1, 2, and so on, and the D terms are discount factor for the respective years.\n\
  \nIn the context of pollution control, cost-effectiveness is defined as the annualized\
  \ cost of the control option divided by the annual emission reductions resulting\
  \ from the control option. The following information is required to calculate the\
  \ cost-effectiveness of a proposed control option: (i) the capital cost of purchasing\
  \ and installing the control equipment or making a process modification, (ii) the\
  \ annual operating costs of the control option, and (iii) an estimate of the emissions\
  \ before and after application of the control option.\n\nThe capital costs of purchasing\
  \ the control option should be determined from actual vendor price quotes for each\
  \ proposed control option. Installation costs should also be based on vendor price\
  \ quotes. If vendor price quotes are unavailable, elements of the installation cost\
  \ may be estimated (Vatavuk 2002). To illustrate cost-effectiveness calculations,\
  \ let us consider a facility that is a major source of NOₓ emissions.\n\n## Example\
  \ 7.1 Total Capital Cost\n\nAs part of a company’s ongoing pollution prevention\
  \ program, an existing appliance coating operation is to be replaced by a minibell\
  \ automatic electrostatic spray system. The company estimates that the coating operation\
  \ is presently operating at a 50% transfer efficiency, and it has received a guarantee\
  \ of 90% transfer efficiency with a new unit. The company operates 250 days/year\
  \ and processes 200 appliance units per day. An average of 2 gal of paint are presently\
  \ required to coat each unit. The coating material has a volatile organic compound\
  \ (VOC) content of 5.0 lb VOC/gal solids. Information on the minibell system is\
  \ given below. If the paint worth $5/gal shows that an annual profit will be realized\
  \ by replacing the existing spray system with the more efficient minibell unit.\
  \ Cost information on the proposed minibell system is given below.\n\nInstalled\
  \ cost = $1 125 000\nOperation and maintenance cost = $70 000/year\nLifetime guarantee\
  \ = 15 years\nInterest rate per purchase cost = 8%\n\n## Solution\n\n4) Obtain the\
  \ annual operating and maintenance cost. From the data given,\n\nAnnual O & M cost\
  \ = $70 000/year\n\n5) Calculate the annualized capital cost, ACC.\n\nACC = (IC)(CRF)\n\
  = (IC)(i)(1+i)ⁿ / [(1+i)ⁿ − 1]\n= (1 125 000)(0.08)(1.08)¹⁵ / [(1.08)¹⁵ − 1]\n=\
  \ $131 444\n\n6) Calculate the TAC, if the minibell system is installed\n\nTAC =\
  \ O & M + ACC\n= 70 000 + 131 444\n= $201 500\n\n7) Calculate the total annual operating\
  \ savings, TAS, if the minibell system is installed. Since the spray system operates\
  \ more efficiently, a savings will be realized because of the reduced paint usage.\
  \ At 50% transfer efficiency only 1 gal of the 2 gal of paint used per unit is actually\
  \ applied. The paint usage for the minibell system, operating at 90% transfer efficiency,\
  \ is (1.0/0.9) or 1.11 gal. Thus, the gallons saved per unit is 2.0 − 1.11 = 0.89\
  \ gal. The total annual savings, TAS, becomes\n\nTAS = (gas used/number units/day)(operating\
  \ days)(cost)\n= (0.89 gal)(299 units/day)(250 days/year)\n(5.0 lb VOC/gal)\n= $222\
  \ 5000\n\n8) Calculate the annual savings.\nThe savings, S, can be calculated by\
  \ subtracting the result of step (3) from that of step (4).\n\nS = $222 500 − $201\
  \ 500\n= $21 000\n\nOnce a particular process scheme has been selected, it is common\
  \ practice to optimize the process from a capital cost and O&M standpoint. There\
  \ are many optimization procedures available, most of them too detailed for meaningful\
  \ application to simple pollution prevention projects. These sophisticated optimization\
  \ techniques, some of which are routinely used in the design of conventional chemical\
  \ and petrochemical plants, invariably involve computer calculations.\n\n## Example\
  \ 7.2 Cost-Effectiveness Calculation\n\nFor a boiler operating at 100% of its operating\
  \ capacity (50 Btu × 10⁶), the following information was determined for the purposes\
  \ of calculating the cost-effectiveness of installing SCR as a control option. The\
  \ facility is a major source of NOₓ emissions.\n\nGiven:\nCapital cost of control\
  \ option = $1 500 000\nCapital recovery factor (CRF) = 0.1627 (assuming 10% interest\
  \ for 10 years)\nAnnual operating and maintenance costs = $98 000\nUncontrolled\
  \ emissions = 21 T of NOx per year\nCapture efficiency = 100%\nControl efficiency\
  \ = 80%\n\n## Solution\n\nWe insert the data into the following equations:\n\nCost-effectiveness\
  \ ($/T) = annualized costs/T of pollutant reduced\nAnnualized costs ($) = (capital\
  \ cost × CRF) + annual operating costs\nPollutant reduced (T) = (uncontrolled emissions\
  \ × capture efficiency × control efficiency)\n\nThe result is\nCost-effectiveness\
  \ = ($1 500 000 × 0.1627 + $98 000) / (21 tons × 1.0 × 0.80) = $20 400 / ton\n\n\
  Inducing industries to adopt effective new production methods and pollution control\
  \ technologies in timely fashion is a challenge for regulators everywhere. Environmental\
  \ protection costs money, and the charges that will be incurred by a given enterprise\
  \ depend on the nature and extent of the pollution it generates. These factors,\
  \ in turn, are functions of the type and scale of production, the plant’s input,\
  \ the technology used, and the size of the plant.\n\nGenerators of pollution range\
  \ from private individuals and small business to municipalities, large corporations,\
  \ and the government itself. Each polluting entity must decide how to invest in\
  \ the socially desirable goal of a cleaner environment; influencing such decisions,\
  \ inevitably, will be the benefit the entity expects to obtain from the investment.\n\
  \nWhen business owners consider how to implement the installation of modern pollution\
  \ control technology, their decisions incorporate the results of comparative analyses\
  \ of the costs and benefits of the investments contemplated. Later we shall present\
  \ a case study focused largely on financial costs and benefits associated with biobased\
  \ energy and products (Section 7.4). To provide the necessary background for this\
  \ material, we turn now to some basics of cost estimation and capital investments.\n\
  \n## 7.5.1 Achieving a Responsible Balance\n\nIn the real worlds, taking socially\
  \ desirable action for pollution prevention may not be in the best interest of an\
  \ industry in the short run, since environmental protection costs money. The type\
  \ of production, input used, technology employed, space used as well as plant size\
  \ and the scale of production determine the nature and extent of pollution which,\
  \ in turn, influence the abatement cost. Hence, the decisions of the profit maximizing\
  \ private investor for implementation of pollution abatement measure are influenced\
  \ by the benefit expected as a result of the investment required. On the other hand,\
  \ the task of government planners and policy makers is to encourage industry to\
  \ adopt modern production and pollution control technologies to provide a better\
  \ environment for the society. In upgrading their facilities to meet the near antipollution\
  \ regulations, industries turn for guidance to the principles of best available\
  \ control technology (BACT).\n\n## 7.6 From Pollution Control to Profitable Pollution\
  \ Prevention\n\nAs companies incorporate pollution prevention approaches in their\
  \ strategic planning, capital investment priorities, and process design decisions,\
  \ it is vital that they understand both the quantitative and qualitative dimensions\
  \ of assessing pollution prevention projects. These projects tend to reduce or eliminate\
  \ costs that may not be captured in cursory financial analyses due to the way costs\
  \ are categorized and allocated by conventional management accounting systems. Additionally,\
  \ pollution prevention projects often have impacts on a broad range of issues, such\
  \ as market share and public impact that are difficult to quantify but that can\
  \ be of strategic importance. Identifying and analyzing all costs and less tangible\
  \ items is an important step in an evaluation of the potential benefits of pollution\
  \ prevention projects.\n\nPollution prevention can take many forms – from simple\
  \ “housekeeping improvements,” which cost little to carry out, to installation of\
  \ expensive capital equipment. Although many pollution prevention projects, such\
  \ as material substitution or process redesign, do not require large outlays for\
  \ purchase of equipment, they may require extensive qualitative assessments related\
  \ to such issues as product quality or employee health and safety. The analytical\
  \ tools described here are applicable to the assessment of most pollution prevention\
  \ initiatives that fit under the umbrella of the capital budgeting process. Pollution\
  \ prevention projects involving capital budgeting generally include\n\n- 1) new\
  \ manufacturing equipment\n- 2) replacement equipment\n- 3) plant expansion and\
  \ construction\n\n\n\n\n\n资本预算是对基于公司需求的资本投资选项进行评估并分析投资对公司随时间推移的现金流（CF）影响的过程。污染预防和其他资本项目通过展示项目如何提高公司的收益而得到证明。财务工具以收入、费用和利润的形式展示了污染投资在生命周期或总成本基础上的重要性。资本预算中使用的关键概念和因素接下来进行描述。\n\
  \n生命周期成本（LCC）：也称为总成本核算，该方法分析与设备或程序相关的成本和收益，涵盖设备或程序整个使用时间。LCC也是在技术上同样适合实施的情况下，确定在购买、拥有、运营、维护以及最终处置对象或流程时最具成本效益的选项的工具。例如，对于高速公路路面，除了初始建设成本外，LCC还考虑了所有用户成本（例如施工区内的通行能力降低）和与未来活动相关的机构成本，包括未来的定期维护和修复。所有成本通常都会折现并汇总为现值，称为净现值（NPV）。该示例可推广到任何类型的材料、产品或系统。\n\
  \n为了进行LCC，范围界定至关重要，需要包含哪些方面以及不包含哪些方面？如果范围过大，该工具可能变得不切实际使用，且在决策和替代方案考虑方面的帮助能力有限；如果范围过小，则结果可能会因所考虑因素的选择而失真，从而导致输出不可靠或片面。LCC具有更广的范围，包括环境成本。为了帮助建筑和设施管理人员做出明智的决策，美国联邦能源管理计划提供了关于应用LCC的指导和资源，以便评估能源和水效率投资的成本效益。LCC可采用两种方法进行：确定性方法和概率方法。\n\
  \n现值（PV）：PV或现值的重要性在于时间就是金钱。现在的一美元与一年后的一美元之间的偏好是由现在手中的美元可以赚取利息这一事实驱动的。在数学上，这种关系如Eq.\
  \ (7.2)所示，并举例说明了现值和未来值。\n\n财务分析的比较因素：用于比较投资选项的更常见方法都利用Eq. (7.2)中提出的PV方程。一般来说，以下四种因素之一被使用：\n\
  \n- 1) 投资回收期（PP）：该因素衡量收回初始投资资本所需的时间。\n\n从概念上讲，回报最快的项目是最佳投资。\n\n- 2) 内部回报率：该因素也称为投资回报率或ROI。它是会产生与项目回报相当的投资资本回报的利率。例如，内部回报率为20%的污染预防项目表明，推进该项目相当于将资金投资于银行并获得20%的利息。\n\
  \n- 3) 效益成本比：该因素是通过取污染预防项目所有财务效益的总PV并除以项目所有成本的总PV而确定的比率。如果比率大于1.0，则效益超过成本，项目在经济上值得开展。\n\
  \n- 4) 净收益现值：该因素以PV总和的形式显示污染预防项目的价值。它是通过计算所有效益的PV，对所有成本做同样的计算，然后减去两个总额来确定的。新结果将是一笔资金，代表开展该项目的有形价值。\n\
  \n## 7.6.1 生命周期成本\n\n虽然企业可以使用这些因素中的任何一个，但LCC（用于总成本分析）的重要性使得净收益现值成为首选方法。LCC和TCA的更多细节如下。\n\
  \nLCC工具和总成本评估（TCA）工具作为概念概述被介绍。两种工具都可用于建立经济标准以证明污染预防项目合理。TCA通常用于描述内部成本和节约，包括环境标准。LCC包括整个过程、产品或活动生命周期内产生的全部内部成本加上外部成本。\n\
  \nLCC多年来一直被公共和私营部门使用。它将经济标准和与污染预防机会相关的社会（外部）成本联系起来。LCC的目的是量化给定机会在较长时间范围内的一系列随时间变化的成本，并将这些成本表示为单一价值。这些随时间变化的成本通常包括以下内容：\n\
  \n- 1) 资本支出。用于具有长期经济寿命的大型、不频繁投资的成本（例如新建建筑物、主要翻新和设备更换）。\n\n- 2) 非经常性运营和维护（O&M）。反映非资本支出的、发生频率低于每年的项目的成本（例如溶剂蒸馏单元中部件的维修或更换）。\n\
  \n- 3) 经常性O&M。用于每年或更频繁发生的项目的成本（例如油和液压油更换）。\n\n- 4) 能源。所有能源或发电相关成本。虽然能源成本可作为经常性O&M成本的一部分，但由于其经济规模庞大且对市场价格和建筑物利用率敏感，通常会单独列出。\n\
  \n- 5) 残值。反映LCC分析期结束时设备价值的成本。这考虑了折旧和服务改进的影响。\n\n通过考虑所有成本，LCC分析可以量化成本类别之间存在的关联。例如，某些类型的资本改进会降低运营、维护和能源成本，同时提高分析期结束时设备的残值。\n\
  \n社会（外部）成本包括因健康和生态损害而产生的成本，例如与未受监管排放、湿地丧失或森林砍伐相关的成本，也可以在定性或定量方式下反映在LCC分析中。LCC包括以下成本组成部分：\n\
  \n- 1) 天然资源开采。用于开采材料以及该过程的任何直接或间接环境成本。\n\n- 2) 原材料生产。加工原材料的全部成本。\n\n- 3) 制造基本零部件和产品。材料加工和产品制造的总成本。\n\
  \n- 4) 内部储存。产品在运往分销商和/或零售店之前包装和储存的成本。\n\n- 5) 分销和零售储存。将产品分销到零售店的成本，包括运输成本，以及消费者购买前的零售储存成本。\n\
  \n- 6) 产品使用。消费者使用产品的成本。这可能包括使用设备必须进行的任何燃料、油、维护和维修。\n\n- 7) 产品处置或再利用和/或回收。产品处置或回收的成本。\n\
  \n### 7.6.2 总成本评估\n\nTCA工具尤其有趣，因为它通常同时采用经济和环境标准。与LCC分析一样，TCA研究通常侧重于特定过程如何影响用户的底线成本。环境标准不是明确的，即成功不是以废物减少或资源节约来衡量，而是以成本节约来衡量。然而，由于TCA的目的是通过纳入环境成本来改变会计实践，因此环境目标是通过成本降低来实现的。\n\
  \n由于其对成本和成本效益的关注，TCA与LCC分析共享许多特征，通过跟踪DC，例如资本支出和O&M费用/收入。然而，TCA还包括IC、责任成本和不太具体的收益——这些主题在经济和环境目标中通常不包括在内，因为它们具有私营部门导向，以及其他经济计算方法。\n\
  \n### 7.6.3 与污染预防相关的经济考虑\n\n任何污染预防（P²）计划背后的最大驱动力是长期经济机会和成本节约的承诺。污染预防已被公认为废物/污染物管理的最低成本选项之一。因此，了解P²项目/选项所涉及的经济问题对于在工程和管理层面做出决策非常重要。每位工程师都应能够对拟议项目进行经济评估。如果在考虑了所有因素——包括前面讨论的因素之后——项目在经济上无法证明合理，则显然不应继续推进。越早识别此类项目，浪费的资源就越少。\n\
  \n在能够评估P²项目的真实成本或利润之前，必须认识到影响经济的因素。如前所述，有两个传统贡献因素（资本成本和运营维护成本），但与P²相关的还有其他重要成本和收益，如果要进行有意义的经济分析，则需要对其进行量化。TCA旨在量化P²的经济方面以及从摇篮到坟墓（即生命周期）过程中、产品或服务相关的社会成本。TCA试图量化不太具体的收益，例如不使用危险物质所带来的风险降低。未来肯定会更加重视在任何P²项目中采用TCA方法。例如，一家公用事业公司考虑将燃气锅炉改为燃煤，通常不会关心与开采、运输和在用作能源原料前储存煤炭等活动相关的环境影响和影响。污染预防方法将变得更加意识到这种需求。\n\
  \n## 7.7 资源回收和再利用\n\n临时战略的一个关键要素是增强回收。这可以从两个方向进行：产品再利用和材料回收。产品再利用\n\n\n包括返还、整修和再制造。重复使用和回收所需的能量是决定产品可回收性的关键因素之一。回收产品越接近其回收所需的形式，进行这种转变所需的能量就越少。从经济发展的角度来看，值得指出的是，整修或再制造循环是相对的；每单位实物产出大约需要一半的能量和两倍的劳动力。\n\
  \n材料回收意味着在消费后废物的供应与生产资源的需求之间建立闭环。材料回收将是零排放工程师的职责；产品再利用也会涉及零排放工程师，但会有大量来自另一专业——并行工程师的前期工作。并行工程融合了工业工程、产品设计和产品制造的各个方面，是一种旨在优化材料、装配和工厂运营的集成方法。这些工程师审视产品的更广泛背景，包括管理其运输、预期用途、可回收性和处置的环境影响的技术，以及其生产中使用的原材料开采的环境后果。\n\
  \n因此，所有材料的最终命运是耗散、被丢弃，或回收与再生。由于从环境中提取的材料中有94%转化为废物，目前的回收水平显然不足。从废物中回收材料将减少资源开采的程度（但不会减缓材料在经济中的流动速度）。铝和铅是当前被大量回收的两种资源，但有证据表明，还有更多资源可以从废物中回收。\n\
  \n舍伍德图是一种图表，可以直观比较自然界中物质的浓度与其商品成本。示例图（见图1.7）显示，商品的价格取决于其开采和提炼之前在自然界中的浓度。在类似的废物中物质浓度图（见图1.8）中，同样呈现出一条一致的曲线。\n\
  \n总之，舍伍德图证明了材料的回收潜力。在图1.7中位于线上方的元素应大力回收，因为它们存在于单个副产品中，浓度相对较高。铅、锌、铜、镍、汞、砷、银、硒、锑和铊从废物中回收比从自然界中回收更经济。广泛的废物交易可以显著减少需要处置的材料数量，因为资源开采使用的是废物，而非原始原料（Allen\
  \ 和 Rosselot, 1997）。\n\n## 7.8 金属精加工行业中可盈利的污染预防\n\n金属产品的表面精加工是一项主要的制造作业，在数千家生产车间中进行，为数千种制成品提供耐候、耐磨且美观的表面处理。¹\n\
  \n表面精加工技术涉及基材（如钢、铝、黄铜或塑料）与金属或有机表面顶层涂层之间的直接原子对原子结合，从而提供所需的材料性能和外观特性。表面预处理对于所生产零件的性能和耐久性至关重要。清洁和去除氧化物是关键，因此预处理工艺通常涉及许多用途各异的槽。通常采用多步表面预处理工艺来去除油脂、污垢和脏物、旧涂层、腐蚀产物、残留切削液、钎焊残留物、酸洗残液、清洁剂残留物等。表面预处理工艺可去除污染物、保持清洁的表面，和/或为下一次涂覆改质表面。精加工后，零件需要漂洗/清洗以去除残留电镀液。这些电镀槽和清洗槽最终会因溶液强度耗尽或杂质积累而失效，从而成为主要废物流（Burckle\
  \ 和 Ferguson, 2005; USEPA, 2001）。\n\n过去，金属精加工行业的污染控制主要通过末端处理实现。设施将废物处理系统作为最终工艺步骤，以满足市政下水道的监管排放限值，或作为直接排放者。这种方法会产生受重金属污染的残余污泥，需要适当的预处理才能进行环境安全处置（即美国《资源保护与回收法案》中适用于危险废物处置的所谓“哈默条款”）。20世纪80年代中期，各种设施开始将“污染预防”纳入其运营，以减少产生和处理的废水量。然而，采用速度相对较慢，尤其是在较小的设施中（USEPA,\
  \ 1982, 1985）。\n\n有效实现环境保护最合理、最高效的方法是预防污染。预防是通过使用减少、消除或循环/再利用废料的技术来实现的，从而消除废物的产生，避免废物处置的需要，并对产生的废物进行负责任的处理，要么通过回收和循环利用来替代其他材料需求和/或节约能源，要么将其最小化并使之\n\
  \n1. 本材料大部分来源于第9.2.3节 Burckle 和 Ferguson（2005）。\n\n环境管理体系（EMS）。ISO 14001认证——一种全球标准化的环境管理体系——正日益要求从事出口产品制造的公司，包括此类产品供应链中的零部件供应商。此外，美国环保局还提供合规激励措施——“在特定条件下，为自愿发现、及时披露并迅速纠正环境问题的企业、行业和政府设施免除、减少或豁免处罚的政策和计划”，并且正在将实施环境管理体系的要求纳入和解协议中。有关这些激励措施、计划以及此类计划所实现的环境效益的信息，可在互联网上查阅（http://www.epa.gov/compliance/incentives/index.html）。\n\
  \n### 7.8.2.3 实践污染预防\n\n基于污染预防理念的技术旨在消除废物的产生，或通过循环/再利用减少废物的处置。金属精加工行业的污染基本上是有害形式的材料或其他资源（能源、劳动力、时间等）的排放。这些资源的损失等同于利润和经济生产力的损失。理所当然，某种资源的使用量超过工艺所需最低量越多，这种增量使用（真正的“废物”）就越会增加运营总成本中“不必要”的部分。例如，就用水而言，这种不必要的成本不仅仅是被浪费的过量水的成本。这种废物的成本因其处理与处置的整体管理成本而放大，包括将过量水输送过工艺、对其进行清洗以及处理处理后的水和任何残余废物的资本和运营成本。处理和处置成本通常比初始原材料更昂贵。由于所使用的会计流程不足以进行此类跟踪，公司通常不会跟踪这些成本（工艺操作成本和合规成本）。\n\
  \n参加SGP的公司通过实施P2实践发现了显著的成本节约（USEPA, 2001）。显著的成本节约提高了经济效率和资产负债表上的底线，使运营更具竞争力。其他优势包括保护员工、减少负债，同时提升公司的商业形象。\n\
  \nSGP在金属精加工行业成功实现其目标，主要归功于污染预防技术的采用。该计划的主要目的是展示基于P2的废物减少方法所提供的诱人的环境和经济效益。预期的结果是“激发对这些极其宝贵工具的高度认识和赏识”，以便在整个行业范围内将其纳入日常实践。此外，采用环境管理体系并将其融入公司运营，可确保参与公司整体结构中的持续改进（既在环境绩效方面，也在成本节约方面）。\n\
  \n在20世纪80年代，美国环保局资助的研究调查并记录了各种单元过程中减少污染的多种方法，包括内务管理和维护方法，以及工艺化学品和冲洗水的管理。这些方法在题为《表面精加工迈向零排放》的EPA简报（USEPA,\
  \ 2000）和题为《金属电镀与精加工的P2概念与实践》的培训课程文件中有所描述（AEFS，美国电镀与表面精加工协会）。这些学习辅助工具涉及多个工艺设计领域，例如表7.2所列的那些。\n\
  \n制造业运营向基于P2的系统的过渡已通过一系列技术选择得到证明，从对现有工艺技术相对简单的改进到基于重大工艺变革的更复杂方法。污染预防技术的力量有许多实例，从相对简单的用水管理改进到更复杂的回收工艺，如SGP和其他计划的结果所记录的那样。\n\
  \n### 迷你案例研究（USEPA 1998）：水管理P2示例\n\n加利福尼亚州的一家公司实施了一些相对简单且低成本的P2措施：在漂洗槽中安装限流器以管理漂洗水，在处理槽之间使用滴液板以及电镀槽上方使用挂杆来减少带出液。1997年至2000年间，该工厂实现了水耗降低50%、能耗降低25%以及金属利用率达98%。自2001年10月以来，该工厂通过将节约率提高到能耗比原始基准减少62.5%、工艺用水减少70%，进一步增加了能源和水消耗的节约。\n\
  \n如需其他案例研究，请在线访问：\nhttp://es.epa.gov/cooperative/topics/metcasesstudies.html\nhttp://www.epa.gov/ORD/NRMRL/std/mtb/metal_finishing.htm#nmm5f\n\
  \n\n\n\n# 表 7.2 表面处理商的污染预防技术。\n\n| 在这些操作中改进 | 采用这些技术和做法 |\n|---|---|\n| 延长槽液寿命<br>-\
  \ 减少化学品消耗<br>- 减少槽液排放<br>- 最大化在线时间<br>- 保持产品质量 | - 改善槽液化学溶液管理<br>- 通过改善卫生管理减少污染<br>-\
  \ 增加新的连续槽液净化技术 |\n| 减少水消耗<br>- 改善水利用以减少用水需求和污水费用<br>- 增加厂内循环利用<br>- 减少废水排放和取水量 |\
  \ - 采用用水量更少的漂洗方法<br>- 减少带入和带出<br>- 采用新的工艺分析和规划方法以节约用水<br>- 使用先进技术去除化学品以允许漂洗水循环利用\
  \ |\n| 最小化废物<br>- 减少所有化学品和用水的用量<br>- 减少废物产生<br>- 改善厂内回收和循环利用 | - 改善工艺管理与监督<br>-\
  \ 实施环境管理体系<br>- 改善如上所述的漂洗操作<br>- 增加厂内水循环利用 |\n| 减少有害化学品的使用<br>- 降低环境风险和成本<br>- 改善工人安全<br>-\
  \ 保持或提高生产率和质量<br>- 获取新市场或保持现有市场，其中客户正在“绿色供应链” | - 转向毒性较低的化学品<br>- 使用新的表面处理工艺和涂层<br>-\
  \ 减少生产线中的工序数量 |\n\n许多槽具有各种用途。例如，铝阳极氧化可能需要八个预处理槽；在传统的铬酸盐转化涂层中，有十二个工序，而传统的锌磷化需要六个。所有这些槽液都含有重金属，必须定期排放。\n\
  \n金属表面处理作业产生的有毒/有害废物流的体积是显著的（USEPA 1995a）。消除任何表面处理步骤对制造过程都有益，因为它可以降低加工成本、废物产生和能源消耗。预处理金属所使用的强酸对工人构成极大的健康和安全风险。考虑到这一点，设计用于降低金属表面处理作业加工成本的无废或减废表面处理剂将具有极大的益处。\n\
  \nPicklex 工艺（一种专有工艺）就是这种替代传统金属表面预处理的替代方案之一，可显著减少废物产生。该工艺由 International Chemical\
  \ Products, Inc. 在 USEPA 协助下开发。Picklex 工艺的工作方式与传统工艺完全不同。它将金属表面的腐蚀产物并入施加到同一金属表面的保护涂层中。这种新的\
  \ P² 方法通过在工件上形成保护性表面涂层，同时解决金属在处理槽中积累的常见环境问题，从而“另辟蹊径”。开展了一个两阶段项目，以评估 Picklex 作为基于污染预防的传统金属预处理或预处理/转化涂层在表面处理作业中的替代品，在技术和经济上的可行性。目标是证明其在保持相同或更好的产品性能特性的同时，消除或显著减少所消耗的有害和有毒化学品的数量以及所产生的污染的潜力。\n\
  \n对 Picklex 进行了广泛的实验室评估，其中使用并排测试线对七种传统工艺和 Picklex 进行了全多步、台架规模、批次操作测试。实验室测试的结果非常有利，并进行了现场测试（Ferguson\
  \ and Monzyk 2003），以评估其在与传统制备技术并排测试中的厂内性能。只有最有前景的应用——即取代铬酸盐转化涂层和锌磷化——被带入现场评估。在这些有针对性的现场测试中，Picklex\
  \ 仅用于为粉末涂层制备铝和钢基材。虽然测试范围缩小了，但更详细。总共测试了 41 种不同的基材、脱脂剂、预处理、转化涂层和粉末涂层的组合。仅使用未受污染的面板和部件，且无腐蚀产物。所有测试案例的结果均表明，最终产品的质量在各方面都与传统做法相同。产品质量被确定为所有综合结果中单一最重要的验收标准，因为如果最终产品质量不可接受，污染减少就无关紧要。现场测试结果复制了早期获得的结果，表明实验室测试可用于准确预测实践中可实现的结果。\n\
  \n## 7.8.2.4 案例研究：一种新兴的盈利性污染预防技术\n\nUSEPA 最近完成了对专有 Picklex 工艺的研究。Picklex® 是一种“‘无污染’预处理/转化涂层，可替代粉末涂层、油漆和其他有机涂层应用中的铬酸盐转化涂层和锌和铁磷化”（Ferguson\
  \ and Monzyk 2003; Ferguson et al. 2001）。\n\n描述 金属预处理对于清洁和氧化物去除以获得生产零件的适当性能和耐久性至关重要，通常涉及\n\
  \n## 7.8.2.5 环境效益\n\n两种商业工艺，铬酸盐转化涂层和锌磷化，被用作现场测试中的实验对照基线（图 7.3 和 7.4，分别）。金属在这些传统工艺中的积累会破坏槽液，槽液必须被排放。\n\
  \n在金属表面处理领域，丢弃此类含金属废物流是污染的主要贡献者。Picklex 工艺中处理槽中使用的化学品被产品使用；然而，通过过滤，槽液不会受到污染。因此，不需要排放槽液来控制杂质积累，化学品配制只需根据需要添加到槽液中即可。该工艺已证明具有作为表面制备作业污染预防领先技术的强大潜力。\n\
  \n正如与这种新兴技术相比的传统做法所示，Picklex 工艺可消除金属表面处理工艺中多达十一个步骤。源头废物减少非常显著。这些减少是通过消除六价铬槽及其随后的漂洗操作；消除用于蚀刻和清洁的酸性槽液及其随后的漂洗操作；消除锌磷化槽液及其随后的漂洗操作；以及消除脱氧化槽及其随后的漂洗来实现的。所有被消除的步骤都是排放污染的步骤。此外，\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_350_0.png)\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_350_1.png)\n\
  \n图 7.3 Picklex 与传统铬酸盐转化涂层的比较。\n\n图 7.4 Picklex 与传统锌磷化的比较。\n\nPicklex 工艺显著减少了剩余步骤的污染。它在提供与传统工艺相同的优质表面和耐磨能力的同时实现了这一点。\n\
  \n虽然通常 Picklex 槽液不需要排放，但作为研究的一部分，槽液在泄漏或意外污染情况下的废物处理问题进行了评估。新鲜、已使用和杂质加标的已使用 Picklex\
  \ 样品使用常规 pH 9 沉淀工业废水处理方法进行处理，以生产用于 Picklex 废物处置评估的样品。废渣被评估其有毒浸出性。用于排放的水上清液也被检查，发现很可能可排放。废物处理在许多工艺中可能并不频繁或不必要。工业废水处理厂运营的实际排放限值是特定场地的，并且由地方、州（以及必要时联邦）监管机构逐案确定。因此，在特定地点已知之前，不可能对这些潜在废物溶液进行确切分类。所有浸出液均符合适用的联邦法规（USEPA\
  \ 1995b）。因此，Picklex 似乎不会带来异常的废物处理问题。\n\n## 7.8.2.6 经济效益\n\n对两种最有前景的工艺——取代铬酸盐转化涂层和锌磷化——进行了成本比较。这些是根据行业可能实现成本节约的潜力而选择的。基于\
  \ Picklex 技术预计的显著资本和年度运营成本，摘要见表 7.3，似乎有显著的经济激励将现有做法迁移到这种新技术。例如，采用该工艺代替铬酸盐转化涂层的新车间将节省\
  \ 254 000 美元的资本成本，将工艺从 12 个槽减少到 1 个槽（图 7.3）。对于钢的锌磷化，估计节省为 230 000 美元。\n\n# 表 7.3\
  \ 潜在成本节约。\n\n| 成本类型 | Picklex 相对于传统工艺的节约 |  |\n| | 铝的铬酸盐转化涂层（$） | 钢的锌磷化（$） |\n|\
  \ 资本成本节约 | 254 000 | 230 000 |\n| 年度运营成本节约 | 46 000 | 32 000 |\n来源：摘自 Ferguson and\
  \ Wilmoth（2000）和 Ferguson et al.（2001）。\n\n## 7.8.2.7 技术可转移性\n\nPicklex 技术非常稳健且灵活（Ferguson\
  \ and Monzyk 2003）。它适用于从非常大到非常小的作业。它可用于新建安装、工艺现代化改造，或作为任何现有设施的即插即用替代品。Picklex 可通过浸入槽中或通过喷涂或刷涂的方式应用。成本节约非常显著，并且是设施规模和所需加工线的数量的函数。可转移性通过整体设施成本节约和生产率改善的预期重要性而得到增强。\n\
  \n## 7.8.3 来自纸浆厂废气的增值化学品\n\n甲醇是在木材制浆过程中形成并被还原硫化合物和萜烯污染，是 Kraft 纸浆厂 VOC 排放的最大单一来源，占总排放量的\
  \ 70–80%。集群规则（Cluster Rule Regulation: 40CFR Part 63 1998）限制美国所有纸浆厂的甲醇排放。加拿大面临类似的立法（Das\
  \ 1997, 1999a, b; Das and Houtman 2004; Das and Jain 2001）。\n\n甲醇排放可以通过收集来自蒸煮器、蒸发器和工厂其他来源的冷凝液流来减少。然后收集的冷凝液流可通过蒸汽汽提浓缩甲醇以进行焚烧。少数工厂“硬管”将这种含甲醇的流送至生物处理厂，从而避免焚烧。\n\
  \n汽提塔 overhead 气体（SOG）含有大约相等比例的甲醇和水（40–50 wt%）以及大约相等比例的 TRS 和萜烯（1–5 wt%）。\n\n在美国，SOG\
  \ 很可能在焚烧炉、窑或锅炉中燃烧。最近，一些工厂发现将 SOG 精馏至约 80% 甲醇并作为液体收集是有利的，其燃料价值更高。有了这种浓缩（70–80%）的甲醇流，工厂可以减少必须购买的天然气量。\n\
  \nGeorgia-Pacific 开发了一种工艺，将精馏 SOG 中的甲醇和 TRS（主要是巯基化合物）转化为甲醛。基于 Wachs（1999a, b）的研究，这种专利催化工艺（Burgess\
  \ et al. 2002）已从典型的纸浆厂 SOG 含甲醇、水和 TRS 化合物的进料中实现了商业上可行的甲醛产率（70–80%）。\n\n将甲醇和 TRS\
  \ 转化为甲醛为 Kraft 厂提供了比将气体作为燃料焚烧更有利可图的 SOG 替代方案。生产的甲醛可被树脂制造商用于生产\n\n\n\n\n\n# 表7.4\

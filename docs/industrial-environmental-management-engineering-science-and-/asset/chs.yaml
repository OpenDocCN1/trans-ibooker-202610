  ## 9.7.2 Black Liquor Gasification (BLG): Introduction


  黑液是一种具有独特气化适用性的生物质原料（Ådahl et al. 2004; Andersson and Harvey 2004; Bajpai 2008,
  2013; Berglin et al. 2002; Dahlquist et al. 2009; Grigory 2009; Marklund 2006; Salomonsson
  2013; Sricharoenchaikul 2009, 2001; Waldner and Vogel 2005; Wikipedia 2016）。首先，它以大量存在于现有工业现场。其次，它是液态的。这使得它可以通过泵送轻松地送入加压气化炉。液态还使黑液易于雾化成细雾，在气化炉中反应非常快。第三，黑液焦炭的气化速度比任何其他原料都快，因为黑液中固有的高钠和钾含量起催化作用。这些特性使得黑液能够应用高温、悬浮流气化原理。这种类型的气化工艺相对于替代气化技术具有许多优势。它是一种非常快速的单段气化工艺，具有反应器体积小、排放低（包括颗粒物和有臭味的
  TRS 气体）、功耗低等优点。


  ### 9.7.2.1 Black Liquor Properties


  黑液是木质素残渣、半纤维素和工艺中使用的无机化学品的水溶液。黑液通过一系列蒸发器以增加固体含量，使其适合燃烧。在蒸发器中，BLS 含量从约 15 wt% 增加到约
  70–75 wt%。进入回收锅炉的浓缩黑液由约 30% 水、30% 有价值的无机制浆化学品和 40% 从木材中分离出的木质素和其他有机物组成。较高的热值约为 14,000
  kJ/kg 固体。通常，大型纸浆厂每天生产约 200 t 黑液，相当于约 300 MWh（Bajpai 2014）。


  黑液中的有机物由木材的水/碱可溶降解组分组成。木质素降解为较短的片段，硫含量为 1–2%，钠含量约为干固体的 6%。纤维素和半纤维素降解为脂肪族羧酸皂和半纤维素片段。提取物产生松香皂和粗松节油。皂中约含
  20% 钠。表 9.4 列出了黑液的一些性质。


  **Table 9.4** Properties of black liquor.


  | Property | Value |

  |---|---|

  | Density (50% solids) at 93 °C | 1.26 g/cm³ |

  | Viscosity (50% solids at 121 °C) | 5.0 cP |

  | Viscosity (70% solids at 125 °C) | 100.0 cP |

  | Specific heat (40% solids) | 2.0 kJ/(kg·K) |

  | Heating value (35% lignin and 70% solids) | ~14,000 kJ/kg |


  ### 9.7.2.2 BLG Technologies


  BLG 可以在低温或高温下进行，具体取决于工艺是在废制浆化学品的熔化温度范围（650–850 °C）之上还是之下进行（Sricharoenchaikul 2001）。


  低温气化 – 低温气化炉在 600–850 °C 下运行，低于无机物的熔点，从而避免熔盐-水爆炸。高温气化 – 高温气化装置通常在 900–1000 °C 范围内运行并产生熔融熔盐。


  在低温气化中，凝相中的碱盐仍以固体产物存在，而在高温气化中则产生熔融盐。低温气化相对于高温气化具有优势，因为低温气化可实现更好的钠和硫分离。此外，由于产物为固体，低温气化对材料构造的要求较少。然而，低温气化产生的合成气可能含有较大量的焦油，这会污染气净化操作并污染气化炉下游的燃气轮机。这些污染问题可能导致气化炉燃料产品的损失（Patrick
  and Siedel 2003; Sricharoenchaikul 2001）。


  多家公司已进行试验以开发 BLG 的商业可行工艺。Whitty and Baxter (2001) 和 Whitty and Verrill (2004) 对
  BLG 的发展历史进行了非常详细的描述。在寻找回收制浆化学品的替代方法的过程中，气化技术已被多次彻底研究。总共已有超过 20 种不同的技术在过去几年中被研究过（Swedish
  Energy Agency 2008）。最有趣的低温黑液气化（LTBLG）和高温黑液气化（HTBLG）工艺尝试在表 9.5 中列出。目前只有两种技术正在商业化推进：MTCI（Manufacturing
  and Technology Conversion International Company，低温）和 Chemrec（高温）技术。Chemrec，一家瑞典公司，正在开发一种加压、氧气吹入的
  HTBLG 技术，如图 9.18 所示（Chemrec 2006; Whitty 2006; Whitty and Nilsson 2001）。表 9.6 给出了这两种技术的差异。







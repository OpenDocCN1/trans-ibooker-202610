  | 核能 | 5.5–6.0 美元美分/kWh | 放射性物质，公共卫生 |

  | 燃煤发电厂 | 4.8–5.5 美元美分/kWh | CO₂, NOₓ, SO₂, PM₁₀, CO, VOC, TAPs |

  | 柴油发电机 | 10–15 美元美分/kWh | CO₂, NOₓ, SO₂, PM₁₀, CO, VOC, TAPs |

  | 天然气联合循环燃气轮机 | (天然气价格为 $5/MMBtu 时) = 5 美元美分/kWh | CO₂, NOₓ, PM₁₀, CO, VOC, TAPs
  |

  | 简单循环燃气轮机 | 天然气价格为 $5/MMBtu 时 6 美元美分/kWh | CO₂, NOₓ, PM₁₀, CO, VOC, TAPs |


  来源: Energy Ideas Clearinghouse (2018)。


  ## 6.6 案例研究：生物可再生能源与化石燃料发电的 LCA 比较


  对生物质、煤炭和天然气系统进行了一系列 LCA，以量化每种系统的环境效益和弊端。所有这些评估均以从摇篮到坟墓的方式进行，以涵盖发电厂运行所需的所有流程，包括原材料开采、原料制备、运输、废物处置和回收。我们总结了每种系统的能量平衡、GWP、空气排放和资源消耗数据
  (NREL 2011)。


  发电和一般能源消费都会对环境造成后果。利用可再生资源并采用先进技术如整体煤气化联合循环 (IGCC) 可能导致更少的环境破坏，但程度如何，又有哪些权衡？已对各种发电选择进行了
  LCA 研究，以便更好地了解每种技术的环境效益和弊端。


  物料和能量平衡被用来量化发电厂运行所需每个过程的排放、能源使用和资源消耗。这些包括原料采购 (开采煤炭、提取天然气、种植专用生物质、收集残余生物质)、运输、设备和中间材料
  (例如化肥、石灰石) 的制造、发电厂建设、退役以及任何必要的废物处置。


  研究了以下系统：


  - 使用生物质能源作物 (杂交杨树) 的生物质燃烧 IGCC 系统

  - 蒸汽循环的粉煤 (pc) 锅炉，代表美国今天燃煤发电厂的平均水平

  - 共燃生物质残渣与煤炭的系统 (按热输入计 15% 将在此介绍)

  - 使用生物质残渣 (主要为城市) 的直接燃烧生物质发电厂

  - 天然气联合循环 (NGCC) 发电厂。


  每项研究都是独立进行的，因此可以单独成立，给出每种发电技术的完整图景。然而，每种系统的排放、资源消耗和能源需求最终可以相互比较，揭示可再生和化石基系统的环境效益和弊端。


  ### 6.6.1 结果


  #### 6.6.1.1 系统能量平衡


  每个系统消耗的总能量包括燃料能量消耗加上系统消耗的原材料和中间材料的能量。第一类能源使用示例是运输中花费的燃料和化石燃料发电厂消耗的化石燃料。第二类能源是材料在燃烧时释放的能量之和
  (如果它是燃料) 以及将材料输送到使用地点的总能量。这一类能源消耗的示例是化肥制造中天然气的使用和烟气脱硫 (FGD) 中石灰石的使用。燃烧能量计算适用于使用不可再生燃料的情况，反映了燃料被系统消耗的潜在能量。可再生资源的燃烧能量，即以等于或大于消耗速率的速度补充的资源，不从系统的净能量中扣除。这是因为从生命周期来看，资源并未被消耗。为了确定每个系统的净能量平衡，发电厂产生的能量减去每个过程块中使用的能量。每个系统的总系统能量消耗如表
  6.13 所示。


  **表 6.13** 总系统能量消耗。


  | 系统 | 总能量消耗 (kJ/kWh) |

  |---|---:|

  | 平均煤炭 | 12 575 |

  | 天然气联合循环 | 8 377 |

  | 生物质/煤炭共燃 (按热输入计 15%) | 10 118 |

  | 使用杂交杨树的生物质燃烧 IGCC | 231 |

  | 使用生物质残渣的直接燃烧生物质发电厂 | 125 |


  来源: 引自 NREL (2011)。


  为了检查每个系统中消耗最大能量量的工艺操作，定义了两个能量测量参数。首先，计算输送到电网的能量除以每个系统消耗的总化石衍生能量。该指标称为净能量比，有助于评估每单位化石燃料消耗产生的能量。另一个指标，外来能量比，定义为输送到电网的能量除以输送到电厂的总非原料能量



  电厂。也就是说，化石燃料电厂所用煤炭和天然气中包含的能量被排除在外。外部能量比评估的是每消耗一单位上游能量所产生的能量。


  由于生物质中的能量被认为是在系统边界内产生和消耗的，因此对于纯生物质案例（生物质整体煤气化联合循环和直燃生物质），净能量比和外部能量比是相同的。在计算外部能量比时，我们实质上将供给化石燃料电厂的煤炭和天然气视为可再生燃料，以便对上游能量消耗进行比较。每个案例的能量结果如图6.13所示。


  正如预期的那样，纯生物质电厂总体消耗的能量较少，因为化石燃料电厂消耗不可再生的煤炭和天然气导致净能量平衡小于1。直燃生物质残渣案例每消耗单位能量产生的电量最多。这是因为向电厂提供可用的残渣生物质所需的能量相当低。尽管生物质整体煤气化联合循环电厂的发电效率更高，但由于种植专用生物质作物所需的能量，其净能量平衡低于直燃电厂。然而，残渣资源的有限性可能要求将来使用能源作物。将生物质与煤炭混合燃烧比纯燃煤案例的能量比略有提高，尽管电厂效率降低了0.9个百分点。


  在计算外部能量比时，供给电厂的原料被排除在外，实质上将所有原料均视为可再生燃料。由于人们认为生物质燃料的质量低于化石燃料，因此预计化石燃料系统的外部能量比将大大高于生物质系统。然而，事实恰恰相反，这是因为化石燃料系统在上游作业中消耗了大量能量。各系统消耗的非原料总能量如表6.14所示。


  ## 表6.14 非原料能量消耗


  | 系统 | 总能量消耗 (kJ/kWh) |

  | --- | --- |

  | 平均煤炭 | 702 |

  | 天然气整体煤气化联合循环 | 1718 |

  | 生物质/煤炭混合燃烧（按热量输入15%） | 614 |

  | 使用杂交杨树的生物质整体煤气化联合循环 | 231 |

  | 使用生物质残渣的直燃生物质电厂 | 125 |


  资料来源：摘自NREL（2011）。


  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_320_0.png)


  煤炭开采消耗了这部分能量的25%，而煤炭运输占32%。与天然气整体煤气化联合循环系统相关的上游能量消耗中，超过97%来自天然气开采和管道输送环节，包括逃逸损失。虽然生物质系统的上游过程也消耗能量，但较短的运输距离以及无需烟气脱硫（FGD）这一事实降低了总能量负担。


  这里给出的基准案例假设土壤碳没有净变化，因为实际的增加和损失将高度取决于具体地点。在电厂使用残渣的直燃生物质系统具有极高的负温室气体排放率，因为这避免了与生物质分解相关的甲烷产生。根据当前的处理实践，假设直燃和混燃案例中使用的46%的残渣生物质将被送往垃圾填埋场，其余部分将用作覆盖物和其他低价值产品。文献中报道的分解研究被用来确定，如果生物质残渣没有被电厂使用，大约9%的碳最终会变成CH₄，61%变成CO₂。剩余碳在填埋场中抗分解。如果所有残渣生物质都经好氧分解，产生的CO₂将为1.85千克/千克生物质。如果生物质残渣没有在电厂使用，上述分解途径将导致总温室气体排放量为2.48千克CO₂当量/千克生物质（1.117千克CO₂
  + 0.065千克CH₄）。净差异是直燃系统产生负温室气体排放的原因。


  ## 6.6.1.2 全球变暖潜能值


  图6.14显示了这些研究所量化的三种温室气体的净排放量：二氧化碳（CO₂）、甲烷（CH₄）和一氧化二氮（N₂O）。生物质整体煤气化联合循环系统的全球变暖潜能值远低于化石燃料系统，因为在生物质生长周期中吸收了CO₂。敏感性分析表明，即使是中等程度的土壤固碳量（1900千克/公顷/7年轮作周期）也会使生物质整体煤气化联合循环系统实现净零温室气体平衡。超过此值的固碳量将导致温室气体负排放，使系统整体上从大气中清除碳。


  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_321_0.png)


  NGCC电厂在所有化石燃料系统中具有最低的全球变暖潜能值，因为其效率更高，尽管天然气损失增加了净CH₄排放。天然气在开采和输送过程中的损失被假设为开采总量的1.4%。由于甲烷作为温室气体的效力，该系统总全球变暖潜能值的近四分之一来自这些损失。按热量输入15%将生物质与煤炭混合燃烧，使平均燃煤电厂的全球变暖潜能值降低了18%。温室气体减排量大于生物质混燃比例，这是因为避免了与分解相关的甲烷排放，而如果生物质未被电厂使用，这些分解本会发生。该情景下的生物质处置和分解排放与直燃案例中使用的相同。


  ## 6.6.1.3 大气排放


  图6.15绘制了以下排放物：颗粒物、硫氧化物（SOₓ）、氮氧化物（NOₓ）、CH₄、CO₂和非甲烷碳氢化合物（NMHCs）。由于天然气在开采和输送过程中的损失，天然气案例的甲烷排放量较高。直燃生物质和煤炭/生物质混燃案例由于避免了分解过程（填埋和覆盖）而具有负的甲烷排放。生物质案例中的CO和NMHCs较高，这是因为生物质生长和制备过程中上游柴油燃烧所致。混燃使煤炭系统的大气排放按大约混燃的比例降低，但颗粒物除外，颗粒物是在生物质粉碎和处理过程中产生的。


  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_322_0.png)


  ## 6.6.1.4 资源消耗


  图6.16显示了所研究系统消耗的不可再生资源总量。燃煤电厂使用大量石灰石进行烟气脱硫（FGD）。天然气整体煤气化联合循环电厂消耗的资源量几乎可以忽略不计，但原料本身除外，包括在开采和输送过程中损失的部分。


  ## 6.6.2 敏感性分析


  对每个系统进行了敏感性分析，以确定哪些参数对结果影响最大，并找出减少系统环境负担的机会。一般来说，与提高系统效率和减少化石燃料使用相关的参数影响最大。此外，对于生物质系统，与种植专用原料相关的变量以及影响使用生物质残渣避免多少CO₂和CH₄排放的因素显著影响了系统的全球变暖潜能值。然而，总体而言，敏感性分析表明，随着不同参数的变化，从这些研究中可以得出的结论保持相对稳定。


  ## 6.6.3 总结与结论


  很明显，生物质发电系统降低了与发电相关的环境负担。关键比较结果可总结如下：


  - 在整体煤气化联合循环系统中使用专用能源作物发电的全球变暖潜能值，仅为美国平均燃煤发电系统的4.7%。





  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_323_0.png)


  Figure 6.16 Total amount of nonrenewable resources consumed by the systems.


  图 6.16 系统消耗的不可再生资源总量。


  - 以热输入计掺烧 15% 的残余生物质，可使平均燃煤系统的温室气体排放和净能量消耗分别减少 18% 和 12%。

  - 煤和天然气系统的生命周期能量消耗显著低于生物质系统，这是因为消耗了不可再生资源。

  - 不计入这些系统中发电厂消耗的煤和天然气，净能量消耗仍低于生物质系统，这是由于烟气净化、运输以及天然气开采和煤炭开采相关过程所使用的能量。

  - 与化石系统相比，生物质系统产生的颗粒物、NOx 和 SOx 水平非常低。

  - 使用残余生物质时，系统甲烷排放为负值，因为避免了分解排放。

  - 与化石系统相比，生物质系统消耗的自然资源数量非常少。

  - 除了天然气外，天然气 IGCC 消耗的资源量很小。


  这些结果表明总体而言，生物质发电相对于传统化石燃料发电系统具有显著的环境效益。特别是，生物质系统可以显著减少每千瓦时发电产生的温室气体。此外，由于生物质系统使用可再生能源而非不可再生的化石燃料，它们消耗的自然资源非常少，并且具有正的净能量平衡。掺烧生物质与煤炭为减少目前在美国发电量超过一半的燃煤发电系统相关的环境负担提供了机会。最后，通过减少
  NOx、SOx 和颗粒物，生物质发电可以改善煤炭发电的当地空气质量。


  ## 6.7 最佳可行控制技术（环境修复）


  ### 6.7.1 什么是“最佳可行控制技术”？


  最佳可行控制技术（BACT）是《清洁空气法》规定的污染控制标准：


  > ...一种基于受本法监管的每种污染物从任何主要排放设施排放或由此产生的最大程度削减的排放限制，许可机构在逐案考虑能源、环境和经济影响及其他成本的情况下，确定该设施可通过


  应用生产工艺和可用的方法、系统和技术，包括燃料清洁、清洁燃料或处理或创新燃料燃烧技术来实现对每种此类污染物的控制。


  美国环保署确定将用于将特定污染物控制到规定限值的空气污染控制技术。当确定 BACT 时，会考虑诸如能源消耗、总源排放、区域环境影响和经济成本等因素。这是所有受新源审查（NSR）和
  PSD 许可指南管辖的污染源的现行 EPA 标准，并逐案确定。BACT 标准比合理可行控制技术标准严格得多，但比最低可实现排放率标准宽松得多（U.S. EPA,
  2016a）。


  ### 6.7.1.1 合理可行控制技术


  合理可行控制技术（RACT）是 EPA 制定的污染控制标准，用于确定将用于将特定污染物控制到规定限值的空气污染控制技术。RACT 适用于未达到国家环境空气质量标准的受控空气污染物的地区现有源，并且要求所有符合这些标准的源都必须执行。RACT
  标准比 BACT 宽松。


  ### 6.7.1.2 最低可实现排放率


  最低可实现排放率（LAER）由 EPA 用于确定新或改建的主要固定源的排放是否符合 SIP 指南。LAER 标准在新固定源位于未达标空气质量区域时要求（见图 4.14）。它是高于最佳可行控制技术和合理可行控制技术标准的空气污染最严格标准。


  ### 6.7.1.3 基于生命周期的环境法


  生命周期概念越来越多地成为环境法规的一部分，尤其是涉及温室气体排放的法规。现在 LCA 通常用于碳核算的写作中。在人们对气候变化日益担忧的时代，个人、组织和政府机构都渴望衡量温室气体的释放和影响。例如，各种政府机构正在制定规范燃料生产和使用相关温室气体排放的方法。例如，《能源独立与安全法》（HR
  6）2007 年（EISA 2007）旨在：使美国朝着更大的能源独立和安全迈进；增加清洁可再生燃料的生产；保护消费者；提高产品、建筑物和车辆的效率。各州也在实施温室气体排放法规（USEPA
  2010）。例如，2006 年加州全球变暖解决方案法案导致制定了法规，规定运输燃料的生命周期温室气体排放限值。加州低碳燃料标准和 EISA 第 526 条均要求对运输燃料的温室气体排放进行生命周期评估，这已成为考虑温室气体排放的常见方法（Allen
  et al. 2009）。


  ### 6.7.1.4 生命周期最佳控制技术


  正在出现许多定量工具，使生命周期评估和分析成为可能，并随后为选择 PSD、NPDES 和其他环境许可程序的最佳可行控制技术提供指导。我们许多环境法都基于风险框架。现在，在环境许可程序中做出的基于生命周期的最佳控制技术决策不仅纳入健康和环境，还纳入经济和社会影响。接下来，我们将介绍一个发电设施
  BACT 的案例研究。


  ## 6.8 BACT：应用于燃气轮机发电厂


  在美国，BACT 包括实现受联邦法规管辖的任何拟建主要固定源或其主要改建排放的污染物最大程度削减所需的设备和方法。受 PSD 法规审查并要求进行 BACT 分析的污染物包括氮氧化物（NOₓ）、一氧化碳（CO）、直径小于或等于
  10 μm 的颗粒物（PM₁₀）和 VOC。所有 PM 都被假定为 PM₁₀。BACT 审查遵循 USEPA 推荐的“自上而下”方法。自上而下过程要求确定给定污染物的所有可用控制技术并按控制有效性降序排列。许可申请人应首先检查排名最高的（“顶部”）选项。除非许可申请人向许可机构证明，技术考虑或能源、环境或经济影响证明最高排名的技术在该情况下不可“实现”，否则应将最高排名的选项确定为
  BACT。如果以这种方式消除最有效的控制策略，则应评估下一个最有效的替代方案，依此类推，直到选择一个选项作为 BACT。


  USEPA 已将此分析过程分为以下五个步骤：


  - Step 1: Identify all available control technologies

  - Step 2: Eliminate technically infeasible options

  - Step 3: Rank remaining control technologies

  - Step 4: Evaluate most effective controls and document results

  - Step 5: Select the BACT


  如果没有单一的行业 BACT，则根据具体情况确定，考虑成本效益、经济、能源、环境以及拟议解决方案的其他影响。BACT 分析中的三个重要术语是 PSD、“显著排放率”（SER）以及环境空气质量分析和国家环境空气质量标准（NAAQS）。PSD
  计划的目的是实施联邦《清洁空气法》关于防止空气质量“显著”恶化的要求。这些确保拟议新建工业设施的许可和相关的经济增长以与保护清洁空气资源一致的方式进行。该计划为实施
  BACT、保护国家公园等风景区以及知情公众参与提供了特别强调。SER 指净排放增加或源排放污染物的潜力，SER 等于或大于《联邦法规》第 40 篇第 51 条所列的速率。必须对每种受监管污染物进行环境空气质量分析，并必须证明该源不会导致或促成任何适用
  NAAQS 的违反。


  随着工业的老化和扩张，它们会获得污染物的新排放并修改旧排放。联邦法律要求对每个此类新或更改的“主要固定源”单元进行 BACT 分析。主要固定源的定义见《联邦法规》第
  40 篇第 51 部分第 1 分部，新源和改建审查审查——任何固定源（1）在《清洁空气法》下排放或有排放潜力（PTE）250t/Y 或更多任何污染物；或（2）在
  28 个来源类别之一下排放或有 PTE 100t/Y 或更多受监管污染物（《联邦法规》第 40 篇）。


  USEPA 一直将法定和法规 BACT 定义解释为包含两个核心要求，机构认为任何 BACT 决定都必须满足。首先，BACT 分析必须考虑最严格的可用技术（即提供“最大程度排放削减”的技术）。其次，任何要求较低程度排放削减的决定都必须通过对“能源、环境和经济影响”的客观分析来证明。


  BACT 必须至少与适用于排放源的任何新源性能标准（NSPS）一样严格。以这组数据为基线，BACT 分析通常通过 EPA 推荐的所谓自上而下方法进行。第一步是确定所讨论的排放单元是否与类似或相同的源或源类别最严格的控制可用。如果可以证明该控制水平对所讨论的单元在技术上不可行，则确定下一个最严格的控制水平并同样进行评估。此过程一直持续到所考虑的

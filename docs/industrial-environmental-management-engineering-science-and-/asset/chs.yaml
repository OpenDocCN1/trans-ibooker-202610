- '## Appendix B

  ### International Environmental Law


  Following are the most commonly used abbreviations and acronyms for treaty research
  in international environmental law:


  - Agenda 21: Program of Action for Sustainable Development (Agenda 21)

  - Aarhus Convention: Convention on Access to Information, Public Participation in
  Decision-Making, and Access to Justice in Environmental Matters

  - Basel Convention: Basel Convention on the Control of Transboundary Movements of
  Hazardous Wastes and Their Disposal

  - Basel Ban Amendment: Protocol on Liability and Compensation for Damage Resulting
  from Transboundary Movements of Hazardous Wastes and Amendment of Annex B

  - Biodiversity Convention: Convention on Biological Diversity (CBD)

  - Bunkers Convention: International Convention on Civil Liability for Bunker Oil
  Pollution Damage (BUNKER): International Maritime Organization

  - Cartagena Protocol: Cartagena Protocol on Biosafety to the Convention on Biological
  Diversity

  - CCAMLR: Commission for the Conservation of Antarctic Marine Living Resources

  - CCSBT: Convention for the Conservation of Southern Bluefin Tuna

  - CITES: Convention on the International Trade in Endangered Species of Wild Fauna
  and Flora

  - CLC: Convention on Civil Liability for Oil Pollution Damage

  - Climate Change Convention: United Nations Framework Convention on Climate Change

  - Kyoto Protocol: Kyoto Protocol to the United Nations Framework Convention on Climate
  Change

  - LRTAP: Long-Range Transboundary Air Pollution, Geneva Convention


  - Montreal Protocol: Montreal Protocol on Substances that Deplete the Ozone Layer

  - NAAEC: North America Agreement on Environmental Cooperation

  - OLDEPESCA: Agreement Instituting the Latin American Organization for Fisheries
  Development

  - OSPAR Convention: Convention for the Protection of the Marine Environment of the
  Northeast Atlantic

  - Paris Convention: Paris Convention on Third-Party Liability in the Field of Nuclear
  Energy

  - POPs: Persistent Organic Pollutants, World Health Organization

  - Rio Declaration: Rio Declaration on Environment and Development, UNCED

  - Stockholm Convention: Stockholm Convention on Persistent Organic Pollutants (POPs)

  - UNCCD: United Nations Convention to Combat Desertification

  - UNCLOS: United Nations Convention on the Law of the Sea

  - UNEP: United Nations Environmental Program

  - UNFCCC: United Nations Framework Convention on Climate Change

  - Vienna Convention: Convention for the Protection of the Ozone Layer

  - Wetlands Convention: Convention on Wetlands of International Importance Especially
  as Waterfowl Habitat: UNESCO Constitution


  Because of the many possible subtopics available for international environmental
  laws, it is helpful to have a table (see the following) of agreements and websites
  (accessed on 4 and 5 January 2019) that are research-based on the eight subtopics
  of hazardous waste, nuclear waste, ocean and marine sources, ozone and protection
  of the atmosphere, pollution, protection of species and wildlife, sustainable development,
  and trade and the environment.







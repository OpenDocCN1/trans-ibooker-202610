  \ 理想气体定律和气体中浓度测量\n\n在正常条件下，干燥的大气空气大约含有78.08%的氮气、20.94%的氧气、0.93%的氩气、0.04%的二氧化碳以及痕量的其他气体。对于气体，百分比通常表示为体积百分比。对于理想气体（大气空气近似为理想气体），体积百分比与摩尔百分比相同。回想一下，理想气体是满足理想气体定律的气体\n\
  \n```\nPV = nRT (3.5)\n```\n\n其中\nP = 绝对压力\nV = 体积\nn = 摩尔数\nR = 理想气体定律常数\nT = 绝对温度\n\
  \n所有项的单位必须一致。常见的一组单位是P以atm计，V以升计，n以gmol计，T以开尔文计。对于这组单位，R的值为0.082061-atm/gmol-K。\n\
  \n理想气体定律对空气污染工程师非常重要，因为它易于理解且在正常温度和压力下相当准确。理想气体定律也可以写成\n\n```\nρV = M / M.W. RT\
  \ (3.6)\n```\n\n其中\nM = 样品质量\nM.W. = 气体的分子量\n\n方程（3.5）和（3.6）可以重新排列以给出理想气体的质量密度为\n\
  ρ = M / V = M.W. / RT (3.7)\n\n使用前面提到的单位集，以及分子量单位为克每摩尔，密度ρ的单位为克每升。\n\n请注意，表3.9中列出的NAAQ标准以ppm或微克每立方米（µg/m³）为单位。这些是空气污染工作中常见的浓度测量单位，对于气体污染物而言，它们通过理想气体定律相互关联，如本节后面所示。首先，让我们简要回顾ppm的含义。浓度测量ppm只是污染物在气体混合物中的摩尔分数或体积分数乘以1\
  \ 000 000的因子；即，\nppm = Volume of pollutant gas / Total volume of gas mixture (10⁶)\
  \ (3.8)\n\n请注意，式（3.8）中的分母是气体的总体积，而不仅仅是空气的体积。结果在低浓度下相似，但并不完全相同，如以下示例问题所示。\n\n## 示例3.5\
  \ （a）恰好500.0 ml一氧化碳（CO）与999 500 ml空气混合。计算所得CO浓度为ppm。\n\n## 解答\n\n使用式（3.8），\n500\
  \ ml / (999500 ml + 500 ml) (10⁶) = 500.0 ppm\n\n(b) 恰好500.0 ml CO与1.000 m³（1 000\
  \ 000 ml）空气混合。计算所得CO浓度为ppm。\n\n## 解答\n\n500 / (1000000 + 500) (10⁶) = 499.75 ppm\n\
  \n对于工程目的，示例3.4中的结果可能被认为相同，但在从几个百分点向上（2.0% = 20 000 ppm）的浓度范围内，对定义的误解会导致显著错误的答案。\n\
  \n回想一下，空气污染工作中常用的两种浓度测量是ppm和µg/m³。通过使用理想气体定律，将ppm转换为µg/m³相对简单。然而，必须指定温度和压力，因为气体在空气污染工作中可能占据不同的体积；参考条件通常选为25\
  \ °C和1.0 atm。\n\n首先求解理想气体定律得到污染物的体积，然后求解总体积并关联这两个体积，我们得到体积分数为\nVₚ / Vₜ = nₚ RT /\
  \ P / nₜ RT / P (3.9)\n\n其中下标p和t分别表示污染气体和总体气体。认识到nₚ仅为Mₚ / M.W.ₚ，式（3.9）可重新排列为\nMₚ\
  \ = nₜ Vₚ / Vₜ M.W.ₚ (3.10)\n\n或，代入nₜ，\nMₚ = P Vₜ / RT Vₚ / Vₜ M.W.ₚ (3.11)\n\n\
  污染物的质量浓度为\nMₚ / Vₜ = P Vₜ / RT Vₚ / Vₜ M.W.ₚ (3.12)\n\n当P = 1.0 atm，T = 298 K（25\
  \ °C），R = 0.08206 l-atm/gmol-K时，则P/RT的值为0.0409 gmol/l，即在所述条件下理想气体摩尔体积的倒数。\n\n式（3.12）给出的质量浓度单位为g/l，这对于报告空气中污染物浓度来说不是最方便的单位。为了获得更常见的µg/m³单位，式（3.12）左侧必须乘以10⁹的因子（10³\
  \ l/m³和10⁶ µg/g的乘积）\n1.0 g/l × 10⁶ µg/g × 10³ l/m³ = 10⁹ µg/m³\n\n此外，为了将ppm代入式（3.12）作为体积分数，必须除以（10）⁶的因子，因为ppm在数值上比体积分数大一百万倍。净效果是将式（3.12）右侧乘以1000的因子。因此，以我们期望的形式，式（3.12）变为\n\
  在25°C时，C_mass（µg/m³）= 1000 C_ppm MW_p / 24.45\n\n\n\n\n\n请记住，在空气污染工作中，通常将标准温度定义为25°C（298K）。此时，理想气体每摩尔体积在T\
  \ = 0°C（273K）和P = 1 atm下的值为22.4L/mol。\n\n因此，最终版本为\n\n```\n$$ C_{\\mathrm{mass}}\
  \ \\left( \\mu \\mathrm{g} / \\mathrm{m}^{3} \\right)=40.9 C_{\\mathrm{ppm}} \\\
  mathrm{MW}_{\\mathrm{P}} \\text{at } 25^{\\circ} \\mathrm{C}\\left(298 \\mathrm{~K}\\\
  right) \\quad \\text{(3.13)} $$\n```\n\n其中 $ C_{\\mathrm{mass}} $ = 质量浓度（μg/m³），$\
  \ C_{\\mathrm{ppm}} $ = 体积浓度（ppm）。\n\n**例 3.6** (a) 臭氧（8小时平均时间）的国家空气质量标准（AAAQS）是多少，以μg/m³表示？\
  \ (b) 在一个工业区观察到二氧化硫的平均日浓度为410 μg/m³，条件为25°C和1 atm。二氧化硫的24小时平均浓度以ppm表示是多少？\n\n# 解答\n\
  \n+   (a) 臭氧标准为0.075 ppm。使用公式(3.13)，\n\n```\n$$ C_{\\mathrm{mass}}=\\left(40.9\\\
  right)\\left(0.075\\right)\\left(48.0\\right)=147 \\mu \\mathrm{g} / \\mathrm{m}^{3}\
  \ \\text{at } 25^{\\circ} \\mathrm{C} . $$\n```\n\n+   (b) 二氧化硫的分子量为64.0。重新排列公式(3.13)以求解二氧化硫的ppm浓度，我们得到\n\
  \n```\n$$ \\mathrm{SO}_{2} \\mathrm{ppm}=\\frac{410}{\\left(40.9\\right)\\left(64.0\\\
  right)}=0.157 \\mathrm{ppm} $$\n```\n\n该二氧化硫浓度高于基于24小时平均值（见表3.9）的国家空气质量标准（NAAAQ）一级标准0.14\
  \ ppm。\n\n**例 3.7** 发现在24小时期间内大气中灰尘（颗粒物，PM-10）的最大浓度为每干燥标准立方英尺0.000128英两（gr/dscf）。等效的μg/m³浓度是多少？\n\
  \n# 解答\n\n根据表A.1，1 lb = 7000 gr = 454.4 g，且1 ft³ = 0.028 33 m³。因此，1 gr/ft³ 等于2.29\
  \ g/m³。于是，\n\n```\n$$ \\begin{aligned} & \\text { Concentration }=0.000128 \\mathrm{gr}\
  \ / \\mathrm{ft}^{3} \\\\ & \\times\\left(2.29 \\mathrm{~g} / \\mathrm{m}^{3}\\\
  right)\\left(1 \\mathrm{gr} / \\mathrm{ft}^{3}\\right)\\left(10^{6} \\mu \\mathrm{g}\
  \ / \\mathrm{g}\\right)=293 \\mu \\mathrm{g} / \\mathrm{m}^{3} . \\end{aligned}\
  \ $$\n```\n\n该值相对较高，超过了基于24小时平均值（见表3.9）的国家环境空气质量标准（NAAAQ）24小时环境标准150 μg/m³。\n\n\
  ## 3.11 理想气体定律的其他应用\n\n如第3.10节所述，理想气体定律对空气污染工程师至关重要。遵守联邦和州法律不仅要求适当的环境工程设计及污染控制设备的运行，还需要仔细分析并准确测量特定污染物和环境质量参数。在设计过程及其他类型的计算中，完全理解理想气体定律的工程师可以用较少的时间实现更高的准确性。在本节中，通过示例问题，我们将回顾理想气体定律的各种用途。\n\
  \n排放采样是另一个领域，理解理想气体定律以及用于测量气体流量的设备在此非常重要。许多性能不佳的系统并非设计实践不佳的结果，而是采样技术欠佳所致。\n\n气体采样的一些重要考虑因素包括设备校准、泄漏、样品处理（凝结、吸附）、工艺操作波动以及工艺流体的代表性采样。我们将在下面的示例中探讨其中一些考虑因素。\n\
  \n当公式(3.5)首次提出时，给出了针对特定单位组的一个常用R值。根据所选的P、T、V和n的单位，R有许多不同的数值。表C.3列出了R的几种可能值，并在例3.8中展示了其中一个值的推导过程。\n\
  \n**例 3.8** 已知理想气体在273.15K和1.000 atm下的摩尔体积为22.4136 L/gmol，计算R在mm Hg-ft³/lbmol-R单位下的值。\n\
  \n# 解答\n\n```\n$$\\begin{gathered} R=\\frac{P V}{n T}=\\left(\\frac{V}{n}\\right)\
  \ \\frac{P}{T} \\\\ R=\\frac{22.4136 l \\quad 1.000 \\mathrm{atm} \\quad 1 \\mathrm{ft}^{3}\
  \ \\quad 453.6 \\mathrm{gml}}{\\mathrm{gmol} \\quad 273.15 \\mathrm{~K} \\times\
  \ 28.3161 \\quad 11 \\mathrm{lbmol}} \\\\ \\times \\frac{760.0 \\mathrm{mmHg}}{1.000\
  \ \\mathrm{~K} \\times 1.800 \\mathrm{R}^{2}} \\\\ \\times \\frac{1.000 \\mathrm{atm}}{760.0\
  \ \\mathrm{mmHg}} \\times \\frac{1.800 \\mathrm{R}^{2}}{1.800 \\mathrm{R}^{2}} \\\
  \\ =555.0 \\mathrm{mmHg}-\\mathrm{ft}^{3} / \\mathrm{lbmol}-\\mathrm{R} \\end{gathered}$$\n\
  ```\n\n在此示例问题中，使用了比工程计算中通常使用更多的小数位。工程师通常满足于仅三或四位有效数字。事实上，来自现场测量的数据往往只精确到两位有效数字。在具备口袋计算器和个人电脑的时代，获得八位小数位的数值答案已成为常规，理解我们所处理数字的重要性变得至关重要。当需要且合理的高精度和高精密度时，应使用较多的小数位。然而，在许多设计问题中，方程由经验关系式修正，必须视为近似值。\n\
  \n理想气体混合物的加权平均分子量是使用摩尔分数或体积分数（而非质量分数）作为加权因子计算的。这在下面的示例问题中有所说明。\n\n# 例 3.9 干燥空气可被视为78.0%氮气（分子量\
  \ = 28.0），21.0%氧气（分子量 = 32.0）和1.0%氩气（分子量 = 40.0）。计算空气的平均分子量。\n\n# 解答\n\n```\nM.W._avg\
  \ = 0.78(28) + 0.21(32) + 0.01(40) = 28.96\n```\n\n理想气体混合物的密度是纯组分密度的摩尔平均值。密度也可以通过在公式(3.8)中使用气体混合物的摩尔平均分子量来计算，如下一个例子所示。注意，气体密度取决于压力和温度。\n\
  \n# 例 3.10 计算空气在标准条件（T = 25°C 且 P = 1 atm）下的密度。\n\n# 解答\n\n```\nρ_N₂ = (1.00)(28.0)\
  \ / [(0.08206)(298)] = 1.145 g/l\nρ_O₂ = (1.00)(32.0) / [(0.08206)(298)] = 1.309\
  \ g/l\nρ_Air = (1.00)(40.0) / [(0.08206)(298)] = 1.636 g/l\nρ_Air = 0.78(1.145)\
  \ + 0.21(1.309) + 0.01(1.636) = 1.184 g/l\n```\n\n或者，\n\n```\nρ_Air = (1.00)(28.96)\
  \ / [(0.08206)(298)] = 1.184 g/l\n```\n\n## 3.12 气体流量测量\n\n在特定温度和压力下，固定摩尔数的气体占据特定体积。如果改变这些固定摩尔数的压力和温度，则新的体积可以轻松计算。公式(3.5)可以写成如下形式：\n\
  \n```\nPV/T = nR  (3.14)\n```\n\n由于在这种情况下n是常数，将公式(3.14)应用于两组条件得到\n\n```\nP_old V_old\
  \ / T_old = P_new V_new / T_new  (3.15)\n```\n\n或\n\n```\nV_new = V_old P_old /\
  \ P_new = T_new / T_old  (3.16)\n```\n\n只要考虑范围内的摩尔数保持恒定，公式(3.16)可以应用于静态系统或流动系统。\n\
  \n# 例 3.11 正在从烟囱中抽取干燥气体样品流。烟囱气体温度为200°C，压力为730 mmHg。流体流经加热的过滤器、一组冷却的冲击瓶、一个小气泵，然后通过流量计。测定流量为20°C和790\
  \ mmHg下30.0 L/min。(a) 计算通过过滤器的实际体积流量（在T = 200°C且P = 730 mmHg下）。(b) 如果在30分钟内过滤器上收集到1.42\
  \ mg固体颗粒，计算烟囱气体中颗粒的浓度（以µg/m³为单位）。\n\n# 解答\n\n(a) Q_filter = (30.0)(790/730)(473/293)\
  \ = 52.4 L/min\n\n(b) 采样气体的总体积（在烟囱条件下）：52.4 L/min × 1m³/1000L × 30 min = 1.57 m³\n\
  C_part. = 1.42 mg / 1.57 m³ × 10 µg / 1 mg = 904 µg / m³\n\n在前面的示例问题中，如果在流出流量计的气体中测得例如500\
  \ ppm的NO₂，我们可以声明烟囱中的浓度也是500 ppm。原因是ppm是相对浓度的度量，随着气体样品总体积的变化，NO₂的体积也会相应变化。\n\n\n\n\
  \n\n相对体积的 NO₂（相对于总量）不会改变。然而，如果从烟气取样流中移除了一些在烟囱中呈气态的物质的摩尔数（例如在吸收瓶中冷凝的水），我们必须考虑在两个位置（吸收瓶上游与下游）的相对气体浓度变化。这在以下示例问题中显示。\n\
  \n在其他氧气水平下的浓度，使用以下方程（式 3.16）：\n\n```\nConc[3% O₂] = Conc[m% O₂] [ (20.9 − 3.0) /\
  \ (20.9 − m% O₂) ] (3.18)\n```\n\n其中 m% O₂ 为非标准氧气浓度。要计算 15% O₂ 下的浓度，将 15.0 代入式 (3.18)\
  \ 中的 3.0。\n\n## 3.13 标准温度和压力下的流量\n\n在已知流体的实际温度和压力的情况下，可以确定标准温度和压力（STP）下的流量。使用 EPA\
  \ 的标准条件 20°C（68°F），STP 下的流量为：\n\n```\nFlow at STP = (Dry gas flow) ( Pₘ / 14.7 psi\
  \ ) ( 528°R / Tₘ ) (3.17)\n```\n\n其中 Pₘ 为 psi 单位的测量压力，Tₘ 为 °R 单位的测量温度（°R = 460 +\
  \ °F）。\n\n## 3.14 从 SCFM 到 ACFM 的气体流量转换\n\n例 3.12 对于一台锅炉，完全燃烧甲烷需要 200 lb-mol/h 的\
  \ STP 空气。烟囱条件下 800°F、1 atm 时的实际每分钟流量是多少。\n\n# 解\n\n```\n200 lb-mol/h of air = 200\
  \ × 392 = 78 400 ft³/h = 78 400 / 60 = 1 306.7 ft³/min (SCFM) (1 lb-mol of air at\
  \ STP = 392 ft³)\n```\n\n```\nACFM at 800°F = (1306.7) ( (460 + 800) / (460 + 77)\
  \ ) = 3066 ACFM of air (answer)\n```\n\n## 3.15 百分比 O₂ 的校正\n\n为了参照燃烧源排放，通常需要对百分比\
  \ O₂ 进行校正。对于锅炉，比较在 3% 氧气下进行，与锅炉燃烧器接近化学计量条件一致。对于燃烧涡轮，比较在 15% 氧气下进行，与燃烧涡轮中过量空气流量较大一致。为了校正\n\
  \n## 3.16 锅炉烟气浓度通常校正至 3% 氧气\n\n例 3.13 烟气中颗粒物测得为 0.045 gr/干标准立方英尺（dscf），烟气氧气浓度为体积比\
  \ 7%。3% 氧气下的颗粒物浓度是多少？\n\n# 解\n\n```\nConc₃% = Concₓ% [ (20.7% − 3%) / (20.7% − X%)\
  \ ] = 0.045 grains/dscf [ (20.7% − 3%) / (20.7% − X%) ] = 0.045 grains/dscf [ 17.7%\
  \ / 13.7% ] Conc₃% = 0.058 grains/dscf at 3% O₂\n```\n\n## 3.17 空气-燃料比和化学计量比\n\n\
  在碳氢燃料的燃烧中，准确计算空气-燃料质量比（AFR）非常重要。然后，化学计量比（SR）可定义为实际 AFR 除以化学计量 AFR，如以下方程所示：\n\n```\n\
  SR = (A / F)ₐcₜᵤₐₗ / (A / F)ₛₜₒᵢcₕ (3.19)\n```\n\n碳氢化合物的完全燃烧产生 CO₂，这是快速燃烧的理想方面，尽管\
  \ CO₂ 也是全球变暖的因素。以下方程显示了反应：\n\n```\nCₓHᵧ + (4x + y)/4 O₂ → x CO₂ + y/2 H₂O (3.20)\n\
  ```\n\n从实际角度来看，不考虑 CO₂ 对全球变暖的灾难性影响，式 (3.7) 是理想的反应。该反应释放了碳氢化合物的全部反应热。\n\n燃烧研究经常使用过量空气百分比、SR\
  \ 和当量比等术语。过量空气百分比是实际使用的空气质量与理论值之差除以理论值乘以 100。SR 是理论燃料/空气质量比与实际燃料/空气质量比之比。当量比是 SR\
  \ 的倒数。空气为 21% O₂ 和 79% N₂。\n\n# 例 3.14 一座固废发电厂燃烧由 C₅₀H₁₀₀O₄₀N 表示的固体废物。该厂每天燃烧 100T\
  \ 固体废物，产生 20T/天残渣，含碳 5%。(a) 如果固体废物在空气不足条件下燃烧，每天产生多少 CO？(b) 如果固体废物在 20% 过量空气下燃烧，每天产生多少\
  \ CO₂？(c) 化学计量比和当量比是多少？假设燃料氮转化为 NO。\n\n# 解\n\n(a) 由于 H₂O 中 H 与 O 的比例为 2 : 1，根据 C₅₀H₁₀₀O₄₀N\
  \ 的式子，固体废物中 H₂O 的 H 为 2(40) = 80。因此，固体废物中碳氢化合物部分的 H 为 100 – 80 = 20。故 CₓHᵧ = C₅₀H₂₀。\n\
  \nC₅₀H₂₀ + 30O₂ → 50CO + 10H₂O\n\n氧的氧化态从 0 变为 −2，涉及总共 30(2)(2) = 120 mol 电子。因此，参考物种数\
  \ = 120 mol 电子。\n\n固体废物中 C 的重量分数 = 50C / C₅₀H₁₀₀O₄₀N = 50(12) / [50(12)+100(1.008)+40(16)+14]\
  \ = 600 / 1354.8 = 0.44\n\n燃烧为气体的碳 = 100(0.44) – 20(0.05) = 43T/天（即 C₅₀H₂₀ 中 C₅₀\
  \ 的燃烧为气体的碳）。\n\nC₅₀H₂₀ 中 C₅₀ 的当量重量 = C₅₀ / 120 = 50(12) / 120 = 5.0 T / T-当量。\n\n\
  因此，\n\n吨 CO / 天 = 43/5.0 [50(CO)/120] = 43/5.0 [50(12+16)/120] = 100.3（答案）\n\n(b)\
  \ C₅₀H₂₀ + 55O₂ → 50CO₂ + 10H₂O\n参考物种 = 55(2)(2) = 220 mol 电子\n\nC₅₀H₂₀ 中 C₅₀ 的当量重量\
  \ = C50 / 220 = 50(12) / 220 = 2.73 T / T-当量。\n\n吨 CO₂ / 天 = 43/2.73 [50(CO₂)/220]\
  \ = 43/2.83 [50(12+32)/220] = 157.51（答案）\n\n(c) C₅₀H₁₀₀O₄₀N + 111/2 (=55.5)O₂ →\
  \ 50CO₂ + 50H₂O + NO₂\n\n化学计量燃料/空气比 = C₅₀H₁₀₀O₄₀N / [55.5O₂ + (79/21)(55.5)N₂] =\
  \ 1354.8 / [55.5(32)+(79/21)(55.5)(28)] = 1354.8 / 7622 = 0.18\n\n实际燃料/空气比 = 1354.8\
  \ / [7622(1.2)] = 0.15\n\n化学计量比 = 0.18 / 0.15 = 1.2（答案）\n\n当量比 = 1 / 化学计量比 = 1 /\
  \ 1.2 = 0.83（答案）\n\n## 3.18 物料平衡和能量平衡\n\n物料平衡，也称为质量平衡和能量平衡，是将质量和能量守恒应用于物理系统分析的应用。工艺和设备选择与尺寸确定需要对每个单元进出所有物料和能量流量的完整了解。通过核算进入和离开系统的物料和/或能量，可以识别出可能在没有这种技术的情况下未知或难以测量的质量和/或流量。分析系统中使用的精确守恒定律取决于问题的背景，但都围绕质量和能量守恒，即物质或能量不能自发地被破坏或创造（Haugen\
  \ et al. 1954; Himmelblau 1998）。\n\n引用的质量平衡的一般形式是进入系统的质量必须通过质量守恒，要么离开系统，要么在系统中积累。\n\
  \n积累 = 输入 − 输出 + 净生成  (3.21)\n\n对于稳态操作，所有操作参数与时间无关，式 (3.21) 变为\n\n0 = 输入 − 输出 +\
  \ 净生成  (3.22)\n\n因此，质量平衡在工程和环境分析中被广泛使用。例如，质量平衡理论用于设计化学反应器，分析生产化学品的替代工艺，以及模拟污染物扩散和其他物理系统的过程。在大多数情况下，式\
  \ (3.21) 描述了为稳态操作设计的污染控制设备周围的物料和能量平衡。焚烧炉、直燃式干燥机和吸附器设计中由于热量产生和/或单元内污染物积累而遇到的例外情况。\n\
  \n在环境监测中，术语预算计算用于描述用于评估监测数据（比较输入和输出等）的质量平衡方程。在生物学中，代谢组织的动态能量预算理论明确使用了质量和能量平衡。\n\n\
  执行物料和能量平衡计算时，以下步骤有帮助：\n\n- 1) 绘制工艺草图\n- 2) 识别并标记所有进入和流出的流\n- 3) 在草图上标记所有相关数据\n-\
  \ 4) 在涉及平衡的工艺部分周围画一条虚线包络\n- 5) 选择合适的计算基准。\n\n# 例 3.15 HAPs 的物料平衡问题\n\n一家制造公司在首次审核中收集了以下数据。估算该公司\
  \ VOCs 的年空气排放量为 kg。\n\n采购部门记录\n材料 | 采购数量（桶）\n二氯甲烷（CH₂Cl₂） | 228\n三氯乙烯（C₂HCl₃） |\
  \ 505\n\n废水处理厂进水\n材料 | 平均浓度（mg/l）\nCH₂Cl₂ | 4.04\nC₂HCl₃ | 3.25\n（废水处理厂平均进水流量为 0.076\
  \ m³/s）\n\n危险废物清单\n材料 | 桶数 | 浓度\nCH₂Cl₂ | 228 | 25\nC₂HCl₃ | 505 | 80\n\n年末未使用桶数\n\
  CH₂Cl₂ | 8\nC₂HCl₃ | 13\n\n# 解\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_121_0.png)\n\
  \n物料平衡方程为\n\nM_purchase = M_air + M_ww + M_ww + M_accom\n\n求解该方程得到 M_air，即估计的 VOC\
  \ 排放量。\n\n首先，我们计算购买的质量。以下给出每种化合物的密度。\n\n# 购买质量\n\nM(CH₂Cl₂) = (228 barrels / year)(0.12\
  \ m³ / barrel)(1326 kg / m³) = 36 279.36 kg / year\nM(C₂HCl₃) = (505 barrel / year)(0.12\
  \ m³ / barrel)(1476 kg / m³) = 89 445.60 kg / year\n\n现在我们计算废水处理厂接收到的质量（注意 mg/l\
  \ = g/m³）。\n\nM(CH₂Cl₂) = (4.04 g / m³)(0.076 m³ / s)(86400)(365)(10⁻³) = 9 682.81\
  \ kg / year\nM(C₂HCl₃) = (3.25)(0.076)(86400)(365)(10⁻³) = 7 789.39 kg / year\n\n\
  \n\n\n\n州监管机构允许贵设施每年向空气中排放 200 kg 三氯乙烯。使用物料平衡，证明该工厂满足此监管标准。\n\n## 解决方案\n\n一年期间的废物输入：\n\
  $(10\\,000\\,000 \\text{ L}) (130 \\text{ mg/L}) (1 \\text{ kg} / 1\\,000\\,000\
  \ \\text{ mg})$\n$+ (5\\,000\\,000 \\text{ L}) (210 \\text{ mg/L}) (1 \\text{ kg}\
  \ / 1\\,000\\,000 \\text{ mg})$\n$+ (5\\,000\\,000 \\text{ L}) (200 \\text{ mg/L})\
  \ (1 \\text{ kg} / 1\\,000\\,000 \\text{ mg}) = 3350 \\text{ kg}$\n\n一年期间的废物输出：\n\
  $(2200 \\text{ L}) (900 \\text{ g/L}) (1 \\text{ kg} / 1000 \\text{ g})$\n$+ (1400\
  \ \\text{ L}) (900 \\text{ g/L}) (1 \\text{ kg} / 1000 \\text{ g}) = 3240 \\text{\
  \ kg}$\n\n因此，挥发性损失 $= 3350 - 3240 = 110 \\text{ kg}$（一年期间）\n\n**答案：** 由于挥发性损失小于\
  \ 200 kg/年，该工厂满足监管标准。\n\n## 例 3.18 一座 600 MW 燃煤电厂的整体热效率为 38%。它燃烧的煤的热值为 12 000 Btu/lb，灰分含量为\
  \ 5%，硫含量为 3.0%，CO₂ 排放因子为 220 lb/百万 Btu。计算排放到环境中的热量（Btu/s）、煤进料速率（T/天）、为满足 0.15 lb\
  \ SO₂/百万 Btu 热输入的排放标准所需的二氧化硫控制程度（%）以及 CO₂ 排放速率（MT/天）。\n\n已知：\n- 净功率输出 = 600 MW\n\
  - 热效率 = 0.38\n- 煤热值 = 12 000 Btu/lb\n- 煤灰分含量 = 0.05\n- 煤硫含量 = 0.03\n- CO₂ 排放因子 =\
  \ 220 lb/10⁶ Btu\n\n## 解决方案\n\n计算热排放（Btu/s）\n净功率输出 = 5.687 × 10⁵ Btu/s\nHeat_out\
  \ = Power_in / Net_power_output = 9.279 × 10⁵ Btu/s\n\n计算煤进料（T/天）\nCoal_feed_rate\
  \ = Power_in / Coal_heating_value = 5.388 × 10³ T/day\n\n计算 SO₂ 去除要求：\n$S + O_2\
  \ \\rightleftharpoons SO_2$\n$SO_2 \\text{ standard} = 0.15 \\text{ lb}/10^6 \\\
  text{ Btu}$\n\n$SO_2 \\text{ from coal} = \\text{Coal sulfur content} \\times 64\
  \ \\text{ lb} / 32 \\text{ lb} = 0.06 \\text{ lb/lb}$\n$SO_2 \\text{ standard units}\
  \ = SO_2 \\text{ from coal} / \\text{Coal heating value} = 5 \\text{ lb}/10^6 \\\
  text{ Btu}$\n\n$SO_2 \\text{ removal percentage} = (SO_2 \\text{ standard units}\
  \ - SO_2 \\text{ standard}) / SO_2 \\text{ standard units}$\n$SO_2 \\text{ removal\
  \ percentage} = (SO_2 \\text{ standard units} - SO_2 \\text{ standard}) / SO_2 \\\
  text{ standard units} = 97\\%$\n\n计算 CO₂ 排放速率（MT/天）\n$CO_2 \\text{ emissions} =\
  \ \\text{CO}_2 \\text{ emission factor} \\times \\text{Coal heating value} \\times\
  \ \\text{Coal feed rate}$\n一公吨 = 1 MT = 1000 kg\n$CO_2 \\text{ Emission} = 1.29\
  \ \\times 10^4 \\text{ MT/day}$（答案）\n\n## 3.19 美国废物\n\n作为一个国家，美国官方产生的废物比世界上任何其他国家都多，美国每年产生的工业废物超过\
  \ 12 亿吨。美国的“废物流”来自美国经济中的制造业、零售业和商业贸易。这相当于全国每个男人、女人和儿童超过 40 吨的废物。这些数字的巨大规模令人担忧，并促使我们确定废物的特性、产生废物的工业运营以及废物管理的方式。\n\
  \n废物可能在联邦政府或各州的立法和法规中被不同地定义。联邦法规第 40 篇关于环境保护的内容在第 60.111b、61.341、191.12 和 704.83\
  \ 节中至少包含四种不同的废物定义。定义可能广泛适用于固体、液体和气态形式，或可能特定于一种或由毒性或放射性等阈值特性识别的子集。丢弃、排放或处置（与销售相对）通常是被认定为废物的要求，尽管储存或回收的材料可能包含在某些定义中，并且这些定义可能会减少回收选择（King\
  \ 1995）。\n\n### 3.19.1 工业废物管理方法\n\n在本节中，我们将重点关注最佳可用的工业流程、技术和技术，这些流程、技术和技术将废物流，包括固体和危险废物，作为处理对象，以及具有更好潜力实现工厂层面污染预防最高标准的创新和新兴流程，从而实现零效应和零缺陷（ZED）。要通过“过程污染预防”（P3）实现\
  \ ZED，工业必须使用能够足够高效地部署材料和能源以中和废物流中污染物的流程。最终目标是从废物流中去除污染物并将其转化为产品或供其他流程使用的原料。逻辑上，P3\
  \ 指的是工业流程，通过这些流程，材料和能源被有效利用以实现最终产品，同时减少或消除污染物或废物在源头的产生。\n\n工业废物是工业活动产生的废物，包括在制造过程中变得无用的任何材料，例如工厂、工业、磨坊、采矿作业以及热电厂和核电厂。工业废物的一些例子是化学溶剂、颜料、污泥、金属、灰烬、油漆、砂纸、纸制品、工业副产品、金属和放射性废物。\n\
  \n有毒废物、化学废物、工业固体废物和市政固体废物（即 POTWs 的初级和次级污泥）是工业废物的指定。污水处理厂可以处理一些工业废物，即由常规污染物如 BOD、COD\
  \ 和 TSS 组成的废物。含有有毒污染物的工业废物需要专门的处理系统。\n\n### 3.19.2 废物作为污染\n\n废物被定义为制造过程的 unwanted\
  \ by-product 或损坏、缺陷或多余的材料。在其当前状态下，它通常被认为或被认为没有价值。它可能对环境有害或有毒，也可能无害。污染是任何向环境释放废物（即任何常规或意外排放、废水、泄漏、排放或处置到空气、土地或水）的行为，从而污染或破坏环境。\n\
  \n2010 年，美国人产生了约 2.7 亿吨市政固体废物（MSW），比 2000 年增加 16%，比 1980 年增加 53%（USEPA 2012）。因此，MSW\
  \ 的管理继续成为美国和其他高度工业化国家在 21 世纪面临的重要挑战。固体废物管理在发达世界和正在发展世界中都至关重要，在那里，关于不浪费任何东西（回收和再利用）的古老传统通常会遵循\
  \ ZED 概念的重要性及其影响。\n\n### 3.19.3 为什么要回收？\n\n每吨从处置中转移的固体废物，无论是再利用、回收、在废物能源（WtE）计划中转化还是堆肥，都是少一吨需要处置的固体废物。要了解再利用、回收和堆肥固体废物的价值，只需考虑接受该材料所需的处置空间量即可。通过实施环境友好的废物管理战略（以及资源管理战略），人口可以减少对焚化炉和垃圾填埋场的依赖。当回收材料替代原生塑料、金属矿石、矿物、玻璃、纸张和树木时，对扩大化工、采矿和林业行业的压力就会减小。向工业供应回收材料比从矿山和森林中提取原生资源更可取，不仅因为它可以保护稀缺的自然资源，而且因为它可以减少危险的空气和水污染物，例如温室气体排放并节约能源。\n\
  \n节约能源是回收的重要环境效益，因为发电通常需要化石燃料消耗并导致污染空气和水排放。从回收材料制造纸张、塑料、玻璃和金属所需的能源通常少于从原生材料生产它们所需的能源。此外，回收材料的收集、加工和运输通常比原生材料在工业使用前必须经历的提取、精炼、运输和加工步骤使用更少的能源。\n\
  \n众所周知，工业过程和运输中使用的大量能源来自化石燃料燃烧。回收有助于遏制全球气候变化的危险，通过减少工业使用的能源量，从而减少温室气体排放。\n\n###\
  \ 3.19.4 化学废物\n\n化学废物是由有害化学品制成的废物（大多由大型工厂生产）。化学废物可能受英国 COSHH 等法规，或美国的 CWA 和资源保护与回收法（RCRA）的管制。在美国，环保署和职业安全健康管理局（OSHA），以及州和地方法规也管制化学品使用和处置（Hallam\
  \ 2010）。化学废物可能被归类为危险废物，也可能不被归类。化学危险废物是显示“危险特性”或被具体“列出”名称为危险废物的固体、液体或气态材料（有关 HAIPs，请参阅附录\
  \ C.1）。化学废物可能具有四种特性以被视为危险。这些是易燃性、腐蚀性、反应性和毒性。这\n\n\n\n危险废物的类型必须根据其特性、成分和危害进行分类，以便安全地处理和管理（宾夕法尼亚大学，2016）。化学废物是一个广义术语，涵盖多种类型的材料。请查阅材料安全数据表、产品数据表或标签，以获取成分列表。这些来源应说明该化学废物是否属于需要特殊处置的废物（宾夕法尼亚大学，2016）。\n\
  \n## 3.19.5 电子废弃物\n\n电子废弃物在美国已成为一个日益严重的问题。每年，超过320万公吨的电子废弃物被填埋在美国的垃圾填埋场。这些电子废弃物中很大一部分是计算机、显示器和电视机。美国每年处置超过1亿台计算机、显示器和电视机（Weidenhamer\
  \ 和 Clement, 2007）。尽管美国的电子废弃物数量巨大，但美国环保署发现，2009年美国所有电子废弃物中大约只有25%被回收利用。美国垃圾填埋场中约70%的金属来自电子设备。所有这些电子废弃物的处置对环境和全球经济都有不利影响。\n\
  \n电子废弃物已成为影响美国环境稳定性的严重问题。多年来，政府越来越深入地介入这一问题。正如美国环保署RCRA办公室2009年报告所述，电子产品在购买和使用后会被分为两类。其中一类电子产品被收集回收，另一类则被处置。此后，被处置的产品主要进入垃圾填埋场，而被收集回收的电子产品则要么被翻新、再利用，要么用作材料（Stephenson,\
  \ 2008）。《废物危机》一书的作者汉斯·塔梅马吉谈到了废物对环境的负面影响。美国近20%的废物被焚烧，其余则被填埋（Tammemagi, 1999）。这使得美国约80%的废物被填埋。在这80%的废物中，大部分主要是电子废物。\n\
  \n## 3.20 危险废物\n\n危险废物是指对公众健康或环境构成重大或潜在威胁的废物（见表C2中的“a”、“b”、“c”、“d”）。在美国，危险废物的处理、储存和处置受《资源保护与回收法》（RCRA）的监管。危险废物在RCRA下的《联邦法规》第40篇第261部分中定义，分为两大类：特性废物和列表废物。\n\
  \n- 1) 特性危险废物是指已知或经测试表现出以下四种危险特性中的一种或多种的材料：\n- a) 易燃性\n- b) 反应性\n- c) 腐蚀性\n- d)\
  \ 毒性\n- 2) 列表危险废物是指监管机构特别列为危险废物的材料，这些废物来自非特定来源、特定来源或废弃的化学产品（Shibamoto 等，2007）。\n\
  \nRCRA的要求适用于美国所有产生危险废物的公司，以及储存或处置危险废物的公司。许多类型的企业都会产生危险废物。干洗店、汽车修理店、医院、灭虫公司和照片冲印中心都可能产生危险废物。一些危险废物产生者是较大的公司，如化学品制造商、电镀公司和炼油厂。\n\
  \n这些废物可能以不同的物理状态存在，如气态、液态或固态。危险废物是一种特殊类型的废物，因为它不能像我们日常生活中的其他副产品那样通过普通方式处置。根据废物的物理状态，可能需要处理和固化过程。\n\
  \n在全球范围内，联合国环境规划署估计，每年全球产生的危险废物超过4亿吨，其中大部分来自工业化国家。其中约1%被跨界运输，且大部分转移发生在经济合作与发展组织（OECD）成员国之间。工业化国家将危险废物运往发展中国家处置的原因之一，是国内处置危险废物的成本不断上升（Orloff\
  \ 和 Henry, 2003）。\n\n### 3.20.1 美国的危险废物\n\n根据RCRA，处理、储存或处置危险废物的美国设施必须获得相应许可。危险废物的产生者和运输者必须满足处理、管理和跟踪废物的特定要求。通过RCRA，国会指示美国环保署制定管理危险废物的法规。在这一授权下，美国环保署为危险废物管理的各个方面制定了严格要求，包括危险废物的处理、储存和处置。除这些联邦要求外，各州还可以制定范围比联邦法规更广的更严格要求。此外，RCRA允许各州制定至少与RCRA同样严格的监管计划，经美国环保署审查后，各州可以接管实施RCRA要求的责任。大多数州利用这一权力，实施自己的危险废物计划，这些计划至少与联邦计划同样严格，在某些情况下甚至更为严格。\n\
  \n### 3.20.2 危险废物测绘系统\n\n美国政府提供了多种工具，用于将危险废物映射到特定地点。这些工具还允许用户查看其他信息。\n\n- 1) TOXMAP\
  \ 是美国国家医学图书馆（NLM）专业信息服务部开发的地理信息系统，利用美国地图帮助用户直观地探索美国环保署的“有毒物质释放清单”和“超级基金基础研究计划”的数据。这是一项由美国联邦政府资助的资源。TOXMAP的化学和环境健康信息来自NLM的毒理学数据网络和PubMed，以及其他权威来源。\n\
  - 2) 美国环保署的“你所在的地方”（Chaudhary 和 Rachana, 2006）允许用户从地图上选择一个区域，查找该区域超级基金场地的信息。\n\n\
  ### 3.20.3 通用废物\n\n通用废物是危险废物中的一个特殊类别，（在美国）它们：\n\n- • 相对于其他危险废物，通常构成较低的威胁，这些危险废物普遍存在，且由大量产生者以非常大的数量产生。\n\
  \n一些最常见的“通用废物”包括荧光灯泡、某些特种电池（如含锂或含铅电池）、阴极射线管和含汞设备。\n\n通用废物受监管要求相对宽松。少量产生通用废物的产生者可能被归类为“有条件豁免的小量产生者”，从而免除其部分有关危险废物处理和储存的监管要求。通用废物仍必须在地区或县级填埋设施中进行妥善处置。\n\
  \n### 3.20.4 危险废物的最终处置\n\n历史上，一些危险废物被处置在普通垃圾填埋场中。这导致大量有害物质渗入地下。这些化学品最终进入自然水文系统。现在许多垃圾填埋场要求采取防止地下水污染的措施。例如，必须沿填埋场地基安装屏障，以容纳处置废物中可能残留的有害物质。目前，危险废物通常必须经过稳定化和固化处理才能进入垃圾填埋场，并且必须经过不同的处理以使其稳定化和处置。大多数易燃材料可以回收用作工业燃料。一些含有有害成分的材料可以回收利用，例如铅酸电池。\n\
  \n### 3.20.5 回收利用\n\n一些危险废物可以回收制成新产品。例如铅酸电池或电子电路板。当重金属和这些类型的灰烬经过适当处理时，它们可以与其他污染物结合，将其转化为更易于处置的固体，或者可以用作路面填充材料。此类处理降低了有害化学物质（如粉煤灰和底灰）的威胁程度，同时也回收了安全产品。\n\
  \n### 3.20.6 波特兰水泥\n\n另一种常用的处理方法是基于水泥的固化和稳定化。之所以使用水泥，是因为它可以通过改善物理特性并降低污染物的毒性和迁移性来处理多种危险废物。所生产的水泥根据其强度和成分分为五个不同的等级。将污泥转化为水泥的过程可能包括添加pH调节剂、磷酸盐或硫试剂，以减少沉降或固化时间、增加抗压强度或降低污染物的浸出能力。\n\
  \n## 3.21 焚烧、销毁与废物转化为能源\n\n危险废物可能被“销毁”。例如，通过在高温下焚烧，易燃废物有时可以当作能源来燃烧。例如，许多水泥窑焚烧危险废物，如废油或溶剂。如今，焚烧处理不仅减少了危险废物的数量，还能从\n\
  \n\n该过程中释放的气体。已知这种特定的废物处理方式会释放由副产品或其他材料燃烧产生的有毒气体，这些气体可能会对环境影响。然而，当前技术已经开发了更高效的焚烧炉机组，可将这些排放物控制在极低水平，使得这种处理方式被视为一种更有利的选择。根据废物的特性，焚烧炉有不同的类型。贫氧空气焚烧是处理危险废物时使用的另一种方法。与普通焚烧一样，燃烧过程会发生，但控制允许进入的氧气量对于减少有害副产品的产生至关重要。贫氧空气焚烧在空气污染方面优于传统焚烧炉。通过采用这项技术，可以控制废物的燃烧速率，从而减少过程中产生的空气污染物（参见第7.13.1.1节和7.13.3节关于废物转能的案例研究）。\n\
  \n## 3.22 危险废物填埋场（隔离、封锁等）\n\n危险废物可能会被隔离在危险废物填埋场或永久处置设施中。“就危险废物而言，填埋场被定义为危险废物被放置在陆地上的处置设施或设施的一部分，且不属于堆置、土地处理设施、地表浸出塘、地下注射井、盐丘构造、盐床构造、地下矿井、洞穴或纠正性措施管理单元”（第40卷联邦法规第260.10节）。\n\
  \n### 3.22.1 热解\n\n某些类型的危险废物可以通过在超高温度电弧中进行热解来消除，在惰性条件下进行以避免燃烧。在某些情况下，例如销毁浓缩有机废物类型（包括多氯联苯、农药和其他持久性有机污染物），这种处理方法可能比高温焚烧更受青睐（RCRA，USEPA，第40卷联邦法规第261节）。\n\
  \n## 3.23 放射性废物\n\n放射性废物是含有放射性物质的废物。放射性废物通常是核能发电的副产品，也是核裂变或核技术应用（如研究和医疗）的产物。\n\n\
  放射性废物对任何形式的生命和环境都构成危害，因此受政府机构监管，以保护人类健康和环境。\n\n放射性随时间自然衰减；因此，放射性废物必须在适当的处置设施中隔离和限制，直到不再构成威胁。放射性废物必须储存的时间取决于废物类型和放射性同位素。目前管理放射性废物的方法包括：对短寿命废物进行隔离和储存，对低中低等级的一些废物进行近地表处置，以及对高放射性废物进行深埋或分区/嬗变。\n\
  \n大多数发达国家的放射性废物数量和管理方法的摘要会定期呈现和审查，作为国际原子能机构（IAEA）关于乏燃料管理安全和放射性废物管理安全的联合公约的一部分（IAEA\
  \ 2007）。\n\n### 3.23.1 来源\n\n放射性废物来自多种来源。在拥有核电厂、核武器或核燃料处理厂的国家，大部分废物源自核燃料循环和核武器再处理。其他来源包括医疗和工业废物，以及天然放射性物质（NORM），后者可能因煤、石油、天然气和某些矿物的加工或消耗而浓缩，如下所述。\n\
  \n### 3.23.2 核燃料循环\n\n#### 3.23.2.1 前端\n\n核燃料循环前端的废物通常是来自铀提取的α辐射废物。它通常含有镭及其衰变产物。\n\
  \n来自采矿的二氧化铀（UO2）浓缩物的放射性比建筑中使用的铀高大约一千倍。它从黄饼（U3O8）中提纯，然后转化为六氟化铀气体（UF6）。作为气体，它经过浓缩以将U-235含量从0.7%增加到约4.4%的低浓缩铀（LEU）。随后，它被转化为硬质陶瓷氧化物（UO2），以便组装为反应堆燃料组件（Cochran\
  \ 1999）。\n\n浓缩的主要副产品是贫铀（DU），主要是U-238同位素，U-235含量约为0.3%。它以UF6或U3O8形式储存。一些贫铀因其极高的密度而在应用中很有价值，例如用于反坦克炮弹，甚至有一次用于帆船龙骨（IHS\
  \ Jane’s 360）。它还用于制造混合氧化物燃料的钚，以及稀释或降级武器库存中高浓缩铀，后者现在正被重新定向为反应堆燃料。\n\n#### 3.23.2.2\
  \ 后端\n\n核燃料循环的后端，主要是乏燃料棒，含有发射β和γ辐射的裂变产物，以及发射α粒子的锕系元素，如铀-234（半衰期245,000年）、镎-237（214.4万年）、钚-238（87.7年）和镅-241（432年），甚至有时还包含一些中子发射源，如锎（Cf-251的半衰期为898年）。这些同位素是在核反应堆中形成的。\n\
  \n区分制造燃料的铀加工和乏燃料的再处理是很重要的。乏燃料含有高度放射性的裂变产物（参见第3.25.2节）。其中许多是中子吸收剂，在此背景下称为中子毒物。这些毒物最终积累到一定水平，吸收了如此多的中子，即使完全取出控制棒，链式反应也会停止。此时，尽管仍存在相当数量的铀-235和钚，反应堆中的燃料必须用新燃料替换。在美国，这种乏燃料通常被“储存”，而在俄罗斯、英国、法国、日本和印度等其他国家，燃料经过再处理以去除裂变产物，然后燃料可以重新利用，从而降低成本，减少健康风险，节省时间，总体更加安全（TENORM法规\
  \ 2012）。从燃料中去除的裂变产物是高水平废物的浓缩形式，该过程中使用的化学品也是如此。虽然这些国家进行单重钚循环的燃料再处理，但印度是唯一已知计划进行多重钚回收方案的国家。\n\
  \n#### 3.23.2.3 核工业\n\n工业源废物可能包含α、β、中子或γ发射源。γ发射源用于X射线照相，而中子发射源用于各种应用，如油井测井（Nuclear\
  \ Logging 2009）。\n\n美国橡树岭国家实验室（ORNL）预测，1937年至2040年期间，全球燃烧估计6,370亿吨煤所释放的铀和钍放射性同位素累计达290万吨。\n\
  \n含有天然放射性的物质被称为NORM。在人类加工过程中，如果暴露或浓缩了这种天然放射性（例如，采矿将煤带到地表或燃烧以产生浓缩的灰），它就变成了技术增强型NORM（TENORM）（USEPA，2006年6月6日c）。这种废物中的很大一部分是铀和钍衰变链中发射α粒子的物质。人体内的主要辐射源是钾-40（⁴⁰K），体内通常含有17毫克，每日摄入量0.4毫克（自然界中的放射性，爱达荷州立大学）。大多数岩石由于其成分具有低水平的放射性。根据地点不同，每年通常为1至13毫西弗，来自天然放射性同位素的平均辐射暴露量全球为每人每年2.0毫西弗（UNSCEAR\
  \ 2008）。这构成了典型总剂量的绝大部分（其他来源的平均年暴露量为：医疗检查0.6毫西弗，按整个人口平均计算；宇宙射线0.4毫西弗；过去大气核试验遗留0.005毫西弗；职业暴露0.005毫西弗；切尔诺贝利灾难0.002毫西弗；核燃料循环0.0002毫西弗）（UNSCEAR\
  \ 2008）。TENORM的监管不像核反应堆废物那样严格，尽管这些材料的放射学风险没有显著差异（TENORM法规，2012年8月1日）。\n\n## 3.24\
  \ 煤炭\n\n煤炭含有少量的放射性铀、钡、钍和钾，但对于纯煤来说，这些元素的浓度显著低于地壳中的平均浓度。周围的岩层，如果是页岩或泥岩，通常含量略高于平均值，这也可能反映在“脏”煤的灰分含量中（Gabbard\
  \ 1993；铀的宇宙起源 2006）。更活跃的灰分矿物之所以在粉煤灰中浓缩，正是因为它们燃烧不良（Gabbard 1993）。粉煤灰的放射性大约与黑色页岩相同，低于磷矿，但这更令人担忧，因为少量的粉煤灰最终会进入大气，其中可以被吸入（美国地质调查局\
  \ 1997）。根据美国NCRP报告，来自1000-MWe发电厂的公众暴露量为燃煤电厂每年490人雷姆，因此是核电厂（每年4.8人雷姆）的100倍。（从采矿到废物处置的完整核燃料循环的暴露量为每年136人雷姆；煤炭从采矿到废物处置的相应值为“可能未知”）（Gabbard\
  \ 1993）。\n\n## 3.24.1 石油和天然气\n\n石油和天然气行业的残留物通常含有镭及其衰变产物。来自油井的硫酸盐结垢...\n\n\n\n\n\
  废物容器表面测得的辐射剂量率的依据。CH TRUW（低热放性超钚废物）的表面剂量率不超过 200 mrem/h (2 mSv/h)，而 RH TRUW（高热放性超钚废物）的表面剂量率为\
  \ 200 mrem/h (2 mSv/h) 或更高。CH TRUW 不具备高放废物（HLW）极高的放射性或其高热产生率，但 RH TRUW 可以具有极高的放射性，表面剂量率最高可达\
  \ 1,000,000 mrem/h (10,000 mSv/h)。美国目前将军事设施产生的 TRUW 处置在新墨西哥州深层盐矿层中的废物隔离示范厂（Waste\
  \ Isolation Pilot Plant）（Biello 2011）。\n\n## 3.26 核废物管理\n\n核废物管理中特别令人担忧的是两种长寿裂变产物：Tc-99（半衰期\
  \ 22 万年）和 I-129（半衰期 1570 万年），它们在反应堆燃料棒耗尽几千年后主导着乏燃料的放射性。乏燃料中最棘手的超钚元素是 Np-237（半衰期\
  \ 200 万年）和 Pu-239（半衰期 2.4 万年）（核退役局 2014）。核废物需要精细的处理和管理，以成功将其与生物圈的相互作用隔绝。这通常需要进行处理，随后实施长期管理策略，涉及废物的储存、处置或将其转化为非毒性形式（Vandenbosch\
  \ 和 Vandenbosch 2007）。世界各地的政府正在考虑一系列废物管理和处置方案，尽管在长期废物管理解决方案方面进展有限（Ojovan 和 Lee 2014）。\n\
  \n在二十世纪下半叶，几个核国家研究了几种放射性废物的处置方法（Brown 2004），如下所示：\n\n- 1) “长期陆上储存”，未实施\n- 2) “外层空间处置”（例如，在太阳内部），未实施——因为目前成本太高\n\
  - 3) “深孔处置”，未实施\n- 4) “岩石熔化”，未实施\n- 5) “俯冲带处置”，未实施\n- 6) “海洋处置”，由苏联、英国（世界核协会 2011）、瑞士、美国、比利时、法国、荷兰、日本、瑞典、俄罗斯、德国、意大利和韩国实施（1954–1993）。根据国际协议，这种做法不再被允许。\n\
  - 7) “海底以下处置”，未实施，根据国际协议不被允许\n- 8) “冰盖处置”，在南极条约中被拒绝\n- 9) “直接注入”，由苏联和美国实施。\n\n在美国，随着未完成的尤卡山贮库（Yucca\
  \ Mountain Repository）工作的终止，废物管理政策彻底瓦解（《独立报》伦敦版 1997）。目前，有 70 个核电站站点储存乏燃料。奥巴马总统任命了一个蓝丝带委员会（Blue\
  \ Ribbon Commission）来研究未来针对此类及后续废物的选项。深层地质贮库似乎更受青睐（《独立报》伦敦版 1997）。\n\n### 3.26.1\
  \ 初步处理\n\n### 3.26.1.1 玻璃化\n\n放射性废物的长期储存要求将废物稳定化，使其在长时期内既不反应也不降解。理论上，实现这一目标的一种方式可能是通过玻璃化（蓝丝带委员会\
  \ 2012）。目前，在塞拉菲尔德（Sellafield），高放废物（PUREX 第一循环母液）与糖混合，然后进行煅烧。煅烧涉及将废物通过一个加热的旋转管。煅烧的目的是蒸发废物中的水分，并使裂变产物脱硝，以助玻璃产物的稳定性。\n\
  \n生成的“煅烧料”被连续送入感应加热炉中，炉内还有破碎的玻璃（国家研究委员会 1996）。产生的玻璃是一种新物质，当玻璃凝固时，废物产物结合在玻璃基质中。作为熔融物，该产品被分批倒入不锈钢圆柱形容器（“圆柱罐”）中。冷却时，流体凝固（“玻璃化”）为玻璃。成型后，玻璃对水具有极高的耐受性（汉福德高放废物实验室规模玻璃化和浸出...模型验证\
  \ 2009）。\n\n圆柱罐填满后，焊接一个密封件到圆柱罐顶部。然后清洗圆柱罐。经过外部污染检查后，钢制圆柱罐通常储存在地下贮库中。在这种形式下，预计废物产物将被固定数千年（Ojovan\
  \ 等人 2006）。\n\n圆柱罐内的玻璃通常是一种黑色光泽物质。在英国，所有这些工作均使用热室系统完成。加入糖是为了控制钌的化学性质，并阻止含有放射性钌同位素的挥发性\
  \ RuO₄ 的形成。在西方，玻璃通常是硼硅酸盐玻璃（类似于 Pyrex），而在前苏联集团，通常使用磷酸盐玻璃（核能署，巴黎 1994）。玻璃中裂变产物的量必须有限制，因为某些元素（钯，其他铂族金属，以及碲）倾向于形成金属相，从而与玻璃分离。整体玻璃化使用电极熔化土壤和废物，然后将其埋入地下\n\
  \n(Ojovan 和 Lee 2010)。德国有一座玻璃化厂正在运行；该厂正在处理一座小型示范再处理厂产生的废物，该厂随后已关闭（太平洋西北国家实验室，PNNL-15198，2005年7月）。\n\
  \n排放。例如，可以使用氢氧化铁絮体从水溶液中去除放射性金属（Hensing 和 Schultz 1995）。在放射性同位素被吸附到氢氧化铁上之后，产生的污泥可以放入金属桶中，然后与水泥混合形成固体废物形式（Brünglinghaus，废物处理\
  \ 2013）。为了使这些形式具有更好的长期性能（机械稳定性），它们可以由粉煤灰或高炉炉渣与普通水泥的混合物制成，而不是普通混凝土（由普通水泥、砾石和沙子制成）。\n\
  \n### 3.26.1.2 离子交换\n\n在核工业中，常见的是通过离子交换或其他手段处理中等活度废物，以将放射性浓缩到小体积中。经过处理后，放射性较低的大部分废物通常\n\

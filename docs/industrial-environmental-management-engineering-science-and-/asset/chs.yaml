  紫外线消毒系统并非批量生产。由于其效率强烈取决于导致废水中紫外线强度降低的废水特性，因此每个应用都必须有专门设计的系统。表 6.11 显示了在为废水设计紫外线消毒系统时必须考虑的主要参数。与氯化/脱氯相比，紫外线消毒可减少受纳水体中潜在氯化烃（包括潜在致癌物）的产生，同时对废水处理厂操作人员和附近居民区的安全性大大提高。


  ### 6.5.4.1 紫外线透射或吸收


  紫外线穿透废水的能力是在分光光度计中以杀菌灯产生的相同波长（254 nm）测量的。该测量值称为 *透射百分比* 或吸光度，它是吸收或反射紫外线的所有因素的函数。随着透射百分比降低（吸光度升高），紫外线穿透废水并到达目标生物的能力下降。


  它不能仅通过肉眼观察废水样品来估计。有效透射率 (*T*) 的范围将根据二级处理系统而变化。一般来说，悬浮生长处理工艺产生的出水 *T* 在 60 至 65%
  之间。固定膜工艺范围为 50 至 55% *T*，而氧化塘为 35-40% *T*。影响紫外线透射率的行业包括纺织、印刷、造纸、食品加工、肉类和家禽加工、照相显影以及化学制造。Das（2004）对影响废水紫外线消毒效率的其他主要参数进行了讨论。


  ### 6.5.4.2 消毒标准


  为获得 EPA 国家污染物排放消除系统（NPDES）许可证而要求的消毒水平通常小于每 100 ml 200 个粪大肠菌单位作为 30 天几何平均值。一般来说，在透射率为
  65% 且总悬浮固体（TSS）低于 20 mg/l 的二级处理废水中，需要 20-30 mW·s/cm² 的紫外线剂量才能达到此消毒水平。满足特定限值的紫外线剂量需求取决于颗粒的性质，包括数量、大小和组成。因此，紫外线剂量需求会有所不同（表
  6.11）。加利福尼亚州和夏威夷州对水再利用要求更严格的限值（<每 100 ml 2.2 个总大肠菌单位）。在这种情况下，TSS 为 2 mg/l 或更少且透射率为
  65% 的过滤出水可能需要高达 120 mW·s/cm² 的紫外线剂量才能达到此消毒水平。固体浓度、颗粒中的细菌以及颗粒尺寸分布是设计必须满足严格消毒限值系统的设计主要限制因素。看来，实现传统大肠菌群限值所需的紫外线剂量比相当的氯剂量能实现更好的病毒灭活。图
  6.11 说明了与粪大肠菌群指示物相比灭活所选生物所需的紫外线和氯的相对剂量，也显示出灭活大多数生物所需的氯剂量远高于可实现相同消毒水平的相当紫外线剂量（Das
  2002, 2004；Trojan Technologies Inc. 2010）。



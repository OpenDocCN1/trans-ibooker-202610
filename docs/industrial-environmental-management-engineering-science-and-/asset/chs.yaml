  ## 9.6 制造过程集成


  为应对制造设施相关的惊人环境与能源问题，化工及相关过程工业投入了大量关注和资源，以减轻对环境的负面影响、节约资源并降低能源使用强度。这些努力已逐渐从基于单元的方法转向系统级范式。过去十年，工业界和学术界投入大量精力，开发从系统角度着眼于节能和减废的整体过程设计方法。然而，整体方法的内涵在于需要认识到，某个单元或物流的变化通常会在整个过程中传播，并可能对过程的可操作性和盈利能力产生重大影响。此外，各种过程目标（如技术、经济、环境和安全）必须加以整合与协调。这些挑战要求开发和应用一种系统化方法，该方法超越过程的具体情况，从整体角度看待环境、能源和资源节约问题。这种方法称为过程集成（Parthasarathy
  和 Dunn 2005；Smith 2016）。


  ### 9.6.1 过程集成技术的几种可能应用


  1) 一种整体性的过程设计方法，从一开始就强调过程的统一性并考虑不同单元操作之间的相互作用，而不是分别优化它们。这也可称为集成过程设计或过程综合。Smith（2016）很好地描述了这一方法。重要的第一步通常是产品设计，即制定满足产品预期用途的规格。


  2) 夹点分析是一种用于设计过程以最小化能耗和最大化热回收的技术，也称为热集成、能量集成或夹点技术。该技术计算给定过程在热力学上可达到的能量目标，并确定如何实现这些目标。一个关键见解是夹点温度，即过程中受约束最多的点。Parthasarathy
  和 Dunn（2005）详细解释了这些技术。这一定义反映了过程集成的第一个重大成功是解决能源问题的热夹点分析。随后，针对质量交换网络、水最小化和物料循环等应用开发了其他夹点分析。一个非常成功的扩展是“氢夹点”，已应用于炼油厂氢气管理。这使得炼油厂能够最大限度降低氢气供应的资本和运营成本，以满足日益严格的环境法规，同时提高加氢处理装置的产率（Hallale
  2001）。


  用于反应器设计的过程集成技术已取得快速进展，但仍处于早期阶段。第三，新一代软件工具有望出现。过程集成商业软件的出现对其在过程设计中的更广泛应用至关重要。


  在化学工程背景下，过程集成可被定义为一种过程设计和优化的整体方法，它利用不同单元之间的相互作用，以有效利用资源并最大限度地降低成本。过程集成不仅限于新工厂的设计，还涵盖改造设计（例如在旧工厂中安装新单元）以及现有系统的运行。Hallale（2001）解释说，通过过程集成，工业界在变得更清洁和更可持续的同时，还从原材料和资本资产中赚取更多利润。


  ## 9.7 利用过程集成与强化从黑液气化中获取新型可持续化学品与能源


  过程集成的主要优势在于将系统作为一个整体来考虑（即集成或整体方法），以改进其设计和/或操作。相比之下，分析方法试图分别改进或优化过程单元，而不一定利用它们之间的潜在相互作用。


  例如，利用过程集成技术，可能会发现某个过程可以使用另一个单元排出的热量，从而降低总能耗，即使这些单元本身并未在最佳条件下运行。而分析方法会错过这种机会，因为它会寻求优化每个单元，之后就不可能实现内部热量再利用。


  在化学品及相关产品和能源过程工程领域，尤其值得关注的是设计低能耗要求（能源密集型）的过程（最好使用可再生材料，如生物质），并使用最少的原料或将副产品作为原料（材料密集型）以及最少的设备数量（即精益制造）。这正是过程集成（PI）领域产生的基础。PI
  的主要目标是提出尽可能小的工厂中的生产和制造过程，并具有较低的总能量、材料、水和其他资源消耗。为减小工厂规模，必须缩小设备尺寸或减少过程中的操作数量，或在过程中采用多功能。由于工业过程的能量需求通常由蒸汽满足，而蒸汽生产需要燃烧某种燃料（通常是化石燃料），因此降低能量需求可直接减少对环境的影响（例如温室气体、碳氧化物、氮氧化物和硫氧化物以及颗粒物）。在本扩展案例研究中，黑液（制浆过程的副产品）被用于制造化学品和生物燃料，特别是甲醇、二甲醚和合成气。文中讨论了不同的原料、副产品及替代品的使用以及
  PI 的原理（Gómez-Castro 等，2016）。


  通常，过程集成技术在项目开始时（例如新工厂或现有工厂的改进）用于筛选有前景的方案，以优化工厂的设计和/或运行。同时，它也经常与模拟和数学优化工具结合使用，以识别机会，更好地集成（新建或现有）系统并降低资本和/或运营成本。


  ### 9.7.1 引言


  大多数过程集成技术采用夹点分析或夹点工具来评估多个过程作为整体系统。因此，严格来说，这两个概念并不相同，尽管在某些情况下它们可以互换使用。Hallale（2001）的综述指出，未来该领域有望出现若干趋势。未来，目标与设计之间的界限似乎可能会模糊，并且这些将基于有关过程网络的更多结构信息。其次，我们很可能会看到更广泛的过程集成应用。在分离领域仍有大量工作要做，不仅涉及复杂的精馏系统，还涉及混合类型的分离系统。这包括涉及固体的过程，如浮选和结晶。使用


  美国纸浆和造纸工业目前是美国最大的生物质能源生产者和使用者，几乎所有生物质都来自可持续种植的树木。纸浆厂使用的可再生资源包括树皮、木材废料和黑液，黑液是纤维素纤维提取过程中富含木质素的副产品。


  凭借可直接利用的大量可再生能源资源，以及长期内可能更为广泛的资源，美国纸浆和造纸工业具有为解决气候变化和美国能源安全担忧做出重大贡献的潜力，




  同时提高其全球竞争力。实现这些目标的关键要求是突破性技术的商业化，尤其是气化技术，以实现生物质向有用能源形式（包括电力和交通燃料）的清洁高效转化。


  气化技术能够将低质量的固体燃料如生物质以低污染的方式转化为主要由氢气（H₂）和一氧化碳（CO）组成的燃料气（合成气或“syngas”）。合成气可以在燃气轮机中清洁高效地燃烧以发电。它可以经过适当的催化剂合成清洁的液体交通燃料或化学品。它也可以高效地转化为纯
  H₂ 燃料。


  虽然美国今天大多数造纸厂不出口电力且没有一家出口交通燃料，但它们收集和处理生物质资源的既有基础设施为未来基于气化的“生物炼制厂”提供了坚实的基础，这些生物炼制厂可能与纸浆和纸张产品一起生产多种可再生燃料、电力和化学品（图
  9.17）（Perlack et al. 2005）。


  如果为此类生物炼制厂生产能源载体的生物质资源是可持续种植和收获的，那么与生物炼制厂及其产品相关的 CO₂ 全生命周期排放将很少。如果生物炼制厂产品取代了原本来自化石燃料的燃料或化学品，那么整个能源系统的
  CO₂ 排放将净减少。


  如果生物炼制厂产生的副产物 CO₂ 被捕获并送往长期地下储存，则减排效果将更加显著（Larson et al. 2006b）。化石燃料的碳捕获与储存目前备受关注。多个大规模
  CO₂ 储存项目（储存 >1 百万吨/年 CO₂）正在运行，全球范围内还有更多项目正在开发中以证明其可行性（USDOE 2006）。


  与解决国家能源安全和全球变暖问题的潜力相耦合的是，美国纸浆和造纸行业迫切需要进行重大资本投资，以更换目前用于从黑液中回收能源和制浆化学品的 Tomlinson
  回收锅炉的老化机队。美国运行的大多数 Tomlinson 锅炉建于 1960 年代末至 1970 年代。服务寿命为 30–40 年的 Tomlinson 机队在
  1980 年代中期开始进行寿命延长改造。在未来 10–20 年内，经过改造的锅炉将接近需要更换的年龄，典型工厂的资本投资将在 1 亿至 2 亿美元之间。欧洲纸浆工业也存在类似情况。这种情况为引入黑液气化器作为
  Tomlinson 锅炉的替代品提供了难得的经济机遇。目前，美国和瑞典正在 concerted 努力开发商业化黑液气化技术（Ekbom et al. 2005;
  Larson et al. 2006a; Swedish Forest Agency 2008）。



- "## 附录 J\n\n### 道德规范和指南示例\n\n### J.1 全国专业工程师协会\n\n### J.1.1 前言\n\n工程是一项重要且需要专业知识的职业。作为这一职业的成员，工程师应展现最高标准的诚实与正直。工程直接且重要地影响所有人的生活质量。因此，工程师提供的服务必须诚实、公正、公平、平等，并致力于保护公众的健康、安全与福祉。工程师必须按照要求遵守最高道德行为准则的专业行为标准开展工作（NSPE\
  \ 2018）。\n\n### J.1.1.1 基本准则\n\n工程师在履行其专业职责时，应：\n\n- 1. 将公众的安全、健康与福祉置于首要地位。\n- 2.\
  \ 仅在其胜任的领域提供服务。\n- 3. 仅以客观、真实的方式发表公众声明。\n- 4. 作为每位雇主或客户的忠实代理人或受托人行事。\n- 5. 避免欺骗性行为。\n\
  - 6. 以诚实、负责、合乎道德且合法的方式行事，从而提升这一职业的荣誉、声誉和价值。\n\n### J.1.1.2 执业规则\n\n- 1. 工程师应将公众的安全、健康与福祉置于首要地位。\n\
  \  - a. 如果工程师的判断在可能危及生命或财产的情况下被推翻，应通知其雇主或客户，以及其他适当的主管机构。\n  - b. 工程师只能批准符合适用标准的工程文件。\n\
  \  - c. 除非事先获得客户或雇主的同意，或法律或本规范授权或要求，否则工程师不得披露事实、数据或信息。\n  - d. 工程师不得允许他人使用其姓名，也不得与其认为从事欺诈或不诚实经营的个人或企业建立商业联系。\n\
  \  - e. 工程师不得帮助或怂恿个人或企业非法从事工程活动。\n  - f. 工程师如知悉涉嫌违反本规范的行为，应向适当的专业机构报告；在相关情况下，还应向公共主管部门报告，并配合适当主管部门提供可能要求的信息或协助。\n\
  - 2. 工程师只能在其胜任的领域提供服务。\n  - a. 工程师只有在通过教育或经验具备相关具体技术领域资质时，方可承担任务。\n  - b. 工程师不得在其不具备专业能力的主题相关计划或文件上签名，也不得在并非由其指导和控制编制的计划或文件上签名。\n\
  \  - c. 工程师可以接受任务并负责协调整个项目，也可以为整个项目的工程文件签名并加盖印章，但前提是每个技术部分只能由编制该部分且具备相应资质的工程师签名并盖章。\n\
  - 3. 工程师只能以客观、真实的方式发表公众声明。\n  - a. 工程师在专业报告、声明或证词中应做到客观、真实。他们应在其中包含所有相关且重要的信息，\n\

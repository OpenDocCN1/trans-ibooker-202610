  \ | 机动车辆、电力公用事业、工业锅炉和非道路设备。 | 刺激肺部，可能导致肺损伤并降低对流感等呼吸道感染的抵抗力。可能通过区域传输和沉降对陆地和水生生态系统产生不利影响。\
  \ |\n| **颗粒物（PM）** | 直接由风吹尘土、破碎和研磨作业、未铺装道路和建筑、燃料燃烧（机动车辆、发电厂、工业设施）、木炉和农业（耕作、焚烧田地）形成。也可能在大气中由\
  \ SO₂ 和 NOx 等气体形成。 | 引起眼睛、鼻子和喉咙刺激，肺功能下降，加重哮喘，慢性支气管炎发展，不规则心跳，非致命性心脏病发作，以及患有心脏或肺病的人过早死亡。充当有毒金属的载体，损害人造材料，是美国许多地区能见度降低的主要原因。\
  \ |\n| **二氧化硫（SO₂）** | 燃烧含硫燃料（主要是石油和煤炭）在工业、机构、公用事业和住宅炉灶和锅炉中形成。其他来源包括石油炼厂、冶炼厂、造纸厂和化工厂。\
  \ | 可能导致呼吸问题、呼吸道疾病、肺部防御改变、现有心血管疾病加重以及肺部永久性损伤。形成酸性气溶胶和硫酸，与湖泊和溪流酸化、建筑物和纪念碑腐蚀加速以及能见度降低有关。\
  \ |\n| **铅** | 土壤、灰尘、油漆等，使用含铅燃料的交通来源、煤炭燃烧、冶炼厂、汽车电池厂以及焚烧含铅产品的垃圾。 | 较高水平可导致大脑和其他神经系统损伤，并对肾功能、血液化学和消化产生不利影响，如果摄入或直接吸入。儿童即使在低剂量下也因累积效应而有特殊风险。铅还可通过沉积到叶片上而危害野生动物，而叶片是食草动物的食物来源。\
  \ |\n\n\n\n\n\n五种一次标准污染物为直径小于10 μm的颗粒物和直径小于2.5 μm的颗粒物（PM₁₀和PM₂.₅）、二氧化硫（SO₂）、二氧化氮（NO₂）、一氧化碳（CO）和颗粒态铅（Pb）；第六种标准污染物——臭氧（O₃）——则是一种二次污染物。在这六种污染物中，前四种在美国（以及其他大型工业化国家）的年排放量以数百万吨计，有时被称为*主要*一次污染物。另一类污染物——VOCs——虽然不是标准污染物，但因其排放量巨大（包括人为源和生物源），并在形成地面臭氧的大气反应中具有重要作用，因此被公认为主要的一次污染物。\n\
  \n## 3.9.8.6 标准污染物的国家环境空气质量标准（NAAQS）\n\n空气污染会导致多种不良健康影响。美国环保局（EPA）已针对六种最常见的空气污染物制定了国家环境空气质量标准（NAAQS）：一氧化碳、铅、地面臭氧、颗粒物、二氧化氮和二氧化硫，这些污染物被称为“标准”空气污染物（或简称“标准污染物”）。环境空气中这些污染物的存在通常源于众多不同且分布广泛的排放源。一级标准旨在保护公众健康。EPA还制定二级标准，以保护公众福利免受标准污染物的不利影响，包括防止能见度受损，以及防止对动物、农作物、植被或建筑物造成损害（表3.9）。\n\

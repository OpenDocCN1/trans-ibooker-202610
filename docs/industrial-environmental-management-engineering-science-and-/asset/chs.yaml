  对于某些排放物，由于存在现有的总量管制与交易市场，也可以估算其市场价值。按625美元/吨（近期SO₂配额的的价格）计算，并假设实际价格保持在这一水平，那么在生物精炼厂商业化引入后的25年内，SO₂减排的累计价值最高可达3.01亿美元。（在某些配置中，由于预计电网电力SO₂排放量将大幅下降（如前所述），SO₂净效益为负。）如果按同期2100美元/吨计算NOₓ，在“积极市场渗透”情景下，其市场价值最高可达15–26亿美元。如果建立了CO₂交易体系，在“积极市场渗透”情景下，按25美元/吨CO₂计算，CO₂价值最高可达370亿美元。虽然生物精炼厂可能难以获得所有这些额外收入流，但这些估算表明生物精炼厂实现的减排对国家的价值。因此，除了能源成本节约外，由于市场渗透放缓而损失的SO₂、NOₓ和CO₂减排价值也可能高达数十亿美元（Larson
  等，2006b）。


  ## 9.8.15 成本效益分析


  Larson 等人（2006a）和 Consonni 等人（2009）研究了牛皮纸浆造纸厂中基于BLG的生物精炼成本效益分析。该研究假设BLG系统在技术上与Tomlinson回收锅炉相当。因此，BLGCC或生物精炼系统可以集成到牛皮纸浆厂中，替代传统的回收技术。


  参考工厂的基础产能为每天2458 TBLS，是一家综合纸浆厂，使用65/35的硬木和软木混合原料生产未涂布胶版纸。LTBLG的DME生产与输入相同黑液的HTBLG进行了比较。LTBLG集成中的DME能量流估计为137.4
  MW，HTBLG情况为168 MW。在LTBLG案例中，动力锅炉消耗的燃料（未转化的合成气和木材残渣）比HTBLG案例多，但产生了多64%的背压式汽轮机发电量。根据初步计算，似乎


  在DME纸浆厂生物精炼集成中，LTBLG产生的DME将比HTBLG生物精炼少15–20%，两种配置都需要进口电力。此外，LTBLG案例需要的生物质进口量大约是HTBLG的两倍，石灰窑的燃油进口量高出约25%。表9.9比较了各种研究中的潜在电力或燃料生产。


  ## 9.9 结论


  我们可以将现代纸浆造纸厂视为第一代森林生物精炼厂，在生产的各种纸张产品（我们通常与该行业联系在一起）的同时，还生产蒸汽、电力和其他产品。黑液和生物质气化是实现未来森林生物精炼的关键技术平台。目前的研究和开发表明，基于气化的纸浆厂生物精炼技术一旦完全商业化，就有潜力带来有吸引力的投资回报。它们还有潜力为国家石油节约、减排、能源安全改善和农村经济发展做出重要贡献——这些贡献可能是现有美国玉米-乙醇行业贡献的两倍或更大。在美国引入BLGCC系统，有可能在25年内减少（替代）多达3500万吨净CO₂、1.6万吨净SO₂和10万吨净NOₓ。


  这些潜在的私人利益和公共利益，从根本上说，源于生物精炼与纸浆和造纸生产的集成，使得生物精炼厂除了输出液体燃料（FTL、DME、MA）以及可能输出一些电力外，还提供化学品回收服务、工艺蒸汽和工艺电力。我们详细分析了一系列涵盖广泛产品方案的集成纸浆/造纸厂生物精炼设计。一个总体的发现是，与非集成生物燃料生产相比，集成可以有效地提高生物质资源用于液体生物燃料生产的效率。集成还可以有效地将单位生物燃料生产所需的资本投资降低到与煤制油设施投资相当的水平，而这些煤制油设施的规模比预期的纸浆厂生物精炼厂大一个数量级或更多。最后，集成可以有效地将基于气化的生物燃料生产成本降低到约1美元/加仑乙醇当量，这将使其与国家可再生能源实验室分析人员为酶解/发酵工艺利用木质纤维素生物质生产乙醇所制定的当前成本目标具有竞争力。



  \ 15 万至 50 万吨大块塑料和 7 万至 13 万吨微塑料。“塑料污染是当今世界上海洋物种最糟糕的敌人之一。”\n\n## 5.5 环境与健康风险信息的沟通\n\
  \n任何行业成功的环境与健康风险管理的一个关键组成部分是有效的社区外联，或社会责任计划。在当前公众获取和接触有关当地健康和环境问题的信息的爆炸式增长，以及对这些信息的兴趣日益增加的背景下，这一点比过去更重要。互联网\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_247_2.png)\n\n**图 5.15** 死鲸体内发现的塑料垃圾。*来源：*\
  \ Seame Sardinia Onlus 拍摄的照片，美联社。《纽约时报》，2019 年 4 月 3 日。\n\n提供全天候 24 小时公众可用的工业设施信息；美国环保署和环境保护基金等提供的网站只需点击鼠标即可向所有用户提供当地工业状况的最新信息。\n\
  \n未采取主动沟通方法的设施可能会发现公众被大量关于工厂运营的负面信息所包围，而没有积极的数据或信任行业的理由。事实上，如果缺乏开放的沟通或公众对信息可获取性的认知，一家公司即使其设施运营不存在环境或健康风险，也可能获得负面形象。\n\
  \n化学工业为缺乏沟通时真实风险与感知风险可能出现分歧提供了很好的例子。虽然 1991 年至 1997 年间有毒化学品和疑似致癌物的排放量大幅减少，且化学工业的事故率下降了\
  \ 32%，但公众对化学工业的看法并未改善。事实上，只有 25% 生活在化工厂附近的人对该行业持 favorable 态度。一般来说，公众不会听到关于积极创新或风险降低进展的消息，对所听到的内容持怀疑态度。这些行业必须努力建立信任。如果他们想缓解和/或避免与邻居的未来冲突，就必须积极改善其公众形象。\n\
  \n行业致力于与当地社区建立并保持持续对话至关重要。这种对话需要成为几乎每个工业设施日常运营不可或缺的一部分，管理层提供信息获取，同时学习并回应公众的疑问和关切。\n\
  \n正如第 5.5.1 节所示，未与邻居建立沟通渠道的设施可能会在不情愿的情况下被卷入其中——在这种情况下，他们将处于防御状态，并可能引发公众担忧，甚至愤怒。唯一有效的解决方案是随着时间的推移与当地社区和其他关键受众建立关系。\n\
  \n### 5.5.1 从担忧到愤怒：公众反应的决定因素\n\n什么可能使人们对真实或感知的风险感到担忧或愤怒？答案取决于一系列风险感知和环境脆弱性因素。表 5.5\
  \ 列出了其中一些环境脆弱性因素。如果行业与公众之间缺乏定期沟通，人们往往会利用其总体印象来形成对社区内设施可接受性的看法。印象可能基于工厂的“外观”，例如建筑物和场地是否得到良好维护和保养。如果排放烟雾或蒸汽，或邻居能闻到或听到工厂运营，则该设施的环境脆弱性会被认为更大。如果工厂有社区或员工健康投诉的历史，或已知现场存在高关注物质，如放射性物质，则环境脆弱性也会很高。此外，设施在其所在社区的适当性或不适当性也很重要。人们会对位于学校、医院或重要风景或文化遗址附近的设施运营所带来的风险特别敏感。\n\
  \n环境脆弱性概念有助于识别加剧公众担忧的因素。然而，\n\n## 表 5.5 环境脆弱性因素清单。\n\n| 环境脆弱性因素 |\n|---|\n| • 人们可以看到、闻到、听到的东西（例如气味、蒸汽云、噪音）\
  \ |\n| • 大量的排放物或危险废物 |\n| • 社区或员工健康投诉的历史 |\n| • 不明气味或泄漏的历史 |\n| • 存在已知致癌的“令人恐惧”物质\
  \ |\n| • 设施、卫生或外观不佳 |\n| • 靠近敏感地点，包括学校、养老院和医院 |\n| • 学校儿童或教职工健康问题报告 |\n| • 靠近重要的风景或文化遗址\
  \ |\n| • 有组织的环保团体的积极存在 |\n| • 社区外联历史不佳 |\n| • 缺乏风险和危机沟通计划 |\n\n环境脆弱性并不能阐明为什么人们会对某些风险感到愤怒，而对其他风险却不然。在他对“愤怒因素”的经典讨论中，Sandman\
  \ (1993) 概述了有助于确定人们对风险反应中愤怒或恐惧程度的风险特征。根据 Sandman 的说法，公众对风险的感知超出了科学家和工程师偏好的狭义定义。后者使用技术定义的风险，可通过将危害程度乘以暴露概率来确定，如下所示：\n\
  \n```\nRisk = hazard × exposure  (5.6)\n```\n\n在此定义中，风险随着过程或材料的危险性（例如化学品的毒性）以及受影响人员暴露的量和时间而增加。\n\
  \n然而，公众对风险的理解需要将 Sandman 所称的“愤怒”纳入方程。愤怒涵盖了与风险相关的所有因素，不包括技术危害。这些因素对公众感知极其重要，包括风险是自愿承担的，如吸烟或不系安全带，还是非自愿的，如死于工厂爆炸，风险是由个人控制还是由系统控制，以及它是工业性的还是自然的。与行业或事件相关的感知风险如果其影响令人恐惧、集中在时间和空间上、非自愿、令人难忘且没有可见益处等，则会很高。在纳入愤怒因素后，外行人对风险的看法可以概括并表示如下：\n\
  \n```\nRisk = hazard + outrage  (5.7)\n```\n\n其中风险和危害与式 (4.9) 相同，而愤怒代表愤怒因素的纳入。虽然技术风险水平也会引起人们关注，他们会期望采取行动，但愤怒因素将有助于决定他们的愤怒程度，并影响风险被感知为更危险还是更不危险。Sandman\
  \ 愤怒因素的定性分解见表 5.6。\n\n显然，对行业有利的是在公民反应达到愤怒状态之前，向公众传达关于潜在或感知问题的可信信息。\n\n### 5.5.2\
  \ 环境与健康风险沟通的可持续策略\n\n虽然许多工业设施可能认识到沟通的好处，但许多设施不愿投入必要的时间和金钱来启动社区\n\n\n\n\n### 表5.6\
  \ 愤怒因素。\n\n| 风险较高 | 风险较低 |\n|---|---|\n| 非自愿 | 自愿 |\n| 工业/人工 | 自然 |\n| 奇特/不寻常 |\
  \ 熟悉 |\n| 易记住 | 不易记住 |\n| 令人恐惧 | 不令人恐惧 |\n| 时间和空间上集中 | 时间和空间上不集中 |\n| 不公平 | 公平 |\n\
  | 道德相关 | 道德中立 |\n| 不可信 | 可信 |\n| 封闭过程 | 开放过程 |\n| 无明显益处 | 可见益处 |\n\n*来源：出自桑德曼（1993）。*\n\
  \n外联项目。一些管理者认为，如果人们已经通过行业无法控制的方式获取信息，那么对抗这一过程毫无意义。事实上，他们明智地不去质疑环保团体声明的技术依据：行业不具备这些团体所拥有的可信度，此类质疑很可能被视为混淆视听，进一步损害行业形象。然而，缺乏沟通会助长负面认知。沟通不应被视为对负面宣传的回应，也不应具有对抗性。要想有效，沟通必须成为日常运营的基本组成部分。\n\
  \n## 5.5.2.1 打破沟通障碍\n\n> *沟通中最大的问题，是那种“沟通已经发生”的错觉*\n> \n> - 乔治·伯纳德·肖。\n\n行业通常使用以下合理化理由来为不沟通的立场辩护。\n\
  \n### 我们规模太小，不适合做外联\n\n一个低调或“无形象”的设施，实际上可能因缺乏外联历史而招致更多公众审查。没有为社区外联分配预算、活动或人员的公司，可能认为这是与其规模和潜在风险相匹配的。然而，即使是一家小型化工设施，也可能成为公众愤怒的对象，尤其是当人们认为风险被隐瞒时。\n\
  \n### 我们的设施和运营在环境上是健全的\n\n良好的环境绩效当然是一个设施努力成为好邻居的关键。然而，只有将环境绩效与定期沟通和信任相结合，才能建立成功的关系。特别是，如果行业与公众之间没有沟通记录，人们就会基于对其设施的总体印象来判断某个运营者是否是好的邻居。每个设施在某种程度上都会受到公众的质疑、担忧甚至愤怒的影响（谢德\
  \ 2014）。\n\n### 如果我们和人们交谈，他们会心烦意乱\n\n有时，经过数年甚至数十年的沉默，一个工业设施会突然发现自己与邻居展开了积极而激烈的对话。引发沟通的事件可能是一次轻微的化学品泄漏，尽管风险很小，却需要消防部门和其他应急响应人员作出大规模反应。虽然风险的技术水平会影响公众反应，但愤怒程度在很大程度上取决于此前与公司的经历。沟通本身并不制造愤怒。当不公平的表象导致不信任，并让人认为风险无法或不会被控制时，愤怒就会产生。\n\
  \n### 我们的人手已经超负荷了\n\n风险沟通和社区外联必须成为每个设施日常业务计划和员工岗位职责的一部分。第5.5.2.2节讨论了如何实现这些目标。从长远来看，如果公众愤怒保持低位并避免对抗，则可以节省时间和金钱。风险沟通计划应被视为一种预防未来与邻居发生问题的保险。通过关注社区关切，行业可以在很大程度上避免因本不应引起恐慌的情况而措手不及。\n\
  \n## 5.5.2.2 建立沟通计划\n\n在确定了接触标准污染物和有害污染物的风险以及相关不确定性之后，下一步是利用这些信息来改善决策基础。这通常涉及公众，或至少包含公众的关切和态度。\n\
  \n有效的风险沟通计划的理由，以及确定公众对风险的反应或愤怒程度的理论基础，都已经讨论过。在实践层面，行业需要将这些概念付诸实施。尽管每个设施都会制定自己的方法，\n\
  \n该设施却没有努力与其邻居交谈，也没有了解他们的潜在担忧。事实上，附近大多数居民并不知道该工厂的存在。当人们突然通过黑烟排放发现这个设施时，他们感到愤怒。居民们认为，他们有权知道自己社区内存在什么样的工业设施，以及该设施对环境和健康构成什么样的风险。\n\
  \n## 5.5.3.2 不沟通的代价\n\n该油水分离设施只有在公司资助了两次健康风险评估、为清洁和停工期间使用的化学品设定了健康保护水平、承诺在非常规操作期间提供广泛的环境监测，并主办了四次社区会议之后，才得以继续运营。尽管公司努力赢得社区信任，但当该公司试图在20英里外重新开设类似设施时，第一个社区的居民提出抗议，并成功阻止了第二家设施获得运营许可证。\n\
  \n公司代表发现得太晚了：被忽视的公众所引发的关切，其后果可能代价高昂。当地社区关切的问题包括当地工业的基本事实以及其运营可能带来的风险。在美国，根据《信息自由法》和许多环境法规条款，人们有权获得此类信息。如果油水分离设施早与社区展开对话，那么这次与公众的会面就不会与发展中的危机相关联。\n\
  \n这个案例研究说明了当行业与公众之间缺乏持续、双向沟通的记录时，情况会以多快的速度升级为危机。表5.5中列出的若干环境脆弱性因素都起了作用：人们最初开始对来自意外来源的不明排放感到担忧；他们事后才质疑将该设施设在如此靠近小学和住宅区的地方是否明智；而那些经历过异常健康问题的人开始怀疑这与油水分离设施有关。\n\
  \n在类似这种情况下，公众几乎没有理由信任造成风险的行业或设施，愤怒因素的作用也可能非常强烈（见表5.6）。不寻常且令人难忘的冒烟排放引发了一种担忧，即人们对自己社区允许何种工业毫无控制权。分离厂的管理层被认为不值得信任。此外，人们还对该公司在事件发生前未能与邻居沟通而感到不满（博霍尔姆\
  \ 2008）。\n\n## 5.5.4 经验教训\n\n与公众沟通的关键不仅在于简单地解释技术危害，还在于理解并回应人们愤怒的根源。公共沟通并不随着分发知情权信息而结束。恰恰相反——随着越来越多的社区成员获取信息，他们倾向于在整个风险管理过程中要求更多发言权。行业不仅必须准备好沟通，还必须准备好与当地社区共享决策权。只有社区参与成为设施日常运营和公司文化的一部分，这些努力才能成功。与公众建立良好关系需要时间。然而，正是这些关系会给公司带来信任和信誉。这并不意味着永远不会出现冲突，但确实意味着，在向公众解释关于健康、环境和安全风险的复杂技术信息时，设施不必从零开始。\n\
  \n## 5.6 互联网上的环境信息获取\n\n互联网提供了即时获取大量环境（以及化学和其他）信息资源的途径。互联网提供了许多可用于环境风险评估和环境风险管理的资料。然而，并非所有来源都具有同等价值。第5.6.2节向使用以下来源数据的人给出了一些重要警告：\n\
  \n- 联邦、州和地方政府的可检索法规数据库\n- 大学和研究机构的技术信息\n- 关于化学品和环境趋势及具体事件的数据，这些数据由数百家公司报告，并由行业协会、政府机构和非政府组织进行分析\n\
  - 美国职业安全与健康管理局（OSHA）和美国环境保护署（USEPA）提供的执法检查指南和处罚选择\n- 环境和化学工程支持服务提供商的产品列表和能力说明，以及此类公司的目录\n\
  \n\n\n\n\n- 与材料交换相关的链接，以及污染预防技术和其他资源，用于降低与危险材料处理、释放和处置相关的成本和责任\n- 在线新闻服务\n- 出版物、会议公告以及其他专业交流机会\n\
  \n以下是网络上可用的最佳环境资源，以及一些鲜为人知但极具价值的网站，用于支持环境和化学决策的数据、监管机构提供的模型和资源、宣传和公众沟通方面的帮助，以及环境出版物（Bolstridge\
  \ 2003）。\n\n## 5.6.1 互联网资源\n\n### 5.6.1.1 EPA 的综合风险信息系统\n\nhttp://www.epa.gov/irisweb/iris/index.html.\
  \ 综合风险信息系统（IRIS）是 EPA 关于化学品暴露对人类健康影响的剂量-反应数据的数据库。可搜索的数据库包含超过 500 种物质的信息，旨在用于癌症风险评估、决策制定和监管活动（USEPA\
  \ 2005）。\n\n### 5.6.1.2 EPA 化学事故历史和调查\n\nhttp://yosemite.epa.gov/oswer/ceppoweb.nsf/content/preventingaccident.htm.\
  \ 该页面允许访问近期化学事故的文档和报告、EPA 化学事故调查队的调查以及国家响应中心的事发摘要，以及相关的咨询和通知。EPA 的意外释放信息计划数据库包含\
  \ 1986 年至 2000 年间美国固定设施发生的危险化学品意外释放信息。EPA 地区办公室要求设施填写一份 23 个问题的问卷，内容涉及设施、事件的 circumstances\
  \ 和原因、事件发生前已实施的控制和预防措施和技术，以及因释放而做出的改变。问卷侧重于事故预防，包括危害评估、培训、应急响应、公众通知程序、缓解技术以及预防设备和控制措施。整个数据库（压缩格式）可以下载并使用任何能够处理\
  \ dbase 格式文件的数据库程序进行搜索。问卷的副本和解释数据库字段的数据字典也包含在压缩文件中。\n\n### 5.6.1.3 国际毒性估计风险数据库\n\
  \nhttp://www.tera.org/jiter. 国际毒性估计风险（ITER）数据库是汇编了全球各健康组织认定的 500 多种环境关注化学品的人类健康风险值。用户可以获取任何所列化学品的实际风险值（例如\
  \ 非致癌经口；致癌经口；非致癌吸入；致癌吸入），以及产生所报告风险值的研究或调查的详细信息，包括同行评审信息和详细的文献参考。\n\n### 5.6.1.4\
  \ AIRNow 的实时空气污染数据链接\n\nhttp://www.epa.gov/airnow. 该网站提供全国空气质量信息访问，包括空气质量预报和超过一百个美国城市的实时空气质量。提供本地空气质量预报，以及链接到州和地方网站以提供实时空气质量监测和预报数据。每个州/地方互联网站点提供的信息类型不同，但很大程度上集中于城市地区臭氧和空气质量指数，这些指数通常在新闻媒体中报道。\n\
  \n### 5.6.1.5 空气与废物管理协会的州机构名录\n\nhttp://www.awma.org/resources/gad/state.htm. 空气与废物管理协会网站提供与环境法规和合规执法相关的州机构的链接。\n\
  \n### 5.6.1.6 酸雨、大气沉降和降水化学\n\nhttp://btdqs.usgs.gov/acidrain. 美国地质调查局的国家大气沉降计划和国家趋势网络在美国各地\
  \ 220 个站点收集数据，以确定减少空气污染的监管措施是否改善了降水的质量。由于需要实验室分析，从数据收集到结果可用之间存在五到六个月的时间滞后。在线数据访问需要填写表格并提供请求者的姓名、地址以及数据的预期用途。数据收集包括日降水量、现场和实验室\
  \ pH 值，以及硫酸盐（SO₄）、硝酸盐（NO₃）、氨（NH₄）、钙（Ca）、镁（Mg）、钾（K）、钠（Na）、氯化物（Cl）以及来自 NO₃ 和 NH₄ 的氮（N）的每周、每月和年度平均浓度和干沉降数据。\n\
  \n### 5.6.1.7 预测混合化学品的反应\n\nhttp://response.restoration.noaa.gov/chemaids/react.html.\
  \ 国家海洋和大气管理局（NOAA）的化学反应工作表是一款免费软件包，包含 4000 种化学品的反应性数据，并确定化学品意外混合的反应性影响。根据化学品被归类为一个或多个反应性组，软件预测当各组成员混合在一起时可能发生的反应类型。它不限制可选择混合的化学品数量，但对于超过\
  \ 10 种化学品时效果会降低。\n\n### 5.6.1.8 模拟油泄漏\n\nhttp://response.restoration.noaa.gov/software/gnome/gnome.html.\
  \ NOAA 提供软件，可指定油泄漏情景。通用 NOAA 油建模环境模型使用潮汐和洋流数据生成泄漏的预测轨迹。\n\n### 5.6.1.9 有毒物质危害分析，第\
  \ 3 版\n\nhttp://yosemite.epa.gov/oswer/ceppoweb/content/dsepd_s.htm#hats. 有毒物质危害分析是面向应急规划者和响应人员的菜单驱动屏幕演示。它介绍了\
  \ EPA 的《应急规划和社区知情权法》计划以及 EPA 分析制造厂周边社区有毒物质危害的方法，在这些工厂中制造或使用此类材料。\n\n### 5.6.1.10\
  \ EPA 暴露评估建模中心\n\nhttp://www.epa.gov/ceampubl/index.htm. 该网站提供暴露评估软件包的表格清单，用于解决地下水、地表水、食物链和多媒体系统中有机化学品和金属的建模问题。模型可供下载，并附有软件包功能描述。\n\
  \n### 5.6.1.11 监管空气模型\n\nhttp://www.epa.gov/ttn/scram. EPA 的监管空气模型支持中心提供各种空气模型的源代码、数据集和用户指南，包括监管模型（ISCST3、UAM、BLP、CTDMP）、受体模型（CMB7、CMB8）、筛选模型（CAL3QHC、CTSCREEN、LONGZ、SHORTZ、VALLEY）、其他空气模型（DEGADIS、PLUVUE2、TOXST、MESOPUFF、RPM-IV、FDMI）、相关程序（CALMPRO、RAMMET、WRPLOT、MPRM、MIXHTS）以及非\
  \ EPA 模型（SLAB、ADAM、AFTOX、SCREEN）。\n\n### 5.6.1.12 EPA 的风险管理后果分析（RMP*Comp）\n\nhttp://www.epa.gov/ceppo/tools/rmp-comp/rmp-comp.html.\
  \ EPA 提供该免费软件的 1.07 版，用于执行《清洁空气法》第 112(r) 条要求的风险管理后果分析。\n\n### 5.6.1.13 有毒物质和疾病登记署的健康风险沟通入门\n\
  \nhttp://atsdr1.atsdr.cdc.gov/HEC/primer.html. 有毒物质和疾病登记署提供了一套向多元受众传达健康风险信息的原则和方法的框架。它面向必须回应公众对环境中危险物质暴露担忧的发言人。该文件包含一份“应做和不应做”清单，描述了传达风险信息时应采用的方法和应避免的陷阱。\n\
  \n### 5.6.1.14 印第安纳法学院的灾害沟通\n\nhttp://www.law.indiana.edu/webinit/disaster/index.html.\
  \ 该网站总结了影响全球自然和人为灾害相关信息和沟通的国家法律和国际公约，包括改善救援工作和减少总体影响。该网站提供访问有关新闻媒体在灾害减缓中作用的文档，并链接到其他参与灾害沟通的组织。\n\
  \n### 5.6.1.15 EPA 国家环境出版物服务中心\n\nhttp://www.epa.gov/ncepihom/ordering.htm. 该网站接入\
  \ EPA 所有文档的中央存储库，可免费下载或通过邮寄获取。超过 5500 个标题可提供纸质和/或电子格式。\n\n### 5.6.1.16 国家科学院报告在线\n\
  \nhttp://nap.edu/info/browse.htm. 国家科学院出版社出版国家科学院、国家工程院、国家研究委员会和医学院发布的报告。各种环境、健康、自然资源和工程主题的许多文本可在线查阅或订购。\n\
  \n## 5.6.2 使用互联网的含义和局限性\n\n互联网已成为科学和技术的终极数据源。然而，在将互联网数据应用于科学工作或监管合规时必须谨慎使用。通常，信息在互联网上发布时并未描述用于开发数据的研究或研究。当此类文档是\n\
  \n\n缺乏时，考虑向维护该网站的组织或个人发送电子邮件以请求参考信息。一些在线数据严重过时，或代表尚未经过准确性或质量审查的学生研究成果。最后，互联网上提供的数据可能并非为环境或化学分析目的而开发，因此可能包含隐藏的偏见或不准确之处，使其不适合您的预期用途。请认识到，从互联网上下载免费数据时，您可能得不到您认为所获得的东西。\n\
  \n依赖官方政府网站有助于避免被某些互联网网站的内容误导。然而，大学和非营利组织可以提供关于近期事件和问题的更及时或更详细的信息。始终审查任何作为资源使用的互联网位置背后的组织。重点关注定位资金来源类型、同行评审和数据质量评估，以及最后更新日期，以获得对特定网站所代表真实价值的额外洞察。许多此类信息可在网上获得，或可通过向网站开发者发送电子邮件获得。化学和环境工程专业人员需要多种类型的信息。现在许多所需数据，甚至整个软件包，都可免费从互联网上下载。事实上，随着互联网的成熟，海量数据和软件正变得人人可得。然而，将数据转化为信息，更重要的是将信息转化为知识，已成为科学专业人员面临的主要挑战。\n\
  \n## 5.7 健康与职业安全\n\n### 5.7.1 职业安全与健康管理局\n\n《OSHA 法案》旨在尽可能确保全国每一位工人享有安全健康的工作条件并保护我们的人力资源（OSHA\
  \ 2018）。根据该法案，OSHA 在美国劳工部内部成立，以\n\n- 1) 鼓励雇主和雇员减少工作场所危害并实施新的或改进现有的安全和健康计划\n- 2)\
  \ 提供研究以开发应对职业安全和健康问题的创新方法\n- 3) 建立雇主和雇员在实现更好安全和健康条件方面的“各自独立但相互依存的责任和权利”\n- 4) 维持报告和记录保存系统以监测与工作相关的伤害和疾病\n\
  - 5) 建立培训计划以增加职业安全和健康人员的数量和能力\n- 6) 制定强制性工作安全和健康标准并有效执行\n- 7) 为州职业安全和健康计划的发展、分析和评估以及批准提供便利。\n\
  \n### 5.7.1.1 “知情权”法律\n\n也许有史以来采用的最重要的安全和健康标准之一是 OSHA 危害沟通标准，更通俗地称为“知情权”法。该危害沟通标准要求雇主向雇员传达工作场所内存在的有害化学品的信息。该计划要求雇主制定书面的危害沟通计划，为所有有害化学品保存材料安全数据表（MSDS），并确保适当的警告标签到位。\n\
  \nOSHA 颁布的《危险废物作业与应急响应法规》解决了参与《授权》作业以及根据 RCRA 进行的某些危险废物处理、储存和处置作业的雇员的安全和健康问题。该标准为初始现场表征和分析、监测活动、培训和应急响应期间的雇员保护提供了规定。\n\
  \n法规下的四个主要领域如下：\n\n- 1) 在政府健康或环境机构已确定需要清理的无控制危险废物场地的清理作业。\n- 2) 危险废物 TSD（运输、储存和处置）设施的常规作业，或受\
  \ 40 CFR 第 264 和 265 部分监管的任何设施的部分。\n- 3) 危险物质已或可能泄漏的场地的应急响应作业。\n- 4) RCRA 场地的纠正措施。\n\
  \n该法规针对上述作业中的三类特定工人群体。第一，它规范了根据 CERCLA 进行的危险物质响应作业，包括在确定 CERCLA 场地是否存在危险物质之前进行的初始调查；根据\
  \ RCRA 进行的清理作业中的纠正措施；以及已被州或地方政府当局指定进行清理的场地的危险废物作业。第二类受覆盖的工人是从事危险废物 TSD 设施作业的雇员。第三类受覆盖的雇员是从事危险物质泄漏或严重泄漏威胁的应急响应作业以及对该类设施的应急响应后作业的雇员。\n\
  \n### 5.7.1.2 国家职业安全与健康研究所\n\n国家职业安全与健康研究所（NIOSH）为 OSHA 在其法规中使用的工业暴露标准提出建议。OSHA\
  \ 有权执行 NIOSH 推荐的所有安全和健康法规和标准。尽管 OSHA 隶属于美国劳工部，但 NIOSH 隶属于美国卫生与公众服务部，是一个旨在通过收集信息、开展科学研究并将获得的知识转化为产品和服务来帮助提供职业伤害、残疾和死亡领域的科研、信息、教育和培训的机构。NIOSH\
  \ 的使命对每一位美国工人的健康和安全至关重要。NIOSH 的目标包括以下内容：\n\n- 1) 开展研究以减少与工作相关的疾病和伤害\n- 2) 通过干预、建议和能力建设促进安全健康的工作场所。\n\
  - 3) 通过国际合作增强全球工作场所安全和健康。\n\nNIOSH 口袋指南可在网上找到：http://www.cdc.gov/niosh/npg/pgdstar.html。它包括安全信息、某些化学特性以及\
  \ OSHA 允许接触限值浓度，或 PEL。允许浓度越低，对人类健康的危害越大。根据法律，这些浓度值在工作场所不得被超过。必须对这些化学品进行浓度测量，以便了解暴露水平并解决任何记录在案的过度暴露情况。\n\
  \n### 5.7.1.3 材料安全数据表\n\nMSDS 是由化学品制造商编制的文件。MSDS 包含安全和危险信息、物理和化学特性以及安全操作和使用的预防措施。它还可能包括对动物，特别是水生物种的危害。制造商有义务保持其最新。任何购买化学品的雇主均依法有义务向雇员提供\
  \ MSDS。MSDS 的编制要求源于 OSHA 的《危害沟通标准》。\n\n### 5.7.1.4 综合风险信息系统\n\nIRIS 是由 USEPA 维护的数据库。IRIS\
  \ 代表综合风险信息系统。可通过 http://www.epa.gov/ngispgm3/iris/index.html 获取。IRIS 是可能因接触环境中发现的各种物质而导致的人体健康影响数据库。\n\
  \n### 5.7.1.5 纳米技术立法\n\n请评论从 OSHA 角度来看，为环境控制/关注纳米技术（操作者）需要何种程度的新立法和规则制定。工作场所接触化学物质（包括纳米颗粒）以及肺毒性的潜在风险受\
  \ OSHA 法案下的 OSHA 管制，包括要求在 MSDS 上披露潜在危害。（一个有趣的问题是，碳纳米管在化学上是碳，但由于其尺寸和结构不同，其性质不同，对于\
  \ MSDS 目的而言是否被视为与炭黑相同或不同）。预计政府和私营机构都将制定工作场所暴露所需的最适阈值限值（Theodore 2006）。\n\n## 5.8\
  \ 工业过程安全系统指南\n\n工业安全系统是石油和天然气厂以及核电厂等任何危险工厂中的关键对策。它们用于在工艺超出允许控制范围时保护人员、工业厂房和环境。\n\
  \n顾名思义，这些系统并非旨在控制工艺本身，而是提供保护。工艺控制通过工艺控制系统（PCS）进行，并由安全系统联锁，以便在 PCS 失效时立即采取行动。\n\n\
  工艺控制和安全系统通常合并为一个系统，称为集成控制和安全系统。工业安全系统通常使用经过安全完整性等级（SIL）认证的专用系统。SIL 定义为安全功能提供的相对风险降低水平，或指定目标风险降低水平。简单来说，SIL\
  \ 是对安全仪表功能所需性能的衡量。SIL 适用于硬件和软件要求，如卡件、处理器冗余和表决功能。在任何情况下，安全都不得因成本而受损（CCPS 2012；Crowl\
  \ and Louvar 2011；Das and Prabhudesai 1996）。\n\n\n\n\n## 5.8.1 安全系统类型\n\n化工及相关产品行业中的*安全系统*主要有两种类型：\n\
  \n- 过程安全系统或过程停车系统（PSS）\n- 安全停车系统（SSS）：包括紧急停车（ESD）和紧急泄压（EDP）系统\n\n还存在第三种系统，它起到屏障作用，容纳来自法兰、阀门和管接头喷出的热油和气体。这类系统通常称为安全喷溅防护罩和法兰护罩。OSHA\
  \ 规定必须使用喷溅防护罩。\n\n### 5.8.1.1 紧急停车系统\n\n这些系统也可按 ESD/EDP 级别重新定义如下：\n\n- ESD 1 级：负责全厂区域停车，必要时可激活\
  \ ESD 2 级。该级别只能在过程工业工厂的主控室中启动。\n- ESD 2 级：该级别将各个 ESD 区域停车并隔离，必要时激活 EDP。\n- ESD 3\
  \ 级：该级别提供“液体物料截留”。\n\n### 5.8.1.2 安全停车系统\n\n在紧急情况下，SSS 应将设施停车至安全状态，从而保护人员、环境和资产。SSS\
  \ 应管理与 ESD 功能（环境和人员保护）相关的所有输入和输出。该系统也可能由主火灾和可燃气体系统（FGS）的信号驱动。\n\n### 5.8.1.3 火灾和可燃气体系统\n\
  \n火灾和可燃气体系统（FGS）控制的主要目标是保护人员、环境和工厂（包括设备和结构物）。FGS 应通过以下方式实现这些目标：\n\n- 在早期阶段检测可燃气体的存在\n\
  - 在早期阶段检测液体泄漏（LPG 和 LNG）\n- 检测初期火灾和火灾的存在\n- 按需提供自动和/或手动启动消防系统的设施\n- 启动环境调节，使液体保持在其闪点以下\n\
  - 按需启动声光报警信号，以警告检测到的危险\n- 当 2 个检测器中 2 个或 3 个检测器中 2 个被触发时，自动关闭设备和通风\n- 启动排风系统\n\n\
  ### 5.8.1.4 紧急泄压系统\n\n在工艺过程中，由于 ESD 阀关闭，可能会有一些被截留的可燃流体，必须将其释放以避免任何不良后果（如容器和管道中的压力升高）。为此，EDP\
  \ 系统与 ESD 系统结合使用，以安全的方式将这些截留的流体释放到安全位置。\n\n### 5.8.1.5 压力安全阀\n\n压力安全阀（PSV）通常用作最终安全解决方案：当所有前述系统都未能阻止压力进一步积聚时，通过其设计动作保护容器免因超压而破裂。\n\
  \n## 5.9 工业卫生\n\n*工业卫生*或*职业卫生*是对可能导致工人受伤、患病或影响其健康的工作场所危害进行预见、识别、评估、控制并确认防护措施。这些危害或应激源通常分为生物、化学、物理、人体工效学和社会心理等类别。特定应激源产生健康影响的风险是危害程度乘以个人或群体暴露量的函数。对于化学品，其危害可通过剂量-反应关系来理解，该关系通常基于毒理学研究或模型。*工业卫生学家*与毒理学家密切合作以了解化学危害，与物理治疗师合作应对物理危害，与医生和微生物学家合作应对生物危害。环境和工业卫生学家被认为是暴露科学和暴露风险管理方面的专家。根据个人工作类型，卫生学家会运用其暴露科学专业知识来保护工人、消费者和/或社区（Johnson\
  \ 2017）。\n\n### 5.9.1 毒理学\n\n物质有毒的程度称为毒性。毒物是指任何化学物质，当被吸入、摄入、经皮肤吸收，或涂敷、注射入体内或在体内生成时，即使量相对较小，也可能通过其化学反应导致身体结构损伤或人体功能紊乱甚至死亡。大多数化学物质通过呼吸道、消化道、眼睛和皮肤进入人体。\n\
  \n定义了两个毒性水平：（i）急性“短期”暴露，导致立即中毒；（ii）慢性“长期”暴露，导致贫血、白血病和死亡。\n\n### 5.9.2 TLV 与暴露限值\n\
  \n毒性阈限值（TLV）是指在给定时间内可耐受且不产生任何毒性作用的空气中毒物的最大浓度。常用限值的定义如下。\n\nTLV 和暴露限值的不同类型如下：\n\n\
  | TLV-TWA | 正常 8 小时工作日或 40 小时工作周内，工人可暴露且无不良影响的时间加权平均浓度（TWA） |\n| TLV-STEL | 短时间暴露限值，即工人连续暴露至多\
  \ 15 分钟而无不良影响的最大浓度 |\n| TLV-C | 上限值，即任何时候都不应超过的浓度 |\n| PEL | 容许暴露限值，即 OSHA 29 CFR\
  \ 1910.1000 允许的最大暴露量 |\n| IDLH | 立即威胁生命或健康浓度，即人员可在 30 分钟内逃离而不出现影响逃逸症状或任何不可逆健康影响的最大浓度\
  \ |\n\nTLV 以按体积计的百万分率（ppm）或毫克/立方米（mg/m³）表示。\n\n```\n1 ppm = (P · M) / (0.08205 T)\
  \ mg/m³ = 0.04 M at 25°C and 1 atm\n```\n\n其中\n\n- P = 压力，单位为 atm；\n- T = 温度，单位为\
  \ K；\n- M = 分子量\n\n## 5.10 大气危害\n\n大气危害主要包括三种类型：缺氧大气、爆炸性/可燃性大气和有毒大气。对于这些类型的危害，在进入人孔或其他受限空间之前需要进行空气监测和通风。空气监测设备将在本章后面讨论。应当注意，由工业用户排放引起或促成的大气危害，导致工厂和工作场所内存在数量可能造成工人急性健康与安全问题的有毒气体、蒸气或烟雾，违反了\
  \ 40 CFR 403.5(b)(7) 中的具体禁止规定。\n\n### 5.10.1 缺氧大气\n\nOSHA 对大气中氧气浓度的最低要求为 19.5%。进入氧气浓度低于\
  \ 19.5% 的大气环境必须使用自给式呼吸器。氧气浓度大于 25% 时即为富氧大气，因其能够支持燃烧，也被视为危险。正常空气由表 5.7 所列的气体组成。其他气体（如氮气和二氧化碳）在正常条件下无害，但可能在受限空间中积聚到足以置换维持生命所需氧气的量。当大气中的氧气浓度降至\
  \ 10%–16% 时，人会出现呼吸急促。氧气浓度为 6%–10% 时会发生意识丧失；当氧气浓度降至 6% 以下时，人将迅速死亡。\n\n### 5.10.2\
  \ 有毒大气\n\n评估大气中化学危害的指南有多种。TLV 是由美国政府工业卫生学家会议（ACGIH）制定并发布的指南，用于识别和控制潜在危害。TLV 的一种形式，即\
  \ TWA，是指工人在 8 小时工作日或 40 小时工作周内可接触的蒸气相浓度，且不会产生慢性或急性健康影响。TLV-TWA 数值有时用于计算工业用户排放 VOC\
  \ 的筛选水平。各种化学物质的 TLV 请参见 http://www.acgih.org/tlv-bei-guidelines/tlv-chemicalsubstances-introduction。\n\
  \n美国环保局（EPA）于 1992 年 6 月发布了一份题为《保护公有污水处理厂（POTW）工人免受有毒和活性气体及蒸气危害的指南》（EPA 812-B-92-001）的指导文件。该文件应用于评估暴露于有毒大气的可能性以及避免接触的必要步骤。\n\
  \n**表 5.7 大气成分。**\n\n| 气体 | 体积（%） |\n| 氮气 | 78.09 |\n| 氧气 | 20.95 |\n| 氩气 | 0.93\
  \ |\n| 二氧化碳 | 0.03 |\n\n\n\n\n在这样的环境中。硫化氢（H₂S）是收集系统中常见的一种气体。这种气体由有机物厌氧分解产生，比空气重，容易在密闭空间底部聚集。低浓度时，硫化氢有臭鸡蛋味；但浓度较高时，嗅觉系统会受损，无法通过气味察觉该气体。硫化氢的TLV-TWA为100\
  \ ppm。在较高浓度下，H₂S会对眼睛、神经系统和呼吸系统造成损害。当气体与潮湿组织（如眼睛和呼吸道）接触时，会形成腐蚀性溶液（硫化钠），从而引起刺激和化学危险。在500–1000\
  \ ppm浓度下，呼吸系统会麻痹，导致死亡。\n\n氰化氢气体在氰化物盐与酸性废水流反应时可能产生。氰化物盐常见于电镀槽和金属精加工设施中。这种气体通过阻止血液中的氧气传输而导致死亡。\n\
  \n在用于氰化物破坏的电镀设施中可能会遇到氯气（Cl₂）。除了刺激性气味外，氯气在潮湿环境中具有腐蚀性。它会与肺部和呼吸道中的水分结合形成盐酸。在50 ppm时可能出现肺水肿（肺部积液），在1000\
  \ ppm时迅速导致死亡。\n\n一氧化碳（CO）是收集系统中由有机物厌氧分解产生的另一种气体。暴露于这种气体会导致窒息，因为血液中的血红蛋白对一氧化碳的亲和力是对氧气的300倍。一氧化碳与血红蛋白结合形成碳氧血红蛋白。结果，含有一氧化碳的血细胞无法将氧气输送到身体组织，从而导致死亡。\n\
  \n有毒蒸气也对检查人员和采样人员构成危害。蒸气是通常处于固态或液态物质的挥发性形态。脱脂或光刻胶显影操作中使用的氯化溶剂会产生蒸气，这些蒸气可能在收集系统中积聚。吸入其中一些蒸气会产生麻醉作用。此外，蒸气通常比空气重，会置换密闭空间中的氧气，从而可能导致该空间缺氧。\n\
  \n## 5.10.3 慢性工业暴露\n\n在危险废物管理中，慢性毒性通常由长期低水平接触危险化学品引起。与急性毒性评估相比，由于对化学品的长期影响了解较少，慢性毒性难以量化。图5.16显示了典型的慢性毒性剂量-反应曲线。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_258_0.png)\n\n图5.16 无效应区的剂量-反应函数。\n\n\
  在低污染物浓度下，基本上没有表现出毒性迹象，这称为无效应区。从零剂量到阈剂量无反应的原因是一种生化或生理防御机制，如解毒或排泄，阻止了效应的发生。中间部分从显示出一定毒性的点（阈值）开始上升，然后以S形方式增加，直到达到最大效应。随着化学品暴露量的增加，解毒机制不堪重负，效应得以显现。\n\
  \n## 5.10.4 氯气意外释放：案例研究\n\n位于华盛顿州塔科马的皮尔斯县钱伯斯克里克污水处理厂使用氯进行消毒；该气体在现场储存于一个1吨的容器中。预计最大储存量为十个容器（20\
  \ 000磅），超过了《意外释放预防计划》（USEPA 1996）中规定的风险管理计划（RMP）适用性阈值。氯的阈值为2500磅。这种有毒气体意外释放对厂外可能造成的后果十分严重，因此需要对该情况进行评估。本分析所采用的方法遵循EPA污水处理厂风险管理计划指南（USEPA\
  \ 1998b）以及White的《氯化与替代消毒剂手册》（2010）中提供的指导。\n\n根据《意外释放预防计划》（USEPA 1996），有毒气体最坏情况情景必须假设单个最大容器在10分钟内释放。钱伯斯克里克最大的容器是前面提到的1吨容器。\n\
  \n对于最坏情况情景，假设释放发生时不考虑物理原因或发生的可能性。仅考虑被动缓解措施（例如堤坝、围护结构）\n\n## 表5.9 终点圈内的人口估算。\n\n\

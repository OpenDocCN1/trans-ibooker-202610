  The objective of this work is to present streamlined environmental (LCAs) between
  two competitive disinfection processes: chlorine vs. UV. This section discusses
  the use of LCA to quantify the environmental and public health benefits of UV disinfection
  technology as opposed to chlorination and dechlorination methods. LCA tools are
  used to evaluate the short-term and long-term environmental effects of both processes
  and to select the best sustainable process. Our approach applies environmental LCA
  to these disinfection processes, incorporating economic criteria and all aspects
  of the environment: chemical use, electricity use, and releases to water, air, and
  land.


  ## 6.5.1 The Challenge


  With increasing emphasis on promoting sound ecological practices and concern over
  introducing toxic chemicals into water, designs for disinfection processes are increasingly
  leaning toward technologies that destroy pathogens while balancing the effects of
  this disinfected wastewater on aquatic biota or a drinking water supply.


  In the United States and Canada, the use of ultraviolet light irradiation for the
  disinfection of wastewater has become the accepted alternative to chlorination or
  chlorination/dechlorination. There are several reasons for this move away from a
  proven technology. For example, because of current Uniform Fire Codes, containment
  requirements for volatile gases like chlorine, and public health concerns, municipalities
  are limited in the amounts of chlorine that can be stored in a water treatment plant.
  Moreover, the dechlorination process uses yet another chemical pollutant, sulfur
  dioxide, to remove chlorine from the effluent before discharged into the receiving
  water. Thus, and because chlorination/dechlorination of wastewater produces possible
  carcinogens in addition to destroying aquatic biota in the receiving waters, USEPA
  started to look for an alternative wastewater disinfection system.


  Various governments, municipalities (Das 2002, 2004; Das and Ekstrom 1999; Ecology
  1998; LOTT 1994; USEPA 1986, 1992b), and corporations have sponsored research (Loge
  et al. 1996; Scheible 1987; Scheible and Forndran 1986; White 2010) that shows that
  the UV disinfection of wastewater was effective and economical. Another most important
  development was the parallel flow open channel modular UV system. This new design
  of the UV system for wastewater in the early 1980s opened up UV disinfection for
  both the retrofit market and new wastewater treatment plants. To promote a friendlier
  discharge to the marine environment, designers have begun to prefer alternative


  disinfection technologies, which emphasize sustainable and clean ecological disinfectants
  – such a clean technology is UV disinfection.


  ## 6.5.2 The Chlorination (Disinfection) Process


  Despite the acknowledged advantages of disinfection by means of UV irradiation,
  however, chlorine continues to be the most widely used chemical for the disinfection
  of wastewater in the United States and elsewhere. The major advantages of chlorine
  over alternative disinfectants are cost-effectiveness, reliability, and efficacy
  against a host of pathogenic organisms. We turn now to a detailed examination of
  the chlorination process.


  When chlorine (Cl₂) is dissolved in freshwater, a mixture of hypochlorous acid (HOCl)
  and hypochlorite ion (OCl⁻) is formed (Eq. 6.2). Chlorine exists predominantly as
  HOCl below pH 7.6 and as OCl⁻ above pH 7.6. HOCl and/or OCl⁻ is defined as free
  available chlorine, with the hypochlorous acid being the primary disinfectant.


  ```

  Cl₂ + H₂O ↔ HOCl + HCl

  (6.2)

  ```


  Mono-, di-, and tri-chloramines (NH₂Cl, NHCl₂, and NHCl₃) are formed when chlorine
  reacts with nitrogen present in secondary effluent in the form of ammonia. Municipal
  effluents usually contain all these forms of chlorine in some proportion and taken
  together they are known as “total residual chlorine” (TRC). Because saltwater contains
  bromide, the addition of chlorine to saltwater will also form hypobromous acid (HOBr),
  hypobromite ion (OBr⁻), and bromamines.


  Chlorine is typically supplied as liquefied gas in cylinders. Chlorinators apply
  gaseous chlorine to a feed stream which is then injected into a mixing zone in the
  chlorine contact chambers. Initial mixing and effective contact times are essential
  for good process performance. Generally, contact periods of 15–30 minutes are required
  at peak flow (USEPA, 1985).


  ### 6.5.2.1 Limitations


  Although chlorine disinfection is a largely reliable and effective process, it has
  certain limitations. For examples, chlorine reacts with certain chemicals in the
  wastewater, leaving only the residual for disinfection. Wastewater components that
  readily combine with chlorine include reduced iron and sulfur compounds, ammoniated-nitrogen,
  organic nitrogen, tannins, uric and humic acid, cyanides, phenols, and unsaturated
  organics. Cysts of Entamoeba histolytica, Giardia lamblia, and Mycobacterium tuberculosis,
  some viruses, and eggs of parasitic worms show resistance to chlorine. Consistent
  disinfection in effluents containing organic nitrogen may pose problems, even when
  a measured free chlorine residual is present.


  ### 6.5.2.2 Human Health and Environmental Impact


  Chlorine is toxic to aquatic, estuarine, and marine organisms. An additional hazard
  is the carcinogenic potential of chloro-organic compounds. Chlorine gas is potentially
  toxic when inhaled, and chlorine transport poses a risk (see Section 5.10.5 and
  Tables 5.8 and 5.9). Special handling is required and emergency response plans are
  required under right-to-know regulations for on-site storage of gaseous chlorine.
  Chlorine gas and the hypochlorites are also highly corrosive. Chlorine gas concentrations
  of 15–20 ppm for 30–60 minutes are dangerous; higher concentrations for very brief
  periods can be fatal. Chlorination can result in the formation of carcinogenic chloro-organics.


  The EPA has established toxicity criteria for TRC in receiving waters. In freshwaters
  the acute level is 19 mg/l (1-hour average) and the chronic level is 11 mg/l (4-day
  average). The saltwater acute and chronic criteria are 13 mg/l (1-hour average)
  and 7.5 mg/l (4-day average), respectively. Due to the toxicity of chlorine residuals
  at such low concentrations and the high limit of analytical detection (50–100 mg/l),
  chlorine induced toxicity in the receiving stream is difficult to control.


  ## 6.5.3 Dechlorination with Sulfur Dioxide


  In the past decade, concerns over chlorine toxicity and protection of fish and wildlife
  have led to a dramatic growth in the practice of dechlorination to remove all or
  part of the chlorine residual and halogenated organics remaining after chlorination.
  Dechlorination also reduces or eliminates toxicity harmful to aquatic life in receiving
  waters.


  Sulfur dioxide gas successively removes free chlorine, monochloramine, dichloramine,
  nitrogen trichloride, and polychlorinated compounds. When sulfur dioxide is added
  to wastewater, the following reactions occur:


  ```

  SO₂ + H₂O → HSO₃⁻ + H⁺  (6.3)

  HOCl + HSO₃⁻ → Cl⁻ + SO₄²⁻ + 2H⁺  (6.4)

  SO₂ + HOCl + H₂O → Cl⁻ + SO₄²⁻ + 3H⁺ (free chlorine) (6.5)

  SO₂ + H₂O → HSO₃⁻ + H⁺  (6.6)

  NH₂Cl + HSO₃⁻ + H₂O → Cl⁻ + SO₄²⁻ + NH₄⁺ + H⁺  (6.7)

  SO₂ + NH₂Cl + 2H₂O → Cl⁻ + SO₄²⁻ + NH₄⁺ + 2H⁺ (combined chlorine) (6.8)

  ```


  For the overall reaction between sulfur dioxide and chlorine (Eq. 6.5), the stoichiometric
  weight ratio of sulfur dioxide to chlorine is 0.9 : 1. In practice, it has been
  found that about 1.0 mg/l of sulfur dioxide will accomplish for the dechlorination
  of 1.0 mg/l of chlorine residue


  (expressed as Cl₂). Because the reactions of sulfur dioxide with chlorine and chloramines
  are nearly instantaneous, contact time is not usually a factor and contact chambers
  are not used; however, rapid and positive mixing at the point of application is
  an absolute requirement.


  The ratio of free chlorine to the total combined chlorine residual before dechlorination
  determines whether the dechlorination process is partial or proceeds to completion.
  If the ratio is less than 85%, it can be assumed that significant organic nitrogen
  is present and that it will interfere with the free residual chlorine process (Metcalf
  and Eddy 2003).


  Since dechlorination removes most of the TRC from disinfected wastewaters, it reduces
  the toxicity of disinfected wastewater effluent to aquatic wildlife. In most situations,
  sulfur dioxide dechlorination is a very reliable unit process in wastewater treatment,
  provided the precision of the combined chlorine residual monitoring service is adequate.
  Excess sulfur dioxide dosages should be avoided not only because of the chemical
  wastage but also because of the oxygen demand (BOD and COD) exerted by the excess
  sulfur dioxide.


  ### 6.5.3.1 Limitations


  Chlorination/dechlorination is more complex to operate and maintain than chlorination
  alone. Major difficulties are the inability to measure residual SO₂ and problems
  in the continuous measurement of a zero or low chlorine residual. Many halogenated
  organics are also rapidly formed upon chlorine addition and are unaffected by application
  of SO₂. Heltz and Nweke who examined many plants, reported that the amount of residual
  chlorine in dechlorinated effluents considerably exceeded EPA criteria for receiving
  waters (Heltz and Nweke 1995).


  ### 6.5.3.2 Environmental Impact


  Sulfuric acid and hydrochloric acid are products of SO₂ dechlorination in small
  amounts but are generally neutralized in the wastewater. Based on laboratory experiments,
  residuals of sulfite dechlorination are at least three orders of magnitude less
  toxic than chlorine or ozone.


  No cases of sulfur compounds affecting dissolved oxygen consumption or pH change
  in receiving waters or in dechlorinated effluents have been reported. In pilot studies,
  no significant oxygen depletion occurred until sulfur dioxide overdoses exceeded
  50 mg/l. It is not uncommon, however, to find plants with post aeration after dechlorination
  to assure that dissolved oxygen requirements are met. Dechlorination with SO₂ would
  significantly reduce toxicity due to chlorination disinfection process.


  Sulfur dioxide, which is used for dechlorination purposes, is stored on site in
  small quantities. The maximum




  预计的储存库存量相当小，且无需担心对工人健康或附近居民区居民的健康构成威胁。



  \ 99.5% 去除 PM10 的效率。\n\n## 7.12 成本指数和设备成本估算\n\n目前可用于初步或预设计估算的大多数成本数据仅在开发当时有效。由于经济条件变化，价格可能随时间发生显著变化，因此必须使用某些方法将过去某个日期适用的成本数据更新为代表以后时间条件的成本。这可以通过使用成本指数来完成。\n\
  \n成本指数是某一特定时间项目或设备组的成本与过去某个基期成本的比率。政府会发布劳动力和材料（零售和批发）的指数。最熟悉的指数是商务价格指数，每年提供通胀的衡量。在等价成本估算中，使用设备或工艺成本指数来更新设备成本如下：\n\
  \n```\nCost_present = Cost_past (present index/past index) (7.4)\n```\n\n在估算工艺和空气污染控制设备成本时，经常使用的两个指数如表\
  \ 7.11 所示。Marshall-Swift 和 Chemical Engineering 成本指数的简要描述见《Chemical Engineering》期刊。\n\
  \n## 示例 7.10 1991 年一台 0.2 m³ 玻璃衬里夹套反应器（无驱动）的购置成本为 $10 000。估算 1996 年一台类似的 1.2 m³\
  \ 玻璃衬里夹套反应器（无驱动）的购置成本。使用年平均 Chemical Engineering 厂房成本指数更新反应器的购置成本。玻璃衬里夹套反应器的成本与容量的指数为\
  \ 0.54。\n\n### 解答\n\n1991 年的 Chemical Engineering 厂房成本指数为 361.3，1996 年为 381.7（表\
  \ 7.11）。因此使用式（7.4），我们得到 1996 年反应器的成本\n\n```\n= ($10 000)(381.7/361.3)(1.2/0.2)^0.54\
  \ = $27 800\n```\n\n### 7.12.1 设备成本\n\n工艺设备成本可通过以下关系与尺寸或容量相关联。\n\n```\nCost_B =\

  \ and Chemistry*（环境毒理学与化学）, Vol. 3, 617–630。\n\n## 4.4.4 一般废水排放许可\n\n*一般许可*是为某一类别的排放者而非单个设施制定的废水排放许可。一般许可可依据联邦（实际上是合并的\
  \ NPDES/州）或仅州权限发布。《一般废物排放许可计划规则》第 173-226 WAC 章在其目的声明中阐明了其意图：“依据本章签发的许可旨在满足联邦《水污染控制法》第\
  \ 307 和 402(b) 条款（33 U.S.C. § 1251）以及州水污染控制法（第 90.48 RCW 章）对排放许可的要求。”一般许可通常有效期为五年。符合该许可覆盖资格的设施申请覆盖后，将在许可剩余有效期内受到保护。被许可人必须在到期前至少\
  \ 180 天重新申请许可覆盖。\n\n### 4.4.4.1 废水流量\n\n由于收集和处理设施的水力设计均受废水流量波动的影响，必须根据现有记录仔细分析流量特性。在只有收集系统中流量数据的情况下，必须认识到，由于流量的特性，进入处理厂的流量可能与收集系统中的流量略有不同。\n\
  \n### 4.4.4.2 质量保证\n\n必须实现极低的检出限和定量限，以减少分析变异性以及低于分析检出限的样品数量。为帮助减少样品变异，样品收集和分析期间的质量保证（QA）程序应包括仔细关注美国环境保护署（USEPA\
  \ 1995a）确定的主要要素，包括样品容器和过滤单元的特殊清洁程序、直接采集到预清洁样品容器中的瞬时样品、使用实验室清洁过滤单元进行现场过滤、现场和实验室空白样、标准参考物质以及现场和实验室平行样。任何研究的\
  \ QA 程序及结果均应在单个项目计划和报告中加以记录。\n\n## 4.5 采样与 QA/QC 计划\n\n为确保 POTW 采样的质量，POTW 应制定一项总体计划，概述其进行采样以满足预处理计划要求的所有程序。此处，该计划被称为采样与质量保证计划，或简称为*该计划*。许多\
  \ POTW 拥有一项涵盖此处建议信息的计划，但称呼不同，例如 SOP（标准操作程序）。无论其名称如何，重要的是 POTW 必须对 QA/QC、样品设备维护、样品收集、样品记录、样品运输、保管链（COC）程序以及\n\
  \n\n安全。本计划应由所有检查和/或采样人员使用，以确保样本采集具有一致性，数据质量高，并在必要时可作为法庭证据。该计划应确保采集具有代表性的样本；遵守40\
  \ CFR第136部分的样本采集和保存程序；维持样本完整性；在采样过程中遵循安全操作规范；并执行质量保证/质量控制（QA/QC）程序。检查人员应在任何采样前联系实验室，讨论采样计划和QA/QC程序，分配实验室时间，并获取样本识别编号以及现场和运输空白样。\n\
  \n采样和质量保证计划应是检查人员和采样人员的指南或参考。根据对采样和质量保证计划的审查，检查人员或采样人员应针对每个工业用户定制具体的采样行动计划。一般而言，采样和质量保证计划应列出采样团队的所有准备和采样操作。POTW计划中的并非所有项目都适用于所有工业用户的采样事件。在某些情况下，由于工业用户设施不可控的情况，检查人员和采样人员可能需要偏离计划中规定的程序。如果检查人员认为设施状况需要此类变更，检查人员有权偏离计划。然而，只要可能，应遵循计划中的各项要素以保持一致性。如果现场出现导致无法或物理上不可能执行程序的情况，检查人员应记录任何偏离计划的行为及其原因。\n\
  \n## 4.5.1 QA/QC 程序\n\nQA/QC程序是维持测量、记录和数据解释中特定质量水平所必需的工具。POTW为确保工业用户和POTW采样以及工业用户自我监测数据质量良好而使用的QA/QC程序，应在《采样和质量保证计划》中加以规定（Keith\
  \ 1991）。QA是用于预防错误并确保测量数据质量的计划功能，而QC是执行《QA计划》中所述程序的过程。计划中的QA活动应是通用的，而QC活动则是具体的。QA计划应通过使用既定程序来控制数据质量，以满足计划要求。QC计划旨在确保持续执行测量过程所需的程序，以达到规定的性能标准（例如通过仪器校准和分析参考未知样）。描述校准计划的时间表属于QA，而实际的校准程序属于QC。\n\
  \nPOTW生成或使用的数据必须具有已知、可辩护且可验证的质量。这包括通过工业设施自我监测生成的数据。因此，工业用户也应制定QA/QC程序，以确保其作为定期合规报告一部分提交的数据的有效性。所有检查及因检查而获得的数据都有可能被用于执法程序，并应被视为可能被法庭接受的潜在证据。\n\
  \n为了产生可在执法行动中接受的证据，在现场（采样期间）和实验室中都需要QA和QC程序（Keith 1991）。现场使用的QA/QC程序与实验室使用的程序是分开的，但两者对于获得可靠数据都至关重要。本节讨论了实验室和现场的QA/QC。QA/QC程序用于获取既精确（两个或多个样本之间的接近程度）又准确（样本分析结果与应获得的真实值之间的接近程度）的数据。通过遵循QA/QC程序，POTW对报告的分析数据有效性的信心增加。\n\
  \n## 4.5.2 采样QA程序\n\n针对采样设备和现场测量程序的QA计划对于确保最高质量的数据是必要的。检查人员应认识到在样本采集中实施QA的重要性，以最小化诸如不恰当的采样方法、样本保存不良以及混合和测试过程中缺乏充分混合等常见错误。再次强调，这些活动的每一项都应是POTW《采样和质量保证计划》的一部分，以便所有POTW采样人员都熟悉正确的采样程序。QA检查将帮助检查人员判断样本采集技术是否足以满足数据的预期用途。除了第4.5.1节中讨论的一般计划组成部分外，POTW的《采样和质量保证计划》还应包含这些现场QA要素，采样技术人员应理解并应用它们：\n\
  \n- 每种受管制污染物所需的分析方法；特殊的样本处理程序；以及所有必需分析方法的精确度、准确度和检测限值。\n\n框架、从安装在现场的两组现场设备中采集平行样本，或从现场的一台设备中采集平行瞬间样本。平行样本检查分析精确度，并评估样本分样的“代表性”。\n\
  \n### 4.5.3.3 分割样本\n\n这些样本被分成两个容器，供不同的实验室进行分析。这些样本提供了识别工业用户（或其承包实验室）分析技术和程序差异的极佳手段。当从单个复合样品瓶填充分割样本时，充分摇匀复合样本，装满样本容器的一半，然后再次摇匀复合样本，装满许可持有人容器的一半。对为特定参数或感兴趣的地点采集的每个样本重复此程序。有时，样本在工业用户和POTW之间分割，两者都将其分割的样本发送到不同的实验室进行分析。请注意，由于污染物的性质，油和油脂样本无法分割。\n\
  \n## 4.5.4 实验室QA/QC\n\n实验室QA/QC程序通过仪器校准和控制样本的处理，确保分析和结果的正确性与代表性。实验室发现的精确度指的是结果的可重复性。在实验室QC计划中，样本使用相同的方法和条件集独立分析（多次）。精确度通过比较测量值来估算。准确度指的是观测值与已知或实际值之间的差异程度。方法的准确度可通过分析添加了已知量参考标准的样本来确定。\n\
  \n实验室QA/QC程序可能相当复杂。通常，分析方法会指定校准、干扰检查（例如电感耦合等离子体质谱分析）、控制样本、加标（包括标准加入法）、空白污染物水平和仪器调谐的QA/QC要求。准确度通常通过分析空白样、标准样、空白加标样、实验室控制样本和加标样来确定。精确度通过比较有机分析中的平行结果或平行加标结果来确定。如需了解有关实验室QA/QC的更多信息，POTW应联系其QA经理或认可机构。\n\
  \n内部或承包实验室用于分析工业用户样本的方法必须是EPA根据40 CFR第136部分批准的方法，因此被法庭接受为分析和检测水和废水最可靠和准确的方法。虽然一些现场测试套件可作为当前状况的指示器（因此，可用于过程控制考虑），但它们不适合用于旨在验证或确定合规性的采样。如果使用非EPA批准的方法进行分析，数据将不被视为证明不合规的证据。在选择承包实验室时，POTW应在适用的情况下查阅其所在州认可的实验室标准，或获取并审查该实验室QA/QC计划的副本。如需了解有关实验室考量的更多信息，POTW应参阅EPA的《POTW预处理计划开发指南手册》（USEPA\
  \ 1983, 1985a）。\n\n进行样本分析的实验室应使用以下控制措施作为其QA/QC计划的一部分：\n\n- 前处理/试剂空白 – 一种由试剂组成（不含目标分析物或样本基质）的样本，在适当的点引入分析程序，并经过所有后续步骤，以确定试剂和/或分析步骤对观测值中任何错误的贡献。\n\
  \n- 质量控制样本 – 这是一种未受污染的样本基质，其中添加了来自独立于校准标准的来源的已知量分析物。使用此样本建立实验室内部或特定分析员的精确度和偏差，或评估测量系统全部或部分性能。\n\
  \n- 基质加标（MS）和基质加标平行样（MSD） – 两个环境样本分样，在实验室中添加了已知量的感兴趣分析物和替代物（如适用）。MS/MSD制备和分析方式与现场样本完全相同。其目的是量化由样本基质引起的任何额外偏差和不精确度。必须单独测定样本基质中分析物的本底浓度，并将MS/MSD中的测量值减去本底浓度。\n\
  \  - 使用MS来验证分析程序的准确性。\n  - MSD是MS样本的平行样。它衡量分析精确度，以相对百分差表示。\n\n- 实验室平行样 – 这是接收实验室后随后分成两份或更多份的样本。每份单独且以相同方式制备和分析。实验室平行样结果用于检查实验室精确度。\n\
  \n\n\n\n\n## 4.5.5 采样位置\n\n采样准备工作的第一步是确认采样位置是否适当。工业用户许可证必须规定用于合规性采样的采样位置 [40 CFR\
  \ 403.8(f)(1)(iii)(B)(4)]（CFR，§52.21(aa)(2)(v)，1980）。采样点应设置在除所监测工业用户工艺排放外没有其他排放的位置。该采样位置必须能够代表设施的实际排放情况。具有代表性的采样位置，是指能够获取与所排放的大体积废水具有尽可能相同组成、且能够反映设施正常运行日排放特征的样品的位置。便利性、可达性和安全性都是重要考虑因素，但其优先级低于样品的代表性。最具代表性的样品应从水流湍流充分、混合均匀且固体沉降可能性最小的废水深度处采集。样品采集深度应为废水流深度的40%–60%。为避免污染，检查员应注意从水流中心采集样品，并使采样装置或容器的开口朝向上游。对于宽阔的渠道或流路，可能需要进行染料测试，以确定最具代表性的采样位置。如果染料测试无法得出明确结论，则可能需要通过横截面采样收集多个样品。\n\
  \n检查员应使用工业用户许可证中规定的采样位置。如果许可证规定的采样位置不足以采集具有代表性的样品，检查员应确定替代位置。该决定应依据检查员对工厂本身、生产工艺和排放口的了解。如果许可证中描述的采样位置与检查员认为最具代表性的位置存在冲突，则应在两个位置分别采样。应对冲突原因进行充分记录，以便由POTW在后续解决。如有必要，应修订许可证或其他控制机制，以反映更具代表性的采样位置。除非标准规定了不同的采样位置，否则CWA联邦分类标准适用于工艺末端（或存在处理工艺时的处理末端）（例如，在40\
  \ CFR第433部分金属精加工中，氰化物的采样位置应位于氰化物破坏系统之后、与其他水流稀释之前）。如果工艺排放在处理前与不受监管的废水流或稀释水混合，则必须采用CWA（USEPA\
  \ 1985b）（40 CFR 403.6）。在这种情况下，POTW将在工业用户许可证或其他控制机制中指定采样点的位置（管道末端、工艺末端，或两者）。POTW必须确保工业用户采样点的任何变更不会使用户以稀释替代充分处理，从而达到适用标准的合规要求。如果经处理的受监管工艺废水流在处理前与受监管工艺产生的其他废水混合，工业用户可以监测分隔的工艺废水流或混合废水流，以确定是否符合适用的预处理标准。\n\
  \n## 4.5.6 样品类型\n\n样品有两种基本类型：瞬时样品和混合样品。必须清楚了解工业用户将采用的采样类型，并应在设施的《采样与质量保证计划》中予以说明。设施必须建立采集瞬时样品和/或混合样品的具体程序，这一点非常重要。根据40\
  \ CFR 403.12(g)(3)，pH值、氰化物、总酚、油和油脂、硫化物以及挥发性有机化合物必须使用瞬时样品。对于所有其他污染物，必须通过流量比例混合采样技术获取24小时混合样品，除非规程中规定使用时间比例混合采样或瞬时采样。如果规程建议使用时间比例混合采样或瞬时采样，则样品必须能够代表排放情况，并且允许采用替代采样方式的决定必须记录在该设施的档案或任何控制机制中。\n\
  \n工业用户许可证或控制机制必须规定每个受监管参数所对应的正确样品类型；为确定合规性，检查员必须采集规定类型的样品。对于工业用户许可证或控制机制中规定的样品类型所存在的任何问题，都应予以记录。如有必要，可能需要修订或修改许可证或其他控制机制。\n\
  \n### 4.5.6.1 瞬时样品\n\n瞬时样品是指在不超过15分钟的时间内采集的单个样品。瞬时样品通常采用人工方式采集，样品体积取决于需要进行的分析数量。采样人员必须确保采集的样品体积足以完成所有必要的分析程序，包括QA/QC。瞬时样品反映的是采样时刻的状况，并不一定代表其他时间的状况。在以下情况下，适合采用瞬时采样方法：\n\
  \n- 40 CFR 403.12(g)(3)要求pH值、温度、氰化物、总酚、油和油脂、硫化物、挥发性有机化合物、微生物测试以及余氯使用瞬时样品。\n- 当排放不是连续进行时（即排放时间不超过1小时的批次排放），并且仅限于该批次持续搅拌或充分混合、且可以合理假定污染物均匀分散的情况。\n\
  - 对某设施进行采样时，如果能够在先前的瞬时样品与混合样品数据之间建立统计关系。\n- 对排放物进行筛查，以确定某项参数是否存在时（注意：这仅适用于样品充分混合并能够代表排放的情况）。\n\
  - 当排放期间废物状况相对稳定时（即充分混合且均匀）。与复杂的采样活动相比，瞬时样品能够以简单、准确的方式确定废物特征。\n- 当工业设施、POTW或州采用基于瞬时样品的瞬时地方限值时。\n\
  - 瞬时样品有助于表征工业用户废水流量和水质的波动或极端情况（即污染物浓度或负荷的变化），因此有助于识别冲击负荷。\n\n有关何时适合使用瞬时样品确定合规性的更多指南，请参阅EPA备忘录《使用瞬时样品检测违反预处理标准的行为》，网址为\
  \ http://www.epa.gov/npdes/pubs/pretreatment_memo_grabsamplesdetectviolations.pdf。\n\
  \n### 4.5.6.2 混合样品\n\n混合样品是指在一段时间内采集的样品，可以通过连续采样或混合离散样品获得。混合样品代表混合期间废水流的平均特征。在以下情况下采集混合样品：\n\
  \n- 需要获得混合期间的平均污染物浓度\n- 计算单位时间的质量负荷\n- 废水特征变化较大\n\n混合样品采集的主要方法是时间混合和流量比例混合。许可证可能会规定应使用哪种类型的混合样品。\n\
  \n混合样品可以通过人工混合多个瞬时样品采集，也可以使用自动采样设备采集。检查员在选择混合方法、采样设备和质量保证程序时，应考虑废水流量、参数浓度以及经EPA批准的方法的变化情况（图4.1）。以下将介绍混合采样方法；这些方法均依赖于连续或定期采样。\n\
  \n时间比例混合采样：由以恒定时间间隔采集的、体积恒定的离散样品等分部分组成。当被采样水流的流量相对恒定时（即流量随时间变化不超过平均流量的10%），该方法能够提供具有代表性的样品。\n\
  \n流量比例混合采样：采集流量比例混合样品有两种方法。\n\n第一种方法中，样品采集间隔时间恒定，每个样品的体积与该时刻的流量成比例（即样品体积随流量变化而变化）。人工混合采样时，首选采用这种方法。该方法要求在运行日内采集离散样品，然后进行人工混合。采用该方法时，必须在整个采样期间持续记录准确的流量数据（ISCO\
  \ 2001）。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_145_0.png)\n\n图4.1 ISCO自动可编程混合采样器。\n\
  \n\n\n\n\n## 4.5.6 复合采样方法（根据上下文推断，表 4.5）\n\n### 表 4.5 复合采样方法的优缺点。\n\n| Method |\
  \ Advantages | Disadvantages | Comments |\n|---|---|---|---|\n| *Time-proportional\
  \ composite*<br>Constant sample volume, constant time interval between samples.\
  \ | Minimal instrumentation and manual effort. Requires no flow measurement. | May\
  \ lack representativeness especially for highly variable flows. | Widely used in\
  \ both automatic samplers and manual handling. |\n| *Flow-proportional composite*<br>-\
  \ Constant sample volume, time interval between samples proportional to stream flow.\
  \ | Minimal manual effort. | Requires accurate flow measurement reading equipment.\
  \ | Widely used in automatic as well as manual sampling. |\n| - Constant time interval\
  \ between samples, sample volume proportional to total stream flow at time of sampling.\
  \ | Minimal instrumentation. | Samples must be manually composited. Discrete samples\
  \ must be taken. Chance of collecting samples that are too small or too large for\
  \ a given composite volume. | Used in automatic samplers and widely used as manual\
  \ method. |\n\n第二种流量比例采样方法涉及对每单位废流量的废流收集恒定样品体积（例如，每 5000 加仑流量收集 200 毫升样品），采样时间间隔与流量的倒数成比例。当使用自动采样器采集复合样品时，这是首选方法。该方法基于在排放一定量的废水后采集样品。该方法在流量测量准确时可提供所有废流的代表性样品。复合样品应在工作日内采集。如果设施\
  \ 24 小时/天运行并排放，则复合样品应作为 24 小时复合样品采集（流量比例或时间复合）。如果设施 24 小时/天运行但仅排放 6 小时废水，则应采集 6\
  \ 小时复合样品。一般而言，只要限值是日、周或月平均值，复合样品应采集以评估对分类标准的合规性和地方限值，除上述必须通过抓样采集的参数外。\n\n如果在法规中明确了采样方案，则复合时间段的持续时间和等分采集频率由州许可证编写者确定。无论是手工采集还是自动设备采集，样品采集的时间范围都应在\
  \ NPDES 许可证中规定。构成复合样品的单个等分数量也应规定。\n\n表 4.5 列出了每种复合采样方法的优缺点。可以采用手动或自动采样技术。如果样品手动复合，应尽量减少样品操作，以降低污染的可能性。检查员必须使用许可证或其他控制机制中规定的采样方法，而该方法又必须反映\
  \ 40 CFR 403.12(g)(3) 的要求（CWA 1972）。\n\n复合样品不合适的案例很多。某些参数如 pH、残余氯、温度、氰化物、挥发性有机物、微生物测试、油脂和总酚的样品不应复合。它们也不推荐用于采样批次或间歇过程。在这些情况下，需要抓样来确定排放水质的波动。对于生物测定，除非已知排放物在特定时间毒性最大，否则使用复合样品。一些有毒化学物质寿命短，迅速降解，即使在冷藏或其他形式的保存下，经过长时间复合后也不会以最有毒的形式存在。在这些情况下，要求对生物测定进行抓样。在缺乏\n\
  \n## 4.5.7 连续监测\n\n连续监测是少数参数的另一种选择，例如 pH、温度、溶解氧（DO）、电导率和 TOC。可靠性、准确性和成本因参数而异。连续监测可能很昂贵，因此连续监测通常只适用于排放最显著且排放水波动的排放者。排放水中这些参数变化的环境意义应与可用连续监测设备的成本进行比较。关于\
  \ pH 限值的法规允许在排放物被连续监测时出现一段时间的超标（40 CFR 401.17）。在允许 pH 超标的情况下，需要连续监测或通过抓样进行劳动密集型的定期监测。\n\
  \n## 4.5.8 样品保存和保存时间\n\n保存技术确保样品在采集时仍代表废流。由于采集样品中的大多数污染物在某种程度上不稳定，这种不稳定性要求样品立即分析或保存或固定，以最大限度地减少污染物浓度或特性在采集时间和分析时间之间的变化。由于通常不可能立即分析，大多数样品无论分析时间如何都会被保存。这种保存必须在采集样品后尽快进行。这意味着保存必须在现场进行（CWA\
  \ 1972 40 CFR 136.3）。用于保存样品的最常见程序包括冰镇、冷藏、pH 调整和化学固定。当使用化学固定时，化学保存剂必须在样品转移到实验室之前添加。同样，冷藏应在采集样品后立即提供。对于许多样品，如果未适当使用保存，细菌会迅速降解某些污染物成分（例如酚类和磷）。其他成分如氰化物和硫化物可能会挥发，或在六价铬的情况下反应形成不同的化学物质。每个参数的适当保存和保存时间对于监测计划的完整性至关重要。然而，在采集\
  \ 24 小时复合样品时可能会遇到问题。由于样品在复合过程中可能变质，因此有必要在复合过程中保存或稳定样品，并在将样品运送到实验室之前保存总体样品。保存技术因要测量的污染物参数而异；因此，检查员必须熟悉\
  \ 40 CFR 第 136 部分的保存技术，以确保样品的正确处理和运输。重要的是要验证一种参数的保存技术不会影响同一样品中另一种参数的分析结果。如果存在这种可能性，则应采集两个独立样品并分别保存。样品保存应在复合过程中进行，通常通过冷藏至小于或等于\
  \ 6°C（或冰镇）进行保存，如要求（CWA 1972 40 CFR 136.3）。冷藏是最广泛使用的保存技术，因为它对样品组成没有不利影响，也不会干扰任何分析方法。冷藏抑制生物活性并减少溶解气体和有机物质的挥发。该技术用于现场样品采集开始时和样品运输期间，并持续到实验室分析样品为止。样品温度应由检查员验证并记录。如果分析结果将用于执法行动，则这一点尤其重要。\n\
  \n除了保存技术外，40 CFR 第 136 部分还规定了最大保存时间。所列时间是样品采集和分析之间允许的最大时间，样品才被视为有效。某些参数从样品采集到提取/制备的时间和从提取/制备到分析的时间有单独的保存时间。复合废水样品在最后一个等分采集时成为样品。抓样保存时间从样品采集时开始。此时，保存时间限制开始。保存方法和保存时间清单在\
  \ 40 CFR 136.3（CWA 1972）中提供。检查员应查阅 40 CFR 第 136 部分以获取最新和最详细的规范。这些样品保存程序和保存时间由 EPA\
  \ 选择，因为它们减缓了样品降解并通过尽可能延长保存时间来最大限度地减少监测成本。\n\n## 4.5.9 样品文件记录\n\n文件记录是任何预处理计划不可或缺的一部分。通过文件记录和记录保存，确保了在现场（例如\
  \ pH 和流量）和实验室（即化学分析）中采集的样品和获得的数据的有效性。所有记录的信息必须完整准确。未能按照既定程序维护记录和文件可能会导致这些文件在法庭上被视为不可采纳的证据。所有包含数据的现场记录必须由检查员在采集时签署，包括所有\
  \ COC 表格。\n\n## 4.5.10 一般文件记录程序\n\n由于许多采样报告可能用于执法程序，检查员必须对所有样品采集和数据处理保持精确记录。工业设施或\
  \ POTW 的采样和质量保证计划应规定以下信息必须记录在现场记录中：\n\n- Unique sample or log number: All samples\
  \ should be assigned a unique identification number. If there is a serial number\
  \ on the transportation case, the inspector should add this number to their field\
  \ records.\n- Date and time of sample collection: The date and time of sample collection\
  \ must be recorded. In the case of composite samples, the sequence of times and\
  \ aliquot size should be noted.\n\n\n\n\n\n## 4.5.11 COC 程序\n\n- 样品来源（设施名称和地址）：应记录被采样设施的名称和地址，以及对取样具体地点的叙述性描述和/或示意图。\n\
  - 取样人员姓名：应标明取样人员的姓名。对于混合样品，应包括安装采样器的人员的姓名和取回样品的人员的姓名。\n- 样品类型：每个样品应标明其为瞬时样或混合样。如果样品为混合样，应注明单个样品的体积和频率。\n\
  - 保存方法：应记录添加到样品中的任何防腐剂（包括用量），包括防腐剂用量和保存方法（例如冷藏）。\n- 所需分析：应指定样品应分析的所有参数。\n- 现场分析：现场测量必须在分析完成后立即记录。应在现场进行并记录的分析示例包括：pH、温度、DO、余氯和亚硫酸盐。现场分析应与任何其他样品一样对待（即取样员必须记录样品日期、样品类型、取样员姓名、COC\
  \ 等）。\n- 流量：如果在取样时测量流量，应记录流量测量值。如果样品用于确定合规性，则必须测量流量。\n- 生产率：应包括所生产产品的信息和生产率，因为许多排放限值是基于生产率的。\n\
  - 样品运输的日期、时间及文件记录：应记录运输方式（例如空运或铁路）以及运输单据或提单号码。\n- 备注：此项指与样品或取样点相关的所有相关信息。此类备注包括样品点的状况、样品的观察特征、可能影响样品的环境条件以及取样过程中遇到的问题。\n\
  \n设施/POTW 检查员在进行现场取样时应记录上述每一项，但工业用户在进行其要求的自行监测时也应保留此信息。此信息应可在设施/POTW 进行现场检查或取样访问时供其审查。\n\
  \n一旦获得适当的样品并正确记录样品采集方法，就应制作该样品占有情况的书面记录。“COC”是指对特定样品或一组样品发生的占有变更的 documented 账户（见第\
  \ 4.5.11 节中“保管”的定义）。为确保记录所有必要信息，POTW 应制定 COC 表格。\n\nCOC 程序是监测工业用户的重要方面，这些程序应纳入 POTW\
  \ 的采样和质量保证计划。COC 记录允许准确逐步重现样品路径，从其来源到实验室的最终分析。每个样品都必须附带一份由链中从原始取样员到参与分析样品的最后人员的每位人员正确签署并移交的\
  \ COC 表格。由于无法预测哪些违规行为需要采取法律行动，应假定所有从取样中产生的数据都将在法庭上使用。如果案件最终进入审判，必须确立数据的完整性。只有当 POTW\
  \ 人员能够证明样品已得到适当采集、保存和分析，并且未被篡改或 mishandled 时，取样结果才可在法庭上被采纳。\n\n应在 COC 表格中说明的信息包括以下内容：\n\
  \n- 取样人员的姓名\n- 样品识别号码\n- 样品位置\n- 样品采集日期和时间\n- 待分析参数\n- 使用的容器类型\n- 保存方法\n- 采集的样品类型（即瞬时样、混合样）针对每种待分析污染物\n\
  - 在现场进行的任何分析的结果（例如 pH 和温度）\n- 在现场和实验室处理样品的所有人员的姓名、签名、日期和时间\n\n注：实验室通常有单独的 COC 程序，因此现场使用的\
  \ COC 可能在样品到达实验室时结束。\n\nPOTW 使用的 COC 表格示例见第 D.1 节。所有处理样品的人员都应收到一份显示样品从现场到实验室路径的\
  \ COC 表格副本。所有样品运输必须附带 COC 记录，而这些表格的副本应由发起人保留。此外，所有与运输相关的收据都应保留。承运人通常不会为样品签字；因此，必须使用封条来验证运输过程中未发生篡改。\n\
  \n在转移样品占有期间，受让人必须在 COC 记录上签字并记录日期和时间。一般来说，每个样品都要进行保管转移，尽管如果需要，样品可以作为一组进行转移。每个接管保管的人员必须填写\
  \ COC 记录的相应部分。最后，负责许可和/或合规与执行的 POTW 人员或团体应收到已完成的 COC 表格副本。\n\n如果分析数据要在执法程序中使用，COC\
  \ 记录至关重要，因为它们允许在没有制作记录的人员作证的情况下将此类数据作为证据引入。因此，必须确保所有 COC 记录完整且准确。为保持样品的完整性，COC 记录必须显示样品已得到适当采集、保存和分析，并且在运输过程中未被篡改。COC\
  \ 记录还显示样品已按照方法要求接收和分析。因此，工业用户处采集的所有合规样品都应遵循 COC 程序。\n\n## 4.5.12 样品识别和标签\n\n每个样品必须准确、完整地识别。在采集样品时，应将防水、带胶标签或能够承受现场条件的防水标签附在样品容器上。该标签和/或标签对于防止样品误识别是必要的，因为它为实验室提供了分析所需的相关信息，例如取样员姓名、样品识别号码、样品采集日期和时间、样品采集地点、所用防腐剂、样品类型（瞬时样或混合样）以及待分析参数的识别。因此，样品识别是\
  \ COC 的重要组成部分。样品标签应作为 COC 流程的一部分使用，因为它们可以在样品运送到实验室后取下并放入该样品的证据文件中，而标签通常会随样品一起丢弃。标签随后可在执法程序中作为证据使用。样品识别程序应纳入设施/POTW\
  \ 的采样和质量保证计划。\n\n应使用样品封条或冷藏箱封条（即放置在装有类似样品的冷藏箱周围的封条）来保护样品从采集到在实验室打开期间的完整性。封条应包含采集员姓名、样品采集日期和时间以及样品识别号码。封条上的信息必须与标签和标签上的信息相同。此外，封条必须附着在必须破坏才能打开样品容器或冷藏箱的位置。应注意确保样品封条和标签线的胶水不会污染样品，特别是含有挥发性有机物和金属的样品。\n\
  \n## 4.5.13 样品包装和运输\n\n在样品正确贴标签后，应将其连同 COC 表格、相关现场记录和分析请求表一起放入运输箱中。玻璃瓶应用泡沫橡胶、塑料气泡膜或其他材料包裹，以防止运输过程中破裂。包装可以用胶带固定在瓶子周围。样品应放置在冰或合成冰替代品中，以确保整个运输过程中样品温度保持在\
  \ 6°C 或以下。冰应放置在双层包裹的防水袋中，以确保水不会从运输箱中滴出。金属或重型塑料箱是良好的样品运输箱。冰箱两端缠绕的丝带可确保其在运输过程中不会打开。取样记录应放置在防水袋、信封或气密样品瓶中，并贴在运输容器内盖或其他适当位置的内部，以防止篡改或保管中断。运输容器还应密封以防止篡改。样品包装和运输注意事项应包含在\
  \ POTW 的采样和质量保证计划中（见第 4.5.13 节）。\n\n大多数样品不需要任何特殊运输预防措施，除谨慎包装以防止破损和/或泄漏外。如果样品通过普通承运人运输或通过美国邮寄，则必须遵守美国交通部《危险废物材料法规》（49\
  \ CFR 第 171–177 部分）（CFR，第 40 篇，第 51 部分，1977 年）（CWA 1972）。危险废物材料的空运也可能受国际航空运输协会（IATA）要求的约束。在运输样品之前，检查员应了解并遵循任何特殊运输要求。对\
  \ IATA 规则定义的危险物质适用特殊的包装和运输规则。典型的废水样品通常不被视为危险材料。\n\n\n\n\n\n## 4.6 全废水毒性测试\n\n###\
  \ 4.6.1 引言\n\n对于部分选定的工业废水处理厂（WWTP），其 NPDES 许可证要求进行全废水生物测试。全废水毒性（WET），也称为生物监测，是指直接通过毒性测试测定废水样品的毒性，以评估所有污染物的总毒性效应。WET\
  \ 测试之所以必要，是因为美国环境保护署（EPA）不可能为废水排放中可能存在的每一种有毒污染物制定水质标准。试图测量每一种可能的化学物质将耗费巨大。WET 测试也是评估排放物中所有污染物毒性相互作用的唯一方法。该方法之所以称为“全废水毒性”，是为了区别于逐一测量废水中多种有毒化学物质的浓度，并与相应的水质标准（如果有的话）进行逐项比较的做法。由于\
  \ WET 测试常常能发现未知毒物产生的影响，因此在这些相关毒物被识别之前，无法降低毒性效应。\n\n### 4.6.2 WET 测试\n\n生物测定方法是将选定的水生生物（取决于淡水或盐水生物）置于受控的生物测定实验室环境中，暴露于工艺废水。在静态短期测试中，将废水和未受污染的水（对照组）分别放入容器中，向两个容器中均加入测试生物，然后在受控的实验室环境中监测毒性效应。目的是估算安全水平或无可见不良影响水平，该水平应能保证受纳水体中水生生物的正常繁殖。测试容器为硼硅酸盐玻璃或一次性聚苯乙烯材质，容量为\
  \ 250 至 1000 毫升，具体取决于测试生物的大小。测试期间，溶解氧浓度应接近饱和，温度保持在 25 °C，并定期检查 pH 值。废水为 24 小时混合样，通过筛网过滤以去除悬浮固体（SS）。在废水制备过程中，应限制曝气，以防挥发性有机化合物损失。常见的淡水测试生物包括彩虹鳟（*Oncorhynchus\
  \ mykiss*）、黑头呆鱼（*Pimephales promelas*）、蚤状溞（*Ceriodaphnia dubia*）、蚤状溞虾和绿藻（*Selenastrum\
  \ capricornutum*）。常见的海洋盐水物种包括红藻 *Champia parvula*、糠虾 *Mysidopsis bahia*、内陆银汉鱼 *Menidia\
  \ beryllina* 以及羊头鲦鱼 *Cyprinodon variegatus*。美国有些州已开发出针对本地物种的培养和测试方法。\n\n测试结果以 24\
  \ 小时暴露后的死亡率表示。存活率降低 25% 被定义为具有生物学意义的阈值，表明受纳水体可能受损。受纳水体的受损程度和废水毒性与实际水体中废水的稀释程度相关。因此，更为确定的毒性测试是设置一系列稀释度递减的实验室容器，例如\
  \ 100%、50%、25%、12.5% 和 6.25%（几何级数）。该范围可能涵盖与 10 年重现期 7 日平均低流量（记为 7Q10）相对应的废水流量。河流或溪流中的\
  \ 7Q10 流量是制定地表水标准所设定的最大允许污染物浓度的基础。稀释水取自排放口上方受纳溪流边缘，或混合区边缘（见第 4.8.1 节）。\n\n生物测定测试可采用\
  \ 24 小时急性毒性测试，或持续监测最长 7 天的慢性毒性测试。根据测试结果，确定稀释测试样品中废水的无可见效应浓度（NOEC）。该值应与废水浓度进行比较，废水浓度应低于\
  \ NOEC，并留有一定的安全边际（MOS）。\n\n工业废水的预处理对于控制有毒物质至关重要。由于许多有害物质是杀生物剂，降低其在原废水中的浓度对于有效的生物处理至关重要。如果毒性证据不那么明显，它们在原废水和处理厂出水中的存在可能会被忽视。典型的有毒污染物清单包括\
  \ 13 种优先控制污染物金属、氰化物、15 种多环芳烃、13 种芳香族化合物、10 种酚类、21 种脂肪族化合物、6 种邻苯二甲酸酯、2 种含氮化合物、2 种含氧化合物以及农药。\n\
  \n### 4.6.3 毒性测试及毒性测试结果评价\n\n生态毒性测试根据持续时间（短期、中期和/或长期）、测试溶液的添加方式（静态、再循环、换水或流水式）以及（为满足拟议污染物排放消除系统的许可证要求、确定混合区等）进行分类。详细的当代测试协议已在监管文献中总结（USEPA\
  \ 1985b, c, 1988, 1989）。\n\n许多术语用于表达毒性测试结果。急性毒性是指毒性严重到足以快速产生反应（通常是在 48 或 96 小时内观察到的反应）。“急性”并不一定意味着死亡。在海洋生物研究中，LC50\
  \ 是指导致测试种群 50% 死亡的稀释水中废水浓度；EC50 是指对测试种群 50% 产生可测量负面效应的废水浓度。NOAEL（无可见急性效应水平）定义为导致死亡率不超过\
  \ 10% 的最高测试废水浓度。\n\n慢性毒性是指持续或延续相对较长时间（通常为目标生物寿命的 1/10 或更长）的毒性影响。慢性效应可能包括死亡、生长减缓或繁殖能力下降。NOEC\
  \ 是根据慢性测试结果，未观察到任何效应的最高实测连续废水或毒物浓度。LOEC（最低可见效应浓度）定义为产生任何效应的最低观察浓度。LOEC 通过方差分析技术确定。\n\
  \n毒性数据采用 Stephan（1977）制定的程序进行分析。LC50 值通过 Spearman–Kärber 法、移动平均法、二项式法和概率单位法进行分析确定。如图\
  \ 4.1 所示，也可使用图形法获得估计的 LC50 值。通常，LC50 值基于 48 小时和 96 小时暴露的存活率计算。方差分析和 Duncan 多重比较通常用于比较慢性测试结果。示例\
  \ 4.2 展示了急性毒性测试结果的简单比较。\n\n#### 示例 4.2 毒性数据分析\n\n使用以下假设数据，以体积百分比确定 48 小时和 96 小时的\
  \ LC50 值。\n\n| 废水浓度（体积百分比） | 测试动物数量 | 测试动物死亡数量ᵃ |  |\n|---|---|---|---|\n|  |  |\
  \ 48 小时 | 96 小时 |\n| 40 | 20 | 17 (85) | 20 (100) |\n| 20 | 20 | 12 (60) | 20 (100)\
  \ |\n| 10 | 20 | 6 (30) | 14 (70) |\n| 5 | 20 | 0 (0) | 7 (35) |\n| 3 | 20 | 0 (0)\
  \ | 4 (20) |\nᵃ括号内为百分比值。\n\n#### 解答\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_151_0.png)\n\
  \n- 1) 将废水浓度（体积百分比，对数刻度）对测试动物存活率（百分比，概率刻度）作图，如图所示。\n- 2) 用目测法拟合数据点，重点考虑死亡率在 16%\
  \ 至 84% 之间的点。\n- 3) 找出导致 50% 死亡率的废水浓度。\n\n估计的 LC50 值分别为：48 小时为 16.5 体积百分比，96 小时为\
  \ 6.5 体积百分比。\n\n评注：通过图形法获得的 LC50 估计值通常与正式概率单位分析（Stephan 1977）获得的值相当接近。需要注意的是，图形分析无法获得置信限（APHA\
  \ 1989）。\n\n### 4.6.4 毒性单位\n\n毒性单位（TU）方法已被广泛接受，用于利用毒性测试结果。联邦和州的标准和/或准则已经或正在基于毒性单位制定。在毒性单位方法中（USEPA\
  \ 1985b, c），为保护水生生物确定了 TU 浓度。\n\n急性毒性单位（TUa）是在急性暴露期结束时引起急性效应的废水稀释度的倒数。\n\n```\n\
  TUₐ = 100 / LC₅₀  (4.1)\n```\n\n\n\n\n\n毒性单位慢性（TUc）是导致慢性暴露期结束时对试验生物无不可接受影响的废水稀释倍数的倒数：\n\
  \n```\nTUc = 100 / NOEC  (4.2)\n```\n\n其中，与前文相同，NOEC 为无观察到效应浓度。\n\n过去，急性与慢性比值（ACR）由方程\
  \ ACR = LC50/NOEC 确定。慢性数据是通过从急性数据外推确定的。急性与慢性比值在不同物种和不同有毒物质之间变化极大。采用全废水方法可防止实施过于严格或过于宽松的要求。\n\
  \n## 4.6.5 毒性试验结果的应用\n\n水质标准通过包含毒性物质允许的量级（数量）、持续时间（河流水体中浓度平均的时间段）以及频率（在不产生不可接受的受纳水体生态群落影响的情况下标准可被超出的次数）来确保指定用途的保护。现代水质标准旨在通过使用标准最大浓度（CMC）防止短期（急性）效应，并通过使用标准持续浓度（CCC）防止长期（慢性）效应。这些标准通常在混合后适用。典型水质标准包含浓度限值、平均期和重现频率。CMC\
  \ 通常为四日平均浓度，平均而言不得超过每三年一次，CCC 通常为一小时平均浓度，平均而言不得超过每三年一次。\n\n## 4.6.6 对急性毒性的保护\n\n\
  为防止急性毒性，CMC 必须不超过 0.3 TUa，按所进行试验中最敏感结果测定。\n\n```\nCMC = TUa / CID ≤ 0.3 TUa  (4.3)\n\
  ```\n\n其中 CID 为临界初始稀释度。在海洋排放中，CID 定义为在排放附近区域在“最不利”环境条件下实现的稀释度，其中废水羽流的混合和稀释由排放的初始动量和浮力决定。在河流排放中，通常将混合区边界处实现的稀释度作为\
  \ CID。根据大量 96 小时废水毒性试验的结果发现，0.3 的系数可解释 91% 的观察到的 LC50 与 LC1 比值（LC1 等于稀释水中导致试验种群\
  \ 1% 死亡的废水浓度）。因此，为急性保护，CMC 不应超过基于所试验最敏感物种的 0.3 TUa。急性标准因此等于近似 LC1 的 CMC。\n\n## 4.6.7\
  \ 对慢性毒性的保护\n\n为防止在初始混合区或排放影响区之外发生慢性效应，CCC 必须不超过 1.0 TUc，基于至少三种物种试验中最敏感者获得的结果。\n\n\
  ```\nCCC = TUc / CID ≤ 1.0 Tuc  (4.4)\n```\n\n符合性基于将毒性标准（TUa 和 TUc 均以毒性单位表示）在临界初始稀释后的废水中进行比较，以确定是否满足\
  \ EPA 推荐的标准。这些标准的应用在示例 4.3 中说明。\n\n## 示例 4.3 毒性试验结果的应用\n\n向海洋受纳水体排放的经处理废水实现了 225:1\
  \ 的临界初始稀释度。使用三种海洋物种对 WWTP 废水进行了毒性试验。以下急性与慢性毒性试验结果表明，根据 LC50，C. parvula 表现出最敏感物种急性终点（2.59%\
  \ 废水），并且根据 NOEC，也表现出最敏感物种慢性终点（1.0%）。使用给定的毒性数据，确定 CMC 和 CCC 标准的符合性。\n\n| Results\
  \ of acute toxicity tests |\n| Species | Exposure (hours) | Control survival (%)\
  \ | Percent effluent |  |\n|  |  |  | LC50 | NOAEL |\n| Mysidopsis bahia | 96 |\
  \ 100 | 18.66 | 10.0 |\n| Cyprinodon variegates | 96 | 100 | >100 | 50.0 |\n| Champia\
  \ parvula | 48/168 | 100 | 2.59 | 12.25 |\n\n**Results of chronic toxicity tests**\n\
  \n| Species | Exposure (days) | Control survival (%) | Percent effluent: NOEC |\
  \ Percent effluent: LOEC |\n|---|---:|---:|---:|---:|\n| *Mysidopsis bahia* | 7\
  \ | 82 | 6.0 | 10.0 |\n| *Cyprinodon variegates* | 7 | 98.8 | 15.0 | >15.0 |\n|\
  \ *Champia parvula* | 7 | 100 | 1.0 | 2.25 |\n\n## Solution\n\n- 1. Check compliance\
  \ with the CMC criterion.\n  - a) Based on data for the most sensitive species tested,\
  \ we use Eq. (4.1) to find the number of acute toxic units:\n  \n  \\(\\mathrm{TU_a}\
  \ = \\frac{100}{\\mathrm{LC}_{50}} = \\frac{100}{2.59} = 38.6\\) units\n  \n  -\
  \ b) For acute protection, the criterion maximum concentration must not exceed 0.3\
  \ TUₐ, as shown in Eq. (4.3). Following an initial dilution of 225, the CMC is:\n\
  \  \n  \\(\\mathrm{CMC} = \\frac{\\mathrm{TU_a}}{\\mathrm{CID}} \\leq 0.3\\mathrm{TU_a}\\\
  )\n  \n  \\(\\frac{38.6}{225} \\leq 0.3(38.6)\\)\n  \n  \\(0.17 \\leq 11.58\\)\n\
  \  \n  - c) The CMC (0.17) is considerably less than the value of 0.3 TUₐ (11.58)\
  \ required for compliance with the CMC criterion.\n  \n- 2. Check compliance with\
  \ the CCC criterion.\n  - a) Based on data for the most sensitive species tested,\
  \ we use Eq. (4.2) to find the number of chronic toxic units:\n  \n  \\(\\mathrm{TU_c}\
  \ = \\frac{100}{\\mathrm{NOEC}} = \\frac{100}{1.0} = 100\\) units\n  \n  - b) For\
  \ chronic protection, the criterion continuous concentration must not exceed 1.0\
  \ toxic unit as shown in Eq. (4.4). Following an initial dilution of 225, the CCC\
  \ is:\n  \n  \\(\\mathrm{CCC} = \\frac{\\mathrm{TU_c}}{\\mathrm{CID}} \\leq 1.0\\\
  mathrm{TU_c}\\)\n  \n  \\(\\frac{100}{225} \\leq 1.0(100)\\)\n  \n  \\(0.44 \\leq\
  \ 100\\)\n\nThe CCC (0.44) is considerably less than the value of 1.0TU₍c₎ (100)\
  \ required for compliance with the CCC criterion.\n\n采用全废水毒性测试具有诸多优势。在此方法中，有毒物质的生物可利用性得以测定，任何协同相互作用的影响也被考虑在内。由于确定了废水排放物所有组分的总体毒性，因此可以通过限制单一参数——废水毒性来限制毒性效应。由于当代受纳水体管理策略基于特定场地的水质标准，毒性测试便于将废水毒性与旨在保护代表性敏感物种并允许建立保护水生环境的排放限值的特定场地水质标准进行比较。\n\
  \n## 4.7 流量测量\n\n工业用户许可中的污染物限值通常以向工业设施或 POTW 的质量负荷表示（例如，常规污染物、有机物、金属、微生物等的分类标准）。为确定质量负荷，需要获取并记录准确的流量数据。本节简要描述用于测量流量的设备类型和程序。在无法使用以下各节所述的流量测量设备的情况下，设施可能需要依赖设施用水消耗记录。然而，当需要确定质量负荷以评估符合性时，设施应能够在采样期间直接评估设施的流量。\n\
  \n### 4.7.1 开渠流\n\n开渠流是指在未充满液体的管道中发生的流动，是预处理计划监管的工业用户排放点最常见的流动类型。未充满且无压力的半满管道也归类为开渠。开渠流使用初级和次级设备进行测量（如下面所述）。\n\
  \n#### 4.7.1.1 Primary Devices\n\n初级设备是校准过的液压结构，安装在渠道中，以便通过在特定点相对于初级设备的液位深度测量来获得流量测量。堰和量槽是初级设备的例子。\n\
  \n\n\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_154_0.png)\n\n# 图 4.2 尖堰的水力和术语\n\
  \n最常见的堰类型是由一块带有锐利堰顶的薄竖直板组成，它被放置在溪流、渠道或部分充满水的管道中。图 4.2 展示了一个尖堰的轮廓，并标出了相应的术语。图 4.3\
  \ 展示了四种常见类型的堰（矩形、梯形、尖堰和 V 形缺口或三角形堰）。堰顶是堰的上边缘，水必须上升到此处才能越过该结构。从堰顶到水面的垂直距离被称为“堰上水头”。为了确定流量，检查员必须测量水力水头。堰上的流速与堰顶上方的水高（水力水头）直接相关。为了测量水力水头，测量装置放置在堰的上游，距离至少为水头的四倍。为了近似水头，检查员可以在堰板上进行测量。然而，这个数值只能提供流量的粗略估计。\n\
  \n假设上游流速可忽略不计，基本未校正的堰公式为\n\n```\nQ = C_w (2/3) b sqrt(g) H^(3/2)   (4.5)\n```\n\n\
  其中 $C_w$ 是堰系数，$b$ 是宽度，$H$ 是堰高。\n\n# 例题 4.4 水流以 3 加仑/秒的流量流过宽顶堰，当堰上水头为 0.5 英尺时。确定当水头增加到\
  \ 0.8 英尺时的预期流量。假设两种情况下堰系数保持不变。\n\n# 解答\n\n根据公式 (4.5)，$Q = 3 \\text{ ft}^3/\\text{s}$，$H\
  \ = 0.5 \\text{ ft}$\n\n```\n3 ft³/s = C_w b (32.2 ft/s²)^(1/2) (2/3) (0.5)^(3/2)\n\
  ```\n\n因此，$C_w b = 2.24 \\text{ ft}$；于是，当 $H = 0.8 \\text{ ft}$ 时，\n\n```\nQ = 2.24\
  \ ft (32.2)^(1/2) (2/3) (0.8 ft)^(3/2) = 6.07 ft³/s (答案)\n```\n\n巴歇尔槽（flume）是一个人工渠道，构建后使废水流经其中。废流的流速与巴歇尔槽中水的深度成正比，并通过测量水头来计算。巴歇尔槽由三部分组成：(i)\
  \ 收缩的上游段；(ii) 喉部或收缩段；以及 (iii) 扩散或下降的下游段。巴歇尔槽的两种主要类型是 Parshall 槽和 Palmer-Bowlus 槽。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_155_0.png)\n\n矩形堰（无末端收缩）\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_155_1.png)\n\
  \n梯形（Cipolletti）尖堰\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_155_2.png)\n\n矩形堰（有末端收缩）\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_155_3.png)\n\nV 形缺口（三角形）尖堰\n\n# 图 4.3\
  \ 四种常见类型的尖堰\n\n图 4.4 展示了 Parshall 槽的草图，并识别了其不同部分。在 Parshall 槽中，收缩段的底部水平高于喉部和扩散段的底部。巴歇尔槽的工作原理是：当水流通过渠道中的收缩部分时，会产生一个与流量成正比的水力水头。巴歇尔槽适用于测量明渠废流，因为它们具有自清洁能力。沙子和悬浮固体（SS）不太可能影响装置的操作（Benefield\
  \ and Judkins 1984）。\n\n在自由流动（未淹没）条件下，Parshall 槽是一个临界深度流量计，它在稳定高度 $h$ 和流量 $Q$ 之间建立数学关系。对于巴歇尔槽喉部宽度\
  \ ($w$) 至少为 1 英尺 (0.305 m) 但小于 8 英尺 (2.44 m) 的情况，流量可以使用以下方程计算：\n\n$Q = 4 W H^{1.522}\
  \ W^{0.026}$\n(4.6)\n\n其中\n$Q$ = 流量 (加仑/秒)\n$W$ = 喉部宽度 (英尺)\n$H$ = 上游水头 (英尺)\n\n\
  # 例题 4.5 Parshall 槽喉部宽度为 2.0 英尺，在最大自由流动水头 2.5 英尺时，计算出的污水流量是多少？\n\n解答\n使用公式 (4.6)，\n\
  \n$Q = 4 \\times 2 \\times 2.5^{1.522}(2)^{0.026}$\n$Q = 4 \\times 2.0 \\times 2.5^{1.5496}$\n\
  $= 33.093 \\text{ cfs} = 21.39 \\text{ MGD}$ (答案)\n\n# 图 4.4 Parshall 槽的平面图和横截面\n\
  \n# 图 4.5 自由流动 Palmer-Bowlus 槽\n\nPalmer-Bowlus 槽，可能有不收缩的喉部，其喉部段底部是水平的，并放置在管道中，长度约为管道直径。喉部中台阶上方的水深与流量速率有关。水头应在喉部上游距离\
  \ $(d/2)$ 处测量，其中 $(d)$ 是槽的宽度。台阶的高度通常未知，直到查阅制造商的数据，并且在人工测量时很难确定上游点台阶上方的水高。每个 Palmer-Bowlus\
  \ 槽的尺寸都不同。因此，必须查阅制造商的数据以建立水头与流量速率之间的关系。图 4.5 包含一个自由流动 Palmer-Bowlus 槽的草图。\n\n图 4.6\
  \ (a) 文丘里流量计的构造和术语。(b) 皮托管。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_157_0.png)\n\
  \n# 4.7.1.2 二次设备\n\n二次设备与一次设备配合使用，以确定通过测量点的实际流量。通常，二次设备测量一次设备中水的深度，并使用既定的数学公式将深度测量转换为相应的流量。二次设备的输出通常传输给记录仪和/或总计器，为操作员提供瞬时和历史流量数据。输出也可传输给采样系统以方便按比例采样。二次设备可以分为两大类：\n\
  \n+   1) 非记录型，带有直接读数（例如水位尺）或从固定点间接读数（例如链条、线重或浮子）\n+   2) 记录型，带有数字或图形记录仪（例如井中浮子、流中浮子、气泡式、电学或声学）。\n\
  \n插入导管中。明渠流量测量设备的例子包括文丘里流量计和电磁流量计。\n\n文丘里流量计是测量明渠流量最精确的一次设备之一。它基本上是一段管道，由带有收缩段的入口、喉部和扩散出口段组成，如图\
  \ 4.6a 所示。在水流经过入口收缩部分时，流速增加，导致静压降低。入口管与喉部之间的压差与流量成正比。\n\n文丘里流量计中的流量可以使用以下方程计算：\n\
  \n```\nQ = Ca$_2$ [2g (P$_1$ - P$_2$)/ρ]$^{1/2}$    (4.7)\n```\n\n# 4.7.2 明渠流量\n\
  \n明渠流量通常出现在污水处理厂的处理单元之间以及提升站之后，液体和/或污泥在此处加压泵送。它也在淹没式出水口遇到。明渠中的流量通常通过插入导管中的计量装置来测量。\n\
  \n+   其中\n+   $Q$ = 流量 (加仑/秒)\n+   $C$ = 流量系数，通常在 0.90–0.98 范围内\n+   $A_2$ = 喉部截面积\
  \ (平方英尺)\n+   $g$ = 重力加速度 (英尺/秒²)\n+   $P_1 – P_2$ = 差压 (磅/平方英尺)\n+   $ρ$ = 水的比重\
  \ (磅/立方英尺)\n\n例题 4.6 当测得的压差为 160 英寸水柱时，喉部直径为 0.063 英寸的文丘里流量计的计算水流是多少？假设 $C = 0.95$\
  \ 且水温为 50°F。\n\n# **解答**\n\n代入公式 (4.7)，我们得到\n\n$$Q = 0.95 \\times \\frac{\\pi}{4}\
  \ \\left(\\frac{5.063 \\text{ in.}}{\\frac{12 \\text{ in.}}{\\text{ft}}}\\right)^2\
  \ \\left(2 \\times \\frac{32.2 \\text{ ft}}{\\text{s}^2} \\times \\frac{160 \\text{\
  \ in.}}{\\left(\\frac{62.4 \\text{ lb}}{\\text{ft}^3}\\right) \\frac{12.0 \\text{\
  \ in.}}{\\text{ft}}}\\right)^{0.5}$$\n\n$$= 0.492 \\text{ cfs} = 221 \\text{ gpm}$$\n\
  \n# **4.7.3 皮托管**\n\n皮托管或皮托探针（也称为冲击管或驻点管）只是一个中空的管子，沿流体流动方向纵向放置，允许流体以接近流速进入管的一端（图\
  \ 4.6b）。它是一种压力测量仪器，用于测量流体流速，并应用于亚音速和超音速场合。皮托管广泛用于确定飞机的空速、船的航速，以及在某些工业应用中测量烟囱中液体、空气和气体的流速。皮托管用于测量流动流中给定点的局部流速，而不是管道或导管中的平均流速。\n\
  \n伯努利方程可用于预测驻点的静压。由于皮托管内流体的速度为零，如果已知静压和驻点压力，则可以计算上游速度。\n\n$$\\frac{P_1}{\\rho} +\
  \ \\frac{v_1^2}{2} = \\frac{P_2}{\\rho} \\quad (4.8)$$\n\n$$V_1 = \\sqrt{\\frac{2(P_2\
  \ - P_1)}{\\rho}} \\quad (SI) \\quad (4.9)$$\n\n$$V_1 = \\sqrt{\\frac{2g_c(P_1 -\
  \ P_s)}{\\rho}} \\quad (US) \\quad (4.10)$$\n\n实际上，摩擦和加热都会发生，并且流体可能是可压缩的。这些误差通过一个名为冲击系数\
  \ $C_i$ 的校正因子进行修正，该因子应用于推导出的速度。$C_i$ 通常非常接近 1.00（例如 0.99 或 0.995）。\n\n$$V_{actual}\
  \ = C_i V_{indicated}$$\n\n**例题 4.7** 在管道中流动的空气（0.075 lbm/ft³; 1.2 kg/m³）的静压由下所示的精密仪表测得为\
  \ 10.00 psig (68.95 kPa)。皮托管液位计指示 20.6 英寸 (0.52 m) 的水银。损失可忽略不计。管道中空气的速度是多少？\n\n\
  # **SI 单位制解答**\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_158_0.png)\n\n水银的密度为\
  \ 13 600 kg/m³。冲击压力为\n\n$$P_i = \\rho g h = \\left(13600 \\frac{\\text{kg}}{\\text{m}^3}\\\
  right) \\left(9.81 \\frac{\\text{m}}{\\text{s}^2}\\right) \\left(\\frac{0.52 \\\
  text{ m}}{\\frac{1000 \\text{ Pa}}{\\text{kPa}}}\\right) = 69.38 \\text{kPa}$$\n\
  \n根据公式 (4.9)，速度为\n\n$$V = \\sqrt{\\frac{2(P_i - P_s)}{\\rho_{air}}} = \\sqrt{\\\
  frac{2(69.38 - 68.95 \\text{kPa})}{1.2 \\text{ kg/m}^3} \\left(\\frac{1000 \\text{\
  \ Pa}}{\\text{kPa}}\\right)}; \\text{ 其中 } \\rho_{air} = 1.2 \\text{ kg/m}^3$$\n\
  \n$$= 26.8 \\text{m/s}$$\n\n(传统美国单位制解答)\n\n皮托管测量冲击（驻点）压力。对于水银，每英寸的压力当量为 0.491 psig/in。因此，$p_i\
  \ = (20.6 \\text{ in.}) \\left(\\frac{0.491 \\text{ psi}}{\\text{in.}}\\right) =\
  \ 10.11 \\text{ psig}$。\n\n由于冲击压力是静压和动能（速度）压力之和，动能压力为 $p_v = p_i - p_s = 10.11 -\
  \ 10.00 = 0.11 \\text{ psig}$，使用公式 (4.10)，我们得到，\n\n\n\n$$\nV=\\sqrt{\\frac{2 g_{e}\
  \ \\left(p_{i}-p_{s}\\right)}{\\rho_{\\text {air }}}}\n$$\n\n$$\nV=\\left[2\\left(\\\
  frac{32.2 \\frac{\\mathrm{ft}}{\\mathrm{s}^{2}}}{}\\right)\\left(\\frac{0.11 \\\
  frac{\\mathrm{lb}}{\\mathrm{s}^{2}}}{0.075 \\frac{\\mathrm{lb}}{\\mathrm{ft}^{3}}}\\\
  right)\\left(\\frac{144 \\frac{\\mathrm{in}^{2}}{\\mathrm{ft}^{2}}}{1}\\right)\\\
  right]^{1 / 2}\n$$\n\n其中空气密度 = 0.075 lb/ft³\n\n因此，V=116.6 ft/s = 117 ft/s（答案）。\n\
  \n## 4.7.4 电磁流量计\n\n电磁流量计的工作原理基于这样一个事实：当导体垂直于磁场运动时所产生的感应电压与导体穿过该场时的速度成正比。在电磁流量计的情况下，导体是待测量的水流，而磁场则由一组电磁线圈产生。典型的电磁流量计如图4.7所示。\n\
  \n## 4.8 符合水质标准的位置\n\n## 4.8.1 混合区\n\n本节讨论工业污水处理厂废水排入河流和河口的情况。水质标准允许对否则会超过水生生物水质标准的排放使用混合区。混合区是水质标准可能被超过的区域，但超标程度和时间足够小，不会干扰有益用途。混合区是对大多数污染物浓度及其影响在排放后由于稀释而迅速减弱这一现象的监管认可（Adams\
  \ 1982）。它们以限制生物通过排放羽流时的暴露持续时间的方式建立，以尽量减少每次排放的风险。慢性保护的水质标准必须在该区的边界及以外得到满足。也可以授权一个更小的区域，在该区域内急性标准可能被超过。该区域必须足够小，以限制暴露时间，从而不引起急性死亡或干扰水生生物在水体中的通过。混合区对于溶解氧分析并不重要，因为BOD耗氧相对于混合区内的旅行时间来说很慢。相对于其他限制，例如有毒化学物质，混合区的特性很重要。显然，使废水与环境水流迅速混合以降低毒性是可取的。\n\
  \n混合区的大小不仅取决于废水特性，还取决于河流流量。通常，较低的河流流量会实现较低的废水稀释度，从而产生更大的混合区。因此，需要对流量记录进行分析，以确定低流量期的大小、持续时间和频率。美国现行的法规通常规定用于混合区分析的低流量的持续时间和频率，例如7Q10。\n\
  \n对于较浅的河流深度，在排放点附近很短的距离内即可达到垂直混合状态。混合区分析可以通过将排放模拟为延伸整个河流深度的平面源来进行。对于管道排放，源的宽度可假定等于河流深度。有限的河宽限制了羽流的横向扩散。有限的河宽可通过相对于河岸引入镜像源来考虑，如图4.8所示。\n\
  \n海洋和大型湖泊，如五大湖，提供了广泛的同化能力，并被许多工业和社区用于废水处置。废水通常通过铺设在海底或埋设的管道，或通过隧道输送到近海排放点。海洋或深湖中的排放可以通过单口或多口排放结构进行。海洋中废水羽流的构型如图4.9所示。在第一个区域，称为“初始混合区”或“排放近场”，废水形成浮力羽流，在水柱中迅速上升。该羽流夹带大量环境水，从而稀释废水（Muellenhoff\
  \ et al. 1985）。\n\n与《清洁水法》零排放目标一致的点源污染控制的一个中间目标是\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_159_0.png)\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_160_0.png)\n\n图4.8 浅溪中采用镜像法进行混合区分析。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_160_1.png)\n\n图4.9 深水受纳水体中的废水排放羽流。\n\n\
  消除对混合区的需要。水质标准并不禁止许可编写者在岸边排放时授予混合区，但岸边区域是重要的生物区域。许可编写者应确保在岸线上授予混合区不会导致法规中规定的生物效应。在某些情况下，这可能需要许可持有者进行证明。\n\
  \n## 4.8.2 Streeter–Phelps方程和河流中的DO Sag曲线\n\nStreeter–Phelps方程确定了溶解氧浓度与生物需氧量随时间变化的关系（Streeter\
  \ and Phelps 1925）。河流中DO的浓度是河流总体健康状况的指标。所有河流都具有一定的自净能力。只要需氧废水的排放量在自净能力范围内，DO水平就会保持较高，并能发现多样化的植物和动物群落，包括游钓鱼类。随着废物量的增加，自净能力可能被超过，导致植物和动物生命产生有害变化。河流失去自我清洁的能力，DO水平下降。当DO降至约4–5\
  \ mg/l以下时，大多数游钓鱼类将被驱逐。如果DO进一步降至或低于2 mg/l（临界点）（图4.10），鱼类和其他动物将被杀死或驱逐，并产生极其恶劣的条件。水在厌氧条件下（即无氧）分解有机废物和死动物生命时变得恶臭。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_161_0.png)\n\n图4.10 由Streeter–Phelps方程推导出的DO\
  \ Sag曲线。\n\n河流水质管理的主要工具之一是增加河流吸收废物负荷的能力（也在第4.8.1节中讨论，河流TMDL和WLA）。这是通过确定废水排放下游DO浓度的剖面来实现的。该剖面称为DO\
  \ Sag曲线（图4.10），因为随着需氧物质被氧化，DO浓度下降，然后在下游随着来自大气和光合作用过程的氧气补充而再次上升。\n\n## 4.8.3 河流中废水的混合：质量平衡法\n\
  \n当两条溪流或河流汇合或废水排入溪流时，假设稳态条件和瞬时混合，可以确定混合后的BOD和DO（Jolánkai 1997）。两条溪流被视为彼此的稀释；因此，初始BOD和DO将为\n\
  \n```\nL_a = (L_w Q_w + L_r Q_r) / (Q_w + Q_r)   (4.11)\n```\n\n和\n\n```\nDO = (DO_w\
  \ Q_w + DO_r Q_r) / (Q_w + Q_r)   (4.12)\n```\n\n其中\n\n- L_a 是混合后终极BOD的初始浓度，g/m³（mg/l）\n\
  - L_w 是废水的终极BOD g/m³（mg/l）\n- L_r 是河流的终极BOD，g/m³（mg/l）\n- DO_w 是废水中的溶解氧含量 g/m³（mg/l）\n\
  - DO_r 是河流中的溶解氧含量 g/m³\n- Q_w 是废水流量 m³/s\n- Q_r 是河流流量 m³/s\n\n例4.8 华盛顿州泽拉镇的一家食品加工厂向附近的萨蒙溪排放17\
  \ 300 m³/天的处理废水。处理废水的BOD₅为12 mg/l，萨蒙溪的流量为0.43 m³/s。废水的DO为1.0 mg/l，萨蒙溪中的DO为6.5 mg/l。计算完全混合后的DO。\n\
  \n\n\n\n\n# 解决方案\n\n混合后的溶解氧由公式 (4.12) 给出。要使用该公式，我们必须将废水流量转换为兼容的单位，即每秒立方米。\n\n$$Q_w=\\\
  frac{17300\\ \\mathrm{m^3/day}}{86400\\ \\mathrm{s/day}}=0.20\\ \\mathrm{m^3/s}$$\n\
  \n溶解氧 = $$\\left[\\frac{(0.20\\ \\mathrm{m^3/s})(1.0\\ \\mathrm{mg/L})+(0.43\\ \\\
  mathrm{m^3/s})(6.5\\ \\mathrm{mg/L})}{0.20\\ \\mathrm{m^3/s}+0.43\\ \\mathrm{m^3/s}}\\\
  right] =4.75\\ \\mathrm{mg/L}\\ \\text{or}\\ 4.75\\ \\mathrm{ppm}$$\n\n## 4.9 水质建模\n\
  \n水质建模涉及使用数学模拟技术预测水污染。一个典型水质模型由代表决定水体中污染物位置和动量的物理机制的公式集合组成。模型可用于水文系统的各个组成部分，如地表径流；也存在针对水文输运的流域范围模型，以及海洋和河口应用。分析这些现象时经常使用有限差分方法，并且几乎总是需要大型复杂的计算机模型（USEPA\
  \ 1985d；CORMIX 1996；第 D.2 节）。\n\n### 4.9.1 公式及相关常数\n\n水质由以下一个或多个公式建模：\n\n- 平流归趋与输运公式\n\
  - 弥散归趋与输运公式\n- Streeter–Phelps 公式\n- 表面热预算公式\n- 溶解氧饱和公式\n- 复氧公式\n- 碳质需氧公式\n- 氮质生化需氧量公式\n\
  - 沉积物需氧量公式\n- 光合作用与呼吸作用公式\n- pH 与碱度公式\n- 营养物公式（肥料）\n- 藻类公式\n- 浮游动物公式\n- 大肠杆菌群公式（例如\
  \ *Escherichia coli*）\n\n### 4.9.2 WWTP BOD、SS 和粪大肠菌群去除效率：满足水质标准\n\n初级、次级以及有时三级处理的首要目标是去除常规污染物，包括有机物和病原体（例如\
  \ BOD、COD、SS、粪大肠菌群），以满足水质标准和 NPDES 许可要求（CWA 1972；Davis and Masten 2014；USEPA 1995b,\
  \ 2010a）。初级处理通常可去除原废水中 60% 的 SS 和 35% 的 BOD₅。次级处理的主要目标是去除逃脱初级处理的溶解性 BOD₅ 并提供额外的\
  \ SS 去除。次级处理通过图 4.11 所示的生物过程实现，该图是造纸厂工艺 WWTP 的示意图（Das 1991, 1993）。WWTP 包括来自漂白厂两侧并接受初级澄清的出水。一个与初级沉淀池相连的调节池并不常用。然而，在发生泄漏（例如黑液）时，溢流可保留在调节池中约六小时，基于工厂的总废水流量。\n\
  \n初级澄清后，营养物（氨和磷酸）被添加到初级出水中。高纯度氧气活性污泥次级处理，在商品名为 UNOX® 下进行，随后进行次级澄清。来自五个次级沉淀池的溢流被收集在集水井中，出水通过长\
  \ 310 英尺的扩散段在水下排放管处以 65 MGD 的速率排放到哥伦比亚河（图 4.11）。\n\n该 WWTP 次级处理提供了在接收水体若有足够同化废水能力时本会发生的相同生物反应。次级处理工艺旨在加速这些自然过程，以便在相对较短的时间内实现可降解有机污染物的分解。尽管次级处理可去除超过\
  \ 85% 的 BOD₅ 和 SS，但它不会显著去除氮、磷或重金属，也不会完全去除病原性细菌和病毒。NPDES 许可通常要求出水至少去除 85% 的 BOD₅\
  \ 和 SS，粪大肠菌群计数为 100 ml 出水中 200 MPN，并通过对选定淡水（例如鳟鱼或鲑鱼、斑马鱼）和海洋咸水物种（例如糠虾、*Champia parvula*、沙\
  \ dollar、*Echinarchnius parma*）的标准生物测定测试。\n\n在次级处理水平不足的情况下，会对次级出水施加额外的处理工艺。这些三级处理工艺可能涉及废水的化学处理和过滤。其中一些三级处理工艺可去除高达\
  \ 99% 的 BOD5、SS、总磷、细菌和 95% 的氮。这些工艺可生产出晶莹剔透、无色、无味的出水，可用于土地施用和其他有益再利用。\n\n从废水中去除的大多数杂质并不会简单消失。一些有机化合物被分解为二氧化碳和水。大多数杂质以固体即污泥的形式从废水中去除。由于从水中去除的大多数杂质都存在于污泥中，因此必须仔细进行污泥处理和处置以实现污染控制（也在第\
  \ 4.9.2 节中讨论）。\n\n## 图 4.11 造纸厂废水处理厂总体流程图（Das 1991）。\n\n### 4.9.3 NPDES 点源废水排放许可\n\
  \nNPDES 许可计划由 CWA 授权（CWA 第 402 条，33 U.S.C. 1342）。在 1970 年代和 1980 年代初发放的初始许可主要针对\
  \ POTW 和工业废水——通常是“工艺”废水和适用的冷却水。向美国水域（地表水）排放废水需要 NPDES 许可。该许可由 USEPA（1972）委托授权的州签发。由于美国水域也是州水域，NPDES\
  \ 许可实际上是根据双重授权签发的 NPDES/州废水排放许可。NPDES 许可最长签发五年。工业、商业或生活废水中含有的常规污染物为 BOD、SS、粪大肠菌群、pH、温度、游离和残留氯、油脂和溶解氧。有毒污染物包括合成有机化学品和重金属。非常规污染物是任何不属于常规或有毒类别的额外物质，例如氨氮、硝酸盐-亚硝酸盐和总磷。\n\
  \n排放废水的 NPDES 许可包含以下适用于所有许可的标准条件、特定场地的排放限值、合规监测和报告要求（见第 4.4.4 节），以及为排放控制所需的特定场地条件。标准条件描述了许可的法律方面及其可撤销性。它们还描述了许可持有人的职责和义务；例如，许可持有人需要报告变更情况、允许合规检查并重新申请许可续期。最后，许可持有人会被告知可能因许可违规而被处以的处罚。所施加的排放限值基于技术基础和水质基础标准（USEPA\
  \ 1995b, 2010a；Hammer and Hammer 2012；第 D.3 节）。废水污泥的管理也由 NPDES 许可中的条件控制。EPA 负责实施和执行\
  \ NPDES 计划；然而，各州有权在 USEPA 监督下执行这些职能。工业 NPDES 许可对标准污染物的限制示例见表 4.6。\n\nNPDES 是一个自我监测计划，其中处理厂所有者需要负责合规监测并报告废水和污泥处理的性能，包括任何许可条件的违规。排放限制和监测规定指定了用于采样、流量测量、实验室测试和记录保存的程序。运行和维护需要报告处理系统故障、未处理废水的旁路以及工艺扰动。额外的报告要求包括任何排放变化、未合规通知和合规时间表。对未合规的执法是通过行政命令处以货币处罚。对于严重违规，可采取司法行动作为民事或刑事诉讼（Hammer\
  \ and Hammer 2012）。有关 NPDES 许可的更多常见问题及其答案见第 D.3 节。\n\n| 排放参数 | NPDES 许可每日限值 |  |\

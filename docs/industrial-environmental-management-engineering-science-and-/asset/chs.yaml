- "## 7\n## 污染预防的制造经济学\n### 迈向环境可持续的工业经济\n\n## 7.1 引言\n\n许多污染预防计划的失败可以追溯到工程师和科学家无法说服企业领导层改变对环境不利的制造工艺。\
  \ 这种不愿改变往往并非因为推荐的工艺改进在技术上不合理，而是因为工程团队未能讲企业的语言，即金钱。 经济学在污染预防中的作用非常重要，甚至与识别工艺变化技术、新兴技术、工艺和/或产品改造、零排放技术、生物基工程化学品、产品、可再生能源来源技术及其相关成本的能力一样重要。\n\
  \n新技术、产品、工艺和服务的市场接受度取决于成本、物理性能、环境绩效、公共政策、文化偏见等多种因素的复杂相互作用。 准确预测是一项困难且耗时的活动，最好留给专家。\
  \ 然而，成本估算是一项有价值的技能，使工程师能够获得项目成本的“大概”近似值。 目标是获得一个估计值，如果企业得以推进，其与实际成本的误差在±30%以内。 这样的估计相对容易制定。\
  \ 工程师使用相对较少的一套财务工具来评估替代资本投资并向高级管理层证明其选择。 最常见的是，工程师的目的是展示推荐的投资将如何提高公司的盈利能力。 资本改善的支出在很大程度上是自愿的。\
  \ 增加一条装配线或从一种垫圈材料改为另一种材料可以推迟、或提案被 outright 拒绝。 这对于污染控制设备来说并非如此，这些设备是遵守州和联邦污染标准所必需的，通常必须在规定的最后期限之前或之前安装。\
  \ 因此，安装设备 X 的决定可能并非源于工程师。 相反，污染控制设备的需求可能是由公司的环境经理确定的，然后将获取设备 X 的决定下放到工程师。 本章提供了一些可用于评估实施污染预防技术成本的成本估算方法；\
  \ 这些方法在成本比较以及成本效益、最佳可行技术和新兴技术的考虑中也很有用。 还提供了一些关于可再生资源成本以及从此类原料生产生物基产品的成本的信息。 然而，我们首先对盈利的污染控制技术和最佳控制技术得以实施的经济矩阵做一些评论。\n\
  \n## 7.2 污染预防的经济评估\n\n工程项目的经济评估通常涉及设备、安装、原材料、能源和维护成本的估算。 在确定经济回报率时，处置和污染控制成本通常会纳入这些计算，但其他监管和社会成本则不会。\

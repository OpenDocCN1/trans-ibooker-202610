  \nd) 5th 百分位数：6.175；95th 百分位数：9.331。\n\n## 8.2.8 实验设计的统计工具：过程和产品开发\n\n本节介绍 SPC，这是一组在质量改进活动中必不可少的工具。统计方法在质量改进中发挥着至关重要的作用。接下来概述了一些应用：\n\
  \n- 1) 在产品和/或过程设计开发中，可以使用统计方法，包括设计实验，来比较不同的材料、组件或成分，并帮助确定系统和组件公差。该应用可显著降低开发成本并缩短开发时间。\n\
  - 2) 统计方法可用于确定制造过程的能力。SPC 可用于通过降低变异性系统地改进过程。\n- 3) 实验设计方法可用于研究过程改进。这些改进可带来更高的产量和更低的制造成本。\n\
  - 4) 寿命测试提供有关产品可靠性和其他性能数据。这可带来新的改进设计和产品，具有更长的使用寿命和更低的运行和维护成本。\n\n工程师、科学家、经理和政策制定者必须深入了解这些统计工具，任何希望成为高质量、低成本生产者的行业或企业都需要。在本节中，我们介绍了统计质量控制的基本方法，以及与实验设计一起构成成功质量改进努力的基础。\n\
  \nSPC 起源于 1920 年代。贝尔电话实验室的 Walter A. Shewhart 博士是该领域的早期先驱之一。1924 年他撰写了一份备忘录，说明了控制图，这是\
  \ SPC 的基本工具之一。二战见证了这些方法向美国工业的广泛传播。Edward Deming 博士和 Joseph Juan 博士在二战后传播该方法论方面发挥了重要作用。\n\
  \nSPC 是一套可应用于任何过程的问题解决工具。SPC 的主要工具有以下：\n\n- 1) 茎叶图\n- 2) 直方图\n- 3) 帕累托图\n- 4) 因果图\n\
  - 5) 缺陷集中图\n- 6) 控制图\n- 7) 散点图\n- 8) 检查表\n\n尽管这些工具是 SPC 的重要组成部分，但它们仅构成该主题的技术方面。SPC\
  \ 的同等重要元素是态度——组织内所有个人都希望通过系统地减少变异性来持续改进质量和生产率。控制图是 SPC 工具中最强大的工具。有关这些方法的完整讨论，请参阅\
  \ Montgomery（2009）。\n\n## 8.3 时间序列：随时间变化的过程\n\n在许多实际情况下，制造过程中数据通常随时间收集。可能影响过程或系统的现象在数据的面向时间绘图中往往变得更加明显，并且可以更好地判断过程的稳定性。例如，控制图是一种显示随时间变化数据的技术，使工程师能够评估过程的稳定性。\n\
  \n**370** | **8 精益制造**\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_388_0.png)\n\n\
  图 8.3 是工业综合体中二元精馏塔每小时测量的乙醇浓度读数的点图。点图显示的大幅变化表明可能存在问题，但图表并不能帮助解释变化的原因。由于数据随时间收集，因此称为时间序列。数据相对于时间的图，如图\
  \ 8.4 所示，称为时间序列图。图中可见过程均值水平可能出现向下偏移，并且可以获得偏移时间的估计。\n\n### 8.3.1 基本原理\n\n在任何生产过程中，无论设计得多么好或维护得多么仔细，总会存在一定量的固有或自然变异。这种自然变异，或“背景噪声”，是许多微小、基本上不可避免的原因的累积效应。当过程的背景噪声相对较小时，我们通常认为它是可接受的过程性能水平。在\
  \ SPC 的这一框架中，这种自然变异通常称为“稳定机会原因系统”。仅存在 *机会原因* 变异的过程称为处于统计控制状态。换句话说，机会原因过程固有的一部分。\n\
  \n其他类型的变异偶尔也可能出现在过程输出中。关键质量特性的这种变异通常源于以下来源：机器调整不当、操作员错误或原材料缺陷。与背景噪声相比，这类变异通常很大，并且通常代表不可接受的过程性能水平。我们将这些不是机会原因模式一部分的变异来源称为\
  \ *可指定原因*。在存在可指定原因的情况下运行的过程称为失控。*机会* 和 *可指定* 原因的术语由 Walter Shewhart 博士提出（Montgomery\
  \ et al. 2011）。\n\n控制图是描述统计控制含义的装置；因此，可用于多种方式。在许多应用中，它用于在线过程监控。即收集样本数据并用于构建控制限，如果\
  \ $\\bar{x}$（任意）样本值落在控制限内且不表现出任何系统模式，我们就说过程在图表指示的水平下受控。请注意，我们这里可能有兴趣确定过去数据是否来自受控过程，以及未来样本是否表明统计控制。控制图最重要的用途是\
  \ *改进* 过程。利用控制图进行的过程改进活动如图 8.5 所示。请注意，（i）大多数过程不处于统计控制状态；（ii）因此，控制图的常规和细致使用将识别可指定原因。如果这些原因可以\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_388_1.png)\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_388_2.png)\n\
  \n\n\n被消除，变异性将会降低，过程也将得到改进；(ii) 控制图只能检测出可赋因。管理、操作人员和工程方面的行动通常是必要的，以消除可赋因。制定对控制图信号做出响应的长期计划至关重要（Montgomery\
  \ et al. 2011）。\n\n在识别和消除可赋因时，找到问题的根本原因并加以解决非常重要。表面上的解决方案不会带来任何真正的、长期的过程改进。建立有效的纠正措施体系是有效\
  \ SPC 实施的重要组成部分。控制图也可以用作估计工具。也就是说，从表现出统计受控的控制图上，我们可以估计某些参数，例如均值、标准差以及不合格品率或不良率。这些估计值随后可用于确定过程生产合格产品的能力。此类过程能力（$PC$）研究对产品生命周期中出现的许多管理决策问题具有相当大的影响，包括自制或外购决策、降低过程变异性的工厂和工艺改进，以及与客户或供应商就产品质量达成的合同协议。\n\
  \n用于质量特性的控制图称为属性控制图。控制图在工业中已有悠久的使用历史。它们受欢迎的原因至少有五点：\n\n- 1) 控制图是提高生产率的成熟技术。成功的控制图计划将减少废品和返工，而废品和返工是任何作业中生产率下降的主要原因。如果减少废品和返工，生产率就会提高，成本就会降低，生产能力（以每小时合格件数衡量）也会提高。\n\
  \n- 2) 控制图在缺陷预防方面有效。控制图有助于保持过程受控，这与“第一次就做对”的理念一致。事后对“好”单元和“坏”单元进行分拣永远不会比最初就造好更便宜。如果没有有效的过程控制，你就是在为制造不合格产品付钱。\n\
  \n- 3) 控制图可防止不必要的过程调整。控制图能够区分背景噪声和异常变异；没有其他设备，包括人工操作员，能像它一样有效地做出这种区分。如果过程操作员基于与控制图计划无关的定期测试来调整过程，他们往往会过度反应于背景噪声并做出不必要的调整。这些不必要的调整通常会导致过程性能下降。\n\
  \n- 4) 控制图提供诊断信息。经常，控制图上点的模式会包含对经验丰富的操作员或工程师具有诊断价值的信息。这些信息使操作员能够对过程进行更改，从而提高性能。\n\
  \n- 5) 控制图提供关于 PC 的信息。控制图提供了关于重要过程参数的值及其随时间稳定性的信息，从而可以估计 PC。这些信息对产品和工艺设计人员来说非常有用。\n\
  \n控制图是最有效的管理控制工具之一，其重要性与成本控制和物料控制一样重要。现代计算机技术使得在任何类型过程中实施控制图变得容易，因为数据收集和分析可以在微型计算机或局域网终端上实时在线在作业中心进行（Montgomery\
  \ et al. 2011）。\n\n## 8.4 过程能力\n\n在任何制造过程和作业中，过程输出都存在变异性。在机加工作业中，这是最精确的过程之一，被加工零件看起来可能完全相同，但仔细检查会发现零件之间存在尺寸差异。制造变异可分为两类：随机和可赋因。\n\
  \n随机变异由许多因素引起：每次作业循环的人为变异、原材料变异、机器振动等。单独来看，这些因素可能影响不大，但综合起来，误差足以造成麻烦，除非它们在零件公差范围内。随机变异通常形成正态统计分布。过程输出倾向于围绕均值聚集，就产品感兴趣的质量特性而言（例如长度、直径或重量）。大部分零件集中在均值附近，远离均值的零件较少。当过程的唯一变异属于此类时，称该过程处于统计受控状态。这种变异只要过程正常运行就会持续存在。正是当过程偏离这种正常运行条件时，第二种变异才会出现。\n\
  \n可赋因变异表明偏离正常运行条件。过程中发生了随机变异无法解释的情况。可赋因变异的原因包括操作员失误、原材料缺陷、工具失效、机器故障等。制造中的可赋因变异通常通过导致输出偏离正态分布而表现出来。过程不再处于统计受控状态。\n\
  \nPC 与过程处于统计受控时输出中固有的正常变异有关。按定义，PC 等于均值输出值上下各 ±3 个标准差（总共六个标准差）：\n\n```\nPC = μ ±\
  \ kσ\n```\n\n其中 PC 为过程能力；μ 为过程均值，设定为产品特性的标称值；k 是控制限距中心线的“距离”，以标准差单位表示。常见的选择是 k =\
  \ 3 和 σ，过程标准差。该定义所依据的假设是 (i) 输出呈正态分布且 (ii) 已达到稳态运行且过程处于统计受控状态。在这些假设下，99.73% 的零件或产品产生的输出值将落在均值\
  \ ±3.0 范围内。这种控制图的基本理论最初由 Walter A. Shewhart 博士提出，并根据这些原则开发的控制图通常称为 Shewhart 控制图。\n\
  \n### 8.4.1 统计过程控制\n\nSPC 涉及使用各种统计方法来评估和分析过程中的变异。SPC 方法包括简单地记录生产数据、直方图、PC 和控制图。控制图是最广泛使用的\
  \ SPC 方法，本节的讨论将集中于它们。\n\n控制图的基本原理是任何过程中的变异可分为两种类型（第 8.4 节）：(i) 随机变异，即过程处于统计受控时存在的变异，以及\
  \ (ii) 可赋因变异，即表明偏离统计受控的变异。控制图的目的是识别过程何时超出统计受控，从而发出应采取纠正措施的信号。\n\n控制图是一种图形技术，其中根据某一过程特性测得的值计算出的统计量随时间绘制，以确定过程是否保持统计受控。控制图的一般形式如图\
  \ 8.6 所示。该图由三条随时间保持恒定的水平线组成：中心线、下控制限（LCL）和上控制限（UCL）。中心线通常设定为正常设计值。UCL 和 LCL 通常设定为样本均值的\
  \ ±3 个标准差。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_390_0.png)\n\n图 8.6 设定为样本均值\
  \ ±3 个标准差的控制图。\n\n在过程处于统计受控时，样本值落在 UCL 或 LCL 之外的可能性极小。因此，如果样本值确实落在这些限之外，则解释为过程失控。因此，将进行调查以确定失控条件的原因，并采取适当的纠正措施以消除该条件。同样，如果发现过程处于统计受控状态且数据中没有不良趋势的证据，则不应进行调整，因为它们会向过程引入可赋因变异。“如果没坏，就别修”的理念适用于控制图。\n\
  \n控制图主要有两种基本类型：(i) 变量控制图和 (ii) 属性控制图。变量控制图需要对感兴趣的质量特性进行测量。属性控制图只需确定零件是否不合格或样本中存在多少缺陷。\n\
  \n### 8.4.2 变量控制图\n\n过程失控表现为 (i) 过程均值和/或 (ii) 过程变异性的显著变化。相应地，变量控制图主要有两种类型：(i) x̄\
  \ 图和 (ii) R 图。x̄ 图（称为“均值图”）用于绘制从生产过程中抽取的一系列样本中某一质量特性的平均测量值。它显示过程均值随时间的变化。R 图绘制每个样本的极差，从而监控过程的变异性并指示其是否随时间变化。\n\
  \n\n\n\n\n必须选择一个合适的过程质量特性作为在 x̄ 和 R 图上进行监控的变量。在机械过程中，这可能是一个轴直径或其他关键尺寸。必须使用过程本身的测量值来构建两个控制图。在过程平稳运行且不存在可分配变差的情况下，收集一系列样本（例如，通常建议\
  \ m = 20 或更多）的小样本（例如，每个样本 n = 5 个零件），并对每个零件测量感兴趣的特性。用于构建每个图的中心线、LCL 和 UCL 的步骤如下：\n\
  \n- 1) 计算每个 m 个样本的均值 x̄ 和极差 R。\n- 2) 计算总均值 x̄，即 m 个样本的 x̄ 值的均值；这将是 x̄ 图的中心线。\n-\
  \ 3) 计算 R̄，即 m 个样本的 R 值的均值；这将是 R 图的中心线。\n- 4) 确定 x̄ 和 R 图的 UCL 和 LCL。可以从样本数据估计标准差值并用于计算这些控制限。然而，更简单的方法是基于专门为这些控制图推导的、列于表\
  \ H.1 中的统计因子。因子值取决于样本大小 n。对于 x̄ 图，\n\n```\nLCL = x̄ − A₂ R̄  (8.6)\nUCL = x̄ + A₂\
  \ R̄  (8.7)\n```\n\n对于 R 图，\n\n```\nLCL = D₃ R̄  (8.8)\nUCL = D₄ R̄  (8.9)\n```\n\

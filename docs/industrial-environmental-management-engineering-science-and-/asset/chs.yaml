- "## 2 全球环境问题的起源\n\n### 国际环境法规\n\n## 2.1 引言\n\n所有学科领域的工程师都在从事一份必须遵守规范其行为准则的职业。所有工程师都应了解的一个重要规则集是环境法规，这些法规是由美国国会和世界各国政府制定的法律。\n\
  \n环境法，也称为环境与自然资源法，是一个集体术语，用于描述涉及条约、成文法、法规、普通法和习惯法的网络，这些法律旨在解决人类活动对自然环境的影响。核心环境法律制度主要针对环境污染。一套相关但不同的监管制度如今深受环境法律原则的影响，它们侧重于特定自然资源的管理，例如森林、矿产或渔业。其他领域，如环境影响评估，可能无法整齐地归入上述任一类别，但它们仍然是环境法的重要组成部分。\n\
  \n本章的目标是概述当前各国和各大洲环境法律法规背后的历史以及环境污染情况。本章中展示的许多材料取自各种来源，包括以下内容：《美国法典》（USC）；《联邦法规》（CFR）；美国环境保护署（USEPA）；联合国环境规划署（UNEP）；国际环境法中心；Sullivan\
  \ 和 Adams（1997）编著的《环境法手册》；Stander 和 Theodore（2008）编著的《环境监管计算手册》；Upadhyay（2012）编著的《环境法》；Divan\
  \ 和 Rosencranz（2002）编著的《印度环境与政策法：案例、材料与法规》；Craig 选编的《环境法规精选》，由 West Academic Publishing\
  \ Co. 出版（2016）；Lynch（1995）；Google；以及维基百科。这些来源中的大多数都可以通过网络找到。\n\n环境法的出现是由于应对工业革命前、期间和后期与环境相关的严重问题。为了应对环境问题，法律旨在保护并促进环境。它的设计目的是预防、控制和监管环境污染。\n\
  \n环境保护及其保存是当今所有人的关切。世界许多地区的当前环境状况清楚地表明，地球上的活动是相互关联的。如今社会与自然的互动如此广泛，环境议题已膨胀至影响全人类的规模。环境破坏和污染已严重威胁人类生命、健康和生活。因此，全球范围内都加强了环境保护的力度。如果要确保当代和后代的生活质量，必须使他们免于环境灾害。自然以动植物形式给予人类的礼物必须保持其自然形态。世界生态系统的适当平衡已迫在眉睫。解决这一问题的唯一途径是可持续发展。环境法的目的是保护并保存我们的水、空气、地球和大气免受污染。但仅靠法律无法解决污染问题。必须提高对问题的认识，并需要持续的努力来管理它。\n\
  \n可以通过注意到以下事实来阐明这一情况：随着科学技术和世界人口的不断增长，人类环境发生了巨大变化。这些变化打破了生态规律，改变了人类生活与环境之间的平衡。在这种情况下，有必要通过旨在应对不断变化的条件和价值观的新法律来规范人类行为和社会交易。\n\
  \n因此，为了面对此类系统的众多挑战，发展出了一个新的法律分支，即环境法。\n\n环境保护的需求是一个重大问题，并位居人们优先事项的高位。此外，从待解决问题的规模以及解决它们所需的措施来看，环境问题也是重大议题。一些主要问题，例如，包括人口增长（图\
  \ 2.1）、全球变暖（图 2.2）、臭氧层 depletion、酸雨、有毒废物和森林砍伐。\n\n长期的全球人口增长很难预测。联合国和美国人口普查局都给出了不同的估计——根据联合国的数据，2015\
  \ 年末世界人口达到约 73.1 亿（联合国秘书处 2015）。图 2.1 显示了一种趋势：自 19 世纪中叶以来，人类人口一直在迅速增长，这与自然环境平衡的退化同步发生。\n\
  \n在过去二十年里，至少在美国，人口增长还伴随着人口从农村向城市地区转移的趋势（Wallach 2005），这使水资源需求集中在某些区域，并对来自工业和人类污染物的淡水供应造成了压力（Water\
  \ 2011）。城市化导致过度拥挤和日益恶化的卫生居住条件，尤其是在发展中国家，进而使越来越多的人暴露于疾病之中。世界人口中约 79% 居住在发展中国家的，这些国家缺乏卫生的水和污水处理系统，导致因受污染的水源和传播疾病昆虫数量的增加而引发疾病和死亡（Powell\
  \ 2009）。\n\n图 2.2 显示了近年来全球平均温度异常值（陆地和海洋合计）的行为。正如在图 2.2 中所见，大部分变暖发生在两个时期——从 1910\
  \ 年到 1940 年以及从 1980 年至今。月平均全球地表温度异常值的折线图，基准期为 1951–1980 年。黑线仅显示气象站数据；圆圈代表陆海温度指数，如\
  \ Hansen 等人（2010）所述。陆海温度指数使用海表温度。\n\n这些问题是全球性问题，需要适当的全球应对措施。从问题范围和议题来看，环境保护是一个重大问题，例如空气污染的、水污染、安全饮用水、农药、噪声污染、废物处置、放射性物质和废物，以及森林和野生动植物的保护。这份清单详尽无遗。此外，从理解待解决特定问题所需的知识技能来看，环境领域的议题也是重大议题。因此，可以说环境问题范围“从当地的街角到平流层”。由此可见，人类面临着压倒性的环境问题。法律被援引以保护人类和我们的生态系统，通过解决环境问题，因为它们直接打击我们与生物圈的密切联系，而生物圈是覆盖在地球上的一个薄薄的生命外壳——只有约五英里厚——像苹果的表皮一样包裹着地球。\n\
  \n环境保护的范围覆盖全球，并不局限于孤立的区域或国家。环境污染问题是全球性的，关系到所有国家，无论其规模、发展水平或意识形态如何。尽管世界在政治上被划分为国家单位，但海洋世界是一个相互关联的整体，吹过各国的风也在吹拂着其他地方。环境是一个遍及全世界的普遍现象。如果在世界任何地方进行核试验，辐射沉降物可能会随风被带到世界任何其他地方，而某个遥远能源星球上不负责的放射性废物排放，其对邻近国家产生的不利影响可能比一场全面战争的威胁还要大。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_46_0.png)\n\n图 2.1 100 年间的全球人口增长。来源：联合国，经济和社会事务部，人口司（2017）。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_47_0.png)\n\n**图 2.2** 工业化以来 100 年间的地球升温。*来源：http://data.giss.nasa.gov/gistemp.graphs.*\n\
  \n### 2.1.1 环境历史\n\n环境历史是研究人类随时间与自然世界相互关系的学科。与其他历史学科相比，它强调自然在影响人类事务中的积极作用。环境历史学家研究人类如何塑造其环境，又如何被环境所塑造。\n\
  \n环境历史在美国 20 世纪 60 年代和 70 年代的环境运动中兴起，其许多推动力至今仍源于当前的全球环境关切（Chakrabarti 2006）。该领域建立在保护主义议题之上，但范围已扩大到包括更普遍的社会史和科学史，并可能涉及城市、人口或可持续发展。由于所有历史都发生在自然世界中，环境历史倾向于关注特定的时间尺度、地理区域或关键主题。它也是一个强烈的多学科主题，广泛借鉴人文学科和自然科学。\n\
  \n环境历史的主题内容可分为三个主要组成部分（Chakrabarti 2007）。第一，自然界本身及其随时间的变化，包括人类对地球陆地、水、大气圈和生物圈产生的物理影响。第二类，人类如何利用自然，包括人口增长、更有效的技术以及生产和消费模式变化带来的环境后果。其他关键主题包括新石器时代革命中从游牧狩猎采集社区向定居农业的过渡、殖民扩张和定居的影响，以及工业和技术革命的环境和人类后果（Cronon\
  \ 1995）。最后，环境历史学家研究人们如何思考自然——态度、信仰和价值观如何影响与自然的互动，特别是以神话、宗教和科学的形式。\n\n## 2.2 环境问题的起源\n\
  \n自第一人发现火以来，环境问题就一直困扰着人类。最早的人类似乎居住在热带的各种地点内，并且\n\n\n\n\n\n## 2.3.1 自然原因\n\n干旱、洪水、海啸、气旋、飓风、龙卷风、山洪、地震、火山熔岩以及流行病是导致环境污染的主要自然原因/因素。由于这些是自然造成的事件，人类无法控制它们，因此被称为自然原因。\n\
  \n## 2.3.2 人为原因\n\n主要有四大人为原因：\n\n- 1) 人口增长\n- 2) 贫困\n- 3) 城市化\n- 4) 工业化\n\n## 2.3.3\
  \ 人口增长\n\n“地球是有限的，世界人口也是有限的。” 每一个新生儿都会消耗大量的自然和非自然产品，而这些产品最终也是在利用自然资源后提供的。因此，每一次出生都会增加对自然资源的需求。但事实是，有限的世界只能养活有限的人口。换句话说，随着人口的增长，自然资源会减少。根据世界人口统计网站对联合国最新估计的整理，截至2019年8月，当前世界人口为77.3亿。本世纪世界人口几乎增长了六倍（图2.1）。仅印度就占世界陆地面积的约17%人口。城市人口的增长速度非常快。这表明对燃料、食物、无污染的清洁水和空气、居住空间以及健康条件的需求不断增加。城市地区人口的增加造成了土地、大气和水污染以及不卫生的状况，这些因素累积起来严重影响了生活质量。一些大城市因其周边的污染工业而被评为拥堵城市。城市人口的持续增长提高了各个地区的人口密度，这也给人们带来了各种社会、身体和心理问题。这些人口高度密集的地区还导致了森林砍伐和植被覆盖的消失，植被覆盖仅占总面积的11%，而必需的比例为33%。人口增长还会导致贫困，而贫困也是污染的原因之一。\n\
  \n## 2.3.4 贫困\n\n贫困对人口增长和环境污染都有同等贡献。贫困被定义为\n\n个人或家庭无法达到最低生活标准的能力（世界卫生与环境委员会1992年）。贫困人口通常预期寿命低、婴儿死亡率高、残疾发生率高。不卫生、不洁净和健康状况差都是由于贫困造成的。贫困人口的贫困伴随着其生存基本手段——环境及其生命支持的自然资源——土地、森林、水和空气的同步且系统性的侵蚀。贫困降低了人们以可持续方式利用资源的能力，这也加剧了欠发达和发展中国家对环境的压力。如今，人们已经恰当地观察到，贫困人口与贫困与环境之间存在联系（《我们共同的未来》1987年）。\n\
  \n## 2.3.5 城市化\n\n快速且无计划的城市化也导致了环境污染和人类环境的退化。这是发展中国家贫困人口从小城镇和乡村无休止地向城市中心迁移以及人口快速增长的直接结果。煤炭和木材在集中区域的燃烧使城市成为污染的主要来源。在许多欠发达和发展中国家的城市中，环境因素在城市化思考中被给予了太少的考虑。然而，随着城市化进程的加剧，它们是极其重要的需要考虑的因素。许多欠发达和发展中国家城市的水污染和烟雾污染水平已经很高。\n\
  \n## 2.4 美国工业化和城市化\n\n19世纪早期，一股惊人的新力量在欧洲积聚。法国人创造了“工业革命”一词，用作技术与现代伟大政治革命之间亲和力的隐喻。很快传到美国，工业革命扫除了美国成为农业社会的任何设想。蒸汽机、铁路、机械脱粒机以及数百种其他巧妙的器物，它们增强了人类改造自然世界并加以利用的能力，很快将在全国各地嘶鸣、叮当作响和咆哮。新机器迅速加速了对国家农场、森林和矿山原材料消耗的增加。\n\
  \n### 2.4.1 微型案例研究\n\n工业化和城市化作为工业革命的结果，早在19世纪末和20世纪初之前就已经开始，但由于技术创新、社会变革以及一个日益倾向于将经济增长置于其他任何关切之上的政治体系，在这一时期得到了极大的加速。在1880年之前，工业化依赖于规定的劳动分工——将大多数工作分解成更小的任务，并让同一批人无限期地重复一项任务。1880年之后，工业化更多地依赖于机械化——用机器取代人力——以增加生产并最大化利润。现代电网的发展始于1880年代初，促进了此类技术进步。亨利·福特的装配线和20世纪之交后大规模生产的兴起只会加强这种效应。结果，美国的总制造业产出在1929年比1859年大28倍。考虑到同期人口的增长，这一数字仍增长了七倍（Wright\
  \ 1941）。\n\n美国的城市可以追溯到殖民时期之初，但新工业工厂倾向于位于城市或城市附近，这意味着城市在19世纪后期比以往任何时候都增长得更快。这种趋势在纽约等大城市中最为明显，纽约在1850年至1900年间从约五十万人扩张到约350万人，费城在同一时期从略多于10万居民增加到超过120万人。在19世纪后期最后半个世纪，芝加哥被证明是世界上增长最快的城市。总体而言，1850年有15.3%的美国人居住在城市。到1900年，这一比例增加到39.7，并继续增长。1920年人口普查显示，首次有更多美国人居住在城市而不是乡村（Rees\
  \ 2013）。\n\n并非全国每个城市都像最大城市那样快速发展。由于工业增长性质的差异，城市化存在重要的区域差异。东北部最大的城市是制造业大国，拥有从建造铁路机车的巨型工厂到人们公寓内生产纺织品的小作坊的一切。东北部还出现了专注于特定产业的小城市，例如纽约州罗切斯特，专门生产男装、靴子和鞋子。继承了19世纪早期的制造业传统，马萨诸塞州的新贝德福德和福尔里弗因其棉纺织厂而增长。其他城市，如新泽西州的伊丽莎白，则随着其邻近大城市的扩张而作为副产品增长。美国中西部最大的城市芝加哥，因在西部边疆的自然资源向东作为制成品运输之前对其进行加工而闻名。谷物和木材——芝加哥早期增长的关键产业——依赖芝加哥进行营销和储存。随着冷藏铁路车的完善，肉类加工成为如此庞大的产业，以至于美国人吃的大部分肉类都在该市南部的牲畜市场加工。（这一活动在20世纪之交后会再次分散到沃斯堡和堪萨斯城等其他城市。）美国工业心脏地带的其他小城市将围绕其他制造业追求而发展，如杨斯敦的钢铁，以及俄亥俄州代顿的机床和收银机（Warner\
  \ 1995）。\n\n南方自内战前就落后于全国其他地区。因此，许多倡导该地区外部投资的人在战后扩大了活动。他们取得了一些成功。虽然南方在19世纪后期和20世纪初的工业化（因此城市化）速度加快，但仍未完全赶上全国其他地区。例如，阿拉巴马州伯明翰于1871年成立，在1880年代随着两条铁路首次将该市与该地区的矿产资源连接起来而繁荣，成为铁和钢铁制造中心。卡罗来纳州“上区”棉纺厂的增长始于1870年代。20世纪之交后，该地区因廉价的非工会劳动力而成为纺织工业的重要活动中心。\n\
  \n将这一时期与城市和工业历史上的早期时期区分开来的，是这是美国历史上第一次城市成为美国生活中心的时期。城市是大多数新工厂建立的地方。移民潮定居在城市，因为那是工业工厂的就业机会所在。城市也是工业化影响最明显的地方，尤其是财富不平等加剧。也就是说，城市的问题成为美国的问题。\n\
  \n### 2.4.2 电网和交通改善\n\n后期工业化比以前进展更快的一个原因就是动力来源的改善。早期的工业革命依赖蒸汽机和水力。最早的发动机体积庞大、价格高昂，任何人都买不起\n\
  \n\n……但最大的企业除外。对于小型企业来说，水轮是一个可行的选择，但它们无法像后来的动力源那样完成大量的工作。在 1869 年到 1929 年之间，美国的总可用马力从\
  \ 230 万单位增加到 4300 万单位。在工厂中，这一增长的最大部分来自于电力使用的巨大增加（Wright 1941）。\n\n尽管工厂在整个十九世纪都变得更大、更高效，但在\
  \ 1880 年之后，它们变得特别大，因为驱动它们所需的动力变得 cheaper、更清洁，获取起来也更加方便。从 1870 年代末开始，托马斯·爱迪生将他庞大的实验室的关注点转向利用电力创造负担得起的廉价电灯。这一成就不仅依赖于创建高效、廉价的白炽灯泡，还依赖于创建为其供电的电气系统——从发电机、电线到开关，一应俱全。由于这些事物中没有先例可循，爱迪生电力公司及其许多相关子公司（后来被归类于通用电气旗下）必须制造几乎一切东西才能使电网运行。“既然资本是胆小的，我将筹集并提供它，”爱迪生向他的一位投资者解释道。“问题在于是工厂还是死亡！”（Jonnes\
  \ 2004）。其他公司很快也紧随其后，因为建立最终为几乎所有事物提供动力的中央电站和电网显然利润丰厚。\n\n象征着资本对爱迪生努力的重要性，第一个成功通电的家庭属于银行家\
  \ J. P. 摩根，时间是 1882 年。尽管遭遇挫折，他对电灯的体验鼓励他在爱迪生的事业中进一步投资。爱迪生在同一年晚些时候在纽约市建立了第一个中央发电站。爱迪生布线的曼哈顿第一个区域是那些他试图说服投资于他的企业的金融机构操作员以及两家会宣传他成就的主要报纸的住宅和工作场所聚集的社区。到\
  \ 1902 年，美国有 2250 个电力发电站。到 1920 年，这个数字增长到略低于 4000 个。电力从大城市传播到小城市，并最终在 1920 年代扩展到农村地区（Cowan\
  \ 1985; Cowan and Hersch 2017）。\n\n这种增长需要在爱迪生最初的电气系统愿景之外进行重大改进。可靠的电网对其最初出现城市的产生了诸多影响，范围从空气中减少煤炭烟雾到各种电器产生的新声音——从有轨电车到弧光灯。早期的弧光灯非常明亮，人们认为它们可以通过曝光实施这些罪行的人来阻止犯罪和恶习。在小城市，获得电灯是现代化的标志，这意味着未来的增长。城市工作场所的现代灯光通过减轻眼睛的疲劳使办公室工作更轻松。随着电力公司的进入，广受憎恶的城市煤气公司失去了相当大的经济权力。由于人们更喜欢电灯而非煤气灯，随着电网的扩展和成本的下降，它变得越来越流行。电灯甚至改变了人们在房屋内部的生活方式。例如，孩子们现在可以被信任自己上床睡觉，因为不再存在以前在黑暗中上床所需的明火带来的火灾风险。\n\
  \n然而，不断壮大的电网制造了新的城市危险。悬挂在地面上的高压电线与其他来自电话、电报——甚至股票报价机——的电线一起，构成了新的城市“电线威胁”。许多电线在恶劣天气中掉落。它们对电力公司员工和行人都构成了危险。“架空系统是健康和生命的常备威胁，”一份医学期刊在\
  \ 1888 年报道（Freeberg 2014）。1889 年，由过热电线引起的火灾点燃了一栋装满干货的建筑，并烧毁了波士顿市中心的大部分区域。\n\n高品质、负担得起的照明最显著的影响是工厂\
  \ 24 小时全天候运营的普遍做法——这使得它们在没有任何生产技术改进的情况下变得更具生产力。取代恶臭的煤气灯也使工厂的味道对在那里工作的工人变得更好。随着电网变得更加可靠，电动机逐渐开始取代蒸汽机作为制造业的动力来源。使用小型电动机作为动力源使工厂不必靠近水源来为锅炉供水，这也使工厂可以建得更小。\n\
  \n在 1880 年到 1900 年之间，工厂倾向于采用电灯照明，但仍在使用较早的动力源进行操作。工厂操作的电力在 1900 年到 1930 年之间迅速普及。这两项发展（加上大量移民工人的供给）共同促成了城市的工业化。各类工业设施的电气化在二十世纪的前二十年间迅速推进。企业比城市更快地接通电力，因为它们能够最充分利用起初相对昂贵的服务。\n\
  \n由于工厂集中在城市内或附近，给它们布线比给远离电力发电站的农场甚至小城市布线要便宜得多。在这个后期时期建造的新工厂中的许多出现在城市界限之外，这是另一个新的发展。电气化使经理能够自动执行以前由手工劳动完成的工作，从而消除低效，加强对生产过程的控制，并提高整体生产力。新设备如时间打卡机，甚至如流水线这样的新生产模式也依赖于电力。\n\
  \n廉价且现成的电力的出现对这一时期美国城市的物理布局产生了特别重要的影响。弗兰克·斯普拉格，一位曾为托马斯·爱迪生工作的电气工程师，于 1888 年为弗吉尼亚州里士满设计了第一个有轨电车系统。这类系统取代了马车，使人们能够比平时走得更远、更快。这引发了一股郊区化的浪潮，一批新城镇出现在美国城市的边缘，富裕和中产阶级人群可以搬去那里以逃避现代城市生活的困难，但仍然足够接近以享受其许多优势。\n\
  \n新的郊区居民通常通过新的有轨电车上下班。电气设备制造商西屋电气是通过架空线供电的车辆的主要制造商之一。与马匹相比，有轨电车的优势在于不会留下粪便或在街上死亡。有轨电车在周末比在工作日更受欢迎，因为工人阶级利用低票价探索新的社区或参观像康尼岛这样的游乐园，这些公园通常建在这些线路的终点。\n\
  \n正如雇主和城市规划者依赖有轨电车来移动人员一样，制造商在 1880 年之后越来越依赖铁路来运输他们的成品。内战后，铁路里程大幅增长，连接城市并导致新工厂在便于获取生产商品所需资源的地方增长。最终，大众化分销是受益于所有这些生产力提升的先决条件。出于所有这些原因，将工业化和城市化的原因和结果分开在实践中几乎是不可能的。\n\
  \n在整个十九世纪，工厂通常必须建在附近航运港口或铁路站点，因为这是将工厂产品运往世界各地市场的最简单方式。随着十九世纪后期更多铁路轨道的建造，在城市中心之外设立工厂变得更加容易。有轨电车帮助填满了原本工厂可能会占据的城市中心空置空间。它们使人们更容易住在离工作地更远的地方，同时仍能通勤到市中心，从而使其他类型的企业能够落户在那里。一个例子是大型城市百货商店，这是一种先于\
  \ 1880 年出现的现象，但在那之后发展壮大。像费城的旺姆克百货或芝加哥的马歇菲尔兹百货这样的商店批量购买工业化的产品，并以折扣价格出售给可能很难通过其他方式获得这些产品的工人。\n\
  \n尽管零售百货公司可以占据整条街区，且只有几层楼高，但其他企业在建得更高、更窄的建筑物中租用空间。到 1880 年代末，曾经用铁建造的结构开始用结构钢——一种新的、更强的钢材——建造。这种做法始于芝加哥，由建筑师路易斯·沙利文推崇，他在那里设计了第一栋摩天大楼。摩天大楼，沙利文写道，“必须每一寸都是高大且\
  \ soaring 的事物，从下到上以其纯粹的狂喜上升，它是一个统一的体，没有一条不一致的线条”（Alexiou 2013）。这种设计需要一个结构钢骨架，其他物质如砖或花岗岩可以悬挂在其上。即便如此，这样的摩天大楼必须逐渐变细；否则，顶层的重量可能会使整个结构坍塌。\n\
  \n为摩天大楼制造结构钢需要与制造贝塞麦钢（主要用于铁轨）所需完全不同的生产方法。数量和速度是生产贝塞麦钢的主要要求。结构钢需要更精心制作的产品。结构钢的需求鼓励像安德鲁·卡内基这样的钢铁制造商重新设计整个工厂，最著名的是用平炉法取代旧的贝塞麦转炉。这种新的炼钢方法不仅生产质量更高的钢，而且需要更少的高技能工人。这促使卡内基的公司于\
  \ 1892 年在宾夕法尼亚州霍姆斯特德对其工会员工实施锁厂，以便通过雇佣廉价的替代工人来节省资金。\n\n使摩天大楼成为可能的另一项创新是电力电梯。伊莱沙·格雷夫斯·奥的斯在\
  \ 1857 年设计了第一台可靠的电梯。借助电力，几秒钟内上升 60 层成为可能。在电梯之前，商业建筑低楼层的租赁空间价格更高，因为人们不想走楼梯到达顶层。有了电梯，愿意支付溢价的租户为了获得更好的窗外视野。没有电梯，没有人会费心建造高于五层的建筑（Misa\
  \ 1999, 2016）。\n\n摩天大楼的建筑本身是工业时代劳动和材料分配协调的一个极佳例子。钢骨架意味着建筑较高的无装饰部分可以在建筑底部不可避免的复杂装饰边缘完工前进行处理。这节省了\n\
  \n### 2.4.3 结构钢与摩天大楼\n\n\n\n\n既节省时间又节省金钱。当纽约拥挤到没有空间存放原材料时，这些材料的到位会被精心安排，它们会被直接从平板卡车上卸下，放置在新建筑顶部附近的精确位置。大约在二十世纪之交，一座大型摩天大楼最快只需一年即可建成。建筑建造得越快，业主就能越快收取租金并开始收回建设成本。\n\
  \n摩天大楼的巨大好处在于能将经济活动压缩到更小的区域。1897年，一位纽约人解释说：“摩天大楼将大量原本会彼此相隔甚远的活动汇聚到一座单一建筑中。每座建筑几乎都是一座完整的城市，其围墙内通常设有银行和保险公司、邮局和电报局、商业交易所、餐厅、俱乐部会所和商店。”这些微型城市同样拥有众多零售网点，人们可以在那里购买工业化制造的产品（Rees\
  \ 2013）。这些地点之间较短的距离加快了经济活动的节奏，从而促进了进一步的经济增长。然而，大型项目（如与纽约中央火车站建设相关的众多摩天大楼）消除或至少遮蔽了城市工业区。\n\
  \n由于无需缴纳联邦所得税，19世纪90年代，美国各地的工业巨头在纽约第五大道沿线建造豪华宅邸，以展示巨额财富。到20世纪20年代，曼哈顿的土地价值因可能用于建造摩天大楼而迅速增长，以至于第二代工业家族出售了他们的宅邸，因为他们不再愿意为其支付巨额房产税。被称为“范德比尔特巷”的街区——以在同一地区建造宅邸的轮船与铁路先驱的子女命名——被摩天大楼和高端零售商场取代。\n\
  \n摩天大楼生产的基本原理——建得快、建得大，并塞满人——也推动了建造者生产其他类型城市住宅的方式。改革者雅各布·里斯在其1890年的经典著作*另一半人怎样生活*中写道：“今天，[纽约市]四分之三的人口住在廉租公寓里，而19世纪人口向城市迁移的趋势正把越来越多的民众塞进这些公寓”（Riis\
  \ 1914）。这一时期最著名的廉租公寓设计是约五六层高的哑铃式公寓。它们源于一场设计竞赛，但通常拥挤不堪，对居住者弊大于利。四户人家可能共住一层，只有两个卫生间。这种设计旨在让光线和空气进入中央庭院（这就是从上方看呈哑铃形的原因），但背靠背、一间紧挨一间地堆叠后，这两项目标都未能实现。尽管这种设计被广泛复制，纽约市实际上在1901年禁止新建筑采用此设计——但旧建筑依然存在。\n\
  \n公寓楼使人们更容易聚集到城市小区域，从而住得离工作地点更近。富人可以购买空间并与邻居隔开，而那些负担不起郊区生活的中产阶级则失去了城市化加速前所拥有的空间。为了应对这些不平等趋势，纽约人提出了合作公寓的理念，即许多人共同购买一栋建筑并自行管理。一旦曼哈顿的房地产贵得除了拥有巨额财富的人之外谁都买不起，豪华公寓便成为豪宅的替代品。\n\
  \n### 2.4.4 流水线\n\n人们住得离中央商务区越远，就越需要高效的交通。有轨电车在一定程度上有所帮助，但以市中心社区为中心的客运线路留下大片区域，如果居民有自己的出行方式，这些区域便可容纳不断增长的劳动人口的住房。1908年，亨利·福特宣称：“我要为大众造一辆车。它的价格会低到任何一个有优厚薪水的人都买得起”（Watts\
  \ 2005）。这辆车就是T型车，它彻底改变了汽车制造业和美国的景观。它也彻底改变了美国生产的整个概念。福特并不担心他的车有没有市场。他会把车造得极其便宜，让几乎每个美国人都买得起，从而为自己创造市场。\n\
  \n福特能够在大规模生产中同时保证质量和低价，靠的是流水线。这一概念突破在很大程度上归功于上世纪肉类加工行业首创的“分解流水线”。正如单具动物胴体挂在钩子上沿生产线移动时被各有专长的工人拆解，福特在高原公园的新工厂也这样安排，让拥有高度专业化分工的工人能比以往快得多地组装汽车。流水线将工作移向工人，而不是迫使工人移向工作，从而节省了宝贵的时间和精力。它还将劳动分工的概念推向了逻辑极限，使得工人在一个更大的装配过程中日复一日只执行一项功能。这些原则几乎适用于所有产品的制造，正是这一点使它们意义重大。\n\
  \n20世纪20年代采用福特原则的是家用电器制造商，如冰箱和收音机制造商。例如，通用电气为其Monitor Top冰箱建造了一条价值1800万美元的流水线，并在1927年推出后仅4年就售出了100万台冰箱（Cowan\
  \ 1985）。\n\n即使是像家具制造这样以手工艺为主导的行业，也开始依赖大规模生产，使其产品更普及。从农场搬到城市的人们迫切需要家具来布置他们的新城市住宅，但在像密歇根州大急流城这样的工业城镇，他们买不起工匠制作的家具。基于时尚样式、以最少雕刻和覆面层制成的新型大规模生产家具在全国各地找到了市场。同样有帮助的是，1902年在弗吉尼亚州成立的巴塞特等公司，像福特一样，阻止其工人组建工会。缺乏组织的劳动力使工业家更容易在生产过程中实施变革，而不会遭到员工的抵制。\n\
  \n1927年从T型车换到A型车的转变，暴露了工业化大规模生产的局限。A型车极其昂贵，福特不得不关闭其主要工厂数月，以重新调整生产线来生产新车型。尽管新车起初销路不错，但随着大萧条加深，销量急剧下滑。1932年，百货业巨头爱德华·法林写道：“大规模生产并不仅仅是扩大生产规模。它是在清楚认识到生产增加要求购买增加的基础上进行的大规模生产”（Hounshell\
  \ 1984）。当人们几乎没有钱购买工业化产品时，大规模购买变得困难。大萧条期间，城市建设也急剧放缓。由于城市是工业化的焦点，当生产萎缩时，城市居民遭受的冲击格外严重。当然，当美国陷入大萧条的经济低迷时，城市和工业增长都急剧下降。\n\
  \n### 2.5 重要的技术发展\n\n工业革命的开始与少数几项创新密切相关，这些创新始于十八世纪下半叶（Bond 等 2003）。到19世纪30年代，以下重要技术取得了进步：\n\
  \n- **纺织业** – 以蒸汽或水力驱动的机械化棉纺使单个工人的产量提高到原来的500倍。动力织布机使单个工人的产量提高到原来的40倍以上（Ayres 1989）。轧棉机使去除棉籽的生产率提高到原来的50倍（Wickham\
  \ 1916）。毛纺和亚麻的纺纱与织布生产率也有大幅提高，但不如棉纺业显著（Beckert 2014；Landes 1969）。\n- **蒸汽动力** – 蒸汽机的效率提高到燃料消耗仅为原来的五分之一至十分之一。固定式蒸汽机改造为旋转运动后，适合工业使用（Landes\
  \ 1969）。高压发动机具有很高的功率重量比，适合交通运输。1800年后，蒸汽动力迅速扩张。\n- **炼铁** – 用焦炭替代木炭大大降低了生铁和熟铁生产的燃料成本（Landes\
  \ 1969）。使用焦炭还使高炉可以更大，从而形成规模经济（Landes 1969；Rosen 2012）。铸铁鼓风缸于1760年首次使用，后来改进为双作用式，使高炉温度更高。搅拌炼铁法生产结构级铁的成本低于精炼锻炉（Landes\
  \ 1969）。轧机比锤打熟铁快15倍。在随后的几十年里，热风大大提高了炼铁的燃料效率。\n- **机床的发明** – 首批机床被发明出来，包括螺纹车床、汽缸镗床和铣床（Hounshell\
  \ 1984）。\n\n十九世纪即将结束时，三位非常特殊的人物登上了美国国家舞台。吉福德·平肖、约翰·缪尔和西奥多·罗斯福写下了美国现代环境史的第一页，这反过来又在二十世纪初催生了现代环境运动。然而，在二十世纪上半叶，污染和环境退化是美国大部分地区的普遍现象，诸如“金钱的气味”“美妙干净的煤烟”“上帝保佑它”“它是我们的命脉”“当地活动和进取心的指标”等说法都被用来描述空气污染。\n\
  \n就在此时，人力和畜力被电力、内燃机和核反应堆取代。与此同时，工业正以惊人的速度消耗自然资源。所有这些变化在第二次世界大战后开始以危险的速度升级。不久之后，在1962年夏末，一位名叫蕾切尔·卡森的海洋生物学家——畅销的海洋生命类书籍《寂静的春天》的作者——打开了……\n\
  \n\n向世界揭示了攻击环境的危险（Carson 1962）。也许正是从那时起，美国开始认真呼吁改革对自然的破坏以及针对这些问题的环境法限制。这一切始于1970年环保署的诞生。有关美国环境运动早期历史和美国技术的更多文献，感兴趣的读者可参考菲利普·沙贝科夫所著的《A\
  \ Fierce Green Fire》（1993）一书。这本杰出的著作，以及庞廷的《A Green History of the World》（1991），和露丝·科万所著的《A\
  \ Social History of American Technology》（1985），是任何从事或对环境感兴趣的人的“必读”之作。\n\n工业是现代社会经济发展的轴心——被誉为增长和发展的不可或缺的动力。另一方面，它已被确定为环境退化和污染的主要来源。因此，发展而不破坏、环境可持续性和可持续发展是我们时代的迫切需要。我们面临的问题是如何在不断提高的生活水平带来的好处与物理环境恶化以及生活质量下降所付出的成本之间取得平衡。过去，污染空气、水和土地的危险并未得到充分认识，但现在毫无疑问，这是一个令人极度担忧的问题。\n\
  \n日本著名的水俣病（1956年）、弗利克斯伯勒（1974年）、爱河运河（1978年）、三里岛事故（1979年）、博帕尔气体悲剧（1984年）、切尔诺贝利核反应堆事故（1986年）以及2008年田纳西河谷管理局金斯顿燃煤电厂有毒煤灰泄漏到埃莫里河事件提醒我们，工业化不仅对人类，而且对动物、水生生物和植被覆盖构成了严重威胁。一方面，工业化帮助我们提高了生活水平和质量，但另一方面它也恶化了我们的环境。因此，污染物在环境中的迁移转化通过人类活动，例如酸雨、烟雾、全球变暖、海洋酸化、野火、癌症，是工业化直接导致的最糟糕的污染形式。\n\
  \n工业以以下方式破坏环境并造成污染：\n\n- a) 工业使用自然资源，因为它破坏了自然并影响了自然环境。小麦、大米、大麦、玉米、棉花、树木、胶合板、橡胶、甘蔗、铁、煤、石油、天然气等都是食品加工、包装、造纸、服装和其他成品的自然资源。因此，工业需求的增加导致了对自然资源的过度开采和压力。\n\
  - b) 工业的残渣和副产品有无处理地排入水、空气和土地，污染水、空气和土地，影响空气质量、水生生物和地下水。\n- c) 工业使用的化石燃料如煤、煤油、柴油和核能以烟雾、烟灰、细颗粒物、烟雾、臭氧和放射性废物的形式污染空气。\n\
  - d) 噪音也是工业的主要副产品，会对人类健康造成噪音污染。\n- e) 工业废物，特别是危险废物和放射性废物，已成为一个重大的环境污染问题。\n\n## 2.6\
  \ 工业灾难\n\n### 2.6.1 博帕尔：世界上最严重的工业悲剧\n\n三十三年前，1984年12月2日晚，印度博帕尔联合碳化物农药厂发生事故，释放出至少30吨名为甲基异氰酸酯（MIC）的高毒气体，以及其他多种有毒气体。农药厂周围是贫民窟，导致当晚有超过60万人暴露在致命的云雾中。这些气体保持在低处，导致受害者喉咙和眼睛灼烧、恶心，并造成许多死亡。死亡人数估计从低至3,800人到高至16,000人不等，但政府目前的数字指的是估计有15,000人在此后多年中死亡。有毒物质仍然残留，30年后，许多暴露于气体的人所生育的孩子身体和精神残疾。几十年来，幸存者一直在为清理现场而斗争，但他们表示，当密歇根州的陶氏化学公司于2001年收购联合碳化物后，清理工作放缓了。人权组织表示，数千吨危险废物仍埋在地下，政府也承认该地区受到了污染。然而，并没有长期流行病学研究能够有力证明出生缺陷与饮用受污染的水直接相关。\n\
  \n### 2.6.1.1 当晚发生了什么！\n\n由于缺乏环境法规、执行和合规、维护和操作安全，博帕尔发生的灾难发生地工厂于1977年开始生产“卡巴ryl”。卡巴ryl主要用作杀虫剂。起初，产量为2500吨/年。这不是问题，因为工厂的设计产量为5000吨。20世纪80年代初，卡巴ryl销售不佳。因此，工厂的所有者开始削减成本。这包括雇佣更少的人、减少维护频率以及使用低等级钢材制成的零件。关闭工厂也在考虑之中。灾难发生时，由于市场上供过于求，工厂没有生产。\n\
  \n灾难发生是因为水进入了含有MIC的罐中。这引发了化学反应，导致大量二氧化碳等物质积聚。由此产生的反应使罐内温度升高至超过200°C（392°F）。压力超过了罐体所能承受的压力。罐上有控制压力的阀门。这些阀门在紧急情况下被触发，从而降低了压力。因此，大量有毒气体被释放到环境中。管道生锈了。铁管道中的锈使反应更快。罐内的所有内容物在大约两个小时内全部释放。水进入罐子是由于一系列事件。罐子维护不良。当进行清洁工作时，水可能进入罐子。来自印度博帕尔联合碳化物公司的MIC气体泄漏推动了环境法的发展以及赔偿数量原则的发展（Union\
  \ Carbide v. Union of India 1989）。\n\n### 2.6.1.2 泰姬陵酸雨袭击\n\n历史纪念碑泰姬陵在阿格拉因酸性气体而变黄，这些气体来自铸造厂、燃煤电厂、化工和危险工业以及炼油厂排放的硫氧化物（SOₓ）。这些工业排放的二氧化硫与大气中的氧气在潮湿和阳光存在下结合，形成了被称为“酸雨”的硫酸，影响了泰姬陵的大理石（Mehta\
  \ 1987）。\n\n### 2.6.1.3 恒河和亚穆纳河\n\n使圣河恒河和南部的金奈河水变毒的工业被发现是鞣革厂（Mehta 1988；Vellore\
  \ Citizen 1996）。在恒河污染案中，鞣革厂将未经处理的废水排入河流，在靠近坎普尔的地方，恒河水被发现高度有毒。在另一案件中，泰米尔纳德邦的帕拉尔河因鞣革厂排放用于皮革处理的化学品而严重污染，导致饮用水不可用。最近，印度最高法院下令关闭工业或将其从德里邦领土迁移，因为其未经处理的废水和污泥污染了圣河亚穆纳河（Hindustan\
  \ Times 2000；Times of India 2000）。\n\n### 2.6.1.4 弗利克斯伯勒\n\n1974年6月1日星期六，弗利克斯伯勒的Nypro（英国）工厂被一次大爆炸严重损坏。28名工人死亡，另外36人受伤。人们认识到，如果事故发生在工作日，伤亡人数会更多，因为主办公楼当时无人占用。场外后果导致53人受伤报告。周边地区的财产在不同程度上受损。\n\
  \n化工厂设计用于生产7万吨/年己内酰胺，即尼龙生产所需的原料。该工艺使用环己烷作为原料，并在六个催化反应器系列中在空气存在下将其氧化为环己醇。在工艺条件下，环己烷在混合减压后立即汽化，形成可燃环己烷蒸气与空气混合的云。发现反应器5在系列中使用20英寸管道的连接处不锈钢结构上有一个小裂缝，尽管反应器通常使用28英寸管道连接。临时管道部分未得到适当支撑，并在加压时破裂，释放出估计30吨环己烷形成大云。未知点火源导致云爆炸，夷平了整个工厂设施。随后的火灾在工厂燃烧了超过10天。事故本可以通过遵循适当的安全设计和操作程序来预防，包括减少现场可燃液体的库存（CCPS\
  \ 1993；Crowl and Louver 1990）。\n\n### 2.6.1.5 爱河运河悲剧\n\n简单地说，爱河运河是美国历史上最骇人听闻的环境悲剧之一。但这并不是最令人不安的事实。更糟糕的是，它不能被视为孤立事件。它可能再次发生——在美国任何地方——除非我们迅速采取行动防止它发生。\n\
  \n爱河运河原本本应是一个梦想社区的讽刺是残酷的。这一愿景属于该块土地以其命名的那个人——威廉·T·洛夫。洛夫认为，通过在尼亚加拉河上下游之间挖掘一条短运河，可以廉价发电，为他理想的城市的工业和家庭提供动力。\n\
  \n但尽管得到大量支持，洛夫的项目无法承受经济波动和尼古拉·特斯拉发现如何通过交流电经济地长距离传输电力的双重打击。到1910年，梦想破灭了。纪念洛夫希望的只剩下运河开工时留下的部分沟渠。在\n\
  \n\n20世纪20年代，一个真正的噩梦的种子就此埋下。这条运河被变成了一个市政和工业化学垃圾倾倒场。\n\n当然，如果选址得当、管理良好并受到监管，垃圾填埋场可以作为处置危险废物的一种环境可接受方法。拉夫运河（Love\
  \ Canal）将永远作为一个历史性的反面教材，展示着这种运营方式绝不能这样做。1953年，该物业的拥有者和运营者胡克化学公司（Hooker Chemical\
  \ Company）用泥土覆盖了运河，并以一美元的价格将其卖给了市政府。这是一笔糟糕的交易。20世纪50年代末，该地点上建起了约100户住宅和一所学校。也许它不是威廉·T·拉夫（William\
  \ T. Love）理想中的城市，但它是一个稳固的工人阶级社区。1978年8月1日，《纽约时报》头版报道的导语写道：“尼亚加拉瀑布，纽约州——在胡克化学公司停止使用这里的拉夫运河作为工业垃圾倾倒场二十五年后，82种不同的化合物（其中11种为疑似致癌物质）正通过土壤向上渗透，其桶装容器正在腐烂并将内容物泄漏到运河岸边如今现有的100户住宅和一所公共学校的后院及地下室中”。\n\
  \n在一篇为1978年2月《环境保护局期刊》（EPA Journal）撰写的文章中，我写道，关于一般的化学垃圾倾倒场，“尽管其中一些填埋场已经关闭，但它们可能仍像定时炸弹一样。”仅仅几个月后，拉夫运河事件就爆发了。触发这次爆发的是创纪录的降雨量。随后不久，泄漏开始发生。\n\
  \n腐蚀性的废物处置桶可以看到冲破后院的地面。树木和花园变黑并死亡。一个完整的游泳池从其地基中被顶起，漂浮在一小片化学物质的“海洋”上。居民向我指出了有毒物质的水坑。其中一些水坑在他们的院子里，一些在地下室里，还有其他的在学校操场上。到处都是淡淡的、令人窒息的气味。孩子们玩耍回来后，手上和脸上都有灼伤。\n\
  \n然后是出生缺陷。纽约州卫生部门正在对令人不安的高流产率以及迄今在该地区发现的五例出生缺陷病例进行调查。一名患有出生缺陷儿童的父亲说：“我听到媒体说这里*只有*五例出生缺陷病例，”他告诉我。“当你回到你在环境保护局（EPA）的同事那里时，请不要使用*‘只有’*五例这个短语。人们必须意识到这是一个很小的社区。这里的五例出生缺陷病例是令人恐惧的。”\n\
  \n拉夫运河地区有相当大比例的人正在被密切监测，因为检测到白细胞计数升高，这是白血病的可能前兆。当拉夫运河的居民最终从他们的家和社区撤离时，孕妇和婴儿被故意作为第一批被带出的人。\n\
  \n“我们知道他们向运河里倾倒化学品并将其覆盖，”一位长期居住在运河地区的妇女说，“但我们没想到这些化学品会侵入我们的家。我们非常担心孙辈及其后代。”这位女士四个孙辈中有两个患有出生缺陷。这些孩子出生并成长在拉夫运河社区。孙女出生时耳聋，患有腭裂，多一排牙齿，并有轻微的发育迟缓。孙子出生时患有眼部缺陷。\n\
  \n在渗入拉夫运河土壤并进入家庭的混合废物中，最普遍的一种化学物质之一是苯——一种已知的人类致癌物质，并且检测到了高浓度。但居民们更简单地描述了情况。“我到处都是这种病，”另一位居住在拉夫运河的男士说。他的女儿也患有先天缺陷。\n\
  \n8月7日，纽约州长休·凯里（Hugh Carey）向运河居民宣布，州政府将购买受化学品影响的住宅。在同一天，卡特总统批准了针对拉夫运河地区的紧急财政援助（这是首次为除“自然”灾害以外的事情批准的紧急资金），美国参议院批准了一项“国会意向”修正案，表示应提供联邦援助以缓解已发生的严重化学灾难。\n\
  \n到月底，98个家庭已经撤离。另外46个家庭找到了临时住所。不久之后，所有家庭都将被迁出污染最严重的地区——共有221个家庭已经搬迁或同意搬迁。州方数据显示，已提出超过200份房屋购买要约，总金额近700万美元。\n\
  \n现在正启动一项计划，实施技术程序，以完成这项看似不可能完成的拉夫运河地区解毒工作。该计划要求建造沟渠系统以从运河中排出化学品。这是一个困难的程序，我们祈祷它能取得一定程度的成功。对于本案中地方政府、州政府和联邦政府之间高度的合作，以及国会和总统迅速行动使资金可用的做法，我深感满意。\n\
  \n但故事并没有真正结束于此。恰恰相反。我们怀疑全美国有数百个化学垃圾倾倒场。与拉夫运河不同，很少有倾倒场位置如此接近人类居住区。但毫无疑问，这些旧的倾倒场中许多都是引信正在燃烧的定时炸弹——其内容物正在缓慢泄漏。下一个受害者可能是水源，或敏感的湿地。\n\
  \n各种有毒物质在我们的环境中存在得越来越普遍——这是一个事实，卡特总统称其为“现代时代最阴森的发现之一”。\n\n美国目前的化学品销售额超过令人难以置信的每年1120亿美元，流通的化学物质多达7万种。现在，拉夫运河可以被加入一个不断增长的涉及有毒物质的环境灾难列表中，范围从遭受神经疾病和癌症困扰的工业工人，到在哺乳期母亲乳汁中发现有毒物质。\n\
  \n通过其管理的国家环境计划，环境保护局正试图编织一系列国会法案来应对有毒物质问题。《清洁空气和水法》、《安全饮用水法》、《农药法》、《资源保护与回收法》、《有毒物质控制法》——每一项都是不可或缺的环节。\n\
  \n根据《资源保护与回收法》，环境保护局正提供拨款给各州，以帮助它们建立计划，确保安全处理和处置危险废物。作为此类计划的指导，我们正在努力确保各州的工业废物处置场清单包含对这些场所潜在危险来源的全面评估。\n\
  \n此外，美国环境保护局（USEPA）最近提出了一个系统，以确保每年在美国产生的3500多万吨危险废物（包括大多数化学废物）得到安全处置。危险废物将从产生源头到最终处置进行控制，目前导致对健康和环境造成严重威胁的危险做法将不再被允许。\n\
  \n虽然我们正采取这些积极措施确保危险废物得到安全管理，但关于先前处置废物引发的事故的责任问题仍然存在。这是一个缺失的环节。但毫无疑问，这个问题在未来会得到有效解决。关于责任的缺失环节，如果检测到与健康相关的危险，我们作为一个民族愿意花费多少来纠正局面？我们愿意接受多少风险？谁将为此买单？我们面临的一个主要问题是，这些场所的所有权往往在多年间发生转移，使得在事故情况下确定责任变得困难。目前没有可靠的机制来确定这种责任。\n\
  \n我们有能力实施智能且有效的控制措施，以显著减少此类环境风险。不幸的是，一场悲剧现在迫使我们决定我们为消除未来的“拉夫运河”所要达到的总体承诺水平。也不忘，没有任何人比拉夫运河的居民付出过更沉重的代价。\n\
  \n## 2.6.1.6 田纳西河流域管理局金斯敦燃煤电厂有毒粉煤灰泥浆泄漏事故\n\n2008年12月22日，田纳西河流域管理局（TVA）位于田纳西州哈里曼的金斯敦电厂发生Retention池（沉淀池）堤坝坍塌，释放出一混合物，包括水和粉煤灰，导致12户住宅被淹，溢入附近的沃茨巴尔湖（Watts\
  \ Bar Lake），污染了埃默里河（Emory River），并导致了一起火车事故。官员表示，4至6英尺厚的材料从池泄漏，覆盖了估计400英亩的相邻土地。一列向电厂运送煤炭的火车因无法在到达被洪水淹没的轨道前停下而卡住（White\
  \ 2008）。数百条死鱼顺流而下，漂浮在电厂下游。水质检测显示铅和铊水平升高（Knoxville News Sentinel 2008a, b）。\n\n最初，TVA估计有170万立方码的废料突破了储存设施。公司官员表示，该池中总共含有约260万立方码的泥浆。然而，该公司于12月26日修订了其估计值，当时发布了一项航空调查，显示540万立方码（10.9亿加仑）的粉煤灰从储存设施中释放出来（Knoxville\
  \ News Sentinel 2008a）。几天后，估计泄漏量增加到超过10亿加仑（CNN 2008）。泄漏规模比TVA声称在事故前池中所含的数量大，这一差异TVA无法解释（New\
  \ York Times 2008）。TVA的泄漏规模是阿拉斯加埃克森瓦尔迪兹号（Exxon Valdez）溢油事故的100倍，后者泄漏了1090万加仑的原油（Encyclopedia\
  \ of the Earth 2018），预计清理工作需要数周时间，耗资数千万美元（Knoxville News Sentinel 2008c）。根据TVA的说法，10天内共6英寸的降雨量和12华氏度的气温是导致土质堤坝失效的因素（Valley\
  \ Precipitation 2008）。\n\n40英亩的池子用于容纳燃煤电厂产生的灰烬（White 2008）。事故中释放的水和灰烬充满了有毒物质。每年煤炭制备过程产生的废料包含估计13吨汞、3236吨砷、189吨铍、251吨镉、2754吨镍和1098吨硒（Associated\
  \ Press 2008; Valley Precipitation 2008）。\n\n## 2.6.1.7 库雅荷加河大火\n\n库雅荷加河位于美国东北俄亥俄州，流入伊利湖。这条河之所以出名，是因为它污染如此严重，以至于在1969年“着火”了（图2.3）。这一灾难点燃了环境革命的火焰。就在那天，1969年6月22日，当驶过的火车火花点燃浸透油污的碎片时，库雅荷加河在克利夫兰附近燃烧起来\n\
  \n\n\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_60_0.png)\n\n图 2.3 凯霍加河起火。\n\n\
  漂浮在水面上。到 1969 年，凯霍加河的情况在美国并非孤例。流入马里兰州巴尔的摩的一条河流于 1906 年 6 月 8 日发生火灾（CPD 1926）。在费城，施基尔河在\
  \ 1950 年代燃烧（Kernan 1958）。纽约州北部的布法罗河在 1960 年代燃烧（UPI 1984）。密歇根州迪尔伯恩的红河反复燃烧（US 1974）。\n\
  \n那么，为什么凯霍加河大火是美国水污染控制史上的一个开创性事件？因为它成为了联邦政府在水污染控制中角色转变的催化剂。尽管联邦政府拥有控制水污染的有力工具，例如\
  \ 1899 年的《河流与港口法》和 1965 年的《水质法》，但各州和城市仍只能自顾不暇。燃烧的凯霍加河成为了美国日益严峻的环境问题的象征，并引发了广泛的改革，包括《清洁水法》（CWA）（1972\
  \ 年）的通过以及联邦和州环境保护机构的建立。\n\n但这一事件本身并未完全配得上其名声。它不是凯霍加河的第一场火灾，甚至也不是最严重的一场，在此之前该河至少已经燃烧过十几次。而且，在\
  \ 1969 年大火发生时，工业倾倒问题已经在改善。事实是，1969 年凯霍加河大火并非象征国家河流状况可能变得多么糟糕，而是象征它们曾经多么糟糕。1969 年的大火不是美国工业河流第一次起火，而是最后一次。这一事件推动了美国环保运动的发展（Adler\
  \ 2003）。\n\n## 2.6.1.8 伦敦大烟雾\n\n1952 年大烟雾是一场严重的空气污染事件，影响了英国首都伦敦，发生在 1952 年 12 月初。一段寒冷天气，结合反气旋和无风条件，将空气中的\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_60_1.png)\n\n图 2.4 展示低能见度的纳尔逊塔。\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_60_2.png)\n\
  \n图 2.5 伦敦巴特斯海煤炭电厂的污染源。\n\n污染物——主要来自煤炭的使用——收集在一起，在城市上方形成了一层厚厚的烟雾。它从 1952 年 12 月\
  \ 5 日星期五持续到 12 月 9 日星期二，随后在天气变化时迅速消散。\n\n它通过降低能见度甚至侵入室内区域造成了重大干扰，比过去经历过的烟雾事件（被称为“豌豆汤”）要严重得多。然而，随后几周内的政府医疗报告估计，截至\
  \ 12 月 8 日，有 4000 人直接死于烟雾，另有 100,000 人因烟雾对人体呼吸道的影响而生病。最近的研究表明，总死亡人数要高得多，约为 12,000\
  \ 人（见图 2.4 和图 2.5）（《1952 年大烟雾》 2014）。\n\n当时的首相温斯顿·丘吉尔坚决认为烟雾会过去，只是简单地将其视为一次“天气事件”。自\
  \ 13 世纪以来，伦敦一直遭受空气质量恶化的困扰（Brimblecombe 1976），并在 17 世纪恶化（The Observer 2002），但大烟雾被认为是英国历史上最严重的空气污染事件，并且在环境影响研究、政府监管以及公众对空气质量与健康关系认知的方面具有最重要的意义（Bell\
  \ et al. 2004; The Observer 2002）。它导致了一系列实践和法规的改变，包括 1956 年《清洁空气法》。\n\n## 2.7 环境法\n\
  \n环境法，又称环境和自然资源法，是一个集体术语，描述了旨在处理人类活动对自然环境影响的条约、法令、法规、普通法和习惯法的网络。核心环境法制度旨在应对环境污染。一个相关但不同的监管制度集，现在受到环境法律原则的强烈影响，专注于特定自然资源的管理，如森林、矿产或渔业。其他领域，如环境影响评估，可能无法整齐地归入其中任何一类，但仍是环境法的重要组成部分。\n\
  \n在东欧、前苏联的许多地区，以及亚洲、非洲和南美洲的发展中国家，污染状况至今仍然存在。全球和区域环境问题越来越多地成为国际法的主题。ISO 是国际标准化组织的缩写。它是一个成立于\
  \ 1947 年的全球性项目，旨在促进国际制造、贸易和通信标准的开发。ISO 成员包括 100 多个国家。\n\n### 2.7.1 环境法的历史\n\n在历史上，旨在自觉保护环境（为了其自身或人类的享受）的法律立法早期例子随处可见。在普通法中，主要保护体现在妨害法中，但这只允许在对土地造成损害时提出私人诉讼要求损害赔偿或禁令。因此，猪圈散发的气味（Aldred’s\
  \ Case 1610）、倾倒垃圾的严格责任（R v. Stephens 1866）或水坝爆炸造成的损害（Rylands v. Fletcher, 1868）。然而，私人执法受到了限制，并被认为远远不足以应对主要的环境威胁，特别是对公共资源的威胁。在\
  \ 1858 年“大恶臭”期间，污水倾倒进泰晤士河，在夏季的高温下气味难闻至极，议会不得不疏散。讽刺的是，1848 年《大都会下水道委员会法》允许大都会下水道委员会封闭城市周围的污水坑，试图进行“清理”，但这只是导致人们污染河流。在\
  \ 19 天内，议会通过了一项进一步的法律，以建造伦敦污水处理系统。伦敦还遭受了严重的空气污染，这在 1952 年的“大烟雾”中达到了顶峰，进而引发了其自身的立法回应：1956\
  \ 年《清洁空气法》。基本监管结构是为家庭和企业（特别是燃煤）设定排放限值，并由检查机构执行合规。\n\n尽管有早期的类似物，“环境法”作为一个独立且独特的法律体系的概念是\
  \ 20 世纪的发展（Lazarus 2006）。认识到自然环境是脆弱的，需要特殊的法律保护，将这些认识转化为法律结构，将这些结构发展为更广泛的“环境法”体系，以及环境法对自然资源法的强烈影响，直到\
  \ 1960 年代左右才出现。当时，众多影响因素——包括对生物圈统一性和脆弱性的认识日益增强；对工业活动对自然资源和人类健康影响的公众关注增加；监管国家力量的增强；以及更广泛地，环境主义作为一种政治运动的兴起和成功——汇聚在一起，在相对较短的时间内产生了一大堆新的法律。虽然环境法的现代历史充满了持续的争议，但到\
  \ 20 世纪末，环境法已经确立为世界上所有发达国家、许多发展中国家以及国际法更大项目的一部分。\n\n## 2.8 污染控制法律\n\n### 2.8.1 空气质量法\n\
  \n工业空气污染，现由空气质量法监管：\n\n空气质量法管理空气污染物向大气中的排放。空气质量法的一个专门子集管理建筑物内部的空气质量。空气质量法通常专门设计通过限制或消除空气污染物浓度来保护人类健康。其他倡议旨在解决更广泛的生态问题，例如限制影响臭氧层的化学品，以及解决酸雨或气候变化的排放交易计划。监管工作包括识别和分类空气污染物，设定可接受的排放限值，并规定必要或适当的缓解技术。\n\
  \n### 2.8.2 水质法\n\n典型的雨水排放口，受水质法管辖：\n\n水质法管理污染物向水资源的排放，包括地表水、地下水和储存的饮用水。一些水质法，例如\n\
  \n\n\n饮用水法规可能仅参考人类健康而设计。许多其他法规，包括对水资源化学、物理、放射性和生物特性改变的限值，也可能反映了更广泛保护水生生态系统的努力。监管工作可能包括识别和分类水污染物、规定水资源中可接受的污染物浓度，以及限制来自排污源的污染物排放。监管领域包括污水处理和处置、工业和农业废水管理，以及建筑工地和城市环境地表径流的控制。\n\
  \n## 2.8.3 废物管理法\n\n依据废物管理法运营的市政填埋场：\n\n废物管理法规范各类废物的运输、处理、储存和处置，包括城市固体废物、危险废物、核废物等多种类型。废物法律通常旨在最小化或消除废物以可能造成生态或生物伤害的方式不受控制地扩散到环境中，并包括旨在减少废物产生、促进或强制废物回收的法律。监管工作包括识别和分类废物类型，并强制规定运输、处理、储存和处置实践。\n\
  \n## 2.8.4 污染物清理法\n\n受环境清理法管辖的溢油应急响应：\n\n环境清理法规范从环境介质（如土壤、沉积物、地表水或地下水）中去除污染或污染物的行为。与污染控制法不同，清理法旨在应对环境污染的事后处理，因此通常不仅需要定义必要的响应行动，还要明确负责实施（或支付）此类行动的责任方。监管要求可能包括关于应急响应、责任分配、场地评估、补救调查、可行性研究、补救行动、补救后监测和场地再利用的规则。\n\
  \n## 2.8.5 化学品安全法\n\n化学品安全法规范人类活动中的化学品使用，特别是现代工业应用中的人造化学品。与面向媒介的环境法律（如空气或水质法律）相比，化学品控制法律旨在管理（潜在的）污染物本身。监管工作包括禁止消费品中的特定化学成分（如塑料瓶中的双酚A）和监管农药。\n\
  \n## 2.8.6 水资源法\n\n依据水资源法运行的灌溉沟渠：\n\n水资源法规范水资源的所有权和使用，包括地表水和地下水。监管领域可能包括水资源保护、使用限制和所有权制度。\n\
  \n## 2.8.7 矿产资源法\n\n矿产资源法涵盖几个基本主题，包括矿产资源的所有权以及谁可以开采它们。采矿还受到有关矿工健康和安全以及采矿环境影响的各类法规的影响。\n\
  \n## 2.8.8 森林资源法\n\n受林业法监管的木材作业：\n\n林业法规范指定森林土地上的活动，最常见的是关于森林管理和木材采伐。附属法律可能规范林地收购和规定焚烧行为。森林管理法通常采用管理政策，例如多种用途和可持续产量，用以管理公共森林资源。政府机构通常负责规划和实施公共林地上的林业法律，并可能参与森林清查、规划、保护以及木材销售的监督。更广泛的倡议可能旨在减缓或逆转森林砍伐。\n\
  \n## 2.8.9 野生动植物保护法\n\n野生动物法律规范人类活动对野生动物的潜在影响，无论是直接对个体或种群的影响，还是通过栖息地退化产生的间接影响。类似的法律可能也适用于保护植物物种。此类法律可能完全是为了保护生物多样性而制定，或者作为保护因其他原因被认为重要的物种的手段。监管工作可能包括设立特殊保护地位、禁止杀害、伤害或干扰受保护物种、诱导和支持物种恢复的努力、建立野生动物保护区以支持保护，以及禁止贩运物种或动物部位以打击偷猎。\n\
  \n## 2.8.10 渔业和狩猎法\n\n渔业和狩猎法规范追逐、捕获或杀死某些鱼类和野生动物（猎物）的权利。此类法律可能限制捕鱼或狩猎的日期、每人捕获的动物数量、捕获的物种，或使用的武器或渔具。此类法律可能旨在平衡保存和捕获的双重需求，并管理环境和鱼类及野生动物的种群。狩猎法可以提供法律框架来收取许可证费用和其他资金，这些资金用于资助保护工作，以及获取用于野生动物管理实践的捕获信息。\n\
  \n## 2.8.11 原则\n\n环境法的发展是对影响整个世界的问题的新兴意识和关注的回应。虽然法律是零散地并出于多种原因发展的，但已经做出了一些努力来识别环境法整体的关键概念和指导原则（UNEP\
  \ 1992）。下面讨论的原则并非详尽无遗，也未被普遍认可或接受。尽管如此，它们代表了理解世界各地环境法的重要原则。\n\n## 2.9 资源可持续性\n\n\
  ### 2.9.1 环境影响评价\n\n环境影响评价是对计划、政策、规划或实际项目在决定推进拟议行动之前对其环境后果（包括正面和负面）的评估。在此背景下，当应用于个人或公司的实际项目时，通常使用术语“环境影响评价”；而“战略环境评价”则适用于最常由国家组织提出的政策、计划和规划（Eccleston\
  \ 2017）。环境评价可能受有关公众参与和决策记录的行政程序规则管辖，并可能受到司法审查。\n\n### 2.9.2 可持续发展\n\n联合国环境规划署（UNEP\
  \ 1986, 1992, 2001, 2006, 2013）将可持续发展定义为“既满足当代人的需求，又不损害后代人满足其自身需求能力的发展”，可持续发展可以与“整合”概念（发展不能与可持续性孤立地考虑）和“相互依存”概念（社会和经济发展与环境保护相互依存）一起考虑。规定环境影响评价并要求或鼓励发展最大限度地减少环境影响的法规可依据这一原则进行评估。\n\
  \n现代可持续发展概念是1972年联合国人类环境会议（斯德哥尔摩会议）的讨论主题，也是1983年世界环境与发展委员会（WCED，或称布伦特兰委员会）的驱动力。1992年，第一次联合国地球峰会产生了《里约宣言》，其中第3条原则写道：“发展权必须得到实现，以公平满足当代和后代的发展与环境需求。”自那时起，可持续发展一直是国际环境讨论的核心概念，包括在可持续发展世界首脑会议（2002年地球峰会）和联合国可持续发展大会（2012年地球峰会）上。\n\
  \n### 2.9.3 公平\n\n更多信息：代际公平\nUNEP将其定义为包括代际公平——“后代人享有公平水平的共同遗产的权利”——和代内公平——“当代所有人公平获取当代对地球自然资源权益的权利”。环境公平认为当代人有义务考虑活动的长期影响，并采取行动维持全球环境和资源基础以供后代使用。污染控制和资源管理法律可依据这一原则进行评估。\n\
  \n### 2.9.4 跨界责任\n\n在国际法背景下定义为保护本国环境并防止对邻国环境造成损害的义务，UNEP视国际层面的跨界责任为主权国家权利的一种潜在限制。旨在限制对人类健康和环境施加外部性的法律可依据这一原则进行评估。\n\
  \n### 2.9.5 公众参与和透明度\n\n被认定为“负责任的政府……工业企业”和一般组织的必要条件，公众参与和透明度是\n\n\n\n由联合国环境规划署提出，要求“有效保护人类持有和表达意见以及寻求、接收和传播思想的权利……有权获取政府和工业机构持有的关于自然资源可持续利用和环境保护的经济和社会政策的适当、可理解和及时的信息，而不对申请人施加不当的财务负担，并对隐私和商业保密给予充分保护”，以及“有效的司法和行政程序”。这些原则体现在环境保护署、要求公布和获取相关环境数据的法律以及行政程序中。\n\
  \n## 2.9.6 谨慎原则\n\n环境法中最常见也最具争议的原则之一，《里约宣言》对谨慎原则的表述如下：\n\n为了保护环境，各国应根据其能力广泛应用预防性方法。当存在严重或不可逆转损害的威胁时，缺乏充分的科学确定性不应作为推迟采取具有成本效益的措施以防止环境退化的理由。\n\
  \n该原则可能在任何关于环境监管必要性的辩论中发挥作用。\n\n## 2.9.7 预防\n\n预防的概念……或许更可被视为一个总体目标，它催生了多种法律机制，包括对环境损害的事先评估、设定运营条件和违反条件后果的许可或授权，以及战略和政策的制定。排放限值和其他产品或工艺标准、最佳可行技术的应用以及类似技术都可以被视为预防概念的应用。\n\
  \n## 2.10 污染者付费原则\n\n污染者付费原则代表的理念是“经济活动的环境成本，包括防止潜在损害的成本，应内部化，而不应强加于整个社会。”所有与环境修复和遵守污染控制法规的成本责任相关的问题都涉及这一原则。\n\
  \n## 2.11 理论/环境法辩论\n\n环境法是持续争议的源泉。关于环境监管的必要性、公平性和成本的辩论仍在继续，以及关于采用法规还是市场解决方案来实现甚至已达成一致的目标是否恰当的争论。\n\
  \n科学不确定性的指控助长了关于温室气体监管的持续辩论，也是关于是否禁止特定农药的辩论中的主要因素。在科学已得到充分证实的情况下，经常发现企业故意隐瞒或歪曲事实，或制造混乱（Oreskes\
  \ and Conway 2010）。\n\n受监管行业以成本为由反对环境监管的情况非常普遍（Pizer and Kopp 2003）。对环境问题进行成本效益分析存在困难。很难量化健康生态系统、清洁空气或物种多样性等环境价值。许多环保人士对经济与生态对立的回应可由地球日创始人、前参议员盖洛德·尼尔森概括：“经济是环境的完全子公司，而不是相反”（Nelson\
  \ et al. 2002）。此外，许多人认为环境问题具有伦理或道德维度，这将超越财务成本。即便如此，仍有一些努力正在进行，以系统地承认环境成本和资产，并在经济上对其进行适当核算。\n\
  \n虽然受影响的行业在反对监管时引发争议，但也有许多环保人士和公益团体认为现行法规不足，并倡导更强有力的保护（Hiss 2014；Stein and Beckel\
  \ 2004）。环境法会议——例如在俄勒冈州尤金举行的年度公共利益环境法会议——通常具有这一重点，同时也将环境法与阶级、种族和其他问题联系起来。\n\n另一个辩论是环境法在多大程度上对所有受监管方公平。例如，研究人员\
  \ Preston Teeter 和 Jorgen Sandberg 强调，较小的组织往往会因环境法规而承担不成比例的更大成本，这最终可能为新企业创造额外的进入壁垒，从而扼杀竞争和创新（Teeter\
  \ and Sandberg 2017）。\n\n### 2.11.1 环境影响声明和 NEPA 流程\n\n根据美国环境法，环境影响声明（EIS）是《国家环境政策法》（NEPA）要求对某些\n\
  \n“显著影响人类环境质量”的行动（NEPA 1969）提交的文件。EIS 是决策工具。它描述了拟议行动的正面和负面环境影响，通常还列出一个或多个可替代的行动方案，可在\
  \ EIS 中描述的行动之外选择。美国多个州政府要求对某些行动提交类似 EIS 的文件给州政府。\n\n### 2.11.2 NEPA 的目的\n\nNEPA\
  \ 的目的是通过向联邦机构领导人和公众提供“关于重大环境影响的详细资料”来促进联邦机构的知情决策（Robertson v. Methow Valley Citizens\
  \ Council 1989）。NEPA 是第一部创建全面方法来同时评估潜在和现有环境风险的立法。它还鼓励参与环境决策的所有行为者之间的沟通与合作，包括政府官员、私营企业和公民（Fellman\
  \ 2013）。\n\n特别是，EIS 充当执行机制，确保联邦政府遵守 NEPA 中概述的目标和政策。EIS 应在机构开始规划开发或收到开发提案后尽快及时编制。该声明应采用跨学科方法，以便准确评估拟议开发的物理和社会影响（EIS\
  \ 2010）。在许多情况下，即使行动并非由联邦机构专门发起，也可能被视为受 NEPA EIS 要求约束。这些因素可能包括获得联邦资金、联邦许可或授权，或受联邦控制的行动（Eccleston\
  \ 2008）。\n\nEIS 通常有四个部分（Eccleston 2014）：\n\n- 1) 包括拟议行动目的和需求声明的介绍。\n- 2) 受影响环境的描述。\n\
  - 3) 拟议行动的替代方案范围。替代方案被认为是 EIS 的“核心”。\n- 对每种可能替代方案的环境影响进行分析。本节涵盖以下主题：\n  - 对受威胁或濒危物种的影响\n\
  \  - 空气和水质影响\n  - 对历史和文化遗址的影响，特别是对土著人民具有重要意义的遗址。\n  - 对当地社区的社会和经济影响，通常包括对可用住房存量、经济对企业的影响、财产价值、美学和受影响区域内的噪音等属性的考虑。\n\
  \  - 对每个替代方案的成本分析，包括减轻预期影响的成本，以确定拟议行动是否是对纳税人资金的审慎使用。\n\n## 2.12 国际法\n\n众所周知，联合国人类环境斯德哥尔摩会议是国际舞台上保护日益恶化环境的里程碑。该会议强调人类改造其周围环境的能力必须得到明智利用。错误和不明智的使用可能对人类和人类环境造成无法估量的危害。会议建议发展中国家必须努力平衡其优先事项与遏制人口增长的需要。此外，会议确定了各国应采取并制定环境保护法律的领域和原则。这些原则已被纳入《斯德哥尔摩宣言》（British\
  \ Institute of International and Comparative Environmental Law 1992；Caldwell 1996；Koivurova\
  \ 2014；Muralikrishna and Manickam 2017）。在此过程中，存在环境法的国家和国际维度。\n\n全球和区域环境问题越来越多地成为国际法的主题。关于环境问题的辩论涉及国际法的核心原则，并已成为众多国际协定和宣言的主题（见附录\
  \ B）。\n\n习惯国际法是国际环境法的重要渊源。这些是国家作为惯例遵循的规范和规则，其普遍性足以约束世界各国。当一项原则成为习惯法时并不明确，许多国家提出了不愿受约束的论点。与环境相关的习惯国际法示例包括有义务及时警告其他国家关于可能使另一国或多国暴露于其中的环境性质事件和环境损害，以及《斯德哥尔摩宣言》第\
  \ 21 条原则。\n\n众多具有法律约束力的国际协定涵盖了广泛的问题领域，从陆地、海洋和大气污染到野生动物和生物多样性保护。国际环境协定通常是多边（有时是双边）条约（又称公约、协定、议定书等）。议定书是基于主要条约制定的附属协定。它们存在于国际法的许多领域，但\n\
  \n议定书在环境领域尤其有用，可通过它们定期纳入最新的科学知识。它们也使各国能够就一个框架达成协议，而如果每个细节都要事先商定，这一框架将引发争议。国际环境法中最广为人知的议定书是《京都议定书》，其源自《联合国气候变化框架公约》。\n\
  \n虽然提议、争论、商定并最终通过现有国际协定的机构因协定而异，但某些会议尤为重要，包括1972年联合国人类环境会议、1983年世界环境与发展委员会、1992年联合国环境与发展会议以及2002年可持续发展世界首脑会议。多边环境协定有时会设立一个负责执行该协定的国际组织、机构或机关。主要例子有《濒危野生动植物种国际贸易公约》（CITES）和国际自然保护联盟。\n\
  \n国际环境法还包括国际法院和法庭的判决意见。虽然数量不多且权限有限，但这些裁决在法律评论者中分量很重，对国际环境法的发展也相当有影响。国际裁决中最大的挑战之一是确定对环境损害的充分赔偿（Hardman\
  \ Reis 2011）。这些法院包括国际法院（ICJ）、国际海洋法法庭、欧洲法院、欧洲人权法院以及其他区域条约法庭。\n\n## 2.12.1 非洲\n\n\
  据国际环境合规与执法网络称，非洲的主要环境问题是“干旱和洪水、空气污染、森林砍伐、生物多样性丧失、淡水供应、土壤和植被退化以及普遍贫困。”美国环境保护局（USEPA）则关注“日益严重的城市和工业污染、水质、电子废物以及炊事炉灶产生的室内空气污染。”他们希望在污染的影响污染非洲环境乃至全球环境之前，就污染问题提供足够的援助。通过这样做，他们打算“保护人类健康，特别是儿童和穷人等弱势群体”（EPA\
  \ 2012）。为了实现这些目标，美国环保局的项目侧重于加强执行环境法律的能力以及公众对这些法律的遵守。其他项目则致力于制定更强有力的环境法律、法规和标准。\n\
  \n## 2.12.2 亚洲\n\n亚洲环境合规与执法网络（ACECN）是16个亚洲国家之间的一项协议，致力于加强亚洲在环境法方面的合作。这些国家包括柬埔寨、中国、印度尼西亚、印度、马尔代夫、日本、韩国、马来西亚、尼泊尔、菲律宾、巴基斯坦、新加坡、斯里兰卡、泰国、越南和老挝人民民主共和国（ACECN\
  \ 2018）。\n\n## 2.12.3 欧洲联盟\n\n欧盟就环境问题发布在整个欧盟都有效的次级立法（所谓条例），以及许多必须由28个成员国（国家）转化为国家法律的指令。例如关于执行《濒危野生动植物种国际贸易公约》的（EC）第338/97号条例，以及Natura\
  \ 2000网络——自然和生物多样性政策的核心，由《鸟类指令》（79/409/EEC，后改为2009/147/EC）和《栖息地指令》（92/43/EEC）构成，该网络由遍布欧洲的多个特别保护区（SAC，与《栖息地指令》相关）和特殊保护区域（SPA，与《鸟类指令》相关）组成。\n\
  \n欧盟立法由《欧盟运作条约》第249条管辖。共同欧盟立法的议题如下：\n\n- 气候变化\n- 空气污染\n- 水保护与管理\n- 废物管理\n- 土壤保护\n\
  - 自然、物种和生物多样性的保护\n- 噪声污染\n- 与第三国（非欧盟成员国）的环境合作\n- 民事保护\n\n## 2.12.4 中东\n\n美国环境保护局正在与中东国家合作，以改善“环境治理、水污染和水安全、清洁燃料和车辆、公众参与以及污染防治。”\n\
  \n## 2.12.5 大洋洲\n\n大洋洲区域的主要环境问题担忧是“非法排放空气和水污染物、非法采伐/木材贸易、非法运输危险废物，包括电子废物和待拆除的船只，以及机构结构不足/缺乏执法能力。”太平洋区域环境方案秘书处（SPREP）是一个国际组织，成员包括澳大利亚、库克群岛、斐济、法国、基里巴斯、马绍尔群岛、瑙鲁、新西兰、纽埃、帕劳、巴布亚新几内亚、萨摩亚、所罗门群岛、汤加、图瓦卢、美国和瓦努阿图。设立SPREP是为了协助改善和保护环境，并确保子孙后代实现可持续发展（SPREP未注明日期；Taylor等人，2013年）。\n\
  \n## 2.12.6 澳大利亚\n\n1999年《环境保护与生物多样性保护法》是澳大利亚政府环境立法的核心。它建立了“保护和管理国家和国际重要的植物、动物、生态群落和遗产地的法律框架”（EPBC\
  \ 1999）。它还把重点放在保护世界遗产地、国家遗产地、国际重要湿地、国家受威胁物种和生态群落、迁徙物种、联邦海洋区域、大堡礁海洋公园以及核活动周围的环境上（EPBC\
  \ 1999）。联邦诉塔斯马尼亚案（1983），又称“塔斯马尼亚水坝案”，是澳大利亚环境法中最具影响力的案件（Commonwealth v Tasmania 1983）。\n\
  \n## 2.12.7 巴西\n\n巴西政府于1992年成立了环境部，以制定更好的环境保护战略、可持续地利用自然资源并执行公共环境政策。环境部对涉及环境、水资源、保护以及涉及亚马孙的环境项目的政策拥有管辖权。\n\
  \n## 2.12.8 加拿大\n\n《环境部法》在加拿大政府中设立了环境部以及环境部长一职。其职责包括“保护和改善自然环境的质责，包括水、空气和土壤质量；可再生资源，包括候鸟和其他非家养动植物；水；气象学”（Department\
  \ of the Environment Act 1985/2009）。《加拿大环境保护法》是加拿大环境立法的主要部分，于2000年3月31日实施。该法着眼于“通过预防污染和保护环境与人类健康来促进可持续发展。”其他主要联邦法规包括《加拿大环境评估法》和《物种风险法》。当省和联邦立法发生冲突时，联邦立法优先；尽管如此，各省可以制定自己的立法，例如安大略省的《环境权利法案》和《清洁水法》（1985年）。\n\
  \n## 2.12.9 中国\n\n据美国环境保护局称，“中国近年来以极大的决心制定、实施和执行健全的环境法律框架。中国官员在有效实施法律、明确国家和省级政府的作用以及加强其法律体系的运作方面面临严峻挑战”（EPA\
  \ Collaboration with China 2017）。爆炸性的经济和工业增长导致了严重的环境退化，中国目前正在制定更严格的法律控制措施（McElwee\
  \ 2011）。中国社会与自然环境的和谐被视为一项日益重要的政策优先事项（NRDC 2014; Pettit 2014; Stern 2013; Wang 2013）。\n\
  \n## 2.12.10 厄瓜多尔\n\n随着2008年《宪法》的颁布，厄瓜多尔成为世界上第一个将自然权利写入法律的国家。《宪法》，特别是第10条和第71至74条，承认生态系统存在和繁荣的不可剥夺权利，赋予人们代表生态系统请愿的权利，并要求政府纠正侵犯这些权利的行为。这种权利方法是对传统环境监管体系的突破，传统体系将自然视为财产，并使环境退化合法化并加以管理，而不是加以预防（CELDF\
  \ 2017）。\n\n厄瓜多尔宪法中关于自然权利的条款是对政治、经济和社会现象综合作用的回应。厄瓜多尔与石油工业的侵害历史，最著名的是针对雪佛龙的集体诉讼，以及基于开采的经济和新自由主义改革未能带来经济\n\
  \n\n繁荣给该地区带来了新左翼政权的当选，由拉斐尔·科雷亚总统领导，并引发了对新的发展方式的需求。与这一需求相呼应，“Buen Vivir”，即美好生活——关注社会、环境和精神财富而非物质财富——的原则在公民中变得流行，并被纳入新宪法（Gudynas\
  \ 2011）。\n\n原住民群体的影响，“Buen Vivir”概念即源于此，在宪法理想的形成中也发挥了作用，促进了自然权利作为其文化和“Buen Vivir”概念化的基本原则的纳入（Becker\
  \ 2011）。\n\n### 2.12.11 埃及\n\n《环境保护法》概述了埃及政府的责任，即“准备与环境管理相关的草案立法和法令，在国家和国际上收集有关环境状况的数据，准备有关环境状况的定期报告和研究，制定国家计划及其项目，为新的和城市地区准备环境概况，并设定用于规划其发展的标准，以及准备一份提交给总统的年度环境状况报告”（Ministry\
  \ of Environment Egyptian Environmental Affairs 2009）。\n\n### 2.12.12 德国\n\n自1994年11月15日起，环境保护已被确立为德国基本法第20a条规定的国家目标。环境保护及其目标因此获得了宪法地位。所有国家机构——尤其是立法机构——必须“也铭记[其]对子孙后代的责任”并保护环境（Seider\
  \ 2010）：\n\n- 自然保护与环境护理法（Gesetz über Naturschutz und Landschaftspflege – Bundesnaturschutzgesetz\
  \ – BNatSchG）\n- 因空气污染、噪音等造成的环境损害保护法（Gesetz zum Schutz vor schädlichen Umweltauswirkungen\
  \ durch Luftverunreinigungen, Geräusche, Erschütterungen und ähnliche Vorgänge –\
  \ Bundes-Immissionsschutzgesetz – BImSchG）\n- 饮用水质量条例（Trinkwasserverordnung – TrinkwV）\n\
  - 土壤保护条例（Bundesbodenschutzgesetz – BBodSchG）\n- 废物管理条例（Kreislaufwirtschaftsgesetz\
  \ – KrwG）\n- 水资源利用条例（Wasserhaushaltsgesetz – WHG）\n\n#### 2.12.12.1 在德国开展业务的环境规则：法律要求\n\
  \n联邦和州层面的环境法通常由各州实施。环境事务的最高国家机构是联邦环境、自然保护和核安全部。16个州也有各自的环境部。\n\n联邦环境部和各州环境部汇编其职权范围内的所有法令和法规。它分为以下领域：一般环境保护；废物管理；化学品法；可再生能源/气候保护；水资源保护；排放保护；核安全/放射性防护；自然和景观保护；化学品法（危险物质保护法）；化学品禁止条例；危险物质条例；以及化学品处罚条例。\n\
  \n### 2.12.13 印度\n\n在印度，环境法由《环境保护法》（EPA, India），1986年（《环境法》1986年；Upadhyay 2012）管辖。该法由中央污染控制委员会（CPCB）和众多州污染控制委员会（SPCBs）执行。除此之外，还有专门为保护水、空气、野生动物等而制定的单独立法。此类立法包括以下内容：\n\
  \n- 《水（防止和控制污染）法》，1974年\n- 《水（防止和控制污染）附加税法》，1977年\n- 《森林（保护）法》，1980年\n- 《空气（防止和控制污染）法》，1981年\n\
  - 《空气（防止和控制污染）（联邦领地）规则》，1983年\n- 《生物多样性法》，2002年和《野生动物保护法》，1972年\n- 《电池（管理与处理）规则》，2001年\n\
  - 《再生塑料、塑料制造和使用规则》，1999年\n- 根据2010年《国家绿色法庭法》设立的国家绿色法庭对涉及实质性环境问题的所有环境案件以及受《水（防止和控制污染）法》1974年涵盖的法案拥有管辖权。\n\
  - 《水（防止和控制污染）附加税规则》，1978年\n- 《恒河行动计划》，1986年\n- 《森林（保护）法》，1980年\n- 《公共责任保险法》，1991年和《生物多样性法》，2002年。《印度野生动物保护法》1972年所涵盖的法案不属于国家绿色法庭的管辖范围。上诉可以向印度最高法院提出（《印度野生动物保护法》1972年）\n\
  - 《控制危险废物越境转移及其处置的巴塞尔公约》，1989年及其议定书\n- 《危险废物（管理和处理）修正规则》，2003年（Malik and Malik 2015）\n\
  \n自20世纪70年代以来，该国已发展出一个广泛的环境立法网络。环境森林部（MOEF）和污染控制委员会（即CPCB和SPCBs）共同构成了该部门的监管和行政核心。\n\
  \n还制定了政策框架以补充立法规定。环境森林部于1992年出台了《污染防治政策声明》和《国家保护战略与环境与发展政策声明》，以开发和促进保护和改善环境的举措。环境行动计划（EAP）于1993年制定，旨在改善环境服务并将环境考虑纳入发展计划。\n\
  \n政府还采取了其他措施来保护和保存环境。已经形成了多个部门特定政策，这些政策在相关章节中有详细讨论。这仅试图突出保护环境的立法举措。\n\n## 2.13 印度环境保护的法律和监管框架\n\
  \n### 2.13.1 引言\n\n多年来，随着环境意识的传播，人们对环境质量与经济增长之间存在权衡的传统看法发生了变化，人们开始相信两者必然是互补的。当前对环境的关注并非新事物——环境考虑一直是印度文化不可分割的一部分。对自然资源保护和可持续利用的需求已在超过3000年的印度经典文献中表达，并在宪法、立法、政策框架以及国家的国际承诺中得到体现。\n\
  \n早在印度1947年独立之前，就已存在若干环境立法，但建立完善框架的真正动力是在联合国人类环境会议（斯德哥尔摩，1972年）之后才出现。在该宣言的影响下，1972年在科学技术部内设立了国家环境政策和规划委员会。该委员会后来于1985年发展成为环境和森林部（MOEF），今天是印度监管和确保环境保护的最高行政机构。斯德哥尔摩会议后，1976年通过第42次修正案对环境问题给予了宪法授权，将其纳入国家政策指导原则和基本权利与义务。\n\
  \n### 2.13.2 印度环境保护立法\n\n#### 2.13.2.1 水\n\n饮用水等水质标准由印度医学研究理事会制定。这些标准与世界卫生组织标准非常相似。工业废水的排放受印度标准规范的监管，最近还为沿海水域海洋排放口制定了水质标准。除了一般标准外，还为钢铁、铝、造纸浆、石油炼厂、石化以及火力发电厂等行业的废水排放制定了某些特定标准。控制水污染的立法列于下文：\n\
  \n- **《水（防止和控制污染）法》，1974年**\n\n  该法代表了印度首次全面处理环境问题的尝试。该法禁止向水体排放超过给定标准的污染物，并对不合规行为规定了处罚。该法于1988年修订，以与1986年的美国环保署规定密切一致。它设立了CPCB，制定防止和控制水污染的标准。在州一级，SPCBs在CPCB和州政府的指导下运作。\n\
  \n- **《水（防止和控制污染）附加税法》，1977年**\n\n  该法规定对工业和地方当局消耗的水征收和收取附加税。\n\n\n\n\n\n其目的是增加中央和州委员会在防止和控制水污染方面的资源。在该法案之后，*《水污染防治费规则》*\
  \ 于1978年制定，用于为每位用水消费者必须安装的计量器的种类和位置定义标准和指示。\n\n### 2.13.2.2 空气\n\n-   *《空气（防止和控制污染）法》，1981年*\n\
  \n为应对与空气污染相关的问题，根据1981年法案制定了环境空气质量标准。该法案为控制和遏制空气污染提供了手段。该法案通过禁止使用污染性燃料和物质以及规范产生空气污染的设备来打击空气污染。根据该法案，在污染控制区域建立或运营任何工业厂房均需获得州委员会的同意。委员会还须在空气污染控制区域测试空气、检查污染控制设备和制造工艺。\n\
  \n国家环境空气质量标准（NAAQS）针对主要污染物，于1994年4月由中央污染控制委员会（CPCB）发布。这些标准被视为在有足够安全裕度的情况下保护公众健康、植被和财产所需的空气质量水平（CPCB\
  \ 1995，转引自 Gupta 1999）。NAAQS为工业、居住、农村和其他敏感区域规定了具体标准。针对钢铁厂、水泥厂、化肥厂、炼油厂和铝工业等行业也制定了行业特定的排放标准。印度规定的环境质量标准与许多发达和发展中国家现行标准相似。\n\
  \n为使中央和州污染委员会能够应对严重紧急情况，《空气（防止和控制污染）修正法，1987年》得以颁布。委员会被授权采取立即措施应对此类紧急情况，并从违法者处追回所产生的费用。强调了在未履行规定条件时取消同意权的权力，这也在《空气法修正案》中得到强调。\n\
  \n*《空气（防止和控制污染）规则》* 于1982年制定，规定了委员会会议的召开程序、主席的权力、决策、法定人数、会议记录的设定方式等。它们还规定了寻求专家协助的方式和目的以及向其支付的费用。\n\
  \n与上述法案相辅相成的是1982年的*《原子能法》*，该法旨在处理放射性废物。1988年，《机动车法》得以颁布，以规范机动车辆交通，同时确保危险废物的适当包装、标签和运输。1986年《USEPA》下也已通知了与车辆污染有关的各个方面。1990年发布了大规模排放标准，该标准于1996年变得更加严格。2000年这些标准再次修订，并且首次为车辆所有者、制造商和执法机构规定了各自的义务。此外，最高法院于1999年4月29日为德里市发布了相当严格的欧Ⅰ和欧Ⅱ排放规范。该通知要求汽车制造商分别于1999年5月和2000年4月起，对在德里销售的新非商业车辆符合欧Ⅰ和欧Ⅱ规范。\n\
  \n### 2.13.2.3 森林和野生动物\n\n-   *《野生动物（保护）法》，1972年，1991年修正案*\n\n《野生动物保护法》（WPA）1972年为列出的动植物物种提供保护，并建立了生态重要受保护区域网络。WPA授权中央和州政府将任何区域宣布为野生动物保护区、国家公园或封闭区域。在这些受保护区域内进行任何工业活动均被全面禁止。它规定了负责执行该法的机构；规范野生动物狩猎；保护指定植物、保护区、国家公园和封闭区域；限制野生动物或动物制品的贸易或商业；以及其他杂项事项。该法禁止狩猎动物，除非经授权官员许可，当动物对人类生命或财产构成危险，或因残疾或疾病而无法恢复时除外（WWF-India，1999）。1991年修正法案使对狩猎的近乎全面禁止变得更加有效。\n\
  \n*《森林（保护）法》，1980年*\n\n该法旨在保护和保育森林。该法限制了州在森林除保护和将林地用于非林业目的方面的权力（非林业目的一词包括为种植经济作物、种植园作物、园艺或除再造林以外的任何目的而清理任何林地）。\n\
  \n### 2.13.3 一般\n\n#### 2.13.3.1 环境（保护）法，1986年（USEPA）\n\n该法是一项伞形立法，旨在为根据《水（防止和控制）法》1974年和《空气（防止和控制）法》1981年设立的中央和州当局的协调提供框架。\n\
  \n根据该法，中央政府有权采取必要措施保护和改善环境质量，通过设定排放和排放标准、规范工业选址、管理危险废物以及保护公众健康和福祉。\n\n中央政府不时根据USEPA发布通知，以保护生态敏感区域，或就USEPA下的事项发布指南。\n\
  \n根据该法发布的一些通知如下：\n\n-   多恩山谷通知（1989年），禁止在多恩山谷设立每日煤炭/燃料消耗超过24百万吨/天的工业。\n-   海岸管制区通知（1991年），规范沿海岸线进行的活动。根据该通知，在CRZ倾倒灰渣或任何其他废物均被禁止。火电厂（仅用于运输原材料的前沿设施、冷却水取水设施以及排放处理废水/冷却水的出水口）需要获得环境森林部（MOEF）的许可。\n\
  -   达努塔鲁卡通知（1991年），根据该通知，达努塔鲁卡地区已被宣布为生态脆弱地区，禁止在其附近设立发电厂。\n-   勒万达河口通知（1989年），禁止根据通知中规定的规则在勒万达河口周围地带设立工业。\n\
  \n环境影响评价开发项目通知（1994年，并于1997年修订）。根据该通知：\n\n-   附表I所列的所有项目均需获得环境森林部的环境许可。\n-   新工业政策中属于非许可类别的项目也需获得环境森林部的许可。\n\
  -   所有开发项目，无论是否属于附表I，如果位于脆弱地区，必须获得环境森林部的许可。\n-   投资超过₹500百万的工业项目必须获得环境森林部的许可，并进一步要求从工业部获得意向书（LOI），以及如果选址涉及林地，则需从州污染控制委员会（SPCB）和州林业部门获得无异议证书（NOC）。一旦获得NOC，意向书将由州当局转换为工业许可证。\n\
  -   该通知还规定了新建电厂的设立和运营程序要求。\n\n根据该通知，对场地特定项目（如坑口火电厂和河谷项目）需要两阶段许可。第一阶段给予场地许可，第二阶段给予最终环境许可。对本通知所涵盖的项目已强制要求进行公众听证会。这是提供透明度并让当地社区发挥更大作用的重要一步。\n\
  \n-   灰分含量通知（1997年），要求从2001年6月起使用灰分含量不超过34%的洗选煤。这适用于所有位于坑口1000公里以外以及位于城市或敏感区域的任何火电厂，无论其与坑口的距离如何，但坑口电厂除外。\n\
  -   泰姬陵梯形区通知（1998年），规定在泰姬陵梯形区污染（防止和控制）局划定的泰姬陵梯形区地理范围内不得设立任何发电厂。\n\n粉煤灰处置通知（1999年），其主要目的是保护表土、保护环境以及防止从褐煤电厂排放的粉煤灰的倾倒和处置。该通知的主要特点是，距煤或褐煤电厂50公里半径范围内，任何人不得在不将至少25%的灰与土壤按重量比混合的情况下制造粘土砖或瓦。对于火电厂，粉煤灰的利用方式如下：\n\
  \n-   每座煤或褐煤电厂应自上述通知发布之日起至少十年内，无偿提供灰用于制造灰基产品，如水泥、混凝土块、砖、板或其他材料，或用于道路、堤岸、水坝、堤防或其他建设活动。\n\
  -   每座受环境许可条件约束的煤或褐煤火电厂，该条件规定提交粉煤灰充分利用行动计划，应在本通知发布之日起九年内，根据该计划逐步淘汰粉煤灰的土地倾倒和处置。\n\
  \n为保护环境、自然和健康，与基因技术和微生物有关的《有害微生物/基因工程生物或细胞的制造、使用、进口、出口和储存规则》于1989年引入，根据1986年《环境保护法》。1991年，政府进一步决定为环境友好产品设立国家标签计划，称为\n\
  \n\n\n“ECOMARK。”该计划试图为制造商和进口商提供激励，以减少对环境的负面影响，奖励企业的真正举措，并改善环境质量和可用资源的持续性。除上述尝试外，关于《1999年再生塑料制造和使用规则》的通知也被纳入1986年《环境（保护）法》之下。\n\
  \n## 2.13.3.2 《1986年环境（保护）规则》\n\n这些规则规定了设定环境污染物排放或排放标准的程序。规则规定了中央政府的参数，在此框架下，它可以发布禁止和限制不同地区工业选址和运营的命令。规则规定了取样、送达通知、提交样品进行分析和实验室报告的程序。实验室的功能也在规则下描述，同时还包括相关分析人员的资格。\n\
  \n## 2.13.3.3 《1997年国家环境上诉法庭法》\n\n该法规定设立国家环境上诉法庭，以就根据1986年《环境保护法》在某些保障措施下不得进行或允许进行的任何工业运营或工艺或工业、运营或工艺类别的区域限制提出上诉。\n\
  \n除此之外，还制定了若干专门针对煤炭行业的法案。这种尝试的首次尝试可追溯至1952年《矿山法》，该法促进了煤矿的健康和安全标准。后来《1974年煤矿（保护与开发）法》出台，用于在采矿作业中保护煤炭。为了保护和开发石油和天然气资源，1959年制定了类似的立法。\n\
  \n## 2.13.4 危险废物\n\n有若干立法直接或间接处理危险废物。相关立法包括1948年《工厂法》、1991年《公共责任保险法》、1995年《国家环境法庭法》，以及1986年《环境保护法》下的一些通知。下面对其中每一项作简要说明。\n\
  \n根据1986年《环境（保护）法》，环境森林部已发布了若干通知来解决危险废物管理问题。其中包括以下内容：\n\n- 《1989年危险废物（管理与处置）规则》，该规则为危险化学品的制造、储存和进口以及危险废物的管理提供了指南。\n\
  - 《1998年生物医学废物（管理与处置）规则》沿相似思路制定，用于感染性废物的妥善处置、分类、运输等。\n- 《2000年市政废物（管理与处置）规则》，其目的是使市政当局能够以科学的方式处置城市固体废物。\n\
  - 《2000年危险废物（管理与处置）修正规则》，最近发布的一项通知，旨在为该国危险废物的进口和出口提供指导。\n\n## 2.13.4.1 1948年《工厂法》及其1987年修正案\n\
  \n1948年《工厂法》是一项独立后法规，明确表现出对环境的关注。1948年法的首要目标一直是确保工人在工厂的工作条件以及就业福利方面的福利。在确保工人安全和健康的同时，该法有助于环境保护。该法包含涉及危险工艺的29类工业的全面清单，危险工艺被定义为除非采取特别护理，否则其中使用的原材料或中间产品或成品、副产品、废物或废物流就会\n\
  \n- 对从事该工作的人员的健康造成实质性损害\n- 导致一般环境的污染\n\n## 2.13.4.2 《1991年公共责任保险法》（PLIA）\n\n该法涵盖涉及危险物质的事故以及这些事故的保险覆盖范围。当事故导致死亡或伤害时，该法使所有者有义务提供法案附表中规定的救济。PLIA于1992年进行了修正，授权中央政府设立环境救济基金，用于支付救济款。\n\
  \n## 2.13.4.3 《1995年国家环境法庭法》\n\n该法对因处理任何危险物质而发生的任何事故造成的损害规定了严格责任，并为设立国家环境法庭以有效、迅速地处理因此类事故而产生的案件提供了依据，目的是为人员、财产和环境的损害提供救济和赔偿，并处理与其相关或附带的其他事项。\n\
  \n## 2.13.5 环境问题的国际协定\n\n印度是若干多边环境协定（MEA）和公约的签署国。下面概述了一些主要MEA以及印度在这些协定下的义务。本问题在第2章第2.9.4节中讨论。\n\
  \n## 2.13.5.1 《1973年濒危野生动植物种国际贸易公约》（CITES）\n\nCITES的目的是控制或防止濒危物种或其衍生产品的国际商业贸易。CITES并不寻求直接保护濒危物种或限制破坏其栖息地的开发实践。相反，它寻求通过关闭国际市场来减少偷猎濒危物种和破坏其栖息地的经济激励。印度于1976年成为CITES缔约方。所有野生动植物的国际贸易以及CITES所涵盖的物种均通过《1972年野生动物（保护）法》、印度政府的进出口政策以及1962年《海关法》的规定联合监管（Bajaj\
  \ 1996）。\n\n## 2.13.5.2 《关于消耗臭氧层物质的蒙特利尔议定书》（《维也纳保护臭氧层公约》议定书），1987年\n\n《关于消耗臭氧层物质的蒙特利尔议定书》于1989年生效。该议定书为减少一系列消耗臭氧层物质（ODS）的消费和生产设定了目标。在一项重大创新中，议定书承认并非所有国家都应同等对待。该协定承认某些国家对臭氧层破坏的贡献大于其他国家。它还承认，国家减少当前排放的义务应反映其技术和财务能力。由于这一点，该协定对对臭氧层破坏贡献最大的国家设定了更严格的标准和加速淘汰时间表（Divan\
  \ and Rosencranz 2002）。\n\n印度于1992年9月加入蒙特利尔议定书及其伦敦修正案。环境森林部已设立臭氧细胞和蒙特利尔议定书指导委员会，以促进印度国家方案的实施，到2010年淘汰ODS生产。\n\
  \n为履行印度在蒙特利尔议定书下的承诺，印度政府还采取了某些政策决定：\n\n- 为多边基金资助的ODS淘汰项目所需货物完全免征关税。该优惠也已扩展到采用非ODS技术的新的投资。\n\
  - 商业银行被禁止为使用ODS技术的投资提供融资或再融资。\n\n印度政府公报于2000年7月19日通知了关于ODS淘汰监管的规则，即《2000年消耗臭氧层物质（监管与控制）规则》。它们是在1986年《环境（保护）法》下发布的。这些规则由环境森林部在与行业和相关政府部门协商后起草。\n\
  \n## 2.13.5.3 《1989年关于危险废物越境转移的巴塞尔公约》\n\n巴塞尔公约于1992年生效，具有三个主要目标：\n\n- 1）减少危险废物的越境转移\n\
  - 2）尽量减少此类废物的产生\n- 3）禁止将其运往缺乏以环境无害方式处置危险废物能力的国家\n\n印度于1992年巴塞尔公约生效后不久批准了该公约。印度《1989年危险废物管理规则法》包含了巴塞尔公约有关危险废物进口和出口的通知、非法贩运和责任的一些规定。\n\
  \n## 2.13.5.4 《1992年联合国气候变化框架公约》（UNFCCC）\n\nUNFCCC的主要目标是将温室气体（GHG）排放稳定在防止危险的人为干预全球气候的水平。公约采纳了共同但有区别的责任原则，该原则指导了监管结构的采用。\n\
  \n印度于1992年6月签署了该协定，并于1993年11月批准。根据公约，减少/限制要求仅适用于发达国家。发展中国家唯一的报告义务与温室气体清单的编制有关。印度已启动其第一份国家通报（基准年1994年）的编制，其中包括温室气体源汇清单、气候变化潜在脆弱性、适应措施以及该国为应对气候变化而采取的其他措施。关于UNFCCC和《京都议定书》的进一步细节在第5章中提供。\n\
  \n\n\n\n\n## 2.13.5.5 《1992年生物多样性公约》\n\n《生物多样性公约》（CBD）是一项具有法律约束力的框架性条约，迄今已被180个国家批准。该公约有三个主要重点领域：生物多样性保护、生物资源的可持续利用以及由此产生的利益的公平分享。\n\
  \n《生物多样性公约》于1993年生效。公约涉及许多生物多样性问题，包括栖息地保护、知识产权、生物安全和土著人民权利。\n\n印度在公约下的举措详见第2.13.2.3节。其中包括颁布1972年《野生动物保护法》，并于1991年修订，以及参与《濒危野生动植物种国际贸易公约》等多个国际公约。\n\
  \n## 2.13.5.6 《联合国防治荒漠化公约》，1994年\n\n1992年联合国环境与发展大会（UNCED）的代表建议成立一个政府间谈判委员会，以制定一项国际公约，防治遭受严重干旱和/或荒漠化的国家的荒漠化。联合国大会于1992年成立了这样一个委员会，后来协助制定了1994年的《防治荒漠化公约》。\n\
  \n该公约的独特之处在于它认可并采用了国际环境合作的自下而上方法。根据公约条款，与控制和缓解荒漠化及其影响有关的活动应与当地土地使用者和非政府组织的需要和参与密切相关。南亚地区七个国家是该公约的签署国，该公约旨在通过国家、区域和次区域行动计划来解决荒漠化问题。区域行动计划为亚洲地区设有六个专题项目网络（TPNs），每个网络均由一个国家任务经理领导。印度主办农林复合经营和土壤保护网络。详情请参阅第2.12.13节。\n\
  \n## 2.13.5.7 《国际热带木材协定》和国际热带木材组织（ITTO），1983年、1994年\n\n国际热带木材组织由《国际热带木材协定》（ITTA）1983年设立，于1985年生效，1987年开始运作。ITTO促进有关国际热带木材贸易和利用以及其资源基础可持续管理的问题的讨论、协商和国际合作。对ITTA（1983年）的继任协定于1994年谈判，并于1997年1月1日生效。该组织有57个成员国。印度于1996年批准了ITTA。\n\
  \n## 2.13.6 对印度环境保护法律和监管框架的评估\n\n从上述讨论可以看出环境立法网络的广度，但法律的执行一直令人担忧。常被引用的一个原因是环境制度盛行的命令与控制性质。加上这一点的是法律的“全有或全无”做法的盛行；它们不考虑违规程度。罚款按固定标准征收，而且没有降低排放量低于规定水平的激励措施。\n\
  \n最近的一些举措解决了这些问题。印度政府在里约会议之前于1992年出台了《污染防治政策声明》，宣布将考虑采用市场化方法控制污染。它指出，将研究经济手段，以鼓励从治标转向预防措施，将污染成本内部化并节约资源，特别是水资源。1995年，环境森林部（MOEF）成立了一个工作组来评估基于市场的工具，该工作组强烈主张将其用于工业污染防治。各种经济激励措施已被用来补充命令与控制政策。折旧津贴、免征消费税或关税以及为采用清洁技术安排优惠贷款就是此类激励措施的例子。另一个明显方面是重点从污染的末端治理转向源头治理。遥感和地理信息系统在自然资源管理和环境保护中的作用也随着时间的推移而变得越来越重要。印度在利用遥感进行自然资源管理以及在政策规划和管理层面整合环境与发展方面取得了值得称赞的进展。\n\
  \n一个重要的最新发展是司法积极主义在环境立法执行中的兴起。这反映在与环境相关的公众诉讼案件的增长，这些案件促使法院采取了关闭污染工厂等重大措施。\n\n《21世纪议程》强调需要在政策、规划和决策过程的各个阶段整合环境问题，包括使用有效的法律和监管框架、经济手段和其他激励措施。这些原则在里约会议之前就已成为指导本国环境保护的基础，并将得到加强，借鉴印度及其他国家的经验。\n\
  \n为协调与各邦政府应对这些环境挑战，中央政府已确定并重点关注17个高度污染的行业和24个环境问题区域。化学和工程行业位居政府名单之首，因为它们是空气、水和废物污染的主要贡献者。这些行业包括综合钢铁厂、有色冶金单位、制药和石油化工综合体、化肥和农药厂、火电厂、纺织、造纸、制革厂和氯碱装置。\n\
  \n## 2.13.7 新兴环境挑战\n\n印度由快速工业增长和城市化推动的经济发展正在造成具有地方、区域和全球意义的严重环境问题。森林砍伐、土壤侵蚀、水污染和土地退化持续恶化，阻碍了印度农村的经济发展，而印度繁荣大都市的快速工业化和城市化正在考验市政服务的极限并造成严重的环境问题。\n\
  \n印度政府已建立环境法律和制度体系，以在印度发展议程的总体框架和国际原则与规范内应对这些挑战。最近，政府提出了国家环境政策，为各级政府机构在监管改革、环境保护和立法制定方面的行动提供了指导。\n\
  \n印度有超过20个城市人口超过100万，其中包括新德里、孟买、钦奈和加尔各答等城市，是世界上污染最严重的城市之一。假设经济持续自由化和城市化加剧，如果不采取预防措施，对环境和健康的损害可能巨大。因此，挑战在于保持空气、水和土地的质量并保护环境，同时调和环境、社会和经济的迫切需求。\n\
  \n### 2.13.7.1 日本\n\n《基本环境法》是日本环境政策的基本结构，取代了《环境污染对策基本法》和《自然保护法》。更新后的法律旨在解决“全球环境问题、日常生活造成的城市污染、城市地区可进入自然环境的丧失以及森林和农田环境保护能力的下降”（日本政府和环境省1967年）。\n\
  \n印度主要城市的空气质量数据显示，大气污染物环境水平超过世界卫生组织和印度标准，特别是颗粒物。全国空气污染负荷中，机动车辆来源占64%，火电厂占16%，工业占13%，生活部门占7%。随着印度寻求满足其不断增长的经济的能源需求，化石燃料使用增长带来的环境影响只能恶化。据估计，印度商业能源总需求的96%以上由化石燃料满足，其中煤炭占60%，石油产品占剩余的36%。\n\
  \n《基本环境法》遵循的三个基本环境原则是“环境的恩惠应由当代人享有并传给后代，应创造一个人类活动环境负荷最小化的可持续社会，日本应通过国际合作积极为全球环境保护做出贡献”。从这些原则出发，日本政府制定了诸如“政策制定的环境考量、制定描述长期环境政策方向的基本环境计划、开发项目的环境影响评估、鼓励减少环境负荷活动的经济措施、改善社会基础设施如污水系统、交通设施等、促进企业、公民和非政府组织的环保活动、环境教育和信息提供、促进科学技术”等政策（日本政府、环境省1967年）。\n\
  \n印度的河流和溪流遭受主要来自工业过程和市政活动产生的废物造成的高水平污染。未经处理的污水和非工业废物造成的污染是工业废水的四倍。虽然估计75%的废水产生于市政来源，但大型和中型工厂的工业废物占总污染负荷的50%以上。在主要城市，收集的总废物不到5%，其中不到25%得到处理。\n\
  \n\n\n\n\n## 2.13.7.2 新西兰\n\n环境部和议会环境专员办公室由1986年《环境法》设立。这些机构负责就所有环境立法领域向部长提供建议。新西兰环境立法的共同主题是对自然和物理资源、渔业和森林进行可持续管理。《资源管理法》1991年是主要的环境立法，概述了政府管理“环境，包括空气、水、土壤、生物多样性、沿海环境、噪音、细分以及一般土地利用规划”的战略（新西兰政府，《环境法》1986；Wells\
  \ 1984）。\n\n## 2.13.7.3 俄罗斯\n\n俄罗斯联邦自然资源和环境部对“自然资源保护，包括地下资源、水体、指定保护区内的森林、野生动物及其栖息地、狩猎领域、水文气象及相关领域、环境监测和污染控制，包括辐射监测和控制，以及公共环境政策制定和实施及法定监管职能”进行监管（俄罗斯联邦自然资源和环境部\
  \ 1986）。\n\n## 2.13.7.4 南非\n\n南非环境法描述了南非与保护和保护南非环境所引发的社会、经济、哲学和法理学问题相关的法律规则。南非环境法涵盖自然资源保护和利用，以及土地利用规划和开发。执行问题也被考虑在内，同时还考虑了国际层面，这已塑造了南非环境法的许多方向。该国宪法的作用，对于理解环境法的适用至关重要，也被审视。《国家环境管理法》为环境法提供了基础框架（南非国家环境管理法\
  \ 1998）。\n\n## 2.13.7.5 英国\n\n英国环境法涉及英国环境保护。环境法日益成为欧洲和国际问题，因为空气和水污染以及人为气候变化存在跨境问题。\n\
  \n## 历史\n\n在普通法中，主要保护来自妨害法，但这仅允许在土地受损时提起私人损害赔偿或禁令诉讼。因此，猪圈散发的气味（Aldred’s Case 1610）、倾倒垃圾的严格责任（R\
  \ v. Stephens 1866），或水坝爆炸造成的损害（Rylands v. Fletcher 1898）。然而，私人执行是有限的，被发现完全不足以应对重大的环境威胁，特别是对共同资源的威胁。\n\
  \n- 1306年，爱德华一世短暂禁止伦敦燃煤。\n- 约翰·埃夫林，《Fumifugium》（1661）主张燃烧芳香木材代替矿物煤，他认为这会减少咳嗽。\n\
  - 《格雷厄姆学院民谣》（1661）描述烟雾“扼住我们的肺和精神，毁坏我们的悬挂物，并腐蚀我们的铁。”\n- 1800年，伦敦燃烧了100万吨煤，整个英国为1500万吨。\n\
  - 《烟雾滋扰取缔（大都会）法》1853年。\n- 约翰·斯诺于1854年发现索霍广街的水泵导致616人死于霍乱，因为它被一处泄漏粪便细菌的老式粪坑污染。疾病的细菌学说开始取代自黑死病以来一直存在的瘴气说。\n\
  \n在1858年的“大臭”期间，污水排入泰晤士河的倾倒在夏季炎热中变得如此恶臭，以至于议会不得不撤离。具有讽刺意味的是，《1848年大都会下水道委员会法》曾允许大都会下水道委员会关闭城里的粪坑以“清理”，但这只是导致人们污染河流。19天内，议会通过了另一项法案以建设伦敦下水道系统。\n\
  \n- 《碱法》1863年和《碱法》1874年，1906年修订\n- WS Jevons，《煤炭问题；关于国家进步和我们煤矿可能枯竭的调查》（1865）\n-\
  \ 《地面狩猎法》1880年，《夜间偷猎法》1828年，《狩猎法》1831年，狩猎保护\n- 詹姆斯·约翰斯顿（社会主义政治家），烟雾取缔联盟主席，1911年国际会议\n\
  \n伦敦还遭受了可怕的空气污染，这最终导致了1952年的“大烟雾”，进而引发了其自身的立法回应：《1956年清洁空气法》。基本监管结构是为家庭和企业（特别是燃煤）设定排放限值，同时检查机构负责执行\n\
  \n《国家环境政策法》（NEPA）、《清洁空气法》、《清洁水法》、《CERCLA》（超级基金）和《资源保护与回收法》（或另选《联邦杀虫剂、杀菌剂和杀鼠剂法》）——并且可能与自然资源法课程一起开设。更小的研讨会可能针对更集中的主题开设。一些美国法学院还提供环境法的LLM或JSD专业。此外，几所法学院设有专注于环境法的法律诊所，为学生提供在涉及实际客户的现实世界纠纷中学习环境法的机会（Babich\
  \ 2004）。《美国新闻与世界报道》一直将佛蒙特法学院、刘易斯与克拉克法学院和佩斯大学法学院评为美国前三名环境法项目，其中刘易斯与克拉克和佛蒙特经常轮换第一名。\n\
  \n许多美国法学院设有学生出版的法学期刊。耶鲁、哈佛、斯坦福、哥伦比亚、纽约大学和刘易斯与克拉克法学院的环境法评论通常是最常被引用的此类出版物（http://lawlib.wlu.edu/LJ）。\n\
  \n国际环境律师通常在美国机构接受专门培训，获得LLM学位，此前已获得第一个法学学位——通常在他们获得第一个法学学位的国家之外。\n\n## 2.14.10 越南\n\
  \n越南目前正与美国环保署合作进行戴奥辛修复和技术援助，以降低甲烷排放。2002年3月，美国和越南签署了《关于橙剂/戴奥辛对人类健康和环境影响研究的美国-越南谅解备忘录》（越南环境管理局，自然资源和环境部\
  \ 2002）。\n\n## 2.15 ISO 9000 和 14000\n\nISO，即国际标准化组织，是一个于1947年成立的全球性项目，旨在促进国际制造、贸易和通信标准的制定。最初的重点是代表所有工业化国家的机构。ISO成员包括100多个国家。美国国家标准学会（ANSI）是ISO在美国的对应机构和代表。ISO在制定标准之前基本上会征求政府、行业和其他利益相关方的意见。ISO制定的所有标准都是自愿的；因此，没有法律要求强制各国采用它们。然而，各国和各行业通常会将ISO标准作为开展和维持业务的要求采用。\n\
  \nISO在除电气和电子工程相关领域外的所有行业制定标准。这些领域的标准由总部位于日内瓦的国际电工委员会制定，该委员会成员来自多个国家，包括美国。\n\nISO的目的和目标是通过“创造公平竞争环境”来改善国际贸易的气候。概念是，通过鼓励全球统一做法，贸易壁垒将被减少。如果任何其他国家的公司管理流程相同，则国际贸易将变得更简单。\n\
  \n## 2.15.1 绿色会计实践和其他质量制造和业务管理范式\n\n熟悉各种质量工业管理范式的读者可能会注意到，绿色会计和资本预算实践通常与改进制造和业务管理的总体战略相兼容。这些各种战略往往共同作用，形成一种质量改进的总体哲学；习惯于跟踪和改进劳动力和资本生产率的公司和行业现在才意识到，对能源和其他资源做同样的事情对他们也有好处。在质量管理中，许多公司寻求通过ISO或国家层面的类似组织对其管理体系进行外部认证。最近，ISO已为管理实践制定了标准。\n\
  \nISO 9000 规定了如何建立和运营高效质量保证系统的指南，涵盖企业及其程序的大多数方面，并规定此类程序必须记录在质量保证手册中（ISO 9000 2018a）。系统如何实施、管理以及定期审查以确保合规和持续有效也必须有明确的记录。任何ISO\
  \ 9000批准公司的客户都应确信他们是从一个对其整个业务实行严格控制的组织购买的，最终产品将与声明的规格一致。ISO 9000是公认的质量系统或保证的业务管理标准，认证现在相当普遍。要获得认证，公司和企业必须证明其已具备所需的质量管理体系（QMS），另见第8.1节。\n\
  \nISO 14000还制定了环境管理标准。ISO环境管理标准与ISO 9000质量管理标准相似，只是它们侧重于环境\n\n\n\n审计计划必须包含以下 10\
  \ 项内容：\n\n- 1) 明确的审计范围和审计目标。这包括开展审计的原因、所需的信息以及对审计结果的预期。\n- 2) 规定审计地点、设施、审计日期以及执行审计所需的天数。\n\
  - 3) 识别高优先级事项，以及该设施和/或组织的 EMS（环境管理体系）。\n- 4) 识别将参与审计过程的关键人员。\n- 5) 识别用于确定 EMS 各个要素符合性的标准和程序（ISO\
  \ 14001）。\n- 6) 识别审计团队成员，包括他们的专业技能、经验和审计背景。\n- 7) 规定首次会议和末次会议的时间。\n- 8) 规定审计过程中的保密要求。\n\
  - 9) 规定审计报告格式、语言、分发要求以及最终报告发布的预期日期。\n- 10) 识别与进入设施各部分进行检查相关的安全及其他问题，以及进行有效、高效审计所需的其他设备。\n\
  \n## 示例 2.1 请阅读以下关于 ISO 14000 系列标准的八条陈述。请仔细论证你的答案，判断其为“真”（T）或“假”（F）。\n\n- 1) ISO\
  \ 14000 标准基于一个基本假设，即更好的环境管理将带来更好的环境绩效、提高的效率和更高的投资回报率。这些标准并未明确指出如何实现这些目标，也未规定某个行业必须达到的环境绩效标准。\n\
  - 2) ISO 14000 标准是由国际标准化组织（ISO）制定的监管标准。\n- 3) ISO 14000 标准是由市场驱动的，因此基于市场各方利益的自愿参与。\n\
  - 4) 采纳 ISO 14000 是一次性的承诺。不过，公司需要每年更新证书。\n- 5) ISO 14000 标准的一个主要驱动力是 EPA 需要取代过时的监管系统。\n\
  - 6) 审计员具有五年“适当的工作经验”，其最低学历要求是高中毕业文凭或同等学历。\n- 7) 公司只能通过第三方注册来证明其合规性。\n- 8) 单一 ISO\
  \ 证书可以涵盖单个公司内的多个场所或设施，或场所或设施的部分区域。\n\n### 解答\n\n- 1) 真。ISO 14000 标准是过程标准，而非绩效标准。它们没有规定公司必须达到何种环境绩效。它们提供了一个实现环境目标的体系构件。因此，这些标准将引导公司通过更好地执行组织运营的环境方面来降低成本。\n\
  - 2) 假。ISO 14000 标准是由 ISO 第 207 技术委员会（TC 207）制定的国际自愿性标准。\n- 3) 真。ISO 14000 标准是由市场驱动的，因此基于市场各方利益的自愿参与。\n\
  - 4) 假。采纳 ISO 14000 标准是一个持续的承诺。最高管理层必须制定公司的环境政策，并对持续改进、污染预防以及符合认证要求做出承诺；证书通常有效期为三年。这可能因认证机构而异。认证机构必须至少每年进行一次监督审核，并在三年后进行完整审核。\n\
  - 5) 假。USEPA 一直在积极参与标准的制定过程。目前没有迹象表明会采用 ISO 14000 标准作为可能的监管要求。ISO 14000 系列标准的驱动力主要来自私营部门。\n\
  - 6) 真。环境管理体系审计员的一般资格准则包括教育和工作经验。审计员应至少完成中等教育或同等学历，并拥有五年适当的工作经验；或者拥有大学学位，并拥有两年适当的工作经验。\n\
  - 7) 假。公司可以通过自我声明或第三方注册来证明其合规性。\n- 8) 真。在 ISO 14000 认证下，单一证书可以涵盖公司的特定场所、特定设施、多个设施或场所或设施的部分区域。例如，如果这些场所同时依据相同标准接受审核，一份\
  \ ISO 14001 证书可能涵盖公司在四个不同州的一个不同场所，以及第五个州的一个场所的部分区域。\n\n## 示例 2.2\n\n在一个制浆和造纸厂设施中进行了第三方审计。你是被指派验证既定书面程序并因此验证设施环境管理体系有效性的审计员之一。你正在采访的人员之一是该设施的环境经理。你要求经理确认她有权查阅所有适用于该工厂的法规和法律。经理示意你跟随她到隔壁房间的一个图书馆。她在图书馆停下来，自豪地指向四个摆满环境法律文本的书柜。\n\
  \n你印象深刻，但继续向环境经理提出另一个问题。“你能向我展示你在设施内评估合规性时使用的程序吗？”经理立即回答说，她不需要合规性评估程序，因为她熟悉在出现合规性问题时需要查阅哪些文件。请就上述情况讨论符合性与不符合性。\n\
  \n### 解答\n\n这是一个重大的不符合项，因为该设施缺乏评估其是否符合适用法规的程序。ISO 14001 标准第 4.2.2 节规定：“该组织应建立并保持程序，以识别并获取与其活动、产品或服务的环境方面直接相关的法律和其他要求。”因此，该设施不符合第\
  \ 4.2 节和第 4.2.2 条的规定。\n\n开具不符合项并不意味着该设施不能获得认证。然而，由于这是一个重大的不符合项，该设施必须采取纠正措施，并表明该程序已到位且有效，以符合\
  \ ISO 14001 标准。在所有这些措施到位后，该设施可以要求注册机构重新考虑其认证。\n\n## 2.16 美国当前环境监管发展：从末端治理法律法规到污染预防\n\
  \n### 2.16.1 引言\n\n1970 年是美国现代环境政策的奠基之年。《国家环境政策法》（NEPA）于 1970 年 1 月 1 日通过。NEPA 并非基于具体的立法；相反，它以一般方式提及了环境和生活质量问题。\n\
  \n由 NEPA 设立的总统环境质量委员会（CEQ），是被授权执行立法的机构之一。1970 年 4 月 22 日，首个地球日到来，成千上万的示威者聚集在全国各地。NEPA\
  \ 和地球日是关于环境问题的漫长且看似无休止辩论的开始。\n\n当时的美国政府不仅致力于通过更广泛的环境立法，还致力于实施这些法律。白宫行政重组委员会在 1970\
  \ 年的重组计划中提议成立一个独立的单一机构，独立于 CEQ。该计划由尼克松总统于 1970 年 7 月 9 日提交国会，新的 USEPA（美国环境保护署）于\
  \ 1970 年 12 月 2 日开始运作。EPA 正式诞生了。\n\n在许多方面，EPA 的职能非常广泛。EPA 负责保护国家的空气、水和土地。EPA 与各州和地方政府合作，制定和实施综合环境项目。诸如《清洁空气法》（CAA）、《清洁水法》（CWA）、《安全饮用水法》（SDWA）、《资源保护与回收法》（RCRA）、《有毒物质控制法》（TSCA）、《综合环境响应、补偿与责任法》（CERCLA\
  \ – 超级基金）、《职业安全与健康法》（OSHA）和《污染预防法》（PPA）等主要联邦法律，都要求 50 个州和地方政府在实施细节中参与。\n\n## 2.17\
  \ 温室气体\n\nUSEPA 决定在《清洁空气法》（CAA）下将温室气体作为空气污染物进行监管。已发生三个主要发展（USEPA 2011）。首先，在 *Massachusetts\
  \ v. EPA*（马萨诸塞州诉 EPA）的最高法院案件中，法院以 5 比 4 的投票结果裁定，EPA 拥有法定权力在 CAA 下将 CO₂ 和其他温室气体作为空气污染物进行监管（康奈尔大学\
  \ 2007）。其次，2009 年 9 月 22 日，EPA 署长签署了《温室气体强制报告最终规则》。根据该规则，大型排放源和供应商被要求报告温室气体排放量（2009a;\
  \ 2009b）。该规则的意图是为未来关于气候变化减缓的政策决策收集准确数据。第三，2009 年 12 月，EPA 认定温室气体危害人类健康与福利，针对的对象包括（CO₂）、甲烷（CH₄）、氧化亚氮（N₂O）、氢氟碳化物（HFCs）、全氟化碳（PFCs）和六氟化硫（SF₆）。这一危害认定是\
  \ EPA 制定温室气体排放标准的前提条件。\n\n\n\n\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_83_0.png)\n\
  \n图2.6 美国联邦环境法律及修正案的累计增长情况。资料来源：改编自 Allen 和 Shonnard（2002）以及 Sullivan 和 Adams（1997）。\n\
  \n美国约有20部主要的联邦成文法、数百部州和地方条例、数千项联邦和州规章，以及更多的联邦和州法院判例和行政决定等涉及环境问题。这些共同构成了环境法领域，而该领域在过去30多年中增长显著，如图2.6所示（Allen\
  \ 和 Shonnard 2002）。\n\n所有工程师，尤其是化学、土木、环境、机械、冶金、采矿和核工程等领域的工程师，都应熟悉环境法律法规，因为它们影响到各自领域中许多工艺的运作和职业责任。环境规章和环境法中的普通法体系要求受影响实体采取行动。例如，《清洁空气法》（CAA，一部环境法规）要求通过烟囱（点源）向空气流域排放污染物的设施申请防止显著恶化（PSD）许可证；《清洁水法》（CWA）则要求通过管道或排放口（点源）向通航水域排放污染物的设施申请国家污染物排放消除系统许可证。在许多公司，工程师负责申请并获得这些许可证。由司法判决形成的普通法也鼓励工程师在履行职业职责时采取负责任的行为，因为环境法律法规并未涵盖所有可能的环境侵害行为。工程师需要意识到违反环境法律法规可能导致的潜在法律责任，以保护公司和自身免受法律诉讼和行政诉讼。\n\
  \n## 2.17.1 九部重要的联邦环境法规\n\n本节介绍了所有工程师，尤其是化学工程师应当了解的九部联邦环境法规中的一些关键条款。这些法律共同对化学品从创造和生产到使用和处置的整个生命周期进行监管。\n\
  \n这九部法律如下：\n\n- 1) 《有毒物质控制法》（TSCA），1976年（对化学物质的测试和必要使用限制进行监管）\n- 2) 《联邦杀虫剂、杀菌剂和杀鼠剂法》（FIFRA），1972年（农药的制造和使用）\n\
  \n## 表2.1（续）\n\n| 环境法规 | 颁布日期 | 背景 | 关键条款 |\n|---|---|---|---|\n| 《清洁水法》（CWA） |\
  \ 1972 | CWA 是第一个旨在减少污染物排入全国水道的综合性联邦计划（“零排放”目标）。CWA 的另一个目标是使水体适合游泳、钓鱼和其他形式的娱乐活动（“可游泳”目标）。该法被认为相当成功，因为自颁布以来，全国水道的水质已得到显著改善。\
  \ | CWA 设立了国家污染物排放消除系统许可证计划，要求任何点源污染获得许可证。许可证要么包含废水排放限值，要么要求安装特定的污染物处理设施。许可证持有者必须监测排放、收集数据，并记录其废水的污染物水平。向下水道排放废水的工业源必须采用最佳可行控制技术，以符合\
  \ EPA 的预处理标准。 |\n| 《资源保护和回收法》（RCRA） | 1976 | 颁布 RCRA 旨在对非危险废物和危险废物的产生、运输和土地处置进行“从摇篮到坟墓”的监管，鼓励回收利用，并促进基于固体废物材料的替代能源的开发。\
  \ | 废物产生者必须保留所产生危险废物数量以及废物送往处理、储存或处置地点的记录，并每两年向 EPA 提交这些数据。运输者和处置设施也必须遵守类似的记录保存和环境监测要求。\
  \ |\n| 清理、应急规划与污染预防 综合环境响应、赔偿和责任法（CERCLA） | 1980 | CERCLA 启动了识别和清理废弃场地、工业综合体及联邦设施中失控危险废物处置场地的进程。EPA\
  \ 负责制定污染最严重场地的清单，即国家优先清单（NPL）。该法后经1986年《超级基金修正与再授权法》（SARA）修订。 | 场地列入 NPL 后，EPA 会确定潜在责任方（PRP），并通知其可能承担的\
  \ CERCLA 责任；该责任是严格、连带且溯及既往的。PRP 包括：（i）现任或（ii）前任危险废物处置设施所有者，（iii）危险废物产生者，以及（iv）危险废物运输者。\
  \ |\n| 《应急规划和社区知情权法》（EPCRA） | 1986 | SARA 第三章包含一项单独立法，即《应急规划和社区知情权法》（EPCRA）。EPCRA\
  \ 的主要目标有两个：（i）要求各州设立地方应急单位，制定应对化学品泄漏紧急情况的计划；（ii）要求 EPA 汇编制造设施向空气、水和土壤排放的有毒化学品清单。\
  \ | 设施必须与州和地方实体合作制定应急响应计划，以应对意外泄漏。受影响的设施必须每年向 EPA 报告上一年现场有毒物质的最大数量、所使用的处理和处置方法，以及向环境排放或转移到场外进行处理和/或处置的数量。\
  \ |\n| 《污染预防法》（PPA） | 1990 | 该法将污染预防确立为国家的主要污染管理战略，重点是源头削减。设立了一个污染预防信息交换中心，其目标是汇编源头削减信息并向公众提供。\
  \ | PPA 唯一的强制性条款要求，根据 SARA 第三章须提交 R 表的设施所有者或运营者，向 EPA 报告该设施上一年度所开展的源头削减和回收利用情况。\
  \ |\n| 《清洁水法》第303(d)条：最大日负荷总量（TMDL）（2000） | 2000 | 要求各州制定受污染或受威胁水体的优先清单，并确定水体在仍能满足水质标准的前提下可接受的最大污染物量（TMDL）。\
  \ | TMDL 是以下各项的总和：（i）点源（工业和市政）的单独废物负荷分配（WLA），（ii）非点源的负荷分配，（iii）自然背景水平，以及（iv）安全边际（USEPA\
  \ 2000）。 |\n\n资料来源：来自 https://www.epa.gov/sites/production/…/ch3-green-engineering-textbook_508.pdf\
  \ 和 USEPA（2000）。\n\n## 示例（选择题）\n\n示例2.3 EPA 未针对以下哪种污染物颁布国家环境空气质量标准（NAAQS）？\n\n-\
  \ A 二氧化氮（NO₂）\n- B 二氧化硫（SO₂）\n- C 汞\n- D 臭氧\n\n示例2.4 制定一级 NAAQS 的目的是\n\n- A 保护儿童免受有毒空气污染物的影响\n\
  - B 保护公共福利，包括防止能见度降低、对动物、农作物、植被和建筑物的损害\n- C 保护公众健康，包括哮喘患者、儿童和老人等“敏感”人群的健康\n- D B\
  \ 和 C\n\n示例2.5 根据《资源保护和回收法》（RCRA），一种废物被判定为具有特征毒性，如果\n\n- A 废物中含有浓度超过阈值的特定化合物\n-\
  \ B 废物中的化学物质被确定具有生物累积性、毒性和环境持久性\n- C 废物浸出液中含有浓度超过阈值的特定化合物\n- D 接触该废物会对实验动物造成不良健康影响\n\
  \n### 解答\n\n特定化合物以超过阈值的浓度浸出，决定该废物是否因毒性而属于 RCRA 特征危险废物。\n\n示例2.6 根据超级基金法规，公司可能对受污染场地修复的所有相关费用承担责任。\n\
  \n- A 只有当该公司在该场地非法处置废物时\n- B 只有当该公司对场地污染负有全部责任时\n- C 只有当该公司在该场地非法处置废物并且对场地污染负有全部责任时\n\
  - D 如果该公司在该场地合法处置废物，并且其处置的废物仅占该场地处置废物总量的一小部分\n\n### 解答\n\n超级基金法规的严格责任和连带责任条款意味着，公司可能需承担与该场地相关的全部清理费用，即使其活动合法且仅造成该场地污染的一小部分。\n\
  \n示例2.7 ISO 14000 指的是一套自愿性标准，包括\n\n- A 工人安全标准\n- B 监测和采样的具体技术\n- C 环境管理体系标准\n- D\
  \ 场地修复完成后允许的污染物浓度\n\n### 解答\n\nISO 14000 包括环境管理体系标准。\n\n示例2.8 一家零件制造商使用溶剂脱脂机清洗零件。脱脂机中使用的溶剂疑似致癌物。制造商通过过滤脏溶剂并将其返回脱脂机，减少了其处置的溶剂量。这种污染预防策略被称为\n\
  \n- A 源头削减\n- B 工艺内循环利用\n- C 工艺外循环利用\n- D 末端处理\n\n### 解答\n\n源头削减将减少所用溶剂的数量；在本例中，并未采取任何措施来消除或减少溶剂的使用。工艺外循环利用的一个例子是将溶剂送往场外回收。末端处理则是在处置前对溶剂进行处理以降低其毒性。在本例中，溶剂经过滤后返回产生脏溶剂的同一台设备，因此属于工艺内循环利用。\n\
  \n示例2.9 混合废物是指这样的废物：\n\n- A 含有受《原子能法》（AEA）管制的放射性废物和受《资源保护和回收法》（RCRA）管制的危险废物\n- B\
  \ 同时包含固体和液体\n- C 包含受 RCRA 管制的非危险废物和危险废物\n- D 含有城市固体废物和受 RCRA 管制的危险废物\n\n### 解答\n\
  \n混合废物的定义是：既含有受 AEA 管制的放射性物质，又含有受 RCRA 管制的危险废物成分的废物混合物。\n\n\n\n\n\n## 问题\n\n- 2.1\

  \n## 示例 7.5 温室气体潜在污染控制成本\n\n估算发电厂（EGU）或发电厂温室气体控制成本占销售额的百分比。假设（i）EGU 使用煤炭作为燃料，并以\
  \ 35% 的效率将煤炭燃烧的热能转化为电能，（ii）煤炭的热值为 10 000 BTU/lb，（iii）煤炭含碳 85%，（iv）碳捕获和封存成本为 $20/T，（v）电能可售价为\
  \ $0.10/kWh。\n\n### 解答\n\n基准：\n\n1 T 煤 = 1 T 煤 × 0.85 T C × 2000 lb/T × 10 000 Btu/lb\
  \ × kWh/3413 Btu × 0.35 = 1743 kWh/T of C.\n\n控制成本为 $20 对应 1743 kWh 电力发电，导致 1743\
  \ kWh × $0.10/kWh = $174 的电力销售。因此控制成本约占销售额的 11%。\n\n各公司报告的污染防治成本既反映了这些总体趋势，也提供了有关环境支出规模和分布的更多细节。例如，表\

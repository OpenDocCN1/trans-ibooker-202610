  按年利率 12% 计算，设施建设成本将在 15 年内收回。


  但所有此类计算都存在 caveats。首先，Ebara 工艺对无水氨的成本很敏感。为控制这一变量，研究正在进行以发现从市政废水中提取氨的方法（Ebara 2010）。如果氨可从附近的市政废水处理厂获得，运行该工艺将更经济。无论如何，Ebara
  工艺的肥料生产变体只有在与肥料副产品市场的位置良好且资本和电力成本变化的情况下才具有经济效益。


  ### 9.2.4 小案例研究 9.2：印度 Seshasayee Paper and Board Ltd.


  作为成功案例，考虑一个企业集团制定并采用增长战略的案例，其中一个活动的多数废物被转化为另一个活动的原料。


  Seshasayee 的原始企业是一家造纸厂。为确保原材料稳定供应，公司随后建立了糖厂。糖厂的废物蔗渣被用作造纸的原材料。另一种废物产品糖蜜被用于蒸馏厂生产乙醇。为保证甘蔗的稳定供应，公司对该地区的农民进行种植组织。Seshasayee
  与农民签订长期协议回购其产品，同时负责为他们供应水。用于种植的部分水是造纸操作处理的废水。公司还使用蔗渣髓（造纸后的废物）和该地区其他可燃农业废物作为能源来源。农业工业生态复合体如图
  9.3 所示。


  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_431_0.png)

  **图 9.3** 农业工业生态复合体。*来源：* 引自 Das（2005）和 Das 和 Cabezas（2018）。


  这对于工艺集成和强化工作的主题尤其重要，因为它涉及生产一种商品（纸）和一种人类食物（糖），以及可持续的能源生成（来自蔗渣——例如废物能源）和可持续的水使用。在本案例中，迷你案例研究的讨论表明，可以将食物生产与能源生成结合起来，并高效利用水资源。这很重要，因为商业食物（糖）的生产在经济和社会上都很重要，尤其是如果它能尽可能可持续地生产的话。


  ### 9.2.5 小案例研究 9.3：美国北德克萨斯州 EIP 中的物质和能量流动


  例如，考虑北德克萨斯州的一个 EIP，其中央设施是一家钢铁厂。该设施在概念上如图 9.4 所示，利用报废汽车作为主要原料。车辆的钢材进入电弧炉（EAF），生产各种钢材产品。炉子还产生大量
  EAF 尘埃，其中含有大量锌、铅和其他金属。在北德克萨斯设施中，EAF 尘埃被送至水泥窑，其中微量金属（铜、铬、锰、镍、铅和其他金属）具有价值。汽车拆解残渣（ASR）可用于能源回收，或残渣中的部分塑料可被分离。


  ![](img/009e9fca58d02c8d25e9fb0817ce46c9_432_0.png)

  **图 9.4** 美国北德克萨斯州 EIP 中的物质和能量流动。


  EAF 尘埃的另一种替代方案，目前在欧洲被利用，是作为锌和铅回收作业的原料。回收的锌随后可用于生产镀锌钢产品和电池，可作为锌的替代来源。


  这些案例研究说明了 EIP 的基本原则——在不同的工业运营中整合物质、能源和水的流动，提高物质和能源效率。本节检查的三个案例研究涉及位于彼此相邻的设施之间的交换；然而，EIP
  中设施的共址并非总是必要的。


  ### 9.2.6 小案例研究 9.4：用于制造超大规模光伏系统的众多共生工厂的 EIP


  正在进行的全球气候不稳定主要是由于人类燃烧化石燃料获取能源以及由此产生的温室气体（GHG）排放（IPCC 2007）。科学家之间有很大共识，如果气候不稳定的当前趋势继续下去，地球将达到不可逆转的临界点。减少大气
  GHG 如二氧化碳（CO₂）排放的挑战是重大的——《京都议定书》和最近的《巴黎协定》，整个数量级低于稳定全球气候所需的数值。为了获得稳定的气候，GHG 排放必须减少到等于自然吸收
  CO₂ 的水平。稳定发生后，自然吸收水平将随着植被汇的耗尽而逐渐下降，因此 GHG 排放需要下降到仅等于海洋吸收的水平。这一水平尚未得到很好量化，但可能要求到下一个世纪下半叶排放减少到
  5 Gt CO₂ 当量/年（比当前水平低 80% 以上）（Hansen and Sato 2004；Prentice et al. 2001）。


  为了提高制造业的经济和环境绩效，政府可以引入第二套政策，与大规模光伏（光伏）制造相结合，以促进工业共生的广泛采用。在工业共生中，传统上分开的行业被视为一个整体，以通过建立互利的物质、能源、水和/或副产品的物理交换获得竞争优势。这样的系统在集体上优化了材料和能源使用，其效率超过任何单个过程单独可实现的效果。工业共生的主要益处是



  共生是指协作以及地理邻近带来的协同效应（Chertow 2000）。工业共生系统，例如丹麦卡伦堡经典的企业网络，是在长期的时间尺度上由一系列微创新自发演化而来的。为了加速这一进程并展示互利协作的可能性，政府可以利用工业共生来设计新的太阳能光伏制造工厂。


  多 GW 的光伏工厂可以位于下一代生态工业园 EIP 的中心。EIP 将由至少八个共生工厂组成，如图 9.5 所示。这些工厂可以位于主要人口中心之外，以提供原材料、劳动力和现成的市场。第一个工厂将是一个常规回收设施（1）。这样，用于制造太阳电池的玻璃和铝就可以从回收材料中回收，从而具有更低的
  embodied energy（铝降低 95%，玻璃降低 20%）（Milne and Readon 2005）。


  来自回收厂的原玻璃将被送入平板玻璃厂（2）并使用天然气熔化。


  通常，平板玻璃的高质量要求禁止使用消费后废玻璃。然而，玻璃工业正在探索一种通过使用薄塑料涂层来消除颜色污染问题的方法，这些涂层可以用各种颜色制成，并在重新熔化过程中气化，而不会影响新玻璃的质量。这将使行业受益匪浅，因为使用回收玻璃，即碎玻璃，具有若干重要益处，包括（i）降低原材料消耗，（ii）减少原材料化学反应中形成的
  CO₂ 排放，（iii）由于熔化温度降低，延长炉子寿命长达 30%，（iv）减少熔化阶段的生产能耗，从而减少额外的温室气体和运营成本，以及（v）由于 NOₓ、SO₂
  和颗粒物排放降低，减少与污染防治相关的成本（Pearce 2008）。工厂将输出厚度为 3 mm 的切割玻璃板，边缘倒角且低铁含量，以获得高太阳透射率。最后，玻璃将被钢化以提高机械强度并涂覆



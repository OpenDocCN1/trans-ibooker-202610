  \ | — |\n\n## 3.9.6 主要空气排放源\n\n### 3.9.6.1 美国清洁空气法及修正案\n\n《清洁空气法》(CAA) 定义了美国的空气污染削减和控制的国家政策。它制定了保护健康和自然资源的目标，并阐明了联邦、州和地方政府在实现这些目标方面被期望做出的努力。CAA\
  \ 最初于 1955 年作为《空气污染控制法》颁布，多年来经历了几次修订，以满足国家空气质量不断变化的需求和状况。尽管国会的意图是通过修订每五年重新授权和更新所有主要的联邦立法\n\
  \n\n\nschedule, disagreements over policies related to the control of acidic deposition\
  \ contributed to an eight-year hiatus in amending the CAA. In 1990, major agreements\
  \ on clean air amendments were reached by members of Congress and the president.\
  \ The 1990 CAAA represented a significant political achievement. Major new or expanded\
  \ authorities included changes in the timeframes for the achievement of air-quality\
  \ standards in non-attainment areas, the regulation of emissions from motor vehicles,\
  \ regulation of hazardous air pollutants (HAPs), acidic deposition control, stratospheric\
  \ O$_3$ protection, permitting requirements, and enforcement.\n\n## 3.9.7 1990 Clean\
  \ Air Act Amendments\n\nOn 15 November 1990, the President signed the amendments\
  \ to the CAA, referred to as the 1990 CAAA. Embodied in these amendments were several\
  \ progressive and creative new themes deemed appropriate for effectively achieving\
  \ the air quality goals and for reforming the air quality control regulatory process\
  \ (USEPA 1990). Specifically, the amendments:\n\n- 1) Encouraged the use of market-based\
  \ principles and other innovative approaches similar to performance-based standards\
  \ and emission banking and trading.\n- 2) Promoted the use of clean low-sulfur coal\
  \ and natural gas, as well as innovative technologies to clean high-sulfur coal\
  \ through the acid rain program.\n- 3) Reduced energy waste and created enough of\
  \ a market for clean fuels derived from grain and natural gas to cut dependency\
  \ on oil imports by over million barrels per day.\n- 4) Promoted energy conservation\
  \ through an acid rain program that gave utilities flexibility to obtain needed\
  \ emission reductions through programs that encouraged customers to conserve energy.\n\
  \n## 3.9.8 Introduction to Air Pollution Control and Estimating Air Emission Rates\n\
  \nAir pollution control has become an essential part of operations for many industries\
  \ particularly the chemical process industries. In developed countries, air quality\
  \ problems are attributable to the by-products of combustion processes used in the\
  \ private and public transportation sectors of the economy, as well.\n\nFrequently,\
  \ however, planners fail to acknowledge that control systems themselves are industrial\
  \ processes that consume energy and can emit significant amounts of pollutants into\
  \ the atmosphere. Regulators have tended to pursue the control of each target pollutant\
  \ independently with little consideration of secondary pollutants.\n\nIn the United\
  \ States, for example, regulation of air pollution started with the largest sources\
  \ because they had the most potential for immediate environmental improvement and\
  \ because the major corporations responsible for these sources could reasonably\
  \ be asked to assimilate the costs of added prevention. The next regulatory phase\
  \ saw a progressive tightening of standards and application of limits to more and\
  \ smaller sources, with priority pollutants targeted as separate and distinct entities\
  \ to be controlled.\n\n### 3.9.8.1 Air Emission Estimates\n\nIt is critical for\
  \ a facility to make realistic estimates of the emissions it produces, which will\
  \ help in determining compliance, predicting potential public exposure and health\
  \ impacts and designing effective air pollution control equipment or strategies\
  \ (Karell 2017).\n\n### 3.9.8.2 Emission Factors\n\nValid emission factors for each\
  \ source of pollution are the key to the emission inventory. It is not uncommon\
  \ to find emission factors differing by 50%, depending on the researcher, variables\
  \ at the time of emission measurement, etc. Since it is possible to reduce the estimating\
  \ errors in the inventory to ±10% by proper statistical sampling techniques, an\
  \ emission factor error of 50% can be overwhelming. It must also be realized that\
  \ an uncontrolled source will emit at least 10 times the amount of pollutants released\
  \ from one operating properly with air pollution control equipment installed.\n\n\
  Actual emission data are available from many handbooks, government publications,\
  \ and literature searches of appropriate research papers and journals. It is always\
  \ wise to verify the data, if possible, as to the validity of the source and the\
  \ reasonableness of the final number. Some emission factors, which have been in\
  \ use for years, were only rough estimates proposed by someone years ago to establish\
  \ the order of magnitude of the particular source.\n\nEmission factors must be also\
  \ critically examined to determine the tests from which they were obtained. For\
  \ example, carbon monoxide from an automobile will vary with the load, engine speed,\
  \ displacement, ambient temperature, coolant temperature, ignition timing, carburetor\
  \ adjustment, engine condition, etc. However, in order to evaluate the overall emission\
  \ of carbon monoxide to an area, we must settle on an average value that we can\
  \ multiply by the number of cars, or kilometers driven per year, to determine the\
  \ total carbon monoxide released to the area.\n\nPublished emission factors are\
  \ available in the literature for many process situations and types of equipment.\
  \ These are often calculated and published by the USEPA and other agencies, equipment\
  \ vendors, and trade associations. Many of these emission factors are published\
  \ in normalized terms, such as pounds of contaminant per 1000 gal of certain fuel\
  \ combusted, pounds per kilowatt of electricity produced, etc. Manufacturers often\
  \ provide an emission factor as a guarantee, which enables the user to estimate\
  \ the emissions from the equipment and obtain a permit for the unit.\n\nCompilation\
  \ of air pollutant emissions factors (AP-42) (Table C.1) and emission inventories\
  \ have long been fundamental tools for air quality management (USEPA 1995). Emission\
  \ estimates are important for developing emission control strategies, determining\
  \ applicability of permitting and control programs, ascertaining the effects of\
  \ sources and appropriate mitigation strategies, plus a number of other related\
  \ applications by an array of users including federal, state, local agencies, consultants,\
  \ and industry. Data from source-specific emission tests or continuous emission\
  \ monitors are usually preferred for estimating a source’s emissions because those\
  \ data provide the best representation of the tested source’s emissions. However,\
  \ test data from individual sources are not always available and, even then, they\
  \ may not reflect the variability of actual emissions over time. Thus, emission\
  \ factors are frequently the best or only method available for estimating emissions,\
  \ in spite of their limitations.\n\nThe passage of the Clean Air Act Amendments\
  \ of 1990 (CAAA) and the Emergency Planning and Community Right-to-Know Act (EPCRA)\
  \ of 1986 has increased the need for both criteria and HAP emission factors and\
  \ inventories. The Emission Factor and Inventory Group (EFIG), in the USEPA’s Office\
  \ of Air Quality Planning and Standards, develops and maintains emission estimating\
  \ tools to support the many activities mentioned above. The AP-42 series is the\
  \ principal means by which EFIG can document its emission factors. These factors\
  \ are cited in numerous other EPA publications and electronic data bases, but without\
  \ the process details and supporting reference material provided in AP-42.\n\n###\
  \ 3.9.8.3 What Is an AP-42 Emission Factor?\n\nAn emission factor is a representative\
  \ value that attempts to relate the quantity of a pollutant released to the atmosphere\
  \ with an activity associated with the release of that pollutant. These factors\
  \ are usually expressed as the weight of pollutant divided by a unit weight, volume,\
  \ distance, or duration of the activity emitting the pollutant (e.g. kilograms of\
  \ particulate emitted per megagram of coal burned). Such factors facilitate estimation\
  \ of emissions from various sources of air pollution. In most cases, these factors\
  \ are simply averages of all available data of acceptable quality and are generally\
  \ assumed to be representative of long-term averages for all facilities in the source\
  \ category (i.e. a population average).\n\nThe general equation for emission estimation\
  \ is\n\n```\nE = A × EF × (1 − ER / 100)  (3.3)\n```\n\nwhere\nE = emissions,\n\
  A = activity rate,\nEF = emission factor, and\nER = overall emission reduction efficiency,\
  \ %.\nER is further defined as the product of the control device destruction or\
  \ removal efficiency and the capture efficiency of the control system. When estimating\
  \ emissions for a long time period (e.g. one year) both the device and the capture\
  \ efficiency terms should account for upset periods as well as routine operations.\n\
  \n### 3.9.8.4 AP-42 by Chapters: Emission Factors for Quantifications\n\nAP-42,\
  \ Compilation of Air Pollutant Emission Factors, has been published since 1972 as\
  \ the primary compilation of EPA’s emission factor information. It contains emission\
  \ factors and process information for more than 200 air pollution source categories.\
  \ A source category is a specific industry sector or group of similar emitting sources.\
  \ The emission factors have been developed and compiled from source test data, material\
  \ balance studies, and engineering estimates. The fourth edition of AP-42 was published\
  \ in 1995 (USEPA 1985a). Since then EPA has published supplements and updates to\
  \ the 15 chapters available in Volume I, Stationary Point and Area Sources. Use\
  \ the AP-42 Chapter webpage links to access the document by chapter (Table C.2).\n\
  \nEmission factor ratings in AP-42 (discussed below) provide indications of the\
  \ robustness, or appropriateness of\n\n### Example 3.3 Use of Emission Factors\n\
  \nA electrical power-generating station with four electrical generating units burned\
  \ 1.0 million T of coal, 22 000 000 gal of No. 6 fuel oil, and 600 million ft³ natural\
  \ gas to generate electricity during 1990. Use emission factors given in the table\
  \ below to estimate the releases of arsenic and mercury from the stack at the power\
  \ plant.\n\n| Pollutant | Coal emission factor (lb/T) | Oil emission factor (lb/10³\
  \ gal) | Natural gas emission factor (lb/10⁶ ft³) |\n|---|---|---|---|\n| Arsenic\
  \ | 4.10×10⁻⁴ | 1.32×10⁻⁴ | 2.30×10⁻⁴ |\n| Cadmium | 5.10×10⁻⁵ | 3.98×10⁻⁴ | 2.52×10⁻⁴\
  \ |\n| Chromium | 2.60×10⁻⁴ | 8.45×10⁻⁴ | 1.10×10⁻⁴ |\n| Lead | 4.20×10⁻⁴ | 1.51×10⁻³\
  \ | 2.71×10⁻⁴ |\n| Mercury | 8.30×10⁻⁵ | 1.13×10⁻⁴ | 7.15×10⁻⁴ |\n| Nickel | 2.80×10⁻⁴\
  \ | 8.45×10⁻² | 3.61×10⁻³ |\n\n> Source: From USEPA, Office of Air Quality Planning\
  \ and Standards (1998).\n\n\n\n\n\n## Solution\n\n*砷：*\n\n(1 000 000 T)(4.10 × 10⁻⁴\
  \ lb/T) + (22 000 × 10³ gal)(1.32 × 10⁻⁴ lb/10³ gal) + (600 × 10⁶ ft³)(2.30 × 10⁻⁴\
  \ lb/10⁶ ft³)\n\n= **413 lb** (approximately).\n\n*汞：*\n\n(1 000 000 T)(8.30 × 10⁻⁵\
  \ lb/T) + (22 000 × 10³ gal)(1.13 × 10⁻⁴ lb/10³ gal) + (600 × 10⁶ ft³)(7.15 × 10⁻⁴\
  \ lb/10⁶ ft³)\n\n= **861 lb** (approximately).\n\n用于估算源活动平均排放量的排放因子。通常，数据不足以表明温度和反应物浓度等各种工艺参数的影响。然而，在某些情况下，例如估算石油储罐排放时，本文件包含经验公式（或排放模型），将排放与罐直径、液体温度和风速等变量联系起来。考虑此类变量影响的排放因子公式，比不考虑这些参数的因子更能产生现实的估计。\n\
  \nAP-42 中排放信息的完整性和详细程度取决于来自已发表参考文献的可用信息。某些工艺的排放比其他工艺记录得更好。例如，生产一种物质可能列出多个排放因子：生产过程中的每个步骤（如中和、干燥、蒸馏和其他操作）各有一个因子。然而，由于信息较少，另一种物质的生产设施排放可能只给出一个排放因子，尽管排放可能在多个中间步骤中产生。生产某种物质的排放因子可能不止一个，因为可能存在不同的生产工艺或使用不同的控制设备。因此，有必要不仅查看特定应用的排放因子，还要观察正文和表格脚注中的细节。\n\
  \nUSEPA 没有提供某种污染物或工艺的排放因子，并不意味着该机构认为该源不排放该污染物或该源不应被纳入清单，而只是 USEPA 没有足够的数据提供任何建议。\n\
  \n排放因子可能适用于多种情况，例如为区域性清单编制源特定排放估算。这些清单有多种用途，包括环境扩散建模和分析、控制策略制定，以及在合规调查中筛选源。排放因子的使用在某些许可申请中也可能是合适的，例如适用性判定和设定运营许可费用。\n\
  \nAP-42 中的排放因子既不是 USEPA 推荐的排放限值（例如最佳可行控制技术或 BACT 或最高可实现控制技术或 MACT 或最低可实现排放率或 LAER），也不是标准（例如有害空气污染物国家排放标准或\
  \ NESHAP 或新源性能标准或 NSPS）。USEPA 不建议将这些因子用作源特定许可限值和/或作为排放法规合规性判定。排放因子本质上代表排放率范围的平均值，大约一半的受关注源的排放率高于排放因子，另一半低于该因子。因此，使用\
  \ AP-42 排放因子作为许可限值会导致一半的源处于不合规状态。\n\n此外，对于某些源，排放因子可能针对已安装空气污染控制设备的设施给出。被指出受控制技术影响的因子不一定反映最佳可行或最先进的控制水平，而只是反映在信息发布时有数据可用的（典型）控制水平。源在新建时以及被认为正常运行时通常会被更频繁地测试，而这两种情况都可能使结果产生偏差。\n\
  \n如前所述，源特定测试或连续排放监测仪可以比排放因子更好地确定现有源的实际污染物贡献。即使如此，结果也仅适用于测试或监测时的条件。为了提供更长期（例如每年或典型日）排放的最佳估计，这些条件应代表源的常规运行。\n\
  \n物料平衡方法也可以为特定源提供可靠的平均排放估算。对于某些源，物料平衡可能比排放测试更能准确估算排放。一般而言，物料平衡适用于大量物料损失到大气中的情况（例如燃料中的硫，或无控制涂装工艺中的溶剂损失）。相比之下，当物料在工艺中被消耗或化学结合，或大气损失仅占总工艺通量的很小一部分时，物料平衡可能不合适。顾名思义，要使这种排放估算可信，需要核算进入和离开工艺的所有物料。\n\
  \n如果无法获得具有代表性的源特定数据，则设备供应商提供的排放信息，特别是排放性能保证或类似设备的实际测试数据，是许可决策比 AP-42 排放因子更好的信息来源。如果此类信息不可用，使用排放因子可能作为最后的手段。无论何时使用因子，都应意识到其在准确代表特定设施方面的局限性，并在此类情况下使用排放因子的风险应与进一步测试或分析的成本进行权衡。\n\
  \n标准空气污染物（CAC）或标准污染物是一组导致烟雾、酸雨和其他健康危害的空气污染物。CAC 通常由工业、采矿、交通、电力生产和农业等众多源排放。在大多数情况下，它们是化石燃料燃烧或工业过程的产物（表\
  \ 3.8）。\n\n### 3.9.8.5 标准空气污染物\n\n标准污染物这一术语源于用于制定这些污染物国家环境空气质量标准（NAAQS）的健康标准（USEPA\
  \ 2009b）。NAAQS 由 EPA 制定，以保护公众健康和福祉。\n\n已为六种标准空气污染物制定了 NAAQS——五种原级（即直接排放）和一种次级污染物（因为它是在下层大气中由原级污染物化学反应形成）。\n\
  \n# 表 3.8 标准空气污染物。\n\n| EPA 标准空气污染物 |  |  |\n|---|---|---|\n| **污染物** | **来源** |\
  \ **健康和环境影响** |\n| **臭氧（O₃）地面** | 机动车辆、电力公用事业、工厂、垃圾填埋场、工业溶剂，以及加油站、园林设备等各种小型来源。 |\
  \ 引起咳嗽、胸闷、喘息，并可引起和损伤肺组织。加重哮喘并可能导致哮喘。刺激呼吸系统，降低肺功能，使呼吸更加困难。加重慢性肺病并可能导致永久性肺损伤。可能降低农作物产量并损害森林和其他植被。\
  \ |\n| **一氧化碳（CO）** | 机动车辆（美国 CO 的主要来源）、小型发动机、一些工业过程、锅炉和焚化炉。高浓度可出现在停车场、通风不良的隧道或交通高峰时段的交通路口等封闭空间。\

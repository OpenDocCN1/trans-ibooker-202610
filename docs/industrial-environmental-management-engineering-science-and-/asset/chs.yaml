  \n## 观测结果\n\n+   1) 水平和垂直扩散的速率均取决于大气条件。\n+      a) 大气条件取决于\n+         i) 入射的短波辐射，例如阳光\n\
  +         ii) 出射的长波辐射，主要受云量影响\n+         iii) 地形表面粗糙度\n+         iv) 地形表面湿度\n+ \
  \        v) 风速\n\n+   2) 浮力会影响烟羽中心线，使其高度发生变化，变化幅度取决于烟羽与周围大气之间的温差。\n\n位于高度 *H* 的高架源下风向任意点的理想化浓度由“污染物排放速率、风速、距离以及水平和垂直方向上的烟羽标准差”决定。\n\
  \n### 高度 H 处的点源\n\n- 假设任何方向上的扩散均不受干扰或限制\n\n\\[\nC(x,y,z)=\\frac{Q}{2\\pi u\\sigma_y\\\
  sigma_z}\\exp\\left[-\\frac{(y-y_0)^2}{2\\sigma_y^2}\\right]\\exp\\left[-\\frac{(z-z_0)^2}{2\\\
  sigma_z^2}\\right]\n\\tag{D.2}\n\\]\n\n*x₀* 和 *z₀* 为烟羽中心线的位置  \n*y₀* 取为烟囱底部的位置 \
  \ \n*z₀* 等于 *H*  \n*Q* = 源的排放强度（质量/时间）——克/秒  \n*u* = 穿过烟羽的平均风速——米/秒  \n*C* = 浓度——克/立方米（注意这不是\
  \ ppm）  \n*σᵧ* 和 *σ\U0001D4CF* 分别为水平和垂直方向的标准差，单位为米\n\n然而，许可决策基于呼吸高度处的浓度，这必须考虑地面对烟羽扩散的影响。由于气体和大多数相关颗粒物的沉积速度与大气湍流的垂直速度相比很小，地球表面表现为反射面，从而修正了扩散方程。这种效应通过一个虚拟（假想）源来模拟，如图\
  \ D.3 所示。\n\n## 考虑地面反射、高度 H 处的点源\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_521_0.png)\n\
  \n回顾高斯分布可由两个参数定义，即其最大值和扩散程度的度量，我们可以通过估算这两个参数来计算任意位置的浓度。显然，最大值与排放速率有关，而扩散程度取决于大气参数，包括时间。维基百科有很好的综述：[https://en.wikipedia.org/wiki/Outline_of_air_pollution_disposition](https://en.wikipedia.org/wiki/Outline_of_air_pollution_disposition)。\n\
  \n## 高斯扩散模型\n\n+   - 适用于局部点源——烟囱\n+   - 一般形态\n+   - 烟羽在高度 $h_{s}$ 处离开烟囱\n+     -\
  \ 额外上升一段距离 $\\Delta h$\n+       - 热气团的浮力作用\n+         或称为烟羽抬升\n+         或上升到浮力与向上动量消失的距离\n\
  +   - 出口速度 $V_{s}$\n+   - 烟羽表现为从高度 $H = h_{s}+\\Delta h$ 处排放的点源\n+   - 排放速率 Q（克/秒）\n\
  +     - 假设风向沿 x 方向，风速为 u\n+       - u 与时间、高度或位置无关（实际上并非如此）\n\n除了点源（烟囱）之外，重要的污染物源更像是线源（如道路）、面源（如沉淀池、未铺砌的停车场）或体源（污染物在大型建筑物的影响范围内排放）。线源和面源的方程通过对前述方程进行一维或二维积分推导得出。体源具有影响扩散方程的初始尺寸。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_521_1.png)\n\n**图 D.3** 使用假想源在数学上描述气体在地球表面的反射。\n\
  \n## D.5.2 排放扩散模拟所需信息\n\n+   - 描述源的类型\n+   点源、线源、面源、体源\n+   - 描述排放温度\n+   垂直方向的出口速度\n\
  +   初始尺寸，例如烟囱直径\n+   所关注污染物的排放速率\n+   - 描述源周围邻近区域\n+   孤立源/附近建筑物\n+   平坦/附近显著地形\n\
  +   土地利用分类，例如农业用地、森林、沙漠\n+   - 描述气象风速和风向\n+   垂直温度梯度，即递减率\n+   - 所关注污染物的现有（背景）环境浓度\n\
  +   - 制定预测该源产生的地面浓度的计划，通常称为模拟方案\n+   从相关实体获得方案批准\n\n美国目前用于评估地面浓度的公认稳态扩散模型是 AERMOD。以下内容摘自《AERMOD\
  \ 模型公式与评估报告》，EPA-454/R-17-001，2017 年 5 月。\n\n下文中的 AERMIC 代表 AMS/EPA 监管模型改进委员会，由美国气象学会（AMS）和美国环境保护署（EPA）的科学家组成。\n\
  \nAERMOD 建模系统由两个预处理程序和扩散模型组成。AERMIC 气象预处理程序（AERMET）为 AERMOD 提供表征边界层（PBL）所需的气象信息。AERMIC\
  \ 地形预处理程序（AERMAP）既表征地形，又为扩散模型（AERMOD）生成受体网格。\n\nAERMET 使用气象数据和地表特征来计算 AERMOD 所需的边界层参数（如混合层高度、摩擦速度等）。这些数据无论是在场外还是场内测得，都必须代表模拟区域内的气象状况。AERMAP\
  \ 使用模拟区域的网格化地形数据来计算与每个受体位置相关的代表性地形影响高度。网格化数据以数字高程模型（DEM）数据的格式提供给 AERMAP。地形预处理程序还可用于计算离散受体和受体网格的高程。\n\
  \nAERMOD 是一个稳态烟羽模型。在稳定边界层（SBL）中，它假设浓度分布在垂直和水平方向上都呈高斯分布。在对流边界层（CBL）中，水平分布也假设为高斯分布，但垂直分布则用双高斯概率密度函数（pdf）来描述。此外，在对流边界层中，AERMOD\
  \ 处理“烟羽抬升”现象，即从浮力源释放的部分烟羽质量上升到边界层顶部并停留在其附近，然后才混合进入对流边界层。AERMOD 还追踪穿透进入上部稳定层的任何烟羽质量，并在适当的时候允许其重新进入边界层。对于对流边界层和稳定边界层中的源，AERMOD\
  \ 都会处理由烟羽摆动引起的侧向扩散增强。\n\nAERMOD 采用相对简单的方法，整合了当前关于复杂地形中气流和扩散的概念。在适当的情况下，烟羽被模拟为冲击地形和/或沿地形运动。这种方法设计得既物理上真实又易于实现，同时避免了像其他监管模型那样需要区分简单、中等和复杂地形。因此，AERMOD\
  \ 无需定义复杂地形区域。\n\n## D.5.3 筛选模拟\n\n美国环保署目前认可的筛选扩散模型是 AERSCREEN。与过去四十年的筛选方法保持一致，AERSCREEN\
  \ 为单个排放点计算多个平均时段（从 1 小时到年）的预期最大地面浓度。它使用 AERMOD 建模系统的主要组件，但使用附加程序 MAKEMET 来生成已被证明能产生来自源和土地分类/土地利用特征的最大地面浓度的气象条件。一轮快速的筛选模拟通常足以证明符合空气质量标准。\n\
  \nMAKEMET 程序有着悠久而复杂的历史，可以追溯到 10 多年前。简而言之，AERSCREEN 附带的 MAKEMET 版本按以下方式运行。如前所述，MAKEMET\
  \ 生成一系列气象条件矩阵，以筛选模式应用于 AERMOD，并将结果以 AERMOD 可直接读取的地面气象数据文件和剖面气象数据文件的形式输出。该矩阵是基于对一系列风速、云量、环境温度、太阳高度角和对流速度尺度（w*，仅适用于对流条件）进行循环遍历而生成的，用于\n\
  \n\n\n用户指定的表面特征（Z₀, B₀, r）。对于稳定情况，机械混合高度（Zₘ）是基于摩擦速度 u* 计算的。还包括通过 Zₘ 因子（乘以由 u* 计算的初始值）的循环，以考虑使用精炼\
  \ AERMET 数据时 Zₘ 的平滑。太阳角度大于零但小于临界太阳角度（ACRIT）的稳定过渡情况也包含在矩阵中。\n\nAERSCREEN 是 AERMOD\
  \ 建模系统的交互式包装器，根据用户对屏幕上打印的提示提供的数值计算输入值。\n\n在运行 AERSCREEN 之前，用户应查阅并熟悉以下内容：\n\n- AERMOD\
  \ 用户指南（USEPA 2016a）\n- AERMAP 用户指南（USEPA 2016b）\n- AERMET 用户指南（用于表面特征表）（USEPA 2016c）\n\
  - BPIPPRM 用户指南（USEPA 2004）– 与建筑物对扩散的影响相关\n- AERSURFACE 用户指南（USEPA 2008）\n- AERMOD\
  \ 实施指南（USEPA 2016e）\n\n尽管接下来的两个参考资料专门针对美国，但其中包含的信息可能对扩散建模总体而言很重要。\n\n空气质量模型指南（附录\
  \ W）（USEPA 2016d）\n\n估算固定源空气质量影响的筛选程序（USEPA 1992）\n\n下面提供了 AERSCREEN（版本 16216）代码的链接，包括最新的\
  \ MAKEMET 代码（版本 16216），以及文档和测试用例。MAKEMET 程序与 AERSCREEN 接口，根据用户输入生成基于站点的筛选气象条件矩阵，用于输入\
  \ AERMOD。\n\nAERSCREEN 代码和可执行文件（v16216） (ZIP)(759 K)\nMAKEMET 代码和可执行文件（v16216） (ZIP)(355\
  \ K)\n\n请注意，在使用 AERSCREEN 之前，用户必须拥有最新的 AERMOD 可执行文件（18081）以及 AERMAP 地形预处理器和 BPIPPRM\
  \ 可执行文件。这些程序可以从 AERMOD 建模系统部分下载。\n\n## D.5.4 AERSCREEN 示例\n\n图 D.4 是针对用于生产甲烷发电的厌氧消化器排放物分析而产生的。分析表明，甲烷中还含有硫化合物。它提供了烟囱高度对地面水平\n\
  \n改变烟囱高度时的筛选浓度\n（10 吨/年 SO2 排放）\n\n![](img/009e9fca58d02c8d25e9fb0817ce46c9_523_0.png)\n\
  \n图 D.4 随高度变化的 SO₂ 浓度。\n\n浓度的效应示例。它还表明，一个非常小的、10 TPY 的 SO 2 源，如果烟囱很短，可能在距离烟囱数千米处超过美国标准。空气质量影响分析（AQIA）从每个污染物的初步建模开始，以确定申请人是否可以免除详细分析和建设前监测。如果给定污染物的预测环境浓度增幅低于每个平均时段的\
  \ PSD 显著影响水平（SILs），则无需对该污染物的环境影响进行进一步分析。对于具有平均时段且影响大于 SIL 的污染物，使用完整的环境影响分析（考虑其他消耗增量的源）来证明符合\

  \ PD）的纸浆厂可能实现2至4年的投资回收期，具体取决于甲醇价格和当地经济状况。\n\n该工艺还通过将大部分甲醇转化为甲醛（而非CO₂），产生两级低压蒸汽（60和70磅/平方英寸表压），可在造纸厂内使用。CO₂减排量约为焚烧或生物处理厂原本会产生量的80–85%。对于一个日产2000风干吨的纸浆厂，这相当于每年避免排放28吨（T/Y）CO₂。\n\

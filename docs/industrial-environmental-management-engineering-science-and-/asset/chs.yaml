  ## 6.4 Evaluating the Life Cycle Environmental Performance of Chemical-, Mechanical-,
  and Bio-Pulping Processes


  ### 6.4.1 Introduction


  纸浆和造纸制造在美国是按水和能源使用量以及向环境排放总量计算的最大行业之一。然而，与许多其他行业相比，该行业在可持续发展中发挥着重要作用，因为其主要原材料——木纤维——是可再生的。该行业提供了一个资源如何被管理以提供持续供应以满足社会当前和未来需求的例子。本工作的目标是介绍化学（kraft-硫酸盐）、机械（或热机械）和生物制浆工艺之间的简化环境
  LCA。该 LCA 将帮助我们评估该行业在环境管理、法规和非法规力量、其工艺和产品的生命周期以及未来发展方面的当前经验和实践。


  制浆工业传统上使用机械或化学制浆方法，或两者结合来生产具有所需特性的纸浆。机械制浆目前约占世界木浆产量的 25%。机械制浆由于其高得率，被视为延长森林资源的一种方式。然而，机械制浆耗电量大，且生产的纸张强度低于化学制浆工艺。这些缺点限制了机械浆在许多纸张等级中的使用。化学制浆约占世界木浆产量的
  75%。该工艺生产出强度极高的纸张。然而，该工艺的缺点是资本和能源密集、得率相对较低、产生麻烦的废物产品以及产生相对价值较低的副产品。


  一种新的技术，即生物制浆工艺，具有改善其中一些问题的潜力，目前正在商业规模上进行测试。生物制浆在机械制浆前用天然木腐真菌处理木片，可以节省大量电力，与传统制浆相比显著减少空气污染物（包括
  CO₂ 和一些引起气味的总还原硫化合物）和水污染物（BOD、COD、TSS），改善纸张质量并增强经济竞争力。


  美国环保署的 TRACI（USEPA 2003）模型用于评估三种纸浆和造纸工艺所归因的化学、环境和人类健康影响。生物制浆工艺获得的结果表明环境和人类健康影响显著减少。生物制浆工艺在经济优势以及环境和人类健康效益方面被证明更具可持续性。


  ### 6.4.2 Application of LCA


  LCA 是一种工具，已在第 6.4 和 6.5 节中描述，用于评估工艺、产品或活动的环境绩效，从原材料提取开始，经过制造、使用，直至最终处置。这被称为“从摇篮到坟墓”方法（图
  6.3）。由于其对系统分析的整体方法，LCA 正在成为环境系统管理中日益重要的决策工具。其相对于其他特定场地的环境分析方法（如环境影响评价或环境审计）的主要优势在于扩大系统边界，以包括产品或工艺生命周期中的所有负担和影响，而不仅仅关注工厂或制造现场产生的排放和废物。


  作为环境管理工具，LCA 有两个主要目标。其第一个目标是量化并评估工艺或产品的环境绩效，从而帮助决策者在替代产品或工艺之间做出选择。LCA 的另一个目标是为评估现有或新设计系统的环境绩效的潜在改进提供依据。这对工程师和环境管理人员可能特别重要，因为它可以建议他们如何修改或设计系统以降低其整体环境影响。因此，LCA
  既可以由公司内部使用，也可以由行业、政策制定者、规划者、教育工作者和其他利益相关者外部使用。如果 LCA 的结果要由公司内部使用，那么 LCA 可能有用的领域包括但不限于以下内容：


  - 战略规划或环境战略制定

  - 系统中的问题解决

  - 识别环境改进机会并跟踪改进

  - 工艺和产品设计、创新、改进和优化


  LCA 的外部应用包括将 LCA 用作营销工具，以支持环境标签或声明，或信息目的，或支持政策决策。LCA、绿色化学、绿色工程、面向环境的设计、工业生态学以及化学工程和环境工程的其他新兴领域为开发可持续和创新的工艺和产品提供了更大的机会（Das
  and Scott 2003）。


  在本案例研究中，我们仅关注与三种工艺相关的 LCA：使用木片的化学、机械和生物制浆。这种简化 LCA 方法将有助于通过考虑环境影响、人类健康和安全以及工艺经济性来确定哪种工艺更具可持续性。


  ### 6.4.3 The Pulping Processes


  #### 6.4.3.1 Mechanical Pulping


  机械制浆顾名思义依赖机械能将木材转化为纸浆。当前的机械纸浆制造工艺包括几种高能研磨和精炼系统，包括精磨机机械制浆（RMP）工艺、热机械制浆（TMP）工艺、化学机械制浆工艺和化学热机械制浆工艺（Someswhar
  and Pinkerton 1992；Smook 1992）。机械制浆目前约占世界木浆产量的 25%。机械制浆由于其高得率，被视为延长这些资源的一种方式。然而，机械制浆耗电量大，且生产的纸张强度低于化学制浆工艺生产的纸张强度，而化学制浆工艺在制浆过程中使用。图
  6.6 显示了 TMP 的基本流程图（Smook 1992）。TMP 是 RMP 的改进；它涉及在几个精炼阶段之前和期间对原材料进行短时间蒸汽处理。蒸汽处理的作用是



  软化木片，其结果是生产的纸浆中长纤维的比例更高，而碎片比RPM少。最常见的是在压力下同时进行加热和精炼（TMP），但有些系统在常压下进行精炼。在精炼的各个阶段有时会添加化学品。在TMP工艺中，木片通常在20–40
  psi的压力下蒸汽处理2–4分钟，然后再进行精炼。


  美国造纸工业空气与水流改善国家委员会（NCASI 1983）的一项研究估计，在蒸煮和精炼过程中，随着蒸汽的释放，很可能会释放挥发性有机化合物（VOC）。VOC排放量范围可根据木材种类在每吨纸浆1.0至7.0磅碳之间变化。机械制浆过程预计不会产生除VOC以外的其他排放。


  表6.4列出了机械/热机械制浆通常需要的补充化学品的平均数量（以%计）（USDA，个人交流）。表6.5列出了TMP和造纸工艺的各个操作中的能源消耗（美国纸浆和造纸工业1988）。表6.6显示了TMP工艺的排放负荷范围和其他环境影响（Hynninen
  1998；Sundholm 1999）。表6.4–6.6的数据用于量化将在第6.4.3.7节后面讨论的环境和人类健康影响。


  ## 6.4.3.2 化学制浆工艺


  以下讨论集中于化学制浆工艺，其供应了世界上超过三分之二的木浆。造纸中最广泛使用的化学制浆工艺是硫酸盐，或硫酸盐工艺。其他化学制浆工艺（主要使用酸性亚硫酸盐和碱液）有时会与各种化学回收子工艺结合使用。早在一百多年前就已使用，这些工艺现在可回收90%的无机物，这些无机物用于制浆工艺。几乎100%的溶解有机物被转化为能量。典型的硫酸盐工艺涉及将原木制成木片，然后进行制浆（图6.7）（Someshwar和Pinkerton
  1992）。化学纸浆和造纸工艺的主要步骤包括木材场作业、制浆、除节、洗涤和筛选、化学回收、纸浆漂白、纸浆干燥和造纸（Smook 1992；Someshwar和Pinkerton
  1992）。在硫酸盐工厂内会产生各种气体、颗粒物、液体和固体废物流（BOD、COD、TSS、NOₓ、SO₂、CO、CO₂、PM、TRS、气味和灰分）。现有文献中有大量信息涉及这些废物流的各种处理方法、污染预防和工艺优化技术。一些污染预防进展以及美国硫酸盐和亚硫酸盐工厂在过去20–25年中总环境排放量（废水、空气排放以及固体和危险废物）的减少情况在参考文献中引用的文献中有讨论（Das
  2005；Das和Jain 2001）。


  表6.4列出了化学制浆通常需要的补充化学品的平均数量（以百分比计）。化学制浆使用的化学品比机械制浆多63%，比生物制浆多53%。表6.5列出了化学制浆和造纸工艺的各个操作中的能源消耗。表6.6显示了化学制浆和造纸工艺的排放负荷范围和其他环境影响。表6.4–6.6的数据用于量化将在第6.4.3.7节后面讨论的环境和人类健康影响。


  ## 6.4.3.3 生物制浆：试点项目回顾


  生物制浆是在制浆前用降解木质素的真菌处理木片和其他木质纤维素材料。十年的行业资助研究已证明该技术在实验室规模的机械制浆中具有技术可行性。在威斯康星州麦迪逊的美国农业部林业局林产品实验室（FPL）进行的两次50吨户外木片堆试验，已确立了该技术的工程和经济可行性。精炼控制木片和真菌处理的木片通过热机械浆（TMP）磨后，所得纸浆在FPL的试点规模造纸机上制成纸张。除了精炼过程中电能消耗节省30%之外，真菌预处理还改善了所得纸张的强度。由于纸张强度更高，我们能够在机械浆和硫酸盐浆的混合物中替代至少5%的硫酸盐浆。这项最新工作清楚地证明，通过能源节约以及用更强的生物制浆TMP替代更昂贵的硫酸盐浆，同时保持纸张质量，可以实现生物制浆技术的经济效益。


  ## 6.4.3.4 生物制浆简介


  生物制浆使用天然木材腐朽生物，有可能克服这些问题。真菌改变木材细胞壁中的木质素，其效果是“软化”木片。这大大减少了机械制浆所需的电能，并提高了纸张强度特性。真菌


  一次处理约1.5公斤木片（干重基准）。在我们将生物制浆从实验室规模扩大到更大规模的放大实验中，选择了每个步骤的特定实施方式。所选的实施方式使我们能够实现该项目阶段的两个目标：（i）证明木片可以在连续工艺中而不是像实验室试验那样以批处理方式进行除菌和接种，以及（ii）证明该工艺从工程角度来看按预期规模放大。以下讨论了放大试验中获得的结果与工业工艺的关系。


  在反应器放大研究中，Kirk等人（1993）研究了两种类型的反应器系统：管式反应器和木片堆。管式反应器在获得放大工艺所需的工程和动力学数据方面具有优势。该系统的单维特性易于分析和建模。反应器还允许系统内进行良好的受控气流，气流模式众所周知。系统中的热损失可通过外部绝缘轻松控制，从而实现与大型木片堆中心所经历的相同条件。这些反应器和木片堆的配置细节已发表。


  ## 6.4.3.5 生物制浆的大规模实施


  在大型规模上，除菌和接种必须以连续方式进行，而不是像实验室试验那样分批进行（图6.9）。为此，FPL研究人员建立了一个基于两个螺旋输送机的处理系统，该输送机运输木片并充当处理室。图6.9是5吨和50吨试验中使用的连续工艺设备的概述。蒸汽注入第一个螺旋输送机，加热并除菌木片表面。位于两个输送机之间的缓冲仓充当缓冲器。从缓冲仓底部，第二台螺旋输送机取出木片，随后用过滤空气冷却。在第二台螺旋输送机的后半部分，含有真菌、未灭菌玉米
  steep 液和水的接种液悬浮液被施加并通过翻滚作用与木片混合。从螺旋输送机，木片落入堆或反应器进行两周的孵育。在第一次放大试验中，5吨云杉木片以约0.5吨/小时的通量进行接种和孵育。


  在与生物制浆真菌*Coriolopsis subvermispora*的成功户外试验中，约50吨云杉在超过20小时内以约2吨/小时（干重基准）的通量连续处理。在两周的时间里，尽管暴露于室外环境条件，木片堆仍保持在真菌生长的温度范围内。



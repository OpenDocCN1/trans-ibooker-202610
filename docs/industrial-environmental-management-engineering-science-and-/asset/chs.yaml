  \n## 4.4.2 州废物排放许可\n\n在美国，向州内水域（包括地表水和地下水）排放经过处理的废水需要州废物排放许可。任何将固体废物或液体废物排入由市政当局或公共机构运营的下水道系统的工业或商业运营商也需要州废物排放许可，这些系统随后向州内水域排放（以美国华盛顿州为例）。该许可是根据修订的华盛顿州法典（RCW）第\
  \ 90.48 章（水污染控制）发布的。州废物排放许可的最长有效期为五年。如果州在收到完整的州废物排放许可申请后 60 天内未采取行动，申请者可临时获得临时州废物排放许可。临时州废物排放许可有效期限为五年，或直至州发出正式废物排放许可为止。临时州废物排放许可授权按照许可申请中所请求的排放进行。受临时州废物排放许可覆盖的设施必须在临时许可到期前至少\
  \ 60 天重新申请。\n\n## 4.4.3 NPDES 废水排放许可\n\n向美国水域（地表水）排放废水需要 NPDES 许可。该许可由州根据《清洁水法》（CWA\
  \ 1972）的授权发布。由于美国水域同时也是州内水域，NPDES 许可实际上是 NPDES/州废物排放的合并许可，依据双重（州和联邦）权限发布。NPDES 许可通常最长有效期为五年。《清洁水法》最重要的修订是\
  \ NPDES 许可计划。技术型排放限值，支持通过管道或输送设施排放污染物的工厂（另见第 4.9.3 节；表 4.6）。\n\n### 表 4.4 实验室分析方法。\n\

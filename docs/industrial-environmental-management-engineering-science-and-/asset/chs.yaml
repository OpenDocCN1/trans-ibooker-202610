  \ 2010a），EPA定期对与标准空气污染物暴露相关的健康与福利效应的科学文献进行全面审查（USEPA 2006a, b, 2008a, 2009a, b,\
  \ 2010b）。所得的评估结果构成了监管决策的基础，以决定是否保留或修订规定环境空气中各污染物允许浓度的NAAQS（USEPA 2009b）。\n\n一级标准设定的水平旨在保护公众健康，包括易感人群的健康，并留有足够的安全余量。在选择安全余量时，EPA会考虑以下因素：证据的优势和局限性及相关不确定性、健康效应的性质和严重程度、易感人群的规模，以及是否已确定在低于该阈值时不会产生健康影响的可辨识阈值。总体而言，对于标准空气污染物，没有证据表明存在可辨识的阈值（USEPA\
  \ 2006a, b, 2008a, 2009a, b, 2010b）。\n\n二级标准旨在保护公众免受已知或预期的不良影响。其实施时间表由州和地方政府确定。一级和二级标准都必须与空气质量标准表（表3.9）一致。此外，标准还必须防止空气质量区域内任何部分的环境空气质量持续恶化。然而，区域内新的工业和商业运营不可能实现零污染，而区域内的经济增长也不可能不推动区域内现有排放源减少污染物排放。为了避免环境空气质量与预期经济增长之间的这一明显冲突，1974年8月下旬提出了相关法规，以防止在空气质量已优于联邦标准要求的地区出现严重恶化。各州将在EPA审查后实施三类分区（USEPA\
  \ 1975）。任何地区的环境空气质量都不得违反联邦一级和二级标准。分类如下：\n\n- 一类区：几乎不允许当前空气质量发生变化的区域（例如国家公园、国家纪念区和国家遗产区）。\n\
  - 二类区：允许适度变化，但需要严格空气质量约束的区域（例如居民区）。\n- 三类区：允许大量工业增长，且污染物浓度增加至联邦标准被视为无关紧要的区域（例如指定的工业综合体）。\n\
  \n## 3.9.8.7 有害空气污染物\n\n根据《清洁空气法》（CAA），EPA必须对有害空气污染物（HAPs）的排放进行管控。在1990年CAA中，确定了189种可能受监管的HAPs，如表C.2所示。工业和生活垃圾焚烧炉、工业锅炉和工艺加热炉以及其他燃烧源被怀疑排放大量多种此类HAPs。一些HAPs是废物和/或燃料的组分，另一些则在燃烧过程中形成。\n\
  \n## 3.9.8.8 有害空气污染物国家排放标准\n\n针对HAPs的点源排放，已另行设立一类标准，称为有害空气污染物国家排放标准（NESHAPs）。这些标准适用于那些没有环境空气质量标准（AAQSs）、但可能导致严重不可逆疾病或使人丧失能力的可逆性疾病增加的污染物。迄今为止，EPA仅针对少数污染源颁布了NESHAPs，但自1990年《清洁空气法》修正案以来，这一领域的行动大幅增加。NESHAPs对污染源和控制方法类型的规定非常具体。表3.10简要汇总了这些标准。\n\
  \n**表3.10** 有害空气污染物国家排放标准（NESHAPs）摘要。\n\n| 项目 | 说明 |\n|---|---|\n| 1. 铍 | 所有点源的排放量限制为每24小时10克铍。若经EPA批准，源所有者/运营者可以替代该要求，改为满足30天周期内平均0.01\
  \ µg/m³的环境空气质量标准。对于使用含铍推进剂的火箭发动机试验，另行规定了标准。 |\n| 2. 汞 | 汞矿石加工设施和汞电解氯碱厂的汞排放量每24小时不得超过2300克。污泥焚烧炉或干燥器的排放量每24小时不得超过3200克。\
  \ |\n| 3. 氯乙烯 | 标准针对二氯乙烷厂、氯乙烯厂和PVC厂中的特定设备和工艺列出。通常，任何废气中氯乙烯的标准为10 ppm。 |\n| 4. 苯\
  \ | 该标准非常具体，主要适用于处理苯的工厂及厂内设备。标准旨在防止或尽量减少苯向大气中的泄漏。 |\n| 5. 石棉 | 标准适用于石棉加工厂、使用商业石棉的11种制造作业、含石棉设施的拆除和翻新以及其他工艺。基本要求是任何废气排放不得含有可见排放物。\
  \ |\n\n*资料来源：* 改编自40 CFR 61（《美国联邦法规》）。\n\n## 3.9.8.9 逸散排放\n\n逸散排放是指来自加压设备的气体或蒸气因泄漏和其他意外或不规则释放而产生的排放，主要来自工业活动。除了造成物料损失的经济成本外，逸散排放还会加剧空气污染和气候变化。2000年加拿大石油和天然气上游活动温室气体排放的详细清单估计，逸散性设备泄漏的全球变暖潜能相当于释放1700万公吨。\n\
  \n\n\n\n\n二氧化碳，或占该行业排放的全部温室气体的12%（Clearstone Engineering 1994）。天然气排放、放空、意外泄漏和储存损失额外占38%。\n\
  \n逸散排放还带来其他风险和危害。来自炼油厂和化工厂的苯等VOCs排放对工人和当地社区构成长期健康风险。在大量易燃液体和气体处于加压状态的情况下，泄漏还会增加火灾和爆炸的风险。\n\
  \n加压工艺设备中的泄漏通常发生在阀门、管道连接、机械密封或任何可能泄漏的其他设备（例如泵、法兰）处。逸散排放也发生在蒸发源处，例如废水处理池和储罐。由于大型工业设施潜在泄漏源数量巨大，且某些泄漏难以检测和修复，逸散排放可能占总排放量的很大比例。尽管泄漏气体的数量可能很小，但具有严重健康或环境影响的气体仍可能造成重大问题。\n\
  \n为尽量减少和控制工艺中的泄漏，设施运营商会进行定期的泄漏检测与修复活动。使用气体检测仪对工艺设备进行常规检查，可用于识别泄漏并估算泄漏速率，以便决定适当的纠正措施。对设备进行适当的常规维护可降低泄漏的可能性。\n\
  \n一座炼油厂或大型石化设施可能拥有数千件此类设备，使得测量每个来源的排放变得不切实际。由于在现场或设施中检测和量化实际逸散排放存在技术困难和成本，且排放流量具有可变性和间歇性，因此基于标准排放因子进行的自下而上估算通常用于年度报告目的。\n\
  \n正在开发的新技术可能会彻底改变逸散排放的检测和监测。其中一种技术称为差分吸收激光雷达（DIAL），可用于远程测量距设施数百米范围内大气中碳氢化合物的浓度剖面。DIAL已在欧洲用于炼油厂调查超过15年。2005年进行的一项试点研究使用DIAL发现，炼油厂的实际排放量比使用排放因子方法之前报告的排放量高出15倍。逸散排放相当于炼油厂吞吐量的0.17%（Chambers\
  \ et al. 2008）。\n\n## 3.9.8.10 逸散排放估算方法\n\n美国环保署已建立了一系列逸散排放估算方法（USEPA 1988, 1995）。\n\
  \n方法在所需时间和费用上各不相同，正如预期的那样，耗时且成本高的方法会得出更准确的排放估算。估算逸散排放最不准确且成本最低的方法是统计所有潜在的泄漏源并应用平均“排放因子”，根据公式：\n\
  \n```\nE = m_{voc} x f_av\n```\n\n其中 *E* 是部件的VOC排放速率，*m_{voc}* 是部件所服务的流中VOC的质量分数，*f_{av}*\
  \ 是平均排放因子。\n\n便携式气体泄漏成像相机也是一种新技术，可用于改善泄漏检测与修复，从而减少逸散排放。相机使用红外成像技术产生视频图像，其中从泄漏源逸出的不可见气体可以轻松识别。合成有机化学制造工业（SOCMI）逸散排放的平均排放因子，包括石油炼制和天然气厂，见表3.11。\n\
  \n## 示例3.4 使用排放因子估算逸散排放\n\n对丙烯醛制造设施中设备的部件计数发现，有1400个阀门、3048个法兰和其他连接件、27台泵、20个安全阀、21条敞开端管线和20个取样连接（Berglund\
  \ et al. 1989）。使用表3.11中的平均SOCMI排放因子，确定丙烯醛的逸散排放量为每年磅数。假设工艺流体几乎完全由VOC组成，且设备含有87%的质量。其中168个阀门为气体服务；所有其他阀门和泵均为轻质液体服务。\n\
  \n## 解答\n\n对于气体服务的阀门，估算的丙烯醛排放量为\n\n```\n[(0.87) lb acrolein/lb VOC)(1400 – 168)(0.00597\
  \ kg VOC/h valve)(2.2046 lb/kg)(24 h/day)(365 day/year)] = **16 850 lb/year** for\
  \ all valves in gas service.\n```\n\n```\n[(0.87) lb acrolein/lb VOC)(1400 – 168)(0.00403\
  \ kg VOC/h valve)(2.2046 lb/kg)(24 h/day)(365 day/year)] = **83 400 lb/year** for\
  \ all valves in light liquid service.\n```\n\n将这些值相加得到阀门的丙烯醛总估算排放量，约为 **100 250\
  \ lb acrolein/year**。\n\n对于轻质液体服务的法兰、泵、安全阀、敞开端管线和取样连接的结果也进行了类似计算，并在表3.12中列出。\n\n\

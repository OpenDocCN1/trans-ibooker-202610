  \ 40 CFR Part 60），包括排放限值、性能标准、许可程序、测试和监测要求、记录保存以及报告。美国大多数州在其州法中通过引用采用联邦排放限值和标准。如果希望如此，各州可以制定比联邦标准更严格的标准，但不得制定较为宽松的标准。\n\
  \n各州已建立自己的空气污染许可和合规计划。一旦州计划获得 USEPA 的批准，该州即被授权确保其边界内的清洁和健康空气。许可过程是各州追踪和执法其法规的工具。州法规为各种污染物设定了特定的排放限值，任何源在未取得许可证之前不得排放超过这些限值的污染物。任何未能获得适当许可证的来源将\n\
  \n## 4.13 整体许可过程\n\n治理空气污染的联邦法律旨在保护环境空气质量和公众健康。USEPA 依据这些法律的授权，制定限制各种来源允许排放量的联邦法规。各种工业的具体法规\n\
  \n将面临巨额罚款。州许可计划的目的之一是允许该州追踪主要空气污染源。许可证提供了一种手段，以确保来源使用适当的技术来控制污染，并通过常规测试、监测、记录保存和报告来证明对排放标准的持续合规。\n\
  \n### 4.13.1 谁需要 PSD 许可证？\n\n有 28 个特定的行业或工业过程，如果它们排放或有可能排放至少 100 T/Y 的任何由联邦《清洁空气法》（CAA）规定的受管制污染物，则必须满足\
  \ PSD 计划的要求。这些行业和过程列在表 4.9 中。对于所有其他行业和工业过程，如果它们排放或有可能排放至少 250 T/Y 的任何受管制污染物，则适用\
  \ PSD 计划。最常用于触发全场 PSD 适用性的受管制污染物包括颗粒物（PM）、一氧化碳（CO）、二氧化硫（SO₂）、挥发性有机化合物（VOCs）、氮氧化物（NOₓ）和温室气体（GHGs）。其他相对常见的受管制污染物包括氟化物、硫酸雾（H₂SO₄）、硫化氢（H₂S）和总还原硫化合物。\n\
  \n对于现有主要固定源的修改，如果主要固定源的物理变化或操作方法的改变导致该源的显著排放增加和显著净排放增加，则触发 PSD 审查。PSD 计划制定了具体的适用标准，用于确定该修改是否导致该源的显著排放增加和显著净排放增加。PSD\
  \ 适用标准在第 4.12、4.13 节和附录 D.4 中详细讨论。\n\n特殊情况：当设施在项目前低于上述水平，但项目本身超过 100 或 250 T/Y 水平时。示例\
  \ 1：一座 80 T/Y SO₂ 设施进行 50 T/Y 的 SO₂ 扩建，此时不需要获得 PSD 许可证。示例 2：同一设施进行 120 T/Y 的扩建，则需要获得\
  \ PSD 许可证。\n\n### 4.13.2 PSD 计划对申请人有什么要求？\n\n为获得 PSD 许可证，申请人必须（USEPA 1990）执行以下操作：\n\
  \n- 1) 全面确定项目的范围，以及哪些设备是新增的、修改过的，或上游和下游设备使用量增加的。\n- 2) 对新增或修改的设备应用 BACT。BACT 的确定要考虑能源、环境和经济影响，以确定拟议源或修改所能实现的最大削减程度。BACT\
  \ 的确定结果不得导致未能满足 40 CFR 第 60、61 和 63 部分下任何适用性能标准的排放限制。使用量增加的设备和设备不 subject 于 BACT\
  \ 审查。PSD BACT 仅适用于触发 PSD 的污染物。其他污染物可由次要许可机构评估。\n\n# 表 4.9 28 个主要源类别列表（阈值为 100 T/Y）。\n\

  ## 资源回收


  华盛顿州斯波坎市废物能源设施，美国


  ## G.1 设施描述


  位于华盛顿州斯波坎的资源回收和废物能源设施（WTE）可处理 800 T 市政固体废物（MSW）每日：有两个锅炉，每个额定 400 T/日。该设施每年使用约 255
  000 T 垃圾。有 1 台蒸汽轮机发电机，额定 13.8 kV，30 MVA，25.8 MW，功率因数为 0.86。该设施的发电合同按季节变化，从 $38 到
  $48 MWh（毛 ~1 500 000 MW/年）（C. Averyt，个人交流）。MSW 通常由卡车直接倾倒到垃圾坑中。 overhead 垃圾吊车然后将垃圾从坑中移至每个锅炉的进料漏斗。MSW
  在坑中由吊车操作员混合和分拣。灰渣残留物以约 6000 T/月的速率产生。平均垃圾衍生燃料组成见表 G.1。资源回收的示意图如图 G.1 所示。


  管道。斯波坎市 WTE 设施配备了两台相同的锅炉，每台锅炉都有单独的喷雾干燥吸收器（SDA）和单独的布袋过滤器（FF）。石灰制备、稀释水、灰渣去除和雾化空气系统对两台锅炉是共用的。空气污染控制系统中的主要流动路径始于锅炉省煤器处的烟气排放。烟气离开锅炉，含有多种污染物，主要是二氧化硫（SO₂）、液压酸（HCl）和颗粒灰。这些受污染的气体通过管道流向
  SDA 的入口。气体进入 SDA 顶部并向下流经一系列折流板分布网络。折流板用于将气体均匀分布在 SDA 横截面上，在那里它与雾化石灰浆接触。石灰浆吸收大部分酸性气体。清洁气体流向
  SDA 容器底部，在那里转向并流出 SDA 容器侧面。


  ### G.1.1 技术


  垃圾焚烧锅炉燃烧系统设计用于以受控速率将垃圾引入炉膛，并提供必要的过火和欠火燃烧空气，以实现垃圾和可燃气体的适当燃烧。它还设计用于将灰渣惰性残留物输送到灰渣处理系统进行处置，并从换热表面去除烟灰和灰尘颗粒。垃圾焚烧锅炉燃烧系统的燃烧空气处理部分包含必要的设备和控制装置，以提供和调节供给锅炉炉膛用于垃圾燃烧的空气量。它还包含必要的设备和控制装置，以从锅炉炉膛中去除燃烧气体。燃烧系统的空气供给侧由一次和二次鼓风机、蒸汽盘管空气加热器、容积控制挡板和相关管道组成。气体去除侧由诱导通风机和相关


  为消除储存大量无水氨的需要，使用尿素水解器产生用于 NOₓ 控制的 NH₃ 蒸汽。该过程使用 40–50% 重量比的尿素溶液生产氨。尿素溶液由由变频驱动电机驱动的隔膜式计量泵送入水解器。尿素溶液以可变流速泵送以保持水解器中的恒定液位。烟气在离开
  SDA 时含有大量粉尘（灰渣和石灰）颗粒。该气体进入 FF，在那里分配到各个模块（或隔间）。FF 设计为六个隔间。五个隔间对于 100% 负荷是必要的，而六个隔间可在维护时离线。脉冲喷射使用压缩空气脉冲来清洁袋子。清洁周期可以由压降信号或时间周期启动。压降信号是通常的方法。总共使用了四套
  Aldora Technologies, Inc. 提供的连续监测系统（CEMS）来测量来自两台市政废物焚烧炉（MWC）







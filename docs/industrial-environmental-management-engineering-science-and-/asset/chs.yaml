  \ D.1 节）\n\n### 4.10.1 最大日负荷总量（TMDL）规则\n\n根据《清洁水法》（CWA），美国各州需要识别那些未达到特定水质标准或未达到指定有益用途的地表水（USEPA\
  \ 1991a）。在20世纪90年代，根据质量标准或有利用途，发现全国很大比例的水体受损。在很大程度上，\n\n这些水域不适合钓鱼、游泳或饮用。主要原因是来自工业和市政的过量沉积物、SS、营养物质（磷和氮）以及人类病原体。其他原因包括低溶解氧、有毒金属、农药、pH、颜色、藻类和栖息地改变。过量污染物的来源既有点源也有非点源。\n\
  \n最大日负荷总量（TMDL）是指一个水体能够接收并仍能维持该州设定的水质标准的最大污染物量。因此，必须为所有受损水体建立每种关注污染物的 TMDL。TMDL\
  \ 将包括每个点源污染（如污水处理厂排放）的废负荷分配（WLA），以及每个非点源的负荷分配，还包括安全余量（MOS），如式（4.13）和图4.12所示。\n\n\
  ΣWLA + ΣLA + MOS = TMDL (4.13)\n\nTMDL 可以用质量单位表示，如磅/天、毒性单位，或其他度量，如削减百分比。TMDL 的概念如图4.12所示，其中2\
  \ mg/l 的氨氮水质标准和30 MGD的河流流量得出 TMDL 为500 lb/day。在给定农业径流非点源负荷分配为75 lb/day 和 MOS 为50\
  \ lb/day 的情况下，污水处理厂的 WLA 确定为375 lb/day，这将写入污水处理厂的运营许可证。污水处理厂的排放许可证将按不超过该 WLA 的要求制定。\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_165_0.png)\n\n图4.12 最大日负荷总量（TMDL）——一个贡献性组成部分。（a）来源：改编自\
  \ Viessman 等，2009。\n\n**示例4.10 TMDL 计算**\n\n```\nTMDL = ((2 mg / l) × 30 MGD × 8.34\
  \ × (lb / mg) × (1 / MGD)) = 500 lb/day\n```\n\n（其中，mg = 毫克；MG = 百万加仑）重新整理式（4.13）可得：\n\
  WLA = TMDL − LA − MOS = 500 − 75 − 50 = 375 lb/day（答案）\n\n## 4.11 空气污染概况\n\n空气污染交织在我们现代生活的方方面面。作为我们建设城市方式的副产品，空气污染是我们生产商品、交通出行以及产生能源以供暖和照亮我们居住、工作和娱乐城市的剩余废物。所有空气污染物的主要原因是燃烧，而燃烧是我们文明的重要组成部分。当发生完全或理论燃烧时，燃料中的氢和碳与空气中的氧气结合，产生热量、光、二氧化碳和水蒸气。然而，燃料中的杂质、不佳的燃料-空气比或过高或过低的燃烧温度会导致一氧化碳、二氧化硫、氮氧化物、飞灰和未燃烧碳氢化合物等副产物的形成——所有这些都是空气污染物。\n\
  \n空气污染在微观、中观和宏观尺度上都是公共卫生关注的问题（4.11节）。工业源和移动源导致中尺度空气污染，并污染我们室外周围的空气。宏观（或全球）影响包括环境空气污染物长距离输送。宏观影响的例子包括酸雨、臭氧和粉尘或颗粒物（PM）污染。空气污染的全球影响源于可能改变上层大气层的源，例如良好臭氧层的消耗和全球变暖。尽管微观和宏观影响也令人担忧，但我们的重点主要集中在我们生活所在的对流层中的中尺度空气污染。\n\
  \n1970年《清洁空气法》（CAA）要求美国环保署调查并描述固定源和/或移动源排放的任何可能对人类健康和环境产生不利影响的空气污染物的环境影响。美国环保署利用这些研究制定了国家环境空气质量标准（NAAQS）。NAAQS\
  \ 为六种标准空气污染物而制定——其中五种为主要污染物（意指直接排放）和一种次要污染物（因为它是由主要污染物在对流层下部通过化学反应形成的）。\n\n这些标准针对环境空气，即通常包围我们的室外空气。美国环保署将表3.9中列出的污染物称为标准污染物，因为这些标准是基于健康标准制定的。主要标准旨在以“充分的安全余量（MOS）”保护人类健康。次要标准旨在防止环境和财产损害。在环境空气质量与预期经济增长发生冲突时，1974年8月提出了法规，以防止在空气质量已经优于联邦标准要求的地区发生严重恶化。一项阈值分类生效，其目标是任何情况下一个地区的环境空气质量都不得违反联邦主要和次要标准。分类如下：\n\
  \n- **I 类区**：几乎不允许改变当前空气质量的区域（例如国家公园和受保护的荒野地区）\n- **II 类区**：允许适度改变，但需要严格空气质量约束的区域（例如住宅区）\n\
  - **III 类区**：允许实质性工业发展，并且污染物浓度增加到达到联邦标准将不显著的区域\n\n1987年，美国环保署修订了 NAAQS，用空气动力学直径小于或等于10µm的总悬浮颗粒物替代了碳氢化合物（或VOCs）的标准。该标准被称为\
  \ PM10 标准。1997年增加了新的 PM2.5 标准。图4.13有助于您直观了解微米的大小。请注意，一根头发的平均直径约为80 µm。\n\n### 4.11.1\
  \ 原因、来源和影响\n\n在本节中，我们将简要讨论一些主要污染物及其原因、来源和影响。原因与来源的区别在于：原因是根本性的，而来源是位置性的；也就是说，原因解释了污染物为什么或如何形成，而来源则识别什么类型的工艺、行业或设备排放特定污染物。\n\
  \n标准空气污染物，或称标准污染物，是一类导致烟雾、酸雨和其他健康危害的空气污染物。这些污染物通常来自工业、化学品、采矿、交通、发电、炼油厂、冶炼厂、制药、农业等众多来源。在大多数情况下，它们是化石燃料燃烧或工业过程的产物。表3.8\
  \ 中已讨论并列出了这些污染物的来源及其对公众健康和环境的影响。\n\n五种主要标准污染物是 *直径小于* 10 *μm 的颗粒物和直径小于 2.5μm 的颗粒物*（PM-10\
  \ 和 PM-2.5）、*二氧化硫 (SO₂)、二氧化氮 (NO₂)、一氧化碳 (CO) 和颗粒态铅 (Pb)；* 次要标准污染物是 *臭氧 (O₃)。* 在这六种污染物中，前四种在美国（和其他大型工业化国家）的年排放量以数百万吨计，有时被称为\
  \ *主要* 一次污染物。另一类污染物——挥发性有机化合物（VOCs）——虽然不是标准污染物，但因其排放量大（包括人为源和生物源）以及在对流层臭氧形成的大气反应中的重要性，而被认为是一种重要的主要一次污染物。\n\
  \n表4.7列出了2006年和2016年美国五种主要一次污染物的主要来源（包括工业源、固定源和移动源）的排放率数据。从表4.7中我们可以看到，汽车、卡车、公共汽车、摩托艇、草坪和花园设备、工程车辆和其他来源的排放量分别约占美国所有\
  \ NOₓ 排放量的61%和 VOC 排放量的42%，以及所有 CO 排放量的80%以上。在国际上，随着人口持续增长，特别是在亚洲和南美，移动源污染的重要性增长速度甚至快于工业污染。因此，移动源的空气污染逐年加剧。在世界各国，机动车约占空气污染总排放量的10%–60%。这里我们重点关注固定源的空气排放及其对所有主要一次污染物的工业规模最佳可用控制技术（BACT）（另见6.7.1节）。\n\
  \n### 4.11.2 空气毒物：有毒空气污染物\n\n修正案第三章涉及空气毒物。有毒空气污染物（TAPs）或空气毒物，也称为危险空气污染物（HAPs），是已知会对人类健康产生不利影响（如癌症）的空气传播污染物。目前，CAA\
  \ 的 HAPs 或 TAPs 清单上识别出约189种化学物质（表C.2）（USEPA 1998）。空气毒物的例子包括重金属汞和铬，以及有机化学品，如苯、己烷、全氯乙烯（perc）、1,3-丁二烯、二噁英和多环芳烃。HAPs\
  \ 受《国家危险空气污染物排放标准》（NESHAP）计划监管，并被确定为多种疾病的致病因素。例如，砷、石棉、苯、焦炉排放物和放射性核素可能导致癌症。修正案第三章要求美国环保署\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_167_0.png)\n\n图4.13 微小颗粒物的相对尺寸（以微米为单位）。\n\

  = 400 / 6 = 66.7 g/当量（表4.3）\n\n## 示例4.1 计算硫酸铁的分子量和当量\n\n所列化学品中，俗名（例如硫酸铝的俗名明矾）放在括号内。对于用于水处理的化学品，仅给出一种常见用途；许多化学品还有其他未列出的应用。表中提供了处理过程中涉及的化合物及某些组合（如Ca(HCO<sub>3</sub>)<sub>2</sub>）的当量。\n\
  \n## 4.4 检查和取样的目的与目标\n\n作为*国家污染物排放消除系统*（NPDES）许可证持有者，每个拥有经批准的预处理方案的工业设施，无论是否与公有处理厂（POTW）合作，都必须实施其合规监测方案，该方案应当：(i)\
  \ 满足《通用预处理条例》的要求和意图；(ii) 在确定是否符合类别标准、地方限值和排放禁令方面有效且及时；(iii) 提供满足向POTW、州和/或美国环保署报告要求所需的代表性数据；(iv)\
  \ 提供在POTW、州或联邦政府采取执法行动时可在法庭上采纳的采样数据。\n\n具体而言，工业设施合规监测方案的目标如下：\n\n- 评估工业用户合规情况\n\
  \  - 核实工业用户自我监测数据的完整性、准确性和代表性，以及是否使用了所要求的采样和分析技术。\n  - 核实适用以生产量为基础的类别工业用户的生产量/流量，以验证准确的等效浓度许可限值。\n\
  \  - 确定是否符合所有适用要求，如工业用户许可条件和下水道使用条例的规定。\n  - 评估最佳管理实践（BMPs）和污染防治措施。\n  - 评估工业用户的标准操作规程（SOPs）、化学废物处理程序、预防性维护计划、工艺/预处理设备和一般内务管理。\n\
  \  - 确定工业用户是否已纠正先前检查中发现的问题。\n  - 支持针对不合规工业用户的过去和未来执法行动，包括确保工业用户遵守先前执法行动所施加的义务。\n\
  \  - 评估溢出和骤变排放的可能性，并评估骤变排放控制措施的有效性。\n  - 评估工业用户危险废物管理和处置实践的充分性。\n  - 考虑其他法规或条例的潜在合规问题[例如《职业安全与健康管理局》（OSHA）法规、《资源保护和回收法》（RCRA）等]。\n\
  \n- 制定和修订工业用户许可要求\n  - 确认适用于该设施的适当类别标准。\n  - 确认最新许可申请（或调查表）中有关工业用户运营信息的准确性。具体而言，确保所用原材料和化学品、生产、处理、处置实践以及所有废物流均被准确记录在申请（或调查表）中。\n\
  \  - 评估工业用户对POTW进水、处理工艺、污泥和出水的影响（包括出水对水质的影响）。\n  - 评估工业用户自我监测方案和许可的充分性，并酌情支持许可修订。\n\
  \  - 确认综合工艺说明和废水流量示意图与工业用户当前运营情况相符（即两者是否有任何未报告的变更？）。\n  - 评估并记录污染防治（也称为P2）活动和机会（源头削减、环境管理体系（EMS）、BMPs、水/能源回用/节约、现场回收等）。\n\
  \  - 为制定工业用户的采样要求（高于联邦最低要求）提供依据。\n  - 评估工业用户对其预处理系统的运行和维护（O&M）活动的充分性。\n\n- 维持强有力的地方预处理方案\n\
  \  - 评估修订地方限值的必要性。\n  - 向受监管群体告知预处理要求。\n  - 维护每个受监管工业用户的最新数据。\n  - 生成POTW在向审批机构提交的年度报告中可使用的数据。\n\
  \  - 与工业用户建立并保持良好的工作关系。\n  - 在现场保持存在感，使工业用户认识到POTW对其监管监督职责的严肃态度。\n\n工业用户采样和检查是POTW预处理合规与执法方案的基石。检查人员的到访有助于确立POTW作为监督受监管行业行为的负责任公共机构的角色。如果检查人员不在现场，违反联邦、州或地方法律的工业工艺/做法可能会危及POTW、环境和公众健康。检查人员可能是POTW中唯一定期访问工业用户设施的人。此外，知晓可能随时进行突击检查，会促使工业工厂管理人员保持运营合规。\n\
  \n### 4.4.1 分析方法\n\n拥有经批准的预处理方案的POTW，可自行决定（依据其地方条例和法规的授权）要求其间接排放者在进行分析时达到特定的最低水平，或要求使用特定的分析方法。\n\

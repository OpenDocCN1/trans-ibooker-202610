  \n## 7.8.4 硫排放的回收与控制\n\n硫通常被认为是化学工业的四种基本原料之一。它可以从脱硫和硫回收工艺中作为副产品回收（Kirk和Othmer，2004）。历史上，硫回收工艺专注于去除硫化氢（H₂S）和二氧化硫（SO₂）并将其转化为单质硫，因为这些物质是制浆过程中的重要排放物。有多种工艺可用于去除燃烧气体中的SO₂。将SO₂直接催化氧化为SO₃，随后SO₃在水中吸收生成硫酸，是一种替代方法（Paik和Chung，1996）。全厂总还原硫（TRS）排放的10–20%来自粗浆洗涤器、泡沫槽、黑液过滤器、氧化槽和储罐的排气物流，这些通常不被不凝性气体系统收集（Pinkerton，1999）。这些来源的排放物可以收集并燃烧以回收能量，从而减少TRS和挥发性有机化合物（VOCs）的大气排放。\n\
  \n### 7.8.4.1 减少淡水使用及化学品回收与再利用为纸浆厂节省百万美元\n\n废水排放\n在纸浆厂废水排放到环境之前，必须进行处理。一级处理使用沉淀池或沉淀罐，使悬浮固体从液体废水中沉降出来。固体可以堆肥并撒在土地上、转化为其他有用的产品，或焚烧处理。二级废水处理包括在面积广阔的浅水池中进行氧化和曝气，或在较小的区域使用机械搅拌器和曝气器在排放前对液体进行充氧。生物过滤系统可用于去除有机化合物和重金属，通常可以通过添加营养物质和使用纯氧而非空气来加速该过程。在一些地区，已设计天然湿地系统来实现这一目标。其他处理方法包括石灰混凝和升高pH值，使有机色体以木质素钙盐的形式沉淀。一旦沉淀，污泥经脱水后焚烧以破坏有机物。\n\
  \n据NCASI报告，1975年至1988年间，纸浆厂的废水流量减少了30%。同一时期，最终废水的5日生化需氧量（BOD）和总悬浮固体（TSS）分别减少了75%和45%（NCASI，1991）。表7.5列出了1975年、1985年和1988年的数据。随着纸浆和造纸厂实施集群规则所要求的所谓最佳管理计划（BMP），这些减少将持续下去。\n\
  \n# 表7.5 纸浆和造纸厂的废水排放\n\n|  | 1975 | 1985 | 1995 |\n|---|---|---|---|\n| 废水流量（加仑/吨）\
  \ | 22 800 | 17 200 | 16 000 |\n| 生化需氧量（磅/吨） | 18.0 | 4.8 | 4.4 |\n| 总悬浮固体（磅/吨）\
  \ | 13.0 | 8.3 | 7.1 |\n\n来源：引自Das（1997）。\n\nBMP将要求更好地管理工艺损失和泄漏，并有望减少废水排放。例如，在约10年时间里，辛普森塔科马硫酸盐浆厂通过各种污染预防方法将淡水消耗减少了约50%（K.\
  \ Schumacher和M. Mammenga，个人通讯；USEPA 1992a，b）。\n\n辛普森塔科马工厂现在每天使用约1800万加仑（mgd）淡水，而1990年代为每天3200万加仑。这一淡水用量的减少每年节省约192万美元（350美元/百万加仑，塔科马市按平均固定和可变成本收费）。工厂还通过减少氢氧化钠（NaOH）流入下水道和产品纤维的损失来节省资金，具体措施包括阻止稀弱洗NaOH溶液溢出以及回收工艺水。否则，工艺中需要补充NaOH以弥补损失的碱（钠）。每年节省约340万美元（基于NaOH\
  \ 375美元/吨和每天节省25吨NaOH）。辛普森公司还通过减少黑液硫流入下水道和烟囱的损失，每年节省18万美元（K. Schumacher和M. Mammenga，个人通讯）。\n\
  \n其他公司通过安装纤维回收装置（从工艺水中分离纤维的装置）、换热器和其他允许更多回用工艺水的设备来节约用水。内部水净化系统使得用过滤后的白水替代清水成为可能。将工艺冷却水与清水分离通常是实现运行和水资源利用平衡所必需的。\n\
  \n### 7.8.4.2 用于废水回收利用的盐水浓缩器\n\n盐水浓缩器是蒸汽压缩蒸发器系统，可产生蒸馏水和非常小的盐浓缩物流。这些系统非常适合水回收利用，因为浓缩物流量非常小，可以经济地处理废水，实现非常高的回收率且无液体排放（Dalan，2005）。\n\
  \n迷你案例研究\n拯救科罗拉多河\n盐水浓缩器市场最初因联邦清洁水法规而兴起。科罗拉多河是美国西南部主要的饮用和灌溉水源，由于人类活动，其盐度不断升高。正是为了控制这里和其他地方的环境损害，美国环保署（USEPA）在20世纪70年代颁布了法规，限制向科罗拉多河排放废水，并禁止新建无法实现向河中零排放水的工厂。\n\
  \n为遵守法规，使用河水的新建和现有电厂都必须回收利用其废水。虽然蒸汽压缩作为能源在工业中并不新鲜，但与电厂的技术契合是自然而然的，因为它允许这些设施使用自己产生的电力作为水回收所需机械能的来源。\n\
  \n联邦法律并不是促使工业界转向使用盐水浓缩器回收废水的唯一因素。在全国各地，还存在当地的选址法规。因此，随着20世纪90年代初私营电力行业的出现，企业家们转向零排放水系统，这使他们能够使用远离排放点、供水有限的场地。同样，转向清洁燃烧的天然气降低了对电厂选址靠近燃料或水源的要求。\n\
  \n截至2004年，美国约有60台盐水浓缩器。它们作为成套装置销售，设计建造遵循节能原则。最初的所有设备都位于燃煤电厂，但随着金属冶炼厂、化学品和半导体制造商以及其他企业开始认识到消除废水排放的必要性，盐水浓缩技术的应用已得到推广。\n\
  \n### 7.8.4.3 盐水浓缩器系统的经济性\n\n基于盐水浓缩器系统的参数化成本信息，我们现在概述这些系统的一些经济方面。\n\n盐水浓缩器，以及延伸的集成式零液体排放系统，只有在以下情况下才对新建（grassroots）设施有意义：\n\
  \n-   存在地表水或井水短缺\n-   设施需要水才能运行\n-   没有废水排放选项，例如饮用水源或河流\n-   无法获得排放许可\n\n零液体排放消除了选址限制；也就是说，不再需要将工厂建在大型可用水源或合适的排放点附近。这种效果的经济优势很难一概而论，因为其非常依赖于实际情况。\n\
  \n零排放设施的净现值（NPV）为负。Dalan和Rosain（1992）发现，一台265加仑/分钟的盐水浓缩器的运行成本为8.94美元/1000加仑处理水（总计每年1\
  \ 252 600美元），而额外除盐器再生化学品的避免成本为每年216 000美元。避免成本为1.54美元/1000加仑。由于这里的任何金额均为运营费用，现金流量（CF）为负。\n\

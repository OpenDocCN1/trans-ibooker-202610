  200T/天 TMP 工厂的分析。在不同情景和对公用事业成本、设备需求和运营成本的假设下，净节省可从每吨浆料生产的 10 美元到超过 26 美元不等，预计资本投资为
  250 万美元。受磨木机限制的工厂，由于磨木机能量减少，可以将磨木机运行到恒定的总功率负荷，从而使产量提高超过 30%。即使产量仅 modest 提高 10%，再加上
  30% 的节能，也能在不到 1 年内收回成本。这相当于在资本 15% 的回报率下节省 34 美元/吨。此外，许多工厂将机械浆和硫酸盐浆混合以达到所需的光学和强度性能。当预期强度更高的生物制浆
  TMP 部分替代硫酸盐浆，替代率为 5% 时，还可实现超过 10 美元/吨的额外收益。600T/天分析的结果也已发表（Scott et al. 1998a, b）。该初步分析需作适当限定。资本成本存在一定变异性，特别是与将新设施整合到现有厂址相关的成本。生物制浆的额外优势，包括环境效益和松香减少，在本报告中尚未量化。最后，大部分分析是特定于现场的，取决于考虑将生物制浆纳入其运营的特定工厂的运行条件。


  尽管生物制浆对机械制浆的环境效益尚未从经济角度定量确定，但我们可以定性地讨论其效益。Sykes (1994) 确定生物制浆工艺的排放物没有环境问题。就温室气体而言，生物制浆工艺具有净效益。该工艺本身是氧化性的，随着真菌代谢各种木质成分会产生二氧化碳。然而，基于电力产生的典型发电效率，减少的能源需求（~30%）显著降低了整个系统分析时的总体二氧化碳产生量。最后，就在木场使用真菌的生物学问题而言，使用生物制浆菌群是有益的。生物制浆真菌会
  outcompete 在不受控制的木屑堆中生长的正常真菌和其他生物。其中一些其他生物，如曲霉，可能对人类健康有害。生物制浆真菌在世界各地的森林中自然存在，对人类没有已知的健康影响。有关化学工艺和制造业的成本效益分析以及经济投入产出模型（EIO-LCA）的更多信息可在附录
  F 中找到。


  ## 6.4.3.7 使用 USEPA 模型 TRACI 进行定量分析


  用于化学品和其他环境影响的减少与评估的工具（TRACI）及其历史、其所纳入的研究和方法、以及其在各个影响类别中提供的见解进行了描述。


  TRACI 是一种由美国环境保护署（USEPA）开发的独立计算机程序，可促进对具有潜在影响的环境压力源进行表征，包括臭氧层破坏、全球变暖、酸化、富营养化、对流层臭氧（烟雾）形成、生态毒性、人类健康标准相关影响、人类健康致癌影响、人类健康非致癌影响、化石燃料枯竭和土地利用影响。TRACI
  最初是为与 LCA 一起使用而设计的，但预计未来将在更广泛的应用中找到（Bare 2003；UNEP-SETAC 2000）。


  气味、噪音、辐射、废热和事故等类别不在 USEPA 的管辖范围内，通常由于各种原因不包括在美国的案例研究中，包括也许是因为这些类别的 perceived 威胁通常被认为很小、局部或难以预测。资源枯竭类别被认为在美国具有重要意义，尤其是在化石燃料、土地和水使用方面。


  为开发 TRACI，每个上述影响类别都被考虑，并对其当前的发展状态和 perceived 社会价值进行了评估。臭氧层破坏、全球变暖、人类毒理学、生态毒理学、烟雾形成、酸化和富营养化等传统污染类别被纳入
  TRACI，因为 USEPA 内的各种计划和法规都认可减少这些类别影响的价值。人类健康类别进一步细分为致癌、非致癌和标准污染物（最初侧重于颗粒物），以更好地反映可再生燃料和购买电力的重点使用。废水处理厂和其他生物过程的排放不包括在内。在华盛顿州，纸浆和造纸厂使用的
  60% 能源由可再生资源产生（几乎全部来自水电），40% 来自购买的电力，该电力由天然气、煤炭和石油产生。可再生能源来源的 CO₂ 排放假设为零。假设典型的燃烧效率为
  70%，电力传输效率为 60%。在计算非可再生来源的 CO₂ 排放时，总体效率因子为 42%，用于向纸浆厂供电的发电厂。


  USEPA 法规以及允许与美国法规、手册和指南一致的方法开发（USEPA 1989b, c）。烟雾形成影响保持独立，未与其他人类健康影响进一步汇总，因为与烟雾形成相关的环境影响在汇总过程中会被掩盖和/或丢失。标准污染物作为单独的人类健康影响类别得以保留，允许采用一种建模方法，该方法可以利用与这些研究充分的
  impact 相关的大量流行病学数据。



  burner firing) to 2 ppm, the cost effectiveness is $13,627/T of NOₓ removed (Catalytica
  Energy Systems Inc. 2004).


  ### 6.8.2.3 XONON


  Several companies are reported to be working on a second technology for the control
  of NOₓ. Introduced commercially by Catalytica Combustion Systems, it is being marketed
  under the name XONON. This technology replaces traditional flame combustion with
  flameless catalytic combustion. NOₓ control is accomplished through the combustion
  process using a catalyst to limit the temperature in the combustor below the temperature
  where NOₓ is formed. The XONON was demonstrated to achieve near-zero emissions.
  The XONON combustion system consists of four sections: (i) the preburner, for start-up,
  acceleration of the turbine engine, and adjusting catalyst inlet temperature if
  needed; (ii) the fuel injection and fuel-air mixing system, which achieves a uniform
  fuel-air mixture to the catalyst; (iii) the flameless catalyst module, where a portion
  of the fuel is combusted flamelessly; and (iv) the burnout zone, where the remainder
  of the fuel is combusted.


  The single field installation of the XONON technology at a municipal power company
  is being used to perform engineering studies of the technology at Silicon Valley
  Power, in Santa Clara, California. NOₓ emissions are well below 2.5 ppm on the 1.5
  MW Kawasaki M1A-13A gas turbine. Catalytica has a collaborative commercialization
  agreement with General Electric Power Systems, committing to the development of
  XONON. In conjunction with General Electric Power Systems, the XONON system was
  specified for use with the GE 7FA turbines at the proposed 750 MW natural gas-fired
  Pastoria Energy Facility, near Bakersfield, California. The project entered commercial
  operations in 2003. Because the NOₓ emissions limitations of 2.5 ppm have been demonstrated
  in practice by a commercial facility, this technology is considered commercially
  available at this time (Catalytica Energy Systems Inc. 2004).


  ### 6.8.2.4 Selective Catalytic Reduction


  SCR systems selectively reduce NOₓ by injecting ammonia (NH₃) into the exhaust gas
  stream upstream of a catalyst. NOₓ, ammonia, and oxygen react on the surface to
  form molecular nitrogen (N₂) and water. The overall chemical reaction can be expressed
  as


  $$4NO + 4NH_3 + O_2 \rightarrow 4N_2 + 6H_2O$$


  Parallel plates or honeycomb structures, permeated with the catalyst, are installed
  in the form of rectangular modules, downstream of the gas turbine in simple-cycle
  configurations, and into the heat recovery steam generator (HRSG) portion of the
  gas turbine downstream of the superheater in combined-cycle and cogeneration configurations.


  The turbine exhaust gas must contain a minimum amount of oxygen and be within a
  somewhat narrow temperature range in order for the SCR system to operate properly.
  The temperature range is dictated by the catalyst: if it is too low, the reaction
  efficiency drops and increased amounts of NOₓ and ammonia are released from the
  stack; if it becomes too high, the catalyst may begin to decompose. Turbine exhaust
  gas is generally too hot to be passed through the catalyst, so it is cooled by the
  HRSG, which extracts energy from the hot turbine exhaust gases and creates steam
  for use in other industrial processes or to turn a steam turbine. In simple-cycle
  power plants where no heat recovery is accomplished, high temperature catalysts
  (e.g. zeolite) are an option. SCR can typically achieve NOₓ emission reductions
  in the range of about 80–95%.


  SCR is the most widely applied post-combustion control technology in turbine applications
  and is currently accepted as LAER for new facilities located in ozone non-attainment
  regions. It can reduce NOₓ emissions to as low as 4.5 ppmvd for standard combustion
  turbines without duct burner firing and as low as 2–2.5 ppmvd when combined with
  lean-premix combustion (again without duct burner firing). SCR uses ammonia as a
  reducing agent in controlling NOₓ emissions from gas turbines. The portion of the
  unreacted ammonia passing through the catalyst and emitted from the stack is called
  ammonia slip. The ammonia is injected into the exhaust gases prior to passage through
  the catalyst bed. There is also a potential for increased particulate emissions
  from formation of ammonia salts. SCR may also result in the generation of spent
  vanadium pentoxide catalyst, which is classified as a hazardous waste. In addition,
  there is an energy loss from the performance loss due to the pressure drop across
  the SCR catalyst.


  Gas turbines using SCR typically have been limited to 10 ppmvd ammonia slip (emissions
  of ammonia that has not reacted with nitrogen) at 15% oxygen. However, levels as
  low as 2 ppmvd at 15% oxygen have been proposed and guaranteed by control equipment
  vendors. In addition, Massachusetts and Rhode Island have established ammonia slip
  LAER levels of 2 ppmvd. Massachusetts has permitted at least two large gas turbine
  power plants using SCR reduction with 2 ppmvd ammonia slip limits. California recommended
  the establishment of ammonia slip levels below 5 ppmvd at 15% oxygen on the basis
  of guarantees from control equipment vendors of single-digit levels for ammonia
  slip.


  Data supplied by the vendor show that when NOₓ is reduced from 15 ppm (gas turbine
  with duct burner firing) to 3.5 ppm, the cost effectiveness is $9,473/T of NOₓ removed.



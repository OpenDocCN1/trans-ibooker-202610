  %$ | 81.86% |\n\n我们这一代面临的挑战是在环境恶化导致长期经济衰退之前扭转这些趋势，正如许多早期文明所经历的那样。\n\n## 7.14.1 什么是可持续经济？\n\
  \n环境可持续经济——生态经济——要求在制定经济政策框架时遵循生态学原理，并且要求经济学家认识到，所有经济活动，实际上所有生命，都依赖于地球的生态系统——即相互共存、相互作用并与其物理栖息地相互影响的众多物种所构成的复杂整体。数以百万计的动植物物种处于一种精妙的平衡之中，通过养分循环、水循环和全球气候系统沿食物链交织在一起。经济学家懂得如何将目标转化为政策。经济学家和生态学家，连同工程师、科学家和政策制定者，正面临共同设计和建设一种生态经济的挑战，这种经济能够维持进步（Brown\
  \ 2001a, b; Western Governors’ Association, 2004年12月3日）。\n\n通过工业生态学、生态工业园区、生态效率、零排放制造，以及利用农业原料（生物可再生资源）设计新产品，一种促进可持续经济进步的生态经济，为长期实现可持续经济和健康星球提供了潜力。人类直到最近才走出生物环境来满足其大部分物质需求。就在150年前，植物基资源还是西方能源、有机化学品和纤维的主要来源，并且至今在许多发展中国家继续发挥着重要作用。\n\
  \n向非生物（或不可再生）能源和材料来源的转型在世界历史上是相对迅速而新近的。生物可再生资源按定义属于可持续的自然资源；也就是说，它们以一定的速度自我更新，确保后代能够使用。生物可再生资源可以转化为生物能源或生物基工程产品。生物能源，也称为生物质能源，是将生物可再生资源的化学能转化为热能和固定电力的结果。生物基产品包括源自生物可再生资源的运输燃料、化学品和天然纤维。运输燃料通常是液体燃料，如乙醇或生物柴油，但压缩氢气和甲烷也被提出并评估用于车辆推进。\n\
  \n化学品可包括药品、营养保健品和其他精细化学品，但这里重点是\n\n## 7.14 可持续经济与地球\n\n经济与地球自然系统相冲突的证据，可以从每日新闻报道中看到：渔业崩溃、森林萎缩、土壤侵蚀、牧场退化、沙漠扩张、二氧化碳浓度上升、地下水位下降、气温升高、破坏性更强的风暴、冰川融化、海平面上升、珊瑚礁死亡和物种消失。这些趋势标志着经济与地球生态系统之间关系日益紧张，并造成越来越大的经济损失。在某一点上，这可能会压垮全球进步的力量，导致经济衰退。这\n\
  \n![](img/009e9fca58d02c8d25e9fb0817ce46c9_374_0.png)\n\n图7.9 不同种类生物可再生资源的供给曲线示例。\n\
  \n大宗化学品，它们对生物可再生资源产生高需求。例如，聚乳酸，它由玉米淀粉水解糖发酵制得，并可转化为用于地毯等各类消费产品的生物基聚合物。\n\n生物可再生资源的成本与其需求量通过供给曲线相关联。图7.9是三种生物可再生资源供给曲线的概括性表示。生物可再生资源的成本变化很大，且取决于当地的供需状况。对于加工残余物和废物的成本而言尤其如此。表7.13提供了几种残余物和废物的可得性与成本估算，并对几种作物的成本进行了比较。另一方面，专用能源作物的种植和收获适合采用标准化的成本估算，因为关于“单元操作”（如种植、施肥和收获）的信息可以很容易地从权威来源获得（Brown\
  \ 2001b）。\n\n### 7.14.2 各种生物基产品与能源的制造成本\n\n在接下来的几十年里，更大比例的燃料、化学品和材料将由可再生植物原料生产。这些生物基工业产品为基于环境友好型产品的更可持续经济提供了潜力。本节简要介绍利用生物可再生资源从各种原料生产电力、燃料和化学品的相关成本。\n\

  md: 'That is basically the difference between static and dynamic linking. A typical
    program needs to read and write the contents of files, open windows, collect input
    from the user, or send messages across the network. These are common enough tasks
    that they are usually available as functionality in libraries provided by the
    operating system. When you wish to use a function from one of them, you would
    tell the linker to allow for runtime linking. Otherwise it would complain about
    missing symbol references.


    At runtime, the operating system will search its configuration path that tells
    it where to find these shared libraries. Prior to initiating the program, they
    will map the functionality from the libraries into a memory location that can
    be dynamically linked to the rest of the code.


    There are many reasons for this approach. The first being just efficiency. Let’s
    say you have a function called a () that is referenced by a dozen or more other
    programs. With static linking each executable has its own copy. Programs take
    up more disk space. Their memory footprints at runtime are also going to be larger.
    It is just not an efficient use of space.


    If the dynamic library is loaded into a shared memory space, then presumably we
    only need one copy of one version of the file on disk. Depending on the complexity
    of your operating system, you might only need one copy in memory at a time too.


    Dynamically-linked libraries often have their own release cycles. If you were
    using a system library from one of your executable programs, you might update
    your operating system and get a new version of the library with a patch for a
    security issue. As long as the numbering mechanism works out and it is backwards-compatible,
    presumably you could strengthen the security of your application by using the
    patched version without having to do anything else.


    Look at Example 7-1. This is a function on its own without a main () function.
    It is intended to be used as a library. We could compile it into a static library,
    but for now we will just create the object code and link our'

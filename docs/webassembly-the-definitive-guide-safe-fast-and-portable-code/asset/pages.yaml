    \nWebAssembly.instantiate(typedArray).then(result => {\n  const howOld = result.instance.exports.howOld;\n\
    \  let age = howOld(2021, 2000);\n  console.log('You are: ' + age);\n});\n```\n\
    \nRunning this gives the following.\n\n```\nbrian@tweezer ~/g/w/s/c/zig> node\
    \ main.js\nYou are: 21\n```\n\nA more interesting example is shown in Example\
    \ 17-9, which is taken from the Zig website and highlights its WASI support. In\
    \ this case, we demonstrate the use of capabilities-based security and controlled\
    \ access to the command line and file system by printing out which directories\
    \ our code has access to as a list of preopens to the runtime.\n\n# Example 17-9.\
    \ A WASI-targeted Zig application using console and potentially file system access\n\
    \n```\nconst std = @import(\"std\");\nconst PreopenList = std.fs.wasi.PreopenList;\n\
    \npub fn main() !void {\n    var general_purpose_allocator =\n    std.heap.GeneralPurposeAllocator(.{}){};\n\
    \    const gpa = &general_purpose_allocator.allocator;\n\n    var preopens = PreopenList.init(gpa);\n\
    \    defer preopens.deinit();\n\n    try preopens.populate();\n```"

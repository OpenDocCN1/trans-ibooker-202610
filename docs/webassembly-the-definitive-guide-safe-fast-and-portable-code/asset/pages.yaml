    choreography across the HTML spec, the ES6 module spec, implementations, JavaScript
    bundlers, and the larger Node.js community. I suspect that it will not be much
    longer before we see some forward motion on this proposal.


    Now that we have looked at the structural elements of a WebAssembly binary, you
    should feel comfortable inspecting your own and third party modules either manually
    or programmatically. The next step is to look at the more dynamic elements of
    WebAssembly modules. We will start by focusing on Memory instances as the means

    # Future ES6 Module Integration


    While it is obviously useful to be able to work through the JavaScript API as
    we have seen, it is low-level and repetitive which is why we put it in a reusable
    utility script file. In the future, we expect it will be even easier to use WebAssembly
    modules from HTML because they will be available as ES6 modules.


    This is a bit tricky because of the need for top-level asynchronous handling and
    how graphs of modules are loaded in three phases for construction, instantiation,
    and evaluation. There are slight differences between the binary WebAssembly and
    JavaScript-based module validation processes, when compilation happens, and how
    module environment records are traversed and linked.


    There is a proposal to add support to the platform to smooth over these differences.
    At the time of writing, this is in “Stage 2” of the proposal process¹⁰. Lin Clark
    has a nice walkthrough of the complexity here: https://www.youtube.com/watch?v=qR_b5gajwug.


    The goal is to introduce a declarative form that would look something like what
    you see in Example 3-9.


    Example 3-9. Proposed declarative form for loading WebAssembly Modules


    ```

    import {something} from "./myModule.wasm";


    something();

    ```


    Not only will this have the benefit of simplifying the instantiation of WebAssembly
    modules, it will also facilitate their participation in graphs of JavaScript module
    dependencies. Developers will have an easier time intermixing behavior expressed
    in multiple languages as complete solutions if there are not distinctions to how
    they are managed as dependencies.'

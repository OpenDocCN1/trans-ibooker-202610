    \ it is also key to having the host environments be able to pass in opaque references\
    \ referring to resources we do not want the WebAssembly modules to necessarily\
    \ have raw access to. Keep in mind that we are talking about being able to pass\
    \ in arbitrary references to arbitrary structures in arbitrary languages on arbitrary\
    \ operating systems. Trying to be both this flexible and performant is no easy\
    \ task!\n\nWe have been able to make references previously, but only to functions\
    \ and only in Table instances which we could not manipulate once they were created.\
    \ This was in part to disallow the modules from manipulating sensitive details\

  img_proc: true
- pgno: 97
  md: '![](img/16b7990eb0dbf589db177bdbd2f4a189_97_0.png)


    Figure 5-1. The LLVM pluggable compiler architecture


    Any one of these layers may be swapped out for something else. As I mentioned
    above, languages such as Rust, Julia and Swift use the LLVM infrastructure. This
    keeps language authors from having to start from scratch every time. They need
    to write new front end parsers, but can leverage much of the existing optimization
    and backend work. Compiler researchers can develop new optimizations and test
    them in isolation before making them available for use on the IR of arbitrary
    input languages. For our purposes, the backend is the most important swappable
    layer. On Linux or Windows, native versions of the same first two layers could
    be used but there would also be a machine-specific backend.


    You can usually generate a different backend than the native runtime of your computer
    through a process known as cross-compiling. This is useful for targeting embedded
    systems that may not have a developer toolchain installed. This is also useful
    in continuous integration and delivery systems so you can target multiple platforms
    from the same build environment. Otherwise you might need a separate build environment
    for every target platform.


    The Emscripten toolchain was developed for asm.js work and was based upon LLVM
    and clang so it only had to emit the optimizable subset of JavaScript to allow
    C programs to run in the browser. When the WebAssembly instruction set and platform
    were ultimately defined, in essence, they merely had to add a WebAssembly backend
    to emit that instead. We will introduce this toolchain in the next chapter, but
    hopefully you are getting the picture of how higher level languages can be compiled'
  merge: -1
  img_proc: true

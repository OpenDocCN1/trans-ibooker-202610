- pgno: 164
  md: '# Chapter 8. WebAssembly in the Server


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 8th chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at wasmbook@bosatsu.net.


    > I felt extremely uncomfortable as the focal point, in the spotlight. I really
    like the behind the scenes role, because all my freedom is there.

    > —Brian Eno


    My career started in the user interface world. I first worked on an X/Motif¹ application
    to control Network Matrix Switches. From there, I went on to a Whole Earth visualization
    environment capable of displaying terabytes of terrain data and hyperspectral
    imagery. Not only was this fun from a 3D visualization perspective, but we were
    inspired by Doug Young at Silicon Graphics to build the entire application around
    the Command Pattern² a year before the “Gang of Four” “Design Patterns” book emerged.


    Working on software that humans sat down and used was a fun and rewarding experience
    most of the time. You could genuinely make people’s lives easier and less stressful
    by putting some thought into how they went about their work tasks. Despite these
    positives, it had its drawbacks as well.'

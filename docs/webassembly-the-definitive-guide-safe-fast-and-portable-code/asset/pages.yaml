- pgno: 67
  md: '# Chapter 4. WebAssembly Memory


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 4th chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at wasmbook@bosatsu.net.


    > Perhaps one day this too will be pleasant to remember.

    > —Virgil


    If WebAssembly is going to behave like a regular runtime environment, it needs
    a way to allocate and free memory for its data handling activities. In this chapter
    we will introduce you to how it emulates this behavior for efficiency but without
    the risk of typical memory manipulation problems seen with languages like C and
    C++ (even if that is what we are running). As we are potentially downloading arbitrary
    code over the Internet this is an important safety consideration.


    The entire concept of computation usually involves some form of data processing.
    Whether we are spell-checking a document, manipulating an image, doing machine
    learning, sequencing proteins, playing video games, watching movies or simply
    crunching numbers in a spreadsheet, we are generally interacting with arbitrary
    blocks of data. One of the most crucial'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'performance considerations in these systems is how to get the data where it
    needs to be in order to interrogate or transform it somehow.


    Central Processing Units (CPUs) work the fastest when data is available in a register¹
    or an on-chip cache. Obviously these are very small containers so large datasets
    are never going to be loaded onto the CPU in their entirety. We have to spend
    some effort moving data into and out of memory. The cost of waiting for the data
    to be loaded to one of these locations is an eternity in CPU clock time. This
    is one of the reasons they have gotten so complex. Modern chips have all manner
    of multi-pipeline, predictive branching, and instruction rewriting available to
    keep the chip busy while we are reading from a network into main memory, from
    there into multi-level caches and finally where it needs to be used.


    Traditional programs have usually had stack memory to manage short-term variables
    of small or fixed sizes. They use heap-based memory for longer-term, arbitrarily-sized
    blocks of data. These are generally just different areas of the memory allocated
    to a program that are treated differently. Stack memory gets overwritten frequently
    by the ebb and flow of functions being called during execution. Heap memory is
    used and cleaned up when it is no longer needed. If a program runs out of memory
    it can ask for more but it must be reasonably judicious about how it uses it.²
    These days virtual paging systems and cheaper memory make it entirely likely that
    a typical computer might have tens of gigabytes of memory. Being able to quickly
    and efficiently access individual bytes of potentially large data sets is a major
    key to decent software runtime performance.


    WebAssembly programs need a way to simulate these blocks of memory without actually
    giving unfettered access to the privacy of our computer’s memory. Fortunately,
    there is a good story to tell here that balances convenience, speed, and safety.
    It starts with making it possible for JavaScript to access invidual bytes in memory,
    but will expand beyond JavaScript to be a generic way of sharing memory between
    host environments and WebAssembly modules.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# TypedArrays


    JavaScript has traditionally not been able to provide convenient access to individual
    bytes in memory. This is why time-sensitive, low-level functionality is often
    provided by the browser or some kind of plug-in. Even Node.js applications often
    have to implement some functionality in a language that handles memory manipulation
    better than JavaScript can. This complicates the situation as JavaScript is an
    interpreted language and you would need an efficient mechanism for switching control
    flow back and forth between interpreted, portable code and fast compiled code.
    This also makes deployments trickier because one part of the application is inherently
    portable and one needs native library support on different operating systems.


    There is usually a tradeoff in software development: Languages are either fast
    or they are safe. When you needed raw speed you might choose C or C++ as they
    provide very few runtime checks in the use and manipulation of data in memory.
    As a consequence, they are very fast. When you want safety you might pick a language
    with run-time boundary checks on array references. The downside of the speed trade
    off is that things are either slow or the burden of memory management falls to
    the programmer. Unfortunately, it is extremely easy to mess up by forgetting to
    allocate space, reusing freed memory or failing to deallocate the space when you
    are done. This is one of the reasons why applications written in these fast languages
    are often buggy, crash easily and serve as the source for many security vulnerabilities³.


    Garbage-collected languages such as Java and JavaScript free developers from many
    of the burdens of managing memory but often incur a performance burden at runtime
    as a tradeoff. A piece of the runtime must constantly look for unused memory and
    release it. The performance overhead makes many such applications unpredictable
    and therefore unsuitable for embedded applications, financial systems, or other
    time-sensitive use cases.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Allocating memory is not a huge issue as long as what is created is a suitable
    size for what you want to put in it. The tricky part is knowing when to clean
    up. Obviously freeing memory before a program is done with it is bad, but failing
    to do so when it is no longer needed is inefficient and you might run out of memory.
    Languages such as Rust strike a nice balance of convenience and safety. The compiler
    forces you to communicate your intentions more clearly, but when you do, it can
    be more effective in cleaning up after you.


    How this is all managed at runtime is often one of the defining characteristics
    of a language and its runtime. As such, not every language requires the same level
    of support. This is one of the reasons WebAssembly’s designers did not overspecify
    features such as garbage collection in the MVP.


    JavaScript is a flexible and dynamic language, but it has not historically made
    it easy or efficient to deal with individual bytes of large data sets. This complicates
    the use of low-level libraries as the data has to be copied into and out of JavaScript
    native formats which is inefficient. The Array class stores JavaScript objects
    which means it has to be prepared to deal with arbitrary types. Many of Python’s
    flexible containers are also similarly flexible and bloated⁴. Fast traversal and
    manipulation of memory through pointers is a product of the uniformity of the
    data types in contiguous blocks. Bytes are the minimum addressable unit, particularly
    when dealing with images, videos and sound files.


    Numerical data requires more effort. A 16-bit integer takes up two bytes. A 32-bit
    integer, four. Location 0 in a byte array might represent the first such number
    in an array of data, but the second one will start at location 4.


    JavaScript added TypedArray interfaces to address these issues, initially in the
    context of improving WebGL performance. These are portions of memory available
    through ArrayBuffer instances that can be treated as homogenous blocks of particular
    data types. The memory available is constrained to the ArrayBuffer instance but
    it can be stored internally in a format that is convenient to pass to native libraries.'

- pgno: 253
  md: '| Engine | A global context for configuration values intended to be shared
    across threads. |

    | Store | A collection of WebAssembly objects including instances, globals, memories,
    and tables. |

    | Module | The compiled form of a WebAssembly module. |

    | Instance | An instance of the compiled module. |


    The Engine contains any special configuration details. As you see in Example 12-4
    we are just using a default configuration. This is used to create the Store. This
    provides a context for the WebAssembly functionality and is thus a unit of isolation.
    Different WebAssembly structures created in a Store cannot be shared or accessed
    from other Store instances. In the Rust version of the Wasmtime API, mutable references
    to the Store instances are passed into the functions which precludes sharing them
    across threads.


    The Engine is next used to initialize and compile the Module instance. There are
    a variety of mechanisms for retrieving the underlying bytes, but for our purposes,
    we are just reading in the .wat file from the filesystem. Keep in mind we are
    building a native Rust application here, not a WASI application so it will therefore
    be allowed to access the filesystem.


    Once the Module has been compiled, we can create a new Instance of it. In this
    case we are not providing any import objects but we will see examples of sharing
    functions from the Rust host environment to a module below. From the Instance
    we are able to retrieve a reference to an exported function wrapper so that it
    can be invoked almost as if it were a regular Rust function. We use the type safe
    get_typed_func which here takes two i32 parameters and returns an i32 result.


    Finally, we invoke our function with the values 2021i32 and 2000i32 which represent
    Rust 32-bit integer type literals for the numbers “2021” and “2000”. The result
    is captured in a Rust i32 variable and then printed to the console.'
  merge: -1
  img_proc: true

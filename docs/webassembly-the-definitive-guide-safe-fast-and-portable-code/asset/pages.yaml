- pgno: 118
  md: 'accepts char *. C can be pretty flexible by doing automatic type coercions
    between ints, chars, addresses, booleans, and more. It is extremely flexible and
    often very buggy. These chars cannot be bigger than 8-bits so they have a max
    size of 255. We wrap the buffer with a Uint8Array for the convenience of not having
    to worry about that.


    After this, a subarray of type Uint8Array is generated for the portion beginning
    at our “pointer”. This allows us to ignore everything that might have been allocated
    before our array and we can start writing into it conveniently using JavaScript
    numbers. The results of this are dumped to the console to show you what is going
    on.


    The next step is to invoke the reverse() function. This implementation is written
    with the perception that it is just swapping values in memory and remarkably it
    does not have to change. We do not need a return value from this function because
    the array was reversed in place. This is one of the reasons why C can be so fast.
    It avoids creating a lot of unnecessary memory and has very low overhead to retrieve
    values and iterate through memory locations. On the JavaScript side our “pointer”
    will still point to the beginning of the newly reversed array which is dumped
    to the console for clarity.


    In order to show off the sorting functionality, we need some shuffled data. It
    certainly would have been possible to write code like that in C, but we need to
    rely on a random number generator for the shuffling algorithm. That would have
    complicated things for us dependency-wise so we just rely on JavaScript’s support
    for random number generation. You are likely to make decisions to rely on behavior
    from the browser sometimes and rely on code expressed in a WebAssembly module
    at other times.


    A newly-created array is filled, shuffled, and dumped to the console. We write
    the shuffled values back into our C/C++ array at the location indicated by our
    “pointer” and then invoke the mergeSort() functionality. This too is written assuming
    it has access to a location in memory so it efficiently re-orders the data to
    be sorted.'

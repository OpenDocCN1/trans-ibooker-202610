  md: "Look at Example 4-10 to see how we can be more sophisticated. We have two data\
    \ segments now. The first writes the starting position and length of the first\
    \ string followed by the same information for the second one. Because we are using\
    \ the same buffer for the indices and the strings, we have to be careful about\
    \ locations.\n\nAs our strings are not very long, we can use single bytes as offsets\
    \ and lengths. This is probably not a good strategy in general, but it will show\
    \ off some additional flexibility. So, we write out the value 4 and the value\
    \ 27. This represents an offset of 4 bytes and a length of 39. The offset is 4\
    \ because we have these four numbers (as single bytes) at the beginning of the\
    \ buffer and will need to skip over them to get to the strings. As you now know,\
    \ 27 is hexadecimal for 39, the length of the Japanese string. The English sentence\
    \ will begin at index 4 + 39 = 43 which is 2b in hexadecimal (2 * 16 + 11) and\
    \ is 27 bytes long which is 1b in hexadecimal (1 * 16 + 11).\n\nThe second data\
    \ segment starts at position 0x4 because we need to skip over those offsets and\

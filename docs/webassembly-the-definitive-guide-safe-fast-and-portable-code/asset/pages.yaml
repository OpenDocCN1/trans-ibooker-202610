    loaded into the browser. Once that happened, Just-in-Time (JIT) optimizing compilers
    are able to speed things up nicely, but there were still inherent issues like
    slow bounds-checked array references. While JavaScript in its entirety could not
    be optimized ahead-of-time, a subset of it could be.


    The exact details of what that means are not super relevant to our historical
    narrative, but the end result is. asm.js also used the LLVM-based clang³³ front-end
    parser via the Emscripten³⁴ toolchain. Compiled C and C++ code is very optimizable
    ahead-of-time so the generated instructions can be made very fast through existing
    optimization passes. LLVM represents a clean, modular architecture so pieces of
    it can be replaced including the backend generation of machine code. In essence,
    the Emscripten team could reuse the first two stages (parsing and optimization)
    and then emit this subset of JavaScript as a custom backend. Because the output
    was all “just JavaScript”, it would be much more portable than the NaCl/PNaCl
    approach. The tradeoff unfortunately was in performance. It represented a significant
    improvement over straight JavaScript, but was not nearly as performant as Google’s
    approach. It was good enough to amaze developers though. Beyond the modest performance
    improvements, however, the mere fact that you could deploy existing C and C++
    applications into a browser with reasonable performance and virtually no code
    changes was compelling. While there were extremely compelling demos involving
    the Unity engine³⁵, let’s look at a simple example. “Hello, World!” seems like
    a good place to start.



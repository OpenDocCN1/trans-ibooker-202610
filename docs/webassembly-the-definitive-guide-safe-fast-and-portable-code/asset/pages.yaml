- pgno: 203
  md: 'ownership transfers. At this point, s does not point to anything valid anymore
    so our attempt to use s in the println! macro is caught as a violation.


    Literal values and other structures may implement the Copy trait mentioned in
    the error message above. This is a behavior that allows the associated bits to
    be copied from variable to variable without inducing an ownership transfer. Because
    the Rust string structure does not implement this trait, the ownership checking
    applies. Other cases where ownership transfer happens includes when variables
    are passed into and out of functions, in loops, and other lexical structures such
    as conditional clauses.


    The good news is that, by being more explicit about our intentions, we can get
    around this problem without introducing new risk. The specific risk we are attempting
    to avoid is use before initialization, use after free, and other bugs that are
    common in languages such as a C and C++. We can use references rather than direct
    access which allows us to “borrow” a value. We can have mutable references, but
    only one at a time. These function a bit like reader/writer locks in languages
    such as Java.


    Once we are better communicators about our intentions, the Rust compiler can assist
    us with our goals rather than fight us all of the time. The net effect is that
    Rust moves several run-time errors to compile-time errors which is a much better
    place to handle them. This eliminates even more classes of bugs and allows us
    to produce much higher quality software including fast, highly-concurrent types
    of code useful in system development.


    The experience of using Rust is not just about being hassled by the compiler though.
    There are plenty of language features, tools and aspects of the community that
    make it a joy to use once you get past the learning curve. The combination of
    Rust’s speed and safety with its being built on LLVM make it a great language
    to pair with WebAssembly.'

- pgno: 334
  md: '![](img/16b7990eb0dbf589db177bdbd2f4a189_334_0.png)


    Figure 15-5. Cat image sharpened by 20%


    On the continuum of deployment localities, we are mainly looking at Edge computing
    as is indicated by the name. Next we will look at a solution that will help developers
    deploy WebAssembly modules to their existing Kubernetes clusters.


    # Krustlet


    While Docker containers provide the isolation and behavior dependency mechanisms,
    Kubernetes has become one of the primary environments for orchestrating these
    containers into automated deployments of sophisticated applications and workflows.
    The two technologies have really fed off of each others strengths. So much so
    that they are quite tightly coupled as engines of deployment. While this is not
    an issue in large cloud deployments, it becomes a problem when we want to target
    smaller profile platforms. Ultimately we are going to seek a mechanism that will
    allow composition of behavior expressed in lighter structures. But, finding a
    way to integrate WebAssembly with Kubernetes directly is a reasonable goal.'

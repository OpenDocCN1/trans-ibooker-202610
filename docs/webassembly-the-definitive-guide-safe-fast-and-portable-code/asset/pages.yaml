  md: "```\n}\n    Ok(())\n}\n```\n\nOnce we have the instance, we start an unbounded\
    \ loop of n from 1 to infinity. Clearly we do not want to wait for this code to\
    \ complete on its own. So, we are going to leverage fuel. Individual instructions\
    \ are calibrated as having a cost, so we keep track of how much we spend each\
    \ iteration and subtract it from our available fuel deposit. Once we run out,\
    \ our attempt to invoke the function will fail and break out of the loop.\n\n\
    So, we have a general capability that can be built into various runtimes to allow\
    \ us to run arbitrary code safely without concern about whether it will spin out\
    \ of control or not. Building a generic blockchain engine out of this capability\
    \ is clearly one potential use.\n\n# ewasm\n\nThe legacy Ethereum Virtual Machine\
    \ is referred to as EVM1. The new version is known as ewasm. The documentation\
    \ and design process are available here: https://ewasm.readthedocs.io. This is\
    \ a work in progress and there have been many changes along the way, but the goal\
    \ is still to create a new virtual machine on a WebAssembly base for all of the\
    \ reasons that should be obvious by now. One consequence that may not be obvious\
    \ is that this will likely open up contract languages to a much wider variety\
    \ given the ease with which LLVM-based compilers can be reused.\n\nThey did not\
    \ come to this decision lightly. As can be seen on the “Comparison with Other\
    \ Architectures” section of the documentation linked above, they considered all\
    \ manner of intermediate representations and bytecode formats as the possible\
    \ basis for this new virtual machine.\n\nThe main arguments for heading down this\
    \ path are obviously speed, efficiency, and security. We are talking about a standards-based\
    \ instruction set which will be curated and extended over time by the W3C. The\
    \ Ethereum community will benefit from this work and will not have to make all\
    \ of the design decisions themselves. The widespread and growing"

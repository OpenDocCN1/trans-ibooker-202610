  md: 'What you end up with is a technology stack tracking the evolution of our industry
    ready to meet the needs of various runtime configurations and scenarios. Let’s
    quickly walk through the layers involved.


    At the base of the stack is WebAssembly and WASI. From here we have a portable
    and secure architecture that will run in a wide number of runtimes and environments
    of varying capabilities and resources. Unlike previous sandboxed environments,
    this gives us the freedom of language choice and the benefit of high performance
    results. This base level is shown in Figure 15-7.


    ![](img/16b7990eb0dbf589db177bdbd2f4a189_342_0.png)


    Figure 15-7. The WebAssembly base of the wasmCloud stack


    wasmCloud extends the WebAssembly base with signed packages, reduced boilerplate
    code, the composable actor model, and horizontal and vertical scalability. It
    supports multi-tenant stateless and isolated execution of deployed business functionality.
    This level is highlighted in Figure 15-8.'

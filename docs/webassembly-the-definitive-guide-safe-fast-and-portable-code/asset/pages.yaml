- pgno: 275
  md: '# Chapter 13. WebAssembly and .NET


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 13th chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at wasmbook@bosatsu.net.


    > I think foosball¹ is a combination of soccer and shishkabobs.

    > —Mitch Hedberg


    Throughout my career I have had a respectfully indifferent relationship with .NET.
    I have nothing against it, I just have almost never needed it and have spent little
    time working on anything Windows-specific, which, for many years it was.


    Back in the early 2000s, I did help initiate a .NET-based project with some coworkers
    to visualize scenarios simulating attacks on buildings. The idea was that by using
    real physics models of explosions we could marry visualization with possible outcomes
    based upon various protective measures. Security planners could consider different
    locations for physical barriers and run tests for their facilities involving explosives-laden
    vehicles. If they could only get so close, what kind of an impact on the building
    or people standing just inside the entrance might it have²? Windows was the target
    platform and clearly we needed some computational speed, so we'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'chose a Managed C++ basis for the core libraries and C# for the application.
    I was not on the project long, but it was a successful enough project in the end.


    Other than that, I have done what I have needed to do with Java, C++, JavaScript,
    Rust, Python and other languages and environments. I know a lot of people who
    love .NET and the tools that surround it, but it has just never mattered much
    to my career.


    That being said, I have always been intrigued by initiatives like Mono³ so I keep
    somewhat aware of what is happening in that world. Plus, many of my friends are
    experts and champions of the space so they let me know what is going on there
    too. One of the exciting shifts for its advocates is that the Microsoft development
    tools and .NET frameworks are now real solutions for cross-platform development.


    I was still surprised when I started to learn about some of the .NET and WebAssembly
    initiatives that were gaining steam. They initially felt like combinations of
    soccer and shishkabobs, strange and anachronistic pairings. The more I thought
    about it though, I realized that there are some compelling and consequential aspects
    located at the integration of these technologies that are worth exploring.


    # .NET and Wasmtime


    As you are no doubt starting to realize, there are quite a few different use cases
    for WebAssembly beyond the straightforward approaches engendered by the MVP. We
    will start with a not overly .NET-specific integration along the lines of what
    we have seen in previous chapters. The Wasmtime platform supports .NET integrations
    through its NuGet package⁴. This example supports the idea of extending .NET applications
    with WebAssembly modules, libraries, and plugins.


    You will need to install the .NET Core SDK before you can attempt the following.
    Please consult Appendix A for instructions to help you accomplish this. Once the
    tools are available, we will create a new directory'

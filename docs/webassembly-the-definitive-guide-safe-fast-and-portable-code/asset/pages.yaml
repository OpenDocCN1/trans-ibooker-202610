  md: 'toolchain support for a wider number of languages is going to create a natural
    path for using languages that developers are already familiar with such as C/C++,
    Rust, Go, AssemblyScript, and more (including some new ones we will discuss in
    the final chapter!).


    WebAssembly is intrinsically portable which will also reduce the burden on the
    Ethereum developer community to target an increasing number of hardware platforms
    as they become available. This portability and the performance gains will also
    allow more of the Ethereum platform itself to be expressed in Wasm instructions
    which keeps the size of the codebase down when supporting multiple platforms.
    This is useful both from a level of effort and a code analysis for security auditing

    Figure 9-4. Relative performance of Tensorflow.js backends across platforms


    At least for the time being, WebAssembly is not always going to be the fastest
    solution in every case. It is a relatively new platform and it will be a while
    until all of the potential optimizations can be wrung out of what is there. However,
    given its young age, it is already changing the game about what is possible in

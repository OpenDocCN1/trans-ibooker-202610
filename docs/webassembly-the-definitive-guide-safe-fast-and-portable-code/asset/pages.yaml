    As you can see it is much more verbose than our C program. High level constructs
    like function calls, loops, and conditional checks require many lower level instructions
    to express. We will need an actual Intel x86 chip to run on, or at least an emulated
    one. At some level, however, this is conceptually similar to the Wat files we
    have seen in previous chapters.


    The main reason we are discussing clang as our example C compiler is because it
    has a modern, pluggable architecture based on the LLVM project⁴. This is incredibly
    important in the modern world of increasing numbers of competing instruction sets
    (e.g. X86, ARM, RISC-V), new programming languages (e.g. Rust, Julia, Swift),
    and an overall desire to reuse common optimizations regardless of source language.


    In Figure 5-1 you can see this as a three part process. Source code is parsed
    by a front-end processing step. This is going to be language-specific. The output
    of this step is an intermediate representation (IR), an instruction set of a hypothetical
    but not real machine. It captures the expressed logic in a format that can be
    manipulated by the optimization layer. This process involves applying one or more
    transformations that should have the effect of making the code faster or more
    efficient based purely on the expressed logic. Loops may be unrolled⁵, unused
    code may be eliminated, expressions involving constants may be evaluated by the
    compiler so they do not need to be evaluated at runtime, and more. The final step
    emits a native set of instructions targeting a specific run time. For our purposes,
    that was obviously the Mach-O x86 64-bit architecture.'

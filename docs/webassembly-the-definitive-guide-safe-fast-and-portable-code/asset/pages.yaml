    We just got a Uint8Array back from calling the FS.readFile() function. This is
    going to make it easy to deal with the bytes from the file. There is only one
    problem. Browsers do not support displaying Windows Bitmap files!


    Fortunately, this is a documented format and someone has done us a solid and provided
    the code to do so. We could have relied on some existing C or C++ code, but just
    to show you some options, we will use the JavaScript code provided⁵.'

  md: '# Chapter 3. WebAssembly Modules


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 3rd chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at wasmbook@bosatsu.net.


    > A place for everything and everything in its place.

    > —17th Century Proverb


    An operating system runs a program usually contained in a compiled form¹. Each
    operating system has its own format that defines where to start, what data is
    necessary, and what the instructions are for the different advertised bits of
    functionality actually are. WebAssembly is no different. In this chapter we are
    going to look at how the behavior is packaged up and how a host will know what
    to do with it.


    It is possible that software engineers can spend their entire careers ignoring
    how programs are loaded and executed throught this process. Their world starts
    and stops at `int main(int argc, char **argv)` or `static void main(String []args)`
    or even `if __name__ == "__main__":`. These are well-known entry points to programs
    in C, Java, and Python thus this is where programmers assume responsibility for
    the control flow. Prior to programs being launched and after they exit, however,'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'the operating system or programmatic runtime needs to set up and tear down
    the executable structure. The loader process needs to know where the instructions
    begin, how data elements are initialized, what other modules or libraries need
    to be loaded and more.


    These details are generally defined by the nature of the executable. On Linux,
    this is defined by the Executable and Linkable Format (ELF)², on Windows, its
    the Portable Executable (PE) format³ and on macOS, it is the Mach-O format⁴. These
    are obviously platform-specific formats for native executables. More portable
    systems like Java and .NET use an intermediate bytecode representation, but there
    is still a defined structure and they serve similar purposes.


    One of the prime design considerations of the WebAssembly MVP was to define the
    module structure so that WebAssembly hosts know what to look for and validate
    as well as where to begin when executing a unit of deployment.


    In Chapter 2, you have already seen a more complicated module structure than we
    will start with in this chapter. We will introduce the sections incrementally
    and then show you some tools to explore the structure of a WebAssembly module
    both textually and visually. You have dealt briefly with the binary structure
    in the previous chapter. It is compact and fast for transferring and loading.
    You probably will not spend much time looking at the binary details on a regular
    basis as your focus will be on the software side of things. It is useful to be
    familiar with the module layout, however, so let’s dig in.


    # Module Structure


    The most basic WebAssembly module is an empty one. None of the sections are required
    so it is possible to have a valid module such as you see in Example 3-1.


    Example 3-1. An empty, but valid, WebAssembly module.


    ```

    (module)

    ```'

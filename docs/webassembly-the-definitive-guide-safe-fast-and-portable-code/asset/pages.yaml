- pgno: 28
  md: 'asm.js represents a nice fallback position for browsers that do not support
    the WebAssembly standards, but it is now time to set the stage for the subject
    of the book.


    # Rise of WebAssembly


    With NaCl, we found a solution that provided sandboxing and performance. With
    PNaCl, we also found platform portability but not browser portability. With asm.js,
    we found browser portability and sandboxing, but not the same level of performance.
    We also were limited to dealing with JavaScript which meant we could not extend
    the platform with new features (e.g. efficient 64-bit integers) without first
    changing the language itself. Given that this was governed by an international
    standards organization, this was unlikely to be an approach with quick turnarounds.


    Additionally, JavaScript has certain issues with how browsers loaded and validated
    it from the web. The browser has to wait until it finishes downloading all of
    the referenced files before it starts to validate and optimize them (while further
    optimizations will require us to wait until the application is already running).
    Given what we have already said about how developers encumber their applications
    with ridiculously large amounts of transitive dependencies, the network transfer
    and load-time performance of JavaScript is another bottleneck to overcome beyond
    the established run-time issues.


    After seeing what was possible with these partial solutions, there became a strong
    appetite for high-performance, sandboxed, portable code. Various stakeholders
    in the browser, web standard and JavaScript environments felt a need for a solution
    that worked within the confines of the existing ecosystem. There had been a tremendous
    amount of work to get the browsers as far as they had gotten. It was entirely
    possible to create dynamic, attractive and interactive applications across operating
    system platforms and browser implementations. With just a bit more effort it seemed
    possible to merge these visions together into a unifying, standards-based approach.'

    \ 8-4. A simple program to add two numbers\n\n```\n#include <stdio.h>\n\nint add(int\
    \ x, int y) {\n    return x + y;\n}\n\nint main() {\n    printf(\"The sum of 2\
    \ and 3 is: %d\\n\", add(2,3));\n    return 0;\n}\n```\n\nWith clang, this is\

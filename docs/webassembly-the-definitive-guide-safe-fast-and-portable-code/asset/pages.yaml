- pgno: 371
  md: '# C++-rendered Image in the Browser


    ![](img/16b7990eb0dbf589db177bdbd2f4a189_371_0.png)


    Figure 16-4. Interacting with my files published locally via IPFS HTTP gateways


    I am not going to go into any more details, but want to highlight what else this
    means. Keep in mind that Merkle DAGs are immutable. If I change my application
    by modifying one or two files, those are the only things that need to be republished.
    Remember publishing is simply adding files to IPFS. Their edits will result in
    different hashes for their blocks which means different hashes for the files which
    means different hashes for the directory. There is a new top level CID. But the
    old one still works. There are games you can play with DNS, but I will leave that
    for you to discover with the IPFS documentation and tutorials.


    What does this have to do with WebAssembly? It is really the intersection of platform
    benefits that I am highlighting and the implications it will have as another use
    case. I just demonstrated a web application being served up via a CDN with its
    geographic distribution without any other hosting needs. It is being served up
    locally and the results can be cached along the way. This includes C++ code compiled
    to WebAssembly running in a sandbox on whatever browser or platform you happen
    to be using. Multiple versions'
  merge: -1
  img_proc: true

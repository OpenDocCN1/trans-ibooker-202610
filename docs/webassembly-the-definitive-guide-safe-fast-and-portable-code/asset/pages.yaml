- pgno: 242
  md: 'environments without having to rewrite it. This allows us to pick a language
    that is appropriate to a problem and not require a new runtime. If an organization
    had the Java Virtual Machine (JVM) deployed in production, the move to Ruby on
    Rails or a Python-based solution would probably require the installation of their
    respective environments¹³.


    It is in no way an all-or-nothing prospect. Sometimes we will want to run code
    natively for performance reasons, sometimes we will want the benefit of the zero-installation
    aspects of the Web. Sometimes we will want to run in a sandbox, sometimes we will
    not. Consider all the variables that would go into bringing this vision into existence
    and it would be nearly impossible to design from the ground up.


    But what you have hopefully started to see in this chapter is how this vision
    is coming into reality because of the deliberate choices that the WebAssembly
    designers have been making. They have tried to walk a line to avoid over- or under-engineering
    things. The MVP left out language features that not every language supported like
    threads, garbage collection and exceptions. There are technical proposals and
    working examples of all of these things, but it would have been too much upfront.


    Clearly there are limitations in the platform as it is. A steady stream of proposals
    are being published to extend the capabilities of the platform where and when
    it makes sense to do so. WASI has emerged as a focal point in allowing these proposals
    to emerge independently and to be adopted by platforms such as Wasmtime, Wasmer
    and Wasm3 incrementally. Admittedly, this makes it very confusing to track what
    has been added where, but through procedural mechanisms they are starting to sort
    that out as well.


    In order to facilitate a significant amount of the desired behavior, the WASI
    designers realized that there was a need to standardize how modules linked to
    each other. We needed a solution that allows us to refer to the unforgeable handles
    in memory without revealing the underlying structures. We also needed a way to
    refer to types such as strings, lists, and records. There became a dependency
    to the proposals design and implementation'

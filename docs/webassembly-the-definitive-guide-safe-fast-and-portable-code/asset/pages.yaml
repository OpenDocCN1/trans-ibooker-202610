- pgno: 73
  md: 'bytes first (the 1s). A *big endian* system would store the 0s first. In the
    grand scheme of things, it does not matter how they are stored, but different
    systems and protocols will pick one or the other. You just need to keep track
    of which format you are seeing.


    As indicated earlier, `TypedArray` classes were introduced initially for WebGL
    but since then, they have been adopted by other APIs including Canvas2D, XMLHttpRequest2,
    File, Binary WebSockets and more. Notice these are all lower level, performance-oriented
    I/O and visualization APIs that have to interface with native libraries. The underlying
    memory representation can be passed between these layers efficiently. It is for
    these reasons that they are useful for WebAssembly `Memory` instances as well.


    # WebAssembly Memory Instances


    A WebAssembly `Memory` is an underlying `ArrayBuffer` (or `SharedArrayBuffer`
    as we will see later) associated with a module. The MVP limits a module to having
    a single instance at the moment, but this is likely to change before long. A module
    may create its own `Memory` instance or it may be given one from its host environment.
    These instances can be imported or exported just like we have done with functions
    so far. There is also an associated `Memory` section in the module structure that
    we skipped over in the Chapter 3 because we had not covered the concept yet. We
    will fix that omission now.


    In Example 4-3 we have a Wat file that defines a `Memory` instance and exports
    it as the name "`memory`". This represents a contiguous block of memory constrained
    to a particular `ArrayBuffer` instance. It is the beginning of our ability to
    emulate C/C++-like homogenous arrays of bytes in memory. Each instance is made
    up of one or more 64 kilobyte blocks of memory pages. In the example, we initialize
    it to a single page but allow it to grow up to 10 pages for a total of 640 kilobytes
    which ought to be enough for anyone⁶. You will see how to increase the available
    memory momentarily. For now, we are just going to write the bytes 1, 1, 0, and
    0 to the beginning of the buffer. The `i32.const` instruction loads a constant'

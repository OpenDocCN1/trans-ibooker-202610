- pgno: 111
  md: 'server or a long-running programming and we called our function many times,
    we might eventually run out of memory.


    To solve the problem, we just need to call the `free()` function to tell the runtime
    we are done with that memory. Once we do we cannot touch it again. This highlights
    some of the many issues you need to consider when writing programs in C.


    +   - Do not use memory before you have allocated it.

    +   - Do not create blivets with the memory you have allocated. Make sure they
    are big enough.

    +   - Do not forget to free your memory once you are done with it.

    +   - Do not use your memory after you have freed it.


    Forgetting any one of these rules is likely to cause your program to crash or
    run out of memory. If this seems like a big hassle, you will appreciate languages
    such as Java, Python, and JavaScript that alleviate some of these issues for you.
    The down side is that there is usually a performance tradeoff which is why Rust
    is so compelling. It gives you the speed of a language like C without the danger
    of a language like C. We will introduce Rust in Chapter 10.


    Until then, we need to figure out what all of this means for WebAssembly.



- pgno: 282
  md: 'Blazor uses the Razor syntax which is a mashup markup language of HTML and
    C#. If you think that sounds a bit like soccer and shishkabobs, I agree, but we
    will see some working examples below. The main benefit is that it allows developers
    to build user interfaces using existing tools and .NET libraries rather than relying
    on JavaScript user interface frameworks. While those are very popular with JavaScript
    developers, the learning curve is pretty steep compared to a more conventional
    object-oriented user interface experience.


    The applications written with this framework have the option of being deployed
    either on the server or in the browser. Both modes allow the user interface to
    be rendered in the browser, but in the first scenario, the main logic is executed
    on the server. Communication of user interface updates is managed through a SignalR⁷
    connection. This is a remote procedure call (RPC) method that allows the server
    to invoke behavior in JavaScript in the browser via WebSockets, Server-Sent Events,
    or Long Polling techniques. This is not the use case we will focus on, but it
    is connected to the larger point I would like to make with respect to this use
    case. I will return to it below. This deployment model is visualized in Figure
    13-1.


    ![](img/16b7990eb0dbf589db177bdbd2f4a189_282_0.png)


    Figure 13-1. Blazor Server deployment model


    The more relevant scenario is the in-browser deployment model called Blazor WebAssembly.
    In this scenario the C# and Razor files are compiled into .NET assemblies which
    are then downloaded to the browser. The'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'produced artifact is a Single Page Application (SPA) that runs in the browser
    and can make changes to what is being displayed locally. Obviously in order for
    this to work, the .NET runtime must also be available in the browser, so it too
    must be downloaded. Local user interface updates are able to affect the DOM directly
    through JavaScript interoperability. This deployment model is shown in Figure
    13-2.


    ![](img/16b7990eb0dbf589db177bdbd2f4a189_283_0.png)


    Figure 13-2. Blazor WebAssembly deployment model


    It may not be clear how this works, but you have to look no further than the Mono
    platform mentioned previously. It has been compiled to WebAssembly therefore code
    artifacts that run on top of it should also work in any environment it does. The
    size of the .NET runtime is a potential concern for smaller profile devices such
    as phones and embedded devices, but, in general, this is a penalty you will pay
    infrequently as it is just a dependent web resource and can have cache controls
    put on it so it is not a constant bandwidth burden.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'We will build a sample application below, but for now, consider the Blazor
    WebAssembly demo site shown in Figure 13-3. This shows a simple stateful counter
    and a button to manipulate it as well as some routable components on the left
    to display other panels in the SPA.


    ![](img/16b7990eb0dbf589db177bdbd2f4a189_284_0.png)


    Figure 13-3. Blazor WebAssembly demo website


    To get a sense of how this might possibly work, consider the details shown in
    Figure 13-4. The Mono platform is shown as mono.wasm. It is initialized by a companion
    JavaScript file called mono.js which will look like a variety of bootstrapping
    JavaScript we have seen throughout the book. Toward the bottom of the image you
    will see console log details about this bootstrapping process. Even though many
    of the .NET assemblies are tens to hundreds of kilobytes big, you will note they
    are all cached from previous sessions so they will not need to be refetched.'

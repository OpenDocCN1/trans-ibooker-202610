    Unfortunately, computers do not understand these higher level languages so we\
    \ need to convert them to a binary machine representation for execution. If you\
    \ have only ever done JavaScript programming, this process may be slightly foreign.\
    \ As an interpreted language, you write JavaScript and simply run it. As with\
    \ everything, there are tradeoffs. What is convenient for developers is often\
    \ significantly slower at run time and C and C++ have long held the mantle on\
    \ performance³.\n\nGiven its maturity and importance to our industry, there are\
    \ many excellent commercial and open source C compilers. This includes the GNU/Linux\
    \ C Compiler (gcc) and LLVM’s clang compiler. We are going to focus on the latter\
    \ for reasons that will be clear shortly. You will want to install LLVM as described\
    \ in Appendix A to run the following. Even on macOS which uses clang by default,\
    \ not all of the commands will work out of the box without LLVM’s WebAssembly\
    \ support installed.\n\nIn its simplest form, we can convert our C program to\
    \ an executable as follows:\n\n```\nbrian@tweezer ~/g/w/s/ch05> clang howold.c\n\
    brian@tweezer ~/g/w/s/ch05> ls -laF\ntotal 112\ndrwxr-xr-x  4 brian  staff  128\

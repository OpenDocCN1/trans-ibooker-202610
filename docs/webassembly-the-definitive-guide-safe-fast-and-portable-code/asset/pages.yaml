  img_proc: true
- pgno: 82
  md: 'By definition, the first two Fibonacci numbers are 0 and 1, so we write those
    into the buffer. `i32.store` writes an integer value to a location. It expects
    to find those values on the top of the stack, so the next two parts of the statement
    invoke the `i32.const` instruction which pushes the specified values to the top
    of the stack. First, an offset of 0 indicates we want to write to the beginning
    of the buffer. The second one pushes the number 0 to the stack to indicate the
    value we want to write in position 0. The next line repeats the process for the
    next Fibonacci number. The `i32` from the previous line takes up 4 bytes so we
    write value 1 to position 4.


    The next step is to iterate over the remaining numbers which are each defined
    as the sum of the previous two. This is why we need to start the process with
    the two we just wrote. We advance our `$index` variable to 2 so we will need `$n
    - 2` iterations of the loop. We have written two `i32` integers so we advance
    our `$ptr` to 8.


    Wat references several WebAssembly instructions that you will be introduced to
    over the course of the book. Here you can see some of the looping constructs.
    We define a block at position <7> and give it a label of `$break`. The next step
    introduces a loop with an entry point called `$top`. The first instruction in
    the loop checks to see if `$n` and `$index` are equal indicating we have handled
    all of our numbers. If so, it will break out of the loop. If not, it proceeds.


    The `i32.store` instruction at position <10> writes to the `$ptr` location. The
    values of variables are pushed to the top of the stack with the `get_local`. The
    value to write there is the addition of the the values of the previous two numbers.
    `i32.add` expects to find its two addends at the top of the stack as well. So
    we load the integer location that is four less than `$ptr`. This represent `$n
    - 1`. We then load the integer stored at location of `$ptr` minus 8 which represents
    `$n - 2`. `i32.add` pops these addends off the top of the stack and writes their
    sum back to the top. The stack now contains this value at the top and the location
    of the current `$ptr` value which is what the `i32.store` is expecting.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'The next step advances $ptr by four since we have now written another Fibonacci
    number to the buffer. We advance $n by one and then break to the top of the loop
    and repeat the process. Once we have written $n numbers to the buffer, the function
    returns. It does not need to return anything as the host environment has access
    to the Memory buffer and can read the results out directly with TypedArrays as
    we saw earlier.


    The result of loading our HTML into the browser and displaying the first twenty
    Fibonacci numbers is shown in Figure 4-3.


    ![](img/16b7990eb0dbf589db177bdbd2f4a189_83_0.png)


    Figure 4-3. Reading the Fibonacci sequence from the Memory instance.


    This level of detail would be annoying to deal with regularly, but fortunately
    you will not have to. It is important to understand how things work at this level
    though and how we can emulate contiguous blocks of linear memory for efficient
    processing.



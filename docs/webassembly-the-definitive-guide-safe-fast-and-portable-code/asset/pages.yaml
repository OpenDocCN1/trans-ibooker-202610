- pgno: 124
  md: 'legacy systems. Being able to distribute this code via the browser would be
    a big step forward!


    Additionally, there are simply some problems that are not well-suited to be written
    in JavaScript. Having the option of writing that portion of your application in
    another language without requiring a separate runtime is very compelling. And,
    as our final example demonstrates, there is real value in having trusted code
    from trusted sources providing provenance for sensitive and tricky software such
    as encryption algorithms. Being able to simply recompile existing code from people
    you know who know what they are doing is a useful capability to have as well.


    In the last chapter we showed that it is possible to use a regular WebAssembly-enabled
    C compiler like clang and some header and library dependency management to achieve
    basic integration. Having to provide our own versions of the standard library
    and manually linking C code to provided JavaScript is going to get old really
    quickly however.


    Fortunately, the Emscripten project has laid down the foundations for making this
    an easier process than it might otherwise be. This is not surprising because its
    main developers, Alon Zakai and Luke Wagner, have been behind much of the work
    starting with asm.js, extending into the WebAssembly MVP and to the specification
    advancements that continue to this day. The Emscripten² toolchain has been there
    for much of the journey.


    The project is based upon the LLVM platform. In earlier chapters, I indicated
    that it initially had a custom backend that emitted the optimizable subset of
    JavaScript for asm.js. Once the WebAssembly platform was defined, a new backend
    was able to emit Wasm binaries.


    Unfortunately, that is only part of the solution. There also needs to be support
    for getting data into and out of memory, linking modules, wrapping existing libraries
    and more. A C program that provides a user interface or listens for network requests
    often spins in a fairly tight loop responding to input activity. Given that a
    browser is a single-threaded environment by default, there would be an operational
    mismatch with that kind of main loop. The Emscripten toolchain has been modified
    to solve many types of'

  md: "is easy to install multiple channels whenever you want. It is also possible\
    \ to install backends for other architectures if you are interested in cross-compiling.\n\
    \nStart by installing the rustup toolchain documented here:\n\nhttps://www.rust-lang.org/tools/install\n\
    \nTo generate WebAssembly directly you will have to install the backend. You can\
    \ pick whichever channel you want, but to install the nightly WebAssembly backend\
    \ you would do this:\n\n```\n~/s/r/wasm> rustup target add wasm32-unknown-unknown\
    \ --toolchain nightly\n```\n\nTo use the backend when compiling Rust, you would\
    \ do something like this if you did not make it the default toolchain:\n\n```\n\
    ~/s/r/wasm> rustc +nightly --target wasm32-unknown-unknown \\\n  -O --crate-type=cdylib\
    \ add.rs -o add.wasm\n```\n\nTo generate WASI code, you will want the WASI backend\
    \ installed:\n\n```\n~/s/r/wasm> rustup target add wasm32-wasi --toolchain nightly\n\
    ```\n\nTo use it if it is not the default toolchain:\n\n```\n~/s/r/wasm> rustc\
    \ hello.rs --target wasm32-wasi\n```\n\nNotice that the regular Rust native backend,\
    \ regular WebAssembly and WASI backends are distinct depending on what you want\
    \ to target.\n\nIf you want to interact seamlessly between Rust and JavaScript,\
    \ you will probably want to install wasm-bindgen.\n\nAn excellent introduction\

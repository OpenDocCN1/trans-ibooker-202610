    \ for the basic project.\n\n```\nbrian@tweezer ~/src> cargo new --lib hello-wasm-bindgen\n\
    Created library `hello-wasm-bindgen` package\n```\n\nYou can override the default\
    \ code in the src/lib.rs file to be what is shown below in Example 10-9.\n\n#\
    \ Example 10-9. Our library for use with wasm-bindgen\n\n```\nuse wasm_bindgen::prelude::*;\n\
    \n#[wasm_bindgen]\nextern {\n    pub fn alert(s: &str);\n}\n\n#[wasm_bindgen]\n\
    pub fn say_hello(name: &str, whom: &str) {\n    alert(&format!(\"Hello, {} from\
    \ {}!\", name, whom));\n}\n```\n\nThis is slightly trickier Rust than we have\
    \ seen so far, but not too bad. The first line imports the contents of the wasm_bindgen::prelude\
    \ module so that we can use it in our Rust code. This includes some of the binding\
    \ code that will connect us to the JavaScript runtime environment.\n\nThe next\
    \ line is a Rust attribute name #[wasm_bindgen]. This indicates that we plan on\
    \ invoking an external function named alert(). This is among the functionality\
    \ we imported with the aforementioned use statement from the prelude. If you think\
    \ that this method sounds familiar, you would be right! This is ultimately going\
    \ to invoke the method of the same name that you have probably called from JavaScript\
    \ many times."

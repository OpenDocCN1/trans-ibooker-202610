    elements and metadata models and provide hardware-accelerated 2D graphics and
    video elements among other features. The convergence of the Ajax style, the standardization
    and maturation of ECMAScript as a language, easier cross-browser support and an
    increasingly feature-rich web-based environment caused an explosion of activity
    and innovation. We have seen innumerable JavaScript-based application frameworks
    come and go, but there was a steady forward momentum in terms of what was possible.
    As developers pushed the envelope, the browser vendors would improve their engines

    \n```\n#include <emscripten.h>\n\nEMSCRIPTEN_KEEPALIVE int add(int x, int y) {\n\
    \    return x + y;\n}\n```\n\n> 1  Include the Emscripten header for the macro\
    \ definition.\n\n> 2  Tell the Emscripten compiler to keep the add() method around.\n\
    \nNow we can recompile with emcc and run it with Node.js:\n\n```\nbrian@tweezer\

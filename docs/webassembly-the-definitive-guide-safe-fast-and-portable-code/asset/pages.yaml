- pgno: 157
  md: "validated a module with exported functions through Table instances, we do not\
    \ want another module to be able to mess it up for anyone else. Thus, all you\
    \ can do is make indirect function calls to function references stored in the\
    \ table. Currently function references are the only thing that can be stored in\
    \ Table instances, but that is also expected to change in the future.\n\nRather\
    \ than overly complicate things at this point, I am going to go back to simple\
    \ function definitions in Wat to demonstrate the way to create Table instances\
    \ and export them.\n\nIn Example 7-3 I have created two functions. The $add function\
    \ takes two parameters, adds them together and returns the result. The $sub function\
    \ takes two parameters, subtracts the second from the first and then returns the\
    \ results. So far, as they say, so what? This is just retrodden territory from\
    \ earlier chapters. The difference here is what happens next.\n\n# Example 7-3.\
    \ A module that exports its Table instance\n\n```\n(module\n  (func $add (param\
    \ $a i32) (param $b i32) (result i32)\n    get_local $a\n    get_local $b\n  \
    \  i32.add)\n\n  (func $sub (param $a i32) (param $b i32) (result i32)\n    get_local\
    \ $a\n    get_local $b\n    i32.sub)\n\n  (table (export \"tbl\") anyfunc (elem\
    \ $add $sub))\n)\n```\n\nWe introduce a new Wat keyword, table. This defines a\
    \ collection of function references. Notice the inline export command. We will\
    \ allow our host environment to invoke methods through the $add and $sub functions,\
    \ but not via their names. The host can only invoke the behavior through the Table\
    \ instance. The anyfunc type is currently the only allowed type for this structure\
    \ as we noted previously. Based on the ordering in the elem reference, $add will\
    \ be in the 0th position and $sub will be in the 1th¹ position."

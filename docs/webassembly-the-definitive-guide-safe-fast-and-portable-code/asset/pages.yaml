- pgno: 314
  md: 'uses reference counting to know when memory can be freed. Other languages such
    as Java and JavaScript use garbage collection and track memory references through
    a variety of sophisticated but time-consuming algorithms. Part of what has kept
    Java as a bit player in the embedded computing space is that these algorithms
    can kick in unpredictably and block other processing from happening. This is unacceptable
    for high-precision devices used for medical or industrial safety purposes. As
    always, there are tradeoffs everywhere.


    AssemblyScript added a Garbage Collection capability as of version 0.18. I will
    demonstrate a more convenient way of interacting with it in a later section via
    the Loader. But for now I just want to mention it because you can use it directly
    if you tell the AssemblyScript compiler to export access to the runtime with the
    `--exportRuntime` directive. Not only that, you have the option of controlling
    the behavior of the runtime by using the `--runtime` parameter. This allows you
    to specify whether it should use an incremental, minimal, stub or even a custom
    pluggable implementation.


    I think a deep introduction to this process is outside of the scope of this chapter,
    but could be useful depending on what you attempt to do with AssemblyScript⁷.


    I did want you to know about its existence, though, and to make you aware that
    it is possible to allocate memory from a module’s exported `Memory` instance as
    well as pinning and unpinning references that point into it so that they will
    or will not be collected by other processes. We will see some examples of using
    these abilities below.


    # AssemblyScript Standard Library


    Another nice addition to AssemblyScript’s ecosystem is a standard library of structures
    and functionality that you would expect from a modern programming infrastructure.
    As we have seen, WebAssembly requires these common functions to be provided by
    the host environment through import objects or more generally through WASI capabilities.'

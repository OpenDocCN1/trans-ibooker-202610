- pgno: 374
  md: '# Chapter 17. WebAssembly and Other Languages


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 17th chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at wasmbook@bosatsu.net.


    > If you talk to a man in a language he understands, that goes to his head. If
    you talk to him in his own language, that goes to his heart.

    > —Nelson Mandela


    We are getting to the end of our story, at least for now. We have seen a wide
    range of use cases, language and platform integrations, hosting environments,
    and more where WebAssembly is shining already. There are quite a few choices for
    developers to make to be productive and effective with this exciting new platform.
    There are concrete reasons why some languages and their associated runtimes work
    well with WebAssembly and why others do not. The lack of garbage collection and
    good thread support everywhere are among the obstacles that have existed since
    the early days of the MVP, but both are well on their way to being resolved.


    As we saw in Chapter 12 these and other limitations are well-understood and increasingly
    available in various host and runtime environments. The future is bright for much
    wider support of just about any language'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'developers might like to use. So, please, if your favorite language is not
    yet supported, keep your chin up. I do not think it will be long before it might.


    That being said, there are incremental efforts, partial solutions, and works-in-progress
    for many other popular and even emerging-but-still-somewhat niche languages that
    we will address in this chapter. I do not suggest that these are drop-in replacements
    for the more well-supported languages, but, perhaps cracks to let the light in
    to a brighter polyglot WebAssembly future. As Madiba says in the opening quotation,
    we can understand many languages, but we love when our own languages are used.


    # TinyGo


    As I mentioned in the Chapter 10, I was originally drawn to Go as a systems language
    to replace C and C++ due to its clean syntax, ties to Unix and Plan 9, and the
    involvement of Rob Pike and Ken Thompson. When it trailed Rust on support for
    WebAssembly, my attention waned but I have always looked forward to the day when
    that gap would close. We are not there yet, but we are getting much closer thanks
    to a new variant called TinyGo¹. This project is not specific to WebAssembly,
    but it is based on a new Go compiler built on the LLVM infrastructure which opens
    up WebAssembly as a backend.


    From their FAQ “What is TinyGo exactly?”² we see that it is a parser based upon
    the standard library (and thus portable and well-supported by various WebAssembly
    tools such as Emscripten and wasi-sdk) and LLVM for its reusable optimization
    support. Beyond that, the FAQ indicates that it also includes compiler intrinsics
    (rules to assist with optimization), a memory allocator, a scheduler, reimplemented
    common packages, and support for string manipulation.


    The “Tiny” portion of TinyGo is a desire to target microcontrollers which are
    not supported by the conventional Go compiler. Absent the layered architecture
    of LLVM, adding that kind of support on the backend would be more trouble than
    its worth to many developers. LLVM changes the level of effort and therefore opens
    up all sorts of new possibilities. The other aspect'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'of the regular Go toolchain is that it produces large binaries which are also
    unsuitable for embedded systems and microcontrollers. The combination of addressing
    these issues also happens to work well in supporting a Go-to-WebAssembly path
    which is likely to continue to bear fruit and allow Go to be usable in this way.


    Given that Rust and Go land in the same space in many people’s heads and Rust
    is also interested in targeting embedded systems with its LLVM-based toolchain,
    the FAQ goes on to motivate Go as an option as it has an admittedly shallower
    learning curve, thread implementation independent concurrency support via goroutines
    and channels and a rich standard library. In Rust, some of those features are
    supported by dependent Cargo packages. They acknowledge that Rust has its own
    strengths and advantages, but the larger point is that there is enough demand
    in the marketplace of ideas to support both languages, so the effort was worth
    it.


    In Figure 17-1 we show the TinyGo playground in a browser. Hopefully the sneak
    peek into the runtime *importObject* resonates now that you have learned about
    WASI and other ways of sharing behavior with WebAssembly runtimes.'
  merge: -1
  img_proc: true

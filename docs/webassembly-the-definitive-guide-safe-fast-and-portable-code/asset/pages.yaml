- pgno: 366
  md: 'network type it is (i.e. ip4 vs ip6) as well as the preferred transport to
    use to talk to our node. Notice the distinction between TCP and QUIC over UDP.
    This is an extremely powerful idea that supports resilience, simple interaction
    models, and extensibility all throughout the technology stack.



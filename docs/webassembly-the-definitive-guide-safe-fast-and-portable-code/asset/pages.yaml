  md: 'In this chapter, I am going to introduce a language called AssemblyScript which
    might prompt the same reaction. It is a Binaryen-based compiler that turns a subset
    of TypeScript into WebAssembly. It is obviously very similar to TypeScript (which
    is, in turn, similar to JavaScript), but, upon closer inspection, something strange
    is going on here too. Still, it fits a different use case for WebAssembly and
    shows you how versatile this platform can be.


    TypeScript is a popular superset of JavaScript that transpiles to regular JavaScript
    so that it will run anywhere JavaScript will. Its main purpose is to express your
    intent using a strongly-typed language to minimize the kind of annoying and rampant
    type errors that fill the average JavaScript codebase. As such, even though it
    uses a compiler, its goal is more about safety than performance.


    If you have not used a strongly-typed language before, the idea may seem to be
    more of a burden than a benefit. To be fair, some developers do feel that way.
    However, a type system-focused language defines the meaning and operations that
    apply to different types. A compiler enforces that you only attempt to invoke
    operations on the types that define them so you do not end up with runtime errors.
    As a consequence, strongly-typed systems help you produce software that is more
    correct, immutable, encapsulated, composable, and, often, readable. This is not
    to say that you cannot do the same with loosely-typed systems, you just have less
    assistance when you try to do so.


    TypeScript was developed at Microsoft as a response to its increased use of browsers
    to deliver their office application suites and other business systems. While individual
    applications in JavaScript can be developed easily, complex, high-performance
    suites of applications present challenges once they grow past a certain size.
    This was an attempt to solve some of those growth issues while still staying within
    the vibrant JavaScript ecosystem.


    As a very simple example, Example 14-1 shows us a simple TypeScript snippet that
    defines a function. Notice that the parameter is typed as a'
  merge: -1
  img_proc: true

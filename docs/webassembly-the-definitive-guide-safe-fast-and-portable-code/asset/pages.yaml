  img_proc: true
- pgno: 165
  md: 'While everyone had opinions on user interface decisions, only some of them
    were informed opinions.


    I imagine in some small way, this is what Brian Eno was referring to in the above
    quotation. He was notably one of the co-founders of Roxy Music, a darling of music
    nerds everywhere. But, despite his glam outfits and makeup, he did not really
    care to be in the spotlight and, after frequent clashes with Brian Ferry, he went
    his separate way focusing more on composition and production than being a typical
    rock star performer.


    My career shifted and I began to focus on design, architecture, backend services
    and the like. I strayed away from the spotlight of user interfaces and enjoyed
    the relative freedom of backend server work. It was not as attention-getting as
    user-facing activities, but it also had the benefit of not being as attention-getting
    as user-facing activities.


    For most of its existence, WebAssembly has been positioned as a client-side technology.
    It has been seen primarily as a way to extend and expand what is possible in the
    browser, a universal client no longer restricted to extension only via JavaScript.
    There is a much bigger role for WebAssembly than being simply a front end darling.
    It is going to have an extremely important role as a technology outside of the
    browser as well. In fact, it has been positioned for that all along with Node.js
    supporting WebAssembly modules almost the entire time.


    It may not be obvious why this makes as much sense on the server where performance
    is so crucial and you generally have the freedom to pick your implementation technologies.
    At the confluence of hardware heterogeneity and evolution, developer productivity,
    business value, security and the capacity for architecture to serve as a design
    choice to minimize infrastructure and network costs, however, lies a glowing opportunity
    that WebAssembly is rapidly expanding to fill. Over the remainder of the book
    we will fill in that story, but for now we will simply focus on the basics of
    running WebAssembly outside of the browser.


    # Native Extensions to Node.js'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Node.js emerged as, among other reasons, a response to the fact that developers
    would use one language and set of frameworks on the client side in the browser,
    and another set on the server. Previous efforts to gain reusable code everywhere
    (via Java itself and the Google Web Toolkit (GWT)) had attempted to travel the
    other direction from server to client. This was a movement in the other direction.
    Most of the excitement in the software development space was happening in the
    browser and the explosion of techniques and frameworks from Ajax to jQuery to
    Angular and more. It was maddening to have to write code that ran in the browser
    and then rewrite it to run on the server in a different language.


    Node.js quickly grew in popularity and became a darling of the software developers
    who now had further reach and greater reusability. As a JavaScript-based environment,
    applications written to run on it were intrinsically portable as long as the environment
    was. At its core, Node.js was the highly-performant V8 JavaScript engine from
    Google, libuv, the basis of its event loop and abstraction layer over lower-level
    functionality and a set of APIs built on top of all of this. This was an inherently
    portable environment.


    The problem remained that not everything is a good fit to be implemented in JavaScript
    even with the high-powered V8 engine at its core. Naturally it allowed for an
    extension mechanism with native libraries implemented in C and C++. Given the
    complex relationship between JavaScript object lifecycles and native code structures,
    this makes for much trickier software development. On top of that, you suddenly
    have a native library management problem. If you install a Node.js application
    with native library extensions, there needs to be a process to get them to compile
    on Linux, Windows, macOS, etc.


    So many WebAssembly tutorials demonstrate adding two numbers together. Obviously
    this would not be a good use case for employing a native library unless you were
    talking about machine learning-levels of math. In Chapter 9 we will discuss that
    scenario in more depth. For now, we will just highlight the relative complexity
    of integrating Node.js with native libraries even for this simple, poorly-justified
    example.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'The issue is largely the fact that C and C++ code has direct access to memory
    but JavaScript code does not. In the Node.js environment, the V8 engine manages
    memory for the JavaScript code that runs in it. This makes passing strings, structures,
    arguments and other elements that take up space in memory trickier to send between
    the JavaScript and native portions of the engine. V8 was intended to isolate JavaScript
    from one page in the browser being able to interfere with memory allocated for
    other code on a different page. This isolation is maintained when it is embedded
    in the Node.js environment.


    Server side frameworks are often extensible so we can add additional response
    behaviors, filters, authorization models and data processing workflows. In the
    Java world, there are a series of ways server developers can deploy behavior.
    There are servlets, Spring beans, reactive systems and more. The structure of
    these extensions are often defined by standards or well-established conventions.


    In Node.js, there has historically been middleware like Express and then native
    addons written in C and C++. The majority of applications in this environment
    do not have native addons as the JavaScript engines have become quite performant
    and there is a seemingly limitless supply of open source libraries tackling various
    needs. For the case where JavaScript performance is not suitable, however, it
    is possible to create an extension and make it callable from the JavaScript side
    of things.


    This is not a simple activity, unfortunately. First of all, many JavaScript developers
    are not accomplished C and C++ programmers. There are big differences betwen the
    languages and runtimes and passing memory back and forth from the unrestricted
    world of C and C++ to the isolated, garbage-collected JavaScript world requires
    significant hoop-jumping. Even when the developers are effective in these lower-level
    languages, the adoption of native libraries complicates the build process. Suddenly
    the program artifacts are no longer intrisincally portable and we need to keep
    track of Linux, macOS and Windows versions of the native libraries.'
  merge: -1
  img_proc: true

  md: "to use another language for its performance, clarity of expression or to simply\
    \ reuse existing code is appealing.\n\nThe C language¹ is one of the most important\
    \ and widely-used programming languages in the world. I started playing around\
    \ with it in high school on my Atari ST computer. I had read about it in *Computer\
    \ Language* magazine and a friend gave me a copy of the seminal, eponymously named\
    \ book *The C Programming Language* by Brian Kernighan and the late, great Dennis\
    \ Ritchie².\n\nThere is an immense amount of software available in C and much\
    \ of it can simply be recompiled to WebAssembly. We will discuss porting existing\
    \ libraries in Chapter 6, but for now we will learn a little C and how we can\
    \ use it to improve some of the efforts we have tried so far.\n\n# Using C Functions\n\
    \nA C function is like a JavaScript function in many ways. It has its own lexical\
    \ structure, it is not attached to a larger unit like a class or a struct. It\
    \ may or may not take parameters. It can only return a single value and does not\
    \ support exceptions, however, so error-handling is often a little more primitive\
    \ than in C++, Java, or JavaScript.\n\nIn Example 5-1 there is a C implementation\
    \ of our age calculating function from Chapter 2. Notice how much simpler it is\
    \ to follow what is going on. This example even has some basic error-handling\
    \ to deal with the case of bad parameters where the birth year is bigger than\
    \ the current year. Barring the appearance of a time-traveling visitor from the\
    \ future, that should not happen and we should handle it. Higher level languages\
    \ are just easier for humans to use to express the logic of our business requirements.\n\
    \n*Example 5-1. A simple C program.*\n\n```\n#include <stdio.h>\n\nint howOld(int\
    \ currentYear, int yearBorn) {\n\n    int retValue = -1;\n```"

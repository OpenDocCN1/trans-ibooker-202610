  md: "```\nfor (preopens.asSlice()) |preopen, i| {\n    std.debug.print(\"{}: {}\n\
    \", .{ i, preopen });\n}\n}\n```\n\nI am not going to go through the Zig-specific\
    \ details, but basically we are simply printing out what directories we have preopen\
    \ access to based upon capabilities awarded us by our host environment. Building\
    \ this application requires a different backend target. Rather than the “Freestanding”\
    \ WebAssembly module, we will produce a WASI-based one.\n\nThe first line below\
    \ obviously builds the WASI-module. The second one executes it in Wasmtime without\
    \ giving it access to any directories. As a consequence, there is no output. The\
    \ third line reexecutes Wasmtime with permission to the current directory which\
    \ the application is now able to acknowledge.\n\n```\nbrian@tweezer ~/g/w/s/c/zig>\
    \ zig build-exe preopens.zig -target wasm32-wasi\nbrian@tweezer ~/g/w/s/c/zig>\
    \ wasmtime preopens.wasm\nbrian@tweezer ~/g/w/s/c/zig> wasmtime --dir=. preopens.wasm\n\
    0: Preopen{ .fd = 3, .type = PreopenType{ .Dir = '@\".\"' } }\n```\n\nI am not\
    \ trying to sell you on Zig¹⁶. Instead, I am trying to reinforce one of the major\
    \ themes of this book. WebAssembly is a remarkably value-amplifying technology.\
    \ Being able to pick a language because it is legacy and therefore useful to reuse\
    \ or because it is new, exciting, and adds new benefits while being able to target\
    \ the full menagerie of runtimes we have discussed is quite the achievement.\n\
    \nIf you would like to have a little more fun with Zig, check out this implementation\
    \ of the popular video game written in Zig and using WebGL: https://raulgrell.github.io/tetris.\n\
    \n# Grain\n\nThe final language I am going to cover is certainly not the final\
    \ language that can generate WebAssembly. There are many others we have not had\
    \ an"

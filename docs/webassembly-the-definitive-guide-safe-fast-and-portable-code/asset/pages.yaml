    \ right for you,\n> May not be right for some.\n> \n> —Theme to “Diff’rent Strokes”\n\
    \nThis is the first of our “Applied WebAssembly” chapters where I highlight potential\
    \ use cases for the technology. As you will see over the course of the book, there\
    \ is no single use. Instead, the designers have crafted a platform with increasing\
    \ reach into just about all aspects of the software development industry. So follow\
    \ along. I will not be teaching new features per se. Instead I hope to help shape\
    \ your understanding of how our industry is changing rapidly and how WebAssembly\
    \ will assist.\n\nTo begin, I want you to stop for a moment and think about programming\
    \ languages and machine learning. What is the first one that comes to mind? There\
    \ is probably a good chance your answer was not JavaScript. Why"

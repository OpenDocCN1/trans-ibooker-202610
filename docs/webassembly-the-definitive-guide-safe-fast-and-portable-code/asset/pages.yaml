    \ example in the world, but this proposal, like the Multi-Value Return proposal,\
    \ is more about what it enables than something you would use in and of itself.\n\
    \n# Module Linking\n\nThe final proposal that we will cover briefly in this chapter\
    \ is the Module Linking proposal⁶. The scope of this proposal is quite large,\
    \ but it ultimately is about allowing modules themselves to be imported through\
    \ a variety of mechanisms and styles.\n\nConsider the fundamentals of the WASI\
    \ standard library. We want to have a dependency on a module that will provide\
    \ this behavior without having to import individual methods one-by-one. That approach\
    \ would be fragile, annoying, and ultimately would perform poorly if every function\
    \ invocation had to go through a JavaScript wrapper or something similar. We do,\
    \ however, like the idea of virtualizing the implementations so that filesystem\
    \ access might be approximated by the use of local storage in a browser while\
    \ other APIs might behave as expected (e.g. printing to the JavaScript console\
    \ through fd_write). We also want the benefit of shared nothing architectures\
    \ such as the Unix pipes and filters strategy we have discussed previously without\
    \ performance penalties there either. We also want to be able to have shared instances\
    \ of widely-used modules to save on memory."

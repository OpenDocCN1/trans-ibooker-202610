  md: '# Chapter 6. Applied WebAssembly : Legacy Code in the Browser


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 6th chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at wasmbook@bosatsu.net.


    > No matter where you go, there you are.


    —Buckaroo Banzai


    It is time we look more closely at the process of invoking C/C++ code in the browser.
    Most code in these languages was never intended to run in the browser in a downloaded
    form. But as the leader of the Hong Kong Cavaliers¹ tells us in the above quotation,
    occasionally you will find yourself somewhere unexpected and new but it is still
    just you there.


    We are interested in doing this for a variety of reasons. Replacing JavaScript
    is not one of them. At least not for most people. Instead, we have an enormous
    base of legacy code out there written in languages such as C and C++. A lot of
    it is very useful and it would be great to have access to within our web applications.
    Some of it may be tying organizations to'

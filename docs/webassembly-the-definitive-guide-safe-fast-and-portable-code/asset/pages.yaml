    ...


    It is certainly not necessary to get down in the weeds to see exactly how all
    of this works. It is important for you to understand that we are not actually
    calling printf() in a typical standard library sense, but that this function has
    been rewritten to call the generated code. In the browser it will route the characters
    to the JavaScript console associated with developer tools. In a Node.js environment,
    it will get routed to the underlying system console. What is important at this
    stage is the fact that our legacy application did not have to change to run in
    this new environment but we are also not encumbered with the terrifying prospect
    of running native C and C++ directly. We are striking a crucial balance of portability,
    safety, and performance which is what WebAssembly is all about.


    The generated code has a Module object in the JavaScript which defines the runtime
    environment our WebAssembly code will occupy. There are comments at the top of
    the JavaScript file which describe this object and its role as an interface between
    the two worlds. To keep things manageable, however, we are going to focus on a
    much smaller portion of this.


    One of the options available to us is the use of compiler directives to turn on
    or surpress certain generated behavior. For example, we might not want our C program
    to run immediately when the JavaScript code is loaded. If you try compiling without
    the INVOKE_RUN=0 directive, you will see the typical greeting as you did above.
    In the following snippet, notice nothing is printed out to the command line when
    the code is loaded in Node.js.


    ```

    brian@tweezer ~/g/w/s/ch06> emcc hello.c -o hello.js -s INVOKE_RUN=0

    brian@tweezer ~/g/w/s/ch06> node hello.js

    brian@tweezer ~/g/w/s/ch06>

    ```


    Obviously if you suppress the automatic execution, you will want to be able to
    indicate when the application should be executable. This can be accomplished with
    another directive.'

  md: 'Privilege⁵ and a deliberate attempt to accept the responsibility for security
    organizationally, you can start to head in the right direction.


    For us, the problem is that we are running potentially untrusted code from untrusted
    third parties with the privileges we normally give ourselves in production. Out
    of the box, Node provides no protection against this and that is a serious problem
    that is opening up new attack vectors for Phishing, data exfiltration and other
    attacks.


    Here is a write up of such an attack⁶. The basic idea is that an attacker will
    produce a moderately useful bit of open source functionality and let it start
    to get used. Developers very often add dependencies without considering their
    source, or the transitive collection of sources for dependencies. Once the code
    gains sufficient use in the ecosystem, a minor update under carefully controlled
    circumstances, starts to expose the attack in subtle and hard to anticipate ways.
    Basically, the code may start looking for cryptocurrency private keys or other
    useful and sensitive information.


    One of the only real solutions to this problem involves an active and attentive
    software developer community that hand checks every update to every dependency
    (and its corresponding comprehensive list of transitive dependencies) which is
    pretty much guaranteed to never happen. The other solution is to run in a scenario
    where arbitrary code is not given the privilege to do whatever it likes. Node.js
    has traditionally allowed this model which is one of the reasons its creator,
    Ryan Dahl, has moved on to create something new and more secure.


    Enter Deno.


    # WebAssembly and Deno


    Deno⁷ is basically a more secure runtime for JavaScript and Typescript than Node.js
    is likely to become. Even though both were initially built by the same person,
    security was not as much of a consideration with Node.js and would therefore be
    difficult to tack on after-the-fact. Deno starts off with security as a default
    position. Code running in a Deno runtime cannot'

- pgno: 296
  md: 'example. The Uno Platform¹⁰ is a multi-platform development framework for building
    pixel-perfect applications with C# and WinUI. From a single codebase, you can
    target Windows, iOS, macOS, Android, Linux and now, thanks to WebAssembly, the
    web. This is a radically different prospect than Blazor promises even though Blazor-based
    applications should run in many of these environments in browsers.


    The difference is that Uno is targeting native applications as well and making
    them look identical in every environment. This has been one of the hobgoblins
    of cross-platform development for my entire career. You either have multiple codebases
    and target native applications that look suitable for the operating system (e.g.
    an application looks like a macOS application when running there), or you have
    a single codebase that looks the same everywhere, and therefore, not like a native
    application. Neither is an ideal situation. You do not want your application to
    behave differently than the ones users are comfortable with on their main desktop
    environment, but you also do not want to rebuild an application multiple times.


    There have been innumerable solutions to the common look and feel approach, but
    most of them look and feel terrible. The ones that are passably attractive and
    useful are limited to native applications, not running in the browser. This is
    for reasons that I hope are pretty clear by now. The native libraries that provide
    the common look and feel are not available in the browser. Even if it were worth
    the time to emulate using Canvas-graphics and WebGL or something, the codebases
    would have to be JavaScript and not C, C++, or C# like the other codebases.


    This is what is so compelling about the Uno Platform. They really seem like they
    have cracked this nut with some solid engineering and abstractions. .NET deserves
    a big portion of the credit, but WebAssembly is the final piece of the puzzle.


    Elsewhere in this book, we have used WebAssembly as the prominent vision for developing
    our applications. This includes the benefits and limitations that it provides.
    We have seen a variety of solutions around these limitations with additional tooling,
    infrastructure, new proposals to extend'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'the platform and more. With both Blazor WebAssembly and now also with the Uno
    Platform, WebAssembly is simply a convenient implementation detail. With Blazor,
    whether you are hosting on the server or in the browser does not materially affect
    the development style. Both use Razor components and JavaScript interoperability.
    The server model just uses more of a separation and an independent communication
    model.


    With the Uno Platform, the dominant style, codebase and abstractions are built
    around Xamarin¹¹, an open source platform that provides cross-platform development
    targeting Android, iOS, macOS, Linux or anywhere there is a .NET runtime available.
    Given the portability of the Mono platform, this is the means of ubiquitous native
    support.


    Xamarin includes a user interface technology called Xamarin.Forms that builds
    upon XAML component binding. Uno does not use this part of Xamarin, but instead
    focuses on WinUI-based applications. WinUI is a modern user interface toolkit
    also built upon XAML that provides Fluent Design¹², accessible applications, and
    other modern application development techniques.


    In Figure 13-6 you can see the high level architecture of the Uno Platform. On
    Windows, it is understandably a native platform for these technologies. When targeting
    iOS, Android, and macOS, the Uno Platform uses Xamarin Native libraries with WinUI,
    a combination supported by the .NET 5 and .NET 6 platforms. On Linux, they do
    something cool with the Skia library¹³ which is also WebAssembly-friendly¹⁴. And,
    finally, because the Mono runtime has been compiled to WebAssembly and is available
    in browser as you have seen, it is the basis of the strategy to target browsers.'

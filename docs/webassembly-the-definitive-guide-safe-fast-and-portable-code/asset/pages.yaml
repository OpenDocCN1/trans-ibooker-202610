  md: 'It was under these circumstances in 2015 that none other than Brendan Eich,
    the creator of Javascript, announced that work had begun on WebAssembly³⁸. He
    highlighted a few specific reasons for the effort and called it a “binary syntax
    for low-level safe code, initially co-expressive with asm.js, but in the long
    run able to diverge from JS’s semantics, in order to best serve as common object-level
    format for multiple source-level programming languages.”


    He continued: “Examples of possible longer-term divergence: zero-cost exceptions,
    dynamic linking, call/cc. Yes, we are aiming to develop the Web’s polyglot-programming-language
    object-file format.”


    As to why these various parties were interested in this, he offered this justification:
    “asm.js is great, but once engines optimize for it, the parser becomes the hot
    spot — very hot on mobile devices. Transport compression is required and saves
    bandwidth, but decompression before parsing hurts.”


    And finally, perhaps the most surprising part of the announcement was who was
    to be involved: “A W3C Community Group, the WebAssembly CG, open to all. As you
    can see from the github logs, WebAssembly has so far been a joint effort among
    Google, Microsoft, Mozilla and a few other folks. I’m sorry the work was done
    via a private github account at first, but that was a temporary measure to help
    the several big companies reach consensus and buy into the long-term cooperative
    game that must be played to pull this off.”


    In short order, other companies such as Apple, Adobe, AutoCAD, Unity, and Figma
    got behind the effort. Inexplicably, this vision that had started decades before
    and had involved no end of conflict and self-interest was transforming into a
    unified initiative to finally bring us a safe, fast, portable and web-compatible
    runtime environment.


    There was no end to the potential confounding complexities involved in shepherding
    this platform into existence. It was not entirely clear exactly what should be
    specified upfront. Not every language supported threads natively. Not every language
    uses exceptions. C/C++ and Rust were examples of languages that had runtimes that
    did not require garbage'

  md: '![](img/16b7990eb0dbf589db177bdbd2f4a189_328_0.png)


    # Figure 15-2. Evolution of Our Industry


    What we see is how our industry has changed over time. What developers need to
    be responsible for has been shrinking. What we can rely on our runtime environments
    to provide has grown. Initially, we had to manage everything. We had to buy the
    hardware, install the operating systems and patches and any dependent libraries
    or applications. Keeping these systems patched was a full-time job and could often
    introduce incompatibilities with what our systems were built against.


    Open source operating systems such as Linux and FreeBSD changed the industry.
    What previously involved expensive licenses for proprietary operating systems
    became free. We could have as many copies as we wanted, but the effort to set
    up and configure them on various hardware configurations remained an expensive
    activity ripe for innovation.


    The cloud explosion introduced a virtualization layer where we could be protected
    from the details of the hardware. This gave us the ability to have shared access
    to physical systems with time-sliced usage. Spinning up pre-defined images of
    various operating system configurations made it easy to meet demand and move quickly
    from a known starting point. These virtual machine images were large, cumbersome,
    and overkill for a variety of uses.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'There was still a significant burden for the application developer to manage
    dependencies, but it was progress.


    Container systems as we know them can be traced to seeds in the 1970s with the
    addition of the *chroot* system⁹ In 2000, FreeBSD’s Jail¹⁰ system emerged as a
    way of allowing multi-tenant hosts to further separate what was shared and what
    was unique to each user. This drove interest and development in Linux control
    groups many years later leading to the development of Linux Containers (LXC) in
    2008. Google and CloudFoundry had some offerings along the way, but it was ultimately
    Docker being released in 2013 that really got the ball rolling.


    Overall this containerization approach allowed finer-level granularity around
    the virtualization than the heavier weight images of the previous generation.
    More of the infrastructure could be pre-defined so we could focus on installing
    the right versions of our shared libraries and applications.


    WebAssembly introduced a new version of the idea of safe, stable, portable code
    as you have seen. API availability remains an issue, but WASI helps with that.
    The concept of sandboxed code has become increasingly important in environments
    like this not just because of the supply chain attacks we discussed in Chapter
    8, but also because we wish to deploy code at the various layers of Figure 15-1
    in multi-tenant systems. As Liam mentions in his talk linked above, this is a
    trend you can probably expect to continue as capabilities-based security systems
    are gaining traction.


    In several recent chapters we explored applications loading and executing reusable
    WebAssembly modules through the Wasmtime and Wasmer APIs. Ultimately, this is
    the basis for the final transition to where we find ourselves. This use case helps
    define a new layer of application hosts that will provide options for supporing
    plug-ins, modules, extensions, and even basic functionality. The code requires
    approved capabilities to do anything outside of basic execution such as reading
    from the file system, spawning threads, or opening up a network connection. This
    approach will facilitate a wide range of uses such as long-running applications
    with plugin proxies'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'and filters written in different languages, microservices, and serverless functions.


    In addition to this flexible computational style, the overhead of these approaches
    is even smaller and the security tighter than that provided even by the container
    models that everyone is currently so excited about. This is going to allow us
    to reach into the entire range of our computational landscape highlighted in Figure
    15-1. To reinforce the potential impact we are discussing, Solomon Hykes, a Docker
    cofounder, is often quoted in these discussions from when he said: “If WASM+WASI
    existed in 2008, we wouldn’t have need to create Docker. That’s how important
    it is. Webassembly on the server is the future of computing.”11 As he acknowledges
    subsequently, this does not necessarily mean Docker is going away, but rather
    that we are talking about something of equal significance. The two technologies
    will likely find ways to work together.


    Let’s see how these ideas come together in various ways to lay the foundation
    for our heterogeneous and expansive computational future. We are going to explore
    a handful of commercial and open source offerings below as examples of what is
    being considered now. There will undoubtedly be more before we know it.


    # Fastly Compute@Edge


    Fastly has been a successful CDN provider for the last decade. They are a founding
    member of the Bytecode Alliance and have recently hired many of the engineers
    focused on WebAssembly and WASI from Mozilla. They are moving well beyond serving
    up static content and into the this new world we are imagining with their Compute@Edge
    platform.


    At the core of this offering is the Lucet WebAssembly compiler and runtime that
    is being merged with the Mozilla Wasmtime project we mentioned in Chapter 11.
    In open sourcing it and contributing it to the Bytecode Alliance, Fastly hopes
    to make both runtimes richer by capitalizing on their strengths. Both are built
    around the CraneLift12 project and when combined with WASI will facilitate customers
    being able to push functionality written in a'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'variety of programming languages safely into Fastly’s Edge@Compute environment.



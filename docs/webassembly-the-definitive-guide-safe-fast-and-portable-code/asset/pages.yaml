- pgno: 12
  md: '# Chapter 1. Introduction


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 1st chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at wasmbook@bosatsu.net.


    > Extraordinary claims require extraordinary evidence.

    > —Dr. Carl Sagan


    This chapter will introduce WebAssembly and provide context for its expansive
    reach. In some sense it is a culmination of the evolution of the web over the
    last several decades. There is quite a bit of history to cover to make sense of
    it all. If you are not a fan of history and exposition, you can skip this chapter
    and go to directly to Chapter 2, but I hope you don’t. I think it is important
    to understand why this technology is so important and where it came from.


    # What WebAssembly Offers


    One of the greatest skills an engineer can develop is the ability to assess what
    a new technology brings to the table. As Dr. Fred Brooks of the University of
    North Carolina reminds us, there are no “silver bullets”¹, everything has tradeoffs.
    Complexity is often not eliminated with a new technology, but is simply moved
    somewhere else. So when something does'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'actually change what is possible or how we do our work in a positive direction,
    it deserves our attention and we should try to figure out why.


    When trying to understand the implications of something new, I usually start by
    trying to determine the motivation of those behind it. Another good source of
    insight is where an alternative has fallen short. What has come before and how
    does it influence this new technology we are trying to decipher? As in art and
    music, we are constantly borrowing good ideas from multiple sources, so to truly
    understand why WebAssembly deserves our attention and what it provides, we must
    first look at what has preceded it and how it makes a difference.


    In the paper that formally introduced the world to WebAssembly², the authors indicate
    that the motivation was about rising to meet the needs of modern, web-delivered
    software in ways that JavaScript alone could not. Ultimately it was a quest to
    provide software that is:


    +   - safe

    +   - fast

    +   - portable

    +   - compact


    In this vision, WebAssembly is centered at the intersection of software development,
    the web, its history and how it delivers functionality in a geographically-distributed
    space. Over time the idea has expanded dramatically beyond this starting point
    to imagine a ubiquitous, safe, performant computational platform that touches
    just about every aspect of our professional lives as technologists. WebAssembly
    will impact the worlds of client-side web development, desktop and enterprise
    applications, server-side functionality, legacy modernization, games, education,
    cloud computing, mobile platforms, Internet of Things (IoT) ecosystems, serverless
    and microservices initiatives and more. I hope to convince you of this over the
    course of this book.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Our deployment platforms are more varied than ever so we need portability at
    both the code and application levels. A common instruction set or byte code target
    can make algorithms work across various environments because we just need to map
    logical steps to how they can be expressed on a particular machine architecture.
    Programmers use application programmer interfaces (API) such as OpenGL³, POSIX⁴
    or Win32⁵ because they provide the functionality to open files, spawn subprocesses
    or draw things to the screen. They are convenient and reduce the amount of code
    a developer needs to write, but they create a dependency on the presence of libraries
    to provide the functionality. If the API is not available in a target environment,
    the application will not run. This was one of the ways Microsoft was able to use
    its strength in the operating system marketplace to dominate in the application
    suite space as well. On the other hand, open standards can make it easier to port
    software into different environments.


    Another issue with the runtime side of the software we are building is that different
    hosts have different hardware capabilities (number of cores, presence of GPUs)
    or security restrictions (whether files can be opened or network traffic can be
    sent or received). Software often adapts to what is available by using features-testing
    approaches to determine what resources an application can take advantage of, but
    this often complicates the business functionality. We simply cannot afford the
    time and money to rewrite software for multiple platforms constantly. We need
    better strategies for reuse. We also need this flexibility without the complexity
    of modifying the code to support the platform on which it will run. Making the
    code different for different host environments increases its complexity and complicates
    testing and deployment strategies.


    After several decades, the value proposition of open source software is clear.
    We gravitate toward valuable, reusable components written by other developers
    as a means of satisficing⁶ our own needs. However, not all available code is trustworthy
    and we open ourselves up to software supply chain attacks when we execute untrusted
    bits we have downloaded from the internet. We become vulnerable to the risks,
    business impacts and personal'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'costs of insecure software systems through phishing attacks, data breaches,
    malware and ransomware.


    Until now, JavaScript has been the only story to solve some of these problems.
    When it is run in a sandboxed environment, it gives us some manner of security.
    It is ubiquitous and portable. The engines have gotten faster. The ecosystem has
    exploded into an avalanche of productivity. Once you leave the confines of browser-based
    protections, however, we still have security concerns. There is a difference between
    JavaScript code running as a client and JavaScript running on the server. The
    single-threaded design complicates long-running or highly-concurrent tasks. Due
    to its origins as a dynamic language, there are several classes of optimizations
    that are available to other programming languages that are, and will remain, unavailable
    as options to even the fastest and most modern JavaScript runtimes.


    Additionally, it is too easy to add JavaScript dependencies and not realize how
    much baggage and risk is being pulled in transitively. Developers who do not take
    the time to consider these decisions carefully end up encumbering every aspect
    of upstream software testing, deployment and use. Each of these scripts has to
    be loaded and validated once it is all transferred over the network. This slows
    down the time to use and makes everything feel sluggish. When a dependent package
    is modified or removed, it has the potential to disrupt enormous amounts of deployed
    software⁷.


    There is a perception among casual observers that WebAssembly is an assault on
    JavaScript, but that simply is not the case. Sure, you will be able to avoid JavaScript
    if you want to, but it is mostly about giving you options to solve problems in
    the language of your choice without requiring a separate runtime or having to
    care what language another piece of software is written in. It is already possible
    to use a WebAssembly module without knowing how it was built. This is going to
    increase the lifetime of business value we get out of our software and yet simultaneously
    allow us to innovate in adopting new languages without impacting everything else.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'We have experienced several tools, languages, platforms and frameworks over
    the course of the past several decades that have attempted to solve these problems,
    but WebAssembly represents one of the first times we are getting it right. Its
    designers are not attempting to overspecify anything. They are learning from the
    past, embracing the web and applying problem space thinking to what is ultimately
    a hard and multi-dimensional problem. Let’s look at the formative influences on
    this exciting new technology before we dive into it further.


    # History of the Web


    There is a running joke in the WebAssembly community⁸ that WebAssembly was “neither
    web nor assembly”. While this is true on some levels, the name is suggestive enough
    of what it provides. It is a target platform with a series of instructions that
    are vaguely assemblysque⁹. Given that WebAssembly modules are frequently going
    to be delivered over the web as another type of URL-addressable resource justifies
    the inclusion of the word “Web” in the name.


    One of the main distinctions between “conventional software development” and “web
    development” is the fact there is effectively no installation required with the
    latter once you have a browser available. This is an enormous game changer in
    terms of costs to deliver and the ability to quickly turnaround new releases in
    the face of bugs and feature requests. When couched in other cross-platform technology
    ecosystems such as the internet and the web, it also makes supporting multiple
    hardware and software environments much easier too.


    Sir Tim Berners-Lee, the inventor of the World Wide Web, worked at the European
    Organization for Nuclear Research (CERN)¹⁰ where he submitted a proposal for interlinking
    documents, images and data in the pursuance of CERN’s larger research goals. Even
    though the impact is clear in hindsight, he had to advertise his ideas internally
    several times before he was asked to act upon them¹¹. As an organization, CERN
    was represented by dozens of research facilities around the world who sent scientists
    with their own'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'computers, applications and data. There was no real capacity to force everyone
    to use the same operating systems or platforms so he recognized the need for a
    technical solution to solve the problem.


    Prior to the web, there were services such as Archie¹², Gopher¹³ and WAIS¹⁴, but
    he imagined a more user-friendly platform that was ultimately engendered as an
    application-level innovation at the top of the internet’s layered architecture.
    He also took ideas from the Standard Generalized Markup Language (SGML)¹⁵ as the
    basis of the HyperText Markup Language (HTML).


    The results of these designs quickly became the major mechanism for delivering
    information, documentation and eventually application functionality to the world.
    It did so without requiring the various stakeholders to agree on specific technologies
    or platforms by defining the exchange of standards. This included both how requests
    were made and what was returned in response. Any piece of software that understood
    the standards could communicate with any other piece of software that did as well.
    This gives us freedom of choice and the ability to evolve either side independent
    of the other.


    # Origins of JavaScript


    The web’s interaction model is called HyperText Transfer Protocol (HTTP). It is
    based upon a constrained set of verbs for exchanging text-based messages. While
    it was a simple and effective model that was easy to implement, it was quickly
    seen to be inadequate to the task of interactive, modern applications because
    of inherent latencies in returning to the server constantly. The idea of being
    able to send code down to the browser has always been compelling. If it ran on
    the user’s side of the interaction, not every activity would require a return
    to the server. This would make web applications dramatically more interactive,
    responsive and enjoyable to use. How to achieve this was not entirely clear though.
    Which programming language would make the most sense? How would we balance expressive
    power with shallow learning curves so more individuals could participate in'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'the development process? Which languages performed better than others and how
    would we protect sensitive resources on the client side from malicious software?


    Most of the innovation in the browser space was originally driven by Netscape
    Communications Corp. Believe it or not, the Netscape Browser was originally a
    paid piece of software,¹⁶ but their larger interest was in selling server side
    software. By extending what was possible on the client, they could create and
    sell more powerful and lucrative server functionality.


    At the time, Java was emerging from its beginnings as an embedded language for
    consumer devices, but it did not yet have much of a track record of success. It
    was a compelling idea as a simplified version of C++ that ran on a virtual platform
    and was therefore inherently cross-platform. As an environment designed to run
    software downloaded over the network, it had security built in via language design,
    sandboxed containers and fine-grained permission models.


    Porting applications between various operating systems was tricky business and
    the prospect of not needing to do so created a frenzy around what the future of
    software development would be. Sun Microsystems found itself in the enviable position
    of having a solution to a perfect storm of problems and opportunities. Given this
    potential, discussions were underway to bring Java to the browser, but it was
    not clear what that deal would look like or when it would land.


    As an Object-Oriented Programming (OOP) language Java contained sophisticated
    language features such as threads and inheritance. There was concern at Netscape
    that this might prove too difficult for non-professional software developers to
    master, so they hired Brendan Eich to create a “Scheme¹⁷ for the browser”¹⁸ imagining
    an easier, lightweight scripting language. Brendan had the freedom to make some
    decisions about what he wanted to include in the language, but was also under
    pressure to get it done as quickly as possible. A language for interactive applications
    was seen as a crucial step forward for this emerging platform and everyone wanted
    it yesterday. As Sebastian Peyrott notes in the blog post just cited, what'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'emerged was “a premature lovechild of Scheme and Self¹⁹, with Java looks.”


    Initially JavaScript in the browser was limited to simple interactions such as
    dynamic menus, pop up dialogs and responding to button clicks. These were significant
    advances over roundtrips to the server for every action, but it was still a toy
    compared to what was possible on desktop and workstation machines at the time.


    The company I worked for during the early days of the web created the first whole
    earth visualization environment involving terabytes of terrain information, hyperspectral
    imagery and pulling video frames from drone videos²⁰. This of course required
    Silicon Graphics workstations initially, but was eventually able to run on PCs
    with consumer-grade graphics processing units (GPUs) within a couple of years.
    Nothing like that was remotely possible on the web back then, although, thanks
    to WebAssembly, that is no longer true²¹.


    There was simply no confusing real software development with web development.
    As we have noted, though, one of the nice things about the separation of concerns
    between the client and the server was that the client could evolve independently
    of the server. While Java and the Java Enterprise model came to dominate the backend,
    JavaScript evolved in the browser and eventually became the dominant force that
    it is.


    # Evolution of the Web Platform


    As Java applets and JavaScript became available in the Netscape browser, developers
    began to experiment with dynamic pages, animations and more sophisticated user
    interface components. For years these were still just toy applications, but the
    vision had appeal and it was not difficult to imagine where it could eventually
    lead.


    Microsoft felt the need to keep up, but was not overly interested in directly
    supporting their competitors’ technologies. They (rightly) felt that this web
    development might eventually upend their operating system dominance.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'When they released Internet Explorer with scripting support, they called it
    JScript to avoid legal issues and reverse-engineered Netscape’s interpreter. Their
    version supported interaction with Windows-based Component Object Model (COM)
    components and had other twists that made it easy to write incompatible scripts
    between the browsers. Their initial support of the efforts to standardize JavaScript
    as ECMAScript waned for a while and eventually the Browser Wars²² began. This
    was a frustrating time for developers that ultimately involved anti-competitive
    lawsuits against Microsoft by the U.S. government.


    As Netscape’s fortunes waned, Internet Explorer began to dominate the browser
    space and cross-platform innovation subsided for a while even as JavaScript went
    through the standardization process. Java applets became widely used in some circles
    but they ran in a sandboxed environment so it was trickier to use them as the
    basis for driving dynamic web page activity. You could certainly use Sun’s graphics

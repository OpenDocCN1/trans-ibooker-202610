    \ As a consequence, I am only going to focus on the proposals that are available\
    \ in a WASI environment but will hint at what else is coming when we wrap up the\
    \ chapter.\n\n# Multi Value Return\n\nThe MVP settled on some fairly basic semantics\
    \ for invoking functions. While they may take any number of parameters, functions\
    \ are only able to produce a single result. For many situations, this is obviously\

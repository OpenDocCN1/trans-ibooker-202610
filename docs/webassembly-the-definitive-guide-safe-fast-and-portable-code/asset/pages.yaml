    # Installing Emscripten


    The Emscripten toolchain is a set of tools that wrap the LLVM tools. Originally
    it emitted asm.js, but now it supports WebAssembly directly. In addition to assisting
    with compiling existing C and C++ code, it has drop in replacements for other
    command line tools for building software such as Make and configure.


    With its macros and compiler directives, it is fairly straightforward to simplify
    communicating between JavaScript host environments in the browser or Node.js.
    It has support for widely-used dependencies like the standard library and OpenGL.


    The getting started guide has good instructions for multiple operating systems
    so your best bet will be to investigate this site:

    https://emscripten.org/docs/getting_started/index.html



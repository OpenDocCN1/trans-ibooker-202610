- pgno: 248
  md: 'internal consistency that takes into consideration several of the larger and
    longer-term goals. Many of the motivations for these decisions are documented
    alongside the specifications themselves. Rather than lumping shoe-horned solutions
    to the omissions in the next big release, they have created a series of follow-on
    proposals that are tracked independently. Several of these proposals are inter-dependent
    so there is an order to which they have been submitted and adopted.


    Because the post-MVP world is evolving this way, it gets a little tricky to keep
    track of which features are available in which distribution. I fully expect there
    to be tools and libraries to assist with this, but hopefully the burden on the
    developers will be minimized. Some of these complexities are not super interesting
    or useful so I do not want to spend a lot of time on them, but it is somewhat
    illuminating to see how things like the Multi-Value and Reference Type proposals
    will help enable the heavier-weight Interface Types proposal.


    For our purposes, we will consider them as a collection of follow-on features
    that are not fully supported yet, but are representative of where the WebAssembly
    platform is going beyond its modest beginnings. I will not comprehensively cover
    the proposals as many are more esoteric or have not developed fully yet. Just
    be aware that there are several attempts to improve the experience of targeting
    WebAssembly to make our code more widely-usable, safe, fast and portable.


    # WASI Runtimes


    In Chapter 11 we introduced the main ideas behind WASI. It has become one of the
    major vectors for adding new capabilities to the platform. There is a process
    for introducing a proposed extension which will then go through a series of phases
    on its way to adoption and standardization¹. As we indicated in the last chapter,
    not every runtime will support every proposal. Even if one supports a proposal
    under some circumstances, for security reasons, it may not in others. We saw some
    basic command-line usage with the Wasmer and Wasmtime engines, but the more interesting'

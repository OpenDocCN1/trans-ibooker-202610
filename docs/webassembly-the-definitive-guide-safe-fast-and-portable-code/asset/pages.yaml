    WebAssembly modules in under 50 microseconds compared to say V8’s 5 milliseconds
    to do the same thing¹³. In addition to this speed advantage, it can also do so
    with a very low memory overhead measured in kilobytes rather than tens of megabytes.


    Interacting with the Compute@Edge platform works about as you would imagine. You
    register an account and get access to the API which is protected by tokens¹⁴.
    There is a command line tool for initiating projects and deploying them into the

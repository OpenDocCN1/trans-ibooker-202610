- pgno: 160
  md: "Our final example is going to be a trivial example of using dynamic-linking\
    \ in WebAssembly. We are going to define two modules. One is going to contain\
    \ our previously-defined $add and $sub method. The first module is shown in Example\
    \ 7-5. The main difference to what we have seen before is that this module is\
    \ importing a Table from the host. We place the arithmetic functions into this\
    \ table with the elem instruction. The addition function is stored in position\
    \ 0. The subtraction function is stored in position 1.\n\n# Example 7-5. A dynamically-linked\
    \ module\n\n```\n(module\n  (import \"js\" \"table\" (table 2 anyfunc))\n\n  (func\
    \ $add (param $a i32) (param $b i32) (result i32)\n    get_local $a\n    get_local\
    \ $b\n    i32.add)\n\n  (func $sub (param $a i32) (param $b i32) (result i32)\n\
    \    get_local $a\n    get_local $b\n    i32.sub)\n\n  (elem (i32.const 0) $add)\n\
    \  (elem (i32.const 1) $sub)\n)\n```\n\nOur second module is going to export two\
    \ functions, myadd and mysub. It is advertising the ability to add and subtract\
    \ two numbers to its clients. Internally, it is going to call the function references\
    \ in an import Table instance which we also import from the host JavaScript environment.\n\
    \nThe implementations of our advertised functionality is shown in Example 7-6.\
    \ Both functions invoke the call_indirect instruction. In earlier chapters, we\
    \ saw the use of the call instruction to call a function defined in the current\
    \ module. The call_indirect instruction invokes a function by identifying which\
    \ element of the Table you would like to invoke.\n\n# Example 7-6. A module dependent\
    \ upon the dynamically-linked module"
  merge: -1
  img_proc: true
- pgno: 161
  md: "```\n(module\n  (import \"js\" \"table\" (table 2 anyfunc))\n\n  (type $sig\
    \ (func (param $a i32) (param $b i32) (result i32)))\n\n  (func (export \"myadd\"\
    ) (param $a i32) (param $b i32) (result i32)\n    (call_indirect (type $sig) (get_local\
    \ $a) (get_local $b)\n    (i32.const 0))\n  )\n\n  (func (export \"mysub\") (param\
    \ $a i32) (param $b i32) (result i32)\n    (call_indirect (type $sig) (get_local\
    \ $a) (get_local $b)\n    (i32.const 1))\n  )\n)\n```\n\nOne of the things that\
    \ is going to jump out at you is the use of the type instruction. This is going\
    \ to define the signature of a function to provide a modicum of type-safety in\
    \ WebAssembly. The idea is that an imported Table function should have the signature\
    \ you are looking to invoke.\n\nIn this case we define a function signature that\
    \ takes two i32s and returns an i32. When we invoke the methods through the Table\
    \ we indicate that this is the type we are expecting. After the signature, we\
    \ push the parameters to our function onto the stack before finally pushing the\
    \ Table position number. For addition, that is the constant value of 0, representing\
    \ the first position in the Table. For subtraction, it will be second position.\n\
    \nWe put it all together in Example 7-7. The first thing we do is create a shared\
    \ Table instance. This will be passed in via the importObject to both modules.\
    \ The difference is that the math2.wat module writes its functions, $add and $sub\
    \ into positions 0 and 1 respectively. The mymath.wat module invokes these positions\

    \nIf we update the source code to include some Emscripten-related macros, we can\
    \ easily run it in Node.js as we have seen previously. I also removed the main()\
    \ method so our module will no longer expect an implementation of the printf()\
    \ function since we will be operating in the world of server side JavaScript.\

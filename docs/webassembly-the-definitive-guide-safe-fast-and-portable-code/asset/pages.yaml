  md: 'access the filesystem or open up network connection unless given the permission
    to do so.


    This is obviously not a new idea. Java has had a secure permission model at its
    core almost the entire time it has been a thing. The problem is that Java’s permission
    model can be somewhat byzantine and hard to get right. If anything is going to
    kill security, complexity is at the top of the list. As you will see below, Deno
    has a simpler way of handling this using a capability-based⁸ approach.


    Beyond security, Deno “runs TypeScript” natively where it is usually transpiled
    into some flavor of JavaScript first. While, Deno is compiling it behind the scenes
    and caching the compiled form, it feels more like native support. This improves
    things with respect to the quality of JavaScript development (which also has security
    implications) by allowing for improved type-checking. Problems that would normally
    arise at runtime can be detected at compile time because of the robust type systems
    available in TypeScript.


    Let’s start with our WebAssembly module from Example 8-5 that adds two numbers
    together. In Example 8-7, you can see our first attempt to use Deno’s WebAssembly
    support. Super simple!


    # Example 8-7. Loading WebAssembly modules in Deno


    ```

    const wasmCode = await Deno.readFile("./a.out.wasm");

    const wasmModule = new WebAssembly.Module(wasmCode);

    const wasmInstance = new WebAssembly.Instance(wasmModule);

    const add = wasmInstance.exports.add as CallableFunction


    console.log("2 + 3 = " + add(2,3));

    ```


    Unfortunately, our excitement is short-lived. At least the problem is clear. We
    are attempting to read from the filesystem but we do not have permission to do
    so. We see Deno’s security advantage immediately.


    ```

    brian@tweezer ~/g/w/s/c/deno> deno run main.ts

    error: Uncaught (in promise) PermissionDenied: Requires read access to "./a.out.wasm",

    run again with the --allow-read flag

    ```'

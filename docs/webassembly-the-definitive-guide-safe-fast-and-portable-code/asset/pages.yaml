    \ are 21!\n```\n\nThis works because the executable generated has been turned\
    \ into a suitable format that macOS knows how to run. It is a *Mach-O* executable\
    \ that targets the Intel x86 instruction set on a 64-bit platform.\n\n```\nbrian@tweezer\
    \ ~/g/w/s/ch05> file a.out\na.out: Mach-O 64-bit executable x86_64\n```\n\nThis\
    \ program will not run on a Windows or Linux machine. Without their new emulation\

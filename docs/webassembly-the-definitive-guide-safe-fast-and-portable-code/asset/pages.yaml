    was there. And, as they say, where there is a will, there is a way.


    Over the next year or so, the CG became a W3C Working Group (WG) which was tasked
    with defining actual standards. They made a series of decisions to define a Minimum
    Viable Product (MVP) WebAssembly platform that would be supported by all major
    browser vendors.


    Additionally, the Node.js community was excited as this could provide a solution
    to the drudgery of managing native libraries for the portions of Node applications

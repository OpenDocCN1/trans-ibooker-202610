- pgno: 397
  md: 'opportunity to pursue. Instead, I picked a language that is unique from all
    of the others we have discussed in that it was designed to emit WebAssembly while
    also being a vehicle for popularizing exciting and exotic new academic language
    features.


    The Grain language¹⁷ is young but promising and merges functional benefits, strong-typing
    and language accessibility. Many functional programming languages are tremendously
    powerful, but they also seem arcane and not intended for typical developers. It
    is nice to see these features show up in developer-friendly languages such as
    Java (post JDK 8), Rust, and now Grain. Despite this adoption of the functional
    style, it is not unnecessarily pure, however, and also supports mutable variables.
    Balancing type inferencing with a rich standard library of composite structures,
    direct support for WebAssembly primitives and the pattern-matching capabilities
    of Rust are among its chief charms.


    The website has great documentation about setting up VS Code with a Grain extension
    for an all-around positive developer experience. My purpose here is not necessarily
    to teach you Grain. I will let the online resources and Grain community do that.
    Instead, I just wanted to end with the idea that language innovation does not
    have to occur in a vacuum. It is entirely likely that other new programming languages
    will be designed with WebAssembly in mind. Having a path forward with continuous
    innovation that is easy to adopt is yet another reminder that we are not dealing
    with the technology choices of the past.


    We can build a future where language and runtime and hardware platform and API
    style and data model and storage system choices can be unified into a comprehensive
    vision of technical and business value.


    But that, my friends, is probably my next book.


    # And then?


    There you have it. We have covered tremendous ground in this book from the basics
    of the MVP with its low-level details, to the transition out of the'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'browser into WASI-based environments. We have seen remarkably large and sophisticated
    software projects compiled to WebAssembly, sometimes using shims and shortcuts
    to deal with the platform limitations. We have also seen the active pace of the
    new proposals that seek to extend WebAssembly into just about every nook and cranny
    of our complex, heterogeneous, and ever-changing world of modern software.


    And now, we have concluded with a quick survey of how support for WebAssembly
    is being added nearly across the board to our favorite programming languages in
    one form or another. It is also being adopted by and driving the features of exciting
    new languages. It seems like it is becoming an expectation that all of these languages
    will want to emit WebAssembly output to lay claim to their portion of the future.


    Some of the inertia so far has been awareness, but there is now a growing consensus
    that WebAssembly will have far-reaching impacts at making our software safe, fast,
    and portable. Where there are limitations and omissions, these are generally being
    overcome and closed quickly both by extending the platform and developing toolchains
    that protect us from annoying minutiae.


    I started talking about WebAssembly professionally on the NoFluffJustStuff¹⁸ tour
    in early 2017, just after the MVP had been finalized and browser support was becoming
    ubiquitous. That was clearly well before most people were ready to take advantage
    of this emerging platform, but I wanted to start painting a picture of what was
    coming so software developers can be prepared.


    I have never become less excited about what this platform has in store for us;
    my interest has only grown. As you evaluate the various tools, technologies, and
    use cases we have alighted upon in this book, I hope you have caught at least
    some of that excitement. Things will continue to change on a weekly basis, but
    I hope that the majority of what I have written about is stable and worthy of
    your time.


    I thank you for your attention and I cannot wait to see what you do with what
    you have learned.'
  merge: -1
  img_proc: true

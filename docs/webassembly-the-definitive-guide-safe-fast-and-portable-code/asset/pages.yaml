    They do not want to design themselves into a corner, however, so they are introducing
    some new ideas. The first is the idea of the Ewasm Contract Interface (ECI) which
    defines the structure of a contract module. Modules are communicated in the Wasm
    binary format. Contracts will be allowed to import symbols defined to be part
    of the Ethereum Environment Interface (EEI). This exposes the core Ethereum API
    to the ewasm enviroments. You can think of it a little like the relationship between
    WASI and WASI-host environments. Contracts are expected to export a main() function
    to initiate the contract and a Memory instance for sharing data between contracts
    and its host environments. Again, these should make sense to you by now.


    I am not able to give you a proper tutorial for this new platform here, but the
    basic idea is that contracts will need to be able to fetch and store data, call
    functionality in other contracts, be deployed at knowable addresses, etc. The
    concept remains that the more burden a contract puts on the platform, the more
    cost it will incur. Gas still remains and so there will be an intricate metering

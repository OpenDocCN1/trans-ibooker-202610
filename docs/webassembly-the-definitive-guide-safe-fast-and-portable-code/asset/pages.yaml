    ...


    The daemon does not start publishing files until anyone asks for them, but it
    also starts up a couple of local services. The first is a readonly HTTP gateway
    on listening on /ip4/127.0.0.1/tcp/8000. We have been using the IPFS Go command
    line tools, but anyone else on our localhost can access this service without regard
    to those.


    As an example, there is a famous picture of a cat in IPFS. You can ask for its
    details using the command line tools.


    ```

    brian@tweezer ~/s/ipfs> ipfs ls

    /ipfs/bafybeidsg6t7ici2osxjkukisd5inixiunqdpq2q5jy4a2ruzdf6ewsqk4

    /cat.jpg

    QmPEKipMh6LsXzvtLxunSPP7ZsBM8y9xQ2SQQwBXY5UY6e 262144

    QmT8onRUFpgvkoPMdMvCHPYxh98iKCfFkBYM1ufYpnkHJn 181086

    ```


    What you are seeing are the two blocks that are associated with the file. You
    can also use the local HTTP gateway from the daemon as demonstrated in Figure
    16-2. The URL is obscured but there is nothing fancy, the browser is simply requesting
    a file over HTTP.'

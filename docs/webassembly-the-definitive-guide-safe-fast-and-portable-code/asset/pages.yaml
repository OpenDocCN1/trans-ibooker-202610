    \nOur module exports a Table with the space for ten references. We also have a\
    \ function that simply returns the its parameter. Unfortunately, the Rust code\
    \ in Example 12-8 is substantially more complicated than other examples we have\
    \ looked at because we are wrapping these references, cloning them, deferencing\
    \ them and extracting the wrapped data as needed. I will walk you through it though\
    \ so we can focus on what is new.\n\nThe first thing you will see is the introduction\
    \ of a Config instance. We have been using default configurations for our Engine\
    \ instances previously, but we need to turn on support for the external references\
    \ and then configure our Engine accordingly. From then on things should look familiar\
    \ from a set up perspective.\n\nTo demonstrate the flexibility we have with respect\
    \ to the references, we create two instances of the ExternRef structure from the\
    \ Wasmtime API. One might be an unforgeable bearer token or something that could\
    \ be passed back when the module makes shared function calls. For our purposes,\
    \ I just have a string slice that says “secret key”. The other reference is to\
    \ an array of bytes. As the ExternRef structure is a parameterized type, it is\
    \ able to wrap both data types.\n\nAfter we create the references, we retrieve\
    \ the exported Table from the module and store clones of our references in slots\
    \ 3 and 4. We use Some wrappers so that it makes it easier to tell when a reference\
    \ is there or not. If"

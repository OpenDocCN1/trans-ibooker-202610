    On the one hand, this will give C# developers entree to a simple way to develop
    applications that can be deployed to the browser. As one of the optional constraints
    detailed in Dr. Roy Fielding’s thesis⁹, this is a very useful way to extend the
    behavior of our “universal client”.


    Developers using .NET have clearly had ways of building web applications, but,
    like other platforms they are a mixture of C# (or other .NET language on the backend)
    and then JavaScript in the browser. We have now opened up a path toward a fairly
    significant amount of reuse between desktop enterprise applications and those
    that can now run in a browser. It is not a direct path, but I imagine it will
    get even better over time where you can simply recompile a codebase to target
    other platforms.


    That is when I think this WebAssembly use case will perhaps make an even bigger
    splash. If the bosses realize that they can have significant reuse from their
    codebases and have C# developers have an easier time building web pages, I think
    there will be a dramatic shift in the front end technologies used for enterprise
    applications back to .NET.


    # Uno Platform


    One final use case for WebAssembly and .NET integration deserves mention because

- pgno: 210
  md: 'Notice the signature though. This is not a JavaScript function. From our perspective,
    we are just calling a Rust function from our Rust code. The bridge provided by
    wasm-bindgen is so seamless that we do not even have to think about another language
    at this point.


    This “Hello, World!” instance is going to go the other way as well. From JavaScript,
    we are going to call into Rust. The next #[wasm_bindgen] attribute is applied
    to a Rust function defined in our library that takes two string slices. We use
    the Rust format! macro which is equivalent to string-formatting functions in other
    languages. We take a reference to the returned string and pass it to the alert()
    function identified above. This attribute is going to generate an equivalent JavaScript
    function to call from that side of the world. From its perspective it will be
    calling JavaScript not Rust! The same attribute is keeping us in synch in either
    direction which is rather remarkable.


    The next step is to use wasm-pack to generate our support code. In order to do
    that, we will need to update our Cargo.toml to indicate that we want to generate
    a C dynamic library style output and that we need wasm-bindgen as a dependency
    as shown in Example 10-10.


    # Example 10-10. Cargo.toml file


    ```

    [package]

    name = "hello-wasm-bindgen"

    version = "0.1.0"

    edition = "2018"


    [lib]

    crate-type = ["cdylib"]


    [dependencies]

    wasm-bindgen = "0.2.73"

    ```


    Now we can use wasm-bindgen to generate a JavaScript module that wraps our Rust
    code. I have eliminated some warnings about missing attributes and README files
    as well as some cute little emojis that do not translate well.'

    # Artichoke


    I have long been a fan of the Ruby language. It has a clean syntax and powerful
    metaprogramming capability. It is hard to describe why one language resonates
    versus another, but Ruby’s aesthetic has always appealed to me. Despite this appreciation,
    I have never really done much with it beyond the occasional Rails project. I remember
    the excitement everyone felt when Rails first caught the developer community’s
    attention. For a variety of reasons, despite being extremely productive and a
    well-loved project, performance issues and the need to support another runtime
    have hampered its world domination. Charles Nutter and the the JRuby⁴ community
    have done a yeoman’s job getting Ruby to run on the JVM, but we are now seeing
    another option emerge in the Artichoke project⁵.'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'Artichoke is a Rust-based Ruby runtime environment that is designed to be compatible
    with Matz’s Ruby Interpreter (MRI)⁶. It is early days so I do not want to spend
    much time on this project, but it seems to be moving quickly and they are looking
    for contributors so I wanted to mention it in case you were interested. I would
    love to see this evolve into a full-throttle way of getting Ruby more fully into
    Webassembly environments as it also supports running untrusted code in a sandboxed
    environment.


    I have detailed some ways to install artichoke in Appendix A. This includes the
    artichoke Ruby interpreter and an irb⁷ replacement called airb. For now the easiest
    way to experiment with this Ruby-to-WebAssembly toolchain is probably through
    the Playground⁸ which can be seen in Figure 17-4.


    ![](img/16b7990eb0dbf589db177bdbd2f4a189_383_0.png)


    Figure 17-4. Artichoke Ruby running in the browser


    As with TinyGo, I do not think this is the end game for Ruby and WebAssembly,
    but it is real enough that it should give Ruby enthusiasts confidence that at
    some point in the near future they will be able to participate more fully in the
    WebAssembly ecosystem.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# Swift


    The Swift programming language continues to surprise me with its ever widening
    reach. What seemed initially to be a nice, modern replacement for Objective-C
    in the macOS and iOS programming world has expanded to be open-sourced, available
    for server-side development, and a well-supported language for machine learning
    in the TensorFlow space. It would not be appropriate to classify Swift as officially
    supporting WebAssembly yet, but, as you will see, it is not far off and I think
    we will see it in the main toolchain before long.


    Part of the reason why it is a natural transition to WebAssembly is because Swift
    is based upon LLVM like Rust, clang, TinyGo, and many other projects we have have
    discussed. Beyond that, there is a vibrant community interested in seeing these
    two technologies becoming more directly compatible.


    As per usual, the easiest way to get started playing around at the intersection
    of Swift and Webassembly is in the browser. The SwiftWasm webpage (https://swiftwasm.org)
    provides just such an opportunity as shown in Figure 17-5.'
  merge: -1
  img_proc: true

    # Other Proposals


    There are many other proposals coming to the WebAssembly platform. There are probably
    going to be new ones all of the time¹⁰. This is one of the primary methods that
    the WebAssembly platform designers are using to extend the platform incrementally
    over time.


    Each proposal is considered on its own merits and its potential impact on the
    text and binary formats of modules, the parsing and validation of modules, dependencies
    on or for other proposals, and more. What you have heard about the making of laws
    and sausages¹¹ is true for the standards process as well. These documents use
    precise and formal language to describe the details so there is no error from
    difference in interpretation by implementors.'

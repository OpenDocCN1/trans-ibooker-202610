- pgno: 335
  md: 'This is exactly what Microsoft’s DeisLabs team¹⁶ has been experimenting with
    over the last several years.


    The team has identified WebAssembly as an alternate way to deploy safe, fast,
    secure software. They consider it easier to start from a secure basis like this
    rather than having to lockdown the container instances which is tricky to get
    right. They have developed Krustlet¹⁷, a Rust-based Kubelet (thus the name). Other
    noted benefits of this approach are faster start up and shutdown times and smaller
    deployment elements than conventional containers. This creates new opportunities
    for use with Internet of Things (IoT) sensors and devices, embedded systems, and
    other constrained environments as well as being compatible with existing Kubernetes
    environments.


    They do not think existing applications are going to suddenly be repackaged as
    composed WebAssembly modules, however, so this is in no way intended to replace
    Docker. Instead, it is a minimally-functional Kubelet that interacts with Kubernetes
    basically “as is”. Rather than using only Open Container Initiative (OCI) containers,
    you can mix and match the functionality with WebAssembly and a runtime environment.
    These runtime layers are not fixed but Krustlet has historically worked with Wasmtime
    and the predecessor to the wasmCloud project below. By breaking the coupling between
    Kubernetes and containers, we expect cool things to come from efforts such as
    this. Notably, Krustlet has been adopted by the Cloud Native Computing Foundation
    (CNCF) as a sandbox project.


    Keep in mind, this is largely a way of extending the status quo with WebAssembly.
    It will ultimately allow for a wider range of engines and computational localities
    in concert with a container and Kubernetes-based strategy. It also highlights
    that we have options in terms of our orchestration strategies and application
    host providers which we will discuss next.


    # SubOrbital


    The Suborbital¹⁸ project grew out of a similar interest in decoupling the composition,
    orchestration, and scheduling of behavior from containers.'
  merge: -1
  img_proc: true

  md: "# Example 14-12. AssemblyScript that uses WebAssembly strings\n\n```\n// see:\
    \ tests/index.js \"Test for Example 1\"\n\nexport function getHello(): string\
    \ {\n    return \"Hello world (I am a WebAssembly string)\";\n}\n```\n\nPause\
    \ and consider what is going on. AssemblyScript is defining a string as a literal.\
    \ This string will be allocated and initialized in WebAssembly linear memory.\
    \ All those details we puzzled over in Chapter 4 seem like a distant memory at\
    \ this point.\n\nExample 14-13 is taken from test/index.js. At the top of this\
    \ file we load in the modules and then extract elements of the exported runtime.\
    \ This includes the ability to initialize strings and arrays, pin the pointers\
    \ so they will not be garbage collected and pass values back and forth. I hinted\
    \ at this capability in the previous discussion about garbage collection.\n\n\
    # Example 14-13. Setting up the use of WebAssembly strings in JavaScript\n\n```\n\
    // Load the node module exporting our WebAssembly module\nconst myModule = require(\"\
    ../index\");\n\n// Obtain the runtime helpers for\nconst {\n    // memory management\n\
    \    __newString, __newArray,\n    // garbage collection\n    __pin, __unpin,\n\
    \    // and interop\n    __getString, __getArray, __getArrayView\n} = myModule;\n\
    ```\n\nExample 14-14 finally represents the first test. The string returned from\
    \ our modules getHello() method will be allocated in our module’s Memory instance.\
    \ The location of this string in memory is managed by the runtime, but we are\
    \ able to pin it to keep it from being garbage collected. The __getString() method\
    \ will go through the motions of wrapping the underlying buffer and converting\
    \ the string into a usable JavaScript string.\n\n# Example 14-14. Using the exported\
    \ runtime for working with WebAssembly strings"

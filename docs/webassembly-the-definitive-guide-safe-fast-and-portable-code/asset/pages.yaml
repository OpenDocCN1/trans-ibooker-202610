    The strange looking identifiers show you the power of the Multiformats I mentioned
    above. These are self-describing network references. We have the various ports
    and protocols that our daemon is listening on to communicate with its peers. We
    have the ports it is listening on, the IP addresses where it is binding to (e.g.
    localhost or other interface), what'
  merge: -1

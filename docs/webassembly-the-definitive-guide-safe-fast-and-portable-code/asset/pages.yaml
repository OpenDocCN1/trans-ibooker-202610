  md: 'and a variety of other scenarios. We will touch upon some of that in Chapter
    16, but for now we will focus on our final WebAssembly application infrastructure
    runtime.


    # wasmCloud


    The wasmCloud project²⁴ is a sophisticated and evolving collection of technologies
    known previously as waSCC (which stood for WebAssembly Secure Capabilities Connector).
    It has recently been selected as an official CNCF Application runtime project
    and promises to help developers build actor-based models on orchestrated capabilities
    across the entire spectrum of locations we have discussed throughout this chapter.
    I want to focus on it because I think they effectively address the various engineering
    decisions that go into solving the mysteries of the final column of Figure 15-1.
    It certainly is not the only project that is likely to, but for now it is the
    most robust and comprehensive distillation of that vision.


    wasmCloud provides a comprehensive abstraction from cloud-based infrastructure.
    The use of actors allows developers to produce business functionality that is
    based upon message handling and the use of capabilities provided by the infrastructure.
    Capabilities are just a term for non-functional requirements needed for actors
    to have their expectations met by an application runtime. The clean separation
    allows reuse across different environments as well as hot-swapping of underlying
    implementations within the same one.


    The tools and frameworks associated with wasmCloud are intended to solve the complexities
    of deploying multi-lingual code libraries to an increasingly diverse set of platforms
    as outlined in Liam’s talk above. They are fixated on only adding the pieces that
    they need to which is why they leverage WebAssembly and WASI. The team made a
    recent decision around a migration toward the Elixir and OTP platform instead
    of hand-rolling the concurrency solutions in this ecosystem. They long ago decided
    to base their connective infrastructure on the NATS²⁵ tool chains and frameworks
    for adaptive edge and distributed communication.'

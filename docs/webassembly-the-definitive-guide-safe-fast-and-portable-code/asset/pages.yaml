- pgno: 226
  md: 'are often slow, cumbersome and burdensome to developers. WebAssembly wants
    to solve this problem, and it does in many ways. Fundamentally, however, WebAssembly
    modules do not have access to anything that is not provided by their hosting environments.


    The MVP and the tools that we have seen so far have largely been about making
    code portable. We are now going to learn how to make applications portable. The
    solution, as it turns out, is fundamentally about whether expectations can be
    met or not. This is not just a question of languages, but also of application
    programming interface (API) availability, runtime environment configurations,
    security restrictions and more. As a consequence, just like Bruce Lee’s quotation,
    our host environments are not always here to meet the expectations of the code
    we are running. We can still be in control.


    # WebAssembly System Interface (WASI)


    The cool demos and code samples you have seen so far, particularly the ones involving
    graphics, sound, video and the like, are largely possible because they run in
    the browser. This is a piece of software designed to be a universal client, a
    host to other code. It is possible to extend the Web by sending arbitrary programs
    down to the client for execution. It has built-in security restrictions, but it
    is actually quite a featureful programming environment these days filled with
    APIs such as WebGL for 3D graphics, accelerated video, WebRTC for collaboration
    and more. Emscripten provides implementations of standard APIs such as POSIX and
    OpenGL via what is available to the browser runtime environment so that standard
    C/C++ applications can simply compile and still work.


    We have seen a mechanism for providing functions to module instances to invoke
    via objects they import. Remember, for example, passing in a JavaScript function
    that prints to the console rather than relying on the Standard C Library to provide
    access to printf(). This is a fundamentally unsatisfactory approach though. Every
    WebAssembly module that needs to print to the console should just have a function
    to call,'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'preferably the one it was already written against whenever it needs it. This
    is about meeting expectations safely and performantly.


    Because of security concerns, however, the other part of the Bruce Lee quotation
    is relevant. Just because a program wants to read or write to the filesystem does
    not mean it gets to. Our business-critical desktop computers are not in this world
    to meet the expectations of malicious software. We want to control the context
    in which applications get access to resources, if at all.


    Another issue with respect to expectations is that runtime environments outside
    of the browser are a significant part of WebAssembly’s potential execution surface.
    Many of these APIs are not available in the same way in environments like Node.js
    or Deno. There are not compatible Web IDL¹-defined interfaces exposing access
    to audio and video playback, 3D graphics and the rest. There are certainly other
    similar APIs available, but they are not directly compatible with what is inside
    of browsers and applications would have to be rewritten to use them.


    Normally POSIX functions will be consistently-defined across different operating
    systems and will map to lower-level kernel functions or platform-specific APIs
    such as Win32². These are such crucial bits of reusable functionality that we
    want them to be fast and stable implementations. Arbitrary JavaScript wrapper
    functions provided by application developers are not likely to be fast or stable
    enough. Many of these extra-browser APIs do not have the same security guarantees
    of sandboxed-browser environments so they are not directly available there either.


    These are among the myriad of problems WebAssembly System Interface (WASI) is

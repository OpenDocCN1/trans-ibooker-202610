  md: 'programming paradigms such as the Promise-based²⁵ style allowed better modularized
    and asynchronous-friendly application code to achieve powerful results in JavaScript’s
    notoriously single-threaded environment. But the language itself was incapable
    of the kinds of optimizations that were possible in other languages such as C
    or C++. There were simply limits on what was going to be possible from a language-performance
    perspective.


    The web platform standards continued to advance with the development and adoption
    of technologies such as WebGL²⁶ and WebRTC²⁷. Unfortunately, JavaScript’s performance
    limitations made it ill-suited to extend the browsers with features involving
    low-level networking, multi-threaded code and graphics and streaming video codecs.


    The platform’s evolution required the painful slog of the W3C member organizations
    to decide what was important to design and build and then roll it out in the various
    browser implementations. As people became ever more interested in using the web
    as a platform for heavier-weight, interactive applications, this process was seen
    as increasingly untenable. Everything either had to be written (or re-written)
    in JavaScript or the browsers had to standardize the behavior and interfaces which
    could take years to realize new advancements.


    It was for these and other reasons that Google began to consider an alternative
    approach to safe, fast and portable client side web development.


    # Native Client (NaCl)


    In 2011, Google released a new open source project called Native Client (NaCl).
    The idea was to provide near-native speed execution of code in the browser while
    running in a limited privilege sandbox for safety reasons. You can think of it
    a bit like ActiveX with a real security model behind it. The technology was a
    good fit for some of Google’s larger goals such as supporting ChromeOS and moving
    things away from desktop applications into web applications. It was not initially
    meant necessarily to extend the capabilities of the open web for everyone.'

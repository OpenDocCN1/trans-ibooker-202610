  img_proc: true
- pgno: 192
  md: '![](img/16b7990eb0dbf589db177bdbd2f4a189_192_0.png)


    Figure 9-2. A WebAssembly Backend for Tensorflow.js


    This highlights a prominent use case for WebAssembly. It is not about replacing
    JavaScript, at least not in all cases. It is about extending what is possible
    in the browser without having to wait for consensus from the browser vendor community.
    WebGPU¹⁰ or something like it is coming through the standards process, but this
    can take years. An existing library written in C++ designed to be optimized and
    portable across many platforms is able to bring a good portion of that power to
    browsers now without waiting.


    This broadens the computational runtime to include older devices without powerful
    GPUs. The code can be optimized to still run well across a wide range of platforms.
    Additionally, the WebAssembly designers are in the process of adopting two advanced
    features that we will discuss in later chapters. This includes the use of Single
    Instruction Multiple Data (SIMD)¹¹ parallelization and the use of multiple threads.


    In Figure 9-3, we have a similar use of MobileNet as before. Clearly the WebAssembly
    backend on its own does not perform as well as the WebGL-backed one. You are encouraged
    to use the Wasm backend instead of the plain JavaScript one as it will perform
    much better everywhere. Depending on the model size, the Wasm backend makes more
    sense than the WebGL one because of some fixed costs with respect to WebGL execution.
    Note the dramatic improvement in performance for the platforms that support them
    when threading and SIMD-parallelization are added to the Wasm mix.'
  merge: -1
  img_proc: true

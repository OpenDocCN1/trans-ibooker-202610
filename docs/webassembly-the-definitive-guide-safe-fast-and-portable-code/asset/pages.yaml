  md: "# Chapter 12. Extending the WebAssembly Platform\n\n# A NOTE FOR EARLY RELEASE\
    \ READERS\n\nWith Early Release ebooks, you get books in their earliest form—the\
    \ author’s raw and unedited content as they write—so you can take advantage of\
    \ these technologies long before the official release of these titles.\n\nThis\
    \ will be the 12th chapter of the final book.\n\nIf you have comments about how\
    \ we might improve the content and/or examples in this book, or if you notice\
    \ missing material within this chapter, please reach out to the author at wasmbook@bosatsu.net.\n\
    \n> He picks up scraps of information\n> He’s adept at adaptation\n> ‘Cause for\
    \ strangers and arrangers\n> Constant change is here to stay\n> \n> —Rush, Digital\
    \ Man\n\nThe Minimum Viable Product (MVP) definition of WebAssembly put a stake\
    \ in the ground but was never intended as a comprehensive solution for all uses.\
    \ It primarily focused on language features that are ubiquitous and runtimes that\
    \ do not require the complexities of threading, garbage collection and exception-handling.\
    \ There were several other limitations that we have seen throughout the book.\
    \ While it is impressive that people have found ways around these short-comings,\
    \ the MVP was never the endstate. It was the beginning.\n\nThe designers of the\
    \ WebAssembly platform have taken a surgical approach to its decisions. While\
    \ it may be confusing from the outside, there is an"

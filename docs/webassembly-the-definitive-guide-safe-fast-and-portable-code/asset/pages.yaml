    \ modules together based upon their import and export configurations. Because\
    \ the WASI functionality is widely used, it is available as the separate dependency\
    \ we saw in Example 12-11 above. We basically add details of this module to our\
    \ linker so they are available to be linked to modules that depend on this behavior.\n\
    \nAfter this we instantiate our two modules, configure the WASI instance and add\

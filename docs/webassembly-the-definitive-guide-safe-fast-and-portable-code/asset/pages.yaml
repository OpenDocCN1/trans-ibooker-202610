- pgno: 349
  md: '# Chapter 16. Applied WebAssembly : Decentralized Applications


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 16th chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at wasmbook@bosatsu.net.


    > It’s true that contemporary technology permits decentralization, it also permits
    centralization. It depends on how you use the technology.

    > —Noam Chomsky


    The software we write takes on a role depending on where and how it is deployed.
    Legacy systems were often single applications that took in input, did some processing,
    and produced output. Unix commands are often tools to coordinate together into
    scripted workflows. In this book, we have largely been discussing WebAssembly’s
    strengths in client-side user interfaces with the occasional foray into server
    side technology. These days, our software plays many other parts in the cloud,
    through microservices architectures, in embedded systems and mobiles devices,
    and serverless functions.'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'These different roles often serve an architectural purpose in an attempt to
    manage change, allow for independent technology choices, to meet scale demands
    or to facilitate reuse and avoid silos. There is an underlying tension to how
    the disparate elements are organized and coordinated. Most conventional systems
    are centrally-managed, but we are seeing an increased aptitude in developers being
    able to wrangle widely-deployed, decentralized systems into productive use. Let’s
    start by discussing some of the tradeoffs.


    # Centralization vs Decentralization


    Our industry has long vacillated between centralization and decentralization.
    Neither arrangement is ideal, both have their benefits and negative side effects.
    Centralization is easy to control, index, optimize, and provide a common experience.
    Decentralization can be stable, empowering, and censorship-resistant. Mainframes,
    hosted services, and siloed social media sites are examples of centralization.
    PCs, mobile devices, and file-sharing systems are examples of types of decentralization.


    It is easy to deny people access to centralized resources. They are often fragile
    if not maintained. Many governments attempt to control access to certain kinds
    of thinking by controlling access to information. Decentralized systems are very
    difficult to make useful, efficient, and avoid market pressures that will encourage
    a recentralization at some point.


    The Web strikes a pretty nice balance between the two forces in general. On the
    one hand, anyone can invent a new protocol and listen for clients that speak it
    on a port. There is no required centralization until we bring naming into it.
    The Domain Name Service (DNS) has a central orientation. There is an authority
    even though it is spread out hierarchically for speed and convenience. Once you
    have a domain name, however, you are able to create as many resources in that
    domain as you want. You may share them freely and give access to whomever you
    choose. But, DNS can also be controlled as people who have gotten on Wifi in coffee
    shops, airplanes, or countries with oppressive regimes have sadly discovered.'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'Part of the issue is the use of location-based identity. On one hand, it is
    super useful that the names we wish to connect with via the HTTP protocol are
    the things we will interact with. On the other hand, if we decide to stop hosting
    these resources, they go away. In my previous book on resource-oriented architecture
    patterns¹, I identified the curated URI pattern as a way of bringing stability
    to the interaction. But as anyone who has ever run into a broken link can attest,
    the practice is not widely practiced.


    One of the benefits of the web is that content producers and content consumers
    can largely make their own technology choices. By using standards, we can exchange
    declarative structures defining layouts and styling choices that work well across
    a range of targets. Javascript has long been part of that story and now, as you
    have seen, WebAssembly is too.


    Decentralization benefits from consistent use of standards, protocols, and engineering
    practices that allow arbitrary participants to exchange content. Having the ability
    to exchange executable content portably, safely, and performantly is going to
    widen what is possible.


    When we built our distributed computing system at Parabon, we had to rely on the
    Java language and platform in order to get the safety and portability guarantees
    we needed. We were ultimately a centrally-controlled platform but in a modern
    setting, it would be fairly straightforward to build a similar decentralized system
    with WebAssembly, WASI, and the various runtimes we have discussed. In the previous
    chapter, we saw how this is helping evolve our computational landscape. As Chomsky
    said, we can support either approach; it is up to us what we do with it.


    We will now discuss a handful of decentralized platforms including:


    +   - Bitcoin and Legacy Ethereum

    +   - ewasm

    +   - The Polkadot Network

    +   - The Interplanetary File System (IPFS)'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# From Bitcoin to Ethereum


    One of the poster children for decentralized systems is Bitcoin in particular
    and cryptocurrencies² in general. For all the excessive hype and negative naysaying,
    what Satoshi Nakamoto designed into the system is rather remarkable from a technical
    and social perspective. There are plenty of unaccounted for externalities that
    need to be considered when discussing the totality of a technology, but I want
    to focus on the parts that are relevant to the topic at hand.


    Beyond the obvious concept of currency, the Bitcoin system is filled with economic
    levers that can drive stakeholder behavior. One of its main achievements is the
    development of a consensus mechanism that allows participants to agree on the
    rules and their enforcement without a requirement for real identities or weak
    notions of trust. By now, most people are aware of how it works, but in the interest
    of clarity, I will summarize it briefly as the basis for modern blockchain thinking.
    We will connect it back to WebAssembly when we discuss Ethereum as an follow on
    platform.


    Bitcoin has a maximum currency base that will be released. It uses computationally
    difficult problems to control the steady release of decreasing amounts of the
    currency over time. Roughly every ten minutes or so, a little bit more is added
    to the ecosystem, but it is tapering off over time. Miners validate all of the
    transactions that are executing on the platform. That is their main purpose. But,
    as reward for their effort, they can participate in a recurring puzzle to find
    the solution to a hash problem. As more miners participate there is more power
    to attack the problem, so it gets harder over time. In its current form, it would
    take several hundred thousand years for a single computer to solve a round on
    its own.


    Nobody has that kind of time, so they work together in parallel through mining
    pools to find it in a matter of minutes. The node that finds it announces its
    solution to the rest of the miners who verify the outcome. Once everyone comes
    to consensus on the result, this entitles that node to award itself the CoinBase
    transaction³ which it will share with its pool'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'peers. The winning node must also decide which other transactions will end
    up in the current block and then links it back to previous blocks. This is where
    the name blockchain comes from.


    What actually runs on the nodes is fairly constrained. It is ludicrous numbers
    of hash transactions, the communication protocols, and the verification of the
    transactions which involve executing a small Forth-like⁴ language called Script.
    This mostly just verifies that the account sending Bitcoin to another account
    is in control of the private keys associated with the account. There really is
    not a whole lot to it and not much else you can do with it. There is some wiggle
    room, but it is an intentionally constrained language and therefore easy to support
    across multiple platforms.


    One way that I explain what Parabon was doing is that it was like the Seti@Home
    project⁵ except it was a pre-emptive Java-based general purpose programming solution.
    This latter distinction is because SETI@Home only did one thing initially⁶. It
    just chunked through data. As a consequence, they could be substantially more
    comfortable using other people’s computers because there was only a fixed number
    of tasks that it did.


    As I indicated in Chapter 15, we were effectively constrained to a particular
    type of problem in terms of what made sense to run on the platform, but the actual
    code could be anything we allowed (i.e. no disk or network access). We did prime
    searches, gene sequence comparisons that scaled linearly, machine learning, thermospheric
    simulations, and more. As I was the first engineer at the company, one of the
    questions I was asked was “How would you control a runaway process?” We were using
    other peoples’ computers but we were considering allowing clients to run arbitrary
    code. This is the same dilemma we face with the safety of code we install on our
    computers, phones, tablets, and watches.


    The Bitcoin core developers wanted to keep what could happen on the mining nodes
    constrained, more like SETI@Home. Vitalik Buterin and others wanted to expand
    what could run on the platform. When it became obvious that it was not going to
    be possible, the Ethereum project emerged'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'as a result. One of the main differences between the two projects was about
    the nature of what would run on the nodes. The Ethereum developers wanted a Turing
    Complete language⁷. Without going into a ton of theory, this gets back to the
    problem of runaway tasks. So, let’s take a quick side trip to talk about that.


    # How do you solve a problem like The Halting Problem?


    If we want to run arbitrary tasks on a computational platform, there are two ways
    to determine if the code will eventually stop. One is to reason about it and the
    other is to try it out with the unfortunate side effect of potentially waiting
    until the Heat Death of the Universe to happen before we answer the question.
    One of those is perhaps harder than the other, and, as it turns out, it isn’t
    trying and waiting (although that is still not recommended).


    In computability theory, this is known as an undecidable problem⁸ and it is part
    of the reason the Bitcoin developers were not enthused by the idea of running
    a Turing-complete language. If you are compensating people for the time you are
    using their computer, it would be nice to know if the program will ever finish⁹.


    All is not lost, however. Mining nodes on the Ethereum platform must run the arbitrary
    contract code. The more resources you use computationally (storage, CPU time,
    etc.), the more you have to pay. It would be really annoying to start executing
    a contract and letting it run for a few millenia before realizing you would never
    get paid for that work. The Ethereum team came up with a good solution called
    “gas”. The idea is that if you want to drive across country, you better have enough
    money for gas. Otherwise, somewhere in the middle you will run out and you might
    get stuck. An Ethereum contract is evaluated with a quick heuristic to determine
    roughly how expensive it will be to run and the client launching the contract
    has to cough up that much or more. As the contract executes, it consumes gas and
    can run out. If it does, the nodes get compensated for effort and you may be left
    with nothing. It is a reasonable compromise to an'
  merge: -1
  img_proc: true

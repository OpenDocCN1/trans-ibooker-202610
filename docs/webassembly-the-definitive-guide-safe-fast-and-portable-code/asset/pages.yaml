- pgno: 389
  md: "The first option allows us to embed WebAssembly in Java with Wasmer as we have\
    \ seen for other languages. That is clearly not the same thing as compiling Java\
    \ to run on a WebAssembly platform, but it is a start. It depends on the Wasmer\
    \ library and Java Native Interface (JNI) to load, but it is straightforward enough\
    \ overall. The basic structure is shown in Example 17-6.\n\n# Example 17-6. Our\
    \ howOld function being called from Java via Wasmer\n\n```\nimport org.wasmer.Instance;\n\
    \nimport java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Paths;\n\
    \nclass HowOldExample {\n    public static void main(String[] args) throws IOException\
    \ {\n        byte[] bytes = Files.readAllBytes(Paths.get(\"howold.wasm\"));\n\
    \        Instance instance = new Instance(bytes);\n\n        Function howOld =\
    \ instance.exports.getFunction(\"howOld\");\n        Integer result = (Integer)\
    \ howOld.apply(2021, 2000)[0];\n\n        System.out.println(\"Result: \" + result);\n\
    \n        instance.close();\n    }\n}\n```\n\nThere is nothing substantially different\
    \ from what we have seen so far with respect to the Wasmer API. We instantiate\
    \ an instance of a WebAssembly module, retrieve a Function instance and invoke\
    \ it with our parameters. In the wasmer-java/examples directory¹⁰ there are additional\
    \ demonstrations on how to interact with exported Memory instances.\n\nThe Bytecode\
    \ Alliance does not presently maintain Java APIs for interacting with the WasmTime\
    \ runtime, but there are community-supported versions available here: https://github.com/kawamuray/wasmtime-java\
    \ and here: https://github.com/bluejekyll/wasmtime-java. They behave very much\
    \ like the Wasmtime APIs we have seen in Rust and .NET in previous chapters."
  merge: -1
  img_proc: true
- pgno: 390
  md: 'Another similar option is to use GraalVM, a high-performance JDK distribution
    that provides support for polyglot development and near native performance to
    the Java world. With additional support it is possible to run Python, Ruby, R,
    JavaScript, WebAssembly, and LLVM-based languages through the LLVM JIT engine.
    Not only is it possible to write these languages, it is also possible to have
    them interoperate. There is a similar API from the GraalVM community for instantiating
    WebAssembly modules and invoking them from Java which is substantively equivalent
    to what we just did. Given the polyglot interoperability, I would concede that
    it was a step closer to supporting Java and WebAssembly more fully, but it is
    still not a full solution. Until there is proper, standardized garbage collection
    and thread support in the WebAssembly ecosystem, it is not going to be straightforward
    to run Java in this way.


    Once this does happen, and we see additional improvements in the WebAssembly run
    times from a performance and optimization perspective, then we will start to see
    organizations question the need for a JVM and a WebAssembly engine in production.
    Java itself will not go away, but I can see a scenario in the future where people
    are fine with a single runtime of co-mingled software whether it is using GraalVM
    or a WebAssembly engine.


    While Java is not a fully-supported language yet, it does not mean there is not
    a strategy toward adoption. The company Leaning Technologies has a commercial
    offering called CheerpJ¹¹ that has some impressive results. The solution is a
    combination of ahead-of-time compilation, a WebAssembly and JavaScript runtime
    and the ability to do dynamic compilation on the fly. I will let you investigate
    their offering on your own, but you can see the remarkable achievement of running
    the SwingSet3 demo in the browser in Figure 17-8. This will not represent the
    ultimate integration strategy from Java and WebAssembly, but if you have a need
    now to support legacy systems in the browser, it might be an option.'
  merge: -1
  img_proc: true
- pgno: 391
  md: 'Figure 17-8. The SwingSet3 demo running in a browser via CheerpJ


    # Kotlin


    Kotlin reminds me of the old Saturday Night Live ad parody for “Shimmer”, the
    combination floor wax and dessert topping¹². As a language and a runtime, there
    are so many things it can be, it feels like it falls into multiple categories
    simultaneously. It can be used to target applications on the JVM, it transpiles
    to JavaScript to run in the browser, it has a scripting side to its list of identities,
    and it can generate native applications on iOS and Android via an LLVM compiler.'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'What it is, undoubtedly, is popular. Different organizations use it for different
    reasons, but it combines many different language features to create a concise
    and safe industrial-strength object-oriented programming language. It has been
    adopted as the preferred language for developing Android applications as well
    as a fully-supported language for super star open source projects such as Spring
    and Gradle.


    Along the way, they experimented with generating WebAssembly through its LLVM
    compiler. As of now, they are deprecating that approach for a more fully-supported
    backend to handle Kotlin to WebAssembly directly. This is definitely a work in
    progress as they were forming a new team to manage this and trying to staff it
    up in May of 2021.


    You can still use the *kotlinc-native wasm32* backend to experiment if you like,
    but that is not going to be the long-term strategy. So, while there are great
    things in the plans for the pairing between these languages, we must take a wait-and-see
    approach for the time being.


    # Zig


    It will not surprise me to hear that you might have never heard of Zig, or if
    you have, only in passing. My favorite anecdote about it is that Jakub Konka,
    a well-respected software and researcher into algorithms and compiler theory learned
    Zig while waiting for a Rust compile to finish¹³. It is a funny story that gets
    to poke fun at the notoriously slow Rust compiler¹⁴ while also giving you a suggestive
    hint about what Zig brings to the table.


    First of all, as indicated by the story, Zig is a simple language. Their website¹⁵
    suggests that your time is better spent debugging your applications rather than
    your knowledge of your programming languages. Complex programming languages are
    hard to learn and hard to be effective with until you have mastered them over
    years. Zig has no hidden control flow, no hidden memory allocations, and neither
    a preprocessor, nor a macro system. Its entire syntax is captured in a 500 line
    parsing expression grammar file.'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'Their functional design aesthetic is captured in their main documentation webpage.
    It is precisely that: a single page. It is a long, easily searchable file that
    also functions nicely offline.


    Do not confuse their avoidance of flimflammery with a restricted feature set.
    Zig is a fast, portable language that supports cross-compilation for targeting
    multiple platforms, a wide range of safety and optimization options, direct support
    for SIMD vectorization, and much, much more.


    What I am hoping to stress here is not that you need to learn Zig, although it
    is high on my list of new languages to master. Instead, I want you to think more
    about the fact that languages bring some amount of value to the table while runtimes
    bring other types of value. We have imagined a variety of use cases throughout
    the book that involve anything from reusing legacy libraries to writing safe,
    modern code that eliminates some runtime errors by turning them into compile time
    errors. We have a range of options in choosing a language in which to express
    our application and systems functionality. And, increasingly, we do not need to
    worry that our niche little language can never be used because it lacks a well-supported

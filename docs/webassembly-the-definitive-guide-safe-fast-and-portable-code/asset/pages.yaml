    # libsodium


    Before we wrap up this chapter, I want to draw your attention to a project called
    libsodium. We are not going to do anything directly with it, but it demonstrates
    additional motivation for mixing languages such as C and C++ with the browser
    via WebAssembly.


    This library is based upon another library called Networking and Cryptography
    library (NaCl)⁸. It is a high-performance, modern encryption library written by
    people who know what they are doing. Many of the features of this NaCl are not
    necessarily available to JavaScript runtimes yet. New ciphersuites⁹ including
    Authenticated Encryption with Additional Data (AEAD) might show up here long before
    they are ported to JavaScript or available to the browser through the operating
    system. One compelling use case for WebAssembly is the ability to basically recompile
    such modern support and bring it to the browser immediately without having to
    wait for updates.


    A second motivation is that the authors of the NaCl library know what they are
    doing. It is extremely easy to undermine the efficacy of an encryption library
    with a poor implementation. Even something as subtle as comparing whether two
    hash values are the same can leak details if not implemented correctly. Frustratingly,
    the correct implementation of this comparison will fly in the face of how developers
    would normally compare two hashes. My point is that there is a provenance to the
    NaCl code base. If a JavaScript developer without the background to understand
    these details tried to'

- pgno: 80
  md: "# Example 4-7. Fibonacci calculations expressed in Wat.\n\n```\n(module\n \
    \ (memory (import \"js\" \"mem\") 1) ①\n  (func (export \"fibonacci\") (param\
    \ $n i32) ②\n    (local $index i32) ③\n    (local $ptr i32) ④\n\n    (i32.store\
    \ (i32.const 0) (i32.const 0)) ⑤\n    (i32.store (i32.const 4) (i32.const 1))\n\
    \n    (set_local $index (i32.const 2)) ⑥\n    (set_local $ptr (i32.const 8))\n\
    \n    (block $break ⑦\n      (loop $top ⑧\n        (br_if $break (i32.eq (get_local\
    \ $n) (get_local $index))) ⑨\n        (i32.store ⑩\n          (get_local $ptr)\n\
    \          (i32.add\n            (i32.load (i32.sub (get_local $ptr) (i32.const\
    \ 4)))\n            (i32.load (i32.sub (get_local $ptr) (i32.const 8)))\n    \
    \      )\n        )\n        (set_local $ptr (i32.add (get_local $ptr) (i32.const\
    \ 4))) ⑪\n        (set_local $index (i32.add (get_local $index) (i32.const 1)))\n\
    \        (br $top) ⑫\n      )\n    )\n  )\n```\n\n① The Memory is imported from\
    \ the host environment.\n\n② The fibonacci function is defined and exported.\n\
    \n③ $index is our number counter.\n\n④ $ptr is our current position in the Memory\
    \ instance.\n\n⑤ The i32.store function writes a value to the specified location\
    \ in the buffer.\n\n⑥ The $index variable is advanced to 2 and the $ptr is set\
    \ to 8."

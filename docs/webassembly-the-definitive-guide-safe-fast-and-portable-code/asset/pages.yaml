- pgno: 151
  md: 'Tables are another feature of WebAssembly that allow it to be a modern software
    system with functional dependencies that will be satisfied by additional modules.
    They provide the equivalent capability of a dynamic shared library compared to
    a statically-linked library. The idea is that not every module needs to provide
    everything it requires to do its work. That would be horribly inefficient. Instead,
    it is written against the promise of some other module satisfying the need at
    run time. That is called dynamic linking in the C and C++ world. Obviously, my
    dinner table metaphor is simply a play on the world table, but just like there
    needs to be some coordination around sharing ideas over a meal, we need this for
    sharing behavior between libraries. Let’s explore that idea more closely and then
    see how WebAssembly supports it.


    # Static vs Dynamic Linking


    Anyone who follows me on Twitter knows what an amazing cook my wife is. She comes
    from a great family of cooks and has had the opportunity to learn from a large
    number of generous mentors. People often see posts I make of the culinary art
    she produces and ask me for the recipe. This is not usually as easy as just sending
    a link as she often combines ideas from multiple sources and then puts her own
    spin on things.


    In our house, she could rely on the cookbook library she has amassed. She could
    say, “Make this sauce from that book. Prepare the beef with the technique described
    in that other book. After it reaches the doneness you want, add these additional
    ingredients that I thought would make it better.”


    Within our house, she can make reference to steps and ingredient lists from known
    sources and amend the process with her additional steps. But, when she wants to
    give the recipe to someone else, she cannot rely on their having these books.
    In that case, she would have to copy the recipes from her sources into a new recipe
    document that was self-contained. At this point, all the steps and ingredients
    would be defined in one place and the recipe could be sent to someone else.'

    \n# Example 14-1. Basic TypeScript example.\n\n```\n// src/greeter.ts\nfunction\
    \ greeter(person: string) {\n    return \"Hello, \" + person;\n}\nlet user = \"\
    Mannequin Skywalker\";\ndocument.body.textContent = greeter(user);\n```\n\nBrowsers\

- pgno: 255
  md: 'What about a language that supports tuples such as Python or Rust? This allows
    a developer to easily package several values into a single structure to return
    from a function, but a client from another language may want to unbox or destructure
    them into a different representation to be more idiomatic for that language.


    Even something as simple as swapping a pair of values or sorting an array becomes
    problematic. It would have to be done in place in the linear memory block. Several
    arithmetic functions also can return multiple values if you consider modular operations,
    carry bits, and the like.


    Beyond function return values, another limitation in the MVP was that instruction
    sequences such as conditional blocks and loops are unable to consume values or
    return more than one result. It could equally be interesting to swap values, conduct
    arithmetic with overflow, or have a multi-value tuple response there too.


    If you recall from Chapter 2, the result of a WebAssembly function is found at
    the top of the stack. There is no real reason the top several elements of the
    stack could not be interpreted as multiple return values. So, both as an improvement
    to the platform and to facilitate other extensions, the Multi-value return type
    exension³ was an important next step. At this point it has been merged into the
    main specification and is implemented in many WebAssembly environments.


    The proposal introduces new instructions such as the aforementioned arithmetic
    functions. This includes i32.divmod that accepts a numerator and divisor and returns
    the quotient and the remainder. It also allows multiple values to remain on the
    stack and not have to be copied into the linear memory instance. This is both
    faster and more memory-efficient.


    Because Wasmtime supports the Multi-Value proposal already, we can easily demonstrate
    how useful it is. In Example 12-5 you see a Wat file that provides the structure
    we will use. The first line imports a function that takes two parameters and returns
    two parameters from the Rust environment. As you can see, it is no big deal to
    extend the result syntactically to support more than one value. Implementing it
    is obviously'
  merge: -1
  img_proc: true

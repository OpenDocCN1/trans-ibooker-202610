    one is i32.sub. It represents the arithmetic subtraction of one i32 value from
    another. As it needs two values to make sense, it will consult the top two values
    on the stack by popping them off resulting in an empty stack looking again like
    Figure 2-1. It then subtracts the second parameter from the first and pushes the
    result back to the top of the stack. The result is seen in Figure 2-4.



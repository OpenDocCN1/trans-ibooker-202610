  md: '![](img/16b7990eb0dbf589db177bdbd2f4a189_77_0.png)


    Figure 4-2. Showing the details of our Memory.


    The onClick() function calls a method on the Memory instance to grow the allocated
    size by one page of memory. This causes the original ArrayBuffer to become detached
    from the instance and the existing data is copied over. If we are successful,
    we reinvoke the showDetails() function and extract the new ArrayBuffer. If the
    button is pressed once, you should see that the instance now represents two pages
    of memory representing 128KB of memory. The data at the beginning should not have
    changed.


    If you press the button too many times, the number of allocated pages will exceed
    the maximum specified amount of ten pages. At this point, it is no longer possible
    to expand the memory and a RangeError will be thrown. Our example will pop up
    an alert window when this happens.


    # Using the WebAssembly Memory API


    The grow() method we used in the previous example is part of the WebAssembly JavaScript
    API that the MVP expects all host environments to provide. We can expand our use
    of this API and go the other direction. We can create a Memory instance in JavaScript
    and then make it available to a module. Keep in mind the current limit of one
    instance per module.'

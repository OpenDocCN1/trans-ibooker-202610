    # Designing Code For In and Out of the Browser


    The final section I want to cover is another WebAssembly use case that I think
    is going to be increasingly popular. We have looked at using languages other than
    JavaScript to target the browser. We have also discussed the scenario of reusing
    existing code in a browser-based runtime. But what about code that is designed
    to run both inside and outside of the browser as a matter of course? I think once
    more people are comfortable with what WebAssembly provides this is going to be

- pgno: 307
  md: 'First of all, AssemblyScript does not run as JavaScript, it runs as WebAssembly.
    The compiler generates WebAssembly modules which should effectively work like
    other modules we have seen. There are some cool features that you will see below,
    however, for allocating memory in your module’s `Memory` instances, passing strings
    back and forth between JavaScript host environments and Wasm modules, and more.


    Unfortunately, where I did attempt to teach you some C in the C-based chapters
    and Rust in the Rust-based chapters, I do not really have the space to teach you
    much TypeScript and then tell you how AssemblyScript is different. So, I will
    assume that you know TypeScript⁴ and will tell you briefly how AssemblyScript
    differs before showing some basic examples.


    First, while TypeScript does enforce types, it has `any` and `undefined` for better
    compatibility with untyped JavaScript. AssemblyScript does not support either
    of these types. Another difference is the lack of union types, one of my favorite
    features of TypeScript.


    Because AssemblyScript is compiled into Wasm, it has no ability to do anything
    with network connections, file system access, DOM manipulation just like any other
    module. Those have to be provided through import objects or through WASI as you
    will see momentarily.


    AssemblyScript lives very close to the WebAssembly instruction set we have seen
    throughout the book. The numeric types are basically what you would imagine them
    to be including `i32`, `i64`, `f32`, `f64` and, `usize` which is used for indexing
    memory. As the MVP version of WebAssembly supports 32-bit addressing, that currently
    corresponds with the `i32` type.


    In addition, there is currently no support for implementing interfaces, closures,
    exceptions or access modifiers for classes (`public`, `private`, or `protected`).
    The good news is that most of these limitations will be overcome eventually. Some
    of them can be addressed directly by future versions of the AssemblyScript compiler
    while others will rely on the WebAssembly platform to evolve.'

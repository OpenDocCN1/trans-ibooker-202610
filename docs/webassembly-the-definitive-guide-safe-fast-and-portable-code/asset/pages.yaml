- pgno: 359
  md: '2.2GHz. One second of CPU use is configured to cost 10 million gas. These numbers
    are not going to be fixed in time and will be periodically adjusted based upon
    observation and the evolution of hardware systems.


    The cost of an instruction is equivalent to a cycle count * the gas per cycle
    equivalence for the instruction type. For example, the get_local instruction costs
    3 cycles and is expected to cost 0.0135 Gas. Loading things into and out of memory
    will have similar costs. Accessing constant values (e.g. i32.const) does not require
    any transfer of data, calculation or storage so it is essentially a 0 gas operation.


    As there is so much compiled EVM1 bytecode in existence, there are also plans
    to have a Transcompiler to convert EVM1 bytecode into ewasm bytecode for backward
    compatibility. There are some differences including that EVM1 uses 256-bit integers
    by default and ewasm will use 64-bit integers, but there will be compensating
    actions to make it all work and price the work accordingly in the new environment.


    Finally, there will also be predefined contracts for functionality that will be
    needed as part of the behavior of the Ethereum environment to function properly.
    This includes a sentinel contract for validation and metering injection, the transcompilation
    of EVM1 to ewasm, various hashing algorithms (e.g. SHA2-256, RIPEMD160, KECCAK256),
    and more.


    This remains an adventurous work in progress, but the design motivation makes
    sense and the selection criteria aligns with many of the reasons we have highlighted
    for being excited about WebAssembly in general. Decentralized systems have a lot
    of innate complexity in them. Whatever they can do to standardize, secure, optimize,
    and expand the range of contract language options available to cryptocurrency
    smart contract developers is likely to strengthen the Ethereum platform overall.


    # Polkadot


    While Bitcoin is the overall market leader in the cryptocurrency space, Ethereum
    has emerged as a close second. With its support for multiple'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'languages and arbitrary contracts in a widening collection of languages, if
    you needed to target a specific, non-Bitcoin platform, Ethereum would be a defensible
    choice even with some of the growing pains it has experienced over the years.
    But what if you did not want to tie yourself to a single platform such as Ethereum?
    This is where Polkadot comes in. It is a new blockchain project designed from
    the ground up with blockchain interoperability in mind.


    Polkadot¹⁰ was founded by Dr. Gavin Wood, author of the Ethereum Yellow Paper¹¹,
    with an eye toward upgradeable, extensible, and interoperable blockchain capabilities.
    It is one of the cornerstones of the Web3 Foundation¹².


    One of the projects funded by the Web3 Foundation was to bring an ewasm virtual
    machine into the Polkadot ecosystem. The contract was awarded to Second State,
    makers of the WasmEdge platform we introduced in the previous chapter. The project
    is called Substrate and its webpage is here: https://substrate.dev. You can find
    the project on GitHub: https://github.com/second-state/substrate-ewasm. With support
    for the ewasm contract interface and execution environment, this opens the door
    for Ethereum contracts to be transparently deployed to Polkadot-based blockchains.
    Not only does this avoid lock-in, it also increases the transfer of ideas, contracts,
    and capabilities into an ever richer collection of blockchain-based stakeholders.
    Other projects based upon the SecondState ewasm engine include Oasis Ethereum¹³
    and Parastate¹⁴.


    These are simply a couple of examples of the intersection of WebAssembly and blockchain-flavored
    decentralization. I anticipate there will be many, many more, but for now I want
    to wrap up the chapter with a quick introduction of another one of my favorite
    decentralization projects that is also a star of the Web3 world. It too will benefit
    from WebAssembly.


    # Interplanetary File System (IPFS)


    I have to admit, I fell in love with this project initially just for its name.
    Granted, I have come to respect it and honestly be in awe at what the'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'community is able to produce since then, but the name still rules. The thing
    is, it is not just a clever name. It is simultaneously a historical reference¹⁵
    and an aspirational nod to a future that is closer than most of us are anticipating.
    Humans will soon be going back to the moon and making early forays to Mars. The
    network latencies involved with communicating with bases on these planets are
    going to be problematic. One aspect of the design criteria for IPFS is to help
    solve some of these issues. I will not bother explaining how they plan to do this,
    but perhaps that will pique your curiosity to investigate. The project produces
    an overwhelming amount of code, documentation, videos, and tutorials, but their
    main website is a good starting point: https://ipfs.io.


    One of the coolest aspects of IPFS is that they are designing their layers around
    the idea of reuse across projects. You do not have to buy into their entire stack,
    elegant as it is. Instead, you can pick and choose the pieces that your project
    might benefit from and go from there. Examples of useful (and reuseful) projects
    from this community includes Multiformats¹⁶, libp2p¹⁷, and IPLD¹⁸.


    While there are many ways WebAssembly is showing up in this community, I want
    to highlight a very simple one. I am not going to describe how IPFS works in detail,
    but there are some core ideas. The whole thing is based upon Merkle-DAGs¹⁹. A
    Directed Acyclic Graph (DAG) is a graph structure that has identifiers based upon
    hashes of the node’s contents. Merkle DAGs are similar to Merkle Trees²⁰ which
    are useful for detecting changes of content-based addressable blocks.


    The net effect of these decisions is that files can be broken down into dependencies
    between blocks that are identified by content identifiers (CIDs) driven by the
    actual content of the blocks. As files change, the only portions that need to
    be updated are the effected blocks. Doing so does not invalidate the existing
    immutable Merkle DAGS, so multiple versions of files can co-exist simultaneously.


    If you do not have a background in these kinds of decentralized systems, there
    are a lot of behind-the-scenes details that we do not need to focus on'
  merge: -1
  img_proc: true
- pgno: 362
  md: "to make my larger point. To hide those details, I am going to use the Go-based\
    \ command line tools from the IPFS project. You can find how to install these\
    \ in Appendix A if you are interested in trying them. There are libraries in many\
    \ other languages. Many of these do not require you to install and run things\
    \ locally if you do not want to. As you will see below there are HTTP gateways\
    \ for bridging the Web as you know it and the IPFS network.\n\nIn order to use\
    \ the tools, you need to generate an identity. This does not involve your name\
    \ or anything, it is just an RSA keypair that can be used to digitally sign documents\
    \ and communicate with the large network. Creating a node identity is easy.\n\n\
    ```\nbrian@tweezer ~> ipfs init\ninitializing IPFS node at /Users/brian/.ipfs\n\
    generating 2048-bit RSA keypair...done\npeer identity: QmZoRwJ7YYayf5eNWDweN5GCGJjuRnKGJA3susZqjV8Jcb\n\
    to get started, enter:\n    ipfs cat\n/ipfs/QmS4ustL54uo8FzR9455qaxZwuMiUhyvMcX9Ba8nUH4uVv/readme\n\
    ```\n\nThe very long content identifier (CID) that starts with QmZoRwJ refers\
    \ to the node I created. There are no services running yet, we simply have tools\
    \ that allows us to communicate with the IPFS network. That includes the ability\
    \ to request files. Files have similar CIDs to the node, as do blocks. If you\
    \ dig into the IPLD model mentioned above, you will see that it is just a big\
    \ interlinked collection of named, immutable nodes. The comment at the end of\
    \ what was produced above indicates that we can find out more by issuing that\
    \ command. As you will see soon, you do not need to have these tools involved,\
    \ but at this point something needs to know how to communicate with the network.\
    \ The ipfs command line tool takes multiple arguments. One of them makes it act\
    \ like the Unix cat command to show the contents of a file. In this case, it is\
    \ a file called readme referenced as a subelement of the directory it lives in.\
    \ This convenience is a bit like a fragment identifier on a Web URL to avoid multiple\
    \ round trips. We can ask for it in one go. The results should look something\
    \ like what you see in Figure 16-1."

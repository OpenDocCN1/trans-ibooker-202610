    # Porting Third Party Code


    We are now going to dive into bringing some existing code into the browser. This
    code was never intended to run on the web and does things you would normally not
    expect to work in a browser such as writing to the file system. Do not fret, we
    are not going to break the browser security model, but you will see how this C++
    code can run basically unmodified.


    Emscripten has a tremendous number of options for porting third party code to
    WebAssembly. There are effectively drop-in replacements for cc, make, and configure
    which often makes the porting process trivial. In reality, you will likely have
    to work your way through the issues you encounter, but you are probably going
    to be surprised how easy the process is. The project’s website³ has great documentation
    to assist you with it. My favorite introduction to the topic, however, has been
    Robert Aboukhalil’s fantastic Level Up With WebAssembly⁴ material. He walks you
    through the process of porting several different open source projects to WebAssembly
    to run'

- pgno: 368
  md: '![](img/16b7990eb0dbf589db177bdbd2f4a189_368_0.png)


    Figure 16-2. Requesting files from IPFS via HTTP Gateways


    The local HTTP gateway is only one. There is also one run by the IPFS project
    at https://ipfs.io/ipfs/<CID> and one run by CloudFlare at https://cloudflare-ipfs.com/ipfs/<CID>.
    Just replace the CID with the cat image node name and the file name and you should
    see it there too.


    What I just showed you is way cooler than you may realize as both of those are
    TLS-terminated endpoints. This means you can request files out of IPFS without
    anyone knowing what you are asking for by sniffing packets. IPFS is quite successful
    at routing around censorship. Any attempt to squash one gateway is likely to initiate
    several more.


    Another service the daemon starts is a web application for browsing the node’s
    details and interacting with the platform more naturally. It is listed as the
    WebUI in the daemon output above and it is located at http://127.0.0.1:5001/webui.
    As bound, only users on the same machine can'
  merge: -1
  img_proc: true
- pgno: 369

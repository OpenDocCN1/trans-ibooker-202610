    \ The compiler will transpile it³ into regular JavaScript.\n\n```\nbrian@tweezer\
    \ ~/s/t/hello-ts> tsc src/greeter.ts\nbrian@tweezer ~/s/t/hello-ts> ls -alF src\n\
    total 32\ndrwxr-xr-x  6 brian  staff  192 Jan 14 17:17 ./\ndrwxr-xr-x  8 brian\
    \  staff  256 Jan 14 16:55 ../\n-rw-r--r--  1 brian  staff  125 Jan 14 17:19 greeter.js\n\
    -rw-r--r--  1 brian  staff  135 Jan 14 17:19 greeter.ts\n```\n\nYou will have\
    \ to look a little closely at the generated JavaScript to tell the difference.\
    \ In Example 14-2 you can see that all that has really happened is that the type\
    \ has been removed.\n\n# Example 14-2. JavaScript generated from TypeScript\n\n\
    ```\n// src/greeter.js\nfunction greeter(person) {\n    return \"Hello, \" + person;\n\
    }\nvar user = \"Mannequin Skywalker\";\ndocument.body.textContent = greeter(user);\n\
    ```\n\nSo, what is the big deal? Why do we put the type there just to take it\
    \ away? The benefit of adding the types is that the compiler can catch errors.\
    \ By ensuring your code is not used wrongly (to the best of its ability), the\
    \ overall correctness and quality of the software should improve. We see such\
    \ an error in Example 14-3 which would not be detected until runtime in JavaScript.\n\
    \n# Example 14-3. A type error in TypeScript"

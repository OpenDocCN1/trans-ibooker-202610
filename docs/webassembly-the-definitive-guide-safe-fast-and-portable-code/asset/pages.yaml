    gotten with his egui library⁷. He describes the project as “an easy-to-use immediate
    mode GUI in pure Rust”⁸ Basically, it a sophisticated user interface library that
    works both inside the browser and out.


    We have mentioned several times in this chapter that Rust benefits from its LLVM
    heritage by allowing us to emit various backend targets. This is also what Emil
    is taking advantage of to make this work. But he has done so elegantly and I think
    there is a lot that can be learned from where he has gone. The full details of
    how he makes it work are outside the scope of this chapter, but I want to draw
    attention to the project in case you are interested in doing something similar.


    First, let’s see his app in action as a native application. If you are on Linux,
    you have to install a few more packages listed on the GitHub site, but after that,

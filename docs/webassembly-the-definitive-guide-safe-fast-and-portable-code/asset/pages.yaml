    In Figure 4-4 we see the successful results of reading the bytes out of the buffer
    and rendering them as UTF-8 strings.


    ![](img/16b7990eb0dbf589db177bdbd2f4a189_86_0.png)


    Figure 4-4. Reading strings from the Memory instance.


    As cool as these results are, how did we know how many bytes to wrap and in which
    location to look for the strings? A little detective work can help. A capital
    letter “I” is represented as 49 in hexadecimal. The output from wasm-objdump above
    gives us the offset in the Data segment for each byte. We see the value 49 for
    the first time on the row that begins with 0000020:. The 49 represents the seventh
    byte over so the second sentence begins as position 27 which is 2 * 16 + 7 in
    decimal, so, 39. The Japanese string represents the bytes between 0 and 39. The
    English string begins at position 39.


    But, wait a minute! It turns out we miscounted on the English sentence and we

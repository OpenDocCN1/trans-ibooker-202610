    As indicated above, the PNaCl modules were more portable. The LLVM infrastructure
    could generate either the NaCl native code or the portable Bitcode without modifying
    the original source. This was a nice outcome, but there is a difference between
    code portability and application portability. Applications require the APIs that
    they rely upon to be available in order to work. Google provided an application
    binary interface (ABI) called the Pepper APIs³¹ for low-level services such as
    3D graphics libraries, audio playback, file access (emulated over IndexedDB or
    LocalStorage) and more. While PNaCl modules could run in Chrome on different platforms
    because of LLVM, they could only run in browsers that provided suitable implementations
    of the Pepper APIs. While Mozilla had originally expressed interest in doing so,
    they eventually decided they wanted to try a different approach that came be known
    as asm.js. NaCl deserves a tremendous amount of credit for moving the industry
    in this direction, but it was ultimately too fiddly and too Chrome-specific to
    carry the open web forward. Mozilla’s attempt was more successful on that front
    even if it did not provide the same level of performance that the native client
    approach did.



- pgno: 23
  md: 'The uses cases were mainly to support browser-based delivery of computationally-intensive
    software such as:


    +   - games

    +   - audio and video editing systems

    +   - scientific computing and CAD systems

    +   - simulations


    The initial focus was on C and C++ as source languages, but because it was based
    upon the LLVM28 compiler toolchain, it would be possible to support additional
    languages that could generate the LLVM Intermediate Representation (IR)29. This
    will be a recurring theme in our transition to WebAssembly as you will see.


    There were two forms of distributable code here. The first was the eponymous NaCl
    which resulted in “nexe” modules that would target a specific hardware architecture
    (e.g. ARM or x86-64) and could only be distributed through the Google Play store.
    The other was a portable form called PNaCl30 that would be expressed in LLVM’s
    Bitcode format making it target independent. These were called “pexe” modules
    and would need to be transformed into a native architecture in the client’s host
    environment.


    The technology was successful in the sense that the performance demonstrated in
    browser was only minimally off of native execution speeds. By using software fault
    isolation (SFI) techniques, they created the ability to download high performance,
    secure code from the web and run it in browsers. Several popular games such as
    Quake and Doom were compiled to this format to show what was ultimately possible.
    The problem was that the NaCl binaries would need to be generated and maintained
    for each target platform and would only run in Chrome. They also ran in an out-of-process
    space so they could not directly interact with other Web APIs or JavaScript code.


    While running in limited privilege sandboxes was achievable, it did require static
    validation of the binary files to ensure that they did not attempt to'

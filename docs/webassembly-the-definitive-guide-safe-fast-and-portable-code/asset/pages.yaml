- pgno: 244
  md: '![](img/16b7990eb0dbf589db177bdbd2f4a189_244_0.png)


    Figure 11-2. The WASI layered vision


    At the top of the software layering, we have our applications. This is obviously
    the majority of what we write including standalone executables, Web applications,
    frameworks, libraries, microservices, serverless functions and more. This is going
    to represent the lion’s share of the business value we create. When we make poor
    technology choices, that business value gets locked up into silos and become legacy
    systems sooner than they need to. It is hard to extract functionality so our only
    real choice often is to reimplement which is generally the opposite of adding
    business value. Even if we make good technology choices, however, our industry
    does not sit idle and reuse has a generally finite scope.


    In this vision, however, we can imagine the emergence of a generalized framework
    for expressing expectations about the environments our software runs in. We have
    started to see how we get language independence from WebAssembly by writing to
    an intermediate, portable representation. That leaves us with often unmet expectations
    in the environments we hope to expand to fill. Now we are starting to see how
    the host environments can be modular, virtualizable, swappable and more to provide
    functionality that'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'meets our interface expectations. Code running in a browser but expecting filesystem
    access can be given an abstraction that meets the needs but uses local storage
    or something else. You can even imagine a scenario where the “filesystem” abstraction
    is a userland filesystem such as Fuse¹⁴ backed by a cloud storage provider transparently.


    The point is that our code does not have to be rewritten necessarily to float
    between these environments whether they are fully-privileged native applications,
    virtualized, hosted, in-browser or embedded. Leveraging modular compiler architectures
    such as LLVM gives us the ability to add a backend that will express our expectations
    in a flexible manner. We can implement code sharing and dynamic linking strategies
    as makes sense.


    The flip side is that we have a snowballing security hellscape unfolding around
    us with malicious software, phishing attacks and ransomware. If we have the ability
    to run code from anywhere in any language in sandboxed environments, this could
    go a long way to strengthening our default security postures.


    The vision of a safe, portable and fast computational ecosystem is so powerful
    that the Bytecode Alliance was formed to carry it forward. The early members include
    Mozilla, Intel, Microsoft, Fastly and more. They are striking a balance between
    safe, protected environments and performance. Rather than big, heavyweight communication
    processes between isolated modules, they are creating a “nanoprocess” mechanism
    that is bringing the many varied requirements into being. They are imagining a
    brighter future for our industry that is able to develop high-performance, secure
    code meeting the needs of modern systems and to capture business value for longer
    than we currently can. That is an idea we can all get behind.'

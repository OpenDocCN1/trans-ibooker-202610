  md: "```\nfetchAndInstantiate('mem.wasm').then(function(instance) {\n  var mem =\
    \ instance.exports.memory;\n  var u8Arr = new Uint8Array(mem.buffer);\n\n  let\
    \ location = instance.exports.whereToStore();\n  u8Arr[location] = 123;\n\n  let\
    \ value = instance.exports.readFromLocation(location);\n  console.log(\"Round-tripped\
    \ value: \" + value);\n});\n</script>\n</body>\n</html>\n```\n\nWe do wrap the\
    \ Memory instance’s buffer with a typed array. We invoke the whereToStore() function\
    \ and then write into our Uint8Array at that location. Next we pass that location\
    \ into the readFromLocation() function exported from our module which loads the\
    \ value stored at the default location. Happily, when printed to the console,\
    \ the value is what we expect, \"123\".\n\n# Garbage Collection and the AssemblyScript\
    \ Runtime\n\nOne of the big holes in the WebAssembly MVP platform is a garbage\
    \ collection capability. Langauges like C/C++ and Rust do not need it, but other\
    \ higher languages will. There is a proposal working its way through the standards\
    \ process⁶, but until it is available through the platform, various projects are\
    \ creating shims and add-on support.\n\nIf you are unfamiliar with the concept\
    \ of Garbage Collection, it is the automated cleanup of allocated resources when\
    \ they are no longer necessary. C and C++ require you to call malloc() and free()\
    \ (or new() and delete()) so there is nothing really automated about the process.\
    \ Rust has strict memory ownership guidelines as you saw in Chapter 10 so that\
    \ it knows when values go out of scope lexically and can then clean things up.\
    \ These two approaches represent tradeoffs of low-overhead but dangerous if you\
    \ mess it up or heavy-handed but safe. Python"

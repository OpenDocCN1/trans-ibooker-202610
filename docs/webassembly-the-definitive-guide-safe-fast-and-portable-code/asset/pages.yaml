  md: "Tilman Roeder⁹ has created an in-memory SQLite WebAssembly module and wrapped\
    \ it for use in JavaScript and TypeScript¹⁰. The details for how it works will\
    \ have to wait, but using it is quite straightforward as you see in Example 8-9.\n\
    \n# Example 8-9. Using a WebAssembly SQLite wrapper in a Deno HTTP Server\n\n\
    ```\nimport { DB } from \"https://deno.land/x/sqlite/mod.ts\";\nimport { serve\
    \ } from \"https://deno.land/std@0.93.0/http/server.ts\";\n\n// Create the Database.\
    \ This requires write access!\n\nconst db = new DB(\"pl.db\");\ndb.query(\n  \"\
    CREATE TABLE IF NOT EXISTS languages (id INTEGER PRIMARY KEY AUTOINCREMENT, name\
    \ TEXT)\",\n);\n\nconst names = [\"C\", \"C++\", \"Rust\", \"TypeScript\"]\n\n\
    // Populate the database\n\nfor (const name of names) {\n  db.query(\"INSERT INTO\
    \ languages (name) VALUES (?)\", [name]);\n}\n\n// Close out the connection\n\n\
    db.close();\n\nconst server = serve({ hostname: \"0.0.0.0\", port: 9000 });\n\
    console.log(`HTTP webserver running. Access it at: http://localhost:9000/`);\n\
    \nfor await (const request of server) {\n  // Re-open the Database\n\n  const\
    \ db = new DB(\"pl.db\");\n  let bodyContent = \"Programming Languages that work\
    \ with WebAssembly:\\n\\n\";\n\n  for(const [name] of db.query(\"SELECT name FROM\
    \ languages\")) {\n    bodyContent += name + \"\\n\";\n  }\n}\n```"

    \ is done before compiling the module. One of the first post-MVP capabilities\
    \ added was the ability to support compilation while the bytes were still being\
    \ pulled across the network. The module format structure lends itself to this\
    \ optimization so it is a shame not to use it.\n\nWhile there is no Right Way\
    \ for how to instantiate your modules (e.g. you may wish to instantiate multiple\
    \ instances of modules in some scenarios), the majority of the time, the code\
    \ in Example 3-8 is a slightly more efficient way to do so.\n\n# Example 3-8.\
    \ The recommended way to instantiate modules most of the time\n\n```\n(async ()\
    \ => {\n  const fetchPromise = fetch(url);\n  const { instance } = await\nWebAssembly.instantiateStreaming(fetchPromise);\n\
    \  // Use the module\n  const result = instance.exports.method(param1, param2);\n\
    \  console.log(result);\n})();\n```\n\nNotice above that we are not creating the\
    \ ArrayBuffer, we are passing the Promise from the fetch() method into the instantiateStreaming()\
    \ method on the WebAssembly object. This allows the baseline compiler to start\
    \ to compile functions as they are appearing across the network. In most cases,\
    \ the code compilation will happen faster than the network transfer so that by\
    \ the time you finish downloading the code, it should be validated and ready to\
    \ use. When JavaScript finishes downloading, that is usually when the validation\
    \ process begins, so we see an improvement in startup time.\n\nThere is not a\
    \ formalized method for caching WebAssembly modules yet, but this too will become\
    \ an unobtrusive way of improving startup time. Cache controls and other Web artifact-handling\
    \ will avoid the need to"

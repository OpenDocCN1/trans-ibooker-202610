  \ address how to overcome these issues later, but this is among the reasons why\
  \ we are not doing a\n\n\n\n典型的“Hello, World！”应用程序。这里没有字符串！在我们引入更多概念之前，处理数字要容易得多。因此，秉承这种编程风格，我们向你展示足够的内容以使其运行，而不会让你感到不知所措。\n\
  \n这个内部函数的目的是根据出生年份和当前年份计算某人的年龄。此时，你可能不会感到惊讶地听到 WebAssembly 没有日期的概念，也没有默认请求当前时间的能力。我预计你会想知道\
  \ WebAssembly 究竟能做什么！好消息是，它可以做数学运算。如果你提供当前年份和某人的出生年份，它绝对可以从一个中减去另一个并产生结果。请不要觉得失望，我们只是将事物隔离以明确清楚地说明系统的哪一部分提供了什么。\n\
  \n如你所知，栈是软件世界中一种方便且广泛使用的数据结构。它通常被描述为像自助餐厅里的托盘堆。工作人员会将干净的托盘放在其他托盘的顶部。顾客会从顶部取一个。\n\
  \n考虑图 2-1 所示的空栈。我们说将某物推到栈顶并从栈顶弹出。我们只 ever 操作这个位置，因此如果需要遍历列表，这不是合适的数据结构。与此同时，我们感兴趣的东西只有一个位置可供查找，因此我们无需指定位置、索引或键。它是一种快速高效的结构来操作。\n\
  \n![](img/16b7990eb0dbf589db177bdbd2f4a189_37_0.png)\n\n回顾我们在示例 2-2 中函数的指令列表。第一个是\
  \ get_local。WebAssembly 主机环境将检索名为 $year_now 的参数的值，然后将其推到栈上。假设当前年份是 2021，结果如图 2-2\
  \ 所示。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_38_0.png)\n\n图 2-2. 包含一个值的栈\n\n\
  此时，WebAssembly 主机环境将进入第二个指令。它也是一个 get_local 指令，将检索名为 $year_born 的参数的值并将其推到栈上。栈上现在有两个值，但栈顶指向最新推入的值。假设调用该函数的人出生于\
  \ 2000 年，栈将如下图 2-3 所示。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_38_1.png)\n\n\
  图 2-3. 包含两个值的栈\n\n执行环境将继续，因为还有另一个指令。这个是 i32.sub。它表示一个 i32 值减去另一个 i32 值的算术减法。由于它需要两个值才有意义，它将通过弹出它们来查阅栈顶的两个值，从而导致栈再次变空，如图\
  \ 2-1 所示。然后它用第一个参数减去第二个参数，并将结果推回栈顶。结果如图 2-4 所示。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_38_2.png)\n\
  \n图 2-4. 减法结果被推回栈\n\n此时，没有更多指令可执行，我们在栈顶只剩下单个值。在示例 2-2 中，我们看到我们的函数定义了一个 i32 返回值。栈顶上的任何内容都将被作为调用该函数的结果返回。\n\
  \n这看起来像是加两个数字的很多工作，但请考虑我们已以平台中立的方式表达了数学事件序列。当代码最终在运行时主机中转换为原生指令时，值将被加载到 CPU 寄存器中，并且指令将使用\
  \ CPU 指令集的机制将它们加在一起。我们不必担心目标平台的细节或怪癖，但在需要时，转换过程将快速且易于进行。然而，在那之前，我们需要将文本格式转换为其二进制表示。\n\
  \n## 将 Wat 转换为 Wasm\n\n任何编程超过短暂时间的人都会注意到我们的实现中存在各种潜在问题。我们没有处理有人颠倒参数导致函数返回负数的情况。出于保持示例简单的目的，我们只是忽略了这些现实。虽然这不是一个超级令人兴奋的函数，但我们已经研究了通过\
  \ WebAssembly 原生文本格式表达一些基本行为的机制。下一步是将其转换为其二进制可执行形式。你有几个选择来做到这一点，但我们将重点介绍两种方法。\n\n\
  第一种方法不需要你安装任何东西。事实上，你可以继续调用你的函数来看看它是否有效！如果访问 https://webassembly.github.io/wabt/demo/wat2wasm/index.html\
  \ 你会看到一个多面板站点。左上角代表一个 .wat 文件。右上角代表编译后的 .wat 文件的带注释的十六进制转储。左下角代表用于调用行为的 JavaScript\
  \ 代码，我们稍后会更全面地介绍其 API。右下角代表执行代码的输出。\n\n将示例 2-2 中的代码复制并粘贴到标记为 WAT 的左上面板中。这将导致文本格式转换为二进制格式。假设你没有拼写错误，你还可以通过按下同一面板上的下载按钮来下载二进制格式。暂时不用担心那样做。\n\
  \n现在，将示例 2-3 中的代码复制到左下面板。这将调用大多数现代浏览器（和 Node.js）中可用的 WebAssembly JavaScript API。我们稍后会更详细地讨论它，但现在我们正在检索二进制模块的字节（此处通过\

  \ badass DJ。去看看吧。\n- 6 该提案需要先完成第 12 章中指出的其他几个提案，但你可以在这里阅读更多相关内容：https://github.com/WebAssembly/gc/blob/master/proposals/gc/Overview.md。\n\

  \nTIP\n此元素表示提示或建议。\n\nNOTE\n此元素表示一般说明。\n\nWARNING\n此元素表示警告或注意。\n\n## 使用代码示例\n\n\
  补充材料（代码示例、练习等）可在 https://github.com/bsletten/wasm_tdg 下载。\n\n如果您对代码示例有技术问题或使用问题，请发送电子邮件至\
  \ bookquestions@oreilly.com。\n\n本书旨在帮助您完成工作。一般来说，如果本书提供了示例代码，您可以在程序和文档中使用它。 除非您复制代码的很大一部分，否则您无需联系我们征求许可。例如，使用本书中几个代码片段编写程序不需要许可。出售或分发\

  std::sys_common::backtrace::__rust_begin_short_backtrace::h3c3458f2edddefd1\n```\n\
  \n\nf2edddefd1 (hello-fs.wasm[12]:0x73d)\n    at std::rt::lang_start::{{closure}}::h4a57af2dc5415a53\n\
  (hello-fs.wasm[20]:0xe02)\n    at std::rt::lang_start_internal::hb132ad43e5d53599\n\
  (hello-fs.wasm[164]:0x8139)\n    at __original_main (hello-fs.wasm[18]:0xdc9)\n\
  \    at _start (hello-fs.wasm[10]:0x44d)\n    at _start.command_export (hello-fs.wasm[310]:0x11bff)\n\
  ↳> 4: unreachable\n\n而解决方案是相同的。\n\n```\nbrian@tweezer ~/g/w/s/c/hello-fs> wasmer\
  \ --dir=. target/wasm32-wasi/release/hello-fs.wasm\nRead in from file: Hello, world!\n\
  ```\n\n向可执行实例添加命令行选项似乎并不是最稳健的安全机制，但这忽略了更大的重点。你当然可以使用 Wasmer 或 Wasmtime 来启动你的应用程序，但这并不是必需的。在下一章中，你将学习如何编写自己的\
  \ WASI 启用代码，在这种情况下，你可以使用任何你想要的机制来启用或禁用行为。\n\n有了这个，让我们重新梳理一下，对 WASI 做一个更宏观的审视，以结束本章。\n\
  \n### The Bigger Picture\n\nWebAssembly 的完整愿景比大多数人意识到的要宽泛得多。人们对 MVP 的能力有相当的认知，但对大多数人来说，这就是全部了。能够使用\
  \ JavaScript 以外的语言将代码部署到浏览器中听起来很酷，但在语言和 JavaScript 运行时引擎的进步面前，并不是严格的必需。\n\n在我看来，愿景中更重要的一部分是，我们将能够用我们想要的任何语言编写代码，并在我们想要的几乎任何环境中使用它。这使我们能够在新环境中利用现有软件，而无需重写它。这使我们能够选择适合问题的语言，而不需要新的运行时。如果一个组织在生产环境中部署了\
  \ Java 虚拟机（JVM），那么转向 Ruby on Rails 或基于 Python 的解决方案可能需要安装各自的环境¹³。\n\n这绝不是全有或全无的前景。有时我们出于性能原因希望原生运行代码，有时我们希望获得\
  \ Web 的零安装优势。有时我们希望在沙箱中运行，有时则不希望。考虑到将这一愿景变为现实所需的所有变量，从头设计几乎是不可能的。\n\n但本章中你希望已经开始看到的是，这一愿景之所以能够成为现实，是因为\
  \ WebAssembly 设计者做出了深思熟虑的选择。他们试图在避免过度或不足设计之间找到平衡。MVP 省略了并非每种语言都支持的语言特性，如线程、垃圾回收和异常。所有这些都有技术提案和工作示例，但前期做太多是不合适的。\n\
  \n显然，平台作为其现状存在局限性。提案的稳定流正在发布，以在合适的时候扩展平台的功能。WASI 已成为一个焦点，允许这些提案独立出现，并被 Wasmtime、Wasmer\
  \ 和 Wasm3 等平台逐步采用。坦白说，这使得追踪在哪里添加了什么变得非常混乱，但通过程序机制，他们也开始整理这个问题。\n\n为了实现大量期望的行为，WASI\
  \ 设计者意识到有必要标准化模块之间如何链接。我们需要一个解决方案，允许我们在不透露底层结构的情况下引用内存中不可伪造的句柄。我们还需要一种方法来引用字符串、列表和记录等类型。解锁这些额外行为需要依赖于提案的设计和实现。其中一些提案将在下一章中介绍，但\
  \ Wasmtime、Wasmer 和 wasm3 已经开始实施其中几个基本提案。\n\n这一过程将继续进行，并将设计新的 WASI 模块。虽然初始行为侧重于文件和控制台访问，但已经有针对一系列功能的提案，包括加密函数、加密货币合约、2D\
  \ 和 3D 绘图、网络和神经网络系统。不会只有一个 WASI 命名空间，而是会有价值的命名空间就有多少。并非每个应用程序都需要每个模块。并非每个环境都会提供这些模块的完整实现。它们可以是上下文受限的、虚拟化的或在具有相同依赖关系的多个模块之间共享的。为此，WASI\
  \ 可能永远不会“完成”。\n\n在图 11-2 中，你可以看到这一切意味着什么的基本轮廓，以及我们大约如何实现它。在第 12 章及后续章节中，我将详细阐述这些要点，但现在我认为这一愿景是一个合适的目标。\n\
  \n![](img/16b7990eb0dbf589db177bdbd2f4a189_244_0.png)\n\nFigure 11-2. The WASI layered\
  \ vision\n\n在软件分层的顶部，我们有我们的应用程序。这显然是我们编写的大部分内容，包括独立可执行文件、Web 应用程序、框架、库、微服务、无服务器函数等等。这将代表我们创造的大部分业务价值。当我们做出糟糕的技术选择时，这些业务价值会被锁定在孤岛中，并比需要更早地成为遗留系统。提取功能很困难，我们唯一的真实选择往往是重新实现，这通常与增加业务价值相反。即使我们做出良好的技术选择，我们的行业也不会停滞不前，而重用通常具有有限的范围。\n\
  \n然而，在这一愿景中，我们可以想象表达我们软件运行环境期望的通用框架的出现。我们已经开始看到通过编写到中间、可移植的表示形式来从 WebAssembly 获得语言独立性。这使我们在希望扩展到的环境中留下了经常未满足的期望。现在我们开始看到主机环境可以是模块化的、可虚拟化的、可互换的等等，以提供满足我们接口期望的功能。在浏览器中运行但期望文件系统访问的代码可以获得一个满足需求但使用本地存储或其他东西的抽象。你甚至可以想象一种场景，其中“文件系统”抽象是诸如\
  \ Fuse¹⁴ 之类的用户态文件系统，由云存储提供商透明支持。\n\n重点是我们的代码不必重写就可以在这些环境之间浮动，无论它们是完全特权的原生应用程序、虚拟化、托管、在浏览器中还是嵌入式。利用\
  \ LLVM 等模块化编译器架构，我们能够添加一个后端，以灵活的方式表达我们的期望。我们可以实现代码共享和动态链接策略，以适合的方式进行。\n\n另一方面，我们周围正在展开一场雪球般的安全地狱景观，有恶意软件、网络钓鱼攻击和勒索软件。如果我们能够在沙箱环境中从任何地方以任何语言运行代码，这将大大加强我们的默认安全态势。\n\
  \n一个安全、可移植和快速的计算生态系统的愿景如此强大，以至于 Bytecode Alliance 成立以将其推向前进。早期成员包括 Mozilla、Intel、Microsoft、Fastly\
  \ 等。他们在安全受保护的环境和性能之间取得平衡。不同于孤立模块之间的大型、重量级通信进程，他们正在创建一种“纳米进程”机制，将各种不同的需求带入现实。他们设想了我们行业更光明的未来，能够开发满足现代系统需求的高性能、安全代码，并比我们目前能够做到的更长时间地捕获业务价值。这是一个我们可以都支持的想法。\n\
  \n\n\n\n3 操作系统的应用程序二进制接口定义了程序如何链接和执行。更多信息：https://en.wikipedia.org/wiki/Application_binary_interface\n\
  \n4 Wasmtime 最初是 Mozilla 项目，但现在是 Bytecode Alliance 的一部分，我们很快会讨论它：https://wasmtime.dev\n\
  \n5 Wasmer 是公司名称，也是 WebAssembly 主机环境。\nhttps://wasmer.io\n\n6 来自 Bytecode Alliance\
  \ 的 WASI 教程：\nhttps://github.com/bytecodealliance/wasmtime/blob/main/docs/WASI-tutorial.md\n\

- "## 第 7 章. WebAssembly 表\n\n### 早期发布读者的注意事项\n\n使用 Early Release 电子书，你可以在这些技术正式发布之前很久就获得书籍的早期形式——作者在写作时的原始未编辑内容——从而利用这些技术。\n\
  \n这将是最终书籍的第 7 章。\n\n如果你对我们如何改进本书的内容和/或示例有任何评论，或者如果本章中缺少材料，请联系作者 wasmbook@bosatsu.net。\n\
  \n> 餐桌是教授和练习不仅是餐桌礼仪，也是交谈、体谅、宽容、家庭情感以及除小步舞以外的所有礼貌社会成就的中心。\n> \n> —Judith Martin\n\
  \n餐桌是分享思想和故事的绝佳隐喻。与独自进食相比，与他人一起加入总是更有趣。如果你召集来自各行各业的一群人，你可以激发关于近乎无限多个话题的光辉、充满活力的对话。没有人拥有所有的故事。一些参与者可能会分享同一故事的某些方面。其他人可能有自己的版本。然而，为了发挥作用，仍需要一定程度的礼仪、克制以及接受其他参与者所提供内容的意愿。行为不端、不停止说话或踩到他人台词的餐桌客人会让所有人感到糟糕。\n\
  \n\n\n\n\n表格是 WebAssembly 的另一个特性，它使 WebAssembly 成为具有功能依赖性的现代软件系统，而这些依赖性将由额外的模块来满足。它们提供了与静态链接库相比，动态共享库等效的能力。想法是并非每个模块都需要提供其执行工作所需的一切。那样会极其低效。相反，它是针对某些其他模块在运行时满足需求的承诺而编写的。在\
  \ C 和 C++ 世界中，这被称为动态链接。显然，我的晚餐桌隐喻只是对单词 table 的一种戏仿，但正如在餐桌上分享想法需要某种协调一样，我们也需要这种机制来在库之间共享行为。让我们更仔细地探索这个想法，然后看看\
  \ WebAssembly 如何支持它。\n\n### 静态链接与动态链接\n\n任何关注我 Twitter 的人都知道我妻子是一位多么出色的厨师。她来自一个优秀的厨师家庭，并有机会向大量慷慨的导师学习。人们经常看到我发布的她制作的烹饪艺术作品，并向我索要食谱。这通常不像只是发送一个链接那么简单，因为她经常结合多个来源的想法，然后加入自己的风格。\n\
  \n在我们家，她可以依靠她积累的食谱书库。她可以说：“用那本书做这个酱。用另一本书中描述的技术准备牛肉。达到你想要的熟度后，加入我认为会让它更好的这些额外配料。”\n\
  \n在我们家，她可以引用已知来源的步骤和配料清单，并用自己的额外步骤修改过程。但是，当她想把食谱给别人时，她不能指望对方拥有这些书籍。在这种情况下，她必须把来自她来源的食谱复制到一份自包含的新食谱文档中。此时，所有步骤和配料都定义在一个地方，食谱就可以发送给别人了。\n\
  \n这基本上就是静态链接和动态链接之间的区别。一个典型的程序需要读取和写入文件内容、打开窗口、收集用户输入或通过网络发送消息。这些都是常见任务，通常作为操作系统提供的库中的功能可用。当你希望使用其中一个库中的函数时，你会告诉链接器允许运行时链接。否则它会抱怨缺少符号引用。\n\
  \n在运行时，操作系统会搜索其配置路径，该路径告诉它在哪里找到这些共享库。在启动程序之前，它们会将库中的功能映射到可以动态链接到其余代码的内存位置。\n\n这种方法有许多原因。首先只是效率。假设你有一个名为\
  \ a() 的函数，被十几个或更多其他程序引用。使用静态链接，每个可执行文件都有自己的副本。程序占用更多的磁盘空间。它们在运行时的内存占用也会更大。这根本不是空间的高效利用。\n\
  \n如果动态库被加载到共享内存空间中，那么我们可能只需要磁盘上一个版本的一个副本。取决于操作系统的复杂性，你可能也只需要一次在内存中保留一个副本。\n\n动态链接库通常有自己的发布周期。如果你使用的是可执行程序中的系统库之一，你可能会更新操作系统并获得带有安全问题补丁的库的新版本。只要编号机制有效并且向后兼容，\
  \ presumably 你就可以通过使用修补版本来加强应用程序的安全性，而无需做其他任何事情。\n\n请看示例 7-1。这是一个独立的函数，没有 main()\
  \ 函数。它 intended 作为库使用。我们可以将其编译为静态库，但现在我们将只创建目标代码并将我们的 main() 程序链接到它。注意这个函数也依赖于 printf()，因此必须导入\
  \ stdio.h 头文件。\n\n#### 示例 7-1. 一个带有调用函数的库\n\n```\n#include <stdio.h>\n\nvoid sayHello(char\
  \ *message) {\n    printf(\"%s\\n\", message);\n}\n```\n\n在示例 7-2 中，你将看到 main()\
  \ 函数，它首先调用 printf()，然后调用我们的函数，该函数也调用 printf()。\n\n#### 示例 7-2. 一个调用我们库函数的示例 main()\
  \ 方法\n\n```\n#include <stdio.h>\n\nextern void sayHello(char *message);\n\nint main()\
  \ {\n    printf(\"Hello, world.\\n\");\n    sayHello(\"How are you?\");\n    return\
  \ 0;\n}\n```\n\n默认情况下，如果你用 clang 编译这两个文件，它会生成一个输出文件。我让它使用默认名称。运行它时，我们看到了预期的行为。默认情况下，出于我上面列出的所有原因，编译器将对系统库使用动态链接。\n\
  \n```\nbrian@tweezer ~/g/w/s/ch07> clang main.c library.c\nbrian@tweezer ~/g/w/s/ch07>\
  \ ls\na.out*      library.c  main.c\nbrian@tweezer ~/g/w/s/ch07> ./a.out\nHello,\
  \ world.\nHow are you?\n```\n\n你可以用 nm 命令验证我们在这里使用的是动态链接。首先，我们看到我们的二进制文件为 main()\
  \ 和 sayHello() 提供了定义，但没有为 printf() 提供定义。那是从标准库中重用的函数。\n\n```\nbrian@tweezer ~/g/w/s/ch07>\
  \ nm a.out\n0000000100008008 d __dyld_private\n0000000100000000 T ___mh_execute_header\n\
  0000000100003f10 T _main\n                U _printf\n0000000100003f50 T _sayHello\n\
  \                U dyld_stub_binder\n```\n\n在 Linux 上，你可以看到相同的构建步骤会产生一个包含更多提及函数的二进制文件。这很自然，因为它是一个不同的操作系统，具有不同的运行时和不同的二进制格式。关键点是我们的\
  \ 方法在我们的二进制文件中提供，但 printf() 没有。\n\n```\nbrian@bbfcfm:~/src/hello$ nm a.out\n0000000000404030\
  \ B __bss_start\n0000000000404030 b completed.8060\n0000000000404020 D __data_start\n\
  0000000000404020 W data_start\n0000000000401080 t deregister_tm_clones\n0000000000401070\
  \ T _dl_relocate_static_pie\n00000000004010f0 t __do_global_dtors_aux\n0000000000403e08\
  \ d __do_global_dtors_aux_fini_array_entry\n0000000000404028 D __dso_handle\n0000000000403e10\
  \ d _DYNAMIC\n0000000000404030 D _edata\n0000000000404038 B _end\n0000000000401218\
  \ T _fini\n0000000000401120 t frame_dummy\n0000000000403e00 d __frame_dummy_init_array_entry\n\
  000000000040216c r __FRAME_END__\n0000000000404000 d _GLOBAL_OFFSET_TABLE_\n   \
  \             w __gmon_start__\n0000000000402024 r __GNU_EH_FRAME_HDR\n0000000000401000\
  \ T _init\n0000000000403e08 d __init_array_end\n0000000000403e00 d __init_array_start\n\
  0000000000402000 R _IO_stdin_used\n0000000000401210 T __libc_csu_fini\n00000000004011a0\
  \ T __libc_csu_init\n                U __libc_start_main@@GLIBC_2.2.5\n0000000000401130\
  \ T main\n                U printf@@GLIBC_2.2.5\n00000000004010b0 t register_tm_clones\n\
  0000000000401170 T sayHello\n```\n\n```\n0000000000401040  T  _start\n0000000000404030\
  \  D  __TMC_END__\n```\n\notool 命令是可在 macOS 上使用的另一个命令，可显示你的二进制文件成功执行所需的动态库。显示了系统库的\
  \ macOS 版本。\n\n```\nbrian@tweezer ~/g/w/s/ch07> otool -L a.out\na.out:\n    /usr/lib/libSystem.B.dylib\
  \ (compatibility version 1.0.0,\ncurrent version 1292.60.1)\n```\n\notool 在 Linux\
  \ 上不存在，但使用 objdump 我们可以看到类似的结果。我已为节省空间删除了一些输出，但相关部分如下所示。如你所见，我们需要 libc.so.6 来满足我们二进制文件的需求。在\
  \ Windows 上会有类似的工具来检查你的 DLL 依赖项。\n\n```\nbrian@bbfcfm:~/src/hello$ objdump -x a.out\n\
  \na.out:      file format elf64-x86-64\na.out\narchitecture: i386:x86-64, flags\
  \ 0x00000112:\nEXEC_P, HAS_SYMS, D_PAGED\nstart address 0x0000000000401040\n\n...\n\
  \nDynamic Section:\n    NEEDED             libc.so.6\n    INIT               0x0000000000401000\n\
  \    FINI               0x0000000000401218\n    INIT_ARRAY         0x0000000000403e00\n\
  \    INIT_ARRAYSZ       0x0000000000000008\n    FINI_ARRAY         0x0000000000403e08\n\
  \    FINI_ARRAYSZ       0x0000000000000008\n    HASH               0x00000000004002e8\n\
  \    GNU_HASH           0x0000000000400310\n    STRTAB             0x0000000000400390\n\
  \    SYMTAB             0x0000000000400330\n    STRSZ              0x000000000000003f\n\
  \    SYMENT             0x0000000000000018\n    DEBUG              0x0000000000000000\n\
  ```\n\n\n\n\n```\nPLTGOT              0x0000000000404000\nPLTRELSZ            0x0000000000000018\n\
  PLTREL              0x0000000000000007\nJMPREL              0x0000000000400428\n\
  RELA                 0x00000000004003f8\nRELASZ              0x0000000000000030\n\
  RELAENT             0x0000000000000018\nVERNEED             0x00000000004003d8\n\
  VERNEEDNUM          0x0000000000000001\nVERSYM              0x00000000004003d0\n\
  ```\n\n```\nVersion References:\n  required from libc.so.6:\n    0x09691a75 0x00\
  \ 02 GLIBC_2.2.5\n\n...\n```\n\nWebAssembly 并不是操作系统，显然，但它受益于类似的概念。我们的选择是相同的，将所有函数定义放入单个模块中，使其独立存在，或者从另一个模块调用行为以满足我们的需求。鉴于我们将频繁通过网络下载\
  \ WebAssembly 模块，让它们保持较小尺寸是可取的。这也会影响磁盘存储、模块验证、内存中实例的加载等。为此，我们有 Table 实例。\n\n###\
  \ 在模块中创建表\n\nTable 实例具有一些与我们在第 4 章中介绍的 Memory 实例相似的特征。目前每个模块中只能有一个，但它可以定义在模块中，也可以通过导入对象传入。每个模块一个实例的限制未来可能会被解除，但目前我们必须遵守。\n\
  \n我们在 WebAssembly 中使用这种结构而不是仅使用 Memory 实例的部分原因是因为后者可以被模块操纵。如果我们正在进行适当的晚餐对话，我们不希望任何参与者重写礼貌的规则。共享模块的世界也是如此。如果我们加载并验证了一个通过\
  \ Table 实例导出函数的模块，我们不希望另一个模块能够让它对其他人造成破坏。因此，你唯一能做的就是对存储在表中的函数引用进行间接函数调用。目前函数引用是唯一可以存储在\
  \ Table 实例中的内容，但这也预计在未来会发生变化。\n\n为了避免在此阶段过度复杂化，我将回到 Wat 中的简单函数定义，以演示创建 Table 实例并导出它们的方式。\n\
  \n在示例 7-3 中，我创建了两个函数。$add 函数接收两个参数，将它们相加并返回结果。$sub 函数接收两个参数，用第一个减去第二个然后返回结果。到目前为止，正如他们所说，这有什么意义？这只是来自早期章节的重复内容。这里的不同之处在于接下来会发生什么。\n\
  \n#### 示例 7-3. 导出其 Table 实例的模块\n\n```\n(module\n  (func $add (param $a i32) (param\
  \ $b i32) (result i32)\n    get_local $a\n    get_local $b\n    i32.add)\n\n  (func\
  \ $sub (param $a i32) (param $b i32) (result i32)\n    get_local $a\n    get_local\
  \ $b\n    i32.sub)\n\n  (table (export \"tbl\") anyfunc (elem $add $sub))\n)\n```\n\
  \n我们引入了一个新的 Wat 关键字 table。这定义了一个函数引用的集合。注意内联的导出命令。我们将允许主机环境通过 $add 和 $sub 函数调用方法，但不能通过其名称调用。主机只能通过\
  \ Table 实例调用行为。anyfunc 类型目前是此结构唯一允许的类型，正如我们之前所说。基于 elem 引用的顺序，$add 将位于第 0 位，$sub\
  \ 将位于第 1 位。\n\n到目前为止你已经知道，我们可以将 Wat 文件转换为 Wasm 模块并按如下方式查看其内容。注意 Table 部分、Type 部分和\
  \ Export 部分。\n\n```\nbrian@tweezer ~/g/w/s/ch07> wat2wasm math.wat\nbrian@tweezer\
  \ ~/g/w/s/ch07> wasm-objdump -x math.wasm\n\nmath.wasm:      file format wasm 0x1\n\
  \nSection Details:\n\nType[1]:\n  - type[0] (i32, i32) -> i32\nFunction[2]:\n  -\
  \ func[0] sig=0\n  - func[1] sig=0\nTable[1]:\n  - table[0] type=funcref initial=2\
  \ max=2\nExport[1]:\n  - table[0] -> \"tbl\"\nElem[1]:\n  - segment[0] flags=0 table=0\
  \ count=2 - init i32=0\n    - elem[0] = func[0]\n    - elem[1] = func[1]\nCode[2]:\n\
  \  - func[0] size=7\n  - func[1] size=7\n```\n\n示例 7-4 中的 JavaScript 按我们在早期章节中做的方式实例化我们的模块。从那里它从模块的导出部分提取\
  \ Table 实例。\n\n#### 示例 7-4. 从 JavaScript 使用导出的 Table 实例\n\n```\n<!doctype html>\n\
  <html>\n  <head>\n    <meta charset=\"utf-8\">\n    <title>WASM Table test</title>\n\
  \    <script src=\"utils.js\"></script>\n  </head>\n  <body>\n    <script>\n   \
  \   fetchAndInstantiate('math.wasm').then(function(instance) {\n        var tbl\
  \ = instance.exports.tbl;\n```\n\n```\nconsole.log(\"3 + 1 = \" + tbl.get(0)(3,1));\n\
  console.log(\"3 - 1 = \" + tbl.get(1)(3,1));\n});\n</script>\n</body>\n</html>\n\
  ```\n\n在获取引用后，我们可以检索与第 0 位关联的函数并调用它。请记住，get() 调用返回的是对函数的引用。要调用它，我们在第二组括号中提交参数，然后将结果打印到控制台。然后我们对第\
  \ 1 位的函数也这样做。\n\n通过 HTTP 提供 HTML 并打开 JavaScript 控制台。当浏览器执行代码时，它应该看起来像图 7-1。\n\n\
  ![](img/16b7990eb0dbf589db177bdbd2f4a189_159_0.png)\n\n图 7-1. 通过 Table 实例调用方法的输出\n\
  \nTable 实例仅定义为有两个引用。如果你尝试访问超出 tbl.length 的位置，它将导致异常。\n\n### WebAssembly 中的动态链接\n\
  \n我们的最后一个示例将是一个使用 WebAssembly 动态链接的简单示例。我们将定义两个模块。一个将包含我们之前定义的 $add 和 $sub 方法。第一个模块如示例\
  \ 7-5 所示。与我们之前看到的不同之处在于，此模块从主机导入一个 Table。我们使用 elem 指令将算术函数放入此表中。加法函数存储在位置 0。减法函数存储在位置\
  \ 1。\n\n#### 示例 7-5. 一个动态链接的模块\n\n```\n(module\n  (import \"js\" \"table\" (table\
  \ 2 anyfunc))\n\n  (func $add (param $a i32) (param $b i32) (result i32)\n    get_local\
  \ $a\n    get_local $b\n    i32.add)\n\n  (func $sub (param $a i32) (param $b i32)\
  \ (result i32)\n    get_local $a\n    get_local $b\n    i32.sub)\n\n  (elem (i32.const\
  \ 0) $add)\n  (elem (i32.const 1) $sub)\n)\n```\n\n我们的第二个模块将导出两个函数，myadd 和 mysub。它向其客户端宣传能够加减两个数字的能力。内部，它将调用从主机\
  \ JavaScript 环境也导入的导入 Table 实例中的函数引用。\n\n我们所宣传功能的实现如示例 7-6 所示。两个函数都调用 call_indirect\
  \ 指令。在早期章节中，我们看到了使用 call 指令调用当前模块中定义的函数。call_indirect 指令通过标识你想要调用的 Table 的哪个元素来调用函数。\n\
  \n#### 示例 7-6. 依赖于动态链接模块的模块\n\n```\n(module\n  (import \"js\" \"table\" (table 2\
  \ anyfunc))\n\n  (type $sig (func (param $a i32) (param $b i32) (result i32)))\n\
  \n  (func (export \"myadd\") (param $a i32) (param $b i32) (result i32)\n    (call_indirect\
  \ (type $sig) (get_local $a) (get_local $b)\n    (i32.const 0))\n  )\n\n  (func\
  \ (export \"mysub\") (param $a i32) (param $b i32) (result i32)\n    (call_indirect\
  \ (type $sig) (get_local $a) (get_local $b)\n    (i32.const 1))\n  )\n)\n```\n\n\
  会让你注意到的事情之一是 type 指令的使用。这将定义函数的签名，以在 WebAssembly 中提供一点类型安全。想法是导入的 Table 函数应该具有你想要调用的签名。\n\
  \n在此例中我们定义了一个函数签名，接收两个 i32 并返回一个 i32。当我们通过 Table 调用方法时，我们指出这是我们期望的类型。在签名之后，我们将函数的参数推送到栈上，然后最后推送\
  \ Table 位置号。对于加法，这是常数值 0，表示 Table 中的第一个位置。对于减法，它将是第二个位置。\n\n我们将所有内容放在示例 7-7 中。首先我们做的是创建一个共享的\
  \ Table 实例。这将通过 importObject 传递给两个模块。不同之处在于 math2.wat 模块将它的函数 $add 和 $sub 分别写入位置\
  \ 0 和 1。mymath.wat 模块在从主机 JavaScript 环境调用 myadd 和 mysub 时间接调用这些位置。作为调用的一部分，它们还将传递给它们的动态链接函数参数。\n\
  \n由于我们处理的是两个模块，我们的实例化机制略有不同。不是等待单个 Promise，我们调用 Promise.all() 方法，该方法会阻塞直到所有子任务\n\
  \n\n\nPromises are met. 在这种情况下，它意味着两个模块都已加载并准备就绪。\n\n#### 示例 7-7. 使用动态链接实例化两个模块\n\
  \n```\n<!doctype html>\n<html>\n    <head>\n        <meta charset=\"utf-8\">\n \
  \       <title>WASM Dynamic Linking test</title>\n        <script src=\"utils.js\"\
  ></script>\n    </head>\n    <body>\n        <script>\n            var importObject\
  \ = {\n                js: {\n                    table: new WebAssembly.Table({\
  \ initial:2,\n                    element:\"anyfunc\" })\n                }\n  \
  \          };\n\n            Promise.all([\n                fetchAndInstantiate('math2.wasm',\
  \ importObject),\n                fetchAndInstantiate('mymath.wasm', importObject)\n\
  \            ]).then(function(instances) {\n                console.log(\"4 + 3\
  \ = \" + instances[1].exports.myadd(4,3));\n                console.log(\"4 - 3\
  \ = \" + instances[1].exports.mysub(4,3));\n            });\n        </script>\n\
  \    </body>\n</html>\n```\n\n一旦两个模块都可用，这段代码就会使用一些参数调用 myadd 和 mysub 方法。请注意，我们选择了代表我们行为版本的第二个模块实例。它是一个实例数组，而不是单个实例。\n\
  \n通过 HTTP 提供服务后，浏览器中的结果应类似于图 7-2 中所示。一个模块通过共享的 Table 实例间接调用另一个模块中实现的 behavior。\n\
  \n![](img/16b7990eb0dbf589db177bdbd2f4a189_163_0.png)\n\n图 7-2. 调用我们动态链接函数的输出结果\n\
  \n这结束了我们对 WebAssembly 作为平台主要功能元素的介绍。本书的其余部分将在这些基础之上展开，并向您展示 WebAssembly 现在以及未来如何被使用的多个示例。这包括我们尚未涵盖的一些更高级的功能。\n\
  \n1 我在 Twitter 上宣布这是一个词。因此它在互联网上，所以它必须是真实的。我用它来区分 0 基集合中的第二个位置。如果我说第一个，你可能会感到困惑。如果我编造一个词，也许你就不会了。\n"
- "## 第 8 章. 服务器上的 WebAssembly\n\n### 早期发布读者须知\n\n使用 Early Release 电子书，您可以在这些标题正式发布之前很久就利用这些技术——作者在撰写时对其原始未编辑内容进行获取。\n\
  \n这将是最终书籍的第 8 章。\n\n如果您对我们如何改进本书的内容和/或示例有任何意见，或者如果您注意到本章中缺少材料，请联系作者 wasmbook@bosatsu.net。\n\
  \n> 我作为焦点、处于聚光灯下时感到极度不舒服。我真的很喜欢幕后角色，因为我的自由都在那里。\n> ——布莱恩·伊诺\n\n我的职业生涯始于用户界面领域。我最初在一款用于控制网络矩阵交换机的\
  \ X/Motif¹ 应用程序上工作。从那里，我进入了一个能够显示数 TB 地形数据和超光谱图像的 Whole Earth 可视化环境。不仅从 3D 可视化角度来看很有趣，而且我们在“四人帮”《设计模式》一书问世前一年，受硅图公司的\
  \ Doug Young 启发，将整个应用程序围绕命令模式² 构建。\n\n在大多数时候，为人类使用而编写软件是一项有趣且有回报的体验。你可以通过对他们如何完成工作任务进行一些思考，真正让人们的生活更轻松、压力更小。尽管有这些积极因素，它也有其缺点。\n\
  \n虽然每个人对用户界面决策都有意见，但只有其中一些是有根据的意见。\n\n我想象在某种程度上，这就是布莱恩·伊诺在上面引文中所指的。他是 Roxy Music\
  \ 的联合创始人之一，是音乐发烧友心中的宠儿。但尽管他有华丽的服装和妆容，他并不真的想站在聚光灯下，并且在与布莱恩·费里频繁冲突后，他另辟蹊径，更专注于作曲和制作，而不是成为典型的摇滚明星表演者。\n\
  \n我的职业生涯发生了转变，我开始专注于设计、架构、后端服务等。我远离了用户界面的聚光灯，享受后端服务器工作的相对自由。它没有面向用户的活动那么引人注目，但它也有好处，那就是没有面向用户的活动那么引人注目。\n\
  \n在绝大多数存在时间里，WebAssembly 被定位为客户端技术。它主要被视为扩展和拓展浏览器中可能性的方式，一个不再仅通过 JavaScript 扩展的通用客户端。WebAssembly\
  \ 的作用远不止于成为前端宠儿。它在浏览器之外作为技术也将发挥极其重要的作用。事实上，它一直为此而定位，Node.js 在几乎整个时间里都支持 WebAssembly\
  \ 模块。\n\n在服务器上性能至关重要且你通常可以自由选择实现技术的情况下，这为何同样有意义可能并不明显。然而，在硬件异构性和演进、开发者生产力、业务价值、安全性和架构作为设计选择以最小化基础设施和网络成本的能力的交汇点上，却存在一个光芒四射的机会，WebAssembly\
  \ 正在迅速扩展以填补这一空白。在本书的剩余部分，我们将填补这个故事，但现在我们将仅关注在浏览器之外运行 WebAssembly 的基础知识。\n\n### 对\
  \ Node.js 的原生扩展\n\nNode.js 出现的原因之一是，开发者在浏览器客户端使用一种语言和一组框架，而在服务器端使用另一套。之前通过 Java\
  \ 本身和 Google Web Toolkit (GWT) 实现代码在各处重用的努力，曾试图从服务器到客户端的方向进行。这是一个相反方向的运动。软件开发领域的大多数兴奋点都发生在浏览器中，从\
  \ Ajax 到 jQuery 到 Angular 等等技术和框架的爆炸式增长。不得不编写在浏览器中运行的代码，然后用另一种语言重写以在服务器上运行，这令人抓狂。\n\
  \nNode.js 迅速流行起来，成为软件开发者的宠儿，他们现在拥有了更广的覆盖范围和更大的可重用性。作为一个基于 JavaScript 的环境，编写在上面运行的应用程序只要环境可移植就本质上是可移植的。其核心是来自\
  \ Google 的高性能 V8 JavaScript 引擎、libuv，即其事件循环的基础和对低级功能抽象层，以及建立在所有这些之上的 API 集合。这是一个本质上可移植的环境。\n\
  \n问题仍然存在，并非所有东西都适合用 JavaScript 实现，即使其核心是功能强大的 V8 引擎。它自然允许使用原生库扩展机制，原生库用 C 和 C++\
  \ 实现。鉴于 JavaScript 对象生命周期与原生代码结构之间的复杂关系，这使得软件开发变得更加棘手。更不用说，你突然有了原生库管理问题。如果安装了一个带有原生库扩展的\
  \ Node.js 应用程序，就需要一个流程让它们在 Linux、Windows、macOS 等系统上编译。\n\n许多 WebAssembly 教程演示了将两个数字相加。显然，除非你在谈论机器学习级别的数学，否则这不会是一个采用原生库的好用例。在第\
  \ 9 章中，我们将更深入地讨论这种场景。现在，我们将仅突出即使对于这个简单且理由不充分的示例，将 Node.js 与原生库集成也是相对复杂的。\n\n\n\n\
  \n\n问题在很大程度上在于 C 和 C++ 代码可以直接访问内存，而 JavaScript 代码则不能。在 Node.js 环境中，V8 引擎为在其上运行的\
  \ JavaScript 代码管理内存。这使得在 JavaScript 部分和引擎的原生部分之间传递字符串、结构、参数以及占用内存空间的其他元素变得更加棘手。V8\
  \ 的设计初衷是让 JavaScript 与浏览器中一个页面上的代码无法干扰分配给不同页面上其他代码的内存。这种隔离在嵌入 Node.js 环境中时仍然保持。\n\
  \n服务器端框架通常是可扩展的，因此我们可以添加额外的响应行为、过滤器、授权模型和数据处理工作流。在 Java 世界中，服务器开发者可以部署行为的方式有一系列选择。有\
  \ servlet、Spring bean、响应式系统等等。这些扩展的结构通常由标准或成熟的约定定义。\n\n在 Node.js 中，历史上一直有 Express\
  \ 等中间件，然后是用 C 和 C++ 编写的原生插件。该环境中的大多数应用程序都没有原生插件，因为 JavaScript 引擎已经变得相当高效，而且有似乎无穷无尽的开源库来解决各种需求。然而，在\
  \ JavaScript 性能不合适的情况下，仍然可以创建一个扩展并使其可从 JavaScript 端调用。\n\n不幸的是，这并不是一项简单的活动。首先，许多\
  \ JavaScript 开发者并不是熟练的 C 和 C++ 程序员。两种语言和运行时之间存在很大差异，而且在不受限制的 C 和 C++ 世界与隔离的、垃圾回收的\
  \ JavaScript 世界之间来回传递内存需要做大量的额外工作。即使开发者在这些低级语言中也很有效，原生库的采用也会使构建过程变得复杂。突然间，程序工件不再是固有的可移植的，我们需要跟踪原生库的\
  \ Linux、macOS 和 Windows 版本。\n\n让我们来看一个我们在本书中多次看到的简单示例。Node.js 关于插件的文档为我们提供了一个很好的示例来做比较³。首先，确保\
  \ node 和 node-gyp 命令已按附录 A 安装。然后，查看示例 8-1，你会看到一个将两个数字相加的单个函数。\n\n#### 示例 8-1. 来自\
  \ Node 网站的 Node.js 插件\n\n```\n// addon.cc\n// Taken from\nhttps://nodejs.org/api/addons.html#addons_addon_examples\n\
  \n#include <node.h>\n\nnamespace demo {\n\nusing v8::Exception;\nusing v8::FunctionCallbackInfo;\n\
  using v8::Isolate;\nusing v8::Local;\nusing v8::Number;\nusing v8::Object;\nusing\
  \ v8::String;\nusing v8::Value;\n\n// This is the implementation of the \"add\"\
  \ method\n// Input arguments are passed using the\n// const FunctionCallbackInfo<Value>&\
  \ args struct\nvoid Add(const FunctionCallbackInfo<Value>& args) {\n  Isolate* isolate\
  \ = args.GetIsolate();\n\n  // Check the number of arguments passed.\n  if (args.Length()\
  \ < 2) {\n    // Throw an Error that is passed back to JavaScript\n    isolate->ThrowException(Exception::TypeError(\n\
  \      String::NewFromUtf8(isolate,\n        \"Wrong number of arguments\").ToLocalChecked()));\n\
  \    return;\n  }\n\n  // Check the argument types\n  if (!args[0]->IsNumber() ||\
  \ !args[1]->IsNumber()) {\n    isolate->ThrowException(Exception::TypeError(\n \
  \     String::NewFromUtf8(isolate,\n        \"Wrong arguments\").ToLocalChecked()));\n\
  return;\n}\n\n// Perform the operation\ndouble value =\n    args[0].As<Number>()->Value()\
  \ + args[1].As<Number>()->Value();\n    Local<Number> num = Number::New(isolate,\
  \ value);\n\n// Set the return value (using the passed in\n// FunctionCallbackInfo<Value>&)\n\
  args.GetReturnValue().Set(num);\n}\n\nvoid Init(Local<Object> exports) {\n    NODE_SET_METHOD(exports,\
  \ \"add\", Add);\n}\n\nNODE_MODULE(NODE_GYP_MODULE_NAME, Init)\n\n}  // namespace\
  \ demo\n```\n\n该方法称为 Add()，它接受一个 FunctionCallbackInfo<Value>& 引用。从中，我们检索 Isolate\
  \ 实例，即我们对 V8 为此实例维护的内存子系统的句柄。如果参数不是两个或不是数值类型，我们会抛出异常。否则，我们将值作为数字检索并相加，然后创建一个新位置来保存该值，然后将其设置为函数的返回类型。此外，我们还需要在\
  \ Init() 方法中通过 Node.js 注册该模块。\n\n下一步是构建插件。在示例 8-2 中，你可以看到 binding.gyp 文件，它指示 node-gyp\
  \ 命令如何执行构建。这可以是一个更详细的过程，但我们的需求在这里相当简单。\n\n#### 示例 8-2. 插件的构建说明\n\n```\n{\n  \"targets\"\
  : [\n    {\n      \"target_name\": \"addon\",\n      \"sources\": [ \"addon.cc\"\
  \ ]\n    }\n  ]\n}\n```\n```\n}\n]\n}\n```\n\n构建命令相当简单明了（我隐藏了一些细节）：\n\n```\nbrian@tweezer\
  \ ~/g/w/s/c/node-addon> node-gyp configure build\ngyp info it worked if it ends\
  \ with ok\ngyp info using node-gyp@8.0.0\ngyp info using node@15.4.0 | darwin |\
  \ x64\ngyp info find Python using Python version 3.8.3 found at\n\"/usr/local/bin/python3\"\
  \ngyp http GET https://nodejs.org/download/release/v15.4.0/node-v15.4.0-headers.tar.gz\n\
  gyp http 200 https://nodejs.org/download/release/v15.4.0/node-v15.4.0-headers.tar.gz\n\
  gyp http GET\nhttps://nodejs.org/download/release/v15.4.0/SHASUMS256.txt\ngyp http\
  \ 200\nhttps://nodejs.org/download/release/v15.4.0/SHASUMS256.txt\n...\ngyp info\
  \ spawn args [ 'BUILDTYPE=Release', '-C', 'build' ]\n  CXX(target) Release/obj.target/addon/addon.o\n\
  \  SOLINK_MODULE(target) Release/addon.node\n```\n\n此时，插件已构建完成。我们可以用示例 8-3 所示的代码对其进行测试。\n\
  \n#### 示例 8-3. 用于测试原生插件的 JavaScript 代码\n\n```\n// test.js\nconst addon = require('./build/Release/addon');\n\
  \nconsole.log('This should be eight:', addon.add(3, 5));\n```\n\n表面上，使用插件的感觉与调用\
  \ WebAssembly 模块非常相似，但显然其实现比我们之前调用的用于添加两个数字的 C 代码复杂得多。真正的问题是，原生库的复杂性管理起来有点麻烦。现在，有了\
  \ WebAssembly，就不再需要这样做，你可以理解为什么 Node.js 社区对库的 WebAssembly 版本感到兴奋\n\n关于 WebAssembly\
  \ 版本的库。它们提供了良好的性能提升，但完全可移植并简化了部署模型。\n\n### WebAssembly 和 Node.js\n\n虽然大多数人认为 WebAssembly\
  \ 是客户端浏览器技术，但 Node.js 在很久以前就已经支持从 WebAssembly 模块调用函数，几乎与浏览器同时。 我不会创建任何实际的“服务器”，因为我认为这可能会分散我想传达的重点，但你显然可以设置一个\
  \ REST API 或类似的东西并仍然使用我提到的功能。\n\n让我们从示例 8-4 中的一个简单示例开始。\n\n示例 8-4. 一个简单的程序来添加两个数字\n\
  \n```\n#include <stdio.h>\n\nint add(int x, int y) {\n    return x + y;\n}\n\nint\
  \ main() {\n    printf(\"The sum of 2 and 3 is: %d\\n\", add(2,3));\n    return\
  \ 0;\n}\n```\n\n使用 clang，这可以非常简单地编译和执行。\n\n```\nbrian@tweezer ~/g/w/s/c/node> clang\
  \ add.c\nbrian@tweezer ~/g/w/s/c/node> ./a.out\nThe sum of 2 and 3 is: 5\n```\n\n\
  如果我们更新源代码以包含一些 Emscripten 相关的宏，我们就可以像之前看到的那样在 Node.js 中运行它。我还移除了 main() 方法，这样我们的模块将不再期望\
  \ printf() 函数的实现，因为我们将在服务器端 JavaScript 的世界中运行。更新后的代码在示例 8-5 中。\n\n#### 示例 8-5. 使用\
  \ Emscripten 宏的简单程序来添加两个数字\n\n```\n#include <emscripten.h>\n\nEMSCRIPTEN_KEEPALIVE\
  \ int add(int x, int y) {\n    return x + y;\n}\n```\n\n> 1  包含 Emscripten 头文件以获取宏定义。\n\
  > 2  告诉 Emscripten 编译器保留 add() 方法。\n\n现在我们可以用 emcc 重新编译并用 Node.js 运行它：\n\n```\n\
  brian@tweezer ~/g/w/s/c/node> emcc add.c\nbrian@tweezer ~/g/w/s/c/node> ls -alF\n\
  total 376\ndrwxr-xr-x   6 brian  staff       192 Apr 18 15:05 ./\ndrwxr-xr-x  10\
  \ brian  staff       320 Apr 18 13:08 ../\n-rwxr-xr-x   1 brian  staff     49456\
  \ Apr 18 15:05 a.out*\n-rw-r--r--   1 brian  staff    121686 Apr 18 15:05 a.out.js\n\
  -rwxr-xr-x   1 brian  staff     11805 Apr 18 15:05 a.out.wasm*\n-rw-r--r--   1 brian\
  \  staff       141 Apr 18 15:05 add.c\nbrian@tweezer ~/g/w/s/c/node> node a.out.js\n\
  The sum of 2 and 3 is: 5\n```\n\n如果你调查 a.out.js 文件，你会看到 Emscripten 工具链为我们处理的所有设置。\n\
  \nNode.js 运行时提供了适当的基于 JavaScript 的 WebAssembly API，如我们在浏览器中看到的那样。这允许你加载和实例化模块并按需调用其行为。在幕后，这就是\
  \ Emscripten 工具链为我们生成的代码。\n\n然而，我们也对简化服务器中 WebAssembly 模块的加载和实例化感兴趣，就像在浏览器中一样。Node.js\
  \ 提供了实验性的支持，可将它们作为 ES6 模块加载，如示例 8-6 所示。\n\n#### 示例 8-6. 将 WebAssembly 模块作为 ES6 模块加载\n\
  \n\n\n\n\n```\nimport * as Module from './a.out.wasm';\n\nconsole.log('The sum of\
  \ 6 and 2 is: ' + Module.add(6,2));\n```\n\n根据运行的时间，你可能需要实验性功能标志，但请注意，与我们之前看到的情况相比，使用起来容易得多。行为的表达也比我们在之前关于原生插件的讨论中看到的简单得多。你可以看到为什么这个社区对随着时间的推移不断增加的\
  \ WebAssembly 支持感到兴奋。\n\n```\nbrian@tweezer ~/g/w/s/c/node> node --experimental-modules\
  \ ↵\n  --experimental-wasm-modules index.mjs\n(node:74571) ExperimentalWarning:\
  \ Importing Web Assembly modules\nis an\nexperimental feature. This feature could\
  \ change at any time (Use\n`node\n--trace-warnings ...` to show where the warning\
  \ was created)\nThe sum of 6 and 2 is: 8\n```\n\n作为最后一个例子，我想引入一个更复杂的第三方库。出于我将在本章末尾解释的原因，找到一个不会打开太多潘多拉魔盒的良好示例很棘手。我们还没有介绍一些东西，但本章开始为此奠定了基础。\n\
  \n### 供应链攻击\n\n这就引出了另一个考虑。我们在安全软件系统世界中面临一个非常严重的问题，称为供应链攻击。这不是一个新问题，但它变得越来越严重和频繁。\n\
  \n没有单一的方法可以构建一个安全系统， certainly 不是简单地通过打开加密或某些安全功能来实现。那些对于安全系统可能是必要的，但绝对是不够的。通常通过纵深防御⁴、最小权限原则⁵\
  \ 以及有意地在组织层面承担安全责任的结合，你才能开始朝着正确的方向前进。\n\n对我们来说，问题在于我们正在运行来自不受信任的第三方的不受信任的代码，并赋予了我们在生产环境中通常给予自己的权限。开箱即用，Node\
  \ 无法对此提供任何保护，这是一个严重的问题，正在为网络钓鱼、数据泄露和其他攻击打开新的攻击向量。\n\n这里有一个此类攻击的撰写⁶。基本思路是，攻击者会制作一个适度有用的开源功能片段，让它开始被使用。开发人员经常在不考虑其来源或依赖项的传递来源集合的情况下添加依赖项。一旦代码在生态系统中获得足够的使用量，在精心控制的情况下进行的小幅更新开始以微妙且难以预料的方式暴露攻击。基本上，代码可能会开始寻找加密货币私钥或其他有用的敏感信息。\n\
  \n解决这个问题的唯一真正解决方案之一涉及一个积极且细心的软件开发人员社区，手动检查每个依赖项的每次更新（及其相应的全面的传递依赖列表），这几乎可以保证永远不会发生。另一个解决方案是在任意代码不被赋予为所欲为的权限的场景下运行。Node.js\
  \ 传统上允许这种模型，这也是其创始人 Ryan Dahl 另起炉灶创建更安全的新东西的原因之一。\n\n进入 Deno。\n\n### WebAssembly\
  \ 和 Deno\n\nDeno⁷ 基本上是比 Node.js 更安全的 JavaScript 和 TypeScript 运行时，即使两者最初都是由同一个人构建的。与\
  \ Node.js 相比，安全性并不是那么大的考虑因素，因此事后很难附加。Deno 从一开始就将安全作为默认立场。在 Deno 运行时中运行的代码如果未被授予权限，则无法访问文件系统或打开网络连接。\n\
  \n这显然不是一个新想法。Java 几乎在其存在的整个时间内就一直在其核心拥有安全权限模型。问题在于 Java 的权限模型可能有点繁琐且难以正确处理。如果有什么东西会扼杀安全性，复杂性名列前茅。正如你将在下面看到的，Deno\
  \ 使用基于能力⁸ 的方法以更简单的方式处理这个问题。\n\n除了安全性之外，Deno “原生运行 TypeScript”，而通常需要先将其转译为某种 JavaScript。虽然\
  \ Deno 在幕后编译它并缓存编译后的形式，但感觉更像是原生支持。这通过允许改进的类型检查来改善 JavaScript 开发的质量（这也具有安全影响），因为由于\
  \ TypeScript 中强大的类型系统，运行时通常会出现的问题可以在编译时被检测到。\n\n让我们从 Example 8-5 中添加两个数字的 WebAssembly\
  \ 模块开始。在 Example 8-7 中，你可以看到我们第一次尝试使用 Deno 的 WebAssembly 支持。超级简单！\n\n#### Example\
  \ 8-7. 在 Deno 中加载 WebAssembly 模块\n\n```\nconst wasmCode = await Deno.readFile(\"\
  ./a.out.wasm\");\nconst wasmModule = new WebAssembly.Module(wasmCode);\nconst wasmInstance\
  \ = new WebAssembly.Instance(wasmModule);\nconst add = wasmInstance.exports.add\
  \ as CallableFunction\n\nconsole.log(\"2 + 3 = \" + add(2,3));\n```\n\n不幸的是，我们的兴奋很快就结束了。至少问题很清楚。我们试图从文件系统读取，但没有权限这样做。我们立即看到了\
  \ Deno 的安全优势。\n\n```\nbrian@tweezer ~/g/w/s/c/deno> deno run main.ts\nerror: Uncaught\
  \ (in promise) PermissionDenied: Requires read access to \"./a.out.wasm\",\nrun\
  \ again with the --allow-read flag\n```\n\n```\nconst wasmCode = await Deno.readFile(\"\
  ./a.out.wasm\");\n^\n    at unwrapOpResult (deno:core/core.js:100:13)\n    at async\
  \ open (deno:runtime/js/40_files.js:46:17)\n    at async Object.readFile\n(deno:runtime/js/40_read_file.js:19:18)\n\
  \    at async file:///Users/brian/git-personal/webassembly-the-definitive-guide/src/ch08/deno/main.ts:1:18\n\
  ```\n\n如果我们使用以下命令重新运行，事情会愉快得多。\n\n```\nbrian@tweezer ~/g/w/s/c/deno> deno run --allow-read\
  \ main.ts\nCheck file:///Users/brian/git-personal/webassembly-the-definitive-guide/src/ch08/deno/main.ts\n\
  2 + 3 =  5\n```\n\n虽然我不想太分散地讨论运行 Node.js 和 Deno HTTP 服务器的细节，但我确实承认，在一章关于服务器的章节中我还没有运行过服务器，这有点可悲。所以，这里有一个简单的\
  \ HTTP 服务器。要变得更复杂就需要我们进入 Deno 中间件。\n\n在 Example 8-8 中，你可以看到 Deno 如何允许你通过 HTTP 拉取版本化的模块供使用。在这种情况下，我们从\
  \ Deno 标准库中拉取一个基本的 HTTP 服务器。\n\n#### Example 8-8. 在 Deno HTTP 服务器中使用 WebAssembly\n\
  \n```\nimport { serve } from \"https://deno.land/std@0.93.0/http/server.ts\";\n\n\
  const wasmCode = await Deno.readFile(\"./a.out.wasm\");\nconst wasmModule = new\
  \ WebAssembly.Module(wasmCode);\nconst wasmInstance = new WebAssembly.Instance(wasmModule);\n\
  const add = wasmInstance.exports.add as CallableFunction\n\nconst server = serve({\
  \ hostname: \"0.0.0.0\", port: 9000 });\nconsole.log(`HTTP webserver running.  Access\
  \ it at:\nhttp://localhost:9000/`);\n\nfor await (const request of server) {\n \
  \ let bodyContent = \"2 + 3 = \" + add(2,3);\n  request.respond({ status: 200, body:\
  \ bodyContent });\n}\n```\n\n为快速失望做好准备！正如我们不能在不授予应用程序读取文件系统的权限的情况下运行读取文件系统的 TypeScript\
  \ 代码一样，我们也不能在没有权限的情况下监听网络连接！\n\n```\nbrian@tweezer ~/g/w/s/c/deno> deno run --allow-read\
  \ main-serve.ts\nerror: Uncaught (in promise) PermissionDenied: Requires net\naccess\
  \ to \"0.0.0.0:9000\", run again with the --allow-net flag\n    const listener =\
  \ Deno.listen(addr);\n                    ^\n\n    at unwrapOpResult (deno:core/core.js:100:13)\n\
  \    at Object.opSync (deno:core/core.js:114:12)\n    at opListen (deno:runtime/js/30_net.js:18:17)\n\
  \    at Object.listen (deno:runtime/js/30_net.js:184:17)\n    at serve (https://deno.land/std@0.93.0/http/server.ts:303:25)\n\
  \    at file:///Users/brian/git-personal/webassembly-the-\ndefinitive-guide/src/ch08/deno/main-serve.ts:8:16\n\
  ```\n\n幸运的是，我们被告知该怎么做，而且这是一个很容易修复的问题。\n\n```\nbrian@tweezer ~/g/w/s/c/deno> deno\
  \ run --allow-read --allow-net main-serve.ts\nHTTP webserver running. Access it\
  \ at: http://localhost:9000/\n```\n\n现在一个简单的 HTTP 客户端可以获取我们的结果。\n\n```\nbrian@tweezer\
  \ ~> http http://localhost:9000\nHTTP/1.1 200 OK\ncontent-length: 9\n\n2 + 3 = 5\n\
  ```\n\n现在我们将看一个 Deno 和 WebAssembly 的最后一个例子。我一直有点谨慎地展示某些类型的功能，直到我们有机会在第 11 章讨论 WebAssembly\
  \ 服务接口 WASI 标准。我保证在那时我们会查看更有趣的 Node.js 和 Deno 示例。目前我想展示一个使用 WebAssembly 与 Deno 的用法，不需要太多额外的细节。\n\
  \n\n\n\n\nTilman Roeder⁹ 创建了一个内存中的 SQLite WebAssembly 模块，并将其封装以供 JavaScript 和 TypeScript¹⁰\
  \ 使用。它的工作原理细节稍后再说，但使用起来相当直接，如示例 8-9 所示。\n\n#### Example 8-9. Using a WebAssembly\
  \ SQLite wrapper in a Deno HTTP Server\n\n```\nimport { DB } from \"https://deno.land/x/sqlite/mod.ts\"\
  ;\nimport { serve } from \"https://deno.land/std@0.93.0/http/server.ts\";\n\n//\
  \ Create the Database. This requires write access!\n\nconst db = new DB(\"pl.db\"\
  );\ndb.query(\n  \"CREATE TABLE IF NOT EXISTS languages (id INTEGER PRIMARY KEY\
  \ AUTOINCREMENT, name TEXT)\",\n);\n\nconst names = [\"C\", \"C++\", \"Rust\", \"\
  TypeScript\"]\n\n// Populate the database\n\nfor (const name of names) {\n  db.query(\"\
  INSERT INTO languages (name) VALUES (?)\", [name]);\n}\n\n// Close out the connection\n\
  \ndb.close();\n\nconst server = serve({ hostname: \"0.0.0.0\", port: 9000 });\n\
  console.log(`HTTP webserver running. Access it at: http://localhost:9000/`);\n\n\
  for await (const request of server) {\n  // Re-open the Database\n\n  const db =\
  \ new DB(\"pl.db\");\n  let bodyContent = \"Programming Languages that work with\
  \ WebAssembly:\\n\\n\";\n\n  for(const [name] of db.query(\"SELECT name FROM languages\"\
  )) {\n    bodyContent += name + \"\\n\";\n  }\n  \nbodyContent += \"\\n\";\nrequest.respond({\
  \ status: 200, body: bodyContent });\n\n// Close the Database\ndb.close();\n}\n\
  ```\n\n我们首先创建数据库文件。我希望你的直觉告诉你这将需要另一个运行时权限，因为确实如此，如下所示。之后，我们将一些数据加载到数据库中并关闭连接。\n\n\
  一旦服务器启动，在收到合适的 HTTP 请求后，我们将再次打开数据库，运行查询，生成结果然后关闭数据库。我并不是说这已经是高质量的生产代码，但令人惊讶的是，这段代码能够在\
  \ Deno 中安全运行，并且将在 Deno 支持的各种平台上运行。即使我们处理的是一个封装的 C 库（即 SQLite3），WebAssembly 也使代码具有可移植性，同时性能仍然相当不错。我希望通过安全、快速且可移植的\
  \ WebAssembly 代码扩展服务器基础设施的想法变得更加清晰。\n\n以下命令将使用合适的权限启动服务器。\n\n```\nbrian@tweezer\
  \ ~/g/w/s/c/deno> deno run --allow-read --allow-write\n--allow-net db-serve.ts\n\
  HTTP webserver running. Access it at: http://localhost:9000/\n```\n\n来自 HTTP 客户端的请求会产生我们所期望的结果。\n\
  \n```\nbrian@tweezer ~> http http://localhost:9000\nHTTP/1.1 200 OK\ncontent-length:\
  \ 74\n\nProgramming Languages that work with WebAssembly:\n\nC\nC++\nRust\nTypeScript\n\
  ```\n\n### A Look Forward\n\n尽管本章在浏览器之外迈出了巨大一步，但这只是开始。虽然我们放弃了在受限环境中运行的安全限制（除了同样受限的\
  \ Deno 实例），但我们也放弃了浏览器的丰富功能。任何现代浏览器平台的 JavaScript 环境都提供了大量功能。这包括 JavaScript 引擎、硬件加速的\
  \ 2D/3D 绘图和视频播放、声音、字体支持、进行网络请求的能力等等。默认情况下，Node.js 或 Deno 都不提供浏览器的全部功能，尽管 Deno 正在努力支持其中大部分功能。这使得编写可在浏览器内外运行的\
  \ WebAssembly 应用程序变得更加困难。\n\nWebAssembly 使代码具有可移植性。我们需要另一种策略，通过为我们期望在现代计算平台上提供的功能提供一致的服务接口，使应用程序具有可移植性。这就是为什么我对我能向你展示的示例类型有些谨慎。解决这个问题的真正方案将在第\
  \ 11 章中介绍。在此之前，请耐心等待，但在我们前往的路上还有很多要讨论的内容。\n\n- 1 Motif built on top of the Xt Intrinsics\
  \ libraries and the X Window System:\n  https://en.wikipedia.org/wiki/Motif_(software)\n\
  \  \n- 2 The Command Pattern separates the triggering event for execution of code\
  \ from the actual code allowing for, among other things, macro recording and playback:\n\
  \  https://en.wikipedia.org/wiki/Command_pattern\n  \n- 3 There are several examples\
  \ of building Node addons here:\n  https://nodejs.org/api/addons.html#addons_addon_examples\n\
  \  \n- 4 A combination of overlapping security controls can help you protect against\
  \ unexpected vulnerabilities: https://en.wikipedia.org/wiki/Defense_in_depth_(computing)\n\
  \  \n- 5 Only assigning the minimum privileges necessary to users is part of how\
  \ this technique helps. More information can be found here:\n  https://en.wikipedia.org/wiki/Principle_of_least_privilege\n\
  \  \n- 6 A description of a Supply Chain Attack from 2018: https://medium.com/@hkparker/analysis-of-a-supply-chain-attack-2bd8fa8286ac\n\
  \n- 7 There is a lot to like about Deno beyond security. Check it out: https://deno.land.\n\
  \n- 8 Capability-based security systems generally provide actors to demonstrate\
  \ that they have an unforgeable permission to conduct an operation. https://en.wikipedia.org/wiki/Capability-based_security\n\
  \n- 9 @dyedgreen on Twitter and Github\n\n- 10 You can access the GitHub repository\

  \ cwrap，它会为调用特定 C 函数生成一个 JavaScript 函数。我们在示例 6-17 中将其添加到 EXTRA_EXPORTED_RUNTIME_METHODS\
  \ 指令中。\n\n#### 示例 6-17. 更新 Makefile 以使用 cwrap\n\n```\nbitmap_test: bitmap_test.cpp\
  \ bitmap_image.hpp\n    $(COMPILER) $(OPTIONS) bitmap_test.js bitmap_test.cpp\n\

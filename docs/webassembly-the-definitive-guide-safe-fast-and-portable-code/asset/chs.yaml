  \ ('_start')\n```\n\n一个根本性问题是，基本模块结构未定义与可执行程序相同类型的应用程序二进制接口 (ABI)³。它没有预期的初始化函数名称。开发人员认为\
  \ main() 是起点，但通常这是由非常精简的 C 运行时环境从名为 \"start\" 的方法调用的。\n\n另一个问题是，没有直接的方法从 WebAssembly\
  \ 模块写入控制台或读写文件。这似乎是 WebAssembly 的一个相当大的障碍，但我鼓励你不要就此放弃希望！如果我们使用不同的后端会怎样？而不是 wasm32-unknown-unknown，我们将使用\
  \ wasm32-wasi。\n\n\n\n\n\n```\nbrian@tweezer ~/g/w/s/c/hello-world> cargo build\
  \ --target wasm32-wasi --release\n    Compiling hello-world v0.1.0 (/Users/brian/git-personal/webassembly-the-definitive-guide/src/ch11/hello-world)\n\
  \    Finished release [optimized] target(s) in 0.74s\nbrian@tweezer ~/g/w/s/c/hello-world>\
  \ wasm3 target/wasm32-wasi/release/hello-world.wasm\nHello, world!\n```\n\n嗯。你看吧？\n\
  \n让我们调查一下这个模块。\n\n```\nbrian@tweezer ~/g/w/s/c/hello-world > wasm-objdump -x target/wasm32-wasi/release/hello-world.wasm\n\
  hello-world.wasm:          file format wasm 0x1\n\nSection Details:\n\nType[18]:\n\
  \  - type[0] () -> nil\n  - type[1] (i32) -> nil\n  - type[2] (i32) -> i64\n  -\
  \ type[3] (i32, i32) -> nil\n  - type[4] (i32, i32) -> i32\n  - type[5] (i32, i32)\
  \ -> i64\n  - type[6] (i32) -> i32\n  - type[7] (i32, i32, i32) -> i32\n  - type[8]\
  \ (i32, i32, i32, i32) -> i32\n  - type[9] () -> i32\n\n...\nImport[4]:\n  - func[0]\
  \ sig=8 <_ZN4wasi13lib_generated22wasi_snapshot_preview1_8fd_write> <- wasi_snapshot_preview1.fd_write\n\
  \  - func[1] sig=1 <__wasi_proc_exit> <- wasi_snapshot_preview1.proc_exit\n  - func[2]\
  \ sig=4 <__wasi_environ_sizes_get> <- wasi_snapshot_preview1.environ_sizes_get\n\
  \  - func[3] sig=4 <__wasi_environ_get> <- wasi_snapshot_preview1.environ_get\n\
  ...\n\nExport[5]:\n  - memory[0] -> \"memory\"\n```\n\n+   - global[1] -> \"__heap_base\"\
  \n+   - global[2] -> \"__data_end\"\n+   - func[247] <_start.command_export> ->\
  \ \"_start\"\n+   - func[248] <main.command_export> -> \"main\"\n\n...\n\n这是一个 WebAssembly\
  \ 模块，但它也导出了一个已知的起始点，这样像 wasm3 这样的 WASI 感知环境就知道如何初始化它并开始执行。WASI 的内容远不止这个引导过程。它还为模块导入其执行所需的功\
  \ 能提供了一种便捷方式。这本质上就是 Rust wasm32-wasi 后端为我们所做的事情。它会发出对标准库实现的调用，该实现将由我们的代码运行的主机环境提供。同样，wasm3\
  \ 至少是一个简陋的 WASI 环境，因此它提供了这些能力。它在浏览器之外作为 WebAssembly 引擎出现，早于 WASI，但它积极支持我们将在下一章讨论的不断发展的标准和新提案。\n\
  \n如果你按照附录 A 的安装步骤操作，可以再安装两个 WASI 环境，Wasmtime⁴ 和 Wasmer⁵。两者都是开源的且是独立的项目。\n\n```\n\
  brian@tweezer ~/g/w/s/c/hello-world> wasmtime target/wasm32-wasi/release/hello-world.wasm\n\
  Hello, world!\nbrian@tweezer ~/g/w/s/c/hello-world> wasmer target/wasm32-wasi/release/hello-world.wasm\n\
  Hello, world!\n```\n\n最后，还有一个 cargo 本身的扩展使用了 Wasmtime，但有助于使构建、运行和测试基于 Rust 的 WASI\
  \ 应用程序变得更加容易。\n\n```\nbrian@tweezer ~/g/w/s/ch11 > cargo install cargo-wasi\n  \
  \  Updating crates.io index\n    ...\nbrian@tweezer ~/g/w/s/c/hello-world> cargo\
  \ wasi run\n```\n\n```\nFinished dev [unoptimized + debuginfo] target(s) in 0.03s\n\
  Running `/Users/brian/.cargo/bin/cargo-wasi target/wasm32-wasi/debug/hello-world.wasm`\n\
  Running `target/wasm32-wasi/debug/hello-world.wasm`\nHello, world!\n```\n\n关于这一切如何工作的实际细节比我现在想深入讨论的要复杂得多，但为了让你稍微窥探一下幕后，示例\
  \ 11-2 是来自 Wasmtime WASI 教程⁶ 的一个例子。它在比你之前做过的更低的层面上工作，但这是相当典型的系统编程。\n\n#### 示例 11-2.\
  \ 从 Wat 调用标准库行为\n\n```\n;; Taken from the Wasmtime WASI Tutorial\n(module\n    ;;\
  \ Import the required fd_write WASI function which will write\n    the given io\n\
  \    ;; vectors to stdout. The function signature for fd_write is:\n    ;; (File\
  \ Descriptor, *iovs, iovs_len, nwritten) -> Returns #\n    of bytes written\n  \
  \  (import \"wasi_unstable\" \"fd_write\"\n        (func $fd_write (param i32 i32\
  \ i32 i32) (result i32)))\n\n    (memory 1)\n    (export \"memory\" (memory 0))\n\
  \n    ;; Write 'hello world\\n' to memory at an offset of 8 bytes\n    ;; Note the\
  \ trailing newline which is required for the text to\n    appear\n    (data (i32.const\
  \ 8) \"hello world\\n\")\n\n    (func $main (export \"_start\")\n        ;; Creating\
  \ a new io vector within linear memory\n        ;; iov.iov_base - This is a pointer\
  \ to the start of the\n        ;; 'hello world\\n' string\n        (i32.store (i32.const\
  \ 0) (i32.const 8))\n        ;; iov.iov_len - The length of the 'hello world\\n'\
  \ string\n        (i32.store (i32.const 4) (i32.const 12))\n\n        (call $fd_write\n\
  \            (i32.const 1) ;; file_descriptor - 1 for stdout\n            (i32.const\
  \ 0) ;; *iovs - The pointer to the iov array at\n            memory loc 0\n    \
  \        (i32.const 1) ;; iovs_len - We're printing 1 string\n            (i32.const\
  \ 20) ;; nwritten - Mem loc to store the # of bytes\n```\n\n```\nwritten\n    )\n\
  \    drop ;; Discard the number of bytes written from the top of the stack\n)\n\
  )\n```\n\nUnix 管道和过滤器方法用于工具组合，允许你将一个程序的输出重定向到另一个程序的输入⁷。示例包括使用 less 命令暂停滚动的终端消息，或使用\
  \ grep 命令查找与特定模式匹配的进程表中的元素。\n\n文件是 Unix 中真实磁盘文件以及虚拟文件（如程序的输入或输出）的通用抽象。能够打印到控制台是通过写入特定文件描述符来管理的。在此环境中，程序中的文件描述符\
  \ 0 代表标准输入，即传入程序的内容。文件描述符 1 代表标准输出，即程序在正常情况下记录的内容。文件描述符 2 是标准错误，通常用于错误消息。\n\n距离我们上次摆弄\
  \ Wat 已经过去了几章，这比我们迄今为止看到的要复杂一些，但我认为在一些指导下你应该能够理清它。\n\n我们做的第一件事是从 wasi_unstable 命名空间导入一个名为\
  \ fd_write 的函数。这是 WASI 环境如果想满足我们的期望就会与我们见面的地方。如果我们没有提供这种行为，我们将无法执行。\n\nfd_write\
  \ 函数接收四个参数，指示使用哪个文件描述符，我们在内存中存储要写入的字符串的位置、它的长度以及写入已写入字节数的 位置。正如指定的那样，这将在我们的字符串之后在内存中。\n\
  \n我们接下来定义模块的 Memory 实例并导出它。我们刚刚导入的函数将根据我们发送给它的参数来检查它。我们使用一个 data 元素将字符串 “hello world”\
  \ 写入我们的内存的字节 8 处。最后我们导出一个方法，该方法最终会调用所有这些。\n\n我们将基指针指向字符串的数值位置写入前四个字节，并将其长度写入随后的四个字节。字符串本身将存在于这些数字之后。最后我们调用我们导入的\
  \ fd_write 函数。\n\n你会注意到我们甚至不需要将 Wat 文件编译回二进制模块。我们的友好小 WASI 环境可以为我们完成这项工作。\n\n```\n\
  brian@tweezer ~/g/w/s/ch11> wasmtime hello.wat\nhello world\nbrian@tweezer ~/g/w/s/ch11>\
  \ wasmer hello.wat\nhello world\n```\n\n很明显你不会想像这样用 Wat 编写程序。我只是想让你了解幕后发生的事情。你将在\
  \ Rust 或 C 等语言中编写程序，并使用 WASI 感知的工具链编译它们。说到 C，我们现在将最后一次重温我们可靠的“Hello, World!”程序，见示例\
  \ 11-3。\n\n#### 示例 11-3. C “Hello, World!” 希望是最后一次！\n\n```\n#include <stdio.h>\n\
  \nint main() {\n    printf(\"Hello, World!\\n\");\n    return 0;\n}\n```\n\n我们需要将其编译为\
  \ WASI 友好的形式。有几种方法可以做到这一点，但其中最简单的方法之一是使用我们 Wasmer 朋友的 Wasienv 工具链⁸。C 编译需要头文件和库，但在此情况下，我们还需要一个\
  \ WASI 感知的标准库功能版本⁹。正如 Emscripten 具有 cc、c++、make 和 configure 的替代品，Wasienv 也有。我去掉了无关紧要的编译警告，但否则你应该开始了解这一切有多强大。\n\
  \n\n\n\n\n```\nbrian@tweezer ~/g/w/s/ch11> wasicc -o hello hello.c\nbrian@tweezer\
  \ ~/g/w/s/ch11> wasm3 hello.wasm\nHello, World!\nbrian@tweezer ~/g/w/s/ch11> wasmer\
  \ hello.wasm\nHello, World!\nbrian@tweezer ~/g/w/s/ch11> wasmtime hello.wasm\nHello,\
  \ World!\nbrian@tweezer ~/g/w/s/ch11> ./hello\nHello, World!\n```\n\n我们现在已经使用相同的运行时运行了在\
  \ Rust 和 C 中未经修改编译的代码。相同的 WASI 形式的 WebAssembly 模块也可在 Linux 或 Windows 上运行。只要我们的 WASI\
  \ 启用主机满足我们的期望，我们应该可以在 WebAssembly 运行的任何地方运行。注意 Wasienv 甚至为我们生成了一个独立的原生应用程序！你将在下一章了解这意味着什么。\n\
  \n事实证明，Node.js 和 Deno 也都支持 WASI。甚至还有一个 JavaScript 兼容层，可以让你的 WASI 启用应用程序在浏览器中运行！请参阅图\
  \ 11-1，了解 WASI 兼容层在实际中的示例。这可在 https://wasi.dev/polyfill/ 获取。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_236_0.png)\n\
  \n图 11-1. 在浏览器中的兼容层中运行 WASI 应用程序\n\nWebAssembly 使你的代码具有可移植性。WASI 通过在你需要时满足其期望来使你的应用程序具有可移植性。\n\
  \n## 基于能力的<|message|>\n\nWASI 的另一个方面对于 WebAssembly 在这种无处不在的计算环境中的未来至关重要。我们希望能够向我们想要提供功能的应用提供功能，但不提供给恶意软件。由于我们通常无法区分两者，我们很可能会将受限的沙箱环境作为默认。\n\
  \n从一开始，WASI 就被设想为一种手段，用于对托管模块的行为施加基于能力的访问限制。\n\n简而言之，这意味着，就像 WebAssembly 不给任意代码直接访问内存一样，WASI\
  \ 不给它直接访问敏感资源（如文件句柄、网络套接字或子进程详情）的权限。相反，资源将通过不可伪造的、不透明的句柄暴露出来，向代码提供能力。由于这需要将语言特定的或可能是操作系统级别的结构在\
  \ WebAssembly 模块之间传递，我们需要一种方法来创建外部引用。\n\n如何以及为何这会起作用，在本书撰写时仍是一个复杂且不断变化的目标。我一直在为自己纠结要关注多少细节，最终决定现在其中大部分内容会成为一种干扰，部分原因是这些提案仍在进行中。这也是因为它在某些方面超级复杂，即使它逐渐发展成一个越来越优雅的设计。在第\
  \ 12 章我会让你了解更多细节，但现在，让我们专注于看到结果。\n\n在示例 11-4 中，我们有一个用 Rust 编写的简单程序，它将一个字符串写入文件然后读回。从编程角度来看，它非常简单。真正的大问题，当然是访问文件系统。如果你还不是\
  \ Rust 大师，不要为细节而烦恼，程序的流程应该仍然有意义。\n\n#### 示例 11-4. 使用文件系统的 Rust 程序\n\n```\nuse std::fs;\n\
  use std::io::{Read, Write};\n\nfn main() {\n    let greeting = \"Hello, world!\"\
  ;\n    let outfile = \"hello.txt\";\n    let mut output_file = fs::File::create(outfile)\n\
  \        .expect(&format!(\"error creating {}\", outfile));\n\n    output_file.write_all(greeting.as_bytes())\n\
  \        .expect(&format!(\"Error writing: {}\", outfile));\n\n    let mut input_file\
  \ = fs::File::open(outfile)\n        .expect(&format!(\"error opening {}\", outfile));\n\
  \n    let mut input = String::new();\n    input_file.read_to_string(&mut input)\n\
  \        .expect(&format!(\"Error reading: {} \", outfile));\n\n    println!(\"\
  Read in from file: {}\", input);\n}\n```\n\n我将此代码放在另一个 cargo 驱动的项目中，因此生成原生可执行文件轻而易举。\n\
  \n```\nbrian@tweezer ~/g/w/s/c/hello-fs> cargo build --release\n    Finished release\
  \ [optimized] target(s) in 0.01s\nbrian@tweezer ~/g/w/s/c/hello-fs> cargo run --release\n\
  \    Finished release [optimized] target(s) in 0.01s\n    Running `target/release/hello-fs`\n\
  Read in from file: Hello, world!\nbrian@tweezer ~/g/w/s/c/hello-fs> ls -alF\ntotal\
  \ 32\ndrwxr-xr-x  10 brian  staff   320 Jun 27 13:18 ./\ndrwxr-xr-x  10 brian  staff\

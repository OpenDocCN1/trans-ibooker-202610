  \    │               ├── open-iconic.svg\n    │               ├── open-iconic.ttf\n\
  \    │               └── open-iconic.woff\n    ├── favicon.ico\n    ├── index.html\n\
  \    └── sample-data\n        └── weather.json\n\n在应用特定的文件和大量 .NET 依赖项之后，我们看到一个名为\
  \ wwwroot 的目录，它代表了各种资产和资源，这些资产和资源需要被提供以完成应用程序。这包括字体、一些示例 JSON 数据，以及应用程序的精简版 Bootstrap\
  \ 基础。\n\n我无法对 Razor 组件及其包含的所有内容进行详细的教程，但我想介绍应用程序的基础知识，以便你能够把握其功能。主视图存储在 Pages 目录中。共享布局存储在\
  \ Shared 目录中。示例 13-6 中显示的主应用程序文件位于主项目目录中的 App.razor。\n\n#### 示例 13-6. 在 Razor 中定义的高层级应用程序组件\n\
  \n```\n<Router AppAssembly=\"@typeof(Program).Assembly\" PreferExactMatches=\"@true\"\
  >\n    <Found Context=\"routeData\">\n        <RouteView RouteData=\"@routeData\"\
  \ DefaultLayout=\"@typeof(MainLayout)\" />\n    </Found>\n    <NotFound>\n     \
  \   <LayoutView Layout=\"@typeof(MainLayout)\">\n            <p>Sorry, there's nothing\
  \ at this address.</p>\n        </LayoutView>\n    </NotFound>\n</Router>\n```\n\
  \n这代表了应用程序的高层级细节，包括被标识为 MainLayout 的默认布局。如果它无法找到可用的布局，请注意它有一个默认消息。这是一个我们期望通过 HTTP\
  \ 提供服务的 SPA，因此我们需要一种将端点路由到页面的机制。我们很快就会看到这些细节。\n\n在示例 13-7 中，我们有来自 Shared/MainLayout.razor\
  \ 的默认布局。我们可以看到它继承自 LayoutComponentBase，并由侧边栏左侧的 <div> 元素中的 NavMenu 组成。这突出了 Razor\
  \ 组件混合了 C# 对象交互和 HTML 布局。它是一种有点奇怪的语法，但一旦你习惯了，就不会特别繁重。\n\n#### 示例 13-7. 默认布局是一个共享模板\n\
  \n```\n@inherits LayoutComponentBase\n\n<div class=\"page\">\n<div class=\"sidebar\"\
  >\n    <NavMenu />\n</div>\n\n<div class=\"main\">\n    <div class=\"top-row px-4\"\
  >\n        <a href=\"http://blazor.net\" target=\"_blank\" class=\"ml-md-auto\"\
  >About</a>\n    </div>\n\n    <div class=\"content px-4\">\n        @Body\n    </div>\n\
  </div>\n</div>\n```\n\n按照惯例，文件 *Index.razor* 包含着陆页，就像大多数网站由一个名为 *index.html* 的文件定义一样。在示例\
  \ 13-8 中，当默认路由被调用时，此组件的主体将被插入到 `MainLayout` 中的 `@Body` 位置。\n\n#### 示例 13-8. 默认路由指向\
  \ Pages 目录中的 Index.razor\n\n```\n@page \"/\"\n\n<h1>Hello, world!</h1>\n\nWelcome\
  \ to your new app.\n\n<SurveyPrompt Title=\"How is Blazor working for you?\" />\n\
  ```\n\n我们看到上面的第一个 `@page` 指令，它指示主应用程序将默认的 \"/\" HTTP 请求指向此渲染页面。我们还看到典型的友好问候以 HTML\
  \ 形式呈现，以及一个用于调查的嵌入组件。\n\n由于此页面及其资源需要通过 HTTP 提供，我们将使用以下命令启动它。\n\n```\nbrian@tweezer\
  \ ~/g/w/s/blazor-web> dotnet run\nBuilding...\ninfo: Microsoft.Hosting.Lifetime[0]\n\
  \      Now listening on: https://localhost:5001\n```\n\n```\ninfo: Microsoft.Hosting.Lifetime[0]\n\

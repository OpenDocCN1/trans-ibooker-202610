  \nHow the heck did this work!?! And if it was so easy, why did we have to wait until\
  \ the end of Chapter 5 to see it?\n\n让我向你展示来自示例 5-16 的 HTML 中的更多细节。有一个新的函数调用 get_memory()，它只是返回一个\
  \ Uint8Array 实例。解码器和编码器变量可用于在字符串的 UTF-8 表示之间进行转换¹²。有一个名为 charPtrToString() 的函数，它会将“字符指针”（即\
  \ C 字符串）转换为 JavaScript 可用的 UTF-8 字符串。\n\n更进一步我们有一个名为 printString() 的函数，它将使用要转储到控制台的\
  \ JavaScript 字符串进行调用。我们的 importObject 配置为在其中有一个名为 print_string 的方法，该方法会在调用方法将其转储到控制台之前将“字符指针”转换为字符串。importObject，你会回忆起，允许我们与模块实例共享功能和数据。\n\
  \n#### Example 5-16. Behind-the-scenes machinery to make Hello, World! work\n\n\
  ```\n<script>\nfunction get_memory() {\n  return new Uint8Array(wasm.instance.exports.memory.buffer);\n\
  }\n\nconst decoder = new TextDecoder(\"utf-8\");\nconst encoder = new TextEncoder(\"\
  utf-8\");\n\nfunction charPtrToString(str) {\nconst memory = get_memory();\nlet\
  \ length=0;\nfor (; memory[str + length] !== 0 ;++length) {}\nreturn decoder.decode(memory.subarray(str,\
  \ str + length));\n```\n\n\n\n\n\n```\n}\nlet printString = function(str) {\n  \
  \  console.log(str);\n};\n\nconst importObject = {\n    env: {\n        print_string:\
  \ function(str) {\n            printString(charPtrToString(str));\n        }\n \
  \   }\n};\n...\n</script>\n```\n\n这涵盖了 JavaScript 端。在 C/C++ 端，我们在示例 5-17 中看到 *nanolibC/libc_extra.h*\
  \ 头文件定义了一个名为 `print_string()` 的函数，它接受一个 `char *`。\n\n#### Example 5-17. Exposing\
  \ JavaScript functions as C functions.\n\n```\n#ifndef _NANOLIB_C_EXTRA_H\n#define\
  \ _NANOLIB_C_EXTRA_H\n\nextern \"C\" {\n    // Will be provided by Javascript.\n\
  \    void print_string(const char* str);\n}\n\n#endif\n```\n\n在 *nanolibC* 目录中有一个文件定义了我们的\
  \ `printf()` 实例。细节很复杂所以我不想深入，但我会指出它调用 `puts()` 来将 `char *` 输出到输出控制台。通常这是操作系统提供的低级服务，但根据你迄今为止所见，一旦我们在示例\
  \ 5-18 中连接最后一步，我们的 JavaScript 处理程序会将其路由到其控制台。\n\n#### Example 5-18. Exposing JavaScript\
  \ functions as C functions.\n\n```\nint puts ( const char * str ) {\n    print_string(str);\
  \ ①\n```\n\n```\nreturn 0;\n}\n```\n\n1 puts() 调用 JavaScript 函数并传入一个 char *。\n\n\
  终于，我们看到了这是如何工作的。我们的函数调用 printf()，printf() 调用 puts()，而 puts() 被定义为调用提供的函数。我现在不想描述它是如何连接的，但我希望结果仍然令人满意。关于使用\
  \ C/C++ 与 WebAssembly 还有更多需要了解的知识，但那是即将出版的章节的主题。在此之前，你已经跨越了理解 WebAssembly 背后工作原理的重要鸿沟。接下来我们将学习如何将现有软件移植到浏览器中运行。\n\

- "## 第 5 章. 使用 C/C++ 和 WebAssembly\n\n### 早期发布读者的注意\n\n使用 Early Release 电子书，你可以在这些标题的正式发布之前很久就利用这些技术——作者在写作时的原始未编辑内容，以便你可以在这些技术正式发布之前利用它们。\n\
  \n这将是最终书籍的第 5 章。\n\n如果你对我们如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系作者 wasmbook@bosatsu.net。\n\
  \n> *C 编程语言 — 一种将汇编语言的灵活性与汇编语言的强大功能相结合的语言。*\n> \n> —匿名\n\n这在我们的讨论中标志着一个转折点。迄今为止，我们一直完全专注于\
  \ WebAssembly 及其直接相关的工具和技术。如我们所见，这是一种探索平台提供的功能的有用方式，但这是一种低效的开发新软件的思考方式。更高级别的编程语言长期以来将我们的职业提升到了处理低级指令集的惯性细节之上。用语法清晰和语义丰富的语言表达逻辑简单得多，也更高效。\n\
  \n为了真正欣赏 WebAssembly 提供的功能，我们需要考虑其中一种编译为它的源语言。重点是并非每个问题都适合用 JavaScript 表达，因此拥有选项\n\
  \n\n\n使用另一种语言来提高性能、表达清晰度或简单地重用现有代码是很有吸引力的。\n\nC 语言¹ 是世界上最重要的、最广泛使用的编程语言之一。我在高中时就在我的\
  \ Atari ST 电脑上开始玩弄它。我在 *Computer Language* 杂志上读到过它，一位朋友给了我一本同名、开创性的书籍 *The C Programming\
  \ Language*，作者是 Brian Kernighan 和已故的、伟大的 Dennis Ritchie²。\n\nC 语言有大量的软件可用，其中很多只需重新编译即可移植到\
  \ WebAssembly。我们将在第 6 章讨论移植现有库，但现在我们将学习一些 C 语言，以及我们如何利用它来改进迄今为止尝试的一些工作。\n\n### 使用\
  \ C 函数\n\nC 函数在许多方面都类似于 JavaScript 函数。它有自己的词法结构，它不附加到类或结构体等更大的单元上。它可能接受参数，也可能不接受参数。它只能返回单个值并且不支持异常，因此错误处理通常比\
  \ C++、Java 或 JavaScript 更原始。\n\n在示例 5-1 中，有我们从第 2 章开始的年龄计算函数的 C 实现。注意它在说明正在发生的事情时要简单得多。这个示例甚至有一些基本的错误处理来处理出生年份大于当前年份的错误参数的情况。撇开来自未来的时间旅行访客的出现不谈，这不应该发生，我们应该处理它。更高层的语言只是对人类来说更容易用来表达业务需求的逻辑。\n\
  \n*Example 5-1. A simple C program.*\n\n```\n#include <stdio.h>\n\nint howOld(int\
  \ currentYear, int yearBorn) {\n\n    int retValue = -1;\n    \nif(yearBorn <= currentYear)\
  \ {\n    retValue = currentYear - yearBorn;\n}\n\nreturn retValue;\n}\n```\n\n```\n\
  int main() {\n    int age = howOld(2021, 2000);\n\n    if(age >= 0) {\n        printf(\"\
  You are %d!\\n\", age);\n    } else {\n        printf(\"You haven't been born yet.\"\
  );\n    }\n}\n```\n\n不幸的是，计算机不理解这些更高层的语言，所以我们需要将它们转换为二进制机器表示以供执行。如果你只做过 JavaScript\
  \ 编程，这个过程可能有点陌生。作为一种解释型语言，你编写 JavaScript 然后直接运行它。和所有事情一样，有取舍。开发人员方便的东西在运行时通常会显著变慢，而\
  \ C 和 C++ 长期以来一直主导着性能³。\n\n鉴于其成熟度和对我们行业的<|message|>重要性，有许多优秀的商业和开源 C 编译器。这包括 GNU/Linux\
  \ C 编译器 gcc 和 LLVM 的 clang 编译器。我们将重点关注后者，原因很快就会变得清晰。你需要按照附录 A 中所述安装 LLVM 才能运行以下内容。即使在默认使用\
  \ clang 的 macOS 上，如果没有安装 LLVM 的 WebAssembly 支持，也并非所有命令都能开箱即用。\n\n在最简单的形式中，我们可以按如下方式将\
  \ C 程序转换为可执行文件：\n\n```\nbrian@tweezer ~/g/w/s/ch05> clang howold.c\nbrian@tweezer\
  \ ~/g/w/s/ch05> ls -laF\ntotal 112\ndrwxr-xr-x  4 brian  staff  128 Feb 14 14:35\
  \ ./\ndrwxr-xr-x  6 brian  staff  192 Feb 14 14:32 ../\n```\n\n```\n-rwxr-xr-x \
  \ 1 brian  staff  49456 Feb 14 14:35 a.out*\n-rw-r--r--  1 brian  staff     343\
  \ Feb 14 14:36 howold.c\n```\n\n出于历史原因，生成的可执行文件称为 *a.out*。你稍后会看到如何更改它。现在，我们可以执行程序：\n\
  \n```\nbrian@tweezer ~/g/w/s/ch05> ./a.out\nYou are 21!\n```\n\n这之所以有效，是因为生成的可执行文件已被转换为\
  \ macOS 知道如何运行的合适格式。它是一个针对 64 位平台的 Intel x86 指令集的 *Mach-O* 可执行文件。\n\n```\nbrian@tweezer\
  \ ~/g/w/s/ch05> file a.out\na.out: Mach-O 64-bit executable x86_64\n```\n\n该程序无法在\
  \ Windows 或 Linux 机器上运行。在没有它们新的仿真层的情况下，它甚至无法在苹果新的基于 ARM 的机器上运行。这是因为 CPU 有一个指令集，涉及将值加载到寄存器中、在\
  \ CPU 上调用功能并将结果存储在内存中。重新运行 clang 以生成汇编语言输出而不是二进制可执行文件可以让你看到这对于该架构是什么样的：\n\n```\n\
  brian@tweezer ~/g/w/s/ch05> clang -S howold.c\n```\n\n这会生成示例 5-2 中所示的文件。\n\n####\
  \ Example 5-2. Assembly language generated for our simple application\n\n```\n.section\
  \    __TEXT,__text,regular,pure_instructions\n.build_version macos, 11, 0      sdk_version\
  \ 11, 1\n.globl  _howOld                 ## -- Begin function howOld\n.p2align \
  \       4, 0x90\n_howOld:                        ## @howOld\n.cfi_startproc\n####\
  \ %bb.0:\n    pushq   %rbp\n.cfi_def_cfa_offset 16\n.cfi_offset %rbp, -16\nmovq\
  \    %rsp, %rbp\n```\n\n```\n.cfi_def_cfa_register %rbp\nmovl    %edi, -4(%rbp)\n\
  movl    %esi, -8(%rbp)\nmovl    $-1, -12(%rbp)\nmovl    -4(%rbp), %eax\ncmpl   \
  \ -8(%rbp), %eax\njg      LBB0_2\n#### %bb.1:\nmovl    -8(%rbp), %eax\nsubl    -4(%rbp),\
  \ %eax\nmovl    %eax, -12(%rbp)\nLBB0_2:\nmovl    -12(%rbp), %eax\npopq    %rbp\n\
  retq\n.cfi_endproc\n#### -- End function\n.globl _main                ## -- Begin\
  \ function main\n.p2align 4, 0x90\n_main:                      ## @main\n.cfi_startproc\n\
  #### %bb.0:\npushq   %rbp\n.cfi_def_cfa_offset 16\n.cfi_offset %rbp, -16\nmovq \
  \   %rsp, %rbp\n.cfi_def_cfa_register %rbp\nsubq    $16, %rsp\nmovl    $0, -4(%rbp)\n\
  movl    $2000, %edi         ## imm = 0x7D0\nmovl    $2021, %esi         ## imm =\
  \ 0x7E5\ncallq   _howOld\nmovl    %eax, -8(%rbp)\ncmpl    $0, -8(%rbp)\njl     \
  \ LBB1_2\n#### %bb.1:\nmovl    -8(%rbp), %esi\nleaq    L_.str(%rip), %rdi\nmovb\
  \    $0, %al\ncallq   _printf\njmp     LBB1_3\nLBB1_2:\nleaq    L_.str.1(%rip),\
  \ %rdi\nmovb    $0, %al\ncallq   _printf\nLBB1_3:\nmovl    -4(%rbp), %eax\naddq\
  \    $16, %rsp\n```\n\n```\npopq    %rbp\nretq\n.cfi_endproc\n#### -- End function\n\
  .section    __TEXT,__cstring,cstring_literals\nL_.str:\n#### @.str\n.asciz  \"You\
  \ are %d\\n!\"\nL_.str.1:\n#### @.str.1\n.asciz  \"You haven't been born yet.\"\n\
  .subsections_via_symbols\n```\n\n正如你所见，它比我们的 C 程序冗长得多。诸如函数调用、循环和条件检查等高级构造需要许多低级指令来表达。我们需要一个实际的\
  \ Intel x86 芯片来运行，或者至少是一个仿真的芯片。在某种程度上，这在概念上与我们在前几章中看到的 Wat 文件相似。\n\n我们之所以讨论 clang\
  \ 作为示例 C 编译器，是因为它基于 LLVM 项目，具有现代、可插拔的架构⁴。这在现代世界中竞争指令集数量不断增加的情况下非常重要，例如 X86、ARM、RISC-V，新的编程语言不断出现，例如\
  \ Rust、Julia、Swift，以及总体上希望无论源语言如何都能重用通用优化的愿望。\n\n在图 5-1 中，你可以看到这是一个三部分的过程。源代码由前端处理步骤解析。这将是特定于语言的。该步骤的输出是中间表示\
  \ IR，即一种假设但不存在的机器的指令集。它以可以由优化层操作的形式捕获所表达的逻辑。该过程涉及应用一个或多个转换，这些转换应具有使代码更快或更高效的效果，纯粹基于所表达的逻辑。循环可能会被展开⁵，未使用的代码可能会被消除，涉及常量的表达式可能会由编译器求值，因此它们无需在运行时求值，等等。最后一步发出针对特定运行时的本地指令集。就我们的目的而言，这显然是\
  \ Mach-O x86 64 位架构。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_97_0.png)\n\nFigure\
  \ 5-1. The LLVM pluggable compiler architecture\n\n这些层中的任何一个都可以被其他东西替换。如上所述，Rust、Julia\
  \ 和 Swift 等语言使用 LLVM 基础设施。这可以防止语言作者每次都从头开始。他们需要编写新的前端解析器，但可以利用现有的优化和后端工作。编译器研究人员可以开发新的优化，并在将其用于任意输入语言的\
  \ IR 之前在隔离环境中对其进行测试。就我们的目的而言，后端是最重要的可交换层。在 Linux 或 Windows 上，可以使用相同的最初两个层，但也会有机器特定的后端。\n\
  \n你通常可以通过一种称为交叉编译的过程生成与计算机本机运行时不同的后端。这对于定位可能未安装开发工具链的嵌入式系统很有用。这在持续集成和交付系统中也很实用，这样你就可以从同一个构建环境中定位多个平台。否则你可能需要为每个目标平台准备一个单独的构建环境。\n\
  \nEmscripten 工具链是为 asm.js 工作而开发的，并且基于 LLVM 和 clang，因此它只需要发出可优化的 JavaScript 子集，以便\
  \ C 程序可以在浏览器中运行。当 WebAssembly 指令集和平台最终被定义时，本质上，他们只需添加一个 WebAssembly 后端来发出它即可。我们将在下一章介绍该工具链，但希望你已经了解了更高层语言如何被编译\n\
  \n\n转换为可以进一步转换为高效原生表示的通用形式。\n\n我们的 LLVM 安装应原生支持 WebAssembly 作为后端。为双重检查，尝试以下操作：\n\

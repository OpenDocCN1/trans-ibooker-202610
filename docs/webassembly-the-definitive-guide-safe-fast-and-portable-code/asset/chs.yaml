  \ EARLY RELEASE READERS\n\n对于早期发布的电子书，你可以在作者撰写时获得书籍的最早形式——作者的原始未编辑内容，以便你可以在这些技术正式发布之前利用它们。\n\
  \n这将是最终书籍的第 6 章。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系作者 wasmbook@bosatsu.net。\n\
  \n> 无论你走到哪里，那里都有你。\n\n—Buckaroo Banzai\n\n是时候更仔细地审视在浏览器中调用 C/C++ 代码的过程了。这些语言中的大多数代码从未打算以下载的形式在浏览器中运行。但正如香港骑士队¹的队长在上面的引语中告诉我们的，有时你会发现自己身处意想不到的新地方，但仍然只是你自己在那里。\n\
  \n我们出于各种原因对这样做感兴趣。取代 JavaScript 不是其中之一。至少对大多数人来说不是。相反，我们在外面的 C 和 C++ 等语言中拥有庞大的遗留代码库。其中很多非常有用，能够在我们的\
  \ Web 应用程序中访问它们将会很棒。其中一些可能将组织绑定到遗留系统。通过浏览器分发这些代码将是一个巨大的进步！\n\n此外，简单地用 JavaScript\
  \ 编写并不适合的一些问题。能够在不要求单独运行时机的情况下用另一种语言编写应用程序的该部分是非常有吸引力的。而且，正如我们的最终示例所示，让受信任来源提供的受信任代码为加密算法等敏感和棘手的软件提供出处具有真正的价值。能够简单地重新编译你认识的人编写的现有代码，并且他们知道自己在做什么，这也是一种有用的能力。\n\
  \n在上一章中，我们展示了使用像 clang 这样的常规 WebAssembly 启用的 C 编译器以及一些头文件和库依赖管理来实现基本集成是可能的。然而，手动提供我们自己的标准库版本并将\
  \ C 代码链接到提供的 JavaScript 很快就会变得过时。\n\n幸运的是，Emscripten 项目已经为使这个过程比它可能更简单奠定了基础。这并不令人惊讶，因为其主要开发者\
  \ Alon Zakai 和 Luke Wagner 在从 asm.js 开始的工作中一直处于领先地位，扩展到 WebAssembly MVP 以及至今仍在进行的规范改进。Emscripten²\
  \ 工具链在旅程的大部分时间里都在那里。\n\n该项目基于 LLVM 平台。在前面的章节中，我指出它最初有一个自定义后端，发出 asm.js 的可优化 JavaScript\
  \ 子集。一旦 WebAssembly 平台被定义，一个新的后端就能够发出 Wasm 二进制文件。\n\n不幸的是，这只是解决方案的一部分。还需要支持将数据输入和输出内存、链接模块、包装现有库等。提供用户界面的\
  \ C 程序或监听网络请求的程序通常在响应输入活动的相当紧密的循环中旋转。鉴于浏览器默认是单线程环境，这种主循环将存在操作不匹配。Emscripten 工具链已被修改以解决将原生\
  \ C/C++ 移植到我们的 Web 环境中运行时可能出现的许多类型问题。与大多数主题一样，这不能是对该项目所做的一切的全面介绍，但我会尝试快速让你入门。\n\n\
  ### Proper “Hello, World!”\n\n所以，首先一个坦白：我们本可以在第 2 章就拥有一个在浏览器中工作的、未修改的“Hello, World!”示例。最后一次，我们将在示例\
  \ 6-1 中向你展示代码。\n\n#### Example 6-1. The typical “Hello, World!” program as expressed\
  \ in C.\n\n```\n#include <stdio.h>\n\nint main() {\n    printf(\"Hello, World!\\\
  n\");\n    return 0;\n}\n```\n\n使用 Emscripten C 编译器（安装说明可在附录 A 中找到），我们只需要告诉它编译 C\
  \ 代码并生成一些 JavaScript 脚手架。之后它在 Node.js 中未修改运行。\n\n```\nbrian@tweezer ~/g/w/s/ch06>\
  \ emcc hello.c -o hello.js\nbrian@tweezer ~/g/w/s/ch06> ls -laF\ntotal 520\ndrwxr-xr-x\
  \  7 brian  staff     224 Mar  1 14:45 ./\ndrwxr-xr-x  7 brian  staff     224 Mar\
  \  1 13:02 ../\n-rw-r--r--  1 brian  staff  121457 Mar  1 13:05 bootstrap.min.css\n\
  -rw-r--r--  1 brian  staff      76 Mar  1 13:02 hello.c\n-rw-r--r--  1 brian  staff\
  \     388 Mar  1 13:07 hello.html\n-rw-r--r--  1 brian  staff  121686 Mar  1 14:45\
  \ hello.js\n-rwxr-xr-x  1 brian  staff   11711 Mar  1 14:45 hello.wasm*\nbrian@tweezer\
  \ ~/g/w/s/ch06> node hello.js\nHello, World!\n```\n\n示例 6-2 中的 HTML 文件不是通过此过程生成的，并且与我们之前看到的有\
  \ suspiciously 不同。有一个单一的 <script> 元素加载我们生成的 JavaScript。我们没有使用到目前为止使用的 utils.js 文件。相反，我们有一个更长的\n\
  \n\n\n上一条命令生成的 JavaScript 文件。看看那个文件列表！它超过 120 千字节！它有超过 2,000 行代码。如果你查看它，你可能会很快迷失方向。这就是为什么我在前几章中不想从那里开始的原因。\n\
  \n#### 示例 6-2. 与我们之前看到的截然不同的 HTML 文件。\n\n```\n<!doctype html>\n<html lang=\"en\"\
  >\n    <head>\n        <meta charset=\"utf-8\">\n        <link rel=\"stylesheet\"\
  \ href=\"bootstrap.min.css\">\n        <title>Hello, World!</title>\n    </head>\n\
  \    <body>\n        <div class=\"container\">\n            <h1>Hello, World!</h1>\n\
  \        </div>\n        <script src=\"hello.js\"></script>\n    </body>\n</html>\n\
  ```\n\n然而，如果我们通过 HTTP 提供此目录，打开浏览器并打开 JavaScript 控制台，你会看到与图 6-1 非常相似的内容。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_127_0.png)\n\
  \n图 6-1. 你被告知不可能的 Hello, World。\n\n如果你在文件 hello.wasm 上使用 wasm-objdump 命令，你会注意到有一个导出的\
  \ main() 函数。生成的代码已经超出了我们能够展示整个文件的能力，因此我将只突出显示导出部分。\n\n```\n...\nExport[13]:\n  -\
  \ memory[0] -> \"memory\"\n  - func[3] <__wasm_call_ctors> -> \"__wasm_call_ctors\"\
  \n  - func[5] <main> -> \"main\"\n  - func[6] <__errno_location> -> \"__errno_location\"\
  \n  - func[50] <fflush> -> \"fflush\"\n  - func[47] <stackSave> -> \"stackSave\"\
  \n  - func[48] <stackRestore> -> \"stackRestore\"\n  - func[49] <stackAlloc> ->\
  \ \"stackAlloc\"\n  - func[44] <emscripten_stack_init> -> \"emscripten_stack_init\"\
  \n  - func[45] <emscripten_stack_get_free> -> \"emscripten_stack_get_free\"\n  -\
  \ func[46] <emscripten_stack_get_end> -> \"emscripten_stack_get_end\"\n  - table[0]\
  \ -> \"__indirect_function_table\"\n```\n\n```\n- func[53] <dynCall_jiji> -> \"\
  dynCall_jiji\"\n...\n```\n\n你会看到这里有相当多的生成的脚手架来使这一切工作。细节相当复杂，但如果你想追踪它，我建议使用 wasm2wat\
  \ 生成相应的 Wat 文件。从那里，追踪 main() 函数（上面编号为 5）。你会看到类似示例 6-3 的内容。\n\n#### 示例 6-3. Wat 中的\
  \ main 方法。\n\n```\n...\n(func (;5;) (type 5) (param i32 i32) (result i32)\n  (local\
  \ i32)\n  call 4\n  local.set 2\n  local.get 2\n  return)\n...\n```\n\n最终你会回到生成的\
  \ JavaScript 文件。在其中有一个名为 fd_write 的函数，如示例 6-4 所示。这被添加到一个名为 wasi_snapshot_preview1\
  \ 的命名空间中。正如名称所暗示的，这是一个预览，我们将在后面的讨论中介绍，但主要目的是 Emscripten 工具链正在生成代码来解决我们在前几章中看到的一些低级麻烦。我们将在第\
  \ 10 章中 Rust 生态系统中发现类似的工具。\n\n#### 示例 6-4. printf 解决方案的一部分。\n\n```\n...\nfunction\
  \ _fd_write(fd, iov, iovcnt, pnum) {\n  // hack to support printf in SYSCALLS_REQUIRE_FILESYSTEM=0\n\
  \  var num = 0;\n  for (var i = 0; i < iovcnt; i++) {\n    var ptr = HEAP32[(((iov)+(i*8))>>2)];\n\
  \    var len = HEAP32[(((iov)+(i*8 + 4))>>2)];\n    for (var j = 0; j < len; j++)\
  \ {\n      SYSCALLS.printChar(fd, HEAPU8[ptr+j]);\n    }\n    num += len;\n  }\n\
  \  HEAP32[((pnum)>>2)] = num\n  return 0;\n```\n\n}\n...\n\n完全没有必要深入细节来了解所有这些是如何工作的。重要的是你要理解，我们实际上并不是以典型的标准库意义上调用\
  \ printf()，而是该函数已被重写为调用生成的代码。在浏览器中，它会将字符路由到与开发者工具关联的 JavaScript 控制台。在 Node.js 环境中，它会被路由到底层系统控制台。在这个阶段重要的是，我们的遗留应用程序不需要更改即可在此新环境中运行，但我们也不必担心直接运行原生\
  \ C 和 C++ 的可怕前景。我们在可移植性、安全性和性能之间取得了关键平衡，这正是 WebAssembly 的全部意义所在。\n\n生成的代码在 JavaScript\
  \ 中有一个 Module 对象，它定义了我们的 WebAssembly 代码将占据的运行时环境。JavaScript 文件顶部有注释描述了该对象及其作为两个世界之间接口的作用。为了保持可管理性，我们将专注于其中的一个更小部分。\n\
  \n我们可用的选项之一是使用编译器指令来打开或抑制某些生成的行为。例如，我们可能不希望我们的 C 程序在 JavaScript 代码加载时立即运行。如果你尝试在不使用\
  \ INVOKE_RUN=0 指令的情况下编译，你会看到与上面相同的典型问候。在下面的片段中，注意当代码在 Node.js 中加载时，命令行上没有打印任何内容。\n\
  \n```\nbrian@tweezer ~/g/w/s/ch06> emcc hello.c -o hello.js -s INVOKE_RUN=0\nbrian@tweezer\
  \ ~/g/w/s/ch06> node hello.js\nbrian@tweezer ~/g/w/s/ch06>\n```\n\n显然，如果你抑制了自动执行，你将希望能够指示应用程序何时可以执行。这可以用另一个指令完成。\n\
  \n```\nbrian@tweezer ~/g/w/s/ch06> emcc hello.c -o hello.js ↵\n-s INVOKE_RUN=0 -s\
  \ EXTRA_EXPORTED_RUNTIME_METHODS=\"\n['callMain']\"\n```\n\n在示例 6-5 中，你可以看到我们在按钮点击时调用\
  \ main() 函数。\n\n#### 示例 6-5. 延迟的 main() 方法调用\n\n```\n<!doctype html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <link rel=\"stylesheet\" href=\"\
  bootstrap.min.css\">\n    <title>Hello, World!</title>\n  </head>\n  <body>\n  \
  \  <div class=\"container\">\n      <h1>Hello, World!</h1>\n      <button id=\"\
  press\">Press Me</button>\n    </div>\n    <script src=\"hello.js\"></script>\n\
  \    <script>\n      var button = document.getElementById(\"press\");\n      button.onclick\
  \ = function() {\n        try {\n          Module.callMain();\n        } catch(re)\
  \ {\n        }\n      };\n    </script>\n  </body>\n</html>\n```\n\n在图 6-2 中，友好的消息在按钮被按下时打印到控制台。Firefox\
  \ 不会显示每个相同的消息，但它显示我已在右侧按下了按钮七次。你的浏览器可能在每次调用时显示一条打印消息。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_131_0.png)\n\
  \n图 6-2. 按下按钮触发的 Hello, World\n\n### 移植第三方代码\n\n我们现在将深入研究将一些现有代码带入浏览器。这段代码从未打算在网络上运行，并且做了你通常不期望在浏览器中工作的事情，例如写入文件系统。不要担心，我们不会破坏浏览器安全模型，但你会看到这段\
  \ C++ 代码如何基本未经修改即可运行。\n\nEmscripten 有大量的选项可以将第三方代码移植到 WebAssembly。有效地有 cc、make 和\
  \ configure 的即插即用替代品，这通常使移植过程变得微不足道。实际上，你可能需要处理遇到的各种问题，但你可能会惊讶于过程的简易性。项目的网站³ 有很好的文档来帮助你。我的最爱介绍这个主题的资料是\
  \ Robert Aboukhalil 的精彩 Level Up With WebAssembly⁴ 资料。他带你逐步移植几个不同的开源项目到 WebAssembly\
  \ 以在浏览器中运行\n\n它们包括 Tetris、Pong 和 Pacman 等游戏。与其尝试重现他已经出色完成的工作，我将专注于一个相对简单且干净的项目。\n\
  \n我花了一些时间寻找合适的候选代码。我想要一些有分量但不过于庞大的东西。最终我找到了 Arash Partow 在其网站 https://www.partow.net\
  \ 上收集的优雅、干净、许可合适且有用的 C++ 代码。如果你去那里，你会发现很多有趣的材料。我最初打算使用计算几何库，但决定 Bitmap 库更适合像这样的书。\n\
  \n首先，从 http://www.partow.net/programming/bitmap/index.html 获取代码。一旦你下载 Zip 文件并解压缩，你会看到三个文件。Makefile\
  \ 是一个老式的 Unix 构建文件，其中包含组装相关软件的说明。我们稍后会探索该过程。bitmap_image.hpp 文件是主要库，而 bitmap_test.cpp\
  \ 是一个全面的测试集合，生成大量有趣的 Windows 位图图像。此代码不需要任何平台特定的库。\n\n```\nbrian@tweezer ~/g/w/s/c/bitmap>\
  \ ls -alF\ntotal 536\ndrwxr-xr-x@  5 brian  staff       160 Dec 31  1999 ./\ndrwxr-xr-x\
  \  11 brian  staff       352 Mar  6 13:56 ../\n-rw-r--r--@  1 brian  staff     \
  \  770 Dec 31  1999 Makefile\n-rw-r--r--@  1 brian  staff    247721 Dec 31  1999\
  \ bitmap_image.hpp\n-rw-r--r--@  1 brian  staff     20479 Dec 31  1999 bitmap_test.cpp\n\
  ```\n\n我已为节省空间删除了示例 6-6 中的一些注释和许可细节。剩下的内容是构建测试应用 bitmap_test 的规则结构。Makefile 通过建立目标、依赖项以及构建目标的规则来工作。作为惯例，通常有一个\
  \ all 规则，它指定上面提到的目标文件名。它依赖于 .cpp 和 .hpp 文件。如果任一文件被修改，我们的可执行文件需要重建。为此，make 工具将执行文件\n\
  \n\n\n在 COMPILER 变量中使用 OPTIONS 变量中的选项。作为 C/C++ 程序，它还需要链接 LINKER_OPT 变量中指定的库。在本例中，我们希望链接到标准\
  \ C++ 库和一组基本的数学函数。这在库方面已经是相当独立的了。clean 目标只是删除派生结果。\n\n#### MAKEFILE TIP\n\n*Makefiles\
  \ 通常对空格与制表符敏感。请确保使用制表符来开始缩进的规则行。书中仓库里的代码就是这样做的，但如果你以任何方式修改它，你需要确保使用制表符。*\n\n####\
  \ Example 6-6. Makefile for our test program\n\n```\nCOMPILER      = -c++\nOPTIONS\
  \       = -ansi -pedantic-errors -Wall -Wall -Werror -Wextra -o\nLINKER_OPT    =\
  \ -L/usr/lib -lstdc++ -lm\n\nall: bitmap_test\n\nbitmap_test: bitmap_test.cpp bitmap_image.hpp\n\
  \t$(COMPILER) $(OPTIONS) bitmap_test bitmap_test.cpp\n\t$(LINKER_OPT)\n\nclean:\n\
  \trm -f core *.o *.bak *stackdump *~\n```\n\n只要你安装了可用的 C++ 环境，你就应该能够构建测试程序。\n\n\
  ```\nbrian@tweezer ~/g/w/s/c/bitmap> make\nc++ -ansi -pedantic-errors -Wall -Wall\
  \ -Werror -Wextra -o\nbitmap_test bitmap_test.cpp ↵\n    -L/usr/lib -lstdc++ -lm\n\
  brian@tweezer ~/g/w/s/c/bitmap> ls -alF\ntotal 944\ndrwxr-xr-x@   6 brian  staff\
  \      192 Mar   6 14:35 ./\ndrwxr-xr-x   11 brian  staff      352 Mar   6 13:56\
  \ ../\n-rw-r--r--@   1 brian  staff      770 Dec 31  1999 Makefile\n```\n```\n-rw-r--r--@\
  \  1 brian  staff  247721 Dec 31  1999 bitmap_image.hpp\n-rw-xr-xr-x  1 brian  staff\
  \  205032 Mar  6 14:35 bitmap_test*\n-rw-r--r--@   1 brian  staff  20479 Dec 31\
  \  1999 bitmap_test.cpp\n```\n\n现在此测试程序需要在当前目录中有一个示例 *image.bmp* 文件。我在网上找到了一个并以该名称放入。运行命令后，你将得到大量生成的图像，如图\
  \ 6-3 所示。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_134_0.png)\n\nFigure 6-3.\
  \ The images generated by the bitmap_test executable\n\n好吧，它能工作。代码很干净。我不会教你 C++\
  \ 或带你逐步了解代码，但我会向你展示一些可供尝试的工作示例，而不必完全理解正在发生的事情。\n\n首先，我们需要修改 *Makefile* 以使用 Emscripten\
  \ 编译器，而不是你用来构建测试程序的编译器。这只需按 Example 6-7 所示更新 COMPILER 变量即可。\n\n#### Example 6-7.\
  \ Updating the Makefile for our test program to build with Emscripten\n\n```\n...\n\
  COMPILER    = -em++\n```\n\nMakefile 的 clean 步骤不会删除可执行文件。因此，手动删除 bitmap_test（或更好的是，修改\
  \ Makefile！）然后重新运行 make。你应该会看到类似以下的内容。\n\n```\nbrian@tweezer ~/g/w/s/c/bitmap> make\n\
  em++ -ansi -pedantic-errors -Wall -Wall -Werror -Wextra -o bitmap_test ←\n    bitmap_test.cpp\
  \ -L/usr/lib -lstdc++ -lm\nbrian@tweezer ~/g/w/s/c/bitmap> ls -alF\ntotal 1848\n\
  drwxr-xr-x@   8 brian  staff     256 Mar   6 15:21 ./\ndrwxr-xr-x   12 brian  staff\
  \     384 Mar   6 14:47 ../\n-rw-r--r--@   1 brian  staff     771 Mar   6 15:20\
  \ Makefile\n-rw-r--r--@   1 brian  staff  247721 Dec  31  1999 bitmap_image.hpp\n\
  -rw-r--r--   1 brian  staff  248314 Mar   6 15:21 bitmap_test\n-rw-r--r--@   1 brian\
  \  staff   20479 Dec  31  1999 bitmap_test.cpp\n-rwxr-xr-x    1 brian  staff  296743\
  \ Mar   6 15:21 bitmap_test.wasm*\n-rw-r--r--@   1 brian  staff  120054 Mar   6\
  \ 14:39 image.bmp\n```\n\n嗯。那很容易。可惜我们还没有完全完成。虽然它编译了，但由于多种原因它不会工作。第一个原因是库期望能够写入文件系统。很明显这是不可能的。然而，有一个非常酷的文件系统抽象，它写入本地存储，通过添加编译器指令即可使用。现在，就像处理\
  \ printf() 调用一样，Emscripten 工具链将模拟一个文件系统。你可以通过在 Makefile 中添加指令 -s FORCE_FILESYSTEM=1\
  \ 来解锁此支持。我将在下面展示最终形式。\n\n第二个问题是默认生成的 Memory 实例不允许增长。如果我们期望此库在内存中生成相当大的图像，它就需要能够请求足够的内存。因此，我们可以使用另一个指令来允许此操作。这是我在第\
  \ 4 章中向你展示如何手动完成的事情。这是 Emscripten 可以为我们处理的细节。为了更好地控制过程，我们将告诉 Emscripten 不要自动执行\n\
  \n程序并导出 main() 方法，以便我们可以在需要时调用它。因为我们没有生成独立的二进制文件，我们还希望告诉 Emscripten 编译器生成一个名为 bitmap_test.js\
  \ 的 JavaScript 文件。bitmap_test 规则的命令现在应如下所示。\n\n> MAKEFILE TIP\n> 在下面的代码中，我用回车字符（↩）表示行续行，以便命令适合页面。不要输入这些，只需在文件中继续该行。\n\
  \n#### Example 6-8. Modified Makefile with all of our Emscripten options\n\n```\n\

- "## Chapter 2. “Hello, World!” (Sort of)\n\n### A NOTE FOR EARLY RELEASE READERS\n\
  \nWith Early Release ebooks, you get books in their earliest form—the author’s raw\
  \ and unedited content as they write—so you can take advantage of these technologies\
  \ long before the official release of these titles.\n\nThis will be the 2nd chapter\
  \ of the final book.\n\nIf you have comments about how we might improve the content\
  \ and/or examples in this book, or if you notice missing material within this chapter,\
  \ please reach out to the author at wasmbook@bosatsu.net.\n\n> How does it, um--\
  \ how does it work?\n> —King Arthur\n\nPart of the difficulty in teaching people\
  \ about WebAssembly is that there are many places to start. If they are a C/C++\
  \ developer, that might be a reasonable place to start the frame the discussion.\
  \ If they are a Rust developer, that would be. But you can also talk about the mechanics\
  \ of WebAssembly independent of the languages you use to generate it. In this chapter,\
  \ I am going take that approach. We are going to learn low-level details incrementally\
  \ over the next few chapters before we start to build up to the connection to higher\
  \ level languages. These details will seem simplistic and confounding initially,\
  \ but we are looking at the basic mechanisms which is ultimately not where you will\
  \ be working. Let’s begin by considering why we cannot start where most programming\
  \ books do.\n\nIn Chapter 1, I introduced the first program most people write in\
  \ a new programming language or technology when I discussed asm.js. We call that\n\
  \nprogram a “Hello, World!” example in a nod to the first program used in Kernighan\
  \ and Ritchie’s seminal book, *The C Programming Language*. Many quality programming\
  \ books¹ begin with that example because it gives the reader a taste of what is\
  \ going on without delving too far down into the details. It is fun, empowering\
  \ and a good way to make sure the reader has her tools set up correctly.\n\n###\
  \ Example 2-1. The typical “Hello, World!” program as expressed in C.\n\n```\n#include\
  \ <stdio.h>\n\nint main() {\n    printf(\"Hello, World!\\n\");\n    return 0;\n\
  }\n```\n\nUnfortunately, WebAssembly has no way of printing to the console, so we\
  \ cannot start that way.\n\nWait, what?\n\nI will give you a moment to digest that\
  \ sentence, perhaps re-reading it a few times to make sure it says what you think\
  \ it says.\n\nConvinced? Confused?\n\nYes, it is fair to say that there is no way\
  \ for WebAssembly to print to the console, read a file or open a network connection…\
  \ unless you give it a way to do so.\n\nIf you examine Example 2-1, you will get\
  \ a hint about what the issue is. In order for that program to work, it needs a\
  \ working copy of the printf() function which can be found in the standard library.\
  \ Part of what makes C programs so portable, is the existence of standard libraries\
  \ such as this on a variety of platforms. So-called *Portable Operating System Interface\
  \ (POSIX)*² libraries extend these common features beyond printing to the console\
  \ to include file manipulation, signal handling, message passing and more. An application\
  \ will write to an API such as POSIX, but the executable will need either a static\
  \ or a dynamic library that provides the behavior of the invoked methods suitable\
  \ for running in the target platform.\n\nThis will be in the native executable format\
  \ for the operating system you are planning to use.\n\nThis is why I say that WebAssembly\
  \ makes code portable, but we will need something else to help us make applications\
  \ portable. We will revisit this topic throughout the book, but for now it is enough\
  \ for you to know that there is no direct way for WebAssembly to write to the console.\n\
  \nI promise you we will honor Kernighan and Ritchie in Chapter 5 by running that\
  \ exact program. First, however, we are going to learn about a human-friendly format\
  \ for WebAssembly and how the low-level instructions interact with the stack machine.\
  \ I still want you to have a “Hello, World!” experience here, however, so we will\
  \ pick something else to write and run that is not too challenging but still legitimate.\
  \ It is “Hello, World!” (sort of).\n\n## WebAssembly Text Format (Wat)\n\nWe have\
  \ mentioned that the binary format (Wasm) is designed to make it faster to transfer,\
  \ load and verify WebAssembly modules. We will introduce modules more formally in\
  \ Chapter 3, but for now just think of them as units of deployment like libraries\
  \ or Jar files in Java. There is also a text format that describes the behavior\
  \ of a module that is easier for humans to read. While there is nothing stopping\
  \ you from writing code in the text format by hand, you are unlikely to do so. This\
  \ format is sometimes also referred to as Wast in writing but that was the original\
  \ name. Many tools support both flavors and people often confuse the two. We will\
  \ stick with Wat and its suffix of .wat.\n\nIn Example 2-2 we see a fully-formed,\
  \ valid Wasm module expressed in Wat. This Lisp-like format has functions expressed\
  \ via their signatures and a collection of stack machine instructions. The WebAssembly\
  \ abstract machine is a virtual stack machine, a concept I will explain further\
  \ below. Most compiled software is turned into the executable format of a particular\
  \ hardware architecture. If you are targeting an Intel x86 machine, the behavior\
  \ will be converted from a high level language into a series of instructions that\
  \ will run on that chip. Without some kind of emulator, it\n\nwill not run anywhere\
  \ else. Platforms such as Java and .NET have an intermediate byte code representation\
  \ that will be interpreted by a runtime environment that has been ported to various\
  \ platforms. WebAssembly instructions are more like that, but involve manipulation\
  \ of a stack through a small set of instructions. Ultimately, these instructions\
  \ will be mapped to a particular chip’s instructions when it executes in a WebAssembly\
  \ host.\n\n### Example 2-2. A simple WebAssembly text file.\n\n```\n(module\n  \
  \  (func $how_old (param $year_now i32) (param $year_born i32)\n    (result i32)\
  \ ①\n        get_local $year_now\n        get_local $year_born\n        i32.sub)\n\
  \    (export \"how_old\" (func $how_old)) ②\n)\n```\n\n① The internal function $how_old\n\
  \n② The exported function how_old\n\nThe function shown here is called $how_old\
  \ and it is not visible outside of this module until we explicitly export it. Note\
  \ the name distinction. The internal name starts with a $. The exported version\
  \ does not. It simply executes the inner function if someone calls it externally.\n\
  \nThis module has one function defined that takes two integer parameters and returns\
  \ another integer. As defined in the Minimum Viable Product (MVP) 3, WebAssembly\
  \ is a 32-bit environment. That restriction is being relaxed over time as you will\
  \ see. By the time this book is available, it is likely that 64-bit Wasm environments\
  \ will be available in some form. That being said, WebAssembly supports 32- and\
  \ 64-bit integers (known as i32 and i64) and 32- and 64-bit floating point numbers\
  \ (known as f32 and f64). That is it.\n\nAt this level, there are no strings, objects,\

  Swarm announcing /ip4/192.168.1.169/tcp/4001\nSwarm announcing /ip4/192.168.1.169/udp/4001/quic\n\
  Swarm announcing /ip6/::1/tcp/4001\nSwarm announcing /ip6/::1/udp/4001/quic\nAPI\
  \ server listening on /ip4/127.0.0.1/tcp/5001\nWebUI: http://127.0.0.1:5001/webui\n\
  Gateway (readonly) server listening on /ip4/127.0.0.1/tcp/8000\nDaemon is ready\n\
  ```\n\n这些看起来很奇怪的标识符展示了上面提到的 Multiformats 的强大之处。这些是自描述的网络引用。我们有守护进程用于与同伴通信的各种端口和协议。我们有它监听的端口、它绑定的\
  \ IP 地址（例如 localhost 或其他接口）、其网络类型（即 ip4 与 ip6）以及用于与我们的节点通信的首选传输方式。注意 TCP 与 QUIC\
  \ over UDP 之间的区别。这是一个极其强大的思想，它在整个技术栈中支持弹性、简单的交互模型和可扩展性。\n\n守护进程会通过 DNS 查找引导节点。它可以使用多播\
  \ DNS（mDNS）在同一网络上查找其他节点。有很多方式可以与外界通信。但是，几分钟后，你可以通过以下方式查明它正在与谁通信。我省略了大量结果，但我们可以看到对等方的\
  \ Multiformat 网络引用，包括它们的节点身份以及与之通信的首选方式。\n\n```\nbrian@tweezer ~/s/ipfs> ipfs swarm\
  \ peers\n/ip4/1.170.45.218/tcp/44262/p2p/QmbsXKVDhxFDgZW6zxrGfgPjXopvhNmGFqqqazv1kyZLkv\n\

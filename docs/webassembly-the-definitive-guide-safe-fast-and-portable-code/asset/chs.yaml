  \n![](img/16b7990eb0dbf589db177bdbd2f4a189_219_0.png)\n\nFigure 10-4. Native execution\
  \ of the egui Demo App\n\n当您运行上述演示时执行的代码（src/main.rs）如示例 10-14 所示（我删除了一些配置代码以抑制警告）。注意\
  \ main() 方法仅在原生编译时使用。\n\n#### Example 10-14. Main program for the egui Demo App\n\
  \n```\n// When compiling natively:\nfn main() {\n    let app = egui_demo_lib::WrapApp::default();\n\

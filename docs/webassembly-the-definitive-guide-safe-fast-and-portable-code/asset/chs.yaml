- "## Chapter 9. Applied WebAssembly : Tensorflow.js\n\n### A NOTE FOR EARLY RELEASE\
  \ READERS\n\nWith Early Release ebooks, you get books in their earliest form—the\
  \ author’s raw and unedited content as they write—so you can take advantage of these\
  \ technologies long before the official release of these titles.\n\nThis will be\
  \ the 9th chapter of the final book.\n\nIf you have comments about how we might\
  \ improve the content and/or examples in this book, or if you notice missing material\
  \ within this chapter, please reach out to the author at wasmbook@bosatsu.net.\n\
  \n> Now, the world don’t move\n> to the beat of just one drum,\n> What might be\
  \ right for you,\n> May not be right for some.\n> \n> —Theme to “Diff’rent Strokes”\n\
  \n这是我们“Applied WebAssembly”章节中的第一章，我在此重点介绍该技术的潜在用例。正如你在本书中将看到的那样，并没有单一用途。相反，设计者打造了一个平台，其触及范围不断扩大，几乎涵盖软件开发行业的各个方面。所以请跟上。我不会专门教授新功能。相反，我希望帮助塑造你对我们行业正在迅速变化以及\
  \ WebAssembly 将如何提供帮助的理解。\n\n首先，我想让你停下来思考一下编程语言和机器学习。你首先想到的是哪一种？你的答案很可能不是 JavaScript。为什么会这样？机器学习如今是一个极其注重性能的活动，计算工作量巨大。\n\
  \n诸如 Python 之类的语言与机器学习的关联比 JavaScript 更强。如果我们诚实地说，这也有些牵强。Python 本身是一个糟糕的数值语言。然而，它在可读性、灵活的编程风格（函数式、面向对象、过程式）和广泛的算法、可视化和数据处理功能之间取得了很好的平衡。如果你能让它运行得更快，那么它就能满足很多需求。Numpy、原生库、集群云环境等可以为其提供足够的计算能力来完成训练过程。\n\
  \n不过，大多数组织并不在运营中使用 Python，因此你很可能需要将模型序列化为其他格式，以便加载到 C/C++、C#、Java 或 JavaScript 应用程序中。由于开放格式如\
  \ Open Neural Network Exchange（ONNX）¹ 的出现，这变得更容易了，但许多框架如 Tensorflow 天然支持这种混合使用。\n\
  \n第一步是训练我们的模型。第二步是推理。直到几年前，Tensorflow 要求你用 Python 训练，但你可以将模型保存到磁盘并加载到其他环境中。如今，你可以选择用\
  \ Python、JavaScript 或 Swift 使用 Tensorflow 进行训练。\n\n我们将讨论 Tensorflow.js，它旨在为 JavaScript\
  \ 环境在浏览器内外提供机器学习能力。在浏览器中使用 JavaScript 进行机器学习（特别是）比你想象的更有意义。为了理解机器学习与 JavaScript\
  \ 和 WebAssembly 之间的关系，我们必须先快速讨论一下硬件以及它如何改变我们的行业。\n\n### Hardware\n\n\n\n\n\n典型的程序员认为她的工作是编写运行在包含中央处理器（CPU）、主内存、存储系统、显示器和某种输入设备的计算机上的软件。虽然这仍然涵盖了大量的软件开发，但我们拥有的计算运行时生态系统比大多数人意识到的要丰富得多。计算机、平板电脑、游戏机、网络设备、智能手机、手表、嵌入式系统、物联网（IoT）设备以及片上系统（SOC）提供了执行软件的各种硬件系统。\n\
  \n以 C++ 著称的 Herb Sutter 写过一篇优秀的文章²，名为“Welcome to the Jungle”，值得你花时间阅读。在其中，他强调了过去几十年硬件发展对软件行业的影响。大约\
  \ 30 年间，摩尔定律³ 将更高的密度转化为更快的芯片。如果你的软件运行缓慢，你只需等待 18-24 个月，它就会变快。\n\n一旦我们停止制造更快、更复杂的芯片，我们就利用额外的密度制造更多简单的芯片。多核系统成为常态。与之前的“免费午餐”时期不同，开发人员现在必须编写疯狂的并发代码才能受益于额外的处理能力，而且并非每个问题都适合这种模式。此外，这是一种棘手的代码，很容易出错。这在很大程度上推动了我们转向函数式编程语言和不可变数据结构。\n\
  \n其他发展包括云计算的出现以满足弹性需求、边缘计算以在地理上进行分布以实现低延迟的客户体验，以及异构计算环境。这包括图形处理器（GPU）、现场可编程门阵列（FPGAs）和专用集成电路（ASICs）。\n\
  \n所有这些都与这样一个事实联系在一起：计算需要时间和电力。未来成功的 IT 战略很大程度上将围绕最小化时间成本、电力成本和延迟成本展开。这将影响事物运行的位置。将大量数据推送到云中以进行弹性、突发式训练是有意义的。但如果这导致大型模型，这些模型就很难分发到桌面/移动体验中，因为体积太大。同时，我们也不希望互联网传感器和汽车刹车在关键时刻进行云调用。\n\
  \n我们面临着数据的绝对爆炸，这将使所有这些变得更加关键。为了在合理的时间内处理数据，我们需要访问硬件加速。这使数学并行化变得可行。正是在这个世界里，我们最终可以探索浏览器中的基于\
  \ JavaScript 的机器学习概念。\n\n### Playground\n\nTensorflow Playground⁴ 是一个实验环境，让非专家通过直接操作⁴\
  \ 了解神经网络的工作原理。[content]\n\n典型的程序员认为她的工作是编写运行在包含中央处理器（CPU）、主内存、存储系统、显示器和某种输入设备的计算机上的软件。虽然这仍然涵盖了大量的软件开发，但我们拥有的计算运行时生态系统比大多数人意识到的要丰富得多。计算机、平板电脑、游戏机、网络设备、智能手机、手表、嵌入式系统、物联网（IoT）设备以及片上系统（SOC）提供了执行软件的各种硬件系统。\n\
  \nHerb Sutter of C++ fame has written an excellent essay² called “Welcome to the\
  \ Jungle” that is worth your time. In it, he highlights the impact of hardware developments\
  \ on the software industry over the last several decades. For approximately 30 years,\
  \ Moore’s law³ translated higher density into faster chips. If your software was\
  \ slow, you simply waited 18-24 months and it would get faster.\n\nOnce we stopped\
  \ being able to make faster, more complex chips, we used the extra density to make\
  \ more simple chips. Multicore systems became the norm. Unlike the previous “free\
  \ lunch” period, developers now had to write crazy concurrent code to benefit from\
  \ the extra processing power and not every problem fits this mold nicely. Also,\
  \ this is tricky code and easy to get wrong. This has largely pushed us toward functional\
  \ programming languages and immutable data structures.\n\nOther developments include\
  \ the emergence of cloud computing to meet elastic demand, edge computing to distribute\
  \ it geographically for low-latency customer experiences, and heterogenous computing\
  \ environments. This includes Graphical Processing Units (GPUs), Field Programmable\
  \ Gate Arrays (FPGAs) and Application-Specific Integrated Circuits (ASICs).\n\n\
  Tied up in all of this is the idea that it takes time and power to compute things.\
  \ A big part of a successful IT strategy moving forward is going to be about minimizing\
  \ time costs, power costs and latency costs. This is going to influence where things\
  \ run. It makes sense to push large amounts of data into the cloud for elastic,\
  \ bursty training sessions. But if this results in large models, those are not as\
  \ easily distributed to desktop/mobile experience because of size. At the same time,\
  \ we do not want internet sensors and car brakes making cloud calls at crucial times.\n\
  \nWe are facing an absolute explosion of data which is going to make all of this\
  \ more crucial. In order to process data in reasonable amounts of time, we need\
  \ access to hardware acceleration. This parallelizes the math so it is tractable.\
  \ It is in this world that we finally can explore the concept of JavaScript-based\
  \ machine learning in the browser.\n\n### Playground\n\nTensorflow Playground⁴ is\
  \ an experimental environment for non-experts to gain intuition about how neural\
  \ networks work through direct manipulation⁵. The idea is that these models are\
  \ increasingly driving systems with real-world consequences, but the background\
  \ needed to understand them is beyond the typical non-academic researcher. By working\
  \ with visual representations, non-technical users are able to gain a sense of cause\
  \ and effect.\n\nThe problem is that the JavaScript environment is single-threaded\
  \ and the numerics support is not great for the kind of math that training neural\
  \ networks requires. The Playground environment allows you to change all hyperparameters\
  \ of the training process via simple user interface actions. While it is easy and\
  \ fun to experiment with changing these parameters, they can have significant impacts\
  \ on the quality of the results. In order to see the effect quickly and in real\
  \ time, the runtime needs to recalculate significant portions of the code otherwise\
  \ the whole point of direct manipulation is lost. Fortunately they were able to\
  \ eke out enough performance to make it all work by relying on the presence of WebGL\
  \ in the browser. We will discuss this idea more below.\n\n### Tensorflow.js\n\n\
  Out of the success of the Playground came an appreciation of what was necessary\
  \ and possible to bring deep learning systems to the browser. It may strike you\
  \ as a bit odd to want to run such computationally-intensive systems on potentially\
  \ lower-end devices such as phones or tablets. Even just running in the browser\
  \ on a powerful desktop machine is a slightly odd concept. There are quite a few\
  \ benefits to the idea though.\n\nUnsurprisingly, the experience of clicking on\
  \ a link and downloading a deep learning-based application is a lot easier than\
  \ having to install a potentially large number of required libraries. There is zero\
  \ installation to load a web page. It is easier to share research and practical\
  \ applications when it is this easy. This broadens the potential for interaction\
  \ among deep learning researchers and makes it easier to target endusers with applications\
  \ that employ these capabilities.\n\nGiven the popularity of JavaScript, it is a\
  \ bit of a steep request that web developers learn Python in order to do machine\
  \ learning. There is an overwhelming amount of open source JavaScript code for building\
  \ all manner of software systems. Being able to take advantage of it all would be\
  \ a benefit to developers of machine learning systems in the other direction.\n\n\
  Our phones and tablets have quickly become something much more than mobile portable\
  \ electronic devices. They have become diagnostic tools, part of our banking systems,\
  \ methods of identification and more. New software is being written to detect the\
  \ onset of dementia or the presence of strokes by analyzing video from their cameras.\
  \ Both for the quality of the user experience and privacy law compliance with respect\
  \ to the results of diagnostic outcomes, being able to push apps to the device will\
  \ be much less encumbered by regulatory burdens than trying to take data off of\
  \ the device.\n\nFinally, many of the devices that these downloaded apps might run\
  \ on have powerful and sophisticated GPUs available for use. Not only could it be\
  \ possible to do deep learning systems in the browser, it might actually perform\
  \ well.\n\nSo, why are we discussing all of this?\n\nThe design of the Tensorflow.js\
  \ framework is elegant and results in clean APIs that work across a wide range of\
  \ devices. Rather than limiting the implementation to what is available everywhere,\
  \ they chose to create a pluggable backend to cover the widest number of systems.\n\
  \nThe basic version of the backend is a CPU-based JavaScript implementation that\
  \ will run anywhere. All of the code executes directly on the CPU without benefit\
  \ of optimizing instruction sets such as the Advanced Vector Extensions (AVX)⁶.\
  \ It does not perform effectively anywhere but it will run basically everywhere.\
  \ Other options are better first choices, but this is a decent fallback position.\n\
  \nThe next major backend is accelerated by WebGL. There is no direct support for\
  \ accessing GPUs from JavaScript, but there is via WebGL which is supported in nearly\
  \ every browser. By pretending to do 3D graphics, they can execute calculations\
  \ on the GPU and write the results into the textures. This produces a fast and convenient\
  \ implementation that runs well on just about every major modern browser. It is\
  \ similar to what was done with the Tensorflow Playground application mentioned\
  \ earlier.\n\n#### NOTE\n\nThis is not as strange a scenario as it sounds. Prior\
  \ to the availability of GPU computation libraries such as CUDA, OpenCL, Metal and\
  \ Vulkan, researchers would do this with OpenGL to get access to comparatively cheap\
  \ computation. These APIs that specifically allow the use of GPUs for arbitrary\
  \ computation was part of what accelerated the machine learning and deep learning\
  \ systems we enjoy these days.\n\nServers with deep learning needs can be implemented\
  \ in Node.js, so the next backend is designed to run in a freer environment than\
  \ the browser. Apps running in Node.js can read from and write to the filesystem,\
  \ load and use native libraries, and communicate directly with the normal native\
  \ Tensorflow libraries. These can take advantage of multicore systems, GPUs or other\
  \ hardware accelerating devices such as Google’s Tensor Processing Units (TPUs).\n\
  \n\n\n\n\n你可以在图 9-1 中看到 API 设计的基本结构。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_188_0.png)\n\
  \n图 9-1. Tensorflow.js 分层 API 和后端\n\n这里有很多内容需要拆解。首先，低层的算子通过上图所示的 Ops API 暴露出来。需要深入细节的开发者可以选择在该层进入\
  \ API。然而，在其之上，还有一个受 Keras 启发的 Layers API，其设计考虑了愉悦的开发者体验。这是一个用于使用简化的堆叠层方法定义复杂神经网络架构的简单\
  \ API。它隐藏了许多细节，但仍通过相对直接的机制暴露出强大的行为。\n\n无论客户端代码使用哪种 API 进入 Tensorflow.js API，针对这些\
  \ API 编写的应用程序都可以在后端覆盖的所有环境中移植。这包括在浏览器中、在浏览器之外、带硬件加速和不带硬件加速的情况。这本身就是一个相当了不起的设计成就，但当能够利用硬件加速时，代码在不同环境中也会运行得非常出色。如我们所见，这可以有多种形式，但我们并不是针对最低公分母环境编写代码，应用程序代码也不必因一堆功能检测代码而负担沉重，以查看环境提供了什么。\n\
  \n使用 MobileNet⁷ 进行单次推理的结果，平均一百分次运行，结果显示在表 9-1 中。这些数据取自向世界介绍 Tensorflow.js 的论文《Tensorflow.js\
  \ : Machine Learning for the Web and Beyond⁸》。\n\n#### 表 9-1. Tensorflow.js\n\n\
  ### 性能结果\n\n| Backend | Time(ms) | Speedup |\n|---|---|---|\n| CPU JavaScript |\
  \ 3426 | 1x |\n| WebGL (Intel Iris Pro) | 49 | 71x |\n| WebGL (GTX 1080) | 5 | 685x\
  \ |\n| Node.js CPU w/ AVX2 | 87 | 39x |\n| Node.js CUDA (GTX 1080) | 3 | 1105x |\n\
  \n趋势上的结果并不令人惊讶，但具体细节有点令人惊讶。在没有任何硬件加速的原始 JavaScript 后端上运行需要近 3.5 秒。只需将后端切换为受 WebGL\
  \ 支持优化的后端，即使是性能非常适中的集成 GPU，也能在浏览器中实现 71 倍的加速。在配备更强 GPU 的桌面机器上，我们实现了近 700 倍的加速。没有\
  \ GPU 优势但拥有带优化 AVX 指令的 CPU 的服务器应用程序改进了近 40 倍。同一环境在更强大的 GPU 支持下产生了令人瞠目结舌的 1000 倍以上的加速。请记住，应用程序本身没有任何变化，只是运行它的环境发生了变化。\n\
  \n这就是我的主要观点。从“免费午餐”时期到多核时期的转变迫使开发者必须以显著不同的方式编程才能利用这些额外资源。如果我们必须改变编程方式才能利用定制加速、多\
  \ CPU、云托管环境以及在浏览器中运行，我们的深度学习应用程序将变成一团无法维护的代码。相反，我们看到的是一种隔离变化部分并利用我们可用的硬件选项的策略。这引出了我们将要考虑的最后一个后端。\n\
  \n### WebAssembly 后端\n\nTensorflow.js 发布后不久，团队发布了一个用 WebAssembly 编写的新的后端。鉴于我们刚刚讨论的覆盖范围，你可能会惊讶他们为何觉得有必要这样做。然而，到现在我希望你意识到这可能并不意味着从零开始。显然需要做一些工作，但大量工作是通过依赖现有代码来处理的。特别是，XNNPack⁹\
  \ 库被扩展以支持 WebAssembly 构建。\n\n这将我们的后端集合扩展到包括图 9-2 中所示的后端。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_192_0.png)\n\
  \n图 9-2. Tensorflow.js 的 WebAssembly 后端\n\n这突出了 WebAssembly 的一个主要用例。它并不是要取代 JavaScript，至少不是在所有情况下。它是关于在不必等待浏览器厂商社区达成共识的情况下扩展浏览器中可能实现的功能。WebGPU¹⁰\
  \ 或类似技术正在通过标准化流程推进，但这可能需要数年时间。用 C++ 编写的现有库旨在优化并在许多平台上移植，现在就能将其中很大一部分能力带到浏览器中，而无需等待。\n\
  \n这将计算运行时扩展到包括没有强大 GPU 的旧设备。代码可以优化以在各种平台上仍然运行良好。此外，WebAssembly 设计者正在逐步采用我们将在后续章节中讨论的两个高级功能。这包括使用单指令多数据（SIMD）¹¹\
  \ 并行化以及使用多线程。\n\n在图 9-3 中，我们与之前一样使用了 MobileNet。显然，仅 WebAssembly 后端本身的性能不如 WebGL\
  \ 支持的后端。你被鼓励使用 Wasm 后端而不是纯 JavaScript 后端，因为它在任何地方都会表现得更好。取决于模型大小，由于 WebGL 执行的一些固定成本，Wasm\
  \ 后端比 WebGL 后端更有意义。请注意，当线程和 SIMD 并行化被添加到 Wasm 组合中时，支持这些功能的平台的性能有了显著提升。\n\n### MobileNet\
  \ v2\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_193_0.png)\n\n图 9-3. Tensorflow.js\
  \ 后端在各平台上的相对性能\n\n在图 9-4 中，我们看到参数数量更少的另一个模型的结果。在这种情况下，Wasm 后端更有意义。请注意 Pixel 4 上的可比性能以及\
  \ Linux 和 Mac 笔记本上显著更好的性能。再次，线程和 SIMD 的使用显著改善了 WebGL 为基础的后端的性能。\n\n### BlazeFace\n\
  \n![](img/16b7990eb0dbf589db177bdbd2f4a189_194_0.png)\n\n图 9-4. Tensorflow.js 后端在各平台上的相对性能\n\
  \n至少目前，WebAssembly 并非在每种情况下都是最快的解决方案。它是一个相对较新的平台，要榨干其中所有潜在优化还需要一段时间。然而，鉴于其年轻的年龄，它已经改变了在各种计算环境中可能实现的功能。\n\
  \n本章的关键教训是，WebAssembly 及其相关技术可以为我们提供更多选择，并且在许多情况下，为在多样化的计算表面上部署高性能软件系统提供更好的选择。我们在接下来的内容中会看到许多其他用途，但现在是时候扩展我们的语言和\
  \ WebAssembly 选项了。\n\n- 1 有关这个日益流行的努力的更多细节可以在这里找到：https://onnx.ai\n- 2 这就是我在正文中提到的文章。在其中，他还引用了他写的一篇名为“免费午餐结束了”的文章，也值得你花时间阅读：https://herbsutter.com/welcome-to-the-jungle/\n\
  - 3 摩尔定律是对硅芯片制造趋势中密度方面一个著名的观察。https://en.wikipedia.org/wiki/Moore%27s_law\n- 4 你可以在这里尝试\
  \ Tensorflow Playground：http://playground.tensorflow.org\n- 5 直接操作是一种用户界面风格，用户拥有控件，可以安全地探索性地操作应用程序及其数据。\n\
  https://en.wikipedia.org/wiki/Direct_manipulation_interface\n- 6 AVX/AVX2 是对 Intel\
  \ x86 指令集架构（ISA）的扩展，提供了我们在此使用的那种数学的并行优化：\nhttps://en.wikipedia.org/wiki/Advanced_Vector_Extensions\n\
  - 7 MobileNets 模型集合专为高效的移动和嵌入式视觉应用而设计：https://arxiv.org/pdf/1704.04861.pdf\n- 8\
  \ 这篇论文读起来不错，值得你花时间：https://arxiv.org/pdf/1901.05350.pdf\n- 9 XNNPack 可在此处获得，尽管它并不打算直接供深度学习研究人员使用：https://github.com/google/XNNPACK\n\
  - 10 这个新兴标准将以跨平台的方式直接向浏览器公开 GPU 支持：https://en.wikipedia.org/wiki/WebGPU\n- 11 SIMD\
  \ 是一种数据并行处理类型，对数据的不同部分执行相同指令于多个计算元素上。https://en.wikipedia.org/wiki/SIMD\n\n\n\n\n"
- "## 第10章 Rust\n\n### 早期发布读者的说明\n\n使用 Early Release 电子书，您可以在这些标题正式发布之前很久就利用这些技术——作者在写作过程中提供的原始且未经编辑的内容。\n\
  \n这将是最终书籍的第10章。\n\n如果您对如何改进本书的内容和/或示例有任何建议，或者如果您注意到本章中缺少材料，请联系作者 wasmbook@bosatsu.net。\n\
  \n> 街上都在谈论，它在提醒你\n> 其实并不重要你站在哪一边\n> 你正走开，他们在你背后议论\n> 他们永远不会忘记你，直到有新人出现\n> ——Eagles，《New\
  \ Kid in Town》\n\n在我职业生涯的某个时期，我停止关心新的编程语言。似乎总有一个新语言就在拐角处。大多数时候，它们对我来说一点也不有趣。如今，一种新的编程语言必须在之前的基础上提供足够的优势，才能吸引我们的注意并值得我们学习、投入工具链等的精力。\n\
  \n大约在这个时候，我了解到 Go 和 Rust，并把它们放在同一个概念空间里：系统语言，提供与 C 和 C++ 大致相似的速度，但也包含使其更安全的语言特性。由于我一直是\
  \ Unix 极客，我被 Ken Thompson 和 Rob Pike¹ 参与 Go 的事吸引。我也很兴奋地看到一些 Plan 9 的想法开始获得关注。因此，我投入了一些精力学习\
  \ Go，并且很高兴我这么做了。我没有看到也学习 Rust 的必要，因为我认为它只是更多同样的东西。\n\n然后我对 WebAssembly 感兴趣了。\n\n\
  一旦我听说 Rust 在后端原生发出 WebAssembly，我就知道我需要深入研究。这时我了解了 Rust 语言、其社区、工具、文档，并有点爱上了它。别误会，我也喜欢\
  \ Go 社区和语言，但 Rust 与 WebAssembly 之间的关系是如此之强，以至于我大部分兴趣都转移了，并且我再也没有回头。\n\n到目前为止，本书主要集中在\
  \ C 和 C++ 与 WebAssembly 之间的关系上。这是迈向不同语言的第一步。Rust 是一种现代语言，具有现代的理念。它提供了非常好的运行时性能，同时提供了一个几乎不可能作为事后想法实现的<|message|>安全网。鉴于\
  \ C 和 C++ 在我们每天面临的错误、缺陷和恶意软件利用中仍发挥着重要作用，拥有一种快速、安全的系统语言是一个实质性的改进。在经历了开源社区宠儿的漫长时期后，这些好处开始被商业开发者明显认识到，对\
  \ Rust 的兴趣每天都在增长。\n\nC 和 C++ 显然在我们的行业中仍然发挥着重要作用，但如果在新项目中做出选择，我会选择 Rust 而不是它们。它真的已经成为每个人都在谈论的新人，所以让我们在研究\
  \ Rust 与 WebAssembly 之间的相互作用之前先了解原因。\n\n### Rust 简介\n\n鉴于本书已经非常庞大，我无法以任何严谨的方式教您\
  \ Rust。对于这一点，我鼓励您查阅 Steve Klabnik 和 Carol Nichols 的免费书籍《The Rust Programming Language》，或\
  \ Jim Blandy、Jason Orendorff 和 Leonora F.S. Tindall 的《Programming Rust》第二版或更新版本。\n\
  \n对这种新语言的高层次介绍是，它始于 Graydon Hoare 在 Mozilla 任职期间的副业，但已演变成一种正在 Google、Microsoft、Apple\
  \ 和其他领先技术公司获得关注的改变行业的语言。他们感兴趣的原因有很多，但采用的主要驱动力是它是一种快速、安全、现代的语言。最初 intended 作为用于低级库和操作系统服务的系统编程语言，它甚至开始进入\
  \ Linux 内核扩展。\n\n语言中的一系列基本设计选择解决了整类错误。在其他语言中会表现为运行时错误的问题在 Rust 中变成了编译时错误。不幸的是，它的学习曲线相当陡峭。你会遇到让\
  \ Rust 编译器不悦的无法解释的边缘情况，并且最初可能会相当沮丧。我把这种体验比作青少年成长过程。\n\n最初，作为青少年，对你的期望并不多，但慢慢地期望越来越多，直到你突然成为成年人。过渡过程可能痛苦且令人沮丧。作为开发者，Rust\
  \ 编译器期望你清晰地沟通并表明你的意图，以便它能相应地做出反应。像 JavaScript 这样的语言对你没有任何这样的要求，所以根据你的背景，这可能会有点令人不快。\n\
  \n然而，虽然你最初可能会对 Rust 编译器期望的成年程度感到不满，但它很快就会成为人们充满热情的语言。它在过去几年中赢得了几次最喜欢语言的调查²，所以显然，度过陡峭的学习曲线是一次有回报的体验。一旦青少年成为年轻成年人，即使有额外的期望，很少有人会渴望回到自己的年轻时期。\n\
  \n假设您已按照附录 A 所述安装了 Rust，我们可以轻松处理“Hello, World!”程序，如示例 10-1。\n\n#### 示例 10-1. Rust\
  \ “Hello, World!”\n\n```\nfn main() {\n    println!(\"Hello, World!\");\n}\n```\n\
  \n这里，我们有一个 main () 方法以及将字符串打印到控制台的能力。虽然它看起来像是一个强调的名称，但感叹号只是将其标记为宏，这是一种我们没有时间探索的语言特性³。就我们的目的而言，只需将其视为\
  \ C 中的 printf() 或 Java 中的 System.out.println()。编译和运行这个简单程序就像以下命令一样简单：\n\n```\nbrian@tweezer\
  \ ~/g/w/s/ch10> rustc helloworld.rs\nbrian@tweezer ~/g/w/s/ch10> ./helloworld\n\
  Hello, World!\n```\n\n到目前为止，没什么大不了的，但用不了多久就会遇到 Rust 的不同之处。考虑示例 10-2 中的非常基本示例。\n\n\
  #### 示例 10-2. Rust 不可变变量\n\n```\nfn main() {\n    let s = \"cool\";\n    s = \"\
  safe\";\n\n    println!(\"Rust is {}\", s);\n}\n```\n\n我们将一个字符串字面量分配给变量 s。Rust 对类型很挑剔，但不会不必要地挑剔。当它可以使用类型推断⁴来确定变量应该具有什么类型时，就没有理由啰嗦。Rust\
  \ 编译器可以看出这里正在分配一个字符串的引用。然后我们改变主意，用另一个字符串引用覆盖该值，然后打印出新值。在几乎任何其他编程语言中，这都是完全可以做的事情。在\
  \ Rust 中……\n\n```\nbrian@tweezer ~/g/w/s/ch10> rustc immutable.rs\nwarning: value\
  \ assigned to `s` is never read\n  --> immutable.rs:2:9\n   |\n2 |     let s = \"\
  cool\";\n   |             ^\n   |\n   = note: `# [warn(unused_assignments)]` on\
  \ by default\n   = help: maybe it is overwritten before being read?\n```\n\n```\n\
  error[E0384]: cannot assign twice to immutable variable `s`\n  --> immutable.rs:3:5\n\
  \   |\n2 |     let s = \"cool\";\n   |       -\n   |       |\n   |       first assignment\
  \ to `s`\n   |       help: make this binding mutable: `mut s`\n3 |     s = \"safe\"\
  ;\n   |     ^^^^^^^^^^^ cannot assign twice to immutable variable\n\nerror: aborting\
  \ due to previous error; 1 warning emitted\n\nFor more information about this error,\
  \ try `rustc --explain E0384`.\n```\n\n这个错误信息有很多内容。一方面，由于 Rust 团队意识到学习曲线很陡峭，他们花费了不成比例的时间确保错误信息是有帮助和信息的⁵。\n\
  \n第一个错误信息只是简单地说，第一次赋值意义不大，因为你在它被读取之前就立即覆盖了该值。这只是表明潜在代码异味⁶的观察。你可以抑制此警告，如果你不想看到它，但默认情况下它指出这些问题是很不错的。\n\
  \n真正的问题是 Rust 变量默认是不可变的。一旦你分配一个值，就不能更改它。这似乎是一个奇怪的政策，但它迫使你在想要变量值更改时和不想要时保持清晰。有很大一类错误涉及无意覆盖变量。你可能直到测试失败或出现运行时问题才注意到你已经这样做了。\n\
  \n显然，我们需要在 Rust 中使用可变变量，你只需要告诉编译器你想要它，如示例 10-3 所示。\n\n#### 示例 10-3. 可变 Rust 变量\n\
  \n```\nfn main() {\n    let mut s = \"cool\";\n    s = \"safe\";\n}\n```\n\n\n\n\
  \n\n```\nprintln!(\"Rust is {}\", s);\n}\n```\n\n现在，通过重新编译（并抑制未使用的赋值警告）我们进入了一个更愉快的状态。\n\
  \n```\nbrian@tweezer ~/g/w/s/ch10> rustc -A unused_assignments\nimmutable.rs\nbrian@tweezer\
  \ ~/g/w/s/ch10> ./immutable\nRust is safe\n```\n\n起初，你可能会觉得必须如此清晰地进行沟通很烦人，但 Rust\
  \ 编译器只是在教你如何成为一个成年人，在那里沟通对于福祉和成功至关重要。\n\n让我们再看一个例子，当你开始使用 Rust 时可能会遇到问题。在示例 10-4\
  \ 中我们有另一个非常简单的程序。我们将一个字符串字面量赋给变量 s，然后重新赋给变量 t，然后打印两者。\n\n#### 示例 10-4. 使用 Rust 变量\n\
  \n```\nfn main() {\n    let s = \"Hello, world.\";\n    let t = s;\n    println!(\"\
  s: {}\", s);\n    println!(\"t: {}\", t);\n}\n```\n\n这是一个完全合理的做法，我们可以看到 Rust 编译器对此没有任何问题。\n\
  \n```\nbrian@tweezer ~/g/w/s/ch10> rustc memcheck.rs\nbrian@tweezer ~/g/w/s/ch10>\
  \ ./memcheck\ns: Hello, world.\nt: Hello, world.\n```\n\n然而，只有一个小的改动，我们就可以像示例 10-5\
  \ 中那样破坏它。\n\n#### 示例 10-5. Rust 内存检查器违规\n\n```\nfn main() {\n    let s = \"Hello,\
  \ world.\".to_string();\n    let t = s;\n    println!(\"s: {}\", s);\n    println!(\"\
  t: {}\", t);\n}\n```\n\n问题在 Rust 编译器的错误信息中得到了很好的突出显示。\n\n```\nbrian@tweezer ~/g/w/s/ch10>\
  \ rustc memcheck.rs\nerror[E0382]: borrow of moved value: `s`\n  --> memcheck.rs:4:23\n\
  \   |\n2 |     let s = \"Hello, world.\".to_string();\n   |             - move occurs\
  \ because `s` has type\n   | `std::string::String`, which does not implement the\
  \ `Copy` trait\n3 |     let t = s;\n   |             - value moved here\n4 |   \
  \  println!(\"s: {}\", s);\n   |                        ^ value borrowed here after\
  \ move\n\nerror: aborting due to previous error\n\nFor more information about this\
  \ error, try `rustc --explain E0382`.\n```\n\n可能看起来没什么大不了的，但通过添加 to_string() 方法调用，我们违反了\
  \ Rust 的内存检查器。这是因为我们将一个字符串字面量变成了一个堆分配的字符串。栈是为与当前函数相关联的短期变量分配的地方，以便它们在超出词法作用域时可以轻松清理（即在函数结束时）。堆分配的内存会在不再需要之前一直被分配。在\
  \ C 和 C++ 中，你通常必须自己作为程序员来管理这个过程。在 Java 和 JavaScript 环境中，运行时垃圾收集器会为你完成此操作。\n\nRust\
  \ 通过强制执行值的拥有权来管理缺乏运行时垃圾收集器。在任何给定时间，只有一种变量可以拥有与堆分配值相关联的内存。在示例 10-5 中，我们首先将字符串的所有权分配给变量\
  \ s。当我们将 s 分配给 t 时，所有权转移。此时，s 不再指向任何有效内容，因此我们尝试在 println! 宏中使用 s 被捕获为违规。\n\n字面值和其他结构可能实现上面错误消息中提到的\
  \ Copy trait。这是一种允许相关位在变量之间复制而不引起所有权转移的行为。因为 Rust 字符串结构没有实现此 trait，所以所有权检查适用。所有权转移发生的其他情况包括变量在函数进出时、在循环中，以及其他词法结构如条件子句。\n\
  \n好消息是，通过更明确地表达我们的意图，我们可以在不引入新风险的情况下解决这个问题。我们试图避免的具体风险是使用前未初始化、使用后释放，以及在 C 和 C++\
  \ 等语言中常见的其他错误。我们可以使用引用而不是直接访问，这允许我们“借用”一个值。我们可以有可变引用，但一次只能有一个。这些功能有点像 Java 等语言中的读写锁。\n\
  \n一旦我们更好地沟通我们的意图，Rust 编译器就可以帮助我们实现目标，而不是一直与我们对抗。净效果是 Rust 将多个运行时错误移至编译时错误，这是一个更好的处理位置。这消除了更多类别的错误，并使我们能够生产出更高质量的软件，包括用于系统开发的快速、高并发类型的代码。\n\
  \n使用 Rust 的体验不仅仅是被编译器骚扰。语言特性、工具和社区的各个方面一旦度过学习曲线就会让人愉快使用。Rust 的速度和安全性与其基于 LLVM 的结合使其成为与\
  \ WebAssembly 配对的绝佳语言。\n\n### Rust 和 WebAssembly\n\n如果你按照附录 A 中安装 Rust 的说明进行操作，那么你已经拥有了使用\
  \ Rust 进行 WebAssembly 的基础。正如我之前提到的，正是 Rust 对 WebAssembly 的原生支持最初引起了我对 Rust 的好奇心。\n\
  \n你会记得在图 5-1 中你看到 LLVM 提供了三阶段架构。由于 Rust 是基于 LLVM 的语言，为了支持 WebAssembly，它基本上只需要一个新的后端。这并不完全正确，但现在这是一个合适的虚构。\n\
  \n你可以通过发出以下命令查看已安装的后端：\n\n```\nbrian@tweezer ~/g/w/img> rustup target list | grep\
  \ installed\nwasm32-unknown-unknown (installed)\nx86_64-apple-darwin (installed)\n\
  ```\n\nRust 后端标记为三元组，表示指令集架构（ISA）、厂商和操作系统。我在 Intel Mac 上运行了该命令，所以你看到了相应的默认后端。但你也可以注意到\
  \ WebAssembly 后端已安装。由于它生成针对 WebAssembly 栈机的代码，我们不是在谈论 x86_64、aarch64、arm7 或 riscv64。因为这段代码是可移植的，所以无关紧要你在哪个机器上运行它，这就是为什么三元组用\
  \ unknown-unknown 填充的原因。\n\n如果你查看示例 10-6，你会看到将两个数字相加的代码（Rust 中的 i32）和一个 main() 方法来测试行为。\n\
  \n#### 示例 10-6. Rust 函数将两个整数相加\n\n```\npub extern \"C\" fn add(x: i32, y: i32) ->\
  \ i32 {\n    x + y\n}\n\nfn main() {\n    println!(\"2 + 3: {}\", add(2,3));\n}\n\
  ```\n\n使用默认后端，你可以查看构建和运行此代码的原生 Rust 版本的结果。\n\n```\nbrian@tweezer ~/g/w/s/ch10> rustc\
  \ add.rs\nbrian@tweezer ~/g/w/s/ch10> ./add\n2 + 3: 5\n```\n\n将相同的代码编译成 WebAssembly\
  \ 模块与选择 WebAssembly 后端并指示我们想要生成 C 动态库一样简单。你可以删除 main 函数或添加编译指令以抑制死代码投诉，如下所示：\n\n\
  ```\nbrian@tweezer ~/g/w/s/ch10> rustc -A dead_code --target wasm32-unknown-unknown\n\
  -O --crate-type=cdylib add.rs -o add.wasm\n```\n\n我们可以使用 wasm3 运行时在命令行上执行我们的函数：\n\
  \n```\nbrian@tweezer ~/g/w/s/ch10> wasm3 --func add add.wasm 2 3\nError: [Fatal]\
  \ repl_call: function lookup failed\nError: function lookup failed ('add')\n```\n\
  \n呃... 或不是。\n\n```\nbrian@tweezer-2 ~/g/w/s/ch10> ls -laF add*\n-rwxr-xr-x  1 brian\
  \  staff  334920 May  4 11:54 add*\n-rw-r--r--  1 brian  staff     111 May  4 12:07\
  \ add.rs\n-rwxr-xr-x  1 brian  staff 1501227 May  4 12:16 add.wasm*\n```\n\n哇，那个文件相比原生版本相当大。这再次是因为\
  \ Rust 编译器对在 WebAssembly 环境中执行此代码所需的期望。原生版本可以依赖原生动态库来提供所需的功能。到本书的这一点，你应该记得如何调查 Wasm\
  \ 模块的内容。\n\n```\nbrian@tweezer ~/g/w/s/ch10> wasm-objdump -x add.wasm\nadd.wasm:\
  \      file format wasm 0x1\n\nSection Details:\n\nTable[1]:\n  - table[0] type=funcref\
  \ initial=1 max=1\nMemory[1]:\n  - memory[0] pages: initial=16\nGlobal[3]:\n  -\
  \ global[0] i32 mutable=1 - init i32=1048576\n  - global[1] i32 mutable=0 <__data_end>\
  \ - init i32=1048576\n  - global[2] i32 mutable=0 <__heap_base> - init i32=1048576\n\
  Export[3]:\n  - memory[0] -> \"memory\"\n  - global[1] -> \"__data_end\"\n  - global[2]\
  \ -> \"__heap_base\"\nCustom:\n  - name: \".debug_info\"\nCustom:\n  - name: \"\
  .debug_pubtypes\"\nCustom:\n  - name: \".debug_ranges\"\nCustom:\n  - name: \".debug_aranges\"\
  \nCustom:\n  - name: \".debug_abbrev\"\nCustom:\n  - name: \".debug_line\"\nCustom:\n\
  \  - name: \".debug_str\"\nCustom:\n  - name: \".debug_pubnames\"\nCustom:\n  -\
  \ name: \"producers\"\n```\n\n好吧，所以有一堆调试信息和导出的内存等等，但没有导出的 add 函数。我们可以在方法定义中添加一个编译指令来解决此导出问题，如示例\
  \ 10-7 所示。\n\n#### 示例 10-7. Rust 函数将两个整数相加正确导出\n\n```\n#[no_mangle]\npub extern\
  \ \"C\" fn add(x: i32, y: i32) -> i32 {\n```\n\n\n\n\n\n```\nx + y\n}\n```\n\n现在，重建并检查结果。你应该能在导出部分看到\
  \ add 方法。我们可以在命令行上调用它。\n\n```\nbrian@tweezer ~/g/w/s/ch10> wasm3 --func add add.wasm\
  \ 2 3\nResult: 5\n```\n\n正如你可能猜到的那样，我们也可以几乎毫不费力地通过典型的 HTML/JavaScript 组合来调用我们的行为，就像在示例\
  \ 10-8 中一样。\n\n#### 示例 10-8. 从 HTML 调用 Rust 函数\n\n```\n<!doctype html>\n<html lang=\"\
  en\">\n    <head>\n        <meta charset=\"utf-8\">\n        <link rel=\"stylesheet\"\
  \ href=\"bootstrap.min.css\">\n        <title>Rust and WebAssembly</title>\n   \
  \     <script src=\"utils.js\"></script>\n    </head>\n    <body>\n        <div\
  \ class=\"container\">\n            <h1>Rust and WebAssembly</h1>\n            2\
  \ + 3 = <span id=\"sum\"></span>.\n        </div>\n        <script>\n          \
  \  fetchAndInstantiate('add.wasm').then(function(instance) {\n                var\
  \ add = instance.exports.add(2,3);\n                var sumEl = document.getElementById('sum');\n\
  \                sumEl.innerText=add;\n            });\n        </script>\n    </body>\n\
  </html>\n```\n\n在图 10-1 中，你可以看到从 JavaScript 在浏览器中调用函数的熟悉结果。不同之处当然在于它最初是用 Rust 而不是我们一直使用的\
  \ C 和 C++ 编写的。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_208_0.png)\n\n图 10-1.\
  \ 从 HTML 调用 Rust\n\n如果 Rust 和 WebAssembly 之间只有这些内容可谈，那不会太令人兴奋。幸运的是，得益于 wasm-bindgen，情况很快变得更有趣得多。\n\
  \n### wasm-bindgen\n\n在后续章节中，我将向你介绍若干由最低可行产品 MVP 之后制定的提案所解锁的功能。这包括引用更复杂结构如字符串和列表的能力、线程支持、多值返回类型等。在此之前，wasm-bindgen\
  \ 在更高层面上架起 JavaScript 与 Rust 之间的桥梁，帮助你在仅传递数字之外将数据跨越鸿沟传递。该工具并非仅为 Rust 设计，但迄今为止大多数收益都体现在\
  \ Rust 上。\n\n如果你已按照附录 A 中所述安装了 wasm-bindgen 和 wasm-pack，你应该已具备完成本章剩余部分所需的一切。后者不是必需的，但能让事情更轻松，因此我们将从使用其打包功能开始。\n\
  \nwasm-bindgen 的“Hello, World!” 是从 Rust 调用 alert() JavaScript 方法，而无需在 WebAssembly\
  \ 中直接导入该方法。正如你很快会看到的，完整的浏览器功能将被解锁并可从 Rust 使用。更令人惊讶的是，它会看起来像是完全用 Rust 编写的。此外，你还可以将\
  \ Rust 代码与 JavaScript 共享，并使其看起来像 JavaScript。我曾使用过多种跨语言桥接技术，这其中是我见过的更好的之一。\n\n第一步是使用\
  \ cargo 构建工具创建一个 Rust 库项目。这将为基本项目建立脚手架。\n\n```\nbrian@tweezer ~/src> cargo new --lib\
  \ hello-wasm-bindgen\nCreated library `hello-wasm-bindgen` package\n```\n\n你可以将\
  \ src/lib.rs 文件中的默认代码覆盖为下面示例 10-9 中所示的内容。\n\n#### 示例 10-9. 用于 wasm-bindgen 的库\n\n\
  ```\nuse wasm_bindgen::prelude::*;\n\n#[wasm_bindgen]\nextern {\n    pub fn alert(s:\
  \ &str);\n}\n\n#[wasm_bindgen]\npub fn say_hello(name: &str, whom: &str) {\n   \
  \ alert(&format!(\"Hello, {} from {}!\", name, whom));\n}\n```\n\n这比我们迄今为止看到的 Rust\
  \ 稍微复杂一些，但也不算太糟糕。第一行导入 wasm_bindgen::prelude 模块的内容，以便我们能在 Rust 代码中使用它。这包括将我们连接到\
  \ JavaScript 运行时环境的绑定代码。\n\n下一行是一个 Rust 属性名 #[wasm_bindgen]。这表示我们计划调用一个名为 alert()\
  \ 的外部函数。这是我们通过上述 use 语句从 prelude 导入的功能之一。如果你觉得这个方法听起来很熟悉，你是对的！这最终会调用你可能多次从 JavaScript\
  \ 调用过的同名方法。\n\n注意其签名。这不是一个 JavaScript 函数。从我们的角度来看，我们只是在 Rust 代码中调用一个 Rust 函数。wasm-bindgen\
  \ 提供的桥接如此无缝，以至于我们此时甚至不必考虑另一种语言。\n\n这个“Hello, World!” 实例也会反向进行。从 JavaScript，我们将调用\
  \ Rust。下一个 #[wasm_bindgen] 属性应用于我们在库中定义的一个 Rust 函数，该函数接受两个字符串切片。我们使用 Rust 的 format!\
  \ 宏，它等同于其他语言中的字符串格式化函数。我们取返回字符串的引用并将其传递给上面标识的 alert() 函数。该属性将生成一个等效的 JavaScript\
  \ 函数以供另一侧调用。从其角度来看，它将调用 JavaScript 而不是 Rust！同一个属性在两个方向上保持我们同步，这相当了不起。\n\n下一步是使用\
  \ wasm-pack 生成我们的支持代码。为此，我们需要更新 Cargo.toml 以指示我们希望生成 C 动态库风格的输出，并且需要 wasm-bindgen\
  \ 作为依赖，如示例 10-10 所示。\n\n#### 示例 10-10. Cargo.toml 文件\n\n```\n[package]\nname = \"\
  hello-wasm-bindgen\"\nversion = \"0.1.0\"\nedition = \"2018\"\n\n[lib]\ncrate-type\
  \ = [\"cdylib\"]\n\n[dependencies]\nwasm-bindgen = \"0.2.73\"\n```\n\n现在我们可以使用 wasm-bindgen\
  \ 生成一个包装我们 Rust 代码的 JavaScript 模块。我已删除了一些关于缺少属性和 README 文件的警告，以及一些翻译不佳的可爱小表情符号。\n\
  \n```\nbrian@tweezer ~/s/hello-wasm-bindgen> wasm-pack build --target web\n[INFO]:\
  \  Checking for the Wasm target...\n[INFO]:  Compiling to Wasm...\n    Compiling\
  \ hello-wasm-bindgen v0.1.0 (/Users/brian/src/hello-wasm-bindgen)\n        Finished\
  \ release [optimized] target(s) in 0.26s\n[INFO]: Optimizing wasm binaries with\
  \ `wasm-opt`...\n[INFO]:     Done in 0.73s\n[INFO]:     Your wasm pkg is ready to\
  \ publish at\n/Users/brian/src/hello-wasm-bindgen/pkg.\nbrian@tweezer ~/s/hello-wasm-bindgen>\
  \ ls -laF pkg\ntotal 72\ndrwxr-xr-x   8 brian  staff   256 May 10 17:20 ./\ndrwxr-xr-x\
  \   9 brian  staff   288 May 10 17:20 ../\n-rw-r--r--   1 brian  staff     1 May\
  \ 10 17:20 .gitignore\n-rw-r--r--   1 brian  staff   861 May 10 17:20 hello_wasm_bindgen.d.ts\n\
  -rw-r--r--   1 brian  staff  4026 May 10 17:20 hello_wasm_bindgen.js\n-rw-r--r--\
  \   1 brian  staff 15786 May 10 17:20 hello_wasm_bindgen_bg.wasm\n-rw-r--r--   1\
  \ brian  staff   291 May 10 17:20 hello_wasm_bindgen_bg.wasm.d.ts\n-rw-r--r--  \
  \ 1 brian  staff   266 May 10 17:20 package.json\n```\n\n我们使用 --target web 标志来指示我们希望包可在浏览器中加载。其他选项包括使用\
  \ Webpack 打包所有内容，或针对 Node.js 或 Deno，如我们稍后将看到的那样。在 pkg 目录中，你会看到生成的 JavaScript、我们的\
  \ Wasm 模块以及 package.json 文件。还有我们代码的 TypeScript 声明文件。如果你使用 wasm-objdump 并查看模块的导出部分，你会看到以下内容：\n\
  \n```\nExport[4]:\n  - memory[0] -> \"memory\"\n  - func[19] <say_hello> -> \"say_hello\"\
  \n  - func[34] <__wbindgen_malloc> -> \"__wbindgen_malloc\"\n  - func[38] <__wbindgen_realloc>\
  \ -> \"__wbindgen_realloc\"\n```\n\n这包括一个 Memory 实例、我们导出的方法和一些内存分配函数。\n\n最后一步是像示例\
  \ 10-11 中那样从 HTML 和 JavaScript 调用 ES6 模块。\n\n#### 示例 10-11. 从 JavaScript 调用 Rust\n\
  \n```\n<!DOCTYPE html>\n<html>\n    <head>\n        <meta charset=\"utf-8\">\n \
  \       <title>hello-wasm-bindgen Example</title>\n    </head>\n    <body>\n   \
  \     <script type=\"module\">\n            import init, {say_hello} from \"./pkg/hello_wasm_bindgen.js\"\
  ;\n            init()\n                .then(() => {\n                    say_hello(\"\
  Rust\", \"JavaScript\");\n                });\n        </script>\n    </body>\n\
  </html>\n```\n\n如果你像之前那样通过 HTTP 提供 HTML 文件，你应该会看到如图 10-2 所示的结果。这是 JavaScript 通过\
  \ wasm-bindgen 生成的导出函数调用 Rust，而 Rust 又通过 wasm-bindgen 生成的 Rust 包装器回调到 JavaScript\
  \ 中的浏览器功能。\n\n\n\n\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_213_0.png)\n\nFigure\
  \ 10-2. Calling JavaScript from Rust from JavaScript\n\n尽管结果看似平凡，但这是一个令人非常满意的结果，因为在这两种语言之间生成的桥接从任一侧看都非常自然。只是在\
  \ Rust 中思考字符串切片要容易得多，而不是像我们之前必须做的那样将字节写入内存实例。\n\n好了，现在基础部分已经掌握，让我们尝试一些更有趣的东西。我非常喜欢\
  \ Rust 的一个特性就是它的模式匹配支持。其他语言也有这个功能，但我真的很喜欢 Rust 的实现方式。请查看示例 10-12。你会首先看到一个块上带有 #[wasm_bindgen]\
  \ 属性，表示我们希望从 JavaScript 调用一个名为 log() 的方法。注意带有 js_namespace 为 console 的第二个内部属性。这展示了我们如何借助\
  \ wasm-bindgen 直接从 Rust 调用 console.log()。\n\n#### Example 10-12. Rust Pattern Matching\
  \ in Action\n\n```\nuse wasm_bindgen::prelude::*;\n```\n\n```\n#[wasm_bindgen]\n\
  extern \"C\" {\n    #[wasm_bindgen(js_namespace = console)]\n    fn log(s: &str);\n\
  }\n\n#[wasm_bindgen]\npub fn describe_location( lat : f32, lon : f32 ) {\n    let\
  \ i_lat = lat as i32;\n    let i_lon = lon as i32;\n\n    use std::cmp::Ordering::*;\n\
  \n    let relative_position = match(i_lat.cmp(&38), i_lon.cmp(&-121)) {\n      \
  \  (Equal, Equal) => \"very close!\",\n        (Equal, Greater) => \"east of me\"\
  ,\n        (Equal, Less) => \"west of me\",\n        (Less, Equal) => \"south of\
  \ me\",\n        (Less, Greater) => \"southeast of me\",\n        (Less, Less) =>\
  \ \"southwest of me\",\n        (Greater, Equal) => \"north of me\",\n        (Greater,\
  \ Greater) => \"northeast of me\",\n        (Greater, Less) => \"northwest of me\"\
  \n    };\n\n    log(&format!(\"You are {}!\", relative_position));\n}\n```\n\n在\
  \ Rust 中可以使用 log() 方法后，我们定义了一个名为 describe_location() 的函数，它接受两个 f32 用于与我家的大致位置进行比较。为了简化比较并且不泄露太多关于我所在位置的细节，我只比较我当前位置的整数部分（38N，-121W）。为此，我将传入的浮点数强制转换为整数，然后导入允许我比较整数的功能。截断后的\
  \ i_lat 值与我的纬度进行比较，i_lon 值与我的经度进行比较。结果被放入一个 Rust 元组中，这类似于 Python 元组，是将一个或多个值放入单个结构中的轻量级方法。\n\
  \n然后元组中的值与将另一个位置与我的位置进行比较时的各种可能性进行匹配。如果 cmp() 返回两个 Equal 值，则该位置在我附近。如果纬度相等但经度不相等，则另一个位置在我东侧或西侧。我们在这里拥有的是处理九种不同情况的一种极其紧凑但可读性很强的方式。如果这被表达为一堆嵌套的\
  \ if-then 子句，可读性会困难得多。\n\n一旦生成了相对位置的描述，我们就会调用 log 函数来打印结果。由于这最终是 console.log() 函数，结果将打印在浏览器开发者控制台中。\n\
  \n下一步是构建我们的包以在 HTML 和 JavaScript 中导入。\n\n```\nbrian@tweezer ~/s/geo-example> wasm-pack\
  \ build --target web\n[INFO]: Checking for the Wasm target...\n[INFO]: Compiling\
  \ to Wasm...\n    Compiling geo-example v0.1.0 (/Users/brian/src/geo-example)\n\
  \    Finished release [optimized] target(s) in 0.51s\n[INFO]: Optimizing wasm binaries\
  \ with `wasm-opt`...\n[INFO]: Done in 1.01s\n[INFO]: Your wasm pkg is ready to publish\
  \ at\n/Users/brian/src/geo-example/pkg.\n```\n\n在示例 10-13 中，我们看到用于调用我们行为的 HTML 和\
  \ JavaScript。我们导入函数然后调用一个 JavaScript 函数来测试浏览器上是否可用 geolocation 对象。如果存在，我们请求当前位置，这会触发用户批准的弹出窗口。如果获得位置，结果将显示为占位段落元素的\
  \ innerText，并且我们调用 Rust 中的 describe_location() 方法进行模式匹配。\n\n#### Example 10-13.\
  \ Calling the Rust pattern matching from HTML\n\n```\n<!DOCTYPE html>\n<html>\n\
  \  <head>\n    <meta charset=\"utf-8\">\n    <title>parsing-example</title>\n  </head>\n\
  \  <body>\n    <script type=\"module\">\n      import init, {describe_location}\
  \ from \"./pkg/parsing_example.js\";\n```\n\n```\ninit()\n    .then(() => {\n  \
  \      getLocation();\n    });\n\nvar output = document.getElementById(\"output\"\
  );\n\nfunction getLocation() {\n    if (navigator.geolocation) {\n        navigator.geolocation.getCurrentPosition(showPosition);\n\
  \    } else {\n        output.innerHTML = \"This browser doesn't support Geolocation.\"\
  ;\n    }\n}\n\nfunction showPosition(position) {\n    output.innerHTML = \"Your\
  \ position:\" +\n        \"<br>Latitude: \" + position.coords.latitude +\n     \
  \   \"<br>Longitude: \" + position.coords.longitude;\n\n    describe_location(position.coords.latitude,\n\
  \    position.coords.longitude);\n}\n</script>\n<p>Open up your JavaScript console\
  \ and allow the browser to see your location</p>\n<p id=\"output\"></p>\n</body>\n\
  </html>\n```\n\n执行此代码的结果如图 10-3 所示。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_217_0.png)\n\
  \nFigure 10-3. Pattern matching geolocations from JavaScript in Rust\n\n### Designing\
  \ Code For In and Out of the Browser\n\n我想介绍的最后一个部分是另一个我认为会越来越流行的 WebAssembly 用例。我们已经研究了使用\
  \ JavaScript 以外的语言来定位浏览器。我们也讨论了在浏览器运行时中重用现有代码的场景。但如果代码本身就是设计为在浏览器内外运行呢？我认为一旦更多人熟悉\
  \ WebAssembly 所提供的内容，这将成为一个越来越常见的场景。\n\n只要我关注 WebAssembly，我就一直期待这种活动，但我对 Emil Ernerfeldt\
  \ 的 egui 库⁷ 进展得有多远感到惊讶。他将该项目描述为“纯 Rust 中的易于使用的即时模式 GUI”⁸ 基本上，它是一个复杂的用户界面库，可在浏览器内外使用。\n\
  \n我们在本章中多次提到，Rust 得益于其 LLVM  heritage，可以发出各种后端目标。Emil 也正是利用这一点让它发挥作用。但他做得非常优雅，我认为可以从他所做的事情中学到很多。他实现细节的完整内容超出了本章范围，但如果您有兴趣做类似的事情，我想引起您对该项目的注意。\n\
  \n首先，让我们看看他的应用作为原生应用程序运行的效果。如果您使用 Linux，您必须安装 GitHub 站点上列出的几个额外包，但之后，您只需运行：\n\n\

  \ const char* format, ...);\n    int vsnprintf(char* buffer, size_t count, const\
  \ char* format, va_list va);\n\n    void* malloc(size_t amount);\n    void* realloc(void\
  \ *ptr, size_t size);\n    void* calloc(size_t num, size_t size);\n```\n\n```\n\
  void free(void* mem);\n}\n```\n\n```\n#endif\n```\n\n回顾示例 5-12，我们有一个名为 get_memory_for_int_array()\
  \ 的方法，它接受一个 size 参数来告诉我们分配多少内存。如果你仔细查看实现，它正在使用 C++ 的 new 操作符。对于我们的目的，只需假设这意味着与 malloc()\
  \ 调用相同。free_memory_for_int_array() 函数通过使用 delete 操作符在作用上类似于 free() 调用。\n\n有一个 #define\
  \ 宏为这些函数提供外部可见性，这将确保它们可供将调用它们的 JavaScript 代码使用。\n\n我们接下来有一个提供归并排序¹¹ 实现的函数，以及另一个反转数字数组的函数。\n\
  \nC/C++ 应用程序和库的构建系统不如例如 Rust 的 cargo 命令那样现代和友好，但它们是坚固且灵活的。我们将使用一个简单的基于 Makefile\

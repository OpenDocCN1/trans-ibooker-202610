- "## 第 15 章 应用 WebAssembly：在云端和边缘\n\n### 给早期发布读者的说明\n\n使用 Early Release 电子书，你可以在官方发布这些书名之前很久就利用这些技术——作者在写作时的原始未编辑内容。\n\
  \n这将是最终书籍的第 15 章。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系作者 wasmbook@bosatsu.net。\n\
  \n> 我已从两边看过云朵\n> 从上到下，仍然不知为何\n> 我回忆的是云的幻象\n> 我真的完全不了解云朵\n> \n> ——Joni Mitchell\n\
  \n鉴于当今云计算倡议的流行和普遍性，以一句关于不理解云的引言开始本章似乎很奇怪。如果我们诚实地说，我认为可以公平地说很多人并不了解使用云计算的全部范围。显而易见的是速度提升和轻松启动实例，与通常难以承受的采购物理硬件系统的场景形成对比。但云中的一切策略和云中无物一样愚蠢。\n\
  \n你思考云策略的真正驱动因素不应仅仅是采购和开发者生产力，尽管这些都是重要考虑因素。更普遍的想法是考虑计算的成本。这是一个比看起来更复杂的计算，既体现在我所说的“成本”和“计算”上。在本章中，我将重点关注我们运行计算的位置正在迅速变化，以及\
  \ WebAssembly 将如何成为其中的关键部分。\n\n### 一个简短的个人插曲\n\n在我职业生涯早期，我是 Parabon¹ 公司的第一批员工之一。我们构建了一个互联网分布式计算平台，以聚合世界各地计算机上的空闲时间。请记住那是云计算之前。在将我们的引擎及其基于\
  \ Java 的核心为了安全移植到八个平台之外，我们还构建了客户端 API、用于调度工作的服务器基础设施以及半打或更多垂直应用来使用它。我们运行的任务类型包括线性扩展的基因序列比较、用于穷举回归搜索的基于遗传算法的特征选择，以及基于蒙特卡洛的渲染系统。\n\
  \n这一举措的全部意义在于在计算能力上寻找套利机会。组织没有为其峰值需求购买足够的计算能力，因此在计算上能处理的任务存在上限。我们为一类已知为“尴尬并行”问题²\
  \ 提供了弹性能力。客户可以根据需要解决特定问题而请求任意多或少的计算资源。这给了他们一个旋钮，可以根据需求产生边际成本。\n\n在进行穷举搜索时，这使他们能够包含通常没有资源分析的更多特征。这在一例中帮助了一家制药公司找出为什么某种疗法对某些患者有效而对其他患者无效。另一个很好的匹配例子是\
  \ NASA 的一名顾问，他能够将模拟从在正常情况下可用的设备上花费九个月，缩短到在我们的平台上只需四到五小时。为了实现在各种操作系统之间的可移植性以及我们承诺给计算提供者的保护，他必须将代码从\
  \ Fortran 移植到 Java。虽然 Fortran 在与当时 Sun 的新语言的直接竞争中可以轻松击败它，但我们会通过并行化弥补。\n\n即使有尴尬并行问题约束的限制，鉴于当时宽带部署的情况，数据密集型任务如数字渲染并不适合我们的平台。计算与数据之比太低。将数据送到所需位置在时间和带宽方面成本太高。我们从根本上提供的是计算中介形式。即使在当时，我也觉得需要更多东西才能真正提供最大价值，但云计算尚未出现，无法为我们提供资源虚拟化的更完整愿景。\n\
  \n另一个推动我思考的工作经历是我在视频游戏行业的时间。我参与了一款基于另一款拥有 4000 万用户的游戏的游戏开发，所以我们相当确定需要扩展。把所有东西都放到云中成本会过高，因此我们运行了我们购买和设置的混合数据中心设备，然后使用云服务作为弹性溢出。同样，我们只在需要时使用额外资源，并且不必为其全天候运行付费。\n\
  \n### 我们的行业在演进\n\n有了这一背景，当我谈论计算的“成本”时，我指的是时间成本、金钱成本、没有弹性供应所带来的机会成本、功耗成本和延迟成本。这些都是我们今天试图最小化的成本。云计算是策略的一部分，但微服务和无服务器函数等架构设计也是如此。苹果的\
  \ M1 设计也是如此。M1 芯片中有两个 CPU，一个更注重性能，一个更注重功耗。研究人员正在分析使用机器学习策略来排序 LLVM 优化以最大化性能或最小化功耗的复杂方法。应用程序代码不会改变，只是其编译形式。\n\
  \n我们在哪里以及如何利用计算元素来解决问题，已成为成功 IT 战略的最重要方面之一。这包括高级和定制硬件，例如矢量化 CPU 指令³、图形处理单元（GPU）、现场可编程门阵列（FPGA）⁴、专用集成电路（ASIC）⁵\
  \ 和张量处理单元（TPU）⁶。每种硬件类型都有不同的能力、指令、成本和性能特征。将工作负载映射到这些元素将是实现以最小化一系列成本的方式完成计算的重要部分。\n\
  \n物理位置是成本的另一个要素，因为延迟正如你所知⁷，我们无法忽视。如果你熟悉云区域的概念或使用内容分发网络（CDN）来提供静态资源，你将理解让事物更接近用户的好处。域名系统（DNS）技巧允许根据用户所在地理区域动态选择端点。\n\
  \n边缘计算是一种新兴的服务提供，它将这些想法更进一步地结合在一起，混合了分布式计算（类似 Parabon）、云托管和地理分布资源。不同之处在于，我们不再只谈论静态资源，而是可执行代码。Web\
  \ 架构允许我们将事物推送到浏览器中。正如你所见，WebAssembly 在此用例中具有突出作用。有时你可能出于隐私原因、低延迟用户体验等原因希望在浏览器或设备上运行。其他时候，你可能不希望在用户设备上运行专有代码，但仍希望靠近。这就是边缘计算的领域。它是部署位置的连续体，跨越集中式数据中心、区域边界、服务提供商接入点边界、本地系统，\n\
  \n\n\nlocal access points, and on device. 事情已经变得有点复杂了，这本身就是一种轻描淡写的说法。\n\n隐含在这种多样化的位置中，有各种硬件架构、隐私模型、对可能敏感信息的访问以及计算能力。我们之前提到的那位\
  \ NASA 研究员（即把他的代码移植到 Java）所承受的需求，如今不太可能是一个合理的请求。这些环境需要给客户提供选择语言的自由，同时提供保护以避免他们在多租户系统中相互干扰。\n\
  \n这种位置连续体的快照视图可以在图 15-1 中看到。开发人员出于不同的原因希望能够在此景观中部署软件构件。在云中进行大型模型训练和数据分析是有价值的。结果可能不适合在移动设备或嵌入式系统上运行。一些服务可以更靠近用户以实现低延迟、更好的体验。出于知识产权保护的原因，您可能不希望将某些行为全部发送到设备上。在其他情况下，隐私法规，例如支付卡行业（PCI）、健康保险流通与责任法案（HIPAA）和通用数据保护条例（GDPR）将鼓励或要求您这样做。\n\
  \n我们有通过基于容器的环境和 Kubernetes 驱动的基础设施在云中部署可扩展基础设施的策略。在该空间中表现良好的绝大多数事物在移动设备或嵌入式系统中将完全无用。\n\
  \n![](img/16b7990eb0dbf589db177bdbd2f4a189_327_0.png)\n\n图 15-1. 位置与责任的连续体\n\nWebAssembly\
  \ 和 WASI 提供了覆盖所有这些差异的非常好的方案。我认为它们将在这一领域大放异彩，并在我们迄今为止看到的有前景的用途之外掀起热潮。我想向您介绍写作时期的一些领先项目，但完全预计这些项目在不久的将来会大幅扩展。\n\
  \n在最近的一次演讲⁸中，来自 Cosmonic 和 wasmCloud 项目（将在下面介绍）的 Liam Randall 强调了我一直在讨论的连续体。请看下面的图\
  \ 15-2。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_328_0.png)\n\n#### 图 15-2. 我们行业的演变\n\
  \n我们可以看到我们的行业随着时间的推移是如何变化的。开发人员需要负责的内容一直在缩小。我们可以依靠运行时环境提供的东西却在增长。最初，我们必须管理一切。我们必须购买硬件，安装操作系统和补丁以及任何依赖库或应用程序。保持这些系统修补是一个全职工作，并且经常会与我们系统构建所依据的内容产生不兼容。\n\
  \n诸如 Linux 和 FreeBSD 之类的开源操作系统改变了行业。以前涉及专有操作系统昂贵许可的内容变得免费。我们可以拥有任意多的副本，但根据各种硬件配置设置和配置它们的工作仍然是一项昂贵且\
  \ ripe for innovation 的活动。\n\n云的爆发引入了一个虚拟化层，我们可以在其中免受硬件细节的保护。这使我们能够以时间片使用的方式共享访问物理系统。启动各种操作系统配置的预定义镜像使满足需求变得容易，并且可以从已知的起点快速移动。这些虚拟机镜像很大、笨重，并且对于各种用途来说都是过度设计。\n\
  \n应用程序开发人员管理依赖项的负担仍然很大，但这是一个进步。\n\n我们所知的容器系统可以追溯到 1970 年代 *chroot* 系统⁹ 的种子。在 2000\
  \ 年，FreeBSD 的 Jail¹⁰ 系统出现，作为一种允许多租户主机进一步分离共享内容和每个用户独特内容的方式。这推动了人们对 Linux 控制组的兴趣和开发，多年后导致了\
  \ 2008 年 Linux Containers（LXC）的开发。Google 和 CloudFoundry 在此期间有一些产品，但最终是 Docker 于\
  \ 2013 年发布，真正推动了这一进程。\n\n总体而言，这种容器化方法允许比上一代更重的镜像更精细的虚拟化粒度。更多的基础设施可以预先定义，因此我们可以专注于安装共享库和应用程序的正确版本。\n\
  \nWebAssembly 引入了安全、稳定、可移植代码的新版本的概念，正如您所见。API 可用性仍然是一个问题，但 WASI 有助于解决这个问题。沙箱代码的概念在这种环境中变得越来越重要，不仅因为我们在第\
  \ 8 章中讨论的供应链攻击，而且因为我们希望在图 15-1 的各个层中在多租户系统中部署代码。正如 Liam 在上面链接的演讲中所提到的，随着基于能力的<|message|>\n\
  安全系统获得关注，您可能会预计这一趋势会继续下去。\n\n在最近几章中，我们探讨了应用程序通过 Wasmtime 和 Wasmer API 加载和执行可重用的\
  \ WebAssembly 模块。最终，这就是我们最终过渡的基础。这种用例有助于定义新的应用程序主机层，该层将提供支持插件、模块、扩展甚至基本功能的选择。代码需要获得批准的能力才能执行超出基本执行的操作，例如从文件系统读取、生成线程或打开网络连接。这种方法将促进各种用途，例如使用不同语言编写的插件代理和过滤器的长期运行应用程序、微服务和无服务器函数。\n\
  \n除了这种灵活的计算风格之外，这些方法的开销甚至更小，并且安全性比目前每个人都如此兴奋的容器模型更严格。这将使我们能够进入图 15-1 中突出的整个计算景观。为了强调我们讨论的潜在影响，Docker\
  \ 联合创始人 Solomon Hykes 在这些讨论中经常被引用，他说过：“如果 WASM+WASI 在 2008 年就存在，我们就不需要创建 Docker。这就是它的重要性。服务器上的\
  \ Webassembly 是计算的未来。”11 正如他随后承认的那样，这并不一定意味着 Docker 将消失，而是我们谈论的是同等重要性的事物。这两种技术很可能会找到合作的方式。\n\
  \n让我们看看这些想法如何以各种方式结合起来，为我们异构且庞大的计算未来奠定基础。我们将在下面探索一些商业和开源产品作为示例，说明现在正在考虑的内容。在我们意识到之前，肯定会有更多。\n\
  \n### Fastly Compute@Edge\n\nFastly 在过去十年中一直是一家成功的 CDN 提供商。他们是 Bytecode Alliance\
  \ 的创始成员，并最近聘用了许多来自 Mozilla 专注于 WebAssembly 和 WASI 的工程师。他们正在通过其 Compute@Edge 平台远远超越提供静态内容，进入我们正在想象的这个新世界。\n\
  \n该产品核心是 Lucet WebAssembly 编译器和运行时，该运行时正在与我们在第 11 章中提到的 Mozilla Wasmtime 项目合并。Fastly\
  \ 通过开源它并将其贡献给 Bytecode Alliance，希望通过利用各自的优势使两个运行时变得更丰富。两者都围绕 CraneLift12 项目构建，并且与\
  \ WASI 结合使用时将促进客户能够将用多种编程语言编写的功能安全地推送到 Fastly 的 Compute@Edge 环境中。\n\nLucet 运行时的一个定义特征是它能够在\
  \ 50 微秒以内实例化 WebAssembly 模块，而 V8 则需要 5 毫秒来完成同样的事情¹³。除了这种速度优势之外，它还可以以非常低的内存开销来做到这一点，以千字节而不是数十兆字节为单位衡量。\n\
  \n与 Compute@Edge 平台的交互方式与您想象的差不多。您注册一个账户并获得受令牌¹⁴保护的 API 访问权限。有命令行工具用于启动项目并将其部署到生态系统中，并具有动态\
  \ DNS 条目。目前代码可以用 Rust、AssemblyScript 或 JavaScript 编写。许多功能目前处于测试阶段，但他们正在快速推进，并且 heavily\
  \ involved 在相关技术和标准的开发和维护中。\n\n虽然部署任意代码到他们的系统需要注册要求，但由于其基于 WebAssembly，他们的 Terrarium\
  \ Platform 可以轻松地在浏览器中探索。它围绕 WebAssembly Studio¹⁵ 构建，提供了一种简单的方式来体验将功能部署到其平台的便捷性。\n\
  \n首先访问 https://wasm.fastlylabs.com。您应该会看到一个带有弹出窗口的网站，允许您选择各种项目。有面向 C、TypeScript\
  \ 和基本 Wat 代码库的空项目。还有 C 和 Rust 示例，它们执行实际工作，例如通过 HTTPS 提交 DNS 查询、图像处理、获取远程数据的天气应用、与\
  \ GitHub 通信的 GraphQL 示例以及节流代理示例。\n\n一旦您选择了其中一种项目类型，浏览器将用其关联的结构填充。在本例中，我选择了 C 中的图像处理示例。每个文件都可以探索和编辑，但我只是点击了图\
  \ 15- 中顶部的“Build & Deploy”按钮\n\n\n\n3. 请注意，它会为托管应用生成一个随机的 DNS 名称以方便使用。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_332_0.png)\n\

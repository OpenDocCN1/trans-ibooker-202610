- "## Appendix A. Installing WebAssembly Tools\n\n### A NOTE FOR EARLY RELEASE READERS\n\
  \nWith Early Release ebooks, you get books in their earliest form—the author’s raw\
  \ and unedited content as they write—so you can take advantage of these technologies\
  \ long before the official release of these titles.\n\nIf you have comments about\
  \ how we might improve the content and/or examples in this book, or if you notice\
  \ missing material within this chapter, please reach out to the author at wasmbook@bosatsu.net.\n\
  \n> Technology is nothing. What’s important is that you have a faith in people,\
  \ that they’re basically good and smart, and if you give them tools, they’ll do\
  \ wonderful things with them.\n> \n> —Steve Jobs\n\nIt is unsurprising given all\
  \ of the languages, tools and frameworks that we discuss in this book that there\
  \ is a fair amount to install. This appendix will not be comprehensive, but will\
  \ try to point you in the right direction to getting everything going. Some of the\
  \ tools are easier to install on Linux or macOS, but most should work on Windows\
  \ too.\n\n#### Installing WebAssembly Binary Toolkit (WABT)\n\nThe WebAssembly Binary\
  \ Toolkit (WABT) provides a suite of tools for converting things too and from the\
  \ various formats we have discussed as well as several others. It includes tools\
  \ for dumping out details about the modules, validating their structures and more.\n\
  \nThere are quite good instructions on the GitHub repo for building on all three\
  \ major operating systems so there is no point in replicating that here. The repo\
  \ is located here:\n\nhttps://github.com/WebAssembly/wabt\n\nOne thing I did want\
  \ to point out was that some of the tools are also available online. It shouldn’t\
  \ be too surprising that WebAssembly tools might also run in the browser. If you\
  \ want to try converting formats without installing the tools, you can try them\
  \ out here:\n\nhttps://webassembly.github.io/wabt/demo/\n\nAdditionally, there is\
  \ a spin off project called Wabt.js that allows you to use much of the functionality\
  \ from the toolkit in the browser. It’s GitHub repository is here:\n\nhttps://github.com/AssemblyScript/wabt.js/\n\
  \n#### Installing LLVM\n\nLLVM looks like it would stand for something but it doesn’t.\
  \ It’s just the name for an exceptionally cool modular compiler architecture that\
  \ serves as the basis for languages such as Rust, Swift, Julia and many more.\n\n\
  LLVM is able to emit platform-specific codes even for different platforms if you\
  \ install the correct tooling. It is also useful for experimenting with optimizations,\
  \ running the intermediate form in a virtual machine and producing WebAssembly.\n\
  \nI highly recommend you install LLVM through one of the installers rather than\
  \ building it from scratch as it takes forever and consumes an obscene amount of\
  \ disk space. Depending on your OS, you may already have a version installed. The\
  \ macOS toolchain is LLVM-based, but that version does not yet interoperate with\
  \ WebAssembly.\n\nThe main website is here:\nhttps://llvm.org\n\nThere are installers\
  \ for most major operating systems so you should not have difficulty finding one\
  \ that will work.\n\n#### Installing Emscripten\n\nThe Emscripten toolchain is a\
  \ set of tools that wrap the LLVM tools. Originally it emitted asm.js, but now it\
  \ supports WebAssembly directly. In addition to assisting with compiling existing\
  \ C and C++ code, it has drop in replacements for other command line tools for building\
  \ software such as Make and configure.\n\nWith its macros and compiler directives,\
  \ it is fairly straightforward to simplify communicating between JavaScript host\
  \ environments in the browser or Node.js. It has support for widely-used dependencies\
  \ like the standard library and OpenGL.\n\nThe getting started guide has good instructions\
  \ for multiple operating systems so your best bet will be to investigate this site:\n\
  https://emscripten.org/docs/getting_started/index.html\n\n#### Installing Wasm3\n\
  \nWasm3 bills itself as “The fastest WebAssembly interpreter, and the most universal\
  \ runtime.”\n\nThe GitHub repo is here:\nhttps://github.com/wasm3/wasm3\n\nGiven\
  \ the variety of platforms it runs on and languages it works with, I am not going\
  \ to challenge them on that. It currently runs on:\n\n- Linux, Windows, macOS, FreeBSD,\
  \ Android, iOS\n- OpenWrt, Yocto, Buildroot (network equipment)\n- Raspberry Pi\
  \ and other Single Board Computers\n- A variety of microcontrollers\n- Most modern\
  \ Browsers\n\nIt is also doing a good job of tracking the various new proposals.\n\
  \nIt is easy enough to build from source, but there are several installers documented\
  \ here:\n\nhttps://github.com/wasm3/wasm3/blob/main/docs/Installation.md\n\nI also\
  \ encourage you to check out the helpful cookbook here:\n\nhttps://github.com/wasm3/wasm3/blob/main/docs/Cookbook.md\n\
  \n#### Installing WasmTime\n\nWasmtime was originally a Mozilla project but is maintained\
  \ by the Bytecode Alliance these days. They refer to it as “a standalone wasm-only\
  \ optimizing runtime for WebAssembly and WASI”.\n\nIt is one of the most up-to-date\
  \ runtimes for the various proposals and has an extensive set of programmatic libraries\
  \ as you have seen throughout the book.\n\nThere is quite extensive documentation\
  \ here:\n\nhttps://docs.wasmtime.dev\n\nYou can find installation instructions here:\n\
  \nhttps://docs.wasmtime.dev/cli-install.html\n\n#### Installing Wasmer\n\nWasmer\
  \ was one of the first non-browser and non-Node.js WebAssembly runtimes I encountered.\
  \ It pre-dated WASI but quickly added support.\n\n\n\n\n\nWasmer 的主网站是：\n\nhttps://wasmer.io\n\
  \n除了作为独立运行时之外，它还支持以下语言的集成：\n\n- Rust\n- C 和 C++\n- JavaScript\n- Go\n- Python\n\
  - PHP\n- Ruby\n\n它还维护着 WebAssembly 包管理器（WAPM）、WebAssembly.sh 以及 Wasienv 工具包。\n\n\
  一个非常适合入门并安装运行时的好地方是他们优秀的文档，链接如下：\n\nhttps://docs.wasmer.io/ecosystem/wasmer/getting-started\n\
  \n### 安装 Rust 工具\n\nRust 在 WebAssembly 生态系统中显然占有重要地位，但它本身作为一种安全、快速且采用率迅速增长的编程语言也大有可言。\n\
  \n主网站是：\n\nhttps://rust-lang.org\n\n你通常会想要使用 rustup 工具来管理你的 Rust 工具链。他们支持 nightly、beta\
  \ 和 stable 版本。根据你自己的舒适程度或对最新功能的渴望，你可以快速轻松地在已安装的各个通道之间切换。随时安装多个通道也很简单。如果你有兴趣进行交叉编译，也可以安装其他架构的后端。\n\
  \n首先安装此处记录的 rustup 工具链：\n\nhttps://www.rust-lang.org/tools/install\n\n要直接生成 WebAssembly，你必须安装后端。你可以选择任意通道，但要安装\
  \ nightly WebAssembly 后端，你可以这样做：\n\n```\n~/s/r/wasm> rustup target add wasm32-unknown-unknown\
  \ --toolchain nightly\n```\n\n如果没有将其设为默认工具链，在编译 Rust 时使用后端，你可以这样做：\n\n```\n~/s/r/wasm>\
  \ rustc +nightly --target wasm32-unknown-unknown \\\n  -O --crate-type=cdylib add.rs\
  \ -o add.wasm\n```\n\n要生成 WASI 代码，你需要安装 WASI 后端：\n\n```\n~/s/r/wasm> rustup target\
  \ add wasm32-wasi --toolchain nightly\n```\n\n如果它不是默认工具链，使用它：\n\n```\n~/s/r/wasm>\
  \ rustc hello.rs --target wasm32-wasi\n```\n\n请注意，常规 Rust 原生后端、常规 WebAssembly 和\
  \ WASI 后端是不同的，具体取决于你想要的目标。\n\n如果你想在 Rust 和 JavaScript 之间无缝交互，你可能需要安装 wasm-bindgen。\n\
  \n该工具的优秀介绍在这里：\n\nhttps://rustwasm.github.io/wasm-bindgen/\n\n安装了 Rust 工具后，你应该可以用以下命令安装它：\n\
  \n```\n~/s/rust> cargo install -f wasm-bindgen-cli\n```\n\n### 安装 Dotnet 工具\n\n\
  正如你在书中所看到的，.NET 已成为一个强大的 WebAssembly 环境，特别是现在它已跨平台。\n\n好消息是安装起来非常简单。主要操作系统的说明位于此处：\n\
  \nhttps://dotnet.microsoft.com/download\n\n安装完成后，你应该能够运行我们在书中介绍的命令行示例。\n\n### 安装\
  \ AssemblyScript\n\nAssemblyScript 正在 WebAssembly 世界中崭露头角。它在过去和未来之间取得了很好的平衡。你不必学习\
  \ C 或 C++ 代码，可以留在相对熟悉的语言空间中，同时仍然生成更高性能的软件。\n\n主网站在这里：\n\nhttps://www.assemblyscript.org\n\
  \n安装说明在这里：\n\nhttps://www.assemblyscript.org/quick-start.html\n\n### 安装 IPFS\n\n\
  星际文件系统（IPFS）与 WebAssembly 并无直接关系，但作为去中心化领域的关键参与者，它们有几个交集的地方。我在书中强调了一个例子。\n\n如果你想了解更多关于该项目的信息，网站在这里：\n\
  \nhttps://ipfs.io\n\n安装选项有多种，详细说明在这里：\nhttps://ipfs.io/#install\n\n### 安装 TinyGo\n\
  \n正如我在上一章所指出的，TinyGo 正在成为 Go 与 WebAssembly 集成的一个不错的起点，同时它还支持微控制器和其他嵌入式系统。\n\n主网站在这里：\n\
  https://tinygo.org\n\n在各种操作系统或 Docker 上安装的说明可在以下位置获得：\nhttps://tinygo.org/getting-started/install/\n\
  \n### 安装 Artichoke\n\nArtichoke 是将 Ruby 带入 WebAssembly 派对的一个引人注目的开端。还处于早期阶段，但正如我提到的，他们正在寻找贡献者。\n\
  \n你可以在这里找到安装说明：\nhttps://www.artichokeruby.org/install/\n\n### 安装 SwiftWasm\n\n\
  SwiftWasm 也处于早期阶段，但对于这种日益有趣的、已摆脱 macOS 起源的语言来说，它显示出很大的潜力。各种安装选项可在以下位置获得：\nhttps://book.swiftwasm.org/getting-started/setup.html\n\
  \n### 安装 Zig 和 Grain\n\nZig 和 Grain 都是引人注目的新语言。它们是我非常感兴趣深入研究的语言。虽然它们的使用范围还远不广泛，但兴趣正在增长。它们拥有强大的新兴\
  \ WebAssembly 策略这一事实可能会迅速放大它们的影响，因为在许多情况下你不需要新的运行时工具。\n\n尽管它们是分开且无关的，我将它们捆绑在一起，因为我认为它们发挥相似的作用并且处于相似的阶段。\n\
  \n我鼓励你进一步深入研究两者。\n\nZig 可在此处获得：\n\nhttps://ziglang.org/download/\n\nGrain 可在此处获得：\n\
  \nhttps://grain-lang.org/docs/getting_grain\n"

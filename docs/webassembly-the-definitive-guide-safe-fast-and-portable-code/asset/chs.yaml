- "## 第 16 章。应用 WebAssembly：去中心化应用\n\n### 早期发布读者须知\n\n凭借 Early Release 电子书，您可以在这些书籍的正式发布之前很久就利用这些技术——作者在写作时的原始未编辑内容，以便您能够在这些标题的正式发布之前就利用这些技术。\n\
  \n这将是最终书籍的第 16 章。\n\n如果您对我们如何改进本书的内容和/或示例有任何评论，或者如果您注意到本章中缺少材料，请联系作者 wasmbook@bosatsu.net。\n\
  \n> 当代技术确实允许去中心化，它也允许中心化。这取决于你如何使用技术。\n> —Noam Chomsky\n\n我们编写的软件根据部署的位置和方式承担不同的角色。传统系统通常是单一应用，接收输入，进行一些处理并产生输出。Unix\
  \ 命令通常是协调在一起形成脚本化工作流的工具。在本书中，我们主要讨论了 WebAssembly 在客户端用户界面的优势，并偶尔涉足服务器端技术。如今，我们的软件在云中扮演许多其他角色，通过微服务架构、在嵌入式系统和移动设备中，以及无服务器函数。\n\
  \n这些不同的角色通常在架构上服务于一个目的，试图管理变化，允许独立的技术选择，满足规模需求或促进重用和避免孤岛。分散元素如何组织和协调存在内在的张力。大多数传统系统都是集中管理的，但我们看到开发人员能够将广泛部署的去中心化系统驯服为生产性使用的能力不断增强。让我们先讨论一些权衡。\n\
  \n### 集中化 vs 去中心化\n\n我们的行业长期在集中化和去中心化之间摇摆。两种安排都不是理想的，各自都有好处和负面影响。集中化易于控制、索引、优化并提供统一体验。去中心化可以稳定、赋权且抗审查。大中型机、托管服务和信息孤岛式社交媒体网站是集中化的例子。个人电脑、移动设备和文件共享系统是去中心化类型的例子。\n\
  \n拒绝人们访问集中化资源很容易。如果不维护，它们通常很脆弱。许多政府试图通过控制信息访问来控制某些思想的访问。去中心化系统很难变得有用、高效，并且避免市场压力，这些压力最终会在某个时候鼓励重新集中化。\n\
  \nWeb 总体上在两种力量之间取得了相当不错的平衡。一方面，任何人都可以发明一种新协议并在端口上监听与其通信的客户端。直到我们引入命名之前，没有必要的集中化。域名系统（DNS）具有集中取向。尽管为了速度和便利而在层级上分散，但仍存在权威。一旦你拥有域名，你就可以在该域中创建任意多的资源。你可以自由共享它们并授予你选择的任何人访问权限。但是，DNS\
  \ 也可以被控制，正如那些在咖啡店、飞机上或压迫性政权国家使用 WiFi 的人所悲伤地发现的那样。\n\n\n\n\n\n问题的一部分在于使用基于位置的身份标识。一方面，能够通过\
  \ HTTP 协议连接的名称是我们将要交互的事物，这非常有用。另一方面，如果我们决定停止托管这些资源，它们就会消失。在我之前关于资源导向架构模式¹的书中，我将策展的\
  \ URI 模式识别为为交互带来稳定性的方式。但正如任何遇到过损坏链接的人都可以证明的那样，这种做法并不被广泛采用。\n\n网络的一个好处是，内容生产者和内容消费者在很大程度上可以自行选择技术。通过使用标准，我们可以交换声明性结构来定义布局和样式选择，这些选择在各种目标上都能很好地工作。Javascript\
  \ 很早就成为这个故事的一部分，现在，正如你所见，WebAssembly 也是如此。\n\n去中心化受益于对标准、协议和工程实践的一致使用，这些标准、协议和工程实践允许任意参与者交换内容。能够以可移植、安全和高效的方式交换可执行内容将拓宽可能性的范围。\n\
  \n当我们在 Parabon 构建分布式计算系统时，我们不得不依赖 Java 语言和平台，以便获得我们需要的<|message|>安全和可移植性保证。我们最终是一个集中控制的平台，但在现代环境中，使用\
  \ WebAssembly、WASI 以及我们讨论过的各种运行时，构建类似的去中心化系统是相当直接的。在上一章中，我们看到这如何帮助演进我们的计算格局。正如 Chomsky\
  \ 所说，我们可以支持任一方法；我们做什么由我们决定。\n\n我们现在将讨论一些去中心化平台，包括：\n\n- Bitcoin and Legacy Ethereum\n\
  - ewasm\n- The Polkadot Network\n- The Interplanetary File System (IPFS)\n\n###\
  \ From Bitcoin to Ethereum\n\n去中心化系统的代表之一尤其是 Bitcoin 以及加密货币²一般而言。尽管有过度的炒作和负面的唱衰，Satoshi\
  \ Nakamoto 设计到系统中的东西从技术和社会角度来看是相当了不起的。讨论一项技术的整体性时需要考虑许多未被计入的外部性，但我想专注于与手头主题相关的内容。\n\
  \n除了明显的货币概念之外，Bitcoin 系统充满了可以驱动利益相关者行为的经济杠杆。其主要成就是开发了一种共识机制，允许参与者在无需真实身份或薄弱信任概念的情况下就规则及其执行达成一致。到现在，大多数人都知道它是如何工作的，但为了清晰起见，我将简要总结它，作为现代区块链思维的基础。我们将在讨论作为后续平台的\
  \ Ethereum 时将其与 WebAssembly 联系起来。\n\nBitcoin 有一个最大货币基数将被释放。它使用计算困难的问题来控制货币随时间递减的稳定释放。大约每十分钟左右，生态系统就会增加一点，但随着时间的推移，它正在逐渐减少。矿工验证平台上执行的所有交易。这是他们的主要目的。但作为回报，他们可以参与一个循环的谜题来找到哈希问题的解决方案。随着更多矿工参与，攻击问题的能力就越强，所以它会随着时间的推移变得更困难。在当前形式下，单台计算机独自解决一轮需要数十万年。\n\
  \n没有人有那种时间，所以他们通过矿池并行合作在几分钟内找到它。找到它的节点会将其解决方案告知其他矿工，其他矿工验证结果。一旦大家就结果达成共识，这就使该节点有权授予自己\
  \ CoinBase 交易³，该交易将与矿池同伴共享。获胜节点还必须决定哪些其他交易将进入当前区块，然后将其链接回之前的区块。这就是区块链名称的由来。\n\n\
  实际上在节点上运行的东西相当受限。它是大量的哈希交易、通信协议以及涉及执行一种名为 Script 的小型类似 Forth⁴语言的交易验证。这主要只是验证将 Bitcoin\
  \ 发送到另一个账户的账户是否控制着与该账户关联的私钥。实际上没什么大不了，也没什么别的可以做的。有一些回旋余地，但它是有意受限的语言，因此易于在多个平台上支持。\n\
  \n我解释 Parabon 在做什么的一种方式是，它就像 Seti@Home 项目⁵一样，只是它是基于 Java 的通用预先编程解决方案。后者的区别在于 SETI@Home\
  \ 最初只做一件事⁶。它只是分块处理数据。因此，他们可以相当放心地使用别人的电脑，因为它只做固定数量的任务。\n\n正如我在第 15 章中指出的那样，我们在平台上运行什么问题方面实际上受到特定类型的限制，但实际代码可以是我们允许的任何内容（即无磁盘或网络访问）。我们做了素数搜索、线性扩展的基因序列比较、机器学习、电离层模拟等等。由于我是公司的第一位工程师，我被问到的一个问题是“你如何控制失控的进程？”我们使用别人的电脑，但我们正在考虑允许客户端运行任意代码。这就是我们面临的安全代码安装在我们的电脑、手机、平板电脑和手表上的同样困境。\n\
  \nBitcoin 核心开发者希望矿工节点上可能发生的事情保持受限，更像 SETI@Home。Vitalik Buterin 和其他人希望平台上可以运行的内容得以扩展。当很明显这不可能时，Ethereum\
  \ 项目因此而出现。两个项目之间的主要区别之一是关于节点上将运行什么的性质。Ethereum 开发者想要一种图灵完备语言⁷。撇开大量理论不谈，这又回到了失控任务的问题。所以，让我们快速绕道谈谈这个问题。\n\
  \n### How do you solve a problem like The Halting Problem?\n\n如果我们想在计算平台上运行任意任务，有两种方法来确定代码是否最终会停止。一种是推理它，另一种是尝试它，不幸的副作用是可能要等到宇宙热寂发生之前我们才能回答这个问题。其中一个可能比另一个更难，而事实证明，它不是尝试和等待（尽管这仍然不推荐）。\n\
  \n在可计算性理论中，这被称为不可判定问题⁸，这是 Bitcoin 开发者对运行图灵完备语言的想法不感兴趣的原因之一。如果你要为使用别人的电脑的时间付费，知道程序是否会结束会很好⁹。\n\
  \n然而并非一切都丢失。Ethereum 平台上的矿工节点必须运行任意合约代码。你使用的计算资源越多（存储、CPU 时间等），你就必须支付越多。启动一个合约执行并让它运行几个千年，然后才意识到你永远不会为这项工作得到报酬，这会非常令人恼火。Ethereum\
  \ 团队提出了一个很好的解决方案，称为“gas”。想法是如果你想跨国驾驶，你最好有足够的钱买汽油。否则，在中途你会耗尽汽油，你可能会被困住。Ethereum 合约会通过快速启发式方法评估其运行的大致成本，启动合约的客户端必须支付这么多或更多。随着合约执行，它会消耗\
  \ gas 并可能耗尽。如果耗尽，节点会得到努力的补偿，而你可能一无所有。这是对一个\n\n\n\notherwise intractable problem.\
  \ It also simultaneously forces contract developers to exercise caution and test\
  \ their code locally.\n\nThe Ethereum project also intended to run on a variety\
  \ of hardware and software platforms so the code that gets executed made sense to\
  \ be virtualized. They designed a handful of contract languages, but the one that\
  \ caught on initially was called Solidity. It has an LLVM-based compiler, but it\
  \ emits a bytecode that can run on their custom virtual machine. As you can imagine,\
  \ this was a non-trivial engine to write so, as WebAssembly emerged, there became\
  \ a lot of interest in migrating to a new virtual machine that they would not have\
  \ to maintain.\n\nThe concept of gas is still important, however. As WebAssembly\
  \ is being imagined as the engine for several blockchain-based projects, it is unsurprising\
  \ that the idea has begun to show up in the platforms we are discussing as well.\n\
  \nIn Example 16-1 you can see a simple implementation that calculates Fibonacci\
  \ numbers directly in Wat taken from the WasmTime GitHub repository. If you need\
  \ a refresher on the algorithm, check out our example in Chapter 4.\n\n#### Example\
  \ 16-1. Wat implementation of Fibonacci numbers\n\n```\n(module\n  (func $fibonacci\
  \ (param $n i32) (result i32)\n    (if\n      (i32.lt_s (local.get $n) (i32.const\
  \ 2))\n      (return (local.get $n))\n    )\n    (i32.add\n      (call $fibonacci\
  \ (i32.sub (local.get $n) (i32.const 1)))\n      (call $fibonacci (i32.sub (local.get\
  \ $n) (i32.const 2)))\n    )\n  )\n  (export \"fibonacci\" (func $fibonacci))\n\
  )\n```\n\nNotice there is no concept of time or cost in this calculation. It is\
  \ recursive but it will just do what you ask it to do. While this is not an excessively\
  \ hungry calculation, you could keep a node busy calculating a large number of Fibonacci\
  \ numbers. What we would like is a concept like gas that allows us to do what we\
  \ want to do, but to measure the cost and to cut it off if it exceeds that cost.\n\
  \nThe code in Example 16-2 is able to do this because Wasmtime supports the concept\
  \ of “fuel”. Remember that Store instances are keepers of the runtime instance details,\
  \ so we allocate 10,000 fuel units in the store. We instantiate a compiled version\
  \ of our .wat file as a module so we can invoke the fibonacci() function.\n\n####\
  \ Example 16-2. Rust Wasmtime example with fuel\n\n```\nuse anyhow::Result;\nuse\
  \ wasmtime::*;\n\nfn main() -> Result<()> {\n    let mut config = Config::new();\n\
  \    config.consume_fuel(true);\n    let engine = Engine::new(&config)?;\n    let\
  \ mut store = Store::new(&engine, ());\n    store.add_fuel(10_000)?;\n    let module\
  \ = Module::from_file(store.engine(),\n\"examples/fuel.wat\")?;\n    let instance\
  \ = Instance::new(&mut store, &module, &[])?;\n\n    // Invoke `fibonacci` export\
  \ with higher and higher numbers until we\n    // exhaust our fuel.\n    let fibonacci\n\
  \        = instance.get_typed_func::<i32, i32, _>(&mut store,\n\"fibonacci\")?;\n\
  \n    for n in 1.. {\n        let fuel_before = store.fuel_consumed().unwrap();\n\
  \        let output = match fibonacci.call(&mut store, n) {\n            Ok(v) =>\
  \ v,\n            Err(_) => {\n                println!(\"Exhausted fuel computing\
  \ fib({})\", n);\n                break;\n            }\n        };\n        let\
  \ fuel_consumed = store.fuel_consumed().unwrap() -\n        fuel_before;\n     \
  \   println!(\"fib({}) = {} [consumed {} fuel]\", n, output,\n        fuel_consumed);\n\
  \        store.add_fuel(fuel_consumed)?;\n    }\n}\n```\n```\n}\n    Ok(())\n}\n\
  ```\n\nOnce we have the instance, we start an unbounded loop of n from 1 to infinity.\
  \ Clearly we do not want to wait for this code to complete on its own. So, we are\
  \ going to leverage fuel. Individual instructions are calibrated as having a cost,\
  \ so we keep track of how much we spend each iteration and subtract it from our\
  \ available fuel deposit. Once we run out, our attempt to invoke the function will\
  \ fail and break out of the loop.\n\nSo, we have a general capability that can be\
  \ built into various runtimes to allow us to run arbitrary code safely without concern\
  \ about whether it will spin out of control or not. Building a generic blockchain\
  \ engine out of this capability is clearly one potential use.\n\n### ewasm\n\nThe\
  \ legacy Ethereum Virtual Machine is referred to as EVM1. The new version is known\
  \ as ewasm. The documentation and design process are available here: https://ewasm.readthedocs.io.\
  \ This is a work in progress and there have been many changes along the way, but\
  \ the goal is still to create a new virtual machine on a WebAssembly base for all\
  \ of the reasons that should be obvious by now. One consequence that may not be\
  \ obvious is that this will likely open up contract languages to a much wider given\
  \ the ease with which LLVM-based compilers can be reused.\n\nThey did not come to\
  \ this decision lightly. As can be seen on the “Comparison with Other Architectures”\
  \ section of the documentation linked above, they considered all manner of intermediate\
  \ representations and bytecode formats as the possible basis for this new virtual\
  \ machine.\n\nThe main arguments for heading down this path are obviously speed,\
  \ efficiency, and security. We are talking about a standards-based instruction set\
  \ which will be curated and extended over time by the W3C. The Ethereum community\
  \ will benefit from this work and will not have to make all of the design decisions\
  \ themselves. The widespread and growing\n\ntoolchain support for a wider number\
  \ of languages is going to create a natural path for using languages that developers\
  \ are already familiar with such as C/C++, Rust, Go, AssemblyScript, and more (including\
  \ some new ones we will discuss in the final chapter!).\n\nWebAssembly is intrinsically\
  \ portable which will also reduce the burden on the Ethereum developer community\
  \ to target an increasing number of hardware platforms as they become available.\
  \ This portability and the performance gains will also allow more of the Ethereum\
  \ platform itself to be expressed in Wasm instructions which keeps the size of the\
  \ codebase down when supporting multiple platforms. This is useful both from a level\
  \ of effort and a code analysis for security auditing perspective.\n\nThey do not\
  \ want to design themselves into a corner, however, so they are introducing some\
  \ new ideas. The first is the idea of the Ewasm Contract Interface (ECI) which defines\
  \ the structure of a contract module. Modules are communicated in the Wasm binary\
  \ format. Contracts will be allowed to import symbols defined to be part of the\
  \ Ethereum Environment Interface (EEI). This exposes the core Ethereum API to the\
  \ ewasm environments. You can think of it a little like the relationship between\
  \ WASI and WASI-host environments. Contracts are expected to export a main() function\
  \ to initiate the contract and a Memory instance for sharing data between contracts\
  \ and its host environments. Again, these should make sense to you by now.\n\nI\
  \ am not able to give you a proper tutorial for this new platform here, but the\
  \ basic idea is that contracts will need to be able to fetch and store data, call\
  \ functionality in other contracts, be deployed at knowable addresses, etc. The\
  \ concept remains that the more burden a contract puts on the platform, the more\
  \ cost it will incur. Gas still remains and so there will be an intricate metering\
  \ capability similar to what we saw in the previous section but with more nuance.\n\
  \nBecause different instructions might cost more or less on different platforms,\
  \ they are assigning each Wasm opcode to one or more IA-32 (x86) instructions having\
  \ a fixed cycle count. This is expected to represent an average CPU used to host\
  \ Ethereum nodes running at approximately 2.2GHz. One second of CPU use is configured\
  \ to cost 10 million gas. These numbers are not going to be fixed in time and will\
  \ be periodically adjusted based upon observation and the evolution of hardware\
  \ systems.\n\nThe cost of an instruction is equivalent to a cycle count * the gas\
  \ per cycle equivalence for the instruction type. For example, the get_local instruction\
  \ costs 3 cycles and is expected to cost 0.0135 Gas. Loading things into and out\
  \ of memory will have similar costs. Accessing constant values (e.g. i32.const)\
  \ does not require any transfer of data, calculation or storage so it is essentially\
  \ a 0 gas operation.\n\nAs there is so much compiled EVM1 bytecode in existence,\
  \ there are also plans to have a Transcompiler to convert EVM1 bytecode into ewasm\
  \ bytecode for backward compatibility. There are some differences including that\
  \ EVM1 uses 256-bit integers by default and ewasm will use 64-bit integers, but\
  \ there will be compensating actions to make it all work and price the work accordingly\
  \ in the new environment.\n\nFinally, there will also be predefined contracts for\
  \ functionality that will be needed as part of the behavior of the Ethereum environment\
  \ to function properly. This includes a sentinel contract for validation and metering\
  \ injection, the transcompilation of EVM1 to ewasm, various hashing algorithms (e.g.\
  \ SHA2-256, RIPEMD160, KECCAK256), and more.\n\nThis remains an adventurous work\
  \ in progress, but the design motivation makes sense and the selection criteria\
  \ aligns with many of the reasons we have highlighted for being excited about WebAssembly\
  \ in general. Decentralized systems have a lot of innate complexity in them. Whatever\
  \ they can do to standardize, secure, optimize, and expand the range of contract\
  \ language options available to cryptocurrency smart contract developers is likely\
  \ to strengthen the Ethereum platform overall.\n\n### Polkadot\n\nWhile Bitcoin\
  \ is the overall market leader in the cryptocurrency space, Ethereum has emerged\
  \ as a close second. With its support for multiple\n\n\n\nlanguages and arbitrary\
  \ contracts in a widening collection of languages, if you needed to target a specific,\
  \ non-Bitcoin platform, Ethereum would be a defensible choice even with some of\
  \ the growing pains it has experienced over the years. But what if you did not want\
  \ to tie yourself to a single platform such as Ethereum? This is where Polkadot\
  \ comes in. It is a new blockchain project designed from the ground up with blockchain\
  \ interoperability in mind.\n\nPolkadot¹⁰ was founded by Dr. Gavin Wood, author\
  \ of the Ethereum Yellow Paper¹¹, with an eye toward upgradeable, extensible, and\
  \ interoperable blockchain capabilities. It is one of the cornerstones of the Web3\
  \ Foundation¹².\n\nOne of the projects funded by the Web3 Foundation was to bring\
  \ an ewasm virtual machine into the Polkadot ecosystem. The contract was awarded\
  \ to Second State, makers of the WasmEdge platform we introduced in the previous\
  \ chapter. The project is called Substrate and its webpage is here: https://substrate.dev.\
  \ You can find the project on GitHub: https://github.com/second-state/substrate-ewasm.\
  \ With support for the ewasm contract interface and execution environment, this\
  \ opens the door for Ethereum contracts to be transparently deployed to Polkadot-based\
  \ blockchains. Not only does this avoid lock-in, it also increases the transfer\
  \ of ideas, contracts, and capabilities into an ever richer collection of blockchain-based\
  \ stakeholders. Other projects based upon the SecondState ewasm engine include Oasis\
  \ Ethereum¹³ and Parastate¹⁴.\n\nThese are simply a couple of examples of the intersection\
  \ of WebAssembly and blockchain-flavored decentralization. I anticipate there will\
  \ be many, many more, but for now I want to wrap up the chapter with a quick introduction\
  \ of another one of my favorite decentralization projects that is also a star of\
  \ the Web3 world. It too will benefit from WebAssembly.\n\n### Interplanetary File\
  \ System (IPFS)\n\nI have to admit, I fell in love with this project initially just\
  \ for its name. Granted, I have come to respect it and honestly be in awe at what\
  \ the\ncommunity is able to produce since then, but the name still rules. The thing\
  \ is, it is not just a clever name. It is simultaneously a historical reference¹⁵\
  \ and an aspirational nod to a future that is closer than most of us are anticipating.\
  \ Humans will soon be going back to the moon and making early forays to Mars. The\
  \ network latencies involved with communicating with bases on these planets are\
  \ going to be problematic. One aspect of the design criteria for IPFS is to help\
  \ solve some of these issues. I will not bother explaining how they plan to do this,\
  \ but perhaps that will pique your curiosity to investigate. The project produces\
  \ an overwhelming amount of code, documentation, videos, and tutorials, but their\
  \ main website is a good starting point: https://ipfs.io.\n\nOne of the coolest\
  \ aspects of IPFS is that they are designing their layers around the idea of reuse\
  \ across projects. You do not have to buy into their entire stack, elegant as it\
  \ is. Instead, you can pick and choose the pieces that your project might benefit\
  \ from and go from there. Examples of useful (and reuseful) projects from this community\
  \ includes Multiformats¹⁶, libp2p¹⁷, and IPLD¹⁸.\n\nWhile there are many ways WebAssembly\
  \ is showing up in this community, I want to highlight a very simple one. I am not\
  \ going to describe how IPFS works in detail, but there are some core ideas. The\
  \ whole thing is based upon Merkle-DAGs¹⁹. A Directed Acyclic Graph (DAG) is a graph\
  \ structure that has identifiers based upon hashes of the node’s contents. Merkle\
  \ DAGs are similar to Merkle Trees²⁰ which are useful for detecting changes of content-based\
  \ addressable blocks.\n\nThe net effect of these decisions is that files can be\
  \ broken down into dependencies between blocks that are identified by content identifiers\
  \ (CIDs) driven by the actual content of the blocks. As files change, the only portions\
  \ that need to be updated are the effected blocks. Doing so does not invalidate\
  \ the existing immutable Merkle DAGS, so multiple versions of files can co-exist\
  \ simultaneously.\n\nIf you do not have a background in these kinds of decentralized\
  \ systems, there are a lot of behind-the-scenes details that we do not need to focus\
  \ on\nto make my larger point. To hide those details, I am going to use the Go-based\
  \ command line tools from the IPFS project. You can find how to install these in\
  \ Appendix A if you are interested in trying them. There are libraries in many other\
  \ languages. Many of these do not require you to install and run things locally\
  \ if you do not want to. As you will see below there are HTTP gateways for bridging\
  \ the Web as you know it and the IPFS network.\n\nIn order to use the tools, you\
  \ need to generate an identity. This does not involve your name or anything, it\
  \ is just an RSA keypair that can be used to digitally sign documents and communicate\
  \ with the large network. Creating a node identity is easy.\n\n```\nbrian@tweezer\
  \ ~> ipfs init\ninitializing IPFS node at /Users/brian/.ipfs\ngenerating 2048-bit\
  \ RSA keypair...done\npeer identity: QmZoRwJ7YYayf5eNWDweN5GCGJjuRnKGJA3susZqjV8Jcb\n\
  to get started, enter:\n    ipfs cat\n/ipfs/QmS4ustL54uo8FzR9455qaxZwuMiUhyvMcX9Ba8nUH4uVv/readme\n\
  ```\n\nThe very long content identifier (CID) that starts with QmZoRwJ refers to\
  \ the node I created. There are no services running yet, we simply have tools that\
  \ allows us to communicate with the IPFS network. That includes the ability to request\
  \ files. Files have similar CIDs to the node, as do blocks. If you dig into the\
  \ IPLD model mentioned above, you will see that it is just a big interlinked collection\
  \ of named, immutable nodes. The comment at the end of what was produced above indicates\
  \ that we can find out more by issuing that command. As you will see soon, you do\
  \ not need to have these tools involved, but at this point something needs to know\
  \ how to communicate with the network. The ipfs command line tool takes multiple\
  \ arguments. One of them makes it act like the Unix cat command to show the contents\
  \ of a file. In this case, it is a file called readme referenced as a subelement\
  \ of the directory it lives in. This convenience is a bit like a fragment identifier\
  \ on a Web URL to avoid multiple round trips. We can ask for it in one go. The results\
  \ should look something like what you see in Figure 16-1.\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_363_0.png)\n\
  \nFigure 16-1. Requesting files from IPFS\n\nNote that there are other files in\
  \ that directory so you could ask for them as well. If you did not know what files\
  \ were available, you could simply ask IPFS. Notice below I am using the directory\
  \ name on its own. As you can see, each file in the directory has its own CID.\n\
  \n```\nbrian@tweezer ~/s/ipfs> ipfs ls\n/ipfs/QmS4ustL54uo8FzR9455qaxZwuMiUhyvMcX9Ba8nUH4uVv\n\
  QmZTR5bcpQD7cFgTorqxZDYaew1Wqgfbd2ud9QqGPAkK2V 1677 about\nQmYCvbfNbCwFR45HiNP45rwJgvatpiW38D961L5qAhUM5Y\
  \ 189 contact\nQmY5heUM5qgRubMDD1og9fhCPA6QdkMp3QCwd4s7gJsyE7 311 help\nQmejvEPop4D7YUadeGqYWmZxHhLc4JBUC\
  \ zJHHWMzdcMe2y 4 ping\nQmXgqKTbzdh83pQtKFb19SpMCpDDcKR2ujqk3pKph9aCNF 1681 quick-start\n\
  QmPZ9gcCEpqKTo6aq61g2nXGUhM4iCL3ewB6LDXZ C tioEB 1091 readme\nQmQ5vhrL7uv6tuoN9KeVBwd4PwfQkXdVVmDLUZ\
  \ uTNxqgvm 1162 security-notes\n```\n\nAdding files to IPFS is easy. I am going\
  \ to take the example from Chapter 6 where we rendered a Windows bitmap file from\
  \ C++ in the browser. As a reminder, this is what is in that directory.\n\n```\n\
  brian@tweezer ~/s/i/bitmap> ls -alF\ntotal 1800\ndrw xr-xr-x   11 brian  staff \
  \     352 Aug 18 12:27 ./\ndrw xr-xr-x    3 brian  staff       96 Aug 18 12:26 ../\n\

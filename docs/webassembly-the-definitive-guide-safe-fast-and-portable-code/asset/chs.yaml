  \ console.log() 打印到右下面板。\n\n### 示例 2-3. 调用我们函数的一些 JavaScript\n\n```\nconst wasmInstance\
  \ = new WebAssembly.Instance(wasmModule, {});\nconst { how_old } = wasmInstance.exports;\n\
  console.log(how_old(2021, 2000));\n```\n\n如果一切顺利，你应该会看到类似图 2-5 的屏幕截图。尝试更改当前年份和出生年份参数，确保我们的数学是正确的。\n\
  \n![](img/16b7990eb0dbf589db177bdbd2f4a189_40_0.png)\n\n图 2-5. 将 WebAssembly 文本文件转换为二进制文件并执行它\n\
  \n此时，你可以下载文件的二进制版本。默认情况下它将被称为 *test.wasm*，但你可以将其重命名为你喜欢的任何名称。我们将把它称为 *hello.wasm*。\n\
  \n生成此二进制形式的另一个选项是使用 WebAssembly Binary Toolkit（WABT）⁴ 请参阅附录 A，了解安装 WABT 以及我们在全书中使用的其他工具的说明。\n\
  \n随此安装一起提供了一个名为 wat2wasm 的命令。它按其名称所述，将文本文件转换为二进制格式。\n\n```\nbrian@tweezer ~/g/w/s/ch02>\
  \ wat2wasm hello.wat\nbrian@tweezer ~/g/w/s/ch02> ls -alF\ntotal 24\ndrwxr-xr-x\
  \  5 brian  staff   160 Sep 13 12:54 ./\ndrwxr-xr-x  3 brian  staff    96 Sep 13\
  \ 12:05 ../\n-rw-r--r--  1 brian  staff    76 Sep 13 12:07 hello.c\n-rw-r--r-- \
  \ 1 brian  staff    45 Sep 13 12:54 hello.wasm\n-rw-r--r--  1 brian  staff   200\
  \ Sep 13 12:52 hello.wat\n```\n\n仔细看。你的眼睛没有欺骗你。它没做太多，但二进制格式只有 45 字节长！我以前做过很多 Java\
  \ 编程，并且有类名比这更长。我们现在需要一种在不在浏览器中的情况下执行函数的方法。这很容易用 Node.js 中的 JavaScript API 来完成，但我们将使用不同的方法来展示一系列选择。\n\
  \n## 在 Repl 中运行 Wasm\n\n我在附录 A 中向你展示如何安装的另一个工具是 wasm3，⁵ 一个用 C 编写的 WebAssembly 解释器。它允许你通过命令行或交互模式运行\
  \ Wasm 模块和函数，酷孩子们习惯性地称之为“repl”⁶。\n\n一旦我执行以下命令，我就会得到一个 wasm3 提示。我指向了我的 Wasm 文件，因此我只能调用一个函数，但如果\n\
  \n\n\n如果模块中还有其他导出的函数，它们也同样可用。\n\n```\nbrian@tweezer ~/g/w/build> wasm3 --repl $HOME/hello.wasm\n\
  wasm3> how_old 2021 2000\nResult: 21\nwasm3> how_old 2021 1980\nResult: 41\nwasm3>\
  \ $how_old 2021 2000\nError: function lookup failed ('$how_old')\nwasm3> how_old\
  \ 1980 2021\nResult: 4294967255\nwasm3>\n```\n\n请注意，我只能调用导出的函数，而不能调用内部函数。另请注意，如果我们像预期那样颠倒参数的顺序，我们会以糟糕的方式失败。当你用高级语言构建\
  \ Wasm 模块时，这些语言会让做正确的事情变得更容易（尽管在 .wat 文件中手动编写这种错误检查是完全可能的，但人生太短，不值得做这种无意义的事情）。要退出\
  \ repl，你只需输入 CTRL-C 或 CTRL-D。\n\n让我们回顾一下我们刚才做了什么。我们通过针对抽象机器的指令集表达了一些任意功能。我们在浏览器中运行它。它应该在任何主要浏览器上的任何主要操作系统上都能工作。好吧，JavaScript\
  \ 也应该如此。但我们也把它运行在一个在 macOS 机器上以交互模式运行的 C 可执行程序中。\n\n```\nbrian@tweezer ~/g/w/build>\
  \ file wasm3\nwasm3: Mach-O 64-bit executable x86_64\n```\n\n这里是它在编译为 Linux 二进制的同一应用程序中运行的情况：\n\
  \n```\nbrian@bbfcfm:~/g/w/build> wasm3 --repl $HOME/hello.wasm\nwasm3> how_old 2021\
  \ 2000\nResult: 21\nwasm3> ^C\nbrian@bbfcfm:~/g/w/build> file wasm3\n\nwasm3: ELF\
  \ 64-bit LSB shared object, x86-64, version 1 (SYSV),\n```\n\n```\ndynamically linked,\
  \ interpreter /lib64/ld-linux-x86-64.so.2,\nBuildID[sha1]=b5e98161d08d2d180d0725f973b338c2a340d015,\
  \ for\nGNU/Linux\n3.2.0, not stripped\n```\n\n实际上还有几个用 python、Rust、Scala、OCaml、Ruby\
  \ 等编写的独立 WebAssembly 环境编写的环境。我们的函数应该在其中任何一个中都可用并且正常工作。\n\n## 在浏览器中运行 Wasm\n\n在下一个演示中，我将向你展示如何使用\
  \ JavaScript API 在浏览器中调用该行为。我们暂时不会介绍 API，但你会看到一个基本示例。编译模块和参数化它们的更复杂方法还有很多，但首先我们要爬行，然后走路，然后奔跑。\n\
  \n在示例 2-4 中，我们看到了一段用于实例化 WebAssembly 模块实例的可重用代码。执行此操作的 JavaScript API 在支持 WebAssembly\
  \ MVP 的任何环境中都可用，但也有一些环境不需要 JavaScript，例如我们刚刚使用的 wasm3 运行时。然而，这段代码将在任何 WebAssembly\
  \ 友好的浏览器⁷ 或 Node.js 中工作。请注意基于 Promise 的方法的使用。如果你 JavaScript 环境支持 async/await，你当然也可以使用它们。\n\
  \n> NOTE\n> \n> 如果你的浏览器支持流式编译函数，示例 2-4 中的代码并不是实例化 WebAssembly 模块的首选方式。我们暂时使用它只是为了让你看到各个步骤，但将在本书后面讨论首选方法。\n\
  \n### Example 2-4. Instantiating a Wasm module in JavaScript\n\n```\nfunction fetchAndInstantiate(url,\
  \ importObject) {\n    return fetch(url).then(response =>\n```\n\n```\nresponse.arrayBuffer()\n\
  ).then(bytes =>\n    WebAssembly.instantiate(bytes, importObject)\n).then(results\
  \ =>\n    results.instance\n);\n```\n\n一旦函数可用，从 HTML 中使用它就很容易了。在示例 2-5 中，你可以看到该过程是如何工作的。\n\
  \n### Example 2-5. Instantiating a Wasm module from a web page\n\n```\n<!doctype\
  \ html>\n<html lang=\"en\">\n    <head>\n        <meta charset=\"utf-8\">\n    \
  \    <link rel=\"stylesheet\" href=\"bootstrap.min.css\">\n        <title>Hello,\
  \ World! (Sort of)</title>\n        <script src=\"utils.js\"></script>\n    </head>\n\
  \    <body>\n        <div class=\"container\">\n            <h1>Hello, World! (Sort\
  \ of)</h1>\n            I think you are <span id=\"age\"></span> years old.\n  \
  \      </div>\n\n        <script>\n            fetchAndInstantiate('hello.wasm').then(function(instance)\
  \ {\n                var ho = instance.exports.how_old(2021,2000);\n           \
  \     var ageEl = document.getElementById('age');\n                ageEl.innerText=ho;\n\
  \            });\n        </script>\n    </body>\n</html>\n```\n\n在这个示例中，我们建立了一个\
  \ id 为 \"age\" 的 <span>。它目前是空的。我们将用调用 WebAssembly 函数的结果填充它。我们的 HTML 文件其余部分没有什么奇怪之处。我们在\
  \ <head> 元素中包含了可重用的实例化代码。在此文件的底部，我们看到一个嵌入的 <script> 元素，它调用了 fetchAndInstantiate()\
  \ 函数。它传入了对 hello.wasm 文件的本地引用，因此我们也必须通过 HTTP 提供该文件。\n\n该函数返回一个 Promise。当它解析时，我们会收到一个实例化的\
  \ Wasm 模块实例的副本，并且能够调用通过模块的 exports 部分公开的方法。请注意，我们传入的是普通的 JavaScript 数字字面量，但这些数字完全可以传入函数。数字\
  \ 21 通过调用过程返回，然后存储在我们之前注意到的空 <span> 的 innerText 中。\n\n我们需要通过 HTTP 提供 HTML、JavaScript\
  \ 和 Wasm 模块才能在浏览器中运行。你可以用任何你喜欢的方式做到这一点，但使用 **python3**（或在非 Mac 上可能只是 **python**）你可以启动一个服务器并指定要监听的端口。\n\
  \n```\nbrian@tweezer ~/g/w/s/ch02> python3 -m http.server 10003\nServing HTTP on\
  \ :: port 10003 (http://[::]:10003/) ...\n```\n\n如果你打开浏览器并将其指向 http://localhost:10003/index.html，你应该在浏览器中看到类似于图\
  \ 2-6 的内容。随意更改嵌入 <script> 元素中的参数并验证它是否继续工作。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_45_0.png)\n\
  \nFigure 2-6. Invoking an exported WebAssembly module function from JavaScript in\
  \ a web page\n\n我们显然还有很多东西需要学习，但你现在已经看到了等同于“Hello, World！”的示例，并且希望理解 WebAssembly\
  \ 可以如何工作的基础知识。\n\n# WebAssembly can work.\n\n- 1 And most WebAssembly tutorials!\n\

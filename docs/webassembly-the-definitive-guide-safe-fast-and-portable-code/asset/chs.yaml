  \n### libsodium\n\n在结束本章之前，我想引起你对一个名为 libsodium 的项目注意。我们不会直接使用它，但它展示了通过 WebAssembly\
  \ 将诸如 C 和 C++ 之类的语言与浏览器混合的额外动机。\n\n该库基于另一个名为 Networking and Cryptography library\
  \ (NaCl)⁸ 的库。它是由懂得自己在做什么的人编写的高性能现代加密库。NaCl 的许多功能在 JavaScript 运行时中可能尚未可用。新的密码套件⁹\
  \ 包括带附加数据的认证加密 (AEAD) 可能在此出现，而在移植到 JavaScript 或通过操作系统提供给浏览器之前。WebAssembly 的一个令人信服的用例是能够基本上重新编译此类现代支持并立即将其带到浏览器，而无需等待更新。\n\
  \n第二个动机是 NaCl 库的作者知道自己在做什么。用糟糕的实现很容易削弱加密库的有效性。即使是比较两个哈希值是否相同这样微妙的事情，如果实现不正确也会泄露细节。令人沮丧的是，此比较的正确实现将违背开发人员通常比较两个哈希的方式。我的观点是，NaCl\
  \ 代码库具有来源可追溯性。如果没有背景来理解这些细节的 JavaScript 开发人员尝试实现该功能，很可能会出现这些漏洞。当你拥有一个受信任的代码库时，能够重新编译并直接使用它也是考虑本章主题的另一个原因。\n\
  \n因此，libsodium 基本上是一个旨在通过 WebAssembly 将 NaCl 库导出到 JavaScript 环境的项目，无需重写或在性能上妥协。它旨在作为\
  \ WebAssembly 项目维护。我认为一旦人们更好地了解以这种方式使用 WebAssembly 的含义，我们将开始看到更多可以作为原生库或 WebAssembly\
  \ 模块使用的项目，具体取决于你的配置需求。这将是代码重用的绝佳机会。我们将在第 10 章看到这种方法的另一个示例。\n\n到那时，关于 WebAssembly\

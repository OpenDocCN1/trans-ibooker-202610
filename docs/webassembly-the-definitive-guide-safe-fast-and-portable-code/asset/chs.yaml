  \ Writing files to the “filesystem” in the browser\n\n我们的第三方代码使用标准 C++ 库写入“文件系统”。Emscripten\
  \ 在浏览器中提供了本地存储的抽象层，使此操作成为可能。从 C++ 中，我们可以轻松地读回它。从 JavaScript 中，它并不难，如 Example 6-11\
  \ 所示。\n\n#### Example 6-11. JavaScript to read “files” in from “disk” with the filesystem\
  \ abstraction\n\n```\n>> var image = FS.readFile(\"./test20_julia_set_vga.bmp\"\
  );\n<- undefined\n>> image\n<- Uint8Array(2880054) [ 66, 77, 54, 242, 43, 0, 0,\
  \ 0, 0, 0, ... ]\n```\n\n我们通过调用 FS.readFile() 函数得到了一个 Uint8Array。这将使处理文件中的字节变得容易。只有一个问题。浏览器不支持显示\
  \ Windows 位图文件！\n\n幸运的是，这是一个有文档记录的格式，有人为我们提供了代码来做到这一点。我们本可以依赖一些现有的 C 或 C++ 代码，但只是为了向你展示一些选项，我们将使用提供的\
  \ JavaScript 代码⁵。\n\n\n\n\n\n幸运的是，在阅读完第 4 章后，你将具备理解示例 6-12 中大部分内容的能力。我们将 `FS.readFile()`\
  \ 函数返回的底层 ArrayBuffer 传递给名为 `getMBP()` 的方法。该方法在缓冲区周围创建一个 DataView，然后提取各种图像细节，最后将它们放入更方便的\
  \ JavaScript 表示中。\n\n一旦 Bitmap 文件被读入，我们就通过同一网站上的 `convertToImageData()` 函数将 JavaScript\
  \ 结构转换为 ImageData 实例。之后我们将 `<canvas>` 的大小设置为与其高度和宽度相匹配，并使用其 `putImageData()` 方法来渲染像素。\n\
  \n#### 示例 6-12. JavaScript 读取我们的 Bitmap 文件并在 `<canvas>` 元素中渲染它\n\n```\n<script>\n\
  // Code taken from https://tinyurl.com/bitmap-in-javascript\n// Written by Ian Elliott\n\
  function getBMP(buffer) {\n    var datav = new DataView(buffer);\n    var bitmap\
  \ = {};\n    bitmap.fileheader = {};\n    bitmap.fileheader.bfType = datav.getUint16(0,\
  \ true);\n    bitmap.fileheader.bfSize = datav.getUint32(2, true);\n    bitmap.fileheader.bfReserved1\
  \ = datav.getUint16(6, true);\n    bitmap.fileheader.bfReserved2 = datav.getUint16(8,\
  \ true);\n    bitmap.fileheader.bfOffBits = datav.getUint32(10, true);\n    bitmap.infoheader\
  \ = {};\n    bitmap.infoheader.biSize = datav.getUint32(14, true);\n    bitmap.infoheader.biWidth\
  \ = datav.getUint32(18, true);\n    bitmap.infoheader.biHeight = datav.getUint32(22,\
  \ true);\n    bitmap.infoheader.biPlanes = datav.getUint16(26, true);\n    bitmap.infoheader.biBitCount\
  \ = datav.getUint16(28, true);\n    bitmap.infoheader.biCompression = datav.getUint32(30,\
  \ true);\n    bitmap.infoheader.biSizeImage = datav.getUint32(34, true);\n    bitmap.infoheader.biXPelsPerMeter\
  \ = datav.getUint32(38, true);\n    bitmap.infoheader.biYPelsPerMeter = datav.getUint32(42,\
  \ true);\n    bitmap.infoheader.biClrUsed = datav.getUint32(46, true);\n    bitmap.infoheader.biClrImportant\
  \ = datav.getUint32(50, true);\n```\n\n```\nvar start = bitmap.fileheader.bfOffBits;\n\
  bitmap.stride = Math.floor((bitmap.infoheader.biBitCount\n    *bitmap.infoheader.biWidth\
  \ + 31) / 32) * 4;\nbitmap.pixels = new Uint8Array(buffer, start);\nreturn bitmap;\n\
  }\n\n// Code taken from https://tinyurl.com/bitmap-in-javascript\n// Written by\
  \ Ian Elliott\nfunction convertToImageData(bitmap) {\n    var canvas = document.createElement(\"\
  canvas\");\n    var ctx = canvas.getContext(\"2d\");\n    var width = bitmap.infoheader.biWidth;\n\
  \    var height = bitmap.infoheader.biHeight;\n    var imageData = ctx.createImageData(width,\
  \ height);\n\n    var data = imageData.data;\n    var bmpdata = bitmap.pixels;\n\
  \    var stride = bitmap.stride;\n\n    for (var y = 0; y < height; ++y) {\n   \
  \     for (var x = 0; x < width; ++x) {\n            var index1 = (x+width*(height-y))*4;\n\
  \            var index2 = x * 3 + stride * y;\n            data[index1] = bmpdata[index2\
  \ + 2];\n            data[index1 + 1] = bmpdata[index2 + 1];\n            data[index1\
  \ + 2] = bmpdata[index2];\n            data[index1 + 3] = 255;\n        }\n    }\n\
  \    return imageData;\n}\n\nvar button = document.getElementById(\"load\");\nbutton.onclick\
  \ = function() {\n    Module.callMain();\n    var canvas = document.getElementById(\"\
  output\");\n    var context = canvas.getContext('2d');\n\n    var image = FS.readFile(\"\
  ./test20_julia_set_vga.bmp\");\n    var bmp = getBMP(image.buffer);\n    var imageData\
  \ = convertToImageData(bmp);\n\n    canvas.width = bmp.infoheader.biWidth;\n   \
  \ canvas.height = bmp.infoheader.biHeight;\n\n    context.putImageData(imageData,\
  \ 0, 0);\n```\n\n```\nconsole.log(image);\n};\n</script>\n</body>\n</html>\n```\n\

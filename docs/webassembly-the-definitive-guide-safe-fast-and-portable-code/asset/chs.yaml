  \ World!”示例了。为了保持简单，我不会有一个典型的 main() 程序。相反，我将把行为作为我们在 library.cpp 文件中的另一个函数公开。示例\
  \ 5-15 展示了这有多简单。\n\n#### Example 5-15. Hello, World! as a function in our C/C++\
  \ code.\n\n```\nWASM_EXPORT void helloWorld() {\n    printf(\"Hello, World!\\n\"\
  );\n}\n```\n\n如果我在 HTML 中的其他代码之后添加对这个新函数的调用，你可以在图 5-5 中看到结果。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_120_0.png)\n\

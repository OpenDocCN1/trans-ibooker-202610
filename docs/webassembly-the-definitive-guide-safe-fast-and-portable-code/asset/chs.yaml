  ...\n```\n\n守护进程在有人请求之前不会开始发布文件，但它也启动了一些本地服务。第一个是监听在 /ip4/127.0.0.1/tcp/8000 上的只读\
  \ HTTP 网关。我们一直在使用 IPFS Go 命令行工具，但我们本地主机上的任何其他人都可以不受这些限制地访问此服务。\n\n举例来说，IPFS 中有一张著名的猫的图片。你可以使用命令行工具请求其详细信息。\n\
  \n```\nbrian@tweezer ~/s/ipfs> ipfs ls\n/ipfs/bafybeidsg6t7ici2osxjkukisd5inixiunqdpq2q5jy4a2ruzdf6ewsqk4\n\
  /cat.jpg\nQmPEKipMh6LsXzvtLxunSPP7ZsBM8y9xQ2SQQwBXY5UY6e 262144\nQmT8onRUFpgvkoPMdMvCHPYxh98iKCfFkBYM1ufYpnkHJn\
  \ 181086\n```\n\n你看到的是与该文件关联的两个块。你也可以使用守护进程的本地 HTTP 网关，如图 16-2 所示。URL 被遮蔽了，但没有什么花哨的，浏览器只是在通过\
  \ HTTP 请求文件。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_368_0.png)\n\n图 16-2. 通过\
  \ HTTP 网关从 IPFS 请求文件\n\n本地 HTTP 网关不止一个。IPFS 项目在 https://ipfs.io/ipfs/<CID> 上运行一个，CloudFlare\
  \ 在 https://cloudflare-ipfs.com/ipfs/<CID> 上运行一个。只需将 CID 替换为猫图像节点名称和文件名，你也应该能在那里看到它。\n\
  \n我刚刚展示给你的可能比你意识到的更酷，因为两者都是 TLS 终止的端点。这意味着你可以通过嗅探数据包而无需任何人知道你在请求什么来从 IPFS 请求文件。IPFS\
  \ 在绕过审查方面非常成功。任何试图扼杀一个网关的尝试都可能引发更多网关的出现。\n\n守护进程启动的另一项服务是用于浏览节点详情并更自然地与平台交互的 Web\
  \ 应用程序。它在上面的守护进程输出中列为 WebUI，位于 http://127.0.0.1:5001/webui。如绑定所示，只有同一台机器上的用户可以访问它，但你可以将其配置为绑定到\
  \ IP 地址，以便任何其他本地网络机器都可以请求文件而无需安装任何 IPFS 工具。该应用程序如图 16-3 所示。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_369_0.png)\n\
  \n图 16-3. 通过 WebUI 与 IPFS 交互\n\n在 WebUI 中你可以做很多其他很酷的事情，但为了回到主题，仔细看看这个窗口的地址栏。端口 5001\
  \ 提供了一个 Web 应用程序……来自 IPFS。\n\n```\nbrian@tweezer ~/s/ipfs> ipfs ls\n/ipfs/bafybeiflkjt66aetfgcrgvv75izymd5kc47g6luepqmfq6zsf5w6ueth6y\n\
  bafkreigqagdyzmirtq1n7dc4qfz5sb7tkdexbzmhwoxzblkma3kakpeoqma 5324\nasset-manifest.json\n\
  bafkreihc7efnl2prri6j6krcopelxms3xsh7undpsjqbf sasm7ikiyha4i 34494\nfavicon.ico\n\
  bafkreihmzivzfdhagatgqinzy6u4mfopfldebcc4mvim5rzrdpins5pr7a 4530\nindex.html\n```\n\
  \n```\nbafkreicayih3vhhjugxshbar5ylocvcqz4xixuqk6cflyxpnuxf2spwws4 24008\nipfs-logo-512-ice.png\n\
  bafybeiadadzwwymj72nnlyoy6bza4lhps6sofmgmyf6ew5klzwdae4g3pa -\nlocales/\nbafkreicplcott4fe3nnwvz3bidothdtqd\
  \ vpr5wygbxzoyfozm7tiues77q 298\nmanifest.json\nbafybeierqn364ton5lp5ogcu4l22gukzprwieaau7lvcan555n3sg4i6we\
  \ -\nstatic/\n```\n\n浏览器请求 Web 应用程序所在目录的根 CID。index.html，如同往常，是默认文件。如果你 ipfs cat\
  \ 该文件，你会看到它引用了静态资源、样式表等。某个地方，有人发布了这个应用程序。它并不是以传统意义上托管在云托管站点之类的形式托管。我对它的来源没有任何直接了解，但它通过\
  \ HTTP 网关本地提供给我的浏览器。\n\n那我之前发布的包含 C++ 渲染位图文件的目录呢？因为我的守护进程已经运行了一段时间，其他节点现在可以请求它了。查看图\
  \ 16-4，我的应用程序通过 CloudFlare 的 TLS 前端呈现的令人震惊的结果。\n\n## C++-rendered Image in the Browser\n\
  \n![](img/16b7990eb0dbf589db177bdbd2f4a189_371_0.png)\n\n图 16-4. 通过 IPFS HTTP 网关与我本地发布的文件交互\n\
  \n我不会再深入细节，但想强调这还意味着什么。请记住 Merkle DAG 是不可变的。如果我通过修改一两个文件来更改我的应用程序，只有这些文件需要重新发布。记住发布只是将文件添加到\
  \ IPFS。它们的编辑会导致其块的哈希不同，这意味着文件的哈希不同，这意味着目录的哈希不同。有了新的顶层 CID。但旧的仍然有效。你可以用 DNS 玩一些游戏，但我将留给你通过\
  \ IPFS 文档和教程自行发现。\n\n这与 WebAssembly 有什么关系？我是想突出平台优势的交集以及它作为另一个用例所带来的影响。我刚刚演示了一个\
  \ Web 应用程序通过 CDN 提供服务，具有地理分布，而无需其他托管需求。它在本地提供服务，结果可以在途中缓存。这包括编译为 WebAssembly 并在沙箱中运行的\
  \ C++ 代码，在你使用的任何浏览器或平台上运行。多个版本\n\n\n可以同时得到支持，并且用户可以决定何时升级。\n你可以在不支付托管费用的情况下为世界各地的任意客户端提供服务。你可以使用任何你想要的语言来实现高性能的交互式系统，无论你的用户偏好什么平台。他们因为安全保护而感到舒适地运行你的应用程序，并且没有中央机构可以轻易地关闭你。\n\

  \ 中展示。\n\n### Terrarium 图像处理示例\n\n从远程 URL 获取图像，进行解压缩、调整大小、锐化和即时重新压缩。\n\n图像 URL 可以在\
  \ image.h 头文件中更改。\n\n影响返回图像的 HTTP 查询参数为：width（像素）、height（像素）和 sharpening（0=不锐化，100=最大锐化）。\n\
  \n动态生成的图像 URL 示例：\n- 640x360，无锐化\n- 640x360，25% 锐化\n- 1280x720，20% 锐化\n- 320x240，100%\
  \ 锐化\n\n图 15-4. 通过浏览器访问已部署的图像处理示例\n\n最后，如果您点击将较大图像锐化 20% 的链接，您将看到类似图 15-5 中所示的猫图片。令人兴奋的并不是您可以将应用程序发布到网络并通过浏览器调用它。令人兴奋的是，您可以选择自己的语言，包括\
  \ C 这样极不安全的语言，并将其部署到他人基础设施中的混合架构中（具有地理复制以实现低延迟交互的可能性），而无需担心。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_334_0.png)\n\
  \n图 15-5. 锐化 20% 的猫图像\n\n在部署位置的连续体上，我们主要关注边缘计算，正如名称所示。接下来我们将研究一种解决方案，该方案将帮助开发人员将\
  \ WebAssembly 模块部署到现有的 Kubernetes 集群中。\n\n### Krustlet\n\n虽然 Docker 容器提供了隔离和行为依赖机制，但\
  \ Kubernetes 已成为编排这些容器以实现复杂应用程序和工作流的自动化部署的主要环境之一。这两种技术在很大程度上相互利用了各自的优势。甚至作为部署引擎，它们也紧密耦合在一起。虽然这在大型云部署中不是问题，但在我们想要针对更小规模平台时就会成为问题。最终我们将寻求一种机制，允许用更轻量级结构表达的行为进行组合。但，直接将\
  \ WebAssembly 与 Kubernetes 集成也是一种合理的目标。\n\n这正是微软的 DeisLabs 团队¹⁶ 在过去几年中一直在实验的内容。\n\
  \n该团队已将 WebAssembly 识别为部署安全、快速、安全的软件的替代方式。他们认为从这样一个安全的基线开始更容易，而不是必须锁定容器实例，而这很难做到正确。他们开发了\
  \ Krustlet¹⁷，这是一个基于 Rust 的 Kubelet（因此得名）。这种方法的其他显著优势是启动和关闭时间更快，以及比传统容器更小的部署单元。这为物联网（IoT）传感器和设备、嵌入式系统以及其他受限环境创造了新的机会，同时也与现有的\
  \ Kubernetes 环境兼容。\n\n他们并不认为现有应用程序会突然被重新打包为组合的 WebAssembly 模块，因此这绝不打算取代 Docker。相反，它是一个最小功能性的\
  \ Kubelet，可以基本“按原样”与 Kubernetes 交互。除了仅使用开放容器计划（OCI）容器之外，您还可以混合搭配 WebAssembly 和运行时环境的功能。这些运行时层并非固定不变，但\
  \ Krustlet 历史上一直与 Wasmtime 以及下面 wasmCloud 项目的前身一起工作。通过打破 Kubernetes 与容器之间的耦合，我们预计此类工作会带来有趣的发展。值得注意的是，Krustlet\
  \ 已被云原生计算基金会（CNCF）采纳为沙箱项目。\n\n请记住，这在很大程度上是一种通过 WebAssembly 扩展现状的方式。它最终将允许在容器和基于\
  \ Kubernetes 的策略的配合下使用更广泛的引擎和计算位置。它还强调了我们在编排策略和应用程序主机提供商方面有选择，这将在下一部分讨论。\n\n###\
  \ SubOrbital\n\nSuborbital¹⁸ 项目源于对将行为的组合、编排和调度与容器解耦的类似兴趣。\n\n他们最初考虑将 Docker 容器作为工作流的基础，但发现它们笨重、缓慢且难以保护。WebAssembly\
  \ 更适合，因此让我们看看它是如何组合起来的。\n\nSuborbital 平台包含多个部分。第一个是用于表达 API 服务的基于 Go 的开发环境，称为 Vektor。它允许以简单的方式表达复杂行为，包括建立和配置服务器。Vektor\
  \ 指南包含示例 15-1，即一种演示启动服务器并注册和挂载简单处理程序的方法，该服务器配置了由 Let’s Encrypt 支持的证书。\n\n#### 示例\
  \ 15-1. 示例 Vektor 服务器\n\n```\nimport \"github.com/suborbital/vektor/vk\"\n\nserver\
  \ := vk.New(vk.UseAppName(\"Vektor API Server\"),\n    vk.UseDomain(\"vektor.example.com\"\
  ))\n\nserver.GET(\"/ping\", HandlePing)\n\nif err := server.Start(); err != nil\
  \ {\n    log.Fatal(err)\n}\n\nfunc HandlePing(r *http.Request, ctx *vk.Ctx) (interface{},\
  \ error)\n{\n    return \"pong\", nil\n}\n```\n\n下一个元素是用于调度函数和可运行行为的基于 Go 的运行时，称为\
  \ Reactr。它可以作为独立应用程序运行，也可以作为服务运行，并通过 HTTPS 连接接收工作以提供无服务器函数（FaaS）环境。它处理内存管理、功能安全系统，并且可以调度用\
  \ Rust、AssemblyScript 和 Swift 编写的可运行工作。函数可以同步、异步调度，或链接在一起以提供类 Unix 管道和过滤器的功能组合模型。\n\
  \nGrav 环境是一个基于 Go 的分布式消息网格，用于扩展受管组件之间的通信。它旨在具有低开销、高弹性、支持多种消息样式（例如请求/回复和广播）以及内存内和进程间消息模型。它有特定的预期用途，并不打算取代\
  \ RabbitMQ 或 Kafka 等更成熟的通用环境。\n\n一个全面且一致的命令行工具 *subo* 允许您与 Suborbital 环境交互，并隐藏了特定语言构建系统、容器结构等许多细节。已部署的工件可以以多种方式打包，并且可以在运行时增量热交换。\n\
  \nAtmo 是将所有内容[content]\n\n3. 请注意，它会为托管应用生成一个随机的 DNS 名称以方便使用。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_332_0.png)\n\

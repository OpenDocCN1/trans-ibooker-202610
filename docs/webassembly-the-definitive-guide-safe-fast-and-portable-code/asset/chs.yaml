- '# WebAssembly 权威指南：安全、快速且可移植的代码




































  '
- "## 致谢\n\n本书诞生于特权之山，在许多人没有在家办公的奢侈的时期。因此，本书献给在黑暗时期保持灯火通明的前线和 essential 工人。\n\n##\
  \ 前言\n\n### 致早期发布读者的说明\n\n通过 Early Release 电子书，您可以在这些书籍的官方发布之前就获得书籍的最早形式——作者在写作时的原始未编辑内容，以便您可以在这些技术正式发布之前就利用它们。\n\
  \n如果您对如何改进本书的内容和/或示例有任何意见，或者如果您注意到本章中缺少材料，请通过 wasmbook@bosatsu.net 与作者联系。\n\n我相信\
  \ WebAssembly 是一种正在崛起的技术，有潜力以某种形式彻底改变整个软件开发行业。我并不认为 WebAssembly 之所以具有变革性是因为我正在撰写一本关于该主题的书籍。我之所以撰写这本书，是因为我相信它将具有变革性。\n\
  \n presumably 您也对该技术感兴趣。问题是，我认为我对您作为读者的了解比许多作者都要少。如果这是一本关于特定编程语言或特定主题的书籍，读者会有自我选择性，我就可以继续进行。但\
  \ WebAssembly 的主题比大多数人意识到的要大得多，我正试图用这本书描绘一幅非常大的图景。迄今为止出版的大多数其他书籍都专注于其单一方面，我可以理解为什么。\n\
  \n你们中的一些人可能认为它是一种杀死 JavaScript 的技术。它不是。你们中的一些人可能认为它关乎将应用程序带到浏览器。它确实是这样，但它也是如此之多。它在服务器端、视频游戏世界中、作为插件机制、在支持无服务器函数和边缘计算方面、在嵌入式系统、区块链以及我们将一起研究的许多其他主题中都很有用。这是据我所知首次尝试对该主题进行如此全面的尝试，我认为这很重要，也是时候讲述这个更完整的版本了。\n\
  \n在本书出版之前，我与谈论该项目的人大多得到了积极的支持和兴奋。 我得到的有限的反对意见之一是关于标题。一些人认为对于如此新的技术来说，“权威指南”这个称号为时过早。那是一个公平的立场，但由于我试图描述一个极其庞大和包罗万象的技术环境，我认为这是合理的。我希望到本书结束时你会同意。\n\
  \n我唯一的要求是您保持开放的心态并稍有耐心。WebAssembly 涉及大量语言、运行时和运行环境。除了教您有关低级细节的知识外，我们还将研究与该领域的主流编程语言的集成以及几种不同的用例。我已尽量不对您的背景做出太多假设，因此我在文本中大量添加了脚注形式的进一步探索和发现的面包屑。如果您是一位更高级的开发人员，只寻求有关\
  \ WebAssembly 的详细信息，请随意忽略这些内容，不要介意。我预计会有相当广泛的受众至少会浏览这本书，我也希望他们感到受欢迎。\n\n如果您在开发方面属于初级水平，这将是一本具有挑战性的书。但我已尽力让您至少了解发生了什么。把各种链接和参考资料当作通往更复杂的开发现实的个人指南。不要感到不知所措，只需一次处理一个问题，按您感兴趣的顺序或有意义的顺序进行即可。进入这个行业没有唯一的方式，无论您如何进入都是合法的。\n\
  \n归根结底，WebAssembly 将允许我们基本上选择我们的编程语言，并在几乎任何计算表面区域安全地运行它们。我们之前被承诺过这一点，但我认为这次更有可能实现。感谢您给我机会解释原因。\n\
  \n## 本书使用的约定\n\n本书中使用了以下排版约定：\n\n*Italic*\n\n表示新术语、URL、电子邮件地址、文件名和文件扩展名。\n\n*Constant\

  \ 模块、库和插件扩展 .NET 应用程序的想法。\n\n在尝试以下操作之前，您需要安装 .NET Core SDK。请参阅附录 A 以获取帮助您完成此操作的说明。一旦工具可用，我们将创建一个新目录\n\

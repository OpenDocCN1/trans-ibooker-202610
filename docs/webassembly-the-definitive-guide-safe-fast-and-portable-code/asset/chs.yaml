  \    Hosting environment: Development\ninfo: Microsoft.Hosting.Lifetime[0]\n   \
  \ Content root path: /Users/brian/src/blazor-web\n```\n\n在图 13-5 中，你将看到如果你将浏览器指向\
  \ http://localhost:5000 时生成的输出。如果你想查看所有加载的 .NET 程序集和运行时，请先打开网络视图。注意，如果你点击调查链接，它会带你到一个真正的\
  \ SurveyMonkey 调查！\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_290_0.png)\n\n图 13-5.\
  \ 正在运行的生成的 Blazor WebAssembly 应用程序\n\n路由到只读渲染的 HTML 片段很酷，但如何维护一些状态并使用非默认路由呢？侧边栏左侧的\
  \ Counter 链接将带你到从 *Pages/Counter.razor* 文件渲染的视图，如示例 13-9 所示。\n\n#### 示例 13-9. 具有有状态字段和交互式\
  \ UI 元素的页面\n\n```\n@page \"/counter\"\n\n<h1>Counter</h1>\n\n<p>Current count: @currentCount</p>\n\
  \n<button class=\"btn btn-primary\" @onclick=\"IncrementCount\">Click me</button>\n\
  \n@code {\n    private int currentCount = 0;\n\n    private void IncrementCount()\n\
  \    {\n        currentCount++;\n    }\n}\n```\n\n我们在此代码示例中看到了一些更有趣的行为。首先，你会注意到\
  \ `@page` 指令指向的不是默认路由，因此你可以想象为你的 SPA 设置多个视图。你看到了更多奇怪的语法，但这次我们定义了一个 `<button>` 元素以及当用户按下它时我们希望调用的行为。在这种情况下，`@onclick`\
  \ 提示告诉我们我们想要调用组件上的一个名为 `IncrementCount` 的函数。这是在下面的 `@code` 块中定义的，就像组件将维护的状态字段 `currentCount`\
  \ 一样。它被初始化为 0，但每次按下按钮时都会递增。\n\n虽然你可能不选择像这样直接在 *.Razor* 文件中嵌入组件，但至少可以这样做，并且使得在视图中维护和反映状态变得相当简单。点击\
  \ `Counter` 链接并亲眼看看。停止服务器并尝试在每次按下按钮时使用 `Console.WriteLine` 打印一条消息到控制台。花一分钟惊叹一下，与我们早期关于\
  \ WebAssembly 不支持字符串的抱怨相比，你在这本书中已经取得了多大的进步。\n\n我在这里想指出的最后一件事是 Pages/FetchData.razor\
  \ 文件的内容，如示例 13-10 所示。这包括了对于更有用的 SPA 你需要处理的许多细节，例如获取远程数据、在视图中使用条件逻辑，以及迭代你获取的数据。\n\
  \n#### 示例 13-10. 具有依赖注入 HttpClient 的更复杂的页面\n\n```\n@page \"/fetchdata\"\n@inject\
  \ HttpClient Http\n\n<h1>Weather forecast</h1>\n\n<p>This component demonstrates\
  \ fetching data from the server.</p>\n\n@if (forecasts == null)\n{\n    <p><em>Loading...</em></p>\n\
  }\nelse\n{\n    <table class=\"table\">\n        <thead>\n            <tr>\n   \
  \             <th>Date</th>\n                <th>Temp. (C)</th>\n              \
  \  <th>Temp. (F)</th>\n                <th>Summary</th>\n            </tr>\n   \
  \     </thead>\n        <tbody>\n            @foreach (var forecast in forecasts)\n\
  \            {\n                <tr>\n                    <td>@forecast.Date.ToShortDateString()</td>\n\
  \                    <td>@forecast.TemperatureC</td>\n                    <td>@forecast.TemperatureF</td>\n\
  \                    <td>@forecast.Summary</td>\n                </tr>\n       \
  \     }\n        </tbody>\n    </table>\n}\n```\n\n\n\n\n```\n</tbody>\n</table>\n\
  }\n\n@code {\n    private WeatherForecast[] forecasts;\n\n    protected override\
  \ async Task OnInitializedAsync()\n    {\n        forecasts = await Http.GetFromJsonAsync<WeatherForecast[]>(\"\
  sample-data/weather.json\");\n    }\n\n    public class WeatherForecast\n    {\n\
  \        public DateTime Date { get; set; }\n\n        public int TemperatureC {\
  \ get; set; }\n\n        public string Summary { get; set; }\n\n        public int\
  \ TemperatureF => 32 + (int)(TemperatureC / 0.5556);\n    }\n}\n```\n\n大多数本示例对于熟悉\
  \ C# 和 .NET 功能的开发者来说应该相当清晰。我们对空的初始数据集进行了处理。代码包含一个返回异步 Task 的函数，该函数将用于获取存储在 wwwroot/sample-data/weather.json\
  \ 文件中的 JSON 数据。同样，这在技术上并不是应用程序的一部分，因此不会被编译到程序集中，而是会像其他 HTTP 资源一样被提供。\n\n你已经看到足够的内容，可以知道我们可以导入一个\
  \ JavaScript 函数，从而允许我们使用 XMLHttpRequest 或 fetch 请求来检索数据。对于将 WebAssembly、Web 和 .NET\
  \ 之类的平台集成起来的这种用例来说，其中一个好处是平台直接以一种便捷的机制提供了此功能。\n\n注意示例 13-10 顶部第二个指令。这是一个依赖注入指令。如果你熟悉像\
  \ Spring 这样的基于容器的框架，你会知道这是一种声明式的方式来请求\n\n将正确类型的对象提供给我们的组件。它可能并不清楚这个对象实例将来自何处。如果你看看示例\
  \ 13-11，这就是我们将启动整个过程的主程序。我们在下面突出显示了 HttpClient 被添加到我们的组件的位置。\n\n#### 示例 13-11. 我们项目的\
  \ main 程序\n\n```\nusing System;\nusing System.Net.Http;\nusing System.Collections.Generic;\n\
  using System.Threading.Tasks;\nusing System.Text;\nusing Microsoft.AspNetCore.Components.WebAssembly.Hosting;\n\
  using Microsoft.Extensions.Configuration;\nusing Microsoft.Extensions.DependencyInjection;\n\
  using Microsoft.Extensions.Logging;\n\nnamespace blazor_web\n{\n    public class\
  \ Program\n    {\n        public static async Task Main(string[] args)\n       \
  \ {\n            var builder = WebAssemblyHostBuilder.CreateDefault(args);\n   \
  \         builder.RootComponents.Add<App>(\"#app\");\n\n            builder.Services.AddScoped(sp\n\
  \                => new HttpClient {\n                    BaseAddress = new\nUri(builder.HostEnvironment.BaseAddress)\n\
  \                });\n\n            await builder.Build().RunAsync();\n        }\n\
  \    }\n}\n```\n\n① HttpClient 实例作为基于我们部署上下文的 scoped 组件被添加。\n\n正如指示的行所示，System.Net.Http.HttpClient\
  \ 对象的实例被添加为一个 scoped 组件，可供注入到我们的页面中。这样我们的页面组件就不必担心该对象的生命周期或配置，我们可以重用该功能，并且完全不需要执行额外的配置来将导入的函数传递到我们的代码中。\n\
  \n即使我们只查看了基于 Blazor WebAssembly 项目由命令行 dotnet 工具生成的脚手架项目，我希望你对这种用例为我们做了什么有一个很好的概念。我们本质上拥有一个受益于\
  \ WebAssembly 的环境，而无需将其作为开发运行时的突出特性来展示，如果你不希望它这样的话。我们所构建的应用程序重用了 .NET 框架和组件、Razor\
  \ 语法，以及我们所看到的大量其他功能。\n\n一方面，这将为 C# 开发者提供一种简单的方式来开发可部署到浏览器的应用程序。作为 Dr. Roy Fielding\
  \ 论文⁹ 中详细说明的可选约束之一，这是一种非常有用的方式来扩展我们的“通用客户端”的行为。\n\n使用 .NET 的开发者显然一直有构建 Web 应用程序的方法，但与其他平台一样，它们是后端\
  \ C#（或其他 .NET 语言）和浏览器中 JavaScript 的混合体。我们现在打开了一条通往桌面企业应用程序和现在可以在浏览器中运行的应用程序之间相当大程度重用的路径。这不是一条直接的路径，但我想象随着时间的推移它会变得更好，你只需重新编译代码库即可针对其他平台。\n\
  \n那时我认为这种 WebAssembly 用例可能会掀起更大的波澜。如果老板们意识到他们可以从代码库中获得显著的重用，并且 C# 开发者可以更轻松地构建网页，我认为企业应用程序使用的前端技术将戏剧性地转向\
  \ .NET。\n\n### Uno Platform\n\n还有一个最终的 WebAssembly 和 .NET 集成的用例值得提及，因为它出人意料地比之前的示例具有更广泛的覆盖范围。Uno\
  \ Platform¹⁰ 是一个多平台开发框架，用于使用 C# 和 WinUI 构建像素完美的应用程序。从单一代码库出发，你可以定位 Windows、iOS、macOS、Android、Linux\
  \ 以及现在，借助 WebAssembly，Web。这与 Blazor 承诺的截然不同，尽管基于 Blazor 的应用程序应该可以在这些环境中的浏览器中运行。\n\
  \n区别在于 Uno 也针对原生应用程序并使它们在每个环境中看起来完全相同。这是我整个职业生涯中跨平台开发的一个难题。你要么拥有多个代码库并针对看起来适合操作系统的原生应用程序（例如，应用程序在运行于\
  \ macOS 时看起来像 macOS 应用程序），要么拥有单一代码库在任何地方看起来都一样，因此不像原生应用程序。两者都不是理想的情况。你不希望你的应用程序的行为与用户在其主要桌面环境中习惯的应用程序不同，但你也不想多次重建应用程序。\n\
  \n对于常见的外观和感觉方法，有无数解决方案，但大多数看起来和感觉都很糟糕。那些勉强吸引人且有用的解决方案仅限于原生应用程序，而不运行在浏览器中。这是有原因的，我希望到现在为止已经很清楚了。提供常见外观和感觉的原生库在浏览器中不可用。即使花时间使用\
  \ Canvas-graphics 和 WebGL 或类似技术来模拟是值得的，代码库也必须是 JavaScript 而不是 C、C++ 或 C#，就像其他代码库一样。\n\
  \n这就是 Uno Platform 如此引人注目的原因。他们似乎真的通过一些扎实的工程和抽象解决了这个问题。.NET 应该获得很大一部分功劳，但 WebAssembly\
  \ 是拼图的最后一块。\n\n本书其他地方，我们已将 WebAssembly 作为开发应用程序的主要愿景。这包括它提供的优点和局限性。我们已经看到了围绕这些局限性的各种解决方案，以及额外的工具、基础设施、对平台的扩展新提案等等。对于\
  \ Blazor WebAssembly 以及现在 Uno Platform 来说，WebAssembly 只是一个方便的实现细节。对于 Blazor 来说，无论你是在服务器上托管还是在浏览器中托管，都不会实质性地影响开发风格。两者都使用\
  \ Razor 组件和 JavaScript 互操作。服务器模型只是使用更多分离和独立的通信模型。\n\n对于 Uno Platform 来说，主导的风格、代码库和抽象是围绕\
  \ Xamarin¹¹ 构建的，Xamarin 是一个开源平台，提供针对 Android、iOS、macOS、Linux 或任何有 .NET 运行时可用的地方的跨平台开发。鉴于\
  \ Mono 平台的可移植性，这是实现无处不在的原生支持的手段。\n\nXamarin 包含一种名为 Xamarin.Forms 的用户界面技术，它建立在 XAML\
  \ 组件绑定之上。Uno 不使用 Xamarin 的这一部分，而是专注于基于 WinUI 的应用程序。WinUI 是一个现代用户界面工具包，也建立在 XAML\
  \ 之上，提供 Fluent Design¹²、可访问的应用程序和其他现代应用程序开发技术。\n\n在图 13-6 中，你可以看到 Uno Platform 的高层架构。在\
  \ Windows 上，它可以理解为这些技术的原生平台。定位 iOS、Android 和 macOS 时，Uno Platform 使用 Xamarin Native\
  \ 库与 WinUI 的组合，该组合由 .NET 5 和 .NET 6 平台支持。在 Linux 上，他们使用 Skia 库¹³ 做了一件很酷的事情，该库也是\
  \ WebAssembly 友好的¹⁴。最后，由于 Mono 运行时已被编译为 WebAssembly 并可在浏览器中使用，如你所见，它是定位浏览器的策略的基础。\n\
  \n\n\n\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_298_0.png)\n\n图 13-6. Uno 平台架构\n\
  \n再次强调，为了提供这种令人惊叹范围内的像素级跨平台解决方案，投入了大量的工程工作。我的主要目的是让你了解这个用例，并让你自行探索其是否满足你的需求，因此我将\
  \ Uno Platform 的探索留给你。不过作为激励，我想指出一些它在实际应用中的例子，我认为这些例子能凸显其价值主张。\n\n首先，NuGet Package\
  \ Explorer（NPE），最初是一个基于 .NET 6 的 Windows Presentation Foundation（WPF）应用程序，已被移植到基于\
  \ WebAssembly 目标的渐进式 Web 应用（PWA）。这是一款曾作为原生应用被下载数十万次的应用程序。现在它不仅可用作 Web 应用，而且在 Uno\
  \ 支持的各种平台上都能保持一致的外观和感觉。你可以在图 13-7 中看到 NPE 的运行情况，并在 https://nuget.info 试用一下。\n\n\
  ![](img/16b7990eb0dbf589db177bdbd2f4a189_299_0.png)\n\n图 13-7. 在 macOS 上 Firefox\
  \ 中运行的 NuGet Package Explorer\n\nUno Platform Playground¹⁵ 是另一种让你更熟悉技术组合及其如何融合在一起的绝佳方式。代码片段菜单中提供了大量示例供你探索。图\
  \ 13-8 显示了 Cards 示例，其中包含一个由精美卡片填充的 ListView XAML 元素。\n\n![](img/16b7990eb0dbf589db177bdbd2f4a189_300_0.png)\n\
  \n图 13-8. Uno Platform Playground\n\n最后，图 13-9 显示了一个更复杂的 Uno 基于的 Ray Tracer 示例及其渲染输出。不仅它是一个产生出色效果的更复杂的应用程序，而且也是比较不同语言和运行时环境下光线追踪相对性能的一种方式¹⁶。\n\
  \n![](img/16b7990eb0dbf589db177bdbd2f4a189_301_0.png)\n\n图 13-9. Uno Platform 上的\
  \ Ray Tracer 演示\n\n显然，关于 .NET 和 WebAssembly 这两个独立但强大的平台的集成，还有很多可以说的。关于该主题正在涌现几本新书，我鼓励你去查阅，但我也尝试为你提供了多个可以找到工作项目和代码示例以供自行探索的地方。\n\
  \n在本章中，我们看到了令人兴奋的结果，我认为这预示着我们行业即将发生的转变。至少，它也表明 C# 开发者可以坚持使用他们熟悉和喜爱的语言，并有效地构建在各种地方运行的应用程序，而不必完全依赖前端的\
  \ JavaScript。在下一章中，我们将看到一种让 JavaScript 和 TypeScript 开发者也能受益于 WebAssembly 的方法。\n\n\

- raw: "Clicking Finish on the Summary page returns you to the Create Cluster Wizard,\
    \ where you are greeted with the Access Point for Administering the Cluster page.\
    \ This screen is illustrated in Figure [3-15](#394392_3_En_3_Chapter.xhtml#Fig15).\
    \ On this page, you need to enter the virtual name of your cluster. We will name\
    \ our cluster ALWAYSON-C. If the network card is configured to acquire an IP Address\
    \ automatically, then an IP Address will be assigned using DHCP. Otherwise, you\
    \ will be required to enter an IP Address manually. This is known as a static\
    \ IP, as it will remain constant, whereas an IP Address assigned through DHCP\
    \ may change. I strongly recommend using a static IP for cluster access points\
    \ to avoid dynamic routing issues, but this can be changed after the cluster has\
    \ been created. ![Figure 3-15 ¶ The Access Point for Administering the Cluster\
    \ Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig15_HTML.jpg)\n\nFigure 3-15\
    \ ¶ The Access Point for Administering the Cluster Page\n\nNote \n\nThe virtual\
    \ name and IP address are bound to whichever node is active, meaning that the\
    \ cluster is always accessible in the event of failover.\n\nIn our case, the cluster\
    \ resides within a simple domain, a single site, and a single subnet. If you are\
    \ configuring a multi-subnet cluster, however, then the wizard detects this, and\
    \ IP Addresses will be required for each subnet. In this scenario, you need to\
    \ enter an IP address for each subnet.\n\nNote \n\nEach of the two NICs within\
    \ a node is configured on a separate subnet so that the heartbeat between the\
    \ nodes is segregated from the public network. However, a cluster is only regarded\
    \ as multi-subnet if the data NICs of the cluster nodes reside in different subnets.\n\
    \nTip \n\nIf your cluster will reside within a domain, and if you do not have\
    \ permissions to create AD (Active Directory) objects in the OU (organizational\
    \ unit) that contains your cluster, then the VCO (virtual computer object) for\
    \ the cluster must already exist and you must have the Full Control permission\
    \ assigned.\n\nThe Confirmation page displays a summary of the cluster that is\
    \ created. You can also use this screen to specify whether or not all eligible\
    \ storage should be added to the cluster, which is generally a useful feature.\
    \ This screen is displayed in Figure [3-16](#394392_3_En_3_Chapter.xhtml#Fig16).\
    \ ![Figure 3-16 ¶ The Confirmation Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig16_HTML.jpg)\n\
    \nFigure 3-16 ¶ The Confirmation Page\n\nAfter the cluster has been built, the\
    \ Summary page shown in Figure [3-17](#394392_3_En_3_Chapter.xhtml#Fig17) displays.\
    \ This screen summarizes the cluster name, IP address, nodes, the quorum model\
    \ that have been configured, and details of any warnings regarding the cluster.\
    \ It also provides a link to an HTML (Hypertext Markup Language) version of the\
    \ report. ![Figure 3-17 ¶ The Summary Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig17_HTML.jpg)\n\
    \nFigure 3-17 ¶ The Summary Page\n\nThe Create Cluster report displays a complete\
    \ list of tasks that have been completed during the cluster build.\n\nWe could\
    \ also have used PowerShell to create the cluster. The script in Listing [3-2](#394392_3_En_3_Chapter.xhtml#PC2)\
    \ runs the cluster validation tests using the Test-Cluster cmdlet, before using\
    \ the New-Cluster cmdlet to configure the cluster. #Run the validation tests Test-Cluster\
    \ -Node Clusternode1,Clusternode2 #Create the cluster New-Cluster -Node ClusterNode1,ClusterNode2\
    \ -Name ALWAYSON-C Listing 3-2 \n\nValidating and Creating the Cluster\n\n## Configuring\
    \ the Cluster\n\nMany cluster configurations can be altered, depending on the\
    \ needs of your environment. This section demonstrates how to change some of the\
    \ more common configurations.\n\n### Changing the Quorum\n\nIf we examine our\
    \ cluster storage in the Failover Cluster Manager, by drilling through ALWAYSON-C\
    \ ➤ Storage ➤ Disks and highlighting the disk assigned to quorum, we can see that\
    \ the witness has been correctly configured to use the Quorum volume. This is\
    \ illustrated in Figure [3-18](#394392_3_En_3_Chapter.xhtml#Fig18).   ![Figure\
    \ 3-18 ¶ Cluster Volumes](images/394392_3_En_3_Chapter/394392_3_En_3_Fig18_HTML.jpg)\n\
    \nFigure 3-18 ¶ Cluster Volumes\n\nWe can modify this by entering the context\
    \ menu of the cluster and by selecting More Actions ➤ Configure Cluster Quorum\
    \ Settings, which causes the Configure Cluster Quorum Wizard to be invoked. On\
    \ the Select Quorum Configuration Option page, shown in Figure [3-19](#394392_3_En_3_Chapter.xhtml#Fig19),\
    \ we choose the Select the Quorum Witness option. ![Figure 3-19 ¶ The Select Quorum\
    \ Configuration Option Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig19_HTML.jpg)\n\
    \nFigure 3-19 ¶ The Select Quorum Configuration Option Page\n\nOn the Select Quorum\
    \ Witness page, we select the type of quorum that we want to configure. A disk\
    \ witness is most appropriate when there are an even number of nodes in the cluster\
    \ and all nodes reside in the same data center, or when there are an even number\
    \ of nodes in the primary data center and another node in a secondary data center.\n\
    \nA file share witness is most appropriate when there are nodes split across two\
    \ data centers, and you have access to a third data center, where a file share\
    \ is available to act as a quorum. Windows Server 2019 supports file shares on\
    \ any device that supports SMB 2.0 or above. This includes USB keys which can\
    \ be attached to network routers.\n\nA cloud witness is most appropriate when\
    \ there are nodes spread across two data centers and there is not a third data\
    \ center available to set up a file share witness. To use a cloud witness, you\
    \ must have an Azure storage account, as the witness will be created in Azure\
    \ BLOB storage.\n\nIt is most appropriate to not configure a witness, where there\
    \ are an odd number of nodes in a single data center.\n\nFor our scenario, we\
    \ will select the option to configure a disk witness. This is illustrated in Figure\
    \ [3-20](#394392_3_En_3_Chapter.xhtml#Fig20). ![Figure 3-20 ¶ The Select Quorum\
    \ Witness Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig20_HTML.jpg)\n\n\
    Figure 3-20 ¶ The Select Quorum Witness Page\n\nOn the Configure Storage Witness\
    \ page of the wizard, we can select the correct disk to use as a quorum. In our\
    \ case, this is Disk 4, as illustrated in Figure [3-21](#394392_3_En_3_Chapter.xhtml#Fig21).\
    \ ![Figure 3-21 ¶ The Configure Storage Witness Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig21_HTML.jpg)\n\
    \nFigure 3-21 ¶ The Configure Storage Witness Page\n\nThe Summary page of the\
    \ wizard details the configuration changes that will be made to the cluster. It\
    \ also highlights that dynamic quorum management is enabled and that all nodes,\
    \ plus the quorum disk, have a vote in the quorum.\n\nWe can also perform this\
    \ configuration from the command line by using the PowerShell command in Listing\
    \ [3-3](#394392_3_En_3_Chapter.xhtml#PC3). Here, we use the Set-ClusterQuorum\
    \ cmdlet and pass in the name of the cluster, followed by the quorum type that\
    \ we wish to configure. Because disk is included in this quorum type, we can also\
    \ pass in the name of the cluster disk that we plan to use, and it is this aspect\
    \ that allows us to change the quorum disk.\n\nTip \n\nIf following the demos\
    \ using PowerShell, remember to change the disk number to match your own configuration.\n\
    \nSet-ClusterQuorum -Cluster ALWAYSON-C -NodeAndDiskMajority \"Cluster Disk 4\"\
    \ Listing 3-3 \n\nConfiguring the Quorum Disk\n\n### Advanced Quorum Configuration\n\
    \nRecent versions of Windows Server allow you to configure advanced quorum configuration,\
    \ such as voting weight and cluster witness. In this section, we will explore\
    \ how to configure the vote weight of a node."

    ## Node Weight and Quorum Configuration


    Node weight is generally useful if you have a *multi-subnet cluster*. In this
    scenario, it is recommended that you use a file share witness in a third site.
    This helps you avoid a cluster outage as a result of network failure between data
    centers. If you have an odd number of nodes in the quorum, however, then adding
    a file share witness leaves you with an even number of votes, which is dangerous.
    Removing the vote from one of the nodes in the secondary data center eliminates
    this issue.


    You can also use node weight to temporarily remove the vote from a failed node,
    to avoid it impacting the quorum. I have also seen some people configure all nodes
    to have no vote, leaving the only vote with the disk witness. The idea here is
    to avoid having to dynamically changing the vote configuration should different
    nodes fail at different times. I would avoid this approach, however, as it introduces
    connectivity to the quorum disk as a single point of failure. If your quorum disk
    loses connectivity to the cluster, the cluster will become unavailable.


    The vote weight of each node can be modified by using the Configure Cluster Quorum
    Wizard and choosing the Advanced Quorum configuration option on the Select Quorum
    Configuration Option page. This causes the Select Voting Configuration page to
    be displayed, as illustrated in Figure [3-22](#394392_3_En_3_Chapter.xhtml#Fig22).
    ![Figure 3-22 ¶ Select Voting Configuration Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig22_HTML.jpg)


    Figure 3-22 ¶ Select Voting Configuration Page


    In this example, we have removed the vote from `ClusterNode2`, assuming that the
    node has failed and we do not want it to impact our quorum.


    **Note**

    To follow the rest of this example, you must have an Azure storage account. The
    account must be of the type “General Purpose” and should be configured on the
    standard performance tier and have locally redundant storage.


    To change our disk witness to a cloud witness, we will then select the Configure
    a Cloud Witness option from the Configure Cluster Quorum page of the wizard, as
    shown in Figure [3-23](#394392_3_En_3_Chapter.xhtml#Fig23). ![Figure 3-23 ¶ Select
    Quorum Witness Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig23_HTML.jpg)


    Figure 3-23 ¶ Select Quorum Witness Page


    Because of our selection, we will next be presented with the Configure Cloud Witness
    page of the wizard, as illustrated in Figure [3-24](#394392_3_En_3_Chapter.xhtml#Fig24).
    Here, we need to enter the name of our Azure storage account and primary access
    key of the storage account. The access key can be located in the Azure Portal,
    by drilling through Storage Accounts ➤ <Name of storage account> ➤ Access keys
    and copying Key 1. Generally, the service endpoint will remain with the default
    value; however, there are some occasions where you may need to change it. For
    example, Azure storage accounts in China use a different endpoint. ![Figure 3-24
    ¶ Configure Cloud Witness Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig24_HTML.jpg)


    Figure 3-24 ¶ Configure Cloud Witness Page


    **Note**

    The access key is not held within the cluster configuration. Instead, a `SAS`
    (shared access signature) is generated.


    The final page of the wizard (Figure [3-25](#394392_3_En_3_Chapter.xhtml#Fig25))
    shows the Confirmation page. Here, you should check the details before choosing
    Next to apply the settings. ![Figure 3-25 ¶ Confirmation Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig25_HTML.jpg)


    Figure 3-25 ¶ Confirmation Page


    **Tip**

    If you receive a generic error, asking you to confirm storage account details
    and connectivity over HTTPS, I have found that the most common reason is connectivity.
    The cloud witness requires Port `443` to be open, from all cluster nodes, to the
    Azure storage account.


    To configure the node weight of a node, you can use the script in Listing [3-4](#394392_3_En_3_Chapter.xhtml#PC4).


    ```

    Import-Module FailoverClusters

    (Get-ClusterNode CLUSTERNODE2).NodeWeight = 0

    ```


    Listing 3-4

    Set Node Weight


    To configure a cloud witness using PowerShell, use the script in Listing [3-5](#394392_3_En_3_Chapter.xhtml#PC5).


    **Tip**

    Make sure you change the account name and access key to match your own.


    ```

    Import-Module FailoverClusters

    Set-ClusterQuorum -CloudWitness -AccountName aoag3eds -AccessKey +6lqzNKVpLnDZCrLA0Haz0W8VhoYdW2k==

    ```


    Listing 3-5

    Configure a Cloud Witness with PowerShell


    **Note**

    Examples in the rest of this book assume both nodes have a vote and that a disk
    witness is used.


    ### Configuring MSDTC


    If your instance of SQL Server uses distributed transactions, or if you are installing
    SQL Server Integration Services (`SSIS`), then it relies on `MSDTC` (Microsoft
    Distributed Transaction Coordinator). If your instance will use `MSDTC`, then
    you need to ensure that it is properly configured. If it is not, then setup will
    succeed, but transactions that rely on it may fail.


    When installed on a cluster, SQL Server automatically uses the instance of `MSDTC`
    that is installed in the same role, if one exists. If it does not, then it uses
    the instance of `MSDTC` to which it has been mapped (if this mapping has been
    performed). If there is no mapping, it uses the cluster’s default instance of
    `MSDTC`, and if there is not one, it uses the local machine’s instance of `MSDTC`.


    Many DBAs choose to install `MSDTC` within the same role as SQL Server; however,
    this introduces a problem. If `MSDTC` fails, it can also bring down the instance
    of SQL Server. Of course, the cluster attempts to bring both of the applications
    up on a different node, but this still involves downtime, including the time it
    takes to recover the databases on the new node, which takes a nondeterministic
    duration. For this reason, I recommend installing `MSDTC` in a separate role.
    If you do, the SQL Server instance still utilizes `MSDTC`, since it is the cluster’s
    default instance, and it removes the possibility of `MSDTC` causing an outage
    to SQL Server. This is also preferable to using a mapped instance or the local
    machine instance since it avoids unnecessary configuration, and the `MSDTC` instance
    should be clustered when a clustered instance of SQL Server is using it.


    To create an `MSDTC` role, start by selecting the Configure Role option from the
    Roles context menu in Failover Cluster Manager. This invokes the High Availability
    Wizard. On the Select A Role page of the wizard, select the Distributed Transaction
    Coordinator (DTC) role type, as shown in Figure [3-26](#394392_3_En_3_Chapter.xhtml#Fig26).
    ![Figure 3-26 ¶ The Select Role Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig26_HTML.jpg)


    Figure 3-26 ¶ The Select Role Page


    On the Client Access Point page, illustrated in Figure [3-27](#394392_3_En_3_Chapter.xhtml#Fig27),
    you need to enter a virtual name and IP address for `MSDTC`. In our case, we name
    it `ALWAYSON-MSDTC-C` and assign `10.0.0.21` as the IP address. On a multi-subnet
    cluster, you need to provide an IP address for each network. ![Figure 3-27 ¶ The
    Client Access Point Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig27_HTML.jpg)


    Figure 3-27 ¶ The Client Access Point Page


    On the Select Storage page of the wizard, select the cluster disk on which you
    plan to store the `MSDTC` files, as shown in Figure [3-28](#394392_3_En_3_Chapter.xhtml#Fig28).
    In our case, this is Disk 4. ![Figure 3-28 ¶ The Select Storage Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig28_HTML.jpg)


    Figure 3-28 ¶ The Select Storage Page


    The Confirmation page displays an overview of the role that is about to be created.


    Alternatively, we could create this role in PowerShell. The script in Listing
    [3-6](#394392_3_En_3_Chapter.xhtml#PC6) first uses the `Add-ClusterServerRole`
    cmdlet to create the role. We pass the virtual name to use for the role into the
    `Name` parameter, the name of the cluster disk to use into the `Storage` parameter,
    and the IP address for the role into the `StaticAddress` parameter.

    '
  trans: '

    ## 节点权重和仲裁配置


    节点权重通常在您拥有 *多子网集群* 时很有用。在此场景中，建议您在第三个站点使用文件共享见证。这有助于避免由于数据中心之间网络故障而导致的群集中断。然而，如果仲裁中的节点数为奇数，则添加文件共享见证会使您拥有偶数票，这很危险。从辅助数据中心的一个节点中移除投票可以消除此问题。


    您还可以使用节点权重暂时从失败的节点中移除投票，以避免其影响仲裁。我也见过一些人将所有节点配置为无投票，只保留磁盘见证的唯一投票。这里的想法是避免在不同时间不同节点发生故障时需要动态更改投票配置。然而，我会避免这种方法，因为它会将对仲裁磁盘的连接引入为单点故障。如果您的仲裁磁盘与群集失去连接，群集将变得不可用。


    每个节点的投票权重都可以通过使用配置群集仲裁向导并在选择仲裁配置选项页上选择高级仲裁配置选项来修改。这会导致显示选择投票配置页，如图 3-22 所示。 ![图
    3-22 ¶ 选择投票配置页](img/394392_3_En_3_Fig22_HTML.jpg)


    图 3-22 ¶ 选择投票配置页


    在此示例中，我们已从 `ClusterNode2` 中移除了投票，假设该节点已失败，我们不希望它影响我们的仲裁。


    **注意**

    要继续本示例的其余部分，您必须拥有一个 Azure 存储帐户。该帐户的类型必须是“General Purpose”，并且应配置为标准性能层并具有本地冗余存储。


    要将我们的磁盘见证更改为云见证，我们然后将从向导的配置群集仲裁页中选择配置云见证选项，如图 3-23 所示。 ![图 3-23 ¶ 选择仲裁见证页](img/394392_3_En_3_Fig23_HTML.jpg)


    图 3-23 ¶ 选择仲裁见证页


    由于我们的选择，接下来将显示向导的配置云见证页，如图 3-24 所示。在这里，我们需要输入 Azure 存储帐户的名称和存储帐户的主访问密钥。访问密钥可以在
    Azure 门户中找到，通过 Storage Accounts ➤ <存储帐户名称> ➤ Access keys 导航并复制 Key 1。通常，服务终结点将保持默认值；然而，在某些情况下您可能需要更改它。例如，中国的
    Azure 存储帐户使用不同的终结点。 ![图 3-24 ¶ 配置云见证页](img/394392_3_En_3_Fig24_HTML.jpg)


    图 3-24 ¶ 配置云见证页


    **注意**

    访问密钥不会保存在群集配置中。相反，会生成一个 `SAS`（共享访问签名）。


    向导的最后一页（图 3-25）显示确认页。在这里，您应在选择下一步以应用设置之前检查详细信息。 ![图 3-25 ¶ 确认页](img/394392_3_En_3_Fig25_HTML.jpg)


    图 3-25 ¶ 确认页


    **提示**

    如果您收到一条通用错误，要求您确认存储帐户详细信息和通过 HTTPS 的连接性，我发现最常见的原因是连接性。云见证要求从所有群集节点到 Azure 存储帐户的端口
    `443` 保持开放。


    要配置节点的节点权重，您可以使用列表 3-4 中的脚本。


    ```

    Import-Module FailoverClusters

    (Get-ClusterNode CLUSTERNODE2).NodeWeight = 0

    ```


    列表 3-4

    设置节点权重


    要使用 PowerShell 配置云见证，请使用列表 3-5 中的脚本。


    **提示**

    请确保将帐户名称和访问密钥更改为与您自己的相匹配。


    ```

    Import-Module FailoverClusters

    Set-ClusterQuorum -CloudWitness -AccountName aoag3eds -AccessKey +6lqzNKVpLnDZCrLA0Haz0W8VhoYdW2k==

    ```


    列表 3-5

    使用 PowerShell 配置云见证


    **注意**

    本书其余部分的示例假定两个节点均具有投票权并且使用磁盘见证。


    ### 配置 MSDTC


    如果您的 SQL Server 实例使用分布式事务，或者如果您正在安装 SQL Server Integration Services (`SSIS`)，则它依赖于
    `MSDTC`（Microsoft 分布式事务协调程序）。如果您的实例将使用 `MSDTC`，则需要确保其已正确配置。如果没有，安装将成功，但依赖于它的事务可能会失败。


    当安装在群集上时，SQL Server 会自动使用安装在同一角色中的 `MSDTC` 实例（如果存在）。如果不存在，则它使用已映射到的 `MSDTC` 实例（如果已执行此映射）。如果没有映射，它将使用群集的默认
    `MSDTC` 实例，如果没有，则使用本地计算机的 `MSDTC` 实例。


    许多 DBA 选择在与 SQL Server 相同的角色中安装 `MSDTC`；然而，这会引入一个问题。如果 `MSDTC` 失败，它也可能导致 SQL Server
    实例宕机。当然，群集会尝试将两个应用程序都启动到不同的节点上，但这仍然涉及停机时间，包括在新节点上恢复数据库所需的时间，而该时间是非确定性的。因此，我建议将
    `MSDTC` 安装在单独的角色中。如果您这样做，SQL Server 实例仍会使用 `MSDTC`，因为它是群集的默认实例，并且它消除了 `MSDTC`
    导致 SQL Server 中断的可能性。这也比使用映射实例或本地计算机实例更可取，因为它避免了不必要的配置，并且当群集 SQL Server 实例使用它时，`MSDTC`
    实例应为群集。


    要创建 `MSDTC` 角色，请先在故障转移群集管理器中从角色上下文菜单中选择配置角色选项。这会调用高可用性向导。在向导的 选择角色页 上，选择分布式事务协调程序
    (DTC) 角色类型，如图 3-26 所示。 ![图 3-26 ¶ 选择角色页](img/394392_3_En_3_Fig26_HTML.jpg)


    图 3-26 ¶ 选择角色页


    在图 3-27 所示的客户端访问点页上，您需要为 `MSDTC` 输入虚拟名称和 IP 地址。在我们的例子中，我们将其命名为 `ALWAYSON-MSDTC-C`
    并分配 `10.0.0.21` 作为 IP 地址。在多子网群集中，您需要为每个网络提供一个 IP 地址。 ![图 3-27 ¶ 客户端访问点页](img/394392_3_En_3_Fig27_HTML.jpg)


    图 3-27 ¶ 客户端访问点页



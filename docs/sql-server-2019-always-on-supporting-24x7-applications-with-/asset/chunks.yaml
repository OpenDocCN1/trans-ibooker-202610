- raw: "An event is an occurrence of interest that you can trace. It may be a SQL\
    \ batch completing, a cache miss, or a page split, or virtually anything else\
    \ that can happen within the Database Engine, depending on the nature of the trace\
    \ that you are configuring. Each event is categorized by channel and keyword (also\
    \ known as category). A channel is a high-level categorization, and all events\
    \ in SQL Server 2016 fall into one of the channels described in Table [9-1](#394392_3_En_9_Chapter.xhtml#Tab1).\
    \ Table 9-1 \n\nChannels\n\n| Channel || Description |\n\n| --- | --- |\n\n| Admin\
    \ || Well-known events with well-known resolutions. For example, deadlocks, server\
    \ starts, CPU thresholds being exceeded, and the use of deprecated features. |\n\
    \n| --- | --- |\n\n| Operational || Used for troubleshooting issues. For example,\
    \ bad memory being detected, an AlwaysOn Availability Group replica changing its\
    \ state, and a long IO being detected are all events that fall within the Operational\
    \ channel. |\n\n| Analytic || High-volume events that you can use for troubleshooting\
    \ issues such as performance. For example, a transaction beginning, a lock being\
    \ acquired, and a file read completing are all events that fall within the Analytic\
    \ channel. |\n\n| Debug || Used by developers to diagnose issues by returning\
    \ internal data. The events in the Debug channel are subject to change in future\
    \ versions of SQL Server, so you should avoid them when possible. |\n\nKeywords\
    \ (or categories) are much more fine grain. All events relating to AlwaysOn fall\
    \ into the AlwaysOn and HADR categories. SQL Server exposes 122 events relating\
    \ to AlwaysOn. These events are listed in Table [9-2](#394392_3_En_9_Chapter.xhtml#Tab2).\
    \ Table 9-2 \n\nAlwaysOn Events \n\n| Event || Description |\n\n| --- | --- |\n\
    \n| hadr\\_ddl\\_failover\\_execution\\_state || Raised when a DDL command alters\

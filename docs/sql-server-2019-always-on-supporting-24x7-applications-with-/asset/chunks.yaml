- raw: "| recovery\\_lsn || On the primary replica, recovery\\_lsn indicates the end\
    \ of the transaction log (the final point in the transaction log for point-in-time\
    \ recovery). On a secondary replica, the column indicates the point to which the\
    \ resynchronization would be required. If the value is equal or greater than last\\\
    _hardened\\_lsn, however, then it indicates that resynchronization would not be\
    \ required |\n\n| truncation\\_lsn || For a primary replica, the column indicates\
    \ the minimum log truncation LSN across all secondaries. For a secondary replica,\
    \ the column indicates the log truncation point for that specific database replica\
    \ |\n\n| last\\_sent\\_lsn   || Indicates the end of the last log block that has\
    \ been sent |\n\n| last\\_sent\\_time || The date and time that the last log block\
    \ was sent |\n\n| last\\_recieved\\_lsn || Indicates the end of the last log block\
    \ to be received |\n\n| last\\_hardened\\_lsn || Indicates the start of the last\
    \ log block to be hardened. The value will be NULL for asynchronous commit replicas\
    \ |\n\n| last\\_hardened\\_time || The date and time of the hardened LSN |\n\n\
    | last\\_redone\\_lsn || The LSN of the last log record to be redone on the secondary\
    \ |\n\n| last\\_redone\\_time || The timestamp of the last LSN to be redone on\
    \ the secondary |\n\n| log\\_send\\_queue\\_size || The size of the log records\
    \ that have not yet been sent to the secondary, specified in kilobytes |\n\n|\
    \ log\\_send\\_rate || The speed at which log records are being sent to the secondary,\
    \ specified in kilobytes/sec |\n\n| filestream\\_send\\_rate || The speed at which\
    \ FILESTREAM files are being sent to the secondary, specified in kilobytes/sec\
    \ |\n\n| end\\_of\\_log\\_lsn || The LSN of the final log record within the log\
    \ cache |\n\n| last\\_commit\\_lsn || The LSN of the last committed transaction\
    \ in the transaction log |\n\n| last\\_commit\\_time || The timestamp of the last\
    \ committed LSN in the transaction log |\n\n| low\\_water\\_mark\\_for\\_ghosts\
    \ || The ghost cleanup task (which physically deletes rows that have already been\
    \ logically deleted) uses the minimum value of this column, across all replicas\
    \ of the database, to determine where to start cleaning up records |\n\n| secondary\\\
    _log\\_seconds   || The number of seconds that the secondary replica is behind\
    \ the primary replica |\n\nThe script in Listing [10-5](#394392_3_En_10_Chapter.xhtml#PC5)\
    \ demonstrates how to assess the health availability database, within the HR Availability\
    \ Group. You will notice that we use the DB\\_NAME() function to return the name\
    \ of the database and join the sys.dm\\_hadr\\_database\\_replica\\_states DMV\
    \ to the sys.availability\\_groups and sys.availability\\_replicas catalog views\
    \ to return the names of the Availability Groups and Replicas. SELECT       DB\\\
    _NAME(database\\_id)       ,ag.name       ,ar.replica\\_server\\_name       ,is\\\
    _primary\\_replica       ,synchronization\\_state\\_desc       ,synchronization\\\
    _health\\_desc       ,database\\_state\\_desc FROM sys.dm\\_hadr\\_database\\\
    _replica\\_states drs INNER JOIN sys.availability\\_groups ag       ON drs.group\\\
    _id = ag.group\\_id INNER JOIN sys.availability\\_replicas ar       ON drs.replica\\\
    _id = ar.replica\\_id WHERE ag.name = 'HR'; Listing 10-5 \n\nAssessing the State\
    \ of an Availability Database\n\n## Summary\n\nSQL Server exposes a large amount\
    \ of metadata that can help you troubleshoot issues and audit your configuration.\
    \ While this chapter discusses some of the most helpful metadata, I strongly encourage\
    \ you to explore the hadr DMVs further.\n\nFor failover clustered instances, the\
    \ sys.dm\\_os\\_cluster\\_nodes DMV exposes the health status of nodes within\
    \ a cluster. Further troubleshooting detail can be found by calling the sp\\_server\\\
    _diagnostics system stored procedure.\n\nTip \n\nThe sp\\_server\\_diagnostics\
    \ system stored procedure can also be used for troubleshooting AlwaysOn Availability\
    \ Groups and returns a row for each Availability Group hosted on the instance.\n\
    \nThe sys.dm\\_hadr\\_availability\\_replica\\_states DMV exposes details of the\
    \ health status of Replicas, which host AlwaysOn Availability Groups. To drill\
    \ down to view the health status of databases that participate within an Availability\
    \ Group, the sys.dm\\_hadr\\_database\\_replica\\_states DMV can be queried.\n\
    \nBoth of the DMVs mentioned earlier can be joined to the sys.availability\\_groups\
    \ and sys.availability\\_replicas DMVs to obtain the textual information regarding\
    \ the configuration, as opposed to GUIDs. The sys.dm\\_hadr\\_database\\_replica\\\
    _states DMV can also be joined to sys.databases to obtain further information\
    \ regarding database configuration."

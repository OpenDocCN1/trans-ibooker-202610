- raw: "The configuration-only node does not contain a copy of the user databases,\
    \ but the Availability Group metadata is synchronized, using synchronous commit\
    \ mode. The configuration-only node can use any version of SQL Server, including\
    \ SQL Server Express edition, to avoid additional costs. A single instance can\
    \ also act as the witness for multiple Availability Groups. However, a single\
    \ Availability Group can only ever have a single configuration-only node.\n\n\
    Figure [6-2](#394392_3_En_6_Chapter.xhtml#Fig2) shows the Backup Preferences page\
    \ of the New Availability Group dialog box. Here, we have configured backups to\
    \ be taken from the Primary node. ![Figure 6-2 ¶ New Availability Group Dialog\
    \ Box – Backup Preferences Tab](images/394392_3_En_6_Chapter/394392_3_En_6_Fig2_HTML.jpg)\n\
    \nFigure 6-2 ¶ New Availability Group Dialog Box – Backup Preferences Tab\n\n\
    Because we are only configuring high availability, there is no need to configure\
    \ the Read-only Routing. A discussion of Read-only Routing and other configuration\
    \ options not discussed here can be found in Chapter [5](#394392_3_En_5_Chapter.xhtml),\
    \ however.\n\nAlternatively, we could create the Availability Group via T-SQL,\
    \ using the script in Listing [6-8](#394392_3_En_6_Chapter.xhtml#PC8). USE master\
    \ GO CREATE AVAILABILITY GROUP LinuxAOAG WITH (       AUTOMATED\\_BACKUP\\_PREFERENCE\
    \ = PRIMARY,       DB\\_FAILOVER = OFF,       DTC\\_SUPPORT = NONE,       CLUSTER\\\
    _TYPE = EXTERNAL,       REQUIRED\\_SYNCHRONIZED\\_SECONDARIES\\_TO\\_COMMIT =\
    \ 0 ) FOR DATABASE Sales REPLICA ON       'linuxconfig' WITH (             ENDPOINT\\\
    _URL = 'TCP://linuxconfig.AlwaysOn.com:5022',             AVAILABILITY\\_MODE\
    \ = CONFIGURATION\\_ONLY       ),       'linuxprod' WITH (             ENDPOINT\\\
    _URL = 'TCP://linuxprod.AlwaysOn.com:5022',             FAILOVER\\_MODE = EXTERNAL,\
    \             AVAILABILITY\\_MODE = SYNCHRONOUS\\_COMMIT,             SESSION\\\
    _TIMEOUT = 10,             BACKUP\\_PRIORITY = 50,             SEEDING\\_MODE\
    \ = MANUAL,             PRIMARY\\_ROLE(ALLOW\\_CONNECTIONS = ALL),             SECONDARY\\\
    _ROLE(ALLOW\\_CONNECTIONS = NO)       ),       'linuxsyncha' WITH (             ENDPOINT\\\
    _URL = 'TCP://linuxsyncha.AlwaysOn.com:5022',             FAILOVER\\_MODE = EXTERNAL,\
    \             AVAILABILITY\\_MODE = SYNCHRONOUS\\_COMMIT,             SESSION\\\
    _TIMEOUT = 10,             BACKUP\\_PRIORITY = 0,             SEEDING\\_MODE =\
    \ MANUAL,             PRIMARY\\_ROLE(ALLOW\\_CONNECTIONS = ALL),             SECONDARY\\\
    _ROLE(ALLOW\\_CONNECTIONS = NO)       ) ; GO  Listing 6-8 \n\nCreate the Availability\
    \ Group\n\nTo manually seed the Sales database with a backup, you can copy the\
    \ backup file to the secondary server by running the command in Listing [6-9](#394392_3_En_6_Chapter.xhtml#PC9)\
    \ from the primary server. Scp /var/opt/mssql/data/sales.bak pete@linuxprod:/var/opt/mssql/data\
    \ Listing 6-9 \n\nCopy the Backup of the Sales Database\n\nThe database can be\
    \ restored using the command in Listing [6-10](#394392_3_En_6_Chapter.xhtml#PC10).\
    \ USE master GO RESTORE DATABASE Sales FROM  DISK = '/var/opt/mssql/data/Sales.bak'\
    \ WITH       FILE = 1,       MOVE N'Sales' TO N'/var/opt/mssql/data/Sales.mdf',\
    \       MOVE N'Sales\\_log' TO N'/var/opt/mssql/data/Sales\\_log.ldf',       NORECOVERY\
    \ ; GO Listing 6-10 \n\nRestore the Sales Database\n\nRunning the script in Listing\
    \ [6-11](#394392_3_En_6_Chapter.xhtml#PC11) will join our secondary replica to\
    \ the Availability Group and ensure that it has the appropriate permissions. This\
    \ script needs to be run against all instances that will participate in the Availability\
    \ Group. ALTER AVAILABILITY GROUP LinuxAOAG JOIN WITH (CLUSTER\\_TYPE = EXTERNAL)\
    \ ; GO ALTER AVAILABILITY GROUP LinuxAOAG GRANT CREATE ANY DATABASE ; GO Listing\
    \ 6-11 \n\nJoin the Secondary to the Availability Group\n\n## Configuring the\
    \ Cluster\n\nBefore creating the cluster, we will need to create a login that\
    \ will be used by the Pacemaker account and assign it the permissions that it\
    \ requires, in each of the SQL Server instances that will be participating in\
    \ the Availability Group. This can be achieved by using the script in Listing\
    \ [6-12](#394392_3_En_6_Chapter.xhtml#PC12). CREATE LOGIN Pacemaker WITH PASSWORD\
    \ = 'Pa$$w0rd' GO GRANT ALTER, CONTROL, VIEW DEFINITION ON AVAILABILITY GROUP::LinuxAOAG\
    \       TO Pacemaker ; GRANT VIEW SERVER STATE TO Pacemaker Listing 6-12 \n\n\
    Configure the Pacemaker Login\n\nNext, we will need to configure the firewall.\
    \ The ports that the cluster will require are detailed in Table [6-1](#394392_3_En_6_Chapter.xhtml#Tab1).\
    \ Table 6-1 \n\nPorts Required by Cluster\n\n| Port || Description |\n\n| ---\
    \ | --- |\n\n| TCP 2224 || Required on all nodes. pcsd Web UI and node-to-node\
    \ communication |\n\n| --- | --- |\n\n| TCP 3121 || Required on all nodes if Pacemaker\
    \ has remote nodes. Used for communication between the crmd and pacemaker\\_remoted\
    \ daemons |\n\n| TCP 21064 || Required on all nodes. Used by resources requiring\
    \ DLM |\n\n| UDP 5405 || Required on all nodes. Used by Corosync |\n\n| TCP 1433\
    \ || Required on all nodes. The examples in this chapter have the SQL instances\
    \ listen on 1433; however, you should change this to match your own environment\
    \ |\n\n| TCP 5022 || Required on all nodes. The examples in this chapter have\
    \ the AlwaysOn endpoints on 5022; however, you should change this to match your\
    \ own environment |\n\nListing [6-13](#394392_3_En_6_Chapter.xhtml#PC13) provides\
    \ an example of how to configure firewall rules in Ubuntu. sudo ufw allow 2224/tcp\
    \ sudo ufw allow 3121/tcp sudo ufw allow 21064/tcp sudo ufw allow 5405/udp sudo\
    \ ufw allow 1433/tcp sudo ufw allow 5022/tcp sudo ufw reload Listing 6-13 \n\n\
    Configure Firewall Rules\n\nNext, we will install the Pacemaker components. We\
    \ can do this with the command in Listing [6-14](#394392_3_En_6_Chapter.xhtml#PC14).\
    \ This command should be run on all server participating in the Availability Group.\
    \ sudo apt-get install pacemaker pcs resource-agents Listing 6-14 \n\nInstall\
    \ Pacemaker Components\n\nCaution \n\nFor a production system, be sure to also\
    \ install fence-agents for node fencing.\n\nDuring the installation of the pcs\
    \ components, a hacluster will be created. You should set a password for this\
    \ user using the passwd command, as shown in Listing [6-15](#394392_3_En_6_Chapter.xhtml#PC15).\
    \ After running the command, you will be prompted to enter and then confirm the\
    \ new password.\n\nNote \n\nIt is important that you set the same password on\
    \ each node.\n\nSudo passwd hacluster Listing 6-15 \n\nSet hacluster Password\n\
    \nWe can now enable the pcs and pacemarker services, using the script in Listing\
    \ [6-16](#394392_3_En_6_Chapter.xhtml#PC16). You will notice that before enabling\
    \ pacemaker, we issue a command to destroy any existing cluster. This is because\
    \ a file called /etc/cluster/corosync.conf was created during the install of pcs,\
    \ however, enabling pacemaker attempts to create this file. Using the cluster\
    \ destroy command removes this file to avoid a failure when pacemaker is enabled.\
    \ sudo systemctl enable pcsd sudo systemctl start pcsd sudo pcs cluster destroy\
    \ sudo systemctl enable pacemaker Listing 6-16 \n\nEnable pcs and pacemarker\n\
    \nNow that pacemaker is enabled, we can build the cluster. The process for this\
    \ consists of running five pcs cluster commands. The first is auth. This is used\
    \ to authenticate pcs to the pcs daemon on all of the nodes. The command expects\
    \ a list of nodes, followed by the username and password of the pcs user that\
    \ was created during install. Listing [6-17](#394392_3_En_6_Chapter.xhtml#PC17)\
    \ demonstrates how to use the command in our scenario. sudo pcs cluster auth LinuxProd\
    \ LinuxSyncHA LinuxConfig –u hacluster Listing 6-17 \n\nAuthenticate Against pcs\
    \ Daemon\n\nBecause we have not specified the –p parameter when you run this command,\
    \ you will be prompted to enter the password for hacluster."
  fmt: "\n# Availability Group Configuration\n\nThe configuration-only node does not\
    \ contain a copy of the user databases, but the Availability Group metadata is\
    \ synchronized, using synchronous commit mode. The configuration-only node can\
    \ use any version of `SQL Server`, including `SQL Server Express edition`, to\
    \ avoid additional costs. A single instance can also act as the witness for multiple\
    \ Availability Groups. However, a single Availability Group can only ever have\
    \ a single configuration-only node.\n\nFigure [6-2](#394392_3_En_6_Chapter.xhtml#Fig2)\
    \ shows the Backup Preferences page of the New Availability Group dialog box.\
    \ Here, we have configured backups to be taken from the Primary node. ![Figure\
    \ 6-2 ¶ New Availability Group Dialog Box – Backup Preferences Tab](images/394392_3_En_6_Chapter/394392_3_En_6_Fig2_HTML.jpg)\n\
    \nFigure 6-2 ¶ New Availability Group Dialog Box – Backup Preferences Tab\n\n\
    Because we are only configuring high availability, there is no need to configure\
    \ the Read-only Routing. A discussion of Read-only Routing and other configuration\
    \ options not discussed here can be found in Chapter [5](#394392_3_En_5_Chapter.xhtml),\
    \ however.\n\nAlternatively, we could create the Availability Group via T-SQL,\
    \ using the script in Listing [6-8](#394392_3_En_6_Chapter.xhtml#PC8).\n\n```\n\
    USE master\nGO\nCREATE AVAILABILITY GROUP LinuxAOAG WITH (\n      AUTOMATED_BACKUP_PREFERENCE\
    \ = PRIMARY,\n      DB_FAILOVER = OFF,\n      DTC_SUPPORT = NONE,\n      CLUSTER_TYPE\
    \ = EXTERNAL,\n      REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT = 0\n) FOR DATABASE\
    \ Sales\nREPLICA ON\n      'linuxconfig' WITH (\n            ENDPOINT_URL = 'TCP://linuxconfig.AlwaysOn.com:5022',\n\
    \            AVAILABILITY_MODE = CONFIGURATION_ONLY\n      ),\n      'linuxprod'\
    \ WITH (\n            ENDPOINT_URL = 'TCP://linuxprod.AlwaysOn.com:5022',\n  \
    \          FAILOVER_MODE = EXTERNAL,\n            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n\
    \            SESSION_TIMEOUT = 10,\n            BACKUP_PRIORITY = 50,\n      \
    \      SEEDING_MODE = MANUAL,\n            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n\
    \            SECONDARY_ROLE(ALLOW_CONNECTIONS = NO)\n      ),\n      'linuxsyncha'\
    \ WITH (\n            ENDPOINT_URL = 'TCP://linuxsyncha.AlwaysOn.com:5022',\n\
    \            FAILOVER_MODE = EXTERNAL,\n            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n\
    \            SESSION_TIMEOUT = 10,\n            BACKUP_PRIORITY = 0,\n       \
    \     SEEDING_MODE = MANUAL,\n            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n\
    \            SECONDARY_ROLE(ALLOW_CONNECTIONS = NO)\n      )\n;\nGO\n```\n\nListing\
    \ 6-8\n\nCreate the Availability Group\n\nTo manually seed the Sales database\
    \ with a backup, you can copy the backup file to the secondary server by running\
    \ the command in Listing [6-9](#394392_3_En_6_Chapter.xhtml#PC9) from the primary\
    \ server.\n\n```\nScp /var/opt/mssql/data/sales.bak pete@linuxprod:/var/opt/mssql/data\n\
    ```\n\nListing 6-9\n\nCopy the Backup of the Sales Database\n\nThe database can\
    \ be restored using the command in Listing [6-10](#394392_3_En_6_Chapter.xhtml#PC10).\n\
    \n```\nUSE master\nGO\nRESTORE DATABASE Sales FROM DISK = '/var/opt/mssql/data/Sales.bak'\
    \ WITH\n      FILE = 1,\n      MOVE N'Sales' TO N'/var/opt/mssql/data/Sales.mdf',\n\
    \      MOVE N'Sales_log' TO N'/var/opt/mssql/data/Sales_log.ldf',\n      NORECOVERY\
    \ ;\nGO\n```\n\nListing 6-10\n\nRestore the Sales Database\n\nRunning the script\
    \ in Listing [6-11](#394392_3_En_6_Chapter.xhtml#PC11) will join our secondary\
    \ replica to the Availability Group and ensure that it has the appropriate permissions.\
    \ This script needs to be run against all instances that will participate in the\
    \ Availability Group.\n\n```\nALTER AVAILABILITY GROUP LinuxAOAG JOIN WITH (CLUSTER_TYPE\
    \ = EXTERNAL) ;\nGO\nALTER AVAILABILITY GROUP LinuxAOAG GRANT CREATE ANY DATABASE\
    \ ;\nGO\n```\n\nListing 6-11\n\nJoin the Secondary to the Availability Group\n\
    \n## Configuring the Cluster\n\nBefore creating the cluster, we will need to create\
    \ a login that will be used by the Pacemaker account and assign it the permissions\
    \ that it requires, in each of the SQL Server instances that will be participating\
    \ in the Availability Group. This can be achieved by using the script in Listing\
    \ [6-12](#394392_3_En_6_Chapter.xhtml#PC12).\n\n```\nCREATE LOGIN Pacemaker WITH\
    \ PASSWORD = 'Pa$$w0rd'\nGO\nGRANT ALTER, CONTROL, VIEW DEFINITION ON AVAILABILITY\
    \ GROUP::LinuxAOAG TO Pacemaker ;\nGRANT VIEW SERVER STATE TO Pacemaker\n```\n\
    \nListing 6-12\n\nConfigure the Pacemaker Login\n\nNext, we will need to configure\
    \ the firewall. The ports that the cluster will require are detailed in Table\
    \ [6-1](#394392_3_En_6_Chapter.xhtml#Tab1).\n\nTable 6-1\n\nPorts Required by\
    \ Cluster\n\n| Port || Description |\n| --- | --- |\n| TCP 2224 || Required on\
    \ all nodes. `pcsd` Web UI and node-to-node communication |\n| --- | --- |\n|\
    \ TCP 3121 || Required on all nodes if Pacemaker has remote nodes. Used for communication\
    \ between the `crmd` and `pacemaker_remoted` daemons |\n| TCP 21064 || Required\
    \ on all nodes. Used by resources requiring DLM |\n| UDP 5405 || Required on all\
    \ nodes. Used by Corosync |\n| TCP 1433 || Required on all nodes. The examples\
    \ in this chapter have the SQL instances listen on 1433; however, you should change\
    \ this to match your own environment |\n| TCP 5022 || Required on all nodes. The\
    \ examples in this chapter have the AlwaysOn endpoints on 5022; however, you should\
    \ change this to match your own environment |\n\nListing [6-13](#394392_3_En_6_Chapter.xhtml#PC13)\
    \ provides an example of how to configure firewall rules in Ubuntu.\n\n```\nsudo\
    \ ufw allow 2224/tcp\nsudo ufw allow 3121/tcp\nsudo ufw allow 21064/tcp\nsudo\
    \ ufw allow 5405/udp\nsudo ufw allow 1433/tcp\nsudo ufw allow 5022/tcp\nsudo ufw\
    \ reload\n```\n\nListing 6-13\n\nConfigure Firewall Rules\n\nNext, we will install\
    \ the Pacemaker components. We can do this with the command in Listing [6-14](#394392_3_En_6_Chapter.xhtml#PC14).\
    \ This command should be run on all server participating in the Availability Group.\n\
    \n```\nsudo apt-get install pacemaker pcs resource-agents\n```\n\nListing 6-14\n\
    \nInstall Pacemaker Components\n\n**Caution**\n\nFor a production system, be sure\
    \ to also install `fence-agents` for node fencing.\n\nDuring the installation\
    \ of the `pcs` components, a `hacluster` will be created. You should set a password\
    \ for this user using the `passwd` command, as shown in Listing [6-15](#394392_3_En_6_Chapter.xhtml#PC15).\
    \ After running the command, you will be prompted to enter and then confirm the\
    \ new password.\n\n**Note**\n\nIt is important that you set the same password\
    \ on each node.\n\n```\nSudo passwd hacluster\n```\n\nListing 6-15\n\nSet hacluster\
    \ Password\n\nWe can now enable the `pcsd` and `pacemarker` services, using the\
    \ script in Listing [6-16](#394392_3_En_6_Chapter.xhtml#PC16). You will notice\
    \ that before enabling pacemaker, we issue a command to destroy any existing cluster.\
    \ This is because a file called `/etc/cluster/corosync.conf` was created during\
    \ the install of `pcs`, however, enabling pacemaker attempts to create this file.\
    \ Using the `cluster destroy` command removes this file to avoid a failure when\
    \ pacemaker is enabled.\n\n```\nsudo systemctl enable pcsd\nsudo systemctl start\
    \ pcsd\nsudo pcs cluster destroy\nsudo systemctl enable pacemaker\n```\n\nListing\
    \ 6-16\n\nEnable pcs and pacemarker\n\nNow that pacemaker is enabled, we can build\
    \ the cluster. The process for this consists of running five `pcs cluster` commands.\
    \ The first is `auth`. This is used to authenticate `pcs` to the `pcs` daemon\
    \ on all of the nodes. The command expects a list of nodes, followed by the username\
    \ and password of the `pcs` user that was created during install. Listing [6-17](#394392_3_En_6_Chapter.xhtml#PC17)\
    \ demonstrates how to use the command in our scenario.\n\n```\nsudo pcs cluster\
    \ auth LinuxProd LinuxSyncHA LinuxConfig –u hacluster\n```\n\nListing 6-17\n\n\
    Authenticate Against pcs Daemon\n\nBecause we have not specified the `–p` parameter\
    \ when you run this command, you will be prompted to enter the password for `hacluster`.\n"
  trans: "\n# 可用性组配置\n\n仅配置节点不包含用户数据库的副本，但可用性组元数据会使用同步提交模式进行同步。仅配置节点可以使用任何版本的 `SQL\
    \ Server`，包括 `SQL Server Express edition`，以避免额外成本。单个实例也可以作为多个可用性组的见证者。然而，单个可用性组永远只能有一个仅配置节点。\n\
    \n图 6-2 显示了新建可用性组对话框的备份首选项页面。在这里，我们已配置从主节点获取备份。 ![图 6-2 ¶ 新可用性组对话框 – 备份首选项选项卡](img/394392_3_En_6_Fig2_HTML.jpg)\n\
    \n图 6-2 ¶ 新可用性组对话框 – 备份首选项选项卡\n\n由于我们仅配置高可用性，因此无需配置只读路由。关于只读路由以及本文未讨论的其他配置选项的讨论，可在第\
    \ 5 章找到。\n\n另外，我们也可以通过 T-SQL 创建可用性组，使用列表 6-8 中的脚本。\n\n```\nUSE master\nGO\nCREATE\
    \ AVAILABILITY GROUP LinuxAOAG WITH (\n      AUTOMATED_BACKUP_PREFERENCE = PRIMARY,\n\
    \      DB_FAILOVER = OFF,\n      DTC_SUPPORT = NONE,\n      CLUSTER_TYPE = EXTERNAL,\n\
    \      REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT = 0\n) FOR DATABASE Sales\n\
    REPLICA ON\n      'linuxconfig' WITH (\n            ENDPOINT_URL = 'TCP://linuxconfig.AlwaysOn.com:5022',\n\
    \            AVAILABILITY_MODE = CONFIGURATION_ONLY\n      ),\n      'linuxprod'\
    \ WITH (\n            ENDPOINT_URL = 'TCP://linuxprod.AlwaysOn.com:5022',\n  \
    \          FAILOVER_MODE = EXTERNAL,\n            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n\
    \            SESSION_TIMEOUT = 10,\n            BACKUP_PRIORITY = 50,\n      \
    \      SEEDING_MODE = MANUAL,\n            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n\
    \            SECONDARY_ROLE(ALLOW_CONNECTIONS = NO)\n      ),\n      'linuxsyncha'\
    \ WITH (\n            ENDPOINT_URL = 'TCP://linuxsyncha.AlwaysOn.com:5022',\n\
    \            FAILOVER_MODE = EXTERNAL,\n            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n\
    \            SESSION_TIMEOUT = 10,\n            BACKUP_PRIORITY = 0,\n       \
    \     SEEDING_MODE = MANUAL,\n            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n\
    \            SECONDARY_ROLE(ALLOW_CONNECTIONS = NO)\n      )\n;\nGO\n```\n\n列表\
    \ 6-8\n\n创建可用性组\n\n要手动使用备份播种 Sales 数据库，可以从主服务器运行列表 6-9 中的命令，将备份文件复制到辅助服务器。\n\n\
    ```\nScp /var/opt/mssql/data/sales.bak pete@linuxprod:/var/opt/mssql/data\n```\n\
    \n列表 6-9\n\n复制 Sales 数据库的备份\n\n可以使用列表 6-10 中的命令还原数据库。\n\n```\nUSE master\nGO\n\
    RESTORE DATABASE Sales FROM DISK = '/var/opt/mssql/data/Sales.bak' WITH\n    \
    \  FILE = 1,\n      MOVE N'Sales' TO N'/var/opt/mssql/data/Sales.mdf',\n     \
    \ MOVE N'Sales_log' TO N'/var/opt/mssql/data/Sales_log.ldf',\n      NORECOVERY\
    \ ;\nGO\n```\n\n列表 6-10\n\n还原 Sales 数据库\n\n运行列表 6-11 中的脚本将把我们的辅助副本加入可用性组，并确保其具有适当的权限。此脚本需要在将参与可用性组的所有实例上运行。\n\
    \n```\nALTER AVAILABILITY GROUP LinuxAOAG JOIN WITH (CLUSTER_TYPE = EXTERNAL)\
    \ ;\nGO\nALTER AVAILABILITY GROUP LinuxAOAG GRANT CREATE ANY DATABASE ;\nGO\n\
    ```\n\n列表 6-11\n\n将辅助副本加入可用性组\n\n## 配置集群\n\n在创建集群之前，我们需要在将参与可用性组的每个 SQL Server\
    \ 实例中创建一个将由 Pacemaker 账户使用的登录名，并为其分配所需的权限。这可以通过使用列表 6-12 中的脚本来实现。\n\n```\nCREATE\
    \ LOGIN Pacemaker WITH PASSWORD = 'Pa$$w0rd'\nGO\nGRANT ALTER, CONTROL, VIEW DEFINITION\
    \ ON AVAILABILITY GROUP::LinuxAOAG TO Pacemaker ;\nGRANT VIEW SERVER STATE TO\
    \ Pacemaker\n```\n\n列表 6-12\n\n配置 Pacemaker 登录\n\n接下来，我们需要配置防火墙。集群所需的端口在表 6-1\
    \ 中详细说明。\n\n表 6-1\n\n集群所需的端口\n\n| 端口 || 描述 |\n| --- | --- |\n| TCP 2224 || 所有节点均需。`pcsd`\
    \ Web UI 和节点间通信 |\n| --- | --- |\n| TCP 3121 || 如果 Pacemaker 具有远程节点，则所有节点均需。用于\
    \ `crmd` 与 `pacemaker_remoted` 守护进程之间的通信 |\n| TCP 21064 || 所有节点均需。由需要 DLM 的资源使用\
    \ |\n| UDP 5405 || 所有节点均需。由 Corosync 使用 |\n| TCP 1433 || 所有节点均需。本章中的示例将 SQL 实例监听在\
    \ 1433 上；然而，您应将其更改为与您自己的环境相匹配 |\n| TCP 5022 || 所有节点均需。本章中的示例将 AlwaysOn 端点设在 5022\
    \ 上；然而，您应将其更改为与您自己的环境相匹配 |\n\n列表 6-13 提供了在 Ubuntu 中配置防火墙规则的示例。\n\n```\nsudo ufw\
    \ allow 2224/tcp\nsudo ufw allow 3121/tcp\nsudo ufw allow 21064/tcp\nsudo ufw\
    \ allow 5405/udp\nsudo ufw allow 1433/tcp\nsudo ufw allow 5022/tcp\nsudo ufw reload\n\
    ```\n\n列表 6-13\n\n配置防火墙规则\n\n接下来，我们将安装 Pacemaker 组件。我们可以使用列表 6-14 中的命令来完成。此命令应在参与可用性组的所有服务器上运行。\n\
    \n```\nsudo apt-get install pacemaker pcs resource-agents\n```\n\n列表 6-14\n\n\
    安装 Pacemaker 组件\n\n**警告**\n\n对于生产系统，请确保还安装 `fence-agents` 用于节点隔离。\n\n在安装 `pcs`\
    \ 组件期间，会创建 `hacluster`。您应使用 `passwd` 命令为此用户设置密码，如列表 6-15 所示。运行命令后，您将被提示输入并确认新密码。\n\
    \n**注意**\n\n重要的是在每个节点上设置相同的密码。\n\n```\nSudo passwd hacluster\n```\n\n列表 6-15\n\
    \n设置 hacluster 密码\n\n我们现在可以使用列表 6-16 中的脚本启用 `pcsd` 和 `pacemarker` 服务。您会注意到在启用\
    \ pacemaker 之前，我们会发出销毁任何现有集群的命令。这是因为在安装 `pcs` 时创建了名为 `/etc/cluster/corosync.conf`\
    \ 的文件，然而，启用 pacemaker 会尝试创建此文件。使用 `cluster destroy` 命令会删除此文件，以避免在启用 pacemaker\
    \ 时出现失败。\n\n```\nsudo systemctl enable pcsd\nsudo systemctl start pcsd\nsudo pcs\
    \ cluster destroy\nsudo systemctl enable pacemaker\n```\n\n列表 6-16\n\n启用 pcs 和\
    \ pacemarker\n\n现在 pacemaker 已启用，我们可以构建集群。此过程包括运行五个 `pcs cluster` 命令。第一个是 `auth`。它用于将\
    \ `pcs` 身份验证到所有节点上的 `pcs` 守护进程。该命令期望一个节点列表，后跟在安装期间创建的 `pcs` 用户的用户名和密码。列表 6-17\
    \ 演示了在我们的场景中如何使用该命令。\n\n```\nsudo pcs cluster auth LinuxProd LinuxSyncHA LinuxConfig\
    \ –u hacluster\n```\n\n列表 6-17\n\n对 pcs 守护进程进行身份验证\n\n由于您运行此命令时未指定 `–p` 参数，您将被提示输入\
    \ `hacluster` 的密码。\n\n"

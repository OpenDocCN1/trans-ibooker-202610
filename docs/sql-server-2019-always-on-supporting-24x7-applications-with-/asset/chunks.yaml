    ## 使用向导添加节点


    在“群集节点配置”页上，如图 4-19 所示，您将被要求确认要添加节点的实例名称。如果群集上有多个实例，则可以使用下拉框选择适当的实例。

    ![图 4-19 ¶ 添加故障转移群集节点向导 – 群集节点配置页](img/394392_3_En_4_Fig19_HTML.jpg)


    图 4-19 ¶ 添加故障转移群集节点向导 – 群集节点配置页


    在“群集网络配置”页上，如图 4-20 所示，您确认网络详细信息。这些应与群集中第一个节点相同，包括相同的 IP 地址，因为它当然是在两个节点之间共享的。

    ![图 4-20 ¶ 群集网络配置页](img/394392_3_En_4_Fig20_HTML.jpg)


    图 4-20 ¶ 群集网络配置页


    在向导的“服务帐户”页上，大部分信息处于只读模式，您无法修改它。这是因为您使用的服务帐户必须对群集的每个节点都相同。不过，您需要重新输入服务帐户密码。此页如图
    4-21 所示。

    ![图 4-21 ¶ 服务帐户页](img/394392_3_En_4_Fig21_HTML.jpg)


    图 4-21 ¶ 服务帐户页


    现在向导已拥有所有所需信息，在摘要页显示之前会进行额外的规则检查。摘要页称为“准备添加节点”页，提供安装期间进行的活动摘要。


    ## 使用 PowerShell 添加节点


    要使用 `PowerShell` 而不是 GUI 添加节点，您可以运行 SQL Server 的 `setup.exe` 应用程序并使用 `AddNode`
    操作。从命令行添加节点时，表 4-2 中详细说明的参数是强制性的。


    表 4-2

    `AddNode` 操作的强制参数


    | 参数 | 用途 |

    | --- | --- |

    | `/ACTION` | 必须配置为 `AddNode`。 |

    | `/IACCEPTSQLSERVERLICENSETERMS` | 在 Windows Server Core 上安装时为强制性，因为在 Windows
    Server Core 上必须指定 `/qs` 开关。 |

    | `/INSTANCENAME` | 您要添加额外节点以支持的实例。 |

    | `/CONFIRMIPDEPENDENCYCHANGE` | 允许为多子网群集指定多个 IP 地址。传入 1 表示 True，0 表示 False。 |

    | `/FAILOVERCLUSTERIPADDRESSES` | 指定实例要使用的 IP 地址（es），格式为 ` <IP Type>;<address>;<network
    name>;<subnet mask>`。对于多子网群集，IP 地址以空格分隔。 |

    | `/FAILOVERCLUSTERNETWORKNAME` | 群集实例的虚拟名称。 |

    | `/INSTALLSQLDATADIR` | 放置 SQL Server 数据文件的文件夹。这必须是群集磁盘。 |

    | `/SQLSVCACCOUNT` | 用于运行数据库引擎的服务帐户。 |

    | `/SQLSVCPASSWORD` | 用于运行数据库引擎的服务帐户的密码。 |

    | `/AGTSVCACCOUNT` | 用于运行 SQL Server Agent 的服务帐户。 |

    | `/AGTSVCPASSWORD` | 用于运行 SQL Server Agent 的服务帐户的密码。 |


    从安装介质的根文件夹运行它时，列表 4-2 中的脚本会将 `ClusterNode2` 添加到角色中。


    ```

    .\setup.exe /IACCEPTSQLSERVERLICENSETERMS /ACTION="AddNode" /INSTANCENAME="MSSQLSERVER"
    /SQLSVCACCOUNT="ALWAYSON\SQLServiceAccount" /SQLSVCPASSWORD="Pa$$w0rd" /AGTSVCACCOUNT="ALWAYSON\SQLServiceAccount"
    /AGTSVCPASSWORD="Pa$$w0rd" /FAILOVERCLUSTERIPADDRESSES="IPv4;10.0.0.9;Cluster
    Network 2;255.255.255.0" /CONFIRMIPDEPENDENCYCHANGE=0 /qs

    ```


    列表 4-2

    使用 PowerShell 添加节点


    ## 摘要


    AlwaysOn 故障转移群集实例可以使用 SQL Server 安装中心或通过 `PowerShell` 安装。使用 SQL Server 安装中心时，流程与独立实例的安装非常相似；但是，您需要指定其他详细信息，例如网络名称、IP
    地址和资源组配置。


    使用 `PowerShell` 安装实例时，您将使用 `InstallFailoverCluster` 操作，指定 `/FAILOVERCLUSTERIPADDRESSES`、`/FAILOVERCLUSTERNETWORKNAME`
    和 `/INSTALLSQLDATADIR` 参数，此外还需指定独立实例构建所需的参数。



    | hadr\_xrf\_deleteRecLsn\_beforeEntry || Fires immediately before the recovery
    Log Sequence Number is deleted from the metadata |


    | hadr\_xrf\_updateXrf\_partialUpdate || Fires during an updating secondary''s
    recovery forks stack. Specifically, it fires after deleting extra entries in the
    secondary stack, but before copying new entries from primary |


    | hadr\_xrf\_updateXrf\_before\_recoveryLsn\_update || Fires during an updating
    secondary''s recovery forks stack. Specifically, it fires after updating the stack
    but before saving the recovery Log Sequence Number in the metadata |


    | hadr\_xrf\_copyXrf\_partialCopy || Fires after deleting a secondary''s stack
    entries, but before copying primary''s entries |


    | alwayson\_ddl\_executed || Fires when AlwaysOn DDL statement is executed |


    | availability\_replica\_state || Fires when an Availability Replica is starting
    or shutting down |


    | availability\_replica\_state\_change || Fires when the state of the Availability
    Replica has changed |'

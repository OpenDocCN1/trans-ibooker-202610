    ## Adding a Node Using Wizard


    On the Cluster Node Configuration page, illustrated in Figure [4-19](#394392_3_En_4_Chapter.xhtml#Fig19),
    you are asked to confirm the instance name to which you are adding a node. If
    you have multiple instances on the cluster, then you can use the drop-down box
    to select the appropriate instance.

    ![Figure 4-19 ¶ Add a Failover Cluster Node Wizard – Cluster Node Configuration
    Page](images/394392_3_En_4_Chapter/394392_3_En_4_Fig19_HTML.jpg)


    Figure 4-19 ¶ Add a Failover Cluster Node Wizard – Cluster Node Configuration
    Page


    On the Cluster Network Configuration page, shown in Figure [4-20](#394392_3_En_4_Chapter.xhtml#Fig20),
    you confirm the network details. These should be identical to the first node in
    the cluster, including the same IP address, since this is, of course, shared between
    the two nodes.

    ![Figure 4-20 ¶ The Cluster Network Configuration Page](images/394392_3_En_4_Chapter/394392_3_En_4_Fig20_HTML.jpg)


    Figure 4-20 ¶ The Cluster Network Configuration Page


    On the Service Accounts page of the wizard, most of the information is in read-only
    mode and you are not able to modify it. This is because the service accounts you
    use must be the same for each node of the cluster. You need to reenter the service
    account passwords, however. This page is shown in Figure [4-21](#394392_3_En_4_Chapter.xhtml#Fig21).

    ![Figure 4-21 ¶ The Service Accounts Page](images/394392_3_En_4_Chapter/394392_3_En_4_Fig21_HTML.jpg)


    Figure 4-21 ¶ The Service Accounts Page


    Now that the wizard has all of the required information, an additional rules check
    is carried out before the summary page displays. The summary page, known as the
    Ready to Add Node page, provides a summary of the activities that take place during
    the installation.


    ## Adding a Node Using PowerShell


    To add a node using `PowerShell` instead of the GUI, you can run SQL Server’s
    `setup.exe` application with an `AddNode` action. When you add a node from the
    command line, the parameters detailed in Table [4-2](#394392_3_En_4_Chapter.xhtml#Tab2)
    are mandatory.


    Table 4-2

    Mandatory Parameters for the `AddNode` Action


    | Parameter | Usage |

    | --- | --- |

    | `/ACTION` | Must be configured as `AddNode`. |

    | `/IACCEPTSQLSERVERLICENSETERMS` | Mandatory when installing on Windows Server
    Core, since the `/qs` switch must be specified on Windows Server Core. |

    | `/INSTANCENAME` | The instance that you are adding the extra node to support.
    |

    | `/CONFIRMIPDEPENDENCYCHANGE` | Allows multiple IP addresses to be specified
    for multi-subnet clusters. Pass in a value of 1 for True or 0 for False. |

    | `/FAILOVERCLUSTERIPADDRESSES` | Specifies the IP address(es) to use for the
    instance in the format ` <IP Type>;<address>;<network name>;<subnet mask>`. For
    multi-subnet clusters, the IP addresses are space delimited. |

    | `/FAILOVERCLUSTERNETWORKNAME` | The virtual name of the clustered instance.
    |

    | `/INSTALLSQLDATADIR` | The folder in which to place SQL Server data files. This
    must be a cluster disk. |

    | `/SQLSVCACCOUNT` | The service account that is used to run the Database Engine.
    |

    | `/SQLSVCPASSWORD` | The password of the service account that is used to run
    the Database Engine. |

    | `/AGTSVCACCOUNT` | The service account that issued to run SQL Server Agent.
    |

    | `/AGTSVCPASSWORD` | The password of the service account that is used to run
    SQL Server Agent. |


    The script in Listing [4-2](#394392_3_En_4_Chapter.xhtml#PC2) adds `ClusterNode2`
    to the role when you run it from the root folder of the install media.


    ```

    .\setup.exe /IACCEPTSQLSERVERLICENSETERMS /ACTION="AddNode" /INSTANCENAME="MSSQLSERVER"
    /SQLSVCACCOUNT="ALWAYSON\SQLServiceAccount" /SQLSVCPASSWORD="Pa$$w0rd" /AGTSVCACCOUNT="ALWAYSON\SQLServiceAccount"
    /AGTSVCPASSWORD="Pa$$w0rd" /FAILOVERCLUSTERIPADDRESSES="IPv4;10.0.0.9;Cluster
    Network 2;255.255.255.0" /CONFIRMIPDEPENDENCYCHANGE=0 /qs

    ```


    Listing 4-2

    Adding a Node Using PowerShell


    ## Summary


    An AlwaysOn Failover Clustered Instance can be installed using SQL Server Installation
    Center or via `PowerShell`. When using the SQL Server Installation Center, the
    process is very similar to the installation of a stand-alone instance; however,
    you will need to specify additional details, such as the network name, IP Address,
    and resource group configuration.


    When using `PowerShell` to install the Instance, you will use the `InstallFailoverCluster`
    action, specifying the `/FAILOVERCLUSTERIPADDRESSES`, `/FAILOVERCLUSTERNETWORKNAME`,
    and `/INSTALLSQLDATADIR` parameters, in addition to the parameters required for
    a stand-alone instance build.



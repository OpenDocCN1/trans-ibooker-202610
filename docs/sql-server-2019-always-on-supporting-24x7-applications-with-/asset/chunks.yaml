- raw: "The limitations surrounding shared disks with VMware features can be worked\
    \ around by presenting the storage directly to the guest OS over an iSCSI connection\
    \ at the expense of performance degradation.\n\nAOAG  is the most appropriate\
    \ technology for DR when you have a proactive failover requirement but when you\
    \ do not need to implement a load delay. AOAG may also be suitable for disaster\
    \ recovery in scenarios where you wish to utilize your DR server for offloading\
    \ reporting. This allows the redundant servers to be utilized. When used for disaster\
    \ recovery , AOAG works in an asynchronous mode. This means that it is possible\
    \ to lose data in the event of a failover. The RPO is nondeterministic and is\
    \ based on the time of the last uncommitted transaction.\n\nIn the old days, of\
    \ database mirroring, the secondary database was always offline. This means that\
    \ you cannot use the secondary database to offload any reporting or other read-only\
    \ activity. It is possible to work around this by creating a database snapshot\
    \ against the secondary database and pointing read-only activity to the snapshot.\
    \ This can still be complicated, however, because you must configure your application\
    \ to issue read-only statements against a different network name and IP address.\
    \ Availability Groups, on the other hand, allow you to configure one or more replicas\
    \ as readable. The only limitation is that readable replicas and automatic failover\
    \ cannot be configured on the same secondaries. The norm, however, would be to\
    \ configure readable secondary replicas in asynchronous commit mode so that they\
    \ do not impair performance.\n\nTo further simplify this, the Availability Group\
    \ Replica checks for the read-only or read-intent properties in an applications\
    \ connection string and points the application to the appropriate node. This means\
    \ that you can easily scale reporting and database maintenance routines horizontally\
    \ with very little development effort and with the applications being able to\
    \ use a single connection string.\n\nBecause AOAG allows you to combine synchronous\
    \ replicas (with or without automatic failover), asynchronous replicas, and replicas\
    \ for read-only access, it allows you to satisfy high availability, disaster recovery,\
    \ and reporting scale-out requirements using a single technology. If you’re sole\
    \ requirement is read-scaling, as opposed to HA or DR, then it is actually possible\
    \ to configure Availability Groups with no cluster, from SQL Server 2017 onward.\
    \ In this case, there is no cluster service and hence no automatic redirection.\
    \ Replicas within the Availability Groups use certificate when communicating with\
    \ each other. This is also true if you configure Availability Groups without AD,\
    \ in a workgroup, or cross-domain.\n\nWhen you are using AOAG, failover does not\
    \ occur at the database level, nor at the instance level. Instead, failover occurs\
    \ at the level of the availability group. The availability group is a concept\
    \ that allows you to group related databases together so that they can fail over\
    \ as an atomic unit. This is particularly useful in consolidated environments,\
    \ because it allows you to group together the databases that map to a single application.\
    \ You can then fail over this application to another replica for the purposes\
    \ of DR testing, among other reasons, without having an impact on the other data-tier\
    \ applications that are hosted on the instance.\n\nNo hard limits are imposed\
    \ for the number of availability groups you can configure on an instance, nor\
    \ are there any hard limits for the number of databases on an instance that can\
    \ take part in AOAG. Microsoft, however, has tested up to, and officially recommends,\
    \ a maximum of 100 databases and 10 availability groups per instance. The main\
    \ limiting factor in scaling the number of databases is that AOAG uses a database\
    \ mirroring endpoint and there can only be one per instance. This means that the\
    \ log stream for all data modifications is sent over the same endpoint.\n\nFigure\
    \ [2-5](#394392_3_En_2_Chapter.xhtml#Fig5) depicts how you can map data-tier applications\
    \ to availability groups for independent failover. In this example, a single instance\
    \ hosts two data-tier applications. Each application has been added to a separate\
    \ availability group. The first availability group has failed over to Node2. Therefore,\
    \ the availability group listeners point traffic for Application1 to Node2 and\
    \ traffic for Application2 to Node1. Because each availability group has its own\
    \ network name and IP address, and because these resources fail over with the\
    \ AOAG, the application is able to seamlessly reconnect to the databases after\
    \ failover. ![Figure 2-5 ¶ Availability Groups Failover ](images/394392_3_En_2_Chapter/394392_3_En_2_Fig5_HTML.jpg)\n\
    \nFigure 2-5 ¶ Availability Groups Failover \n\nThe diagram in Figure [2-6](#394392_3_En_2_Chapter.xhtml#Fig6)\
    \ depicts an AlwaysOn Availability Group topology. In this example, there are\
    \ four nodes in the cluster and a disk witness. Node1 is hosting the primary replicas\
    \ of the databases, Node2 is being used for automatic failover, Node3 is being\
    \ used to offload reporting, and Node4 is being used for DR. Because the cluster\
    \ is stretched across two data centers, multi-subnet clustering has been implemented.\
    \ Because there is no shared storage, however, there is no need for SAN replication\
    \ between the sites. ![Figure 2-6 ¶ AlwaysOn Availability Group Topology](images/394392_3_En_2_Chapter/394392_3_En_2_Fig6_HTML.jpg)\n\
    \nFigure 2-6 ¶ AlwaysOn Availability Group Topology\n\n### Automatic Page Repair\n\
    \nIf a page becomes  corrupt in a database configured as a replica in an AlwaysOn\
    \ Availability Group topology, then SQL Server attempts to fix the corruption\
    \ by obtaining a copy of the pages from one of the secondary replicas. This means\
    \ that a logical corruption can be resolved without you needing to perform a restore\
    \ or for you to run DBCC CHECKDB with a repair option. However, automatic page\
    \ repair does not work for the following page types: \n\n*   File Header page\n\
    \n*   Database Boot page\n\n*   Allocation pages \n\n    *   GAM (Global Allocation\
    \ Map)\n\n    *   SGAM (Shared Global Allocation Map)\n\n    *   PFS (Page Free\
    \ Space)\n\nIf the primary replica fails to read a page because it is corrupt,\
    \ it first logs the page in the MSDB.dbo.suspect\\_pages table. It then checks\
    \ that at least one replica is in the SYNCHRONIZED state and that transactions\
    \ are still being sent to the replica. If these conditions are met, then the primary\
    \ sends a broadcast to all replicas, specifying the PageID and LSN (log sequence\
    \ number) at the end of the flushed log. The page is then marked as restore pending,\
    \ meaning that any attempts to access it will fail, with error code 829.\n\nAfter\
    \ receiving the broadcast, the secondary replicas wait, until they have redone\
    \ transactions up to the LSN specified in the broadcast message. At this point,\
    \ they try to access the page. If they cannot access it, they return an error.\
    \ If they *can* access the page, they send the page back to the primary replica.\
    \ The primary replica accepts the page from the first secondary to respond.\n\n\
    The primary replica will then replace the corrupt copy of the page with the version\
    \ that it received from the secondary replica. When this process completes, it\
    \ updates the page in the MSDB.dbo.suspect\\_pages table to reflect that it has\
    \ been repaired by setting the event\\_type column to a value of 5 (Repaired).\n\
    \nIf the secondary replica  fails to read a page while redoing the log because\
    \ it is corrupt, it places the secondary into the SUSPENDED state. It then logs\
    \ the page in the MSDB.dbo.suspect\\_pages table and requests a copy of the page\
    \ from the primary replica. The primary replica attempts to access the page. If\
    \ it is inaccessible, then it returns an error and the secondary replica remains\
    \ in the SUSPENDED state."
  fmt: "\n# AlwaysOn Availability Groups Overview\n\n## Shared Disk Limitations and\
    \ iSCSI Workaround\n\nThe limitations surrounding shared disks with `VMware` features\
    \ can be worked around by presenting the storage directly to the guest OS over\
    \ an `iSCSI` connection at the expense of performance degradation.\n\n## AOAG\
    \ for Disaster Recovery\n\n`AOAG` is the most appropriate technology for DR when\
    \ you have a proactive failover requirement but when you do not need to implement\
    \ a load delay. `AOAG` may also be suitable for disaster recovery in scenarios\
    \ where you wish to utilize your DR server for offloading reporting. This allows\
    \ the redundant servers to be utilized. When used for disaster recovery, `AOAG`\
    \ works in an asynchronous mode. This means that it is possible to lose data in\
    \ the event of a failover. The `RPO` is nondeterministic and is based on the time\
    \ of the last uncommitted transaction.\n\n## Database Mirroring vs Availability\
    \ Groups\n\nIn the old days, of database mirroring, the secondary database was\
    \ always offline. This means that you cannot use the secondary database to offload\
    \ any reporting or other read-only activity. It is possible to work around this\
    \ by creating a database snapshot against the secondary database and pointing\
    \ read-only activity to the snapshot. This can still be complicated, however,\
    \ because you must configure your application to issue read-only statements against\
    \ a different network name and IP address. `Availability Groups`, on the other\
    \ hand, allow you to configure one or more replicas as readable. The only limitation\
    \ is that readable replicas and automatic failover cannot be configured on the\
    \ same secondaries. The norm, however, would be to configure readable secondary\
    \ replicas in asynchronous commit mode so that they do not impair performance.\n\
    \n## Readable Replicas and Connection Routing\n\nTo further simplify this, the\
    \ `Availability Group Replica` checks for the read-only or read-intent properties\
    \ in an applications connection string and points the application to the appropriate\
    \ node. This means that you can easily scale reporting and database maintenance\
    \ routines horizontally with very little development effort and with the applications\
    \ being able to use a single connection string.\n\n## Combined Replica Capabilities\n\
    \nBecause `AOAG` allows you to combine synchronous replicas (with or without automatic\
    \ failover), asynchronous replicas, and replicas for read-only access, it allows\
    \ you to satisfy high availability, disaster recovery, and reporting scale-out\
    \ requirements using a single technology. If you’re sole requirement is read-scaling,\
    \ as opposed to `HA` or `DR`, then it is actually possible to configure `Availability\
    \ Groups` with no cluster, from `SQL Server 2017` onward. In this case, there\
    \ is no cluster service and hence no automatic redirection. Replicas within the\
    \ `Availability Groups` use certificate when communicating with each other. This\
    \ is also true if you configure `Availability Groups` without `AD`, in a workgroup,\
    \ or cross-domain.\n\n## Failover Scope\n\nWhen you are using `AOAG`, failover\
    \ does not occur at the database level, nor at the instance level. Instead, failover\
    \ occurs at the level of the availability group. The availability group is a concept\
    \ that allows you to group related databases together so that they can fail over\
    \ as an atomic unit. This is particularly useful in consolidated environments,\
    \ because it allows you to group together the databases that map to a single application.\
    \ You can then fail over this application to another replica for the purposes\
    \ of `DR` testing, among other reasons, without having an impact on the other\
    \ data-tier applications that are hosted on the instance.\n\n## Scaling Limits\n\
    \nNo hard limits are imposed for the number of availability groups you can configure\
    \ on an instance, nor are there any hard limits for the number of databases on\
    \ an instance that can take part in `AOAG`. Microsoft, however, has tested up\
    \ to, and officially recommends, a maximum of 100 databases and 10 availability\
    \ groups per instance. The main limiting factor in scaling the number of databases\
    \ is that `AOAG` uses a database mirroring endpoint and there can only be one\
    \ per instance. This means that the log stream for all data modifications is sent\
    \ over the same endpoint.\n\n## Availability Groups Failover Mapping\n\nFigure\
    \ [2-5](#394392_3_En_2_Chapter.xhtml#Fig5) depicts how you can map data-tier applications\
    \ to availability groups for independent failover. In this example, a single instance\
    \ hosts two data-tier applications. Each application has been added to a separate\
    \ availability group. The first availability group has failed over to `Node2`.\
    \ Therefore, the availability group listeners point traffic for `Application1`\
    \ to `Node2` and traffic for `Application2` to `Node1`. Because each availability\
    \ group has its own network name and IP address, and because these resources fail\
    \ over with the `AOAG`, the application is able to seamlessly reconnect to the\
    \ databases after failover.\n![Figure 2-5 ¶ Availability Groups Failover ](images/394392_3_En_2_Chapter/394392_3_En_2_Fig5_HTML.jpg)\n\
    \nFigure 2-5 ¶ Availability Groups Failover\n\n## AlwaysOn Availability Group\
    \ Topology\n\nThe diagram in Figure [2-6](#394392_3_En_2_Chapter.xhtml#Fig6) depicts\
    \ an `AlwaysOn Availability Group` topology. In this example, there are four nodes\
    \ in the cluster and a disk witness. `Node1` is hosting the primary replicas of\
    \ the databases, `Node2` is being used for automatic failover, `Node3` is being\
    \ used to offload reporting, and `Node4` is being used for `DR`. Because the cluster\
    \ is stretched across two data centers, multi-subnet clustering has been implemented.\
    \ Because there is no shared storage, however, there is no need for `SAN` replication\
    \ between the sites.\n![Figure 2-6 ¶ AlwaysOn Availability Group Topology](images/394392_3_En_2_Chapter/394392_3_En_2_Fig6_HTML.jpg)\n\
    \nFigure 2-6 ¶ AlwaysOn Availability Group Topology\n\n### Automatic Page Repair\n\
    \nIf a page becomes corrupt in a database configured as a replica in an `AlwaysOn\
    \ Availability Group` topology, then `SQL Server` attempts to fix the corruption\
    \ by obtaining a copy of the pages from one of the secondary replicas. This means\
    \ that a logical corruption can be resolved without you needing to perform a restore\
    \ or for you to run `DBCC CHECKDB` with a repair option. However, automatic page\
    \ repair does not work for the following page types:\n\n* File Header page\n*\
    \ Database Boot page\n* Allocation pages\n  * `GAM` (Global Allocation Map)\n\
    \  * `SGAM` (Shared Global Allocation Map)\n  * `PFS` (Page Free Space)\n\nIf\
    \ the primary replica fails to read a page because it is corrupt, it first logs\
    \ the page in the `MSDB.dbo.suspect_pages` table. It then checks that at least\
    \ one replica is in the `SYNCHRONIZED` state and that transactions are still being\
    \ sent to the replica. If these conditions are met, then the primary sends a broadcast\
    \ to all replicas, specifying the `PageID` and `LSN` (log sequence number) at\
    \ the end of the flushed log. The page is then marked as restore pending, meaning\
    \ that any attempts to access it will fail, with error code `829`.\n\nAfter receiving\
    \ the broadcast, the secondary replicas wait, until they have redone transactions\
    \ up to the `LSN` specified in the broadcast message. At this point, they try\
    \ to access the page. If they cannot access it, they return an error. If they\
    \ *can* access the page, they send the page back to the primary replica. The primary\
    \ replica accepts the page from the first secondary to respond.\n\nThe primary\
    \ replica will then replace the corrupt copy of the page with the version that\
    \ it received from the secondary replica. When this process completes, it updates\
    \ the page in the `MSDB.dbo.suspect_pages` table to reflect that it has been repaired\
    \ by setting the `event_type` column to a value of 5 (Repaired).\n\nIf the secondary\
    \ replica fails to read a page while redoing the log because it is corrupt, it\
    \ places the secondary into the `SUSPENDED` state. It then logs the page in the\
    \ `MSDB.dbo.suspect_pages` table and requests a copy of the page from the primary\
    \ replica. The primary replica attempts to access the page. If it is inaccessible,\
    \ then it returns an error and the secondary replica remains in the `SUSPENDED`\
    \ state.\n"
  trans: "\n# AlwaysOn 可用性组概述\n\n## 共享磁盘限制与 iSCSI 变通方法\n\n`VMware` 功能中与共享磁盘相关的限制可以通过将存储直接通过\
    \ `iSCSI` 连接呈现给客户机操作系统来规避，但会以性能下降为代价。\n\n## 用于灾难恢复的 AOAG\n\n`AOAG` 是在您有主动故障转移需求但不需要实现负载延迟时用于\
    \ DR 的最合适的技术。`AOAG` 在您希望利用 DR 服务器卸载报表的情况下也适用于灾难恢复。这允许冗余服务器得到利用。当用于灾难恢复时，`AOAG`\
    \ 以异步模式工作。这意味着在故障转移事件中可能会丢失数据。`RPO` 是非确定性的，并且基于最后一次未提交事务的时间。\n\n## 数据库镜像与可用性组\n\
    \n在数据库镜像的旧时代，辅助数据库始终处于脱机状态。这意味着您无法使用辅助数据库卸载任何报表或其他只读活动。可以通过针对辅助数据库创建数据库快照并将只读活动指向该快照来规避此问题。然而，这仍然可能很复杂，因为您必须配置应用程序针对不同的网络名称和\
    \ IP 地址发出只读语句。另一方面，`Availability Groups` 允许您将一个或多个副本配置为可读。唯一的限制是可读副本和自动故障转移不能配置在同一辅助副本上。然而，通常的做法是将可读辅助副本配置为异步提交模式，以便它们不会影响性能。\n\
    \n## 可读副本和连接路由\n\n为了进一步简化，`Availability Group Replica` 会检查应用程序连接字符串中的只读或只读意图属性，并将应用程序指向适当的节点。这意味着您可以用很少的开发工作轻松地水平扩展报表和数据库维护例程，并且应用程序可以使用单个连接字符串。\n\
    \n## 组合副本功能\n\n因为 `AOAG` 允许您组合同步副本（带或不带自动故障转移）、异步副本以及用于只读访问的副本，所以它允许您使用单一技术满足高可用性、灾难恢复和报表扩展需求。如果您的唯一需求是读取扩展，而不是\
    \ `HA` 或 `DR`，那么从 `SQL Server 2017` 开始，实际上可以不使用群集配置 `Availability Groups`。在这种情况下，没有群集服务，因此没有自动重定向。`Availability\
    \ Groups` 中的副本在相互通信时使用证书。如果您在工作组或跨域中不使用 `AD` 配置 `Availability Groups`，情况也是如此。\n\
    \n## 故障转移范围\n\n当您使用 `AOAG` 时，故障转移不会发生在数据库级别，也不会发生在实例级别。相反，故障转移发生在可用性组级别。可用性组是一个概念，允许您将相关的数据库组合在一起，以便它们作为一个原子单元进行故障转移。这在合并环境中特别有用，因为它允许您将映射到单个应用程序的数据库组合在一起。然后，您可以出于\
    \ `DR` 测试等目的将此应用程序故障转移到另一个副本，而不会影响托管在实例上的其他数据层应用程序。\n\n## 扩展限制\n\n对于可以在实例上配置的可用性组数量没有硬性限制，对于可以参与\
    \ `AOAG` 的实例上的数据库数量也没有硬性限制。然而，Microsoft 已测试并正式建议每个实例最多 100 个数据库和 10 个可用性组。扩展数据库数量的主要限制因素是\
    \ `AOAG` 使用数据库镜像端点，每个实例只能有一个。这意味着所有数据修改的日志流都通过同一个端点发送。\n\n## 可用性组故障转移映射\n\n图 2-5\
    \ 描述了如何将数据层应用程序映射到可用性组以实现独立故障转移。在此示例中，单个实例托管两个数据层应用程序。每个应用程序都已添加到单独的可用性组中。第一个可用性组已故障转移到\
    \ `Node2`。因此，可用性组侦听器将 `Application1` 的流量指向 `Node2`，将 `Application2` 的流量指向 `Node1`。由于每个可用性组都有自己的网络名称和\
    \ IP 地址，并且由于这些资源随 `AOAG` 一起故障转移，因此应用程序能够在故障转移后无缝重新连接到数据库。\n![图 2-5 ¶ 可用性组故障转移](img/394392_3_En_2_Fig5_HTML.jpg)\n\
    \n图 2-5 ¶ 可用性组故障转移\n\n## AlwaysOn 可用性组拓扑\n\n图 2-6 中的图表描述了 `AlwaysOn Availability\
    \ Group` 拓扑。在此示例中，群集中有四个节点和一个磁盘见证。`Node1` 托管数据库的主副本，`Node2` 用于自动故障转移，`Node3` 用于卸载报表，`Node4`\
    \ 用于 `DR`。由于群集跨越两个数据中心，因此已实施多子网群集。然而，由于没有共享存储，因此站点之间不需要 `SAN` 复制。\n![图 2-6 ¶ AlwaysOn\
    \ 可用性组拓扑](img/394392_3_En_2_Fig6_HTML.jpg)\n\n图 2-6 ¶ AlwaysOn 可用性组拓扑\n\n### 自动页面修复\n\
    \n如果在 `AlwaysOn Availability Group` 拓扑中配置为副本的数据库中的页面损坏，则 `SQL Server` 会尝试通过从其中一个辅助副本获取页面的副本来修复损坏。这意味着可以在无需执行还原或运行\
    \ `DBCC CHECKDB` 并使用修复选项的情况下解决逻辑损坏。然而，自动页面修复不适用于以下页面类型：\n\n* 文件页眉页\n* 数据库引导页\n\
    * 分配页\n  * `GAM`（全局分配映射）\n  * `SGAM`（共享全局分配映射）\n  * `PFS`（页面空闲空间）\n\n如果主副本因页面损坏而无法读取页面，它首先在\
    \ `MSDB.dbo.suspect_pages` 表中记录该页面。然后它检查至少有一个副本处于 `SYNCHRONIZED` 状态，并且事务仍在发送到该副本。如果满足这些条件，则主副本向所有副本发送广播，指定刷新日志末尾的\
    \ `PageID` 和 `LSN`（日志序列号）。然后页面被标记为待还原，这意味着任何访问尝试都将失败，错误代码为 `829`。\n\n收到广播后，辅助副本会等待，直到它们重做事务到广播消息中指定的\
    \ `LSN`。此时，它们尝试访问该页面。如果无法访问，则返回错误。如果它们*可以*访问该页面，则将页面发送回主副本。主副本接受第一个响应的辅助副本发送的页面。\n\
    \n然后主副本将用从辅助副本收到的版本替换页面的损坏副本。当此过程完成后，它会更新 `MSDB.dbo.suspect_pages` 表中的页面，将 `event_type`\
    \ 列设置为 5（已修复）的值，以反映其已被修复。\n\n如果辅助副本在重做日志时因页面损坏而无法读取页面，它会将辅助副本置于 `SUSPENDED` 状态。然后它在\
    \ `MSDB.dbo.suspect_pages` 表中记录该页面，并请求主副本提供页面的副本。主副本尝试访问该页面。如果无法访问，则返回错误，辅助副本保持在\
    \ `SUSPENDED` 状态。\n"

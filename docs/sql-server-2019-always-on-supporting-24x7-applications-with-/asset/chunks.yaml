    # 可用性组配置


    ## 服务帐户和安全占用

    `service account` 每个实例使用的 显示仅供参考。 如果确保两个实例都使用相同的 `service account`，则可以简化安全管理。
    如果未这样做，则需要为每个实例授予对每个 `service account` 的权限。 这意味着，与仅将 `service account` 用于一个实例来减少每个
    `service account` 的安全占用相比，您只是将占用范围从操作系统级别提升到 `SQL Server` 级别。


    ## 端点 URL

    端点 URL 指定 `availability groups` 用于通信的端点的 URL。 URL 的格式为 `\[Transport Protocol\]://\[Path\]:\[Port\]`。
    `database mirroring endpoint` 的传输协议始终为 `TCP`（传输控制协议）。 路径可以是服务器的完全限定域名（`FQDN`）、服务器名称本身或在网络中唯一的
    `IP address`。 我建议使用服务器的 `FQDN`，因为它总能保证正常工作。 它也是填充的默认值。 端口应与为端点指定的端口号匹配。


    ### 注

    `Availability groups` 通过 `database mirroring endpoint` 进行通信。 尽管数据库镜像已被弃用，但端点并未被弃用。


    ## 备份首选项选项卡

    在 `Backup Preferences` 选项卡上（见图 5-6），我们可以指定将执行自动备份的副本。 `AlwaysOn Availability Groups`
    的一大优势是，使用它们时，您可以将维护任务（如备份）扩展到辅助服务器。 因此，自动备份可以无缝地定向到活动辅助副本。 可选选项为 `Prefer Secondary`、`Secondary
    Only`、`Primary` 或 `Any Replica`。 也可以为每个副本设置优先级。 在确定针对哪个副本运行备份作业时，`SQL Server`
    会评估每个节点的备份优先级，更有可能选择优先级最高的副本。

    ![图 5-6 ¶ 备份首选项选项卡](img/394392_3_En_5_Fig6_HTML.jpg)

    图 5-6 ¶ 备份首选项选项卡


    尽管在主副本上减少 IO 的优势显而易见，但我颇具争议地建议在许多情况下不要将自动备份扩展到辅助副本。 当 `RTO`（恢复时间目标）对应用程序而言是优先事项时，尤其如此，因为存在操作支持性问题。
    想象一下这样的场景：备份正在针对辅助副本进行，而用户来电称他们意外删除了关键表中的所有数据。 您现在需要恢复数据库的副本并重新填充该表。 然而，备份文件位于辅助副本上。
    因此，您需要在开始恢复数据库之前将备份文件复制到主副本（或通过网络执行恢复）。 这会立即增加您的 `RTO`。


    此外，当配置为允许针对多台服务器进行备份时，`SQL Server` 仍仅在执行备份的实例上维护备份历史记录。 这意味着您可能需要在服务器之间手忙脚乱，尝试检索所有备份文件，却不知道每个文件的位置。
    如果其中一台服务器发生完全系统故障，情况会变得更糟。 您可能会发现自己处于日志链断裂的场景中。


    我刚刚提到的大多数问题的解决方法是使用文件服务器上的共享，并配置每个实例备份到同一共享。 这可能产生中性、正向或负向的后果。 负面后果出现在您使用本地附加存储时。
    以这种方式设置备份后，您现在将所有备份通过网络发送，而不是本地备份。 这可能会增加备份的持续时间并增加网络流量。 正面后果是如果您处于云 `IaaS`（基础设施即服务）环境中。
    附加到您的 `VM` 的存储很可能比用于创建文件共享的存储更昂贵。 然而，在许多现代本地部署场景中，后果是中性的。 这是因为文件共享和服务器的存储很可能位于同一个
    `SAN` 或 `NAS` 设备上。 这意味着以这种方式配置备份时，网络流量或延迟没有区别。


    ## 侦听器选项卡

    在 `Listener` 选项卡上，如图 5-7 所示，我们选择是否要创建可用性组侦听器，或将此任务推迟到以后。 如果我们选择创建侦听器，则需要指定侦听器的名称、其应监听的端口以及应使用的
    `IP address(es)`。 在多子网集群中，我们为每个 `subnet` 指定一个地址。 此处提供的信息用于在可用性组的群集角色中创建客户端访问点资源。
    您可能会注意到，我们为侦听器指定了端口 `1433`，尽管我们的实例也在端口 `1433` 上运行。 这是一个有效的配置，因为侦听器配置在与 `SQL Server`
    实例不同的 `IP address` 上。 使用相同的端口号并非强制要求，但在现有实例上实施 `AlwaysOn Availability Groups`
    时可能有益，因为指定连接端口号的应用程序可能需要更少的应用程序更改。 请记住，服务器名称仍会不同，因为应用程序将连接到侦听器的虚拟名称，而不是物理服务器\\实例的名称。
    在我们的示例中，应用程序连接到 `HR` 而不是 `CLUSTERNODE1\\PROD`。 尽管通过 `CLUSTERNODE1` 的连接仍然允许，但它们无法受益于高可用性或扩展我们的报告。

    ![图 5-7 ¶ 侦听器选项卡](img/394392_3_En_5_Fig7_HTML.jpg)

    图 5-7 ¶ 侦听器选项卡


    ### 提示

    `subnet` 是包含来自更大网络的 `IP Addresses` 分区的网络段。

    由于我们的 `HR Availability Group` 不跨越多个子网，因此我们的 `Listener` 只有一个 `IP Address`。


    ### 提示

    如果您在组织单位（`OU`）中没有 `Create Computer Objects` 权限，则侦听器的 `VCO`（虚拟计算机对象）必须存在于 `AD`
    中，并且您必须被分配该对象的完全控制权限。


    ### 提示

    由于 `HR Availability Group` 不会配置为可读辅助副本，因此我们无需配置 `Read-Only Routing` 选项卡；然而，我们将在本章的“使用新的可用性组对话框”部分探讨只读路由。


    ## 选择初始数据同步

    在 `Select Initial Data Synchronization` 屏幕上，如图 5-8 所示，我们选择副本的初始数据同步如何执行。 如果选择
    `Full`，则参与可用性组的每个数据库都会进行完整备份，然后进行日志备份。 备份文件在恢复到辅助服务器之前会备份到您指定的共享中。 共享路径可以使用 `Windows`
    或 `Linux` 格式指定，具体取决于您的要求。 恢复完成后，通过日志流进行数据同步。

    ![图 5-8 ¶ 选择数据同步页面](img/394392_3_En_5_Fig8_HTML.jpg)

    图 5-8 ¶ 选择数据同步页面


    如果您已备份数据库并将其恢复到辅助服务器上，则可以选择 `Join Only` 选项。 这会通过日志流启动可用性组内数据库的数据同步。 选择 `Skip Initial
    Data Synchronization` 允许您在完成设置后自行备份和恢复数据库。


    '

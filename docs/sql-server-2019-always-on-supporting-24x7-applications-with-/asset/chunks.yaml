    开始摘要


    # 2. 了解高可用性和灾难恢复技术


    Peter A. Carter^( 1 ) (1) Botley, UK 结束摘要


    SQL Server 提供了一整套用于实现高可用性和灾难恢复的技术。以下各节提供了这些技术的概述并讨论了它们最合适的用途。


    ## AlwaysOn 故障转移群集


    Windows 群集是一种提供高可用的技术，其中最多 64 台服务器协同工作以提供冗余。AlwaysOn 故障转移群集实例 (`FCI`) 是跨越该组服务器的
    SQL Server 实例。如果该组中的其中一台服务器发生故障，另一台服务器将接管该实例。其最合适的用途是在数据库较大或写入负载较高的高可用性场景中。这是因为群集依赖于共享存储，这意味着数据只需写入磁盘一次。使用
    SQL Server 级别的高可用性技术，写入操作会在主数据库上发生，然后在提交在主数据库完成之前再次在所有辅助数据库上发生。这可能会导致性能问题。尽管可以将群集跨多个站点扩展，但这涉及
    SAN 复制，这意味着群集通常配置在单个站点内。


    集群中的每台服务器称为 `node`。因此，如果一个集群由三台服务器组成，则称为三节点集群。集群中的每个节点都安装了 SQL Server 二进制文件，但
    SQL Server 服务仅在一台节点上启动，该节点称为 `active node`。集群中的每个节点还共享用于 SQL Server 数据和日志文件的相同存储。然而，存储仅附加到活动节点。


    提示


    在地理分散的集群（称为地理集群或伸缩集群）中，每台服务器都连接到不同的存储。卷由 SAN 复制或 Windows Storage Replica（一种在 Windows
    Server 2016 中引入的 Windows Server 技术，可执行存储复制）进行更新。集群将这两个卷视为单个共享卷，该卷一次只能附加到一个节点。


    如果活动节点发生故障，则 SQL Server 服务将停止并且存储将被分离。然后将存储重新附加到集群中的其他节点之一，并在该节点上启动 SQL Server
    服务，该节点现在成为活动节点。实例还分配有自己的网络名称和 IP 地址，它们也绑定到活动节点。这意味着应用程序可以无缝连接到实例，而不管哪个节点拥有它。


    图 2-1 中的图表说明了两节点集群。它显示尽管数据库存储在共享存储阵列上，但每个节点仍具有专用的系统卷。该卷包含 SQL Server 二进制文件。它还说明了在故障转移事件中共享存储、IP
    地址和网络名称如何重新绑定到被动节点。![图 2-1 ¶ 两节点集群](img/394392_3_En_2_Fig1_HTML.jpg)


    图 2-1 ¶ 两节点集群


    ### 活动/活动配置


    尽管图 2-1 中的图表说明了活动/被动配置，但也可以具有活动/活动配置。虽然一次不可能有多个节点拥有单个实例，因此无法实现负载平衡，但可以在集群上安装多个实例，并且不同的节点可能拥有每个实例。在此场景中，每个节点都有自己的唯一网络名称和
    IP 地址。每个实例的共享存储也由一组唯一的卷组成。


    因此，在活动/活动配置中，在正常操作期间，`Node1` 可能托管 `Instance1`，而 `Node2` 可能托管 `Instance2`。如果 `Node1`
    发生故障，则两个实例都将由 `Node2` 托管，反之亦然。图 2-2 中的图表说明了两节点活动/活动集群。![图 2-2 ¶ 活动/活动集群](img/394392_3_En_2_Fig2_HTML.jpg)


    图 2-2 ¶ 活动/活动集群


    警告


    在活动/活动集群中，在故障转移时考虑资源非常重要。例如，如果每个节点有 128GB RAM，并且每个节点上托管的实例使用 96GB RAM 并锁定内存中的页面，那么当一个节点故障转移到另一个节点时，该节点也会失败，因为它没有足够的内存分配给两个实例。确保您像规划单个服务器一样规划内存和处理器需求。因此，活动/活动集群通常不推荐用于
    SQL Server。


    ### 三节点及以上配置


    如前所述，集群中最多可以有 64 个节点。当你有三个或更多节点时，由于相关成本，你可能不希望有一个活动节点和两个冗余节点。相反，你可以选择实现 `N+1`
    或 `N+M` 配置。


    在 `N+1` 配置中，你有多个活动节点和一个被动节点。如果任何活动节点发生故障，它们将故障转移到被动节点。图 2-3 中的图表描绘了三节点 `N+1` 集群。![图
    2-3 ¶ 三节点 N+1 配置](img/394392_3_En_2_Fig3_HTML.jpg)


    图 2-3 ¶ 三节点 N+1 配置


    在 `N+1` 配置中，在多故障场景中，多个节点可能会故障转移到被动节点。因此，在规划资源时必须非常小心，以确保被动节点能够支持多个实例。然而，你可以通过使用
    `N+M` 配置来缓解此问题。


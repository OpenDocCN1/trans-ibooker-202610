- raw: "Distributed Availability Groups can be used as an alternative to domain-independent\
    \ Availability groups in hybrid cloud scenarios. Additionally, they provide the\
    \ flexibility to distributed data across platforms. For example, data can be replicated\
    \ between a Windows-based Availability Group and a Linux-based Availability Group.\n\
    \nBasic Availability Groups provide the option to configure Availability Groups\
    \ on instances running SQL Server Standard Edition. If you choose to use this\
    \ feature, however, then the functionality is limited. Only two replicas are supported\
    \ and there can only be a single database per Availability Group. Additionally,\
    \ there is no option to use read-only routing.\n\n© Peter A. Carter 2020 P. A.\
    \ CarterSQL Server 2019 AlwaysOn[https://doi.org/10.1007/978-1-4842-6479-9\\_8](https://doi.org/10.1007/978-1-4842-6479-9_8)\
    \ Begin Abstract \n\n# 8. Administering AlwaysOn\n\nPeter A. Carter^([1](#394392_3_En_8_Chapter.xhtml#Aff2) )\
    \ (1) Botley, UK   End Abstract \n\nThis chapter will discuss how to administer\
    \ AlwaysOn features. We will first look at cluster maintenance, including rolling\
    \ patch upgrades and removing an instance. We will then discuss managing Availability\
    \ Groups, including how to fail over synchronously and asynchronously. We will\
    \ also examine how to fail over a Distributed Availability Group.\n\nAdditional\
    \ maintenance tasks, such as synchronizing instance-level objects, safe-stating\
    \ an application, and adding multiple Listeners to an Availability Group will\
    \ also be discussed. The chapter will end by discussing how to suspend data movement\
    \ and how to remove a database from an Availability Group.\n\n## Managing a Cluster\n\
    \nInstalling the cluster is not the end of the road from an administrative perspective.\
    \ You still need to periodically perform maintenance tasks. The following sections\
    \ describe some of the most common maintenance tasks. \n\n### Moving the Instance\
    \ Between Nodes\n\nOther than protecting against unplanned outages, one of the\
    \ benefits of implementing high availability technologies is that doing so significantly\
    \ reduces downtime for maintenance tasks, such as patching. This can be at the\
    \ operating system level or the SQL Server level. \n\nIf you have a two-node cluster,\
    \ apply the patch to the passive node first. Once you are happy that the update\
    \ was successful, fail over the instance and then apply the patch to the other\
    \ node. At this point, you may or may not wish to fail back to the original node,\
    \ depending on the needs of your environment. For example, if the overriding priority\
    \ is the level of availability of the instance, then you may not wish to fail\
    \ back, because this will incur another short outage.\n\nTo move an instance to\
    \ a different node using Failover Cluster Manager, select Move ➤ Select Node from\
    \ the context menu of the role that contains the instance. This causes the Move\
    \ Clustered Role dialog box to display. Here, you can select the node to which\
    \ you wish to move the role, as illustrated in Figure [8-1](#394392_3_En_8_Chapter.xhtml#Fig1).\
    \ ![Figure 8-1 ¶ The Move Clustered Role Dialog Box](images/394392_3_En_8_Chapter/394392_3_En_8_Fig1_HTML.jpg)\n\
    \nFigure 8-1 ¶ The Move Clustered Role Dialog Box\n\nThe role is then moved to\
    \ the new node. If you watch the role’s resources window in Failover Cluster Manager,\
    \ then you see each resource move through the states of Online ➤ Offline Pending\
    \ ➤ Offline. The new node is now displayed as the owner before the resources move\
    \ in turn through the states of Offline ➤ Online Pending ➤ Online. The resources\
    \ are taken offline and placed back online in order of their dependencies.\n\n\
    We can also fail over a role using PowerShell. To do this, we need to use the\
    \ Move-ClusterGroup cmdlet. Listing [8-1](#394392_3_En_8_Chapter.xhtml#PC1) demonstrates\
    \ this by using the cmdlet to fail over the MSDTC cluster role to ClusterNode2.\
    \ We use the \\-Name parameter to specify the role that we wish to move and the\
    \ \\-Node parameter to specify the node to which we wish to move it. Move-ClusterGroup\
    \ -Name ALWAYSON-MSDTC-C -Node ClusterNode2 Listing 8-1 \n\nMoving the Role Between\
    \ Nodes\n\n### Rolling Patch Upgrade\n\nIf you have a cluster with more than two\
    \ nodes, then consider performing a rolling patch upgrade when you are applying\
    \ updates for SQL Server. In this scenario, you mitigate the risk of having different\
    \ nodes, which are possible owners of the role, running different versions or\
    \ patch levels of SQL Server.\n\nThe first thing that you should do is make a\
    \ list of all nodes that are possible owners of the role. Then, select 50% of\
    \ these nodes and remove them from the Possible Owners list. You can do this by\
    \ selecting Properties from the context menu of the Name resource and then, in\
    \ the Advanced Policies tab, unchecking the nodes in the possible owners list,\
    \ as illustrated in Figure [8-2](#394392_3_En_8_Chapter.xhtml#Fig2). ![Figure\
    \ 8-2 ¶ Remove Possible Owners](images/394392_3_En_8_Chapter/394392_3_En_8_Fig2_HTML.jpg)\n\
    \nFigure 8-2 ¶ Remove Possible Owners\n\nTo achieve the same result using PowerShell,\
    \ we can use the Get-Resource cmdlet  to navigate to the name resource and then\
    \ pipe in the Set-ClusterOwnerNode to configure the possible owners list. This\
    \ is demonstrated in Listing [8-2](#394392_3_En_8_Chapter.xhtml#PC2). The possible\
    \ owners list is comma separated in the event that you are configuring multiple\
    \ possible owners. Get-ClusterResource \"SQL Network Name (ALWAYSON-SQL-C)\" |\
    \ Set-ClusterOwnerNode -Owners clusternode1 Listing 8-2 \n\nConfiguring Possible\
    \ Owners\n\nOnce 50% of the nodes have been removed as possible owners, you should\
    \ apply the update to these nodes. After the update has been verified on this\
    \ half of the nodes, you should reconfigure them to allow them to be possible\
    \ owners once more.\n\nThe next step is to move the role to one of the nodes that\
    \ you have upgraded. After failover has successfully completed, remove the other\
    \ half of the nodes from the preferred owners list before applying the update\
    \ to these nodes. Once the update has been verified on this half of the nodes,\
    \ you can return them to the possible owners list.\n\nTip \n\nThe possible owners\
    \ can only be set on a resource. If you run Set-ClusterOwnerNode against a role\
    \ using the \\-Group parameter, then you are configuring preferred owners rather\
    \ than possible owners.\n\n### Removing a Node from the Cluster\n\nNote \n\nDo\
    \ not follow the demonstration in this section, if you wish to follow the subsequent\
    \ demonstrations in this book.\n\nIf you wish to uninstall an AlwaysOn failover\
    \ cluster instance, then you cannot perform this action from Control Panel as\
    \ you would a stand-alone instance. Instead, you must run the Remove Node Wizard\
    \ on each of the nodes of the cluster. You can invoke this wizard by selecting\
    \ Remove Node from a SQL Server Failover Cluster option from the Maintenance tab\
    \ in SQL Server Installation Center. \n\nThe wizard starts by running a global\
    \ rules check, followed by a rules check for removing a node. Then, on the Cluster\
    \ Node Configuration page shown in Figure [8-3](#394392_3_En_8_Chapter.xhtml#Fig3),\
    \ you are asked to confirm the instance for which you wish to remove a node. If\
    \ the cluster hosts multiple instances, you can select the appropriate instance\
    \ from the drop-down box. ![Figure 8-3 ¶ The Cluster Node Configuration Page](images/394392_3_En_8_Chapter/394392_3_En_8_Fig3_HTML.jpg)\n\
    \nFigure 8-3 ¶ The Cluster Node Configuration Page\n\nOn the Ready to Remove Node\
    \ page, you are given a summary of the tasks that will be performed. After confirming\
    \ the details, the instance is removed. This process should be repeated on all\
    \ passive nodes and then finally on the active node. When the instance is removed\
    \ from the final node, the cluster role is also removed.\n\nTo remove a node using\
    \ PowerShell, we need to run SQL Server’s setup.exe application, with the action\
    \ parameter configured as RemoveNode. When you use PowerShell to remove a node,\
    \ the parameters in Table [8-1](#394392_3_En_8_Chapter.xhtml#Tab1) are mandatory.\
    \ Table 8-1 "

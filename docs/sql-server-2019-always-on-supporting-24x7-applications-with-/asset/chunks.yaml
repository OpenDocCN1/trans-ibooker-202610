  trans: '

    为了在整个企业中监控可用性组，您需要使用监控工具，例如系统操作中心。 然而，如果您需要监控少量可用性组或排查特定问题，则可以使用 SQL Server 随附的工具之一，例如用于监控拓扑健康的仪表板，以及名为
    AlwaysOn Health Trace 的扩展事件会话。


    实现 SQL Server 高可用性的一个好处是，它可以最大限度地减少计划维护期间的停机时间。 在双节点群集中，您可以升级被动节点，进行故障转移，然后升级活动节点。
    对于更大的群集，您可以执行滚动修补升级，这涉及从可能所有者列表中移除一半节点并对其进行升级。 然后将实例故障转移到其中一个已升级的节点，并对剩余节点重复该过程。
    这降低了在可能所有者之间出现混合版本的风险。


    # 9. 监控 AlwaysOn 可用性组


    Peter A. Carter (1) Botley, UK


    一旦您实施了可用性组，就需要监控它们并响应可能影响您数据可用性的任何错误或警告。 如果您在整个企业中实施了许多可用性组，那么有效且全面地监控它们的唯一方法是使用企业监控工具，例如
    SOC（系统操作中心）。 然而，如果您只有少量可用性组，或者您正在排查特定问题，则 SQL Server 提供了 AlwaysOn 仪表板和 AlwaysOn
    Health Trace。 您还可以创建自己的扩展事件会话来监控可用性组。 本章将讨论这些监控可能性。


    ## AlwaysOn 仪表板


    AlwaysOn 仪表板是一个交互式报告，允许您查看 AlwaysOn 环境的健康状况并钻取或汇总拓扑中的元素。 您可以从对象资源管理器中可用性组文件夹的上下文菜单中调用该报告，或从可用性组本身的上下文菜单中调用。
    图 9-1 显示了从 HR 可用性组的上下文菜单生成的报告。 您可以看到当前同步处于健康状态。 已使用添加/删除列按钮添加了估计恢复时间和估计数据丢失度量。
    当您拥有异步副本时，估计数据丢失很有帮助，以便在发生事件时评估影响。


    数据库可能处于的三种同步状态是 `SYNCHRONIZED`、`SYNCHRONIZING` 和 `NOT SYNCHRONIZING`。 同步副本应处于
    `SYNCHRONIZED` 状态，任何其他状态都是不健康的。 然而，异步副本永远不会处于 `SYNCHRONIZED` 状态，而 `SYNCHRONIZING`
    状态被认为健康。 无论模式如何，`NOT SYNCHRONIZING` 都表示副本未连接。


    图 9-1 ¶ 可用性组仪表板


    注意


    除了同步状态外，副本还具有以下其中一种操作状态：`PENDING_FAILOVER`、`PENDING`、`ONLINE`、`OFFLINE`、`FAILED`、`FAILED_NO_QUORUM`
    和 `NULL`（当副本断开连接时）。 副本的操作状态可以使用 `sys.dm_hadr_availability_replica_states` DMV
    查看。


    在报告的右上方，有指向故障转移向导的链接，我们在本章前面讨论过；我们将在下一节讨论的 AlwaysOn 健康事件；还有一个查看集群仲裁信息的链接。 通过此链接调用的集群仲裁信息屏幕显示在图
    9-2 中。


    图 9-2 ¶ 集群仲裁信息屏幕


    添加/删除列链接将显示上下文菜单，您可以在其中动态添加或删除显示中的列。 图 9-3 显示已添加暂停和暂停原因。


    图 9-3 ¶ 添加/删除列


    您还可以钻取可用性副本窗口中的每个副本以查看副本特定详细信息。 分组依据按钮将允许您按副本、数据库、同步状态、故障转移就绪性或问题对可用性数据库进行分组。


    ## AlwaysOn Health Trace


    AlwaysOn Health Trace 是一个扩展事件会话，当您创建第一个可用性组时创建。 它可以在 SQL Server Management Studio
    中找到，位于扩展事件 ➤ 会话下，通过其上下文菜单，您可以查看正在捕获的实时数据，或进入会话的属性以更改捕获事件的配置。 它也可以通过 AlwaysOn 仪表板中的查看
    AlwaysOn 健康事件链接访问。


    钻取会话会公开会话的包，从包的上下文菜单中，您可以查看以前捕获的事件。 图 9-4 显示捕获的最新事件是数据库 5（在我们的例子中是 HR），它正在等待日志在同步副本上硬化。


    图 9-4 ¶ 目标数据


    在窗口顶部窗格中右键单击列标题将公开上下文菜单，该菜单允许您在特定列中搜索文本或值，按列中的值分组或按特定列对结果集进行排序。 您还可以使用上下文菜单添加或删除结果集中的列。


    ## 使用扩展事件监控 AlwaysOn


    扩展事件是 SQL Server 中的轻量级监控系统，使用 `WMI` 捕获事件。 由于架构使用系统资源很少，因此它们扩展性非常好，允许您以最小的用户活动影响监控实例。
    它们也高度可配置，为您提供了从非常细粒度的详细信息（如页面拆分）到较粗粒度信息（如 CPU 利用率）的广泛捕获选项。 您还可以将扩展事件与操作系统数据相关联，以在排查问题时提供整体视图。
    扩展事件的前身是 SQL Trace 及其 GUI，称为 Profiler，现已弃用。


    ### 扩展事件概念


    扩展事件具有丰富的架构，由事件、目标、操作、谓词、类型、映射和会话组成。 这些工件存储在包中，而包又存储在模块中，模块可以是 `.dll` 或可执行文件。
    我们将在以下各节中讨论这些概念。


    #### 包


    包是扩展事件中使用的对象的容器。 以下是 SQL Server 包的四种类型：


    * `Package0` – 默认包，用于扩展事件系统对象。

    * `Sqlserver` – 用于 SQL Server 相关对象。

    * `Sqlos` – 用于 SQLOS 相关对象。

    * `SecAudit` – 由 SQL Audit 使用；然而，其对象未公开。


    #### 事件


    \nThis chapter focuses on configuring Availability Groups on Linux, for the purpose\
    \ of providing high availability (HA). We will first have a brief overview of\
    \ the technologies involved in implementing pacemaker clusters (Pacemaker is a\
    \ Linux-based clustering technology), before configuring a two-node Availability\
    \ Group, with automatic failover.\n\n### Note\nFor the demonstrations in this\
    \ chapter, we will use three servers, namely, LinuxProd, LinuxSyncHA, and LinuxConfig.\
    \ A default instance of SQL Server 2019 is installed on each of the servers. The\
    \ servers are built with the Ubuntu 18.04 operating system and are not joined\
    \ to a domain.\n\nIn this chapter, we will perform the following activities:\n\
    * Create the Sales Databases.\n* Enable Availability Groups on our instances and\
    \ prepare the instances to support Availability Groups.\n* Create an Availability\
    \ group for the Sales database.\n* Create the cluster.\n* Configure the cluster.\n\
    \n## Linux Cluster Technologies\nThe following sections will provide a high-level\
    \ overview of the technologies that are used to configure a cluster in Linux.\
    \ Before we begin, however, it is important to understand that unlike building\
    \ Availability Groups on a Windows cluster, when building Availability Groups\
    \ on a Linux pacemaker cluster, the Availability Group is not integrated with\
    \ the cluster to the same degree. Specifically, the Availability Group is not\
    \ aware of the cluster’s state, or even existence. Therefore, failover operations\
    \ must be performed at the cluster level. Additionally, while it is still possible\
    \ to create a listener, the functionality is limited. You need to manually register\
    \ the listener’s name in DNS and there is no support for read-only routing.\n\n\
    ### Pcs\nWhen you install `pcs`, the package will also install Pacemaker and Corosync.\
    \ The `pcs` component itself, however, is a command-line utility, which is used\
    \ to manage the Pacemaker cluster.\n\n### Pacemaker\nPacemaker is the heart of\
    \ the cluster. It is responsible for managing cluster maintenance events, such\
    \ as nodes being added and removed. It is also responsible for managing cluster\
    \ events and moving resources between nodes to ensure the resources remain available\
    \ after a failure occurs on a node.\n\nPacemaker supports all standard cluster\
    \ configurations, including active/active, active/passive, N+1, and N+M. A discussion\
    \ of advanced Pacemaker configurations is beyond the scope of this book; however,\
    \ further details can be found in the Apress title *Pro Linux High Availability\
    \ Clustering*, which can be found at [www.apress.com/gp/book/9781484200803](http://www.apress.com/gp/book/9781484200803).\n\
    \n### Corosync\nCorosync provides the messaging layer for the cluster. It implements\
    \ the quorum system by sending messages between nodes to check the health status\
    \ and notifies Pacemaker if the quorum is lost.\n\n### STONITH\nA supported configuration\
    \ of a Pacemaker cluster must use fencing, which helps bring the cluster to a\
    \ known good state, in the event of a node, or resources state being unknown.\
    \ There are two types of fencing: resource fencing and node fencing. Resource\
    \ fencing is used to prevent a resource from starting on a node. This can avoid\
    \ data corruption, in the event of an outage while a resource is being configured.\
    \ Node fencing prevents a node from running any resources. This is usually required\
    \ if a node becomes unresponsive. Node fencing requires a fencing device and a\
    \ fencing agent. The fencing device may be an uninterrupted power supply, a power\
    \ distribution unit, or a management interface, such as lights-out device or blade\
    \ power control device. The agent that interacts with these devices is STONITH\
    \ (shoot the other node in the head). Because the implementation of STONITH is\
    \ very specific to the fencing device you use, we will not configure it in this\
    \ chapter. That is fine for development or testing purposes, but a production\
    \ cluster should always have STONITH configured.\n\n## Preparing to Implement\
    \ AlwaysOn Availability Groups\nBefore creating an Availability Group, there are\
    \ several prerequisite tasks that need to be performed. Namely, we enable Availability\
    \ Groups on the SQL Server instances and create and backup the database that we\
    \ want to be made highly available, and because Linux servers cannot authenticate\
    \ with each other, we will need to create certificates that can be used for authentication.\
    \ The following sections demonstrate how to perform each of these tasks.\n\n###\
    \ Enable Availability Groups\nJust as is required in a Windows environment, the\
    \ first step in configuring Availability Groups on Linux is to enable the feature\
    \ at the service level. The script in Listing [6-1](#394392_3_En_6_Chapter.xhtml#PC1)\
    \ demonstrates how to enable Availability Groups and then restart the service.\
    \ This script needs to be executed on each server that will host a Replica.\n\n\
    ### Tip\n`sudo` is used to elevate your permission when running a command.\n\n\
    ```bash\nsudo /opt/mssql/bin/mssql-conf set hadr.hadrenabled 1\nsudo systemctl\
    \ restart mssql-server\n```\n\nListing 6-1\n\nEnable Availability Groups\n\n###\
    \ Create the Sales Database\n"
  trans: "\n然后我们可以使用 `New-SqlAvailabilityGroupListener` cmdlet 创建一个可用性组侦听器。这在列表 5-10\
    \ 中进行了演示。\n\n```powershell\n#Specify the options for the Listener\n$ListenerOptions\
    \ = @{\n    Name = \"Foo\"\n    StaticIp = \"10.0.0.14/255.255.255.0\"\n    Path\
    \ = \"SQLSERVER:\\\\Sql\\\\CLUSTERNODE1\\\\PROD\\\\AvailabilityGroups\\\\Foo\"\
    \n}\n#Create the Listener\nNew-SqlAvailabilityGroupListener @ListenerOptions\n\
    ```\n\n列表 5-10\n\n创建可用性组侦听器\n\n## 摘要\nAlwaysOn 可用性组最多可使用八个辅助副本实现，结合同步和异步提交模式。在使用可用性组实现高可用性时，您始终使用同步提交模式，因为异步提交模式不支持自动故障转移。然而，在实施同步提交模式时，您必须意识到相关的性能损失，因为在主副本上提交之前，事务必须先在辅助副本上提交。对于灾难恢复，您通常会选择实施异步提交模式。\n\
    \n可用性组可以通过新建可用性组向导、通过对话框、通过 `T-SQL` 或甚至通过 `PowerShell` 创建。如果您使用对话框创建可用性组，则某些方面，例如端点和相关权限，必须使用\
    \ `T-SQL` 或 `PowerShell` 进行脚本编写。\n\n如果您使用可用性组实施灾难恢复，则需要配置多子网集群。这并不意味着您必须在站点之间具有\
    \ SAN 复制，因为可用性组不依赖于共享存储。您需要做的是为管理集群访问点以及可用性组侦听器添加额外的 IP 地址。您还需要关注支持客户端重连的集群属性，以确保客户端不会出现大量超时。\n\
    \n© Peter A. Carter 2020 P. A. CarterSQL Server 2019 AlwaysOn[`doi.org/10.1007/978-1-4842-6479-9\\\
    _6`](https://doi.org/10.1007/978-1-4842-6479-9_6) 开始摘要\n\n# 6. 在 Linux 上实施 AlwaysOn\
    \ 可用性组\n\nPeter A. Carter^(1 ) (1) Botley, UK 结束摘要\n\n自 SQL Server 2017 以来，可以在\
    \ Linux 以及 Windows 上安装 SQL Server。AlwaysOn 可用性组可以在 Linux 上进行配置，具有与实例托管在 Windows\
    \ 上时的大部分相同功能。SQL Server 在 Linux 上的安装和配置超出了本书的范围，但完整细节可以在 Apress 出版的 *Pro SQL Server\
    \ 2019 管理* 中找到，可在 [www.apress.com/gb/book/9781484250884#otherversion=9781484250891](http://www.apress.com/gb/book/9781484250884%2523otherversion%253D9781484250891)\
    \ 找到。\n\n本章重点介绍在 Linux 上配置可用性组，以提供高可用性 (HA)。我们将首先简要概述实施 pacemaker 集群所涉及的技术（Pacemaker\
    \ 是一种基于 Linux 的集群技术），然后配置具有自动故障转移的双节点可用性组。\n\n### 注\n在本章的演示中，我们将使用三台服务器，即 LinuxProd、LinuxSyncHA\
    \ 和 LinuxConfig。每台服务器上都安装了默认实例的 SQL Server 2019。服务器使用 Ubuntu 18.04 操作系统构建，并且未加入域。\n\
    \n在本章中，我们将执行以下活动：\n* 创建 Sales 数据库。\n* 在我们的实例上启用可用性组并准备实例以支持可用性组。\n* 为 Sales 数据库创建可用性组。\n\
    * 创建集群。\n* 配置集群。\n\n## Linux 集群技术\n以下各节将提供用于在 Linux 上配置集群的技术的高级概述。在开始之前，了解以下内容很重要：与在\
    \ Windows 集群上构建可用性组不同，在 Linux pacemaker 集群上构建可用性组时，可用性组与集群的集成程度不如 Windows。特别是，可用性组不知道集群的状态，甚至不知道集群的存在。因此，故障转移操作必须在集群级别执行。此外，虽然仍然可以创建侦听器，但功能有限。您需要手动在\
    \ DNS 中注册侦听器的名称，并且不支持只读路由。\n\n### Pcs\n当您安装 `pcs` 时，该包也会安装 Pacemaker 和 Corosync。然而，`pcs`\
    \ 组件本身是一个命令行实用程序，用于管理 Pacemaker 集群。\n\n### Pacemaker\nPacemaker 是集群的核心。它负责管理集群维护事件，例如节点添加和删除。它还负责管理集群事件并在节点上移动资源，以确保在节点上发生故障后资源仍然可用。\n\
    \nPacemaker 支持所有标准集群配置，包括 active/active、active/passive、N+1 和 N+M。对高级 Pacemaker\
    \ 配置的讨论超出了本书的范围；然而，进一步的细节可以在 Apress 出版的 *Pro Linux 高可用性集群* 中找到，可在 [www.apress.com/gp/book/9781484200803](http://www.apress.com/gp/book/9781484200803)\
    \ 找到。\n\n### Corosync\nCorosync 为集群提供消息层。它通过在节点之间发送消息来实现仲裁系统以检查健康状态，并在仲裁丢失时通知\
    \ Pacemaker。\n\n### STONITH\n受支持的 Pacemaker 集群配置必须使用 fencing，这有助于在节点或资源状态未知时将集群带到已知良好状态。有两种类型的\
    \ fencing：资源 fencing 和节点 fencing。资源 fencing 用于防止资源在节点上启动。这可以避免在配置资源期间发生中断时数据损坏。节点\
    \ fencing 防止节点运行任何资源。如果节点无响应，通常需要此操作。节点 fencing 需要 fencing 设备和 fencing 代理。fencing\
    \ 设备可能是不间断电源、电源分配单元或管理接口，例如灯光外设备或刀片电源控制设备。与这些设备交互的代理是 STONITH（shoot the other\
    \ node in the head）。由于 STONITH 的实现非常特定于您使用的 fencing 设备，我们在本章中不会配置它。对于开发或测试目的来说这是可以的，但生产集群应始终配置\
    \ STONITH。\n\n## 准备实施 AlwaysOn 可用性组\n在创建可用性组之前，需要执行几个先决条件任务。也就是说，我们在 SQL Server\
    \ 实例上启用可用性组并创建和备份我们想要实现高可用的数据库，并且由于 Linux 服务器无法相互进行身份验证，我们需要创建可用于身份验证的证书。以下各节演示如何执行这些任务。\n\
    \n### 启用可用性组\n正如在 Windows 环境中所需的那样，在 Linux 上配置可用性组的第一个步骤是在服务级别启用该功能。列表 6-1 中的脚本演示了如何启用可用性组然后重新启动服务。此脚本需要在将托管副本的每台服务器上执行。\n\
    \n### 提示\n`sudo` 用于在运行命令时提升您的权限。\n\n```bash\nsudo /opt/mssql/bin/mssql-conf set\
    \ hadr.hadrenabled 1\nsudo systemctl restart mssql-server\n```\n\n列表 6-1\n\n启用可用性组\n\
    \n### 创建 Sales 数据库\n"

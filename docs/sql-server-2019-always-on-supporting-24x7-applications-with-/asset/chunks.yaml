- raw: "The second command is set up. This command is used to register the cluster\
    \ name and each node within the cluster. The cluster name is specified using the\
    \ –name parameter, followed by a node list. Listing [6-18](#394392_3_En_6_Chapter.xhtml#PC18)\
    \ illustrates how to use the setup command in our scenario.\n\nTip \n\nIt is also\
    \ possible to specify the –start parameter to start the cluster service, but we\
    \ will choose to start the cluster using a separate command, to help illustrate\
    \ the full process.\n\nsudo pcs cluster setup --name LinuxCluster LinuxProd LinuxSyncHA\
    \ LinuxConfig Listing 6-18 \n\nSet Up the Cluster\n\nThe next command is start.\
    \ As you would expect, this is used to start the cluster service. The command\
    \ either accepts the –-all parameter to start the service on all nodes (demonstrated\
    \ in Listing [6-19](#394392_3_En_6_Chapter.xhtml#PC19)) or a node list of nodes\
    \ where the cluster service should be started. sudo pcs cluster start –-all Listing\
    \ 6-19 \n\nStart the Cluster Service\n\nAfter running this command, there can\
    \ be a delay before the service is started. Therefore, you should run the status\
    \ command before continuing to ensure that the cluster is up, as shown in Listing\
    \ [6-20](#394392_3_En_6_Chapter.xhtml#PC20). Sudo pcs cluster status Listing 6-20\
    \ \n\nCheck Cluster Status\n\nFinally, we will configure the cluster service to\
    \ run on startup, for each of the nodes. This can be achieved using the enable\
    \ command, as shown in Listing [6-21](#394392_3_En_6_Chapter.xhtml#PC21). The\
    \ command accepts either the –-all parameter or a node list. sudo pcs cluster\
    \ enable --all Listing 6-21 \n\nEnabling the Cluster Service\n\nNow that the cluster\
    \ has been created, we can install the SQL Server resource agent. This allows\
    \ pacemaker to loosely integrate with Availability Groups. Specifically, it increments\
    \ a sequence number in the sys.available\\_groups catalog view, each time configuration\
    \ change, such as a failover or a new replica being added. It then interrogates\
    \ this sequence number on failover, to identify if a node is up to date, before\
    \ failover occurs. This allows the failover to be rejected if the sequence number\
    \ is not the highest. Listing [6-22](#394392_3_En_6_Chapter.xhtml#PC22) demonstrates\
    \ how to install the resource agent. sudo apt-get install mssql-server-ha Listing\
    \ 6-22 \n\nInstall the Resource Agent\n\nNext, we need to give pacemaker permissions\
    \ to the Availability Group. We created a login for pacemaker in Listing [6-12](#394392_3_En_6_Chapter.xhtml#PC12).\
    \ Now we need to save the credentials in the operating system by running the script\
    \ in Listing [6-23](#394392_3_En_6_Chapter.xhtml#PC23) on all nodes in the cluster.\
    \ echo 'pacemakerLogin' >> ~/pacemaker-passwd echo 'Pa$$w0rd' >> ~/pacemaker-passwd\
    \ sudo mv ~/pacemaker-passwd /var/opt/mssql/secrets/passwd sudo chown root:root\
    \ /var/opt/mssql/secrets/passwd sudo chmod 400 /var/opt/mssql/secrets/passwd Listing\
    \ 6-23 \n\nSave the Pacemaker Credentials\n\nWe now need to create cluster resources,\
    \ both for the Availability Group and for the virtual IP Address. This can be\
    \ achieved by running the script in Listing [6-24](#394392_3_En_6_Chapter.xhtml#PC24).\
    \ The first command in the script creates an Availability Group resource for the\
    \ LinuxAOAG Availability Group.\n\nThe second command in the script creates a\
    \ resource for the IP Address that we wish to use. Notice that we specify both\
    \ the IP Address and the network mask of the network. The network mask is specified\
    \ using CIDR notation. CIDR notation is beyond the scope of this book, but a CIDR\
    \ tutorial can be found at [www.controltechnology.com/Files/common-documents/application\\\
    _notes/CIDR-Notation-Tutorial](http://www.controltechnology.com/Files/common-documents/application_notes/CIDR-Notation-Tutorial).\
    \ sudo pcs resource create LinuxAOAG ocf:mssql:ag ag\\_name=LinuxAOAG meta failure-timeout=60s\
    \ master meta notify=true sudo pcs resource create VirtualIP ocf:heartbeat:IPaddr2\
    \ ip=10.0.0.25 cidr\\_netmask=24 Listing 6-24 \n\nCreate the Cluster Resources\n\
    \nCaution \n\nBecause pacemaker does not have the concept of network name, the\
    \ IP Address and desired name must be manually registered in DNS.\n\nThe decision\
    \ of what node a resource should run on is based on scores, which are calculated\
    \ at the resource level. This means that there is a risk that the virtual IP Address\
    \ could be moved to a different node, to the availability group resource. To mitigate\
    \ this risk, we need to add a colocation constraint, which ensures the resources\
    \ are always on the same node. Constraints also have scores, with any number lower\
    \ than infinity being a preference and infinite being a binding requirement. The\
    \ command in Listing [6-25](#394392_3_En_6_Chapter.xhtml#PC25) will create the\
    \ required constraint. sudo pcs constraint colocation add VirtualIP LimuxAOAG\
    \ INFINITY with-rsc-role=Master Listing 6-25 \n\nCreate the Colocation Constraint\n\
    \nBecause this command lists the virtual IP Address resource before the Availability\
    \ Group resource, when resources are moved, the virtual IP Address will be moved\
    \ and brought online, before the Availability Group resource is moved and brought\
    \ online. This means that the virtual IP address could temporarily be pointing\
    \ to the wrong node. This risk can be mitigated by adding an ordering constraint,\
    \ which forces the Availability Group resource to be moved before the virtual\
    \ IP Address is brought online. Listing [6-26](#394392_3_En_6_Chapter.xhtml#PC26)\
    \ demonstrates how to configure this constraint. sudo pcs constraint order promote\
    \ LinuxAOAG then start VirtualIP Listing 6-26 \n\nCreate Ordering Constraint\n\
    \nFinally, we can create the Availability Group Listener. The Listener will use\
    \ the IP Address of the virtual IP Address resource that we created in the Pacemaker\
    \ cluster. It is important to remember that when Availability Groups are configured\
    \ on a pacemaker cluster, the sole purpose of the Availability Group Listener\
    \ is to provide an abstraction, with a single point of entry to the Replicas.\
    \ It does not mask outages, because during failover, it will temporarily become\
    \ unavailable while the virtual IP Address resource is started on another cluster\
    \ node. We can create the Availability Group Listener by using the script in Listing\
    \ [6-27](#394392_3_En_6_Chapter.xhtml#PC27). USE master GO ALTER AVAILABILITY\
    \ GROUP LinuxAOAG ADD LISTENER 'LinuxAOListener' (       WITH IP (             (N'10.0.0.25',\
    \ N'255.255.255.0')       )       , PORT=1433 ); GO Listing 6-27 \n\nCreate the\
    \ Availability Group Listener\n\n## Summary\n\nAvailability Groups can be configured\
    \ on Linux-based instances in a similar way to configuring Availability Groups\
    \ on Windows-based instances. They can be configured without an underlying cluster\
    \ or can make use of Linux-based clustering technology.\n\nIf high availability\
    \ or disaster recovery is required, then a Linux clustering technology, such as\
    \ pacemaker, must be used. A pacemaker cluster is made up of multiple components,\
    \ including pcs, a command-line utility for managing pacemaker clusters; Corosync,\
    \ which provides the heartbeat between the nodes; STONITH which is used for fencing;\
    \ and then Pacemaker, the core cluster manager.\n\nAvailability Group Listeners\
    \ are supported in a pacemaker cluster, but their functionality is limited. The\
    \ IP Address resource temporarily goes offline when being moved to a new node.\
    \ Therefore, the Availability Group Listener provides an abstraction, but does\
    \ not mask the failure, as it will become inaccessible for a period.\n\n© Peter\
    \ A. Carter 2020 P. A. CarterSQL Server 2019 AlwaysOn[https://doi.org/10.1007/978-1-4842-6479-9\\\
    _7](https://doi.org/10.1007/978-1-4842-6479-9_7) Begin Abstract \n\n# 7. Atypical\
    \ Availability Group Implementations\n\nPeter A. Carter^([1](#394392_3_En_7_Chapter.xhtml#Aff2) )\
    \ (1) Botley, UK   End Abstract "
  fmt: "\n### Set Up the Cluster\nThe second command is set up. This command is used\
    \ to register the cluster name and each node within the cluster. The cluster name\
    \ is specified using the `--name` parameter, followed by a node list. Listing\
    \ [6-18](#394392_3_En_6_Chapter.xhtml#PC18) illustrates how to use the setup command\
    \ in our scenario.\n\n**Tip**\nIt is also possible to specify the `--start` parameter\
    \ to start the cluster service, but we will choose to start the cluster using\
    \ a separate command, to help illustrate the full process.\n\n```\nsudo pcs cluster\
    \ setup --name LinuxCluster LinuxProd LinuxSyncHA LinuxConfig\n```\nListing 6-18\n\
    \n### Start the Cluster Service\nThe next command is start. As you would expect,\
    \ this is used to start the cluster service. The command either accepts the `--all`\
    \ parameter to start the service on all nodes (demonstrated in Listing [6-19](#394392_3_En_6_Chapter.xhtml#PC19))\
    \ or a node list of nodes where the cluster service should be started.\n\n```\n\
    sudo pcs cluster start --all\n```\nListing 6-19\n\n### Check Cluster Status\n\
    After running this command, there can be a delay before the service is started.\
    \ Therefore, you should run the status command before continuing to ensure that\
    \ the cluster is up, as shown in Listing [6-20](#394392_3_En_6_Chapter.xhtml#PC20).\n\
    \n```\nsudo pcs cluster status\n```\nListing 6-20\n\n### Enabling the Cluster\
    \ Service\nFinally, we will configure the cluster service to run on startup, for\
    \ each of the nodes. This can be achieved using the enable command, as shown in\
    \ Listing [6-21](#394392_3_En_6_Chapter.xhtml#PC21). The command accepts either\
    \ the `--all` parameter or a node list.\n\n```\nsudo pcs cluster enable --all\n\
    ```\nListing 6-21\n\n### Install the Resource Agent\nNow that the cluster has\
    \ been created, we can install the SQL Server resource agent. This allows pacemaker\
    \ to loosely integrate with Availability Groups. Specifically, it increments a\
    \ sequence number in the `sys.available_groups` catalog view, each time configuration\
    \ change, such as a failover or a new replica being added. It then interrogates\
    \ this sequence number on failover, to identify if a node is up to date, before\
    \ failover occurs. This allows the failover to be rejected if the sequence number\
    \ is not the highest. Listing [6-22](#394392_3_En_6_Chapter.xhtml#PC22) demonstrates\
    \ how to install the resource agent.\n\n```\nsudo apt-get install mssql-server-ha\n\
    ```\nListing 6-22\n\n### Save the Pacemaker Credentials\nNext, we need to give\
    \ pacemaker permissions to the Availability Group. We created a login for pacemaker\
    \ in Listing [6-12](#394392_3_En_6_Chapter.xhtml#PC12). Now we need to save the\
    \ credentials in the operating system by running the script in Listing [6-23](#394392_3_En_6_Chapter.xhtml#PC23)\
    \ on all nodes in the cluster.\n\n```\necho 'pacemakerLogin' >> ~/pacemaker-passwd\n\
    echo 'Pa$$w0rd' >> ~/pacemaker-passwd\nsudo mv ~/pacemaker-passwd /var/opt/mssql/secrets/passwd\n\
    sudo chown root:root /var/opt/mssql/secrets/passwd\nsudo chmod 400 /var/opt/mssql/secrets/passwd\n\
    ```\nListing 6-23\n\n### Create the Cluster Resources\nWe now need to create cluster\
    \ resources, both for the Availability Group and for the virtual IP Address. This\
    \ can be achieved by running the script in Listing [6-24](#394392_3_En_6_Chapter.xhtml#PC24).\
    \ The first command in the script creates an Availability Group resource for the\
    \ `LinuxAOAG` Availability Group.\nThe second command in the script creates a\
    \ resource for the IP Address that we wish to use. Notice that we specify both\
    \ the IP Address and the network mask of the network. The network mask is specified\
    \ using CIDR notation. CIDR notation is beyond the scope of this book, but a CIDR\
    \ tutorial can be found at [www.controltechnology.com/Files/common-documents/application_notes/CIDR-Notation-Tutorial](http://www.controltechnology.com/Files/common-documents/application_notes/CIDR-Notation-Tutorial).\n\
    \n```\nsudo pcs resource create LinuxAOAG ocf:mssql:ag ag_name=LinuxAOAG meta\
    \ failure-timeout=60s master meta notify=true\nsudo pcs resource create VirtualIP\
    \ ocf:heartbeat:IPaddr2 ip=10.0.0.25 cidr_netmask=24\n```\nListing 6-24\n\n**Caution**\n\
    Because pacemaker does not have the concept of network name, the IP Address and\
    \ desired name must be manually registered in DNS.\n\n### Create the Colocation\
    \ Constraint\nThe decision of what node a resource should run on is based on scores,\
    \ which are calculated at the resource level. This means that there is a risk\
    \ that the virtual IP Address could be moved to a different node, to the availability\
    \ group resource. To mitigate this risk, we need to add a colocation constraint,\
    \ which ensures the resources are always on the same node. Constraints also have\
    \ scores, with any number lower than infinity being a preference and infinite\
    \ being a binding requirement. The command in Listing [6-25](#394392_3_En_6_Chapter.xhtml#PC25)\
    \ will create the required constraint.\n\n```\nsudo pcs constraint colocation\
    \ add VirtualIP LimuxAOAG INFINITY with-rsc-role=Master\n```\nListing 6-25\n\n\
    ### Create Ordering Constraint\nBecause this command lists the virtual IP Address\
    \ resource before the Availability Group resource, when resources are moved, the\
    \ virtual IP Address will be moved and brought online, before the Availability\
    \ Group resource is moved and brought online. This means that the virtual IP address\
    \ could temporarily be pointing to the wrong node. This risk can be mitigated\
    \ by adding an ordering constraint, which forces the Availability Group resource\
    \ to be moved before the virtual IP Address is brought online. Listing [6-26](#394392_3_En_6_Chapter.xhtml#PC26)\
    \ demonstrates how to configure this constraint.\n\n```\nsudo pcs constraint order\
    \ promote LinuxAOAG then start VirtualIP\n```\nListing 6-26\n\n### Create the\
    \ Availability Group Listener\nFinally, we can create the Availability Group Listener.\
    \ The Listener will use the IP Address of the virtual IP Address resource that\
    \ we created in the Pacemaker cluster. It is important to remember that when Availability\
    \ Groups are configured on a pacemaker cluster, the sole purpose of the Availability\
    \ Group Listener is to provide an abstraction, with a single point of entry to\
    \ the Replicas. It does not mask outages, because during failover, it will temporarily\
    \ become unavailable while the virtual IP Address resource is started on another\
    \ cluster node. We can create the Availability Group Listener by using the script\
    \ in Listing [6-27](#394392_3_En_6_Chapter.xhtml#PC27).\n\n```\nUSE master\nGO\n\
    ALTER AVAILABILITY GROUP LinuxAOAG ADD LISTENER 'LinuxAOListener'\n(\n    WITH\
    \ IP (\n        (N'10.0.0.25', N'255.255.255.0')\n    )\n    , PORT=1433\n);\n\
    GO\n```\nListing 6-27\n\n## Summary\nAvailability Groups can be configured on\
    \ Linux-based instances in a similar way to configuring Availability Groups on\
    \ Windows-based instances. They can be configured without an underlying cluster\
    \ or can make use of Linux-based clustering technology.\nIf high availability\
    \ or disaster recovery is required, then a Linux clustering technology, such as\
    \ pacemaker, must be used. A pacemaker cluster is made up of multiple components,\
    \ including `pcs`, a command-line utility for managing pacemaker clusters; `Corosync`,\
    \ which provides the heartbeat between the nodes; `STONITH` which is used for\
    \ fencing; and then `Pacemaker`, the core cluster manager.\nAvailability Group\
    \ Listeners are supported in a pacemaker cluster, but their functionality is limited.\
    \ The IP Address resource temporarily goes offline when being moved to a new node.\
    \ Therefore, the Availability Group Listener provides an abstraction, but does\
    \ not mask the failure, as it will become inaccessible for a period.\n\n© Peter\
    \ A. Carter 2020 P. A. Carter SQL Server 2019 AlwaysOn [https://doi.org/10.1007/978-1-4842-6479-9_7](https://doi.org/10.1007/978-1-4842-6479-9_7)\n\
    \n# 7. Atypical Availability Group Implementations\nPeter A. Carter ([1]) (1)\
    \ Botley, UK\n"
  trans: "\n### 设置集群\n第二个命令是 setup。该命令用于注册集群名称以及集群中的每个节点。集群名称使用 `--name` 参数指定，后跟节点列表。清单\
    \ 6-18 说明了在我们的场景中如何使用 setup 命令。\n\n**提示**\n也可以指定 `--start` 参数来启动集群服务，但我们将选择使用单独的命令启动集群，以帮助说明完整流程。\n\
    \n```\nsudo pcs cluster setup --name LinuxCluster LinuxProd LinuxSyncHA LinuxConfig\n\
    ```\n清单 6-18\n\n### 启动集群服务\n下一个命令是 start。正如您所期望的，它用于启动集群服务。该命令要么接受 `--all` 参数以在所有节点上启动服务（清单\
    \ 6-19 中演示），要么接受节点列表，指定应在其中启动集群服务的节点。\n\n```\nsudo pcs cluster start --all\n```\n\
    清单 6-19\n\n### 检查集群状态\n运行此命令后，服务启动前可能会有延迟。因此，在继续操作之前，您应运行 status 命令以确保集群已启动，如清单\
    \ 6-20 所示。\n\n```\nsudo pcs cluster status\n```\n清单 6-20\n\n### 启用集群服务\n最后，我们将为每个节点配置集群服务在启动时运行。这可以通过使用\
    \ enable 命令实现，如清单 6-21 所示。该命令接受 `--all` 参数或节点列表。\n\n```\nsudo pcs cluster enable\
    \ --all\n```\n清单 6-21\n\n### 安装资源代理\n现在集群已经创建，我们可以安装 SQL Server 资源代理。这允许 Pacemaker\
    \ 与可用性组松散集成。具体来说，每当发生配置更改，例如故障转移或添加新副本时，它都会在 `sys.available_groups` 目录视图中递增一个序列号。然后在故障转移时查询该序列号，以在故障转移发生前确定节点是否是最新的。这允许在序列号不是最高时拒绝故障转移。清单\
    \ 6-22 演示了如何安装资源代理。\n\n```\nsudo apt-get install mssql-server-ha\n```\n清单 6-22\n\
    \n### 保存 Pacemaker 凭据\n接下来，我们需要为 Pacemaker 授予对可用性组的权限。我们在清单 6-12 中为 Pacemaker\
    \ 创建了一个登录名。现在我们需要在集群中的所有节点上运行清单 6-23 中的脚本，将凭据保存在操作系统中。\n\n```\necho 'pacemakerLogin'\
    \ >> ~/pacemaker-passwd\necho 'Pa$$w0rd' >> ~/pacemaker-passwd\nsudo mv ~/pacemaker-passwd\
    \ /var/opt/mssql/secrets/passwd\nsudo chown root:root /var/opt/mssql/secrets/passwd\n\
    sudo chmod 400 /var/opt/mssql/secrets/passwd\n```\n清单 6-23\n\n### 创建集群资源\n我们现在需要创建集群资源，既用于可用性组，也用于虚拟\
    \ IP 地址。这可以通过运行清单 6-24 中的脚本来实现。脚本中的第一个命令为 `LinuxAOAG` 可用性组创建可用性组资源。\n脚本中的第二个命令为我们希望使用的\
    \ IP 地址创建资源。请注意，我们同时指定了 IP 地址和网络的网络掩码。网络掩码使用 CIDR 表示法指定。CIDR 表示法超出了本书的范围，但可以在\
    \ [www.controltechnology.com/Files/common-documents/application_notes/CIDR-Notation-Tutorial](http://www.controltechnology.com/Files/common-documents/application_notes/CIDR-Notation-Tutorial)\
    \ 找到 CIDR 教程。\n\n```\nsudo pcs resource create LinuxAOAG ocf:mssql:ag ag_name=LinuxAOAG\
    \ meta failure-timeout=60s master meta notify=true\nsudo pcs resource create VirtualIP\
    \ ocf:heartbeat:IPaddr2 ip=10.0.0.25 cidr_netmask=24\n```\n清单 6-24\n\n**警告**\n\
    由于 Pacemaker 没有网络名称的概念，因此 IP 地址和所需名称必须手动在 DNS 中注册。\n\n### 创建同位置约束\n资源应在哪个节点上运行的决策基于分数，这些分数在资源级别计算。这意味着虚拟\
    \ IP 地址可能被移动到与可用性组资源不同的节点存在风险。为了降低此风险，我们需要添加一个同位置约束，以确保资源始终位于同一节点上。约束也有分数，低于无穷大的任何数字都是偏好，无穷大则是绑定要求。清单\
    \ 6-25 中的命令将创建所需的约束。\n\n```\nsudo pcs constraint colocation add VirtualIP LimuxAOAG\
    \ INFINITY with-rsc-role=Master\n```\n清单 6-25\n\n### 创建排序约束\n由于此命令将虚拟 IP 地址资源列在可用性组资源之前，当资源移动时，虚拟\
    \ IP 地址将被移动并上线，然后才移动并上线可用性组资源。这意味着虚拟 IP 地址可能暂时指向错误的节点。此风险可以通过添加排序约束来缓解，该约束强制在虚拟\
    \ IP 地址上线之前先移动可用性组资源。清单 6-26 演示了如何配置此约束。\n\n```\nsudo pcs constraint order promote\
    \ LinuxAOAG then start VirtualIP\n```\n清单 6-26\n\n### 创建可用性组侦听器\n最后，我们可以创建可用性组侦听器。侦听器将使用我们在\
    \ Pacemaker 集群中创建的虚拟 IP 地址资源的 IP 地址。重要的是要记住，当可用性组配置在 Pacemaker 集群上时，可用性组侦听器的唯一目的是提供一个抽象，为副本提供单一入口点。它不会掩盖中断，因为在故障转移期间，在虚拟\
    \ IP 地址资源在另一个集群节点上启动时，它将暂时不可用。我们可以通过使用清单 6-27 中的脚本创建可用性组侦听器。\n\n```\nUSE master\n\
    GO\nALTER AVAILABILITY GROUP LinuxAOAG ADD LISTENER 'LinuxAOListener'\n(\n   \
    \ WITH IP (\n        (N'10.0.0.25', N'255.255.255.0')\n    )\n    , PORT=1433\n\
    );\nGO\n```\n清单 6-27\n\n## 摘要\n可用性组可以在基于 Linux 的实例上以与在基于 Windows 的实例上配置可用性组类似的方式进行配置。它们可以在没有底层集群的情况下配置，也可以使用基于\
    \ Linux 的集群技术。\n如果需要高可用性或灾难恢复，则必须使用 Pacemaker 等 Linux 集群技术。Pacemaker 集群由多个组件组成，包括\
    \ `pcs`，用于管理 Pacemaker 集群的命令行实用程序；`Corosync`，提供节点之间的心跳；用于 fencing 的 `STONITH`；以及\
    \ `Pacemaker`，核心集群管理器。\nPacemaker 集群支持可用性组侦听器，但其功能有限。IP 地址资源在移动到新节点时暂时离线。因此，可用性组侦听器提供了一个抽象，但不会掩盖故障，因为它在一段时间内将无法访问。\n\
    \n© Peter A. Carter 2020 P. A. Carter SQL Server 2019 AlwaysOn [`doi.org/10.1007/978-1-4842-6479-9_7`](https://doi.org/10.1007/978-1-4842-6479-9_7)\n\
    \n# 7. 非常规可用性组实现\nPeter A. Carter ([1]) (1) Botley, UK\n"

- raw: "On the Cluster Node Configuration page, illustrated in Figure [4-19](#394392_3_En_4_Chapter.xhtml#Fig19),\
    \ you are asked to confirm the instance name to which you are adding a node. If\
    \ you have multiple instances on the cluster, then you can use the drop-down box\
    \ to select the appropriate instance.  ![Figure 4-19 ¶ Add a Failover Cluster\
    \ Node Wizard – Cluster Node Configuration Page](images/394392_3_En_4_Chapter/394392_3_En_4_Fig19_HTML.jpg)\n\
    \nFigure 4-19 ¶ Add a Failover Cluster Node Wizard – Cluster Node Configuration\
    \ Page\n\nOn the Cluster Network Configuration page, shown in Figure [4-20](#394392_3_En_4_Chapter.xhtml#Fig20),\
    \ you confirm the network details. These should be identical to the first node\
    \ in the cluster, including the same IP address, since this is, of course, shared\
    \ between the two nodes. ![Figure 4-20 ¶ The Cluster Network Configuration Page](images/394392_3_En_4_Chapter/394392_3_En_4_Fig20_HTML.jpg)\n\
    \nFigure 4-20 ¶ The Cluster Network Configuration Page\n\nOn the Service Accounts\
    \ page of the wizard, most of the information is in read-only mode and you are\
    \ not able to modify it. This is because the service accounts you use must be\
    \ the same for each node of the cluster. You need to reenter the service account\
    \ passwords, however. This page is shown in Figure [4-21](#394392_3_En_4_Chapter.xhtml#Fig21).\
    \  ![Figure 4-21 ¶ The Service Accounts Page](images/394392_3_En_4_Chapter/394392_3_En_4_Fig21_HTML.jpg)\n\
    \nFigure 4-21 ¶ The Service Accounts Page\n\nNow that the wizard has all of the\
    \ required information, an additional rules check is carried out before the summary\
    \ page displays. The summary page, known as the Ready to Add Node page, provides\
    \ a summary of the activities that take place during the installation.\n\n## Adding\
    \ a Node Using PowerShell\n\nTo add a node using PowerShell instead of the GUI,\
    \ you can run SQL Server’s setup.exe application with an AddNode action. When\
    \ you add a node from the command line, the parameters detailed in Table [4-2](#394392_3_En_4_Chapter.xhtml#Tab2)\
    \ are mandatory. Table 4-2 \n\nMandatory Parameters for the AddNode Action\n\n\
    | Parameter || Usage |\n\n| --- | --- |\n\n| /ACTION || Must be configured as\
    \ AddNode. |\n\n| --- | --- |\n\n| /IACCEPTSQLSERVERLICENSETERMS || Mandatory\
    \ when installing on Windows Server Core, since the /qs switch must be specified\
    \ on Windows Server Core. |\n\n| /INSTANCENAME || The instance that you are adding\
    \ the extra node to support. |\n\n| /CONFIRMIPDEPENDENCYCHANGE || Allows multiple\
    \ IP addresses to be specified for multi-subnet clusters. Pass in a value of 1\
    \ for True or 0 for False. |\n\n| /FAILOVERCLUSTERIPADDRESSES || Specifies the\
    \ IP address(es) to use for the instance in the format *<IP Type>;<address>;<network\
    \ name>;<subnet mask>*. For multi-subnet clusters, the IP addresses are space\
    \ delimited. |\n\n| /FAILOVERCLUSTERNETWORKNAME || The virtual name of the clustered\
    \ instance. |\n\n| /INSTALLSQLDATADIR || The folder in which to place SQL Server\
    \ data files. This must be a cluster disk. |\n\n| /SQLSVCACCOUNT || The service\
    \ account that is used to run the Database Engine. |\n\n| /SQLSVCPASSWORD || The\
    \ password of the service account that is used to run the Database Engine. |\n\
    \n| /AGTSVCACCOUNT || The service account that issued to run SQL Server Agent.\
    \ |\n\n| /AGTSVCPASSWORD || The password of the service account that is used to\
    \ run SQL Server Agent. |\n\nThe script in Listing [4-2](#394392_3_En_4_Chapter.xhtml#PC2)\
    \ adds ClusterNode2 to the role when you run it from the root folder of the install\
    \ media. .\\\\setup.exe /IACCEPTSQLSERVERLICENSETERMS /ACTION=\"AddNode\" /INSTANCENAME=\"\
    MSSQLSERVER\" /SQLSVCACCOUNT=\"ALWAYSON\\\\SQLServiceAccount\" /SQLSVCPASSWORD=\"\
    Pa$$w0rd\" /AGTSVCACCOUNT=\"ALWAYSON\\\\SQLServiceAccount\" /AGTSVCPASSWORD=\"\
    Pa$$w0rd\" /FAILOVERCLUSTERIPADDRESSES=\"IPv4;10.0.0.9;Cluster Network 2;255.255.255.0\"\
     /CONFIRMIPDEPENDENCYCHANGE=0 /qs Listing 4-2 \n\nAdding a Node Using PowerShell\n\
    \n## Summary\n\nAn AlwaysOn Failover Clustered Instance can be installed using\
    \ SQL Server Installation Center or via PowerShell. When using the SQL Server\
    \ Installation Center, the process is very similar to the installation of a stand-alone\
    \ instance; however, you will need to specify additional details, such as the\
    \ network name, IP Address, and resource group configuration.\n\nWhen using PowerShell\
    \ to install the Instance, you will use the InstallFailoverCluster action, specifying\
    \ the /FAILOVERCLUSTERIPADDRESSES, /FAILOVERCLUSTERNETWORKNAME, and /INSTALLSQLDATADIR\
    \ parameters, in addition to the parameters required for a stand-alone instance\
    \ build.\n\n© Peter A. Carter 2020 P. A. CarterSQL Server 2019 AlwaysOn[https://doi.org/10.1007/978-1-4842-6479-9\\\
    _5](https://doi.org/10.1007/978-1-4842-6479-9_5) Begin Abstract \n\n# 5. Implementing\
    \ AlwaysOn Availability Groups On Windows\n\nPeter A. Carter^([1](#394392_3_En_5_Chapter.xhtml#Aff2) )\
    \ (1) Botley, UK   End Abstract \n\nAlwaysOn Availability Groups provide a flexible\
    \ option for achieving high availability, recovering from disasters, and scaling\
    \ out read-only workloads. The technology synchronizes data at the database level,\
    \ with health monitoring and quorum often provided by a Windows cluster, although\
    \ a Windows cluster is not mandatory.\n\nThere are different variations of AlwaysOn\
    \ Availability Groups. The traditional flavor sits on a Windows Failover Cluster,\
    \ but if SQL Server is installed on Linux, then Pacemaker can be used. AlwaysOn\
    \ Availability Groups can also be configured with no cluster at all. This is acceptable\
    \ for offloading reporting but is not a valid high availability (HA) or disaster\
    \ recovery (DR) configuration. When using SQL Server 2019 with Windows Server\
    \ 2019, Availability Groups can even be configured for containerized SQL, with\
    \ Kubernetes.\n\nThis chapter focuses on configuring Availability Groups on a\
    \ Windows Failover Cluster, for the purpose of providing both HA and DR, and scaling\
    \ read-only workloads. Availability Groups on Linux will be explored in Chapter\
    \ [6](#394392_3_En_6_Chapter.xhtml).\n\nNote \n\nFor the demonstrations in this\
    \ chapter, we will use the cluster built in Chapter [3](#394392_3_En_3_Chapter.xhtml),\
    \ but two additional nodes have been added to the cluster: CLUSTERNODE3 and CLUSTERNODE4.\
    \ We will not use the Failover Clustered Instance that we configured in Chapter\
    \ [4](#394392_3_En_4_Chapter.xhtml). Instead, stand-alone instances of SQL Server\
    \ have been installed on each of the nodes, with the following names: CLUSTERNODE1\\\
    \\PROD, CLUSTERNODE2\\\\SYNCHA, CLUSTERNODE3\\\\ASYNCDR, and CLUSTERNODE4\\\\\
    READSCALE. Cluster nodes 1 and 2 sit within a subnet called Site1 and Cluster\

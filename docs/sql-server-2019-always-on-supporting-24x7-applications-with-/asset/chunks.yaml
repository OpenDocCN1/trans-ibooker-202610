    # Availability Groups Configuration


    ## Service Account and Security Footprint

    The `service account` each instance uses is displayed for informational purposes.
    It simplifies security administration if you ensure that the same `service account`
    is used by both instances. If you fail to do this, you will need to grant each
    instance permissions to each `service account`. This means that instead of reducing
    the security footprint of each `service account` by using it for one instance
    only, you simply push the footprint up to the `SQL Server` level instead of the
    operating system level.


    ## Endpoint URL

    The endpoint URL specifies the URL of the endpoint that `availability groups`
    will use to communicate. The format of the URL is `\[Transport Protocol\]://\[Path\]:\[Port\]`.
    The transport protocol for a `database mirroring endpoint` is always `TCP` (Transmission
    Control Protocol). The path can either be the fully qualified domain name (`FQDN`)
    of the server, the server name on its own, or an `IP address`, which is unique
    across the network. I recommend using the `FQDN` of the server, because this is
    always guaranteed to work. It is also the default value populated. The port should
    match the port number that you specify for the endpoint.


    ### Note

    `Availability groups` communicate with a `database mirroring endpoint`. Although
    database mirroring is deprecated, the endpoints are not.


    ## Backup Preferences Tab

    On the `Backup Preferences` tab (see Figure [5-6](#394392_3_En_5_Chapter.xhtml#Fig6)),
    we can specify the replica on which automated backups will be taken. One of the
    big advantages of `AlwaysOn Availability Groups` is that when you use them, you
    can scale out maintenance tasks, such as backups, to secondary servers. Therefore,
    automated backups can seamlessly be directed to active secondaries. The possible
    options are `Prefer Secondary`, `Secondary Only`, `Primary`, or `Any Replica`.
    It is also possible to set priorities for each replica. When determining which
    replica to run the backup job against, `SQL Server` evaluates the backup priorities
    of each node and is more likely to choose the replica with the highest priority.

    ![Figure 5-6 ¶ The Backup Preferences Tab](images/394392_3_En_5_Chapter/394392_3_En_5_Fig6_HTML.jpg)

    Figure 5-6 ¶ The Backup Preferences Tab


    Although the advantages of reducing IO on the primary replica are obvious, I,
    somewhat controversially, recommend against scaling automated backups to secondary
    replicas in many cases. This is especially the case when `RTO` (recovery time
    objective) is a priority for the application because of operational supportability
    issues. Imagine a scenario in which backups are being taken against a secondary
    replica and a user calls to say that they have accidently deleted all data from
    a critical table. You now need to restore a copy of the database and repopulate
    the table. The backup files, however, sit on the secondary replica. As a result,
    you need to copy the backup files over to the primary replica before you can begin
    to restore the database (or perform the restore over the network). This instantly
    increases your `RTO`.


    Also, when configured to allow backups against multiple servers, `SQL Server`
    still only maintains the backup history on the instance where the backup was taken.
    This means that you may be scrambling between servers, trying to retrieve all
    of your backup files, not knowing where each one resides. This becomes even worse
    if one of the servers has a complete system outage. You can find yourself in a
    scenario in which you have a broken log chain.


    The workaround for most of the issues that I just mentioned is to use a share
    on a file server and configure each instance to back up to the same share. This
    can have neutral, positive, or negative consequences. The negative consequence
    of this is where you have locally attached storage. By setting backups up in this
    manner, you are now sending all of your backups across the network rather than
    backing them up locally. This can increase the duration of your backups as well
    as increase network traffic. The positive consequence is if you are a cloud `IaaS`
    (Infrastructure as a Service) environment. It is likely that the storage attached
    to your `VM` will be more expensive than the storage used to create the file share.
    In many modern, on-premise scenarios, however, the consequences are neutral. This
    is because it is likely that both the file share and your server’s storage reside
    on the same `SAN` or `NAS` device. This means that there is no difference in network
    traffic or latency if you configure backups in this way.


    ## Listener Tab

    On the `Listener` tab, shown in Figure [5-7](#394392_3_En_5_Chapter.xhtml#Fig7),
    we choose if we want to create an availability group listener or if we want to
    defer this task until later. If we choose to create the listener, then we need
    to specify the listener’s name, the port that it should listen on, and the `IP
    address(es)` that it should use. We specify one address for each `subnet`, in
    multi-subnet clusters. The details provided here are used to create the client
    access point resource in the availability group’s cluster role. You may notice
    that we have specified port `1433` for the listener, although our instance is
    also running on port `1433`. This is a valid configuration, because the listener
    is configured on a different `IP address` than the `SQL Server` instance. It is
    also not mandatory to use the same port number, but it can be beneficial, if you
    are implementing `AlwaysOn Availability Groups` on an existing instance because
    applications that specify the port number to connect may need fewer application
    changes. Remember that the server name will still be different, however, because
    applications will be connecting to the virtual name of the listener, as opposed
    to the name of the physical server\\instance. In our example, applications connect
    to `HR` instead of `CLUSTERNODE1\\PROD`. Although connections via `CLUSTERNODE1`
    are still permitted, they do not benefit from high availability or scale our reporting.

    ![Figure 5-7 ¶ The Listener Tab](images/394392_3_En_5_Chapter/394392_3_En_5_Fig7_HTML.jpg)

    Figure 5-7 ¶ The Listener Tab


    ### Tip

    A `subnet` is a segment of a network containing a partition of `IP Addresses`
    from a larger network.

    Because our `HR Availability Group` does not span multiple subnets, then our `Listener`
    will only have a single `IP Address`.


    ### Tip

    If you do not have `Create Computer Objects` permission within the organizational
    unit (`OU`), then the listener’s `VCO` (virtual computer object) must be present
    in `AD` and you must be assigned Full Control permissions on the object.


    ### Tip

    Because the `HR Availability Group` will not be configured with readable secondaries,
    we do not need to configure the `Read-Only Routing` tab; however, we will explore
    read-only routing in the “Using the New Availability Group Dialog Box” section
    of this chapter.


    ## Select Initial Data Synchronization

    On the `Select Initial Data Synchronization` screen, shown in Figure [5-8](#394392_3_En_5_Chapter.xhtml#Fig8),
    we choose how the initial data synchronization of the replicas is performed. If
    you choose `Full`, then each database that participates in the availability group
    is subject to a full backup, followed by a log backup. The backup files are backed
    up to a share, which you specify, before they are restored to the secondary servers.
    The share path can be specified using either `Windows` or `Linux` formats, depending
    on your requirements. After the restore is complete, data synchronization, via
    log stream, commences.

    ![Figure 5-8 ¶ The Select Data Synchronization Page ](images/394392_3_En_5_Chapter/394392_3_En_5_Fig8_HTML.jpg)

    Figure 5-8 ¶ The Select Data Synchronization Page


    If you have already backed up your databases and restored them onto the secondaries,
    then you can select the `Join Only` option. This starts the data synchronization,
    via log stream, on the databases within the availability group. Selecting `Skip
    Initial Data Synchronization` allows you to back up and restore the databases
    yourself after you complete the setup.


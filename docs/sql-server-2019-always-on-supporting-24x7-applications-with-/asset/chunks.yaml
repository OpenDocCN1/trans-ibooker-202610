- raw: "The level of availability is measured as a percentage of the time that the\
    \ application or server is available. Companies often strive to achieve 99%, 99.9%,\
    \ 99.99%, or 99.999% availability. As a result, the level of availability is often\
    \ referred to in 9s. For example, five 9s of availability means 99.999% uptime\
    \ and three 9s means 99.9% uptime. \n\nTable [1-1](#394392_3_En_1_Chapter.xhtml#Tab1)\
    \ details the amount of acceptable downtime per week, per month, and per year\
    \ for each level of availability. Table 1-1 \n\nLevels of Availability\n\n| Level\
    \ of Availability || Downtime per Week || Downtime per Month || Downtime per Year\
    \ |\n\n| --- | --- | --- | --- |\n\n| 99% || 1 hour, 40 minutes, 48 seconds ||\
    \ 7 hours, 18 minutes, 17 seconds || 3 days, 15 hours, 39 minutes, 28 seconds\
    \ |\n\n| --- | --- | --- | --- |\n\n| 99.9% || 10 minutes, 4 seconds || 43 minutes,\
    \ 49 seconds || 8 hours, 45 minutes, 56 seconds |\n\n| 99.99% || 1 minute || 4\
    \ minutes, 23 seconds || 52 minutes, 35 seconds |\n\n| 99.999% || 6 seconds ||\
    \ 26 seconds || 5 minutes, 15 seconds |\n\n*All values are rounded down to the\
    \ nearest second.*\n\nTo calculate other levels of availability, you can use the\
    \ script in Listing [1-1](#394392_3_En_1_Chapter.xhtml#PC1). Before running this\
    \ script, replace the value of @Uptime to represent the level of uptime that you\
    \ wish to calculate. You should also replace the value of @UptimeInterval to reflect\
    \ uptime per week, month, or year. DECLARE @Uptime    DECIMAL(5,3) ; \\--Specify\
    \ the uptime level to calculate SET @Uptime = 99.9 ; DECLARE @UptimeInterval VARCHAR(5)\
    \ ; \\--Specify WEEK, MONTH, or YEAR SET @UptimeInterval = 'YEAR' ; DECLARE @SecondsPerInterval\
    \ FLOAT ; \\--Calculate seconds per interval SET @SecondsPerInterval = ( SELECT\
    \ CASE         WHEN @UptimeInterval = 'YEAR'                 THEN 60\\*60\\*24\\\
    *365.243         WHEN @UptimeInterval = 'MONTH'                 THEN 60\\*60\\\
    *24\\*30.437         WHEN @UptimeInterval = 'WEEK'                 THEN 60\\*60\\\
    *24\\*7         END ) ; DECLARE @UptimeSeconds DECIMAL(12,4) ; \\--Calculate uptime\
    \ SET @UptimeSeconds = @SecondsPerInterval \\* (100-@Uptime) / 100 ; \\--Format\
    \ results SELECT     CONVERT(VARCHAR(12), FLOOR(@UptimeSeconds /60/60/24))   +\
    \ ' Day(s), '   + CONVERT(VARCHAR(12), FLOOR(@UptimeSeconds /60/60 % 24)) + '\
    \ Hour(s), '   + CONVERT(VARCHAR(12),  FLOOR(@UptimeSeconds /60 % 60))    + '\
    \ Minute(s), '   + CONVERT(VARCHAR(12),  FLOOR(@UptimeSeconds % 60))        +\
    \ ' Second(s).' ; Listing 1-1 \n\nCalculating the Level of Availability\n\n###\
    \ Actual Availability\n\nNow that we understand how to calculate the level of\
    \ availability  required by an application, we should also understand how to calculate\
    \ the actual availability of an application. We can do this by discovering the\
    \ MTBF (Mean Time Between Failures) and MTTR (Mean Time to Recover) metrics.\n\
    \nThe MTBF metric describes the average length of time between failures. For example,\
    \ imagine that we were reviewing the service logs for the past week and discovered\
    \ that the Foo application has suffered three outages. There are 168 hours in\
    \ a week and there have been three failures. We simply need to divide the number\
    \ of hours within our time period by the number of failures. This will produce\
    \ our MTBF. In this case, we have an MTBF of 56 hours.\n\nMTTR can actually have\
    \ two different meanings: Mean Time to Recover or Mean Time to Repair. When there\
    \ is no HA or DR in place, then the MTTR metric describes the average length of\
    \ time it takes for something that is broken to be repaired. This could potentially\
    \ be an extended period of time, as we may need to wait for a service engineer\
    \ to replace faulty hardware. When thinking about HA and DR, however, we use MTTR\
    \ metric to mean Mean Time to Recover to record the duration of the outage. For\
    \ example, if we have a three-node cluster and one of the nodes experiences a\
    \ hardware failure, of course we need to fix this server, but from an application\
    \ downtime perspective, we will only have an outage of a matter of seconds or\
    \ minutes, while the service fails over and we still have resilience, meaning\
    \ that the application’s nonfunctional requirements are not impacted. Therefore,\
    \ in this example, I will assume that MTTR is referring to “Mean Time to Recover.”\n\
    \nWe can calculate the MTTR by taking a sum of the total downtime duration within\
    \ our period and dividing it by the number of failures. In this case, during our\
    \ 168-hour period, we have had three failures and the total duration of downtime\
    \ has been 12 minutes. Therefore, the MTTR for our Foo application is 4 minutes.\n\
    \nNow that we know our application’s MTBF and MTTR, we can use these metrics to\
    \ calculate the actual availability of our application. The formula for this is\
    \ (MTBF/(MTBF+MTTR))\\*100. So in this case, we first need to convert our MTTR\
    \ value to hours, so we have hours as our consistent unit. Four minutes is 0.06667\
    \ hours. Therefore, our calculation would be (56/(56+0.6667))\\*100. This makes\
    \ our actual application availability 99.8811% .\n\n### Service-Level Agreements\
    \ and Service-Level Objectives\n\nWhen a third-party provider is responsible for\
    \ managing servers, the contract usually includes service-level agreements (SLAs).\
    \ These SLAs define many parameters, including how much downtime is acceptable,\
    \ the maximum length of time a server can be down in the event of failure, and\
    \ how much data loss is acceptable if failure occurs. Normally, there are financial\
    \ penalties for the provider if these SLAs are not met.\n\nIn the event that servers\
    \ are managed in-house, DBAs still have the concept of customers. These are usually\
    \ the end users of the application, with the primary contact being the business\
    \ owner. An application’s business owner is the stakeholder within the business\
    \ who commissioned the application and who is responsible for signing off on funding\
    \ enhancements, among other things.\n\nIn an in-house scenario, it is still possible\
    \ to define SLAs, and in such a case, the IT Infrastructure or Platform departments\
    \ may be liable for charge-back to the business teams if these SLAs are not being\
    \ met. However, in internal scenarios, it is much more common for IT departments\
    \ to negotiate service-level objectives (SLOs)  with the business teams, as opposed\
    \ to SLAs. SLOs are very similar in nature to SLAs, but their use implies that\
    \ the business do not impose financial penalties on the IT department in the event\
    \ that they are not met.\n\n### Proactive Maintenance\n\nIt is important to remember\
    \ that downtime is not only caused by failure but also by proactive maintenance\
    \ . For example, if you need to patch the operating system, or SQL Server itself,\
    \ with the latest service pack, then you must have some downtime during installation.\n\
    \nDepending on the upgrade you are applying, the downtime in such a scenario could\
    \ be substantial – several hours for a stand-alone server. In this situation,\
    \ high availability is essential for many business-critical applications – not\
    \ to protect against unplanned downtime, but to avoid prolonged outages during\
    \ planned maintenance.\n\n## Recovery Point Objective and Recovery Time Objective\n\
    \nThe recovery point objective (RPO) of an application indicates how much data\
    \ loss is acceptable in the event of a failure. For a data warehouse that supports\
    \ a reporting application, for example, this may be an extended period, such as\
    \ 24 hours, given that it may only be updated once per day by an ETL process and\
    \ all other activity is read-only reporting. For highly transactional systems,\
    \ however, such as an OLTP database supporting trading platforms or web applications,\
    \ the RPO will be zero. An RPO of zero means that no data loss is acceptable."
  fmt: "\n# Availability\n\nThe level of availability is measured as a percentage\
    \ of the time that the application or server is available. Companies often strive\
    \ to achieve 99%, 99.9%, 99.99%, or 99.999% availability. As a result, the level\
    \ of availability is often referred to in 9s. For example, five 9s of availability\
    \ means 99.999% uptime and three 9s means 99.9% uptime.\n\n## Levels of Availability\n\
    \nTable [1-1](#394392_3_En_1_Chapter.xhtml#Tab1) details the amount of acceptable\
    \ downtime per week, per month, and per year for each level of availability. Table\
    \ 1-1\n\nLevels of Availability\n\n| Level of Availability | Downtime per Week\
    \ | Downtime per Month | Downtime per Year |\n|---|---|---|---|\n| 99% | 1 hour,\
    \ 40 minutes, 48 seconds | 7 hours, 18 minutes, 17 seconds | 3 days, 15 hours,\
    \ 39 minutes, 28 seconds |\n| 99.9% | 10 minutes, 4 seconds | 43 minutes, 49 seconds\
    \ | 8 hours, 45 minutes, 56 seconds |\n| 99.99% | 1 minute | 4 minutes, 23 seconds\
    \ | 52 minutes, 35 seconds |\n| 99.999% | 6 seconds | 26 seconds | 5 minutes,\
    \ 15 seconds |\n\n*All values are rounded down to the nearest second.*\n\nTo calculate\
    \ other levels of availability, you can use the script in Listing [1-1](#394392_3_En_1_Chapter.xhtml#PC1).\
    \ Before running this script, replace the value of `@Uptime` to represent the\
    \ level of uptime that you wish to calculate. You should also replace the value\
    \ of `@UptimeInterval` to reflect uptime per week, month, or year.\n\n```sql\n\
    DECLARE @Uptime DECIMAL(5,3); --Specify the uptime level to calculate\nSET @Uptime\
    \ = 99.9;\nDECLARE @UptimeInterval VARCHAR(5); --Specify WEEK, MONTH, or YEAR\n\
    SET @UptimeInterval = 'YEAR';\nDECLARE @SecondsPerInterval FLOAT; --Calculate\
    \ seconds per interval\nSET @SecondsPerInterval = (\n    SELECT CASE\n       \
    \ WHEN @UptimeInterval = 'YEAR' THEN 60*60*24*365.243\n        WHEN @UptimeInterval\
    \ = 'MONTH' THEN 60*60*24*30.437\n        WHEN @UptimeInterval = 'WEEK' THEN 60*60*24*7\n\
    \    END\n);\nDECLARE @UptimeSeconds DECIMAL(12,4); --Calculate uptime\nSET @UptimeSeconds\
    \ = @SecondsPerInterval * (100-@Uptime) / 100;\n--Format results\nSELECT\n   \
    \ CONVERT(VARCHAR(12), FLOOR(@UptimeSeconds /60/60/24)) + ' Day(s), '\n    + CONVERT(VARCHAR(12),\
    \ FLOOR(@UptimeSeconds /60/60 % 24)) + ' Hour(s), '\n    + CONVERT(VARCHAR(12),\
    \ FLOOR(@UptimeSeconds /60 % 60)) + ' Minute(s), '\n    + CONVERT(VARCHAR(12),\
    \ FLOOR(@UptimeSeconds % 60)) + ' Second(s).';\n```\n\nListing 1-1\nCalculating\
    \ the Level of Availability\n\n### Actual Availability\n\nNow that we understand\
    \ how to calculate the level of availability required by an application, we should\
    \ also understand how to calculate the actual availability of an application.\
    \ We can do this by discovering the MTBF (Mean Time Between Failures) and MTTR\
    \ (Mean Time to Recover) metrics.\n\nThe MTBF metric describes the average length\
    \ of time between failures. For example, imagine that we were reviewing the service\
    \ logs for the past week and discovered that the Foo application has suffered\
    \ three outages. There are 168 hours in a week and there have been three failures.\
    \ We simply need to divide the number of hours within our time period by the number\
    \ of failures. This will produce our MTBF. In this case, we have an MTBF of 56\
    \ hours.\n\nMTTR can actually have two different meanings: Mean Time to Recover\
    \ or Mean Time to Repair. When there is no HA or DR in place, then the MTTR metric\
    \ describes the average length of time it takes for something that is broken to\
    \ be repaired. This could potentially be an extended period of time, as we may\
    \ need to wait for a service engineer to replace faulty hardware. When thinking\
    \ about HA and DR, however, we use MTTR metric to mean Mean Time to Recover to\
    \ record the duration of the outage. For example, if we have a three-node cluster\
    \ and one of the nodes experiences a hardware failure, of course we need to fix\
    \ this server, but from an application downtime perspective, we will only have\
    \ an outage of a matter of seconds or minutes, while the service fails over and\
    \ we still have resilience, meaning that the application’s nonfunctional requirements\
    \ are not impacted. Therefore, in this example, I will assume that MTTR is referring\
    \ to “Mean Time to Recover.”\n\nWe can calculate the MTTR by taking a sum of the\
    \ total downtime duration within our period and dividing it by the number of failures.\
    \ In this case, during our 168-hour period, we have had three failures and the\
    \ total duration of downtime has been 12 minutes. Therefore, the MTTR for our\
    \ Foo application is 4 minutes.\n\nNow that we know our application’s MTBF and\
    \ MTTR, we can use these metrics to calculate the actual availability of our application.\
    \ The formula for this is `(MTBF/(MTBF+MTTR))*100`. So in this case, we first\
    \ need to convert our MTTR value to hours, so we have hours as our consistent\
    \ unit. Four minutes is 0.06667 hours. Therefore, our calculation would be `(56/(56+0.6667))*100`.\
    \ This makes our actual application availability 99.8811%.\n\n### Service-Level\
    \ Agreements and Service-Level Objectives\n\nWhen a third-party provider is responsible\
    \ for managing servers, the contract usually includes service-level agreements\
    \ (SLAs). These SLAs define many parameters, including how much downtime is acceptable,\
    \ the maximum length of time a server can be down in the event of failure, and\
    \ how much data loss is acceptable if failure occurs. Normally, there are financial\
    \ penalties for the provider if these SLAs are not met.\n\nIn the event that servers\
    \ are managed in-house, DBAs still have the concept of customers. These are usually\
    \ the end users of the application, with the primary contact being the business\
    \ owner. An application’s business owner is the stakeholder within the business\
    \ who commissioned the application and who is responsible for signing off on funding\
    \ enhancements, among other things.\n\nIn an in-house scenario, it is still possible\
    \ to define SLAs, and in such a case, the IT Infrastructure or Platform departments\
    \ may be liable for charge-back to the business teams if these SLAs are not being\
    \ met. However, in internal scenarios, it is much more common for IT departments\
    \ to negotiate service-level objectives (SLOs) with the business teams, as opposed\
    \ to SLAs. SLOs are very similar in nature to SLAs, but their use implies that\
    \ the business do not impose financial penalties on the IT department in the event\
    \ that they are not met.\n\n### Proactive Maintenance\n\nIt is important to remember\
    \ that downtime is not only caused by failure but also by proactive maintenance.\
    \ For example, if you need to patch the operating system, or SQL Server itself,\
    \ with the latest service pack, then you must have some downtime during installation.\n\
    \nDepending on the upgrade you are applying, the downtime in such a scenario could\
    \ be substantial – several hours for a stand-alone server. In this situation,\
    \ high availability is essential for many business-critical applications – not\
    \ to protect against unplanned downtime, but to avoid prolonged outages during\
    \ planned maintenance.\n\n## Recovery Point Objective and Recovery Time Objective\n\
    \nThe recovery point objective (RPO) of an application indicates how much data\
    \ loss is acceptable in the event of a failure. For a data warehouse that supports\
    \ a reporting application, for example, this may be an extended period, such as\
    \ 24 hours, given that it may only be updated once per day by an ETL process and\
    \ all other activity is read-only reporting. For highly transactional systems,\
    \ however, such as an OLTP database supporting trading platforms or web applications,\
    \ the RPO will be zero. An RPO of zero means that no data loss is acceptable.\n"
  trans: "\n# 可用性\n\n可用性水平以应用程序或服务器可用时间的百分比来衡量。公司通常力求达到 99%、99.9%、99.99% 或 99.999%\
    \ 的可用性。因此，可用性水平通常以 9 的数量来表示。例如，五個 9 的可用性意味着 99.999% 的正常运行时间，而三个 9 意味着 99.9% 的正常运行时间。\n\
    \n## 可用性级别\n\n表 1-1 详细说明了每周、每月和每年每个可用性级别可接受的停机时间。表 1-1\n\n可用性级别\n\n| 可用性级别 | 每周停机时间\
    \ | 每月停机时间 | 每年停机时间 |\n|---|---|---|---|\n| 99% | 1 小时，40 分钟，48 秒 | 7 小时，18 分钟，17\
    \ 秒 | 3 天，15 小时，39 分钟，28 秒 |\n| 99.9% | 10 分钟，4 秒 | 43 分钟，49 秒 | 8 小时，45 分钟，56\
    \ 秒 |\n| 99.99% | 1 分钟 | 4 分钟，23 秒 | 52 分钟，35 秒 |\n| 99.999% | 6 秒 | 26 秒 | 5\
    \ 分钟，15 秒 |\n\n*所有值均向下舍入到最接近的秒。*\n\n要计算其他可用性级别，您可以使用列表 1-1 中的脚本。在运行此脚本之前，将 `@Uptime`\
    \ 的值替换为要计算的正常运行时间级别。您还应将 `@UptimeInterval` 的值替换为每周、每月或每年的正常运行时间。\n\n```sql\nDECLARE\
    \ @Uptime DECIMAL(5,3); --Specify the uptime level to calculate\nSET @Uptime =\
    \ 99.9;\nDECLARE @UptimeInterval VARCHAR(5); --Specify WEEK, MONTH, or YEAR\n\
    SET @UptimeInterval = 'YEAR';\nDECLARE @SecondsPerInterval FLOAT; --Calculate\
    \ seconds per interval\nSET @SecondsPerInterval = (\n    SELECT CASE\n       \
    \ WHEN @UptimeInterval = 'YEAR' THEN 60*60*24*365.243\n        WHEN @UptimeInterval\
    \ = 'MONTH' THEN 60*60*24*30.437\n        WHEN @UptimeInterval = 'WEEK' THEN 60*60*24*7\n\
    \    END\n);\nDECLARE @UptimeSeconds DECIMAL(12,4); --Calculate uptime\nSET @UptimeSeconds\
    \ = @SecondsPerInterval * (100-@Uptime) / 100;\n--Format results\nSELECT\n   \
    \ CONVERT(VARCHAR(12), FLOOR(@UptimeSeconds /60/60/24)) + ' Day(s), '\n    + CONVERT(VARCHAR(12),\
    \ FLOOR(@UptimeSeconds /60/60 % 24)) + ' Hour(s), '\n    + CONVERT(VARCHAR(12),\
    \ FLOOR(@UptimeSeconds /60 % 60)) + ' Minute(s), '\n    + CONVERT(VARCHAR(12),\
    \ FLOOR(@UptimeSeconds % 60)) + ' Second(s).';\n```\n\n列表 1-1\n计算可用性级别\n\n###\
    \ 实际可用性\n\n现在我们了解了如何计算应用程序所需的可用性级别，我们还应了解如何计算应用程序的实际可用性。我们可以通过确定 MTBF（平均故障间隔时间）和\
    \ MTTR（平均恢复时间）指标来实现。\n\nMTBF 指标描述了两次故障之间的平均时间长度。例如，假设我们正在审查过去一周的服务日志，发现 Foo 应用程序发生了三次中断。一周有\
    \ 168 小时，发生了三次故障。我们只需将时间段内的小时数除以故障次数即可。这将产生我们的 MTBF。在这种情况下，我们的 MTBF 为 56 小时。\n\
    \nMTTR 实际上有两个不同的含义：平均恢复时间或平均修复时间。当没有部署 HA 或 DR 时，MTTR 指标描述的是损坏的东西被修复所需的平均时间长度。这可能是一个较长的时期，因为我们可能需要等待服务工程师更换故障硬件。然而，在考虑\
    \ HA 和 DR 时，我们使用 MTTR 指标来表示平均恢复时间，以记录停机的持续时间。例如，如果我们有一个三节点集群，其中一个节点出现硬件故障，当然我们需要修复此服务器，但从应用程序停机角度来看，我们只会有几秒钟或几分钟的停机时间，同时服务进行故障转移并且我们仍然具有弹性，这意味着应用程序的非功能性需求不受影响。因此，在本例中，我假设\
    \ MTTR 指的是“平均恢复时间”。\n\n我们可以通过对我们期间内的总停机持续时间求和并除以故障次数来计算 MTTR。在这种情况下，在我们的 168 小时期间，我们发生了三次故障，总停机持续时间为\
    \ 12 分钟。因此，我们的 Foo 应用程序的 MTTR 为 4 分钟。\n\n现在我们知道了应用程序的 MTBF 和 MTTR，我们可以使用这些指标来计算应用程序的实际可用性。该公式为\
    \ `(MTBF/(MTBF+MTTR))*100`。因此，在这种情况下，我们首先需要将 MTTR 值转换为小时，以便我们的单位保持一致。四分钟是 0.06667\
    \ 小时。因此，我们的计算将为 `(56/(56+0.6667))*100`。这使得我们实际的应用程序可用性为 99.8811%。\n\n### 服务级别协议和服务级别目标\n\
    \n当第三方提供商负责管理服务器时，合同通常包括服务级别协议（SLAs）。这些 SLA 定义了许多参数，包括可接受的停机时间、故障情况下服务器可停机的最长时间以及故障发生时可接受的数据丢失量。通常，如果未满足这些\
    \ SLA，提供商将面临财务处罚。\n\n如果服务器由内部管理，DBA 仍然有客户的概念。这些通常是应用程序的最终用户，主要联系人是业务负责人。应用程序的业务负责人是业务中委托该应用程序的利益相关者，并且负责签署资金增强等事项。\n\
    \n在内部管理场景中，仍然可以定义 SLA，在这种情况下，IT 基础设施或平台部门如果未满足这些 SLA，可能需要向业务团队收取费用。然而，在内部场景中，IT\
    \ 部门更常见的做法是与业务团队协商服务级别目标（SLO），而不是 SLA。SLO 在性质上与 SLA 非常相似，但其使用意味着如果未满足，业务不会对 IT\
    \ 部门施加财务处罚。\n\n### 主动维护\n\n重要的是要记住，停机不仅由故障引起，还由主动维护引起。例如，如果您需要使用最新的服务包为操作系统或 SQL\
    \ Server 本身打补丁，则在安装期间必须有一定停机时间。\n\n根据所应用的升级，此类场景中的停机时间可能相当可观——对于单台服务器来说可能需要数小时。在这种情况下，高可用性对于许多业务关键型应用程序至关重要——不是为了防止计划外停机，而是为了避免计划维护期间的长时间中断。\n\
    \n## 恢复点目标和恢复时间目标\n\n应用程序的恢复点目标（RPO）表示在发生故障时可接受的数据丢失量。例如，对于支持报表应用程序的数据仓库，这可能是一个较长的时期，例如\
    \ 24 小时，因为它可能每天仅由 ETL 过程更新一次，其余所有活动都是只读报表。对于高度事务性的系统，例如支持交易平台或 Web 应用程序的 OLTP\
    \ 数据库，RPO 将为零。RPO 为零意味着不允许任何数据丢失。\n"

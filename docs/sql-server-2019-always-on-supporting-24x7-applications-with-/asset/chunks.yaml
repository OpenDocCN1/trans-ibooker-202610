- raw: "To create an Availability Set from the Azure Portal, navigate to the Availability\
    \ Sets blade and use the Add button to launch the Create Availability Set page,\
    \ which is illustrated in Figure [7-1](#394392_3_En_7_Chapter.xhtml#Fig1). You\
    \ will notice that we have selected the Subscription that we want the Availability\
    \ Set to be created in and selected the Resource Group in which it should be created.\
    \ We have also given it a name and selected the Region that it should be created\
    \ in. Because we plan to have two servers within the Availability Set, then both\
    \ Update Domains and Fault Domains have been configured as two. Each of the two\
    \ servers will reside in a different Fault Domain and Update Domain. If we added\
    \ additional servers to the Availability Set, then they would be allocated to\
    \ Fault Domains and Update Domains in a round-robin fashion. ![Figure 7-1 ¶ Create\
    \ an Availability Set](images/394392_3_En_7_Chapter/394392_3_En_7_Fig1_HTML.jpg)\n\
    \nFigure 7-1 ¶ Create an Availability Set\n\nOn the Advanced page, illustrated\
    \ in Figure [7-2](#394392_3_En_7_Chapter.xhtml#Fig2), we have the option to assign\
    \ a Proximity Placement Group to the Availability Group. A Proximity Placement\
    \ Group helps ensure the lowest possible latency, by using hardware that is located\
    \ physically close, within the data center. To use this option, you must create\
    \ the Proximity Group before creating the Availability Set. ![Figure 7-2 ¶ Create\
    \ an Availability Set Advanced Page](images/394392_3_En_7_Chapter/394392_3_En_7_Fig2_HTML.jpg)\n\
    \nFigure 7-2 ¶ Create an Availability Set Advanced Page\n\nThe Tags page allows\
    \ you to assign key/value pairs of tags. Using tags is always good practice for\
    \ cloud as it helps not only with resource management but also with cost control,\
    \ such as producing show-back or charge-back mechanisms to business divisions\
    \ that consume cloud resources. As shown in Figure [7-3](#394392_3_En_7_Chapter.xhtml#Fig3),\
    \ we have configured tags for environment and application. ![Figure 7-3 ¶ Create\
    \ an Availability Set – Tags Page](images/394392_3_En_7_Chapter/394392_3_En_7_Fig3_HTML.jpg)\n\
    \nFigure 7-3 ¶ Create an Availability Set – Tags Page\n\nTip \n\nYou can use Azure\
    \ Policies to enforce specific tags are used when resources are created.\n\nOn\
    \ the Review page, you have the opportunity to review the settings that you have\
    \ configured, before creating the resource.\n\n#### Create Availability Groups\
    \ on Azure VMs\n\nIn the following sections, we will discuss building and configuring\
    \ an Availability Group solution on Azure.\n\nNote \n\nTo follow demonstrations\
    \ in the following sections, you will need an Azure subscription. This must be\
    \ at least a pay-as-you-go subscription, as a free trial subscription will not\
    \ give you enough cores to build the two servers. You will also need a vnet, with\
    \ two subnets. The chapter also assumes that the either the vet contains a domain\
    \ controller, or that you have configured Azure Domain Services.\n\n##### Create\
    \ the VMs\n\nThe first thing that we will require is three VMs, which will have\
    \ SQL Server installed on them. There are various ways to achieve this in Azure,\
    \ depending on your requirements. The first option is to go to the Azure Marketplace\
    \ and find a machine image, with SQL Server installed. If you take this approach,\
    \ then it is important to understand that there are two different types of license\
    \ terms. The first is SPLA (Service Provide License Agreement). With SPLA licensing,\
    \ the cost of the VM includes the cost of the SQL Server license. This means that\
    \ your license is on a pay-as-you-go basis and avoids the upfront cost of license\
    \ procurement, but does work out more expensive over time, if the VM will be long\
    \ lived.\n\nThe second option type is BYOL (bring your own license). With this\
    \ license model, the SQL Server license is not included in the cost of the VM.\
    \ Instead, you must use an existing license that has already been procured. When\
    \ you chose this option, then you must report your license usage to Microsoft\
    \ within 10 days.\n\nWhen you build a VM with SQL Server already installed, it\
    \ arrives with a full installation of SQL Server, including all features. (Unless\
    \ you choose an image marked Database Engine Only.) This is not ideal is most\
    \ use cases, as it has a larger security footprint and resource utilization than\
    \ installing just the features that you require. Therefore, if you use a VM image\
    \ with SQL Server preinstalled (regardless of the licensing model), you should\
    \ take the time to customize the image to meet your requirements.\n\nAlternatively,\
    \ you could simply build a VM from a vanilla Windows Server image and install\
    \ SQL Server yourself. This is the most flexibly option, but if you take this\
    \ approach, then you must bring your own license. No SPLA option will be available.\n\
    \nIn this example, we will use the SQL Server 2019 on Windows Server 2019 image,\
    \ with SPLA licensing. Figure [7-4](#394392_3_En_7_Chapter.xhtml#Fig4) shows the\
    \ Marketplace icon for this VM image. ![Figure 7-4 ¶ SQL Server 2019 on Windows\
    \ Server 2019 VM Image](images/394392_3_En_7_Chapter/394392_3_En_7_Fig4_HTML.jpg)\n\
    \nFigure 7-4 ¶ SQL Server 2019 on Windows Server 2019 VM Image\n\nIn the first\
    \ section of the Create Virtual Machine page, illustrated in Figure [7-5](#394392_3_En_7_Chapter.xhtml#Fig5),\
    \ we will specify the Subscription and Resource Group that the VM should be created\
    \ in, before specifying a name for the server and the Region it should be created\
    \ in. ![Figure 7-5 ¶ Create a Virtual Machine (Part 1)](images/394392_3_En_7_Chapter/394392_3_En_7_Fig5_HTML.jpg)\n\
    \nFigure 7-5 ¶ Create a Virtual Machine (Part 1)\n\nWe then go on to specify the\
    \ Availability Options that we would like for the VM. This is critical when planning\
    \ Availability Groups. In the Availability Options dialog box, we can choose between\
    \ No infrastructure redundancy required, Availability Set, or Availability Zone.\
    \ If we had chosen Availability Set, then we would have had the option either\
    \ to use the Availability Set we created earlier or to create a new Availability\
    \ Set. We have chosen Availability Zone, however, so we can specify which Availability\
    \ Zone the server should be created in. Each Region has a minimum of three Availability\
    \ Zones.\n\nCaution \n\nIt is important to note, however, that the Availability\
    \ Option cannot be changed after creating the VM. For example, you cannot create\
    \ a VM with no availability option and then add it to an Availability Set later.\n\
    \nWe then have the option to choose change the image that we are building from\
    \ and specify if we want to use Spot instances. Spot instances are rarely suitable\
    \ for SQL Server and never in a production environment. Spot instances are built\
    \ from spare capacity within Azure and are very cost effective. However, Azure\
    \ can terminate them at very short notice, if they need the capacity. Therefore,\
    \ Spot instances are usually most applicable for stateless applications, within\
    \ Scale Sets, or for stateless applications in test environments.\n\nWe also specify\
    \ the size of VM that we would like to build. The monthly cost (based on the server\
    \ being up 24x7) will be displayed to the right of the VMs size profile.\n\nWe\
    \ can now continue to populate the second half of the form, as shown in Figure\
    \ [7-6](#394392_3_En_7_Chapter.xhtml#Fig6). Here, we specify the username and\
    \ password for the VMs Admin user and if ports should be opened on a public IP\
    \ address for the server. If so, we can specify which ports should be open. ![Figure\
    \ 7-6 ¶ Create a Virtual Machine (Part 2)](images/394392_3_En_7_Chapter/394392_3_En_7_Fig6_HTML.jpg)\n\
    \nFigure 7-6 ¶ Create a Virtual Machine (Part 2)\n\nCaution \n\nPublic ports should\
    \ only ever be opened for dev/test purposes and even then it is highly advisable\
    \ to create a VPN, or use a Bastion instead.\n\nFinally, we specify the licensing\
    \ model we want to use. Note that this is just for the operating system, not for\
    \ SQL Server, but we still have the same two options. We can either pay for the\
    \ Windows license as we go or bring our own."

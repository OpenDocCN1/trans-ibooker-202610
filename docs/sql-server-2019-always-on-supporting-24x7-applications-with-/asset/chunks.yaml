- raw: "| 2 || • Any Level 1 condition.• The SQL instance is not connected to the\
    \ cluster and the health check threshold is exceeded.• The availability replica\
    \ is in a FAILED state. |\n\n| 3 (Default)   || • Any Level 1–2 condition.• Critical\
    \ internal errors within the SQL Server instance. |\n\n| 4 || • Any Level 1–3\
    \ condition.• Moderate internal errors within the SQL Server instance. |\n\n|\
    \ 5 || • Any Level 1–4 condition.• Any internal failure within the SQL Server\
    \ instance. |\n\nWhen adding Replicas with the REPLICA ON clause, additional WITH\
    \ OPTIONS are available. These are detailed in Table [5-3](#394392_3_En_5_Chapter.xhtml#Tab3).\
    \ Table 5-3 \n\nON REPLICA WITH Options\n\n| Option || Description |\n\n| ---\
    \ | --- |\n\n| ENDPOINT\\_URL || The URL of the endpoint on the SQL Server instance\
    \ that hosts the Replica. |\n\n| --- | --- |\n\n| FAILOVER\\_MODE || Specifies\
    \ if the Replica should support automatic or manual failover. |\n\n| AVAILABILITY\\\
    _MODE || Specifies if transactions on the Replica should be committed synchronously\
    \ or asynchronously. The availability mode can also be set to CONFIGURATION\\\
    _ONLY mode, to support external cluster mode. This will be discussed in Chapter\
    \ [6](#394392_3_En_6_Chapter.xhtml). |\n\n| SESSION\\_TIMEOUT || Specifies the\
    \ session timeout period in seconds. |\n\n| BACKUP\\_PRIORITY  || Provides a weighting\
    \ for the Replica, which will be used to decide which Replica backups should be\
    \ taken from. 0 indicates backups cannot be taken from the replica. |\n\n| SEEDING\\\
    _MODE || Specifies how the Replica is seeded. Acceptable values are AUTOMATIC\
    \ and MANUAL. |\n\n| PRIMARY\\_ROLE || Used to specify the ALLOW\\_CONNECTIONS\
    \ setting and pass a READ\\_ONLY\\_ROUTING\\_LIST. |\n\n| SECONDARY\\_ROLE ||\
    \ Used to specify a value for ALLOW\\_CONNECTIONS and pass a READ\\_ONLY\\_ROUTING\\\
    _URL. |\n\nTherefore, the script in Listing [5-6](#394392_3_En_5_Chapter.xhtml#PC6)\
    \ will create the Accounts Availability Group. Note that we have chosen to seed\
    \ the replicas manually. CREATE AVAILABILITY GROUP Accounts WITH (       AUTOMATED\\\
    _BACKUP\\_PREFERENCE = PRIMARY,       DB\\_FAILOVER = OFF,       DTC\\_SUPPORT\
    \ = NONE,       REQUIRED\\_SYNCHRONIZED\\_SECONDARIES\\_TO\\_COMMIT = 0 ) FOR\
    \ REPLICA ON       'CLUSTERNODE1\\\\PROD' WITH (             ENDPOINT\\_URL =\
    \ N'TCP://CLUSTERNODE1.AlwaysOn.com:5022',             FAILOVER\\_MODE = AUTOMATIC,\
    \             AVAILABILITY\\_MODE = SYNCHRONOUS\\_COMMIT,             SESSION\\\
    _TIMEOUT = 10,             BACKUP\\_PRIORITY = 50,             SEEDING\\_MODE\
    \ = MANUAL,             PRIMARY\\_ROLE(ALLOW\\_CONNECTIONS = ALL),             SECONDARY\\\
    _ROLE(ALLOW\\_CONNECTIONS = NO)       ),       'CLUSTERNODE2\\\\SYNCHA' WITH (\
    \             ENDPOINT\\_URL = N'TCP://CLUSTERNODE2.AlwaysOn.com:5022',             FAILOVER\\\
    _MODE = AUTOMATIC,             AVAILABILITY\\_MODE = SYNCHRONOUS\\_COMMIT,             SESSION\\\
    _TIMEOUT = 10,             BACKUP\\_PRIORITY = 50,               SEEDING\\_MODE\
    \ = MANUAL,             PRIMARY\\_ROLE(ALLOW\\_CONNECTIONS = ALL),             SECONDARY\\\
    _ROLE(ALLOW\\_CONNECTIONS = NO)       ),       'CLUSTERNODE3\\\\ASYNCDR' WITH\
    \ (             ENDPOINT\\_URL = N'TCP://CLUSTERNODE3.AlwaysOn.com:5022',             FAILOVER\\\
    _MODE = MANUAL,             AVAILABILITY\\_MODE = ASYNCHRONOUS\\_COMMIT,             SESSION\\\
    _TIMEOUT = 10,             BACKUP\\_PRIORITY = 50,             SEEDING\\_MODE\
    \ = MANUAL,             PRIMARY\\_ROLE(ALLOW\\_CONNECTIONS = ALL),             SECONDARY\\\
    _ROLE(ALLOW\\_CONNECTIONS = NO)       ); GO Listing 5-6 \n\nCreate the Accounts\
    \ Availability Group\n\nNow that we have created the Accounts Availability Group,\
    \ we will need to create an Availability Group Listener, so that the cluster knows\
    \ where to direct requests. We will do this using the ALTER AVAILABILITY GROUP\
    \ command with the ADD LISTENER clause. The ADD LISTENER clause has the WITH options\
    \ specified in Table [5-4](#394392_3_En_5_Chapter.xhtml#Tab4). Table 5-4 \n\n\
    ADD LISTERNER WITH Options\n\n| Option || Description |\n\n| --- | --- |\n\n|\
    \ IP || Specify the IP Address(s) that the Listener will listen on, along with\
    \ the subnet masks of the network relating to each IP address |\n\n| --- | ---\
    \ |\n\n| PORT || The Port that the Listener will listen on |\n\nBecause our CLUSTERNODE3\\\
    \\ASYNCDR instance is in a different subnet to CLUSTERNODE1\\\\PROD and CLUSTERNODE2\\\
    \\SYNCHA, we need to specify two IP addresses, one for each subnet. Therefore,\
    \ the script in Listing [5-7](#394392_3_En_5_Chapter.xhtml#PC7) will create the\
    \ Availability Group Listener for the Accounts Availability Group. ALTER AVAILABILITY\
    \ GROUP Accounts       ADD LISTENER 'Accounts' (             WITH IP                   (\
    \                         (N'10.0.0.8', N'255.255.255.0'),                         (N'10.0.1.8',\
    \ N'255.255.255.0')                   ),             PORT=1433       ); GO Listing\
    \ 5-7 \n\nCreate an Availability Group Listener\n\n## Implementing Availability\
    \ Groups with PowerShell\n\nAs you might expect, Microsoft offers PowerShell cmdlets\
    \ that can be used to create and manage SQL Server Availability Groups and Availability\
    \ Group Listeners. This is becoming increasingly important, as the world moves\
    \ toward a DevOps culture, with PowerShell being the language of choice for many\
    \ organizations looking to implement build automation.\n\nThe sqlserver PowerShell\
    \  module is installed along with the SQL Server Management Studio, but can also\
    \ be installed by using the command in Listing [5-8](#394392_3_En_5_Chapter.xhtml#PC8).\
    \ Install-Module sqlserver Listing 5-8 \n\nInstall the sqlserver PowerShell Module\n\
    \nNote \n\nIf this is the first time you have installed a PowerShell module on\
    \ the server, then you will be prompted to install the NuGet provider.\n\nOnce\
    \ the sqlserver module is installed, you will have access to cmdlets which allow\
    \ you to create and manage Availability Groups via PowerShell. The New-AvailabilityReplica\
    \ cmdlet allows you to create an object which specifies the properties for each\
    \ Replica. These objects can then be passed to the New-SqlAvailabilityGroup cmdlet\
    \ , which will create the Availability Group.\n\nFor example, imagine we want\
    \ to create an Availability Group called Foo, which will contain the Foo database,\
    \ with CLUSTERNODE1\\\\PROD hosting the initial primary Replica and CLUSTERNODE2\\\
    \\SYNCHA hosting a secondary Replica, for high availability. We could achieve\
    \ this using the script in Listing [5-9](#394392_3_En_5_Chapter.xhtml#PC9). #Create\
    \ connection to CLSUETERNODE1\\\\PROD $PrimaryServer = Get-Item \"SQLSERVER:\\\
    \\SQL\\\\CLUSTERNODE1\\\\PROD\" -Verbose #Create connection to CLUSTERNODE2\\\\\
    SYNCHA $SecondaryServer = Get-Item \"SQLSERVER:\\\\SQL\\\\CLUSTERNODE2\\\\SYNCHA\"\
    \ #Set the properties of the primary Replica $PrimaryReplicaOptions = @{     Name             =\
    \ \"CLUSTERNODE1\\\\PROD\"     EndpointUrl      = \"TCP://CLUSTERNODE1.ALWAYSON.COM:5022\"\
    \     FailoverMode     = \"Automatic\"     AvailabilityMode = \"SynchronousCommit\"\
    \     Version          = ($PrimaryServer.Version) } #Create the primary Replica\
    \ Object $PrimaryReplica = New-SqlAvailabilityReplica @PrimaryReplicaOptions  -AsTemplate\
    \ #Set the properties of the secondary Replica $SecondaryReplicaOptions = @{     Name             =\
    \ \"CLUSTERNODE2\\\\SYNCHA\"     EndpointUrl      = \"TCP://CLUSTERNODE2.ALWAYSON.COM:5022\"\
    \     FailoverMode     = \"Automatic\"     AvailabilityMode = \"SynchronousCommit\"\
    \     Version          = ($SecondaryServer.Version) } #Create the secondary replica\
    \ object $SecondaryReplica = New-SqlAvailabilityReplica @SecondaryReplicaOption\
    \ -AsTemplate $AvailabilityGroupOptions = @{     InputObject         = $PrimaryServer\
    \     Name =              = \"Foo\"     AvailabilityReplica = ($PrimaryReplica,\
    \ $SecondaryReplica)     Database            = @(\"Foo\") } New-SqlAvailabilityGroup\
    \ @AvailabilityGroupOptions Listing 5-9 \n\nCreate to Foo Availability Group"
  fmt: "\n## Severity Levels\n\n| Level | Description |\n|---|---|\n| 2 | • Any Level\
    \ 1 condition. • The SQL instance is not connected to the cluster and the health\
    \ check threshold is exceeded. • The availability replica is in a FAILED state.\
    \ |\n| 3 (Default) | • Any Level 1–2 condition. • Critical internal errors within\
    \ the SQL Server instance. |\n| 4 | • Any Level 1–3 condition. • Moderate internal\
    \ errors within the SQL Server instance. |\n| 5 | • Any Level 1–4 condition. •\
    \ Any internal failure within the SQL Server instance. |\n\nWhen adding Replicas\
    \ with the `REPLICA ON` clause, additional `WITH OPTIONS` are available. These\
    \ are detailed in Table [5-3](#394392_3_En_5_Chapter.xhtml#Tab3).\n\n## ON REPLICA\
    \ WITH Options\n\nTable 5-3\n\n| Option | Description |\n|---|---|\n| `ENDPOINT_URL`\
    \ | The URL of the endpoint on the SQL Server instance that hosts the Replica.\
    \ |\n| `FAILOVER_MODE` | Specifies if the Replica should support automatic or\
    \ manual failover. |\n| `AVAILABILITY_MODE` | Specifies if transactions on the\
    \ Replica should be committed synchronously or asynchronously. The availability\
    \ mode can also be set to `CONFIGURATION_ONLY` mode, to support external cluster\
    \ mode. This will be discussed in Chapter [6](#394392_3_En_6_Chapter.xhtml). |\n\
    | `SESSION_TIMEOUT` | Specifies the session timeout period in seconds. |\n| `BACKUP_PRIORITY`\
    \ | Provides a weighting for the Replica, which will be used to decide which Replica\
    \ backups should be taken from. 0 indicates backups cannot be taken from the replica.\
    \ |\n| `SEEDING_MODE` | Specifies how the Replica is seeded. Acceptable values\
    \ are `AUTOMATIC` and `MANUAL`. |\n| `PRIMARY_ROLE` | Used to specify the `ALLOW_CONNECTIONS`\
    \ setting and pass a `READ_ONLY_ROUTING_LIST`. |\n| `SECONDARY_ROLE` | Used to\
    \ specify a value for `ALLOW_CONNECTIONS` and pass a `READ_ONLY_ROUTING_URL`.\
    \ |\n\nTherefore, the script in Listing [5-6](#394392_3_En_5_Chapter.xhtml#PC6)\
    \ will create the `Accounts` Availability Group. Note that we have chosen to seed\
    \ the replicas manually.\n\n### Listing 5-6 Create the Accounts Availability Group\n\
    ```sql\nCREATE AVAILABILITY GROUP Accounts WITH (\n      AUTOMATED_BACKUP_PREFERENCE\
    \ = PRIMARY,\n      DB_FAILOVER = OFF,\n      DTC_SUPPORT = NONE,\n      REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT\
    \ = 0\n) FOR REPLICA ON\n      'CLUSTERNODE1\\PROD' WITH (\n            ENDPOINT_URL\
    \ = N'TCP://CLUSTERNODE1.AlwaysOn.com:5022',\n            FAILOVER_MODE = AUTOMATIC,\n\
    \            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n            SESSION_TIMEOUT\
    \ = 10,\n            BACKUP_PRIORITY = 50,\n            SEEDING_MODE = MANUAL,\n\
    \            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n            SECONDARY_ROLE(ALLOW_CONNECTIONS\
    \ = NO)\n      ),\n      'CLUSTERNODE2\\SYNCHA' WITH (\n            ENDPOINT_URL\
    \ = N'TCP://CLUSTERNODE2.AlwaysOn.com:5022',\n            FAILOVER_MODE = AUTOMATIC,\n\
    \            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n            SESSION_TIMEOUT\
    \ = 10,\n            BACKUP_PRIORITY = 50,\n            SEEDING_MODE = MANUAL,\n\
    \            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n            SECONDARY_ROLE(ALLOW_CONNECTIONS\
    \ = NO)\n      ),\n      'CLUSTERNODE3\\ASYNCDR' WITH (\n            ENDPOINT_URL\
    \ = N'TCP://CLUSTERNODE3.AlwaysOn.com:5022',\n            FAILOVER_MODE = MANUAL,\n\
    \            AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n            SESSION_TIMEOUT\
    \ = 10,\n            BACKUP_PRIORITY = 50,\n            SEEDING_MODE = MANUAL,\n\
    \            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n            SECONDARY_ROLE(ALLOW_CONNECTIONS\
    \ = NO)\n      );\nGO\n```\n\nNow that we have created the `Accounts` Availability\
    \ Group, we will need to create an Availability Group Listener, so that the cluster\
    \ knows where to direct requests. We will do this using the `ALTER AVAILABILITY\
    \ GROUP` command with the `ADD LISTENER` clause. The `ADD LISTENER` clause has\
    \ the `WITH` options specified in Table [5-4](#394392_3_En_5_Chapter.xhtml#Tab4).\n\
    \n## ADD LISTERNER WITH Options\n\nTable 5-4\n\n| Option | Description |\n|---|---|\n\
    | `IP` | Specify the IP Address(s) that the Listener will listen on, along with\
    \ the subnet masks of the network relating to each IP address |\n| `PORT` | The\
    \ Port that the Listener will listen on |\n\nBecause our `CLUSTERNODE3\\ASYNCDR`\
    \ instance is in a different subnet to `CLUSTERNODE1\\PROD` and `CLUSTERNODE2\\\
    SYNCHA`, we need to specify two IP addresses, one for each subnet. Therefore,\
    \ the script in Listing [5-7](#394392_3_En_5_Chapter.xhtml#PC7) will create the\
    \ Availability Group Listener for the `Accounts` Availability Group.\n\n### Listing\
    \ 5-7 Create an Availability Group Listener\n```sql\nALTER AVAILABILITY GROUP\
    \ Accounts\n      ADD LISTENER 'Accounts' (\n            WITH IP\n           \
    \       (\n                        (N'10.0.0.8', N'255.255.255.0'),\n        \
    \                (N'10.0.1.8', N'255.255.255.0')\n                  ),\n     \
    \       PORT=1433\n      );\nGO\n```\n\n## Implementing Availability Groups with\
    \ PowerShell\n\nAs you might expect, Microsoft offers PowerShell cmdlets that\
    \ can be used to create and manage SQL Server Availability Groups and Availability\
    \ Group Listeners. This is becoming increasingly important, as the world moves\
    \ toward a DevOps culture, with PowerShell being the language of choice for many\
    \ organizations looking to implement build automation.\n\nThe `sqlserver` PowerShell\
    \ module is installed along with the SQL Server Management Studio, but can also\
    \ be installed by using the command in Listing [5-8](#394392_3_En_5_Chapter.xhtml#PC8).\n\
    \n### Listing 5-8 Install the sqlserver PowerShell Module\n```powershell\nInstall-Module\
    \ sqlserver\n```\n\nNote\nIf this is the first time you have installed a PowerShell\
    \ module on the server, then you will be prompted to install the NuGet provider.\n\
    \nOnce the `sqlserver` module is installed, you will have access to cmdlets which\
    \ allow you to create and manage Availability Groups via PowerShell. The `New-AvailabilityReplica`\
    \ cmdlet allows you to create an object which specifies the properties for each\
    \ Replica. These objects can then be passed to the `New-SqlAvailabilityGroup`\
    \ cmdlet, which will create the Availability Group.\n\nFor example, imagine we\
    \ want to create an Availability Group called `Foo`, which will contain the `Foo`\
    \ database, with `CLUSTERNODE1\\PROD` hosting the initial primary Replica and\
    \ `CLUSTERNODE2\\SYNCHA` hosting a secondary Replica, for high availability. We\
    \ could achieve this using the script in Listing [5-9](#394392_3_En_5_Chapter.xhtml#PC9).\n\
    \n### Listing 5-9 Create to Foo Availability Group\n```powershell\n#Create connection\
    \ to CLSUETERNODE1\\PROD\n$PrimaryServer = Get-Item \"SQLSERVER:\\\\SQL\\\\CLUSTERNODE1\\\
    \\PROD\" -Verbose\n#Create connection to CLUSTERNODE2\\SYNCHA\n$SecondaryServer\
    \ = Get-Item \"SQLSERVER:\\\\SQL\\\\CLUSTERNODE2\\\\SYNCHA\"\n#Set the properties\
    \ of the primary Replica\n$PrimaryReplicaOptions = @{\n    Name             =\
    \ \"CLUSTERNODE1\\PROD\"\n    EndpointUrl      = \"TCP://CLUSTERNODE1.ALWAYSON.COM:5022\"\
    \n    FailoverMode     = \"Automatic\"\n    AvailabilityMode = \"SynchronousCommit\"\
    \n    Version          = ($PrimaryServer.Version)\n}\n#Create the primary Replica\
    \ Object\n$PrimaryReplica = New-SqlAvailabilityReplica @PrimaryReplicaOptions\
    \  -AsTemplate\n#Set the properties of the secondary Replica\n$SecondaryReplicaOptions\
    \ = @{\n    Name             = \"CLUSTERNODE2\\SYNCHA\"\n    EndpointUrl     \
    \ = \"TCP://CLUSTERNODE2.ALWAYSON.COM:5022\"\n    FailoverMode     = \"Automatic\"\
    \n    AvailabilityMode = \"SynchronousCommit\"\n    Version          = ($SecondaryServer.Version)\n\
    }\n#Create the secondary replica object\n$SecondaryReplica = New-SqlAvailabilityReplica\
    \ @SecondaryReplicaOption -AsTemplate\n$AvailabilityGroupOptions = @{\n    InputObject\
    \         = $PrimaryServer\n    Name =              = \"Foo\"\n    AvailabilityReplica\
    \ = ($PrimaryReplica, $SecondaryReplica)\n    Database            = @(\"Foo\"\
    )\n}\nNew-SqlAvailabilityGroup @AvailabilityGroupOptions\n```\n"
  trans: "\n## 严重程度级别\n\n| 级别 | 描述 |\n|---|---|\n| 2 | • 任何级别 1 条件。 • SQL 实例未连接到集群且健康检查阈值已超出。\
    \ • 可用性副本处于 FAILED 状态。 |\n| 3 (默认) | • 任何级别 1–2 条件。 • SQL Server 实例内部出现关键错误。 |\n\
    | 4 | • 任何级别 1–3 条件。 • SQL Server 实例内部出现中等错误。 |\n| 5 | • 任何级别 1–4 条件。 • SQL Server\
    \ 实例内部出现任何故障。 |\n\n当使用 `REPLICA ON` 子句添加副本时，还可以使用额外的 `WITH OPTIONS`。这些内容在表 5-3\
    \ 中有详细说明。\n\n## ON REPLICA WITH 选项\n\n表 5-3\n\n| 选项 | 描述 |\n|---|---|\n| `ENDPOINT_URL`\
    \ | 主机副本的 SQL Server 实例上端点的 URL。 |\n| `FAILOVER_MODE` | 指定副本是否应支持自动或手动故障转移。 |\n\
    | `AVAILABILITY_MODE` | 指定副本上的事务应同步或异步提交。可用性模式也可以设置为 `CONFIGURATION_ONLY` 模式，以支持外部集群模式。这将在第\
    \ 6 章中讨论。 |\n| `SESSION_TIMEOUT` | 指定会话超时时间（以秒为单位）。 |\n| `BACKUP_PRIORITY` | 为副本提供权重，用于决定应从哪个副本获取备份。0\
    \ 表示无法从副本获取备份。 |\n| `SEEDING_MODE` | 指定副本的播种方式。可接受的值为 `AUTOMATIC` 和 `MANUAL`。\
    \ |\n| `PRIMARY_ROLE` | 用于指定 `ALLOW_CONNECTIONS` 设置并传递 `READ_ONLY_ROUTING_LIST`。\
    \ |\n| `SECONDARY_ROLE` | 用于指定 `ALLOW_CONNECTIONS` 的值并传递 `READ_ONLY_ROUTING_URL`。\
    \ |\n\n因此，清单 5-6 中的脚本将创建 `Accounts` 可用性组。请注意，我们选择手动播种副本。\n\n### Listing 5-6 创建\
    \ Accounts 可用性组\n```sql\nCREATE AVAILABILITY GROUP Accounts WITH (\n      AUTOMATED_BACKUP_PREFERENCE\
    \ = PRIMARY,\n      DB_FAILOVER = OFF,\n      DTC_SUPPORT = NONE,\n      REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT\
    \ = 0\n) FOR REPLICA ON\n      'CLUSTERNODE1\\PROD' WITH (\n            ENDPOINT_URL\
    \ = N'TCP://CLUSTERNODE1.AlwaysOn.com:5022',\n            FAILOVER_MODE = AUTOMATIC,\n\
    \            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n            SESSION_TIMEOUT\
    \ = 10,\n            BACKUP_PRIORITY = 50,\n            SEEDING_MODE = MANUAL,\n\
    \            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n            SECONDARY_ROLE(ALLOW_CONNECTIONS\
    \ = NO)\n      ),\n      'CLUSTERNODE2\\SYNCHA' WITH (\n            ENDPOINT_URL\
    \ = N'TCP://CLUSTERNODE2.AlwaysOn.com:5022',\n            FAILOVER_MODE = AUTOMATIC,\n\
    \            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n            SESSION_TIMEOUT\
    \ = 10,\n            BACKUP_PRIORITY = 50,\n            SEEDING_MODE = MANUAL,\n\
    \            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n            SECONDARY_ROLE(ALLOW_CONNECTIONS\
    \ = NO)\n      ),\n      'CLUSTERNODE3\\ASYNCDR' WITH (\n            ENDPOINT_URL\
    \ = N'TCP://CLUSTERNODE3.AlwaysOn.com:5022',\n            FAILOVER_MODE = MANUAL,\n\
    \            AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n            SESSION_TIMEOUT\
    \ = 10,\n            BACKUP_PRIORITY = 50,\n            SEEDING_MODE = MANUAL,\n\
    \            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n            SECONDARY_ROLE(ALLOW_CONNECTIONS\
    \ = NO)\n      );\nGO\n```\n\n现在我们已经创建了 `Accounts` 可用性组，我们需要创建一个可用性组侦听器，以便集群知道将请求定向到何处。我们将使用带有\
    \ `ADD LISTENER` 子句的 `ALTER AVAILABILITY GROUP` 命令来完成此操作。`ADD LISTENER` 子句的 `WITH`\
    \ 选项在表 5-4 中指定。\n\n## ADD LISTERNER WITH 选项\n\n表 5-4\n\n| 选项 | 描述 |\n|---|---|\n\
    | `IP` | 指定侦听器将监听的 IP 地址（们），以及与每个 IP 地址相关的网络的子网掩码 |\n| `PORT` | 侦听器将监听的端口 |\n\n\
    因为我们的 `CLUSTERNODE3\\ASYNCDR` 实例与 `CLUSTERNODE1\\PROD` 和 `CLUSTERNODE2\\SYNCHA`\
    \ 位于不同的子网中，所以我们需要指定两个 IP 地址，每个子网一个。因此，清单 5-7 中的脚本将为 `Accounts` 可用性组创建可用性组侦听器。\n\
    \n### Listing 5-7 创建可用性组侦听器\n```sql\nALTER AVAILABILITY GROUP Accounts\n     \
    \ ADD LISTENER 'Accounts' (\n            WITH IP\n                  (\n      \
    \                  (N'10.0.0.8', N'255.255.255.0'),\n                        (N'10.0.1.8',\
    \ N'255.255.255.0')\n                  ),\n            PORT=1433\n      );\nGO\n\
    ```\n\n## 使用 PowerShell 实现可用性组\n\n正如您所料，Microsoft 提供了 PowerShell cmdlet，可用于创建和管理\
    \ SQL Server 可用性组和可用性组侦听器。随着世界向 DevOps 文化转变，PowerShell 成为许多希望实现构建自动化的组织的首选语言，这一点变得越来越重要。\n\
    \n`sqlserver` PowerShell 模块随 SQL Server Management Studio 一起安装，但也可以通过清单 5-8 中的命令进行安装。\n\
    \n### Listing 5-8 安装 sqlserver PowerShell 模块\n```powershell\nInstall-Module sqlserver\n\
    ```\n\n注意\n如果这是您在服务器上首次安装 PowerShell 模块，则会提示您安装 NuGet 提供程序。\n\n安装 `sqlserver`\
    \ 模块后，您将可以使用 cmdlet 通过 PowerShell 创建和管理可用性组。`New-AvailabilityReplica` cmdlet 允许您创建指定每个副本属性的对象。然后可以将这些对象传递给\
    \ `New-SqlAvailabilityGroup` cmdlet，后者将创建可用性组。\n\n例如，假设我们想要创建一个名为 `Foo` 的可用性组，其中包含\
    \ `Foo` 数据库，`CLUSTERNODE1\\PROD` 主机初始主副本，`CLUSTERNODE2\\SYNCHA` 主机辅助副本以实现高可用性。我们可以使用清单\
    \ 5-9 中的脚本来实现这一点。\n\n### Listing 5-9 创建 Foo 可用性组\n```powershell\n#Create connection\
    \ to CLSUETERNODE1\\PROD\n$PrimaryServer = Get-Item \"SQLSERVER:\\\\SQL\\\\CLUSTERNODE1\\\
    \\PROD\" -Verbose\n#Create connection to CLUSTERNODE2\\SYNCHA\n$SecondaryServer\
    \ = Get-Item \"SQLSERVER:\\\\SQL\\\\CLUSTERNODE2\\\\SYNCHA\"\n#Set the properties\
    \ of the primary Replica\n$PrimaryReplicaOptions = @{\n    Name             =\
    \ \"CLUSTERNODE1\\PROD\"\n    EndpointUrl      = \"TCP://CLUSTERNODE1.ALWAYSON.COM:5022\"\
    \n    FailoverMode     = \"Automatic\"\n    AvailabilityMode = \"SynchronousCommit\"\
    \n    Version          = ($PrimaryServer.Version)\n}\n#Create the primary Replica\
    \ Object\n$PrimaryReplica = New-SqlAvailabilityReplica @PrimaryReplicaOptions\
    \  -AsTemplate\n#Set the properties of the secondary Replica\n$SecondaryReplicaOptions\
    \ = @{\n    Name             = \"CLUSTERNODE2\\SYNCHA\"\n    EndpointUrl     \
    \ = \"TCP://CLUSTERNODE2.ALWAYSON.COM:5022\"\n    FailoverMode     = \"Automatic\"\
    \n    AvailabilityMode = \"SynchronousCommit\"\n    Version          = ($SecondaryServer.Version)\n\
    }\n#Create the secondary replica object\n$SecondaryReplica = New-SqlAvailabilityReplica\
    \ @SecondaryReplicaOption -AsTemplate\n$AvailabilityGroupOptions = @{\n    InputObject\
    \         = $PrimaryServer\n    Name =              = \"Foo\"\n    AvailabilityReplica\
    \ = ($PrimaryReplica, $SecondaryReplica)\n    Database            = @(\"Foo\"\
    )\n}\nNew-SqlAvailabilityGroup @AvailabilityGroupOptions\n```\n"

    # Front Matter


    ## Introduction


    *SQL Server 2019 AlwaysOn* is intended to be a quick start guide for DBAs who
    need to implement high availability and disaster recovery for their SQL Server
    workloads.


    The book begins with a discussion of high availability concepts and methodologies,
    before a high-level overview of HA/DR technologies. Then, it’s into the detail.
    We will discuss how to create Windows clusters, before looking at how to create
    SQL Server AlwaysOn Failover Clustered Instances.


    The focus of the book then turns to AlwaysOn Availability Groups. Here, the book
    discusses how to create and configure Availability Groups for high availability
    and disaster recovery, both on Windows and Linux operating systems.


    We then look at atypical use cases for AlwaysOn Availability Groups, such as clusterless
    and domain-independent availability groups, as well as configuring Availability
    Groups on Azure IaaS and Basic Availability Groups, for SQL Server Standard Edition.


    Finally, the book looks at the operational side of AlwaysOn, with chapters covering
    the administration, monitoring, and troubleshooting of the technology.


    ## Acknowledgments


    I want to offer my thanks to the amazing Chris Dent, who once again helped me
    with my network configuration for this book.


    I would also like to thank Ian Stirk, whose tech reviews always increase the quality
    of my books, with this book being no exception.


    ## About the Author Peter A. Carter


    is a SQL Server expert with over 15 years of experience in developing, administering,
    and architecting SQL Server platforms and data-tier applications. Peter was awarded
    an MCC by Microsoft in 2011, and it sits alongside his array of MCTS, MCITP, MCSA,
    and MCSE certifications in SQL Server from version 2005 onward. His passion for
    SQL Server shows through in everything he does, and his goal is that his passion
    for the technology will inspire others.


    ## About the Technical Reviewer Ian Stirk


    is a freelance SQL Server consultant based in London. In addition to his day job,

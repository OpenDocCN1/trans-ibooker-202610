    ## Disks Page


    On the Disks page, illustrated in Figure [7-7](#394392_3_En_7_Chapter.xhtml#Fig7),
    we can configure the storage options for the VM. In the first section of the page,
    we can specify the storage tier that we want to use, from a choice of Standard
    HDD, Standard SSD . or Premium SSD. It will probably be unsurprising that I recommend
    using Premium SSD for VMs hosting SQL Server, although your choice may have other
    factors, such as company policy or budgetary constraints. ![Figure 7-7 ¶ Create
    a Virtual Machine – Disks Page](images/394392_3_En_7_Chapter/394392_3_En_7_Fig7_HTML.jpg)


    Figure 7-7 ¶ Create a Virtual Machine – Disks Page


    In the Advanced section of the page, we can specify if we want to use Managed
    or Unmanaged disks and if we want the OS disk to be ephemeral. Managed disks are
    usually recommended as they bring advantages such as automatically being split
    across Fault and Update domains. If your VM is being built on an Availability
    Set, these domains can also be aligned with the domains of the Availability Set.
    In our case, we must use Managed disks, as this is the only option when the Availability
    Option is configured as Availability Zone.


    Ephemeral disks use very fast storage, which is not termination resistant. Therefore,
    they are applicable for stateless applications but not suitable for VMs running
    SQL Server. In our case, we do not even have the option to choose an ephemeral
    disk for the operating system, as our image is too large to support it.


    ## Networking Page


    On the Networking page (Figure [7-8](#394392_3_En_7_Chapter.xhtml#Fig8)), we can
    specify the vnet and subnet that the VM should be attached to, as well as configuring
    the public IP address and security groups that should be used. On this page, there
    are also options (unillustrated) that allow you to configure Accelerated Networking,
    which is a feature that allows low latency and high throughput to the VMs NIC
    (network interface card), but is only available for larger VMs, and also allows
    you to put the VM behind a preconfigured Load Balancer. This option is not suitable
    for SQL Server. ![Figure 7-8 ¶ Create a Virtual Machine – Networking](images/394392_3_En_7_Chapter/394392_3_En_7_Fig8_HTML.jpg)


    Figure 7-8 ¶ Create a Virtual Machine – Networking


    ## Management Page


    On the Management page, shown in Figure [7-9](#394392_3_En_7_Chapter.xhtml#Fig9),
    we can configure the diagnostic settings for the VM. Specifically, we can select
    if we want boot diagnostics and diagnostics from the guest operating system to
    be captured, alongside which storage account the diagnostics should be saved to.
    ![Figure 7-9 ¶ Create a Virtual Machine – Management Page](images/394392_3_En_7_Chapter/394392_3_En_7_Fig9_HTML.jpg)


    Figure 7-9 ¶ Create a Virtual Machine – Management Page


    We can also specify if we want a system-assigned managed identity to be used.
    If we select this option, then the VM can authenticate to native Azure services,
    such as Key Vault, without the need to store the service credentials in code.
    Finally, we can specify if we want the VM to shut down at a specific time. If
    we select this option, then additional dialog boxes appear, allowing us to specify
    the shutdown schedule and if we want to be notified of the shutdown.


    ### Tip


    When creating the VM, only a shutdown schedule can be added, but there is no option
    to create a startup schedule. This can be achieved by using an Azure Automation
    account.


    ## Advanced Page


    For our purposes, there is nothing that we need to configure on the Advanced page.
    However, this page can be used for passing configuration files to a known location
    within the VM, installing extensions of the VM, such as Puppet Agent, to allow
    for configuration management of the VM. If you want your VM to be placed on a
    Proximity Group, or you want it to reside on an existing dedicated host, then
    these options can also be configured on this page.


    ## SQL Server Settings


    Because we are building a SQL Server VM, we have a page for SQL Server settings,
    which would not appear if we were building a VM from a standard Windows Server
    image. In the first part of this page (Figure [7-10](#394392_3_En_7_Chapter.xhtml#Fig10)),
    we can configure the SQL connectivity. This will give us the option of making
    the SQL Server instance available within the VM only, within our vnet, or publicly
    accessible on the Internet. It goes without saying that making an instance available
    to the Internet is undesirable, usually even in dev/test scenarios. ![Figure 7-10
    ¶ Create a Virtual Machine – SQL Server Settings (Part 1)](images/394392_3_En_7_Chapter/394392_3_En_7_Fig10_HTML.jpg)


    Figure 7-10 ¶ Create a Virtual Machine – SQL Server Settings (Part 1)


    We can also specify the port that the instance should listen on and if we want
    SQL Server authentication to be enabled (instead of just Windows authentication).
    If we choose this option, we can then specify the username and password of our
    desired administrator account.


    We can also select if we want the instance to be integrated with Azure Key Vault.
    If we choose this option, then we must provide the URL and credential information
    for the Key Vault service.


    In the next section of the page, we are presented with the default storage options
    for SQL Server. Using the Change Configuration link will cause the Configure Storage
    page to be invoked, as shown in Figure [7-11](#394392_3_En_7_Chapter.xhtml#Fig11).
    On this page, there are presets, for General, OLTP, and Data warehousing workload
    profiles, which can be customized to meet your requirements. You can specify if
    TempDB and log files should use the same drive or share the data drive. You can
    also specify the size and storage type of each disk. ![Figure 7-11 ¶ Create a
    Virtual Machine – SQL Server Settings (Part 2)](images/394392_3_En_7_Chapter/394392_3_En_7_Fig11_HTML.jpg)


    Figure 7-11 ¶ Create a Virtual Machine – SQL Server Settings (Part 2)


    In the last section of the page, which is illustrated in Figure [7-12](#394392_3_En_7_Chapter.xhtml#Fig12),
    we can specify the license model that we want to use for SQL Server (BYOL or SPLA),
    as well as specifying a patching window and choosing if we want automated backups.
    Finally, we can specify if we want R Services to be installed, which provides
    in-database machine learning features, which have been available since SQL Server
    2017. ![Figure 7-12 ¶ Create a Virtual Machine – SQL Server Settings (Part 3)](images/394392_3_En_7_Chapter/394392_3_En_7_Fig12_HTML.jpg)


    Figure 7-12 ¶ Create a Virtual Machine – SQL Server Settings (Part 3)


    ## Tags and Review Pages


    On the Tags page, we can add tags in key/value pairs, as described in the “Creating
    an Availability Set” section of this chapter. On the Review page, we can review
    our chosen configuration, before creating the virtual machine.


    For our purposes, we should repeat this process to create a second VM, this time
    in Availability Zone 2 and residing on the other subnet within the vnet.


    ## Configuring the Availability Group


    Once the two servers have been built, you will need to join the servers to your
    domain and configure settings such as firewall rules. You can then create a cluster
    using the methods demonstrated in Chapter [3](#394392_3_En_3_Chapter.xhtml) of
    this book. Because we are implementing Availability Groups and not a Failover
    Clustered Instance, then there is no requirement for any shared storage in the
    Cluster.


    After the Cluster has been configured, we can then build the Availability group
    by creating the Sales database, before configuring Availability Groups by using
    the methods discussed in Chapter [5](#394392_3_En_5_Chapter.xhtml) of this book.
    For the purpose of this exercise, the nodes should be configured with synchronous
    replication and automatic failover. Note that you should not create the Availability
    Group Listener at this point.


    In Azure, the Availability Group Listener will require an Azure Load Balancer,
    to hold the IP Addresses for the Availability Group Listener and Failover Cluster.
    We should create the Load Balancer before creating the Availability Group Listener.

    '

    ASYNCDR' WITH (AVAILABILITY\\_MODE = SYNCHRONOUS\\_COMMIT) ; GO \\--FAIL OVER\
    \ ALTER AVAILABILITY GROUP HR FAILOVER GO \\--SWITCH BACK TO ASYNCHRONOUS COMMIT\
    \ MODE ALTER AVAILABILITY GROUP HR MODIFY REPLICA ON N'CLUSTERNODE3\\\\ASYNCDR'\
    \ WITH (AVAILABILITY\\_MODE = ASYNCHRONOUS\\_COMMIT) ; GO \\--ENABLE LOGINS DECLARE\
    \ @AOAGDBs TABLE ( DBName NVARCHAR(128) ) ; INSERT INTO @AOAGDBs SELECT database\\\
    _name FROM sys.availability\\_groups AG INNER JOIN sys.availability\\_databases\\\
    _cluster ADC         ON AG.group\\_id = ADC.group\\_id WHERE AG.name = 'HR' ;\
    \ DECLARE @Mappings TABLE   (     LoginName NVARCHAR(128),     DBname NVARCHAR(128),\
    \     Username NVARCHAR(128),     AliasName NVARCHAR(128) ) ; INSERT INTO @Mappings\
    \ EXEC sp\\_msloginmappings DECLARE @SQL NVARCHAR(MAX) SELECT DISTINCT @SQL =\
    \ (         SELECT 'ALTER LOGIN \\[' + LoginName + '\\] ENABLE; ' AS \\[data()\\\
    ]         FROM @Mappings M         INNER JOIN @AOAGDBs A                 ON M.DBname\
    \ = A.DBName         WHERE LoginName <> SUSER\\_NAME()         FOR XML PATH ('')\
    \ ) ; EXEC(@SQL)   Listing 8-6 \n\nSafe-Stating an Application and Failing Over\
    \ \n\n#### Failing Over a Distributed Availability Group\n\nDistributed availability\
    \ groups  do not support automatic failover; only manual failover is supported.\
    \ When you need to fail over to a secondary Availability Group, within a Distributed\
    \ Availability Group, you should perform the following steps: \n\n*   Set the\
    \ synchronization mode to synchronous commit.\n\n*   Wait for the secondary Availability\
    \ Group to become synchronized.\n\n*   Set the primary Availability Group to take\

- raw: "To monitor availability groups throughout the enterprise, you need to use\
    \ a monitoring tool, such as Systems Operation Center. If you need to monitor\
    \ a small number of availability groups or troubleshoot a specific issue, however,\
    \ use one of the tools included with SQL Server, such as a dashboard for monitoring\
    \ the health of the topology, and an extended events session, called the AlwaysOn\
    \ Health Trace.\n\nOne benefit of achieving high availability for SQL Server is\
    \ that doing so allows you to minimize downtime during planned maintenance. On\
    \ a two-node cluster, you can upgrade the passive node, fail over, and then upgrade\
    \ the active node. For larger clusters, you can perform a rolling patch upgrade,\
    \ which involves removing half of the nodes from the possible owners list and\
    \ upgrading them. You then fail over the instance to one of the upgraded nodes\
    \ and repeat the process for the remaining nodes. This mitigates the risk of mixed\
    \ version, across the possible owners.\n\n© Peter A. Carter 2020 P. A. CarterSQL\
    \ Server 2019 AlwaysOn[https://doi.org/10.1007/978-1-4842-6479-9\\_9](https://doi.org/10.1007/978-1-4842-6479-9_9)\
    \ Begin Abstract \n\n# 9. Monitoring AlwaysOn Availability Groups\n\nPeter A. Carter^([1](#394392_3_En_9_Chapter.xhtml#Aff2) )\
    \ (1) Botley, UK   End Abstract \n\nOnce you have implemented Availability Groups,\
    \ you need to monitor them and respond to any errors or warnings that could affect\
    \ the availability of your data. If you have many availability groups implemented\
    \ throughout the enterprise, then the only way to monitor them effectively and\
    \ holistically is by using an enterprise monitoring tool, such as SOC (Systems\
    \ Operations Center). If you only have a small number of availability groups,\
    \ however, or if you are troubleshooting a specific issue, then SQL Server provides\
    \ the AlwaysOn Dashboard and the AlwaysOn Health Trace. You can also create your\
    \ own Extended Events sessions to monitor Availability Groups. This chapter will\
    \ discuss each of these monitoring possibilities.\n\n## AlwaysOn Dashboard\n\n\
    The AlwaysOn Dashboard is an interactive report that allows you to view the health\
    \ of your AlwaysOn environment and drill through, or roll up elements within the\
    \ topology. You can invoke the report from the context menu of the Availability\
    \ Groups folder in Object Explorer, or from the context menu of the availability\
    \ group itself. Figure [9-1](#394392_3_En_9_Chapter.xhtml#Fig1) shows the report\
    \ that is generated from the context menu of the HR availability group. You can\
    \ see that currently synchronization is in a healthy state. The Add/Remove columns\
    \ button has been used to add the Estimated Recovery Time and Estimated Data Loss\
    \ measures. Estimated Data Loss is helpful when you have asynchronous replicas,\
    \ so that gauge impact in the event of an incident. \n\nThe three possible synchronization\
    \ states that a database can be in are SYNCHRONIZED, SYNCHRONIZING, and NOT SYNCHRONIZING.\
    \ A synchronous replica should be in the SYNCHRONIZED state, and any other state\
    \ is unhealthy. An asynchronous replica, however, will never be in the SYNCHRONIZED\
    \ state, and a state of SYNCHRONIZING is considered healthy. Regardless of the\
    \ mode, NOT SYNCHRONIZING indicates that the replica is not connected. ![Figure\
    \ 9-1 ¶ The Availability Group Dashboard](images/394392_3_En_9_Chapter/394392_3_En_9_Fig1_HTML.jpg)\n\
    \nFigure 9-1 ¶ The Availability Group Dashboard\n\nNote \n\nIn addition to the\
    \ synchronization states, a replica also has one of the following operational\

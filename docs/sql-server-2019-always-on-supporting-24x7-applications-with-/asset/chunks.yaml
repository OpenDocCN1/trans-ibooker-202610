    If you select the `Automatic Seeding` option, then an empty database is initially
    created on each `Replica`. The data is then seeding using `VDI` (`Virtual Device
    Interface`) over the log stream transport. This option is slower than initializing
    with a backup but avoid transferring large backup files between shares.


    **Tip**

    If your `availability group` will contain many databases, then it may be best
    to perform the backup/restore yourself. This is because the inbuilt utility will
    perform the actions sequentially, and therefore, it may take a long time to complete.


    On the `Validation page`, rules that may cause the setup to fail are checked.
    If any of the results come back as `Failed`, then you need to resolve them before
    you attempt to continue.


    **Tip**

    A common gotcha is discovered during the validation process, when you are using
    named instances. A requirement of `availability groups` is that the databases
    must reside in the same file path on all replicas. The default file location for
    `SQL Server` data files includes the name of the instance, however. This does
    not matter for default instances, because the instance name within the file path
    is always `MSSQLSERVER`. For named instances, however, ensure that the database
    files are stored in a file path that exists on all servers.


    Once validation tests are complete and we move to the `Summary page`, we are presented
    with a list of the tasks that are to be carried out during the setup.


    As setup progresses, the results of each configuration task display on the `Results
    page`. If any errors occur on this page, be sure to investigate them, but this
    does not necessarily mean that the entire `availability group` needs to be reconfigured.
    For example, if the creation of the `availability group listener` fails because
    the `VCO` had not been presented in `AD`, then you can re-create the listener
    without needing to re-create the entire `availability group`.


    As an alternative to using the `New Availability Group wizard`, you can perform
    the configuration of the `availability group` using the `New Availability Group
    dialog box`, followed by the `Add Listener dialog box`. This method of creating
    an `availability group` is examined in the next section.


    ## Using the New Availability Group Dialog Box


    Now that we have successfully created our first `availability group`, let’s create
    a second `availability group` for `Sales`. This `availability group` will contain
    the `Sales` and `Customer` databases. This time, we use the `New Availability
    Group` and `Add Listener` dialog boxes. We begin this process by backing up the
    two databases. Just like when we created the `HR` `availability group`, the databases
    are not selectable until we perform the backup. Unlike when we used the wizard,
    however, we have no way to make `SQL Server` perform the initial database synchronization
    using a backup/restore option. Therefore, we must either back up the database
    to the share that we created during the previous demonstration and then restore
    the backup, along with a transaction log backup, to the secondary instance, or
    use `Automatic Seeding`. In this example, we will use `Automatic Seeding`, so
    there is no need to restore the databases to the secondary `Replicas` in advance.
    The script in `Listing 5-4` will perform the Full backup of the databases.


    **Tip**

    For `Automatic Seeding` to work, the `Availability Group` must be granted the
    `CREATE ANY DATABASE` permission on the secondary servers.


    ```

    --Back Up Sales Database

    BACKUP DATABASE Sales TO DISK = N''C:\\Backups\\Sales.bak'' WITH NAME = N''Sales-Full
    Database Backup'';

    GO

    --Back Up Customers Database

    BACKUP DATABASE Customers TO DISK = N''C:\\Backups\\Customers.bak'' WITH NAME
    = N''Customers-Full Database Backup'';

    GO

    ```

    `Listing 5-4`

    Backing Up and Restoring the Database


    If we had not already created an `availability group`, then our next job would
    be to create a `TCP` endpoint so the instances could communicate. We would then
    need to create a login for the service account on each instance and grant it the
    connect permissions on the endpoints. Because we can only ever have one database
    mirroring endpoint per instance, however, we are not required to create a new
    one, and obviously we have no reason to grant the service account additional privileges.
    Therefore, we continue by creating the `availability group`. To do this, we drill
    through `AlwaysOn High Availability` in `Object Explorer` and select `New Availability
    Group` from the context menu of `availability groups`.


    This causes the `General tab` of the `New Availability Group dialog box` to display,
    as illustrated in `Figure 5-9`. On this screen, we type the name of the `availability
    group` in the first field. Then, we click the Add button under the `Availability
    Databases` window before we type the name of the database that we wish to add
    to the group. We then need to click the Add button under the `Availability Replicas`
    window before we type the `server\\instance name` of the secondary replica in
    the new row. We have set `Required Synchronized Secondaries to Commit` to `1`,
    however. This setting, which was introduced in `SQL Server 2017`, guarantees that
    the specified number of secondary replicas writes the transaction data to log
    before the primary replica commits each transaction. In our scenario, where we
    only have a single synchronous secondary, that in the event of a failure on the
    `Primary Replica`, failover will happen automatically, but the `Secondary Replica`
    will not allow user transactions to be written to the database, until the original
    `Primary Replica` comes back online. This absolutely guarantees that there can
    be no data loss in any circumstances. If we had left this setting as `0` (as we
    did in the first example in this chapter), then in the event that the `Primary
    Replica` failed and users wrote transactions to the `Secondary Replica`, before
    this `Replica` also failed, then data loss could occur, as the other `Replicas`
    are configured in `asynchronous commit` mode.


    `Figure 5-9 ¶ The New Availability Group Dialog Box`


    Now we can begin to set the replica properties. We discussed the `Role`, `Availability
    Mode`, `Failover Mode`, `Readable Secondary`, and `Endpoint URL` properties when
    we created the `HR` `availability group`. The `Connection in Primary Role` property
    defines what connections can be made to the replica if the replica is in the primary
    role. You can configure this as either `Allow All Connections` or `Allow Read/Write
    connections`. When `Read/Write` is specified, applications using the `Application
    Intent = Read only` parameter in their connection string will not be able to connect
    to the replica.


    The `Session Timeout` property sets how long the replicas can go without receiving
    a ping from one another before they enter the `DISCONNECTED` state and the session
    ends. Although it is possible to set this value to as low as `5` seconds, it is
    usually a good idea to keep the setting at `60` seconds; otherwise, you run the
    risk of a false-positive response, resulting in unnecessary failover. If a replica
    times out, it needs to be resynchronized, since transactions on the primary will
    no longer wait for the secondary, even if the secondary is running in `Synchronous
    Commit` mode.


    On the `Backup Preferences tab` of the dialog box, we define the preferred replica
    to use for automated backup jobs, as shown in `Figure 5-10`. Just like when using
    the wizard, we can specify `Primary`, or we can choose between enforcing and preferring
    backups to occur on a secondary replica. We can also configure a weight, between
    `0` and `100` for each replica, and use the `Exclude Replica` check box to avoid
    backups being taken on a specific node.


    `Figure 5-10 ¶ The Backup Preferences Tab`

    '
  trans: '

    如果您选择 `Automatic Seeding` 选项，则会在每个 `Replica` 上最初创建空数据库。然后数据会使用 `VDI` (`Virtual
    Device Interface`) 通过日志流传输进行播种。此选项比使用备份初始化慢，但可避免在共享之间传输大型备份文件。


    **Tip**

    如果您的 `availability group` 将包含许多数据库，则最好自行执行备份/还原。这是因为内置实用程序将按顺序执行操作，因此可能需要很长时间才能完成。


    在 `Validation page` 上，会检查可能导致设置失败的规则。如果任何结果返回为 `Failed`，则需要在继续尝试之前先解决它们。


    **Tip**

    在验证过程中，当您使用命名实例时，会发现一个常见的陷阱。`availability groups` 的要求是数据库必须位于所有副本上的同一文件路径中。然而，`SQL
    Server` 数据文件的默认文件位置包含实例的名称。对于默认实例而言，这无关紧要，因为文件路径中的实例名称始终为 `MSSQLSERVER`。对于命名实例，请确保数据库文件存储在所有服务器上都存在的文件路径中。


    完成验证测试并转到 `Summary page` 后，我们会看到在设置期间要执行的任务列表。


    随着设置的进行，每个配置任务的结果会显示在 `Results page` 上。如果此页面出现任何错误，请务必调查它们，但这并不一定意味着整个 `availability
    group` 需要重新配置。例如，如果由于 `VCO` 未在 `AD` 中呈现而导致 `availability group listener` 的创建失败，则可以重新创建侦听器，而无需重新创建整个
    `availability group`。


    作为使用 `New Availability Group wizard` 的替代方案，您可以使用 `New Availability Group dialog
    box`，然后使用 `Add Listener dialog box` 来执行 `availability group` 的配置。创建 `availability
    group` 的这种方法将在下一节中进行探讨。


    ## 使用新建可用性组对话框


    现在我们已成功创建了第一个 `availability group`，让我们为 `Sales` 创建第二个 `availability group`。此 `availability
    group` 将包含 `Sales` 和 `Customer` 数据库。这次，我们使用 `New Availability Group` 和 `Add Listener`
    对话框。我们通过备份这两个数据库开始此过程。就像创建 `HR` `availability group` 时一样，在执行备份之前数据库不可选择。然而，与使用向导时不同，我们无法使
    `SQL Server` 使用备份/还原选项执行初始数据库同步。因此，我们必须将数据库备份到先前演示中创建的共享中，然后将备份以及事务日志备份还原到辅助实例，或者使用
    `Automatic Seeding`。在本示例中，我们将使用 `Automatic Seeding`，因此无需预先将数据库还原到辅助 `Replicas`。`Listing
    5-4` 中的脚本将执行数据库的完整备份。


    **Tip**

    要使 `Automatic Seeding` 正常工作，必须在辅助服务器上授予 `Availability Group` `CREATE ANY DATABASE`
    权限。


    ```

    --Back Up Sales Database

    BACKUP DATABASE Sales TO DISK = N''C:\\Backups\\Sales.bak'' WITH NAME = N''Sales-Full
    Database Backup'';

    GO

    --Back Up Customers Database

    BACKUP DATABASE Customers TO DISK = N''C:\\Backups\\Customers.bak'' WITH NAME
    = N''Customers-Full Database Backup'';

    GO

    ```

    `Listing 5-4`

    备份和还原数据库


    如果我们尚未创建 `availability group`，那么下一步工作将是创建 `TCP` 端点，以便实例可以通信。然后我们需要在每个实例上为服务帐户创建登录名并授予其在端点上的连接权限。然而，由于每个实例只能有一个数据库镜像端点，因此我们无需创建新的端点，并且显然也没有理由授予服务帐户额外的权限。因此，我们继续创建
    `availability group`。为此，我们在 `Object Explorer` 中通过 `AlwaysOn High Availability`
    钻取，然后从 `availability groups` 的上下文菜单中选择 `New Availability Group`。


    这将导致 `New Availability Group dialog box` 的 `General tab` 显示，如 `Figure 5-9` 所示。在此屏幕上，我们在第一个字段中输入
    `availability group` 的名称。然后，我们在 `Availability Databases` 窗口下单击 Add 按钮，然后输入我们希望添加到组的数据库名称。然后我们需要在
    `Availability Replicas` 窗口下单击 Add 按钮，然后在新行中输入辅助副本的 `server\\instance name`。然而，我们已将
    `Required Synchronized Secondaries to Commit` 设置为 `1`。此设置是在 `SQL Server 2017`
    中引入的，保证在主副本提交每个事务之前，指定数量的辅助副本会将事务数据写入日志。在我们的场景中，我们只有一个同步辅助副本，因此在 `Primary Replica`
    发生故障时，故障转移将自动发生，但 `Secondary Replica` 不会在原始 `Primary Replica` 重新上线之前允许将用户事务写入数据库。这绝对保证在任何情况下都不会发生数据丢失。如果我们将此设置保留为
    `0`（正如本章第一个示例中所做的那样），那么在 `Primary Replica` 失败且用户在该 `Replica` 也失败之前将事务写入 `Secondary
    Replica` 的情况下，就可能发生数据丢失，因为其他 `Replicas` 配置为 `asynchronous commit` 模式。


    `Figure 5-9 ¶ The New Availability Group Dialog Box`


    现在我们可以开始设置副本属性。我们在创建 `HR` `availability group` 时讨论了 `Role`、`Availability Mode`、`Failover
    Mode`、`Readable Secondary` 和 `Endpoint URL` 属性。`Connection in Primary Role` 属性定义了如果副本处于主角色时可以建立到该副本的连接。您可以将其配置为
    `Allow All Connections` 或 `Allow Read/Write connections`。当指定 `Read/Write` 时，使用连接字符串中的
    `Application Intent = Read only` 参数的应用程序将无法连接到副本。


    `Session Timeout` 属性设置副本在进入 `DISCONNECTED` 状态并会话结束之前可以多久不接收彼此的 ping。虽然可以将此值设置为低至
    `5` 秒，但通常最好将设置保持在 `60` 秒；否则，您可能会遇到误报，导致不必要的故障转移。如果副本超时，则需要重新同步，因为主服务器上的事务将不再等待辅助服务器，即使辅助服务器以
    `Synchronous Commit` 模式运行也是如此。


    在对话框的 `Backup Preferences tab` 上，我们定义用于自动备份作业的首选副本，如 `Figure 5-10` 所示。就像使用向导时一样，我们可以指定
    `Primary`，也可以选择强制或偏好在辅助副本上执行备份。我们还可以为每个副本配置 `0` 到 `100` 之间的权重，并使用 `Exclude Replica`
    复选框避免在特定节点上执行备份。


    `Figure 5-10 ¶ The Backup Preferences Tab`

    '

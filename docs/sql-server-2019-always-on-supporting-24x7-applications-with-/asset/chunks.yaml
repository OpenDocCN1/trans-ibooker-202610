- raw: "The script in Listing [8-7](#394392_3_En_8_Chapter.xhtml#PC7) will force failover\
    \ for the Distributed Availability Group discussed in Chapter [6](#394392_3_En_6_Chapter.xhtml).\
    \ \\--Set the secondary Availability Group to synchronous commit mode ALTER AVAILABILITY\
    \ GROUP DistributedAG MODIFY AVAILABILITY GROUP ON 'HR' WITH    (     LISTENER\\\
    _URL = 'tcp://HRListener.alwayson.com:1433',     AVAILABILITY\\_MODE = ASYNCHRONOUS\\\
    _COMMIT,     FAILOVER\\_MODE = MANUAL,     SEEDING\\_MODE = MANUAL     ), 'Linux\\\
    _AOAG' WITH   (   LISTENER\\_URL = 'tcp://LinuxListener:5022',   AVAILABILITY\\\
    _MODE = SYNCHRONOUS\\_COMMIT,   FAILOVER\\_MODE = MANUAL,   SEEDING\\_MODE = MANUAL\
    \   ); \\--Wait until the Availability Groups are synchronized   WHILE (SELECT\
    \ COUNT(DISTINCT synchronization\\_state\\_desc) FROM (       SELECT             ag.name\
    \       , drs.database\\_id       , drs.group\\_id       , drs.replica\\_id       ,\
    \ drs.synchronization\\_state\\_desc       , drs.end\\_of\\_log\\_lsn       FROM\
    \ sys.dm\\_hadr\\_database\\_replica\\_states drs       INNER JOIN sys.availability\\\
    _groups ag             ON drs.group\\_id = ag.group\\_id       WHERE ag.name =\
    \ 'HR'             AND synchronization\\_state\\_desc = 'synchronized'       )\
    \ a ) > 1 BEGIN       WAITFOR DELAY'00:00:05' ; END \\--Assign the primary Availability\
    \ Group, the secondary role ALTER AVAILABILITY GROUP DistributedAG SET (ROLE =\
    \ SECONDARY) ; \\--Force the failover ALTER AVAILABILITY GROUP DistributedAG FORCE\\\
    _FAILOVER\\_ALLOW\\_DATA\\_LOSS ; Listing 8-7 \n\nFail Over a Distributed Availability\
    \ Group\n\n### Synchronizing Uncontained Objects\n\nRegardless of the method you\
    \ use to fail over, assuming that all of the databases within the availability\
    \ group are not contained, then you need to ensure that instance-level objects\
    \ are synchronized. The most straightforward way to keep your instance-level objects\
    \ synchronized is by implementing an SSIS package, which is scheduled to run on\
    \ a periodic basis.\n\nWhether you choose to schedule a SSIS package to execute\
    \ or you choose a different approach, such as a SQL Server Agent job that scripts\
    \ and re-creates the objects on the secondary servers, these are the objects that\
    \ you should consider synchronizing: \n\n*   Logins\n\n*   Credentials\n\n*  \
    \ SQL Server Agent jobs\n\n*   Custom error messages\n\n*   Linked servers\n\n\
    *   Server-level event notifications\n\n*   Stored procedures in Master\n\n* \
    \  Server-level triggers\n\n*   Encryption keys and certificates\n\n### Adding\
    \ Multiple Listeners\n\nUsually, each availability group has a single Availability\
    \ Group Listener, but there are some rare instances in which you may need to create\
    \ multiple listeners for the same availability group. One scenario in which this\
    \ may be required is if you have legacy applications with hard-coded connection\
    \ strings. Here, you can create an extra listener with a client access point that\
    \ matches the name of the hard-coded connection string. \n\nAs mentioned earlier\
    \ in this chapter, it is not possible to create a second Availability Group Listener\
    \ through SQL Server Management Studio, T-SQL, or even PowerShell. Instead, we\
    \ must use Failover Cluster Manager. Here, we create a new Client Access Point\
    \ resource within our HR role. To do this, we select Add Resource from the context\
    \ menu of the HR role and then select Client Access Point. This causes the New\
    \ Resource Wizard to be invoked. The Client Access Point page of the wizard is\
    \ illustrated in Figure [8-6](#394392_3_En_8_Chapter.xhtml#Fig6). You can see\
    \ that we have entered the DNS name for the client access point and specified\
    \ an IP address from each subnet.  ![Figure 8-6 ¶ The Client Access Point Page](images/394392_3_En_8_Chapter/394392_3_En_8_Fig6_HTML.jpg)\n\
    \nFigure 8-6 ¶ The Client Access Point Page\n\nOn the Confirmation page, we are\
    \ shown a summary of the configuration that will be performed. On the Configure\
    \ Client Access Point page, we see a progress indicator, before we are finally\
    \ shown a completion summary on the Summary page, which is illustrated in Figure\
    \ [8-7](#394392_3_En_8_Chapter.xhtml#Fig7).  ![Figure 8-7 ¶ The Confirmation Page](images/394392_3_En_8_Chapter/394392_3_En_8_Fig7_HTML.jpg)\n\
    \nFigure 8-7 ¶ The Confirmation Page\n\nNow, we need to configure the Availability\
    \ Group resource to be dependent upon the new client access point. To do this,\
    \ we select Properties from the context menu of the HR resource and then navigate\
    \ to the Dependencies tab. Here, we add the new client access point as a dependency\
    \ and configure an OR constraint between the two listeners, as illustrated in\
    \ Figure [8-8](#394392_3_En_8_Chapter.xhtml#Fig8). Once we apply this change,\
    \ clients are able to connect using either of the two listener names.  ![Figure\
    \ 8-8 ¶ The Dependencies Tab](images/394392_3_En_8_Chapter/394392_3_En_8_Fig8_HTML.jpg)\n\
    \nFigure 8-8 ¶ The Dependencies Tab\n\n### Other Administrative Considerations\n\
    \nWhen databases are made highly available with AlwaysOn Availability Groups,\
    \ several limitations are imposed. One of the most restrictive of these is that\
    \ databases cannot be placed in single\\_user mode or be made read only. This\
    \ can have an impact when you need to safe-state your application for maintenance.\
    \ This is why in the “Failover” section of this chapter, we disabled the logins\
    \ that have users mapped to the databases. If you must place your database in\
    \ single-user mode, then you must first remove it from the availability group.\
    \ \n\nA database can be removed from an availability group by running the command\
    \ in Listing [8-8](#394392_3_En_8_Chapter.xhtml#PC8). This command removes the\
    \ Customers database from the Sales availability group. ALTER DATABASE Customers\
    \ SET HADR OFF ; Listing 8-8 \n\nRemoving a Database from an Availability Group\n\
    \nThere may also be occasions in which you want a database to remain in an availability\
    \ group, but you wish to suspend data movement to other replicas. This is usually\
    \ because the availability group is in Synchronous Commit mode and you have a\
    \ period of high utilization, where you need a performance improvement. You can\
    \ suspend the data movement to a database by using the command in Listing [8-9](#394392_3_En_8_Chapter.xhtml#PC9),\
    \ which suspends data movement for the Sales database and then resumes it.\n\n\
    Caution \n\nIf you suspend data movement, the transaction log on the primary replica\
    \ continues to grow, and you are not able to truncate it until data movement resumes\
    \ and the databases are synchronized.\n\nALTER DATABASE Sales SET HADR SUSPEND\
    \ ; GO ALTER DATABASE Sales SET HADR RESUME ; GO Listing 8-9 \n\nSuspending Data\
    \ Movement\n\nAnother important consideration is the placement of database and\
    \ log files. These files must be in the same location on each replica. This means\
    \ that if you use named instances, it is a hard technical requirement that you\
    \ change the default file locations for data and logs, because the default location\
    \ includes the name of the instance. This is assuming, of course, that you do\
    \ not use the same instance name on each node, which would defy many of the benefits\
    \ of having a named instance.\n\n## Summary\n\nFailover to a synchronous replica\
    \ in the event of a failure of the primary replica is automatic. There are instances,\
    \ however, in which you will also need to fail over manually. This could be because\
    \ of a disaster that requires failover to the DR site, or it could be for proactive\
    \ maintenance. Although it is possible to fail over to an asynchronous replica\
    \ with the possibility of data loss, it is good practice to place the databases\
    \ in a safe-state first. Because you cannot place a database in read-only or single\\\
    _user mode, if it is participating in an availability group, safe-stating usually\
    \ consists of disabling the logins and then switching to Synchronous Commit mode\
    \ before failover."
  fmt: "\nThe script in Listing [8-7](#394392_3_En_8_Chapter.xhtml#PC7) will force\
    \ failover for the Distributed Availability Group discussed in Chapter [6](#394392_3_En_6_Chapter.xhtml).\n\
    \n```sql\n--Set the secondary Availability Group to synchronous commit mode\n\
    ALTER AVAILABILITY GROUP DistributedAG MODIFY AVAILABILITY GROUP ON 'HR' WITH\n\
    (\n    LISTENER_URL = 'tcp://HRListener.alwayson.com:1433',\n    AVAILABILITY_MODE\
    \ = ASYNCHRONOUS_COMMIT,\n    FAILOVER_MODE = MANUAL,\n    SEEDING_MODE = MANUAL\n\
    ),\n'Linux_AOAG' WITH\n(\n    LISTENER_URL = 'tcp://LinuxListener:5022',\n   \
    \ AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n    FAILOVER_MODE = MANUAL,\n    SEEDING_MODE\
    \ = MANUAL\n);\n--Wait until the Availability Groups are synchronized\nWHILE (SELECT\
    \ COUNT(DISTINCT synchronization_state_desc) FROM (\n    SELECT\n        ag.name\n\
    \        , drs.database_id\n        , drs.group_id\n        , drs.replica_id\n\
    \        , drs.synchronization_state_desc\n        , drs.end_of_log_lsn\n    FROM\
    \ sys.dm_hadr_database_replica_states drs\n    INNER JOIN sys.availability_groups\
    \ ag\n        ON drs.group_id = ag.group_id\n    WHERE ag.name = 'HR'\n      \
    \  AND synchronization_state_desc = 'synchronized'\n) a ) > 1\nBEGIN\n    WAITFOR\
    \ DELAY '00:00:05';\nEND\n--Assign the primary Availability Group, the secondary\
    \ role\nALTER AVAILABILITY GROUP DistributedAG SET (ROLE = SECONDARY);\n--Force\
    \ the failover\nALTER AVAILABILITY GROUP DistributedAG FORCE_FAILOVER_ALLOW_DATA_LOSS;\n\
    ```\nListing 8-7\n\n## Fail Over a Distributed Availability Group\n\n### Synchronizing\
    \ Uncontained Objects\n\nRegardless of the method you use to fail over, assuming\
    \ that all of the databases within the availability group are not contained, then\
    \ you need to ensure that instance-level objects are synchronized. The most straightforward\
    \ way to keep your instance-level objects synchronized is by implementing an `SSIS`\
    \ package, which is scheduled to run on a periodic basis.\n\nWhether you choose\
    \ to schedule a `SSIS` package to execute or you choose a different approach,\
    \ such as a `SQL Server Agent` job that scripts and re-creates the objects on\
    \ the secondary servers, these are the objects that you should consider synchronizing:\n\
    * Logins\n* Credentials\n* SQL Server Agent jobs\n* Custom error messages\n* Linked\
    \ servers\n* Server-level event notifications\n* Stored procedures in Master\n\
    * Server-level triggers\n* Encryption keys and certificates\n\n### Adding Multiple\
    \ Listeners\n\nUsually, each availability group has a single Availability Group\
    \ Listener, but there are some rare instances in which you may need to create\
    \ multiple listeners for the same availability group. One scenario in which this\
    \ may be required is if you have legacy applications with hard-coded connection\
    \ strings. Here, you can create an extra listener with a client access point that\
    \ matches the name of the hard-coded connection string.\n\nAs mentioned earlier\
    \ in this chapter, it is not possible to create a second Availability Group Listener\
    \ through SQL Server Management Studio, T-SQL, or even PowerShell. Instead, we\
    \ must use `Failover Cluster Manager`. Here, we create a new `Client Access Point`\
    \ resource within our `HR` role. To do this, we select `Add Resource` from the\
    \ context menu of the `HR` role and then select `Client Access Point`. This causes\
    \ the `New Resource Wizard` to be invoked. The Client Access Point page of the\
    \ wizard is illustrated in Figure [8-6](#394392_3_En_8_Chapter.xhtml#Fig6). You\
    \ can see that we have entered the DNS name for the client access point and specified\
    \ an IP address from each subnet.\n![Figure 8-6 ¶ The Client Access Point Page](images/394392_3_En_8_Chapter/394392_3_En_8_Fig6_HTML.jpg)\n\
    Figure 8-6 ¶ The Client Access Point Page\n\nOn the Confirmation page, we are\
    \ shown a summary of the configuration that will be performed. On the Configure\
    \ Client Access Point page, we see a progress indicator, before we are finally\
    \ shown a completion summary on the Summary page, which is illustrated in Figure\
    \ [8-7](#394392_3_En_8_Chapter.xhtml#Fig7).\n![Figure 8-7 ¶ The Confirmation Page](images/394392_3_En_8_Chapter/394392_3_En_8_Fig7_HTML.jpg)\n\
    Figure 8-7 ¶ The Confirmation Page\n\nNow, we need to configure the Availability\
    \ Group resource to be dependent upon the new client access point. To do this,\
    \ we select `Properties` from the context menu of the `HR` resource and then navigate\
    \ to the `Dependencies` tab. Here, we add the new client access point as a dependency\
    \ and configure an `OR` constraint between the two listeners, as illustrated in\
    \ Figure [8-8](#394392_3_En_8_Chapter.xhtml#Fig8). Once we apply this change,\
    \ clients are able to connect using either of the two listener names.\n![Figure\
    \ 8-8 ¶ The Dependencies Tab](images/394392_3_En_8_Chapter/394392_3_En_8_Fig8_HTML.jpg)\n\
    Figure 8-8 ¶ The Dependencies Tab\n\n### Other Administrative Considerations\n\
    \nWhen databases are made highly available with AlwaysOn Availability Groups,\
    \ several limitations are imposed. One of the most restrictive of these is that\
    \ databases cannot be placed in `single_user` mode or be made `read only`. This\
    \ can have an impact when you need to safe-state your application for maintenance.\
    \ This is why in the “Failover” section of this chapter, we disabled the logins\
    \ that have users mapped to the databases. If you must place your database in\
    \ `single-user` mode, then you must first remove it from the availability group.\n\
    \nA database can be removed from an availability group by running the command\
    \ in Listing [8-8](#394392_3_En_8_Chapter.xhtml#PC8). This command removes the\
    \ `Customers` database from the `Sales` availability group.\n```sql\nALTER DATABASE\
    \ Customers SET HADR OFF;\n```\nListing 8-8\nRemoving a Database from an Availability\
    \ Group\n\nThere may also be occasions in which you want a database to remain\
    \ in an availability group, but you wish to suspend data movement to other replicas.\
    \ This is usually because the availability group is in `Synchronous Commit` mode\
    \ and you have a period of high utilization, where you need a performance improvement.\
    \ You can suspend the data movement to a database by using the command in Listing\
    \ [8-9](#394392_3_En_8_Chapter.xhtml#PC9), which suspends data movement for the\
    \ `Sales` database and then resumes it.\n\nCaution\nIf you suspend data movement,\
    \ the transaction log on the primary replica continues to grow, and you are not\
    \ able to truncate it until data movement resumes and the databases are synchronized.\n\
    ```sql\nALTER DATABASE Sales SET HADR SUSPEND;\nGO\nALTER DATABASE Sales SET HADR\
    \ RESUME;\nGO\n```\nListing 8-9\nSuspending Data Movement\n\nAnother important\
    \ consideration is the placement of database and log files. These files must be\
    \ in the same location on each replica. This means that if you use named instances,\
    \ it is a hard technical requirement that you change the default file locations\
    \ for data and logs, because the default location includes the name of the instance.\
    \ This is assuming, of course, that you do not use the same instance name on each\
    \ node, which would defy many of the benefits of having a named instance.\n\n\
    ## Summary\n\nFailover to a synchronous replica in the event of a failure of the\
    \ primary replica is automatic. There are instances, however, in which you will\
    \ also need to fail over manually. This could be because of a disaster that requires\
    \ failover to the DR site, or it could be for proactive maintenance. Although\
    \ it is possible to fail over to an asynchronous replica with the possibility\
    \ of data loss, it is good practice to place the databases in a safe-state first.\
    \ Because you cannot place a database in `read-only` or `single_user` mode, if\
    \ it is participating in an availability group, safe-stating usually consists\
    \ of disabling the logins and then switching to `Synchronous Commit` mode before\
    \ failover.\n"
  trans: "\n列表 8-7 中的脚本将强制对第 6 章中讨论的分布式可用性组进行故障转移。\n\n```sql\n--Set the secondary\
    \ Availability Group to synchronous commit mode\nALTER AVAILABILITY GROUP DistributedAG\
    \ MODIFY AVAILABILITY GROUP ON 'HR' WITH\n(\n    LISTENER_URL = 'tcp://HRListener.alwayson.com:1433',\n\
    \    AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n    FAILOVER_MODE = MANUAL,\n \
    \   SEEDING_MODE = MANUAL\n),\n'Linux_AOAG' WITH\n(\n    LISTENER_URL = 'tcp://LinuxListener:5022',\n\
    \    AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n    FAILOVER_MODE = MANUAL,\n  \
    \  SEEDING_MODE = MANUAL\n);\n--Wait until the Availability Groups are synchronized\n\
    WHILE (SELECT COUNT(DISTINCT synchronization_state_desc) FROM (\n    SELECT\n\
    \        ag.name\n        , drs.database_id\n        , drs.group_id\n        ,\
    \ drs.replica_id\n        , drs.synchronization_state_desc\n        , drs.end_of_log_lsn\n\
    \    FROM sys.dm_hadr_database_replica_states drs\n    INNER JOIN sys.availability_groups\
    \ ag\n        ON drs.group_id = ag.group_id\n    WHERE ag.name = 'HR'\n      \
    \  AND synchronization_state_desc = 'synchronized'\n) a ) > 1\nBEGIN\n    WAITFOR\
    \ DELAY '00:00:05';\nEND\n--Assign the primary Availability Group, the secondary\
    \ role\nALTER AVAILABILITY GROUP DistributedAG SET (ROLE = SECONDARY);\n--Force\
    \ the failover\nALTER AVAILABILITY GROUP DistributedAG FORCE_FAILOVER_ALLOW_DATA_LOSS;\n\
    ```\n列表 8-7\n\n## 故障转移分布式可用性组\n\n### 同步非包含对象\n\n无论您使用何种方法进行故障转移，只要可用性组中的所有数据库都不是包含数据库，则需要确保实例级对象已同步。保持实例级对象同步的最简单方法是实现一个\
    \ `SSIS` 包，并按定期计划运行。\n\n无论您选择按计划执行 `SSIS` 包，还是选择其他方法，例如在辅助服务器上编写脚本并重新创建对象的 `SQL\
    \ Server Agent` 作业，以下是您应考虑同步的对象：\n* 登录\n* 凭据\n* SQL Server Agent 作业\n* 自定义错误消息\n\
    * 链接服务器\n* 服务器级事件通知\n* master 中的存储过程\n* 服务器级触发器\n* 加密密钥和证书\n\n### 添加多个侦听器\n\n\
    通常，每个可用性组只有一个可用性组侦听器，但也有一些罕见的情况，您可能需要为同一个可用性组创建多个侦听器。如果您有使用硬编码连接字符串的旧版应用程序，则可能需要这样做。在这种情况下，您可以创建一个额外的侦听器，其客户端访问点与硬编码连接字符串的名称匹配。\n\
    \n如本章前面所述，不可能通过 SQL Server Management Studio、T-SQL 甚至 PowerShell 创建第二个可用性组侦听器。相反，我们必须使用\
    \ `Failover Cluster Manager`。在此，我们在 `HR` 角色内创建一个新的 `Client Access Point` 资源。为此，我们从\
    \ `HR` 角色的上下文菜单中选择 `Add Resource`，然后选择 `Client Access Point`。这将调用 `New Resource\
    \ Wizard`。向导的客户端访问点页面在图 8-6 中说明。您可以看到我们已输入客户端访问点的 DNS 名称，并为每个子网指定了 IP 地址。\n![图\
    \ 8-6 ¶ 客户端访问点页面](img/394392_3_En_8_Fig6_HTML.jpg)\n图 8-6 ¶ 客户端访问点页面\n\n在“确认”页面上，我们会看到将要执行的配置摘要。在“配置客户端访问点”页面上，我们会看到进度指示器，然后在“摘要”页面上最终会看到完成摘要，如图\
    \ 8-7 所示。\n![图 8-7 ¶ 确认页面](img/394392_3_En_8_Fig7_HTML.jpg)\n图 8-7 ¶ 确认页面\n\n\
    现在，我们需要将可用性组资源配置为依赖于新的客户端访问点。为此，我们从 `HR` 资源的上下文菜单中选择 `Properties`，然后导航到 `Dependencies`\
    \ 选项卡。在此处，我们将新的客户端访问点添加为依赖项，并配置两个侦听器之间的 `OR` 约束，如图 8-8 所示。应用此更改后，客户端可以使用两个侦听器名称中的任何一个进行连接。\n\
    ![图 8-8 ¶ 依赖项选项卡](img/394392_3_En_8_Fig8_HTML.jpg)\n图 8-8 ¶ 依赖项选项卡\n\n### 其他管理注意事项\n\
    \n当使用 AlwaysOn 可用性组使数据库高度可用时，会施加若干限制。其中最严格的一项限制是数据库不能置于 `single_user` 模式或设为 `read\
    \ only`。这会在您需要为维护而将应用程序置于安全状态时产生影响。这就是为什么在本章“故障转移”部分中，我们禁用了已映射到数据库用户的登录。如果您必须将数据库置于\
    \ `single-user` 模式，则必须先将其从可用性组中移除。\n\n可以通过运行列表 8-8 中的命令将数据库从可用性组中移除。此命令将 `Customers`\
    \ 数据库从 `Sales` 可用性组中移除。\n```sql\nALTER DATABASE Customers SET HADR OFF;\n```\n\
    列表 8-8\n从可用性组中移除数据库\n\n也有可能您希望数据库保留在可用性组中，但希望暂停向其他副本的数据移动。这通常是因为可用性组处于 `Synchronous\
    \ Commit` 模式，并且您有一个高利用率的时期，需要性能提升。您可以使用列表 8-9 中的命令暂停数据库的数据移动，该命令会暂停 `Sales` 数据库的数据移动然后恢复。\n\
    \n注意\n如果您暂停数据移动，主副本上的事务日志会继续增长，直到数据移动恢复并且数据库同步后，您将无法截断它。\n```sql\nALTER DATABASE\
    \ Sales SET HADR SUSPEND;\nGO\nALTER DATABASE Sales SET HADR RESUME;\nGO\n```\n\
    列表 8-9\n暂停数据移动\n\n另一个重要考虑因素是数据库和日志文件的放置位置。这些文件必须在每个副本上位于相同的位置。这意味着如果您使用命名实例，则必须更改数据和日志的默认文件位置，这是一个严格的技术要求，因为默认位置包含实例名称。当然，这假设您不会在每个节点上使用相同的实例名称，否则将违背使用命名实例的许多好处。\n\
    \n## 摘要\n\n主副本发生故障时，故障转移到同步副本是自动的。然而，也有需要手动故障转移的情况。这可能是因为需要故障转移到灾难恢复站点的灾难，也可能是为了主动维护。虽然可以故障转移到异步副本并可能导致数据丢失，但良好的做法是先将数据库置于安全状态。由于如果数据库参与可用性组，则无法将其置于\
    \ `read-only` 或 `single_user` 模式，因此安全状态通常包括禁用登录，然后在故障转移前切换到 `Synchronous Commit`\
    \ 模式。\n"

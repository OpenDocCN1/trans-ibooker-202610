- raw: "The first step in configuring AlwaysOn Availability Groups is enabling this\
    \ feature on the SQL Server service. To enable the feature from the GUI, we open\
    \ SQL Server Configuration Manager, drill through SQL Server Services, and select\
    \ Properties from the context menu of the SQL Server service. When we do this,\
    \ the service properties display and we navigate to the Always On Availability\
    \ Groups tab, shown in Figure [5-1](#394392_3_En_5_Chapter.xhtml#Fig1). ![Figure\
    \ 5-1 ¶ The Always On Availability Groups Tab](images/394392_3_En_5_Chapter/394392_3_En_5_Fig1_HTML.jpg)\n\
    \nFigure 5-1 ¶ The Always On Availability Groups Tab\n\nOn this tab, we check\
    \ the Enable AlwaysOn Availability Groups box and ensure that the cluster name\
    \ displayed in the Windows Failover Cluster Name box is correct. We then need\
    \ to restart the SQL Server service. Because AlwaysOn Availability Groups uses\
    \ stand-alone instances, which are installed locally on each cluster node, as\
    \ opposed to a failover clustered instance, which spans multiple nodes, we need\
    \ to repeat these steps for each stand-alone instance hosted on the cluster.\n\
    \nWe can also use PowerShell to enable AlwaysOn Availability Groups. To do this,\
    \ we use the PowerShell command in Listing [5-2](#394392_3_En_5_Chapter.xhtml#PC2).\
    \ The script assumes that CLUSTERNODE1 is the name of the server and that PROD\
    \ is the name of the SQL Server instance. Enable-SqlAlwaysOn -Path SQLSERVER:\\\
    \\SQL\\\\CLUSTERNODE1\\\\PROD Listing 5-2 \n\nEnabling AlwaysOn Availability Groups\n\
    \nThe next step is to take a full backup of all databases that will be part of\
    \ the availability group. We will not be able to add them to an Availability Group\
    \ until this has been done. In this chapter, we will be creating three separate\
    \ availability groups. In the first example, however, we will be creating an Availability\
    \ Group called HR, which will provide high availability for the HR database. Therefore,\
    \ we need to back up the HR database. We do this by running the script in Listing\
    \ [5-3](#394392_3_En_5_Chapter.xhtml#PC3). BACKUP DATABASE HR TO  DISK = N'C:\\\
    \\Backups\\\\HR.bak' WITH NAME = N'HR-Full Database Backup' ; GO Listing 5-3 \n\
    \nBacking Up the Databases\n\n## Using the New Availability Group Wizard\n\nWhen\
    \ the backups complete successfully, we invoke the New Availability Group wizard\
    \ by drilling through AlwaysOn High Availability in Object Explorer, within SSMS\
    \ and selecting the New Availability Group wizard from the context menu of the\
    \ Availability Groups folder. The Introduction page  of the wizard is displayed,\
    \ giving us an overview of the steps that we need to undertake.\n\nOn the Specify\
    \ Name page (see Figure [5-2](#394392_3_En_5_Chapter.xhtml#Fig2)), we are prompted\
    \ to enter a name for our availability group. We will also select Windows Server\
    \ Failover Cluster as the Cluster Type. Other options for cluster type are external,\
    \ which supports Pacemaker on Linux, and None, which is used for Clusterless Availability\
    \ Groups. The Database Level Health Detection option will cause the Availability\
    \ Group to fail over, should any database within the group go offline. The Per\
    \ Database DTC Support option will specify if cross-database transactions are\
    \ supported, using MSDTC (Microsoft Distributed Transaction Coordinator). A full\
    \ discussion of configuring DTC is beyond the scope of this book, but further\
    \ details can be found at [https://docs.microsoft.com/en-us/previous-versions/windows/desktop/ms681291(v=vs.85)](https://docs.microsoft.com/en-us/previous-versions/windows/desktop/ms681291%2528v%253Dvs.85%2529).\
    \ ![Figure 5-2 ¶ The Specify Name Page](images/394392_3_En_5_Chapter/394392_3_En_5_Fig2_HTML.jpg)\n\
    \nFigure 5-2 ¶ The Specify Name Page\n\nOn the Select Databases page, we are prompted\
    \ to select the database(s) that we wish to participate in the availability group,\
    \ as illustrated in Figure [5-3](#394392_3_En_5_Chapter.xhtml#Fig3). On this screen,\
    \ notice that we cannot select the Sales, Customers, or Accounts databases, because\
    \ we have not yet taken a full backup of these databases. ![Figure 5-3 ¶ The Select\
    \ Database Page](images/394392_3_En_5_Chapter/394392_3_En_5_Fig3_HTML.jpg)\n\n\
    Figure 5-3 ¶ The Select Database Page\n\nThe Specify Replicas page consists of\
    \ five tabs. We use the first tab, Replicas, to add the secondary replicas to\
    \ the topology. Checking the Synchronous Commit option causes data to be committed\
    \ on the secondary replica before it is committed on the primary replica. (This\
    \ is also referred to as *hardening the log* on the secondary before the primary.)\
    \ This means that, in the event of a failover, data loss is not possible, meaning\
    \ that we can meet an SLA (service-level agreement) with an RPO (recovery point\
    \ objective) of zero. It also means that there will be a performance degradation,\
    \ however. If we choose Asynchronous Commit, then the replica operates in Asynchronous\
    \ Commit mode. This means that data is committed on the primary replica before\
    \ being committed on the secondary replica. This stops us from suffering performance\
    \ degradation, but it also means that, in the event of failover, the RPO is nondeterministic.\n\
    \nWhen we check the Automatic Failover option, the Synchronous Commit option is\
    \ also selected automatically if we have not already selected it. This is because\
    \ automatic failover is only possible in Synchronous Commit mode. We can set the\
    \ Readable Secondary drop-down to No, Yes, or Read-intent. When we set it to No,\
    \ the database is not accessible on replicas that are in a secondary role. When\
    \ we set it to Read-intent, the Availability Group Listener can redirect read-only\
    \ workloads to this secondary replica, but only if the application has specified\
    \ Application Intent=Read-only in the connection string. Setting it to Yes enables\
    \ the listener to redirect read-only traffic, regardless of whether the Application\
    \ Intent parameter is present in the application’s connection string. Although\
    \ we can change the value of Readable Secondary through the GUI while at the same\
    \ time configuring a replica for automatic failover without error, this is simply\
    \ a quirk of the wizard. In fact, the replica is not accessible, since active\
    \ secondaries are not supported when configured for automatic failover. The Replicas\
    \ tab is illustrated in Figure [5-4](#394392_3_En_5_Chapter.xhtml#Fig4). To meet\
    \ our requirement of achieving high availability for the HR database, we have\
    \ configured the secondary server within the same site as a synchronous replica.\
    \ This means that the latency between data centers will not compound the performance\
    \ degradation, which is associated with synchronous commits. ![Figure 5-4 ¶ The\
    \ Replicas Tab](images/394392_3_En_5_Chapter/394392_3_En_5_Fig4_HTML.jpg)\n\n\
    Figure 5-4 ¶ The Replicas Tab\n\nOn the Endpoints tab of the Specify Replicas\
    \ page, illustrated in Figure [5-5](#394392_3_En_5_Chapter.xhtml#Fig5), we specify\
    \ the port number for each endpoint. The default port is 5022, but we can specify\
    \ a different port if we need to. On this tab, we also specify if data should\
    \ be encrypted when it is sent between the endpoints. It is usually a good idea\
    \ to check this option, and if we do, then AES (Advanced Encryption Standard)\
    \ is used as the encryption algorithm. ![Figure 5-5 ¶ The Endpoints Tab](images/394392_3_En_5_Chapter/394392_3_En_5_Fig5_HTML.jpg)\n\
    \nFigure 5-5 ¶ The Endpoints Tab\n\nOptionally, you can also change the name of\
    \ the endpoint that is created. Because only one database mirroring endpoint is\
    \ allowed per instance, however, and because the default name is fairly descriptive,\
    \ there is not always a reason to change it. Some DBAs choose to rename it to\
    \ include the name of the instance, since this can simplify the management of\
    \ multiple servers. This is a good idea if your enterprise has multiple availability\
    \ groups, split across multiple instances on the same cluster."

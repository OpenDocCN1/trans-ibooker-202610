- raw: "The first step in creating the Availability Group is to create the endpoint,\
    \ which the Availability Group will use for sending messages between the Replicas.\
    \ We also need to give the service account permissions to connect to the Endpoint.\
    \ This can be achieved with the script in Listing [7-6](#394392_3_En_7_Chapter.xhtml#PC6).\
    \ \\--Create the Endpoint CREATE ENDPOINT ClusterlessEndpoint     AS TCP (LISTENER\\\
    _PORT = 5022)     FOR DATA\\_MIRRORING (           ROLE = ALL,           ENCRYPTION\
    \ = REQUIRED ALGORITHM AES     ) ; GO \\--Start the Endpoint ALTER ENDPOINT ClusterlessEndpoint\
    \ STATE = STARTED ; GO \\--Grant Permissions to the Service Account GRANT CONNECT\
    \ ON ENDPOINT::ClusterlessEndpoint TO \\[ALWAYSON\\\\SQLServiceAccount\\]; GO\
    \ Listing 7-6 \n\nCreate the Endpoint\n\nWith the Endpoint in place, we can now\
    \ go ahead and create the Availability Group. As always, we have a choice of using\
    \ T-SQL, the New Availability Group wizard, or the New Availability Group dialog\
    \ box. In this instance, we will use T-SQL by running the script in Listing [7-7](#394392_3_En_7_Chapter.xhtml#PC7).\
    \ Note that the CLUSTER\\_TYPE option is set to NONE. USE master GO CREATE AVAILABILITY\
    \ GROUP Customers\\_Clusterless WITH (       AUTOMATED\\_BACKUP\\_PREFERENCE =\
    \ SECONDARY,       CLUSTER\\_TYPE = NONE ) FOR DATABASE Customers REPLICA ON 'PROD'\
    \ WITH (       ENDPOINT\\_URL = 'TCP://PROD.AlwaysOn.com:5022',       FAILOVER\\\
    _MODE = MANUAL,       AVAILABILITY\\_MODE = ASYNCHRONOUS\\_COMMIT,       SEEDING\\\
    _MODE = AUTOMATIC,       SECONDARY\\_ROLE(ALLOW\\_CONNECTIONS = ALL) ), 'READSCALE'\
    \ WITH (       ENDPOINT\\_URL = 'TCP://READSCALE.AlwaysOn.com:5022',       FAILOVER\\\
    _MODE = MANUAL,       AVAILABILITY\\_MODE = ASYNCHRONOUS\\_COMMIT,       SEEDING\\\
    _MODE = AUTOMATIC,       SECONDARY\\_ROLE(ALLOW\\_CONNECTIONS = ALL) ) ; GO Listing\
    \ 7-7 \n\nCreate the Availability Group\n\nFinally, we can join the secondary\
    \ Replica to the Availability Group by running the script in Listing [7-8](#394392_3_En_7_Chapter.xhtml#PC8),\
    \ against the secondary instance. ALTER AVAILABILITY GROUP Customers\\_Clusterless\
    \ JOIN WITH (CLUSTER\\_TYPE = NONE) ; GO ALTER AVAILABILITY GROUP Customers\\\
    _Clusterless GRANT CREATE ANY DATABASE ; GO Listing 7-8 \n\nJoin the Secondary\
    \ Replica to the Availability Group\n\nAnother use case for clusterless Availability\
    \ Groups is migrations. If you have a database that you need to migrate to a new\
    \ server, you can easily configure a clusterless Availability Group to support\
    \ a side-by-side migration.\n\nOnce the Availability Group is configured, users\
    \ can check their application with read-only operations against the new instance\
    \ while continuing to use their existing database. Once they are happy, the Availability\
    \ Group can be failed over and the old instance decommissioned.\n\n## Domain-Independent\
    \ Availability Groups\n\nOn the surface, domain-independent Clusters, also known\
    \ as Workgroup Clusters and Availability Groups, may seem a little odd. If a company\
    \ is large enough that it needs to run SQL Server Enterprise (or even Standard),\
    \ then it is surely large enough and very likely to have a domain and the ability\
    \ to create standard clusters. But if you think harder, there are many more use\
    \ cases where enterprises may benefit from domain-independent high availability\
    \ and disaster recovery. For example, imagine that you have a hybrid cloud environment.\
    \ Instead of stretching your domain into Azure, or AWS, your company has decided\
    \ to create a new domain in the cloud and form a trust relationship between the\
    \ two. You then decide that you would like to use Availability Groups to synchronize\
    \ a database between on-premise and the cloud, so that your databases supporting\
    \ your online sales application are in the cloud, for the lowest latency, but\
    \ you also want DR back to on-premise. Without domain-independent clusters or\
    \ Availability Groups, this would only be possible using clusterless Availability\
    \ Groups, meaning that you could not make use of the Listener.\n\nIn this section,\
    \ we will explore how to create a domain-independent cluster and Availability\
    \ Group. For networking simplicity, we will configure this between two servers\
    \ in a workgroup within our Site1 subnet. In this scenario, there will be no domain.\
    \ However, it is worthy of note that this method can also be used to create a\
    \ cluster (and Availability Group) between two separate domains, or between a\
    \ domain and a workgroup.\n\nWe will build the cluster and Availability Group\
    \ across two nodes, named ClusterNode1 and ClusterNode2, in the same workgroup\
    \ for the purpose of offloading read-only reporting. A default instance of SQL\
    \ Server is installed on each node.\n\n### Preparing for the Cluster\n\nIt is\
    \ a requirement that all nodes within the cluster need to add a common Primary\
    \ DNS Suffix. This can be achieved by navigating to Control Panel ➤ System and\
    \ Security ➤ System and selecting Change Settings in the Computer Name, Domain\
    \ and Workgroup Settings area of the screen, to invoke the System Properties dialog\
    \ box, where the Change button can be used to invoke the Computer Name/Domain\
    \ Changes dialog box. You can now use the More button to invoke the DNS Suffix\
    \ and NetBIOS Computer Name dialog box, shown in Figure [7-22](#394392_3_En_7_Chapter.xhtml#Fig22).\
    \ Here, we will enter our common DNS Suffix. ![Figure 7-22 ¶ DNS Suffix and NetBIOS\
    \ Computer Name](images/394392_3_En_7_Chapter/394392_3_En_7_Fig22_HTML.jpg)\n\n\
    Figure 7-22 ¶ DNS Suffix and NetBIOS Computer Name\n\nWe also need to ensure that\
    \ an account exists on all cluster nodes that has the same username and the same\
    \ password and has local administrator permissions. In our scenario, we will use\
    \ the built-in Administrator, but if we were to use any other account, then we\
    \ must also set the value of LocalAccountTokenFilterPolicy to 1 in the registry.\
    \ This can be achieved by using the PowerShell command in Listing [7-9](#394392_3_En_7_Chapter.xhtml#PC9).\
    \ New-ItemProperty -path HKLM:\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\
    \\Policies\\\\System -Name LocalAccountTokenFilterPolicy -Value 1 Listing 7-9\
    \ \n\nSet LocalAccountTokenFilterPolicy\n\n### Create the Cluster \n\nWe can now\
    \ create the cluster by using the script in Listing [7-10](#394392_3_En_7_Chapter.xhtml#PC10).\
    \ There are two interesting points to note here. Firstly, we are using the AdministrativeAccessPoint\
    \ parameter, with a configuration value of DNS. This will create the Cluster Name\
    \ Object but not attempt to create computer objects in Active Directory, which\
    \ of course is not supported in a domain-independent cluster.\n\nThe second interesting\
    \ point is that we have chosen to use a cluster disk as the witness. This is because\
    \ a file share witness is not supported in domain-independent clusters. New-Cluster\
    \ -Name AOAGWorkGroupCluster -Node ClusterNode1,ClusterNode2 -StaticAddress 10.0.0.52\
    \ -AdministrativeAccessPoint DNS Set-ClusterQuorum -DiskWitness \"Cluster Disk\
    \ 1\" Listing 7-10 \n\nCreate the Cluster\n\n### Preparing for the Availability\
    \ Group\n\nThe first step in preparing for the Availability Group is to enable\
    \ Availability Groups on the SQL Server service of all nodes that will participate.\
    \ Information on how to do this can be found in the “Clusterless Availability\
    \ Groups” section of this chapter."
  fmt: "\n## Create the Endpoint\n\nThe first step in creating the `Availability Group`\
    \ is to create the `endpoint`, which the `Availability Group` will use for sending\
    \ messages between the `Replicas`. We also need to give the service account permissions\
    \ to connect to the `Endpoint`. This can be achieved with the script in Listing\
    \ [7-6](#394392_3_En_7_Chapter.xhtml#PC6).\n\n```sql\n--Create the Endpoint\n\
    CREATE ENDPOINT ClusterlessEndpoint\n    AS TCP (LISTENER_PORT = 5022)\n    FOR\
    \ DATA_MIRRORING (\n          ROLE = ALL,\n          ENCRYPTION = REQUIRED ALGORITHM\
    \ AES\n    ) ;\nGO\n--Start the Endpoint\nALTER ENDPOINT ClusterlessEndpoint STATE\
    \ = STARTED ;\nGO\n--Grant Permissions to the Service Account\nGRANT CONNECT ON\
    \ ENDPOINT::ClusterlessEndpoint TO [ALWAYSON\\SQLServiceAccount];\nGO\n```\n\n\
    Listing 7-6\n\nCreate the Endpoint\n\n## Create the Availability Group\n\nWith\
    \ the `Endpoint` in place, we can now go ahead and create the `Availability Group`.\
    \ As always, we have a choice of using `T-SQL`, the `New Availability Group` wizard,\
    \ or the `New Availability Group` dialog box. In this instance, we will use `T-SQL`\
    \ by running the script in Listing [7-7](#394392_3_En_7_Chapter.xhtml#PC7). Note\
    \ that the `CLUSTER_TYPE` option is set to `NONE`.\n\n```sql\nUSE master\nGO\n\
    CREATE AVAILABILITY GROUP Customers_Clusterless WITH (\n      AUTOMATED_BACKUP_PREFERENCE\
    \ = SECONDARY,\n      CLUSTER_TYPE = NONE\n) FOR DATABASE Customers\nREPLICA ON\
    \ 'PROD' WITH (\n      ENDPOINT_URL = 'TCP://PROD.AlwaysOn.com:5022',\n      FAILOVER_MODE\
    \ = MANUAL,\n      AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n      SEEDING_MODE\
    \ = AUTOMATIC,\n      SECONDARY_ROLE(ALLOW_CONNECTIONS = ALL)\n), 'READSCALE'\
    \ WITH (\n      ENDPOINT_URL = 'TCP://READSCALE.AlwaysOn.com:5022',\n      FAILOVER_MODE\
    \ = MANUAL,\n      AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n      SEEDING_MODE\
    \ = AUTOMATIC,\n      SECONDARY_ROLE(ALLOW_CONNECTIONS = ALL)\n) ;\nGO\n```\n\n\
    Listing 7-7\n\nCreate the Availability Group\n\n## Join the Secondary Replica\
    \ to the Availability Group\n\nFinally, we can join the secondary `Replica` to\
    \ the `Availability Group` by running the script in Listing [7-8](#394392_3_En_7_Chapter.xhtml#PC8),\
    \ against the secondary instance.\n\n```sql\nALTER AVAILABILITY GROUP Customers_Clusterless\
    \ JOIN WITH (CLUSTER_TYPE = NONE) ;\nGO\nALTER AVAILABILITY GROUP Customers_Clusterless\
    \ GRANT CREATE ANY DATABASE ;\nGO\n```\n\nListing 7-8\n\nJoin the Secondary Replica\
    \ to the Availability Group\n\nAnother use case for clusterless `Availability\
    \ Groups` is migrations. If you have a database that you need to migrate to a\
    \ new server, you can easily configure a clusterless `Availability Group` to support\
    \ a side-by-side migration.\n\nOnce the `Availability Group` is configured, users\
    \ can check their application with read-only operations against the new instance\
    \ while continuing to use their existing database. Once they are happy, the `Availability\
    \ Group` can be failed over and the old instance decommissioned.\n\n## Domain-Independent\
    \ Availability Groups\n\nOn the surface, domain-independent Clusters, also known\
    \ as Workgroup Clusters and Availability Groups, may seem a little odd. If a company\
    \ is large enough that it needs to run SQL Server Enterprise (or even Standard),\
    \ then it is surely large enough and very likely to have a domain and the ability\
    \ to create standard clusters. But if you think harder, there are many more use\
    \ cases where enterprises may benefit from domain-independent high availability\
    \ and disaster recovery. For example, imagine that you have a hybrid cloud environment.\
    \ Instead of stretching your domain into Azure, or AWS, your company has decided\
    \ to create a new domain in the cloud and form a trust relationship between the\
    \ two. You then decide that you would like to use `Availability Groups` to synchronize\
    \ a database between on-premise and the cloud, so that your databases supporting\
    \ your online sales application are in the cloud, for the lowest latency, but\
    \ you also want DR back to on-premise. Without domain-independent clusters or\
    \ `Availability Groups`, this would only be possible using clusterless `Availability\
    \ Groups`, meaning that you could not make use of the Listener.\n\nIn this section,\
    \ we will explore how to create a domain-independent cluster and `Availability\
    \ Group`. For networking simplicity, we will configure this between two servers\
    \ in a workgroup within our `Site1` subnet. In this scenario, there will be no\
    \ domain. However, it is worthy of note that this method can also be used to create\
    \ a cluster (and `Availability Group`) between two separate domains, or between\
    \ a domain and a workgroup.\n\nWe will build the cluster and `Availability Group`\
    \ across two nodes, named `ClusterNode1` and `ClusterNode2`, in the same workgroup\
    \ for the purpose of offloading read-only reporting. A default instance of `SQL\
    \ Server` is installed on each node.\n\n### Preparing for the Cluster\n\nIt is\
    \ a requirement that all nodes within the cluster need to add a common Primary\
    \ DNS Suffix. This can be achieved by navigating to Control Panel ➤ System and\
    \ Security ➤ System and selecting Change Settings in the Computer Name, Domain\
    \ and Workgroup Settings area of the screen, to invoke the System Properties dialog\
    \ box, where the Change button can be used to invoke the Computer Name/Domain\
    \ Changes dialog box. You can now use the More button to invoke the DNS Suffix\
    \ and NetBIOS Computer Name dialog box, shown in Figure [7-22](#394392_3_En_7_Chapter.xhtml#Fig22).\
    \ Here, we will enter our common DNS Suffix.\n\n![Figure 7-22 ¶ DNS Suffix and\
    \ NetBIOS Computer Name](images/394392_3_En_7_Chapter/394392_3_En_7_Fig22_HTML.jpg)\n\
    \nFigure 7-22 ¶ DNS Suffix and NetBIOS Computer Name\n\nWe also need to ensure\
    \ that an account exists on all cluster nodes that has the same username and the\
    \ same password and has local administrator permissions. In our scenario, we will\
    \ use the built-in `Administrator`, but if we were to use any other account, then\
    \ we must also set the value of `LocalAccountTokenFilterPolicy` to `1` in the\
    \ registry. This can be achieved by using the `PowerShell` command in Listing\
    \ [7-9](#394392_3_En_7_Chapter.xhtml#PC9).\n\n```powershell\nNew-ItemProperty\
    \ -path HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\
    \ -Name LocalAccountTokenFilterPolicy -Value 1\n```\n\nListing 7-9\n\nSet LocalAccountTokenFilterPolicy\n\
    \n### Create the Cluster\n\nWe can now create the cluster by using the script\
    \ in Listing [7-10](#394392_3_En_7_Chapter.xhtml#PC10). There are two interesting\
    \ points to note here. Firstly, we are using the `AdministrativeAccessPoint` parameter,\
    \ with a configuration value of `DNS`. This will create the Cluster Name Object\
    \ but not attempt to create computer objects in Active Directory, which of course\
    \ is not supported in a domain-independent cluster.\n\nThe second interesting\
    \ point is that we have chosen to use a cluster disk as the witness. This is because\
    \ a file share witness is not supported in domain-independent clusters.\n\n```powershell\n\
    New-Cluster -Name AOAGWorkGroupCluster -Node ClusterNode1,ClusterNode2 -StaticAddress\
    \ 10.0.0.52 -AdministrativeAccessPoint DNS\nSet-ClusterQuorum -DiskWitness \"\
    Cluster Disk 1\"\n```\n\nListing 7-10\n\nCreate the Cluster\n\n### Preparing for\
    \ the Availability Group\n\nThe first step in preparing for the `Availability\
    \ Group` is to enable `Availability Groups` on the `SQL Server` service of all\
    \ nodes that will participate. Information on how to do this can be found in the\
    \ “Clusterless Availability Groups” section of this chapter.\n"
  trans: "\n## 创建终结点\n\n创建 `Availability Group` 的第一步是创建 `endpoint`，`Availability Group`\
    \ 将使用它在 `Replicas` 之间发送消息。我们还需要授予服务帐户连接到 `Endpoint` 的权限。这可以通过清单 7-6 中的脚本实现。\n\n\
    ```sql\n--Create the Endpoint\nCREATE ENDPOINT ClusterlessEndpoint\n    AS TCP\
    \ (LISTENER_PORT = 5022)\n    FOR DATA_MIRRORING (\n          ROLE = ALL,\n  \
    \        ENCRYPTION = REQUIRED ALGORITHM AES\n    ) ;\nGO\n--Start the Endpoint\n\
    ALTER ENDPOINT ClusterlessEndpoint STATE = STARTED ;\nGO\n--Grant Permissions\
    \ to the Service Account\nGRANT CONNECT ON ENDPOINT::ClusterlessEndpoint TO [ALWAYSON\\\
    SQLServiceAccount];\nGO\n```\n\n清单 7-6\n\n创建终结点\n\n## 创建可用性组\n\n`Endpoint` 就位后，我们现在可以继续创建\
    \ `Availability Group`。与往常一样，我们可以选择使用 `T-SQL`、`New Availability Group` 向导或 `New\
    \ Availability Group` 对话框。在本例中，我们将通过运行清单 7-7 中的脚本使用 `T-SQL`。请注意，`CLUSTER_TYPE`\
    \ 选项设置为 `NONE`。\n\n```sql\nUSE master\nGO\nCREATE AVAILABILITY GROUP Customers_Clusterless\
    \ WITH (\n      AUTOMATED_BACKUP_PREFERENCE = SECONDARY,\n      CLUSTER_TYPE =\
    \ NONE\n) FOR DATABASE Customers\nREPLICA ON 'PROD' WITH (\n      ENDPOINT_URL\
    \ = 'TCP://PROD.AlwaysOn.com:5022',\n      FAILOVER_MODE = MANUAL,\n      AVAILABILITY_MODE\
    \ = ASYNCHRONOUS_COMMIT,\n      SEEDING_MODE = AUTOMATIC,\n      SECONDARY_ROLE(ALLOW_CONNECTIONS\
    \ = ALL)\n), 'READSCALE' WITH (\n      ENDPOINT_URL = 'TCP://READSCALE.AlwaysOn.com:5022',\n\
    \      FAILOVER_MODE = MANUAL,\n      AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n\
    \      SEEDING_MODE = AUTOMATIC,\n      SECONDARY_ROLE(ALLOW_CONNECTIONS = ALL)\n\
    ) ;\nGO\n```\n\n清单 7-7\n\n创建可用性组\n\n## 将辅助副本加入可用性组\n\n最后，我们可以通过在辅助实例上运行清单 7-8\
    \ 中的脚本，将辅助 `Replica` 加入 `Availability Group`。\n\n```sql\nALTER AVAILABILITY GROUP\
    \ Customers_Clusterless JOIN WITH (CLUSTER_TYPE = NONE) ;\nGO\nALTER AVAILABILITY\
    \ GROUP Customers_Clusterless GRANT CREATE ANY DATABASE ;\nGO\n```\n\n清单 7-8\n\
    \n将辅助副本加入可用性组\n\n`Availability Groups` 的无群集用例之一是迁移。如果您有一个需要迁移到新服务器的数据库，您可以轻松配置一个无群集\
    \ `Availability Group` 来支持并行迁移。\n\n一旦 `Availability Group` 配置完成，用户就可以在继续使用现有数据库的同时，对新实例执行只读操作进行应用程序检查。一旦他们满意，`Availability\
    \ Group` 可以进行故障转移，旧实例将被退役。\n\n## 与域无关的可用性组\n\n表面上看，与域无关的群集，也称为工作组群集和可用性组，似乎有点奇怪。如果一家公司大到需要运行\
    \ SQL Server Enterprise（甚至是 Standard），那么它肯定足够大，也很可能拥有域和创建标准群集的能力。但如果思考得更深入，企业从与域无关的高可用性和灾难恢复中受益的用例还有很多。例如，想象一下您拥有一个混合云环境。您的公司没有将域扩展到\
    \ Azure 或 AWS，而是决定在云中创建一个新域并在两者之间建立信任关系。然后您决定想要使用 `Availability Groups` 在本地和云之间同步数据库，以便支持在线销售应用程序的数据库位于云中以获得最低延迟，但您也希望\
    \ DR 回到本地。没有与域无关的群集或 `Availability Groups`，这只能使用无群集 `Availability Groups` 实现，这意味着您无法使用侦听器。\n\
    \n在本节中，我们将探讨如何创建与域无关的群集和 `Availability Group`。为了网络的简单性，我们将在 `Site1` 子网内的一个工作组中的两台服务器之间配置它。在此场景中，不存在域。但是值得注意的是，此方法也可以用于在两个独立域之间，或在域和工作组之间创建群集（和\
    \ `Availability Group`）。\n\n我们将在同一工作组中的两个节点上构建群集和 `Availability Group`，节点名为 `ClusterNode1`\
    \ 和 `ClusterNode2`，目的是卸载只读报表。每个节点上都安装了默认实例的 `SQL Server`。\n\n### 为群集做准备\n\n群集中所有节点都需要添加一个共同的主\
    \ DNS 后缀是必需的。这可以通过导航到 控制面板 ➤ 系统和安全 ➤ 系统 并在屏幕的 计算机名称、域和工作组设置 区域中选择更改设置来实现，从而调用系统属性对话框，其中可以使用更改按钮调用计算机名称/域更改对话框。现在，您可以使用更多按钮调用\
    \ DNS 后缀和 NetBIOS 计算机名称对话框，如图 7-22 所示。在这里，我们将输入我们的公共 DNS 后缀。\n\n![图 7-22 ¶ DNS\
    \ 后缀和 NetBIOS 计算机名称](img/394392_3_En_7_Fig22_HTML.jpg)\n\n图 7-22 ¶ DNS 后缀和 NetBIOS\
    \ 计算机名称\n\n我们还需要确保在所有群集节点上存在一个帐户，该帐户具有相同的用户名、相同的密码并且具有本地管理员权限。在我们的场景中，我们将使用内置的\
    \ `Administrator`，但如果我们使用任何其他帐户，则还必须在注册表中将 `LocalAccountTokenFilterPolicy` 的值设置为\
    \ `1`。这可以通过使用清单 7-9 中的 `PowerShell` 命令来实现。\n\n```powershell\nNew-ItemProperty\
    \ -path HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\
    \ -Name LocalAccountTokenFilterPolicy -Value 1\n```\n\n清单 7-9\n\n设置 LocalAccountTokenFilterPolicy\n\
    \n### 创建群集\n\n我们现在可以使用清单 7-10 中的脚本创建群集。这里有两个有趣的点需要注意。首先，我们正在使用 `AdministrativeAccessPoint`\
    \ 参数，配置值为 `DNS`。这将创建群集名称对象，但不会尝试在 Active Directory 中创建计算机对象，而这当然在与域无关的群集中不受支持。\n\
    \n第二个有趣的点是我们选择使用群集磁盘作为见证。这是因为文件共享见证在与域无关的群集中不受支持。\n\n```powershell\nNew-Cluster\
    \ -Name AOAGWorkGroupCluster -Node ClusterNode1,ClusterNode2 -StaticAddress 10.0.0.52\
    \ -AdministrativeAccessPoint DNS\nSet-ClusterQuorum -DiskWitness \"Cluster Disk\
    \ 1\"\n```\n\n清单 7-10\n\n创建群集\n\n### 为可用性组做准备\n\n为 `Availability Group` 做准备的第一步是在所有将参与的节点的\
    \ `SQL Server` 服务上启用 `Availability Groups`。有关如何执行此操作的说明可在本章的“无群集可用性组”部分找到。\n"

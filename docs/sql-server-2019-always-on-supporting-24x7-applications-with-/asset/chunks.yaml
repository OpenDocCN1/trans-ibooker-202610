- raw: "The Set Session Event Filters page, shown in Figure [9-9](#394392_3_En_9_Chapter.xhtml#Fig9),\
    \ allows you to configure Predicates on the Session. We will configure a Predicate\
    \ which filters operations on system databases. ![Figure 9-9 ¶ Set Session Event\
    \ Filters Page](images/394392_3_En_9_Chapter/394392_3_En_9_Fig9_HTML.jpg)\n\n\
    Figure 9-9 ¶ Set Session Event Filters Page\n\nThe Specify Session Data Storage\
    \ page of the wizard is where we can configure the Target. The wizard provides\
    \ the choice of a file or ring buffer target, along with the option to specify\
    \ size and rollover options. We will configure a file target, as illustrated in\
    \ Figure [9-10](#394392_3_En_9_Chapter.xhtml#Fig10). ![Figure 9-10 ¶ Specify Session\
    \ Data Storage](images/394392_3_En_9_Chapter/394392_3_En_9_Fig10_HTML.jpg)\n\n\
    Figure 9-10 ¶ Specify Session Data Storage\n\nThe Summary page of the wizard will\
    \ confirm the actions that the wizard will perform. After the Session has been\
    \ created, the Completion page will provide the option of watching live data upon\
    \ exit. To create the same Session using T-SQL, you could use the script in Listing\
    \ [9-1](#394392_3_En_9_Chapter.xhtml#PC1). CREATE EVENT SESSION AlwaysOnTrace\
    \ ON SERVER ADD EVENT sqlserver.hadr\\_db\\_marked\\_for\\_reseed(     ACTION(sqlserver.nt\\\
    _username,sqlserver.sql\\_text)     WHERE (sqlserver.database\\_id>(4))), ADD\
    \ EVENT sqlserver.long\\_io\\_detected(     ACTION(sqlserver.nt\\_username,sqlserver.sql\\\
    _text)     WHERE (sqlserver.database\\_id>(4))) ADD TARGET package0.event\\_file(SET\
    \ filename='C:\\\\MSSQL\\\\ASlwaysOnTrace.xel') WITH (MAX\\_MEMORY=4096 KB,EVENT\\\
    _RETENTION\\_MODE=ALLOW\\_SINGLE\\_EVENT\\_LOSS,MAX\\_DISPATCH\\_LATENCY=30 SECONDS,MAX\\\
    _EVENT\\_SIZE=0 KB,MEMORY\\_PARTITION\\_MODE=NONE,TRACK\\_CAUSALITY=OFF,STARTUP\\\
    _STATE=ON) ; Listing 9-1 \n\nCreate an Event Session\n\nThe CREATE EVENT SESSION\
    \ DDL statement accepts the arguments detailed in Table [9-4](#394392_3_En_9_Chapter.xhtml#Tab4).\
    \ Table 9-4 \n\nCREATE EVENT SESSION Arguments\n\n| Argument || Description |\n\
    \n| --- | --- |\n\n| event\\_session\\_name || Specifies the name of the event\
    \ session that you are creating |\n\n| --- | --- |\n\n| ADD EVENT | SET || Repeating\
    \ for every event that is added to the session, followed by the name of the event,\
    \ in the format package.event. You can use the SET statement to set event-specific\
    \ customizations, such as including nonmandatory event fields |\n\n| ACTION ||\
    \ Specified after each ADD EVENT argument if there are global fields which should\
    \ be captured for that event |\n\n| WHERE || Specified after each ADD EVENT argument\
    \ if the event should have a predicate associated with it |\n\n| ADD TARGET |\
    \ SET || Specified for each target that will be added to the session. You can\
    \ use the SET statement to populate target-specific parameters, such as the filename\
    \ parameter for the event\\_file target |\n\nThe CREATE EVENT SESSION statement\
    \ also accepts a number of WITH options, which are detailed in Table [9-5](#394392_3_En_9_Chapter.xhtml#Tab5).\
    \ Table 9-5 \n\nCREATE EVENT SESSION WITH Options\n\n| WITH Option || Description\
    \ |\n\n| --- | --- |\n\n| MAX\\_MEMORY || Specifies the maximum amount of memory\
    \ that the event session can use for buffering events before dispatching them\
    \ to the target(s) |\n\n| --- | --- |\n\n| EVENT\\_RETENTION\\_MODE || Specifies\
    \ the behavior if the buffers become full. Acceptable values are ALLOW\\_SINGLE\\\
    _EVENT\\_LOSS, which indicates that a single event can be dropped if all buffers\
    \ are full; ALLOW\\_MULTIPLE\\_EVENT\\_LOSS, which indicates that an entire buffer\
    \ can be dropped if all buffers are full; and NO\\_EVENT\\_LOSS, which indicates\
    \ that tasks that cause events to fire are to wait until there is space in the\
    \ buffer |\n\n| MAX\\_DISPATCH\\_LATENCY || Specifies the maximum amount of time\
    \ that events can reside in the session’s buffers before being flushed to the\
    \ target(s), specified in seconds |\n\n| MAX\\_EVENT\\_SIZE || Specifies the maximum\
    \ possible size for event data from any single event. It can be specified in kilobytes\
    \ or megabytes and should only be configured to allow events that are larger than\
    \ the MAX\\_MEMORY setting |\n\n| MEMORY\\_PARTITION\\_MODE || Specifies where\
    \ event buffers are created. Acceptable values are• NONE – Which indicates that\
    \ the buffers will be created within the instance• PER\\_NODE – Which indicates\
    \ that the buffers will be created for each NUMA node• PER\\_CPU – Which means\
    \ that buffers will be created for each CPU |\n\n| TRACK\\_CAUSALITY  || Specifies\
    \ that an additional GUID and sequence number will be stored with each event so\
    \ that events can be correlated |\n\n| STARTUP\\_STATE || • Specifies if the session\
    \ automatically starts when the instance starts. ON indicates it does• OFF indicates\
    \ it does not |\n\nTip \n\nFor a deeper discussion around Extended Events, I highly\
    \ recommend the Apress book *Pro SQL Server 2019 Administration*, which can be\
    \ purchased from [www.apress.com/gp/book/9781484250884](http://www.apress.com/gp/book/9781484250884).\n\
    \n## Summary\n\nSQL Server provides rich tools for monitoring the health of AlwaysOn\
    \ Availability Groups. The AlwaysOn Dashboard is an interactive report within\
    \ SQL Server Management Studio, which will allow you to assess the health of your\
    \ Availability Groups and Replicas. It also provides links to view quorum configuration\
    \ information and live health data.\n\nLive health data is captured by an extended\
    \ events session, which is created when you create the first Availability Group\
    \ on an instance, and runs in the background, capturing preconfigured events.\
    \ It is possible to customize this trace; I would recommend leaving it with default\
    \ configurations and creating a new Event Session, if you require a custom capture.\n\
    \nCreating an Event Session allows you to capture either very fine-grain points\
    \ of interest, or just courser-grain information, depending on your requirements.\
    \ Extended Events are implemented using WMI and are a very lightweight framework,\
    \ meaning you can identify issues and trend, without compromising the performance\
    \ of your instance.\n\n© Peter A. Carter 2020 P. A. CarterSQL Server 2019 AlwaysOn[https://doi.org/10.1007/978-1-4842-6479-9\\\
    _10](https://doi.org/10.1007/978-1-4842-6479-9_10) Begin Abstract \n\n# 10. Troubleshooting\
    \ AlwaysOn\n\nPeter A. Carter^([1](#394392_3_En_10_Chapter.xhtml#Aff2) ) (1) Botley,\
    \ UK   End Abstract \n\nSQL Server exposes a wealth of metadata, pertaining to\
    \ high availability and disaster recovery objects, especially around the AlwaysOn\
    \ feature set. This metadata can be used to quickly identify a configuration,\
    \ find the root cause of an issue, or script automated responses to events that\
    \ may occur. The following sections will discuss the metadata that is available\
    \ and provide examples of how it can be used.\n\n## AlwaysOn Failover Clustered\
    \ Instance Metadata\n\nFrom inside the database engine, it is possible to view\
    \ a large amount of metadata regarding a clustered instance, and the Windows Cluster\
    \ that hosts it. This information can prove invaluable to a DBA. The following\
    \ section will introduce some of the most useful and interesting metadata objects.\n\
    \n### Discovering the Node That Hosts an Instance\n\nNaturally , a DBA will need\
    \ to know which node within a cluster is hosting a failover clustered instance,\
    \ especially when attempting to diagnose connectivity or performance issues. If\
    \ your organization has a policy that DBAs are not allowed operating system access,\
    \ however, then Failover Manager can’t be used. Luckily, there is a DMV (Dynamic\
    \ Management View) within SQL Server that will expose this information. The sys.dm\\\
    _os\\_cluster\\_nodes DMV will return the columns detailed in Table [10-1](#394392_3_En_10_Chapter.xhtml#Tab1).\
    \ Table 10-1 \n\nsys.dm\\_os\\_cluster\\_nodes Columns\n\n| Column || Description\
    \ |\n\n| --- | --- |\n\n| NodeName || The name of the cluster node |\n\n| ---\
    \ | --- |"
  fmt: "\n## Set Session Event Filters\nThe Set Session Event Filters page, shown\
    \ in Figure [9-9](#394392_3_En_9_Chapter.xhtml#Fig9), allows you to configure\
    \ `Predicates` on the `Session`. We will configure a `Predicate` which filters\
    \ operations on system databases. ![Figure 9-9 ¶ Set Session Event Filters Page](images/394392_3_En_9_Chapter/394392_3_En_9_Fig9_HTML.jpg)\n\
    Figure 9-9 ¶ Set Session Event Filters Page\n\n## Specify Session Data Storage\n\
    The Specify Session Data Storage page of the wizard is where we can configure\
    \ the `Target`. The wizard provides the choice of a file or ring buffer target,\
    \ along with the option to specify size and rollover options. We will configure\
    \ a file target, as illustrated in Figure [9-10](#394392_3_En_9_Chapter.xhtml#Fig10).\
    \ ![Figure 9-10 ¶ Specify Session Data Storage](images/394392_3_En_9_Chapter/394392_3_En_9_Fig10_HTML.jpg)\n\
    Figure 9-10 ¶ Specify Session Data Storage\n\n## Summary Page\nThe Summary page\
    \ of the wizard will confirm the actions that the wizard will perform. After the\
    \ `Session` has been created, the Completion page will provide the option of watching\
    \ live data upon exit. To create the same `Session` using `T-SQL`, you could use\
    \ the script in Listing [9-1](#394392_3_En_9_Chapter.xhtml#PC1).\n\n```sql\nCREATE\
    \ EVENT SESSION AlwaysOnTrace ON SERVER ADD EVENT sqlserver.hadr_db_marked_for_reseed(\n\
    \    ACTION(sqlserver.nt_username,sqlserver.sql_text)\n    WHERE (sqlserver.database_id>(4))),\
    \ ADD EVENT sqlserver.long_io_detected(\n    ACTION(sqlserver.nt_username,sqlserver.sql_text)\n\
    \    WHERE (sqlserver.database_id>(4))) ADD TARGET package0.event_file(SET filename='C:\\\
    \\MSSQL\\\\ASlwaysOnTrace.xel') WITH (MAX_MEMORY=4096 KB,EVENT_RETENTION_MODE=ALLOW_SINGLE_EVENT_LOSS,MAX_DISPATCH_LATENCY=30\
    \ SECONDS,MAX_EVENT_SIZE=0 KB,MEMORY_PARTITION_MODE=NONE,TRACK_CAUSALITY=OFF,STARTUP_STATE=ON)\
    \ ;\n```\nListing 9-1 \nCreate an Event Session\n\n### CREATE EVENT SESSION Arguments\n\
    The `CREATE EVENT SESSION` DDL statement accepts the arguments detailed in Table\
    \ [9-4](#394392_3_En_9_Chapter.xhtml#Tab4). Table 9-4 \nCREATE EVENT SESSION Arguments\n\
    \n| Argument || Description |\n| --- | --- |\n| `event_session_name` || Specifies\
    \ the name of the event session that you are creating |\n| --- | --- |\n| `ADD\
    \ EVENT` | `SET` || Repeating for every event that is added to the session, followed\
    \ by the name of the event, in the format `package.event`. You can use the `SET`\
    \ statement to set event-specific customizations, such as including nonmandatory\
    \ event fields |\n| `ACTION` || Specified after each `ADD EVENT` argument if there\
    \ are global fields which should be captured for that event |\n| `WHERE` || Specified\
    \ after each `ADD EVENT` argument if the event should have a predicate associated\
    \ with it |\n| `ADD TARGET` | `SET` || Specified for each target that will be\
    \ added to the session. You can use the `SET` statement to populate target-specific\
    \ parameters, such as the `filename` parameter for the `event_file` target |\n\
    \n### CREATE EVENT SESSION WITH Options\nThe `CREATE EVENT SESSION` statement\
    \ also accepts a number of `WITH` options, which are detailed in Table [9-5](#394392_3_En_9_Chapter.xhtml#Tab5).\
    \ Table 9-5 \nCREATE EVENT SESSION WITH Options\n\n| WITH Option || Description\
    \ |\n| --- | --- |\n| `MAX_MEMORY` || Specifies the maximum amount of memory that\
    \ the event session can use for buffering events before dispatching them to the\
    \ target(s) |\n| --- | --- |\n| `EVENT_RETENTION_MODE` || Specifies the behavior\
    \ if the buffers become full. Acceptable values are `ALLOW_SINGLE_EVENT_LOSS`,\
    \ which indicates that a single event can be dropped if all buffers are full;\
    \ `ALLOW_MULTIPLE_EVENT_LOSS`, which indicates that an entire buffer can be dropped\
    \ if all buffers are full; and `NO_EVENT_LOSS`, which indicates that tasks that\
    \ cause events to fire are to wait until there is space in the buffer |\n| `MAX_DISPATCH_LATENCY`\
    \ || Specifies the maximum amount of time that events can reside in the session’s\
    \ buffers before being flushed to the target(s), specified in seconds |\n| `MAX_EVENT_SIZE`\
    \ || Specifies the maximum possible size for event data from any single event.\
    \ It can be specified in kilobytes or megabytes and should only be configured\
    \ to allow events that are larger than the `MAX_MEMORY` setting |\n| `MEMORY_PARTITION_MODE`\
    \ || Specifies where event buffers are created. Acceptable values are• `NONE` –\
    \ Which indicates that the buffers will be created within the instance• `PER_NODE` –\
    \ Which indicates that the buffers will be created for each NUMA node• `PER_CPU` –\
    \ Which means that buffers will be created for each CPU |\n| `TRACK_CAUSALITY`\
    \  || Specifies that an additional GUID and sequence number will be stored with\
    \ each event so that events can be correlated |\n| `STARTUP_STATE` || • Specifies\
    \ if the session automatically starts when the instance starts. `ON` indicates\
    \ it does• `OFF` indicates it does not |\n\nTip \nFor a deeper discussion around\
    \ Extended Events, I highly recommend the Apress book *Pro SQL Server 2019 Administration*,\
    \ which can be purchased from [www.apress.com/gp/book/9781484250884](http://www.apress.com/gp/book/9781484250884).\n\
    \n## Summary\nSQL Server provides rich tools for monitoring the health of AlwaysOn\
    \ Availability Groups. The AlwaysOn Dashboard is an interactive report within\
    \ SQL Server Management Studio, which will allow you to assess the health of your\
    \ Availability Groups and Replicas. It also provides links to view quorum configuration\
    \ information and live health data.\nLive health data is captured by an extended\
    \ events session, which is created when you create the first Availability Group\
    \ on an instance, and runs in the background, capturing preconfigured events.\
    \ It is possible to customize this trace; I would recommend leaving it with default\
    \ configurations and creating a new Event Session, if you require a custom capture.\n\
    Creating an Event Session allows you to capture either very fine-grain points\
    \ of interest, or just courser-grain information, depending on your requirements.\
    \ Extended Events are implemented using WMI and are a very lightweight framework,\
    \ meaning you can identify issues and trend, without compromising the performance\
    \ of your instance.\n© Peter A. Carter 2020 P. A. CarterSQL Server 2019 AlwaysOn[https://doi.org/10.1007/978-1-4842-6479-9\\\
    _10](https://doi.org/10.1007/978-1-4842-6479-9_10) Begin Abstract \n# 10. Troubleshooting\
    \ AlwaysOn\nPeter A. Carter^([1](#394392_3_En_10_Chapter.xhtml#Aff2) ) (1) Botley,\
    \ UK   End Abstract \nSQL Server exposes a wealth of metadata, pertaining to high\
    \ availability and disaster recovery objects, especially around the AlwaysOn feature\
    \ set. This metadata can be used to quickly identify a configuration, find the\
    \ root cause of an issue, or script automated responses to events that may occur.\
    \ The following sections will discuss the metadata that is available and provide\
    \ examples of how it can be used.\n\n## AlwaysOn Failover Clustered Instance Metadata\n\
    From inside the database engine, it is possible to view a large amount of metadata\
    \ regarding a clustered instance, and the Windows Cluster that hosts it. This\
    \ information can prove invaluable to a DBA. The following section will introduce\
    \ some of the most useful and interesting metadata objects.\n\n### Discovering\
    \ the Node That Hosts an Instance\nNaturally , a DBA will need to know which node\
    \ within a cluster is hosting a failover clustered instance, especially when attempting\
    \ to diagnose connectivity or performance issues. If your organization has a policy\
    \ that DBAs are not allowed operating system access, however, then Failover Manager\
    \ can’t be used. Luckily, there is a `DMV` (Dynamic Management View) within SQL\
    \ Server that will expose this information. The `sys.dm_os_cluster_nodes` `DMV`\
    \ will return the columns detailed in Table [10-1](#394392_3_En_10_Chapter.xhtml#Tab1).\
    \ Table 10-1 \nsys.dm_os_cluster_nodes Columns\n\n| Column || Description |\n\
    | --- | --- |\n| `NodeName` || The name of the cluster node |\n| --- | --- |\n"
  trans: "\n## 设置会话事件筛选器\n设置会话事件筛选器页面，如图 9-9 所示，允许您在 `Session` 上配置 `Predicates`。我们将配置一个\
    \ `Predicate` 来筛选对系统数据库的操作。![Figure 9-9 ¶ 设置会话事件筛选器页面](img/394392_3_En_9_Fig9_HTML.jpg)\n\
    图 9-9 ¶ 设置会话事件筛选器页面\n\n## 指定会话数据存储\n向导中的指定会话数据存储页面是配置 `Target` 的位置。向导提供文件或环形缓冲区目标的选择，以及指定大小和滚动选项的选项。我们将配置文件目标，如图\
    \ 9-10 所示。![Figure 9-10 ¶ 指定会话数据存储](img/394392_3_En_9_Fig10_HTML.jpg)\n图 9-10\
    \ ¶ 指定会话数据存储\n\n## 摘要页\n向导的摘要页将确认向导将执行的操作。`Session` 创建后，完成页面将在退出时提供查看实时数据的选项。要使用\
    \ `T-SQL` 创建相同的 `Session`，您可以使用列表 9-1 中的脚本。\n\n```sql\nCREATE EVENT SESSION AlwaysOnTrace\
    \ ON SERVER ADD EVENT sqlserver.hadr_db_marked_for_reseed(\n    ACTION(sqlserver.nt_username,sqlserver.sql_text)\n\
    \    WHERE (sqlserver.database_id>(4))), ADD EVENT sqlserver.long_io_detected(\n\
    \    ACTION(sqlserver.nt_username,sqlserver.sql_text)\n    WHERE (sqlserver.database_id>(4)))\
    \ ADD TARGET package0.event_file(SET filename='C:\\\\MSSQL\\\\ASlwaysOnTrace.xel')\
    \ WITH (MAX_MEMORY=4096 KB,EVENT_RETENTION_MODE=ALLOW_SINGLE_EVENT_LOSS,MAX_DISPATCH_LATENCY=30\
    \ SECONDS,MAX_EVENT_SIZE=0 KB,MEMORY_PARTITION_MODE=NONE,TRACK_CAUSALITY=OFF,STARTUP_STATE=ON)\
    \ ;\n```\n列表 9-1 \n创建事件会话\n\n### CREATE EVENT SESSION 参数\n`CREATE EVENT SESSION`\
    \ DDL 语句接受表 9-4 中详细说明的参数。表 9-4 \nCREATE EVENT SESSION 参数\n\n| 参数 || 描述 |\n| ---\
    \ | --- |\n| `event_session_name` || 指定您正在创建的事件会话的名称 |\n| --- | --- |\n| `ADD\
    \ EVENT` | `SET` || 对添加到会话中的每个事件重复，后跟事件名称，格式为 `package.event`。您可以使用 `SET` 语句设置事件特定的自定义，例如包含非强制性事件字段\
    \ |\n| `ACTION` || 如果有应为该事件捕获的全局字段，则在每个 `ADD EVENT` 参数之后指定 |\n| `WHERE` || 如果事件应与其关联谓词，则在每个\
    \ `ADD EVENT` 参数之后指定 |\n| `ADD TARGET` | `SET` || 为将添加到会话中的每个目标指定。您可以使用 `SET`\
    \ 语句填充目标特定参数，例如 `event_file` 目标的 `filename` 参数 |\n\n### CREATE EVENT SESSION WITH\
    \ 选项\n`CREATE EVENT SESSION` 语句还接受多个 `WITH` 选项，详细说明在表 9-5 中。表 9-5 \nCREATE EVENT\
    \ SESSION WITH 选项\n\n| WITH 选项 || 描述 |\n| --- | --- |\n| `MAX_MEMORY` || 指定事件会话在将事件分派到目标之前用于缓冲事件的最大内存量\
    \ |\n| --- | --- |\n| `EVENT_RETENTION_MODE` || 指定缓冲区满时的行为。可接受的值为 `ALLOW_SINGLE_EVENT_LOSS`，表示如果所有缓冲区都已满，则可以丢弃单个事件；`ALLOW_MULTIPLE_EVENT_LOSS`，表示如果所有缓冲区都已满，则可以丢弃整个缓冲区；以及\
    \ `NO_EVENT_LOSS`，表示导致事件触发的任务需等待缓冲区有空间 |\n| `MAX_DISPATCH_LATENCY` || 指定事件在刷新到目标之前可在会话缓冲区中驻留的最长时间，以秒为单位\
    \ |\n| `MAX_EVENT_SIZE` || 指定任何单个事件的事件数据的最大可能大小。可以以千字节或兆字节为单位指定，并且应仅配置为允许大于 `MAX_MEMORY`\
    \ 设置的事件 |\n| `MEMORY_PARTITION_MODE` || 指定事件缓冲区创建的位置。可接受的值为• `NONE` – 表示缓冲区将在实例内创建• `PER_NODE` –\
    \ 表示缓冲区将为每个 NUMA 节点创建• `PER_CPU` – 表示将为每个 CPU 创建缓冲区 |\n| `TRACK_CAUSALITY`  ||\
    \ 指定将额外的 GUID 和序列号与每个事件一起存储，以便关联事件 |\n| `STARTUP_STATE` || • 指定会话在实例启动时是否自动启动。`ON`\
    \ 表示会• `OFF` 表示不会 |\n\n提示\n有关 Extended Events 的更深入讨论，我强烈推荐 Apress 出版的书籍 *Pro SQL\
    \ Server 2019 Administration*，可从 [www.apress.com/gp/book/9781484250884](http://www.apress.com/gp/book/9781484250884)\
    \ 购买。\n\n## 摘要\nSQL Server 提供了丰富的工具来监控 AlwaysOn 可用性组的运行状况。AlwaysOn 仪表板是 SQL Server\
    \ Management Studio 中的交互式报表，可让您评估可用性组和副本的运行状况。它还提供链接以查看法定配置信息和实时运行状况数据。\n实时运行状况数据由扩展事件会话捕获，该会话在实例上创建第一个可用性组时创建，并在后台运行，捕获预配置的事件。可以自定义此跟踪；我建议将其保留为默认配置，并在需要自定义捕获时创建新的事件会话。\n\
    创建事件会话允许您根据需要捕获非常细粒度的关注点或仅粗粒度的信息。扩展事件使用 WMI 实现，是一种非常轻量级的框架，这意味着您可以识别问题和趋势，而不会影响实例的性能。\n\
    © Peter A. Carter 2020 P. A. CarterSQL Server 2019 AlwaysOn[`doi.org/10.1007/978-1-4842-6479-9\\\
    _10`](https://doi.org/10.1007/978-1-4842-6479-9_10) Begin Abstract \n# 10. 故障排除\
    \ AlwaysOn\nPeter A. Carter^(1 ) (1) Botley, UK   End Abstract \nSQL Server 公开了大量与高可用性和灾难恢复对象相关的元数据，尤其是在\
    \ AlwaysOn 功能集周围。这些元数据可用于快速识别配置、查找问题的根本原因，或为可能发生的事件编写自动响应。以下各节将讨论可用的元数据并提供如何使用它的示例。\n\
    \n## AlwaysOn 故障转移群集实例元数据\n从数据库引擎内部，可以查看有关群集实例和承载它的 Windows 群集的大量元数据。这些信息对 DBA\
    \ 来说可能非常宝贵。以下部分将介绍一些最有用和有趣的元数据对象。\n\n### 发现承载实例的节点\n自然地，DBA 需要知道群集中哪个节点正在承载故障转移群集实例，尤其是在尝试诊断连接或性能问题时。然而，如果您的组织有政策不允许\
    \ DBA 访问操作系统，则无法使用 Failover Manager。幸运的是，SQL Server 中有一个 `DMV`（动态管理视图）会公开此信息。`sys.dm_os_cluster_nodes`\
    \ `DMV` 将返回表 10-1 中详细说明的列。表 10-1 \nsys.dm_os_cluster_nodes 列\n\n| 列 || 描述 |\n\
    | --- | --- |\n| `NodeName` || 集群节点名称 |\n| --- | --- |\n"

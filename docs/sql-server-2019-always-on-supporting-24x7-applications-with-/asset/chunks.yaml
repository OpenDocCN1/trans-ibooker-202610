    # Mandatory Parameters When Removing a Node from a Cluster


    | Parameter | Usage |

    |---|---|

    | `/ACTION` | Must be configured as `RemoveNode`. |

    | `/INSTANCENAME` | The instance that you are adding the extra node to support.
    |

    | `/CONFIRMIPDEPENDENCYCHANGE` | Allows multiple IP addresses to be specified
    for multi-subnet clusters. Pass in a value of `1` for True or `0` for False. |


    The script in Listing 8-3 removes a node from our cluster when we run it from
    the root directory of the SQL Server installation media. `.\setup.exe /ACTION="RemoveNode"
    /INSTANCENAME="ALWAYSON-SQL-C" /CONFIRMIPDEPENDENCYCHANGE=0 /qs`


    ## Removing a Node


    # Managing AlwaysOn Availability Groups


    Once the initial setup of your availability group is complete, you still need
    to perform administrative tasks. These include failing over the availability group,
    monitoring, and on rare occasions, adding additional listeners. These topics are
    discussed in the following sections.


    ## Failover


    If a replica is in Synchronous Commit mode and is configured for automatic failover,
    then the availability group automatically moves to a redundant replica in the
    event of an error condition being met on the primary replica. There are occasions,
    however, when you will want to manually fail over an availability group. This
    could be because of DR testing, proactive maintenance, or because you need to
    bring up an asynchronous replica following a failure of the primary replica or
    the primary data center.


    ### Synchronous Failover


    If you wish to fail over a replica that is in Synchronous Commit mode, launch
    the Failover Availability Group wizard by selecting Failover from the context
    menu of your availability group in Object Explorer. After moving past the Introduction
    page, you find the Select New Primary Replica page (see Figure 8-4). On this page,
    check the box of the replica to which you want to fail over. Before doing so,
    however, review the Failover Readiness column to ensure that the replicas are
    synchronized and that no data loss will occur.


    Figure 8-4 ¶ The Select New Primary Replica Page


    On the Connect to Replica page, illustrated in Figure 8-5, use the Connect button
    to establish a connection to the new primary replica.


    Figure 8-5 ¶ The Connect to Replica Page


    On the Summary page, you are given details of the task to be performed, followed
    by a progress indicator on the Results page. Once the failover completes, check
    that all tasks were successful, and investigate any errors or warnings that you
    receive.


    We can also use T-SQL to fail over the availability group. The command in Listing
    8-4 achieves the same results. Make sure to run this script from the replica that
    will be the new primary replica. If you run it from the current primary replica,
    use `SQLCMD` mode and connect to the new primary within the script.


    ```

    ALTER AVAILABILITY GROUP HR FAILOVER;

    GO

    ```


    Failing Over an Availability Group


    ### Asynchronous Failover


    If your availability group is in Asynchronous Commit mode, then from a technical
    standpoint, you can fail over in a similar way to the way you can for a replica
    running in Synchronous Commit mode, except for the fact that you need to force
    the failover, thereby accepting the risk of data loss. You can force failover
    by using the command in Listing 8-5. You should run this script on the instance
    that will be the new primary. For it to work, the cluster must have quorum. If
    it doesn’t, then you need to force the cluster online before you force the availability
    group online.


    ```

    ALTER AVAILABILITY GROUP HR FORCE_FAILOVER_ALLOW_DATA_LOSS;

    ```


    Forcing Failover


    From a process perspective, you should only ever do this if your primary site
    is completely unavailable. If this is not the case, first put the application
    into a safe state. This avoids any possibility of data loss. The way that I normally
    achieve this in a production environment is by performing the following steps:


    1. Disable logins.

    2. Change the mode of the replica to Synchronous Commit mode.

    3. Fail over.

    4. Change the replica back to Asynchronous Commit mode.

    5. Enable the logins.


    You can perform these steps with the script in Listing 8-6. When run from the
    DR instance, this script places the databases in `HR` into a safe state before
    failing over, and then it reconfigures the application to work under normal operations.


    ```

    --DISABLE LOGINS

    DECLARE @AOAGDBs TABLE ( DBName NVARCHAR(128) );

    INSERT INTO @AOAGDBs SELECT database_name FROM sys.availability_groups AG INNER
    JOIN sys.availability_databases_cluster ADC ON AG.group_id = ADC.group_id WHERE
    AG.name = ''HR'';

    DECLARE @Mappings TABLE ( LoginName NVARCHAR(128), DBname NVARCHAR(128), UserName
    NVARCHAR(128), AliasName NVARCHAR(128) );

    INSERT INTO @Mappings EXEC sp_msloginmappings;

    DECLARE @SQL NVARCHAR(MAX)

    SELECT DISTINCT @SQL = ( SELECT ''ALTER LOGIN ['' + LoginName + ''] DISABLE; ''
    AS [data()] FROM @Mappings M INNER JOIN @AOAGDBs A ON M.DBname = A.DBName WHERE
    LoginName <> SUSER_NAME() FOR XML PATH ('''') )

    EXEC(@SQL)

    GO

    --SWITCH TO SYNCHRONOUS COMMIT MODE

    ALTER AVAILABILITY GROUP HR MODIFY REPLICA ON N''CLUSTERNODE3\ASYNCDR'' WITH (AVAILABILITY_MODE
    = SYNCHRONOUS_COMMIT);

    GO

    --FAIL OVER

    ALTER AVAILABILITY GROUP HR FAILOVER

    GO

    --SWITCH BACK TO ASYNCHRONOUS COMMIT MODE

    ALTER AVAILABILITY GROUP HR MODIFY REPLICA ON N''CLUSTERNODE3\ASYNCDR'' WITH (AVAILABILITY_MODE
    = ASYNCHRONOUS_COMMIT);

    GO

    --ENABLE LOGINS

    DECLARE @AOAGDBs TABLE ( DBName NVARCHAR(128) );

    INSERT INTO @AOAGDBs SELECT database_name FROM sys.availability_groups AG INNER
    JOIN sys.availability_databases_cluster ADC ON AG.group_id = ADC.group_id WHERE
    AG.name = ''HR'';

    DECLARE @Mappings TABLE ( LoginName NVARCHAR(128), DBname NVARCHAR(128), Username
    NVARCHAR(128), AliasName NVARCHAR(128) );

    INSERT INTO @Mappings EXEC sp_msloginmappings

    DECLARE @SQL NVARCHAR(MAX)

    SELECT DISTINCT @SQL = ( SELECT ''ALTER LOGIN ['' + LoginName + ''] ENABLE; ''
    AS [data()] FROM @Mappings M INNER JOIN @AOAGDBs A ON M.DBname = A.DBName WHERE
    LoginName <> SUSER_NAME() FOR XML PATH ('''') );

    EXEC(@SQL)

    ```


    Safe-Stating an Application and Failing Over


    ### Failing Over a Distributed Availability Group


    Distributed availability groups do not support automatic failover; only manual
    failover is supported. When you need to fail over to a secondary Availability
    Group, within a Distributed Availability Group, you should perform the following
    steps:


    * Set the synchronization mode to synchronous commit.

    * Wait for the secondary Availability Group to become synchronized.

    * Set the primary Availability Group to take the role of the secondary.

    * Force Failover.

    '

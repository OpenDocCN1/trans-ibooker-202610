    ## Create an Availability Set from the Azure Portal


    To create an Availability Set from the Azure Portal, navigate to the Availability
    Sets blade and use the Add button to launch the Create Availability Set page,
    which is illustrated in Figure [7-1](#394392_3_En_7_Chapter.xhtml#Fig1). You will
    notice that we have selected the Subscription that we want the Availability Set
    to be created in and selected the Resource Group in which it should be created.
    We have also given it a name and selected the Region that it should be created
    in. Because we plan to have two servers within the Availability Set, then both
    Update Domains and Fault Domains have been configured as two. Each of the two
    servers will reside in a different Fault Domain and Update Domain. If we added
    additional servers to the Availability Set, then they would be allocated to Fault
    Domains and Update Domains in a round-robin fashion. ![Figure 7-1 ¶ Create an
    Availability Set](images/394392_3_En_7_Chapter/394392_3_En_7_Fig1_HTML.jpg)


    Figure 7-1 ¶ Create an Availability Set


    On the Advanced page, illustrated in Figure [7-2](#394392_3_En_7_Chapter.xhtml#Fig2),
    we have the option to assign a Proximity Placement Group to the Availability Group.
    A Proximity Placement Group helps ensure the lowest possible latency, by using
    hardware that is located physically close, within the data center. To use this
    option, you must create the Proximity Group before creating the Availability Set.
    ![Figure 7-2 ¶ Create an Availability Set Advanced Page](images/394392_3_En_7_Chapter/394392_3_En_7_Fig2_HTML.jpg)


    Figure 7-2 ¶ Create an Availability Set Advanced Page


    The Tags page allows you to assign key/value pairs of tags. Using tags is always
    good practice for cloud as it helps not only with resource management but also
    with cost control, such as producing show-back or charge-back mechanisms to business
    divisions that consume cloud resources. As shown in Figure [7-3](#394392_3_En_7_Chapter.xhtml#Fig3),
    we have configured tags for environment and application. ![Figure 7-3 ¶ Create
    an Availability Set – Tags Page](images/394392_3_En_7_Chapter/394392_3_En_7_Fig3_HTML.jpg)


    Figure 7-3 ¶ Create an Availability Set – Tags Page


    Tip


    You can use Azure Policies to enforce specific tags are used when resources are
    created.


    On the Review page, you have the opportunity to review the settings that you have
    configured, before creating the resource.


    ## Create Availability Groups on Azure VMs


    In the following sections, we will discuss building and configuring an Availability
    Group solution on Azure.


    Note


    To follow demonstrations in the following sections, you will need an Azure subscription.
    This must be at least a pay-as-you-go subscription, as a free trial subscription
    will not give you enough cores to build the two servers. You will also need a
    vnet, with two subnets. The chapter also assumes that the either the vet contains
    a domain controller, or that you have configured Azure Domain Services.


    ### Create the VMs


    The first thing that we will require is three VMs, which will have SQL Server
    installed on them. There are various ways to achieve this in Azure, depending
    on your requirements. The first option is to go to the Azure Marketplace and find
    a machine image, with SQL Server installed. If you take this approach, then it
    is important to understand that there are two different types of license terms.
    The first is SPLA (Service Provide License Agreement). With SPLA licensing, the
    cost of the VM includes the cost of the SQL Server license. This means that your
    license is on a pay-as-you-go basis and avoids the upfront cost of license procurement,
    but does work out more expensive over time, if the VM will be long lived.


    The second option type is BYOL (bring your own license). With this license model,
    the SQL Server license is not included in the cost of the VM. Instead, you must
    use an existing license that has already been procured. When you chose this option,
    then you must report your license usage to Microsoft within 10 days.


    When you build a VM with SQL Server already installed, it arrives with a full
    installation of SQL Server, including all features. (Unless you choose an image
    marked Database Engine Only.) This is not ideal is most use cases, as it has a
    larger security footprint and resource utilization than installing just the features
    that you require. Therefore, if you use a VM image with SQL Server preinstalled
    (regardless of the licensing model), you should take the time to customize the
    image to meet your requirements.


    Alternatively, you could simply build a VM from a vanilla Windows Server image
    and install SQL Server yourself. This is the most flexibly option, but if you
    take this approach, then you must bring your own license. No SPLA option will
    be available.


    In this example, we will use the SQL Server 2019 on Windows Server 2019 image,
    with SPLA licensing. Figure [7-4](#394392_3_En_7_Chapter.xhtml#Fig4) shows the
    Marketplace icon for this VM image. ![Figure 7-4 ¶ SQL Server 2019 on Windows
    Server 2019 VM Image](images/394392_3_En_7_Chapter/394392_3_En_7_Fig4_HTML.jpg)


    Figure 7-4 ¶ SQL Server 2019 on Windows Server 2019 VM Image


    In the first section of the Create Virtual Machine page, illustrated in Figure
    [7-5](#394392_3_En_7_Chapter.xhtml#Fig5), we will specify the Subscription and
    Resource Group that the VM should be created in, before specifying a name for
    the server and the Region it should be created in. ![Figure 7-5 ¶ Create a Virtual
    Machine (Part 1)](images/394392_3_En_7_Chapter/394392_3_En_7_Fig5_HTML.jpg)


    Figure 7-5 ¶ Create a Virtual Machine (Part 1)


    We then go on to specify the Availability Options that we would like for the VM.
    This is critical when planning Availability Groups. In the Availability Options
    dialog box, we can choose between No infrastructure redundancy required, Availability
    Set, or Availability Zone. If we had chosen Availability Set, then we would have
    had the option either to use the Availability Set we created earlier or to create
    a new Availability Set. We have chosen Availability Zone, however, so we can specify
    which Availability Zone the server should be created in. Each Region has a minimum
    of three Availability Zones.


    Caution


    It is important to note, however, that the Availability Option cannot be changed
    after creating the VM. For example, you cannot create a VM with no availability
    option and then add it to an Availability Set later.


    We then have the option to choose change the image that we are building from and
    specify if we want to use Spot instances. Spot instances are rarely suitable for
    SQL Server and never in a production environment. Spot instances are built from
    spare capacity within Azure and are very cost effective. However, Azure can terminate
    them at very short notice, if they need the capacity. Therefore, Spot instances
    are usually most applicable for stateless applications, within Scale Sets, or
    for stateless applications in test environments.


    We also specify the size of VM that we would like to build. The monthly cost (based
    on the server being up 24x7) will be displayed to the right of the VMs size profile.


    We can now continue to populate the second half of the form, as shown in Figure
    [7-6](#394392_3_En_7_Chapter.xhtml#Fig6). Here, we specify the username and password
    for the VMs Admin user and if ports should be opened on a public IP address for
    the server. If so, we can specify which ports should be open. ![Figure 7-6 ¶ Create
    a Virtual Machine (Part 2)](images/394392_3_En_7_Chapter/394392_3_En_7_Fig6_HTML.jpg)


    Figure 7-6 ¶ Create a Virtual Machine (Part 2)


    Caution


    Public ports should only ever be opened for dev/test purposes and even then it
    is highly advisable to create a VPN, or use a Bastion instead.


    Finally, we specify the licensing model we want to use. Note that this is just
    for the operating system, not for SQL Server, but we still have the same two options.
    We can either pay for the Windows license as we go or bring our own.

    '
  trans: '

    ## 从 Azure 门户创建可用性集


    要从 Azure 门户创建可用性集，请导航到“可用性集”刀片并使用“添加”按钮启动“创建可用性集”页面，该页面如图 7-1 所示。您会注意到，我们已选择要创建可用性集的订阅，并选择了应创建它的资源组。我们还为其指定了名称并选择了应创建的区域。因为我们计划在可用性集中拥有两台服务器，所以更新域和故障域都配置为两个。两台服务器中的每一台都将位于不同的故障域和更新域中。如果我们向可用性集添加更多服务器，则它们将以轮询方式分配到故障域和更新域。![图
    7-1 ¶ 创建可用性集](img/394392_3_En_7_Fig1_HTML.jpg)


    图 7-1 ¶ 创建可用性集


    在如图 7-2 所示的高级页面上，我们可以选择将邻近放置组分配给可用性组。邻近放置组通过使用位于数据中心内物理位置接近的硬件来帮助确保最低可能的延迟。要使用此选项，您必须在创建可用性集之前创建邻近组。![图
    7-2 ¶ 创建可用性集高级页面](img/394392_3_En_7_Fig2_HTML.jpg)


    图 7-2 ¶ 创建可用性集高级页面


    标签页面允许您分配键/值对标签。使用标签对于云来说始终是良好的实践，因为它不仅有助于资源管理，还能帮助成本控制，例如为消耗云资源的业务部门生成回溯或分摊机制。如图
    7-3 所示，我们已为环境和应用程序配置了标签。![图 7-3 ¶ 创建可用性集 – 标签页面](img/394392_3_En_7_Fig3_HTML.jpg)


    图 7-3 ¶ 创建可用性集 – 标签页面


    提示


    您可以使用 Azure 策略强制在创建资源时使用特定标签。


    在“审核”页面上，您有机会在创建资源之前审核已配置的设置。


    ## 在 Azure VM 上创建可用性组


    在以下各节中，我们将讨论在 Azure 上构建和配置可用性组解决方案。


    注意


    要跟随以下各节中的演示，您需要一个 Azure 订阅。这必须是至少按使用付费的订阅，因为免费试用订阅无法提供足够的内核来构建两台服务器。您还需要一个 vnet，其中包含两个子网。本章还假设
    vnet 包含域控制器，或者您已配置 Azure 域服务。


    ### 创建 VM


    我们首先需要的是三台 VM，其中将安装 SQL Server。在 Azure 中实现此目的有多种方式，具体取决于您的需求。第一个选项是前往 Azure Marketplace
    并查找已安装 SQL Server 的机器映像。如果您采用这种方法，那么了解有两种不同的许可条款非常重要。第一种是 SPLA（服务提供商许可协议）。使用 SPLA
    许可，VM 的成本包括 SQL Server 许可的成本。这意味着您的许可按使用付费，避免了许可采购的前期成本，但如果 VM 使用时间长，长期来看成本会更高。


    第二种选项类型是 BYOL（自带许可）。在此许可模式下，SQL Server 许可不包含在 VM 的成本中。相反，您必须使用已采购的现有许可。当您选择此选项时，您必须在
    10 天内向 Microsoft 报告您的许可使用情况。


    当您构建已预装 SQL Server 的 VM 时，它将附带完整的 SQL Server 安装，包括所有功能。（除非您选择标记为“仅数据库引擎”的映像。）这在大多数用例中并不理想，因为它比仅安装所需的功能具有更大的安全足迹和资源利用率。因此，如果您使用预装
    SQL Server 的 VM 映像（无论许可模式如何），都应花时间对其进行自定义以满足您的需求。


    或者，您可以简单地从原版 Windows Server 映像构建 VM 并自行安装 SQL Server。这是最灵活的选项，但如果您采用这种方法，则必须自带许可。不会提供
    SPLA 选项。


    在本示例中，我们将使用带 SPLA 许可的 SQL Server 2019 on Windows Server 2019 映像。图 7-4 显示了此 VM
    映像的 Marketplace 图标。![图 7-4 ¶ SQL Server 2019 on Windows Server 2019 VM 映像](img/394392_3_En_7_Fig4_HTML.jpg)


    图 7-4 ¶ SQL Server 2019 on Windows Server 2019 VM 映像


    在如图 7-5 所示的“创建虚拟机”页面的第一部分中，我们将指定 VM 应创建的订阅和资源组，然后指定服务器的名称和应创建的区域。![图 7-5 ¶ 创建虚拟机（第
    1 部分）](img/394392_3_En_7_Fig5_HTML.jpg)


    图 7-5 ¶ 创建虚拟机（第 1 部分）


    然后我们继续指定 VM 的可用性选项。在规划可用性组时，这一点至关重要。在“可用性选项”对话框中，我们可以在“无需基础结构冗余”、“可用性集”或“可用性区域”之间进行选择。如果我们选择了可用性集，那么我们就可以选择使用之前创建的可用性集或创建新的可用性集。然而，我们选择了可用性区域，因此我们可以指定服务器应创建在哪个可用性区域。每个区域至少有三个可用性区域。


    警告


    然而，需要注意的是，创建 VM 后无法更改可用性选项。例如，您不能先创建没有可用性选项的 VM，然后再将其添加到可用性集中。


    然后我们可以选择更改构建映像并指定是否要使用 Spot 实例。Spot 实例很少适合 SQL Server，且绝不适用于生产环境。Spot 实例由 Azure
    内的空闲容量构建，成本非常有效。然而，如果需要容量，Azure 可能会在很短的通知时间内终止它们。因此，Spot 实例通常最适用于无状态应用程序、规模集中的无状态应用程序，或测试环境中的无状态应用程序。


    我们还指定要构建的 VM 大小。月成本（基于服务器 24x7 运行）将显示在 VM 大小配置文件的右侧。


    我们现在可以继续填充表单的后半部分，如图 7-6 所示。在这里，我们指定 VM 的管理员用户的用户名和密码，以及是否应在服务器的公共 IP 地址上打开端口。如果是这样，我们可以指定应打开哪些端口。![图
    7-6 ¶ 创建虚拟机（第 2 部分）](img/394392_3_En_7_Fig6_HTML.jpg)


    图 7-6 ¶ 创建虚拟机（第 2 部分）


    警告


    公共端口只应出于开发/测试目的而打开，即使如此，强烈建议创建 VPN 或改用 Bastion。


    最后，我们指定要使用的许可模式。请注意，这仅适用于操作系统，不适用于 SQL Server，但我们仍然有相同的两个选项。我们可以按需支付 Windows 许可费用或自带许可。


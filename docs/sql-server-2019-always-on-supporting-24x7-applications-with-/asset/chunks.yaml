    If it can access the page, then it sends it to the secondary replica that requested
    it. The secondary replica replaces the corrupt page with the version that it obtained
    from the primary replica. It then updates the `MSDB.dbo.suspect_pages` table with
    an `event_id` of 5. Finally, it attempts to resume the `AOAG` session.


    **Note**

    It is possible to manually resume the session, but if you do, the corrupt page
    is hit again during the synchronization. Make sure you repair or restore the page
    on the primary replica first.


    ## Log Shipping

    Log shipping is a technology that you can use to implement disaster recovery.
    It works by backing up the transaction log on the principle server, copying it
    to the secondary server, and then restoring it. It is most appropriate to use
    log shipping in `DR` scenarios in which you require a load delay, because this
    is not possible with `AOAG`. As an example of where a load delay may be useful,
    consider a scenario in which a user accidently deletes all of the data from a
    table. If there is a delay before the database on the `DR` server is updated,
    then it is possible to recover the data for this table, from the `DR` server,
    and then repopulate the production server. This means that you do not need to
    restore a backup to recover the data. Log shipping is not appropriate for high
    availability, since there is no automatic failover functionality. The diagram
    in Figure [2-7](#394392_3_En_2_Chapter.xhtml#Fig7) illustrates a log shipping
    topology. ![Figure 2-7 ¶ Log Shipping Topology](images/394392_3_En_2_Chapter/394392_3_En_2_Fig7_HTML.jpg)

    Figure 2-7 ¶ Log Shipping Topology


    ### Recovery Modes

    In a log shipping topology , there is always exactly one principle server, which
    is the production server. It is possible to have multiple secondary servers, however,
    and these servers can be a mix of `DR` servers and servers used to offload reporting.

    When you restore a transaction log, you can specify three recovery modes: `Recovery`,
    `NoRecovery`, and `Standby`. The `Recovery` mode brings the database online, which
    is not supported with log shipping. The `NoRecovery` mode keeps the database offline
    so that more backups can be restored. This is the normal configuration for log
    shipping and is the appropriate choice for `DR` scenarios.

    The `Standby` option brings the database online, but in a read-only state so that
    you can restore further backups. This functionality works by maintaining a `TUF`
    (Transaction Undo File). The `TUF` file records any uncommitted transactions in
    the transaction log. This means that you can roll back these uncommitted transactions
    in the transaction log, which allows the database to be more accessible (although
    it is read-only). The next time a restore needs to be applied, you can reapply
    the uncommitted transaction in the `TUF` file to the log before the redo phase
    of the next log restore begins.

    Figure [2-8](#394392_3_En_2_Chapter.xhtml#Fig8) illustrates a log shipping topology
    that uses both a `DR` server and a reporting server. ![Figure 2-8 ¶ Log Shipping
    with DR and Reporting Servers ](images/394392_3_En_2_Chapter/394392_3_En_2_Fig8_HTML.jpg)

    Figure 2-8 ¶ Log Shipping with DR and Reporting Servers


    ### Remote Monitor Server

    Optionally , you can configure a monitor server in your log shipping topology.
    This helps you centralize monitoring and alerting. When you implement a monitor
    server, the history and status of all backup, copy, and restore operations are
    stored on the monitor server. A monitor server also allows you to have a single
    alert job, which is configured to monitor the backup, copy, and restore operations
    on all servers, as opposed to it needing separate alerts on each server in the
    topology .

    **Caution**

    If you wish to use a monitor server, it is important to configure it when you
    set up log shipping. After log shipping has been configured, the only way to add
    a monitor server is to tear down and reconfigure log shipping.


    ### Failover

    Unlike other high availability and disaster recovery technologies, an amount of
    administrative effort is associated with failing over log shipping. To fail over
    log shipping, you must back up the tail end of the transaction log and copy it,
    along with any other uncopied backup files, to the secondary server.

    You now need to apply the remaining transaction log backups to the secondary server
    in sequence, finishing with the tail-log backup. All of the restores are applied
    with the `WITH NORECOVERY`, expect for the final restore, which you apply using
    the `WITH RECOVERY` option to bring the database back online in a consistent state.
    If you are not planning to fail back, you can reconfigure log shipping with the
    secondary server as the new primary server.


    ## Combining Technologies

    To meet your business objectives and nonfunctional requirements (`NFRs`), you
    need to combine multiple high availability and disaster recovery technologies
    together to create a reliable, scalable platform. A classic example of this is
    the requirement to combine an `AlwaysOn Failover Cluster` with `AlwaysOn Availability
    Groups`.

    The reason you may need to combine these technologies is that when you use `AlwaysOn
    Availability Groups` in synchronous mode, which you must do for automatic failover,
    it can cause a performance impediment. As discussed earlier in this chapter, the
    performance issue is caused by the transaction being committed on the secondary
    server before being committed on the primary server. Clustering does not suffer
    from this issue, however, because it relies on a shared disk resource, and therefore
    the transaction is only committed once.

    Therefore, it is common practice to first use a cluster to achieve high availability
    and then use `AlwaysOn Availability Groups` to perform `DR` and/or offload reporting.
    The diagram in Figure [2-9](#394392_3_En_2_Chapter.xhtml#Fig9) illustrates a `HA/DR`
    topology that combines clustering and `AOAG` to achieve high availability and
    disaster recovery, respectively. ![Figure 2-9 ¶ Clustering and AlwaysOn Availability
    Groups Combined](images/394392_3_En_2_Chapter/394392_3_En_2_Fig9_HTML.jpg)

    Figure 2-9 ¶ Clustering and AlwaysOn Availability Groups Combined

    The diagram in Figure [2-9](#394392_3_En_2_Chapter.xhtml#Fig9) shows that the
    primary replica of the database is hosted on a two-node active/passive cluster.
    If the active node fails, the rules of clustering apply, and the shared storage,
    network name, and IP address are reattached to the passive node, which then becomes
    the active node. If both nodes are inaccessible, however, the availability group
    listener points the traffic to the third node of the cluster, which is situated
    in the `DR` site and is synchronized using log stream replication. Of course,
    when asynchronous mode is used, the database must be failed over manually by a
    `DBA`.

    Another common scenario is the combination of a cluster and log shipping to achieve
    high availability and disaster recovery, respectively. This combination works
    in much the same way as clustering combined with `AlwaysOn Availability Groups`
    and is illustrated in Figure [2-10](#394392_3_En_2_Chapter.xhtml#Fig10). ![Figure
    2-10 ¶ Clustering Combined with Log Shipping](images/394392_3_En_2_Chapter/394392_3_En_2_Fig10_HTML.jpg)

    Figure 2-10 ¶ Clustering Combined with Log Shipping

    The diagram shows that a two-node active/passive cluster has been configured in
    the primary data center. The transaction log(s) of the database(s) hosted on this
    instance are then shipped to a stand-alone server in the `DR` data center. Because
    the cluster uses shared storage, you should also use shared storage for the backup
    volume and add the backup volume as a resource in the role. This means that when
    the instance fails over to the other node, the backup share also fails over, and
    log shipping continues to synchronize, uninterrupted.

    **Caution**


- raw: "The TempDB tab is shown in Figure [4-15](#394392_3_En_4_Chapter.xhtml#Fig15).\
    \ This tab allows you to configure the properties of the TempDB database. This\
    \ is important as TempDB requires the correct size and processor settings to avoid\
    \ becoming a bottleneck for the instance. The settings will default to the recommended\
    \ configuration, which is one file per processor core, to a maximum of eight.\
    \ This is considered to be the best number of files to avoid contention on system\
    \ pages, such as GAM, SGAM, and PFS pages. The correct size of TempDB should be\
    \ estimated through a capacity planning exercise. We will configure TempDB to\
    \ have an initial size of 60MB per file (240MB in total). We have also configured\
    \ TempDB to reside on the TempDB volume. In our scenario, we will also be setting\
    \ the file location to point at our TempDB volume. ![Figure 4-15 ¶ Install a SQL\
    \ Server Failover Cluster – TempDB Tab](images/394392_3_En_4_Chapter/394392_3_En_4_Fig15_HTML.jpg)\n\
    \nFigure 4-15 ¶ Install a SQL Server Failover Cluster – TempDB Tab\n\nThe MaxDOP\
    \ tab, shown in Figure [4-16](#394392_3_En_4_Chapter.xhtml#Fig16), allows you\
    \ to configure the default Maximum Degree of Parallelism for queries run within\
    \ the instance. The default value is calculated based on the number of cores available,\
    \ to a maximum of eight. This can be overridden, if required, however. For example,\
    \ for an instance hosting small databases with an OLTP (Online Transactional Processing)\
    \ workload profile, where many small, simultaneous queries are running at the\
    \ same time, it can sometimes be preferable to reduce the MaxDOP value. ![Figure\
    \ 4-16 ¶ Install a SQL Server Failover Cluster – MaxDOP Tab](images/394392_3_En_4_Chapter/394392_3_En_4_Fig16_HTML.jpg)\n\
    \nFigure 4-16 ¶ Install a SQL Server Failover Cluster – MaxDOP Tab\n\nTip \n\n\
    Setting a MaxDOP of 0 allows all available processors to be used to process a\
    \ query running with a parallel query plan.\n\nFigure [4-17](#394392_3_En_4_Chapter.xhtml#Fig17)\
    \ illustrates the Memory tab. Here, you are able to specify if you would like\
    \ to use the default configuration, for the minimum and maximum amount of memory\
    \ that can be allocated to the instance; use the recommended values, calculated\
    \ by the setup wizard; or specify your own values. To specify your own preferred\
    \ values, choose the recommended option, enter your values, and check the Click\
    \ here to accept the recommended memory configurations for the SQL Server database\
    \ engine check box. This check box must also be used, if you wish to adhere to\
    \ the setup program’s recommendations. ![Figure 4-17 ¶ Install a SQL Server Failover\
    \ Cluster – Memory Tab](images/394392_3_En_4_Chapter/394392_3_En_4_Fig17_HTML.jpg)\n\
    \nFigure 4-17 ¶ Install a SQL Server Failover Cluster – Memory Tab\n\nTip \n\n\
    A full discussion of approaches for MaxDOP and Memory configuration can be found\
    \ in the Apress title *Pro SQL Server 2019 Administration*, which can be purchased\
    \ at [www.apress.com/gb/book/9781484250884#otherversion=9781484250891](http://www.apress.com/gb/book/9781484250884%2523otherversion%253D9781484250891).\n\
    \nThe FILESTREAM tab of the Database Engine Configuration page allows you to enable\
    \ and configure the level of access for SQL Server FILESTREAM functionality, as\
    \ illustrated in Figure [4-18](#394392_3_En_4_Chapter.xhtml#Fig18). FILESTREAM\
    \ must also be enabled if you wish to use the FileTable feature of SQL Server.\
    \ FILESTREAM and FileTable provide the ability to store data in an unstructured\
    \ manner within the Windows folder structure, while retaining the ability to manage\
    \ and interrogate this data from SQL Server. ![Figure 4-18 ¶ Install a SQL Server\
    \ Failover Clustered Instance – FILESTREAM Tab](images/394392_3_En_4_Chapter/394392_3_En_4_Fig18_HTML.jpg)\n\
    \nFigure 4-18 ¶ Install a SQL Server Failover Clustered Instance – FILESTREAM\
    \ Tab\n\nAfter the Feature Configuration Rules have been checked, the Ready to\
    \ Install page of the wizard will be displayed. This page of the wizard provides\
    \ a summary of actions that will be performed by the setup utility. Selecting\
    \ Install on this page will cause the instance installation to begin. After installation\
    \ is complete, the Complete page should be reviewed.\n\n## Installing the Instance\
    \ with PowerShell\n\nOf course, we can use PowerShell to install the AlwaysOn\
    \ failover cluster instance instead of using the GUI. To install an AlwaysOn failover\
    \ cluster instance from PowerShell, we can use SQL Server’s setup.exe application\
    \ with the InstallFailoverCluster action specified. \n\nWhen you perform a command-line\
    \ installation of a clustered instance, you need the parameters in Table [4-1](#394392_3_En_4_Chapter.xhtml#Tab1),\
    \ in addition to the parameters that are mandatory when you install a stand-alone\
    \ instance of SQL Server. Table 4-1 \n\nRequired Parameters for the Installation\
    \ of a Clustered Instance\n\n| Parameter || Usage |\n\n| --- | --- |\n\n| /FAILOVERCLUSTERIPADDRESSES\
    \ || Specifies the IP address(s) to use for the instance in the format *<IP Type>;<address>;<network\
    \ name>;<subnet mask>.* For multi-subnet clusters, the IP addresses are space\
    \ delimited. |\n\n| --- | --- |\n\n| /FAILOVERCLUSTERNETWORKNAME || The virtual\
    \ name of the clustered instance. |\n\n| /INSTALLSQLDATADIR || The folder in which\
    \ to place SQL Server data files. This must be a cluster disk. |\n\nThe script\
    \ in Listing [4-1](#394392_3_En_4_Chapter.xhtml#PC1) performs the same installation\
    \ that has just been demonstrated when you run it from the root directory of the\
    \ installation media. .\\\\SETUP.EXE /IACCEPTSQLSERVERLICENSETERMS /ACTION=\"\
    InstallFailoverCluster\" /FEATURES=SQL,IS  /INSTANCENAME=\"MSSQLSERVER\" /SQLSVCACCOUNT=\"\
    ALWAYSON\\\\SQLServiceAccount\" /SQLSVCPASSWORD=\"Pa$$w0rd\" /AGTSVCACCOUNT=\"\
    ALWAYSON\\\\SQLServiceAccount\" /AGTSVCPASSWORD=\"Pa$$w0rd\" /SQLSYSADMINACCOUNTS=\"\
    ALWAYSO\\\\SQLAdmin\" /SQLMAXDOP=\"1\" /FAILOVERCLUSTERIPADDRESSES=\"IPv4;10.0.0.9;Cluster\
    \ Network 2;255.255.255.0\" /FAILOVERCLUSTERDISKS=\"Cluster Disk 1\" \"Cluster\
    \ Disk 2\" \"Cluster Disk 3\" /FAILOVERCLUSTERNETWORKNAME=\"ALWAYSON-SQL-C\" /INSTALLSQLDATADIR=\"\
    F:\\\\\" /SQLUSERDBLOGDIR=\"L:\\\\MSSQL15.MSSQLSERVER\\\\MSSQL\\\\Logs\" /SQLTEMPDBDIR=\"\
    T:\\\\MSSQL15.MSSQLSERVER\\\\MSSQL\\\\TempDB\" /SQLTEMPDBLOGDIR=\"T:\\\\MSSQL15.MSSQLSERVER\\\
    \\MSSQL\\\\TempDB\" /SQLMAXMEMORY=\"2048\" /SQLMINMEMORY=\"1024\" /qs Listing\
    \ 4-1 \n\nInstalling an AlwaysOn Failover Cluster Instance with PowerShell \n\n\
    ## Adding a Node\n\nThe next step you should take when installing the cluster\
    \ is to add the second node. Failure to add the second node results in the instance\
    \ staying online, but with no high availability, since the second node is unable\
    \ to take ownership of the role. To configure the second node, you need to log\
    \ in to the passive cluster node and select the Add Node to SQL Server Failover\
    \ Cluster option from the Installation tab of SQL Server Installation Center.\
    \ This invokes the Add a Failover Cluster Node Wizard. The first page of this\
    \ wizard is the Product Key page. Just like when you install an instance, you\
    \ need to use this screen to provide the product key for SQL Server. Not specifying\
    \ a product key only leaves you the option of installing the Evaluation Edition,\
    \ and since this expires after 180 days, it’s probably not the wisest choice for\
    \ high availability. \n\nThe following License Terms page of the wizard asks you\
    \ to read and accept the license terms of SQL Server. Additionally, you need to\
    \ specify if you wish to participate in Microsoft’s Customer Experience Improvement\
    \ Program. If you select this option, then error reporting is captured and sent\

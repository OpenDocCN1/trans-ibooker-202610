    \ MSDTC-ALWAYSON-MSDTC-C ALWAYSON-MSDTC-C Add-ClusterResourceDependency MSDTC-ALWAYSON-MSDTC-C\
    \ \"Cluster Disk 3\" #Bring the Role online Start-ClusterGroup ALWAYSON-MSDTC-C\

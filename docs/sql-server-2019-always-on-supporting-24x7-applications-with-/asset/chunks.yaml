    # SQL Server 故障转移群集配置


    ### TempDB 选项卡

    `TempDB` 选项卡显示在图 4-15 中。此选项卡允许您配置 `TempDB` 数据库的属性。这很重要，因为 `TempDB` 需要正确的大小和处理器设置以避免成为实例的瓶颈。设置将默认为推荐配置，即每个处理器核心一个文件，最多八个。这被认为是最理想的文件数量，以避免对系统页面（如
    `GAM`、`SGAM` 和 `PFS` 页面）的争用。`TempDB` 的正确大小应通过容量规划练习来估算。我们将配置 `TempDB` 的初始大小为每个文件
    60MB（总计 240MB）。我们还将 `TempDB` 配置为驻留在 `TempDB` 卷上。在我们的场景中，我们还将设置文件位置指向我们的 `TempDB`
    卷。

    ![图 4-15 ¶ 安装 SQL Server 故障转移群集 – TempDB 选项卡](img/394392_3_En_4_Fig15_HTML.jpg)

    图 4-15 ¶ 安装 SQL Server 故障转移群集 – TempDB 选项卡


    ### MaxDOP 选项卡

    `MaxDOP` 选项卡显示在图 4-16 中，允许您配置实例内运行查询的默认最大并行度。默认值是根据可用核心数计算得出，最多为八个。然而，如果需要，可以覆盖此设置。例如，对于托管小型数据库且工作负载配置文件为
    `OLTP`（联机事务处理）的实例，其中同时运行许多小型查询，有时最好降低 `MaxDOP` 值。

    ![图 4-16 ¶ 安装 SQL Server 故障转移群集 – MaxDOP 选项卡](img/394392_3_En_4_Fig16_HTML.jpg)

    图 4-16 ¶ 安装 SQL Server 故障转移群集 – MaxDOP 选项卡


    **提示**

    将 `MaxDOP` 设置为 0 允许使用所有可用处理器来处理使用并行查询计划运行的查询。


    ### Memory 选项卡

    图 4-17 说明了 Memory 选项卡。在这里，您可以指定是否希望使用默认配置，用于可分配给实例的最小和最大内存量；使用安装向导计算的推荐值；或指定您自己的值。要指定您自己的首选值，请选择推荐选项，输入您的值，并选中“单击此处接受
    `SQL Server` 数据库引擎的推荐内存配置”复选框。如果您希望遵循安装程序的建议，也必须使用此复选框。

    ![图 4-17 ¶ 安装 SQL Server 故障转移群集 – Memory 选项卡](img/394392_3_En_4_Fig17_HTML.jpg)

    图 4-17 ¶ 安装 SQL Server 故障转移群集 – Memory 选项卡


    **提示**

    关于 `MaxDOP` 和 Memory 配置方法的完整讨论可在 Apress 出版的 *Pro SQL Server 2019 管理* 中找到，可在 [www.apress.com/gb/book/9781484250884#otherversion=9781484250891](http://www.apress.com/gb/book/9781484250884%2523otherversion%253D9781484250891)
    购买。


    ### FILESTREAM 选项卡

    `Database Engine Configuration` 页面上的 `FILESTREAM` 选项卡允许您启用并配置 `SQL Server` `FILESTREAM`
    功能的访问级别，如图 4-18 所示。如果您希望使用 `SQL Server` 的 `FileTable` 功能，则还必须启用 `FILESTREAM`。`FILESTREAM`
    和 `FileTable` 提供了以非结构化方式在 Windows 文件夹结构中存储数据的能力，同时仍能从 `SQL Server` 管理和查询此数据。

    ![图 4-18 ¶ 安装 SQL Server 故障转移群集实例 – FILESTREAM 选项卡](img/394392_3_En_4_Fig18_HTML.jpg)

    图 4-18 ¶ 安装 SQL Server 故障转移群集实例 – FILESTREAM 选项卡


    在检查完 `Feature Configuration Rules` 后，向导的 `Ready to Install` 页面将显示。此向导页面提供了安装实用程序将执行的操作摘要。在此页面上选择
    Install 将开始实例安装。安装完成后，应查看 `Complete` 页面。


    ## 使用 PowerShell 安装实例

    当然，我们可以使用 `PowerShell` 而不是使用 GUI 来安装 `AlwaysOn` 故障转移群集实例。要从 `PowerShell` 安装 `AlwaysOn`
    故障转移群集实例，我们可以使用 `SQL Server` 的 `setup.exe` 应用程序，并指定 `InstallFailoverCluster` 操作。


    当您执行群集实例的命令行安装时，除了安装 `SQL Server` 单机实例时强制要求的参数外，还需要表 4-1 中的参数。表 4-1


    群集实例安装所需的参数


    | 参数 || 用法 |

    | --- | --- |

    | `/FAILOVERCLUSTERIPADDRESSES` || 指定实例要使用的 IP 地址，格式为 *<IP Type>;<address>;<network
    name>;<subnet mask>.* 对于多子网群集，IP 地址以空格分隔。 |

    | --- | --- |

    | `/FAILOVERCLUSTERNETWORKNAME` || 群集实例的虚拟名称。 |

    | `/INSTALLSQLDATADIR` || 放置 `SQL Server` 数据文件的文件夹。这必须是群集磁盘。 |


    在安装介质的根目录下运行它时，列表 4-1 中的脚本会执行刚刚演示的相同安装。

    ```

    .\SETUP.EXE /IACCEPTSQLSERVERLICENSETERMS /ACTION="InstallFailoverCluster" /FEATURES=SQL,IS
    /INSTANCENAME="MSSQLSERVER" /SQLSVCACCOUNT="ALWAYSON\\SQLServiceAccount" /SQLSVCPASSWORD="Pa$$w0rd"
    /AGTSVCACCOUNT="ALWAYSON\\SQLServiceAccount" /AGTSVCPASSWORD="Pa$$w0rd" /SQLSYSADMINACCOUNTS="ALWAYSO\\SQLAdmin"
    /SQLMAXDOP="1" /FAILOVERCLUSTERIPADDRESSES="IPv4;10.0.0.9;Cluster Network 2;255.255.255.0"
    /FAILOVERCLUSTERDISKS="Cluster Disk 1" "Cluster Disk 2" "Cluster Disk 3" /FAILOVERCLUSTERNETWORKNAME="ALWAYSON-SQL-C"
    /INSTALLSQLDATADIR="F:\\" /SQLUSERDBLOGDIR="L:\\MSSQL15.MSSQLSERVER\\MSSQL\\Logs"
    /SQLTEMPDBDIR="T:\\MSSQL15.MSSQLSERVER\\MSSQL\\TempDB" /SQLTEMPDBLOGDIR="T:\\MSSQL15.MSSQLSERVER\\MSSQL\\TempDB"
    /SQLMAXMEMORY="2048" /SQLMINMEMORY="1024" /qs

    ```

    列表 4-1

    使用 PowerShell 安装 AlwaysOn 故障转移群集实例


    ## 添加节点

    安装群集时下一步应执行的操作是添加第二个节点。未能添加第二个节点会导致实例保持在线，但没有高可用性，因为第二个节点无法接管角色的所有权。要配置第二个节点，您需要登录到被动群集节点并从
    `SQL Server Installation Center` 的 Installation 选项卡中选择 `Add Node to SQL Server
    Failover Cluster` 选项。这会调用 `Add a Failover Cluster Node Wizard`。此向导的第一页是 `Product
    Key` 页面。就像安装实例时一样，您需要使用此屏幕为 `SQL Server` 提供产品密钥。不指定产品密钥只会让您选择安装 `Evaluation Edition`，并且由于它在
    180 天后过期，因此对于高可用性来说可能不是最明智的选择。


    向导接下来的 `License Terms` 页面要求您阅读并接受 `SQL Server` 的许可条款。此外，您需要指定是否希望参与 `Microsoft`
    的 `Customer Experience Improvement Program`。如果您选择此选项，则错误报告将被捕获并发送到 `Microsoft`。


    在您接受许可条款后，会运行规则检查以确保满足所有条件，以便您可以继续安装。在向导检查 `Microsoft` 更新并安装安装所需设置文件后，会进行另一次规则检查，以确保将节点添加到群集的规则得到满足。


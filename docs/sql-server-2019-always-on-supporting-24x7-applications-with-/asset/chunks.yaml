- raw: "| operational\\_state  || Indicates the current operational state of the replica.\
    \ Possible values are• 0 – Indicates a failover is pending• 1 – Indicates the\
    \ state is pending• 2 – Indicates online• 3 – Indicates offline• 4 – Indicates\
    \ failed• 5 – Indicates failed, with no quorum• NULL – Indicates the Replica is\
    \ not local |\n\n| operational\\_state\\_desc || A textual description of the\
    \ operational state. Possible values are• PENDING\\_FAILOVER• PENDING• ONLINE• OFFLINE• FAILED• FAILED\\\
    _NO\\_QUORUM• NULL |\n\n| connected\\_state   || Indicates if a Secondary Replica\
    \ is currently connected to the Primary Replica. Possible values are• 0 – Indicates\
    \ the Replica is disconnected from the Primary• 1 – Indicates that the Replica\
    \ is connected to the Primary |\n\n| connected\\_state\\_desc || A textual description\
    \ of the connected state. Possible values are• DISCONNECTED• CONNECTED |\n\n|\
    \ recovery\\_health || Indicates if databases within the Availability Group are\
    \ online. Possible values are• 0 – Indicates that at least one of the databases\
    \ is not online• 1 – Indicates that all of the databases are online• NULL – Indicates\
    \ the Availability Group is not local |\n\n| recovery\\_health\\_desc || A textual\
    \ description of the recovery\\_health. Possible values are• ONLINE\\_IN\\_PROGRESS• ONLINE• NULL\
    \ |\n\n| synchronization\\_health   || Indicates the synchronization state of\
    \ the Availability Group’s databases. Possible values are• 0 – Indicates that\
    \ at least one database is in the NOT SYNCHRONIZING state. This is known as Not\
    \ Healthy• 1 – Indicates that at least one database is not in the ideal synchronization\
    \ state. This is known as Partially Healthy The ideal state will be• SYNCHRONIZED –\
    \ For synchronous-commit Replicas• SYNCHRONIZING – For asynchronous-commit Replicas• 2 –\
    \ Indicates that all databases are in the ideal state. This is known as Healthy\
    \ |\n\n| synchronization\\_health\\_desc || A textual description of the synchronization\
    \ health state. Possible values are• NOT\\_HEALTHY• PARTIALLY\\_HEALTHY• HEALTHY\
    \ |\n\n| last\\_connect\\_error\\_number || The error number of the last connection\
    \ error |\n\n| last\\_connect\\_error\\_description || The description of the\
    \ last connection error |\n\n| last\\_connect\\_error\\_timestamp   || The date\
    \ and time of the last connection error |\n\nThe query in Listing [10-4](#394392_3_En_10_Chapter.xhtml#PC4)\
    \ demonstrates how to return the time and reason of the last connection error.\
    \ This will indicate when and why failover occurred. One row will be returned\
    \ for each combination of Replica and Availability Group. You will notice that\
    \ we join the sys.dm\\_hadr\\_availability\\_replica\\_states DMV to the sys.availability\\\
    _replicas and sys.availability\\_groups DMVs, to retrieve the names of the nodes\
    \ that host the Replicas and the names of the Availability Groups. SELECT        ar.replica\\\
    _server\\_name       ,ag.name       ,ars.last\\_connect\\_error\\_description\
    \       ,ars.last\\_connect\\_error\\_timestamp FROM sys.dm\\_hadr\\_availability\\\
    _replica\\_states ars INNER JOIN sys.availability\\_replicas ar       ON ar.group\\\
    _id = ars.group\\_id             AND ars.replica\\_id = ar.replica\\_id INNER\
    \ JOIN sys.availability\\_groups ag       ON ag.group\\_id = ar.group\\_id ; Listing\
    \ 10-4 \n\nDetermine Last Failover Time and Reason\n\n### Assessing the State\
    \ of Availability Databases\n\nYou may have noticed that the sys.dm\\_hard\\_availability\\\
    _replica\\_states DMV will provide details of Availability Groups that contain\
    \ databases that are not in a healthy state. The results are not granular enough,\
    \ however, for you to discover which databases are not healthy. This information\
    \ can be retrieved from the sys.dm\\_hadr\\_database\\_replica\\_states DMV, which\
    \ returns the columns detailed in Table [10-6](#394392_3_En_10_Chapter.xhtml#Tab6).\
    \ Table 10-6 \n\nsys.dm\\_hadr\\_database\\_replica\\_states Columns \n\n| Column\
    \ || Description |\n\n| --- | --- |\n\n| database\\_id || The ID of the database\
    \ |\n\n| --- | --- |\n\n| group\\_id || The Availability Group GUID |\n\n| replica\\\
    _id || The Availability Replica GUID |\n\n| group\\_database\\_id || The ID of\
    \ the database, within the Availability Group |\n\n| is\\_local || Indicates if\
    \ the database is local of remote. Possible values are• 0 – Indicates that the\
    \ database is not local to the instance• 1 – Indicates that the database is local\
    \ to the instance |\n\n| is\\_primary\\_replica || Indicates if the database replica\
    \ currently has the role of primary or secondary. Possible values are• 0 – Indicates\
    \ a Secondary Database Replica• 1 – Indicates a Primary Database Replica |\n\n\
    | synchronization\\_state  || Indicates the state of the database synchronization.\
    \ Possible values are• 0 – Indicates not synchronizing• 1 – Indicates synchronizing• 2 –\
    \ Indicates synchronized• 3 – Indicates that the state is reverting. This means\
    \ that the secondary is at the part of the undo stage, where it is retrieving\
    \ pages from the primary• 4 – Indicates that the state is initializing. This means\
    \ that the secondary is at the part of the undo phase, where required log records\
    \ are currently being shipped and hardened |\n\n| synchronization\\_state\\_desc\
    \ || A textual description of the synchronization state. Possible values are• NOT\
    \ SYNCHRONIZING• SYNCHRONIZING• SYNCHRONIZED• REVERTING• INITIALIZING |\n\n| is\\\
    _commit\\_participant || Indicates if transaction commits are synchronized. Databases\
    \ on asynchronous replicas will always report 0 and the value is only accurate\
    \ for databases on synchronous replicas, for the primary database. Possible values\
    \ are• 0 – Indicates that transaction commit is not synchronized• 1 – Indicates\
    \ that transaction commit is synchronized |\n\n| synchronization\\_health || Indicates\
    \ the synchronization state of the database. Possible values are• 0 – Indicates\
    \ Not Healthy. This means that the database is not synchronizing• 1 – Indicates\
    \ Partially Healthy. This means that the database is synchronizing• 2 – Indicates\
    \ Healthy. This means that the database is synchronized |\n\n| synchronization\\\
    _health\\_desc || A textual description of the synchronization health. Possible\
    \ values are• NOT\\_HEALTHY• PARTIALLY\\_HEALTHY• HEALTHY |\n\n| database\\_state\
    \  || Indicates the current state of the database. The value reflects the value\
    \ in the sys.databases catalog view. Possible values are• 0 – Indicates that the\
    \ database is Online• 1 – Indicates that the database is Restoring• 2 – Indicates\
    \ that the database is Recovering• 3 – Indicates that the database has a state\
    \ of Recovery pending• 4 – Indicates that the database is Suspect• 5 – Indicates\
    \ that the database is in Emergency mode• 6 – Indicates that the database is Offline\
    \ |\n\n| database\\_state\\_desc  || A textual description of the database state.\
    \ Possible values are• ONLINE• RESTORING• RECOVERING• RECOVERY\\_PENDING• SUSPECT• EMERGENCY• OFFLINE\
    \ |\n\n| is\\_suspended || Indicates if the database is suspended. Possible values\
    \ are• 0 – Indicates resumed• 1 – Indicates suspended |\n\n| suspend\\_reason\
    \ || If the database is suspended, the suspend\\_reason column indicates the reason.\
    \ Possible values are• 0 – Indicates a user manually suspended the data movement• 1 –\
    \ Indicates a suspension following a forced failover• 2 – Indicates that an error\
    \ occurred during the redo phase• 3 – Indicates that there was an error during\
    \ the log capture• 4 – Indicates that there was an error when writing the log• 5 –\
    \ Indicates the database was suspended prior to a restart• 6 – Indicates that\
    \ there was an error during the undo phase• 7 – Indicates a log chain mismatch\
    \ error• 8 – Indicates that there was an error in the calculation of the secondary\
    \ replica’s synchronization point |\n\n| suspend\\_reason\\_desc   || A textual\
    \ description of the suspend\\_reason column. Possible values are• SUSPEND\\_FROM\\\
    _USER• SUSPEND\\_FROM\\_PARTNER• SUSPEND\\_FROM\\_REDO• SUSPEND\\_FROM\\_CAPTURE• SUSPEND\\\
    _FROM\\_APPLY• SUSPEND\\_FROM\\_RESTART• SUSPEND\\_FROM\\_UNDO• SUSPEND\\_FROM\\\
    _REVALIDATION• SUSPEND\\_FROM\\_XRF\\_UPDATE |"
  fmt: "\n## Availability Replica States Columns\n\n| Column | Description |\n|---|---|\n\
    | `operational_state` | Indicates the current operational state of the replica.\
    \ Possible values are • 0 – Indicates a failover is pending • 1 – Indicates the\
    \ state is pending • 2 – Indicates online • 3 – Indicates offline • 4 – Indicates\
    \ failed • 5 – Indicates failed, with no quorum • NULL – Indicates the Replica\
    \ is not local |\n| `operational_state_desc` | A textual description of the operational\
    \ state. Possible values are • PENDING_FAILOVER • PENDING • ONLINE • OFFLINE •\
    \ FAILED • FAILED_NO_QUORUM • NULL |\n| `connected_state` | Indicates if a Secondary\
    \ Replica is currently connected to the Primary Replica. Possible values are •\
    \ 0 – Indicates the Replica is disconnected from the Primary • 1 – Indicates that\
    \ the Replica is connected to the Primary |\n| `connected_state_desc` | A textual\
    \ description of the connected state. Possible values are • DISCONNECTED • CONNECTED\
    \ |\n| `recovery_health` | Indicates if databases within the Availability Group\
    \ are online. Possible values are • 0 – Indicates that at least one of the databases\
    \ is not online • 1 – Indicates that all of the databases are online • NULL –\
    \ Indicates the Availability Group is not local |\n| `recovery_health_desc` |\
    \ A textual description of the `recovery_health`. Possible values are • ONLINE_IN_PROGRESS\
    \ • ONLINE • NULL |\n| `synchronization_health` | Indicates the synchronization\
    \ state of the Availability Group’s databases. Possible values are • 0 – Indicates\
    \ that at least one database is in the NOT SYNCHRONIZING state. This is known\
    \ as Not Healthy • 1 – Indicates that at least one database is not in the ideal\
    \ synchronization state. This is known as Partially Healthy The ideal state will\
    \ be • SYNCHRONIZED – For synchronous-commit Replicas • SYNCHRONIZING – For asynchronous-commit\
    \ Replicas • 2 – Indicates that all databases are in the ideal state. This is\
    \ known as Healthy |\n| `synchronization_health_desc` | A textual description\
    \ of the synchronization health state. Possible values are • NOT_HEALTHY • PARTIALLY_HEALTHY\
    \ • HEALTHY |\n| `last_connect_error_number` | The error number of the last connection\
    \ error |\n| `last_connect_error_description` | The description of the last connection\
    \ error |\n| `last_connect_error_timestamp` | The date and time of the last connection\
    \ error |\n\n## Determine Last Failover Time and Reason\n\nThe query in Listing\
    \ `10-4` demonstrates how to return the time and reason of the last connection\
    \ error. This will indicate when and why failover occurred. One row will be returned\
    \ for each combination of Replica and Availability Group. You will notice that\
    \ we join the `sys.dm_hadr_availability_replica_states` DMV to the `sys.availability_replicas`\
    \ and `sys.availability_groups` DMVs, to retrieve the names of the nodes that\
    \ host the Replicas and the names of the Availability Groups.\n\n```sql\nSELECT\n\
    \    ar.replica_server_name\n    ,ag.name\n    ,ars.last_connect_error_description\n\
    \    ,ars.last_connect_error_timestamp\nFROM sys.dm_hadr_availability_replica_states\
    \ ars\nINNER JOIN sys.availability_replicas ar\n    ON ar.group_id = ars.group_id\n\
    \    AND ars.replica_id = ar.replica_id\nINNER JOIN sys.availability_groups ag\n\
    \    ON ag.group_id = ar.group_id;\n```\nListing 10-4\n\n### Assessing the State\
    \ of Availability Databases\n\nYou may have noticed that the `sys.dm_hard_availability_replica_states`\
    \ DMV will provide details of Availability Groups that contain databases that\
    \ are not in a healthy state. The results are not granular enough, however, for\
    \ you to discover which databases are not healthy. This information can be retrieved\
    \ from the `sys.dm_hadr_database_replica_states` DMV, which returns the columns\
    \ detailed in Table `10-6`.\n\nTable 10-6\n`sys.dm_hadr_database_replica_states`\
    \ Columns\n\n| Column | Description |\n|---|---|\n| `database_id` | The ID of\
    \ the database |\n| `group_id` | The Availability Group GUID |\n| `replica_id`\
    \ | The Availability Replica GUID |\n| `group_database_id` | The ID of the database,\
    \ within the Availability Group |\n| `is_local` | Indicates if the database is\
    \ local of remote. Possible values are • 0 – Indicates that the database is not\
    \ local to the instance • 1 – Indicates that the database is local to the instance\
    \ |\n| `is_primary_replica` | Indicates if the database replica currently has\
    \ the role of primary or secondary. Possible values are • 0 – Indicates a Secondary\
    \ Database Replica • 1 – Indicates a Primary Database Replica |\n| `synchronization_state`\
    \ | Indicates the state of the database synchronization. Possible values are •\
    \ 0 – Indicates not synchronizing • 1 – Indicates synchronizing • 2 – Indicates\
    \ synchronized • 3 – Indicates that the state is reverting. This means that the\
    \ secondary is at the part of the undo stage, where it is retrieving pages from\
    \ the primary • 4 – Indicates that the state is initializing. This means that\
    \ the secondary is at the part of the undo phase, where required log records are\
    \ currently being shipped and hardened |\n| `synchronization_state_desc` | A textual\
    \ description of the synchronization state. Possible values are • NOT SYNCHRONIZING\
    \ • SYNCHRONIZING • SYNCHRONIZED • REVERTING • INITIALIZING |\n| `is_commit_participant`\
    \ | Indicates if transaction commits are synchronized. Databases on asynchronous\
    \ replicas will always report 0 and the value is only accurate for databases on\
    \ synchronous replicas, for the primary database. Possible values are • 0 – Indicates\
    \ that transaction commit is not synchronized • 1 – Indicates that transaction\
    \ commit is synchronized |\n| `synchronization_health` | Indicates the synchronization\
    \ state of the database. Possible values are • 0 – Indicates Not Healthy. This\
    \ means that the database is not synchronizing • 1 – Indicates Partially Healthy.\
    \ This means that the database is synchronizing • 2 – Indicates Healthy. This\
    \ means that the database is synchronized |\n| `synchronization_health_desc` |\
    \ A textual description of the synchronization health. Possible values are • NOT_HEALTHY\
    \ • PARTIALLY_HEALTHY • HEALTHY |\n| `database_state` | Indicates the current\
    \ state of the database. The value reflects the value in the `sys.databases` catalog\
    \ view. Possible values are • 0 – Indicates that the database is Online • 1 –\
    \ Indicates that the database is Restoring • 2 – Indicates that the database is\
    \ Recovering • 3 – Indicates that the database has a state of Recovery pending\
    \ • 4 – Indicates that the database is Suspect • 5 – Indicates that the database\
    \ is in Emergency mode • 6 – Indicates that the database is Offline |\n| `database_state_desc`\
    \ | A textual description of the database state. Possible values are • ONLINE\
    \ • RESTORING • RECOVERING • RECOVERY_PENDING • SUSPECT • EMERGENCY • OFFLINE\
    \ |\n| `is_suspended` | Indicates if the database is suspended. Possible values\
    \ are • 0 – Indicates resumed • 1 – Indicates suspended |\n| `suspend_reason`\
    \ | If the database is suspended, the `suspend_reason` column indicates the reason.\
    \ Possible values are • 0 – Indicates a user manually suspended the data movement\
    \ • 1 – Indicates a suspension following a forced failover • 2 – Indicates that\
    \ an error occurred during the redo phase • 3 – Indicates that there was an error\
    \ during the log capture • 4 – Indicates that there was an error when writing\
    \ the log • 5 – Indicates the database was suspended prior to a restart • 6 –\
    \ Indicates that there was an error during the undo phase • 7 – Indicates a log\
    \ chain mismatch error • 8 – Indicates that there was an error in the calculation\
    \ of the secondary replica’s synchronization point |\n| `suspend_reason_desc`\
    \ | A textual description of the `suspend_reason` column. Possible values are\
    \ • SUSPEND_FROM_USER • SUSPEND_FROM_PARTNER • SUSPEND_FROM_REDO • SUSPEND_FROM_CAPTURE\
    \ • SUSPEND_FROM_APPLY • SUSPEND_FROM_RESTART • SUSPEND_FROM_UNDO • SUSPEND_FROM_REVALIDATION\
    \ • SUSPEND_FROM_XRF_UPDATE |\n"
  trans: "\n## 可用性副本状态列\n\n| 列 | 描述 |\n|---|---|\n| `operational_state` | 表示副本的当前运行状态。可能的值为\
    \ • 0 – 表示故障转移待处理 • 1 – 表示状态待处理 • 2 – 表示在线 • 3 – 表示离线 • 4 – 表示失败 • 5 – 表示失败，无仲裁\
    \ • NULL – 表示副本不是本地的 |\n| `operational_state_desc` | 运行状态的文本描述。可能的值为 • PENDING_FAILOVER\
    \ • PENDING • ONLINE • OFFLINE • FAILED • FAILED_NO_QUORUM • NULL |\n| `connected_state`\
    \ | 表示辅助副本当前是否连接到主副本。可能的值为 • 0 – 表示副本与主副本断开连接 • 1 – 表示副本已连接到主副本 |\n| `connected_state_desc`\
    \ | 连接状态的文本描述。可能的值为 • DISCONNECTED • CONNECTED |\n| `recovery_health` | 表示可用性组中数据库是否在线。可能的值为\
    \ • 0 – 表示至少有一个数据库未在线 • 1 – 表示所有数据库均在线 • NULL – 表示可用性组不是本地的 |\n| `recovery_health_desc`\
    \ | `recovery_health` 的文本描述。可能的值为 • ONLINE_IN_PROGRESS • ONLINE • NULL |\n| `synchronization_health`\
    \ | 表示可用性组数据库的同步状态。可能的值为 • 0 – 表示至少有一个数据库处于 NOT SYNCHRONIZING 状态。这称为不健康 • 1 –\
    \ 表示至少有一个数据库未处于理想同步状态。这称为部分健康 理想状态为 • SYNCHRONIZED – 用于同步提交副本 • SYNCHRONIZING\
    \ – 用于异步提交副本 • 2 – 表示所有数据库均处于理想状态。这称为健康 |\n| `synchronization_health_desc` | 同步健康状态的文本描述。可能的值为\
    \ • NOT_HEALTHY • PARTIALLY_HEALTHY • HEALTHY |\n| `last_connect_error_number`\
    \ | 最后一次连接错误的错误号 |\n| `last_connect_error_description` | 最后一次连接错误的描述 |\n| `last_connect_error_timestamp`\
    \ | 最后一次连接错误的日期和时间 |\n\n## 确定最后一次故障转移的时间和原因\n\nListing `10-4` 中的查询演示了如何返回最后一次连接错误的时间和原因。这将指示故障转移发生的时间和原因。每个副本和可用性组的组合将返回一行。你会注意到我们将\
    \ `sys.dm_hadr_availability_replica_states` DMV 连接到 `sys.availability_replicas`\
    \ 和 `sys.availability_groups` DMV，以检索托管副本的节点名称和可用性组名称。\n\n```sql\nSELECT\n   \
    \ ar.replica_server_name\n    ,ag.name\n    ,ars.last_connect_error_description\n\
    \    ,ars.last_connect_error_timestamp\nFROM sys.dm_hadr_availability_replica_states\
    \ ars\nINNER JOIN sys.availability_replicas ar\n    ON ar.group_id = ars.group_id\n\
    \    AND ars.replica_id = ar.replica_id\nINNER JOIN sys.availability_groups ag\n\
    \    ON ag.group_id = ar.group_id;\n```\n清单 10-4\n\n### 评估可用性数据库的状态\n\n你可能已经注意到，`sys.dm_hard_availability_replica_states`\
    \ DMV 会提供包含不健康状态数据库的可用性组的详细信息。然而，结果不够细化，无法让你发现哪些数据库不健康。此信息可以从 `sys.dm_hadr_database_replica_states`\
    \ DMV 中检索，该视图返回表 `10-6` 中详细列出的列。\n\n表 10-6\n`sys.dm_hadr_database_replica_states`\
    \ 列\n\n| 列 | 描述 |\n|---|---|\n| `database_id` | 数据库的 ID |\n| `group_id` | 可用性组\
    \ GUID |\n| `replica_id` | 可用性副本 GUID |\n| `group_database_id` | 可用性组内的数据库 ID\
    \ |\n| `is_local` | 表示数据库是本地还是远程。可能的值为 • 0 – 表示数据库不是实例本地的 • 1 – 表示数据库是实例本地的 |\n\
    | `is_primary_replica` | 表示数据库副本当前是否具有主或辅助角色。可能的值为 • 0 – 表示辅助数据库副本 • 1 – 表示主数据库副本\
    \ |\n| `synchronization_state` | 表示数据库同步的状态。可能的值为 • 0 – 表示未同步 • 1 – 表示正在同步 • 2\
    \ – 表示已同步 • 3 – 表示状态为回滚。这意味着辅助副本处于撤销阶段的部分，正在从主副本检索页面 • 4 – 表示状态为初始化。这意味着辅助副本处于撤销阶段的部分，所需的日志记录当前正在传输并硬化\
    \ |\n| `synchronization_state_desc` | 同步状态的文本描述。可能的值为 • NOT SYNCHRONIZING • SYNCHRONIZING\
    \ • SYNCHRONIZED • REVERTING • INITIALIZING |\n| `is_commit_participant` | 表示事务提交是否已同步。异步副本上的数据库始终报告\
    \ 0，且该值仅对同步副本上的主数据库准确。可能的值为 • 0 – 表示事务提交未同步 • 1 – 表示事务提交已同步 |\n| `synchronization_health`\
    \ | 表示数据库的同步状态。可能的值为 • 0 – 表示不健康。这意味着数据库未同步 • 1 – 表示部分健康。这意味着数据库正在同步 • 2 – 表示健康。这意味着数据库已同步\
    \ |\n| `synchronization_health_desc` | 同步健康的文本描述。可能的值为 • NOT_HEALTHY • PARTIALLY_HEALTHY\
    \ • HEALTHY |\n| `database_state` | 表示数据库的当前状态。该值反映 `sys.databases` 目录视图中的值。可能的值为\
    \ • 0 – 表示数据库为联机 • 1 – 表示数据库正在还原 • 2 – 表示数据库正在恢复 • 3 – 表示数据库处于恢复挂起状态 • 4 – 表示数据库为可疑\
    \ • 5 – 表示数据库处于紧急模式 • 6 – 表示数据库为脱机 |\n| `database_state_desc` | 数据库状态的文本描述。可能的值为\
    \ • ONLINE • RESTORING • RECOVERING • RECOVERY_PENDING • SUSPECT • EMERGENCY •\
    \ OFFLINE |\n| `is_suspended` | 表示数据库是否已挂起。可能的值为 • 0 – 表示已恢复 • 1 – 表示已挂起 |\n|\
    \ `suspend_reason` | 如果数据库已挂起，`suspend_reason` 列指示原因。可能的值为 • 0 – 表示用户手动挂起数据移动\
    \ • 1 – 表示强制故障转移后的挂起 • 2 – 表示在重做阶段发生错误 • 3 – 表示在日志捕获期间发生错误 • 4 – 表示写入日志时发生错误 •\
    \ 5 – 表示数据库在重新启动前已挂起 • 6 – 表示在撤销阶段发生错误 • 7 – 表示日志链不匹配错误 • 8 – 表示在计算辅助副本同步点时发生错误\
    \ |\n| `suspend_reason_desc` | `suspend_reason` 列的文本描述。可能的值为 • SUSPEND_FROM_USER\
    \ • SUSPEND_FROM_PARTNER • SUSPEND_FROM_REDO • SUSPEND_FROM_CAPTURE • SUSPEND_FROM_APPLY\
    \ • SUSPEND_FROM_RESTART • SUSPEND_FROM_UNDO • SUSPEND_FROM_REVALIDATION • SUSPEND_FROM_XRF_UPDATE\
    \ |\n"

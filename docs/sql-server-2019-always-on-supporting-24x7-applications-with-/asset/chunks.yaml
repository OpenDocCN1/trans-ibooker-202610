- raw: "| status || The current status of the node. Possible values are• 0 – Indicates\
    \ the node is up• 1 – Indicates the node is down• 2 – Indicates the node is paused• 3 –\
    \ Indicates the node is currently joining the cluster• 4 – Indicates that the\
    \ status is unknown |\n\n| status\\_description  || A textual description of the\
    \ status. Possible values are• Up• Down• Paused• Joining• Unknown |\n\n| is\\\
    _current\\_owner || Indicates if the instance is currently hosted by the node.\
    \ Possible values are• 0 – Indicates the node does not own the instance• 1 – Indicates\
    \ that the node does own the instance |\n\nThe query in Listing [10-1](#394392_3_En_10_Chapter.xhtml#PC1)\
    \ will return the name of the cluster node that currently hosts the instance.\
    \ SELECT NodeName FROM sys.dm\\_os\\_cluster\\_nodes WHERE is\\_current\\_owner\
    \ = 1 ; Listing 10-1 \n\nDiscover the Node That Hosts the Instance\n\n### Viewing\
    \ Health Check Configuration\n\nIf assisting the Windows administration team,\
    \ with the repeated failover of a clustered instance, a DBA may wish to expose\
    \ details of what conditions can cause a failover, to ensure that an appropriate\
    \ level is configured. This can be achieved by using the sys.dm\\_os\\_cluster\\\
    _properties DMV, which returns the columns detailed in Table [10-2](#394392_3_En_10_Chapter.xhtml#Tab2).\
    \ Table 10-2 \n\nsys.dm\\_os\\_cluster\\_properties Columns\n\n| Column || Description\
    \ |\n\n| --- | --- |\n\n| VerboseLogging || Indicates the logging level used by\
    \ the cluster. Possible values are• 0 – Indicates that logging is turned off• 1 –\
    \ Indicates that only errors are logged• 2 – Indicates that errors and warning\
    \ are logged |\n\n| --- | --- |\n\n| SQLDumperDumpFlags || Specifies the type\
    \ of dump file that SQLDumper will generate. Possible values are• 0x0120 – Indicates\
    \ a Minidump• 0x0110 – Indicates a Full Dump• 0x8100 – Indicates a Filtered Dump\
    \ |\n\n| SQLDumperDumpPath  || Specifies the file path where SQLDumper will output\
    \ the dump files |\n\n| SQLDumperDumpTimeOut || The timeout value for SQLDumper,\
    \ when creating a dump file. Specified in milliseconds |\n\n| FailureConditionLevel\
    \ || The level of failure that will cause a failover to occur. A full description\
    \ of failure condition levels can be found in Table [10-3](#394392_3_En_10_Chapter.xhtml#Tab3)\
    \ |\n\n| HealthCheckTimeout || The duration that the database engine will wait\
    \ for health information to be returned before it will decide that the instance\
    \ is unresponsive |\n\nThe possible failure condition levels, returned by the\
    \ FailureConditionLevel column, are detailed in Table [10-3](#394392_3_En_10_Chapter.xhtml#Tab3).\
    \ Table 10-3 \n\nFailure Condition Levels \n\n| Condition Level || Description\
    \ |\n\n| --- | --- |\n\n| 0 || Automatic failover does not occur |\n\n| --- |\
    \ --- |\n\n| 1 || Automatic failover occurs when the SQL Server service is down\
    \ |\n\n| 2 || Automatic failover will occur when• Level 1 conditions are met• The\
    \ HealthCheckTimeout value is exceeded |\n\n| 3 || Automatic failover will occur\
    \ when• Level 2 conditions are met• The health check returns System Error |\n\n\
    | 4 || Automatic failover will occur when• Level 3 conditions are met• The health\
    \ check returns Resource Error |\n\n| 5 || Automatic failover will occur when• Level\
    \ 4 conditions are met• The health check returns Query\\_Processing\\_Error |\n\
    \nThe query in Listing [10-2](#394392_3_En_10_Chapter.xhtml#PC2) will return the\
    \ current failover condition level and the current health check timeout value.\
    \ SELECT       FailureConditionLevel       , HealthCheckTimeout FROM sys.dm\\\
    _os\\_cluster\\_properties ; Listing 10-2 \n\nReturn Health Check Configuration\
    \ \n\nThe current health of the instance can be determined manually by using the\
    \ sp\\_server\\_diagnostics system stored procedure. The procedure accepts a single\
    \ parameter: @repeat\\_interval, which specifies how often the procedure should\
    \ return results, specified in seconds. If the parameter is omitted, then results\
    \ will only be returned once. If a value is passed for the parameter, then it\
    \ must be greater than 5. The procedure returns the result set detailed in Table\
    \ [10-4](#394392_3_En_10_Chapter.xhtml#Tab4). Table 10-4 \n\nColumns Returned\
    \ by sp\\_server\\_diagnostics\n\n| Column || Description |\n\n| --- | --- |\n\
    \n| creation\\_time || Indicates the time that the row was created |\n\n| ---\
    \ | --- |\n\n| component\\_type || Indicates the type of component. Possible values\
    \ are• Instance• AlwaysOn: Availability Group |\n\n| component\\_name || Indicates\
    \ the name of the component. Possible values are• system• resource• query\\_processing• io\\\
    _subsystem• events• \\[Availability Group name\\] |\n\n| state  || The health\
    \ status of the component. Possible values are• 0 – Indicates that the state is\
    \ unknown• 1 – Indicates that the state is clean (meaning healthy)• 2 – Indicates\
    \ that there are warnings• 3 – Indicates that there are errors |\n\n| state\\\
    _desc || A textual description of the component’s state. Possible values are• Unknown• Clean• Warnings• Errors\
    \ |\n\n| data || An XML representation of component-specific data. For example,\
    \ the resource component includes element specifying the available physical and\
    \ available virtual memory. It also includes attributes including a count of out\
    \ of memory exceptions |\n\nThe script in Listing [10-3](#394392_3_En_10_Chapter.xhtml#PC3)\
    \ will return the complete result set of the sp\\_server\\_diagnostics system\
    \ stored procedure, alongside values which have been shredded from the XML column,\
    \ to provide a quick view of the overall server CPU utilization, the CPU utilization\
    \ of the instance, and a count of any out of memory exceptions that may have occurred.\n\
    \nTip \n\nA discussion around shredding XML is beyond the scope of this book.\
    \ However, I recommend the Apress title *Expert Scripting and Automation for SQL\
    \ Server DBAs*, where a discussion around working with XML for administrative\
    \ purposes can be found. The book can be purchased at [www.apress.com/9781484219423](http://www.apress.com/9781484219423).\n\
    \nCREATE TABLE #Server\\_Diagnostics ( creation\\_time      DATETIME, component\\\
    _type     NVARCHAR(8), component\\_name     NVARCHAR(128), \\[state\\]            TINYINT,\
    \ state\\_desc         NVARCHAR(8), \\[data\\]             XML ) ; INSERT INTO\
    \ #Server\\_Diagnostics EXEC sp\\_server\\_diagnostics ; SELECT \\*, data.value('(/system/@systemCpuUtilization)\\\
    [1\\]','int') AS SystemCPUUtilization ,data.value('(/system/@sqlCpuUtilization)\\\
    [1\\]','int') AS SQLServerCPU ,data.value('(/resource/@outOfMemoryExceptions)\\\
    [1\\]','int') AS OutOfMemoryExceptions FROM ##Server\\_Diagnostics ; DROP TABLE\
    \ #Server\\_Diagnostics ; Listing 10-3 \n\nRetrieving Diagnostic Information\n\
    \n## AlwaysOn Availability Group Metadata\n\nMetadata can also be used to troubleshoot\
    \ issues with Availability Groups. The following sections will discuss some of\
    \ the most useful and interesting metadata objects, relating the Availability\
    \ Groups.\n\n### Determining the Last Failover Reason\n\nIf an Availability Group\
    \ has failed over, one of the first questions you are likely to want to answer\
    \ is “when and why?”. This question can be answered using the sys.dm\\_hadr\\\
    _availability\\_replica\\_states DMV. This object returns the columns detailed\
    \ in Table [10-5](#394392_3_En_10_Chapter.xhtml#Tab5). Table 10-5 \n\nsys.dm\\\
    _hadr\\_availability\\_replica\\_states \n\n| Column || Description |\n\n| ---\
    \ | --- |\n\n| replica\\_id || The GUID of the Replica |\n\n| --- | --- |\n\n\
    | group\\_id || The GUID of the Availability Group |\n\n| is\\_local || Indicates\
    \ if the Replica is local or remote. Possible values are• 0 – Indicates a remote\
    \ secondary• 1 – Indicates a local Replica |\n\n| role || Indicates the role that\
    \ is currently assigned to the Replica. Possible values are• 0 – Indicates that\
    \ the role is currently being resolved• 1 – Indicates that the Replica has the\
    \ Primary role• 2 – Indicates that the Replica currently has the Secondary role\
    \ |\n\n| role\\_desc  || A textual description of the Replica’s current role.\
    \ Possible values are• RESOLVING• PRIMARY• SECONDARY |"
  fmt: "\n| `status` || The current status of the node. Possible values are• 0 – Indicates\
    \ the node is up• 1 – Indicates the node is down• 2 – Indicates the node is paused• 3 –\
    \ Indicates the node is currently joining the cluster• 4 – Indicates that the\
    \ status is unknown |\n\n| `status_description` || A textual description of the\
    \ status. Possible values are• Up• Down• Paused• Joining• Unknown |\n\n| `is_current_owner`\
    \ || Indicates if the instance is currently hosted by the node. Possible values\
    \ are• 0 – Indicates the node does not own the instance• 1 – Indicates that the\
    \ node does own the instance |\n\nThe query in Listing [10-1](#394392_3_En_10_Chapter.xhtml#PC1)\
    \ will return the name of the cluster node that currently hosts the instance.\n\
    \n```\nSELECT NodeName FROM sys.dm_os_cluster_nodes WHERE is_current_owner = 1;\n\
    ```\nListing 10-1\n\nDiscover the Node That Hosts the Instance\n\n## Viewing Health\
    \ Check Configuration\n\nIf assisting the Windows administration team, with the\
    \ repeated failover of a clustered instance, a DBA may wish to expose details\
    \ of what conditions can cause a failover, to ensure that an appropriate level\
    \ is configured. This can be achieved by using the `sys.dm_os_cluster_properties`\
    \ DMV, which returns the columns detailed in Table [10-2](#394392_3_En_10_Chapter.xhtml#Tab2).\
    \ Table 10-2\n\n`sys.dm_os_cluster_properties` Columns\n\n| Column || Description\
    \ |\n\n| --- | --- |\n\n| `VerboseLogging` || Indicates the logging level used\
    \ by the cluster. Possible values are• 0 – Indicates that logging is turned off• 1 –\
    \ Indicates that only errors are logged• 2 – Indicates that errors and warning\
    \ are logged |\n\n| --- | --- |\n\n| `SQLDumperDumpFlags` || Specifies the type\
    \ of dump file that SQLDumper will generate. Possible values are• 0x0120 – Indicates\
    \ a Minidump• 0x0110 – Indicates a Full Dump• 0x8100 – Indicates a Filtered Dump\
    \ |\n\n| `SQLDumperDumpPath` || Specifies the file path where SQLDumper will output\
    \ the dump files |\n\n| `SQLDumperDumpTimeOut` || The timeout value for SQLDumper,\
    \ when creating a dump file. Specified in milliseconds |\n\n| `FailureConditionLevel`\
    \ || The level of failure that will cause a failover to occur. A full description\
    \ of failure condition levels can be found in Table [10-3](#394392_3_En_10_Chapter.xhtml#Tab3)\
    \ |\n\n| `HealthCheckTimeout` || The duration that the database engine will wait\
    \ for health information to be returned before it will decide that the instance\
    \ is unresponsive |\n\nThe possible failure condition levels, returned by the\
    \ `FailureConditionLevel` column, are detailed in Table [10-3](#394392_3_En_10_Chapter.xhtml#Tab3).\
    \ Table 10-3\n\nFailure Condition Levels\n\n| Condition Level || Description |\n\
    \n| --- | --- |\n\n| 0 || Automatic failover does not occur |\n\n| --- | --- |\n\
    \n| 1 || Automatic failover occurs when the SQL Server service is down |\n\n|\
    \ 2 || Automatic failover will occur when• Level 1 conditions are met• The `HealthCheckTimeout`\
    \ value is exceeded |\n\n| 3 || Automatic failover will occur when• Level 2 conditions\
    \ are met• The health check returns System Error |\n\n| 4 || Automatic failover\
    \ will occur when• Level 3 conditions are met• The health check returns Resource\
    \ Error |\n\n| 5 || Automatic failover will occur when• Level 4 conditions are\
    \ met• The health check returns Query_Processing_Error |\n\nThe query in Listing\
    \ [10-2](#394392_3_En_10_Chapter.xhtml#PC2) will return the current failover condition\
    \ level and the current health check timeout value.\n\n```\nSELECT\n    FailureConditionLevel\n\
    \    , HealthCheckTimeout\nFROM sys.dm_os_cluster_properties;\n```\nListing 10-2\n\
    \nReturn Health Check Configuration\n\nThe current health of the instance can\
    \ be determined manually by using the `sp_server_diagnostics` system stored procedure.\
    \ The procedure accepts a single parameter: `@repeat_interval`, which specifies\
    \ how often the procedure should return results, specified in seconds. If the\
    \ parameter is omitted, then results will only be returned once. If a value is\
    \ passed for the parameter, then it must be greater than 5. The procedure returns\
    \ the result set detailed in Table [10-4](#394392_3_En_10_Chapter.xhtml#Tab4).\
    \ Table 10-4\n\nColumns Returned by `sp_server_diagnostics`\n\n| Column || Description\
    \ |\n\n| --- | --- |\n\n| `creation_time` || Indicates the time that the row was\
    \ created |\n\n| --- | --- |\n\n| `component_type` || Indicates the type of component.\
    \ Possible values are• Instance• AlwaysOn: Availability Group |\n\n| `component_name`\
    \ || Indicates the name of the component. Possible values are• system• resource• query_processing• io_subsystem• events• [Availability\
    \ Group name] |\n\n| `state` || The health status of the component. Possible values\
    \ are• 0 – Indicates that the state is unknown• 1 – Indicates that the state is\
    \ clean (meaning healthy)• 2 – Indicates that there are warnings• 3 – Indicates\
    \ that there are errors |\n\n| `state_desc` || A textual description of the component’s\
    \ state. Possible values are• Unknown• Clean• Warnings• Errors |\n\n| `data` ||\
    \ An XML representation of component-specific data. For example, the resource\
    \ component includes element specifying the available physical and available virtual\
    \ memory. It also includes attributes including a count of out of memory exceptions\
    \ |\n\nThe script in Listing [10-3](#394392_3_En_10_Chapter.xhtml#PC3) will return\
    \ the complete result set of the `sp_server_diagnostics` system stored procedure,\
    \ alongside values which have been shredded from the XML column, to provide a\
    \ quick view of the overall server CPU utilization, the CPU utilization of the\
    \ instance, and a count of any out of memory exceptions that may have occurred.\n\
    \nTip\n\nA discussion around shredding XML is beyond the scope of this book. However,\
    \ I recommend the Apress title *Expert Scripting and Automation for SQL Server\
    \ DBAs*, where a discussion around working with XML for administrative purposes\
    \ can be found. The book can be purchased at [www.apress.com/9781484219423](http://www.apress.com/9781484219423).\n\
    \n```\nCREATE TABLE #Server_Diagnostics (\n    creation_time      DATETIME,\n\
    \    component_type     NVARCHAR(8),\n    component_name     NVARCHAR(128),\n\
    \    [state]            TINYINT,\n    state_desc         NVARCHAR(8),\n    [data]\
    \             XML\n);\nINSERT INTO #Server_Diagnostics EXEC sp_server_diagnostics;\n\
    SELECT *,\n    data.value('(/system/@systemCpuUtilization)[1]','int') AS SystemCPUUtilization,\n\
    \    data.value('(/system/@sqlCpuUtilization)[1]','int') AS SQLServerCPU,\n  \
    \  data.value('(/resource/@outOfMemoryExceptions)[1]','int') AS OutOfMemoryExceptions\n\
    FROM ##Server_Diagnostics;\nDROP TABLE #Server_Diagnostics;\n```\nListing 10-3\n\
    \nRetrieving Diagnostic Information\n\n## AlwaysOn Availability Group Metadata\n\
    \nMetadata can also be used to troubleshoot issues with Availability Groups. The\
    \ following sections will discuss some of the most useful and interesting metadata\
    \ objects, relating the Availability Groups.\n\n### Determining the Last Failover\
    \ Reason\n\nIf an Availability Group has failed over, one of the first questions\
    \ you are likely to want to answer is “when and why?”. This question can be answered\
    \ using the `sys.dm_hadr_availability_replica_states` DMV. This object returns\
    \ the columns detailed in Table [10-5](#394392_3_En_10_Chapter.xhtml#Tab5). Table\
    \ 10-5\n\n`sys.dm_hadr_availability_replica_states`\n\n| Column || Description\
    \ |\n\n| --- | --- |\n\n| `replica_id` || The GUID of the Replica |\n\n| --- |\
    \ --- |\n\n| `group_id` || The GUID of the Availability Group |\n\n| `is_local`\
    \ || Indicates if the Replica is local or remote. Possible values are• 0 – Indicates\
    \ a remote secondary• 1 – Indicates a local Replica |\n\n| `role` || Indicates\
    \ the role that is currently assigned to the Replica. Possible values are• 0 –\
    \ Indicates that the role is currently being resolved• 1 – Indicates that the\
    \ Replica has the Primary role• 2 – Indicates that the Replica currently has the\
    \ Secondary role |\n\n| `role_desc` || A textual description of the Replica’s\
    \ current role. Possible values are• RESOLVING• PRIMARY• SECONDARY |\n"
  trans: "\n| `status` || 当前节点的状态。可能的值为• 0 – 表示节点已启动• 1 – 表示节点已关闭• 2 – 表示节点已暂停• 3\
    \ – 表示节点当前正在加入集群• 4 – 表示状态未知 |\n\n| `status_description` || 状态的文本描述。可能的值为• 启动• 关闭• 已暂停• 加入中• 未知\
    \ |\n\n| `is_current_owner` || 表示实例是否当前由节点托管。可能的值为• 0 – 表示节点不拥有实例• 1 – 表示节点拥有实例\
    \ |\n\n列出 10-1 中的查询将返回当前托管实例的集群节点的名称。\n\n```\nSELECT NodeName FROM sys.dm_os_cluster_nodes\
    \ WHERE is_current_owner = 1;\n```\n列表 10-1\n\n发现托管实例的节点\n\n## 查看运行状况检查配置\n\n\
    如果在协助 Windows 管理团队处理集群实例的重复故障转移时，DBA 可能希望公开可能导致故障转移的条件详情，以确保配置了适当的级别。这可以通过使用 `sys.dm_os_cluster_properties`\
    \ DMV 实现，该视图返回表 10-2 中详细列出的列。表 10-2\n\n`sys.dm_os_cluster_properties` 列\n\n| Column\
    \ || Description |\n\n| --- | --- |\n\n| `VerboseLogging` || 表示集群使用的日志级别。可能的值为• 0\
    \ – 表示日志已关闭• 1 – 表示仅记录错误• 2 – 表示记录错误和警告 |\n\n| --- | --- |\n\n| `SQLDumperDumpFlags`\
    \ || 指定 SQLDumper 将生成的转储文件类型。可能的值为• 0x0120 – 表示迷你转储• 0x0110 – 表示完整转储• 0x8100 –\
    \ 表示筛选转储 |\n\n| `SQLDumperDumpPath` || 指定 SQLDumper 将输出转储文件的文件路径 |\n\n| `SQLDumperDumpTimeOut`\
    \ || SQLDumper 创建转储文件时的超时值。以毫秒为单位指定 |\n\n| `FailureConditionLevel` || 导致故障转移发生的故障级别。有关故障条件级别的完整描述，请参阅表\
    \ 10-3 |\n\n| `HealthCheckTimeout` || 数据库引擎在判定实例无响应之前等待返回健康信息的时间长度 |\n\n由 `FailureConditionLevel`\
    \ 列返回的可能故障条件级别在表 10-3 中详细说明。表 10-3\n\n故障条件级别\n\n| Condition Level || Description\
    \ |\n\n| --- | --- |\n\n| 0 || 自动故障转移不会发生 |\n\n| --- | --- |\n\n| 1 || 当 SQL Server\
    \ 服务关闭时自动故障转移会发生 |\n\n| 2 || 自动故障转移将在以下情况发生时发生• 满足级别 1 条件• 超过 `HealthCheckTimeout`\
    \ 值 |\n\n| 3 || 自动故障转移将在以下情况发生时发生• 满足级别 2 条件• 运行状况检查返回系统错误 |\n\n| 4 || 自动故障转移将在以下情况发生时发生• 满足级别\
    \ 3 条件• 运行状况检查返回资源错误 |\n\n| 5 || 自动故障转移将在以下情况发生时发生• 满足级别 4 条件• 运行状况检查返回查询处理错误\
    \ |\n\n列出 10-2 中的查询将返回当前的故障转移条件级别和当前的运行状况检查超时值。\n\n```\nSELECT\n    FailureConditionLevel\n\
    \    , HealthCheckTimeout\nFROM sys.dm_os_cluster_properties;\n```\n列表 10-2\n\n\
    返回运行状况检查配置\n\n实例当前的运行状况可以通过使用 `sp_server_diagnostics` 系统存储过程手动确定。该过程接受一个参数：`@repeat_interval`，指定过程应多久返回一次结果，以秒为单位。如果省略参数，则结果仅返回一次。如果为参数传递值，则必须大于\
    \ 5。该过程返回表 10-4 中详细说明的结果集。表 10-4\n\n`sp_server_diagnostics` 返回的列\n\n| Column ||\
    \ Description |\n\n| --- | --- |\n\n| `creation_time` || 表示行创建时间 |\n\n| --- |\
    \ --- |\n\n| `component_type` || 表示组件的类型。可能的值为• Instance• AlwaysOn: 可用性组 |\n\n\
    | `component_name` || 表示组件的名称。可能的值为• system• resource• query_processing• io_subsystem• events• [可用性组名称]\
    \ |\n\n| `state` || 组件的运行状况。可能的值为• 0 – 表示状态未知• 1 – 表示状态正常（意味着健康）• 2 – 表示存在警告• 3\
    \ – 表示存在错误 |\n\n| `state_desc` || 组件状态的文本描述。可能的值为• 未知• 正常• 警告• 错误 |\n\n| `data`\
    \ || 组件特定数据的 XML 表示。例如，资源组件包括指定可用物理内存和可用虚拟内存的元素。它还包括属性，包括超出内存异常的计数 |\n\n列出 10-3\
    \ 中的脚本将返回 `sp_server_diagnostics` 系统存储过程的完整结果集，以及从 XML 列中提取的值，以便快速查看服务器整体 CPU\
    \ 利用率、实例的 CPU 利用率以及可能发生的超出内存异常计数。\n\n提示\n\n关于 XML 分片的讨论超出了本书的范围。然而，我推荐 Apress\
    \ 出版的 *SQL Server DBA 专家脚本和自动化*，其中可以找到关于为管理目的处理 XML 的讨论。该书可在 [www.apress.com/9781484219423](http://www.apress.com/9781484219423)\
    \ 购买。\n\n```\nCREATE TABLE #Server_Diagnostics (\n    creation_time      DATETIME,\n\
    \    component_type     NVARCHAR(8),\n    component_name     NVARCHAR(128),\n\
    \    [state]            TINYINT,\n    state_desc         NVARCHAR(8),\n    [data]\
    \             XML\n);\nINSERT INTO #Server_Diagnostics EXEC sp_server_diagnostics;\n\
    SELECT *,\n    data.value('(/system/@systemCpuUtilization)[1]','int') AS SystemCPUUtilization,\n\
    \    data.value('(/system/@sqlCpuUtilization)[1]','int') AS SQLServerCPU,\n  \
    \  data.value('(/resource/@outOfMemoryExceptions)[1]','int') AS OutOfMemoryExceptions\n\
    FROM ##Server_Diagnostics;\nDROP TABLE #Server_Diagnostics;\n```\n列表 10-3\n\n\
    检索诊断信息\n\n## AlwaysOn 可用性组元数据\n\n元数据也可以用于排查可用性组的问题。以下各节将讨论一些最有用和有趣的与可用性组相关的元数据对象。\n\
    \n### 确定上次故障转移原因\n\n如果可用性组已发生故障转移，您可能最想回答的第一个问题是“何时以及为什么？”。这个问题可以使用 `sys.dm_hadr_availability_replica_states`\
    \ DMV 回答。该对象返回表 10-5 中详细说明的列。表 10-5\n\n`sys.dm_hadr_availability_replica_states`\n\
    \n| Column || Description |\n\n| --- | --- |\n\n| `replica_id` || 副本的 GUID |\n\
    \n| --- | --- |\n\n| `group_id` || 可用性组的 GUID |\n\n| `is_local` || 表示副本是本地还是远程。可能的值为• 0\
    \ – 表示远程辅助副本• 1 – 表示本地副本 |\n\n| `role` || 表示当前分配给副本的角色。可能的值为• 0 – 表示角色当前正在解析• 1\
    \ – 表示副本具有主要角色• 2 – 表示副本当前具有辅助角色 |\n\n| `role_desc` || 副本当前角色的文本描述。可能的值为• 解析中• 主要• 辅助\
    \ |\n"

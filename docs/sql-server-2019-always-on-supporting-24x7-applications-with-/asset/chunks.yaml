    我们然后使用 `Add-ClusterResource` cmdlet 来添加 DTC 资源。Name 参数为资源命名，而 ResourceType 参数指定其为
    DTC 资源。然后我们需要在角色内的资源之间创建依赖关系。使用 GUI 时我们无需执行此操作，因为依赖关系会自动为我们创建。资源依赖关系指定其他资源所依赖的资源或资源。资源故障会沿着链条传播，并可能导致角色脱机。例如，在我们的
    ALWAYSON-MSDTC-C 角色中，如果磁盘或虚拟名称变得不可用，DTC 资源将脱机。Windows Server 支持具有 AND 和 OR 约束的多个依赖关系。正是
    OR 约束使得多子网集群成为可能，因为资源可以依赖于 IP 地址 A 或 IP 地址 B。最后，我们需要使用 `Start-ClusterGroup` cmdlet
    将角色联机。


    ## 创建 MSDTC 角色

    ```

    #Create the Role

    Add-ClusterServerRole -Name ALWAYSON-MSDTC-C -Storage "Cluster Disk 3" -StaticAddress
    192.168.0.50

    #Create the DTC Resource

    Add-ClusterResource -Name MSDTC-ALWAYSON-MSDTC-C -ResourceType "Distributed Transaction
    Coordinator" -Group ALWAYSON-MSDTC-C

    #Create the dependencies

    Add-ClusterResourceDependency MSDTC-ALWAYSON-MSDTC-C ALWAYSON-MSDTC-C

    Add-ClusterResourceDependency MSDTC-ALWAYSON-MSDTC-C "Cluster Disk 3"

    #Bring the Role online

    Start-ClusterGroup ALWAYSON-MSDTC-C

    ```

    清单 3-6


    创建 MSDTC 角色


    ### 配置角色

    创建角色后，您可能希望配置它以更改故障转移策略或将节点配置为首选所有者。要配置角色，请从角色的上下文菜单中选择“属性”。在“属性”对话框的“常规”选项卡中，如图
    3-29 所示，您可以配置节点作为角色的首选所有者。您还可以通过在“首选所有者”窗口中将节点移至其他节点之上或之下，来更改节点首选项的优先级顺序。

    ![图 3-29 ¶ 通用选项卡](img/394392_3_En_3_Fig29_HTML.jpg)

    图 3-29 ¶ 通用选项卡


    您还可以选择在多个角色同时故障转移到另一个节点时角色的优先级。此设置的选项如下：

    * 高

    * 中

    * 低

    * 不自动启动


    我们将配置 ALWAYSON-MSDTC-C 角色以高优先级进行故障转移。


    在“属性”对话框的“故障转移”选项卡中，您可以配置角色在给定时间内可以故障转移的次数，然后角色将被置于脱机状态。此默认值是一次故障，时间为 6 小时。此问题在于，如果角色发生故障转移，并且在原始节点上修复问题后，您将角色故障转移回来，则在
    6 小时窗口内不再允许进行故障转移。这显然是一个风险，我通常建议您更改此设置。在我们的例子中，我们已配置角色在 24 小时时间窗口内最多允许三次故障转移，如图
    3-30 所示。我们还配置了角色在再次可用时故障转移回最首选的所有者。请记住，在设置自动故障恢复时，故障恢复也会像故障转移一样导致停机。如果您追求非常高的可用性，例如五个
    9，那么此选项可能不合适。我们将配置 ALWAYSON-MSDTC-C 角色允许三次故障转移，时间为 24 小时。我们还将配置角色允许立即故障恢复。

    ![图 3-30 ¶ 故障转移选项卡](img/394392_3_En_3_Fig30_HTML.jpg)

    图 3-30 ¶ 故障转移选项卡


    ## 摘要

    在创建群集之前，必须在所有节点上安装 Microsoft 群集服务 (MCS)。这可以通过使用“添加角色和功能向导”安装群集功能来实现。


    一旦安装了群集功能，就可以使用“创建群集向导”在每个节点上配置群集。在构建群集之前，此向导会提示您运行群集验证向导。群集验证向导将验证环境是否满足群集的要求。如果发现环境不满足要求，您可以继续构建群集，但安装将不会得到
    Microsoft 的支持。


    一旦群集构建完成，还需要对其进行配置。这将包括配置仲裁模式，也可能包括配置 MSDTC。在群集上创建角色后，您可能还希望使用故障转移策略或首选所有者来配置角色。


    © Peter A. Carter 2020 P. A. CarterSQL Server 2019 AlwaysOn[`doi.org/10.1007/978-1-4842-6479-9_4`](https://doi.org/10.1007/978-1-4842-6479-9_4)
    开始摘要


    # 4. 实现 AlwaysOn 故障转移群集实例

    Peter A. Carter^(1 ) (1) Botley, UK

    结束摘要 一旦群集构建并配置完成，就该安装 SQL Server AlwaysOn 故障转移群集实例了。在我们的场景中，我们希望构建一个群集实例，该实例跨越我们在第
    3 章构建的 Windows 群集的两个节点。我们还将讨论如何使用 PowerShell 构建故障转移群集实例。为此，我们需要在群集的主节点上使用“安装 SQL
    Server 故障转移群集”向导。然后我们需要运行“添加节点”向导，以允许被动节点在故障转移时托管实例。因此，在本章中，我们将执行以下任务：

    * 在活动群集节点上安装 SQL Server 故障转移群集实例。

    * 配置向导的被动节点以支持故障转移群集实例。


    ## 构建实例

    AlwaysOn 故障转移群集实例可以使用“安装 SQL Server 故障转移群集”向导构建，可通过在托管群集核心资源的节点上打开 SQL Server
    安装中心，并从“安装”中选择“新建 SQL Server 故障转移群集安装”选项来调用。SQL Server 安装中心的“安装”选项卡如图 4-1 所示。

    ![图 4-1 ¶ SQL Server 安装中心 – 安装选项卡](img/394392_3_En_4_Fig1_HTML.jpg)

    图 4-1 ¶ SQL Server 安装中心 – 安装选项卡


    向导的产品密钥页是首先显示的，如图 4-2 所示。在向导的此页面上，您可以选择要安装的 SQL Server 的其中一个免费版本，或输入产品密钥或批量许可密钥，这将自动确定要安装的正确
    SQL Server 版本。

    ![图 4-2 ¶ 安装 SQL Server 故障转移群集向导 – 产品密钥页](img/394392_3_En_4_Fig2_HTML.jpg)

    图 4-2 ¶ 安装 SQL Server 故障转移群集向导 – 产品密钥页


    提示

    在 SQL Server 2019 中，功能上等同于企业版的 Developer Edition 是免费的。在 SQL Server 2016 之前，此非商业许可证会收取少量费用。


    在向导的“许可条款”页（图 4-3）上，您将被邀请通过复选框接受 Microsoft 的许可条款。未经同意，安装无法继续。

    ![图 4-3 ¶ 安装 SQL Server 故障转移群集向导 – 许可条款页](img/394392_3_En_4_Fig3_HTML.jpg)

    图 4-3 ¶ 安装 SQL Server 故障转移群集向导 – 许可条款页



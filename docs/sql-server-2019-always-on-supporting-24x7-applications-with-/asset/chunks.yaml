    \ of the log records that have not yet been sent to the secondary, specified in\
    \ kilobytes |\n| `log_send_rate` | The speed at which log records are being sent\
    \ to the secondary, specified in kilobytes/sec |\n| `filestream_send_rate` | The\
    \ speed at which FILESTREAM files are being sent to the secondary, specified in\
    \ kilobytes/sec |\n| `end_of_log_lsn` | The LSN of the final log record within\
    \ the log cache |\n| `last_commit_lsn` | The LSN of the last committed transaction\
    \ in the transaction log |\n| `last_commit_time` | The timestamp of the last committed\
    \ LSN in the transaction log |\n| `low_water_mark_for_ghosts` | The ghost cleanup\
    \ task (which physically deletes rows that have already been logically deleted)\
    \ uses the minimum value of this column, across all replicas of the database,\
    \ to determine where to start cleaning up records |\n| `secondary_log_seconds`\
    \ | The number of seconds that the secondary replica is behind the primary replica\
    \ |\n\n### Assessing the State of an Availability Database\n\nThe script in Listing\
    \ 10-5 demonstrates how to assess the health availability database, within the\
    \ HR Availability Group. You will notice that we use the `DB_NAME()` function\
    \ to return the name of the database and join the `sys.dm_hadr_database_replica_states`\
    \ DMV to the `sys.availability_groups` and `sys.availability_replicas` catalog\
    \ views to return the names of the Availability Groups and Replicas.\n\n```sql\n\
    SELECT\n    DB_NAME(database_id),\n    ag.name,\n    ar.replica_server_name,\n\
    \    is_primary_replica,\n    synchronization_state_desc,\n    synchronization_health_desc,\n\
    \    database_state_desc\nFROM sys.dm_hadr_database_replica_states drs\nINNER\
    \ JOIN sys.availability_groups ag\n    ON drs.group_id = ag.group_id\nINNER JOIN\
    \ sys.availability_replicas ar\n    ON drs.replica_id = ar.replica_id\nWHERE ag.name\
    \ = 'HR';\n```\nListing 10-5 Assessing the State of an Availability Database\n\
    \n## Summary\n\nSQL Server exposes a large amount of metadata that can help you\
    \ troubleshoot issues and audit your configuration. While this chapter discusses\
    \ some of the most helpful metadata, I strongly encourage you to explore the hadr\
    \ DMVs further.\n\nFor failover clustered instances, the `sys.dm_os_cluster_nodes`\
    \ DMV exposes the health status of nodes within a cluster. Further troubleshooting\
    \ detail can be found by calling the `sp_server_diagnostics` system stored procedure.\n\
    \nTip\n\nThe `sp_server_diagnostics` system stored procedure can also be used\
    \ for troubleshooting AlwaysOn Availability Groups and returns a row for each\
    \ Availability Group hosted on the instance.\n\nThe `sys.dm_hadr_availability_replica_states`\
    \ DMV exposes details of the health status of Replicas, which host AlwaysOn Availability\
    \ Groups. To drill down to view the health status of databases that participate\
    \ within an Availability Group, the `sys.dm_hadr_database_replica_states` DMV\
    \ can be queried.\n\nBoth of the DMVs mentioned earlier can be joined to the `sys.availability_groups`\
    \ and `sys.availability_replicas` DMVs to obtain the textual information regarding\
    \ the configuration, as opposed to GUIDs. The `sys.dm_hadr_database_replica_states`\
    \ DMV can also be joined to `sys.databases` to obtain further information regarding\
    \ database configuration.\n"
  trans: "\n### 副本状态列\n\n| 列 | 描述 |\n|---|---|\n| `recovery_lsn` | 在主副本上，`recovery_lsn`\
    \ 表示事务日志的末尾（用于时间点恢复的事务日志中的最终点）。在辅助副本上，该列表示需要重新同步的点。然而，如果该值等于或大于 `last_hardened_lsn`，则表示不需要重新同步\
    \ |\n| `truncation_lsn` | 对于主副本，该列表示所有辅助副本中最小的日志截断 LSN。对于辅助副本，该列表示该特定数据库副本的日志截断点\
    \ |\n| `last_sent_lsn` | 表示已发送的最后一个日志块的末尾 |\n| `last_sent_time` | 最后日志块发送的日期和时间\
    \ |\n| `last_recieved_lsn` | 表示要接收的最后一个日志块的末尾 |\n| `last_hardened_lsn` | 表示要硬化的最后一个日志块的开始。对于异步提交副本，该值将为\
    \ NULL |\n| `last_hardened_time` | 已硬化 LSN 的日期和时间 |\n| `last_redone_lsn` | 辅助副本上要重做的最后一个日志记录的\
    \ LSN |\n| `last_redone_time` | 辅助副本上要重做的最后一个 LSN 的时间戳 |\n| `log_send_queue_size`\
    \ | 尚未发送到辅助副本的日志记录的大小，以千字节为单位指定 |\n| `log_send_rate` | 向辅助副本发送日志记录的速度，以千字节/秒为单位指定\
    \ |\n| `filestream_send_rate` | 向辅助副本发送 FILESTREAM 文件的速度，以千字节/秒为单位指定 |\n| `end_of_log_lsn`\
    \ | 日志缓存中最终日志记录的 LSN |\n| `last_commit_lsn` | 事务日志中最后一个已提交事务的 LSN |\n| `last_commit_time`\
    \ | 事务日志中最后一个已提交 LSN 的时间戳 |\n| `low_water_mark_for_ghosts` | 幽灵清理任务（物理删除已逻辑删除的行）使用数据库所有副本中该列的最小值来确定开始清理记录的位置\
    \ |\n| `secondary_log_seconds` | 辅助副本落后于主副本的秒数 |\n\n### 评估可用性数据库的状态\n\nListing\
    \ 10-5 中的脚本演示了如何在 HR 可用性组中评估可用性数据库的健康状况。你会注意到我们使用 `DB_NAME()` 函数返回数据库的名称，并将 `sys.dm_hadr_database_replica_states`\
    \ DMV 连接到 `sys.availability_groups` 和 `sys.availability_replicas` 目录视图，以返回可用性组和副本的名称。\n\
    \n```sql\nSELECT\n    DB_NAME(database_id),\n    ag.name,\n    ar.replica_server_name,\n\
    \    is_primary_replica,\n    synchronization_state_desc,\n    synchronization_health_desc,\n\
    \    database_state_desc\nFROM sys.dm_hadr_database_replica_states drs\nINNER\
    \ JOIN sys.availability_groups ag\n    ON drs.group_id = ag.group_id\nINNER JOIN\
    \ sys.availability_replicas ar\n    ON drs.replica_id = ar.replica_id\nWHERE ag.name\
    \ = 'HR';\n```\nListing 10-5 评估可用性数据库的状态\n\n## 摘要\n\nSQL Server 公开了大量元数据，可帮助您排查问题并审核配置。虽然本章讨论了一些最有用的元数据，但我强烈建议您进一步探索\
    \ hadr DMVs。\n\n对于故障转移群集实例，`sys.dm_os_cluster_nodes` DMV 公开了群集中节点的健康状态。进一步的故障排除详细信息可以通过调用\
    \ `sp_server_diagnostics` 系统存储过程找到。\n\n提示\n\n`sp_server_diagnostics` 系统存储过程也可用于排查\
    \ AlwaysOn 可用性组的问题，并为实例上托管的每个可用性组返回一行。\n\n`sys.dm_hadr_availability_replica_states`\
    \ DMV 公开了托管 AlwaysOn 可用性组的副本的健康状态详细信息。要深入查看参与可用性组的数据库的健康状态，可以查询 `sys.dm_hadr_database_replica_states`\
    \ DMV。\n\n前面提到的两个 DMV 都可以连接到 `sys.availability_groups` 和 `sys.availability_replicas`\
    \ DMV，以获取有关配置的文本信息，而不是 GUID。`sys.dm_hadr_database_replica_states` DMV 还可以连接到 `sys.databases`\
    \ 以获取有关数据库配置的进一步信息。\n\n"

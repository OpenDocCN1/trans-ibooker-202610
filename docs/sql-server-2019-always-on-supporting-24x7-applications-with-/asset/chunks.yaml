    Begin Abstract


    # 4. Implementing an AlwaysOn Failover Clustered Instance

    Peter A. Carter^([1](#394392_3_En_4_Chapter.xhtml#Aff2) ) (1) Botley, UK

    End Abstract Once the cluster has been built and configured, it is time to install
    the SQL Server AlwaysOn failover cluster instance. In our scenario, we want to
    build a clustered instance, which spans both nodes of the Windows cluster that
    we built in Chapter [3](#394392_3_En_3_Chapter.xhtml). We will also discuss how
    to build the failover clustered instance using PowerShell. To do this, we will
    need to use the Install a SQL Server Failover Cluster wizard on the primary node
    of the cluster. We will then need to run the Add Node wizard to allow the passive
    node to host the instance in the event of a failover. Therefore, in this chapter,
    we will perform the following tasks:

    * Install a SQL Server failover clustered instance on the active cluster node.

    * Configure the passive node of the wizard to support the failover clustered instance.


    ## Building the Instance

    An AlwaysOn Failover Clustered Instance can be built using the Install A SQL Server
    Failover Cluster wizard, which can be invoked by opening the SQL Server Installation
    Center, on the node hosting the cluster core resources, and selecting the New
    SQL Server Failover Cluster Installation option from the Installation. The Installation
    tab of the SQL Server Installation Center is illustrated in Figure [4-1](#394392_3_En_4_Chapter.xhtml#Fig1).

    ![Figure 4-1 ¶ SQL Server Installation Center – Installation Tab](images/394392_3_En_4_Chapter/394392_3_En_4_Fig1_HTML.jpg)

    Figure 4-1 ¶ SQL Server Installation Center – Installation Tab


    The Product Key page of the wizard is the first to be displayed and is illustrated
    in Figure [4-2](#394392_3_En_4_Chapter.xhtml#Fig2). On this page of the wizard,
    you will either select one of the free versions of SQL Server to install, or enter
    a product key, or volume licensing key, which will automatically determine the
    correct version of SQL Server to install.

    ![Figure 4-2 ¶ Install a SQL Server Failover Cluster Wizard – Product Key Page](images/394392_3_En_4_Chapter/394392_3_En_4_Fig2_HTML.jpg)

    Figure 4-2 ¶ Install a SQL Server Failover Cluster Wizard – Product Key Page


    Tip

    In SQL Server 2019, Developer Edition, which is functionally equivalent to Enterprise
    Edition, is free. Prior to SQL Server 2016, there was a nominal charge associated
    with this noncommercial license.


    On the License Terms page of the wizard (Figure [4-3](#394392_3_En_4_Chapter.xhtml#Fig3)),
    you will be invited to accept Microsoft’s license terms, via a check box. The
    installation cannot proceed without agreement.

    ![Figure 4-3 ¶ Install a SQL Server Failover Cluster Wizard – License Terms Page](images/394392_3_En_4_Chapter/394392_3_En_4_Fig3_HTML.jpg)

    Figure 4-3 ¶ Install a SQL Server Failover Cluster Wizard – License Terms Page


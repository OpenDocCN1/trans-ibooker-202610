    # 摘要

    理解可用性的概念是为需要高可用性和灾难恢复的应用程序做出正确实施选择的关键。您应计算停机成本并将其与实施 `HA/DR` 解决方案选择的成本进行比较，以帮助企业了解每个选项的成本/效益概况（如第
    1 章所述）。在选择技术实施时，您还应注意 `SLAs`，因为如果未满足 `SLAs`，可能会产生财务处罚。


    `SQL Server` 提供了一整套高可用性和灾难恢复技术，使您能够实施最适合数据层应用程序需求的解决方案。对于高可用性，您可以实施集群或 AlwaysOn
    可用性组（`AOAG`）。集群使用共享磁盘资源，故障转移发生在实例级别。`AOAG` 另一方面，通过维护数据库的冗余副本以及同步日志流，在数据库级别同步数据。


    要实现灾难恢复，您可以选择实施 `AOAG` 或日志传送。日志传送通过备份、复制和还原数据库的事务日志来工作，而 `AOAG` 使用异步日志流同步数据。


    还可以将多个 HA 和 DR 技术组合在一起，以实施最合适的可用性策略。其常见示例是为高可用性组合集群，并与 `AOAG` 或日志传送结合以提供 DR。



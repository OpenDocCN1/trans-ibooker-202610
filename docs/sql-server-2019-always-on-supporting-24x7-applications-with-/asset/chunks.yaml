- raw: "So far, we have discussed the typical, on-premise, enterprise workload scenarios\
    \ for AlwaysOn Availability Groups and AlwaysOn Failover Clustered Instances.\
    \ AlwaysOn is such a flexible suite of technologies, however, that there are many\
    \ permutations that you may wish to take advantage of. Therefore, this chapter\
    \ will provide an overview of some of the less typical AlwaysOn scenarios that\
    \ you may need to support. This includes Basic Availability Groups, Availability\
    \ Groups in Azure, Distributed Availability Groups, and creating Availability\
    \ Groups without a cluster or a domain.\n\nIn this chapter, we will perform the\
    \ following activities: \n\n*   Create an Availability Group in Azure IaaS.\n\n\
    *   Create a Clusterless Availability Group.\n\n*   Create a domain-independent\
    \ availability group.\n\n*   Create a distributed Availability Group.\n\n## Basic\
    \ Availability Groups\n\nAll of the Availability Group demonstrations so far in\
    \ this book have required SQL Server Enterprise Edition, but Availability Groups\
    \ are also available in SQL Server Standard Edition. In Standard Edition, however,\
    \ the functionality of Availability Groups is limited, hence why they are known\
    \ as Basic Availability Groups.\n\nThe most noticeable limitation is that Basic\
    \ Availability Groups only support two replicas. The replicas can, however, be\
    \ configured as either in synchronous or asynchronous commit mode. This means\
    \ that you can still achieve either high availability or disaster recovery.\n\n\
    Note \n\nBasic Availability Group on Linux supports a third, configuration-only\
    \ replica, which is required to achieve high availability. Please see Chapter\
    \ [6](#394392_3_En_6_Chapter.xhtml) for further details.\n\nThe secondary replica\
    \ does not support read-only connections. This means that not only do Basic Availability\
    \ Groups not support read-scaling, they also do not support backups or integrity\
    \ checks being taken on the secondary.\n\nAnother limitation is that a Basic Availability\
    \ Group can only contain a single database. This means that it is not possible\
    \ to fail over multiple databases together, making administration of large instances\
    \ far more difficult.\n\nOther advanced Availability Group functionalities, such\
    \ as Distributed Availability Groups, are also not supported, and once a Basic\
    \ Availability Group has been built, it cannot be upgraded to a full-fat Availability\
    \ Group. Instead, it must be destroyed and re-created.\n\nTo implement Basic Availability\
    \ Groups, you can use the same syntax, as discussed earlier in this book, with\
    \ the obvious exception being that you cannot implement unsupported features.\
    \ The only syntax that is solely for Basic Availability Groups is the addition\
    \ of the BASIC marker in the WITH clause, which reduces that available functionality.\
    \ For example, the script in Listing [7-1](#394392_3_En_7_Chapter.xhtml#PC1) would\
    \ create an Availability Group across two servers, named SQLStdProd and SQLStdSyncHA,\
    \ and both servers have a default instance of SQL Server Standard Edition installed.\
    \ CREATE AVAILABILITY GROUP BasicAGAG WITH (     AUTOMATED\\_BACKUP\\_PREFERENCE\
    \ = PRIMARY,     BASIC,     REQUIRED\\_SYNCHRONIZED\\_SECONDARIES\\_TO\\_COMMIT\
    \ = 0 ) FOR DATABASE Sales REPLICA ON 'SQLSTDPROD' WITH (     ENDPOINT\\_URL =\
    \ 'TCP://SQLSTDPROD.AlwaysOn.com:5022',     FAILOVER\\_MODE = AUTOMATIC,     AVAILABILITY\\\
    _MODE = SYNCHRONOUS\\_COMMIT, 7     SEEDING\\_MODE = AUTOMATIC ), 'SQLSTDSYNCHA'\
    \ WITH (     ENDPOINT\\_URL = N'TCP://SQLSTDSYNCHA.AlwaysOn.com:5022',     FAILOVER\\\
    _MODE = AUTOMATIC,     AVAILABILITY\\_MODE = SYNCHRONOUS\\_COMMIT,     SEEDING\\\
    _MODE = AUTOMATIC ); GO  Listing 7-1 \n\nCreate a Basic Availability Group\n\n\
    ## Availability Groups on Azure IaaS\n\nWhen migrating databases to the cloud,\
    \ you have various options for the target. Azure SQL Database and Elastic Database\
    \ Pools provide a database as a service offering, while Azure Managed Instances\
    \ provide a SQL Server as a service. Both of these offerings provide high availability,\
    \ based on Availability Groups. If your application requires access to the operating\
    \ system, however, then you must use Azure VMs. With this solution, you must manually\
    \ configure Availability Groups, as you would on-premise. In the following sections,\
    \ we will look at some of the Azure Availability options that you should be aware\
    \ of before designing your Availability Group topology, before exploring how to\
    \ configure Availability Groups in Azure.\n\n### Azure Availability Concepts\n\
    \nA key principle of cloud is to design applications for failure. Therefore, implementing\
    \ Availability Groups for SQL Server in cloud is a very important topic. Before\
    \ discussing the implementation, you should be familiar with the concepts of Availability\
    \ Sets, Availability Zones, and Regions. The following sections will provide an\
    \ overview of each of these topics.\n\n#### Availability Sets\n\nAvailability\
    \ Sets are a construct that place VMs within the same data center on different\
    \ fault domains and update domains. A fault domain indicates hardware that shares\
    \ a common power supply and network switch. An Availability Set can be configured\
    \ to stretch across three fault domains. Therefore, if you place three VMs in\
    \ the same Availability Set, you know that each VM has a unique power supply and\
    \ network switch to the other VMs in the Availability Set.\n\nAn update domain\
    \ indicates physical hardware that is rebooted for either planned or unplanned\
    \ maintenance. An Availability Set is split across five update domains by default,\
    \ and this can be increased to a maximum of 20. If you place VMs in the same Availability\
    \ Set, you know that they are on different hardware from each other and will not\
    \ be rebooted at the same time.\n\nTip \n\nWhen making use of Availability Sets,\
    \ you should also ensure that you use Managed Disks. When using Managed Disks,\
    \ the physical disks are split across fault domains that align with attached VMs,\
    \ avoiding single points of failure.\n\n#### Availability Zones\n\nWhile an Availability\
    \ Set protects against hardware issues and downtime within a data center, it does\
    \ not protect against data center failure. To protect against data center failure,\
    \ you must place your VMs in separate Availability Zones. Each Availability Zone\
    \ is in a different building, with separate power, networking, and cooling.\n\n\
    #### Regions\n\nRegions provide a mean of dispersing your servers geographical,\
    \ in order to protect against a large-scale disaster that takes an entire Region\
    \ offline. Regions within Azure are paired within a Geography, where a Geography\
    \ is a political region. For example, Regions in the United States are paired\
    \ with other regions physically located in the United States. The same applies\
    \ for other territories, such as Europe and the United Kingdom. This allows you\
    \ to protect against a disaster while still maintaining data sovereignty.\n\n\
    While I am aware of some companies, who have taken the stance that for DR, they\
    \ only need to protect against the loss of a data center and have therefore decided\
    \ to avoid the complexity and cost overhead of having a footprint in multiple\
    \ regions, in cloud terms, you only have DR if your DR servers are in a different\
    \ Region to your production servers.\n\n### Implementing Availability Groups in\
    \ Azure\n\nIn this section, we will explore how to configure Availability Groups\
    \ on Azure VMs. In this section, we will build an Availability Group for the Sales\
    \ database across two Availability Zones, within the same region, for the purpose\
    \ of providing high availability. We will build each of the VMs on different subnets,\
    \ within the same vnet. Before that, however, we will briefly discuss Availability\
    \ Sets.\n\n#### Creating an Availability Set"

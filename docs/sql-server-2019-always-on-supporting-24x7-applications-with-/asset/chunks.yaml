    \ When implementing Synchronous Commit mode, however, you must be aware of the\
    \ associated performance penalty caused by committing the transaction on the secondary\
    \ replica before it is committed on the primary replica. For disaster recovery,\
    \ you will normally choose to implement Asynchronous Commit mode.\n\nThe availability\
    \ group can be created via the New Availability Group wizard, through dialog boxes,\
    \ through `T-SQL`, or even through `PowerShell`. If you create an availability\

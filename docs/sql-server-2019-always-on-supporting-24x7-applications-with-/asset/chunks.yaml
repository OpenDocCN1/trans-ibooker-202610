    ## Installing Failover Clustering


    On the Features page of the wizard, we need to select `Failover Clustering`, as
    shown in Figure [3-5](#394392_3_En_3_Chapter.xhtml#Fig5). This satisfies the prerequisites
    for building the Windows cluster. ![Figure 3-5 ¶ The Features Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig5_HTML.jpg)

    Figure 3-5 ¶ The Features Page


    When you select `Failover Clustering`, the wizard presents you with a screen (Figure
    [3-6](#394392_3_En_3_Chapter.xhtml#Fig6)) that asks if you want to install the
    management tools in the form of a check box. If you are planning to manage the
    cluster directly from the nodes, check this option. ![Figure 3-6 ¶ Selecting Management
    Tools](images/394392_3_En_3_Chapter/394392_3_En_3_Fig6_HTML.jpg)

    Figure 3-6 ¶ Selecting Management Tools


    On the final page of the wizard, you see a summary of the features that are to
    be installed, as shown in Figure [3-7](#394392_3_En_3_Chapter.xhtml#Fig7). Here,
    you can specify the location of the Windows media if you need to. You can also
    choose whether the server should automatically restart, if required. If you are
    building out a new server, it makes sense to check this box. However, if the server
    is already in production when you add the feature, make sure you consider what
    is currently running on the box, and whether you should wait for a maintenance
    window to perform a restart if one is needed. ![Figure 3-7 ¶ The Confirmation
    Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig7_HTML.jpg)

    Figure 3-7 ¶ The Confirmation Page


    As well as installation through `Server Manager`, cluster services can also be
    installed from `PowerShell`. The PowerShell command in Listing [3-1](#394392_3_En_3_Chapter.xhtml#PC1)
    achieves the same result as the preceding steps.

    ```

    Install-WindowsFeature -Name Failover-Clustering –IncludeManagementTools -Verbose

    ```

    Listing 3-1

    Installing Cluster Services


    ### Creating the Cluster


    Once clustering has been installed on both nodes, you can begin building the cluster.
    To do this, connect to the server that you intended to be the active node, and
    run `Failover Cluster Manager` from `Administrative Tools`.


    The Before You Begin page of the `Create Cluster Wizard` warns that Microsoft
    only supports clusters that pass all verification tests, as shown in Figure [3-8](#394392_3_En_3_Chapter.xhtml#Fig8).
    The message also warns that you must be a local administrator on each node of
    the cluster. In previous versions of Windows Server, this meant that you must
    use a domain account that has local administrator rights on each server that will
    participate in the cluster. From Windows Server 2016 onward, however, the reliance
    on domain authentication has been removed, and the only requirement is that an
    account with local administrator rights exists on each node that has a consistent
    name and password. This allows for the creation of a cluster on a workgroup, or
    across multiple domains. Neither of these options were available in previous versions
    of Windows Server. ![Figure 3-8 ¶ The Before You Begin Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig8_HTML.jpg)

    Figure 3-8 ¶ The Before You Begin Page


    On the Select Servers screen of the wizard, you need to enter the names of the
    cluster nodes. This is illustrated in Figure [3-9](#394392_3_En_3_Chapter.xhtml#Fig9).
    In our case, our cluster nodes are named `ClusterNode1` and `ClusterNode2`, respectively.
    If they were part of a domain, however, then the domain name and suffix would
    be appended to the server name. ![Figure 3-9 ¶ The Select Servers Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig9_HTML.jpg)

    Figure 3-9 ¶ The Select Servers Page


    On the Validation Warnings page, you are asked if you wish to run the validation
    tests against the cluster. You should always choose to run this validation for
    production servers, because Microsoft will not offer support for the cluster unless
    it has been validated. Choosing to run the validation tests invokes the `Validate
    a Configuration Wizard`. You can also run this wizard independently from the Management
    pane of `Failover Cluster Manager`. The Validation Warnings page is shown in Figure
    [3-10](#394392_3_En_3_Chapter.xhtml#Fig10). ![Figure 3-10 ¶ The Validation Warning
    Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig10_HTML.jpg)

    Figure 3-10 ¶ The Validation Warning Page


    ### Tip


    There are some situations in which validation is not possible, and in these instances,
    you need to select the No, I Do Not Require Support… option. For example, some
    DBAs choose to install one-node clusters instead of stand-alone instances so that
    they can be scaled up to full clusters in the future, if need be. This approach
    can cause operational challenges for Windows administrators, however, so use it
    with extreme caution.


    After you pass through the Before You Begin page of the `Validate a Configuration
    Wizard`, you see the Testing Options page. Here, you are given the option of either
    running all validation tests or selecting a subset of tests to run, as illustrated
    in Figure [3-11](#394392_3_En_3_Chapter.xhtml#Fig11). Normally when you are installing
    a new cluster, you want to run all validation tests, but it is useful to be able
    to select a subset of tests if you invoke the `Validate a Configuration Wizard`
    independently after you make a configuration change to the cluster. ![Figure 3-11
    ¶ The Testing Options Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig11_HTML.jpg)

    Figure 3-11 ¶ The Testing Options Page


    On the Confirmation page of the wizard, illustrated in Figure [3-12](#394392_3_En_3_Chapter.xhtml#Fig12),
    you are presented with a summary of tests that will run and the cluster nodes
    that they will run against. The list of tests is comprehensive and includes the
    following categories:

    * Inventory (such as identifying any unsigned drivers)

    * Network (such as checking for a valid IP configuration)

    * Storage (such as validating the ability to fail disks over, between nodes)

    * System Configuration (such as validating the configuration of Active Directory)

    ![Figure 3-12 ¶ The Confirmation Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig12_HTML.jpg)

    Figure 3-12 ¶ The Confirmation Page


    The Summary page, shown in Figure [3-13](#394392_3_En_3_Chapter.xhtml#Fig13),
    provides the results of the tests and also a link to an HTML version of the report.
    Make sure to examine the results for any errors or warnings. You should always
    resolve errors before continuing, but some warnings may be acceptable. For example,
    if you are building your cluster to host `AlwaysOn Availability Groups`, you may
    not have any shared storage. This will generate a warning but is not an issue
    in this scenario. Configuring `AlwaysOn Availability Groups` on Windows will be
    discussed in further detail in Chapters [5](#394392_3_En_5_Chapter.xhtml). ![Figure
    3-13 ¶ The Summary Page](images/394392_3_En_3_Chapter/394392_3_En_3_Fig13_HTML.jpg)

    Figure 3-13 ¶ The Summary Page


    The View Report button displays the full version of the validation report, as
    shown in Figure [3-14](#394392_3_En_3_Chapter.xhtml#Fig14). The hyperlinks take
    you to a specific category within the report, where further hyperlinks are available
    for each test. These allow you to drill down to messages generated for the specific
    test, making it easy to identify errors. ![Figure 3-14 ¶ The Failover Cluster
    Validation Report](images/394392_3_En_3_Chapter/394392_3_En_3_Fig14_HTML.jpg)

    Figure 3-14 ¶ The Failover Cluster Validation Report


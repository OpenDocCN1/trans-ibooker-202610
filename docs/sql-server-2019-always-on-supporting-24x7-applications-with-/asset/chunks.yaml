- raw: "We then use the Add-ClusterResource cmdlet to add the DTC resource. The Name\
    \ parameter names the resource and the ResourceType parameter specifies that it\
    \ is a DTC resource. We then need to create the dependencies between the resources\
    \ within the role. We did not need to do this when using the GUI, as the dependencies\
    \ were created for us automatically. Resource dependencies specify the resource\
    \ or resources on which other resources depend. A resource failing propagates\
    \ through the chain and could take a role offline. For example, in the case of\
    \ our ALWAYSON-MSDTC-C role, if either the disk or the virtual name becomes unavailable,\
    \ the DTC resource goes offline. Windows Server supports multiple dependencies\
    \ with both AND and OR constraints. It is the OR constraints that make multi-subnet\
    \ clustering possible, because a resource can be dependent on IP address A OR\
    \ IP address B. Finally, we need to bring the role online by using the Start-ClusterGroup\
    \ cmdlet.  #Create the Role Add-ClusterServerRole -Name ALWAYSON-MSDTC-C -Storage\
    \ \"Cluster Disk 3\" -StaticAddress 192.168.0.50 #Create the DTC Resource Add-ClusterResource\
    \ -Name MSDTC-ALWAYSON-MSDTC-C -ResourceType \"Distributed Transaction Coordinator\"\

    message |

    | `hadr_db_manager_primary_replica_file_list_msg` | Fires in response to a Primary
    replica file list message |

    | `hadr_db_manager_seeding_request_msg` | Fires in response to a seeding request
    message |

    | `hadr_physical_seeding_backup_state_change` | Fires in response to a change
    in the state of a physical seeding, on the backup side |

    | `hadr_physical_seeding_restore_state_change` | Fires in response to a change
    in the state of a physical seeding, on the restore side |

    | `hadr_physical_seeding_forwarder_state_change` | Fires in response to a change
    in the state of a physical seeding, on the forwarder side |

    | `hadr_physical_seeding_forwarder_target_state_change` | Fires in response to
    a change in the state of a physical seeding, on the forwarder target side |

    | `hadr_physical_seeding_submit_callback` | Fires in response to a physical seeding
    submit callback |

    | `hadr_physical_seeding_failure` | Fires in response to a physical seeding failure
    |

    | `hadr_physical_seeding_progress` | Fires in response to a physical seeding progress
    |

    | `hadr_physical_seeding_schedule_long_task_failure` | Fires in response to a

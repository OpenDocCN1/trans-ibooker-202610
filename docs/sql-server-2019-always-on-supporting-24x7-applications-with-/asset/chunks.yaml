- raw: "On the Cluster Disk Selection page, illustrated in Figure [4-9](#394392_3_En_4_Chapter.xhtml#Fig9),\
    \ you can select the disk resources that should be associated with the resource\
    \ group. The page will list all disks that are associated with the cluster and\
    \ indicate which disks can be selected with red or green indicators in the Qualified\
    \ column. Disks that are already associated with other resource groups cannot\
    \ be selected, because a disk can only be associated with a single resource group.\
    \ We will specify that all available disks (Data, Logs, and TempDB) should be\
    \ associated with the ALWAYSON-SQL-C resource group. ![Figure 4-9 ¶ Install a\
    \ SQL Server Failover Cluster Wizard – Cluster Disk Selection Page](images/394392_3_En_4_Chapter/394392_3_En_4_Fig9_HTML.jpg)\n\
    \nFigure 4-9 ¶ Install a SQL Server Failover Cluster Wizard – Cluster Disk Selection\
    \ Page\n\nOn the Cluster Network Configuration page (Figure [4-10](#394392_3_En_4_Chapter.xhtml#Fig10)),\
    \ we can configure the IP Address of the cluster role. We can either choose DHCP,\
    \ which means that the IP address will be attained automatically, or we can specify\
    \ a static IP address. In our case, we will specify a static IP address. If our\
    \ cluster were a stretch cluster (spread across multiple subnets), we would need\
    \ to specify an IP address for each subnet. ![Figure 4-10 ¶ Install a SQL Server\
    \ Failover Cluster – Cluster Network Configuration Page](images/394392_3_En_4_Chapter/394392_3_En_4_Fig10_HTML.jpg)\n\
    \nFigure 4-10 ¶ Install a SQL Server Failover Cluster – Cluster Network Configuration\
    \ Page\n\nThe Server Configuration page has two tabs. The first tab is Service\
    \ Accounts. On this tab, which is illustrated in Figure [4-11](#394392_3_En_4_Chapter.xhtml#Fig11),\
    \ we will specify the service account that will be used as the security context\
    \ for each SQL Server service and also specify the startup mode for each of the\
    \ services. This is worthy of note because when installing a stand-alone instance,\
    \ you will usually set each service to start automatically. When installing a\
    \ cluster, however, cluster-aware services should be configured to start manually.\
    \ This is because they will be managed by the cluster service. ![Figure 4-11 ¶\
    \ Install a SQL Server Failover Cluster – Service Accounts Tab](images/394392_3_En_4_Chapter/394392_3_En_4_Fig11_HTML.jpg)\n\
    \nFigure 4-11 ¶ Install a SQL Server Failover Cluster – Service Accounts Tab\n\
    \nIn recent versions of SQL Server, it is possible to enable Perform Volume Maintenance\
    \ Tasks during setup, and this is implemented as a simple check box of the Service\
    \ Accounts tab. The consideration here is security vs. performance. If you choose\
    \ to perform volume maintenance tasks, then data files will not be zeroed out\
    \ when they are created or expanded; however, an attacker with specialist software\
    \ could potentially retrieve data that was previously stored on the allocated\
    \ disk blocks. Perform Volume Maintenance Tasks does not apply to transaction\
    \ log files.\n\nTip \n\nFor a full discussion on SQL Server security considerations,\
    \ I recommend the Apress title *Securing SQL Server 2nd Edition: DBAs Defending\
    \ the Database*, which can be purchased from [www.apress.com/gb/book/9781484241608](http://www.apress.com/gb/book/9781484241608).\n\
    \nOn the Collation tab, shown in Figure [4-12](#394392_3_En_4_Chapter.xhtml#Fig12),\
    \ you can specify the collation that will be configured for the instance. Wherever\
    \ possible, it is a good idea to use a consistent collation throughout the enterprise\
    \ or, at a minimum, throughout the instances that make up a data-tier application.\
    \ ![Figure 4-12 ¶ Install a SQL Server Failover Cluster – Collation Tab](images/394392_3_En_4_Chapter/394392_3_En_4_Fig12_HTML.jpg)\n\
    \nFigure 4-12 ¶ Install a SQL Server Failover Cluster – Collation Tab\n\nThe Database\
    \ Engine Configuration page consists of six tabs. The first of these is the Server\
    \ Configuration tab, which is illustrated in Figure [4-13](#394392_3_En_4_Chapter.xhtml#Fig13).\
    \ Here, we specify the authentication mode that the instance will use. ![Figure\
    \ 4-13 ¶ Install a SQL Server Failover Cluster – Server Configuration Tab](images/394392_3_En_4_Chapter/394392_3_En_4_Fig13_HTML.jpg)\n\
    \nFigure 4-13 ¶ Install a SQL Server Failover Cluster – Server Configuration Tab\n\
    \nWindows Authentication Mode means that the credentials that a user supplies\
    \ when logging into Windows will be passed to SQL Server, and the user does not\
    \ require any additional credentials to gain access to the instance. With mixed\
    \ mode, although Windows credentials can still be used to access the instance,\
    \ users can also be given second-tier credentials. If this option is selected,\
    \ then SQL Server will hold its own login names and passwords for login created\
    \ inside the instance, and users can supply these, in order to gain access, even\
    \ if their Windows identity does not have permissions.\n\nFor security best practice,\
    \ it is a good idea to only allow Windows authentication to your instance. This\
    \ is for two reasons. First, with Windows authentication only, if an attacker\
    \ were to gain access to your network, then they would still not be able to access\
    \ SQL Server, since they would not have a valid Windows account with the correct\
    \ permissions. With mixed-mode authentication, however, once inside the network,\
    \ attackers could use brute-force attacks or other hacking methodologies to attempt\
    \ to gain access via a second-tier SQL Server Login. Second, if you specify mixed-mode\
    \ authentication, then you are required to create an SA account. The SA account\
    \ is a SQL Server user account that has administrative privileges over the instance.\
    \ If the password for this account became compromised, then an attacker could\
    \ gain administrative control over SQL Server. If mixed-mode authentication must\
    \ be used, it is a good idea to disable the SA account.\n\nMixed-mode authentication\
    \ is a necessity in some cases, however. For example, you may have a legacy application\
    \ that does not support Windows authentication, or a third-party application that\
    \ has a hard-coded connection that uses second-tier authentication. These would\
    \ be two valid reasons why mixed-mode authentication may be required. Another\
    \ valid reason would be if you have users that need to access the instance from\
    \ a nontrusted domain.\n\nAdditionally, on the Server Configuration tab, you can\
    \ specify Windows users that will be added to the sysadmin fixed server role,\
    \ giving them unrestricted access to the instance. In our scenario, we will add\
    \ the AlwaysOn\\\\SQLAdmin user as an instance administrator and use Windows Authentication\
    \ only.\n\nOn the Data Directories tab, illustrated in Figure [4-14](#394392_3_En_4_Chapter.xhtml#Fig14),\
    \ you can alter the default location of the data root directory. On this screen,\
    \ you can also change the default location for user databases and their log files.\
    \ Finally, this tab allows you to specify a default location for backups of databases\
    \ that will be taken. In our scenario, we must ensure that the data root is pointing\
    \ at the Data volume, with log files pointing at the Logs volume. ![Figure 4-14\
    \ ¶ Install a SQL Server Failover Cluster – Data Directories Tab](images/394392_3_En_4_Chapter/394392_3_En_4_Fig14_HTML.jpg)\n\
    \nFigure 4-14 ¶ Install a SQL Server Failover Cluster – Data Directories Tab"

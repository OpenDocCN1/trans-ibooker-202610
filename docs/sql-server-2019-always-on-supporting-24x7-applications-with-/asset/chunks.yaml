    ] \\[int\\]   NOT NULL,          \\[Quantity\\] \\[int\\]    NOT NULL,          \\\
    [NetAmount\\] \\[money\\] NOT NULL,          \\[TaxAmount\\] \\[money\\] NOT NULL,\
    \          \\[InvoiceAddressID\\] \\[int\\] NOT NULL,          \\[DeliveryAddressID\\\
    ] \\[int\\] NOT NULL,          \\[DeliveryDate\\] \\[date\\] NULL, ) ; DECLARE\
    \ @Numbers TABLE (         Number        INT ) \\--Populate ExistingOrders with\

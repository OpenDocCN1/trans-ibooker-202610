    可以手动恢复会话，但如果这样做，在同步期间仍会再次遇到损坏的页面。请确保首先在主副本上修复或还原该页面。


    ## Log Shipping

    日志传送是一种可用于实现灾难恢复的技术。它通过在主服务器上备份事务日志，将其复制到辅助服务器，然后进行还原来工作。在需要延迟加载的 `DR` 场景中使用日志传送最为合适，因为使用
    `AOAG` 时无法实现这一点。例如，假设用户意外删除了表中所有数据。如果在 `DR` 服务器上的数据库更新之前存在延迟，则可以从 `DR` 服务器恢复该表的数据，然后重新填充生产服务器。这意味着您无需还原备份即可恢复数据。由于没有自动故障转移功能，日志传送不适用于高可用性。图
    2-7 中的图表说明了日志传送拓扑。 ![图 2-7 ¶ 日志传送拓扑](img/394392_3_En_2_Fig7_HTML.jpg)

    图 2-7 ¶ 日志传送拓扑


    ### Recovery Modes

    恢复模式

    在日志传送拓扑中，始终只有一个主服务器，即生产服务器。然而，可以拥有多个辅助服务器，这些服务器可以是 `DR` 服务器和用于卸载报告的服务器的混合。

    当您还原事务日志时，可以指定三种恢复模式：`Recovery`、`NoRecovery` 和 `Standby`。`Recovery` 模式会将数据库联机，这在日志传送中不受支持。`NoRecovery`
    模式会将数据库保持脱机状态，以便可以还原更多备份。这是日志传送的正常配置，也是 `DR` 场景下的适当选择。

    `Standby` 选项会将数据库联机，但在只读状态下，以便您可以还原进一步的备份。此功能通过维护 `TUF`（事务撤消文件）来实现。`TUF` 文件记录事务日志中任何未提交的事务。这意味着您可以回滚事务日志中的这些未提交事务，从而使数据库更易访问（尽管是只读的）。下一次需要应用还原时，可以在下一次日志还原的
    redo 阶段开始之前，将 `TUF` 文件中的未提交事务重新应用到日志中。

    图 2-8 说明了使用 `DR` 服务器和报告服务器的日志传送拓扑。 ![图 2-8 ¶ 使用 DR 和报告服务器的日志传送](img/394392_3_En_2_Fig8_HTML.jpg)

    图 2-8 ¶ 使用 DR 和报告服务器的日志传送


    ### Remote Monitor Server

    远程监视服务器

    可选地，您可以在日志传送拓扑中配置监视服务器。这有助于您集中监控和警报。当您实现监视服务器时，所有备份、复制和还原操作的历史记录和状态都存储在监视服务器上。监视服务器还允许您拥有一个单一的警报作业，该作业配置为监控拓扑中所有服务器上的备份、复制和还原操作，而无需在拓扑中的每个服务器上分别设置警报。

    **Caution**

    如果您希望使用监视服务器，重要的是在设置日志传送时进行配置。日志传送配置完成后，添加监视服务器的唯一方法是拆除并重新配置日志传送。


    ### Failover

    故障转移

    与其它高可用性和灾难恢复技术不同，日志传送的故障转移涉及一定程度的管理员工作。要执行日志传送故障转移，您必须备份事务日志的尾部并将其复制到辅助服务器，以及任何其他未复制的备份文件。

    您现在需要按顺序将剩余的事务日志备份应用到辅助服务器，以尾部日志备份结尾。所有还原都使用 `WITH NORECOVERY` 应用，除最终还原外，最终还原使用
    `WITH RECOVERY` 选项应用，以将数据库以一致的状态重新联机。如果您不计划故障回，可以使用辅助服务器作为新的主服务器重新配置日志传送。


    ## Combining Technologies

    组合技术

    为了满足您的业务目标和非功能性需求（`NFRs`），您需要将多个高可用性和灾难恢复技术组合在一起，以创建可靠、可扩展的平台。这方面的经典示例是需要将 `AlwaysOn
    Failover Cluster` 与 `AlwaysOn Availability Groups` 结合起来的要求。

    您可能需要组合这些技术的原因是，当您以同步模式使用 `AlwaysOn Availability Groups` 时，必须这样做才能实现自动故障转移，这可能会导致性能受阻。如本章前面所述，性能问题是由事务在主服务器上提交之前先在辅助服务器上提交引起的。然而，集群不会受到此问题的影响，因为它依赖于共享磁盘资源，因此事务只提交一次。

    因此，常见的做法是首先使用集群来实现高可用性，然后使用 `AlwaysOn Availability Groups` 执行 `DR` 和/或卸载报告。图 2-9
    中的图表说明了将集群和 `AOAG` 结合起来分别实现高可用性和灾难恢复的 `HA/DR` 拓扑。 ![图 2-9 ¶ 集群和 AlwaysOn 可用性组组合](img/394392_3_En_2_Fig9_HTML.jpg)

    图 2-9 ¶ 集群和 AlwaysOn 可用性组组合

    图 2-9 中的图表显示，数据库的主副本托管在双节点活动/被动集群上。如果活动节点发生故障，则集群规则适用，共享存储、网络名称和 IP 地址会重新附加到被动节点，后者随后成为活动节点。然而，如果两个节点都无法访问，可用性组侦听器会将流量指向位于
    `DR` 站点并使用日志流复制进行同步的集群的第三个节点。当然，当使用异步模式时，数据库必须由 `DBA` 手动故障转移。

    另一个常见场景是将集群与日志传送组合以分别实现高可用性和灾难恢复。这种组合的工作方式与集群结合 `AlwaysOn Availability Groups`
    非常相似，并在图 2-10 中说明。 ![图 2-10 ¶ 集群与日志传送组合](img/394392_3_En_2_Fig10_HTML.jpg)

    图 2-10 ¶ 集群与日志传送组合

    该图表显示，在主数据中心配置了双节点活动/被动集群。然后将托管在此实例上的数据库的事务日志发送到 `DR` 数据中心中的独立服务器。由于集群使用共享存储，您还应为备份卷使用共享存储，并将备份卷作为角色中的资源添加。这意味着当实例故障转移到另一个节点时，备份共享也会故障转移，并且日志传送会继续无中断地同步。

    **Caution**


    | `hadr_db_commit_mgr_set_policy` | Fires in response to a transaction Commit
    manager policy update |

    | `hadr_db_partner_set_policy` | Fires in response to an AlwaysOn partner commit
    policy update |

    | `hadr_db_partner_set_sync_state` | Fires in response to a synchronization state
    change of an AlwaysOn partner |

    | `hadr_apr_added_corrupted_page` | Fires when auto page repair added a corrupted

- raw: "Because there is no Active Directory authentication possible in this topology,\
    \ the database\\_mirroring endpoints will require certificates to communicate\
    \ with each other. We will also need SQL logins, which will be granted permissions\
    \ to connect to the endpoint. Therefore, we will first need to create the certificates.\
    \ This can be achieved using the script in Listing [7-11](#394392_3_En_7_Chapter.xhtml#PC11).\
    \ Here, we first create a Database Master Key in the master database. We then\
    \ create a certificate and back up that certificate to the operating system. This\
    \ should be repeated on all nodes that will participate in the Availability Group,\
    \ using a different certificate name for each instance. USE master GO \\--Create\
    \ the Database Master key CREATE MASTER KEY ENCRYPTION BY PASSWORD = 'Pa$$w0rd';\
    \ GO \\-- Create the certificate CREATE CERTIFICATE Node1Cert WITH SUBJECT = 'ClusterNode1\
    \ Certificate'; GO \\--Back up the certificate BACKUP CERTIFICATE Node1Cert TO\
    \ FILE = 'c:\\\\Certificates\\\\Node1Cert.cer'; GO Listing 7-11 \n\nCreate the\
    \ Certificates\n\nWe now need to create a login for every node, which will be\
    \ granted permissions to connect to the endpoint. We can achieve this using the\
    \ script in Listing [7-12](#394392_3_En_7_Chapter.xhtml#PC12). These logins should\
    \ be created on all instances that will participate in the Availability Group.\
    \ Therefore, the script should be run against all instances. CREATE LOGIN ClusterNode1\\\
    _AOAG WITH PASSWORD = 'Pa$$w0rd'; GO CREATE USER ClusterNode1\\_AOAG FOR LOGIN\
    \ ClusterNode1\\_AOAG; GO CREATE LOGIN ClusterNode2\\_AOAG WITH PASSWORD = 'Pa$$w0rd';\
    \ GO CREATE USER ClusterNode2\\_AOAG FOR LOGIN ClusterNode2\\_AOAG; GO Listing\
    \ 7-12 \n\nCreate the Logins\n\nWe can now copy the certificate for each instance\
    \ to all other instances and restore them using the command in Listing [7-13](#394392_3_En_7_Chapter.xhtml#PC13).\
    \ For each instance, you should change the certificate and usernames appropriately.\
    \ This listing shows the command that should be run on CLUSTERNODE1, in our topology.\
    \ CREATE CERTIFICATE Node2Cert AUTHORIZATION ClusterNode2\\_AOAG FROM FILE = 'C:\\\
    \\Certificates\\\\Node2Cert.cer' Listing 7-13 \n\nRestore the Certificates\n\n\
    Finally, now that the certificates exist on each of the nodes, we can go ahead\
    \ and create the database\\_mirroring endpoint, on each of the nodes. This can\
    \ be achieved using the script in Listing [7-14](#394392_3_En_7_Chapter.xhtml#PC14).\
    \ This script needs to be run on each of the nodes, with the certificate changed\
    \ to match the node. \\--Create the endpoint CREATE ENDPOINT AOAG\\_Endpoint STATE\
    \ = STARTED AS TCP (       LISTENER\\_PORT = 5022,       LISTENER\\_IP = ALL )\
    \ FOR DATABASE\\_MIRRORING (       AUTHENTICATION = CERTIFICATE Node1Cert,       ROLE\
    \ = ALL ) \\--Grant each user permissions to connect to the endpoint GRANT CONNECT\
    \ ON ENDPOINT::AOAG\\_Endpoint TO ClusterNode1\\_AOAG; GO GRANT CONNECT ON ENDPOINT::AOAG\\\
    _Endpoint TO ClusterNode2\\_AOAG; GO Listing 7-14 \n\nCreate the Endpoint\n\n\
    You can now create an Availability Group using the techniques discussed in Chapter\
    \ [5](#394392_3_En_5_Chapter.xhtml) of this book.\n\n## Distributed Availability\
    \ Groups\n\nDistributed Availability Groups (DAG) are an extension of Availability\
    \ Groups, which allow for data to be synchronized between two separate Availability\
    \ Groups. This is an exciting technology, with many different use cases. For example,\
    \ it allows data synchronization between Windows- and Linux-based Availability\
    \ Groups, it allows the number of readable secondary replicas to be extended beyond\
    \ 8 (which is the limit for a standard Availability Group), and it allows cross-site\
    \ replication, without the complexity of a stretch cluster. Distributed Availability\
    \ Groups can also help server migrations by providing data synchronization when\
    \ an in-place upgrade is not possible and a side-by-side migration is required.\
    \ They can also be used as an alternative to domain-independent Availability Groups\
    \ when you have servers in different domains.\n\nWhile each side of the Distributed\
    \ Availability Group can be a Windows Failover Cluster, this is not a requirement,\
    \ as the focus is very much on maintaining the databases, and no cluster configuration\
    \ occurs.\n\nIn this section, we will illustrate the technology by configuring\
    \ DAGs for our HR Availability Group that we created in Chapter [5](#394392_3_En_5_Chapter.xhtml),\
    \ between our ALWAYSON-C Cluster and a Linux-based Availability Group called Linux\\\
    _AOAG which is hosted on two Linux servers, participating in a Pacemaker cluster.\n\
    \nThe first step is to create the Distributed Availability Group on the Linux\
    \ cluster. This can be achieved by using the script in Listing [7-15](#394392_3_En_7_Chapter.xhtml#PC15).\
    \ Note the WITH (DISTRIBUTED) syntax, followed by the specifications of each Availability\
    \ Group.\n\nNote \n\nBefore starting, you should remove existing databases from\
    \ the HR Availability Group; otherwise, it will not be able to join the Distributed\
    \ Availability Group as the secondary Availability Group must be empty.\n\nCREATE\
    \ AVAILABILITY GROUP DistributedAG    WITH (DISTRIBUTED)    AVAILABILITY GROUP\
    \ ON       'HR' WITH       (          LISTENER\\_URL = 'tcp://HRListener.alwayson.com:1433',\
    \          AVAILABILITY\\_MODE = ASYNCHRONOUS\\_COMMIT,          FAILOVER\\_MODE\
    \ = MANUAL,          SEEDING\\_MODE = AUTOMATIC       ),       'Linux\\_AOAG'\
    \ WITH       (          LISTENER\\_URL = 'tcp://LinuxListener:5022',          AVAILABILITY\\\
    _MODE = ASYNCHRONOUS\\_COMMIT,          FAILOVER\\_MODE = MANUAL,          SEEDING\\\
    _MODE = AUTOMATIC       ); GO Listing 7-15 \n\nCreate the Distributed Availability\
    \ Group\n\nWe can now run the command in Listing [7-16](#394392_3_En_7_Chapter.xhtml#PC16),\
    \ against the PROSQLADMIN-C cluster, to join it to the Distributed Availability\
    \ Group. ALTER AVAILABILITY GROUP DistributedAG    JOIN    AVAILABILITY GROUP\
    \ ON       'HR' WITH       (          LISTENER\\_URL = 'tcp://HRListener.alwayson.com:1433',\
    \          AVAILABILITY\\_MODE = ASYNCHRONOUS\\_COMMIT,          FAILOVER\\_MODE\
    \ = MANUAL,          SEEDING\\_MODE = AUTOMATIC       ),       'Linux\\_AOAG'\
    \ WITH       (          LISTENER\\_URL = 'tcp://LinuxListener:5022',          AVAILABILITY\\\
    _MODE = ASYNCHRONOUS\\_COMMIT,          FAILOVER\\_MODE = MANUAL,          SEEDING\\\
    _MODE = AUTOMATIC       ) ; GO Listing 7-16 \n\nJoin the Second Availability Group\n\
    \nTip \n\nDatabases will need to be manually joined to secondary replicas within\
    \ the secondary Availability Group.\n\n## Summary\n\nAvailability Groups offer\
    \ a large amount of flexibility, enabling DBAs to configure high availability,\
    \ disaster recovery, or read-scaling in almost any situation. Examples of atypical\
    \ Availability Group topologies include configuring Availability Groups across\
    \ Azure VMs, configuring Availability Groups with no underlying cluster, and configuring\
    \ Availability Groups across domains, or with no domain at all.\n\nWhen creating\
    \ Availability Groups in Azure VMs, high availability can best be achieved by\
    \ splitting the VMs across Availability Sets and Availability Zones, while DR\
    \ can best be achieved by placing the DR node in a different Azure Region. In\
    \ this scenario, data sovereignty can be maintained by using Azure paired regions,\
    \ which are inside the same political geography while still geographically dispersing\
    \ the solution.\n\nClusterless Availability Groups cannot be used to achieve high\
    \ availability. This is because there is no cluster to perform node health checks.\
    \ They are very well suited to read-scale scenarios, however, where the complexity\
    \ of the clustering components can be avoided.\n\nDomain-independent Availability\
    \ Groups (also known as workgroup availability groups) allow for Availability\
    \ Groups to be configured across multiple domains, or where there is no domain\
    \ at all. They are especially well suited to hybrid cloud scenarios, where your\
    \ organization has chosen to create a separate domain in the cloud, as opposed\
    \ to stretching their on-premise domain."
  fmt: "\nBecause there is no Active Directory authentication possible in this topology,\
    \ the `database_mirroring` endpoints will require certificates to communicate\
    \ with each other. We will also need SQL logins, which will be granted permissions\
    \ to connect to the endpoint. Therefore, we will first need to create the certificates.\
    \ This can be achieved using the script in Listing [7-11](#394392_3_En_7_Chapter.xhtml#PC11).\
    \ Here, we first create a Database Master Key in the `master` database. We then\
    \ create a certificate and back up that certificate to the operating system. This\
    \ should be repeated on all nodes that will participate in the Availability Group,\
    \ using a different certificate name for each instance.\n\n### Create the Certificates\n\
    \n```\nUSE master\nGO\n--Create the Database Master key\nCREATE MASTER KEY ENCRYPTION\
    \ BY PASSWORD = 'Pa$$w0rd';\nGO\n-- Create the certificate\nCREATE CERTIFICATE\
    \ Node1Cert WITH SUBJECT = 'ClusterNode1 Certificate';\nGO\n--Back up the certificate\n\
    BACKUP CERTIFICATE Node1Cert TO FILE = 'c:\\\\Certificates\\\\Node1Cert.cer';\n\
    GO\n```\n\nWe now need to create a login for every node, which will be granted\
    \ permissions to connect to the endpoint. We can achieve this using the script\
    \ in Listing [7-12](#394392_3_En_7_Chapter.xhtml#PC12). These logins should be\
    \ created on all instances that will participate in the Availability Group. Therefore,\
    \ the script should be run against all instances.\n\n### Create the Logins\n\n\
    ```\nCREATE LOGIN ClusterNode1_AOAG WITH PASSWORD = 'Pa$$w0rd';\nGO\nCREATE USER\
    \ ClusterNode1_AOAG FOR LOGIN ClusterNode1_AOAG;\nGO\nCREATE LOGIN ClusterNode2_AOAG\
    \ WITH PASSWORD = 'Pa$$w0rd';\nGO\nCREATE USER ClusterNode2_AOAG FOR LOGIN ClusterNode2_AOAG;\n\
    GO\n```\n\nWe can now copy the certificate for each instance to all other instances\
    \ and restore them using the command in Listing [7-13](#394392_3_En_7_Chapter.xhtml#PC13).\
    \ For each instance, you should change the certificate and usernames appropriately.\
    \ This listing shows the command that should be run on `CLUSTERNODE1`, in our\
    \ topology.\n\n### Restore the Certificates\n\n```\nCREATE CERTIFICATE Node2Cert\
    \ AUTHORIZATION ClusterNode2_AOAG FROM FILE = 'C:\\\\Certificates\\\\Node2Cert.cer'\n\
    ```\n\nFinally, now that the certificates exist on each of the nodes, we can go\
    \ ahead and create the `database_mirroring` endpoint, on each of the nodes. This\
    \ can be achieved using the script in Listing [7-14](#394392_3_En_7_Chapter.xhtml#PC14).\
    \ This script needs to be run on each of the nodes, with the certificate changed\
    \ to match the node.\n\n### Create the Endpoint\n\n```\n--Create the endpoint\n\
    CREATE ENDPOINT AOAG_Endpoint STATE = STARTED AS TCP (\n      LISTENER_PORT =\
    \ 5022,\n      LISTENER_IP = ALL\n) FOR DATABASE_MIRRORING (\n      AUTHENTICATION\
    \ = CERTIFICATE Node1Cert,\n      ROLE = ALL\n)\n--Grant each user permissions\
    \ to connect to the endpoint\nGRANT CONNECT ON ENDPOINT::AOAG_Endpoint TO ClusterNode1_AOAG;\n\
    GO\nGRANT CONNECT ON ENDPOINT::AOAG_Endpoint TO ClusterNode2_AOAG;\nGO\n```\n\n\
    You can now create an Availability Group using the techniques discussed in Chapter\
    \ [5](#394392_3_En_5_Chapter.xhtml) of this book.\n\n## Distributed Availability\
    \ Groups\n\nDistributed Availability Groups (`DAG`) are an extension of Availability\
    \ Groups, which allow for data to be synchronized between two separate Availability\
    \ Groups. This is an exciting technology, with many different use cases. For example,\
    \ it allows data synchronization between Windows- and Linux-based Availability\
    \ Groups, it allows the number of readable secondary replicas to be extended beyond\
    \ 8 (which is the limit for a standard Availability Group), and it allows cross-site\
    \ replication, without the complexity of a stretch cluster. Distributed Availability\
    \ Groups can also help server migrations by providing data synchronization when\
    \ an in-place upgrade is not possible and a side-by-side migration is required.\
    \ They can also be used as an alternative to domain-independent Availability Groups\
    \ when you have servers in different domains.\n\nWhile each side of the Distributed\
    \ Availability Group can be a Windows Failover Cluster, this is not a requirement,\
    \ as the focus is very much on maintaining the databases, and no cluster configuration\
    \ occurs.\n\nIn this section, we will illustrate the technology by configuring\
    \ DAGs for our HR Availability Group that we created in Chapter [5](#394392_3_En_5_Chapter.xhtml),\
    \ between our `ALWAYSON-C` Cluster and a Linux-based Availability Group called\
    \ `Linux_AOAG` which is hosted on two Linux servers, participating in a Pacemaker\
    \ cluster.\n\nThe first step is to create the Distributed Availability Group on\
    \ the Linux cluster. This can be achieved by using the script in Listing [7-15](#394392_3_En_7_Chapter.xhtml#PC15).\
    \ Note the `WITH (DISTRIBUTED)` syntax, followed by the specifications of each\
    \ Availability Group.\n\n> **Note**\n> Before starting, you should remove existing\
    \ databases from the HR Availability Group; otherwise, it will not be able to\
    \ join the Distributed Availability Group as the secondary Availability Group\
    \ must be empty.\n\n```\nCREATE AVAILABILITY GROUP DistributedAG\n   WITH (DISTRIBUTED)\n\
    \   AVAILABILITY GROUP ON\n      'HR' WITH\n      (\n         LISTENER_URL = 'tcp://HRListener.alwayson.com:1433',\n\
    \         AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n\
    \         SEEDING_MODE = AUTOMATIC\n      ),\n      'Linux_AOAG' WITH\n      (\n\
    \         LISTENER_URL = 'tcp://LinuxListener:5022',\n         AVAILABILITY_MODE\
    \ = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n         SEEDING_MODE\
    \ = AUTOMATIC\n      );\nGO\n```\n\nWe can now run the command in Listing [7-16](#394392_3_En_7_Chapter.xhtml#PC16),\
    \ against the `PROSQLADMIN-C` cluster, to join it to the Distributed Availability\
    \ Group.\n\n```\nALTER AVAILABILITY GROUP DistributedAG\n   JOIN\n   AVAILABILITY\
    \ GROUP ON\n      'HR' WITH\n      (\n         LISTENER_URL = 'tcp://HRListener.alwayson.com:1433',\n\
    \         AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n\
    \         SEEDING_MODE = AUTOMATIC\n      ),\n      'Linux_AOAG' WITH\n      (\n\
    \         LISTENER_URL = 'tcp://LinuxListener:5022',\n         AVAILABILITY_MODE\
    \ = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n         SEEDING_MODE\
    \ = AUTOMATIC\n      )\n;\nGO\n```\n\n> **Tip**\n> Databases will need to be manually\
    \ joined to secondary replicas within the secondary Availability Group.\n\n##\
    \ Summary\n\nAvailability Groups offer a large amount of flexibility, enabling\
    \ DBAs to configure high availability, disaster recovery, or read-scaling in almost\
    \ any situation. Examples of atypical Availability Group topologies include configuring\
    \ Availability Groups across `Azure VMs`, configuring Availability Groups with\
    \ no underlying cluster, and configuring Availability Groups across domains, or\
    \ with no domain at all.\n\nWhen creating Availability Groups in Azure VMs, high\
    \ availability can best be achieved by splitting the VMs across `Availability\
    \ Sets` and `Availability Zones`, while DR can best be achieved by placing the\
    \ DR node in a different `Azure Region`. In this scenario, data sovereignty can\
    \ be maintained by using `Azure paired regions`, which are inside the same political\
    \ geography while still geographically dispersing the solution.\n\n`Clusterless\
    \ Availability Groups` cannot be used to achieve high availability. This is because\
    \ there is no cluster to perform node health checks. They are very well suited\
    \ to read-scale scenarios, however, where the complexity of the clustering components\
    \ can be avoided.\n\nDomain-independent Availability Groups (also known as `workgroup\
    \ availability groups`) allow for Availability Groups to be configured across\
    \ multiple domains, or where there is no domain at all. They are especially well\
    \ suited to hybrid cloud scenarios, where your organization has chosen to create\
    \ a separate domain in the cloud, as opposed to stretching their on-premise domain.\n"
  trans: "\n由于在此拓扑中无法使用 Active Directory 身份验证，`database_mirroring` 端点需要使用证书相互通信。我们还需要\
    \ SQL 登录名，这些登录名将被授予连接到端点的权限。因此，我们首先需要创建证书。这可以通过清单 7-11 中的脚本实现。在这里，我们首先在 `master`\
    \ 数据库中创建数据库主密钥。然后我们创建证书并将该证书备份到操作系统中。这应在将参与可用性组的每个节点上重复执行，为每个实例使用不同的证书名称。\n\n\
    ### 创建证书\n\n```\nUSE master\nGO\n--Create the Database Master key\nCREATE MASTER\
    \ KEY ENCRYPTION BY PASSWORD = 'Pa$$w0rd';\nGO\n-- Create the certificate\nCREATE\
    \ CERTIFICATE Node1Cert WITH SUBJECT = 'ClusterNode1 Certificate';\nGO\n--Back\
    \ up the certificate\nBACKUP CERTIFICATE Node1Cert TO FILE = 'c:\\\\Certificates\\\
    \\Node1Cert.cer';\nGO\n```\n\n我们现在需要为每个节点创建一个登录名，该登录名将被授予连接到端点的权限。我们可以使用清单 7-12\
    \ 中的脚本实现。这些登录名应在将参与可用性组的所有实例上创建。因此，应针对所有实例运行该脚本。\n\n### 创建登录名\n\n```\nCREATE LOGIN\
    \ ClusterNode1_AOAG WITH PASSWORD = 'Pa$$w0rd';\nGO\nCREATE USER ClusterNode1_AOAG\
    \ FOR LOGIN ClusterNode1_AOAG;\nGO\nCREATE LOGIN ClusterNode2_AOAG WITH PASSWORD\
    \ = 'Pa$$w0rd';\nGO\nCREATE USER ClusterNode2_AOAG FOR LOGIN ClusterNode2_AOAG;\n\
    GO\n```\n\n我们现在可以将每个实例的证书复制到所有其他实例，并使用清单 7-13 中的命令将其恢复。对于每个实例，您应适当更改证书和用户名。此清单显示了在我们的拓扑中应在\
    \ `CLUSTERNODE1` 上运行的命令。\n\n### 恢复证书\n\n```\nCREATE CERTIFICATE Node2Cert AUTHORIZATION\
    \ ClusterNode2_AOAG FROM FILE = 'C:\\\\Certificates\\\\Node2Cert.cer'\n```\n\n\
    最后，现在证书已存在于每个节点上，我们可以继续在每个节点上创建 `database_mirroring` 端点。这可以通过清单 7-14 中的脚本实现。此脚本需要在每个节点上运行，并将证书更改为与节点匹配。\n\
    \n### 创建端点\n\n```\n--Create the endpoint\nCREATE ENDPOINT AOAG_Endpoint STATE\
    \ = STARTED AS TCP (\n      LISTENER_PORT = 5022,\n      LISTENER_IP = ALL\n)\
    \ FOR DATABASE_MIRRORING (\n      AUTHENTICATION = CERTIFICATE Node1Cert,\n  \
    \    ROLE = ALL\n)\n--Grant each user permissions to connect to the endpoint\n\
    GRANT CONNECT ON ENDPOINT::AOAG_Endpoint TO ClusterNode1_AOAG;\nGO\nGRANT CONNECT\
    \ ON ENDPOINT::AOAG_Endpoint TO ClusterNode2_AOAG;\nGO\n```\n\n您现在可以使用本书第 5 章中讨论的技术创建可用性组。\n\
    \n## 分布式可用性组\n\n分布式可用性组 (`DAG`) 是可用性组的扩展，允许在两个独立的可用性组之间同步数据。这是一项令人兴奋的技术，具有许多不同的用例。例如，它允许在基于\
    \ Windows 和 Linux 的可用性组之间进行数据同步，它允许可读的辅助副本数量扩展到 8 之外（这是标准可用性组的限制），并且允许跨站点复制，而无需伸展集群的复杂性。分布式可用性组还可以通过在就地升级不可行且需要并行迁移时提供数据同步来帮助服务器迁移。它们也可以用作域独立可用性组的替代方案，当您在不同域中拥有服务器时。\n\
    \n虽然分布式可用性组的每一侧可以是 Windows 故障转移群集，但这不是必需的，因为重点非常集中在维护数据库上，并且不会进行群集配置。\n\n在本节中，我们将通过为我们在第\
    \ 5 章中创建的 HR 可用性组配置 DAG 来说明该技术，该组位于我们的 `ALWAYSON-C` 集群和一个名为 `Linux_AOAG` 的基于 Linux\
    \ 的可用性组之间，后者托管在两个参与 Pacemaker 集群的 Linux 服务器上。\n\n第一步是在 Linux 集群上创建分布式可用性组。这可以通过使用清单\
    \ 7-15 中的脚本实现。请注意 `WITH (DISTRIBUTED)` 语法，后跟每个可用性组的规范。\n\n> **注意**\n> 开始之前，您应从\
    \ HR 可用性组中删除现有数据库；否则，它将无法加入分布式可用性组，因为辅助可用性组必须为空。\n\n```\nCREATE AVAILABILITY GROUP\
    \ DistributedAG\n   WITH (DISTRIBUTED)\n   AVAILABILITY GROUP ON\n      'HR' WITH\n\
    \      (\n         LISTENER_URL = 'tcp://HRListener.alwayson.com:1433',\n    \
    \     AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n\
    \         SEEDING_MODE = AUTOMATIC\n      ),\n      'Linux_AOAG' WITH\n      (\n\
    \         LISTENER_URL = 'tcp://LinuxListener:5022',\n         AVAILABILITY_MODE\
    \ = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n         SEEDING_MODE\
    \ = AUTOMATIC\n      );\nGO\n```\n\n我们现在可以针对 `PROSQLADMIN-C` 集群运行清单 7-16 中的命令，以将其加入分布式可用性组。\n\
    \n```\nALTER AVAILABILITY GROUP DistributedAG\n   JOIN\n   AVAILABILITY GROUP\
    \ ON\n      'HR' WITH\n      (\n         LISTENER_URL = 'tcp://HRListener.alwayson.com:1433',\n\
    \         AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n\
    \         SEEDING_MODE = AUTOMATIC\n      ),\n      'Linux_AOAG' WITH\n      (\n\
    \         LISTENER_URL = 'tcp://LinuxListener:5022',\n         AVAILABILITY_MODE\
    \ = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n         SEEDING_MODE\
    \ = AUTOMATIC\n      )\n;\nGO\n```\n\n> **提示**\n> 数据库需要手动加入到辅助可用性组内的辅助副本中。\n\n\
    ## 摘要\n\n可用性组提供大量灵活性，使 DBA 能够在几乎任何情况下配置高可用性、灾难恢复或读扩展。非典型可用性组拓扑的示例包括在 `Azure VMs`\
    \ 跨越配置可用性组、在没有底层集群的情况下配置可用性组，以及跨域或完全没有域的情况下配置可用性组。\n\n在 `Azure VMs` 中创建可用性组时，高可用性最好通过将虚拟机拆分到\
    \ `Availability Sets` 和 `Availability Zones` 来实现，而灾难恢复最好通过将 DR 节点放置在不同的 `Azure\
    \ Region` 中来实现。在此场景中，可以通过使用 `Azure paired regions` 来维护数据主权，这些区域位于相同的政治地理范围内，同时仍在地理上分散解决方案。\n\
    \n`Clusterless Availability Groups` 不能用于实现高可用性。这是因为没有集群来执行节点健康检查。然而，它们非常适合读扩展场景，在这些场景中可以避免集群组件的复杂性。\n\
    \n域独立可用性组（也称为 `workgroup availability groups`）允许在多个域之间或完全没有域的情况下配置可用性组。它们特别适合混合云场景，在这些场景中，您的组织选择在云中创建单独的域，而不是扩展其本地域。\n"

    \ RECOVERY FULL ; GO  Listing 5-1 \n\nCreating Databases\n\n### Configuring SQL\
    \ Server"
  fmt: "\nBefore implementing `AlwaysOn Availability Groups`, we first create four\
    \ databases, which we will use during the demonstrations in this chapter. Each\
    \ contains a single table, which we populate with data. Each database is configured\
    \ with Recovery mode set to `FULL`. This is a hard requirement for a database\
    \ to use `AlwaysOn Availability Groups` because data is synchronized via a log\
    \ stream. The script in Listing [5-1](#394392_3_En_5_Chapter.xhtml#PC1) creates\
    \ these databases.\n\n### Listing 5-1 Creating Databases\n\n```sql\n--Create Sales\
    \ Database\nCREATE DATABASE Sales;\nGO\nUSE Sales;\nGO\nCREATE TABLE [dbo].[Orders](\n\
    \    [OrderNumber] [int] IDENTITY(1,1) NOT NULL PRIMARY KEY CLUSTERED,\n    [OrderDate]\
    \ [date] NOT NULL,\n    [CustomerID] [int] NOT NULL,\n    [ProductID] [int] NOT\
    \ NULL,\n    [Quantity] [int] NOT NULL,\n    [NetAmount] [money] NOT NULL,\n \
    \   [TaxAmount] [money] NOT NULL,\n    [InvoiceAddressID] [int] NOT NULL,\n  \
    \  [DeliveryAddressID] [int] NOT NULL,\n    [DeliveryDate] [date] NULL,\n);\n\
    DECLARE @Numbers TABLE (\n    Number INT\n)\n--Populate ExistingOrders with data\n\
    ;WITH CTE(Number) AS (\n    SELECT 1 Number\n    UNION ALL\n    SELECT Number\
    \ + 1\n    FROM CTE\n    WHERE Number < 100\n)\nINSERT INTO @Numbers SELECT Number\
    \ FROM CTE\nINSERT INTO Orders\nSELECT\n    (SELECT CAST(DATEADD(dd,(SELECT TOP\
    \ 1 Number FROM @Numbers ORDER BY NEWID()),getdate())as DATE)),\n    (SELECT TOP\
    \ 1 Number -10 FROM @Numbers ORDER BY NEWID()),\n    (SELECT TOP 1 Number FROM\
    \ @Numbers ORDER BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers ORDER BY\
    \ NEWID()),\n    500,\n    100,\n    (SELECT TOP 1 Number FROM @Numbers ORDER\
    \ BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n  \
    \  (SELECT CAST(DATEADD(dd,(SELECT TOP 1 Number - 10 FROM @Numbers ORDER BY NEWID()),getdate())\
    \ as DATE))\nFROM @Numbers a CROSS JOIN @Numbers b;\n--SET FULL recovery mode\
    \ on the database - required for Availability Groups\nALTER DATABASE Sales SET\
    \ RECOVERY FULL;\nGO\n--Create Customers Database\nCREATE DATABASE Customers;\n\
    GO\nUSE Customers;\nGO\nCREATE TABLE dbo.Customers (\n    ID INT PRIMARY KEY IDENTITY,\n\
    \    FirstName NVARCHAR(30),\n    LastName NVARCHAR(30),\n    CreditCardNumber\
    \ VARBINARY(8000)\n);\nGO\n--Populate the table\nDECLARE @Numbers TABLE (\n  \
    \  Number INT\n);\nWITH CTE(Number) AS (\n    SELECT 1 Number\n    UNION ALL\n\
    \    SELECT Number + 1\n    FROM CTE\n    WHERE Number < 100\n)\nINSERT INTO @Numbers\
    \ SELECT Number FROM CTE\nDECLARE @Names TABLE (\n    FirstName VARCHAR(30),\n\
    \    LastName VARCHAR(30)\n);\nINSERT INTO @Names VALUES('Peter', 'Carter'),\n\
    \    ('Michael', 'Smith'),\n    ('Danielle', 'Mead'),\n    ('Reuben', 'Roberts'),\n\
    \    ('Iris', 'Jones'),\n    ('Sylvia', 'Davies'),\n    ('Finola', 'Wright'),\n\
    \    ('Edward', 'James'),\n    ('Marie', 'Andrews'),\n    ('Jennifer', 'Abraham'),\n\
    \    ('Margaret', 'Jones')\nINSERT INTO Customers(Firstname, LastName, CreditCardNumber)\n\
    SELECT\n    FirstName\n    , LastName\n    , CreditCardNumber\nFROM (\n    SELECT\n\
    \        (SELECT TOP 1 FirstName FROM @Names ORDER BY NEWID()) FirstName\n   \
    \     , (SELECT TOP 1 LastName FROM @Names ORDER BY NEWID()) LastName\n      \
    \  , (SELECT TOP 1 CONVERT(VARBINARY(8000), (\n            (SELECT TOP 1 CAST(Number\
    \ * 100 AS CHAR(4)) FROM @Numbers WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID())\n\
    \            + '-' +\n            (SELECT TOP 1 CAST(Number * 100 AS CHAR(4))\
    \ FROM @Numbers WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID())\n           \
    \ + '-' +\n            (SELECT TOP 1 CAST(Number * 100 AS CHAR(4)) FROM @Numbers\
    \ WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID())\n            + '-' +\n    \
    \        (SELECT TOP 1 CAST(Number * 100 AS CHAR(4)) FROM @Numbers WHERE Number\
    \ BETWEEN 10 AND 99 ORDER BY NEWID())\n        )) FROM @Numbers a\n    ) CreditCardNumber\n\
    ) d CROSS JOIN @Numbers b CROSS JOIN @Numbers c;\n--SET FULL recovery mode on\
    \ the database - required for Availability Groups\nALTER DATABASE Customers SET\
    \ RECOVERY FULL;\nGO\n--Create Accounts Database\nCREATE DATABASE Accounts;\n\
    GO\nUSE Accounts;\nGO\nCREATE TABLE [dbo].[PurchaseOrders](\n    [OrderNumber]\
    \ [int] IDENTITY(1,1) NOT NULL PRIMARY KEY CLUSTERED,\n    [OrderDate] [date]\
    \ NOT NULL,\n    [CustomerID] [int] NOT NULL,\n    [ProductID] [int] NOT NULL,\n\
    \    [Quantity] [int] NOT NULL,\n    [NetAmount] [money] NOT NULL,\n    [TaxAmount]\
    \ [money] NOT NULL,\n    [InvoiceAddressID] [int] NOT NULL,\n    [DeliveryAddressID]\
    \ [int] NOT NULL,\n    [DeliveryDate] [date] NULL,\n);\nDECLARE @Numbers TABLE\
    \ (\n    Number INT\n)\n--Populate ExistingPurchaseOrders with data\n;WITH CTE(Number)\
    \ AS (\n    SELECT 1 Number\n    UNION ALL\n    SELECT Number + 1\n    FROM CTE\n\
    \    WHERE Number < 100\n)\nINSERT INTO @Numbers SELECT Number FROM CTE\nINSERT\
    \ INTO PurchaseOrders\nSELECT\n    (SELECT CAST(DATEADD(dd,(SELECT TOP 1 Number\
    \ FROM @Numbers ORDER BY NEWID()),getdate())as DATE)),\n    (SELECT TOP 1 Number\
    \ -10 FROM @Numbers ORDER BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers\
    \ ORDER BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n\
    \    500,\n    100,\n    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n\
    \    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    (SELECT CAST(DATEADD(dd,(SELECT\
    \ TOP 1 Number - 10 FROM @Numbers ORDER BY NEWID()),getdate()) as DATE))\nFROM\
    \ @Numbers a CROSS JOIN @Numbers b;\n--SET FULL recovery mode on the database\
    \ - required for Availability Groups\nALTER DATABASE Accounts SET RECOVERY FULL;\n\
    GO\nCREATE DATABASE HR;\nGO\nUSE HR;\nGO\nCREATE TABLE dbo.Employees (\n    ID\
    \ INT PRIMARY KEY IDENTITY,\n    FirstName NVARCHAR(30),\n    LastName NVARCHAR(30),\n\
    \    EmployeeNumber INT\n);\nGO\n--Populate the table\nDECLARE @Numbers TABLE\
    \ (\n    Number INT\n);\nWITH CTE(Number) AS (\n    SELECT 1 Number\n    UNION\
    \ ALL\n    SELECT Number + 1\n    FROM CTE\n    WHERE Number < 100\n)\nINSERT\
    \ INTO @Numbers SELECT Number FROM CTE\nDECLARE @Names TABLE (\n    FirstName\
    \ VARCHAR(30),\n    LastName VARCHAR(30)\n);\nINSERT INTO @Names VALUES('Peter',\
    \ 'Carter'),\n    ('Michael', 'Smith'),\n    ('Danielle', 'Mead'),\n    ('Reuben',\
    \ 'Roberts'),\n    ('Iris', 'Jones'),\n    ('Sylvia', 'Davies'),\n    ('Finola',\
    \ 'Wright'),\n    ('Edward', 'James'),\n    ('Marie', 'Andrews'),\n    ('Jennifer',\
    \ 'Abraham'),\n    ('Margaret', 'Jones')\nINSERT INTO Employees(Firstname, LastName,\
    \ EmployeeNumber)\nSELECT\n    (SELECT TOP 1 FirstName FROM @Names ORDER BY NEWID())\
    \ FirstName\n    , (SELECT TOP 1 LastName FROM @Names ORDER BY NEWID()) LastName\n\
    \    , a.Number EmployeeNumber\nFROM @Numbers a;\n--SET FULL recovery mode on\
    \ the database - required for Availability Groups\nALTER DATABASE HR SET RECOVERY\
    \ FULL;\nGO\n```\n\n### Configuring SQL Server\n"

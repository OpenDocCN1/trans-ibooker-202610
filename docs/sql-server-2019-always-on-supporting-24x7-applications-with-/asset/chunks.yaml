  trans: "\n到目前为止，我们已经讨论了 `AlwaysOn Availability Groups` 和 `AlwaysOn Failover Clustered\
    \ Instances` 的典型、本地企业工作负载场景。然而，AlwaysOn 是一个如此灵活的技术套件，以至于存在许多你可以利用的变体。因此，本章将概述一些不太典型的\
    \ AlwaysOn 场景，你可能需要支持。这些包括 `Basic Availability Groups`、`Availability Groups` 在\
    \ Azure 中、`Distributed Availability Groups`，以及在没有集群或域的情况下创建 `Availability Groups`。\n\
    \n在本章中，我们将执行以下活动：\n* 在 Azure IaaS 中创建可用性组。\n* 创建无集群可用性组。\n* 创建域无关可用性组。\n* 创建分布式可用性组。\n\
    \n## 基本可用性组\n\n本书迄今为止的所有可用性组演示都需要 `SQL Server Enterprise Edition`，但可用性组在 `SQL\
    \ Server Standard Edition` 中也可用。然而在标准版中，可用性组的功能是有限的，因此它们被称为 `Basic Availability\
    \ Groups`。\n\n最明显限制是基本可用性组仅支持两个副本。然而，副本可以配置为同步或异步提交模式。这意味着你仍然可以实现高可用性或灾难恢复。\n\n\
    **注意**\nLinux 上的基本可用性组支持第三个仅配置的副本，这是实现高可用的必要条件。请参阅第 6 章了解更多详细信息。\n\n次要副本不支持只读连接。这意味着基本可用性组不仅不支持读取扩展，也不支持在次要副本上执行备份或完整性检查。\n\
    \n另一个限制是基本可用性组只能包含单个数据库。这意味着无法一起故障转移多个数据库，使得大型实例的管理变得更加困难。\n\n其他高级可用性组功能，例如分布式可用性组，也不受支持，并且一旦构建了基本可用性组，就无法将其升级为完整可用性组。相反，必须将其销毁并重新创建。\n\
    \n要实现基本可用性组，你可以使用本书前面讨论过的相同语法，显而易见的例外是不能实现不受支持的功能。基本可用性组独有的唯一语法是在 `WITH` 子句中添加\
    \ `BASIC` 标记，这会降低可用功能。例如，列表 7-1 中的脚本将在两个服务器之间创建可用性组，服务器名为 `SQLStdProd` 和 `SQLStdSyncHA`，并且两台服务器都安装了\
    \ SQL Server Standard Edition 的默认实例。\n\n```\nCREATE AVAILABILITY GROUP BasicAGAG\
    \ WITH (\n    AUTOMATED_BACKUP_PREFERENCE = PRIMARY,\n    BASIC,\n    REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT\
    \ = 0\n)\nFOR DATABASE Sales\nREPLICA ON 'SQLSTDPROD' WITH (\n    ENDPOINT_URL\
    \ = 'TCP://SQLSTDPROD.AlwaysOn.com:5022',\n    FAILOVER_MODE = AUTOMATIC,\n  \
    \  AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n    SEEDING_MODE = AUTOMATIC\n),\n\
    'SQLSTDSYNCHA' WITH (\n    ENDPOINT_URL = N'TCP://SQLSTDSYNCHA.AlwaysOn.com:5022',\n\
    \    FAILOVER_MODE = AUTOMATIC,\n    AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n\
    \    SEEDING_MODE = AUTOMATIC\n);\nGO\n```\nListing 7-1\n创建基本可用性组\n\n## Azure\
    \ IaaS 上的可用性组\n\n当将数据库迁移到云时，你有多种目标选项。Azure SQL Database 和弹性数据库池提供数据库即服务，而 Azure\
    \ 托管实例提供 SQL Server 即服务。这两种服务都基于可用性组提供高可用性。然而，如果你的应用程序需要访问操作系统，则必须使用 Azure 虚拟机。使用此解决方案，你必须手动配置可用性组，就像在本地一样。在以下各节中，我们将在设计可用性组拓扑之前查看一些你应该了解的\
    \ Azure 可用性选项，然后再探讨如何在 Azure 中配置可用性组。\n\n### Azure 可用性概念\n\n云的关键原则是为故障设计应用程序。因此，在云中为\
    \ SQL Server 实现可用性组是一个非常重要的主题。在讨论实现之前，你应该熟悉可用性集、可用性区域和区域的概念。以下各节将概述这些主题。\n\n####\
    \ 可用性集\n\n可用性集是一种构造，它将同一数据中心内的虚拟机放置在不同的故障域和更新域中。故障域表示共享公共电源和网络交换机的硬件。可用性集可以配置为跨越三个故障域。因此，如果你将三个虚拟机放置在同一个可用性集中，你就知道每个虚拟机与其他虚拟机在可用性集中具有唯一的电源和网络交换机。\n\
    \n更新域表示为计划或非计划维护而重新启动的物理硬件。默认情况下，可用性集分为五个更新域，这可以增加到最多 20 个。如果你在同一个可用性集中放置虚拟机，你就知道它们彼此位于不同的硬件上，并且不会同时重新启动。\n\
    \n**提示**\n在使用可用性集时，你还应确保使用托管磁盘。使用托管磁盘时，物理磁盘会跨与附加虚拟机对齐的故障域进行拆分，避免单点故障。\n\n####\
    \ 可用性区域\n\n虽然可用性集可防止数据中心内的硬件问题和停机，但它无法防止数据中心故障。为了防止数据中心故障，你必须将虚拟机放置在单独的可用性区域中。每个可用性区域位于不同的建筑物中，具有独立的电力、网络和冷却系统。\n\
    \n#### 区域\n\n区域提供了一种地理分散服务器的手段，以防止整个区域离线的规模性灾难。Azure 中的区域在地理位置内配对，其中地理位置是政治区域。例如，美国的区域与物理上位于美国的其他区域配对。其他地区，如欧洲和英国也适用。这使你能够在保持数据主权的同时防止灾难。\n\
    \n虽然我知道有些公司认为对于灾难恢复，他们只需要防止数据中心丢失，因此决定避免在多个区域拥有足迹的复杂性和成本开销，但在云术语中，只有当你的灾难恢复服务器位于与生产服务器不同的区域时，你才拥有灾难恢复。\n\
    \n### 在 Azure 中实现可用性组\n\n在本节中，我们将探讨如何在 Azure 虚拟机上配置可用性组。在本节中，我们将在同一区域的两个可用性区域之间为\
    \ Sales 数据库构建一个可用性组，以提供高可用性。我们将在同一虚拟网络中的不同子网上构建每个虚拟机。在此之前，我们将简要讨论可用性集。\n\n####\
    \ 创建可用性集\n"

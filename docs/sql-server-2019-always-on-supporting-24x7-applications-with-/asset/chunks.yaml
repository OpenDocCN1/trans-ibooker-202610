- raw: "The next step is to create the database that we wish to make highly available\
    \ and take a backup of the database that can be used to seed the secondary. This\
    \ can be achieved with the script in Listing [6-2](#394392_3_En_6_Chapter.xhtml#PC2).\
    \ \\--Create Sales Database CREATE DATABASE Sales ; GO USE Sales ; GO CREATE TABLE\
    \ \\[dbo\\].\\[Orders\\](          \\[OrderNumber\\] \\[int\\] IDENTITY(1,1) NOT\
    \ NULL PRIMARY KEY CLUSTERED,          \\[OrderDate\\] \\[date\\]  NOT NULL,          \\\
    [CustomerID\\] \\[int\\]  NOT NULL,          \\[ProductID\\] \\[int\\]   NOT NULL,\
    \          \\[Quantity\\] \\[int\\]    NOT NULL,          \\[NetAmount\\] \\[money\\\
    ] NOT NULL,          \\[TaxAmount\\] \\[money\\] NOT NULL,          \\[InvoiceAddressID\\\
    ] \\[int\\] NOT NULL,          \\[DeliveryAddressID\\] \\[int\\] NOT NULL,          \\\
    [DeliveryDate\\] \\[date\\] NULL, ) ; DECLARE @Numbers TABLE (         Number        INT\
    \ ) \\--Populate ExistingOrders with data  ;WITH CTE(Number) AS (         SELECT\
    \ 1 Number         UNION ALL         SELECT Number + 1         FROM CTE         WHERE\
    \ Number < 100 ) INSERT INTO @Numbers SELECT Number FROM CTE INSERT INTO Orders\
    \       SELECT          (SELECT CAST(DATEADD(dd,(SELECT TOP 1 Number                                   FROM\
    \ @Numbers                                   ORDER BY NEWID()),getdate())as DATE)),\
    \          (SELECT TOP 1 Number -10 FROM @Numbers ORDER BY NEWID()),          (SELECT\
    \ TOP 1 Number FROM @Numbers ORDER BY NEWID()),          (SELECT TOP 1 Number\
    \ FROM @Numbers ORDER BY NEWID()),         500,         100,          (SELECT\
    \ TOP 1 Number FROM @Numbers ORDER BY NEWID()),          (SELECT TOP 1 Number\
    \ FROM @Numbers ORDER BY NEWID()),          (SELECT CAST(DATEADD(dd,(SELECT TOP\
    \ 1 Number - 10       FROM @Numbers           ORDER BY NEWID()),getdate()) as\
    \ DATE)) FROM @Numbers a CROSS JOIN @Numbers b ; \\--SET FULL recovery mode on\
    \ the database - required for Availability Groups ALTER DATABASE Sales SET RECOVERY\
    \ FULL ; GO \\--Backup the Sales Database  BACKUP DATABASE Sales TO  DISK = N'/var/opt/mssql/data/Sales.bak'\
    \ WITH NAME = N'Sales-Full Database Backup' ; GO Listing 6-2 \n\nCreate the Sales\
    \ Database\n\n### Create the Certificates\n\nBecause our Linux servers are not\
    \ part of a domain and cannot authenticate with each other, using AD authentication,\
    \ the next step is to create certificates, which can be used for instance authentication.\
    \ You can create the certificates by connecting to the primary server and running\
    \ the script in Listing [6-3](#394392_3_En_6_Chapter.xhtml#PC3). The script creates\
    \ a certificate in the SQL Server instance and then backs it up to the operating\
    \ system, so that we can copy it to the secondary server. Remember that you can\
    \ connect to a SQL Server instance, running on Linux by using sqlcmd or by connecting\
    \ from SSMS, installed on a Windows-based machine. USE Master GO CREATE MASTER\
    \ KEY ENCRYPTION BY PASSWORD = 'Pa$$w0rd'; GO CREATE CERTIFICATE aoag\\_certificate\
    \ WITH SUBJECT = 'AvailabilityGroups'; GO BACKUP CERTIFICATE aoag\\_certificate\
    \        TO FILE = '/var/opt/mssql/data/aoag\\_certificate.cer'        WITH PRIVATE\
    \ KEY (            FILE = '/var/opt/mssql/data/aoag\\_certificate.pvk',            ENCRYPTION\
    \ BY PASSWORD = 'Pa$$w0rd'        ); GO Listing 6-3 \n\nCreate the Certificate\n\
    \nWe now need to copy the keys to the secondary server. To do this, we first need\
    \ to grant the user permissions to the /var/opt/mssql/ data folder. We can do\
    \ this with the command in Listing [6-4](#394392_3_En_6_Chapter.xhtml#PC4), which\
    \ needs to be run on all servers that will participate in the Availability Group.\
    \ sudo chmod -R 777 /var/opt/mssql Listing 6-4 \n\nGrant Permissions\n\nThe command\
    \ in Listing [6-5](#394392_3_En_6_Chapter.xhtml#PC5), if run on the primary server,\
    \ will use scp, a remote file copy program, to copy the public and private key\
    \ of the certificate to the secondary server. For this command to work, SSH should\
    \ be installed and configured on each server. SSH provides secure access to another\
    \ machine, but a full discussion is beyond the scope of this book. A guide, however,\
    \ can be found at [http://ubuntuhandbook.org/index.php/2014/09/enable-ssh-in-ubuntu-14-10-server-desktop/](http://ubuntuhandbook.org/index.php/2014/09/enable-ssh-in-ubuntu-14-10-server-desktop/).\n\
    \nTip \n\nYou should change the user and server names to match your own configuration.\n\
    \nscp /var/opt/mssql/data/aoag\\_certificate.\\* pete@linuxsyncha:/var/opt/mssql/data\
    \ scp /var/opt/mssql/data/aoag\\_certificate.\\* pete@linuxconfig:/var/opt/mssql/data\
    \ Listing 6-5 \n\nCopy the Keys\n\nTip \n\nIf you don’t have a name server configured,\
    \ you will need to specify an IP Address, rather than a server name.\n\nWe now\
    \ need to create the certificate on the secondary server by importing the certificate\
    \ and key from the file system. This can be achieved using the script in Listing\
    \ [6-6](#394392_3_En_6_Chapter.xhtml#PC6). CREATE MASTER KEY ENCRYPTION BY PASSWORD\
    \ = 'Pa$$w0rd' ; GO CREATE CERTIFICATE aoag\\_certificate     FROM FILE = '/var/opt/mssql/data/aoag\\\
    _certificate.cer'     WITH PRIVATE KEY (             FILE = '/var/opt/mssql/data/aoag\\\
    _certificate.pvk',             DECRYPTION BY PASSWORD = 'Pa$$w0rd'     ) ; GO\
    \ Listing 6-6 \n\nCreate the Certificate on the Secondary Server\n\n## Configuring\
    \ the Availability Group\n\nNow that our certificates are in place, we need to\
    \ create the endpoints, which will be used for connections. The script in Listing\
    \ [6-7](#394392_3_En_6_Chapter.xhtml#PC7) will create an endpoint called AOAG\\\
    _Endpoint, which listens on port 5022 and uses our certificate for authentication.\
    \ This script should be run all instances that will participate in the Availability\
    \ Group. CREATE ENDPOINT AOAG\\_Endpoint STATE = STARTED AS TCP (LISTENER\\_PORT\
    \ = 5022) FOR DATABASE\\_MIRRORING (     ROLE = ALL,     AUTHENTICATION = CERTIFICATE\
    \ aoag\\_certificate,     ENCRYPTION = REQUIRED ALGORITHM AES ); Listing 6-7 \n\
    \nCreate the Endpoints\n\nEverything is now in place for us to create the Availability\
    \ Group. We will perform these actions on the linuxprod server. We could use sqlcmd\
    \ on the server, or connect to the server using SSMS on a management node, to\
    \ allow us to use the GUI. Figure [6-1](#394392_3_En_6_Chapter.xhtml#Fig1) illustrates\
    \ the General page of the New Availability Group dialog box, running on a management\
    \ node. ![Figure 6-1 ¶ New Availability Group Dialog Box – General Page](images/394392_3_En_6_Chapter/394392_3_En_6_Fig1_HTML.jpg)\n\
    \nFigure 6-1 ¶ New Availability Group Dialog Box – General Page\n\nThere are two\
    \ main differences to note in the configuration, compared to the Availability\
    \ Groups that we configured in Chapter [5](#394392_3_En_5_Chapter.xhtml). Firstly,\
    \ the Cluster Type and Failover mode is set to EXTERNAL. This indicates that the\
    \ Availability Group will reside on a cluster that is not a Windows Failover Cluster.\
    \ In this case, specifically, it will reside on a Pacemaker cluster. When building\
    \ an Availability Group on Linux, we can choose to set the cluster type as EXTERNAL\
    \ or NONE. If we select NONE, however, then it would not be suitable for high\
    \ availability.\n\nThe second point of note is that the linuxconfig node is configured\
    \ as configuration only. Because our Availability Group will not be running on\
    \ a Windows Failover Cluster, then failover needs to be arbitrated by the Availability\
    \ Group, instead of the cluster.\n\nIf we had three or more nodes, then a configuration-only\
    \ node would not be required, as the failure of the primary node could still be\
    \ arbitrated by the two (or more) secondaries. Because we only have a two-node\
    \ cluster, however, a third node is required to act as a witness and maintain\
    \ quorum in the event of a node failure."
  fmt: "\nThe next step is to create the database that we wish to make highly available\
    \ and take a backup of the database that can be used to seed the secondary. This\
    \ can be achieved with the script in Listing [6-2](#394392_3_En_6_Chapter.xhtml#PC2).\n\
    \n## Create the Sales Database\n\n```\n--Create Sales Database\nCREATE DATABASE\
    \ Sales;\nGO\nUSE Sales;\nGO\nCREATE TABLE [dbo].[Orders](\n    [OrderNumber]\
    \ [int] IDENTITY(1,1) NOT NULL PRIMARY KEY CLUSTERED,\n    [OrderDate] [date]\
    \ NOT NULL,\n    [CustomerID] [int] NOT NULL,\n    [ProductID] [int] NOT NULL,\n\
    \    [Quantity] [int] NOT NULL,\n    [NetAmount] [money] NOT NULL,\n    [TaxAmount]\
    \ [money] NOT NULL,\n    [InvoiceAddressID] [int] NOT NULL,\n    [DeliveryAddressID]\
    \ [int] NOT NULL,\n    [DeliveryDate] [date] NULL\n);\nDECLARE @Numbers TABLE\
    \ (\n    Number INT\n);\n--Populate ExistingOrders with data\nWITH CTE(Number)\
    \ AS (\n    SELECT 1 Number\n    UNION ALL\n    SELECT Number + 1\n    FROM CTE\n\
    \    WHERE Number < 100\n)\nINSERT INTO @Numbers SELECT Number FROM CTE\nINSERT\
    \ INTO Orders\nSELECT\n    (SELECT CAST(DATEADD(dd,(SELECT TOP 1 Number FROM @Numbers\
    \ ORDER BY NEWID()),getdate()) as DATE)),\n    (SELECT TOP 1 Number -10 FROM @Numbers\
    \ ORDER BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n\
    \    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    500,\n    100,\n\
    \    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    (SELECT TOP 1\
    \ Number FROM @Numbers ORDER BY NEWID()),\n    (SELECT CAST(DATEADD(dd,(SELECT\
    \ TOP 1 Number - 10 FROM @Numbers ORDER BY NEWID()),getdate()) as DATE))\nFROM\
    \ @Numbers a CROSS JOIN @Numbers b;\n--SET FULL recovery mode on the database\
    \ - required for Availability Groups\nALTER DATABASE Sales SET RECOVERY FULL;\n\
    GO\n--Backup the Sales Database\nBACKUP DATABASE Sales TO DISK = N'/var/opt/mssql/data/Sales.bak'\
    \ WITH NAME = N'Sales-Full Database Backup';\nGO\n```\n\nListing 6-2\n\nCreate\
    \ the Sales Database\n\n### Create the Certificates\n\nBecause our Linux servers\
    \ are not part of a domain and cannot authenticate with each other, using AD authentication,\
    \ the next step is to create certificates, which can be used for instance authentication.\
    \ You can create the certificates by connecting to the primary server and running\
    \ the script in Listing [6-3](#394392_3_En_6_Chapter.xhtml#PC3). The script creates\
    \ a certificate in the SQL Server instance and then backs it up to the operating\
    \ system, so that we can copy it to the secondary server. Remember that you can\
    \ connect to a SQL Server instance, running on Linux by using `sqlcmd` or by connecting\
    \ from `SSMS`, installed on a Windows-based machine.\n\n```\nUSE Master\nGO\n\
    CREATE MASTER KEY ENCRYPTION BY PASSWORD = 'Pa$$w0rd';\nGO\nCREATE CERTIFICATE\
    \ aoag_certificate WITH SUBJECT = 'AvailabilityGroups';\nGO\nBACKUP CERTIFICATE\
    \ aoag_certificate\n    TO FILE = '/var/opt/mssql/data/aoag_certificate.cer'\n\
    \    WITH PRIVATE KEY (\n        FILE = '/var/opt/mssql/data/aoag_certificate.pvk',\n\
    \        ENCRYPTION BY PASSWORD = 'Pa$$w0rd'\n    );\nGO\n```\n\nListing 6-3\n\
    \nCreate the Certificate\n\n### Grant Permissions\n\nWe now need to copy the keys\
    \ to the secondary server. To do this, we first need to grant the user permissions\
    \ to the `/var/opt/mssql/data` folder. We can do this with the command in Listing\
    \ [6-4](#394392_3_En_6_Chapter.xhtml#PC4), which needs to be run on all servers\
    \ that will participate in the Availability Group.\n\n```\nsudo chmod -R 777 /var/opt/mssql\n\
    ```\n\nListing 6-4\n\nGrant Permissions\n\n### Copy the Keys\n\nThe command in\
    \ Listing [6-5](#394392_3_En_6_Chapter.xhtml#PC5), if run on the primary server,\
    \ will use `scp`, a remote file copy program, to copy the public and private key\
    \ of the certificate to the secondary server. For this command to work, SSH should\
    \ be installed and configured on each server. SSH provides secure access to another\
    \ machine, but a full discussion is beyond the scope of this book. A guide, however,\
    \ can be found at `http://ubuntuhandbook.org/index.php/2014/09/enable-ssh-in-ubuntu-14-10-server-desktop/`.\n\
    \nTip\n\nYou should change the user and server names to match your own configuration.\n\
    \n```\nscp /var/opt/mssql/data/aoag_certificate.* pete@linuxsyncha:/var/opt/mssql/data\n\
    scp /var/opt/mssql/data/aoag_certificate.* pete@linuxconfig:/var/opt/mssql/data\n\
    ```\n\nListing 6-5\n\nCopy the Keys\n\nTip\n\nIf you don’t have a name server\
    \ configured, you will need to specify an IP Address, rather than a server name.\n\
    \n### Create the Certificate on the Secondary Server\n\nWe now need to create\
    \ the certificate on the secondary server by importing the certificate and key\
    \ from the file system. This can be achieved using the script in Listing [6-6](#394392_3_En_6_Chapter.xhtml#PC6).\n\
    \n```\nCREATE MASTER KEY ENCRYPTION BY PASSWORD = 'Pa$$w0rd';\nGO\nCREATE CERTIFICATE\
    \ aoag_certificate\n    FROM FILE = '/var/opt/mssql/data/aoag_certificate.cer'\n\
    \    WITH PRIVATE KEY (\n        FILE = '/var/opt/mssql/data/aoag_certificate.pvk',\n\
    \        DECRYPTION BY PASSWORD = 'Pa$$w0rd'\n    );\nGO\n```\n\nListing 6-6\n\
    \nCreate the Certificate on the Secondary Server\n\n## Configuring the Availability\
    \ Group\n\nNow that our certificates are in place, we need to create the endpoints,\
    \ which will be used for connections. The script in Listing [6-7](#394392_3_En_6_Chapter.xhtml#PC7)\
    \ will create an endpoint called `AOAG_Endpoint`, which listens on port `5022`\
    \ and uses our certificate for authentication. This script should be run all instances\
    \ that will participate in the Availability Group.\n\n### Create the Endpoints\n\
    \n```\nCREATE ENDPOINT AOAG_Endpoint STATE = STARTED AS TCP (LISTENER_PORT = 5022)\n\
    FOR DATABASE_MIRRORING (\n    ROLE = ALL,\n    AUTHENTICATION = CERTIFICATE aoag_certificate,\n\
    \    ENCRYPTION = REQUIRED ALGORITHM AES\n);\n```\n\nListing 6-7\n\nCreate the\
    \ Endpoints\n\nEverything is now in place for us to create the Availability Group.\
    \ We will perform these actions on the `linuxprod` server. We could use `sqlcmd`\
    \ on the server, or connect to the server using `SSMS` on a management node, to\
    \ allow us to use the GUI. Figure [6-1](#394392_3_En_6_Chapter.xhtml#Fig1) illustrates\
    \ the General page of the New Availability Group dialog box, running on a management\
    \ node.\n\nFigure 6-1 ¶ New Availability Group Dialog Box – General Page\n\nThere\
    \ are two main differences to note in the configuration, compared to the Availability\
    \ Groups that we configured in Chapter [5](#394392_3_En_5_Chapter.xhtml). Firstly,\
    \ the Cluster Type and Failover mode is set to `EXTERNAL`. This indicates that\
    \ the Availability Group will reside on a cluster that is not a Windows Failover\
    \ Cluster. In this case, specifically, it will reside on a Pacemaker cluster.\
    \ When building an Availability Group on Linux, we can choose to set the cluster\
    \ type as `EXTERNAL` or `NONE`. If we select `NONE`, however, then it would not\
    \ be suitable for high availability.\n\nThe second point of note is that the `linuxconfig`\
    \ node is configured as configuration only. Because our Availability Group will\
    \ not be running on a Windows Failover Cluster, then failover needs to be arbitrated\
    \ by the Availability Group, instead of the cluster.\n\nIf we had three or more\
    \ nodes, then a configuration-only node would not be required, as the failure\
    \ of the primary node could still be arbitrated by the two (or more) secondaries.\
    \ Because we only have a two-node cluster, however, a third node is required to\
    \ act as a witness and maintain quorum in the event of a node failure.\n"
  trans: "\n下一步是创建我们希望实现高可用的数据库，并备份该数据库以用于初始化辅助副本。这可以通过清单 6-2 中的脚本实现。\n\n## 创建 Sales\
    \ 数据库\n\n```\n--Create Sales Database\nCREATE DATABASE Sales;\nGO\nUSE Sales;\n\
    GO\nCREATE TABLE [dbo].Orders NOT NULL PRIMARY KEY CLUSTERED,\n    [OrderDate]\
    \ [date] NOT NULL,\n    [CustomerID] [int] NOT NULL,\n    [ProductID] [int] NOT\
    \ NULL,\n    [Quantity] [int] NOT NULL,\n    [NetAmount] [money] NOT NULL,\n \
    \   [TaxAmount] [money] NOT NULL,\n    [InvoiceAddressID] [int] NOT NULL,\n  \
    \  [DeliveryAddressID] [int] NOT NULL,\n    [DeliveryDate] [date] NULL\n);\nDECLARE\
    \ @Numbers TABLE (\n    Number INT\n);\n--Populate ExistingOrders with data\n\
    WITH CTE(Number) AS (\n    SELECT 1 Number\n    UNION ALL\n    SELECT Number +\
    \ 1\n    FROM CTE\n    WHERE Number < 100\n)\nINSERT INTO @Numbers SELECT Number\
    \ FROM CTE\nINSERT INTO Orders\nSELECT\n    (SELECT CAST(DATEADD(dd,(SELECT TOP\
    \ 1 Number FROM @Numbers ORDER BY NEWID()),getdate()) as DATE)),\n    (SELECT\
    \ TOP 1 Number -10 FROM @Numbers ORDER BY NEWID()),\n    (SELECT TOP 1 Number\
    \ FROM @Numbers ORDER BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers ORDER\
    \ BY NEWID()),\n    500,\n    100,\n    (SELECT TOP 1 Number FROM @Numbers ORDER\
    \ BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n  \
    \  (SELECT CAST(DATEADD(dd,(SELECT TOP 1 Number - 10 FROM @Numbers ORDER BY NEWID()),getdate())\
    \ as DATE))\nFROM @Numbers a CROSS JOIN @Numbers b;\n--SET FULL recovery mode\
    \ on the database - required for Availability Groups\nALTER DATABASE Sales SET\
    \ RECOVERY FULL;\nGO\n--Backup the Sales Database\nBACKUP DATABASE Sales TO DISK\
    \ = N'/var/opt/mssql/data/Sales.bak' WITH NAME = N'Sales-Full Database Backup';\n\
    GO\n```\n\n清单 6-2\n\n创建 Sales 数据库\n\n### 创建证书\n\n由于我们的 Linux 服务器不属于域，无法使用 AD 身份验证相互认证，下一步是创建证书，可用于实例身份验证。你可以通过连接到主服务器并运行清单\
    \ 6-3 中的脚本来创建证书。该脚本在 SQL Server 实例中创建证书，然后将其备份到操作系统，以便我们可以将其复制到辅助服务器。请记住，你可以通过使用\
    \ `sqlcmd` 连接到在 Linux 上运行的 SQL Server 实例，或从安装在基于 Windows 的机器上的 `SSMS` 连接。\n\n\
    ```\nUSE Master\nGO\nCREATE MASTER KEY ENCRYPTION BY PASSWORD = 'Pa$$w0rd';\n\
    GO\nCREATE CERTIFICATE aoag_certificate WITH SUBJECT = 'AvailabilityGroups';\n\
    GO\nBACKUP CERTIFICATE aoag_certificate\n    TO FILE = '/var/opt/mssql/data/aoag_certificate.cer'\n\
    \    WITH PRIVATE KEY (\n        FILE = '/var/opt/mssql/data/aoag_certificate.pvk',\n\
    \        ENCRYPTION BY PASSWORD = 'Pa$$w0rd'\n    );\nGO\n```\n\n清单 6-3\n\n创建证书\n\
    \n### 授予权限\n\n我们现在需要将密钥复制到辅助服务器。为此，首先需要授予用户对 `/var/opt/mssql/data` 文件夹的权限。我们可以使用清单\
    \ 6-4 中的命令来实现，该命令需要在将参与可用性组的服务器上运行。\n\n```\nsudo chmod -R 777 /var/opt/mssql\n\
    ```\n\n清单 6-4\n\n授予权限\n\n### 复制密钥\n\n如果在主服务器上运行清单 6-5 中的命令，将使用 `scp`，一种远程文件复制程序，将证书的公钥和私钥复制到辅助服务器。要使此命令正常工作，每个服务器上都应安装并配置\
    \ SSH。SSH 可提供对另一台机器的安全访问，但完整的讨论超出了本书的范围。不过，可以在 `http://ubuntuhandbook.org/index.php/2014/09/enable-ssh-in-ubuntu-14-10-server-desktop/`\
    \ 找到指南。\n\n提示\n\n你应更改用户名和服务器名称以匹配自己的配置。\n\n```\nscp /var/opt/mssql/data/aoag_certificate.*\
    \ pete@linuxsyncha:/var/opt/mssql/data\nscp /var/opt/mssql/data/aoag_certificate.*\
    \ pete@linuxconfig:/var/opt/mssql/data\n```\n\n清单 6-5\n\n复制密钥\n\n提示\n\n如果未配置名称服务器，则需要指定\
    \ IP 地址，而不是服务器名称。\n\n### 在辅助服务器上创建证书\n\n我们现在需要通过从文件系统导入证书和密钥在辅助服务器上创建证书。这可以使用清单\
    \ 6-6 中的脚本实现。\n\n```\nCREATE MASTER KEY ENCRYPTION BY PASSWORD = 'Pa$$w0rd';\n\
    GO\nCREATE CERTIFICATE aoag_certificate\n    FROM FILE = '/var/opt/mssql/data/aoag_certificate.cer'\n\
    \    WITH PRIVATE KEY (\n        FILE = '/var/opt/mssql/data/aoag_certificate.pvk',\n\
    \        DECRYPTION BY PASSWORD = 'Pa$$w0rd'\n    );\nGO\n```\n\n清单 6-6\n\n在辅助服务器上创建证书\n\
    \n## 配置可用性组\n\n现在证书已就位，我们需要创建将用于连接的端点。清单 6-7 中的脚本将创建一个名为 `AOAG_Endpoint` 的端点，该端点侦听端口\
    \ `5022` 并使用我们的证书进行身份验证。此脚本应在将参与可用性组的所有实例上运行。\n\n### 创建端点\n\n```\nCREATE ENDPOINT\
    \ AOAG_Endpoint STATE = STARTED AS TCP (LISTENER_PORT = 5022)\nFOR DATABASE_MIRRORING\
    \ (\n    ROLE = ALL,\n    AUTHENTICATION = CERTIFICATE aoag_certificate,\n   \
    \ ENCRYPTION = REQUIRED ALGORITHM AES\n);\n```\n\n清单 6-7\n\n创建端点\n\n现在我们已准备好创建可用性组。我们将在\
    \ `linuxprod` 服务器上执行这些操作。我们可以在服务器上使用 `sqlcmd`，或在管理节点上使用 `SSMS` 连接到服务器，以便使用 GUI。图\
    \ 6-1 说明了在管理节点上运行的新可用性组对话框的“常规”页。\n\n图 6-1 ¶ 新可用性组对话框 – 通用页\n\n与我们在第 5 章中配置的可用性组相比，配置中有两个主要区别需要注意。首先，群集类型和故障转移模式设置为\
    \ `EXTERNAL`。这表明可用性组将驻留在非 Windows 故障转移群集的群集上。具体来说，它将驻留在 Pacemaker 群集上。在 Linux\
    \ 上构建可用性组时，我们可以选择将群集类型设置为 `EXTERNAL` 或 `NONE`。但是，如果选择 `NONE`，则不适合高可用性。\n\n第二个需要注意的点是\
    \ `linuxconfig` 节点配置为仅配置。由于我们的可用性组不会在 Windows 故障转移群集上运行，因此故障转移需要由可用性组仲裁，而不是由群集仲裁。\n\
    \n如果我们有三个或更多节点，则不需要仅配置节点，因为主节点的故障仍可由两个（或更多）辅助节点仲裁。然而，由于我们只有两个节点的群集，因此需要第三个节点充当见证，并在节点故障时维护法定人数。\n"

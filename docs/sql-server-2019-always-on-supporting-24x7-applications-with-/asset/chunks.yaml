    ## N+M 配置

    与 N+1 配置具有多个活动节点和单个被动节点不同，N+M 集群具有多个活动节点和多个被动节点，尽管通常被动节点的数量少于活动节点。图 2-4 显示了一个五节点
    N+M 配置。该图显示 `Instance3` 配置为始终故障转移到其中一个被动节点，而 `Instance1` 和 `Instance2` 配置为始终故障转移到另一个被动节点。这使您能够灵活控制被动节点上的资源，但您也可以配置集群以允许任何活动节点故障转移到任一被动节点，如果这是更适合您环境的方案。

    ![图 2-4 ¶ 五节点 N+M 配置](img/394392_3_En_2_Fig4_HTML.jpg)


    图 2-4 ¶ 五节点 N+M 配置


    ## 仲裁

    为了使自动故障转移能够发生，集群服务需要知道节点是否宕机。为此，您必须形成仲裁。仲裁的定义是“开展业务所需的最低成员数。”在高可用性方面，这意味着集群中的每个节点，以及可选的见证设备（可能是集群磁盘、集群外部的文件共享或
    Azure BLOB 存储），都会获得一票。如果超过一半的投票成员无法与某个节点通信，则集群服务知道该节点已宕机，并且服务器上任何集群感知应用程序都会故障转移到另一个节点。超过一半的投票成员需要无法与节点通信的原因是为了避免一种被称为
    `split brain` 的情况。


    为了说明脑裂场景，假设您在数据中心 1 中有三个节点，在数据中心 2 中有三个节点。现在假设您在两个数据中心之间丢失了网络连接，但所有六个节点仍然在线。数据中心
    1 中的三个节点认为数据中心 2 中的所有节点都不可用。相反，数据中心 2 中的节点认为数据中心 1 的节点不可用。这导致集群的两侧（称为分区）都认为自己应该接管控制权。这可能对成功连接到任一分区的任何应用程序产生不可预测且不期望的后果。`Quorum
    = (Voting Members / 2) + 1` 公式可防止此场景发生。


    **提示**

    如果您的集群失去仲裁，则可以通过使用 `/fq` 开关启动集群服务来强制一个分区上线。如果您使用的是 Windows Server 2012 R2 或更高版本，则您强制上线的分区被视为
    `authoritative partition`。这意味着当连接重新建立时，其他分区可以自动重新加入集群。


    各种仲裁模型可用，最合适的模型取决于您的环境。表 2-1 列出了您可以使用的模型，并详细说明了最合适的用法。表 2-1


    仲裁模型


    | 仲裁模型 | 适用用法 |

    |---|---|

    | `Node Majority` | 当集群中的节点数为奇数时 |

    | `Node + Disk Witness Majority` | 当集群中的节点数为偶数时 |

    | `Node + File Share Witness Majority` | 当节点分布在多个站点或节点数为偶数且需要避免共享磁盘*时 |


    *由于虚拟化需要避免共享磁盘的原因将在本章后面讨论。


    尽管默认选项是一个节点一票，但可以通过将 `NodeWeight` 属性更改为零来手动移除节点的投票权。如果您拥有 `multi-subnet cluster`（节点分布在多个站点的集群），则此方法很有用。在这种情况下，建议您在第三个站点使用文件共享见证。这有助于您避免因数据中心之间网络故障而导致的集群中断。但是，如果仲裁中的节点数为奇数，则添加文件共享见证会使投票数变为偶数，这很危险。从二级数据中心的一个节点中移除投票权可以消除此问题。从
    Windows Server 2019 开始，文件共享见证可以是支持 `SMB`（Server Message Block）2.0 或更高版本的文件共享。这包括连接到网络路由器的
    USB 密钥、NAS（网络附加存储设备）以及加入工作组的运行 Windows 的计算机。


    **警告**

    文件共享见证不会存储仲裁数据库的完整副本。这意味着使用文件共享见证的两节点集群容易受到一种被称为 `partition in time` 的场景的影响。在此场景中，如果在您对第二个节点上的集群服务进行修补或更改的过程中一个节点发生故障，则没有仲裁数据库的最新副本。这使您处于需要销毁并重建集群的境地。


    Windows Server 的现代版本还支持 `Dynamic Quorum` 和 `Tie Breaker for 50% Node Split` 概念。当启用
    `Dynamic Quorum` 时，集群服务会根据集群中的节点数量自动决定是否给予仲裁见证投票权。如果节点数为偶数，则会分配投票权。如果节点数为奇数，则不会分配投票权。`Tie
    Breaker for 50% Node Split` 在此概念上进行了扩展。如果您有偶数个节点和一个见证，并且见证发生故障，则集群服务会自动从集群中的一个随机节点移除投票权。这保持了仲裁中投票数为奇数，并降低了因见证故障导致集群离线的风险。


    **提示**

    如果您的集群在 Windows Server 2016 或更高版本、Datacenter Edition 上运行，则支持 `Storage Spaces Direct`。这允许使用本地附加的物理存储，并在其上使用软件定义存储层来实现高可用性。关于
    `Storage Spaces Direct` 的完整讨论超出了本书范围，但更多详细信息可在 [docs.microsoft.com/en-us/windows-server/storage/storage-spaces/storage-spaces-direct-overview](http://docs.microsoft.com/en-us/windows-server/storage/storage-spaces/storage-spaces-direct-overview)
    找到。


    ## AlwaysOn 可用性组

    `AlwaysOn Availability Groups` (`AOAG`) 取代了数据库镜像，本质上是数据库镜像和集群技术的合并。SQL Server
    作为独立实例（而不是 AlwaysOn 故障转移群集实例）在集群的每个节点上安装。然后在集群上安装一个集群感知的应用程序，称为 `Availability
    Group Listener`；它用于将流量定向到正确的节点。然而，与其依赖共享磁盘，`AOAG` 会压缩日志流并将其发送到其他节点，方式类似于数据库镜像。


    `AOAG` 是在具有小型数据库和低写入负载的场景中实现高可用性的最合适技术。这是因为在使用同步模式时，它要求数据在主数据库上提交之前必须先在所有同步副本上提交。您可以拥有多达八个副本，其中包括三个同步副本。`AOAG`
    也可能是实现虚拟化环境高可用的最合适技术。这是因为集群所需的共享磁盘可能与虚拟环境的一些功能不兼容。例如，当 `VMs` 使用通过光纤通道提供的共享磁盘时，VMware
    不支持使用 `vMotion`（用于在物理服务器之间手动移动虚拟机（`VMs`））和 `Distributed Resource Scheduler`（`DRS`）（用于根据资源利用率在物理服务器之间自动移动
    `VMs`）。


    **提示**

    '

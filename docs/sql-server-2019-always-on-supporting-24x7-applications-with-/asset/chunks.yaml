- raw: "| availability\\_replica\\_manager\\_state\\_change || Fires when the state\
    \ of the Availability Replica Manager has changed |\n\n| availability\\_group\\\
    _lease\\_expired || Fires when there is a connectivity issue between the cluster\
    \ and the Availability Group, which has caused a failure to renew the lease |\n\
    \n| availability\\_replica\\_automatic\\_failover\\_validation || Fires when the\
    \ failover validates the readiness of replica as a primary |\n\n| availability\\\
    _replica\\_database\\_fault\\_reporting || Fires when a database reports a fault\
    \ to the availability replica manager |\n\n| before\\_redo\\_lsn\\_update || Fires\
    \ immediately before the update of the EOL Log Sequence Number |\n\n| read\\_only\\\
    _route\\_complete || Fires when a read-only routing operation successfully completed\
    \ |\n\n| read\\_only\\_route\\_fail || Fires when a read-only routing operation\
    \ failed |\n\n#### Targets\n\nA target is the consumer of the events; essentially,\
    \ it is the device to which the trace data will be written. The targets available\
    \ within SQL Server 2016 are detailed in Table [9-3](#394392_3_En_9_Chapter.xhtml#Tab3).\
    \ Table 9-3 \n\nTargets \n\n| Target || Synchronous/Asynchronous || Description\
    \ |\n\n| --- | --- | --- |\n\n| Event counter || Synchronous || Counts the number\
    \ of events that occur during a session |\n\n| --- | --- | --- |\n\n| Event file\
    \ || Asynchronous || Writes the event output to memory buffers and then flushes\
    \ them to disk |\n\n| Event pairing || Asynchronous || Determines if a paired\
    \ event occurs without its matching event, for example, if a statement started\
    \ but never completed |\n\n| ETW (Event Tracking for Windows) || Synchronous ||\
    \ Used to correlate Extended Events with operating system data |\n\n| Histogram\
    \ || Asynchronous || Counts the number of events that occur during a session,\
    \ based on an action or event column |\n\n| Ring buffer  || Asynchronous || Stores\
    \ data in a memory buffer, using first-in, first-out (FIFO) methodology |\n\n\
    #### Actions\n\nAlso known as Global Fields, Actions are commands that allow additional\
    \ information to be captured when an event fires. An action is fired synchronously\
    \ when an event occurs and the event is unaware of the action. There are 50 actions\
    \ available that allow you to capture a rich array of information, including the\
    \ statement that caused the event to fire, the security context under which the\
    \ statement ran, the transaction ID, the CPU ID, and the call stack.\n\n#### Predicates\n\
    \nPredicates  are filter conditions that you can apply before the system sends\
    \ events to the target. It is possible to create simple predicates, such as filtering\
    \ statements completing based on a database ID, but you can also create more complex\
    \ predicates, such as only capturing the role change of an AlwaysOn Availability\
    \ Group replica if it happens more than twice.\n\nPredicates also fully support\
    \ short-circuiting. This means that if you use multiple conditions within a predicate,\
    \ then the order of predicates is important, because if the evaluation of the\
    \ first predicate fails, the second predicate will not be evaluated. Because predicates\
    \ are evaluated synchronously, this can have an impact on performance. Therefore,\
    \ it is sensible to design your predicates, so that predicates which are least\
    \ likely to evaluate to true are placed before predicates that are very likely\
    \ to evaluate to true.\n\nFor example, imagine that you are planning to filter\
    \ on a specific database (with a database ID of 6), but this database accounts\
    \ for a high percentage of the activity on the instance. You also plan to filter\
    \ on a specific user ID (UserA), which is responsible for a low percentage of\
    \ the activity. In this scenario, you would use the WHERE ((\\[sqlserver\\].\\\
    [username\\]='UserA') AND (\\[sqlserver\\].\\[database\\_id\\]=(6))) predicate\
    \ to first filter out activity that does not relate to UserA, before then filtering\
    \ out activity that does not relate to database ID 6.\n\n#### Types\n\nAll objects\
    \ within a package are assigned a type. This type is used to interpret the data\
    \ stored within the byte collection of an object. Objects are assigned one of\
    \ the following types: \n\n*   Action\n\n*   Event\n\n*   Pred\\_compare (retrieve\
    \ data from events)\n\n*   Pred\\_source (compare data types)\n\n*   Target\n\n\
    *   Type\n\n#### Maps\n\nA map is a dictionary that maps internal ID vales to\
    \ strings that DBAs can understand. Map keys are only unique within their context\
    \ and are repeated between contexts. For example, within the statement\\_recompile\\\
    _cause context, a map\\_key of 1 relates to a map\\_value of Schema Changed. Within\
    \ the context of a database\\_sql\\_statement type, however, a map\\_key of 1\
    \ relates to a map\\_value of CREATE DATABASE. You can find a complete list of\
    \ mappings by using the sys.dm\\_xe\\_map\\_values DMV.\n\n#### Sessions\n\nA\
    \ session  is essentially a trace. It can contain events from multiple packages,\
    \ actions, targets, and predicates. When you start or stop a session, you are\
    \ turning the trace on or off. When a session starts, events are written to memory\
    \ buffers and have predicates applied before they are sent to the target. Therefore,\
    \ when creating a session, you need to configure properties, such as how much\
    \ memory the session can use for buffering, what events can be dropped if the\
    \ session experiences memory pressure, and the maximum latency before the events\
    \ are sent to the target.\n\n### Creating an Event Session to Monitor Availability\
    \ Group\n\nYou can create an event session using either the New Session Wizard,\
    \ the New Session Dialog Box, or via T-SQL. To create a session using the New\
    \ Session Wizard, drill through Management ➤ Extended Events in Object Explorer,\
    \ and select New Session Wizard from the context menu of Sessions. This will cause\
    \ the Introduction page of the New Session Wizard to be displayed.\n\nAfter passing\
    \ through the Introduction page, you will find the Set Session Properties page,\
    \ as displayed in Figure [9-5](#394392_3_En_9_Chapter.xhtml#Fig5). Here, you can\
    \ configure a name for the Session and also specify if the Session should automatically\
    \ be started on creation. ![Figure 9-5 ¶ Set Properties Page](images/394392_3_En_9_Chapter/394392_3_En_9_Fig5_HTML.jpg)\n\
    \nFigure 9-5 ¶ Set Properties Page\n\nOn the Choose Template page of the wizard,\
    \ which is illustrated in Figure [9-6](#394392_3_En_9_Chapter.xhtml#Fig6), you\
    \ can either select a predefined template, which will give you a starting point\
    \ for commonly required sessions, or you can start with a blank canvas and define\
    \ the entire session manually. We will choose the latter option. ![Figure 9-6\
    \ ¶ Choose Template Page](images/394392_3_En_9_Chapter/394392_3_En_9_Fig6_HTML.jpg)\n\
    \nFigure 9-6 ¶ Choose Template Page\n\nFigure [9-7](#394392_3_En_9_Chapter.xhtml#Fig7)\
    \ shows the Select Events To Capture page. Here, we can choose what events we\
    \ want to include in our session. For the purposes of this demonstration, imagine\
    \ that we are frequently seeing the secondary fall behind the primary, and we\
    \ are trying to determine the cause. Specifically, do we have an IO bottleneck?\
    \ Because we are trying to answer a very narrow question, the choice of events\
    \ to select is clear. We will need the hadr\\_db\\_marked\\_for\\_reseed event\
    \ to determine when the secondary falls behind, and we will need the long\\_io\\\
    _detected event, so that we can correlate the times, and see if there is a pattern.\
    \ ![Figure 9-7 ¶ Select Events To Capture Page](images/394392_3_En_9_Chapter/394392_3_En_9_Fig7_HTML.jpg)\n\
    \nFigure 9-7 ¶ Select Events To Capture Page\n\nThe Capture Global Fields page\
    \ will allow us to specify any Actions that we wish to capture. In our scenario,\
    \ we will capture the NT Username and SQLText actions. This will allow us to trace\
    \ any long IOs back through, to see if they are caused by an inefficient query.\
    \ The Capture Global Fields page is illustrated in Figure [9-8](#394392_3_En_9_Chapter.xhtml#Fig8).\
    \ ![Figure 9-8 ¶ Capture Global Fields Page](images/394392_3_En_9_Chapter/394392_3_En_9_Fig8_HTML.jpg)\n\
    \nFigure 9-8 ¶ Capture Global Fields Page"
  fmt: "\n## Events\n\n| `availability_replica_manager_state_change` || Fires when\
    \ the state of the Availability Replica Manager has changed |\n| `availability_group_lease_expired`\
    \ || Fires when there is a connectivity issue between the cluster and the Availability\
    \ Group, which has caused a failure to renew the lease |\n| `availability_replica_automatic_failover_validation`\
    \ || Fires when the failover validates the readiness of replica as a primary |\n\
    | `availability_replica_database_fault_reporting` || Fires when a database reports\
    \ a fault to the availability replica manager |\n| `before_redo_lsn_update` ||\
    \ Fires immediately before the update of the EOL Log Sequence Number |\n| `read_only_route_complete`\
    \ || Fires when a read-only routing operation successfully completed |\n| `read_only_route_fail`\
    \ || Fires when a read-only routing operation failed |\n\n### Targets\n\nA target\
    \ is the consumer of the events; essentially, it is the device to which the trace\
    \ data will be written. The targets available within SQL Server 2016 are detailed\
    \ in Table [9-3](#394392_3_En_9_Chapter.xhtml#Tab3). Table 9-3 \nTargets \n| Target\
    \ || Synchronous/Asynchronous || Description |\n| --- | --- | --- |\n| `Event\
    \ counter` || Synchronous || Counts the number of events that occur during a session\
    \ |\n| --- | --- | --- |\n| `Event file` || Asynchronous || Writes the event output\
    \ to memory buffers and then flushes them to disk |\n| `Event pairing` || Asynchronous\
    \ || Determines if a paired event occurs without its matching event, for example,\
    \ if a statement started but never completed |\n| `ETW` (Event Tracking for Windows)\
    \ || Synchronous || Used to correlate Extended Events with operating system data\
    \ |\n| `Histogram` || Asynchronous || Counts the number of events that occur during\
    \ a session, based on an action or event column |\n| `Ring buffer`  || Asynchronous\
    \ || Stores data in a memory buffer, using first-in, first-out (FIFO) methodology\
    \ |\n\n### Actions\n\nAlso known as Global Fields, Actions are commands that allow\
    \ additional information to be captured when an event fires. An action is fired\
    \ synchronously when an event occurs and the event is unaware of the action. There\
    \ are 50 actions available that allow you to capture a rich array of information,\
    \ including the statement that caused the event to fire, the security context\
    \ under which the statement ran, the transaction ID, the CPU ID, and the call\
    \ stack.\n\n### Predicates\n\nPredicates are filter conditions that you can apply\
    \ before the system sends events to the target. It is possible to create simple\
    \ predicates, such as filtering statements completing based on a database ID,\
    \ but you can also create more complex predicates, such as only capturing the\
    \ role change of an AlwaysOn Availability Group replica if it happens more than\
    \ twice.\nPredicates also fully support short-circuiting. This means that if you\
    \ use multiple conditions within a predicate, then the order of predicates is\
    \ important, because if the evaluation of the first predicate fails, the second\
    \ predicate will not be evaluated. Because predicates are evaluated synchronously,\
    \ this can have an impact on performance. Therefore, it is sensible to design\
    \ your predicates, so that predicates which are least likely to evaluate to true\
    \ are placed before predicates that are very likely to evaluate to true.\nFor\
    \ example, imagine that you are planning to filter on a specific database (with\
    \ a database ID of 6), but this database accounts for a high percentage of the\
    \ activity on the instance. You also plan to filter on a specific user ID (UserA),\
    \ which is responsible for a low percentage of the activity. In this scenario,\
    \ you would use the `WHERE (([sqlserver].[username]='UserA') AND ([sqlserver].[database_id]=(6)))`\
    \ predicate to first filter out activity that does not relate to UserA, before\
    \ then filtering out activity that does not relate to database ID 6.\n\n### Types\n\
    \nAll objects within a package are assigned a type. This type is used to interpret\
    \ the data stored within the byte collection of an object. Objects are assigned\
    \ one of the following types: \n* `Action`\n* `Event`\n* `Pred_compare` (retrieve\
    \ data from events)\n* `Pred_source` (compare data types)\n* `Target`\n* `Type`\n\
    \n### Maps\n\nA map is a dictionary that maps internal ID vales to strings that\
    \ DBAs can understand. `Map` keys are only unique within their context and are\
    \ repeated between contexts. For example, within the `statement_recompile_cause`\
    \ context, a `map_key` of 1 relates to a `map_value` of `Schema Changed`. Within\
    \ the context of a `database_sql_statement` type, however, a `map_key` of 1 relates\
    \ to a `map_value` of `CREATE DATABASE`. You can find a complete list of mappings\
    \ by using the `sys.dm_xe_map_values` DMV.\n\n### Sessions\n\nA session is essentially\
    \ a trace. It can contain events from multiple packages, actions, targets, and\
    \ predicates. When you start or stop a session, you are turning the trace on or\
    \ off. When a session starts, events are written to memory buffers and have predicates\
    \ applied before they are sent to the target. Therefore, when creating a session,\
    \ you need to configure properties, such as how much memory the session can use\
    \ for buffering, what events can be dropped if the session experiences memory\
    \ pressure, and the maximum latency before the events are sent to the target.\n\
    \n## Creating an Event Session to Monitor Availability Group\n\nYou can create\
    \ an event session using either the `New Session Wizard`, the `New Session Dialog\
    \ Box`, or via `T-SQL`. To create a session using the `New Session Wizard`, drill\
    \ through `Management ➤ Extended Events` in `Object Explorer`, and select `New\
    \ Session Wizard` from the context menu of `Sessions`. This will cause the Introduction\
    \ page of the `New Session Wizard` to be displayed.\nAfter passing through the\
    \ Introduction page, you will find the Set Session Properties page, as displayed\
    \ in Figure [9-5](#394392_3_En_9_Chapter.xhtml#Fig5). Here, you can configure\
    \ a name for the Session and also specify if the Session should automatically\
    \ be started on creation. ![Figure 9-5 ¶ Set Properties Page](images/394392_3_En_9_Chapter/394392_3_En_9_Fig5_HTML.jpg)\n\
    Figure 9-5 ¶ Set Properties Page\nOn the Choose Template page of the wizard, which\
    \ is illustrated in Figure [9-6](#394392_3_En_9_Chapter.xhtml#Fig6), you can either\
    \ select a predefined template, which will give you a starting point for commonly\
    \ required sessions, or you can start with a blank canvas and define the entire\
    \ session manually. We will choose the latter option. ![Figure 9-6 ¶ Choose Template\
    \ Page](images/394392_3_En_9_Chapter/394392_3_En_9_Fig6_HTML.jpg)\nFigure 9-6\
    \ ¶ Choose Template Page\nFigure [9-7](#394392_3_En_9_Chapter.xhtml#Fig7) shows\
    \ the Select Events To Capture page. Here, we can choose what events we want to\
    \ include in our session. For the purposes of this demonstration, imagine that\
    \ we are frequently seeing the secondary fall behind the primary, and we are trying\
    \ to determine the cause. Specifically, do we have an IO bottleneck? Because we\
    \ are trying to answer a very narrow question, the choice of events to select\
    \ is clear. We will need the `hadr_db_marked_for_reseed` event to determine when\
    \ the secondary falls behind, and we will need the `long_io_detected` event, so\
    \ that we can correlate the times, and see if there is a pattern. ![Figure 9-7\
    \ ¶ Select Events To Capture Page](images/394392_3_En_9_Chapter/394392_3_En_9_Fig7_HTML.jpg)\n\
    Figure 9-7 ¶ Select Events To Capture Page\nThe Capture Global Fields page will\
    \ allow us to specify any Actions that we wish to capture. In our scenario, we\
    \ will capture the `NT Username` and `SQLText` actions. This will allow us to\
    \ trace any long IOs back through, to see if they are caused by an inefficient\
    \ query. The Capture Global Fields page is illustrated in Figure [9-8](#394392_3_En_9_Chapter.xhtml#Fig8).\
    \ ![Figure 9-8 ¶ Capture Global Fields Page](images/394392_3_En_9_Chapter/394392_3_En_9_Fig8_HTML.jpg)\n\
    Figure 9-8 ¶ Capture Global Fields Page\n"
  trans: "\n## 事件\n\n| `availability_replica_manager_state_change` || 当可用性副本管理器的状态发生变化时触发\
    \ |\n| `availability_group_lease_expired` || 当集群与可用性组之间存在连接问题，导致续租失败时触发 |\n| `availability_replica_automatic_failover_validation`\
    \ || 当故障转移验证副本作为主副本的就绪状态时触发 |\n| `availability_replica_database_fault_reporting`\
    \ || 当数据库向可用性副本管理器报告故障时触发 |\n| `before_redo_lsn_update` || 在 EOL 日志序列号更新之前立即触发\
    \ |\n| `read_only_route_complete` || 当只读路由操作成功完成时触发 |\n| `read_only_route_fail`\
    \ || 当只读路由操作失败时触发 |\n\n### 目标\n\n一个目标是事件的消费者；本质上，它是跟踪数据将被写入的设备。SQL Server 2016\
    \ 中可用的目标在表 9-3 中详细说明。表 9-3 \n目标 \n| 目标 || 同步/异步 || 描述 |\n| --- | --- | --- |\n\
    | `Event counter` || 同步 || 统计会话期间发生的事件数量 |\n| --- | --- | --- |\n| `Event file`\
    \ || 异步 || 将事件输出写入内存缓冲区，然后刷新到磁盘 |\n| `Event pairing` || 异步 || 确定配对事件是否在其匹配事件缺失的情况下发生，例如语句已开始但从未完成\
    \ |\n| `ETW` (Event Tracking for Windows) || 同步 || 用于将扩展事件与操作系统数据关联 |\n| `Histogram`\
    \ || 异步 || 根据操作或事件列统计会话期间发生的事件数量 |\n| `Ring buffer`  || 异步 || 使用先进先出（FIFO）方法将数据存储在内存缓冲区中\
    \ |\n\n### 操作\n\n也称为全局字段，操作是允许在事件触发时捕获额外信息的命令。当事件发生时，操作会同步触发，而事件本身并不感知该操作。有 50\
    \ 个操作可用，可让您捕获丰富的各类信息，包括导致事件触发的语句、语句运行的安全上下文、事务 ID、CPU ID 和调用堆栈。\n\n### 谓词\n\n\
    谓词是在系统将事件发送到目标之前可以应用的筛选条件。可以创建简单的谓词，例如基于数据库 ID 筛选完成的语句，但也可以创建更复杂的谓词，例如仅在发生超过两次时才捕获\
    \ AlwaysOn 可用性组副本的角色更改。\n谓词也完全支持短路求值。这意味着如果在谓词中使用多个条件，则谓词的顺序很重要，因为如果第一个谓词的求值失败，则不会求值第二个谓词。由于谓词是同步求值的，这可能会影响性能。因此，合理的做法是设计谓词，使最不可能求值为真的谓词放在最可能求值为真的谓词之前。\n\
    例如，假设您计划筛选特定数据库（数据库 ID 为 6），但该数据库占实例活动的很大比例。您还计划筛选特定用户 ID（UserA），该用户负责的活动比例很低。在此场景中，您将使用\
    \ `WHERE (([sqlserver].[username]='UserA') AND ([sqlserver].[database_id]=(6)))`\
    \ 谓词先筛选出与 UserA 无关的活动，然后再筛选出与数据库 ID 6 无关的活动。\n\n### 类型\n\n包内的所有对象都被分配一个类型。此类型用于解释对象字节集合中存储的数据。对象被分配以下类型之一：\
    \ \n* `Action`\n* `Event`\n* `Pred_compare` (从事件中检索数据)\n* `Pred_source` (比较数据类型)\n\
    * `Target`\n* `Type`\n\n### 映射\n\n一个映射是将内部 ID 值映射到 DBA 可以理解的字符串的字典。`Map` 键仅在其上下文中唯一，并在上下文之间重复。例如，在\
    \ `statement_recompile_cause` 上下文中，`map_key` 为 1 对应 `map_value` 为 `Schema Changed`。然而，在\
    \ `database_sql_statement` 类型的上下文中，`map_key` 为 1 对应 `map_value` 为 `CREATE DATABASE`。您可以使用\
    \ `sys.dm_xe_map_values` DMV 找到完整的映射列表。\n\n### 会话\n\n会话本质上是一个跟踪。它可以包含来自多个包的事件、操作、目标和谓词。当您启动或停止会话时，您是在打开或关闭跟踪。当会话启动时，事件会写入内存缓冲区，并在发送到目标之前应用谓词。因此，在创建会话时，您需要配置属性，例如会话可用于缓冲的内存量、如果会话遇到内存压力时可以丢弃哪些事件，以及在事件发送到目标之前的最大延迟。\n\
    \n## 创建事件会话以监视可用性组\n\n您可以使用 `New Session Wizard`、`New Session Dialog Box` 或通过\
    \ `T-SQL` 创建事件会话。要使用 `New Session Wizard` 创建会话，请在 `Object Explorer` 中钻取 `Management\
    \ ➤ Extended Events`，并从 `Sessions` 的上下文菜单中选择 `New Session Wizard`。这将显示 `New Session\
    \ Wizard` 的介绍页。\n通过介绍页后，您将找到设置会话属性页，如图 9-5 所示。在这里，您可以为会话配置名称，并指定会话是否应在创建时自动启动。![图\
    \ 9-5 ¶ 设置属性页](img/394392_3_En_9_Fig5_HTML.jpg)\n图 9-5 ¶ 设置属性页\n在向导的选择模板页中，如图\
    \ 9-6 所示，您可以选择预定义的模板，这将为您常用的会话提供起点，或者您可以从空白画布开始并手动定义整个会话。我们将选择后者选项。![图 9-6 ¶ 选择模板页](img/394392_3_En_9_Fig6_HTML.jpg)\n\
    图 9-6 ¶ 选择模板页\n图 9-7 显示了选择要捕获的事件页。在这里，我们可以选择要包含在会话中的事件。为了本次演示的目的，假设我们经常看到辅助副本落后于主副本，并且我们正在尝试确定原因。具体来说，我们是否有\
    \ IO 瓶颈？因为我们试图回答一个非常具体的问题，所以要选择的事件很明确。我们需要 `hadr_db_marked_for_reseed` 事件来确定辅助副本何时落后，并且需要\
    \ `long_io_detected` 事件，以便将时间关联起来，看看是否存在模式。![图 9-7 ¶ 选择要捕获的事件页](img/394392_3_En_9_Fig7_HTML.jpg)\n\
    图 9-7 ¶ 选择要捕获的事件页\n捕获全局字段页将允许我们指定要捕获的任何操作。在我们的场景中，我们将捕获 `NT Username` 和 `SQLText`\
    \ 操作。这将使我们能够追踪任何长时间 IO，看看它们是否由低效查询引起。捕获全局字段页如图 9-8 所示。![图 9-8 ¶ 捕获全局字段页](img/394392_3_En_9_Fig8_HTML.jpg)\n\
    图 9-8 ¶ 捕获全局字段页\n"

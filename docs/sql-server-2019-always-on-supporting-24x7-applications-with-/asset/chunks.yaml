    \ into a safe state. This avoids any possibility of data loss. The way that I\
    \ normally achieve this in a production environment is by performing the following\
    \ steps: \n\n1.  1. \n\n    Disable logins.\n\n2.  2. \n\n    Change the mode\
    \ of the replica to Synchronous Commit mode.\n\n3.  3. \n\n    Fail over.\n\n\
    4.  4. \n\n    Change the replica back to Asynchronous Commit mode.\n\n5.  5.\
    \ \n\n    Enable the logins.\n\nYou can perform these steps with the script in\
    \ Listing [8-6](#394392_3_En_8_Chapter.xhtml#PC6). When run from the DR instance,\
    \ this script places the databases in HR into a safe state before failing over,\
    \ and then it reconfigures the application to work under normal operations. \\\
    --DISABLE LOGINS DECLARE @AOAGDBs TABLE ( DBName NVARCHAR(128) ) ; INSERT INTO\
    \ @AOAGDBs SELECT database\\_name FROM sys.availability\\_groups AG INNER JOIN\
    \ sys.availability\\_databases\\_cluster ADC         ON AG.group\\_id = ADC.group\\\
    _id WHERE AG.name = 'HR' ; DECLARE @Mappings TABLE (     LoginName NVARCHAR(128),\

    \ are synchronized and that no data loss will occur.  ![Figure 8-4 ¶ The Select\
    \ New Primary Replica Page ](images/394392_3_En_8_Chapter/394392_3_En_8_Fig4_HTML.jpg)\n\
    \nFigure 8-4 ¶ The Select New Primary Replica Page \n\nOn the Connect to Replica\
    \ page, illustrated in Figure [8-5](#394392_3_En_8_Chapter.xhtml#Fig5), use the\
    \ Connect button to establish a connection to the new primary replica.  ![Figure\
    \ 8-5 ¶ The Connect to Replica Page](images/394392_3_En_8_Chapter/394392_3_En_8_Fig5_HTML.jpg)\n\
    \nFigure 8-5 ¶ The Connect to Replica Page\n\nOn the Summary page, you are given\
    \ details of the task to be performed, followed by a progress indicator on the\
    \ Results page. Once the failover completes, check that all tasks were successful,\
    \ and investigate any errors or warnings that you receive. \n\nWe can also use\
    \ T-SQL to fail over the availability group. The command in Listing [8-4](#394392_3_En_8_Chapter.xhtml#PC4)\
    \ achieves the same results. Make sure to run this script from the replica that\
    \ will be the new primary replica. If you run it from the current primary replica,\
    \ use SQLCMD mode and connect to the new primary within the script. ALTER AVAILABILITY\
    \ GROUP HR FAILOVER ; GO Listing 8-4 \n\nFailing Over an Availability Group \n\
    \n#### Asynchronous Failover\n\nIf your availability group is in Asynchronous\
    \   Commit mode, then from a technical standpoint, you can fail over in a similar\
    \ way to the way you can for a replica running in Synchronous Commit mode, except\
    \ for the fact that you need to force the failover, thereby accepting the risk\

- raw: "After creating the Client Access Point, an Availability Group Listener will\
    \ have been added to the Availability Group, with a default port of 1433. If you\
    \ plan to use a different port, this can be updated in the Listener, in SQL Server\
    \ Management Studio.\n\n## Clusterless Availability Groups\n\nClusterless Availability\
    \ Groups appeared in SQL Server 2017, as a by-product of Linux support, but can\
    \ also prove valuable to SQL Server DBAs supporting instances on Windows environments.\n\
    \nA clusterless implementation is not suitable for high availability scenarios.\
    \ This is for several reasons. Firstly, because there is no cluster, there are\
    \ no health checks. This means that there is no way to automatically arbitrate\
    \ a failover. Secondly, although it is possible to use synchronous commit between\
    \ the replicas, to failover without data loss, you will need to prepare the failover\
    \ by taking the Availability Group offline on the primary Replica. This means\
    \ that there will be an outage during failover. Finally, because there is no cluster,\
    \ it is not possible to have a Listener. This means that applications connecting\
    \ to the primary Replica will need to flip connection strings to point at the\
    \ secondary Replica in the event of failover.\n\nTip \n\nIt is possible to create\
    \ a C-NAME record in DNS that points to the Primary replica. You can then update\
    \ the C-NAME record to point to the secondary replica at point of failover. While\
    \ this is a manual process, usually involving teams external to the DBA function,\
    \ it can avoid the need for a client to change its connection string.\n\nClusterless\
    \ Availability Groups have most benefit in read-scale scenarios. For this reason,\
    \ they are also known as Read-scale Availability Groups. Imagine a scenario where\
    \ you have a SQL Server workload with a high read throughput, from multiple applications,\
    \ but no HA requirement. You can remove the complexity of clustering while still\
    \ keeping your databases synchronized. Some client applications can be configured\
    \ to point to the primary Replica, while other client applications can be configured\
    \ to point at secondary Replicas.\n\nIn this section, we will work on a scenario\
    \ where we have two servers called Prod and ReadScale. Each server has a default\
    \ instance of SQL Server 2019 Enterprise Edition installed. Both servers are in\
    \ Site 1 and are both members of the AlwaysOn.com domain, but there is no cluster.\
    \ We will configure an Availability Group to provide read-scaling for the Customers\
    \ database, which is accessed by two applications, but one of the applications\
    \ only performs read-only operations.\n\n### Preparing the Instances\n\nAs with\
    \ all Availability Group scenarios, there are preparation tasks that we need to\
    \ work through before configuring the Availability Group. The following sections\
    \ describe how to prepare the instances.\n\n#### Enable Availability Groups\n\n\
    As always, the first step in preparing an instance for Availability Groups is\
    \ to enable Availability Groups on the database engine service. We can perform\
    \ this task with PowerShell or SQL Server Configuration Manager, as demonstrated\
    \ in Chapter [5](#394392_3_En_5_Chapter.xhtml). In this instance, we will use\
    \ Configuration Manager, as shown in Figure [7-21](#394392_3_En_7_Chapter.xhtml#Fig21).\
    \ You will notice that because there is no underlying cluster, the dialog box\
    \ informs us of this, rather than displaying the underlying cluster name. This\
    \ task needs to be performed on all instances that will participate in the Availability\
    \ Group. ![Figure 7-21 ¶ Enable Availability Groups](images/394392_3_En_7_Chapter/394392_3_En_7_Fig21_HTML.jpg)\n\
    \nFigure 7-21 ¶ Enable Availability Groups\n\nAfter enabling Availability Groups,\
    \ the service needs to be restated for the change to take effect.\n\n#### Create\
    \ the Customers Database\n\nThe aim in this scenario is to provide read-scaling\
    \ for the Customers database. Therefore, we can create the Customers database\
    \ by using the script in Listing [7-3](#394392_3_En_7_Chapter.xhtml#PC3). \\--Create\
    \ Customers Database CREATE DATABASE Customers ; GO USE Customers ; GO CREATE\
    \ TABLE dbo.Customers (       ID                INT                PRIMARY KEY        IDENTITY,\
    \       FirstName         NVARCHAR(30),       LastName          NVARCHAR(30),\
    \       CreditCardNumber  VARBINARY(8000) ) ; GO \\--Populate the table DECLARE\
    \ @Numbers TABLE (         Number        INT ) ;WITH CTE(Number) AS (         SELECT\
    \ 1 Number         UNION ALL         SELECT Number + 1         FROM CTE         WHERE\
    \ Number < 100 ) INSERT INTO @Numbers SELECT Number FROM CTE DECLARE @Names TABLE\
    \ (         FirstName        VARCHAR(30),         LastName         VARCHAR(30)\
    \ ) ; INSERT INTO @Names VALUES('Peter', 'Carter'),       ('Michael', 'Smith'),\
    \       ('Danielle', 'Mead'),       ('Reuben', 'Roberts'),       ('Iris', 'Jones'),\
    \       ('Sylvia', 'Davies'),       ('Finola', 'Wright'),       ('Edward', 'James'),\
    \       ('Marie', 'Andrews'),       ('Jennifer', 'Abraham'),       ('Margaret',\
    \ 'Jones') INSERT INTO Customers(Firstname, LastName, CreditCardNumber)       SELECT\
    \                 FirstName               , LastName               , CreditCardNumber\
    \       FROM (             SELECT                    (SELECT TOP 1 FirstName FROM\
    \ @Names ORDER BY NEWID()) FirstName            , (SELECT TOP 1 LastName FROM\
    \ @Names ORDER BY NEWID()) LastName            , (SELECT TOP 1 CONVERT(VARBINARY(8000),\
    \ (                   (SELECT TOP 1 CAST(Number \\* 100 AS CHAR(4))                         FROM\
    \ @Numbers                         WHERE Number BETWEEN 10 AND 99                         ORDER\
    \ BY NEWID()                    ) + '-' +                    (SELECT TOP 1 CAST(Number\
    \ \\* 100 AS CHAR(4))                         FROM @Numbers                         WHERE\
    \ Number BETWEEN 10 AND 99 ORDER BY NEWID()                     ) + '-' +                     (SELECT\
    \ TOP 1 CAST(Number \\* 100 AS CHAR(4))                         FROM @Numbers\
    \                         WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID()                      )\
    \ + '-' +                      (SELECT TOP 1 CAST(Number \\* 100 AS CHAR(4))                         FROM\
    \ @Numbers                         WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID())))\
    \             FROM @Numbers a       ) CreditCardNumber) d CROSS JOIN @Numbers\
    \ b CROSS JOIN @Numbers c; \\--SET FULL recovery mode on the database - required\
    \ for Availability Groups ALTER DATABASE Customers SET RECOVERY FULL ; GO Listing\
    \ 7-3 \n\nCreate the Customers Database\n\nWe also need to take a full backup\
    \ of the database before it can be added to an Availability Group. We can achieve\
    \ this using the script in Listing [7-4](#394392_3_En_7_Chapter.xhtml#PC4). \\\
    --Back Up Customers Database BACKUP DATABASE Customers TO  DISK = 'C:\\\\Program\
    \ Files\\\\Microsoft SQL Server\\\\MSSQL15.MSSQLSERVER\\\\MSSQL\\\\Backup\\\\\
    Customers.bak' WITH NAME = 'Customers-Full Database Backup' ; GO Listing 7-4 \n\
    \nBack Up the Customers Database\n\n#### Create Logins\n\nData synchronization\
    \ will be performed by the service account(s) that are running the database engine\
    \ services. Therefore, the service account(s) will require logins on all of the\
    \ instances that will become Replicas in the Availability Group. In our scenario,\
    \ both of the instance are running under the ALWAYSON\\\\SqlServiceAccount domain\
    \ account. Therefore, running the script in Listing [7-5](#394392_3_En_7_Chapter.xhtml#PC5)\
    \ on all participating instances will create the required logins. CREATE LOGIN\
    \ \\[ALWAYSON\\\\SQLServiceAccount\\] FROM WINDOWS ; GO Listing 7-5 \n\nCreate\
    \ the Logins\n\nTip \n\nIf the servers were not members of the domain, then we\
    \ could configure authentication using SQL logins and certificates.\n\n#### Create\
    \ and Configure the Availability Group"
  fmt: "\nAfter creating the `Client Access Point`, an `Availability Group Listener`\
    \ will have been added to the `Availability Group`, with a default port of `1433`.\
    \ If you plan to use a different port, this can be updated in the Listener, in\
    \ `SQL Server Management Studio`.\n\n## Clusterless Availability Groups\n\nClusterless\
    \ Availability Groups appeared in `SQL Server 2017`, as a by-product of `Linux`\
    \ support, but can also prove valuable to SQL Server DBAs supporting instances\
    \ on `Windows` environments.\n\nA clusterless implementation is not suitable for\
    \ high availability scenarios. This is for several reasons. Firstly, because there\
    \ is no cluster, there are no health checks. This means that there is no way to\
    \ automatically arbitrate a failover. Secondly, although it is possible to use\
    \ `synchronous commit` between the replicas, to failover without data loss, you\
    \ will need to prepare the failover by taking the `Availability Group` offline\
    \ on the primary Replica. This means that there will be an outage during failover.\
    \ Finally, because there is no cluster, it is not possible to have a Listener.\
    \ This means that applications connecting to the primary Replica will need to\
    \ flip connection strings to point at the secondary Replica in the event of failover.\n\
    \n**Tip**\nIt is possible to create a `C-NAME` record in `DNS` that points to\
    \ the Primary replica. You can then update the `C-NAME` record to point to the\
    \ secondary replica at point of failover. While this is a manual process, usually\
    \ involving teams external to the DBA function, it can avoid the need for a client\
    \ to change its connection string.\n\nClusterless Availability Groups have most\
    \ benefit in read-scale scenarios. For this reason, they are also known as Read-scale\
    \ Availability Groups. Imagine a scenario where you have a SQL Server workload\
    \ with a high read throughput, from multiple applications, but no HA requirement.\
    \ You can remove the complexity of clustering while still keeping your databases\
    \ synchronized. Some client applications can be configured to point to the primary\
    \ Replica, while other client applications can be configured to point at secondary\
    \ Replicas.\n\nIn this section, we will work on a scenario where we have two servers\
    \ called `Prod` and `ReadScale`. Each server has a default instance of `SQL Server\
    \ 2019 Enterprise Edition` installed. Both servers are in Site 1 and are both\
    \ members of the `AlwaysOn.com` domain, but there is no cluster. We will configure\
    \ an `Availability Group` to provide read-scaling for the `Customers` database,\
    \ which is accessed by two applications, but one of the applications only performs\
    \ read-only operations.\n\n### Preparing the Instances\n\nAs with all Availability\
    \ Group scenarios, there are preparation tasks that we need to work through before\
    \ configuring the Availability Group. The following sections describe how to prepare\
    \ the instances.\n\n#### Enable Availability Groups\n\nAs always, the first step\
    \ in preparing an instance for Availability Groups is to enable Availability Groups\
    \ on the database engine service. We can perform this task with `PowerShell` or\
    \ `SQL Server Configuration Manager`, as demonstrated in Chapter [5](#394392_3_En_5_Chapter.xhtml).\
    \ In this instance, we will use Configuration Manager, as shown in Figure [7-21](#394392_3_En_7_Chapter.xhtml#Fig21).\
    \ You will notice that because there is no underlying cluster, the dialog box\
    \ informs us of this, rather than displaying the underlying cluster name. This\
    \ task needs to be performed on all instances that will participate in the Availability\
    \ Group. ![Figure 7-21 ¶ Enable Availability Groups](images/394392_3_En_7_Chapter/394392_3_En_7_Fig21_HTML.jpg)\n\
    \nFigure 7-21 ¶ Enable Availability Groups\n\nAfter enabling Availability Groups,\
    \ the service needs to be restated for the change to take effect.\n\n#### Create\
    \ the Customers Database\n\nThe aim in this scenario is to provide read-scaling\
    \ for the `Customers` database. Therefore, we can create the `Customers` database\
    \ by using the script in Listing [7-3](#394392_3_En_7_Chapter.xhtml#PC3).\n\n\
    ```sql\n--Create Customers Database\nCREATE DATABASE Customers;\nGO\nUSE Customers;\n\
    GO\nCREATE TABLE dbo.Customers (\n      ID                INT                PRIMARY\
    \ KEY        IDENTITY,\n      FirstName         NVARCHAR(30),\n      LastName\
    \          NVARCHAR(30),\n      CreditCardNumber  VARBINARY(8000)\n);\nGO\n--Populate\
    \ the table\nDECLARE @Numbers TABLE (\n        Number        INT\n);\nWITH CTE(Number)\
    \ AS (\n        SELECT 1 Number\n        UNION ALL\n        SELECT Number + 1\n\
    \        FROM CTE\n        WHERE Number < 100\n)\nINSERT INTO @Numbers SELECT\
    \ Number FROM CTE\nDECLARE @Names TABLE (\n        FirstName        VARCHAR(30),\n\
    \        LastName         VARCHAR(30)\n);\nINSERT INTO @Names VALUES('Peter',\
    \ 'Carter'),\n      ('Michael', 'Smith'),\n      ('Danielle', 'Mead'),\n     \
    \ ('Reuben', 'Roberts'),\n      ('Iris', 'Jones'),\n      ('Sylvia', 'Davies'),\n\
    \      ('Finola', 'Wright'),\n      ('Edward', 'James'),\n      ('Marie', 'Andrews'),\n\
    \      ('Jennifer', 'Abraham'),\n      ('Margaret', 'Jones')\nINSERT INTO Customers(Firstname,\
    \ LastName, CreditCardNumber)\n      SELECT\n                FirstName\n     \
    \         , LastName\n              , CreditCardNumber\n      FROM (\n       \
    \     SELECT\n                   (SELECT TOP 1 FirstName FROM @Names ORDER BY\
    \ NEWID()) FirstName\n           , (SELECT TOP 1 LastName FROM @Names ORDER BY\
    \ NEWID()) LastName\n           , (SELECT TOP 1 CONVERT(VARBINARY(8000), (\n \
    \                 (SELECT TOP 1 CAST(Number * 100 AS CHAR(4))\n              \
    \          FROM @Numbers\n                        WHERE Number BETWEEN 10 AND\
    \ 99\n                        ORDER BY NEWID()\n                   ) + '-' +\n\
    \                   (SELECT TOP 1 CAST(Number * 100 AS CHAR(4))\n            \
    \            FROM @Numbers\n                        WHERE Number BETWEEN 10 AND\
    \ 99 ORDER BY NEWID()\n                    ) + '-' +\n                    (SELECT\
    \ TOP 1 CAST(Number * 100 AS CHAR(4))\n                        FROM @Numbers\n\
    \                        WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID()\n   \
    \                  ) + '-' +\n                     (SELECT TOP 1 CAST(Number *\
    \ 100 AS CHAR(4))\n                        FROM @Numbers\n                   \
    \     WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID())))\n            FROM @Numbers\
    \ a\n      ) CreditCardNumber) d\nCROSS JOIN @Numbers b\nCROSS JOIN @Numbers c;\n\
    --SET FULL recovery mode on the database - required for Availability Groups\n\
    ALTER DATABASE Customers SET RECOVERY FULL;\nGO\n```\n\nListing 7-3\n\nCreate\
    \ the Customers Database\n\nWe also need to take a full backup of the database\
    \ before it can be added to an Availability Group. We can achieve this using the\
    \ script in Listing [7-4](#394392_3_En_7_Chapter.xhtml#PC4).\n\n```sql\n--Back\
    \ Up Customers Database\nBACKUP DATABASE Customers TO DISK = 'C:\\Program Files\\\
    Microsoft SQL Server\\MSSQL15.MSSQLSERVER\\MSSQL\\Backup\\Customers.bak' WITH\
    \ NAME = 'Customers-Full Database Backup';\nGO\n```\n\nListing 7-4\n\nBack Up\
    \ the Customers Database\n\n#### Create Logins\n\nData synchronization will be\
    \ performed by the service account(s) that are running the database engine services.\
    \ Therefore, the service account(s) will require logins on all of the instances\
    \ that will become Replicas in the Availability Group. In our scenario, both of\
    \ the instance are running under the `ALWAYSON\\SqlServiceAccount` domain account.\
    \ Therefore, running the script in Listing [7-5](#394392_3_En_7_Chapter.xhtml#PC5)\
    \ on all participating instances will create the required logins.\n\n```sql\n\
    CREATE LOGIN [ALWAYSON\\SQLServiceAccount] FROM WINDOWS;\nGO\n```\n\nListing 7-5\n\
    \nCreate the Logins\n\n**Tip**\nIf the servers were not members of the domain,\
    \ then we could configure authentication using SQL logins and certificates.\n\n\
    #### Create and Configure the Availability Group\n"
  trans: "\n创建 `Client Access Point` 后，`Availability Group` 中将添加一个 `Availability Group\
    \ Listener`，默认端口为 `1433`。如果计划使用不同的端口，可以在 `SQL Server Management Studio` 中的侦听器中进行更新。\n\
    \n## 无群集可用性组\n\n无群集可用性组出现在 `SQL Server 2017` 中，是 `Linux` 支持的副产品，但对于支持 `Windows`\
    \ 环境上实例的 SQL Server DBA 来说也可能很有价值。\n\n无群集实现不适用于高可用性场景。这有几个原因。首先，因为没有群集，所以没有运行状况检查。这意味着无法自动仲裁故障转移。其次，虽然可以在副本之间使用\
    \ `synchronous commit` 实现无数据丢失的故障转移，但您需要通过将 `Availability Group` 在主副本上脱机来准备故障转移。这意味着故障转移期间会出现中断。最后，因为没有群集，所以无法拥有侦听器。这意味着连接到主副本的应用程序在故障转移事件中需要切换连接字符串以指向辅助副本。\n\
    \n**提示**\n可以在 `DNS` 中创建指向主副本的 `C-NAME` 记录。然后可以在故障转移时将 `C-NAME` 记录更新为指向辅助副本。虽然这是一个手动过程，通常涉及\
    \ DBA 职能之外的团队，但它可以避免客户端更改其连接字符串的需求。\n\n无群集可用性组在读扩展场景中获益最大。因此，它们也被称为读扩展可用性组。设想一个场景，您有一个\
    \ SQL Server 工作负载，来自多个应用程序的读取吞吐量很高，但没有 HA 要求。您可以消除群集的复杂性，同时仍保持数据库同步。某些客户端应用程序可以配置为指向主副本，而其他客户端应用程序可以配置为指向辅助副本。\n\
    \n在本节中，我们将处理一个场景，其中有两个名为 `Prod` 和 `ReadScale` 的服务器。每个服务器都安装了默认实例的 `SQL Server\
    \ 2019 Enterprise Edition`。两个服务器都在站点 1，并且都是 `AlwaysOn.com` 域的成员，但没有群集。我们将配置一个\
    \ `Availability Group` 为 `Customers` 数据库提供读扩展，该数据库由两个应用程序访问，但其中一个应用程序仅执行只读操作。\n\
    \n### 准备实例\n\n与所有可用性组场景一样，在配置可用性组之前，我们需要完成一些准备任务。以下各节描述如何准备实例。\n\n#### 启用可用性组\n\
    \n通常情况下，为实例准备可用性组的首要步骤是在数据库引擎服务上启用可用性组。我们可以使用 `PowerShell` 或 `SQL Server Configuration\
    \ Manager` 执行此任务，如 第 5 章所示。在本例中，我们将使用 Configuration Manager，如 图 7-21 所示。您会注意到，因为没有底层群集，对话框会告知我们这一点，而不是显示底层群集名称。此任务需要在将参与可用性组的所有实例上执行。\
    \ ![图 7-21 ¶ 启用可用性组](img/394392_3_En_7_Fig21_HTML.jpg)\n\n图 7-21 ¶ 启用可用性组\n\n\
    启用可用性组后，需要重新启动服务才能使更改生效。\n\n#### 创建 Customers 数据库\n\n本场景的目标是为 `Customers` 数据库提供读扩展。因此，我们可以使用\
    \ 清单 7-3 中的脚本创建 `Customers` 数据库。\n\n```sql\n--Create Customers Database\nCREATE\
    \ DATABASE Customers;\nGO\nUSE Customers;\nGO\nCREATE TABLE dbo.Customers (\n\
    \      ID                INT                PRIMARY KEY        IDENTITY,\n   \
    \   FirstName         NVARCHAR(30),\n      LastName          NVARCHAR(30),\n \
    \     CreditCardNumber  VARBINARY(8000)\n);\nGO\n--Populate the table\nDECLARE\
    \ @Numbers TABLE (\n        Number        INT\n);\nWITH CTE(Number) AS (\n   \
    \     SELECT 1 Number\n        UNION ALL\n        SELECT Number + 1\n        FROM\
    \ CTE\n        WHERE Number < 100\n)\nINSERT INTO @Numbers SELECT Number FROM\
    \ CTE\nDECLARE @Names TABLE (\n        FirstName        VARCHAR(30),\n       \
    \ LastName         VARCHAR(30)\n);\nINSERT INTO @Names VALUES('Peter', 'Carter'),\n\
    \      ('Michael', 'Smith'),\n      ('Danielle', 'Mead'),\n      ('Reuben', 'Roberts'),\n\
    \      ('Iris', 'Jones'),\n      ('Sylvia', 'Davies'),\n      ('Finola', 'Wright'),\n\
    \      ('Edward', 'James'),\n      ('Marie', 'Andrews'),\n      ('Jennifer', 'Abraham'),\n\
    \      ('Margaret', 'Jones')\nINSERT INTO Customers(Firstname, LastName, CreditCardNumber)\n\
    \      SELECT\n                FirstName\n              , LastName\n         \
    \     , CreditCardNumber\n      FROM (\n            SELECT\n                 \
    \  (SELECT TOP 1 FirstName FROM @Names ORDER BY NEWID()) FirstName\n         \
    \  , (SELECT TOP 1 LastName FROM @Names ORDER BY NEWID()) LastName\n         \
    \  , (SELECT TOP 1 CONVERT(VARBINARY(8000), (\n                  (SELECT TOP 1\
    \ CAST(Number * 100 AS CHAR(4))\n                        FROM @Numbers\n     \
    \                   WHERE Number BETWEEN 10 AND 99\n                        ORDER\
    \ BY NEWID()\n                   ) + '-' +\n                   (SELECT TOP 1 CAST(Number\
    \ * 100 AS CHAR(4))\n                        FROM @Numbers\n                 \
    \       WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID()\n                    )\
    \ + '-' +\n                    (SELECT TOP 1 CAST(Number * 100 AS CHAR(4))\n \
    \                       FROM @Numbers\n                        WHERE Number BETWEEN\
    \ 10 AND 99 ORDER BY NEWID()\n                     ) + '-' +\n               \
    \      (SELECT TOP 1 CAST(Number * 100 AS CHAR(4))\n                        FROM\
    \ @Numbers\n                        WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID())))\n\
    \            FROM @Numbers a\n      ) CreditCardNumber) d\nCROSS JOIN @Numbers\
    \ b\nCROSS JOIN @Numbers c;\n--SET FULL recovery mode on the database - required\
    \ for Availability Groups\nALTER DATABASE Customers SET RECOVERY FULL;\nGO\n```\n\
    \n清单 7-3\n\n创建 Customers 数据库\n\n我们还需要在数据库添加到可用性组之前对其进行完整备份。我们可以使用 清单 7-4 中的脚本实现此操作。\n\
    \n```sql\n--Back Up Customers Database\nBACKUP DATABASE Customers TO DISK = 'C:\\\
    Program Files\\Microsoft SQL Server\\MSSQL15.MSSQLSERVER\\MSSQL\\Backup\\Customers.bak'\
    \ WITH NAME = 'Customers-Full Database Backup';\nGO\n```\n\n清单 7-4\n\n备份 Customers\
    \ 数据库\n\n#### 创建登录名\n\n数据同步将由运行数据库引擎服务的服务帐户执行。因此，服务帐户将在成为可用性组中副本的所有实例上需要登录名。在我们的场景中，两个实例都在\
    \ `ALWAYSON\\SqlServiceAccount` 域帐户下运行。因此，在所有参与实例上运行 清单 7-5 中的脚本将创建所需的登录名。\n\n\
    ```sql\nCREATE LOGIN [ALWAYSON\\SQLServiceAccount] FROM WINDOWS;\nGO\n```\n\n\
    清单 7-5\n\n创建登录名\n\n**提示**\n如果服务器不是域的成员，则可以使用 SQL 登录名和证书配置身份验证。\n\n#### 创建和配置可用性组\n"

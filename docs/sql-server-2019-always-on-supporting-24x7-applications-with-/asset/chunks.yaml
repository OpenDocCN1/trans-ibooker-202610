    \n## Managing AlwaysOn Availability Groups\n\nOnce the initial setup of your availability\
    \ group is complete, you still need to perform administrative tasks. These include\
    \ failing over the availability group, monitoring, and on rare occasions, adding\
    \ additional listeners. These topics are discussed in the following sections.\n\
    \n### Failover\n\nIf a replica is in Synchronous Commit mode and is configured\
    \ for automatic failover, then the availability group automatically moves to a\
    \ redundant replica in the event of an error condition being met on the primary\
    \ replica. There are occasions, however, when you will want to manually fail over\
    \ an availability group. This could be because of DR testing, proactive maintenance,\
    \ or because you need to bring up an asynchronous replica following a failure\
    \ of the primary replica or the primary data center.\n\n#### Synchronous Failover\n\
    \nIf you wish to fail over a replica that is in Synchronous  Commit mode, launch\
    \ the Failover Availability Group wizard by selecting Failover from the context\
    \ menu of your availability group in Object Explorer. After moving past the Introduction\
    \ page, you find the Select New Primary Replica page (see Figure [8-4](#394392_3_En_8_Chapter.xhtml#Fig4)).\
    \ On this page, check the box of the replica to which you want to fail over. Before\

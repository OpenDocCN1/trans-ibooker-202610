  是拥有超过 15 年经验的 SQL Server 专家，致力于开发、管理和构建 SQL Server 平台和数据层应用程序。Peter 于 2011 年获得微软颁发的
  MCC，并在其从 2005 年版本开始的 SQL Server MCTS、MCITP、MCSA 和 MCSE 认证系列中占据一席之地。他对 SQL Server
  的热情体现在他所做的一切中，他的目标是让自己对该技术的热情激励他人。



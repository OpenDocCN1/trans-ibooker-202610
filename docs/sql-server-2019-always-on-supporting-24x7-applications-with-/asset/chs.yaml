  ## 使用 PowerShell 安装实例

  当然，我们可以使用 `PowerShell` 而不是使用 GUI 来安装 `AlwaysOn` 故障转移群集实例。要从 `PowerShell` 安装 `AlwaysOn`
  故障转移群集实例，我们可以使用 `SQL Server` 的 `setup.exe` 应用程序，并指定 `InstallFailoverCluster` 操作。


  当您执行群集实例的命令行安装时，除了安装 `SQL Server` 单机实例时强制要求的参数外，还需要表 4-1 中的参数。表 4-1


  群集实例安装所需的参数


  | 参数 || 用法 |

  | --- | --- |

  | `/FAILOVERCLUSTERIPADDRESSES` || 指定实例要使用的 IP 地址，格式为 *<IP Type>;<address>;<network
  name>;<subnet mask>.* 对于多子网群集，IP 地址以空格分隔。 |

  | --- | --- |

  | `/FAILOVERCLUSTERNETWORKNAME` || 群集实例的虚拟名称。 |

  | `/INSTALLSQLDATADIR` || 放置 `SQL Server` 数据文件的文件夹。这必须是群集磁盘。 |


  在安装介质的根目录下运行它时，列表 4-1 中的脚本会执行刚刚演示的相同安装。

  ```

  .\SETUP.EXE /IACCEPTSQLSERVERLICENSETERMS /ACTION="InstallFailoverCluster" /FEATURES=SQL,IS
  /INSTANCENAME="MSSQLSERVER" /SQLSVCACCOUNT="ALWAYSON\\SQLServiceAccount" /SQLSVCPASSWORD="Pa$$w0rd"
  /AGTSVCACCOUNT="ALWAYSON\\SQLServiceAccount" /AGTSVCPASSWORD="Pa$$w0rd" /SQLSYSADMINACCOUNTS="ALWAYSO\\SQLAdmin"
  /SQLMAXDOP="1" /FAILOVERCLUSTERIPADDRESSES="IPv4;10.0.0.9;Cluster Network 2;255.255.255.0"
  /FAILOVERCLUSTERDISKS="Cluster Disk 1" "Cluster Disk 2" "Cluster Disk 3" /FAILOVERCLUSTERNETWORKNAME="ALWAYSON-SQL-C"
  /INSTALLSQLDATADIR="F:\\" /SQLUSERDBLOGDIR="L:\\MSSQL15.MSSQLSERVER\\MSSQL\\Logs"
  /SQLTEMPDBDIR="T:\\MSSQL15.MSSQLSERVER\\MSSQL\\TempDB" /SQLTEMPDBLOGDIR="T:\\MSSQL15.MSSQLSERVER\\MSSQL\\TempDB"
  /SQLMAXMEMORY="2048" /SQLMINMEMORY="1024" /qs

  ```


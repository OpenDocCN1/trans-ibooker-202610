  是伦敦的一名自由 SQL Server 顾问。除本职工作外，他还是作者、软件实用工具的创建者以及技术审阅者，定期为 [www.i-programmer.info](http://www.i-programmer.info)
  撰写书籍评论。


  他涵盖 SQL Server 的各个方面，并在性能和可扩展性方面具有专业兴趣。如果您需要帮助处理 SQL Server 系统，请随时通过 ian_stirk@yahoo.com
  或 [www.linkedin.com/in/ian-stirk-bb9a31/](http://www.linkedin.com/in/ian-stirk-bb9a31/)

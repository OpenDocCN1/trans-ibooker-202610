  '
- "# 5. 在 Windows 上实现 AlwaysOn 可用性组\n\nPeter A. Carter (1) (1) Botley, UK\nEnd Abstract\n\
  \nAlwaysOn 可用性组提供了一种灵活的选项，用于实现高可用性、从灾难中恢复以及扩展只读工作负载。该技术在数据库级别同步数据，健康监控和仲裁通常由 Windows\
  \ 群集提供，尽管 Windows 群集不是强制性的。\n\nAlwaysOn 可用性组有不同的变体。传统版本位于 Windows 故障转移群集上，但如果 SQL\
  \ Server 安装在 Linux 上，则可以使用 Pacemaker。AlwaysOn 可用性组也可以在没有群集的情况下配置。这对于卸载报表是可以接受的，但不是有效的高可用性（HA）或灾难恢复（DR）配置。使用\
  \ SQL Server 2019 与 Windows Server 2019 时，可用性组甚至可以为容器化 SQL 配置，使用 Kubernetes。\n\n\
  本章重点介绍在 Windows 故障转移群集上配置可用性组，以提供 HA 和 DR 以及扩展只读工作负载。Linux 上的可用性组将在第 6 章中探讨。\n\n\
  ### 注\n\n对于本章中的演示，我们将使用第 3 章中构建的群集，但已向群集添加了两个额外节点：`CLUSTERNODE3` 和 `CLUSTERNODE4`。我们将不使用第\
  \ 4 章中配置的故障转移群集实例。相反，每个节点上都安装了 SQL Server 的独立实例，名称如下：`CLUSTERNODE1\\PROD`、`CLUSTERNODE2\\\
  SYNCHA`、`CLUSTERNODE3\\ASYNCDR` 和 `CLUSTERNODE4\\READSCALE`。群集节点 1 和 2 位于名为 Site1\
  \ 的子网内，群集节点 3 和 4 位于名为 Site2 的不同子网内。实例将数据库数据和日志文件存储在 `C:\\` 卷上。群集内的共享存储未用于这些实例。\n\
  \n在本章中，我们将执行以下活动：\n\n* 创建 Sales、Customers、Accounts 和 HR 数据库。\n* 在我们的实例上启用可用性组。\n\
  * 使用新建可用性组向导为 HR 数据库创建可用性组。此可用性组将仅配置为 HA。\n* 使用新建可用性组对话框为 Sales 和 Customers 数据库创建可用性组。这将配置为\
  \ HA、DR 和只读扩展。\n* 使用 `T-SQL` 为 Accounts 数据库创建可用性组。此可用性组将配置为 HA 和 DR，而不进行任何只读扩展。\n\
  * 我们还将讨论如何使用 `PowerShell` 创建可用性组。\n\n## 准备实现 AlwaysOn 可用性组\n\n\n\n\n在实施 `AlwaysOn\
  \ Availability Groups` 之前，我们首先创建四个数据库，这些数据库将在本章的演示中使用。每个数据库包含一个表，我们用数据填充它。每个数据库都配置为恢复模式设置为\
  \ `FULL`。这是数据库使用 `AlwaysOn Availability Groups` 的硬性要求，因为数据是通过日志流同步的。列表 5-1 中的脚本创建了这些数据库。\n\
  \n### Listing 5-1 创建数据库\n\n```sql\n--Create Sales Database\nCREATE DATABASE Sales;\n\
  GO\nUSE Sales;\nGO\nCREATE TABLE [dbo].Orders NOT NULL PRIMARY KEY CLUSTERED,\n\
  \    [OrderDate] [date] NOT NULL,\n    [CustomerID] [int] NOT NULL,\n    [ProductID]\
  \ [int] NOT NULL,\n    [Quantity] [int] NOT NULL,\n    [NetAmount] [money] NOT NULL,\n\
  \    [TaxAmount] [money] NOT NULL,\n    [InvoiceAddressID] [int] NOT NULL,\n   \
  \ [DeliveryAddressID] [int] NOT NULL,\n    [DeliveryDate] [date] NULL,\n);\nDECLARE\
  \ @Numbers TABLE (\n    Number INT\n)\n--Populate ExistingOrders with data\n;WITH\
  \ CTE(Number) AS (\n    SELECT 1 Number\n    UNION ALL\n    SELECT Number + 1\n\
  \    FROM CTE\n    WHERE Number < 100\n)\nINSERT INTO @Numbers SELECT Number FROM\
  \ CTE\nINSERT INTO Orders\nSELECT\n    (SELECT CAST(DATEADD(dd,(SELECT TOP 1 Number\
  \ FROM @Numbers ORDER BY NEWID()),getdate())as DATE)),\n    (SELECT TOP 1 Number\
  \ -10 FROM @Numbers ORDER BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers ORDER\
  \ BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    500,\n\
  \    100,\n    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    (SELECT\
  \ TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    (SELECT CAST(DATEADD(dd,(SELECT\
  \ TOP 1 Number - 10 FROM @Numbers ORDER BY NEWID()),getdate()) as DATE))\nFROM @Numbers\
  \ a CROSS JOIN @Numbers b;\n--SET FULL recovery mode on the database - required\
  \ for Availability Groups\nALTER DATABASE Sales SET RECOVERY FULL;\nGO\n--Create\
  \ Customers Database\nCREATE DATABASE Customers;\nGO\nUSE Customers;\nGO\nCREATE\
  \ TABLE dbo.Customers (\n    ID INT PRIMARY KEY IDENTITY,\n    FirstName NVARCHAR(30),\n\
  \    LastName NVARCHAR(30),\n    CreditCardNumber VARBINARY(8000)\n);\nGO\n--Populate\
  \ the table\nDECLARE @Numbers TABLE (\n    Number INT\n);\nWITH CTE(Number) AS (\n\
  \    SELECT 1 Number\n    UNION ALL\n    SELECT Number + 1\n    FROM CTE\n    WHERE\
  \ Number < 100\n)\nINSERT INTO @Numbers SELECT Number FROM CTE\nDECLARE @Names TABLE\
  \ (\n    FirstName VARCHAR(30),\n    LastName VARCHAR(30)\n);\nINSERT INTO @Names\
  \ VALUES('Peter', 'Carter'),\n    ('Michael', 'Smith'),\n    ('Danielle', 'Mead'),\n\
  \    ('Reuben', 'Roberts'),\n    ('Iris', 'Jones'),\n    ('Sylvia', 'Davies'),\n\
  \    ('Finola', 'Wright'),\n    ('Edward', 'James'),\n    ('Marie', 'Andrews'),\n\
  \    ('Jennifer', 'Abraham'),\n    ('Margaret', 'Jones')\nINSERT INTO Customers(Firstname,\
  \ LastName, CreditCardNumber)\nSELECT\n    FirstName\n    , LastName\n    , CreditCardNumber\n\
  FROM (\n    SELECT\n        (SELECT TOP 1 FirstName FROM @Names ORDER BY NEWID())\
  \ FirstName\n        , (SELECT TOP 1 LastName FROM @Names ORDER BY NEWID()) LastName\n\
  \        , (SELECT TOP 1 CONVERT(VARBINARY(8000), (\n            (SELECT TOP 1 CAST(Number\
  \ * 100 AS CHAR(4)) FROM @Numbers WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID())\n\
  \            + '-' +\n            (SELECT TOP 1 CAST(Number * 100 AS CHAR(4)) FROM\
  \ @Numbers WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID())\n            + '-' +\n\
  \            (SELECT TOP 1 CAST(Number * 100 AS CHAR(4)) FROM @Numbers WHERE Number\
  \ BETWEEN 10 AND 99 ORDER BY NEWID())\n            + '-' +\n            (SELECT\
  \ TOP 1 CAST(Number * 100 AS CHAR(4)) FROM @Numbers WHERE Number BETWEEN 10 AND\
  \ 99 ORDER BY NEWID())\n        )) FROM @Numbers a\n    ) CreditCardNumber\n) d\
  \ CROSS JOIN @Numbers b CROSS JOIN @Numbers c;\n--SET FULL recovery mode on the\
  \ database - required for Availability Groups\nALTER DATABASE Customers SET RECOVERY\
  \ FULL;\nGO\n--Create Accounts Database\nCREATE DATABASE Accounts;\nGO\nUSE Accounts;\n\
  GO\nCREATE TABLE [dbo].PurchaseOrders NOT NULL PRIMARY KEY CLUSTERED,\n    [OrderDate]\
  \ [date] NOT NULL,\n    [CustomerID] [int] NOT NULL,\n    [ProductID] [int] NOT\
  \ NULL,\n    [Quantity] [int] NOT NULL,\n    [NetAmount] [money] NOT NULL,\n   \
  \ [TaxAmount] [money] NOT NULL,\n    [InvoiceAddressID] [int] NOT NULL,\n    [DeliveryAddressID]\
  \ [int] NOT NULL,\n    [DeliveryDate] [date] NULL,\n);\nDECLARE @Numbers TABLE (\n\
  \    Number INT\n)\n--Populate ExistingPurchaseOrders with data\n;WITH CTE(Number)\
  \ AS (\n    SELECT 1 Number\n    UNION ALL\n    SELECT Number + 1\n    FROM CTE\n\
  \    WHERE Number < 100\n)\nINSERT INTO @Numbers SELECT Number FROM CTE\nINSERT\
  \ INTO PurchaseOrders\nSELECT\n    (SELECT CAST(DATEADD(dd,(SELECT TOP 1 Number\
  \ FROM @Numbers ORDER BY NEWID()),getdate())as DATE)),\n    (SELECT TOP 1 Number\
  \ -10 FROM @Numbers ORDER BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers ORDER\
  \ BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    500,\n\
  \    100,\n    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    (SELECT\
  \ TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    (SELECT CAST(DATEADD(dd,(SELECT\
  \ TOP 1 Number - 10 FROM @Numbers ORDER BY NEWID()),getdate()) as DATE))\nFROM @Numbers\
  \ a CROSS JOIN @Numbers b;\n--SET FULL recovery mode on the database - required\
  \ for Availability Groups\nALTER DATABASE Accounts SET RECOVERY FULL;\nGO\nCREATE\
  \ DATABASE HR;\nGO\nUSE HR;\nGO\nCREATE TABLE dbo.Employees (\n    ID INT PRIMARY\
  \ KEY IDENTITY,\n    FirstName NVARCHAR(30),\n    LastName NVARCHAR(30),\n    EmployeeNumber\
  \ INT\n);\nGO\n--Populate the table\nDECLARE @Numbers TABLE (\n    Number INT\n\
  );\nWITH CTE(Number) AS (\n    SELECT 1 Number\n    UNION ALL\n    SELECT Number\
  \ + 1\n    FROM CTE\n    WHERE Number < 100\n)\nINSERT INTO @Numbers SELECT Number\
  \ FROM CTE\nDECLARE @Names TABLE (\n    FirstName VARCHAR(30),\n    LastName VARCHAR(30)\n\
  );\nINSERT INTO @Names VALUES('Peter', 'Carter'),\n    ('Michael', 'Smith'),\n \
  \   ('Danielle', 'Mead'),\n    ('Reuben', 'Roberts'),\n    ('Iris', 'Jones'),\n\
  \    ('Sylvia', 'Davies'),\n    ('Finola', 'Wright'),\n    ('Edward', 'James'),\n\
  \    ('Marie', 'Andrews'),\n    ('Jennifer', 'Abraham'),\n    ('Margaret', 'Jones')\n\
  INSERT INTO Employees(Firstname, LastName, EmployeeNumber)\nSELECT\n    (SELECT\
  \ TOP 1 FirstName FROM @Names ORDER BY NEWID()) FirstName\n    , (SELECT TOP 1 LastName\
  \ FROM @Names ORDER BY NEWID()) LastName\n    , a.Number EmployeeNumber\nFROM @Numbers\
  \ a;\n--SET FULL recovery mode on the database - required for Availability Groups\n\
  ALTER DATABASE HR SET RECOVERY FULL;\nGO\n```\n\n### 配置 SQL Server\n\n\n\n\n## 启用\
  \ AlwaysOn 可用性组\n\n配置 AlwaysOn 可用性组的首要步骤是在 SQL Server 服务上启用此功能。要从 GUI 启用该功能，我们打开\
  \ SQL Server 配置管理器，依次展开 SQL Server 服务，并从 SQL Server 服务的上下文菜单中选择属性。这样操作后，服务属性会显示出来，我们导航到\
  \ Always On 可用性组 选项卡，如图 5-1 所示。![图 5-1 ¶ Always On 可用性组选项卡](img/394392_3_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1 ¶ Always On 可用性组选项卡\n\n在此选项卡中，我们勾选“启用 AlwaysOn 可用性组”复选框，并确保 Windows 故障转移群集名称\
  \ 框中显示的群集名称正确。然后我们需要重启 SQL Server 服务。因为 AlwaysOn 可用性组使用的是独立实例，这些实例安装在每个群集节点上，而非跨多个节点的故障转移群集实例，因此我们需要对群集上托管的每个独立实例重复这些步骤。\n\
  \n我们也可以使用 PowerShell 来启用 AlwaysOn 可用性组。为此，我们使用列表 5-2 中的 PowerShell 命令。该脚本假定 `CLUSTERNODE1`\
  \ 为服务器名称，`PROD` 为 SQL Server 实例名称。\n\n```\nEnable-SqlAlwaysOn -Path SQLSERVER:\\\
  \\SQL\\\\CLUSTERNODE1\\\\PROD\n```\n\n列表 5-2\n\n启用 AlwaysOn 可用性组\n\n下一步是对将成为可用性组一部分的所有数据库进行完整备份。在完成此操作之前，我们无法将它们添加到可用性组。在本章中，我们将创建三个独立的可用性组。然而在第一个示例中，我们将创建一个名为\
  \ `HR` 的可用性组，为 `HR` 数据库提供高可用性。因此，我们需要备份 `HR` 数据库。我们通过运行列表 5-3 中的脚本来完成此操作。\n\n```\n\
  BACKUP DATABASE HR TO DISK = N'C:\\\\Backups\\\\HR.bak' WITH NAME = N'HR-Full Database\
  \ Backup' ; GO\n```\n\n列表 5-3\n\n备份数据库\n\n## 使用新的可用性组向导\n\n当备份成功完成后，我们通过在 SSMS 中的对象资源管理器中依次展开\
  \ AlwaysOn 高可用性，并从可用性组文件夹的上下文菜单中选择“新建可用性组向导”来调用新建可用性组向导。向导的“介绍”页会显示出来，为我们概述需要执行的操作步骤。\n\
  \n在“指定名称”页（见图 5-2）中，我们会被提示输入可用性组的名称。我们还将选择 Windows Server 故障转移群集 作为群集类型。群集类型的其他选项包括\
  \ external，它支持 Linux 上的 Pacemaker，以及 None，用于无群集可用性组。数据库级运行状况检测 选项将在组内任何数据库脱机时导致可用性组故障转移。每数据库\
  \ DTC 支持 选项将指定是否使用 MSDTC（Microsoft 分布式事务协调程序）支持跨数据库事务。关于配置 DTC 的完整讨论超出了本书范围，但更多详细信息可在\
  \ [`docs.microsoft.com/en-us/previous-versions/windows/desktop/ms681291(v=vs.85)`](https://docs.microsoft.com/en-us/previous-versions/windows/desktop/ms681291%2528v%253Dvs.85%2529)\
  \ 找到。![图 5-2 ¶ 指定名称页](img/394392_3_En_5_Fig2_HTML.jpg)\n\n图 5-2 ¶ 指定名称页\n\n在“选择数据库”页中，我们会被提示选择希望参与可用性组的数据库，如图\
  \ 5-3 所示。在此屏幕上请注意，我们无法选择 Sales、Customers 或 Accounts 数据库，因为我们尚未对这些数据库进行完整备份。![图 5-3\
  \ ¶ 选择数据库页](img/394392_3_En_5_Fig3_HTML.jpg)\n\n图 5-3 ¶ 选择数据库页\n\n“指定副本”页包含五个选项卡。我们使用第一个选项卡“副本”将辅助副本添加到拓扑中。勾选“同步提交”选项会使数据在主副本上提交之前先在辅助副本上提交。（这也被称为在主副本之前对辅助副本\
  \ *硬化日志*。）这意味着在发生故障转移时不会发生数据丢失，即我们可以满足 RPO（恢复点目标）为零的 SLA（服务级别协议）。然而，这也意味着性能会下降。如果我们选择异步提交，则副本以异步提交模式运行。这意味着数据在辅助副本上提交之前先在主副本上提交。这可以避免性能下降，但也意味着在发生故障转移时，RPO\
  \ 是不确定的。\n\n当我们勾选“自动故障转移”选项时，如果尚未选择，则“同步提交”选项也会自动被选中。这是因为自动故障转移仅在同步提交模式下才可能实现。我们可以将“可读辅助副本”下拉菜单设置为\
  \ No、Yes 或 Read-intent。当设置为 No 时，数据库在处于辅助角色的副本上不可访问。当设置为 Read-intent 时，可用性组侦听器可以将只读工作负载重定向到此辅助副本，但前提是应用程序在连接字符串中指定了\
  \ `Application Intent=Read-only`。将其设置为 Yes 可使侦听器重定向只读流量，而不管应用程序的连接字符串中是否存在 Application\
  \ Intent 参数。尽管我们可以在配置副本进行自动故障转移的同时通过 GUI 更改 Readable Secondary 的值而不会报错，但这只是向导的一个怪癖。实际上，副本不可访问，因为在配置为自动故障转移时不支持活动辅助副本。副本选项卡如图\
  \ 5-4 所示。为了满足对 `HR` 数据库实现高可用的要求，我们已将同一站点内的辅助服务器配置为同步副本。这意味着数据中心之间的延迟不会加剧与同步提交相关的性能下降。![图\
  \ 5-4 ¶ 副本选项卡](img/394392_3_En_5_Fig4_HTML.jpg)\n\n图 5-4 ¶ 副本选项卡\n\n在“指定副本”页的“端点”选项卡中，如图\
  \ 5-5 所示，我们为每个端点指定端口号。默认端口为 5022，但如果需要，我们可以指定不同的端口。在此选项卡中，我们还指定在端点之间传输数据时是否应加密。通常最好勾选此选项，如果勾选，则使用\
  \ AES（高级加密标准）作为加密算法。![图 5-5 ¶ 端点选项卡](img/394392_3_En_5_Fig5_HTML.jpg)\n\n图 5-5 ¶\
  \ 端点选项卡\n\n可选地，您还可以更改所创建端点的名称。然而，由于每个实例只允许一个数据库镜像端点，并且默认名称相当具有描述性，因此不总是需要更改它。一些\
  \ DBA 选择重命名它以包含实例名称，因为这可以简化多个服务器的管理。如果您的企业在同一群集上的多个实例中拆分了多个可用性组，这是一个好主意。\n\n\n\n\
  ## 可用性组配置\n\n## 服务帐户和安全占用\n`service account` 每个实例使用的 显示仅供参考。 如果确保两个实例都使用相同的 `service\
  \ account`，则可以简化安全管理。 如果未这样做，则需要为每个实例授予对每个 `service account` 的权限。 这意味着，与仅将 `service\
  \ account` 用于一个实例来减少每个 `service account` 的安全占用相比，您只是将占用范围从操作系统级别提升到 `SQL Server`\
  \ 级别。\n\n## 端点 URL\n端点 URL 指定 `availability groups` 用于通信的端点的 URL。 URL 的格式为 `\\[Transport\
  \ Protocol\\]://\\[Path\\]:\\[Port\\]`。 `database mirroring endpoint` 的传输协议始终为 `TCP`（传输控制协议）。\
  \ 路径可以是服务器的完全限定域名（`FQDN`）、服务器名称本身或在网络中唯一的 `IP address`。 我建议使用服务器的 `FQDN`，因为它总能保证正常工作。\
  \ 它也是填充的默认值。 端口应与为端点指定的端口号匹配。\n\n### 注\n`Availability groups` 通过 `database mirroring\
  \ endpoint` 进行通信。 尽管数据库镜像已被弃用，但端点并未被弃用。\n\n## 备份首选项选项卡\n在 `Backup Preferences` 选项卡上（见图\
  \ 5-6），我们可以指定将执行自动备份的副本。 `AlwaysOn Availability Groups` 的一大优势是，使用它们时，您可以将维护任务（如备份）扩展到辅助服务器。\
  \ 因此，自动备份可以无缝地定向到活动辅助副本。 可选选项为 `Prefer Secondary`、`Secondary Only`、`Primary` 或 `Any\
  \ Replica`。 也可以为每个副本设置优先级。 在确定针对哪个副本运行备份作业时，`SQL Server` 会评估每个节点的备份优先级，更有可能选择优先级最高的副本。\n\
  ![图 5-6 ¶ 备份首选项选项卡](img/394392_3_En_5_Fig6_HTML.jpg)\n图 5-6 ¶ 备份首选项选项卡\n\n尽管在主副本上减少\
  \ IO 的优势显而易见，但我颇具争议地建议在许多情况下不要将自动备份扩展到辅助副本。 当 `RTO`（恢复时间目标）对应用程序而言是优先事项时，尤其如此，因为存在操作支持性问题。\
  \ 想象一下这样的场景：备份正在针对辅助副本进行，而用户来电称他们意外删除了关键表中的所有数据。 您现在需要恢复数据库的副本并重新填充该表。 然而，备份文件位于辅助副本上。\
  \ 因此，您需要在开始恢复数据库之前将备份文件复制到主副本（或通过网络执行恢复）。 这会立即增加您的 `RTO`。\n\n此外，当配置为允许针对多台服务器进行备份时，`SQL\
  \ Server` 仍仅在执行备份的实例上维护备份历史记录。 这意味着您可能需要在服务器之间手忙脚乱，尝试检索所有备份文件，却不知道每个文件的位置。 如果其中一台服务器发生完全系统故障，情况会变得更糟。\
  \ 您可能会发现自己处于日志链断裂的场景中。\n\n我刚刚提到的大多数问题的解决方法是使用文件服务器上的共享，并配置每个实例备份到同一共享。 这可能产生中性、正向或负向的后果。\
  \ 负面后果出现在您使用本地附加存储时。 以这种方式设置备份后，您现在将所有备份通过网络发送，而不是本地备份。 这可能会增加备份的持续时间并增加网络流量。 正面后果是如果您处于云\
  \ `IaaS`（基础设施即服务）环境中。 附加到您的 `VM` 的存储很可能比用于创建文件共享的存储更昂贵。 然而，在许多现代本地部署场景中，后果是中性的。\
  \ 这是因为文件共享和服务器的存储很可能位于同一个 `SAN` 或 `NAS` 设备上。 这意味着以这种方式配置备份时，网络流量或延迟没有区别。\n\n## 侦听器选项卡\n\
  在 `Listener` 选项卡上，如图 5-7 所示，我们选择是否要创建可用性组侦听器，或将此任务推迟到以后。 如果我们选择创建侦听器，则需要指定侦听器的名称、其应监听的端口以及应使用的\
  \ `IP address(es)`。 在多子网集群中，我们为每个 `subnet` 指定一个地址。 此处提供的信息用于在可用性组的群集角色中创建客户端访问点资源。\
  \ 您可能会注意到，我们为侦听器指定了端口 `1433`，尽管我们的实例也在端口 `1433` 上运行。 这是一个有效的配置，因为侦听器配置在与 `SQL Server`\
  \ 实例不同的 `IP address` 上。 使用相同的端口号并非强制要求，但在现有实例上实施 `AlwaysOn Availability Groups`\
  \ 时可能有益，因为指定连接端口号的应用程序可能需要更少的应用程序更改。 请记住，服务器名称仍会不同，因为应用程序将连接到侦听器的虚拟名称，而不是物理服务器\\\
  \\实例的名称。 在我们的示例中，应用程序连接到 `HR` 而不是 `CLUSTERNODE1\\\\PROD`。 尽管通过 `CLUSTERNODE1` 的连接仍然允许，但它们无法受益于高可用性或扩展我们的报告。\n\
  ![图 5-7 ¶ 侦听器选项卡](img/394392_3_En_5_Fig7_HTML.jpg)\n图 5-7 ¶ 侦听器选项卡\n\n### 提示\n`subnet`\
  \ 是包含来自更大网络的 `IP Addresses` 分区的网络段。\n由于我们的 `HR Availability Group` 不跨越多个子网，因此我们的\
  \ `Listener` 只有一个 `IP Address`。\n\n### 提示\n如果您在组织单位（`OU`）中没有 `Create Computer Objects`\
  \ 权限，则侦听器的 `VCO`（虚拟计算机对象）必须存在于 `AD` 中，并且您必须被分配该对象的完全控制权限。\n\n### 提示\n由于 `HR Availability\
  \ Group` 不会配置为可读辅助副本，因此我们无需配置 `Read-Only Routing` 选项卡；然而，我们将在本章的“使用新的可用性组对话框”部分探讨只读路由。\n\
  \n## 选择初始数据同步\n在 `Select Initial Data Synchronization` 屏幕上，如图 5-8 所示，我们选择副本的初始数据同步如何执行。\
  \ 如果选择 `Full`，则参与可用性组的每个数据库都会进行完整备份，然后进行日志备份。 备份文件在恢复到辅助服务器之前会备份到您指定的共享中。 共享路径可以使用\
  \ `Windows` 或 `Linux` 格式指定，具体取决于您的要求。 恢复完成后，通过日志流进行数据同步。\n![图 5-8 ¶ 选择数据同步页面](img/394392_3_En_5_Fig8_HTML.jpg)\n\
  图 5-8 ¶ 选择数据同步页面\n\n如果您已备份数据库并将其恢复到辅助服务器上，则可以选择 `Join Only` 选项。 这会通过日志流启动可用性组内数据库的数据同步。\
  \ 选择 `Skip Initial Data Synchronization` 允许您在完成设置后自行备份和恢复数据库。\n\n\n\n\n如果您选择 `Automatic\
  \ Seeding` 选项，则会在每个 `Replica` 上最初创建空数据库。然后数据会使用 `VDI` (`Virtual Device Interface`)\
  \ 通过日志流传输进行播种。此选项比使用备份初始化慢，但可避免在共享之间传输大型备份文件。\n\n**Tip**\n如果您的 `availability group`\
  \ 将包含许多数据库，则最好自行执行备份/还原。这是因为内置实用程序将按顺序执行操作，因此可能需要很长时间才能完成。\n\n在 `Validation page`\
  \ 上，会检查可能导致设置失败的规则。如果任何结果返回为 `Failed`，则需要在继续尝试之前先解决它们。\n\n**Tip**\n在验证过程中，当您使用命名实例时，会发现一个常见的陷阱。`availability\
  \ groups` 的要求是数据库必须位于所有副本上的同一文件路径中。然而，`SQL Server` 数据文件的默认文件位置包含实例的名称。对于默认实例而言，这无关紧要，因为文件路径中的实例名称始终为\
  \ `MSSQLSERVER`。对于命名实例，请确保数据库文件存储在所有服务器上都存在的文件路径中。\n\n完成验证测试并转到 `Summary page` 后，我们会看到在设置期间要执行的任务列表。\n\
  \n随着设置的进行，每个配置任务的结果会显示在 `Results page` 上。如果此页面出现任何错误，请务必调查它们，但这并不一定意味着整个 `availability\
  \ group` 需要重新配置。例如，如果由于 `VCO` 未在 `AD` 中呈现而导致 `availability group listener` 的创建失败，则可以重新创建侦听器，而无需重新创建整个\
  \ `availability group`。\n\n作为使用 `New Availability Group wizard` 的替代方案，您可以使用 `New\
  \ Availability Group dialog box`，然后使用 `Add Listener dialog box` 来执行 `availability\
  \ group` 的配置。创建 `availability group` 的这种方法将在下一节中进行探讨。\n\n## 使用新建可用性组对话框\n\n现在我们已成功创建了第一个\
  \ `availability group`，让我们为 `Sales` 创建第二个 `availability group`。此 `availability group`\
  \ 将包含 `Sales` 和 `Customer` 数据库。这次，我们使用 `New Availability Group` 和 `Add Listener`\
  \ 对话框。我们通过备份这两个数据库开始此过程。就像创建 `HR` `availability group` 时一样，在执行备份之前数据库不可选择。然而，与使用向导时不同，我们无法使\
  \ `SQL Server` 使用备份/还原选项执行初始数据库同步。因此，我们必须将数据库备份到先前演示中创建的共享中，然后将备份以及事务日志备份还原到辅助实例，或者使用\
  \ `Automatic Seeding`。在本示例中，我们将使用 `Automatic Seeding`，因此无需预先将数据库还原到辅助 `Replicas`。`Listing\
  \ 5-4` 中的脚本将执行数据库的完整备份。\n\n**Tip**\n要使 `Automatic Seeding` 正常工作，必须在辅助服务器上授予 `Availability\
  \ Group` `CREATE ANY DATABASE` 权限。\n\n```\n--Back Up Sales Database\nBACKUP DATABASE\
  \ Sales TO DISK = N'C:\\\\Backups\\\\Sales.bak' WITH NAME = N'Sales-Full Database\
  \ Backup';\nGO\n--Back Up Customers Database\nBACKUP DATABASE Customers TO DISK\
  \ = N'C:\\\\Backups\\\\Customers.bak' WITH NAME = N'Customers-Full Database Backup';\n\
  GO\n```\n`Listing 5-4`\n备份和还原数据库\n\n如果我们尚未创建 `availability group`，那么下一步工作将是创建 `TCP`\
  \ 端点，以便实例可以通信。然后我们需要在每个实例上为服务帐户创建登录名并授予其在端点上的连接权限。然而，由于每个实例只能有一个数据库镜像端点，因此我们无需创建新的端点，并且显然也没有理由授予服务帐户额外的权限。因此，我们继续创建\
  \ `availability group`。为此，我们在 `Object Explorer` 中通过 `AlwaysOn High Availability`\
  \ 钻取，然后从 `availability groups` 的上下文菜单中选择 `New Availability Group`。\n\n这将导致 `New\
  \ Availability Group dialog box` 的 `General tab` 显示，如 `Figure 5-9` 所示。在此屏幕上，我们在第一个字段中输入\
  \ `availability group` 的名称。然后，我们在 `Availability Databases` 窗口下单击 Add 按钮，然后输入我们希望添加到组的数据库名称。然后我们需要在\
  \ `Availability Replicas` 窗口下单击 Add 按钮，然后在新行中输入辅助副本的 `server\\\\instance name`。然而，我们已将\
  \ `Required Synchronized Secondaries to Commit` 设置为 `1`。此设置是在 `SQL Server 2017`\
  \ 中引入的，保证在主副本提交每个事务之前，指定数量的辅助副本会将事务数据写入日志。在我们的场景中，我们只有一个同步辅助副本，因此在 `Primary Replica`\
  \ 发生故障时，故障转移将自动发生，但 `Secondary Replica` 不会在原始 `Primary Replica` 重新上线之前允许将用户事务写入数据库。这绝对保证在任何情况下都不会发生数据丢失。如果我们将此设置保留为\
  \ `0`（正如本章第一个示例中所做的那样），那么在 `Primary Replica` 失败且用户在该 `Replica` 也失败之前将事务写入 `Secondary\
  \ Replica` 的情况下，就可能发生数据丢失，因为其他 `Replicas` 配置为 `asynchronous commit` 模式。\n\n`Figure\
  \ 5-9 ¶ The New Availability Group Dialog Box`\n\n现在我们可以开始设置副本属性。我们在创建 `HR` `availability\
  \ group` 时讨论了 `Role`、`Availability Mode`、`Failover Mode`、`Readable Secondary` 和\
  \ `Endpoint URL` 属性。`Connection in Primary Role` 属性定义了如果副本处于主角色时可以建立到该副本的连接。您可以将其配置为\
  \ `Allow All Connections` 或 `Allow Read/Write connections`。当指定 `Read/Write` 时，使用连接字符串中的\
  \ `Application Intent = Read only` 参数的应用程序将无法连接到副本。\n\n`Session Timeout` 属性设置副本在进入\
  \ `DISCONNECTED` 状态并会话结束之前可以多久不接收彼此的 ping。虽然可以将此值设置为低至 `5` 秒，但通常最好将设置保持在 `60` 秒；否则，您可能会遇到误报，导致不必要的故障转移。如果副本超时，则需要重新同步，因为主服务器上的事务将不再等待辅助服务器，即使辅助服务器以\
  \ `Synchronous Commit` 模式运行也是如此。\n\n在对话框的 `Backup Preferences tab` 上，我们定义用于自动备份作业的首选副本，如\
  \ `Figure 5-10` 所示。就像使用向导时一样，我们可以指定 `Primary`，也可以选择强制或偏好在辅助副本上执行备份。我们还可以为每个副本配置\
  \ `0` 到 `100` 之间的权重，并使用 `Exclude Replica` 复选框避免在特定节点上执行备份。\n\n`Figure 5-10 ¶ The\
  \ Backup Preferences Tab`\n\n\n\n## 仅读路由\n\n在 `Read-Only Routing tab` 上，如 Figure\
  \ 5-11 所示，我们将 `CLUSTERNODE4\\READSCALE` 实例配置为可读的次要副本。发送到 `listener` 的只读请求将被重定向到此实例，而不是发送到\
  \ `primary replica`，后者将驻留在其他三个实例之一上。此配置的第一步是为可读次要副本添加 `Read-Only Routing URL`。这与我们为每个节点配置的\
  \ `Endpoint URL` 类似，不同之处在于它将处理只读请求。`Read-Only URL` 可以是 `IP address` 或 `FQDN`，并且必须包含实例正在监听的\
  \ `port`。这意味着在执行此配置之前，您必须确保实例正在静态 `port` 上监听。![图 5-11 ¶ 仅读路由选项卡 – 配置仅读路由 URL](img/394392_3_En_5_Fig11_HTML.jpg)\n\
  \n图 5-11 ¶ 仅读路由选项卡 – 配置仅读路由 URL\n\n一旦 `Read-Only routing URL` 已添加到您计划配置的每个可读次要副本中，可读次要副本将出现在选项卡下半部分的\
  \ `Available Replicas` 窗口中。您现在可以为希望能够路由到可读次要副本的每个副本选择 `Read-Only Routing List` 单元格，并单击选项卡下半部分的\
  \ `Add` 按钮，以将其添加到 `Read-Only Routing List` 中，如 Figure 5-12 所示。![图 5-12 ¶ 仅读路由选项卡\
  \ – 配置仅读路由列表](img/394392_3_En_5_Fig12_HTML.jpg)\n\n图 5-12 ¶ 仅读路由选项卡 – 配置仅读路由列表\n\
  \n此示例显示了一个简单的配置，其中所有节点（在托管 `primary replica` 时）都可以将读请求卸载到单个可读次要副本。但是更复杂的排列也是可能的。例如，您可以配置每个节点路由到单独的可读次要副本。如果您的可用性组分布在多个站点中，并且您希望确保每个节点将只读请求路由到同一站点的副本中，这将非常有用，从而提高读扩展的冗余性。\n\
  \n另外，您可以允许每个节点将只读请求路由到多个可读次要副本。在此场景中，您有两个选项。默认实现将始终将读请求发送到第一个可用的副本，因此您只是为可读次要副本添加了冗余。如果这是意图，则路由列表中的每个可读次要副本将用逗号分隔。更高级的实现是配置可读次要副本以进行只读请求的负载均衡。在此场景中，只读请求将使用轮询方式在负载均衡的集合中进行路由。负载均衡集合内的节点将用逗号分隔，集合用括号括起来。\n\
  \n您还可以在同一路由列表中配置多个负载均衡集合。在这里，请求将轮询第一个负载均衡集合，除非该集合中的节点变得不可用，在这种情况下，请求将轮询下一个集合。\n\n\
  例如，假设您希望只读请求在 `ServerA` 和 `ServerB` 之间进行负载均衡，但如果这些服务器变得不可用，您希望请求在 `ServerC` 和 `ServerD`\
  \ 之间进行负载均衡。您的只读路由列表将采用以下形式：`((ServerA,ServerB),(ServerC,ServerD))`。\n\n一旦我们创建了可用性组，我们需要创建可用性组侦听器。为此，我们从\
  \ `Sales Availability Group` 的上下文菜单中选择 `New Listener`，它现在应该在 `Object Explorer` 中可见。这会调用\
  \ `New Availability Group Listener dialog box`，可在 Figure 5-13 中看到。![图 5-13 ¶ 新建可用性组侦听器对话框](img/394392_3_En_5_Fig13_HTML.jpg)\n\
  \n图 5-13 ¶ 新建可用性组侦听器对话框\n\n在此对话框中，我们首先输入侦听器的 `virtual name`。然后我们定义它将监听的 `port` 和将分配给它的\
  \ `IP address`。\n\n### 提示\n\n我们能够为两个侦听器以及 SQL Server 实例使用相同的 `port`，因为所有三个都使用不同的\
  \ `IP addresses`。\n\n## 使用 T-SQL\n\n现在我们已使用 `SSMS` 中的 GUI 方法创建了可用性组，让我们看看如何使用 T-SQL\
  \ 创建可用性组。在本节中，我们将创建一个名为 `Accounts` 的可用性组，它将为 `Accounts` 数据库提供 HA 和 DR。如往常一样，我们需要做的第一件事是对数据库进行完整备份。我们可以使用\
  \ Listing 5-5 中的脚本来实现。\n\n```\nBACKUP DATABASE HR TO DISK = N'C:\\\\Backups\\\\\
  HR.bak' WITH NAME = N'HR-Full Database Backup' ;\nGO\n```\n\nListing 5-5\n\n备份 `Accounts`\
  \ 数据库\n\n要创建可用性组，我们将使用 `CREATE AVAILABILITY GROUP` T-SQL 命令。此命令支持的 `WITH` 选项在 Table\
  \ 5-1 中详细说明。\n\nTable 5-1\n\n`CREATE AVAILABILITY GROUP` with Options\n\n| 选项 |\
  \ 描述 |\n| --- | --- |\n| `AUTOMATED_BACKUP_PREFERENCE` | 指定应为备份使用哪个副本。可选选项为 `PRIMARY`，表示将始终使用主要副本；`SECONDARY_ONLY`，表示不应在主要副本上执行备份；`SECONDARY`，表示除非主要副本是唯一在线的副本，否则不应在主要副本上获取备份；以及\
  \ `NONE`，表示在选择要从中获取备份的副本时，将忽略每个副本的角色。 |\n| `FAILURE_CONDITION_LEVEL` | 指定应导致可用性组自动故障转移的事件。可接受的级别为\
  \ 1–5*。 |\n| `HEALTH_CHECK_TIMEOUT` | 以毫秒为单位指定，集群在假设节点无响应并进行故障转移之前，将等待健康检查过程响应的持续时间。\
  \ |\n| `DB_FAILOVER` | 当可用性组具有多个数据库时，确定可用性组中单个数据库移出 ONLINE 状态是否会触发故障转移。 |\n| `DTC_SUPPORT`\
  \ | 指定是否使用 DTC（分布式事务协调器）在可用性组内支持跨数据库事务。可接受的值为 `PER_DB` 或 `NONE`。 |\n| `BASIC` |\
  \ 用于创建基本可用性组。基本可用性组在第 7 章中讨论。 |\n| `DISTRIBUTED` | 用于创建分布式可用性组。这在第 7 章中讨论。 |\n|\
  \ `REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT` | 可用于通过在继续之前强制在次要副本上提交来确保零 RPO。0\
  \ 表示事务将被标记为 NOT SYNCHRONIZED，但副本将继续处理事务。 |\n| `CLUSTER_TYPE` | 指定可用性组所在的集群类型。可能的值为\
  \ `WSFC`，表示 Windows 故障转移集群；`EXTERNAL`，表示非 Windows 集群，例如 Linux Pacemaker；或 `NONE`，表示无集群可用性组。\
  \ |\n\n*请参阅表 *5-2* 了解每个故障级别的详细信息*。\n\nTable 5-2 详细说明了根据指定的故障条件级别将触发自动故障转移的事件。\n\n\
  Table 5-2\n\n故障条件级别\n\n| 级别 | 触发故障转移的事件 |\n| --- | --- |\n| 1 | • SQL Server 服务已停止。•\
  \ SQL Server 实例在集群中的租约已过期，因为未收到确认。 |\n| --- | --- |\n\n\n\n## 严重程度级别\n\n| 级别 | 描述\
  \ |\n|---|---|\n| 2 | • 任何级别 1 条件。 • SQL 实例未连接到集群且健康检查阈值已超出。 • 可用性副本处于 FAILED 状态。\
  \ |\n| 3 (默认) | • 任何级别 1–2 条件。 • SQL Server 实例内部出现关键错误。 |\n| 4 | • 任何级别 1–3 条件。\
  \ • SQL Server 实例内部出现中等错误。 |\n| 5 | • 任何级别 1–4 条件。 • SQL Server 实例内部出现任何故障。 |\n\n\
  当使用 `REPLICA ON` 子句添加副本时，还可以使用额外的 `WITH OPTIONS`。这些内容在表 5-3 中有详细说明。\n\n## ON REPLICA\
  \ WITH 选项\n\n表 5-3\n\n| 选项 | 描述 |\n|---|---|\n| `ENDPOINT_URL` | 主机副本的 SQL Server\
  \ 实例上端点的 URL。 |\n| `FAILOVER_MODE` | 指定副本是否应支持自动或手动故障转移。 |\n| `AVAILABILITY_MODE`\
  \ | 指定副本上的事务应同步或异步提交。可用性模式也可以设置为 `CONFIGURATION_ONLY` 模式，以支持外部集群模式。这将在第 6 章中讨论。\
  \ |\n| `SESSION_TIMEOUT` | 指定会话超时时间（以秒为单位）。 |\n| `BACKUP_PRIORITY` | 为副本提供权重，用于决定应从哪个副本获取备份。0\
  \ 表示无法从副本获取备份。 |\n| `SEEDING_MODE` | 指定副本的播种方式。可接受的值为 `AUTOMATIC` 和 `MANUAL`。 |\n\
  | `PRIMARY_ROLE` | 用于指定 `ALLOW_CONNECTIONS` 设置并传递 `READ_ONLY_ROUTING_LIST`。 |\n\
  | `SECONDARY_ROLE` | 用于指定 `ALLOW_CONNECTIONS` 的值并传递 `READ_ONLY_ROUTING_URL`。 |\n\
  \n因此，清单 5-6 中的脚本将创建 `Accounts` 可用性组。请注意，我们选择手动播种副本。\n\n### Listing 5-6 创建 Accounts\
  \ 可用性组\n```sql\nCREATE AVAILABILITY GROUP Accounts WITH (\n      AUTOMATED_BACKUP_PREFERENCE\
  \ = PRIMARY,\n      DB_FAILOVER = OFF,\n      DTC_SUPPORT = NONE,\n      REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT\
  \ = 0\n) FOR REPLICA ON\n      'CLUSTERNODE1\\PROD' WITH (\n            ENDPOINT_URL\
  \ = N'TCP://CLUSTERNODE1.AlwaysOn.com:5022',\n            FAILOVER_MODE = AUTOMATIC,\n\
  \            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n            SESSION_TIMEOUT\
  \ = 10,\n            BACKUP_PRIORITY = 50,\n            SEEDING_MODE = MANUAL,\n\
  \            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n            SECONDARY_ROLE(ALLOW_CONNECTIONS\
  \ = NO)\n      ),\n      'CLUSTERNODE2\\SYNCHA' WITH (\n            ENDPOINT_URL\
  \ = N'TCP://CLUSTERNODE2.AlwaysOn.com:5022',\n            FAILOVER_MODE = AUTOMATIC,\n\
  \            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n            SESSION_TIMEOUT\
  \ = 10,\n            BACKUP_PRIORITY = 50,\n            SEEDING_MODE = MANUAL,\n\
  \            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n            SECONDARY_ROLE(ALLOW_CONNECTIONS\
  \ = NO)\n      ),\n      'CLUSTERNODE3\\ASYNCDR' WITH (\n            ENDPOINT_URL\
  \ = N'TCP://CLUSTERNODE3.AlwaysOn.com:5022',\n            FAILOVER_MODE = MANUAL,\n\
  \            AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n            SESSION_TIMEOUT\
  \ = 10,\n            BACKUP_PRIORITY = 50,\n            SEEDING_MODE = MANUAL,\n\
  \            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n            SECONDARY_ROLE(ALLOW_CONNECTIONS\
  \ = NO)\n      );\nGO\n```\n\n现在我们已经创建了 `Accounts` 可用性组，我们需要创建一个可用性组侦听器，以便集群知道将请求定向到何处。我们将使用带有\
  \ `ADD LISTENER` 子句的 `ALTER AVAILABILITY GROUP` 命令来完成此操作。`ADD LISTENER` 子句的 `WITH`\
  \ 选项在表 5-4 中指定。\n\n## ADD LISTENER WITH 选项\n\n表 5-4\n\n| 选项 | 描述 |\n|---|---|\n\
  | `IP` | 指定侦听器将监听的 IP 地址（们），以及与每个 IP 地址相关的网络的子网掩码 |\n| `PORT` | 侦听器将监听的端口 |\n\n\
  因为我们的 `CLUSTERNODE3\\ASYNCDR` 实例与 `CLUSTERNODE1\\PROD` 和 `CLUSTERNODE2\\SYNCHA`\
  \ 位于不同的子网中，所以我们需要指定两个 IP 地址，每个子网一个。因此，清单 5-7 中的脚本将为 `Accounts` 可用性组创建可用性组侦听器。\n\n\
  ### Listing 5-7 创建可用性组侦听器\n```sql\nALTER AVAILABILITY GROUP Accounts\n      ADD\
  \ LISTENER 'Accounts' (\n            WITH IP\n                  (\n            \
  \            (N'10.0.0.8', N'255.255.255.0'),\n                        (N'10.0.1.8',\
  \ N'255.255.255.0')\n                  ),\n            PORT=1433\n      );\nGO\n\
  ```\n\n## 使用 PowerShell 实现可用性组\n\n正如您所料，Microsoft 提供了 PowerShell cmdlet，可用于创建和管理\
  \ SQL Server 可用性组和可用性组侦听器。随着世界向 DevOps 文化转变，PowerShell 成为许多希望实现构建自动化的组织的首选语言，这一点变得越来越重要。\n\
  \n`sqlserver` PowerShell 模块随 SQL Server Management Studio 一起安装，但也可以通过清单 5-8 中的命令进行安装。\n\
  \n### Listing 5-8 安装 sqlserver PowerShell 模块\n```powershell\nInstall-Module sqlserver\n\
  ```\n\n注意\n如果这是您在服务器上首次安装 PowerShell 模块，则会提示您安装 NuGet 提供程序。\n\n安装 `sqlserver` 模块后，您将可以使用\
  \ cmdlet 通过 PowerShell 创建和管理可用性组。`New-AvailabilityReplica` cmdlet 允许您创建指定每个副本属性的对象。然后可以将这些对象传递给\
  \ `New-SqlAvailabilityGroup` cmdlet，后者将创建可用性组。\n\n例如，假设我们想要创建一个名为 `Foo` 的可用性组，其中包含\
  \ `Foo` 数据库，`CLUSTERNODE1\\PROD` 主机初始主副本，`CLUSTERNODE2\\SYNCHA` 主机辅助副本以实现高可用性。我们可以使用清单\
  \ 5-9 中的脚本来实现这一点。\n\n### Listing 5-9 创建 Foo 可用性组\n```powershell\n#Create connection\
  \ to CLSUETERNODE1\\PROD\n$PrimaryServer = Get-Item \"SQLSERVER:\\\\SQL\\\\CLUSTERNODE1\\\
  \\PROD\" -Verbose\n#Create connection to CLUSTERNODE2\\SYNCHA\n$SecondaryServer\
  \ = Get-Item \"SQLSERVER:\\\\SQL\\\\CLUSTERNODE2\\\\SYNCHA\"\n#Set the properties\
  \ of the primary Replica\n$PrimaryReplicaOptions = @{\n    Name             = \"\
  CLUSTERNODE1\\PROD\"\n    EndpointUrl      = \"TCP://CLUSTERNODE1.ALWAYSON.COM:5022\"\
  \n    FailoverMode     = \"Automatic\"\n    AvailabilityMode = \"SynchronousCommit\"\
  \n    Version          = ($PrimaryServer.Version)\n}\n#Create the primary Replica\
  \ Object\n$PrimaryReplica = New-SqlAvailabilityReplica @PrimaryReplicaOptions  -AsTemplate\n\
  #Set the properties of the secondary Replica\n$SecondaryReplicaOptions = @{\n  \
  \  Name             = \"CLUSTERNODE2\\SYNCHA\"\n    EndpointUrl      = \"TCP://CLUSTERNODE2.ALWAYSON.COM:5022\"\
  \n    FailoverMode     = \"Automatic\"\n    AvailabilityMode = \"SynchronousCommit\"\
  \n    Version          = ($SecondaryServer.Version)\n}\n#Create the secondary replica\
  \ object\n$SecondaryReplica = New-SqlAvailabilityReplica @SecondaryReplicaOption\
  \ -AsTemplate\n$AvailabilityGroupOptions = @{\n    InputObject         = $PrimaryServer\n\
  \    Name =              = \"Foo\"\n    AvailabilityReplica = ($PrimaryReplica,\
  \ $SecondaryReplica)\n    Database            = @(\"Foo\")\n}\nNew-SqlAvailabilityGroup\
  \ @AvailabilityGroupOptions\n```\n\n\n\n然后我们可以使用 `New-SqlAvailabilityGroupListener`\
  \ cmdlet 创建一个可用性组侦听器。这在列表 5-10 中进行了演示。\n\n```powershell\n#Specify the options for\
  \ the Listener\n$ListenerOptions = @{\n    Name = \"Foo\"\n    StaticIp = \"10.0.0.14/255.255.255.0\"\
  \n    Path = \"SQLSERVER:\\\\Sql\\\\CLUSTERNODE1\\\\PROD\\\\AvailabilityGroups\\\
  \\Foo\"\n}\n#Create the Listener\nNew-SqlAvailabilityGroupListener @ListenerOptions\n\
  ```\n\n列表 5-10\n\n创建可用性组侦听器\n\n## 摘要\nAlwaysOn 可用性组最多可使用八个辅助副本实现，结合同步和异步提交模式。在使用可用性组实现高可用性时，您始终使用同步提交模式，因为异步提交模式不支持自动故障转移。然而，在实施同步提交模式时，您必须意识到相关的性能损失，因为在主副本上提交之前，事务必须先在辅助副本上提交。对于灾难恢复，您通常会选择实施异步提交模式。\n\
  \n可用性组可以通过新建可用性组向导、通过对话框、通过 `T-SQL` 或甚至通过 `PowerShell` 创建。如果您使用对话框创建可用性组，则某些方面，例如端点和相关权限，必须使用\
  \ `T-SQL` 或 `PowerShell` 进行脚本编写。\n\n如果您使用可用性组实施灾难恢复，则需要配置多子网集群。这并不意味着您必须在站点之间具有\
  \ SAN 复制，因为可用性组不依赖于共享存储。您需要做的是为管理集群访问点以及可用性组侦听器添加额外的 IP 地址。您还需要关注支持客户端重连的集群属性，以确保客户端不会出现大量超时。\n\
  \n© Peter A. Carter 2020 P. A. CarterSQL Server 2019 AlwaysOn[`doi.org/10.1007/978-1-4842-6479-9\\\
  _6`](https://doi.org/10.1007/978-1-4842-6479-9_6) 开始摘要\n"
- "# 6. 在 Linux 上实施 AlwaysOn 可用性组\n\nPeter A. Carter^(1 ) (1) Botley, UK 结束摘要\n\n\
  自 SQL Server 2017 以来，可以在 Linux 以及 Windows 上安装 SQL Server。AlwaysOn 可用性组可以在 Linux\
  \ 上进行配置，具有与实例托管在 Windows 上时的大部分相同功能。SQL Server 在 Linux 上的安装和配置超出了本书的范围，但完整细节可以在\
  \ Apress 出版的 *Pro SQL Server 2019 管理* 中找到，可在 [www.apress.com/gb/book/9781484250884#otherversion=9781484250891](http://www.apress.com/gb/book/9781484250884%2523otherversion%253D9781484250891)\
  \ 找到。\n\n本章重点介绍在 Linux 上配置可用性组，以提供高可用性 (HA)。我们将首先简要概述实施 pacemaker 集群所涉及的技术（Pacemaker\
  \ 是一种基于 Linux 的集群技术），然后配置具有自动故障转移的双节点可用性组。\n\n### 注\n在本章的演示中，我们将使用三台服务器，即 LinuxProd、LinuxSyncHA\
  \ 和 LinuxConfig。每台服务器上都安装了默认实例的 SQL Server 2019。服务器使用 Ubuntu 18.04 操作系统构建，并且未加入域。\n\
  \n在本章中，我们将执行以下活动：\n* 创建 Sales 数据库。\n* 在我们的实例上启用可用性组并准备实例以支持可用性组。\n* 为 Sales 数据库创建可用性组。\n\
  * 创建集群。\n* 配置集群。\n\n## Linux 集群技术\n以下各节将提供用于在 Linux 上配置集群的技术的高级概述。在开始之前，了解以下内容很重要：与在\
  \ Windows 集群上构建可用性组不同，在 Linux pacemaker 集群上构建可用性组时，可用性组与集群的集成程度不如 Windows。特别是，可用性组不知道集群的状态，甚至不知道集群的存在。因此，故障转移操作必须在集群级别执行。此外，虽然仍然可以创建侦听器，但功能有限。您需要手动在\
  \ DNS 中注册侦听器的名称，并且不支持只读路由。\n\n### Pcs\n当您安装 `pcs` 时，该包也会安装 Pacemaker 和 Corosync。然而，`pcs`\
  \ 组件本身是一个命令行实用程序，用于管理 Pacemaker 集群。\n\n### Pacemaker\nPacemaker 是集群的核心。它负责管理集群维护事件，例如节点添加和删除。它还负责管理集群事件并在节点上移动资源，以确保在节点上发生故障后资源仍然可用。\n\
  \nPacemaker 支持所有标准集群配置，包括 active/active、active/passive、N+1 和 N+M。对高级 Pacemaker 配置的讨论超出了本书的范围；然而，进一步的细节可以在\
  \ Apress 出版的 *Pro Linux 高可用性集群* 中找到，可在 [www.apress.com/gp/book/9781484200803](http://www.apress.com/gp/book/9781484200803)\
  \ 找到。\n\n### Corosync\nCorosync 为集群提供消息层。它通过在节点之间发送消息来实现仲裁系统以检查健康状态，并在仲裁丢失时通知 Pacemaker。\n\
  \n### STONITH\n受支持的 Pacemaker 集群配置必须使用 fencing，这有助于在节点或资源状态未知时将集群带到已知良好状态。有两种类型的\
  \ fencing：资源 fencing 和节点 fencing。资源 fencing 用于防止资源在节点上启动。这可以避免在配置资源期间发生中断时数据损坏。节点\
  \ fencing 防止节点运行任何资源。如果节点无响应，通常需要此操作。节点 fencing 需要 fencing 设备和 fencing 代理。fencing\
  \ 设备可能是不间断电源、电源分配单元或管理接口，例如灯光外设备或刀片电源控制设备。与这些设备交互的代理是 STONITH（shoot the other node\
  \ in the head）。由于 STONITH 的实现非常特定于您使用的 fencing 设备，我们在本章中不会配置它。对于开发或测试目的来说这是可以的，但生产集群应始终配置\
  \ STONITH。\n\n## 准备实施 AlwaysOn 可用性组\n在创建可用性组之前，需要执行几个先决条件任务。也就是说，我们在 SQL Server\
  \ 实例上启用可用性组并创建和备份我们想要实现高可用的数据库，并且由于 Linux 服务器无法相互进行身份验证，我们需要创建可用于身份验证的证书。以下各节演示如何执行这些任务。\n\
  \n### 启用可用性组\n正如在 Windows 环境中所需的那样，在 Linux 上配置可用性组的第一个步骤是在服务级别启用该功能。列表 6-1 中的脚本演示了如何启用可用性组然后重新启动服务。此脚本需要在将托管副本的每台服务器上执行。\n\
  \n### 提示\n`sudo` 用于在运行命令时提升您的权限。\n\n```bash\nsudo /opt/mssql/bin/mssql-conf set\
  \ hadr.hadrenabled 1\nsudo systemctl restart mssql-server\n```\n\n列表 6-1\n\n启用可用性组\n\
  \n### 创建 Sales 数据库\n\n\n\n下一步是创建我们希望实现高可用的数据库，并备份该数据库以用于初始化辅助副本。这可以通过清单 6-2 中的脚本实现。\n\
  \n## 创建 Sales 数据库\n\n```\n--Create Sales Database\nCREATE DATABASE Sales;\nGO\n\
  USE Sales;\nGO\nCREATE TABLE [dbo].Orders NOT NULL PRIMARY KEY CLUSTERED,\n    [OrderDate]\
  \ [date] NOT NULL,\n    [CustomerID] [int] NOT NULL,\n    [ProductID] [int] NOT\
  \ NULL,\n    [Quantity] [int] NOT NULL,\n    [NetAmount] [money] NOT NULL,\n   \
  \ [TaxAmount] [money] NOT NULL,\n    [InvoiceAddressID] [int] NOT NULL,\n    [DeliveryAddressID]\
  \ [int] NOT NULL,\n    [DeliveryDate] [date] NULL\n);\nDECLARE @Numbers TABLE (\n\
  \    Number INT\n);\n--Populate ExistingOrders with data\nWITH CTE(Number) AS (\n\
  \    SELECT 1 Number\n    UNION ALL\n    SELECT Number + 1\n    FROM CTE\n    WHERE\
  \ Number < 100\n)\nINSERT INTO @Numbers SELECT Number FROM CTE\nINSERT INTO Orders\n\
  SELECT\n    (SELECT CAST(DATEADD(dd,(SELECT TOP 1 Number FROM @Numbers ORDER BY\
  \ NEWID()),getdate()) as DATE)),\n    (SELECT TOP 1 Number -10 FROM @Numbers ORDER\
  \ BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    (SELECT\
  \ TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    500,\n    100,\n    (SELECT\
  \ TOP 1 Number FROM @Numbers ORDER BY NEWID()),\n    (SELECT TOP 1 Number FROM @Numbers\
  \ ORDER BY NEWID()),\n    (SELECT CAST(DATEADD(dd,(SELECT TOP 1 Number - 10 FROM\
  \ @Numbers ORDER BY NEWID()),getdate()) as DATE))\nFROM @Numbers a CROSS JOIN @Numbers\
  \ b;\n--SET FULL recovery mode on the database - required for Availability Groups\n\
  ALTER DATABASE Sales SET RECOVERY FULL;\nGO\n--Backup the Sales Database\nBACKUP\
  \ DATABASE Sales TO DISK = N'/var/opt/mssql/data/Sales.bak' WITH NAME = N'Sales-Full\
  \ Database Backup';\nGO\n```\n\n清单 6-2\n\n创建 Sales 数据库\n\n### 创建证书\n\n由于我们的 Linux\
  \ 服务器不属于域，无法使用 AD 身份验证相互认证，下一步是创建证书，可用于实例身份验证。你可以通过连接到主服务器并运行清单 6-3 中的脚本来创建证书。该脚本在\
  \ SQL Server 实例中创建证书，然后将其备份到操作系统，以便我们可以将其复制到辅助服务器。请记住，你可以通过使用 `sqlcmd` 连接到在 Linux\
  \ 上运行的 SQL Server 实例，或从安装在基于 Windows 的机器上的 `SSMS` 连接。\n\n```\nUSE Master\nGO\nCREATE\
  \ MASTER KEY ENCRYPTION BY PASSWORD = 'Pa$$w0rd';\nGO\nCREATE CERTIFICATE aoag_certificate\
  \ WITH SUBJECT = 'AvailabilityGroups';\nGO\nBACKUP CERTIFICATE aoag_certificate\n\
  \    TO FILE = '/var/opt/mssql/data/aoag_certificate.cer'\n    WITH PRIVATE KEY\
  \ (\n        FILE = '/var/opt/mssql/data/aoag_certificate.pvk',\n        ENCRYPTION\
  \ BY PASSWORD = 'Pa$$w0rd'\n    );\nGO\n```\n\n清单 6-3\n\n创建证书\n\n### 授予权限\n\n我们现在需要将密钥复制到辅助服务器。为此，首先需要授予用户对\
  \ `/var/opt/mssql/data` 文件夹的权限。我们可以使用清单 6-4 中的命令来实现，该命令需要在将参与可用性组的服务器上运行。\n\n```\n\
  sudo chmod -R 777 /var/opt/mssql\n```\n\n清单 6-4\n\n授予权限\n\n### 复制密钥\n\n如果在主服务器上运行清单\
  \ 6-5 中的命令，将使用 `scp`，一种远程文件复制程序，将证书的公钥和私钥复制到辅助服务器。要使此命令正常工作，每个服务器上都应安装并配置 SSH。SSH\
  \ 可提供对另一台机器的安全访问，但完整的讨论超出了本书的范围。不过，可以在 `http://ubuntuhandbook.org/index.php/2014/09/enable-ssh-in-ubuntu-14-10-server-desktop/`\
  \ 找到指南。\n\n提示\n\n你应更改用户名和服务器名称以匹配自己的配置。\n\n```\nscp /var/opt/mssql/data/aoag_certificate.*\
  \ pete@linuxsyncha:/var/opt/mssql/data\nscp /var/opt/mssql/data/aoag_certificate.*\
  \ pete@linuxconfig:/var/opt/mssql/data\n```\n\n清单 6-5\n\n复制密钥\n\n提示\n\n如果未配置名称服务器，则需要指定\
  \ IP 地址，而不是服务器名称。\n\n### 在辅助服务器上创建证书\n\n我们现在需要通过从文件系统导入证书和密钥在辅助服务器上创建证书。这可以使用清单\
  \ 6-6 中的脚本实现。\n\n```\nCREATE MASTER KEY ENCRYPTION BY PASSWORD = 'Pa$$w0rd';\nGO\n\
  CREATE CERTIFICATE aoag_certificate\n    FROM FILE = '/var/opt/mssql/data/aoag_certificate.cer'\n\
  \    WITH PRIVATE KEY (\n        FILE = '/var/opt/mssql/data/aoag_certificate.pvk',\n\
  \        DECRYPTION BY PASSWORD = 'Pa$$w0rd'\n    );\nGO\n```\n\n清单 6-6\n\n在辅助服务器上创建证书\n\
  \n## 配置可用性组\n\n现在证书已就位，我们需要创建将用于连接的端点。清单 6-7 中的脚本将创建一个名为 `AOAG_Endpoint` 的端点，该端点侦听端口\
  \ `5022` 并使用我们的证书进行身份验证。此脚本应在将参与可用性组的所有实例上运行。\n\n### 创建端点\n\n```\nCREATE ENDPOINT\
  \ AOAG_Endpoint STATE = STARTED AS TCP (LISTENER_PORT = 5022)\nFOR DATABASE_MIRRORING\
  \ (\n    ROLE = ALL,\n    AUTHENTICATION = CERTIFICATE aoag_certificate,\n    ENCRYPTION\
  \ = REQUIRED ALGORITHM AES\n);\n```\n\n清单 6-7\n\n创建端点\n\n现在我们已准备好创建可用性组。我们将在 `linuxprod`\
  \ 服务器上执行这些操作。我们可以在服务器上使用 `sqlcmd`，或在管理节点上使用 `SSMS` 连接到服务器，以便使用 GUI。图 6-1 说明了在管理节点上运行的新可用性组对话框的“常规”页。\n\
  \n图 6-1 ¶ 新可用性组对话框 – 通用页\n\n与我们在第 5 章中配置的可用性组相比，配置中有两个主要区别需要注意。首先，群集类型和故障转移模式设置为\
  \ `EXTERNAL`。这表明可用性组将驻留在非 Windows 故障转移群集的群集上。具体来说，它将驻留在 Pacemaker 群集上。在 Linux 上构建可用性组时，我们可以选择将群集类型设置为\
  \ `EXTERNAL` 或 `NONE`。但是，如果选择 `NONE`，则不适合高可用性。\n\n第二个需要注意的点是 `linuxconfig` 节点配置为仅配置。由于我们的可用性组不会在\
  \ Windows 故障转移群集上运行，因此故障转移需要由可用性组仲裁，而不是由群集仲裁。\n\n如果我们有三个或更多节点，则不需要仅配置节点，因为主节点的故障仍可由两个（或更多）辅助节点仲裁。然而，由于我们只有两个节点的群集，因此需要第三个节点充当见证，并在节点故障时维护法定人数。\n\
  \n\n\n## 可用性组配置\n\n仅配置节点不包含用户数据库的副本，但可用性组元数据会使用同步提交模式进行同步。仅配置节点可以使用任何版本的 `SQL Server`，包括\
  \ `SQL Server Express edition`，以避免额外成本。单个实例也可以作为多个可用性组的见证者。然而，单个可用性组永远只能有一个仅配置节点。\n\
  \n图 6-2 显示了新建可用性组对话框的备份首选项页面。在这里，我们已配置从主节点获取备份。 ![图 6-2 ¶ 新可用性组对话框 – 备份首选项选项卡](img/394392_3_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2 ¶ 新可用性组对话框 – 备份首选项选项卡\n\n由于我们仅配置高可用性，因此无需配置只读路由。关于只读路由以及本文未讨论的其他配置选项的讨论，可在第\
  \ 5 章找到。\n\n另外，我们也可以通过 T-SQL 创建可用性组，使用列表 6-8 中的脚本。\n\n```\nUSE master\nGO\nCREATE\
  \ AVAILABILITY GROUP LinuxAOAG WITH (\n      AUTOMATED_BACKUP_PREFERENCE = PRIMARY,\n\
  \      DB_FAILOVER = OFF,\n      DTC_SUPPORT = NONE,\n      CLUSTER_TYPE = EXTERNAL,\n\
  \      REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT = 0\n) FOR DATABASE Sales\nREPLICA\
  \ ON\n      'linuxconfig' WITH (\n            ENDPOINT_URL = 'TCP://linuxconfig.AlwaysOn.com:5022',\n\
  \            AVAILABILITY_MODE = CONFIGURATION_ONLY\n      ),\n      'linuxprod'\
  \ WITH (\n            ENDPOINT_URL = 'TCP://linuxprod.AlwaysOn.com:5022',\n    \
  \        FAILOVER_MODE = EXTERNAL,\n            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n\
  \            SESSION_TIMEOUT = 10,\n            BACKUP_PRIORITY = 50,\n        \
  \    SEEDING_MODE = MANUAL,\n            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n\
  \            SECONDARY_ROLE(ALLOW_CONNECTIONS = NO)\n      ),\n      'linuxsyncha'\
  \ WITH (\n            ENDPOINT_URL = 'TCP://linuxsyncha.AlwaysOn.com:5022',\n  \
  \          FAILOVER_MODE = EXTERNAL,\n            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n\
  \            SESSION_TIMEOUT = 10,\n            BACKUP_PRIORITY = 0,\n         \
  \   SEEDING_MODE = MANUAL,\n            PRIMARY_ROLE(ALLOW_CONNECTIONS = ALL),\n\
  \            SECONDARY_ROLE(ALLOW_CONNECTIONS = NO)\n      )\n;\nGO\n```\n\n列表 6-8\n\
  \n创建可用性组\n\n要手动使用备份播种 Sales 数据库，可以从主服务器运行列表 6-9 中的命令，将备份文件复制到辅助服务器。\n\n```\nScp\
  \ /var/opt/mssql/data/sales.bak pete@linuxprod:/var/opt/mssql/data\n```\n\n列表 6-9\n\
  \n复制 Sales 数据库的备份\n\n可以使用列表 6-10 中的命令还原数据库。\n\n```\nUSE master\nGO\nRESTORE DATABASE\
  \ Sales FROM DISK = '/var/opt/mssql/data/Sales.bak' WITH\n      FILE = 1,\n    \
  \  MOVE N'Sales' TO N'/var/opt/mssql/data/Sales.mdf',\n      MOVE N'Sales_log' TO\
  \ N'/var/opt/mssql/data/Sales_log.ldf',\n      NORECOVERY ;\nGO\n```\n\n列表 6-10\n\
  \n还原 Sales 数据库\n\n运行列表 6-11 中的脚本将把我们的辅助副本加入可用性组，并确保其具有适当的权限。此脚本需要在将参与可用性组的所有实例上运行。\n\
  \n```\nALTER AVAILABILITY GROUP LinuxAOAG JOIN WITH (CLUSTER_TYPE = EXTERNAL) ;\n\
  GO\nALTER AVAILABILITY GROUP LinuxAOAG GRANT CREATE ANY DATABASE ;\nGO\n```\n\n\
  列表 6-11\n\n将辅助副本加入可用性组\n\n## 配置集群\n\n在创建集群之前，我们需要在将参与可用性组的每个 SQL Server 实例中创建一个将由\
  \ Pacemaker 账户使用的登录名，并为其分配所需的权限。这可以通过使用列表 6-12 中的脚本来实现。\n\n```\nCREATE LOGIN Pacemaker\
  \ WITH PASSWORD = 'Pa$$w0rd'\nGO\nGRANT ALTER, CONTROL, VIEW DEFINITION ON AVAILABILITY\
  \ GROUP::LinuxAOAG TO Pacemaker ;\nGRANT VIEW SERVER STATE TO Pacemaker\n```\n\n\
  列表 6-12\n\n配置 Pacemaker 登录\n\n接下来，我们需要配置防火墙。集群所需的端口在表 6-1 中详细说明。\n\n表 6-1\n\n集群所需的端口\n\
  \n| 端口 || 描述 |\n| --- | --- |\n| TCP 2224 || 所有节点均需。`pcsd` Web UI 和节点间通信 |\n| ---\
  \ | --- |\n| TCP 3121 || 如果 Pacemaker 具有远程节点，则所有节点均需。用于 `crmd` 与 `pacemaker_remoted`\
  \ 守护进程之间的通信 |\n| TCP 21064 || 所有节点均需。由需要 DLM 的资源使用 |\n| UDP 5405 || 所有节点均需。由 Corosync\
  \ 使用 |\n| TCP 1433 || 所有节点均需。本章中的示例将 SQL 实例监听在 1433 上；然而，您应将其更改为与您自己的环境相匹配 |\n|\
  \ TCP 5022 || 所有节点均需。本章中的示例将 AlwaysOn 端点设在 5022 上；然而，您应将其更改为与您自己的环境相匹配 |\n\n列表 6-13\
  \ 提供了在 Ubuntu 中配置防火墙规则的示例。\n\n```\nsudo ufw allow 2224/tcp\nsudo ufw allow 3121/tcp\n\
  sudo ufw allow 21064/tcp\nsudo ufw allow 5405/udp\nsudo ufw allow 1433/tcp\nsudo\
  \ ufw allow 5022/tcp\nsudo ufw reload\n```\n\n列表 6-13\n\n配置防火墙规则\n\n接下来，我们将安装 Pacemaker\
  \ 组件。我们可以使用列表 6-14 中的命令来完成。此命令应在参与可用性组的所有服务器上运行。\n\n```\nsudo apt-get install pacemaker\
  \ pcs resource-agents\n```\n\n列表 6-14\n\n安装 Pacemaker 组件\n\n**警告**\n\n对于生产系统，请确保还安装\
  \ `fence-agents` 用于节点隔离。\n\n在安装 `pcs` 组件期间，会创建 `hacluster`。您应使用 `passwd` 命令为此用户设置密码，如列表\
  \ 6-15 所示。运行命令后，您将被提示输入并确认新密码。\n\n**注意**\n\n重要的是在每个节点上设置相同的密码。\n\n```\nSudo passwd\
  \ hacluster\n```\n\n列表 6-15\n\n设置 hacluster 密码\n\n我们现在可以使用列表 6-16 中的脚本启用 `pcsd`\
  \ 和 `pacemarker` 服务。您会注意到在启用 pacemaker 之前，我们会发出销毁任何现有集群的命令。这是因为在安装 `pcs` 时创建了名为\
  \ `/etc/cluster/corosync.conf` 的文件，然而，启用 pacemaker 会尝试创建此文件。使用 `cluster destroy`\
  \ 命令会删除此文件，以避免在启用 pacemaker 时出现失败。\n\n```\nsudo systemctl enable pcsd\nsudo systemctl\
  \ start pcsd\nsudo pcs cluster destroy\nsudo systemctl enable pacemaker\n```\n\n\
  列表 6-16\n\n启用 pcs 和 pacemarker\n\n现在 pacemaker 已启用，我们可以构建集群。此过程包括运行五个 `pcs cluster`\
  \ 命令。第一个是 `auth`。它用于将 `pcs` 身份验证到所有节点上的 `pcs` 守护进程。该命令期望一个节点列表，后跟在安装期间创建的 `pcs`\
  \ 用户的用户名和密码。列表 6-17 演示了在我们的场景中如何使用该命令。\n\n```\nsudo pcs cluster auth LinuxProd LinuxSyncHA\
  \ LinuxConfig –u hacluster\n```\n\n列表 6-17\n\n对 pcs 守护进程进行身份验证\n\n由于您运行此命令时未指定 `–p`\
  \ 参数，您将被提示输入 `hacluster` 的密码。\n\n\n\n\n### 设置集群\n第二个命令是 setup。该命令用于注册集群名称以及集群中的每个节点。集群名称使用\
  \ `--name` 参数指定，后跟节点列表。清单 6-18 说明了在我们的场景中如何使用 setup 命令。\n\n**提示**\n也可以指定 `--start`\
  \ 参数来启动集群服务，但我们将选择使用单独的命令启动集群，以帮助说明完整流程。\n\n```\nsudo pcs cluster setup --name LinuxCluster\
  \ LinuxProd LinuxSyncHA LinuxConfig\n```\n清单 6-18\n\n### 启动集群服务\n下一个命令是 start。正如您所期望的，它用于启动集群服务。该命令要么接受\
  \ `--all` 参数以在所有节点上启动服务（清单 6-19 中演示），要么接受节点列表，指定应在其中启动集群服务的节点。\n\n```\nsudo pcs\
  \ cluster start --all\n```\n清单 6-19\n\n### 检查集群状态\n运行此命令后，服务启动前可能会有延迟。因此，在继续操作之前，您应运行\
  \ status 命令以确保集群已启动，如清单 6-20 所示。\n\n```\nsudo pcs cluster status\n```\n清单 6-20\n\
  \n### 启用集群服务\n最后，我们将为每个节点配置集群服务在启动时运行。这可以通过使用 enable 命令实现，如清单 6-21 所示。该命令接受 `--all`\
  \ 参数或节点列表。\n\n```\nsudo pcs cluster enable --all\n```\n清单 6-21\n\n### 安装资源代理\n现在集群已经创建，我们可以安装\
  \ SQL Server 资源代理。这允许 Pacemaker 与可用性组松散集成。具体来说，每当发生配置更改，例如故障转移或添加新副本时，它都会在 `sys.available_groups`\
  \ 目录视图中递增一个序列号。然后在故障转移时查询该序列号，以在故障转移发生前确定节点是否是最新的。这允许在序列号不是最高时拒绝故障转移。清单 6-22 演示了如何安装资源代理。\n\
  \n```\nsudo apt-get install mssql-server-ha\n```\n清单 6-22\n\n### 保存 Pacemaker 凭据\n\
  接下来，我们需要为 Pacemaker 授予对可用性组的权限。我们在清单 6-12 中为 Pacemaker 创建了一个登录名。现在我们需要在集群中的所有节点上运行清单\
  \ 6-23 中的脚本，将凭据保存在操作系统中。\n\n```\necho 'pacemakerLogin' >> ~/pacemaker-passwd\necho\
  \ 'Pa$$w0rd' >> ~/pacemaker-passwd\nsudo mv ~/pacemaker-passwd /var/opt/mssql/secrets/passwd\n\
  sudo chown root:root /var/opt/mssql/secrets/passwd\nsudo chmod 400 /var/opt/mssql/secrets/passwd\n\
  ```\n清单 6-23\n\n### 创建集群资源\n我们现在需要创建集群资源，既用于可用性组，也用于虚拟 IP 地址。这可以通过运行清单 6-24 中的脚本来实现。脚本中的第一个命令为\
  \ `LinuxAOAG` 可用性组创建可用性组资源。\n脚本中的第二个命令为我们希望使用的 IP 地址创建资源。请注意，我们同时指定了 IP 地址和网络的网络掩码。网络掩码使用\
  \ CIDR 表示法指定。CIDR 表示法超出了本书的范围，但可以在 [www.controltechnology.com/Files/common-documents/application_notes/CIDR-Notation-Tutorial](http://www.controltechnology.com/Files/common-documents/application_notes/CIDR-Notation-Tutorial)\
  \ 找到 CIDR 教程。\n\n```\nsudo pcs resource create LinuxAOAG ocf:mssql:ag ag_name=LinuxAOAG\
  \ meta failure-timeout=60s master meta notify=true\nsudo pcs resource create VirtualIP\
  \ ocf:heartbeat:IPaddr2 ip=10.0.0.25 cidr_netmask=24\n```\n清单 6-24\n\n**警告**\n由于\
  \ Pacemaker 没有网络名称的概念，因此 IP 地址和所需名称必须手动在 DNS 中注册。\n\n### 创建同位置约束\n资源应在哪个节点上运行的决策基于分数，这些分数在资源级别计算。这意味着虚拟\
  \ IP 地址可能被移动到与可用性组资源不同的节点存在风险。为了降低此风险，我们需要添加一个同位置约束，以确保资源始终位于同一节点上。约束也有分数，低于无穷大的任何数字都是偏好，无穷大则是绑定要求。清单\
  \ 6-25 中的命令将创建所需的约束。\n\n```\nsudo pcs constraint colocation add VirtualIP LimuxAOAG\
  \ INFINITY with-rsc-role=Master\n```\n清单 6-25\n\n### 创建排序约束\n由于此命令将虚拟 IP 地址资源列在可用性组资源之前，当资源移动时，虚拟\
  \ IP 地址将被移动并上线，然后才移动并上线可用性组资源。这意味着虚拟 IP 地址可能暂时指向错误的节点。此风险可以通过添加排序约束来缓解，该约束强制在虚拟\
  \ IP 地址上线之前先移动可用性组资源。清单 6-26 演示了如何配置此约束。\n\n```\nsudo pcs constraint order promote\
  \ LinuxAOAG then start VirtualIP\n```\n清单 6-26\n\n### 创建可用性组侦听器\n最后，我们可以创建可用性组侦听器。侦听器将使用我们在\
  \ Pacemaker 集群中创建的虚拟 IP 地址资源的 IP 地址。重要的是要记住，当可用性组配置在 Pacemaker 集群上时，可用性组侦听器的唯一目的是提供一个抽象，为副本提供单一入口点。它不会掩盖中断，因为在故障转移期间，在虚拟\
  \ IP 地址资源在另一个集群节点上启动时，它将暂时不可用。我们可以通过使用清单 6-27 中的脚本创建可用性组侦听器。\n\n```\nUSE master\n\
  GO\nALTER AVAILABILITY GROUP LinuxAOAG ADD LISTENER 'LinuxAOListener'\n(\n    WITH\
  \ IP (\n        (N'10.0.0.25', N'255.255.255.0')\n    )\n    , PORT=1433\n);\nGO\n\
  ```\n清单 6-27\n\n## 摘要\n可用性组可以在基于 Linux 的实例上以与在基于 Windows 的实例上配置可用性组类似的方式进行配置。它们可以在没有底层集群的情况下配置，也可以使用基于\
  \ Linux 的集群技术。\n如果需要高可用性或灾难恢复，则必须使用 Pacemaker 等 Linux 集群技术。Pacemaker 集群由多个组件组成，包括\
  \ `pcs`，用于管理 Pacemaker 集群的命令行实用程序；`Corosync`，提供节点之间的心跳；用于 fencing 的 `STONITH`；以及\
  \ `Pacemaker`，核心集群管理器。\nPacemaker 集群支持可用性组侦听器，但其功能有限。IP 地址资源在移动到新节点时暂时离线。因此，可用性组侦听器提供了一个抽象，但不会掩盖故障，因为它在一段时间内将无法访问。\n\
  \n© Peter A. Carter 2020 P. A. Carter SQL Server 2019 AlwaysOn [`doi.org/10.1007/978-1-4842-6479-9_7`](https://doi.org/10.1007/978-1-4842-6479-9_7)\n"
- "# 7. 非常规可用性组实现\nPeter A. Carter ([1]) (1) Botley, UK\n\n\n\n到目前为止，我们已经讨论了 `AlwaysOn\
  \ Availability Groups` 和 `AlwaysOn Failover Clustered Instances` 的典型、本地企业工作负载场景。然而，AlwaysOn\
  \ 是一个如此灵活的技术套件，以至于存在许多你可以利用的变体。因此，本章将概述一些不太典型的 AlwaysOn 场景，你可能需要支持。这些包括 `Basic Availability\
  \ Groups`、`Availability Groups` 在 Azure 中、`Distributed Availability Groups`，以及在没有集群或域的情况下创建\
  \ `Availability Groups`。\n\n在本章中，我们将执行以下活动：\n* 在 Azure IaaS 中创建可用性组。\n* 创建无集群可用性组。\n\
  * 创建域无关可用性组。\n* 创建分布式可用性组。\n\n## 基本可用性组\n\n本书迄今为止的所有可用性组演示都需要 `SQL Server Enterprise\
  \ Edition`，但可用性组在 `SQL Server Standard Edition` 中也可用。然而在标准版中，可用性组的功能是有限的，因此它们被称为\
  \ `Basic Availability Groups`。\n\n最明显限制是基本可用性组仅支持两个副本。然而，副本可以配置为同步或异步提交模式。这意味着你仍然可以实现高可用性或灾难恢复。\n\
  \n**注意**\nLinux 上的基本可用性组支持第三个仅配置的副本，这是实现高可用的必要条件。请参阅第 6 章了解更多详细信息。\n\n次要副本不支持只读连接。这意味着基本可用性组不仅不支持读取扩展，也不支持在次要副本上执行备份或完整性检查。\n\
  \n另一个限制是基本可用性组只能包含单个数据库。这意味着无法一起故障转移多个数据库，使得大型实例的管理变得更加困难。\n\n其他高级可用性组功能，例如分布式可用性组，也不受支持，并且一旦构建了基本可用性组，就无法将其升级为完整可用性组。相反，必须将其销毁并重新创建。\n\
  \n要实现基本可用性组，你可以使用本书前面讨论过的相同语法，显而易见的例外是不能实现不受支持的功能。基本可用性组独有的唯一语法是在 `WITH` 子句中添加 `BASIC`\
  \ 标记，这会降低可用功能。例如，列表 7-1 中的脚本将在两个服务器之间创建可用性组，服务器名为 `SQLStdProd` 和 `SQLStdSyncHA`，并且两台服务器都安装了\
  \ SQL Server Standard Edition 的默认实例。\n\n```\nCREATE AVAILABILITY GROUP BasicAGAG\
  \ WITH (\n    AUTOMATED_BACKUP_PREFERENCE = PRIMARY,\n    BASIC,\n    REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT\
  \ = 0\n)\nFOR DATABASE Sales\nREPLICA ON 'SQLSTDPROD' WITH (\n    ENDPOINT_URL =\
  \ 'TCP://SQLSTDPROD.AlwaysOn.com:5022',\n    FAILOVER_MODE = AUTOMATIC,\n    AVAILABILITY_MODE\
  \ = SYNCHRONOUS_COMMIT,\n    SEEDING_MODE = AUTOMATIC\n),\n'SQLSTDSYNCHA' WITH (\n\
  \    ENDPOINT_URL = N'TCP://SQLSTDSYNCHA.AlwaysOn.com:5022',\n    FAILOVER_MODE\
  \ = AUTOMATIC,\n    AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n    SEEDING_MODE =\
  \ AUTOMATIC\n);\nGO\n```\nListing 7-1\n创建基本可用性组\n\n## Azure IaaS 上的可用性组\n\n当将数据库迁移到云时，你有多种目标选项。Azure\
  \ SQL Database 和弹性数据库池提供数据库即服务，而 Azure 托管实例提供 SQL Server 即服务。这两种服务都基于可用性组提供高可用性。然而，如果你的应用程序需要访问操作系统，则必须使用\
  \ Azure 虚拟机。使用此解决方案，你必须手动配置可用性组，就像在本地一样。在以下各节中，我们将在设计可用性组拓扑之前查看一些你应该了解的 Azure 可用性选项，然后再探讨如何在\
  \ Azure 中配置可用性组。\n\n### Azure 可用性概念\n\n云的关键原则是为故障设计应用程序。因此，在云中为 SQL Server 实现可用性组是一个非常重要的主题。在讨论实现之前，你应该熟悉可用性集、可用性区域和区域的概念。以下各节将概述这些主题。\n\
  \n#### 可用性集\n\n可用性集是一种构造，它将同一数据中心内的虚拟机放置在不同的故障域和更新域中。故障域表示共享公共电源和网络交换机的硬件。可用性集可以配置为跨越三个故障域。因此，如果你将三个虚拟机放置在同一个可用性集中，你就知道每个虚拟机与其他虚拟机在可用性集中具有唯一的电源和网络交换机。\n\
  \n更新域表示为计划或非计划维护而重新启动的物理硬件。默认情况下，可用性集分为五个更新域，这可以增加到最多 20 个。如果你在同一个可用性集中放置虚拟机，你就知道它们彼此位于不同的硬件上，并且不会同时重新启动。\n\
  \n**提示**\n在使用可用性集时，你还应确保使用托管磁盘。使用托管磁盘时，物理磁盘会跨与附加虚拟机对齐的故障域进行拆分，避免单点故障。\n\n#### 可用性区域\n\
  \n虽然可用性集可防止数据中心内的硬件问题和停机，但它无法防止数据中心故障。为了防止数据中心故障，你必须将虚拟机放置在单独的可用性区域中。每个可用性区域位于不同的建筑物中，具有独立的电力、网络和冷却系统。\n\
  \n#### 区域\n\n区域提供了一种地理分散服务器的手段，以防止整个区域离线的规模性灾难。Azure 中的区域在地理位置内配对，其中地理位置是政治区域。例如，美国的区域与物理上位于美国的其他区域配对。其他地区，如欧洲和英国也适用。这使你能够在保持数据主权的同时防止灾难。\n\
  \n虽然我知道有些公司认为对于灾难恢复，他们只需要防止数据中心丢失，因此决定避免在多个区域拥有足迹的复杂性和成本开销，但在云术语中，只有当你的灾难恢复服务器位于与生产服务器不同的区域时，你才拥有灾难恢复。\n\
  \n### 在 Azure 中实现可用性组\n\n在本节中，我们将探讨如何在 Azure 虚拟机上配置可用性组。在本节中，我们将在同一区域的两个可用性区域之间为\
  \ Sales 数据库构建一个可用性组，以提供高可用性。我们将在同一虚拟网络中的不同子网上构建每个虚拟机。在此之前，我们将简要讨论可用性集。\n\n#### 创建可用性集\n\
  \n\n\n## 从 Azure 门户创建可用性集\n\n要从 Azure 门户创建可用性集，请导航到“可用性集”刀片并使用“添加”按钮启动“创建可用性集”页面，该页面如图\
  \ 7-1 所示。您会注意到，我们已选择要创建可用性集的订阅，并选择了应创建它的资源组。我们还为其指定了名称并选择了应创建的区域。因为我们计划在可用性集中拥有两台服务器，所以更新域和故障域都配置为两个。两台服务器中的每一台都将位于不同的故障域和更新域中。如果我们向可用性集添加更多服务器，则它们将以轮询方式分配到故障域和更新域。![图\
  \ 7-1 ¶ 创建可用性集](img/394392_3_En_7_Fig1_HTML.jpg)\n\n图 7-1 ¶ 创建可用性集\n\n在如图 7-2 所示的高级页面上，我们可以选择将邻近放置组分配给可用性组。邻近放置组通过使用位于数据中心内物理位置接近的硬件来帮助确保最低可能的延迟。要使用此选项，您必须在创建可用性集之前创建邻近组。![图\
  \ 7-2 ¶ 创建可用性集高级页面](img/394392_3_En_7_Fig2_HTML.jpg)\n\n图 7-2 ¶ 创建可用性集高级页面\n\n标签页面允许您分配键/值对标签。使用标签对于云来说始终是良好的实践，因为它不仅有助于资源管理，还能帮助成本控制，例如为消耗云资源的业务部门生成回溯或分摊机制。如图\
  \ 7-3 所示，我们已为环境和应用程序配置了标签。![图 7-3 ¶ 创建可用性集 – 标签页面](img/394392_3_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3 ¶ 创建可用性集 – 标签页面\n\n提示\n\n您可以使用 Azure 策略强制在创建资源时使用特定标签。\n\n在“审核”页面上，您有机会在创建资源之前审核已配置的设置。\n\
  \n## 在 Azure VM 上创建可用性组\n\n在以下各节中，我们将讨论在 Azure 上构建和配置可用性组解决方案。\n\n注意\n\n要跟随以下各节中的演示，您需要一个\
  \ Azure 订阅。这必须是至少按使用付费的订阅，因为免费试用订阅无法提供足够的内核来构建两台服务器。您还需要一个 vnet，其中包含两个子网。本章还假设 vnet\
  \ 包含域控制器，或者您已配置 Azure 域服务。\n\n### 创建 VM\n\n我们首先需要的是三台 VM，其中将安装 SQL Server。在 Azure\
  \ 中实现此目的有多种方式，具体取决于您的需求。第一个选项是前往 Azure Marketplace 并查找已安装 SQL Server 的机器映像。如果您采用这种方法，那么了解有两种不同的许可条款非常重要。第一种是\
  \ SPLA（服务提供商许可协议）。使用 SPLA 许可，VM 的成本包括 SQL Server 许可的成本。这意味着您的许可按使用付费，避免了许可采购的前期成本，但如果\
  \ VM 使用时间长，长期来看成本会更高。\n\n第二种选项类型是 BYOL（自带许可）。在此许可模式下，SQL Server 许可不包含在 VM 的成本中。相反，您必须使用已采购的现有许可。当您选择此选项时，您必须在\
  \ 10 天内向 Microsoft 报告您的许可使用情况。\n\n当您构建已预装 SQL Server 的 VM 时，它将附带完整的 SQL Server 安装，包括所有功能。（除非您选择标记为“仅数据库引擎”的映像。）这在大多数用例中并不理想，因为它比仅安装所需的功能具有更大的安全足迹和资源利用率。因此，如果您使用预装\
  \ SQL Server 的 VM 映像（无论许可模式如何），都应花时间对其进行自定义以满足您的需求。\n\n或者，您可以简单地从原版 Windows Server\
  \ 映像构建 VM 并自行安装 SQL Server。这是最灵活的选项，但如果您采用这种方法，则必须自带许可。不会提供 SPLA 选项。\n\n在本示例中，我们将使用带\
  \ SPLA 许可的 SQL Server 2019 on Windows Server 2019 映像。图 7-4 显示了此 VM 映像的 Marketplace\
  \ 图标。![图 7-4 ¶ SQL Server 2019 on Windows Server 2019 VM 映像](img/394392_3_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4 ¶ SQL Server 2019 on Windows Server 2019 VM 映像\n\n在如图 7-5 所示的“创建虚拟机”页面的第一部分中，我们将指定\
  \ VM 应创建的订阅和资源组，然后指定服务器的名称和应创建的区域。![图 7-5 ¶ 创建虚拟机（第 1 部分）](img/394392_3_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5 ¶ 创建虚拟机（第 1 部分）\n\n然后我们继续指定 VM 的可用性选项。在规划可用性组时，这一点至关重要。在“可用性选项”对话框中，我们可以在“无需基础结构冗余”、“可用性集”或“可用性区域”之间进行选择。如果我们选择了可用性集，那么我们就可以选择使用之前创建的可用性集或创建新的可用性集。然而，我们选择了可用性区域，因此我们可以指定服务器应创建在哪个可用性区域。每个区域至少有三个可用性区域。\n\
  \n警告\n\n然而，需要注意的是，创建 VM 后无法更改可用性选项。例如，您不能先创建没有可用性选项的 VM，然后再将其添加到可用性集中。\n\n然后我们可以选择更改构建映像并指定是否要使用\
  \ Spot 实例。Spot 实例很少适合 SQL Server，且绝不适用于生产环境。Spot 实例由 Azure 内的空闲容量构建，成本非常有效。然而，如果需要容量，Azure\
  \ 可能会在很短的通知时间内终止它们。因此，Spot 实例通常最适用于无状态应用程序、规模集中的无状态应用程序，或测试环境中的无状态应用程序。\n\n我们还指定要构建的\
  \ VM 大小。月成本（基于服务器 24x7 运行）将显示在 VM 大小配置文件的右侧。\n\n我们现在可以继续填充表单的后半部分，如图 7-6 所示。在这里，我们指定\
  \ VM 的管理员用户的用户名和密码，以及是否应在服务器的公共 IP 地址上打开端口。如果是这样，我们可以指定应打开哪些端口。![图 7-6 ¶ 创建虚拟机（第\
  \ 2 部分）](img/394392_3_En_7_Fig6_HTML.jpg)\n\n图 7-6 ¶ 创建虚拟机（第 2 部分）\n\n警告\n\n公共端口只应出于开发/测试目的而打开，即使如此，强烈建议创建\
  \ VPN 或改用 Bastion。\n\n最后，我们指定要使用的许可模式。请注意，这仅适用于操作系统，不适用于 SQL Server，但我们仍然有相同的两个选项。我们可以按需支付\
  \ Windows 许可费用或自带许可。\n\n\n\n## 磁盘页\n\n在磁盘页上，如图 7-7 所示，我们可以配置 VM 的存储选项。页面第一部分中，我们可以指定要使用的存储层级，可在\
  \ Standard HDD、Standard SSD . 或 Premium SSD 中选择。我推荐为托管 SQL Server 的 VM 使用 Premium\
  \ SSD，这可能不会令人意外，尽管您的选择可能还有其他因素，例如公司政策或预算限制。 ![图 7-7 ¶ 创建虚拟机 – 磁盘页](img/394392_3_En_7_Fig7_HTML.jpg)\n\
  \n图 7-7 ¶ 创建虚拟机 – 磁盘页\n\n页面“高级”部分中，我们可以指定是否要使用托管磁盘或非托管磁盘，以及是否要使操作系统磁盘为临时磁盘。通常推荐使用托管磁盘，因为它们带来诸如自动跨故障域和更新域拆分等优势。如果\
  \ VM 是在可用性集中构建的，这些域也可以与可用性集的域保持一致。在我们的案例中，必须使用托管磁盘，因为当可用性选项配置为可用性区域时，这是唯一的选择。\n\n\
  临时磁盘使用非常快的存储，且不具备终止抗性。因此，它们适用于无状态应用程序，但不适用于运行 SQL Server 的 VM。在我们的案例中，我们甚至无法为操作系统选择临时磁盘，因为我们的映像太大而无法支持它。\n\
  \n## 网络页\n\n在网络页（图 7-8）上，我们可以指定 VM 应附加到的 vnet 和子网，以及配置应使用的公共 IP 地址和安全组。在此页面上，还有一些未说明的选项，允许您配置加速网络，这是一项功能，可实现对\
  \ VM NIC（网络接口卡）的低延迟和高吞吐量，但仅适用于较大 VM，并且还允许您将 VM 置于预配置的负载均衡器之后。此选项不适用于 SQL Server。\
  \ ![图 7-8 ¶ 创建虚拟机 – 网络](img/394392_3_En_7_Fig8_HTML.jpg)\n\n图 7-8 ¶ 创建虚拟机 – 网络\n\
  \n## 管理页\n\n在管理页上，如图 7-9 所示，我们可以配置 VM 的诊断设置。具体而言，我们可以选择是否捕获启动诊断和来自来宾操作系统的诊断，以及诊断应保存到的存储帐户。\
  \ ![图 7-9 ¶ 创建虚拟机 – 管理页](img/394392_3_En_7_Fig9_HTML.jpg)\n\n图 7-9 ¶ 创建虚拟机 – 管理页\n\
  \n我们还可以指定是否要使用系统分配的托管标识。如果选择此选项，则 VM 可以在无需在代码中存储服务凭据的情况下对原生 Azure 服务（如 Key Vault）进行身份验证。最后，我们可以指定是否要在特定时间关闭\
  \ VM。如果选择此选项，则会出现额外的对话框，允许我们指定关闭计划以及是否希望收到关闭通知。\n\n### 提示\n\n创建 VM 时，只能添加关闭计划，但没有创建启动计划的选项。这可以通过使用\
  \ Azure Automation 帐户来实现。\n\n## 高级页\n\n就我们的目的而言，在高级页上没有需要配置的内容。但是，此页面可用于将配置文件传递到\
  \ VM 内的已知位置，安装 VM 的扩展，例如 Puppet Agent，以实现 VM 的配置管理。如果您希望 VM 位于就近组上，或希望它驻留在现有的专用主机上，则这些选项也可以在此页面上配置。\n\
  \n## SQL Server 设置\n\n由于我们正在构建 SQL Server VM，因此我们有一个 SQL Server 设置页，如果我们从标准 Windows\
  \ Server 映像构建 VM，则该页不会出现。在此页的第一部分（图 7-10）中，我们可以配置 SQL 连接。这将为我们提供使 SQL Server 实例仅在\
  \ VM 内、在我们的 vnet 内或在 Internet 上公开可用的选项。毋庸置疑，将实例公开给 Internet 是不可取的，通常即使在开发/测试场景中也是如此。\
  \ ![图 7-10 ¶ 创建虚拟机 – SQL Server 设置（第 1 部分）](img/394392_3_En_7_Fig10_HTML.jpg)\n\n\
  图 7-10 ¶ 创建虚拟机 – SQL Server 设置（第 1 部分）\n\n我们还可以指定实例应监听的端口以及是否要启用 SQL Server 身份验证（而不仅仅是\
  \ Windows 身份验证）。如果选择此选项，我们可以指定所需管理员帐户的用户名和密码。\n\n我们还可以选择是否要将实例与 Azure Key Vault\
  \ 集成。如果选择此选项，则必须提供 Key Vault 服务的 URL 和凭据信息。\n\n在页面的下一部分中，我们会看到 SQL Server 的默认存储选项。使用“更改配置”链接将调用“配置存储”页，如图\
  \ 7-11 所示。在此页上，有针对通用、OLTP 和数据仓库工作负载配置文件的预设，可以根据您的要求进行自定义。您可以指定 TempDB 和日志文件是否应使用同一驱动器或共享数据驱动器。您还可以指定每个磁盘的大小和存储类型。\
  \ ![图 7-11 ¶ 创建虚拟机 – SQL Server 设置（第 2 部分）](img/394392_3_En_7_Fig11_HTML.jpg)\n\n\
  图 7-11 ¶ 创建虚拟机 – SQL Server 设置（第 2 部分）\n\n在页面的最后一部分中，如图 7-12 所示，我们可以指定要为 SQL Server\
  \ 使用的许可模型（BYOL 或 SPLA），以及指定修补窗口并选择是否要启用自动备份。最后，我们可以指定是否要安装 R Services，该服务提供自 SQL\
  \ Server 2017 起可用的数据库内机器学习功能。 ![图 7-12 ¶ 创建虚拟机 – SQL Server 设置（第 3 部分）](img/394392_3_En_7_Fig12_HTML.jpg)\n\
  \n图 7-12 ¶ 创建虚拟机 – SQL Server 设置（第 3 部分）\n\n## 标签和审核页\n\n在标签页上，我们可以按键/值对添加标签，如本章“创建可用性集”部分所述。在审核页上，我们可以在创建虚拟机之前审核所选配置。\n\
  \n就我们的目的而言，我们应重复此过程以创建第二个 VM，这次在可用性区域 2 中并驻留在 vnet 内的另一个子网上。\n\n## 配置可用性组\n\n一旦两个服务器构建完成，您需要将服务器加入域并配置防火墙规则等设置。然后，您可以使用本书第\
  \ 3 章中演示的方法创建群集。由于我们正在实施可用性组而不是故障转移群集实例，因此群集中不需要任何共享存储。\n\n群集配置完成后，我们可以通过创建 Sales\
  \ 数据库来构建可用性组，然后使用本书第 5 章中讨论的方法配置可用性组。为本次练习的目的，节点应配置为同步复制和自动故障转移。请注意，您此时不应创建可用性组侦听器。\n\
  \n在 Azure 中，可用性组侦听器将需要 Azure 负载均衡器，以保存可用性组侦听器和故障转移群集的 IP 地址。我们应在创建可用性组侦听器之前创建负载均衡器。\n\
  \n\n\n## Azure 负载均衡器配置\n\n## 概述和层级选择\n\nAzure 负载均衡器有两个层级，功能各不相同。Basic 是较便宜的层级，功能更有限，而\
  \ Standard 是较高的层级。由于我们的服务器位于可用区，因此必须使用标准负载均衡器。\n\n## 创建负载均衡器\n\n要创建负载均衡器，请在 Azure\
  \ 中导航到“负载均衡器”刀片并选择“添加”按钮，以创建新的负载均衡器。在“创建负载均衡器”页面的第一部分中，如图 7-13 所示，我们指定要创建负载均衡器的订阅和资源组。这应与您的\
  \ VM 所在的资源组相匹配。 ![图 7-13 ¶ 创建负载均衡器（第 1 部分）](img/394392_3_En_7_Fig13_HTML.jpg)\n\n\
  图 7-13 ¶ 创建负载均衡器（第 1 部分）\n\n然后我们为负载均衡器提供名称并指定其应创建的区域。这应与您的 VM 的位置相匹配。我们还选择要创建的负载均衡器的层级。\n\
  \n## 网络配置\n\n在页面的下一部分（图 7-14），我们指定负载均衡器的网络详细信息。具体来说，我们指定其应驻留的虚拟网络，这应与您的 VM 的虚拟网络相匹配。我们还指定应使用静态还是动态\
  \ IP 地址。对于我们的目的，我们需要静态 IP 地址，因此需要指定该地址应为哪个地址。最后，我们指定负载均衡器的公共 IP 地址是否应创建在可用区中，或是否应使用区域冗余路径。\
  \ ![图 7-14 ¶ 创建负载均衡器（第 2 部分）](img/394392_3_En_7_Fig14_HTML.jpg)\n\n图 7-14 ¶ 创建负载均衡器（第\
  \ 2 部分）\n\n在“标签”页面，我们可以根据公司政策指定键/值对，然后在“查看”页面上查看我们的配置。\n\n## 后端池\n\n现在我们需要为负载均衡器创建一个后端池。这可以通过在\
  \ Azure 门户中导航到负载均衡器刀片的“后端池”选项卡并使用“添加”按钮来实现，以调用如图 7-15 所示的“添加后端池”页面。 ![图 7-15 ¶ 添加后端池](img/394392_3_En_7_Fig15_HTML.jpg)\n\
  \n图 7-15 ¶ 添加后端池\n\n## 健康探测\n\n现在我们可以创建一个健康探测，它将对每个节点执行连接检查。我们可以通过导航到负载均衡器刀片上如图\
  \ 7-16 所示的“健康探测”选项卡来完成此操作。在这里，我们为探测指定名称并提供协议和未使用的端口，健康检查将使用该端口连接到节点。然后我们指定健康检查应运行的频率以及导致节点被标记为不健康的同时失败次数。如果节点被标记为不健康，负载均衡器将不会向其发送任何请求。\
  \ ![图 7-16 ¶ 添加健康探测](img/394392_3_En_7_Fig16_HTML.jpg)\n\n图 7-16 ¶ 添加健康探测\n\n##\
  \ 负载均衡规则\n\n接下来，我们将使用负载均衡器刀片的“负载均衡器规则”选项卡上的“添加”按钮配置新的负载均衡规则。在此刀片的第一部分（图 7-17）中，我们将为规则指定名称，以及负载均衡器应使用\
  \ IPv4 还是 IPv6。前端 IP 地址是我们之前配置的负载均衡器的 IP 地址。HA 端口允许后端池的所有端口进行负载均衡，但我们不想这样做，因此我们将保持该框未选中并选择\
  \ TCP 作为协议。 ![图 7-17 ¶ 配置负载均衡规则（第 1 部分）](img/394392_3_En_7_Fig17_HTML.jpg)\n\n图\
  \ 7-17 ¶ 配置负载均衡规则（第 1 部分）\n\n在此页面的第二部分，如图 7-18 所示，我们将配置负载均衡器将监听的端口，然后是后端池中服务器将监听的端口。在我们的例子中，这两者都将是端口\
  \ 1433。我们将选择我们刚刚创建的服务器后端池和健康探测。 ![图 7-18 ¶ 配置负载均衡规则（第 2 部分）](img/394392_3_En_7_Fig18_HTML.jpg)\n\
  \n图 7-18 ¶ 配置负载均衡规则（第 2 部分）\n\n会话持久性指定应如何处理来自客户端的连续请求。如果我们选择客户端 IP，则来自同一 IP 地址的连续请求将由同一服务器处理。如果我们选择客户端\
  \ IP 和协议，则来自同一客户端的连续请求将由同一服务器处理，但前提是使用相同的协议进行连接。对于可用性组而言，会话持久性不是必需的，因此我们将选择“无”。这表示同一客户端的连续请求可以由后端池中的任何服务器处理。\n\
  \n空闲超时表示在客户端未发送消息的情况下连接将被保持打开的最小时间长度，我们将保持 TCP 重置处于禁用状态。最后，我们将选择浮动 IP，这会更改 IP 地址映射模式，允许多个侦听器，这对于可用性组侦听器是必需的。\n\
  \n您应重复此过程为核心集群添加前端端口和负载均衡规则。\n\n## 可用性组侦听器\n\n然后我们将处于可以配置可用性组侦听器的位置。我们将从集群管理器中执行此操作。从“销售角色”的上下文菜单中，钻取“添加资源”并选择“客户端访问点”。这将导致显示“新建资源客户端访问点”向导。在此向导的第一页上，为客户端访问点提供名称并分配\
  \ IP 地址。由于我们为每个 VM 创建了不同的子网，因此我们需要为每个子网提供 IP 地址，如图 7-19 所示。 ![图 7-19 ¶ 创建新的客户端访问点\
  \ – 客户端访问点页面](img/394392_3_En_7_Fig19_HTML.jpg)\n\n图 7-19 ¶ 创建新的客户端访问点 – 客户端访问点页面\n\
  \n当我们进入向导的确认页面时，我们的网络设置将被验证。确认页面显示我们将要配置的摘要。\n\n一旦创建了客户端访问点，我们应使用角色的资源选项卡下“其他资源”中显示的可用性组资源的属性对话框的“依赖项”选项卡来添加对客户端访问点的依赖项，如图\
  \ 7-20 所示。 ![图 7-20 ¶ 添加依赖项](img/394392_3_En_7_Fig20_HTML.jpg)\n\n图 7-20 ¶ 添加依赖项\n\
  \n您还应重复此过程使客户端访问点依赖于 IP 地址资源。\n\n## 集群与负载均衡器的集成\n\n接下来，我们需要配置集群以与 Azure 负载均衡器配合使用。我们可以使用列表\
  \ 7-2 中的脚本来完成此操作。此脚本使用负载均衡器 IP 和健康探测端口更新每个 IP 地址资源。\n\n**注意**\n请务必在运行脚本之前将其更新以匹配您自己的配置。\n\
  \n```powershell\n$ClusterNetworkName = 'AlwaysOnAzure'\n$LoadBalancerIP = '10.0.10.10'\n\
  [int]$LoadBalancerProbePort = 50001\nGet-ClusterResource 'IP Address 10.0.0.35'\
  \ | Set-ClusterParameter -Multiple @{\"Address\"=\"$LoadBalancerIP\";\"ProbePort\"\
  =$LoadBalancerProbePort;\"SubnetMask\"=\"255.255.255.0\";\"Network\"=\"$ClusterNetworkName\"\
  ;\"EnableDhcp\"=0}\nGet-ClusterResource 'IP Address 10.0.0.35' | Set-ClusterParameter\
  \ -Multiple @{\"Address\"=\"$LoadBalancerIP\";\"ProbePort\"=$LoadBalancerProbePort;\"\
  SubnetMask\"=\"255.255.255.0\";\"Network\"=\"$ClusterNetworkName\";\"EnableDhcp\"\
  =0}\n```\n\n列表 7-2\n将集群与负载均衡器集成\n\n**提示**\n\n\n\n\n创建 `Client Access Point` 后，`Availability\
  \ Group` 中将添加一个 `Availability Group Listener`，默认端口为 `1433`。如果计划使用不同的端口，可以在 `SQL\
  \ Server Management Studio` 中的侦听器中进行更新。\n\n## 无群集可用性组\n\n无群集可用性组出现在 `SQL Server\
  \ 2017` 中，是 `Linux` 支持的副产品，但对于支持 `Windows` 环境上实例的 SQL Server DBA 来说也可能很有价值。\n\n\
  无群集实现不适用于高可用性场景。这有几个原因。首先，因为没有群集，所以没有运行状况检查。这意味着无法自动仲裁故障转移。其次，虽然可以在副本之间使用 `synchronous\
  \ commit` 实现无数据丢失的故障转移，但您需要通过将 `Availability Group` 在主副本上脱机来准备故障转移。这意味着故障转移期间会出现中断。最后，因为没有群集，所以无法拥有侦听器。这意味着连接到主副本的应用程序在故障转移事件中需要切换连接字符串以指向辅助副本。\n\
  \n**提示**\n可以在 `DNS` 中创建指向主副本的 `C-NAME` 记录。然后可以在故障转移时将 `C-NAME` 记录更新为指向辅助副本。虽然这是一个手动过程，通常涉及\
  \ DBA 职能之外的团队，但它可以避免客户端更改其连接字符串的需求。\n\n无群集可用性组在读扩展场景中获益最大。因此，它们也被称为读扩展可用性组。设想一个场景，您有一个\
  \ SQL Server 工作负载，来自多个应用程序的读取吞吐量很高，但没有 HA 要求。您可以消除群集的复杂性，同时仍保持数据库同步。某些客户端应用程序可以配置为指向主副本，而其他客户端应用程序可以配置为指向辅助副本。\n\
  \n在本节中，我们将处理一个场景，其中有两个名为 `Prod` 和 `ReadScale` 的服务器。每个服务器都安装了默认实例的 `SQL Server 2019\
  \ Enterprise Edition`。两个服务器都在站点 1，并且都是 `AlwaysOn.com` 域的成员，但没有群集。我们将配置一个 `Availability\
  \ Group` 为 `Customers` 数据库提供读扩展，该数据库由两个应用程序访问，但其中一个应用程序仅执行只读操作。\n\n### 准备实例\n\n\
  与所有可用性组场景一样，在配置可用性组之前，我们需要完成一些准备任务。以下各节描述如何准备实例。\n\n#### 启用可用性组\n\n通常情况下，为实例准备可用性组的首要步骤是在数据库引擎服务上启用可用性组。我们可以使用\
  \ `PowerShell` 或 `SQL Server Configuration Manager` 执行此任务，如 第 5 章所示。在本例中，我们将使用 Configuration\
  \ Manager，如 图 7-21 所示。您会注意到，因为没有底层群集，对话框会告知我们这一点，而不是显示底层群集名称。此任务需要在将参与可用性组的所有实例上执行。\
  \ ![图 7-21 ¶ 启用可用性组](img/394392_3_En_7_Fig21_HTML.jpg)\n\n图 7-21 ¶ 启用可用性组\n\n启用可用性组后，需要重新启动服务才能使更改生效。\n\
  \n#### 创建 Customers 数据库\n\n本场景的目标是为 `Customers` 数据库提供读扩展。因此，我们可以使用 清单 7-3 中的脚本创建\
  \ `Customers` 数据库。\n\n```sql\n--Create Customers Database\nCREATE DATABASE Customers;\n\
  GO\nUSE Customers;\nGO\nCREATE TABLE dbo.Customers (\n      ID                INT\
  \                PRIMARY KEY        IDENTITY,\n      FirstName         NVARCHAR(30),\n\
  \      LastName          NVARCHAR(30),\n      CreditCardNumber  VARBINARY(8000)\n\
  );\nGO\n--Populate the table\nDECLARE @Numbers TABLE (\n        Number        INT\n\
  );\nWITH CTE(Number) AS (\n        SELECT 1 Number\n        UNION ALL\n        SELECT\
  \ Number + 1\n        FROM CTE\n        WHERE Number < 100\n)\nINSERT INTO @Numbers\
  \ SELECT Number FROM CTE\nDECLARE @Names TABLE (\n        FirstName        VARCHAR(30),\n\
  \        LastName         VARCHAR(30)\n);\nINSERT INTO @Names VALUES('Peter', 'Carter'),\n\
  \      ('Michael', 'Smith'),\n      ('Danielle', 'Mead'),\n      ('Reuben', 'Roberts'),\n\
  \      ('Iris', 'Jones'),\n      ('Sylvia', 'Davies'),\n      ('Finola', 'Wright'),\n\
  \      ('Edward', 'James'),\n      ('Marie', 'Andrews'),\n      ('Jennifer', 'Abraham'),\n\
  \      ('Margaret', 'Jones')\nINSERT INTO Customers(Firstname, LastName, CreditCardNumber)\n\
  \      SELECT\n                FirstName\n              , LastName\n           \
  \   , CreditCardNumber\n      FROM (\n            SELECT\n                   (SELECT\
  \ TOP 1 FirstName FROM @Names ORDER BY NEWID()) FirstName\n           , (SELECT\
  \ TOP 1 LastName FROM @Names ORDER BY NEWID()) LastName\n           , (SELECT TOP\
  \ 1 CONVERT(VARBINARY(8000), (\n                  (SELECT TOP 1 CAST(Number * 100\
  \ AS CHAR(4))\n                        FROM @Numbers\n                        WHERE\
  \ Number BETWEEN 10 AND 99\n                        ORDER BY NEWID()\n         \
  \          ) + '-' +\n                   (SELECT TOP 1 CAST(Number * 100 AS CHAR(4))\n\
  \                        FROM @Numbers\n                        WHERE Number BETWEEN\
  \ 10 AND 99 ORDER BY NEWID()\n                    ) + '-' +\n                  \
  \  (SELECT TOP 1 CAST(Number * 100 AS CHAR(4))\n                        FROM @Numbers\n\
  \                        WHERE Number BETWEEN 10 AND 99 ORDER BY NEWID()\n     \
  \                ) + '-' +\n                     (SELECT TOP 1 CAST(Number * 100\
  \ AS CHAR(4))\n                        FROM @Numbers\n                        WHERE\
  \ Number BETWEEN 10 AND 99 ORDER BY NEWID())))\n            FROM @Numbers a\n  \
  \    ) CreditCardNumber) d\nCROSS JOIN @Numbers b\nCROSS JOIN @Numbers c;\n--SET\
  \ FULL recovery mode on the database - required for Availability Groups\nALTER DATABASE\
  \ Customers SET RECOVERY FULL;\nGO\n```\n\n清单 7-3\n\n创建 Customers 数据库\n\n我们还需要在数据库添加到可用性组之前对其进行完整备份。我们可以使用\
  \ 清单 7-4 中的脚本实现此操作。\n\n```sql\n--Back Up Customers Database\nBACKUP DATABASE Customers\
  \ TO DISK = 'C:\\Program Files\\Microsoft SQL Server\\MSSQL15.MSSQLSERVER\\MSSQL\\\
  Backup\\Customers.bak' WITH NAME = 'Customers-Full Database Backup';\nGO\n```\n\n\
  清单 7-4\n\n备份 Customers 数据库\n\n#### 创建登录名\n\n数据同步将由运行数据库引擎服务的服务帐户执行。因此，服务帐户将在成为可用性组中副本的所有实例上需要登录名。在我们的场景中，两个实例都在\
  \ `ALWAYSON\\SqlServiceAccount` 域帐户下运行。因此，在所有参与实例上运行 清单 7-5 中的脚本将创建所需的登录名。\n\n```sql\n\
  CREATE LOGIN [ALWAYSON\\SQLServiceAccount] FROM WINDOWS;\nGO\n```\n\n清单 7-5\n\n\
  创建登录名\n\n**提示**\n如果服务器不是域的成员，则可以使用 SQL 登录名和证书配置身份验证。\n\n#### 创建和配置可用性组\n\n\n\n##\
  \ 创建终结点\n\n创建 `Availability Group` 的第一步是创建 `endpoint`，`Availability Group` 将使用它在\
  \ `Replicas` 之间发送消息。我们还需要授予服务帐户连接到 `Endpoint` 的权限。这可以通过清单 7-6 中的脚本实现。\n\n```sql\n\
  --Create the Endpoint\nCREATE ENDPOINT ClusterlessEndpoint\n    AS TCP (LISTENER_PORT\
  \ = 5022)\n    FOR DATA_MIRRORING (\n          ROLE = ALL,\n          ENCRYPTION\
  \ = REQUIRED ALGORITHM AES\n    ) ;\nGO\n--Start the Endpoint\nALTER ENDPOINT ClusterlessEndpoint\
  \ STATE = STARTED ;\nGO\n--Grant Permissions to the Service Account\nGRANT CONNECT\
  \ ON ENDPOINT::ClusterlessEndpoint TO [ALWAYSON\\SQLServiceAccount];\nGO\n```\n\n\
  清单 7-6\n\n创建终结点\n\n## 创建可用性组\n\n`Endpoint` 就位后，我们现在可以继续创建 `Availability Group`。与往常一样，我们可以选择使用\
  \ `T-SQL`、`New Availability Group` 向导或 `New Availability Group` 对话框。在本例中，我们将通过运行清单\
  \ 7-7 中的脚本使用 `T-SQL`。请注意，`CLUSTER_TYPE` 选项设置为 `NONE`。\n\n```sql\nUSE master\nGO\n\
  CREATE AVAILABILITY GROUP Customers_Clusterless WITH (\n      AUTOMATED_BACKUP_PREFERENCE\
  \ = SECONDARY,\n      CLUSTER_TYPE = NONE\n) FOR DATABASE Customers\nREPLICA ON\
  \ 'PROD' WITH (\n      ENDPOINT_URL = 'TCP://PROD.AlwaysOn.com:5022',\n      FAILOVER_MODE\
  \ = MANUAL,\n      AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n      SEEDING_MODE\
  \ = AUTOMATIC,\n      SECONDARY_ROLE(ALLOW_CONNECTIONS = ALL)\n), 'READSCALE' WITH\
  \ (\n      ENDPOINT_URL = 'TCP://READSCALE.AlwaysOn.com:5022',\n      FAILOVER_MODE\
  \ = MANUAL,\n      AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n      SEEDING_MODE\
  \ = AUTOMATIC,\n      SECONDARY_ROLE(ALLOW_CONNECTIONS = ALL)\n) ;\nGO\n```\n\n\
  清单 7-7\n\n创建可用性组\n\n## 将辅助副本加入可用性组\n\n最后，我们可以通过在辅助实例上运行清单 7-8 中的脚本，将辅助 `Replica`\
  \ 加入 `Availability Group`。\n\n```sql\nALTER AVAILABILITY GROUP Customers_Clusterless\
  \ JOIN WITH (CLUSTER_TYPE = NONE) ;\nGO\nALTER AVAILABILITY GROUP Customers_Clusterless\
  \ GRANT CREATE ANY DATABASE ;\nGO\n```\n\n清单 7-8\n\n将辅助副本加入可用性组\n\n`Availability\
  \ Groups` 的无群集用例之一是迁移。如果您有一个需要迁移到新服务器的数据库，您可以轻松配置一个无群集 `Availability Group` 来支持并行迁移。\n\
  \n一旦 `Availability Group` 配置完成，用户就可以在继续使用现有数据库的同时，对新实例执行只读操作进行应用程序检查。一旦他们满意，`Availability\
  \ Group` 可以进行故障转移，旧实例将被退役。\n\n## 与域无关的可用性组\n\n表面上看，与域无关的群集，也称为工作组群集和可用性组，似乎有点奇怪。如果一家公司大到需要运行\
  \ SQL Server Enterprise（甚至是 Standard），那么它肯定足够大，也很可能拥有域和创建标准群集的能力。但如果思考得更深入，企业从与域无关的高可用性和灾难恢复中受益的用例还有很多。例如，想象一下您拥有一个混合云环境。您的公司没有将域扩展到\
  \ Azure 或 AWS，而是决定在云中创建一个新域并在两者之间建立信任关系。然后您决定想要使用 `Availability Groups` 在本地和云之间同步数据库，以便支持在线销售应用程序的数据库位于云中以获得最低延迟，但您也希望\
  \ DR 回到本地。没有与域无关的群集或 `Availability Groups`，这只能使用无群集 `Availability Groups` 实现，这意味着您无法使用侦听器。\n\
  \n在本节中，我们将探讨如何创建与域无关的群集和 `Availability Group`。为了网络的简单性，我们将在 `Site1` 子网内的一个工作组中的两台服务器之间配置它。在此场景中，不存在域。但是值得注意的是，此方法也可以用于在两个独立域之间，或在域和工作组之间创建群集（和\
  \ `Availability Group`）。\n\n我们将在同一工作组中的两个节点上构建群集和 `Availability Group`，节点名为 `ClusterNode1`\
  \ 和 `ClusterNode2`，目的是卸载只读报表。每个节点上都安装了默认实例的 `SQL Server`。\n\n### 为群集做准备\n\n群集中所有节点都需要添加一个共同的主\
  \ DNS 后缀是必需的。这可以通过导航到 控制面板 ➤ 系统和安全 ➤ 系统 并在屏幕的 计算机名称、域和工作组设置 区域中选择更改设置来实现，从而调用系统属性对话框，其中可以使用更改按钮调用计算机名称/域更改对话框。现在，您可以使用更多按钮调用\
  \ DNS 后缀和 NetBIOS 计算机名称对话框，如图 7-22 所示。在这里，我们将输入我们的公共 DNS 后缀。\n\n![图 7-22 ¶ DNS 后缀和\
  \ NetBIOS 计算机名称](img/394392_3_En_7_Fig22_HTML.jpg)\n\n图 7-22 ¶ DNS 后缀和 NetBIOS 计算机名称\n\
  \n我们还需要确保在所有群集节点上存在一个帐户，该帐户具有相同的用户名、相同的密码并且具有本地管理员权限。在我们的场景中，我们将使用内置的 `Administrator`，但如果我们使用任何其他帐户，则还必须在注册表中将\
  \ `LocalAccountTokenFilterPolicy` 的值设置为 `1`。这可以通过使用清单 7-9 中的 `PowerShell` 命令来实现。\n\
  \n```powershell\nNew-ItemProperty -path HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\\
  Policies\\System -Name LocalAccountTokenFilterPolicy -Value 1\n```\n\n清单 7-9\n\n\
  设置 LocalAccountTokenFilterPolicy\n\n### 创建群集\n\n我们现在可以使用清单 7-10 中的脚本创建群集。这里有两个有趣的点需要注意。首先，我们正在使用\
  \ `AdministrativeAccessPoint` 参数，配置值为 `DNS`。这将创建群集名称对象，但不会尝试在 Active Directory 中创建计算机对象，而这当然在与域无关的群集中不受支持。\n\
  \n第二个有趣的点是我们选择使用群集磁盘作为见证。这是因为文件共享见证在与域无关的群集中不受支持。\n\n```powershell\nNew-Cluster\
  \ -Name AOAGWorkGroupCluster -Node ClusterNode1,ClusterNode2 -StaticAddress 10.0.0.52\
  \ -AdministrativeAccessPoint DNS\nSet-ClusterQuorum -DiskWitness \"Cluster Disk\
  \ 1\"\n```\n\n清单 7-10\n\n创建群集\n\n### 为可用性组做准备\n\n为 `Availability Group` 做准备的第一步是在所有将参与的节点的\
  \ `SQL Server` 服务上启用 `Availability Groups`。有关如何执行此操作的说明可在本章的“无群集可用性组”部分找到。\n\n\n\
  \n由于在此拓扑中无法使用 Active Directory 身份验证，`database_mirroring` 端点需要使用证书相互通信。我们还需要 SQL\
  \ 登录名，这些登录名将被授予连接到端点的权限。因此，我们首先需要创建证书。这可以通过清单 7-11 中的脚本实现。在这里，我们首先在 `master` 数据库中创建数据库主密钥。然后我们创建证书并将该证书备份到操作系统中。这应在将参与可用性组的每个节点上重复执行，为每个实例使用不同的证书名称。\n\
  \n### 创建证书\n\n```\nUSE master\nGO\n--Create the Database Master key\nCREATE MASTER\
  \ KEY ENCRYPTION BY PASSWORD = 'Pa$$w0rd';\nGO\n-- Create the certificate\nCREATE\
  \ CERTIFICATE Node1Cert WITH SUBJECT = 'ClusterNode1 Certificate';\nGO\n--Back up\
  \ the certificate\nBACKUP CERTIFICATE Node1Cert TO FILE = 'c:\\\\Certificates\\\\\
  Node1Cert.cer';\nGO\n```\n\n我们现在需要为每个节点创建一个登录名，该登录名将被授予连接到端点的权限。我们可以使用清单 7-12 中的脚本实现。这些登录名应在将参与可用性组的所有实例上创建。因此，应针对所有实例运行该脚本。\n\
  \n### 创建登录名\n\n```\nCREATE LOGIN ClusterNode1_AOAG WITH PASSWORD = 'Pa$$w0rd';\n\
  GO\nCREATE USER ClusterNode1_AOAG FOR LOGIN ClusterNode1_AOAG;\nGO\nCREATE LOGIN\
  \ ClusterNode2_AOAG WITH PASSWORD = 'Pa$$w0rd';\nGO\nCREATE USER ClusterNode2_AOAG\
  \ FOR LOGIN ClusterNode2_AOAG;\nGO\n```\n\n我们现在可以将每个实例的证书复制到所有其他实例，并使用清单 7-13 中的命令将其恢复。对于每个实例，您应适当更改证书和用户名。此清单显示了在我们的拓扑中应在\
  \ `CLUSTERNODE1` 上运行的命令。\n\n### 恢复证书\n\n```\nCREATE CERTIFICATE Node2Cert AUTHORIZATION\
  \ ClusterNode2_AOAG FROM FILE = 'C:\\\\Certificates\\\\Node2Cert.cer'\n```\n\n最后，现在证书已存在于每个节点上，我们可以继续在每个节点上创建\
  \ `database_mirroring` 端点。这可以通过清单 7-14 中的脚本实现。此脚本需要在每个节点上运行，并将证书更改为与节点匹配。\n\n###\
  \ 创建端点\n\n```\n--Create the endpoint\nCREATE ENDPOINT AOAG_Endpoint STATE = STARTED\
  \ AS TCP (\n      LISTENER_PORT = 5022,\n      LISTENER_IP = ALL\n) FOR DATABASE_MIRRORING\
  \ (\n      AUTHENTICATION = CERTIFICATE Node1Cert,\n      ROLE = ALL\n)\n--Grant\
  \ each user permissions to connect to the endpoint\nGRANT CONNECT ON ENDPOINT::AOAG_Endpoint\
  \ TO ClusterNode1_AOAG;\nGO\nGRANT CONNECT ON ENDPOINT::AOAG_Endpoint TO ClusterNode2_AOAG;\n\
  GO\n```\n\n您现在可以使用本书第 5 章中讨论的技术创建可用性组。\n\n## 分布式可用性组\n\n分布式可用性组 (`DAG`) 是可用性组的扩展，允许在两个独立的可用性组之间同步数据。这是一项令人兴奋的技术，具有许多不同的用例。例如，它允许在基于\
  \ Windows 和 Linux 的可用性组之间进行数据同步，它允许可读的辅助副本数量扩展到 8 之外（这是标准可用性组的限制），并且允许跨站点复制，而无需伸展集群的复杂性。分布式可用性组还可以通过在就地升级不可行且需要并行迁移时提供数据同步来帮助服务器迁移。它们也可以用作域独立可用性组的替代方案，当您在不同域中拥有服务器时。\n\
  \n虽然分布式可用性组的每一侧可以是 Windows 故障转移群集，但这不是必需的，因为重点非常集中在维护数据库上，并且不会进行群集配置。\n\n在本节中，我们将通过为我们在第\
  \ 5 章中创建的 HR 可用性组配置 DAG 来说明该技术，该组位于我们的 `ALWAYSON-C` 集群和一个名为 `Linux_AOAG` 的基于 Linux\
  \ 的可用性组之间，后者托管在两个参与 Pacemaker 集群的 Linux 服务器上。\n\n第一步是在 Linux 集群上创建分布式可用性组。这可以通过使用清单\
  \ 7-15 中的脚本实现。请注意 `WITH (DISTRIBUTED)` 语法，后跟每个可用性组的规范。\n\n> **注意**\n> 开始之前，您应从 HR\
  \ 可用性组中删除现有数据库；否则，它将无法加入分布式可用性组，因为辅助可用性组必须为空。\n\n```\nCREATE AVAILABILITY GROUP\
  \ DistributedAG\n   WITH (DISTRIBUTED)\n   AVAILABILITY GROUP ON\n      'HR' WITH\n\
  \      (\n         LISTENER_URL = 'tcp://HRListener.alwayson.com:1433',\n      \
  \   AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n\
  \         SEEDING_MODE = AUTOMATIC\n      ),\n      'Linux_AOAG' WITH\n      (\n\
  \         LISTENER_URL = 'tcp://LinuxListener:5022',\n         AVAILABILITY_MODE\
  \ = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n         SEEDING_MODE\
  \ = AUTOMATIC\n      );\nGO\n```\n\n我们现在可以针对 `PROSQLADMIN-C` 集群运行清单 7-16 中的命令，以将其加入分布式可用性组。\n\
  \n```\nALTER AVAILABILITY GROUP DistributedAG\n   JOIN\n   AVAILABILITY GROUP ON\n\
  \      'HR' WITH\n      (\n         LISTENER_URL = 'tcp://HRListener.alwayson.com:1433',\n\
  \         AVAILABILITY_MODE = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n\
  \         SEEDING_MODE = AUTOMATIC\n      ),\n      'Linux_AOAG' WITH\n      (\n\
  \         LISTENER_URL = 'tcp://LinuxListener:5022',\n         AVAILABILITY_MODE\
  \ = ASYNCHRONOUS_COMMIT,\n         FAILOVER_MODE = MANUAL,\n         SEEDING_MODE\
  \ = AUTOMATIC\n      )\n;\nGO\n```\n\n> **提示**\n> 数据库需要手动加入到辅助可用性组内的辅助副本中。\n\n##\
  \ 摘要\n\n可用性组提供大量灵活性，使 DBA 能够在几乎任何情况下配置高可用性、灾难恢复或读扩展。非典型可用性组拓扑的示例包括在 `Azure VMs`\
  \ 跨越配置可用性组、在没有底层集群的情况下配置可用性组，以及跨域或完全没有域的情况下配置可用性组。\n\n在 `Azure VMs` 中创建可用性组时，高可用性最好通过将虚拟机拆分到\
  \ `Availability Sets` 和 `Availability Zones` 来实现，而灾难恢复最好通过将 DR 节点放置在不同的 `Azure Region`\
  \ 中来实现。在此场景中，可以通过使用 `Azure paired regions` 来维护数据主权，这些区域位于相同的政治地理范围内，同时仍在地理上分散解决方案。\n\
  \n`Clusterless Availability Groups` 不能用于实现高可用性。这是因为没有集群来执行节点健康检查。然而，它们非常适合读扩展场景，在这些场景中可以避免集群组件的复杂性。\n\
  \n域独立可用性组（也称为 `workgroup availability groups`）允许在多个域之间或完全没有域的情况下配置可用性组。它们特别适合混合云场景，在这些场景中，您的组织选择在云中创建单独的域，而不是扩展其本地域。\n\
  \n\n\n分布式可用性组可用作混合云场景中域无关可用性组的替代方案。此外，它们还提供了跨平台分发数据的灵活性。例如，数据可以在基于 Windows 的可用性组和基于\
  \ Linux 的可用性组之间复制。\n\n基础可用性组提供了在运行 SQL Server Standard Edition 的实例上配置可用性组的选项。然而，如果你选择使用此功能，则功能有限。仅支持两个副本，并且每个可用性组只能有一个数据库。此外，没有使用只读路由的选项。\n\
  \n© Peter A. Carter 2020 P. A. CarterSQL Server 2019 AlwaysOn[`doi.org/10.1007/978-1-4842-6479-9_8`](https://doi.org/10.1007/978-1-4842-6479-9_8)\
  \ 开始摘要 \n"
- "# 8. 管理 AlwaysOn\n\nPeter A. Carter^(1 ) (1) Botley, UK 结束摘要 \n\n本章将讨论如何管理 AlwaysOn\
  \ 功能。我们首先将介绍集群维护，包括滚动修补程序升级和删除实例。然后我们将讨论可用性组的管理，包括如何同步和异步故障转移。我们还将研究如何对分布式可用性组进行故障转移。\n\
  \n还将讨论其他维护任务，例如同步实例级对象、对应用程序进行安全状态设置，以及向可用性组添加多个侦听器。本章最后将讨论如何暂停数据移动以及如何从可用性组中删除数据库。\n\
  \n## 管理集群\n\n从管理角度来看，安装集群并不是终点。你仍需定期执行维护任务。以下各节描述了一些最常见的维护任务。\n\n### 在节点之间移动实例\n\
  \n除了防止计划外中断之外，实现高可用性技术的一个好处是，它可显著减少维护任务（例如修补程序）的停机时间。这可以是操作系统级别或 SQL Server 级别。\n\
  \n如果您有一个双节点集群，请先将修补程序应用于被动节点。一旦您确信更新成功，请故障转移实例，然后将修补程序应用于另一个节点。此时，您可能希望或不希望故障转移回原始节点，这取决于环境的需要。例如，如果实例可用性的优先级高于一切，则可能不希望故障转移回来，因为这会造成另一次短暂中断。\n\
  \n要使用故障转移群集管理器将实例移动到不同的节点，请从包含实例的角色的上下文菜单中选择 Move ➤ Select Node。这将导致“移动群集角色”对话框显示。在此处，您可以选择要移动角色到的节点，如图\
  \ 8-1 所示。 ![图 8-1 ¶ 移动群集角色对话框](img/394392_3_En_8_Fig1_HTML.jpg)\n\n图 8-1 ¶ 移动群集角色对话框\n\
  \n然后角色将被移动到新节点。如果您在故障转移群集管理器中查看角色的资源窗口，则会看到每个资源依次经过 Online ➤ Offline Pending ➤ Offline\
  \ 状态。新节点现在显示为所有者，然后资源依次经过 Offline ➤ Online Pending ➤ Online 状态。资源将按照其依赖关系顺序离线并重新上线。\n\
  \n我们也可以使用 PowerShell 对角色进行故障转移。为此，我们需要使用 `Move-ClusterGroup` cmdlet。列表 8-1 通过使用\
  \ cmdlet 将 MSDTC 集群角色故障转移到 ClusterNode2 来演示这一点。我们使用 `-Name` 参数指定要移动的角色，使用 `-Node`\
  \ 参数指定要移动到的节点。\n```\nMove-ClusterGroup -Name ALWAYSON-MSDTC-C -Node ClusterNode2\n\
  ```\n列表 8-1 \n\n在节点之间移动角色\n\n### 滚动修补程序升级\n\n如果您有一个超过两个节点的集群，则在为 SQL Server 应用更新时，请考虑执行滚动修补程序升级。在此场景中，您可以降低不同节点（这些节点可能是角色的可能所有者）运行不同版本或修补程序级别的\
  \ SQL Server 的风险。\n\n首先，您应该列出所有可能是该角色所有者的节点。然后，选择其中 50% 的节点并将其从“可能所有者”列表中移除。您可以通过从名称资源的上下文菜单中选择“属性”，然后在“高级策略”选项卡中取消选中可能所有者列表中的节点来实现，如图\
  \ 8-2 所示。 ![图 8-2 ¶ 删除可能所有者](img/394392_3_En_8_Fig2_HTML.jpg)\n\n图 8-2 ¶ 删除可能所有者\n\
  \n要使用 PowerShell 实现相同的效果，我们可以使用 `Get-ClusterResource` cmdlet 导航到名称资源，然后管道输入 `Set-ClusterOwnerNode`\
  \ 来配置可能所有者列表。这在列表 8-2 中进行了演示。如果您配置多个可能所有者，则可能所有者列表以逗号分隔。\n```\nGet-ClusterResource\
  \ \"SQL Network Name (ALWAYSON-SQL-C)\" | Set-ClusterOwnerNode -Owners clusternode1\n\
  ```\n列表 8-2 \n\n配置可能所有者\n\n一旦 50% 的节点被移除为可能所有者，您应该将更新应用于这些节点。更新在此半数节点上验证后，您应重新配置它们以再次成为可能所有者。\n\
  \n下一步是将角色移动到您已升级的节点之一。故障转移成功完成后，在将更新应用于这些节点之前，从首选所有者列表中移除另一半节点。更新在此半数节点上验证后，您可以将它们返回到可能所有者列表。\n\
  \n提示 \n\n只能在资源上设置可能所有者。如果您使用 `-Group` 参数针对角色运行 `Set-ClusterOwnerNode`，则您配置的是首选所有者而不是可能所有者。\n\
  \n### 从集群中删除节点\n\n注意 \n\n如果您希望遵循本书中的后续演示，请勿遵循本节中的演示。\n\n如果您希望卸载 AlwaysOn 故障转移群集实例，则不能像卸载独立实例那样从控制面板执行此操作。相反，您必须在集群的每个节点上运行“删除节点”向导。您可以通过在\
  \ SQL Server 安装中心中的“维护”选项卡中选择“从 SQL Server 故障转移群集删除节点”选项来调用此向导。\n\n向导首先运行全局规则检查，然后运行删除节点的规则检查。然后，在图\
  \ 8-3 所示的“群集节点配置”页面上，您将被要求确认要删除节点的实例。如果群集托管多个实例，您可以从下拉框中选择适当的实例。 ![图 8-3 ¶ 群集节点配置页](img/394392_3_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3 ¶ 群集节点配置页\n\n在“准备删除节点”页面上，您将获得将要执行的任务的摘要。确认详细信息后，实例将被删除。此过程应在所有被动节点上重复，然后最后在活动节点上执行。当实例从最后一个节点中删除时，群集角色也将被删除。\n\
  \n要使用 PowerShell 删除节点，我们需要运行 SQL Server 的 `setup.exe` 应用程序，并将 action 参数配置为 `RemoveNode`。当您使用\
  \ PowerShell 删除节点时，表 8-1 中的参数是强制性的。表 8-1\n\n\n\n### 从集群中移除节点时所需的强制参数\n\n| 参数 | 用法\
  \ |\n|---|---|\n| `/ACTION` | 必须配置为 `RemoveNode`。 |\n| `/INSTANCENAME` | 你要添加额外节点以支持的实例。\
  \ |\n| `/CONFIRMIPDEPENDENCYCHANGE` | 允许为多子网集群指定多个 IP 地址。传入 `1` 表示 True，`0` 表示 False。\
  \ |\n\n清单 8-3 中的脚本在我们从 SQL Server 安装介质的根目录运行它时，会从我们的集群中移除一个节点。 `.\\setup.exe /ACTION=\"\
  RemoveNode\" /INSTANCENAME=\"ALWAYSON-SQL-C\" /CONFIRMIPDEPENDENCYCHANGE=0 /qs`\n\
  \n## 移除节点\n\n## 管理 AlwaysOn 可用性组\n\n一旦你的可用性组的初始设置完成，你仍需执行管理任务。这些包括故障转移可用性组、监控，以及在极少数情况下添加额外的侦听器。以下各节将讨论这些主题。\n\
  \n## 故障转移\n\n如果副本处于同步提交模式并且配置为自动故障转移，则在主副本满足错误条件时，可用性组会自动切换到冗余副本。然而，有时你需要手动故障转移可用性组。这可能是由于\
  \ DR 测试、主动维护，或需要在主副本或主数据中心发生故障后启动异步副本。\n\n### 同步故障转移\n\n如果你希望故障转移处于同步提交模式的副本，请在对象资源管理器中右键单击可用性组，从上下文菜单中选择“故障转移”以启动“故障转移可用性组”向导。跳过“简介”页后，你会看到“选择新的主副本”页（见图\
  \ 8-4）。在此页上，选中你想要故障转移到的副本的复选框。但在执行此操作之前，请查看“故障转移就绪状态”列，以确保副本已同步且不会发生数据丢失。\n\nFigure\
  \ 8-4 ¶ 选择新主副本页\n\n在图 8-5 所示的“连接到副本”页上，使用“连接”按钮建立与新主副本的连接。\n\nFigure 8-5 ¶ 连接到副本页\n\
  \n在“摘要”页上，你会看到要执行的任务详情，然后在“结果”页上显示进度指示器。故障转移完成后，请检查所有任务是否成功，并调查收到的任何错误或警告。\n\n我们也可以使用\
  \ T-SQL 来故障转移可用性组。清单 8-4 中的命令可实现相同结果。请确保从将成为新主副本的副本运行此脚本。如果你从当前主副本运行，请使用 `SQLCMD`\
  \ 模式并在脚本中连接到新主副本。\n\n```\nALTER AVAILABILITY GROUP HR FAILOVER;\nGO\n```\n\n故障转移可用性组\n\
  \n### 异步故障转移\n\n如果你的可用性组处于异步提交模式，从技术角度来看，你可以以与同步提交模式副本类似的方式进行故障转移，只是需要强制故障转移，从而接受数据丢失的风险。你可以使用清单\
  \ 8-5 中的命令强制故障转移。你应在将成为新主实例的实例上运行此脚本。为使其生效，集群必须拥有法定人数。如果没有，则需要在强制可用性组上线之前先强制集群上线。\n\
  \n```\nALTER AVAILABILITY GROUP HR FORCE_FAILOVER_ALLOW_DATA_LOSS;\n```\n\n强制故障转移\n\
  \n从流程角度来看，你只有在主站点完全不可用时才应这样做。如果不是这种情况，请先将应用程序置于安全状态。这可避免任何数据丢失的可能性。我在生产环境中通常通过执行以下步骤来实现：\n\
  \n1. 禁用登录。\n2. 将副本模式更改为同步提交模式。\n3. 故障转移。\n4. 将副本改回异步提交模式。\n5. 启用登录。\n\n你可以使用清单 8-6\
  \ 中的脚本执行这些步骤。从 DR 实例运行此脚本时，它会在故障转移前将 `HR` 中的数据库置于安全状态，然后重新配置应用程序以在正常操作下工作。\n\n```\n\
  --DISABLE LOGINS\nDECLARE @AOAGDBs TABLE ( DBName NVARCHAR(128) );\nINSERT INTO\
  \ @AOAGDBs SELECT database_name FROM sys.availability_groups AG INNER JOIN sys.availability_databases_cluster\
  \ ADC ON AG.group_id = ADC.group_id WHERE AG.name = 'HR';\nDECLARE @Mappings TABLE\
  \ ( LoginName NVARCHAR(128), DBname NVARCHAR(128), UserName NVARCHAR(128), AliasName\
  \ NVARCHAR(128) );\nINSERT INTO @Mappings EXEC sp_msloginmappings;\nDECLARE @SQL\
  \ NVARCHAR(MAX)\nSELECT DISTINCT @SQL = ( SELECT 'ALTER LOGIN [' + LoginName + ']\
  \ DISABLE; ' AS [data()] FROM @Mappings M INNER JOIN @AOAGDBs A ON M.DBname = A.DBName\
  \ WHERE LoginName <> SUSER_NAME() FOR XML PATH ('') )\nEXEC(@SQL)\nGO\n--SWITCH\
  \ TO SYNCHRONOUS COMMIT MODE\nALTER AVAILABILITY GROUP HR MODIFY REPLICA ON N'CLUSTERNODE3\\\
  ASYNCDR' WITH (AVAILABILITY_MODE = SYNCHRONOUS_COMMIT);\nGO\n--FAIL OVER\nALTER\
  \ AVAILABILITY GROUP HR FAILOVER\nGO\n--SWITCH BACK TO ASYNCHRONOUS COMMIT MODE\n\
  ALTER AVAILABILITY GROUP HR MODIFY REPLICA ON N'CLUSTERNODE3\\ASYNCDR' WITH (AVAILABILITY_MODE\
  \ = ASYNCHRONOUS_COMMIT);\nGO\n--ENABLE LOGINS\nDECLARE @AOAGDBs TABLE ( DBName\
  \ NVARCHAR(128) );\nINSERT INTO @AOAGDBs SELECT database_name FROM sys.availability_groups\
  \ AG INNER JOIN sys.availability_databases_cluster ADC ON AG.group_id = ADC.group_id\
  \ WHERE AG.name = 'HR';\nDECLARE @Mappings TABLE ( LoginName NVARCHAR(128), DBname\
  \ NVARCHAR(128), Username NVARCHAR(128), AliasName NVARCHAR(128) );\nINSERT INTO\
  \ @Mappings EXEC sp_msloginmappings\nDECLARE @SQL NVARCHAR(MAX)\nSELECT DISTINCT\
  \ @SQL = ( SELECT 'ALTER LOGIN [' + LoginName + '] ENABLE; ' AS [data()] FROM @Mappings\
  \ M INNER JOIN @AOAGDBs A ON M.DBname = A.DBName WHERE LoginName <> SUSER_NAME()\
  \ FOR XML PATH ('') );\nEXEC(@SQL)\n```\n\n将应用程序置于安全状态并进行故障转移\n\n### 故障转移分布式可用性组\n\
  \n分布式可用性组不支持自动故障转移；仅支持手动故障转移。当你需要在分布式可用性组内故障转移到辅助可用性组时，应执行以下步骤：\n\n* 将同步模式设置为同步提交。\n\
  * 等待辅助可用性组同步完成。\n* 将主可用性组设置为承担辅助角色。\n* 强制故障转移。\n\n\n\n列表 8-7 中的脚本将强制对第 6 章中讨论的分布式可用性组进行故障转移。\n\
  \n```sql\n--Set the secondary Availability Group to synchronous commit mode\nALTER\
  \ AVAILABILITY GROUP DistributedAG MODIFY AVAILABILITY GROUP ON 'HR' WITH\n(\n \
  \   LISTENER_URL = 'tcp://HRListener.alwayson.com:1433',\n    AVAILABILITY_MODE\
  \ = ASYNCHRONOUS_COMMIT,\n    FAILOVER_MODE = MANUAL,\n    SEEDING_MODE = MANUAL\n\
  ),\n'Linux_AOAG' WITH\n(\n    LISTENER_URL = 'tcp://LinuxListener:5022',\n    AVAILABILITY_MODE\
  \ = SYNCHRONOUS_COMMIT,\n    FAILOVER_MODE = MANUAL,\n    SEEDING_MODE = MANUAL\n\
  );\n--Wait until the Availability Groups are synchronized\nWHILE (SELECT COUNT(DISTINCT\
  \ synchronization_state_desc) FROM (\n    SELECT\n        ag.name\n        , drs.database_id\n\
  \        , drs.group_id\n        , drs.replica_id\n        , drs.synchronization_state_desc\n\
  \        , drs.end_of_log_lsn\n    FROM sys.dm_hadr_database_replica_states drs\n\
  \    INNER JOIN sys.availability_groups ag\n        ON drs.group_id = ag.group_id\n\
  \    WHERE ag.name = 'HR'\n        AND synchronization_state_desc = 'synchronized'\n\
  ) a ) > 1\nBEGIN\n    WAITFOR DELAY '00:00:05';\nEND\n--Assign the primary Availability\
  \ Group, the secondary role\nALTER AVAILABILITY GROUP DistributedAG SET (ROLE =\
  \ SECONDARY);\n--Force the failover\nALTER AVAILABILITY GROUP DistributedAG FORCE_FAILOVER_ALLOW_DATA_LOSS;\n\
  ```\n列表 8-7\n\n## 故障转移分布式可用性组\n\n### 同步非包含对象\n\n无论您使用何种方法进行故障转移，只要可用性组中的所有数据库都不是包含数据库，则需要确保实例级对象已同步。保持实例级对象同步的最简单方法是实现一个\
  \ `SSIS` 包，并按定期计划运行。\n\n无论您选择按计划执行 `SSIS` 包，还是选择其他方法，例如在辅助服务器上编写脚本并重新创建对象的 `SQL\
  \ Server Agent` 作业，以下是您应考虑同步的对象：\n* 登录\n* 凭据\n* SQL Server Agent 作业\n* 自定义错误消息\n\
  * 链接服务器\n* 服务器级事件通知\n* master 中的存储过程\n* 服务器级触发器\n* 加密密钥和证书\n\n### 添加多个侦听器\n\n通常，每个可用性组只有一个可用性组侦听器，但也有一些罕见的情况，您可能需要为同一个可用性组创建多个侦听器。如果您有使用硬编码连接字符串的旧版应用程序，则可能需要这样做。在这种情况下，您可以创建一个额外的侦听器，其客户端访问点与硬编码连接字符串的名称匹配。\n\
  \n如本章前面所述，不可能通过 SQL Server Management Studio、T-SQL 甚至 PowerShell 创建第二个可用性组侦听器。相反，我们必须使用\
  \ `Failover Cluster Manager`。在此，我们在 `HR` 角色内创建一个新的 `Client Access Point` 资源。为此，我们从\
  \ `HR` 角色的上下文菜单中选择 `Add Resource`，然后选择 `Client Access Point`。这将调用 `New Resource\
  \ Wizard`。向导的客户端访问点页面在图 8-6 中说明。您可以看到我们已输入客户端访问点的 DNS 名称，并为每个子网指定了 IP 地址。\n![图 8-6\
  \ ¶ 客户端访问点页面](img/394392_3_En_8_Fig6_HTML.jpg)\n图 8-6 ¶ 客户端访问点页面\n\n在“确认”页面上，我们会看到将要执行的配置摘要。在“配置客户端访问点”页面上，我们会看到进度指示器，然后在“摘要”页面上最终会看到完成摘要，如图\
  \ 8-7 所示。\n![图 8-7 ¶ 确认页面](img/394392_3_En_8_Fig7_HTML.jpg)\n图 8-7 ¶ 确认页面\n\n现在，我们需要将可用性组资源配置为依赖于新的客户端访问点。为此，我们从\
  \ `HR` 资源的上下文菜单中选择 `Properties`，然后导航到 `Dependencies` 选项卡。在此处，我们将新的客户端访问点添加为依赖项，并配置两个侦听器之间的\
  \ `OR` 约束，如图 8-8 所示。应用此更改后，客户端可以使用两个侦听器名称中的任何一个进行连接。\n![图 8-8 ¶ 依赖项选项卡](img/394392_3_En_8_Fig8_HTML.jpg)\n\
  图 8-8 ¶ 依赖项选项卡\n\n### 其他管理注意事项\n\n当使用 AlwaysOn 可用性组使数据库高度可用时，会施加若干限制。其中最严格的一项限制是数据库不能置于\
  \ `single_user` 模式或设为 `read only`。这会在您需要为维护而将应用程序置于安全状态时产生影响。这就是为什么在本章“故障转移”部分中，我们禁用了已映射到数据库用户的登录。如果您必须将数据库置于\
  \ `single-user` 模式，则必须先将其从可用性组中移除。\n\n可以通过运行列表 8-8 中的命令将数据库从可用性组中移除。此命令将 `Customers`\
  \ 数据库从 `Sales` 可用性组中移除。\n```sql\nALTER DATABASE Customers SET HADR OFF;\n```\n列表\
  \ 8-8\n从可用性组中移除数据库\n\n也有可能您希望数据库保留在可用性组中，但希望暂停向其他副本的数据移动。这通常是因为可用性组处于 `Synchronous\
  \ Commit` 模式，并且您有一个高利用率的时期，需要性能提升。您可以使用列表 8-9 中的命令暂停数据库的数据移动，该命令会暂停 `Sales` 数据库的数据移动然后恢复。\n\
  \n注意\n如果您暂停数据移动，主副本上的事务日志会继续增长，直到数据移动恢复并且数据库同步后，您将无法截断它。\n```sql\nALTER DATABASE\
  \ Sales SET HADR SUSPEND;\nGO\nALTER DATABASE Sales SET HADR RESUME;\nGO\n```\n\
  列表 8-9\n暂停数据移动\n\n另一个重要考虑因素是数据库和日志文件的放置位置。这些文件必须在每个副本上位于相同的位置。这意味着如果您使用命名实例，则必须更改数据和日志的默认文件位置，这是一个严格的技术要求，因为默认位置包含实例名称。当然，这假设您不会在每个节点上使用相同的实例名称，否则将违背使用命名实例的许多好处。\n\
  \n## 摘要\n\n主副本发生故障时，故障转移到同步副本是自动的。然而，也有需要手动故障转移的情况。这可能是因为需要故障转移到灾难恢复站点的灾难，也可能是为了主动维护。虽然可以故障转移到异步副本并可能导致数据丢失，但良好的做法是先将数据库置于安全状态。由于如果数据库参与可用性组，则无法将其置于\
  \ `read-only` 或 `single_user` 模式，因此安全状态通常包括禁用登录，然后在故障转移前切换到 `Synchronous Commit`\
  \ 模式。\n\n\n\n为了在整个企业中监控可用性组，您需要使用监控工具，例如系统操作中心。 然而，如果您需要监控少量可用性组或排查特定问题，则可以使用 SQL\
  \ Server 随附的工具之一，例如用于监控拓扑健康的仪表板，以及名为 AlwaysOn Health Trace 的扩展事件会话。\n\n实现 SQL Server\
  \ 高可用性的一个好处是，它可以最大限度地减少计划维护期间的停机时间。 在双节点群集中，您可以升级被动节点，进行故障转移，然后升级活动节点。 对于更大的群集，您可以执行滚动修补升级，这涉及从可能所有者列表中移除一半节点并对其进行升级。\
  \ 然后将实例故障转移到其中一个已升级的节点，并对剩余节点重复该过程。 这降低了在可能所有者之间出现混合版本的风险。\n"
- "# 9. 监控 AlwaysOn 可用性组\n\nPeter A. Carter (1) Botley, UK\n\n一旦您实施了可用性组，就需要监控它们并响应可能影响您数据可用性的任何错误或警告。\
  \ 如果您在整个企业中实施了许多可用性组，那么有效且全面地监控它们的唯一方法是使用企业监控工具，例如 SOC（系统操作中心）。 然而，如果您只有少量可用性组，或者您正在排查特定问题，则\
  \ SQL Server 提供了 AlwaysOn 仪表板和 AlwaysOn Health Trace。 您还可以创建自己的扩展事件会话来监控可用性组。 本章将讨论这些监控可能性。\n\
  \n## AlwaysOn 仪表板\n\nAlwaysOn 仪表板是一个交互式报告，允许您查看 AlwaysOn 环境的健康状况并钻取或汇总拓扑中的元素。 您可以从对象资源管理器中可用性组文件夹的上下文菜单中调用该报告，或从可用性组本身的上下文菜单中调用。\
  \ 图 9-1 显示了从 HR 可用性组的上下文菜单生成的报告。 您可以看到当前同步处于健康状态。 已使用添加/删除列按钮添加了估计恢复时间和估计数据丢失度量。\
  \ 当您拥有异步副本时，估计数据丢失很有帮助，以便在发生事件时评估影响。\n\n数据库可能处于的三种同步状态是 `SYNCHRONIZED`、`SYNCHRONIZING`\
  \ 和 `NOT SYNCHRONIZING`。 同步副本应处于 `SYNCHRONIZED` 状态，任何其他状态都是不健康的。 然而，异步副本永远不会处于 `SYNCHRONIZED`\
  \ 状态，而 `SYNCHRONIZING` 状态被认为健康。 无论模式如何，`NOT SYNCHRONIZING` 都表示副本未连接。\n\n图 9-1 ¶\
  \ 可用性组仪表板\n\n注意\n\n除了同步状态外，副本还具有以下其中一种操作状态：`PENDING_FAILOVER`、`PENDING`、`ONLINE`、`OFFLINE`、`FAILED`、`FAILED_NO_QUORUM`\
  \ 和 `NULL`（当副本断开连接时）。 副本的操作状态可以使用 `sys.dm_hadr_availability_replica_states` DMV\
  \ 查看。\n\n在报告的右上方，有指向故障转移向导的链接，我们在本章前面讨论过；我们将在下一节讨论的 AlwaysOn 健康事件；还有一个查看集群仲裁信息的链接。\
  \ 通过此链接调用的集群仲裁信息屏幕显示在图 9-2 中。\n\n图 9-2 ¶ 集群仲裁信息屏幕\n\n添加/删除列链接将显示上下文菜单，您可以在其中动态添加或删除显示中的列。\
  \ 图 9-3 显示已添加暂停和暂停原因。\n\n图 9-3 ¶ 添加/删除列\n\n您还可以钻取可用性副本窗口中的每个副本以查看副本特定详细信息。 分组依据按钮将允许您按副本、数据库、同步状态、故障转移就绪性或问题对可用性数据库进行分组。\n\
  \n## AlwaysOn Health Trace\n\nAlwaysOn Health Trace 是一个扩展事件会话，当您创建第一个可用性组时创建。 它可以在\
  \ SQL Server Management Studio 中找到，位于扩展事件 ➤ 会话下，通过其上下文菜单，您可以查看正在捕获的实时数据，或进入会话的属性以更改捕获事件的配置。\
  \ 它也可以通过 AlwaysOn 仪表板中的查看 AlwaysOn 健康事件链接访问。\n\n钻取会话会公开会话的包，从包的上下文菜单中，您可以查看以前捕获的事件。\
  \ 图 9-4 显示捕获的最新事件是数据库 5（在我们的例子中是 HR），它正在等待日志在同步副本上硬化。\n\n图 9-4 ¶ 目标数据\n\n在窗口顶部窗格中右键单击列标题将公开上下文菜单，该菜单允许您在特定列中搜索文本或值，按列中的值分组或按特定列对结果集进行排序。\
  \ 您还可以使用上下文菜单添加或删除结果集中的列。\n\n## 使用扩展事件监控 AlwaysOn\n\n扩展事件是 SQL Server 中的轻量级监控系统，使用\
  \ `WMI` 捕获事件。 由于架构使用系统资源很少，因此它们扩展性非常好，允许您以最小的用户活动影响监控实例。 它们也高度可配置，为您提供了从非常细粒度的详细信息（如页面拆分）到较粗粒度信息（如\
  \ CPU 利用率）的广泛捕获选项。 您还可以将扩展事件与操作系统数据相关联，以在排查问题时提供整体视图。 扩展事件的前身是 SQL Trace 及其 GUI，称为\
  \ Profiler，现已弃用。\n\n### 扩展事件概念\n\n扩展事件具有丰富的架构，由事件、目标、操作、谓词、类型、映射和会话组成。 这些工件存储在包中，而包又存储在模块中，模块可以是\
  \ `.dll` 或可执行文件。 我们将在以下各节中讨论这些概念。\n\n#### 包\n\n包是扩展事件中使用的对象的容器。 以下是 SQL Server 包的四种类型：\n\
  \n* `Package0` – 默认包，用于扩展事件系统对象。\n* `Sqlserver` – 用于 SQL Server 相关对象。\n* `Sqlos`\
  \ – 用于 SQLOS 相关对象。\n* `SecAudit` – 由 SQL Audit 使用；然而，其对象未公开。\n\n#### 事件\n\n\n\n\
  #### 事件分类\n\n事件是你可以追踪的感兴趣的发生。它可能是 SQL 批处理完成、缓存未命中或页面拆分，或数据库引擎中几乎任何其他可能发生的事情，具体取决于你配置的跟踪的性质。每个事件都按通道和关键字（也称为类别）进行分类。通道是高层次的分类，所有\
  \ SQL Server 2016 中的事件都属于表 9-1 中描述的通道之一。\n\n## 表 9-1 通道\n\n| 通道 | 描述 |\n|---|---|\n\
  | Admin | 众所周知的事件，具有众所周知的解决方案。例如，死锁、服务器启动、CPU 阈值被超过，以及使用已弃用的功能。 |\n| Operational\
  \ | 用于故障排除问题。例如，检测到损坏的内存、AlwaysOn 可用性组副本更改其状态，以及检测到长时间 IO，都是属于 Operational 通道的事件。\
  \ |\n| Analytic | 用于故障排除性能等问题的海量事件。例如，事务开始、获取锁以及文件读取完成，都是属于 Analytic 通道的事件。 |\n\
  | Debug | 由开发人员使用，通过返回内部数据来诊断问题。Debug 通道中的事件在 SQL Server 的未来版本中可能会发生变化，因此在可能的情况下应避免使用它们。\
  \ |\n\n关键字（或类别）更为精细。所有与 AlwaysOn 相关的事件都属于 `AlwaysOn` 和 `HADR` 类别。SQL Server 公开了\
  \ 122 个与 AlwaysOn 相关的事件。这些事件列在表 9-2 中。\n\n## 表 9-2 AlwaysOn 事件\n\n| 事件 | 描述 |\n\

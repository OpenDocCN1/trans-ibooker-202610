  \ |\n| `availability_replica_state_change` | 当可用性副本的状态发生变化时触发 |\n\n\n\n## 事件\n\n\
  | `availability_replica_manager_state_change` || 当可用性副本管理器的状态发生变化时触发 |\n| `availability_group_lease_expired`\
  \ || 当集群与可用性组之间存在连接问题，导致续租失败时触发 |\n| `availability_replica_automatic_failover_validation`\
  \ || 当故障转移验证副本作为主副本的就绪状态时触发 |\n| `availability_replica_database_fault_reporting`\
  \ || 当数据库向可用性副本管理器报告故障时触发 |\n| `before_redo_lsn_update` || 在 EOL 日志序列号更新之前立即触发 |\n\
  | `read_only_route_complete` || 当只读路由操作成功完成时触发 |\n| `read_only_route_fail` || 当只读路由操作失败时触发\
  \ |\n\n### 目标\n\n一个目标是事件的消费者；本质上，它是跟踪数据将被写入的设备。SQL Server 2016 中可用的目标在表 9-3 中详细说明。表\
  \ 9-3 \n目标 \n| 目标 || 同步/异步 || 描述 |\n| --- | --- | --- |\n| `Event counter` || 同步\
  \ || 统计会话期间发生的事件数量 |\n| --- | --- | --- |\n| `Event file` || 异步 || 将事件输出写入内存缓冲区，然后刷新到磁盘\
  \ |\n| `Event pairing` || 异步 || 确定配对事件是否在其匹配事件缺失的情况下发生，例如语句已开始但从未完成 |\n| `ETW` (Event\
  \ Tracking for Windows) || 同步 || 用于将扩展事件与操作系统数据关联 |\n| `Histogram` || 异步 || 根据操作或事件列统计会话期间发生的事件数量\
  \ |\n| `Ring buffer`  || 异步 || 使用先进先出（FIFO）方法将数据存储在内存缓冲区中 |\n\n### 操作\n\n也称为全局字段，操作是允许在事件触发时捕获额外信息的命令。当事件发生时，操作会同步触发，而事件本身并不感知该操作。有\
  \ 50 个操作可用，可让您捕获丰富的各类信息，包括导致事件触发的语句、语句运行的安全上下文、事务 ID、CPU ID 和调用堆栈。\n\n### 谓词\n\n\
  谓词是在系统将事件发送到目标之前可以应用的筛选条件。可以创建简单的谓词，例如基于数据库 ID 筛选完成的语句，但也可以创建更复杂的谓词，例如仅在发生超过两次时才捕获\
  \ AlwaysOn 可用性组副本的角色更改。\n谓词也完全支持短路求值。这意味着如果在谓词中使用多个条件，则谓词的顺序很重要，因为如果第一个谓词的求值失败，则不会求值第二个谓词。由于谓词是同步求值的，这可能会影响性能。因此，合理的做法是设计谓词，使最不可能求值为真的谓词放在最可能求值为真的谓词之前。\n\
  例如，假设您计划筛选特定数据库（数据库 ID 为 6），但该数据库占实例活动的很大比例。您还计划筛选特定用户 ID（UserA），该用户负责的活动比例很低。在此场景中，您将使用\
  \ `WHERE (([sqlserver].[username]='UserA') AND ([sqlserver].[database_id]=(6)))`\
  \ 谓词先筛选出与 UserA 无关的活动，然后再筛选出与数据库 ID 6 无关的活动。\n\n### 类型\n\n包内的所有对象都被分配一个类型。此类型用于解释对象字节集合中存储的数据。对象被分配以下类型之一：\
  \ \n* `Action`\n* `Event`\n* `Pred_compare` (从事件中检索数据)\n* `Pred_source` (比较数据类型)\n\
  * `Target`\n* `Type`\n\n### 映射\n\n一个映射是将内部 ID 值映射到 DBA 可以理解的字符串的字典。`Map` 键仅在其上下文中唯一，并在上下文之间重复。例如，在\
  \ `statement_recompile_cause` 上下文中，`map_key` 为 1 对应 `map_value` 为 `Schema Changed`。然而，在\
  \ `database_sql_statement` 类型的上下文中，`map_key` 为 1 对应 `map_value` 为 `CREATE DATABASE`。您可以使用\
  \ `sys.dm_xe_map_values` DMV 找到完整的映射列表。\n\n### 会话\n\n会话本质上是一个跟踪。它可以包含来自多个包的事件、操作、目标和谓词。当您启动或停止会话时，您是在打开或关闭跟踪。当会话启动时，事件会写入内存缓冲区，并在发送到目标之前应用谓词。因此，在创建会话时，您需要配置属性，例如会话可用于缓冲的内存量、如果会话遇到内存压力时可以丢弃哪些事件，以及在事件发送到目标之前的最大延迟。\n\
  \n## 创建事件会话以监视可用性组\n\n您可以使用 `New Session Wizard`、`New Session Dialog Box` 或通过 `T-SQL`\
  \ 创建事件会话。要使用 `New Session Wizard` 创建会话，请在 `Object Explorer` 中钻取 `Management ➤ Extended\
  \ Events`，并从 `Sessions` 的上下文菜单中选择 `New Session Wizard`。这将显示 `New Session Wizard`\
  \ 的介绍页。\n通过介绍页后，您将找到设置会话属性页，如图 9-5 所示。在这里，您可以为会话配置名称，并指定会话是否应在创建时自动启动。![图 9-5 ¶\
  \ 设置属性页](img/394392_3_En_9_Fig5_HTML.jpg)\n图 9-5 ¶ 设置属性页\n在向导的选择模板页中，如图 9-6 所示，您可以选择预定义的模板，这将为您常用的会话提供起点，或者您可以从空白画布开始并手动定义整个会话。我们将选择后者选项。![图\
  \ 9-6 ¶ 选择模板页](img/394392_3_En_9_Fig6_HTML.jpg)\n图 9-6 ¶ 选择模板页\n图 9-7 显示了选择要捕获的事件页。在这里，我们可以选择要包含在会话中的事件。为了本次演示的目的，假设我们经常看到辅助副本落后于主副本，并且我们正在尝试确定原因。具体来说，我们是否有\
  \ IO 瓶颈？因为我们试图回答一个非常具体的问题，所以要选择的事件很明确。我们需要 `hadr_db_marked_for_reseed` 事件来确定辅助副本何时落后，并且需要\
  \ `long_io_detected` 事件，以便将时间关联起来，看看是否存在模式。![图 9-7 ¶ 选择要捕获的事件页](img/394392_3_En_9_Fig7_HTML.jpg)\n\
  图 9-7 ¶ 选择要捕获的事件页\n捕获全局字段页将允许我们指定要捕获的任何操作。在我们的场景中，我们将捕获 `NT Username` 和 `SQLText`\
  \ 操作。这将使我们能够追踪任何长时间 IO，看看它们是否由低效查询引起。捕获全局字段页如图 9-8 所示。![图 9-8 ¶ 捕获全局字段页](img/394392_3_En_9_Fig8_HTML.jpg)\n\
  图 9-8 ¶ 捕获全局字段页\n\n\n\n## 设置会话事件筛选器\n设置会话事件筛选器页面，如图 9-9 所示，允许您在 `Session` 上配置 `Predicates`。我们将配置一个\
  \ `Predicate` 来筛选对系统数据库的操作。![Figure 9-9 ¶ 设置会话事件筛选器页面](img/394392_3_En_9_Fig9_HTML.jpg)\n\
  图 9-9 ¶ 设置会话事件筛选器页面\n\n## 指定会话数据存储\n向导中的指定会话数据存储页面是配置 `Target` 的位置。向导提供文件或环形缓冲区目标的选择，以及指定大小和滚动选项的选项。我们将配置文件目标，如图\
  \ 9-10 所示。![Figure 9-10 ¶ 指定会话数据存储](img/394392_3_En_9_Fig10_HTML.jpg)\n图 9-10 ¶\
  \ 指定会话数据存储\n\n## 摘要页\n向导的摘要页将确认向导将执行的操作。`Session` 创建后，完成页面将在退出时提供查看实时数据的选项。要使用 `T-SQL`\
  \ 创建相同的 `Session`，您可以使用列表 9-1 中的脚本。\n\n```sql\nCREATE EVENT SESSION AlwaysOnTrace\
  \ ON SERVER ADD EVENT sqlserver.hadr_db_marked_for_reseed(\n    ACTION(sqlserver.nt_username,sqlserver.sql_text)\n\
  \    WHERE (sqlserver.database_id>(4))), ADD EVENT sqlserver.long_io_detected(\n\
  \    ACTION(sqlserver.nt_username,sqlserver.sql_text)\n    WHERE (sqlserver.database_id>(4)))\
  \ ADD TARGET package0.event_file(SET filename='C:\\\\MSSQL\\\\ASlwaysOnTrace.xel')\
  \ WITH (MAX_MEMORY=4096 KB,EVENT_RETENTION_MODE=ALLOW_SINGLE_EVENT_LOSS,MAX_DISPATCH_LATENCY=30\
  \ SECONDS,MAX_EVENT_SIZE=0 KB,MEMORY_PARTITION_MODE=NONE,TRACK_CAUSALITY=OFF,STARTUP_STATE=ON)\
  \ ;\n```\n列表 9-1 \n创建事件会话\n\n### CREATE EVENT SESSION 参数\n`CREATE EVENT SESSION`\
  \ DDL 语句接受表 9-4 中详细说明的参数。表 9-4 \nCREATE EVENT SESSION 参数\n\n| 参数 || 描述 |\n| ---\
  \ | --- |\n| `event_session_name` || 指定您正在创建的事件会话的名称 |\n| --- | --- |\n| `ADD EVENT`\
  \ | `SET` || 对添加到会话中的每个事件重复，后跟事件名称，格式为 `package.event`。您可以使用 `SET` 语句设置事件特定的自定义，例如包含非强制性事件字段\
  \ |\n| `ACTION` || 如果有应为该事件捕获的全局字段，则在每个 `ADD EVENT` 参数之后指定 |\n| `WHERE` || 如果事件应与其关联谓词，则在每个\
  \ `ADD EVENT` 参数之后指定 |\n| `ADD TARGET` | `SET` || 为将添加到会话中的每个目标指定。您可以使用 `SET` 语句填充目标特定参数，例如\
  \ `event_file` 目标的 `filename` 参数 |\n\n### CREATE EVENT SESSION WITH 选项\n`CREATE\
  \ EVENT SESSION` 语句还接受多个 `WITH` 选项，详细说明在表 9-5 中。表 9-5 \nCREATE EVENT SESSION WITH\
  \ 选项\n\n| WITH 选项 || 描述 |\n| --- | --- |\n| `MAX_MEMORY` || 指定事件会话在将事件分派到目标之前用于缓冲事件的最大内存量\
  \ |\n| --- | --- |\n| `EVENT_RETENTION_MODE` || 指定缓冲区满时的行为。可接受的值为 `ALLOW_SINGLE_EVENT_LOSS`，表示如果所有缓冲区都已满，则可以丢弃单个事件；`ALLOW_MULTIPLE_EVENT_LOSS`，表示如果所有缓冲区都已满，则可以丢弃整个缓冲区；以及\
  \ `NO_EVENT_LOSS`，表示导致事件触发的任务需等待缓冲区有空间 |\n| `MAX_DISPATCH_LATENCY` || 指定事件在刷新到目标之前可在会话缓冲区中驻留的最长时间，以秒为单位\
  \ |\n| `MAX_EVENT_SIZE` || 指定任何单个事件的事件数据的最大可能大小。可以以千字节或兆字节为单位指定，并且应仅配置为允许大于 `MAX_MEMORY`\
  \ 设置的事件 |\n| `MEMORY_PARTITION_MODE` || 指定事件缓冲区创建的位置。可接受的值为• `NONE` – 表示缓冲区将在实例内创建• `PER_NODE` –\
  \ 表示缓冲区将为每个 NUMA 节点创建• `PER_CPU` – 表示将为每个 CPU 创建缓冲区 |\n| `TRACK_CAUSALITY`  || 指定将额外的\
  \ GUID 和序列号与每个事件一起存储，以便关联事件 |\n| `STARTUP_STATE` || • 指定会话在实例启动时是否自动启动。`ON` 表示会• `OFF`\
  \ 表示不会 |\n\n提示\n有关 Extended Events 的更深入讨论，我强烈推荐 Apress 出版的书籍 *Pro SQL Server 2019\
  \ Administration*，可从 [www.apress.com/gp/book/9781484250884](http://www.apress.com/gp/book/9781484250884)\
  \ 购买。\n\n## 摘要\nSQL Server 提供了丰富的工具来监控 AlwaysOn 可用性组的运行状况。AlwaysOn 仪表板是 SQL Server\
  \ Management Studio 中的交互式报表，可让您评估可用性组和副本的运行状况。它还提供链接以查看法定配置信息和实时运行状况数据。\n实时运行状况数据由扩展事件会话捕获，该会话在实例上创建第一个可用性组时创建，并在后台运行，捕获预配置的事件。可以自定义此跟踪；我建议将其保留为默认配置，并在需要自定义捕获时创建新的事件会话。\n\
  创建事件会话允许您根据需要捕获非常细粒度的关注点或仅粗粒度的信息。扩展事件使用 WMI 实现，是一种非常轻量级的框架，这意味着您可以识别问题和趋势，而不会影响实例的性能。\n\
  © Peter A. Carter 2020 P. A. CarterSQL Server 2019 AlwaysOn[`doi.org/10.1007/978-1-4842-6479-9\\\
  _10`](https://doi.org/10.1007/978-1-4842-6479-9_10) Begin Abstract "
- "# 10. 故障排除 AlwaysOn\nPeter A. Carter^(1 ) (1) Botley, UK   End Abstract \nSQL Server\
  \ 公开了大量与高可用性和灾难恢复对象相关的元数据，尤其是在 AlwaysOn 功能集周围。这些元数据可用于快速识别配置、查找问题的根本原因，或为可能发生的事件编写自动响应。以下各节将讨论可用的元数据并提供如何使用它的示例。\n\
  \n## AlwaysOn 故障转移群集实例元数据\n从数据库引擎内部，可以查看有关群集实例和承载它的 Windows 群集的大量元数据。这些信息对 DBA 来说可能非常宝贵。以下部分将介绍一些最有用和有趣的元数据对象。\n\
  \n### 发现承载实例的节点\n自然地，DBA 需要知道群集中哪个节点正在承载故障转移群集实例，尤其是在尝试诊断连接或性能问题时。然而，如果您的组织有政策不允许\
  \ DBA 访问操作系统，则无法使用 Failover Manager。幸运的是，SQL Server 中有一个 `DMV`（动态管理视图）会公开此信息。`sys.dm_os_cluster_nodes`\
  \ `DMV` 将返回表 10-1 中详细说明的列。表 10-1 \nsys.dm_os_cluster_nodes 列\n\n| 列 || 描述 |\n| ---\
  \ | --- |\n| `NodeName` || 集群节点名称 |\n| --- | --- |\n\n\n\n| `status` || 当前节点的状态。可能的值为• 0\
  \ – 表示节点已启动• 1 – 表示节点已关闭• 2 – 表示节点已暂停• 3 – 表示节点当前正在加入集群• 4 – 表示状态未知 |\n\n| `status_description`\
  \ || 状态的文本描述。可能的值为• 启动• 关闭• 已暂停• 加入中• 未知 |\n\n| `is_current_owner` || 表示实例是否当前由节点托管。可能的值为• 0\
  \ – 表示节点不拥有实例• 1 – 表示节点拥有实例 |\n\n列出 10-1 中的查询将返回当前托管实例的集群节点的名称。\n\n```\nSELECT NodeName\
  \ FROM sys.dm_os_cluster_nodes WHERE is_current_owner = 1;\n```\n列表 10-1\n\n发现托管实例的节点\n\
  \n## 查看运行状况检查配置\n\n如果在协助 Windows 管理团队处理集群实例的重复故障转移时，DBA 可能希望公开可能导致故障转移的条件详情，以确保配置了适当的级别。这可以通过使用\
  \ `sys.dm_os_cluster_properties` DMV 实现，该视图返回表 10-2 中详细列出的列。表 10-2\n\n`sys.dm_os_cluster_properties`\
  \ 列\n\n| Column || Description |\n\n| --- | --- |\n\n| `VerboseLogging` || 表示集群使用的日志级别。可能的值为• 0\
  \ – 表示日志已关闭• 1 – 表示仅记录错误• 2 – 表示记录错误和警告 |\n\n| --- | --- |\n\n| `SQLDumperDumpFlags`\
  \ || 指定 SQLDumper 将生成的转储文件类型。可能的值为• 0x0120 – 表示迷你转储• 0x0110 – 表示完整转储• 0x8100 – 表示筛选转储\
  \ |\n\n| `SQLDumperDumpPath` || 指定 SQLDumper 将输出转储文件的文件路径 |\n\n| `SQLDumperDumpTimeOut`\
  \ || SQLDumper 创建转储文件时的超时值。以毫秒为单位指定 |\n\n| `FailureConditionLevel` || 导致故障转移发生的故障级别。有关故障条件级别的完整描述，请参阅表\
  \ 10-3 |\n\n| `HealthCheckTimeout` || 数据库引擎在判定实例无响应之前等待返回健康信息的时间长度 |\n\n由 `FailureConditionLevel`\
  \ 列返回的可能故障条件级别在表 10-3 中详细说明。表 10-3\n\n故障条件级别\n\n| Condition Level || Description\
  \ |\n\n| --- | --- |\n\n| 0 || 自动故障转移不会发生 |\n\n| --- | --- |\n\n| 1 || 当 SQL Server\
  \ 服务关闭时自动故障转移会发生 |\n\n| 2 || 自动故障转移将在以下情况发生时发生• 满足级别 1 条件• 超过 `HealthCheckTimeout`\
  \ 值 |\n\n| 3 || 自动故障转移将在以下情况发生时发生• 满足级别 2 条件• 运行状况检查返回系统错误 |\n\n| 4 || 自动故障转移将在以下情况发生时发生• 满足级别\
  \ 3 条件• 运行状况检查返回资源错误 |\n\n| 5 || 自动故障转移将在以下情况发生时发生• 满足级别 4 条件• 运行状况检查返回查询处理错误 |\n\
  \n列出 10-2 中的查询将返回当前的故障转移条件级别和当前的运行状况检查超时值。\n\n```\nSELECT\n    FailureConditionLevel\n\
  \    , HealthCheckTimeout\nFROM sys.dm_os_cluster_properties;\n```\n列表 10-2\n\n\
  返回运行状况检查配置\n\n实例当前的运行状况可以通过使用 `sp_server_diagnostics` 系统存储过程手动确定。该过程接受一个参数：`@repeat_interval`，指定过程应多久返回一次结果，以秒为单位。如果省略参数，则结果仅返回一次。如果为参数传递值，则必须大于\
  \ 5。该过程返回表 10-4 中详细说明的结果集。表 10-4\n\n`sp_server_diagnostics` 返回的列\n\n| Column ||\
  \ Description |\n\n| --- | --- |\n\n| `creation_time` || 表示行创建时间 |\n\n| --- | ---\
  \ |\n\n| `component_type` || 表示组件的类型。可能的值为• Instance• AlwaysOn: 可用性组 |\n\n| `component_name`\
  \ || 表示组件的名称。可能的值为• system• resource• query_processing• io_subsystem• events• [可用性组名称]\
  \ |\n\n| `state` || 组件的运行状况。可能的值为• 0 – 表示状态未知• 1 – 表示状态正常（意味着健康）• 2 – 表示存在警告• 3\
  \ – 表示存在错误 |\n\n| `state_desc` || 组件状态的文本描述。可能的值为• 未知• 正常• 警告• 错误 |\n\n| `data`\
  \ || 组件特定数据的 XML 表示。例如，资源组件包括指定可用物理内存和可用虚拟内存的元素。它还包括属性，包括超出内存异常的计数 |\n\n列出 10-3\
  \ 中的脚本将返回 `sp_server_diagnostics` 系统存储过程的完整结果集，以及从 XML 列中提取的值，以便快速查看服务器整体 CPU 利用率、实例的\
  \ CPU 利用率以及可能发生的超出内存异常计数。\n\n提示\n\n关于 XML 分片的讨论超出了本书的范围。然而，我推荐 Apress 出版的 *SQL Server\
  \ DBA 专家脚本和自动化*，其中可以找到关于为管理目的处理 XML 的讨论。该书可在 [www.apress.com/9781484219423](http://www.apress.com/9781484219423)\
  \ 购买。\n\n```\nCREATE TABLE #Server_Diagnostics (\n    creation_time      DATETIME,\n\
  \    component_type     NVARCHAR(8),\n    component_name     NVARCHAR(128),\n  \
  \  [state]            TINYINT,\n    state_desc         NVARCHAR(8),\n    [data]\
  \             XML\n);\nINSERT INTO #Server_Diagnostics EXEC sp_server_diagnostics;\n\
  SELECT *,\n    data.value('(/system/@systemCpuUtilization)[1]','int') AS SystemCPUUtilization,\n\
  \    data.value('(/system/@sqlCpuUtilization)[1]','int') AS SQLServerCPU,\n    data.value('(/resource/@outOfMemoryExceptions)[1]','int')\
  \ AS OutOfMemoryExceptions\nFROM ##Server_Diagnostics;\nDROP TABLE #Server_Diagnostics;\n\
  ```\n列表 10-3\n\n检索诊断信息\n\n## AlwaysOn 可用性组元数据\n\n元数据也可以用于排查可用性组的问题。以下各节将讨论一些最有用和有趣的与可用性组相关的元数据对象。\n\
  \n### 确定上次故障转移原因\n\n如果可用性组已发生故障转移，您可能最想回答的第一个问题是“何时以及为什么？”。这个问题可以使用 `sys.dm_hadr_availability_replica_states`\
  \ DMV 回答。该对象返回表 10-5 中详细说明的列。表 10-5\n\n`sys.dm_hadr_availability_replica_states`\n\
  \n| Column || Description |\n\n| --- | --- |\n\n| `replica_id` || 副本的 GUID |\n\n\
  | --- | --- |\n\n| `group_id` || 可用性组的 GUID |\n\n| `is_local` || 表示副本是本地还是远程。可能的值为• 0\
  \ – 表示远程辅助副本• 1 – 表示本地副本 |\n\n| `role` || 表示当前分配给副本的角色。可能的值为• 0 – 表示角色当前正在解析• 1\
  \ – 表示副本具有主要角色• 2 – 表示副本当前具有辅助角色 |\n\n| `role_desc` || 副本当前角色的文本描述。可能的值为• 解析中• 主要• 辅助\
  \ |\n\n\n\n## 可用性副本状态列\n\n| 列 | 描述 |\n|---|---|\n| `operational_state` | 表示副本的当前运行状态。可能的值为\
  \ • 0 – 表示故障转移待处理 • 1 – 表示状态待处理 • 2 – 表示在线 • 3 – 表示离线 • 4 – 表示失败 • 5 – 表示失败，无仲裁\
  \ • NULL – 表示副本不是本地的 |\n| `operational_state_desc` | 运行状态的文本描述。可能的值为 • PENDING_FAILOVER\
  \ • PENDING • ONLINE • OFFLINE • FAILED • FAILED_NO_QUORUM • NULL |\n| `connected_state`\
  \ | 表示辅助副本当前是否连接到主副本。可能的值为 • 0 – 表示副本与主副本断开连接 • 1 – 表示副本已连接到主副本 |\n| `connected_state_desc`\
  \ | 连接状态的文本描述。可能的值为 • DISCONNECTED • CONNECTED |\n| `recovery_health` | 表示可用性组中数据库是否在线。可能的值为\
  \ • 0 – 表示至少有一个数据库未在线 • 1 – 表示所有数据库均在线 • NULL – 表示可用性组不是本地的 |\n| `recovery_health_desc`\
  \ | `recovery_health` 的文本描述。可能的值为 • ONLINE_IN_PROGRESS • ONLINE • NULL |\n| `synchronization_health`\
  \ | 表示可用性组数据库的同步状态。可能的值为 • 0 – 表示至少有一个数据库处于 NOT SYNCHRONIZING 状态。这称为不健康 • 1 – 表示至少有一个数据库未处于理想同步状态。这称为部分健康\
  \ 理想状态为 • SYNCHRONIZED – 用于同步提交副本 • SYNCHRONIZING – 用于异步提交副本 • 2 – 表示所有数据库均处于理想状态。这称为健康\
  \ |\n| `synchronization_health_desc` | 同步健康状态的文本描述。可能的值为 • NOT_HEALTHY • PARTIALLY_HEALTHY\
  \ • HEALTHY |\n| `last_connect_error_number` | 最后一次连接错误的错误号 |\n| `last_connect_error_description`\
  \ | 最后一次连接错误的描述 |\n| `last_connect_error_timestamp` | 最后一次连接错误的日期和时间 |\n\n## 确定最后一次故障转移的时间和原因\n\
  \nListing `10-4` 中的查询演示了如何返回最后一次连接错误的时间和原因。这将指示故障转移发生的时间和原因。每个副本和可用性组的组合将返回一行。你会注意到我们将\
  \ `sys.dm_hadr_availability_replica_states` DMV 连接到 `sys.availability_replicas`\
  \ 和 `sys.availability_groups` DMV，以检索托管副本的节点名称和可用性组名称。\n\n```sql\nSELECT\n    ar.replica_server_name\n\
  \    ,ag.name\n    ,ars.last_connect_error_description\n    ,ars.last_connect_error_timestamp\n\
  FROM sys.dm_hadr_availability_replica_states ars\nINNER JOIN sys.availability_replicas\
  \ ar\n    ON ar.group_id = ars.group_id\n    AND ars.replica_id = ar.replica_id\n\
  INNER JOIN sys.availability_groups ag\n    ON ag.group_id = ar.group_id;\n```\n\
  清单 10-4\n\n### 评估可用性数据库的状态\n\n你可能已经注意到，`sys.dm_hard_availability_replica_states`\
  \ DMV 会提供包含不健康状态数据库的可用性组的详细信息。然而，结果不够细化，无法让你发现哪些数据库不健康。此信息可以从 `sys.dm_hadr_database_replica_states`\
  \ DMV 中检索，该视图返回表 `10-6` 中详细列出的列。\n\n表 10-6\n`sys.dm_hadr_database_replica_states`\
  \ 列\n\n| 列 | 描述 |\n|---|---|\n| `database_id` | 数据库的 ID |\n| `group_id` | 可用性组 GUID\
  \ |\n| `replica_id` | 可用性副本 GUID |\n| `group_database_id` | 可用性组内的数据库 ID |\n| `is_local`\
  \ | 表示数据库是本地还是远程。可能的值为 • 0 – 表示数据库不是实例本地的 • 1 – 表示数据库是实例本地的 |\n| `is_primary_replica`\
  \ | 表示数据库副本当前是否具有主或辅助角色。可能的值为 • 0 – 表示辅助数据库副本 • 1 – 表示主数据库副本 |\n| `synchronization_state`\
  \ | 表示数据库同步的状态。可能的值为 • 0 – 表示未同步 • 1 – 表示正在同步 • 2 – 表示已同步 • 3 – 表示状态为回滚。这意味着辅助副本处于撤销阶段的部分，正在从主副本检索页面\
  \ • 4 – 表示状态为初始化。这意味着辅助副本处于撤销阶段的部分，所需的日志记录当前正在传输并硬化 |\n| `synchronization_state_desc`\
  \ | 同步状态的文本描述。可能的值为 • NOT SYNCHRONIZING • SYNCHRONIZING • SYNCHRONIZED • REVERTING\
  \ • INITIALIZING |\n| `is_commit_participant` | 表示事务提交是否已同步。异步副本上的数据库始终报告 0，且该值仅对同步副本上的主数据库准确。可能的值为\
  \ • 0 – 表示事务提交未同步 • 1 – 表示事务提交已同步 |\n| `synchronization_health` | 表示数据库的同步状态。可能的值为\
  \ • 0 – 表示不健康。这意味着数据库未同步 • 1 – 表示部分健康。这意味着数据库正在同步 • 2 – 表示健康。这意味着数据库已同步 |\n| `synchronization_health_desc`\
  \ | 同步健康的文本描述。可能的值为 • NOT_HEALTHY • PARTIALLY_HEALTHY • HEALTHY |\n| `database_state`\
  \ | 表示数据库的当前状态。该值反映 `sys.databases` 目录视图中的值。可能的值为 • 0 – 表示数据库为联机 • 1 – 表示数据库正在还原\
  \ • 2 – 表示数据库正在恢复 • 3 – 表示数据库处于恢复挂起状态 • 4 – 表示数据库为可疑 • 5 – 表示数据库处于紧急模式 • 6 – 表示数据库为脱机\
  \ |\n| `database_state_desc` | 数据库状态的文本描述。可能的值为 • ONLINE • RESTORING • RECOVERING\
  \ • RECOVERY_PENDING • SUSPECT • EMERGENCY • OFFLINE |\n| `is_suspended` | 表示数据库是否已挂起。可能的值为\
  \ • 0 – 表示已恢复 • 1 – 表示已挂起 |\n| `suspend_reason` | 如果数据库已挂起，`suspend_reason` 列指示原因。可能的值为\
  \ • 0 – 表示用户手动挂起数据移动 • 1 – 表示强制故障转移后的挂起 • 2 – 表示在重做阶段发生错误 • 3 – 表示在日志捕获期间发生错误 •\
  \ 4 – 表示写入日志时发生错误 • 5 – 表示数据库在重新启动前已挂起 • 6 – 表示在撤销阶段发生错误 • 7 – 表示日志链不匹配错误 • 8 –\
  \ 表示在计算辅助副本同步点时发生错误 |\n| `suspend_reason_desc` | `suspend_reason` 列的文本描述。可能的值为 •\
  \ SUSPEND_FROM_USER • SUSPEND_FROM_PARTNER • SUSPEND_FROM_REDO • SUSPEND_FROM_CAPTURE\
  \ • SUSPEND_FROM_APPLY • SUSPEND_FROM_RESTART • SUSPEND_FROM_UNDO • SUSPEND_FROM_REVALIDATION\
  \ • SUSPEND_FROM_XRF_UPDATE |\n\n\n\n### 副本状态列\n\n| 列 | 描述 |\n|---|---|\n| `recovery_lsn`\
  \ | 在主副本上，`recovery_lsn` 表示事务日志的末尾（用于时间点恢复的事务日志中的最终点）。在辅助副本上，该列表示需要重新同步的点。然而，如果该值等于或大于\
  \ `last_hardened_lsn`，则表示不需要重新同步 |\n| `truncation_lsn` | 对于主副本，该列表示所有辅助副本中最小的日志截断\
  \ LSN。对于辅助副本，该列表示该特定数据库副本的日志截断点 |\n| `last_sent_lsn` | 表示已发送的最后一个日志块的末尾 |\n| `last_sent_time`\
  \ | 最后日志块发送的日期和时间 |\n| `last_recieved_lsn` | 表示要接收的最后一个日志块的末尾 |\n| `last_hardened_lsn`\
  \ | 表示要硬化的最后一个日志块的开始。对于异步提交副本，该值将为 NULL |\n| `last_hardened_time` | 已硬化 LSN 的日期和时间\
  \ |\n| `last_redone_lsn` | 辅助副本上要重做的最后一个日志记录的 LSN |\n| `last_redone_time` | 辅助副本上要重做的最后一个\
  \ LSN 的时间戳 |\n| `log_send_queue_size` | 尚未发送到辅助副本的日志记录的大小，以千字节为单位指定 |\n| `log_send_rate`\
  \ | 向辅助副本发送日志记录的速度，以千字节/秒为单位指定 |\n| `filestream_send_rate` | 向辅助副本发送 FILESTREAM\
  \ 文件的速度，以千字节/秒为单位指定 |\n| `end_of_log_lsn` | 日志缓存中最终日志记录的 LSN |\n| `last_commit_lsn`\
  \ | 事务日志中最后一个已提交事务的 LSN |\n| `last_commit_time` | 事务日志中最后一个已提交 LSN 的时间戳 |\n| `low_water_mark_for_ghosts`\
  \ | 幽灵清理任务（物理删除已逻辑删除的行）使用数据库所有副本中该列的最小值来确定开始清理记录的位置 |\n| `secondary_log_seconds`\
  \ | 辅助副本落后于主副本的秒数 |\n\n### 评估可用性数据库的状态\n\nListing 10-5 中的脚本演示了如何在 HR 可用性组中评估可用性数据库的健康状况。你会注意到我们使用\
  \ `DB_NAME()` 函数返回数据库的名称，并将 `sys.dm_hadr_database_replica_states` DMV 连接到 `sys.availability_groups`\
  \ 和 `sys.availability_replicas` 目录视图，以返回可用性组和副本的名称。\n\n```sql\nSELECT\n    DB_NAME(database_id),\n\
  \    ag.name,\n    ar.replica_server_name,\n    is_primary_replica,\n    synchronization_state_desc,\n\
  \    synchronization_health_desc,\n    database_state_desc\nFROM sys.dm_hadr_database_replica_states\
  \ drs\nINNER JOIN sys.availability_groups ag\n    ON drs.group_id = ag.group_id\n\
  INNER JOIN sys.availability_replicas ar\n    ON drs.replica_id = ar.replica_id\n\
  WHERE ag.name = 'HR';\n```\nListing 10-5 评估可用性数据库的状态\n\n## 摘要\n\nSQL Server 公开了大量元数据，可帮助您排查问题并审核配置。虽然本章讨论了一些最有用的元数据，但我强烈建议您进一步探索\
  \ hadr DMVs。\n\n对于故障转移群集实例，`sys.dm_os_cluster_nodes` DMV 公开了群集中节点的健康状态。进一步的故障排除详细信息可以通过调用\
  \ `sp_server_diagnostics` 系统存储过程找到。\n\n提示\n\n`sp_server_diagnostics` 系统存储过程也可用于排查\
  \ AlwaysOn 可用性组的问题，并为实例上托管的每个可用性组返回一行。\n\n`sys.dm_hadr_availability_replica_states`\
  \ DMV 公开了托管 AlwaysOn 可用性组的副本的健康状态详细信息。要深入查看参与可用性组的数据库的健康状态，可以查询 `sys.dm_hadr_database_replica_states`\
  \ DMV。\n\n前面提到的两个 DMV 都可以连接到 `sys.availability_groups` 和 `sys.availability_replicas`\
  \ DMV，以获取有关配置的文本信息，而不是 GUID。`sys.dm_hadr_database_replica_states` DMV 还可以连接到 `sys.databases`\
  \ 以获取有关数据库配置的进一步信息。\n\n\n\n"

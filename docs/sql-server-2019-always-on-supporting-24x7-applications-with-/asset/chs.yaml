  ## 数据库引擎配置页


  ### 服务器配置选项卡


  数据库引擎配置页包含六个选项卡。其中第一个是服务器配置选项卡，如图 4-13 所示。在这里，我们指定实例将使用的身份验证模式。

  ![图 4-13 ¶ 安装 SQL Server 故障转移群集 – 服务器配置选项卡](img/394392_3_En_4_Fig13_HTML.jpg)

  图 4-13 ¶ 安装 SQL Server 故障转移群集 – 服务器配置选项卡


  `Windows Authentication Mode` 意味着用户在登录 Windows 时提供的凭据将被传递给 SQL Server，用户无需提供其他凭据即可访问实例。使用
  `mixed mode`，尽管仍可使用 Windows 凭据访问实例，但用户也可以获得第二层凭据。如果选择此选项，则 SQL Server 将保存实例内部创建的登录名和密码，用户可以提供这些凭据以获得访问权限，即使其
  Windows 身份没有权限。


  出于安全最佳实践，只允许对实例使用 Windows 身份验证是个好主意。这有两个原因。首先，仅使用 Windows 身份验证，如果攻击者获得了对网络的访问权限，他们仍然无法访问
  SQL Server，因为他们没有具有正确权限的有效 Windows 帐户。然而，使用混合模式身份验证，一旦进入网络，攻击者就可以使用暴力攻击或其他黑客方法尝试通过第二层
  SQL Server 登录名获得访问权限。其次，如果您指定混合模式身份验证，则需要创建 `SA` 帐户。`SA` 帐户是具有对实例管理权限的 SQL Server
  用户帐户。如果该帐户的密码被泄露，攻击者可能会获得对 SQL Server 的管理控制权。如果必须使用混合模式身份验证，最好禁用 `SA` 帐户。


  然而，在某些情况下混合模式身份验证是必要的。例如，您可能有一个不支持 Windows 身份验证的旧版应用程序，或一个具有硬编码连接且使用第二层身份验证的第三方应用程序。这将是混合模式身份验证可能需要的两个有效原因。另一个有效原因是如果您有需要从不受信任的域访问实例的用户。


  此外，在服务器配置选项卡上，您可以指定将添加到 `sysadmin` 固定服务器角色的 Windows 用户，从而授予他们对实例的无限制访问权限。在我们的场景中，我们将添加
  `AlwaysOn\\SQLAdmin` 用户作为实例管理员，并仅使用 Windows 身份验证。


  ### 数据目录选项卡


  在数据目录选项卡上，如图 4-14 所示，您可以更改数据根目录的默认位置。在此屏幕上，您还可以更改用户数据库及其日志文件的默认位置。最后，此选项卡允许您指定将进行的数据库备份的默认位置。在我们的场景中，我们必须确保数据根指向
  `Data` 卷，日志文件指向 `Logs` 卷。

  ![图 4-14 ¶ 安装 SQL Server 故障转移群集 – 数据目录选项卡](img/394392_3_En_4_Fig14_HTML.jpg)

  图 4-14 ¶ 安装 SQL Server 故障转移群集 – 数据目录选项卡




  ## SQL Server 故障转移群集配置


  ### TempDB 选项卡

  `TempDB` 选项卡显示在图 4-15 中。此选项卡允许您配置 `TempDB` 数据库的属性。这很重要，因为 `TempDB` 需要正确的大小和处理器设置以避免成为实例的瓶颈。设置将默认为推荐配置，即每个处理器核心一个文件，最多八个。这被认为是最理想的文件数量，以避免对系统页面（如
  `GAM`、`SGAM` 和 `PFS` 页面）的争用。`TempDB` 的正确大小应通过容量规划练习来估算。我们将配置 `TempDB` 的初始大小为每个文件
  60MB（总计 240MB）。我们还将 `TempDB` 配置为驻留在 `TempDB` 卷上。在我们的场景中，我们还将设置文件位置指向我们的 `TempDB`
  卷。

  ![图 4-15 ¶ 安装 SQL Server 故障转移群集 – TempDB 选项卡](img/394392_3_En_4_Fig15_HTML.jpg)

  图 4-15 ¶ 安装 SQL Server 故障转移群集 – TempDB 选项卡


  ### MaxDOP 选项卡

  `MaxDOP` 选项卡显示在图 4-16 中，允许您配置实例内运行查询的默认最大并行度。默认值是根据可用核心数计算得出，最多为八个。然而，如果需要，可以覆盖此设置。例如，对于托管小型数据库且工作负载配置文件为
  `OLTP`（联机事务处理）的实例，其中同时运行许多小型查询，有时最好降低 `MaxDOP` 值。


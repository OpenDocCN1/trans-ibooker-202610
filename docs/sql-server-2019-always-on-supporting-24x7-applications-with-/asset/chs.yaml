  ## 添加节点

  安装群集时下一步应执行的操作是添加第二个节点。未能添加第二个节点会导致实例保持在线，但没有高可用性，因为第二个节点无法接管角色的所有权。要配置第二个节点，您需要登录到被动群集节点并从
  `SQL Server Installation Center` 的 Installation 选项卡中选择 `Add Node to SQL Server Failover
  Cluster` 选项。这会调用 `Add a Failover Cluster Node Wizard`。此向导的第一页是 `Product Key` 页面。就像安装实例时一样，您需要使用此屏幕为
  `SQL Server` 提供产品密钥。不指定产品密钥只会让您选择安装 `Evaluation Edition`，并且由于它在 180 天后过期，因此对于高可用性来说可能不是最明智的选择。


  向导接下来的 `License Terms` 页面要求您阅读并接受 `SQL Server` 的许可条款。此外，您需要指定是否希望参与 `Microsoft`
  的 `Customer Experience Improvement Program`。如果您选择此选项，则错误报告将被捕获并发送到 `Microsoft`。


  在您接受许可条款后，会运行规则检查以确保满足所有条件，以便您可以继续安装。在向导检查 `Microsoft` 更新并安装安装所需设置文件后，会进行另一次规则检查，以确保将节点添加到群集的规则得到满足。




  ## 使用向导添加节点


  在“群集节点配置”页上，如图 4-19 所示，您将被要求确认要添加节点的实例名称。如果群集上有多个实例，则可以使用下拉框选择适当的实例。


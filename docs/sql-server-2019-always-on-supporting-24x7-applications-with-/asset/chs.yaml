  结束摘要 一旦群集构建并配置完成，就该安装 SQL Server AlwaysOn 故障转移群集实例了。在我们的场景中，我们希望构建一个群集实例，该实例跨越我们在第
  3 章构建的 Windows 群集的两个节点。我们还将讨论如何使用 PowerShell 构建故障转移群集实例。为此，我们需要在群集的主节点上使用“安装 SQL
  Server 故障转移群集”向导。然后我们需要运行“添加节点”向导，以允许被动节点在故障转移时托管实例。因此，在本章中，我们将执行以下任务：

  * 在活动群集节点上安装 SQL Server 故障转移群集实例。

  * 配置向导的被动节点以支持故障转移群集实例。



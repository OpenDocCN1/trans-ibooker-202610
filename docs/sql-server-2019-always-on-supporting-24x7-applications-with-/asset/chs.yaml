  ## 功能选择页面


  在向导的功能选择页面上，如图 4-6 所示，您将选择要安装的 SQL Server 2019 产品套件的功能。为本书的目的，我们将选择安装数据库引擎和 SQL
  Server Integration Services (`SSIS`)。 ![图 4-6 ¶ 安装 SQL Server 故障转移群集向导 – 功能选择页面](img/394392_3_En_4_Fig6_HTML.jpg)


  图 4-6 ¶ 安装 SQL Server 故障转移群集向导 – 功能选择页面


  值得注意的是，`SSIS` 不具备群集感知功能，也不是为群集而设计的。在某些情况下，您可能会决定对 Integration Services 服务进行群集，如果是这种情况，则可以通过创建类型为
  `Generic` 的群集角色并将 Integration Services 服务添加为依赖项来解决此限制。然而，在大多数情况下，管理群集实例上的 `SSIS`
  的最合适方法是在群集的每个节点上将 Integration Services 服务作为独立服务安装。


  此外，向导的功能选择页面要求您指定实例根文件夹和共享功能文件夹的位置。您可能希望将它们移动到不同的驱动器，以便将 `C:\\` 驱动器留给操作系统。这可能是出于空间原因的考虑，或者只是为了将
  SQL Server 二进制文件与其他应用程序隔离。


  实例根目录通常包含您在服务器上创建的每个实例的文件夹，并且数据库引擎、`SSAS` 和 `SSRS` 安装将有单独的文件夹。与数据库引擎关联的文件夹将称为 `MSSQL15.[InstanceName]`，其中实例名称是实例的名称，或对于默认实例为
  `MSSQLSERVER`。文件夹名称中的数字 15 与 SQL Server 的版本相关，对于 SQL Server 2019 为 15。


  该文件夹将包含一个名为 `MSSQL` 的子文件夹，其中反过来将包含存储与实例关联的文件的文件夹，包括一个名为 `Binn` 的文件夹，其中包含与实例关联的应用程序文件、应用程序扩展和
  XML 配置；一个名为 `Backup` 的文件夹，将是数据库备份的默认位置；以及一个名为 `Data` 的文件夹，将是系统数据库的默认位置。


  `TempDB`、用户数据库和备份的默认文件夹可以在安装过程中稍后修改，将这些数据库拆分到单独的卷中通常是一个良好的实践，但如果您的数据位于 SAN 上（如第
  3 章所述），则可能不是必要的（甚至不可能）。这里还将创建其他文件夹，包括一个名为 `LOGS` 的文件夹，将是错误日志和默认扩展事件运行状况跟踪文件的默认位置。


  如果您在 64 位环境中安装 SQL Server，您将被要求输入共享功能目录的 32 位和 64 位版本的文件夹。这是因为某些 SQL Server 组件始终作为
  32 位进程安装。32 位和 64 位组件不能共享目录，因此要继续安装，您必须为这些选项中的每一个指定不同的文件夹。共享功能目录成为所有 SQL Server
  实例共享的功能的根级目录，例如 `SDKs` 和管理工具。



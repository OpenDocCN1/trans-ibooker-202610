- "# 1. 高可用性和灾难恢复概念\n\nPeter A. Carter^(1 ) (1) Botley, UK 结束摘要\n\n在当今运行关键任务应用程序的\
  \ 24×7 环境中，企业在很大程度上依赖于其数据的可用性。虽然服务器及其软件通常是可靠的，但硬件故障或软件错误仍有可能导致服务器宕机，从而带来风险。为了减轻这些风险，业务关键型应用程序通常依赖冗余硬件来提供容错能力。如果主系统发生故障，则应用程序可以自动故障转移到冗余系统。这就是高可用性（HA）的基本原理。\n\
  \n即使实施了 HA 技术，应用程序变得不可用的事件仍存在很小的风险。这可能是由于重大事故，例如自然灾害或恐怖行为导致数据中心丢失。也可能是由于数据损坏或人为错误导致应用程序数据丢失或损坏无法修复。\n\
  \n在这些情况下，一些应用程序可能会依赖于恢复最新的备份来尽可能多地恢复数据。然而，更关键的应用程序可能需要冗余服务器在二级位置保存数据的同步副本。这就是灾难恢复（DR）的基本概念。本章讨论\
  \ HA 和 DR 背后的概念。\n\n## 可用性级别\n\n解决方案可供终端用户使用的时长称为 *可用性级别*，或 *正常运行时间*。为了提供正常运行时间的真实图景，公司应从用户桌面衡量解决方案的可用性。换句话说，即使您的\
  \ SQL Server 已不间断运行超过一个月，用户仍可能因其他因素而经历解决方案的中断。这些因素可能包括网络中断或应用程序服务器故障。\n\n然而，在某些情况下，您别无选择，只能在\
  \ SQL Server 级别衡量可用性级别。这可能是因为企业内部缺乏整体监控工具。最常见的是，在实例级别衡量可用性级别的要求是政治上的，而非技术上的。在 IT\
  \ 行业，已成为一种趋势，即将数据中心的运营外包给第三方提供商。在这种情况下，负责管理 SQL 服务器的提供商可能不一定是负责网络或应用程序服务器的提供商。在这种情况下，您需要在\
  \ SQL Server 级别监控正常运行时间，以准确判断服务提供商的性能。\n\n\n\n\n## 可用性\n\n可用性水平以应用程序或服务器可用时间的百分比来衡量。公司通常力求达到\
  \ 99%、99.9%、99.99% 或 99.999% 的可用性。因此，可用性水平通常以 9 的数量来表示。例如，五個 9 的可用性意味着 99.999% 的正常运行时间，而三个\
  \ 9 意味着 99.9% 的正常运行时间。\n\n## 可用性级别\n\n表 1-1 详细说明了每周、每月和每年每个可用性级别可接受的停机时间。表 1-1\n\
  \n可用性级别\n\n| 可用性级别 | 每周停机时间 | 每月停机时间 | 每年停机时间 |\n|---|---|---|---|\n| 99% | 1 小时，40\
  \ 分钟，48 秒 | 7 小时，18 分钟，17 秒 | 3 天，15 小时，39 分钟，28 秒 |\n| 99.9% | 10 分钟，4 秒 | 43 分钟，49\
  \ 秒 | 8 小时，45 分钟，56 秒 |\n| 99.99% | 1 分钟 | 4 分钟，23 秒 | 52 分钟，35 秒 |\n| 99.999% |\
  \ 6 秒 | 26 秒 | 5 分钟，15 秒 |\n\n*所有值均向下舍入到最接近的秒。*\n\n要计算其他可用性级别，您可以使用列表 1-1 中的脚本。在运行此脚本之前，将\
  \ `@Uptime` 的值替换为要计算的正常运行时间级别。您还应将 `@UptimeInterval` 的值替换为每周、每月或每年的正常运行时间。\n\n```sql\n\
  DECLARE @Uptime DECIMAL(5,3); --Specify the uptime level to calculate\nSET @Uptime\
  \ = 99.9;\nDECLARE @UptimeInterval VARCHAR(5); --Specify WEEK, MONTH, or YEAR\n\
  SET @UptimeInterval = 'YEAR';\nDECLARE @SecondsPerInterval FLOAT; --Calculate seconds\
  \ per interval\nSET @SecondsPerInterval = (\n    SELECT CASE\n        WHEN @UptimeInterval\
  \ = 'YEAR' THEN 60*60*24*365.243\n        WHEN @UptimeInterval = 'MONTH' THEN 60*60*24*30.437\n\
  \        WHEN @UptimeInterval = 'WEEK' THEN 60*60*24*7\n    END\n);\nDECLARE @UptimeSeconds\
  \ DECIMAL(12,4); --Calculate uptime\nSET @UptimeSeconds = @SecondsPerInterval *\
  \ (100-@Uptime) / 100;\n--Format results\nSELECT\n    CONVERT(VARCHAR(12), FLOOR(@UptimeSeconds\
  \ /60/60/24)) + ' Day(s), '\n    + CONVERT(VARCHAR(12), FLOOR(@UptimeSeconds /60/60\
  \ % 24)) + ' Hour(s), '\n    + CONVERT(VARCHAR(12), FLOOR(@UptimeSeconds /60 % 60))\
  \ + ' Minute(s), '\n    + CONVERT(VARCHAR(12), FLOOR(@UptimeSeconds % 60)) + ' Second(s).';\n\
  ```\n\n列表 1-1\n计算可用性级别\n\n### 实际可用性\n\n现在我们了解了如何计算应用程序所需的可用性级别，我们还应了解如何计算应用程序的实际可用性。我们可以通过确定\
  \ MTBF（平均故障间隔时间）和 MTTR（平均恢复时间）指标来实现。\n\nMTBF 指标描述了两次故障之间的平均时间长度。例如，假设我们正在审查过去一周的服务日志，发现\
  \ Foo 应用程序发生了三次中断。一周有 168 小时，发生了三次故障。我们只需将时间段内的小时数除以故障次数即可。这将产生我们的 MTBF。在这种情况下，我们的\
  \ MTBF 为 56 小时。\n\nMTTR 实际上有两个不同的含义：平均恢复时间或平均修复时间。当没有部署 HA 或 DR 时，MTTR 指标描述的是损坏的东西被修复所需的平均时间长度。这可能是一个较长的时期，因为我们可能需要等待服务工程师更换故障硬件。然而，在考虑\
  \ HA 和 DR 时，我们使用 MTTR 指标来表示平均恢复时间，以记录停机的持续时间。例如，如果我们有一个三节点集群，其中一个节点出现硬件故障，当然我们需要修复此服务器，但从应用程序停机角度来看，我们只会有几秒钟或几分钟的停机时间，同时服务进行故障转移并且我们仍然具有弹性，这意味着应用程序的非功能性需求不受影响。因此，在本例中，我假设\
  \ MTTR 指的是“平均恢复时间”。\n\n我们可以通过对我们期间内的总停机持续时间求和并除以故障次数来计算 MTTR。在这种情况下，在我们的 168 小时期间，我们发生了三次故障，总停机持续时间为\
  \ 12 分钟。因此，我们的 Foo 应用程序的 MTTR 为 4 分钟。\n\n现在我们知道了应用程序的 MTBF 和 MTTR，我们可以使用这些指标来计算应用程序的实际可用性。该公式为\
  \ `(MTBF/(MTBF+MTTR))*100`。因此，在这种情况下，我们首先需要将 MTTR 值转换为小时，以便我们的单位保持一致。四分钟是 0.06667\
  \ 小时。因此，我们的计算将为 `(56/(56+0.6667))*100`。这使得我们实际的应用程序可用性为 99.8811%。\n\n### 服务级别协议和服务级别目标\n\
  \n当第三方提供商负责管理服务器时，合同通常包括服务级别协议（SLAs）。这些 SLA 定义了许多参数，包括可接受的停机时间、故障情况下服务器可停机的最长时间以及故障发生时可接受的数据丢失量。通常，如果未满足这些\
  \ SLA，提供商将面临财务处罚。\n\n如果服务器由内部管理，DBA 仍然有客户的概念。这些通常是应用程序的最终用户，主要联系人是业务负责人。应用程序的业务负责人是业务中委托该应用程序的利益相关者，并且负责签署资金增强等事项。\n\
  \n在内部管理场景中，仍然可以定义 SLA，在这种情况下，IT 基础设施或平台部门如果未满足这些 SLA，可能需要向业务团队收取费用。然而，在内部场景中，IT\
  \ 部门更常见的做法是与业务团队协商服务级别目标（SLO），而不是 SLA。SLO 在性质上与 SLA 非常相似，但其使用意味着如果未满足，业务不会对 IT 部门施加财务处罚。\n\
  \n### 主动维护\n\n重要的是要记住，停机不仅由故障引起，还由主动维护引起。例如，如果您需要使用最新的服务包为操作系统或 SQL Server 本身打补丁，则在安装期间必须有一定停机时间。\n\
  \n根据所应用的升级，此类场景中的停机时间可能相当可观——对于单台服务器来说可能需要数小时。在这种情况下，高可用性对于许多业务关键型应用程序至关重要——不是为了防止计划外停机，而是为了避免计划维护期间的长时间中断。\n\
  \n## 恢复点目标和恢复时间目标\n\n应用程序的恢复点目标（RPO）表示在发生故障时可接受的数据丢失量。例如，对于支持报表应用程序的数据仓库，这可能是一个较长的时期，例如\
  \ 24 小时，因为它可能每天仅由 ETL 过程更新一次，其余所有活动都是只读报表。对于高度事务性的系统，例如支持交易平台或 Web 应用程序的 OLTP 数据库，RPO\
  \ 将为零。RPO 为零意味着不允许任何数据丢失。\n\n\n\n## RPO 与 RTO\n\n应用可能对高可用性和灾难恢复有不同的 `RPOs`。例如，出于成本或应用性能方面的原因，站点内故障转移可能需要零的\
  \ `RPO`。然而，如果同一应用故障转移到 DR 数据中心，五到十分钟的数据丢失可能是可以接受的。这是因为实现站点内可用性和站点间恢复所使用的技术存在差异。\n\
  \n应用的恢复时间目标（`RTO`）指定了在恢复完成且用户可以重新连接之前，应用最多可以停机的时长。计算应用可实现的 `RTO` 时，需要考虑许多方面。例如，集群从一个节点故障转移到另一个节点以及\
  \ `SQL Server` 服务恢复运行可能不到一分钟；然而，数据库的恢复可能需要更长的时间。数据库恢复所需的时间取决于许多因素，包括数据库的大小、实例中的数据库数量以及故障转移发生时有多少事务正在进行中。这是因为所有未提交的事务都需要回滚。\n\
  \n就像 `RPO` 一样，根据是站点内还是站点间故障转移，存在不同的 `RTOs` 是很常见的。再次，这主要是由于技术差异，但也考虑了如果主数据中心丢失，需要在\
  \ DR 数据中心启动整个环境所需的时间。\n\n在数据损坏的情况下，应用的 `RPO` 和 `RTO` 也可能有所变化。根据损坏的性质以及已实施的 HA/DR\
  \ 技术，数据损坏可能导致您需要从备份中恢复数据库。\n\n如果必须恢复数据库，最坏的情况是可恢复点可能就是上次备份的时间。这意味着您必须将对特定 `RPO`\
  \ 的严格业务要求纳入备份策略。然而，如果只有数据库的一部分损坏，您可能能够从实时数据库中挽救一些数据，并仅从已恢复的数据库中恢复损坏的数据。\n\n数据损坏也可能对\
  \ `RTO` 产生影响。最大的影响因素之一是备份是存储在服务器本地，还是需要从磁带中检索。从磁带或甚至异地位置检索备份文件很可能会在恢复过程中增加大量时间。\n\
  \n### 注意\n\n从 `SQL Server` 直接备份到磁带已被弃用。当本节提到从磁带检索备份时，它假设磁带驱动器是企业备份解决方案的目标，您的数据库备份已卸载到该目标。\n\
  \n另一个影响因素是损坏的原因。如果是由有故障的 IO 子系统引起，则可能需要考虑 Windows 管理员对卷运行磁盘检查命令（`CHKDSK`）所需的时间，以及可能更换磁盘所需的时间。然而，如果损坏是由用户意外截断表或删除数据文件引起，则不必担心。\n\
  \n## 停机成本\n\n如果您询问任何企业主其应用可接受的停机时间和数据丢失量，答案无一例外都是零和零。当然，不可能保证零停机，一旦您开始解释不同可用性级别相关的成本，就更容易协商一个双方都能接受的服务水平。\n\
  \n决定应追求多少个 9 的关键因素是停机成本。停机涉及两类成本：有形成本和无形成本。有形成本通常相当容易计算。让我们以销售应用为例。在这种情况下，最明显的有形成本是收入损失，因为销售人员无法接单。无形成本更难以量化，但可能昂贵得多。例如，如果客户无法向贵公司下单，他们可能会向竞争对手下单且不再回头。其他无形成本可能包括员工士气下降，导致员工流失率升高，甚至公司声誉受损。由于无形成本本质上只能估算，业界的经验法则是将有形成本乘以三，并用该数字代表无形成本。\n\
  \n一旦您获得了应用停机总成本的每小时数值，您可以将其按应用的预测生命周期进行扩展，并比较实施不同可用性级别的成本。例如，假设您计算出应用的停机总成本为 $2,000/小时，且应用的预测生命周期为三年。表\
  \ 1-2 说明了您应用的停机成本，比较了在考虑硬件、许可证、电力、布线、额外存储以及额外支持设备（如新机架、行政成本等）后，为实施每个可用性级别而计算的成本。这被称为解决方案的总拥有成本（`TCO`）。表\
  \ 1-2\n\n停机成本\n\n| 可用性级别 || 停机成本（三年） || 可用性解决方案成本 |\n| --- | --- | --- |\n| 99%\
  \ || $525,600 || $108,000 |\n| --- | --- | --- |\n| 99.9% || $52,560 || $224,000\
  \ |\n| 99.99% || $5,256 || $462,000 |\n| 99.999% || $526 || $910,000 |\n\n在此表中，您可以看到实施五个\
  \ 9 的可用性相比两个 9 的解决方案可节省 $525,074，但实施该解决方案的成本额外增加 $802,000，这意味着实施在经济上不可行。四个 9 的可用性相比两个\
  \ 9 的解决方案可节省 $520,344，且实施成本仅额外增加 $354,000。因此，对于此特定应用，四 9 解决方案是最合适的服务水平设计目标。\n\n\
  ## 备用服务器分类\n\n存在三种备用解决方案类别。您可以使用不同的技术实现每一种，尽管某些技术可用于实现多个备用服务器类别。表 1-3 概述了您可以实施的不同备用类别。表\
  \ 1-3\n\n备用分类\n\n| 类别 || 描述 || 示例技术 |\n| --- | --- | --- |\n| 热备 || 一种同步解决方案，可自动或手动进行故障转移。常用于高可用性。\
  \ || `Clustering`, `AlwaysOn Availability Groups`（同步） |\n| --- | --- | --- |\n|\
  \ 温备 || 一种同步解决方案，只能手动进行故障转移。常用于灾难恢复。 || `Log Shipping`, `AlwaysOn Availability Groups`（异步）\
  \ |\n| 冷备 || 一种非同步解决方案，只能手动进行故障转移。这仅适用于只读数据，且从不修改。 || – |\n\n### 注意\n\n冷备未显示示例技术，因为不需要同步，因此不需要技术实施。\n\
  \n## 总结\n\n您应用的可用性级别以应用对用户可用时间的百分比来衡量。可用性级别通常以“九”来表示。例如，99.9% 的正常运行时间要求被称为三个 9 的可用性。正常运行时间要求越高，实施解决方案的成本越高。因此，您力求达到的正常运行时间级别应由\
  \ `SLAs` 和停机成本驱动。\n\n\n\n恢复点目标是衡量在发生灾难时可以接受丢失多少数据的指标。例如，如果你的唯一灾难恢复解决方案是备份，并且备份安排每小时执行一次，你可以实现一小时的恢复点目标。恢复时间目标是衡量在故障后恢复解决方案所需时间的指标。例如，如果你的恢复时间目标为\
  \ 30 分钟，那么你必须能够在半小时内恢复服务。\n\n确定应用程序停机成本非常重要，因为这是决定可用性水平的主要驱动因素之一。停机成本包括有形成本和无形成本。有形成本可以计算，而无形成本需要估算。\n\
  \n冗余基础设施有助于维护应用程序和服务的可用性。冗余服务器将被分类为热备、温备或冷备。热备服务器是指与生产服务器保持同步并配置为允许自动故障转移的服务器。这适用于高可用性场景。温备服务器是指与生产服务器保持同步，但未配置为自动故障转移的服务器。相反，工程师必须手动执行故障转移。这适用于灾难恢复场景。冷备服务器未与生产服务器保持同步，因此无法自动故障转移。冷备服务器适用于所有数据均为只读且从不修改的灾难恢复场景。\n"
- "# 2. 了解高可用性和灾难恢复技术\n\nPeter A. Carter^( 1 ) (1) Botley, UK 结束摘要\n\nSQL Server 提供了一整套用于实现高可用性和灾难恢复的技术。以下各节提供了这些技术的概述并讨论了它们最合适的用途。\n\
  \n## AlwaysOn 故障转移群集\n\nWindows 群集是一种提供高可用的技术，其中最多 64 台服务器协同工作以提供冗余。AlwaysOn 故障转移群集实例\
  \ (`FCI`) 是跨越该组服务器的 SQL Server 实例。如果该组中的其中一台服务器发生故障，另一台服务器将接管该实例。其最合适的用途是在数据库较大或写入负载较高的高可用性场景中。这是因为群集依赖于共享存储，这意味着数据只需写入磁盘一次。使用\
  \ SQL Server 级别的高可用性技术，写入操作会在主数据库上发生，然后在提交在主数据库完成之前再次在所有辅助数据库上发生。这可能会导致性能问题。尽管可以将群集跨多个站点扩展，但这涉及\
  \ SAN 复制，这意味着群集通常配置在单个站点内。\n\n集群中的每台服务器称为 `node`。因此，如果一个集群由三台服务器组成，则称为三节点集群。集群中的每个节点都安装了\
  \ SQL Server 二进制文件，但 SQL Server 服务仅在一台节点上启动，该节点称为 `active node`。集群中的每个节点还共享用于 SQL\
  \ Server 数据和日志文件的相同存储。然而，存储仅附加到活动节点。\n\n提示\n\n在地理分散的集群（称为地理集群或伸缩集群）中，每台服务器都连接到不同的存储。卷由\
  \ SAN 复制或 Windows Storage Replica（一种在 Windows Server 2016 中引入的 Windows Server 技术，可执行存储复制）进行更新。集群将这两个卷视为单个共享卷，该卷一次只能附加到一个节点。\n\
  \n如果活动节点发生故障，则 SQL Server 服务将停止并且存储将被分离。然后将存储重新附加到集群中的其他节点之一，并在该节点上启动 SQL Server\
  \ 服务，该节点现在成为活动节点。实例还分配有自己的网络名称和 IP 地址，它们也绑定到活动节点。这意味着应用程序可以无缝连接到实例，而不管哪个节点拥有它。\n\
  \n图 2-1 中的图表说明了两节点集群。它显示尽管数据库存储在共享存储阵列上，但每个节点仍具有专用的系统卷。该卷包含 SQL Server 二进制文件。它还说明了在故障转移事件中共享存储、IP\
  \ 地址和网络名称如何重新绑定到被动节点。![图 2-1 ¶ 两节点集群](img/394392_3_En_2_Fig1_HTML.jpg)\n\n图 2-1\
  \ ¶ 两节点集群\n\n### 活动/被动配置\n\n尽管图 2-1 中的图表说明了活动/被动配置，但也可以具有活动/活动配置。虽然一次不可能有多个节点拥有单个实例，因此无法实现负载平衡，但可以在集群上安装多个实例，并且不同的节点可能拥有每个实例。在此场景中，每个节点都有自己的唯一网络名称和\
  \ IP 地址。每个实例的共享存储也由一组唯一的卷组成。\n\n因此，在活动/活动配置中，在正常操作期间，`Node1` 可能托管 `Instance1`，而\
  \ `Node2` 可能托管 `Instance2`。如果 `Node1` 发生故障，则两个实例都将由 `Node2` 托管，反之亦然。图 2-2 中的图表说明了两节点活动/活动集群。![图\
  \ 2-2 ¶ 活动/活动集群](img/394392_3_En_2_Fig2_HTML.jpg)\n\n图 2-2 ¶ 活动/活动集群\n\n警告\n\n在活动/活动集群中，在故障转移时考虑资源非常重要。例如，如果每个节点有\
  \ 128GB RAM，并且每个节点上托管的实例使用 96GB RAM 并锁定内存中的页面，那么当一个节点故障转移到另一个节点时，该节点也会失败，因为它没有足够的内存分配给两个实例。确保您像规划单个服务器一样规划内存和处理器需求。因此，活动/活动集群通常不推荐用于\
  \ SQL Server。\n\n### 三节点及以上配置\n\n如前所述，集群中最多可以有 64 个节点。当你有三个或更多节点时，由于相关成本，你可能不希望有一个活动节点和两个冗余节点。相反，你可以选择实现\
  \ `N+1` 或 `N+M` 配置。\n\n在 `N+1` 配置中，你有多个活动节点和一个被动节点。如果任何活动节点发生故障，它们将故障转移到被动节点。图 2-3\
  \ 中的图表描绘了三节点 `N+1` 集群。![图 2-3 ¶ 三节点 N+1 配置](img/394392_3_En_2_Fig3_HTML.jpg)\n\n\
  图 2-3 ¶ 三节点 N+1 配置\n\n在 `N+1` 配置中，在多故障场景中，多个节点可能会故障转移到被动节点。因此，在规划资源时必须非常小心，以确保被动节点能够支持多个实例。然而，你可以通过使用\
  \ `N+M` 配置来缓解此问题。\n\n\n\n## N+M 配置\n与 N+1 配置具有多个活动节点和单个被动节点不同，N+M 集群具有多个活动节点和多个被动节点，尽管通常被动节点的数量少于活动节点。图\
  \ 2-4 显示了一个五节点 N+M 配置。该图显示 `Instance3` 配置为始终故障转移到其中一个被动节点，而 `Instance1` 和 `Instance2`\
  \ 配置为始终故障转移到另一个被动节点。这使您能够灵活控制被动节点上的资源，但您也可以配置集群以允许任何活动节点故障转移到任一被动节点，如果这是更适合您环境的方案。\n\
  ![图 2-4 ¶ 五节点 N+M 配置](img/394392_3_En_2_Fig4_HTML.jpg)\n\n图 2-4 ¶ 五节点 N+M 配置\n\n\
  ## 仲裁\n为了使自动故障转移能够发生，集群服务需要知道节点是否宕机。为此，您必须形成仲裁。仲裁的定义是“开展业务所需的最低成员数。”在高可用性方面，这意味着集群中的每个节点，以及可选的见证设备（可能是集群磁盘、集群外部的文件共享或\
  \ Azure BLOB 存储），都会获得一票。如果超过一半的投票成员无法与某个节点通信，则集群服务知道该节点已宕机，并且服务器上任何集群感知应用程序都会故障转移到另一个节点。超过一半的投票成员需要无法与节点通信的原因是为了避免一种被称为\
  \ `split brain` 的情况。\n\n为了说明脑裂场景，假设您在数据中心 1 中有三个节点，在数据中心 2 中有三个节点。现在假设您在两个数据中心之间丢失了网络连接，但所有六个节点仍然在线。数据中心\
  \ 1 中的三个节点认为数据中心 2 中的所有节点都不可用。相反，数据中心 2 中的节点认为数据中心 1 的节点不可用。这导致集群的两侧（称为分区）都认为自己应该接管控制权。这可能对成功连接到任一分区的任何应用程序产生不可预测且不期望的后果。`Quorum\
  \ = (Voting Members / 2) + 1` 公式可防止此场景发生。\n\n**提示**\n如果您的集群失去仲裁，则可以通过使用 `/fq` 开关启动集群服务来强制一个分区上线。如果您使用的是\
  \ Windows Server 2012 R2 或更高版本，则您强制上线的分区被视为 `authoritative partition`。这意味着当连接重新建立时，其他分区可以自动重新加入集群。\n\
  \n各种仲裁模型可用，最合适的模型取决于您的环境。表 2-1 列出了您可以使用的模型，并详细说明了最合适的用法。表 2-1\n\n仲裁模型\n\n| 仲裁模型\
  \ | 适用用法 |\n|---|---|\n| `Node Majority` | 当集群中的节点数为奇数时 |\n| `Node + Disk Witness\
  \ Majority` | 当集群中的节点数为偶数时 |\n| `Node + File Share Witness Majority` | 当节点分布在多个站点或节点数为偶数且需要避免共享磁盘*时\
  \ |\n\n*由于虚拟化需要避免共享磁盘的原因将在本章后面讨论。\n\n尽管默认选项是一个节点一票，但可以通过将 `NodeWeight` 属性更改为零来手动移除节点的投票权。如果您拥有\
  \ `multi-subnet cluster`（节点分布在多个站点的集群），则此方法很有用。在这种情况下，建议您在第三个站点使用文件共享见证。这有助于您避免因数据中心之间网络故障而导致的集群中断。但是，如果仲裁中的节点数为奇数，则添加文件共享见证会使投票数变为偶数，这很危险。从二级数据中心的一个节点中移除投票权可以消除此问题。从\
  \ Windows Server 2019 开始，文件共享见证可以是支持 `SMB`（Server Message Block）2.0 或更高版本的文件共享。这包括连接到网络路由器的\
  \ USB 密钥、NAS（网络附加存储设备）以及加入工作组的运行 Windows 的计算机。\n\n**警告**\n文件共享见证不会存储仲裁数据库的完整副本。这意味着使用文件共享见证的两节点集群容易受到一种被称为\
  \ `partition in time` 的场景的影响。在此场景中，如果在您对第二个节点上的集群服务进行修补或更改的过程中一个节点发生故障，则没有仲裁数据库的最新副本。这使您处于需要销毁并重建集群的境地。\n\
  \nWindows Server 的现代版本还支持 `Dynamic Quorum` 和 `Tie Breaker for 50% Node Split` 概念。当启用\
  \ `Dynamic Quorum` 时，集群服务会根据集群中的节点数量自动决定是否给予仲裁见证投票权。如果节点数为偶数，则会分配投票权。如果节点数为奇数，则不会分配投票权。`Tie\
  \ Breaker for 50% Node Split` 在此概念上进行了扩展。如果您有偶数个节点和一个见证，并且见证发生故障，则集群服务会自动从集群中的一个随机节点移除投票权。这保持了仲裁中投票数为奇数，并降低了因见证故障导致集群离线的风险。\n\
  \n**提示**\n如果您的集群在 Windows Server 2016 或更高版本、Datacenter Edition 上运行，则支持 `Storage\
  \ Spaces Direct`。这允许使用本地附加的物理存储，并在其上使用软件定义存储层来实现高可用性。关于 `Storage Spaces Direct`\
  \ 的完整讨论超出了本书范围，但更多详细信息可在 [docs.microsoft.com/en-us/windows-server/storage/storage-spaces/storage-spaces-direct-overview](http://docs.microsoft.com/en-us/windows-server/storage/storage-spaces/storage-spaces-direct-overview)\
  \ 找到。\n\n## AlwaysOn 可用性组\n`AlwaysOn Availability Groups` (`AOAG`) 取代了数据库镜像，本质上是数据库镜像和集群技术的合并。SQL\
  \ Server 作为独立实例（而不是 AlwaysOn 故障转移群集实例）在集群的每个节点上安装。然后在集群上安装一个集群感知的应用程序，称为 `Availability\
  \ Group Listener`；它用于将流量定向到正确的节点。然而，与其依赖共享磁盘，`AOAG` 会压缩日志流并将其发送到其他节点，方式类似于数据库镜像。\n\
  \n`AOAG` 是在具有小型数据库和低写入负载的场景中实现高可用性的最合适技术。这是因为在使用同步模式时，它要求数据在主数据库上提交之前必须先在所有同步副本上提交。您可以拥有多达八个副本，其中包括三个同步副本。`AOAG`\
  \ 也可能是实现虚拟化环境高可用的最合适技术。这是因为集群所需的共享磁盘可能与虚拟环境的一些功能不兼容。例如，当 `VMs` 使用通过光纤通道提供的共享磁盘时，VMware\
  \ 不支持使用 `vMotion`（用于在物理服务器之间手动移动虚拟机（`VMs`））和 `Distributed Resource Scheduler`（`DRS`）（用于根据资源利用率在物理服务器之间自动移动\
  \ `VMs`）。\n\n**提示**\n\n\n\n### AlwaysOn 可用性组概述\n\n## 共享磁盘限制与 iSCSI 变通方法\n\n`VMware`\
  \ 功能中与共享磁盘相关的限制可以通过将存储直接通过 `iSCSI` 连接呈现给客户机操作系统来规避，但会以性能下降为代价。\n\n## 用于灾难恢复的 AOAG\n\
  \n`AOAG` 是在您有主动故障转移需求但不需要实现负载延迟时用于 DR 的最合适的技术。`AOAG` 在您希望利用 DR 服务器卸载报表的情况下也适用于灾难恢复。这允许冗余服务器得到利用。当用于灾难恢复时，`AOAG`\
  \ 以异步模式工作。这意味着在故障转移事件中可能会丢失数据。`RPO` 是非确定性的，并且基于最后一次未提交事务的时间。\n\n## 数据库镜像与可用性组\n\n\
  在数据库镜像的旧时代，辅助数据库始终处于脱机状态。这意味着您无法使用辅助数据库卸载任何报表或其他只读活动。可以通过针对辅助数据库创建数据库快照并将只读活动指向该快照来规避此问题。然而，这仍然可能很复杂，因为您必须配置应用程序针对不同的网络名称和\
  \ IP 地址发出只读语句。另一方面，`Availability Groups` 允许您将一个或多个副本配置为可读。唯一的限制是可读副本和自动故障转移不能配置在同一辅助副本上。然而，通常的做法是将可读辅助副本配置为异步提交模式，以便它们不会影响性能。\n\
  \n## 可读副本和连接路由\n\n为了进一步简化，`Availability Group Replica` 会检查应用程序连接字符串中的只读或只读意图属性，并将应用程序指向适当的节点。这意味着您可以用很少的开发工作轻松地水平扩展报表和数据库维护例程，并且应用程序可以使用单个连接字符串。\n\
  \n## 组合副本功能\n\n因为 `AOAG` 允许您组合同步副本（带或不带自动故障转移）、异步副本以及用于只读访问的副本，所以它允许您使用单一技术满足高可用性、灾难恢复和报表扩展需求。如果您的唯一需求是读取扩展，而不是\
  \ `HA` 或 `DR`，那么从 `SQL Server 2017` 开始，实际上可以不使用群集配置 `Availability Groups`。在这种情况下，没有群集服务，因此没有自动重定向。`Availability\
  \ Groups` 中的副本在相互通信时使用证书。如果您在工作组或跨域中不使用 `AD` 配置 `Availability Groups`，情况也是如此。\n\n\
  ## 故障转移范围\n\n当您使用 `AOAG` 时，故障转移不会发生在数据库级别，也不会发生在实例级别。相反，故障转移发生在可用性组级别。可用性组是一个概念，允许您将相关的数据库组合在一起，以便它们作为一个原子单元进行故障转移。这在合并环境中特别有用，因为它允许您将映射到单个应用程序的数据库组合在一起。然后，您可以出于\
  \ `DR` 测试等目的将此应用程序故障转移到另一个副本，而不会影响托管在实例上的其他数据层应用程序。\n\n## 扩展限制\n\n对于可以在实例上配置的可用性组数量没有硬性限制，对于可以参与\
  \ `AOAG` 的实例上的数据库数量也没有硬性限制。然而，Microsoft 已测试并正式建议每个实例最多 100 个数据库和 10 个可用性组。扩展数据库数量的主要限制因素是\
  \ `AOAG` 使用数据库镜像端点，每个实例只能有一个。这意味着所有数据修改的日志流都通过同一个端点发送。\n\n## 可用性组故障转移映射\n\n图 2-5\
  \ 描述了如何将数据层应用程序映射到可用性组以实现独立故障转移。在此示例中，单个实例托管两个数据层应用程序。每个应用程序都已添加到单独的可用性组中。第一个可用性组已故障转移到\
  \ `Node2`。因此，可用性组侦听器将 `Application1` 的流量指向 `Node2`，将 `Application2` 的流量指向 `Node1`。由于每个可用性组都有自己的网络名称和\
  \ IP 地址，并且由于这些资源随 `AOAG` 一起故障转移，因此应用程序能够在故障转移后无缝重新连接到数据库。\n![图 2-5 ¶ 可用性组故障转移](img/394392_3_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5 ¶ 可用性组故障转移\n\n## AlwaysOn 可用性组拓扑\n\n图 2-6 中的图表描述了 `AlwaysOn Availability\
  \ Group` 拓扑。在此示例中，群集中有四个节点和一个磁盘见证。`Node1` 托管数据库的主副本，`Node2` 用于自动故障转移，`Node3` 用于卸载报表，`Node4`\
  \ 用于 `DR`。由于群集跨越两个数据中心，因此已实施多子网群集。然而，由于没有共享存储，因此站点之间不需要 `SAN` 复制。\n![图 2-6 ¶ AlwaysOn\
  \ 可用性组拓扑](img/394392_3_En_2_Fig6_HTML.jpg)\n\n图 2-6 ¶ AlwaysOn 可用性组拓扑\n\n### 自动页面修复\n\
  \n如果在 `AlwaysOn Availability Group` 拓扑中配置为副本的数据库中的页面损坏，则 `SQL Server` 会尝试通过从其中一个辅助副本获取页面的副本来修复损坏。这意味着可以在无需执行还原或运行\
  \ `DBCC CHECKDB` 并使用修复选项的情况下解决逻辑损坏。然而，自动页面修复不适用于以下页面类型：\n\n* 文件页眉页\n* 数据库引导页\n*\
  \ 分配页\n  * `GAM`（全局分配映射）\n  * `SGAM`（共享全局分配映射）\n  * `PFS`（页面空闲空间）\n\n如果主副本因页面损坏而无法读取页面，它首先在\
  \ `MSDB.dbo.suspect_pages` 表中记录该页面。然后它检查至少有一个副本处于 `SYNCHRONIZED` 状态，并且事务仍在发送到该副本。如果满足这些条件，则主副本向所有副本发送广播，指定刷新日志末尾的\
  \ `PageID` 和 `LSN`（日志序列号）。然后页面被标记为待还原，这意味着任何访问尝试都将失败，错误代码为 `829`。\n\n收到广播后，辅助副本会等待，直到它们重做事务到广播消息中指定的\
  \ `LSN`。此时，它们尝试访问该页面。如果无法访问，则返回错误。如果它们*可以*访问该页面，则将页面发送回主副本。主副本接受第一个响应的辅助副本发送的页面。\n\
  \n然后主副本将用从辅助副本收到的版本替换页面的损坏副本。当此过程完成后，它会更新 `MSDB.dbo.suspect_pages` 表中的页面，将 `event_type`\
  \ 列设置为 5（已修复）的值，以反映其已被修复。\n\n如果辅助副本在重做日志时因页面损坏而无法读取页面，它会将辅助副本置于 `SUSPENDED` 状态。然后它在\
  \ `MSDB.dbo.suspect_pages` 表中记录该页面，并请求主副本提供页面的副本。主副本尝试访问该页面。如果无法访问，则返回错误，辅助副本保持在\
  \ `SUSPENDED` 状态。\n\n\n\n如果它可以访问该页面，则将其发送给请求它的辅助副本。辅助副本用从主副本获取的版本替换损坏的页面。然后它使用 `event_id`\
  \ 为 5 更新 `MSDB.dbo.suspect_pages` 表。最后，它尝试恢复 `AOAG` 会话。\n\n**Note**\n可以手动恢复会话，但如果这样做，在同步期间仍会再次遇到损坏的页面。请确保首先在主副本上修复或还原该页面。\n\
  \n## Log Shipping\n日志传送是一种可用于实现灾难恢复的技术。它通过在主服务器上备份事务日志，将其复制到辅助服务器，然后进行还原来工作。在需要延迟加载的\
  \ `DR` 场景中使用日志传送最为合适，因为使用 `AOAG` 时无法实现这一点。例如，假设用户意外删除了表中所有数据。如果在 `DR` 服务器上的数据库更新之前存在延迟，则可以从\
  \ `DR` 服务器恢复该表的数据，然后重新填充生产服务器。这意味着您无需还原备份即可恢复数据。由于没有自动故障转移功能，日志传送不适用于高可用性。图 2-7\
  \ 中的图表说明了日志传送拓扑。 ![图 2-7 ¶ 日志传送拓扑](img/394392_3_En_2_Fig7_HTML.jpg)\n图 2-7 ¶ 日志传送拓扑\n\
  \n### Recovery Modes\n恢复模式\n在日志传送拓扑中，始终只有一个主服务器，即生产服务器。然而，可以拥有多个辅助服务器，这些服务器可以是 `DR`\
  \ 服务器和用于卸载报告的服务器的混合。\n当您还原事务日志时，可以指定三种恢复模式：`Recovery`、`NoRecovery` 和 `Standby`。`Recovery`\
  \ 模式会将数据库联机，这在日志传送中不受支持。`NoRecovery` 模式会将数据库保持脱机状态，以便可以还原更多备份。这是日志传送的正常配置，也是 `DR`\
  \ 场景下的适当选择。\n`Standby` 选项会将数据库联机，但在只读状态下，以便您可以还原进一步的备份。此功能通过维护 `TUF`（事务撤消文件）来实现。`TUF`\
  \ 文件记录事务日志中任何未提交的事务。这意味着您可以回滚事务日志中的这些未提交事务，从而使数据库更易访问（尽管是只读的）。下一次需要应用还原时，可以在下一次日志还原的\
  \ redo 阶段开始之前，将 `TUF` 文件中的未提交事务重新应用到日志中。\n图 2-8 说明了使用 `DR` 服务器和报告服务器的日志传送拓扑。 ![图\
  \ 2-8 ¶ 使用 DR 和报告服务器的日志传送](img/394392_3_En_2_Fig8_HTML.jpg)\n图 2-8 ¶ 使用 DR 和报告服务器的日志传送\n\
  \n### Remote Monitor Server\n远程监视服务器\n可选地，您可以在日志传送拓扑中配置监视服务器。这有助于您集中监控和警报。当您实现监视服务器时，所有备份、复制和还原操作的历史记录和状态都存储在监视服务器上。监视服务器还允许您拥有一个单一的警报作业，该作业配置为监控拓扑中所有服务器上的备份、复制和还原操作，而无需在拓扑中的每个服务器上分别设置警报。\n\
  **Caution**\n如果您希望使用监视服务器，重要的是在设置日志传送时进行配置。日志传送配置完成后，添加监视服务器的唯一方法是拆除并重新配置日志传送。\n\
  \n### Failover\n故障转移\n与其它高可用性和灾难恢复技术不同，日志传送的故障转移涉及一定程度的管理员工作。要执行日志传送故障转移，您必须备份事务日志的尾部并将其复制到辅助服务器，以及任何其他未复制的备份文件。\n\
  您现在需要按顺序将剩余的事务日志备份应用到辅助服务器，以尾部日志备份结尾。所有还原都使用 `WITH NORECOVERY` 应用，除最终还原外，最终还原使用\
  \ `WITH RECOVERY` 选项应用，以将数据库以一致的状态重新联机。如果您不计划故障回，可以使用辅助服务器作为新的主服务器重新配置日志传送。\n\n\
  ## Combining Technologies\n组合技术\n为了满足您的业务目标和非功能性需求（`NFRs`），您需要将多个高可用性和灾难恢复技术组合在一起，以创建可靠、可扩展的平台。这方面的经典示例是需要将\
  \ `AlwaysOn Failover Cluster` 与 `AlwaysOn Availability Groups` 结合起来的要求。\n您可能需要组合这些技术的原因是，当您以同步模式使用\
  \ `AlwaysOn Availability Groups` 时，必须这样做才能实现自动故障转移，这可能会导致性能受阻。如本章前面所述，性能问题是由事务在主服务器上提交之前先在辅助服务器上提交引起的。然而，集群不会受到此问题的影响，因为它依赖于共享磁盘资源，因此事务只提交一次。\n\
  因此，常见的做法是首先使用集群来实现高可用性，然后使用 `AlwaysOn Availability Groups` 执行 `DR` 和/或卸载报告。图 2-9\
  \ 中的图表说明了将集群和 `AOAG` 结合起来分别实现高可用性和灾难恢复的 `HA/DR` 拓扑。 ![图 2-9 ¶ 集群和 AlwaysOn 可用性组组合](img/394392_3_En_2_Fig9_HTML.jpg)\n\
  图 2-9 ¶ 集群和 AlwaysOn 可用性组组合\n图 2-9 中的图表显示，数据库的主副本托管在双节点活动/被动集群上。如果活动节点发生故障，则集群规则适用，共享存储、网络名称和\
  \ IP 地址会重新附加到被动节点，后者随后成为活动节点。然而，如果两个节点都无法访问，可用性组侦听器会将流量指向位于 `DR` 站点并使用日志流复制进行同步的集群的第三个节点。当然，当使用异步模式时，数据库必须由\
  \ `DBA` 手动故障转移。\n另一个常见场景是将集群与日志传送组合以分别实现高可用性和灾难恢复。这种组合的工作方式与集群结合 `AlwaysOn Availability\
  \ Groups` 非常相似，并在图 2-10 中说明。 ![图 2-10 ¶ 集群与日志传送组合](img/394392_3_En_2_Fig10_HTML.jpg)\n\
  图 2-10 ¶ 集群与日志传送组合\n该图表显示，在主数据中心配置了双节点活动/被动集群。然后将托管在此实例上的数据库的事务日志发送到 `DR` 数据中心中的独立服务器。由于集群使用共享存储，您还应为备份卷使用共享存储，并将备份卷作为角色中的资源添加。这意味着当实例故障转移到另一个节点时，备份共享也会故障转移，并且日志传送会继续无中断地同步。\n\
  **Caution**\n\n\n\n如果在日志传送备份或复制作业正在进行时发生故障转移，则日志传送可能会不同步并需要人工干预。这意味着在故障转移后，您应检查日志传送作业的健康状况。\n\
  \n## 摘要\n理解可用性的概念是为需要高可用性和灾难恢复的应用程序做出正确实施选择的关键。您应计算停机成本并将其与实施 `HA/DR` 解决方案选择的成本进行比较，以帮助企业了解每个选项的成本/效益概况（如第\
  \ 1 章所述）。在选择技术实施时，您还应注意 `SLAs`，因为如果未满足 `SLAs`，可能会产生财务处罚。\n\n`SQL Server` 提供了一整套高可用性和灾难恢复技术，使您能够实施最适合数据层应用程序需求的解决方案。对于高可用性，您可以实施集群或\
  \ AlwaysOn 可用性组（`AOAG`）。集群使用共享磁盘资源，故障转移发生在实例级别。`AOAG` 另一方面，通过维护数据库的冗余副本以及同步日志流，在数据库级别同步数据。\n\
  \n要实现灾难恢复，您可以选择实施 `AOAG` 或日志传送。日志传送通过备份、复制和还原数据库的事务日志来工作，而 `AOAG` 使用异步日志流同步数据。\n\
  \n还可以将多个 HA 和 DR 技术组合在一起，以实施最合适的可用性策略。其常见示例是为高可用性组合集群，并与 `AOAG` 或日志传送结合以提供 DR。\n"
- '# 3. 实施集群

  Peter A. Carter^(1 ) (1) Botley, UK 结束摘要


  工程师可能会发现构建和配置集群的过程很复杂，并且可以实施该模式的许多变体。虽然 DBA 可能并不总是需要自己构建集群，但他们确实需要熟悉该技术，并且通常需要为该过程提供意见。他们还可能参与排查集群中发现的问题。


  因此，本章讨论如何在 Windows 级别构建集群并讨论一些可能的配置。本章中的演示使用预建环境，由两台服务器组成；`ClusterNode1` 和 `ClusterNode2`。两台服务器都位于名为
  `AlwaysOn.com` 的域中。五个卷已从 `SAN` 呈现给节点，并在 `ClusterNode1` 上联机并格式化，其配置在表 3-1 中详细说明。表
  3-1


  磁盘配置


  | 驱动器号 || 卷标 || 大小 || 注释 |

  | --- | --- | --- | --- |

  | F || 数据 || 10GB || 托管 SQL Server 数据文件 |

  | --- | --- | --- | --- |

  | L || 日志 || 3GB || 托管 SQL Server 日志文件 |

  | T || TempDB || 3GB || 托管 TempDB 数据和日志文件 |

  | M || MSDTC || 1GB || 托管与 MSDTC 角色关联的文件 |

  | H || Quorum || 1GB || 托管基于磁盘的仲裁见证 |


  提示

  您可能会惊讶于数据和日志文件分配了单个卷，因为 DBA 的自然本能是将这些文件分离到单独的驱动器。这里需要记住的重要一点是，我们正在使用 `SAN`，并且即使我们使用单独的卷，这些卷也很有可能位于相同的物理磁盘上，这意味着分离仅是逻辑上的。此外，如果要使用
  SAN 快照，一些 SAN 可能要求数据和日志文件存储在同一卷上以确保数据一致性。


  本章的场景要求我们构建一个具有磁盘见证的两节点故障转移集群。在此之前，我们需要配置 Windows 集群服务（`WCS`）。我们还需要配置一个 `MSDTC`（Microsoft
  Distributed Transaction Coordinator）集群角色，该角色将为 `SSIS`（`SQL Server Integration Services`）提供分布式事务协调。此外，我们需要配置：

  * 将 `MSDTC` 角色配置为以高优先级故障转移（与同一集群上的其他角色相比）。

  * 任何 24 小时期间允许三次故障转移。

  * 允许立即回退。


  因此，我们将执行的任务完整列表如下：

  * 安装故障转移群集功能。

  * 构建名为 `ALWAYSON-C` 的 Windows 集群。

  * 正确配置仲裁。

  * 为 `MSDTC` 创建集群角色，名为 `ALWAYSON-MSDTC-C`。

  * 配置 `MSDTC` 角色的属性。

  * 配置 `MSDTC` 角色的故障转移属性。


  提示

  如果您希望出于学习目的构建集群，但没有访问域或 `SAN`，那么集群的新功能允许您模拟非常相似的拓扑。可以使用两台虚拟机作为集群节点。第三台虚拟机运行 Windows
  的 `iSCSI Target` 功能，可用于向这些节点中的每一个提供共享存储。甚至更好的是，`Windows Server 2016` 及更高版本允许在工作组上创建集群，这意味着无需创建额外的虚拟机用作域控制器。但是请注意，在工作组中创建集群仅在
  `PowerShell` 中受支持，而不通过 `Failover Cluster Manager`。还需要注意的是，从 `SQL Server` 角度来看，可用性组在工作组集群上受支持，但故障转移群集实例不受支持。


  ## 构建集群

  在安装 `SQL Server` AlwaysOn 故障转移群集实例之前，您必须准备构成集群的服务器（称为节点）并在它们之间构建 Windows 集群。以下各节演示如何执行这些活动。


  ### 安装故障转移群集功能

  为了构建集群，我们需要做的第一件事是在每个节点的上安装故障转移群集功能。为此，我们需要在 `Server Manager` 中选择 `Add Roles and
  Features` 选项。这将显示添加角色和功能向导。此向导的第一页提供先决条件指导，如图 3-1 所示。 ![图 3-1 ¶ 开始之前页面](img/394392_3_En_3_Fig1_HTML.jpg)


  图 3-1 ¶ 开始之前页面


  在安装类型页面上，确保选择基于角色或基于功能的安装，如图 3-2 所示。 ![图 3-2 ¶ 安装类型页面](img/394392_3_En_3_Fig2_HTML.jpg)


  图 3-2 ¶ 安装类型页面


  在服务器选择页面上，确保选择您当前正在配置的集群节点。这在图 3-3 中进行了说明。 ![图 3-3 ¶ 服务器选择页面](img/394392_3_En_3_Fig3_HTML.jpg)


  图 3-3 ¶ 服务器选择页面


  向导的服务器角色页面允许您选择要配置的任何服务器角色。如图 3-4 所示，这可以包括 Application Server 或 DNS Server 等角色，但在我们的情况下，这是不合适的，因此我们直接进入下一屏幕。
  ![图 3-4 ¶ 服务器角色页面](img/394392_3_En_3_Fig4_HTML.jpg)


  图 3-4 ¶ 服务器角色页面




  ## 安装故障转移群集


  在向导的功能页上，我们需要选择 `Failover Clustering`，如图 3-5 所示。这满足了构建 Windows 群集的先决条件。 ![图 3-5
  ¶ 功能页](img/394392_3_En_3_Fig5_HTML.jpg)

  图 3-5 ¶ 功能页


  当您选择 `Failover Clustering` 时，向导会显示一个屏幕（图 3-6），询问您是否以复选框的形式安装管理工具。如果您计划直接从节点管理群集，请选中此选项。
  ![图 3-6 ¶ 选择管理工具](img/394392_3_En_3_Fig6_HTML.jpg)

  图 3-6 ¶ 选择管理工具


  在向导的最后一页，您会看到将要安装的功能摘要，如图 3-7 所示。在这里，如果需要，您可以指定 Windows 介质的位置。您还可以选择服务器是否应自动重启（如果需要）。如果您正在构建新服务器，选中此框是有意义的。但是，如果在添加功能时服务器已在生产环境中运行，请确保考虑当前在该服务器上运行的内容，以及是否应等待维护窗口来执行重启（如果需要）。
  ![图 3-7 ¶ 确认页](img/394392_3_En_3_Fig7_HTML.jpg)

  图 3-7 ¶ 确认页


  除了通过 `Server Manager` 安装之外，群集服务也可以从 `PowerShell` 安装。列表 3-1 中的 PowerShell 命令可实现与前面步骤相同的结果。

  ```

  Install-WindowsFeature -Name Failover-Clustering –IncludeManagementTools -Verbose

  ```

  列表 3-1

  安装群集服务


  ### 创建群集


  一旦在两个节点上安装了群集，您就可以开始构建群集。为此，连接到您打算作为活动节点的服务器，并从 `Administrative Tools` 运行 `Failover
  Cluster Manager`。


  `Create Cluster Wizard` 的“开始之前”页警告说，Microsoft 仅支持通过所有验证测试的群集，如图 3-8 所示。该消息还警告您必须是群集中每个节点的本地管理员。在以前版本的
  Windows Server 中，这意味着您必须使用在将参与群集的每台服务器上具有本地管理员权限的域帐户。然而，从 Windows Server 2016 开始，对域身份验证的依赖已被移除，唯一的要求是在每个节点上存在具有一致名称和密码的本地管理员权限帐户。这允许在工作组上或跨多个域创建群集。在以前版本的
  Windows Server 中，这两种选项都不可用。 ![图 3-8 ¶ 开始之前页](img/394392_3_En_3_Fig8_HTML.jpg)

  图 3-8 ¶ 开始之前页


  在向导的“选择服务器”屏幕上，您需要输入群集节点名称。如图 3-9 所示。在我们的例子中，我们的群集节点分别命名为 `ClusterNode1` 和 `ClusterNode2`。如果它们是域的一部分，则域名称和后缀将附加到服务器名称。
  ![图 3-9 ¶ 选择服务器页](img/394392_3_En_3_Fig9_HTML.jpg)

  图 3-9 ¶ 选择服务器页


  在“验证警告”页上，会询问您是否希望对群集运行验证测试。对于生产服务器，您应始终选择运行此验证，因为除非群集经过验证，否则 Microsoft 不会提供支持。选择运行验证测试会调用

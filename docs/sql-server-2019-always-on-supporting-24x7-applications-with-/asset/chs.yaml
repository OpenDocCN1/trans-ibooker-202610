  ## 配置群集


  许多群集配置可以根据您环境的需求进行更改。本节演示如何更改一些更常见的配置。


  ### 更改仲裁


  如果我们在故障转移群集管理器中检查群集存储，通过钻取 `ALWAYSON-C` ➤ 存储 ➤ 磁盘并突出显示分配给仲裁的磁盘，我们可以看到见证已正确配置为使用仲裁卷。这在图
  3-18 中示意。


  ![图 3-18 ¶ 群集卷](img/394392_3_En_3_Fig18_HTML.jpg)


  图 3-18 ¶ 群集卷


  我们可以通过进入群集的上下文菜单并选择“更多操作” ➤ “配置群集仲裁设置”来修改此设置，这将调用“配置群集仲裁向导”。在图 3-19 所示的“选择仲裁配置选项”页面上，我们选择“选择仲裁见证”选项。


  ![图 3-19 ¶ 选择仲裁配置选项页面](img/394392_3_En_3_Fig19_HTML.jpg)


  图 3-19 ¶ 选择仲裁配置选项页面


  在“选择仲裁见证”页面上，我们选择要配置的仲裁类型。当群集中有偶数个节点并且所有节点都位于同一数据中心时，或当主数据中心中有偶数个节点且在辅助数据中心中还有另一个节点时，磁盘见证最为合适。


  当节点分布在两个数据中心，并且您有权访问第三个数据中心，在那里可以提供文件共享作为仲裁时，文件共享见证最为合适。Windows Server 2019 支持在任何支持
  SMB 2.0 或更高版本的设备上的文件共享。这包括可以连接到网络路由器的 USB 密钥。


  当节点分布在两个数据中心，并且没有第三个数据中心可用于设置文件共享见证时，云见证最为合适。要使用云见证，您必须拥有 Azure 存储帐户，因为见证将创建在 Azure
  BLOB 存储中。


  当单个数据中心中有奇数个节点时，最合适的做法是不配置见证。


  对于我们的场景，我们将选择配置磁盘见证的选项。这在图 3-20 中示意。


  ![图 3-20 ¶ 选择仲裁见证页面](img/394392_3_En_3_Fig20_HTML.jpg)


  图 3-20 ¶ 选择仲裁见证页面


  在向导的“配置存储见证”页面上，我们可以选择用作仲裁的正确磁盘。在我们的例子中，这是磁盘 4，如图 3-21 所示。


  ![图 3-21 ¶ 配置存储见证页面](img/394392_3_En_3_Fig21_HTML.jpg)


  图 3-21 ¶ 配置存储见证页面


  向导的摘要页面详细说明将对群集进行的配置更改。它还强调动态仲裁管理已启用，并且所有节点加上仲裁磁盘在仲裁中都有投票权。


  我们还可以使用清单 3-3 中的 PowerShell 命令从命令行执行此配置。在这里，我们使用 `Set-ClusterQuorum` cmdlet 并传入群集的名称，然后是希望配置的仲裁类型。因为磁盘包含在此仲裁类型中，所以我们还可以传入计划使用的群集磁盘的名称，正是这一方面使我们能够更改仲裁磁盘。


  提示

  如果使用 PowerShell 按照演示操作，请记住更改磁盘编号以匹配您自己的配置。


  ```

  Set-ClusterQuorum -Cluster ALWAYSON-C -NodeAndDiskMajority "Cluster Disk 4"

  ```



  如有任何问题或疑问，欢迎通过 GitHub issue 反馈。\n\n## 大型多人游戏的数据持久化\n\n对于全球性、可扩展的游戏而言，最佳的数据持久化方案是使用数据库。数据库应用广泛，并且是一种以高性能方式安全处理用户数据的方案。我们甚至可以让多个游戏服务器共用一个数据库。\n\
  \n### 使用数据库进行数据持久化的优点\n\n- **高性能**——开发者在设计数据库时充分考虑了性能。几乎所有你使用的网站和应用程序在其生命周期中的某个阶段都会与数据库交互。\n\
  - **可扩展**——速度和可扩展性是数据库设计的核心。无论你服务一千名用户还是十亿名用户，数据库都是为可扩展性而设计的。\n- **成本低**——自行托管数据库很容易，而且市面上有许多廉价的服务可以帮你完成。\n\
  - **安全**——非常重要的是，对于数据库而言，安全是核心关注点。\n\n### 使用数据库进行数据持久化的缺点\n\n- **刚开始可能有些难度**——数据库一开始可能具有挑战性，但很快就能理解其中的逻辑。然而，掌握数据库开发、维护和管理可能需要数年时间。\n\
  - **需要额外的开发时间**——你需要设计和实现数据库架构，并编写数据库与游戏服务器之间的接口程序。这些额外的工作会增加开发时间。\n\n那么，数据库到底是什么？\n\
  \n首先，在我们的 `AWSDatabaseApi` 类中，或者在你用来填充数据库的任何类中，我们需要添加一个新的 `DynamoDBContext` 对象。这个\
  \ `DynamoDBContext` 对象将为我们的代码提供关于数据库应如何呈现的上下文。让我们看看下面的代码：\n\n```csharp\nprivate\
  \ DynamoDBContext context;\n```\n\n现在我们有了一个 `DynamoDBContext` 对象，我们需要通过初始化它来填充我们数据库的上下文。你需要确保在初始化\
  \ `IAmazonDynamoDB` 对象之后才调用此代码：\n\n```csharp\nprivate async void AddNewRandomPlayer()\n\
  {\n    context = new DynamoDBContext(client);\n\n    Player newPlayer = new Player\n\
  \    {\n        PlayerId = \"newPlayer-\" + Random.Range(0, 1000),\n        PlayerDeaths\
  \ = Random.Range(0, 30),\n        PlayerKills = Random.Range(0, 30)\n    };\n\n\
  \    await context.SaveAsync<Player>(newPlayer);\n}\n```\n\n在代码中，我们使用数据库客户端连接来获取数据库的上下文。然后我们创建一个新的\
  \ player 对象。这个 player 对象正是我们使用所需属性进行装饰的对象。\n\n接着，我们可以用所需的数据填充 player 对象，并调用 `DynamoDBContext`\
  \ 的 `SaveAsync` 方法。一旦 `await` 调用完成，你的“Players”表中就会有一个新生成的 player 条目。再次强调，重点是除了键之外，所有字段都不是必需的。向\
  \ player 对象添加额外字段也会将它们作为新列添加到数据库中！\n\n这段代码将生成一个新用户，其玩家 ID 为“Demo Player”。然后我们将三次死亡和零击杀分配给该玩家。让我们运行这段代码，并在\
  \ DynamoDB Web 界面中查看结果。让我们看一看图 5-11。\n\n![](img/9be82dd80844460a2c43cbf8813817d7_178_0.png)\n\
  \n**图 5-11.** *该图显示了“players”表中的演示玩家条目*\n\n这就是我们的玩家，死亡三次，击杀为零。让我们更新玩家的击杀数。如果你使用我的示例，请右键单击\
  \ `AWSDatabaseApi` 组件，然后选择“Update Demo Player Kills Randomly。”\n\n让我们看看下面的代码来了解发生了什么：\n\
  \n```csharp\nprivate async void UpdateDemoPlayerKillsRandomly()\n{\n    var existingPlayer\
  \ = await context.LoadAsync<Player>(\"Demo Player\");\n\n    if (existingPlayer\
  \ == null)\n    {\n        Debug.LogError(\"Demo player does not exist yet.\");\n\
  \        return;\n    }\n\n    existingPlayer.PlayerKills = Random.Range(1, 1000);\n\
  \n    await context.SaveAsync(existingPlayer);\n}\n```\n\n在这里，我们通过哈希键使用 `context.LoadAsync`\
  \ 并指定类型 `Player` 来查找现有的 player 对象。然后我们更新“player kills”值，并通过 `context.SaveAsync`\
  \ 将对象传回数据库。\n\n让我们回到 DynamoDB Web 界面查看更改。\n\n- 适合小型独立工作室。\n- 适合开发环境。\n- 适合 Web 服务器托管。\n\
  - 适合小型玩家运行的游戏服务器。\n- 易于上手。\n\n### 缺点\n\n- 对于小型托管提供商来说，可扩展性很差。\n- 如果共享资源拥塞，可能会受到性能影响。\n\
  \nAmazon Web Services EC2 是规则的主要例外之一——它通过重大的基础设施改进来减少上述缺点——但成本高于许多小型托管提供商。Google\
  \ Cloud Hosting 和 Microsoft Azure 也是如此。\n\n那么，有哪些替代方案呢？接下来让我们深入了解专用托管。\n\n## 专用托管/裸金属\n\
  \n专用托管通过直接将硬件分配给客户端，消除了其他客户对给定硬件上的未知需求，从而将共享托管提升到了一个新的水平。在专用托管中，每个客户都可以直接访问其专用服务器的硬件，通常可以对\
  \ GPU 和 CPU 资源进行微调。\n\n裸金属服务器正是因为这种对硬件的直接访问而得名，在这种模式下，提供商不会将服务器实例封装在虚拟化技术中。\n\n\
  让我们从概念层面看一下专用托管的样子，如图 6-6 所示：\n\n![](img/9be82dd80844460a2c43cbf8813817d7_194_0.png)\n\
  \n该面板将为你提供远程桌面连接的下载链接。这个下载的文件相当于一个 RDP 快捷方式。你仍然需要你的密码，我们接下来会获取。\n\n点击“Get Password”链接。第一次执行此操作时，AWS\
  \ 会提示你下载并保存一个“.PEM”文件。这个文件至关重要，你应该将其保存在安全的地方，并考虑进行备份。\n\n接下来，你可以使用 PEM 文件解密 Windows\
  \ 密码。复制 Windows 密码并运行你的 RDP 快捷方式。忽略任何证书警告。这是因为 AWS 默认使用自签名证书。继续并连接到你的实例。接下来，你会看到一个熟悉的\
  \ Windows 桌面窗口。这个窗口就是你的远程机器，你可以在此安装游戏服务器。接下来让我们讨论 Windows 配置。\n\n### Windows 配置\n\
  \n现在我们有了 EC2 虚拟机，我们需要进行 Windows 端的配置。这一步包括从安装我们的游戏服务器到可能需要的任何自动运行脚本，再到打开相应的防火墙端口。\n\
  \n你需要确保完成以下步骤：\n\n\n\nThe new instance wizard (Figures 6-10 and 6-11) will require\
  \ us to complete the following:\n\n- **Give the instance a name** - This is a human-friendly\
  \ name that we can use to identify the instance. Naming our instance is helpful\
  \ if we have multiple instances running.\n- **Optionally add a key/value pair tag**\
  \ - Much like AWS, this provides us with an optional label that can help identify\
  \ the purpose of the instance. We can use this for specific group actions.\n- **Select\
  \ a region** - This will determine what area our endpoint is situated at, typically\
  \ a geographic location.\n- **Select a zone** - Zones are subdivisions of regions\
  \ that typically represent a data center.\n- **Select the machine configuration**\
  \ - The machine configuration defines what hardware we want to provision for our\
  \ virtual machine.\n\n## Figure 6-11. The figure shows the last section of the GCP\
  \ new instance wizard\n\n- **Optionally enable “Confidential VM Service”** - This\
  \ is an optional service in which the memory of the VM becomes encrypted to add\
  \ another layer of security, where even Google would be unable to access the memory.\
  \ Memory encryption is typically only used for extremely sensitive applications,\
  \ and we can leave this disabled to save on cost and performance.\n- **Optionally\
  \ deploy a container to the VM** - This is useful if you have a docker container\
  \ image ready.\n- **Specify your boot disc and OS** - Here, we can specify the size\
  \ of our boot disk and choose an operating system to use. Google includes licensing\
  \ fees for the operating system selected.\n\n- **Specify identity and API access**\
  \ - Here, you can specify which account we should use for the instance. Selecting\
  \ a service account allows your applications on your VM to make Google API calls.\n\
  - **Firewall** - Here, we can choose to allow HTTP and HTTPS traffic. Enable both\
  \ checkboxes.\n\nSelecting “Management, security, disks, networking, sole tenancy”\
  \ will show additional options. The one we’re interested in here is “Preemptibility.”\
  \ Preemptibility is an optional selection that will limit our server to only run\
  \ for up to 24 hours. Depending on how you structure your game servers, preemptibility\
  \ can be a valuable option to save on costs while developing significantly. It’s\
  \ similar to AWS’s spot pricing.\n\nFinally, click the create button.\n\nFrom here,\
  \ you can connect to the remote server, and much like with the AWS server, it’s\
  \ important to remember to enable the appropriate firewall rules within Windows!\n\

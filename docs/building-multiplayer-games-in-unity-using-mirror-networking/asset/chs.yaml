- "## 第 3 章\n\n## 镜像大厅\n\n现在我们了解了网络基础知识，我们可以更详细地讨论 Unity 中的多人游戏。我们将使用 Mirror Networking\
  \ 在 Unity 中实现可扩展的多人网络。\n\n那么 Mirror Networking 究竟是什么？Mirror Networking 是一个于 2018\
  \ 年 10 月发布的网络库。它是为了修复被忽视的 UNET 并为其他开发者提供一个平台，以便他们在此基础上扩展、提交改进并协作而创建的。\n\nMirror\
  \ 使用命令-RPC 网络结构，其中每个连接都需要对对象拥有权限才能在网络上修改它。Mirror Networking 易于实现且不会牺牲可扩展性。Mirror\
  \ Networking 非常适合小型工作室和希望创建 MMO 级网络的大型 AAA 工作室。\n\nMirror 的优点在于客户端和服务器都是同一个项目，有助于在开发期间提高生产力。\n\
  \n## 架构\n\n正如我之前简要提到的，Mirror 使用命令-RPC 网络结构。命令-RPC 架构意味着客户端和服务器通过命令（客户端到服务器）和远程过程调用（服务器到客户端）进行通信。命令允许客户端在自己拥有权限的对象上在服务器上执行远程方法。这是一种让客户端要求服务器执行给定命令的方式。\n\
  \n相反，RPC 允许服务器远程在客户端上执行方法。服务器和客户端之间的这种往返构成了我们网络的基础，使我们能够在网络上传输各种支持的数据类型和引用。命令-RPC\
  \ 架构使代码比其他网络解决方案更容易遵循。\n\n|  | Y - 是 | U - 未测试 | N - 否 | K - 有点 |  |  |  |  |  |\
  \  |  |  |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| 名称 | 备注 | Mirror\
  \ 传输层 | 服务器 | 客户端 | Windows | Android | Linux | Mac | iOS | XBox | PS |\n| Simple\
  \ Web Transport | 此传输使用 websocket 协议。这使得该传输可用于 Unity 的 WebGL 构建。 | Y | Y | Y | Y\
  \ | Y | Y | Y | U | U |\n| Mirror WebRTC | 该传输的目的是提供一种不需要游戏主机进行端口转发的替代在线连接方法。 |\
  \ Y | Y | Y | U | U | U | U | U | U |\n\n图 3-1 第 3 部分。描绘了列表中最后两个传输层\n\nSimpleWebTransport\
  \ 是你需要 Web 应用连接到你的 Mirror 网络或反之时的首选。它是少数支持 WebSockets 的传输层之一。\n\nMirror WebRTC 是一种类似去中心化中继服务的服务，可扩展其他传输的功能。\n\
  \n## 附加传输组件逻辑\n\n此外，传输层还可以充当其他传输层的中间人。它们可以提供额外的逻辑和功能，例如添加加密或提供 NAT 穿透。Monke 能够为传输层中传输的数据提供加密就是一个很好的例子。\n\
  \n这种传输层数据的交接也为其他传输层添加打开了可能性，例如回退传输组件。\n\n## 回退传输组件\n\n回退传输组件是规避平台限制的好方法。它允许我们在主要传输层在客户端当前平台上无法工作时切换到其他传输层。让我们看一下图\
  \ 3-2。\n\n缺点：\n\n- 比 KCP 的 CPU 开销略高\n\n无知是福，字面意思。\n\n## Telepathy – TCP 传输层\n\n\
  Telepathy 是随 Mirror Networking 一起提供的默认传输层。Telepathy 是 Mirror Networking 示例中使用的传输层。\n\
  \n有人可能会认为默认传输层不会很好，但你会弄错。它在性能上仅略逊一筹，可能是 Mirror 可用的最佳 TCP 传输。\n\n优点：\n\n- 它就是能用。\n\
  - 舒适地处理 128+ 重负载带宽 CCU。\n\n> “如果它没坏，为什么要修它？”\n\n## 客户端、服务器和主机\n\n所以现在我们已经涵盖了我们需要的许多低级网络概念，是时候开始谈论应用层，即\
  \ Mirror Networking 本身了。当使用 Mirror Networking 创建多人游戏时，有一个关键区别，你在编程游戏中将要执行的逻辑时始终需要牢记在心。\n\
  \n那就是尽管是同一个项目，你的游戏有两层和第三个混合层。这里至关重要的是要理解，我说的不是你在 Unity 中通常所用的层。我说的是游戏逻辑的实例。\n\n\
  让我详细说明。当使用 Mirror Networking 时，你有一个连接到服务器的客户端。两个独立的应用实例：制作两个构建，一个作为服务器运行，然后让客户端加入该游戏。够简单？\n\
  \n在客户端更改本地变量并不意味着该变量会在服务器上更改。客户端需要向服务器发出网络请求来更改变量，然后监听该更改。这种来回就是网络游戏的运作方式。在几乎所有情况下，服务器都不应信任客户端。\n\
  \n![](img/9be82dd80844460a2c43cbf8813817d7_95_0.png)\n\n图 3-6。该图是 NetworkAuthenticator\
  \ 的示例实现\n\n现在，至关重要的是要理解 Network Authenticator 非常通用且可适应。一般来说，你不会在生产版本中使用 BasicAuthenticator。BasicAuthenticator\
  \ 只是一个如何使用和继承 Network Authenticator 的示例。让我们在深入研究如何创建满足项目需求的网络身份验证器之前，更深入地研究基本身份验证器。\n\
  \n基本身份验证器非常、嗯、基本。它提供了一个明文用户名和密码验证系统的示例。首先，我们有公开的事件。如下所示。\n\n### OnServerAuthenticated\n\
  \n当客户端成功被服务器接受为已认证时，此事件会被调用。Mirror 网络上的实体可以监听此事件，并帮助通知这些实体服务器已成功认证客户端。服务器本身通常使用\
  \ OnServerAuthenticated 事件，但其他玩家也可以使用该事件来查看他们的朋友是否已成功认证。\n\n### OnClientAuthenticated\n\
  \n与 OnServerAuthenticated 事件类似，OnClientAuthenticated 是在服务器成功认证客户端连接后调用的事件。然而，与其影响\
  \ Mirror 网络上的监听器，此事件是在请求认证的客户端上调用的事件。OnClientAuthenticated 事件非常适合显示 UI 元素，通知用户其登录成功。\n\
  \n\n\n\n\n这涵盖了服务器端代码。它非常易于使用，也便于扩展。\n\n接下来是客户端代码。\n\n```\n/// <summary>\n/// Called\
  \ on client from StartClient to initialize the Authenticator\n/// <para>Client message\
  \ handlers should be registered in this method.</para>\n/// </summary>\npublic override\
  \ void OnStartClient()\n{\n    // register a handler for the authentication response\
  \ we expect from\n    // server.\n    NetworkClient.RegisterHandler<AuthResponseMessage>(OnAuthResponseMessage,\n\
  \    false);\n}\n```\n\n同样，与服务器端类似，我们需要注册一个处理器，但这次是针对 `AuthResponseMessage`，以便在收到服务器响应时采取相应操作。我们应该在\
  \ `OnStartClient` 中注册这个处理器。\n\n```\n/// <summary>\n/// Called on client from OnClientAuthenticateInternal\
  \ when a client needs to\n/// authenticate\n/// </summary>\n/// <param name=\"conn\"\
  >Connection of the client.</param>\npublic override void OnClientAuthenticate(NetworkConnection\
  \ conn)\n{\n    AuthRequestMessage authRequestMessage = new AuthRequestMessage();\n\
  \n    NetworkClient.Send(authRequestMessage);\n}\n```\n\n- **PlayerSpawnMethod**\
  \ - 指定 Mirror Networking 是在随机的 `NetworkStart` 位置生成玩家，还是以轮询的方式生成。要让此功能正常工作，你需要在场景中放置带有\
  \ `NetworkStart` 组件的游戏对象。\n\n## 已注册的可生成预制体\n\n已注册的可生成预制体是一个手动注册的预制体列表，这些预制体允许在运行时生成。这些预制体也可以使用不同的流程自动分配，我们将在本书后面介绍。目前，需要注意的是，如果你打算在游戏过程中实例化并生成某个预制体，而该预制体不在场景文件中，则需要将其注册到此列表中。我们将在本书后面介绍生成网络化对象的内容。\n\
  \n## 网络标识\n\n网络标识是 Mirror Networking 的核心；它们用于在网络中识别对象。如果某样东西需要联网，它就需要一个网络标识。更重要的是，一个网络标识不能成为另一个网络标识的子对象。这一点很重要，因为未来的\
  \ Mirror 版本将直接阻止这种情况发生。因此，最好将网络逻辑和网络标识都放在网络化预制体的根节点上。还需要注意，任何存在于场景中的网络标识，在服务器存在并连接之前，都会被\
  \ Unity 禁用。这一点很重要，因为在 `Awake` 中执行逻辑会导致逻辑先执行，然后对象被生成，这可能会破坏在 `Awake` 中初始化的一些逻辑，并且不会再次调用\
  \ `Awake`。因此，最好避免为附加到网络对象上的任何组件使用 `Awake`。相反，让你的类继承自 `NetworkBehaviour`，并调用 `public\
  \ void override OnStartClient`。我们将在本书后面更详细地讨论网络行为，深入了解使用 Mirror Networking 创建多人游戏背后的编码。\n\
  \n## 小结\n\n在本章中，我们了解了 Mirror Networking 和不同的网络架构、传输层，以及服务器、客户端和主机。我们还了解了网络管理器以及如何配置多人游戏环境。然后我们深入探讨了身份验证、玩家对象和已注册的可生成预制体。\n\
  \n在下一章中，我们将讨论指挥链，并深入理解权限（authority）以及它如何影响你使用 Mirror 构建多人游戏的方式。\n\n## 练习 1 – 使用\
  \ Google 创建自定义 OAuth2 身份验证器\n\n因此，我们打算使用 Google 登录来构建自定义身份验证器。标准的做法是使用 Google 的\
  \ SDK；然而，如果你希望开发同时支持桌面平台的产品，你会遇到一个障碍。截至撰写本文时，Google 的 SDK 并不支持原生 Unity 桌面应用程序。\n\
  \n为了为桌面构建目标构建登录流程，你需要使用玩家的浏览器构建一个完全自定义的登录流程，然后拦截 Web 响应。\n\n由于在 Unity 中没有相关指南，更不用说\
  \ Mirror 了，我将向你展示如何创建这个自定义登录流程。值得注意的是，同样的概念也适用于 Facebook。然而，这是一个大问题：Facebook 的重定向需要通过\
  \ https 重定向到 SSL 加密的端点。这意味着重定向到客户端本地主机是不可行的。如果你打算使用这种方式，你需要托管一个身份验证站点来接收任何重定向。\n\
  \n让我们开始吧。在开始之前，我们需要先设置一些东西：\n\n步骤 1 – 首先，我们需要通过 Google 的 API 开发者门户注册一个新应用。为此，你需要导航到\
  \ https://console.cloud.google.com/apis/dashboard 并登录。添加一个应用，然后按照提示操作。\n\n步骤 2 –\
  \ 接下来，你需要创建一个 API oAuth 2 客户端 ID 以供使用；你可以通过访问 https://console.cloud.google.com/apis/credentials\
  \ 并确保在顶栏中选择了你的项目（图 3-9）来完成此操作。\n\n那么为什么会有这么多模型呢？关于这一点，可悲的事实是，这直接源于你的一些玩家——作弊者。作弊者总会出现，并且总会抓住机会按自己的规则行事。作弊者作弊是为了自己的利益，或者仅仅是为了享受破坏其他玩家体验所带来的满足感。\n\
  \n游戏服务器架构有助于优化网络的整体设计，以减轻作弊问题，或者在你不在乎作弊者的情况下（例如本地合作游戏）改善玩家体验。因此，架构是一种设计理念，你应该在编写第一行网络代码之前仔细思考，同时权衡时间、精力和回报。\n\
  \n## 输入式与状态式架构\n\n当我们构建多人游戏时，我们究竟在网络中复制什么？有人可能认为这是一个简单的问题，但它完全取决于你的游戏或产品、游戏类型以及架构应该满足的需求。\n\
  \n这就引出了输入式或状态式复制的主题。首先，让我解释一下这究竟是什么意思。当你使用基于输入的复制系统时，我们会通过网络发送玩家的输入，例如“PlayerPressedForwardInput()”命令。\n\
  \n另一方面，如果我们使用状态式架构，我们会通过网络发送位置值，而不是发送移动输入本身。这些方法中的每一种在网络化游戏服务器架构中都有其适用的场景。我们可以在游戏服务器架构中使用输入复制、状态式复制，或两者的组合。这些方法中的每一种在网络化游戏服务器架构中都有其适用的场景。我们的选择取决于网络模拟是否是确定性的。\n\
  \n## 基于输入的复制 – 优点与缺点\n\n通常，这些不同复制形式的优缺点取决于架构本身，因为其中一些可能会变化。然而，一般而言，基于输入的复制具有以下优缺点：\n\
  \n优点\n\n- **通常显著降低带宽使用** - 这是因为你只调用移动和交互命令。此外，在确定性环境中，你甚至不需要复制任何值。\n\n\n\n\n\n##\
  \ Lockstep\n\nLockstep 网络架构通常在 1990 年代末的 RTS 游戏中使用。它是一种网络架构，其中所有玩家都会等待所有其他玩家的承诺。这些承诺是预期操作的哈希版本。一旦玩家收到所有其他承诺，他们就会向所有其他玩家发送他们的操作。然后必须对该操作进行哈希处理并与原始承诺进行比较。\n\
  \n这种网络方法解决了被称为“先看作弊”的一种作弊方式的一些问题。例如，假设你正在玩石头剪刀布游戏，但你无法保证所有玩家会同时出牌。玩家 A 例如可以等待玩家\
  \ B 显示其决定，然后显示自己的决定，已知玩家 B 的决定。\n\n在 lockstep 中，玩家 A 和玩家 B 各自共享承诺的哈希版本。此哈希承诺不应用于直接推断操作，但也应易于与操作进行比较。\n\
  \n这样，玩家 A 和玩家 B 就无法对他们的预期操作撒谎。Lockstep 然而带来了一个痛苦的缺点，使其不适合大多数现代游戏。整个网络的速度取决于最慢的玩家，这使其不适合许多游戏和类型。\n\
  \n因此，lockstep 网络的最后一个堡垒可能就是 RTS 游戏。但即使如此，还有另一个缺点。Lockstep 通常需要完全确定性的网络架构，并且由于与 lockstep\
  \ 网络相关的复杂性和难度，我们通常会放弃它而采用客户端-服务器模型。\n\n## True Lockstep Games\n\n- Supreme Commander\
  \ 1\n- Warcraft 3\n- Doom\n\n## Pseudo-lockstep (Lockstep with Client-Server Model)\n\
  \n- Starcraft 2\n\n## Client-Server Architecture\n\nClient-Server Architecture –\
  \ 这就是我们要介绍的内容。Mirror Networking 使用纯客户端-服务器模型。虽然理论上你可以扩展 Mirror Networking 来使用\n\n\
  RPC 属性可以在属性标志中包含一个特殊的参数，称为“includeOwner”。如果不传递该参数，则默认为 true。如果你决定传递该参数，你的新属性将看起来更像以下内容：\n\
  \n```\n[RPC(includeOwner = false)]\npublic void Jump()\n{\n    PlayerController.Jump();\n\
  }\n```\n\n现在，你的 RPC 将仅在客户端上执行并排除主机玩家。通常没有太多理由这样做，但该功能存在。\n\n## TargetRPC Attribute\n\
  \nTargetRPC 与 RPC 属性非常相似。TargetRPC 简单地代表 Target Remote Procedure Call。与 RPC 属性一样，我们需要添加一个属性，这次是\
  \ TargetRPC 属性。\n\nTargetRPC 需要一个额外的步骤。我们必须将 NetworkConnection 作为方法的第一个参数包含在内，否则代码将无法工作。让我们看看它是什么样的：\n\
  \n```\n[TargetRPC]\npublic void Jump(NetworkConnection connection)\n{\n    PlayerController.Jump();\n\
  }\n```\n\n然后你可以调用远程过程调用并传入你想要在其上调用远程过程的玩家的网络连接。某些 IDE 可能会警告参数未被使用，但这并非如此，你可以安全地忽略此警告。\n\
  \n## Commands\n\n那么，如果我们希望客户端在服务器上执行一个方法呢？我们可以使用命令来实现；它们与 RPCs 非常相似，因为我们可以使用命令属性来识别\
  \ Mirror Networking 编译器的目标方法。\n\n## Command Attribute\n\n我们可以像标记方法为 RPCs 或 TargetRPCs\
  \ 一样将方法标记为命令。重要的是要注意，默认情况下，你必须对你调用命令的网络身份拥有权限，这应该看起来像这样：\n\n```\n[Command]\npublic\
  \ void AddGold()\n{\n    gold++;\n}\n```\n\n给定的命令将允许对网络身份拥有权限的客户端添加金币。然后该 gold 变量可以通过使用\
  \ sync-vars 在网络上与其它客户端同步，我们稍后会讨论。\n\n## Synchronization – Properties\n\nSynchronization\
  \ 是 Mirror Networking 的一个概念，我们可以在网络上同步变量的状态。Mirror Networking 通常在客户端加入网络或值发生变化时执行此同步，并将其添加到同步批处理队列中。\n\
  \n同步涵盖两个主要部分：同步属性和同步组件；后者是预先编写的组件，用于同步其它组件的状态，省去了从头重写大量样板代码的需要，但设计为可扩展以满足项目需求。\n\
  \n我们将从讨论同步属性开始。这些如下：\n\n- SyncVars\n- SyncLists\n- SyncDictionaries\n- SyncHashSets\n\
  - SyncSortedSets\n\n然后最后，我们有通常的同步设置。\n\n## Network Lerp Rigidbody\n\nNetwork Lerp\
  \ Rigidbody 组件是管理变换复制的替代方案。在你想要在网络上复制非运动学刚体时，它是有优势的。\n\n然而，在刚体上使用 Network Transform\
  \ 可能会导致物理系统出现异常行为，因为刚体本身的速率不会被修改。为抵消此问题，我们有 Network Lerp Rigidbody。\n\nNetwork Lerp\
  \ Rigidbody 同步刚体的速率值及其相关位置。\n\n重要的是要注意，网络身份不应同时具有 Network Transform 和 Network Lerp\
  \ Rigidbody 组件。你应该根据产品需求选择其一，通常更倾向于 Network Transform，除非速率很重要——例如刚体平台，或玩家可交互的刚体。让我们看一下图\
  \ 4-13 中的组件。\n\n![](img/9be82dd80844460a2c43cbf8813817d7_141_0.png)\n\nFigure 4-13.\
  \ The figure shows the Network Lerp Rigidbody component\n\n与 Network Transform Child\
  \ 类似，我们有一个目标，即我们想要复制的相关刚体。然后，我们有我们的 lerp 设置。这些 lerp 设置决定了组件应尝试在网络同步滴答之间填补空白的程度。\n\
  \n最后，我们有我们熟悉的客户端权限布尔值，它决定谁有权控制网络刚体。\n\n## Network Rigidbody (2D and 3D Variants)\n\
  \nNetwork Rigidbody 是在网络上同步刚体的另一种方法。然而，这些不会插值其值。对于 2D 和 3D 刚体都有 Network Rigidbody\
  \ 组件。\n\n其同步属性与我们刚刚介绍的 Network Lerp Rigidbody 组件（图 4-14）有点不同，所以让我们看一下。\n\n这里，我们也有一个可以指定的目标。我们还添加了一些复选框，可以让我们更好地控制应同步哪些属性。\n\
  \n这种额外的控制可以帮助我们在许多情况下减少网络带宽，例如我们可能只想同步速率的移动平台。\n\n![](img/9be82dd80844460a2c43cbf8813817d7_142_0.png)\n\
  \nFigure 4-14. The figure shows the Network Lerp Rigidbody component\n\n\n\n\n\n\
  如果玩家被对手玩家吃掉，那么他们会在地图上随机重生，恢复最初的10分，而他们原有的分数则转移给对手玩家。\n\n游戏还应提供退出菜单，以及返回主菜单的选项。\n\
  \n## 卡住了怎么办？\n\n为了帮助你完成这个挑战，我基于经典的 snake.io 游戏制作了一个示例游戏。我鼓励你仔细研究代码并从中学习，从而攻克我提供的挑战。\n\

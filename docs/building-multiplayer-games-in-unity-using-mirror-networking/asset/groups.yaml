    # Summary


    In this chapter, we learned about Mirror Networking and different networking architectures,
    transport layers, as well as the server, client, and host. We also learned about
    the network manager and how to configure a multiplayer environment. We then dove
    into authentication, player objects, and registering spawnable prefabs.


    In the next chapter, we’ll discuss the chain of command and get a solid understanding
    of authority and how it impacts the way that you build a multiplayer game using
    Mirror.


    # EXERCISE 1 – CREATING A CUSTOM OAUTH2 AUTHENTICATOR USING GOOGLE


    So, we’re looking to build a custom authenticator using Google login. The standard
    route to do this would be to use Google’s SDK; however, if you’re looking to develop
    something that also supports desktop, you’ll encounter a certain hurdle. As of
    writing, Google’s SDK does not support native unity desktop applications.


    In order to build a login flow for the desktop build target, you would need to
    build an entirely custom login flow using the player’s browser, and then intercept
    the web response.



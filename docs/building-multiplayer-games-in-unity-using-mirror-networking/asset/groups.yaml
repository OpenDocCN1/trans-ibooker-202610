  - '[PAGE 54]


    Port numbers are always associated with an IP address and typically represented
    alongside the IPv4 address as follows:


    ```

    `192.168.10.1:4000`

    ```


    In the previous example, we know that the IP address is 192.168.10.1, with a port
    number of 4000. It’s important to note that for TCP, only a single process may
    bind to a specific IP and port combination. For programs communicating using TCP,
    if two applications bind to the same IP address and port, there will be conflicts,
    known as Port Conflicts, which will result in undesired effects.


    So if we’re using TCP, how do we know what port number to host our game on? How
    do we know that the port number will not conflict with any other running software
    our customers might be using? 65353 ports are not a lot of ports.


    The answer is working together with other developers; there are several standards
    in place when it comes to choosing a port number. These standards are put in place
    by the Internet Assigned Numbers Authority (IANA).


    The full list of registered ports can be found on the IANA website, [https://iana.org](https://iana.org),
    under the Service Name and Transport Protocol Port Number Registry.


    Ports are split into three categories.


    # Well-known Ports (0-1023)


    These ports are a no-go when creating your own custom applications. They’re some
    of the most highly used ports and are typically reserved for core systems. Here
    are some of the most well-known ports as an example (Figure 2-18).'

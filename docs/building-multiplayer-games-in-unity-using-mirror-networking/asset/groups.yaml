    此外，传输层还可以充当其他传输层的中间人。它们可以提供额外的逻辑和功能，例如添加加密或提供 NAT 穿透。Monke 能够为传输层中传输的数据提供加密就是一个很好的例子。


    这种传输层数据的交接也为其他传输层添加打开了可能性，例如回退传输组件。


    ## 回退传输组件


    回退传输组件是规避平台限制的好方法。它允许我们在主要传输层在客户端当前平台上无法工作时切换到其他传输层。让我们看一下图 3-2。



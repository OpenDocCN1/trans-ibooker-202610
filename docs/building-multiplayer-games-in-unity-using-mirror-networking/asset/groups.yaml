  - "[PAGE 125]\n\nRPC attributes can contain a special argument in the attribute\
    \ flag called “includeOwner.” This defaults to true if you do not pass the argument.\
    \ If you decide to pass the argument, your new attribute would look more like\
    \ the following:\n\n```\n[RPC(includeOwner = false)]\npublic void Jump()\n{\n\
    \    PlayerController.Jump();\n}\n```\n\nAnd now, your RPC will only execute on\
    \ clients and exclude the host player. Typically, there aren’t many reasons to\
    \ do this, but the functionality exists.\n\n# TargetRPC Attribute\n\nThe TargetRPC\
    \ is much like the RPC attribute. TargetRPC simply stands for Target Remote Procedure\
    \ Call. Much like the RPC attribute, we need to add an attribute, this time, the\
    \ TargetRPC attribute.\n\nThe TargetRPC requires one additional step, though.\
    \ We must include a NetworkConnection as an argument to the method as the first\
    \ argument, or the code will not work. Let’s see what that looks like:\n\n```\n\
    [TargetRPC]\npublic void Jump(NetworkConnection connection)\n{\n    PlayerController.Jump();\n\
    }\n```\n\nYou can then call the remote procedure call and pass in the network\
    \ connection of the player you would like to invoke the remote procedure on. Some\
    \ IDEs may warn that the argument is not being used, but this is not the case,\
    \ and you can safely ignore this warning.\n\n# Commands\n\nSo, what if we’d like\
    \ to have a client execute a method on the server? We can use commands to do this;\
    \ they’re much like RPCs, in the sense that we can use command attributes to identify\
    \ methods for the Mirror Networking compiler."

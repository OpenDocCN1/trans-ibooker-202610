    \ yourself with creating applications with cloud-based user data persistence.\n\
    \n# Challenge #3 – Chat Room App with a User Message History\n\n# Overview\n\n\
    For this challenge, I want you to create a chat room application. The goal is\
    \ to have your application connect to a dedicated game server and prompt the user\
    \ to enter a display name upon joining.\n\nThe user should see a list of all connected\
    \ user display names, including their own in alphabetical order. There should\
    \ also be a window for the chat. When a new user joins the chat room, the application\
    \ should display a message in the chat.\n\nYou should store all messages and their\
    \ sender display names in an Amazon DynamoDB database. Upon rejoining, the application\
    \ should show the user all of the recent messages. Let’s take a look at Figure\
    \ 8-3:\n\n![](img/9be82dd80844460a2c43cbf8813817d7_222_0.png)\n\nFigure 8-3. The\
    \ figure depicts a simple messaging app\n\nFor this challenge, we’re not worried\
    \ about security, authentication, or even best practices. I want you to solve\
    \ a requirement that almost any online game has – the need for text chat.\n\n\
    Text chat is a core part of any online multiplayer game, as it allows users to\
    \ make new friends, strategize, or just be rude to one another. If you’re developing\
    \ a multiplayer product, chances are, you’ll need to know how to do this.\n\n\
    So, let’s get to it.\n\n# The Challenge\n\n- Develop a multiplayer application\
    \ that allows for up to 200 connected clients using the Mirror KCP transport.\n\
    - Have the application automatically attempt to connect to the game server, retrying\
    \ until a connection is successful.\n- The application should have an Exit menu.\n\
    - The application should have a screen notifying the user that they are currently\
    \ connecting.\n- The application should prompt the user to choose a display name.\
    \ Remember their last display name using player prefs.\n- The application should\
    \ show all users currently connected.\n- The application should have a chat window\
    \ for displaying the user messages.\n- There should be a text input and Send Message\
    \ button.\n- The application should use Mirror Networking’s Network Messages.\n\
    - The application should display a notification in the chat that shows whenever\
    \ a user joins the conversation with a timestamp.\n- All user messages should\
    \ display timestamps of messages.\n- All user messages should display the sender’s\
    \ display name.\n- Messages sent by a user should appear differently for that\
    \ user. IE. A different chat box color.\n\n# Bonus Challenge\n\nUp for a challenge?\
    \ Here are some additional tasks to complete for this challenge to push your understanding\
    \ of Mirror Networking:\n\n- Users should directly message other users in a separate\
    \ chat window by clicking on the target user within the left user menu. This chat\
    \ should also persist and be accessible between sessions.\n- Allow for users to\
    \ create a group chat. The group chat name should show up within the left user\
    \ menu to all members within the group chat.\n- Allow for users to choose an image\
    \ file and upload it to the chat. You can handle this however you’d like, as long\
    \ as the image persists between sessions.\n- Allow a user to block another user.\
    \ That user’s messages should show up as “Blocked Message,” and the blocked user\
    \ should not have the ability to send direct messages to the blocking user.\n\
    - Ensure that your user interface can adjust to multiple screen resolutions.\n\
    - Deploy a build to Android, and have the android client able to connect to the\
    \ chat. This Android client should function identically to the desktop client.\n\
    - Sanitize your user inputs to prevent breaking your database and application\
    \ by removing TMPText markdown and glitchy ASCII symbols (see https://en.wikipedia.org/wiki/Zalgo_text\
    \ ).\n\n# Challenge #4 – Farming Mechanics with World Persistence\n\nFarming games\
    \ are a popular genre of co-op play. Taking a look at the popularity of Stardew\
    \ Valley and Slime Rancher, we can see that people love spending time acquiring\
    \ resources and unlocking new crops or, in the case of Slime Rancher, slimes.\n\
    \nWe’ll be taking inspiration from Stardew Valley and building out some multiplayer\
    \ farming mechanics for this challenge. The game should use a dedicated server\
    \ that clients can connect to and authenticate with, where we’ll challenge your\
    \ usage of Mirror Network Authenticators.\n\nThe game itself should be a simple\
    \ top-down game with a follow camera and use WASD movement. The player, which\
    \ can be a capsule, should face the direction of the mouse and have an interface\
    \ consisting of a hot bar toward the bottom middle of the screen. The hot bar\
    \ should have nine squares, with the current selection outlined. This hot bar\
    \ will represent the player inventory.\n\nThe hot bar should display the item\
    \ currently selected. You can do this simply by showing the name of the item and\
    \ the number of items that the player is holding.\n\nThere should also be a display\
    \ toward the top left that shows how much money the player currently has.\n\n\
    Let’s take a look at Figure 8-4 to get a better understanding of the challenge.\n\
    \n![](img/9be82dd80844460a2c43cbf8813817d7_225_0.png)\n\nFigure 8-4. The figure\
    \ depicts the player hot bar\n"
  mdcn: "\n\n- 创建一个拾取物，使对手的球拍缩小 25%。该拾取物应在回合结束时重置。\n- 添加障碍物，使其在回合中随机生成在游戏空间的中间三分之一区域内。\n\
    - 将障碍物的数量限制为三个，并且在最初的 10 秒过后，每 10 秒才生成一个障碍物。\n- 与该障碍物碰撞应将其摧毁并按预期反射球。\n- 防止障碍物生成在球的正上方。\n\
    - 如果障碍物将与另一个障碍物相交，则更改原始障碍物的颜色，并需要额外一次击打才能破坏该障碍物。\n- 添加一个退出菜单，允许玩家返回主菜单。\n\n提示\
    \ 在此过程中你可能会遇到一些小问题，因此我准备了一些提示，可能有助于你在本次挑战中。\n\n- 在花费时间创建游戏循环之前，请考虑确保你的网络连接运行顺畅。\n\
    - Vector3.Reflect() 是计算反射角度的绝佳方法；你可以在 Unity 开发者文档中阅读更多关于它及其用法的介绍：https://docs.unity3d.com/ScriptReference/Vector3.Reflect.html\n\
    - 在测试时以窗口模式和较低分辨率构建你的游戏。这样可以让你同时看到两个游戏窗口。你可以在 Unity 的 Player Settings 中，在 Resolution\
    \ and Presentation 下进行此操作。\n- 请记住确保你的球拍逻辑仅在拥有客户端上执行。\n\n- 攻击应在撞击处生成一个没有碰撞体的微小立方体，持续一秒。如果击中敌人或其他玩家，该立方体应为红色；如果击中环境，则为黑色。\n\
    - 攻击应有 1 秒的冷却时间。\n- 攻击应消耗弹药，如果玩家没有弹药，则不应发射或进入冷却。\n- 用攻击击中敌人应造成伤害。当敌人生命值降至零时，他们应变灰色，留下其物体。\n\
    - 弹药拾取物应在地图各处随机生成，为碰撞的玩家提供 20 发弹药。每五次击杀，地图上应生成一个弹药拾取物。\n- 在屏幕右下角显示玩家的当前弹药。\n-\
    \ 如果玩家死亡，其角色，例如胶囊，应变灰色。\n- 游戏应继续进行，直到没有玩家剩余或玩家累计击杀一百个敌人。\n- 获胜时，显示胜利屏幕并提供再次游玩的选项。\n\
    - 失败时，显示失败屏幕，并提供再次游玩的选项。\n\n# 奖励挑战\n\n如果你喜欢这个挑战并想进一步挑战自己，这里有一些奖励挑战供你完成：\n\n- 添加一个恢复系统。如果玩家死亡，允许另一名玩家走到该玩家身边并按住\
    \ E 键 5 秒钟来复活该玩家。\n- 添加以下武器，玩家可以通过按 1–3 或使用鼠标滚轮在它们之间切换。这些武器不应共享冷却时间，但应仅在激活时扣除冷却时间。游戏应在屏幕底部显示当前激活的武器：\n\
    \  - 默认武器。\n\n- 你可以使用 Unity 的 NavMeshAgents 进行敌人移动，甚至玩家移动，如果你愿意的话。它们使用起来毫不费力。查看\
    \ Unity 开发者文档：https://docs.unity3d.com/ScriptReference/AI.NavMeshAgent.html\n\
    - 请记住将你的环境标记为 Navmesh Static，并烘焙你的 navmesh 数据。\n- 如果你难以生成预制体，请记住将其包含在可生成预制体列表中。首先实例化游戏对象，然后再生成它。\n\
    \n# 中级挑战 – 用户数据持久化\n\n是时候做一些更具挑战性的内容了。我们将围绕用户数据持久化来开展以下挑战。我鼓励你使用 Amazon DynamoDB\
    \ 来完成以下挑战，以便熟悉使用基于云的用户数据持久化创建应用程序。\n\n# 挑战 #3 – 带有用户消息历史的聊天室应用\n\n# 概述\n\n对于本次挑战，我希望你创建一个聊天室应用程序。目标是让你的应用程序连接到专用的游戏服务器，并在加入时提示用户输入显示名称。\n\
    \n用户应按字母顺序看到所有已连接用户的显示名称列表，包括他们自己的。还应有一个聊天窗口。当新用户加入聊天室时，应用程序应在聊天中显示一条消息。\n\n你应在\
    \ Amazon DynamoDB 数据库中存储所有消息及其发送者显示名称。重新加入时，应用程序应向用户显示所有最近的消息。让我们看一下图 8-3：\n\n\
    ![](img/9be82dd80844460a2c43cbf8813817d7_222_0.png)\n\n图 8-3. 该图描绘了一个简单的消息应用\n\
    \n对于本次挑战，我们不担心安全、身份验证，甚至最佳实践。我希望你解决几乎任何在线游戏都有的一个需求——文本聊天的需求。\n\n文本聊天是任何在线多人游戏的核心部分，因为它允许用户结交新朋友、制定策略，或只是互相冒犯。如果你正在开发多人产品，很可能你需要知道如何做到这一点。\n\
    \n那么，让我们开始吧。\n\n# 挑战\n\n- 开发一个多人应用程序，允许使用 Mirror KCP 传输最多 200 个已连接客户端。\n- 让应用程序自动尝试连接到游戏服务器，直到连接成功为止重试。\n\
    - 应用程序应具有退出菜单。\n- 应用程序应具有通知用户当前正在连接的屏幕。\n- 应用程序应提示用户选择显示名称。使用 player prefs 记住他们的上一个显示名称。\n\
    - 应用程序应显示当前所有已连接的用户。\n- 应用程序应具有用于显示用户消息的聊天窗口。\n- 应提供文本输入和发送消息按钮。\n- 应用程序应使用 Mirror\
    \ Networking 的 Network Messages。\n- 应用程序应在聊天中显示通知，显示用户何时加入对话并附带时间戳。\n- 所有用户消息都应显示消息的时间戳。\n\
    - 所有用户消息都应显示发送者的显示名称。\n- 用户发送的消息应与该用户不同。 即。 不同的聊天框颜色。\n\n# 奖励挑战\n\n想要挑战吗？以下是一些额外的任务，完成它们可以加深你对\
    \ Mirror Networking 的理解：\n\n- 用户应通过在左侧用户菜单中点击目标用户，在单独的聊天窗口中直接向其他用户发送消息。此聊天也应持久化并可在会话之间访问。\n\
    - 允许用户创建群聊。群聊名称应显示在所有群聊成员的左侧用户菜单中。\n- 允许用户选择图像文件并将其上传到聊天。你可以根据自己的喜好处理，只要图像在会话之间保持持久即可。\n\
    - 允许用户屏蔽另一用户。 该用户的消息应显示为“Blocked Message”，并且被屏蔽用户不应有向屏蔽者发送直接消息的能力。\n- 确保你的用户界面可以适应多种屏幕分辨率。\n\
    - 部署到 Android 的构建，并让 Android 客户端能够连接到聊天。此 Android 客户端应与桌面客户端功能完全相同。\n- 清理你的用户输入，以防止破坏数据库和应用程序，通过删除\
    \ TMPText markdown 和故障 ASCII 符号 https://en.wikipedia.org/wiki/Zalgo_text 。\n\n\
    # 挑战 #4 – 带有世界持久化的农场机制\n\n农场游戏是合作游玩的热门类型。看看 Stardew Valley 和 Slime Rancher 的流行程度，我们可以看到人们喜欢花费时间获取资源并解锁新作物，或在\
    \ Slime Rancher 的情况下，解锁史莱姆。\n\n我们将以 Stardew Valley 为灵感，并为本次挑战构建一些多人农场机制。游戏应使用客户端可以连接并进行身份验证的专用服务器，在此我们将挑战你对\
    \ Mirror Network Authenticators 的使用。\n\n游戏本身应是一个简单的俯视游戏，使用跟随摄像机和 WASD 移动。玩家，可以是胶囊，应面向鼠标方向并具有一个界面，底部中间有一个快捷栏。快捷栏应有九个方格，当前选择应有轮廓。此快捷栏将代表玩家库存。\n\
    \n快捷栏应显示当前选定的物品。你可以通过简单地显示物品名称和玩家持有的物品数量来实现。\n\n还应有一个显示在左上角的显示，显示玩家当前拥有的金钱。\n\n\
    让我们看一下图 8-4，以更好地理解挑战。\n\n![](img/9be82dd80844460a2c43cbf8813817d7_225_0.png)\n\
    \n图 8-4. 该图描绘了玩家快捷栏\n\n"

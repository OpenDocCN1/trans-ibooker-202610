    # Cons


    +   - Terrible for scalability with small hosting providers.

    +   - Can suffer performance hits if the shared resource is congested.


    Amazon Web Services EC2 is one of the major exceptions to the rule – with significant
    infrastructure improvements in place to reduce the cons – though at a higher cost
    than many smaller hosting providers. The same applies to Google Cloud Hosting
    and Microsoft Azure.


    So, what are the alternatives? Let’s dig into dedicated hosting next.


    # Dedicated Hosting/Bare-Metal


    Dedicated hosting takes shared hosting to the next level by alleviating the unknown
    demand of other customers on the given hardware by directly allocating hardware
    to a client. In dedicated hosting, each customer has direct access to their dedicated
    servers’ hardware, typically allowing for the fine-tuning of GPU and CPU resources.


    Bare-metal servers get their name from this direct access to hardware, where the
    provider does not wrap the server instance within a virtualization technology.



    Then finally, we have the usual sync settings.


    # Network Lerp Rigidbody


    The Network Lerp Rigidbody component is an alternative to managing transform replication.
    It’s advantageous in a situation where you want to replicate a non-kinematic rigid
    body over the network.


    However, using a Network Transform on a rigid body may yield odd behavior with
    the physics system, as the rigid body itself will not have its velocity modified.
    To counteract this issue, we have the Network Lerp Rigidbody.


    A Network Lerp Rigidbody synchronizes the velocity values of the rigid body and
    its associated position.


    It’s important to note that a network identity should not have a Network Transform
    and a Network Lerp Rigidbody component. You should choose one or the other depending
    on the needs of your product, typically favoring Network Transform, unless velocity
    is important – such as rigidbody platforms, or player interactable rigidbodies.
    Let’s take a look at the component in Figure 4-13.


    ![](img/9be82dd80844460a2c43cbf8813817d7_141_0.png)



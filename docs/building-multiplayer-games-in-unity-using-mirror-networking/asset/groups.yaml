    通常来说，你不需要太担心数据类型。过早优化这里往往会浪费时间，而我们本可以优化其他东西。然而，重要的是要知道并非所有数据类型都相等。


    使用最适合你需求的数据类型。让我们将我们门的 数据类型与图 **2-7** 中的进行比较。在我们的门类中，我们正在复制 **openAmount**，它将是一个
    *0 - 1* 的值，或者也许将来我们会添加破坏门的能力，在这种情况下我们可以使用 *-1*。因此，**openAmount** 永远的整个范围是 -1 到
    1。


    我们的 **openAmount** 属性目前是 double 数据类型。double 数据类型允许具有高小数精度的巨大范围。然而，这种增加的数据量是有代价的。那么什么其他数据类型能让我们在所需范围内拥有小数？查看图
    **2-7** 并试着弄明白。


    查看图表，我们需要一种支持我们范围内数字且能支持小数分数的数据类型。我们也不需要广泛的范围。因此，这里理想的数据类型是 float。


    float 会花费我们 4 字节的数据，而不是 double 类型的 8 字节。这就是所需数据的一半，很棒！


    让我们以每扇门每位玩家每 2 秒 4 字节重新计算，这就降到每扇门每位玩家每秒 2 字节。这就把实现门的带宽成本降到了每月 ~$2,896。相比之下是每月近
    $2 百万。


    还有更多方法可以进一步优化，例如仅在玩家按下交互键时才复制门。不是复制一个变量，我们只在玩家与门交互时向服务器发送一个命令。我们将在本书后面更详细地介绍这一点。


    在更深入地研究多人游戏之前，让我们先介绍一些网络原理。


    ### Network Topologies


    所以我们开始了解设备如何向另一台设备发送数据。如果我们有两台已连接的设备，会发生什么当我们想要添加第三台时？第三台设备如何融入这种网络关系？这就是网络拓扑发挥作用的地方。


    网络拓扑是网络上设备的排列方式。你的家庭网络就是一个很好的例子。你家里可能有一个连接到互联网的路由器。连接到你的路由器的是你所有的设备。这就是星型拓扑的绝佳例子。


    端口号始终与 IP 地址相关联，通常与 IPv4 地址一起表示如下：


    `192.168.10.1:4000`


    在前面的示例中，我们知道 IP 地址是 192.168.10.1，端口号为 4000。需要注意的是，对于 TCP，只能有一个进程绑定到特定的 IP 和端口组合。对于使用
    TCP 通信的程序，如果两个应用程序绑定到相同的 IP 地址和端口，将会出现冲突，称为端口冲突，这将导致不期望的效果。


    那么如果我们使用 TCP，我们如何知道要在哪个端口号上托管我们的游戏？我们如何知道端口号不会与客户可能使用的其他运行软件冲突？65,535 个端口并不是很多。


    答案是与其他开发者一起合作；选择端口号时有几个标准。这些标准由互联网号码分配机构（IANA）制定。


    完整的注册端口列表可以在 IANA 网站上找到，[https://iana.org](https://iana.org)，在服务名称和传输协议端口号注册表中。


    端口分为三个类别。


    ### Well-known Ports (0-1023)


    这些端口在创建自己的自定义应用程序时是不可用的。它们是最常用的端口之一，通常保留给核心系统。以下是一些最著名的端口示例（图 2-18）。


    ## CHAPTER 2   THE MESSENGER PIGEON, PACKETS, AND A TRIP AROUND THE WORLD


    ### When Do We Use It?


    你应该始终将 Zenmap 放在你的调试工具库中。该工具功能强大，值得学习。如果你连接游戏服务器有困难，请考虑对服务器运行端口扫描以确保端口是开放的。


    ### FileZilla


    FileZilla 是一个免费的开源文件传输协议应用程序，由 FileZilla Client 和 FileZilla Server 组成（图 2-23）。它允许我们将文件部署到用于托管测试服务器的远程服务器，而不是通过远程桌面协议复制它们。


    下载：[https://filezilla-project.org/download.php](https://filezilla-project.org/download.php)


    **Platforms:**

    - Windows

    - Linux

    - Mac


    ![](img/9be82dd80844460a2c43cbf8813817d7_64_0.png)


    *Figure 2-23.* A screenshot depicting the FileZilla interface awaiting connection
    to an FTP server


    ### What Does It Do?


    FileZilla 是一个文件传输协议（FTP）应用程序，让你可以快速轻松地在 FTP 客户端（FileZilla Client）和 FTP 服务器（FileZilla
    Server）之间传输文件。


    ### EXERCISE 3 – CONFIGURING THE WINDOWS FIREWALL


    在你拥有游戏服务器之前，你需要知道如何配置 Windows 防火墙。


    如果不配置 Windows 防火墙，你的用户将无法连接到游戏服务器。因此，让我们为一个端口打开防火墙；建议在沙箱环境中执行此操作。或者，完成练习后只需记得删除记录。我们不想制造任何安全风险。


    Step 1 – 打开 Windows 防火墙高级设置。你可以通过在 Windows 搜索栏中搜索它，或按 Windows 键 + R，然后输入 `control
    firewall.cpl` 并按回车，然后在左侧面板导航到高级设置来完成此操作。


    Step 2 – 现在 Windows 防火墙高级设置已打开，导航到入站规则，然后从右侧面板选择新建规则。见图 2-31。


    ![](img/9be82dd80844460a2c43cbf8813817d7_72_0.png)


    Figure 2-31. The screenshot shows how we can add a new inbound firewall rule


    我们创建入站规则是因为我们希望允许传入连接连接到我们。


    Step 3 – 在此选项列表中选择端口以创建规则，然后按下一步（图 2-32）。


    '

    # EXERCISE 3 – CONFIGURING THE WINDOWS FIREWALL


    Before you have a game server, you’ll need to know how to configure the Windows
    Firewall.


    Without configuring the Windows Firewall, your users won’t have a way of actually
    connecting to the game server. So, let’s open the firewall to a port; it’s recommended
    to do this in a sandbox environment. Alternatively, just remember to delete the
    record after completing the exercise. We wouldn’t want to create any security
    risks.


    Step 1 – Open Windows Firewall with Advanced Settings. You can do this by searching
    for it in the Windows search bar or pressing Windows Key + R, then typing in control
    firewall.cpl and pressing enter, then navigating to Advanced Settings on the left
    panel.


    Step 2 – Now that you have Windows Firewall with Advanced Settings open, navigate
    to Inbound Rules, then select New Rule from the right-hand panel. See Figure 2-31.


    ![](img/9be82dd80844460a2c43cbf8813817d7_72_0.png)


    Figure 2-31. The screenshot shows how we can add a new inbound firewall rule


    We’re creating an Inbound Rule because we want incoming connections to be allowed
    to connect to us.


    Step 3 – Select Port on this list of options that you’d like to create the rule
    for, then press Next (Figure 2-32).'

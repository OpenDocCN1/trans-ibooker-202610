    ## 镜像大厅


    现在我们了解了网络基础知识，我们可以更详细地讨论 Unity 中的多人游戏。我们将使用 Mirror Networking 在 Unity 中实现可扩展的多人网络。


    那么 Mirror Networking 究竟是什么？Mirror Networking 是一个于 2018 年 10 月发布的网络库。它是为了修复被忽视的
    UNET 并为其他开发者提供一个平台，以便他们在此基础上扩展、提交改进并协作而创建的。


    Mirror 使用命令-RPC 网络结构，其中每个连接都需要对对象拥有权限才能在网络上修改它。Mirror Networking 易于实现且不会牺牲可扩展性。Mirror
    Networking 非常适合小型工作室和希望创建 MMO 级网络的大型 AAA 工作室。


    Mirror 的优点在于客户端和服务器都是同一个项目，有助于在开发期间提高生产力。


    ## 架构


    正如我之前简要提到的，Mirror 使用命令-RPC 网络结构。命令-RPC 架构意味着客户端和服务器通过命令（客户端到服务器）和远程过程调用（服务器到客户端）进行通信。命令允许客户端在自己拥有权限的对象上在服务器上执行远程方法。这是一种让客户端要求服务器执行给定命令的方式。


    相反，RPC 允许服务器远程在客户端上执行方法。服务器和客户端之间的这种往返构成了我们网络的基础，使我们能够在网络上传输各种支持的数据类型和引用。命令-RPC
    架构使代码比其他网络解决方案更容易遵循。



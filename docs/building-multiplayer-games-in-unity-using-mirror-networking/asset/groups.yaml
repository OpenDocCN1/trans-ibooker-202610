    \ with new crop types. You can make a class serializable within a scriptable object\
    \ by giving the class the [Serializable] attribute.\n- Camera.ScreenToWorldPoint\
    \ is a great way to get the player’s mouse position in world space.\n- To calculate\
    \ consumption rates, you can use “remaining -= waterConsumptionRatePerSecond *\
    \ Time.deltaTime” to reduce the remaining water relatively accurately by using\
    \ that formula within the Update loop.\n- Remember to sanitize any user inputs\
    \ as they could mess with your database or game server.\n- Do not save the plant\
    \ and world state to the database every tick as this could burn through your rate\
    \ limits on AWS DynamoDB. Instead, consider saving critical information like player\
    \ trades immediately and saving world state every few minutes in as few database\
    \ calls as possible.\n- The saving and loading will likely be one of the most\
    \ significant challenges of this exercise, and that’s the point – don’t give up.\n\
    - Consider using MessagePackC# for Unity, linked in challenge #3, to aid with\
    \ your saving and loading of world data.\n- A player should be able to harvest\
    \ and water another player’s crop; that’s something to keep in mind when planning\
    \ out your authority structure.\n\n## Challenge #5 – Box-Hoarder\n\nI’ve designed\
    \ the following challenge to push your usage of physics within a multiplayer environment,\
    \ a requirement that many modern multiplayer games have, along with reinforcing\
    \ your world persistence experience from the last challenge.\n\nThis challenge\
    \ aims to create a first-person game supporting 16 players connecting to a dedicated\
    \ server. The objective is to collect boxes within the game world and bring them\
    \ to your claimed delivery point.\n\nThere are eight delivery points scattered\
    \ around the play area. A delivery point contains a demarcated area, a Deliver\
    \ button, and an indicator that displays the current owner.\n\nThe claim indicator\
    \ is color-coded and shows the percentage of a player’s claim on the delivery\
    \ point.\n\nIf a player stands within the claim indicator, they begin claiming\
    \ the delivery site. If another player controls a delivery site, they will receive\
    \ an alert notifying them that a player is attempting to control the delivery\
    \ site. If two or more players are within the claim indicator, the claiming process\
    \ pauses until only a single player is within the ring.\n\nPlayers can pick up\
    \ a single box at a time, and upon throwing the box, it travels in front of them\
    \ in a parabolic arc. A player needs to place boxes within a demarcated delivery\
    \ point that they own and press the deliver button. For each additional crate\
    \ within the demarcated area, the game multiplies their score for the given delivery.\
    \ Let’s take a look at the Figure 8-6 for a breakdown of scoring.\n\n| Crates\
    \ | Score |\n|---|---|\n| 1 | 1 |\n| 2 | 4 |\n| 3 | 9 |\n| 4 | 12 |\n| 5 | 25\
    \ |\n| 6 | 36 |\n| 7 | 49 |\n\nFigure 8-6. The figure depicts the scoring table\
    \ for the box-hoarder\n\n- Create a basic login and account creation process when\
    \ starting the game. The user should be able to store a username, password, and\
    \ display name. We’re not too worried about security for this challenge.\n- Store\
    \ information about a user, such as the number of crates delivered successfully,\
    \ their playtime, and how many boxes they have stolen from an enemy demarcated\
    \ area.\n- Create a menu option called “Safe House” when the player joins the\
    \ safe house, loads up a scene, and spawns in boxes for each box the player has\
    \ delivered during play. The game should store this data within their account.\
    \ When leaving the safe house, save the location of all boxes for the next time\
    \ the player joins the safe house.\n- Add sound effects for crates hitting objects,\
    \ such as the floor or other crates.\n- Add some ambient music to the game.\n\
    - Allow players to be stunned and knocked down if a delivery box hits them that\
    \ another player threw.\n- Add a minimap that allows players to see the layout\
    \ of the map and an overview of control point ownership. This minimap should not\
    \ show the location of players or crates.\n- Allow the minimap to show how many\
    \ crates are within each demarcated area.\n- Allow the minimap to show how many\
    \ crates are currently active.\n- Allow the player to choose an untaken color,\
    \ and save that as a preference to their account.\n- Add the ability for players\
    \ to jump.\n- Add a more vertical map design that allows players to throw crates\
    \ down several floors. Players do not take fall damage.\n- Allow a player to carry\
    \ up to two delivery crates at a time.\n\n## Tips\n\nThe following tips may prove\
    \ helpful:\n\n- You can use network authentication to send different custom requests\
    \ to the server, such as querying information about your account. That way, you\
    \ can build a custom authentication enum that states you intend to query information\
    \ without joining. The server can see this request, validate your login, query\
    \ the data, return the data, and reject your connection.\n- Make use of Network\
    \ Rigidbody.\n- Don’t be afraid to skip some of the bonus challenges. They may\
    \ prove very challenging.\n- If you’re stuck on something, move on to a different\
    \ problem, and revisit your issue afterward.\n\nIf you were able to complete these\
    \ challenges, then you’re well on your way to building multiplayer games in Unity\
    \ using Mirror Networking. If you got stuck, then I’d encourage you to revisit\
    \ parts of the book.\n\nMultiplayer code is tricky, and sadly, there is no MakeMultiplayer()\
    \ method yet.\n\nThe biggest challenge is getting into the mindset of multiplayer\
    \ code. It requires a different way of thinking about challenges that, traditionally,\
    \ you might find easy. There are many things to consider.\n\nAll in all, the best\
    \ way to improve once you have a good foundation is through practice.\n\nAs such,\
    \ I encourage you to seek out new challenges and come up with your challenges\
    \ too; with that said, the most crucial part is to start small. If you come up\
    \ with a monumental challenge that burns you out after a month, then there’s no\
    \ point.\n\nThere are many game idea generators out there. I encourage you to\
    \ use them to come up with your challenges. Good luck!\n"
  mdcn: "\n\n玩家应该能够走到作物前并使用其浇水壶为其浇水，玩家从一开始就拥有浇水壶且无法出售。\n\n浇水壶可以通过在水上使用它来重新填充。使用浇水壶会消耗壶中的水，并且需要定期重新填充。\n\
    \n达到最大生长阶段的作物会以降低的速率消耗水，收获时会获得作物和种子。\n\n## 挑战\n\n让我们将其分解为挑战要点：\n\n- 你的游戏必须包含主菜单，允许玩家退出游戏或加入专用服务器。\n\
    - 必须有一个逃脱菜单，允许玩家退出游戏。\n- 加入专用服务器后，允许玩家创建账户或登录。用户应选择用户名、密码和显示名称。为本次挑战的目的，你可以使用明文处理所有登录，并使用带掩码的密码字段。\n\
    - 在登录期间，你应使用自定义 Mirror Authenticator 处理身份验证。然后服务器可以将用户名和密码与 DynamoDB 数据库进行比较，并允许或拒绝客户端。\n\
    - 你应将所有与玩家相关的数据存储在数据库中。你的数据存储应包括以下内容：\n  - 玩家位置\n  - 玩家快捷栏\n  - 玩家金钱\n  - 玩家账户详情\n\
    - 应该有一个购买、种植、浇水、收获和出售的游戏循环，所有操作都由服务器权威控制。\n- 游戏服务器应支持最多八名玩家。\n- 玩家显示名称应显示在玩家下方。\n\
    - 你应该为游戏创建一个小的游戏空间，其中包括：\n乌鸦的范围以吓跑它，乌鸦会破坏作物，留下玩家需要清除的死作物。\n\n## 提示\n\n与最近的挑战一样，这里有一个帮助：\n\
    \n- 你可以使用可脚本化对象来创建你的物品数据。这样可以轻松地用新的作物类型扩展游戏。你可以通过为类添加 [Serializable] 属性，使类在可脚本化对象中可序列化。\n\
    - Camera.ScreenToWorldPoint 是获取玩家鼠标在世界空间中的位置的好方法。\n- 要计算消耗速率，你可以使用“remaining -=\
    \ waterConsumptionRatePerSecond * Time.deltaTime”在 Update 循环中使用该公式来相对准确地减少剩余水量。\n\
    - 请记住对任何用户输入进行清理，因为它们可能会破坏你的数据库或游戏服务器。\n- 不要在每个 tick 都将植物和世界状态保存到数据库中，因为这可能会耗尽你在\
    \ AWS DynamoDB 上的速率限制。相反，考虑立即保存关键信息，例如玩家交易，并在尽可能少的数据库调用中每隔几分钟保存一次世界状态。\n- 保存和加载很可能将是本次练习中最具挑战性的部分，这正是重点所在——不要放弃。\n\
    - 考虑使用挑战 #3 中链接的 MessagePackC# for Unity 来帮助保存和加载世界数据。\n- 玩家应该能够收获和浇水其他玩家的作物；这是你在规划权威结构时需要考虑的事情。\n\
    \n## 挑战 #5 – Box-Hoarder\n\n我设计了以下挑战，以推动你在多人环境中使用物理的程度，这是许多现代多人游戏的要求，同时也强化了你在上一个挑战中获得的世界持久化经验。\n\
    \n本挑战旨在创建一个支持 16 名玩家连接到专用服务器的第一人称游戏。目标是在游戏世界中收集箱子并将其带到你所声称的交付点。\n\n有八个交付点散布在游戏区域周围。交付点包含一个划定区域、一个交付按钮和一个显示当前所有者的指示器。\n\
    \n声明指示器为颜色编码，并显示玩家对交付点的声明百分比。\n\n如果玩家站在声明指示器内，他们就开始声明交付站点。如果另一个玩家控制着交付站点，他们将收到警报，通知他们有玩家正在尝试控制交付站点。如果两个或更多玩家在声明指示器内，声明过程将暂停，直到只有一个玩家在环内。\n\
    \n玩家一次只能拾取一个箱子，并且在投掷箱子时，箱子会在他们面前以抛物线弧线飞行。玩家需要在他们拥有的划定交付点内放置箱子并按下交付按钮。每在划定区域内多一个箱子，游戏就会将其得分乘以该交付的分数。让我们看一下图\
    \ 8-6，了解计分的分解。\n\n| 箱子 | 分数 |\n|---|---|\n| 1 | 1 |\n| 2 | 4 |\n| 3 | 9 |\n| 4\
    \ | 12 |\n| 5 | 25 |\n| 6 | 36 |\n| 7 | 49 |\n\n图 8-6。 该图描绘了箱子收集者的计分表\n\n- 在游戏开始时创建基本的登录和账户创建流程。用户应能够存储用户名、密码和显示名称。对于本次挑战，我们不太担心安全性。\n\
    - 存储有关用户的信息，例如成功交付的箱子数量、游戏时间以及他们从敌方划定区域偷来的箱子数量。\n- 创建一个名为“安全屋”的菜单选项，当玩家加入安全屋时，加载一个场景，并在玩家在游戏中交付的每个箱子处生成箱子。游戏应将此数据存储在其账户中。离开安全屋时，保存所有箱子的位置，以便玩家下次加入安全屋时使用。\n\
    - 为箱子撞击物体添加音效，例如地面或其他箱子。\n- 为游戏添加一些环境音乐。\n- 允许玩家在被其他玩家投掷的交付箱击中时被击晕并击倒。\n- 添加一个小地图，允许玩家查看地图布局和控制点所有权的概览。此小地图不应显示玩家或箱子的位置。\n\
    - 允许小地图显示每个划定区域内的箱子数量。\n- 允许小地图显示当前活动的箱子数量。\n- 允许玩家选择一个未被占用的颜色，并将其保存为其账户的偏好设置。\n\
    - 添加玩家跳跃的能力。\n- 添加更垂直的地图设计，允许玩家将箱子扔下几层楼。玩家不会受到坠落伤害。\n- 允许玩家一次携带多达两个交付箱。\n\n##\
    \ 提示\n\n以下提示可能有所帮助：\n\n- 你可以使用网络身份验证向服务器发送不同的自定义请求，例如查询有关你的账户的信息。这样，你就可以构建一个自定义身份验证枚举，说明你打算在不加入的情况下查询信息。服务器可以看到此请求，验证你的登录，查询数据，返回数据并拒绝你的连接。\n\
    - 使用 Network Rigidbody。\n- 不要害怕跳过一些奖励挑战。它们可能非常具有挑战性。\n- 如果你卡在某个问题上，继续处理不同的问题，然后之后再回过头来解决你的问题。\n\
    \n如果你能够完成这些挑战，那么你就正朝着使用 Mirror Networking 在 Unity 中构建多人游戏的方向迈进。如果你卡住了，我鼓励你重新阅读本书的某些部分。\n\
    \n多人代码很棘手，可惜的是，目前还没有 MakeMultiplayer() 方法。\n\n最大的挑战是进入多人代码的心态。它需要一种不同的思考方式来应对传统上你可能觉得容易的挑战。有很多事情需要考虑。\n\
    \n总的来说，一旦你有了良好的基础，最好的提高方式是通过练习。\n\n因此，我鼓励你寻找新的挑战并自己提出挑战；话虽如此，最关键的部分是从小开始。如果你提出一个庞大的挑战，一个月后就让你精疲力尽，那么就没有意义了。\n\
    \n外面的游戏创意生成器有很多。我鼓励你使用它们来为你的挑战提出想法。祝好运！\n\n"

    +   - **PlayerSpawnMethod** - Specifies if Mirror Networking should spawn the
    player at random NetworkStart locations or in a round-robin style. For this to
    work, you need to have game objects in the scene with a NetworkStart component.


    # Registered Spawnable Prefabs


    The registered spawnable prefabs is a list of manually registered prefabs that
    are allowed to be spawned during runtime. These can be assigned automatically
    too using a different process that we’ll cover later in this book. For now, it’s
    important to note that any prefab not in the scene file needs to be registered
    in this list if you intend to instantiate and spawn the prefab during the game.
    We’ll cover spawning networked objects later in the book.


    # Network Identities


    Network identities are the heart of Mirror Networking; they’re used to identify
    objects over the network. If something needs to be networked, it needs a network
    identity. More importantly, a network identity cannot be a child of another networking
    identity. This is important to know, as future versions of Mirror will outright
    stop this from happening. So, it’s best to keep any networking logic on the root
    of your networked prefab, along with its network identity. It’s also important
    to note that any network identities that exist in the scene, before a server exists
    and is connected to, will be disabled by Unity. This is important because executing
    logic in Awake will cause the logic to execute, then have the object spawned,
    potentially destroying some logic that was initialized in Awake and not calling
    awake again. So, it’s best to avoid Awake for any components attached to a network
    object. Instead, have your class derive from NetworkBehaviour, and call public
    void override OnStartClient. We’ll discuss network behaviors later in the book
    when we go into more detail on the coding behind creating multiplayer games using
    Mirror Networking.'

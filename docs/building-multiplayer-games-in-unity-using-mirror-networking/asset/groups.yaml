    # CHAPTER 7


    # Insights from the Masters


    Sometimes it’s important to seek inspiration from others, whether for motivation
    or understanding. Seeking knowledge from a master in a field can provide valuable
    insights and knowledge into a given topic.


    In this chapter, I’ve interviewed some of these masters who’ve helped bring the
    games you love to market.


    Let’s take a look. First up, we have Michael W., the creator of Mirror Networking,
    better known in the community as vis2k. Then, we have Curt, a senior solutions
    architect who’s been involved in games like Apex Legends and Fall Guys.


    # Michael “vis2k” W. – Mirror Networking


    Michael W. is the creator and founder of Mirror Networking. He and the contributors
    of Mirror Networking are why this book and many games are even possible in the
    first place. A special thank you to Michael for taking the time for this interview.


    # Tell Me a Bit About Yourself and Where You Come From


    I was born in Germany and switched schools when I was 15-ish, away from my friends.


    I didn’t have the best time, so I started playing one of the early Asian grinder
    MMOs.


    Super fascinated by that virtual world. I met so many people. Wanted to do my
    own MMO ever since.


    So, I started reverse-engineering MMOs and developed bots to learn and have some
    income. I got into OpenGL and Delphi, C++, etc. Made my first engine, always with
    MMO as the goal.


    Little town and environment, couple of monsters, server actually ran stable for
    months at a time. 60ish CCU, not much yet. Realized productivity was not ideal
    in C++. 60k LOC for a simple MMO scene already.'

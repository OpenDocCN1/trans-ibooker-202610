    \ the following link.\nhttps://github.com/VoidFletcher/MirrorSamples-WormGame\n\
    Please feel free to reach out with any issues or questions via GitHub issue tracking.\n\
    \n## Data Persistence for Large-Scale Multiplayer Games\n\nWhen it comes to global,\
    \ scalable games, the best choice of data persistence is using databases. Databases\
    \ are widely available and are a highly performant way of handling user data securely.\
    \ We can even have multiple game servers served by a single database.\n\n### Pros\
    \ of Using a Database for Data Persistence\n\n- **Highly performant** - Developers\
    \ have created databases with performance in mind. Almost all websites and applications\
    \ that you use interact with a database at some point in its lifecycle.\n- **Scalable**\
    \ - Speed and scalability are at the heart of database design. Whether you’re\
    \ serving a thousand users or a billion users, databases are designed for scalability.\n\
    - **Affordable** - Hosting a database is easy to do on your own, and there are\
    \ many inexpensive services out there that can do it for you.\n- **Secure** -\
    \ Very importantly, when it comes to databases, security is a core focus.\n\n\
    ### Cons of Using a Database for Data Persistence\n\n- **Can be challenging at\
    \ first** - Databases can be challenging at first, but they start to make sense\
    \ quickly. However, it can take years to master database development, maintenance,\
    \ and administration.\n- **Requires a bit of extra development time** - You’ll\
    \ need to design and implement your database architecture and program the interface\
    \ between your database and your game server. This additional work can add development\
    \ time into the mix.\n\nSo, what exactly are databases?\n\nFirstly, in our AWSDatabaseApi\
    \ class, or whatever class you’re using to populate your database, we’ll need\
    \ to add a new DynamoDBContext object. This DynamoDBContext object will give our\
    \ code context on how the Database should look. Let’s take a look at the following\
    \ code:\n\n```csharp\nprivate DynamoDBContext context;\n```\n\nNow that we have\
    \ a DynamoDBContext object, we’ll need to populate it with the context of our\
    \ database by initializing it. You’ll want to ensure that you only call this code\
    \ after you have initialized your IAmazonDynamoDB object:\n\n```csharp\nprivate\
    \ async void AddNewRandomPlayer()\n{\n    context = new DynamoDBContext(client);\n\
    \n    Player newPlayer = new Player\n    {\n        PlayerId = \"newPlayer-\"\
    \ + Random.Range(0, 1000),\n        PlayerDeaths = Random.Range(0, 30),\n    \
    \    PlayerKills = Random.Range(0, 30)\n    };\n\n    await context.SaveAsync<Player>(newPlayer);\n\
    }\n```\n\nIn the code, we’re getting the context of our database by using our\
    \ database client connection. Then we’re creating a new player object. That player\
    \ object is what we decorated with the required attributes.\n\nWe can then populate\
    \ the player object with our required data and call the SaveAsync method of our\
    \ DynamoDBContext. Once the await call completes, you’ll have a newly generated\
    \ player item in your “Players” table. Again, the significant part about this\
    \ is that none of the fields, excluding the key, are required. Adding additional\
    \ fields to our player object will add them to the database as new columns, too!\n\
    \nThe code will generate a new user with the player ID of “Demo Player.” We then\
    \ assign three deaths, and zero kills to the player. Let’s run that code, and\
    \ check in on our DynamoDB web interface. Let’s take a look at Figure 5-11 to\
    \ see our results.\n\n![](img/9be82dd80844460a2c43cbf8813817d7_178_0.png)\n\n\
    **Figure 5-11.** *The figure shows our demo player item in the “players” table*\n\
    \nThere is our player, with three deaths and no kills. Let’s update the player’s\
    \ kills. If you’re using my example, right-click the AWSDatabaseApi component,\
    \ and choose “Update Demo Player Kills Randomly.”\n\nLet’s take a look at the\
    \ following code to see what’s happening:\n\n```csharp\nprivate async void UpdateDemoPlayerKillsRandomly()\n\
    {\n    var existingPlayer = await context.LoadAsync<Player>(\"Demo Player\");\n\
    \n    if (existingPlayer == null)\n    {\n        Debug.LogError(\"Demo player\
    \ does not exist yet.\");\n        return;\n    }\n\n    existingPlayer.PlayerKills\
    \ = Random.Range(1, 1000);\n\n    await context.SaveAsync(existingPlayer);\n}\n\
    ```\n\nHere, we find the existing player object by hash key using “context.LoadAsync”\
    \ with the type “Player.” We then update the “player kills” value, and pass the\
    \ object back into our database using “context.SaveAsync.”\n\nLet’s head back\
    \ to our DynamoDB web interface to see our changes.\n\n- Suitable for small independent\
    \ studios.\n- Suitable for development environments.\n- Ideal for webserver hosting.\n\
    - Suitable for small player-run game servers.\n- Easy to get started.\n\n### Cons\n\
    \n- Terrible for scalability with small hosting providers.\n- Can suffer performance\
    \ hits if the shared resource is congested.\n\nAmazon Web Services EC2 is one\

  md: "\nIf the player is eaten by an opposing player, then they respawn randomly\
    \ on the map with their starting 10 points and their original points are transferred\
    \ to the opposing player.\n\nThe game should also have an exit menu, as well as\
    \ the option to return to the main menu.\n\n## What If I Get Stuck?\n\nTo help\
    \ you with this challenge, I’ve created a sample game based on the iconic snake.io\

  - '[PAGE 37]


    Now generally, you don’t need to worry too much about data types. Overoptimizing
    here can often waste time when we can optimize other things instead. However,
    it’s essential to know that not all data types are equal.


    Use the data type that is best suited for your needs. Let’s compare our door’s
    data types to that of Figure **2-7**. In our door class, we’re replicating **openAmount**,
    which will be a value of *0 - 1*, or perhaps in the future, we’ll add the ability
    to break the door, in which case we could use *-1*. So, the whole range that **openAmount**
    will ever be is -1 to 1.


    Our **openAmount** property is currently of the double data type. The double data
    type allows for a massive range with high fractional accuracy. This increased
    amount of data comes at a cost, however. So what other data type would let us
    have decimal numbers within our needed range? Look at Figure **2-7** and see if
    you can figure it out.


    Looking at the chart, we need a data type that supports a number within our range
    and can support decimal fractions. We also don’t need an extensive range. So an
    ideal data type to use here would be float.


    A float will cost us 4 bytes of data instead of 8 bytes of the double type. That’s
    half the required data, great!


    Let’s rerun the math at 4 bytes every 2 seconds, per door, per player, which brings
    us down to 2 bytes per second, per door, per player. That brings us down to ~$2,896
    per month to implement doors in terms of bandwidth. Compare this to almost $2
    million a month.


    There are more ways to optimize this even further, like replicating a door only
    when the player presses the interact key. Instead of replicating a variable, we
    send a command to the server only when the player interacts with the door. We’ll
    cover this in more detail later in the book.


    Let’s cover some more networking principles before going more in-depth into multiplayer.


    # Network Topologies


    So we’re starting to get an idea of how a device can send data to another device.
    If we have two devices connected, what happens when we want to add a third? How
    does the third device fit into this network relationship? That’s where network
    topologies come in.


    A network topology is the arrangement of devices on a network. Your home network
    is a great example of this. You likely have a router at home connected to the
    Internet. Connected to your router are all of your devices. This is an excellent
    example of a star topology.'

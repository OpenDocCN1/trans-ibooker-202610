    ## What Is Your Preferred Cloud Infrastructure Provider for Databases?


    Azure for MySQL and GCP or AWS for other databases.


    ## What Is Your Preferred Cloud Infrastructure Provider for Server Hosting?


    Unity Multiplay


    ## What Is the Most Crucial Piece of Advice You Could Give to Someone Learning
    Multiplayer Game Development?


    The unknown questions are the most important.


    Position yourself as the player as much as possible to find them. Users with bad
    network connectivity on their end will blame you for bad servers, as an example.


    Make sure your game is enjoyable above all else.


    ## CHAPTER 8


    ## Challenge What You Know


    The best way to learn is through practice. As such, I’ve curated some challenges
    for you to practice what you’ve learned throughout this book. These challenges
    will be split into three categories, and I’d encourage you to complete them in
    order.


    Beginner challenges will tackle the basic intricacies of multiplayer development
    using Mirror Networking. Then, we’ll move onto intermediate challenges, expanding
    on the previous challenges with user data persistence. Finally, we’ll wrap up
    by extending the challenges further – adding world and user data persistence.


    I encourage you to leverage AWS or Azure’s free-tier servers to complete these
    challenges – this will help foster your experience with these platforms and be
    extremely valuable in your career.


    I will lay out these challenges in a format that describes the challenge, the
    required conditions to complete the challenges, and finally, some bonus conditions
    if you’d like to challenge yourself further.


    And remember to take a break, and don’t burn yourself out.


    Let’s get started.


    ## Beginner Challenges – Core Multiplayer Functionality


    I will focus the following challenges on fostering your ability to create core,
    multiplayer functionality that will help relay game state between clients. You
    don’t need to make these challenges pretty, so please use primitive shapes and
    objects if no art is available. We’re focused on the multiplayer here. If you’d
    like to make it look a bit more polished, that’s great too, but don’t lose any
    sleep over it.


    ## The Challenge


    For your challenge, I want you to recreate the game in Unity using Mirror Networking.
    Your game should meet the following criteria:


    - Have the main menu that allows the player to do the following:

    - Start a new game, displaying their current IP address and game server port beneath
    the play area. The player starting the game should become the host.

    - Join a game, allowing the player to enter the IP address and port of another
    player’s game server. The game should display a timeout message and return to
    the main menu if the player could not connect.

    - Exit the application.

    - A round-based system that performs the following:

    - A round begins after a delay of 5 seconds.

    - Spawn a ball at the center that fires off in a random direction toward one of
    the players. IE. Not directly upward. Consider clamping the starting angles.

    - Each player should have a paddle that they alone can control along the vertical
    axis of the screen.

    - You should clamp each player’s paddle to prevent it from moving out of the play
    area.

    - The ball should reflect off of the top and bottom walls.

    - The ball should reflect off of the player’s paddle, with an adjusted angle based
    on how close it was to the center of the paddle.

    - The ball should gain speed when colliding with a player’s paddle.

    - You should reset the ball speed at the start of each round.

    - If the ball hits the left wall, add a score point to the second player and start
    a new round. Inversely, if the ball hits the right wall, add a score point to
    the first player.

    - A round should end once a player reaches 10 points.


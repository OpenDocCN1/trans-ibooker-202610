  md: "\n## Lockstep\n\nLockstep networking was an architecture typically used in\
    \ RTS games in the late 1990s. It’s a networking architecture in which all players\
    \ wait for all other player commitments. These commitments are a hashed version\
    \ of the intended action. Once the players receive all other commitments, they\
    \ send their actions to all other players. This action must then be hashed and\
    \ compared to their original commitment.\n\nThis networking method solves some\
    \ issues with a type of cheating known as “Look-Ahead Cheating.” For example,\
    \ let’s say you’re playing a game of rock, paper, scissors, but you cannot guarantee\
    \ that all players will show their hand at the same time. Player A could, for\
    \ example, wait for player B to show their decision, then show their own decision,\
    \ knowing what player B’s decision was.\n\nIn lockstep, player A and player B\
    \ would each share a hashed version of the commitment. This hashed commitment\
    \ should not be used to infer the action directly but should also easily compare\
    \ to the action.\n\nThat way, player A and player B cannot lie about their intended\
    \ actions. Lockstep does, however, come with a painful drawback that makes it\
    \ unsuitable for most modern games. The entire network is as slow as the slowest\
    \ player, making it unsuitable for many games and genres.\n\nAs such, the last\
    \ bastion of lockstep networking was likely RTS games. But, even then, there was\
    \ another drawback. Lockstep typically requires a fully deterministic networking\
    \ architecture, and due to the complexity and difficulty associated with lockstep\
    \ networking, we usually abandon it in favor of the client-server model.\n\n##\
    \ True Lockstep Games\n\n- Supreme Commander 1\n- Warcraft 3\n- Doom\n\n## Pseudo-lockstep\
    \ (Lockstep with Client-Server Model)\n\n- Starcraft 2\n\n## Client-Server Architecture\n\
    \nClient-Server Architecture – this is where we come in. Mirror Networking uses\
    \ a pure client-server model. While, in theory, you could extend Mirror Networking\
    \ to use a\n\nRPC attributes can contain a special argument in the attribute flag\
    \ called “includeOwner.” This defaults to true if you do not pass the argument.\
    \ If you decide to pass the argument, your new attribute would look more like\
    \ the following:\n\n```\n[RPC(includeOwner = false)]\npublic void Jump()\n{\n\
    \    PlayerController.Jump();\n}\n```\n\nAnd now, your RPC will only execute on\
    \ clients and exclude the host player. Typically, there aren’t many reasons to\
    \ do this, but the functionality exists.\n\n## TargetRPC Attribute\n\nThe TargetRPC\
    \ is much like the RPC attribute. TargetRPC simply stands for Target Remote Procedure\
    \ Call. Much like the RPC attribute, we need to add an attribute, this time, the\
    \ TargetRPC attribute.\n\nThe TargetRPC requires one additional step, though.\
    \ We must include a NetworkConnection as an argument to the method as the first\
    \ argument, or the code will not work. Let’s see what that looks like:\n\n```\n\
    [TargetRPC]\npublic void Jump(NetworkConnection connection)\n{\n    PlayerController.Jump();\n\
    }\n```\n\nYou can then call the remote procedure call and pass in the network\
    \ connection of the player you would like to invoke the remote procedure on. Some\
    \ IDEs may warn that the argument is not being used, but this is not the case,\
    \ and you can safely ignore this warning.\n\n## Commands\n\nSo, what if we’d like\
    \ to have a client execute a method on the server? We can use commands to do this;\
    \ they’re much like RPCs, in the sense that we can use command attributes to identify\
    \ methods for the Mirror Networking compiler.\n\n## Command Attribute\n\nWe can\
    \ mark a method as a command similar to how we mark methods as RPCs or TargetRPCs.\
    \ It’s important to note that by default, you must have authority over the network\
    \ identity that you are invoking a command on, which should look something like\
    \ this:\n\n```\n[Command]\npublic void AddGold()\n{\n    gold++;\n}\n```\n\nThe\
    \ given command will allow the client with authority over the network identity\
    \ to add gold. This gold variable can then be synchronized over the network to\
    \ other clients through the use of sync-vars, which we’ll discuss shortly.\n\n\
    ## Synchronization – Properties\n\nSynchronization is a Mirror Networking concept\
    \ where we can synchronize a variable’s state over the network. Mirror Networking\
    \ typically performs this synchronization when a client joins the network or a\
    \ value changes, and Mirror Networking adds it to the synchronization batch queue.\n\
    \nSynchronization covers two main parts: synchronized properties and synchronization\
    \ components; the latter are pre-written components that synchronize the state\
    \ of other components, removing the need to rewrite a lot of boilerplate code\
    \ from scratch, but are designed to be extended upon to meet the needs of your\
    \ project.\n\nWe’ll start off by discussing synchronized properties. These are\
    \ the following:\n\n- SyncVars\n- SyncLists\n- SyncDictionaries\n- SyncHashSets\n\
    - SyncSortedSets\n\nThen finally, we have the usual sync settings.\n\n## Network\
    \ Lerp Rigidbody\n\nThe Network Lerp Rigidbody component is an alternative to\
    \ managing transform replication. It’s advantageous in a situation where you want\
    \ to replicate a non-kinematic rigid body over the network.\n\nHowever, using\
    \ a Network Transform on a rigid body may yield odd behavior with the physics\
    \ system, as the rigid body itself will not have its velocity modified. To counteract\
    \ this issue, we have the Network Lerp Rigidbody.\n\nA Network Lerp Rigidbody\
    \ synchronizes the velocity values of the rigid body and its associated position.\n\
    \nIt’s important to note that a network identity should not have a Network Transform\
    \ and a Network Lerp Rigidbody component. You should choose one or the other depending\
    \ on the needs of your product, typically favoring Network Transform, unless velocity\
    \ is important – such as rigidbody platforms, or player interactable rigidbodies.\
    \ Let’s take a look at the component in Figure 4-13.\n\n![](img/9be82dd80844460a2c43cbf8813817d7_141_0.png)\n\
    \nFigure 4-13. The figure shows the Network Lerp Rigidbody component\n\nMuch like\
    \ the Network Transform Child, we have a target, the associated rigidbody, we\
    \ want to have replicated. Then, there are our lerp settings. These lerp settings\
    \ dictate how much the component should attempt to fill in the blanks between\
    \ network synchronization ticks.\n\nFinally, we have the client authority boolean\
    \ value that we’ve become familiar with, which determined who has permission to\
    \ control the networked rigid body.\n\n## Network Rigidbody (2D and 3D Variants)\n\
    \nThe Network Rigidbody is another method of synchronizing rigidbodies over the\
    \ network. However, these do not interpolate their values. There are Network Rigidbody\
    \ components for both 2D and 3D rigidbodies.\n\nIts synchronization properties\
    \ are a bit different from the Network Lerp Rigidbody component (Figure 4-14)\
    \ that we just covered, so let’s look at it.\n\nHere, we also have a target that\
    \ we can specify. We also have the addition of some checkboxes that give us more\
    \ control over what properties should be synchronized.\n\nThis additional control\
    \ can help us reduce network bandwidth in many situations where we might only\
    \ want to synchronize velocity, such as a moving platform that does not rotate.\n\
    \n![](img/9be82dd80844460a2c43cbf8813817d7_142_0.png)\n\nFigure 4-14. The figure\
    \ shows the Network Lerp Rigidbody component\n"
  mdcn: "\n\n## Lockstep\n\nLockstep 网络架构通常在 1990 年代末的 RTS 游戏中使用。它是一种网络架构，其中所有玩家都会等待所有其他玩家的承诺。这些承诺是预期操作的哈希版本。一旦玩家收到所有其他承诺，他们就会向所有其他玩家发送他们的操作。然后必须对该操作进行哈希处理并与原始承诺进行比较。\n\
    \n这种网络方法解决了被称为“先看作弊”的一种作弊方式的一些问题。例如，假设你正在玩石头剪刀布游戏，但你无法保证所有玩家会同时出牌。玩家 A 例如可以等待玩家\
    \ B 显示其决定，然后显示自己的决定，已知玩家 B 的决定。\n\n在 lockstep 中，玩家 A 和玩家 B 各自共享承诺的哈希版本。此哈希承诺不应用于直接推断操作，但也应易于与操作进行比较。\n\
    \n这样，玩家 A 和玩家 B 就无法对他们的预期操作撒谎。Lockstep 然而带来了一个痛苦的缺点，使其不适合大多数现代游戏。整个网络的速度取决于最慢的玩家，这使其不适合许多游戏和类型。\n\
    \n因此，lockstep 网络的最后一个堡垒可能就是 RTS 游戏。但即使如此，还有另一个缺点。Lockstep 通常需要完全确定性的网络架构，并且由于与\
    \ lockstep 网络相关的复杂性和难度，我们通常会放弃它而采用客户端-服务器模型。\n\n## True Lockstep Games\n\n- Supreme\
    \ Commander 1\n- Warcraft 3\n- Doom\n\n## Pseudo-lockstep (Lockstep with Client-Server\
    \ Model)\n\n- Starcraft 2\n\n## Client-Server Architecture\n\nClient-Server Architecture\
    \ – 这就是我们要介绍的内容。Mirror Networking 使用纯客户端-服务器模型。虽然理论上你可以扩展 Mirror Networking 来使用\n\
    \nRPC 属性可以在属性标志中包含一个特殊的参数，称为“includeOwner”。如果不传递该参数，则默认为 true。如果你决定传递该参数，你的新属性将看起来更像以下内容：\n\
    \n```\n[RPC(includeOwner = false)]\npublic void Jump()\n{\n    PlayerController.Jump();\n\
    }\n```\n\n现在，你的 RPC 将仅在客户端上执行并排除主机玩家。通常没有太多理由这样做，但该功能存在。\n\n## TargetRPC Attribute\n\
    \nTargetRPC 与 RPC 属性非常相似。TargetRPC 简单地代表 Target Remote Procedure Call。与 RPC 属性一样，我们需要添加一个属性，这次是\
    \ TargetRPC 属性。\n\nTargetRPC 需要一个额外的步骤。我们必须将 NetworkConnection 作为方法的第一个参数包含在内，否则代码将无法工作。让我们看看它是什么样的：\n\
    \n```\n[TargetRPC]\npublic void Jump(NetworkConnection connection)\n{\n    PlayerController.Jump();\n\
    }\n```\n\n然后你可以调用远程过程调用并传入你想要在其上调用远程过程的玩家的网络连接。某些 IDE 可能会警告参数未被使用，但这并非如此，你可以安全地忽略此警告。\n\
    \n## Commands\n\n那么，如果我们希望客户端在服务器上执行一个方法呢？我们可以使用命令来实现；它们与 RPCs 非常相似，因为我们可以使用命令属性来识别\
    \ Mirror Networking 编译器的目标方法。\n\n## Command Attribute\n\n我们可以像标记方法为 RPCs 或 TargetRPCs\
    \ 一样将方法标记为命令。重要的是要注意，默认情况下，你必须对你调用命令的网络身份拥有权限，这应该看起来像这样：\n\n```\n[Command]\npublic\
    \ void AddGold()\n{\n    gold++;\n}\n```\n\n给定的命令将允许对网络身份拥有权限的客户端添加金币。然后该 gold\
    \ 变量可以通过使用 sync-vars 在网络上与其它客户端同步，我们稍后会讨论。\n\n## Synchronization – Properties\n\
    \nSynchronization 是 Mirror Networking 的一个概念，我们可以在网络上同步变量的状态。Mirror Networking\
    \ 通常在客户端加入网络或值发生变化时执行此同步，并将其添加到同步批处理队列中。\n\n同步涵盖两个主要部分：同步属性和同步组件；后者是预先编写的组件，用于同步其它组件的状态，省去了从头重写大量样板代码的需要，但设计为可扩展以满足项目需求。\n\
    \n我们将从讨论同步属性开始。这些如下：\n\n- SyncVars\n- SyncLists\n- SyncDictionaries\n- SyncHashSets\n\
    - SyncSortedSets\n\n然后最后，我们有通常的同步设置。\n\n## Network Lerp Rigidbody\n\nNetwork Lerp\
    \ Rigidbody 组件是管理变换复制的替代方案。在你想要在网络上复制非运动学刚体时，它是有优势的。\n\n然而，在刚体上使用 Network Transform\
    \ 可能会导致物理系统出现异常行为，因为刚体本身的速率不会被修改。为抵消此问题，我们有 Network Lerp Rigidbody。\n\nNetwork\
    \ Lerp Rigidbody 同步刚体的速率值及其相关位置。\n\n重要的是要注意，网络身份不应同时具有 Network Transform 和 Network\
    \ Lerp Rigidbody 组件。你应该根据产品需求选择其一，通常更倾向于 Network Transform，除非速率很重要——例如刚体平台，或玩家可交互的刚体。让我们看一下图\
    \ 4-13 中的组件。\n\n![](img/9be82dd80844460a2c43cbf8813817d7_141_0.png)\n\nFigure\
    \ 4-13. The figure shows the Network Lerp Rigidbody component\n\n与 Network Transform\
    \ Child 类似，我们有一个目标，即我们想要复制的相关刚体。然后，我们有我们的 lerp 设置。这些 lerp 设置决定了组件应尝试在网络同步滴答之间填补空白的程度。\n\
    \n最后，我们有我们熟悉的客户端权限布尔值，它决定谁有权控制网络刚体。\n\n## Network Rigidbody (2D and 3D Variants)\n\
    \nNetwork Rigidbody 是在网络上同步刚体的另一种方法。然而，这些不会插值其值。对于 2D 和 3D 刚体都有 Network Rigidbody\
    \ 组件。\n\n其同步属性与我们刚刚介绍的 Network Lerp Rigidbody 组件（图 4-14）有点不同，所以让我们看一下。\n\n这里，我们也有一个可以指定的目标。我们还添加了一些复选框，可以让我们更好地控制应同步哪些属性。\n\
    \n这种额外的控制可以帮助我们在许多情况下减少网络带宽，例如我们可能只想同步速率的移动平台。\n\n![](img/9be82dd80844460a2c43cbf8813817d7_142_0.png)\n\
    \nFigure 4-14. The figure shows the Network Lerp Rigidbody component\n\n"

    # Stress Testing, Stress Clients, and Market Research


    When it comes to scaling your multiplayer game, choosing the right cloud services
    is one of the most important decisions you can make. But how can you make decisions
    without knowing the variables?


    The key is stress testing through the use of stress clients and market research.


    A valuable tool to create is a game client that can run headless, which automatically
    connects to your game server and simulates traffic. Stress clients can be an excellent
    approach for testing how your network code scales. It’s essentially a DDOS attack
    of legitimate game traffic to see where your game servers start to take the strain.


    Once you’re confident in your game’s net code, another step that can be invaluable
    in a pre-launch environment is performing a real-world stress test in the form
    of market research. You can perform real-world tests as a public test beta that
    runs for a limited duration. If you don’t have a large following, you can employ
    a company like Game Tester, where you pay a large userbase of players to test
    your game servers for a set duration.


    You can have a look at Game Tester’s website over at the following URL:


    ```

    https://GameTester.gg/

    ```'

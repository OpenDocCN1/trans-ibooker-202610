    只是一个如何使用和继承 Network Authenticator 的示例。让我们在深入研究如何创建满足项目需求的网络身份验证器之前，更深入地研究基本身份验证器。


    基本身份验证器非常、嗯、基本。它提供了一个明文用户名和密码验证系统的示例。首先，我们有公开的事件。如下所示。


    ### OnServerAuthenticated


    当客户端成功被服务器接受为已认证时，此事件会被调用。Mirror 网络上的实体可以监听此事件，并帮助通知这些实体服务器已成功认证客户端。服务器本身通常使用
    OnServerAuthenticated 事件，但其他玩家也可以使用该事件来查看他们的朋友是否已成功认证。


    ### OnClientAuthenticated


    与 OnServerAuthenticated 事件类似，OnClientAuthenticated 是在服务器成功认证客户端连接后调用的事件。然而，与其影响
    Mirror 网络上的监听器，此事件是在请求认证的客户端上调用的事件。OnClientAuthenticated 事件非常适合显示 UI 元素，通知用户其登录成功。



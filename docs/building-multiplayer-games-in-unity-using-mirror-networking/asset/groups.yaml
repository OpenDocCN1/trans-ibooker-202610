    The following tips may prove helpful:'
  - '[PAGE 236]


    +   - You can use network authentication to send different custom requests to
    the server, such as querying information about your account. That way, you can
    build a custom authentication enum that states you intend to query information
    without joining. The server can see this request, validate your login, query the
    data, return the data, and reject your connection.

    +   - Make use of Network Rigidbody.

    +   - Don’t be afraid to skip some of the bonus challenges. They may prove very
    challenging.

    +   - If you’re stuck on something, move on to a different problem, and revisit
    your issue afterward.


    If you were able to complete these challenges, then you’re well on your way to
    building multiplayer games in Unity using Mirror Networking. If you got stuck,
    then I’d encourage you to revisit parts of the book.


    Multiplayer code is tricky, and sadly, there is no MakeMultiplayer() method yet.


    The biggest challenge is getting into the mindset of multiplayer code. It requires
    a different way of thinking about challenges that, traditionally, you might find
    easy. There are many things to consider.


    All in all, the best way to improve once you have a good foundation is through
    practice.


    As such, I encourage you to seek out new challenges and come up with your challenges
    too; with that said, the most crucial part is to start small. If you come up with
    a monumental challenge that burns you out after a month, then there’s no point.


    There are many game idea generators out there. I encourage you to use them to
    come up with your challenges. Good luck!'

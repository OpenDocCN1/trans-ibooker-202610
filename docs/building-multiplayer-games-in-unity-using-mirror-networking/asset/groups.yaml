    +   - **Select a region** - This will determine what area our endpoint is situated
    at, typically a geographic location.

    +   - **Select a zone** - Zones are subdivisions of regions that typically represent
    a data center.

    +   - **Select the machine configuration** - The machine configuration defines
    what hardware we want to provision for our virtual machine.'

    - **Select the machine configuration** - The machine configuration defines what
    hardware we want to provision for our virtual machine.


    ## Figure 6-11. The figure shows the last section of the GCP new instance wizard


    - **Optionally enable “Confidential VM Service”** - This is an optional service
    in which the memory of the VM becomes encrypted to add another layer of security,
    where even Google would be unable to access the memory. Memory encryption is typically
    only used for extremely sensitive applications, and we can leave this disabled
    to save on cost and performance.

    - **Optionally deploy a container to the VM** - This is useful if you have a docker
    container image ready.

    - **Specify your boot disc and OS** - Here, we can specify the size of our boot
    disk and choose an operating system to use. Google includes licensing fees for
    the operating system selected.


    - **Specify identity and API access** - Here, you can specify which account we
    should use for the instance. Selecting a service account allows your applications
    on your VM to make Google API calls.

    - **Firewall** - Here, we can choose to allow HTTP and HTTPS traffic. Enable both
    checkboxes.


    Selecting “Management, security, disks, networking, sole tenancy” will show additional
    options. The one we’re interested in here is “Preemptibility.” Preemptibility
    is an optional selection that will limit our server to only run for up to 24 hours.
    Depending on how you structure your game servers, preemptibility can be a valuable
    option to save on costs while developing significantly. It’s similar to AWS’s
    spot pricing.


    Finally, click the create button.


    From here, you can connect to the remote server, and much like with the AWS server,
    it’s important to remember to enable the appropriate firewall rules within Windows!


    ## Azure


    Azure is Microsoft’s cloud solution and competitor to AWS and GCP. Much like its
    competitors, Microsoft provides a free trial, with $200 worth of credit to use
    in your first 30 days (Figures 6-12 and 6-13).


    Head over to the following URL to sign up:


    ```

    https://azure.microsoft.com/account/free

    ```


    Once you’ve completed the account creation and verification process, you’ll have
    access to the Azure portal.


    Select the burger menu at the top left, and choose “Virtual Machines” from the
    drop-down list. Then select “Create Instance.” You should see the following diagram:


    ## Create a virtual machine


    Basics   Disks   Networking   Management   Advanced   Tags   Review + create


    Create a virtual machine that runs Linux or Windows. Select an image from Azure
    marketplace or use your own customized image. Complete the Basics tab then Review
    + create to provision a virtual machine with default parameters or review each
    tab for full customization. Learn more


    ## Project details


    Select the subscription to manage deployed resources and costs. Use resource groups
    like folders to organize and manage all your resources.


    Subscription *  Free Trial


    Resource group *  (New) _group  Create new


    ## Instance details


    Virtual machine name *


    Region *  (Africa) South Africa North


    Availability options  No infrastructure redundancy required


    Image *  Windows Server 2019 Datacenter - Gen2  See all images


    Figure 6-12. The figure shows the first section of the Azure new instance wizard


    Here, you’ll want to complete the following:


    - Select your subscription - This determines how Azure will bill you. We can use
    the Free Trial subscription to test this process out.

    - Name your server instance - Give your server instance a name that you can recognize.

    - Set your server region - Set the region where you’d like Azure to provision
    your server.

    - Select a server image - Select a server image, or a snapshot of the OS, much
    like AWS AMIs.


    ![](img/9be82dd80844460a2c43cbf8813817d7_202_0.png)


    Figure 6-14. The figure shows our newly created inbound port rule


    Finally, click the “Review + Create” button. Azure servers take quite a while
    to provision, but you’ll have a new server to use once the process is complete.


    ## Unity Multiplay


    Unity Multiplay is by far one of the best hosting solutions out there for large,
    scalable multiplayer games. Unity Multiplay is essentially a pricing engine that
    grabs the best available price from the hosts that we just discussed and launches
    your game servers at the best rates.


    It’s scalable and can handle millions of players. Major studios, including Respawn
    Entertainment with their incredibly successful “Apex Legends,” use Unity Multiplay,
    where Multiplay helped Respawn scale 50 million players in 24 days.


    Unity Multiplay is not as easily accessible as directly hosting with the previous
    hosting providers, though. Still, if you’re expecting a massive launch or need
    for scalability, you can contact the Multiplay team over at the following URL:


    https://create.unity3d.com/multiplay-contact-us


    The Multiplay team is accommodating and will guide you through the process and
    provide additional valuable insight throughout your game launch.


    ## Stress Testing, Stress Clients, and Market Research


    When it comes to scaling your multiplayer game, choosing the right cloud services
    is one of the most important decisions you can make. But how can you make decisions
    without knowing the variables?


    The key is stress testing through the use of stress clients and market research.


    A valuable tool to create is a game client that can run headless, which automatically
    connects to your game server and simulates traffic. Stress clients can be an excellent
    approach for testing how your network code scales. It’s essentially a DDOS attack
    of legitimate game traffic to see where your game servers start to take the strain.


    Once you’re confident in your game’s net code, another step that can be invaluable
    in a pre-launch environment is performing a real-world stress test in the form
    of market research. You can perform real-world tests as a public test beta that
    runs for a limited duration. If you don’t have a large following, you can employ
    a company like Game Tester, where you pay a large userbase of players to test
    your game servers for a set duration.


    You can have a look at Game Tester’s website over at the following URL:


    ```

    https://GameTester.gg/

    ```


    ## CHAPTER 7


    ## Insights from the Masters


    Sometimes it’s important to seek inspiration from others, whether for motivation
    or understanding. Seeking knowledge from a master in a field can provide valuable
    insights and knowledge into a given topic.


    In this chapter, I’ve interviewed some of these masters who’ve helped bring the
    games you love to market.


    Let’s take a look. First up, we have Michael W., the creator of Mirror Networking,
    better known in the community as vis2k. Then, we have Curt, a senior solutions
    architect who’s been involved in games like Apex Legends and Fall Guys.


    ## Michael “vis2k” W. – Mirror Networking


    Michael W. is the creator and founder of Mirror Networking. He and the contributors
    of Mirror Networking are why this book and many games are even possible in the
    first place. A special thank you to Michael for taking the time for this interview.


    ## Tell Me a Bit About Yourself and Where You Come From


    I was born in Germany and switched schools when I was 15-ish, away from my friends.


    I didn’t have the best time, so I started playing one of the early Asian grinder
    MMOs.


    Super fascinated by that virtual world. I met so many people. Wanted to do my
    own MMO ever since.


    So, I started reverse-engineering MMOs and developed bots to learn and have some
    income. I got into OpenGL and Delphi, C++, etc. Made my first engine, always with
    MMO as the goal.


    Little town and environment, couple of monsters, server actually ran stable for
    months at a time. 60ish CCU, not much yet. Realized productivity was not ideal
    in C++. 60k LOC for a simple MMO scene already.


- pgno: 127
  md: "# Command Attribute\n\nWe can mark a method as a command similar to how we\
    \ mark methods as RPCs or TargetRPCs. It’s important to note that by default,\
    \ you must have authority over the network identity that you are invoking a command\
    \ on, which should look something like this:\n\n```\n[Command]\npublic void AddGold()\n\
    {\n    gold++;\n}\n```\n\nThe given command will allow the client with authority\
    \ over the network identity to add gold. This gold variable can then be synchronized\
    \ over the network to other clients through the use of sync-vars, which we’ll\
    \ discuss shortly.\n\n# Synchronization – Properties\n\nSynchronization is a Mirror\
    \ Networking concept where we can synchronize a variable’s state over the network.\
    \ Mirror Networking typically performs this synchronization when a client joins\
    \ the network or a value changes, and Mirror Networking adds it to the synchronization\
    \ batch queue.\n\nSynchronization covers two main parts: synchronized properties\
    \ and synchronization components; the latter are pre-written components that synchronize\
    \ the state of other components, removing the need to rewrite a lot of boilerplate\
    \ code from scratch, but are designed to be extended upon to meet the needs of\
    \ your project.\n\nWe’ll start off by discussing synchronized properties. These\
    \ are the following:\n\n+   - SyncVars\n+   - SyncLists\n+   - SyncDictionaries\n\
    +   - SyncHashSets\n+   - SyncSortedSets"
  merge: -1

- pgno: 203
  md: '# Stress Testing, Stress Clients, and Market Research


    When it comes to scaling your multiplayer game, choosing the right cloud services
    is one of the most important decisions you can make. But how can you make decisions
    without knowing the variables?


    The key is stress testing through the use of stress clients and market research.


    A valuable tool to create is a game client that can run headless, which automatically
    connects to your game server and simulates traffic. Stress clients can be an excellent
    approach for testing how your network code scales. It’s essentially a DDOS attack
    of legitimate game traffic to see where your game servers start to take the strain.


    Once you’re confident in your game’s net code, another step that can be invaluable
    in a pre-launch environment is performing a real-world stress test in the form
    of market research. You can perform real-world tests as a public test beta that
    runs for a limited duration. If you don’t have a large following, you can employ
    a company like Game Tester, where you pay a large userbase of players to test
    your game servers for a set duration.


    You can have a look at Game Tester’s website over at the following URL:


    ```

    https://GameTester.gg/

    ```'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# CHAPTER 7


    # Insights from the Masters


    Sometimes it’s important to seek inspiration from others, whether for motivation
    or understanding. Seeking knowledge from a master in a field can provide valuable
    insights and knowledge into a given topic.


    In this chapter, I’ve interviewed some of these masters who’ve helped bring the
    games you love to market.


    Let’s take a look. First up, we have Michael W., the creator of Mirror Networking,
    better known in the community as vis2k. Then, we have Curt, a senior solutions
    architect who’s been involved in games like Apex Legends and Fall Guys.


    # Michael “vis2k” W. – Mirror Networking


    Michael W. is the creator and founder of Mirror Networking. He and the contributors
    of Mirror Networking are why this book and many games are even possible in the
    first place. A special thank you to Michael for taking the time for this interview.


    # Tell Me a Bit About Yourself and Where You Come From


    I was born in Germany and switched schools when I was 15-ish, away from my friends.


    I didn’t have the best time, so I started playing one of the early Asian grinder
    MMOs.


    Super fascinated by that virtual world. I met so many people. Wanted to do my
    own MMO ever since.


    So, I started reverse-engineering MMOs and developed bots to learn and have some
    income. I got into OpenGL and Delphi, C++, etc. Made my first engine, always with
    MMO as the goal.


    Little town and environment, couple of monsters, server actually ran stable for
    months at a time. 60ish CCU, not much yet. Realized productivity was not ideal
    in C++. 60k LOC for a simple MMO scene already.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'I studied computer science to learn more.


    I got into Unity development when it was around version 4. Not worrying about
    renderer, animations, physics, multiplatform, etc. was nice. I kept at it, making
    some small games.


    Meanwhile, I tried Java, Python, Clojure, Erlang, and probably ten other languages
    for the MMO server. I learned a lot, especially with Erlang. Still, the situation
    seemed not ideal.


    On summer vacation in August 2015, I saw the UNET beta. I tried it; it was full
    of bugs, but server and client in one project, SyncVars, Rpc s, etc. It blew me
    away. I knew that this was the solution to the problem. It was super obvious.


    The first thing I tried was their moving ball demo. I immediately started on uMMORPG.


    I created health bars, monsters, NPCs, etc. UNET bugs were frustrating, but I
    released the first version in December 2015, hoping to make enough money to buy
    a pizza while developing sometimes.


    It turns out many people wanted to make an MMO, which finally allowed me to work
    on it full time.


    UNET is still full of bugs. I begged pretty much everyone on the team for fixes
    – nothing.


    So, I ended up forking it to fix some of them myself, back when we still had to
    replace Unity.Networking.dll in the Unity installation folder. Weaver wasn’t even
    open source at first.


    That’s how Mirror started.


    It’s 2021 now, been a while – thousands of bug fixes and improvements. The goal
    is to finish the roadmap this year, then maybe take a vacation and finally start
    working on my MMO.


    Some people already have small MMOs running with Mirror today. It seems like it’s
    finally possible.


    I still want to remake the same MMO I played when I was 15. Maybe it’s too late
    now, and people don’t enjoy grinders anymore. But it doesn’t matter.


    I just have to do it for myself.'

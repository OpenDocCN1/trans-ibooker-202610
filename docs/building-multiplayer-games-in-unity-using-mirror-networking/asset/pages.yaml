- pgno: 209
  md: 'I then worked my way to more robust roles, focusing on supporting online games
    and managing integrations of enterprise-level games with orchestration systems.


    My skills grew to include matchmakers and related services within developer needs.


    Now, I help to construct the end-to-end solutions of those backend services, leaning
    on my previous experiences.


    # What Are Some of the Biggest Networking-Related Challenges That You and Your
    Team, or Clients, Have Faced While Shipping Multiplayer Games?


    Netcode. When I work with developers, the first challenge is always netcode. Every
    game is different, and as such, there are no perfect out-of-the-box solutions
    unless you are making an arena shooter.


    The next is backend services asking questions such as the following:


    +   - What dedicated server would you use? Unity headless server?

    +   - What netcode/transport would you use: Photon Bolt, Unity MLAPI, or custom?

    +   - How many players max would the game-server support? 30 or 3000?

    +   - How would you allocate a game server from dynamic capacity, or would you
    not scale at all?

    +   - What would make the allocation? A Matchmaker? Another service? How would
    you reconcile in use with available services and game servers? How would you manage
    these services? And importantly, who would support them?


    Figure out your target network tolerances (RTT), 50/100ms/200ms, etc., and determine
    if the net code supports such latencies.


    Decide how many clusters you would want to support worldwide.


    How would you direct players to regional services; can they change regions manually?


    How does the player flow (the loop, play game, repeat) look like in terms of backend
    services?


    How is it secure?'
  merge: -1

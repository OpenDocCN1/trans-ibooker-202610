- pgno: 223
  md: '+   - There should be a text input and Send Message button.

    +   - The application should use Mirror Networking’s Network Messages.

    +   - The application should display a notification in the chat that shows whenever
    a user joins the conversation with a timestamp.

    +   - All user messages should display timestamps of messages.

    +   - All user messages should display the sender’s display name.

    +   - Messages sent by a user should appear differently for that user. IE. A different
    chat box color.


    # Bonus Challenge


    Up for a challenge? Here are some additional tasks to complete for this challenge
    to push your understanding of Mirror Networking:


    +   - Users should directly message other users in a separate chat window by clicking
    on the target user within the left user menu. This chat should also persist and

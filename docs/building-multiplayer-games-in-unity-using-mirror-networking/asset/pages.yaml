- pgno: 174
  md: "Firstly, in our AwsDatabaseApi class, or whatever class you’re using to populate\
    \ your database, we’ll need to add a new DynamoDBContext object. This DynamoDBContext\
    \ object will give our code context on how the Database should look. Let’s take\
    \ a look at the following code:\n\n```\nprivate DynamoDBContext context;\n```\n\
    \nNow that we have a DynamoDBContext object, we’ll need to populate it with the\
    \ context of our database by initializing it. You’ll want to ensure that you only\
    \ call this code after you have initialized your IAmazonDynamoDB object:\n\n```\n\
    private async void AddNewRandomPlayer()\n{\n    context = new DynamoDBContext(client);\n\
    \n    Player newPlayer = new Player\n    {\n        PlayerId = \"newPlayer-\"\
    \ + Random.Range(0, 1000),\n        PlayerDeaths = Random.Range(0, 30),\n    \
    \    PlayerKills = Random.Range(0, 30)\n    };\n\n    await context.SaveAsync<Player>(newPlayer);\n\
    }\n```\n\nIn the code, we’re getting the context of our database by using our\
    \ database client connection. Then we’re creating a new player object. That player\
    \ object is what we decorated with the required attributes.\n\nWe can then populate\
    \ the player object with our required data and call the SaveAsync method of our\
    \ DynamoDBContext. Once the await call completes, you’ll have a newly generated\
    \ player item in your “Players” table. Again, the significant part about this\
    \ is that none of the fields, excluding the key, are required. Adding additional\
    \ fields to our player object will add them to the database as new columns, too!"

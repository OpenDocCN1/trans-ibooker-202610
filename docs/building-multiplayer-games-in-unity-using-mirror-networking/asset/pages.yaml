- pgno: 159
  md: '# # Data Persistence for Large-Scale Multiplayer Games


    When it comes to global, scalable games, the best choice of data persistence is
    using databases. Databases are widely available and are a highly performant way
    of handling user data securely. We can even have multiple game servers served
    by a single database.


    # ## Pros of Using a Database for Data Persistence


    +   - **Highly performant** - Developers have created databases with performance
    in mind. Almost all websites and applications that you use interact with a database
    at some point in its lifecycle.

    +   - **Scalable** - Speed and scalability are at the heart of database design.
    Whether you’re serving a thousand users or a billion users, databases are designed
    for scalability.

    +   - **Affordable** - Hosting a database is easy to do on your own, and there
    are many inexpensive services out there that can do it for you.

    +   - **Secure** - Very importantly, when it comes to databases, security is a
    core focus.


    # ## Cons of Using a Database for Data Persistence


    +   - **Can be challenging at first** - Databases can be challenging at first,
    but they start to make sense quickly. However, it can take years to master database
    development, maintenance, and administration.

    +   - **Requires a bit of extra development time** - You’ll need to design and
    implement your database architecture and program the interface between your database
    and your game server. This additional work can add development time into the mix.


    So, what exactly are databases?'
  merge: -1

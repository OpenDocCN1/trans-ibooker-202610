  md: 'The new instance wizard (Figures 6-10 and 6-11) will require us to complete
    the following:


    +   - **Give the instance a name** - This is a human-friendly name that we can
    use to identify the instance. Naming our instance is helpful if we have multiple
    instances running.

    +   - **Optionally add a key/value pair tag** - Much like AWS, this provides us
    with an optional label that can help identify the purpose of the instance. We
    can use this for specific group actions.


    Press the “Get Password” link. The first time you do this, AWS will prompt you
    to download and save a “.PEM” file. This file is essential, and you’ll want to
    save this to a safe location and consider making a backup.


    Next, you can use the PEM file to decrypt the Windows password. Copy the Windows
    password and run your RDP shortcut. Ignore any certificate warnings. These are
    because AWS uses self-signed certificates by default. Continue and connect to
    your instance. Next, you will see a familiar Windows desktop window. This window
    is your remote machine to where you can install your game server. Let’s discuss
    Windows configuration next.



- pgno: 235
  md: '+   - Create a basic login and account creation process when starting the game.
    The user should be able to store a username, password, and display name. We’re
    not too worried about security for this challenge.

    +   - Store information about a user, such as the number of crates delivered successfully,
    their playtime, and how many boxes they have stolen from an enemy demarcated area.

    +   - Create a menu option called “Safe House” when the player joins the safe
    house, loads up a scene, and spawns in boxes for each box the player has delivered
    during play. The game should store this data within their account. When leaving
    the safe house, save the location of all boxes for the next time the player joins
    the safe house.

    +   - Add sound effects for crates hitting objects, such as the floor or other
    crates.

    +   - Add some ambient music to the game.

    +   - Allow players to be stunned and knocked down if a delivery box hits them
    that another player threw.

    +   - Add a minimap that allows players to see the layout of the map and an overview
    of control point ownership. This minimap should not show the location of players
    or crates.

    +   - Allow the minimap to show how many crates are within each demarcated area.

    +   - Allow the minimap to show how many crates are currently active.

    +   - Allow the player to choose an untaken color, and save that as a preference
    to their account.

    +   - Add the ability for players to jump.

    +   - Add a more vertical map design that allows players to throw crates down
    several floors. Players do not take fall damage.

    +   - Allow a player to carry up to two delivery crates at a time.


    # Tips


    The following tips may prove helpful:'

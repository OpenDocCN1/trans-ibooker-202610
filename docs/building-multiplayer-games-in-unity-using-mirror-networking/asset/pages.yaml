    # Unity Multiplay


    Unity Multiplay is by far one of the best hosting solutions out there for large,
    scalable multiplayer games. Unity Multiplay is essentially a pricing engine that
    grabs the best available price from the hosts that we just discussed and launches
    your game servers at the best rates.


    It’s scalable and can handle millions of players. Major studios, including Respawn
    Entertainment with their incredibly successful “Apex Legends,” use Unity Multiplay,
    where Multiplay helped Respawn scale 50 million players in 24 days.


    Unity Multiplay is not as easily accessible as directly hosting with the previous
    hosting providers, though. Still, if you’re expecting a massive launch or need
    for scalability, you can contact the Multiplay team over at the following URL:


    https://create.unity3d.com/multiplay-contact-us


    The Multiplay team is accommodating and will guide you through the process and
    provide additional valuable insight throughout your game launch.'

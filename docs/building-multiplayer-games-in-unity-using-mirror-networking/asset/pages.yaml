  md: '|  | Y - Yes | U - Untested | N - No | K - Kind of |  |  |  |  |  |  |  |  |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|

    | Name | Notes | Mirror Transport Layers | Server | Client | Windows | Android
    | Linux | Mac | iOS | XBox | PS |

    | Simple Web Transport | This Transport uses the websocket protocol. This allows
    this transport to be used in WebGL builds of unity. | Y | Y | Y | Y | Y | Y |
    Y | U | U |

    | Mirror WebRTC | The purpose of this transport is to provide an alternate method
    of online connectivity that does not require port forwarding by the game host.
    | Y | Y | Y | U | U | U | U | U | U |


    # Figure 3-1 Part 3. Depicts the final two transport layers in the list


    SimpleWebTransport is your go-to when you need web apps to connect to your mirror
    network or vice versa. It’s one of the few transport layers that support WebSockets.


    Mirror WebRTC is a kind of decentralized relay service that extends the functionality
    of another transport.


    # Additional Transport Component Logic


    In addition, transport layers can also act as an intermediary to other transport
    layers. They can provide additional logic and functionality, such as adding encryption
    or providing NAT punch-through. A great example of this is Monke’s ability to
    provide encryption for your data passing through the transport layer.


    This handover of transport layer data also opens up the possibility for other
    transport layer additions, such as the fallback transport component.


    # Fallback Transport Component


    The fallback transport component is a great way to work around platform limitations.
    It allows us to switch to other transport layers if the primary one does not work
    on the client’s current platform. Let’s take a look at Figure 3-2.'
  merge: -1

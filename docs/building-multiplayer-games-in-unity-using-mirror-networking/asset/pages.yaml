- pgno: 77
  md: '# CHAPTER 3


    # A Hall of Mirrors


    Now that we understand networking basics, we can begin discussing multiplayer
    in Unity in greater detail. We’ll be using Mirror Networking to achieve scalable
    multiplayer networking within Unity.


    But, what exactly is Mirror Networking? Mirror Networking is a high-level networking
    library released in October 2018. It was created to fix the neglected UNET and
    provide a platform for other developers to expand upon it, submit improvements,
    and collaborate.


    Mirror uses a Command-RPC networking structure, where each connection requires
    authority over an object to modify it on the network. Mirror Networking is easy
    to implement without sacrificing scalability. Mirror Networking is excellent for
    small studios and large AAA studios aiming to create MMO scale networking.


    The great thing about Mirror is that the client and the server are both a single
    project, helping to increase productivity during development.


    # Architecture


    As I mentioned briefly, Mirror uses a Command-RPC networking structure. A Command-RPC
    architecture means that clients and servers communicate through commands (Client-to-Server)
    and remote procedure calls (Server-to-Client). Commands allow clients to execute
    a remote method on the server on an object they have authority over. It’s a way
    for the client to ask the server to perform a given command.


    Inversely, RPCs allow the server to execute methods on the client remotely. This
    back and forth between server and client forms the foundation of our networking,
    allowing us to send a wide variety of supported data types and references over
    the network. The Command-RPC architecture makes code a lot easier to follow than
    other networking solutions.'
  merge: -1
  img_proc: true

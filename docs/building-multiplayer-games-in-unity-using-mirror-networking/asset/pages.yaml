- pgno: 95
  md: '![](img/9be82dd80844460a2c43cbf8813817d7_95_0.png)


    Figure 3-6. The figure is an example implementation of NetworkAuthenticator


    Now, it’s essential to understand that the Network Authenticator is very versatile
    and adaptable. Generally speaking, you wouldn’t use BasicAuthenticator in a production
    release. BasicAuthenticator is simply an example of how to use and inherit from
    Network Authenticator. Let’s take a deeper look at the basic authenticator before
    digging into how we can create our network authenticator to meet the needs of
    our project.


    The basic authenticator is very, well, basic. It provides an example of a plaintext
    username and password validation system. First, we have the exposed events. These
    are as follows.


    # OnServerAuthenticated


    This event becomes invoked when the client successfully becomes accepted by the
    server as authenticated. This event can be listened to by entities on the mirror
    network and helps notify such entities that the server successfully authenticated
    the client. The server itself typically uses the OnServerAuthenticated event,
    but other players can use the event to see that their friend has successfully
    authenticated.


    # OnClientAuthenticated


    Much like the OnServerAuthenticated event, the OnClientAuthenticated is an event
    invoked once the server has successfully authenticated the client connection.
    However, instead of affecting listeners on the Mirror Network, this event is an
    event that is invoked on the client requesting authentication. The OnClientAuthenticated
    event is ideal for displaying UI elements notifying the user that their login
    was successful.'
  merge: -1
  img_proc: true

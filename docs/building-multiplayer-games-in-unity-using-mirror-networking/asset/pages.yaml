- pgno: 102
  md: "That covers it for the server-side code. It’s really easy to use and simple\
    \ to extend upon.\n\nThen, we have the client-side code.\n\n```\n/// <summary>\n\
    /// Called on client from StartClient to initialize the Authenticator\n/// <para>Client\
    \ message handlers should be registered in this method.</para>\n/// </summary>\n\
    public override void OnStartClient()\n{\n    // register a handler for the authentication\
    \ response we expect from\n    // server.\n    NetworkClient.RegisterHandler<AuthResponseMessage>(OnAuthResponseMessage,\n\
    \    false);\n}\n```\n\nAgain, much like with the server, we need to register\
    \ a handler, but this time to the AuthResponseMessage so we know to do something\
    \ when we receive our response from the server. We should register this handler\
    \ in OnStartClient.\n\n```\n/// <summary>\n/// Called on client from OnClientAuthenticateInternal\
    \ when a client needs to\n/// authenticate\n/// </summary>\n/// <param name=\"\
    conn\">Connection of the client.</param>\npublic override void OnClientAuthenticate(NetworkConnection\
    \ conn)\n{\n    AuthRequestMessage authRequestMessage = new AuthRequestMessage();\n\
    \n    NetworkClient.Send(authRequestMessage);\n}\n```"

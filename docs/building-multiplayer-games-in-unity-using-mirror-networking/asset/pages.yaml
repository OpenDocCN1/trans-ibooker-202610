- pgno: 216
  md: '+   - Create a pickup that shrinks the opposing player’s paddle by 25%. This
    pickup should reset at the end of the round.

    +   - Add obstacles that randomly spawn in during the round within the middle
    third of the play space.

    +   - Limit the number of barriers to three and only spawn an obstacle every 10
    seconds after the first 10 seconds have elapsed.

    +   - Collision with this obstacle should destroy it and reflect the ball as expected.

    +   - Prevent the obstacle from spawning on top of a ball.

    +   - If an obstacle will spawn intersecting with another obstacle, change the
    original obstacle’s color, and require an additional hit to break the obstacle.

    +   - Add an Escape menu that allows players to return to the main menu.


    Tips You’re likely to encounter a few hiccups along the way, so I’ve prepared
    some tips that may help you during this challenge.


    +   - Before spending time creating the game loop, consider ensuring that you
    have the network connection working smoothly.

    +   - Vector3.Reflect() is an excellent method for calculating reflecting angles;
    you can read more about it and its usage in the Unity developer docs here: https://docs.unity3d.com/ScriptReference/Vector3.Reflect.html

    +   - Build your game in windowed mode with a lower resolution while testing.
    Doing so will allow you to see both game windows simultaneously. You can do this
    in the Unity Player Settings, under Resolution and Presentation.


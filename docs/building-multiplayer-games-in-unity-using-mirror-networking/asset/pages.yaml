- pgno: 118
  md: '# Lockstep


    Lockstep networking was an architecture typically used in RTS games in the late
    1990s. It’s a networking architecture in which all players wait for all other
    player commitments. These commitments are a hashed version of the intended action.
    Once the players receive all other commitments, they send their actions to all
    other players. This action must then be hashed and compared to their original
    commitment.


    This networking method solves some issues with a type of cheating known as “Look-Ahead
    Cheating.” For example, let’s say you’re playing a game of rock, paper, scissors,
    but you cannot guarantee that all players will show their hand at the same time.
    Player A could, for example, wait for player B to show their decision, then show
    their own decision, knowing what player B’s decision was.


    In lockstep, player A and player B would each share a hashed version of the commitment.
    This hashed commitment should not be used to infer the action directly but should
    also easily compare to the action.


    That way, player A and player B cannot lie about their intended actions. Lockstep
    does, however, come with a painful drawback that makes it unsuitable for most
    modern games. The entire network is as slow as the slowest player, making it unsuitable
    for many games and genres.


    As such, the last bastion of lockstep networking was likely RTS games. But, even
    then, there was another drawback. Lockstep typically requires a fully deterministic
    networking architecture, and due to the complexity and difficulty associated with
    lockstep networking, we usually abandon it in favor of the client-server model.


    # True Lockstep Games


    +   - Supreme Commander 1

    +   - Warcraft 3

    +   - Doom


    # Pseudo-lockstep (Lockstep with Client-Server Model)


    +   - Starcraft 2


    # Client-Server Architecture


    Client-Server Architecture – this is where we come in. Mirror Networking uses
    a pure client-server model. While, in theory, you could extend Mirror Networking
    to use a'

- pgno: 222
  md: '![](img/9be82dd80844460a2c43cbf8813817d7_222_0.png)


    Figure 8-3. The figure depicts a simple messaging app


    For this challenge, we’re not worried about security, authentication, or even
    best practices. I want you to solve a requirement that almost any online game
    has – the need for text chat.


    Text chat is a core part of any online multiplayer game, as it allows users to
    make new friends, strategize, or just be rude to one another. If you’re developing
    a multiplayer product, chances are, you’ll need to know how to do this.


    So, let’s get to it.


    # The Challenge


    +   - Develop a multiplayer application that allows for up to 200 connected clients
    using the Mirror KCP transport.

    +   - Have the application automatically attempt to connect to the game server,
    retrying until a connection is successful.

    +   - The application should have an Exit menu.

    +   - The application should have a screen notifying the user that they are currently
    connecting.

    +   - The application should prompt the user to choose a display name. Remember
    their last display name using player prefs.

    +   - The application should show all users currently connected.

    +   - The application should have a chat window for displaying the user messages.'
  merge: -1

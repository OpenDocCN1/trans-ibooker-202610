- pgno: 87
  md: 'Cons:


    +   - Marginally more CPU overhead than KCP


    Ignorance is bliss, literally.


    # Telepathy – TCP Transport Layer


    Telepathy is the default transport layer that ships with Mirror Networking. Telepathy
    is the transport layer used in the Mirror Networking examples.


    One might assume that the default transport layer wouldn’t be great, but you’d
    be mistaken. It’s only marginally worse in performance and is possibly the best
    TCP transport available to mirror.


    Pros:


    +   - It just works.

    +   - Comfortably handles 128+ heavy bandwidth CCU.


    > “If it ain’t broken, why fix it?”


    # The Client, the Server, and the Host


    So now that we’ve covered a lot of the low-level networking concepts that we’ll
    need, it’s time to begin talking about the application level, Mirror Networking
    itself. When it comes to creating multiplayer games with Mirror Networking, there
    is a critical distinction that will always need to be on your mind while programming
    the logic that you will be executing in your game.


    That is that despite being a single project, there are two “layers” to your game
    and a third hybrid “layer.” What’s vital to understand here is that I’m not talking
    about layers as you’re typically used to in Unity. I’m talking about instances
    of the game logic.


    Let me elaborate. When working with Mirror Networking, you have a client that
    connects to a server. Two separate application instances: make two builds, run
    one as a server, then join a client to that game. Simple enough?


    Changing a local variable on the client does not mean that the variable will change
    on the server. The client needs to make a networked request to the server to change
    a variable and then listen for that change. This back and forth is how a networked
    game operates. In almost all instances, the server should not trust the client.'
  merge: -1
  img_proc: true

    +   - Allow for users to create a group chat. The group chat name should show
    up within the left user menu to all members within the group chat.

    +   - Allow for users to choose an image file and upload it to the chat. You can
    handle this however you’d like, as long as the image persists between sessions.

    +   - Allow a user to block another user. That user’s messages should show up
    as “Blocked Message,” and the blocked user should not have the ability to send

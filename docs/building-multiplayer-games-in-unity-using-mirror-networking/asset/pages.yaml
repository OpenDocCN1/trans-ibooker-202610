    \ at all times. The tool is potent and worth learning. If you’re having trouble\
    \ connecting to a game server, consider running a port scan on the server to ensure\
    \ that the port is open.\n\n# FileZilla\n\nFileZilla is a free and open-source\
    \ file transfer protocol application consisting of FileZilla Client and FileZilla\
    \ Server (Figure 2-23). It allows us to deploy our files to the remote server\
    \ used for hosting our test servers instead of copying them through the remote\
    \ desktop protocol.\n\nDownload: [https://filezilla-project.org/download.php](https://filezilla-project.org/download.php)\n\

- pgno: 225
  md: '# Challenge #4 – Farming Mechanics with World Persistence


    Farming games are a popular genre of co-op play. Taking a look at the popularity
    of Stardew Valley and Slime Rancher, we can see that people love spending time
    acquiring resources and unlocking new crops or, in the case of Slime Rancher,
    slimes.


    We’ll be taking inspiration from Stardew Valley and building out some multiplayer
    farming mechanics for this challenge. The game should use a dedicated server that
    clients can connect to and authenticate with, where we’ll challenge your usage
    of Mirror Network Authenticators.


    The game itself should be a simple top-down game with a follow camera and use
    WASD movement. The player, which can be a capsule, should face the direction of
    the mouse and have an interface consisting of a hot bar toward the bottom middle
    of the screen. The hot bar should have nine squares, with the current selection
    outlined. This hot bar will represent the player inventory.


    The hot bar should display the item currently selected. You can do this simply
    by showing the name of the item and the number of items that the player is holding.


    There should also be a display toward the top left that shows how much money the
    player currently has.


    Let’s take a look at Figure 8-4 to get a better understanding of the challenge.


    ![](img/9be82dd80844460a2c43cbf8813817d7_225_0.png)


    Figure 8-4. The figure depicts the player hot bar'
  merge: -1

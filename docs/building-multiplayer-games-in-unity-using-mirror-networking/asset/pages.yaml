    # Challenge #3 – Chat Room App with a User Message History


    # Overview


    For this challenge, I want you to create a chat room application. The goal is
    to have your application connect to a dedicated game server and prompt the user
    to enter a display name upon joining.


    The user should see a list of all connected user display names, including their
    own in alphabetical order. There should also be a window for the chat. When a
    new user joins the chat room, the application should display a message in the
    chat.


    You should store all messages and their sender display names in an Amazon DynamoDB
    database. Upon rejoining, the application should show the user all of the recent
    messages. Let’s take a look at Figure 8-3:'

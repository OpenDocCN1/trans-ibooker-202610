- pgno: 141
  md: 'Then finally, we have the usual sync settings.


    # Network Lerp Rigidbody


    The Network Lerp Rigidbody component is an alternative to managing transform replication.
    It’s advantageous in a situation where you want to replicate a non-kinematic rigid
    body over the network.


    However, using a Network Transform on a rigid body may yield odd behavior with
    the physics system, as the rigid body itself will not have its velocity modified.
    To counteract this issue, we have the Network Lerp Rigidbody.


    A Network Lerp Rigidbody synchronizes the velocity values of the rigid body and
    its associated position.


    It’s important to note that a network identity should not have a Network Transform
    and a Network Lerp Rigidbody component. You should choose one or the other depending
    on the needs of your product, typically favoring Network Transform, unless velocity
    is important – such as rigidbody platforms, or player interactable rigidbodies.
    Let’s take a look at the component in Figure 4-13.


    ![](img/9be82dd80844460a2c43cbf8813817d7_141_0.png)


    Figure 4-13. The figure shows the Network Lerp Rigidbody component


    Much like the Network Transform Child, we have a target, the associated rigidbody,
    we want to have replicated. Then, there are our lerp settings. These lerp settings
    dictate how much the component should attempt to fill in the blanks between network
    synchronization ticks.


    Finally, we have the client authority boolean value that we’ve become familiar
    with, which determined who has permission to control the networked rigid body.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Network Rigidbody (2D and 3D Variants)


    The Network Rigidbody is another method of synchronizing rigidbodies over the
    network. However, these do not interpolate their values. There are Network Rigidbody
    components for both 2D and 3D rigidbodies.


    Its synchronization properties are a bit different from the Network Lerp Rigidbody
    component (Figure 4-14) that we just covered, so let’s look at it.


    Here, we also have a target that we can specify. We also have the addition of
    some checkboxes that give us more control over what properties should be synchronized.


    This additional control can help us reduce network bandwidth in many situations
    where we might only want to synchronize velocity, such as a moving platform that
    does not rotate.


    ![](img/9be82dd80844460a2c43cbf8813817d7_142_0.png)


    Figure 4-14. The figure shows the Network Lerp Rigidbody component'

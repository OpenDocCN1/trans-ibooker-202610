  \n![](img/124f805c8155c7226d129ebbcc2842f0_91_0.png)\n\nFigure 5-4. Default style\
  \ sinusoidal graph\n\nLet’s use the ggplot style as follows:\n\n```\nsinusoidal('ggplot')\n\
  plt.show()\n```\n\nFigure 5-5 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_92_0.png)\n\
  \nFigure 5-5. ggplot-style sinusoidal graph\n\nLet’s see the Seaborn style, as shown\

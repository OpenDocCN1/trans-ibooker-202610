  \           colors='g')\nplt.clabel(out, inline=True,\n           fontsize=10)\n\
  plt.show()\n```\n\nFigure 7-8 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_115_1.png)\n\
  \n**Figure 7-8.** Simple labeled contour with custom colors\n\nYou can also have\

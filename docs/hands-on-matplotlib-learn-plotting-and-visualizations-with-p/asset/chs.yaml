- '# 关于作者


  **Ashwin Pajankar** 在 IIIT Hyderabad 获得计算机科学工程技术硕士学位，在编程领域拥有超过 25 年的经验。他在 7 岁时就以
  BASIC 编程语言开始了编程和电子学的旅程，如今精通汇编编程、C、C++、Java、shell 脚本和 Python。他的其他技术专长包括单板计算机，如 Raspberry
  Pi 和 Banana Pro，微控制器板，如 Arduino，以及嵌入式板，如 BBC Micro Bit。


  他目前是一名自由在线讲师，向超过 70,000 名专业人士教授编程。他还定期为软件专业人士举办现场编程训练营。他的 YouTube 频道正在增长，订阅者超过 10,000
  人。他已出版超过 15 本关于编程和电子学的书籍。


  除了技术工作外，他还为许多社会事业做志愿者。他因其社区服务而在大学和过去的工作场所获得了多个奖项。他还参与了许多产学联动项目，将过去的雇主与他的母校联系起来。在
  COVID-19 大流行期间（本书撰写时正在展开），他参与并领导了许多向当地社区有需要的人分发必需物资和药品的倡议。


  # 关于技术审校


  **Joos Korstanje** 是一名数据科学家，在开发机器学习工具方面拥有超过五年的行业经验，尤其是在预测模型方面。他目前在迪士尼乐巴黎工作，开发各种工具的机器学习。他是书籍
  *Advanced Forecasting with Python* 的作者。


  # 致谢


  我谨向 Celestin 和 Aditee 致谢，他们给了我与读者分享我的知识和经验的机会。我感谢 James Markham 帮助我将本书按照 Apress
  的标准进行塑造。我欠技术审校员一份人情，他帮助我改进了本书。我还要感谢 Prof. Govindrajulu 先生家族，Srinivas（儿子）和 Amy（儿媳），允许我将本书献给他的记忆，并分享他的传记信息和照片供出版。我还要感谢
  Apress 的所有人员，他们在使这个项目成为现实方面发挥了重要作用。


  # 引言


  我从事数据科学领域的工作已超过十年，而我是在 15 多年前接触到 Python 的。当我第一次使用 NumPy、Matplotlib 和 Pandas 等库时，我发现翻阅各种印刷书籍、视频教程和在线文章中的所有可用文献有点乏味，因为其中大多数缺乏适合初学者的全面步骤。于是我决心写一本这样的书，很高兴在
  Apress 的帮助下，我能够将这一决心付诸实践。


  本书是数千小时工作的成果（除了撰写实际书籍所花费的时间之外），包括阅读技术文档、观看培训视频、使用不同工具编写代码、调试有问题的代码片段、在各种技术论坛上提问和参与讨论，以及参考各种代码仓库以获取提示。我以初学者易于理解的方式撰写了本书。本书包含数百个代码示例和代码输出图像，以便您完全理解每个引入的概念。所有代码示例都进行了详细解释。


  本书首先对 Python 进行一般性讨论，并提供一个小指南，解释如何在各种计算平台上安装它，例如 Windows 操作系统和 Linux 计算机（如 Raspberry
  Pi）。然后我们将讨论科学生态系统。然后我们重点关注 NumPy，它是数值计算的基础库。我们特别关注 NumPy 的多维、类数组数据结构，称为 *Ndarray*。然后我们探索数据可视化库，如
  Matplotlib 和 Plotly，以学习如何绘制 Ndarrays。


  大多数章节都探讨数据可视化库 Matplotlib。您将在这些章节中学习大量数据可视化技巧和技术。


  然后我们深入 Pandas，以便您可以了解其重要的数据结构，称为 *series* 和 *dataframe*。在本书中途，您还将学习如何使用 Python、NumPy、Matplotlib
  和 Pandas 从各种数据源读取数据。您还将学习如何使用流行的可视化库（如 Matplotlib 和 Seaborn）可视化 Pandas 数据，以及如何处理时间索引数据。

  '
- "# 第1章\n\n# Python 3 简介\n\n我欢迎大家踏上使用 Matplotlib 以及 NumPy、Pandas 和 Seaborn 等相关库进行数据可视化的激动人心的旅程。\n\
  \n本章涵盖 Python 编程语言的基础知识，包括其历史、安装和应用。您将编写一些简单和入门的 Python 3 程序，并学习如何在各种操作系统平台上执行它们。\n\
  \n然后，我们将开始探索科学 Python 生态系统。我们将简要讨论科学 Python 生态系统的成员库，并在最后探索 Jupyter Notebook，以便我们在本书其余部分中使用它。\n\
  \n具体来说，本章涵盖的主题如下：\n\n+   - Python 编程语言\n+   - 在各种平台上安装 Python\n+   - Python 模式\n\
  +   - Python IDE\n+   - 科学 Python 生态系统\n+   - Jupyter Notebook 的概述和设置\n+   - 在 Jupyter\
  \ Notebook 中运行代码\n+   - Anaconda\n\n阅读完本章后，您将能够在各种平台上的各种模式下舒适地安装和使用 Python 3 编程语言。\n\
  \n# 介绍 Python 3 编程语言\n\nPython 3 是一种通用、高级和解释型编程语言。在本节中，我们将讨论 Python 编程语言及其哲学。\n\n\
  ## Python 编程语言的历史\n\nPython 是 ABC 编程语言的继任者，而 ABC 本身受 ALGOL 68 和 SETL 编程语言的启发。Python\
  \ 由 Guido van Rossum 在 1980 年代末在荷兰 Centrum Wiskunde & Informatica（英文：“数学与计算机科学国家研究学院”）工作期间的假期中作为一个副项目创建。Van\
  \ Rossum 出生并成长于荷兰。他在阿姆斯特丹大学获得了数学和计算机科学硕士学位。他曾在 Google 和 Dropbox 工作，之后退休。然而，在 2020\
  \ 年 11 月，他加入了 Microsoft。\n\n从 Python 编程语言的初始发布到 2018 年 7 月，Guido 一直是该项目的首席开发者和终身仁慈独裁者（BDFL）。他通过\
  \ 2019 年在 Python 指导委员会工作，但在 2020 年，他撤回了连任指导委员会的提名。\n\n以下是 Python 发布时间线中的重要里程碑：\n\
  \n+   - *1991 年 2 月*：Van Rossum 将代码（标记为 0.9.0 版本）发布到 alt.sources。\n+   - *1994 年\
  \ 1 月*：发布了 1.0 版本。\n+   - *2000 年 10 月*：发布了 Python 2.0。\n+   - *2006 年 12 月*：发布了\
  \ Python 3.0。\n+   - *2019 年 12 月*：Python 2.x 正式退役，不再由 Python 软件基金会支持。\n\n正如您所见，Python\
  \ 2.x 版本不再受支持，因为 Python 2 已退役。Python 3 与 Python 2 不向后兼容。Python 3 是 Python 编程语言的最新和受支持版本。因此，我们将在全书中使用\
  \ Python 3 编程来演示所涵盖的概念。除非明确提及，否则本书中 Python 指的都是 Python 3。\n\n\n\n\n\n## Python 增强提案\n\
  \n为了指导 Python 的开发、维护和支持，Python 领导层提出了 *Python 增强提案*（PEPs）的概念。它们是建议新特性和修复 Python\
  \ 项目中问题的主要机制。你可以在以下网址阅读有关 PEPs 的更多信息：\n\n```\nhttps://www.python.org/dev/peps/\n\
  https://www.python.org/dev/peps/pep-0001/\n```\n\n## Python 编程语言的哲学\n\nPython 的哲学在\
  \ PEP20 中有详细说明。它被称为 Python 之禅，网址为 https://www.python.org/dev/peps/pep-0020/。以下是该\
  \ PEP 中的要点。其中一些很有趣。\n\n- 美胜于丑。\n- 显式胜于隐式。\n- 简单胜于复杂。\n- 复杂胜于繁琐。\n- 扁平胜于嵌套。\n- 稀疏胜于密集。\n\
  - 可读性很重要。\n- 特殊情况不足以打破规则。\n  - 然而实用性胜于纯粹性。\n- 错误绝不应静默通过。\n  - 除非明确被静默。\n- 面对不确定性，抵制猜测的诱惑。\n\
  - 应该有一种——最好只有一种——显而易见的方法来做某事。\n  - 然而这种方法在你不是荷兰人的情况下可能一开始并不明显。\n- 现在胜于从不。\n- 然而从不往往胜于*现在就做*。\n\
  - 如果实现难以解释，那是个坏主意。\n- 如果实现容易解释，那可能是一个好主意。\n- 命名空间是一个了不起的想法——让我们多做一些！\n\n这些是继续影响\
  \ Python 编程语言开发的一般哲学指导方针。\n\n## Python 的应用\n\n如你所学，Python 是一种通用编程语言；它在以下领域有众多应用：\n\
  \n- Web 开发\n- GUI 开发\n- 科学和数值计算\n- 软件开发\n- 系统管理\n\n你可以在 https://www.python.org/success-stories/\
  \ 阅读 Python 的案例研究。\n\n## 在各种平台上安装 Python\n\nPython *实现* 是一个程序（Python 解释器的实际二进制可执行文件），它支持执行用\
  \ Python 编程语言编写的程序。由 Guido van Rossum 创建的原始实现被称为 *CPython*，并作为参考实现。在整本书中，我们将使用 CPython。它可在\
  \ Python 网站上获得，你将在本节学习如何在 Windows 操作系统上安装它。我喜欢在 Windows 计算机或装有 Raspberry Pi OS 的\
  \ Raspberry Pi 计算机上编写 Python 程序。你可以在 https://www.python.org/download/alternatives/\
  \ 找到替代 Python 实现的列表。\n\n我认为现在是讨论各种 Python 发行版的好时机。你看到 Python 的实际解释器程序被称为 *实现*。当它捆绑了一些有用的东西，如集成开发环境（IDE）、工具和库时，它被称为\
  \ *发行版*。你可以在 https://wiki.python.org/moin/PythonDistributions 找到 Python 发行版的列表。\n\
  现在，让我们看看如何在两个平台上安装 Python。\n\n## 在 Windows 计算机上安装\n\n访问位于 https://www.python.org/downloads/\
  \ 的 Python 3 下载页面并下载适用于你的计算机的 Python 3 安装文件。该页面将自动检测你计算机上的操作系统并显示适当的下载文件，如图 1-1\
  \ 所示。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_19_0.png)\n\n图 1-1. 带有下载选项的 Python\
  \ 项目主页\n\n运行安装文件以安装 Python 3。在安装过程中，选择与将 Python 3 添加到 PATH 变量相关的复选框（图 1-2）。\n\n\
  ![](img/124f805c8155c7226d129ebbcc2842f0_20_0.png)\n\n*图 1-2. Python 安装向导*\n\n另外，选择“自定义安装”选项。这将带你进入更多选项，如图\
  \ 1-3 所示。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_21_0.png)\n\n# 图 1-3. Python\
  \ 安装选项\n\n选择所有复选框并单击下一步按钮以继续设置。完成设置。Python 的二进制可执行程序名称在 Windows 上为 python。安装完成后，在\
  \ Windows 命令提示符 cmd 中运行以下命令：\n\n```\npython -V\n```\n\n这将返回 Python 3 的版本如下：\n\n\
  ```\nPython 3.8.1\n```\n\n你也可以按如下方式检查 pip 的版本：\n\n```\npip3 -V\n```\n\npip 是一个递归缩写，代表“Pip\
  \ installs Python”或“Pip installs packages”。它是 Python 编程语言的包管理器。你可以使用 pip 实用程序为我们的演示安装其他需要的\
  \ Python 库。\n\n要找到 Python 的确切位置，你可以按如下方式运行 where 命令：\n\n```\nwhere python\n```\n\
  \n这返回以下结果：\n\n```\nC:\\\\Users\\\\Ashwin\\\\AppData\\\\Local\\\\Programs\\\\Python\\\
  \\Python38-32\\\\python.exe\n```\n\n同样，你可以通过运行以下命令找到 pip3 实用程序的位置：\n\n```\nwhere\
  \ pip3\n```\n\n在整本书中，我们将大量使用此实用程序来安装和管理我们正在使用的计算机上的 Python 3 库。以下命令列出所有已安装的包：\n\n\
  ```\npip3 list\n```\n\n## 在 Ubuntu/Debian 衍生版上安装\n\nDebian 是一个流行的发行版。Ubuntu Linux\
  \ 和 Raspberry Pi OS 是基于 Debian 的其他流行发行版。Python 3 和 pip3 已预装在所有 Debian 发行版及其衍生版（如\
  \ Ubuntu 或 Raspberry Pi OS）上。因此，我们无需单独安装它们。我在配备 8 GB RAM 的 Raspberry Pi 4B 上使用 Raspberry\
  \ Pi OS 作为我的 Linux 计算机。两个主要的 Python 版本，Python 2 和 Python 3，都预装在所有 Debian 衍生版上。它们的解释器可执行文件分别命名为\
  \ python 和 python3，分别对应 Python 2 和 Python 3。我们将使用 python3 进行演示。要查找所需二进制可执行文件版本和位置，请依次运行以下命令：\n\
  \n```\npython3 -V\npip3 -V\nwhich python3\nwhich pip3\n```\n\n几乎所有其他流行的 Linux 发行版也预装了\
  \ Python。\n\n另一种方式是从命令提示符（cmd）启动它，运行以下命令：\n\n```\nidle\n```\n\n这将启动图 1-5 所示的窗口。\n\
  \n![](img/124f805c8155c7226d129ebbcc2842f0_24_0.png)\n\n图 1-5. Python IDLE\n\n在继续之前，你需要自定义\
  \ IDLE 使其适合你。你可以通过选择 Options ► Configure IDLE 来更改字体，如图 1-6 所示。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_24_1.png)\n\
  \n图 1-6. 配置 IDLE\n\n图 1-7 所示的窗口打开，以便你可以更改 IDLE 中字符的字体和大小。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_25_0.png)\n\
  \n*图 1-7. IDLE 配置窗口*\n\n根据自己的喜好调整选项。\n\n并非所有 Linux 发行版都预装了 IDLE。你可以在 Debian 及衍生版（Ubuntu\
  \ 和 Raspberry Pi OS）上通过按顺序运行以下命令安装它：\n\n```\nsudo apt-get update\nsudo apt-get install\
  \ idle3\n```\n\n安装完成后，你可以在菜单中（在此例中为 Raspberry Pi OS 菜单）找到 IDLE，如图 1-8 所示。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_26_0.png)\n\
  \n图 1-8. Raspberry Pi OS 菜单中的 IDLE\n\n你也可以通过运行以下命令在 Linux 上启动 IDLE：\n\n```\nidle\n\
  ```\n\n现在让我们讨论 Python 的各种模式。\n\n```\nC:\\Users\\Ashwin>python\nPython 3.8.3 (tags/v3.8.3:6f8c832,\
  \ May 13 2020, 22:20:19) [MSC v.1925 32 bit (Intel)] on win32\nType \"help\", \"\
  copyright\", \"credits\" or \"license\" for more information.\n>>> \n```\n\n> 图\
  \ 1-10. Python 交互模式，Windows 命令提示符\n\n## 脚本模式\n\n你可以编写一个 Python 程序并将其保存到磁盘。然后你可以以多种方式启动它。这被称为\
  \ *脚本模式*。让我们在 IDLE 中演示它。你可以使用任何文本编辑器编写 Python 程序。但由于 IDLE 是一个 IDE，使用 IDLE 编写和运行\
  \ Python 程序很方便。让我们先看看。 在 IDLE 中，选择 File ► New File。这将创建一个新的空白文件。向其中添加以下代码：\n\n```\n\
  print('Hello World!')\n```\n\n然后以 prog01.py 的名称将其保存到磁盘（图 1-11）。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_28_0.png)\n\
  \n> 图 1-11. IDLE 代码编辑器中的一个 Python 程序\n\n在菜单中选择 Run ► Run Module。这将在 IDLE 提示符下执行程序，如图\
  \ 1-12 所示。\n\n\n\n\n\n![](img/124f805c8155c7226d129ebbcc2842f0_29_0.png)\n\n你甚至可以在操作系统的命令提示符下使用\
  \ Python 的解释器启动程序。打开操作系统的命令提示符并导航到程序存储的目录。在 Windows 命令提示符下，运行以下命令：\n\n```text\n\
  python prog01.py\n```\n\n在 Linux 终端中，你必须运行以下命令：\n\n```text\npython3 prog01.py\n\
  ```\n\n然后解释器将在命令提示符下运行程序，输出（如果有）将显示在那里。\n\n在 Linux 中，还有另一种无需显式使用解释器即可运行程序的方法。你可以在代码文件开头添加\
  \ shebang 行。例如，假设我们的代码文件如下所示：\n\n```python\n#!/usr/bin/python3\nprint('Hello World!')\n\
  ```\n\n第一行被称为 *shebang* 行。它告诉 shell 使用哪个解释器以及其位置。然后运行以下命令将文件权限更改为使其对所有者可执行，如下所示：\n\
  \n```text\nchmod 755 prog01.py\n```\n\n然后你可以直接像其他任何可执行文件一样使用 `./` 启动你的 Python 程序文件，如下所示：\n\
  \n```text\n./prog01.py\n```\n\nshell 将执行程序并在终端中打印输出。请注意，这仅适用于类 Unix 系统（Linux 和 macOS），因为它们支持以这种方式执行程序。你将在本书中继续学习更多关于\
  \ Python 编程的知识。\n\n## 使用 Python IDE\n\n你已经学习了如何使用 Python 解释器和 IDLE 来运行 Python 3\
  \ 语句和程序。你可以使用其他免费可用的 IDE 和 IDE 插件来使用 Python。以下是一些著名的 Python 3 IDE 和插件的列表，以及它们主页的网址：\n\
  \n- PyCharm Community Edition ([https://www.jetbrains.com/pycharm/](https://www.jetbrains.com/pycharm/))\n\
  - Spyder IDE ([https://www.spyder-ide.org/](https://www.spyder-ide.org/))\n- Thonny\
  \ Python Editor ([https://thonny.org/](https://thonny.org/))\n- Mu Editor ([https://codewith.mu/](https://codewith.mu/))\n\
  - PyDev plugin for Eclipse ([https://www.pydev.org/](https://www.pydev.org/))\n\n\
  所有这些 IDE 和插件都可免费下载和使用。作为本章的练习，你可能想探索它们以找到你最舒适的 IDE。\n\n## 探索科学 Python 生态系统\n\n科学\
  \ Python 生态系统是一组用于科学计算的开源 Python 库。它具有以下核心组件：\n\n- *Python*: 这是一种编程语言。\n- *NumPy*:\

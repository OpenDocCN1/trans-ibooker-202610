  \ | 0.099061 |\n\n在之前的示例中，我们只可视化了一行。现在，让我们可视化整个数据集，如下所示：\n\n```python\nplt.figure()\n\
  df2.plot.bar()\nplt.show()\n```\n\n这将为每一行创建一个柱状图。每个行对应的图形将按行分组显示，如图 16-3 所示。\n\n\
  ![](img/124f805c8155c7226d129ebbcc2842f0_222_0.png)\n\n图 16-3. 可视化一个更复杂的柱状图\n\n\n\
  \n\n你可以看到，索引显示在x轴上，数值标记在y轴上。这是一个未堆叠的垂直条形图。只需传递一个简单的参数，即可创建堆叠版本，如下所示：\n\n```\nplt.figure()\n\

  \n图16-31. 简单而自定义的饼图\n\n您刚刚学习了如何使用饼图可视化数据。\n\n## 总结\n\n在本章中，您学习了如何使用各种技术来可视化数据。您可以在实际项目中使用这些可视化技术。在接下来的章节中，我们将探索用于在Python中创建数据可视化的其他库。\n\

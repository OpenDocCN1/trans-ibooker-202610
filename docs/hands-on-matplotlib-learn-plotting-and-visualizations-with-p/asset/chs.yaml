  ## NumPy and Ndarrays


  NumPy is the fundamental package for numerical computation in Python. We can use
  it for numerical computations. The most useful feature of the NumPy library is the
  multidimensional container data structure known as an Ndarray.


  An Ndarray is a multidimensional array (also known as a container) of items that
  have the same datatype and size. We can define the size and datatype of the items
  at the time of creating the Ndarray. Just like other data structures such as lists,
  we can access the contents of an Ndarray with an index. The index in an Ndarray
  starts at 0 (just like arrays in C or lists in Python). We can use Ndarrays for
  a variety of computations. All the




  其他科学 Python 生态系统中的库识别并利用 NumPy Ndarray 及其相关例程来表示其自身的数据结构及其上的操作。


  让我们开始动手操作部分。为本章创建一个新的 notebook。运行以下命令在你的计算机上安装 NumPy 库：


  ```

  !pip3 install numpy

  ```


  通过运行以下命令将其导入到当前 notebook 中：


  ```

  import numpy as np

  ```


  你可以创建一个列表并用它来创建一个简单的 Ndarray，如下所示：


  ```

  l1 = [1, 2, 3]

  x = np.array(l1, dtype=np.int16)

  ```


  这里你是从一个列表创建 Ndarray。成员的数据类型是 16 位整数。你可以在 https://numpy.org/devdocs/user/basics.types.html
  找到支持的数据类型的详细列表。


  你也可以将之前的代码写成单行，如下所示：


  ```

  x = np.array([1, 2, 3], dtype=np.int16)

  ```


  让我们打印 Ndarray 的值及其类型（我们知道，它是 Ndarray）。


  ```

  print(x)

  print(type(x))

  ```


  输出如下：


  ```

  [1 2 3]

  <class ''numpy.ndarray''>

  ```


  正如你在之前的输出中观察到的，它是 numpy.ndarray 类。



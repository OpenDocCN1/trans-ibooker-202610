  \ 'seaborn-colorblind', 'seaborn-dark', 'seaborn-dark-palette', 'seaborn-darkgrid',\
  \ 'seaborn-deep', 'seaborn-muted', 'seaborn-notebook', 'seaborn-paper', 'seaborn-pastel',\
  \ 'seaborn-poster', 'seaborn-talk', 'seaborn-ticks', 'seaborn-white', 'seaborn-whitegrid',\
  \ 'tableau-colorblind10']\n```\n\nLet's apply the classic matplotlib style as follows:\n\
  \n```\nplt.style.use('classic')\nplt.plot(data)\nplt.show()\n```\n\nFigure 5-2 shows\
  \ the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_89_0.png)\n\n*Figure 5-2.\
  \ Classic style*\n\nNote that once you apply a style, that style applies to the\
  \ entire notebook. So, if you want to switch back to the default style, you can\
  \ use the following code:\n\n```\nplt.style.use('default')\n```\n\nLet's show the\
  \ data with the following:\n\n```\nplt.plot(data)\nplt.show()\n```\n\nFigure 5-3\
  \ shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_90_0.png)\n\n*Figure\
  \ 5-3.* Default style\n\nNow let’s demonstrate how the colors are affected when\
  \ we change the styles. Let’s define the data as shown here:\n\n```\nn = 3\ndata\
  \ = np.linspace(0, 2*n*np.pi, 300)\n```\n\nIn addition, let’s define a custom function\
  \ as follows:\n\n```\ndef sinusoidal(sty):\n    plt.style.use(sty)\n    fig, ax\
  \ = plt.subplots()\n\n    ax.plot(data, np.sin(data), label='Sine')\n    ax.plot(data,\
  \ np.cos(data), label='Cosine')\n    ax.legend()\n```\n\nA function is a routine\
  \ that can be called to perform some operation. Until now, we have been using library\
  \ functions that come with Python itself and libraries like NumPy and Matplotlib.\
  \ Here, in the code snippet, we have defined our own custom function.\n\nThis custom\
  \ function accepts an argument. We are using the passed argument as a style for\
  \ our visualization. Let’s call this function with the default styling, as shown\

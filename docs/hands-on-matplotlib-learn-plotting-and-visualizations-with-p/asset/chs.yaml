  \ shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_83_0.png)\n\n**Figure\
  \ 4-18. Customizing the ticks on the axes**\n\n### Object-Oriented Plotting\n\n\
  You can create plots in an object-oriented way. Let’s rewrite one of our earlier\
  \ code examples as follows:\n\n```python\nfig, ax = plt.subplots()\nax.plot(x, -x**2,\
  \ label='-x**2')\nax.plot(x, -x**3, label='-x**3')\nax.plot(x, -2*x, label='-2*x')\n\
  ax.plot(x, -2**x, label='-2**x')\nax.set_xlabel('x = np.arange(3)')\nax.set_ylabel('y\
  \ = f(x)')\nax.set_title('Simple Plot Demo')\nax.legend()\nax.grid(True)\nplt.show()\n\
  ```\n\nNote that we are using the axis object to plot and set the labels and a title.\
  \ Figure 4-19 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_84_0.png)\n\
  \n**Figure 4-19. Output of object-oriented plotting**\n\nYou can also add the text\
  \ with the functions ax.text() or the function plt.text(). The functions accept\
  \ the coordinates and the text to be displayed. The following is an example:\n\n\
  ```python\nfig, ax = plt.subplots()\nax.plot(x, -x**2, label='-x**2')\nax.plot(x,\
  \ -x**3, label='-x**3')\nax.plot(x, -2*x, label='-2*x')\nax.plot(x, -2**x, label='-2**x')\n\
  ax.set_xlabel('x = np.arange(3)')\nax.set_ylabel('y = f(x)')\nax.set_title('Simple\
  \ Plot Demo')\nax.legend()\nax.grid(True)\nax.text(0.25, -5, \"Simple Plot Demo\"\
  )\nplt.show()\n```\n\nFigure 4-20 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_85_0.png)\n\
  \n**Figure 4-20. Rendering text**\n\n### Subplots\n\nYou can show multiple separate\
  \ graphs in the same output. The technique is known as *subplotting*. Subplots can\
  \ have their own titles, own labels, and other specifications. Subplots are created\
  \ in a grid. The first subplot position is at the top left. The other subplot positions\
  \ are relative to the first position. The following is an example:\n\n```python\n\
  x = np.arange(3)\nplt.subplots_adjust(wspace=0.3,\n                    hspace=0.3)\n\
  plt.subplot(2, 2, 1)\nplt.plot(x, -x**2)\nplt.subplot(2, 2, 2)\nplt.plot(x, -x**3)\n\
  plt.subplot(2, 2, 3)\nplt.plot(x, -2*x)\nplt.subplot(2, 2, 4)\nplt.plot(x, -2**x)\n\
  plt.show()\n```\n\nThe first two arguments passed to `plt.subplot()` represent the\
  \ grid size, and the third argument indicates the position of that particular subplot.\
  \ Figure 4-21 shows the output.\n\n\n\n\n\n![](img/124f805c8155c7226d129ebbcc2842f0_86_0.png)\n\
  \n**Figure 4-21. Subplots**\n\nYou can write the same code in object-oriented fashion\
  \ as follows:\n\n```\nfig, axs = plt.subplots(2, 2)\nplt.subplots_adjust(wspace=0.3,\n\
  \                    hspace=0.3)\naxs[0, 0].plot(x, -x**2)\naxs[0, 1].plot(x, -x**3)\n\
  axs[1, 0].plot(x, -2*x)\naxs[1, 1].plot(x, -2**x)\nplt.show()\n```\n\nThe code produces\
  \ the same output as shown in Figure 4-21.\n\n### Summary\n\nThis chapter focused\
  \ on visualizations and various customizations. You learned a great deal about visualizing\
  \ the data and customizing the visualizations as per the requirements. You also\
  \ learned about the object-oriented style of plotting and subplots. The concepts\
  \ you learned in this chapter will be used throughout this book to visualize the\
  \ data.\n\nIn the next chapter, we will explore more stylesheets, legends, and layout\
  \ computations.\n"
- "## CHAPTER 5\n\n# Styles and Layouts\n\nIn the previous chapter, you learned about\
  \ many advanced concepts related to creating visualizations with Matplotlib.\n\n\
  We will continue exploring more concepts related to visualization in greater detail\
  \ in this chapter. Specifically, we will explore the following topics in detail:\n\
  \n- Styles\n- Layouts\n\nAfter reading this chapter, you will be able to work with\
  \ colors, stylesheets, and custom layouts.\n\n### Styles\n\nIn this section, you\
  \ will explore the various styles available in Matplotlib. Up until now we have\
  \ been working with the default style. A style dictates things such as marker size,\
  \ colors, and fonts. There are many built-in styles in Matplotlib. The following\
  \ is a short example of applying a built-in style:\n\n```\n%matplotlib inline\n\
  import matplotlib.pyplot as plt\nimport numpy as np\nplt.style.use('ggplot')\ndata\
  \ = np.random.randn(10)\n```\n\nLet’s visualize it now:\n\n```\nplt.plot(data)\n\
  plt.show()\n```\n\nHere we are using the style of ggplot2, which is a visualization\

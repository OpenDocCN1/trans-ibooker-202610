  ## 切片 Ndarrays


  让我们看看 Ndarray 切片操作的示例。你可以使用索引按如下方式切片提取 Ndarray 的一部分：


  ```

  a1 = np.array([1, 2, 3, 4, 5, 6, 7])

  a1[1:5]

  ```


  此代码将显示从第二个位置到第六个位置的元素（你知道 0 是起始索引）如下：


  ```

  array([2, 3, 4, 5])

  ```


  你可以按如下方式显示从第四个位置开始的元素：


  ```

  a1[3:]

  ```


  输出如下：


  ```

  array([4, 5, 6, 7])

  ```


  你也可以按如下方式显示到特定索引为止的所有元素（不包括该索引处的元素）：


  ```

  a1[:3]

  ```


  输出如下：


  ```

  array([1, 2, 3])

  ```


  你已经看到了负索引的用法。我们可以按如下方式用于切片：


  ```


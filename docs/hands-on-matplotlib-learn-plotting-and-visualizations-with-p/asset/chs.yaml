- "# 第 7 章\n\n# 直方图、等高线图和流图\n\n在上一章中，你学习了使用线图、条形图和散点图创建可视化的多种方法。\n\n在本章中，我们将继续探索使用\
  \ Matplotlib 创建各种可视化。你将学习如何创建直方图和等高线图，还将学习如何使用流图绘制向量。\n\n## 直方图\n\n在开始学习如何创建各种类型的直方图之前，你需要先了解它们是什么。首先，你需要知道什么是频数表。\n\
  \n假设你有一组具有不同取值的成员。你可以创建一个表，其中一列包含多个数值范围区间（bucket），每个区间至少包含一个值。然后你可以统计落入每个区间的成员数量，并将这些计数标注在对应的区间旁。\n\
  \n让我们看一个简单的例子。请为此新建一个 notebook，如下所示：\n\n```python\n%matplotlib inline\nimport numpy\
  \ as np\nimport matplotlib.pyplot as plt\n```\n\n现在，我们手动创建一个数据集，并将区间的数量设为该集合的基数（不同元素的数量）。\n\
  \n```python\nx = [1, 3, 5, 1, 2, 4, 4, 2, 5, 4, 3, 1, 2]\nn_bins = 5\n```\n\n可以使用以下代码显示输出：\n\
  \n```\nplt.hist(x, bins=n_bins)\nplt.show()\n```\n\n图 7-1 显示了输出结果。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_110_0.png)\n\
  \n图 7-1：简单直方图\n\n正态（或高斯）分布是一种连续概率分布，通常呈现钟形曲线。我们来创建一个带有正态分布曲线的直方图。为了创建数据，我们将使用 NumPy\
  \ 的一个例程。下面绘制一个正态分布随机数据的直方图：\n\n```\nnp.random.seed(31415)\nn_points = 10000\nn_bins\
  \ = 15\nx = np.random.randn(n_points)\nplt.hist(x, bins=n_bins)\nplt.show()\n```\n\
  \n\n\nFigure 7-2 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_111_0.png)\n\
  \nFigure 7-2. Simple histogram of random data\n\nThe histogram of one-dimensional\
  \ data is a 2D figure (as shown in Figure 7-2). When you want to create a histogram\
  \ of 2D data, you have to create a 3D figure with the data variables on the x- and\
  \ y-axes and the histogram on the z-axis. In other words, you can use 2D coordinates\
  \ to show this 3D visualization and view the histogram from the top (top view).\
  \ The bars can be color coded to signify their magnitude.\n\n```\ny = np.random.randn(n_points)\n\
  plt.hist2d(x, y, bins=50)\nplt.show()\n```\n\nFigure 7-3 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_112_0.png)\n\
  \nFigure 7-3. Simple histogram of 2D data\n\nYou can customize the histogram by\
  \ setting the transparency and the color as follows:\n\n```\nplt.hist(x, 20, density=True,\n\
  \    histtype='stepfilled',\n    facecolor='g', alpha=0.5)\nplt.show()\n```\n\n\
  Figure 7-4 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_112_1.png)\n\
  \nFigure 7-4. Customized histogram\n\nYou can also show just the outline of the\
  \ histogram as follows:\n\n```\n```python\nplt.hist(x, 20, density=True,\n     \
  \    histtype='step')\nplt.show()\n```\n```\n\nFigure 7-5 shows the output.\n\n\
  ![](img/124f805c8155c7226d129ebbcc2842f0_113_0.png)\n\n**Figure 7-5.** Customized\
  \ histogram with outline only\n\n## Contours\n\nContours represent the outline of\
  \ an object. Contours are continuous (and closed, in many cases) lines highlighting\
  \ the shape of objects. Contours are useful in the area of cartography, which means\
  \ map-making. On maps, a contour joins points of equal height. So, all the points\
  \ on a contour line are at an equal elevation (from the sea level). In other applications\
  \ where we use contours, all the points on the same contour line have the same values\
  \ (or magnitude).\n\nLet’s draw a simple contour. We will create and visualize our\
  \ own data by creating circular contour as follows:\n\n```\n```python\nx = np.arange(-3,\
  \ 3, 0.005)\ny = np.arange(-3, 3, 0.005)\nX, Y = np.meshgrid(x, y)\nZ = (X**2 +\
  \ Y**2)\n```\n```\n\n```\nout = plt.contour(X, Y, Z)\nplt.clabel(out, inline=True,\n\
  \          fontsize=10)\nplt.show()\n```\n\nFigure 7-6 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_114_0.png)\n\
  \n*Simple labeled contour*\n\nYou can also add a color bar to the output as follows:\n\
  \n```\nout = plt.contour(X, Y, Z)\nplt.clabel(out, inline=True,\n          fontsize=10)\n\
  plt.colorbar(out)\nplt.show()\n```\n\nFigure 7-7 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_115_0.png)\n\
  \n**Figure 7-7.** Simple labeled contour with a color bar\n\nYou can also set the\

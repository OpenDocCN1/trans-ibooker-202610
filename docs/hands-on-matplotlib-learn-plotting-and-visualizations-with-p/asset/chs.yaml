  ## 第 8 章 | 图像与音频可视化\n\n输出如下：\n\n```\n<class 'numpy.ndarray'>\n(2601617, 2)\n2\n\
  int16\n5203234\n10406468\n```\n\n正如你所看到的，音频数据被检索并存储在 NumPy 中。它被存储在一个二维矩阵中。假设音频数据有\
  \ N 个数据点（也称为*采样点*），那么 NumPy 数组的大小为 N×2。如你所见，音频有两个通道，左声道和右声道。因此，每个通道存储在一个大小为 N 的独立数组中，所以我们得到\
  \ N×2。这被称为*立体声音频*。在此示例中，我们有 2,601,617 个点（样本）。每个点或样本使用一对 16 位（2 字节）整数表示。因此，每个样本需要四个字节。所以，我们可以通过将样本大小乘以\
  \ 4 来计算存储音频数据所需的总原始内存。当我们可视化音频时，我们显示样本两个通道的值。让我们可视化前 2,000 个数据点，如下所示：\n\n```\nplt.plot(data[:2000])\n\
  plt.show()\n```\n\n图 8-8 展示了输出结果。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_130_0.png)\n\

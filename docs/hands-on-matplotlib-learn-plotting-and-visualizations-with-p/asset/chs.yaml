  \n```\nr = np.arange(0, 5, 0.2)\ntheta = 2 * np.pi * r\nplt.subplot(projection='polar')\n\
  plt.plot(theta, r)\nplt.show()\n```\n\n这会在极坐标图上创建一个简单的线性可视化。由于这是极坐标图，你会看到类似螺旋的结构，如图\
  \ 9-8 所示。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_140_0.png)\n\n图 9-8. 极坐标图上的简单线性可视化\n\

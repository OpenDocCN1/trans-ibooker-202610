  \ visualization. Let’s visualize filled contours as follows:\n\n```\nplt.contourf(X,\
  \ Y, Z,\n    hatches=['-', '/', '\\\\', '//'],\n    cmap='cool',\n    alpha=0.75)\n\
  plt.show()\n```\n\nFigure 7-9 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_116_0.png)\n\
  \nFigure 7-9. Filled contour\n\n## Visualizing Vectors with Stream Plots\n\nUp to\
  \ now, we have visualized scalar entities, which have magnitudes. All the visualizations\
  \ you have learned about up to this point are great for scalars. Vectors, by contrast,\
  \ are entities that have magnitude and direction. For example, force has a magnitude\
  \ and a direction. A specific example is a magnetic force field. You can visualize\
  \ vectors with stream plots. Let’s create our own dataset to visualize this. We\
  \ will create a mesh with X and Y. Then we will create U and V to show the magnitude.\n\
  \n```\nY, X = np.mgrid[-5:5:200j, -5:5:300j]\nU = X**2 + Y**2\nV = X + Y\n```\n\n\
  You can create a simple stream plot as follows:\n\n```\nplt.streamplot(X, Y, U,\
  \ V)\nplt.show()\n```\n\nFigure 7-10 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_117_0.png)\n\
  \nFigure 7-10. Simple stream plot\n\nYou can also have stream plots of variable\
  \ densities as follows:\n\n```\nplt.streamplot(X, Y, U, V,\n    density=[0.5, 0.75])\n\
  plt.show()\n```\n\nFigure 7-11 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_118_0.png)\n\
  \nFigure 7-11. Stream plot with variable densities\n\nYou can also assign colors\
  \ to the stream plot as follows:\n\n```\nplt.streamplot(X, Y, U, V, color=V,\n \
  \   linewidth=1, cmap='cool')\nplt.show()\n```\n\nFigure 7-12 shows the output.\n\
  \n![](img/124f805c8155c7226d129ebbcc2842f0_118_1.png)\n\nFigure 7-12. Stream plot\
  \ with variable colors\n\nYou can also create a stream plot with variable line widths\
  \ as follows:\n\n```\nplt.streamplot(X, Y, U, V,\n    density=0.6,\n    color='k',\n\
  \    linewidth=X)\nplt.show()\n```\n\nFigure 7-13 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_119_0.png)\n\
  \nFigure 7-13. Stream plot with variable line widths\n\nYou can also use quiver\
  \ plots for the vector visualizations as follows:\n\n```\nX = np.arange(-5, 5, 0.5)\n\
  Y = np.arange(-10, 10, 1)\nU, V = np.meshgrid(X, Y)\nplt.quiver(X, Y, U, V)\nplt.show()\n\
  ```\n\nFigure 7-14 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_120_0.png)\n\
  \n**Figure 7-14.** *Visualizing vector fields with a quiver plot*\n\n## Summary\n\
  \nIn this chapter, you learned about histograms, contours, and stream plots.\n\n\
  In the next chapter, you will learn how to visualize images and audio. You will\

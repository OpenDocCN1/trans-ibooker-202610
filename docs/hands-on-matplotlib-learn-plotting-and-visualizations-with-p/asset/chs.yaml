- "# 第 16 章\n\n## 使用 Pandas 和 Matplotlib 可视化数据\n\n在上一章中，你学习了如何使用 NumPy、Pandas 和 Matplotlib\
  \ 将存储在各种文件格式中的数据读取到 Python 变量中。\n\n现在你应该已经能够自如地处理数据了。在本章中，你将练习编写与数据科学领域另一个重要且实用的方面——数据集可视化——相关的程序。本章包含大量简短代码片段示例，演示如何创建数据集的可视化。那么，让我们继续数据科学之旅，学习本章的以下主题：\n\
  \n- 简单图形\n- 柱状图\n- 直方图\n- 箱线图\n- 面积图\n- 散点图\n- 六边形分箱图\n- 饼图\n\n学完本章后，你将能够使用 Pandas\
  \ 和 Matplotlib 创建令人印象深刻的数据集可视化。\n\n# 第 16 章 使用 Pandas 和 Matplotlib 可视化数据\n\n## 简单图形\n\
  \n让我们直接进入数据可视化的动手示例。你将首先学习如何绘制简单图形。我建议你为本章中的代码示例新建一个 notebook。\n\n首先，让我们从导入所有必需库的魔术命令开始，如下所示：\n\
  \n```python\n%matplotlib inline\nimport matplotlib.pyplot as plt\nimport pandas\
  \ as pd\nimport numpy as np\n```\n\n接下来，我们使用 cumsum() 函数创建一些数据，如下所示：\n\n```python\n\
  df1 = pd.DataFrame(np.random.randn(100, 2), columns=['B', 'C']).cumsum()\ndf1['A']\
  \ = pd.Series(list(range(100)))\nprint(df1)\n```\n\n最终的数据集将有三列，如下所示：\n\n```text\n\
  \      B          C    A\n0   -0.684779  -0.655677   0\n1   -0.699163  -1.868611\
  \   1\n2   -0.315527  -3.513103   2\n3   -0.504069  -4.175940   3\n4    0.998419\
  \  -4.385832   4\n..         ...        ...  ...\n95   1.149399  -1.445029  95\n\
  96   2.035029  -1.886731  96\n97   0.938699   0.188980  97\n98   2.449148   0.335828\
  \  98\n99   2.204369  -1.304379  99\n\n[100 rows x 3 columns]\n```\n\n输出如下：\n\n\
  ```text\nB    0.998419\nC   -4.385832\nA    4.000000\nName: 4, dtype: float64\n\
  ```\n\n让我们使用 `bar()` 例程，用这些数据绘制一个简单的柱状图。其代码片段如下：\n\n```python\nplt.figure()\ndf1.iloc[4].plot.bar()\n\
  plt.axhline(0, color='k')\nplt.show()\n```\n\n在这个代码示例中，我们使用 `axhline()` 绘制一条与 x\
  \ 轴对应的水平线。图 16-2 显示了输出结果。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_221_0.png)\n\
  \n**图 16-2.** *可视化一个简单的柱状图*\n\n下面讨论一个更复杂的柱状图示例。让我们创建一个新数据集，如下所示：\n\n```python\n\
  df2 = pd.DataFrame(np.random.rand(10, 4), columns=['a', 'b', 'c', 'd'])\nprint(df2)\n\
  ```\n\n输出如下：\n\n|   | a       | b       | c       | d       |\n|---|---------|---------|---------|---------|\n\
  | 0 | 0.352173 | 0.127452 | 0.637665 | 0.734944 |\n| 1 | 0.375190 | 0.931818 | 0.769403\
  \ | 0.927441 |\n| 2 | 0.830744 | 0.942059 | 0.781032 | 0.557774 |\n| 3 | 0.977058\
  \ | 0.594992 | 0.557016 | 0.862058 |\n| 4 | 0.960796 | 0.329448 | 0.493713 | 0.971139\
  \ |\n| 5 | 0.364460 | 0.516401 | 0.432365 | 0.587528 |\n| 6 | 0.292020 | 0.500945\
  \ | 0.889294 | 0.211502 |\n| 7 | 0.770808 | 0.519468 | 0.279582 | 0.419549 |\n|\

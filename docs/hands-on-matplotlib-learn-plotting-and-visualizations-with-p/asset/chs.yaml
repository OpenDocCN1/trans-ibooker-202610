  \n## Plain-Text File Handling\n\n让我们学习如何从纯文本文件读取数据并向其写入数据。Python 带有读取和写入纯文本文件的功能。我们有四种打开文件的方式，如下所示：\n\
  \n- `w`: Write\n- `r`: Read\n- `a`: Append\n- `r+`: Read and write mode\n\n你可以使用它们（一次一个）如下：\n\
  \n```python\nf = open('testfile.txt', 'w')\nprint(f)\n```\n\n此代码以写模式打开 testfile.txt\
  \ 文件。如果文件不存在，则 Python 会在磁盘的当前位置创建此文件。如果文件已存在，它会覆盖文件的内容。之前的代码会按如下方式打印文件对象：\n\n```\n\
  <_io.TextIOWrapper name='testfile.txt' mode='w' encoding='cp1252'>\n```\n\n让我们向文件写入一些数据。在这种情况下，数据由多字符字符串组成。\n\
  \n```python\nf.write('This is a test string.\\n')\nf.write('This is the middle line.\\\
  n')\nf.write('This is the last line.')\n```\n\n你可以按如下方式关闭文件对象（也称为 *file handle*）：\n\
  \n```python\nf.close()\n```\n\n你知道再次以写模式打开文件会覆盖其数据。所以，这次让我们以追加模式打开同一个文件如下：\n\n```python\n\
  f = open('testfile.txt', 'a')\nf.write('\\nThis is the appended line.')\nf.close()\n\
  ```\n\n我们向文件写入一行然后关闭文件。让我们读取数据并按如下方式打印它：\n\n```python\nf = open('testfile.txt',\
  \ 'r')\nprint(f.read())\nf.close()\n```\n\n输出如下：\n\n```\nThis is a test string.\n\
  This is the middle line.\nThis is the last line.\nThis is the appended line\n```\n\
  \n你可以按如下方式在列表中检索行（文件中的每一行对应列表中的一个元素）：\n\n```python\nf = open('testfile.txt', 'r')\n\
  print(f.readlines())\nf.close()\n```\n\n输出如下：\n\n```\n['This is a test string.\\\
  n', 'This is the middle line.\\n', 'This is the last line.\\n', 'This is the appended\
  \ line.']\n```\n\n你也可以按如下方式逐行检索文件中的数据：\n\n```python\nf = open('testfile.txt', 'r')\n\
  for line in f:\n    print(line)\nf.close()\n```\n\n输出如下：\n\n```\nThis is a test\
  \ string.\n\nThis is the middle line.\n\nThis is the last line.\n\nThis is the appended\
  \ line.\n```\n\n## Handling CSV Files with Python\n\n让我们了解一些关于逗号分隔文件（CSV）格式的信息。CSV\
  \ 文件以纯文本格式存储数据，数据项要么是固定长度，要么由分隔符分隔，例如逗号（,）、竖线（|）或冒号（:）。最常见的 CSV 格式使用逗号作为分隔符，并且很多时候第一行用于存储列名。\n\
  \n在本节中，你将学习如何使用 Python 3 处理 CSV 文件。Python 3 带有内置库来处理 CSV 文件。你不需要安装任何东西。你可以按如下方式导入库：\n\
  \n```python\nimport csv\n```\n\n你可以按如下方式以读模式将文件打开为纯文本文件：\n\n```python\nfile = open('test.csv',\
  \ 'r')\nprint(file)\n```\n\n打开文件后，你可以将文件句柄传递给 csv.reader() 例程如下：\n\n```python\n\
  csvfile = csv.reader(file, delimiter=',')\nprint(csvfile)\n```\n\n这会按如下方式打印对象的值：\n\
  \n```\n<_csv.reader object at 0x0590AC68>\n```\n\n你可以按如下方式逐行检索数据：\n\n```python\n\

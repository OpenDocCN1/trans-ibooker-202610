  ax = fig.add_subplot(projection='3d')\nax.contourf(X, Y, Z, 50, cmap='coolwarm')\n\
  plt.show()\n```\n\n## 线框、曲面和示例数据\n\n你可以按如下方式绘制相同数据集的线框：\n\n```python\nfig = plt.figure()\n\
  ax = plt.axes(projection='3d')\nax.plot_wireframe(X, Y, Z, color='Green')\nax.set_title('wireframe')\n\
  plt.show()\n```\n\n图 11-5 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_159_0.png)\n\
  \n**Figure 11-5.** 3D 线框\n\n相同的数据可以按如下方式可视化为 3D 曲面：\n\n```python\nfig = plt.figure()\n\
  ax = plt.axes(projection='3d')\nax.plot_surface(X, Y, Z, color='Blue')\nax.set_title('Surface\
  \ Plot')\nplt.show()\n```\n\n图 11-6 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_160_0.png)\n\
  \n**Figure 11-6.** *3D 曲面*\n\n你也可以使用随 Matplotlib 库提供的示例数据来演示可视化。`get_test_data()`\
  \ 函数可以按如下方式获取该示例数据：\n\n```python\nfrom mpl_toolkits.mplot3d import axes3d\nfig =\
  \ plt.figure()\nax = fig.add_subplot(projection='3d')\nX, Y, Z = axes3d.get_test_data(0.02)\n\
  ax.plot_wireframe(X, Y, Z,\n                  rstride=10,\n                  cstride=10)\n\
  plt.show()\n```\n\n图 11-7 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_161_0.png)\n\
  \n**Figure 11-7.** 可视化测试数据\n\n作为练习，尝试使用测试数据创建曲面和等高线。\n\n## 条形图\n\n你可以在 3D 坐标轴中显示\
  \ 2D 条形。让我们按如下所示创建图形和坐标轴：\n\n```python\nfig = plt.figure()\nax = fig.add_subplot(projection='3d')\n\
  ```\n\n让我们为条形定义颜色。\n\n```python\ncolors = ['r', 'g', 'b', 'c', 'm', 'y','k']\nyticks\
  \ = [0, 1, 2, 3, 4, 5, 6]\n```\n\n现在，让我们使用以下循环以定义的颜色创建条形图：\n\n```python\nfor c,\
  \ k in zip(colors, yticks):\n    x = np.arange(25)\n    y = np.random.rand(25)\n\
  \    ax.bar(x, y, zs=k, zdir='y',\n           color=c, alpha=0.8)\nplt.show()\n\
  ```\n\n图 11-8 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_162_0.png)\n\n\
  **Figure 11-8.** 在 3D 坐标中可视化 2D 条形\n\n你也可以使用 Matplotlib 创建 3D 条形图。让我们首先按如下所示创建数据：\n\
  \n```python\nfig = plt.figure()\nax = fig.add_subplot(projection='3d')\n\nx = np.arange(10)\
  \ * np.arange(10)\ny = np.arange(10) * np.arange(10)\nx, y = np.meshgrid(x, y)\n\
  x, y = x.ravel(), y.ravel()\ntop = x + y\nbottom = np.zeros_like(top)\nwidth = depth\
  \ = 5\n```\n\n然后你可以按如下方式将其显示为 3D 条形：\n\n```python\nax.bar3d(x, y, bottom, width,\n\
  \         depth, top,\n         shade=True,\n         color='g')\nplt.show()\n```\n\
  \n图 11-9 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_164_0.png)\n\n**Figure\
  \ 11-9.** 可视化 3D 条形\n\n## 箭羽图和茎图\n\n箭羽图用于表示方向性实体（例如，矢量）。让我们按如下所示定义数据：\n\n```python\n\
  fig = plt.figure()\nax = fig.add_subplot(projection='3d')\nx = y = z = np.arange(-0.1,\
  \ 1, 0.2)\nX, Y, Z = np.meshgrid(x, y, z)\nu = np.cos(np.pi * X) * np.sin(np.pi\
  \ * Y) * np.sin(np.pi * Z)\nv = -np.sin(np.pi * X) * np.cos(np.pi * Y) * np.sin(np.pi\
  \ * Z)\nw = np.sin(np.pi * X) * np.sin(np.pi * Y) * np.cos(np.pi * Z)\n```\n\n最后，你可以按如下方式可视化数据：\n\
  \n```python\nax.quiver(X, Y, Z, u, v, w,\n          length=0.1,\n          normalize=True)\n\
  plt.show()\n```\n\n图 11-10 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_165_0.png)\n\
  \n**Figure 11-10.** *箭羽图*\n\n你也可以创建茎图，其中在可视化中绘制垂直线。让我们使用三角函数按如下所示定义数据：\n\n```python\n\
  fig = plt.figure()\nax = fig.add_subplot(projection='3d')\ntheta = np.linspace(0,\
  \ 2 * np.pi)\n\nx = np.sin(theta)\ny = np.cos(theta)\nz = np.cos(theta)\n```\n\n\
  你可以按如下方式可视化茎图：\n\n```python\nax.stem(x, y, z)\nplt.show()\n```\n\n图 11-11 显示了输出。\n\
  \n![](img/124f805c8155c7226d129ebbcc2842f0_166_0.png)\n\n**Figure 11-11.** 茎图\n\n\
  ## 3D 体积\n\n你可以将 3D 体积数据显示为封闭曲面。让我们按如下方式创建此类数据：\n\n```python\nfig = plt.figure()\n\
  ax = fig.add_subplot(projection='3d')\nu = np.linspace(0, 2 * np.pi, 100)\nv = np.linspace(0,\
  \ np.pi, 100)\nx = 10 * np.outer(np.cos(u), np.sin(v))\ny = 10 * np.outer(np.sin(u),\
  \ np.sin(v))\nz = 10 * np.outer(np.ones(np.size(u)), np.cos(v))\n```\n\n你可以按如下方式将此数据显示为球体：\n\
  \n```python\nax.plot_surface(x, y, z)\nplt.show()\n```\n\n图 11-12 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_167_0.png)\n\
  \n**Figure 11-12.** 作为体积的曲面图\n\n你也可以使用 voxels() 函数按如下方式可视化体积：\n\n```python\nma =\
  \ np.random.randint(1, 3, size=(3, 3, 3))\nfig = plt.figure()\nax = plt.axes(projection='3d')\n\
  ax.voxels(ma, edgecolor='k')\nplt.show()\n```\n\n图 11-13 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_168_0.png)\n\
  \n**Figure 11-13.** 3D 体积图\n\n## 总结\n\n在本章中，你学习了如何使用 3D 可视化。线框、曲面和 3D 等高线用于显示体积数据。条形图用于显示分类数据。箭羽图用于可视化矢量。\n\
  \n在下一章中，你将学习如何创建动画。\n\n## Matplotlib 中的动画\n\n在上一章中，你学习了如何在 Matplotlib 中使用 3D 可视化。在本章中，你将学习如何使用动画。本章将学习以下主题：\n\
  \n- Animation basics\n- Celluloid library\n\n阅读本章后，你将能够在 Matplotlib 和另一个有用的库中使用动画。\n\
  \n## 动画基础\n\n在本节中，你将学习如何使用 Matplotlib 创建动画。首先让我们为本章创建一个新的笔记本。然后导入以下库：\n\n```python\n\
  %matplotlib qt\nimport numpy as np\nfrom matplotlib import pyplot as plt\nfrom matplotlib.animation\
  \ import FuncAnimation\n```\n\n让我们按如下方式定义对象，即图形、坐标轴和绘图：\n\n```python\nfig = plt.figure()\n\
  ax = plt.axes(xlim=(0, 4), ylim=(-2, 2))\nline, = ax.plot([], [], lw=3)\n```\n\n\
  \n\n\n\nFigure **12-1** shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_171_0.png)\n\
  \nYou can interact with animation and change the orientation with your mouse.\n\n\
  Explore all the interactive possibilities before proceeding further.\n\nYou can\
  \ create a progressive spiral, as shown here:\n\n```\n```python\nfig = plt.figure()\n\
  ax = plt.axes(xlim=(-50, 50), ylim=(-50, 50))\nline, = ax.plot([], [], lw=2)\ndef\
  \ init():\n    line.set_data([], [])\n    return line,\nxdata, ydata = [], []\n\
  def animate(i):\n    t = 0.2*i\n```\n```\n\n```\nx = t*np.cos(t)\ny = t*np.sin(t)\n\
  xdata.append(x)\nydata.append(y)\nline.set_data(xdata, ydata)\nreturn line,\nanim\
  \ = FuncAnimation(fig, animate,\n    init_func=init,\n    frames=3000,\n    interval=5,\n\
  \    blit=True)\n```\n\nFigure 12-2 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_172_0.png)\n\
  \nFigure 12-2. Visualizing a spiral animation\n\n## Celluloid Library\n\nYou can\
  \ use another simple library called Celluloid for animation. Let’s install it as\
  \ follows:\n\n```\n!pip3 install celluloid\n```\n\nYou can import it as follows:\n\
  \n```\nfrom celluloid import Camera\n```\n\nLet’s create a figure and camera object\
  \ as follows:\n\n```\nfig = plt.figure()\ncamera = Camera(fig)\n```\n\nLet’s create\
  \ the frames of an animation and save them in memory with the function called camera.snap(),\
  \ as follows:\n\n```\nfor i in range(10):\n    plt.plot([i] * 10)\n    camera.snap()\n\
  ```\n\nLet’s create the animation as follows:\n\n```\nanimation = camera.animate()\n\
  ```\n\nFigure 12-3 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_174_0.png)\n\
  \nFigure 12-3. Animation with the Celluloid library\n\nYou can also create a sine\
  \ wave as follows:\n\n```\nfig, axes = plt.subplots()\ncamera = Camera(fig)\nt =\
  \ np.linspace(0, 2 * np.pi, 128, endpoint=False)\nfor i in t:\n    plt.plot(t, np.sin(t\
  \ + i), color='green')\n    camera.snap()\nanimation = camera.animate()\n```\n\n\
  Figure 12-4 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_175_0.png)\n\
  \nFigure 12-4. Sine wave animation with the Celluloid library\n\nAnother example\
  \ with a bar graph is as follows:\n\n```\nfig, axes = plt.subplots()\ncamera = Camera(fig)\n\
  y = np.arange(5)\nfor i in y:\n    plt.bar( np.random.rand(5)*10 , y)\n    camera.snap()\n\
  animation = camera.animate()\n```\n\nFigure 12-5 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_176_0.png)\n\
  \n**Figure 12-5.** *Bar graph animation with the Celluloid library*\n\n## Summary\n\
  \nIn this chapter, you learned how to work with animations.\n\nIn the next chapter,\
  \ you will learn how to do even more with Matplotlib.\n"
- "# CHAPTER 13\n\n# More Visualizations\nwith Matplotlib\n\nIn the previous chapter,\
  \ you learned how to work with animations in Matplotlib.\nIn this chapter, you will\
  \ learn a few more techniques for using Matplotlib. This chapter is the culmination\
  \ of all the knowledge you have gained up to now. The chapter has an assortment\
  \ of techniques for using Matplotlib that I did not cover in the earlier chapters.\
  \ Specifically, the following are the topics you will learn in this chapter:\n\n\
  - Visualizing a function as an image and a contour\n- Using 3D vignettes\n- Decorating\
  \ scatter plots\n- Working with time plots and signals\n- Working with filled plots,\
  \ step plots, and hexbins\n- Using XKCD style\n\nAfter reading this chapter, you\
  \ will be able to create all sorts of new visualizations in Matplotlib.\n\n## Visualizing\
  \ a Function as an Image and a Contour\n\nLet’s visualize a numerical function.\
  \ Import all the needed libraries as follows:\n\n```\n%matplotlib inline\nimport\
  \ numpy as np\nimport matplotlib.pyplot as plt\n```\n\nLet’s define the function\
  \ as follows:\n\n```\ndef f(x, y):\n    return (x ** 3 + y ** 2)\n```\n\nLet’s visualize\
  \ it as an image, as follows:\n\n```\nn = 10\nx = np.linspace(-3, 3, 8 * n)\ny =\
  \ np.linspace(-3, 3, 6 * n)\nX, Y = np.meshgrid(x, y)\nZ = f( X, Y )\nplt.imshow(Z,\
  \ interpolation='nearest',\n           cmap = 'cool', origin='lower')\nplt.axis('off')\n\
  plt.show()\n```\n\nFigure 13-1 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_178_0.png)\n\
  \n# Figure 13-1. Visualizing a function as an image\n\nYou can visualize the function\
  \ as a contour too.\n\n```\nn = 256\nx = np.linspace(-3, 3, n)\ny = np.linspace(-3,\
  \ 3, n)\nX, Y = np.meshgrid(x, y)\nplt.contourf(X, Y, f(X, Y), 8,\n```\n\n```\n\
  alpha = 0.75, cmap='hot'\nC = plt.contour(X, Y, f(X, Y), 8,\n    colors='black')\n\
  plt.clabel(C, inline=1, fontsize=10)\nplt.axis('off')\nplt.show()\n```\n\nFigure\
  \ 13-2 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_179_0.png)\n\
  \nFigure 13-2. Visualizing a function as a contour\n\n## 3D Vignettes\n\nYou can\
  \ create a 3D vignette visualization as follows:\n\n```\n%matplotlib qt\nfig = plt.figure()\n\
  ax = plt.axes(projection='3d')\nX = np.arange(-4, 4, 0.25)\nY = np.arange(-4, 4,\
  \ 0.25)\nX, Y = np.meshgrid(X, Y)\nR = np.sqrt(X ** 2 + Y ** 2)\nZ = np.sin(R)\n\
  ax.plot_surface(X, Y, Z, rstride=1,\n    cstride=1, cmap='hot')\nax.contourf(X,\
  \ Y, Z, zdir='z',\n    offset=-2, cmap='hot')\nax.set_zlim(-2, 2)\n```\n\n```\n\
  plt.axis('off')\nax.set_zticks()\nplt.show()\n```\n\nFigure 13-3 shows the output.\n\
  \n![](img/124f805c8155c7226d129ebbcc2842f0_180_0.png)\n\nFigure 13-3. Visualizing\
  \ a 3D vignette\n\n## Decorated Scatter Plots\n\nYou can create decorated scatter\
  \ plots with Matplotlib. You need to pass the color and size as arguments. Here’s\
  \ an example:\n\n```\n%matplotlib inline\nn = 1024\nX = np.random.normal(0, 1, n)\n\
  Y = np.random.normal(0, 1, n)\ncolor = np.arctan2(Y, X)\nplt.scatter(X, Y, s=75,\
  \ c=color, alpha=0.5)\nplt.xlim(-1.5, 1.5)\n```\n\n```\nplt.ylim(-1.5, 1.5)\nplt.axis('off')\n\
  plt.show()\n```\n\nFigure 13-4 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_181_0.png)\n\
  \nFigure 13-4. Visualizing a decorated scatter plot\n\n## Time Plots and Signals\n\
  \nYou can visualize time plots and signals as follows:\n\n```\nN = 100\nx = np.arange(N)\
  \ # timestamps\ny1 = np.random.randn(N)\ny2 = np.random.randn(N)\ny3 = np.random.randn(N)\n\
  y4 = np.random.randn(N)\n\nplt.subplot(2, 1, 1)\nplt.plot(x, y1)\nplt.plot(x, y2,\
  \ ':')\nplt.grid()\nplt.xlabel('Time')\nplt.ylabel('y1 and y2')\nplt.axis('tight')\n\
  plt.subplot(2, 1, 2)\n```\n\n```\nplt.plot(x, y3)\nplt.plot(x, y4, 'r')\nplt.grid()\n\
  plt.xlabel('Time')\nplt.ylabel('y3 and y4')\nplt.axis('tight')\nplt.show()\n```\n\
  \nFigure 13-5 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_182_0.png)\n\
  \n# Figure 13-5. Visualizing time plots and signals\n\nYou can also multiply two\
  \ signals. In the following code example, we are using the same x-axis to show all\
  \ three graphs.\n\n```\nf = 1\nt = np.arange( 0.0, 4.0, 0.01)\ns1 = np.sin(2 *np.pi\
  \ * f * t)\ns2 = np.exp(-t)\ns3 = s1 * s2\nf = plt.figure()\nplt.subplots_adjust(hspace=0.001)\n\
  ax1 = plt.subplot( 311 )\nax1.plot(t, s1)\nplt.yticks(np.arange(-0.9, 1.0, 0.4))\n\
  plt.ylim(-1, 1)\n```\n\n```\nax2 = plt.subplot(312, sharex=ax1)\nax2.plot(t, s2)\n\
  plt.yticks(np.arange(0.1, 1.0, 0.2))\nplt.ylim(0, 1)\nax3 = plt.subplot(313, sharex\
  \ = ax1)\nax3.plot(t, s3)\nplt.yticks(np.arange(-0.9, 1.0, 0.4))\nplt.ylim(-1, 1)\n\
  xticklabels = ax1.get_xticklabels() + ax2.get_xticklabels()\nplt.setp(xticklabels,\
  \ visible=False)\nplt.show()\n```\n\nFigure 13-6 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_183_0.png)\n\
  \nFigure 13-6. Multiplying signals\n\n## Filled Plots\n\nYou can fill in the empty\
  \ spaces within the boundaries of plots as follows:\n\n```\nN = 1000\nx = np.linspace(0,\
  \ 1, N)\ny = np.sin(4 * np.pi * x) + np.exp(-5 * x)\nplt.fill(x, y, 'g', alpha =\
  \ 0.8)\nplt.grid(True)\nplt.show()\n```\n\nFigure 13-7 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_184_0.png)\n\
  \nFigure 13-7. Filled-in plots\n\n## Step Plots\n\nLet’s visualize some sine waves\
  \ first.\n\n```\nN = 100\nx = np.linspace(-np.pi, np.pi, N)\ny1 = 0.5 * np.sin(3*x)\n\
  y2 = 1.25 * np.sin(2*x)\ny3 = 2 * np.sin(4*x)\nplt.plot(x, y1, x, y2, x, y3)\nplt.show()\n\
  ```\n\nFigure **13-8** shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_185_0.png)\n\
  \n**Figure 13-8.** Sinusoids\n\nYou can show them as step plots as follows:\n\n\
  ```\n```\nplt.step(x, y1)\nplt.step(x, y2)\nplt.step(x, y3)\nplt.show()\n```\n```\n\
  \nFigure **13-9** shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_185_1.png)\n\
  \n**Figure 13-9.** Sinusoids with step plots\n\n\n\n\n\n# 六边形分箱\n\n你可以按如下方式将数据展示为六边形分箱：\n\
  \n```\nx, y = np.random.normal(size=(2, 10000))\nplt.hexbin(x, y,\n    gridsize=20,\n\
  \    cmap='cool')\nplt.colorbar()\nplt.show()\n```\n\n图 13-10 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_186_0.png)\n\
  \n图 13-10. 六边形分箱可视化\n\n## XKCD 风格\n\n你可以用 XKCD 风格可视化图表。XKCD 是一个广受欢迎的网络漫画。https://xkcd.com\
  \ 是该网络漫画的主页。\n\n```\ny = np.random.randn(1000)\nplt.xkcd()\nplt.hist(y)\nplt.show()\n\
  ```\n\n图 13-11 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_187_0.png)\n\n\
  # 图 13-11. XKCD 直方图\n\n另一个示例如下：\n\n```\ny = np.random.randn(1000)\nplt.xkcd()\n\
  plt.hist(y, bins = 30,\n    range=[-3.5, 3.5],\n    facecolor='r',\n    alpha=0.6,\n\
  \    edgecolor='k')\nplt.grid()\nplt.show()\n```\n\n图 13-12 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_187_1.png)\n\
  \n# 图 13-12. 另一个 XKCD 直方图\n\n你也可以用同样的方式可视化二维直方图，如下所示：\n\n```\ndata = np.random.randn(1000,\
  \ 1000)\nplt.xkcd()\nplt.hist2d(data[0], data[1])\nplt.show()\n```\n\n图 13-13 显示了输出。\n\
  \n![](img/124f805c8155c7226d129ebbcc2842f0_188_0.png)\n\n图 13-13. 第三个 XKCD 直方图\n\
  \n## 本章小结\n\n在本章中，你学习了如何使用 Matplotlib 应用一些额外的可视化技术。\n\n在下一章中，你将了解一个名为 Pandas 的数据科学库。\n"
- "# 第 14 章\n\n# Pandas 入门\n\n在上一章中，你学习了很多 Matplotlib 技术。现在你将学习如何使用另一个在数据科学和数据可视化中很常见的库。\n\
  \n在本章中，我们将重点介绍科学 Python 生态系统中主要的数据科学和分析库：Pandas 的基础知识。你将了解该库中的数据结构。以下是本章的主题：\n\n\
  - Pandas 入门\n- Pandas 中的 Series\n- Pandas 中的 Dataframe\n\n读完本章后，你将能够熟练地使用 Pandas\
  \ 完成基本任务。\n\n## Pandas 简介\n\nPandas 是科学 Python 生态系统中的数据分析组件。事实上，它是科学 Python 生态系统中不可或缺的一部分。它提供了多种多样的数据结构和管理这些数据结构的例程。它提供了多种多样的数据结构和管理这些数据结构的过程。\n\
  \n让我们通过在 Jupyter Notebook 中运行以下命令来在计算机上安装 Pandas：\n\n```\n!pip3 install pandas\n\
  ```\n\n你可以通过运行以下命令将其导入当前会话：\n\n```\nimport pandas as pd\n```\n\n你可以在 https://pandas.pydata.org/\

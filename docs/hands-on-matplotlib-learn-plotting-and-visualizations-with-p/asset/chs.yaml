  \n## Grid, Axes, and Labels\n\n现在你将学习如何在可视化中启用网格。这可以通过语句 plt.grid(True) 来完成。你还将学习如何操作坐标轴的限制。但在此之前，你将快速学习如何将可视化保存为硬盘上的图像。查看以下代码：\n\

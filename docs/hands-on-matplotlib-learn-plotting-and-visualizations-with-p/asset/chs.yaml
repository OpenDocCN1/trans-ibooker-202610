  \n图 16-15. 箱线图实战\n\n例程`boxplot()`的主要优点是，你可以在单个输出中获得逐列的可视化。让我们创建一个合适的数据集，如下所示：\n\n\
  ```\ndf = pd.DataFrame(np.random.rand(10, 2), columns=['Col1', 'Col2'] )\ndf['X']\

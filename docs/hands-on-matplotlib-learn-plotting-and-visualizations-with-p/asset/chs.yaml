- "## 第17章\n\n## 使用Seaborn进行数据可视化入门\n\n在上一章中，您学习了如何可视化存储在Pandas序列和DataFrame中的数据。\n\
  \n在本书的前几章中，您广泛学习了数据可视化库Matplotlib，以及另外两个重要的数据科学库NumPy和Pandas。在本章中，您将暂时告别Matplotlib，学习如何使用另一个相关的数据可视化库Seaborn。以下是您将在本章中学习的主题：\n\
  \n- 什么是Seaborn？\n- 绘制统计关系\n- 绘制线条\n- 可视化数据分布\n\n读完本章后，您将能够熟练使用Seaborn库，并能够创建出色的数据集可视化。\n\
  \n## 什么是Seaborn？\n\n您已经学习了如何使用Matplotlib库进行数据可视化。Matplotlib并不是Python中唯一的数据可视化库。Python中有许多库可以对数据进行可视化。科学数据可视化库支持NumPy和Pandas的数据结构。其中一个用于科学Python可视化的库就是Seaborn（https://seaborn.pydata.org/index.html）。Seaborn基于并构建在Matplotlib之上。它提供了许多绘制美观的功能\n\
  \n\n图形。它内置了对 Pandas 中序列和 DataFrame 数据结构以及 NumPy 中 N 维数组的支持。\n\n让我们为本章的演示创建一个新的笔记本。现在，让我们使用以下命令安装\
  \ Seaborn：\n\n```\n```python\n!pip3 install seaborn\n```\n```\n\n你可以使用以下语句将库导入到笔记本或\
  \ Python 脚本中：\n\n```\n```python\nimport seaborn as sns\n```\n```\n\n你知道 Seaborn\
  \ 库支持 Pandas DataFrame。Seaborn 库中还存储了许多填充了数据的 DataFrame。因此，我们可以使用它们进行演示。让我们看看如何检索这些\
  \ DataFrame。以下命令返回所有内置样本 DataFrame 的列表：\n\n```\n```python\nsns.get_dataset_names()\n\
  ```\n```\n\n以下是输出：\n\n```\n```python\n['anagrams',\n 'anscombe',\n 'attention',\n\
  \ 'brain_networks',\n 'car_crashes',\n 'diamonds',\n 'dots',\n 'exercise',\n 'flights',\n\
  \ 'fmri',\n 'gammas',\n 'geyser',\n 'iris',\n 'mpg',\n 'penguins',\n 'planets',\n\
  \ 'tips',\n 'titanic']\n```\n```\n\n你可以按如下方式将这些 DataFrame 加载到 Python 变量中：\n\n```\n\
  iris = sns.load_dataset('iris')\n```\n\n让我们使用以下语句查看存储在 iris 数据集中的数据：\n\n```\niris\n\
  ```\n\n图 17-1 显示了输出。\n\nIn [6]: iris\nOut[6]:\n|  | sepal_length | sepal_width |\
  \ petal_length | petal_width | species |\n|---|---|---|---|---|---|\n| 0 | 5.1 |\
  \ 3.5 | 1.4 | 0.2 | setosa |\n| 1 | 4.9 | 3.0 | 1.4 | 0.2 | setosa |\n| 2 | 4.7\
  \ | 3.2 | 1.3 | 0.2 | setosa |\n| 3 | 4.6 | 3.1 | 1.5 | 0.2 | setosa |\n| 4 | 5.0\
  \ | 3.6 | 1.4 | 0.2 | setosa |\n| ... | ... | ... | ... | ... | ... |\n| 145 | 6.7\
  \ | 3.0 | 5.2 | 2.3 | virginica |\n| 146 | 6.3 | 2.5 | 5.0 | 1.9 | virginica |\n\
  | 147 | 6.5 | 3.0 | 5.2 | 2.0 | virginica |\n| 148 | 6.2 | 3.4 | 5.4 | 2.3 | virginica\
  \ |\n| 149 | 5.9 | 3.0 | 5.1 | 1.8 | virginica |\n\n图 17-1. iris 数据集\n\n## 绘制统计关系\n\
  \n你可以使用 Seaborn 中的各种函数来绘制两个变量之间的统计关系。执行此操作的一般绘制函数是 relplot()。你可以使用此函数绘制各种类型的数据。默认情况下，relplot()\
  \ 函数绘制散点图。以下是一个示例：\n\n```\n%matplotlib inline\nimport numpy as np\nimport pandas\
  \ as pd\n```\n\n```\n```python\nimport matplotlib.pyplot as plt\n\nsns.relplot(x='sepal_length',\n\
  \            y='sepal_width',\n            data=iris)\nplt.grid('on')\nplt.show()\n\
  ```\n```\n\n这生成了图 17-2 中所示的散点图。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_252_0.png)\n\
  \n**图 17-2。** *散点图*\n\n你可以按如下方式明确指定图形类型：\n\n```\n```python\nsns.relplot(x='sepal_length',\
  \ y='sepal_width',\n            data=iris, kind='scatter')\nplt.grid('on')\nplt.show()\n\
  ```\n```\n\n你还可以使用 `scatterplot()` 函数按如下方式编写：\n\n```\n```python\nsns.scatterplot(x='petal_length',\n\
  \                y='petal_width',\n                data=iris)\nplt.grid('on')\n\
  plt.show()\n```\n```\n\n你可以自定义图形，并使用颜色编码显示额外的列，如下所示：\n\n```\n```python\nsns.relplot(x='sepal_length',\n\
  \            y='sepal_width',\n            hue='species',\n            data=iris)\n\
  plt.grid('on')\nplt.show()\n```\n```\n\n图 17-4 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_254_0.png)\n\
  \n**图 17-4。** *带颜色的散点图*\n\n使用以下代码，你可以获得与图 [17-4](#) 中所示相同的结果：\n\n```\n```python\n\
  sns.scatterplot(x='sepal_length',\n                y='sepal_width',\n          \
  \      hue='species',\n                data=iris)\nplt.grid('on')\nplt.show()\n\
  ```\n```\n\n你还可以按如下方式为散点图的数据点（标记）分配样式：\n\n```\n```python\nsns.relplot(x='sepal_length',\
  \ y='sepal_width',\n            hue='petal_length', style='species',\n         \
  \   data=iris)\nplt.grid('on')\nplt.show()\n```\n```\n\n你可以在图 [17-5](#) 中看到输出。\n\
  \n![](img/124f805c8155c7226d129ebbcc2842f0_255_0.png)\n\n**图 17-5。** *带颜色和自定义样式的散点图*\n\
  \n以下代码产生与图 17-5 中所示相同的输出：\n\n```\n```python\nsns.scatterplot(x='sepal_length', y='sepal_width',\n\
  \                hue='petal_length', style='species',\n                data=iris)\n\
  plt.grid('on')\nplt.show()\n```\n```\n\n你还可以按如下方式调整标记的大小：\n\n```\n```python\nsns.relplot(x='sepal_length',\
  \ y='sepal_width',\n            size='petal_length', style='species',\n        \
  \    hue='species', data=iris)\nplt.grid('on')\nplt.show()\n```\n```\n\n图 17-6 显示了输出。\n\
  \n![](img/124f805c8155c7226d129ebbcc2842f0_256_0.png)\n\n**图 17-6。** *带颜色、自定义样式和标记大小的散点图*\n\
  \n以下代码产生与图 17-5 中所示相同的结果：\n\n```\nsns.scatterplot(x='sepal_length', y='sepal_width',\n\
  \    size='petal_length', style='species',\n    hue='species', data=iris)\nplt.grid('on')\n\
  plt.show()\n```\n\n## 绘制线条\n\n你还可以沿线条显示连续数据，例如时间序列数据。时间序列数据至少在一列中具有时间戳数据，或者具有索引。时间序列的一个很好的例子是每日温度记录表。让我们创建一个时间序列\
  \ DataFrame 来演示线条绘制。\n\n```\ndf = pd.DataFrame(np.random.randn(100, 4),\n    index=pd.date_range(\"\
  1/1/2020\",\n        periods=100),\n    columns=list(\"ABCD\"))\ndf = df.cumsum()\n\
  ```\n\n你可以使用 relplot() 函数按如下方式绘制线条：\n\n```\nsns.relplot(x=df.index, y='A', kind=\"\
  line\", data=df)\nplt.xticks(rotation=45)\nplt.show()\n```\n\n图 17-7 显示了输出。\n\n\
  ![](img/124f805c8155c7226d129ebbcc2842f0_258_0.png)\n\n**图 17-7。** *时间序列数据的线条图*\n\
  \n你还可以使用以下代码生成图 17-7 中所示的输出：\n\n```\nsns.lineplot(x=df.index,\n             y='A',\
  \ data=df)\nplt.xticks(rotation=45)\nplt.show()\n```\n\n在下一节中，你将学习如何可视化数据的分布。\n\n\
  ## 可视化数据分布\n\n可视化数据分布的一个最突出的例子是频率表或频率分布表。你可以创建数据可以具有的值范围桶（定义域），然后列出满足该桶标准的项数。你还可以改变桶的大小，最小大小为\
  \ 1。\n\n你可以使用条形图和线条在视觉上显示频率分布的信息。如果你使用条形图，则称为*直方图*。你可以使用 displot() 函数来可视化频率数据。让我们从虚拟的单个变量数据开始。\n\
  \n```\nx = np.random.randn(100)\nsns.displot(x)\nplt.show()\n```\n\n图 17-8 显示了输出。\n\
  \n![](img/124f805c8155c7226d129ebbcc2842f0_259_0.png)\n\n*图 17-8. 直方图*\n\n你还可以按如下方式明确指定输出中需要直方图：\n\
  \n```\nsns.displot(x, kind='hist')\nplt.show()\n```\n\n直方图是默认的图形类型。你还可以按如下方式显示高斯核密度估计（KDE）：\n\
  \n```\nsns.displot(x, kind='kde')\nplt.show()\n```\n\n图 17-9 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_260_0.png)\n\
  \n图 17-9. KDE 图\n\n你可以按如下方式可视化经验累积分布函数（eCDF）：\n\n```\nsns.displot(x, kind='ecdf')\n\
  plt.show()\n```\n\n图 17-10 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_261_0.png)\n\
  \n图 17-10. eCDF 图\n\n你可以按如下方式组合直方图和 KDE：\n\n```\nsns.displot(x, kind='hist', kde=True)\n\
  plt.show()\n```\n\n图 17-11 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_262_0.png)\n\
  \n图 17-11. 与 KDE 组合的直方图\n\n现在让我们使用一些真实世界的数据，如下所示：\n\n```\ntips = sns.load_dataset(\"\
  tips\")\nsns.displot(x='total_bill', data=tips, kind='hist')\nplt.show()\n```\n\n\
  图 17-12 显示了输出。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_263_0.png)\n\n图 17-12.\
  \ 以直方图可视化的真实世界数据\n\n你可以按如下方式自定义可视化中箱（或桶）的大小：\n\n```\nsns.displot(x='total_bill',\
  \ data=tips,\n    kind='hist', bins=30, kde=True)\nplt.show()\n```\n\n\n\n\n\nFigure\
  \ 17-13 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_264_0.png)\n\
  \n**Figure 17-13.** *Customized buckets in a histogram*\n\nYou can adjust the hue\
  \ of the plots based on a criterion of your choice as follows:\n\n```\nsns.displot(x='total_bill',\
  \ data=tips,\n            kind='kde', hue='size')\nplt.show()\n```\n\nFigure 17-14\
  \ shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_265_0.png)\n\n##\
  \ Figure 17-14. Customized colors in a KDE plot\n\nUp to now, we have used a single\
  \ variable to show the plot. When you use two variables for plotting, it is known\
  \ as a bivariate plot. Here is a simple example:\n\n```\nsns.displot(x='total_bill',\n\
  \            y='tip', data=tips)\nplt.show()\n```\n\nFigure 17-15 shows the output.\n\
  \n![](img/124f805c8155c7226d129ebbcc2842f0_266_0.png)\n\nFigure 17-15. A simple\
  \ bivariate histogram\n\nYou can add color to this example as follows:\n\n```\n\
  sns.displot(x='total_bill', y='tip',\n    hue='size', data=tips)\nplt.show()\n```\n\
  \nFigure 17-16 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_267_0.png)\n\
  \nFigure 17-16. A simple bivariate histogram with color\n\nYou can also customize\
  \ the size of bins and add ticks on the x- and y-axes (known as a rug plot) as follows:\n\
  \n```\nsns.displot(x='total_bill', y='tip',\n    data=tips, rug=True,\n    kind='hist',\
  \ bins=30)\nplt.show()\n```\n\nFigure 17-18 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_269_0.png)\n\
  \nFigure 17-18. A simple bivariate KDE plot\n\nYou can add a rug plot to the output\
  \ as follows:\n\n```\nsns.displot(x='total_bill', y='tip',\n    data=tips, rug=True,\n\
  \    kind='kde')\nplt.show()\n```\n\nThe output has KDE and rug visualizations,\
  \ both as shown in Figure 17-19.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_270_0.png)\n\
  \n**Figure 17-19.** *A simple bivariate KDE plot with a rug plot*\n\nBased on the\
  \ columns in the dataframe, you can create individual visualizations arranged in\
  \ rows or columns. Let’s create a visualization based on the size of tips as follows:\n\
  \n```\n```python\nsns.displot(x='total_bill', y='tip',\n            data=tips, rug=True,\n\
  \            kind='kde', col='size')\nplt.show()\n```\n```\n\nIn the previous example,\
  \ we are enabling the rug plot feature, and the plots will be separately generated\
  \ based on the sizes of the tips. Figure 17-20 shows the output.\n\n![](img/124f805c8155c7226d129ebbcc2842f0_271_0.png)\n\
  \nYou can also arrange the individual graphs in rows as follows:\n\n```\nsns.displot(x='total_bill',\
  \ y='tip',\n            data=tips, rug=True,\n            kind='kde', row='size')\n\
  plt.show()\n```\n\nFigure 17-21 shows the output.\n\nYou’ve just learned how to\
  \ visualize the distribution of data.\n\n## Summary\n\nThis chapter contained lots\

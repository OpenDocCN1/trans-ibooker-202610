  \ 带有图例和图例标题的简单饼图\n\n你刚刚学习了如何创建极坐标图。\n\n## 极坐标图\n\n你也可以创建形状为饼图的极坐标图。然而，与笛卡尔（X-Y）坐标系的一个根本区别是，在极坐标图中，坐标系是径向排列的，因此你需要角度（theta）和距原点的距离（r\
  \ 为半径）来可视化一个点或一组点。让我们创建一个数据集，如下所示：\n\n\n\nN = 20\ntheta = np.linspace(0.0, 2 * np.pi,\
  \ N)\nr = 10 * np.random.rand(N)\n\n点集可以通过如下方式可视化：\n\n```\nplt.subplot(projection='polar')\n\
  plt.bar(theta, r, bottom=0.0,\n    color=['r', 'g', 'b'], alpha=0.2)\nplt.show()\n\
  ```\n\n图 9-7 显示了输出结果。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_139_0.png)\n\n\
  # 图 9-7. 简单的极坐标图\n\n可以看到，这会创建一个柱状图，如图 9-7 所示。YouTube 上有一些有用的视频教程，你可以从中了解更多关于在极坐标系中创建可视化的知识。\n\

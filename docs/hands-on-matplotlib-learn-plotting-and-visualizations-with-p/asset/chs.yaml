  print(samples)\n```\n\n输出如下：\n\n2601617\n\n你可以使用以下方式创建数据的另一种可视化：\n\n```\nplt.plot(data[:10*samplerate])\n\
  plt.show()\n```\n\n图 8-9 展示了输出结果。\n\n![](img/124f805c8155c7226d129ebbcc2842f0_131_0.png)\n\

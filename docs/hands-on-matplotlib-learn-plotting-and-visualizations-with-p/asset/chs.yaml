  \n# 图16-23. 多组散点图\n\n让我们看看如何自定义散点图。您可以自定义点的颜色和大小。颜色或大小可以是常量，也可以是变量。以下是一个数据点颜色可变、大小恒定的示例。当颜色可变时，默认会在输出中添加一个颜色条。\n\

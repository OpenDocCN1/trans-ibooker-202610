  - '[PAGE 3]


    This book is dedicated to the memory of my teacher,

    Prof. Govindarajulu Regeti

    (July 9, 1945, to March 18, 2021).


    ![](img/124f805c8155c7226d129ebbcc2842f0_3_0.png)


    Popularly known to everyone as RGR, Prof. Govindarajulu obtained his B.Tech in
    electrical and electronic engineering from JNTU Kakinada. He also earned an M.Tech
    and a Ph.D. from IIT Kanpur. Prof. Govindarajulu was an early faculty member of
    IIIT Hyderabad and played a significant role in making IIIT Hyderabad the top-class
    institution that it is today. He was by far the most loved and respected faculty
    member of the institute. He was full of energy to teach and full of old-fashioned
    charm. There is no doubt he cared for every student as an individual, taking care
    to know about and to guide them. He taught, guided, and mentored many batches
    of students at IIIT Hyderabad (including the author of this book).'

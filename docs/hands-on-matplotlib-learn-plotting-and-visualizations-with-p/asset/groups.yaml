    ```


    shell 将执行程序并在终端中打印输出。请注意，这仅适用于类 Unix 系统（Linux 和 macOS），因为它们支持以这种方式执行程序。你将在本书中继续学习更多关于
    Python 编程的知识。


    ## 使用 Python IDE


    你已经学习了如何使用 Python 解释器和 IDLE 来运行 Python 3 语句和程序。你可以使用其他免费可用的 IDE 和 IDE 插件来使用 Python。以下是一些著名的
    Python 3 IDE 和插件的列表，以及它们主页的网址：


    - PyCharm Community Edition ([https://www.jetbrains.com/pycharm/](https://www.jetbrains.com/pycharm/))

    - Spyder IDE ([https://www.spyder-ide.org/](https://www.spyder-ide.org/))

    - Thonny Python Editor ([https://thonny.org/](https://thonny.org/))

    - Mu Editor ([https://codewith.mu/](https://codewith.mu/))

    - PyDev plugin for Eclipse ([https://www.pydev.org/](https://www.pydev.org/))


    所有这些 IDE 和插件都可免费下载和使用。作为本章的练习，你可能想探索它们以找到你最舒适的 IDE。


    ## 探索科学 Python 生态系统


    科学 Python 生态系统是一组用于科学计算的开源 Python 库。它具有以下核心组件：


    - *Python*: 这是一种编程语言。

    - *NumPy*: 这是数值计算的基础库。科学 Python 生态系统中的几乎所有库都基于 NumPy。它提供了一种多功能的数据结构，称为 *Ndarray*（“N
    维数组”）。

    - *SciPy*: 该库有许多用于科学计算的例程。

    - *Matplotlib*: 这是一个用于可视化的库。其 pyplot 模块具有 Matlab 风格可视化的例程。


    所有这些组件一起提供了类似 Matlab 的功能：


    - *Pandas*: 这是一个用于数据科学的库，提供高性能、易于使用的数据结构，如 series 和 dataframes 用于存储数据。

    - *SymPy*: 这用于符号数学和代数。

    - *NetworkX*: 这是一个用于表示和可视化图和网络的库。

    - *Scikit-image*: 这是一个用于图像处理的库。

    - *Scikit-learn*: 这是一个用于机器学习和人工智能的库。


    除了这些库之外，IPython 还为 Python 解释器提供了一个更好的交互式环境。IPython 的交互式环境可以通过使用 Jupyter Notebook
    的基于 Web 的笔记本进行访问。


    本章的其余部分重点介绍 Jupyter Notebook。


    ## 介绍 Jupyter Notebook


    在本章前面，你学习了运行 Python 语句的各种方法。你在脚本中以及解释器的交互模式中运行了 Python 语句。使用交互模式的主要优点是即时反馈。这种模式的主要缺点是，如果你在输入的语句中犯了任何错误，你必须重写整个语句才能重新执行它。此外，很难将其保存为程序。保存要运行在解释器上的语句的选项可以在菜单的
    File 选项中找到。但是，所有语句及其输出都将以 .py 扩展名的纯文本格式保存。如果有任何图形输出，它会单独显示并且无法与语句一起存储。


    由于解释器交互模式的局限性，我们将使用一个更好的工具在 Web 浏览器中交互式运行 Python 语句。该工具称为 Jupyter Notebook。它是一个服务器程序，可以在
    Web 浏览器中创建交互式笔记本。


    Jupyter Notebook 是一个基于 Web 的笔记本，用于交互式编程各种编程语言，如 Python、Octave、Julia 和 R。它在从事研究领域的人们中很受欢迎。Jupyter
    Notebook 可以在一个文件中保存代码、可视化、输出和富文本。与 Python 自身的交互式提示相比，Jupyter Notebook 的优点是你可以在编辑代码的同时立即看到新的输出，而在
    Python 的交互模式中这是不可能的。另一个优点是，你可以在磁盘上的同一个文件中拥有代码、富文本元素以及代码的输出（可以是图形或富文本格式）。这使得分发变得容易。你可以通过互联网或使用便携式存储设备保存和共享这些笔记本。网上有许多服务可以帮助你在云服务器上存储和执行你的笔记本脚本。


    ## 设置 Jupyter Notebook


    你可以通过在命令提示符下运行以下命令在任何计算机上轻松安装 Jupyter Notebook 服务器程序：


    ```bash

    pip3 install jupyter

    ```


    让我们看看现在如何使用 Jupyter Notebook 编写和执行 Python 语句。在操作系统的命令提示符中运行以下命令以在那里启动 Jupyter
    Notebook 服务器进程：


    ```bash


    \ subplot positions are relative to the first position. The following is an example:\n\
    \n```python\nx = np.arange(3)\nplt.subplots_adjust(wspace=0.3,\n             \
    \       hspace=0.3)\nplt.subplot(2, 2, 1)\nplt.plot(x, -x**2)\nplt.subplot(2,\
    \ 2, 2)\nplt.plot(x, -x**3)\nplt.subplot(2, 2, 3)\nplt.plot(x, -2*x)\nplt.subplot(2,\
    \ 2, 4)\nplt.plot(x, -2**x)\nplt.show()\n```\n\nThe first two arguments passed\
    \ to `plt.subplot()` represent the grid size, and the third argument indicates\

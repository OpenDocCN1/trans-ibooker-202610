    In the previous chapter, you learned about the many routines for creating and
    manipulating Ndarrays in the NumPy library. You will need many of those routines
    throughout this book.


    This chapter is dedicated to exploring the aesthetic aspects of visualizations
    prepared with Matplotlib. You will learn to customize the cosmetic aspects of
    the Matplotlib visualizations. Specifically, we will explore the following topics
    in detail:


    +   - Single-line plots

    +   - Multiline plots

    +   - Grid, axes, and labels

    +   - Colors, lines, and markers

    +   - Subplots

    +   - Object-oriented style

    +   - Working with the text


    After reading this chapter, you will be able to programmatically customize the
    aesthetic aspects of your visualizations to make them more presentable.


    # Single-Line Plots


    When there is only one visualization in a figure that uses the function plot(),
    then it is known as a single-line plot. In this section, you’ll see a few ways
    that you can draw a single-line plot. We have already used the function plot()
    to draw single-line plots. Let’s explore this concept further in detail with a
    few more solid examples.'

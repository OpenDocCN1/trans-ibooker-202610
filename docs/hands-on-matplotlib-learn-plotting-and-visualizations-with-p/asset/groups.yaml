    # CHAPTER 10


    # Working with Colors


    In the previous chapter, you learned how to visualize pie charts and polar charts
    with Matplotlib.


    In this chapter, you will learn how to work with colors. The following are the
    routines you will learn to use in this chapter:


    +   - pcolor()

    +   - pcolormesh()

    +   - colorbar()


    After reading this chapter, we will be able to work with colors in Matplotlib.


    # pcolor()


    The routine pcolor() creates a pseudocolor plot with a rectangular (nonsquare)
    grid. Pseudocolor means the object or image is rendered in colors different than
    those in which it was recorded. Let’s create a new notebook for this chapter,
    as shown here:


    ```

    %matplotlib inline

    import matplotlib.pyplot as plt

    import numpy as np

    ```


    Let’s create a nonsquare matrix and use the routine pcolor() to visualize it,
    as shown here:


    ```

    data = np.random.rand(5, 6)

    plt.pcolor(data)

    plt.show()

    ```'

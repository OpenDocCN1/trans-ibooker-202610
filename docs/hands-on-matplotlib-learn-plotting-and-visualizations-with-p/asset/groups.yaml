    # Installing on Ubuntu/Debian Derivatives


    Debian is a popular distribution. Ubuntu Linux and the Raspberry Pi OS are the
    other popular distributions based on Debian. Python 3 and pip3 come pre-installed
    on all the Debian distributions and derivatives such as Ubuntu or the Raspberry
    Pi OS. So, we do not have to install them separately. I use the Raspberry Pi OS
    on a Raspberry Pi 4B with 8 GB RAM as my Linux computer. Both the major Python
    versions, Python 2 and Python 3, come preinstalled on all the Debian derivatives.
    Their executable files for interpreters are named as python and python3 for Python
    2 and Python 3, respectively. We will use python3 for our demonstrations. To find
    out the versions and locations of the needed binary executable files, run the
    following commands one by one:


    ```

    ```\npython3 -V\npip3 -V\nwhich python3\nwhich pip3\n```

    ```


    Almost all the other popular Linux distributions come with Python pre-installed
    too.'

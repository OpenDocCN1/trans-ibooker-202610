    using a pair of integers of 16 bits (2 bytes). Thus, each sample needs four bytes.
    So, we can compute the total raw memory required for storing the audio data by
    multiplying the sample size by 4. When we visualize audio, we show the value of
    both channels of the sample. Let’s visualize the first 2,000 data points as follows:



    plt.show()

    ```


    图 6-6 显示了输出结果。


    ![](img/124f805c8155c7226d129ebbcc2842f0_102_1.png)


    图 6-6：x 轴上的误差


    你可以按如下方式在两个轴上同时显示误差：


    ```


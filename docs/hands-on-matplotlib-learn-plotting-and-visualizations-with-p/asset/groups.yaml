    # CHAPTER 7


    # Histograms, Contours, and Stream Plots


    In the previous chapter, you learned many ways to create visualizations with lines,
    bar plots, and scatter plots.


    We will continue exploring various visualizations with Matplotlib in this chapter.
    You will learn how to create histograms and contours. You will also learn how
    to plot vectors with stream plots.


    ## Histograms


    Before you learn how to create various types of histograms, you need to learn
    what they are. First, you need to know what frequency tables are. Suppose you
    have a set of members with various values. You can create a table that has various
    buckets of ranges of values in a column. Each bucket must have at least one value.
    Then you can count the number of members that fall into that bucket and note those
    counts against the buckets. Let’s see a simple example. Please create a new notebook
    for this, as shown here:


    ```

    ```python

    %matplotlib inline

    import numpy as np

    import matplotlib.pyplot as plt

    ```

    ```


    Now let’s manually create a dataset and define the number of buckets equal to
    the cardinality (number of distinct elements) of the set.


    ```

    ```python

    x = [1, 3, 5, 1, 2, 4, 4, 2, 5, 4, 3, 1, 2]

    n_bins = 5

    ```

    ```


    You can show the output with the following code:


    ```

    plt.hist(x, bins=n_bins)

    plt.show()

    ```


    Figure 7-1 shows the output.


    ![](img/124f805c8155c7226d129ebbcc2842f0_110_0.png)


    Figure 7-1. Simple histogram


    Normal (or Gaussian) distribution is a type of continuous probability distribution.
    It is usually a bell-shaped curve. Let’s create a histogram with a normal distribution
    curve. To create the data, we will use a NumPy routine. Let’s draw a histogram
    of random data with normal distribution as follows:


    ```

    np.random.seed(31415)

    n_points = 10000

    n_bins = 15

    x = np.random.randn(n_points)

    plt.hist(x, bins=n_bins)

    plt.show()

    ```


    # Reading Data from a CSV


    As mentioned earlier, a CSV file contains values separated by commas. You can
    use the versatile function read_csv() in Pandas to read a CSV file on the Web
    or on the local/networked disk. The following are the contents of a CSV file that
    we will use in this demonstration:


    ```

    rank,discipline,phd,service,sex,salary

    Prof,B,56,49,Male,186960

    Prof,A,12,6,Male,93000

    Prof,A,23,20,Male,110515

    Prof,A,40,31,Male,131205

    Prof,B,20,18,Male,104800

    Prof,A,20,20,Male,122400

    AssocProf,A,20,17,Male,81285

    ```


    The first row is the header row. Most CSV files will have a header row, although
    it is not required. As you can see, the values are separated by commas. This is
    a common format of CSV files. Depending on the system and application, you can
    use a variety of separators like a space, a semicolon (;), or a pipe (|). Also,
    CSV files can use a fixed number of characters for storing data in columns. In
    this example, as discussed, we are using one of the most common CSV formats for
    storing data.


    Let’s learn how to read data from such files with Pandas. Create a new notebook
    for this chapter.


    Import the Pandas library as follows:


    ```

    import pandas as pd

    ```


    Let’s read a CSV file located on the Web as follows:


    ```

    df1 = pd.read_csv("http://rcs.bu.edu/examples/python/data_analysis/

    Salaries.csv")

    print(df1)

    ```


    You can also read a CSV stored on the local disk as follows:


    ```

    df2 = pd.read_csv("Salaries.csv")

    print(df2)

    ```'

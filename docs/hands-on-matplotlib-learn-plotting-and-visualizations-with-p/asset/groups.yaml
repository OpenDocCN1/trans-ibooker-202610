    In addition to these libraries, IPython provides a better interactive environment
    for the Python interpreter. IPython’s interactive environment can be accessed
    through web-based notebooks using Jupyter Notebook.


    The rest of the chapter focuses on Jupyter Notebook.


    ## Introducing Jupyter Notebook


    Earlier in this chapter, you learned various ways to run Python statements. You
    ran Python statements in a script and in the interpreter’s interactive mode. The
    main advantage of using interactive mode is the immediate feedback. The main disadvantage
    of this mode is that if you make any mistakes in the statements you’re typing
    in, you must write the entire statement again to re-execute it. Also, it is difficult
    to save it as a program. The option for saving the statements to run on the interpreter
    can be found in the File option of the menu. However, all the statements and their
    outputs will be saved in plain-text format with the .py extension. If there is
    any graphical output, it is displayed separately and cannot be stored with the
    statements.


    Because of the limitations of interactive mode in the interpreter, we will use
    a better tool for running the Python statements interactively in the web browser.
    The tool is known as Jupyter Notebook. It is a server program that can create
    interactive notebooks in a web browser.


    Jupyter Notebook is a web-based notebook that is used for interactive programming
    of various programming languages like Python, Octave, Julia, and R. It is popular
    with people who are working in research domains. Jupyter Notebook can save code,
    visualizations, output, and rich text in a single file. The advantage of Jupyter
    Notebook over Python’s own interactive prompt is that you can edit the code and
    see the new output instantly, which is not possible in Python’s interactive mode.
    Another advantage is that you have the code, rich-text elements, and output of
    the code (which can be in graphical or rich-text format) in the same file on disk.
    This makes it easy to distribute. You can save and share these notebooks over
    the Internet or using the portable storage equipment. There are many services
    online that help to store and execute your notebook scripts on cloud servers.


    ## Setting Up Jupyter Notebook


    You can easily install the Jupyter Notebook server program on any computer by
    running the following command at the command prompt:


    ```bash

    pip3 install jupyter

    ```


    Let’s see how you can use Jupyter Notebook for writing and executing Python statements
    now. Run the following command in the command prompt of the OS to launch the Jupyter
    Notebook server process there:


    ```bash

    jupyter notebook

    ```


    The Jupyter Notebook server process will be launched, and the command prompt window
    shows a server log, as in Figure 1-13.


    ![](img/124f805c8155c7226d129ebbcc2842f0_33_0.png)


    **Figure 1-13.** *Launching a new Jupyter Notebook process*


    Also, it launches a web page in the default browser of the OS. If the browser
    window is already open, then it launches the page in a new tab of the same browser
    window. Another way to open the page (in case you close this browser window running
    Jupyter Notebook) is to visit `http://localhost:8888/` in your browser. It displays
    the page shown in Figure 1-14.


    ![](img/124f805c8155c7226d129ebbcc2842f0_34_0.png)


    **Figure 1-14.** *Logging in with a token*


    The following lines of text are the server logs.


    To access the notebook, open this file in a browser:


    ```text

    file:///C:/Users/Ashwin/AppData/Roaming/jupyter/runtime/nbserver-8420-open.html

    ```


    Or copy and paste one of these URLs:


    ```text

    http://localhost:8888/?token=e4a4fab0d8c22cd01b6530d5daced19d32d7e0c3a56f925c

    http://127.0.0.1:8888/?token=e4a4fab0d8c22cd01b6530d5daced19d32d7e0c3a56f925c

    ```


    In the previous log, you can see a couple of URLs. They refer to the same page
    (localhost and 127.0.0.1 are the same hosts). Either you can directly copy and
    paste any of these URLs directly in the address bar of the browser tab and open
    the Jupyter Notebook home page or you can visit http://localhost:8888/ as discussed
    earlier and then paste the token in the server log (in our case it is e4a4fab0d8c22cd01b6530d5daced19d32d7e0c3a56f925c)
    and log in. This will take you to the same home page.


    Note that every instance of the Jupyter Notebook server will have its own token,
    so the token shown in the book will not work with your notebook. The token is
    valid only for that server process.


    So, if you follow any one of the routes explained earlier, you will see a home

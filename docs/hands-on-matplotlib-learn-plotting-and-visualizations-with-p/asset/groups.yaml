    http://127.0.0.1:8888/?token=e4a4fab0d8c22cd01b6530d5daced19d32d7e0c3a56f925c

    ```


    在之前的日志中，你可以看到几个 URL。它们引用的是同一页面（localhost 和 127.0.0.1 是相同的 hosts）。你可以直接复制并粘贴这些
    URL 中的任何一个到浏览器标签的地址栏中并打开 Jupyter Notebook 主页，或者你可以访问 http://localhost:8888/ 如前所述，然后粘贴服务器日志中的
    token（在我们的例子中是 e4a4fab0d8c22cd01b6530d5daced19d32d7e0c3a56f925c）并登录。这将带你到同一个主页。



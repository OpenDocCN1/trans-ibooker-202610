    它还在操作系统的默认浏览器中启动一个网页。如果浏览器窗口已打开，则它将在同一浏览器窗口的新标签页中启动页面。另一种打开页面的方法（以防你关闭正在运行 Jupyter
    Notebook 的此浏览器窗口）是在浏览器中访问 `http://localhost:8888/`。它显示如图 1-14 所示的页面。


    ![](img/124f805c8155c7226d129ebbcc2842f0_34_0.png)


    **Figure 1-14.** *Logging in with a token*


    以下是服务器日志的文本。


    要访问笔记本，请在浏览器中打开此文件：


    ```text

    file:///C:/Users/Ashwin/AppData/Roaming/jupyter/runtime/nbserver-8420-open.html


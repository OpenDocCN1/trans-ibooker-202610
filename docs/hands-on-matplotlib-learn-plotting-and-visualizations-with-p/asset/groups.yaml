    ```

    !pip3 install xlrd

    ```


    Now let’s read the Excel file stored on the disk, as follows:


    ```

    excel_file = ''test.xlsx''

    df1 = pd.read_excel(excel_file)

    ```


    Here (and in the earlier example too), the file is stored in the same directory
    as the notebook file. If you need to read the file in any other location, you

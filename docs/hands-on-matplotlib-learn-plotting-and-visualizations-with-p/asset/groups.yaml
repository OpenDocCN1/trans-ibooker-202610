    # CHAPTER 1


    # Introduction to Python 3


    I welcome you all to the exciting journey of data visualization with Matplotlib
    and related libraries such as NumPy, Pandas, and Seaborn.


    This chapter covers the basics of the Python programming language including its
    history, installation, and applications. You will be writing a few simple and
    introductory Python 3 programs and be learning how to execute them on various
    OS platforms.


    Then, we will start exploring the scientific Python ecosystem. We will briefly
    discuss the member libraries of the scientific Python ecosystem, and toward the
    end, we will explore Jupyter Notebook so we can use it throughout the rest of
    the book.


    Specifically, the following are the topics covered in this chapter:


    +   - Python programming language

    +   - Python installation on various platforms

    +   - Python modes

    +   - Python IDEs

    +   - Scientific Python ecosystem

    +   - Overview and setup of Jupyter Notebook

    +   - Running code in Jupyter Notebook

    +   - Anaconda


    After reading this chapter, you will be comfortable with the installation and
    the basic usage of the Python 3 programming language in various modes on various
    platforms.'
  - '[PAGE 16]


    # Introducing the Python 3 Programming Language


    Python 3 is a general-purpose, high-level, and interpreted programming language.
    In this section, we will discuss the Python programming language and its philosophy.


    # History of the Python Programming Language


    Python is a successor to the ABC programming language, which itself was inspired
    by the ALGOL 68 and SETL programming languages. Python was created by Guido van
    Rossum as a side project during vacations in the late 1980s while he was working
    at Centrum Wiskunde & Informatica (English: “National Research Institute for Mathematics
    and Computer Science”) in the Netherlands. Van Rossum was born and raised in the
    Netherlands. He obtained a master’s degree in math and computer science from the
    University of Amsterdam. He worked for Google and Dropbox and retired after that.
    However, in November 2020, he joined Microsoft.


    Since the initial release of the Python programming language till July 2018, Guido
    has been the lead developer and benevolent dictator for life (BDFL) for this project.
    He worked on the steering committee for Python through 2019, but in 2020, he withdrew
    his nomination from reelection to the steering committee.


    The following are the important milestones in Python’s release timeline:


    +   - *February 1991*: Van Rossum published the code (labeled version 0.9.0) to
    alt.sources.

    +   - *January 1994*: Version 1.0 was released.

    +   - *October 2000*: Python 2.0 was released.

    +   - *December 2006*: Python 3.0 was released.

    +   - *December 2019*: Python 2.x was officially retired and is no longer supported
    by Python Software Foundation.


    As you can see, Python 2.x versions are no longer supported, as Python 2 is retired.
    Python 3 is not backward compatible with Python 2. Python 3 is the latest and
    supported version of the Python programming language. So, we will use Python 3
    programming throughout the book to demonstrate the concepts covered. Unless explicitly
    mentioned, Python means Python 3 throughout this book.'

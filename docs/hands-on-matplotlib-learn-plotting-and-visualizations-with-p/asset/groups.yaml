  - '[PAGE 17]


    # Python Enhancement Proposals


    To steer the development, maintenance, and support of Python, the Python leadership
    came up with the concept of *Python enhancement proposals* (PEPs). They are the
    primary mechanism for suggesting new features and fixing issues in the Python
    project. You can read more about the PEPs at the following URLs:


    ```

    https://www.python.org/dev/peps/

    https://www.python.org/dev/peps/pep-0001/

    ```


    # Philosophy of the Python Programming Language


    The philosophy of Python is detailed in PEP20. It is known as the Zen of Python
    and is at https://www.python.org/dev/peps/pep-0020/. The following are the points
    from that PEP. A few are funny.


    +   - Beautiful is better than ugly.

    +   - Explicit is better than implicit.

    +   - Simple is better than complex.

    +   - Complex is better than complicated.

    +   - Flat is better than nested.

    +   - Sparse is better than dense.

    +   - Readability counts.

    +   - Special cases aren’t special enough to break the rules.

    +     - Although practicality beats purity.

    +   - Errors should never pass silently.

    +     - Unless explicitly silenced.

    +   - In the face of ambiguity, refuse the temptation to guess.

    +   - There should be one—and preferably only one—obvious way to do it.

    +     - Although that way may not be obvious at first unless you’re Dutch.'
  - '[PAGE 18]


    +   - Now is better than never.

    +   - Although never is often better than *right now*.

    +   - If the implementation is hard to explain, it’s a bad idea.

    +   - If the implementation is easy to explain, it may be a good idea.

    +   - Namespaces are one honking great idea—let’s do more of those!


    These are the general philosophical guidelines that continue to influence the
    development of the Python programming language.


    # Applications of Python


    As you have learned, Python is a general-purpose programming language; it has
    numerous applications in the following areas:


    +   - Web development

    +   - GUI development

    +   - Scientific and numerical computing

    +   - Software development

    +   - System administration


    You can read case studies of Python at https://www.python.org/success-stories/.


    # Installing Python on Various Platforms


    A Python *implementation* is a program (the actual binary executable of the interpreter
    of Python) that supports the execution of programs written in the Python programming
    language. The original implementation created by Guido van Russom is known as
    *CPython* and serves as the reference implementation. Throughout the book, we
    will be using CPython. It is available on the Python website, and you will learn
    how to install it on the Windows OS in this section. I prefer to write Python
    programs on a Windows computer or a Raspberry Pi computer with the Raspberry Pi
    OS. You can find the list of alternative Python implementations at https://www.python.org/download/alternatives/.'
  - '[PAGE 19]


    I think now is a good time to discuss various Python distributions. You saw that
    the actual interpreter program for Python is known as an *implementation*. When
    it is bundled with a few useful things such as an integrated development environment
    (IDE), tools, and libraries, it is known as a *distribution*. You can find the
    list of Python distributions at https://wiki.python.org/moin/PythonDistributions.

    Now, let’s look at how to install Python on both platforms.


    # Installing on a Windows Computer


    Visit the Python 3 download page located at https://www.python.org/downloads/
    and download the setup file of Python 3 for your computer. The page will automatically
    detect the operating system on your computer and show the appropriate downloadable
    file, as shown in Figure 1-1.


    ![](img/124f805c8155c7226d129ebbcc2842f0_19_0.png)


    Figure 1-1. Python project home page with download options


    Run the setup file to install Python 3. During installation, select the check
    box related to adding Python 3 to the PATH variable (Figure 1-2).'

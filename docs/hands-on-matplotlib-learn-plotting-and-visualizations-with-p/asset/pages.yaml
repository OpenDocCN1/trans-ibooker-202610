  md: '+   - *SciPy*: This library has many routines for scientific computations.

    +   - *Matplotlib*: This is a library for visualization. Its pyplot module has
    routines for Matlab-style visualizations.


    Together, all these components provide functionality like Matlab:


    *Pandas*: This is a library for data science and provides high-performance, easy-to-use
    data structures like the series and dataframes for storing data.


    *SymPy*: This is for symbolic mathematics and algebra.


    *NetworkX*: This is a library for representing and visualizing graphs and networks.


    *Scikit-image*: This is a library for image processing.


    *Scikit-learn*: This is a library for machine learning and artificial intelligence.


    In addition to these libraries, IPython provides a better interactive environment
    for the Python interpreter. IPython’s interactive environment can be accessed
    through web-based notebooks using Jupyter Notebook.


    The rest of the chapter focuses on Jupyter Notebook.


    # Introducing Jupyter Notebook


    Earlier in this chapter, you learned various ways to run Python statements. You
    ran Python statements in a script and in the interpreter’s interactive mode. The
    main advantage of using interactive mode is the immediate feedback. The main disadvantage
    of this mode is that if you make any mistakes in the statements you’re typing
    in, you must write the entire statement again to re-execute it. Also, it is difficult
    to save it as a program. The option for saving the statements to run on the interpreter
    can be found in the File option of the menu. However, all the statements and their
    outputs will be saved in plain-text format with the .py extension. If there is
    any graphical output, it is displayed separately and cannot be stored with the
    statements.


    Because of the limitations of interactive mode in the interpreter, we will use
    a better tool for running the Python statements interactively in the web browser.
    The tool is'

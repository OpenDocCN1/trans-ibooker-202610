  md: "# Dataframe in Pandas\n\nA dataframe is a two-dimensional labeled data structure\
    \ with columns that can be different datatypes. You can create dataframes from\
    \ series, Ndarrys, lists, and dictionaries.\n\nDataframes have labels, which are\
    \ collectively called an *index*. You can easily view and manipulate the data\
    \ in the dataframes. The data is stored in a rectangular grid format in dataframes.\n\
    \nYou can create a dataframe from a list as follows. The following is a dictionary:\n\
    \n```\ndata = {'city': ['Delhi', 'Delhi', 'Delhi',\n    'Bangalore', 'Bangalore',\

    The audio data is retrieved and stored in the NumPy, as you have seen. It is stored
    in a 2D matrix. Suppose that there are N data points (also known as *sample points*)
    for the audio data; then the size of the NumPy array is N×2. As you can see, the
    audio has two channels, left and right. So, each channel is stored in a separate
    array of size N, and thus we have N×2. This is known as *stereo audio*. In this
    example, we have 2,601,617 points (samples). Each point or sample is represented
    using a pair of integers of 16 bits (2 bytes). Thus, each sample needs four bytes.
    So, we can compute the total raw memory required for storing the audio data by
    multiplying the sample size by 4. When we visualize audio, we show the value of
    both channels of the sample. Let’s visualize the first 2,000 data points as follows:



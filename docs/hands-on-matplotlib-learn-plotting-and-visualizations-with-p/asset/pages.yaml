  md: "# Handling CSV Files with Python\n\nLet’s learn a few things about the comma-separated\
    \ file (CSV) format. CSV files store data in plain-text format, and the data items\
    \ are either a fixed length or separated by a delimiter such as a comma (,), a\
    \ pipe (|), or a colon(:). The most common CSV format uses a comma as the delimiter,\
    \ and many times the first line is used to store the names of the columns.\n\n\
    In this section, you will learn how to handle a CSV file with Python 3. Python\
    \ 3 comes with a built-in library to handle CSV files. You do not have to install\
    \ anything. You can import the library as follows:\n\n```\nimport csv\n```\n\n\
    You can open the file as a plain-text file in read mode as follows:\n\n```\nfile\
    \ = open('test.csv', 'r')\nprint(file)\n```\n\nOnce you open the file, you can\
    \ pass the file handle to the routine csv.reader() as follows:\n\n```\ncsvfile\
    \ = csv.reader(file, delimiter=',')\nprint(csvfile)\n```\n\nThis prints the value\
    \ of the object as follows:\n\n```\n<_csv.reader object at 0x0590AC68>\n```\n\n\
    You can retrieve the data line by line as follows:\n\n```\nfor row in csvfile:\n\
    \    print(row)\n```\n\nThis produces the following output:\n\n```\n['Banana',\
    \ 'Yellow', '250']\n['Orange', 'Orange', '200']\n['Grapes', 'Green', '400']\n\
    ['Tomato', 'Red', '100']\n['Spinach', 'Green', '40']\n['Potatoes', 'Gray', '400']\n\
    ```"
  merge: -1
  img_proc: true

- pgno: 10
  md: '# About the Author


    **Ashwin Pajankar** earned a Master of Technology in computer science engineering
    from IIIT Hyderabad and has more than 25 years of experience in the area of programming.
    He started his journey in programming and electronics at the tender age of 7 with
    the BASIC programming language and is now proficient in Assembly programming,
    C, C++, Java, shell scripting, and Python. His other technical expertise includes
    single-board computers such as the Raspberry Pi and Banana Pro, microcontroller
    boards such as the Arduino, and embedded boards such as the BBC Micro Bit.


    He is currently a freelance online instructor teaching programming to more than
    70,000 professionals. He also regularly conducts live programming bootcamps for
    software professionals. His growing YouTube channel has an audience of more than
    10,000 subscribers. He has published more than 15 books on programming and electronics.


    In addition to his technology work, he volunteers for many social causes. He has
    won several awards at his university and past workplaces for his community service.
    He has also participated in many industry–institute linkage programs, connecting
    his past employers with his alma maters. During the COVID-19 pandemic (which was
    unfolding at the time of writing of this book), he participated in and led many
    initiatives to distribute essential supplies and medicine to needy people in his
    local community.'
  merge: -1
  img_proc: true

    # Fetching the Pandemic Data Programmatically


    In this section, you will learn how to fetch both datasets (Johns Hopkins and
    Worldometers) using Python programs. To do that, you need to install a library
    for Python. The library’s home page is located at https://ahmednafies.github.io/covid/,
    and the PyPI page is https://pypi.org/project/covid/. Create a new notebook for
    this chapter using Jupyter Notebook. You can easily install the library with the
    following command in the notebook:


    ```

    ```python

    !pip3 install covid

    ```

    ```


    You can import the library to a notebook or a Python script/program as follows:


    ```

    ```python

    from covid import Covid

    ```

    ```'

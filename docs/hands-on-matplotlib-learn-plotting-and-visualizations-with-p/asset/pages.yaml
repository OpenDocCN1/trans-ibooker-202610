    # Scatter Plot


    You can also visualize your data with scatter plots. You will usually visualize
    a set of two variables with a scatter plot. One variable is assigned to the x-axis,
    and another is assigned to the y-axis. Then you draw a point for the values of
    x-y pairs. The size of x and y must be same (they are always one-dimensional arrays).
    You can show additional variables by manipulating the colors and sizes of the
    points. In that case, the sizes of the one-dimensional arrays representing x,
    y, the color, and the size must be the same.


    In the following example, we are assigning random x- and y-axes values and colors
    to 1,000 points. All points are of size 20.


    ```

    N = 1000

    x = np.random.rand(N)

    y = np.random.rand(N)

    colors = np.random.rand(N)

    size = (20)

    plt.scatter(x, y, s=size, c=colors, alpha=1)

    plt.show()

    ```'

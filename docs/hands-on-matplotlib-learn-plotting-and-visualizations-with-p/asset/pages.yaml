    # Error Bars


    You can also use visualizations to show error in data. When there is a possibility
    of errors in the observed data, you usually want to mention it in the observation.
    You would say something like “there’s a 96 percent confidence interval.” This
    means that there is a possibility of 4 percent error in the given data. This gives
    people a general idea about the precision of the quantity. When you want to represent
    this confidence (or lack thereof), you can use error bars.


    You have to use the function errorbar() for this. You can create an Ndaray or
    list to store the error data. We can either have real-life data or simulate it
    as follows:


    ```

    x = np.linspace (0, 2 * np.pi, 100)

    y = np.sin(x)

    ye = np.random.rand(len(x))/10

    plt.errorbar(x, y, yerr = ye)

    plt.show()

    ```'

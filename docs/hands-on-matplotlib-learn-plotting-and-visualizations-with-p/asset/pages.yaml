  md: 'Copy the following data into your computer’s clipboard by selecting it and
    pressing the Ctrl+C buttons on the keyboard.


    | A | B | C |

    |---|---|---|

    | x | 1 | 2 | a |

    | y | 2 | 3 | b |

    | z | 3 | 4 | c |


    You can load it into a Pandas dataframe using the following code:


    ```

    df = pd.read_clipboard()

    ```


    You can also copy data onto the clipboard programmatically as follows:


    ```

    import numpy as np

    df = pd.DataFrame(np.random.randn(5, 3))

    df.to_clipboard()

    ```


    You can see this data either by reading the clipboard programmatically into a
    dataframe as explained earlier or by pasting it with the Ctrl+V command into a
    text editor like Notepad (on Windows) or Leafpad or gedit (on Linux).



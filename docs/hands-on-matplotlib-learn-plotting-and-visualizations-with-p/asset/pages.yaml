  md: '# Reading Data from JSON


    You can read the data of a JSON string into a dataframe as follows. Create a JSON
    string first.


    ```

    ```python

    obj = """

    {"name": "Ashwin",

    "places_lived": ["Nashik", "Hyderabad", "Bangalore"],

    "pet": null,

    "siblings": [{"name": "Scott", "age": 30, "pets": ["Zeus", "Zuko"]},

    {"name": "Katie", "age": 38,

    "pets": ["Sixes", "Stache", "Cisco"]}]

    }

    """

    ```

    ```


    You can print the string as follows:


    ```

    ```python

    print(obj)

    ```

    ```


    You can also check the type of the variable (it is a string in JSON format), as
    shown here:


    ```

    ```python

    print(type(obj))

    ```

    ```


    You can convert this JSON-formatted string to a dictionary as follows:


    ```

    ```python

    import json

    result = json.loads(obj)

    print(result)

    ```

    ```


    Let’s check the data type of the newly created variable, as shown here:


    ```

    ```python

    print(type(result))

    ```

    ```


    This will produce the following result:


    ```

    ```text

    <class ''dict''>

    ```

    ```


    Let’s load the data into a dataframe as follows:


    ```

    ```python

    df1 = pd.DataFrame(result[''siblings''], columns=[''name'', ''age''])

    print(df1)

    ```

    ```'

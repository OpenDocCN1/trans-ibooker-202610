- pgno: 32
  md: 'known as Jupyter Notebook. It is a server program that can create interactive
    notebooks in a web browser.


    Jupyter Notebook is a web-based notebook that is used for interactive programming
    of various programming languages like Python, Octave, Julia, and R. It is popular
    with people who are working in research domains. Jupyter Notebook can save code,
    visualizations, output, and rich text in a single file. The advantage of Jupyter
    Notebook over Python’s own interactive prompt is that you can edit the code and
    see the new output instantly, which is not possible in Python’s interactive mode.
    Another advantage is that you have the code, rich-text elements, and output of
    the code (which can be in graphical or rich-text format) in the same file on disk.
    This makes it easy to distribute. You can save and share these notebooks over
    the Internet or using the portable storage equipment. There are many services
    online that help to store and execute your notebook scripts on cloud servers.


    # Setting Up Jupyter Notebook


    You can easily install the Jupyter Notebook server program on any computer by
    running the following command at the command prompt:


    ```

    ```bash

    pip3 install jupyter

    ```

    ```


    Let’s see how you can use Jupyter Notebook for writing and executing Python statements
    now. Run the following command in the command prompt of the OS to launch the Jupyter
    Notebook server process there:


    ```

    ```bash

    jupyter notebook

    ```

    ```


    The Jupyter Notebook server process will be launched, and the command prompt window
    shows a server log, as in Figure 1-13.'

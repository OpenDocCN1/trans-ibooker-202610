  md: 'You can sort it as follows:


    ```

    sorted = df.sort_values(by=[''confirmed''], ascending=False)

    ```


    Then you have to exclude the data for the world and continents so only the data
    for the individual countries remains.


    ```

    excluded = sorted [ ~sorted.country.isin([''Europe'', ''Asia'', ''South America'',
    ''World'', ''Africa'', ''North America''])]

    ```


    Let’s find out the top ten records.


    ```

    top10 = excluded.head(10)

    print(top10)

    ```


    You can then assign the columns to the individual variables as follows:


    ```

    x = top10.country

    y1 = top10.confirmed

    y2 = top10.active

    y3 = top10.deaths

    y4 = top10.recovered

    ```



- pgno: 200
  md: '# Plain-Text File Handling


    Let’s learn how to read data from and write data to a plain-text file. Python
    comes with the functionality to read and write plain-text files. We have four
    modes for opening a file, as listed here:


    +   - `w`: Write

    +   - `r`: Read

    +   - `a`: Append

    +   - `r+`: Read and write mode


    You can use them (one at a time) as follows:


    ```

    f = open(''testfile.txt'', ''w'')

    print(f)

    ```


    This code opens the testfile.txt file in write mode. If the file does not exist,
    then Python creates this file in the current location on disk. If the file already
    exists, it overwrites the contents of the file. The previous code prints the file
    object as follows:


    ```

    <_io.TextIOWrapper name=''testfile.txt'' mode=''w'' encoding=''cp1252''>

    ```


    Let’s write some data to the file. In this case, the data consists of multicharacter
    strings.


    ```

    f.write(''This is a test string.\n'')

    f.write(''This is the middle line.\n'')

    f.write(''This is the last line.'')

    ```


    You can close the file object (also called the *file handle*) as follows:


    ```

    f.close()

    ```


    You know that opening a file again in write mode will overwrite its data. So,
    this time, let’s open the same file in append mode as follows:


    ```

    f = open(''testfile.txt'', ''a'')

    f.write(''\nThis is the appended line.'')

    f.close()

    ```'

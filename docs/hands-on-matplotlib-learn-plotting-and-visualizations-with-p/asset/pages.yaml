  md: '# Slicing Ndarrays


    Let’s see examples of slicing operations on Ndarrays. You can extract a part of
    an Ndarray with slicing using indices as follows:


    ```

    a1 = np.array([1, 2, 3, 4, 5, 6, 7])

    a1[1:5]

    ```


    This code will display the elements from the second position to the sixth position
    (you know that the 0 is the starting index) as follows:


    ```

    array([2, 3, 4, 5])

    ```


    You can show the elements from the fourth position as follows:


    ```

    a1[3:]

    ```


    The output is as follows:


    ```

    array([4, 5, 6, 7])

    ```


    You can also show all the elements up to a particular index (excluding the element
    at that index) as follows:


    ```

    a1[:3]

    ```


    The output is as follows:


    ```

    array([1, 2, 3])

    ```


    You saw the use of negative indices. We can use them for slicing as follows:


    ```

    a1[-4:-1]

    ```


    The output is as follows:


    ```

    array([4, 5, 6])

    ```


    You have been slicing the data with a step size of 1. This means you are retrieving
    the continuous elements in the resultset. You can also change the step size as
    follows:


    ```

    a1[1:6:2]

    ```'

    # Audio Processing


    The Fourier transform converts the data represented as waves in the time domain
    into the frequency domain. So, when you compute the Fourier transform and visualize
    it, you are seeing the representation in the frequency domain.


    The fast Fourier transform (FFT) is an efficient method of computing a Fourier
    transform of the waveform data. FFT reduces the number of computations, which
    is why it is speedy; that’s why it is known as a fast Fourier transform. Let’s
    compute the fast Fourier transform of the audio signal as follows:


    ```

    import scipy.fftpack

    datafft = scipy.fftpack.fft(data)

    fftabs = abs(datafft)

    print(fftabs)

    ```'

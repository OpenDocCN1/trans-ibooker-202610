  md: 'You can visually show the information of a frequency distribution using bars
    and lines. If you use bars, then it is known as a *histogram*. You can use the
    function displot() to visualize the frequency data. Let’s start with dummy univariate
    data.


    ```

    x = np.random.randn(100)

    sns.displot(x)

    plt.show()

    ```


    Figure 17-8 shows the output.


    ![](img/124f805c8155c7226d129ebbcc2842f0_259_0.png)


    *Figure 17-8. Histogram*


    You can also make it explicit that you need a histogram in the output as follows:


    ```

    sns.displot(x, kind=''hist'')

    plt.show()

    ```


    A histogram is the default kind of graph. You can also show a Gaussian kernel
    density estimation (KDE) as follows:


    ```

    sns.displot(x, kind=''kde'')

    plt.show()

    ```'

  md: '# Series in Pandas


    A series is a one-dimensional array with labels. It can hold data of any type.
    The labels are collectively known as the *index*.


    You can create a series as follows:


    ```

    ```python

    s1 = pd.Series([3, 2, 1, 75, -3.14])

    ```

    ```


    You can check its datatypes as follows:


    ```

    ```python

    type(s1)

    ```

    ```


    The following is the output:


    ```

    ```text

    <class ''pandas.core.series.Series''>

    ```

    ```


    You can see the values and index associated with the data as follows:


    ```

    ```python

    print(s1)

    ```

    ```


    The following is the output:


    ```

    ```text

    0     3.00

    1     2.00

    2     1.00

    3    75.00

    4    -3.14

    dtype: float64

    ```

    ```


    You can explicitly mention the datatype as follows:


    ```

    ```python

    s2 = pd.Series([3, 2, 1, 75, -3.14], dtype=np.float32)

    print(s2)

    ```

    ```


    You can pass a list as an argument to the constructor function to create a series,
    as follows:


    ```

    ```python

    x = [3, 2, 1, 75, -3.14]

    s3 = pd.Series(x)

    ```

    ```'

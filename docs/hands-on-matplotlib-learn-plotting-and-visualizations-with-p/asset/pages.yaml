- pgno: 15
  md: '# CHAPTER 1


    # Introduction to Python 3


    I welcome you all to the exciting journey of data visualization with Matplotlib
    and related libraries such as NumPy, Pandas, and Seaborn.


    This chapter covers the basics of the Python programming language including its
    history, installation, and applications. You will be writing a few simple and
    introductory Python 3 programs and be learning how to execute them on various
    OS platforms.


    Then, we will start exploring the scientific Python ecosystem. We will briefly
    discuss the member libraries of the scientific Python ecosystem, and toward the
    end, we will explore Jupyter Notebook so we can use it throughout the rest of
    the book.


    Specifically, the following are the topics covered in this chapter:


    +   - Python programming language

    +   - Python installation on various platforms

    +   - Python modes

    +   - Python IDEs

    +   - Scientific Python ecosystem

    +   - Overview and setup of Jupyter Notebook

    +   - Running code in Jupyter Notebook

    +   - Anaconda


    After reading this chapter, you will be comfortable with the installation and
    the basic usage of the Python 3 programming language in various modes on various
    platforms.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Introducing the Python 3 Programming Language


    Python 3 is a general-purpose, high-level, and interpreted programming language.
    In this section, we will discuss the Python programming language and its philosophy.


    # History of the Python Programming Language


    Python is a successor to the ABC programming language, which itself was inspired
    by the ALGOL 68 and SETL programming languages. Python was created by Guido van
    Rossum as a side project during vacations in the late 1980s while he was working
    at Centrum Wiskunde & Informatica (English: “National Research Institute for Mathematics
    and Computer Science”) in the Netherlands. Van Rossum was born and raised in the
    Netherlands. He obtained a master’s degree in math and computer science from the
    University of Amsterdam. He worked for Google and Dropbox and retired after that.
    However, in November 2020, he joined Microsoft.


    Since the initial release of the Python programming language till July 2018, Guido
    has been the lead developer and benevolent dictator for life (BDFL) for this project.
    He worked on the steering committee for Python through 2019, but in 2020, he withdrew
    his nomination from reelection to the steering committee.


    The following are the important milestones in Python’s release timeline:


    +   - *February 1991*: Van Rossum published the code (labeled version 0.9.0) to
    alt.sources.

    +   - *January 1994*: Version 1.0 was released.

    +   - *October 2000*: Python 2.0 was released.

    +   - *December 2006*: Python 3.0 was released.

    +   - *December 2019*: Python 2.x was officially retired and is no longer supported
    by Python Software Foundation.


    As you can see, Python 2.x versions are no longer supported, as Python 2 is retired.
    Python 3 is not backward compatible with Python 2. Python 3 is the latest and
    supported version of the Python programming language. So, we will use Python 3
    programming throughout the book to demonstrate the concepts covered. Unless explicitly
    mentioned, Python means Python 3 throughout this book.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Python Enhancement Proposals


    To steer the development, maintenance, and support of Python, the Python leadership
    came up with the concept of *Python enhancement proposals* (PEPs). They are the
    primary mechanism for suggesting new features and fixing issues in the Python
    project. You can read more about the PEPs at the following URLs:


    ```

    https://www.python.org/dev/peps/

    https://www.python.org/dev/peps/pep-0001/

    ```


    # Philosophy of the Python Programming Language


    The philosophy of Python is detailed in PEP20. It is known as the Zen of Python
    and is at https://www.python.org/dev/peps/pep-0020/. The following are the points
    from that PEP. A few are funny.


    +   - Beautiful is better than ugly.

    +   - Explicit is better than implicit.

    +   - Simple is better than complex.

    +   - Complex is better than complicated.

    +   - Flat is better than nested.

    +   - Sparse is better than dense.

    +   - Readability counts.

    +   - Special cases aren’t special enough to break the rules.

    +     - Although practicality beats purity.

    +   - Errors should never pass silently.

    +     - Unless explicitly silenced.

    +   - In the face of ambiguity, refuse the temptation to guess.

    +   - There should be one—and preferably only one—obvious way to do it.

    +     - Although that way may not be obvious at first unless you’re Dutch.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   - Now is better than never.

    +   - Although never is often better than *right now*.

    +   - If the implementation is hard to explain, it’s a bad idea.

    +   - If the implementation is easy to explain, it may be a good idea.

    +   - Namespaces are one honking great idea—let’s do more of those!


    These are the general philosophical guidelines that continue to influence the
    development of the Python programming language.


    # Applications of Python


    As you have learned, Python is a general-purpose programming language; it has
    numerous applications in the following areas:


    +   - Web development

    +   - GUI development

    +   - Scientific and numerical computing

    +   - Software development

    +   - System administration


    You can read case studies of Python at https://www.python.org/success-stories/.


    # Installing Python on Various Platforms


    A Python *implementation* is a program (the actual binary executable of the interpreter
    of Python) that supports the execution of programs written in the Python programming
    language. The original implementation created by Guido van Russom is known as
    *CPython* and serves as the reference implementation. Throughout the book, we
    will be using CPython. It is available on the Python website, and you will learn
    how to install it on the Windows OS in this section. I prefer to write Python
    programs on a Windows computer or a Raspberry Pi computer with the Raspberry Pi
    OS. You can find the list of alternative Python implementations at https://www.python.org/download/alternatives/.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'I think now is a good time to discuss various Python distributions. You saw
    that the actual interpreter program for Python is known as an *implementation*.
    When it is bundled with a few useful things such as an integrated development
    environment (IDE), tools, and libraries, it is known as a *distribution*. You
    can find the list of Python distributions at https://wiki.python.org/moin/PythonDistributions.

    Now, let’s look at how to install Python on both platforms.


    # Installing on a Windows Computer


    Visit the Python 3 download page located at https://www.python.org/downloads/
    and download the setup file of Python 3 for your computer. The page will automatically
    detect the operating system on your computer and show the appropriate downloadable
    file, as shown in Figure 1-1.


    ![](img/124f805c8155c7226d129ebbcc2842f0_19_0.png)


    Figure 1-1. Python project home page with download options


    Run the setup file to install Python 3. During installation, select the check
    box related to adding Python 3 to the PATH variable (Figure 1-2).'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/124f805c8155c7226d129ebbcc2842f0_20_0.png)


    *Figure 1-2.  Python installation wizard*


    Also, choose the “Customize installation” option. That will take you to more options,
    as shown in Figure 1-3.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/124f805c8155c7226d129ebbcc2842f0_21_0.png)


    # Figure 1-3. Python installation options


    Select all the boxes and click the Next button to continue the setup. Complete
    the setup. The name of the binary executable program for Python is python on Windows.
    Once the installation completes, run the following command at the Windows command
    prompt, cmd:


    ```

    python -V

    ```


    This will return the version of Python 3 as follows:


    ```

    Python 3.8.1

    ```


    You can also check the version of pip as follows:


    ```

    pip3 -V

    ```


    A recursive acronym, pip stands for “Pip installs Python” or “Pip installs packages.”
    It is a package manager for the Python programming language. You can install the
    other needed Python libraries for our demonstrations using the pip utility.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'To find out the exact location of Python, you can run the where command as
    follows:


    ```

    ```\nwhere python\n```

    ```


    This returns the following result:


    ```

    ```\nC:\\Users\\Ashwin\\AppData\\Local\\Programs\\Python\\Python38-32\\python.exe\n```

    ```


    Similarly, you can find out the location of the pip3 utility by running the following
    command:


    ```

    ```\nwhere pip3\n```

    ```


    We will be using this utility heavily throughout the book to install and manage
    Python 3 libraries on the computer we are working with. The following command
    lists all the installed packages:


    ```

    ```\npip3 list\n```

    ```


    # Installing on Ubuntu/Debian Derivatives


    Debian is a popular distribution. Ubuntu Linux and the Raspberry Pi OS are the
    other popular distributions based on Debian. Python 3 and pip3 come pre-installed
    on all the Debian distributions and derivatives such as Ubuntu or the Raspberry
    Pi OS. So, we do not have to install them separately. I use the Raspberry Pi OS
    on a Raspberry Pi 4B with 8 GB RAM as my Linux computer. Both the major Python

  md: '# Anaconda


    Before we can conclude the chapter, we need to discuss the Python distributions.
    A Python distribution is nothing more than the Python interpreter bundled with
    Python libraries. One such popular distribution is Anaconda. You can download
    and install Anaconda on Linux, Windows, and macOS. Anaconda has many versions.
    One of them is free and meant for individual usage. You can find it at https://www.anaconda.com/products/individual.


    Anaconda comes with an open source package manager that can install packages for
    Python and other programs. It is known as Conda. You can find more information
    about the Conda package manager at https://docs.conda.io/en/latest/.


    If you have already installed Python from Python’s website, I recommend using
    another computer to install Anaconda. Having multiple interpreters and distributions
    of Python can be confusing.



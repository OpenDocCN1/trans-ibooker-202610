  \n图 12.9 – 结果\n\n通过这样做，我们得到一份通过考试的团队成员名单。\n\n## IAM\n\n对 Google Cloud Spanner 的访问通过\
  \ IAM 进行保护。以下是预定义角色的列表，以及每个角色的简短说明：\n\n- **Spanner Admin**：此人对项目中的所有 Cloud Spanner\
  \ 资源拥有完全权限。\n- **Spanner Database Admin**：此人有权列出所有 Cloud Spanner 实例并在创建实例中创建/列出/删除数据库。他们可以授予和撤销对项目中数据库的访问权限，并且他们还可以读取和写入项目中的所有\
  \ Cloud Spanner 数据库。\n- **Spanner Database Reader**：此人有权从 Cloud Spanner 数据库中读取、执行数据库查询以及查看数据库架构。\n\
  - **Spanner Database User**：此人有权读取和写入 Cloud Spanner 数据库、执行数据库上的 SQL 查询，以及查看和更新数据库架构。\n\
  - **Spanner Viewer**：此人有权查看所有 Cloud Spanner 实例并查看所有 Cloud Spanner 数据库。\n- **Restore\
  \ Admin:** 此人有权从备份中恢复数据库。\n- **Backup Admin:** 此人有权 *创建*、*查看*、*更新* 和 *删除* 备份。\n\n\
  ## 配额和限制\n\nCloud Spanner 带有预定义的配额。这些默认配额可以通过 **Navigation** 菜单以及 **IAM & Admin\
  \ | Quotas** 进行更改。从此菜单中，我们可以查看当前配额并请求增加这些限制。我们建议您了解每个服务的限制，因为这可能会影响您的可扩展性。对于 Cloud\
  \ Spanner，我们应该注意以下限制：\n\n- 实例 ID 的长度限制为 2 到 64 个字符。\n- 每个实例的数据库数量限制为 100 个。\n- 数据库\
  \ ID 的长度限制为 2 到 30 个字符。\n- 每个节点的存储限制为 2 TB。\n- 架构大小限制为 10 MB。\n- 架构更改大小限制为 10 MB。\n\
  - 每个数据库的表数量限制为 5,000 个。\n- 表名的长度限制为 1 到 128 个字符。\n- 每个表的列数限制为 1,024 个。\n- 列名的长度限制为\
  \ 1 到 128 个字符。\n- 每个列的数据量限制为 10 MB。\n- 表键中的列数限制为 16 个。\n- 每个数据库的索引数量限制为 10,000 个。\n\
  - 每个表的索引数量限制为 32 个。\n- 索引键中的列数限制为 16 个。\n- 函数调用次数限制为 1,000 次。\n- 每个项目、每个实例配置的节点数限制为\
  \ 25 个。\n\n## 定价\n\nCloud Spanner 按使用的计算容量以及使用的存储和网络带宽收费。我们将被收取以下费用：\n\n- 节点最大数量乘以每小时费率。随着\
  \ Spanner 转向处理单元，这可能是完整节点的一部分（1,000 个处理单元小于 1 个节点）。\n- 我们数据库中 1 个月内的平均数据量。这些价格会根据实例的位置而波动。\n\
  - 某些类型流量的出站网络流量费用。然而，复制或入站流量不收取费用。\n- 备份使用的存储量也按 1 个月计算，并乘以月费率。\n\n> 考试提示\n> 关于\
  \ Cloud Spanner 需要记住的一个重要点是它提供 ACID 事务。如果原子事务涉及两条或更多条信息，则所有信息都会被提交；否则，什么也不会提交。\n\
  \n## Bigtable\n\n名字里就有线索，但 Bigtable 是 GCP 的大数据 NoSQL 数据库服务。Bigtable 延迟低，可以扩展到数十亿行和数千列。它也是为许多\
  \ Google 核心服务提供支持的数据库，例如搜索、分析、地图和 Gmail。这使得 Bigtable 成为分析和实时工作负载的绝佳选择，因为它旨在以低延迟和高吞吐量处理大规模工作负载。\n\
  \n> 考试提示\n> Bigtable 可以支持 PB 级数据，适用于实时访问和分析工作负载。它是物联网（IoT）应用的绝佳选择，这些应用需要频繁的数据摄取或高速交易。\n\
  \n鉴于 Bigtable 的巨大可扩展性，我们将介绍存储模型和架构。当我们讨论 Bigtable 时，我们会提到 HBase。HBase 本质上是 Bigtable\
  \ 架构的开源实现，并遵循相同的设计理念。Bigtable 将其数据存储在表中，这些表存储在键/值映射中。每个表都由行组成，行将描述单个实体。\n\n表还由列组成，列包含每个行的单独值。行由行键索引，并且相互关联的列被分组到列族中。Bigtable\
  \ 仅提供基本操作，例如 *创建、读取、更新* 和 *删除*。这意味着它有一些很好的用例，同时也不适合其他用例。Bigtable 不应用于事务支持——正如我们之前提到的，CloudSQL\
  \ 或 Spanner 更适合 OLTP。\n\n下图显示了 Bigtable 的架构：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_383_0.png)\n\
  \n图 12.10 – Bigtable 架构\n\n在这里，我们可以看到客户端的请求在发送到 Bigtable 节点之前会经过前端服务器。这些节点构成了一个属于\
  \ Bigtable 实例的 Bigtable 集群，该实例充当集群的容器。\n\n集群中的每个节点处理请求的子集。我们可以通过添加更多节点来增加集群可以处理的并发请求数。前面的图表仅显示单个集群，但可以通过添加第二个集群来启用复制。有了第二个集群，我们可以将不同类型的流量发送到特定的集群，当然可用性也会增加。\n\
  \n为了帮助平衡查询的工作负载，Bigtable 被分片为连续行的块。这些被称为 tablets，并以排序字符串表（SSTable）格式存储在 Google 的文件系统\
  \ Colossus 上。SSTable 以基于行键的排序顺序存储不可变的行片段。每个表都将与特定的 Bigtable 节点相关联，并且写入在被确认后立即存储在\
  \ Colossus 共享日志中。我们还应注意，数据永远不会存储在 Bigtable 节点上。然而，这些节点指向存储在 Colossus 中的一组 tablets，这意味着如果\
  \ Bigtable 节点失败，则不会发生数据丢失。\n\n现在我们了解了高层架构，让我们来看一下 Bigtable 的配置。\n\n## Bigtable 配置\n\
  \n在本节中，我们将查看构成 Bigtable 的关键组件。我们将讨论以下内容：\n\n- 实例\n- 集群\n- 节点\n- 架构\n- 复制\n\n## 实例\n\
  \nCloud Bigtable 由实例组成，实例将包含最多四个我们的应用程序可以连接到的集群。每个集群包含节点。我们应该将实例想象成我们集群和节点的容器。我们可以修改集群中的节点数量以及实例中的集群数量。当我们创建实例时，如预期，我们可以选择要部署到的区域和区域，我们还可以选择存储类型，即\
  \ SSD 或 HDD。位置和存储类型都是永久性的选择。\n\n\n\n\n\n## 集群\n\nBigtable 集群代表特定位置的服务。每个集群都属于一个\
  \ Bigtable 实例，并且，正如我们已经提到的，每个实例最多可以有四个集群。当我们的应用程序向实例发送请求时，它会由实例中的一个集群处理。每个集群位于单个区域中，并且实例的集群必须位于唯一的区域中。如果我们的配置意味着我们拥有多个集群，那么\
  \ Bigtable 将自动开始复制我们的数据，通过在每个集群的区域中存储数据的副本并在副本之间同步更新来实现。为了将不同类型的流量彼此隔离，我们可以选择应用程序要连接的集群。\n\
  \n## 节点\n\n生产实例中的每个集群至少有三个节点。节点正如你所期望的那样，是 Bigtable 用于管理我们数据的计算资源。Bigtable 会尝试在所有节点之间均匀分配读写操作，并且在每个节点上存储相等数量的数据。如果\
  \ Bigtable 集群过载，我们可以添加更多节点以提高其性能。同样，我们也可以缩减规模并移除节点。\n\n## 模式\n\n值得注意的是，设计 Bigtable\
  \ 模式与设计关系数据库模式非常不同。没有二级索引，因为每个表只有一个索引。行按行键（唯一的索引）按字典顺序排序，从最低到最高的字节串。如果表中存在两行，一行可能成功更新，而另一行可能失败。因此，我们应避免设计需要跨行原子性的模式。不良的模式设计可能是\
  \ Bigtable 整体性能不佳的原因。\n\n> **考试提示**\n> 模式也可以为**时间序列数据**设计。如果我们想随着发生的时间一起衡量某事，那么我们就是在构建时间序列。Bigtable\
  \ 中的数据以行中无结构的列形式存储，每行都有一个行键。这使得 Bigtable 非常适合时间序列数据。当我们需要考虑时间序列的模式设计模式时，应使用高而窄的表，这意味着每行存储一个事件。这使得查询我们的数据变得更容易。\n\
  \n## 复制\n\n数据的可用性是一个非常大的关注点。Bigtable 复制将我们的数据复制到多个区域或同一区域内的多个区域中，从而提高我们数据的可用性和持久性。当然，要使用复制，我们必须创建一个具有多个集群的实例或向现有实例添加集群。一旦设置完成，Bigtable\
  \ 将立即开始复制，并在实例拥有集群的每个区域中存储我们数据的单独副本。由于这种复制几乎是实时完成的，因此可作为我们数据的一个良好备份。当集群无响应时，Bigtable\
  \ 将执行自动故障转移。\n\n## 应用程序配置文件\n\n如果我们需要实例使用复制，则需要使用**应用程序配置文件**。通过将设置存储在这些应用程序配置文件中，我们可以管理来自应用程序的传入请求并确定\
  \ Bigtable 如何处理它们。每个 Bigtable 实例都将有一个默认的应用程序配置文件，但我们也可以创建自定义配置文件。我们的代码应更新为指定应用程序在连接到实例时要使用的应用程序配置文件。如果我们未指定任何内容，则\
  \ Bigtable 将使用默认配置文件。\n\n应用程序配置文件的配置将影响应用程序如何与使用复制的实例通信。应用程序配置文件中包含**路由策略**。**单集群路由**会将所有请求路由到实例中的单个集群，而**多集群路由**会自动将流量路由到实例中最接近的集群。如果我们创建一个具有一个集群的实例，则默认应用程序配置文件将使用单集群路由。如果我们创建一个具有两个或更多集群的实例，则默认应用程序配置文件将使用多集群路由。\n\
  \n要创建应用程序配置文件，我们必须拥有一个 Bigtable 实例。我们可以从 GCP 控制台创建自定义应用程序配置文件，通过浏览汉堡菜单并进入 **Bigtable**，然后单击我们希望创建应用程序配置文件的实例。最后，浏览左侧窗格中的\
  \ **Application profiles** 选项并单击 **CREATE APPLICATION PROFILE**。\n\n在下面的屏幕截图中，我们正在为名为\
  \ **cloudarchitect** 的实例创建应用程序配置文件：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_387_0.png)\n\
  \n图 12.11 – 应用程序配置文件\n\n然后，我们需要为配置文件提供一个 ID，并在认为必要时输入描述。之后，我们必须选择所需的路由策略：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_387_1.png)\n\
  \n图 12.12 – 应用程序配置文件设置\n\n请注意，我们可以勾选单行事务的复选框。Bigtable 不支持原子更新多于一行行的事务；然而，它可以使用单行事务来完成\
  \ *read-modify-write* 和 *conditional writes* 操作。请注意，此选项仅在使用单集群路由策略时可用，以防止冲突。\n\n\
  ## 数据一致性\n\n需要理解的一个重要方面是，Bigtable 默认是最终一致的，这意味着当我们向集群之一写入更改时，我们将能够从其他集群读取该更改，但只有在复制发生后才能读取。为了克服这一限制，我们可以在启用复制时启用\
  \ **Read-Your-Writes** 一致性。这将确保应用程序不会读取比最近写入更旧的数据。为了为一组应用程序实现 Read-Your-Writes 一致性，我们应在应用程序配置文件中使用单集群路由策略将请求路由到同一集群。然而，这样的缺点是，如果集群变得不可用，则我们需要手动执行故障转移。\n\
  \n## 规划容量\n\n在规划 Bigtable 集群时需要考虑的一个重要方面是吞吐量与延迟之间的权衡。对于延迟敏感的应用程序，Google 建议我们为应用程序的最大\
  \ Bigtable QPS 规划至少 2 倍的容量。这是为了确保 Bigtable 集群的 CPU 使用率低于 50%，从而为前端服务提供低延迟。\n\n>\
  \ **考试提示**\n> 容量规划使我们能够为流量激增或键访问热点提供缓冲，这可能会导致集群中节点之间的流量不平衡。\n\n## 创建 Bigtable 实例和表\n\
  \n让我们看看如何从 GCP 控制台创建 Bigtable 实例：\n\n- 1. 浏览到 **DATABASES | Bigtable**，如下图所示：\n\n\
  # DATABASES\n\n- - Bigtable\n- - Datastore >\n- - Database Migration >\n- - Firestore\
  \ >\n- - Memorystore >\n- - Spanner\n\n图 12.13 – Bigtable\n\n2. 单击 CREATE INSTANCE：\n\
  \n图 12.14 – 创建实例\n\n3. 为我们的实例提供名称和实例 ID 并选择实例类型。另请选择我们所需的存储类型：\n\n# Create an instance\n\
  \nA Cloud Bigtable instance is a container for your clusters. Learn more\n\n# 1\
  \ Name your instance\n\nInstance name *\ncloudarchitect\nFor display purposes only\n\
  \nInstance ID *\ncloudarchitect\nID is permanent\n\nCONTINUE\n\n图 12.15 – 实例配置\n\
  \n4. 提供集群详细信息；即位置和所需的节点数。我们也可以在需要时设置复制。请注意，我们还可以选择存储类型 – SSD 或 HDD。如果我们不更改它，这将默认为\
  \ SSD。单击 Done 以接受集群更改并单击 Create 以完成实例配置：\n\n# Select a cluster ID\n\nID is permanent\n\
  \nCluster ID *\ncloudarchitect-c2\n\n# Select a location\n\nChoice is permanent.\
  \ Determines where cluster data is stored. To reduce latency and increase throughput,\
  \ store your data near the services that need it. Learn more\n\nRegion *\neurope-west2\
  \ (London)\nZone *\nAny\n\n# Allocate nodes\n\nNode count can be updated at any\
  \ time to meet your cluster's need for data throughput, storage, and rows read per\
  \ second. For better instance performance, keep your cluster's CPU utilization under\
  \ the recommended threshold for your app profile routing policy. Contact us if you\
  \ need to increase your node quota. Learn more\n\nNodes *\n3\n\n图 12.16 – 添加集群\n\
  \n一旦我们拥有实例和集群，我们就可以创建表。我们之前提到过，Bigtable 有一个名为 cbt 的命令行工具，使用它创建表非常简单。再次，我们将假设你熟悉此工具。打开\
  \ Cloud Shell 以便我们可以配置 cbt 工具。我们将在第 16 章 Google Cloud Management Options 中更详细地介绍\
  \ cbt 和 Cloud Shell：\n\n- 1. 在创建表之前，运行以下语法以减轻在未来命令行中指定它们的需要：\n\n```\necho project\
  \ = <project ID> ~/.cbt rc\necho instance = <instance ID> >> ~/.cbt rc\n```\n\n\n\
  \n\n\n这里，我们有以下内容：\n\n- `<project ID>` 是我们的 Bigtable 实例关联的项目的 ID。\n- `<instance ID>`\
  \ 是我们实例的 ID。\n\n2. 配置完成后，我们可以使用非常简单的语法创建表：\n\n```\ncbt createtable table001\n```\n\
  \n这里，我们创建了一个名为 `table001` 的表。\n\n## IAM\n\n对 Google Cloud Bigtable 的访问通过 IAM 保护。以下是预定义角色的列表，以及每个角色的简短描述：\n\
  \n- **Bigtable Admin**：此人拥有所有 Bigtable 功能的权限，并且可以在此创建新实例。此角色应由项目管理员使用。\n- **Bigtable\
  \ User**：此人对存储在表中的数据具有只读访问权限。此角色应由应用程序开发人员或服务账号使用。\n- **Bigtable Reader**：此人对存储在表中的数据具有只读访问权限。此角色应由数据科学家使用。\n\
  - **Bigtable Viewer**：此角色应用于授予 Cloud Bigtable 的最小权限集。\n\n## 配额和限制\n\nGoogle Cloud\
  \ Bigtable 带有预定义的配额。这些默认配额可以通过 **Navigation** 菜单以及 **IAM & Admin | Quotas** 进行更改。从此菜单中，我们可以查看当前配额并请求提高这些限制。我们建议您了解每个服务的限制，因为这可能会影响您的可扩展性。对于\
  \ Cloud Bigtable，我们应注意以下限制：\n\n- 每个节点 SSD 存储的限制为 2.5 TB。\n- 每个节点 HDD 存储的限制为 8 TB。\n\
  - 每个实例中的表数量限制为 1,000。\n\n对于 Cloud Bigtable，我们还应注意以下配额：\n\n- 默认情况下，您可以在每个项目中的每个区域最多配置\
  \ 30 个 SSD 或 HDD 节点。\n- 应审查许多操作配额。\n\n## 定价\n\nBigtable 根据多个因素收费：\n\n- 实例类型按每小时、每个节点收费。\n\
  - 存储按每月收费，成本因使用 SSD 或 HDD 而异。\n- Internet 出站费率根据月度使用量收取。入站流量免费。\n\n有关更具体的详细信息，请参阅\
  \ *Further reading* 部分中的 Bigtable 定价 URL。\n\n## 摘要\n\n在本章中，我们介绍了 Cloud Spanner 和\
  \ Bigtable。\n\n就 **Cloud Spanner** 而言，我们现在明白这是一个可扩展且全球分布的数据库。它是强一致性的，并且旨在将关系数据库的优点与非关系数据库的可扩展性相结合。Cloud\
  \ Spanner 可以跨区域扩展，以满足可能具有高可用性要求的负载。\n\n我们从高层次介绍了 **Bigtable**，以确保您了解考试中期望的内容。它是一种完全托管的\
  \ NoSQL 数据库服务，可以大规模扩展并提供低延迟，非常适合物联网，因为它可以实时处理高速事务，与机器学习和分析集成良好，并且可以支持超过一 PB 的数据。\n\
  \n我们现在已经完成了一个信息量很大的章节。我们已经查看了 GCP 提供的关键数据库服务。我们建议您查看本章中的考试提示，并确保您了解每个服务的主要功能。我们讨论的一些关键设计决策是关系型与非关系型、结构化数据与非结构化数据、可扩展性，以及\
  \ SQL 与 NoSQL。\n\n在下一章中，我们将研究大数据。\n\n## 进一步阅读\n\n阅读以下文章以了解本章所涵盖内容的更多信息：\n\n- **Cloud\
  \ Spanner**: https://cloud.google.com/spanner/docs/\n- **Cloud Spanner Pricing**:\
  \ https://cloud.google.com/spanner/pricing\n- **Bigtable**: https://cloud.google.com/Bigtable/docs/\n\
  - **Bigtable Pricing**: https://cloud.google.com/Bigtable/pricing\n"
- "## 13\n分析大数据选项\n\n如果您一直在研究云计算，那么您很可能已经遇到过 **big data** 术语。这用于描述现代企业正在处理的海量数据。我们并不那么担心数据的总量，而更关心我们如何使用这些数据。如今几乎所有事物都带有数字足迹，挑战在于摄取这些数据并提取有意义的信息。Google\
  \ 提供了协同工作的服务，使我们能够收集数据、处理数据并分析数据。我们分析数据的速度越快，业务决策就能越快做出。大数据对许多组织变得非常重要。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 端到端大数据解决方案\n- Pub/Sub\n- Dataflow\n- BigQuery\n- Dataproc\n- Cloud IoT\n- Cloud\
  \ Data Fusion\n- Datastream\n\n在本章中，我们希望以考试期望的水平介绍主要的 Google 大数据服务和概念。当然，更深入的研究也是可用的。\n\
  \n## 端到端大数据解决方案\n\n在开始查看服务之前，让我们看一个非常简单的图表。这代表了端到端大数据解决方案。GCP 为我们提供了所有工具来构建一个弹性且可扩展的服务，在其中我们可以导入大量数据、处理事件，然后执行业务规则。\n\
  \n> Exam Tip\n> 了解此流程非常重要，以及哪些服务映射到每个阶段。随着我们阅读本章，我们将把每个大数据服务映射到我们端到端解决方案中的一个阶段。\n\
  \n我们可以从多个来源摄取数据，执行代码来处理这些数据，然后分析数据以确保我们最大化业务能力：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_394_0.png)\n\
  \n当然，这只是非常简化的视图，在构建解决方案时存在复杂性，但我们至少应期望在考试中从高层次理解这一点。让我们更详细地查看映射到每个阶段的服务。\n\n## Cloud\
  \ Pub/Sub\n\nPub/Sub 是一种消息传递和事件摄取服务，充当松散耦合系统之间的粘合剂。它允许我们在独立应用程序之间发送和接收消息，同时将事件发布者和订阅者解耦。这意味着发布者无需了解其订阅者。Pub/Sub\
  \ 完全托管，因此易于扩展，非常适合现代流分析管道。\n\n有一些核心概念您应该理解：\n\n- 一个 **publisher** 是将创建并向主题发送消息的应用程序。\n\
  - 一个 **topic** 是发布者向其发送消息的资源。\n- 一个 **subscription** 代表从单个主题到订阅应用程序的交付消息流。订阅者将通过拉取或推送接收消息，这意味着\
  \ Pub/Sub 使用 webhook 将消息推送到端点，或者消息由应用程序通过 HTTPS 请求向 Google API 拉取。\n- 一个 **message**\
  \ 是发布者将发送到主题的数据。简单来说，它是通过系统传输的数据。\n\n发布者可以是任何可以向 `googleapis.com` 发出 HTTPS 请求的应用程序。这可以是现有的\
  \ GCP 服务、**Internet Of Things (IoT)** 设备或终端用户应用程序。\n\n正如我们之前提到的，订阅者通过拉取或推送交付方法接收消息。与发布者类似，拉取订阅者可以是任何可以向\
  \ `googleapis.com` 发出 HTTPS 请求的应用程序。在这种情况下，订阅者应用程序将向 Pub/Sub 发起请求以检索消息。另一方面，推送订阅者必须是能够通过\
  \ HTTPS 接受 POST 请求的 webhook 端点。\n\n在这种情况下，Cloud Pub/Sub 会向订阅者应用程序发起请求以传递消息。应考虑哪种方法最适合我们的需求。例如，如果您预计有大量消息（例如，每秒超过一条消息），则建议使用拉取交付方法。或者，如果您有多个主题必须由同一个\
  \ webhook 处理，则建议使用推送交付方法：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_395_0.png)\n\
  \n图 13.2 – 推送交付方法\n\n\n\n\n\n为了总结这一点，让我们来看一下前面的图表中实际的工作方式。\n当所有交付都完成后，该消息将从队列中移除。\n\
  \n由于 Cloud Pub/Sub 能很好地与其他 GCP 产品集成，因此它开启了大量用例。\n\n让我们来看看最常见的用例：\n\n- **分布式事件通知：**\
  \ 假设有一个服务需要在有新注册时发送通知。Pub/Sub 使下游服务能够订阅并接收此新注册的通知。\n- **平衡工作负载：** 任务可以分发到多个 Compute\
  \ Engine 实例中。\n- **日志记录：** Pub/Sub 可以将日志写入多个系统。例如，如果我们希望使用实时信息，我们可以写入监控系统，如果我们希望在稍后分析数据，我们可以写入数据库。\n\
  \n## 创建主题和订阅\n\nPub/Sub 可以从多个数据源摄取数据。下面的图表显示了可以向 Pub/Sub 传递数据的关键服务。这是我们解决方案的第一步：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_396_0.png)\n\n图 13.3 – 向 Pub/Sub 传递数据\n\
  \n现在，让我们来看一下如何创建 Pub/Sub 主题和订阅。然后，我们将发布一条消息并通过 Cloud Shell 拉取它。请参阅第 16 章《Google\
  \ Cloud 管理选项》，了解有关 Cloud Shell 的更多信息。在此，我们假设您可以打开它：\n\n1. 从 **导航** 菜单浏览到 **大数据 |\
  \ Pub/Sub**，如下截图所示：\n\n图 13.4 – 选择 Pub/Sub\n\n2. 点击 CREATE TOPIC：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_397_0.png)\n\
  \n图 13.5 – 创建主题\n\n3. 提供主题 ID。在此示例中，我们将其命名为 newTopic。点击 CREATE TOPIC，如下截图所示：\n\n\
  ### Create a topic\n\nA topic forwards messages from publishers to subscribers.\n\
  \nTopic ID *\nnewTopic\nTopic name: projects/eighth-effect-319712/topics/newTopic\n\
  \nAdd a default subscription\n\nUse a schema\n\nUse a customer-managed encryption\
  \ key (CMEK)\n\nCANCEL   CREATE TOPIC\n\n图 13.6 – 输入主题 ID\n\n4. 选择 Create subscription，如下截图所示：\n\
  \n| Topic ID | Encryption key | Topic name | Labels |\n| newTopic | Google-managed\
  \ | projects/eighth-effect-319712/topics/newTopic | — |\nCreate subscription\n\n\
  图 13.7 – 创建订阅\n\n5. 提供 **订阅 ID**。在此示例中，我们将其命名为 newSub。我们将保持其余设置不变，但我们应该注意每个设置的作用：\n\
  \n- **消息保留时长**：Pub/Sub 将尝试在最多 7 天内传递消息。之后，消息将被删除且无法再访问。\n- **订阅过期**：如果没有活动连接或 pull/push\
  \ 成功，则订阅会过期。\n- **确认截止时间**：订阅方应在特定时间内确认消息；否则，Pub/Sub 将尝试重新传递此消息。\n\n请注意，我们将 **交付类型**\
  \ 保持为 **Pull**，如下截图所示：\n\n### Delivery type ?\n\n○ Pull\n○ Push\n\n### Message retention\
  \ duration ?\n\nDuration is from 10 minutes to 7 days\n\nDays 7\nHours 0\nMinutes\
  \ 0\n\n☐ Retain acknowledged messages ?\nWhen enabled, acknowledged messages are\
  \ retained for the message retention duration specified above. This increases message\

- "## 索引\n\n## 您可能感兴趣的其他书籍\n\n\n\n\n\n## 前言\n\nGoogle Cloud Platform (GCP) 是一款领先的云服务，其规模逐年呈指数级增长。GCP\
  \ 提供了一系列服务，可供各种组织利用，以充分发挥其基础设施的潜力。本书是 GCP 的完整指南，将教你各种有效利用 GCP 服务满足业务需求的方法。你还将熟悉通过\
  \ Google 的 Professional Cloud Architect 认证考试所需的主题。\n\n遵循 Professional Cloud Architect\
  \ 认证的官方考试大纲，你将[content]\n\n## Preface\n\nGoogle Cloud Platform (GCP) is a leading\
  \ cloud offering that has grown exponentially year on year. GCP offers an array\
  \ of services that can be leveraged by various organizations to bring the best out\
  \ of their infrastructure. This book is a complete guide to GCP and will teach you\
  \ various methods to effectively utilize GCP services for your business needs. You\
  \ will also become acquainted with the topics required to pass Google's Professional\
  \ Cloud Architect certification exam.\n\nFollowing the Professional Cloud Architect\
  \ certification's official exam syllabus, you will be introduced to GCP. You will\
  \ then be taught about the core services that GCP offers, such as computing, storage,\
  \ and network. Additionally, you will learn methods of how to scale and automate\
  \ your cloud infrastructure and make it compliant and secure. Finally, you will\
  \ also learn how to process big data and embrace machine learning services.\n\n\
  By the end of this book, you will have all the information required to ace Google's\
  \ Professional Cloud Architect exam and become an expert in GCP services.\n\n##\
  \ Who this book is for\n\nIf you are a cloud architect, cloud engineer, administrator,\
  \ or anyone who would like to learn different ways to implement Google Cloud services\
  \ in your organization, as well as get yourself certified with the Professional\
  \ Cloud Architect's certificate, then this is the book for you.\n\n## What this\
  \ book covers\n\nChapter 1, GCP Cloud Architect Professional, discusses the benefits\
  \ of becoming a certified architect, how to register for the exam, and what to expect\
  \ when you are in the test center.\n\nChapter 2, Getting Started with Google Cloud\
  \ Platform, covers the basics of GCP and how it positions itself on the market.\
  \ You will learn about all the major GCP services that are available.\n\nChapter\
  \ 3, Google Cloud Platform Core Services, examines the most important GCP services,\
  \ including computing, storage, networking, big data, and machine learning.\n\n\
  * Chapter 4, Working with Google Compute Engine, examines how to create and run\
  \ virtual machine instances on top of the Google Compute Engine (GCE) service.\n\
  * Chapter 5, Exploring Google App Engine as a Compute Option, discusses how to define\
  \ and run applications on Google App Engine.\n* Chapter 6, Managing Kubernetes Clusters\
  \ with Google Kubernetes Engine, explains the basis of containers and microservices.\
  \ It looks at running and managing Kubernetes clusters on the Google Kubernetes\
  \ Engine (GKE) service.\n* Chapter 7, Deploying Cloud-Native Workloads with Cloud\
  \ Run, discusses running cloud-native workloads in GCP with a serverless experience.\
  \ Cloud Run does this without the need to understand complex Kubernetes resource\
  \ definitions.\n* Chapter 8, Managing Cloud-Native Workloads with Anthos, introduces\
  \ one of the newest and most exciting GCP products available. We will learn how\
  \ we can run cloud-native workloads on Kubernetes anywhere. This includes not only\
  \ all three major public cloud providers, but also on-premises. We will see how\
  \ to keep the Anthos clusters in sync with predefined configuration and policies\
  \ as well as how to control and observe traffic in a microservice architecture using\
  \ Anthos Service Mesh.\n* Chapter 9, Running Serverless Functions with Google Cloud\
  \ Functions, looks into running serverless functions on Google Cloud Functions.\n\
  * Chapter 10, Networking Options in GCP, discusses Google's networking services.\
  \ Understanding networking is key to completing the architect exam. We will introduce\
  \ you to concepts such as Virtual Private Cloud (VPC) before diving further into\

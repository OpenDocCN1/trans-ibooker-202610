  Severity\nSelect resource\nSearch resource filters\nKubernetes Node\nKubernetes\
  \ Pod\nMetric type\nOS Patch Job\nService Account\nStackdriver Notification Channel\n\
  Subnetwork\nVM Instance\nSearch instance_id\nAll instance_id\nINSTANCE_ID\n1080228512014207575\n\
  1672071981735813276\n2701302113299800956\n4721548050940506507\n5638987979155252508\n\
  8309969565773668901\nString preview\nresource.type=\"gce_instance\"\nReset\nCancel\n\
  Add\n\nFigure 17.18 – Resource filters\n\n第二个过滤器允许您选择要显示的日志类型，如以下屏幕截图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_568_0.png)\n\
  \nFigure 17.19 – Log name\n\n第三个过滤器允许选择严重性级别：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_568_1.png)\n\
  \nFigure 17.20 – Severity\n\n从右上角的链接，您可以进入菜单，在其中选择时间范围：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_569_0.png)\n\
  \nFigure 17.21 – Time range selection\n\n您也可以从预定义的时间跨度或自定义时间跨度中选择。最后，当我们运行查询时，我们会得到显示机器何时启动的日志：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_569_1.png)\n\nFigure 17.22 – Filtered\
  \ logs\n\n此时的严重性为 INFO 级别。\n\n前面的示例显示了资源类型为 GCE 实例且严重性为 INFO 及以上的日志。\n\n## Exporting\
  \ logs\n\n日志记录接收到的日志条目可以导出（复制）到 Cloud Storage 存储桶、BigQuery 数据集和 Cloud Pub/Sub 主题。您通过配置日志接收器来导出日志，接收器随后会随着日志到达日志记录而继续导出日志条目。接收器包括一个目标和一个选择要导出的日志条目的过滤器。请记住，只有在配置接收器后创建的日志才会被导出：\n\
  \n1. 要设置导出，请转到 Cloud Logging 窗口中的 Logs Router 并点击 CREATE SINK：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_570_0.png)\n\
  \nFigure 17.23 – Logs Router\n\n2. 在 Sink details 中，填写接收器的名称和描述：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_570_1.png)\n\
  \nFigure 17.24 – Sink details\n\n3. 在 **Sink destination** 部分，您可以选择要接收日志的服务。这些包括以下内容：\n\
  \n- Cloud Logging bucket\n- BigQuery data set\n- Cloud Storage bucket\n- Cloud Pub/Sub\
  \ topic\n- Splunk\n- Other project:\n\n# 2 Sink destination\n\nSelect the service\
  \ type and destination for logs routing sink\n\n![](img/de2c97ab017f36b3750a5bade111edd7_571_0.png)\n\
  \nFigure 17.25 – Sink destination\n\n4. 在选择要包含在接收器中的日志部分，您可以添加一个过滤器来定义要接收的日志。如果将其留空，则所有日志都将被包含。我们可以使用之前创建的简单过滤器。这将为我们提供\
  \ GCE VM 实例的日志：\n\n# 3 Choose logs to include in sink\n\nCreate an inclusion filter\
  \ to determine which logs are included in logs routing sink\n\n![](img/de2c97ab017f36b3750a5bade111edd7_571_1.png)\n\
  \nFigure 17.26 – Choose logs to include in sink\n\n5. 如果您想检查过滤器是否正常工作，请点击 PREVIEW\
  \ LOGS。这将带您进入 Logs Explorer：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_572_0.png)\n\
  \nFigure 17.27 – Logs preview\n\n6. 如我们所见，所有 GCE 日志现在都可见，因为过滤器未指定任何额外参数，例如日志类型。\n\
  \n7. 最后，您可能希望从接收器中排除一些日志。在此部分中，您选择排除过滤器的名称。通过设置排除率，您可以决定应过滤掉日志的百分比。100% 的比率意味着所有匹配过滤器的日志都将被排除：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_572_1.png)\n\nFigure 17.28 – Choose logs\
  \ to filter out of sink\n\n\n\n\n8. 你现在可能想知道为什么我要导出日志。导出日志有以下几个用例：\n\n- BigQuery\
  \ 可用于使用 SQL 进行分析和查询。\n- Pub/Sub 导出允许与第三方解决方案集成。\n- Cloud Storage 导出是归档日志最具成本效益的选项。\n\
  \n你可以使用专用的安全信息和事件管理（SIEM）工具，例如 Splunk 来进行进一步的日志分析。\n\n## Logging agent\n\nLogging\
  \ agent 是一个基于 fluentd 的应用程序，同时支持 Linux 和 Windows 机器。它允许将来自常见第三方应用程序和系统软件的日志流式传输到\
  \ Cloud Logging。该代理已包含在 App Engine 和 GKE 的镜像中。对于 Compute Engine 和 Amazon EC2，需要进行安装。Linux\
  \ 上代理的安装非常简单，需要执行以下两个命令：\n\n```\ncurl -sSO https://dl.google.com/cloudagents/add-logging-agent-repo.sh\n\
  sudo bash add-logging-agent-repo.sh --also-install\n```\n\n默认情况下，代理会为预定义的应用程序流式传输日志。google-fluentd.conf\
  \ 可以被修改以指示应流式传输的额外日志。\n\n## Ops Agent\n\n你可能会想知道为什么需要安装两个代理才能获得监控和日志记录功能。Google\
  \ 正在通过引入一个名为 Ops Agent 的单一代理来解决这个问题。\n\n截至撰写本文时，Ops Agent 仍处于预 GA 阶段，尚未得到 Google\
  \ 的完全支持。Ops Agent 是 Logging 和 Monitoring 代理的组合。它提供更高的吞吐量和更好的资源效率。由于目前支持的功能数量有限，在迁移到\
  \ Ops Agent 之前请先查阅文档：https://cloud.google.com/stackdriver/docs/solutions/agents/ops-agent。\n\
  \n## Log-based metrics\n\n日志可用于创建基于日志的指标。Cloud Logging 可以在每次出现匹配项时累积由过滤器定义的日志。此数据随后会暴露给\
  \ Monitoring，并可进一步用于创建仪表板和警报策略。\n\n例如，包含特定 404 错误消息的日志可以在 1 分钟的时间段内进行计数并作为指标公开。\n\
  \n基于日志的指标可以是系统指标或用户定义指标：\n\n- **System metrics**：这些由 Cloud Logging 预定义。\n- **User-defined\
  \ metrics**：这些指标由用户基于过滤条件按项目创建。\n\n在下面的屏幕截图中，我们可以看到系统指标和用户定义指标的示例：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_574_0.png)\n\
  \n图 17.29 – 基于日志的指标\n\n## Cloud Audit Logs\n\n为了更好地了解 *谁做了什么？*、*在哪里？* 和 *何时？*，可以使用\
  \ Cloud Audit Logs。日志按项目、文件夹或组织存储，类型如下：\n\n- Admin Activity\n- System Event\n- Data\
  \ Access\n- Policy Denied\n\n前两种默认启用且无法停用。第三种默认禁用，因为它可能产生大量信息。审计日志为大多数 GCP 服务生成。要获取服务的完整列表，请参阅以下文档：https://cloud.google.com/logging/docs/audit/。\n\
  \n日志可以从 Legacy Logs Viewer 访问，就像任何其他日志一样，但查看它们需要特定的权限。以下是我们之前提到的每种审计日志类型的简短描述：\n\
  \n- **Admin Activity audit logs**：包含有关修改资源元数据或配置的操作的信息。这可能包括例如 VM 实例的创建或权限的更改。要查看日志，需要\
  \ Logging/Logs Viewer 或 Project/Viewer 角色。要在基本过滤下仅查看这些日志，请选择 `activity` 日志类型。\n\
  - **System Event audit logs**：包含 Compute Engine 系统事件的信息。这可能是例如 VM 实例的实时迁移。要查看日志，需要\
  \ Logging/Logs Viewer 或 Project/Viewer 角色。要在基本过滤下仅查看这些日志，请选择 `system_events` 日志类型。\n\
  - **Data Access audit logs**：包含有关创建、修改或读取用户提供数据的操作的信息。要查看日志，需要 Logging/Private Logs\
  \ Viewer 或 Project/Owner 角色。要在基本过滤下仅查看这些日志，请选择 `data_access` 日志类型。\n- **Policy Denied\
  \ audit logs**：记录由于安全策略违规而导致用户或服务账号被拒绝访问时的日志。这些日志默认生成，并且你的 Cloud 项目会为日志存储付费。要查看这些日志，需要\
  \ Logging/Logs Viewer 或 Project/Viewer 角色。\n\n在下面的屏幕截图中，你可以看到对 Admin Activity 审计日志进行过滤的示例：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_576_0.png)\n\n图 17.30 – Logs Explorer\n\
  \n虽然 Admin Activity 和 System Event 日志不收取费用，但启用 Data Access 日志可能会产生额外费用。BigQuery\
  \ 拥有自己的 Data Access 日志，它们单独处理且无法停用。\n\n## Activity\n\n审计日志也可以从主 GCP 控制台屏幕中的 ACTIVITY\
  \ 选项卡查看，该选项卡位于 Google Cloud operations suite 控制台之外。从主 GCP 控制台屏幕，点击左上角的 ACTIVITY，这将带你进入日志列表，如下图所示：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_576_1.png)\n\n图 17.31 – ACTIVITY\n\n\
  日志被缩写，并可按类别、资源和时间段进行过滤。通过选择条目，你可以看到进一步的详细信息。为了缩小日志列表的范围，你可以使用预定义过滤器，可在右上角找到。选择过滤器并按\
  \ OK 应用，如下图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_577_0.png)\n\n图 17.32\
  \ – Activity categories\n\n## Retention\n\nRetention 定义日志在 Cloud Logging 中存储的时间。超过规定期限后，日志将被删除。根据日志类型，保留时间不同。请参阅以下日志类型及其保留期列表：\n\
  \n- **Admin Activity:** 400 天\n- **Data Access:** 30 天\n- **System Event:** 400\
  \ 天\n- **Policy Denied:** 30 天\n\n请注意，日志可以被导出并归档更长时间。我们已在本书本章的 *Exporting logs*\
  \ 部分解释了如何导出日志。\n\n## Google Cloud's operations suite for GKE\n\nGoogle Cloud's operations\
  \ suite for GKE 是 GKE Legacy Logging and Monitoring 的演进版，该版本已于 2021 年 3 月 31 日弃用并停用。\n\
  \nCloud Operations for GKE 为 GKE 集群提供在集群和工作负载级别的可观测性功能。它显示了所有最重要的 GKE 集群资源，并允许你深入到工作负载容器生成的日志。\n\
  \n对于所有新的 GKE 集群，该功能默认启用。你可以自行决定想要的监控和日志记录级别。请注意，你可以将其限制为仅系统（Kubernetes 集群）的日志记录和监控，也可以包括工作负载（应用程序）。所有选项都可在\
  \ GKE 集群配置向导中看到，点击 Select logging and monitoring type 表单中的下拉菜单后可见。可用选项如下：\n\n- System\
  \ and workload logging and monitoring\n- System logging and monitoring only (beta)\n\
  - System and workload logging only (Monitoring disabled)\n- System monitoring only\
  \ (Logging disabled):\n\n![](img/de2c97ab017f36b3750a5bade111edd7_578_0.png)\n\n\
  即使 Legacy and Logging and Monitoring 仍在屏幕上可见，也不应再使用它。\n\n## GKE dashboard\n\n> Tip\n\
  > 请注意，截至撰写本书时，Google Cloud's operations suite for GKE 仅适用于运行在 Google Cloud 上的 GKE\
  \ 集群。这意味着它不包括运行在本地或裸机服务器上的 GKE 集群。\n\nGKE dashboard 是 GKE 集群最重要的指标的单一视图，包括以下内容：\n\
  \n- GKE 集群的打开警报时间线\n- 命名空间、节点、工作负载、服务、Pod 和容器的 CPU、内存和磁盘利用率等指标\n- Pod 和容器的日志：\n\n\
  ![](img/de2c97ab017f36b3750a5bade111edd7_579_0.png)\n\n图 17.34 – GKE dashboard\n\
  \n\n\n\n\nGKE 仪表盘将有关 GKE 集群和工作负载的所有关键信息整合到一个窗口中。它非常方便用于浏览 Kubernetes 资源并精确定位影响应用程序的问题。\n\
  \n## APM\n\nAPM 是一组开发人员用来了解他们能够多快以及多可靠地运行应用程序的工具。它包含三个服务：\n\n- Trace\n- Debugger\n\
  - Profiler\n\n这些工具集成到应用程序的代码中。应用程序无需托管在 GCP 上，而可以在任何云中甚至本地运行，只要有连接即可。APM 源自 Google\
  \ 的站点可靠性工程（SRE）团队工具集。因此，是时候我们站在 SRE 的角度思考了！\n\n## Trace\n\nCloud Trace 允许您跟踪微服务应用程序中的延迟。它显示应用程序响应的总体时间，但也可以显示每个微服务的详细延迟。这使您能够精确定位延迟的根本原因。\n\
  \n跟踪显示在 GCP 控制台中，并且可以生成分析报告。默认情况下，它已安装在 Google App Engine（GAE）标准环境中，但可与 GCE、GKE、GAE\
  \ 灵活以及非 GCP 机器一起使用。需要使用 Cloud Trace SDK 或 API 集成跟踪机制。\n\n## Debugger\n\n这允许您在不停止应用程序的情况下调试代码中的错误。开发人员可以请求正在运行的应用程序的实时快照，捕获调用堆栈和局部变量。可以在代码中注入调试日志点以显示附加信息。甚至可以在生产环境中进行此操作，而不会影响最终用户。\n\
  \n默认情况下，它已安装在 GAE 标准环境中，但可与 GCE、GKE、GAE 灵活以及非 GCP 机器一起使用。它不需要日志代理。\n\n## Profiler\n\
  \nCloud Profiler 显示您的代码消耗了多少资源。随着应用程序代码的更改，资源需求可能会意外增加。Profiler 允许您在生产环境中精确定位这些问题。它使用一个称为分析器代理的代码片段附加到应用程序的主代码上，并定期发送资源使用信息。它目前支持\
  \ Java、Go 和 Node.js，可与 GCE、GKE、GAE 灵活以及非 GCP 机器一起使用。以下屏幕截图展示了使用 CPU 配置文件的 Cloud\
  \ Profiler 示例：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_581_0.png)\n\n图 17.35\
  \ – Profiler（来源：https://cloud.google.com/profiler/docs/quickstart. 许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\
  \n## Error Reporting\n\nError Reporting 允许您在单一位置收集和汇总应用程序产生的错误。收集的错误可以分组并在集中式界面中显示。这样，您可以看到特定时间段内发生了多少次崩溃。\n\
  \n该服务的工作方式与 Cloud Logging 非常相似，但它允许您仅过滤最重要的错误并精确定位崩溃的根本原因。Error Reporting 与 Cloud\
  \ Functions、App Engine、GCE、GKE 和 AWS EC2 配合使用。默认情况下，它已为 App Engine 标准环境启用。支持多种语言，例如\
  \ Go、Java、.NET、Node.js、PHP、Python 和 Ruby。有两种方式可以利用错误报告：\n\n- 您可以使用 Cloud Logging\
  \ API 并发送格式正确的错误消息。\n- 您可以调用专用的 Error Reporting API。\n\nError Reporting 中的信息保留 30\
  \ 天。\n\n## Summary\n\n在本章中，我们了解了 Google Cloud 的运维套件以及如何监控 GCP 服务、资源和应用程序。我们研究了三个主要功能：**Monitoring**、**Logging**\
  \ 和 **APM**。\n\n为增强监控和日志记录功能，请在实例上安装代理。监控允许监控预定义指标。日志记录允许您创建基于日志的指标。可以在条件上创建警报策略，并将通知发送到您选择的端点。跟踪有助于了解应用程序组件（包括微服务和负载均衡器）的延迟。调试允许您查看导致错误的代码快照，而无需停止应用程序。Profiler\
  \ 显示应用程序不同组件使用了多少资源。最后，Error Reporting 聚合应用程序的错误日志并在时间轴图表上显示它们。\n\n在考试中，一些问题可能会要求您熟悉多个案例研究，这些案例研究应在参加考试前熟悉。这些案例研究解释了虚构的业务和解决方案概念。在下一章中，我们将介绍如何查找这些案例研究，并将查看一个示例案例研究并分析它，以便设计适当的解决方案。\n\
  \n## Further reading\n\n如果您想了解更多关于 Google Cloud 运维套件的信息，请使用官方 Google 文档：\n\n- **Google\
  \ Cloud's operations suite docs**：https://cloud.google.com/stackdriver/docs/\n-\
  \ **Monitoring agent**：https://cloud.google.com/monitoring/agent/\n- **Logging agent**：https://cloud.google.com/logging/docs/agent/\n\
  - **Debugger**：https://cloud.google.com/debugger/docs/setup/python\n- **Profiler**：https://cloud.google.com/profiler/docs/about-profiler\n\
  - **Error Reporting**：https://cloud.google.com/error-reporting/docs/setup/compute-engine\n"
- "# Section 4:\nExam Focus\n\n本节将重点介绍一个示例案例研究和模拟问题。这将帮助您更实际地理解考试。\n\n本书的这一部分包含以下章节：\n\
  \n- Chapter 18, Case Studies\n- Chapter 19, Test Your Knowledge\n\n## 18\n\n## Case\
  \ Studies\n\n正如我们在 *Chapter 1, GCP Cloud Architect Professional* 中很早就提到的，Google\
  \ 专业架构师考试涉及参考一组特定的案例研究。约 30% 的考试问题将涉及一个或多个这些案例研究。虽然您可以在参加考试前访问这些案例研究，但您不会知道考试中会出现哪些案例研究。然而，您在考试中可以访问它们，因此无需记住每一个！可以将其视为\
  \ Google 对我们友善并提供额外的准备材料。在考试中，当您被问及案例研究相关问题时，您将拥有分屏，可以同时查看案例研究和问题。\n\n本章将涵盖以下主题：\n\
  \n- 理解如何应对考试案例研究\n- 案例研究中我们寻找什么？\n- 附加案例研究\n\n## Understanding how to approach the\
  \ exam case studies\n\n问题将明确说明您需要参考的案例研究。截至撰写时，考试指南网页上有四个案例研究可供使用。虽然一些名称可能与考试前一版本中熟悉的名称相同，但自原始考试发布以来，这些名称已发生了显著变化：\n\
  \n- **Mountkirk Games**：https://services.google.com/fh/files/blogs/master_case_study_mountkirk_games.pdf\n\
  - **Helicopter Racing League**：https://services.google.com/fh/files/blogs/master_case_study_helicopter_racing_league.pdf\n\
  - **EHR Healthcare**：https://services.google.com/fh/files/blogs/master_case_study_ehr_healthcare.pdf\n\
  - **TerramEarth**：https://services.google.com/fh/files/blogs/master_case_study_terramaearth.pdf\n\
  \n在考试前阅读这些案例研究非常重要。您应将其作为学习计划的一部分。每个案例研究都涉及一家需要与 Google Cloud Platform（GCP）集成的企业。您会找到业务概述和解决方案概念，而您的任务是将这些概念和需求映射到\
  \ GCP 服务。\n\n查看这些案例研究的主要目标是尝试分配可以映射到 GCP 服务的关键词。然而，其中也有大量信息只是为了充实案例研究。区分哪些信息不需要以及哪些信息很重要非常重要。例如，如果有构建可靠且可重复环境的<|message|>要求，可能明智的做法是开始考虑\
  \ Cloud Deployment Manager，它为您提供可重复的部署流程。同样，如果技术要求表明公司希望能够根据需求进行扩展或缩减，那么我们可能会倾向于考虑自动扩缩器、负载均衡器和管理实例组。了解每个服务的用例是案例研究的关键。好消息是我们可以在考试前预先审阅案例研究！\n\
  \n在本章中，我们将详细查看上述案例研究之一，尝试展示考试中他们希望您做什么，以及您应如何处理接收到的信息并尝试将其映射到相关的 GCP 服务。\n\n\n\n\
  \n\n重要说明\n在阅读案例研究时，建议您同时参考 GCP 解决方案页面：https://cloud.google.com/solutions。\n此外，建议您参考\
  \ GCP 架构中心以获取参考架构：https://cloud.google.com/architecture/。\n\n## 我们在案例研究中寻找什么？\n\n\
  让我们仔细看看 Google Cloud 提供的其中一个案例研究。我们选择了 Mountkirk Games。在首次通读该案例研究时，我们可以看到它被分解为六个不同的部分，让我们更详细地查看每个部分：\n\
  \n- 公司概览\n- 解决方案概念\n- 现有技术环境\n- 业务需求\n- 技术需求\n- 执行声明\n\n每个部分中的摘录都引用了案例研究的文本。需要提醒的是，完整文档可以在本章开头提到的网址中查看。\n\
  \n## 公司概览\n\n让我们看看公司概览：\n\n> “Mountkirk Games 为移动平台制作在线、基于会话的多人游戏。他们在成功将本地环境迁移到\
  \ Google Cloud 后，最近开始扩展到其他平台。\n> \n> 他们最近的努力是创建一个复古风格的第一人称射击游戏（FPS），该游戏允许数百名同时玩家从多个平台和位置加入特定地理位置的数字竞技场。一个实时数字横幅将显示所有活跃竞技场中所有顶尖玩家的全球排行榜。”\n\
  \n来源：https://services.google.com/fh/files/blogs/master_case_study_mountkirk_games.pdf。\n\
  \n许可：https://creativecommons.org/licenses/by/4.0/legalcode。\n\n那么，从这里我们可以提取哪些信息来帮助我们形成解决方案架构呢？嗯，我们可以看到这个概览引导我们思考移动平台，因此我们应该开始思考移动游戏架构的起点，以及前端架构应该是什么，后端架构应该是什么。我们可以看到我们需要能够应对多人游戏需求，这可能需要复杂的相互关联的表。我们还需要存储会话，因此我们需要研究对此所需的配置，以及其他一些关键要素，例如多个平台和位置。我们还需要一个排行榜，我们可以通过分解组件来实现。最后，我们应该考虑用户体验。查询到我们后端的速度会直接影响最终用户，以及我们游戏的整体成功。\n\
  \n第一段告知我们核心业务是面向移动平台的在线游戏。立即，我们应该意识到移动游戏平台会产生大量实时数据，并且有大量设备连接到它们，所有这些都将来自不同类型的连接（Wi-Fi、3G-5G\
  \ 等）。这是一个相当独特的行业。\n\n第二段开始暗示一些潜在的 GCP 服务。例如，它提到将有一个实时数字横幅，其中包含顶尖玩家的排行榜。我们可以尝试将其转化为适合此架构的\
  \ GCP 服务：\n\n- 我们需要一个流式服务。我们知道哪项服务可以处理流式处理模式？如果你想到 **Pub/Sub**，那就正确了。\n- 我们如何将这些事件转换为排行榜？我们可能需要一个\
  \ **Dataflow** 管道来清理数据并确保消息格式良好，然后将其转换为结构化数据。\n- 该转换然后可以添加到 **BigQuery** 表格式中，将某人的用户名与\
  \ *kills* 数量匹配以列出顶尖玩家。\n- **Data Studio** 也可用于创建交互式排行榜，从 BigQuery 消费并展示数据。\n\n这只是为了让我们开始思考架构。也许有人会争辩说我们不需要\
  \ Dataflow，并且 BigQuery 可以直接从云存储桶查询数据，但这会是一个可扩展的设计吗？如果来自移动设备的事件引入了额外字段，我们是否需要重新审视这一点？\n\
  \n## 解决方案概念\n\n现在，让我们看看解决方案概念：\n\n> “Mountkirk Games 正在构建一款他们预计会非常受欢迎的多人游戏。他们计划将游戏后端部署在\
  \ Google Kubernetes Engine 上，以便能够快速扩展并使用 Google 的全球负载均衡器将玩家路由到最近的区域游戏竞技场。为了使全球排行榜保持同步，他们计划使用多区域\
  \ Spanner 集群。”\n\n来源：https://services.google.com/fh/files/blogs/master_case_study_mountkirk_games.pdf。\n\
  \n许可：https://creativecommons.org/licenses/by/4.0/legalcode。\n\n解决方案概念只为我们提供了几行信息，但仍然提供了关键信息。他们告诉我们设计需要使用某些服务，但为什么他们希望使用这些服务？此外，我们应该思考哪些服务应设计为典型游戏基础设施的前端和后端组件。\n\
  \n以前端为例。他们希望使用 Google Kubernetes Engine（GKE），但他们可以使用其他各种选项。他们可以使用 App Engine 或 Cloud\
  \ Run，这两种也提供与云负载均衡的完全集成。然而，这两者都是完全托管的，而 GKE 为开发人员提供了更多控制权，并且历史上游戏已在 GKE 上以大规模部署，使用专用游戏服务器方法：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_589_0.png)\n\n图 18.1 – 游戏架构（转自 https://cloud.google.com/architecture/mobile-gaming-analysis-telemetry，许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\
  \n## 现有技术环境\n\n现在，让我们回顾现有环境和需求：\n\n> “现有环境最近已迁移到 Google Cloud，并且有五款游戏通过 lift-and-shift\
  \ 虚拟机迁移带了过来，只有少数例外。\n> \n> 每个新游戏都存在于一个隔离的 Google Cloud 项目中，该项目嵌套在维护大部分权限和网络策略的文件夹下方。低流量的旧游戏已合并到一个项目中。开发和测试也有单独的环境。”\n\
  \n来源：https://services.google.com/fh/files/blogs/master_case_study_mountkirk_games.pdf。\n\
  \n许可：https://creativecommons.org/licenses/by/4.0/legalcode。\n\n## 业务需求\n\n现在，让我们看看业务需求：\n\
  \n> “支持多种游戏平台。\n> \n> 支持多个区域。\n> \n> 支持游戏功能的快速迭代。最小化延迟。\n> \n> 针对动态扩展进行优化。\n> \n\
  > 使用托管服务和资源池。\n> \n> 最小化成本。”\n\n来源：https://services.google.com/fh/files/blogs/master_case_study_mountkirk_games.pdf。\n\
  \n许可：https://creativecommons.org/licenses/by/4.0/legalcode。\n\n## 技术需求\n\n我们现在有几个技术需求：\n\
  \n> “根据游戏活动动态扩展。\n> \n> 在接近实时的全球排行榜上发布计分数据。\n> \n> 将游戏活动日志存储为结构化文件以供将来分析。\n> \n\
  > 使用 GPU 处理在服务器端渲染图形以支持多平台。\n> \n> 支持旧游戏最终迁移到此新平台。”\n\n**来源：** https://services.google.com/fh/files/blogs/master_case_study_mountkirk_games.pdf。\n\
  \n**许可：** https://creativecommons.org/licenses/by/4.0/legalcode。\n\n当你阅读这些需求时，会想到哪些服务？几乎每一行都有一些关键词或短语：动态扩展、日志、迁移和延迟等。我们应该将这些映射到\
  \ GCP 服务。例如，如果我们看到根据游戏活动扩展的需求，我们可能会开始思考能够满足此需求的服务。例如，Pub/Sub 能够从移动设备摄取事件并按需扩展。\n\
  \n## 执行摘要\n\n我们案例研究的最后一部分是执行摘要：\n\n> “我们的上一款游戏是第一次使用 Google Cloud，结果非常成功。我们能够以以前从未有过的方式分析玩家行为和游戏遥测数据。这种成功使我们能够押注于完全迁移到云端，并开始使用云原生设计原则构建全新的游戏。我们的新游戏迄今为止是最雄心勃勃的，将为我们打开支持除移动之外更多游戏平台的大门。延迟是我们最优先考虑的问题，尽管成本管理是下一个最重要的挑战。与我们的第一款基于云的游戏一样，我们已经习惯于云能够实现高级分析功能，以便我们可以快速迭代部署错误修复和新功能。”\n\
  \n**来源：** https://services.google.com/fh/files/blogs/master_case_study_mountkirk_games.pdf。\n\
  \n**许可：** https://creativecommons.org/licenses/by/4.0/legalcode。\n\n\n\n\n\n有一个明确的信息，即延迟和成本管理是高管们最主要关注的问题。他们还专注于尽可能快速地发布新迭代，这应该让我们联想到\
  \ DevOps 原则。分析也被提及为一个重要事项，但这能否帮助我们实现成本节约？在与我们的分析输出格式相关的设计上进行投资可以带来显著的成本节约。**BigQuery**\
  \ 能在这里帮助我们吗？\n\n## 形成解决方案\n\n在第一次梳理后，我们已经成功提取了几个关键词并将其映射到特定的 GCP 服务。下一步是尝试从中形成一个解决方案。这些服务如何相互关联，以构建一个可用的设计并与公司提出的要求相关联？考试不会要求你做出端到端的解决方案——它会问哪些服务更适合满足特定问题的需求。然而，对此有一个想法也会让你作为\
  \ GCP 云架构师受益匪浅。\n\n## 分析平台\n\n案例研究的一个关键收获是，我们将以高速处理移动数据流，但同时也会处理一些批处理数据。让我们快速查看\
  \ Google Solutions 网页以获取指导。如果我们查看 https://cloud.google.com/architecture/mobile-gaming-analysis-telemetry\
  \ 上的移动指南，我们会看到用于构建移动游戏分析平台的参考架构。让我们专注于如何处理来自移动设备的实时事件。如果我们查看以下图表，我们可以看到它与我们的需求相吻合：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_592_0.png)\n\n图 18.2 – 事件的实时处理（转自 https://cloud.google.com/architecture/mobile-gaming-analysis-telemetry，许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\
  \n我们可以看到，使用 Cloud Pub/Sub 借助其事件驱动设计帮助我们即时处理数据。这是摄取实时事件流的理想服务，并且可以被多个目标消费。Pub/Sub\
  \ 还充当队列，用于获取新消息并将其推送到管道中的下一个服务。消息到达时此操作会立即执行。\n\n我们还必须容纳批处理数据。同样，此参考架构向我们展示了如何完成此操作。移动设备可以将数据上传到\
  \ Cloud Storage，这是一种以经济高效的方式存储对象数据的方法：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_593_0.png)\n\
  \n图 18.3 – 批处理事件和日志（转自 https://cloud.google.com/solutions/mobile/mobile-gaming-analysis-telemetry，许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\
  \n此过程中的下一步是 Cloud Dataflow，它充当我们的数据处理服务。我们可以创建单独的管道作业来处理实时和批处理数据，以确保数据格式良好并符合 BigQuery\
  \ 模式。Dataflow 具有时间窗口触发器，允许它根据事件实际发生的时间而不是发送或接收的时间来处理事件。\n\n最后，BigQuery 帮助我们满足分析需求并报告大量数据。BigQuery\
  \ 是一种托管服务，并且可以提供快速扩展，这两者都是执行摘要所要求的。\n\n下图显示了 Dataflow 管道处理数据并将我们的 userId 映射到击杀数并以\
  \ BigQuery 表格式呈现的示例。我们现在可以直观地看到这如何有助于满足我们实时排行榜的需求：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_593_1.png)\n\
  \n图 18.4 – 批处理事件和日志（转自 https://cloud.google.com/solutions/mobile/mobile-gaming-analysis-telemetry，许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\
  \n## 前端平台\n\n我们的前端需求非常明确。我们需要使用 GKE 快速扩展，并使用全球负载均衡器将玩家路由到区域游戏竞技场。\n\n我们在本章前面已经提到过这一点，但为什么我们特别要求使用\
  \ GKE，而我们有其他可能满足要求的选项，例如使用托管服务？简而言之，Google 建议使用 Kubernetes 部署生产规模的 **专用游戏服务器** 集群。这些专用服务器提供游戏逻辑并有助于最大限度地减少用户感知的延迟。客户端游戏应用通常会直接与这些游戏服务器通信。\n\
  \n使用 GKE，我们可以为运行基于会话的多人服务器设计可扩展的架构。此架构使我们能够满足另一个关键技术要求，即根据游戏活动动态扩展。缩放管理器进程将根据需求自动启动和停止用作\
  \ GKE 节点的虚拟机实例。所有机器的配置都可以通过托管实例组来处理。\n\n## 后端平台\n\n我们的后端服务将仅与前端和后端服务交互；即客户端不会直接与这些服务交互。我们还要求使用\
  \ Cloud Spanner 来保持排行榜同步。Cloud Spanner 将提供全球一致性，保持世界各地玩家的历史记录或库存。然而，Cloud Spanner\
  \ 单独并不适合维护频繁更新的排行榜。对于此，我们应考虑引入诸如 Redis 之类的东西，并根据需要定期将高分保存到长期存储中。通过使用 Cloud **Memorystore**，我们可以实现此要求：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_595_0.png)\n\n图 18.5 – 排行榜基础设施（转自 https://cloud.google.com/architecture/using-memorystore-for-redis-as-a-leaderboard，许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\
  \n上图显示了排行榜的基础设施。排行榜可以由 VPC 网络内的 GKE 集群和单独的 Memorystore 实例组成。\n\n## 其他考虑\n\n在技术要求中，注意到对遗留游戏的最终迁移应得到我们设计的支持。据我们所知，遗留游戏已整合到一个项目中，这很有帮助，因为我们应该将这些环境隔离，并在迁移完成后销毁它。Google\
  \ 为此提供了一个迁移指南，可在 https://cloud.google.com/architecture/dedicated-game-server-migration-guide\
  \ 找到。\n\n## Mountkirk 总结\n\n现在我们已经形成了解决方案，我们可以确信我们理解了业务需求以及如何使用适当的服务。你应该注意不要期望案例研究中看到的内容与问题之间存在简单的联系。它并不总是像例如哪种存储服务最符合要求那样简单。一些问题可能会引用案例研究，但可能会增加案例研究中未出现的额外要求；例如，Mountkirk\
  \ 可以使用什么 IAM 策略来隔离开发和生产？案例研究中没有具体提到 IAM，但我们仍应期望看到类似的问题。\n\n## 其他案例研究\n\n我们还想查看截至撰写时可用的另外三个案例研究。我们希望你现在已经清楚如何分解这些案例研究，并理解关键在于找到有助于我们映射到\
  \ GCP 服务的关键词。我们不会对其他案例进行如此深入的探讨，但我们希望你在阅读案例研究时能够在没有指导的情况下开始形成解决方案。\n\n## EHR Healthcare\n\
  \n我们现在将查看 EHR Healthcare 案例研究。同样，我们将回顾可以从在线文档中获得的信息。在案例研究结束时，我们将提供分析。我们希望你在阅读时写下让你注意到的服务，并将你的发现与我们的分析进行比较：\n\
  \n## 公司概述：\n\n> “EHR Healthcare 是向医疗行业提供电子健康记录软件的领先供应商。EHR Healthcare 以服务形式向跨国医疗办公室、医院和保险提供商提供其软件。”\n\
  \n## 解决方案概念：\n\n> “由于医疗保健和保险行业的快速变化，EHR Healthcare 的业务每年呈指数级增长。他们需要能够扩展其环境、调整其灾难恢复计划，并推出新的持续部署能力以快速更新其软件。Google\
  \ Cloud 已被选为取代其当前的托管设施。”\n\n## 现有技术环境：\n\n> “EHR 的软件目前托管在多个托管设施中。其中一个数据中心的租约即将到期。”\n\
  \n> 面向客户的应用基于 Web，并且许多最近已被容器化以在 Kubernetes 集群组上运行。数据存储在关系型和 NoSQL 数据库的混合中（MySQL、MS\
  \ SQL Server、Redis 和 MongoDB）。\n\n> EHR 在本地托管了与保险提供商的多个遗留文件和 API 集成。这些系统计划在未来几年内被替换。目前没有升级或迁移这些系统的计划。\n\
  \n\n\n\n\n\"用户通过 Microsoft Active Directory 进行管理。监控目前通过各种开源工具进行。警报通过电子邮件发送，并且经常被忽略。\"\
  \n\n## Business requirements:\n\"尽快上线新的保险提供商。\n为所有面向客户的系统提供至少 99.9% 的可用性。\n提供系统性能和使用的集中可见性并主动采取行动。\n\
  提高提供医疗趋势洞察的能力。\n降低所有客户的延迟。\n保持监管合规。\n降低基础设施管理成本。\n根据提供商数据进行预测并生成行业趋势报告。\"\n\n##\
  \ Technical requirements:\n\"维护与本地系统和云提供商连接的保险提供商的遗留接口。\n提供一种一致的方式来管理基于容器的面向客户的应用程序。\n\
  在本地系统和 Google Cloud 之间提供安全且高性能的连接。\n提供一致的日志记录、日志保留、监控和警报功能。\n维护和管理多个基于容器的环境。\n动态扩展和配置新的环境。\n\
  创建接口以从新提供商处摄取和处理数据。\"\n\n## Executive statement:\n> \"我们的本地部署策略多年来一直有效，但需要投入大量时间和金钱来培训我们的团队使用截然不同的系统、管理相似但独立的环境以及应对停机。许多停机都是由于系统配置错误、应对流量高峰的能力不足以及监控实践不一致造成的。我们希望使用\
  \ Google Cloud 来利用可扩展、 resilient 的平台，该平台可以无缝跨越多个环境，并提供一致且稳定的用户体验，使我们能够为未来的增长做好准备。\"\
  \n\nSource: https://services.google.com/fh/files/blogs/master_case_study_ehr_healthcare.pdf.\n\
  \nLicense: https://creativecommons.org/licenses/by/4.0/legalcode.\n\n## Analysis\n\
  \n这里有很多信息需要消化。但让我们专注于获取关键词并尝试形成一个关于将使用哪些服务的画面。\n\n让我们尝试总结一下它在告诉我们什么。我们知道他们为医疗行业提供健康记录软件，并且我们知道它为医疗办公室等提供\
  \ SaaS 解决方案。让我们更仔细地查看案例研究。有几件事应该引起注意：\n\n- 他们正从本地基础设施迁移到基于云的基础设施，并且已将基于 Web 的应用程序容器化。他们还希望在需要时动态扩展的同时降低基础设施管理成本。扩展也是我们在执行摘要中提到的导致问题的因素，并且面向客户的应用程序必须是基于容器的。我们应该考虑\
  \ GKE 在这里。GKE 提供了一种简单的方法，使用他们现有的容器化应用程序来部署和扩展面向客户的 Web 应用。使用 GKE 意味着 GKE 下的基础设施不仅托管而且还受管理，从而提供了他们所需的托管成本节约。此外，我们可以将\
  \ Web 应用部署为可根据客户需求扩展的负载均衡的副本集。\n\n- 查看业务需求，其中一个很快引起注意的是，他们必须对系统性能和使用情况进行集中可见性。我们也可以在技术需求中看到类似的要求，即他们需要一致的监控和警报功能。这些应该大声呼喊\
  \ **Google Cloud operations**。Cloud Logging 和 Cloud Monitoring 允许我们搜索、分析、监控和警报数据和事件。他们还需要日志保留。为节省成本，我们可以利用\
  \ **Cloud Storage**。\n- 他们还需要本地系统与 GCP 之间高性能的连接，因此我们应该考虑 **Google Cloud Hybrid Connectivity**\
  \ 选项，在这里，特别是在专用互连方面，这与 *高性能* 同义。\n- 解决方案概念提到调整其 **Disaster Recovery (DR)** 计划。它还提到数据存储在关系型和\
  \ NoSQL 数据库的混合中。当我们考虑数据库的 DR 时，我们应该考虑多区域、高可用性实例。**Cloud SQL** 实例通过同步复制到不同区域的持久磁盘提供高可用性。\n\
  - 解决方案概念还提到持续部署能力。此时，我们应该考虑所有 CI/CD 相关事物以及 **Cloud Build** 和 **Artifact Registry**。这两个产品也有助于维护和管理多个基于容器的环境的需求。\n\
  - 解决方案还需要在监管合规方面保持合规。例如 HIPPA 是保护可识别个人的健康信息的美国标准集。为了遵守此标准，我们可以使用 **Cloud Identity**\
  \ 用于客户组织。由于他们目前使用 Active Directory 数据库进行用户管理，我们可以轻松集成 Cloud Identity，使用组访问项目资源并要求身份验证以修改或使用它们。\n\
  - 他们还希望从新提供商处摄取和处理数据。我们能否想到 GCP 服务可能如何帮助我们？可以 – **Pub/Sub** 用于摄取？**BigQuery** 用于处理？\n\
  \n当你查看这个案例研究时，还有哪些其他服务会引起你的注意？也许你注意到预测行业趋势的需求，并开始考虑 BigQuery ML。尝试思考这些如何协同工作。这个案例研究似乎高度关注扩展和警报，因此思考\
  \ GKE 和 Google Cloud operations 如何帮助这里。\n\n## TerramEarth\n\n我们现在将查看 TerramEarth\
  \ 案例研究。同样，我们将回顾可以从在线文档中得出的内容。在案例研究结束时，我们将提供分析。我们希望你在阅读时写下引起你注意的服务，并将你的发现与我们的分析进行比较：\n\
  \n## Company overview:\n> \"TerramEarth 制造采矿和农业行业的重型设备。他们目前在 100 个国家拥有超过 500 家经销商和服务中心。他们的使命是打造让客户更高效的产品。\"\
  \n\n## Solution concept:\n> \"目前有 200 万辆 TerramEarth 车辆在运行，我们看到每年 20% 的增长。车辆在运行期间从许多传感器收集遥测数据。少量关键数据实时从车辆传输以促进车队管理。其余传感器数据在收集、压缩后，每天车辆返回基地时上传。每辆车通常每天产生\
  \ 200 到 500 兆字节的数据。\"\n\n## Existing technical environment:\n> \"TerramEarth 的车辆数据聚合和分析基础设施位于\
  \ Google Cloud 中，并为全球各地的客户提供服务。越来越多的传感器数据从其两个主要制造工厂捕获并发送到包含其遗留库存和物流管理系统的私有数据中心。私有数据中心已配置多个网络互连到\
  \ Google Cloud。面向经销商和客户的 Web 前端在 Google Cloud 中运行，允许访问库存管理和分析。\"\n\n## Business\
  \ requirements:\n> \"预测并检测车辆故障，并在可能的情况下及时向经销商运送零件进行维修。\n> \n> 降低云运营成本并适应季节性。\n>\
  \ \n> 提高开发工作流程的速度和可靠性。\"\n\n允许远程开发者在不损害代码或数据安全性的情况下保持生产力。\n\n为开发者创建面向经销商和合作伙伴的自定义\
  \ API 服务创建一个灵活且可扩展的平台。\"\n\n## Technical requirements:\n\"为其遗留系统创建新的 HTTP API 访问抽象层，以实现在不中断操作的情况下逐步迁移到云。\n\

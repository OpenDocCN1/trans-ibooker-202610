  \n| DATA | MESSAGE_ID | ORDERING_KEY | ATTRIBUTES | DELIVERY_ATTEMPT |\n| Good Luck\
  \ in the exam !! | 2629643884009593 |  |  |  |\n\n图 13.11 – Cloud Shell 输出\n\n这就完成了如何向\
  \ Pub/Sub 发布和检索消息的说明。\n\n## Pub/Sub Lite\n\n虽然 Pub/Sub 应该是大多数应用集成用例的默认解决方案，但 GCP\
  \ 也提供 Pub/Sub Lite，供在成本更低可以接受一定运维开销的应用使用。它提供的功能更少，可用性更低，并且需要手动预留和管理资源容量。然而，使用 Pub/Sub\
  \ Lite 对于具有单个订阅的系统来说可能便宜高达 85%。\n\n产品之间的其他主要差异如下：\n\n- Pub/Sub 在全球范围内路由消息，而 Lite\
  \ 在区域内路由消息。\n- Pub/Sub 的主题和订阅是全局资源，而 Lite 中它们是区域资源。\n- Pub/Sub 自动扩展，而 Lite 需要我们手动配置容量。\n\
  \n## IAM\n\n对 Pub/Sub 的访问通过 IAM 保护。让我们来看一下预定义角色的列表以及每个角色的简短描述：\n\n- **Pubsub Publisher**：此角色有权发布主题。\n\
  - **Pubsub Subscriber**：此角色有权消费订阅或将订阅附加到主题。\n- **Pubsub Viewer**：此角色有权列出主题和订阅。\n\
  - **Pubsub Editor**：此角色有权创建、删除和更新主题，以及创建、删除和更新订阅。\n- **Pubsub Admin**：此角色有权检索和设置主题和订阅的\
  \ IAM 策略。\n\n## 配额和限制\n\nPub/Sub 有一些限制。我们建议您了解每个服务的限制，因为这会影响您的可扩展性。对于 Pub/Sub，我们应注意以下限制：\n\
  \n- 每个项目最多有 10,000 个主题和 10,000 个订阅。\n- 每个主题最多可附加 10,000 个订阅。\n- 每次发布请求最多有 1,000\
  \ 条消息，总大小为 10 MB。\n- 每条消息最多为 10 MB。\n\n## 定价\n\nPub/Sub 按消息摄取和传递计费。保留已确认消息还会有存储费用。\n\
  \n在本节中，我们介绍了 Pub/Sub 和 Pub/Sub Lite。在下一节中，我们将介绍 Cloud Dataflow。\n\n## Cloud Dataflow\n\
  \nCloud Dataflow 是一项基于 Apache Beam 的服务，Apache Beam 是一种用于创建数据处理管道的开源软件。管道本质上是一段代码，用于确定我们希望如何处理数据。一旦这些管道构建完成并输入到服务中，它们就成为\
  \ Dataflow 作业。这就是我们处理由 Pub/Sub 摄取的数据的地方。它会执行步骤，将数据从一种格式更改为另一种格式，并且可以转换实时流或历史批处理数据。Dataflow\
  \ 完全无服务器且完全托管。它会启动执行 Dataflow 作业所需的资源，并在作业完成后删除这些资源。例如，一个管道作业可能由多个步骤组成。如果某个特定步骤需要在\
  \ 15 台机器上并行执行，则 Dataflow 会自动扩展到这 15 台机器，并在作业完成后将其移除。这些资源基于 Compute Engine，被称为 worker，Cloud\
  \ Storage 用作临时暂存区和 I/O。这些资源基于我们的位置设置。\n\n> **考试提示**\n> Dataflow 可以在流和批模式下转换和丰富数据。其无服务器架构可用于分片和并行处理非常大的批处理数据集或大量实时流。\n\
  \nCloud Dataflow 是我们端到端解决方案的下一阶段，将处理由 Cloud Pub/Sub 传递的数据。让我们来看一下这对图 13.3 中的服务设计有何影响：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_401_0.png)\n\n\n\n\n\n现在，让我们使用 Google\
  \ 的开源 Dataflow 模板之一创建一个流式管道。\n\n这里，我们有一个 Pub/Sub 订阅，我们希望将数据写入数据仓库服务以进行分析。在本示例中，我们将使用\
  \ BigQuery 来分析我们的数据。我们将在下一节讨论此服务。我们需要 Dataflow 将来自 Pub/Sub 的 JSON 格式消息转换为 BigQuery\
  \ 元素。对于此示例，我们将使用一个 Google 公共 GCP 项目，该项目已设置 Pub/Sub 主题。我们还假设我们已准备好一个 BigQuery 表以供数据写入：\n\
  \n+   1. 从 **Navigation** 菜单浏览到 **BIG DATA | Dataflow**：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_402_0.png)\n\
  \nFigure 13.13 – Browsing to Dataflow\n\n+   2. 点击 **CREATE JOB FROM TEMPLATE**：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_402_1.png)\n\nFigure 13.14 – CREATE JOB\
  \ FROM TEMPLATE\n\n3. 现在，我们可以为 Dataflow 作业填充所需的参数：\n\n+   - 选择部署 Dataflow 工作器并存储元数据的位置。我们将保持默认设置。\n\
  +   - 插入 Pub/Sub 输入主题。这是一个由 Google 作为模板一部分提供的公共项目。\n+   - 插入数据将被写入的 BigQuery 输出表。\n\
  +   - 插入用于存储临时文件的 Cloud Storage 存储桶：\n\n## Create job from template\n\nJob name\
  \ *\njob001\nMust be unique among running jobs\n\nRegional endpoint *\neurope-west2\n\
  Choose a Dataflow regional endpoint to deploy worker instances and store job metadata.\
  \ You can optionally deploy worker instances to any available Google Cloud region\
  \ or zone by using the worker region or worker zone parameters. Job metadata is\
  \ always stored in the Dataflow regional endpoint. Learn more\n\nDataflow template\
  \ *\nPub/Sub Topic to BigQuery\n\nStreaming pipeline. Ingests JSON-encoded messages\
  \ from a Pub/Sub topic, transforms them using a JavaScript user-defined function\
  \ (UDF), and writes them to a pre-existing BigQuery table as BigQuery elements.\
  \ OPEN TUTORIAL\n\nFigure 13.15 – Create job from template\n\n一旦选择了 dataflow 模板，我们需要填充其他必需参数。我们需要输入一个有效的\
  \ Pub/Sub 主题。在以下示例中，我们使用的是一个由公共 GCP 管理的主题。我们还需要输入一个 BigQuery 表以输出数据，然后输入临时文件写入的位置。在我们的示例中，我们使用名为\
  \ `cloudarchitectbookupdate` 的 Cloud Storage 存储桶：\n\nInput Pub/Sub topic *\nprojects/pubsub-public-data/topics/taxirides-realtime\n\
  The Pub/Sub topic to read the input from. Ex: projects/your-project-id/topics/your-topic-name\n\

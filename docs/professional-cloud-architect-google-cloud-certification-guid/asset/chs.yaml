  \n区域\neurope-west1（比利时）\n机器类型\n自定义以选择核心、内存和 GPU。\n\n- europe-west1-b\n- europe-west1-d\n\
  - europe-west1-c\n\n图 4.16 – 区域\n\n同一区域内的所有区域都通过高带宽、低延迟网络连接——通常在每个区域之间往返时间低于 5 分钟。\n\
  \n### 启动盘\n\n我们已经看到可以从中选择许多预定义镜像。这些镜像的默认存储为平衡持久盘。此类磁盘由 **Solid State Drives (SSDs)**\
  \ 支持，并在性能和成本之间取得平衡。这可以更改为由标准 HDD 支持的标准持久盘，或由 SSD 支持的 SSD 持久盘。默认大小将根据所选操作系统镜像而变化，但可以调整：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_92_0.png)\n\n图 4.17 – 启动盘类型\n\n与默认值的更改将再次影响实例的成本。\n\
  \n**自定义镜像** 可按项目使用，可以从源磁盘、镜像、快照或存储在云存储中的镜像创建。\n\n### 快照\n\n可以对持久盘进行快照并将其用作新实例创建的一部分，即使它仍附加到正在运行的实例。快照可用于创建新的自定义镜像或实例。快照可出于多种原因创建，其中之一是数据保护。建议采用快照计划以减少数据丢失。快照也是全局资源，这意味着它们可被同一项目中的任何资源访问。\n\
  \n\n\n\n\n要从控制台创建快照，我们应浏览到导航菜单，然后进入 **Compute Engine | Snapshots**。然后，我们必须为快照命名并选择要使用的源磁盘。最后，我们可以选择要存储快照的位置，如以下屏幕截图所示：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_93_0.png)\n\n图 4.18 – 创建快照\n\n下图展示了多个快照的工作流程。第一个快照将是对磁盘上所有数据的完整快照，后续快照将是增量的：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_94_0.png)\n\n图 4.19 – 多个快照\n\n> **重要说明**\n\
  > \n> 快照是增量的，因此将包含与上一个快照不同的块。因此，如果你定期创建快照，其成本低于定期创建磁盘的完整映像。每个快照在 GCP 内的多个位置存储以实现冗余。只要有正确的权限，快照可以跨项目存储。\n\
  \n考试不会对快照进行详细介绍，但可以在此处找到更多信息：https://cloud.google.com/compute/docs/disks/create-snapshots。\n\
  \n## 现有磁盘\n\n现有磁盘也可以附加到新实例。要创建新磁盘，我们可以浏览到导航菜单并进入 **Compute Engine | Disk**。以下屏幕截图显示我们正在创建新的空白磁盘：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_95_0.png)\n\n图 4.20 – 一个新磁盘\n\n创建成功后，我们可以在部署新的\
  \ Compute Engine 实例时使用此新磁盘。以下屏幕截图显示了当我们点击“现有磁盘”选项卡时其外观。我们可以看到所有可用的磁盘：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_96_0.png)\n\
  \n图 4.21 – 现有磁盘\n\n我们也可以从前面的屏幕截图中看到，我们可以使用磁盘的快照作为启动盘。我们在本章前面讨论了如何拍摄快照。\n\n## 标签\n\
  \n还有许多其他可修改的选项。为了对相关资源进行分组，对 VM 实例进行标记是有益的。这有助于组织和筛选计费与报告。标签使用键值对工作，可用于例如区分项目、环境等。只需点击添加标签，你将被提示添加键值对，它将被保存并添加到主创建实例屏幕中，如下所示：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_96_1.png)\n\n图 4.22 – 标签\n\n前面的屏幕截图是此示例，其中我们可以将实例标记为生产环境。\n\
  \n## 机密 VM 服务\n\n启用此选项可在使用时加密数据。这将在处理期间保持数据在内存中加密，且 Google 无法访问加密密钥：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_97_0.png)\n\
  \n图 4.23 – 机密 VM 服务\n\n## 容器\n\n启用此选项可使用 Container-Optimized OS (COS) 部署和启动 Docker\
  \ 容器。请注意，每个 VM 实例只能部署一个容器。这与 Google Kubernetes Engine (GKE) 不同，我们将在第 6 章《使用 Google\
  \ Kubernetes Engine 管理 Kubernetes 集群》中讨论该主题：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_97_1.png)\n\
  \n图 4.24 – 容器\n\n前面的图显示了部署容器映像的简单复选框。\n\n## 删除保护\n\n启用此选项可防止 GCE 实例被意外删除。勾选此框将在实例资源上设置\
  \ deletionProtection 属性。通常，只有需要无限期运行的关键 VM 实例才会勾选此选项。即使勾选后，实例仍可被重置、停止，甚至在项目终止后被移除。只有具有\
  \ compute.instance.create 权限的用户才能修改此标志以允许受保护的 VM 被删除。\n\n## 预留\n\n可以在特定区域为 VM 实例创建预留，使用自定义或预定义机器类型。使用预留可确保在需要时为你的工作负载提供资源；然而，一旦创建预留，你将立即开始为其付费，直到预留被删除。使用预留前应考虑需求增长。此选项允许你选择现有预留、创建新预留或不使用。\n\
  \n## 元数据\n\n向 GCE 实例添加元数据允许未来的查询提取有关实例的信息。元数据存储在元数据服务器上，可以通过 Compute Engine API\
  \ 或实例本身进行查询。我们可以提取诸如主机名、实例 ID 或我们应用的任何自定义元数据等信息。我们还可以使用元数据向应用程序提供配置信息，从而无需将此数据存储在应用程序本身中。\n\
  \n我们还使用元数据引用在实例部署期间执行的启动脚本。假设我们在名为 deployments 的 Cloud Storage 存储桶上托管名为 startup.sh\
  \ 的启动脚本。为了确保其执行，我们需要添加存储桶和启动脚本的路径：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_98_0.png)\n\
  \n图 4.25 – 元数据\n\n前面的屏幕截图显示了在控制台中其外观。\n\n## 启动脚本\n\n在填充 GCE 部署的变量时，我们也可以设置启动脚本。这是实例启动或重启时运行的脚本。常见示例包括安装特定软件或确保服务已启动。这些脚本通过我们之前提到的同一元数据服务器指定，并使用启动脚本元数据键。同样，这些脚本也可以通过\
  \ gcloud 命令以及在控制台中添加。让我们看一下来自 CLI 的示例命令。这是在安装 apache2 并填充主页。请注意，运行此代码后，GCP 会要求我们确认区域：\n\
  \n```\ngcloud compute instances create cloudarchitect --tags http-server \\\n--metadata\
  \ startup-script='#! /bin/bash\n# Installs apache and a custom homepage\n```\n\n\
  ```bash\nsudo su -\napt-get update\napt-get install -y apache2\ncat <<EOF > /var/www/html/index.html\n\
  <html><body><h1>Hello World</h1>\n<p>This page was created from a simple start up\
  \ script!</p>\n</body></html>\nEOF'\n```\n\n也可以指定位于 Google Cloud Storage 上的脚本。同样，从\
  \ gcloud CLI，我们可以指定存储桶位置。在此示例中，我们的存储桶名为 `cloudarchitectbucket`：\n\n```bash\ngcloud\
  \ compute instances create example-instance --scopes\nstorage-ro \\\n    --metadata\
  \ startup-script-url=gs://cloudarchitectbucket/\nstartupscript.sh\n```\n\n> **考试提示**\n\
  > \n> 如果我们想指定关机脚本，则会浏览到元数据部分并添加 `shutdown-script` 作为键，并将脚本内容作为值添加。\n\n我们应注意，启动脚本仅在网络可用时执行。\n\
  \n## 可抢占性\n\n可抢占性会降低实例成本，但通常最多只能持续 24 小时，然后将被终止。某些操作，例如停止和启动实例，将重置此计数器。部署生命周期如此有限的\
  \ VM 听起来可能很奇怪，但如果我们在应用层具有容错能力，则利用可抢占实例可以带来显著的成本节约。让我们以批处理作业为例。\n\n这些可以在可抢占实例上运行，如果某些实例被终止，处理会变慢但不会完全停止。这允许批处理在不给现有实例增加额外工作负载的情况下进行。我们应注意，然而，由于可抢占实例的性质，没有\
  \ GCP **服务等级协议 (SLA)** 适用，且它们可在仅提前 30 秒通知的情况下被提供商移除。\n\n\n\n\n\n要设置一个可抢占实例，只需在创建新实例时在\
  \ **Availability policy** 下选择 **On**：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_100_0.png)\n\
  \n图 4.26 – 可抢占性\n\n## Availability policy\n\nCompute Engine 会对其基础设施进行维护，这可能需要将你的\
  \ VM 实例迁移到另一台主机。如果实例的可用性策略设置为使用此功能，GCE 将对你的实例进行实时迁移。因此，你的应用不会遭受任何停机，但可能会出现一定的性能下降。实时迁移是实例的默认设置。\n\
  \n或者，如果你在应用层内置了高可用性，那么你可能希望将此设置更改为在另一台主机上终止并重新启动。此设置意味着你的实例将被干净地关闭并在新的主机上重新启动。Google\
  \ 会根据所选设置报告任何维护问题以及它对你的实例的影响。\n\n## Automatic restart\n\n如果底层硬件导致你的实例崩溃，则 GCE 提供了一个设置来自动重启实例。此设置默认设置为\
  \ **On (recommended)**。你可以通过从下拉菜单中选择将其设置为 **Off**：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_100_1.png)\n\
  \n图 4.27 – 自动重启\n\nGoogle 会在 **Compute Engine** 菜单下的 **Operations** 中报告任何自动重启，如前面的屏幕截图所示。选择此项后，我们可以查看任何警报：\n\
  \nOperations\n\n![](img/de2c97ab017f36b3750a5bade111edd7_101_0.png)\n\n图 4.28 –\
  \ Operations\n\n前面的屏幕截图显示了这些警报在 **Operations** 屏幕上的外观。\n\n## Shielded VM\n\n让我们现在查看安全部分。第一个选项是\
  \ Shielded VM。GCP 提供了使用安全控制来加固你的 VM 实例的能力，这将抵御 rootkits、bootkits 和内核级恶意软件。GCP 使用\
  \ **虚拟可信平台模块 (vTPM)** 来提供虚拟信任根，以验证 VM 的身份并确保它们属于指定的项目或区域。vTPM 在客户操作系统级别生成和存储加密密钥。需要注意的是，这不会为你的\
  \ VM 部署增加任何额外成本。\n\n## Deletion rule\n\n在 **Disks** 部分下，我们会找到 **Deletion rule**。此选项允许我们在实例被删除时删除或保留启动磁盘：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_101_1.png)\n\n图 4.29 – 磁盘选项\n\n如果有保留启动磁盘的特定用例，请确保取消选中该复选框。你还可以选择如何加密你的数据。默认情况下将使用\
  \ Google 管理的密钥，但你可以更改为使用其他选项。\n\n## Node affinity labels\n\nSole tenancy 于 2018\
  \ 年引入 GCE，是一种专为你的专用使用而设计的物理 Compute Engine 服务器。换句话说，底层主机硬件和 hypervisor 仅处理你的 GCE\
  \ 实例。此设置的一个用例可能是安全要求。许多公司有合规或法规要求，需要对其计算资源进行物理隔离。\n\n下图显示了这种分割。我们可以看到，在左侧，不同的客户共享相同的硬件，但在右侧，我们为特定客户提供了专用硬件，并且只有他们的\
  \ VM 驻留在上面：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_102_0.png)\n\n图 4.30 – 节点亲和性\n\
  \nVM 仍将具有相同的实时迁移功能和共享实例，但存在成本影响。并非所有区域和区域都支持 sole tenancy。\n\n当我们创建 VM 时，我们有选项添加一个标签来定义新实例将被部署的位置。要使用\
  \ sole tenancy，我们首先必须从控制台在 **Compute Engine | Sole tenant nodes** 下创建一个 sole-tenant\
  \ 节点。请注意，我们也可以为此使用 `gcloud` 命令。点击 **Create a node template**，并设置 **Region** 和 **Node\
  \ type**。以下屏幕截图显示了可用的不同选项。我们也可以利用标签来提供键/值对，例如 `Environment:HighSecureArea`：\n\n\
  ![](img/de2c97ab017f36b3750a5bade111edd7_103_0.png)\n\n图 4.31 – 创建节点模板\n\n模板创建后，在同一菜单页面上，我们现在可以创建一个\
  \ sole-tenant 节点。同样，我们可以提供名称，选择区域和模板，并定义我们需要的节点数量。请注意，区域需要与你创建模板的区域匹配：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_104_0.png)\n\
  \n图 4.32 – Sole-tenant 节点\n\n我们现在可以从 sole tenancy 中创建 VM。还可以进行一些更高级的设置，但我们将在后面的章节中更深入地探讨这些设置：\n\
  \n- 有关防火墙，请参阅 *第 10 章，GCP 中的网络选项*。\n- 有关安全和加密设置，请参阅 *第 15 章，安全与合规*。\n\n## GPUs and\
  \ TPUs\n\n除了标准的 vCPU 外，Compute Engine 还提供 **图形处理单元 (GPUs)**。这些可用于图形密集型工作负载，例如 3D\
  \ 渲染或虚拟应用。我们在此应注意，GPU 只能附加到预定义或自定义机器类型，并且仅在某些区域可用。它们也有资格获得我们从标准 vCPU 获得的折扣（请注意，我们将在本章后面更详细地讨论持续使用折扣）。当我们创建新实例时，我们可以通过展开\
  \ **CPU platform and GPU** 部分来添加 GPU，如以下屏幕截图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_105_0.png)\n\
  \n图 4.33 – GPU 配置\n\n**张量处理单元 (TPUs)** 是使用 Google 在 **机器学习 (ML)** 方面的经验设计定制的专用集成电路，可用于在构建\
  \ TensorFlow 计算集群和其他 ML 工作负载时最大化性能和灵活性。我们可以从导航菜单访问 TPU 并进入 **Compute Engine | TPUs**。一旦启用\
  \ API，我们就可以创建我们的第一个 TPU 节点。从以下屏幕截图中，你可以看到我们可以分配 **Zone**、**TPU type**、**TPU software\
  \ version**、**Network** 和 **IP address range**。TPU 应与你要连接的 Compute Engine 实例位于同一区域：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_106_0.png)\n\n图 4.34 – TPU 配置\n\n在 TPU\
  \ 配置的管理部分，我们还可以为 TPU 节点启用可抢占性。\n\n## Instance templates and instance groups\n\n\
  即使我们想到本地架构，许多关键要求也围绕高可用性和可扩展性。当然，当我们在公有云中进行架构时，这不会改变，但它们变得更容易且更便宜！\n\n我们之前见过如何部署单个\
  \ GCE 实例，但很少有组织会迁移到公有云来托管单个 VM。业务需求取决于对需求的反应能力以及对任何实例故障的反应能力。\n\n部署到实例组中的每个 VM 实例都来自同一个实例模板，该模板定义了机器类型、启动磁盘映像、标签以及我们在本章前面讨论过的其他实例属性。实例模板是全局资源，这意味着它们与特定区域或区域无关。模板本身中的区域资源将限制模板只能在该资源所在的区域中使用。例如，模板可能包含绑定到特定区域的磁盘。\n\
  \n了解实例组有两种类型很重要：\n\n- **Managed instance groups**：这种类型的实例组允许你的工作负载通过组中的自动化服务（如自动扩缩或自动修复）实现可扩展性和高可用性。Google\
  \ 建议使用这种类型的组，除非由于预先存在的配置或需要对不相似的实例进行分组而无法避免。\n\n- **Unmanaged instance groups**：这种类型的实例组允许对非相同的\
  \ VM 集群进行负载均衡。它们由用户管理，因此不支持自动扩缩和自动修复。\n\n\n\n\n\n让我们看一个创建新的实例模板和组的示例：\n\n+   1.\
  \ 从导航菜单中，我们应浏览到 **Compute Engine | Instance templates**：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_108_0.png)\n\
  \n图 4.35 – Instance templates\n\n2. 我们可以像创建新的 VM 实例一样命名并更新设置。在之前的示例中，我们通过 gcloud\
  \ 命令设置了启动脚本，但在本次示例中，让我们从控制台进行设置。我们在 Metadata 选项中添加此项，并使用 startup-script-url 键，gs://cloudarchitect/startup.sh\
  \ 作为其值：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_109_0.png)\n\n图 4.36 – Metadata\n\
  \n3. 点击 Instance Groups，然后创建一个新的实例组：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_109_1.png)\n\
  \n图 4.37 – Creating an instance group\n\n让我们看看在创建实例组时我们可以指定的不同选项。\n\n## Setting\
  \ the location\n\n在这里，我们可以设置是否需要多个或单个区域。此选择将基于您的可用性要求。如果您需要高可用性，那么最好选择多个区域；不过，您需要注意，这会将您的组类型限制为\
  \ *managed only*。它还提供了一个名为 **Target distribution shape** 的额外字段，其中默认值为 **Even**。默认情况下，区域托管实例组会在所选区域中均匀分布托管实例。然而，如果例如您需要某些在所选区域中不可用的硬件，则可能需要更改此设置。还有其他形状可用，但需要注意的是，**Balanced**\
  \ 和 **Any** 选项不支持自动扩缩、canary 更新或主动实例重新分布。您需要删除默认的自动扩缩配置才能选择 **Balanced** 或 **Any**：\n\
  \nLocation\n为确保更高的可用性，请为实例组选择多个区域位置。\nLearn more\n\n+   - Single zone\n+   - Multiple\
  \ zones\n+     Only managed instance groups can exist in multiple zones.\n\nRegion\n\
  Region is permanent\neurope-north1\n\nConfigure zones\n\nTarget distribution shape\n\
  您只能在创建实例组时设置目标分布形状。之后无法更改。\n\n+   - Even\n+     在各区域中均匀分布托管实例\n+   - Balanced\n\
  +     根据各区域的资源可用性尽可能均匀地分布托管实例\n+   - Any\n+     根据各区域的资源可用性将托管实例部署到一个或多个区域\n\nInstance\
  \ redistribution\nEnable instance redistribution\n\n图 4.38 – Multiple zones\n\n\
  我们可以在前面的屏幕截图中看到，选择 **Multiple zones** 后，我们被告知 **Only managed instance groups can\
  \ exist**。此外，如果我们选择 **Configure zones** 下拉菜单，我们可以选择要在其中分布实例的区域内的区域。\n\n## Port name\
  \ mapping\n\n如果我们选择 **Single zone** 选项，则会显示一个可选设置，称为 **Port Name Mapping**。我们可以在与负载均衡器结合使用时使用此功能。我们可以指定端口名称和相关联的端口号，并将传入流量映射到此特定号码。\n\
  \n当然，我们还需要指定要为此托管组使用的实例模板。此选项仅在组类型选项中选择托管实例组时可用。我们还需要选择实例组要部署的实例数量。\n\n我们有能力打开、关闭或调整自动扩缩。自动扩缩允许根据需求的增加或减少动态增长或确实删除您的\
  \ VM 实例。我们将在本章中更详细地讨论自动扩缩。\n\n当我们填入所需的一切后，我们可以点击 **Create Instance Group**。组现在将创建我们在实例组中指定的\
  \ VM 数量。在 **Compute Engine | Instance groups** 下，我们可以看到连接到实例组的正在运行的实例。\n\n## Autoscaling\n\
  \n我们之前提到了自动扩缩，它值得单独一个章节。自动扩缩是云计算的基本原则。它允许资源具有弹性，并可以根据需求增加和减少实例数量。需要提醒的是，我们只能对托管实例组使用自动扩缩。这是因为只有托管实例组会使用专用模板，而该模板又可作为同质\
  \ VM 实例池的基础。\n\n一旦在实例组中启用自动扩缩，它还会启用 **autoscaling policy** 下的许多设置。这些策略可以基于 CPU 使用率、HTTP\
  \ 负载均衡使用率或 Google Cloud operations suite-monitoring 指标。我们还应在此处注意，可以基于自定义指标进行自动扩缩，因此我们不仅依赖开箱即用的指标。\n\
  \n以下示例基于 CPU 使用率，这是最简单的自动扩缩形式。自动扩缩器会收集组中实例的 CPU 利用率，并决定是否需要扩缩组或应保持当前 VM 实例数量。\n\n\
  查看以下屏幕截图，让我们看看应填写的设置：\n\n+   - **Target CPU usage:** 这设置为 60%。这意味着自动扩缩器应保持实例组中所有\
  \ vCPU 的平均 CPU 使用率为 60%。\n+   \n+   - **Minimum number of instances:** 这是自动扩缩器应缩容到的实例最小数量。\n\
  +   \n+   - **Maximum number of instances:** 这是自动扩缩器应扩容到的实例最大数量。\n+   \n+   - **Predictive\
  \ autoscaling:** 托管实例组可以配置为根据负载自动添加或删除虚拟机实例。如果例如应用程序初始化需要几分钟时间，这可能不适合所有应用程序。预测性自动扩缩会根据历史趋势预测扩缩指标，并每隔几分钟重新计算一次。它需要至少\
  \ 3 天的历史记录来收集服务使用模式，因此在创建新的自动扩缩配置时无法启用。它也只能在应用了 CPU 利用率指标时启用。\n+   \n+   - **Cool\
  \ down period:** 此数字表示自动扩缩器在 VM 实例启动后等待多少秒才开始从中收集信息。对于缩容决策，它必须考虑所有实例的使用数据，无论实例是否仍处于冷却期内。对于扩容决策，它必须忽略仍处于冷却期内的实例的数据。如果启用了预测模式，冷却期会告知预测自动扩缩器应进一步扩容，以确保应用程序在负载到达时已初始化。\n\
  \n通常，这是您期望应用程序从启动到准备好提供服务所需的时间。默认时间为 60 秒，低于此时间可能会被认为会向自动扩缩器提供错误信息。但是，建议您测试应用程序初始化所需的时间：\n\
  \n## New metric\n\nMetric type\n\nCPU utilization\n\nTarget CPU utilization\n\n\

  \n## Control plane version\n\n选择用于自动管理集群版本和升级节奏的发布渠道。选择静态版本以更直接地管理集群的版本。了解更多。\n\n\
  Static version\nRelease channel\n\nRelease channel\nRegular channel (default)\n\n\

  \ Google Cloud 的公司来说，这可能是一个里程碑。\n\n## 用例\n\nGoogle Cloud VMware Engine 有许多用例，例如数据中心扩展或迁移，以允许公司在保持现有工作负载兼容性的同时扩展到公共云。灾难恢复也是该服务的另一个巨大优势，因为公司可以利用\
  \ Google 的全球基础设施来提高可用性。HCX 用于迁移和灾难恢复。本地数据中心与 Google Cloud 之间专用互连链路的存在允许在两个端点之间轻松迁移虚拟机和服务。Google\
  \ 正在努力将其作为进入云的最快、最简单的方式进行销售。对于一些不想因迁移到云以实现目标而感到被迫重新培训员工或重构应用程序以保持运营连续性的公司来说，这可能是一件重要的事情。\n\
  \n需要注意的一件重要事情是，基于角色的访问控制（RBAC）和计费都归属于您的 Google 账户下。所有内容都在一个横幅下。这允许 VMware 平台轻松集成到\
  \ Google 的原生服务中。\n\n在使用该服务之前有一些先决条件和要求。在高层次上，这里有一些需要考虑的事项。首先，我们需要启用 **VMware Engine\
  \ API**。我们可以直接从 GCP 主菜单中执行此操作：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_123_0.png)\n\
  \n图 4.48 – VMware Engine\n\n然后我们必须设置私有服务访问，这是在您的虚拟私有云（VPC）与 VMware Engine 中的网络之间的私有连接。您还必须保留不会与任何本地子网、VPC\
  \ 子网或计划的工作负载子网重叠的地址范围。最后，VMware Engine 有一套特定的 IAM 角色，因此应考虑确保应用最小权限原则。\n\n## 配额和限制\n\
  \nCompute Engine 带有预定义的配额。虚拟机实例是区域配额的一部分，因此对可在给定区域中存在的虚拟机实例数量施加了限制。这些默认配额可以在控制台中通过汉堡菜单更改，然后进入\
  \ IAM & Admin | Quotas。从此菜单中，我们可以查看当前配额并请求提高这些限制。我们建议您了解每个服务的限制，因为这可能会影响您的可扩展性。\n\
  \n## IAM 角色\n\n对 GCE 的访问通过 IAM 保护。让我们看一下预定义角色的列表，以及每个角色的简短描述：\n\n- **Compute 管理员角色**：此角色有权访问所有\
  \ Compute Engine 资源。\n- **Compute 镜像用户角色**：此角色有权列出和读取镜像。\n- **Compute 实例管理员（v1）角色**：此角色有权完全管理\
  \ Compute Engine 实例、实例组、磁盘、快照和镜像。它还对所有 Compute Engine 网络资源具有读取访问权限。\n- **Compute\
  \ 实例管理员角色**：此角色有权创建、修改和删除虚拟机实例。此外，它有权创建、修改和删除磁盘，并配置受保护虚拟机设置。\n- **Compute 负载均衡器管理员角色**：此角色有权创建、修改和删除负载均衡器及其相关资源。\n\
  - **Compute 网络管理员角色**：此角色有权创建、修改和删除网络资源，但防火墙规则和 SSL 证书除外。此外，该角色对防火墙规则、SSL 证书和实例（以查看其临时\
  \ IP 地址）具有只读权限。使用此角色，您无法创建、启动、停止或删除实例。\n- **Compute 网络用户角色**：此角色有权访问共享 VPC 网络。\n\
  - **Compute 网络查看者角色**：此角色对所有网络资源具有只读权限。\n- **Compute OS 管理员登录角色：** 此角色有权以管理员身份登录到\
  \ Compute Engine 实例。\n- **Compute 组织防火墙策略管理员角色：** 此角色对 Compute Engine 组织防火墙策略具有完全控制权。\n\
  - **Compute 组织防火墙策略用户角色：** 此角色可以查看或使用 Compute Engine 防火墙策略将其与组织或文件夹关联。\n- **Compute\
  \ 组织安全策略管理员角色：** 此角色对 Compute Engine 组织安全策略具有完全控制权。\n- **Compute 组织防火墙策略用户角色：**\
  \ 此角色可以查看或使用 Compute Engine 安全策略将其与组织或文件夹关联。\n- **Compute 组织资源管理员角色：** 此角色对组织或文件夹的\
  \ Compute Engine 防火墙策略关联具有完全控制权。\n- **Compute OS 登录角色：** 此角色有权以管理员身份登录到 Compute\
  \ Engine 实例。\n- **Compute OS 登录外部用户角色：** 此角色仅在组织级别可用。它为外部用户提供访问权限，以便设置与该组织关联的 OS\
  \ 登录信息。\n- **Compute 数据包镜像管理员角色：** 此角色提供指定要镜像的资源的访问权限。\n- **Compute 数据包镜像用户角色：**\
  \ 此角色提供使用被镜像资源的访问权限。\n- **Compute 公共 IP 管理员角色：** 此角色对 Compute Engine 的公共 IP 地址管理具有完全控制权。\n\
  - **Compute 安全管理员角色：** 此角色有权创建、修改和删除防火墙规则和 SSL 证书。该角色还有权配置受保护虚拟机设置。\n- **Compute\
  \ 存储管理员角色：** 此角色有权创建、修改和删除磁盘、镜像和快照。\n- **Compute 查看者角色：** 此角色对 Compute Engine 资源具有只读访问权限。它无权读取存储在其上的数据。\n\
  - **Compute 共享 VPC 管理员角色：** 此角色有权管理共享 VPC 主项目。该角色由组织管理员在组织上设置。\n\n\n\n\n\n- **补丁部署管理员角色：**\
  \ 这提供了对补丁部署的完全访问权限。\n- **补丁部署查看者角色：** 这提供了查看补丁部署的访问权限。\n- **路径作业执行者角色：** 这提供了执行补丁作业的访问权限。\n\
  - **补丁作业查看者角色：** 这提供了获取补丁作业列表的访问权限。\n- **DNS 管理员角色：** 这对所有云 DNS 资源具有读写权限。\n- **DNS\
  \ 对等角色：** 这具有使用 DNS 对等区域定位网络的权限。请注意，在撰写本文时，该功能处于 beta 阶段。\n- **DNS 读者角色：** 这对所有云\
  \ DNS 资源具有只读访问权限。\n- **服务账号管理员角色：** 这具有创建和管理服务账号的权限。\n- **创建服务账号角色：** 这具有创建服务账号的权限。\n\
  - **删除服务账号角色：** 这具有删除服务账号的权限。\n- **服务账号密钥管理员角色：** 这具有创建和管理服务账号密钥的权限。该角色具有轮换密钥的权限。\n\
  - **服务账号令牌创建者角色：** 这具有冒充服务账号的权限。\n- **服务账号用户角色：** 这具有以服务账号身份运行操作的权限。\n- **工作负载身份用户角色：**\
  \ 这具有从 GKE 工作负载冒充服务账号的权限。对于更细粒度的访问，您也可以使用所有者、编辑者和查看者等原始角色，但我们应始终遵循最小权限原则。\n\n> **考试提示**\n\
  > 如果您想调试 VM 实例中的问题，请授予计算实例管理员角色，而不是计算管理员角色。后者对所有 Compute Engine 资源具有完全控制权，而前者权限较低。\n\
  \n在下一节中，我们将查看定价。\n\n## 定价\n\nGoogle 的计费模式意味着您按每 1 秒计费 vCPU、GPU 和 GB 内存，最低计费为 1 分钟。然而，Google\
  \ 还提供了大幅降低月度账单的机会。持续使用折扣可降低运行特定 GCE 资源的成本。\n\n持续使用折扣会自动应用于特定 Compute Engine 资源，并可为以下资源的\
  \ vCPU 和内存带来月度节省：\n\n- 通用型自定义和预定义机器类型\n- 计算优化型机器类型\n- 内存优化型机器类型\n\n独占租户节点也将获得折扣。我们在前面的章节中更详细地讨论了它们。此外，对\
  \ GPU 设备也适用节省。\n\n如果我们运行上述资源超过一个月的 25%，则 GCE 会自动对您使用的每分钟进行折扣。折扣会随着使用量的增加而增加，每月最高可达\
  \ 30% 的折扣。例如，通用型 N2 和 N2D 预定义和自定义镜像以及计算优化型机器类型可为我们提供高达 20% 的折扣。对于通用型 N1 预定义和自定义机器类型、独占租户节点和\
  \ GPU，可为我们提供高达 30% 的折扣。只有在月初创建 VM 实例时才能充分利用折扣，因为折扣会在每月开始时重置。如果我们在月中部署实例，则预计折扣约为\
  \ 10%。\n\n需要重点注意的一点是如何计算账单。在高层次上，让我们看一个在同一区域创建但在月份不同时间运行的两种不同机器类型的示例：\n\n- 从月初到月中运行的\
  \ n1-standard-4 实例，拥有 4 个 vCPU 和 15 GB 内存\n- 从月中到月末运行的 n1-standard-16 实例，拥有 16 个\
  \ vCPU 和 60 GB 内存\n\n在此示例中，Compute Engine 会将机器类型整理为单独的 vCPU 和内存资源并合并其使用量。它会将其分解为以下内容：\n\
  \n- 全月 4 个 vCPU\n- 半个月 12 个 vCPU\n- 全月 15 GB 内存\n- 半个月 45 GB 内存\n\n因此，我们可以看到在 n1-standard-4\
  \ 实例中创建的 4 个 vCPU 和 15 GB 内存的折扣会转移到 n1-standard-16 实例，这意味着对 4 个 vCPU 和 15 GB 内存有完整的\
  \ 30% 折扣。附加到 n1-standard-16 实例的剩余 12 个 vCPU 和 45 GB 内存仅从第 2 周开始才有折扣，这意味着折扣为 10%。\n\
  \n另一种提供的折扣方法是 **承诺使用** 折扣，即我们可以购买特定数量的 vCPU 和内存，期限为 1 年或 3 年。折扣可达大多数自定义机器类型的 57%，甚至对更内存优化的机器类型可达\
  \ 70%。没有预付费用，但折扣会应用于您的月度账单。您将在约定的期限内每月被收取所选的 vCPU 和内存费用。\n\n折扣通过购买承诺来应用。假设例如，我们承诺使用\
  \ 8 个核心，但运行 16 个核心 10 小时。我们将对 10 小时内的 8 个核心获得折扣，但剩余的 8 个核心将按标准计费。然而，剩余的核心仍有资格获得持续使用折扣。同样，如果我们在一个月的周期内未使用\
  \ 8 个承诺的核心，我们仍会被收取费用，因此我们应确保只承诺我们将使用的资源。承诺使用折扣还有一些其他重要的注意事项。\n\n折扣按以下顺序应用于资源：\n\n\
  1. 自定义机器类型\n2. 独占租户节点组\n3. 预定义机器类型\n\n让我们再举一个例子来更清楚地说明。假设我们有一个自定义机器，拥有 5 个 vCPU\
  \ 和 50 GB 内存，以及一台预定义机器。如果我们为承诺使用购买 10 个 vCPU 和 15 GB 内存，折扣将首先应用于我们自定义机器类型的 5 个 vCPU，剩余的\
  \ 5 个折扣 vCPU 将应用于预定义机器类型。同样，承诺使用内存的全部 15 GB 折扣将应用于我们的自定义类型内存。\n\n## 总结\n\n在本章中，我们介绍了\
  \ GCP 的 IaaS 产品——Compute Engine。这是 Google 的基础产品，与传统的 VM 相符。我们讨论了如何部署实例以及如何将实例添加到实例组以自动扩展我们的服务，因此我们现在可以确信在\
  \ GCP 中运行 VM 实例是多么容易。此外，我们还查看了部署 Compute Engine 实例时可以选择的各种可选设置。我们还介绍了容器以及 VMware\
  \ Engine 如何加快向公有云的迁移。在下一章中，我们将远离 IaaS 并介绍 GKE。\n\n## 延伸阅读\n\n我们建议您查看以下网址以获取更多信息：\n\
  \n- **Compute Engine:** https://cloud.google.com/compute/docs/\n- **Compute Engine\
  \ IAM 角色和权限:** https://cloud.google.com/compute/docs/access/iam\n\n# 5\n探索 Google\
  \ App Engine 作为计算选项\n\nApp Engine 是一种 **平台即服务 (PaaS)** 产品。它是让您的应用程序在 Google Cloud\
  \ 上运行的最快方式。它适用于 Web、移动和物联网应用程序，免除了管理执行环境的开销，并可按需快速扩展。支持多种语言，例如 **Node.js、Java、Ruby、C#、Go、Python**\
  \ 和 **PHP**。这样，开发人员就可以专注于交付代码。应用程序是版本化的，并且可以将流量定向到多个版本，从而允许我们执行 A/B 或金丝雀测试。App Engine\
  \ 中的应用程序可以使用防火墙、IAM 角色和 SSL 证书进行保护，并可使用 Web Security Scanner 服务扫描常见漏洞。\n\n本章将涵盖以下主题：\n\
  \n- App Engine 组件\n- 选择合适的区域\n- 使用 App Engine\n- 环境类型\n\n\n\n\n\n- 部署 App Engine\
  \ 应用\n- 版本\n- 拆分流量\n- 迁移流量\n- 防火墙规则\n- 设置\n- 扩缩容\n- Cron 作业\n- Memcache\n- IAM\n\
  - 配额和限制\n- 价格\n\n> **考试提示**\n> 在 Cloud Architect 考试中，预计会出现几个关于 App Engine 的问题。然而，还有另一门考试（Cloud\
  \ Developer）会详细测试你对 App Engine 的知识。对于本考试，确保你了解 App Engine 的工作原理、两种 App Engine 环境类型——即标准和灵活——两种类型的\
  \ Memcache 及其用例、版本控制、如何拆分迁移流量、cron 作业的用途、自定义域名以及可以使用哪些 SSL 证书。\n\n## App Engine\
  \ 组件\n\n首先，我们需要明白每个项目只能托管一个 App Engine 应用。\n\n该应用可以拥有多个服务，每个服务有多个版本，如下图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_133_0.png)\n\
  \n图 5.1 – App Engine 组件\n\n向终端用户提供哪个版本是基于网络流量的配置。我们决定将多少百分比的流量导向特定版本。这意味着进行新的发布甚至回滚变得非常容易。\n\
  \n## 选择合适的区域\n\nApp Engine 中的应用按区域部署。这意味着用于托管它的基础设施分布在该区域内的各个区域中，以实现高可用性。选择区域时主要考虑的是你的终端用户将从何处连接。然而，你还应该记住你的应用可能会使用其他\
  \ GCP 资源。这也会影响延迟和成本。请查阅文档以查看 App Engine 服务可用的区域，因为这可能会发生变化。\n\n**重要说明**\n一旦应用部署完成，就无法更改其区域。\n\
  \n## 使用 App Engine\n\n部署本身相当容易。我们定义一个 app.yaml 文件来定义应用并开发代码。通过使用 gcloud app deploy，应用将被部署到\
  \ App Engine：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_134_0.png)\n\n图 5.2 –\
  \ 使用 App Engine\n\n前面的示例非常简单，你可以创建更复杂的应用程序。Cloud Architect 考试不需要你深入了解如何定义 app.yaml\
  \ 文件或如何编写应用程序的细节。然而，我们建议你查看“进一步阅读”部分，因为它可能有助于你更好地理解 App Engine 概念。\n\n## 环境类型\n\n\
  App Engine 包含两种环境类型，即标准和灵活。如果没有特殊要求，例如不支持的语言或需要自定义执行环境，始终选择标准。请记住，灵活的 App Engine\
  \ 将使你更轻松地迁移工作负载，因为你的工作负载已经容器化。让我们来看看这些环境类型。\n\n## App Engine 标准环境\n\n标准环境使用在 GCP\
  \ 中运行的 **容器**。这些容器针对每个可用的执行环境进行了标准化。流向你的应用的流量通过负载均衡进行分发。应用在未使用时可以缩减至零，并在需求上升时在几秒钟内扩展。支持以下执行环境：\n\
  \n- Python 2.7 和 3.7\n- Java 8 和 11\n- Node.js 8 和 10\n- PHP 5.5、7.2 和 7.3\n- Go\
  \ 1.9、1.11 和 1.12\n\n> **考试提示**\n> App Engine 标准通常也定义为开发人员的沙箱。\n\n我们现在来看灵活环境。\n\n\
  ## 灵活环境\n\n灵活环境使用 GCE **虚拟机实例**。它也会自动扩缩容并使用负载均衡分发流量。然而，它始终至少需要一个实例运行。启动实例需要几分钟，而在标准环境中则需要几秒钟。支持以下执行环境：\n\
  \n- Java 8\n- Python 2.7 和 3.6\n- Node.js\n- Ruby\n- PHP 5.6、7.0、7.1 和 7.2\n- .NET\
  \ Core\n- Go 1.9、1.10 和 1.11\n- 自定义\n\n请注意，运行时可以自定义。你甚至可以创建自己的运行时。这可以通过提供自定义 Docker\
  \ 镜像或 Dockerfile 来完成。\n\n> **考试提示**\n> 如你所见，App Engine 标准环境可以缩减至零，而灵活环境将始终至少运行一个实例。这会影响运行应用的成本。\n\
  \nApp Engine 灵活环境服务允许你通过安全 shell，即 SSH，以 root 账户访问实例。然而，默认情况下这是禁用的。请记住，实例每周会重启一次以应用必要的补丁。\n\
  \n## 部署 App Engine 应用\n\n我们已经在高层次上看到了如何将应用部署到 App Engine。现在，让我们来看看实际需要采取的步骤。在这里，我们将部署一个\
  \ Hello World 应用。该应用利用 Python Flask Web 服务器。正如你可能想象的那样，该应用将在网站上显示静态的 Hello World\
  \ 文本。让我们开始吧：\n\n1. 首先，前往 Google Cloud 控制台并切换到你的应用将被部署到的项目。从汉堡菜单中选择 App Engine。在欢迎屏幕上，点击创建应用按钮：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_136_0.png)\n\n图 5.3 – 欢迎使用 App Engine\n\
  \n2. 在 **创建应用** 窗口中，选择一个区域并点击 **创建应用**，如下截图所示：\n\n# Create app\n\n1 Select a location\
  \ — 2 Get started\n\n# Region\n\nRegion is permanent.\n\n![](img/de2c97ab017f36b3750a5bade111edd7_137_0.png)\n\
  \nSelect a region *\neurope-west\n\nNEXT\n\n图 5.4 – 选择区域\n\n我们选择了 europe-west 作为我们的区域。\n\
  \n3. 在开始窗口中，选择运行时语言。我们选择了 Python：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_138_0.png)\n\
  \n图 5.5 – 选择语言\n\n4. 从环境下拉菜单中选择标准或灵活。由于我们不需要运行时自定义，我们选择了标准环境：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_138_1.png)\n\
  \n图 5.6 – 选择环境\n\n5. 现在，我们可以使用机器上的安装 SDK 或使用 Cloud Shell 机器。要了解如何使用这两个工具，请查看 *第\
  \ 16 章，Google Cloud 管理选项。*\n\n我们将打开 Cloud Shell，因为它已预装并配置了 SDK。打开控制台并运行以下命令：\n\n\
  ```\ngcloud config set project $PROJECT\n```\n\n这里，<project_id> 是你在 Google Cloud\

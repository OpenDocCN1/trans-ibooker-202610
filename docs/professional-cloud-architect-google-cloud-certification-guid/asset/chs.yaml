  10\n\n\n\n\n\n我们还应理解，随着托管实例组规模的增长，添加相同规模的 VM 所带来的影响会减小。让我们澄清一下这里的意思。假设我们将 CPU 利用率设置为\
  \ 75%，实例组中的最小实例数为三台。自动扩缩器会检查 VM 实例的总体平均值是否高于 75%。如果自动扩缩器添加了第四台 VM，它就为该组增加了 25% 的容量。\n\
  \n如果我们实例组的最大值为 10 台 VM，那么第十台 VM 仅贡献了 10% 的额外容量——因此第十个节点的<|message|>影响与第四个节点不同。在设置利用率和最大容量时，我们应牢记这一点。还需要注意的是，自动扩缩始终会保守地向上取整统计数据。它宁愿启动一个实际上不需要的额外\
  \ VM 实例，也不愿可能耗尽资源。\n\n基于 HTTP 负载均衡的扩缩将根据 VM 实例的负载进行扩缩。负载均衡器会在创建 HTTP 负载均衡器时配置的后端服务之间分配负载。当实例组用于后端时，外部负载均衡器提供两种平衡模式——**utilization**，允许我们为实例组中所有实例的平均后端利用率指定一个最大目标，以及\
  \ **rate**，我们必须指定每秒请求数的目标值。这是按实例或按组进行的。\n\n自动扩缩策略中的 **Target HTTP load balancing\
  \ utilization** 值应为负载均衡器设置中配置值的分数。例如，如果将策略设置为每秒 100 个请求，那么明智的做法是略低于此值进行扩缩，并将策略中的使用量设置为大约每秒\
  \ 80 个请求（80%）：\n\n## New metric\n\nMetric type\n\nHTTP load balancing utilization\n\

  \ authorization checks.\n\nFor more information, refer to https://cloud.google.com/iap/docs/concepts-overview。\n\
  \nIAP is integrated through Ingress for GKE. This integration enables you to control\
  \ resource-level access for employees instead of using a VPN.\n\nFor more information,\
  \ refer to https://cloud.google.com/iap/docs/cloud-iap-context-aware-access-howto。\n\
  \n9. A: If you are connecting from anywhere over the public internet, it's best\
  \ to enable Identity-Aware Proxy TCP forwarding for your project.\n\nFor more information,\
  \ refer to https://cloud.google.com/compute/docs/instances/connecting-to-windows。\n\
  \n10. A: Policies to restrict public IP addresses but allow some exceptions。\n\n\
  11. A: By default, all VM instances are allowed to use external IP addresses.\n\n\
  The allowed/denied list of VM instances must be identified by the VM instance name,\
  \ in the form: projects/PROJECT_ID/zones/ZONE/instances/INSTANCE.\n\nFor more information,\
  \ refer to https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints。\n\
  \n12. D: Workload Identity is the recommended way to access Google Cloud services\
  \ from applications running within GKE, due to its improved security properties\
  \ and manageability. For information about alternative ways to access Google Cloud\
  \ APIs from GKE, refer to https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity。\n\
  \n\n\n\n\n13. A: \"Shared VPC lets organization administrators delegate administrative\
  \ responsibilities, such as creating and managing instances, to Service Project\
  \ Admins while maintaining centralized control over network resources such as subnets,\
  \ routes, and firewalls.\" For more information, refer to https://cloud.google.com/vpc/docs/shared-vpc.\n\
  \n14. C: Knative provides an open API and runtime environment that enables you to\
  \ run your serverless workloads anywhere you choose – fully managed on Google Cloud,\
  \ on Anthos on Google Kubernetes Engine (GKE), or on your own Kubernetes cluster.\
  \ Knative makes it easy to start with Cloud Run and later move to Cloud Run for\
  \ Anthos, or start in your own Kubernetes cluster and migrate to Cloud Run in the\
  \ future. By using Knative as the underlying platform, you can move your workloads\
  \ freely across platforms, while significantly reducing the switching costs. For\
  \ more information, refer to https://cloud.google.com/knative.\n\n15. B: \"With\
  \ Anthos Config Management, you can create a common configuration across all your\
  \ infrastructure, including custom policies, and apply it both on-premises and across\
  \ clouds. Anthos Config Management evaluates changes and rolls them out to all Kubernetes\
  \ clusters so that your desired state is always reflected.\"\n\nFor more information,\
  \ refer to https://cloud.google.com/anthos/config-management.\n\n16. C: Cloud SQL\
  \ is a fully managed database service that helps you set up, maintain, manage, and\
  \ administer your relational databases in the cloud. For more information, refer\
  \ to https://cloud.google.com/sql/docs/mysql/connect-run.\n\n17. A: \"A Network\
  \ Endpoint Group (NEG) specifies a group of backend endpoints for a load balancer.\
  \ A serverless NEG is a backend that points to a Cloud Run (https://cloud.google.com/run/docs),\
  \ App Engine (https://cloud.google.com/appengine/docs), or Cloud Functions (https://cloud.google.com/functions/docs)\
  \ service.\"\n\n\"If a backend service contains several NEGs, the load balancer\
  \ balances traffic by forwarding requests to the serverless NEG in the closest available\
  \ region. However, backend services can only contain one serverless NEG per region.\
  \ To make your Cloud Run service available from multiple regions, you will need\
  \ to set up cross-region routing. You should be able to use a single URL scheme\
  \ that works anywhere in the world yet serves user requests from the region closest\
  \ to the user. If the closest region is unavailable or is short on capacity, the\
  \ request will be routed to a different region.\"\n\nFor more information, refer\
  \ to https://cloud.google.com/load-balancing/docs/https/setting-up-https-serverless#multi_region_lb.\n\
  \n18. B: Besides the list of default logs (https://cloud.google.com/logging/docs/agent/default-logs)\
  \ that the Logging agent streams by default, you can customize the Logging agent\
  \ to send additional logs to Logging or to adjust agent settings by adding input\
  \ configurations.\n\nFor more information, refer to https://cloud.google.com/logging/docs/agent/logging/configuration#configure.\n\
  \n19. B: \"Multi Cluster Ingress (MCI) is a cloud-hosted multi-cluster Ingress controller\
  \ for Anthos GKE clusters. It's a Google-hosted service that supports deploying\
  \ shared load balancing resources across clusters and across regions.\" For more\
  \ information, refer to https://cloud.google.com/kubernetes-engine/docs/concepts/multi-cluster-ingress.\n\
  \n20. B: Cloud Run allows you to specify which revisions should receive traffic\
  \ and to specify traffic percentages that are received by a revision. This feature\
  \ allows you to roll back to a previous revision, gradually roll out a revision,\
  \ and split traffic between multiple revisions.\n\nFor more information, refer to\
  \ https://cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration.\n\n# Answers\
  \ to mock test four\n\n+   1. A and B: Metadata values can be added at the VM and\
  \ project level. For more information, refer to https://cloud.google.com/compute/docs/instances/managing-instance-access.\n\
  \n+   2. A: Access Context Manager offers fine-grained, attribute-based access control\
  \ for projects or resources. For more information, refer to https://cloud.google.com/access-context-manager/docs/overview.\n\
  \n+   3. C: Retention policies cannot be enabled if versioning is set, as they are\
  \ mutually exclusive features. For more information, refer to https://cloud.google.com/storage/docs/bucket-lock.\n\
  \n+   4. D: Custom images meet our requirements to save the state of our boot disk\
  \ and create new instances based on this. For more information, refer to https://cloud.google.com/compute/docs/images/create-delete-deprecate-private-images.\n\
  \n5. A, B, C, and E are all applicable selections when creating a BigQuery table:\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_639_0.png)\n\n6. A and C: For more information,\
  \ refer to https://cloud.google.com/foundation-toolkit. The Cloud Foundation Toolkit\
  \ (CFT) offers templates for both Deployment Manager and Terraform.\n\n7. C: For\
  \ more information, refer to https://cloud.google.com/migrate/compute-engine/docs/4.2/getting-started.\
  \ Migrate for Compute Engine can help to migrate from on-premises VMware private\
  \ clouds into GCP.\n\n8. D: For more information, refer to https://cloud.google.com/network-connectivity/docs/vpn/concepts/overview#ha-vpn.\n\
  \n9. B: For more information, refer to https://cloud.google.com/compute/docs/nodes/overcommitting-cpus-sole-tenant-vms.\
  \ Overcommitting CPU on sole-tenant machines allows us to share CPU resources across\
  \ our VMs and therefore reduce cost.\n\n10. D: This is the correct procedure for\
  \ moving disk data across projects. For more information, refer to https://cloud.google.com/compute/docs/disks/create-snapshots.\n\
  \n11. A: \"Lightweight\" is the keyword here. Lightweight data transformation is\
  \ a use case for Cloud Run. Cloud Run transforms lightweight data as it arrives\
  \ and stores it as unstructured data. In this example, a file can be uploaded to\
  \ Cloud Storage, and an event is triggered and delivered to a Cloud Run service.\
  \ Data is then structured and stored in a BigQuery table. As answer A is the only\
  \ option that mentions Cloud Run, this is the correct answer. For more information,\
  \ refer to https://cloud.google.com/run.\n\n12. D: Organizational policies can help\
  \ us restrict where GCP resources are deployed. For more information, refer to https://cloud.google.com/resource-manager/docs/organization-policy/defining-locations.\n\
  \n13. A: For more information, refer to https://cloud.google.com/bigquery/docs/best-practices-storage.\
  \ Setting a table expiration time on our Big Query table will delete data when the\
  \ time is exceeded. This option is useful if you need access to only the most recent\
  \ data. It is also useful if you are experimenting with data and do not need to\
  \ preserve it.\n\n14. A: Interconnect fulfills the requirements for low-latency,\
  \ highly available, large-data transfers. For more information, refer to https://cloud.google.com/network-connectivity/docs/interconnect#docs.\n\
  \n15. A: The Cloud Storage Transfer Service is ideal for one-off transfers of TBs'\
  \ worth of data. For more information, refer to https://cloud.google.com/storage-transfer/docs/on-prem-overview.\n\
  \n16. B: Cross-region read replicas are a great fit for this use case. For more\
  \ information, refer to https://cloud.google.com/sql/docs/mysql/replication.\n\n\
  17. B: For more information, refer to https://cloud.google.com/bigtable/docs/performance.\
  \ This capacity also provides a buffer for traffic spikes or key-access hotspots,\
  \ which can cause imbalanced traffic among nodes in the cluster.\n\n18. C: For more\
  \ information, refer to https://cloud.google.com/endpoints. Cloud Endpoints lets\
  \ us develop APIs on any GCP backend and then share our APIs with other developers.\n\
  \n19. D: For more information, refer to https://cloud.google.com/build/docs/overview.\
  \ Cloud Build can import from various sources and deliver artifacts as part of a\
  \ serverless CI/CD pipeline.\n\n20. A: Cloud routes use BGP. For more information,\
  \ refer to https://cloud.google.com/network-connectivity/docs/router/concepts/overview.\n\

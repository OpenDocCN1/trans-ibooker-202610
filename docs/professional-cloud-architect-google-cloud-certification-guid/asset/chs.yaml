  \n### Set the billing account for project GCP Cloud Architect Project\n\n![](img/de2c97ab017f36b3750a5bade111edd7_60_0.png)\n\
  \nFigure 2.18 – Selecting the billing account for the project\n\nThe project is\
  \ now attached to its proper billing account.\n\n## Exporting billing\n\nGCP allows\
  \ you to export the billing information to a BigQuery dataset. This can be useful\
  \ if you need to prepare reports or carry out an analysis of the cost of your cloud\
  \ consumption.\n\n> **Important Note**\n> We will learn about BigQuery and Google\
  \ Storage in the big data and storage chapters of this book. To understand billing\
  \ exports, you just need to know that BigQuery is a GCP data warehouse service.\n\
  \nTo perform the export, follow these steps:\n\n- 1. Go to **Billing** and choose\
  \ **Billing export**. Select the **BIGQUERY EXPORT** option.\n- There are different\
  \ levels of details available for exports:\n\n### Google Cloud Platform\n\n### Billing\
  \ export\n\n### BIGQUERY EXPORT\n\n### FILE EXPORT\n\nBigQuery export sends your\
  \ billing data to a BigQuery dataset. Learn more about [BigQuery](https://) and\
  \ [how to export data to BigQuery](https://)\n\n### Standard usage cost\n\nDisabled\n\
  \nSHOW ME HOW THIS WORKS\n\nThe selected BigQuery dataset will be updated each day\
  \ with your daily cost detail per SKU.\n\nEDIT SETTINGS\n\n### Detailed usage cost\n\
  \nDisabled\n\nThe selected BigQuery dataset will be updated each day with your detailed\
  \ usage cost. [Learn more about the Detailed usage cost export and supported regions.](https://)\n\
  \nEDIT SETTINGS\n\n### Pricing\n\nDisabled\n\nThe selected BigQuery dataset will\
  \ contain your SKU prices. It will be updated whenever your pricing changes.\n\n\
  EDIT SETTINGS\n\nFigure 2.19 – Billing export\n\n- 2. To export a standard report,\
  \ click on the **EDIT SETTINGS** in the **Standard usage cost** section. Then, fill\
  \ in the information regarding the dataset and click on **SAVE**. If you currently\
  \ have no datasets set up in BigQuery, then you will be prompted to create one from\
  \ the drop-down menu:\n\n### Billing export\n\nBIGQUERY EXPORT\nFILE EXPORT\n\n\
  ### Daily cost detail\n\nBigQuery export sends your billing data to a BigQuery dataset.\
  \ Learn more about BigQuery and how to export data to BigQuery\n\nProjects *\nGCP\
  \ Cloud Architect Project\n\nThis is where your billing data will be stored. Select\
  \ a project with BigQuery enabled and with an existing BigQuery dataset.\n\nDataset\
  \ ID *\n\nCREATE NEW DATASET\nLaunches a form to create a new dataset before continuing\n\
  \nLoaded datasets\n\nSAVE\nCANCEL\n\nFigure 2.20 – Daily cost detail\n\n3. Next,\
  \ you can create a new dataset with the values you require:\n\n### Create dataset\n\
  \nDataset ID *\nbilling_dataset\nLetters, numbers, and underscores allowed\n\nData\
  \ location\nEuropean Union (EU)\n\n### Default table expiration\n\nEnable table\
  \ expiration\n\nDefault maximum table age\n30\nDays\n\n### Encryption\n\nGoogle-managed\
  \ encryption key\nNo configuration required\n\nCustomer-managed encryption key (CMEK)\n\
  Manage via Google Cloud Key Management Service\n\nCREATE DATASET\nCANCEL\n\nFigure\
  \ 2.21 – Dataset values\n\n4. After the data has been exported to BigQuery, you\
  \ can perform queries on it. For example, you can check which service has generated\
  \ the most costs:\n\n```\nQuery editor\n1 SELECT\n2   invoice.month,\n3   service.description,\n\
  4   ROUND(SUM(cost) + SUM(IFNULL((\n5     SELECT\n6       SUM(c.amount)\n7     FROM\n\
  8       UNNEST(credits) c,\n9     0))) AS cost_after_credits\n10 FROM\n11   `data-analytics-pocs:public.gcp_billing_export_EXAMPLE_E0XD3A_DB33F1`\n\
  12 WHERE\n13   invoice.month = \"201906\"\n14 GROUP BY\n15   1,\n16   2\n17 ORDER\
  \ BY\n18   3 DESC ;\n```\n\nRun Save query Save view Schedule query More\n\nQuery\
  \ results SAVE RESULTS EXPLORE WITH DATA STUDIO\n\nQuery complete (1.2 sec elapsed,\
  \ 57.6 MB processed)\n\nJob information Results JSON Execution details\n\n| Row\
  \ | month | description | cost_after_credits |\n|---|---|---|---|\n| 1 | 201906\
  \ | Compute Engine | 1607.0 |\n| 2 | 201906 | Cloud Storage | 411.0 |\n| 3 | 201906\
  \ | App Engine | 86.0 |\n| 4 | 201906 | BigQuery | 73.0 |\n| 5 | 201906 | Cloud\
  \ Functions | 0.0 |\n| 6 | 201906 | Cloud Scheduler | 0.0 |\n| 7 | 201906 | Cloud\
  \ Pub/Sub | 0.0 |\n| 8 | 201906 | Stackdriver Logging | 0.0 |\n\nFigure 2.22 – BigQuery\
  \ billing query (Source: https://cloud.google.com/billing/docs/how-to/visualize-data,\
  \ License: https://creativecommons.org/licenses/by/4.0/legalcode)\n\nThis information\
  \ is very useful when you wish to create all sorts of billing reports. In addition\
  \ to the reporting, we would also like to be informed, upfront, whether we are exceeding\
  \ our budget. In the next section, let's examine how this can be done.\n\n## Budgets\
  \ and alerts\n\nBudgets and alerts can be set for each billing account or project.\
  \ You can set up a specific threshold. Once the amount spent is higher than the\
  \ defined threshold, billing administrators and billing account users will be notified.\
  \ This will not stop the usage of any services, and charges will continue to apply\
  \ for the running resources. By default, there are three alert thresholds: 50%,\
  \ 90%, and 100%. Both the number of thresholds and their values can be modified:\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_65_0.png)\n\nFigure 2.23 – Creating a\
  \ budget\n\nThere are two types of notification targets: email and a Pub/Sub topic.\
  \ If the mail channel is chosen, the billing administrators and users can be notified\
  \ or a specific notification channel with an associated email address can be selected.\
  \ If a Pub/Sub topic is selected, an already existing topic can be selected or a\
  \ new topic can be created.\n\n> **Exam Tip**\n> If the alerts and budgets are attached\
  \ to a billing account, and you have multiple projects attached to the alerts, this\
  \ will count toward the total cost generated in all of those projects together.\
  \ Remember the default thresholds for the alerts.\n\n## Billing account roles\n\n\
  Surely, you would want to have control over who has access to your billing and who\
  \ can manage the payments. The following list shows the roles that can be used to\
  \ control the billing:\n\n- - **Billing Account Creator**: This is used for the\
  \ initial billing setup, including signing up for GCP with a credit card.\n- - **Billing\
  \ Account Administrator**: This is the owner of the billing account. This role is\
  \ allowed to link and unlink projects and manage other users' roles for the billing\
  \ account. This role can manage payment instruments, billing exports, and view cost\
  \ information.\n- - **Billing Account User**: In combination with the project creator\
  \ role, the Billing Account User role is allowed to create new projects linked to\
  \ the billing account on which the role has been granted.\n- - **Billing Account\
  \ Viewer**: This role allows access to view the billing information. It can be used\
  \ by the finance team.\n- - **Billing Account Costs Manager**: This role allows\
  \ you to view and export the cost information of the billing account.\n- - **Project\
  \ Billing Manager**: This role enables the attachment of the project to a billing\
  \ account without rights to resources.\n\n> **Exam Tip**\n> Make sure you understand\
  \ the billing roles; in particular, ensure you have a good understanding of who\
  \ can manage new billing accounts and who can only view the data.\n\n\n\n\n\n##\
  \ Summary\n\n在本章中，我们学习了 GCP 的基础知识。我们讨论了资源及其范围和层级。我们设置了第一个账号，为其他用户创建了访问权限，并配置了计费。我们还学习了如何导出计费信息。最后，我们学习了如何设置警报和预算来控制\
  \ GCP 使用成本。\n\n在下一章中，我们将浏览 GCP 的核心服务，并在随后的章节中继续深入研究每一项服务。\n\n## Further reading\n\
  \n有关 GCP 计费和安全性的更多信息，请参考以下资源：\n\n- **IAM:** https://cloud.google.com/billing/docs/how-to/billing-access\n\
  - **Visualizing billing:** https://cloud.google.com/billing/docs/how-to/visualize-data?hl=pl\n\
  - **SLA:** https://cloud.google.com/terms/sla/\n- **Security in GCP:** https://cloud.google.com/security/\n\
  - **Comparing GCP services to AWS and Azure:** https://cloud.google.com/free/docs/aws-azure-gcp-service-comparison\n\
  \n## 3\nGoogle Cloud Platform Core Services\n\n在深入研究 Google Cloud Platform (GCP)\
  \ 服务之前，让我们先进行一次概览，介绍所有最重要的核心服务。这将帮助我们更好地理解整体情况。熟悉所有核心服务非常重要，不仅是为了考试——它还能让你为你的使用场景选择最佳方案。\n\
  \nGoogle 将服务分为以下逻辑组，它们将是本章我们要涵盖的内容：\n\n- Understanding computing and hosting services\n\
  - Exploring storage services\n- Getting to know about networking services\n- Going\
  \ through big data services\n- Understanding Machine Learning (ML) services\n- Learning\
  \ about identity services\n\n> **Exam Tip**\n> 作为一名云架构师，你需要从高层次理解大多数服务的工作原理。本章应能解答考试中的一些基本问题。请注意，Google\
  \ 经常发布新服务；不过，新服务发布和考试更新之间总会有延迟。\n\n## Understanding computing and hosting services\n\
  \n在 GCP 中进行 **computing** 时，我们有多种选择。根据我们的需求和灵活性，我们可以从以下四个选项中选择一个，我们将在接下来的部分中进行探讨：\n\
  \n- **Infrastructure-as-a-Service (IaaS): Google Compute Engine (GCE)**\n- **Container-as-a-Service\
  \ (CaaS): Google Kubernetes Engine (GKE)**\n- **Platform-as-a-Service (PaaS): Google\
  \ App Engine (GAE)**\n- **Function-as-a-Service (FaaS): Cloud Functions**\n\n> **Exam\
  \ Tip**\n> 请注意，还有一些额外的计算选项可能尚未出现在考试中，但在 2019 年已宣布。**GKE On-Prem** 是一种可在本地环境中安装并从\
  \ Google 控制台管理的 GKE 服务。**Cloud Run** 是一种 FaaS 方案，允许你定义会监听 HTTP 请求的容器。这使你能够使用 Cloud\
  \ Functions 不支持的语言。要了解有关这些服务的更多信息，请查看 *Further reading links.*\n\n- **Fully managed\
  \ container platform: Cloud Run**\n\n我们做出的选择可能取决于多个因素。例如，我们是否需要完全控制基础设施，还是想要一个完全托管的服务？从\
  \ **Compute Engine** 开始，我们可以控制 **Virtual Machine (VM)** 实例。这给了我们最大的灵活性，但也意味着我们需要负责其上的堆栈。对于\
  \ **Cloud Functions**，我们受支持编程语言的限制很大（JavaScript、Python、Node.js、Java、.NET、Ruby、PHP\
  \ 和 Go）。Cloud Functions 的优势在于你无需担心基础设施和扩展。你只需专注于开发你的函数。如果你需要使用 Cloud Functions 不支持的语言，你将无法使用它。\n\
  \nGCP 中的计算选项如下图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_71_0.png)\n\nFigure\
  \ 3.1 – Computing options\n\n让我们看一下每种计算选项，并了解 Google 为我们管理的内容与我们获得的灵活性之间的对比：\n\n\
  - GCE: GCE 是一种 IaaS 方案。它允许最大的灵活性，因为它提供了计算基础设施来配置 VM 实例。这意味着你对虚拟化硬件和操作系统有控制权。请注意，这可能受可用机器类型的限制。你可以使用标准\
  \ GCP 镜像或自己的自定义镜像。你可以控制 VM 和存储在区域和区域中的位置。你对网络有精细控制，包括防火墙和负载均衡。使用实例组，你可以根据需要自动扩展控制和容量。Compute\
  \ Engine 在大多数情况下都很适用，但可能不是最优解决方案。\n\n- GKE: GKE 是一种 CaaS 方案。它允许你按需创建 Kubernetes\
  \ 集群，从而省去了自行安装集群的重活。它利用 Compute Engine 来托管集群节点，但客户无需担心基础设施，可以专注于编写代码。配置的集群可以自动更新和扩展。GCP\
  \ 软件定义网络与 GKE 集成，允许用户在应用程序部署时按需创建网络对象，例如负载均衡器。多个服务与 GKE 集成，例如 Artifact Registry，它允许你存储和扫描容器镜像。\n\
  \n- **App Engine:** App Engine 是一种 PaaS 方案。它允许你专注于编写代码，而 Google 负责托管、扩展、监控和更新。它面向不需要理解基础设施复杂性的开发人员。GAE\
  \ 提供两种类型的环境，如下所示：\n\n- **Standard:** 支持一组常用语言，包括 Python、Go、Java、Node.js、PHP、Ruby\
  \ 和 Go。\n\n- **Flexible:** 支持更多语言，并可创建自定义运行时。使用灵活环境，你会失去一些开箱即用的集成，但会获得更多灵活性。\n\n\
  GAE 与 GCP 服务紧密集成，包括数据库和存储。它允许对应用程序进行版本控制，以便轻松进行发布和回滚：\n\n- **Cloud Functions:**\
  \ Cloud Functions 是一种 FaaS 方案。它允许你专注于使用其中一种受支持语言编写函数。它非常适合执行数据处理、移动后端和 IoT 的简单任务。该服务完全无服务器，所有底层层级均由\
  \ Google 管理。函数可以通过事件触发或 HTTP 端点执行。\n\n- **Cloud Run:** 将 FaaS 的简易性和 CaaS 的可移植性结合在一起。它允许你在完全托管的无服务器平台上开发和部署可自动扩展的容器化应用程序。它与\
  \ Knative 兼容，因此你可以将工作负载迁移到任何可在云中或本地运行 Kubernetes 的环境。\n\n- **Anthos:** Anthos 是一种现代应用程序管理平台，为云和本地环境提供一致的开发和运营体验。Anthos\
  \ 本身不是计算选项，但允许你在多云和混合环境中在 Anthos 上运行 Google Kubernetes Engine 和 Cloud Run。\n\n-\
  \ **Google Cloud VMware Engine (GCVE)** 是托管在 GCP 中的完全托管的原生 VMware Cloud Foundation\
  \ 软件堆栈。它允许你通过将托管在 vSphere 上的 VM *原样* 迁移到 Google Cloud 来加速向 GCP 的迁移。\n\n现在我们已经研究了计算服务，让我们在下一节中了解一下存储服务。\n\
  \n## Exploring storage services\n\n**Storage** 是云计算的重要组成部分，因为它保存了应用程序的数据和状态。GCP\
  \ 提供了多种存储，从对象存储到托管数据库。我们将要查看的不同存储服务如下：\n\n- **Cloud Storage**: Cloud Storage 是一种完全托管的面向对象的存储服务，具有几乎无限的容量。它允许创建存储数据的存储桶，并通过\
  \ API 和 `gsutil` 等工具进行访问。它提供不同的存储类别和位置，以最好地满足你的需求，即数据被访问的频率和应位于的位置。请记住，每个层级的价格都不同。做出深思熟虑的决定将有助于你节省成本。你可以选择以下选项：\n\
  \n- **Standard**: 在多个地理位置具有最高可用性\n- **Nearline**: 用于每月访问少于一次的数据\n- **Coldline**:\
  \ 用于每季度访问少于一次数据的极低成本\n- **Archive**: 用于每年访问少于一次数据的最低成本\n\n> **Important Note**\n\
  > 之前，Google Cloud Storage 提供的存储类别与上述提到的略有不同。考试可能尚未更新，因此了解旧选项也很重要，如下所示：\n> **Multi-regional**:\
  \ 在多个地理位置具有最高可用性\n> **Regional**: 在固定位置具有高可用性\n> **Nearline**: 低成本，用于每月访问少于一次的数据\n\
  > **Coldline**: 用于备份和灾难恢复的最低成本\n\n使用 Cloud Storage，你无需担心容量不足。以下列表告知我们其他 Google Cloud\
  \ Storage 选项：\n\n- **Cloud Filestore**: Filestore 是一种托管文件存储服务。它允许用户配置可与 GCE 和 GKE\
  \ 集成的 **Network Attached Storage (NAS)** 服务。它提供两个性能层级——**standard** 和 **premium**，提供不同的\
  \ **Input/Output operations Per Second (IOPS)** 和吞吐量。\n\n\n\n\n\n- **Cloud SQL**：Cloud\
  \ SQL 是一种完全托管的关系型数据库服务，可用于 MySQL、PostgreSQL 或 SQL Server 数据库。它提供数据复制、备份、数据导出和监控功能。当你需要将当前实例从本地迁移到云端并希望将数据库维护委托给\
  \ Google 时，它是理想的选择。\n- **Cloud Datastore**：Cloud Datastore 是一种完全托管的非 SQL 数据库。它非常适合依赖大规模高可用结构化数据的应用程序。其扩展性和高可用性通过分布式架构实现，并对用户进行了抽象。每个项目中只有一个数据库可用。Cloud\
  \ Datastore 提供类 SQL 语言来查询数据。它已被 Cloud Firestore 取代。\n- **Cloud Firestore**：Cloud\
  \ Firestore 是 Cloud Datastore 的下一代产品，具有多项增强功能。它可以在 Native 或 Datastore 模式下运行。前者与\
  \ Cloud Datastore 兼容。Google 已开始在没有任何停机或用户干预的情况下将所有 Datastore 客户端迁移到 Cloud Firestore。所有新项目都应创建在\
  \ Cloud Firestore 而不是 Datastore 中。\n- **Cloud Spanner**：Cloud Spanner 是一种完全托管的全球分布式数据库服务。它提供关系型数据库的强一致性，同时具有非关系型数据库的扩展能力。用户可以定义架构并利用行业标准的\
  \ **American National Standards Institute (ANSI)** 2011 SQL。它提供高性能事务，服务等级协议 **Service-Level\
  \ Agreement (SLA)** 可达 99.999% 可用性，意味着几乎没有停机时间。Cloud Spanner 适用于金融交易、保险、全球呼叫中心、电信、游戏和电子商务等用例。全局一致性使其非常适合全球可访问的应用程序。\n\
  - **Bigtable**：Bigtable 是一种完全托管的超大规模 NoSQL 数据库服务，对大型分析和运营工作负载提供稳定的亚 10ms 延迟。Google\
  \ 使用它来提供 Gmail 和 Google Maps 等服务。它非常适合金融科技、物联网和机器学习存储用例。它可轻松与大数据产品系列如 **Dataproc**\
  \ 和 **Dataflow** 集成。它基于开源 Apache HBase，可使用其 API。Bigtable 的成本远高于 Datastore，因此应谨慎选择数据库。\n\
  - **Custom databases**：你也可以选择使用 Compute Engine 安装自选数据库，例如 MongoDB；但是，这将是一个非托管服务。\n\
  - **Persistent Disks**：这些是持久的网络存储设备，可以被我们的实例像物理磁盘一样访问。它们与我们的 VM 实例独立存在，可以分离并移动以在\
  \ VM 被删除后仍保持数据安全。\n\n至此，我们结束了对存储服务的介绍；让我们在下一节中查看网络服务。\n\n## Getting to know about\
  \ networking services\n\nGCP 网络基于 **Software-Defined Networks (SDNs)**，允许用户以编程方式交付所有网络服务。所有服务均完全托管，用户只需根据其需求进行配置。我们将要查看的网络服务如下：\n\
  \n- **Virtual Private Cloud (VPC)：** VPC 是 GCP 网络的基础。项目可以包含多个 VPC 网络。除非你创建了禁止此操作的组织策略，否则新项目会默认启动一个默认网络（自动模式\
  \ VPC 网络），在每个区域中都有一个子网络（子网）。你可以将其视为物理网络的云版本。每个 VPC 网络可以包含一个或多个区域子网。VPC 创建了一个全局逻辑边界，允许同一\
  \ VPC 网络内的资源之间进行通信，须遵守适用的网络防火墙规则。要允许 VPC 之间通信，流量需要经过互联网或使用 VPC 对等互连。\n\n- **Load\
  \ balancer：** 负载均衡器允许在工作负载之间分配流量。它们可用于 GCE、GAE 和 GKE。对于 GCE，你可以选择具有全局或区域范围的负载均衡器。选择还取决于网络类型。以下负载均衡器可用：\n\
  \  - HTTP(S) load balancer\n  - SSL proxy\n  - TCP proxy\n  - External network load\
  \ balancer\n  - Internal TCP/UDP load balancer\n  - Internal HTTP(S) load balancer\n\
  \n- **Cloud Router：** Cloud Router 是一项服务，允许你通过使用 **Border Gateway Protocol (BGP)**：https://www.wikipedia.org/wiki/Border_Gateway_Protocol\
  \ 在 VPC 和本地网络之间动态交换路由。它消除了创建静态路由的需要。\n\n- **Virtual Private Network (VPN)：** VPN\
  \ 允许通过互联网上的 IPsec 隧道在本地网络与 GCP VPC 之间建立连接。仅支持站点到站点 VPN。传输中的流量会被加密。支持静态和动态路由，后者需要云路由器。应将\
  \ VPN 视为将环境连接到 GCP 的初始方法，因为它成本最低。如果有低延迟、高可靠性和高带宽需求，则应考虑 Cloud Interconnect。\n\n\
  - **Cloud Interconnect**：如果需要在本地网络与 Google Cloud VPC 网络之间建立低延迟且高度可用的连接，则应考虑互连。在这种情况下，流量不会经过互联网。有两种互连选项，分别是：\n\
  \  - **Dedicated Interconnect**：10 或 100 Gbps 直接连接到 Google 数据中心\n  - **Partner Interconnect**：50\
  \ Mbps-50 Gbps 通过 Google 合作伙伴传输\n\n- **Cloud DNS**：Cloud DNS 是一种托管 DNS 服务，SLA 为\
  \ 100%。它将域名解析为对应的 IP 地址。它可轻松发布和管理数百万个 DNS 区域和记录。Cloud DNS 还可以托管仅可从你指定的一个或多个 VPC\
  \ 网络访问的私有区域。\n\n- **Cloud Content Delivery Network (CDN)**：Cloud CDN 是一项服务，允许缓存来自各种类型后端（包括\
  \ Cloud Storage 存储桶）的 HTTP(S) 负载均衡内容。缓存可减少内容交付时间和成本。它还可以保护你免受 **Distributed Denial-of-Service\
  \ (DDoS)** 攻击。数据缓存在 Google 全球分布的边缘节点上。在首次请求时，如果内容未被缓存，数据将从后端源检索。后续对相同数据的请求将直接从缓存提供，直到过期时间到达。\n\
  \n- **Cloud NAT**：Cloud NAT 是一项区域服务，允许没有外部 IP 的 VM 与互联网通信。它是一个分布式、软件定义的管理服务，可以配置为自动扩展其使用的\
  \ NAT IP 地址数量。它适用于 GCE 和 GKE。它是用户需要管理的 NAT 实例的更好替代方案。\n\n- **Firewall**：GCP Firewall\
  \ 是一项允许微分段的服务。防火墙规则按 VPC 创建，可以基于 IP、IP 范围、标签和服务账号。默认创建了多个防火墙规则，但可以修改。\n\n- **Identity-Aware\
  \ Proxy (IAP)**：IAP 是一项服务，当用户从不受信任的网络工作时可替代 VPN。它根据用户身份、设备状态和 IP 地址控制对应用程序的访问。它是\
  \ Google BeyondCorp (`https://cloud.google.com/beyondcorp`) 零信任安全模型的一部分。\n\n- **Cloud\
  \ Armor**：Cloud Armor 是一项服务，利用 Google 的全球基础设施和安全系统保护免受基础设施 DDoS 攻击。它与全局 HTTP(S)\
  \ 负载均衡器集成，并根据 IP 地址或范围阻止流量。预览模式允许用户在不切断常规用户的情况下分析攻击模式。\n\n\n\n\n\nPhew! 我们已经涵盖了大量关于网络服务的内容。现在，让我们在下一节中了解大数据服务。\n\
  \n## 了解大数据服务\n\n大数据服务使用户能够处理大量数据以提供复杂问题的答案。GCP 提供了许多紧密集成的服务，可创建 **端到端 (E2E)** 数据分析管道。这些服务如下：\n\
  \n- **BigQuery**：BigQuery 是一种高度可扩展且完全托管的云数据仓库。它允许用户使用内置 ML 执行分析操作。BigQuery 完全无服务器，可托管\
  \ PB 级数据。底层基础设施可无缝扩展并允许并行数据处理。数据可以存储在 BigQuery Storage、Cloud Storage、Bigtable、Sheets\
  \ 或 Google Drive 中。用户定义包含表的数据集。BigQuery 使用熟悉的符合 ANSI 的 SQL 进行查询，并提供 ODBC 和 JDBC\
  \ 驱动程序。用户可从两种付费模式中选择——一种是灵活的，按存储和查询付费，另一种是固定费率，每月成本稳定。它非常适合预测分析、物联网和日志分析等用例，并与 GCP\
  \ 的大数据产品系列集成。\n\n- **Pub/Sub**：这是一种完全托管的异步消息传递服务，可让您松散地耦合应用程序组件。它是无服务器的，具有全球可用性。您的应用程序可以向主题发布消息或订阅主题以提取消息。Pub/Sub\
  \ 还提供基于推送的消息传递，将消息作为 HTTP POST 请求推送到 **Webhooks**。\n\n- **Dataproc**：Dataproc 是一种完全托管的\
  \ **Apache Spark** 和 **Hadoop** 集群服务。它允许用户按需创建集群，并在需要数据处理时才使用。按秒计费。它允许用户将已有的本地集群迁移到云端而无需重构代码。使用抢占式实例可进一步降低成本。\n\
  \n- **Cloud Dataflow**：Cloud Dataflow 是一种完全托管的服务，用于流式和批处理数据。它基于开源 Apache Beam，完全无服务器，并提供几乎无限的容量。它将为用户管理资源和作业平衡。它可用于在线欺诈分析、物联网、医疗保健和物流等用例。\n\
  \n- **Dataprep**：这是一种可用于执行数据准备和可视化的工具。我们可以在无需任何编码技能的情况下探索和转换数据。数据可以交互式地为进一步分析做好准备。\n\
  \n- **Datalab**：Datalab 是一款内置于 **Jupyter**（前身为 **IPython**）的工具，允许用户探索、分析和转换数据。它还允许用户构建\
  \ ML 数据模型并利用 Compute Engine。\n\n- **Data Studio**：这是一种允许您从源消费数据并以报告和仪表板形式可视化数据的工具。\n\
  - **Cloud Composer**：这是一种基于开源 **Apache Airflow** 的完全托管服务。它允许您创建和编排大数据管道。\n- **Data\
  \ Fusion**：这是一种完全托管的企业数据集成服务。它提供了一个 UI，允许您构建和管理管道以清理、准备、混合、传输和转换数据。\n\n最后，让我们在下一节中研究\
  \ ML 服务。\n\n## 了解机器学习服务\n\nGoogle 的长期 **机器学习 (ML)** 经验是其最强的一点之一。GCP 提供了围绕 ML 的多个服务。您可以选择预训练模型或自行训练模型。ML\
  \ 下包含的各种服务如下：\n\n- **Pretrained APIs**：ML API 是允许您利用多个预训练模型以分析视频的服务。目前可用的 API 如下：\n\
  \  - Google Cloud Video Intelligence\n  - Google Cloud Speech\n  - Google Cloud\
  \ Vision\n  - Google Cloud Natural Language\n  - Google Cloud Translation\n  - Google\
  \ Recommendations AI\n\n以下模型列表可在无需任何关于其工作原理的背景知识的情况下使用。作为示例，我们可以分析文本进行情感分析：\n\n\
  - **AutoML**：AutoML 是一项服务，开发人员可利用它在没有广泛数据科学知识的情况下训练模型。例如，通过向 AutoML 提供标记样本，它可以被训练以识别\
  \ Vision API 无法识别的对象。以下是 AutoML 的标记样本：\n  - AutoML Translation\n  - AutoML Natural\
  \ Language\n  - Video Intelligence\n  - AutoML Tables\n\n- **Dialogflow:** 这是一项服务，允许您构建可与人类交互的对话应用程序。界面可与许多兼容平台交互，例如\
  \ Slack 或 Google Assistant。它还可以与 **Firebase** 函数集成，使用通用 API 与第三方平台集成。\n- **AI Platform:**\
  \ 这是一项完全托管的服务，允许端到端开发机器学习模型。在其进入通用可用性之前，Google 发布了 Vertex AI 并弃用了 AI Platform。\n\
  - **Vertex AI:** 这是一个统一的机器学习平台，用于构建、部署和扩展 AI 模型。它将 AutoML 和 AI Platform 集成到统一的 API、客户端库和用户界面中。使用\
  \ Vertex AI，您可以执行 AutoML 训练和自定义训练。对于这两个选项，您都可以使用 Vertex AI 保存模型、部署模型并请求预测。\n\nML\
  \ 服务将在 *第 14 章，将机器学习付诸实践* 中进一步讨论。在下一节中，我们将介绍 *Google 的身份和访问管理* 服务。\n\n## 了解身份服务\n\
  \n**身份和访问管理 (IAM)** 是任何云最重要的方面之一。它允许您控制谁有权访问云，但也可以为您的应用程序提供身份服务。简而言之，这是通过角色和权限的组合实现的。角色分配给用户或组。让我们看看\
  \ GCP 中有哪些选项：\n\n- **IAM:** IAM 允许 GCP 管理员控制对 GCP 服务的授权。管理员可以创建具有细粒度权限的角色。然后可以将角色分配给用户，或最好分配给一组用户。\n\
  - **Cloud Identity:** Cloud Identity 是一种 **身份即服务 (IDaaS)** 方案。它位于 GCP 之外，但可以轻松与\
  \ GCP 集成。它允许您创建组织、组和用户并集中管理它们。如果您已有现有的用户目录，可以将其与 Cloud Identity 同步。\n\nIAM 非常重要，因为它决定了您的\
  \ GCP 架构将如何创建。我们将在 *第 15 章，安全性和合规性* 中更详细地讨论这个问题。\n\n# 第 2 部分：\n管理、设计和\n规划云解决方案\n\
  架构\n\n在本节中，我们将更详细地关注各种 GCP 服务。通过检查这些服务，我们将演示如何基于 GCP 管理、设计和规划解决方案。\n\n本书的这一部分包含以下章节：\n\
  \n- 第 4 章，使用 Google Compute Engine\n- 第 5 章，将 Google App Engine 作为计算选项进行探索\n- 第\
  \ 6 章，使用 Google Kubernetes Engine 管理 Kubernetes 集群\n- 第 7 章，使用 Cloud Run 部署云原生工作负载\n\
  - 第 8 章，使用 Anthos 管理云原生工作负载\n- 第 9 章，使用 Google Cloud Functions 运行无服务器函数\n- 第 10\
  \ 章，GCP 中的网络选项\n- 第 11 章，探索 GCP 中的存储和数据库选项 – 第 1 部分\n- 第 12 章，探索 GCP 中的存储和数据库选项\
  \ – 第 2 部分\n- 第 13 章，分析大数据选项\n- 第 14 章，将机器学习付诸实践\n\n# 4\n使用 Google Compute Engine\n\
  \n**Google Compute Engine (GCE)** 是 **Google Cloud Platform (GCP)** 内部的基础服务之一。虽然公共云继续从传统的\
  \ **虚拟机 (VM)** 转移，但这些机器仍有使用场景，就像其他供应商一样，GCE 允许我们在 GCP 上创建和运行 VM。Google 将 GCP 中的\
  \ VM 称为 Compute Engine 实例。Compute Engine 使查找符合我们要求的 VM 变得容易，无论是小型 VM 还是大型数据处理 VM。\n\
  \nGCE 是一种纯粹的 **基础设施即服务 (IaaS)** 解决方案；因此，您需要根据需要管理和扩展 VM，但这使其成为从本地迁移到公共云的 **迁移**\
  \ 的理想解决方案。您可以使用自己的定制操作系统，就像在自己的数据中心一样，也可以选择预定义的 Google、Windows 或 Linux 镜像。您也可以自带\
  \ Windows 许可证，但这会带来一些注意事项。在本章的 GCE 部分中，我们将了解如何部署简单的 GCE 实例、部署时可用的选项，以及更复杂的解决方案，使我们能够轻松扩展。\n\
  \n\n\n\n\n在本章中，我们将更深入地了解 Compute Engine。具体来说，我们将涵盖以下主题：\n\n- 部署我们的第一个 GCE 实例\n-\
  \ 部署选项\n- 实例模板和实例组\n- 自动扩缩容\n- 自动修复\n- 配额和限制\n- IAM 角色\n- 价格\n\n## 部署我们的第一个 GCE\

  > “我们的 CEO S. Hawke 希望将高肾上腺素的赛车带给世界各地的粉丝。我们倾听粉丝的意见，他们希望获得增强的视频流，其中包括比赛内事件的预测（例如超车）。我们当前的平台允许我们预测比赛结果，但缺乏支持比赛期间实时预测以及处理整个赛季结果的能力。”\n\
  \nSource: https://services.google.com/fh/files/blogs/master_case_study_helicopter_racing_league.pdf.\n\
  \nLicense: https://creativecommons.org/licenses/by/4.0/legalcode.\n\n# 分析\n\n需求中首先应该注意的是，这是一个机器学习（ML）非常重要案例研究。他们的驱动力是为其赛车提供游戏内预测。ML\
  \ 模型可以部署到生产环境中以提供这些预测——提供离线或在线预测。当然，在这里，很明显我们需要在线预测。\n\n再次，为了满足这些需求，我们必须思考如何摄取数据以及如何转换和丰富数据。一旦我们将\
  \ ML 作为需求看到，我们应该考虑 TensorFlow，它将实现和训练 ML 模型。我们还需要诸如 Pub/Sub 之类的东西来摄取事件，以及 Dataflow\
  \ 来处理数据。Cloud Machine Learning Engine 可用于反馈预测分析。我们也可以考虑 Vertex AI 平台，这是一个无服务器平台，可以大规模训练、调优和提供\
  \ TensorFlow 模型。这可以帮助我们进行在线预测。\n\n延迟也是一个问题，公司希望尽可能为其观众减少延迟。对于实时预测来说，这变得非常重要，因为观众会期望立即获得。为优化模型服务，我们应该考虑使用更小的模型，通过减少输入特征的数量并确保删除模型中所有不相关部分。此外，我们应该考虑将事件存储在低延迟数据库中，例如\
  \ Bigtable。\n\n还有什么其他值得注意的地方？我们很想听听您的设计！\n\n# 总结\n\n到目前为止，您已经了解了考试案例研究的大致情况。在本章中，我们逐节分解了\
  \ Mountkirk 案例研究，并确定了我们可以映射到服务的关键词。对于剩余的案例研究，我们希望您能够完整地阅读每一个案例研究并提取关键词。\n\n我们无法在本章中提供答案，但我们希望展示关键词可以映射到服务，这将为您在考试中带来优势。它也迫使我们确保我们理解一项服务及其主要用例。正如我们所见，数据是这些用例中的一个非常重要的主题。请确保您了解处理数据的选项，并确保其处于可用于分析的格式。这是您最后一次提醒，使用\

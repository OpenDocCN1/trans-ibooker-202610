  \ autoscaling\n\n使用预测性自动扩缩根据历史 CPU 负载预测未来的容量需求。\n\nLearn more\n\nOff\n未使用任何预测方法。自动扩缩器根据实时指标将组扩缩至满足当前需求。\n\

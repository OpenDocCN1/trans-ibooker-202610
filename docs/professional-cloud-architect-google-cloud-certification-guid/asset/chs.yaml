  \ cluster\n\n此信息可以复制到 Google Cloud Shell，以便我们将其与新创建的集群进行身份验证。在下一节中，我们将使用它并部署我们的第一个应用程序。\n\
  \n## Deploying our first application\n\n现在我们已经创建了集群，可以部署我们的第一个应用程序。我们将使用三个 Pod 部署一个简单的\
  \ NGINX Web 服务器。为此，我们将使用 Deployment 对象。然后，我们将使用 Service 对象公开应用程序。\n\n为了演示创建 Kubernetes\
  \ 对象的不同方法，我们将同时使用 kubectl 和 Google Cloud Console。部署成功后，我们将检查其连通性。让我们开始：\n\n> **Exam\
  \ Tip**\n> 预计会出现有关 GKE 和 Kubernetes 命令行工具的问题。\n> 请记住，gcloud 用于管理 GKE 集群，而 kubectl\
  \ 是原生的 Kubernetes 工具。因此，例如，如果你想扩展 GKE 集群，你将使用 gcloud，而要扩展部署，你将使用 kubectl。\n\n1.\
  \ 让我们打开 Cloud Shell 并运行以下命令，该命令是我们从 Google Cloud Console 复制的：\n\n```\ngcloud container\
  \ clusters get-credentials standard-cluster-1 --zone us-central1-a --project qwiklabs-gcp-21ec218e55edd052\n\
  ```\n\n> **Important Note**\n> 你需要调整集群名称和项目 ID，使其与你的环境匹配。\n\n当要求授权时，请确认。这将为 kubectl\
  \ 配置凭据。现在，我们可以将 Kubernetes 资源部署到集群。\n\n2. 现在，让我们在编辑器模式下打开 Cloud Shell 并使用示例 Deployment\
  \ 定义创建一个 `deploy.yaml` 文件。你可以在官方 Kubernetes 文档中找到类似的示例：https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#creating-a-deployment。保存它并运行\

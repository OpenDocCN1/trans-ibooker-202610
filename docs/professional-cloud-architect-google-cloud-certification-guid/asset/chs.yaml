  - 对于 Datastream，请参阅 https://cloud.google.com/datastream。\n\n## 14\n\n## 将机器学习付诸实践\n\
  \n正如我们已经提到的，**机器学习 (ML)** 是 **Google Cloud Platform (GCP)** 的差异化因素之一。你应该特别关注本章，因为你将了解到你实际上不需要是数据科学家就能在你的应用中利用\
  \ ML。Google 为初学者和经验丰富的用户都提供了选择。ML 对许多人来说可能是一个令人望而生畏的话题，但希望我们能够通过简单的示例解释基本的基础概念。在有了这种理解之后，我们将能够查看\
  \ GCP 中可用的 ML 服务。希望你对本章的兴奋程度与我们撰写时的兴奋程度一样。\n\n在本章中，我们将涵盖以下主题：\n\n- 人工智能和 ML 的介绍\n\
  - ML 的七个步骤\n- 学习模型\n- GCP ML 选项\n- TensorFlow\n- Vertex AI\n- 预训练 ML 模型\n- Dialogflow\n\
  - AutoML\n\n> **考试提示**\n> 有趣的是，ML 主题在考试中已大幅减少。2020 年引入了一个新的考试 Professional Machine\
  \ Learning Engineer，需要深入了解 Google ML 服务。我们仍然认为该主题非常重要，希望你能理解基础知识。\n\n作为云架构师，你应该能够区分不同的\
  \ GCP ML 服务并为你的用例识别合适的服务。可能有两种服务满足要求，但 *哪一种在使用时会带来更少的精力？* 记住有哪些类型的 ML 模型并理解它们之间的差异。不要害怕——没人会要求你开发自己的模型！\n\
  \n## 人工智能和 ML 的介绍\n\n**人工智能 (AI)** 被描述为数字计算机执行智能人类可以执行的任务的能力。ML 是 AI 的一个子集。它被机器用来基于数据做出决策，而无需获得特定的编程指令。它可用于例如指示收到的电子邮件是否为垃圾邮件、识别对象或做出智能预测。ML\
  \ 概念在以下图表中说明：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_438_0.png)\n\n如我们所见，ML\
  \ 模型依赖于从对称为 **训练数据** 的样本的分析中创建的数学模型。开发模型的过程称为 **模型训练**。模型的目的是以尽可能高的准确度回答我们的问题。准确性越好，模型越好。你可能对这个模型是如何创建的感到困惑。我们将在下一节中讨论这个问题。\n\
  \n## ML 的七个步骤\n\nGoogle 指出 ML 有七个步骤：\n\n- 1. 收集数据\n- 2. 准备数据\n- 3. 选择模型\n- 4. 训练\n\
  - 5. 评估\n- 6. 超参数调优\n- 7. 预测\n\n让我们通过一个示例逐步了解每个步骤。假设我们正在训练模型来检查水果是苹果还是柠檬。我们需要选择将用于训练模型的特征。有很多可能的替代方案，包括形状、颜色、味道和皮肤光滑度：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_439_0.png)\n\n图 14.2 – ML 实验的对象\n\n对于本次训练，我们将使用颜色和糖含量。第二项测量可能不是最简单的获得，但对于本次测试，让我们假设我们拥有适当的设备来做到这一点。\n\
  \n\n\n\n\n## 收集和准备数据\n\n让我们开始收集数据，通过购买多颗苹果和柠檬。我们将从创建包含两个特征的表格开始——**颜色**和**糖分含量**。\n\
  \n> **重要说明**\n> 颜色以波长区间表示，单位为**纳米 (nm)**。\n\n这是一个涉及几种水果的示例，但为了获得准确的预测，我们需要更多样本：\n\
  \n| Color [nm] | Sugar content [g] | Fruit |\n|---|---|---|\n| 590 | 10 | Apple\
  \ |\n| 570 | 2 | Lemon |\n| 610 | 15 | Apple |\n| 500 | 3 | Lemon |\n\n在此阶段，我们应该尝试可视化数据，以确保我们没有收集过多一种类型的水果；否则，模型会偏向该水果。\n\
  \n现在，我们需要将数据拆分为**训练**和**评估数据**。如果我们的模型正确，用于训练的数据不应用于评估，因为我们总是会得到好的结果。一个经验法则是，我们应该使用\
  \ 80% 的数据进行训练，剩余的 20% 作为评估数据。一旦完成此划分，可能还需要额外的步骤来准备数据，例如归一化和去重。在我们的案例中，这些是不需要的。\n\
  \n## 选择模型\n\n现在，我们需要确定要使用哪个模型。有成千上万的模型可供选择。它们可以适用于图像、文本或基于数值的数据。模型应根据用例选择。由于我们的案例中只有两个特征，模型可以是一个简单的线性模型。\n\
  \n## 训练\n\n现在，我们将进入 ML 的核心：实际训练。让我们看看我们为训练选择的模型。这里，我们有 X = W x Y + b，其中 W 是权重，b\
  \ 是偏置，而 X 和 Y 是特征。在训练期间，我们将操作 W 和 b 的值，并使用训练数据验证我们是否得到正确的预测。其中每一次操作都称为一次训练步骤：\n\n\
  ![](img/de2c97ab017f36b3750a5bade111edd7_441_0.png)\n\n图 14.3 – ML 训练\n\n起初我们可能得到较差的结果，但逐渐地，我们将为\
  \ W 和 b 的值获得准确的预测。如果我们没有得到预期结果，可能需要选择更复杂的模型：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_441_1.png)\n\
  \n图 14.4 – 调整权重和偏置\n\n在前面的图中，我们可以看到当操作 W 和 b 时直线如何变化。一开始，我们可能得到看似不合适的[content]\n\

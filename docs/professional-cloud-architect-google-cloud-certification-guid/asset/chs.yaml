  > 颜色以波长区间表示，单位为**纳米 (nm)**。\n\n这是一个涉及几种水果的示例，但为了获得准确的预测，我们需要更多样本：\n\n| Color [nm]\
  \ | Sugar content [g] | Fruit |\n|---|---|---|\n| 590 | 10 | Apple |\n| 570 | 2\
  \ | Lemon |\n| 610 | 15 | Apple |\n| 500 | 3 | Lemon |\n\n在此阶段，我们应该尝试可视化数据，以确保我们没有收集过多一种类型的水果；否则，模型会偏向该水果。\n\

  \ line\n\n9. 在单击 **Create** 之前，让我们通过单击 **command line** 链接查看命令行。如往常一样，你只需将其复制到 Cloud\
  \ Shell 并执行即可。在以下代码中，你可以看到我们使用了在 beta 模式下可用的一些功能，例如 `gcloud beta container` 命令：\n\
  \n```\ngcloud beta container --project \"prj-bul-d-sample-base-6159\" clusters create\
  \ \"standard-cluster-1\" --zone \"us-central1-c\" --no-enable-basic-auth --cluster-version\
  \ \"1.19.9-gke.1900\" --release-channel \"regular\" --machine-type \"e2-medium\"\
  \ --image-type \"COS_CONTAINERD\" --disk-type \"pd-standard\" --disk-size \"100\"\
  \ --metadata disable-legacy-endpoints=true --scopes \"https://www.googleapis.com/auth/devstorage.read_only\"\
  ,\"https://www.googleapis.com/auth/logging.write\",\"https://www.googleapis.com/auth/monitoring\"\
  ,\"https://www.googleapis.com/auth/servicecontrol\",\"https://www.googleapis.com/auth/service.management.readonly\"\
  ,\"https://www.googleapis.com/auth/trace.append\" --num-nodes \"3\" --enable-stackdriver-kubernetes\
  \ --no-enable-ip-alias --network \"projects/prj-d-shared-base-de39/global/networks/vpc-d-shared-base\"\
  \ --subnetwork \"projects/prj-d-shared-base-de39/regions/us-central1/subnetworks/sb-d-shared-base-us-central1\"\
  \ --no-enable-intra-node-visibility --no-enable-master-authorized-networks --addons\
  \ HorizontalPodAutoscaling,HttpLoadBalancing,GcePersistentDiskCsiDriver --enable-autoupgrade\
  \ --enable-autorepair --max-surge-upgrade 1 --max-unavailable-upgrade 0 --enable-shielded-nodes\
  \ --node-locations \"us-central1-c\"\n```\n\n> **Important Note**\n> 此代码是一个示例，如果你自行操作部署，可能会略有不同。\n\
  \n10. 现在，我们可以单击 Create 并等待集群创建完成。一旦完成，我们将在集群名称旁边看到一个绿色勾号：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_196_0.png)\n\
  \n图 6.34 – Provisioned cluster\n\n11. 单击三个点符号并选择 Connect 选项后，我们将看到有关如何连接到集群的信息：\n\

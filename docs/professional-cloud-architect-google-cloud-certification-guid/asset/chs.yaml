  15 runtime: python39\n```\n\n图 5.8 – `app.yaml` 文件\n\n11. 最后，我们将查看 `requirements.txt`\
  \ 文件，该文件定义了我们在 Python 代码中使用的模块：\n\n```\nmain.py  requirements.txt\n1  Flask==2.0.1\n\
  2\n```\n\n图 5.9 – `requirements.txt` 文件\n\n12. 现在我们知道了配置和代码是什么，我们可以将应用程序部署到 App\
  \ Engine。在包含所有文件的文件夹中，运行以下命令：\n\n```\ngcloud app deploy app.yaml --project $PROJECT\n\
  ```\n\n在控制台被询问时确认此操作。部署可能需要一两分钟。\n\n13. 应用程序部署后，我们可以通过运行以下命令来检查分配给应用程序的 URL：\n\n\
  ```\ngcloud app browse\n```\n\n14. 复制 URL 并粘贴到浏览器中。你会看到应用程序已在 App Engine 中运行。简单，不是吗？\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_142_0.png)\n\n图 5.10 – 查看应用程序\n\n接下来，让我们来看版本。\n\
  \n## 版本\n\n现在，假设我们想用新内容更新应用程序：\n\n- 1. 让我们将欢迎消息修改为 Hello Packt people!：\n\n```\n\
  24 @app.route('/')\n25 def hello():\n26     \"\"\"Return a friendly HTTP greeting.\"\
  \"\"\n27     return 'Hello Packt people!'\n```\n\n图 5.11 – 修改应用程序\n\n- 2. 我们将保存更改并再次部署应用程序：\n\
  \n```\ngcloud app deploy app.yaml --project <project_id>\n```\n\n- 3. 现在，如果我们切换到\
  \ Google Cloud 控制台并进入 App Engine | 版本，我们会看到已部署了应用程序的新版本：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_142_1.png)\n\
  \n图 5.12 – 流量分配\n\n请注意，所有流量都指向新版本。\n\n返回浏览器并刷新以查看应用程序的新版本已部署：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_143_0.png)\n\
  \n图 5.13 – 查看新的应用程序版本\n\n在下一节中，我们将查看流量拆分。\n\n## 拆分流量\n\n现在，假设我们想在少量用户上测试所做的更改。我们可以通过点击右上角的拆分流量来做到这一点。这将带我们进入一个窗口，我们可以在其中选择有多少流量被定向到应用程序的每个版本。选择适当的百分比并点击保存按钮：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_143_1.png)\n\n图 5.14 – 拆分流量\n\n### 重要说明\n\
  如果看不到旧版本，请点击添加版本按钮。\n\n## 迁移流量\n\n除了拆分流量外，我们还可以一次性迁移流量。也有渐进式流量迁移选项，以便我们可以优雅地更改版本。按照以下步骤操作：\n\
  \n- 1. 选择新版本旁边的复选框，然后点击屏幕顶部的迁移流量。从弹出窗口中，点击迁移，如以下屏幕截图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_144_0.png)\n\
  \n图 5.15 – 迁移流量\n\n流量现在将被迁移到新版本。\n\n### 考试提示\n请特别注意如何在不同版本之间切换流量。这可用于推出新版本以及回滚到上一个稳定版本。\n\
  \n2. 现在，如果我们检查控制台，我们会看到所有流量都已分配给新版本：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_145_0.png)\n\
  \n图 5.16 – 流量迁移到旧版本\n\n3. 如果我们浏览到 URL，我们会看到应用程序的新版本现在正在提供服务：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_145_1.png)\n\
  \n图 5.17 – 查看应用程序\n\n在这里，我们可以看到应用程序的旧版本。\n\n## 防火墙规则\n\nApp Engine 的防火墙非常简单。它包含允许或拒绝从特定\
  \ IP 范围访问应用程序的规则列表。请注意，这些规则适用于应用程序的所有资源。规则按优先级排序，值为 1 的优先级最高，2147483647 的优先级最低：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_145_2.png)\n\n图 5.18 – 防火墙规则\n\n允许所有\
  \ IP 范围的所有流量的默认规则具有最低优先级，并且始终最后评估。\n\n## 设置\n\n从汉堡菜单进入 **App Engine | 设置**。在这里，你会找到两个重要设置：**自定义域名**\
  \ 和 **SSL 证书**。让我们现在回顾一下。\n\n## 自定义域名\n\n正如你所知，当你部署应用程序时，你会被分配一个形如 `<project_id>.appspot.com`\
  \ 的 URL。\n\n但是，你可以添加自定义域名或注册新域名。你可以从 **App Engine | 设置 | 自定义域名** 菜单中执行此操作：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_146_0.png)\n\
  \n图 5.19 – 自定义域名\n\n如果你选择注册新域名，你将能够从 Google Domains 服务购买它。\n\n## SSL 证书\n\n由于 App\
  \ Engine 中的流量是负载均衡的并使用 SSL，GCP 提供全球分布的 SSL 端点，以便你可以为应用程序用户提供服务。具有自定义域名的应用程序默认分配有托管\
  \ SSL 证书。证书将在到期前自动配置和续订。当你删除自定义域名时，证书将被撤销：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_147_0.png)\n\
  \n图 5.20 – SSL 证书\n\n如果你希望使用自己的证书，你有责任管理其生命周期。\n\n## 扩缩容\n\nApp Engine 最重要的功能之一是其能够扩缩容多个实例。我们可以选择希望使用的自动化程度。App\
  \ Engine 提供三个选项，如下所示：\n\n- **手动扩缩容**：在此设置中，你指定将运行的实例数量，无论负载如何。由于实例保留内存状态，因此可用于依赖它们的应用程序。\n\
  - **自动扩缩容**：在此设置中，多个实例取决于请求速率、响应延迟和其他应用程序指标。它还允许你指定无论负载如何都应始终运行的实例数量。\n- **基础扩缩容**：在此设置中，当应用程序收到请求时，会创建一个实例。当应用程序变得空闲时，实例将被关闭。它可用于由用户活动驱动的应用程序。\n\
  \n### 重要说明\n扩缩容是 App Engine 的一个非常重要的主题。我们希望确保应用程序能够处理负载，但我们也希望控制成本。请记住，你为实例运行的时间付费。你可以使用定义应用程序的\
  \ YAML 中的参数来控制扩缩容行为。查看进一步阅读部分，了解有关 App Engine 扩缩容的更多信息。\n\n## Cron 作业\n\n使用 cron\
  \ 作业，你可以安排在定义时间或定期间隔运行的任务。cron 作业的用例包括需要重复的管理任务。例如，也许你需要每天发送一封包含环境报告的电子邮件。\n\n对于每种语言，cron\
  \ 作业的配置略有不同。请参阅进一步阅读部分以获取各种语言的详细配置信息。cron 作业以 YAML 格式定义并放置在 `cron.yaml` 文件中。\n\n\
  以下是一个 YAML 文件，每 24 小时运行一次任务：\n\n- 1. 实际任务是使用 `url` 参数下定义的处理器运行它：\n\n```\ncron:\n\
  \  - description: \"daily summary job\"\n    url: /tasks/summary\n    target: beta\n\
  \    schedule: every 24 hours\n```\n\n- 2. 要部署 cron 作业，请使用以下命令：\n\n```\ngcloud app\
  \ deploy cron.yaml --project <project_id>\n```\n\n\n\n\n\n3. 部署后，作业将通过 Cloud Scheduler\
  \ 可见。在 Google Cloud Console 中，在 App Engine | Cron jobs 下，点击 GO TO CLOUD SCHEDULER\
  \ 按钮：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_149_0.png)\n\n图 5.21 – Cron jobs\n\
  \n点击 APP ENGINE CRON JOBS 选项卡：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_149_1.png)\n\
  \n图 5.22 – Cron job summary\n\n至此，你新建的作业已创建完成，并将每 24 小时运行一次。请注意，如果你之前未使用过，可能需要启用\
  \ Cloud Scheduler API。\n\n> Exam Tip\n> 请记住，cron 作业是一种周期性触发作业的方式，是使用 Compute Engine\
  \ 搭配原生第三方工具的替代方案。\n\n## Memcache\n\n缓存是加快我们访问频繁使用数据的常见方式。这包括会话数据、用户偏好设置，或任何不经常变化的其他查询。如果多个查询访问相同的数据，则是缓存的完美候选。Memcache\
  \ 是内置于 App Engine 的服务。它允许你在内存中保存键值对，其访问速度远快于查询数据库。Memcache 有两种服务级别，如下所示：\n\n- **Shared**：这是\
  \ Memcache 的默认且免费版本。请注意，该服务按尽力而为的方式提供缓存容量。资源与 App Engine 平台内的多个应用程序共享。\n- **Dedicated**：这是\
  \ Memcache 的可选付费版本。它提供专用于你的应用程序的固定缓存容量。按每 GB/小时计费。这应用于需要可预测性能的应用程序。\n\n你可以通过访问 **App\
  \ Engine | Memcache** 菜单来添加要缓存的值：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_150_0.png)\n\
  \n图 5.23 – Memcache\n\n> **Exam Tip**\n> 确保你理解标准缓存是按尽力而为方式提供的，可能不适合所有用例。如果想要可预测的性能，请使用专用缓存。\n\
  \n接下来，我们将查看 App Engine 所需的 IAM 角色。\n\n## IAM\n\n访问 Google App Engine 由 IAM 保护。让我们看一下预定义角色的列表，以及每个角色的简短说明：\n\
  \n- **App Engine Admin**：有权读取、写入和修改所有应用程序配置和设置的访问权限。\n- **App Engine Creator**：有权为项目创建\
  \ App Engine 资源。\n- **App Engine Service Admin**：对应用程序配置和设置具有只读权限。它还允许写入服务和版本设置，但不允许我们部署应用程序版本。\n\
  - **App Engine Deployer**：提供对应用程序配置和设置的只读访问。它允许我们部署和创建新版本并删除旧版本。然而，我们无法修改现有版本的流量配置。\n\
  - **App Engine Viewer**：提供对应用程序配置和设置的只读访问。\n- **App Engine Code Viewer**：提供对应用程序配置、设置和已部署代码的只读访问。\n\
  \n对于更粗粒度的访问，你也可以使用原始角色，如 **Owner**、**Editor** 和 **Viewer**。\n\n### Quotas and limits\n\
  \nGoogle App Engine 带有预定义的配额。这些默认配额可以通过汉堡菜单，在 **IAM & Admin | Quotas** 下进行更改。从此菜单中，我们可以查看当前配额并请求提高这些限制。你应该了解每个服务的限制，因为这会影响你的可扩展性。\n\
  \n对于 App Engine，我们应注意以下配额：\n\n- **Free quotas**：对于每个应用程序，你被允许免费使用一定数量的资源。此配额仅可对付费应用程序超出。\n\
  - **Spending limits**：此配额用于控制你的支出限制。它可以由 **project owner** 或 **billing administrator**\
  \ 设置。\n- **Safety limits**：此配额由 Google 设置以保护 App Engine。\n\n## Pricing\n\nApp Engine\
  \ 的价格由多个因素组成，且标准环境和灵活环境不同。对于标准环境实例，手动和基础扩缩服务按运行时间按小时计费。对于灵活环境，应用程序部署在虚拟机实例中，按每秒计费，最低使用时间为\
  \ 1 分钟。\n\n除此之外，你还需要包含应用程序使用的额外资源的成本。要获取最新价格，请查看以下链接：\nhttps://cloud.google.com/appengine/pricing.\n\
  \n## Summary\n\n在本章中，我们查看了 App Engine，这是一个 PaaS 产品。我们区分了两种环境类型，即标准和灵活。然后，我们查看了如何部署\
  \ App Engine 应用程序以及如何将其更新到新版本。我们还学习了如何在版本之间拆分和迁移流量。最后，我们了解了 cron 作业，它允许我们运行计划作业。\n\
  \n在下一章中，我们将查看 Cloud Functions，这是一个 Function-as-a-Service（FaaS）产品。\n\n## Further\
  \ reading\n\n要了解更多关于 App Engine 的信息，请查看以下链接：\n\n- **app.yaml reference:** https://cloud.google.com/appengine/docs/standard/python/config/appref\n\
  - **Environments:** https://cloud.google.com/appengine/docs/the-appengine-environments\n\
  - **Memcache:** https://cloud.google.com/appengine/docs/standard/python/memcache/\n\
  - **Firewall:** https://cloud.google.com/appengine/docs/standard/python/creating-firewalls\n\
  - **Cron Jobs for Python:** https://cloud.google.com/appengine/docs/standard/python/config/cron\n\
  - **Cron Jobs for Java**: https://cloud.google.com/appengine/docs/standard/java/config/cron\n\
  - **Cron Jobs for Go**: https://cloud.google.com/appengine/docs/standard/go/config/cron\n\
  - **Custom domains**: https://cloud.google.com/appengine/docs/standard/python/mapping-custom-domains\n\
  - **SSL certificates**: https://cloud.google.com/appengine/docs/standard/python/securing-custom-domains-with-ssl\n\
  - **App Engine scaling**: https://cloud.google.com/appengine/docs/standard/python/how-instances-are-managed\n"
- "# 6\n使用 Google Kubernetes Engine 管理 Kubernetes 集群\n\n在上一章中，我们深入探讨了 Google Compute\
  \ Engine，它提供 Infrastructure-as-a-Service（IaaS）。在本章中，我们将查看一个 Container-as-a-Service（CaaS）产品。Google\
  \ Kubernetes Engine（GKE）允许我们按需创建托管的 Kubernetes 集群。在开始讨论 GKE 之前，我们需要了解一些概念，例如微服务、容器和\
  \ Kubernetes 本身。\n\n> **Exam Tips**\n> GKE 在云架构师考试中被重点考察。确保你理解容器、微服务、Kubernetes\
  \ 以及 GKE 特定主题的基本概念。特别注意 *Kubernetes* 部分。很多问题与 Kubernetes 相关，而非 GKE 特定。确保你理解 Kubernetes\
  \ 架构和资源，特别注意网络和服务，以便了解应用程序如何被访问，了解如何使用 IAM 和 RBAC 保护集群，以及最后，了解如何管理、扩缩和升级 GKE 集群。\n\
  \n如果你从未听说过这些，不用担心——我们将带你了解所有基本概念。本章将涵盖以下主题：\n\n- 微服务的介绍\n- 容器\n- Kubernetes\n- Google\
  \ Kubernetes Engine\n\n## An introduction to microservices\n\n让我们先回顾一下微服务的概念。在传统世界中，应用程序以单体架构交付。这意味着多个服务托管在单个节点上。在微服务架构中，应用程序被划分为多个微服务，每个微服务托管在单独的节点上，如下所示：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_156_0.png)\n\n\n\n\n\n每个微服务负责单一的功能。微服务之间松耦合，可以单独开发和管理。它们通过\
  \ API 彼此通信。正因如此，每个微服务甚至可以用不同的编程语言开发。当你需要升级应用程序时，可以只升级单个服务，而不会影响其他组件。通过将应用程序拆分为微服务，你还可以控制应用程序的扩展方式和时机。你可以细粒度地扩展需要扩展的服务，而不影响其他服务。最后，微服务让你能够拥抱\
  \ CI/CD，并在部署可以以非常受控的方式推出时更快地交付功能。\n\n> **重要说明**\n> **持续集成和持续交付和/或持续部署（CI/CD）** 是一种简化软件交付的方法论。\n\
  > **持续集成** 是一种实践，开发人员会频繁地将代码提交到公共仓库。代码会被审查和测试。验证后，会触发自动构建。**持续交付** 允许你自动化发布流程，以便软件可以在任何时间点部署到目标环境。在\
  \ **持续部署** 中，开发人员所做的任何更改，只要通过所有测试，就会自动部署到生产环境。\n\n## 容器\n\n要理解容器，让我们将其与传统的虚拟机进行比较。虽然虚拟机虚拟化硬件，但容器虚拟化操作系统。它们将应用程序及其所有依赖项抽象为一个单元。多个容器可以托管在一个操作系统上，作为一个隔离的进程运行：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_157_0.png)\n\n图 6.2 – 容器中的应用程序\n\n容器带来以下优势：\n\
  \n- **隔离**：应用程序可以使用其库，而不会与来自其他应用程序的库冲突。\n- **资源限制**：应用程序可以限制资源的使用。\n- **可移植性**：应用程序是自包含的，包含所有依赖项，不受操作系统或云提供商的限制。\n\
  - **轻量级**：应用程序的占用空间要小得多，因为容器共享一个公共内核。\n\n允许容器运行的软件称为 **容器运行时**。\n\n虽然有许多容器运行时可用，但\
  \ Google 建议使用 **containerd**（`https://containerd.io`）。多年来，标准是 **Docker** 运行时，但最近发生了变化。**Containerd**\
  \ 被确定为最安全和高效的，已成为 Kubernetes 乃至 GKE 的新标准。如果你使用 Docker 运行 GKE 节点，Google 建议你计划迁移。请注意，你仍然可以使用\
  \ Docker 构建容器，因为这是一个在 Kubernetes 集群外部发生的独立过程。\n\n## Kubernetes\n\nKubernetes，也称为\
  \ K8s，是一个开源容器编排器，最初由 Google 开发并捐赠给 Cloud Native Computing Foundation。它允许你部署、扩展和管理容器化应用程序。作为一个开源平台，它可以在本地环境以及公共云中的多个环境上运行。它适用于无状态和有状态应用程序。\n\
  \n> **考试提示**\n> Kubernetes 是一个重要的考试主题。幸运的是，考试并不要求你对其有深入的了解。在本节中，我们将讨论管理层和 Kubernetes\
  \ 对象。我们希望你理解管理层，因为理解 GKE 本身是必要的。至于 Kubernetes 对象，请确保你至少理解本书中提到的对象，包括 Pods、Deployments、Services\
  \ 和 Namespaces。Kubernetes 本身值得一本书，市面上有很多相关书籍。如果你想了解更多，请参考 *进阶阅读部分。*\n\n## Kubernetes\
  \ 架构\n\n在下面的图中，我们可以看到 Kubernetes 集群的基本架构。集群由多个节点组成。在高层次上，master 节点负责管理集群，而 worker\
  \ 节点托管工作负载。worker 节点托管所谓的 Pods，它们是 Kubernetes 的最原子单元。这些 Pods 可以包含一个或多个容器。对 Pods\
  \ 中容器的访问是通过服务提供的。在下面的图中，我们可以看到 Kubernetes 集群以及托管在每种类型节点上的服务：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_159_0.png)\n\
  \n图 6.3 – Kubernetes 架构\n\n现在，让我们更仔细地看看 master 和 worker 节点。\n\n## master 节点\n\n\
  master 节点是一个控制平面，负责维护集群的期望状态。它监控 Kubernetes 对象定义（YAML 文件），并确保它们被调度到 worker 节点上。\n\
  \n> **重要说明**\n> **YAML Ain't Markup Language（YAML）** 是一种人类友好的数据序列化标准，主要用于配置文件。它是\
  \ XML 或 JSON 等格式的替代方案。\n\n它本质上是集群的控制平面。其工作方式如下：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_160_0.png)\n\
  \n图 6.4 – 控制平面\n\nmaster 节点运行多个进程：\n\n- **API server**：公开 Kubernetes API。它是控制平面的前端。\n\
  - **Controller manager**：多个控制器负责集群的整体健康状况。\n- **etcd**：一个托管集群状态信息的数据库。\n- **Scheduler**：负责在节点之间放置\
  \ Pods 以平衡资源消耗。\n\n集群可以用一个 master 完美运行，但为了高可用性和冗余目的，应该运行多个节点。没有 master，控制平面本质上是宕机的。你执行的所有集群管理操作都通过\
  \ master API 进行。因此，对于生产工作负载，建议你使用 *多个 master* 节点配置。\n\n```\nselector:\n  matchLabels:\n\
  \    app: nginx\n  template:\n    metadata:\n      labels:\n        app: nginx\n\
  \    spec:\n      containers:\n      - name: nginx\n        image: nginx:1.7.9\n\
  \        ports:\n        - containerPort: 80\n```\n\n无论我们定义什么类型的对象，都需要在其中包含以下数据：\n\
  \n- apiVersion：我们想要使用的 Kubernetes API 的版本\n- kind：要创建的对象的类型\n- metadata：有助于唯一标识对象的数据，例如其名称\n\
  - spec：对象的规范，根据其类型而定\n\n要创建或更新现有对象，我们可以使用以下命令：\n\n```\nkubectl apply -f definition.yaml\n\
  ```\n\n这里，definition.yaml 是包含对象定义的<|message|>。 要运行我们的第一个部署，我们必须将前面的定义保存在 definition.yaml\
  \ 文件中并运行 kubectl 命令。\n\n你可以使用多个命令来管理 Kubernetes。kubectl 是最常用的，因为它允许我们创建、删除和更新 Kubernetes\
  \ 对象。查看以下链接以了解可使用 kubectl 执行的操作：https://kubernetes.io/docs/reference/kubectl/overview/。请注意，kubectl\
  \ 默认已安装在 GCP Cloud Shell 控制台中，但如果你想从任何其他机器使用它，则需要安装它。\n\n现在，让我们逐个查看每个对象，从 Pods 开始。\n\
  \n> **选择器和标签**\n> 你会注意到 Kubernetes 对象具有称为 **labels** 和 **selectors** 的参数。\n> \n\
  > 这些参数用于将不同的对象相互关联。假设你想将 Deployment 与 Service 关联。在 Deployment 定义中，你将使用诸如 app: myapp\
  \ 的 label 属性，而在 Service 定义中，你将使用诸如 app: myapp 的 selector。\n\n## Pods\n\nPod 是 Kubernetes\
  \ 中部署的原子单元。Pod 包含一个或多个容器和存储资源。通常，Pod 内只有一个容器。当我们需要小型辅助服务时，可以向 Pod 添加额外的容器。每个 Pod\
  \ 都有一个唯一的 IP 地址，与其内部的容器共享。Pod 本质上是临时的，并在需要重新调度时重新创建。如果它们不使用持久卷，卷的内容在 Pod 重新创建时会消失。要创建\
  \ Pod，我们可以使用 kind 值 Pod 并定义我们想要使用的镜像，如下所示：\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: my-pod\n  labels:\n    app: myapp\nspec:\n  containers:\n  - name: my-container\n\
  \    image: nginx:1.7.9\n```\n\n在这里，我们可以看到一个 Pod 的定义，其中包含从 nginx 镜像部署的容器。\n\n\n\n\
  \n\n## ReplicaSets\n\nReplicaSet 对象用于管理在给定时间运行的 Pod 数量。ReplicaSet 监控正在运行的 Pod 数量，并部署新的\
  \ Pod 以达到期望的副本数。要定义一个 ReplicaSet，可以使用 kind 值为 ReplicaSet。运行的 Pod 数量定义在 replicas\
  \ 参数下：\n\n```\napiVersion: apps/v1\nkind: ReplicaSet\nmetadata:\n  name: frontend\n\
  \  labels:\n    app: guestbook\n    tier: frontend\nspec:\n  # modify replicas according\
  \ to your case\n  replicas: 3\n  selector:\n    matchLabels:\n      tier: frontend\n\
  \  template:\n    metadata:\n      labels:\n        tier: frontend\n    spec:\n\
  \      containers:\n      - name: php-redis\n        image: gcr.io/google_samples/gb-frontend:v3\n\
  ```\n\nReplicaSets 是 replication controller 对象的继任者。创建 ReplicaSets 并不是很常见。相反，你应该创建\
  \ Deployments，我们将在下一节中查看。\n\n## Deployments\n\nDeployments 用于部署、更新和控制 Pod。这些部署会在无需单独定义的情况下创建\
  \ ReplicaSets。通过说明需要多少个副本，相应的 ReplicaSet 对象将为你创建。通过更改容器中的镜像，我们可以将应用程序更新到新版本。Deployment\
  \ 对象同时支持金丝雀和蓝绿部署方法。\n\n## Namespaces\n\nNamespaces 本质上是 Kubernetes 集群内的虚拟集群。在大型环境中，可能有多个团队在开发应用程序。通过创建命名空间，用户可以重用资源名称。这些名称需要在命名空间内唯一，但在集群范围内则不需要。默认情况下，Kubernetes\
  \ 集群自带三个预定义的命名空间：\n\n- `default`: 没有其他命名空间的对象默认命名空间\n- `kube-system`: 用于 Kubernetes\
  \ 创建的资源\n- `kube-public`: 保留供将来使用：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_166_0.png)\n\
  \n图 6.5 – Namespaces\n\n可以根据需要通过运行以下命令创建额外的命名空间：\n\n```\nkubectl create namespace\
  \ <namespace-name>\n```\n\n这里，<namespace-name> 是新命名空间的名称。\n\n要部署到新的命名空间，你应该使用 --namespace\
  \ 标志，如下所示：\n\n```\nkubectl --namespace=<namespace-name> run nginx --image=nginx\n\
  ```\n\n或者，你可以在对象定义中定义 namespace 属性。\n\n命名空间可以使用网络策略相互隔离。要了解有关网络策略的更多信息，请查看本章的 Further\
  \ reading 部分。你还可以使用资源配额来限制命名空间可用的资源。以下配额请求/保留总共 1 个 CPU 和 1 GB 内存。它还将 CPU 限制为 2，内存限制为\
  \ 2 GB：\n\n```\napiVersion: v1\n```\n\n```\nkind: ResourceQuota\n```\n\n```\nmetadata:\n\
  \  name: quota-demo\nspec:\n  hard:\n    requests.cpu: \"1\"\n    requests.memory:\
  \ 1Gi\n    limits.cpu: \"2\"\n    limits.memory: 2Gi\n```\n\n正如你所见，命名空间是分离环境的良好方式。在决定部署新的\
  \ Kubernetes 集群之前，你可能想先考虑创建新的命名空间。\n\n## Services\n\nServices 用于将 Pod 分组到单个端点。正如我们所知，Pod\
  \ 会来来去去。服务有一个稳定的 IP 地址，因此请求可以发送到它并转发到 Pod。用于执行转发的算法取决于服务类型。我们将在下一节中查看每种服务类型。让我们看一个服务的简单定义。这里，我们使用\
  \ kind 值为 Service。\n\n正如我们之前提到的，你可以在服务定义中使用 selector，并在 Pod 定义中使用 label 将 Pod 分配给服务。\n\
  \n以下是简单的服务定义：\n\n```\napiVersion: v1\nkind: Service\nmetadata:\n  name: service-demo\n\
  spec:\n  selector:\n    app: myapp\n  ports:\n  - protocol: TCP\n    port: 80\n\
  \    targetPort: 9376\n```\n\n让我们看一下服务类型。\n\n## Types of services\n\n在本节中，我们将查看最重要的服务类型。服务的区别在于它们如何处理流量，以及它们是否将\
  \ Pod 对外或对内暴露。我们将讨论的服务如下：\n\n- `ClusterIP`\n- `NodePort`\n- `LoadBalancer`\n- `ExternalName`\n\
  \n让我们详细讨论每种服务：\n\n- `ClusterIP`: 这是默认服务，使用内部 `ClusterIP` 暴露 Pod。这意味着服务在集群外部不可用。`ClusterIP`\
  \ 的用例是在集群内微服务之间的内部通信：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_168_0.png)\n\n\
  以下是 `ClusterIP` 类型的 `Service` 示例定义：\n\n```\napiVersion: v1\nkind: Service\nmetadata:\n\
  \  name: clusterip-demo\nspec:\n  selector:\n    app: myapp\n```\n\n```\ntype: ClusterIP\n\
  ports:\n  - name: http\n    port: 80\n    targetPort: 80\n    protocol: TCP\n```\n\
  \n- NodePort: 这只是将每个节点在集群外部暴露。Pod 可以通过 <NodeIP>:<NodePort> 访问。如果有多个节点，则会暴露多个具有相同端口的\
  \ IP 地址：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_169_0.png)\n\n图 6.7 – The NodePort\
  \ service type\n\n以下是 NodePort 类型的 Service 示例定义：\n\n```\napiVersion: v1\nkind: Service\n\
  metadata:\n  name: nodeport-demo\nspec:\n  selector:\n    app: myapp\n```\n\n```\n\
  type: NodePort\nports:\n  - name: http\n    port: 80\n    targetPort: 80\n    nodePort:\
  \ 30080\n    protocol: TCP\n```\n\n- LoadBalancer: 这将动态创建提供商负载均衡器。在 GCP 的情况下，会为你创建网络负载均衡器。请记住它使用\
  \ Kubernetes 外部的对象并产生额外成本：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_170_0.png)\n\
  \n图 6.8 – The LoadBalancer service type\n\n以下是 LoadBalancer 类型的 Service 示例定义：\n\n\
  ```\nkind: Service\napiVersion: v1\nmetadata:\n  name: loadbalancer-demo\nspec:\n\
  \  selector:\n    app: myapp\n  ports:\n    - protocol: TCP\n      port: 80\n  \
  \    targetPort: 9376\n  clusterIP: 10.115.240.5\n```\n\n```\nloadBalancerIP: 70.10.10.19\n\
  type: LoadBalancer\nstatus:\n  loadBalancer:\n    ingress:\n      - ip: 160.160.160.155\n\
  ```\n\n- ExternalName: 此服务使用 ExternalName 规范中指定的 DNS 名称暴露。以下是 ExternalName 类型的 Service\
  \ 示例定义：\n\n```\nkind: Service\napiVersion: v1\nmetadata:\n  name: externalname-demo\n\
  spec:\n  type: ExternalName\nexternalName: my.app.example.com\n```\n\n- Ingress:\
  \ 这是一个对象，允许根据定义的规则（路径）路由 HTTP(S) 流量。它可以与一个或多个 Service 对象关联。这些服务进一步与 Pod 关联。在 GCP\
  \ 的情况下，ingress 控制器创建 HTTP(S) 负载均衡器。这些负载均衡器使用 Ingress 对象中的定义自动配置：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_171_0.png)\n\
  \n图 6.9 – Ingress diagram\n\n让我们看一下 YAML 定义。ingress 使用 kind 值为 Ingress 定义。从这里，你定义规则。根据路径，你将流量定向到关联的服务。在以下示例中，/*\
  \ 流量被定向到 web，/v2/* 流量被定向到 web2 服务：\n\n```\napiVersion: networking.k8s.io/v1\nkind:\
  \ Ingress\nmetadata:\n  name: example-ingress\nspec:\n  rules:\n  - http:\n    paths:\n\
  \    - path: /*\n      pathType: Prefix\n      backend:\n        service:\n    \
  \      name: web\n          port:\n            number: 8080\n    - path: /v2/*\n\
  \      pathType: Prefix\n      backend:\n        service:\n          name: web2\n\
  \          port:\n            number: 8080\n```\n\n这总结了最重要的 Kubernetes 对象列表。在下一节中，我们将更详细地了解\
  \ GKE。\n\n> Exam Tip\n> 在 Google Cloud Certified Developer 等专业化考试中，你可以预期 Kubernetes\
  \ 有更深入的问题。你可能会看到关于资源如 StatefulSets https://kubernetes.io/docs/concepts/workloads/controllers/statefulset)\
  \ 或 DeamonSets https://kubernetes.io/docs/concepts/workloads/controllers/daemonset)\
  \ 的问题。虽然我们不期望 PCA 考试中有这样的问题，但我们鼓励你查看官方 Kubernetes 文档。\n\n\n\n\n\n# Google Kubernetes\
  \ Engine\n\nGKE 是一种完全托管的服务，允许我们按需配置 Kubernetes 集群。它免除了手动部署集群的负担，并提供托管的主节点。它还具有手动部署所不具备的诸多优势，例如以下内容：\n\
  \n- 自动化的集群配置\n- 自动化的集群扩缩容\n- 自动化的升级\n- 自动修复\n- 集成负载均衡\n- 节点池\n- 与 Google Cloud 操作套件集成，用于监控和日志记录\n\
  \nGKE 集群可以部署在两种模式下：区域或多区域。在区域部署中，仅部署一个主节点。在多区域部署中，三个主节点部署在不同的区域中。这在下图中显示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_173_0.png)\n\
  \n图 6.10 – GKE 集群\n\n为了获得更高的可用性 SLA，并在升级管理平面时实现零停机，您应部署多区域集群。在此设置中，主节点可以逐个升级，以便在升级期间管理平面保持功能。\n\
  \n# GKE Autopilot\n\nGKE Autopilot 是 GKE 集群除标准模式外的另一种运行模式。这是 Google 试图为客户提供比 GKE\
  \ 标准模式更广泛服务范围的尝试。在 GKE Autopilot 的情况下，是 GKE 本身配置和管理集群、节点和节点池，为您提供优化的集群和完全托管的体验。您不再需要担心节点的健康状况或\
  \ Pod 的健康状况。它们由 Google 监控和管理。SLA 涵盖控制平面以及 Pod。另一个重要方面是您无需担心承载 Pod 所需的容量，因为服务会为您处理。\n\
  \n使用 GKE Autopilot，您按 Pod 运行期间请求的 CPU、内存和存储付费，而不是为 GKE 集群本身付费。您可以在此处了解有关 GKE Autopilot\
  \ 的更多信息： `https://cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview`。\n\
  \n# Node pools\n\n节点池用于将工作节点按相同配置分组。当您创建第一个集群时，所有节点都放在默认节点池中。如果您想要具有特定特征的组，例如本地\
  \ SSD、最小 CPU、特定的节点镜像或使用抢占式实例，您可能需要多个节点池：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_174_0.png)\n\
  \n图 6.11 – 节点池\n\n如果您的工作负载具有特殊资源需求，节点池可能会很有用。您可以使用 **节点污点** 和 **Pod 容忍** 的概念来允许您的工作负载调度到特定节点上。在\
  \ *进一步阅读* 部分，您将找到有关如何使用节点污点的文档链接。\n\n### Exam Tip\n请特别注意污点和容忍，因为这可能是考试中出现的话题。了解如何允许\
  \ Pod 在特定节点上运行。\n\n节点池使用 gcloud container node-pools 命令进行管理。\n\n我们将在 *调整集群大小* 部分稍后查看如何使用此命令来扩缩容我们的节点池。\n\
  \n# Container-Optimized OS (COS)\n\n默认情况下，Kubernetes Engine 中的节点使用 Google 的 Container-Optimized\
  \ OS。它是 Chromium OS 的锁定版本，用于运行容器化应用程序。镜像由 Google 维护和更新。更新会在后台自动下载。由于它移除了不必要的特性，与其他\
  \ Linux 发行版相比，其攻击面更小。\n\n请注意，此操作系统不适合运行非容器化应用程序或当您需要 Linux 提供商的企业支持时。除非您有非常充分的理由使用其他\
  \ Linux 发行版，否则请使用 Container-Optimized OS 用于节点。虽然仍有使用 Docker 运行时镜像，但 Google 建议使用运行\
  \ containerd 运行时镜像的版本。\n\n# Storage\n\n在 GKE 中使用持久存储最简单的方法是使用 GCP 服务，例如 Cloud SQL、Datastore\
  \ 或 Cloud Storage。但是，您也可以使用 Kubernetes 抽象层将存储直接暴露给 Pod。存储通过卷提供给 Pod 容器。这些卷可以由临时存储或持久存储支持。虽然临时存储适用于临时空间，但要持久化状态，需要持久存储：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_175_0.png)\n\n图 6.12 – Kubernetes 存储\n\
  \n当 Pod 崩溃并重新部署时，存储在 Pod 本地磁盘上的文件将会丢失。要保留状态，您需要使用 Pod 外部的外部存储。为此，您可以使用 **PersistentVolumes\
  \ (PVs)**，其生命周期不受 Pod 生命周期限制。在 GKE 中，这些卷通常由 Google Cloud Compute Engine 持久磁盘支持，并且可以使用\
  \ **PersistentVolumeClaim (PVC)** 动态配置。以下是声明的示例。在这里，我们请求一个 20 GB 的卷，其访问模式允许将其附加到一个节点：\n\
  \n```\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: claim-demo\n\
  spec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage:\
  \ 20Gi\n```\n\n要将此声明用作 Pod 的卷，您需要在 Pod 定义中引用该声明：\n\n```\napiVersion: v1\nkind: Pod\n\
  metadata:\n  name: mypod\nspec:\n  containers:\n    - name: myfrontend\n      image:\
  \ nginx\n      volumeMounts:\n        - mountPath: \"/var/www/html\"\n         \
  \ name: mypd\n  volumes:\n    - name: mypd\n      persistentVolumeClaim:\n     \
  \   claimName: claim-demo\n```\n\n要了解有关 PersistentVolumes 的更多信息，请参阅 *进一步阅读* 部分。\n\
  \n# GKE cluster management\n\n我们终于完成了理解 GKE 所需的理论。现在，让我们看一些管理 GKE 集群的实际示例。我们将从部署集群开始，然后查看扩缩容和升级的操作。\n\
  \n您可以使用以下几种工具来管理集群，包括：\n\n- Google Cloud Console\n- gcloud 命令行界面\n- REST API\n\n\
  出于考试目的，我们将集中在前两种工具上。让我们开始吧！\n\n# Creating a GKE cluster\n\n部署集群最简单的方法是使用 Google\
  \ Cloud Console。这也是在无需阅读命令行参考的情况下查看所有可用选项的好方法。让我们开始：\n\n1. 从汉堡菜单中，选择 Kubernetes\
  \ Engine | Clusters。从弹出窗口中，单击 CREATE 按钮，如以下屏幕截图所示：\n\n> **重要提示**\n> 如果您是首次使用 GKE，您需要启用\
  \ Kubernetes API。\n\n![](img/de2c97ab017f36b3750a5bade111edd7_177_0.png)\n\n图 6.13\
  \ – 创建 Kubernetes 集群\n\n2. 单击 **Create cluster**。您将能够选择模式。我们将使用标准模式，因为它提供了更多选择，并有助于您更好地理解\
  \ GKE。单击 **GKE Standard** 部分旁边的 **CONFIGURE**：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_178_0.png)\n\
  \n图 6.14 – 创建集群\n\n3. 在以下窗格中，您可以根据工作负载类型选择集群模板。我们将使用 **Standard cluster**，因为我们要部署一个简单的\
  \ Web 应用程序。在右侧，我们可以选择集群的更详细设置。让我们更仔细地查看可用选项：\n\n# Create a Kubernetes cluster\n\n\
  - Cluster basics\n- NODE POOLS\n- default-pool\n- CLUSTER\n- Automation\n- Networking\n\
  - Security\n- Metadata\n- Features\n\n# Cluster basics\n\n新集群将使用您在此处指定的名称、版本和位置创建。集群创建后，名称和位置无法更改。\n\

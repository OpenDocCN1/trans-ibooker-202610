  \n## 更新顺序\n\n相对于此项目中的其他实例\n\n任意\n\n图 11.31 – 创建维护窗口\n\n9. 在此阶段，我们还可以添加所需的任何标签。 最后，单击创建。\n\
  \n与其他服务一样，我们可以使用可用的命令行工具创建实例。 本章前面我们已经涉及了一些命令行工具，同样，我们可以使用 gcloud 创建新实例。 我们可以运行以下语法来创建新数据库：\n\
  \n```\ngcloud sql instances create <instance name> --database-version=<DATABASE\
  \ version> --cpu=<cpu size> --memory=<RAM size> --region=<region name>\n```\n\n\
  让我们更详细地查看这段代码：\n\n- <instance name> 是我们数据库实例的名称。\n- <DATABASE version> 是您希望创建的 MySQL\
  \ 或 PostgreSQL 的特定版本名称。\n\n- `<cpu size>` 和 `<RAM size>` 是我们希望创建的资源的大小。\n- `<region\
  \ name>` 是我们希望部署实例到的区域。\n\n让我们创建一个名为 `cloudarchitect001` 的 PostgreSQL DB，版本为 9.6，并分配\
  \ 4 个 CPU 和 3,840 MiB 的 RAM。 我们将在 `us-central` 区域部署此实例。 请注意，此命令可能会要求您启用 API。 单击是：\n\
  \n```\ngcloud sql instances create cloudarchitect001 --database-version=POSTGRES_9_6\
  \  --cpu=1 --memory=3840MiB --region=us-central\n```\n\n> **考试提示**\n> 您可以直接将本地的\
  \ MySQL、SQL 或 PostgreSQL 数据库映射到 Cloud SQL，而无需将其转换为不同格式。 这使其成为公司尝试公共云服务的常见选项之一。\n\
  \n现在我们已通过控制台和命令行创建了新实例，让我们更详细地了解一些重要功能 – 读副本和故障转移副本。\n\n## 读副本\n\nCloud SQL 提供了将主实例复制到一个或多个读副本的能力。\
  \ 这本质上是主实例的副本，它将几乎实时地在副本中注册对主实例所做的更改。\n\n> **提示**\n> 我们在此要强调的是，读副本不提供 HA，并且我们无法从主实例故障转移到读副本。\
  \ 它们也不遵循我们在创建主实例时可能指定的任何维护窗口。\n\nCloud SQL 为读复制提供了几种方案：\n\n- **读副本**：提供额外的读取容量和用于优化主实例性能的分析目标。\n\
  - **跨区域读副本**：提供与标准读副本相同的功能，但还提供灾难恢复能力、改进的读取性能以及在区域之间迁移的能力。\n\n- **外部读副本**：复制到外部于\
  \ Cloud SQL 的 MySQL 实例。 如果您从本地网络连接，它可以帮助降低延迟，并提供迁移到其他平台的路径。\n- **从外部服务器复制**：外部 MySQL\
  \ 实例为主实例并被复制到 Cloud SQL。 这也提供到 GCP 的数据复制。\n\n启用读副本是一个简单的过程。 让我们学习如何从 GCP 控制台执行此操作：\n\
  \n- 1. 再次浏览至 **数据库 | SQL**。 让我们为现有的 `cloudarchitect001` 实例添加一个副本。 我们只需打开选项菜单并选择\
  \ **创建读副本**：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_362_0.png)\n\n图 11.32 –\
  \ 创建读副本\n\n> **考试提示**\n> 在我们创建读副本之前，必须满足以下要求：必须启用二进制日志，并且在启用二进制日志后必须至少创建过一次备份。\n\
  \n只需为实例命名，选择一个区域，然后单击 **创建**。 我们将看到与创建主实例时使用的配置类似的配置选项：\n\n## 实例信息\n\n实例 ID *\n\
  cloudarchitect001-replica\n使用小写字母、数字和连字符。 以字母开头。\n\n数据库版本\nPostgreSQL 9.6\n\n##\
  \ 选择区域和区域可用性\n\n为了获得更好的性能，请将您的数据保留在需要它的服务附近。 区域是永久性的，而区域可以随时更改。\n\n区域\nus-central1（爱荷华）\n\
  \n单区域\n发生故障时无故障转移。 不推荐用于生产。\n\n多区域（高可用性）\n在您选择的区域内自动故障转移到另一个区域。 推荐用于生产实例。 增加成本。\n\
  \n图 11.33 – 创建副本\n\n2. 一旦读副本创建完成，我们将在正常的实例视图中看到以下内容：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_363_0.png)\n\
  \n图 11.34 – 查看读副本\n\n在本节中，我们查看了读副本和各种可用选项。 在下一节中，我们将查看故障转移副本。\n\n## 高可用性\n\n我相信我们都熟悉\
  \ HA 这个术语。 其目的当然是为了减少服务的停机时间，就 Cloud SQL 而言，是为了减少区域或实例不可用时的停机时间。 公共云并不免于停机，区域性中断可能会发生，以及实例可能损坏。\
  \ 通过启用 HA，我们的数据继续可供客户端应用程序使用。 如前一节所述，在部署新的 Cloud SQL 实例时，我们可以选择多区域配置来启用 HA，这意味着在同一区域但不同区域中创建两个单独的实例。\
  \ 第一个实例配置为主实例，而第二个实例用作备用。 通过对每个区域的持久磁盘进行同步复制，对主实例所做的所有写入都将在事务被确认完成之前复制到两个区域的磁盘中。\
  \ 在区域或实例发生故障的情况下，持久磁盘将附加到备用实例，后者将成为新的主实例。 然后用户将被路由到此新主实例。 此过程称为故障转移。 需要注意的是，即使原始主实例重新上线，此配置也会保持不变。\
  \ 这是因为一旦原始主实例再次可用，它将被销毁、重新创建并成为新的备用实例。 如果需要将主实例恢复到原始区域，则可以执行回退。 此过程与故障转移相同，但我们是在做出决定。\n\
  \n请注意，直到 2021 年第一季度，旧版 MySQL 具有使用故障转移副本的 HA 选项。 这现在已不再可通过 Cloud Console 获得。\n\n\
  ## 备份和恢复\n\n我们在创建新实例时之前提到过备份和恢复。 我们可以创建备份计划并根据需要从控制台或命令行触发按需备份。 如果我们想编辑实例，我们必须检查我们配置的备份计划或在必要时更改备份时间：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_364_0.png)\n\n图 11.35 – 编辑备份计划\n\n\n\n\
  \n\n备份是一种在损坏或数据丢失的情况下从特定时间点恢复我们数据的方式。Cloud SQL 为我们提供了将数据恢复到原始实例或不同实例的选项。这两种方法都会覆盖目标实例上的所有当前数据。\n\
  \n让我们看看如何从控制台恢复：\n\n+   1. 从我们的 MySQL 部署中，我们可以点击 BACKUPS 选项卡，然后滚动到页面的底部以找到我们想要恢复的特定备份：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_365_0.png)\n\n图 11.36 – 选择备份\n\n+   2.\
  \ 如果我们没有任何副本或已删除它们，那么我们可以继续。你会注意到我们可以直接恢复到源实例，也可以选择另一个实例：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_365_1.png)\n\
  \n图 11.37 – 恢复备份\n\n在下一节中，我们将了解如何迁移数据。\n\n## 数据库迁移服务\n\nGCP 现在提供了一项服务，允许我们轻松地将数据库从本地、Compute\
  \ Engine 或甚至其他云迁移到 Cloud SQL。从本质上讲，这就是 MySQL 和 PostgreSQL 工作负载在 Cloud SQL 中的 *lift\
  \ and shift*。对于希望将现有服务迁移到公共云的组织来说，这是一个理想的初始步骤，因为它意味着需要管理的基础设施更少，同时还能享受 Google Cloud\
  \ 的 HA、DR 和性能优势。\n\n## 实例克隆\n\n我们之前提到过我们可以克隆实例。这将创建源实例的副本，但它将完全独立。这并不意味着我们已建立集群或只读副本。一旦克隆完成，对源实例的任何更改都不会反映在新的克隆实例中，反之亦然。实例\
  \ IP 地址和副本不会复制到新的克隆实例，必须在克隆实例上重新配置。同样，从源实例获取的任何备份都不会复制到克隆实例。\n\n这可以从我们的 GCP 控制台或使用\
  \ gcloud 命令行工具完成：\n\n+   1. 让我们看看执行此操作时我们将使用的语法：\n+   ```\n+   gcloud sql instances\
  \ clone <instance source name> <target instance name>\n+   ```\n+   在这里，`<instance\
  \ source name>` 是你想要克隆的实例的名称，而 `<target instance name>` 是你希望分配给克隆实例的名称。\n+   2.\
  \ 让我们看看如何克隆我们的 `cloudarchitect001` 实例：\n+   ```\n+   gcloud sql instances clone\
  \ cloudarchitect001 cloudarchitect001cloned\n+   ```\n\n我们将克隆的实例命名为 `cloudarchitect001cloned`。\n\
  \n## IAM\n\n访问 Google Cloud SQL 是通过 IAM 保护的。让我们看一下预定义角色的列表及其详细信息：\n\n+   - **Owner**:\
  \ 对所有 GCP 资源具有完全访问和控制权限\n+   - **Editor**: 对所有 SQL 资源具有读写访问权限\n+   - **Viewer:**\
  \ 对所有 Google Cloud 资源具有只读访问权限，包括 Cloud SQL 资源\n+   - **Cloud SQL Admin:** 对所有 Cloud\
  \ SQL 资源具有完全控制权\n+   - **Cloud SQL Editor:** 有权管理特定实例；无法查看或修改权限或修改 SSL 证书的用户；无法导入数据或从备份恢复，也无法克隆、删除或提升实例；并且无法停止或启动副本或删除数据库、副本或备份\n\
  +   - **Cloud SQL Viewer:** 对所有 Cloud SQL 资源具有只读权限\n+   - **Cloud SQL Client:**\
  \ 可通过 App Engine 和 Cloud SQL Proxy 访问云 SQL 实例\n+   - **Cloud SQL Instance User:**\
  \ 允许访问 Cloud SQL 资源\n\n## 配额和限制\n\nGoogle Cloud SQL 带有预定义的配额。这些默认配额可以通过 **Navigation**\
  \ 菜单下的 **IAM & Admin | Quotas** 部分进行更改。从此菜单中，我们可以查看当前配额并请求提高这些限制。我们建议你熟悉每个服务的限制，因为这可能会影响你的可扩展性。对于\
  \ Cloud SQL，我们应该注意一些重要的限制。\n\n> **Exam Tip**\n> MySQL（第二代）和 PostgreSQL 的存储限制为 10\
  \ TB。\n\n需要了解的其他限制包括以下内容：\n\n+   - 每个项目最多有 100 个实例的限制。\n+   - 最大存储限制为 64 TB。\n\n\
  ## 定价\n\nCloud SQL 的定价基于 CPU 和内存定价、存储和网络定价以及实例定价。\n\n对于 CPU 和内存，它取决于位置、CPU 数量以及你计划使用的内存量。只读副本的收费与独立实例相同。\n\
  \n对于存储和网络，它取决于位置、每月每 GB 使用的存储量以及从 Cloud SQL 的网络出站流量。\n\n实例定价也取决于实例所在的位置和共享核心机器类型。\n\
  \n## 总结\n\n在本章中，我们通过查看哪些选项最适合常见需求来了解可供我们使用的存储选项。我们还了解了 Google Cloud Storage、Cloud\
  \ Firestore 和 Cloud SQL。\n\n对于 Google Cloud Storage，我们查看了用例、存储类别以及服务的一些主要功能。我们还涵盖了一些在传输数据时需要考虑的事项。很明显，Cloud\
  \ Storage 提供了很多灵活性，但在我们需要存储更结构化数据时，我们需要考虑替代方案。\n\n对于 Cloud Datastore，我们了解到该服务是一个\
  \ NoSQL 数据库，如果你的应用程序依赖于高度可用且结构化的数据，则非常理想。此外，Cloud Datastore 可以轻松地从零扩展到数 TB 的数据，并且非常适合\
  \ ACID 事务。我们还了解到它提供最终一致性或强一致性；然而，如果我们有不同的需求并且需要一个具有完整 SQL 支持的 **在线事务处理 (OLTP)**\
  \ 的关系数据库，那么我们应该考虑 Cloud SQL。\n\n对于 Cloud SQL，我们了解到我们有不同的产品——MySQL、SQL Server 和 PostgreSQL。我们回顾了如何创建和管理我们的实例，如何创建副本以及如何恢复我们的实例。\n\
  \n在下一章中，我们将继续通过介绍 Cloud Spanner 和 Bigtable 来了解 GCP 存储选项。\n\n## 进一步阅读\n\n阅读以下文章以获取有关本章所涵盖主题的更多信息：\n\
  \n+   - **Cloud Storage**: https://cloud.google.com/storage/docs/\n+   - **Cloud\
  \ Datastore**: https://cloud.google.com/datastore/docs/\n+   - **Cloud SQL**: https://cloud.google.com/sql/docs/\n\
  +   - **Cloud SQL pricing:** https://cloud.google.com/sql/pricing\n+   - **Importing\
  \ data into Cloud SQL:** https://cloud.google.com/sql/docs/mysql/import-export/importing\n\
  +   - **Exporting data from Cloud SQL:** https://cloud.google.com/sql/docs/mysql/import-export/exporting\n"
- "## 12\n探索 GCP 中的存储和数据库选项 – 第 2 部分\n\n在我们存储和数据库探索的第一部分中，我们查看了多个服务。在本章中，我们将重点关注剩余的核心数据库选项。\n\
  \n这些服务的概念可能听起来与我们在上一章中讨论的相似。例如，Cloud Spanner 与 Cloud SQL 相似，而 Bigtable 可能让你想到 Cloud\
  \ Datastore。在本章中，我们不仅会介绍 Cloud Spanner 和 Bigtable 服务，还会向你展示它们之间的区别以及为什么你可能需要选择它们而不是其他产品。\n\
  \n本章涵盖以下主题：\n\n+   - Cloud Spanner\n+   - Bigtable\n\n## Cloud Spanner\n\n可能存在你需要水平扩展而\
  \ Cloud SQL 无法满足这些需求的情况。引入 Cloud Spanner。Cloud Spanner 是一种云原生、完全托管的解决方案，旨在将关系数据库功能，例如\
  \ ACID 事务和 SQL 查询的支持，与非关系数据库的水平扩展相结合。我们应该在需要每秒高查询量或跨多个区域交付时使用 Cloud Spanner。与大多数数据库不同，Cloud\
  \ Spanner 是全球分布式的，并提供强一致的数据库服务和高性能。\n\n> **Important Note**\n> 再次强调，Cloud Spanner\
  \ 是强一致的。\n\n它还提供 >=99.999% 的可用性 SLA，当你使用多区域实例时，并且能够提供高达每秒 10,000 次读取查询或每秒 2,000\
  \ 次写入查询。重要的是要理解 Cloud Spanner 类似于 SQL 并具有模式；然而，由于其高可用性，它非常适合关键任务工作负载。其主要使用案例来自金融和零售行业。\n\
  \n> **Exam Tip**\n> 具有水平可扩展性，它还支持跨多个区域托管的应用程序。请记住，Cloud Spanner 非常适合需要强一致性的工作负载。\n\
  \n让我们看看 Cloud Spanner 的配置。我们必须在我们的 GCP 项目内创建一个 Cloud Spanner 实例来执行此操作。\n\n## 实例配置\n\
  \n当我们创建新实例时，我们应该选择实例配置。这将决定我们的实例驻留的位置以及实例中数据库的复制。我们可以在以下之间进行选择：\n\n+   - **Multi-regional:**\
  \ 使用此实例，我们将获得 99.999% 的更高 SLA——或每年大约 5 分钟的停机时间——但成本会更高。多区域允许数据库的数据在多个区域的多个区域中复制，使我们能够从位置读取数据并具有低延迟。然而，由于副本分布在多个区域以上，我们的应用程序会看到写入延迟略有增加。\n\
  \n\n\n\n\n- **区域：** 这将导致 99.99% 的 SLA，这仍然非常高，相当于每年大约只有 52 分钟的停机时间。区域实例应选择在用户和服务位于同一区域的情况下使用。这将提供最低的延迟。正如你所见，需求将决定最佳选项。我们无法在创建后更改实例的配置。区域配置将包含三个读写副本，这使我们能够满足有关我们数据所在位置的任何治理要求。\n\
  \n## 节点数\n\n我们还必须选择分配给实例的节点数。这将决定实例可用的 CPU/RAM 和存储资源量。每个节点可提供多达 2 TB 的存储，并且建议生产环境至少使用三个节点。我们可以在创建后更改节点数以进行扩容或缩容。\n\
  \n## 处理单元\n\nCloud Spanner 现在支持处理单元。1,000 个处理单元相当于 1 个节点，每个 100 个单元的增量将表现得像 1/10\
  \ 个节点。\n\n## 复制\n\n我们之前提到过副本，并且仔细查看 Cloud Spanner 内的复制非常重要。Cloud Spanner 所构建的基础分布式文件系统将在字节级别自动复制。然而，为了提供额外的数据可用性和地理位置相关性，Cloud\
  \ Spanner 还会通过创建 Cloud Spanner 组织数据的行的副本（副本）来复制数据。这些副本随后存储在不同的地理区域。其中一个副本将被选为领导者，并负责处理写入。Cloud\
  \ Spanner 有三种类型的副本：\n\n- **读/写：** 这种类型的复制将维护我们数据的完整副本，并且有资格成为领导者。这是单区域实例唯一可用的复制类型。\n\
  - **只读：** 这种类型的复制仅支持读取并且不能成为领导者。它将维护从我们的读写副本复制而来的数据的完整副本。只读仅在多区域配置中可用。\n- **见证：**\
  \ 这种类型的复制不支持读取，也不会维护我们数据的完整副本。见证复制使我们更容易在不使用读写副本所需的计算资源的情况下实现写入的法定人数。见证仅在多区域配置中可用。\n\
  \n## TrueTime\n\nTrueTime 是基于 GPS 和原子钟构建的全球分布式时钟。它返回一个时间间隔，该间隔保证包含时钟的实际时间。TrueTime\
  \ 提供给在 Google 服务器上运行的应用程序，这允许应用程序生成单调递增的时间戳。Cloud Spanner 使用 TrueTime 为事务分配时间戳，每当\
  \ Cloud Spanner 认为事务发生时。\n\n## 数据一致性\n\n如果你正在寻找保证的强一致性，那么 Cloud Spanner 就是适合你的数据库！这完全归功于它为云而设计，因此将消除其他数据库产品的大量限制。请注意，Cloud\
  \ Spanner 提供外部一致性，这是一种比强一致性更强的属性。这是事务处理系统的最严格一致性属性。\n\n当我们谈论 Cloud Spanner 的数据一致性时，明智的做法是提高对\
  \ CAP 定理概念的认识。该定理说数据库只能同时具有以下三个属性中的两个：\n\n- **C：一致性**。这意味着共享数据具有单一值。\n- **A：可用性**。读取和更新均为\
  \ 100%。\n- **P：分区**。容忍网络分区。\n\n这意味着系统可以由 CA、CP 或 AP 组成。该定理是关于 100% 可用性的，但我们知道系统不会提供\
  \ 100% 可用性；因此，系统开发人员被迫认真考虑权衡。如果我们认为在系统生命周期中的某个时刻某些网络分区是不可避免的，那么分布式系统应该设计为在分区期间放弃一致性或可用性——但仅在分区期间。Cloud\
  \ Spanner 在分区期间将放弃可用性以确保一致性。鉴于 Spanner 提供 99.999% 的可用性，这相当于每年不到 5.26 分钟的停机时间，这被认为足够高，以至于我们不必担心可用性权衡。\n\
  \n## 加密\n\n默认情况下，Cloud Spanner 中的所有数据都将使用 Google 管理的默认加密。当启用 **客户管理加密密钥 (CMEK)**\
  \ 时，Cloud Spanner 将使用我们的 Cloud **密钥管理服务 (KMS)** 密钥来保护静态数据。要使用 CMEK，我们必须在创建数据库时指定\
  \ Cloud KMS 密钥。截至 2021 年 6 月，Cloud Spanner 在使用 CMEK 时支持 **Cloud 外部密钥管理器 (Cloud EKM)**。\n\
  \n## 时间点恢复\n\nCloud Spanner 提供防止意外写入或删除的保护。这被称为 **时间点恢复 (PITR)**。例如，如果应用程序发布损坏了数据库，则\
  \ PITR 可以从过去 7 天中的某个时间点恢复你的数据。PITR 通过允许我们配置数据库的 `version_retention_period` 来保留数据的所有版本及其模式而工作。保留期范围为\
  \ 1 小时到 7 天。我们可以恢复整个数据库或其一部分，但我们在设置更长的保留期时也应考虑性能，因为这会使用更多的系统资源，尤其是在经常覆盖数据的数据库上。\n\
  \n接下来，让我们看看如何创建我们的第一个 Spanner 实例。\n\n## 创建 Cloud Spanner 实例\n\n让我们实际创建 Cloud Spanner\
  \ 实例。我们还将创建一个数据库——即一个表——并在其上运行查询：\n\n1. 浏览到 **DATABASES | Spanner**，如下图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_375_0.png)\n\

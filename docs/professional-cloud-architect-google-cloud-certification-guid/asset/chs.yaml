  \ Ex: your-project:your-dataset.your-table\n\nTemporary location *\ngs://cloudarchitectbookupdate/temp\n\
  Path and filename prefix for writing temporary files. Ex: gs://your-bucket/temp\n\
  \nEncryption\nGoogle-managed encryption key\nNo configuration required\nCustomer-managed\
  \ encryption key (CMEK)\nManage via Google Cloud Key Management Service\n\nSHOW\
  \ OPTIONAL PARAMETERS\n\nRUN JOB\n\nFigure 13.16 – Additional options\n\n4. 一旦我们运行了作业，我们将看到流程图作为输出以查看其状态。此图表显示了我们管道的阶段。它从\
  \ Cloud Pub/Sub 主题读取 JSON 格式消息，使用 JavaScript 用户定义函数对其进行转换，然后将其写入我们的 BigQuery 表。这是将\
  \ Cloud Pub/Sub 数据快速移动到 BigQuery 的一种方法：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_405_0.png)\n\
  \nFigure 13.17 – Graph view\n\n5. 如果我们进入 BigQuery 表并运行 SQL 查询，我们将看到我们正在从 Pub/Sub\
  \ 主题中提取数据（请注意，您的表名称将不同）：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_406_0.png)\n\
  \nFigure 13.18 – Query results\n\n当然，此查询将被改进，而不是我们选择所有内容。\n\n需要额外注意的一点是，尽管前面的示例已从模板构建了管道作业，但这只是可用选项之一。此选项允许我们无需编码即可快速开始。但是，GCP\
  \ 为我们提供了使用以下语言构建管道的选项：\n\n+   - Java and Maven\n+   - Python\n+   - SQL\n\n## IAM\n\
  \n对 Cloud Dataflow 的访问通过 IAM 保护。让我们看一下预定义角色的列表，以及每个角色的简短描述：\n\n+   - **Dataflow\
  \ Admin**：此角色有权创建和管理 Dataflow 作业。\n+   - **Dataflow Developer**：此角色有权执行和操作 Dataflow\
  \ 作业。\n+   - **Dataflow Viewer**：此角色对所有 Dataflow 相关资源具有只读权限。\n+   - **Dataflow Worker**：此角色为\
  \ GCE 服务账号提供执行 Dataflow 管道工作单元的权限。\n\n## Quotas and limits\n\nGoogle Cloud Dataflow\
  \ 带有预定义的配额。这些默认配额可以通过 Navigation 菜单和 IAM & Admin | Quotas 进行更改。从此菜单中，我们可以查看当前配额并请求提高这些限制。我们建议您了解每个服务的限制，因为这可能会影响您的可扩展性。对于\
  \ Cloud Dataflow，我们应注意以下限制：\n\n+   - Dataflow 使用 Compute Engine 执行管道代码，然后我们受 Compute\
  \ Engine 配额的约束。\n+   - 每个管道的工作器数量限制为 1,000 个。\n+   - 作业创建请求的限制为 10 MB。\n+   - 侧输入分片的限制为\
  \ 20,000 个。\n\n## Pricing\n\nDataflow 按每个作业按秒计费。价格因地区而异，具体取决于位置。\n\n## BigQuery\n\
  \nBigQuery 是一种完全托管的无服务器分析服务。它可以扩展到 PB 级数据，适用于数据仓库工作负载。它是我们解决方案的分析阶段，一旦 Dataflow\
  \ 处理了我们的数据，BigQuery 将通过在很短的时间内查询大量数据为我们的业务提供价值。查询以 SQL 语言执行，因此对许多人来说使用起来很容易。我们应强调\
  \ BigQuery 是企业级规模，可以极快地执行大型 SQL 查询——所有这些都不需要我们预配任何底层基础设施。\n\n> **Exam Tip**\n> BigQuery\
  \ 非常适合数据仓库工作负载，因为它具有 PB 级存储容量。\n\n## BigQuery features\n\n在本节中，我们将查看数据集和表。这些是 BigQuery\
  \ 的两个重要概念，我们需要理解它们才能在考试中取得成功。\n\n## Datasets\n\n数据集用于组织和控制对表和视图的访问。我们在将数据加载到 BigQuery\
  \ 之前至少需要一个数据集。数据集名称在每个项目中是唯一的，我们需要指定一个位置。位置可以是区域或多区域，并且在数据集创建后我们无法更改位置。在选择位置时应考虑一些因素，具体取决于导出或摄取要求。例如，如果我们计划从\
  \ Cloud Storage 等外部数据源查询数据，我们查询的数据必须与我们的 BigQuery 数据集位于同一位置。\n\n我们可以通过浏览汉堡菜单 | BIG\
  \ DATA | BigQuery，然后 SQL Workplace 创建新数据集。最后，点击我们项目旁边的三个点并选择 Create Dataset：\n\n\
  ![](img/de2c97ab017f36b3750a5bade111edd7_408_0.png)\n\nFigure 13.19 – Selecting\
  \ a dataset location\n\n创建数据集时需要考虑的另一个因素是是否应用默认表过期时间。BigQuery 对数据存储和每次查询收费。我们应该考虑设置过期日期，如果我们的表是临时使用的。以下示例显示了在选择数据位置后与前一个截图相同的截图：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_409_0.png)\n\nFigure 13.20 – Default\
  \ table expiration\n\n我们为数据集中的每个表设置了 14 天的过期值。\n\n## Tables\n\n一旦我们创建了数据集，我们就可以创建表并将数据加载到其中。表将包含组织成行的单个记录。每个表由一个模式定义，该模式将描述列名称和数据类型；例如，字符串或整数。模式在我们创建表时决定。我们还可以在创建表时为表设置过期日期。如果我们在创建数据集时设置了过期值，则该值将被创建表时设置的过期值覆盖。如果两者均未设置值，则表将永不过期。\n\
  \n分区表使管理和查询数据变得更容易。这些是被拆分为较小分区的表，这意味着它将提高查询性能并降低成本。这是因为查询读取的字节数也减少了。\n\n\n\n\n\n\
  BigQuery 提供三种类型的表分区：\n\n- **摄取时间**：BigQuery 会自动将数据加载到按日期、基于数据的分区中。\n- **时间单位列**：这些允许我们对\
  \ **DATE**、**TIMESTAMP** 或 **DATETIME** 列进行表分区。\n- **整数范围**：这些允许我们根据 **整数** 列中的值范围对表进行分区。\n\
  \n> **考试提示**\n> 可以为分区表设置过期数据。如果例如需要在一段时间后删除敏感数据，则可以使用此功能。\n\n## 联邦查询\n\n要将查询语句发送到外部数据库并将结果作为临时表接收，我们可以使用联邦查询。这些将使用\
  \ BigQuery 连接 API 并与外部数据库建立连接。这允许我们在标准 SQL 查询中使用 EXTERNAL_QUERY 函数将语句发送到外部数据库，使用该数据库的\
  \ SQL 方言。结果将被转换为 BigQuery 标准 SQL 数据类型。\n\n## 连接的表格\n\n顺便提醒一下，Google Sheets 是 Google\
  \ 的在线电子表格应用程序。连接的表格让我们能够在无需了解 SQL 的情况下分析来自 Google Sheet 的数据。我们可以从 Google Sheet 电子表格中访问、分析和共享数十亿行的\
  \ BigQuery 数据。如果我们希望在可识别的电子表格界面内与合作伙伴或分析师协作，或在不进行进一步电子表格导出的情况下提供单一事实来源，这可能很有用。连接的表格将代表我们执行\
  \ BigQuery 查询，通过请求或计划进行，并将结果保存在我们的电子表格中以供分析。\n\n## 存储与计算分离\n\nBigQuery 将存储与计算分离。通过解耦这些组件，我们可以选择最适合我们组织的存储和处理解决方案，因为它们可以独立扩展，因此提供真正的弹性数据仓库解决方案。\n\
  \n## 物化视图\n\n为了提高性能和效率，BigQuery 提供物化视图，即预计算视图，会定期缓存我们查询的结果。BigQuery 使用这些预计算结果，并在可能的情况下仅读取基表的增量更改以计算最新的结果。使用这些视图可以显著增强具有共同特征的工作负载的性能。\n\
  \n## BigQuery BI Engine\n\nBigQuery BI Engine 是内置于 BigQuery 的 **商业智能 (BI)** 服务，允许我们分析存储在\
  \ BigQuery 中的数据。它提供亚秒级查询响应时间和高并发。此外，我们可以构建由 BigQuery 支持的仪表板和报告，而不会影响性能或安全性。它可以集成到\
  \ Google 工具中，例如 Data Studio（我们将在本章后面介绍）和连接的表格，或第三方 BI 工具，例如 Microsoft 的 Power BI\
  \ 或 Tableau。\n\n## BigQuery ML Engine\n\nBigQuery ML 是一个 **机器学习 (ML)** 服务，允许我们使用\
  \ SQL 查询在 BigQuery 中创建和执行 ML 模型。机器学习将在 *第 14 章，将机器学习付诸实践* 中更详细地讨论。\n\n## BigQuery\
  \ GIS\n\nBigQuery GIS 允许我们通过位置智能增强分析工作流程。通过使用地理数据类型和标准 SQL 地理函数，我们可以在 BigQuery 中分析和可视化地理空间数据。对于基于位置数据做出决策的组织而言，这可能是一个真正的优势。\n\
  \n## BigQuery Omni\n\n截至撰写本文时，该功能处于预览阶段。然而，我们值得为您的信息突出介绍该服务。BigQuery Omni 是一种多云分析解决方案，允许我们在\
  \ Azure、AWS 和 GCP 中跨所有平台在 BigQuery UI 内分析数据。BigQuery Omni 由 Anthos 提供支持，这意味着我们无需管理任何底层基础设施。我们将在\
  \ *第 8 章，使用 Anthos 管理云原生工作负载* 中讨论 Anthos。\n\n## 使用 BigQuery\n\n让我们看看 BigQuery 的强大功能。Google\
  \ 为公众使用提供了多个示例数据集，以便您感受 BigQuery。在此示例中，我们将使用一个名为 Chicago Taxi Trips 的数据集，并执行查询以查看哪个下车区域的\
  \ tip 最高：\n\n1. 浏览到 GCP 控制台中的 BIG DATA | BigQuery，如以下屏幕截图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_412_0.png)\n\
  \n图 13.21 – 选择 BigQuery\n\n2. 展开 ADD DATA 并选择 Explore public datasets，如以下屏幕截图所示：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_412_1.png)\n\n图 13.22 – 探索公共数据集\n\n3.\
  \  在市场中搜索 taxi 并选择 Chicago Taxi Trips 数据集：\n\n## Marketplace\n\nMarketplace > \"\
  taxi\" > Datasets\n\n## Filter by\n\nTYPE\nDatasets\n\n## Datasets\n\n2 results\n\
  \nChicago Taxi Trips\nCity of Chicago\nChicago taxi trips from 2013 to present\n\
  \nNYC TLC Trips\nCity of New York\nNew York City taxi and limousine trips since\
  \ 2009\n\n图 13.23 – 在市场中搜索\n\n4.  查看数据集：\n\nChicago Taxi Trips\nCity of Chicago\n\
  Chicago taxi trips from 2013 to present\n\nVIEW DATASET\n\n图 13.24 – 公共数据集\n\n5.\
  \  您现在将看到可供我们使用的公共数据集。浏览到 Chicago Taxi Dataset：\n\n## Explorer\n\n+ ADD DATA\n\n\
  Type to search\n\nViewing pinned projects.\n\nprimeval-nectar-318916\n\nbigquery-public-data\n\
  \nchicago_taxi_trips\n\n图 13.25 – 控制台中可用的数据集\n\n6.  现在，我们可以在此数据集上编写新查询。此查询将提供一些有价值的信息。我们将按下车社区分组检索司机获得的平均小费和最高小费。我们可以看到此查询使用标准\
  \ SQL 语言，并且支持 ANSI 2011：\n\n```\nSELECT\ndropoff_community_area,\nFORMAT('%3.2f',\
  \ AVG(tips)) AS average_tip,\nFORMAT('%3.2f', MAX(tips)) AS max_tip\nFROM\n`bigquery-public-data.chicago_taxi_trips.taxi_trips`\n\
  WHERE\ndropoff_community_area IS NOT NULL\nGROUP BY\ndropoff_community_area\nORDER\
  \ BY\naverage_tip DESC\nLIMIT\n10\n```\n\n![](img/de2c97ab017f36b3750a5bade111edd7_414_0.png)\n\
  \n图 13.26 – 数据集查询\n\n请注意，从结果中我们可以看到查询仅在 1.2 秒内处理完成。这可能不是查询的数据量很大，但它表明我们可以快速加载数据集并执行查询。部署基础设施无需任何先决条件步骤。\n\
  \n关于 BigQuery，我们需要提及的一件事是它有一个名为 bq 的命令行工具。我们将在第 16 章《Google Cloud 管理选项》中更详细地介绍 bq。\n\
  \n## 导入和导出数据\n\n前面的示例基于公共数据集。BigQuery 允许我们从控制台或 Cloud Shell 上传数据。让我们看看如何使用控制台上传本地的\
  \ CSV 文件。在此示例中，我们将使用一个名为 london_bikes 的示例数据集。我们还将使用一个名为 london_bikes.csv 的 CSV：\n\
  \n1.  从我们的 BigQuery 数据集，我们可以点击加号 (+) 图标创建新表，如以下屏幕截图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_415_0.png)\n\
  \n图 13.27 – 添加表\n\n2.  然后，我们会得到几种创建表的方法。选择 Upload 并浏览到我们的 CSV 文件位置：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_415_1.png)\n\
  \n图 13.28 – 上传\n\n3.  然后，我们可以填充要添加表的目标数据集并构建我们的架构。在此示例中，我们将使用不同类型向架构添加条目。在这里，我们可以看到\
  \ start_station_name 和 num 都是 STRING：\n\n## Create table\n\nSource\nCreate table\
  \ from: Upload\nSelect file: london_bikes.csv Browse\nFile format: CSV\n\nDestination\n\
  Search for a project\nEnter a project name\nProject name My First Project\nDataset\
  \ name london_bikes\nTable type Native table\nTable name london\n\nSchema\nAuto\
  \ detect\nSchema and input parameters\nEdit as text\nName Type Mode\nstart_station_name\
  \ STRING NULLABLE\nnum STRING NULLABLE\n+ Add field\n\n图 13.29 – 导入表\n\n有时，我们也需要将表导出到外部源。这也是一个非常简单的过程。\n\
  \n让我们将表导出到 Cloud Storage 存储桶：\n\n1.  从我们的表视图，我们可以点击 EXPORT：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_416_0.png)\n\
  \n图 13.30 – EXPORT\n\n\n\n\n\n2. 然后，我们可以填充我们的存储桶名称并导出它：\n\n## 导出表到 Google Cloud\
  \ Storage\n\n![](img/de2c97ab017f36b3750a5bade111edd7_417_0.png)\n\n图 13.31 – 导出表到\
  \ Google Cloud Storage\n\nGCP 还提供了一种名为 BigQuery Data Transfer Service 的服务，它将按计划自动执行将数据移入\
  \ BigQuery 的过程。完成初始数据传输配置后，该服务将自动将数据加载到 BigQuery。请注意，它不能用于将数据从 BigQuery 传输出去。\n\n\
  ## 存储\n\n尽管我们将 BigQuery 讨论为大数据，但让我们提醒自己，它也是一种存储服务。没有必要将旧数据导出到另一个存储平台。使用 BigQuery，我们可以享受与\
  \ Cloud Storage 等服务相同的低廉长期存储。只要我们在 90 天内未编辑表，则我们的成本将降低 50%，这将与 Cloud Storage Nearline\
  \ 类的成本相匹配。\n\n我们现在已从数据中获得了有价值的信息。通过将我们的完整服务组合在一起，从高层次来看，我们的解决方案现在看起来像这样：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_417_1.png)\n\
  \n图 13.32 – 服务架构图\n\n花点时间回顾一下前面的图表，并了解每个阶段使用的服务。这对考试很重要。\n\n## Storage Read API\n\
  \nBigQuery 还提供 Storage Read API，可快速访问 BigQuery 管理的表数据。这是访问 BigQuery 中表数据的第三种选择，除了\
  \ `tabledata.list` 或 `jobs.getQueryResults` REST API，或使用 BigQuery `extract` 作业进行批量数据导出，后者会将表数据导出到\
  \ Cloud Storage。当使用 Storage Read API 时，结构化数据以二进制序列化格式通过线路发送，从而允许额外的并行性，从而改进了原来的两个选项。\n\
  \n## IAM\n\n对 BigQuery 的访问通过 IAM 保护。让我们看一下预定义角色的列表，以及每个角色的简短描述：\n\n- **BigQuery\
  \ User**：此角色有权在项目中运行作业。它还可以创建新数据集。组织中的大多数个人都应为用户。\n- **BigQuery Job User**：此角色有权在项目中运行作业。\n\
  - **BigQuery Read Sessions User**：此角色有权通过 BigQuery storage API 在项目中创建和读取会话。\n- **BigQuery\
  \ Data Viewer**：此角色有权读取数据集元数据并列出数据集中的表。它还可以读取数据集表的数据和元数据。\n- **BigQuery Metadata\
  \ Viewer**：此角色有权列出所有数据集并读取项目中所有数据集的元数据。它还可以列出所有表和视图并读取项目中所有表和视图的元数据。\n- **BigQuery\
  \ Data Editor**：此角色有权读取数据集元数据并列出数据集中的表。它可以创建、更新、获取和删除数据集表。\n- **BigQuery Data Owner**：此角色有权读取、更新和删除数据集。它还可以创建、更新、获取和删除数据集表。\n\
  - **BigQuery Admin**：此角色有权管理项目中的所有资源。\n\n## 配额和限制\n\nBigQuery 带有预定义的配额。这些默认配额可以通过导航菜单和\
  \ IAM & Admin | Quotas 进行更改。从此菜单中，我们可以查看当前配额并请求提高这些限制。我们建议您了解每个服务的限制，因为这会影响您的可扩展性。对于\
  \ BigQuery，我们应注意以下限制：\n\n- 并发查询的限制为 100 个。\n- 查询执行时间限制为 6 小时。\n- 每天允许最多 1,500 次表操作。\n\
  - 每个项目每秒最多可流式传输 100,000 行数据。在美国和欧盟多区域为 500,000。\n- 每个用户最多允许 300 个并发 API 请求。\n\n\
  ## 定价\n\nBigQuery 的存储成本基于我们存储的数据量。我们可能会被收取活动存储和长期存储费用。当然，长期存储的月度费用会更低。此外，我们还会为运行查询付费。我们为查询提供了两种定价模式：\n\
  \n- **按需**：此模式根据每个查询处理的数据量收费。\n- **固定费率**：这使我们可以购买专用资源进行处理，因此我们不会为单个查询付费。\n\n定价还取决于我们的\
  \ BigQuery 数据集的位置。现在，让我们来看一下 Dataproc。\n\n## Dataproc\n\nDataproc 是 GCP 用于运行 Hadoop\
  \ 和 Spark 集群的大数据托管服务。Hadoop 和 Spark 是开源框架，以分布式方式处理大数据应用的数据处理。基本上，它们为数据提供海量存储，同时提供巨大的处理能力来处理并发处理任务。\n\
  \n如果我们参考本章的 *端到端大数据解决方案* 部分，Dataproc 也是处理阶段的一部分。它可以与 Dataflow 相比较；然而，Dataproc 要求我们预配服务器，而\
  \ Dataflow 是无服务器的。\n\n**考试提示**\n如果我们已有现有的 Hadoop 或 Spark 集群，则应选择 Dataproc 而非 Dataflow。此外，还需要现有资源的技能。如果我们需要创建新的管道作业或处理流数据，则应选择\
  \ Dataflow。\n\n作为在本地托管这些服务的替代方案，Google 提供了 Dataproc，它具有许多优势——主要是节省成本，因为您只需为所使用的资源付费，无需为所需处理能力和存储进行大量初始投入。传统的本地\
  \ Hadoop 集群通常运行成本高昂，因为您为未经常使用的处理能力付费，并且我们不能删除集群，因为我们的数据也会被删除。相比之下，Dataproc 摆脱了持久集群，转而使用临时集群。Dataproc\
  \ 与 Cloud Storage 集成良好。因此，如果我们有运行作业的需求，我们可以非常快速地启动集群，处理我们的数据，并将其存储在同一区域的 Cloud Storage\
  \ 中。然后，我们可以简单地删除我们的集群。Dataproc 集群不用于 24/7 运行，因为它们是特定于作业的，这就是我们能够节省成本的地方。这种方法使我们能够为单个作业使用不同的集群配置，根据单个作业或作业组扩展集群，并减少集群的维护，因为我们每次需要运行作业时都只需启动一个全新配置的集群。\n\
  \n**考试提示**\n临时集群的全部意义在于仅在作业生命周期内使用它。\n\n## 架构\n\n下图显示了 Dataproc 的高层架构：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_420_0.png)\n\
  \n图 13.33 – Dataproc\n\n底层的 Dataproc 基础设施建立在 Compute Engine 上，这意味着我们可以根据预算构建多种机器类型，并利用预定义和自定义机器类型。\n\
  \n> **考试提示**\n> 使用抢占式实例也会增加成本节约。\n\n创建 Dataproc 集群时，我们可以选择最多 96 个 CPU 内核和 624 GB\
  \ RAM 的最大组合。我们还可以选择 SSD 和 HDD 存储。请参阅 *第 4 章，使用 Google Compute Engine*，了解有关机器类型的更多详细信息。\n\
  \n在 Dataproc 集群中，有不同类别的机器：\n\n- **主节点**：此机器将分配并同步工作节点上的任务并处理结果。\n- **工作节点**：这些机器将处理数据。由于其\
  \ CPU 和内存规格很高，这些可能很昂贵。\n- **抢占式工作节点**：这些是次要工作节点，可选。它们执行相同的工作，但降低了非关键数据处理的每小时计算成本。\n\
  \n创建新集群时，我们可以选择不同的集群模式：\n\n- **标准**：这包括一个主节点和 N 个工作节点。如果 Compute Engine 出现故障，在飞行中的作业将失败，并且文件系统在主节点重新启动之前将无法访问。\n\
  - **高可用性**：这包括三个主节点和 N 个工作节点。这旨在允许在 Compute Engine 出现故障或重新启动的情况下不间断操作。\n- **单节点**：这将主节点和工作节点合并在一起。这不适合大规模数据处理，应用于\
  \ PoC 或小规模非关键数据处理。\n\n\n\n\n\n默认情况下，当我们创建一个集群时，标准 Apache Hadoop 生态系统组件将自动安装在集群上：\n\
  \n- Apache Spark\n- Apache Hadoop\n- Apache Pig\n- Apache Hive\n- Python\n- Java\n\
  - Hadoop 分布式文件系统 (HDFS)\n\n> **重要说明**\n> 从本地部署迁移到 Google Cloud Storage 的流程在 https://cloud.google.com/solutions/migration/hadoop/hadoop-gcp-migration-data\
  \ 中有进一步说明。\n\n我们还可以在可执行文件或脚本中指定初始化操作，Dataproc 会在集群设置完成后立即在集群中的所有节点上运行这些操作。这些操作通常用于设置作业依赖项，以确保作业不需要安装任何依赖项。\n\
  \n## IAM\n\n对 Dataproc 的访问通过 IAM 保护。让我们来看一下预定义角色的列表，以及每个角色的简短描述：\n\n- **Dataproc\
  \ Editor**：对此具有完全控制权 Dataproc。\n- **Dataproc Viewer**：此角色有权获取和列出 Dataproc 机器类型、区域、区域和项目。\n\
  - **Dataproc Worker**：此角色仅适用于服务账号，并提供与 Dataproc 配合操作所需的最低权限。\n- **Dataproc Admin**：此角色具有与\
  \ Editor 相同的权限，但可以获取和设置 Dataproc IAM 权限。\n\n## 配额和限制\n\n由于 Dataproc 集群使用其他 GCP 产品，因此\
  \ Compute Engine 的限制和配额适用于 Dataproc。当我们创建 Dataproc 集群时，计算资源将影响我们的区域配额限制。\n\n我们建议您查看\
  \ *进一步阅读* 部分，了解有关 Compute 配额的更多信息。\n\n## Cloud IoT Core\n\n**物联网**，或 **IoT**，是连接到互联网的物理对象的统称。你无疑今天正在使用许多\
  \ IoT 设备，例如智能手表、Google Home 或无线控制的灯泡。\n\nCloud IoT Core 是一种完全托管的服务，允许我们安全地连接、管理和从全球各地的设备摄取数据。它也是完全无服务器的，这意味着无需前期软件安装。Cloud\
  \ IoT Core 与其他 GCP 服务集成，为收集、处理和分析实时数据提供完整的解决方案。让我们看一下下面的图表。它向我们展示了 Cloud IoT Core\
  \ 在本章讨论的整体端到端解决方案中的位置，以及 IoT 设备可用于与其通信的协议 – MQTT 和 HTTP：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_423_0.png)\n\
  \n图 13.34 – 服务图\n\n> **重要说明**\n> \n> **MQTT** 是一种 Pub/Sub 协议，常用于嵌入式设备。MQTT 被认为以数据为中心，更适合\
  \ IoT。\n> \n> **HTTP** 是一种无连接协议，设备将保持与 Cloud IoT Core 的连接。HTTP 被认为以文档为中心。\n\n两种协议都通过\
  \ **协议桥** 与 Cloud IoT Core 通信，该桥提供以下功能：\n\n- MQTT 和 HTTP 协议端点\n- 自动负载均衡\n- 通过 Pub/Sub\
  \ 实现全球数据访问\n\n另一个关键组件是 **设备管理器**。它用于执行以下操作：\n\n- 注册单个设备\n- 配置单个设备\n- 更新和控制设备\n-\
  \ 提供基于角色的访问控制\n- 提供用于设备部署和监控的控制台和 API\n\n## IAM\n\n对 Cloud IoT Core 的访问通过 IAM 保护。让我们来看一下预定义角色的列表，以及每个角色的简短描述：\n\
  \n- **Cloudiot Viewer**：对此具有只读访问权限 所有 Cloud IoT 资源。\n- **Cloudiot Device Controller**：此角色有权更新设备的配置。它没有创建或删除设备的权利。\n\
  - **Cloudiot Provisioner**：此角色有权从注册表中创建和删除设备，但不能修改注册表。\n- **Cloudiot Editor**：对此具有读写访问权限\
  \ 所有 Cloud IoT 资源。\n- **Cloudiot Admin**：对此具有完全控制权 所有 Cloud IoT 资源和权限。\n\n## 配额和限制\n\
  \nCloud IoT core 有许多限制，从项目限制到设备限制不等，并分为三个类别：\n\n- **项目、设备和遥测限制**：这些限制指的是每个项目的设备数量、设备元数据、遥测事件有效负载以及每个设备的\
  \ MQTT 连接。\n- **速率**：这些限制指的是设备到云和云到设备吞吐量限制、每个连接的 MQTT 每秒传入消息数以及设备管理器 API 限制。\n-\
  \ **时间**：这些限制指的是 MQTT 连接时间和超时限制。\n\n我们建议您参考 *进一步阅读* 部分了解更多信息。\n\n## 定价\n\nCloud\
  \ IoT Core 根据每个日历月使用的數據量收费。Google 建议使用定价计算器来根据交换的数据量估算价格。\n\n## Data Fusion\n\n\
  Cloud Data Fusion 是一种完全托管的云原生数据集成服务，可快速构建和管理数据管道。Data Fusion 使用 Dataproc 作为这些管道的执行环境。GUI\
  \ 面向各种用户，这意味着业务用户、开发人员和数据科学家可以轻松构建集成解决方案，以清理、准备和转换数据。数据融合还提供了一系列预配置的插件来扩展其功能。还需要注意的是，它由一个名为\
  \ **Cask Data Application Platform (CDAP)** 的开源项目提供支持。\n\n## 核心概念\n\n一些核心 Data Fusion\
  \ 概念值得强调，以便了解该产品及其使用方法。\n\n## 实例\n\n首先，我们必须创建一个 Cloud Data Fusion 实例。实例作为 Compute\
  \ Engine 服务账号运行，Data Fusion 使用 Dataproc 集群执行管道。实例是 Data Fusion 的唯一部署，并从 GCP 控制台创建。在创建时，我们可以决定要部署的实例类型，选择将由需求和成本决定。有三个选项：\n\
  \n- **Developer** 实例提供功能齐全的版本，具有区域可用性和对执行环境的限制。\n- **Basic** 实例提供全面的集成能力，但对同时管道运行有限制，建议用于非关键环境。\n\
  - **Enterprise** 实例也提供全面的集成能力，但对同时管道运行没有限制，建议用于关键环境。\n\n每个实例都包含一个唯一且独立的 Data Fusion\
  \ 部署，其中包含一组处理管道生命周期管理、编排、协调和元数据管理的服务。请注意，在我们创建实例之前，将提示我们启用 API 并创建凭据：\n\n## 版本\n\
  \nDeveloper\n此版本为产品探索和开发环境提供功能齐全的版本，具有区域可用性和对执行环境的限制。\n\nBasic\n此版本提供全面的数据集成能力。用户可以构建批处理数据管道；连接到任何数据源；执行免代码转换。对同时管道运行有限制。建议用于非关键环境。\n\
  \nEnterprise\n此版本提供 Basic 版本提供的所有功能。此外，还包括对实时数据管道的支持；与数据血缘的交互；对同时管道运行没有限制；以及高可用性。建议用于关键环境。\n\
  \n图 13.35 – 选择实例版本\n\n一旦实例部署完成，我们可以点击实例 URL，这将打开一个单独的 Data Fusion UI，允许我们查看我们的实例。让我们来看一下部署示例管道：\n\
  \n1. 从 Data Fusion UI，点击 **HUB**。这将打开一个插件列表，我们可以利用这些插件来扩展 Data Fusion 的功能：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_427_0.png)\n\
  \n图 13.36 – 查看实例\n\n\n\n\n\n2. 选择 Cloud Data Fusion Quickstart 插件：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_428_0.png)\n\
  \n图 13.37 – Quickstart 插件\n\n3. 点击 Create，必要时更新管道名称，然后点击 Finish：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_428_1.png)\n\
  \n图 13.38 – 创建管道\n\n4. 在提示时点击 **Customize Pipeline**。这将带我们进入管道工作室。这是一个用于开发管道的图形界面。它允许我们将各种插件拖放到画布上。如果我们从右上角点击\
  \ **Deploy**，它将把管道提交给 Data Fusion。在此示例管道中，我们正在从 Cloud Storage 读取包含《纽约时报》畅销书数据的 JSON\
  \ 文件。然后它将对文件运行转换以解析和清理数据。最后，它将把最近一周内新增的、价格低于 $25 的评分最高的书籍加载到 BigQuery 中：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_429_0.png)\n\
  \n图 13.39 – 部署管道\n\n5. 然后我们可以 **Run** 我们的管道并在流程结束时查看结果：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_429_1.png)\n\
  \n图 13.40 – 管道结果\n\n至此，我们已经了解了入门使用 Data Fusion 是多么容易。\n\n## Execution environments\n\
  \nCloud Data Fusion 会在我们手动运行管道或希望管道通过计划或管道状态触发器运行时创建临时执行环境。我们已经提到 Cloud Data Fusion\
  \ 支持 Dataproc 作为执行环境。我们可以选择以 MapReduce、Spark 或 Spark Streaming 程序的方式运行管道。Cloud Data\
  \ Fusion 会在管道运行开始时在我们的客户项目中配置一个临时的 Dataproc 集群。然后，它将使用 MapReduce 或 Spark 在集群中执行管道，并在管道执行完成后删除集群。\n\
  \n如果我们使用 Terraform 等技术来管理现有的 Dataproc 集群，我们可以配置 Cloud Data Fusion 使用这些集群而不配置新集群。\n\
  \n建议我们使用自动扩缩容策略来增加集群规模，而不是减小规模。使用自动扩缩容减小规模也会移除保存中间数据的节点，可能导致失败。\n\n## Pipelines\n\
  \n管道为我们提供了一种可视化设计数据和控制流的方式，用于从各种数据源——无论是本地还是基于云的——提取、转换、聚合和加载数据。管道允许我们创建数据处理工作流，帮助我们解决数据摄取、集成和迁移问题。我们可以使用\
  \ Cloud Data Fusion 构建实时和批处理管道。\n\n管道允许我们使用数据的逻辑流来表达数据处理工作流，而 Cloud Data Fusion\
  \ 将处理在执行环境中物理运行所需的所有功能。Cloud Data Fusion 规划器通过在 Dataproc 上使用 Apache Spark 和 Apache\
  \ Hadoop MapReduce 将逻辑流转换为并行计算。\n\n## Use cases\n\n应考虑以下用例使用 Data Fusion：\n\n- GCP\
  \ 上的安全数据湖。Data Fusion 帮助我们在 GCP 上构建可扩展的分布式数据湖。\n- 具有 BigQuery 的敏捷数据仓库。Data Fusion\
  \ 可以打破数据孤岛并实现在 BigQuery 中开发数据仓库解决方案。\n- 统一分析。Data Fusion 可以在各种本地数据仓库之间建立分析环境。\n\n\
  ## IAM\n\n对 Cloud Data Fusion 的访问通过 IAM 保护。让我们来看一下预定义角色的列表以及每个角色的简短描述：\n\n- **Datafusion\
  \ Viewer**：这具有对 Data Fusion UI 的完全访问权限，以及查看、创建、管理和运行管道的权限。\n- **Datafusion Admin**：这具有所有查看者权限，外加创建、更新和删除所有\
  \ Data Fusion 实例的权限\n- **Datafusion Runner**：这授予 Dataproc 服务账号，以便 Dataproc 获得授权以通信管道运行程序信息。\n\
  \n## Quotas and limits\n\n值得注意的有几个限制：\n\n- 单个用户在单个区域的请求限制为每分钟 600 次。\n- Data Fusion\
  \ 配额适用于所有执行的管道。\n- Data Fusion 还存储日志，因此适用 Cloud Operations 日志配额。\n\n我们建议您参考 *Further\
  \ reading* 部分获取更多信息。\n\n## Pricing\n\nData Fusion 的使用量按 Cloud Data Fusion 实例从创建到删除之间的时间长度（以分钟为单位）来衡量。Cloud\
  \ Data Fusion 按分钟计费，尽管价格按小时定义。使用量将以小时为单位衡量——例如，30 分钟为 0.5 小时——以将按小时的价格应用于按分钟的使用。\n\
  \n现在，让我们来看 Datastream API。\n\n## Datastream API\n\nDatastream 是一种无服务器的 **change\
  \ data capture (CDC)** 和复制服务。它帮助我们将来自 Oracle 或 MySQL 的变更流引入 Google 的数据服务，以支持分析、数据库复制和事件驱动架构。它允许我们在异构数据库和应用程序之间以最小的延迟和停机时间同步数据。\n\
  \n请注意，在撰写本文时，该产品处于 pre-GA 阶段。然而，我们认为值得强调该服务以供了解。\n\n## Additional considerations\n\
  \nGoogle 提供的其他服务我们希望重点介绍：\n\n- **Dataprep**：这是一个 Web 应用程序，允许我们通过与数据样本交互来定义数据的准备规则。与我们讨论过的许多其他服务一样，Dataprep\
  \ 是无服务器的，无需前期部署。默认情况下，Dataprep 作业在 Dataflow 管道上执行。有关更多信息，请参阅 https://cloud.google.com/dataprep/。\n\
  - **Datalab**：这基于 Jupyter（前身为 IPython），这是一个开源 Web 应用程序。Datalab 是一个交互式数据分析和机器学习环境。我们可以使用该产品通过\
  \ Python 和 SQL 交互式地可视化和探索数据。这将被视为我们端到端解决方案的数据使用阶段的一部分，并将使用从 BigQuery 传递的数据。Datalab\
  \ 免费，但运行在 Compute Engine 实例上，因此会产生费用。有关更多信息，请参阅 https://cloud.google.com/datalab/。\n\
  - **Data Studio**：这是一个 **Business Intelligence (BI)** 解决方案，可将您的数据转化为信息丰富且易于阅读的仪表板和报告。它是一个完全托管的可视化分析服务。有关更多信息，请参阅\
  \ https://datastudio.google.com/overview/。\n- **Composer**：另一个工作流编排服务是 Cloud Composer。基于\
  \ Apache Airflow 开源项目构建，它允许我们创建跨公共云和本地数据中心的跨域工作流。工作流是一系列用于摄取、转换、分析和利用数据的任务。在 Airflow\
  \ 中，这些工作流使用所谓的 **Directed Acyclic Graphs (DAGs)** 创建。DAGs 表示我们想要调度和运行的一组任务。Cloud\
  \ Composer 使用 Python 运行，因此不受云厂商锁定影响且易于使用。DAGs 使用 Python 脚本创建，以代码形式定义任务及其依赖关系。\n\n\
  与 Data Fusion 类似，执行这些工作流需要一个环境。通过使用 Cloud Composer，我们可以受益于 Airflow 的所有功能，而无需任何安装或管理开销，因此\
  \ Composer 将配置运行我们工作流所需的 GCP 资源。此组件组称为 Cloud Composer 环境，基于 GKE。您可以在创建 Composer\
  \ 环境时定义 GKE 集群中的节点数。有关更多信息，请参阅 https://cloud.google.com/composer/docs/concepts/overview。\n\
  \n\n\n\n\n- **Looker：** Looker 是一个企业平台，帮助我们探索和共享公司数据，以便做出更明智的业务决策。使用一种名为 LookML\
  \ 的建模语言，我们可以查询数据以创建报表、仪表板和其他数据模式。\n\n- **数据目录：** 没有合适的工具，处理当今许多组织中日益增长的数据资产数量将是一个真正的挑战。利益相关者希望搜索有洞察力的数据、理解数据，并使数据尽可能有用。数据目录是一种可扩展的元数据管理服务，可以编目来自\
  \ BigQuery、Pub/Sub、Dataproc 元存储和 Cloud Storage 的数据资产的元数据。有关更多信息，请参阅 https://cloud.google.com/data-catalog/docs/concepts。\n\
  \n虽然前述服务不是主要的考试主题，但我们仍应了解每项服务提供的功能。\n\n## 摘要\n\n在本章中，我们涵盖了与考试相关的与大数据的主要方面。我们介绍了每项服务，并展示了这些服务可以在我们端到端解决方案的不同阶段使用。我们花时间了解如何从\
  \ GCP 控制台配置 Pub/Sub、Dataflow 和 BigQuery，并讨论了 Dataproc 和 Cloud IoT Core。\n\n> **考试提示**\n\
  > 本章的关键要点是了解哪些服务映射到数据的摄取、处理和分析阶段。\n\n然后，我们查看了我们解决方案的处理阶段。Cloud Dataflow 将部署 Google\
  \ Compute Engine 实例来部署和执行我们的 Apache Beam 管道，该管道将处理来自 Pub/Sub 的数据并将其传递到后续阶段进行分析和存储。我们展示了如何在\
  \ GCP 控制台中轻松创建管道，该管道从 Pub/Sub 拉取信息以在 BigQuery 中进行分析。\n\n之后，我们介绍了 BigQuery 并理解它是数据仓库。它旨在使数据分析师更高效，在很短的时间内处理\
  \ PB 级数据。它是完全无服务器的，因此在使用之前我们不必担心预配任何基础设施，这节省了大量前期成本和时间。我们了解了设置数据集并开始查询它是多么容易和快速。\n\
  \n我们还介绍了 Dataproc。我们介绍了该服务的架构，并确定 Dataproc 是在本地托管 Hadoop 集群的替代方案。我们现在应该理解 Dataproc\
  \ 可用于处理从 Cloud Pub/Sub 注入的数据。\n\n我们还介绍了 Cloud IoT Core，用于连接物联网设备。我们向您展示了如何摄取这些设备生成的实时数据。此外，我们讨论了使用\
  \ Data Fusion 的数据管道以及 Datastream 中的无服务器 CDC 和复制服务。我们还介绍了 Dataprep、Datalab、Datastudio、Composer、DataCatalog\
  \ 和 Looker。\n\n在下一章中，我们将研究机器学习。\n\n## 进一步阅读\n\n阅读以下文章以获取有关本章所涵盖主题的更多信息：\n\n- 对于\

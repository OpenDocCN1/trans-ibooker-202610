  \n图 7.21 – 服务详情\n\n至此，我们学习了如何部署 Cloud Run 服务的新修订版本，以及如何管理流量以将一定量的流量路由到特定修订版本。这例如可以帮助你对一小部分用户运行金丝雀部署。如果你想了解如何使用持续部署部署新修订版本，请访问\
  \ Konrad 的 YouTube 频道：https://www.youtube.com/watch?v=QjBbOKb9yns。\n\n## 映射自定义域名\n\
  \n正如我们在前面的章节中所看到的，对于部署的每个 Cloud Run 服务，都会生成一个自动 URL。你可能希望映射自己的域名而不是使用生成的域名。这可以通过映射自定义域名的功能实现。它要求你执行以下操作：\n\
  \n- 将自定义域名映射到服务。\n- 将 DNS 记录添加到你的域名注册商。\n\n如果你没有域名，可以直接从 Cloud Run 控制台使用 Cloud Domains\
  \ 服务注册域名。\n\n请注意，此功能仅在少数区域可用。要查找所有受支持区域的列表并查看映射自定义域名的逐步操作，请查看 https://cloud.google.com/run/docs/mapping-custom-domains。\n\
  \n## IAM 角色\n\n对 Cloud Run 的访问通过 IAM 保护。让我们看一下预定义角色的列表以及每个角色的简短描述：\n\n- **Cloud\
  \ Run admin** (`roles/run.admin`)：有权创建、更新和删除服务。还可以获取和设置 IAM 策略。部署服务需要额外的权限。\n- **Cloud\
  \ Run developer** (`roles/run.developer`)：有权创建、更新和删除服务。还可以获取但*不能*设置 IAM 策略。\n- **Cloud\
  \ Run viewer** (`roles/run.viewer`)：有权查看服务和获取 IAM 策略。\n- **Cloud Run invoker** (`roles/run.invoker`)：有权调用服务。\n\
  \n## 配额和限制\n\nCloud Run 的配额和限制列表相当长，因此请参阅 https://cloud.google.com/run/quotas 获取详细列表。对于考试，你可能希望记住其中一些最重要的内容。\n\
  \nCloud Run 具有以下限制：\n\n- 每个区域 1,000 个服务\n- 每个服务 1,000 个修订版本\n- 每个服务 1,000 个容器实例（可扩展）\n\
  - 每个容器实例 8 GB 内存\n- 每个容器实例 4 个 vCPU\n- 8 GB 可写内存存储\n- 最长 60 分钟超时\n- 每个容器实例 250 个并发请求\n\
  \n## Exam Tips\n\n请记住，Cloud Run 的超时时间为 60 分钟，而 Cloud Function 的超时时间为 9 分钟（540s）。这意味着\
  \ Cloud Run 可以成为 Cloud Function 会超时的情况下的解决方案。但是，请注意长时间运行容器实例的成本方面。此外，Cloud Run 最多可提供\
  \ 250 个并发请求，而 Cloud Function 只能提供单个线程。\n\n## 定价\n\n由于 Cloud Run 是一种完全托管的服务，你按使用量付费，无需担心底层基础设施。了解这一点非常重要，因为我们了解到容器会在访问应用程序的请求触发时进行配置和取消配置。在\
  \ Cloud Run 的情况下，当应用程序运行时会产生费用，并且按最接近 100 毫秒计费。费用适用于以下情况发生的时间：\n\n- 容器实例正在启动。\n\
  - 容器实例正在关闭并处理 SIGTERM (https://cloud.google.com/blog/products/containers-kubernetes/kubernetes-best-practices-terminating-with-grace)\
  \ 信号。\n- 至少有一个实例正在提供请求。\n\n可计费的活动时间从第一个请求的开始到最后一个请求的结束：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_232_0.png)\n\
  \n图 7.22 – Cloud Run 计费时间\n\nCloud Run 提供 200 万次请求的免费额度，前 100 万次请求提供 180,000 vCPU\
  \ 秒和 360,000 GiB 秒的内存。北美境内还有 1 GiB 的免费出站流量。\n\n请注意，如果你设置了最小容器实例数，你将始终为这些正在运行的容器付费。默认情况下，你的\
  \ Cloud Run 服务会缩减为零，空闲时间不收取费用。\n\n## 总结\n\n在本章中，我们学习了 Cloud Run，这是一种允许你在 Google\
  \ Cloud 上无服务器运行云原生工作负载的服务。Cloud Run 将 Kubernetes 和 Knative 的所有实现细节抽象给开发者，并提供无缝的部署体验。开发者无需理解复杂的\
  \ Kubernetes 资源定义即可定义应用程序在负载下的行为。缩放和负载均衡在后台根据部署期间定义的参数完成。Cloud Run 与许多 GCP 服务集成，例如\
  \ Cloud IAM 和用于日志记录和监控的 Cloud operations 套件。\n\n我们还部署了 Cloud Run 服务并学习了如何部署新修订版本。最后，我们学习了如何控制各种修订版本之间的流量。\n\
  \n在下一章中，我们将讨论 Anthos，这是一个 GCP 混合多云平台，允许你管理公共云以及本地数据中心中的云原生工作负载。\n\n## 进一步阅读\n\n\
  有关本章涵盖主题的更多信息，请查看以下资源：\n\n- **Overview:** https://cloud.google.com/run/docs\n- **Developing\
  \ the Cloud Run service:** https://cloud.google.com/run/docs/developing\n- **Deploying\
  \ to Cloud Run:** https://cloud.google.com/run/docs/deploying\n- **Monitoring Cloud\
  \ Run:** https://cloud.google.com/run/docs/monitoring\n- **Cloud Run authentication:**\
  \ https://cloud.google.com/run/docs/authenticating/overview\n- **Limits and quotas:**\
  \ https://cloud.google.com/run/quotas\n- **Pricing:** https://cloud.google.com/run/pricing\n\
  \n\n\n\n"
- "# 8 使用 Anthos 管理云原生工作负载\n\n在前几章中，我们深入探讨了 Google Kubernetes Engine（GKE）和 Cloud Run，它们为云原生工作负载提供编排。在本章中，我们将介绍\
  \ Anthos；这是一个混合多云平台，允许您以一致且受控的方式在任何环境中运行云原生工作负载，无论是在公有云、本地还是边缘。\n\n重要的是要理解 Anthos\
  \ 采用非常敏捷的方式开发。每 3 个月发布一个新版本。因此，本章中我们不会引用 Anthos 的任何特定版本。相反，我们将向您解释主要概念并引用最新的文档，以便您保持更新并为考试做好准备。\n\
  \n### 考试提示\n由于 Anthos 是一个非常热门的话题，它很可能出现在 PCA 考试中。请注意，Anthos 是一个非常广泛的话题，值得单独写一本书，然而，本章将为您提供一个良好的介绍，帮助您通过考试。\n\
  对于 PCA 考试，请准备对本章所述的所有 Anthos 服务有一个高层次的理解。即使您不应该期望关于 Anthos 如何工作以及如何配置相关服务的深入问题，我们也鼓励您尝试\
  \ Anthos Qwiklabs 以更好地理解它。\n\n本章将涵盖以下主题：\n\n- 什么是 Anthos？\n- Anthos 集群部署选项\n- Anthos\
  \ 配置管理\n- Anthos 服务网格\n- Anthos 二进制授权\n- 用于 Anthos 和 GKE 的迁移\n- 用于 Anthos 的 Cloud\
  \ Run\n\n## Anthos 组件\n\nAnthos 不是单一服务，而是一组组合成平台的服务。它允许您在任何部署位置管理并观察您的云原生工作负载。如图\
  \ 8.1 所示，Anthos 由一组提供以下功能的服务组成：\n\n- 基础设施管理\n- 集群管理\n- 服务管理\n- 策略管理\n- 配置管理\n\n\
  ![](img/de2c97ab017f36b3750a5bade111edd7_237_0.png)\n\n图 8.1 – Anthos 组件\n\nAnthos\
  \ 允许您将 Kubernetes 资源分组为舰队/环境，以便将它们作为单个实体进行管理。我们将在本章后面更详细地了解舰队。\n\n## Anthos 集群\n\
  \nAnthos 集群允许您使用多个 Kubernetes 集群并为您的云原生工作负载提供一致且安全的环境。Anthos 可以在 Google Cloud Platform（GCP）中使用\
  \ GKE、在本地以及其他公有云中部署 Anthos 集群。您还可以附加已存在的 Kubernetes 集群，并在无需配置新的 Anthos 集群并迁移工作负载的情况下利用部分\
  \ Anthos 功能。\n\n## Anthos Connect 代理\n\nAnthos Connect 代理可以将任何 Kubernetes 集群连接到\
  \ GCP。通过将集群连接到 GKE Hub，您能够直接从 Cloud Console 访问集群并与托管的工作负载进行交互。代理作为名为 Connect Agent\
  \ 的 Kubernetes Deployment 运行，并与 GKE hub 建立加密连接：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_238_0.png)\n\
  \n图 8.2 – Anthos Connect 代理\n\n对于集群无法直接访问互联网的场景，代理可以配置为使用 NAT 或代理进行到 GKE hub 的出口。一旦您在\
  \ GKE hub 中注册了集群，您将获得与 Kubernetes 集群交互的类似 GKE 的体验。\n\n## 舰队（以前称为 environs）\n\n舰队（以前称为\
  \ environs）允许您逻辑地组织舰队感知资源，例如 Kubernetes 集群，以便更轻松地进行管理。例如，您可以在资源上应用统一的配置或策略，以实现舰队内部的一致性。\n\
  \n舰队具有以下限制：单个舰队只能关联到一个名为舰队主机项目的 GCP 项目，并且舰队项目只能有一个舰队。此限制导致在项目级别上对资源进行隔离。\n\n舰队可用于与\
  \ **舰队启用组件** 配合使用，例如以下内容：\n\n- **工作负载身份池** – 允许您统一授权池中的工作负载访问外部服务\n- **Anthos 配置管理**\
  \ – 允许您在舰队中的集群和资源上统一应用配置并强制执行策略\n- **Anthos 服务网格** – 允许您在舰队中的资源之间创建服务网格\n- **多集群入口（MCI）**\
  \ – 允许您为舰队中的集群和服务端点创建通用入口以提供负载均衡\n\n舰队的另一个重要元素是同一性概念。在不同上下文中但名称相同的对象可以被视为同一实体。这包括以下上下文：\n\
  \n- 命名空间同一性\n- 服务同一性\n- 访问外部资源时的身份同一性\n- 舰队内部的身份同一性\n\n例如，对于命名空间同一性，同一舰队中不同集群中名称相同的命名空间被视为单个实体。\n\
  \n## Anthos 集群部署选项\n\nAnthos 提供了多种部署选项，允许您几乎在任何地方托管云原生工作负载。如前所述，Anthos 是一个发展非常快的平台。因此，您应始终查阅文档以查找最新的支持端点和功能列表，网址为\
  \ https://cloud.google.com/anthos/deployment-options。以下图表显示了在撰写本书时可用的和计划中的部署选项：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_239_0.png)\n\n图 8.3 – Anthos 部署选项\n\n\
  另请注意，您可以附加使用托管 Kubernetes 服务在 **Azure Kubernetes Service（AKS）** 和 **Amazon Elastic\
  \ Kubernetes Service（EKS）** 中配置的 Kubernetes 集群。如果您查看前面的链接，您可能会注意到新的 Anthos 功能总是首先引入\
  \ GKE（即在 GCP 上）。这是因为 GKE 非常适合 Anthos 生态系统并利用 GCP 基础设施。您也可以预期，后来附加的在 Anthos 之外配置的集群可能由于技术限制而在功能方面存在一些限制。\n\
  \n现在让我们对每个部署选项进行高层次的了解。\n\n请注意，在 *第 6 章，使用 Google Kubernetes Engine 管理 Kubernetes\
  \ 集群* 中，我们对 GKE 服务进行了全面回顾。如果您想获取有关此部署选项的更多信息，我们鼓励您重温该章节。要为 GKE 启用 Anthos，请按照此处可以找到的分步指南进行操作：https://cloud.google.com/anthos/docs/setup/cloud。\n\
  \n## Anthos 集群在 VMware 上（GKE on-prem）\n\nAnthos 集群在 VMware 上（GKE on-prem）是第一个将 GKE\
  \ 引入本地数据中心的部署选项。它可以在基于 **VMware vSphere** 的现有虚拟化平台上运行。Anthos 通过 **vCenter** API\
  \ 作为基础设施管理层与 vSphere 通信，以配置托管 Kubernetes 节点的 **虚拟机（VM）**。这样我们就能为 GKE on-prem 部署配置控制平面和工作负载集群。\n\
  \n由于 vSphere 是市场上最成熟且被广泛采用的虚拟化平台之一，它具有非常复杂的特性集，包括软件定义网络、存储和高级 API。它也被认为是私有云的最新基础架构。由于\
  \ vSphere 通过为软件定义基础设施提供自动化来消除管理开销，因此它是 Google 选择 vSphere 作为 GKE on-prem 的第一个端点的自然选择。您必须意识到，这会带来一些成本，因为您需要在常规许可证之外购买\
  \ vSphere 许可证。\n\n## GKE on-prem 组件\n\n在 *第 6 章，使用 Google Kubernetes Engine 管理 Kubernetes\
  \ 集群* 中，我们了解到 GKE 集群的管理平面位于 GCP，我们作为消费者无需担心它。GCP 负责 GKE Kubernetes 集群的控制平面和数据平面的配置和管理。\n\
  \n\n\n\n\n当我们迁移到本地部署或另一家云服务提供商时，管理平面位于 GCP 之外。在大多数非 GCP 的 Anthos 集群中，管理平面托管在一个所谓的\
  \ **admin cluster** 上，如图 8.4 所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_241_0.png)\n\
  \n图 8.4 – GKE on-prem 组件（来源：https://cloud.google.com/anthos/clusters/docs/on-prem/overview?hl=pl）\n\
  \n> **重要说明**\n> Google 正在不断完善这一架构，并尝试减少或移除 admin cluster 的角色。因此，请注意未来可能会发生变化。\n\n\
  Admin cluster 是一个 Kubernetes 集群，作为 Anthos 集群的基础层进行配置，并运行以下组件：\n\n- **Admin cluster\
  \ control plane**：托管 admin cluster 的 Kubernetes API、调度器和控制器\n- **User cluster control\
  \ plane**：这些是用户集群控制平面的节点。它们托管用户集群的 Kubernetes API、调度器和控制器\n- **Add-ons**：运行 Kubernetes\
  \ 插件，例如 Google Cloud 的运维套件\n\n需要注意的是，**user clusters**（工作负载集群）的 master 节点运行在 admin\
  \ cluster 中，而不是在用户集群本身中。\n\n在图 8.4 中你还可以看到 **Admin workstation**，它是一个基于 Linux 的虚拟机。该机器包含下载、配置和管理\
  \ GKE on-prem 集群所需的所有工具。\n\n## 负载均衡\n\n负载均衡既需要用于 Anthos on-premises 的管理平面，也需要用于暴露\
  \ Kubernetes 服务。有三种负载均衡模式可供选择：\n\n- **Integrated** – 使用 F5 BIG-IP 负载均衡器，需要在 Anthos\
  \ 集群之外进行配置。通过 API 与 F5 深度集成，因此当服务部署在 Anthos 集群中时，操作员会负责在 F5 设备中创建对象，无需人工干预。请注意，F5\
  \ 许可证不包含在 Anthos 的费用中\n- **Bundled** – 负载均衡器在 Anthos 部署期间进行配置。它基于开源的 Google Seesaw\
  \ 负载均衡器项目。要了解有关该项目的更多信息，请访问 https://github.com/google/seesaw\n- **Manual** – 允许你集成其他第三方负载均衡器\n\
  \n合适的负载均衡模式的选择取决于多个因素，包括你的网络架构、对特定功能的需求以及成本限制。在决定使用哪种负载均衡模式之前，你可能需要咨询数据中心网络架构师。\n\
  \n## GKE on-prem 集群的部署\n\n正如你所想象的，本地集群的部署并不像在 Google Cloud 上部署 GKE 那样简单简单。截至目前，无法直接从\
  \ Google Cloud Console 部署 GKE on-prem 集群。对于 GKE on-prem，你将使用命令行工具 `gkeadm` 和 `gkectl`，它们可以直接从本地的\
  \ admin workstation 运行。\n\n部署 GKE on-prem 的高层步骤如下：\n\n- 1. 部署和/或准备 vSphere 基础设施。\n\
  - 2. 准备你的 Anthos GCP 项目和服务账号。\n- 3. 部署 admin workstation 并下载 Anthos 镜像。\n- 4. 为\
  \ admin cluster 部署集成、手动或捆绑的负载均衡器。\n- 5. 部署 admin cluster。\n- 6. 为 user cluster 部署集成、手动或捆绑的负载均衡器。\n\
  - 7. 部署 user cluster。\n- 8. 配置其他服务（例如 Anthos Service Mesh、Config Management 等）。\n\
  \n请注意，此流程可能会发生变化，因此要获取 GKE on-prem 集群的分步安装指南，请访问 https://cloud.google.com/anthos/clusters/docs/on-prem/overview?hl=pl。\n\
  \n## Anthos on AWS\n\nAnthos 集群 on AWS（GKE on AWS）允许你将云原生平台扩展到 AWS 云。它利用 AWS 原生服务，包括以下内容：\n\
  \n- EC2 虚拟机\n- **Elastic Block Storage (EBS)**\n- **Elastic Load Balancer (ELB)**\n\
  \n这使你能够利用 Anthos 的优势，同时原生使用 AWS 服务。\n\n### Anthos on AWS 组件\n\nAnthos on AWS 已遵循减少\
  \ admin cluster 占用或完全移除 admin cluster 的架构决策（参见 *GKE on-prem 组件* 部分）。因此，Anthos 集群\
  \ on AWS 有两个组件：\n\n- **Management service：** 这允许我们通过 AWS API 安装、更新和管理用户集群\n- **User\
  \ cluster：** 运行用户工作负载\n\n下图显示了 Anthos on AWS 的架构：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_244_0.png)\n\
  \n图 8.5 – Anthos on AWS（来源：https://cloud.google.com/anthos/clusters/docs/aws/concepts/architecture?hl=pl）\n\
  \n正如我们在图中看到的，管理服务和用户集群都位于 AWS 中，并连接到位于 GCP 中的 GKE hub。\n\n## 负载均衡\n\nAnthos on AWS\
  \ 使用 AWS 原生的 ELB，因此无需安装或配置额外的负载均衡器。这消除了管理第三方产品所需额外工具的需求，并为你提供了与 AWS 生态系统深度集成的最佳负载均衡选项。\n\
  \n## Anthos on AWS 的部署\n\nAnthos on AWS 的部署包括以下步骤：\n\n- 1. 准备 AWS 账号。\n- 2. 安装管理服务。\n\
  - 3. 创建用户集群以运行你的工作负载。\n\n你可以通过以下链接找到分步安装流程：https://cloud.google.com/anthos/clusters/docs/aws/how-to/installation-overview?hl=pl。\n\
  \n## Anthos on Azure\n\n在撰写本章时，Anthos on Azure 的预览版已被宣布。当前功能有限。你可以部署 Anthos 集群和工作负载，但某些管理选项尚未提供。例如，你可以使用\
  \ Connect 网关连接到集群，但无法使用 Terraform 管理集群。然而，Google 已宣布这很快会得到解决。\n\n### Anthos on Azure\
  \ 组件\n\nAnthos on Azure 的架构与我们在 AWS 上看到的非常相似。因此，Anthos 集群 on Azure 有两个组件：\n\n- **Management\
  \ service：** 这允许我们通过 Azure API 安装、更新和管理用户集群\n- **User cluster：** 运行用户工作负载\n\n下图显示了\
  \ Anthos on Azure 的架构：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_246_0.png)\n\n\
  图 8.6 – Anthos on Azure（来源：https://cloud.google.com/anthos/clusters/docs/azure/concepts/architecture）\n\
  \n让我们更详细地了解 Anthos on Azure 的各个组件。\n\n### Management service\n\nAnthos on Azure\
  \ 的管理服务包括以下内容：\n\n- **Anthos multi-cloud API**，接受 `gcloud` 命令以配置和管理 Anthos 集群\n\
  - **AzureClient**，使用 X.509 密钥对与 Azure 建立安全连接，私钥存储在 GCP，公钥存储在 Azure\n- **App Registration**，允许\
  \ Anthos 集群使用 AzureClient 在 Azure 中创建资源\n- **Connect API**，允许直接从 Google Cloud Console\
  \ 管理集群\n\n### User cluster\n\n用户集群有两个组件：控制平面和至少一个节点池。控制平面负责在高可用的 etcd 数据库中存储配置。控制平面可以管理多个节点池。节点池由充当工作节点的虚拟机构成。\n\
  \n## 负载均衡\n\nAnthos on Azure 对集群控制平面和工作负载均使用 Azure 原生的 Azure Load Balancer。当用户部署类型为\
  \ LoadBalancer 的 Kubernetes Service 时，负载均衡器会由 Anthos 自动化自动配置。\n\n## Anthos on Azure\
  \ 的部署\n\nAnthos on Azure 的部署包括以下步骤：\n\n- 1. 准备 Azure 账号。\n- 2. 安装管理服务。\n- 3. 创建用户集群。\n\
  - 4. 创建节点池。\n\n你可以通过以下链接找到分步安装流程：\n\n```\nhttps://cloud.google.com/anthos/clusters/docs/azure/how-to/installation-overview.\n\
  ```\n\n## Anthos 集群 on 裸金属\n\n使用 Anthos on bare metal，你可以利用现有基础设施，而无需将 vSphere 作为虚拟化层。由于\
  \ Anthos 直接在硬件上运行，因此可以获得最佳性能，包括低网络延迟。使用 Anthos 集群 on bare metal 的成本因无需支付 vSphere\
  \ 许可证而降低。另一个好处是，你可以通过将 Anthos 集群移至网络边缘来降低延迟。\n\n\n\n\n\nFigure 8.7 shows the three\
  \ layers of an Anthos cluster on bare metal: the hardware, operating system, and\
  \ Anthos itself. You can install the cluster on the nodes running CentOS, RHEL,\
  \ or Ubuntu:\n\n![](img/de2c97ab017f36b3750a5bade111edd7_248_0.png)\n\nFigure 8.7\
  \ – Anthos cluster on bare metal\n\nConsult the documentation for the exact supported\
  \ versions of your chosen OS.\n\nThe Anthos cluster nodes can be also installed\
  \ on VMs so you can take advantage of your existing hypervisors.\n\nIn this deployment\
  \ option you are responsible for providing the hardware and managing the operating\
  \ system of the cluster nodes. Google is responsible for providing you the Anthos\
  \ binaries. You manage the Anthos cluster yourself.\n\n## Anthos on bare metal cluster\
  \ types\n\nAnthos clusters on bare metal consist of two types of clusters:\n\n-\
  \ Admin clusters to control the resources of your clusters\n- User clusters to run\
  \ workloads\n\nYou can also choose to deploy the cluster in the following modes:\n\
  \n- **Hybrid cluster**: Clusters that combine administration tasks and workloads,\
  \ as well as controlling other user clusters. The first cluster acts as both the\
  \ admin and user clusters while other clusters act as user clusters\n- **Standalone\
  \ cluster**: A single standalone Anthos cluster on bare metal\n- **Multi-cluster**:\
  \ A single management cluster with one or more user clusters\n\nThis gives you a\
  \ lot of flexibility in terms of architecting your cluster. You can either choose\
  \ to have a standalone cluster or manage multiple clusters with an admin cluster.\n\
  \n## Load balancing modes\n\nAs in other deployment options, you need to make a\
  \ choice on a load balancer for both the control plane and workloads. With bare\
  \ metal you can choose from the following:\n\n- **Bundled load balancer**: Where\
  \ the load balancer is deployed on a dedicated pool of worker nodes on your control\
  \ plane cluster nodes\n- **Manual load balancer mode**: Where you deploy the load\
  \ balancer outside of the cluster. You can use either **MetalLB** or **F5 BIG-IP**\n\
  \nNote that for the bundled load balancer there is a requirement that all nodes\
  \ are in the same L2 subnet as it uses ARP broadcasts.\n\n## Summary of Anthos clusters\
  \ on bare metal\n\nAnthos clusters on bare metal cover all use cases where there\
  \ is a need for high performance and direct access to underlying hardware. One such\
  \ use case is in telco scenarios. Another interesting feature is the capability\
  \ of hosting VMs using an open source project called Kubevirt (https://kubevirt.io).\
  \ To learn more about Anthos clusters on bare metal have a look at the following\
  \ link: https://cloud.google.com/anthos/clusters/docs/bare-metal.\n\n## Anthos Config\
  \ Management\n\nAnthos Config Management comes with a suite of components that provide\
  \ you with constant configuration and policies across multiple Anthos clusters.\
  \ The components are interoperable but can also be used independently of each other.\
  \ Figure 8.8 shows three components included in the service:\n\n![](img/de2c97ab017f36b3750a5bade111edd7_250_0.png)\n\
  \nFigure 8.8 – Anthos Configuration Management\n\nLet's look at the components in\
  \ more detail:\n\n- **Config Sync** continuously reconciles the state of your clusters\
  \ with a central set of configurations stored in one or more Git repositories. This\
  \ feature lets you manage common configurations with an auditable, transactional,\
  \ and version-controlled deployment process that can span hybrid or multi-cloud\
  \ environments:\n\n![](img/de2c97ab017f36b3750a5bade111edd7_250_1.png)\n\nFigure\
  \ 8.9 – Anthos Configuration Manager\n\n- **Policy Controller** enables the enforcement\
  \ of fully programmable policies. You can use these policies to actively block non-compliant\
  \ API requests, or simply to audit the configuration of your clusters and report\
  \ violations. Policy Controller is based on the open source Open Policy Agent Gatekeeper\
  \ project and comes with a library of pre-built policies for common security and\
  \ compliance checks:\n\n![](img/de2c97ab017f36b3750a5bade111edd7_251_0.png)\n\n\
  Figure 8.10 – Anthos Policy Controller\n\nThe policies are enforced by using objects\
  \ called constraints. For example, you can use a constraint to require each namespace\
  \ to have at least one label, or restrict the repositories a given container image\
  \ can be pulled from. You can also create your own polices with the use of constraint\
  \ templates. You can find the Google-developed constraint library at https://cloud.google.com/anthos-config-management/docs/reference/constraint-template-library.\n\
  \nAs policies are defined as Kubernetes objects, they can be pushed directly to\
  \ the cluster with the use of a Git repository and the Config Sync service.\n\n\
  As we can see, Config Management is a very powerful service that can help you keep\
  \ control of your Anthos clusters.\n\n**Config Connector** allows you to provision\
  \ and manage GCP resources using Kubernetes manifests. This way, you gain a single\
  \ API to provide both GCP and Kubernetes resources:\n\n![](img/de2c97ab017f36b3750a5bade111edd7_252_0.png)\n\
  \nFigure 8.11 – Anthos Config Connector\n\nConfig Connector comes with **Custom\
  \ Resource Definitions (CRDs)** and associated controllers for almost all GCP services.\
  \ If you want to learn more about the resources supported, visit https://cloud.google.com/config-connector/docs/reference/overview.\n\
  \nThe Config Controller service, at the time of writing this book, is in a preview\
  \ state. It is a Google-hosted service that combines the Config Connector and Config\
  \ Sync services to allow GitOps operations for Google Cloud and Anthos resources.\
  \ To achieve this, an administrator defines the desired state of the resources using\
  \ Config Connector CRDs and stores them in a Git repository. Config Sync makes sure\
  \ the desired state is enforced.\n\n> **Important Note**\n> It is possible that\
  \ rebranding of this service might happen without any notice, so please refer to\
  \ the link: https://cloud.google.com/anthos-config-management/docs/concepts/config-controller-overview\
  \ to learn about current status of the service.\n\n## Service management with Anthos\
  \ Service Mesh\n\nAnthos Service Mesh is a fully managed service mesh for microservices\
  \ architectures. It is based on an open source project, started by Google, called\
  \ Istio. Google is gradually integrating Istio's functionalities with other Google\
  \ Cloud services such as the Cloud operations suite to provide an enterprise-grade\
  \ service mesh offering. Let's have a look at Istio first to understand how it works\
  \ so we can better understand Anthos Service Mesh.\n\n## Istio\n\nIstio is an open\
  \ source service mesh project. It runs in Kubernetes but may also integrate with\
  \ traditional workloads hosted on VMs. It provides a programable and application-aware\
  \ network. With the use of open source Envoy proxies, the traffic between microservices\
  \ is intercepted and can be controlled, secured, and observed. This allows us to\
  \ gain full control and visibility of the traffic between complex microservice-based\
  \ applications. As we see in Figure 8.12, Istio injects Envoy sidecar proxies to\
  \ the Kubernetes Pods:\n\n![](img/de2c97ab017f36b3750a5bade111edd7_253_0.png)\n\n\
  Figure 8.12 – Istio (Source: https://istio.io/latest/)\n\nThis way, all the ingress\
  \ and egress traffic needs to pass through the proxies. The Istio control plane\
  \ is a Kubernetes application that runs on your cluster. It gathers the metrics\
  \ and controls network traffic based on the characteristics defined in the Kubernetes\
  \ manifest.\n\nWith Istio you can perform the following tasks:\n\n- **Request routing**:\
  \ Route requests to multiple versions of a microservice\n- **Fault injection**:\
  \ Inject faults to test the resiliency of the application\n- **Traffic shifting**:\
  \ Gradually migrate traffic between different versions of a microservice to another\n\
  - **Query metrics**: Query for Istio metrics using **Prometheus**\n- **Visualize\
  \ metrics**: Use the Istio Dashboard to monitor mesh traffic using **Grafana**\n\
  - **Access external services**: Configure the Envoy proxy to pass through requests\
  \ for unknown services\n- **Visualize the service mesh**: Use the Kiali web-based\
  \ graphical user interface to view service graphs of the mesh and your Istio configuration\
  \ objects\n- **Encrypt the traffic**: Enforce encryption of the traffic between\
  \ microservices using mTLS\n\n> **Exam Tip**\n> Make sure you understand well all\
  \ the capabilities of Istio and Anthos Service Mesh: request routing; fault injection;\
  \ traffic shifting; querying metrics; visualizing metrics; accessing external services;\
  \ visualizing your mesh.\n\n## Configuring Istio\n\nYou can install Istio on you\
  \ any Kubernetes cluster by following the official guide at https://istio.io/latest/docs/setup/getting-started.\
  \ Once you have Istio installed you can define for which namespace you want the\
  \ sidecar proxies to be injected by labeling the namespace:\n\n```\nkubectl label\
  \ namespace default istio-injection=enabled\n```\n\nIn the guide mentioned above,\
  \ you download the Istio repository that contains a sample application called Bookinfo.\
  \ Deploy the application to the default namespace by running the following command:\n\
  \n```\nkubectl apply -f samples/bookinfo/platform/kube/bookinfo.yaml\n```\n\nYou\
  \ can list the Pods by running the following command:\n\n```\nkubectl get pods\n\
  ```\n\n\n\n\n\n当你运行前面的命令时，你会看到 sidecar 代理已被自动添加到 Pods 中。正如我们在此看到的，2/2 个容器（工作负载和代理）均报告为\
  \ READY：\n\n| NAME | READY | STATUS | RESTARTS | AGE |\n|---|---|---|---|---|\n\
  | details-v1-558b8b4b76-2ll1d | 2/2 | Running | 0 | 2m41s |\n| productpage-v1-6987489c74-lpkg1\
  \ | 2/2 | Running | 0 | 2m40s |\n| ratings-v1-7dc98c7588-vzftc | 2/2 | Running |\
  \ 0 | 2m41s |\n| reviews-v1-7f99cc4496-gdxfn | 2/2 | Running | 0 | 2m41s |\n| reviews-v2-7d79d5bd5d-8zqqd\
  \ | 2/2 | Running | 0 | 2m41s |\n| reviews-v3-7dbcdcbc56-m8dph | 2/2 | Running |\
  \ 0 | 2m41s |\n\n图 8.13 – Bookinfo 应用 Pod\n\n## 使用 Istio\n\n正如我们已经看到的，Istio 具有很多功能。作为一个示例，你可以执行流量拆分。假设我们希望将流量平均分配到\
  \ reviews:v1 和 reviews:v3 服务之间。\n\n你可以在 Kubernetes 清单中通过 VirtualService 对象定义此规则，并使用\
  \ kubectl apply 命令应用它：\n\n```\napiVersion: networking.istio.io/v1beta1\nkind: VirtualService\n\
  metadata:\n  name: reviews\nspec:\n  hosts:\n    - reviews\n  http:\n  - route:\n\
  \    - destination:\n        host: reviews\n        subset: v1\n        weight:\
  \ 50\n    - destination:\n        host: reviews\n        subset: v3\n        weight:\
  \ 50\n```\n\nIstio 将确保传入流量在两个服务之间平均分配。\n\n> 考试提示\n> 对于 PCA 考试来说，并不需要深入了解 Istio 的知识，但如果你想了解更多如何使用它的方法，可以在\
  \ https://istio.io/latest/docs/setup/getting-started/ 找到逐步指南。\n\n## 使用 Anthos Service\
  \ Mesh\n\n现在我们知道了 Istio 是什么，让我们来看看 Anthos Service Mesh，它是 Istio 的托管版本。需要注意的是，和往常一样，Anthos\
  \ Service Mesh 的功能会首先引入到 GCP 上的 GKE，然后再引入到 Anthos 集群的其他版本。由于列表很长，请查看最新列表 https://cloud.google.com/service-mesh/docs/supported-features。\n\
  \n由于 Anthos Service Mesh 只是 Istio 的 Anthos 验证和优化发行版，因此你可以像使用开源版本一样使用 Istio CRDs。\n\
  \nAnthos Service Mesh 带来的额外优势来自于与 GCP 生态系统的集成。这意味着你可以在 Google Cloud Console 中获得对网格的单一视图。你可以可视化所有服务及其之间的流量，并在\
  \ Cloud Monitoring 中创建警报。你可以从 Anthos 控制台的 Service Mesh 菜单中访问它：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_256_0.png)\n\
  \n你还可以使用 Anthos Service Mesh 左侧菜单中的 Traffic 选项查看每个服务的流量详情：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_257_0.png)\n\
  \n图 8.15 – 服务流量可视化\n\n这将显示有多少流量被路由到每个版本。\n\n## 服务等级目标\n\n另一个非常有用的功能是，你可以基于 **服务等级指标\
  \ (SLIs)** 创建所谓的 **服务等级目标 (SLOs)**。SLI 衡量服务的运行情况。指标可以基于可用性或延迟：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_258_0.png)\n\
  \n图 8.16 – 创建 SLO\n\n你也可以选择使用高级选项并定义自己的指标。\n\n## Anthos Service Mesh 总结\n\n正如我们在此学到的，Anthos\
  \ Service Mesh 是一个非常强大的工具，可以让你控制 Anthos 集群内的流量。它还通过能够查看与之相关的指标，为你的应用程序健康状况提供出色的洞察。\n\
  \n如果你想亲身体验 Anthos Service Mesh，请查看 https://www.qwiklabs.com/ 上的 GSP656 - Traffic\
  \ Management with Anthos Service Mesh 实验。\n\n## Anthos 多集群入口 (MCI)\n\nAnthos MCI\
  \ 是你在 Anthos 订阅下可用的服务。它基于 Google 的外部 HTTP(S) 负载均衡服务架构构建，代理部署在全球超过 100 个 Google **存在点\
  \ (PoPs)**。正如我们在图 8.17 中看到的，MCI 为应用程序提供单一 IP，与应用程序部署位置无关。\n\n> **考试提示**\n> 当需要为多集群和多区域应用程序进行负载均衡时，应使用\
  \ MCI。它是外部 HTTP(S) 负载均衡器的控制器，为来自互联网的流量提供进入一个或多个 Anthos 集群的入口。\n\n![](img/de2c97ab017f36b3750a5bade111edd7_259_0.png)\n\
  \n图 8.17 – Anthos MCI（来源：https://cloud.google.com/kubernetes-engine/docs/concepts/multi-cluster-ingress）\n\
  \nAnthos MCI 带有两个非常强大的功能，支持多集群设置。\n\nMCI 的基于接近度的路由会将用户定向到距离他们最近的集群。MCI 的健康检查使我们能够无缝执行集群升级和流量故障转移。\n\
  \n你可以在 https://cloud.google.com/kubernetes-engine/docs/concepts/multi-cluster-ingress\
  \ 了解更多关于使用 MCI 的信息。\n\n## Anthos 二进制授权\n\n二进制授权是 Google Cloud 的一项服务，旨在为你的容器化软件供应链提供安全性。它降低了部署有缺陷、存在漏洞或未经授权的软件的风险。\n\
  \n它允许你在尝试在一个受支持的平台上部署容器时创建策略。它是通过所谓的证明来实现的，这些证明为部署的镜像进行认证。\n\n截至本书撰写时，二进制授权支持以下平台：\n\
  \n- GKE\n- Cloud Run\n- Anthos 在 VMware 上的集群\n\n二进制授权补充了 Google 软件供应链服务套件，其中包括 Cloud\
  \ Source Repositories、Cloud Build、Artifact Registry 和 Container Analysis：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_260_0.png)\n\
  \n图 8.18 – 创建二进制授权证明的 Cloud Build 流水线\n（来源：https://cloud.google.com/binary-authorization/docs/cloud-build?hl=zh-tw）\n\
  \n正如我们在前面的图表中看到的，流水线的工作方式如下：\n\n- 1. 开发者将构建容器镜像的代码推送到 **Cloud Source Repositories**。\n\
  - 2. **Cloud Build** 构建容器镜像。\n- 3. **Cloud Build** 将容器镜像推送到 **Artifact Registry**。\n\
  - 4. **Cloud Key Management Service** 创建用于签署容器镜像的加密密钥对。签名随后存储在证明中。\n- 5. 在部署期间，**Binary\
  \ Authorization** 中的证明者使用密钥对的公钥验证证明。\n\n使用二进制授权应被视为生产工作负载部署的最佳实践。\n\n## Migrate\
  \ for Anthos 和 GKE\n\nMigrate for Anthos 和 GKE 使我们能够通过提取和迁移传统 VM 主持的应用程序到可以在 GKE\
  \ 或 Anthos 集群上运行的容器中，来现代化传统 VM 主持的应用程序。这带来了以下好处：\n\n- 通过使用容器优化集群资源使用，实现 **更好的密度**\n\
  - 具有 **安全优化的节点内核**，无需更新操作系统\n- **将传统应用与现代服务集成**，包括 Anthos Service Mesh、Cloud Logging、Cloud\
  \ Monitoring 和其他 GCP 原生服务，以将基础设施相关功能卸载到 GCP\n- 使用声明式定义进行 **统一的策略和配置管理**\n- 通过与 CI/CD\
  \ 工具的集成实现 **现代化的基于镜像的管理和编排**\n\n截至本书撰写时，以下目标平台受支持：\n\n- GKE\n- GCP 上的 Anthos 集群\n\
  - VMware 上的 Anthos 集群\n- AWS 上的 Anthos 集群\n\n该服务可用于 Windows 和 Linux VM 作为迁移的源。\n\
  \n对于 Linux VM，迁移过程包括以下步骤：\n\n- 1. 将 VM 的操作系统内核交换为 GKE 节点使用的内核\n- 2. 设置网络接口、DNS、日志记录和健康状态\n\
  - 3. 运行 VM 用户空间中找到的应用程序和服务\n- 4. 移除 VM 或硬件相关服务\n\n对于 Windows VM，会生成包含容器镜像定义的 Dockerfile\
  \ 和包含应用程序内容的 ZIP 文件。会使用官方的 Microsoft Windows Server 镜像。\n\n迁移过程分为多个阶段：\n\n- 1. 发现阶段\n\
  - 2. 迁移规划阶段\n- 3. 着陆区阶段\n- 4. 迁移和部署阶段\n- 5. 运行和优化阶段\n\n如果你想了解更多关于 Migrate for Anthos\
  \ 和 GKE 的架构以及迁移的详细流程，请访问 https://cloud.google.com/migrate/anthos/docs/concepts。\n\
  \n## Anthos 的 Cloud Run\n\n在第 7 章《使用 Cloud Run 部署云原生工作负载》中，我们了解了 Google Cloud Run，它允许我们在\
  \ GCP 上运行类似无服务器的云原生工作负载。有了 Anthos 的 Cloud Run，此功能可用于在 GCP、公有云或本地的 Anthos 集群上执行。由于\
  \ Anthos 的 Cloud Run 由开源 Knative (https://knative.dev) 项目提供支持，因此工作负载可移植到任何 Kubernetes\
  \ 集群。\n\n对于已启用的 Anthos 项目，当你创建 Cloud Run 服务时，应为部署平台选择 Anthos 的 Cloud Run 而非 Cloud\
  \ Run（完全托管）：\n\n\n\n## 服务设置\n\n服务会公开唯一的端点，并自动扩展底层基础设施以处理传入请求。部署平台和服务名称无法更改。\n\n\
  ### 部署平台\n\nCloud Run（完全托管）\nCloud Run for Anthos\n\n你没有任何启用了 Cloud Run for Anthos\
  \ 的集群。创建 Anthos GKE 集群以开始。了解更多\nCREATE CLUSTER\n\n可用 Anthos GKE 集群 *\ncloudrun-default-cluster\
  \ (will be created) us-central1-a\n此服务的集群之后无法更改。了解更多\n\n命名空间\ndefault\n\n### 服务名称\
  \ *\n\ncloudrun-test\n\n### 连接性 *\n\n内部\n服务只能通过集群网络调用，且无法从互联网访问。\n外部\n服务可以通过互联网调用，除通过集群网络外。\n\
  \n### 图 8.19 – Cloud Run for Anthos\n\n如果你没有任何启用了 Cloud Run 的 Anthos 集群，集群将为你创建。如果你想创建启用了\
  \ Cloud Run 的集群，请将以下标志添加到 gcloud 命令中：\n\n```\ngcloud container clusters create CLUSTER_NAME\
  \ \\\n  --addons=HttpLoadBalancing,CloudRun \\\n  --machine-type=n1-standard-2 \\\
  \n  --enable-stackdriver-kubernetes\n```\n\n请注意，你需要为此命令正确运行指定默认区域和区域。一旦成功执行，你就可以在集群上部署\
  \ Cloud Run 服务。\n\n## Cloud Run（完全托管）与 Cloud Run for Anthos\n\n在下表中，我们对 Cloud Run（完全托管）和\
  \ Cloud Run for Anthos 之间的差异进行了简单总结：\n\n| 功能 | Cloud Run | Cloud Run for Anthos\
  \ |\n|---|---|---|\n| 价格 | 按使用付费 | Anthos 集群成本 |\n| 计算 | CPU 和内存限制 | Anthos 集群节点的性能（包括\
  \ GPU） |\n| 隔离 | 使用 gVisor 沙箱 | Anthos 集群隔离 |\n| 扩展 | 1,000 个容器，可扩展配额 | 基于 Anthos\
  \ 集群 |\n| 域名 | 可用 |  |\n| VPC 访问 | 无服务器 VPC 访问 | 直接访问 VPC |\n| 服务网格 | 未连接到 Istio\
  \ 服务网格 | 服务连接到 Istio 服务网格 |\n| 执行环境 | Google 原生基础设施 | Anthos 集群 |\n\n正如我们所见，差异不仅在于定价模型和执行环境，还在于提供的功能。选择在哪个选项上运行工作负载需要基于你的需求。每个服务都有其优缺点。\n\
  \n## 配额和限制\n\nAnthos 带有一些配额和限制。这些是为了确保你获得最佳性能，并防止你配置过多的资源。由于配额和限制可能会发生变化，最好参考文档以查找最新配额，网址为\
  \ https://cloud.google.com/anthos/clusters/docs/on-prem/concepts/scalability。\n\n\
  例如，你可以在撰写本书时查看适用于 VMware 上的 Anthos 集群（GKE on-prem）的配额：\n\n- 你最多可以在每个管理集群上部署 20 个用户集群。\n\
  - 对于每个用户集群：\n  - 你必须创建最少 3 个节点。\n  - 你最多可以创建 250 个节点。\n  - 你最多可以创建 7,500 个 Pod：\n\
  - 对于每个节点，你最多可以创建 110 个 Pod。\n- 对于每个 Google Cloud 项目，你最多可以在 GKE Hub 中注册 15 个用户集群，但你可以提交请求以增加配额。\n\
  \n现在让我们回顾 Anthos 定价。\n\n## 定价\n\nAnthos 集群按用户集群中工作节点每 vCPU 计费。这不包括管理集群和主节点。你可以选择两种计费模式：\n\
  \n- **按需付费** 定价，你在使用 Anthos 管理的集群时按当前适用费率计费。你可以在没有任何长期承诺的情况下开始使用按需付费 Anthos\n- **订阅**\
  \ 定价，你为 Anthos 部署支付月度费用。你可以从长期订阅承诺中受益，获得折扣价格\n\n由于实际价格可能会发生变化，请参考定价列表的文档，网址为 https://cloud.google.com/anthos/pricing。\n\
  \n## 总结\n\n在本章中，我们了解了 Anthos 及其最重要的功能。我们介绍了 Anthos 部署选项，包括 **GKE（Google Cloud）**、**本地（VMware）**、**本地（裸机）**、**AWS**、**附加集群**\
  \ 和 **Azure**。我们查看了如何使用定义配置同步控制 Anthos 集群的配置并使用 **Anthos Config Management** 强制执行策略。我们学习了如何使用\
  \ **Anthos Service Mesh** 控制和观察微服务架构中的流量。我们还了解了如何使用 **Anthos MCI** 分发入站流量。最后，我们学习了如何使用\
  \ **Cloud Run on Anthos** 在 Anthos 集群上运行类似无服务器的云原生工作负载。我们将其与在 **Cloud Run（完全托管）**\
  \ 上运行工作负载进行了比较。在下一章中，我们将了解如何使用 Google Cloud Functions 运行无服务器函数。\n\n## 进一步阅读\n\n\
  你可以参考以下链接获取更多信息：\n\n- **Anthos 主页**：https://cloud.google.com/anthos/docs/concepts/overview\n\
  - **Anthos on VMware**：https://cloud.google.com/anthos/clusters/docs/on-prem/\n\
  - **Anthos 集群 on 裸机**：https://cloud.google.com/anthos/clusters/docs/bare-metal/1.6/concepts/about-bare-metal\n\
  - **Anthos on AWS**：https://cloud.google.com/anthos/clusters/docs/aws/concepts/architecture\n\
  - **Anthos on Azure**：https://cloud.google.com/anthos/clusters/docs/azure/\n- **Anthos\
  \ 配置管理**：https://cloud.google.com/anthos/config-management\n- **Anthos 服务网格**：https://cloud.google.com/anthos/service-mesh\n\
  - **Istio**：https://istio.io/latest/docs\n- **Anthos for Anthos and GKE**：https://cloud.google.com/migrate/anthos/docs/concepts\n\
  - **Cloud Run on Anthos**：https://cloud.google.com/anthos/run/\n- **多集群入口**：https://cloud.google.com/kubernetes-engine/docs/concepts/multi-cluster-ingress\n\
  - **Config Connector**：https://cloud.google.com/config-connector\n"
- "# 9\n使用 Google Cloud Functions 运行无服务器函数\n\n在本章中，我们将最终讨论完全无服务器的计算选项，即 Cloud Functions。这意味着不再有服务器，也不再有容器。此服务在后端利用它们，但对最终用户不可见。我们现在唯一需要关心的是代码。Cloud\
  \ Functions 是一种 Function-as-a-Service（FaaS）服务。这意味着你用 GCP 支持的一种语言编写一个函数，它可以由事件或通过\
  \ HTTP 触发。GCP 会负责配置和扩展运行函数所需的资源。\n\n> **重要说明**\n> Cloud Functions 在后端如何工作？再次说明，你无需担心运行函数的\
  \ GCP 后端基础设施。然而，作为一名工程师，我敢打赌你仍会自行寻找答案。Cloud Functions 使用容器为你的函数设置隔离环境。这些被称为 Cloud\
  \ Functions 实例。如果并行执行多个函数，将创建多个实例。\n\n## 考试提示\n\n预计 Cloud Architect 考试中会出现 Cloud\
  \ Functions 问题。你需要了解 Cloud Functions 是什么以及最常见的用例是什么。能够区分两种类型的函数，即 HTTP 和后端函数也很重要。知道何时使用\
  \ Cloud Functions 而不是其他计算选项，以及记住支持的编程语言至关重要。最后，确保你能够从 Google Cloud 控制台和命令行部署函数。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 主要 Cloud Functions 特征\n- 用例\n- 运行时环境\n- Cloud Functions 类型\n\
  - 事件和触发器\n- 其他考虑因素\n- 部署 Cloud Functions\n- IAM\n- 配额和限制\n- 定价\n\n## 主要 Cloud Functions\
  \ 特征\n\n以下是 Cloud Functions 的关键特征：\n\n- **无服务器**：Cloud Functions 完全无服务器。底层基础设施对最终用户是抽象的。\n\
  - **事件驱动**：Cloud Functions 是事件驱动的。它们会响应事件或 HTTP 请求而触发。这意味着它们仅在需要时被调用，且在非活动时不产生任何成本。\n\
  \n\n\n\n\n- **无状态**：Cloud Functions 不存储状态也不存储数据。这使它们能够独立工作并根据需要进行扩展。必须了解的是，每次调用都有一个执行环境，并且不共享全局变量内存或文件系统。要在函数调用之间共享状态，您的函数应使用\
  \ Cloud Datastore 或 Cloud Storage 等服务。\n- **自动扩缩容**：Cloud Functions 可从零扩缩容到所需规模。扩缩容由\
  \ GCP 管理，无需任何终端用户干预。可以设置自动扩缩容限制以控制执行成本。这很重要，因为设计中的故障可能会导致大幅飙升，从而使账单飙升。\n\n现在我们了解了主要特性，让我们来看一些用例。\n\
  \n## 用例\n\n现在我们对 Cloud Functions 有了基本了解，让我们来看一下众多用例。请记住，在这些用例中，您仍然可以使用其他计算选项。然而，这关乎快速交付解决方案，利用内置的自动扩缩容，并且只为我们使用过的付费。\n\
  \n## 应用后端\n\n与其使用虚拟机进行后端计算，您可以简单地使用函数。让我们来看一些示例后端：\n\n- **物联网后端**：在物联网世界中，有大量设备向后端发送数据。Cloud\
  \ Functions 允许您处理这些数据，并在需要时自动扩缩容。这无需任何人工干预。\n- **移动后端**：Cloud Functions 可以处理由您的移动应用程序提供的数据。它可以与所有\
  \ GCP 服务交互以利用大数据、机器学习功能等。无需使用任何虚拟机，您可以完全实现无服务器。\n- **第三方 API 集成**：您可以使用函数与提供 API\
  \ 的任何第三方系统集成。这将允许您通过其他提供商提供的功能扩展应用程序。\n\n接下来，让我们来看一些数据处理示例。\n\n## 实时数据处理系统\n\n在\
  \ **事件驱动的数据处理**方面，Cloud Functions 可以在预定义事件发生时被触发。发生这种情况时，它可以预处理传递用于 GCP 大数据服务分析的数据：\n\
  \n- **实时流处理：** 当消息到达 Pub/Sub 时，Cloud Functions 可以被触发以分析或丰富消息，以便为管道中的进一步数据处理步骤做好准备。\n\
  - **实时文件处理：** 当文件上传到您的 Cloud Storage 存储桶时，它们可以立即被处理。例如，可以创建缩略图或使用 GCP AI API 进行分析。\n\
  \n接下来，让我们来看智能应用的示例。\n\n## 智能应用\n\n智能应用允许用户通过数据驱动的体验更智能地执行各种任务。其中一些如下：\n\n- **聊天机器人和虚拟助手：**\
  \ 您可以将文本或语音平台连接到 Cloud Functions，以将其与其他 GCP 服务集成，例如 **DialogFlow**（*参见第 14 章，将机器学习付诸实践*），为用户提供自然的对话体验。对话逻辑可以在\
  \ DialogFlow 中定义，无需任何编程技能。可以创建与第三方应用程序的集成，以提供天气信息或商品购买等服务。\n- **视频和图像分析：** 您可以使用\
  \ Cloud Functions 与各种 GCP AI 构建块交互，例如视频和图像 AI。当用户将图像或视频上传到您的应用程序时，Cloud Functions\
  \ 可以立即触发相关 API 并返回分析结果。它甚至可以根据分析结果执行操作。\n- **轻量级 API 和 Webhook：** 由于 Cloud Functions\
  \ 可以通过 HTTP 触发，因此您可以将应用程序暴露给外部世界以供程序化使用。您无需从头构建 API。\n\n现在，让我们介绍一些运行时环境示例。\n\n##\
  \ 运行时环境\n\nCloud Functions 在完全托管的环境中执行。运行函数所需的基础设施和软件都由您处理。每个函数都是单线程的，并在隔离的环境中以预期上下文运行。您无需关心该环境的任何更新。它们会为您自动更新并根据需要扩缩容。\n\
  \n目前，Cloud Functions 支持以下运行时：\n\n- Node.js 10、12 和 14\n- Python 3.7、3.8 和 3.9\n\
  - Go 1.11 和 1.13\n- Java 11\n- .NET Core 3.1\n- Ruby 2.6 和 2.7\n- PHP 7.4\n\n当您定义函数时，您还可以定义\
  \ requirements 或依赖文件，其中说明您的函数依赖于哪些模块或库。但是，请记住，这些库将在函数执行时加载。这会导致执行延迟。我们将在本章的冷启动部分更详细地讨论这个问题。\n\
  \n在下一节中，我们将介绍 Cloud Functions 的类型。\n\n## Cloud Functions 的类型\n\nCloud Functions\
  \ 有两种类型：HTTP 函数和后台函数。它们在触发方式上有所不同。让我们分别来看一下。\n\n## HTTP 函数\n\nHTTP 函数由 HTTP(S) 请求调用。接受\
  \ POST、PUT、GET、DELETE 和 OPTIONS HTTP 方法。可以使用请求体向函数提供参数：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_272_0.png)\n\
  \n图 9.1 – HTTP 请求\n\n调用可以定义为同步，因为它可以返回在函数内构建的响应。\n\n> **有趣的事实**\n> 不要指望考试会问这个问题。然而，可能有趣的是，Cloud\
  \ Functions 使用通用框架处理 HTTP 请求。对于 Node.js，这是 Express 4.16.3，对于 Python，这是 Flask 1.0.2，对于\
  \ Go，这是标准的 http.HandlerFunc 接口。\n\n## 后台函数\n\n后台函数由事件触发，例如 Cloud Storage 存储桶中的更改、Cloud\
  \ Pub/Sub 主题中的消息或受支持的 Firebase 事件之一：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_272_1.png)\n\
  \n图 9.2 – 后台函数\n\n在上图中，我们可以看到 **Cloud Functions** 的各种触发器；即 **Cloud Pub/Sub**、**Cloud\
  \ Storage** 和 **Firebase。**\n\n接下来，让我们来看事件。\n\n## 事件\n\n**事件**可以定义为在 GCP 环境内或外部发生的事件。当它们发生时，您可能希望触发某些操作。事件的一个例子可能是文件已添加到\
  \ Cloud Storage、数据库表中进行了更改，或向 GCP 供应了新资源，等等。这些事件可以来自以下提供商之一：\n\n- HTTP\n- Cloud\
  \ Storage\n- Cloud Pub/Sub\n- 通过 Pub/Sub sink 的 Cloud Logging\n- Cloud Firestore\n\
  - Firebase Realtime Database、Storage 和 Authentication\n\n如果您创建 sink 将日志转发到 Pub/Sub，则可以触发\
  \ Cloud Functions（有关更多详细信息，请参阅*第 17 章，监控您的基础设施*）。\n\n接下来，让我们来看触发器。\n\n## 触发器\n\n\
  要使您的函数对事件做出反应，需要配置触发器。触发器的实际绑定发生在部署时。我们将在 *部署 Cloud Functions* 部分查看如何使用不同类型的触发器部署函数。\n\
  \n## 其他注意事项\n\n使用 Cloud Functions 时，您应该注意一些功能和注意事项。让我们现在来看一下这些。\n\n## Cloud SQL\
  \ 连接\n\n如前所述，Cloud Functions 是无状态的，状态需要在外部存储或数据库中保存。这可以使用 Cloud Storage 等外部存储或 Cloud\
  \ SQL 等数据库来完成。一般来说，可以使用任何外部存储。\n我们在第 3 章《Google Cloud Platform 核心服务》中介绍了 Cloud SQL。为了提醒您，它是托管的\
  \ MySQL、Postgres 或 MS SQL 数据库。使用 Cloud Functions，您可以通过 Cloud Functions 执行环境中提供的本地套接字接口连接到\
  \ Cloud SQL。它消除了将数据库暴露给公共网络的需求。\n\n## 连接到 VPC 网络中的内部资源\n\n如果您的函数需要访问 VPC 内的服务，您可以通过传递公共网络直接连接到它。为此，您需要从网络菜单创建无服务器\
  \ VPC 访问连接器，并在部署函数时引用该连接器。请注意，这不适用于共享 VPC 和传统网络。\n\n## 环境变量\n\nCloud Functions 允许您设置在函数运行时可用的环境变量。这些变量存储在函数的后端，并遵循与函数本身相同的生命周期。这些变量使用\
  \ --set-env-vars 标志设置；例如：\n\n```\ngcloud functions deploy env_vars --runtime python37\
  \ --set-env-vars FOO=bar --trigger-http\n```\n\n> 重要提示\n> 第一次使用 Cloud Functions\
  \ 时，您将被要求启用 API。\n\n接下来，让我们来看冷启动。\n\n## 冷启动\n\n如前所述，Cloud Functions 使用函数实例执行。在以下情况下会创建这些新实例：\n\
  \n- 函数部署时\n- 需要扩容以处理负载时\n- 触发替换现有实例时\n\n\n\n\n\n冷启动会影响应用程序的性能。Google 提供了一系列提示和技巧来帮助我们减少冷启动的影响。查看\
  \ *Further reading* 部分以获取详细指南的链接。\n\n## 本地模拟器\n\n部署函数到 GCP 需要时间。如果您想加快测试速度，可以使用本地模拟器。这仅适用于\
  \ Node.js，并且允许您部署、运行和调试函数。\n\n在下一节中，我们将学习如何部署 Cloud Function。\n\n## 部署 Cloud Functions\n\
  \nCloud Functions 可以使用 CLI、Google Cloud Console 或 API 进行部署。在本节中，我们将查看前两种方法，因为在考试中您很可能会被要求测试它们。\n\
  \n### 使用 Google Cloud Console 部署 Cloud Functions\n\n要从 Google Cloud Console 部署 Cloud\
  \ Functions，请按照以下步骤操作：\n\n- 1. 从汉堡菜单中选择 **Cloud Functions**。您将看到 **Cloud Functions**\
  \ 窗口。点击 **CREATE FUNCTION**：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_275_0.png)\n\
  \n图 9.3 – Cloud Functions 菜单\n\n2. 填写函数的名称和托管区域：\n\n### Basics\n\nFunction name\
  \ *\ntestFunction\n\nRegion\nus-central1\n\n### Trigger\n\n### HTTP\n\nTrigger type\n\
  HTTP\n\nURL\nhttps://us-central1-fir-73fad.cloudfunctions.net/testFunction\n\n###\
  \ Authentication\n\nAllow unauthenticated invocations\n如果您正在创建公共 API 或网站，请勾选此项。\n\
  \nRequire authentication\n使用 Cloud IAM 管理授权用户。\n\nRequire HTTPS\n\nSAVE   CANCEL\n\
  \nRUNTIME, BUILD AND CONNECTIONS SETTINGS\n\n图 9.4 – 创建函数\n\n3. 从下拉菜单中选择触发器类型：\n\
  \n### Trigger\n\nHTTP\n\nTrigger type\n\n- HTTP\n- Cloud Pub/Sub\n- Cloud Storage\n\
  - Cloud Firestore\n- Google Analytics for Firebase PREVIEW\n- Firebase Authentication\
  \ PREVIEW\n- Firebase Realtime Database PREVIEW\n- Firebase Remote Config PREVIEW\n\
  \nSAVE\n\nCANCEL\n\n图 9.5 – 触发器\n\n4. 点击 **SAVE** 按钮。如果您选择使用 **HTTP** 触发器，调用函数的\
  \ URL 将为您在 **URL** 部分生成，如下所示：\n\n### Trigger\n\n![](img/de2c97ab017f36b3750a5bade111edd7_278_0.png)\n\
  \n图 9.6 – Cloud Function URL\n\n5. 如果您想设置更高级的设置，请点击 **RUNTIME, BUILD AND CONNECTION\
  \ SETTINGS**。在 **RUNTIME** 选项卡中，您可以设置 **Memory allocated** 和 **Timeout**。您还可以定义将运行函数的服务账号。最后，您可以定义最小和最大实例数：\n\
  \n### RUNTIME, BUILD AND CONNECTIONS SETTINGS\n\nRUNTIME\n\nBUILD\n\nCONNECTIONS\n\
  \nMemory allocated *\n256 MiB\n\nTimeout *\n60\nseconds\n\n### Runtime service account\n\
  \nRuntime service account\nApp Engine default service account\n\n### Autoscaling\n\
  \nMaximum number of instances\n\n### Runtime environment variables\n\n+ ADD VARIABLE\n\
  \n图 9.7 – 运行时选项\n\n6. 在 BUILD 选项卡中，您可以定义用于构建函数的变量和工作池：\n\nRUNTIME\n\nBUILD\n\nCONNECTIONS\n\
  \nSECURITY\n\n### Build Worker Pools\n\nSelected Environment\n\n### Build environment\
  \ variables\n\n+ ADD VARIABLE\n\n图 9.8 – 构建选项\n\n7. 在 **CONNECTIONS** 选项卡中，您可以定义各种入站设置。这可以限制触发函数的流量来源。您可能希望创建一个连接器，以便函数可以连接到您的\
  \ VPC：\n\n### Runtime, build, connections and security settings\n\nRUNTIME   BUILD\
  \   CONNECTIONS   SECURITY\n\nIngress settings ?\n\n- Allow all traffic\n- Allow\
  \ internal traffic only\n  仅允许来自同一项目中 VPC 网络或同一 VPC SC 周边内的流量。\n- Allow internal\
  \ traffic and traffic from Cloud Load Balancing\n  允许来自同一项目中 VPC 网络、同一 VPC SC 周边或来自\
  \ Cloud Load Balancing 的流量。\n\nEgress settings ?\n\n默认情况下，您的函数可以向互联网发送请求，但不能向 VPC\
  \ 网络中的资源发送请求。要向 VPC 网络中的资源发送请求，请创建或选择已在与函数相同区域中创建的 VPC 连接器。\n\nVPC Connector\nNone\n\
  Create a Serverless VPC Connector\n\n- Route only requests to private IPs through\
  \ the VPC connector\n- Route all traffic through the VPC connector\n\n图 9.9 – CONNECTIONS\n\
  \n8. 在 SECURITY 选项卡中，您可以设置可由函数使用的密钥：\n\n### Runtime, build, connections and security\
  \ settings\n\nRUNTIME   BUILD   CONNECTIONS   SECURITY\n\n### Secrets\n\n### Reference\
  \ a Secret\n\nSecret *\n\nReference method\nMounted as volume\n\n/ Mount path\n\n\
  Specified paths for secret versions\n\n+ ADD\n\nCANCEL   DONE\n\nREFERENCE A SECRET\n\
  \n图 9.10 – SECURITY\n\n9. 点击 Next 按钮。选择您将如何提供代码。您可以使用 Inline Editor，从本地机器上传（ZIP\
  \ Upload）或从 Cloud Storage ZIP，或甚至使用 Cloud Source 仓库：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_282_0.png)\n\
  \n图 9.11 – 源代码\n\n10. 从 Runtime 下拉菜单中，选择您将用于编写函数的编程语言。对于此示例，我们决定使用内联编辑器用于 Python\
  \ 3.7。因此，我们需要提供两个文件：main.py，其中我们将定义函数，以及 requirements.txt，其中包含依赖项：\n\n图 9.12 – main.py\
  \ 文件\n\n11. 在 Entry point 字段中，我们必须定义入口点的名称；例如，hello_world：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_283_0.png)\n\
  \n图 9.13 – 入口点\n\n12. 现在，我们只需点击 DEPLOY 按钮即可部署函数：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_283_1.png)\n\
  \n图 9.14 – DEPLOY\n\n13. 一旦您的函数已部署，您将在 Cloud Functions 列表中看到它：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_283_2.png)\n\
  \n图 9.15 – 函数已部署\n\n现在，您的函数已准备好执行。\n\n```\ndef hello_world(request):\n    \"\"\"\
  Responds to any HTTP request.\n    Args:\n        request (flask.Request): HTTP\
  \ request object.\n    Returns:\n        The response text or any set of values\
  \ that can be turned into a\n        Response object using\n        `make_response\
  \ <http://flask.pocoo.org/docs/1.0/api/#flask.Flask.make_response>`.\n    \"\"\"\
  \n    request_json = request.get_json()\n    if request.args and 'message' in request.args:\n\
  \        return request.args.get('message')\n    elif request_json and 'message'\
  \ in request_json:\n        return request_json['message']\n    else:\n        return\
  \ f'Hello World!'\n```\n\n## 使用 gcloud 命令部署函数\n\n现在我们已经了解了如何使用 Google Cloud Console\
  \ 部署函数，更容易解释 gcloud 命令的参数和标志。\n\n要部署 Cloud Functions，我们可以使用以下命令：\n\n```\ngcloud\
  \ deploy cloud functions $FUNCTION_NAME \\\n--region=$REGION \\\n--entry-point=$ENTRY_POINT\
  \ \\\n--memory=$MEMORY \\\n--runtime=$RUNTIME \\\n--service-account=$SERVICE_ACCOUNT\\\
  \n--source=$SOURCE \\\n--stage-bucket=$STAGE_BUCKET \\\n--timeout=$TIMEOUT \\\n\
  --retry\n```\n\n这里，我们有以下选项：\n\n- $REGION：函数的区域。\n- $ENTRY_POINT：函数的名称（在源代码中定义）。\n\
  - $MEMORY：可使用的内存量的限制。允许的值为 128 MB、256 MB、512 MB、1,024 MB 和 2,048 MB。\n- $SERVICE_ACCOUNT：与函数关联的\
  \ IAM 服务账号。\n- $SOURCE：源代码的位置。可以是 Cloud Storage、源代码仓库或本地文件系统。\n- $STAGE_BUCKET：如果函数从本地目录部署，它定义了源代码将被存储其中的\
  \ Cloud Storage 存储桶的名称。\n- $TIMEOUT：函数的执行超时。\n- --retry：仅适用于后台函数。如果存在，它定义如果函数未成功执行则应重试运行。\n\
  \n接下来，让我们定义我们的触发器。\n\n## 触发器\n\n在定义必要参数后，您可以根据希望如何启动函数来定义以下触发器。\n\n要定义 HTTP 触发器，请使用以下命令：\n\
  \n```\n--trigger-http\n```\n\n将为函数分配一个端点。\n\n要触发 Cloud Storage 存储桶更改时的函数，请使用以下命令：\n\
  \n```\n--trigger-bucket=$TRIGGER_BUCKET\n```\n\n这里，我们有以下选项：\n\n- $TRIGGER_BUCKET：Google\
  \ Cloud Storage 存储桶名称。对此存储桶中文件所做的任何更改都将触发函数执行。\n\n要触发 Pub/Sub 队列中消息到达时的函数，请使用以下命令：\n\
  \n```\n--trigger-topic=$TRIGGER_TOPIC\n```\n\n这里，我们有以下选项：\n\n- $TRIGGER_TOPIC：Pub/Sub\
  \ 主题的名称。队列中到达的消息将触发此函数。消息的内容将传递给函数。\n\n对于其他来源，例如 Firebase，请使用以下命令：\n\n```\n--trigger-event=$EVENT_TYPE\n\
  ```\n\n```\n--trigger-resource=$RESOURCE\n```\n\n这里，我们有以下选项：\n\n- $EVENT_TYPE：应触发函数的动作\n\
  - $RESOURCE：事件发生的资源\n\n让我们看一个从 Pub/Sub 配置触发器的示例：\n\n```\ngcloud functions deploy\
  \ hello_pubsub --runtime python37\n--trigger-topic mytopic\n```\n\n\n\n这将部署一个名为\
  \ `help_pubsub` 的函数，其中消息会到达 `mytopic` Pub/Sub 主题。\n\n> **重要提示**\n> 你可能有兴趣查看一些更高级的触发器，例如使用\
  \ Firebase 身份验证。查看 https://cloud.google.com/functions/docs/calling/ 以获取每种可能触发器的示例。\n\
  \n在下一节中，我们将回顾可用于 Cloud Functions 的 IAM 角色。\n\n## IAM\n\n对 Google Cloud Functions\
  \ 的访问通过 IAM 保护。让我们看一下预定义角色的列表，以及每个角色的简短描述：\n\n- **Cloud Function 管理员**：有权创建、更新和删除函数。可以设置\
  \ IAM 策略并查看源代码。\n- **Cloud Functions 开发人员**：有权创建、更新和删除函数，以及查看源代码。不能设置 IAM 策略。\n\
  - **Cloud Functions 查看者**：有权查看函数。不能获取 IAM 策略，也不能查看源代码。\n- **Cloud Function 调用者**：有权使用其公共\
  \ URL 调用 HTTP 函数。\n\n请注意，要使 Cloud Functions 开发人员角色生效，您还必须将用户分配给 Cloud Functions\
  \ 运行时服务账号上的 IAM 服务账号用户角色。\n\n## 配额和限制\n\nGoogle Cloud Functions 带有预定义的配额。这些默认配额可以通过汉堡菜单通过\
  \ **IAM & Admin | Quotas** 进行更改。从此菜单中，我们可以查看当前配额并请求提高这些限制。我们建议您熟悉每个服务的限制，因为这会影响您的可扩展性。对于\
  \ Cloud Functions，我们应注意以下三种类型的配额：\n\n- **资源限制**：定义函数可以消耗的总资源量\n- **时间限制**：定义事物可以运行的时间长度\n\
  - **速率限制**：定义您可以调用 Cloud Functions API 的速率\n\n值的列表相当广泛。如果您想查看详细列表，请查看 *进一步阅读* 部分。\n\
  \n## 定价\n\nCloud Functions 的价格由多个因素组成。这些包括 **调用** 次数、**计算时间** 和网络速率（**联网**）。这些在以下图表中显示：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_287_0.png)\n\n图 9.16 – Cloud Functions\
  \ 定价\n\n请记住，有一个每月免费使用层，您可以在不产生任何成本的情况下试用。截至本书撰写之时，它包括 200 万次调用、100 万秒的计算时间和 5 GB\
  \ 的出站网络流量。尽情享受吧！\n\n## 总结\n\n在本章中，我们讨论了 Cloud Functions 以及它完美适用的多个用例。我们讨论了两种类型的函数，即\
  \ HTTP 和后台函数，并且还了解到函数可以通过特定事件或 HTTP 请求执行。最后，我们查看了如何使用 Google Cloud 控制台和 gcloud 命令部署函数。对于考试来说，了解\
  \ Cloud Functions 的用例以及何时使用它们对我们有利非常重要。\n\n通过本章，我们已完成了 Google Compute 选项。在下一章中，我们将查看网络。\n\
  \n## 进一步阅读\n\n有关本章所涵盖主题的更多信息，请查看以下资源：\n\n- **幕后的 Cloud Functions**：https://cloud.google.com/functions/docs/concepts/exec\n\
  - **Cloud Functions 和 VPC**：https://cloud.google.com/functions/docs/connecting-vpc\n\
  - **本地模拟器**：https://cloud.google.com/functions/docs/emulator\n- **冷启动：** https://cloud.google.com/functions/docs/bestpractices/tips\n\
  - **配额：** https://cloud.google.com/functions/quotas\n- **定价：** https://cloud.google.com/functions/pricing-summary/\n\
  - **gcloud 命令：** https://cloud.google.com/sdk/gcloud/reference/functions/deploy\n\
  - **Cloud Run：** https://cloud.google.com/run/\n"
- "# 10\n## Networking Options\nin GCP\n\n我们已经知道计算是最基本的云功能。但即使我们能够在不连接到资源的情况下进行计算，也不会产生价值。网络涵盖了许多类型的连接。我们需要能够连接到\
  \ Google Cloud 控制台和 Google Cloud Platform (GCP) API。我们可能希望通过虚拟专用网络（VPN）或通过高带宽互连将本地数据中心连接到\
  \ GCP。最后，我们可能需要对虚拟机（VM）实例进行负载均衡连接。GCP 网络将帮助我们完成所有这些工作。\n\n在本章中，我们将介绍我们需要了解的所有理论，以便了解工作负载如何在内部和外部与\
  \ GCP 通信。我们还将查看所有基本网络服务。\n\n我们将涵盖以下主题：\n\n- 探索 GCP 网络\n- 了解虚拟私有云\n- 负载均衡\n- **网络地址转换（NAT）**\n\
  - 混合连接\n- DNS\n- 防火墙规则\n- 私有访问\n\n## 探索 GCP 网络\n\nGoogle 网络与其他云有所不同。为了了解 Google\
  \ 在网络方面投入的巨大资金，我们应该查看以下地图（https://cloud.google.com/about/locations/#network-tab）。该地图显示了数十万条光纤电缆在\
  \ 85 个区域和 146 个 **接入点（PoP）** 之间运行。请记住，此视图来自 2021 年 10 月，并且仍在增长中：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_290_0.png)\n\
  \n图 10.1 – 网络位置（来源：https://cloud.google.com/about/locations/#network-tab。许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\
  \n拥有如此庞大的网络基础设施使您能够在非常接近您的 **互联网服务提供商（ISP）** 的位置连接 GCP。事实上，GCP 提供两种网络服务层级，如下所示：\n\
  \n- **Premium**：Premium 层提供高性能路由。除此之外，它还提供全球负载均衡和 **内容分发网络（CDN）** 服务。它面向需要全球存在且以最佳用户体验为目标的用例。此层附带\
  \ **服务等级协议（SLA）**。\n- **Standard：** Standard 层是性能较低且没有 SLA 的网络。CDN 服务不可用，负载均衡器为区域级。它面向以成本为主要决定因素的用例。暴露给用户的\
  \ GCP 网络基于名为 **Andromeda** 的 **软件定义网络（SDN）**。该平台是 GCP 中所有网络服务的编排点。幸运的是，这对用户来说是抽象的，无需了解\
  \ Andromeda 本身的工作原理。\n\n> **考试提示**\n> 有趣的是，网络并不是考试的关键主题；然而，有一个 GCP 认证网络工程师考试将彻底测试您的\
  \ GCP 网络知识。不了解网络基础知识就不可能理解其他 GCP 服务。因此，在本章中，您将了解 Google 的全球网络和 GCP 的网络服务。\n\n##\
  \ 了解虚拟私有云\n\nGCP 网络的基本概念是 **虚拟私有云（VPC）**，也简单称为 **网络**。正如您在 *第 2 章，入门 Google Cloud\
  \ Platform* 中所学，GCP 可以划分为项目，以逻辑上隔离 Google Cloud 资源。在一个项目中，您可以创建多个 VPC。\n\n默认情况下，每个项目最多可以创建五个网络（配额可通过联系支持扩展）。多个\
  \ VPC 使能够在网络层面上分离 GCP 资源，例如 VM、容器等。VPC 具有 **全局** 范围，并且可以跨所有 GCP 区域。允许驻留在不同 VPC 中的\
  \ VM 之间进行连接，您有两个选择：您可以创建共享 VPC 或对等 VPC。我们将在本章后面详细了解每个选项。\n\n此外，VPC 被划分为区域子网，也称为\
  \ **子网**，它们具有关联的 IP 范围，用于为资源分配地址。\n\n当您创建新项目时，会为您创建一个默认网络。每个区域都会创建子网，并分配不重叠的 CIDR\
  \ 块。\n\n> **重要提示**\n> **无类域间路由（CIDR）** 是一种 IP 地址方案，取代了传统的 A、B、C 类系统。它基于可变长度子网掩码。在\
  \ CIDR 中，子网的前缀可以定义为任意数字，使网络掩码长度更灵活。这意味着组织可以更有效地利用 IP 地址方案。\n\n\n\n\n\n此外，默认防火墙规则已创建以允许我们从任何地方入站\
  \ ICMP、RDP 和 SSH。默认网络内的任何流量也允许。以下 VPC 网络截图来自 GCP 门户的 VPC 网络部分：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_292_0.png)\n\
  \n图 10.2 – VPC 网络\n\n如果您创建一个新的 VPC，您可以从以下两种模式中选择：\n\n- **自动模式：** 自动为每个区域创建一个子网，使用预定义的\
  \ IP 范围，掩码为 /20，来自 10.128.0.0/9 CIDR 块。每个子网均可扩展至 /16 掩码。\n- **自定义模式：** 不会自动创建子网，并将完全控制权委托给用户。您可以决定创建多少个子网以及在哪些区域、动态路由模式（区域或全局）和\
  \ MTU 大小。您还可以指定是否希望启用流量日志和专用 Google 访问。\n\n创建子网时，您必须定义一个主范围，并且还可以定义最多五个辅助范围（这是可选的）：\n\
  \n- **主 IP 地址范围：** 对于此范围，地址可以从 RFC 1918 CIDR 地址空间分配，并且在同一网络中不应重叠。这些可以分配给 VM 主内部\
  \ IP 地址、VM 别名 IP 地址以及内部负载均衡器的 IP 地址。请注意，此范围内始终保留四个地址。\n\n- **辅助 IP 地址范围**：对于此范围，地址可以从\
  \ RFC 1918 CIDR 地址空间分配，并且只能用于别名 IP 地址。这些范围中没有保留地址。\n\n> **重要说明**\n> 如果 VM 上运行多个服务，则可以为其分配别名\
  \ IP 地址。您可以将它们映射到分配给该 VM 的别名 IP。它也用于 Google Kubernetes Engine Pod。有关更多信息，请参阅本章的\
  \ *进一步阅读* 部分。\n\n可以将自动模式网络转换为自定义模式网络，但不能反向转换。请记住，如果您将这些网络通过 VPC 对等互连或 VPN 连接，请不要使用在\
  \ VPC 之间或本地网络之间重叠的 IP 范围。\n\n## 连接性\n\n是时候了解 VPC 中 VM 实例之间的连接如何工作了。我们已经提到网络是全局的，而子网是区域性的。现在，让我们来看看\
  \ VM 网络。我们应该注意，VM 可以有两种类型的 IP 地址：\n\n- **内部 IP 地址**：在 VM 操作系统中分配\n- **外部 IP 地址（可选）**：分配给\
  \ VM 但在操作系统中不可见\n\n内部 IP 将始终分配给 VM。外部 IP 可以为您自动创建，也可以由您自行创建。如果您不想使用这种类型的地址，则在请求\
  \ VM 时需要将地址设置为 None。请注意，外部 IP 地址对 VM 本身不可见。用于发起连接的 IP 地址取决于以下场景：\n\n- 属于同一网络的 VM\
  \ 可以使用内部 IP 进行通信，即使它们位于不同区域。\n- 位于不同网络的 VM 可以使用外部 IP 进行通信，即使它们位于同一区域。\n\n让我们来看一下下面的图表：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_294_0.png)\n\n图 10.3 – 通信流程\n\n在此场景中，VM1\
  \ 和 VM2 可以使用内部 IP 进行通信。VM3 和 VM4 需要使用外部 IP 进行通信。请注意，VM3 和 VM4 之间的流量无需经过互联网，而是通过\
  \ Google 边缘路由器路由。\n\n## 成本\n\n了解网络流量如何流动非常重要，因为它会影响您的账单。一般经验法则是以下流量是免费的：\n\n- 入站流量\n\
  - 使用内部 IP 在同一区域内 egress\n- 使用外部 IP 地址或内部 IP 地址在同一区域内 egress 到不同的 GCP 服务\n\n> **重要说明**\n\
  > 此免费流量不包括本书中尚未提及的若干服务：Cloud Memorystore for Redis、Cloud Filestore、GKE 和 Cloud SQL。\n\
  \n您将被收取以下流量的费用：\n\n- 区域内不同区域之间的 egress\n- 不同区域之间的 egress\n- 互联网 egress（注意：VPN 流量被视为\
  \ egress）\n\n> **重要说明**\n> 有关当前定价，请参阅 https://cloud.google.com/vpc/network-pricing。\n\
  \n## VPC 流量日志\n\nVPC 流量日志允许您记录到 VM 实例和来自 VM 实例的网络流。流量以 5 秒间隔记录。请注意，只记录流量，而不是完整的网络数据包捕获。日志包含有关源和目标\
  \ VPC 以及实例开始和结束时间的信息。VPC 流量日志在子网级别启用，可用于实时安全分析、费用优化、取证或网络监控。\n\n## 跨 VPC 连接\n\n\
  在某些情况下，您可能需要在两个 VPC 之间提供连接。作为示例，贵组织中的部门正在合并，现在它们需要连接到各自 VPC 中驻留的服务。\n\n为此，目前有两种选择：\n\
  \n- 共享 VPC\n- VPC 对等互连\n\n让我们来看看这两种选项。\n\n## 共享 VPC\n\n在此模型中，我们有一个在不同项目之间共享的单个 VPC。创建共享\
  \ VPC 的项目称为主机项目。可以使用 VPC 的项目称为服务项目。在下面的图表中，我们可以看到有两个服务项目（服务项目 A 和服务项目 B）：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_296_0.png)\n\
  \n图 10.4 – 共享 VPC（来源：https://cloud.google.com/vpc/docs/shared-vpc。许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\
  \n要创建共享项目，需要共享 VPC 管理员角色（roles/compute.xpnAdmin）。共享 VPC 管理员可以进一步将权限委托给以下角色：\n\n\
  - **网络管理员**：对网络有完全控制权，不包括防火墙规则和 SSL 证书\n- **安全管理员**：对防火墙和 SSL 证书的控制\n\n服务项目中的用户可以预配位于共享\
  \ VPC 中的 VM。为此，他们需要分配网络用户角色。请注意，它可以分配在项目或子网级别。\n\n## VPC 网络对等互连\n\n通过 VPC 对等互连，您可以连接两个现有的\
  \ VPC，无论它们是否属于同一项目或组织。在此场景中，每个 VPC 的管理保持分离。\n\n对等互连的每个站点独立设置，并且只有在双方都配置后才会建立对等互连。项目所有者/编辑器和网络管理员角色有权执行配置。重要的是要记住，对等\
  \ VPC 子网之间的 CIDR 前缀不能重叠。一旦建立对等互连，每个内部 IP 都可以在对等网络之间访问。每个 VPC 可以创建多个对等互连，但不支持传递对等互连。这意味着只允许直接对等\
  \ VPC 之间的连接。您不能通过另一个 VPC 在两个 VPC 之间桥接流量。为了更好地理解这一点，请查看以下图表：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_297_0.png)\n\
  \n图 10.5 – VPC 对等互连\n\n在此场景中，VPC1 与 VPC2 和 VPC3 对等。VPC2 和 VPC3 之间没有通信，直到在两者之间配置对等互连。请注意，对等互连也可以与共享\
  \ VPC 建立。\n\n## 在共享 VPC 和 VPC 对等互连之间选择\n\n以下两个主要因素将帮助您在共享 VPC 和 VPC 对等互连之间进行选择，如下所示：\n\
  \n- 如果 VPC 存在于不同的组织中，请选择 VPC 对等互连。\n- 如果您需要共享治理模型，请选择共享 VPC。\n\n> **重要说明**\n> 在实际场景中，您可能对跨\
  \ VPC 通信有更详细的要求，因此我们鼓励您对此主题进行进一步阅读。\n\n\n\n\n\n## 负载均衡\n\n负载均衡是 GCP 网络最重要的功能之一。它允许您在可扩展资源之间分配工作负载。它适用于\
  \ GCE、GAE 和 GKE。\n\nGCP 中的负载均衡是开始时可能难以理解的主题之一。有许多类型的负载均衡器，而且 Google 文档在将它们映射到控制台中可以看到的内容时略显困难。当我们进入\
  \ Google Cloud Console (https://console.cloud.google.com) 并导航到 NETWORKING | Network\
  \ Services | Load Balancing，然后最终点击 Create load balancer 时，我们将看到以下配置选项：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_298_0.png)\n\
  \n图 10.6 – 负载均衡器选项\n\n查看文档时，它区分了以下负载均衡选项。我们将在负载均衡器类型部分更详细地介绍这些内容：\n\n- HTTP(S) 负载均衡（外部和内部）\n\
  - SSL 代理负载均衡\n- TCP 代理负载均衡\n- 网络负载均衡\n- 内部 TCP/UDP 负载均衡\n\n您会清楚地看到，这与 GUI 选项不匹配。请注意，要配置内部\
  \ TCP/UDP 负载均衡器，您需要选择 TCP Load Balancing 或 UDP Load Balancing，然后选择 Only between\
  \ my VMs 选项：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_298_1.png)\n\n图 10.7 –\
  \ 内部负载均衡器\n\n值得庆幸的是，考试并不要求您知道如何精确配置每种负载均衡方法，而是集中于它们之间的差异。但是，当您将知识付诸实践时，您将需要它。\n\n\
  > **重要提示**\n> 请参阅以下操作指南。所有选项都逐步描述：\n> https://cloud.google.com/load-balancing/docs/how-to.\n\
  \n您可能需要执行几个实验（使用 Qwiklabs.com 等服务）才能对负载均衡器配置感到舒适。对于我们的讨论，我们将坚持文档定义，因为它们也符合考试指南。\n\
  \n### 全局与区域负载均衡\n\n负载均衡可以在区域或全局级别提供。这意味着对于区域负载均衡，均衡的资源将驻留在同一区域内，而在全局负载均衡中，资源可以驻留在多个区域中。GCP\
  \ 与其他云提供商的区别在于，其中一些负载均衡选项在全球范围内可用。您无需担心将负载均衡器放置在正确的区域：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_299_0.png)\n\
  \n图 10.8 – 全局与区域负载均衡\n\n如前图所示，内部和网络负载均衡器仅限区域。\n\n### 外部与内部\n\n我们还可以根据负载均衡器是外部还是内部来区分它们。在大多数场景中，您希望将应用程序暴露给互联网。这将是外部负载均衡器的完美用例。但是，您可能还希望在应用程序后端进行负载均衡以实现高可用性场景。在这种情况下，您将使用内部负载均衡器，它不允许\
  \ VPC 外部的连接。\n\n### 代理与负载均衡器\n\n就到达后端 VM 的源 IP 而言，代理和负载均衡器之间存在重要区别。在代理的情况下，源 IP\
  \ 被交换为代理的 IP，因为连接在代理处终止。在负载均衡器的情况下，源 IP 被保留。请在配置使用源 IP 的防火墙规则时牢记这一点。\n\n### 负载均衡器类型\n\
  \n牢记我们之前提到的关键区别，让我们看一下每种负载均衡类型：\n\n- **HTTP(S) 负载均衡**：需要特别注意的负载均衡器之一是 HTTP(S) 负载均衡器。**外部\
  \ HTTP(S) 负载均衡器**是全局的，允许外部连接。它支持 IPv4 和 IPv6。它只能用于 HTTP 和 HTTPS 流量，但提供一些额外的功能，例如以下内容：\n\
  \  - CDN 缓存\n  - 与 Cloud Armor 集成\n  - 支持 URL maps\n  - 主机 SSL 证书\n  - 支持 Cloud\
  \ Storage\n  - 支持会话亲和性\n  - 支持 **快速 UDP 互联网连接 (QUIC)** 协议\n\n- **内部 HTTP(S) 负载均衡器**是区域性的，仅可在\
  \ VPC 的所选区域内访问。它们*不*支持以下内容：\n  - Cloud CDN\n  - Cloud Armor\n  - 存储桶\n  - Google\
  \ 管理的 SSL 证书\n  - SSL 策略\n\n> **重要提示**\n> 会话亲和性会将客户端会话粘贴到单个 VM 实例，只要该实例健康。\n\n-\
  \ **SSL 代理负载均衡：** SSL 代理终止用户的 SSL（TLS 连接），并 intended for 非 HTTP(S) 流量。它是全局的，允许外部连接，支持\
  \ IPv4 和 IPv6。从代理到机器的流量可以使用 TCP 或 SSL 协议。\n- **TCP 代理负载均衡：** TCP 代理终止不需要 SSL 的非\
  \ HTTP 流量。它是全局的，允许外部连接，支持 IPv4 和 IPv6。\n- **网络 TCP/UDP 负载均衡：** 网络负载均衡使用非代理负载均衡器，根据入站\
  \ IP 协议数据（如地址、端口和协议类型）分发流量。它是区域性的、外部的，仅支持 IPv4。网络负载均衡器将要进行负载均衡的 VM 收集到称为 **目标池**\
  \ 的逻辑组中。\n- **内部 TCP/UDP 负载均衡：** 内部负载均衡是非代理形式的负载均衡。它是区域性的、内部的，仅支持 IPv4。例如，它可用于三层应用程序，其中\
  \ Web 服务需要对应用程序层进行内部连接的负载均衡。\n\n接下来，让我们比较这些不同类型的负载均衡器。\n\n### 比较\n\n现在我们已经了解了每个负载均衡器，让我们看一下表格，帮助我们将最重要的功能放在一个区域：\n\
  \n| 负载均衡器类型 | 流量类型 | 保留客户端 IP | 全局或区域 | 负载均衡方案 | 负载均衡器目标端口 | 代理或直通 |\n|---|---|---|---|---|---|---|\n\
  | External HTTP(S) | HTTP or HTTPS | No | Global* | EXTERNAL | HTTP on 80 or 8080;\
  \ HTTPS on 443 | Proxy |\n| Internal HTTP(S) | HTTP or HTTPS | No | Regional | INTERNAL_MANAGED\
  \ | HTTP on 80 or 8080; HTTPS on 443 | Proxy |\n| SSL Proxy | TCP with SSL offload\
  \ | No | Global* | EXTERNAL | 25, 43, 110, 143, 195, 443, 465, 587, 700, 993, 995,\
  \ 1883, 3389, 5222, 5432, 5671, 5672, 5900, 5901, 6379, 8085, 8099, 9092, 9200,\
  \ and 9300 | Proxy |\n| TCP Proxy | TCP without SSL offload | No | Global* | EXTERNAL\
  \ | 25, 43, 110, 143, 195, 443, 465, 587, 700, 993, 995, 1883, 3389, 5222, 5432,\
  \ 5671, 5672, 5900, 5901, 6379, 8085, 8099, 9092, 9200, and 9300 | Proxy |\n| External\
  \ Network TCP/UDP | TCP, UDP, ESP, or ICMP (Preview) | Yes | Regional | EXTERNAL\
  \ | Any | Pass-through |\n| Internal TCP/UDP | TCP or UDP | Yes | Regional backends,\
  \ regional frontends (global access supported) | INTERNAL | Any | Pass-through |\n\
  \n图 10.9 – 负载均衡器比较（来源：https://cloud.google.com/load-balancing/docs/ choosing-load-balancer.\
  \ 许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\n查看图 8.9，思考每种均衡器的用例。一个很好的例子可以是三层应用程序。您将使用哪种负载均衡器来平衡每个层？\n\
  \n### 选择合适的负载均衡器\n\n要选择合适的负载均衡器，让我们看一下 Google 提供的以下图表：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_303_0.png)\n\
  \n1 IPv6 客户端在 Premium Tier 中配置负载均衡器时支持 TCP 流量。IPv6 客户端不支持 UDP 流量。\n2 选择外部网络负载均衡的另一个原因是，如果您需要确保负载均衡器位于特定区域。\n\
  3 外部网络负载均衡器使用可在任何地方由客户端访问的区域外部 IP 地址。\n4 位于 VPC 网络或连接到 VPC 网络的网络中的客户端。\n5 外部 HTTP(S)\
  \ 负载均衡器（经典）可以在 Standard Tier 中配置为区域性。\n\n图 10.10 – 负载均衡器考虑因素（来源：https://cloud.google.com/load-balancing/docs/choosing-load-balancer.\
  \ 许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\n让我们逐步介绍前面的图表：\n\n\
  - 1. 首先，我们需要选择是否希望负载均衡器可外部访问或内部访问。对于外部暴露，我们选择要平衡的流量。\n- 2. 对于 HTTP 和 HTTPS 流量，我们使用\
  \ HTTP(S) 负载均衡器。\n- 3. 对于具有 SSL 卸载的 TCP 流量，我们将选择 SSL 代理。如果我们不需要 SSL 卸载但需要 IPv6 或全局范围支持，我们将选择\
  \ TCP 代理。\n- 4. 然后，我们需要检查是否需要保留客户端 IP。如果需要，我们选择网络负载均衡器；如果不需要，我们保留 TCP 代理。网络负载均衡器也可用于不需要\
  \ IPv6 或全局范围的 UDP 流量。\n- 5. 对于内部负载均衡，使用内部 TCP/UDP 负载均衡器。\n\n\n\n\n\n正如你所见，选择合适的负载均衡器可能是一项相当令人望而生畏的任务。然而，如果你遵循前面的流程图，你应该能够选择最佳方案。\n\
  \n现在我们已经了解了负载均衡的工作原理，接下来我们将了解 NAT。\n\n## NAT\n\nNAT 是一种服务，当流量通过路由设备时，它会转换源和/或目标地址。在\
  \ GCP 的情况下，NAT 允许我们在与外部网络通信时隐藏 VM 的原始 IP 地址。在 GCP 的情况下，它允许具有内部地址的 VM 访问互联网。\n\n\
  目前 NAT 有两种选择，如下所示：\n\n- NAT 网关\n- Cloud NAT\n\nGoogle 建议使用 Cloud NAT 而非 NAT 网关。如果你仍在使用\
  \ NAT 网关，Google 建议你将其迁移到 Cloud NAT，因为它是一种托管且可自动扩缩的服务。\n\n## NAT 网关\n\nGoogle 允许我们配置一台\
  \ VM 作为 NAT 网关。这样，你只需将一台 VM 暴露给互联网。网关机器需要使用 `--can-ip-forward` 参数进行配置，该参数允许流量转发。你还需要为应使用该网关的子网创建默认路由。正如你所见，此解决方案看起来并不具备可扩展性，并引入了单点故障的概念。\n\
  \n为消除此问题，你可以创建多个网关并将其放入托管实例组中。接下来，你将路由规则配置到具有相同优先级的 NAT 网关。在这种情况下，GCP 使用 **等价多路径\
  \ (ECMP)** 在 NAT 网关之间分配流量。\n\n> **重要说明**\n> 要了解如何创建高可用 NAT 网关，请完成 https://www.qwiklabs.com/focuses/612?parent=catalog\
  \ 上的 *Building High Availability and High Bandwidth NAT Gateways* 实验。\n\n如果这听起来很复杂，幸运的是，有一个更简单的解决方案。是的，你猜对了！Cloud\
  \ NAT。\n\n## Cloud NAT\n\nCloud NAT 是一种区域性的可自动扩缩服务，由 Google 全面托管。它允许 VM 在无需外部 IP\
  \ 地址的情况下访问互联网。它不允许入站互联网流量进入 VM。该服务由 Google SDN 提供，因此无需管理网关实例。事实上，在幕后，并没有真正的代理 VM。\n\
  \n就带宽而言，每个 VM 获得的带宽与它拥有外部 IP 地址时完全相同。\n\n## 混合连接\n\n所谓混合连接，是指 GCP 与本地数据中心之间的连接。如果你想通过安全通道连接到\
  \ GCP 而不仅仅是穿越互联网，这一点很重要。实现这种连接有多种方式。你选择的方案将取决于你的可靠性、带宽和延迟要求。\n\n现在，让我们来看一些可能的混合连接选项，即\
  \ VPN Interconnect 和对等互连。\n\n## VPN\n\nCloud VPN 是一种区域性服务，它将使用 IPSec 隧道安全地将本地网络连接到\
  \ GCP VPC。所有通过互联网穿越隧道的流量都经过加密。支持 IKEv1 和 IKEv2 两种加密算法。VPN 连接需要一个 Cloud VPN 网关、一个本地\
  \ VPN 网关，以及从每个网关的角度建立的两个 VPN 隧道。当两个隧道都创建后，连接即建立。本地网关可以是硬件或软件设备。有特殊要求，即本地网关的 MTU\
  \ 不应高于 1,460 字节。VPN 支持静态和动态路由。动态路由由 VPC 网络中的路由器管理并使用边界网关协议 (BGP)，而静态路由是手动创建的并支持路由下一跳。\n\
  \n截至撰写时，Google 提供两种类型的 VPN 网关：HA VPN 和 Classic VPN。\n\n## HA VPN\n\nHA VPN，如你所料，是一种高可用\
  \ VPN 解决方案，允许我们将本地网络连接到单个区域中的 GCP VPC。由于其高可用性，HA VPN 在服务可用性方面提供 99.99% 的 SLA。当我们创建此类\
  \ VPN 时，GCP 会自动创建两个外部 IP 地址——每个固定接口一个，每个 HA VPN 网关接口都支持多个隧道。我们应注意，可以仅使用单个活动接口和一个外部\
  \ IP 配置 HA VPN，但这样将无法获得上述 SLA。要实现 99.99% 可用性 SLA，需要满足一些要求。让我们更详细地讨论：\n\n- 可用性仅在连接的\
  \ Google Cloud 端得到保证，这意味着端到端可用性将取决于对等 VPN 网关的正确配置。如果配置正确，则两侧均为 Google Cloud 网关，端到端\
  \ 99.99% 可用性将得到保证。为了在两侧 VPN 网关均位于 VPC 网络时实现高可用性，我们需要使用两个 HA VPN 网关，并且两者必须位于同一区域。\n\
  - 虽然两个网关必须位于同一区域，但如果我们的 VPC 网络配置为 **全局动态路由** 模式，则网关共享的子网的路由可以在任何区域。如果我们将 VPC 网络配置为\
  \ **区域动态路由** 模式，则只有与同一区域的子网的路由才会被与对等网络共享。学习到的路由仅应用于与 VPN 隧道位于同一区域的子网。\n- HA VPN\
  \ 还必须拒绝在外部 VPN 网关资源中配置的 Google Cloud IP 地址；例如，使用 VM 实例的外部 IP 地址作为外部 VPN 网关资源的外部\
  \ IP 地址。为了获得完全受支持的 HA VPN 拓扑，必须在 Google Cloud 网络的两侧都使用 HA VPN。\n\n我们还必须确保从 Cloud\
  \ VPN 网关的角度配置两个 VPN 隧道。这根据我们的设计有特定的要求：\n\n- **两个对等 VPN 网关设备**：此配置要求 Cloud VPN 网关每个接口上的每个隧道都必须连接到其自己的对等网关。\n\
  - **单个对等 VPN 网关设备带两个接口**：此配置要求 Cloud VPN 网关每个接口上的每个隧道都必须连接到对等网关上的其自己的接口。\n- **单个对等\
  \ VPN 网关设备带单个接口**：此配置要求 Cloud VPN 网关每个接口上的两个隧道都必须连接到对等网关上的同一接口。\n- 对等 VPN 设备必须配置适当的冗余。设备厂商将指定冗余配置的细节，这可能因厂商而异。\n\
  - 如果我们的设计需要两个对等设备，则每个对等设备应连接到不同的 HA VPN 网关接口。如果对等方来自另一家提供商，例如 Azure，则在 Azure 端也应以适当的冗余配置\
  \ VPN 连接。\n- 最后，我们的对等 VPN 网关设备必须支持动态 (BGP) 路由。\n\n## Classic VPN\n\nClassic VPN\
  \ 网关具有单个接口和单个外部 IP 地址。它们支持使用 BGP 或静态路由的隧道，并提供 99.9% 的服务可用性 SLA。我们不会过多讨论 Classic\
  \ VPN。从 2021 年第四季度开始，我们将无法再使用静态路由创建连接另一个 Classic VPN 网关的 Classic VPN 隧道，也无法将 Classic\
  \ VPC 网络连接到另一家云提供商网络。你也将无法创建新的 Classic VPN 隧道。Google 鼓励我们将生产流量迁移到 HA VPC。\n\n##\
  \ Interconnects\n\nInterconnect 是一种第 2 层连接方法，会产生月度费用。当你需要在 GCP 与本地网络之间实现低延迟和高可用连接，并且计划进行大量数据传输时，你会使用它。\n\
  \n它有两种类型，如下所示：\n\n- **Dedicated Interconnect：** 连接与 Google Edge 建立。Google 按小时向我们收费，费用取决于电路的大小（即\
  \ 10 Gbps 或 100 Gbps）。通过 Dedicated Interconnect 连接从 VPC 网络传出的流量也需要付费。\n- **Partner\
  \ Interconnect：** 连接与 Google 合作伙伴网络建立。Google 也按 VLAN 附件的容量按小时向我们收费，通过 Partner Interconnect\
  \ 连接从 VPC 网络传出的流量也需要付费。\n\n\n\n\n\n连接可以通过引入多个链路来扩展。对于专用互连，每个连接提供 10 Gbps 或 100 Gbps\
  \ 电路。最多可以创建八个 10 Gbps 连接，使每个互连的总最大带宽达到 80 Gbps，或 2 x 100 Gbps（200 Gbps）电路。对于合作伙伴互连，带宽范围从\
  \ 50 Mbps 到 50 Gbps。互连提供 99.9% 或 99.99% 的正常运行时间 SLA。这取决于您的配置和连接数量。\n\n有关定价方案的更多信息，我们建议您查看\
  \ https://cloud.google.com/network-connectivity/docs/interconnect/pricing。\n\n##\
  \ Peering\n\nPeering 是一种三层连接方法。它提供对 Google Workspace、YouTube 和 Google API 等服务的连接，这些服务使用公共\
  \ IP 地址。它使我们能够建立更高可用性和延迟的连接。请注意，这些连接存在于 GCP 之外。Peering 没有维护成本，并且有以下两种类型：\n\n- **Direct\
  \ Peering**\n- **Carrier Peering**\n\nDirect Peering 每个与 GCP PoP 建立的链路提供 10 Gbps\
  \ 连接，PoP 是 Google 网络与互联网其余部分连接的点。Carrier Peering 带宽取决于提供商。请注意，peering 不提供 SLA。\n\
  \n## 选择合适的连接方法\n\n总体而言，Google 的建议是先使用 Cloud VPN 开始连接，如果需要则迁移到 Interconnect。再次，Google\
  \ 提供了一个不错的流程图，可帮助您根据具体情况做出最佳连接方法的正确选择：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_309_0.png)\n\
  \n图 10.11 – Interconnect 考虑因素（来源：https://cloud.google.com/hybrid-connectivity/）\n\
  \n这结束了混合连接部分。再次，在选择 Interconnect 连接之前请三思。除非您有高带宽和低延迟要求，否则先从 VPN 开始，只有在未获得预期结果时才迁移到\
  \ Interconnect。在后面的章节中，我们将研究域名系统（DNS），它对于正确的主机名和 URL 解析至关重要。\n\n## Network Connectivity\
  \ Center\n\nNetwork Connectivity Center 是管理 Google Cloud 中网络连接的枢纽辐射模型。它允许我们使用 Google\
  \ 的网络作为广域网（WAN）进行数据传输，将本地或其它公有云网络连接在一起。使用此服务可实现对 Google 网络的全球范围和可靠性的访问。\n\n使用枢纽辐射模型，站点使用各种本地连接相互连接。例如，数据中心\
  \ A 可以通过 Cloud VPN 连接到 VPC，而数据中心 B 可以通过专用互连连接到同一 VPC。这些站点随后通过与 VPC 关联的 Network Connectivity\
  \ Center 枢纽连接。\n\n## DNS\n\nDNS 允许将域名解析为 IP 地址。关于 GCP 中的 DNS，您需要了解以下几个概念：\n\n- DNS\
  \ resolution\n- Cloud DNS\n- DNS Security (DNSSEC)\n\n### DNS resolution\n\nVPC\
  \ 附带内部 DNS 服务。机器的内部名称会自动在内部区域中注册。这允许同一网络内的 VM 使用内部 DNS 名称相互访问。DNS 记录遵循 VM 的生命周期。VM\
  \ 创建时创建，VM 删除时删除。这意味着名称在实例部署时创建，在实例删除时移除。请注意，记录仅为内部 IP 创建（不包括外部和别名 IP）。解析仅适用于同一\
  \ VPC 内的 VM。\n\n如您所知，有许多类型的 DNS 记录（A、MX、SRV、CNAME 等）。在此情况下实际创建的记录是所谓的 A 记录。这些记录将主机名翻译为\
  \ IP 地址。它们使用以下模式创建：\n\n```\n<INSTANCE_NAME>.c.<PROJECT_ID>.internal\n```\n\n这里，INSTANCE_NAME\
  \ 是 GCP 自动生成的 hostname，PROJECT_ID 是 VM 部署所在的项目的 ID。\n\n当 VM 部署时，IP 设置会自动配置。VM 的\
  \ DNS 服务器设置也会配置并指向其元数据服务器。对于公共名称解析，查询会转发到 Google 的公共 DNS 服务器。对于外部 IP，记录不会自动注册。它们可以注册到外部\
  \ DNS 服务器或托管在 Cloud DNS 服务中的 DNS 区域。\n\n### Cloud DNS\n\nCloud DNS 是一种托管服务，允许您托管数百万条\
  \ DNS 记录，而无需管理任何服务器或软件。由于它托管在 Google 托管的基础设施上，因此提供 100% 的正常运行时间 SLA。\n\nCloud DNS\
  \ 允许我们创建包含多条记录的管理区域。要从当前提供商迁移，您可以导出区域然后导入到 Cloud DNS。记录可以使用 API 和 `gcloud` 命令管理。\n\
  \n### DNSSEC\n\nDNSSEC 是一种 DNS 扩展，允许对域名查找响应进行身份验证。它保护请求者免受 DNS 请求响应的篡改和污染。在 GCP\
  \ 中，DNSSEC 可以按 DNS 区域启用。请注意，它也需要在您的域名注册商处配置。此外，请求者需要确保其工作站上的解析器对 DNSSEC 签名的域验证签名。\n\
  \n> **Important Note**\n> 有关更多详细信息，请参阅 https://cloud.google.com/dns/docs/dnssec。\n\
  \n## VPC firewall rules\n\n防火墙是硬件或软件设备，用于过滤通过它的网络流量。此过滤可以根据许多条件进行，例如源、目标 IP、协议或端口。它允许您保护网络免受不需要的访问。\n\
  \n防火墙规则允许您控制到和来自基于 VM 的实例的流量。防火墙规则独立于 VM 操作系统工作，并且在启用状态下始终强制执行。VPC 充当分布式防火墙，利用微分段。这意味着防火墙规则按\
  \ VM 强制执行，即使机器位于同一网络中。应注意，它没有分析数据包内容的能力。防火墙规则由以下组件构成：\n\n- **Ingress (inbound) firewall\
  \ rules:**\n  - **Priority:** 65545 with a default value of 1000\n  - **Action:**\
  \ `allow` or `deny`\n  - **Enforcement:** `enabled` or `disabled`\n- **Target (destination)**:\
  \ All instances in the network, tag, and service account\n- **Source**: Address\
  \ range, subnet, service account, and network tag\n- **Protocol and ports**: Allow\
  \ all or specify a protocol(s) and port(s)\n- **Egress (outbound) firewall:**\n\
  \  - **Priority:** 65545 with a default value of 1000\n  - **Action:** allow or\
  \ deny\n  - **Enforcement:** enabled or disabled\n  - **Target (source)**: All instances\
  \ in the network, tag, and service account\n  - **Destination**: Address range and\
  \ subnet\n  - **Protocol and ports**: Allow all or specify a protocol(s) and port(s)\n\
  \n我们可以进一步将这些防火墙规则分为如下：\n\n- Default firewall rules\n- Implied rules\n- Always allowed\
  \ traffic rules\n- Always denied rules\n- User-defined rules\n- GKE firewall rules\n\
  \n上述规则是您在了解基础设施和应用程序需要什么流量进行通信后实际定义的内容。**默认规则**由 Google 定义，以提供管理环境所需的基本保护和功能。现在，让我们更仔细地查看它们各自。\n\
  \n### Default rules\n\n对于默认网络，创建了多个优先级为 65534 的允许入站防火墙规则，如下所示：\n\n- `default-allow-internal`:\
  \ VPC 内实例之间所有协议和端口的入站连接\n- `default-allow-ssh`: 从任何源到 VPC 中任何实例的 TCP 端口 22 入站连接\n\
  \n\n\n\n\n- `default-allow-rdp`: 允许来自任何源到 VPC 中任何实例的 TCP 端口 3389 入站连接\n- `default-allow-icmp`:\
  \ 允许来自任何源到 VPC 中任何实例的入站 ICMP 流量：\n\n| 名称 | 类型 | 目标 | 过滤条件 | 协议/端口 | 操作 | 优先级 | 网络\
  \ |\n|---|---|---|---|---|---|---|---|\n| default-allow-http | 入站 | http-server\
  \ | IP 范围：0.0.0.0/0 | tcp:80 | 允许 | 1000 | default |\n| default-allow-https | 入站\
  \ | https-server | IP 范围：0.0.0.0/0 | tcp:443 | 允许 | 1000 | default |\n| default-allow-icmp\
  \ | 入站 | 应用于所有 | IP 范围：0.0.0.0/0 | icmp | 允许 | 65534 | default |\n| default-allow-internal\
  \ | 入站 | 应用于所有 | IP 范围：10.128.0.0/9 | tcp:0-65535 udp:0-65535 icmp | 允许 | 65534\
  \ | default |\n| default-allow-rdp | 入站 | 应用于所有 | IP 范围：0.0.0.0/0 | tcp:3389 | 允许\
  \ | 65534 | default |\n| default-allow-ssh | 入站 | 应用于所有 | IP 范围：0.0.0.0/0 | tcp:22\
  \ | 允许 | 65534 | default |\n\n图 10.12 – 防火墙规则\n\n还有针对 HTTP 和 HTTPS 流量的预定义规则。这些规则的目标是标签。您可以将这些标签分配给您的\
  \ VM 以允许此类型流量来自任何源。\n\n## 隐含规则\n\n有两个隐含的防火墙规则，优先级最低为 65535，具体如下：\n\n- **拒绝入站规则**\
  \ 源为 0.0.0.0/0\n- **允许出站规则** 目标为 0.0.0.0/0\n\n此时，可能有必要澄清一下，65535 是最低可能的优先级，0 是最高。此外，IP\
  \ 范围 0.0.0.0/0 等同于所有 IPv4 地址。规则无法删除，但可以被具有更高优先级的任何规则覆盖。\n\n## 始终允许的流量规则\n\n有某些类型的流量始终允许从\
  \ VM 发出，具体如下：\n\n- 到元数据服务器的流量\n- DHCP 流量\n- DNS 流量\n- NTP 流量\n\n## 始终拒绝的规则\n\n还有一些类型的流量始终被阻止，具体如下：\n\
  \n- GRE 流量\n- 除 TCP、UDP、ICMP、AH、ESP、SCTP 和 IPIP 之外的协议\n- TCP 端口 25 上的出站 SMTP 流量\n\
  \n## 用户定义规则\n\n最后，用户定义规则是您将定义的规则，以允许应用程序所需的通信，而该通信不符合默认、始终允许或隐含规则：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_314_0.png)\n\
  \n图 10.13 – 创建防火墙规则\n\n这些规则可以通过转到导航菜单，VPC 网络 | 防火墙，并点击创建防火墙规则来创建。\n\n## 防火墙日志\n\n\
  防火墙日志允许您验证防火墙规则是否正常运行。它可以为新的和现有的防火墙规则启用。日志注入到 Google Cloud 操作套件中（以前称为 Stackdriver）。\n\
  \n## 分层防火墙策略\n\n分层防火墙策略允许我们为组织创建和执行一致的策略。它们可以分配给整个组织或单个文件夹。与 VPC 防火墙规则一样，分层防火墙策略包含可以拒绝或允许连接的规则，但还可以借助\
  \ goto_next 操作将评估委托给低一级的策略或 VPC 网络防火墙规则。这允许组织范围的管理员在一个地方管理防火墙规则。\n\n我们应该注意，在组织或文件夹节点级别创建策略不会自动将规则应用于节点\
  \ – 策略需要与组织中的节点关联，并且单个策略可以与多个节点关联。策略是防火墙规则的容器，当我们将策略与组织或文件夹关联时，规则会立即应用。我们可以为节点交换策略，这会原子地交换应用于该节点下\
  \ VM 实例的所有防火墙规则。与组织节点关联的规则首先被评估，并且组织中的任何文件夹和 VPC 网络都会继承此策略。如果策略应用于文件夹，则该文件夹中的所有文件夹和\
  \ VPC 网络都将继承其关联的策略。分层策略不能与项目关联。可以在以下图表中看到可以应用防火墙规则的层级：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_315_0.png)\n\
  \n图 10.14 – 分层策略继承（来源：https://cloud.google.com/vpc/docs/firewall-policies）\n\n分层防火墙策略规则必须具有指定的优先级，该优先级在每个策略中是唯一的。这与\
  \ VPC 防火墙规则不同，后者可以有多个具有相同优先级的规则。此外，防火墙策略规则没有名称，而是策略本身具有 ID 和名称，每个规则都有唯一的优先级数字。然后按优先级顺序评估规则，从最高优先级规则开始，表示为最低数字。例如，优先级号为\
  \ 100 的规则将覆盖优先级为 200 的规则。\n\n要从 Google Cloud Shell 创建防火墙策略，请使用以下代码并替换您的组织 ID 和文件夹\
  \ ID：\n\n```\ngcloud compute firewall-policies create \\\n    [--organization ORG_ID]\
  \ | --folder FOLDER_ID] \\\n    --short-name SHORT_NAME\n```\n\n然后我们通过使用以下命令向策略添加规则。我们使用了示例组织\
  \ ID：\n\n```\ngcloud compute firewall-policies rules create 1000 \\\n    --action=allow\
  \ \\    --description=\"allow-scan-probe\" \\\n    --layer4-configs=tcp:123 \\ \
  \   --firewall-policy=example-firewall-policy \\    --organization=123456789\\ \
  \   --src-ip-ranges=10.100.0.1/32\n```\n\n最后，将防火墙策略与组织节点关联。我们使用了示例组织 ID：\n\n```\n\
  gcloud compute firewall-policies associations create \\\n    --firewall-policy=example-firewall-policy\
  \ \\\n    --organization=123456789\n```\n\n在下一节中，我们将查看私有访问选项。\n\n## 私有访问选项\n\nGoogle\
  \ 提供了各种选项，让 VM 实例无需外部 IP 地址即可访问受支持的 API 和服务。根据您的用例，您可以配置一个或全部可用选项，它们彼此独立运行。作为高层次概述，以下是使用每个选项的原因：\n\
  \n- **面向 Google API 的 Private Service Connect**：用于在本地和 GCP 资源不需要外部 IP 地址时，使用 VPC\
  \ 网络中的端点连接到 Google API 和服务。\n- **Private Google Access**：用于在不为 GCP 资源分配外部 IP 地址的情况下连接到\
  \ Google API 和服务。\n- **面向本地主机的 Private Google Access**：用于在本地主机不需要外部 IP 地址时，通过 VPC\
  \ 网络连接到 Google API 和服务。\n- **面向服务的 Private Service Connect**：用于在不为 GCP 资源分配外部 IP\
  \ 地址的情况下连接到另一个 VPC 网络中的受支持服务。\n- **Private Services Access**：用于在不为 GPC 或第三方资源分配外部\
  \ IP 地址的情况下连接到特定的 Google 或第三方服务。\n- **Serverless VPC Access**：用于使用内部 IP 地址直接从无服务器\
  \ Google 服务连接到 VPC 网络中的资源。\n\n使用私有访问时还存在 DNS 方面的考虑，因此了解每个选项及其影响非常重要。例如，如果我们想使用 **面向本地主机的\
  \ Private Google Access** 选项，我们的本地网络必须配置 DNS 区域和记录，以便 Google 域名解析为 `private.googleapis.com`\
  \ 或 `restricted.googleapis.com` 的 IP 地址集。\n\n> **重要说明**\n> 欲了解更多详情，请查看 Google 文档\
  \ https://cloud.google.com/vpc/docs/private-access-options。\n\n## 摘要\n\n在本章中，我们介绍了\
  \ GCP 中的基本网络概念。我们学习了 VPC、负载均衡、防火墙、DNS 和混合连接。确保您了解如何将 VM 连接到 GCP 网络，以及如何保护和负载均衡它们。现在您了解了连接到本地数据中心的各种方式，我们建议您获得一些实践经验。设置您的第一个\
  \ VPC，创建防火墙规则，并部署和管理一个带有您选择的负载均衡器的 VM 实例组。如果您在操作中遇到任何问题，请返回本书并查看本章或 *第 4 章，使用 Google\
  \ Compute Engine*。\n\n在 *第 11 章，探索 GCP 中的存储和数据库选项 – 第 1 部分* 和 *第 12 章，探索 GCP 中的存储和数据库选项\
  \ – 第 2 部分* 中，我们将看到如何存储数据。这对于有状态工作负载至关重要。\n\n\n\n\n\n## 进一步阅读\n\n本章中我们提供的网络服务概述对于考试来说应该足够了。如果您仍觉得需要更深入了解\
  \ GCP 网络知识，请查看以下链接：\n\n- **VPC**：https://cloud.google.com/vpc/docs/\n- **Firewalls**：https://cloud.google.com/vpc/docs/firewalls\n\
  - **Load balancing**：https://cloud.google.com/load-balancing/docs/\n- **Interconnects**：https://cloud.google.com/interconnect/docs/\n\
  - **VPN**：https://cloud.google.com/vpn/docs/\n- **DNS**：https://cloud.google.com/dns/docs/\n\
  - **NAT**：https://cloud.google.com/nat/docs/\n- **Alias IP addresses**：https://cloud.google.com/vpc/docs/alias-ip\n"
- "## 11\n在 GCP 中探索存储和数据库选项 – 第 1 部分\n\n在前两章中，我们学习了有关网络和计算服务的重要主题。现在，我们将继续了解 GCP 的另一个基础产品——存储。每个应用程序都需要存储数据，但并非所有数据都相同。数据可以是有结构的、无结构的、关系型的或事务型的，而\
  \ GCP 提供了满足这些需求的服务。您的应用程序甚至可能需要使用多个存储服务来实现需求。\n\n在本章中，我们将了解 Google 提供的不同类型的存储，并解释在选择特定服务之前应考虑的内容。Google\
  \ 提供了众多存储选项，如果在一章中全部涵盖，可能会让您难以消化。因此，我们将本章分为两部分。\n\n在本部分中，我们将考虑应选择哪种存储选项，并探讨以下主题：\n\
  \n- 选择合适的存储选项\n- 了解 Cloud Storage\n- 了解 Cloud Firestore\n- 了解 Cloud SQL\n\n尽管 BigQuery\
  \ 可以被视为一种存储选项，但我们将在 *第 13 章，分析大数据选项* 中介绍该产品。\n\n让我们从了解何时应选择特定的存储服务开始本章。之后，我们将逐一介绍每项服务，同时集中于考试主题。\n\
  \n## 选择合适的存储选项\n\n正如本章开头所述，Google 提供了各种存储服务。您必须了解针对您的需求应使用哪种正确的存储。Google 提供了一个不错的流程图供我们逐步了解。它易于遵循，并展示了需求如何决定应选择哪种存储选项。请花点时间查看以下决策树。该图表通过一些关键问题来确保我们选择的存储服务能够满足需求：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_321_0.png)\n\n图 11.1 – 存储选项\n\n有了上述图表，我们来看一个示例：\n\
  \n- 1. 首先，我们需要了解我们的数据是否是有结构的。根据此答案，将推荐不同的服务。\n- 2. 如果我们的数据是有结构的，那么我们应检查工作负载是否用于分析。\n\
  - 3. 如果我们的数据不用于分析，那么我们应检查我们的数据是否具有关系性。\n- 4. 如果我们的数据具有关系性，那么我们需要知道是否需要水平扩展。\n- 5.\
  \ 如果需要，则应选择 Cloud Spanner。如果不需要，则应选择 Cloud SQL。\n\n如上图所示，根据需求会有各种结果。GCP 提供了大量存储服务，但如果我们遵循此流程图，就应该能够选择最佳选项。\n\
  \n此外，Google 还提供了以下信息，这可能有助于您了解所需的产品：\n\n| CATEGORY | PRODUCT | GOOD FOR |\n|---|---|---|\n\
  | Object Storage | Cloud Storage | Streaming videos. Image and web asset libraries.\
  \ Data lakes. |\n| Block Storage | Persistent disk | Disks for virtual machines.\
  \ Shared read-only data across multiple VMs. Creating durable backups of running\
  \ VMs. Storage for databases. |\n| Block Storage | Local SSD | Flash-optimized databases.\
  \ Hot caching layer for analytics. Application scratch disk. |\n| Archival Storage\
  \ | Cloud Storage | Data analytics. Rendering and media processing. Application\
  \ migrations. Web content management. |\n| Data Transfer | Data Transfer Service\
  \ | Collecting research data. Moving ML/AI training datasets. Migrating from S3\
  \ to Google Cloud. |\n| Data Transfer | Transfer Appliance | Transfer data for archival,\
  \ migrations, or analytics. Capturing sensor data for ML or analytics. Moving data\
  \ from bandwidth-constrained locations. |\n\n## Exam Tip\n\n理解这些选项至关重要。您可能会遇到需要关系型数据库而非非关系型数据库的场景，或需要选择适合结构化数据的选项。您还需要了解存储的限制；例如，假设您被告知需要评估一种提供\
  \ NoSQL 数据库并可扩展到 TB 级数据的服务。阅读本章后，您应该能够将此场景映射到某项服务。\n\n在下一节中，我们将讨论数据一致性。\n\n## Data\
  \ consistency\n\n数据一致性是指存储服务如何处理事务以及数据如何写入数据库。在阅读本章时，请确保您回顾每项服务的一致性，因为这是选择产品或服务时的主要设计因素之一。\n\
  \n我们还将借此机会解释 ACID。这是数据一致性的一个关键术语，我们将在本章中多次提及。\n\nACID 是以下属性的缩写：\n\n- **Atomicity**：事务涉及两条或多条信息时，所有信息都将被提交或全部不提交。例如，在进行银行转账时，资金的借记和贷记将被视为单个事务。如果借记或贷记任一失败，则两者都将失败。\n\
  - **Consistency**：如果出现上述失败，则所有数据将恢复到事务开始前的状态。\n- **Isolation**：银行转账将与其他事务隔离。在我们的示例中，这意味着在转账完成之前我们不会从银行扣款。\n\
  - **Durability**：即使发生故障，数据也将以正确状态可用。\n\n> **Exam Tip**\n> 您还应能够识别支持结构化数据、低延迟或水平扩展的存储服务。同样，您应能够识别提供强一致性或支持\
  \ ACID 属性的存储服务。\n\n现在，让我们更仔细地查看每项服务。我们将从 Cloud Storage 开始。\n\n## Understanding Cloud\
  \ Storage\n\nGoogle Cloud Storage 是在 Google Cloud 中存储对象的服务。它是完全托管的，并且可以动态扩展。对象是指任何格式的文件组成的不可变数据块。一些用例包括视频转码、视频流、静态网页和备份。它旨在提供安全且持久的存储，同时通过不同的存储类别为您的需求提供最佳价格和性能。\n\
  \nCloud Storage 使用存储桶的概念；如果您使用过 AWS S3 存储，您可能熟悉该术语。存储桶是您的数据所在的基本容器，并附加到 GCP 项目，如其他\
  \ GCP 服务一样。每个存储桶名称在全球范围内唯一，一旦创建，就无法更改。没有最小或最大存储大小限制，我们只为所用付费。我们可以通过多种方式控制对存储桶的访问。我们将在第\
  \ 15 章《安全与合规》中更详细地学习安全，但作为概述，我们有以下主要方法：\n\n- **Cloud Identity and Access Management\
  \ (IAM)**：我们将在第 15 章《安全与合规》中更详细地讨论 IAM。IAM 将授予对存储桶及其内部对象的访问权限。这为我们提供了一种集中管理权限的方式，而非对单个对象提供精细控制。IAM\
  \ 策略在整个 GCP 中使用，并且权限应用于存储桶中的所有对象。\n- **Access Control Lists (ACLs)**：ACL 仅由 Cloud\
  \ Storage 使用。这允许我们为单个对象授予读或写访问权限。不建议使用此方法，但有时可能需要。例如，您可能希望自定义存储桶内单个对象的访问权限。\n- **Signed\
  \ URLs**：这通过专用 URL 为存储桶内的对象提供有时限的读或写访问权限。任何收到此 URL 的人都可以访问该对象，直至 URL 生成时指定的时间。\n\
  \n我们还将在第 15 章《安全与合规》中提及加密。默认情况下，Cloud Storage 会在数据写入磁盘之前始终在服务器端对其进行加密。有三种服务器端加密选项可用：\n\
  \n- **Google-Managed Encryption Keys**：Cloud Storage 将代表客户管理加密密钥，无需进一步设置。\n- **Customer-Supplied\
  \ Encryption Keys (CSEK s)**：客户创建并管理其加密密钥。\n- **Customer-Managed Encryption Keys\
  \ (CMEKs)**：客户使用 GCP 的 **Key Management Service (KMS)** 生成并管理其加密密钥。\n\n还有 **client-side\
  \ encryption** 选项，其中加密在数据发送到 Cloud Storage 之前发生，并在服务器端进行额外加密。\n\n\n\n\n\n## 存储桶位置\n\
  \n存储桶位置允许我们指定存储数据的地点。以下是不同的位置类型：\n\n- **区域：** 这是一个特定位置，例如伦敦。\n- **双区域：** 双区域是一对区域，例如爱荷华州和南卡罗来纳州。双区域是地理冗余的，这意味着数据存储在至少两个独立的地理位置中，并且两者相距\
  \ 100 英里，以确保我们数据的最大可用性。地理冗余是异步发生的。\n- **多区域：** 多区域是一个大区域，例如欧盟，并且包含两个或多个地理位置。多区域也是地理冗余的。当然，将数据存储在多个位置会带来更高的成本。\n\
  \n存储桶位置是永久性的，因此在选择首选选项之前应进行一些考虑。数据应存储在对业务用户方便的位置。例如，如果您希望为同一区域的用户优化延迟和网络带宽，则基于区域的位置是理想的。但是，如果您对更高的可用性也有额外要求，则可以考虑双区域以利用这种地理冗余。\n\
  \n## 存储类别\n\n我们之前提到过存储类别，我们应该明确了解不同的产品对于在本次考试中取得成功至关重要。让我们更详细地了解一下：\n\n- **标准：**\
  \ 这是新存储桶的默认设置。没有最低存储要求，这是频繁访问数据和/或仅存储短时间数据的最佳选择。与多区域或双区域一起使用时，标准存储的可用性 SLA 为 99.95%。在单个区域中使用时，可用性\
  \ SLA 为 99.9%。Google 还发布了所谓的典型月度可用性，对于多区域和双区域而言，这为 > 99.99%，而对于区域而言，则为 99.99%。\n\
  - **近线：** 使用近线存储类别来存储每月读取或修改不超过一次的数据——例如备份数据。近线提供的 SLA 略低于标准，但这是为了换取更低的静态存储成本。与多区域或双区域一起使用时，近线存储的可用性\
  \ SLA 为 99.9%（典型月度可用性为 99.95%）。在单个区域中使用时，可用性 SLA 为 99.0%（典型月度可用性为 99.9%）。近线的每 GB\
  \ 成本非常低，但会产生检索成本。最短存储期限为 30 天。\n- **冷线：** 使用冷线存储类别来存储每季度访问不超过一次的数据；例如，用于灾难恢复。它是一种成本非常低且高度耐用的服务。与多区域或双区域一起使用时，冷线存储的可用性\
  \ SLA 为 99.9%（典型月度可用性为 99.95%）。在单个区域中使用时，可用性 SLA 为 99.0%（典型月度可用性为 99.9%）。该类别提供的每\
  \ GB 存储成本低于近线，但检索成本更高。最短存储期限为 90 天。\n- **归档：** 使用归档存储来长期保存一年内访问不超过一次的数据。这是可用的最低成本存储，并且与许多其他云存储供应商不同，数据将在毫秒级而不是小时或天内可用。最短存储期限为\
  \ 365 天。与多区域或双区域一起使用时，归档存储的典型月度可用性为 99.95%，SLA 为 99.9%。在单个区域中使用时，典型月度可用性为 99.9%，SLA\
  \ 为 99.0%。\n\n这些不同的类别在以下图表中进行了总结。请注意，SLA 和典型月度可用性可能会显示不同的百分比值：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_326_0.png)\n\
  \n图 11.2 – Cloud Storage 类别\n\n您可以编辑 Cloud Storage 存储桶以在这些存储类别之间移动。请注意，还有一些额外的存储类别无法使用\
  \ Cloud Console 设置：\n\n- **多区域存储：** 这相当于标准存储，但只能用于存储在多区域或双区域中的对象。\n- **区域存储：** 这相当于标准存储，但只能用于存储在区域中的对象。\n\
  - **耐久性降低的可用性存储 DRA：** 这可以与标准存储进行比较，但 DRA 存储的操作价格更高，性能更低，尤其是在可用性方面，其 SLA 为 99%。\n\
  \n存储桶在其创建时获得默认存储类别，其中的任何对象都将继承此类别，除非另有指定。我们可以更改存储桶的默认存储类别，但它仅适用于更改后的新对象；现有对象将保留在原始类别中。我们还可以使用\
  \ Cloud Storage Transfer Service 在存储桶之间有效地移动数据。但是，请注意，在不同位置之间移动数据会产生网络使用成本。此外，我们还应注意可能适用的额外费用。由于近线、冷线和归档存储用于存储不经常访问的数据，Google\
  \ 可能会收取检索或提前删除费用。当我们复制、读取或重写存储在这些存储类别中的数据或元数据时，将收取检索费用。\n\n## 数据一致性\n\nCloud Storage\
  \ 在某些情况下会提供强一致性和最终一致性。\n\n在以下情况下可以预期强一致性：\n\n- 将数据上传到 Cloud Storage 时，这意味着数据在写入或更新操作后将始终可供读取。\n\
  - 一旦我们成功删除数据，文件将立即不可用。\n\n在以下情况下可以预期最终一致性：\n\n- 当撤销对资源的访问时。撤销访问通常需要大约 1 分钟的时间，但在某些情况下，可能需要更长的时间。\n\
  \n## Cloud Storage FUSE\n\nCloud Storage 无法挂载到 Google Compute Engine 实例上。但是，如果您想探索这一点，GCP\
  \ 目前提供使用开源 FUSE 适配器的第三方集成，可让您将存储桶作为文件系统挂载到 Linux 上。这可免费使用且不受官方支持；但是，正常的 Cloud Storage\
  \ 费用适用。\n\n## 创建和使用存储桶\n\n现在我们对存储类别有了很好的了解，让我们看看如何创建存储桶。我们还将学习如何将文件复制到我们的存储桶中并更改对象的存储策略。\n\
  \n我们有两种创建存储桶的选项——通过控制台或使用 gsutil。我们将在第 16 章 Google Cloud 管理选项中更多地了解 gsutil，但就本章而言，您只需知道它是一个专用命令行工具，可向您的\
  \ Cloud Storage 服务发出 RESTful API 调用。让我们通过以下步骤了解如何从控制台创建存储桶：\n\n- 1. 从导航菜单浏览到 STORAGE。然后，选择\
  \ Cloud Storage | Browser：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_328_0.png)\n\
  \n图 11.3 – 导航到 Cloud Storage\n\n- 2. 点击 CREATE BUCKET，如以下屏幕截图所示：\n\nStore and retrieve\
  \ your data\nGet started by creating a bucket — a container where you can organize\
  \ and control access to your data and files in Cloud Storage.\nCREATE BUCKET\nTAKE\
  \ QUICKSTART\n\n图 11.4 – CREATE BUCKET\n\n- 3. 为存储桶命名。请记住，这必须是全局唯一的：\n\nCreate a\
  \ bucket\nName your bucket\nPick a globally unique, permanent name. Naming guidelines\n\
  cloudarchitect0001\nTip: Don't include any sensitive information\nCONTINUE\n\n图\
  \ 11.5 – 为存储桶命名\n\n- 4. 选择存储桶的位置：\n\nChoose where to store your data\nThis permanent\
  \ choice defines the geographic placement of your data and affects cost, performance,\
  \ and availability. Learn more\nLocation type\nMulti-region\nHighest availability\
  \ across largest area\nDual-region\nHigh availability and low latency across 2 regions\n\
  Region\nLowest latency within a single region\nLocation\nus (multiple regions in\
  \ United States)\n\n图 11.6 – 位置类型\n\n\n\n\n\n5. 选择适合您需求的存储类别。选择位置。您会注意到位置将是区域或地区，具体取决于您选择的是多区域还是区域。请记住，您的选择会影响成本：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_330_0.png)\n\n图 11.7 – 存储类别选项\n\n6. 选择\
  \ ACL 或 IAM 访问控制模型：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_330_1.png)\n\n图\
  \ 11.8 – 访问控制选项\n\n7. 我们还可以设置更高级的设置，这些设置将显示加密和保留策略。默认情况下，Google 将管理我们的密钥。还可以设置保留策略。这将提供对象在存储桶中受删除保护的最小持续时间：\n\
  \n## 选择如何保护对象数据\n\n您的数据始终通过 Cloud Storage 得到保护，但您也可以从以下附加数据保护选项中进行选择以防止数据丢失。请注意，对象版本控制和保留策略不能同时使用。\n\
  \n## 保护工具\n\n- 无\n- 对象版本控制（最适合数据恢复）\n  用于恢复已删除或覆盖的对象。为了最大限度地降低存储版本的成本，我们建议限制每个对象的非当前版本数量并安排在若干天后过期。了解更多\n\
  - 保留策略（最适合合规）\n  用于在对象上传后指定的最短时间内防止存储桶中的对象被删除或修改。了解更多\n\n## 数据加密？\n\n- Google 管理的加密密钥\n\
  \  无需配置\n- 客户管理的加密密钥（CMEK）\n  通过 Google Cloud Key Management Service 管理\n\n图 11.9\
  \ – 可选的高级设置\n\n8. 单击创建，我们就完成了。\n\n正如您所见，这是一个相当简单的过程。让我们通过使用我们专用的命令行工具 gsutil 来使其更简单，该工具我们可以通过\
  \ Cloud Shell 访问：\n\n- 1. 在 Cloud Shell 中，我们可以运行以下命令：\n\n```\ngsutil mb -c <storage\
  \ class> -l <location> gs://<bucket name>\n```\n\n让我们更详细地查看代码：\n\n- <storage class>\
  \ 是我们希望应用于存储桶的类别。\n- <location> 是我们想要创建存储桶所在的区域。\n- <bucket name> 是我们希望分配给存储桶的唯一名称。\n\
  \n2. 让我们在 us-east1 区域创建一个名为 cloudarchitect001 的新存储桶并应用区域存储类别：\n\n```\ngsutil mb\
  \ -c regional -l us-east1 gs://cloudarchitect001\n```\n\n3. 现在，我们有一个空的存储桶。让我们使用\
  \ gsutil 并使用以下语法将一些对象移动到我们的存储桶中：\n\n```\ngsutil cp <filename> gs://<bucketname>\n\
  ```\n\n这里，<filename> 是您希望复制的文件名，而 <bucketname> 是目标存储桶。\n\n4. 在此示例中，让我们将一个名为 conf.yaml\
  \ 的文件复制到我们新建的名为 cloudarchitect001 的存储桶中：\n\n```\ngsutil cp conf.yaml gs://cloudarchitect001\n\
  ```\n\n5. 让我们看看如何更改文件的存储类别。单个对象的存储类别只能使用 gsutil 放入存储桶中。我们应使用以下语法：\n\n```\ngsutil\
  \ rewrite -s <storage class> gs://<bucket name>/<file name>\n```\n\n6. 让我们更改我们的文件\
  \ conf.yaml，使其使用 Coldline 存储：\n\n```\ngsutil rewrite -s coldline gs://cloudarchitect001/conf.yaml\n\
  ```\n\n太好了！因此，我们现在知道如何管理我们的存储桶。在下一节中，我们将查看 Cloud Storage 的一些关键功能。\n\n## 版本控制和生命周期管理\n\
  \n现在，让我们看看版本控制和生命周期管理。这些是 Cloud Storage 提供的重要的功能，并且对考试尤其重要。\n\n> 考试提示\n> Cloud Storage\
  \ 提供了一系列功能。要在考试中取得成功，您必须了解 Cloud Storage 的版本控制和生命周期管理功能。与存储类别一样，您应该在继续阅读本章的后续部分之前复习这些内容并确保自己熟悉。\n\
  \n## 版本控制\n\n可以启用版本控制以检索我们已删除或覆盖的对象。请注意，在这一点上，这会增加存储成本，但如果您能够回滚到重要文件的先前版本，这可能是值得的。额外成本来自每次覆盖或删除对象的实时版本时创建的每个对象的归档版本。文件的归档版本将保留原始名称，但也会附加一个世代号以标识它。让我们逐步了解版本控制的过程：\n\
  \n- 1. 要启用版本控制，我们应使用 gsutil 命令：\n\n```\ngsutil versioning set on gs://<bucket name>\n\
  ```\n\n这里，<bucket name> 是我们想要启用版本控制的存储桶。\n\n让我们查看以下屏幕截图，显示了它的外观。在此示例中，我们正在为我们的 cloudarchitect\
  \ 存储桶启用版本控制，然后确认版本控制确实已启用：\n\n```\ngoogle3339831_student@cloudshell:~ (qwiklabs-gcp-e7f0f69cddalb280)$\
  \ gsutil versioning set on gs://cloudarchitect\nEnabling versioning for gs://cloudarchitect/...\n\
  google3339831_student@cloudshell:~ (qwiklabs-gcp-e7f0f69cddalb280)$ gsutil versioning\
  \ get gs://cloudarchitect\ngs://cloudarchitect: Enabled\n```\n\n图 11.10 – 设置版本控制\n\
  \n- 2. 现在，让我们将一个名为 vm.yaml 的文件复制到我们的存储桶中。我们可以使用 -v 开关对其进行版本控制：\n\n```\ngoogle3339831_student@cloudshell:~\
  \ (qwiklabs-gcp-e7f0f69cddalb280)$ gsutil cp -v vm.yaml gs://cloudarchitect\nCopying\
  \ file://vm.yaml [Content-Type=application/octet-stream]...\nCreated: gs://cloudarchitect/vm.yaml#1557763393469362\n\
  \nOperation completed over 1 objects/492.0 B.\n```\n\n图 11.11 – 复制文件\n\n- 3. 如果我们修改此文件，我们可以通过运行具有以下语法的命令来列出可用的版本：\n\
  \n```\ngsutil ls -a gs://<bucket name>/<filename>\n```\n\n让我们在位于我们的 cloudarchitect\
  \ 存储桶中的名为 vm.yaml 的文件上运行此命令。我们可以看到我们有几个归档版本可用：\n\n```\ngoogle3339831_student@cloudshell:~\
  \ (qwiklabs-gcp-e7f0f69cddalb280)$ gsutil ls -a gs://cloudarchitect/vm.yaml\ngs://cloudarchitect/vm.yaml#1557760768160333\n\
  gs://cloudarchitect/vm.yaml#1557763393469362\ngs://cloudarchitect/vm.yaml#1557763527069403\n\
  ```\n\n图 11.12 – 查看不同的版本\n\n我们可以随时打开和关闭版本控制。我们关闭它时，任何可用的归档版本仍会保留，但我们应该记住，在启用此选项之前我们不会有任何归档版本。\n\
  \n## 生命周期管理\n\n归档文件可能会迅速失控并不必要地影响我们的账单。为避免这种情况，我们可以利用生命周期管理策略。生命周期管理配置可以分配给存储桶。这些文件是一组规则，可以应用于存储桶中的当前或未来对象。当任何对象符合配置的准则时，Cloud\
  \ Storage 可以自动执行操作。\n\n使用生命周期管理策略最常见的用例之一是当我们希望在设定时间后降低对象的存储类别时。例如，可能存在一种情况，即数据在移至\
  \ Cloud Storage 后 30 天内需要频繁访问，之后每年仅访问一次。将此数据保留在区域或多区域存储中毫无意义，因此我们可以使用生命周期管理在 30\
  \ 天后将其移至 Coldline 存储。也许对象在 1 年后根本不需要，在这种情况下，我们可以使用策略删除这些对象。这有助于降低成本。让我们学习如何将策略应用于存储桶。\n\
  \n我们需要做的第一件事是创建生命周期配置文件。正如我们之前提到的，这些文件包含我们希望应用于存储桶的一组规则。如果策略包含多个规则，则对象必须匹配所有条件后才会采取操作。可能单个对象会受到多个操作的影响；在这种情况下，Cloud\
  \ Storage 将在重新评估任何额外操作之前仅执行其中一个操作。\n\n我们还应注意，Delete 操作将优先于 SetStorageClass 操作。此外，如果对象有两个规则应用于它以将对象移至\
  \ Nearline 或 Coldline，则如果两个规则使用相同的条件，对象将始终移至 Coldline 存储类别。配置文件可以用 JSON 或 XML 创建。\n\
  \n在以下示例中，我们将创建一个简单的 JSON 格式的配置文件，该文件将在 60 天后删除文件。我们还将在 30 天后删除归档文件。让我们将其保存为 lifecycle.json：\n\
  \n```\n{\n  \"lifecycle\": {\n    \"rule\": [{\n      \"action\": {\n        \"\
  type\": \"Delete\"\n```\n\n\n\n},\n\"condition\": {\n\"age\": 60,\n\"isLive\": true\n\
  }\n}, {\n\"action\": {\n\"type\": \"Delete\"\n},\n\"condition\": {\n\"age\": 30,\n\
  \"isLive\": false\n}\n}]\n}\n}\n\n> **考试提示**\n> 如果 `isLive` 的值为 true，则此生命周期条件将仅匹配处于活动状态的对象；但是，如果将值设置为\
  \ false，则生命周期条件将仅匹配已归档的对象。我们还应注意，非版本化存储桶中的对象被视为活动对象。\n\n我们还可以使用 gsutil 使用以下语法在存储桶上启用此策略：\n\
  \n```\ngsutil lifecycle set <lifecycle policy name> gs://<bucket name>\n```\n\n\
  这里，<lifecycle policy name> 是我们创建的包含策略的文件，而 <bucket name> 是我们要应用策略的唯一存储桶名称。以下代码显示了如何将我们的\
  \ lifecycle.json 文件应用到我们的 cloudarchitect 存储桶：\n\n```\ngsutil lifecycle set lifecycle.json\
  \ gs://cloudarchitect\n```\n\n我们之前提到过，生命周期的常见用例是在设定时间后将对象移至更便宜的存储类别。让我们看一个映射到常见场景的示例。假设我们\
  \ cloudarchitect 存储桶中有对象，我们希望在 90 天内频繁访问。之后，我们每月才需要访问一次数据。最后，在 180 天后，我们每年才访问一次数据。我们可以将这些需求转换为存储类别并创建以下策略，这将有助于将成本降至最低。\n\
  \n让我们稍微分解一下，因为我们现在有一个包含两条规则的策略，每条规则各有两个条件。任何年龄大于 90 天且应用了 REGIONAL 存储类别的存储对象都将被移至\
  \ NEARLINE 存储。任何年龄大于 180 天且应用了 NEARLINE 存储类别的对象都将被移至 ARCHIVE 存储：\n\n```\n{\n   \
  \ \"lifecycle\": {\n        \"rule\": [{\n            \"action\": {\n          \
  \      \"type\": \"SetStorageClass\",\n                \"storageClass\": \"NEARLINE\"\
  \n            },\n            \"condition\": {\n                \"age\": 90,\n \
  \               \"matchesStorageClass\": [\"REGIONAL\"]\n            }\n       \
  \ },\n        {\n            \"action\": {\n                \"type\": \"SetStorageClass\"\
  ,\n                \"storageClass\": \"ARCHIVE\"\n            },\n            \"\
  condition\": {\n                \"age\": 180,\n                \"matchesStorageClass\"\
  : [\"NEARLINE\"]\n            }\n        }\n    }\n}\n```\n\n> **考试提示**\n> 至少需要一个条件。如果输入了错误的操作或条件，则会收到\
  \ 400 错误请求错误响应。\n\n接下来，让我们了解一下保留策略和锁定。\n\n## 保留策略和锁定\n\n存储桶锁定允许我们为 Cloud Storage\
  \ 存储桶配置数据保留策略。这意味着我们可以管理存储桶中对象必须保留多长时间，并防止策略被减少或移除。\n\n我们可以通过运行以下命令创建保留策略：\n\n```\n\
  gsutil retention set 60s \"gs://<bucketname>\"\n```\n\n这将策略设置为 60 秒。我们也可以将其设置为 60d\
  \ 表示 60 天，1m 表示 1 个月，或 10y 表示 10 年。设置此策略的输出将类似于以下内容：\n\n```\nRetention Policy (UNLOCKED):\n\
  \    Duration: 60 Second(s)\n    Effective Time: Thu, 01 Jul 2021 05:49:05 GMT\n\
  ```\n\n请注意，如果存储桶没有保留策略，则我们可以随时删除或替换对象。但是，如果应用了策略，则存储桶中的对象只有在其年龄超过保留策略期限后才能被替换或删除。\n\
  \n> **考试提示**\n> 保留策略和对象版本控制是互斥的功能，这意味着对于给定的存储桶，同时只能启用其中一个。\n\n## 对象保留\n\n对象保留是可放置在单个对象上的元数据标志，这意味着它们无法被替换或删除。我们仍然可以编辑已被保留的对象元数据。\n\
  \n有两种类型的保留，并且对象可以应用一种、两种或都不应用。当对象存储在没有保留策略的存储桶中时，两种保留类型行为相同。但是，如果对存储桶应用了保留策略，则在释放保留时，保留对对象的影响不同：\n\
  \n- **基于事件的保留**：这会重置对象在存储桶中用于保留期的时间。\n- **临时保留**：这不会影响对象在存储桶中用于保留期的时间。\n\n让我们看一个示例以便更清楚一些。假设我们有两个对象——对象\
  \ A 和对象 B——我们将其添加到具有 1 个月保留期的存储桶中。我们对对象 A 应用 **基于事件的保留**，对对象 B 应用 **临时保留**。仅由于保留期，我们通常在\
  \ 1 个月后可以删除这两个对象。但是，由于我们对每个对象都应用了 **对象保留**，因此我们无法这样做。如果我们释放对象 A 上的保留，则由于 **基于事件的保留**，对象必须在存储桶中再保留\
  \ 1 个月后我们才能删除它。如果我们释放对象 B 上的保留，由于 **临时保留** 不会影响对象在存储桶中的时间，我们可以立即删除它。\n\n## 传输数据\n\
  \n在某些情况下，我们可能想要从本地或另一个基于云的存储将文件传输到存储桶，Google 提供了许多方法来执行此操作。我们应该牢记一些注意事项，以确保我们选择合适的选项。数据的大小和可用带宽将是决定因素。让我们快速看一下图表，以了解通过特定带宽传输某些设定数据大小需要多长时间：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_339_0.png)\n\n图 11.13 – 数据传输指导\n\n接下来，让我们看一些传输数据的方法。\n\
  \n## Cloud Storage 传输服务\n\nCloud Storage 传输服务为我们提供了将数据从在线源传输或备份到数据接收器的选项。假设，例如，我们想将数据从我们的\
  \ AWS S3 存储桶移动到我们的 Cloud Storage 存储桶。S3 将是我们的源，而目标 Cloud Storage 存储桶将是我们的接收器。我们还可以使用\
  \ Cloud Storage 传输服务将数据从 HTTP/HTTP(s) 源或甚至另一个 Cloud Storage 存储桶移动。为了使这些数据迁移或同步更容易，Cloud\
  \ Storage 传输服务提供了几个选项：\n\n- 我们可以安排一次性传输操作或定期操作。\n- 如果目标数据接收器中不存在源中的对应对象，我们可以删除目标数据接收器中已有的对象。\n\
  - 我们可以在传输后删除源对象。\n- 我们可以使用基于文件创建日期、文件名或您希望导入数据的时段的文件夹，在源和目标之间安排定期同步。\n\n> **考试提示**\n\
  > 您也可以使用 `gsutil` 在 Cloud Storage 和其他位置之间传输数据。您可以通过使用 `-m` 选项启用多线程复制来加快本地传输文件的速度。如果您计划上传较大的文件，`gsutil`\
  \ 将把这些文件拆分为几个较小的块并并行上传。\n> \n> 建议在从 Amazon S3 传输数据到 Cloud Storage 时使用 Cloud Storage\
  \ 传输服务。\n\n## Google 传输设备\n\n如果我们查看图 9.13，我们可以看到传输时间相当长。如果我们有 PB 级的存储需要传输，则应使用 Transfer\
  \ Appliance。这是一种硬件存储设备，可实现安全离线数据迁移。它可以在我们的数据中心设置，并且可机架安装。我们只需用数据填充它，然后将其运送到接收位置，Google\
  \ 将其上传到 Cloud Storage。\n\nGoogle 提供 40 TB 或 300 TB 传输设备的选项。以下内容摘自 https://cloud.google.com/transfer-appliance/docs/4.0/security-and-encryption：\n\
  \n> “上传您的数据后，我们会通过应用 NIST 800-88 标准来清除信息，对您退回的设备中的驱动器介质进行清理...”\n\nTransfer Appliance\
  \ 的常见用例是将大量现有备份从本地迁移到使用 Coldline 存储类别的更便宜的 Cloud Storage。通过网络执行此上传需要超过 1 周的时间。\n\
  \n现在，我们将了解一下 IAM。\n\n\n\n\n\n## 理解 IAM\n\n访问 Google Cloud Storage 由 IAM 保护。让我们来看一下以下预定义角色及其详情的列表：\n\
  \n- **Storage Object Creator**：有权创建对象，但不授予查看、删除或覆盖对象的权限\n- **Storage Object Viewer**：有权查看对象及其元数据，但无权访问\
  \ ACL，并有权列出存储桶中的对象\n- **Storage Object Admin**：对对象有完全控制权，可以创建、查看和删除对象\n- **Storage\
  \ Admin**：对存储桶和对象有完全控制权\n- **Storage HMAC Key Admin**：对项目中的 HMAC 密钥有完全控制权，只能应用于项目\n\
  \n## 配额和限制\n\nGoogle Cloud Storage 带有预定义的配额。这些默认配额可以通过 **Navigation** 菜单，在 **IAM\
  \ & Admin | Quotas** 部分进行更改。从此菜单中，我们可以查看当前配额并请求提高这些限制。我们建议您熟悉每个服务的限制，因为这会影响您的可扩展性。对于\
  \ Cloud Storage，我们应注意以下限制：\n\n- 单个对象最大大小限制为 5 TiB。\n- 对单个对象的更新限制为每秒一次。\n- 每个存储桶的初始写入限制为每秒\
  \ 1,000 次。\n- 每个存储桶的初始读取限制为每秒 5,000 次。\n- 每个对象的 ACL 条目限制为 100 条。\n- 存储桶创建操作的限制为每\
  \ 2 秒一次。\n- 存储桶删除操作的限制为每 2 秒一次。\n\n## 价格\n\nGoogle Cloud Storage 的价格基于四个组成部分：\n\n\
  - **数据存储**：适用于存储在 Cloud Storage 中的静态数据，按 GB/月计费，费用取决于存储的位置和类别。\n- **网络使用**：适用于从我们的存储桶读取对象数据或元数据，或在存储桶之间移动数据时。\n\
  - **操作使用**：适用于在 Cloud Storage 中执行更改存储桶及其对象或检索其信息的操作。费用取决于存储的类别。\n- **检索和提前删除费用**：适用于从\
  \ Nearline、Coldline 和 Archive 存储类别访问数据时。检索费用将在读取、复制或重写数据或元数据时适用。最小存储期限适用于存储在 Nearline、Coldline\
  \ 和 Archive 存储中的数据。即使文件在最短期限之前被删除，您仍会被收取对象的存储时长费用。\n\n## 理解 Cloud Firestore\n\n\
  在这一节开始时明智地注意，Google 已将其之前的 Cloud Datastore 产品重新命名为名为 **Cloud Firestore** 的新主要版本。然而，了解两者之间的关系也很重要，因为\
  \ Firestore 提供了 Native 模式和 Datastore 模式选项，后者使用传统的 Datastore 系统的行为与 Firestore 存储层，这消除了\
  \ Datastore 的一些限制。\n\nCloud Datastore 是一种 NoSQL 数据库，旨在简化应用程序开发。它使用分布式架构，具有高度可扩展性，并且由于它是无服务器的，我们无需担心底层基础设施。Cloud\
  \ Datastore 将我们的数据分布在多台机器上，并在广阔的地理区域上使用无主、同步复制。\n\nFirestore 在此基础上构建，还加速了移动、物联网和\
  \ Web 应用程序的开发。它提供内置的实时同步，以及离线模式，可提高实时应用程序开发的效率。这包括实时资产跟踪、实时分析、社交媒体资料和游戏排行榜等工作负载。\n\
  \nFirestore 还为我们的数据提供非常 **高可用性（HA）**。通过自动多区域复制和强一致性，它提供 99.999% 的保证。\n\n在我们进一步深入细节之前，我们不想假设您知道什么是\
  \ NoSQL 数据库。SQL 数据库在行业中对非数据库管理员来说更为人所知。SQL 数据库主要是一种关系型数据库，基于由若干行数据组成的表，这些数据具有预定义的模式。\n\
  \n将其与 NoSQL 数据库的概念进行比较，NoSQL 数据库是一种基于键值对的非关系型数据库，无需遵循任何模式定义。最终，这使我们能够高效扩展；因此，我们可以看到根据需要添加或删除资源变得容易得多。这种弹性使\
  \ Cloud Datastore 非常适合事务信息，例如实时库存、始终提供有效数据的 ACID 事务，或提供用户资料以根据过去的活动或偏好记录用户体验。然而，也需要注意的是，NoSQL\
  \ 数据库可能不适合每个场景，在选择数据库时应予以考虑，特别是关于查询数据的效率。好的；既然我们知道了什么是 NoSQL 数据库，让我们来看看构成 Datastore\
  \ 数据库的内容，因为数据对象之间的关系与其他您可能熟悉的数据库的处理方式不同。传统的 SQL 数据库由表、行和列组成。在 Cloud Datastore 中，实体相当于一行，种类相当于表。实体是可以具有一个或多个命名属性的数据对象。\n\
  \n每个实体都有一个标识它的键。让我们看一下下面的表格来比较 SQL 数据库和 Cloud Datastore 中使用的术语：\n\n| Concept | SQL\
  \ Database | Cloud Datastore |\n|---|---|---|\n| Category of object | Table | Kind\
  \ |\n| One object | Row | Entity |\n| Individual data for an object | Column | Property\
  \ |\n| Unique ID for an object | Primary Key | Key |\n\nFigure 11.14 – Terminology\
  \ comparison\n\n现在，让我们更详细地了解所提供的不同类型的模式。\n\n## Cloud Firestore 在 Datastore 模式或 Native\
  \ 模式下\n\n当我们创建新数据库时，必须选择其中一种模式。然而，我们不能在同一项目中使用混合模式。因此，建议您考虑您的设计以及应用程序的构建目的。\n\n\
  Native 模式提供重构产品的所有新功能。它结合了 Cloud Datastore 和 Firebase 实时数据库的优点。Firebase 最初是为需要实时跨客户端同步状态的移动应用程序而设计的。因此，Firestore\
  \ 利用了这一点并提供了一个新的强一致存储层，以及实时更新。此外，它还提供集合和文档数据模型以及移动和 Web 客户端库。Native 模式可以自动扩展到数百万个并发客户端。\n\
  \n> **Exam Tip**\n> 虽然 Firestore 与 Datastore 向后兼容，但新的数据模型、实时更新和移动及 Web 客户端库则不兼容。您必须使用\
  \ Native 模式才能访问这些功能。\n\nDatastore 模式支持 Datastore API，因此无需更改任何现有的 Datastore 应用程序。如果您的架构需要使用已建立的\
  \ Datastore 服务器架构，则 Datastore 模式允许这样做并移除了 Datastore 的一些限制，主要是 Datastore 模式提供强一致性，除非指定最终一致性。Datastore\
  \ 模式可以自动扩展到每秒数百万次写入。\n\n> **Exam Tip**\n> Firestore 在 Datastore 模式中的数据对象称为实体。\n\n\
  ## 升级到 Firestore\n\n需要 Datastore 数据库的新项目应使用 Firestore 在 Datastore 模式下。然而，从 2021\
  \ 年开始，现有的 Datastore 数据库将自动升级，无需更新应用程序代码。Google 将通知用户升级计划，该计划无需停机。\n\n## 创建和使用 Cloud\
  \ Datastore\n\n我们需要做的第一件事是在使用 Cloud Firestore 之前选择模式。让我们来看一下在 Datastore 模式下创建数据库并对我们创建的实体运行一些查询。在此之前，让我们提醒自己\
  \ Datastore 是一种托管服务。在我们进行此过程时，您会注意到我们直接创建实体，而无需先配置任何底层基础设施。您还应注意，与 GCP 的所有存储服务一样，Cloud\
  \ Datastore 在写入磁盘之前会自动加密所有数据。按照以下步骤创建 Firestore 在 Datastore 模式下：\n\n1. 从我们的 GCP\
  \ 控制台，浏览到 **DATABASES Firestore:**\n\n![](img/de2c97ab017f36b3750a5bade111edd7_344_0.png)\n\
  \n\n\n\n\n2. 我们现在需要选择一个操作模式。**Native mode** 是官方的 Firestore 模式，是 Cloud Datastore\
  \ 的下一个主要版本，并提供新功能，例如实时更新以及移动和网页客户端库。Datastore mode 使用传统的 Cloud Datastore 系统行为。在我们的示例中，我们将使用\
  \ **Datastore mode：**\n\n|  | Native mode | Datastore mode |\n|---|---|---|\n| \
  \ | 启用 Cloud Firestore 的所有功能，支持离线和实时同步。SELECT NATIVE MODE | 在 Cloud Firestore 强大的存储层之上利用\
  \ Cloud Datastore 的系统行为。SELECT DATASTORE MODE |\n| API | Firestore | Datastore |\n\
  | Scalability | 自动扩展到数百万并发客户端 | 自动扩展到每秒数百万次写入 |\n| App engine support | 不支持 App\
  \ Engine 标准 Python 2.7 和 PHP 5.5 运行时 | 所有运行时 |\n| Max writes per second | 10,000\
  \ | 无限制 |\n| Real-time updates | ✓ | ✕ |\n| Mobile/web client libraries with offline\
  \ data persistence | ✓ | ✕ |\n| Query consistency | 强一致性 | 强一致性 |\n| Data model\
  \ | Documents / collections | Entities / kinds |\n| Web console | Google Cloud Platform\
  \ 和 Firebase 中的 Firestore 页面 | Google Cloud Platform 中的 Datastore 页面 |\n\nFigure\
  \ 11.16 – Choosing Datastore mode\n\n3. 选择 Datastore 数据库的位置并点击 CREATE DATABASE：\n\
  \nChoose carefully: your location selection is permanent and will also apply to\
  \ this project's App Engine app\n\nFigure 11.17 – Selecting a location\n\n4. 数据库准备就绪后，我们将被引导至\
  \ Entities 菜单。点击 CREATE ENTITY 来创建我们的第一个 Datastore 实体：\n\nFigure 11.18 – Creating\
  \ an entity\n\n我们现在可以为实体指定一个命名空间、一个 Kind（在 SQL 术语中即表）以及一个键标识符，后者将自动生成。让我们将命名空间保持为默认值并创建一个名为\
  \ exam 的新 kind：\n\nFigure 11.19 – Create an entity\n\n5. 点击 **ADD PROPERTY** 指定名称——在本例中为\
  \ `title`。我们还可以从多种类型中选择，但在本示例中，我们希望使用 **String**。最后，我们将为其赋值为 `Professional Cloud\
  \ Architect`。点击 **DONE** 添加该属性：\n\n# Properties\n\n![](img/de2c97ab017f36b3750a5bade111edd7_347_0.png)\n\
  \nFigure 11.20 – Adding entity properties\n\n6. 我们可以重复 *Step 5* 来添加另一个属性。这次，我们将使用\
  \ `cost` 作为名称，**Integer** 作为类型，`200` 作为值。当我们在实体中添加完所有想要的属性后，点击 **CREATE**。让我们再创建两个具有\
  \ exam kind 的新实体，分别用于 `Associate Cloud Engineer` 考试和 `Professional Cloud Developer`\
  \ 考试：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_347_1.png)\n\nFigure 11.21 – Creating\
  \ an entity\n\n7. 现在，我们可以根据 cost 或 title 过滤实体查询。让我们查找有关 Professional Cloud Developer\
  \ 考试的信息：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_348_0.png)\n\nFigure 11.22\
  \ – Filter entities\n\n8. 我们也可以使用 QUERY BY GQL 并输入类似 SQL 的查询来获得相同的结果：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_348_1.png)\n\
  \n```\nSELECT * from exam where Title = 'Professional Cloud Developer'\n```\n\n\
  Figure 11.23 – Executing the query\n\n至此，我们已经了解了创建 Datastore 数据库以及查询所创建实体的便捷性。现在，让我们继续并查看\
  \ Datastore 与 Firestore 之间的一些差异。\n\n## Summary of Datastore mode versus Native mode\n\
  \nCloud Firestore 在 Native mode 中是完整重品牌的产品。它融合了 Cloud Datastore 和 Firebase 实时数据库的优点，提供与\
  \ Datastore 相同的概念性 NoSQL 数据库，但由于 Firebase 是为低延迟移动应用而构建的，因此还包括以下新功能：\n\n- 一个新的强一致性存储层\n\
  - 一个集合和文档数据模型\n- 实时更新\n- 移动和网页客户端库\n\nCloud Firestore 在 Datastore mode 中使用相同的 Datastore\
  \ 系统行为，但将访问 Firestore 存储层，这将消除一些限制，例如以下内容：\n\n- 不再局限于最终一致性，因为所有查询都变为强一致性\n- 不再局限于\
  \ 25 个实体组限制\n- 不再局限于每个实体组每秒 1 次写入\n\n## IAM\n\n对 Google Cloud Datastore 的访问通过 IAM\
  \ 保护。让我们查看预定义角色的列表及其详情：\n\n- **Datastore owner with an AppEngine app admin**: 拥有对\
  \ Datastore mode 的完全访问权限\n- **Datastore owner without an AppEngine app admin**:\
  \ 拥有对 Datastore mode 的访问权限，但无法启用管理员访问、检查 Datastore mode 管理员是否已启用、禁用 Datastore mode\
  \ 写入或检查 Datastore mode 写入是否已禁用\n- **Datastore user**: 拥有对 Datastore mode 数据库中数据的读写访问权限。主要用于开发人员或服务账号\n\
  - **Datastore viewer**: 拥有读取所有 Datastore mode 资源 的权限\n- **Datastore import-export\
  \ admin**: 拥有管理导入和导出的完全访问权限\n- **Datastore index admin**: 拥有管理索引定义的完全访问权限\n\n##\
  \ Quotas and limits\n\nGoogle Cloud Datastore 带有预定义的配额。这些默认配额可以通过进入 **Navigation**\
  \ 菜单，在 **IAM & Admin | Quotas** 部分进行更改。从此菜单中，我们可以查看当前配额并请求提高这些限制。我们建议您熟悉每个服务的限制，因为这会影响您的可扩展性。Cloud\
  \ Firestore 提供免费配额，让我们零成本开始：\n\n- 存储数据的限制为 1 GiB。\n- 每日读取限制为 50,000 次。\n- 每日写入限制为\
  \ 20,000 次。\n- 每日删除限制为 20,000 次。\n- 每月网络出站限制为 10 GiB。\n\n免费层级下有以下标准限制：\n\n- 子集合的最大深度为\
  \ 100。\n- 文档的最大大小为 6 KiB。\n- 文档的最大大小为 1 MiB。\n- 每个数据库每秒最大写入次数为 10,000。\n- 最大 API\
  \ 请求大小为 10 MiB。\n- 最多可将 500 次写入传递给一次提交操作或在一次事务中执行。\n- 单个文档 Commit 操作或事务中最多可执行 500\
  \ 个字段转换。\n\n## Pricing\n\nGoogle Cloud Firestore 的定价提供免费配额供我们开始使用，如前所述。\n\n如果超出这些限制，将会产生费用，具体取决于数据所在位置而波动。一般定价按每\
  \ 100,00 文档的读取、写入和删除计费。存储数据按每 GB 每月计费。\n\n## Understanding Cloud SQL\n\n从名称上看，Cloud\
  \ SQL 是一个数据库服务，可轻松设置、维护和管理您在 Google Cloud 上的关系型 PostgreSQL、MySQL 或 SQL Server 数据库。\n\
  \n尽管我们正在配置底层实例，但它是一个完全托管的服务，能够处理多达 64 TB 的存储。Cloud SQL 数据库是关系型的，这意味着它们组织成表、行和列。作为替代方案，我们可以将\
  \ SQL Server 应用程序镜像安装到 Compute Engine 实例上，但 Cloud SQL 提供了许多由 Google 完全托管带来的好处——例如，可扩展性、修补和更新会自动应用，提供自动备份，并且开箱即用提供\
  \ HA。再次强调，虽然这些好处看起来很棒，但我们也应注意存在一些不支持的功能，并在承诺使用 Cloud SQL 之前加以考虑。\n\n> **Exam Tip**\n\
  > Cloud SQL 可容纳多达 64 TB 的存储。如果您需要处理更大量的数据，则应考虑替代服务，例如 Cloud Spanner。\n\n现在，让我们查看\
  \ Cloud SQL 提供的一些功能。\n\n\n\n\n\nCloud SQL for MySQL 为我们提供以下功能：\n\n- MySQL 目前提供对\
  \ MySQL 5.6、5.7 和 8.0 的支持，并且在选择高内存实例类型时，最多可提供 624 GB 的 RAM 和 64 TB 的存储。\n- 多个区域之间存在数据复制，并具有自动故障转移。\n\
  - 完全托管的 MySQL Community Edition 数据库可在云中使用。\n- 具有时间点恢复和按需备份。\n- 支持实例克隆。\n- 它提供与 GCP\
  \ 的监控和日志解决方案的集成 – Cloud Operations。\n\nCloud SQL for PostgreSQL 为我们提供以下功能：\n\n-\
  \ 云中完全托管的 PostgreSQL 数据库，存储量最高可达 64 TB，具体取决于实例是具有专用还是共享 vCPU\n- 自定义机器类型，最高可达 624\
  \ GB RAM 和 96 个 CPU\n- 多个区域之间的数据复制，具有自动故障转移\n- 实例克隆\n- 按需备份\n- 与 GCP 的监控和日志解决方案集成\
  \ – Cloud Operations 日志和监控\n\nCloud SQL for SQL Server 为我们提供以下功能：\n\n- 云中完全托管的 SQL\
  \ Server 数据库。\n- 自定义机器类型，最高可达 624 GB RAM 和 96 个 CPU。\n- 最多 64 TB 的存储。\n- 在 Google\
  \ 内部网络中对自定义数据进行加密，包括数据库表、临时文件和备份。\n- 数据库可以使用 BAK 和 SQL 文件导入。\n- 实例克隆。\n- 与 Cloud\
  \ Operations 日志和监控集成。\n- 跨多个区域的数据复制。\n- 通过区域持久磁盘实现高可用性。\n\n现在我们知道了主要功能，让我们来看一下在创建新实例时需要注意的一些事项：\n\
  \n- **选择实例**：与其它 GCP 服务类似，我们可以选择实例的位置。将数据库实例放置在依赖它的服务附近是有意义的。我们应该了解数据库需求，并对活动连接、内存和\
  \ CPU 使用率有一个基线，以便让我们选择正确的机器类型。如果过度配置，这将影响我们的成本，同样，如果配置不足，我们可能会影响性能或可用性，如果资源耗尽。\n\
  - **选择区域**：我们可以选择实例部署到的区域。请注意，区域在部署后无法更改，但区域可以随时更改。为了实现高可用性，我们可以选择多个区域，这提供了在所选区域内自动故障转移到另一个区域。从性能角度来看，我们应该将实例部署在靠近使用它们的服务附近。我们将在本章后面更详细地讨论高可用性。\n\
  - **选择存储**：创建实例时，我们可以选择不同的存储层。根据我们的需求，我们可能希望选择 SSD 以获得更低的延迟和更高的吞吐量；然而，如果我们不需要如此高性能的磁盘，也可以选择\
  \ HDD。\n- **选择加密**：创建实例时，我们可以选择让 Google 管理我们的加密密钥，这是默认设置，也可以选择客户管理的密钥，该密钥通过 Google\
  \ KMS 服务进行管理。\n\n选择正确的容量以适应数据库大小也非常重要，因为一旦创建实例，就无法减小容量。如果我们过度配置存储，则需要为未使用的空间付费。如果我们配置不足的存储，则可能导致可用性问题。避免这种情况的一种方法是启用自动存储增加设置。如果启用，则每\
  \ 30 秒检查一次存储，以确保存储未低于设定的阈值大小。如果低于阈值，则会自动向实例添加额外存储。阈值大小取决于实例当前配置的存储量，并且不能大于 25 GB。这听起来很棒，但我们也应注意，如果需求出现峰值，则会造成存储成本永久增加。我们还应注意，将存储容量创建或增加到\
  \ 30 TB 或更大可能会导致备份等操作的延迟增加：\n\n- **选择 IP 地址：** 我们可以选择公共或私有 IP 地址。默认情况下使用公共 IP 地址，这将阻止所有\
  \ IP 地址。因此，我们必须添加特定的 IP 地址或范围才能打开实例。如果要使用私有 IP 地址，我们必须启用 Google 的 Service Networking\
  \ API。这对每个项目都是必需的。如果我们希望使用私有 IP 地址，我们需要确保在实例所在的 Google 服务 VPC 网络与我们的 VPC 网络之间设置了\
  \ VPC 对等连接。这在以下图表中显示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_354_0.png)\n\n\
  图 11.24 – VPC 对等连接（来源：https://cloud.google.com/sql/docs/postgres/private-ip. 许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\
  \n我们在第 10 章《GCP 中的网络选项》中更详细地讨论了 VPC 对等连接。使用私有 IP 将有助于降低网络延迟并提高安全性，因为流量永远不会暴露到互联网；然而，我们还应注意，要从其他\
  \ GCP 资源通过私有 IP 地址访问 Cloud SQL 实例，该资源必须位于同一区域。\n\n> **重要说明**\n> 如果您希望从在 Google 容器服务中运行的应用程序访问\
  \ Cloud SQL 实例，即 Google Kubernetes Engine，建议您使用私有 IP 地址。\n\n- **自动备份**：启用自动备份会对性能产生轻微影响；然而，我们应该愿意接受这一点以利用只读副本、克隆或时间点恢复等功能。我们可以选择备份的位置。但是，默认情况下，备份存储在最近的多区域位置，因此除非基于独特的架构决策，否则不应自定义。此外，我们可以选择存储多少个自动备份。这默认为\
  \ 7，并且除非有特定原因需要更改，否则不建议修改它。另外，请注意，如果选择了多个区域，则默认启用自动备份且无法禁用。\n- **维护窗口**：使用此服务时，我们还应指定维护窗口。我们可以选择一天中的特定日期和\
  \ 1 小时的时间段来应用更新。GCP 不会在此指定窗口内对该实例启动任何更新。请注意，如果未指定窗口，则可能在任何时间发生潜在中断的更新。\n\n## 数据一致性\n\
  \nCloud SQL 是一种关系数据库，提供强一致性和对 ACID 事务的支持。\n\n## 创建和管理 Cloud SQL\n\n现在我们对概念有了了解，让我们来看一下如何创建新的\

  \n\n\n```\ngoogle3539162_student@cloudshell:~ (qwiklabs-gcp-979d5d649f59493b)$ kubectl\
  \ get pods\nNAME                                 READY   STATUS    RESTARTS   AGE\n\
  nginx-deployment-5c689d88bb-2d7pq   1/1     Running   0          2m33s\nnginx-deployment-5c689d88bb-srtn8\

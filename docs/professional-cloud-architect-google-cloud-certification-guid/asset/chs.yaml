  \ Workloads 菜单。我们会看到 nginx-deployment 存在。点击 Name 查看其详细信息，如以下截图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_199_0.png)\n\
  \nFigure 6.38 – Workloads\n\n5. 点击 Name 列中的 nginx-deployment 链接以进入详细视图。在详细视图顶部，我们会被询问是否要公开服务。点击\
  \ Expose 按钮，如以下截图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_199_1.png)\n\n\
  Figure 6.39 – Exposing a Deployment\n\n6. 现在，我们可以选择一个 **Port** 和一个 **Target port**、一个\
  \ **Protocol**，以及最重要的 Service 类型。我们将选择一个 **Load balancer**。如果点击 **View YAML**，你会看到服务的定义。你可以复制它并使用\
  \ `kubectl` 从 shell 部署它。相反，我们将点击 **Expose** 按钮来看看如何在 GUI 中完成此操作：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_200_0.png)\n\
  \nFigure 6.40 – Service settings\n\n7. 部署服务需要几秒钟时间。部署完成后，它将在 **Kubernetes Engine**\
  \ 菜单下的 **Services** 中可见。找到 `nginx-deployment-services` 服务并点击其名称以查看以下详细信息。找到 **Load\
  \ balancer IP** 值并复制它：\n\n| Cluster | high-cpu-cluster-1 |\n| Namespace | default\
  \ |\n| Labels | app : nginx |\n| Stackdriver logs | Deployment: nginx-deployment\

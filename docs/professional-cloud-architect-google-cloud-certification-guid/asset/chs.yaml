  \ API 端点的访问。\n\n使用云原生解决方案进行密钥和机密管理，并针对基于身份的访问进行优化。\n\n改进和标准化应用程序和网络监控与故障排除所需的工具。\"\
  \n\n## Executive statement:\n\"我们的竞争优势一直是我们对客户的关注，我们能够提供卓越的客户服务并最大限度地减少车辆停机时间。在将多个系统迁移到\
  \ Google Cloud 之后，我们正在寻求提供一流的在线车队管理服务给客户并改善经销店运营的新方法。我们的 5 年战略计划是通过实现对我们数据的访问、提高车辆的自主操作能力以及创建将剩余遗留系统迁移到云的路径，来创建一个新的产品合作伙伴生态系统。\"\
  \n\nSource: https://services.google.com/fh/files/blogs/master_case_study_terramearth.pdf.\n\
  \nLicense: https://creativecommons.org/licenses/by/4.0/legalcode.\n\n\n\n\n\n# 分析\n\
  \n我们首先应该意识到的第一件事是，我们正在看一家公司，其中遥测数据特别重要。我们需要从庞大的车队自动收集地理位置和其他传感器数据，这意味着我们希望从这些数据中提取意义，使其对业务产生价值。我们可以通过使用管道来处理遥测数据。我们还需要查看每个处理阶段可以使用哪些产品。让我们开始吧：\n\
  \n- **数据输入：** 我们应该考虑 **Pub/Sub**、**BigQuery**、**Cloud Storage** 导入或流式传输，以及 **Cloud\
  \ Logging**。Pub/Sub 是此场景的绝佳选择，因为它在一个全球服务中提供实时且可靠的消息传递。\n- **处理：** 我们在这里应该考虑 **Dataflow**\
  \ 和 **Pub/Sub**。此阶段是我们将数据转换为适合存储的格式。传入数据可以以两种模式处理——流式或批处理。就映射到我们的解决方案概念而言，这可以针对我们的关键数据实时进行；其余传感器数据可以每天上传。Dataflow\
  \ 可以处理流式数据和批处理数据。\n- **存储：** 我们应该考虑 **Cloud Storage**、**BigQuery** 或 **Bigtable**。在这里，我们将存储长期数据。\n\
  - **可视化和分析：** 我们应该考虑 **BigQuery** 和 **Cloud SQL**。\n\n还有哪些关键点值得注意，哪些服务是合适的？API 在场景中被提及了几次——供开发人员创建自定义\
  \ API 服务以及为内部和合作伙伴开发人员提供自助服务门户。我们的想法可能会想到 **Cloud Endpoints** 或 **Apigee**，以及哪项服务更适合这些需求。在此场景中，Apigee\
  \ 可能是一个更合适的解决方案。虽然 Cloud Endpoints 门户允许我们创建一个开发人员门户，可以生成可与我们的 API 交互的网页，但此服务仅适用于\
  \ GCP。需求指出我们还应支持合作伙伴开发人员。Apigee 文档告诉我们，“开发人员门户是您 API 计划的门面，为内部、合作伙伴和第三方开发人员提供所需的一切。”\n\
  \n安全当然是我们公司的关键关注点。他们还在需求中明确表示希望“使用云原生解决方案进行密钥和机密管理，并优化基于身份的访问。”我们知道 Cloud **Key\
  \ Management Service (KMS)** 可以支持需要特定密钥管理程序的一系列合规性要求。这是以可扩展且云原生的方式完成的。对于基于身份的访问，我们应该考虑\
  \ **Cloud Identity。**\n\n最后，需求中提到了预测。我们应该考虑 ML 服务来满足这些需求。\n\n# 直升机竞速联赛\n\n我们现在将查看直升机竞速联赛案例研究。同样，我们将回顾在线文档中可以找到的内容。在案例研究结束时，我们将提供分析。我们希望您在阅读时写下让您注意到的服务，并将您的发现与我们的分析进行比较。\n\
  \n## 公司概述：\n\n> “直升机竞速联赛（HRL）是一个全球性的直升机竞速体育联赛。HRL 每年举办世界锦标赛和多个地区联赛比赛，参赛队伍竞争以获得世界锦标赛的席位。HRL\
  \ 提供付费服务，在全球范围内直播比赛，并提供每场比赛的实时遥测和预测。”\n\n## 解决方案概念：\n\n> “HRL 希望将其现有服务迁移到新平台，以扩大其对托管\

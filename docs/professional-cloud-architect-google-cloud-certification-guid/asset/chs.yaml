  \ etcd 数据库中的密钥\n- **Workload Identity**：允许你通过将 Kubernetes 服务账号映射到 Google 服务账号来安全地使用工作负载访问\
  \ Google API\n- **Google Groups for RBAC**：将 Google 群组映射到集群中的角色和集群角色\n\n这里还有一些遗留的安全选项，除非你有特殊用例并且对安全权衡有信心，否则不应使用。\n\

  \ Professional\n\n向云迁移并不是新鲜事，多年来，公司一直利用公共云厂商的经济高效解决方案，摆脱传统的本地架构。如今技术发展速度之快，使得管理自身基础设施的公司越来越难以充分发挥其\
  \ IT 系统的效能。\n\n虽然 Amazon Web Services (AWS) 和 Microsoft Azure 目前在企业级公司中领先，Google\
  \ Cloud Platform (GCP) 是 IT 专业人士中最受欢迎的解决方案之一，且对其的兴趣稳步增长。似乎 Google 在打一场很长的仗。2018\
  \ 年第三季度，Google Cloud 前 CEO Diane Greene 估计只有 10% 的工作负载在公共云中，显示出市场份额仍有巨大的空间。\n\n\
  鉴于公司持续转向多云解决方案以分发其工作负载或对数据存储的位置和方式有更多控制权，这意味着 IT 云架构师和工程师需要了解的不只是目前的前两大提供商。\n\n\
  此外，2020 年的全球大流行加速了云采用，因为公司转向居家办公，协作工具如 Google Meet 在公司中变得至关重要，以维持稳定。它也凸显出，传统 IT\
  \ 模式因在需要时无法及时扩展而对企业构成重大风险，例如。\n\n> **重要提示**\n> 一篇 Forbes 文章最近显示，**Google Cloud Certified\
  \ Professional Cloud Architect** 是 2019 年和 2020 年的最高薪认证。你可以在 https://www.forbes.com/sites/louiscolumbus/2020/02/10/15-top-paying-it-certifications-in-2020/?sh=390a9e48358e\
  \ 上阅读它。\n\n无论你参加考试的原因是什么，保持对期望的现实都很重要。\n\n### Registering for the exam\n\n**GCP\

  \ 5:55 左右开始增加，但在下午 6 点左右又下降了：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_117_0.png)\n\
  \nFigure 4.42 – Monitoring load\n\n鉴于队列深度出现峰值，我们可以预期 **autoscaling policy** 会生成一个新实例。如果我们检查自动扩缩器日志，可以确认这一点。它随后添加了第三个实例，然后在需求再次下降时减少回两个实例：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_117_1.png)\n\nFigure 4.43 – Adding and\
  \ removing instances\n\n这就是真正的弹性计算！这些是自动扩缩工作原理的小例子，我们建议你确保能够创建自己的策略并复制任何导致机器实例增加和减少的负载。\n\
  \n**Important Note**\n每个托管实例组只能创建一个自动扩缩器。\n\n## Autohealing\n\nAutohealing 也是托管实例组设置的一部分，但值得单独一个章节来进一步讨论。GCP\
  \ 的托管实例组负责验证我们组中每个 VM 实例是否正在运行并准备好接受客户端请求。为了执行此验证，它需要一个健康检查，这基本上是一个探针，用于联系实例组中的每个成员以检查其当前健康状况。策略可以基于某些协议，即\
  \ HTTP(S)、TCP 或 SSL。\n\n我们还需要配置标准来告知健康检查多久检查一次实例、可以接受无响应的时间以及对其探针的连续失败次数。这些设置定义了\
  \ VM 何时会被归类为不健康。如果特定实例不再健康，自动扩缩器将添加一个新实例：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_118_0.png)\n\
  \nFigure 4.44 – Autohealing configuration\n\n在健康检查中，我们还必须指定健康阈值。此数值用于确定在将不健康实例标记为健康并将流量导向它之前，必须返回多少次连续成功的检查。\n\
  \n然后我们可以将此健康检查作为自动修复策略应用于我们的实例组。以下屏幕截图显示了本例中选择的健康检查：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_119_0.png)\n\
  \nFigure 4.45 – Autohealing information\n\n自动修复策略还可以提高应用程序的可用性。在下一节中，我们将查看 Compute\
  \ Engine 上的容器。\n\n## Containers on Compute Engine\n\n作为运行 GKE 的替代方案，GCP 提供了在 Compute\
  \ Engine 上运行容器的能力。容器将在第 6 章《Managing Kubernetes Clusters with Google Kubernetes\
  \ Engine》中更详细地介绍；不过，重要的是要注意，容器可以在 Linux 和 Windows 服务器 VM 实例或 Compute Engine 内部提供的容器优化操作系统上运行。Docker\
  \ 和 Podman 是两种常见的容器技术，可让我们运行容器化应用程序。\n\n我们应注意，Container-Optimized OS 确实存在一些限制：\n\
  \n- 它不包含包管理器，因此我们不能直接在实例上安装软件包。\n- 它不支持执行非容器化应用程序。\n- 内核被锁定。\n- 它在 GCP 环境之外不受支持。\n\
  \n## Running a simple Windows container on Compute Engine\n\n假设我们有一台正在运行的 Windows\
  \ VM，并使用 *Windows Server 2019 DC core for containers* 镜像。我们可以像在 *Deploying our first\
  \ GCE instance* 部分中所做的那样开始 RDP 到它。由于容器运行的是 Windows 的核心版本，因此它运行的是具有最小 UI 的操作系统。我们能看到的只有命令提示符窗口。\n\
  \n如果我们运行 `docker images` 命令，我们可以看到默认安装了哪些镜像：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_120_0.png)\n\
  \n让我们创建一个新镜像并运行它：\n\n- 1. 运行 `mkdir my-new-container` 命令。\n- 2. 运行 `cd my-new-container`\
  \ 命令。\n- 3. 运行 `mkdir content` 命令。\n- 4. 运行 `notepad content\\index.html` 命令。\n\
  - 5. 输入以下文本以创建一个简单的 **Internet Information Services (IIS)** 服务器：\n\n```\n<html>\n\
  \    <head>\n        <title>Windows containers</title>\n    </head>\n    <body>\n\
  \        <p>This is my test windows container!</p>\n    </body>\n</html>\n```\n\n\
  - 6. 使用记事本创建一个名为 Dockerfile 的文件。\n\n\n\n\n7. 输入以下文本以创建 Dockerfile 的内容：\n\n```\n\
  FROM mcr.microsoft.com/windows/servercore/iis:windowservercore-ltsc2019\nRUN powershell\
  \ -NoProfile -Command Remove-Item -Recurse C:\\inetpub\\wwwroot\\*\nWORKDIR /inetpub/wwwroot\n\
  COPY content/ .\n```\n\n8. 让我们通过运行以下命令来构建 Docker 镜像并将其存储在 Google Container Registry\
  \ 中（请注意命令末尾的 .）：\n`docker build -t gcr.io/my-project-id/iis-site-windows ...`\n\n\
  9. 当输出返回类似 `Successfully tagged gcr.io/my-project-id/iis-site-windows:latest.` 的内容时，您将看到构建已成功完成。\n\
  \n10. 如果您重新运行 Docker 镜像，您现在将看到新创建的镜像可用。\n\n11. 让我们现在使用 `docker run -d -p 80:80 gcr.io/my-project-id/iis-site-windows`\
  \ 命令运行一个 Windows 容器。\n\n12. 最后，让我们浏览 VM 实例的外部 IP。\n\n![](img/de2c97ab017f36b3750a5bade111edd7_121_0.png)\n\
  \n图 4.47 – Docker 上的 Web 服务器\n\n13. 我们可以从前面的图像中看到，我们已成功运行了一个在 Windows 容器上运行的非常简单的\
  \ Web 服务器。\n\nTip\n需要注意的是，在较早版本的 Windows 上构建的容器在具有较新版本 Windows 的 Compute Engine\
  \ 实例中无法工作。\n\n# 快速了解 Google Cloud VMware Engine\n\nGoogle Cloud VMware Engine 于\
  \ 2020 年 5 月宣布推出，这是一项完全托管的服务，允许我们在 Google Cloud 中运行 VMware 平台。Google 将管理基础设施、网络和管理服务，以便您可以高效、安全地使用\
  \ VMware 平台。简而言之，这是一种 VMware 即服务，可在大约 30 分钟内部署。它使用 VMware Cloud Foundation 在专用的\
  \ Google 裸机服务器上运行，并且可以与 Google 的大数据和 ML 服务集成。\n\n该服务基于部署了 VMware 服务的超融合节点进行销售。ESXi、vSAN\
  \ 和 NSX-T 位于裸机服务器之上，而 vCenter、NSX Manager 和 HCX 也已安装以实现部署、监控、修补和升级的自动化。Google 负责所有这些工作，而客户将保留对任何虚拟机以及\
  \ VMware 管理工具和服务的责任，例如 vRealize 套件。许可也完全集成到服务中；因此，消费者无需担心与每插槽核心相关的任何 VMware 许可问题。\n\
  \n> Tip\n> Professional Cloud Architect 考试不会深入 Google Cloud VMware Engine 服务；但是，您应该知道该服务的存在，因为对于希望使用迁移和提升方法快速迁移到\
  \ Google Cloud 的公司来说，这可能是一个里程碑。\n\n## 用例\n\nGoogle Cloud VMware Engine 有许多用例，例如数据中心扩展或迁移，以允许公司在保持现有工作负载兼容性的同时扩展到公共云。灾难恢复也是该服务的另一个巨大优势，因为公司可以利用\
  \ Google 的全球基础设施来提高可用性。HCX 用于迁移和灾难恢复。本地数据中心与 Google Cloud 之间专用互连链路的存在允许在两个端点之间轻松迁移虚拟机和服务。Google\
  \ 正在努力将其作为进入云的最快、最简单的方式进行销售。对于一些不想因迁移到云以实现目标而感到被迫重新培训员工或重构应用程序以保持运营连续性的公司来说，这可能是一件重要的事情。\n\
  \n需要注意的一件重要事情是，基于角色的访问控制（RBAC）和计费都归属于您的 Google 账户下。所有内容都在一个[content]\n7. 输入以下文本以创建\
  \ Dockerfile 的内容：\n\n```\nFROM mcr.microsoft.com/windows/servercore/iis:windowservercore-ltsc2019\n\
  RUN powershell -NoProfile -Command Remove-Item -Recurse C:\\inetpub\\wwwroot\\*\n\
  WORKDIR /inetpub/wwwroot\nCOPY content/ .\n```\n\n8. 让我们通过运行以下命令来构建 Docker 镜像并将其存储在\
  \ Google Container Registry 中（请注意命令末尾的 .）：\n`docker build -t gcr.io/my-project-id/iis-site-windows\
  \ ...`\n\n9. 当输出返回类似 `Successfully tagged gcr.io/my-project-id/iis-site-windows:latest.`\
  \ 的内容时，您将看到构建已成功完成。\n\n10. 如果您重新运行 Docker 镜像，您现在将看到新创建的镜像可用。\n\n11. 让我们现在使用 `docker\
  \ run -d -p 80:80 gcr.io/my-project-id/iis-site-windows` 命令运行一个 Windows 容器。\n\n\

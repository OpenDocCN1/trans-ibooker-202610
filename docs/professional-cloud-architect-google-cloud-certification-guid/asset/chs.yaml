  \ SHELL，这将激活您的 Cloud Shell 实例并执行请求。\n\n## 部署选项\n\n您会注意到有一些选项我们保留为默认值。让我们更详细地查看这些，以确保我们理解创建\
  \ Compute Engine 实例所需的所有设置。\n\n### 区域\n\n区域是由三个或更多区域组成的地理位置。我们需要选择一个可以运行 VM 的区域。要求可能与预期的大多数流量所在位置有关。如我们所述，某些区域的价格比其他区域更贵：\n\
  \n美洲\n\n- northamerica-northeast1（蒙特利尔）\n- southamerica-east1（圣保罗）\n- us-central1（爱荷华）\n\
  - us-east1（南卡罗来纳）\n- us-east4（弗吉尼亚北部）\n- us-west1（俄勒冈）\n- us-west2（洛杉矶）\n- us-west3（盐湖城）\n\
  - us-west4（拉斯维加斯）\n\n欧洲\n\n- europe-central2（华沙）\n- europe-north1（芬兰）\n- europe-west1（比利时）\n\
  - europe-west2（伦敦）\n- europe-west3（法兰克福）\n- europe-west4（荷兰）\n- europe-west6（苏黎世）\n\

  \n| Cluster IP | 10.39.252.240 |\n| Load balancer IP | 35.194.21.47 |\n| Load balancer\
  \ | ac57afbda82f711e9b18142010a80008 |\n\n# Deployments\n\n| Name | Status | Pods\
  \ |\n| nginx-deployment | OK | 3/3 |\n\n# Serving pods\n\n| Name | Status | Restarts\
  \ | Created on |\n| nginx-deployment-5c689d88bb-2d7pq | Running | 0 | May 30, 2019,\
  \ 6:20:12 PM |\n| nginx-deployment-5c689d88bb-srtn8 | Running | 0 | May 30, 2019,\
  \ 6:20:12 PM |\n| nginx-deployment-5c689d88bb-z4mkp | Running | 0 | May 30, 2019,\
  \ 6:20:12 PM |\n\n# Ports\n\n| Port | Node Port | Target Port | Protocol | |\n|\
  \ 80 | 31871 | 80 | TCP | Port forwarding |\n\nFigure 6.41 – Service details\n\n\
  8. 将 IP 粘贴到你的网络浏览器中，或点击 External endpoints 键旁边的链接。你会看到以下 NGINX 欢迎信息：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_202_0.png)\n\
  \nFigure 6.42 – Accessing the application\n\n至此，我们已成功将第一个应用程序部署到 GKE 集群。正如你所见，你可以使用\
  \ GUI 或命令行来完成此操作。Google Cloud Console 允许你在无需手动定义 YAML 文件的情况下部署 Kubernetes 对象。它还会可视化最有用的对象及其关系。使用\
  \ GUI，你还可以执行一些第二天操作。此时，我们鼓励你获得一些实践经验，并尝试使用这两种方法部署你的应用程序。\n\n## Cluster second-day\
  \ operations\n\n到目前为止，我们已经创建了一个集群并部署了第一个应用程序。一切都在运行。现在，让我们来看看第二天操作，例如升级和扩缩容。正如你所知，如果手动部署集群，这些操作可能非常耗时。当你使用\
  \ GKE 时，它会为你自动执行这些任务。你只需启动它，甚至可以允许 GKE 决定何时触发操作。让我们从升级开始。\n\n## Upgrading the cluster\n\
  \nGoogle Kubernetes 允许我们无需手动安装任何东西即可简单地升级集群组件。master 和节点是分别升级的。请记住，master 只能与比其版本旧两个次要版本以内的节点一起工作。让我们开始：\n\
  \n- 1. 在运行任何命令之前，通过运行以下命令设置默认区域：\n\n```\ngcloud config set compute/zone us-central1-a\n\
  ```\n\n- 2. 要检查 master 和节点的当前版本，请使用以下命令：\n\n```\ngcloud container clusters describe\
  \ $CLUSTER_NAME\n```\n\n- 3. Google 会自动升级 master，但你也可以通过运行以下命令手动触发 master 升级：\n\n\
  ```\ngcloud container clusters upgrade $CLUSTER_NAME --master\n```\n\n- 4. master\
  \ 升级后，你可以通过运行以下命令升级节点：\n\n```\ngcloud container clusters upgrade $CLUSTER_NAME\n\
  ```\n\nGKE 会尝试将正在升级的节点上的 Pod 重新调度。节点将被替换为具有所需版本的新节点。当节点向 master 注册时，它们会被标记为可调度。\n\
  \n> **Important Note**\n> 虽然你可以降级节点，但 Google 不推荐这样做。\n> 你可以将节点降级到比 master 低一个补丁版本。\n\
  \n### Auto-upgrades\n\n对于新创建的集群，自动升级默认启用。节点会被升级以跟上 master 的版本。升级在选定的维护窗口期间进行。一次只升级一个节点，并且只在集群的一个节点池内进行。在升级期间，驻留在正在升级的节点上的\
  \ Pod 会被重新调度。如果无法重新调度，Pod 会进入 pending 模式。要启用自动升级，请在创建或更新集群时使用 --enable-autoupgrade\
  \ 标志。\n\n### Auto-repair\n\n自动修复选项允许你保持集群节点的健康。它监控节点的健康状态，并在需要时重新创建它们。当节点报告 NotReady\
  \ 或大约 10 分钟内未报告时，会触发重新创建。如果节点大约 30 分钟内磁盘空间不足，也会触发。在重新创建之前，节点会被 drained。如果节点无响应，此操作可能不成功。要启用自动修复，请在创建或更新集群时使用\
  \ --enable-autorepair 标志。\n\n### Resizing the cluster\n\nGKE 集群可以通过增加或减少节点池中的节点数量来调整大小。要执行调整大小，请使用以下命令：\n\
  \n```\ngcloud container clusters resize $CLUSTER_NAME --node-pool $POOL_NAME --num-nodes\
  \ $NUM_NODES\n```\n\n这里，我们有以下选项：\n\n- - $CLUSTER_NAME: 集群的名称\n- - $POOL_NAME: 要调整大小的节点池的名称\n\
  - - $NUM_NODES: 池中运行的节点数\n\n当你增加集群大小时，新的 Pod 可能会被调度到新节点上，但旧的 Pod 不会被迁移。当你减少集群大小时，托管在被移除节点上的\
  \ Pod 将被删除。它们只有在由复制控制器管理时才会在其他节点上重新创建。要在移除前 drained 节点，你可以使用 beta 命令：\n\n```\ngcloud\
  \ beta container clusters resize $CLUSTER_NAME --node-pool $POOL_NAME --num-nodes\
  \ $NUM_NODES\n```\n\n### Autoscaling a cluster\n\n你也可以将集群设置为自动扩缩容。此扩缩容事件可由工作负载和资源使用情况的变化触发。自动扩缩容监控你的节点并检查是否应增加或减少。集群中运行的节点的最大数和最小数在以下命令中定义：\n\
  \n```\ngcloud container clusters create $CLUSTER_NAME --num-nodes $NUM --enable-autoscaling\
  \ --min-nodes $MIN_NODES --max-nodes $MAX_NODES --zone $COMPUTE_ZONE\n```\n\n这里，我们有以下选项：\n\
  \n- - $CLUSTER_NAME: 集群的名称\n- - $NUM: 初始节点数\n- - $MIN_NODES: 最小节点数\n- - $MAX_NODES:\
  \ 最大节点数\n\n\n\n\n\n你也可以使用以下命令更改自动扩缩容设置：\n\n```\ngcloud container clusters update\
  \ $CLUSTER_NAME --enable-autoscaling --min-nodes $MIN_NODES --max-nodes $MAX_NODES\
  \ --zone $COMPUTE_ZONE --node-pool default-pool\n```\n\n这里，我们有以下选项：\n- $CLUSTER_NAME：集群的名称\n\
  - $MIN_NODES：节点的最小数量\n- $MAX_NODES：节点的最大数量\n\n要为特定节点禁用自动扩缩容，请使用以下 --no-enable-autoscaling\
  \ 标志：\n\n```\ngcloud container clusters update $CLUSTER_NAME --no-enable-autoscaling\n\
  ```\n\n## IAM\n\n对 GKE 的访问通过 IAM 保护。让我们看一下预定义角色的列表，以及每个角色的简短描述：\n- **Kubernetes\
  \ Engine Admin**：有权访问集群及其 Kubernetes API 对象的管理\n- **Kubernetes Engine Cluster Admin**：有权访问集群的管理\n\
  - **Kubernetes Engine Cluster Viewer**：对集群具有只读访问权限\n- **Kubernetes Engine Developer**：对集群内部的\
  \ Kubernetes API 对象具有完全访问权限\n- **Kubernetes Engine Host Service Agent User**：有权访问\
  \ GKE 主机服务代理\n- **Kubernetes Engine Viewer**：对 GKE 资源具有只读访问权限\n\n## Kubernetes 基于角色的访问控制\n\
  \n原生的 Kubernetes **基于角色的访问控制 (RBAC)** 可以与 Cloud IAM 结合使用。虽然 Cloud IAM 在项目级别工作，但\
  \ RBAC 授予对 Kubernetes 资源的权限。特权授予在集群或命名空间级别。以下是一个 Role 对象的示例，该对象授予对 mynamespace 命名空间中所有\
  \ Pod 的读取访问权限：\n\n```\nkind: Role\napiVersion: rbac.authorization.k8s.io/v1\nmetadata:\n\
  namespace: mynamespace\nname: pod-reader\nrules:\n- apiGroups: [\"\"] # \"\" indicates\
  \ the core API group\n  resources: [\"pods\"]\n  verbs: [\"get\", \"watch\", \"\
  list\"]\n```\n\n现在，让我们讨论 Artifact Registry。\n\n## Artifact Registry\n\n我们用于向 Kubernetes\
  \ 部署应用程序的容器镜像存储在容器仓库中。Docker Hub (hub.docker.com) 是一个公共镜像仓库。我们可以使用它来拉取公共镜像。但如果我们想要一个本地仓库来存储我们的镜像怎么办？Google\
  \ Cloud Platform 提供了一个名为 Artifact Registry 的服务（Google Container Registry 的演进版）。这本质上是一个单一位置，您可以在其中存储、执行漏洞扫描并控制对镜像的访问。由于它托管在\
  \ GCP 上，因此使用起来也比 Docker Hub 更快。GKE 集群默认情况下可以访问位于同一项目中的注册表。\n\n要运行存储在 Artifact Registry\
  \ 中的镜像，请使用以下命令：\n\n```\nkubectl run $NAME --image=$LOCATION-docker.pkg.dev/$PROJECT-ID/$REPOSITORY/$IMAGE:$TAG\n\
  ```\n\n这里，我们有以下选项：\n- $NAME：Pod 名称\n- $LOCATION：仓库的区域或多区域位置（https://cloud.google.com/artifact-registry/docs/repo-organize#locations）\n\
  - $REPOSITORY：镜像仓库的名称\n- $PROJECT-ID：GCP 项目的 ID\n- $IMAGE：我们将用于部署的镜像\n- $TAG：镜像的标签\n\
  \n您也可以在 Kubernetes YAML 定义中使用 $LOCATION-docker.pkg.dev/$PROJECT-ID/$REPOSITORY/$IMAGE:$TAG\
  \ 作为 image 参数。\n\n## Cloud Build\n\nCloud Build 是一个源自 Container Builder 的服务。它最初用于构建容器镜像。Google\
  \ 创建此服务是为了将其发展为 CI/CD 服务。当服务重新品牌化时，引入了额外的功能。Cloud Build 运行一个或多个构建步骤以生成工件。这些构建步骤使用所谓的\
  \ Cloud Builders，它们是安装了特定命令行工具的容器。这些包括 git、docker、kubectl、maven、gcloud、gsutil 等等。这些构建步骤在\
  \ YAML 配置文件中定义。以下 YAML 配置文件使用 Docker Cloud Builder 构建容器镜像然后将其推送到 Artifact Registry：\n\
  \n```\nsteps:\n- name: 'gcr.io/cloud-builders/docker'\n  args: ['build', '-t', 'us-central1-docker.pkg.dev/my-project/my-image',\
  \ '.']\n- name: 'gcr.io/cloud-builders/docker'\n  args: ['push', 'us-central1-docker.pkg.dev/my-project/my-image']\n\
  ```\n\n如果标准构建器不够用，您可以搜索社区 cloud builder 或创建自己的构建器。这意味着您可以使用所需的任何工具。要了解有关自定义 Cloud\
  \ Builders 的更多信息，请查看进一步阅读部分。\n\n构建可以手动运行，也可以由代码仓库触发。Cloud Build 与常见的代码仓库集成，例如 Cloud\
  \ Source Repository、GitHub 和 Bitbucket。\n\n## 构建容器的最佳实践\n\nGoogle 已定义了一组构建容器的最佳实践，这导致构建时间更短，以及更小、更安全的镜像。完整的推荐列表可以在此处找到：https://cloud.google.com/architecture/best-practices-for-building-containers。对于考试，您应该了解其中最重要的内容。这些建议已根据其重要性分类到以下列表中：\n\
  - **高重要性：**\n  - 每个容器打包一个应用。\n  - 正确处理 PID 1、信号处理和僵尸进程。\n  - 优化 Docker 构建缓存。\n-\
  \ **中等重要性：**\n  - 删除不必要的工具。\n  - 构建尽可能小的镜像。\n  - 扫描镜像是否存在漏洞。\n  - 正确标记您的镜像。\n\n\
  这些建议的详细信息可以在上述链接的文档中找到。\n\n## 配额和限制\n\nGKE 具有以下限制：\n- 每个区域最多 50 个集群，外加每个区域 50 个区域集群\n\
  - 每个集群最多 15,000 个节点\n- 如果使用 GKE 入口控制器，每个集群最多 1,000 个节点\n- 每个节点池区域最多 1,000 个节点\n\
  - 每个节点 110 个 Pod\n\n请注意，GKE 使用 Compute Engine 来托管节点，因此 Compute Engine 配额也适用。\n\n\
  此外，集群本身还有资源配额。要查看配额，请使用 `kubectl get resourcequota gke-resource-quotas -o yaml`\
  \ 命令。请注意，配额无法移除，因为它们是为了保护集群的稳定性。\n\n## 定价\n\n在底层，Kubernetes Engine 使用 Compute Engine\
  \ 服务。您需要为作为集群节点的每个正在运行的虚拟机实例付费。由于 Kubernetes Engine 抽象了主节点，因此您不会为其付费。您需要为控制平面支付月费。您还将被收取支持您的\
  \ Service 和 Ingress 资源的负载均衡器的费用。\n\n> **考试提示**\n> 确保您了解考试的定价模式。请记住，您需要为节点和控制平面费用付费。\n\
  \n## 总结\n\n在本章中，我们了解了 GKE 以及微服务和容器。我们介绍了基本的 Kubernetes 概念并描述了最重要的 Kubernetes 对象。我们还查看了使用\
  \ GKE 的优势，包括自动部署、自动扩缩容和自动升级。我们部署了一个集群并查看了第二天操作。我们还查看了如何使用 `kubectl` 命令连接到集群。如果您想做一些额外的阅读，请查看\
  \ *进一步阅读* 部分提供的链接。\n\n在下一章中，我们将讨论 Cloud Run 服务，该服务允许您在无需配置 GKE 集群的情况下运行云原生工作负载。\n\
  \n## 进一步阅读\n\n要了解本章涵盖的主题的更多信息，请查看以下资源：\n- **Kubernetes:** https://kubernetes.io\n\
  - **微服务:** https://microservices.io/\n- **Kubernetes 故事:** https://www.youtube.com/watch?v=4ht22ReBjn0&t=31s\n\
  - **kubectl:** https://kubernetes.io/docs/reference/kubectl/overview/\n- **网络概述:**\
  \ https://cloud.google.com/kubernetes-engine/docs/concepts/network-overview\n\n\n\
  \n\n\n- **Services:** https://cloud.google.com/kubernetes-engine/docs/concepts/service\n\
  - **Ingress:** https://cloud.google.com/kubernetes-engine/docs/concepts/ingress\n\
  - **Node pools:** https://cloud.google.com/kubernetes-engine/docs/concepts/node-pools\n\
  - **Node taints:** https://cloud.google.com/kubernetes-engine/docs/how-to/node-taints\n\
  - **Autoscaler:** https://cloud.google.com/kubernetes-engine/docs/concepts/cluster-autoscaler\n\
  - **Upgrading a cluster:** https://cloud.google.com/kubernetes-engine/docs/how-to/upgrading-a-cluster\n\
  - **PersistentVolumes:** https://kubernetes.io/docs/concepts/storage/persistent-volumes/\n\
  - **Network Policies:** https://kubernetes.io/docs/concepts/services-networking/network-policies/\n\
  - **Quotas:** https://cloud.google.com/kubernetes-engine/quotas\n- **Container Registry:**\
  \ https://cloud.google.com/container-registry/docs/overview\n- **Cloud Build:**\
  \ https://cloud.google.com/cloud-build/docs/configuring-builds/create-basic-configuration\n\
  - **Cloud builders:** https://cloud.google.com/cloud-build/docs/cloud-builders\n\
  - **Kubernetes RBAC:** https://kubernetes.io/docs/reference/access-authn-authz/rbac/\n"
- "# 7\n部署\n云原生\n使用\nCloud Run 的工作负载\n\n在上一章中，我们深入探讨了 **Google Kubernetes Engine (GKE)**，它提供了\
  \ Kubernetes 即服务。在本章中，我们将介绍 **Cloud Run** 服务。**Google Cloud Run** 允许我们在完全托管的无服务器平台上运行容器化工作负载。它将你在\
  \ GKE 中获得的体验提升了一个层次，通过简化开发和部署应用程序的过程。该服务基于开源 **Knative** (`https://knative.dev/docs/serving`)\
  \ 项目，因此 Cloud Run 工作负载可以移植到任何运行 Kubernetes 的平台。使用 Cloud Run，你可以与 Google Cloud 服务实现完全集成，例如\
  \ Cloud IAM、Cloud Build 和 Google Cloud 的运维套件。你所要做的就是使用你喜欢的语言之一构建应用程序。完成之后，你可以在几秒钟内将其部署到\
  \ Cloud Run。服务将负责扩展和保持应用程序的运行。你只需为使用的资源付费，而不是为底层集群付费。\n\n在本章中，我们将涵盖以下主题：\n\n- 使用\
  \ Cloud Run 的介绍\n- 部署服务到 Cloud Run\n- Cloud Run IAM 角色\n- Cloud Run 价格和限制\n\n> **考试提示**\n\
  > Cloud Run 是一个重要的考试主题。专业云架构师考试已更新，包含越来越多的云原生技术，因为这是 Google 专注的方向。Cloud Run 与 App\
  \ Engine 相似，因为它提供了出色的开发者体验，它是完全托管的，大量的底层实现细节对用户是抽象的。不同之处在于它基于 Kubernetes 和 Knative，这使其具有很强的可移植性。与考试的上一版本相比，App\
  \ Engine 的题目数量已减少，并转向测试你的 Cloud Run 知识。\n> \n> 如果你想了解 Cloud Run 在幕后是如何工作的，你可能想深入研究\
  \ Knative 本身。然而，你不需要这样做就能通过 PCA 考试，也不需要这样做就能使用 Cloud Run。\n\n## 使用 Cloud Run\n\n\
  正如我们已经提到的，将应用程序部署到 Cloud Run 是一个无缝的体验。以下图表显示了构建容器并将其部署到 Cloud Run 的简化流程：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_212_0.png)\n\
  \n图 7.1 – 构建 Cloud Run 服务\n\n你首先开发你的容器化应用程序，它可以侦听 HTTPS 或 gRPC (https://grpc.io/)\
  \ 请求。为了从代码构建应用程序，你可以使用 Google Cloud Build 服务并将容器的镜像存储在 Artifact Registry 中。接下来，你必须告诉\
  \ Cloud Run 你的容器存储在哪里并定义一些参数，例如你一次想要运行的最大副本数或应用程序应如何触发。你请求部署，几秒钟后，你的应用即可为用户提供服务。\n\
  \nCloud Run 将负责运行所有负责扩展应用程序和将流量负载均衡到你的 Cloud Run 服务的 Kubernetes 资源。它还将日志发送到 Cloud\
  \ Logging 并将指标传递给 Cloud Monitoring。\n\n如果你希望部署应用程序的新版本，可以直接从 Google 控制台进行操作。新版本可能包括应用程序代码的更改，这会导致构建新的容器。或者，它可能包括对参数的更改，例如服务的容器实例最大数量。\n\
  \n应用程序的新版本称为 Cloud Run 服务修订版 (https://github.com/knative/specs/blob/main/specs/serving/knative-api-specification-1.0.md#revision)，符合\
  \ Knative 命名约定：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_213_0.png)\n\n图 7.2\
  \ – Cloud Run 修订版\n\n同样的问题能否用 GKE 实现？当然可以。不同之处在于，使用 Cloud Run，你在 GKE 中需要创建的所有 Kubernetes\
  \ 资源，例如 Service、HorizontalPodAutoscalers 和 Deployments，都对你进行了抽象。这有助于你在无需掌握 Kubernetes\
  \ 内部结构的情况下开发和部署云原生工作负载。\n\n## Cloud Run 容器\n\n在上一节中，我们查看了开发和部署 Cloud Run 应用程序的流程。该流程中的基本任务是构建容器。这是因为部署本身由\
  \ GCP 自动化，实施细节对开发者来说无关紧要。Cloud Run 容器需要满足多个要求才能执行。这在容器运行时契约中有很好的描述，你可以在这里找到：https://cloud.google.com/run/docs/reference/container-contract。让我们快速看一下要求清单：\n\
  \n- 你可以使用任何 *编程语言* 来开发你的应用程序。\n- 可执行文件必须与 *Linux 64 位* 兼容（Linux x86_64 ABI 格式）。\n\
  - 你的应用程序必须侦听 *地址 0.0.0.0* 和你在 Cloud Run 配置中定义的一个端口。默认情况下，端口设置为 8080。配置的端口将作为 `PORT`\
  \ 环境变量设置在容器中。\n- 容器应侦听 HTTPS 或 gRPC 请求，并且 *TLS 不应在容器中直接实现*。TLS 在 Cloud Run 中实现并代理请求。\n\
  - 容器实例需要在服务部署期间指定的 *超时时间内返回响应*。如果连续出现超过 20 次超时，容器将被终止。\n- 响应必须只包含 *可打印的非空白 ASCII\
  \ 字符*（无冒号）。\n\n另外，请注意，写入文件系统的数据驻留在容器实例的内存中，并在容器停止时不会持久保存。\n\n## Cloud Run 触发器\n\n\
  正如我们已经了解的，Cloud Run 服务可以通过 HTTPS 或 gRPC 触发。然而，这些并不是唯一可用的选项。得益于与其他 Google Cloud 服务的集成，有一组触发器可与\
  \ Cloud Run 一起使用：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_215_0.png)\n\n图 7.3\
  \ – Cloud Run 触发器\n\n这些触发器如下：\n\n- **HTTPS 或 gRPC 请求**：这是调用 Cloud Run 的最通用方式，可用于创建\
  \ Web API、中介软件、反向代理或 Web 应用程序。\n- **Pub/Sub**：这可将 Cloud Run 用作 Webhook，Pub/Sub 消息将被推送。\n\
  - **Cloud Scheduler**：这允许你在计划的时间运行 Cloud Run。\n- **Cloud Task**：异步执行 Cloud Run 服务。\n\
  - **Eventarc**：将 Cloud Run 连接到 Eventarc 支持的事件。\n\n请查阅 Google Cloud Run 文档页面，了解如何将这些用于你的用例。如果这些触发器都不满足你的用例，你可能想查看\
  \ Eventarc，它提供了更大的灵活性。Eventarc 基于 Knative Eventing (https://knative.dev/docs/eventing/)\
  \ 项目并提供更多触发器。\n\n\n\n\n\n## 考试提示\n\n我们不期望 PCA 考试中出现关于 Eventarc 的问题。但请留意考试指南，因为这可能会在没有通知的情况下发生变化。至少，你应该记住\
  \ Eventarc 允许你基于 Pub/Sub 和审计日志触发事件。后者极其强大，因为所有 Google Cloud 服务都可以生成审计日志。了解有关 Eventarc\
  \ 的更多信息，请查看 https://cloud.google.com/eventarc/docs/creating-triggers。\n\n## 部署到\
  \ Cloud Run\n\n要能够使用 Cloud Run，你需要在 API 库中启用 Cloud Run API。如果只是想测试一个已经容器化的应用程序，你可以通过在\
  \ Cloud Shell 中运行以下命令将其部署到 Cloud Run：\n\n```\ngcloud run deploy [SERVICE] --image\
  \ gcr.io/[PROJECT-ID]/[IMAGE]\n```\n\n这将使用存储在 gcr.io/[PROJECT-ID]/[IMAGE] 路径中的镜像部署名为\
  \ [SERVICE] 的 Cloud Run 服务。\n\n## 重要说明\n\n如果你尚未配置默认区域，将提示你进行配置。\n\n对于考试，你应该了解可以为\
  \ Cloud Run 服务设置的高级设置。因此，让我们看看如何从 Cloud 控制台部署服务：\n\n- 1. 从汉堡菜单中选择 Cloud Run。你将看到\
  \ Cloud Run 欢迎页面：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_216_0.png)\n\n图 7.4\
  \ – Cloud Run 欢迎页面\n\n2. 点击 CREATE SERVICE 链接。填写服务的名称并选择服务托管的区域。点击 NEXT 进入第 2 部分：\n\
  \n图 7.5 – 服务设置\n\n3. 在第 2 部分，指定要用于部署的容器镜像路径并点击 NEXT：\n\n图 7.6 – 配置服务的第一个版本\n\n4.\
  \ 或者，你也可以使用第二个选项；即 **从源代码库持续部署新版本**。下面，你会看到如果选择此选项，我们将需要提供代码所在的代码库。Cloud Build 将使用此代码为你构建镜像，将其存储在\
  \ Container Registry 中，并部署到 Cloud Run。在每次拉取请求时，流程都会再次执行。这样，你就可以为 Cloud Run 服务获得无缝的\
  \ GitOps 流程。点击 **ADVANCED OPTIONS** 下拉菜单：\n\n## 使用 Cloud Build 设置\n\n在 Cloud Build\
  \ 驱动的持续部署下，对源代码库的更改会自动构建为 Container Registry 中的容器镜像并部署到 Cloud Run。\n\n你的代码应监听 $PORT\
  \ 上的 HTTP 请求。你的代码库必须包含 Dockerfile 或 Go、Node.js、Python、Java 或 .NET Core 的源代码才能构建为容器镜像。\n\

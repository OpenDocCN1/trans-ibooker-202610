  \ Pod Autoscaling 和 Node auto-provisioning。对于自动扩缩容配置文件，您可以从标准的 Balanced 模式更改为 Optimized，该模式会积极删除您的节点（这针对不敏感于启动延迟的批处理工作负载进行了优化）：\n\

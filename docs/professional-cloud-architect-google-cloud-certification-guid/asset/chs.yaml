  \n本节向我们展示了如何注册考试。需要认识到的主要一点是，我们现在有在家参加考试的选项。在下一节中，我们将了解考试的预期内容。\n\n### What to expect\
  \ from the exam\n\nGoogle 建议你利用多个资源来准备考试。这些包括在线培训课程、讲师指导培训和实践实验室。所有这些信息都可以在云架构师网页\
  \ https://cloud.google.com/certification/cloud-architect 上找到。\n\n此外，通过访问考试指南网页 https://cloud.google.com/certification/guides/professional-cloud-architect/，你可以查看考试申请者预期的科目知识。考试蓝图对任何考试都至关重要，GCP\
  \ 架构师也不例外。你应该查看本指南并确保理解每个部分。\n\n像大多数考试一样，一些实际经验也会有所帮助。该考试是为具有软件开发和多云/混合云环境经验的云架构师设计的。也就是说，只要有足够的学习和对\
  \ GCP 环境的接触，即使你没有实际动手经验，也没有理由不能通过此考试。\n\nGoogle 提供 Qwiklabs，这是一个自学平台，可用于获得服务经验。建议你注册以熟悉\
  \ GCP 的布局和服务。Qwiklabs 可以通过月度订阅付费，提供实验室无限访问，或通过购买积分付费。每个实验室将花费一定数量的积分，具体取决于实验室的复杂程度。10\
  \ 积分的典型费用为 10 美元，且批量购买有折扣。GCP Essentials 提供了对 GCP 的绝佳介绍，可在 https://google.qwiklabs.com/quests/23?utm_source=gcp&utm_medium=site&utm_campaign=certification\
  \ 找到。完成此实验室大约需要 5 小时。\n\n考试本身将包括多项选择题，需要选择一个或多个答案。此外，你将被询问虚构公司的案例研究。然而，你可以在考试前访问这些案例研究，并在考试期间参考它们。在第\
  \ 18 章，案例研究，我们将更详细地介绍这些内容。考试大约有 60 道题，你有 2 小时完成。你将收到一条屏幕消息，仅显示通过或未通过，且不显示分数。Google\
  \ 认为评分结果对考生没有意义且可能被误解。确认邮件也将发送到你的注册电子邮件地址确认结果。\n\n通过考试将验证你的技能 2 年。然后，你需要通过再次参加完整且最新的考试来重新认证。如果你尝试失败，你必须等待\
  \ 14 天后才能重考。如果你第二次尝试失败，你必须等待 60 天，而第三次失败后，你必须等待 1 整年后才能重考。每次尝试都需要全额费用。\n\n\n\n\n\
  \n## 在线监考考试\n\n由于 COVID-19 大流行，自 2020 年初起，Google 加速了其在线监考考试的交付计划。在 2020 年下半年，*专业数据工程师*\
  \ 考试成为首个提供在线的 Google 考试，随后专业云架构师考试也紧跟其后。与传统的考场方式相比，考试的价格、时长或内容方面没有区别。然而，在考试前的几分钟内存在差异。你必须下载\
  \ **Sentinel** 软件并对你的机器拥有完全的管理员控制权。如果使用的是公司机器，这可能会导致问题。还必须满足系统要求；例如，操作系统必须是 Windows\
  \ 8.1 或 10，或 Mac OS X 10.13-11.1。你的网络浏览器需要 Chrome、Firefox 或 Safari 的最新版本。此外，还需要网络摄像头。你还必须进行面部扫描以建立生物识别档案，并且必须在考试前完成。\n\
  \n当你准备参加考试时，你应处于安全、安静且光线充足的房间。你将被要求用网络摄像头展示周围的房间。你还需要一面镜子或你的手机来展示其屏幕，如果网络摄像头是内置的。房间内不得有其他人，也不得有食物、饮料或其他纸张或书写工具。完整的测试要求列表可在\
  \ Google Cloud 认证网页 https://support.google.com/cloud-certification/answer/9907748?hl=en\
  \ 上找到。\n\n完成考试后，你将获知结果，与在考场中一样，只会显示通过或未通过的消息。\n\n几天后，你将收到结果已发送给 Google 进行验证的确认。一周后，你应收到正式确认，以及指向你证书的链接。\n\
  \n## 建议提示和技巧\n\n在考试中，我们建议你利用可以标记问题以便稍后返回的功能。当然这是个人偏好，但我们建议你不要在某个问题上纠结太久。你大约有每题 2\
  \ 分钟的时间来提供答案。有些问题的答案会直接跃入你的视野，而另一些则需要你花费更多时间来确定正确答案。如果你花费的时间过长，则将其标记为待审并继续，因为重要的是要完成测试，以确保你获得最大分数。\n\
  \n我们还建议你预约考试以给你动力。很容易拖延或过于担心自己准备不足。这是自然的感觉，但有明确的截止日期会让你更专注和坚定。我们建议你打印出考试指南并逐点进行，确保你理解每个目标。\n\
  \n此外，2 小时是很长的时间。确保你在一天中最清醒的时间预约考试，以给你最大的成功机会。有了远程考试的选项，找到适合你的时间段应该会更容易，但你必须确保找到一个既私密又安静的空间。此外，确保你有稳定的互联网连接，如果你使用的是这种类型的设备，则确保笔记本电脑电量充足。对于某些人来说，参加考场考试可能仍然是首选。\n\
  \n## 总结\n\n在本章中，我们介绍了考试的预期内容以及如何注册考试，以及成为 GCP 认证架构师的好处。在整本书中，我们将向你介绍成功所需的服务。本书的最终目标是帮助你通过考试；然而，我们鼓励你做更多阅读，使用\
  \ Qwiklabs，或在 GCP 控制台中尝试操作，如果你希望深入研究阅读本书时遇到的特定主题或服务。\n\n在下一章中，我们将开始使用 GCP。\n\n##\
  \ 延伸阅读\n\n阅读以下文章以获取有关本章所涵盖内容的更多信息：\n\n- **Google Cloud Certificate:** https://cloud.google.com/certification.\n\
  \n## 2\n开始使用 Google Cloud Platform\n\n在本章中，我们将介绍云计算的概念，以便更好地理解 **Google Cloud Platform\
  \ (GCP)** 是什么。我们将查看 GCP 资源及其层级结构。之后，我们将创建我们的第一个账户并设置一个项目。此外，我们将讨论可用的计费选项。我们将研究如何创建计费账户并将其与项目关联。最后，我们将查看如何导出计费信息。在开始讨论\
  \ GCP 服务之前，进行此介绍非常重要。这既有助于你通过考试，也有助于你在甚至开始使用服务之前为现实场景实施 GCP 的基本设置。我们积极鼓励你设置自己的免费试用\
  \ Google Cloud 账户，以便获得实践经验并建立信心。\n\n在本章中，我们将涵盖以下主题：\n\n- 介绍云\n- 了解 GCP\n- 考试技巧\n\
  \n**考试提示**\n对 GCP 资源有良好的理解对于通过 **GCP 云架构师** 考试至关重要。确保你仔细、认真地阅读本章。如有必要，多读几次，并使用你的免费试用账户尝试创建项目和计费账户。尝试将计费数据导出到文件和\
  \ BigQuery。你需要记住计费的各个 **身份和访问管理 (IAM)** 角色。确保你对服务范围有良好的理解。\n\n### 介绍云\n\n在深入 GCP\
  \ 之前，首先，让我们根据以下图表了解云是什么：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_40_0.png)\n\
  \n图 2.1 – 云是什么\n\n没错——*没有云：它只是别人的电脑。* 使用云时，我们实际上是在访问托管在别人电脑上的资源并消费服务。如果我们想更精确地说，云是一池电脑。\n\
  \n现在，让我们看一下 Google 使用的更准确、更专业的定义，该定义来自美国国家标准与技术研究院 https://csrc.nist.gov/publications/detail/sp/800-145/final：\n\
  \n> \"云计算是一种模型，可实现对共享的、可配置的计算资源池（例如网络、服务器、存储、应用程序和服务）的普遍、便捷的按需网络访问，这些资源可以快速配置和释放，且管理成本或服务提供商交互最少。这种云模型由五个基本特征、三种服务模型和四种部署模型组成。\"\
  \n\n云的五个基本特征如下：\n\n- **按需自助服务：** 服务在无需人工提供商干预的情况下自动配置，并且你只为所使用的付费。\n- **广泛网络访问：**\
  \ 资源可在整个网络中访问。\n- **资源池化：** 资源从共享池中汇集，使用户感觉位置独立。对于某些资源，位置可能受限。\n- **快速弹性：** 服务可以弹性配置和取消配置，容量由提供商管理。\n\
  - **可计量服务：** 资源使用情况会被监控并可报告。\n\n四种部署模型如下：\n\n- **私有云：** 由特定组织使用，但可由第三方管理。\n- **公有云：**\
  \ 由公众使用。\n- **社区云：** 由特定社区使用。\n- **混合云：** 由两个或多个不同的云组成。\n\n当我们查看 GCP 时，它满足所有五个特征并符合公有云部署模型。在下一节中，我们将查看\
  \ GCP 本身。\n\n### 了解 GCP\n\nGoogle 多年来一直在开发自己的工具来提供 Gmail、YouTube 和 Google Workspace\
  \ 等服务。这些工具已被转换为可供他人消费的服务。消费者获得了 Google 为自身目的必须使用的惊人可扩展性。GCP 允许你从计算、存储、网络、大数据和 **机器学习\
  \ (ML)** 服务中进行选择，在其之上构建你的应用程序。服务的数量不断增长，几乎每周都会发布新公告。新的服务和功能首先以 alpha 版本发布，然后以 beta\
  \ 版本发布，最后在全球范围内提供。早期版本甚至更早地提供给选定的客户和合作伙伴。这使得服务甚至在正式发布之前就能被外部各方测试！\n\n\n\n\n\nGoogle\
  \ 支持多种服务模型，包括以下几种：\n\n- **Infrastructure-as-a-Service (IaaS)**\n- **Platform-as-a-Service\
  \ (PaaS)**\n- **Container-as-a-Service (CaaS)**\n- **Function-as-a-Service (FaaS)**\n\
  - **Managed services**\n\n正如你所见，GCP 中的服务范围非常广泛。让我们快速分析一下 GCP 提供的这些服务范围。我们将从非常简单的\
  \ IaaS 开始，例如传统的數據中心，并以使用 FaaS 结束，在 FaaS 中我们可以运行代码而无需管理任何服务器基础设施。服务选择取决于我们的需求。简单来说，如果我们需要对\
  \ **Virtual Machines (VMs)** 具有灵活性和控制权，我们就会使用 **Compute Engine**。该服务允许我们配置 VM 实例，或直接将机器从现有环境迁移过来。然而，代价是您需要负责管理\
  \ VM 实例之上的所有层级。这包括操作系统、任何中间件以及其上的任何应用程序。\n\n当我们从 IaaS 转向 PaaS、CaaS 或 FaaS 时，维护基础设施的责任就从我们身上移除了。使用\
  \ **Cloud Functions**，我们真正关心的只是用 GCP 支持的语言编写函数。完成并发布后，我们通过 HTTP(S) 协议访问它。\n\n最后，当我们转向托管服务时，我们只需开始使用能为我们带来特定业务价值的服务，而无需担心任何底层组件。它们可以在\
  \ **Software-as-a-Service (SaaS)** 模式下使用，并通过 API 消费。一个例子是 **Dataprep**，这是一种数据服务，可让您清理和准备数据以进行进一步分析。另一个例子是预训练的\
  \ ML 模型，**Vision API**。开发人员可以通过使用 RESTful API 分析图像来使用此服务，而无需编写任何代码，除非是调用本身。\n\n\
  希望现在你明白 GCP 不仅仅是一个托管服务。它为你提供了一套工具、服务和资源，帮助你开发和交付应用程序。你将使用的服务选择完全取决于你拥有的需求集。如果这让你感到不知所措，那么不用担心。本书旨在帮助你逐步了解\
  \ GCP。\n\n在 *Chapter 3, Google Cloud Platform Core Services* 中，你将对最重要的 GCP 服务有一个概述。在接下来的章节中，我们将更深入地探讨其中每一个，以便为考试做好准备。\n\
  \n## GCP differentiators\n\n每个云提供商都有一些使其与其他提供商区别开来的特点。每个提供商在如何为客户提供价值方面都有自己的策略，GCP\
  \ 也不例外。让我们来看看使 GCP 脱颖而出的关键功能：\n\n- **Google Cloud's operations suite**（前身为 **The\
  \ Google Network**）：Google Network 是使 GCP 与其他云提供商区别开来的因素。Google 声称全球约 40% 的互联网流量由\
  \ Google Network 承载，使其成为全球最大的网络。这使得 Google Network 能够以非常低的延迟响应，尽可能接近终端用户。\n- **Global\
  \ scope**：GCP 是在考虑全球可用性的前提下开发的。你会注意到，与其他提供商不同，诸如负载均衡之类的服务在全球范围内可用，而非区域性可用。这使客户端能够专注于开发并采用开箱即用的高可用性和弹性。\n\
  - **ML services**：GCP 为数据科学家和可能对 ML 知识有限的普通开发人员提供了大量 ML 服务。ML 服务允许使用预训练模型，并提供 *AutoML*\
  \ 服务。后者允许你在不知道它们是如何创建的情况下训练 ML 模型。这些服务的组合正在迅速增长。Google 的关键目标是让企业能够利用 ML 做出更快、更明智的决策。\n\
  - **Developer-focused**：GCP 是以开发人员为重点构建的。如果查看 GCP 的历史，它始于 2008 年 App Engine 的预览版发布，App\
  \ Engine 是一个完全无服务器的平台，允许开发人员最初运行用 Python 编写的应用程序，后来增加了对 Java 和 Go 等其他语言的支持。它提供开箱即用的负载均衡和自动扩缩。开发人员只需选择想要开发的平台即可开始编码。此外，如果你查看\
  \ **Google Cloud's operations suite**（前身为 **Stackdriver**，GCP 监控工具）本身，它提供了可直接与应用程序集成的多个工具。这使开发人员能够使用它们来监控和调试其应用程序。Google\
  \ 非常明确地表示 GCP 是为开发人员创建的，以帮助他们应对挑战。实现这一目标后，他们现在正瞄准大型企业。\n- **Pricing**：VM 实例按秒计费，最短运行时间为一分钟。这使你能够运行机器进行短期测试，而无需支付一整小时的使用费用。\n\
  \n截至撰写本文时，GCP 拥有以下资源：\n\n- 28 个区域\n- 85 个区域\n- 146 个网络边缘位置\n\n这些数字正在迅速增长，截至撰写本文时，Google\
  \ 已在 Google Cloud Next 大会上宣布新增两个区域。要获取最新信息，请参阅 https://cloud.google.com/about/locations。以下地图显示了全球当前和未来的区域和区域：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_45_0.png)\n\nFigure 2.2 – GCP locations\
  \ (Source: https://cloud.google.com/about/locations/)\n\n上图以蓝色显示当前区域，以白色显示计划中的区域。还应注意，并非所有服务都可在每个区域中使用。例如，Cloud\
  \ Functions 在全球可用后，仅在有限的几个位置推出。\n\n## Resource manager\n\nGCP 由组织、文件夹和项目等容器组成，以分层方式对资源进行分组。这使您可以管理其配置和访问控制。资源可以通过\
  \ API 以编程方式管理。此外，Google 还提供了 Google Cloud Console 和命令行实用程序等工具，它们是 API 调用的封装。现在，让我们查看以下图表中呈现的层次结构，并熟悉每个资源：\n\
  \nGoogle Cloud Platform\n\n![](img/de2c97ab017f36b3750a5bade111edd7_46_0.png)\n\n\
  Figure 2.3 – The resource manager hierarchy (Source: https://cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy,\
  \ License: https://creativecommons.org/licenses/by/4.0/legalcode)\n\n上图显示了资源管理器层次结构。从顶部开始，我们有一个可映射到公司的\
  \ **Organization**。接下来，我们有可代表公司部门的 **Folders**。接下来，我们有 **Projects**，它们进一步划分实际的公司项目或环境，例如开发和生产。最后，在\
  \ **Projects** 之下，我们有 GCP **Resources**。我们将在以下各节中分别介绍这些内容。\n\n### Organizations\n\
  \n在层次结构的顶部，我们有组织。然而，请注意，这是一个可选资源，您可以在没有它的情况下很好地使用 GCP。组织仅对 **Google Workspace**（前身为\
  \ *G-Suite*）和 **Cloud Identity** 的用户可用，这些产品位于 GCP 之外。\n\n为了提供一些背景信息，Google Workspace\
  \ 是一套协作工具的集合，包括 Gmail、Google Drive、Hangouts 和 Google Docs。用户使用这些工具，它们存储在 Google\
  \ Workspace 域中。\n\nCloud Identity 是一种 **Identity-as-a-Service (IDaaS)** 服务。同样，它允许您创建一个域并从一个点管理您的用户、应用程序和设备帐户。您可以在\
  \ *Chapter 15, Security and Compliance* 中了解更多关于 Cloud Identity 的信息。\n\n单个 Google\
  \ Workspace 或 Cloud Identity 帐户只能与单个组织关联。这意味着组织仅绑定到一个域。在 Google Workspace 和 Cloud\
  \ Identity 中，都有超级管理员的角色定义。当您创建组织时，这些用户将在组织及其底层资源中拥有最高权限。请确保此帐户不用于日常操作。\n\n相反，超级管理员应将组织管理员角色分配给指定用户。此角色进一步用于定义\
  \ IAM 策略、资源层次结构，并使用 IAM 角色委派权限。\n\n> **Important Note**\n> 创建新组织时，域中的所有用户都会获得项目创建者和\
  \ Billing Account Creator IAM 角色。这使他们能够在该组织中创建新项目。同样，我们将在 *Chapter 15, Security\
  \ and Compliance* 中更详细地讨论这个问题。\n\n\n\n\n\n## Global resources\n\nGlobal resources\
  \ are globally available within the same project and can be accessed from any zone.\
  \ These include the following objects:\n\n- **Addresses**: These are reserved external\
  \ IP addresses and can be used by global load balancers.\n- **Images**: These are\
  \ either predefined or user-customized. They can be used to provision VMs.\n- **Snapshots**:\
  \ Snapshots of a persistent disk allow the creation of new disks and VMs. Note that\
  \ you can also expose a snapshot to a different project. Snapshots can also act\
  \ as a backup for VMs.\n- **Instance templates**: These can be used for the creation\
  \ of managed instance groups.\n- **Virtual Private Cloud (VPC) networks**: These\
  \ are virtual networks that you can connect your workloads to.\n- **Firewall**:\
  \ These are defined per VPC but are globally accessible.\n- **Routes**: Routes allow\
  \ you to direct your network traffic and are assigned to VPCs, but they are also\
  \ considered global.\n\n## Regional resources\n\nRegional resources are only accessible\
  \ by other resources within the same region. These include the following objects:\n\
  \n- **Addresses**: Static, external IP addresses can only be used by instances that\
  \ are in the same region.\n- **Subnets**: These are associated with VPC networks\
  \ and allow the assignment of IP addresses to VMs.\n- **Regional managed instance\
  \ groups**: These allow you to scale groups of instances. The scope can be set to\
  \ either regions or zones.\n- **Regional persistent disks**: These provide replicated,\
  \ persistent storage to VM instances. They can also be shared between projects for\
  \ the creation of snapshots and images, but not disk attachments.\n\n## Zonal resources\n\
  \nZonal resources are only accessible by other resources within the same zone. These\
  \ include the following objects:\n\n- **VM instances**: These reside in a particular\
  \ zone.\n- **Zonal persistent disks**: These provide persistent storage to VM instances.\
  \ They can also be shared as disks between projects for the creation of snapshots\
  \ and images, but not disk attachments.\n- **Machine types**: These define the hardware\
  \ configuration for your VM instances and are defined for any particular zone.\n\
  - **Zonal managed instance groups**: These allow you to autoscale groups of instances.\
  \ The scope can be set to either regions or zones.\n\nNow that we understand the\
  \ theory, let's take a look at how to create a project. Note that if you have not\
  \ done so yet, navigate to https://cloud.google.com/free to create your free-tier\
  \ GCP account.\n\n## Managing projects\n\nTo create a new project, perform the following\
  \ steps:\n\n1. Log in to the GCP console at https://console.cloud.google.com. Then,\

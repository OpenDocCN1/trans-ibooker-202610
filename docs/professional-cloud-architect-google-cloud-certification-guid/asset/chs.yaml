  \ 拥有世界上最大的数据集。因此，它开发了 TensorFlow 以实现高度可扩展性。Google 将其用于 Gmail、Google 搜索和 Photos 等服务。你可以通过\
  \ TensorFlow Playground 来了解 TensorFlow 的工作原理，该链接如下：https://playground.tensorflow.org:\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_445_0.png)\n\n图 14.6 – TensorFlow Playground\n\
  \n正如你所见，它允许你选择想要分析的数据集类型，并且你可以尝试我们在《机器学习的七个步骤》部分讨论过的所有参数。对过程的可视化使你能够理解参数变化如何影响最终输出。\n\
  \n> **考试提示**\n> 对于考试，你并不真正需要深入了解 TensorFlow。只需了解它是什么以及用途即可。不过，尝试 TensorFlow Playground\
  \ 可能是一个好主意。\n> \n> 即使它不是考试的一部分，你也可能想看看 TensorFlow 用法的示例。以下视频演示了如何对服装图像进行分类：https://www.youtube.com/watch?v=FiNgI1IwRNk。\n\
  \n## Cloud Vertex AI\n\nVertex AI 是一项 Google Cloud AI 平台服务，允许你使用预训练或自定义工具构建、部署和扩展\
  \ ML 模型，而无需担心底层基础设施。它是 AI Platform 服务的演进，并引入了与 AutoML 的集成。\n\n> **考试提示**\n> Vertex\
  \ AI 于 2021 年在 Google I/O 大会上宣布。在撰写本书时，仍有大量 Vertex AI 功能处于预览阶段。我们不认为你在 PCA 考试中会遇到关于此的问题。我们仍然认为这个主题非常令人兴奋。如果你想了解更多关于\
  \ Vertex AI 的信息，请查看文档：https://cloud.google.com/vertex-ai/docs/start。\n\n你可以加速学习过程，因为支持多种\
  \ CPU、GPU 和 **Tensor Processing Unit (TPU)** 节点。它可与多个框架配合使用，但最流行的是 TensorFlow。由于\
  \ TensorFlow 是开源的，因此允许可移植性。模型可以在有限数据上本地训练，然后发送到 GCP 以大规模训练。Vertex AI 与其他 GCP 服务集成，例如用于数据存储的\
  \ Cloud Storage 和用于数据处理的 Cloud Dataflow。\n\n### 使用 Vertex AI\n\n下图应能让你了解 Vertex\
  \ AI 在开发、部署和监控你的 ML 模型过程中的位置：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_446_0.png)\n\
  \n图 14.7 – Vertex AI 工作流\n\n现在，思考一下我们之前讨论的七个步骤。你可以看到 Vertex AI 将允许你从训练模型进展到将其部署到生产环境。从那里，模型可以被使用。你还将能够对模型进行版本控制，以查看每个版本的表现如何。\n\
  \n### Cloud TPUs\n\n在本节中，我们将解释 TPU 是什么。它们是 Google 定制开发的 **Application-Specific Integrated\
  \ Circuits (ASICs)**，用于加速 ML 工作负载。\n\n它们增强了线性代数计算的性能，而线性代数计算在 ML 应用中被大量使用。TPU 使模型训练时间从数周缩短到数小时。在下图中，我们可以看到在\
  \ Google Next 大会上展示的一组使用 TPU 的服务器机架：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_447_0.png)\n\
  \n图 14.8 – Cloud TPU v3 pod\n\n正如 Google 所指出的，以下因素使你的模型适合使用 TPU 进行训练：\n\n- 使用矩阵计算的模型\n\
  - 主训练循环中不包含自定义 TensorFlow 操作的模型\n- 训练时间很长的模型，例如数周\n- 具有非常大批处理大小的模型\n\n在其他情况下，你可以考虑使用\
  \ CPU 或 GPU。\n\n### 预训练 ML 模型\n\nGoogle 的预训练模型可用于在无需我们了解 ML 如何工作的情况下进行预测。所有模型都可通过\
  \ API 访问，可直接从你的应用程序中使用。用于预测的数据通过 JSON 文件提供或存储在 Cloud Storage 中。目前有以下几种模型可用：\n\n\
  - Cloud Speech-to-Text API\n- Cloud Text-to-Speech API\n- Cloud Translation API\n\
  - Cloud Natural Language API\n- Cloud Vision API\n- Cloud Video Intelligence API\n\
  \n让我们快速了解一下它们各自的功能。\n\n### Cloud Speech-to-Text API\n\nCloud Speech-to-Text API\
  \ 使开发人员能够将语音转换为文本。该 API 接受接收到的音频并返回文本转录。该 API 可同步、异步或以流式模式使用。支持多种语言和方言。完整列表请查看进一步阅读部分。\n\
  \n### Cloud Text-to-Speech API\n\nCloud Text-to-Speech API 使开发人员能够将文本转换为 **Speech\
  \ Synthesis Markup Language (SSML)** 输入的自然人类语音音频数据。支持多种语言，每种语言都有多个声音可供选择。有两种类型的声音可供选择，**Standard**\
  \ 和 **WaveNet**，后者是一个高级模块，可缩小与人类语音的差距。\n\n### Cloud Translation API\n\nCloud Translation\
  \ API 可实现数百种语言的翻译。如果语言未知，服务可以自动检测。Cloud Translation 带有最流行语言的库，因此你可以直接在代码中使用它，而无需使用\
  \ REST API。\n\n### Cloud Natural Language API\n\nCloud Natural Language API 允许你利用\
  \ Google 用于其搜索引擎的深度学习模型来分析文本。它也被 Google Assistant 所利用。\n\n它能够执行以下操作：\n\n- 提取有关实体（包括地点、人物和事件）的信息\n\
  - 对实体进行分类\n- 执行情感分析\n- 执行语法分析\n\n> **考试提示**\n> 预计考试中会出现有关 Natural Language API 的问题。请记住，它是分析自然人类语言的简便方法。使用它比自行开发模型更快。请记住上述功能，以便你能将其适应考试中给出的用例。\n\
  \n鉴于上述功能，该 API 可用于以下用例。\n\n它可用于分析文档、新闻、社交媒体或博客文章。结合 Speech-to-Text API，可分析呼叫中心通话的客户满意度。请注意，仅支持有限数量的语言。如果你的语言不受支持，你可以使用\
  \ Translation API 将文本转换为受支持的语言。\n\n让我们付诸实践！该 API 既可通过 REST API 访问，也可通过 gcloud ml\
  \ language 命令访问，文本可作为参数提供或从 Cloud Storage 上传。为了更好地可视化，我们将使用 Google 提供的 GUI 工具（https://cloud.google.com/natural-language）来分析一些示例文本：\n\
  \n```\nPackt has released a new book to help IT geeks learn GCP. The readers really\
  \ love it!\n```\n\n查看实体，我们可以看到找到了五个实体。每个实体都带有 Salience 属性（范围为 0–1），该属性规定该实体在句子中的重要性。值越高，其显著性就越高。对于某些实体，你还会获得\
  \ Wikipedia 链接，以便获取更多信息：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_450_0.png)\n\
  \n图 14.9 – Natural Language API – 实体\n\n对于情感分析，我们看到两个情感属性：\n\n- **Score**：范围从 -1（非常负面）到\
  \ 1（非常正面）\n- **Magnitude**：范围从 0 到无穷大，显示陈述的强度：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_451_0.png)\n\
  \n图 14.10 – Natural Language API – 情感\n\n现在，我们将前一句改为如下：\n\n```\nPackt has released\
  \ a new book to help IT geeks learn GCP. The readers think it is ok.\n```\n\n\n\n\
  \n\n我们可以看到，对于第二句话，Score 和 Magnitude 都已降为 0：\n\n## Entities\nSentiment\nSyntax\n\
  Categories\n\n## Document and Sentence Level Sentiment\n\nScore\nMagnitude\n\nEntire\
  \ Document\n\n0.1\n0.3\n\nPackt has released a new book to help IT geeks learn GCP.\n\
  \n0.3\n0.3\n\nThe readers think it is ok.\n\n0\n0\n\nScore Range\n0.25 – 1.0\n-0.25\
  \ – 0.25\n-1.0 – 0.25\n\n## Entity Level Sentiment\n\n1. Packt\nORGANIZATION\nSentiment:\
  \ Score 0 Magnitude 0\n\n2. book\nWORK OF ART\nSentiment: Score 0.4 Magnitude 0.4\n\
  \n3. IT geeks\nPERSON\nSentiment: Score 0.5 Magnitude 0.5\n\n4. GCP\nORGANIZATION\n\
  Sentiment: Score 0.3 Magnitude 0.3\n\n5. readers\nPERSON\nSentiment: Score -0.1\
  \ Magnitude 0.1\n\nFigure 14.11 – Natural Language API – Sentiment change\n\n**Syntax**\
  \ 选项卡显示了详细的语法信息：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_453_0.png)\n\nFigure\
  \ 14.12 – Natural Language API – Syntax\n\n最后，文本被归类为 **Computer & Electronics**，**Confidence**\
  \ 值为 0.67：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_453_1.png)\n\nFigure 14.13\
  \ – Natural Language API – Categories\n\n正如你所见，这是一个非常强大的 API，可以帮助你对文本进行深度分析。\n\n\
  请记住，这仍在开发中，新的功能将随着时间的推移而添加。\n\n## The Cloud Vision API\n\n**Cloud Vision API** 提供了视觉检测功能，包括以下内容：\n\
  \n- Image labeling\n- Face and landmark detection\n- **Optical Character Recognition\
  \ (OCR)**\n- Tagging explicit content\n\n你可以使用 https://cloud.google.com/vision/\
  \ 来测试此 API。你只需上传图像即可查看可能的分析结果。\n\n如果我们查看 **Faces** 选项卡，我们可以看到人脸和帽子被正确检测到。该服务还能够检测到喜悦的情绪，我可以确认这一点，因为照片中的人是我，当时玩得很开心：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_454_0.png)\n\nFigure 14.14 – Vision AI\
  \ – Faces\n\n在 **Objects** 选项卡中，我们可以看到大多数物体已被正确识别，尽管我不记得那天穿过裙子：\n\nFigure 14.15\
  \ – Vision AI – Objects\n\nLabels 选项卡揭示了图像如何被标记的分析。同样，大多数标签是有意义的，除了网球拍：\n\nFigure\
  \ 14.16 – Vision AI – Labels\n\n当我们查看 OCR 功能时，分析相当不错，特别是当我们查看 +Block 3 时，API 检测到了来自标志的\
  \ S，而该标志使用了奇特的字体：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_456_0.png)\n\n# Figure\
  \ 14.17 – Vision AI – Text\n\n最后，如果我们在图像下方展开 Show JSON 链接，我们还可以看到 REST API 的调用和响应会是什么样子：\n\
  \nFigure 14.18 – Vision AI – JSON response\n\n正如我们在前面的屏幕截图中所见，我们以 JSON 格式获得响应。这使我们能够轻松解析它，并在应用程序的代码中使用查询结果。\n\
  \n## The Cloud Video Intelligence API\n\nGoogle Cloud Video Intelligence 允许你分析已上传到\
  \ Cloud Storage 的视频。\n\n目前，以下功能可用：\n\n- **Labels:** 这些检测并标记实体，例如动物、植物和人。\n- **Shots:**\
  \ 这些检测视频中的场景变化并对其进行标记。\n- **Explicit content:** 这些是针对色情内容的显式内容注释。\n\n这可以有多种用例。视频元数据可以用描述其内容的标签创建，以便在媒体库中实现更好的搜索。此外，含有不当内容的视频可以被识别并从公共访问中移除。\n\
  \n## Dialogflow\n\n这实际上是 GCP 之外的工具，其起源于名为 **Api.ai** 的产品。它被开发用于使用自然语言处理进行人机交互。\n\
  \n它允许你创建所谓的 **agents** 和 **intents**，这些具有明确的可能对话场景。Dialogflow 能够根据用户用来展示特定意图的短语的可能变体自行训练。提供的短语越多，它学习触发意图的能力就越好：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_458_0.png)\n\nFigure 14.19 – Dialogflow\
  \ (Source: https://cloud.google.com/dialogflow/docs/intents-overview. License: https://creativecommons.org/licenses/by/4.0/)\n\
  \n当用户调用一个意图时，代理可以用简单的响应回答，或者可以进行更高级的操作。例如，可以将意图与定义的参数相关联进行分析。\n\n参数可以被提取并传递给所谓的\
  \ **fulfillment**，这基本上是 Firebase functions。开发人员可以生成 Node.js 代码以集成到 Dataflow 之外的第三方系统。这可用于检索信息或被要求执行特定操作。作为示例，可以向天气服务发出调用以获取特定位置的预报，或调用智能家居系统以关闭客厅的灯。Dialogflow\
  \ 可以使用 REST API 与你的应用程序或网站集成，或者你可以使用以下应用程序的一键式集成：\n\n- Google Assistant\n- Slack\n\
  - Facebook Messenger\n- Twitter\n- Skype\n- Amazon Alexa\n- Microsoft Cortana\n\n\
  Dialogflow 提供了三种类型的代理。你选择的取决于你的设计的先进程度：\n\n- **Dialogflow ES**: 适用于小型到中型以及简单到中等解决方案的标准代理。\n\
  - **Dialogflow CX**: 适用于大型和复杂解决方案的高级代理。\n- **Dialogflow Trial**: 这提供了 Dialogflow\
  \ ES 的功能，但配额有限。适用于实验。\n\n你可以通过访问以下链接找到这三种代理版本之间详细的比较：\nhttps://cloud.google.com/dialogflow/docs/editions.\n\
  \n## AutoML\n\n当预训练模型不适合用途时，AutoML 就派上用场了。作为示例，Vision API 可以识别沙发，*但如果我们想识别我们公司生产的特定沙发怎么办？*\
  \ Vision API 无法为我们做到这一点。\n\n在这种情况下，我们需要使用 AutoML 或训练我们自己的模型。正如你可能已经猜到的，前者是一种更简单的方法。AutoML\
  \ 从你那里获取数据集，训练并部署模型，然后通过 REST API 提供服务。这听起来有点像魔法，对吧？请看下面的图表：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_460_0.png)\n\
  \nFigure 14.20 – AutoML\n\n请注意，有五项服务可供你训练自定义模型：\n\n- **AutoML Vision**: 根据你自己定义的标签对图像进行分类。\n\
  - **AutoML Translation**: 执行翻译查询，返回特定于你领域的結果。\n- **AutoML Natural Language**: 将英语内容分类到自定义类别集。\n\
  - **AutoML Tables**: 将结构化数据转化为预测性洞察。\n- **AutoML Video Intelligence**: 允许你对视频片段进行分类。\n\
  \n让我们看一个例子。看看你将如何实际使用 AutoML，使用 Vision API 的示例，来识别你公司生产的桌子。简而言之，你需要做的是：\n\n1. 拍摄你桌子的多张照片。\n\
  2. 上传到 Cloud Storage。\n3. 创建一个带有照片标签的 CSV 文件。\n4. 将 CSV 文件提供给 AutoML 以训练模型。\n\n\
  一旦模型训练完成，你就可以通过 REST API 访问该模型，就像使用任何其他预训练模型一样。相当惊人，对吧？如果想看到 AutoML Vision 的实际效果，请查看\
  \ *Further reading* 部分中的 *AI adventures* 视频。\n\n## Summary\n\n在本章中，我们了解了 GCP 提供的\
  \ ML 服务。我们从 ML 理论开始，介绍基本概念和命名法，以便更好地理解实际服务。我们了解到，根据你的角色和使用场景，你需要做出正确的选择，选择对你最有效的服务。有时，一个目标可以使用两种或更多不同的服务来实现。我们还了解到，你不需要是数据科学家就可以利用\
  \ ML。那些知识非常有限的人可以使用预训练模型。如果这些模型对你的使用场景不够好，你可以尝试 AutoML，它允许在无需我们自行开发模型的情况下创建新模型。我们只需要向\
  \ GCP 提供适当的数据集即可。\n\n最后，对于那些拥有知识并能够自行开发模型的人来说，Vertex AI 是你可以用来自行开发和托管模型的服务。\n\n\
  在下一章中，我们将更详细地了解如何在 GCP 中保护我们的环境。\n\n## Further reading\n\n阅读以下文章以获取有关本章所涵盖内容的更多信息：\n\
  \n- **ML building blocks**: https://cloud.google.com/products/ai/\n- **Dialogflow**:\
  \ https://cloud.google.com/dialogflow/docs/\n- **ML Engine**: https://cloud.google.com/ml-engine/docs/\n\
  - **Cloud AutoML**: https://cloud.google.com/automl/docs/\n- **TensorFlow**: https://www.tensorflow.org/\n\
  - **AI adventures video**: https://www.youtube.com/watch?v=nKW8Ndu7Mjw\n- **Speech-to-Text**:\
  \ https://cloud.google.com/speech-to-text/docs/basics\n- **Vertex AI**: https://cloud.google.com/vertex-ai/docs\n\
  \n\n\n\n"
- "# 第 3 部分：\n安全、管理与监控 Google Cloud 解决方案\n\n在本部分中，我们将重点关注如何保护您的环境，如何使用各种工具管理 GCP，以及如何监控服务运行情况。\n\
  \n本书的这一部分包含以下章节：\n\n- 第 15 章，安全与合规\n- 第 16 章，Google Cloud 管理选项\n- 第 17 章，监控您的基础设施\n\
  \n## 15\n安全与合规\n\nGCP 的安全性从一开始就已内置，绝非事后考虑！在 GCP 提供的每项服务中，您都会看到安全是首要考虑的。在公有云时代，确实一次安全漏洞不仅会造成直接的财务影响，还可能对公司的未来业务产生不利影响。因此，GCP\
  \ 认为最好的方式是纵深防御，而非单一技术，并且它提供的<|message|>安全远超客户通常能够负担得起的本地复制方案。在本章中，我们将了解在考试中取得成功需要理解的关键主题，并尝试概述安全以及\
  \ GCP 对其的重视程度。\n\n在本章中，我们将涵盖以下主题：\n\n- 安全简介\n- Cloud Identity\n- 资源管理器\n- IAM\n\
  - 组织策略\n- 服务账号\n- 防火墙规则和负载均衡器\n- Cloud Security Scanner\n- 监控和日志记录\n- 加密\n- GCP\
  \ 中的渗透测试\n- 行业法规\n- CI/CD 安全概述\n- 其他安全服务\n\n### 安全简介\n\n让我们从对 GCP 安全方法做一个简要介绍开始本章。正如我们之前提到的，安全不是事后考虑，而是内置于其服务中。但在我们甚至考虑保护服务之前，我们需要承认\
  \ GCP 对安全有整体性的看法。这可以通过限制物理数据中心访问以及在软件栈中使用定制硬件和加固版操作系统来体现。\n\n> **重要提示**\n> Google\
  \ 使用了以安全为出发点的定制硬件，并在软件栈中使用了加固版 Linux，该系统会监控二进制修改并强制执行受信任的服务器启动。\n\n存储是任何云提供商的关键服务，GCP\
  \ 在所有存储服务上默认提供静态加密。这可以支持客户加密密钥，也可以代表客户管理密钥。在物理存储磁盘上，退役磁盘的扇区将被清零，如果数据无法删除，磁盘将被多级破碎机销毁。但是请注意，如果客户删除数据，物理删除可能需要\
  \ 180 天。\n\n此外，主要的安全问题之一是来自外部组织的攻击。为了保护我们免受互联网攻击，Google 提供了在前端注册的能力，这将检查传入网络连接的证书是否正确，并提供对\
  \ **分布式拒绝服务 (DDoS)** 攻击的防护。此外，使用 GCP 负载均衡器将提供额外的保护，而云 VPN 和直接连接则提供更多加密选项。\n\nGoogle\
  \ 大量投资于其基础设施的安全，该基础设施采用渐进式安全层设计。作为快速参考，让我们简要了解一下这些主要的基础设施安全层：\n\n- **保护底层基础设施：**\
  \ Google 采用多层物理保护。在设计和建设数据中心时，访问仅限于极少数 Google 员工。生物识别、金属探测、车辆屏障和激光入侵检测系统只是提供物理保护层所使用的一些技术。\n\
  \n除此之外，Google 还设计服务器主板和网络设备，使 Google 能够审查合作的供应商，并对组件提供的<|message|>安全属性进行审计和验证。定制硬件安全芯片使\
  \ Google 能够在硬件层面安全地识别和验证 Google 设备。\n\n最后，Google 对内核、BIOS 和基础操作系统等底层组件使用加密签名，以确保服务器机器正在启动正确的软件栈。\n\
  - **保护服务部署：** 服务是开发者编写的应用程序二进制文件，希望在 Google 的基础设施上运行。运行在 Google 基础设施上的每个服务都将有一个关联的服务账号身份，并由客户端使用以确保与预期服务器的通信。Google\
  \ 在应用层对服务间通信使用加密身份验证和授权。\n- **保护数据存储：** Google 的各种存储服务可以配置为使用中央密钥管理系统中的密钥在写入物理存储之前加密数据。这使\
  \ Google 的基础设施能够将其自身与潜在威胁例如恶意磁盘固件隔离开来。硬盘和 SSD 中使用的硬件加密支持也可以跟踪每个驱动器的生命周期。\n- **保护互联网通信：**\
  \ Google 的基础设施由大量物理机器组成，通过局域网和广域网连接，因此需要防御 DoS 攻击。这通过仅将一小部分机器直接暴露给外部互联网流量来帮助实现。还有诸如\
  \ Cloud Armor 之类的服务，可帮助防止 DoS 攻击。\n\n此外，多因素身份验证也有助于保护互联网通信。\n- **运营安全：** Google\
  \ 还需要安全地运营基础设施。Google 拥有代码库和框架，可消除 Web 应用中的 XSS 漏洞，以及自动检测安全漏洞的工具。他们还提供漏洞赏金计划，奖励任何能够发现漏洞的人，并在入侵检测方面投入大量精力。\n\
  \n> **考试提示**\n> 我们将讨论的安全深度超过了您在考试中取得成功所需的程度；然而，对于云架构师的角色来说，了解这些信息至关重要。对于考试，我们建议您重点关注以下几个方面：了解\
  \ Cloud IAM 角色，了解 Cloud Identity 是什么，了解 **密钥管理服务 (KMS)** 的作用，了解 **客户提供加密密钥 (CSEKs)**\
  \ 与 **客户管理加密密钥 (CMEKs)** 之间的区别，了解静态加密和传输中加密，并了解 PCI 合规性。\n\n### 共享责任模型\n\n在深入研究安全选项之前，重要的是要指出，与其他主要公有云厂商一样，GCP\
  \ 也有所谓的共享责任协议。正如我们之前提到的，Google 在其基础设施安全方面投入了大量精力。然而，作为平台的消费者，我们也有责任。\n\nGoogle 不对操作系统中存在的内容负责。了解共享责任原则对考试很重要。Google\
  \ 不会对您架构中的所有内容负责，因此我们必须准备好承担我们应有的责任。对于考试，我们应该理解，所提供的不同 GCP 服务意味着 Google 和客户将承担不同程度的责任。例如，让我们看一下\
  \ Cloud Storage。Google 将管理存储的加密和提供服务的硬件，并允许审计日志记录。然而，它不对存储在 Cloud Storage 上的内容或用于访问它的网络安全负责。同样，对内容的访问和身份验证将由所有者负责。将此与例如\
  \ BigQuery 进行比较，后者是 PaaS 方案。在这种情况下，Google 将承担网络安全和身份验证的责任。\n\n\n\n\n\n以下图表显示了客户在每种服务模型中预期需要管理的对象。从左到右，我们可以看到完全自管理的本地数据中心与\
  \ SaaS 服务之间的差异：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_469_0.png)\n\n图 15.1\
  \ – 共享责任模型\n\n现在我们已经从高层次介绍了安全，接下来让我们开始了解 GCP 中的 Cloud Identity。\n\n## Cloud Identity\n\
  \nCloud Identity 是 Google 作为身份即服务（IDaaS）解决方案提供的关键 GCP 服务。这是一项可选服务，也可以采用更基础的方法将单个权限应用于服务或项目。然而，对于企业组织而言，使用身份服务更有意义。它使企业能够从单一视图中管理谁可以访问其\
  \ GCP 组织中的资源和服务。Cloud Identity 可作为独立产品用于基于域的用户账户和组。我们应该在本书的早期就指出，Google 还为 Google\
  \ Workspace 用户提供了一个类似的管理面板。控制台的工作方式相同，用户和域管理也有很多相似之处。你可能希望进一步详细研究，但对于本书以及更重要的是考试，我们将仅专注于\
  \ GCP Cloud Identity。\n\n与可减少用户管理开销的许多本地目录类似，GCP 允许我们通过 Cloud Identity 在云中集中管理用户。它提供了一个集中、单一的视图来管理用户、组和设置，被称为\
  \ Google 管理控制台。要使用 Cloud Identity，你的域名应已启用以接收电子邮件，从而允许你现有的网页和电子邮件地址正常使用。你的 GCP 组织将拥有一个\
  \ Cloud Identity，而组织是资源层次结构中的根节点。它被视为你项目的超节点。\n\n需要注意的是，Cloud Identity 有两个版本。一个是免费的，一个是高级订阅。高级订阅提供额外的功能，例如设备管理以及安全和应用管理。完整的比较可以在这里找到：https://support.google.com/cloudidentity/answer/7431902?hl=en。最后，你必须明白\
  \ Cloud Identity 并非通过 GCP 控制台控制，而是通过 Google 管理控制台控制。一旦登录到管理控制台，你将能够添加用户、创建组、分配成员并禁用用户。\n\
  \n以下是 **Google 管理** 控制台页面的截图：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_470_0.png)\n\
  \n图 15.2 – Google 管理控制台\n\n手动添加用户在工作量方面被视为开销，如果你有大型环境需要管理，则不可扩展。Cloud Identity 的全部意义在于简化用户和组的管理，因为不太可能有组织能负担得起一个人来添加、删除和管理事物。这就是\
  \ Google Cloud Directory Sync（GCDS）的用武之地。许多组织将拥有 LDAP 数据库，例如 Microsoft Active Directory（AD）。GCDS\
  \ 可以将组织的 AD 或 LDAP 数据库同步到 Cloud Identity，并且具有高度可扩展性。同步仅为单向——即从本地到 GCP——因此你的现场数据库永远不会被破坏。GCDS\
  \ 允许管理员执行增量同步和计划同步并手动执行任务。如果我们需要撤销用户的权限或确实禁用用户，则结果是即时的。\n\n当我们开始使用 Cloud Identity\
  \ 进行身份验证时，Google 默认存储和管理所有身份验证和密码，但可以禁用此选项。可以通过使用多因素工具添加双重验证。还有一种替代方案是使用单点登录（SSO），这是一种基于\
  \ SAML 2.0 的身份验证，也包括多因素身份验证（MFA）。最后，可以在 Cloud Identity 的密码管理功能中设置密码复杂度，以符合企业可能已有的现有策略：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_471_0.png)\n\n图 15.3 – 密码管理\n\n在前面的截图中，我们可以看到密码管理屏幕的示例。在下一节中，我们将查看\
  \ GCP 资源管理器。\n\n## 资源管理器\n\nGCP 资源管理器允许你创建和管理对象（如组织、文件夹和项目）的层次结构分组。让我们看一个例子，我们有一个组织\
  \ brgerrard.co.uk，并在其下有几个文件夹以增加结构。文件夹是可选的，但可用于对项目进行分组。对这些文件夹的访问将按层次模型工作，这意味着如果你对\
  \ Departments 文件夹拥有完全访问权限，则此权限将继承到例如 Google Cloud Architect Project 文件夹，如以下截图所示：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_472_0.png)\n\n图 15.4 – 资源管理器\n\n一个很好的例子是\
  \ GCP 中开发、测试和生产环境的分离。每个环境使用单独的项目，允许你仅授予需要访问资源的人员访问权限。以下截图显示了 GCP 层次结构的设置方式：\n\n\
  ![](img/de2c97ab017f36b3750a5bade111edd7_473_0.png)\n\n图 15.5 – GCP 层次结构（来源：https://cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy，许可：https://creativecommons.org/licenses/by/4.0/legalcode）\n\
  \n重要的是要理解，在更高级别设置权限会导致权限继承。例如，向用户授予 Dept Y 文件夹的权限意味着用户还将对所有子文件夹和项目应用相同的权限。因此，设计组织和权限时非常重要，只能授予履行所请求角色所需的资源访问权限。\n\
  \n在下一节中，我们将查看身份和访问管理。\n\n## 身份和访问管理（IAM）\n\nGCP 为我们提供了创建 GCP 资源并管理谁可以访问它们的能力。它还允许我们仅授予必要的特定访问权限，以防止任何不需要的访问。它允许我们满足职责分离的任何要求。这被称为最小权限的安全原则，我们将很快详细讨论。首先，我们将看一下\
  \ IAM 的一些关键概念。在 Cloud IAM 中，我们可以向成员授予访问权限。成员可以属于以下任何一种类型：\n\n- **Google 账户：** 这些代表与\
  \ GCP 交互的人员，例如开发人员。\n- **服务账户：** 这些属于你的应用程序而不是最终用户。我们将在本章后面 *服务账户* 部分更详细地介绍服务账户。\n\
  - **Google 群组：** 这些是 Google 账户和服务账户的有名集合，是向用户集合授予访问策略的好方法。Google 群组可与 IAM 结合使用以授予角色访问权限。一个重要的例外是，如果群组属于同一组织，则群组只能被分配项目的拥有者角色。\n\
  - **Google Workspace 域：** 此域代表在组织的 Google Workspace（前身为 G Suite）中创建的所有 Google 账户的集合。\n\
  - **Cloud Identity 域：** 与 Google Workspace 类似，此域代表组织中的所有 Google 账户。\n\n以下是与访问管理相关的一些概念：\n\
  \n- **资源：** 资源是项目、Compute Engine 实例或 Cloud Storage 存储桶。\n- **权限：** 权限规定了对资源允许的操作，并以\
  \ <service>.<resource>.<verb> 的形式显示；例如，`compute.instance.list`。权限不能直接分配给用户。\n- **角色：**\
  \ 角色是权限的集合。为了向用户提供对资源的访问，我们授予他们角色而不是直接向用户分配权限。角色有三种类型——即 **基础**、**预定义** 和 **自定义**——我们将在本章后面讨论。请注意，基础角色最初被称为\
  \ *原始角色*。\n\n\n\n\n\n- **IAM 策略**：IAM 策略是一组语句的集合，用于定义谁拥有何种类型的访问权限。您可以将策略附加到资源上，并在资源被访问时使用它来强制执行访问控制。\n\
  \n> **重要说明**\n> 在 IAM 中，您将向 *主体* 授予访问权限。这些主体可以是以下类型之一：Google 群组、Google 账号、服务账号、Cloud\
  \ Identity、Google Workspace 域、所有经过身份验证的用户或所有用户。\n\n现在我们对 IAM 有了一些背景知识，让我们继续看一些示例。我们之前提到过最小权限原则，现在我们知道应该只授予所必需的访问权限。\n\
  \n我们将在以下示例中查看 `Google Cloud Architect Project` 文件夹的权限。我们可能有一个用户应该能够在所有文件夹中创建项目，但我们也可能有另一个用户只能在特定文件夹中创建项目。在下面的屏幕截图中，我们正在授予名为\
  \ `konrad@brgerrard.co.uk` 的用户 **项目创建者** 角色：\n\n## 文件夹 \"Google Cloud Architect\
  \ Project\" 的权限\n\n这些权限会影响此文件夹及其所有资源。了解更多\n\n![](img/de2c97ab017f36b3750a5bade111edd7_475_0.png)\n\
  \n图 15.6 – 应用权限\n\n**基本** 角色是在 Cloud IAM 之前存在的。这些是旧的 **所有者**、**编辑者** 和 **查看者** 角色。由于这些角色有限，应用其中任何一个角色意味着授予广泛的权限范围。这并不完全遵循我们的最小权限原则！然而，我们应该理解，可能存在一些我们希望使用原始角色的情况。例如，我们可能在一个小型跨职能团队中工作，IAM\
  \ 的粒度并不必需。同样，如果我们在测试或开发环境中工作，那么我们可能不希望应用完全的细粒度权限。\n\n如果我们想要更细粒度，应该使用 **预定义** 角色并基于工作职能来设定角色。这些角色由\
  \ Google 创建和维护，因此每当 Google Cloud 添加新功能或服务时，权限都会自动更新。以下以 **App Engine** 的预定义角色为例：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_476_0.png)\n\n图 15.7 – 预定义角色\n\n如果我们想要创建具有特定权限的角色，而不是使用\
  \ Google 提供的集合，那么我们可以使用 **自定义** 角色。这些可以根据我们的需求提供更细粒度的控制，但需要注意的是它们由用户管理，因此会带来额外开销。然而，它们可以防止对其他资源的非预期访问。在创建自定义角色之前，我们应始终检查现有的预定义角色\
  \ – 或预定义角色的组合 – 是否已满足我们的需求。\n\n逐个授予角色访问权限可能很繁琐，理想情况下，我们应该使用群组来控制访问。作为示例，让我们从我们的\
  \ Cloud Identity 管理控制台创建一个名为 `Project Creator` 的新群组。回顾 **身份和访问管理 (IAM)** 部分中的 *图\
  \ 15.2*，我们可以通过浏览到 **群组** 字段并点击 **添加新群组** 来完成此操作：\n\n- 1. 为群组命名，如以下屏幕截图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_477_0.png)\n\
  \n图 15.8 – 创建新群组\n\n2. 在我们的 GCP 控制台中将其应用到资源。在此示例中，我们将群组分配给一个文件夹：\n\n## 向 \"Google\
  \ Cloud Architect Project\" 文件夹添加成员、角色\n\n在下方输入一个或多个成员。然后为这些成员选择一个角色，以授予他们访问您资源的权限。可以授予多个角色。了解更多\n\
  \n新成员\nprojectcreator@brgerrard.co.uk\n角色\n项目创建者\n有权创建新的 GCP 项目。\n+ 添加另一个角色\n保存\
  \ 取消\n\n图 15.9 – 添加群组成员\n\n现在，我们可以集中控制对资源的权限，而无需在 GCP 控制台中深入文件夹结构。这也提供了职责分离以提高安全性。现在我们已经创建了项目，我们希望允许用户仅创建\
  \ VM 实例。\n\n假设作为项目所有者，我们希望允许一名工程师创建 VM 实例，但希望另一名工程师对该计算资源只有只读访问权限。同样，我们可以在 Cloud\
  \ Identity 中为此目的创建两个新群组；我们称它们为 vmviewer 和 vmadmin。我们可以为这些群组分配相关角色。使用预定义角色意味着它们由\
  \ Google 管理，任何添加到角色的额外权限都意味着您的成员会自动获得这些权限。\n\n我们的 vmviewer 群组现在已在项目级别分配了 Compute\
  \ Viewer 角色，如以下屏幕截图所示。请注意，我们也可以添加条件。IAM 条件是一个或多个规则，在与之关联的角色被允许之前必须评估为真。例如，您可能只希望\
  \ IAM 角色在一天中的特定时间适用：\n\n图 15.10 – 分配角色\n\n我们的 vmadmin 群组现在已在项目级别分配了 Compute Instance\
  \ Admin 角色：\n\n图 15.11 – 分配角色\n\n我们也可以使用 gcloud CLI 来添加权限。此命令行允许我们管理与 GCP API 的交互。例如，如果我想将编辑者角色分配给\
  \ redwing 项目中的 brian@brgerrard.co.uk，那么我可以运行以下命令：\n\n```\ngcloud projects add-iam-policy-binding\
  \ redwing -\nmember='user:brian@brgerrard.co.uk' -role='roles/editor'\n```\n\n此命令的输出将确认\
  \ brian@brgerrard.co.uk 已被授予编辑者角色。\n\n此 gcloud projects 命令行也可以用于更多功能。请注意，我们将在第 16\
  \ 章《Google Cloud 管理选项》中更深入地探讨 gcloud 命令行。\n\n> **重要说明**\n> 如果您想更深入地使用，请参阅官方文档：https://cloud.google.com/sdk/gcloud/reference/projects/。\n\
  \n最后，关于 IAM，我们讨论了谁有权对资源执行操作。我们也应注意组织策略关注的内容。这些策略允许我们对资源设置限制。组织策略将允许我们禁用用户可用的某些选项。这些限制是使用约束完成的，可以应用于\
  \ GCP 服务或 GCP 服务列表。例如，假设我们不希望默认网络可用。我们可以设置一个约束来跳过默认网络创建，从而防止在此网络上创建任何新的 VM 实例。\n\
  \n之前，我们提到过服务账号的重要性。我们现在将更深入地研究它们。\n\n# 服务账号\n\n服务账号用于调用服务的 API，从而将用户从直接参与中移除。它们属于应用程序或\
  \ VM 实例。默认情况下，我们创建的每个 GCP 项目在启用项目使用 Compute Engine 时都会创建一个默认服务账号：\n\n- 1. 我们可以通过导航到\
  \ GCP 控制台上的 **IAM 与管理 | IAM | 服务账号** 来创建新的服务账号。我们也可以使用 gcloud CLI 创建新的服务账号。例如，假设我们需要一台具有\
  \ Cloud Storage 访问权限的 VM。以下屏幕截图显示我们正在创建一个名为 AccessCloudStorage 的新服务账号：\n\n## 服务账号详情\n\
  \n图 15.12 – 添加服务账号\n\n2. 一旦我们决定将服务账号用于我们的资源，我们就可以决定是否要向服务账号授予特定角色。以下屏幕截图显示在分配角色时我们有可选选择：\n\
  \n## 授予此服务账号对项目的访问权限（可选）\n\n授予此服务账号对 qwiklabs-gcp-04-57af14ff7666 的访问权限，以便它有权在您的项目资源上完成特定操作。了解更多\n\
  \n图 15.13 – 授予此服务账号对项目的访问权限\n\n\n\n\n\n3. 可选地，我们可以向需要以此服务账号执行操作的<|message|>用户或组授予访问权限：\n\
  \n### 授予用户访问此服务账号的权限（可选）\n\n授予需要以此服务账号执行操作的<|message|>用户或组访问权限。了解更多\n\n![](img/de2c97ab017f36b3750a5bade111edd7_482_0.png)\n\
  \n图 15.14 – 分配角色\n\n如果我们重新审视创建虚拟机实例的过程，我们可以在 Identity and API access 选项下分配此服务账号：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_482_1.png)\n\n图 15.15 – Identity and\
  \ API access\n\n这将允许服务账号承担服务账号身份以进行 API 请求的身份验证。正如我们之前提到的，我们可以看到我们有将我们创建的账号分配给服务账号的选项。\n\
  \n如果选择默认服务账号，你会注意到有选择访问范围的选项。访问范围决定了 API 调用对服务的访问级别。最佳实践是为每个服务单独选择每个 API 的访问权限以提高安全性。以下是当前可用的完整\
  \ API 列表：\n\nAccess scopes\nAllow default access\nAllow full access to all Cloud\
  \ APIs\nSet access for each API\n\nBigQuery\nNone\n\nBigtable Admin\nNone\n\nBigtable\
  \ Data\nNone\n\nCloud Datastore\nNone\n\nCloud Debugger\nNone\n\nCloud Pub/Sub\n\
  None\n\nCloud Source Repositories\nNone\n\nCloud SQL\nNone\n\nCompute Engine\nNone\n\
  \nService Control\nEnabled\n\nService Management\nRead Only\n\nStackdriver Logging\
  \ API\nWrite Only\n\nStackdriver Monitoring API\nWrite Only\n\nStackdriver Trace\n\
  Write Only\n\nStorage\nRead Only\n\nTask queue\nNone\n\nUser info\nNone\n\n图 15.16\
  \ – API 列表\n\n服务账号使用服务账号密钥进行管理。有两种类型的服务账号密钥：\n\n- **Google Cloud-managed**：Google\
  \ Cloud-managed 密钥由 Compute Engine 和 App Engine 等服务使用，无法下载。\n- **User-managed**：User-managed\
  \ 密钥由 GCP 用户创建，可以下载和管理。你对 user-managed 密钥负全责。\n\n我们将在本章的 *Encryption* 部分讨论密钥管理。\n\
  \n在结束对服务账号的讨论之前，最后一点需要注意的是，服务账号仍应遵循我们关于 IAM 所学到的相同原则。服务账号应仅获得该服务所需的最小权限集。\n\n> **Exam\
  \ Tip**\n> 对于考试而言，这一主题是关键，以便你理解身份、角色和资源。我们在前几章中简要涉及了 IAM，但现在，我们希望更详细地研究它。在阅读进一步内容之前，需要注意的一些原则将在本章中更详细地解释如下：IAM\
  \ 角色是可以分配给用户、组或服务账号的权限组；有不同类型的角色；我们应遵循最小权限原则；并且在可能的情况下，使用组来控制访问，而不是授予单个用户的访问权限。\n\
  \n在本节中，我们介绍了服务账号。我们解释了它们是一种特殊的账号类型，可以将用户从直接参与中移除，并且它们是 Google IAM 的重要组成部分。在下一节中，我们将查看访问控制列表，它是\
  \ IAM 的替代方案。\n\n## Cloud Storage 访问管理\n\n除了使用 IAM 权限来限制对 Cloud Storage 的访问外，还可以使用\
  \ **Access Control Lists (ACLs)** 来保护它。ACLs 应在你希望对对象而不是整个存储桶设置权限时使用，例如，要访问特定存储桶中的单个对象。这是因为\
  \ Cloud IAM 会将权限应用于存储桶中的所有对象。了解这一点至关重要，因为从可管理性角度来看，单独管理这些对象并不理想，如果存储桶中所有对象的权限有共同之处，则应使用\
  \ IAM 来控制访问。\n\nACL 由定义可以执行的操作的权限以及定义谁可以执行该操作的范围组成。当对存储桶发出请求时，ACL 将在适用时授予用户权限；否则，请求将导致\
  \ 403 Forbidden 错误。存储桶中的对象只能被授予 Owner 或 Reader 权限，如以下屏幕截图所示：\n\n### 编辑 notes.txt\
  \ 权限\n\n如果你不依赖单个对象级权限，可以开始在存储桶级别统一管理所有权限。转到存储桶的 Permissions 选项卡开始。了解更多\n\n![](img/de2c97ab017f36b3750a5bade111edd7_485_0.png)\n\
  \n图 15.17 – GCP 存储桶文件权限\n\n> **Important Note**\n> 除了 ACL 之外，GCP 还提供 Storage Legacy\
  \ bucket Owner、Storage Legacy bucket Reader 和 Storage Legacy bucket Writer 的传统角色。\n\
  \n与 IAM 一样，我们应遵循最小权限原则。如果你需要使用 ACL，则不要在不需要时应用所有者角色。你应注意确保存储桶不会不必要地公开（通过分配 allUser\
  \ 角色）。为存储桶分配错误的权限是现实世界中非常典型的安全漏洞，在应用 ACL 之前应仔细考虑。\n\n在考试前你应该了解的最后一点信息是使用签名 URL 的用法。此选项允许你授予访客访问权限，以便他们无需\
  \ Google 账号即可从存储中上传或下载。访问可以是时间限制的，并且可以为拥有该 URL 的任何人授予读取或写入访问权限。我们可以通过运行以下命令使用 gsutil\
  \ 创建签名 URL：\n\n```\ngsutil signurl -d 10m Desktop/private-key.json gs://example-bucket/cat.jpeg\n\
  ```\n\n在此示例中，我们使用 private-key.json 作为我们的服务账号私钥来公开 example-bucket 中的 cat.jpeg 存储桶对象。\n\
  \n> Exam Tip\n> 请记住，我们绝不应授予用户或服务超出所需范围的权限。始终使用最小权限原则。\n\n接下来，我们将查看 Organization\
  \ Policy Service。\n\n## Organization Policy Service\n\nOrganization Policy Service\
  \ 为我们提供对组织云资源的编程控制。这允许集中控制以配置组织资源的配置方式。此外，它有助于开发团队保持在合规边界内，并帮助项目所有者快速移动而无需担心或破坏合规性。\n\
  \n重要的是要强调 Organization Policies 与我们之前讨论的 IAM 不同。虽然 IAM 专注于允许管理员根据权限授权谁可以对特定资源执行操作，但\
  \ Organization Policies 专注于允许管理员对特定资源设置限制以确定它们如何配置。组织策略是一组限制，作为管理员，我们定义策略以强制对组织、文件夹或项目实施限制。\n\
  \n为了定义此类策略，我们会选择一种特定类型的限制，称为 **constraint**。约束应用于 Google Cloud 服务或服务列表。本质上，这是定义受控行为的蓝图。约束具有类型，要么是\
  \ list 要么是 Boolean。正如你所猜测的，list 约束将评估管理员设置的一组允许或拒绝的值。例如，这可以是可以连接到虚拟机的允许 IP 地址列表。Boolean\
  \ 约束将要么强制执行要么不强制执行。\n\n当策略设置在资源上时，该资源的所有后代默认会继承该策略。具有 **Organization Policy Administrator**\
  \ 角色的用户可以在需要例外时修改此继承。\n\n违规是指服务以违反组织策略限制的状态行事的情况。这可能发生在新策略对服务已处于的状态或操作设置限制时。\n\n\
  要创建 Organization Policy，请导航到 **IAM & Admin | Organization Policies**。这将列出可用的策略：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_487_0.png)\n\n图 15.18 – Organization\
  \ Policies\n\n\n\n\n\n作为示例，以下策略已被选中。每个策略都描述了约束条件以及其当前的应用方式。我们可以看到，默认情况下它将被继承。如果我们被允许编辑策略，我们可以编辑策略并更改有效策略：\n\
  \n## Cloud IAM 中工作负载的允许外部身份提供者\n\n可在 Cloud IAM 中为工作负载身份验证配置的身份提供者，以 URI/URL 指定。\n\
  \n适用于\n\n项目 \"qwiklabs-gcp-03-a95088461796\"\n\n继承\n\n已继承\n\nID\n\nconstraints/iam.workloadIdentityPoolProviders\n\
  \n有效策略\n\n允许\n\n全部\n\n推荐\n\n无\n\n图 15.19 – 策略描述\n\n重申一下，组织策略对于考试成功非常重要理解。请确保您了解它们与\
  \ IAM 的区别。\n\n接下来，让我们回顾防火墙规则和负载均衡器。\n\n## 防火墙规则和负载均衡器\n\n我们在第 10 章《GCP 中的网络选项》中已经介绍过网络，但我们想回顾一下从安全角度来看重要的内容。\n\
  \n如果 Compute Engine 实例不需要相互通信，那么我们应该将它们托管在不同的虚拟私有云（VPC）网络上。此外，如果我们有一个由不同网络层上的服务器组成的应用程序，那么每个服务器都应该位于不同的子网中。让我们以传统的\
  \ Web 应用和数据库应用程序为例。我们希望将每个层分割到不同的子网中。\n\n防火墙规则是保护网络的明显选择。正如您现在所知，VPC 允许您隔离网络以实现计算资源之间的分段。防火墙规则允许您通过根据方向、源或目标、协议和优先级允许或拒绝流量来控制入站和出站流量的流动。以下屏幕截图显示了新防火墙规则的创建：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_489_0.png)\n\n图 15.20 – 新防火墙规则\n\n需要注意的是，GCP\
  \ 中的防火墙规则是有状态的，这意味着如果一条规则由一个方向上的 **Allow** 规则发起，则流量将被自动允许返回。同样，您还应该了解，所有 VPC 都有两条默认规则。第一条允许所有传出连接到任何\
  \ IP 地址，而第二条阻止所有传入流量。这些被分配了最低优先级，这意味着它们可以很容易地被您的自定义规则覆盖。应用于新 VPC 的其他规则允许所有协议和端口在实例之间的入站连接。其他规则允许\
  \ ICMP 流量（`ping/trace route`）、SSH 和 RDP 从任何源到 VPC 中的任何目标。\n\n与 IAM 一样，对于防火墙规则，我们也应使用最小权限原则。也就是说，我们应该只允许应用程序所需的通信，并限制任何不需要的内容。被认为是一种良好做法的做法是创建一个优先级较低的规则来阻止所有流量，然后在上面叠加具有更高优先级的相关规则。\n\
  \nGCP 中的负载均衡器也提供额外的安全性。负载均衡器支持 SSL 和 HTTPS 代理以实现传输中加密。要求至少有一个签名的 SSL 证书安装在负载均衡器的目标\
  \ HTTPS 代理上，您可以选择使用自管理 SSL 证书或 Google 管理的 SSL 证书。看起来很明显，如果您需要使用 HTTPS 流量，则应选择 HTTPS\
  \ 负载均衡器，但对于非 HTTPS 流量，您应使用 SSL 负载均衡器。\n\n在下一节中，我们将介绍 Cloud Web Security Scanner。\n\
  \n## Cloud Web Security Scanner\n\n将应用程序安全视为与基础设施安全同等重要是很重要的。应用程序是攻击的主要目标之一，GCP\
  \ 通过 Web Security Scanner 服务来帮助实现这一点。当然，我们知道安全是一个极其重要的主题，Cloud Web Security Scanner\
  \ 支持我们轻松检测服务中的漏洞。\n\n当您创建扫描时，您可以将其设置为扫描您的 Compute Engine 实例、App Engine 实例或 GKE 实例托管的\
  \ URL，同样也可以排除 URL。它将检测常见的漏洞，例如 flash 注入、混合内容、明文密码和 XSS。我们还可以设置扫描计划或手动执行。\n\n**重要说明**\n\
  需要注意的是，Cloud Scanner 可以对您的应用程序产生真实负载，因此性能应予以考虑，因为某些扫描可能需要数小时才能完成。同样，在使用此服务时应谨慎，因为它可能会在网页的评论区发布评论，或在页面上提示注册时生成多封电子邮件。因此，良好的做法是在测试环境中扫描您的应用程序，并在启动扫描前备份应用程序的状态。\n\
  \n以下屏幕截图显示我们正在创建新的扫描。首先，我们必须导航到 **App Engine | Security Scan**。我们必须然后点击 **Enable\
  \ API**。我们现在准备创建新的扫描：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_491_0.png)\n\n\
  图 15.21 – 新安全扫描\n\n当我们运行扫描后，我们将收到结果，其中会标记任何漏洞，如以下屏幕截图所示。我们还可以查看扫描的日期和扫描的持续时间：\n\n\
  ![](img/de2c97ab017f36b3750a5bade111edd7_492_0.png)\n\n图 15.22 – 安全扫描结果\n\n在本节中，我们查看了\
  \ Cloud Web Security Scanner 并向您展示了如何设置新的扫描。在下一节中，我们将涉及监控和日志记录。\n\n## 监控和日志记录\n\n\
  我们将在第 17 章《监控您的基础设施》中更详细地介绍监控，但从安全角度来看再次提及是明智的。Cloud Operations 是 Google 用于监控和管理服务、容器、应用程序和基础设施的服务。Cloud\
  \ Operations 提供错误报告、调试、警报、跟踪和日志记录。\n\n日志记录有助于保护 GCP 并最大限度地减少应用程序的停机时间。监控允许您监控可能标记异常的应用程序指标。此外，Cloud\
  \ Operations Debugger 检查生产数据的状态并在没有任何性能开销的情况下比较源代码。日志记录允许实时指标日志记录并保留一段时间，具体取决于日志类型。如果您有安全要求需要更长时间保留日志，则可以将它们导出到\
  \ Cloud Storage，后者为长期提供经济实惠的存储。\n\n## 加密\n\n加密是敏感数据的基本安全形式。以最简单的形式，加密是将明文数据转换为乱码字符字符串的过程。我们无法阅读这些字符串，更重要的是，如果系统没有解密回明文格式的相关密钥，则无法读取它们。\n\
  \n加密是 GCP 安全的关键要素。默认情况下，GCP 提供静态加密，这意味着存储在 GCP 存储服务上的数据在无需用户进一步操作的情况下即已加密。这意味着无需额外的配置，即使这些数据以某种方式落入错误的人手中，数据也无法读取，因为他们没有正确的加密密钥来理解数据。\n\
  \n通过 GCP 加密敏感数据的能力确保客户的机密数据保持安全。其核心保护是 GCP KMS，Google 使用它来管理云服务的加密密钥。Cloud KMS 允许您生成、使用、轮换和销毁加密密钥，这些密钥可以由\
  \ Google 生成或从您的 KMS 系统导入。Cloud KMS 与 Cloud IAM 集成，因此您可以管理单个密钥的权限。例如，当我们创建新磁盘时，默认选项是使用\
  \ Google 管理的密钥。\n\n现在，让我们来看看数据加密密钥和密钥加密密钥。\n\n## 数据加密密钥与密钥加密密钥\n\n用于加密数据片段的密钥称为\
  \ **数据加密密钥（DEK）**。这些密钥随后会被 **密钥加密密钥（KEK）** 包装。KEK 存储并在 Google Cloud 的 KMS 中管理，使\
  \ Google 能够从中央点跟踪和控制访问。不可能从 KMS 导出您的 KEK，并且所有密钥的加密和解密必须在 KMS 内部进行。此外，KMS 托管的密钥会备份用于灾难恢复。KEK\
  \ 也会在一定时期内轮换，这意味着会创建一个新密钥。这使 GCP 能够遵守某些法规，例如 **支付卡行业数据安全标准（PCI DSS）**，并且被认为是一种安全最佳实践。GCP\
  \ 默认每 90 天轮换一次密钥。\n\n## CMEK 与 CSEK\n\nGCP 提供额外的加密密钥管理方法，可能更符合客户的安全策略。\n\n\n\n\n\
  \nGCP 提供了客户管理 KEK 的能力，让我们能够控制密钥的生成、密钥的轮换以及密钥的过期。密钥仍将存储在 KMS 中，但我们将控制其生命周期。这被称为 CMEK。为了有效组织密钥，Google\
  \ Cloud KMS 使用密钥环的概念将密钥分组在一起并将继承的权限推送到密钥。\n\n我们可以通过执行多个步骤来创建我们的密钥。让我们开始吧：\n\n1.\
  \ 通过从 GCP 控制台浏览到 **Security | Key Management**，我们可以创建新的密钥环。密钥环将密钥分组在一起。我们必须做的第一件事是启用\
  \ IP，然后选择密钥环位置。我们可以选择一个区域，也可以选择 **global**。我们的决定会影响使用该密钥的应用程序的性能以及创建密钥时可用的选项。在以下示例中，我们选择了\
  \ **global**。全局位置是一种特殊的跨区域位置，其数据中心分布在世界各地，并且无法控制所选的确切数据中心。我们只有在应用程序分布在全球、读写操作不频繁且密钥没有地理驻留要求时才应使用\
  \ **global**：\n\n## Create key ring\n\nKey rings group keys together to keep them\
  \ organized. In the next step, you’ll create keys that are in this key ring. Learn\
  \ more\n\nProject name\nqwiklabs-gcp-03-e5a43cc9b75e\n\nKey ring name *\ngcp-architect-key-ring\n\
  \nKey ring location *\nglobal\n\nCREATE   CANCEL\n\nFigure 15.23 – Create key ring\n\
  \n一旦我们创建了密钥环，我们将被提示创建密钥。我们可以在密钥环下创建多个密钥，这些密钥将负责加密和解密数据。创建新密钥时，您可以看到我们有设置密钥用途的选项；例如，密钥是否仅用于加密、解密或两者兼有。\n\
  \n> Tip\n> 在决定选择哪个位置时，应考虑网络性能。\n\n2. 我们要做的第一个选择是我们想要什么类型的密钥。我们有以下选项。正如我们选择了全局密钥环一样，我们无法选择外部管理的密钥。我们可以从描述中看出，生成的密钥是标准客户管理的加密密钥：\n\
  \n## What type of key do you want to create?\n\n- Generated key\n  A standard customer\
  \ managed encryption key. The key material will be generated for you.\n  Learn more\n\
  - Imported key\n  For importing your key material into GCP. Learn more\n- Externally\
  \ managed key\n  The key material will be stored in an external key manager. Learn\
  \ more\n\nFigure 15.24 – Selecting the type of key\n\n3. 此外，我们还可以选择轮换周期以及密钥有效期的开始时间。创建密钥后，我们可以通过\
  \ GCP 控制台管理轮换周期、禁用和重新启用密钥，或完全删除密钥。以下屏幕截图显示了我们创建新密钥的过程：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_496_0.png)\n\
  \nFigure 15.25 – Create key\n\nKMS 密钥结构的一个重要方面是密钥版本。每个密钥可以有多个版本，按顺序编号，从 1 开始。我们可能使用相同的密钥但使用不同的密钥版本来加密文件。Cloud\
  \ KMS 会自动识别用于加密的版本，并在版本仍启用时使用它来解密文件。如果版本已移动到禁用、销毁或计划销毁的状态，我们将无法解密文件。\n\n4. 现在我们已经创建了密钥，让我们使用它。例如，如果我们想在\
  \ GCP 中创建一个新磁盘，我们在加密设置下有几个选项。要使用我们新创建的密钥，我们应选择 Customer-managed key 并在提示时从下拉菜单中选择我们的密钥，如以下屏幕截图所示：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_497_0.png)\n\nFigure 15.26 – Using Customer-managed\
  \ encryption key (CMEK)\n\n另一个可用的选项是 CSEK，其中密钥不存储在 KMS 中，Google 不管理密钥。CSEK 允许我们提供自己的\
  \ AES-256 密钥。如果我们提供此密钥，Cloud Storage 不会永久将其存储在 Google 的服务器上，也不会以任何方式管理我们的密钥。一旦我们为\
  \ Cloud Storage 操作提供了密钥，该密钥就会从 Google 的内存中清除。这意味着每次创建或使用存储资源时都必须提供该密钥。客户将承担全部责任，这意味着如果密钥丢失，则无法解密您的数据。在这里，我们将选择\
  \ Customer-supplied encryption key (CSEK) 选项并输入相关密钥。\n\n现在，让我们开始了解一些行业法规。\n\n##\
  \ Industry regulations\n\n同样重要的是要了解，安全不仅仅是防火墙规则或加密。Google 需要遵守全球法规和第三方认证。GCP 遵守的法规示例可以在其网页\
  \ https://cloud.google.com/security/compliance/#/ 上找到。建议您查看此页面以熟悉应满足的各种标准。其中一些将是众所周知的；例如，来自金融行业的法规，如\
  \ PCI DSS 或 ISO 27017，负责云供应商和客户之间的交互。\n\n在本节中，我们将介绍 PCI 合规性。\n\n## PCI compliance\n\
  \n许多组织处理金融交易，Google 必须竭尽全力保护其服务器上的信息。PCI 的一个例子可以将我们之前学到的内容与现实生活中的例子联系起来。如果需要设置特定的支付处理环境，Google\
  \ 可以帮助客户实现这一目标。该架构的核心是我们本章学到的内容。为了保护环境，我们应使用 Resource Manager 创建单独的项目以隔离我们的游戏和 PCI\
  \ 项目。我们可以利用 Cloud IAM 并将权限应用于这些单独的项目。记住最小权限原则！我们还可以使用防火墙规则来限制入站流量以保护环境。我们希望公众能够使用我们的支付页面，因此我们需要\
  \ HTTPS 流量由 HTTP(S) 负载均衡器保护，并且任何额外的支付处理应用程序可能需要与第三方进行双向访问。请查看文章 https://cloud.google.com/solutions/pci-dss-compliance-in-gcp\
  \ 以更深入地了解 GCP 如何处理 PCI DSS 要求。\n\n在下一节中，我们将回顾数据丢失防护。\n\n## Data loss prevention\
  \ (DLP)\n\n删除 **Personal Identifiable Information (PII)** 也是行业内的一个关注点。Cloud DLP\
  \ 为我们提供了一个强大的数据和去识别化平台。DLP 使用信息类型，也称为 infoTypes，来定义要扫描的内容。这些 infoTypes 是敏感数据类型，例如姓名、电子邮件地址、信用卡号或识别号码。Cloud\
  \ DLP 如何帮助我们的一个例子是，我们可以自动从可能存储在 GCP 存储库中的此类敏感数据中进行涂黑。\n\n我们还应注意，遵守 **European Union\
  \ General Data Protection Regulation (GDPR)** 是 Google 从安全角度的首要任务之一，并且这些内置的 infoType\
  \ 检测器提供 GDPR 合规性。\n\n## Penetration testing in GCP\n\n值得注意的是，如果您需要对 GCP 基础设施进行渗透测试，您不需要\
  \ Google 的许可，但必须遵守可接受使用政策，以确保测试仅针对您的项目。有趣的是，Google 提供了一个激励计划，如果发现错误或漏洞，奖励范围从 $100\
  \ 到 $31,337！\n\n## CI/CD security overview\n\n随着 DevOps 越来越受欢迎，在构建管道、镜像和交付模型时考虑安全非常重要。Google\
  \ Cloud 在构建 CI/CD 管道时提供了一些最佳实践。然而，它们像许多最佳实践一样是主观的，可能不适用于您的架构。尽管如此，考虑以下事项仍然很重要：\n\
  \n- **Branching model**: 重要的是要考虑对代码的更改将如何影响生产环境，因此可能需要功能分支来在对生产代码库进行任何合并请求之前测试更改。\n\
  - **Container image vulnerabilities**: 在创建要在管道中使用的镜像时，在镜像上传到 Artifact 或 Container\
  \ Registry 时扫描漏洞也很重要。在这种情况下，可以使用 Cloud Build 在镜像构建后扫描镜像，然后阻止其上传到 Artifact Registry。这称为按需扫描。\n\
  - **Filesystem security**: 即使在容器中，防止潜在攻击者安装其工具也很重要。我们应避免在容器内以 root 身份运行，并在只读模式下启动容器。\n\
  - 容器的大小也应考虑，不仅从性能角度，而且从安全角度。较小的容器意味着更小的攻击面。许多较大的容器显示与已安装但与应用程序无关的程序相关的漏洞。\n\n现在，让我们来看\
  \ Identity-Aware Proxy。\n\n\n\n\n\n## Identity-Aware Proxy (IAP)\n\nGoogle 通过 Cloud\
  \ IAP 为运行在 GCP 上的 Cloud Engine 实例或应用程序提供额外的访问控制。这允许通过 HTTPS 验证用户的身份，并且仅在允许的情况下授予访问权限。该服务对于远程工作者尤其有用，因为它消除了使用本地网络通过公司\
  \ VPN 对用户请求进行身份验证的需求。相反，访问是通过可通过互联网访问的 URL 进行的。当远程用户需要访问应用程序时，请求会被转发到 Cloud IAP，并且如果允许则会授予访问权限。此外，没有传统\
  \ VPN 的开销，管理员的可管理性也得以简化。\n\n启用 Cloud IAP 是一个简单的过程，但必须满足一些先决条件。你需要配置防火墙规则以阻止对托管应用程序的\
  \ VM 的访问，并且只允许通过 IAP 访问。接下来，你需要导航到 GCP 控制台中的 Security | Identity-Aware Proxy，在那里你会找到你的应用程序或\
  \ Compute Engine 资源的列表。只需单击蓝色单选按钮即可启用 IAP。\n\n> **重要提示**\n> 你可能首先会被要求进行 OAuth 同意。\n\
  \n最后，你可以从将出现的 information panel 中用相关成员填充 IAP 访问列表。以下屏幕截图显示了 IAP 已为 HTTPS 资源启用：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_500_0.png)\n\n图 15.27 – Identity-Aware\
  \ Proxy\n\n现在我们已经对 IAP 进行了概述，让我们来看一些重要功能。\n\n## TCP forwarding\n\nIAP 具有端口转发功能，允许我们从公共互联网对后端进行\
  \ **Secure Shell (SSH)** 或 **Remote Desktop for Windows (RDP)**，从而防止这些服务公开暴露在互联网上。我们需要在到达目标资源之前通过授权和身份验证检查，从而降低从互联网连接这些服务的风险。\n\
  \nIAP 的转发功能允许我们连接到 Compute Engine 实例上的随机 TCP 端口。IAP 然后会在 localhost 上创建一个监听端口，将所有流量转发到我们的实例。IAP\
  \ 然后会将客户端的所有流量包装在 HTTPS 中，并在我们成功通过身份验证后允许访问接口和端口。此身份验证过程基于配置的 IAM 权限。\n\n我们应该注意一些限制。端口转发不适用于批量数据传输，因此\
  \ IAP 保留对服务滥用进行速率限制的权利。此外，在非活动 1 小时后，IAP 将自动断开我们的会话，因此使用此功能的应用应具有在断开连接后重新建立隧道的逻辑。\n\
  \n## Access Context Manger\n\nAccess Context Manager 为 Google Cloud Organization\
  \ 管理员提供定义项目和 GCP 资源细粒度、基于属性的访问控制的能力。Access Context Manager 根据请求的上下文授予访问权限，例如用户的身份、设备类型或\
  \ IP 地址。它在传统的边界安全模型之上增加了另一层保护，在该模型中，网络内部的任何内容都被视为受信任。Access Context Manager 考虑到了移动劳动力和\
  \ **Bring Your Own Device (BYOD)**，这增加了边界安全模型未考虑的额外攻击向量。\n\n## Chronicle\n\nGoogle\
  \ 安全套件中最新的引入之一是 **Chronicle**。虽然我们怀疑考试中不会就此进行提问，但我们认为值得对此说几句话。\n\nChronicle 是一种威胁检测解决方案，可帮助企业以速度和规模识别威胁。它可以搜索企业产生的大量安全和网络遥测数据，并对活动提供即时分析和上下文。\n\
  \n## Summary\n\n安全方面有更深入的探讨，但对于考试，你必须理解安全是 Google 所有服务的重要部分，而非事后考虑。到目前为止，我们已经介绍了一些服务，以确保你的\
  \ GCP 基础设施安全。我们介绍了 Cloud Identity，介绍了 IAM 模型，并研究了加密。\n\n在下一节中，我们将介绍额外的安全服务。\n\n\
  ## Additional security services\n\nGCP 提供了多个高级服务来帮助你保护基础设施和资源。在本节中，我们将简要介绍其他关键服务。\n\
  \n## Security Command Center (SCC)\n\nSCC 为企业提供对其在多个 GCP 服务中的云数据的整体视图。SCC 的真正好处在于它协助收集数据和识别威胁，并且可以在任何业务影响发生之前采取行动。它还提供反映我们资源整体健康状况的仪表板。它还可以与其他\
  \ GCP 工具（如 Cloud Security Scanner）和第三方（如 Palo Alto Networks）集成。GCP 将 SCC 中的可能安全威胁称为\
  \ findings。要访问这些 findings，你必须拥有相关的 IAM 角色，其中包括 Security Center Findings Viewer 的权限，然后浏览到\
  \ SCC 的 Findings 选项卡。当然，像所有 GCP 服务一样，有 API 集成，允许我们列出任何 findings。SCC 还允许我们使用 security\
  \ marks，这使我们能够注释资产或 findings 并使用这些标记进行搜索或过滤。\n\n要使用 SCC，你必须从你的 GCP 组织中查看它。此外，你必须是组织管理员并拥有当前组织的\
  \ Security Center Admin 角色。这允许你选择所有当前和未来的项目以包含在内（如果愿意）。或者，我们可以根据发现的任何安全风险包含或排除单个项目。\n\
  \nSecurity Command Center 事件可以导出到 Chronicle，它专为安全威胁检测和调查而构建。它建立在 Google 基础设施之上，让我们能够利用\
  \ Google 的规模来减少调查时间。\n\n## Forseti\n\nForseti 是一款开源安全工具，可帮助保护你的 GCP 环境。如果希望监控资源以确保访问控制与预期一致，则很有用。它还可用于在任何内容更改时通过电子邮件或\
  \ Slack 频道发布进行提醒。此外，它允许你对资源进行快照，以便你始终知道云的样子。它还可以通过将策略与当前状态进行比较并使用 GCP API 纠正任何违规行为，对敏感的\
  \ GCP 资源强制执行规则。\n\n## Cloud Armor\n\nCloud Armor 使用 Google 的全球基础设施提供抵御 DDoS 攻击的规模化防御。它用于将访问你的\
  \ HTTPS 负载均衡器列入黑名单或白名单。这可用于防止恶意用户或流量联系你的资源，或更糟的是，基于规则集接管你的 VPC。以下屏幕截图显示了一项策略，该策略已设置为拒绝特定\
  \ IP 并返回 404 错误：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_503_0.png)\n\n图 15.28\
  \ – Cloud Armor\n\n通过单击 Targets 选项卡，我们可以看到该策略正在定位后端负载均衡器，如以下屏幕截图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_504_0.png)\n\
  \n图 15.29 – Cloud Armor – Targets\n\nCloud Armor 日志允许我们查看任何访问尝试并告诉我们哪个源请求了访问。我们应该注意，这些日志是通过\
  \ Stackdriver 提供的，该内容在本章的 Monitoring and logging 部分进行了描述。这将在第 17 章 Monitoring Your\
  \ Infrastructure 中更详细地介绍。\n\n以下屏幕截图显示了 Cloud Armor 日志的一些示例输出：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_504_1.png)\n\
  \n图 15.30 – Cloud Armor logs\n\n## Secret Manager\n\nSecret Manager 是一个方便且安全的系统，用于存储证书、密码或\
  \ API 密钥。将此敏感数据存储在中央位置可提供单一事实来源来管理、访问和审计 Google Cloud 中的机密。Secret Manager 还允许为每个机密设置访问策略。此外，可以为每次机密访问配置审计日志。此服务是\
  \ Hashicorp Vault 等第三方机密管理系统的替代方案。\n\n在本节中，我们查看了 GCP 提供的一些其他安全服务。并非所有这些都将在考试中提问，但对每个服务的高层次了解是很有益的。\n\
  \n## Summary\n\n安全方面有更深入的探讨，但对于考试，我们必须理解安全是 Google 所有服务的重要部分，而非事后考虑。在本章中，我们查看了 GCP\
  \ 提供的许多服务，以确保我们的解决方案安全。在其他方面，我们介绍了 Cloud Identity，介绍了 IAM 模型，并研究了加密。在下一章中，我们将介绍\
  \ Google Cloud Management Options。\n\n> Exam Tip\n> 请记住，我们绝不应授予用户或服务超出其所需权限的权限。始终使用最小权限原则。\n\
  \n## Further reading\n\n阅读以下文章以获取本章所涵盖内容的更多信息：\n\n- **Cloud Identity**: https://cloud.google.com/identity/docs/\n\
  - **IAM**: https://cloud.google.com/iam/docs/\n- **Encryption**: https://cloud.google.com/storage/docs/encryption/\n\
  - **Cloud IAP**: https://cloud.google.com/iap/docs/\n- **Security Command Center**:\
  \ https://cloud.google.com/security-command-center/docs/\n\n\n\n\n\n- **Cloud Armor**:\
  \ https://cloud.google.com/armor/docs/\n- **Google Cloud Security Foundations Guide**:\
  \ https://services.google.com/fh/files/misc/google-cloud-security-foundations-guide.pdf\n\
  - **Best Practices Guides**: https://cloud.google.com/security/best-practices#section-1\n\
  \n## 16\nGoogle Cloud 管理选项\n\n本章描述如何利用各种可用的管理选项，以便您可以轻松管理 **Google Cloud Platform\
  \ (GCP)** 服务。在之前的章节中，我们已经涉及了可用于管理 Google 服务的命令行工具。在本章中，我们将更详细地查看这些工具，其中包括 `gcloud`、`cbt`、`bq`\
  \ 和 `gsutil`。\n\n> **考试提示**\n> 您必须了解用于管理特定服务的最高效命令行工具。复习并理解本章中的每个命令行工具，并确保您可以快速将其映射到\
  \ GCP 服务。例如，如果我们被要求使用命令行工具创建一个新的存储桶，我们应该立即知道需要使用 `gsutil`。\n> \n> 我们还建议您更深入地查看 `gsutil`\
  \ 命令行并理解它们，以便您可以设置生命周期策略。\n\n随着本章对每个管理选项的介绍，您可以预期了解如何访问它并从示例中获得实践知识。您还可以预期看到可在现实世界中使用的基于代码的命令，但对于考试成功也很重要需要理解。我们将首先查看使用\
  \ **应用程序编程接口 (APIs)**，然后再查看剩余的工具。\n\n在本章中，我们将介绍您可以使用的各种管理选项。具体来说，我们将涵盖以下主题：\n\n\
  - 使用 API 管理资源\n- 使用 Google Cloud Shell\n- GCP **软件开发工具包 (SDK)**\n- 探索 Cloud Deployment\
  \ Manager\n- 定价计算器\n- 其他需要考虑的事项\n\n## 使用 API 管理资源\n\nAPI 使用现在非常普遍。API 是应用程序的访问点，为开发人员在与之通信的方式上提供灵活性，极大地提高了他们的效率。\n\
  \n> **重要说明**\n> GCP 为其服务的 API 提供了完整的文档。我们建议您查看 https://cloud.google.com/apis/ 并点击您希望了解更多信息的特定服务。\n\
  \nAPI 使用不同的身份验证服务，具体取决于 API 调用来自何处以及它们请求的资源：\n\n- **API 密钥**：这些是可以用于 API 调用不需要访问用户数据时的加密字符串。这些非常适合让开发人员快速上手。密钥在\
  \ GCP 控制台下的 **APIs & Services | Credentials** 中创建。然后这些密钥在 API 请求中使用。\n- **OAuth\
  \ 客户端 ID**：这些基于范围，意味着不同的权限将授予不同的 ID。如果开发人员需要请求用户数据，则使用此方法。\n- **服务账号**：这些属于 **虚拟机\
  \ (VM)** 实例的应用程序。请参阅 *第 15 章，安全与合规*，以获取有关服务账号的更深入信息。\n\n让我们看一个使用 API 的示例。如前所述，我们可以浏览到\
  \ GCP 控制台中的 **API & Services**，然后选择 **ENABLE APIS AND SERVICES**。如果我们搜索 `Compute\
  \ Engine`，如以下屏幕截图所示，我们可以选择 **TRY THIS API**：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_509_0.png)\n\
  \n图 16.1 – 启用 API\n\n这将带我们进入 **Compute Engine API** 文档页面。这是 GCP 提供的一项不错的功能，可帮助我们在其所有服务中使用\
  \ API 调用。如果可以滚动浏览文档，我们将看到与 GCE 相关的所有 API 调用的列表。让我们寻找一种可用于创建新实例的方法；即在 `v1.instances.insert`\
  \ 列表下：\n\nCompute Engine > Documentation > Reference\n\n### 方法：instances.insert\n\
  \n在指定的项目中使用请求中包含的数据创建实例资源。\n\n图 16.2 – API 示例\n\n如果我们点击此方法，它将带我们进入一个页面，允许我们通过 API\
  \ 请求 VM 实例。我们首先需要注意的是右侧的菜单，在那里我们可以选择 OAuth 2.0 作为我们的身份验证方法。这允许我们使用登录 GCP 控制台的相同用户授权\
  \ API 调用。有些必填信息需要填写，用红色标出：\n\n- **project**：这是您的 GCP 项目的 ID。\n- **zone**：这是您希望 VM\
  \ 驻留的区域。\n\n以下屏幕截图显示了这些字段的示例填充：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_510_0.png)\n\
  \n图 16.3 – 试用此 API\n\n我们还需要用有关请求的信息填充请求正文。让我们查看以下示例中所需的内容。我们需要提供有关机器类型、机器名称以及磁盘和映像类型的信息：\n\
  \n```\n{\n  \"machineType\": \"zones/us-central1-f/machineTypes/n1-standard-1\"\
  ,\n  \"name\": \"test001\",\n  \"disks\": [\n    {\n      \"initializeParams\":\
  \ {\n        \"sourceImage\": \"projects/debian-cloud/global/images/family/debian-9\"\
  \n      },\n      \"boot\": true,\n```\n\n```\n\"interface\": \"SCSI\"\n}\n],\n\"\
  networkInterfaces\": [\n{\n\"network\": \"global/networks/default\"\n}\n]\n}\n```\n\
  \n经过初步验证后，我们可以通过点击 **Authorize and execute** 执行请求。响应代码 **200 OK** 意味着我们的请求已成功执行：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_511_0.png)\n\n图 16.4 – API 返回代码\n\n仔细查看，我们可以看到有关用户、URI\
  \ 和区域的信息：\n\n```\n{\n\"id\": \"5737119379050389182\",\n\"name\": \"operation-1625514064727-5c6657c67cea7-42560a30-2bf3bace\"\
  ,\n\"zone\": \"https://www.googleapis.com/compute/v1/projects/primeval-nectar-318916/zones/us-central1-f\"\
  ,\n\"operationType\": \"insert\",\n\"targetLink\": \"https://www.googleapis.com/compute/v1/projects/primeval-nectar-318916/zones/us-central1-f/instances/test001\"\
  ,\n\"targetId\": \"6541634553944923838\",\n\"status\": \"PENDING\",\n\"user\": \"\
  gcparchitectbook@gmail.com\",\n\"progress\": 0,\n\"insertTime\": \"2021-07-05T12:41:06.131-07:00\"\
  ,\n```\n\n```\n\"selfLink\": \"https://www.googleapis.com/compute/v1/projects/primeval-nectar-318916/zones/us-central1-f/operations/operation-1625514064727-5c6657c67cea7-42560a30-2bf3bace\"\
  ,\n\"kind\": \"compute#operation\"\n}\n```\n\n现在，让我们通过创建一个新磁盘来看另一个示例。我们可以简单地搜索 v1.instances.insert\
  \ 方法。同样，我们需要填充项目和区域。请求正文也是必需的：\n\n```\n{\n  \"name\": \"newdisk001\",\n  \"sizeGb\"\
  : 10\n}\n```\n\n点击 Authorize and execute 后，我们再次可以看到响应：\n\n```\n{\n  \"id\": \"4514886327875854282\"\
  ,\n  \"name\": \"operation-1625514277056-5c665890fb0fa-1bd73387-5f597370\",\n  \"\
  zone\": \"https://www.googleapis.com/compute/v1/projects/primeval-nectar-318916/zones/us-central1-f\"\
  ,\n  \"operationType\": \"insert\",\n  \"targetLink\": \"https://www.googleapis.com/compute/v1/projects/primeval-nectar-318916/zones/us-central1-f/disks/newdisk001\"\
  ,\n  \"targetId\": \"3511243588531838922\",\n  \"status\": \"RUNNING\",\n  \"user\"\
  : \"gcparchitectbook@gmail.com\",\n  \"progress\": 0,\n  \"insertTime\": \"2021-07-05T12:44:37.706-07:00\"\
  ,\n  \"startTime\": \"2021-07-05T12:44:37.713-07:00\",\n  \"selfLink\": \"https://www.googleapis.com/compute/v1/projects/primeval-nectar-318916/zones/us-central1-f/operations/operation-1625514277056-5c665890fb0fa-1bd73387-5f597370\"\
  ,\n  \"kind\": \"compute#operation\"\n}\n```\n\n我们建议您探索 GCP API 的 Explorer 页面，以查看核心\
  \ GCP 服务中有哪些 API 可用。在接下来的部分中，我们将查看可供我们使用的更多命令行工具。\n\n## 使用 Google Cloud Shell\n\n\
  GCP 套件中的主要管理工具是 Google Cloud Shell。这是一个免费的 g1-small Google Compute Engine (GCE)\
  \ 实例，提供命令行访问，以便您可以通过 Linux shell 管理 GCP 基础设施。这里有趣的是，它可以直接从您的 GCP 控制台访问，只需点击右上角的\
  \ shell 访问按钮即可：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_513_0.png)\n\n图 16.5\
  \ – 启动 Google Cloud Shell\n\n激活后，控制台屏幕将分为两部分，Google Cloud Shell 将在浏览器中可见：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_513_1.png)\n\
  \n图 16.6 – Google Cloud Shell\n\n不需要额外的授权步骤，因此我们可以安全地管理项目和资源，而无需安装任何其他管理工具集。此外，本章中将介绍的\
  \ SDK 命令行作为标准打包。此外，Google Cloud Shell 还预装了管理工具，如 MySQL 客户端、Docker 和 kubectl。最后，您的开发人员还可以访问不同的语言，包括\
  \ Go、Python、Node.js 和 Ruby。有关已安装功能的完整最新列表，我们建议您访问 https://cloud.google.com/shell/docs/features#tools。\n\
  \nGoogle Cloud Shell 配备 5 GB 的持久磁盘存储，挂载到您的 $HOME 目录。这意味着您可以在会话之间安全地存储脚本或用户配置并安装任何所需的软件包。请注意，$HOME\
  \ 目录之外的任何保存内容将在会话终止时丢失；即在空闲一小时后。\n\n\n\n\n\n我们可以使用控制台 shell 的设置从本地机器上传和下载，如以下屏幕截图所示：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_514_0.png)\n\n图 16.7 – 上传文件和下载文件选项\n\n\
  Google Cloud Shell 的代码编辑器也可以用于浏览来自持久存储的文件夹路径。我们可以通过点击 Cloud Shell 菜单栏中的铅笔图标轻松访问它：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_514_1.png)\n\n图 16.8 – Cloud Shell 菜单\n\
  \n从这里，我们可以直接在 Cloud Shell 中更新脚本或文件。Cloud Shell 虚拟实例还附带了标准基于 Linux 的编辑器，如 nano 和\
  \ vim。注意，在撰写本文时，代码编辑器处于 beta 阶段：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_514_2.png)\n\
  \n图 16.9 – Cloud Shell 编辑器\n\n现在我们已经介绍了 Google Cloud Shell，让我们继续并查看 GCP SDK。\n\n\
  ## The GCP SDK\n\n本节将描述如何使用 Google Cloud SDK。SDK 是一组工具，允许您管理 GCP 资源和应用程序，并包括 gcloud、gsutil\
  \ 和 bq 命令行工具。正如预期的那样，安装此套件有一些先决条件。SDK 可以在 Linux、macOS 和 Windows 操作系统上运行，并要求您安装 Python\
  \ 2.7.x。随附的一些工具可能有额外的要求。请参阅 https://cloud.google.com/sdk/install 了解具体的系统和操作系统要求。\n\
  \n## gcloud\n\ngcloud 是 GCP 的主要命令行工具，允许您在 GCP 环境中执行常见任务。gcloud 有许多用例；例如，创建和管理 GCE\
  \ 实例、Cloud SQL 实例、Kubernetes Engine 集群、Dataproc 集群、DNS 区域和 Cloud Deployment Manager\
  \ 部署。\n\n当您首次使用 gcloud 时，建议查看使用指南。在命令中添加 -h 将提供以下指南：\n\n```\ngoogle3167498_student@cloudshell:/home\
  \ (qwiklabs-gcp-cf3e4b1a188f0368)$ gcloud -h\nUsage: gcloud [optional flags] <group\
  \ | command>\n  group may be          access-context-manager | alpha | app | asset\
  \ | auth |\n                        beta | bigtable | builds | components | composer\
  \ |\n                        compute | config | container | dataflow | dataproc\
  \ |\n                        datastore | debug | deployment-manager | dns |\n  \
  \                      domains | endpoints | filestore | firebase |\n          \
  \              functions | iam | iot | kms | logging | ml |\n                  \
  \      ml-engine | organizations | projects | pubsub | redis |\n               \
  \         resource-manager | services | source | spanner | sql |\n             \
  \           topic\n  command may be        docker | feedback | help | info | init\
  \ | version\n\nFor detailed information on this command and its flags, run:\n  gcloud\
  \ --help\n```\n\n图 16.10 – gcloud help\n\n要获取有关此命令及其标志的详细信息，我们可以运行以下命令：\n\n```\n\
  gcloud --help\n```\n\n这将列出更多详细信息 – 试试看并查看您收到的输出！按空格键继续查看详细输出或按 Q 退出。\n\n> **Important\
  \ Note**\n> `gcloud` 针对托管在 GCP 上的功能和资源提供命令参考，我们建议您查看。可以在 https://cloud.google.com/sdk/gcloud/reference/\
  \ 找到。\n\n让我们看看如何使用 gcloud 创建新的 VM 实例。\n\n我们还将向您展示如何使用 gcloud 通过 SSH 连接到我们的 VM、创建新磁盘并将其附加到我们的\
  \ VM 实例。请按照以下步骤操作：\n\n- 1. 要创建 VM，我们应使用以下语法：\n  ```\n  gcloud compute instances\
  \ create <instance name> --zone <zone name>\n  ```\n  这里，<instance name> 是您的 VM\
  \ 实例的名称，<zone> 是实例将被部署到的区域。\n- 2. 以下示例将在 us-central1-f 区域中创建一个名为 myinstance 的新 VM\
  \ 实例：\n  ```\n  gcloud compute instances create myinstance --zone us-central1-f\n\
  \  ```\n- 3. 一旦我们创建了实例，gcloud 还允许我们连接到实例并管理它。这是对 SSH 命令的轻量级封装，将处理身份验证和实例名称到 IP 地址的解析。连接默认将使用运行命令的用户凭据启动\
  \ SSH 会话：\n  ```\n  gcloud compute ssh <instance name> --zone <zone name>\n  ```\n\
  \  这里，<instance name> 是您的 GCE VM 实例的名称，<zone> 是实例所在的区域。\n- 4. 以下示例将使用以下 SSH 命令连接到\
  \ us-central1-f 区域中的名为 myinstance 的新 VM 实例：\n  ```\n  gcloud compute ssh myinstance\
  \ --zone us-central1-f\n  ```\n- 5. gcloud 还允许我们执行第二天操作。作为示例，让我们在已创建的 VM 实例上添加一个磁盘。首先，我们需要使用以下语法创建磁盘：\n\
  \  ```\n  gcloud compute disks create <disk name> --zone <zone name>\n  ```\n  这里，<disk\
  \ name> 是我们正在创建的磁盘的名称，<zone name> 是磁盘将被创建的区域。\n- 6. 以下示例将在 us-central1-f 区域中创建一个名为\
  \ newdisk001 的新磁盘：\n  ```\n  gcloud compute disks create newdisk001 --zone us-central1-f\n\
  \  ```\n  我们应该注意，在前面的示例中，我没有使用可选的 size 标志。我们应该注意标准 HDD 的默认磁盘大小为 500 GB。此外，您可以看到我们已在与实例相同的区域中创建了磁盘。\n\
  - 7. 最后，我们需要将磁盘附加到我们的实例。这可以使用以下语法完成：\n  ```\n  gcloud compute instances attach-disk\
  \ <instance name> attach-disk <disk name> --zone <zone>\n  ```\n  这里，<instance name>\
  \ 是您的 GCE VM 实例的名称，<disk name> 是您想要附加到 VM 实例的磁盘的名称，<zone name> 是实例所在的区域。\n- 8. 以下示例将把一个名为\
  \ newdisk001 的磁盘附加到 us-central1-f 区域中的名为 myinstance 的 VM 实例：\n  ```\n  gcloud compute\
  \ instances attach-disk myinstance --disk newdisk001 --zone us-central1-f\n  ```\n\
  \n最后，明智的做法是提及 gcloud 中可能存在的 alpha 和 beta 命令。Alpha 命令通常尚未准备好用于生产，可能仍处于开发阶段。它们可能会在没有任何通知的情况下更改，并且其中一些仅可通过邀请完全访问。Beta\
  \ 命令通常几乎完全开发并正在生产中测试。然而，这些也可能在没有任何通知的情况下更改。\n\n## gsutil\n\n在本节中，我们将描述 gsutil 的使用方法。其主要目的是确保您了解\
  \ gsutil 的主要用例并展示实际场景的示例。gsutil 是一个 Python 应用程序，可用于管理 Cloud Storage 资源，并且可以从 Cloud\
  \ Shell 触发。通过使用 gsutil，我们可以执行以下操作：\n\n- - 创建和删除存储桶。\n- - 管理对这些存储桶及其对象的访问。\n- - 复制和移动存储数据。\n\
  - - 列出存储桶的内容。\n- - 在我们的 Cloud Shell 实例中传输数据（请注意，这不仅限于 Cloud Shell）。\n\n> **Important\
  \ Note**\n> 您需要了解 gsutil 语法的工作方式为 gsutil <action> gs://<bucket name>/<resource name>\
  \ 格式。\n> \n> <action> 的示例可以是 mb，用于创建存储桶。这里，gs:// 是表示 Cloud Storage 中资源的前缀。<bucket\
  \ name>/<object name> 可以是 cloudarchitect/notes.txt，例如。有关 gsutil 命令的完整范围，请参阅 https://cloud.google.com/storage/docs/gsutil。\n\
  \n使用 gsutil 创建存储桶是一个不错的开始。存储桶是您可以存储数据的<|message|>\n\n\n2. 现在我们已经创建了一个新的存储桶，让我们向其中添加一个文件。在本示例中，我将在本地持久化的\
  \ Google Cloud Shell 存储上创建一个新文件。假设我们在 Cloud Shell 环境中有一个名为 examnotes.txt 的文件。这可以按照\
  \ Using Google Cloud Shell 部分所述进行上传。要将其复制到我们的存储桶中，我们可以使用以下语法：\n\n```\ngsutil cp\
  \ <file to copy> gs://<bucket name>\n```\n\n这里，<file to copy> 是你希望复制到存储桶中的文件，而 <bucket\
  \ name> 是你希望文件驻留的全局唯一存储桶名称。在下面的示例中，我们将把一个名为 examnotes.txt 的文件复制到名为 cloudarchitect001\
  \ 的存储桶中：\n\n```\ngsutil cp examnotes.txt gs://cloudarchitect001\n```\n\n3. 上一个命令的输出将确认此次复制的成功。我们还应注意，使用\
  \ cp 时可以指定选项来扩展命令。例如，-n 选项将防止覆盖现有文件的内容。-r 选项将复制整个目录树，重要的是，-m 将允许我们执行并行的多线程/多处理复制。我们可以使用以下语法列出存储桶的内容以确保文件存在：\n\
  \n```\ngsutil ls gs://<bucket name>\n```\n\n这里，<bucket name> 是你希望列出资源的存储桶名称。让我们列出我们的\
  \ cloudarchitect001 存储桶的资源：\n\n```\ngsutil ls gs://cloudarchitect001\n```\n\n4.\
  \ 如果我们希望从存储桶中删除文件，可以使用以下语法：\n\n```\ngsutil rm gs://<bucket name>/<object name>\n\
  ```\n\n这里，<bucket name> 是我们资源所在的存储桶名称，而 <object name> 是我们希望删除的对象。让我们从 cloudarchitect001\
  \ 存储桶中删除 examnotes.txt：\n\n```\ngsutil rm gs://cloudarchitect001/examnotes.txt\n\
  ```\n\n5. 最后，如果我们希望完全删除存储桶（记住，资源会产生费用！），可以使用以下语法：\n\n```\ngsutil rb gs://<bucket\
  \ name>\n```\n\n这里，<bucket name> 是我们希望删除的存储桶名称。让我们删除我们的 cloudarchitect001 存储桶：\n\
  \n```\ngsutil rb gs://cloudarchitect001\n```\n\n请注意，我们也可以使用 -r 标志运行此命令，这将删除存储桶及其所有内容。\n\
  \n## bq\n\n现在，让我们来看一下 BigQuery 的命令行工具。BigQuery 已在第 13 章《分析大数据选项》中进行了更详细的描述，因此在本节中，我们不会深入探讨该服务。然而，一般来说，与\
  \ BigQuery 交互的主要方式是加载、导出、查询、查看和管理数据。我们可以通过 Cloud Shell 使用 bq 命令行工具来实现这一点。\n\n> **重要说明**\n\
  > 从 bq 命令行使用 BigQuery 可能很复杂，建议查阅 bq 命令行工具参考页面以获取完整详细信息：https://cloud.google.com/bigquery/docs/bq-command-line-tool。\n\
  \n让我们来看一些常见用例。在以下示例中，我们将创建一个新的数据集、创建一个表，然后对其进行查询：\n\n- 1. 以下语法用于以最简单的形式创建新的数据集：\n\
  \n```\nbq --location=<location> mk --dataset <dataset name>\n```\n\n这里，<location>\
  \ 是数据集位置，而 <dataset name> 是你新数据集的名称。位置可以是多区域，例如 US 或 EU，也可以是区域位置，例如 us-west2 或 europe-north1。\n\
  \n- 2. 让我们以 US 的多区域位置创建一个名为 newdataset 的新数据集：\n\n```\nbq --location=US mk --dataset\
  \ newdataset\n```\n\n> **重要说明**\n> 可以设置一些可选标志。最好为数据集的默认表的默认表配置过期时间，为你的表的过期时间，以及为分区表的分区过期时间。\n\
  \n3. 现在，让我们以最简单的形式创建一个新的空表。为此，我们可以使用以下语法：\n\n```\nbq mk -t <dataset name>.<table\
  \ name> <schema>\n```\n\n这里，<dataset name> 是你希望创建新表的数据集的名称，<table name> 是要创建的表的名称，而\
  \ <schema> 是 [FIELD:DATA_TYPE] 格式的内联模式定义。也可以使用指向本地计算机上 JSON 文件的路径。<schema> 参数可能有点令人困惑，但为了澄清，这就像\
  \ Excel 文件中的一列。\n\n4. 让我们在名为 newdataset 的数据集中创建一个名为 newtable 的新表。我们将创建两列名为 examname\
  \ 和 result，我们希望用字符（Unicode）数据填充它们；即 STRING 数据：\n\n```\nbq mk -t newdataset.newdataset\
  \ \\\n examname:STRING,result:STRING\n```\n\n5. 最后，让我们看看如何使用 bq 运行查询。为此，我们需要使用以下语法：\n\
  \n```\nbq query '<SQL query>'\n```\n\n这里，<SQL query> 是你希望 BigQuery 在数据上执行 SQL 查询。<SQL\
  \ query> 将包含有关要从特定数据集和表中查询的数据的信息。如果我们想连接到未设为默认的项目，我们也可以在 SQL 请求中指定这一点。如果我们要查询表的完整路径，它将如下所示：\n\
  \n```\n<projects>.<dataset>.<table>\n```\n\n为了澄清这一点，让我们看一个示例。GCP 提供了一些示例数据集和表供我们使用。让我们在名为\
  \ samples 的数据集中的一个名为 Shakespeare 的表上执行 bq 查询。该数据集和表位于 Google 允许我们连接的公共项目 bigquery-public-data\
  \ 下。\n\n在本示例中，我们想看看单词 beloved 在莎士比亚作品中出现了多少次。我们将通过表中的列 word 和 corpus 进行搜索。此外，请注意我们将查询类型指定为\
  \ #standardSql：\n\n```\nbq query \"#standardSql SELECT word, corpus, COUNT(word)\
  \ FROM \\\n`bigquery-public-data.samples.shakespeare`\\\nWHERE word LIKE '%beloved%'\
  \ GROUP BY word, corpus\"\n```\n\n## 重要说明\n\n请注意，``` 在 `bigquery-public-data.samples.shakespeare`\
  \ 中是反引号，而不是撇号。\n\n这将返回以下结果：\n\n```\n| word | corpus | f0_ |\n+--------+--------------------------------+------+\n\
  | beloved | cymbeline | 1 |\n| beloved | romeoandjuliet | 1 |\n| beloved | winterstale\
  \ | 1 |\n| beloved | tamingoftheshrew | 1 |\n| beloved | hamlet | 1 |\n| beloved\
  \ | twogentlemenofverona | 1 |\n| beloved | tempest | 1 |\n| beloved | timonofathens\
  \ | 1 |\n| beloved | kinglear | 1 |\n| beloved | sonnets | 1 |\n| beloved | coriolanus\
  \ | 1 |\n| beloved | 1kinghenryiv | 1 |\n| beloved | juliuscaesar | 1 |\n| beloved\
  \ | 3kinghenryvi | 1 |\n| beloved | antonyandcleopatra | 1 |\n| beloved | comedyoferrors\
  \ | 1 |\n| beloved | periclesprinceoftyre | 1 |\n| beloved | titusandronicus | 1\
  \ |\n| beloved | rapeof lucrece | 1 |\n| beloved | measureforemeasure | 1 |\n| beloved\
  \ | midsummersnightsdream | 1 |\n| beloved | merchantofvenice | 1 |\n| beloved |\
  \ asyoulikeit | 1 |\n| beloved | othello | 1 |\n| beloved | troilusandcressida |\
  \ 1 |\n| beloved | 2kinghenryvi | 1 |\n| beloved | twelfthnight | 1 |\n| beloved\
  \ | kinghenryviii | 1 |\n+--------+--------------------------------+------+\n```\n\
  \n图 16.11 – bq 输出\n\n为了考试成功，我们应该了解 bq 命令行的强大功能，但最重要的是确保我们了解用于查询 BigQuery 表的命令行工具。\n\
  \n## cbt\n\n在本节中，我们将发现 Cloud Bigtable 的命令行工具 – cbt。用 Go 编写的 CLI 允许我们与 Bigtable 进行基本交互。与我们之前查看的其他命令行工具不同，我们必须使用\
  \ Cloud Shell 和 gcloud 命令安装此组件。\n\n我们也在 *第 12 章《探索 GCP 中的存储和数据库选项 – 第 2 部分* 中更深入地研究了此服务，但在查看命令行工具之前，我们应该提醒自己\
  \ Bigtable 是一种高性能 NoSQL 数据库服务，使用实例、集群和节点。Bigtable 是你的集群和节点的容器：\n\n```\ngcloud components\
  \ install cbt\n```\n\n请注意，如果你收到 Cloud SDK 组件管理器已禁用的反馈，那么你也可以运行以下命令：\n\n```\nsudo\
  \ apt-get install google-cloud-sdk-cbt\n```\n\n你可能已经注意到我们查看的不同工具的语法略有不同，而 cbt 也不例外。cbt\
  \ 的用法如下：\n\n```\ncbt <command>\n```\n\n让我们看一个在 Bigtable 中创建名为 myfirstinstance 的新实例的示例。我们必须添加额外的标志。让我们看看语法：\n\
  \n```\ncbt createinstance <instance id> <display name> <cluster id> <zone> <number\
  \ of nodes> <storage type>\n```\n\n这里，<instance id> 是你希望赋予 Bigtable 实例的标识符，<display\
  \ name> 是 Bigtable 实例的显示名称，<cluster id> 是节点集群的标识符，<zone> 是实例将被部署到的区域，<number of\
  \ nodes> 是集群中的虚拟机实例数量，而 <storage type> 是我们希望为虚拟机实例使用的存储类型。这可以设置为 SSD 或 HDD。\n\n\
  让我们看看如果我们想创建一个 ID 为 instance001、显示名称为 myfirstinstance、集群 ID 为 cluster001、在 europe-west2-a\
  \ 区域部署三个节点并使用 SSD 存储的新实例，其语法会是什么样的：\n\n```\ncbt createinstance instance001 myfirstinstance\
  \ cluster001 europe-west2-a 3 SSD\n```\n\n\n如果我们查看控制台内部，可以验证它是否已正确创建：\n\n## Overview\n\
  \n| Instance ID | Instance name | Type | Storage |\n|---|---|---|---|\n| instance001\
  \ | myfirstinstance | Production | SSD |\n\n### cluster001\n\n| CPU utilization\
  \ | Rows | Throughput |\n|---|---|---|\n| Average: — %<br>Hottest node: — % | Read:\
  \ —/s<br>Write: —/s | Read: —/s<br>Write: —/s |\n\n| Cluster ID | Zone | Nodes |\
  \ Storage utilization |\n|---|---|---|---|\n| cluster001 | europe-west2-a | 3 |\
  \ — / — |\n\nFigure 16.12 – Overview\n\n> **Important Note**\n> 你也可以使用 `gcloud`\
  \ 命令来创建 Bigtable 实例。`gcloud` 让我们可以创建生产或开发环境，其中开发环境性能有限且没有 SLA。如果需要创建开发 Bigtable\
  \ 实例，则使用 `gcloud`。\n\n## Exploring Cloud Deployment Manager\n\n在本节中，我们将查看最有用的管理工具之一\
  \ – Google Cloud Deployment Manager。了解 Cloud Deployment Manager 的概念对于考试成功非常重要。\n\
  \nDeployment Manager 允许我们自动化创建和配置各种 GCP 资源的过程。我们可以使用 YAML 文件以声明式格式编写应用程序所需的所有资源，这可确保部署可重复且结果一致。YAML\
  \ 是一种人类可以轻松阅读的数据序列化语言。总的来说，Deployment Manager 可以被称为基础设施即代码（IaC）。你可能对 Ansible 或 Terraform\
  \ 等工具有所了解，并且会认识到你可以通过缩进来嵌套元素，而不是使用某些其他语言中使用的任何大括号或方括号。\n\n> **Exam Tip**\n> Deployment\
  \ Manager 是一个非常大的主题，并且有深入课程可供你获得进一步的知识。对于考试，我们将解释成功所需的核心知识。\n\nDeployment Manager\
  \ 的一些组件是基础的。配置文件包含我们想要部署的所有资源及其属性。\n\n配置文件以资源字符串开头，后面跟着一系列条目，每个条目具有以下字段：\n\n- **Name:**\
  \ 我们正在部署的资源名称；例如，`vm001`。\n- **Type:** 这指定了此资源的基类型。有许多可用的资源类型，它们与我们希望部署的资源类型相关。例如，新\
  \ VM 实例的资源类型将为 `compute.v1.instance`。请注意，`v1` 代表生产就绪。\n- **Properties:** 这指定了创建资源所需的属性。例如，如果我们希望从\
  \ GUI 部署新的 VM 实例，我们需要填充诸如操作系统类型、磁盘类型以及映像和网络接口等必填字段。这些将在配置文件的 `properties` 部分中填充。\n\
  \n> **Important Note**\n> 资源类型的完整列表可以在此处找到：https://cloud.google.com/deployment-manager/docs/configuration/supported-resource-types。\n\
  \n让我们看看如何构建我们的第一个示例配置文件。在本章的 Using Google Cloud Shell 部分中，我们提到了 Cloud Shell 编辑器。让我们打开它并创建一个新文件。为此，只需右键单击你的用户\
  \ ID 并选择 New File：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_526_0.png)\n\nFigure\
  \ 16.13 – Cloud Shell – New File\n\n为文件命名 – 例如，vm001.yaml – 并单击 OK 以创建它。我们现在准备编辑。在此示例中，代码将执行以下操作：\n\
  \n- 在 europe-west4-a 区域中创建一台 VM。\n- 将其大小设置为 g1-small 机器类型。\n- 使用 centos-6 作为我们的映像。\n\
  - 创建一个持久启动磁盘。\n- 将 VM 添加到默认网络。\n- 添加访问配置作为外部 NAT。\n\n完成的配置文件如下所示：\n\n```\nresources:\n\
  - name: vm001\n  type: compute.v1.instance\n  properties:\n```\n\n```\nzone: europe-west4-a\n\
  \  machineType: https://www.googleapis.com/compute/v1/projects/primeval-nectar-318916/zones/europe-west4-a/machineTypes/g1-small\n\
  \  disks:\n  - deviceName: boot\n    type: PERSISTENT\n    boot: true\n    autoDelete:\
  \ true\n    initializeParams:\n      sourceImage: https://www.googleapis.com/compute/v1/projects/centos-cloud/global/images/centos-stream-8-v20210721\n\
  \  networkInterfaces:\n  - network: https://www.googleapis.com/compute/v1/projects/primeval-nectar-318916/global/networks/default\n\
  \  accessConfigs:\n  - name: External NAT\n    type: ONE_TO_ONE_NAT\n```\n\n现在，让我们保存它并使用此配置文件部署一台\
  \ VM。同样，我们将使用 Cloud Shell 工具使用 Deployment Manager 命令行语法执行此操作：\n\n```\ngcloud deployment-manager\
  \ deployments create <deployment name> --config <config file>\n```\n\n这里，<deployment\
  \ name> 是你整体部署的名称。请记住，VM 实例名称在我们的配置文件中指定，而 <config file> 是我们之前创建的配置文件的名称。让我们看一个使用我们的\
  \ vm001.yaml 配置文件创建名为 deployment01 的新部署的示例：\n\n```\ngcloud deployment-manager deployments\
  \ create deployment01 --config vm001.yaml\n```\n\n如果我们浏览到 GCP 控制台中的 **Deployment\
  \ Manager**，我们可以确认它已部署：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_528_0.png)\n\
  \nFigure 16.14 – Deployment Manager\n\n我们还可以浏览到 GCP 控制台中的 Compute Engine 并确认 VM\
  \ 实例存在：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_528_1.png)\n\nFigure 16.15 –\
  \ VM instance\n\n因此，虽然我们花时间创建了一个配置文件，但我们只部署了一个 VM 实例。Deployment Manager 允许我们部署完整的环境。为此，我们应该使用模板。模板允许我们将配置文件的一部分抽象为可在部署之间重用的独立构建块。\n\
  \n模板是与配置文件分开的文件。它也是用不同的语言编写的 – Jinja 或 Python – 并作为类型导入并在配置文件中使用。\n\n模板允许我们从配置文件传递变量，这意味着它们可以保持相当静态，我们只需从配置文件传递编辑后的变量。我们需要修改配置文件以反映我们想要调用模板文件。这可以通过在配置文件的顶部添加模板的路径来完成。我们还可以编辑配置文件以反映我们想要传递的变量。\n\
  \n让我们看一个示例。我们希望为创建 debian-9 VM 保留一个静态模板，但我们希望传递主机名、区域和机器类型等变量。让我们按如下方式创建一个新的配置 YAML\
  \ 文件。让我们将其命名为 createdbytemplate.yaml。请注意，我们已将 vm-template.jinja 添加为类型，并且我们的变量已设置为属性：\n\
  \n```\nimports:\n\n  - path: vm-template.jinja\n\n\nresources:\n\n  - name: newinstance\n\
  \n    type: vm-template.jinja\n\n    properties:\n\n      name: createdbytemplate\n\
  \n      zone: europe-west4-a\n      type: g1-small\n```\n\n现在，我们需要配置我们的模板文件，其中将包含要传递的变量的值。请注意，我们的主机名、机器类型和区域在以下格式的括号内设置：\n\
  \n```\n{{ properties[\"variable name\"] }}\n```\n\n这里，variable name 是从配置文件传递的字符串。以下代码是我们的\
  \ Jinja 模板文件：\n\n```\nresources:\n- name: {{ properties[\"name\"] }}\n  type: compute.v1.instance\n\
  \  properties:\n    zone: {{ properties[\"zone\"] }}\n    machineType: zones/{{\
  \ properties[\"zone\"] }}/machineTypes/{{ properties[\"type\"] }}\n    disks:\n\
  \    - deviceName: boot\n      type: PERSISTENT\n      boot: true\n      autoDelete:\
  \ true\n      initializeParams:\n        sourceImage: projects/debian-cloud/global/images/family/debian-9\n\
  \    networkInterfaces:\n    - network: global/networks/default\n```\n\n我们可以保存它并将其命名为\
  \ vm-template.jinja。现在，我们可以使用我们的 gcloud 命令调用我们的 createdbytemplate.yaml 文件：\n\n```\n\
  gcloud deployment-manager deployments create templatedeployment --config createdbytemplate.yaml\n\
  ```\n\n现在，我们可以检查控制台以验证我们是否有一个名为 createdbytemplate 的新 VM：\n\n\n\n![](img/de2c97ab017f36b3750a5bade111edd7_531_0.png)\n\
  \n# 图 16.16 – 新的 VM 实例\n\n我们也可以在 gcloud 命令中指定变量属性。在下面的示例中，我们有一个名为 vm-template1.jinja\
  \ 的新模板，它期望主机名和区域的变量：\n\n```\nresources:\n- name: {{ properties[\"name\"] }}\n  type:\
  \ compute.v1.instance\n  properties:\n    zone: {{ properties[\"zone\"] }}\n   \
  \ machineType: zones/{{ properties [\"zone\"] }}/machineTypes/g1-small\n    disks:\n\
  \    - deviceName: boot\n      type: PERSISTENT\n      boot: true\n      autoDelete:\
  \ true\n      initializeParams:\n        sourceImage: projects/centos-cloud/global/images/centos-stream-8-v20210721\n\
  \    networkInterfaces:\n    - network: global/networks/default\n    accessConfigs:\n\
  \    - name: External NAT\n      type: ONE_TO_ONE_NAT\n```\n\n再次，让我们使用我们的 gcloud\
  \ 命令来创建它。但是，我们需要将名称指定为 vm002，区域指定为 europe-west4-a：\n\n```\ngcloud deployment-manager\
  \ deployments create\ndeployment002 --template vm-template1.jinja --properties\n\
  name:vm002,zone:europe-west4-a\n```\n\n让我们检查我们的 GCP 控制台并确认我们现在有一个名为 vm002 的 VM 实例，位于\
  \ europe-west4-a 区域：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_532_0.png)\n\n\
  图 16.17 – 实例\n\n到目前为止，我们只查看了单个 VM 部署，但我们也可以通过 Deployment Manager 部署多个 VM。\n\n让我们看一个示例，我们想要部署一个由不同区域中的\
  \ Web 应用程序和 DB 服务器组成的三层应用程序。我们可以扩展之前的模板以添加所需的信息。请注意，我们现在指定了三个单独的资源。让我们创建一个名为 vm-template2.jinja\
  \ 的新模板文件：\n\n```\nresources:\n- name: {{ properties[\"webname\"] }}\n  type: compute.v1.instance\n\
  ```\n\n```\nproperties:\n  zone: {{ properties[\"webzone\"] }}\n  machineType: zones/{{\
  \ properties [\"webzone\"] }}/\nmachineTypes/{{ properties[\"type\"] }}\n  disks:\n\
  \  - deviceName: boot\n    type: PERSISTENT\n    boot: true\n    autoDelete: true\n\
  \    initializeParams:\n      sourceImage: projects/centos-cloud/global/images/\n\
  centos-stream-8-v20210701\n  networkInterfaces:\n  - network: global/networks/default\n\
  \  accessConfigs:\n  - name: External NAT\n    type: ONE_TO_ONE_NAT\n\n- name: {{\
  \ properties[\"appname\"] }}\n  type: compute.v1.instance\n  properties:\n    zone:\
  \ {{ properties[\"appzone\"] }}\n    machineType: zones/{{ properties [\"appzone\"\
  ] }}/\nmachineTypes/{{ properties[\"type\"] }}\n    disks:\n    - deviceName: boot\n\
  \      type: PERSISTENT\n      boot: true\n      autoDelete: true\n      initializeParams:\n\
  \        sourceImage: projects/centos-cloud/global/images/\ncentos-stream-8-v20210701\n\
  \    networkInterfaces:\n    - network: global/networks/default\n    accessConfigs:\n\
  \    - name: External NAT\n```\n\n```\ntype: ONE_TO_ONE_NAT\n\n- name: {{ properties[\"\
  dbname\"] }}\n  type: compute.v1.instance\n  properties:\n    zone: {{ properties[\"\
  dbzone\"] }}\n    machineType: zones/{{ properties [\"dbzone\"] }}/machineTypes/{{\
  \ properties[\"type\"] }}\n    disks:\n      - deviceName: boot\n        type: PERSISTENT\n\
  \        boot: true\n        autoDelete: true\n        initializeParams:\n     \
  \     sourceImage: projects/centos-cloud/global/images/centos-stream-8-v20210701\n\
  \    networkInterfaces:\n      - network: global/networks/default\n    accessConfigs:\n\
  \      - name: External NAT\n        type: ONE_TO_ONE_NAT\n```\n\n现在，我们需要更新我们的配置文件。让我们创建一个新文件并将其命名为\
  \ multi.yaml。让我们添加以下文本：\n\n```\nimports:\n  - path: vm-template2.jinja\n\nresources:\n\
  \  - name: newinstance\n    type: vm-template2.jinja\n    properties:\n      webname:\
  \ web001\n      webzone: europe-west2-a\n      appname: app001\n      appzone: europe-west4-b\n\
  ```\n\n```\ndbname: db001\ndbzone: europe-west6-c\ntype: g1-small\n```\n\n现在，我们可以运行以下命令来触发名为\
  \ multideployment 的部署：\n\n```\ngcloud deployment-manager deployments create multideployment\
  \ --config multi.yaml\n```\n\n现在，让我们从 Cloud Shell 检查我们的结果：\n\n```\nThe fingerprint\
  \ of the deployment is NdvSfAvJTKQnTfuYocnBQ==\nWaiting for create [operation-1556477906253-5879bc0b3f6a3-e71eb3bb-b27e918e]...done.\n\
  Create operation operation-1556477906253-5879bc0b3f6a3-e71eb3bb-b27e918e completed\
  \ successfully.\nNAME TYPE STATE ERRORS INTENT\napp001 compute.v1.instance COMPLETED\
  \ []\ndb001 compute.v1.instance COMPLETED []\nweb001 compute.v1.instance COMPLETED\
  \ []\n```\n\n图 16.18 – 多部署\n\n我们可以通过 GCP 控制台确认我们的部署。让我们查看 Deployment Manager 菜单，在那里我们可以看到我们的部署已成功：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_535_0.png)\n\n图 16.19 – 结果\n\n我们还可以看到每个\
  \ VM 实例都已部署到正确的区域：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_536_0.png)\n\n图 16.20\
  \ – 实例\n\n这就是我们如何为仅 VM 实例类型配置模板的方式。我们还可以将模板扩展到其他类型的服务，例如网络。作为最后一个示例，让我们看看如何创建模板和配置文件来创建网络和防火墙规则集。在此示例中，我们需要有三个单独的模板：一个用于我们的网络，一个用于我们的子网，一个用于我们的防火墙规则。\n\
  \n让我们先看我们的网络。这很简单。请注意，我们现在使用的是 compute.v1.network 类型，并且我们有单个属性。我们将其设置为 false 以避免自动创建相应的子网。名称是从我们的配置文件传递的变量。让我们将此文件保存为\
  \ network.jinja：\n\n```\nresources:\n- name: {{ env[\"name\"] }}\n  type: compute.v1.network\n\
  \  properties:\n    autoCreateSubnetworks: false\n```\n\n接下来，我们可以创建一个子网模板。同样，我们将名称作为变量传递，该变量将从我们的配置文件传递。我们还将传递有关\
  \ IP 范围和要附加到的网络的信息，我们将使用 network.jinja 模板创建该网络，以及创建子网所在的区域。让我们将其保存为 subnet.jinja：\n\
  \n```\nresources:\n- name: {{ env[\"name\"] }}\n  type: compute.v1.subnetwork\n\
  \  properties:\n    ipCidrRange: {{ properties[\"iprange\"] }}\n    network: {{\
  \ properties[\"network\"] }}\n    region: {{ properties[\"region\"] }}\n```\n\n\
  最后，让我们创建一个模板，以便我们可以创建一个防火墙规则。同样，我们将从配置文件传递名称，但这次我们将名称附加一个硬编码值。我们还将设置要附加此规则的网络，并传入防火墙规则的协议。让我们将此模板保存为\
  \ firewall.jinja：\n\n```\nresources:\n- name: {{ env[\"name\"] }}-firewall-rule\n\
  \  type: compute.v1.firewall\n  properties:\n    network: {{ properties[\"network\"\
  ] }}\n    sourceRanges: [\"0.0.0.0/0\"]\n    allowed:\n      - IPProtocol: {{ properties[\"\
  Protocol\"] }}\n        ports: [\"80\"]\n```\n\n现在，我们需要我们的配置文件。我们将导入所有三个模板，而不是像之前的示例中那样导入单个文件。这并没有什么真正的复杂性——我们只需为每个要导入的模板添加一行额外内容。这里需要注意的关键点之一是确保子网和防火墙规则连接到正确的网络。我们可以按如下方式传递变量：\n\
  \n```\n$(ref.custom-net.selfLink)\n```\n\n这里，`custom-net` 是我们正在创建的网络的名称。此名称作为变量传递。让我们将此配置文件保存为\
  \ `config.yaml`：\n\n```\nimports:\n- path: network.jinja\n- path: subnet.jinja\n\
  - path: firewall.jinja\n\nresources:\n- name: custom-net\n  type: network.jinja\n\
  \n- name: custom-subnet\n  type: subnet.jinja\n  properties:\n    iprange: 10.10.0.0/16\n\
  \    network: $(ref.custom-net.selfLink)\n    region: us-central1\n\n- name: custom\n\
  \  type: firewall.jinja\n  properties:\n    network: $(ref.custom-net.selfLink)\n\
  \    Protocol: TCP\n```\n\n最后，让我们将这些文件上传到我们的 Cloud Shell 环境并触发我们已经熟悉的 `gcloud` 命令：\n\
  \n```\ngcloud deployment-manager deployments create networking --config config.yaml\n\
  ```\n\n让我们看看此命令在 Cloud Shell 中的输出是什么样的：\n\n```\nThe fingerprint of the deployment\
  \ is 2A6YxCYsxQ_e04Se7N6RpW==\nWaiting for create [operation-1556741126674-587d909dcd9bd-cld90539-9a25356a]...done.\n\
  Create operation operation-1556741126674-587d909dcd9bd-cld90539-9a25356a completed\
  \ successfully.\nNAME                TYPE                STATE       ERRORS  INTENT\n\
  custom-firewall-rule compute.v1.firewall COMPLETED   []\ncustom-net          compute.v1.network\
  \  COMPLETED   []\ncustom-subnet       compute.v1.subnetwork COMPLETED   []\n```\n\
  \n图 16.21 – Google Cloud Shell 输出\n\n\n\n\n\n还有一个最终的文件我们也应该讨论。模式文件用作指南，向用户展示如何与模板交互并使用模板。例如，让我们看一个配置文件的示例，该文件将要求将\
  \ zone 作为变量传递给模板。我们可以为用户提供有关其使用方式的信息，以及需要设置哪些变量：\n\n```\ninfo:\n  title: VM Instance\
  \ Template\n  author: Cloud Architect\n  description: Creates a new instance\n \
  \ version: 0.1\n\nimports:\n  - path: vm-template.jinja\n\nrequired:\n  - zone\n\
  \nproperties:\n  zone:\n    type: string\n    description: zone where VM will reside\n\
  ```\n\n> **重要提示**\n> Google 提供了一些很棒的 Deployment Manager 示例，我们可以将其下载并在我们的免费层环境中使用。我们建议您下载并查看一个更复杂、更进一步的\
  \ Cloud Deployment Manager 模板，网址为 https://github.com/GoogleCloudPlatform/deploymentmanager-samples。\n\
  \n在下一节中，我们将介绍 Cloud Deployment Manager 的替代方案：Terraform。\n\n# Terraform\n\nTerraform\
  \ 是一个开源工具，可让我们以声明方式配置 Google Cloud 资源。我们应该注意，它并不独属于 Google Cloud。Terraform 可以部署\
  \ AWS、Azure 和 VMware 等厂商的资源，仅举几例。与 Cloud Deployment Manager 一样，Terraform 也使用 IaC\
  \ 方法，并记录下我们希望环境呈现的期望状态。不应对后端进行任何修改，Terraform 应该是事实来源。这与 Deployment Manager 类似，后者创建存储已部署资源信息的清单文件。然而，Terraform\
  \ 使用其结构化语言 HashiCorp Configuration Language（HCL），这是我们上一节中看到的 YAML 文件方法的替代方案。对于首次接触\
  \ IaC 的人来说，这可能会带来一点更陡峭的学习曲线。Terraform 通过提供程序与 GCP 集成，该提供程序负责理解与底层基础设施的 API 交互。Terraform\
  \ 的 Google 提供程序用于配置我们的 GCP 基础设施，由 Google 的 Terraform 团队和 HashiCorp 的 Terraform 团队共同维护，尽管他们也接受社区贡献！\n\
  \n使用 Google Cloud Shell，Terraform 会自动进行身份验证，我们可以直接从 Terraform 的 Google Provider\
  \ 文档页面开始尝试。许多示例都有 Open in Google Cloud Shell 按钮，允许我们启动一个交互式 Cloud Shell 会话，其中加载了示例并且\
  \ Terraform 已准备就绪。\n\n现在，让我们看一个部署 Cloud Storage 存储桶的示例。我们不会详细介绍 Terraform HCL 代码，因为它超出了本书的范围，但了解其大致外观是很有帮助的。Terraform\
  \ 有一些主要命令来部署资源。首先，我们必须运行 terraform init，它会查找我们需要的特定提供程序并下载它们。Terraform 的一个好处是其漂移检测，即运行下一个\
  \ Terraform 命令 terraform plan 时，会显示我们想要应用的配置与已部署内容之间的差异。运行 plan 时不会部署任何内容。要执行计划，我们必须运行\
  \ terraform apply 命令。\n\n对于我们的示例，我们将查看如何创建 Google Storage 存储桶。让我们通过从 https://github.com/terraform-google-modules/terraform-google-cloud-storage\
  \ 仓库执行 git clone 命令来克隆一些 GitHub 上的 Terraform 模块代码。\n\n接下来，我们必须更改目录到 /terraform-google-cloud-storage/examples/simple_bucket\
  \ 并运行 terraform init，它会查找我们需要的特定提供程序并下载它们：\n\n```\nInitializing the backend...\n\
  Initializing provider plugins...\n- Finding hashicorp/google versions matching \"\
  >= 3.43.0, < 4.0.0\"...\n- Installing hashicorp/google v3.74.0...\n- Installed hashicorp/google\
  \ v3.74.0 (self-signed, key ID 34365D9472D7468F)\n\nPartner and community providers\
  \ are signed by their developers.\nIf you'd like to know more about provider signing,\
  \ you can read about it here:\nhttps://www.terraform.io/docs/cli/plugins/signing.html\n\
  \nTerraform has created a lock file .terraform.lock.hcl to record the provider selections\
  \ it made above. Include this file in your version control repository so that Terraform\
  \ can guarantee to make the same selections by default when you run \"terraform\
  \ init\" in the future.\n\nTerraform has been successfully initialized!\n```\n\n\
  图 16.22 – terraform init 输出\n\n当我们运行 terraform plan 命令时，会提示我们输入存储桶名称和项目的 ID。它不会部署任何内容。在此示例中，我们可以看到我们正在创建名为\
  \ cloudarchitectupdate001 的新多区域存储桶，位置在 EU：\n\n```\nTerraform will perform the following\
  \ actions:\n\n# google_storage_bucket.bucket will be created\n+ resource \"google_storage_bucket\"\
  \ \"bucket\" {\n    + bucket_policy_only        = (known after apply)\n    + force_destroy\
  \             = false\n    + id                        = (known after apply)\n \
  \   + location                  = \"EU\"\n    + name                      = \"cloudarchitectupdate001\"\
  \n    + project                   = \"primeval-nectar-318916\"\n    + self_link\
  \                 = (known after apply)\n    + storage_class             = \"STANDARD\"\
  \n    + uniform_bucket_level_access = true\n    + url                       = (known\
  \ after apply)\n    + versioning {\n      + enabled = true\n    }\n  }\n\nPlan:\
  \ 1 to add, 0 to change, 0 to destroy.\n```\n\n图 16.23 – terraform plan 输出\n\n要执行计划，我们必须运行\
  \ terraform apply 命令。输出将类似于以下内容：\n\n```\ngoogle_storage_bucket.bucket: Creating...\n\
  google_storage_bucket.bucket: Creation complete after 1s [id=cloudarchitectupdate001]\n\
  Apply complete! Resources: 1 added, 0 changed, 0 destroyed.\n```\n\n图 16.24 – terraform\
  \ apply 输出\n\n最后，我们可以浏览到控制台中的 Cloud Storage 并确认我们的新存储桶已在正确位置创建：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_542_0.png)\n\
  \n图 16.25 – Google Cloud Storage 存储桶\n\n当然，这是一个非常简单的示例，但您可以使用多个 VM、GKE 集群、负载均衡器等部署更复杂的资源集。如果您对\
  \ Terraform 模板的语法复杂性感到畏惧，请不要担心！Google 提供了一套现成的模板供您使用和学习。\n\n# Cloud Foundation Toolkit\n\
  \nCloud Foundation Toolkit（CFT）（https://cloud.google.com/foundation-toolkit）为 Deployment\
  \ Manager 和 Terraform 提供即用型模板。之前的 Terraform 示例中用于创建 Cloud Storage 存储桶的代码直接来自这些现成模板。它们的设计目的是让我们能够在\
  \ Cloud 平台内快速构建可重复的企业级基础。这些模板是节省时间的工具，我们可以在其基础上进行构建以进行定制，从而为业务增添价值。它们还能让我们专注于应用程序，而不是繁琐的基础设施任务。\n\
  \n在下一节中，我们将介绍定价计算器。\n\n# Pricing Calculator\n\nGoogle 在计算在 GCP 运行应用程序的成本方面提供了帮助。无需在每个服务的文档中检查价格，您可以使用\
  \ GCP 定价计算器。该计算器可通过 https://cloud.google.com/products/calculator 在线获取。它允许您选择用于应用程序的服务和配置。您还可以添加估计的存储和网络需求。总价将为您计算：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_543_0.png)\n\n图 16.26 – 定价计算器\n\n在这里，您可以看到\
  \ GKE 集群上五个节点、500 GB 磁盘空间的成本示例。要添加估计的出站网络流量，只需选择 NETWORKING 图标并定义流量的去向即可：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_544_0.png)\n\
  \n图 16.27 – 定价计算器 – 网络\n\n让我们再看一个示例，这次是针对 Cloud Storage。在此示例中，我们向您展示在新加坡使用 1 TB\
  \ Cloud Storage 的费用。我们估计每月将有 500,000 次 A 类操作和 500,000 次 B 类操作。请注意，当您在计算器中添加操作时，它期望的数字单位为百万。在我们的示例中，我们输入了\
  \ 0.5 百万：\n\n\n\n![](img/de2c97ab017f36b3750a5bade111edd7_545_0.png)\n\n图 16.28\
  \ – 定价计算器 – 存储\n\n我们鼓励你访问该网站并熟悉不同的示例。\n\n## 需要考虑的额外事项\n\n还有一些管理工具需要我们考虑。考试时，了解以下内容也很重要：\n\
  \n- **Cloud Source Repositories**：这是在 GCP 上托管的完整功能的 GitHub 仓库，支持应用程序的协作开发。你可以使用\
  \ `gcloud` 命令来创建代码、提交代码和管理新仓库。更多信息请参阅 https://cloud.google.com/source-repositories/docs/。\n\
  - **Cloud Build**：这是一项 GCP CI/CD 服务，将在 GCP 基础设施上执行你的构建。它可以从 Google Cloud Storage、Cloud\
  \ Source Repositories、GitHub 或 Bitbucket 导入源代码。更多信息可在第 6 章《使用 Google Kubernetes\
  \ Engine 管理 Kubernetes 集群》中找到，以及此处：https://cloud.google.com/cloud-build/docs/。\n\
  - **Cloud Scheduler**：这是一项完全托管的 cron 作业调度服务。它可用于在 App Engine 上触发作业、发送 Pub/Sub 消息，甚至访问\
  \ HTTP(S) 端点。\n- **Container Registry**：这为我们在 GCP 平台上提供了私有的 Docker 仓库存储。我们可以使用 `gcloud`\
  \ 命令将镜像推送到我们的仓库，然后我们可以使用 HTTP 端点从任何 GCE 实例甚至我们的硬件中提取这些镜像。更多信息可在 *第 6 章《使用 Google\
  \ Kubernetes Engine 管理 Kubernetes 集群》* 中找到。\n- **Cloud Endpoints**：这充当 API 管理系统，允许我们在任何\
  \ Google Cloud 后端管理我们的 API。一旦你在 Cloud Endpoints 中部署了 API，你就可以创建一个开发者门户供用户交互、访问和查看文档。\n\
  \n## 总结\n\n在本章中，我们回顾了可用于管理 GCP 服务的主要管理工具。需要重申的是，你应该了解哪些服务可由哪个命令行工具管理以及基本命令行结构。让我们回顾一下我们将使用每个工具做什么：\n\
  \n- `gcloud` 可用于管理许多 GCP 服务，但最常用于管理 Compute Engine 虚拟机实例、Cloud SQL 实例、Kubernetes\
  \ Engine 集群和 Cloud Deployment Manager 部署。\n- 使用 `cbt` 管理 Bigtable。\n- 使用 `bq` 管理\
  \ BigQuery。\n- 使用 `gsutil` 管理 Cloud Storage。我们需要了解创建存储桶、复制数据和删除存储桶的不同语法。\n- Deployment\
  \ Manager 可用于在模板和配置文件中自动化各种 GCP 服务。\n- 定价计算器。\n\n请记住，Google 提供免费试用层，你可以在其中使用这些命令行工具并熟悉创建和管理不同服务。\n\
  \n在下一章中，我们将了解如何监控我们的 GCP 服务。\n\n## 延伸阅读\n\n阅读以下文章以获取有关本章所涵盖内容的更多信息：\n\n- **APIs\
  \ Explorer:** https://developers.google.com/apis-explorer/#p/\n- **gsutil:** https://cloud.google.com/storage/docs/gsutil\n\
  - **cbt:** https://cloud.google.com/bigtable/docs/quickstart-cbt\n- **gcloud:**\
  \ https://cloud.google.com/sdk/gcloud/\n- **bq:** https://cloud.google.com/bigquery/docs/bq-command-line-tool\n\
  - **Cloud Deployment Manager:** https://cloud.google.com/deployment-manager/docs/\n\
  \n## 17\n监控你的基础设施\n\n在本章中，我们将了解 GCP 监控。我们将讨论 Google Cloud 的运维套件是什么，以及为什么你需要它。它以前被称为\
  \ Stackdriver。我们将解释它提供的所有服务。我们还将介绍一些基本配置，让你很好地了解如何利用它来监控你的 Google Cloud 服务，例如 Google\
  \ Compute Engine (GCE) 或 Google Kubernetes Engine (GKE)。\n\n本章将涵盖以下主题：\n\n- Google\
  \ Cloud 运维套件简介\n- 配置 Google Cloud 运维套件\n- Cloud Monitoring\n- Cloud Logging\n- 应用性能管理\
  \ (APM)\n\n**考试提示**\n监控是一个庞大的主题，可能感觉有些令人不知所措。一旦你了解了 Google Cloud 运维套件的三个主要功能，即监控、日志记录和\
  \ APM，我们希望你专注于考试中会测试的内容。确保你知道可以使用 Google Cloud 运维套件监控哪些 GCP 服务。特别注意 GCE，无论是性能监控还是可用性监控。很好地理解审计日志，并确保你知道如何追踪谁对你的项目及其相关资源进行了更改。登录\
  \ GCP 控制台并浏览活动和审计日志。预期你可能会被问到在哪里找到特定类型的日志！最后，Qwiklabs 将帮助你更好地理解该服务，我们强烈建议你查看可用的实验。\n\
  \n## 技术要求\n\n为了获得 Google Cloud 运维套件的实践经验，我们建议你使用 Qwiklabs。Google Cloud 运维套件任务可以在此处找到：https://www.qwiklabs.com/quests/35?locale=en。\n\
  \n**重要说明**\n你需要购买积分才能注册该任务。\n\n## Google Cloud 运维套件简介\n\n我们已经学习了许多服务，现在是时候更仔细地了解监控选项了。Google\
  \ 提供了一款与 GCP 集成的工具，称为 Google Cloud 运维套件（以前称为 Stackdriver）。Stackdriver 成立于 2012 年，是一款软件即服务\
  \ (SaaS) 平台，可实现跨不同云层的统一监控。2014 年，它被 Google 收购，并在 2016 年作为 GCP 服务公开发布。\n\n目前，Google\
  \ Cloud 运维套件可以监控 GCP 和 AWS。然而，与前者的集成要强大得多。Google Cloud 运维套件是一组提供以下服务的工具：\n\n- Monitoring\n\
  - Logging\n- Debugging\n- Tracing\n- Error Reporting\n- Profiling\n\n监控和日志记录是无代理的，但为了获得更有信息量的指标和日志，应安装代理。实际上，有两种类型的代理可以安装在你的实例上：基于\
  \ `collectd` 软件的监控代理，以及基于 `fluentd` 软件的日志代理。\n\n在下面的图表中，你可以看到一个架构图，突出显示了一个 GCE 虚拟机实例以及安装在其上的代理。虚拟机实例默认与\
  \ Logging 和 Monitoring 通信。代理向各自的服务报告：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_551_0.png)\n\
  \n图 17.1 – Google Cloud 运维套件\n\nGCP 是一个面向开发者的平台，它提供了许多可直接与你的应用程序集成的监控相关服务。Google\
  \ Cloud 运维套件允许你同时监控基础设施和应用程序。非常重要的一点是，开发者在设计应用程序时从一开始就需要考虑监控和日志记录。对于受支持的每种编程语言，都有库可促进与\
  \ Google Cloud 运维套件的日志集成。确保你查看受支持的语言，以便充分利用它们！\n\n在本章中，我们将了解如何使用 Google Cloud 运维套件监控\
  \ GCP。请仔细阅读本章并完成推荐的 Qwiklabs，因为这是考试的关键主题。\n\n现在我们对 Google Cloud 运维套件是什么有了基本的了解，让我们看看每项服务的成本。\n\
  \n\n\n\n\n# 成本\n\n使用 Google Cloud 的运维套件，您只需为所使用的资源付费。费用可通过 Cloud Billing 报表和警报进行控制。\n\
  \n以下 Google Cloud 运维套件服务可免费使用：\n\n- Cloud Debugger\n- Error Reporting\n- Cloud Profiler\n\
  \n以下服务在超出月度限制后可能会产生费用：\n\n- Cloud Logging\n- Cloud Monitoring\n- Cloud Trace\n\n\
  我们故意不列出实际价格，因为价格可能会发生变化。\n\n> 重要提示\n> 请查看以下链接以了解最新、最详细的价目表：https://cloud.google.com/monitoring#pricing。\n\
  \n# 配置 Google Cloud 的运维套件\n\n> 考试提示\n> 对于 Stackdriver，过去需要手动创建监控工作区。在引入 Google Cloud\
  \ 的运维套件后，就不再需要这样做了。当您从 Google 控制台导航到 Cloud Monitoring 时，您会看到在项目创建后，该项目已被自动启用监控，并成为所谓的范围项目。\n\
  \nGoogle Cloud 的运维套件按项目启用。最佳实践是，如果您只使用一个项目，则应为该项目启用它。如果您有多个项目，则应专门为监控创建一个单独的项目。这称为范围项目。从该项目中，您可以指定要监控的其他项目。它们将成为被监控项目。请记住，您不会为额外项目付费，因此这不会产生任何额外成本。\n\
  \n现在，让我们看看如何开始使用 Google Cloud 的运维套件：\n\n1. 从汉堡菜单进入 **Monitoring**。然后选择 **Overview**：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_553_0.png)\n\n图 17.2 – 访问 Cloud Monitoring\n\
  \n2. 这会带您进入 Cloud Monitoring 主屏幕。正如您所见，您有一个格式良好的面板，汇总了与您的 GCP 资源监控相关的最重要的信息，例如资源\
  \ **Dashboards**、事件 **Uptime checks** 等：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_553_1.png)\n\
  \n图 17.3 - Cloud Monitoring Overview 屏幕\n\n3. 在多项目场景中，通过在左侧窗格中点击 **Metrics Scope**，然后点击\
  \ **Add Cloud projects to metrics scope** 链接 (https://console.cloud.google.com/monitoring/settings/add-projects?project=pca-exam-314409)\
  \ 为每个项目启用监控：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_554_0.png)\n\n图 17.4 –\
  \ 添加 Google Cloud 项目\n\n现在我们可以看到带有所选项目的指标范围设置。您可以将项目添加到当前范围项目进行监控，也可以创建一个新的范围项目。选择好项目后，点击\
  \ ADD PROJECTS 按钮：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_555_0.png)\n\n# 图\
  \ 17.5 – Metrics Scope – Settings\n\n4. 您可以选择是否要监控 AWS 资源。这需要您在 AWS 中创建一个 IAM 角色，并列出权限。如果您只使用\
  \ GCP，则可以点击 Skip AWS Setup 启动监控。\n\n> 考试提示\n> Google Cloud 运维套件也能够监控您 AWS 账户的日志数据。您必须将\
  \ AWS 资源与一个 Google Cloud 项目关联。该项目充当与 AWS 的连接器。\n\n现在我们已经配置了 Google Cloud 的运维套件，让我们来看一下监控服务。\n\
  \n# Cloud Monitoring\n\n使用 Monitoring 服务，您可以发现并监控所有 GCP 资源和服务。Monitoring 控制台允许您查看所有资源、创建警报策略、查看正常运行时间检查、组和自定义仪表板。它还允许您导航到调试、跟踪、日志记录和错误报告控制台。\n\
  \n让我们看看这里可以配置什么。我们将研究以下主题：\n\n- Groups\n- Dashboards\n- Alerting policies\n- Change\
  \ screen\n- Uptime checks\n- Monitoring agents\n\n# Groups\n\n诸如 VM 实例、应用程序和数据库等资源可以被分组到逻辑组中。这使我们能够一起管理它们并在仪表板中显示它们。约束用于定义筛选资源的标准。它们可以基于名称、区域、应用程序等。组可以相互嵌套，嵌套深度可达六层：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_556_0.png)\n\n图 17.6 – 创建组\n\n上图显示了创建新组的屏幕。我们可以使用多个标准来筛选要添加到组的资源。\n\
  \n# Dashboards\n\n仪表板允许我们在一个视图中对不同指标进行可视化。我们可以创建多个仪表板，其中包含基于预定义或用户定义指标的图表。这使我们能够创建包含最重要的指标的自定义面板。图表可视化指标，有助于很好地了解您的环境性能。\n\
  \n请注意，对于 VM 实例，我们除了标准指标外还可以看到基于代理的指标。基于代理的指标会在您进入 Dashboards 并点击 +CREATE DASHBOARD\
  \ 按钮时列出。接下来，从库中选择一个图表并点击 Metric 下拉菜单：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_557_0.png)\n\
  \n图 17.7 – Dashboards\n\n# Alerting policies\n\n可以配置警报策略，以便在事件和指标阈值达到时创建通知。策略可以有一个或多个条件来触发警报，并会创建在\
  \ Cloud Monitoring 控制台中可见的事件。\n\n可以为处理打开的事件选择以下操作：\n\n- **Acknowledge**\n- **Silence\
  \ Associated condition**\n- **View Policy**\n- **Edit Alerting Policy**\n\n这些操作的菜单在您点击右上角的三点图标时打开：\n\
  \n![](img/de2c97ab017f36b3750a5bade111edd7_558_0.png)\n\n图 17.8 – Alerting policies\n\
  \n事件可以被确认为已知问题或已解决。关于通知，可以配置电子邮件、短信等多种形式。可使用的渠道可从下拉菜单中选择，如下图所示：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_559_0.png)\n\
  \n图 17.9 – Notifications\n\n为了进一步指导操作找到可能的解决方案，还可以将文档链接附加到警报。\n\n# Uptime checks\n\
  \n正常运行时间检查用于从全球不同位置检查服务的可用性。它们可以与警报策略结合使用，并在仪表板中显示。检查可以使用 HTTP、HTTPS 或 TCP 进行，可用于\
  \ URL、App Engine、Elastic Load Balancing (ELB)、Kubernetes 的负载均衡器服务以及 Amazon EC2 和\
  \ GCE 实例。探测间隔可设置为 1、5、10 或 15 分钟：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_560_0.png)\n\
  \n图 17.10 – Uptime check\n\n您还需要选择从哪些区域执行检查。您至少需要检查三个区域：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_561_0.png)\n\
  \n图 17.11 – Regions\n\n在后续部分中，您可以添加主机标头、更改端口、添加自定义标头并对其进行加密。您也可以在适用时添加身份验证：\n\n\
  ![](img/de2c97ab017f36b3750a5bade111edd7_561_1.png)\n\n图 17.12 – Advanced settings\n\
  \n在 **Response Validation** 部分，您可以设置 **Response Timeout** 并为响应设置内容匹配：\n\n# Response\
  \ Validation\n\n指定数据以及该数据如何与实际响应数据进行比较。\n\n图 17.13 – Response Validation\n\n最后，您可以设置警报和通知。您可以选择应使用哪个通知渠道发送通知。如果尚未存在渠道，您可以从此处创建一个新的：\n\
  \n# Alert & Notification\n\n定义 Uptime Check Alert Condition。\n\n图 17.14 – Alert\
  \ & Notification\n\n\n\n\n> 考试提示\n> 请记住，要使正常运行时间检查正常工作，必须创建防火墙规则。要检查正常运行时间服务器的 IP，请前往正常运行时间检查控制台并下载规则列表。有关如何操作的详细信息，请查看文档：https://cloud.google.com/monitoring/uptime-checks/。\n\
  \n## 监控代理\n\n要充分利用 Cloud Monitoring，可以在实例上安装监控代理以收集额外的指标。默认情况下，监控代理会收集磁盘、CPU、网络和进程指标；不过也可以收集额外的指标。\n\
  \n监控代理是一个基于 collectd 的代理，可以安装在 GCP 和 AWS 实例上。代理还可以配置为监控许多应用程序，包括 Apache Web 服务器、Tomcat、Kafka、Memcached\
  \ 和 Redis。\n\n在 Linux 上安装代理非常简单，只需执行以下两个命令：\n\n```\ncurl -sSO https://dl.google.com/cloudagents/add-monitoring-agent-repo.sh\n\
  ```\n\n```\nsudo bash add-monitoring-agent-repo.sh --also-install\n```\n\n要在 Windows\
  \ 机器上安装代理，请在 PowerShell 中运行以下命令：\n\n```\n(New-Object Net.WebClient).DownloadFile(\"\
  https://repo.stackdriver.com/windows/StackdriverMonitoring-GCM-46.exe\", \"${env:UserProfile}\\\
  StackdriverMonitoring-GCM-46.exe\") & \"${env:UserProfile}\\StackdriverMonitoring-GCM-46.exe\"\
  \n```\n\n更多说明可在 https://cloud.google.com/monitoring/agent/install-agent#agent-install-windows\
  \ 找到。\n\n> 考试提示\n> 要监控实例内存，您需要使用监控代理！\n\n## Cloud Logging\n\nCloud Logging 是第二重要的服务。它允许您存储和分析日志，以及来自\
  \ GCP 和 AWS 的事件。基于日志，可以创建警报。它还提供了一个强大的 API，允许日志既可被管理和注入。这意味着任何第三方应用程序都可以利用 Google\
  \ Cloud 的运维套件用于日志记录目的。收集的日志在 Legacy Logs Viewer 中可见，在那里它们可以被过滤并导出以供进一步分析或归档，或与第三方解决方案集成。有许多类型的日志，其中一些默认未启用。基于日志的指标使用日志条目，可以用于创建仪表板图表和自定义警报。现在，让我们更详细地了解如何使用日志。我们将介绍以下主题：\n\
  \n- Logs Viewer\n- Basic log filtering\n- Advanced filtering\n- Exporting logs\n\
  - Logging agent\n- Log-based metrics\n- Cloud Audit Logs\n- Activity\n- Retention\n\
  \n## Legacy Logs Viewer\n\n> **考试提示**\n> **Legacy Logs Viewer** 是 Stackdriver 中使用过的工具。您仍可从\
  \ Google Cloud 的运维套件中访问它。此工具的新版本具有完全不同的用户体验，称为 **Logs Explorer**。我们将在下一节中查看它。请保留本节以备参考，以防考试中出现相关问题。\n\
  \nLegacy Logs Viewer 是一个控制台，允许您查看、过滤和导出日志。请记住，日志与单个 GCP 项目相关联：\n\nFigure 17.15 –\
  \ Legacy Logs Viewer\n\n要能够查看其他项目的日志，您需要切换视图。可以使用 API 从多个项目获取日志。日志可以使用基本或高级过滤进行过滤，以精确定位特定事件。\n\
  \n## Logs Explorer\n\nLogs Explorer 是 Google Cloud 运维套件中的一个新工具，允许您检查 GCP 日志。当您在\
  \ GCP 控制台中打开 Cloud Logging 服务时，它会作为默认窗格弹出：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_565_0.png)\n\
  \nFigure 17.16 – Accessing Cloud Logging\n\n使用 Logs Explorer，您可以选择以两种不同的范围查看日志：\n\
  \n- Scope by project – 允许您搜索和查看单个项目的日志\n- Scope by storage – 允许您查看用作接收器的存储桶中的日志\n\
  \n第二个选项非常方便，因为它允许您在浏览接收器日志时获得与项目中仍保留的日志相同的体验：\n\n![](img/de2c97ab017f36b3750a5bade111edd7_566_0.png)\n\
  \nFigure 17.17 – Refine scope\n\n要找到您感兴趣的日志，您可以通过简单地从过滤器选择的对象的列表中选择一个过滤器然后选择一个值来定义查询：\n\

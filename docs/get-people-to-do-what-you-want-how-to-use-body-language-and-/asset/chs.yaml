  \n### 控制问题\n\n控制问题是你已知答案的问题。在情报工作中，这些问题用于确定对方是否在说真话。如果你知道答案就问“你在周二在哪儿？”，这会让你警觉对方是否会对你撒谎，或观察他在如实回答时的肢体语言。控制问题的用途是无穷的。熟练的提问者会用它们来转移对话方向或对信息源施加压力以制造紧张并验证其真实性。\n\
  \n### 重复问题\n\n简单地复述或以另一种方式提出相同问题就是重复问题。重复问题是验证信息源是否在撒谎的另一种方式。如果她每次给出的答案都不同，她就是在撒谎。这种工具的复杂版本会把问题切成碎片，从而触及答案的不同细微之处，然后整合多个答案以获得全貌。\n\
  \n### 引导问题\n\n引导问题透露了你想听到的内容。要善于让人们提供信息，你需要先促使他们进入对话；引导问题可以起到这种作用。将某人引导到一个位置以便成功使用心理杠杆，往往需要把他或她引向一条对话路径。引导问题在为后续问题做铺垫时最有益；它们的结果通常是肯定的或否定的。许多引导问题涉及动词\
  \ *to be*，例如丹·拉瑟对萨达姆·侯赛因提出的这个问题：“总统先生，您是否预计会遭到美国领导的入侵攻击？”¹² 除非你故意想引导目标，否则以“你会”、“你是否”、“你是不是”开头的问题表明你需要重构你的问题。引导问题在建立对话控制方面具有价值，因为它们的结构有助于你绕过对方可能有异议的逻辑点。\n\
  \n### 复合问题\n\n这种提问风格旨在让人感到困惑。例如，“你去商店还是银行？”当你这样问时，她应该回答其中一个；然而，如果她不确定你在问什么，她就可以说不来逃避。记住，审讯的科学在于在最短时间内获取最多的信息。就我们的目的而言，复合问题可以成为审讯\
  \ *艺术* 的一部分。\n\n你可以用复合问题让对方失去平衡。例如，你可以问一名员工，“你打了那些冷电话还是完成了史密斯合同的文书工作？”这会让他对你认为哪项行动更重要产生怀疑。这可能是让他加班完成尚未做完的那件事的第一步，因为他试图解读你的意思。\n\
  \n### 套用问题\n\n这更多是一种准备风格，而非特定类型的问题。审讯者经常被要求在几个小时内成为某个主题的专家。因此，审讯者会提前准备问题，以便拥有正确的术语和正确的语境。在你的世界里，套用问题很有用，尤其是在你用对方自己的话来质问他或在复杂的社会问题中导航时。\n\
  \n### 否定问题\n\n“你不喜欢希拉里·克林顿吗？”\n\n一个人如何回答这样的问题？除了提问者之外，这个答案对任何人还有什么实际意义？这是在审讯者被教导要避开的另一种问题类型，因为它会造成混乱。然而，当你试图操纵某人时，混乱可能正是你想要的。把它保留在你的工具箱里。\n\
  \n### 模糊问题\n\n任何不包含具体信息如姓名、日期和情况的问题都可以被视为模糊问题。例如，你可以问，“你和他们在一起吗？”就日常语言而言，这种对话问题是常态，而且效果很好，因为每个人都理解上下文。没有人试图通过误导或回避来占据上风。然而，在你想操纵某人的情况下，双方的议程都可能存在。故意或无意地使用模糊的代词或概念可能导致双方产生误解。那个想把人带偏的问题者可能会在销售部门新同事讨论报销账户的对话中插话：“你会利用它们吗？”接收者可能会在老板面前自陷困境，回答说：“我为这家公司出差这么多，有时可能确实会。”当提问者回答说：“哦，真的吗？我是在开玩笑说新员工，”那么桌上的人就不知道这个问题是措辞不当且无害，还是暗藏玄机。\n\
  \n## 练习：专业人士是如何做的\n\n收听深夜脱口秀节目的访谈片段并标记所提问题的类型。对问题进行分类，不仅按类型，还要根据“坏”问题是否被巧妙使用。\n\n\
  除了提取关于问题的信息外，问题还能让你洞察个人。它们也是管理对话的有力工具。当你将对话引导向揭示个人各方面的结果时，你可以使用一系列提问风格，而谈判中的人们例如就不应使用这些风格。当你认为某人具有欺骗性，或你只需要基本事实时，沿着审讯者的路径走并避免他们避免的问题——引导、复合和否定。审讯者和需要保持信息纯净的人在日常生活中提取信息时往往听起来像机器。\n\
  \n还要考虑你的受众。你即将提问的人是按时钟驱动的效率专家吗？还是一个大局观、艺术型的细节不重要的人？还是她如此注重细节，以至于时钟和大局都不重要？问题不仅要对你有意义，对你的目标也必须有意义，如果你想要一个干净简单的答案。问问题的方式要让她能够以信息被存储的方式访问信息，因此，\n\
  \n\n轻松回应。当你在寻找信息时，你应该设计问题和流程，考虑目标对象的思维方式；但当你想要打乱她的节奏或迷惑她时，你应该改变风格，迫使她走出舒适区。\n\n\
  ## 提问策略\n\n理解每种提问类型如何融入整体计划，能使你提出的每个问题成为下一个问题的基石。\n\n- **无论你决定使用何种提问风格，开口之前都要先思考。**\
  \ 如果你有很多问题要问，但大脑没有妥善准备，你的策略就会失败；你不会有目标对象能跟随的良好流程，更重要的是，你最终会追着蝴蝶跑。\n- **你可以故意采用散弹式模式，提出看似毫无章法的问题，但最终引出你需要的信息。**\
  \ 当你担心采用线性的、目标明确的问题会暴露你的意图，从而得不到直接回答时，这种方法非常理想。\n- **问“下一个问题”。** 不要问“你结婚了吗？”而要问“你妻子的名字是什么？”不过要运用常识。如果问错了下一步，你可能会显得像个傻瓜。\n\
  \n### 练习：专业人士为何这样做\n\n再次收看一档大型访谈节目。这一次从宏观视角来看。跟随采访者的问题，看看你能否发现他或她行为背后的魔力。你能从所问的问题中看出意图吗？在那番漫谈背后是否隐藏着一个总体计划，还是采访者只是在问一些好奇的人们想知道的毫无关联的问题？如果你能发现其中的意图，在制定提问策略时把它记在脑子里。其他人也可能在寻找你的意图。\n\
  \n问题是推动对话的工具。当你着手计划应对某人的策略时，这些工具将变得无比宝贵。在一天中，思考你提问的有效性。疑问词是你的向导，还是你像三岁孩子一样，在每个节点追着每一只蝴蝶问“为什么”？“为什么”是个好问题，但往往需要通过其他疑问词来回答。使用“为什么”这个词，很少能得到与探究“为什么”相同的明确答案。如果你先问“何时”“什么”“如何”“谁”这些问题，你就会得到“为什么”。\n\
  \n- 约翰·布朗是谁？\n- 他生活在什么时候？\n- 他做了什么？\n- 他是怎么死的？\n- 还有谁和他一起被杀？\n\n回答这些问题的人最终会给你“约翰·布朗为何被杀？”这个问题的答案。\n\
  \n## 心理杠杆或方法\n\n尽管美国陆军称其为“方法”，但你可以将这些技巧视为探究一个人心理的方式。这就是为什么“*杠杆*”这一术语有助于锚定这个概念。只要对任何人有基本的了解，你就能选择一种或多种方法来从目标身上获得预期效果。\n\
  \n对某人施加心理杠杆的风格可分为两大类：*威慑*和*说服*。陆军列出了至少十四种不同的审讯方法，但这里只分解了与“正常”个人和职业互动相关的那些。\n\n###\
  \ 威慑\n\n- 1. *直接法。* 你直接询问你想知道的事情。在审讯术语中，这与其说是一种方法，不如说是一种要求。它表示：“你知道我是谁，这就是我想要的。”同样的情况也可能如此。请记住，就像一位光明正大的领导者一样，你可以要求渐进式的改变，而无需透露你的长期目标。\n\
  - 2. *恐惧施压。* 在这种情况下，我们只关注审讯人员所说的*轻度恐惧施压*，因为它的同伴*重度恐惧施压*在日常生活中绝不适用。人力资源经理可能会对行为不当的员工使用轻度恐惧施压：“你愿意跟我坦白这件事吗？还是宁愿和我的老板谈？他有权力当场解雇你。”\n\
  - 3. *沉默。* 想象一个舞台，你的谈话对象刚刚被推上舞台；所有人的目光都落在她身上，而她完全不知道自己的台词是什么。你可以通过简单地提出一个棘手的问题，并且不提供任何帮助来营造这种感觉。\n\
  \n### 说服\n\n- 4. **恐惧缓解。** 你急忙去阻止某人的情绪“流血”。你可能会想：“嗯，这很好。这怎么会被视为心理操控呢？”如果你打算以此获得对方的信任，从而影响他的行为，那就是心理操控。这通常与轻度恐惧施压结合使用，以营造好警察/坏警察的效果。\n\
  - 5. **激励。** 给对方他真正、真正想要的东西，比如邀请他加入你与公司CEO一起的高尔夫四人组。也可以是一些简单的事情，比如给他一小时假，让他能按时赶到儿子的足球赛。越有区分度越好。\n\
  - 6. **情感。** 利用强烈的情绪来对付对方；例如，如果她爱她的工作胜过世上任何东西，那么说服她：按你的方式去做会让她成为公司英雄。情感关键也可能涉及相反的一面，即对某事或某人的憎恨。运用这一技巧时，要重点利用归属感和差异化。如果她爱某样东西，她会想要培养并紧紧抓住它；如果她恨某样东西，她会想要远离它。\n\
  - 7. **自尊与自负（提升或打压）。** 你用这种方式要么膨胀一个人的自负，要么打压它。我们都知道赞美的力量，但对合适的人而言，贬低也能奏效。你不应该用消极的方法去拉拢一个缺乏安全感、能力不足的人。他可能已经知道自己有不足，这样做只会让他疏远你。其意图是，当你让某人感到自己很特别时，他会想要配得上这份赞美。当你看着与你交谈的人，并试图注意他有意或无意的反应变化时，这些线索会告诉你该施加多大压力，或者何时该收手。\n\
  \n## 肢体语言/基线行为\n\n为了有效使用本书中的所有工具，你需要掌握的一项基本技能是*基线化*。基线化意味着确定一个人在正常情况下的行为和说话方式。只有当你理解什么对目标对象来说是正常的，你才能发现变化。\n\
  \n什么是正常？在几乎没有压力的情况下，人们会使用对他们自己来说*正常*的声音语调、节奏、词汇选择和动作。这并不是指*你*认为的正常，或你认为应该有的正常，而是*对他们*来说的正常。格雷格可以这样说：“这是我这辈子见过的最糟糕的屁股浮潜例子”，而会议室里的人不会觉得奇怪。他们会想：“这很哈特利。”如果玛丽安这么说，人们会以为她（a）喝醉了，（b）在模仿格雷格，或者（c）极度紧张。因此，基线化的第一步是让一个人处于一个轻松的环境和话题中，让交流保持放松，至少不在情感和智力上提出过高要求。用不带威胁性的问题以轻松的语气开始对话。\n\
  \n当你进行基线化时，这是一个有意为之的行动。你设置一个情境，在其中有意地交谈和行动。这样，你就能深入了解一个人的行为、言语模式、肢体语言和精力水平。这个基线为你使用审讯工具箱中的其他工具提供了一个模板。当你看到变化时，你就知道其他工具正在起作用。通过学习基线化，你能扩充自己的技能组合，并增强其他工具的有效性。\n\
  \n### 声音\n\n要对声音进行基线化，请注意语调、音高、节奏、词汇选择，以及*嗯*和*啊*之类的填充音，或*比如*、*基本上*之类的填充词，或任何其他无意义的占位词。\n\
  \n- ***语调。*** 如果你的母亲在你小时候说“请到外面去”，她的语调会告诉你你需要知道的一切。如果她举止平静、温和，这可能是在邀请你去看一只新小狗。但如果语气简短、严厉，这可能是一个强烈的讽刺警告：不要碰门把手。语调关乎声音的起伏和单词的重音。无论说出的词是什么，语调都表明了词语的含义。如果你有宠物，用欢快的语调对宠物说：“我太生你的气了，我要把你送给陌生人。”它的反应是什么？语调让这一切听起来像是“我爱你，毛毛。”我们都听过父母或伴侣的告诫：重要的不是你说什么，而是你怎么说。\n\
  - ***节奏。*** 一个人说话的速度与他脑海中的想法相关。确定他的正常语速，并留意变化。一个新泽西人在佐治亚州会很突出，正如一个佐治亚人在新泽西州也很突出。一旦你确立了他的常态，偏离常态就表明他脑子里的想法发生了变化。\n\
  - ***音高。*** 激动、对话题的热情以及不确定都会导致音高上升。再说一次，这是对这些情绪的常见反应，但关键是你意识到这种变化。约翰·洛维茨\n\n\n\n\
  在建立基线时，你应注意的其他声音线索包括发音清晰度、详略程度和话语尾音。如果你还记得妈妈在你没做作业时责骂你，每个字都咬得很清楚，你就能明白压力如何影响这种发声模式。反过来也可能成立，因此你可能会发现某人说话含糊不清，偏离其基线。发音清晰度也可能与口音有关。乔治·W·布什总统的讲话总是带有口音，每个词的发音都带着得克萨斯州的鼻音。无论他是否显得紧张，都是这样；但对某些人来说则不然，他们在感到压力时要么口音变得更重，要么会刻意摆脱口音。关于详略程度，想一想为什么一个通常絮絮叨叨讲细节的人会突然给出简短生硬的回答？或者为什么一个用词如手术刀般精准的人会突然变成话痨？最后，有些人习惯性地让句子尾音渐弱，而另一些人只在不想让你听到他们说什么时才这样做。无论原因是什么，总有某些东西偏离了基线。\n\
  \n## 眼睛是心灵的窗户\n\n如果言语和说话模式能暗示某人对某些问题的态度，那么当人类思考时，我们的眼睛会转动。大多数美国人认为，避免眼神接触是欺骗的迹象，但这其实表明你提出了一个需要思考的好问题。换句话说，眼睛的运动可以显示某人在调用大脑的某个特定部分。通过几个简单的步骤，你就能辨别是哪一部分。\n\
  \n大脑的结构或许能解释为什么会出现这些眼球运动模式。视觉皮层位于头部后方，因此人们在提取视觉线索时，通常会向上越过眉脊看向一侧或另一侧。声音处理区位于耳朵上方，因此大多数人在提取听觉线索时，眼睛只会略微上移并偏向一侧，通常是在眉脊和颧骨之间。情绪和计算是特殊情况，我们将在基础讨论之后再作研究。\n\
  \n## 通过提问建立眼球运动基线\n\n回答下面这个问题时，注意你自己的眼睛：你最后一次在电话里听到的话是什么？\n\n当你回答时，你很可能会发现自己的眼睛略微向上并向左移动。如果你与此不同，那很可能是略微向上向右，或者，如果你听到的话带有强烈情绪，则可能是向下向右。我们中超过一半的人会以一种方式反应——向左看——其余的人则看向另一边，除非这个反应与情感问题有关。\n\
  \n这个问题迫使你去回忆，而不是虚构。这个问题很简单，只涉及一个简单事实，而且你没有理由对自己说谎。但如果你问一个人这个问题，而真实回答会让她难堪或对她不利呢？她可能会编造一些东西，那么眼球运动的反应就会不同。\n\
  \n要确定一个人说真话时的眼球运动模式与想象时的模式有何不同，你应从你知道答案的问题开始建立基线。例如，披头士乐队歌曲“Hey Jude”的第五个词是什么。建立基线的四个步骤很简单：\n\
  \n- 1. **提出优质、可靠的控制性问题，以引发叙述性记忆反应。** 这意味着你应该问对方一个你知道答案的问题。所问问题需要对方稍加思考，但不能是常识性问题（因为答案无需思考）。\n\
  \n- 2. **提出能隔离单一感官的问题。** 因为大脑会将不同感官的处理区隔离开来，你可以提出一些问题，让一个人独立地调用每种感官记忆。关于歌词的问题是练习听觉回忆的良好基础。像去某个地标的驾车路线，或者描述你们都认识的某个人，这类问题都是很好的视觉问题。这不必刻意为之。你可以这样说：“我的一位同事问我，我会如何从外表上描述鲍勃\
  \ [注意：你需要选一个长相普通的人来做这件事]，我当时很难回答。你会怎么说？” 这样既能带来挑战，又能让对方展示他们的能力。\n\n- 3. **在建立视觉和听觉基线时，远离情绪化话题。**\
  \ 避免那些会引发愤怒、激情或创伤回忆的问题。例如，如果你询问一位离异配偶的已故父母，你很可能会收到混杂的信号。\n\n- 4. **观察并记录他的眼睛看向何处以获取记忆。**\
  \ 一旦你获得了听觉记忆和视觉记忆的基线，你就会发现创造性……\n\n两种特殊的存取线索是情绪和计算。情绪是向下且偏右。计算是向下且偏左。你可以利用这一知识建立基线。了解这一点会在你使用讯问工具时给你优势，因为你会能够识别出那些本应是事实性问题上的“创造性”答案。仅仅拥有这一信息，甚至不必当面点破，就能让你在任何交流中占据上风。\n\
  \n观察你的对象的其他面部特征哪些是正常的。玛丽安认识一个人，因为神经损伤而定期眼皮跳动。这对她来说是正常的，而不是压力的迹象。一个人微笑的方式也是基线的一部分。对某些人来说，正常的微笑可能是歪歪扭扭的咧嘴笑，但在做演示时，他们可能会刻意使用更均匀的微笑，因为人们通常认为这是一种值得信赖的表情。\n\
  \n## 身体表达心灵的思想\n\n通过解读身体语言来衡量你在运用心理钥匙和提问技巧方面有多成功。利用身体语言来放大你的成功。本节侧重于前者，为你主动运用身体语言知识做准备。\n\
  \n通过从头到脚解读关键身体语言快照，你将了解构成怀疑、抗拒、接纳以及其他与让人做你想做之事相关情绪表达的各个部分。例如，你需要知道，当某人下意识地发出信号表明你所做的事情已造成她痛苦时，你必须在重新获得对她的影响力之前后退一步。塑造情绪表达的关键因素是精力和专注。\n\
  \n为了准确解读身体语言，你必须知道如何以及何时将自己从这一方程式中抽离出来。当你与某人互动时，解读身体语言涉及一个悖论：这完全与你有关，又完全与你无关。它完全与你有关，因为你引发了对方的反应，并且需要理解这一反应以继续连接或破裂的进程。它完全与你无关，因为你不能根据自己如何表达某些情绪来推测对方的姿势、姿态和声音特征意味着什么。记住要建立基线。你始终要记住其他人以及你自己用身体沟通的独特方式。有时抓痒只是意味着痒；而其他时候，你就是那个象征性的痒。\n\
  \n例外情况是某些不自主的、普遍的动作，这些动作传达出一致的信息。其中一种你可能每天都看到的是挑眉信号，表示“我认识你！”或“我以前听说过。”格雷格曾看到过一些否认彼此认识的战俘，在意外相遇时迅速挑起眉毛，这变成了如此可靠且一致的身体语言，以至于他将其含义定义为“认出”的标志。我们在街上、商店里和会议中都见过这种情况，但由于它太本能了，我们通常不会注意到。了解这种瞬间的眉毛上扬，能让你在评估某人会立刻与哪些人、哪些想法产生共鸣时占据明显优势。\n\
  \n### 四大要领\n\n\n\n你解读肢体语言的起点是四种基本动作类别：图解动作、调节动作、适应动作和屏障动作。\n\n## 图解动作\n\n肢体语言能帮助你用嘴说出你的意思。从你的球队达阵得分时挥拳庆祝，到用手和手臂比划环形楼梯的台阶如何蜿蜒盘旋，你使用图解动作的方式数不胜数。\n\
  \n玛丽安与一个土生土长的纽约人一起观看了第四十二届超级碗，这个人的手臂、腿和声音精确地表现了他对巨人队表现的真实感受。\n\n当你阅读本节中其他类别的手势时，请记住，除了图解动作外，他没有展示任何其他类别：每一个动作都聚焦于一种情绪。图解动作是心灵对思维的强调；可以把它们视为心灵的仆人。留意这些动作是否支持一个人所说的话。当两者开始出现分歧时，你就发现问题了。\n\
  \n顺便说一下，这是一个欣赏文化差异的好机会。例如，具有日耳曼背景的男性倾向于使用靠近身体的图解动作，手臂保持在肩膀以下（这在美国中西部很典型）。而地中海或西班牙裔血统的男性则会自如地使用更高的手臂姿势。\n\
  \n### 练习：用动作图解你的感受\n\n请一位你信任的人在交谈中观察你。允许对方在没有事先警告的情况下进行观察，然后倾听对方关于你表达观点时动作方式的描述。如果对方注意到你的言语和身体强调方式之间出现偏差，回想一下是什么原因造成的。是你的心不在此处，而嘴巴却在说别的吗？\n\
  \n## 调节动作\n\n你可以像许多父母那样，通过将手指放在嘴唇上做出拉上拉链的动作，或者大幅挥动手臂表示“加快速度”，来公开地调节对话。你也可以更微妙地使用调节动作：当你想让某人停止说话时噘起嘴唇，或者用力点头以鼓励对方说得更快。\n\
  \n### 练习：排水管中的塞子\n\n观察会议上当有人用老生常谈的内容让与会者感到无聊时——无论是几乎所有人都听过的完整演示，还是其中的一小部分——人们会有什么反应。一些调节动作会不自觉地流露出来，因为人们根本无法控制自己：钢笔敲击桌子、手指用力按压嘴唇。另一些则相当刻意：用离题的问题打断发言、老板用手在喉咙前横划表示“停”。\n\
  \n## 适应动作\n\n适应动作是释放紧张能量的方式，但即使在一本肢体语言百科全书中也无法一一列举。人们用身体来缓解不适的方式往往因人而异，但常见的适应动作包括男性用力摩擦的动作——手、手臂、腿、脖子——以及女性的抚摸动作，这是男性摩擦动作的柔和版本。其他适应动作还包括抠指甲边缘、用脚打拍子和紧张地来回挪动。当你看到这样的动作时，你就知道这个人正在无意识地采取行动来适应环境。随着你对肢体语言的了解加深，你就会知道看到适应动作是意味着你得到了想要的反应，还是按错了按钮。\n\
  \n### 练习：试着静坐片刻\n\n大多数人对自己在陌生环境中为缓解不适所做的独特行为知之甚少。下次你参加会议或与陌生人社交聚会时，注意你的身体想要做什么——摩擦、来回挪动、移动铅笔或叉子，或者你当下的任何冲动。这一次，不要做。你发现这种冲动以另一种方式泄露出来了吗？比如某种小动作，或者你坐在那里，完全静止，像动物面对捕食者靠近时那样。将皱起或紧锁的眉头与拉长的嘴巴，或下拉的嘴角结合起来，你就会看到一些严重的怀疑甚至厌恶。\n\
  - *单眉挑起。* 从*《星际迷航》*中的斯波克先生到你二年级的老师，人们可以用单眉挑起传达截然不同的含义。斯波克经常在做出这个表情时配上*有趣*一词。而你的二年级老师更可能在挑眉的同时带上一丝猜疑的眼神和微微的假笑，表示她根本不相信你的仓鼠吃了你的作业。\n\
  - *双眉挑起。* 这是一个你在各种人身上见过成千上万次的手势，从做演示的新员工到发表国情咨文的美国总统。抬起并保持双眉上挑是另一种不由自主的、普遍的肢体语言。格雷格在审讯时期开始称其为*寻求认可*；这是一种表示不确定的挑眉。它通常也伴随着听觉线索：这个人说出来的话听起来很像问题。无论他们是否真的问“你相信我，对吧？”这就是其含义。关于寻求认可，需要注意的重要一点是，这个人在询问你如何看待他所说的话。抬起……\n\
  \n会在眼睛周围产生皱纹？看到那些少数真正这样做的人，与那些为镜头而非为公众微笑的人，你有什么感受？\n\n练习的第二部分，在电视或互联网上观看一些访谈节目。注意名人如何逐渐进入访谈状态，从职业微笑转变为真诚的微笑。这就是优秀访谈者的魔力——能够唤起名人的真实情感，让你感受到真诚。如果你的名人嘉宾从未达到那种状态，会发生什么？\n\
  \n- **假笑。** 嘴巴紧闭，向一侧拉直或嘴角下拉，传达的是厌恶，尤其是与皱起的眉头结合时。与单眉挑起同时出现（正如我们之前提到的那位老师），你就有了可信度问题。再加上紧闭的双眼，你会看到痛苦的表情。简而言之，假笑是几种情绪表达中刻意呈现的核心元素。这些表情有什么共同点？它们都是负面的。紧闭的嘴巴充当屏障，而脸的其他部分则解释了这一屏障的含义。\n\
  - **双唇微张。** 时尚杂志上满页都是微微张开嘴巴的女模特，以展现一种性感的脆弱感。这是刻意做出的张嘴姿势，带有一种文化内涵，即这位女性“懂得如何取悦他人”。第一夫人梅拉尼娅·特朗普是一位前超模，她以采用这种造型而闻名。无数文章证实她这样做是因为……\n\
  \n\n所谓的鱼嘴是迎合摄像机的姿势；她这样做让那些认为她有吸引力的人觉得这种造型“合法化”了。即使不是有意为之，这个表情仍然带有文化含义，但它与刻意为之的正面效果一样负面。嘴巴不自觉地张开的人看起来似乎一无所知；这是令人震惊的愚蠢的表情。\n\
  \n## 练习：认出那种情绪\n\n在关掉声音观看情景喜剧或肥皂剧时，试着说出演员试图传达的情绪。我们推荐这类节目，因为其中常常存在夸张的情绪和情境。它们给了演员过度表演的机会，因此他们的面部表情更像是在向舞台后二十五排的观众投射的现场剧场演员的表情。\n\
  \n## 身体与情绪\n\n你可能以为仅凭面部表情就判断出了某人的情绪，但随后你会看到手臂或姿势似乎在传达不同的信息。以下是一些常见的手势，要么经常被误解，要么没有被理解为其真正的含义：\n\
  \n- **交叉双臂。** 在面向肢体语言学生的演讲中，以及在各种场合的混合观众面前，这是人们最容易弄错的手势。他们通常认为交叉双臂是一种屏障；做这个动作的人对你关闭了心扉。有时确实如此。但如果你看到一个\
  \ receptive 的面部表情并在对话中听到开放的语气，请考虑其他可能导致某人交叉双臂的原因，例如：\n  - 他们感到寒冷。\n  - 他们想遮住保养不佳的手。\n\
  \  - 他们超重或怀孕，用这个姿势遮住腹部。\n  - 他们想掩饰手臂过长或过短。\n  - 他们在主张一种主导地位。\n  - 这是一种习惯。\n\n把每一种肢体语言都当作语言的一部分。记住，如果你只看到动词，你可能无法完全理解一个句子的含义。\n\
  \n- **腿呈 4 字形交叉。** 格雷格曾被《明镜周刊》的记者仅因他倾向于这样坐，而不是像一个正派的欧洲绅士那样交叉双腿，而指责他傲慢。他的腿无法做出后一种姿势。她的判断是投射性的，而这是在解读肢体语言时你必须始终加以遏制的事情。\n\
  \n- **双手在生殖器前合拢。** 也被称为无花果叶姿势，我们可以称之为“保护珍宝”。所有文化中的男性在感到哪怕一点点威胁时都会这样做。他们在没有感到威胁时也会这样做吗？当然有可能，但要考虑到威胁有许多程度——有些是明显的和身体上的，有些是微妙的和心理上的。女性在压力下也会做类似的事情，通过交叉过\n\
  \n和流畅的插画师，手臂和手势表明接纳。你甚至可能会注意到对方对你的插画师的镜像，这表明此人感觉与你的想法同步。与此同时，你也会看到紧张的迹象，即适应器，并感到确信你正在与对方互动，同时你可能已经在相对于他方面确立了自己超典型的地位。注意点头和其他调节器所传达的信息，“是的，继续说”，作为你正在赢得他的进一步确认。\n\
  \n## 你输了\n\n你正在寻找与“你赢了”肢体语言相反的信号：封闭的、僵硬的、厌倦的和仇恨的动作。对于一个朝错误方向充满活力的某人，你可能会看到虚假的微笑，明显使用适应器暗示不耐烦——笔敲击、手指摩擦——以及表示“退后”和/或“闭嘴”的手势。或者你可能把目标逼得太紧，以至于看到绝对恐吓的迹象：无花果叶姿势、垂头、以及过度使用自我惩罚的适应器，例如抠指甲。如果你把某人激怒到试图迅速摆脱你的程度，你可能会突然看到诸如交叉双臂和双腿的屏障，或书籍或巨大的花瓶被放在你们之间。\n\
  \n对于后者类型，你会看到眉毛上扬并听到表示疑问的言语。他们会尝试表现出开放。与前者相比，你会得到更谨慎的行为。他们可能会问你很多问题并试图控制你们见面的地点和午餐时间——同时投射出开放和接纳的姿态。如果你处于一个她可以选择加入多方阵营的情境中，寻找她在你和其他人之间摇摆不定的迹象。这些包括注意力分散：在你和另一个人之间来回关注，向你们各自发送隐藏信号，或对你或你们两人投去短暂的微笑，随后迅速收敛，同时从眼角观察你。在某些情况下，这是算计的；在其他情况下，这是无意的，因为她像在马路上遇到松鼠的大脑一样在寻找平衡。\n\
  \n## 犹豫不决……或中了塔兰特勒格拉咒\n\n有些人躲闪和编织得如此熟练，以至于你很难判断他们对*任何事情*是否有正常、可预测的反应。有些人躲闪和编织是因为他们很难决定朝哪个方向走。他们的行为是哈利·波特塔兰特勒格拉咒的温和版本，该咒语会导致不受控制的舞蹈。当一个人不确定时，身体和大脑会为控制权而挣扎，结果可能看起来像他们正常行为的躲闪式故障版本。\n\
  \n可以通过简单观察此人如何移动来为身体其他部位建立基线，或者你可以像观察眼动那样把它变成一个练习。先从练习开始是个好主意，这样你就能练习有意识地观察。\n\n\
  ## 练习：观察动作\n\n让你的观察对象舒适地坐着，但要处于允许移动的姿势。换句话说，柔软的沙发不是理想的地方。提出从随意到个人再到探究性的问题。随着问题的越来越具侵入性，你应该注意到身体的变化。以下是示例问题，显然应根据你交谈的对象重新调整：\n\
  \n1. 你上小学时在哪所学校上学？\n2. 你在课间休息时做了哪些有趣的事情？\n3. 你有没有和班上的孩子打过架？\n4. 你的老师有没有因为不是你的错的事情而责备过你？\n\
  5. 班上的孩子曾经对你做过最糟糕的事情是什么？\n6. 在某个时候，你一定也伤害过他们。做了什么？\n7. 你成年后有没有做过让你对自己感到厌恶的类似事情？\n\
  \n你可以用不同的方法获得相同的结果。在这种情况下，不断追问更多细节，直到此人用尽信息。那时，情绪和压力就会浮现。\n\n- *你做过最令人兴奋的事情是什么？*\n\
  - “跳伞。”\n- *为什么它如此令人振奋？*\n- “我以为我做不到，但是一旦做了，我就想再做一次。”\n- *你跳之前需要上课吗？*\n- “我们在教室里待了大约两个小时，然后接受了大约两个小时的实践训练。我们的教练非常注重安全。”\n\
  \n> 问题可以升级到如此复杂的程度，以至于只有专业人士或经验丰富的人才能回答。当你的观察对象达到“我不知道”或“我不记得了”的程度，而你继续提问时，她可能会开始感到不足，并为不知道而找借口。随着不确定性的加剧，注意身体位置的突然变化，以及手臂和腿部暗示某种情绪正在泄露的动作。\n\
  \n## 试探\n\n以下是一些让你在不明确提问的情况下获取信息的技巧。请记住，它们是明显操纵性的，应谨慎使用。在使用这些技巧时，记住确定某人的策略的练习。\n\
  \n- ***重复人们说的话。*** 只需重复某人说的话，你就能经常促使他对含义进行阐述，甚至可能迫使他承认自己说的话并不完全属实。例如：\n\n  > “我今天在路上看到八十只麋鹿！”\n\
  \  >\n  > “哇，八十只麋鹿？！”\n  >\n  > “嗯，也许五十只。我没时间数。路上很混乱。但这是我见过的最多的一次。一定是发生了森林火灾！”\n\
  \n  通过重复他的原话，他透露出夸张的倾向，至少在一次承认中如此。至少，他透露了你可以用来继续下一步的信息。相关的应用是使用他的话来\n\n\n\n锚定一个你之后想再回看的内容点。用反问式的语气说一句“哇！八十头麋鹿！”可以为你之后提供一个占位符（或者说锚点）。这表明你已经注意到了。\n\
  \n- ***你告诉我你的秘密，我就告诉你我的。***  这是一个老套的间谍技巧。主动透露一条看似私密或机密的信息，往往能换来对方同等的回应。（当然，你绝不能透露任何真正有价值的东西。）\n\
  - ***平行提问法。*** 我们没有把这归类到提问技巧那一节，是因为它依赖多种不同类型的提问方式，把对方引向一条平行的路径，从而掩饰你的真实意图。比如说，你想知道最近一次部门主管会议上谁占了上风，因为你个人利益上希望技术组获胜。你在咖啡机旁堵住的那位同事，如果营销组得势她会更高兴，所以你不能让她看出你的真实意图。\n\
  \n“那个会议室里椅子都快坐满了。大家都带家属来参加了吗？”\n\n“他们请了一些管理顾问来做个关于如何改进运营的演示。”\n\n最终，这场对话会透露出顾问们建议了什么，于是两条平行线就此交会。\n\
  \n## 积极倾听\n\n积极倾听意味着你不仅听到人们说了什么，也要听出他们*没有*说出来的内容。你可以借此发现人们的某些侧面，如果你只从字面上理解他们的对话，这些侧面是不会浮出水面的。这需要用上听觉层面的...\n\
  \n在电视上看到某个政客受到批评。审讯人员用*推拉词*这个术语来描述那些绝不会无缘无故说出口的词；例如，他说某人靠*诚实*劳动谋生。这本应是理所当然的事。这就像朱丽安·摩尔说“我是天生的红头发”一样。在那句话里，*诚实*成了一个需要商榷的点。这会引发一些问题：你认为什么才算诚实？是不是你认识某个不靠诚实劳动谋生的人，想拿来做个对比？或者，这个现在靠*诚实*劳动谋生的人，可能过去并非如此？你可以把很多常见的表达都归入这一类，因为它们会削弱说话者的可信度：她*真的*救了我的命。这款产品*非常*独特。*说真的*，我想不出还有谁比他更适合这份工作。\n\
  \n- ***强调某些词。*** 无论强调出现在恰当的位置还是不恰当的位置，都能让你看出这个人对这个话题有多投入，也可能指向他正在为讨论的问题感到压力。把上一段中的斜体词都加上重音，你会感觉这个人正在过分卖力地掩饰；但如果你把句子中每个词都同样重读，那你遇到的则是一个听起来绝望、愤怒或带有某种极端情绪的人。无论哪种情况，都说明他正承受压力。\n\
  \n- ***一带而过。*** 避开某个话题，或者圆滑地绕过问题的含义，转向一个更舒服的话题，这表明此人想要隐藏信息。你见过多少次政客或其他名人卷入丑闻时，在采访中答非所问？“问得好，迈克！我可以讲个故事来说明我对这个问题的立场。”接下来就是一段漫无边际的胡扯。\n\
  \n- ***跨越时间线。*** 在讲故事或回答问题的时候突然跳转时间线，这会让一个积极倾听者警觉：你对这个话题有什么不舒服的理由。这正好是构成“省略性谎言”的完美伏笔。“抱歉我迟到了。我一整个早上都在见客户，然后就直接赶过来开会了。”如果客户的办公室只隔两条街，而他迟到的会议是下午三点，这可就值得怀疑了。\n\
  \n- ***改用被动语态。*** 这是一个人与某个话题保持距离的好办法，原因可能很多。其中之一可能是害怕受惩罚，就像小孩子说：“我们打球的时候，理查森家的窗户破了。”翻译过来就是：“有人把球打穿了窗户，但我不告诉你那是谁干的。”这也可能是为了减轻主动复述某个事件带来的痛苦：“我哥哥被杀了。”用被动语态呈现这个信息，会缓和语气，避免直白地描述一场残忍的谋杀。\n\
  \n- ***节奏变化。*** 当人们兴奋时，语速往往会加快一点。节奏的变化也可能暗示许多其他状况。也许是这个人对话题不太确定，忘了自己要说什么，找不到合适的词，或者非常希望这个话题赶紧过去。\n\
  \n当你把自己的听觉感知、对身体语言的了解，以及通过对审讯人员所称*罪知情*的依赖而推断出的关于此人的事实结合起来，解读这些线索就会容易得多。\n\n## 罪恶感\n\
  \n除了那些能洞察一个人对某话题或情境心态的线索之外，你还需要运用一些技巧去识别“罪知情”。这个短语在刑事调查的语境中说得通——嫌疑人可能会以只有凶手才知道的方式来描述犯罪现场的某些细节。对我们的目的而言，一个更通用的说法可能是*私密知识*。\n\
  \n在亚特兰大的一家酒吧里，格雷格曾无意中听到一个女人对一位跟她调情的男人说“再说一遍”。这是军人说“重复”的方式。在那之后，格雷格就很自然地走过去对她说：“您在军队里待了多久？”一旦某个模式成为你的亚文化中的一部分，而你发现自己正在和这个亚文化圈外的人交谈时，你就会暴露自己是这个圈子一员的事实，这就叫“罪知情”。\n\
  \n在拍摄英国第4频道的《关塔那摩指南》时，在模拟过程中，格雷格命令一名“守卫”把囚犯从他们的隔间里带出来。其中的“罪知情”对于一小部分人来说是显而易见的。审讯人员可能会注意到，他没有说*笼子*，而那是囚室的标准用语。懂马的人则会注意到，他用了他们熟悉的说法。任何有马术圈经验的审讯人员都会立刻知道哈特利是个养马人。\n\
  \n大多数人都不知道自己在这类对话中泄了底。在威斯康星州见一位商业联系人时，格雷格听到了一口悦耳的北卡罗来纳口音。他说这不仅是得到一个惊喜，而且他还能准确说出她口音来自哪个具体位置。这引出了一段非常友好的谈话，谈到格雷格曾在北卡罗来纳驻防。仅仅两句话之后，两人就发现格雷格的工作地点距离她祖父的农场只有200码。想象一下这是何等迅速地拉近了彼此的关系。当他开口说话时，她的耳朵已经完全打开了。\n\
  \n如果有人听到格雷格在一场与马无关的对话中说出了*隔间*这个词，也可以用同样的方式来对待他。甚至不用提及格雷格说了这个词——事实上，不提反而更微妙——那人可以在稍后喝咖啡时提起，说他刚上了人生第一节骑马课。这很快就会引起格雷格的注意，并给他带来他想要的积极回应。\n\
  \n无论是口音、说话方式，还是某个地域用语，比如用*汽水、软饮、苏打水*甚至*可乐*来泛指甜味的碳酸饮料，人们到处都会留下关于他们来自何处的线索。同样，人们使用的陈词滥调也会给你提供“罪知情”。例如，海军陆战队员有时把飞行员称为*巴士司机*。隐喻也常常带给你洞察。南方人可能会说“我感觉像猪戴了块手表”来表示他不明白某事。你大概不会听到纽约人说出这种话。\n\
  \n现在你已经对用耳朵进行积极倾听有了一些了解，让我们来用身体进行倾听吧。一旦你在听觉层面弄清了人们说了什么或没说什么，再通过观察，你就能对他们得出一些确定的结论。\n\
  \n举止、姿态、精力、专注度、人们坐或站的方式，以及大量其他的身体语言线索……\n\n\n也会发挥作用。记住四大类动作以及它们如何传达情绪：说明性动作、调节性动作、适应性动作和屏障性动作。例如，说明性动作可以强调思路，但要是泄露了有罪信息呢？格雷格曾任职的一家公司的高级主管，在见到他几分钟内就问：“你受过多少武术训练？”他扬起眉毛，提到自己的黑带，并好奇格雷格怎么会知道。他的体形显示出他经常锻炼，但决定性的证据是，他与格雷格正面相对，而不是侧身站立——除非是在对抗中，否则大多数男人都会采取侧身站立的姿势。\n\
  \n正如言语模式中的异常一样，肢体语言或站姿上的异常也会暴露出有罪信息和过往经历。保持警觉，这样你才能看到某人与你以及群体中其他人不同的迹象。当你看到这种差异时，深入探究，并记住这些是双刃工具。正如他人会泄露信息，你也会。注意观察，并留心你自己的有罪信息。\n"
- "# 第5章：人类建模\n\n你即将研究自然栖息地中的动物。把自己想象成灵长类动物学家珍·古道尔那样的敏锐观察者，只不过你还能说黑猩猩语。\n\n你在本章学到的人类建模过程，将帮助你理解陌生人和亲近的人，让你获得影响他们行为所需的信息。它将帮助你建立对一个人的整体认知，凸显其需求与动机。\n\
  \n无论怎样强调这种建模能力的重要性都不为过。通过精确识别一个人的关键特质，并判断它们是优点还是缺点、普通还是非凡的能力，你就能清晰地了解将要操纵的对象。跳过这一步意味着你可能运气好，在试图操纵他的过程中碰巧触及他的敏感点或发现相关线索，但结果将难以预料。你只是在黑暗中乱开枪。\n\
  \n每次审讯都始于尽可能多地了解囚犯个人，包括从抓捕他的人、给他送饭的人以及管理他日常生活的人那里收集到的信息。然后我们进入审讯，通过提问为他的画像添加更多细节。这幅画像展现了他性格中的高峰和低谷，让我们知道他与我们的共同点，以及他的优势和恐惧。\n\
  \n缺乏这些知识，我们试图管理他的归属感或差异化需求可能会带来灾难性后果。\n\n格雷格离开军队多年，一直在跨国公司工作。这与军队有着强烈的相似之处。人们每天开会，讨论天底下所有事情，却对谈话对象毫不在意。他们推进议程，却不考虑维系商业运转的人性纽带。\n\
  \n格雷格花大量时间教导、辅导和指导人们在会议的共同时空里关注他人。他推动使用军事审讯领域中的同样工具，以取得更好的会议效果和打造更强的团队。\n\n这之所以奏效，原因很简单：通过理解人们说了什么和没说什么，你能更准确地定位他们的动机。一旦掌握这些信息，你就能建立更牢固的纽带——或者削弱它们。听起来熟悉吗？\n\
  \n本章的工具旨在为你提供另一种观察人的视角——既理解一个人如何看待自己，也理解他人如何看待他。这是一项值得的投资。除非你能读懂他人的心思，否则你不能省略这一步。\n\
  \n你将使用第4章学到的工具来收集与绘制目标人物详细画像相关的信息。如果你熟练运用这些工具，那么你就拥有了一支足够锋利的铅笔来描绘细节。当你与目标人物互动，让她做你希望她做的事情时，这些工具也会再次派上用场。\n\
  \n绘制画像的第一步，是承认你并非无所不知地了解你的目标。无论这个人是你的母亲、一起工作了十五年的同事，还是你最好的朋友，都没有区别。你并不掌握关于这个人的某些事实，而这些事实对于影响她的行为可能极为重要。\n\
  \n### 练习：近与远\n\n列出三个你几乎不认识的人，以及三个你自认为非常了解的人。对每个人，列出你认为的主要特质，例如聪明、虔诚、有艺术气质、热情好客、性感、爱评判等等。再对每个人，列出你认为的主要需求，例如尊重、接纳、奉承、宽恕等等。\n\
  \n读完本章关于人类建模的内容后，回到这个列表。想想有哪些场合可以让你运用新工具来验证、修正或推翻你最初的假设。\n\n### 个人操作系统\n\n根据维基百科，操作系统管理资源并为计算机程序提供“公共服务”。想象一下，一个人的思维和行为由一个操作系统驱动。该操作系统运行在由基因定义的硬件上。只有某些程序能够运行，而且有些程序的运行方式会与在别人的硬件或操作系统上运行时不同。\n\
  \n要检查这个操作系统，你需要一台fMRI（功能性磁共振成像）系统。fMRI会向你展示，当一个人参与某种……时，她大脑相应区域的活动。\n\n审讯者总是以建立控制和融洽关系来开始接触。能否迅速做到这一点，取决于审讯者能否对情报源的“操作系统”进行编码归类。这种能力的实现，依赖于军事体系中固有的机制：部署警卫、摄像头和麦克风，确保营地里没有任何私人时刻。你对目标信息的需求并无不同，尽管你获取信息的手段不同。你需要掌握目标人物的特质、习惯和心态。你需要感知对他来说恒定不变的事物连续体，以及那些持续变化的要素。\n\
  \n每个人都有一种主导人格类型，即使不是贯穿整个成熟人生，也会在很长一段时间内保持稳定。我们给你的只是一些对比类型的示例。你应该以此为跳板，创建你自己的列表，这些列表很可能会反映出你自己的文化、族裔、国籍等等。目前，先从理解这些性格类型开始，以及它们如何助力你构建对人的建模。当我们在后续章节讨论技能应用时，会回到这些类型，让你看到如何调整战略战术以获得想要的结果。那将为你提供所需的示例和框架，以便你定制策略去影响不属于这里所涵盖类别的人。\n\
  \n这些配对可以用辐射状图来可视化。正如你可能在政治体系中观察到的那样，当你走向一个极端时，就会接近另一个极端。理解这一点最重要的原因是，你可以获得与自我形象相关的洞察，从而掌控和预测结果。如果你的行为挑战了目标人物的自我形象，你按照自己想要的方式推动他的能力……\n\
  \n他只能远远窥视的人——重要吗？你需要理解他如何处理输入并排列信息优先级，才能知道如何最好地与他互动。\n\n同样，如果质朴的人对别人的看法毫不在意，你该如何吸引她？你能因为她不懂就居高临下地对她说话，并期待有任何改变吗？你需要基于对这种人格类型多么根深蒂固、浑然一体的理解来采取行动，以确定这个人是在走向尊重需求，还是试图获得归属感。这将影响你如何帮助她差异化或归属的决策。例如，矫饰的人可能正在转变，变得与质朴非常接近，以至于只需简单的几句自我表露就会让她显得古怪。知道这一点，你可以通过提问和评论轻松地将她推向那里，或者至少向她展示你有能力做到，然后再救她，以换取一个恩惠。\n\
  \n### 顺从与反体制\n\n顺从的人因成为某事物的一部分而感到舒适。他们努力完全融入群体。他们可能会表达观点，但范围将由群体可接受的正常范围来界定。这类似于国家政党政治：你可以持有截然不同的观点，只要党内其余人接受它们。这些人遵守规则，因为规则很重要；规则让世界保持秩序。由此带来的隔绝感让他们感到安定。\n\
  \n对他们来说，通过这种行为感受到自己是某事物的一部分，会涌起巨大的安全感，他们通过避免任何偏离来强化这种感觉并完善自我形象。按这个逻辑推导下去：顺从者与某个具体问题贴得太近，以至于他看不到全局，并且……\n\
  \n开始分化到分歧点。那时，他变成了反体制者。一些持枪权利活动家就属于这一类型。虽然携带武器的权利对任何士兵来说都是神圣的，但在某些人的心理中，这种权利可能根深蒂固，以至于他们成为最严厉的反体制类型。\n\
  \n反体制者回避规则，认为结构是为没有想象力的人准备的，或者相信存在比现状更好的方式。他们相信，如果由合适的人来制定规则，规则会更好，因此实际上，他们只是在倡导另一套规则。如果他们得偿所愿，规则突然变得完全不同——恰好如他们所愿，那会怎样？当反体制者如此执着于规则，以至于发起群众运动时，他们就越界了。他们转而成为体制本身。一旦他们掌权，就会为了坚守自己神圣的理念而变得更加保守和顺从。\n\
  \n当一个理想主义者成为执行者时，他根本无法想象自己的想法是错误的；问题一定出在那些执行它的人身上。看看20世纪的伟大改革运动，就能找到理想主义者转变为顺从者的政府模式。在大多数情况下，反体制的定义源于一种戏剧性的企图，即为了自身利益而夺取权力并建立新秩序。这些人会成为那些阴险而光明正大的领导者的绝佳追随者。\n\
  \n在实际应用中，你需要了解你的目标是出于自身利益而顺从，还是当她在决策中没有发言权时会反击。这种理解让你有机会把握她的驱动力。如果她是一个顺从者，而你想让她做某事，最简单的方法是建立一个联盟，带着她与整个房间的人一起行动。建立联盟比直接冲突容易得多。通过改变群体规范，你能轻松地带动一个顺从者。毕竟，她要么改变，要么变成反体制者。当分化发生时，她的驱动力是成为群体中更坚定的参与者；当她分化到不再属于这个群体时，她将需要一个新地方来“归属”。归属感是强大的。\n\
  \n如果他是一个反体制者，让他了解“愿景”以及你的计划。如果你能让他成为真正的信徒，他就能成为事业的战士。仅仅理解反体制者的心理，你就能同样针对他。大多数反体制者相信存在更好的方式。一旦这些人真正投入到群体的结果中并面临失去的风险，他们很少会继续搅局。套用社会作家埃里克·霍弗的话说，拥有开心乐园餐和有线电视的人不会造反。让反体制者完全归属于群体，并允许他“从内部改变事物”，你就能收编他的热情，为体制创造一名战士。你只需要记得照料他的火焰，否则他会停滞不前，变成对手。\n\
  \n## 万事通与求师者\n\n万事通会把零散的信息——无论是否相关——应用到当前情境中。在许多情况下，他这样做依赖于一个事实：过去他比其他人“更正确”（就像我们那位五英尺三英寸的朋友，过去他个子更高）。尽管他可能确实在某些事情上比其他人懂得更多，但他的需求是比所有人在所有事情上都懂得更多。毫不奇怪，当他遇到一个实际上可能比他懂得更多的人时，他会变得紧张不安。无论是因为他上过更好的学校（或者只是住在普林斯顿或哈佛附近），有更多经验，还是只是比你“更懂行”，你在日常工作中经常会遇到这种人。他是一个原型；他是*《欢乐酒店》*里的邮递员克利夫。这类人的归属感和自尊来自他人因其信息宝库而给予的尊重。这塑造了他的自我认同。在某些情况下，他并非患有知识自恋，而是缺乏安全感，并且很清楚自己满口胡言，但私下希望别人没有注意到。通过使用第4章描述的工具，你可以探知他的真实状态，并相应制定计划，让他在层级中上升或下降。\n\
  \n求师者希望从公认的来源获得启迪，以便将这种认可视为自己的成就。无论多少知识、基于表现的成绩或成功，都无法给这个人带来像引用大君的话那样多的喜悦和认可。他需要知道，自己所说的话来自一位觉醒者。这类人的危险在于，大师可能来自各行各业，而他的大师的可信度取决于他的选择标准。这位大师可能只是一个万事通，因他人的尊崇而被抬高，并利用滚雪球效应，将自己提升到大师地位。另一个极端是，如果求师者满足了自身需求，并从他接近的智者那里持续获得认可，他可能会发展到看不起那些没有接触过大师的人的地步。\n\
  \n一个实际的例子是玛丽安的一位熟人，他曾在一个推广巴克敏斯特·“巴奇”·富勒可持续与可再生能源技术的工作团体任职。富勒以设计网格球顶而闻名，但在这位熟人参与这项工作时已经去世，所以他甚至从未见过自己的大师。尽管如此，巴奇的福音支配了他的生活，也几乎支配了他所说的每一句话。他对批评他的人最常见的回应是：“巴奇是个天才。你不会懂的。”\n\
  \n当求师者达到这种程度时，他开始比任何人都更理解大师眼中的世界。实际上，他变成了一种半大师，因为他觉得自己有资格去启迪低等众生。实际上，他可以充当大师的守门人，确保道路虽宽，门却窄得几乎无人能通过。\n\
  \n如果你告诉一个对自己的想法有着盲目自信的人他搞错了某件事，那么三件事之一会发生。第一，他会采取防御姿态，在错误周围打转，很可能试图让你以为是你误解了。第二，他会跌穿自己所处的马斯洛需求层次的地板——也许是声誉——现在只寻求归属感。第三，他会变得咄咄逼人，攻击你，但很可能不针对你质疑的那一点。你告诉他关于大象的说法是错的，并解释原因，他却猛烈反击说你是高中辍学生。那位崇拜巴奇的熟人就是这样做的；结果，他不得不迅速从一个“低等众生”的圈子转向另一个。\n\
  \n理解这些类型在层级中的位置将帮助你确定最佳行动方案。基于若干因素，她的个性将决定这些信息是否有价值、是否可行。这些因素包括：来源的权威性、与来源之间的顺从关系（双向），以及传递方式。当一个万事通被允许将新知识纳入她自己的话语体系时，通常更容易让她做出让步，因此提出引导性问题，让她自己说出你所知内容的重要性，这符合她的理解方式，而不会遇到抵触。\n\
  \n对于求师者，将自己确立为她应当遵从的对象，或者引用诺查丹玛斯式的预言，会比脱口而出事实更有效。想想那些传道者，他们不提供任何事实或个人见解，却通过引用经文赢得人心。通过表明你的知识只是从智者那里借来的，你会比试图宣称自己就是大师获得更多认可。求师者只追随那些有追随者的人——直到他们明白自己不过是个信使。\n\
  \n## 传统与潮流\n\n在极端情况下，传统和潮流都是矫饰的近亲。这更多地与人如何脚踏实地有关，而不是他们的品味。他们需要过去英雄的认可来验证自己的选择，还是今天在世超典型人物的意见足以凌驾于几代人的判断之上？有些人可能陷入潮流之中，却仍将自己标榜为传统。社会压力是强大的。\n\
  \n雪莉吹捧古典音乐永恒的至高无上。她说，因为古典音乐比同时代的音乐多存活了几百年，所以显然比现代音乐更有价值。对此的反驳是，Spotify上的任何东西理论上都能存在同样久。\n\
  \n传统主义者信任已知的事物，相信事物之所以如此演变自有其道理。无论他们是否意识到，他们秉持着一种信念：历史上涉及群体思维的偶然事件比今天的群体思维更为深刻。这个群体的外在表现是倾向于传统的着装方式和权威标志，倾向于旧式的商业、礼仪和饮食方式。当其他人采用商务休闲风时，他们坚持高端路线，穿着浆过的衬衫和西裤，而不是卡其裤和高尔夫衫。\n\
  \n\n\n潮流光谱的极端一端认为当前的舆论比奶奶的更有分量。这个群体成员的论点是，这一世代比所有过去的世代知道得更多——也许是因为我们积累的知识——因此，更有能力做出决定。表面上看，他们的关注点停留在当下最热门的东西以及采纳最新的潮流。在极端情况下，他们会思考自己今天所做的事情的长期结果，因为其他人都在做同样的事情。一个潮流的活动家可能会（讽刺地）抗议拆除一座历史建筑，因为每个其他潮流人士都将其作为优先活动。这种行为会促使传统主义者问道：“如果其他人全都从桥上跳下去，你也会吗？”\n\
  \n因此，传统和潮流不仅仅是关于时尚感或偏好的陈述。诸如衣服和装饰之类的外在事物说明了某人如何看待自己在特定环境中的角色。传统的人公开宣称过去是有价值的，并且她证明自己价值的一部分方式就是延续传统。她是历史的守护者，是经典外观、声音和气味的推广者。一个极端的传统主义者可能无法超越纹身和舌钉等差异化因素来与某人建立联系。\n\
  \n当被推向极端时，一个人开始看起来像另一个人。将传统推向极端可能会变成一种潮流，并否定运动的原始目的。很少有人了解传统从何而来以及它们变得多么复杂。拿一个传统并无休止地遵循它可能会导致潮流行为，因为所谓的传统不过是创造潮流的薄薄伪装。看看政治上极左和极右的评论员就能看到这种混淆的实际结果：他们都把民主的神圣传统作为行动的可靠模式，同时赞颂“变革”是我们问题的唯一答案。\n\
  \n潮流也可能变得如此普遍，以至于它们成为传统；而在几代之后，没有人会察觉。纹身作为个性的指标早已超过了与传统的断裂点，现在可能被视为归属的标志，而不是与社会区分的标志。所以我们必须问：在两代之后，腰部以下的纹身是否会被视为年长、守旧女性的标准？\n\
  \n农业部长 Sonny Purdue 在 2018 年选举期间从他的南方词汇中拿出一个传统短语，当他在为共和党候选人助选时，他告诉佛罗里达人民，他们的州长竞选是“cotton-pickin'\
  \ important”。这个短语让人想起对非裔美国人进行歧视和嘲弄的传统，而竞选公职的民主党候选人是黑人——这不是任何人应该推到聚光灯下的传统。\n\n在处理这两种类型时，请记住每个人如何看待她与组织的关系，因为她被迫害为先锋派或因为她是老派而受到尊重，或反之亦然。任何极端都给你一个独特的机会来操纵归属感和差异化的感受，但你必须首先了解那个勉强归属的十八岁员工在何处才适合，然后再尝试进行区分，否则你会将她孤立。\n\
  \n## 正当化与开放式\n\n正当化思维者和开放式思维者与传统主义者和潮流者有关，你可能已经可以看到这些其他示例类别如何显示出类似的关系。\n\n正当化者占据了教会和政党的极端派别，但他们也会出现在公司中，并坚持认为精益六西格玛是所有企业困境的答案。他们是生活在政治自由主义飞地里的人，他们说：“就因为你是共和党人，你就不懂这个，”或是某个宗教的人，他们对无神论者感到如此多怜悯，以至于用圣经经文纠缠他。正当化者觉得他们有充分的理由和权利宣扬他们版本的正确性——而且他们常常让讲逻辑的人有点抓狂，非常愤怒。你可能会想到你认识的那些正当化者，并对自己平衡的观点感到优越。但想想有什么事情每次你想到它时都会激起你的热情，你认为它极大地贡献于你生活的质量。也许是书籍。你会像正当化者一样行事，如果出版业突然决定所有书籍都只能以数字格式出版吗？\n\
  \n极端的开放式思维者有“什么都行”的心态——生活中没有基本规则。每个人都应该被允许在……什么都没有的界限内做他们想做的事。这个群体符合 Ayn Rand 的客观主义模式。这些人认为基督教基要主义运动，对同性恋和婚外生育有明确的观点，是偏斜和错误的。\n\
  \n他们还指出整个系统的不宽容，以及事物必须改变，人们必须被允许按自己的意愿生活。在健康的剂量下，这意味着没有宗教或政府干预的自由。不幸的是，极端情况期望政府创造一个限制教会的程序，从而干涉宗教极端分子的信仰。当这种情况发生时，政府告诉宗教他们的教条限制是什么。走向开放式极端的结果是，开放式思维者变得在做事方式上像一个正当化者。\n\
  \n在我们涵盖的所有群体中，这两个是最密切相关的。它们的核心是基本的信仰，即自由地相信他们想相信的任何东西。具有讽刺意味的是，从开放式到正当化再返回只需要很少的步骤。未做好准备地接近这两种类型是有风险的。用问题来探索这个人如何看待自己。避开这个人有热点的问题区域，除非是为了证明他不理性并使他与群体分裂。\n\
  \n你对操作系统进行定位的能力给了你获得第一块关键信息所需的钥匙，以便让特定类型的人做你想让他做的事情。\n\n如果你熟悉其他描述人格的系统，你可能会倾向于质疑这些类别——它们是样本，而非全面列表——与\
  \ Myers-Briggs Type Indicator 或 Enneagram 系统的关系。这两种标准都是通过应用某些评估标准来深入了解人类人格的有价值方式。它们会告诉你你如何与世界以及某些情况相关。\n\
  \n我们提出这种“系统”来对比带有常识标签的类型，其目的有二：1) 指出各种极端最终会汇合，因此可以被非常相似地影响；2) 将讨论集中在自我形象上，以及塑造它并维持它的因素。\n\
  \n在他的书 *The Power of Risk* 中，Jim McCormick 发现了来自调查的证据支持这种极端在一点相遇的概念，但他将其置于优势和劣势的背景下。他的\
  \ *strength/weakness paradox* 指出：“我们的最大优势和劣势是同一个。你的所有优势都有可能变成劣势。”¹³ 简而言之，任何积极特质，如果应用到极端，就可能变成消极。拿任何你立即认为积极的先前类别并将其推向极端，你就会得到消极。持续寻找导师会让好奇的人变成自以为是的人。地球母亲的狂热会让她变成极其自命不凡的人。\n\
  \n清楚地看到每一个事物本来的面目，让你能够预测这个人将如何收集、处理和优先考虑信息。虽然大多数人生活在连续体的中心附近，但那些接近边缘的人给你一个机会推动他们朝向他们认为与自己完全对立的人的方向——而这种推动随后进行的检索可能正是你需要得到你想要的东西。\n\
  \n## 什么让 Johnny 跑起来？\n\n这个人决定加载到他的“系统”上的东西是什么？程序加载后，这个人在哪里表现出色？他中等地做些什么，或在哪些方面低于常态？这些事情中哪些让他感到自豪，哪些让他感到羞耻？\n\
  \n了解角色的所有方面以及影响自我形象的所有因素，可以告诉你这个人为什么会这样行为，以及他在哪里有优势和劣势。一旦你将每个特质的信息绘制在你的心理钟形曲线上，你就把它们组合起来，构成一个三维图像，显示这个人在哪里平均或典型，在哪里低于常态，在哪里高于人群。这幅视觉表现让你能够相对于他认同的人群中的其他人来定义这个整体的人。\n\
  \n让我们从远处看一个众所周知的名人，并谈谈我们在不接近他的情况下可以看到什么。\n\n\n\n\n\n## 你对瑞恩·雷诺兹了解多少？\n\n你可能认为自己是他电影《死侍》、《绿灯侠》和《求爱假期》的大粉丝，甚至还知道一些非电影方面的趣事，比如他拥有\
  \ Aviation Gin，但你能描绘出他的完整形象吗？以下是一些你可能不知道的事实，它们为你对瑞恩的骨架式认知增添了血肉：\n\n- **出生国家：** 加拿大\n\
  - **家庭宗教：** 天主教\n- **教育：** 中途辍学于一所理工科大学\n- **早期职业：** 主演过一部青少年肥皂剧\n- **第一任妻子：** 斯嘉丽·约翰逊\n\
  - **女儿的名字：** 詹姆斯和伊内兹\n- **金钱困境：** 在电视工作后，为维持生计曾在超市上夜班\n- **关注事业：** 环境和癌症治愈\n\n当你看整体画面时——而关于瑞恩·雷诺兹还有很多需要了解——你会发现他在很多方面都很典型（结婚并离婚，有两个孩子，曾在大学待过一段时间）。作为一位获奖的喜剧和戏剧演员，他或许可以被称为超典型。然而，挣扎着维持生计这一点，在许多人眼中会使他变得亚典型。已经取得一定职业成功的人，本不应该为了维持生计而去超市做夜班工作。\n\
  \n简而言之，你如何将瑞恩·雷诺兹与四十岁左右的西方男性进行分类，很大程度上取决于你将聚光灯照向画面的哪一部分。\n\n仅以两个特征来看，瑞恩·雷诺兹在钟形曲线上的位置是：\n\
  \n这个例子，只要看看孩子们在高中如何自行分组。\n\n我们在猿类王国中的灵长类近亲就是这样行为的。超典型者通过建立等级制度，其中阿尔法男性为王，从而组成统治阶级。其他人则为位置而竞争。群体包括超典型的阿尔法男性、阿尔法女性、大众和亚典型，但最后一组几乎不属于群体的一部分。人类在不同规模上复制了这一模式。\n\
  \n作为一条规则，人类会模仿他们群体中的超典型。看看你工作场所的人。如果你的老板——能够提拔你、认可你的行动计划并授权圣诞奖金的人——每天都穿着西装去办公室，你很可能会模仿这种风格，希望能提高她对你的认可度。由超典型名人\
  \ X 引发的最新潮流，无论是时尚潮流还是与行为或言语相关的潮流，是否会在人群中引发模仿？你可能认为自己免疫，但试着躲避关于名人的某些无处不在的事实，这些事实会渗入最严肃的对话中，例如：汤姆·克鲁斯是科学教的活跃成员；布兰妮·斯皮尔斯被送往精神病院；希斯·莱杰在二十八岁时突然去世。名人追星蓬勃发展，有一个价值十亿美元的产业为流行文化天才的智力好奇心服务。\n\
  \n## 新的钟形曲线：你有多独特？\n\n几个世纪以来，专家们开发了各种各样的测试，为人类提供简洁的相互描述方式。迈尔斯-布里格斯和大五人格系统提供了描述人格的方式；情绪智商（EQ）测试让你了解你感知和处理情绪的能力与人口其余部分相比如何；智商（IQ）测试据说告诉你你的智力如何。所有这些测试都有严重的局限性。例如，智力测试评估的只是非常狭窄的能力范围，这就是为什么它们几乎无法评估一个人的真实智力。这就像根据一系列平坦的钟形曲线来评估一个人，以确定什么是正常的。评估与什么是正常的毫无关系，只与特定群体的规范有关。\n\
  \n一个人可以在工作中获得很高的声望和很棒的名声。另一个人可以在与工作无关的活动中达到同样的声望水平。前者是拥有能激励她的职业，或至少是一份工作的人。她每天都迫不及待地想展示自己的能力，因为她热爱这份工作。她可能每晚回家后都面对电视和花生酱果酱三明治，或者她可能回家到一个充满活力、充满爱的家庭。后者是今天做\
  \ A 工作、明天做 B 工作谋生，然后在晚上和周末专注于完全不同的活动的人。这就是演员兼职做服务员，或竞技跳伞运动员兼职做咖啡师的人。你怎么知道这个人的生活另一半是什么样的，除非你在两种环境下都认识她？\n\
  \n如果你只从单一维度看这两个人，你可能会看到一个不满足的人。而你可能大错特错。\n\n对于你想要影响的每一个人，你需要的不仅仅是来自平坦钟形曲线的资讯。你想要提出揭示深度的提问，以便钟形曲线的各个侧面都能成形。你的工作是找到他们超典型的地方并抚摸他们的自尊。如果你使用负面方法，你的工作就是找到他们的弱点并提供帮助，让他们从亚典型中提升。了解他们独特的性格特征和能力的组合，是你需要的信息，才能让他们做你想让他们做的事。\n\
  \n这就是审讯者所做的：在他们感到强大和感到脆弱的地方工作人。\n\n莉比是一位长期失业的演员。演戏是她的热情和她的“夜班工作”；她通常从事智力要求不高且时间固定的行政工作。如果你是莉比的老板，想要她在办公室完成一项任务，如果你专注于她在工作环境中的角色，你将一事无成。她不会动一根手指。相反，她会辞职并转到下一份行政工作，而你永远得不到你想要的。在将激励或鼓励与她的日常工作联系起来时，你的最佳策略是发现她的优先事项：登上舞台。在了解她的热情后，你可以用她会倾听的方式与她交谈。你可以阐述为什么专注于她日常工作中的某些部分可以帮助她成为更好的演员；然后你就抓住了她的注意力并获得了与她的杠杆。\n\
  \n从核心来看，这种方法是对整个人尊重，而钟形曲线的形象则作为视觉提醒。\n\n大多数人是平衡的。如果他们在某些方面很强，那么在其他方面就很弱，因为人类只有这么多带宽。关键是弄清楚哪些事情让他们感到痛苦，哪些事情为他们的生活增添价值。为了扮演伊丽莎白一世，我们大多数人记得她因辉煌的成功而闻名，凯特·布兰切特试图捕捉女王人格中的空洞。她在一篇在\
  \ www.50connect.co.uk 上的采访中解释了她的过程：“我在这部电影中试图做的，是创造一种空洞女人的感觉——没有伴侣、丈夫、孩子——寻找填补那种空虚的东西。”\n\
  \n## 绘制动画场景\n\n- 1. 打开动画场景\n  - 在Animate中创建或打开一个动画场景。动画场景是包含3D模型的场景。\n- 2. 绘制动画草图\n\
  \  - 使用笔工具在场景中绘制草图。草图将作为动画的参考。\n- 3. 添加动画关键帧\n  - 在时间轴中添加动画的关键帧。关键帧是动画中重要的位置。\n\
  - 4. 创建动画补间\n  - 在两个关键帧之间的中间帧，或者自动创建\n- 5. 绘制动画\n  - 设置动画参数并绘制动画。\n- 6. 预览动画\n \
  \ - 使用播放按钮预览动画。\n- 7. 保存文件\n  - 使用快捷键Ctrl+S保存文件。\n- 8. 导出动画\n  - 使用导出命令将动画导出为视频或GIF格式。可导出为GIF动图\n\
  \n除非你有一个更强大的模型来评估某个人，否则你将无法确定一个人是否已经达到其环境的巅峰，还是需要被引诱超出其环境——这两者都是获得你想要的东西的基础——。你必须整体地看待这个人，以便可靠地知道他在哪里强大、弱小和平均。简而言之，他有多平衡？\n\
  \n通过将多个平坦图表协调成一个 3-D 表示，你会得到一个看起来像自由钟的图像。你甚至可以想象钟上的裂缝，在那里你表面上超人类的目标在某些领域表现不佳。\n\n\
  审讯者会在一个人强壮的地方抚摸他的自尊，并在他弱小的地方推到疼痛的程度。你基本上也会做同样的事情，但首先以在商业环境和其他日常生活的各个方面更有相关性的方式将其可视化；这就是为什么\
  \ 3-D 钟是有用的。\n\n- *Step 1:* 你需要查看构成你研究对象钟形曲线的无数线条，并看看他处于何处。\n- *Step 2:* 你将使用第 2\
  \ 章中描述的工具，沿着这条线移动他——到更超典型的位置，到更亚典型的姿势（如果你选择负面方法），或完全不同的钟形曲线。后者是你想要产生的结果，当这个人已经达到钟形曲线的绝对巅峰时。\n\
  - *Step 3:* 你现在已经让他处于“成交”的位置，我们将在下一节中描述这个过程。\n\n为了向你展示步骤 1 和 2 *可能*如何运作，让我们回到瑞恩·雷诺兹的个人资料。首先，这里是如何选择\n\
  \n\n\ntraits 看起来像钟形曲线，可以叠加成 3-D 图像：\n\n![](img/ccd9d9c31a1b4bf629dd84c4b7e079d5_155_0.png)\n\
  \n如果你想在这个获奖的表演者和成就卓著的商人身上获得杠杆——他几乎处于电影演员和商人类别的巅峰——你可能会关注他的事业。你能做什么来提升他作为环保主义者或癌症根除倡导者的知名度？如果你采用积极的方式让某人做你想让他做的事，你将他推向名人中这些事业的“超典型”领域的行为，可能会给你带来一些独特的影響力。我们说“可能”是因为我们仅将其作为这个过程如何运作的例子，而不是它对瑞恩·雷诺兹具体如何运作。\n\
  \n你可以在办公室环境中对 CEO 这样做，通过针对她的事业，然后邀请她在该慈善机构的筹款活动上发表主题演讲。玛丽安的朋友采取了另一种方法：她关注老板对身体健康的热爱，邀请他作为她的客人去一家拥有顶级教练的健身房。此后她收到了他很多午餐邀请，以及圣诞奖金。这就是差异化的积极面。消极面就是在健身房里跑得比他快、举得比他多。\n\
  \n以创建 3-D 钟形曲线所需的审视程度来剖析一个人的练习，也可能对你产生一些令人惊讶的结果。你可能会意识到或发现关于一个人的某些事情，让你对与他合作有不同的看法。你可能会决定，旨在建立联系的尊重方式比把他推开更自然，反之亦然。\n\
  \n某人在 3-D 钟形曲线中看起来很平衡的原因是，他们通过在某些领域排名超典型，而在其他领域处于次典型来补偿。瑞恩·雷诺兹的例子暗示了这一点。看看你所熟知的人——无论是通过名声还是个人——在成就和未竟事业之间的这种混合。托马斯·杰斐逊，例如，不仅担任美国第三任总统，而且还在园艺、建筑、考古学、古生物学、文学和教育等领域脱颖而出。他在个人生活中的超典型程度要低得多：在结婚十年后，他的妻子去世，他再也没有再婚；与她的六个孩子中，有四个在出生时或婴儿时期去世。简而言之，他可以将大部分黄金岁月奉献给一切，除了家庭和家。如果你在大型办公室工作，你可能至少遇到过一个自愿加班并在生产上表现出色的人，但回家时没有人等他（或不想回家等在那里的人）。\n\
  \n你对这样的人超典型领域的了解更多，因为人们通常会以他们希望别人看到的优势为先导。所以当你看到某人投射出近乎超人的成就量时，就要寻找他表现不佳的领域。很多时候，最平衡的人在任何特定领域都不会是过度成就者，因为他们一生都在做各种事情的少量。\n\
  \n当你在大脑中绘制一个人的 3-D 钟形曲线，而超典型领域的跨度似乎巨大时，你需要继续探究以完成全貌。他们在次典型领域的范围可能同样广泛。他们在其他事情上表现出色，并在别处为此付出代价。\n\
  \n## 创建钟形曲线\n\n我们告诉过你，审讯人员会用警卫、摄像头和麦克风收集信息，但由于你没有这些，你需要魔法。这种魔法就是熟练使用第 4 章中介绍的工具。在本节中，你将练习它们来建立融洽关系、建立基线并收集信息，以便为你的目标创建\
  \ 3-D 钟形曲线。\n\n不显眼地应用这些技巧。如果你探究和强求信息，你会遇到从怀疑的眼神到严厉的咒骂的抵制。这意味着你应该从广泛的对话开始，让你的信息源引导你提问。不要一开始就破坏你的计划，去问你的老板，“那么，是什么驱动你？”或“什么最让你尴尬，先生？”\n\
  \n你的目标的回应将由他的操作系统驱动。如果你问一个自命不凡的人他最自豪的是什么，你可以保证他会给出一个答案——一个完整的答案。他也可能会借此机会回答同一个问题，给你讲一个与鳄鱼一起游泳并在刚果弄丢钥匙的轶事。在光谱的另一端，你可能会发现一个心态良好、接地气的人给你一个讽刺的回答，并问你为什么在意。\n\
  \n保持你的收集工作为典型的对话，但有两个不同之处。你有一个使命，而且是你主导对话。你将遵循以下步骤：\n\n- 1. 建立融洽关系。\n- 2. 建立基线。\n\
  - 3. 了解阈值。\n- 4. 收集信息。\n- 5. 强化融洽关系。\n\n## 建立融洽关系\n\n这座名为 *融洽关系* 的桥梁只能连接有共同点的人。这可能是像年龄或对工作场所的共同痛苦这样简单的事情。或者它可能是独特的东西，比如对意大利跑车的热爱。所有这些都只是为了满足你开始对话而不显得刻意的愿望。\n\
  \n## 建立基线\n\n聆听他在无压力状态下的用词选择、节奏、音调和语气。观察他在随意交谈中的肢体语言和眼动模式。注意任何你认为对他来说正常的“故障”。它可能是微妙的，比如某种使用停顿的方式，也可能是你觉得相当奇怪的东西，比如注视你的侧面而不是进行眼神接触。\n\
  \n当你知道什么是正常的，你就能看到异常。随着对话的开始，你会在肢体语言中检测到线索，并在他对某些词的压力中听到提示，了解什么很重要。利用基于他基线的积极倾听技巧，你可以知道什么是信息源线索；你跟随它并让对话自然流动。如果你未能使用信息源线索，你的跟进方式会显得生硬。他可能会怀疑你在探究，这会触发抵制的本能。\n\
  \n## 了解阈值\n\n当你在保镖行业工作时，你会被教导使用一种称为 *阈值制动* 的技巧。这涉及踩刹车到你的车正在减速，但车头没有可感知的下沉。你学习这个是因为它允许你在制动时转向，这对于始终保持对车辆的控制至关重要。\n\
  \n当你提问并跟随他的线索时，想想阈值制动的比喻。你注意他感觉你在探究的迹象。你不想推到看到反应的程度。你唯一能发现和调整情绪变化的方法就是以没有人察觉你在制动的方式踩刹车。如果有迹象表明他感觉你做的不仅仅是聊天，你必须立即转换到威胁性较小的话题。回到他之前提到过的一些无害的事情。\n\
  \n## 练习：找到阈值\n\n你可以用你很熟悉的人或你永远不会再见的人做这个练习。选一个热门话题。用宽泛的术语与此人交谈，并逐步走向那个热门话题。当你开始走这条路时，观察和倾听你是否接近情绪反应，但始终保持在它之前一点。\n\
  \n如果此人是好朋友，就刹车并向他简报你正在做什么。如果此人是陌生人，就刹车并谈论一些积极的事情。注意新闻采访者如何采取这种方法。注意有时他们会越界，你可以在爆炸前看到他们信息源的反应正在酝酿。不要让你的信息源达到那种程度。\n\
  \n## 收集信息\n\n当你跟随对话线索时，诉诸他的自豪感。当你明显进入自豪感领域时，恭维他。你会在男性和女性身上看到类似的迹象——下巴抬起、姿势挺直、肩膀可能变宽、发音清晰，声音音量稍大，兴奋感增加。为了让他提供更多细节，指出成就并抚摸他的自尊。隐藏在这些细节中将是其他让你能够使用好问题跟进的线索。你将能够发现事情，比如为什么他对这一特定成就如此自豪。也许他战胜了几率。也许他扭转了他有史以来最大的失败之一。\n\
  \n当你收集信息时，从你的工具箱中取出各种工具。这些会给你一些快速结果：\n\n- **_重复词语。** 重复你希望他提供更多信息的词语。人类自然会丢弃我们想要谈论的词语，并且非常愿意教育那些不了解我们热衷的事情的人。利用这种自然倾向。跟随他的\n\
  \n\n顺着他的谈话风格，谈他想谈论的话题，但要在对话过程中通过重复那个词来锚定你希望返回的地方，并引导他的思维回到那里。如果你在语境之外使用这个词，他会自动为你修正。\n\
  \n- *依靠这对有用的姊妹：奉承与批评。* 通过使用这些被称为审讯术语中*自尊与自负的抬升/压低*的杠杆，你可以在对话中撬动行为。问“你做*那件事*的时候在想什么？”是一种温和的批评形式，很可能引出他平时不会轻易透露的更多细节。奉承也是如此。人们感到需要被理解，当你表现出不理解时，他们会澄清。当你被视为志同道合的人时，他们会给你更多好东西。\n\
  \n随着你的三维人物模型逐渐成形，你会开始理解这个个体，以及他如何融入他所属的各种群体。他在工作中可能平平无奇，但在圣地兄弟会中却是英雄和领袖。如果只关注前者，你可能会错过他真正的根基，就像大多数与玛丽安的演员朋友共事的人那样；这位朋友在正职工作中常年得不到重用。了解你的谈话对象后，你就能在一个对他意义重大的层面上激励目标。如果你基于收集到的信息（既包括公开提问，也包括暗中观察）获得整体图景，就不会只是空谈他的需求和欲望。\n\
  \n## 巩固融洽关系\n\n这些交流中不应有压力——只有信息收集。这些步骤是为了理解你的目标，而不是操控他。随着你推进对话并逐渐轻松，记住情感在强化融洽关系中的作用。无论某人高尔夫打得多么出色或歌唱得多好，客观意见并不如球员或歌手对其所附着的感情重要。我们都见过名人在公共舞台上崩溃，因为他们*觉得*自己的表现不够好——无论那是在运动、电影还是音乐会上。\n\
  \n因此，你可以把某人标注在钟形曲线上，但并不能真正了解她在某个表现领域中的亚典型、典型或超典型地位如何影响她的自尊，或如何塑造她对自我实现的渴望。这些主观信息——图像的色彩和质地——能让你巩固已经建立的融洽关系。\n\
  \n## 进入原型人物\n\n当你阅读所有这些人物类型时——无论是与群体中的地位有关，还是与极端行为有关——你可能会觉得缺了点什么。这些人物就像约翰·F·肯尼迪和戴安娜王妃那样规模宏大，或者如同你在社区甚至家族中极为钦佩、但曾以为遥不可及的人。\n\
  \n你可能认为自己并不认识符合这种描述的人，但事实可能并非如此。上高中时，你是否认识某个你觉得注定会成就非凡的人？某个成功并不会让你嫉妒的人？换句话说，那个人不是你的竞争对手，而是远远超出竞争范围的人？你今天可能不知道那个人在哪里，但你对她的积极记忆是神圣不可侵犯的。我们每个人在人生的不同阶段、不同位置上都认识过这样的人。他们几乎就像是另一种人类。\n\
  \n这些就是原型人物。一旦一个人成为原型，她就不再是文化的一部分。你绝不会把她归入你的同类。她就像一种新的存在类别：是人类，但其余人类的存在方式不同。\n\n\
  希腊诸神是原型人物的经典代表。他们是人，只是不同阶层的人。根据神话，他们表现出与人类一样的小气、愤怒、非理性行为、浪漫爱情和欲望，但他们拥有超人的力量，值得一个帝国的崇拜。他们和戴安娜王妃有什么区别？区别不大。\n\
  \n我们一直需要寻找比我们更优秀的人物，但持续地需要这些人是我们的同类。我们寻找与他们建立联系的方式。他们越具有原型性，我们就越不为他们的毁灭而高兴。然而，正如我们在近来的许多英雄身上所见，一个人可能从恩宠中跌落得如此彻底，以至于原型地位永远无法恢复。\n\
  \n其中一个例子是O.J.辛普森——从足球明星和电影明星，沦为疑似血腥手套的主人——尽管迈克尔·杰克逊、伊丽莎白·泰勒和比尔·科斯比也是很好的例子。伊丽莎白·泰勒曾是好莱坞皇室成员，直到她嫁给了参议员约翰·华纳。出席政治筹款活动而不是奥斯卡颁奖典礼，使她在一些美国人眼中的地位跌落了几分。迈克尔·杰克逊从未停止作为音乐天才，但当关于他的天才伴有变态的指控沸沸扬扬时，他的地位也一落千丈。比尔·科斯比，这位让Coogi毛衣风靡一时的电视经典居家男人，如今作为性侵犯者而声名狼藉。\n\
  \n当这类原型人物跌落神坛时，那些将他们视为近乎神灵的人很可能会经历悲伤的几个阶段。伊丽莎白·库伯勒-罗斯在*《论死亡与临终》*中描述了这一点。为什么人们会关心像O.J.辛普森这样的人的命运——仿佛这是一种死亡？我们不希望他们跌落，因为如果他们掉下来，我们会怎么样？当像O.J.辛普森这样的人经历一系列法律创伤和可耻行为时，我们会感到“错”，因为我们一直崇拜的是错误的“神”。\n\
  \n涉及原型人物的社交动态与“正常”人的不同。例如，你们公司那位一走进房间就赢得尊重的无畏领导，可能高尔夫打得很糟糕。但是，他打出三倍于他年龄的杆数这一事实，却一点也不困扰他。\n\
  \n他无需证明什么，他会继续赢得尊重——即使在高尔夫球场上——仅仅因为他的形象就是原型人物的形象。\n\n你大概在想：“如果你是原型人物，生活一定很惬意。”远非如此。你仍然有对同类人的基本需求，只是你发现自己被那些视你为无与伦比的人包围。这可能是一个极其脆弱的处境，正如许多原型人物因建立了不明智的关系而陷入灾难性的、被剥削的婚姻和商业伙伴关系所示。\n\
  \n无论那个人在钟形曲线上的位置如何，如果你使用消极方式得到你想要的，关键问题是：我如何让那个人感觉他正在失去对归属感的把握？这种归属感可能来自他的公司、俱乐部、朋友圈，甚至家庭。甚至不一定是绝对意义上的归属，而是他对自己在那个群体中所扮演角色的感知。\n\
  \n## 你的目标：是谁以及如何\n\n你选择影响的人是否有能力给你想要的东西？如果没有，那人在你的宏观计划中能做什么？是帮助还是阻碍？\n\n一旦你确定某个人有能力满足你的愿望，你就可以制定计划来实现目标。这个计划始于人性建模练习，以了解个体的核心人格类型及其在群体中的地位。随着进展，你可能突然发现他不是能给你想要之物的人，反而是帮助你让正确的人做你想做的事的关键人物。建模练习为你提供信息，让你朝着新的方向前进。\n\
  \n在建模他人时，不要戴上你的墨镜、玫瑰色眼镜，或任何通常扭曲你视野的滤镜。基于需求产生的意图、动机和人性品质的投射，会摧毁你理解他人的能力。如果你让这些因素过滤你对目标人物的感知，你将成为自身偏见、压力和情感包袱的牺牲品。\n\
  \n你需要对他的群体也做同样的分析。你可能倾向于高估他所在群体的价值——例如门萨——或者根据你的观点嘲笑它。把这些放在一边，因为你对群体价值的评估不是关键因素：你需要知道你的目标在其群体等级中的位置。一个在不寻常环境中以超典型姿态占据主导地位的人，已经获得了成功并给予自己安全感：他满足了归属需求，进而获得了声誉和地位感，甚至可能已经实现了自我实现。这就是\n\
  \n这些基本要素为你提供了操控他所需要的信息。\n\n这种现象适用于任何情境。无论是什么，群体既为个人提供了归属的机会，也提供了出类拔萃的机会。你建立他人模型的能力，取决于你把她放在群体背景中观察，同时抛开你对这个群体是否值得归属的判断。\n\
  \n一旦你收集了目标性格中的关键细节，并将其置于层级结构中，就要谨慎行事。小心处理这些信息，否则你会伤害对方的心理。为了得到你想要的，你可能需要让目标看到事情*确实*可能发生，但这样做很少带来好处。\n"

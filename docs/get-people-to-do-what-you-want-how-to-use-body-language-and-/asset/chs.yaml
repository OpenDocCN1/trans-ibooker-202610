  \n## 作为领导手段的孤立\n\n一个没有外部影响的社区，或与外界的沟通被通过个人或媒体的控制来源过滤的社区，就会变得封闭。正如津巴多在[第一章](#)中描述的斯坦福监狱实验所说明的那样，这种封闭对行为的影响可能令人震惊。无论是正式还是非正式，领导者都成为该群体的绝对权威，成员们寻求他的认可。\n\
  \n如果非正式领导者突然夺权，结果很可能是流离失所；正式领导者会看到大规模外流。20世纪中期德国战时和战后的人才外流就是后者的一个例子。玛丽安参与了她曾工作过的剧院公司的一次外流。董事会仓促决定在季节订阅资金到位之前暂停员工和演员的薪水。不仅这是一个非法举动（“总是会有失业救济……”，），而且还不尊重到足以导致十名员工中有六人离职。\n\
  \n一个极具魅力的领导者可能比其他人能多抵挡一段时间不可避免的结局，但问题不是是否，而是何时。如果他能坚持足够长的时间来启动群体的标准转变，那么与社会规范的断裂是必然会发生的。如果他不能，那么他的尝试就会失败。\n\
  \n只要有足够的时间，即使领导者并不特别有魅力，他也可能通过诉诸集体信念并改变它们来利用群体思维从而制造个人崇拜来实现扭转。换句话说，他改变了群体的集体意识。这就是在\n\
  \n从更大的教会社区分裂出来的会众中发生的现象；随着他们更紧密地依附于牧师的思维模式，他们对伞形组织的政策和做法的批评也越来越大。\n\n由于归属和差异化的需求塑造了我们作为人类做出的许多决定，我们有责任关注我们生活中那些有潜力满足这些需求的人。在宏大的层面上，他们是我们公司和政府的强加领导者。但那些执行社区公约或在扶轮社会议上夺取权力的人，对与满足这些需求相关的幸福感的影响可能一样大——甚至更大。问问自己：她为什么对我有如此大的影响力？她是在行使赋予她的权威，还是我在放弃权威？她真的有魅力，还是我由于环境而认为她有魅力？如果你是掌权者，注意这种动态并磨练你的技能。如果你不是正式掌权者，绘制这种动态并利用它来打磨他人对你的看法。\n\
  \n这一知识的现实应用可以帮助收购其他公司的公司。平衡的举措是何时撤出关键领导者。过早撤出会造成大规模外流和员工脱离；撤出太慢则新公司的文化永远无法扎根。这就是为什么收购二十年后的公司仍然自称“旧\
  \ X 团队”。\n"

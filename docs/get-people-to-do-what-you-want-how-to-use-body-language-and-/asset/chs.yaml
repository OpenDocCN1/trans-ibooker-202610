- "# 第八章\n\n## 调动他人的策略\n\n**简要回顾：了解**什么驱动一个人，将为你提供获得想要之物的基础信息。你的首要任务是弄清他在归属与差异化方面处于什么位置；也就是说，他适合需求层次中的哪一级。你拥有的工具让你能够理解他在需求层次中上升的可能性——在大多数情况下，你比他本人看得更清楚。\n\
  \n你的选择范围会在你决定是帮助他在群体中差异化，还是把他提升到超典型地位，或将他降级为普通“老乔”时成形。从你做出决定那一刻起，你为获得想要之物而制定的整个计划，就反映出你是要让他上升还是下跌。我们说的“上升或下跌”，不仅指在不同层级之间，也包括在同一层级之内。你的目标几乎无法归属，他需要巩固自己的位置。你会采取威胁将他完全逐出群体（除非他合作）的方式，还是让他完全融入群体以换取合作，或是两者结合？你的目标已充分差异化到超典型的程度，超越了归属层级，也许正在攀登通往自我实现的阶梯。你是采取进一步差异化他的方式——把他往上踢（明升暗降）——还是指出皇帝的新衣其实只是皮肤，从而削弱他的差异化特质？\n\
  \n此时此刻，我们无法告诉你你可能会选择什么，因为每种情况都取决于你对目标的了解——他如何看待自己和世界，他的长处和弱点，以及你在群体中的位置。我们能告诉你的是，每种工具在不同策略中如何发挥作用：\n\
  \n- 联结\n- 分裂\n- 同质化\n- 过度差异化\n\n同时，我们也能向你展示这些策略如何与削减选择、孤立、说明和联想协同运作。\n\n## 联结与同质化\n\
  \n*联结*是寻找人们共同点的积极运用。它指向你与他人共同拥有的东西，无论好坏，并通过暗示“你我是如此相似，我不可能对你构成威胁”来邀请对方靠近。甚至诸如“同病相怜”、“人多力量大”或“红发人应该团结一致”这样无力的陈词滥调，也捕捉到了我们被与自己有某种感受、特质或事业的人所吸引的倾向。\n\
  \n*同质化*是寻找人们共同点的消极运用；也就是说，是对联结的消极使用。传教士与……没有什么不同。\n\n\n\n\n\ncongregation: 他与会众其他人一样拥有同样的天性和脆弱性。这可能是被抓到出轨的牧师，也可能是在演讲中犯错的老板。无论根源如何，结果都一样。通过刻意地同质化，你将目标推回更接近群体的中心，远离超典型地位。通过我们在“删减选项”部分描述的策略，你可以应用以下策略。\n\
  \n## Illustration\n\n你对目标所知事物的说明效果如何，对结果的质量有着巨大的影响，无论意图是建立联系还是同质化。你可以通过提出直接问题、强迫行为，或通过平行提问来让对方在公开场合无意中透露信息，从而执行该策略。\n\
  \n- **Bonding through illustration.** 说明依赖于你在第4章中学到的策略。无论你选择使用直接提问还是平行提问来让目标透露信息，都取决于你通过对其进行建模而了解到的她的性格。一旦决定，你便以一种晦涩的方式提问或提出话题，你知道她会对此发表评论。在某些情况下，你只需发出邀请，她就会完成剩下的部分。毕竟，你是在为她创造一个建立联系的机会——这是人类最强大的驱动力之一。\n\
  \n艾伦·德杰尼勒斯在人性化他人方面做得非常出色，原因有几个；例如，她指出了他们与其他人之间的共同点。许多采访者关注的是名人嘉宾的特别或独特之处，而德杰尼勒斯则擅长说明名人与观众之间的联系。奥普拉·温弗瑞是她的一档游戏秀式环节“艾伦的燃烧问题”的嘉宾。奥普拉对问题的回答让她与观众建立了直接而幽默的联系。其中一个燃烧问题是“以\
  \ O 开头的最喜欢的词？” 艾伦说她的是“Oprah”。奥普拉说她的是“Oreo”——就像那款广受欢迎的饼干。问题“有什么让你感觉良好的事？”得到的回答是，“和我的狗在草地上打滚。”我们甚至得知奥普拉最近在银行排队。她正在存入一张两百万美元的支票，但好吧，重点是她像我们其他人一样在银行排队。艾伦找到了一种有趣的方式来突出名为奥普拉的人，而不是明星。当她结束该环节时，明星与观众建立了联系和力量，因为他们看到，尽管她具有超典型地位，她仍然是一个人类，一个大笑时会发出哼声、唱歌跑调的人。\n\
  \n- **Homogenizing through illustration.** 使用同质化来夺走目标的特殊力量，就像莱克斯·卢瑟用氪石把超人变成普通人一样。当某人在一个领域超典型时，他在另一个领域就会同样地亚典型。对希腊诸神的快速回顾显示，拥有超自然力量的诸神也是小气、自负和阴险的。这难道不让你惊讶人类会创造出代表人类本性这一方面的神吗？\n\
  \n在最简单的形式上，同质化是指指出神的日常人性脆弱性，例如他在你的工作场所或社区中。在最阴险和复杂的形式上，它是让超典型披露一些使他变得平凡甚至亚典型的东西。可能性是无穷无尽的。人类喜欢看到流星坠回地球。打开娱乐新闻；每天都有新的名人倦怠故事。\n\
  \n在她最低谷时，林赛·洛汉就是创造毁灭奇观的典型例子。建起来，他们就会来。让超典型透露证明她并不那么超的信息的最简单方法就是开始一段对话，让她认为你钦佩她，然后逐步深入细节。如果你告诉她她很伟大，而她又是自负的类型，例如，她会很乐意告诉你她有多伟大。当你询问她周六做什么，她告诉你她有唱歌演出时，你问她丈夫对此怎么看，她告诉你她最近离婚了——这是她一直瞒着同事的事实。你也许可以在此停止。\n\
  \n从积极的角度来看，通过说明其他群体成员的超能力，你也可以让超典型感到相当平凡。效果是他失去了一些傲慢，这反过来又使群体其他人更紧密地与他建立联系并将其同质化。\n\
  \n无论是用于建立联系还是同质化，说明都是一个很好的工具，因为你使用的是他人的言行来建立共同点。你的话永远无法拥有目标的言行和行动所拥有的力量。\n\n## Isolation\n\
  \n在审讯循环的讨论中，我们注意到大多数士兵并不是与整个单位一起被俘，因为战争的性质使群体分裂。在审讯中，消息来源被从他的绝缘中移除\n\n- *Homogenizing\
  \ through isolation.* 与新人在寻找归属感的方式大体相同，你可以为群体创建专业团队，在那里超典型的魔力影响很小。例如，你可以把他孤立到鲨鱼出没的大池塘：“我已要求你在董事会会议上代表部门做演讲，拉尔夫。”当他从海洋回到金鱼池，少了几品脱血时，他可能会更愿意与那里的人们合作。他最大的领悟可能是他其实并不是那么大的一条鱼，或者他突然意识到他小池塘里的其他人也有才华。无论哪种方式，你都在他的自我形象上施加了大量现实。你实际上是通过行动应用了兰德鲁姆因素。\n\
  \n## Association\n\n随着马斯洛的需求层次和满足矩阵在你的脑海中，你将对为什么以及如何限制满足需求的选项的知识做出实际应用。首先，你做的每一个选择都会限制以后的选择。所以如果你受洗成为摩门教徒，你成为罗马天主教教皇的机会就消失了。你所做的每一次关联，无论是与群体、信仰还是行动，都会限制你未来的可能性。虽然说明的工具会影响你如何应用你对某人归属或联系的知识，但将关联作为策略使用会使群体将局外人视为更像他们并接受他。或者它会产生相反的效果：他们会看到丝绸钱包只不过是猪的耳朵。\n\
  \n- *Bonding through association.* 通过你对这个人的了解，你可以为勉强归属的人找到共同点。在某些情况下，这只不过是他认识他们认识的人这个事实。在其他情况下，这可能是与相似的人或社会群体的关联。杰克和苏珊都是六年级学生的父母；他们由于发展心理学而分享相似的经历。如果两人都在工作中经历过某项重大举措的实施，他们就有共同点。关联的共同点有多微小并不重要；重要的是它有多相似。此外，共同点涉及的仪式越多，它就越有力量：两位分别属于不同教派的执事女性将比去过格雷斯兰的两个人分享更多。关键是让你的目标与对群体其他人有意义的东西相关联。在与同事的第一次会议上，伊丽莎白自愿表示她戴着粉色腕带，因为她是乳腺癌幸存者。桌上的人——男性和女性——都知道有人也是乳腺癌幸存者。\n\
  \n人们也常通过加入专业团体来建立关联纽带，这些团体成员有共同的目标和技能。基于你对目标的了解，你可以挖掘出更有趣、更晦涩且在该环境中有意义的东西。\n\n-\
  \ *Homogenizing through association.* 当你知道某个关联会降低超典型的崇高地位时，你会指出它以实现同质化。这在日常新闻中有一个典型的例子，我们看到富人和名人的家人一次又一次地出现，带着普通的问题。哈莉·贝瑞的父亲有虐待行为\n\
  \n\n\n\n\n## 分化：区分差异还是过度区分\n\n分化的核心在于展现差异——不是消极或积极的差异，仅仅只是差异。你如何使用每一种工具，将决定这些差异被如何感知。\n\
  \n- *通过分化来区分。* 这是差异的积极应用——指出群体中某个成员的优势领域，让他能像奶油一样脱颖而出。这种应用依赖于将优势凸显出来——这些优势不至于疏远他人，至少计划如此。\n\
  \n- *通过过度分化来区分。* 所谓*过度分化*，是指在任何方向上走得太远，以至于群体中的其他人无法认同这个人，或者他本人也无法理智地认同这个群体。这并不一定意味着这个差异是负面的。也许只是件简单的事：他被邀请到老板的乡村俱乐部，因为他和老板的女儿是大学同学。仅此一点就可能使他在所属群体中显得过于特殊，以至于群体再也无法满足他的需求。英语中的俗语如“你永远回不了家”正是根植于这一原理。\n\
  \n- *通过示例法进行分化。* 要推销产品，你必须知道它为什么不同于其他产品，哪怕仅仅是因为更便宜。利用你在第4章学到的工具，你需要挖掘出目标客户鲜为人知的事实，以找出她的独特之处。无论你是提出只有具备相应技能的人才能回答的难题，还是用各种方法在会议上引发一场爆发，娴熟地运用这些工具是实施这一策略的必要条件。\n\
  \n- *通过示例法进行区分。* 当你提问时，要精心设计问题，使他在提问中展现出作为群体中坚实一员的一面，并拥有其他成员不具备的洞见。（引导性问题在这里会有帮助。）无论这些信息涉及过往工作、爱好还是其他课外活动，都要编织一张从他人到技能集的蛛网。用引人深思的平行问题让他自己看到关联并主动说出来，或者干脆问他过去在工作中会怎么做。这套技能的核心是让他成为英雄，以某种方式展现他的超典型特质，但又不会过头到成为马屁精。这种健康的分化能让他脱颖而出，又帮助他不至于走得太远。\n\
  \n- *通过示例法进行过度分化。* 在我们这个“无所不可、没有对错”的现代世界里，人们很容易忘记一个事实：有些东西可能过于不同。不管他们在公开场合表现得如何，很多人实际上比他们表现出来的要保守得多。我们不是指政治意义上的保守，而是指他们对偏离常规的容忍度，远低于他们出于政治正确而愿意承认的水平。\n\
  \n    提出将话题推向极端边缘的问题，既能引发暴露内心的回答，也能引发某些行为。精心设计问题和策略，把某人推向反应过度，或将群体看重的某事贬为“无非是废话”的境地。一个夸张的例子是用引导性问题暗示评判：“你不觉得，在孩子们放学回家路上从桥上跳伞，构成鲁莽危害行为吗？”其效果是把他从群体可接受的范围内剥离出去。\n\
  \n    当一位备受尊敬的人持有缺乏事实依据的观点，或将某位大师的想法据为己有时，这一策略尤其有效：“如果测地线穹顶真是如此节能的模型，为什么在如今我们痛苦地意识到能源成本的时代，却看不到更多的实例呢？”你给他机会解释，如果他说得听起来很明智，就鼓励他——但只到一定程度——然后转向批判性提问。之后，你可以选择救他一把，或者让他自己挣扎。\n\
  \n    无论哪种方式，你的任务都已完成，他要么需要重新确立自己在群体中的成员身份，要么就得去别处寻找归属感。\n\n- *通过隔离来区分。* 在一个充满敌意或满是独特天才的池子里，想让某个人显得特别往往很难。在某些情况下，一位超典型人物恰恰是利用了房间里普通人也拥有的同一种才能，才攀升到超典型的水平。\n\
  \n    除非这位超典型人物心态非常平衡，否则她可能会把新人视为威胁并加以威慑。他的安全网在于有能力进入一个更小的池子，在那里他可以自在地找到归属。如果你能促成这一点，你就在新人和那位多疑的超典型人物之间制造了一道缓冲。实现这一目标的方式包括：精心安排一次会议变更，不经意间将超典型人物从现场支开；或者邀请新人参加那位受威胁的超典型人物绝不会参与的活动。这两种方式都能将你的目标人物隔离出来，让她得以闪耀。\n\
  \n- *通过隔离来过度分化。* 有些事在某些群体中完全可以接受，但在另一些群体中却是太过分了。在美国企业界使用军事用语，可能会让人夺门而逃。通过巧妙地引导你的目标人物，让他觉得安全、觉得身处朋友之中，你往往能让他说出那些在敌对阵营中绝不会透露的事实。这一招在生活中和喜剧中都行之有效。两者都依赖于一个事实：人类是仪式性的生物，会不由自主地一遍又一遍重复同样的事情。\n\
  \n    在喜剧《拜见岳父大人》中，阿什顿·库彻饰演的角色正与伯尼·麦克饰演的角色的女儿约会，并到女方家参加感恩节晚宴。伯尼·麦克对白人男性约会自己的女儿深感不满，便引诱库彻讲“黑人笑话”，用一句“别这样，你现在已经是家人了”来引他上钩。最终，库彻一个接一个地重复笑话，直到越过了底线。\n\
  \n    这种“打开水龙头”的现象时有发生：人们会投射出这样一种预期，即被接纳意味着对方和自己完全一样，会接受自己的一切，包括缺点。但这很少是真的。\n\n\
  - *通过关联来区分。* 人们常常通过提及名人或告诉你他们以前在哪里上学来区分自己。一位来自新泽西的朋友常说，住在普林斯顿会让人觉得自己很聪明；你说一句“我来自普林斯顿”，就能获得一种资历。操纵关联可以让一个人在群体中显得更有价值或更没价值。当他是团队中的坚实成员，并且和老板的兄弟关系很好时，这或许足以提升他的地位——除非老板的兄弟像前总统吉米·卡特的弟弟比利·卡特那样，是个自认的酒鬼。一个人拥有的每一种关联，无论自愿还是偶然，都可能产生巨大的差异。看看安德森·库珀这样的人，他是时装设计师兼作家格洛丽亚·范德比尔特的儿子，也因此成为商业大亨科尼利厄斯·范德比尔特的玄玄孙。\n\
  \n- *通过关联来过度分化。* 通过关联来过度分化，在美国各地的法庭上一直被用来左右有罪或无罪的判定。如果你和不三不四的人混在一起，那你又算什么人？你可能是查尔斯·曼森，也可能是特蕾莎修女。\n\
  \n    这里的关键在于如何把控叙事角度。通过将你的目标人物与某个超出群体理解范围的人关联起来，你就能把这个人推到孤立的境地，也许还能让他更靠近你或另一个群体。\n\
  \n    这种情形以非常公开的方式发生在乔治·艾伦·雷克斯身上，他是浸信会牧师，曾是美国反同性恋运动的领袖，直到他在迈阿密机场被拍到与一名男性陪侍在一起；还有前国会议员安东尼·韦纳，他因性短信丑闻而臭名昭著。与名声不佳的个人或概念的关联，会让一个人急切地寻求归属。当他在努力融入时，他会忘记一切关于超典型的想法，拼命想要抓住些什么。对于自我实现者来说，他会努力维护自己的声誉，就像深陷白宫实习生莫妮卡·莱温斯基丑闻时的克林顿总统一样。有人能东山再起，比如克林顿。但通常不会。\n\
  \n\n\n\n"
- '# 第九章


  ## 最终因素


  你的目标在需求层级中处于何处，以及你如何利用这个答案？


  既然你现在已经了解了审讯人员用来影响行为的技能和方法，我们将把它们整合到一个项目总结中，用于与你的目标达成交易——获得你想要的东西。该项目的一部分是我们仅在书中旁敲侧击地涉及的内容：自我反思。你在需求层级中处于何处，你的满足选项是什么？


  ## 行动计划


  你行动的大纲很简单：看看这个人在生活中的需求处于何处，并将他实现这些需求的成功与你的结果联系起来。就机制而言，你要整体地看待这个人，并想办法让他在这层级中上升或下降。在某些情况下，他们甚至不知道自己处于何处、需要什么。你将通过向他们展示可能性，然后精简和塑造选项来实现这些可能性，从而提供帮助。


  将你的流程集中在马斯洛需求层级与满足矩阵的交集上。大多数人处于归属和差异化层级之上或之间，即对爱与联结的需求和对地位与声誉的需求。你的三维人物模型让你能够整体地看到他在各个群体中的位置。你通过使用工具与他的互动，告诉你他认为自己处于何处以及这对他意味着什么。了解他的驱动力、需求和当前状况，你就可以看到——很可能比你的目标更清楚——哪些选项落在构成层级与矩阵交集的菱形之内。你的力量不仅在于识别这些选项，还在于拥有一个计划，利用它们来使你的目标上升或下降：加强他的归属感或削弱它，提高他的地位或降低它，帮助他走向自我实现或损害他实现自我实现的机会。


  简而言之，这就是你让他做你想让他做的事情的方法。当你知道他需要什么时，你就将他的箭头与你的箭头对齐。当你知道他想要什么时，这可能与他需要的不匹配，你就改变他的欲望，因为*需求压倒欲望*。如果一个人通过工作晋升来追求自我实现，而你将他推入一种需求状态，例如因为你有效地使他同质化，他需要重新获得地位，那么你就可以迫使他调整关注点。你就可以攻击需求而不是欲望。


  这正是格雷格在审讯中做的，他希望线人透露的不仅仅是他的指挥官的名字。仅这个名字本身就是对信任的背叛。囚犯希望通过沉默来维持忠诚，这是试图维持自尊的表现，于是格雷格威胁要把他作为与敌人合作的例子公之于众，让其他囚犯看到——除非他提供格雷格寻求的信息。随着他对属于自己群体的需求占据了他的关注，他放弃了走高尚道路的欲望。格雷格迫使


  他要在自尊和归属之间做出选择，而金字塔上需求越低，它获胜的可能性就越高。


  一旦你知道如何将目标的需求与你的欲望对齐，你就有很大机会得到你想要的。你只需要确立并强化你就是光、道路和门户，而这就是你需要审讯者的方法来发现、操纵的技术，以及建立联系和分裂的策略和战术。从你的工具箱中取出这些工具来做以下四件事之一来促成交易：


  - 1. 你展示你能为他做什么，做了它，并期望有所回报。

  - 2. 你展示你能为他做什么，做了它，并威胁除非得到你想要的东西否则收回它。

  - 3. 你展示你能做什么来阻碍他，但如果他按你想要的做就提供不阻碍。

  - 4. 你展示你能做什么来阻碍他，做了它，并且只有在他按你想要的做时才提供拯救他。


  这个过程可能需要几分钟、几个小时、几周或几十年，取决于你想要的范围、你认识这个人所需的时间，以及你对我们所描述的技能组合的熟练程度。


  审讯人员工作迅速，因为他们必须如此。如果你只想要一个信息，那么你可以通过评估这个人在层级中的位置、给他反馈以呈现你满足需求的能力，然后要求信息来快速工作。场景：你看到有人在没有顾客的酒吧工作。她感到无聊和孤独，表明她立即需要归属感。


  你坐下来交谈，询问常客的问题，以了解你的配偶是否可能是其中之一。


  如果你的欲望更大，比如说，你公司的总裁。你想要的是董事会成员的支持。范围很大。过程相同。那可能需要一段时间。


  ## 让马斯洛个人化


  在马斯洛的需求层级中，一个基本前提是，你只能在满足了当前层级的需求后才能攀升到下一层。类比地说，你对如何满足这些需求所做的每一个决定都会影响你进一步满足的选项。


  我们反复说过，你作为从外部观察目标的人，可能比他自己更清楚地看到他的需求。你也处于一个客观评估他现在是否、或能否迅速成为其群体中超典型、典型或亚典型的位置——无论他认为自己处于何处。尝试也对自己使用你的建模和分析技能，以让你对人格、骄傲和羞耻的来源、优势和弱点有更清晰的认识。你可能会非常惊讶，并意识到你希望某人做的事情完全不切实际——你想要的与你真正需要的并不匹配。


  你如何使用这些信息是关键。


  玛丽安的大学朋友比尔，一个温文尔雅的智力型男子，与在华盛顿特区工作的几个人合租公寓，其中两人也在 FBI 工作。比尔是一名年轻的分析师——一个彻头彻尾的书呆子——而他的室友则是肌肉加头脑的家伙，是电影中
  FBI 员工的版本。有一段时间，他们看到了他敏锐的分析对他们有什么作用。突然间，他们开始对他表示尊重，而这些男人意识到，是生活中的比尔们


  提供了至关重要的线索来抓捕罪犯并拼凑碎片，使他们免于残酷的批评、诉讼，甚至巨大的危险。比尔的经历阐明了利用对马斯洛需求层级了解的重要之处。虽然他在分析师群体中是差异化的，但比尔在认为自己是朋友——但在男性意义上是“更优越”的朋友——的男子气概室友面前缺乏自信。然而，他是唯一拥有知识帮助他们变得“更优越”的人。


  当你发现自己身上有类似的事情时，它会让你保持警觉，意识到你所分析的许多人也会在归属和差异化方面存在自我意识的差距。在工作以外的环境中感到被差异化，会让一些人产生虚假的归属感，认为自己在工作中的地位比实际更高。相反，他们可能会认为差异化对他们在群体中的地位没有任何作用，但正如我们向你展示的那样，它很可能确实如此。


  ## 提炼流程


  当我们介绍以下每种类型时，让我们专注于这个人实际上如何在群体中融入，而不是被自我意识差距扭曲的视角。我们甚至可以将其提炼得更进一步：这是这个人在你能改变的东西方面的融入程度。有些事情超出了你的改变能力，所以虽然你知道她在家庭中是亚典型的，但你无法修复它来得到你想要的东西。然而，你可以帮助她在工作环境中归属，并最终在那里成为超典型。因此，虽然你知道目标在许多其他地方运作，但我们在这里谈论的是你能够控制的那个。


  ## 一个渴望归属的局外人





  你会纳闷，她是怎么被一家游说公司录用的，哪怕只是作为幕后研究团队的一员。你发现她热爱芭蕾，事实上还专业跳过四年舞。她喜欢待在家里和她的猫在一起。


  - **你的目标：** 你希望在一项可能备受瞩目的立法提案上，主导它通过国会山上的“当权者”，但除非你能证明自己比其中一位资深说客懂得更多，否则你得不到这个任务。要在接下来的两天内做到这一点——这是你的机会窗口——唯一的办法就是让研究部门有人夜以继日地工作，而且不让其他任何人起疑。所以，不能申请加班。

  - **基本问题：** 她的需求是什么？

  - **答案：** 你发现她喜欢自己的工作，只是不喜欢工作环境。她几乎融入不进去，而且很难每天坐在隔间里，旁边都是她认为物质、自私、做作的人。她最渴望的就是大部分时间能远程办公，但除非她老板的上级认为这样做合适，否则这永远不可能。讽刺的是，如果她能在家里工作，她就会“舒适地融入”，这正是她当下的需求。


  ## 可选方案：


  - 安排她试行弹性工作制，并期望她回报你。

  - 让她看到你有能力为她争取弹性工作制，但把你想要的作为你为她行动的条件。

  - 安排别人告诉她，获得弹性工作制的最好办法是让你开心。

  - 让她明白，除非她按你的意愿行事，否则她永远得不到远程办公的特权。


  理想、积极的做法是通过把她的归属感提升到舒适的水平，来得到你想要的。在这种情况下，两个积极选项都能起到这个作用：第一个把部分控制权交给她，第二个把控制权留在你手中。你对她的建模会让你洞察到哪种方式她会更愿意接受。


  归属感与差异化——归根结底就是这样。就像一个审讯者，你现在已经掌握了让这些发生的知识体系。马斯洛会欣赏你的。


  ## 结论


  人类同时运行着大量的程序。有时，尽管复杂，我们的行为仍然可以根据刺激—反应的前提来预测。和其他动物一样，我们从需求层次的最底层开始，需要食物、住所和睡眠。随着我们上升到更高的人类层面，寻求自尊和自我实现，我们开始面对无数种满足需求的可能性。


  需求金字塔会到达某个点然后终止吗？不会。随着我们不断经历更多，那个点反而越来越远，因为更多的层次让金字塔不断累积。换句话说，我们并不会到达自我实现的顶峰；我们总是在寻找别的东西。而在每一层，我们都试图找到同类。


  即使你达到了你存在模型的巅峰，你仍然需要归属。你需要一个同侪群体。


  学会从他人那里得到你想要的，就是利用每个人对归属的需求，同时也利用每个人想要变得特别的需求。


  因此，尽管我们可能不想承认，在有记载的短短历史中，人类几乎没有改变。我们周围的世界给我们带来了必须应对的新输入，但我们仍然以同样古老的人类方式去满足我们的需求。


  根本的区别在于人类如今占据的虚拟空间。我们可以同时以光速与世界各地的人交谈。这意味着，在虚拟世界中，来自他人、或来自我们赋予人类特征的程序，有数百万种马斯洛式的排列组合。


  人类如何互动，以及人们在压力时期自然会做些什么来创造舒适感，在历史上基本保持一致。这就是为什么可以在令人惊叹的广泛情境中，将让人做你想让他们做的事的方法编纂成文。在这本书中，我们坚持认为，只有理解人类两种主要的社会驱动力——归属的需要和使自己与众不同的需要——你才能掌握让别人做你想让他们做的事的能力。


  你相对于他人的成功，在于使用审讯者的方法和策略，在这两种需要的层级中上移或下移他们。通过应用书中的技巧，你可以取得更大的成功：你可以帮助自己理解自己的需求和欲望。


  我们讨论的一切既适用于你的目标，也适用于你自己。如果你需要归属感，就用这些工具和周围的人找到共同点，并帮助他们理解你是谁。如果你需要差异化，你可以选择加入自己具有非凡专长的群体。


  这本书最大的教训，可能是把“精简选项”一节应用到自己的生活中，并理解你何时在对自己使用“兰德鲁姆因素”。去掉那项限制性的做法，你就能大大扩展满足你马斯洛需求的选项。


  操控别人做你想让他们做的事需要合作，而且总是存在不可预测的因素，因为你自然会投射出部分的


  ## 术语表


  **适应行为：** 用来释放压力、调整身体以提升舒适度的姿态。


  **屏障：** 我们感到不自在时使用的姿态和手势。


  **基线化：** 确定一个人在正常情况下如何表现和说话。


  **钟形曲线：** 正态分布的图形表示，本书中用作分析群体的简单模型。


  **归属感/爱：** 马斯洛需求层次中部的需求。*（另见需求层次理论。）*


  **联结：** 利用归属感和差异化这两大需求的一种方式。*（另见分化。）*


  **复合问题：** 同时提出两个或更多问题的问题。


  **控制问题：** 你已知答案的问题。


  **差异化/尊重：** 在马斯洛需求层次中，略高于“归属感”的需求。*（另见需求层次理论。）*


  **分化：** 利用归属感和差异化这两大需求的一种方式。*（另见联结。）*


  **需求层次理论（马斯洛需求层次理论）：** 由亚伯拉罕·马斯洛提出，描述了从最基本的生理需求到人类最高自我实现需求的五个层次。他的理论认为，只有低级层次的需求得到满足，一个人才能上升到更高层次。


  **说明手势：** 用来强调话语的手势。


  **兰德鲁姆因素：** 本书为描述“精简选项”的操作原则而创造的一种方式；兰德鲁姆因素的效果表现为一条穿过重叠的需求层次和满足矩阵中心的窄带选项。


  **引导性问题：** 在问题中就暗示了答案的问题。


  **满足矩阵：** 一种可视化系统，描述如下现象：存在的选项越多，一个人在需求层次上攀升得越高；反之，选项越少，一个人在层次上的位置就越低。


  **魅力机制：** 本书介绍的创造魅力的系统。


  **个人消亡：** 自我形象被摧毁殆尽的状态。


  **超凡典型：** 一类似乎远超普通人的人类；希腊诸神是典型代表。


  **调节手势：** 用来控制他人说话的手势。


  **重复问题：** 用不同措辞问出的同一个问题。


  **自我实现：** 马斯洛需求层次顶端的需求。*（另见需求层次理论。）*


  **线索来源：** 对方在谈话中不经意透露的信息，提问者认为有挖掘价值。


  **次典型：** 在群体映射中，位于钟形曲线左侧的个人或群体。


  **超典型：** 在群体映射中，位于钟形曲线右侧的个人或群体。


  **三维钟形曲线：** 本书创造的人类建模系统；以三维方式叠加多条钟形曲线；一张描绘一个人是谁的地形图。






  **模糊问题：**一种模糊的问题，可能只是措辞不当的问题，也可能是用来转移话题的问题，或者提问者用来诱使某人开口谈话的问题。



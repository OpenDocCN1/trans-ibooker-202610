  \ of other categories find a gap and create the role that allows them power. Whether\
  \ this power is for perceived good or evil is up to the person. As an example of\
  \ a bad thing, look at the mess we are in with election interfering. On the contrary,\
  \ look at the power of GoFundMe and the lives changed by a handful of people emerging\
  \ as informal leaders. A lot of good came from the initiative of a do-gooder who\
  \ initiated a GoFundMe campaign to cover medical bills for a hard-working person\
  \ hit with expensive, life-saving treatments, but without workplace health insurance\
  \ to cover them. One of Greg's friends was bitten by a copperhead snake—not something\
  \ a person would expect or anticipate—but it's especially bad if he's between insurance\
  \ policies. A friend launched a GoFundMe campaign that helped raise the $57,000\
  \ needed to pay for the care that saved his life.\n\nThe second type of leader is\
  \ formal, or imposed. The underpinning of formality is a recognized process to select\
  \ the leader who fills an official slot and carries the crown and scepter of the\
  \ position. We describe this leader as imposed because, in most cases, not everyone\
  \ has a say in who gets the role. When the board of directors hires your new boss,\
  \ you likely have little input in the decision. His leadership is imposed and, although\
  \ you can opt to leave, that is likely as much power as you can exercise. At the\
  \ same time, it doesn't mean that simply reminding people of his status will enable\
  \ him to accomplish anything.\n\nWhen Greg was a very young soldier, his first job\
  \ was as a finance clerk—something for which he was not well suited. His boss was\
  \ a twenty-two-year-old lieutenant with a horrible management style. He would come\
  \ into the office, cross his arms, walk around, and watch everyone work. It was\
  \ like a caricature from a Monty Python movie. After one of the guys who worked\
  \ in the office died in a car crash, people started to bond against the lieutenant.\
  \ The sense was, “What if this is me tomorrow? I shouldn't have to put up with this\
  \ crap.” A few days later, in an effort to improve morale, the lieutenant brought\
  \ himself down to the level of his minions. He closed the door and said, “All rank's\
  \ off. I want you guys to be point-blank honest with me. How do you feel?” The words\
  \ were barely out of his mouth when a young woman spat out, “You're an ignorant\
  \ mother—.”\n\nThat was the wrong thing for the young lieutenant to say. He tried\
  \ to bond, but instead he fractured very quickly. He was put in power because the\
  \ establishment ordained him, not because he had any competence in the areas of\
  \ people management or finance. He thought he had power merely because he was in\
  \ charge. In reality, he had no power to make anyone do what he wanted. He never\
  \ asked for or earned authority from the people he was governing.\n\nYou might conclude\
  \ that, because this was the military, a certain amount of deference had to be given\
  \ to someone who outranked you. True, but you can provide formal deference to a\
  \ formal leader and it rings hollow. This lieutenant, in effect, removed the veil,\
  \ and saw clearly that he could make people do what he said, but never what he wanted.\
  \ The young lieutenant asked for a transfer.\n\n\n\n陆军从这次失败中吸取了教训，用一位经验丰富的士官取代了那位中尉，这位士官做过办公室里那些人的工作。他一旦展现出源于经验的理解，就立刻获得了合作和尊重。他的开场白传达的信息是，“请允许我帮助你们”，这给了人们尊重他的开口。\n\
  \n玛丽安曾经历过一种管理状况，部门主管被她的八名员工憎恨，与其中一人关系勉强，与另一人是朋友。\n\n然而首席执行官不愿解雇她，因为她与一些有影响力的客户建立了牢固的关系。与她关系勉强的那个人挺身而出担任非正式领导，并充当员工与老板之间的中间人。她把员工的请求带给老板，并把老板的命令和答复传回给员工。这就是她在两年内维持部门完整的方式——仅损失了一名员工。老板自愿离职后，这位中间人接管了部门领导。\n\
  \n今天，格雷格为那些他被授权按命令和法令改变的大型企业领导变革。然而，这种权力并不能让变革持久。他发现自己首先需要进入组织，倾听那些承担重担、执行工作的人。只有在感染了那些能产生影响的人，使他们接受他的愿景之后，他才能做他所说的“压倒组织的免疫系统”，从而让变革得以坚持。\n\
  \n一些理想主义者、刚出生的婴儿（不是你）会断言，美国的民选总统是正式领导人，但并非强加。想想这个想法几分钟。美国总统对许多不同意该人担任总统的人来说是强加的。多数决，所以他是对少数派强加的领导人。国会议员的作用与在部门中充当中间人的那位女性相同——在不喜欢现任政府的选民与认为“我现在在主屋里了。你必须按我的方式做”的现任政府之间穿梭。\n\
  \n一位自然领导者可以迅速成为正式领导者。一个历史上积极的例子是乔治·华盛顿。通过魅力，或只是平常的人际交往技巧，自然领导者可以成为正式领导者的显而易见人选。类似于取代部门经理的非正式领导者，有时挺身而出会带来正式权威。\n\
  \n在整个历史中，也有这种转变的可怕例子，例如阿道夫·希特勒和查尔斯·曼森。然而，这两者是关于非正式领导者夺取权力的两种非常不同的模式。\n\n在一种情况下，一位非正式领导者利用他的身体或智力吸引力和魅力让他人按他的方式看待事物。事实上，通过展示他的性能力和对“体制”的天生仇恨，曼森确立了自己在类似邪教团体中的非正式领导地位。在一群反建制的不满者中，曼森过去的监禁使他变得超典型而非亚典型。随着团体日益确立为曼森家族，他成为事实上的领导者；因此，他成为正式的负责人。\n\
  \n在另一种情况下，希特勒通过其自然领导力在封闭团体中建立联系并崛起，随后利用其权力基础获得国家权威。类似于曼森，希特勒因反对“体制”而在监狱中度过时光。最终，杠杆和个人崇拜使他在国家的正式和强加的领导中获得了权威地位。希特勒通过几次非常马基雅维利式的举动夺取了权力。然后他利用人类天生倾向于采用仪式以强化归属感的倾向。他发展出强大的仪式和装饰，以挖掘并加速德国人民的归属感。纳粹发展出徽章并举行大型集会。他们把归属感提升到新高度，并挖掘了一个感到被低估的同质社会，创造了一种自豪感。第一步：归属。\n\
  \n希特勒和曼森是理解非正式领导力和影响力力量的人。他们利用这种自愿的权威让步作为敲门砖，要求并获得对他人生活的绝对权力。在某些情况下，要求集中于利用小团体授予的绝对权威来对更大团体施加权威。在任何情况下，非正式都演变为正式和强加。\n\
  \n一位领导者也可以是正式的、强加的领导者，他拥有信任和影响力，使他人即使在他没有被强加的情况下也会倾听他。这些个性偶尔会在政治中出现，并迅速因其影响而获得近乎传奇的地位。无论你是否喜欢他们的观点，很少有人能否认罗纳德·里根和比尔·克林顿所拥有的说服力。这两位男性以两种非常不同的风格吸引公众注意力，但原因相同：个性。两人都有与政治对手及其追随者的冲突，但两人都在选举中幸存并连任。他们都在\
  \ arguably 世界上最困难的工作中继续蓬勃发展。虽然里根和克林顿确实被反对他们的人强加了，但他们采取了优雅的方式赢得那些选民的支持，并获得了比投票所暗示更高的支持率。根据盖洛普民调的统计，他们两人都在维持高支持率方面做得非常出色，而许多其他现代总统则有高峰和低谷。⁸\n\
  \n人们在日常生活中也使用同样的技能组合。无论是强加的还是非正式的领导者，许多人都会制造个人崇拜，并利用看似不起眼的机会作为获得对他人日益增长的权威的手段。有句谚语说很少有人会自愿放弃权力，所以要非常小心你把权力交给谁。\n\
  \n## 强或弱\n\n由于评估领导力的强弱依赖于类比的观点而不是二元的观点，所以在此处非此即彼的概念并不完全适用。领导者的风格落在无生气和德拉古式的光谱之间，严厉的风格归因于古雅典严厉的立法者德拉古。大多数领导者——至少大多数能坚持一段时间的人——会找到一种占据中间地带的风格。\n\
  \n无论领导者如何上位，领导力的强度都会影响他的成功。虽然非正式领导者很难立即夺取所有权力，但并非不可能。非正式领导者可以使用手法或公开技巧从其上下层级的人那里夺取权力。根据个人议程，非正式领导者可能真的只想代表他的下属，并相应地约束自己，或者他可能看到成为事实上的统治者的机会。在后一种情况下，他利用与他所“帮助”的人建立的权力基础来表明他是一个不可忽视的因素。希特勒在崛起过程中极大地利用了这一点。一旦非正式领导者开始与上层建立权力基础，他对所代表的人的权力就变得更加正式化。无论领导者是正式的还是非正式的，领导者的个性都会影响他如何行使这种新权力。非正式领导者必须走钢丝。行使太多权威，他会被罢免；太少，他将无效。成为有效的非正式领导者所需的技能组合如此复杂，以至于掌握它的人往往因其精湛技艺而被认可，并作为自然进展成为正式领导者。\n\
  \n虽然非正式领导者可能出于乐趣而担任该角色，但大多数正式领导者是为了获得利益，无论是财务还是声望。这意味着他们比大多数非正式领导者有更多利害关系。人们说，“权力让他头脑发昏”，但这句话所指的核心真相要更加阴险。当一个人利害关系更大时，压力会上升。压力会改变许多人的个性风格，他们会回到过去有效的方法，无论是对他们还是对他们的榜样。在许多情况下，该技能组合在非正式角色或较小环境中的正式角色中有效，但在当前角色中无效。结果是极端反应，因为个人惊慌并试图获得平衡。根据他的个性，领导者可能被选项瘫痪，无法发挥任何力量，或者他可能只是惊慌并以压倒性的力量回应。\n\
  \n经常，非常薄弱的正式领导会导致组织内部出现“武装”营地，因为派系沿着看不见的界线形成，自然领导者宣称自己的地盘。几年前，玛丽安与一家总部位于硅谷的高科技公司在华盛顿特区的办公室人员互动。理论上，该办公室有人负责，但由于高级领导层几乎在3,000英里之外，这为他提供了长期\n\
  \n与其他科技高管共进午餐，“社交”。办公室分裂成两派：一派专注于游说活动，另一派是销售团队，试图打入联邦市场。双方都坚信自己的活动对维持运营的贡献比对方更大。每一方也都有一个自然领袖——即传达本群体需求、利益和优先事项的人。两个团队位于大楼的不同区域，因此这种分裂不仅是心理上、运作上的，也是物理上的。还有一小群第三类人，由几名行政人员、一名人力资源专员和几个技术支持人员组成，他们只想按时拿到工资，并希望休息室里能有一台好用的微波炉。\n\
  \n总部的 HR 总监听说了这种失调情况，责令这个团队花一天时间到外地做团队建设活动。华盛顿办公室几乎每个人都想请病假，但活动是强制性的。这些活动对促进团队合作毫无帮助，不过这次的失败让\
  \ HR 总监相信，华盛顿特区的最高主管需要换个环境；于是他被拉回硅谷，换上一位经验丰富的领导者，而无论是游说人员还是销售团队都觉得她专横跋扈、难以取悦。\n\n\
  当两个群体不得不面对一个共同敌人时，办公室的分裂开始消解。这位不受欢迎的新老板却因使士气和生产力出现转机而受到总部上级的表扬。讽刺的是，她那缺乏激励性的领导方式竟然大获成功。\n\
  \n试想一下，在一个没有强势领导者、没有自然领袖、也没有强加式领导者的社区，分裂会如何发生。在一个由二十世纪五十年代风格的错层式房屋组成的社区里，大多数居民都是老住户，生活已经形成了一种自然节律。虽然在生活水平和房屋装饰等事情上存在自然领袖，但这个群体并不需要一位强领导者。一对来自山区艺术社区的新夫妇搬了进来，并很快决定用一些色彩装扮他们的新居。在老房子上刷了几层原色之后，新住户欣喜若狂。他们以为新邻居们会认为房屋那些蓝、黄、红的色块，是一种让旧设计焕发新意的有趣方式。\n\
  \n在努力安顿下来的过程中，新夫妇分发传单，邀请新邻居参加派对。有几个人来了，但大多数人没有。来的人中，有一对夫妇认为这个主意很棒但自己绝不会这么做，有几个对这种剧变无动于衷，还有一个直言不讳的反对者。他挺身而出，扮演起自然领袖的角色，主动质问这到底是怎么回事。整个社区陷入了失控。\n\
  \n许多社区契约应运而生，正是为了防止这种混乱。但当一位严苛式、想当邪教领袖的人物站出来时，会发生什么？那就成了社区中的警察国家。街角地块的托尼被非正式地推选为社区契约管理员。他把解读规则当作自己的使命，确保社区里每个人用灌木丛遮住户外的空调机组，还骚扰那些把花园水管放在外面的邻居。托尼过分地炫耀权力，在自己的地盘上作威作福，以显示自己与众不同，因为他在工作中无足轻重。焦虑和沮丧的程度导致邻居们联合起来，罢免了托尼的社区契约执行者职位。托尼是一个强加式领导，但只有当他的选民愿意容忍他的狂热时，他才能坐稳这个位置。强势领导者与令人讨厌、咄咄逼人的领导之间是有区别的。\n\
  \n多莉是一位广受赞誉的艺术家，搬进了一个有契约的社区。尽管她专注于为世界增添任何能激励人心、令人赏心悦目的东西，但她也不得不遵守业主协会（HOA）的规定。一天，一个拿着尺子的男人来到她家，量了她家草地的长度。根据契约条款，草长不能超过两英寸。尽管这个拿尺子的男人很欣赏多莉为她的草坪带来了俏皮而又赏心悦目的景观设计，但他还是被业主协会解雇了。\n\
  \n领导力薄弱的最佳指标是内斗。没有人有能力或远见确立一个共同事业或共同敌人。一个部落中的黑猩猩会定期互相殴打，但一旦敌对部落的黑猩猩出现，所有注意力都会转向殴打它。强领导者会设法让外来的“黑猩猩”成为众矢之的。严苛式领导者往往会成为群体的共同敌人，从而促使团队更加团结。坏处是，交战各方只会为了实现一个目的而停止争斗：那就是扳倒那个敌人。\n\
  \n这两种风格都无法免受可能在真空中演变的个人崇拜的影响，而且两个极端都往往会造成分裂。只是严苛式领导者的分裂需要更长时间才会显现。任何一种领导风格都容易被篡权，也容易让带有马基雅维利式意图的非正式领导者得势。\n\
  \n除非你是个野孩子，否则在你能自己做选择之前，至少一直都有强加式领导。在双亲家庭中，一方往往是纪律执行者（即：严苛式领导），而另一方则是个好说话的人——至少表面看起来如此。在健康的家庭中，父母之间的权力划分是权力共享和利用彼此优势动态的一个很好的例子。\n\
  \n在某些情况下，强加式领导者会在无意中，甚至有意地，把权力交给另一个拥有自然领袖气质且个性更有力的人。这种权力转移发生在从最小到最大的各种组织中。\n\n即使在两口之家中，你也可能同时看到这两种领导者。在一个满是心烦意乱的成年人和蹒跚学步的小孩的房子里，一个聪明理性的青少年可能会成为非正式领导者。由于忙于处理其他问题而陷入瘫痪、不作为，父母把权威让给了这个青少年。或者更糟的是，一个强大的自然领袖个性出现在孩子身上，而父母觉得这很有趣，却不知道如何应对这个早熟的小宝贝。接下来你就知道，父母沦为了孩子自我的侍从。\n\
  \n在职场等人为群体中，大多数人不得不面对一个他们并未选择也无法控制的“头头”（alpha）。这些“头头”不是选举产生的——无论是老板、教皇还是指挥官——但每个人都拥有难以取代的超常权威。在这里，自然领袖同样可能篡夺权力，通过获得被任命的“头头”的认可而发号施令，用一句陆军术语来说，就是“借戴他们的军衔”。\n\
  \n美国军方为这种行为提供了不可否认的例证。军嫂们常常以丈夫的军衔自居。例如，一位军官的妻子可能会把丈夫的下属当作自己的下属来对待。更糟的是，她可能会试图管理丈夫下属的妻子们，仿佛她们是她的下属。这在职场和社交场合都会造成一些异常而复杂的动态。\n\
  \n当一位部队指挥官在工作中领导风格强势，但在家里却管不住时，这种动态会摧毁一个原本团结的单位。士气骤降。\n\n## 影响风格\n\n什么样的领导风格才算好，并没有简单的标准。我们可以说唯一的标准是有效性。即使在军队中，成功的领导风格也各不相同。有些领导者像慈祥的父母，有些则善于操纵。还有一些通过建立联盟来脱颖而出。\n\
  \n### 专制式与民主式\n\n简单来说，这就是*告知*与*征询*的区别。*告知*听起来可能很像强势，但它不一定是一个强领导者的首选风格。一些严苛式管理者会例行公事地征询下属去做他们想做的事——“你愿意多负责一块区域吗？”——并在此过程中通过获得积极成果而建立起庞大的追随者队伍。与此同时，他们也剥夺了那些在该体系中无法成功者的权利。情景通常是这样的：一名员工未能遵从经理的要求。她不仅以迅速而严厉的方式表达失望，还创造了一种使该员工被孤立的环境。“征询”的效果在于，人们常常感到的义务感，远高于领导者直接告诉他们做什么时的义务感。征询式领导者将团队的成果与请求绑定在一起，创造出一种部落式的义务感。这可能是任何人所能运用的最强领导策略之一。\n\
  \n### 公开式与迂回式\n\n高效的领导者可以公开坦诚，也可以像草丛中的蛇一样迂回游走、难以捉摸。思考这两种领导影响风格，并想想它们各自的变体。\n\n-\
  \ *光明正大。* 无论是专制式还是民主式，这种风格的领导者都会直截了当地提出她想要什么。她可能是一个强势或弱势的领导者。\n\n个性，但她对他人的期望却很明确。这种风格的好处是人们知道自己处在什么位置，情况很少会失控。缺点是它制造了大量隐藏的勾心斗角，因为领导者手下的人会想办法来抵消她的有效性。应对她的关键在于要明白，仅仅因为她战术性地告诉你她想要什么，并不意味着她在透露她在战略上试图实现的目标。她仍然可能有一个不可能辨别的宏大计划。她只是不使用诡计来实现它。她公开地提出要求，并接受她总体计划中的每一步。\n\
  \n- **下棋者。** 对这种领导者来说，无论你是下属还是同级，你都是棋盘上的一个棋子。明智的棋手明白，任何人都可以充当位置不当的兵的职能，也可以拥有皇后的致命力量。棋手可能会告诉一些人他的计划，但利用其他人作为阻挡机制来为他的下一步行动做准备。棋手需要用有价值的棋子来保护自己。危险在于，兵可能会觉悟过来，或者内圈的宝贵成员可能会被牺牲。棋手的游戏方法往往会惨败。要想有效，棋手需要相当多的魅力或影响力，或两者兼具。\n\
  \n除了这两种之外，还存在一个宽广的可能性范围。仅就棋手而言就考虑变化：他可能是一个大胆冒险的领导者，也可能与胆怯的棋手不同，后者怯懦地牺牲棋子。他的上位方式也会\n\
  \nthe company.” 对克里斯来说，淘气有时被翻译成“好”。 \n\n淘气领导者的阴暗面表现为一种刻薄的倾向，这可能会让那些他努力保护的人感到恐惧。他们是那些自尊脆弱、对自己能力不确定的人。他让他们保持在规矩之内，因为他们永远不知道他何时会决定讨厌某种情况、回应或个人。\n\
  \n相比之下，善良的领导者不断努力建立桥梁、表达赞赏、提供赋权感，并营造包容的氛围。她践行着职场多元化顾问梅林达·埃普勒所称的*盟友精神*。\n\n> > 盟友精神是关于理解……机会上的不平衡并努力纠正它。盟友精神是真正看到我们身边的人……首先，只是知道他们正在经历什么。然后，帮助他们与我们一起成功和茁壮成长。[^9]\n\

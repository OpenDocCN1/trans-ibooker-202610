  md: 'any of the previous categories that you immediately perceive as positive and
    follow it to the extreme, and you will get the negative. The persistent search
    for a guru turns a curious person into a know-it-all. The zealotry of an earth
    mother will turn her into someone extremely pretentious.


    Clearly seeing each of these for what it is allows you to predict how the person
    will collect, process, and prioritize information. While most people live closer
    to the center of the continuum, those who are close to the edge give you an opportunity
    to nudge them in the direction of someone to which they see themselves diametrically
    opposed—and that push followed by a retrieval may be just what you need to get
    what you want.


    # What Makes Johnny Run?


    What did this person decide to load onto his “system”? Once the programs are loaded,
    where does this person excel? What does he do in a middling way, or where does
    he fall below the norm? Which of these things causes him pride, and which causes
    shame?


    Understanding all the aspects of the character and all the factors that affect
    self-image can tell you why the person behaves the way he does, and where he has
    areas of strength and weaknesses. Once you plot the information about each trait
    on your mental bell curve, you put them together to compose a 3-D image of where
    this person is average or typical, where he falls below the norm, and where he
    stands out above the crowd. This visual representation allows you to define the
    whole person relative to others in the population with which he identifies.


    Let''s look at a well-known celebrity from a distance and talk about what we can
    see without getting close to him.'

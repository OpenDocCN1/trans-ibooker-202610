  md: 'In 1971, psychologist Philip Zimbardo invited a population of healthy, middle-class
    male college students to participate in a two-week study of the effects of prison
    life on the psyche. Arbitrarily, he divided the group of eighteen in half: nine
    guards and nine prisoners. Zimbardo''s team transformed the basement of a building
    on the Stanford University campus into a prison environment, with the added touch
    of planting video and audio recording devices so they could monitor what happened.
    Upon capture the “prisoners” were treated as real prisoners, from hearing their
    Miranda rights to delousing. The “guards” received no special training, but they
    knew their job was to enforce order in the prison and do what they thought was
    necessary to gain the respect of the inmates. While prisoners wore baggy outfits
    that looked like dresses, the guards wore khaki uniforms and sunglasses, and they
    were armed with whistles and billy clubs. Guards worked in three-hour shifts,
    but the prisoners played their parts around the clock.


    Day one passed without incident. On day two, a rebellion broke out. All nine guards
    came on duty and decided to quell the rebellion with force, which began by spraying
    the prisoners with a fire extinguisher to subdue them. The prisoners suffered
    ice burn, which caused pain and chapping, and it was enough to give the guards
    the upper hand. They stripped the prisoners, removed their beds, and threw the
    ringleaders into solitary confinement.


    Day three brought some new tactics by the guards. They split the prisoners emotionally
    and psychologically by singling out three for good behavior and giving them privileges—such
    as food and beds—while denying others any comforts. To prove how much control
    they really had, they switched the good and bad prisoners. The prisoners became
    confused and thought some of them had “turned.” Distrust grew among them. While
    the prisoners became'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'more fractured as a group, the guards bonded. One prisoner cracked so badly
    that he was released from the experiment. Three days later, after prisoners were

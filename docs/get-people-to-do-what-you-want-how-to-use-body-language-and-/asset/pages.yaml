    # Questioning


    You might think of questions like a leash on a dog. In some cases, the leash gently
    links a man and a dog; the leash suggests to the dog where to go. In other cases,
    it gives the man a way to pull the dog in the direction he wants. In another case,
    the man who doesn''t know what he''s doing gets pulled by the dog.


    We sort questions into specific categories: direct, control, repeat, leading,
    compound, canned, negative, and vague. At some point, all of them will be useful
    to you.


    Good questions are easy to understand and use basic interrogatives: who, what,
    when, where, why, how, what else—and when all else fails, “huh?” Good questions
    allow the person to answer in a narrative so you can gather information. When
    your purpose is to corral a conversation, a leading, vague, or compound question
    may be of more use. Questions can be used as steering mechanisms to direct your
    target to a point where you can apply a psychological approach.



    # ## Body Language/Baselining


    A fundamental skill you will need in order to use all the tools in this book effectively
    is *baselining*. Baselining means determining how a person behaves and speaks
    under normal circumstances. Only when you understand what is normal for your target
    can you spot a change.


    What''s normal? In a situation with little or no stress present, people will use
    the vocal tone and cadence, word choices, and movements that are normal *for them*.
    That doesn''t mean what *you* consider normal, or what you think should be normal,
    but what is normal *for them*. Greg can say things such as, “That''s the worst
    example of butt snorkeling I''ve seen this year,” and people in a meeting won''t
    think that''s odd. They''ll think, “That''s Hartley.” If Maryann said that, people
    would think she was (a) drunk, (b) imitating Greg, or (c) extremely nervous. Step
    one in baselining, therefore, is to engage a person in an environment, and in
    a topic, that keeps the exchange relaxed, or at least makes few demands emotionally
    and intellectually. Use nonthreatening questions that start the conversation on
    a relaxed note.


    When you baseline, it''s a deliberate action. You set up a situation in which
    you converse and move with intent. As a result, you gain significant knowledge
    about a person''s behavior, speech patterns, body language, and energy level.
    This baseline gives you a template for using the other tools in the interrogator''s
    tool box. When you see change, you know the other tools are working. By learning'

- pgno: 142
  md: 'The extreme end of the trendy spectrum sees the current opinion as weightier
    than grandma''s. The argument from members of this group is that this generation
    knows more than all past generations—perhaps because of our accumulated knowledge—and
    is, therefore, in a better place to make decisions. Superficially, their focus
    seems to stay on what''s hot right now and adopting the latest trends. In the
    extreme, they think about the long-term outcome of what they are doing today,
    because everyone else is doing the same thing. A trendy activist might (ironically)
    protest tearing down a historic building because every other trendy person has
    it as a priority activity. Behavior such as this provokes the traditionalist to
    ask, “If everyone else jumped from a bridge, would you?”


    Traditional and trendy, then, are more than statements about fashion sense or
    preferences. Trappings such as clothes and decorations illustrate how someone
    sees her role in a particular environment. The traditional person openly declares
    that the past has value, and part of how she demonstrates her own value is by
    carrying on tradition. She is a guardian of history, a promoter of classic looks,
    sounds, and smells. A hardline traditionalist may not be able to get past differentiators
    such as tattoos and tongue studs to connect with a person.


    When taken to the extreme, one begins to look like the other. Taking tradition
    to the extreme can become a trend and negate the original purpose of the movement.
    Few people understand where traditions come from and how convoluted they have
    become. Taking a tradition and following it ad nauseam can result in trendy behavior
    because the supposed tradition is nothing more than a thinly veiled attempt at
    creating a trend. Look to pundits on the far left and right politically to see
    the practical results of this confusion: they both pull out the sacred'

  md: 'Nevertheless, the bond between interrogator and source can occur very quickly.
    It centers on the source''s understanding that the interrogator accepts her on
    some level, no matter how superficial. If language abilities, knowledge of the
    source''s operations, and other “magic” make the interrogator seem unreachable,
    she needs to remind the source of common ground. This does not mean accepting

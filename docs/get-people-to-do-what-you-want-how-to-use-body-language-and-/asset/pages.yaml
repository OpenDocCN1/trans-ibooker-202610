    # ## Conforming Versus Anti-Establishment


    People who conform find comfort in being part of something. They try to fit squarely
    within the group. They may express opinions, but the range will be dictated by
    what falls within a normal range for the group. The idea is similar to national
    party politics: you can have radically different opinions, so long as the rest
    of the party embraces them. These people follow the rules because rules matter;
    they keep the world in order. The resulting insulation is centering.


    For them, a tremendous sense of security emanates from feeling that they are a
    part of something through this behavior, and they bolster that feeling and refine
    their self-image by avoiding any deviation from it. Follow this to its logical
    conclusion: The conformist gets so close to a specific issue that he loses sight
    of the overall picture and'

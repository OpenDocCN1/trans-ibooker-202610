    # Exercise: Debunk the Value


    Distance yourself from demonstration of value and note the effect that it has
    on your relationship with the person. If you can short circuit the value step
    in someone you meet, notice the reduction of their charismatic effect on you.
    Now that you know the steps to charisma, you can use that to control your responses.
    Realize that the more concrete the differentiator, the harder it will be to resist.
    We know people who hated Bill Clinton for his policies, but upon meeting him,
    they were enamored.


    In summary, charisma is not some magical aura residing in the person. It is an
    ability to move others up the hierarchy of needs, quickly manipulating them to
    go from belonging to status. Ultimately, charisma is an effect living in the subject.
    After all, as you leave them with the feeling of having known the X-iest (brightest,
    sexiest, wittiest) person alive, you have given them some value, and they can
    become more charismatic.


    Most people do not exercise skills so they intentionally appear charismatic. Commonly,
    people stumble into a set of processes that gives them the capability to accomplish
    the outcome that you recognize as charisma. This is not necessarily the manifestation
    of some sinister personality streak, but rather an intelligent polishing of a
    process that occurs through time.


    This mechanical cycle, similar to any other process, will require that you refine
    it. You cannot expect to go from ordinary and bland on day one to Bill Clinton
    next week.'

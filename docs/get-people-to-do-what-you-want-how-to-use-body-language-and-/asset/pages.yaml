- pgno: 165
  md: '# The Who and How of Your Target


    Is the person you targeted to influence capable of giving you what you want? If
    not, what is that person capable of in your grand scheme? Help or detriment?


    Once you determine that an individual is capable of fulfilling your desires, you
    can lay out a plan to accomplish your objective. That plan begins with the exercises
    in human modeling to get an understanding of the individual''s core personality
    type, as well as his status in his group. As you progress, you might suddenly
    find he is not the right person to give you what you want, but rather someone
    who is instrumental in getting the right person to do what you want. The modeling
    exercise gives you the information to progress forward in a new direction.


    As you model people, do not wear your dark glasses, or rose-colored glasses, or
    whatever kind of screen that customarily distorts your vision. Projection of intent,
    motivation, and human qualities that are born by need will destroy your ability
    to understand someone. You will be a victim of your own prejudice, stress, and
    emotional baggage if you let these factors filter your perceptions of the person
    you targeted.


    You need to do the same thing in his group. You may have a tendency to inflate
    the value of his group—something such as Mensa, for example—or to ridicule it,
    depending on your point of view. Put that aside, because your assessment of the
    group''s value is not the critical factor: You need to know where your target
    fits in the hierarchy of his group. Someone who reigns as supertypical in an unusual
    environment has achieved success and gives him security: he has met the need for
    belonging, advanced to having a sense of reputation and status, and may even have
    achieved self-actualization. It is'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'those bare-bones factors that give you the information you need to manipulate
    him.


    This phenomenon applies in any context. Whatever it is, the group provides a chance
    for a person to belong, but it also offers opportunities to excel. Your ability
    to model someone depends on looking at her in the context of the group and leaving
    behind your assessment of whether not the group is worth belonging to.


    Once you have collected salient details of your target''s personality and place
    it within the hierarchy, be cautious. Handle that knowledge carefully, or you
    will damage the person''s psyche. To get what you want, you may need to show your
    target that it *can* happen, but it is rarely beneficial to do so.'
  merge: -1
  img_proc: true

    The styles of exercising psychological leverage over someone might be grouped
    into two categories: *intimidating* and *persuading*. The Army lists at least
    fourteen different interrogation approaches, but only the ones that are relevant
    to “normal” personal and professional interactions are broken down here.


    # Intimidating


    +   1. *Direct.* You ask straight questions about what you want to know. This

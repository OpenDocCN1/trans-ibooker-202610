    # Association


    With Maslow''s hierarchy and the matrix of satisfaction in the forefront of your
    mind, you''re going to make some practical use out of your knowledge of why and
    how options to fulfill needs can be limited. First of all, every choice you make
    limits later choices. So if you get baptized Mormon, your chances of becoming
    the Roman Catholic Pope go away. Every association you make, whether with a group,
    a belief, or an action, limits possibilities for your future. Although the tools
    of illustration play into how you apply your knowledge of someone''s affiliations
    or connections, the use of association as a strategy will cause the group to see
    the outsider as more like them and accept him. Or it will do the opposite: they
    will see that the silk purse is just a sow''s ear.


    +   - *Bonding through association.* Through your knowledge of the person, you
    can find common'

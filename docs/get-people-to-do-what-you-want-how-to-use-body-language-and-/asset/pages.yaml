  md: 'encounter this type commonly in the workaday world. He is an archetype; he
    is Cliff the mailman on *Cheers*. This type''s sense of belonging and esteem comes
    from the deference he receives from others for being a font of information. That
    shapes his very identity. In some cases, he doesn''t suffer from intellectual

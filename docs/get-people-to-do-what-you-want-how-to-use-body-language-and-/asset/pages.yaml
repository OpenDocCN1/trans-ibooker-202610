  md: '# CHAPTER 7


    # Mechanics of Bonding and Fracturing


    WHEREAS THE TECHNIQUES of bonding center on finding commonality, the mechanics
    of bonding are ways to create and spotlight that commonality. You might think
    that because the techniques of fracturing center on pinpointing differences, the
    mechanics do that as well. True statement, except that the mechanics to bond or
    fracture fall into the same categories. The outcome you get is a matter of how
    you use these ways of relating to people. Think of each one as a magnet: depending
    on where you point the magnet, it will either attract or repel.


    The categories are:


    +   - Illustration

    +   - Isolation

    +   - Association


    Before we explore those, take a look at some exercises with the 3-D bell, and
    then plunge into a skill set of paring options that you will use with illustration,
    isolation, and association.'

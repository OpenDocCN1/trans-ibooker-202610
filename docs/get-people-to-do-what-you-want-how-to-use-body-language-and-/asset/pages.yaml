    # Human Nature—the Trump Card


    The Jim Jones example provides a perfect segue to another key group dynamic: fragmenting.
    It''s a natural situation in which, even when a persuasive model is operating,
    the group splinters. The more complex the social dynamic, the tougher it is to
    make everyone understand where they belong. Some members become so distanced from
    the big fish that they create subgroups with their own super-typical members.
    (This happens in companies all the time because the CEO or division head is inaccessible
    to most of the workers.) Although we will never know exactly what happened with
    the Peoples Temple cult in Jonestown, Guyana, we do know that the group fragmented.
    Allegations of abuse brought a member of the United States Congress to investigate,
    and the result was tragedy. If everyone in the Peoples Temple bought into Jones''s
    thinking, then Congressman Leo Ryan''s murder would have been prevented and 909
    people would have died by'

    If you tell someone with cockeyed confidence in his facts that he got something
    wrong one of three things will happen. First, he gets defensive and dances around
    the mistake, very likely trying to maneuver you into thinking that you misunderstood.
    Second, he crashes through the floor of the Maslow level he''s on—maybe reputation—and

  md: 'language, or culture, you share about 95 percent of your DNA with chimps.


    You also share a few other attributes. Whether we like it or not, many of our
    most basic drives mirror those of our hairy cousins. Chimps are social creatures
    living in small colonies with a distinct government. The arrangement seems very
    similar to a tribal human government. There is a ruling class not typically “elected,”
    and the other members of the colony understand their place.


    Chimps develop a rhythm to life that is based on deference. An alpha chimp is
    alpha in anything he chooses. Other chimps do not challenge his choice about which
    leaves will be good to nest in: If he is alpha, he can direct the group to nest
    in whatever leaves appeal to him. That primate behavior is just as prevalent in
    humans. Once someone proves herself more intelligent than you in accounting, she
    is likely going to get deference in other areas as well. It''s analogous to Taylor
    Swift''s popularity on Twitter: She can sing and write great songs about old boyfriends,
    so she''s “earned” the deference of 82 million followers on Twitter; who cares
    what she thinks about shopping and politics?


    Think you’re above that? Have you ever deferred to an actor for pain relief advice?
    Or to a musician for guidance on which candidate should sit in the White House?
    There is nothing fundamentally wrong with that model, because we are not cloistered.
    We have access to information about the same issues from other sources. They are
    only preying on our drives from a distance—unless we choose not to access information
    from alternative sources.


    This is the dark side of our exposure to alphas through media. Depending on our
    response to media stars and their messages, we can become cloistered.


    One of the fastest growing branches of the American Psychology Association is
    Division 46, the Media'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Psychology Division, which is devoted to the impact of media on people. A 2006
    article written by Zak Stambor for the American Psychological Association says
    that, with some media experiences, we get hooked as a means to unwind and escape.
    With others, we crave connection. We become oddly “connected” to celebrities and
    to people with whom we share some affinity, even though we are not likely to ever
    meet them.


    To an increasing extent, these virtual connections are shaping our sense of place
    in the world. How we interpret information, our opinions of issues and candidates,
    who is behaving heroically and who is monstrous—media has an impact, and the more
    we let ourselves become media sponges, the more likely it is for us to retreat
    to cloisters of like-minded individuals. Media will “help” us find safe, comfortable
    places in a chaotic world. This is compounded belonging and a new virtual cloister.


    # Morphing Behavior Standards


    When humans are cloistered, and there is no mainstream outside influence to serve
    as a reminder of what''s normal, then normal begins to look more and more like
    what is in the mind of those people on the bell curve who exceed what''s normal—the
    people we call *supertypicals*. Sometimes this group image is distorted by forced
    deference such as violence or threats of violence, but more often it is distorted
    by human nature.


    When collective thought begins to move in the direction of what is normal for
    a supertypical person, he becomes even more of an authority. Wanting to be more
    like him, others in the group continually struggle to emulate the supertypical,
    whose behavior and tastes become the new standard. This action reflects the natural
    drive to differentiate the self from the group and assert one''s own distinction.
    The supertypical rewards this behavior—'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'unless the acolyte attempts to bypass the master, in which case the upstart
    may find himself smacked down a rung on the status ladder. This progression toward
    the group''s standard is viewed as an accomplishment, and it leads directly to
    respect and a feeling of accomplishment.


    This dynamic played out in ugly during the Iraq war; the abuse at Abu Ghraib was
    one of the most notorious. Nobody was around to watch as Charles Graner warped
    his team''s sensibilities. Whatever he considered fair treatment of prisoners
    became normal for the group. A little-known fact is that all military police who
    guard prisoners are reservists. Why? We only need prison guards when we have a
    war. The by-product is that a group of schoolteachers, bank tellers, short-order
    cooks, and electricians may show up to guard prisoners. What if one of them is
    a penitentiary guard in his day job, as Graner was? Imagine the deference right
    out of the gate. Rank aside, he gains the role of informal leader.


    The supertypical people can prey on the two fundamental drives—to belong and to
    differentiate—to get what they want. Many people are uncertain of where they belong
    in a group, or *if* they belong, when in fact they are squarely typical. This
    can come from a bad or misshapen self-image or simple insecurity that creates
    a distorted view regardless of input from the outside. The supertypical helps
    them to feel needed or wanted, and thereby creates a sense of community. The stable,
    well-adjusted leader uses this to create a harmonious team; the unstable or demented
    leader creates an ever-morphing reality that progressively separates adherents
    from society. This negative use of positive tools was a primary mechanism for
    Charles Manson.


    In social media, a common practice is to have a pithy dialogue with “friends”
    and then cast off the “friends” who disagree with a certain point of view. In
    contrast, those'

    # Mechanics of Manipulation


    Bonding and fracturing are the operative concepts in making sure that the needs
    to belong and differentiate are met.


    We should clarify concepts here. The drivers are *belonging* and *differentiating*.
    The tools you use to prey on these most natural of human drives are *bonding*
    and *fracturing*. Think of it this way: Both of them function like a double-edged
    sword—cutting in both directions. This means each can potentially function in
    a positive or negative manner for positive or negative results. Fracturing can
    make someone stand out from the group'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'when she is just a plain Jane, or to drive a wedge between her and the group
    and create a need to draw closer to the group or someone else. Bonding can be
    used to bring the isolated person into a group, or to take the alpha down a notch
    to a plain old monkey.


    Let''s look at one scenario of how someone can manage another person''s journey
    along Maslow''s hierarchy of needs. We will use a Charles Manson-like example
    because his story is so well known.


    Our leader finds a young woman who is different from those around her, someone
    who feels like an outsider. He establishes a place of belonging so that she feels
    nurtured, safe, and protected. The insulation allows him to drive new “family”
    ideas into her head and to show her “the way”—the way to belonging, self-esteem,

    at which she feels comfortable telling you why she is different and important.
    You will recognize it when the opportunity arises. When she can talk about herself,
    you appear magnanimous. This is not difficult, and we will give you active listening
    tools in Chapter 4 in the event your first tries do not yield what you think they
    should.


    # Step 5: Differentiate Your Target


    When he feels comfortable enough to talk to you, it means you have enough rapport
    for him to have a sense of belonging. He has established himself in terms of you
    and him, and he is ready to build on that.


    Humans bleed information when we talk. One of the toughest things to teach a young
    interrogator is how to hide what he is looking for. Preoccupation with our own
    thoughts causes us to drop key words and concepts as we talk about other things.
    So even when asking questions, we often telegraph information that''s running
    though our'

  md: 'complete one. He might also take the opportunity to answer the same question
    by giving you an anecdote about swimming with crocodiles and losing his keys in
    the Congo. On the other end of the spectrum, you might find a well-adjusted earthy
    type giving you a sarcastic answer and asking you why you care.


    Keep your collection effort to typical conversation with two differences. You
    have a mission, and you are the one driving the conversation. These are the steps
    you will follow:


    +   1. Establish rapport.

    +   2. Establish baseline.

    +   3. Understand the threshold.

    +   4. Gather information.

    +   5. Reinforce rapport.


    # Establish Rapport


    This bridge called *rapport* can only join people who have something in common.
    That could be something as simple as age or shared misery with the workplace.
    Or it could be something unique, such as a love of Italian sports cars. All the
    subject will do is serve your desire to start a conversation without it feeling
    contrived.


    # Establish Baseline


    Listen for his stress-free style of word choice, cadence, pitch, and tone. Look
    at his body language and eye movement patterns in casual conversation. Note anything
    that you might consider a glitch that''s normal for him. It could be something
    subtle, such as a certain way of using pauses, or it could be something you find
    decidedly odd, such as focusing to the side of you instead of making eye contact.'

    # Self-Image and Cloistered Groups


    Every group develops a norm, or concept of typical, for its group. This norm can
    be mainstream for the overall culture, or so narrowly focused and bizarre that
    only initiates recognize it. The more open the group to outsiders, the more mainstream
    the group will remain. As a group becomes more cloistered, individuals within
    it'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'gain more power and influence. Cult leaders illustrate this dramatically: Jim
    Jones of the Peoples Temple, Charles Manson of the Manson Family, Marshall Applewhite
    of Heaven''s Gate, and David Koresh of the Branch Davidians. Often these “big
    fish” individuals will distort and convolute the group''s norm so much that by
    the end—which in these cases, was the end of life—none of the others could recognize
    how it happened. The people who fell under their spell described them as charismatic,
    or even divine. One quick look by the rest of us who did not belong to that tribe
    ask one question: What the hell were they thinking? Oddly enough, they were responding
    in the same way Maslow predicted: first by belonging, and then by differentiating.


    They belonged because each of them took part in a group. Whether it offered refuge
    from parents who opposed the hippie way of life, a world that did not understand
    racial harmony, or simply feeling as though they had no peers in the real world,
    each person found a group with ideas and beliefs he or she shared—a place that
    offered comfort.


    They differentiated by following a leader who steadily increased his sway over
    his “family” and skewed the way the group''s norms took shape. By attempting to
    fit in, each person moved further and further from the norms of the society as
    he or she became similar to the others, and even sought to become a favorite child
    to this parental figure. It''s unlikely that any of these people signed up to
    commit mass suicide or multiple homicides, but many of them found themselves doing
    exactly that. One could argue that, by ending their lives and others'' lives so
    dramatically, they were all mentally ill, but other events—some controlled experiments
    and others rooted in common practices—indicate otherwise.'

    Carol checked into a comfortable hotel one Friday evening in 2013. It was not
    a fancy place; it was a low-rise building just off the highway. She drove there
    and took a small bag up the cement stairs to her room at the end of the building.


    Carol covered the mattress with plastic. She penned a letter of apology to the
    maid and left her a $500 tip. Her final letter and will remained in the suitcase.
    Reclining on the bed, she shot herself in the mouth.


    Her action was a dramatic, and dignified, way of conveying a critical message
    about isolation, although it''s safe to say that''s not what she intended. When
    those around do not support your efforts to fulfill your hidden Maslow—even though
    they had no idea what you deeply needed and wanted—the pain can be too intense
    for some people to endure.


    Carol''s story involves a sharply defined moment, but how many of us experience
    isolation and try to address it by accelerating death in socially acceptable ways,
    such as binging on alcohol? When it comes to the experience of isolation, self-awareness
    is more important than awareness of the things that fuel or starve other people''s
    self-image.


    In Carol''s case—as in so many suicides—while her hierarchy need for fulfillment
    appeared to be satisfied externally, it was not internally. She did not taste
    the satisfaction she craved.


    # Illustration



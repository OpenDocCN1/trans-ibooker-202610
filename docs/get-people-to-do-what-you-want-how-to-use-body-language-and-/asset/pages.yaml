    # Regulators


    You can overtly regulate conversation, as many parents do, by putting a finger
    to your lips and doing a zip-the-lips motion, or moving your arm in a big circle
    to indicate “speed it up.” You may also use regulators more subtly by pursing
    your lips when you would like someone to stop talking or nodding vigorously as
    a way of encouraging the person''s words to come out faster.


    # Exercise: Stopper in a Drain


    Watch what people do in a meeting when someone bores them with a retread, whether
    it''s a whole presentation that almost everyone has heard before, or a just a
    piece of one. Some regulators will leak out because people simply cannot help
    themselves: the pen tapping on the table, the finger pressed hard against the
    lips. Others will be quite deliberate: interruption with a question that goes
    off topic, the boss moving his hand across his throat to signal “cut.”


    # Adaptors


    Adaptors are ways to release nervous energy, but there are too many to list even
    in an encyclopedia of body language. Many of the ways people use the body to ease
    discomfort are idiosyncratic, but common adaptors include vigorous rubbing moves
    by men—hands, arms, legs, neck—and'

    # Situation


    You come home and your spouse asks you what you would like to eat. You say you
    would like lemongrass chicken. Unfortunately, you live in a small town in Kansas
    where there is no lemongrass at the supermarket and no Thai restaurant within
    eighty-five miles. In this case, you failed to understand the situation and assess
    what the possibilities are, so the situation pares the options.


    Would you ever drink water with rat feces in it? Of course not. How about cow
    feces? At this point, you think we lost our train of thought even asking that
    question. But what if your only source of water was either a well suffering from
    a rat infestation or a muddy pond where cows hung out? That is precisely the choice
    that Maryann faced in her first Eco-Challenge, a race encompassing more than 376
    miles of spectacular Utah wilderness, much of which also happened to be very,
    very dry. Racers who made it as far as the well and the pond—many did not—all
    faced the same options: 1) use some fabric as a filter as you pour the contaminated
    water into a bottle and add iodine; or 2) go into a state of dehydration and get
    kicked out of the race. About 100 people chose to drink the water. Maryann would

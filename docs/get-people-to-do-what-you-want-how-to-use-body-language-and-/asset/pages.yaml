    # Association


    The art of associating plays on the idea that each choice eliminates another.
    By showing association with one group, you eliminate the ability to bond with
    another. The result is that you narrow a person''s options even further than the
    situation dictated.


    Another insidious form of association relies on your use of the 3-D bell on the
    alpha of that group. You determine where he is inadequate and highlight it. Because
    that alpha enjoys supertypical status in your target''s world, how great can the

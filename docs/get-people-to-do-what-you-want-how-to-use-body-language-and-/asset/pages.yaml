    hospitalized for mental illness. The guards had won total control of the prison,
    and they commanded the blind obedience of each prisoner.


    In psychological terms, the guards'' behavior can be explained with the concept
    of *deindividuation*: a state when a person becomes so submerged in the norms
    of a group that he loses his senses of identity and personal accountability.


    During hazing rituals, fraternities produce an analogous result by leveraging

    # Creating the Bell


    We told you that interrogators collect information with guards, cameras, and microphones,
    but because you don''t have them, you''ll need magic. That magic is the adept
    use of the tools covered in Chapter 4. In this section, you will exercise them
    in building rapport, baselining, and gathering information so you can create that
    3-D bell of your target.


    Apply these techniques inconspicuously. You will get resistance ranging from a
    skeptical look to harsh expletives if you pry and push for information. That means
    you should start your conversation broadly and allow your source to direct which
    questions you ask. Don''t gut your plan at the outset by asking your boss, “So,
    what makes you tick?” or “What really embarrasses you, sir?”


    Your target''s response will be driven by his operating system. If you ask a pretentious
    type what he is most proud of, you can guarantee he will offer an answer—a'

  md: 'common response to people who criticized him was, “Bucky was a genius. You
    wouldn''t understand.”


    When a guru-seeker gets to this point, he begins to understand the world according
    to his guru better than anyone else. In effect, he becomes a sort of demi-guru,
    as he feels justified to enlighten lesser beings. In effect, he can serve as the
    guru''s gatekeeper to ensure that, although the path is wide, the gate is so narrow

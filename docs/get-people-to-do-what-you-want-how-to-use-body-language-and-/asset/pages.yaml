- pgno: 159
  md: 'When you know what is normal, you can see abnormal. As you start the conversation,
    you detect cues in body language and hear clues in his stress of certain words
    about what is important. Using active listening skills founded on his baseline,
    you can know what is a source lead; you follow it and make the conversation flow
    naturally. If you fail to use source leads, your style of follow-up will seem
    wooden. He may suspect that you''re probing, which will trigger an instinct to
    resist.


    # Understand the Threshold


    When you work in the bodyguard business, you are taught to use a technique called
    *threshold braking*. This involves riding your brakes to the point that your car
    is slowing, but there is no perceptible dip to the nose of the car. You learn
    this because it allows you to steer as you brake, which is vital to maintain control
    of the vehicle at all times.


    As you ask questions and follow his leads, think of the threshold-braking metaphor.
    You pay attention to signs that he feels you are probing. You do not want to push
    to the point where you see a reaction. The only way you will be able to spot and
    adjust to mood changes is to ride the brakes with no perception that you are braking.
    If there is an indicator that he is sensing you are doing more than chatting,
    you have to transition immediately to a less-threatening topic. Loop back to something
    innocuous that he mentioned previously.


    # Exercise: Find the Threshold


    You can do this exercise with someone you know well or someone you will never
    see again. Pick a hot topic. Talk to the person in broad terms, and work your
    way toward that hot topic. As you start down the path,'

    on Saturdays and she tells you about her singing gig, you ask about how her husband
    takes that, and she tells you she is recently divorced—a fact she was concealing
    from her coworkers. You may be able to stop right there.


    On a more positive note, through illustration of the superpowers of the rest of
    the group, you can also cause the super-typical to feel rather average. The effect
    is he loses a bit of his bravado, which in turn makes the rest of the group bond
    more closely to him and homogenize him.


    Whether used to bond or homogenize, illustration is a great tool because you are
    using the person''s own words and deeds to establish commonality. Your words can
    never have the power that the words and action of the target do.



    The guru-seeker wants enlightenment from an approved source to claim the validation
    as his own. No amount of knowledge, performance-based achievement, or success
    will give this person the same amount of joy and validation that quoting the Maharaja
    will. He needs to know that what he is saying comes from an enlightened one. The
    danger for this type is that gurus can come from all walks of life and the trustworthiness
    of his guru is dependent upon his selection criteria. The guru may just be a know-it-all
    who has been elevated by deference of others and, by using the snowball effect,
    has leveraged himself to guru status. On the other extreme, if the guru-seeker
    fulfills his needs and gets continuous validation from the Wise Ones he approaches,
    he can get to the point at which he looks down on others who have not shared the
    presence of the guru.


    A practical example of this is an acquaintance of Maryann''s who worked for the

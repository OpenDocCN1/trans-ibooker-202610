    # Control Questions


    Control questions are questions to which you know the answer. In the intelligence
    business, these questions are used to establish whether or not the person is telling
    the truth. Asking “Where were you on Tuesday?” if you know the answer alerts you
    to whether the source will lie to you, or to see what his body language looks
    like when he responds truthfully. The use of control questions is limitless. A
    skilled questioner will use them to redirect conversation or apply pressure to
    the source to create stress and verify veracity.


    # Repeat Questions


    Simply restating or stating the same question in another way is a repeat question.
    Repeat questions are another way to verify whether the source is lying. If she
    gives you different answers each time, she is lying. A sophisticated version of
    this tool slices the question into pieces, which gets at different nuances of
    the answer, and then consolidates the multiple answers to get the whole picture.


    # Leading Questions



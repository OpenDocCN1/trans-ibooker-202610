- pgno: 162
  md: 'There should be no pressure in these exchanges—only information collection.
    These steps are about understanding your target, not manipulating him. As you
    progress through the conversation and ease of it, remember the role of emotion
    in reinforcing rapport. Regardless of how excellently someone plays golf or sings,

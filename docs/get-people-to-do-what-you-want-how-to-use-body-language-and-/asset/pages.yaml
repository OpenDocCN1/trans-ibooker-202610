- pgno: 168
  md: '# CHAPTER 6


    # Bonding and

    Fracturing


    BONDING AND FRACTURING enable you to exploit the two big needs of belonging and
    differentiating.


    In terms of the hierarchy, the need to belong falls just under the need to achieve
    status or reputation; that is, the need to differentiate. Maslow called these
    *esteem needs*. Much of what you will do when you exercise influence, therefore,
    will be to move people up and down the tiers.


    You will find most people stuck between floors on Maslow''s hierarchy. They ascend
    a few stairs and then self-sabotage, which takes them back down. Sometimes another
    person or even a whole group sends them back down by locking the door to the next
    level. This is how interrogators work: they establish control over the ascent
    and descent, as well as the doorway to meeting higher needs.


    The same thing can occur in everyday life as well. People are constantly jockeying
    for position and that is what keeps the world spinning. In this process, people
    are differentiated and displaced. We are showing you how to ensure it happens
    *because* of you and not *to* you.


    The interrogator model is the model for how you will work. Through bonding and
    fracturing techniques, you'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'either reinforce a sense of belonging and further differentiate someone as
    supertypical, or reduce a person''s distinction and place his sense of belonging
    to a group in jeopardy.


    # Talk with Intent


    You begin by simply talking to people—with intent. What you learn in conversation
    will enable you to model your target, grasp the dynamics of the group, and then
    use tactics to bond or fracture. Talking with intent means probing, planting certain
    questions, active listening, and reading body language. It creates the opportunity
    to use psychological keys, such as flattery or criticism.


    When you converse with intent, the first thing that happens is your human interaction
    will deepen. It may sound as though we''re asking you to treat people like zoo
    chimps, but that is exactly opposite from what you should, and need, to do. There
    is nothing inherently wrong with knowing what makes someone tick; in fact, it''s
    the kind of information that marriage counselors try to get clients to reveal
    to each other to improve relationships.


    At the same time, there can be a Machiavellian quality to using the tools. Intelligence
    officers of all stripes use some variation of them to extract information. You
    need to know how that works, too, because as we said at the beginning of this
    book, manipulation is part of the program.


    Many who have served in the US military during wartime have served side by side
    with allied soldiers from other countries. There is closeness with those allies,
    as well as enormous trust. A great deal of information passes between US military
    and foreign allies, but not everything. Regardless of the open relationship, soldiers
    from different nations can be too open. Allies collect information on'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'American operations, and Americans know it. Unless we decide to share a government,
    we will not share certain sensitive information.


    The problem professionals in the intelligence field have encountered is that young
    American soldiers sometimes get so caught up in whom they are talking with that
    they forget what they are talking about. This is the way that spies get information
    from people who should know better. Whether it''s a woman trading sex for secrets
    or a jovial host sharing schnapps with a foreign national, they make you forget
    who they are. They bond with you. After that, they pare your options, which is
    a process we explore in depth in Chapter 7. In brief, after you feel as though
    you belong—you are in the hierarchy to which this person belongs—then that person
    makes you feel special. You are differentiated. You may feel as though he thinks
    you''re the only one worth talking to, or you''re the only one worthy of making
    love to her. After that, it''s a small step to making choices that keep you in
    that person''s company and eliminating options that remove you from that person''s
    company.


    The technique does not sound so exotic when you realize that it happens in offices
    every day. Moving from bonding to putting someone in a compromising position happens
    in sales meetings, board meetings, interviews, client presentations, and myriad
    other business-related activities. You can easily do it with strangers in a business
    environment, sometimes more easily than with people you see on a regular basis.


    Here is how you might launch a conversation with intent, use some key tools to
    model and bond, and then achieve the outcome of finding out information useful
    to a pending negotiation. You show up twenty minutes early for an appointment
    with Bill Smith, a prospective client. Your objective is to find out something
    salient about the'

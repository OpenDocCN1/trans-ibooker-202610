    # Peer-Group Manipulation


    The DLI students who become supporters of the Palestinian cause arrive at that
    state on their own, but a journey like that results from deliberate action when
    you manage the process of making a person feel as though he belongs by becoming
    part of your group. You know that the affectation of belonging rests totally with
    you. But as soon as you pull away, then he has no group to which he belongs. You
    see high school kids do this unintentionally when they decide to hang around with
    the unpopular geek. The geek gets isolated from his own peer group by virtue of
    association with the “cool kids,” and he might even do favors for them unsolicited.
    But when that latter group gets tired of him or simply moves on, he''s left alone
    after making the ultimate sacrifice: his former peer group.


    If you don''t feel as though you belong somewhere, somehow—if you don''t attach
    to at least some of the people around you—you suffer from a crippling estrangement
    from civilized society. Gangs and jihadists prey on people in this situation,
    creating bonds that make people feel valued and necessary. As the process of bonding
    to the group draws them closer to its members, any remaining ties they have to
    family, schoolmates, and others in their day-to-day world are frayed until they
    snap. When the bonding is cemented and fracturing is complete, we can see the

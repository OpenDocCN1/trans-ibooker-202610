- pgno: 179
  md: 'The second scenario is more complicated. It''s the one that field operatives
    use to recruit agents, so you can look at the strategy in both a positive and
    a negative light. First, the negative.


    Why do young people in the US military commonly become supporters of the Palestinian
    cause after they study Arabic at the Defense Language Institute? They are bombarded
    day in and day out with language and culture studies that differentiate them from
    other Americans who cannot understand Arabic and have no exposure to Arab rituals
    and traditions. It''s natural to be drawn to a body of information, and even a
    population, when you know more about them than anyone else. You identify with
    them. It''s a phenomenon that has played out time after time with CIA agents,
    such as former CIA officer Philip Agee defecting to Cuba on moral grounds. If
    you get too close to the enemy, you start to sympathize.


    This is very different from Stockholm syndrome, in which someone who was kidnapped
    or taken hostage begins to sympathize with the captor. This is a phenomenon of
    enculturation. *Lawrence of Arabia* is a largely true story about the battlefield
    enculturation of British officer T. E. Lawrence. He became so entrenched in the
    priorities and values of Arabs rising up against the Ottomans that he held a central
    role in the Arab Revolt, provided advice on military strategy and became a vital
    liaison with the British stationed in the region. Even after the Turks put a high
    price on his head, no Arab would betray him because the Sharif of Mecca had bestowed
    the him the status of “son.”


    Greg''s fluency in Arabic also brought him into close, daily contact with Arab
    cultures and habits, but his experience did not involve a “conversion” of any
    kind. It is possible to adopt mannerisms and habits of people whom you are with
    every day and still not absorb their values.'

  img_proc: true
- pgno: 35
  md: 'Maybe you''re above that on Maslow''s hierarchy of needs and your focus is
    self-actualization. In any case, your self-awareness will help you understand
    the dynamics of your own groups, and where the members sit on the bell curve.
    By analyzing the groups, you hone the analytical tools you need to examine groups
    of which you are not a member, as well as their members.


    Our cited examples also helped you learn about how influence is peddled. If the
    aberrant mind of Jim Jones—a self-proclaimed religious leader who initiated a
    mass suicide—can convince others to do something horrendous with no master plan
    to guide the action, imagine how much simpler it should be for you to implement

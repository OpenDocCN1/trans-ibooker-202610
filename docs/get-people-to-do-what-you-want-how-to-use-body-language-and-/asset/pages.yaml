    will influence your thoughts, actions, and responses, regardless of whether you
    leave before you can crawl. That is, because you have the same DNA, you share
    the same operating system as your blood relatives. You can reprogram and fine-tune,
    but your new upgrades are still running on, and on top of, the same hardware and
    operating system as the rest of your family. It is easy (and convenient) to reject
    this assertion when we are kids, but we can''t do it credibly when we''re older
    because, as we age, we see more and more of our birth parents in the mirror. Many
    mannerisms, and even many thoughts, may be rooted in the biology, rather than
    the nurturing, we receive. We can walk away from all other organizations and erase

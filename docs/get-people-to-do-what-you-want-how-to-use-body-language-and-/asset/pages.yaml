- pgno: 39
  md: 'The reason is an essential factor in getting people to do what you want: the
    need to belong. Due to the ability of QVC employees to track customer purchases,
    when Sally called to order, the people would talk to her as if they knew her.
    They were more like gals from the club than salespeople: “Good to talk to you!
    Where have you been? We missed you!” All true statements, but for dubious reasons.
    Sally was home a lot because she suffered from a debilitating disease, so these
    sales pros were a main connection for conversation and caring. They gave her a
    genuine sense of belonging by knowing her, and they engendered her differentiation
    as she purchased more and more jewelry. When her name popped up on the TV screen
    after she made a purchase, she would be acclaimed as “Sally, one of our favorite
    customers!”


    We are not accusing QVC of predatory practices; we want to make that perfectly
    clear. These people simply do a good job of establishing a bond, a factor by which
    they can measure success. Once bonded, QVC employees help their best customers
    to feel differentiated. In part, eBay thrives because of the same psychology.
    You can quickly become a minor celebrity in the trading game, and you gain acknowledgment
    as such. You also get rah-rah emails that pronounce you a “winner” after making
    a successful purchase.


    You''re a winner because you competed against another person who had money to
    spend and you were able to spend more. Do you feel great about that? Sure you
    do. You belong to an “exclusive” club of savvy bidders. You have what it takes
    to make eBay work for you.


    BMW''s longtime successful marketing strategy links BMW ownership with identification
    to a particular social group. Aside from a brief foray into nonpremium territory,
    BMW has focused consistently on current customers who see themselves as privileged
    and selecting new customers'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'who want to belong to that group. In a manner that bears similarities to QVC,

- pgno: 13
  md: '# CHAPTER 1


    # Shared Needs:

    Belonging and

    Differentiating


    TAKE A MINUTE and ponder what elements of your life you cannot live without. Look
    at the things that make your life valuable—not your latest gadget or miracle cosmetic,
    but the essentials that would leave a marked void if they disappeared. Some go
    without saying, such as your most basic human needs: food, clothing, and shelter.
    In terms of human drives, what is your most basic need—the intangible equivalent
    of food, clothing, and shelter?


    Regardless of whether your personality bends toward introverted or extroverted,
    regardless of whether your feelings about people make you a misanthrope or philanthropist,
    human companionship is a primary driver of human behavior. Companionship can be
    different things to different people, but the premise remains consistent for all
    but the most deviant minds: people need people.


    Maryann and her coauthor Trevor Crow (Mullineaux) began their book Forging Health
    Connections with this fact: “We are built for relationships. The need for connection
    with others permeates the human body.”² The rest of the book was devoted to scientific
    documentation of and guidance on ways people can heal and extend their'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'lives through connection to other people. It is true, whether from the perspective
    of Maslow''s hierarchy of needs or that of a medical doctor: people need people.


    In 1943, psychologist Abraham Maslow introduced his theory on the hierarchy of
    needs in a paper called “A Theory of Human Motivation.” The premise is that, unless
    the lower human needs related to survival and security are met, then an individual
    will not be psychologically equipped to pursue so-called growth needs. The ground
    floor of the pyramid is composed of the biological components we all know: food,
    sleep, and other elements essential to life. One floor up, you find all the things
    that provide safety. Arguably each of these first two levels can be met without
    the need for other people, but the ability to go it alone ends there. On the third
    level, you have the spectrum of intangibles that relate to belonging and love:
    affection, relationships, and camaraderie. Moving up to the fourth level, you
    find esteem needs, such as achievement and reputation; and at the top, self-actualization.


    ![](img/ccd9d9c31a1b4bf629dd84c4b7e079d5_14_0.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Maslow''s theory was that human beings cannot progress to the next tier of
    the hierarchy until the needs below it are met. Twenty-first-century behavioral
    science has criticized Maslow, assigning greater weight than before to the need
    for human connection as a “basic” need. But ask yourself: if you were starving
    to death—not just hungry, but starving to death—would you want a hug or a cookie?


    What we consider achievement and reputation can come only when someone feels as
    though he belongs—that he genuinely connects to other human beings. The personal
    growth and fulfillment associated with self-actualization can only come after
    satisfying the need for achievement and reputation.


    Let''s pause for a minute here, because grasping the hierarchy of human needs
    is the core of the how-to information in this book. The motivation behind a person''s
    choices takes shape according to what lower needs have been met and what higher
    needs remain unfulfilled. Among the most interesting attributes of human behavior
    is that these needs are often more visible from the outside than the inside. Others
    can clearly see things about you that you cannot, but there are exceptions.


    Look at the top tier of self-actualization. How can you see, understand, or manipulate
    another person''s sense of self-actualization? After years of dealing with peoples''
    behavior, we still don''t know how anyone can start to understand what self-actualization
    means for another, especially when so few can define it for themselves. We will
    explore this conundrum later in the book when we look at internal and external
    motivators in self-actualization—essentially, the power of a person''s core principles
    and values versus the power of things like money and power.


    Greg''s background as a battlefield interrogator and instructor in SERE (Survival,
    Evasion, Resistance, and'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Escape) school taught him that interrogators are rarely able to base an interaction
    on grasping a source''s criteria for self-actualization. Interrogators are on
    a schedule. The science of interrogation is about asking questions and getting
    as much information in as little time as possible. The process involves using
    shortcuts to get down to business. To begin, take the interrogator''s approach
    to confronting a person''s progress on the route to self-actualization:


    +   1. Assume the person is not self-actualized. Most people are not.

    +   2. Even if she is, shifting her to one of the lower tiers in the hierarchy
    will change that quickly. When an interrogator mounts a successful attack on someone''s
    reputation, the ensuing campaign to restore that reputation drops the victim to
    the level below actualization. If you want an everyday example, tune in to the
    smear campaigns of a presidential election. Watch the effect of defending a reputation
    that took decades to build. Do you see a different aspect of the otherwise poised
    candidate?

    +   3. If you want to move him even lower on the pyramid, attack his sense of
    belonging. His response as he tries to hold on to this most basic, intangible
    human need is to drop a step down on the hierarchy. If he is masterful, or well
    insulated, his regrounding can be quick, but it allows the manipulator an instant
    to get the upper hand.


    # The Drivers: Belonging and Differentiating'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'The concept of belonging is simple. Everyone needs to feel as though he or
    she has a place in a group, and this does not mean something superficial like
    a plot of land in the suburbs with two kids and an SUV. Fundamentally, it means
    you experience some kind of bond with others. This can range from an impromptu
    group formed to solve a problem to complex fraternal organizations and societies.


    > As you read this, you may be thinking, “I have bonds, but I''m certainly not
    the same as my friends, acquaintances, coworkers, and family members. I''m different.
    Everyone knows that. A lot of them even look up to me for it.”


    You got to that point by belonging. If you were not accepted first, you would
    be a stranger whose differences would have no meaning and carry no interest for
    the group. You would not be a subject of discussion in the same way a member of
    the group would be. Those differences—the identifying traits that you value—are
    called “differentiating factors,” and they are at the heart of both self-esteem
    and esteem from others. It is about accomplishments, reputation, status, and responsibility.
    Regardless of the group, and regardless of what creates the identity of the group,
    belonging followed by differentiating drives the sense of esteem a person gets.
    The kind of differentiating can be as individual as a fingerprint, and it is heavily
    dependent on the person''s self-image, which is highly subjective and volatile.


    # Self-Image


    Frame of reference determines our outlook on the world. The more facts we know
    and the more expansive our experiences, the broader our frame of reference and
    the more completely we see the picture. That frame of reference puts you in the
    picture somewhere, too.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'What do you look like in that picture? You may not have considered how your
    self-image is tied to others. What other people tell you about you affects how
    you see yourself in the frame. In some cases, they expressed an opinion openly,
    but in other cases they merely implied it—or you thought they did. (Your psyche
    will sometimes manufacture other people''s judgments or opinions of you.)


    Start with the physical. Are you taller or shorter than average? For what population?
    We know a woman who is five feet three and tells of a time when she was tall.
    The story is funny because as a child, she was always tall for her age. Later
    in life, when she told friends she was glad she had been gifted with height, people
    burst her bubble. She carried the delusion of being tall well into adulthood.
    How does such a skewed perspective develop? Her self-image developed as she looked
    at the tops of her childhood friends'' heads, and then it hardened because those
    friends never challenged her as they grew and she did not. Her height was never
    a subject of discussion. This same kind of deference occurs on a regular basis
    when someone differentiates himself in a confined environment and creates a superlative
    image in a limited population. You see this phenomenon all the time in small-town
    high schools, where the most gifted football player is small in stature but runs
    fast. As soon as he gets to a college populated by bigger players who outsprint
    him, his self-image takes a beating.


    Maybe you are more attractive or athletic than others in your group. Ask yourself
    what the standard is for your group, and what would happen if your tribe suddenly
    changed? What if you changed jobs and ended up in the Yucatan Peninsula with Mayan
    descendants who top out at about five feet tall? Or if you took your slightly
    plump, tanned body—considered beautiful where you live now—for an extended stay
    in Norway? These examples are a bit'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'extreme, but they highlight that your sense of belonging to a group and being
    distinguished within that group is a relative judgment.


    It applies in terms of achievement, too. Many people become big fish in little
    ponds and become convinced that they are capable of so much more. They move on
    to a larger pond only to find that their differential group has been left behind.
    Suddenly they are no longer better or normal, much less superlative. This new
    set of expectations, whether vocational or social, changes the ground rules.


    # Self-Image and Interrogation—the Extremes


    The science of interrogation is about asking questions and getting as much information
    in as little time as possible (assuming the person cooperates). The art of interrogation
    happens when you apply a set of extreme interpersonal skills so subtly that the
    unskilled observer rarely knows what is going on. Both the interrogator and the
    source are keenly aware of the interchange; it is more stressful for both than
    either will likely encounter in any other situation. This art of interrogation
    relies heavily on managing the person''s self-image.


    In the interrogation business, the euphemism for a cooperative source is a broken
    source. This implies that the interrogation broke her will to resist and she will
    cooperate. A source who “broke on direct” means she answered the questions she
    was asked. No fanfare or manipulation. The mechanics of what makes a person divulge
    sensitive information to her enemy in that manner cannot be overlooked. Consider
    this classic scenario of a captured soldier sent to a compound to face an interrogation.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'When the soldier enters military service, he is indoctrinated and pumped full
    of duty, honor, country, and camaraderie. This system of teamwork, mission, and
    higher purpose insulates him from the thought of what the enemy must be like.
    It is simple: the guy on the other side is the enemy; he is to be destroyed, and
    an interrogator has the power to do it. The soldier''s self-image is manufactured
    and injected into him; regardless of where he fits in the group, he is a soldier.
    He belongs, so now all he needs to do is differentiate. The younger a soldier,
    the easier it is to have him absorb this self-image. Camaraderie, cohesive training,
    good leadership, and proper discipline insulate him and prevent him from needing
    self-examination. He does not need to evaluate whether he is a fool or a wise
    man. It doesn''t matter whether or not he understands his government''s policy
    and it fits his ideology, or that he is serving more than one master. The profile
    is built and reinforced by what it takes to stay alive, stay mission focused,
    and to look out for his team.


    The rituals of his military life play a central role in his decisions and responses.
    Humans are very complex creatures with many “subroutines” running in the background.
    One sure way to short-circuit this is through rituals, rites of passage, and complex
    imagery. It plays out in social clubs and formal organizations like the Masons
    and American Legion, as well as in formal training like the military.


    On a more insidious scale it plays out during informal political rallies like
    the red (Republican) and blue (Democratic) teams in the United States as they
    prepare for ritual “war” with the other party. Watch the news feeds: US political
    rallies often have the imagery of war. The rituals of the party bond people to
    others with whom'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'they have little else in common other than a candidate or a single issue, such
    as immigration.


    You can even see how the pageantry- and image-filled ritual of the Third Reich
    was so fully overwhelming in galvanizing a people who felt oppressed by an “unfair”
    treaty.


    When a soldier is captured, everything turns upside down. He no longer has the
    input to maintain the image of warrior, professional, and noble servant to his
    country. As he sees the enemy for the first time in human terms, he is barraged
    on every front with reality-altering images. The self-image inputs that created
    his role of soldier recede into oblivion. No longer a combatant, he now depends
    on the captor for everything from food and shelter to communication with family.
    The other soldiers from his world are now just as dependent, and the uniforms
    that held so much power before are gone, or worse, they are simply a mocking reminder
    of the earlier self-image. His only contact with someone who speaks his language
    is the interrogator, so prisoners often react to questions to sustain conversation
    and regain some form of stability. A good interrogator starts the conversation
    in such a way that the first question lets him know whether the system has done
    the hard work of “breaking” the prisoner. In wars prior to the 21st century, most
    people—as high as 90 percent—had broken on direct, or simply answered the interrogators
    questions without manipulation.


    People curious about the leverage that interrogators possess discover that they
    are anxiety brokers relying on the fear of the unknown and managing that fear
    to get a desired result. The one unknown that people fear the most is personal
    extinction—and that does not refer to physical death. The personal extinction
    to which we refer is psychological, an aspect of identity similar to self-actualization
    because it is so personal and only the'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'individual knows what defines it. An interrogator''s magic is to find the combination
    of words that engender that fear, and then relieve the fear just as efficiently.


    According to the research done by Maryann and her coauthor Trevor Mullineaux,
    “a battlefield interrogator who wanted to build rapport with a prisoner, for example,
    may have begun the process by making sure he had something to eat and a sense
    that he would not be physically abused.”³


    The food Maryann and Trevor mention isn''t food to eliminate dire hunger; the
    POW isn''t looking for food as much as he is looking for certainty. This certainty
    comes in the form of a morsel or handout.


    Contrast the scenario of the traditional soldier as a prisoner of war with a more
    recent situation involving terrorists. The new enemies of the United States and
    most of the Western world do not seem to break as readily as the soldier in the
    traditional mold. Although the enemy has changed, the tools to break him have
    not. The currently “approved techniques” were derived from a brilliant noncoercive
    interrogator from Nazi Germany named Hanns Scharff. His techniques (which we discuss
    later) are brilliant, but they do not seem to have the desired effect on nontraditional
    combatants. The unsatisfying results are predictable.


    The terrorist has no image built on a group of comrades. Often, he acts independently
    and insulates himself. His self-esteem comes from the fact that he operates clandestinely,
    and his self-image is deeply rooted in the justification for his actions. When
    captured, he faces the enemy as a warrior in the cause of a greater power. He
    sees, often for the first time in his life, the infidel and the experience of
    capture. That assault on his psyche reinforces the self-image honed by his beliefs,
    as well as the image of the Western heathen. The true believer gets'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'further justification; he communicates with his centering authority—or in Western
    terms, he meditates—and the jihadist has his self-image bolstered. There is a
    cliché that says armies fight their last war continuously. By holding a group
    of people who face interrogation with these same tools indefinitely and allowing
    them to recenter, Western powers created the unimaginable: the ascetic jihadist.
    We are not discounting the need for distancing terrorists from their targets;
    rather, the Western world needs a different approach for a new enemy. The effect
    of the current system is to strengthen the self-image of the jihadists and take
    away any chance the interrogator has to broker anxiety by demonstrating his understanding
    of the terrorists'' feelings of personal extinction.


    ISIS fighters might be viewed as somewhere between terrorists operating in cells
    and independently and the cohesive units of soldiers. In the case of ISIS prisoners,
    noncoercive techniques apparently worked in some cases. According to Seth J. Frantzman,
    executive director of the Middle East Center for Reporting and Analysis, interrogators
    have sometimes been surprised at how forthcoming their prisoners are. Frantzman,
    who has been covering ISIS—often as an embedded journalist—since 2015, notes simply:
    “Many of the ISIS fighters and member didn''t appear to think they had committed
    crimes by supporting ISIS.”⁴ They assigned legitimacy to their battlefield activities
    the same way a US soldier might. One key factor: In Frantzman''s experience, they
    felt especially safe with interrogators associated with the Kurdistan Regional
    Government. Their use of noncoercive techniques was in sharp contrast to the style
    of the Iraqis, whose Shi''ite militias were known to torture prisoners and make
    them disappear. They simply didn''t fear execution at the hands of the KRG.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'You will likely never deal with either of these extremes, but consider what
    commonalities exist between the interrogator''s circumstance and yours. When someone
    opposes you and is bolstered by forces, inside or out, you have little chance
    to get her to do what you want. But when that person feels threatened—whether
    the threat occurs because she feels like an outsider, like a nobody in the group,
    or in danger of being supplanted as the alpha—you have a lever. How you apply
    this lever is the art because you will creatively rely on both positive and negative
    levers, depending on the situation and the individual.


    We want to emphasize that it is extremely dangerous to inject poison into someone''s
    self-image. You can push a person to retaliate violently by doing that. If you
    manipulate someone to the point where she feels she has lost her sense of self—that
    is, the point of personal extinction—and you do not know how to manage the situation,
    you can seriously harm her psyche. When interrogators do this, they either pull
    the person out of it and restore her sense of self, or walk away, not caring what
    kind of damage they just inflicted. But daily life is not an interrogation, and
    the outcome is not a life-or-death situation. Used for the right purpose and in
    proper measure, you can get people to do things you want; used incorrectly, these
    tools can result in things you really do not want.


    A parent might choose the “incorrect” way to punish a misbehaving child by taking
    away the one thing in his life that means the most to him—his puppy. In trying
    to manipulate the child to behave, the parent has unwittingly scarred his psyche.


    Brandy Vela''s 2016 suicide spotlights a worst-case situation resulting from toying
    with someone''s self-image. As an overweight, eighteen-year-old girl she endured
    body-'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'shaming from people at her school as well as people using fake Facebook accounts
    to send bullying messages. Brandy changed her phone number and even reported the
    intense bullying to police, who couldn''t trace the messages and were forced to
    wait until a physical confrontation occurred. When the harassment continued, she
    snapped. In front of her parents, Brandy shot herself—the literal expression that
    she had experienced personal extinction.


    When we wrote the original version of this book, suicide was the third leading
    cause of death for people ages fifteen to twenty-four according to the US Centers
    for Disease Control and Prevention. As of this writing, it has risen to the second

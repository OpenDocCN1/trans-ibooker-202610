    **A BRIEF RECAP: KNOWING** what drives a person will give you the foundational
    information for getting what you want. Your first task is to find out where he
    is in terms of belonging and differentiating; that is, where he fits in the hierarchy.
    You have the tools to understand what the possibilities are for him moving up
    in the hierarchy—in most cases better than he can.


    Your range of options takes shape as you decide whether to help him differentiate
    in the group, perhaps raising him to supertypical status or downgrade him to plain
    old Joe. From the moment you make that decision, your entire plan to get what
    you want reflects whether you will move him up or move him down. By *up or down*,
    we do not mean only between tiers but also within a tier. Your target, who is
    barely belonging, has a need to firm up his position. Will you take the approach
    that threatens to remove him from the group entirely unless he cooperates, move
    him squarely into the group in exchange for his cooperation, or a combination
    of the two? Your target, who is fully differentiated to the point of being supertypical,
    has risen above the tier for belonging, and may climb the stairs to'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'self-actualization. Do you take the approach that differentiates him even further—the
    kick-him-upstairs move—or reduce his differentiators by pointing out that the
    emperor''s new clothes are really just skin?


    At this juncture, we can''t tell you what you are likely to choose, because every
    situation will be dependent on what you know about your target—how he views himself
    and the world, his strengths and weaknesses, and where you are in the group. What
    we can tell you is how each tool works in the context of the different strategies:


    +   - Bonding

    +   - Fracturing

    +   - Homogenizing

    +   - Overdifferentiating


    At the same time, we can show you how each of these works in concert with paring
    options, isolation, illustration, and association.


    # Bonding and Homogenizing


    *Bonding* is the positive use of finding commonalities among people. It points
    to the things you have in common, good or bad, and invites someone to come closer
    by suggesting, “You and I are so much alike that I can''t be a threat to you.”
    Even clichés such as “Misery loves company,” “Strength in numbers,” or the feeble
    “Redheads need to stick together” capture this gravitation toward those with whom
    we share some feeling, trait, or cause.


    *Homogenizing* is a negative use of finding the commonalities among people; that
    is, the negative use of bonding. The preacher is no different from the'

  img_proc: true
- pgno: 171
  md: 'character and interests of Bill so that you have some leverage in the meeting.
    You greet his executive assistant with a simple, “I''m really early. Please don''t
    bother him for at least fifteen minutes.” You pick out something that signals
    what''s important to her or what may be a source of pride: “You have a wonderful
    speaking voice. Have you ever been on stage?” That will either get a yes or no,

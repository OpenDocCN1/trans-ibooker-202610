    Through manipulation, skilled interrogators can easily convince sources that,
    in areas where they think they are typical, they fall woefully short of the mark.
    And in areas of pride, they are just typical. You can manage this in three ways:


    +   - Isolation

    +   - Illustration

    +   - Association


    # Isolation


    You do not have to lock your target in a cage. Merely separating the person from
    the support group that props up his self-image will accomplish isolation. For
    example, you accompany the local office Goliath—she has the highest equipment
    sales in the county—to a national sales conference. Although others may know her
    name, it is by no means a household word. If she starts to raise her head in a
    way that undermines your agenda, you can quickly'

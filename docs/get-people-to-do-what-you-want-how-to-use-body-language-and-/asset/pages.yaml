    in daily life. A human resources manager may use fear-up mild with an employee
    caught in an indiscretion: “Will you come clean with me about this? Or would you
    rather discuss it with my boss, who has the authority to fire you on the spot?”


    +   3. *Silence*. Imagine a stage onto which your subject has just been dropped;
    all eyes are on her, and she has no idea what her line is. This is the kind of
    feeling you can create by simply asking a tough question and providing no assistance
    in getting an answer.'

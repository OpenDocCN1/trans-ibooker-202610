    # 2. Snowball effect/groupthink.


    This describes a phenomenon of influence that is most likely to occur when your
    audience is isolated, at least to some degree. Remember that self-image takes
    shape based on input from other people, so distortion of that image can easily
    occur in instances where a group has little outside input. Assume a person demonstrates
    value through contrivance and can influence a faction of a cloistered group. A
    fraternity is a good example—a group that is as cloistered as it wants to be—in
    which one of the guys displays the trappings of wealth that everyone wants: Gucci
    wallet, Prada shirt, Rolex watch.


    Through this display, he then assumes real value to them. Perhaps they see the
    trappings as a sense of style, which could belong to either the natural or cultivated
    categories of demonstrated value. After a while, they accept him as the leader,
    or at least endorse him. When his group accepts new members, or the group socializes
    with other groups, he already has a power base. This power base provides real
    value because he has the admiration of others. He does not have to use the contrivance
    that opened the door for him with the frat brothers. He now has concrete value
    as a stock to trade while humanizing himself. (Few people have the forethought
    to call out that the emperor''s new clothes are phony.)


    This is what Adolf Hitler did when he used the brown-shirts to co-opt a nation.
    These paramilitary men played a major role in Hitler''s rise to power after he
    successfully escalated their perception of his value. In effect, he leveraged

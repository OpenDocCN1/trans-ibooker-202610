- pgno: 205
  md: '# Paring Options: How You Do It


    The SERE school and interrogation simulations for television capture extreme circumstances,
    in which a subject may well plunge all the way down to the bottom level of the
    hierarchy. If anything like that happens in your workplace, then you probably
    have a job in a maximum-security penitentiary.


    Your first step is to plot the bell curve for the person you want to influence.
    Is this person a self-actualized, supertypical person such as the young college
    professor in the simulation we described, or is he struggling to meet needs lower
    in the hierarchy?


    You take someone from a self-actualized place by doing exactly what the interrogators
    did with the college professor: You don''t acknowledge that his differentiator
    demonstrates any value. Instead of Oprah Winfrey the media mogul, you talk to
    Oprah the poor child from Mississippi. You make the person feel as though she
    has to show you she''s more. You manage the person''s state.


    Clingers—those who are uncertain of their place in a group—are fair game and open
    to attack because they are barely hanging on to their status within the group.
    Maryann knows a woman with an accent that can best be described as idiosyncratic
    European; she has never even been outside of the United States, nor does she have
    a family that speaks oddly. Her accent is a source of fascination for some of
    her colleagues who find it amusing that this pretty, smart woman has come up with
    a twisted tongue that''s all her own. Most people in the group feel more marginal
    about it, however, and when one of the relatively unpopular (translate: subtypical)
    people in the group called her on it, it was like he had taken his boot to'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'her head and kicked her down the social ladder. All eyes were on her.


    In a moment, among the people who were present, her eccentricity overtook her
    amusing cuteness. The coworker bounced her down to his subt ypical level. By attacking
    her position in the group, and forcing her to make sudden moves to normalize in
    order to keep her place in the social structure, he effectively did two things:
    He took away her differentiator and forced her to fear for her sense of belonging.
    That split second of personal doubt is the upper hand in interpersonal relations.
    In this situation, he had little to lose, and she little to gain.


    Most of this book relies on skills that you can use to raise or lower someone
    in Maslow''s hierarchy. The best solution is one that causes a person to rise
    because you will be viewed as charismatic and good. If you use this skill set
    associated with paring options, your aim is moving people down the hierarchy.
    Few people—at least not the ones with any self-respect—will respond to you kindly.
    Consider your own reputation and your need to belong. This is not child''s play.


    # Take Him Down


    It''s much easier to pare options as you move people down the levels of the hierarchy
    rather than up. The only options they have left are the ones that will serve the
    needs of the level they are on. If they don''t do what you want them to do, they
    limit options for growth, or worse yet, you push them farther down and their options
    become even narrower.


    By relying on the 3-D model of your target to visualize the whole person relative
    to his world, you will see where his areas of pride are. Understand these areas
    of pride may have nothing to do with belonging to the group'
  merge: -1
  img_proc: true

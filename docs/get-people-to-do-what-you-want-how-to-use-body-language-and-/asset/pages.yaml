  md: 'example of this, just look at the way kids group themselves in high school.


    Our primate cousins in the ape dominion behave this way. The supertypical comprise
    the ruling class with the alpha male by establishing a pecking order in which
    he is king. The others jockey for position. The pack includes the supertypical
    alpha male and alpha female, the masses, and the subtypical, but the last group
    is barely part of the pack. Human beings replicate this model on different scales.


    As a rule, humans emulate the supertypical of their group. Look around at the
    people in your workplace. If your boss—the person able to promote you, endorse
    your plans of action, and authorize a Christmas bonus—wears a suit to the office
    every day, you will probably emulate that style in the hope of boosting her approval
    of you. Does the latest trend started by supertypical Celebrity X spark spin-offs
    in the population, regardless of whether it''s a fashion trend or one related
    to behavior or speech? You may think you are immune, but try to hide from certain
    ubiquitous facts about celebrities that creep into the most serious conversations,
    such as: Tom Cruise is an active member of the Scientology community; Britney
    Spears was taken to a psychiatric facility; Heath Ledger died suddenly at the
    age of twenty-eight. Celebrity watching thrives with a billion-dollar industry
    serving the intellectual curiosity of pop culture geniuses.


    # The New Bell Curve: How Unique Are You?


    Through the ages, experts have developed all kinds of tests to give humans concise
    ways of describing each other. The Myers-Briggs and Big Five systems offer ways
    to characterize personality; emotional intelligence (EQ)'

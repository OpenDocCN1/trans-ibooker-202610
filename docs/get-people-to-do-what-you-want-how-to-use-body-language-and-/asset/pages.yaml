    slang. The holistic bell helps you to understand where to apply levers to fracture
    the man from the group, or bond him and add value to him as a member of the group.


    # Paring Options


    Do not treat paring options like a party game. This is the darkest section of
    this book, and at the very heart of why interrogation is so demanding on practitioners
    as well as prisoners. The only positive related to it is outcome; the skill itself
    remains negative.


    Think of this harshest form of manipulation as a way to force someone to choose
    between two options: bad—what you want him to do that is tied closely to his needs;
    and worse—what he wants to do. The latter is worse because you have structured
    it so that choosing it will move him down the hierarchy of needs. This is why
    we maintain that, by its nature, paring options is a dark art. It is also the
    single most powerful skill a person can learn in influencing human behavior. Do
    not use this casually. Misapplied, the outcomes can be disastrous for you and
    your target.


    In the October 2018 US Supreme Court confirmation hearings related to Judge Brett

- pgno: 199
  md: 'strike her down because her power base and self-image insulators are not around
    her in this setting. A natural way to do it might be to spotlight how small the
    county is.


    You can also make isolation a contrived and premeditated exercise. You might choose
    to set up a meeting at her favorite restaurant. At the last minute, change the
    restaurant to one where everyone knows your name just to set her off balance and
    undercut her self-image. The most powerful effect is to remove any source of self-image
    reinforcement.


    Isolation is a powerful tactic, and when it occurs inadvertently, it can even
    be an insidious killer. It has the power to evoke a sense of personal extinction.


    Inside each one of us lies hidden needs and desires. Let''s call them the “hidden
    Maslow.” Self-image is tied to your hidden Maslow. Because these needs and desires
    may be cocooned inside a person, others may have no clue as to what they might
    be and inadvertently isolate her, causing deep psychic gashes.


    Carol had a reputation for throwing extravagant parties, and they were always
    in honor of someone else. Birthdays, engagement parties, anniversary dinners—she
    had done so many of them over the years that people came to expect them and count
    on her generosity. Throughout her career, she had risen to the top of her profession,
    so she had the money to do over-the-top events; she made more than her ex-husband
    ever had. Her daughters expected fancy weddings and got them.


    Her persistent need was to see other people express joy, but tied to it was seeing
    that joy associated with her. As the years went on, her spoiled daughters gave
    her affection, but never seemed to connect Carol''s generosity with love. Her
    friends did, but she began to doubt their affection. Had she done enough? Did
    they love her for who'

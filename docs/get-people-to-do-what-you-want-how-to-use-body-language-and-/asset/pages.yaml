- pgno: 137
  md: 'begins to differentiate to the point of divergence. At that point, he becomes
    anti-establishment. Some gun-rights activists fit this type. While the right to
    bear arms is sacred to any soldier, it can become so entrenched in some people''s
    psyches that they become the harshest of anti-establishment types.


    Anti-establishment people eschew the rules, think structure is for those with
    no imagination, or believe that there is a better way than what has come to be.
    They believe that, if the right person made the rules, the rules would be better,
    so in effect, they are simply advocating another set of rules. What if they had
    their way and suddenly the rules were different—exactly as they wanted them? When
    anti-establishment types get so caught up in the rules that they start mass movements,
    they cross the line. They move to become the establishment. When they are in charge,
    they become more conservative and conformist in an attempt to hold on to their
    sacred idea.


    When an idealist is the enforcer, he simply cannot imagine that his idea is wrong;
    the problem must be in those who are enforcing it. Look at the great reform movements
    of the 20th century for governmental models of idealist turned conformist. In
    most cases, the definition that comes from being anti-establishment is a dramatic
    attempt to seize power and establish a new order for its own sake. These people
    make great followers for the insidious, aboveboard leader.


    In practical application, you need to understand whether your target conforms
    for her own sake or strikes back when she had no voice in the decision. This understanding
    gives you the opportunity to manage her drives. If she is a conformist and you
    want her to do something, the easiest way is to create a coalition and move her
    along with the room. Coalition building is much easier than direct conflict. By
    altering the group norm, you will easily move'

  md: 'Your starting point for reading body language is the four basic categories
    of moves: illustrators, regulators, adaptors, and barriers.


    # Illustrators


    Body language helps your mouth say what you mean. From punching the air when your
    team scores a touchdown to motioning with your hand and arm how steps wind around
    in a circular staircase, there are innumerable ways you use illustrators.


    Maryann spent Super Bowl XLII with a born-and-bred New Yorker whose arms, legs,
    and voice illustrated exactly how he felt about the Giants'' performance. As you
    go through the other categories of gestures in this section, keep in mind that
    he didn''t show any of them except illustrators: every move spotlighted an emotion.
    Illustrators are the mind punctuating thought; think of them as servants of the
    mind. Look for these to support the words a person is saying. When the two begin
    to diverge, you have an issue.


    This is a great opportunity to appreciate cultural differences, by the way. For
    example, men with a Germanic background tend to use illustrators that are close
    to the body, with arms that stay below the shoulders (typical of what you see
    in the Midwestern United States). But men of Mediterranean or Hispanic heritage
    will comfortably gesture with the arms higher.


    # Exercise: Illustrate Your Feelings


    Ask someone you trust to observe you in conversation. Give that person permission
    to do it without warning, and then listen to what that person says about the way'

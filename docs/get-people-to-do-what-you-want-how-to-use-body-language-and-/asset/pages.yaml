  md: 'petting moves by women, a softer version of the rubbing gestures that men use.
    Other adaptors can be picking at cuticles, foot tapping, and nervous shuffling.
    When you see moves such as these, you know that the person is unconsciously taking
    action to adapt to his environment. As you learn more about using body language,
    you’ll know if seeing adaptors means you are getting the reaction you want, or
    pushing the wrong buttons.


    # ## Exercise: Sit Still for a Change


    Most people have limited awareness of the idiosyncratic things they do to ease

    such degrading and pornographic punishments that the researchers knew normally
    no longer mitigated their behavior.


    > On his website devoted to the prison experiment Zimbardo asks: “How could intelligent,
    mentally healthy, ‘ordinary’ men become perpetrators of evil so quickly?”


    He concluded the following about the fundamental issues of bonding and fracturing:


    By the end of the study, the prisoners were disintegrated, both as a group and
    as individuals. There was no longer any group unity; instead, it was just a bunch

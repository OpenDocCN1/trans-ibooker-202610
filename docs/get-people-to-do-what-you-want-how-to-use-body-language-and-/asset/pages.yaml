    had given them his email address. So the first lesson from Step 2 is: Do not project.
    Open your eyes and look for chances to excel. In some cases, opportunities are
    there, but you have blinded yourself to them. Imagine the outcome if Agent Piro
    had projected onto Saddam. He would have assumed that Saddam found him inconsequential,
    and then dismissed him.


    Your choice of target must reflect some knowledge that the person with whom you

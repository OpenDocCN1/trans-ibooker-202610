    # Act with Intent


    As schemes of influencing human behavior, bonding and fracturing require coordination.
    They sound like opposites, but you will often use them in concert to achieve an
    objective.


    Here is an overview of how bonding and fracturing may play out with your target:


    +   - Bond a person to you.

    +   - Bond a person to the group.

    +   - Fracture the person from you, but bond him to the group.

    +   - Fracture the person from the group, but bond him to you.

    +   - Fracture the person from you and the group.


    The last bullet is not useful in terms of getting someone to do what you want.
    It is the scenario that interrogators scrupulously avoid with a valuable target:
    threaten to pull the rug out from under your source, but never actually do it.
    If you follow through with separating him from everyone, then you are left with
    an individual who has faced personal extinction, and no good has come of the encounter.
    The only exception is if you can artfully reverse the trend and help him to belong
    again, but with a much weaker perception of personal power. This isolation is
    tricky and dangerous work. It can result in horrendous actions by the person who
    feels he has nothing left to lose. We have personally known a few people who have'

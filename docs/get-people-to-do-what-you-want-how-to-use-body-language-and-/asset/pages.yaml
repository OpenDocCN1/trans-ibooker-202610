    # The Landrum Factor


    In codifying the process of paring options, we chose to name the system after
    Don Landrum, the most efficient practitioner of paring options Greg ever met.
    Don was a Vietnam-era special forces soldier, a Green Beret who was one of the
    founding members of the SERE school.


    Greg worked with Don when Greg was in his twenties, so he had a number of years
    to practice and integrate the operational principles he saw Don use. In a nutshell,
    his art was the ability to make people see life as mundane and limited, even when
    it''s not.


    The diagram illustrates that at the heart of the possibilities to fulfill your
    needs and inside the narrowed options based on situation is a very narrow band
    of real—not imagined—possibilities. This band of possibilities is much narrower
    than the original for one simple reason: self-image.'

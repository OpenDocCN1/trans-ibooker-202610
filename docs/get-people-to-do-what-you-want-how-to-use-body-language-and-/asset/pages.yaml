    Humans love to see shooting stars fall back to Earth. Turn on the entertainment
    news; there is a new story about celebrity burnout every day.


    At her lowest point, Lindsay Lohan was a prime example of creating an arena for
    the spectacle of destruction. Build it and they will come. The easiest way to
    get a supertypical to divulge information that proves she is not so super is to
    start a conversation in which she thinks you admire her, and then work your way
    into the details. If you tell her she is grand, and she''s the pretentious type,

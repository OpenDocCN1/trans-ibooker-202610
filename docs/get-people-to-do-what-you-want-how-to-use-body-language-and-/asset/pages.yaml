    # Traditional Versus Trendy


    In the extreme, both traditional and trendy are first cousins to pretentious.
    This has more to do with how people are grounded than what their tastes are. Do
    they need the approval of past heroes to validate their choices, or is the opinion
    of supertypical humans alive today good enough to override the judgment of generations?
    Some people can get caught up in trends and still label themselves *traditional*.
    Social pressure is powerful.


    Sherry touted the everlasting supremacy of classical music. Because it had survived
    for hundreds of years over its contemporaries, she said it was clearly worth more
    than modern music. The counter to this is that anything on Spotify can theoretically
    survive as long.


    Traditionalists trust the known and believe that things have evolved the way they
    have for a reason. Whether they realize it or not, they espouse a belief that
    the accidents of history involving groupthink are more profound than the groupthink
    of today. The outward appearance of the group is to lean on traditional means
    of dress and trappings of authority, to lean toward old ways of doing business,
    etiquette, and eating. When others adopt corporate casual, they stick to the high
    end, wearing starched shirts and slacks instead of khakis and golf shirts.'

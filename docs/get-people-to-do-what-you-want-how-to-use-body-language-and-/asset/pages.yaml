  img_proc: true
- pgno: 36
  md: 'their own hands—but they didn''t. Many of them were also murdered for noncompliance
    or for acts that were overtly threatening to the cult.


    Was it predictable? Fragmenting is always predictable. Whether you are a chimp
    or a human, politics creates fracture. Primatologist Jane Goodall observed this
    kind of fracturing in her years with chimps, too. Even in their relatively simple
    organizational structure, the chimps do not just fall into line and create an
    idyllic Kumbaya-style community with an alpha benevolently ruling until death.
    As in the case of chimp siblings Freud and Frodo, Freud ruled until he suffered
    from mange, and Frodo overthrew him. Frodo ruled harshly, so as soon as he had
    a weak moment, he had to hide from the community that got tired of his ways. Sheldon
    moved in with his own power base and supplanted Frodo.


    Although humans may not be so overtly violent due to our larger and more evolved
    brains, we are proportionately more political, and our political games are just
    as dangerous. Some of the most savage politics in life revolve around a truly
    frustrated person who cannot achieve his true goals, and so he transfers all that
    energy to a surrogate goal. That could range from a benign hobby to serial criminal
    acts.


    In order to apply the skills associated with getting people to do what you want,
    you have to be able to predict these fracture points and take advantage of them
    as well as know the dynamics of belonging and differentiating.


    # The Interrogation Link


    Psychologically speaking, every person has a part of him or her that needs to
    be touched. She may have close friends and family who know a great deal about
    her, but they don''t know everything. If you, a perfect stranger,'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'come along and trigger that person''s need to expose a secret part of herself,
    she will tell you things she''s never told anyone before.


    Engaging a person''s trust through body language, questioning in a way that leads
    her down a path of your design, and application of certain psychological levers
    will motivate that individual to bond with you.


    That''s the positive side. You offer her an opportunity.


    On the negative side, you can use all the same tools to engender a sense of helplessness,
    which is arguably an even more powerful emotion than trust or optimism.


    As the American social philosopher Eric Hoffer (*The True Believer*, 1951) suggested,
    true believers take shape when they confront hopelessness and realize they have
    no option to improve their state unless they trust you (or in the case of religion,
    a pastor, rabbi, or other religious leader). The religious leader provides a model
    to which the fledgling believer cannot equal or compare, and then continues to
    pare options until the true believer emerges; in other words, the person who embraces
    that the only path to success is the way of the leader. The wider the path, the
    narrower the gate.


    Interrogators know this approach to motivation well. It''s the secret weapon.'

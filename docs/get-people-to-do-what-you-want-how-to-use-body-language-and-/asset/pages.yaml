    # Step 2: Recognize Opportunity


    The CPR instructor standing in front of the audience saw the people crowding him
    as nothing more than what he did for a living. He projected onto many well-meaning
    people that they only wanted to talk to him because he had information they needed.
    The fact is that many may have just wanted to say—and some did say—“Good job!”

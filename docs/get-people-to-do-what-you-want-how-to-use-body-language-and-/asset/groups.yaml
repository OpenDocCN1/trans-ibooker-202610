    Read body language to measure how successful you have been using the psychological
    keys and questioning. Use body language to amplify your success. This section
    focuses on the former to prepare you for applying your knowledge of body language
    in a proactive way.


    By reading snapshots of key body language from forehead to toe, you will get a
    sense of the pieces and parts that make up expressions of suspicion, resistance,
    acceptance, and other emotions relevant to getting people to do what you want.
    You need to know, for example, when someone is subconsciously signaling that what
    you are doing has caused her pain; you will have to back off before you can regain
    leverage with her. Critical factors that shape expressions of emotion are energy
    and focus.


    In order to read body language accurately you have to know how and when to pull
    yourself out of the equation. Reading body language involves a paradox when you
    are interacting with someone: It''s all about you and never about you. It''s all
    about you because you provoked a response and need to understand it in order to
    continue the process of bonding or fracturing. It''s never about you because you
    cannot project what a person''s gestures, posture, and vocal characteristics mean
    based on how you express certain emotions. Remember to baseline. You always have
    to keep in mind the unique ways other people, and you, use the body to communicate.
    Sometimes a scratch just means there''s an itch; other times, you''re the figurative
    itch.


    The exception is certain involuntary and universal movements, which convey consistent
    messages. One that you probably see every day is the eyebrow flash signaling,
    "I know you!" or, "I''ve heard that before." Greg saw prisoners of war who denied
    knowing each other do a quick raise of the brows upon seeing each other unexpectedly,
    and it became such a reliable and consistent piece of body language that he codified
    the meaning as a sign of recognition. And we have all seen this on the street,
    in stores, and in meetings, but it is so instinctive, we generally don''t notice
    it. Knowledge of this momentary raising of the eyebrows gives you a distinct advantage
    when you assess which people and ideas someone instantly bonds with.



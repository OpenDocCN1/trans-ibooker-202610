    Of all the groups we''ve covered, these two are the most closely related. At their
    center is the basic belief in the freedom to believe whatever they want to believe.
    Ironically, it takes very few steps to go from open-ended to justified and back
    again. Approaching either of these types unprepared is risky. Use questions to
    explore how the person sees himself. Steer clear of areas in which the person
    has hot spots, except to demonstrate he is irrational and fracture him from the
    group.


    Your ability to peg the operating system gives you the first key piece of information
    you need to get a specific type of person to do what you want.


    If you''re familiar with other systems for describing personalities, you may tend
    to question how these categories—and they are samples, rather than a comprehensive
    list—relate to the Myers-Briggs Type Indicator or the Enneagram system. These
    two standards are both valuable ways of gaining insights into human personality
    by applying certain evaluation criteria. They will tell you something about how
    you relate to the world, as well as to certain situations.


    Our purpose in coming up with this “system” of contrasting types with commonsense
    labels is twofold: 1) to point out how extremes of all kinds eventually come together
    and, therefore, can be very similarly influenced; and 2) to focus the discussion
    on self-image, and the factors that molded it and sustain it.


    In his book *The Power of Risk*, Jim McCormick found evidence from surveys that
    supports this notion of extremes meeting at a point, but he puts it in the context
    of strengths and weaknesses. His *strength/weakness paradox* states: “Our greatest
    strengths and weaknesses are one in the same. All of your strengths have the potential
    to become weaknesses.”¹³ In short, any positive trait, if applied in the extreme,
    can become negative. Take'
  - '[PAGE 146]


    any of the previous categories that you immediately perceive as positive and follow
    it to the extreme, and you will get the negative. The persistent search for a
    guru turns a curious person into a know-it-all. The zealotry of an earth mother
    will turn her into someone extremely pretentious.


    Clearly seeing each of these for what it is allows you to predict how the person
    will collect, process, and prioritize information. While most people live closer
    to the center of the continuum, those who are close to the edge give you an opportunity
    to nudge them in the direction of someone to which they see themselves diametrically
    opposed—and that push followed by a retrieval may be just what you need to get
    what you want.


    # What Makes Johnny Run?


    What did this person decide to load onto his “system”? Once the programs are loaded,
    where does this person excel? What does he do in a middling way, or where does
    he fall below the norm? Which of these things causes him pride, and which causes
    shame?


    Understanding all the aspects of the character and all the factors that affect
    self-image can tell you why the person behaves the way he does, and where he has
    areas of strength and weaknesses. Once you plot the information about each trait
    on your mental bell curve, you put them together to compose a 3-D image of where
    this person is average or typical, where he falls below the norm, and where he
    stands out above the crowd. This visual representation allows you to define the
    whole person relative to others in the population with which he identifies.


    Let''s look at a well-known celebrity from a distance and talk about what we can
    see without getting close to him.'

    instead rebuffs his fans. Hollywood is strewn with the ghosts of celebrities who
    made the ultimate mistake of turning on their admirers before they had enough
    clout to casually blow off the little people.


    In moving someone out of your life, you will learn to use the mechanics of charisma
    to move someone down the hierarchy of needs if you want to take a negative approach,
    or maneuver him up into another peer group if you want to take a positive approach.



    traditions of democracy as sound patterns for action while they laud “change”
    as the only answer to our problems.

    Trends can also become so ubiquitous that they become the tradition; and generations
    later, no one is the wiser. Tattooing as an indicator of individuality has long
    since passed the breaking point with tradition, and now could be seen as a badge
    of belonging instead of a badge of differentiation with society. So we have to
    ask: in two generations, will tattoos on the small of the back be seen as standard
    for old, staid women?


    Secretary of Agriculture Sonny Purdue pulled a traditional phrase out of his Southern
    lexicon during the 2018 elections when, in stumping for the Republican candidate,
    he told the people of Florida that their gubernatorial race was “cotton-pickin''
    important.” This phrase calls to mind a tradition of discrimination against and
    mockery of African Americans, and the Democratic candidate running for office
    was black—not a tradition that anyone should thrust into the spotlight.


    In dealing with either type, keep in mind how each perceives her relationship
    to the organization as she is persecuted as avant guard or respected because she
    is old school, or vice versa. Either extreme affords you a unique opportunity
    to manipulate feelings of belonging and differentiation, but you must first understand
    how the barely belonging eighteen-year-old employee fits before attempting to
    differentiate, or else you will isolate her.


    # Justified Versus Open-Ended


    Justified thinkers and open-ended thinkers are related to traditionalists and
    trendies, and you can probably see how many of these other sample categories show
    similar relationships.


    Justifieds populate the extreme wings of churches and political parties, but they
    show up in companies and insist'

    The people who barely cling to subtypical status within a group find other outlets
    to make themselves special. To differentiate, a person needs to belong. Because
    a person is not fully invested in his workplace group, for example, he finds belonging
    with another group and differentiates as much as he possibly can. Joe is a nobody
    at work, but outside the office, he turns into the trivia champion of the local
    bar or the best bowler at Victory Lanes. This differentiation may be much more
    important than anything at work—at least for now.


    After reaching the pinnacle of success in an organization, people commonly look
    for peers somewhere else. Look around; how many successful people do you know
    who find pastimes to create a sense of belonging? In some cases, these people
    have differentiated themselves so much within the group that they are barely members,
    yet they stay where they are. They are so uncomfortable with leaving the small
    pond for fear of not being typical in a bigger pond that they stagnate. In the
    case of people such as the Heaven''s Gate cult leader, Marshall Applewhite, the
    supertypical creates a new group: a place for the displaced to feel at home.


    # Putting the Dynamic to Work


    You picked up this book to learn how to get others to do what you want, and what
    you know so far is that manipulating human behavior depends on understanding the
    human needs to belong and to differentiate.


    Where do you fit on this continuum? Are you trying to belong? Or does the need
    to differentiate outweigh it?'

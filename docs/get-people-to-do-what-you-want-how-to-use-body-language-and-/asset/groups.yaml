    on something like Lean Six Sigma as the answer to all corporate woes. They are
    people who live in a politically liberal enclave who say, “Just because you''re
    a Republican, you don''t understand this,” or people of a given religion who feel
    so much pity for an atheist that they hound him with Bible verses. The justifieds
    feel as though they have every reason and every right to preach their version
    of correctness—and they often make logic-driven people a little nuts, and very
    angry. You might be thinking of all those justifieds you know and feeling superior
    about your balanced points of view. But think about something that escalates your
    passion every time you think about it, something that you believe contributes
    enormously to the quality of your life. Maybe it''s books. Would you act like
    a justified if the publishing industry suddenly decided that all books should
    be in digital format only?


    Extremely open-ended thinkers have the “anything goes” mentality—no fundamental
    rules to life. Everyone should be allowed to do what they want within the bounds
    of . . . nothing. This group fits the Ayn Rand objectivism model. These people
    believe that the Christian Fundamentalist movement, which has well-defined views
    on homosexuality and children out of wedlock, is skewed and wrong.


    They also point to the intolerance of the whole system, and that things must change
    and people must be allowed to live as they wish. In healthy doses, this means
    liberty with no intervention by religion or government. Unfortunately, the extreme
    expects the government to create a church-limiting process, thereby interfering
    with the beliefs of the religious extreme. When this happens, the government tells
    religions what their dogmatic constraints are. The result of moving so far to
    the open-ended is that the open-ended thinker becomes a justified in the way he
    does business.'

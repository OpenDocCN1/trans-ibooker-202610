    maintain credibility, he allowed Saddam to believe he was a high-level official
    that answered to the president of the United States. In effect, by playing on
    Saddam''s ego, he enhanced his value to Saddam.


    This demonstration of value has to be one that maintains a veil around you. If
    you have nothing but one card trick to offer and you quickly divulge that trick,
    you have missed your opportunity to convey value. However, if you can maintain
    a flirtatious fan-dance approach that hides your many tricks, you have effectively

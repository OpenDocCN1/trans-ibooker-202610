    enemy for the group and drive a more cohesive team. The downside is that the parties
    at war will only stop fighting for one purpose: to sabotage that enemy.


    Neither of these styles is impervious to the cult of personality that can evolve
    in a vacuum, and both extremes have a tendency to create fractures. The Draconian
    leaders'' fractures just take longer to show up. Either leadership style lends
    itself to being usurped, as well as informal leaders with Machiavellian intent.


    Unless you were a feral child, you have had imposed leaders at least until you
    were old enough to choose. In two-parent families, one is often the disciplinarian
    (translate: Draconian leader) while the other is the pushover—or so it appears.
    The division of authority that goes on between the parents in healthy households
    is a good example of power-sharing and using the dynamic of each other''s strengths.


    In some cases, the imposed leader will unwittingly, or even knowingly, give his
    authority to someone else who is a natural leader and a more forceful personality.

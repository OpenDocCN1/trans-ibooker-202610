  - '[PAGE 115]


    the so-called fish gape is a camera-friendly pose; her doing it has “legitimized”
    the look for women who consider her attractive. Done without intent, the look
    still carries a cultural meaning, but it''s as negative as the deliberate version
    is positive. The person with the mouth unintentionally hanging open appears not
    to know anything; it is the look of overwhelming stupidity.


    # Exercise: Name That Emotion


    As you watch a sitcom or soap opera with the sound off, name the emotion that
    the actor is trying to project. We recommend these types of shows because of the
    exaggerated emotions and situations that are often present. They give actors a
    chance to overact, so their facial expressions are more like those of a live theater
    actor projecting to a person twenty-five rows away from the stage.


    # Body and Mood


    You may think you pegged the emotion of the person based on facial expressions,
    but then you see arms or posture that seem to project something different. Here
    are a few common gestures that are either misinterpreted often, or not understood
    for what they really mean:


    +   - **Crossed arms.** In presentations to body language students, as well as
    mixed audiences in all kinds of venues, this is the gesture that people get wrong.
    They generally assume that crossed arms are a barrier; the person doing it is
    closed to you. Sometimes, that''s true. But if you see a receptive face and hear
    openness in the conversation,'
  - '[PAGE 116]


    consider other reasons why someone might have crossed arms, such as:


    +   - They are cold.

    +   - They are hiding hands that are not well-groomed.

    +   - They are overweight or pregnant and using the gesture to hide their middle.

    +   - They are disguising very long arms or very short arms.

    +   - They are asserting a dominant position.

    +   - It is a habit.


    Treat every piece of body language as a part of speech. Keep in mind that you
    probably wouldn’t understand the complete meaning of a sentence if all you saw
    were the verbs.


    +   - **Legs crossed in a figure 4.** Greg had a journalist from *Der Spiegel*
    accuse him of arrogance solely because he tends to sit like this, rather than
    crossing his legs like a proper European gentleman. His legs do not contort into
    the latter position. Her judgment was projecting, which is something you always
    have to curtail when reading body language.


    +   - **Hands clasped in front of genitals.** Also known as the fig-leaf posture,
    we might call it “protecting the precious.” Men of all cultures do it when they
    feel the least bit threatened. Is it possible that they do it when they do not
    feel threatened? Sure, but consider that there are many degrees of threat—some
    of them overt and physical, and some of them subtle and psychological. Women do
    a similar thing when they are stressed by crossing over the'
  - '[PAGE 117]


    <!-- no content -->'
  - '[PAGE 118]


    and fluid illustrators, with hands and arms indicating receptivity. You may even
    notice mirroring of your illustrators, which shows that the person feels in sync
    with your ideas. At the same time you see these positive responses, you also see
    signs of nervousness (that is, adaptors), and feel affirmed that you are engaging
    the person while you have likely established yourself as supertypical in relation
    to him. Watch for nodding and other regulators that convey the message, “Yes,
    keep talking” as further confirmation that you''re winning him over.


    # You Lose


    You are looking for the opposite of the “you win” body language: movements that
    are closed, jerky, bored, and hateful. With someone energized in the wrong direction,
    you may see the artificial smile, obvious use of adaptors that suggest impatience—pen
    tapping, finger rubbing—and gestures that say, “back off” and/or “shut up.” Or
    you might have pushed your target so hard that you see the signs of abject intimidation:
    fig leaf, drooped head, and excessive use of self-punishing adaptors, such as
    cuticle picking. If you have aroused someone to the point at which they attempt
    to get rid of you quickly, you may suddenly see barriers such as crossed arms
    and legs, or the placement of books or a huge vase of flowers between you.


    With the latter type, you see raised brows and hear utterances that indicate questions.
    They make attempts toward openness. With the former, you get more circumspect
    behavior. They might ask you a lot of questions and try to exercise control over
    where you meet and what time you break for lunch—all the while projecting openness
    and receptivity. If you are in a situation that has multiple options for her to
    join sides, look for signs that she is vacillating between you and'
  - '[PAGE 119]


    others. These would include divided attention: focusing on one and then the other,
    sending a hidden signal to each of you, or fleeting smiles at either or both that
    she quickly contains while watching you from the corners of her eyes. In some
    cases, this is calculating; in others, it is unintentional as her squirrel-in-the-road
    brain searches for equilibrium.


    # Undecided . . . or Hit by the Tarantेलlegra Spell


    Some people dodge and weave so ably that you have a hard time figuring out if
    they have normal, predictable responses to *anything*. Some people dodge and weave
    because they have a hard time deciding which direction to go. Their behavior is
    a mild version of Harry Potter''s Tarantелlegra spell, which causes uncontrollable
    dancing. When a person is uncertain, the body and brain struggle for control because
    of fight or flight and the result can appear as a dodgy glitch version of their
    normal behavior.


    Establishing a baseline for the rest of the body can be through simple observation
    of how the person moves, or you can make an exercise out of it, just as you did
    with eye movement. It''s good to start with the exercise so you get some practice
    in watching with intent.


    # Exercise: Observe Movement


    Have your subject sit comfortably, but in a position that allows movement. In
    other words, a cushy couch is not the ideal place. Ask questions that move from
    casual to personal to prying. As questions grow more and more invasive, you should
    notice body changes. Here are sample questions, which obviously should be'
  - '[PAGE 120]


    recontoured depending on the person to whom you''re talking:


    +   1. Where did you go to elementary school?

    +   2. What kind of fun things did you do at recess?

    +   3. Did you ever fight with the kids in your class?

    +   4. Did your teachers ever get down on you for something that wasn''t your
    fault?

    +   5. What was the worst thing any of the kids ever did to you?

    +   6. At some point, you must have done something hurtful to them, too. What
    did you do?

    +   7. Have you done anything similar as an adult that made you feel disgusted
    with yourself?


    You can take a different approach to get the same kind of result. In this case,
    push for more and more details until the person runs out of information. At that
    point, the emotions and the stress will surface.


    +   - *What''s the most exciting thing you''ve ever done?*

    +   - “Skydive.”

    +   - *Why was it so thrilling?*

    +   - “I didn''t think I could do it, but as soon as I did it, I wanted to do
    it again.”

    +   - *Did you have to take a course before you jumped?*

    +   - “We were in a classroom for about two hours and then we got about two hours
    of practical training. Our instructors were really safety conscious.”'

    that should beat her out of the chance to have his undying affection.


    The initial reaction—something that approaches adoration—reflects that part of
    the human psyche that manufactures charisma. Value is in the eyes of the beholder.


    In *The Game*, Neil Strauss recounts the secrets of manipulation he learned during
    an extended foray into the world of pick-up artists. His mentor, Mystery, counseled
    him to effect what we call differentiation; here''s Strauss''s description of
    his early efforts:


    > > I wore stylish jackets with bright shirts and accessorized as much as I could.
    I bought rings, a necklace, and fake piercings. I experimented with cowboy hats,
    feather boas, light-up necklaces, and even sunglasses at night to see which received
    the most attention from women. In my heart, I knew most of these gaudy accouterments
    were tacky, but Mystery''s peacock theory worked. When I wore at least one item
    that stood out, women who were interested in me had an easy way to start a conversation.[^11]

    > >

    > > [^11]: 11



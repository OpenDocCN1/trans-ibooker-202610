    # The New Bell Curve: How Unique Are You?


    Through the ages, experts have developed all kinds of tests to give humans concise
    ways of describing each other. The Myers-Briggs and Big Five systems offer ways
    to characterize personality; emotional intelligence (EQ)'
  - '[PAGE 151]


    tests give you a sense of how well you perceive and handle emotions in relation
    to the rest of the population; and intelligence quotient (IQ) tests supposedly
    tell you how smart you are. All these tests have serious limitations, though.
    For example, intelligence tests evaluate a very narrow band of ability, which
    is why they are almost useless in evaluating someone''s real intelligence. This
    is like evaluating someone on the basis of a series of flat bell curves to determine
    what''s normal. The evaluation has no relationship to what''s normal, only to
    what the norm is for a particular group.


    A person can reach high levels of esteem and a fantastic reputation at work. Another
    person can reach the same levels of esteem during activities that have nothing
    to do with work. The first is the person who has a career, or at least a job,
    that energizes her. She cannot wait to demonstrate day after day how competent
    she is because she loves the work. She may go home to a TV and peanut butter and
    jelly sandwiches every night, or she may go home to a vibrant, loving family.
    The second is the person who makes a living doing job A today and job B tomorrow,
    and then spends evenings and weekends focused on a completely different activity.
    This is the actor working as a waiter, or the competitive skydiver working as
    a barista. How would you know what the other half of the person''s life is like
    unless you know her in both settings?


    If you looked at either of these people in a single dimension, you might see a
    person who is not fulfilled. And you could be very wrong.


    With every person you want to influence, you want more than the information from
    the flat bell curve. You want to ask the questions that reveal depth so that all
    sides of the bell take shape. Your job is to find where they are supertypical
    and stroke their ego. If you are using a negative approach, it is your job to
    find their weak spots'

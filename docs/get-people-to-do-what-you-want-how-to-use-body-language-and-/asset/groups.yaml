    The opposite of charisma is behavioral bad breath—a lazy, obnoxious state that
    repels but does not give a forceful shove. Similar to charisma, you might describe
    it as very difficult to define, or an elusive, even indefinable, personality trait.
    The difference is the trait arouses a sense of distance, not the perception of
    intimacy. Whatever it is, this is not a characteristic you want to achieve, even


    if you want to get rid of someone. Hence, there is no section here on the mechanics
    of the *opposite* of charisma. Although there are plenty of instances in which
    a celebrity seems to operate with anti-charisma. People are drawn to that celebrity

- raw:
  - '[PAGE 51]


    The Army learned from this fiasco and replaced the lieutenant with a seasoned
    sergeant who had done the jobs of the people sitting in the office. He got cooperation
    and respect as soon as he demonstrated the understanding borne of that experience.
    His opening remarks communicated the message, “Give me permission to help you,”
    and that gave people the opening they needed to respect him.


    Maryann once experienced a management situation in which the department head was
    despised by eight of her employees, got along marginally with one, and was friends
    with another.


    The CEO would not get rid of her, however, because she had built strong relationships
    with some powerful clients. The one person with whom she got along marginally
    well took charge as the informal leader and served as the go-between for the employees
    who hated their boss. She carried requests from them to the boss, and transmitted
    orders and answers back to them from the boss. This is how she kept the department
    intact—with the loss of only one staff member—for two years. After the boss left
    of her own accord, the go-between assumed leadership of the department.


    Today, Greg leads change for large corporations that, by mandate and edict, he
    is empowered to change. That power doesn''t make change stick, however. He finds
    that he first needs to go into the organization and listen to the people who carry
    the loads, the people who execute the work. Only after infecting the people who
    make a difference with his vision can he do what he calls “overwhelming the immune
    system of an organization” to make that change stick.


    Some idealistic people who were born yesterday (not you) would assert that the
    freely elected presidents of the United States are formal leaders, but not imposed.
    Think'
  - '[PAGE 52]


    about that idea for a few minutes. The president of the United States is imposed
    on many who disagree with that person being president. Majority rules, so he is
    a leader imposed on the minority. Members of Congress serve the same function
    as the woman who acted as go-between in her department—shuttling demands between
    their constituents who don''t like the current administration, and the current
    administration who thinks, “I''m in the big house now. You have to do it my way.”


    A natural leader can quickly become a formal leader. A historically positive example
    is George Washington. Through the use of charisma, or just plain people skills,
    the natural leader can become the obvious selection for the formal leader. Similar
    to the informal leader who replaced the department manager, sometimes stepping
    up leads to formal authority.


    Throughout history, there are also horrific examples of this, such as Adolph Hitler
    and Charles Manson. However, these are two very different models for informal
    leaders seizing power.


    In one case, an informal leader used his physical or intellectual appeal and charisma
    to get others to see things his way. In fact, through demonstrating his sexual
    prowess and natural hatred for “the man,” Manson established himself as the informal
    leader of his cult-like group. In a group of anti-establishment malcontents, Manson''s
    past incarceration made him supertypical rather than subtypical. As the group
    became more and more established as the Manson Family, he became the de facto
    leader; therefore, he became formally in charge.


    In the other case, Hitler forged connections through his natural leadership and
    rose to power in an insulated group, and then leveraged his power base to national
    authority. Similar to Manson, Hitler spent time in prison for opposing “the man.”
    In the end, the leverage and cult'
  - '[PAGE 53]


    of personality gained him a position of authority in the formal and imposed leadership
    of the country. With a few very Machiavellian moves, Hitler seized power. He then
    exploited the innate tendency of humans to adopt ritual to reinforce a sense of
    belonging. He developed powerful rituals and trappings to tap into and hasten
    the sense of belonging of the German people. The Nazis developed emblems and held
    huge rallies. They took belonging to a new level and tapped into a homogeneous
    society who felt underappreciated and created a sense of pride. Step one: belonging.


    Hitler and Manson are people who understood the power of informal leadership and
    influence. They used that voluntary surrendering of authority as a foot in the
    door to ask for, and get, absolute power over others'' lives. In some cases, the
    request centered on using the absolute authority granted by a small group to enforce
    authority over a larger group. In either case the informal morphed into formal
    and imposed.


    A leader can also be a formal, imposed leader who has the trust and sway with
    the people to whom others would listen even if he were not imposed. These personalities
    come along once in a while in politics, and quickly achieve almost legendary status
    for their impact. Whether you liked their views or not, few people can argue with
    the persuasive power that Ronald Reagan and Bill Clinton held. These two men held
    the public''s attention through two very different styles, but for the same reason:
    personality. Both had their trials with political opponents and their followers,
    but both survived and were reelected by electoral majority. They both continued
    to flourish in arguably the most difficult job in the world. While Reagan and
    Clinton were certainly imposed on the people who opposed them, they took a gracious
    approach to win over those voters as well reach higher approval ratings than'
  - '[PAGE 54]


    votes would have suggested. According to Gallup Poll tallies, they both did an
    exceptional job of maintaining high approval ratings, whereas many other modern
    presidents had some high points and deep plunges.⁸


    People use this same skill set in everyday life. Whether imposed or informal leaders,
    many people will create a cult of personality and use the seemingly inconspicuous
    opportunity as a means to gain increasing levels of authority over others. There
    is an adage that few people ever surrender power, so be very careful to whom you
    surrender yours.


    # Strong or Weak


    Because assessing the strength or weakness of leadership relies on an analog view
    and not a binary one, the concept of either/or does not fit perfectly here. A
    leader''s style falls somewhere on a scale between lifeless and Draconian, stern
    in the style ascribed to Draco, the harsh lawgiver of ancient Athens. Most leaders—at
    least most who stay around for a while—find a style that occupies the middle ground.


    Regardless of how the leader rises to power, strength of leadership plays a role
    in his success. Although it is difficult for the informal leader to seize all
    power immediately, it is not impossible. An informal leader can use sleight of
    hand or overt techniques to capture power from those below and above him in the
    hierarchy. Depending on personal agenda, the informal leader may truly only want
    to represent his people, and will rein himself in accordingly, or he may see the
    opportunity to become a de facto ruler. In the latter case, he leverages the power
    base he created with those he is “helping” to show that he is a factor that cannot
    be overlooked. Hitler used this to great effect in his rise to power. Once the
    informal leader begins to get the power base established'
  - '[PAGE 55]


    with those above him, the power he wields over those he represents becomes more
    formalized. Regardless of whether the leader is formal or informal, the personality
    of the leader will affect how he wields this new power. The informal leader has
    to walk a fine line. Exercise too much authority, and he will be ousted; too little,
    and he will be ineffective. The skill set needed to be an effective informal leader
    is so complex that those who master it are often recognized for their prowess
    and become formal leaders as a matter of natural progression.


    Although informal leaders may be in the role for the fun of it, most formal leaders
    are in it for gain, whether financial or esteem. This means they have more at
    stake than most informal leaders. People say, “The power has gone to his head,”
    but the core truth to which that statement points is much more insidious. When
    a person has more at stake, stress rises. Stress changes the personality style
    of many people, and they go to what has worked in the past, either for them or
    for one of their role models. In many cases, the skill set worked for the person
    in an informal role, or a formal role in a smaller pond, but it is ineffective
    in the current role. The result is an extreme reaction as the person panics and
    tries to gain equilibrium. Depending on his personality, the leader may be paralyzed
    by the options and incapable of flexing any strength, or he may simply panic and
    respond with overwhelming force.


    Often, very weak formal leadership will result in “armed” camps within an organization
    as factions form along invisible lines and natural leaders stake their claims.
    Years ago, Maryann interacted with people in the Washington, DC, office of a high-tech
    company based in Silicon Valley. Theoretically, the office had someone in charge,
    but the fact that senior leadership was nearly 3,000 miles away created an incentive
    for him to take long'

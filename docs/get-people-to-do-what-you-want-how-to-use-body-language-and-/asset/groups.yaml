    alpha of that group. You determine where he is inadequate and highlight it. Because
    that alpha enjoys supertypical status in your target''s world, how great can the
    group be? The person''s association with the group led by this tainted alpha suddenly
    plays as a negative.


    When paring someone''s options, you send the message that he can either follow
    a path to fulfillment that you''ve laid out, or do what he wants with unknown
    consequences. You narrow the choices so that the only way he can belong or continue
    to differentiate is to do what you want, to take the path you chose for him. That
    path has appeal because'

    they have little else in common other than a candidate or a single issue, such
    as immigration.


    You can even see how the pageantry- and image-filled ritual of the Third Reich
    was so fully overwhelming in galvanizing a people who felt oppressed by an “unfair”
    treaty.


    When a soldier is captured, everything turns upside down. He no longer has the
    input to maintain the image of warrior, professional, and noble servant to his
    country. As he sees the enemy for the first time in human terms, he is barraged
    on every front with reality-altering images. The self-image inputs that created
    his role of soldier recede into oblivion. No longer a combatant, he now depends
    on the captor for everything from food and shelter to communication with family.
    The other soldiers from his world are now just as dependent, and the uniforms
    that held so much power before are gone, or worse, they are simply a mocking reminder
    of the earlier self-image. His only contact with someone who speaks his language
    is the interrogator, so prisoners often react to questions to sustain conversation
    and regain some form of stability. A good interrogator starts the conversation
    in such a way that the first question lets him know whether the system has done
    the hard work of “breaking” the prisoner. In wars prior to the 21st century, most
    people—as high as 90 percent—had broken on direct, or simply answered the interrogators
    questions without manipulation.


    People curious about the leverage that interrogators possess discover that they
    are anxiety brokers relying on the fear of the unknown and managing that fear
    to get a desired result. The one unknown that people fear the most is personal
    extinction—and that does not refer to physical death. The personal extinction
    to which we refer is psychological, an aspect of identity similar to self-actualization
    because it is so personal and only the'
  - '[PAGE 22]


    individual knows what defines it. An interrogator''s magic is to find the combination
    of words that engender that fear, and then relieve the fear just as efficiently.


    According to the research done by Maryann and her coauthor Trevor Mullineaux,
    “a battlefield interrogator who wanted to build rapport with a prisoner, for example,
    may have begun the process by making sure he had something to eat and a sense
    that he would not be physically abused.”³


    The food Maryann and Trevor mention isn''t food to eliminate dire hunger; the
    POW isn''t looking for food as much as he is looking for certainty. This certainty
    comes in the form of a morsel or handout.


    Contrast the scenario of the traditional soldier as a prisoner of war with a more
    recent situation involving terrorists. The new enemies of the United States and
    most of the Western world do not seem to break as readily as the soldier in the
    traditional mold. Although the enemy has changed, the tools to break him have
    not. The currently “approved techniques” were derived from a brilliant noncoercive
    interrogator from Nazi Germany named Hanns Scharff. His techniques (which we discuss
    later) are brilliant, but they do not seem to have the desired effect on nontraditional
    combatants. The unsatisfying results are predictable.


    The terrorist has no image built on a group of comrades. Often, he acts independently
    and insulates himself. His self-esteem comes from the fact that he operates clandestinely,
    and his self-image is deeply rooted in the justification for his actions. When
    captured, he faces the enemy as a warrior in the cause of a greater power. He
    sees, often for the first time in his life, the infidel and the experience of
    capture. That assault on his psyche reinforces the self-image honed by his beliefs,
    as well as the image of the Western heathen. The true believer gets'
  - '[PAGE 23]


    further justification; he communicates with his centering authority—or in Western
    terms, he meditates—and the jihadist has his self-image bolstered. There is a
    cliché that says armies fight their last war continuously. By holding a group
    of people who face interrogation with these same tools indefinitely and allowing
    them to recenter, Western powers created the unimaginable: the ascetic jihadist.
    We are not discounting the need for distancing terrorists from their targets;
    rather, the Western world needs a different approach for a new enemy. The effect
    of the current system is to strengthen the self-image of the jihadists and take
    away any chance the interrogator has to broker anxiety by demonstrating his understanding
    of the terrorists'' feelings of personal extinction.


    ISIS fighters might be viewed as somewhere between terrorists operating in cells
    and independently and the cohesive units of soldiers. In the case of ISIS prisoners,
    noncoercive techniques apparently worked in some cases. According to Seth J. Frantzman,
    executive director of the Middle East Center for Reporting and Analysis, interrogators
    have sometimes been surprised at how forthcoming their prisoners are. Frantzman,
    who has been covering ISIS—often as an embedded journalist—since 2015, notes simply:
    “Many of the ISIS fighters and member didn''t appear to think they had committed
    crimes by supporting ISIS.”⁴ They assigned legitimacy to their battlefield activities
    the same way a US soldier might. One key factor: In Frantzman''s experience, they
    felt especially safe with interrogators associated with the Kurdistan Regional
    Government. Their use of noncoercive techniques was in sharp contrast to the style
    of the Iraqis, whose Shi''ite militias were known to torture prisoners and make
    them disappear. They simply didn''t fear execution at the hands of the KRG.'

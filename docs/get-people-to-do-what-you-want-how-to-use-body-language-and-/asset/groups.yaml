    committed suicide—a possible result of an extreme sense of isolation. Most people
    who commit suicide eliminate “belonging” along the way, whether intentionally
    or accidentally. Be careful how you manipulate someone into isolation, even if
    it''s only a temporary effect.


    # The Dynamic of Bonding


    These stories point to the two primary reasons of why people bond:


    +   1. Common enemy

    +   2. Common cause


    The Arab saying “The enemy of my enemy is my friend” points to the number-one
    way to get people to bond: give them a common enemy, whether you find one or create
    one.


    Common cause may have less clarity in people minds, and different people may view
    the cause very differently (democracy), but it still operates as a unifying principle.


    Even if there is no authentic common enemy, by creating artificial stress, you
    can draw someone closer to you. You see this in offices all the time, even if
    the effect lasts only for a single meeting or a single day, when someone points
    out that the boss is in a bad mood.


    Years ago, Greg worked for a guy who had a volatile temperament. On any given
    day, he would reverse his normal behavior patterns and suddenly disagree with
    anything a person said. Greg and his colleagues developed a simple code: Opposite
    Day. The first person to interact with the boss would send a note to the others:
    Opposite Day. The unpredictable, and often disagreeeable, boss unknowingly created
    a bond—one of sanity preservation—among his team members.'
  - '[PAGE 176]


    Here''s a real story, with the name of the lousy teacher changed, which illustrates
    how a common enemy can give life to a common cause.


    The entire class of college-bound students thought Charlie Baldwin was a mean-spirited
    fool. Even the members of the basketball team he coached to a winning season did
    not like being around him. Worse yet, when he tried to teach American history,
    he illustrated that his grasp of any subject other than jump shots and free throws
    put him in the subtypical category among teachers. Within weeks of school starting,
    he emerged as the common enemy of the smart kids—most of whom actually wanted
    to learn American history. In a move that hardened his stature and led to his
    “transfer,” Charlie gave Tom the geek a detention for correcting him on a basic
    fact about the Constitution. Mary, a shy bookworm, blushed as she stood up and
    said, “I will take detention with Tom.” This led to the entire class volunteering
    to take detention with Tom, which led to a sudden rescinding of the order for
    Tom to stay after school.


    This is a microcosmic view of what has happened in civil rights protests, anti-war
    demonstrations, and workers'' strikes. They all had faces of common enemies: a
    man in Ku Klux Klan white, President Richard M. Nixon, Sam Walton. The common
    causes embodied in the vision of a common enemy brought protesters to their feet
    and moved them to focus their anger somewhere specific.


    # Bonding a Person to You


    What binds people together who have nothing more in common than going to the same
    college? It''s not necessarily a matter of common experiences; it''s more likely
    common thinking. You may have had the same negative professor for a physics class,
    and that shared'
  - '[PAGE 177]


    opinion of him would give you a much stronger bond than just sitting in the same
    classroom.


    You can use your knowledge of this to project the image of a person you know someone
    wants to see and relate to. Essentially, through your conversation, you create
    a person who does not exist by bringing forth a role that gives the person something
    familiar to latch onto. Greg once had a dialogue with a reporter who was from
    Youngstown, Ohio. He had never been there, but used to live with a girl who grew
    up in Youngstown. When he mentioned that, the tone of the interview changed markedly
    as the two “shared” perspectives on the challenge that Youngstown faced after
    the collapse of their steel industry.


    The more familiar something is, the more it will evoke particular kinds of responses.
    It could be positive or negative, but when it''s positive it can accelerate the
    bonding process. Every one of us has memories, both factual and emotional, from
    previous relationships and situations, and they are the genesis of prejudices
    of which we may not even be aware. They can manifest themselves in odd ways, such
    as the dislike for an actor because of his teeth, or the desire to be close to
    a person who just happens to look a lot like your favorite elementary school teacher.


    When you perceive that someone is inexplicably drawn toward or repelled by an
    individual or situation, you can use that to either fuel the momentum or put yourself
    between the person and the perceived threat.


    This bonding factor, even as flimsy as it may seem in the example of the reporter
    from Youngstown, can cause people to divulge secrets to a stranger who really
    doesn''t care about them, as opposed to someone they know better who might be
    sensitive to their situation. The assumption is that if they have some particular
    thing in common, it'
  - '[PAGE 178]


    grounds the relationship in a way that makes that person a worthy confidante.


    When Greg was young and had hair, it was red. On more than one occasion, some
    redhead would say (and mean it), “We have to stick together. People don''t like
    redheads.” That is a really lousy attempt to find common ground, but it illustrates
    how thin the connection can be and still have meaning to some people. People will
    grasp at straws when they desperately seek a way to bond.


    Discretion is a sophisticated skill that requires intelligence. When someone blurts
    out a secret or carefully takes you into her confidence, you need the ability
    to respond in a manner that reassures the person that you understand your responsibility.
    At the same time, unless you know the person extremely well, that individual who
    entrusted you with the sensitive information will likely walk on eggshells and
    hope that you don''t tell. That gives you power—power that evaporates the instant
    you do tell.


    In short, common ground leads to a bond, and your discreet respect of the exchanges
    related to that bond glue someone to you.


    # Bonding a Person to the Group


    You could have two different dynamics at work here. First, your target might want
    to bond with the group. If you make that possible for him, he owes you. Or, he
    might have no reason to bond with that group, but you make it necessary or desirable
    for him do so, thereby getting what you want.


    The first scenario involves a classic quid pro quo. When you belong to a group
    where you have influence to get him in, he achieves not only belonging, but also
    status. What he gives you should put you even higher on the hierarchy, maybe something
    that helps you go from enjoying self-esteem to pursuing self-actualization.'

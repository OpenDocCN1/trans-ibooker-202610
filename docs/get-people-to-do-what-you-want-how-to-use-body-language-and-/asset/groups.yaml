    # Glossary


    **Adaptors:** Gestures to release stress and adjust the body as a way to increase
    the comfort level.


    **Barriers:** Postures and gestures we use when we are uncomfortable.


    **Baselining:** Determining how a person behaves and speaks under normal circumstances.


    **Bell curve:** A graphic representation of normal distribution, used in this
    book as a simple model for analyzing a group.


    **Belonging/love:** Needs in the middle of Maslow''s hierarchy. *(See also Hierarchy
    of needs.)* **Bonding:** A way to exploit the two big needs of belonging and differentiating.
    *(See also Fracturing.)* **Compound question:** A question that asks two or more
    questions at once.


    **Control question:** A question to which you know the answer.'
  - '[PAGE 239]


    **Differentiation/esteem:** Needs just above “belonging” in Maslow''s hierarchy.
    (*See also Hierarchy of needs.*) **Fracturing:** A way to exploit the two big
    needs of belonging and differentiating. (*See also Bonding.*) **Hierarchy of needs
    (Maslow''s hierarchy):** Developed by Abraham Maslow to describe five levels of
    needs, from the most basic physiological needs to the highest human need of self-actualization.
    His theory states that one cannot move up to a higher level until the needs of
    the lower levels are met.


    **Illustrators:** Gestures used to punctuate a statement.


    **Landrum Factor:** A way of describing operational principles of paring options
    that was created for this book; the effect of the Landrum Factor is depicted in
    a narrow band of options running through the center of the overlapped hierarchy
    of needs and matrix of fulfillment.


    **Leading question:** A question that projects the answer in the question.


    **Matrix of fulfillment:** Visual system of depicting the phenomenon that states
    the more options that exist, the higher someone progresses on the hierarchy of
    needs; conversely, the fewer that exist, the lower a person is on the hierarchy.'
  - '[PAGE 240]


    **Mechanics of charisma:** System of creating charisma introduced in this book.


    **Personal extinction:** The point at which self-image has been decimated.


    **Prototypical:** A class of person that seems far above normal humanity; Greek
    gods are classic representations.


    **Regulators:** Gestures used to control another person''s speech.


    **Repeat question:** The same question asked in different words.


    **Self-actualization:** A need at the top of Maslow''s hierarchy. (*See also hierarchy
    of needs.*) **Source lead:** Information dropped by someone throughout the conversation
    that the questioner feels there is value in pursuing.


    **Subtypical:** A person or group of people who fall on the left side of the bell
    curve in mapping a group.


    **Supertypical:** A person or group of people who fall on the right side of the
    bell curve in mapping a group.


    **3-D bell curve:** A system of human modeling created for this book; overlaying
    multiple bell curves in a 3-D way; a topographical map of who a person is.'

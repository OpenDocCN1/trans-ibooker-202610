    # Guilty Knowledge


    In addition to the clues that provide insights into the person''s state of mind
    regarding a topic or situation, you also need to apply skills to detect guilty
    knowledge. The phrase makes sense in the context of a criminal investigation,
    in which a suspect might describe elements of a crime scene in ways that only
    the perpetrator would know. For our purposes, a more generic term might be *private
    knowledge.*


    While at a bar in Atlanta, Greg once overheard a woman ask a man who was flirting
    with her to “Say again.” That’s a military way of saying, “Repeat.” After that,
    it was comfortable for Greg to approach her and say, “How long were you in the
    military?” Once something becomes a pattern in your subculture, and you find yourself
    in conversation with people outside it, you give guilty knowledge of being part
    of that subculture.


    While filming *Guantanamo Guidebook* for Channel 4 in England, in the course of
    the simulation, Greg ordered a “guard” to get the prisoners out of their stalls.
    The guilty knowledge in that would be obvious to a small group of people. Interrogators
    might pick up on the fact that he did not say *cages*, which is the term used
    for the prisoners'' cells. Horse people would pick up on the fact that he used
    a term with which they are familiar. An interrogator with any experience in the
    horse world would know immediately that Hartley is a horse man.


    Most people have no idea they are dropping hooks such as these during their conversations.

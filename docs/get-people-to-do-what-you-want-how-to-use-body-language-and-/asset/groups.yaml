  - '[PAGE 59]


    of transfer of power goes on in all kinds of organizations from the smallest to
    the largest.


    Even in a family of two, you can have both types of leaders. A smart, rational
    teenager in a house full of distracted adults and rambling toddlers could emerge
    as the informal leader. Through inaction due to paralysis that is caused by dealing
    with other issues, the parent surrenders authority to the adolescent. Or worse,
    a strong natural leader personality emerges in the child of a parent who finds
    it amusing but does not know how to handle the precocious little bundle of joy.
    The next thing you know the parent is in the role of tender to the ego of the
    child.


    In artificial groups such as the workplace, most people have to deal with an alpha
    whom they did not select and over whom they have no control. These alphas were
    not elected—the boss, the Pope, or the commanding officer—but each one has an
    unnatural amount of authority that is hard to supplant. Here, too, the natural
    leader may usurp authority and hold court by getting the blessing of the appointed
    alphas and, to use an Army term, “wearing their stripes.”


    The United States military offers an undeniable illustration of this kind of behavior.
    Army wives often assume the rank of their husbands. The wife of an officer, for
    example, may treat the husband''s subordinates as if they were her own. Worse
    yet, she may try to manage the wives of her husband''s subordinates as if they
    were her subordinates. This creates some unusual and complex dynamics, both in
    the workplace and in social settings.


    When a unit commander is strong in his leadership style at work but not so in
    charge at home, the dynamic can destroy an otherwise cohesive unit. Morale plummets.


    # # Styles of Influence'
  - '[PAGE 60]


    There are no simple criteria for what constitutes a good leadership style. We
    could argue the only criterion is effectiveness. Even in the military, successful
    leadership styles vary. Some leaders are benignly parental, others manipulative.
    Yet others distinguish themselves through coalition building.


    # Authoritarian Versus Democratic


    In simple terms, this is *telling* versus *asking*. *Telling* may sound a lot
    like strength, but it is not necessarily the style of choice for a strong leader.
    Some Draconian managers routinely ask people to do what they want—“How would you
    like to take on an extra territory?”—and in the process create a tremendous following
    by getting positive outcomes. At the same time, they disenfranchise those who
    do not succeed in that system. The scenario plays out like this: An employee fails
    to comply with a manager''s request. Not only does she express her disappointment
    in a swift and severe fashion, but she also creates an environment in which the
    person is ostracized. The effect of asking is that people often feel obligated
    on a much higher level than when the leader tells them what to do. The leader
    who asks is tying the outcome of the group to the request and creating a feeling
    of tribal obligation. That can be one of the strongest leadership tactics anyone
    can exercise.


    # Open Versus Maneuvering


    Effective leaders can be open and straightforward, or maneuvering like a snake
    in the grass and difficult to discern. Consider these two styles of leadership
    influence and think of the variations on them.


    +   - *Above-board.* Whether authoritarian or democratic, this style of leader
    asks for what she wants up front. She may be a strong or weak'

    Carol had a reputation for throwing extravagant parties, and they were always
    in honor of someone else. Birthdays, engagement parties, anniversary dinners—she
    had done so many of them over the years that people came to expect them and count
    on her generosity. Throughout her career, she had risen to the top of her profession,
    so she had the money to do over-the-top events; she made more than her ex-husband
    ever had. Her daughters expected fancy weddings and got them.



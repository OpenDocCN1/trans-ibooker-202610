    or extremes of behavior, it may have occurred to you that something is missing.
    These are people like John F. Kennedy and Princess Diana on a grand scale, and
    someone for whom you had huge admiration in your community or even your family,
    but thought they were out of reach.


    You might think that you do not know anyone personally who fits this description,
    but that''s probably not true. Did you know anyone in high school who you felt
    was destined for greatness? Someone whose success did not bother you? In other
    words, that person was not your rival, but somewhere above being your rival? You
    may have no idea where that person is today, but your positive memory of

    her is sacrosanct. All of us have known people like that at different phases of
    our lives, and in different positions. It''s almost as though they are a different
    breed of human.


    These are the prototypicals. Once a person becomes prototypical, she is not part
    of the culture anymore. You would never put her in your class. She is like a new
    class of being: human, but not human in the way the rest of us are.


    The Greek gods are classic representations of the prototypical. They are people,
    just a different class of people. According to mythology, they manifested pettiness,
    anger, irrational behavior, romantic love, and lust just like humans, yet they
    had superhuman powers that made them worthy of an empire''s adoration. What''s
    the difference between them and Princess Diana? Not much.


    We have a constant need to look for figures who are better than us, but a persistent
    need for those people to be one of us. We look for ways to bond to them. The more
    prototypical they are, the less we rejoice in their destruction. And yet, as we''ve
    observed with many heroes of recent times, it is possible to have such a fall
    from grace that the prototypical status can never be regained.


    One example of that is O. J. Simpson—from football star and movie star to the
    possible owner of a bloody glove—although Michael Jackson, Elizabeth Taylor, and
    Bill Cosby are also good examples. Elizabeth Taylor was Hollywood royalty until
    she married Senator John Warner. Attending political fundraisers instead of the
    Academy Awards knocked her down a few notches in the eyes of some Americans. Michael
    Jackson never stopped being a musical genius, but when allegations flourished
    that his genius was accompanied by perversion, his stature also plummeted. Bill
    Cosby, TV''s archetypal family man who made Coogi sweaters cool, is now living
    in infamy as a sexual predator.


    When prototypicals such as this fall, those who viewed them as an almost godlike
    figure are likely to go through stages of grief. Elisabeth Kübler-Ross described
    this in her book *On Death and Dying*. Why do people care about the fate of someone
    like O. J. Simpson—as though it is a form of death? We do not want them to fall
    because, if they do, what can happen to us? When someone like O. J. Simpson goes
    through a series of legal traumas and shameful behavior, we feel “wrong” because
    we have been worshipping the wrong “god.”


    The social dynamic that involves a prototypical person differs from that of “normal”
    people. For example, the fearless leader of your company who commands respect
    by walking into the room may have a lousy golf game. The fact that he shoots three
    times his age does not bother him in the least, though.


    He has nothing to prove, and he will continue to command respect—even on the golf
    course—just because his persona is that of a prototypical person.


    You are probably thinking, “Life must be sweet if you''re prototypical.” Not nearly.
    You still have the basic human need for peers, only you find yourself surrounded
    by people who see you as peerless. That can be an incredibly vulnerable position,
    as many prototypical people who forged questionable relationships have demonstrated
    with disastrous, exploitive marriages and business partnerships.


    No matter where the person is on the bell curve, if you use a negative approach
    to get what you want, the key question is: How do I make that person feel as though
    he is losing his grasp on belonging? The belonging could be his company, club,
    circle of friends, or even family. It''s not even belonging in an absolute sense.
    It''s belonging in the sense of what he perceives his role to be in that group.


    ## The Who and How of Your Target


    Is the person you targeted to influence capable of giving you what you want? If
    not, what is that person capable of in your grand scheme? Help or detriment?


    Once you determine that an individual is capable of fulfilling your desires, you
    can lay out a plan to accomplish your objective. That plan begins with the exercises
    in human modeling to get an understanding of the individual''s core personality
    type, as well as his status in his group. As you progress, you might suddenly
    find he is not the right person to give you what you want, but rather someone
    who is instrumental in getting the right person to do what you want. The modeling
    exercise gives you the information to progress forward in a new direction.


    As you model people, do not wear your dark glasses, or rose-colored glasses, or
    whatever kind of screen that customarily distorts your vision. Projection of intent,
    motivation, and human qualities that are born by need will destroy your ability
    to understand someone. You will be a victim of your own prejudice, stress, and
    emotional baggage if you let these factors filter your perceptions of the person
    you targeted.



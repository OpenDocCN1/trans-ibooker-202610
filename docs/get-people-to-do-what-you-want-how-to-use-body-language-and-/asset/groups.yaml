    \nGreg 为主要的有线电视和网络电视提供了专家分析，特别是 CNN 和 Fox News，以及国家公共广播电台和《华盛顿邮报》和《费城问询报》等主流印刷媒体。重要的外国媒体如《明镜周刊》和\
    \ BBC 世界也依赖他的评论。Greg 在《美国周刊》、《Money》、《Spin》和《柯梦波丹》等刊物上发表评论，谈论人们的行为。\n\nGreg 利用他对人性的了解作为商业转型专业人士，拥有将大型跨国公司转变为期望的最终状态并使其保持不变的成功记录。\n\
    \nGreg 与 Maryann Karinch 合著了十本关于人类行为的书籍。\n\nMARYANN KARINCH 是三十本书的作者，其中十本与 Greg\
    \ Hartley 合著，分别是 *How to Spot a Liar*（Career Press，2005 年和 2012 年修订版）、*I Can Read\
    \ You Like a Book*（Career Press，2007 年）、*The Date Decoder*（Adams Media，2008 年）、*How\
    \ to Be an Expert on Anything in Two Hours*（AMACOM，2008 年）、*Get People to Do What\
    \ You Want*（Career Press，2008 年）、*The Body Language Handbook*（Career Press，2010\
    \ 年）、*The Most Dangerous Business Book You'll Ever Read*（John Wiley & Sons，2011\
    \ 年）和 *The Art of Body Talk*（Career Press，2017 年）。\n\nMaryann 经常与需要专门培训的人际管理技能的听众分享她的专业知识。\n\
    \n2004 年，Maryann 创立了 The Rudy Agency，一家专门从事非小说类文学的文学代理机构。职业生涯早期，她曾管理一家专业剧院，并在华盛顿特区为艺术和教育项目筹集资金。她在华盛顿特区的天主教大学获得了演讲和戏剧的学士和硕士学位。\n\
    \n## 一名前陆军审讯员分享他如何随时随地从任何人那里获得想要的东西的秘密。\n\n在商业、学校、浪漫或邻里中，了解什么吸引人、什么排斥人以及人们如何运作是有价值的。选择正确的方法将使你能够在专业和社交场合影响人们做你想要的事情。作者包括了这种技术如何创造好消息和坏消息的案例研究。最重要的是，他们告诉你如何识别和防范操纵，以便你保持对自己的选择和选择的控制。\n\
    \n## 吸引\n你想要的\n人们\n并摆脱\n你不想要的\n人！\n\n在《让人们做你想让他们做的事》中，你将了解以下内容：\n\n- 一对一互动\n-\
    \ 群体动态\n- 领导力的投射\n- 对他人的本能信任与不信任\n\n《让人们做你想让他们做的事》是戴尔·卡耐基 1937 年经典著作的完美现代补充。把它们看作是说服的旧约和新约。\n\
    \n![](img/ccd9d9c31a1b4bf629dd84c4b7e079d5_268_0.png)\n\nGregory Hartley 的审讯员专业知识首先为他赢得了美国陆军的荣誉。最近，它吸引了诸如国防情报局、海豹突击队和联邦执法机构等组织寻求他对疑似恐怖分子——以及名人——在回答棘手问题时真正意味着什么的见解。他是关于肢体语言和行为的十本书的作者。\n\
    \n![](img/ccd9d9c31a1b4bf629dd84c4b7e079d5_268_1.png)\n\nMaryann Karinch 是十九本书的作者，包括\
    \ *How to Spot a Liar*、*The Body Language Handbook*、*Control the Conversation*、*Nothing\
    \ But the Truth* 和 *The Art of Body Talk*。她是位于科罗拉多州埃斯特斯公园的 Rudy Agency 的创始人，一家文学代理机构。访问她的网站\
    \ www.karinch.com。\n\n"

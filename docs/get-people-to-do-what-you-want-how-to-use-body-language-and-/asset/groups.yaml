    amount of charisma or clout, or both.


    A broad band of possibilities exists in addition to these two. Consider the variations
    with just the chess player: he may be an aggressive leader who takes bold risks,
    or he will differ from the spineless chess player who sacrifices pieces timidly.
    The method of his rise to power will also


    the company.” For Chris, naughty sometimes translated as “nice.”


    The dark side of a naughty leader presents itself in the form of a mean streak
    that can arouse fear in some of the very people he works hard to protect. They
    are the people with fragile self-esteem and uncertainty about their competence.
    He keeps them in line because they never know when he might decide he dislikes
    a situation, response, or individual.


    In contrast, the nice leader strives constantly to build bridges, convey accolades,
    offer a sense of empowerment, and create an atmosphere of inclusion. She practices
    what workplace diversity consultant Melinda Epler calls *allyship*.


    > > Allyship is about understanding . . . imbalance in opportunity and working
    to correct it. Allyship is really seeing the person next to us . . . and first,
    just knowing what they''re going through. And then, helping them succeed and thrive
    with us.[^9]


    The problem with nice leaders is that they are people—and no person is always
    nice. The nice leader knocks everyone off balance when she''s having a bad day
    or is profoundly disappointed about a result or situation. She turns into her
    naughty counterpart when she leaks sarcasm or criticism.


    What is your style, and to what style do you respond? To design a plan to get
    what you want, you need to understand how leaders motivate you to perform and
    what range of styles you can use to motivate others. In any case, both formal
    and informal leadership grant the leader a type of supertypical status if the
    person is effective in that role.


    ## Isolation as a Tactic of Leadership


    A community with no external influences, or communication with the outside world
    that is funneled through a controlling source in person or through media, will
    become cloistered. As illustrated by Zimbardo''s Stanford prison experiment described
    in [Chapter 1](#), the impact of that cloistering on behavior is potentially shocking.
    Whether formal or informal, the leader becomes the absolute authority for the
    group, the members of which seek his approval.


    If an informal leader seizes power abruptly, the result is likely displacement;
    the formal leader will see a mass exodus. Germany''s wartime and post-wartime
    brain drain in the mid-20th century provides an example of the latter. Maryann
    participated in such an exodus from a theater company for which she worked. The
    board of directors hastily decided to put salaries for staff and actors on hold
    until the season subscription money came in. Not only was it an illegal move (“there''s
    always unemployment compensation . . .”), but also disrespectful enough to cause
    six of ten staff members to leave.


    An extremely charismatic leader may be able to fend off the inevitable a bit longer
    than others, but the issue becomes not if, but when. If he can hold them long
    enough to initiate a transformation of the standards of the group, fracturing
    from societal norms is bound to happen. If he cannot, then his attempt fails.


    Given enough time, even if the leader is not particularly charismatic, he may
    be able to effect a turnaround by appealing to collective beliefs and altering
    them to play on groupthink in creating a cult of personality. In other words,
    he alters the collective consciousness of the group. This is the kind of phenomenon
    that has happened in


    congregations that splinter from the larger church community; as they bind closer
    to the pastor''s pattern of thinking, they grow more critical of the policies
    and practices of the umbrella organization.


    With the needs of belonging and differentiating shaping so many of our decisions
    as humans, we have a duty to pay attention to the people in our lives who have
    the potential to satisfy those needs. On a grand scale, they are the imposed leaders
    of our companies and government. But the people who enforce neighborhood covenants
    or seize power at the Rotary Club meeting can have just as much impact—or more—on
    the sense of well-being associated with getting those needs met. Ask yourself:
    What is the reason she has so much sway over me? Is she exercising authority that
    has been given to her, or am I surrendering authority? Is she really charismatic,
    or am I perceiving her as charismatic due to circumstances? If you are the one
    in power, pay attention to the dynamic and polish your skills. If you are not
    formally in power, map the dynamic and use it to polish others'' perception of
    you.


    A real-world application of this knowledge can help companies that acquire other
    companies. The balancing act is when to exit key leaders. Do it too early and
    you create mass exodus and a disengaged workforce; do it too slowly and the culture
    of the new company never takes hold. It is why companies twenty years after acquisition
    still refer to themselves as “the old X team.”


    ## CHAPTER 3


    ## Mechanics of Charisma


    Humans often overlook the most obvious things about other humans. As students
    of human behavior, we are much like Jane Goodall among the chimps, with one exception:
    We are also chimps. So even though we know a fair amount about people, we can
    overlook basic things because we are caught up in the interplay that is humanity.


    When average people run into a highly charismatic person, what is it that they
    recall about the person? Everyone who has an encounter with a decidedly charismatic
    person recounts the story in very similar fashion, regardless of whether the encounter
    went well or not. Whether it was, “He made me feel as though I was the only person
    in the room,” or “He made me feel as though he was divine,” it is always about
    a *feeling* and not facts.


    Followers of cult and genuine religious sect leaders have described *their* leaders
    as gods or godlike, just like Joe Whalen, who followed the Maharaji: “I believed
    he was the living incarnation of God,” he posted on the [www.ex-premie.org](http://www.ex-premie.org)
    website. And then, he went on to describe his feelings in detail: “When I was
    allowed to enter the ashram, I was happy, excited, and I felt privileged for the
    opportunity he, the Perfect Master, gave me.”


    We considered all the cult leaders and how each has been described as charismatic.
    After looking at David Koresh, with his obvious facial display of emotional disturbance,
    Charles Manson the raging madman, the paranoid Jim Jones, and Marshall Applewhite,
    who met the “Bo” half of his Bo-Peep cult leadership in a Houston psychiatric
    hospital, we ask, “How is it that these people could be perceived as charismatic?”
    Is there a skill set they were applying? Can it be codified? Is this intentional?
    Chemical? We also started to look for a good definition of the word *charismatic*.


    Go straight to the dictionary definition of the word *charisma*. Merriam-Webster
    Online defines it as “a special magnetic charm or appeal.” Other entries suggest
    charisma is a bit of snake oil. It''s generally not discussed as something humans
    are born with, although some of us might have been.


    So here again is the inherently illogical challenge. How do you study the magic
    someone is using while you are under his or her spell? The answer is likely something
    akin to Arthur C. Clarke''s magic theorem: any sufficiently advanced technology
    is indistinguishable from magic.


    What we did was take as many steps back as we could from charisma and analyze
    it. Our conclusion is that it is more technique than magic.


    Because defining charisma is a challenge, and always referred to in terms of feelings,
    our inquisitive natures sought to define it in logical terms. We began with the
    premise that, if you cannot define something, then how do you know it exists?
    It''s real if you can see the effect of it. The effect in this case is a feeling.
    Accepting it as proof that the elusive character trait exists, the next step is
    to look at it like all other human traits, as a process or series of processes.


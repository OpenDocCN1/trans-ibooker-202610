  mdcn: "\n\n## 分化：区分差异还是过度区分\n\n分化的核心在于展现差异——不是消极或积极的差异，仅仅只是差异。你如何使用每一种工具，将决定这些差异被如何感知。\n\
    \n- *通过分化来区分。* 这是差异的积极应用——指出群体中某个成员的优势领域，让他能像奶油一样脱颖而出。这种应用依赖于将优势凸显出来——这些优势不至于疏远他人，至少计划如此。\n\
    \n- *通过过度分化来区分。* 所谓*过度分化*，是指在任何方向上走得太远，以至于群体中的其他人无法认同这个人，或者他本人也无法理智地认同这个群体。这并不一定意味着这个差异是负面的。也许只是件简单的事：他被邀请到老板的乡村俱乐部，因为他和老板的女儿是大学同学。仅此一点就可能使他在所属群体中显得过于特殊，以至于群体再也无法满足他的需求。英语中的俗语如“你永远回不了家”正是根植于这一原理。\n\
    \n- *通过示例法进行分化。* 要推销产品，你必须知道它为什么不同于其他产品，哪怕仅仅是因为更便宜。利用你在第4章学到的工具，你需要挖掘出目标客户鲜为人知的事实，以找出她的独特之处。无论你是提出只有具备相应技能的人才能回答的难题，还是用各种方法在会议上引发一场爆发，娴熟地运用这些工具是实施这一策略的必要条件。\n\
    \n- *通过示例法进行区分。* 当你提问时，要精心设计问题，使他在提问中展现出作为群体中坚实一员的一面，并拥有其他成员不具备的洞见。（引导性问题在这里会有帮助。）无论这些信息涉及过往工作、爱好还是其他课外活动，都要编织一张从他人到技能集的蛛网。用引人深思的平行问题让他自己看到关联并主动说出来，或者干脆问他过去在工作中会怎么做。这套技能的核心是让他成为英雄，以某种方式展现他的超典型特质，但又不会过头到成为马屁精。这种健康的分化能让他脱颖而出，又帮助他不至于走得太远。\n\
    \n- *通过示例法进行过度分化。* 在我们这个“无所不可、没有对错”的现代世界里，人们很容易忘记一个事实：有些东西可能过于不同。不管他们在公开场合表现得如何，很多人实际上比他们表现出来的要保守得多。我们不是指政治意义上的保守，而是指他们对偏离常规的容忍度，远低于他们出于政治正确而愿意承认的水平。\n\
    \n    提出将话题推向极端边缘的问题，既能引发暴露内心的回答，也能引发某些行为。精心设计问题和策略，把某人推向反应过度，或将群体看重的某事贬为“无非是废话”的境地。一个夸张的例子是用引导性问题暗示评判：“你不觉得，在孩子们放学回家路上从桥上跳伞，构成鲁莽危害行为吗？”其效果是把他从群体可接受的范围内剥离出去。\n\
    \n    当一位备受尊敬的人持有缺乏事实依据的观点，或将某位大师的想法据为己有时，这一策略尤其有效：“如果测地线穹顶真是如此节能的模型，为什么在如今我们痛苦地意识到能源成本的时代，却看不到更多的实例呢？”你给他机会解释，如果他说得听起来很明智，就鼓励他——但只到一定程度——然后转向批判性提问。之后，你可以选择救他一把，或者让他自己挣扎。\n\
    \n    无论哪种方式，你的任务都已完成，他要么需要重新确立自己在群体中的成员身份，要么就得去别处寻找归属感。\n\n- *通过隔离来区分。* 在一个充满敌意或满是独特天才的池子里，想让某个人显得特别往往很难。在某些情况下，一位超典型人物恰恰是利用了房间里普通人也拥有的同一种才能，才攀升到超典型的水平。\n\
    \n    除非这位超典型人物心态非常平衡，否则她可能会把新人视为威胁并加以威慑。他的安全网在于有能力进入一个更小的池子，在那里他可以自在地找到归属。如果你能促成这一点，你就在新人和那位多疑的超典型人物之间制造了一道缓冲。实现这一目标的方式包括：精心安排一次会议变更，不经意间将超典型人物从现场支开；或者邀请新人参加那位受威胁的超典型人物绝不会参与的活动。这两种方式都能将你的目标人物隔离出来，让她得以闪耀。\n\
    \n- *通过隔离来过度分化。* 有些事在某些群体中完全可以接受，但在另一些群体中却是太过分了。在美国企业界使用军事用语，可能会让人夺门而逃。通过巧妙地引导你的目标人物，让他觉得安全、觉得身处朋友之中，你往往能让他说出那些在敌对阵营中绝不会透露的事实。这一招在生活中和喜剧中都行之有效。两者都依赖于一个事实：人类是仪式性的生物，会不由自主地一遍又一遍重复同样的事情。\n\
    \n    在喜剧《拜见岳父大人》中，阿什顿·库彻饰演的角色正与伯尼·麦克饰演的角色的女儿约会，并到女方家参加感恩节晚宴。伯尼·麦克对白人男性约会自己的女儿深感不满，便引诱库彻讲“黑人笑话”，用一句“别这样，你现在已经是家人了”来引他上钩。最终，库彻一个接一个地重复笑话，直到越过了底线。\n\
    \n    这种“打开水龙头”的现象时有发生：人们会投射出这样一种预期，即被接纳意味着对方和自己完全一样，会接受自己的一切，包括缺点。但这很少是真的。\n\n\
    - *通过关联来区分。* 人们常常通过提及名人或告诉你他们以前在哪里上学来区分自己。一位来自新泽西的朋友常说，住在普林斯顿会让人觉得自己很聪明；你说一句“我来自普林斯顿”，就能获得一种资历。操纵关联可以让一个人在群体中显得更有价值或更没价值。当他是团队中的坚实成员，并且和老板的兄弟关系很好时，这或许足以提升他的地位——除非老板的兄弟像前总统吉米·卡特的弟弟比利·卡特那样，是个自认的酒鬼。一个人拥有的每一种关联，无论自愿还是偶然，都可能产生巨大的差异。看看安德森·库珀这样的人，他是时装设计师兼作家格洛丽亚·范德比尔特的儿子，也因此成为商业大亨科尼利厄斯·范德比尔特的玄玄孙。\n\
    \n- *通过关联来过度分化。* 通过关联来过度分化，在美国各地的法庭上一直被用来左右有罪或无罪的判定。如果你和不三不四的人混在一起，那你又算什么人？你可能是查尔斯·曼森，也可能是特蕾莎修女。\n\
    \n    这里的关键在于如何把控叙事角度。通过将你的目标人物与某个超出群体理解范围的人关联起来，你就能把这个人推到孤立的境地，也许还能让他更靠近你或另一个群体。\n\
    \n    这种情形以非常公开的方式发生在乔治·艾伦·雷克斯身上，他是浸信会牧师，曾是美国反同性恋运动的领袖，直到他在迈阿密机场被拍到与一名男性陪侍在一起；还有前国会议员安东尼·韦纳，他因性短信丑闻而臭名昭著。与名声不佳的个人或概念的关联，会让一个人急切地寻求归属。当他在努力融入时，他会忘记一切关于超典型的想法，拼命想要抓住些什么。对于自我实现者来说，他会努力维护自己的声誉，就像深陷白宫实习生莫妮卡·莱温斯基丑闻时的克林顿总统一样。有人能东山再起，比如克林顿。但通常不会。\n\
    \n"

    \ model to assess someone. You must see the person holistically so that you can\
    \ know reliably where he is strong, weak, and average. In short, how balanced\
    \ is he?\n\nBy coordinating multiple flat graphs into one 3-D representation,\
    \ you get an image that looks like the Liberty Bell. You might even imagine cracks\
    \ in the bell where your ostensibly superhuman target shows subpar performance\

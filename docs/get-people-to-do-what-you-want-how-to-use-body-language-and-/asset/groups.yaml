    # Fracture the Person from the Group, Bond Him to You


    When you emphasize how much you and a person are alike, you can use fracturing
    to bond by insulating him from others, so he feels the need to cling to you. For
    example, if someone in your office is a goofball with whom no one really likes
    to spend time, and he knows this, he does his job just enough to keep it. You
    need something extra from him, though, so you point out commonalities that draw
    him to you. He will feel as though he has a reason to bond with you, and could
    never get reinforcement or honest respect from the others. He goes the extra mile
    for you because you make him feel he has real value.



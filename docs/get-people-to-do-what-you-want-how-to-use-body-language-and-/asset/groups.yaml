    The downside of differentiation is fracturing: pointing out how someone is different
    from you or from the group, but in a negative way. Nonetheless, you can use it
    to achieve belonging, as well as separation.


    To see how it can lead to belonging, consider the kind of relationship that management
    representatives might try to establish with a labor leader in a union negotiation.
    The tactic of fracturing that person from the group could be part of an effort
    to make her feel as though she has more in common with management than labor.
    They aim to undercut her authority entirely. By differentiating the labor leader
    to the point at which she no longer seems to have anything in common with the
    group she represents, they woo her into the fold, thereby gutting the mass movement.
    They send the message: “Your capabilities make you eligible to rise above these
    peons.” Not only is this what a good labor negotiator does, it''s integral to
    how the Dark Lord of the Sith lured Anakin Skywalker to the Dark Side. In one
    quick move, he fractured the young apprentice from his group of Jedi knights and
    instantly bonded him to the Sith. Another case of art imitating life.



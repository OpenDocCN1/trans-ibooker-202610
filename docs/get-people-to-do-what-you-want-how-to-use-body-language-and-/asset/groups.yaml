    traits look on bell curves that could be overlaid into a 3-D image:


    ![](img/ccd9d9c31a1b4bf629dd84c4b7e079d5_155_0.png)


    If you wanted to gain leverage with this award-winning performer and highly accomplished
    businessman—nearly at the pinnacle of the movie actor and businessman categories—you
    might look to his causes. What could you do to raise his profile as an environmentalist
    or a champion for the eradication of cancer? If you use the positive approach
    to getting someone to do what you want, your action to move him into the realm
    of “supertypical” among celebrities within those causes may give you some unique
    influence with him. We say may because we use this solely as an example of how
    this process works, not how it would work specifically with Ryan Reynolds.'
  - '[PAGE 156]


    You could do this in an office setting with the CEO by targeting her causes, and
    then presenting her with an opportunity to give the keynote at a fund-raising
    event for that charity. Maryann''s friend took another approach: She focused on
    her boss''s love of physical fitness and invited him to be her guest at a health
    club with top trainers. She got a lot of lunch invitations from him after that,
    as well as a Christmas bonus. That''s the positive side of differentiating. The
    negative side would be to outrun him and outlift him at the gym.


    The exercise of profiling a person with the level of scrutiny required to create
    a 3-D bell curve may have some surprising results for you, too. You may realize
    or discover something about a person that gives you a different perspective about
    working with him. You may decide that a respectful approach aimed at bonding feels
    more natural than pushing him away, or vice versa.


    The reason why someone may look well balanced in the 3-D bell is that they compensate
    for ranking super-typical in some areas by being subtypical in others. The Ryan
    Reynolds examples hinted at that. Look at that mix of achievement and underachievement
    in other people you know well, either by reputation or personally. Thomas Jefferson,
    for example, not only served as the third president of the United States, but
    he also distinguished himself in fields such as horticulture, architecture, archaeology,
    paleontology, literature, and education. He was far less supertypical in his personal
    life: After ten years of marriage, his wife died, and he never remarried; of his
    six children with her, four either died at birth or when they were babies. In
    short, he could devote most of his prime years to everything but home and family.
    If you work in a large office, you have probably come across at least one person
    who works overtime voluntarily and'
  - '[PAGE 157]


    excels in production, but has no one to go home to (or doesn''t care to go home
    to whoever is there).


    You know more about the areas in which someone like that is supertypical because
    people typically lead with the edge they want people to see. So when you see someone
    who projects an almost superhuman amount of achievement, look for areas in which
    he is an underachiever. Many times, the most balanced people will not be overachievers
    in any particular area because they go through life doing little bits of lots
    of things.


    As you mentally plot a person''s 3-D bell and the span in supertypical areas seems
    enormous, you need to keep probing to complete the picture. They will likely be
    just as broad in subttypical areas. They excel in other things and pay for it
    somewhere else.


    # Creating the Bell


    We told you that interrogators collect information with guards, cameras, and microphones,
    but because you don''t have them, you''ll need magic. That magic is the adept
    use of the tools covered in Chapter 4. In this section, you will exercise them
    in building rapport, baselining, and gathering information so you can create that
    3-D bell of your target.


    Apply these techniques inconspicuously. You will get resistance ranging from a
    skeptical look to harsh expletives if you pry and push for information. That means
    you should start your conversation broadly and allow your source to direct which
    questions you ask. Don''t gut your plan at the outset by asking your boss, “So,
    what makes you tick?” or “What really embarrasses you, sir?”


    Your target''s response will be driven by his operating system. If you ask a pretentious
    type what he is most proud of, you can guarantee he will offer an answer—a'
  - '[PAGE 158]


    complete one. He might also take the opportunity to answer the same question by
    giving you an anecdote about swimming with crocodiles and losing his keys in the
    Congo. On the other end of the spectrum, you might find a well-adjusted earthy
    type giving you a sarcastic answer and asking you why you care.


    Keep your collection effort to typical conversation with two differences. You
    have a mission, and you are the one driving the conversation. These are the steps
    you will follow:


    +   1. Establish rapport.

    +   2. Establish baseline.

    +   3. Understand the threshold.

    +   4. Gather information.

    +   5. Reinforce rapport.


    # Establish Rapport


    This bridge called *rapport* can only join people who have something in common.
    That could be something as simple as age or shared misery with the workplace.
    Or it could be something unique, such as a love of Italian sports cars. All the
    subject will do is serve your desire to start a conversation without it feeling
    contrived.


    # Establish Baseline


    Listen for his stress-free style of word choice, cadence, pitch, and tone. Look
    at his body language and eye movement patterns in casual conversation. Note anything
    that you might consider a glitch that''s normal for him. It could be something
    subtle, such as a certain way of using pauses, or it could be something you find
    decidedly odd, such as focusing to the side of you instead of making eye contact.'
  - '[PAGE 159]


    When you know what is normal, you can see abnormal. As you start the conversation,
    you detect cues in body language and hear clues in his stress of certain words
    about what is important. Using active listening skills founded on his baseline,
    you can know what is a source lead; you follow it and make the conversation flow
    naturally. If you fail to use source leads, your style of follow-up will seem
    wooden. He may suspect that you''re probing, which will trigger an instinct to
    resist.


    # Understand the Threshold


    When you work in the bodyguard business, you are taught to use a technique called
    *threshold braking*. This involves riding your brakes to the point that your car
    is slowing, but there is no perceptible dip to the nose of the car. You learn
    this because it allows you to steer as you brake, which is vital to maintain control
    of the vehicle at all times.


    As you ask questions and follow his leads, think of the threshold-braking metaphor.
    You pay attention to signs that he feels you are probing. You do not want to push
    to the point where you see a reaction. The only way you will be able to spot and
    adjust to mood changes is to ride the brakes with no perception that you are braking.
    If there is an indicator that he is sensing you are doing more than chatting,
    you have to transition immediately to a less-threatening topic. Loop back to something
    innocuous that he mentioned previously.


    # Exercise: Find the Threshold


    You can do this exercise with someone you know well or someone you will never
    see again. Pick a hot topic. Talk to the person in broad terms, and work your
    way toward that hot topic. As you start down the path,'
  - '[PAGE 160]


    watch and listen for indications that you are getting close to an emotional reaction,
    but consistently stay just short of it.


    If the person is a good friend, brake and debrief him on what you are doing. If
    the person is a stranger, brake and talk about something positive. Pay attention
    to news interviewers as they take this approach. Notice that sometimes they cross
    the line, and you can see the response in their source brewing before the explosion.
    Do not get to that point with your source.


    # Gather Information


    As you follow the conversational leads, appeal to his pride. Flatter him when
    you''ve clearly entered an area of pride. You will see similar indications in
    a male or female—chin up, erect posture, possible shoulders broadening, and clear
    enunciation with a bit more volume and excitement in the voice. To get him to
    give you more detail, pinpoint the accomplishment and stroke his ego. Buried in
    that detail will be other links that allow you to follow up using good questions.
    You will be able to find out things, such as why he is so proud of this particular
    accomplishment. Maybe he beat the odds. Maybe he turned around one of his biggest-ever
    failures.


    As you gather information, pull out all kinds of tools from your toolbox. These
    will get you some quick results:


    +   - **_Repeat words._** Repeat words about which you want him to give you more
    information. Humans naturally drop words we want to talk about and are more than
    willing to educate those who do not understand the things we are passionate about.
    Prey on this natural tendency. Follow his'

  - '[PAGE 266]


    # About the Authors


    GREGORY HARTLEY''S EXPERTISE as an interrogator first earned him honors with the
    US Army. More recently, it has drawn organizations such as the DHS and national
    TV to seek his insights about “how to” as well as “why.” Now with more years in
    civilian life and the corporate world than the military, Greg has transformed
    those skills into what he calls “extreme interpersonal skills.”


    Greg had an interesting military career as an Army interrogator, including earning
    the prestigious Knowlton Award, which recognizes individuals who have contributed
    significantly to the promotion of Army intelligence.


    Greg has provided expert analysis for major network and cable television, particularly
    CNN and Fox News, as well as National Public Radio and prime print media such
    as the *Washington Post* and *Philadelphia Inquirer*. Important foreign media
    such as *Der Spiegel* and BBC World have also relied on his commentary. Greg has
    commented in publications such as varied as *US Weekly*, *Money*, *Spin*, and
    *Cosmopolitan* about what makes people tick.


    Greg uses his knowledge of people as a business transformation professional with
    a proven track record of knowing what it takes to move large multinational corporations
    to a desired end state and make it stick.


    Greg is the author of ten books on human behavior with Maryann Karinch.'
  - '[PAGE 267]


    MARYANN KARINCH IS the author of thirty books, including ten coauthored with Greg
    Hartley, namely, *How to Spot a Liar* (Career Press, 2005 and Revised Edition,
    2012), *I Can Read You Like a Book* (Career Press, 2007), *The Date Decoder* (Adams
    Media, 2008), *How to Be an Expert on Anything in Two Hours* (AMACOM, 2008), *Get
    People to Do What You Want* (Career Press, 2008), *The Body Language Handbook*
    (Career Press, 2010), *The Most Dangerous Business Book You''ll Ever Read* (John
    Wiley & Sons, 2011), and *The Art of Body Talk* (Career Press, 2017).


    Maryann frequently shares her expertise in interpersonal management skills with
    audiences in need of specialized training in those areas.


    In 2004, Maryann founded The Rudy Agency, a literary agency specializing in nonfiction.
    Earlier in her career, she managed a professional theater and raised funds for
    arts and education programs in Washington, DC. She holds bachelor''s and master''s
    degrees in speech and drama from The Catholic University of America in Washington,
    DC.'
  - '[PAGE 268]


    # A former Army interrogator shares his secrets for getting exactly what you want
    out of anyone, anytime.


    In business, school, romance, or your neighborhood, it is valuable to know what
    attracts people, what repels them, and what makes them tick. Choosing the right
    approach will enable you to influence people to do what you want in professional
    and social situations. The authors include case studies of how this technique
    has worked to create both good news and bad news. Most importantly, they tell
    you how to identify and guard against manipulation so you remain in control of
    your choices and options.


    # Attract

    the People

    You Want

    and Get Rid

    of the Ones

    You Don’t!


    In Get People to Do What You Want, you’ll learn about the following:


    +   - One-on-one interaction

    +   - Group dynamics

    +   - The projection of leadership

    +   - Instinctual trust and mistrust of others


    Get People to Do What You Want is the perfect, modern complement to Dale Carnegie’s
    1937 classic work on the topic. Think of them as the Old and New Testaments of
    persuasion.


    ![](img/ccd9d9c31a1b4bf629dd84c4b7e079d5_268_0.png)


    Gregory Hartley’s expertise as an interrogator first earned him honors with the
    United States Army. More recently, it has drawn organizations such as the Defense
    Intelligence Agency, Navy SEALS, and federal law enforcement agencies to seek
    his insights into what suspected terrorists—as well as celebrities—really mean
    when they answer tough questions. He is author of ten books on body language and
    behavior.


    ![](img/ccd9d9c31a1b4bf629dd84c4b7e079d5_268_1.png)


    Maryann Karinch is the author of nineteen books, including How to Spot a Liar,
    The Body Language Handbook, Control the Conversation, Nothing But the Truth, and
    The Art of Body Talk. She is the founder of the Rudy Agency, a literary agency
    based in Estes Park, Colorado. Visit her at www.karinch.com.'

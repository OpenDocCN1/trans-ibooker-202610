    You will likely never deal with either of these extremes, but consider what commonalities
    exist between the interrogator''s circumstance and yours. When someone opposes
    you and is bolstered by forces, inside or out, you have little chance to get her
    to do what you want. But when that person feels threatened—whether the threat
    occurs because she feels like an outsider, like a nobody in the group, or in danger
    of being supplanted as the alpha—you have a lever. How you apply this lever is
    the art because you will creatively rely on both positive and negative levers,
    depending on the situation and the individual.


    We want to emphasize that it is extremely dangerous to inject poison into someone''s
    self-image. You can push a person to retaliate violently by doing that. If you
    manipulate someone to the point where she feels she has lost her sense of self—that
    is, the point of personal extinction—and you do not know how to manage the situation,
    you can seriously harm her psyche. When interrogators do this, they either pull
    the person out of it and restore her sense of self, or walk away, not caring what
    kind of damage they just inflicted. But daily life is not an interrogation, and
    the outcome is not a life-or-death situation. Used for the right purpose and in
    proper measure, you can get people to do things you want; used incorrectly, these
    tools can result in things you really do not want.


    A parent might choose the “incorrect” way to punish a misbehaving child by taking
    away the one thing in his life that means the most to him—his puppy. In trying
    to manipulate the child to behave, the parent has unwittingly scarred his psyche.


    Brandy Vela''s 2016 suicide spotlights a worst-case situation resulting from toying
    with someone''s self-image. As an overweight, eighteen-year-old girl she endured
    body-'
  - '[PAGE 25]


    shaming from people at her school as well as people using fake Facebook accounts
    to send bullying messages. Brandy changed her phone number and even reported the
    intense bullying to police, who couldn''t trace the messages and were forced to
    wait until a physical confrontation occurred. When the harassment continued, she
    snapped. In front of her parents, Brandy shot herself—the literal expression that
    she had experienced personal extinction.


    When we wrote the original version of this book, suicide was the third leading
    cause of death for people ages fifteen to twenty-four according to the US Centers
    for Disease Control and Prevention. As of this writing, it has risen to the second
    leading cause of death for this age group. Young psyches are not necessarily resilient
    enough to deal with the end of a love affair or an embarrassing situation. Do
    you think embarrassment isn''t a strong enough reason to take your own life? After
    a DUI or minor scrape with the law (a violation that would not ruin a person''s
    life), some people choose suicide instead of the embarrassment of jail. If their
    pride in being respectable, dignified individuals was fundamental to their personal
    identities, the possibility of jail time drove them to personal extinction. Their
    definitions of respectable and dignified did not allow a check mark in the box
    for incarceration. A quick Google search yields dozens of examples, and many people
    were well into adulthood when they did it.



    need to know how that works, too, because as we said at the beginning of this
    book, manipulation is part of the program.


    Many who have served in the US military during wartime have served side by side
    with allied soldiers from other countries. There is closeness with those allies,
    as well as enormous trust. A great deal of information passes between US military
    and foreign allies, but not everything. Regardless of the open relationship, soldiers
    from different nations can be too open. Allies collect information on American
    operations, and Americans know it. Unless we decide to share a government, we
    will not share certain sensitive information.


    The problem professionals in the intelligence field have encountered is that young
    American soldiers sometimes get so caught up in whom they are talking with that
    they forget what they are talking about. This is the way that spies get information
    from people who should know better. Whether it''s a woman trading sex for secrets
    or a jovial host sharing schnapps with a foreign national, they make you forget
    who they are. They bond with you. After that, they pare your options, which is
    a process we explore in depth in Chapter 7. In brief, after you feel as though
    you belong—you are in the hierarchy to which this person belongs—then that person
    makes you feel special. You are differentiated. You may feel as though he thinks
    you''re the only one worth talking to, or you''re the only one worthy of making
    love to her. After that, it''s a small step to making choices that keep you in
    that person''s company and eliminating options that remove you from that person''s
    company.


    The technique does not sound so exotic when you realize that it happens in offices
    every day. Moving from bonding to putting someone in a compromising position happens
    in sales meetings, board meetings, interviews, client presentations, and myriad
    other business-related activities. You can easily do it with strangers in a business
    environment, sometimes more easily than with people you see on a regular basis.


    Here is how you might launch a conversation with intent, use some key tools to
    model and bond, and then achieve the outcome of finding out information useful
    to a pending negotiation. You show up twenty minutes early for an appointment
    with Bill Smith, a prospective client. Your objective is to find out something
    salient about the character and interests of Bill so that you have some leverage
    in the meeting. You greet his executive assistant with a simple, “I''m really
    early. Please don''t bother him for at least fifteen minutes.” You pick out something
    that signals what''s important to her or what may be a source of pride: “You have
    a wonderful speaking voice. Have you ever been on stage?” That will either get
    a yes or no, but there''s a good chance the comment will be followed by a little
    more insight into her interests and personality. Then move the conversation about
    those interests to the office: “Do people at the office know you do the pre-concert
    narrations for the city symphony?” After that, you find out her preparation for
    those gigs sometimes digs into office time. You might respond, “Bill strikes me
    as the kind of CEO who encourages employees to do what''s important to them.”
    This comment might elicit raised eyebrows in surprise; a knit brow that says,
    “Are you kidding?”; or maybe a big smile and nod that broadcast “Absolutely.”
    Regardless of the subject of the conversation, if you find out whether or not
    Bill treats his executive assistant with respect and support, then you find out
    a lot about his workplace priorities. Does he care about having her feel as though
    she belongs? Does he do anything to give her a sense of status? Does he support
    her efforts toward self-actualization through this very important “night job”?


    Knowing how he tunes into the needs of employees will give you clues as to where
    he himself sits in the hierarchy of needs. More importantly, if he is doing a
    poor job, and you can identify his needs and fulfill them, then you bond with
    him—and information flows freely as he forgets who you are.


    ### Engage with Intent


    *Bonding* and *fracturing* are ways to dismantle a person''s drive and rebuild
    it in the way you need it to take shape—to draw the person toward you—but that
    process only makes sense if you have a defined outcome in mind. To clarify the
    importance of this point, focus on the difference between a bully and an interrogator.


    Even though the two rely on very different skill sets, you wouldn''t know that
    if you watch a lot of bad TV. Ask someone who has only seen depictions of interrogators
    on those melodramatic crime shows to mimic an interrogator, and he will try to
    intimidate the source. This is not what makes interrogations work. You need to
    get into that guy''s world and look out—to move to a position inside his head
    so that you understand his point of view. That is the point of the psychological
    keys, or approaches, described in Chapter 4.


    Children use some of these tools instinctively to cajole or coerce their classmates
    and siblings to comply with requests, give up information, or, in some cases,
    just to watch other kids squirm. When children do this, they prey on natural drives
    and sensitivities. As we grow up, two things happen: we are forced to stop behaving
    like children, and we begin to realize that others have value. We also run out
    of time to focus so much energy on other people. Our senses dull to the possibility
    of getting people to do what we want.


    Many of the skills you learn in this book are grown-up versions of kids'' antics
    such as teasing about big ears or ugly shoes, and then relieving pressure by changing
    the subject. Fishing to find out secrets is another big one. The tools of interrogators,
    therefore, bear a striking similarity to things kids do naturally, but the childhood
    skills are put to sleep as life gets in the way.


    The adult version of tools does have a significant difference: the application
    of them relies on cognitive


    sisters were cheerleaders who married right out of high school. She was the studious
    one. Mom and Dad doted on their firstborn but never connected with her academic
    aspirations all that well. Charly got her PhD in English literature and taught
    at a major university, and she spent the next twenty years developing her career.
    One day, she got the call that her father had died. At the wake, she sat at a
    table with her parents'' longtime neighbor, and she thought she was looking in
    the mirror. Her sisters never needed glasses, but Charly had thick ones—like the
    neighbor. Her sisters were blonde. She was brunette—like the neighbor. Her sisters
    didn''t like school. But Charly, like the neighbor, had pursued a PhD in spite
    of the family''s obvious disinterest. They were both lefties, too. According to
    Charly, she said something like, “My father didn''t die, did he?” And the answer
    was, “No. I''m still here.”


    So when we say that the family is the only natural, or involuntary, group that
    occurs, we''re referring to a genetic link. For some, that surviving, natural
    group comprises only two people who are blood relatives, such as siblings, mom
    and child, and father and child. We contrast that unit with artificial organizations—and
    use the word artificial without prejudice to refer to businesses, churches, clubs,
    or groups not composed strictly of blood relatives—in which people come together
    for common purposes and interests, rather than just because they share DNA.


    Think about the concept of artificial organizations as you wind your way through
    life. Look at how much you try to be like the groups you voluntarily join. Do
    you post on social media for adulation? Acceptance? Something else? More importantly,
    look in the mirror and consider how much effort you put into differentiating yourself
    from the group to which you cannot help but belong—your family.


    In some cases, we want our family to be more, so we try to differentiate the whole
    family. As we amass a fortune, distinguish ourselves academically, win a gold
    medal, or otherwise pull ourselves up by the bootstraps, we try to become a surrogate
    for the entire family as we differentiate our way through society. What Tom Cruise
    did for his mom is one example. In several ways, his early life was difficult
    both financially and emotionally, with a mom who was a special education teacher
    and a father who was abusive, luring him closer (bonding) and then literally kicking
    him away (fracturing).⁷ Cruise stayed close to his mother as he climbed to and
    achieved fame, and sustained a level of comfort and security she had missed for
    years while she was raising him. In a way, Cruise did the same thing as Joe Kennedy:
    He achieved such a high level of success that he could bring his entire family
    toward the status of royalty. He could walk the red carpet with his mom or his
    children and they would, at least for a moment, be seen as stars.


    The dynamic of family is hard to overstate. When people think of ties that cannot
    be broken, these ties often prey on the model of family. Charles Manson took people
    who had fled their families for one reason or another and created a nucleus to
    which each felt drawn at a primal level. He called this group “the family.” Manson
    used his personality (quirky as it was), age differential, and prior run-ins with
    “the man” to show his value and establish himself as leader of this group.


    Each group, whether family or other, will establish leadership in a distinctive
    way, which is often determined by the dynamic that causes the core group to come
    into existence in the first place. For example, if a charismatic individual magnetically
    draws needy people to him, the dynamic takes shape from the moment of recruitment.
    Different organizational dynamics related to bonding and fragmenting emerge depending
    on the group''s leadership factors: selection method, strength of the leader,
    the leader''s style of influence, and the impact of isolation—whether real or
    virtual.


    ## Natural Versus Imposed Leaders


    All groups have a leader, whether that person is sanctioned by a formal process
    or simply emerges in a position of authority.


    The simplest kind of leader is the guy in the office who steps up to solve a problem;
    he is a *natural* or *informal leader*. He may invite himself to seize power or
    simply respond to cries for help. In either case, there is no deliberate, delineated
    process, and there are no formal trappings of authority. He may get deference
    from everyone in the office, or be viewed as an oaf who is stuck with the role
    in the beginning, but will gain real power and deference if given enough time.
    The key point is: he is there to represent and make decisions, sometimes through
    openly exercising authority, and other times through less overt wrangling.


    *Informal*, or *natural*, leaders emerge in response to a power vacuum, whether
    or not the vacuum is evident. An example on the whimsical side is the guy who
    organizes the annual football pool at the office; a more practical example is
    the person who speaks up for his coworkers in front of the boss. The social version
    is the neighbor who arranges the holiday parties and organizes everyone in a protest
    against a new megastore. The neighborhood or other non-work-related leaders are
    the kinds of informal leaders who get harder to avoid. You can change jobs, but
    changing neighborhoods is a bit more traumatic.


    Informal leaders have a level of authority as though they were appointed by a
    king or elected overwhelmingly by the populace. Oprah Winfrey exemplifies this
    kind of leader; she has the power to command attention whenever she wants it and
    to influence significant decisions in people''s lives. If you have someone in
    the workplace who stands out as this kind of informal leader, the boss knows that
    deference is in order. In many work environments, it is clear that the man with
    the title is not the man with the power.


    These informal leaders can be virtual as well. Social media crusaders, gurus,
    malcontents, and any number of other categories find a gap and create the role
    that allows them power. Whether this power is for perceived good or evil is up
    to the person. As an example of a bad thing, look at the mess we are in with election
    interfering. On the contrary, look at the power of GoFundMe and the lives changed
    by a handful of people emerging as informal leaders. A lot of good came from the
    initiative of a do-gooder who initiated a GoFundMe campaign to cover medical bills
    for a hard-working person hit with expensive, life-saving treatments, but without
    workplace health insurance to cover them. One of Greg''s friends was bitten by
    a copperhead snake—not something a person would expect or anticipate—but it''s
    especially bad if he''s between insurance policies. A friend launched a GoFundMe
    campaign that helped raise the $57,000 needed to pay for the care that saved his
    life.


    The second type of leader is formal, or imposed. The underpinning of formality
    is a recognized process to select the leader who fills an official slot and carries
    the crown and scepter of the position. We describe this leader as imposed because,
    in most cases, not everyone has a say in who gets the role. When the board of
    directors hires your new boss, you likely have little input in the decision. His
    leadership is imposed and, although you can opt to leave, that is likely as much
    power as you can exercise. At the same time, it doesn''t mean that simply reminding
    people of his status will enable him to accomplish anything.


    When Greg was a very young soldier, his first job was as a finance clerk—something
    for which he was not well suited. His boss was a twenty-two-year-old lieutenant
    with a horrible management style. He would come into the office, cross his arms,
    walk around, and watch everyone work. It was like a caricature from a Monty Python
    movie. After one of the guys who worked in the office died in a car crash, people
    started to bond against the lieutenant. The sense was, “What if this is me tomorrow?
    I shouldn''t have to put up with this crap.” A few days later, in an effort to
    improve morale, the lieutenant brought himself down to the level of his minions.
    He closed the door and said, “All rank''s off. I want you guys to be point-blank
    honest with me. How do you feel?” The words were barely out of his mouth when
    a young woman spat out, “You''re an ignorant mother—.”


    That was the wrong thing for the young lieutenant to say. He tried to bond, but
    instead he fractured very quickly. He was put in power because the establishment
    ordained him, not because he had any competence in the areas of people management
    or finance. He thought he had power merely because he was in charge. In reality,
    he had no power to make anyone do what he wanted. He never asked for or earned
    authority from the people he was governing.


    You might conclude that, because this was the military, a certain amount of deference
    had to be given to someone who outranked you. True, but you can provide formal
    deference to a formal leader and it rings hollow. This lieutenant, in effect,
    removed the veil, and saw clearly that he could make people do what he said, but
    never what he wanted. The young lieutenant asked for a transfer.


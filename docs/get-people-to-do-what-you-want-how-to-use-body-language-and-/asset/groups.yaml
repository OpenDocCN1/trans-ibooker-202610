    # Exercise: Have, Do, Know


    Make a list of things you do that other people don''t do, things you have that
    other people don''t have, and celebrities of one sort or another you have met
    or know well. Don''t overshoot. Make choices that have roots in fact and verifiable
    experience. Maybe you are the good presenter or the guy who has the best stories.
    That means you''ve conquered Step 1. Start to think of this as a stock—something
    that gives you leverage and possibilities.


    Move this concept closer to home. The guy in the next cubicle who understands
    how to deliver a powerful presentation gets adulation and admiration from others
    in the office. Often, he brushes it aside without regard for the implications
    and possibilities. He misses the opportunity to exploit the differentiator because
    he sees himself as a known quantity who has shown all his cards already.



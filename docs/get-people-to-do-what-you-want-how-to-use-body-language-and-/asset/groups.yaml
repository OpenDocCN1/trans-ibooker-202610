    and offer to help them up from subtypical. Knowing their unique combination of
    character traits and abilities is the information you need to get them to do what
    you want.


    This is what interrogators do: work people in places where they feel strong, as
    well as in places where they feel weak.


    Libby is a perennially underemployed actor. Acting is her passion and her “night
    job”; she generally takes admin jobs with few intellectual demands and very set
    hours. If you were Libby''s boss and wanted her to complete a task at the office,
    you would get nowhere if you focused on her role in that work environment. She
    wouldn''t lift a finger. Instead, she would quit and move on to the next admin
    job, and you would never get what you wanted. In tying incentives or pep talks
    to her day job, your best strategy would be to discover her priority: being on
    stage. After finding out her passion, you could talk to her in a way that she
    would tune in to you. You could articulate the reasons why homing in on certain
    parts of her day job could help her be a better actor; then you''ve caught her
    attention and got some leverage with her.


    At its core, this approach is about respect for the whole person, and the image
    of the bell serves as a visual reminder for that.


    Most people are balanced. If they are strong in some areas, then they are weak
    in others because human beings have only so much bandwidth. The key is to find
    out which things cause them pain, and which add value to their lives. To play
    the role of Elizabeth I, whom most of us remember for her grand successes, Cate
    Blanchett tried to capture the holes in the queen''s persona. She explained her
    process in an interview on www.50connect.co.uk: “What I have tried to do in this
    film is to create a sense of a hollow woman—without a companion, a husband, a
    child—searching for what replaces that void.”'

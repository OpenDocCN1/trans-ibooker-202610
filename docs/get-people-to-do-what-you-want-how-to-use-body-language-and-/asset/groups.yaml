    extreme, but they highlight that your sense of belonging to a group and being
    distinguished within that group is a relative judgment.


    It applies in terms of achievement, too. Many people become big fish in little
    ponds and become convinced that they are capable of so much more. They move on
    to a larger pond only to find that their differential group has been left behind.
    Suddenly they are no longer better or normal, much less superlative. This new
    set of expectations, whether vocational or social, changes the ground rules.


    # Self-Image and Interrogation—the Extremes


    The science of interrogation is about asking questions and getting as much information
    in as little time as possible (assuming the person cooperates). The art of interrogation
    happens when you apply a set of extreme interpersonal skills so subtly that the
    unskilled observer rarely knows what is going on. Both the interrogator and the
    source are keenly aware of the interchange; it is more stressful for both than
    either will likely encounter in any other situation. This art of interrogation
    relies heavily on managing the person''s self-image.


    In the interrogation business, the euphemism for a cooperative source is a broken
    source. This implies that the interrogation broke her will to resist and she will
    cooperate. A source who “broke on direct” means she answered the questions she
    was asked. No fanfare or manipulation. The mechanics of what makes a person divulge
    sensitive information to her enemy in that manner cannot be overlooked. Consider
    this classic scenario of a captured soldier sent to a compound to face an interrogation.'
  - '[PAGE 20]


    When the soldier enters military service, he is indoctrinated and pumped full
    of duty, honor, country, and camaraderie. This system of teamwork, mission, and
    higher purpose insulates him from the thought of what the enemy must be like.
    It is simple: the guy on the other side is the enemy; he is to be destroyed, and
    an interrogator has the power to do it. The soldier''s self-image is manufactured
    and injected into him; regardless of where he fits in the group, he is a soldier.
    He belongs, so now all he needs to do is differentiate. The younger a soldier,
    the easier it is to have him absorb this self-image. Camaraderie, cohesive training,
    good leadership, and proper discipline insulate him and prevent him from needing
    self-examination. He does not need to evaluate whether he is a fool or a wise
    man. It doesn''t matter whether or not he understands his government''s policy
    and it fits his ideology, or that he is serving more than one master. The profile
    is built and reinforced by what it takes to stay alive, stay mission focused,
    and to look out for his team.


    The rituals of his military life play a central role in his decisions and responses.
    Humans are very complex creatures with many “subroutines” running in the background.
    One sure way to short-circuit this is through rituals, rites of passage, and complex
    imagery. It plays out in social clubs and formal organizations like the Masons
    and American Legion, as well as in formal training like the military.


    On a more insidious scale it plays out during informal political rallies like
    the red (Republican) and blue (Democratic) teams in the United States as they
    prepare for ritual “war” with the other party. Watch the news feeds: US political
    rallies often have the imagery of war. The rituals of the party bond people to
    others with whom'

    # Fracturing to Differentiate or Overdifferentiate


    Fracturing is about showing difference—not a negative or a positive difference,
    just difference. How you use each of the tools will determine how the differences
    are perceived.


    +   - *Fracturing to differentiate.* This is a positive application of differences—pointing
    out areas where a member of the group has strengths that allow him to rise like
    cream. This application relies on bringing strengths to the fore—things that cannot
    possibly alienate others, or at least that''s the plan.


    +   - *Fracturing to overdifferentiate.* By *overdifferentiate*, we mean going
    so far in any direction that others in the group cannot identify with the person,
    or that he can no longer sanely identify with the group. This does not necessarily
    mean the differentiator is negative. Maybe it''s something simple: he got invited
    to the boss''s country club because he went to college with the boss''s daughter.
    That alone could make him so distinctive in the group he is in that the group
    can no longer fulfill his need. Clichés in English such as “You can never go home
    again” are rooted in this principle.


    +   - *Fracturing through illustration.* To sell a product, you have to know why
    it isn''t like other products, even if it''s just cheaper. Using the tools you
    learned in Chapter 4, you need to draw out little-known facts about your target
    to find out what makes her different. Whether you ask difficult questions only
    someone with his skill set could answer or you use approaches to provoke an'

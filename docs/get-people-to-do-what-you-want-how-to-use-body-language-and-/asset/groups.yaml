    In 1971, psychologist Philip Zimbardo invited a population of healthy, middle-class
    male college students to participate in a two-week study of the effects of prison
    life on the psyche. Arbitrarily, he divided the group of eighteen in half: nine
    guards and nine prisoners. Zimbardo''s team transformed the basement of a building
    on the Stanford University campus into a prison environment, with the added touch
    of planting video and audio recording devices so they could monitor what happened.
    Upon capture the “prisoners” were treated as real prisoners, from hearing their
    Miranda rights to delousing. The “guards” received no special training, but they
    knew their job was to enforce order in the prison and do what they thought was
    necessary to gain the respect of the inmates. While prisoners wore baggy outfits
    that looked like dresses, the guards wore khaki uniforms and sunglasses, and they
    were armed with whistles and billy clubs. Guards worked in three-hour shifts,
    but the prisoners played their parts around the clock.



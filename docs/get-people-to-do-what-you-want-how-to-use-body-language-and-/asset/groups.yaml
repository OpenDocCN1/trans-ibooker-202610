    This is a microcosmic view of what has happened in civil rights protests, anti-war
    demonstrations, and workers'' strikes. They all had faces of common enemies: a
    man in Ku Klux Klan white, President Richard M. Nixon, Sam Walton. The common
    causes embodied in the vision of a common enemy brought protesters to their feet
    and moved them to focus their anger somewhere specific.


    ## Bonding a Person to You


    What binds people together who have nothing more in common than going to the same
    college? It''s not necessarily a matter of common experiences; it''s more likely
    commons. It could be positive or negative, but when it''s positive it can accelerate
    the bonding process. Every one of us has memories, both factual and emotional,
    from previous relationships and situations, and they are the genesis of prejudices
    of which we may not even be aware. They can manifest themselves in odd ways, such
    as the dislike for an actor because of his teeth, or the desire to be close to
    a person who just happens to look a lot like your favorite elementary school teacher.


    When you perceive that someone is inexplicably drawn toward or repelled by an
    individual or situation, you can use that to either fuel the momentum or put yourself
    between the person and the perceived threat.


    This bonding factor, even as flimsy as it may seem in the example of the reporter
    from Youngstown, can cause people to divulge secrets to a stranger who really
    doesn''t care about them, as opposed to someone they know better who might be
    sensitive to their situation. The assumption is that if they have some particular
    thing in common, it grounds the relationship in a way that makes that person a
    worthy confidante.


    When Greg was young and had hair, it was red. On more than one occasion, some
    redhead would say (and mean it), “We have to stick together. People don''t like
    redheads.” That is a really lousy attempt to find common ground, but it illustrates
    how thin the connection can be and still have meaning to some people. People will
    grasp at straws when they desperately seek a way to bond.


    Discretion is a sophisticated skill that requires intelligence. When someone blurts
    out a secret or carefully takes you into her confidence, you need the ability
    to respond in a manner that reassures the person that you understand your responsibility.
    At the same time, unless you know the person extremely well, that individual who
    entrusted you with the sensitive information will likely walk on eggshells and
    hope that you don''t tell. That gives you power—power that evaporates the instant
    you do tell.


    In short, common ground leads to a bond, and your discreet respect of the exchanges
    related to that bond glue someone to you.


    ## Bonding a Person to the Group


    You could have two different dynamics at work here. First, your target might want
    to bond with the group. If you make that possible for him, he owes you. Or, he
    might have no reason to bond with that group, but you make it necessary or desirable
    for him do so, thereby getting what you want.


    The first scenario involves a classic quid pro quo. When you belong to a group
    where you have influence to get him in, he achieves not only belonging, but also
    status. What he gives you should put you even higher on the hierarchy, maybe something
    that helps you go from enjoying self-esteem to pursuing self-actualization.


    Every group develops a norm, or concept of typical, for its group. This norm can
    be mainstream for the overall culture, or so narrowly focused and bizarre that
    only initiates recognize it. The more open the group to outsiders, the more mainstream
    the group will remain. As a group becomes more cloistered, individuals within
    it'

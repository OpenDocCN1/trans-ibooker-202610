    the people at work, and his greatest strength is not at work, you may not see
    the correlation, but the correlation is there as a lever.


    Here''s how it works: He will be very proud of his grandest accomplishment, so
    you can use this pride and the tools of illustration to differentiate him in a
    way that separates him from the norm for the group. By *separate*, we do not mean
    make him feel superior or gain friends—just the opposite. You want to spotlight
    his special talent in a way that makes it seem elitist or wacky: “How''d that
    dingy race to Tangiers Island go last month, Earl?” To which he replies that it
    was a yacht race, and he can''t help but come across as snooty.



  mdcn: "\n\n所谓的鱼嘴是迎合摄像机的姿势；她这样做让那些认为她有吸引力的人觉得这种造型“合法化”了。即使不是有意为之，这个表情仍然带有文化含义，但它与刻意为之的正面效果一样负面。嘴巴不自觉地张开的人看起来似乎一无所知；这是令人震惊的愚蠢的表情。\n\
    \n## 练习：认出那种情绪\n\n在关掉声音观看情景喜剧或肥皂剧时，试着说出演员试图传达的情绪。我们推荐这类节目，因为其中常常存在夸张的情绪和情境。它们给了演员过度表演的机会，因此他们的面部表情更像是在向舞台后二十五排的观众投射的现场剧场演员的表情。\n\
    \n## 身体与情绪\n\n你可能以为仅凭面部表情就判断出了某人的情绪，但随后你会看到手臂或姿势似乎在传达不同的信息。以下是一些常见的手势，要么经常被误解，要么没有被理解为其真正的含义：\n\
    \n- **交叉双臂。** 在面向肢体语言学生的演讲中，以及在各种场合的混合观众面前，这是人们最容易弄错的手势。他们通常认为交叉双臂是一种屏障；做这个动作的人对你关闭了心扉。有时确实如此。但如果你看到一个\
    \ receptive 的面部表情并在对话中听到开放的语气，请考虑其他可能导致某人交叉双臂的原因，例如：\n  - 他们感到寒冷。\n  - 他们想遮住保养不佳的手。\n\
    \  - 他们超重或怀孕，用这个姿势遮住腹部。\n  - 他们想掩饰手臂过长或过短。\n  - 他们在主张一种主导地位。\n  - 这是一种习惯。\n\n\
    把每一种肢体语言都当作语言的一部分。记住，如果你只看到动词，你可能无法完全理解一个句子的含义。\n\n- **腿呈 4 字形交叉。** 格雷格曾被《明镜周刊》的记者仅因他倾向于这样坐，而不是像一个正派的欧洲绅士那样交叉双腿，而指责他傲慢。他的腿无法做出后一种姿势。她的判断是投射性的，而这是在解读肢体语言时你必须始终加以遏制的事情。\n\
    \n- **双手在生殖器前合拢。** 也被称为无花果叶姿势，我们可以称之为“保护珍宝”。所有文化中的男性在感到哪怕一点点威胁时都会这样做。他们在没有感到威胁时也会这样做吗？当然有可能，但要考虑到威胁有许多程度——有些是明显的和身体上的，有些是微妙的和心理上的。女性在压力下也会做类似的事情，通过交叉过\n\
    \n和流畅的插画师，手臂和手势表明接纳。你甚至可能会注意到对方对你的插画师的镜像，这表明此人感觉与你的想法同步。与此同时，你也会看到紧张的迹象，即适应器，并感到确信你正在与对方互动，同时你可能已经在相对于他方面确立了自己超典型的地位。注意点头和其他调节器所传达的信息，“是的，继续说”，作为你正在赢得他的进一步确认。\n\
    \n## 你输了\n\n你正在寻找与“你赢了”肢体语言相反的信号：封闭的、僵硬的、厌倦的和仇恨的动作。对于一个朝错误方向充满活力的某人，你可能会看到虚假的微笑，明显使用适应器暗示不耐烦——笔敲击、手指摩擦——以及表示“退后”和/或“闭嘴”的手势。或者你可能把目标逼得太紧，以至于看到绝对恐吓的迹象：无花果叶姿势、垂头、以及过度使用自我惩罚的适应器，例如抠指甲。如果你把某人激怒到试图迅速摆脱你的程度，你可能会突然看到诸如交叉双臂和双腿的屏障，或书籍或巨大的花瓶被放在你们之间。\n\
    \n对于后者类型，你会看到眉毛上扬并听到表示疑问的言语。他们会尝试表现出开放。与前者相比，你会得到更谨慎的行为。他们可能会问你很多问题并试图控制你们见面的地点和午餐时间——同时投射出开放和接纳的姿态。如果你处于一个她可以选择加入多方阵营的情境中，寻找她在你和其他人之间摇摆不定的迹象。这些包括注意力分散：在你和另一个人之间来回关注，向你们各自发送隐藏信号，或对你或你们两人投去短暂的微笑，随后迅速收敛，同时从眼角观察你。在某些情况下，这是算计的；在其他情况下，这是无意的，因为她像在马路上遇到松鼠的大脑一样在寻找平衡。\n\
    \n## 犹豫不决……或中了塔兰特勒格拉咒\n\n有些人躲闪和编织得如此熟练，以至于你很难判断他们对*任何事情*是否有正常、可预测的反应。有些人躲闪和编织是因为他们很难决定朝哪个方向走。他们的行为是哈利·波特塔兰特勒格拉咒的温和版本，该咒语会导致不受控制的舞蹈。当一个人不确定时，身体和大脑会为控制权而挣扎，结果可能看起来像他们正常行为的躲闪式故障版本。\n\
    \n可以通过简单观察此人如何移动来为身体其他部位建立基线，或者你可以像观察眼动那样把它变成一个练习。先从练习开始是个好主意，这样你就能练习有意识地观察。\n\
    \n## 练习：观察动作\n\n让你的观察对象舒适地坐着，但要处于允许移动的姿势。换句话说，柔软的沙发不是理想的地方。提出从随意到个人再到探究性的问题。随着问题的越来越具侵入性，你应该注意到身体的变化。以下是示例问题，显然应根据你交谈的对象重新调整：\n\
    \n1. 你上小学时在哪所学校上学？\n2. 你在课间休息时做了哪些有趣的事情？\n3. 你有没有和班上的孩子打过架？\n4. 你的老师有没有因为不是你的错的事情而责备过你？\n\
    5. 班上的孩子曾经对你做过最糟糕的事情是什么？\n6. 在某个时候，你一定也伤害过他们。做了什么？\n7. 你成年后有没有做过让你对自己感到厌恶的类似事情？\n\
    \n你可以用不同的方法获得相同的结果。在这种情况下，不断追问更多细节，直到此人用尽信息。那时，情绪和压力就会浮现。\n\n- *你做过最令人兴奋的事情是什么？*\n\
    - “跳伞。”\n- *为什么它如此令人振奋？*\n- “我以为我做不到，但是一旦做了，我就想再做一次。”\n- *你跳之前需要上课吗？*\n- “我们在教室里待了大约两个小时，然后接受了大约两个小时的实践训练。我们的教练非常注重安全。”\n\
    \n> 问题可以升级到如此复杂的程度，以至于只有专业人士或经验丰富的人才能回答。当你的观察对象达到“我不知道”或“我不记得了”的程度，而你继续提问时，她可能会开始感到不足，并为不知道而找借口。随着不确定性的加剧，注意身体位置的突然变化，以及手臂和腿部暗示某种情绪正在泄露的动作。\n\
    \n## 试探\n\n以下是一些让你在不明确提问的情况下获取信息的技巧。请记住，它们是明显操纵性的，应谨慎使用。在使用这些技巧时，记住确定某人的策略的练习。\n\
    \n- ***重复人们说的话。*** 只需重复某人说的话，你就能经常促使他对含义进行阐述，甚至可能迫使他承认自己说的话并不完全属实。例如：\n\n  > “我今天在路上看到八十只麋鹿！”\n\
    \  >\n  > “哇，八十只麋鹿？！”\n  >\n  > “嗯，也许五十只。我没时间数。路上很混乱。但这是我见过的最多的一次。一定是发生了森林火灾！”\n\
    \n  通过重复他的原话，他透露出夸张的倾向，至少在一次承认中如此。至少，他透露了你可以用来继续下一步的信息。相关的应用是使用他的话来\n\n"

    \ to applying this strategy.\n\n+   - *Differentiating through illustration.*\
    \ When you ask questions, tailor them in such a way that they make him appear\
    \ to be a solid member of the group with insights the other members of the group\
    \ do not have. (Leading questions can help here.) Whether the information involves\
    \ a past job, hobby, or other extracurricular activity, create a spider web of\
    \ links from him to the skill set. Use thought-provoking parallel questions to\
    \ get him to the point that he sees the correlation and brings it out, or simply\
    \ ask him what he would have done in his past job. The skill set is about allowing\
    \ him to be the hero and showing how he is supertypical in some way without taking\
    \ it to the point of a brownnoser. This healthy fracturing will differentiate\
    \ him but help him not to go too far.\n\n+   - *Overdifferentiating through illustration.*\
    \ In our modern world of anything goes and “there is no right or wrong,” people\
    \ can easily forget the fact that something can be too different. Regardless of\
    \ what they portray in public, many people are much more conservative than they\
    \ let on. We do not mean in a political sense, but rather they tolerate fewer\
    \ deviations from the norm than they care to admit out of political correctness.\n\
    +   \n+   Asking questions that push a topic to the edge provokes both revealing\
    \ answers and behaviors. Craft questions and approaches to lever someone to a\
    \ point of overreacting or sloughing off something important to the group as “nothing\
    \ more than nonsense.” One over-the-top example is using a leading question to\
    \ imply judgment: “Don't you think that parachuting off that bridge while"
  - '[PAGE 221]


    kids were walking home from school constitutes reckless endangerment?" The effect
    is to separate him from what is acceptable for the group.


    This strategy works especially well when a well-respected person has an opinion
    not based in fact or claims some guru''s thoughts as his own: "If the geodesic
    dome is such an energy-efficient model, why don''t we see more of them now that
    we''re painfully aware of the cost of energy?" You offer him the opportunity to
    explain, encouraging him if he sounds intelligent—to a point—and then switch to
    critical questioning. Then, you can choose to rescue him or let him flounder.


    Either way, your work is done, and he will either need to establish himself as
    a member of the group or find belonging elsewhere.


    +   - *Differentiating through isolation.* It is often difficult to have someone
    seem special in a hostile pool or one populated by uniquely talented fish. In
    some cases, a super-typical has used precisely the same talent that an average
    guy in the room possesses to rise to the level of supertypical.

    +   Unless the supertypical is well balanced, she may see the new guy as a threat
    and intimidate him. His safety net is having the ability to enter a smaller pool
    where he can comfortably belong. If you make that happen, you create a buffer
    between the new guy and the paranoid supertypical. Ways to do this can be a contrived
    meeting change that inadvertently removes the supertypical from the environment,
    or an invitation to the new guy to participate in something of which the threatened
    supertypical would never be. Both of these isolate your target to allow her to
    shine.'
  - "[PAGE 222]\n\n+   - *Overdifferentiating through isolation.* Some things that\
    \ are perfectly acceptable in some groups are just too much in others. Using military\
    \ language in corporate America could make someone run out of the building. By\
    \ adeptly maneuvering your target to feel as though he is safe and among friends,\
    \ you can often get your target to disclose facts that he would not in armed camps.\
    \ This works well in life and in comedy. Both rely on the fact that humans are\
    \ creatures of ritual, repeating the same things over and over involuntarily.\
    \ In the comedy *Guess Who*, Ashton Kutcher is dating Bernie Mac's daughter and\
    \ is at her house for Thanksgiving dinner. Intensely disliking the fact that a\
    \ white man is dating his daughter, Bernie Mac baits Kutcher into telling “black\
    \ jokes,” luring him with the message, “Come on, you're family now.” Eventually,\
    \ Kutcher falls into repeating joke after joke until he crosses the line.\n+ \
    \  \n+   This phenomenon of turning on the tap happens all the time when people\
    \ project that acceptance means someone is exactly like them, and will accept\
    \ them, warts and all. That's rarely true.\n+   - *Differentiating through association.*\
    \ People differentiate through association all the time by name-dropping or telling\
    \ you where they went to school. A friend from New Jersey often says that living\
    \ in Princeton makes people feel smart; you get credentials by saying, “I'm from\
    \ Princeton.” Manipulating associations can make someone appear to have more or\
    \ less value to the group. When he is a solid member of the team and knows the\
    \ boss's brother well, that might be enough to raise him up—unless the boss's\
    \ brother is similar to"
  - '[PAGE 223]


    former president Jimmy Carter''s brother, Billy, a self-proclaimed alcoholic.
    Every association the person has, whether voluntary or accidental, can make a
    tremendous difference. Look at people such as Anderson Cooper, the son of fashion
    designer and author Gloria Vanderbilt, which makes him the great-great-great grandson
    of the business magnate Cornelius Vanderbilt.


    +   - *Overdifferentiating through association.*

    +   Overdifferentiating through association has been used to drive guilt or innocence
    in courts all over the United States. If you hang out with unsavory characters,
    what does that make you? You could be Charles Manson or you could be Mother Teresa.

    +   The key here is how the spin is handled. By associating your target with someone
    who is outside the realm of understanding the group, you move the person to a
    point of isolation, and maybe closer to bonding with you or another group.

    +   In a very public way, this has occurred to George Alan Rekers, the Baptist
    minister who was a leader in the anti-gay movement until he was caught in a Miami
    airport with a male escort, and former Congressman Anthony Weiner who was notorious
    for his sexting scandals. Association with unsavory individuals or concepts leaves
    a person grasping to belong. As he tries to belong, he forgets all about being
    supertypical and tries his best to hold on. In the case of the self-actualized,
    he tries to maintain his reputation, similar to President Clinton while he was
    embroiled in the scandal involving White House intern Monica Lewinsky. Some rise
    again, as in the case of Clinton. Not usually, though.'

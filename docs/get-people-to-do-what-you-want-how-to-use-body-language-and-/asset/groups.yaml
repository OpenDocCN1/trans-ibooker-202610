    \nthe company.” 对克里斯来说，淘气有时被翻译成“好”。 \n\n淘气领导者的阴暗面表现为一种刻薄的倾向，这可能会让那些他努力保护的人感到恐惧。他们是那些自尊脆弱、对自己能力不确定的人。他让他们保持在规矩之内，因为他们永远不知道他何时会决定讨厌某种情况、回应或个人。\n\
    \n相比之下，善良的领导者不断努力建立桥梁、表达赞赏、提供赋权感，并营造包容的氛围。她践行着职场多元化顾问梅林达·埃普勒所称的*盟友精神*。\n\n> >\
    \ 盟友精神是关于理解……机会上的不平衡并努力纠正它。盟友精神是真正看到我们身边的人……首先，只是知道他们正在经历什么。然后，帮助他们与我们一起成功和茁壮成长。[^9]\n\
    \n善良领导者的问题在于他们是人——而没有人总是善良。善良的领导者在她心情不好的日子里或对结果或情况深感失望时，会让所有人措手不及。她在泄露讽刺或批评时，就会变成她的淘气对应者。\n\
    \n你的风格是什么，你又对什么风格做出反应？要设计一个获得你想要的东西的计划，你需要了解领导者如何激励你表现，以及你可以用什么范围的风格来激励他人。在任何情况下，无论是正式还是非正式的领导，只要这个人在该角色中有效，就会赋予领导者一种超典型的地位。\n\
    \n## 作为领导手段的孤立\n\n一个没有外部影响的社区，或与外界的沟通被通过个人或媒体的控制来源过滤的社区，就会变得封闭。正如津巴多在[第一章](#)中描述的斯坦福监狱实验所说明的那样，这种封闭对行为的影响可能令人震惊。无论是正式还是非正式，领导者都成为该群体的绝对权威，成员们寻求他的认可。\n\
    \n如果非正式领导者突然夺权，结果很可能是流离失所；正式领导者会看到大规模外流。20世纪中期德国战时和战后的人才外流就是后者的一个例子。玛丽安参与了她曾工作过的剧院公司的一次外流。董事会仓促决定在季节订阅资金到位之前暂停员工和演员的薪水。不仅这是一个非法举动（“总是会有失业救济……”，），而且还不尊重到足以导致十名员工中有六人离职。\n\
    \n一个极具魅力的领导者可能比其他人能多抵挡一段时间不可避免的结局，但问题不是是否，而是何时。如果他能坚持足够长的时间来启动群体的标准转变，那么与社会规范的断裂是必然会发生的。如果他不能，那么他的尝试就会失败。\n\
    \n只要有足够的时间，即使领导者并不特别有魅力，他也可能通过诉诸集体信念并改变它们来利用群体思维从而制造个人崇拜来实现扭转。换句话说，他改变了群体的集体意识。这就是在\n\
    \n从更大的教会社区分裂出来的会众中发生的现象；随着他们更紧密地依附于牧师的思维模式，他们对伞形组织的政策和做法的批评也越来越大。\n\n由于归属和差异化的需求塑造了我们作为人类做出的许多决定，我们有责任关注我们生活中那些有潜力满足这些需求的人。在宏大的层面上，他们是我们公司和政府的强加领导者。但那些执行社区公约或在扶轮社会议上夺取权力的人，对与满足这些需求相关的幸福感的影响可能一样大——甚至更大。问问自己：她为什么对我有如此大的影响力？她是在行使赋予她的权威，还是我在放弃权威？她真的有魅力，还是我由于环境而认为她有魅力？如果你是掌权者，注意这种动态并磨练你的技能。如果你不是正式掌权者，绘制这种动态并利用它来打磨他人对你的看法。\n\
    \n这一知识的现实应用可以帮助收购其他公司的公司。平衡的举措是何时撤出关键领导者。过早撤出会造成大规模外流和员工脱离；撤出太慢则新公司的文化永远无法扎根。这就是为什么收购二十年后的公司仍然自称“旧\
    \ X 团队”。\n\n## 第三章\n\n## 魅力的机制\n\n人类经常忽视其他人类身上最明显的东西。作为人类行为的研究者，我们很像在黑猩猩中研究的简·古道尔，只有一个例外：我们也是黑猩猩。所以即使我们对人知道不少，也会因为陷入人类互动的交织中而忽视基本的东西。\n\
    \n当普通人遇到一个极具魅力的人时，他们对这个人有什么印象？每个人在遇到一个明显有魅力的人后都会以非常相似的方式讲述这个故事，无论这次相遇是否顺利。无论是“他让我觉得我就是房间里唯一的人”，还是“他让我觉得他是神圣的”，它总是关于一种*感觉*而不是事实。\n\
    \n邪教和真正的宗教教派领导者的追随者都曾描述*他们*的领导者为神或神一般的人，就像追随马哈拉吉的乔·惠伦一样：“我相信他是上帝的活生生的化身，”他在[www.ex-premie.org](http://www.ex-premie.org)网站上发帖说。然后，他继续详细描述他的感受：“当我被允许进入阿育王时，我感到高兴、兴奋，并且因为他，这位完美大师，给我的机会而感到特权。”\n\
    \n我们考虑了所有邪教领导者，以及他们每个人都被描述为有魅力的。研究了戴维·科雷什，他明显面部表现出情绪障碍、发狂的查尔斯·曼森、偏执的吉姆·琼斯，以及在休斯顿精神病院遇见“波”半的“波-皮普”邪教领导的马歇尔·阿普怀特后，我们问：“这些人怎么会被认为是有魅力的？”他们是否在应用某种技能？它能否被规范化？这是故意的吗？化学性的？我们也开始寻找这个词*魅力*的一个好定义。\n\
    \n直接查字典中*魅力*的定义。 Merriam-Webster 在线词典将其定义为“一种特殊的磁性魅力或吸引力”。其他条目暗示魅力有点像蛇油。它通常不被讨论为人类天生的东西，尽管我们中有些人可能天生就有。\n\
    \n所以这里再次出现了固有的不合逻辑的挑战。你如何在自己身处他的或她的咒语之下时研究某人使用的魔术？答案可能类似于亚瑟·克拉克的魔术定理：任何足够先进的技术都与魔术无法区分。\n\
    \n我们所做的是尽可能退后一步来分析魅力。我们的结论是，它更多是技巧而非魔术。\n\n由于定义魅力具有挑战性，并且总是以感受来指代，我们好奇的天性试图以逻辑术语来定义它。我们从这样一个前提开始，如果你无法定义某物，那么你怎么知道它存在？如果它真实，你可以看到它的效果。在这种情况下，效果是一种感觉。接受它作为这种难以捉摸的性格特征存在的证明，下一步是像对待所有其他人类特征一样看待它，作为一个过程或一系列过程。\n\
    \n"

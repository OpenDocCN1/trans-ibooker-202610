    THANK YOU TO the team at Red Wheel/Weiser and the Career Press imprint, specifically
    Michael Pye and Laurie Kelly for all the support.


    Stumbling into Don Landrum at the start of my interrogation career led me to some
    of the conclusions in this book, whether he knew it or not. Thanks to Dina for
    keeping me centered and to Mike for helping to keep things going when I cannot
    be around. Maryann, thanks for being a great partner in putting these complex,
    sometimes very dark, concepts down in writing.


    Every concept we discuss here is playing out in interrogation rooms around the
    world as professional interrogators apply these concepts to get others to tell
    them the truth. The few rank amateurs who resorted to the unspeakable have tarnished
    the reputation of these professionals who protect you on a daily basis. These
    professional interrogators often find the danger and report it before it is too
    late, but cannot ever disclose it happened. To these people who protect the good
    citizens of the world from the unthinkable, I am grateful.


    —Greg



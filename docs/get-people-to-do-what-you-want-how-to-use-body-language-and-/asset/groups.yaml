    how far to push or when to back off.


    ## Body Language/Baselining


    A fundamental skill you will need in order to use all the tools in this book effectively
    is *baselining*. Baselining means determining how a person behaves and speaks
    under normal circumstances. Only when you understand what is normal for your target
    can you spot a change.


    What''s normal? In a situation with little or no stress present, people will use
    the vocal tone and cadence, word choices, and movements that are normal *for them*.
    That doesn''t mean what *you* consider normal, or what you think should be normal,
    but what is normal *for them*. Greg can say things such as, “That''s the worst
    example of butt snorkeling I''ve seen this year,” and people in a meeting won''t
    think that''s odd. They''ll think, “That''s Hartley.” If Maryann said that, people
    would think she was (a) drunk, (b) imitating Greg, or (c) extremely nervous. Step
    one in baselining, therefore, is to engage a person in an environment, and in
    a topic, that keeps the exchange relaxed, or at least makes few demands emotionally
    and intellectually. Use nonthreatening questions that start the conversation on
    a relaxed note.


    When you baseline, it''s a deliberate action. You set up a situation in which
    you converse and move with intent. As a result, you gain significant knowledge
    about a person''s behavior, speech patterns, body language, and energy level.
    This baseline gives you a template for using the other tools in the interrogator''s
    tool box. When you see change, you know the other tools are working. By learning
    to baseline you add to your skill set and compound the effectiveness of the other
    tools.


    ### Voice


    To baseline the voice, listen for tone, pitch, cadence, word choice, and use of
    filler sounds such as *um* and *ah*, or filler words such as *like*, *basically*,
    or any other meaningless placeholder.


    - ***Tone.*** If your mother said, “Please go outside” to you as a child, her
    tone of voice told you everything you needed to know. With a calm, quiet demeanor,
    it could be an invitation to see a new puppy. But with a clipped, harsh tone,
    it could suggest a strong, sarcastic warning not to touch the door handle. Tone
    is about lilt of voice and stress on words. Tone indicates the meaning of words,
    regardless of which words were spoken. If you have a pet, tell your pet in happy
    tones, “I am so mad at you, I''m going to give you away to a stranger.” What''s
    his response? The tone makes it all sound like, “I love you, Fluffy.” We have
    all heard this admonition from a parent or partner: it is not what you said, it
    is how you said it.

    - ***Cadence.*** The rate at which someone speaks correlates to what''s going
    on in his head. Determine his normal pace and listen for change. A New Jersey
    native in Georgia stands out, as does a Georgia native in New Jersey. Once you
    establish his norm, deviations indicate something has changed in his head.

    - ***Pitch.*** Agitation, passion for a topic, and uncertainty all cause the pitch
    to rise. Again, this is a common response to such emotions, but the point is that
    you become aware of the shift. John Lovitz


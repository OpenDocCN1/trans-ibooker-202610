    time constraints; he has the luxury of control, whereas you have the luxury of
    time.) Based on the chain of events that led to the situation, the prisoner''s
    options are very limited. The interrogator may take the road of trickery by asking
    the prisoner to give him something of dubious value and then making the prisoner
    feel as though he gave up a great deal of information. The interrogator then uses

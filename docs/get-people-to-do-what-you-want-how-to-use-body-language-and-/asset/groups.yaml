    places or the wrong places, it tells you something about how vested the person
    is in the topic, and it could point to stress about the issue being discussed.
    Put emphasis on the italicized words in the previous paragraph and you get the
    sense the person is enthusiastically overcompensating. But put just as much emphasis
    on every word in the sentence, and you''ll come up with someone who sounds desperate,
    angry, or some other extreme emotion. In all cases, that points to stress.


    +   - ***Glossing over a topic.*** Sidestepping a topic or smoothly sliding around
    the meaning of a question to move on to a more comfortable subject indicate the
    person wants to hide information. How many times have you seen a politician or

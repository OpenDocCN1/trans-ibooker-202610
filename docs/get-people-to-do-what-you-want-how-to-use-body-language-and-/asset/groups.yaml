    interview? “Good question, Mike! I have a story that will illustrate where I am
    on that topic.” This statement is followed by a journey down the rabbit hole.


    +   - **_Bridging a timeline._** Making a timeline leap while telling a story
    or answering a question alerts an active listener that you have some reason to
    be uncomfortable with the topic. It''s a perfect setup for a lie of omission.
    “Sorry I''m late. I met with the client all morning and then came straight here
    for the meeting” might raise eyebrows if the client''s office is two blocks away
    and the meeting he''s late for is at 3 p.m.


    +   - **_Switching to passive voice._** This is a great way for someone to put
    distance between herself and a topic; there could be lots of reasons for doing
    this. One might be fear of punishment, like the little kid who says, “The Richardsons
    had their window broken while we were playing ball.” Translation: “Someone hit
    a ball through the window, but I''m not telling you who did it.” It could also
    be a way of muting the pain that an active retelling of an event would bring:
    “My brother was murdered.” The passive way of presenting the information softens
    the statement and avoids sharing a stark description of a brutal killing.


    +   - **_Shifting cadence._** When people get excited, they tend to speed up a
    bit. Shifts in cadence can suggest a lot of the other conditions, too. Maybe the

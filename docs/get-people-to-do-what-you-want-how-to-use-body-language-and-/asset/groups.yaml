    to clean toilets with their bare hands, the experiment ended. Thinking that no
    one monitored the video after regular hours, night shift guards concocted such
    degrading and pornographic punishments that the researchers knew normally no longer
    mitigated their behavior.


    > On his website devoted to the prison experiment Zimbardo asks: “How could intelligent,
    mentally healthy, ‘ordinary’ men become perpetrators of evil so quickly?”


    He concluded the following about the fundamental issues of bonding and fracturing:



    traits 看起来像钟形曲线，可以叠加成 3-D 图像：


    ![](img/ccd9d9c31a1b4bf629dd84c4b7e079d5_155_0.png)


    如果你想在这个获奖的表演者和成就卓著的商人身上获得杠杆——他几乎处于电影演员和商人类别的巅峰——你可能会关注他的事业。你能做什么来提升他作为环保主义者或癌症根除倡导者的知名度？如果你采用积极的方式让某人做你想让他做的事，你将他推向名人中这些事业的“超典型”领域的行为，可能会给你带来一些独特的影響力。我们说“可能”是因为我们仅将其作为这个过程如何运作的例子，而不是它对瑞恩·雷诺兹具体如何运作。


    你可以在办公室环境中对 CEO 这样做，通过针对她的事业，然后邀请她在该慈善机构的筹款活动上发表主题演讲。玛丽安的朋友采取了另一种方法：她关注老板对身体健康的热爱，邀请他作为她的客人去一家拥有顶级教练的健身房。此后她收到了他很多午餐邀请，以及圣诞奖金。这就是差异化的积极面。消极面就是在健身房里跑得比他快、举得比他多。


    以创建 3-D 钟形曲线所需的审视程度来剖析一个人的练习，也可能对你产生一些令人惊讶的结果。你可能会意识到或发现关于一个人的某些事情，让你对与他合作有不同的看法。你可能会决定，旨在建立联系的尊重方式比把他推开更自然，反之亦然。


    某人在 3-D 钟形曲线中看起来很平衡的原因是，他们通过在某些领域排名超典型，而在其他领域处于次典型来补偿。瑞恩·雷诺兹的例子暗示了这一点。看看你所熟知的人——无论是通过名声还是个人——在成就和未竟事业之间的这种混合。托马斯·杰斐逊，例如，不仅担任美国第三任总统，而且还在园艺、建筑、考古学、古生物学、文学和教育等领域脱颖而出。他在个人生活中的超典型程度要低得多：在结婚十年后，他的妻子去世，他再也没有再婚；与她的六个孩子中，有四个在出生时或婴儿时期去世。简而言之，他可以将大部分黄金岁月奉献给一切，除了家庭和家。如果你在大型办公室工作，你可能至少遇到过一个自愿加班并在生产上表现出色的人，但回家时没有人等他（或不想回家等在那里的人）。


    你对这样的人超典型领域的了解更多，因为人们通常会以他们希望别人看到的优势为先导。所以当你看到某人投射出近乎超人的成就量时，就要寻找他表现不佳的领域。很多时候，最平衡的人在任何特定领域都不会是过度成就者，因为他们一生都在做各种事情的少量。


    当你在大脑中绘制一个人的 3-D 钟形曲线，而超典型领域的跨度似乎巨大时，你需要继续探究以完成全貌。他们在次典型领域的范围可能同样广泛。他们在其他事情上表现出色，并在别处为此付出代价。


    ## 创建钟形曲线


    我们告诉过你，审讯人员会用警卫、摄像头和麦克风收集信息，但由于你没有这些，你需要魔法。这种魔法就是熟练使用第 4 章中介绍的工具。在本节中，你将练习它们来建立融洽关系、建立基线并收集信息，以便为你的目标创建
    3-D 钟形曲线。



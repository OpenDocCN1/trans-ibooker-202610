    along a conformist. After all, she either moves or becomes an anti-establishment
    type. When differentiating, her drives will be to become a more solid participant
    in the group; when she is sufficiently differentiated as to no longer belong,
    she will need a new place to “belong.” Belonging is powerful.


    If he is an anti-establishment type, let him in on “the vision” and how you plan
    to do things. If you can make him a true believer, he can become a soldier in
    the cause. Simply understanding the psyche of the anti-establishment type allows
    you to target him as well. Most anti-establishment types believe there is a better
    way. Once those people truly become invested in the outcome of the group and stand
    to lose, they rarely continue to stir the pot. To paraphrase the social author
    Eric Hoffer, people with Happy Meals and cable TV do not revolt. Causing the anti-establishment
    guy to belong squarely in the group and allowing him to “change things from the
    inside,” you co-opt his passion and create a soldier for the establishment. You
    simply have to remember to tend his fire, or he will stagnate and become an opponent.


    # Know-It-All Versus Guru-Seeker


    The know-it-all takes bits of information, whether relevant or not, and applies
    them to the situation. In many cases, he does this by relying on the fact that
    he has been “more right” than others in the past (like our five feet three friend,
    who was taller in the past). Despite the fact that he may actually know more about
    some things than others, his need is to know more about all things than all others.
    Not surprisingly, the know-it-all gets wound up when he meets someone who may
    actually know more than he does. Whether it is because he went to a better school
    (or simply lived near Princeton or Harvard), has more experience, or just “knows
    the business” better than you do, you'
  - '[PAGE 139]


    encounter this type commonly in the workaday world. He is an archetype; he is
    Cliff the mailman on *Cheers*. This type''s sense of belonging and esteem comes
    from the deference he receives from others for being a font of information. That
    shapes his very identity. In some cases, he doesn''t suffer from intellectual
    narcissism, rather he is insecure and well aware that he is full of crap, but
    hopes secretly that others do not notice. By using the tools described in [Chapter
    4](#), you can probe to determine which state is true for him and plan accordingly
    to move him farther up or down the hierarchy.


    The guru-seeker wants enlightenment from an approved source to claim the validation
    as his own. No amount of knowledge, performance-based achievement, or success
    will give this person the same amount of joy and validation that quoting the Maharaja
    will. He needs to know that what he is saying comes from an enlightened one. The
    danger for this type is that gurus can come from all walks of life and the trustworthiness
    of his guru is dependent upon his selection criteria. The guru may just be a know-it-all
    who has been elevated by deference of others and, by using the snowball effect,
    has leveraged himself to guru status. On the other extreme, if the guru-seeker
    fulfills his needs and gets continuous validation from the Wise Ones he approaches,
    he can get to the point at which he looks down on others who have not shared the
    presence of the guru.


    A practical example of this is an acquaintance of Maryann''s who worked for the
    group that promoted Buckminster “Bucky” Fuller''s work in sustainable and renewable
    technologies. Fuller, best known for his design of the geodesic dome, had died
    by the time this person got involved in the work, so he never even met his guru.
    Nevertheless, the gospel according to Bucky ruled his life and nearly everything
    that came out of his mouth. A'
  - '[PAGE 140]


    common response to people who criticized him was, “Bucky was a genius. You wouldn''t
    understand.”


    When a guru-seeker gets to this point, he begins to understand the world according
    to his guru better than anyone else. In effect, he becomes a sort of demi-guru,
    as he feels justified to enlighten lesser beings. In effect, he can serve as the
    guru''s gatekeeper to ensure that, although the path is wide, the gate is so narrow
    that few can pass through it.


    If you tell someone with cockeyed confidence in his facts that he got something
    wrong one of three things will happen. First, he gets defensive and dances around
    the mistake, very likely trying to maneuver you into thinking that you misunderstood.
    Second, he crashes through the floor of the Maslow level he''s on—maybe reputation—and
    now seeks nothing more than belonging. Third, he becomes aggressive and attacks
    you, but probably not on the same point you challenged. You tell him what he said
    about elephants is wrong and explain why, and he lashes out by saying that you
    dropped out of high school. That''s exactly what this Bucky-adoring acquaintance
    does; as a result, he has to move quickly from one circle of “lesser beings” to
    another.


    Understanding where each of these fits in the hierarchy will help you determine
    a best course of action. Based on several factors, her personality will dictate
    whether that information is valuable and actionable. These factors include: authority
    of the source, deference (in both directions) with the source, and style of delivery.
    It is often easier to get concession from a know-it-all when she is allowed to
    incorporate the new knowledge into her lexicon, so asking leading questions and
    letting her divulge the importance of what you know fits her style of understanding
    without resistance.'
  - '[PAGE 141]


    With the guru-seeker, establishing yourself as the one to which she should be
    deferred, or quoting Nostradamus-like prophecies, will get you further than blurting
    out facts. Think about evangelists who don''t offer a single fact or personal
    insight but win people over by quoting the Scriptures. By establishing that your
    knowledge is simply borrowed from a sage, you get more approval than trying to
    say you are the guru. Guru-seekers only follow those with a following—until they
    understand that they can be nothing more than a messenger.


    # Traditional Versus Trendy


    In the extreme, both traditional and trendy are first cousins to pretentious.
    This has more to do with how people are grounded than what their tastes are. Do
    they need the approval of past heroes to validate their choices, or is the opinion
    of supertypical humans alive today good enough to override the judgment of generations?
    Some people can get caught up in trends and still label themselves *traditional*.
    Social pressure is powerful.


    Sherry touted the everlasting supremacy of classical music. Because it had survived
    for hundreds of years over its contemporaries, she said it was clearly worth more
    than modern music. The counter to this is that anything on Spotify can theoretically
    survive as long.


    Traditionalists trust the known and believe that things have evolved the way they
    have for a reason. Whether they realize it or not, they espouse a belief that
    the accidents of history involving groupthink are more profound than the groupthink
    of today. The outward appearance of the group is to lean on traditional means
    of dress and trappings of authority, to lean toward old ways of doing business,
    etiquette, and eating. When others adopt corporate casual, they stick to the high
    end, wearing starched shirts and slacks instead of khakis and golf shirts.'

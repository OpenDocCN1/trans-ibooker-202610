  ### 第3步：创意、创作者和内容


  **创意**


  一切开始步入正轨，是时候为你的活动、项目或推广勾勒出创意概念了。这将是你信息传达、定位以及简报中向创作者和影响者提出要求的基础。


  正如第4章《创意的艺术与科学》所讨论的那样，将新的、富有想象力的想法变为现实，实际上是一种艺术形式。因此，我们手头并没有万无一失的公式。相反，建议从那些在类似活动策略中成功运用创意想法的人身上寻找灵感。这也是创意机构（或内部创意团队）能够大展身手、价值千金的地方。


  考虑到这一点，以下问题可以帮助激发你的创意，并找到一个能与创作者、他们的社群以及你的客户产生共鸣的信息。


  - 关于你的目标受众或行业，你是否有任何独特的洞察¹⁰？

  - 基于这些洞察，机会在哪里？

  - 当下文化中有哪些流行且相关的内容？

  - 什么能与你的受众在更深层次上产生连接，并跨越文化边界？

  - 什么能与公众建立情感连接？

  - 什么话题因其共鸣性和意义而具有讨论价值？

  - 什么能够吸引、分化、激发或娱乐创作者的受众？


  最后，你需要考虑你所识别和提议的内容，对参与的影响者来说是否切实可行、便于制作和执行。当你确定活动的创意概念后，将这三个问题的答案进行总结。


  **表7-6. 洞察-机会-创意问卷**


  | 问题 | 答案 |

  |---|---|

  | 独特的洞察是什么？ | |

  | 机会是什么？ | |

  | 创意是什么？ | |


  回答这三个问题将有助于内部甚至外部利益相关者看到全貌。最后，确保创意概念与你前面第1步和第2步中概述的营销目标、目标受众、成功定义和活动策略保持一致。


  **创作者选择流程和内容类型**


  有了创意概念后，是时候为你的活动找到合适的人才，并匹配合适的内容类型。在此框架的语境下，你只需确定指导活动执行的参数——而不是一份具体的影响者或创作者名单。


  他们位于哪里？他们的个性特点如何？他们与你的品牌共享哪些价值观？他们属于哪些品类？每位影响者将创作并发布多少条内容？你将与少量影响者（每位都有更多受众）合作，还是相反？见表7-7。



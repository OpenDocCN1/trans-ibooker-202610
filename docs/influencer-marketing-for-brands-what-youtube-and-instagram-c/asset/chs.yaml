  \ |\n\n考虑到这一点，本节其余部分将重点帮助您尽可能找到最适合品牌的人才。我们将聚焦于您在为营销活动寻找合适人才时需要关注的变量、特征、方法论和问题——然后您可以寻找能够满足您需求的合适工具、平台或合作伙伴。\n\
  \n## 建立属于您的人才库\n\n如您所见，YouTube和Instagram等平台上有着数以百万计的有才华、有影响力的内容创作者。尽管通过使用相关的筛选条件（如类别、触达范围、互动率、人口统计特征、受众，甚至品牌亲和力）来缩小搜索范围，您仍不禁会怀疑这是否是一种可持续的长期策略。结果本身没有问题，但这种方式意味着您每次都要从零开始，非常耗时且效率低下。那么，您如何在这场浩如烟海的数据中大海捞针的游戏中取胜呢？\n\
  \n您需要玩一种不同的游戏。\n\n与其为某个特定的营销目标或活动踏上寻找创作者和意见领袖的征途，您的短期和长期目标应该是建立自己的达人资源池。不要将其误认为大使计划（尽管这确实可能是结果之一），人才库就是一组您可以长期和短期激活的个人，以满足您的业务和营销目标。这种方法还有几个额外的好处（如下所述），并将降低您在影响者营销上的整体成本、时间和精力。\n\
  \n自上而下的漏斗方法与前面提到的方法类似，但结果截然不同（图 3-6）。\n\n![](img/7ec2733715193510646aec32cc18284f_46_0.png)\n\
  \n**图 3-6.** 自上而下的漏斗，人才库\n\n## 人才库框架\n\n人才库策略的最终目标是*提升*您的执行速度、质量、竞争优势和商业影响力，并实现规模经济。同时，您将*减少*内部政治斗争、风险，以及来自其他品牌争抢同一批创作者的直接和间接竞争。最棒的是什么？在我看来，这项工作可以而且应该在一切具体的上市策略和营销活动之前，甚至在任何已批准的媒体预算之前就充分展开。您的最终目标是在任何潜在活动或营销计划之前，建立一个由有才华的创作者或意见领袖组成的人才库。这可以与实际活动结合，但并非必须如此。我将通过一个虚构但真实的例子，带您走完整个过程。\n\
  \n## 直营母婴产品品牌\n\n市场：美国、英国\n目标受众：千禧一代父母\n潜在目标：内容创作、用户考量、网站销售\n目标：在Instagram上建立100位创作者的人才库\n\
  \n我想先从研究最终目标开始。我了解我的品牌、市场、受众、目标和指标。在这个例子中，我希望在Instagram上建立一个100位创作者的人才库，可以短期或长期激活。\n\
  \n## 研究最终目标\n\n- [ ] 人才初选名单已获得所有相关利益方的批准。\n- [ ] 为每一位人选制定好了薪酬结构。\n- [ ] 他们的价值观、风格和内容与我的公司或营销目标一致。\n\
  - [ ] 互动率、触达范围和其他相关关键绩效指标与我们的潜在目标相符。\n- [ ] 人才库的受众是正确的目标受众。\n- [ ] 响应性和亲和力——明确表达了与我们合作的兴趣。\n\
  - [ ] 专有的漏斗洞察（例如，谁带来了销售、品牌提升、内容贡献等）。\n\n如果目前觉得这一切难以实现，不要担心如何落实，我们稍后会详细讨论。我们要做的第一件事是识别整体机会。与我们之前关于YouTube上游戏频道的例子类似，这是一种自上而下的方法。不一定非得如此，但我发现这种模式比相反的方式更有效。见图\
  \ 3-7。\n\n![](img/7ec2733715193510646aec32cc18284f_48_0.png)\n\n*美国、英国的父母，在Instagram上拥有至少2万名粉丝和3%的互动率\n\
  \n## 图 3-7. 自上而下的漏斗，Instagram示例\n\n如您所见，在我们的垂直领域中，总共识别出2,665位潜在创作者。他们是位于我们目标市场的父母，拥有可观的粉丝数量和互动积极的受众。他们不一定与我们的价值观和受众群体完全契合，甚至不一定有兴趣与我们合作，但这仅仅是个起点。\n\
  \n这可能一开始让人望而生畏（特别是如果您从未与合作伙伴、软件即服务或在线平台合作过），但请相信我——您会比想象中更快速地将广泛的选择范围缩小为一份精炼的入围名单。而且您正在为长期与这个人才库合作奠定基础，因此前期的投入是值得的。您正在解决第一个瓶颈，以解锁一种有效且可扩展的影响者营销方法——不仅仅是针对一场活动，而是着眼于未来多年。\n\
  \n在微观经济学和商业中，规模经济的概念是指当公司增加生产或产出时，应能实现单位成本的降低。这个概念同样可以应用于影响者营销，以提高您的效率。单位成本的降低源于总产出的增加。规模化通过诸如与顶尖表现人才建立长期合作等策略来降低成本，而构建可持续人才库的长期方法（而非一次性的活动）会降低您的整体成本。\n\
  \n当您缩小选择范围时，特别是如果您的团队不止一个人，您必须确保对风格、多样性、情感倾向、价值观等方面有明确的定义。没有什么比团队中一半人反对另一半人认为完美的方案更糟糕的了。如果其他团队的利益相关者也提出意见，请确保他们的反馈得到客观评估。\n\
  \n在这个虚构的例子中，我的下一步是分析我更倾向的入围名单的受众。为此，我会使用一家专门分析和描绘社交媒体受众及人口统计特征的第三方公司或工具。比如Demographics\
  \ Pro⁷、HypeAuditor⁸，以及我自己公司提供的受众洞察工具⁹。\n\n值得祝贺。我们已经确定了一大群我们愿意合作的有才华的意见领袖和创作者。您的其他内部利益相关者已经批准了您的入围名单（呼！）——一个常见的瓶颈和耗时点，在可预见的未来被消除了。您和您的团队现在可以比以前更快地执行。但请记住，我们的最终目标是建立一个100位创作者的人才库，既要提升影响力，又要减少摩擦。事情已经在推进，但最好的还在后头。\n\
  \n## 双向选择\n\n2019年8月，我的公司对来自67个国家的2,000多名意见领袖进行了调查，以了解他们在寻求与品牌合作时的决定因素。\n\n**表 3-5.**\
  \ 品牌合作的决定因素\n\n| 因素 | 受访者比例 |\n|---|---:|\n| 报酬多少 | 14% |\n| 我了解他们的产品/服务有效 | 27%\
  \ |\n| 我之前听说过他们的品牌 | 3% |\n| 他们的核心价值观与我的相符 | 34% |\n| 他们给予我创作自由 | 23% |\n\n诸如金钱、名气甚至创作自由等因素，都被拥有共同核心价值观这一因素所超越。这并不意味着其他因素可以被忽视，但这恰恰表明，为您的品牌寻找合适创作者的严格筛选过程，其成败同样取决于一个同样严格的……\n\
  \n\n\nvetting process of your brand. Additionally, you’ll create a massive unfair\
  \ advantage for your company if you can demonstrate to influencers and creators\
  \ that you understand their point of view, something we’ll cover in depth in Chapter\
  \ 5: Creator-Centric Strategies.\n\nThus far, we’ve narrowed down our selection\
  \ by roughly 80%, from 2,665 to 500 creators. They fit the criteria of our talent\
  \ pool to perfection. Let’s see if the same can be said about our brand. If you\
  \ examine the top-down funnel numbers outlined in the beginning of our fictitious\
  \ example, you’ll notice that we’ve planned for a final steep drop-off. As outlined\
  \ in our previous checklist, you’ll want to identify who’s responsive and share\
  \ your core values along with a clearly expressed interest in working with your\
  \ brand. We took a pass on roughly 80%, so it’s only fair to assume that 80% of\
  \ creators will do the same with us. It’s perfectly understood if the process of\
  \ reaching out to hundreds of influencers just to have them qualify you may seem\
  \ overwhelming or even impossible, especially with all the previous work leading\
  \ up to this stage. We’ll cover exactly how to engineer each step of the way in\
  \ Chapter 6: Relationships at Scale. You’ll probably be surprised when you realize\
  \ how easy this part actually is.\n\nRemember, the goal is to have those on your\
  \ final shortlist raise their hand and let you know if they want to work with your\
  \ brand as much as you’d like them to work with you. This is also an opportunity\
  \ to identify other variables that can’t be assessed without their input. Do they\
  \ work out at a local gym? Go to festivals? Like their current smartphone? Own a\
  \ smartwatch? Use Cannabis? Drink alcohol? Eat meat? Plan to renovate their bathroom?\
  \ Yes, these are all real examples. And when you know the answer, and they’ve raised\
  \ their hand and confirmed that your values are aligned with theirs, you’ll never\
  \ have to look for a needle in a haystack ever again.\n\n## From commodity to valuable\
  \ asset\n\nBy narrowing your search from millions, to thousands, to hundreds, you’re\
  \ playing a different kind of game. You now have a talent pool of creators, or influencers,\
  \ “owned” by your company. Rightfully, these amazing individuals don’t “belong”\
  \ to you in any shape or form, but you’ve transformed a commodity into a valuable\
  \ asset. But this is just the starting point.\n\nLet’s assume that you activate\
  \ all 100 influencers in your talent pool for a campaign where the goal is to drive\
  \ sales on your website. Each campaign participant is given a promotional code that\
  \ their followers can use when they shop on your website. After a week, you analyze\
  \ the outcome of your campaign. Suddenly, you have a data point and insight that\
  \ nobody on the planet had last week. You know who sold products and who didn’t.\
  \ You know who the bottom 20% are (that you likely shouldn’t engage for a second\
  \ similar campaign with a similar objective), who the middle 60% are (that help\
  \ you establish an average benchmark), and who your top performers, the top 20%,\
  \ are (most valuable distribution, undervalued assets). See Figure 3-8.\n\n![](img/7ec2733715193510646aec32cc18284f_51_0.png)\n\
  \nFigure 3-8. From commodity to valuable asset\n\nThe same principle can be applied\
  \ to measure other marketing funnel KPIs like reach, brand lift, website traffic,\
  \ engagement, lead generation, or app installs. If you were to replicate the very\
  \ same campaign, with the very same structure, and change nothing but to exclude\
  \ the bottom 20%, you’ve suddenly skewed the odds to somewhat in your favor. Double\
  \ down on the top 20%, and you’re Billy Beane in Moneyball.¹⁰\n\n## The power of\
  \ the long tail\n\nAmazon, Spotify, and Google have all built their companies on\
  \ the premise of the long tail. The concept, in the context of business, was popularized\
  \ in 2004, when Wired editor-in-chief Chris Anderson published an article entitled\
  \ “The Long Tail.”¹¹\n\nIn his article, Anderson argues that our culture and economy\
  \ is shifting away from a focus on a relatively small number of hits (the head of\
  \ the demand or distribution curve) toward an infinite, or at least rapidly expanding,\
  \ number of niches in the tail (collectively with a larger market share than the\
  \ head). He expanded his reasoning and published a book in 2006, The Long Tail:\
  \ Why the Future of Business Is Selling Less of More. The book entered the New York\
  \ Times bestseller list the same year, and the theory of the long tail has since\
  \ been commonly adopted in business, economics, and marketing to explain how a sufficiently\
  \ large number of niche players (books on Amazon, songs on Spotify, and web pages\
  \ on Google) can compete with the large powerful few—in a world where markets are\
  \ decentralized to match unlimited variety of both supply and demand.\n\nI’ve been\
  \ fascinated by the long tail since Anderson first published his book, and his theories\
  \ have personally given me an edge more than once, specifically in web development,\
  \ e-commerce, and search engine optimization. As such, when co-founding our business\
  \ in 2016, some 10 years after the book made the bestseller list, I couldn’t help\
  \ but wonder if the very same reasoning could be applied to the world of influencer\
  \ marketing.\n\nLikely, there’d be a small number of *hits* (social media creators\
  \ with millions of followers) and a collectively larger number of niches in the\
  \ tail (social media creators with tens of thousands of followers). Tables **3-6**\
  \ and **3-7** are based on analysis conducted across the 12,000 most popular social\
  \ media accounts on Instagram¹² and validate this thesis. There’s a clear head (500\
  \ creators with more than 10 million followers) and tail (12,000 creators with more\
  \ than 1 million followers), and that’s just the tip of the iceberg. Go further\
  \ down the tail, and it’s evident that the market share of the tail clearly outweighs\
  \ the head (detailed in Figure **3-9**)—and this makes all the difference in the\
  \ world for us marketing professionals.\n\n**Table 3-6.** Distribution of creators\
  \ with more than 1 million followers on Instagram\n\n| Followers | Total Creators\
  \ |\n|---|---:|\n| 10,000,000 | 500 |\n| 9,000,000 | 600 |\n| 8,000,000 | 700 |\n\
  | 7,000,000 | 800 |\n| 6,000,000 | 1,000 |\n| 5,000,000 | 1,300 |\n| 4,000,000 |\
  \ 1,800 |\n| 3,000,000 | 2,700 |\n| 2,000,000 | 5,000 |\n| 1,000,000 | 12,000 |\n\
  \n**Table 3-7.** Distribution of creators with between 10,000 and 1 million followers\
  \ on Instagram\n\n| Followers | Total Creators |\n|---:|---:|\n| 1,000,000 | 12,000\
  \ |\n| 900,000 | 13,500 |\n| 800,000 | 15,500 |\n| 700,000 | 18,000 |\n| 600,000\
  \ | 22,000 |\n| 500,000 | 27,000 |\n| 400,000 | 35,000 |\n| 300,000 | 50,000 |\n\
  | 200,000 | 80,000 |\n| 100,000 | 160,000 |\n| 90,000 | 190,000 |\n| 80,000 | 210,000\
  \ |\n| 70,000 | 250,000 |\n| 60,000 | 300,000 |\n| 50,000 | 350,000 |\n| 40,000\
  \ | 450,000 |\n| 30,000 | 550,000 |\n| 20,000 | 820,000 |\n| 10,000 | 1,500,000\
  \ |\n\n![](img/7ec2733715193510646aec32cc18284f_53_0.png)\n\n**Figure 3-9.** The\
  \ power of the long tail\n\nSee, consumers didn’t just turn their back on the old\
  \ model of one-size-fits-all mass appeal—they turned toward something they liked\
  \ better, something they welcomed with open arms. For the very first time in their\
  \ lives, unlimited variety of supply meant that there was that *perfectly tailored\
  \ something* for *everyone*. When consumers have the option to choose what they\
  \ paid attention to, they naturally pay more attention.\n\nBetween 2015 and 2018,\
  \ several marketing research companies, influencer marketing agencies, and social\
  \ media platforms reported that the real power of influencer marketing sits with\
  \ social media creators on Instagram with a smaller following, loosely referred\
  \ to as “micro-influencers.”\n\n> “Micro-Influencers Are More Effective With Marketing\
  \ Campaigns Than Highly Popular Accounts” reads the headline of an article published\
  \ by Adweek in 2017.[^13]\n\nDuring the same time, around 2017, I drew the same\
  \ conclusion. The fewer followers you have on social media, the more engaged the\
  \ audience. It makes sense when you think about it, as per the theory of the long\
  \ tail and unlimited variety of supply. This meant two things for marketers. First,\
  \ there’s a greater supply of content creators found in the long tail. Secondly,\
  \ their audiences are paying closer attention to what they’re doing. On the flipside,\
  \ you’d have to collaborate with a much larger collective of creators to make up\
  \ for the limited reach and sheer size of each individual audience.\n\nBut then,\
  \ that very same year, something happened: Instagram and its parent company Facebook\
  \ began, quite literally, to *move things around*. With its most recent update,\
  \ the order of the posts on a user’s feed would no longer show up in chronological\
  \ order. Instead, their algorithm would switch the order of the posts on a user’s\
  \ feed into what they think each account would like. It sparked some controversy\
  \ at the time (changing the familiar seems to have that tendency), but came with\
  \ intentions to improve the way its users experienced their product. The official\
  \ announcement from Instagram, accurately titled “See the Moments You Care About\
  \ First,” explained that as Instagram had grown, its users had begun to miss out\
  \ on as much as 70% of their feeds, including posts they’d actually care about the\
  \ most.[^14]\n\nWith complex algorithms in charge of serving its users with engaging\
  \ content, something interesting happened with the long tail. Suddenly, content\
  \ creators and influencers with both smaller and larger following began (at an aggregated\
  \ average, I should note) to see greater attention[^15] from their audiences. See\
  \ Figure 3-10.\n\n¹⁰ Billy Beane, the baseball general manager whose story was the\
  \ subject of Michael Lewis’ bestselling book Moneyball: The Art of Winning an Unfair\
  \ Game\n\n¹¹ www.wired.com/2004/10/tail/\n\n[^13]: https://www.adweek.com/digital/micro-influencers-are-more-effective-with-marketing-campaigns-than-highly-popular-accounts/\n\
  \n[^14]: https://instagram.tumblr.com/post/141107034797/160315-news\n\n[^15]: Engagement\
  \ rate measured by total comments and likes divided by followers\n\n\n\n\n\n## Instagram\
  \ 互动率基准，2019年2月\n\n![](img/7ec2733715193510646aec32cc18284f_55_0.png)\n\n图 3-10.\
  \ Instagram 互动率基准，2019年2月\n\n正如图 3-10 左侧所示的图表所指出的那样，你的受众规模与其参与度之间存在明显的关联，但这只是真相的一半。看向图表的右侧，互动不仅趋于稳定，而且有所增加。这就是\
  \ Instagram 算法的运作方式，它为用户提供他们最关心的帖子。那么，长尾失去了它的力量吗？头部是否突然比尾部更有力量？根据图表来看，与拥有 500 万粉丝的网红合作——其受众的参与度与拥有\
  \ 50,000 粉丝的人一样高——似乎是不言而喻的。矛盾的是，这一结论会让你走上错误的道路。乍看之下似乎矛盾，长尾的力量比以往任何时候都更大。但请记住，这些数字是汇总的平均值。可能有更多拥有更大粉丝群且受众高度参与的社交媒体创作者，但他们并不多。考虑以下内容：\n\
  \n| 组别 | 粉丝数 | 平均互动率 | 总创作者数 |\n|-------|-----------|--------------------|----------------|\n\
  | A | 5,000,000+ | 3.5% | 1,300 |\n| B | 50,000–100,000 | 3% | 175,000 |\n\n平均而言，如果你忽略每个组别的创作者总数，A\
  \ 组将是明显的赢家。但忽略了群体的规模，你就无法认识到尾部的规模大于头部。更好的问题是，在 B 组中，互动率至少为 3.5% 的创作者有多少？答案超过 48,000\
  \ 名。也许这是一种不公平的操纵统计数据的方法，但请记住，我们是营销人员，而不是数学家。\n\n10% 互动率如何？仍然有 8,700 名创作者可供使用。与此同时，全球范围内拥有\
  \ 500 万粉丝和 10% 互动率的用户只有 59 个。互动仍然存在于长尾中；你只需要看得更仔细。\n\n### 关键问题\n\n- 如何为你的网红营销活动挑选合适的创意策略？\n\
  - 有效简报的关键要素是什么？\n- 如何创建更有可能产生口碑传播的活动？\n\n### 核心原则\n\n- 1. 优秀的营销既是科学也是艺术。\n- 2. Instagram\
  \ 上经过验证的创意执行。\n- 3. 创意策略评分卡。\n- 4. YouTube 上经过验证的创意执行。\n- 5. 17 个用于高度有效的简报的问题。\n\
  - 6. 口碑传播的七大原则。\n\n创造力——以及将新颖而富有想象力的想法变为现实的行为——是一种罕见的艺术形式。在营销中，它往往是区分一个想法能超越其创造者与一个想法从未见天日的界限。而出色的营销虽然是一种真正的艺术形式，但它也是一种科学。\n\
  \n很难为创意工作勾勒出一个万无一失的框架，因为这个词本身的定义就是“想象原创想法”。考虑到这一点，我在本章中的任务将是概述科学（策略）和艺术（灵感）两方面。你的任务是将它们融合起来创造魔力。\n\
  \n你将学习 14 种适用于 Instagram 的经过验证的活动策略，以及在 YouTube 上创建内容的 9 种不同方式。我甚至会给你一个科学模型，告诉你如何每次都挑选正确的活动策略。我们将在第\
  \ 7 章《四步网红营销框架》中重返这些创意策略，你将在那里看到一切如何融合在一起。你将学习口碑传播的七大原则——以及如何将每个原则与你的创意策略结合起来。然后，我将分解我们在公司内部使用的简报模板的组成部分，该模板在网红与品牌之间超过\
  \ 10,000 次合作中使用。准备好了吗？\n\n## 导致创造力的七个问题\n\n以下问题（详见第 7 章《四步网红营销框架》）可以帮助激发你的创造力，并确定一条能与创作者、他们的社区和你的客户产生共鸣的信息。\n\
  \n- 1. 你对目标受众或你的行业有什么独特的见解吗？\n- 2. 基于这些见解，机会是什么？\n- 3. 现在文化中流行的、相关的事物是什么？\n- 4.\
  \ 什么能与你的受众在更深层次上建立联系并跨越文化界限？\n- 5. 什么能与公众建立情感联系？\n- 6. 什么能成为讨论话题，因为它具有共鸣和意义？\n-\
  \ 7. 什么能吸引、两极化、挑衅或娱乐创作者的受众？\n\n## Instagram 上 14 种经过验证的创意执行\n\n你可以在 Instagram 上让某人发布一张与产品植入和折扣代码的自拍的日子并不一定已经结束——但它肯定没有\
  \ 2012 年那么有效了。那一年，Instagram 有 1000 万用户。快进到 2018 年中期，这个数字已增长到 10 亿月活跃用户¹。平台发生了演变，品牌利用该平台与最有才华、最有影响力的创作者合作的方式也随之演变。\n\
  \n我亲眼目睹了这一转变对我们客户来说是多么具有挑战性和压倒性。即使是我们自己的业务开发和活动运营团队，也因功能部署的快速节奏而苦不堪言，在不到一年的时间里，Instagram\
  \ 就推出了 Stories、Shopping、Polls 和 Live Video。\n\n与此同时，活动变得更加复杂，最初相对直接的执行很快变得难以管理。起初，客户提出的要求相对简单，比如他们能否挑选创作者用来推广产品发布时使用的标签。但随后，他们会突然要求通过\
  \ Instagram Live 进行品牌体验，或通过故事投票推动产品偏好。变得不可能跟上，情况必须迅速改变。\n\n另一方面，在处理过数百个活动、数千名创作者和网红之后，一个模式开始浮现。事实证明，大多数活动会部署一种或几种相同的策略。经过仔细检查和分析，我们确定了\
  \ Instagram 网红营销的 14 种不同的活动策略。十次中有九次，这些策略几乎涵盖了任何活动目标、创意角度或策略，每种策略都有其各自的示例用途、主要优势，有时还有缺点。\n\
  \n到你阅读本文时，很可能有一两件事发生了变化或演变，但它们在这一点上已经保持了两年以上，在线世界中相当于十年。\n\n> ¹ https://techcrunch.com/2018/06/20/instagram-1-billion-users/\n\
  \n你的品牌、产品、受众、信息、目标和活动目标都是变量，它们将决定这些策略中的哪一种有效。常见的是，同一活动会应用其中几种（两到五种）。\n\nInstagram\
  \ 网红营销的 14 种不同的创意执行或策略如下：\n\n- 1. 单条 Feed 帖子活动\n- 2. 仅限 Story 活动\n- 3. Feed 帖子与\
  \ Story 搭配\n- 4. 多帖子活动（大使计划）\n- 5. 放大品牌体验\n- 6. 爆发式活动\n- 7. 直播以实现最大真实性\n- 8. 支持品牌主推活动\n\
  - 9. 通过投票推动考虑\n- 10. 超本地化活动\n- 11. Swipe-Up 潜在客户生成\n- 12. 实时招募\n- 13. 为广告创建内容\n\
  - 14. 将网红用作人才\n\n我们将介绍每种策略包含的内容以及示例用途和主要优势。为了进一步帮助，你将在本节末尾得到一个评分卡提供额外支持——但你必须熟悉每种策略的特征并相信你的直觉。\n\
  \n### 创意策略 1：单条 Feed 帖子活动\n\n单条 Feed 帖子活动允许品牌在预算范围内与最大数量的人合作。\n\n示例用途：\n\n- 围绕新产品推动大规模认知\n\
  - 包含品牌/产品的优质美容摄影\n\n\n\n\n- 利用网红快速创作高质量内容，以填满品牌社交媒体内容日历\n\n主要优势：\n\n- 这是试水网红营销最具成本效益的方式。\n\
  - 与不同的人合作开展活动，可以有多种不同的方式来展现品牌形象。\n- 如果目标是内容创作，则可以创作出大量高质量的信息流内容供选用。\n\n## 创意策略 2：纯快拍活动\n\
  \n纯快拍活动以一种不加修饰的方式传递品牌信息，没有信息流帖子那种精致感，对某些品牌来说，这正是他们想要的。而且，在相同预算下，这类活动可以合作最多的网红。\n\
  \n示例用途：\n\n- 展示网红如何使用产品\n- 引导用户点击进入落地页\n- 制造新产品的抢先预览\n- 推广现场体验\n\n主要优势：\n\n- 与不同的人合作开展活动，可以有多种不同的方式来展现品牌形象。\n\
  - 不加修饰的叙事形式会让人感觉更真实。\n- 点击率明显高于信息流帖子。\n\n重要注意事项：\n\n- 一条快拍中堆入太多内容会让受众划走。\n\n## 创意策略\
  \ 3：将信息流帖子与快拍结合\n\n将幕后快拍内容与高质量的信息流帖子内容相结合，可以讲述一个更完整的品牌故事。\n\n## 创意策略 5：放大品牌体验\n\n\
  品牌体验现在被刻意设计得让所有参与者都愿意发到 Instagram 上；然而，有时这些精美的装置本身并不能讲述完整的品牌故事。经过充分简报的网红可以补上这段缺失的故事。\n\
  \n示例用途：\n\n- 网红可以在活动前、活动中和活动后制造兴奋感，同时通过 Instagram 快拍与信息流帖子的组合传递各种品牌信息——快拍讲述原始真实的故事，信息流帖子捕捉活动的高光镜头。\n\
  - 网红可以被用作品牌体验的“街头摄影师”，为轮播图创作内容，讲述活动的多个侧面，同时也为品牌社交媒体信息流生成高质量内容。\n\n主要优势：\n\n- 让品牌能够将活动影响力扩展到更广泛的受众。\n\
  - 接受简报的网红会准确讲述你想讲的故事，而不是仅仅“希望”人们理解活动的意义，甚至知道它在庆祝什么。\n- 网红创作的内容看起来就是人们喜欢并愿意分享的内容（这正是他们能成为网红的原因）。这与品牌社交媒体渠道天然完美契合。\n\
  \n## 创意策略 6：爆发式活动\n\n单个网红获得触达，一群网红获得关注。爆发式活动的要义在于借助一群网红制造影响力，从而有效铺满目标用户的 Instagram\
  \ 信息流。\n\n示例用途：\n\n- 爆发式活动非常适合产品发布，因为 30 至 300 位网红在同一天发布内容，必然能在数字噪音中脱颖而出。\n- 爆发式活动也可以通过一群网红的集体行动来呼应大型品牌活动的信息，为活动提供有力支持。\n\
  \n主要优势：\n\n- 在这种情况下，整体大于部分之和。因为这类活动的频次会让消费者产生一种错失感——所有网红都在谈论某件事，而自己却错过了——从而提升购买考虑度。\n\
  - 将所有内容集中在同一天发布，影响力清晰可见，而不会在数周或数月间被稀释。\n\n## 创意策略 7：直播，呈现最大真实感！\n\nInstagram 直播不过是未经剪辑的真实，这既让它有趣，又有点可怕！\n\
  \n示例用途：\n\n- 与网红一起进行的持续直播时刻（例如晨间日常）\n- 突出品牌活动的高光时刻\n- 捕捉消费者的实时互动\n\n主要优势：\n\n- 无可比拟的真实感\n\
  \n重要注意事项：\n\n- 无法为无脚本时刻做计划\n- 需要为“直播活动”做宣传，让受众知道准时收看\n\n## 创意策略 8：支持品牌主打活动\n\n品牌主打活动通常源于一个能反映品牌个性与理念的大创意，而不仅仅是产品信息。网红可以在这个理念与生活息息相关的语境中将其生动呈现，成为品牌活动执行中极其强大的一环。\n\
  \n示例用途：\n\n- 邀请网红诠释他们自身与品牌活动主张之间的关联\n- 让网红对品牌活动做出反应，并谈论活动对他们意味着什么\n- 将网红融入活动核心创意，让他们既创作内容，也分发内容\n\
  \n主要优势：\n\n- 在多个触点强化同一品牌信息，是强势营销的核心原则之一。\n- 将网红营销定位为活动媒体策略的核心部分，而不是事后才追加的补充手段。\n\
  \n## 创意策略 9：通过投票提升购买考虑\n\n只要你开口问，世界给你的回应会让你惊讶。Instagram 快拍投票通过直接与受众互动，成为任何渠道上最有效的营销工具之一。\n\
  \n示例用途：\n\n- 让消费者在两种产品之间做出选择，从而提升品牌考虑度——他们在做出选择时，内心自然会形成偏好。\n- 在一个包含多条帖子的互动活动中，于第一条帖子创建快拍投票，询问消费者对品牌的看法，然后在最后一条帖子中再次发起投票，看看品牌考虑度发生了怎样的变化。\n\
  \n主要优势：\n\n- Instagram 快拍投票不仅能带来非常强的互动，还能为品牌产出有价值的信息。\n- 基准数据显示，其互动率接近 10%，是 Instagram\
  \ 信息流帖子平均互动率的 4 倍。\n\n## 创意策略 10：超本地化活动\n\n有些产品与特定地点密切相关，例如餐厅、旅游景点或限量供应的产品。让有才华的创作者前往这些地点，你所讲述的故事和创作的内容自然既真实又吸引人。\n\
  \n示例用途：\n\n- 希望推广某家门店菜单上特定菜品的餐厅\n- 希望推广该地点特定特色的酒店或度假村\n- 希望强调产品在特定地点有售的品牌或产品\n\n\
  主要优势：\n\n- 这是一种网红独有的营销方式——它是真实的线下口碑，再被社交媒体放大。\n- 网红会讲述自己在该地点的真实体验，因此内容极其真实。\n\n\
  ## 创意策略 11：上滑式线索收集\n\nInstagram 活动的主要 KPI 通常是触达和互动，而非直接销售。不过，也可以设置活动来为营销漏斗的其他环节输送流量，并通过每线索成本、网红引荐线索与其他方式获取线索之间的成本差异来衡量成功。\n\
  \n示例用途：\n\n- 网红内容可以引流到品牌页面，让品牌通过现有的 Facebook 或展示广告活动漏斗对这些消费者进行再营销。\n- 或者，也可以引流到邮件注册页面，让品牌把这些线索纳入邮件营销活动。\n\
  \n主要优势：\n\n- 对于高价商品或快消品牌而言，如果他们希望从网红那里获得的不仅仅是触达和互动，这种设置让他们能够通过 Instagram 进行效果营销，而不只是和直接销售挂钩。\n\
  - 没有人在第一次看到某件商品时就会购买，因此这种方法让我们从营销中最强大的触发因素——口碑——开始，为营销漏斗的其余环节提供动力。\n\n## 创意策略 12：实时招募\n\
  \n品牌热衷于讲述自己参与重大文化时刻的故事，并愿意投入资源把品牌大使带到这些活动中，以宣传品牌的参与。实时招募是一种让花在网红身上的预算发挥最大效用的方式，而不是把钱花在机票和酒店上。\n\
  \n示例用途：\n\n- 招募身处高影响力音乐节或夏日度假胜地的网红，代表品牌发布内容。\n\n主要优势：\n\n- 如果现场已经有网红，何必还要花钱把网红送到活动现场？关键在于用技术找到他们。\n\
  \n## 创意策略 13：为广告创作内容\n\n网红之所以能积累大量粉丝，靠的是创作高度相关、鼓舞人心且引人入胜的内容——这正是品牌需要创意代理商来完成的创作类型。可以让网红用自己的方式演绎品牌信息，然后品牌再协商商业复用的授权。\n\
  \n示例用途：\n\n- 为新产品的社交媒体创作极具吸引力的内容，重复使用并推广；只推广获得较高自然触达的内容，确保营销支出得到高效分配。\n\n\n\n\n\
  主要优势：\n\n- 网红营销在生成品牌内容方面已经是一种极具成本效益的方式。当内容已经制作完成并受到受众欢迎后，将其用于更广泛的受众自然是顺理成章的。\n\n\
  ## 创意策略 14：将网红作为出镜人才\n\n时尚和生活方式领域的网红已经拥有定义时代潮流的造型。在制作品牌自有内容时，将网红用作出镜人才，不仅能让您获得镜头前表现力出色的人才，还能借助网红在谈论拍摄过程时带来的传播力。这是我们尚未尝试过的做法；不过，这是一个很有吸引力的想法。\n\
  \n应用示例：\n\n- 在电视广告或社交媒体拍摄中选用前景或背景人才\n- 安排摄制组在网红参与品牌体验等其他活动时对其进行拍摄\n\n主要优势：\n\n-\
  \ 可以通过合同约束网红发布关于拍摄的内容（尽管许多网红会自发发布）。\n- 网红的粉丝会希望看到品牌内容，以便在其中找到自己喜爱的网红。\n\n## 创意策略评分卡\n\
  \n如您所见，每种创意执行和营销活动类型都有各自的优势、应用示例，有时甚至还有不足之处。为了理清头绪，您可以根据它们的不同特征，结合特定品牌的环境或条件或您独特的营销活动目标，按相关性顺序对其不同优势进行排名。图\
  \ 4-1 展示了一张评分卡。\n\n| | A. 您是否正在推出新产品？ | B. 您是否希望将网红营销整合到更大的品牌营销活动中？ | C. 您是否正在策划品牌体验或活动？\
  \ | D. 您是否在 Facebook 上投放广告？ | E. 您是否会赞助或整合营销与当下文化相关的事件，例如节日或特定地点活动？ | F. 您的产品/服务是否依赖于特定地点的可用性（例如零售店、健身房、活动）？\
  \ | G. 您对网红筛选是否有非常具体的标准，以至于历来很难识别潜在人才，或者您认为情况会如此？ | H. 您是否在线直接向消费者销售产品？ | I. 您现有营销中是否有很大一部分是由自然口碑驱动的？\
  \ | J. 您是网红营销新手吗？ | K. 您的产品是 App Store 或 Google Play 上的应用吗？ | L. 您的产品是否复杂，或需要深度叙事才能被欣赏或理解？\

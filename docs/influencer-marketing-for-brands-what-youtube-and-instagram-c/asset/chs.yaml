  \n## 下载疲劳\n\n同一项研究还揭示了另一个有趣且相关的见解，它直接适用于那些正在借助 YouTube 推动销售、应用安装或网站访问量的品牌。在推广了一段关于手机游戏的网红视频后，如果同一创作者的第二段视频在\
  \ 12 个月内发布，其下载量最高只有第一段的三分之一。\n\n这并不排除长期合作或与同一创作者制作多支视频的可能性，但它确实有助于预测这些努力的成果。请记住，如果一位创作者的第一支视频表现非凡，即使第二支视频的结果“差”到只有原来的三分之一，仍有可能优于平均水平。最终需要你来判断。\n\
  \n换一个角度看，第二支视频对于其他营销目标而言也可能是一种有效策略，例如重新激活不活跃或已流失的用户群体。\n\n## YouTube 内容分发的长效性\n\n\
  虽然与 YouTube 创作者合作需要更长的准备时间、更多的工作量和更大的前期投入，但该平台提供了一项世界上任何其他付费媒体渠道都无法匹敌的优势：无限的生命周期。当创作者在自己的频道上发布一段以你的品牌为特色的视频时，该视频的成本通常按其发布后前\
  \ 30 天内预计累积的观看量来计算（参见“行业费率”，第 5 章：以创作者为中心的策略）。\n\n但与其他广告方式不同（甚至包括 Instagram，上面大多数内容在大约一周后就几乎不再获得曝光），YouTube\
  \ 上的视频在首次发布后很长时间内仍会持续累积观看量。第 30 天并不代表你的营销活动结束，而恰恰是开始。请考虑以下假设：\n\n### 第 1 个月\n\n\
  - 视频成本：$10,000\n- 30 天预计观看量：100,000\n- 30 天预计单次观看成本：$0.10\n\n你启动营销活动，并按预期在 30 天后达到了目标预估观看量。但随后，一件强大的事情发生了——视频会在\
  \ YouTube 的搜索、发现和推荐中继续累积观看量，当视频达到 200,000 次观看时，你的有效单次观看成本将减半。这可能会在 60 天、80 天或 180\
  \ 天后发生，但请放心，这种长效性对你有利，而不是有弊。营销行业中最接近的类比是搜索引擎优化——你前期投入制作内容，随着时间推移获得自然访问流量；只不过与搜索引擎优化不同的是，你还能看到初期的流量爆发。总体而言，虽然我应该指出结果取决于多种因素，但你可以假设增长轨迹类似于表\
  \ 8-1。\n\n表 8-1. YouTube 视频的月度环比增长\n\n| 月份 | 环比增长 | 示例观看量 |\n| --- | --- | --- |\n\
  | 1 | 100% | 100,000 |\n| 2 | 30% | 130,000 |\n| 3 | 12% | 142,000 |\n| 4 | 12%\
  \ | 154,000 |\n| 5 | 10% | 164,000 |\n| 6 | 7% | 171,000 |\n| 7 | 7% | 178,000 |\n\
  | 8 | 5% | 183,000 |\n| 9 | 5% | 188,000 |\n| 10 | 5% | 193,000 |\n| 11 | 5% | 198,000\
  \ |\n| 12 | 5% | 203,000 |\n\n将你的目标获客成本、平均视频点击率⁴、自然流量提升⁵以及网站（或应用内）转化率纳入考量，你就有了一个为你在\
  \ YouTube 上的网红营销效果进行建模的工具。与传统广告不同，每条视频的长效性是一个新的维度，也是一种不公平优势——现在，你可以利用时间来改善营销投资回报率，对抗传统广告和网红营销广告成本的不断上涨，或者同时实现以上目标。\n\
  \n⁴ 2019 年 9 月，平均 1.5%–5%，不包括自然流量提升。\n\n⁵ 通过识别你的非追踪多数。\n\n## 借助品牌内容广告扩大你的网红营销效果\n\
  \n在任何 24 小时的时间段内，被生产出来的内容远多于我们在同一时间内可能消费的内容。内容生产的供给远远超过了对注意力（或一天中的时间）的需求。\n\n从许多方面来看，这对消费者是件好事，因为他们的选择更多，内容生产的门槛也更高了。理论上，这也不应对生产者产生任何经济影响，因为他们较低的单位成本应该会被更高的产量所抵消。然而这只是理论——在实践中，我们一天只有\
  \ 24 小时，因此我们对内容的需求严格限于我们能够消费的量。但消费者并不是用金钱为内容付费，而是用注意力来为内容付费，于是突然之间，一种注意力经济应运而生。\n\
  \n你看，如果你恰好成长在 70 年代、80 年代或 90 年代，那么你很可能记得你在电视上看到的最早的那些广告。这并不是因为那些广告拍得有多好，而是因为需求（注意力）超过了供给（内容），而我们也慷慨地付出了自己的注意力。那么从那时到现在发生了什么？当然是个人电脑、互联网和智能手机。根据经典经济学理论，这样的事件被称为正供给冲击。技术提高了生产效率，从而增加了产出。\n\
  \n同样简单的经济学理论也适用于局部层面。当社交媒体上的内容多到我们无法消费完时，像 Facebook 这样的公司就不得不构建算法和过滤器，帮助筛选争夺我们注意力的信息。否则，社交媒体就会失去其相关性，我们会转向其他地方。\n\
  \nInstagram 就是一个典型的例子。当数千万用户在这里生产和消费内容时，把所有内容展示给所有人是合理的。然而，当用户达到数亿，而且每个人都拥有了更多的关注者和关注对象时，内容供给突然过剩，这促使\
  \ Instagram 重新定义了其平台上的内容消费方式。⁶ 公告称，所有帖子仍然还会在那里，只是顺序不同。但如果用户基数再翻倍至十亿，并且技术进一步升级，实现更高效的内容生产（新的叙事形式、直播、美颜滤镜、更好的智能手机摄像头和更快的网络速度），就会迎来又一次*正供给冲击*。但我们的需求（注意力）并没有增长——这意味着你必须从别人那里夺取注意力，才能扩大自己的受众。\n\
  \n*这就解释了为什么像 Instagram 和 Facebook 这样的平台上的自然分发量在下降。基于这些基本的供需法则，我预测，在未来几年里，创作者和品牌都将持续看到自然触达和分发量的下降。取决于你的营销目标，这或许会成为你最终需要应对的挑战，也或许不会。同时，这也为创作者和品牌催生了新的机遇。*\n\
  \n2019 年，Instagram 加大了对品牌内容工具的投入，帮助企业将其网红营销活动的覆盖范围扩大到最初的自然触达之外。通过将原始帖子或快拍的分发规模扩大到创作者的受众之外（定向特定受众，并使用其广告平台中的工具衡量效果），这种方法让品牌、创作者或其网红营销合作伙伴能够在原始活动之外使用营销内容。虽然类似的策略（通过复杂的变通方式）以前当然也是可行的，但\
  \ Instagram 提供的整套平台和官方支持让实际操作变得非常顺畅。我预测，当你读到这部分内容时，将会有更多工具可供你使用。\n\n我强烈建议你熟悉 Instagram\
  \ 的官方文档⁷，因为此处概述的分步说明在你阅读时可能已经有所变化。无论如何，我将简要介绍工作流程和体验。\n\n首先，这一策略要求你与参与活动的创作者和网红充分协作——这也应该是你创意简报的一部分。设置很简单，但要使其生效，仍需一步一步地执行。不过要记住——用额外的媒体预算放大他们的品牌帖子和快拍，并让更大的受众看到，这是一件双赢的好事！\n\
  \n其次，在发布帖子或快拍时，创作者应使用官方品牌内容工具，并将你标记为其业务合作伙伴。要让这生效，你的品牌需要在自己的账号中批准该创作者。在发布快拍或帖子时，创作者还必须选择“允许业务合作伙伴推广”，这样你才能推广他们的帖子。\n\
  \n\n\n\n\n接下来，一旦创作者在品牌内容帖子中标记了你的企业，并授予你推广权限，你只需执行以下简单步骤：\n\n- 1. 前往广告管理器并创建广告。\n\
  - 2. 为你的品牌内容选择一个可用的营销目标。\n- 3. 在“版位”步骤中，选择 Instagram 信息流或快拍。\n- 4. 在广告层级，你的品牌内容将出现在“使用现有帖子”部分。在“选择帖子”窗口中，导航到“品牌内容”标签页。你会看到创作者已授权你推广的品牌内容帖子列表。\n\
  \n这样一来，你的网红营销工作就扩展到了重定向、特定受众属性、高级频次设置等领域。如果你愿意，你甚至可以构建一套完全围绕网红营销的付费社交媒体策略。不仅如此，你还通过让创作者获得更大的受众群和更高的互动率来支持他们，同时还能突破\
  \ Instagram 的算法。还记得创作者和网红们最常提到的挑战吗？通过放大他们的内容，你正在同时解决清单上的第 2、3、4 项。\n\n## 欺诈、假粉与机器人的兴起\n\
  \n如果你担心网红营销欺诈，你并不孤单。事实上，有 75% 的营销团队和代理机构对虚假粉丝和机器人账号感到担忧，而只有 20% 声称在自己的营销活动中遇到过欺诈。当一个媒体渠道在主流中获得真正的立足点时，这或许不可避免——但这也是网红营销平台、代理机构和品牌内部团队必须面对的挑战，以确保他们没有浪费金钱。\n\
  \n2018 年年中，联合利华对网红欺诈采取了立场，其首席营销官基思·威德（Keith Weed）向在平台上购买粉丝和点赞的网红宣战。这一声明成了新闻报道的头条，这完全合理，但广告欺诈自互联网出现以来就存在，据估计每年给广告主造成超过\
  \ 230 亿美元的损失。⁸ 社交媒体平台本身也在打击机器人账号和虚假粉丝，但你在建立营销活动时，如何避免自己的营销活动中出现欺诈呢？\n\n首先需要指出的是，由不活跃账户或机器人账号组成的受众很可能是完全无意的。如果你的账号在\
  \ Instagram 这样的平台上是公开个人资料，任何人都可以点击关注按钮。不要纠结于某人的粉丝是真是假，而是通过以下行动来打消你的顾虑。\n\n## 1.\
  \ 正确的受众\n\n以受众为先的网红营销方法（见第 3 章“寻找合适的创作者”：“影响力是结果，而非职业”）是你确保其受众不仅真实、而且正确所采取的首要行动。如果他们的粉丝中有\
  \ 80% 来自你营销目标国家以外的地区，那么这些粉丝是真是假就无关紧要了——不是吗？\n\n## 2. 真实互动\n\n即使受众是真实的，实际互动（评论和点赞）也可能是人为制造的。但你如何分辨呢？观察点赞和评论随时间的分布情况。请看图\
  \ 8-1 中的图表，其中有两个真实场景。\n\n![](img/7ec2733715193510646aec32cc18284f_156_0.png)\n\n\
  图 8-1. 自然互动与欺诈对比\n\n每条线代表来自两位不同创作者的 Instagram 信息流帖子的互动率。24 小时后，其中一篇帖子的互动率为 10%，另一篇为\
  \ 4%。为了保密，用户名已被移除，但分析显示，其中一篇帖子的互动率很可能是人为刷高的。你看，其中一条帖子的互动率在 1% 左右走平，然后瞬间跳到 4%，之后又保持不变？这没有任何自然之处，而是互动欺诈的表现。\n\
  \n## 3. 超越虚荣指标\n\nInstagram 和 YouTube 都为创作者和品牌提供账户分析和洞察，品牌通常会要求对方提供截图或授权访问这些洞察。如果粉丝受众或互动率还不够，那么访问信息流帖子覆盖人数或快拍展示次数等指标，可以作为打击欺诈的预防措施。\n"
- '## 术语表


  **大众传播广告（ATL）** 大众传播广告营销包括大众营销策略，这些策略大多不针对特定受众，侧重于品牌建设。


  **触达账号数** 查看过该内容的独立账号。


  **激活** 通过互动和体验激励用户采取行动的营销举措。


  **实际展示率** 展示次数除以粉丝总数。


  **联盟营销** 品牌与网红之间的一种营销协议：品牌向网红支付报酬，以换取网红通过联盟链接为品牌网站带来流量或潜在客户。


  **代理机构** 代理机构既可以是运营营销活动的营销代理机构，也可以是代理网红的经纪公司。


  **算法** 算法是一系列详细的指令，也就是执行某种操作的计算机代码。它被广泛用于决定或操纵社交媒体用户在其信息流中看到的内容及其频率。这些算法通常基于用户的历史行为和使用模式等参数设计。


  **持续投放（计划）** 营销活动在较长时间内持续进行，而不是按照单一活动或季节性特定时间线执行。


  **品牌大使** 代表品牌并可在特定时期内担任活动形象代言人的个人。


  **扩大传播** 通过优化内容来推动更多分发。


  **考虑度** 在特定购买场景下，消费者考虑你的品牌的程度。


  **内容日历** 用于规划内容的工具。


  **内容营销** 持续制作高质量内容以吸引受众参与的策略。


  **转化** 看到广告并通过与内容相关的 URL 最终完成购买的人群比例。网红使用跟踪链接或推广代码来衡量转化。


  **单次获客成本（CPA）** 衡量获取一位客户或新用户所需成本的指标。计算方法是用媒体投资总额除以获客数量。例如：$100,000 媒体预算 / 1,000
  次销售 = 每次获客成本 $100。


  **每次点击成本（CPC）** 衡量一位客户点击广告或链接并到达公司网站所需成本的指标。例如：$100,000 媒体预算 / 100,000 次点击 = 每次点击成本
  $1.00。


  **每次互动成本（CPE）** 与每次互动（如点赞或评论）相关的成本。每次互动成本的计算方法是用特定内容的成本除以它带来的总互动次数。例如：$100,000 媒体预算
  / 200,000 次互动 = 每次互动成本 $0.50。


  **千次成本（CPM）或每千次成本（CPT）** 指每 1,000 个单位的成本。该单位通常是粉丝、视频观看次数、展示次数或总触达人数。


  **创作者** 参见“网红”。


  **以创作者为中心** 在深刻理解你为营销活动招募的人才所面临挑战的基础上构建网红营销策略的做法（这反过来通常会为各方带来更大的价值，并将投资回报最大化）。


  **创意简报** 为内容创作提供方向的一系列思路。创意简报引导网红，确保其内容符合品牌标准，并能产生最佳互动效果。


  **合作** 在网红营销中，当网红与品牌共同合作时，就形成了合作。


  **交付成果** 网红需要产出的预期成果。


  **披露** 一种可见的标示（如文字说明），用于清楚说明合作目的以及网红与品牌之间的关系。常见标示包括“广告”“付费”“与……合作”或“赞助”等词语或话题标签。






  ## Glossary


  **Distribution Channel** 用于分享内容的平台。


  **Earned Media** 从分配给营销活动的媒体支出中产生的额外自然分发。


  **Earned Media Value** 基于线性媒体分发成本假设，从活动中产生的额外自然分发的价值。不要与 ROI 混淆。


  **eCommerce** 通过电子方式进行的商业交易。主要是在互联网上买卖商品或服务。


  **Engagement** 在社交媒体和影响者营销中用来描述与内容互动的做法这一术语。


  **Engagement Rate** 用于确定影响者内容质量的代理指标和关键指标，基于内容产生的互动数量。公式通常为总互动数除以总总覆盖人数或粉丝数。


  **Exclusivity** 品牌或代理在与影响者合作期间可能实施的特定权利或限制。


  **Flat Lay** 通常从上方直接拍摄的照片，以时尚的方式展示平铺在平面上的物品组合。


  **Feed** 用户查看他们关注的人和影响者发布内容的平台界面。


  **Follower Range** 根据影响者拥有的粉丝数量来描述影响者的术语。例如，影响者可以被归类为微型和宏观影响者。影响者费用通常基于其粉丝范围。


  **Full Commercial Content Usage** 对使用影响者生成内容的权利进行谈判并获得保障的条款。这意味着你有权在自己的渠道上使用内容，但你不拥有内容。


  **Guest Post** 当网站邀请另一位作者在其网站上发布内容时。


  **Hashtag (#)** 以井号（#）为前缀的单词或短语，用于在社交媒体和网站上识别特定主题的内容。它们是可搜索的关键词，例如，#relatable。


  **Haul** 参见 *Unboxing*。


  **IGTV** Instagram 推出的独立竖屏视频应用。与 Instagram 不同，它允许用户上传长达一小时的视频，并且每个用户页面都命名为“频道”。


  **Impressions** 特定内容向受众展示的次数。


  **Licensing** 基于许可或使用权获取使用影响者内容的权利。流程根据品牌要求的特定许可而有所不同。


  **Link in Bio** 影响者主要在 Instagram 上使用的短语和行动号召（CTA），用于向其受众发出信号，表明他们已在其个人简介中放置更多信息。


  **Macro-influencer** 在一个或多个活跃平台上拥有更大粉丝群的影响者。在 Instagram 上，宏观影响者通常拥有 100,000 名粉丝或更多。


  **Multi-channel Network (MCN)** 与多个频道和内容创作者合作的公司或实体，就 YouTube 等流媒体视频平台的成功提供咨询或协助。


  **Media Kit** 类似于简历的数字文档，影响者用于联系品牌进行合作时使用。它包含有关影响者、之前经验、技能、渠道和粉丝的信息。


  **Media Spend** 投入到活动或营销计划的预算。这通常不包括其他费用。


  **Micro-influencer** 拥有较小但通常高度参与的受众的影响者（通常为 10–100K 粉丝）。


  **Millennials** 在 21 世纪达到青年成年的 1980 年代至 1990 年代出生的人群的世代。


  **Most Valuable Distribution (MVD)** 用于描述品牌最有效的渠道策略和为其品牌量身定制的最佳实践，以最低的努力或精力获得最大的投资回报的术语。


  **Monetize** 将服务或资产转化为收入流的过程。对于影响者而言，变现发生在他们能够通过社交媒体账户或博客创建的内容赚取收入时。这通常是通过赞助内容或联盟收入实现的。


  **Multi-tied Approach** 战略性地利用不同受众规模的各种影响者进行激活，以确保所有关键绩效指标得到解决并实现高层次品牌目标。


  **Niche** 市场或人口中具有独特或非常特定特征或需求的小众细分市场。


  **Off Brand** 当内容与品牌旨在实现的目标价值缺乏一致性时。


  **Organic vs. Paid** 影响者内容的两种类型：非赞助和赞助。自然内容是非赞助的，与品牌没有实质性联系。相反，付费内容或赞助内容在某种程度上由赞助品牌广告商驱动。


  **Optimize** 使其得到最佳或最有效的利用。在影响者营销中，优化是指使内容表现更好。


  **Organic** 在影响者营销中，当没有付款干预的情况下发生互动时，就认为是自然发生的。


  **Outreach** 为合作而联系 *influencers*。


  **Owned Media** 在自己渠道上发布的品牌内容。


  **Page Views** 用于显示网站页面在指定时间内获得多少浏览量的指标。


  **Paid Media** 任何已付费的媒体报道。


  **Paid Post** 已付费制作的博客或社交媒体帖子。付费帖子通常由影响者与品牌合作制作，以换取货币或其他形式的补偿。


  **Paid Reach** 通过付费模式获得的印象。ROI 通常通过比较自然覆盖和付费覆盖来衡量。


  **Personal Brand** 影响者的个人特征、价值观和品质。影响者会注意确保潜在品牌合作伙伴与其自身的个人品牌一致或互补，以确保对其受众的真实内容。


  **Participation Rate** 接受加入你的活动的 *influencers* 的份额（参见 *Outreach*）。


  **Plandid** 看起来随意和随意的照片，但实际上是经过战略性策划的。


  **Platform** 用户发布内容的社交媒体渠道或网站。平台包括 Instagram、Twitter、YouTube、Snapchat、Music.ly、Facebook
  和博客。


  **Poll Interaction Rate** 与 *Instagram Stories* 中投票功能互动的受众份额。投票数除以观看次数。


  **Product Integration** 通过在影响者内容中明确介绍、包含和提及品牌特定产品来实现的品牌产品整合。


  **Public Relations** 专门从事品牌或人物获得有利媒体报道的战略专业沟通流程。


  **Qualify** 在评估特定活动的合适影响者时，一些品牌可能有一些先决条件，因此必须进行资格认证流程。


  **Reach** 影响者或品牌拥有的总粉丝数。这可能是在特定社交平台或所有活跃的社交平台上。


  **Reaction Video** 人们对事件或其他视频做出反应的视频。


  **Return on Investment (ROI)** 在营销投资上获得的总价值。


  **Sampling** 在合作中将商品或服务作为对影响者的付款形式提供。


  **Segment** 根据他们创建的内容类型或他们触及的特定受众人口统计学来区分的影响者特定群体。示例：生活方式、时尚、育儿、旅行等。


  **Sentiment** 粉丝表达的意见。


  **Sentiment Analysis** 识别影响者内容评论中粉丝表达的意见的计算过程。这有助于确定对特定主题或产品的态度。


  **Social Media** 允许用户创建和分享内容并参与社交网络的在线通信渠道的集合。


  **Swipe up** Instagram Stories 和 Snapchat 上都有的功能，允许用户从帖子链接到网站，以便其受众可以获取更具体的信息。用户需要向上滑动屏幕即可进入网站。


  **Tag** 通常在帖子上使用 @tag 链接到平台上另一用户的页面。


  **Target Audience** 品牌希望通过营销活动吸引的理想消费者群体。


  **Terms of Service (TOS)** 在使用产品或服务之前必须同意的条款或规则。


  **Through the Line (TTL)** 360 度广告，活动以品牌建设和转化愿景为目标进行开发。


  **Total Accounts Reached** 查看过内容的总唯一账户数。


  **Total Content Engagement** 所有分享、点赞和评论的总和。总内容互动是参与率的输入指标，参与率是衡量内容质量的关键指标，基于互动数量。


  **Total Digital Audience** 影响者在所有活跃社交平台上的潜在覆盖总和，包括 Facebook、Twitter、Instagram、Pinterest、YouTube、Tumblr、Snapchat、Musical.ly
  和博客月度独立访客。


  **Tracking Links** 用于将流量从你自己的网站以外的地方引导到着陆页的 URL。跟踪链接包含在营销活动中，以帮助品牌跟踪、衡量和报告影响者营销活动的成功情况。






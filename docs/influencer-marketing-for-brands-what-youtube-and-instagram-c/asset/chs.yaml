  >\n> ——克里斯·安德森¹\n\n**关键问题**  \n我如何为我的品牌找到合适的影响者？识别合适的影响者时应该看重哪些特质？影响者是早期采用者吗？什么样的互动率才算好？\n\
  \n**核心原则**  \n- 1. 影响力是一种结果，而不是一种职业。\n- 2. 社交媒体创作者是早期采用者。\n- 3. 拥有你自己的达人池。\n- 4.\
  \ 长尾的力量。\n- 5. 创新的扩散。\n\n¹ *长尾理论：为什么商业的未来是销量少而种类多*  \n© Aron Levin 2020  \nA. Levin，*品牌影响者营销*，\
  \  \nhttps://doi.org/10.1007/978-1-4842-5503-2_3\n\n影响你的决策。为什么？专业知识和可信度，是影响力的*第一个*杠杆。*第二个*杠杆是你与对方关系的强度。你们越了解彼此，效果就越好。我们信任朋友、家人以及与我们关系牢固的人。我们也与在线上关注或订阅的对象有着不同强度的关系。那位私人教练的受众规模，以及她能够触达的人数，起到了乘数的作用。这就是影响力的*第三个*杠杆。\n\
  \n### 公式\n\n影响力 = 受众触达 × 亲和力（专业知识、可信度） × 受众关系强度（互动）\n\n- 1. **受众触达**指受众的规模以及他们是谁。可以是订阅者、关注者或好友网络。\n\
  - 2. *亲和力（专业知识、可信度）*是确保你的信息或品牌具有亲和力、天然的喜爱或共鸣。它同样关乎专业知识和可信度，专业知识指“在特定领域的知识”，可信度指“被信任和被信服的品质”。我们将在第5章“以创作者为中心的策略”中更深入探讨创作者在与品牌合作时看重的特质。\n\
  - 3. *受众关系强度（互动）*关注的是受众与你有多亲近。如果关系较弱，受众就不会关注，信息获得的注意力和影响力也会很低。\n\n当你为优化这三点而布局时，就更有可能打造出结果更好的影响者营销活动。\n\
  \n### 受众规模\n\n*策略：受众优先*\n\n确保你合作的创作者拥有与你的受众重叠的受众。确保你了解在特定关注者区间内有多少创作者，以及你所处市场的状况。\n\
  \n**关键问题：** *我们的目标受众是谁？谁的受众能帮助我们触达这一受众？我们合作的每个人应该拥有多大的受众规模？*\n\n### 亲和力\n\n*策略：人才独立*\n\
  \nYouTube上有超过200万个订阅者超过500人的频道。Instagram上有超过1000万拥有1000位关注者的创作者。与一个能够挖掘这整个潜在创作者群体，并帮你找到那些对你的品牌具有亲和力、专业知识和可信度的人选的伙伴合作。\n\
  \n关键问题：亲和力：我的品牌或营销信息是否有天然的喜爱或共鸣？专业知识：这个人是否在我所在的特定领域知识渊博？可信度：为什么这个人的受众会信任或相信他？在营销信息或你的承诺中，“值得相信的理由”是什么？\n\
  \n除非你完全独立运作，否则你很难为你的营销活动找到合适的人选。多频道网络（MCN）或艺人经纪公司只会推荐自己旗下的签约者，因而局限于他们代理的人；有时他们与你的品牌完美匹配，但有时并非如此。这并不一定意味着他们不好，但确实限制了他们帮助你建立专属于自己业务的人才库的能力（本章后面会深入讨论这一点）。\n\
  \n通过一种人才独立的方法来识别和引入合适人选，我们确保每次都能毫不妥协地让正确的人加入。\n\n### 关系强度\n\n*策略：优化互动*\n\n互动是衡量关系强度的绝佳指标。它也是客观评估受众是否在关注你信息的好方法。要与互动水平出众的创作者合作。如何制定策略和策划活动，以实现出色的互动水平？这将在第4章“创意的艺术与科学”中更详细地讨论。目前，只需记住：互动将是一个\n\
  \n\n在寻找具有影响力的社交媒体创作者时，这是一个重要的变量。\n\n关键问题：*我应该设定多少目标互动率？结合前两种策略来看，这个数字是否合理？*\n\n\
  与你的活动互动的人数，比你可能触达的人数更为重要。如果你的总体目标是尽可能触达更多人，这一点尤其正确。为什么呢？除非他们真正关注，否则你不太可能改变品牌偏好、购买意向、品牌提升度，或看到任何实际影响。只与那些拥有极高互动受众的创作者合作，你的活动将会产生更显著的影响。一份涵盖15个主要国家的综合互动率基准报告可在\
  \ rlt.to/engagement-countries 免费获取。利用报告中的洞察来帮助回答本节概述的关键问题。\n\n## 领导者与追随者：作为早期采用者的社交媒体影响者\n\
  \n在20世纪60年代初，传播理论家、俄亥俄大学助理教授埃弗雷特·罗杰斯注意到，思想、创新和新技术在文化和社会中传播时，会遵循相似的模式。\n\n罗杰斯提出了他的*创新扩散*理论，并在1962年出版的著作《创新扩散》中发表了他的研究发现。在这本书（现已出版至第5版）中，罗杰斯解释了新思想和技术如何、为何以及以何种速度被社会吸收，以及*创新*如何在人群中扩散³。对于许多（如果不是*大多数*）营销人员来说，开发能在社会或特定人群中广泛传播的新想法，正是我们工作的定义。因此，埃弗雷特·罗杰斯发表的研究成果中，蕴含着几条宝贵的营销经验。\n\
  \n其中几条很可能已在你的组织内部被广泛*采用*（明白了吗？）。罗杰斯提出，任何新创新的采用者可分为五个不同阶段：创新者（2.5%）、早期采用者（13.5%）、早期多数（34%）、晚期多数（34%）和落后者（16%），在数学上呈钟形曲线分布。见图3-1。\n\
  \n³ 定义为某事物更广泛传播的过程或状态\n\n# 第3章 | 影响力是结果，而非职业\n\n![](img/7ec2733715193510646aec32cc18284f_34_0.png)\n\
  \n**图3-1.** 产品采用与创新扩散\n\n不同细分群体有不同的需求，每个采用者接受你创意的可能性，取决于你对他们独特特征、需求、态度、推理方式等的理解。例如，罗杰斯发现，*创新者*和*早期采用者*往往会传播信息，促使更多人接受该创意，直到创意最终达到临界规模，或市场饱和点。\n\
  \n不同群体及其关键特征描述如下：\n\n### 创新者（2.5%）\n\n创新者是热衷者和冒险者，他们接受高度不确定性。他们行动迅速，欣赏技术、创新、新想法等，并因其本身而重视它们。他们被成为变革推动者的想法所激励，几乎痴迷于冒险精神，受鲁莽、大胆和风险欲望的驱动。\n\
  \n创新者通常不被当地系统中的其他成员所尊重。创新者是新想法的守门人，因此在采用过程中扮演着重要角色。\n\n### 早期采用者（13.5%）\n\n通常是远见者、榜样和潮流引领者。根据埃弗雷特·罗杰斯的说法，这一采用者类别拥有最高程度的意见领导力。他们是“需要咨询的人”，其他人通常会向这一群体寻求有关创新或新想法的建议和信息。虽然创新者受冒险欲望（以及可能犯错的风险）驱动，但早期采用者知道，在为新想法盖章认可之前，他们需要无可挑剔的判断力。\n\
  \n早期采用者通常是试用新创新的绝佳测试对象，因为他们在创新性上不会领先于普通人太远。\n\n### 早期多数（13.5%）\n\n早期多数群体的成员比早期采用者更为谨慎，他们通过采用已被他人验证的解决方案来避免风险。他们倾向于避免复杂性，可靠性是一个重要考虑因素。他们关注（并追随）趋势，但他们的采用过程更为深思熟虑。这并不意味着早期多数不喜欢新产品——只是他们不像前两个群体那样对其感到兴奋。\n\
  \n罗杰斯通过研究得出结论，属于早期多数的人不太可能担任意见领袖职位。很容易理解为什么营销人员和品牌痴迷于吸引早期多数：他们占据你整个市场的三分之一，并且更有可能坚持使用他们喜欢的产品，反复购买。从这个意义上说，他们不同于早期采用者，后者喜欢尝试新事物。\n\
  \n### 晚期多数（34%）\n\n当向这一群体营销时，你面对的是总潜在市场的后一半。晚期多数成员较为保守，会在整体群体的平均成员之后才采用新想法。他们对创新者和早期采用者持怀疑态度，需要在感到足够安全做出决定之前获得完全的确定性。他们的决策过程比前几个群体更慢，受必要性、价格敏感性和社会中他人的同伴压力驱动。\n\
  \n### 落后者（16%）\n\n落后者对创新持怀疑态度（并且抗拒创新）。从他们的角度看，这是一个理性的观点，因为他们的资源有限，必须确信新想法不会失败才能采用。他们的参照点往往是过去（“我们一直都是这样做的！”），并且他们倾向于与意见领袖隔绝。\n\
  \n落后者重视可信度、可得性和简单性——进一步研究表明，这一群体与较低收入和较低教育水平之间存在强相关性。因此，价格（以及等待降价或促销活动）在他们的决策过程中很重要。\n\
  \n这些内容看起来应该很熟悉，甚至很基础，因为这些研究结果已经存在并被大多数营销专业人士广泛接受超过50年。然而，深入探究创新扩散理论，你会开始看到它与影响者营销的有趣相似之处。他书中一个重要（且适用）的观点是点对点网络的重要性，以及传统大众媒体是传播*信息*的有效方式，而个人之间的对话则传播*采用*。见图3-2。\n\
  \n![](img/7ec2733715193510646aec32cc18284f_36_0.png)\n\n图3-2. 巴斯预测模型\n\n## 他发现：\n\
  \n> 虽然大众媒体渠道通常是告知潜在采用者群体某项创新存在的最快速、最有效的途径，但人际渠道在说服个人接受新想法方面更为有效，尤其是当该渠道连接两个或更多在社会经济地位、教育或其他重要方面相似的个体时。\n\
  \n罗杰斯继续写道：“大多数人主要依赖于从其他与他们相似的、已经采用了该创新的个体那里获得的关于创新的主观评价。”⁴\n\n*同伴网络*的概念是创新扩散理论的基本要素，也解释了影响者营销为何以及如何如此有效。创新者和早期采用者实际上成为意见领袖（或*有影响力的个体*），点燃了最初的“起飞”采用过程，推动创意的采用以达到临界规模。\n\
  \n⁴埃弗雷特·M·罗杰斯，《创新扩散》，第5版（自由出版社，2003年）\n\n那么，如何识别与你的营销目标相关的关键意见领袖呢？罗杰斯提出，通常有七个关键特征能将意见领袖区分开来：\n\
  \n- 1. 意见领袖比其追随者更频繁接触大众媒体。\n- 2. 意见领袖比其追随者更“国际化”。他们是“边缘人物”，能够将社交群体之外的新想法带给群体成员。\n\
  - 3. 意见领袖比其追随者与变革推动者有更多接触。\n- 4. 意见领袖比其追随者有更高的社会参与度。\n- 5. 意见领袖比其追随者拥有更高的社会经济地位。\n\
  - 6. 意见领袖比其追随者更具创新性。\n- 7. 当社会系统的规范支持变革时，意见领袖更具创新性；但当系统规范不支持变革时，意见领袖并非特别创新。\n\n\
  ## 什么是“变革推动者”？\n\n变革推动者是指影响客户创新决策、使其朝着变革机构所期望方向发展的个人。变革推动者通常寻求确保新想法的采用，但也可能试图减缓扩散过程，并阻止某些具有不良影响的创新被采用。\n\
  \n> ——《创新扩散》，第5版（2003年）\n\n思考这些特征如何与影响者营销以及为你的品牌或营销信息识别合适的创作者、社交媒体影响者和大使相关联，但注意不要将创新者误认为意见领袖。意见领袖有追随者，而创新者是最先采用新想法的人，且常常被视为偏离常规者。\n\
  \n\n\n\n\n如果网红确实是早期采用者，那么他们更有可能属于创新者和早期采用者类别，而不太可能属于早期大众、晚期大众和落后者类别。表 3-2 显示了我们的发现。\n\
  \n## 表 3-2. 采用情况比较（网红、普通人群）\n\n| 组 | 网红 | 普通人群 | 差异 |\n|---|---|---|---|\n| 创新者\
  \ | 29% | 2.5% | +1040% |\n| 早期采用者 | 48% | 13.5% | +255% |\n| 早期大众 | 21% | 34% |\
  \ -37% |\n| 晚期大众 | 1% | 34% | -97% |\n| 落后者 | 1% | 16% | -93% |\n\n钟形曲线突然向左压缩，有\
  \ 29% 的网红将自己识别为创新者，48% 将自己识别为早期采用者（图 3-3）。在分布曲线的另一侧，他们不太可能属于晚期大众或落后者阶段，高达 96%（2%\
  \ 对 50%）。\n\n![](img/7ec2733715193510646aec32cc18284f_39_0.png)\n\n## 图 3-3. 社交媒体网红更有可能成为创新者和早期采用者\n\
  \n与人口平均水平相比，以及导致发现创新扩散理论的研究，社交媒体网红另一方面更有可能成为创新者 10 倍，更有可能成为早期采用者 2.5 倍。\n\n这很 remarkable，并表明网红营销不仅可以复制传统大众媒体渠道传播信息的特征，还可以推动个人之间的对话，从而推动采用。\n\
  \n简而言之，社交媒体网红是早期采用者。既然如此，如果你相信创新扩散理论，他们对早期大众的影响程度大于晚期大众或落后者的成员。同一研究项目还揭示了一些其他有趣的见解，其中包括另一个重要问题的答案：谁影响那些有影响力的人？\n\
  \n## 你信任你的医生吗？\n\n“比任何其他香烟，更多的医生吸 Camel” 是一则标志性（而且极具误导性）的 1946 年印刷广告，在美国总共刊登了 8\
  \ 年。\n\n在这段时间里，从 1930 年代到 1950 年代后期，医生、医师和穿着白大褂的模特经常被主要烟草公司聘请，宣称他们的致命产品“正是医生所开的！”同时在包装上贴上“医生推荐”的标签。\n\
  \n幸运的是，烟草巨头现在不允许在广告中使用任何此类做法，并且被禁止使用某些广告手段，并受到 FDA 和其他监管机构的严格监管。很明显，使用医生或医师等权威人物在当时为何如此有效，但这让我想知道——在当今的这些职业中，权威人士是否对趋势制定者、网红、创新者和早期采用者所采用的产品或服务具有重大影响？如果是，影响程度如何？\n\
  \n回到上一节提到的研究项目，问卷的下一部分专注于一个特定类别：健康与 wellness。选择这个特定垂直领域的原因是有一个假设：除非参与者置身于适用的情境中，否则他们很难正确识别什么会影响他们的决定。影响毕竟是非常情境化的。\n\
  \n例如，你可以假设你的医生对你对音乐的偏好影响有限，而在你的健康情境中影响更大，等等。\n\n但这正是调查结果令我们惊讶的地方。见图 3-4。\n\n![](img/7ec2733715193510646aec32cc18284f_41_0.png)\n\
  \n## 图 3-4. 影响产品采用的因素\n\n虽然影响是情境化的，但我们的朋友、家人，以及值得注意的是，其他社交媒体网红的排名超过了健康专业人士、个人教练和主治医师的总和！\n\
  \n## 到底发生了什么？\n\n自 1960 年代以来，世界发生了很多变化。虽然烟草巨头的“医生推荐”标签已被外科医生总署的癌症警告所取代，但 1962 年《创新扩散》首次发表的见解今天比以往任何时候都更相关。影响可能是情境化的，信任在其方程式中发挥着重要变量的作用，但你还记得本章上一节中关于点对点网络重要性的摘录吗？\n\
  \n早期大众依赖于他们从与他们相似的人那里获得的信息，这些人已经采用了创新，而正如你所学到的，社交媒体网红很可能成为创新者和早期采用者——不仅在他们之间推动采用，而且特别是在早期大众中。你想影响那些有影响力的人吗？推动那些推动早期采用的人的采用吗？与他们的朋友、家人和他们关注的其他创作者保持联系。\n\
  \n请记住，这些见解特定于回答调查的人群（平均而言，该人是社交媒体用户，平均拥有 75,000 名粉丝），不一定反映普通人群，以帮助你了解如何影响那些有影响力的人。\n\
  \n## 找到合适的创作者\n\n> “我该如何为我的品牌找到合适的网红？”\n\n有大量平台和工具可以帮助你找到适合营销需求的合适创作者或网红。那么为什么这仍然是一项具有挑战性的任务呢？早在\
  \ 2016 年，我的公司就着手发现 Instagram 和 YouTube 上到底有多少才华横溢、富有创造力、有影响力的人。\n\n以与 Google 构建其搜索引擎技术类似的方式爬取网络，我们确定了\

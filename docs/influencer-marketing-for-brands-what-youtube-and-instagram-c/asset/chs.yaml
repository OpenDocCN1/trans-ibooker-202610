  \ > | | | | | | |\n\n### 图 4-1. 创意策略评分卡\n\n如您所见，不同的问项（A–L）现在已映射到适用的创意执行方式。\n\n假设您正在推出新产品（问项\
  \ A）。如果答案是肯定的，那么爆发式营销活动（列表中的 #6）、投票（#9）和单篇信息流帖子（#1）通常都会是相关的创意策略。您的产品是否复杂，是否需要深度叙事才能被充分理解（问项\
  \ M）？那么，仅快拍营销活动（#2）、信息流帖子与快拍搭配（#3）、直播以获取最大真实感（#7）以及通过投票推动用户考量（#9）都将适用。\n\n我非常鼓励使用评分卡来评估每个适用策略的相关性水平。您还可以使用一个免费的在线工具²，它将帮助您评估每个策略，同时提供印刷图表的高分辨率版本。³\n\
  \n## YouTube 上九种行之有效的创意执行方式\n\nYouTube 和 Google 已经发布了他们自己的官方指南和建议⁴，概述了九种不同的、行之有效的创意执行方式，供品牌与他们视频平台上数百万才华横溢的创作者合作时使用。\n\
  \n在 YouTube 上，品牌、创作者及其经纪人或代理商通常会区分专题视频和植入视频。专题视频是创作者与品牌之间的品牌合作，您的产品或服务是视频中唯一被展示的内容。示例包括教程、开箱、穿搭指南、品牌叙事、产品演示或短剧。植入视频会提及您的品牌，但也会展示其他内容、产品或品牌。使用示例包括购物分享、⁵\
  \ 最爱产品、开箱或与上下文相关的品牌提及/口头推荐。\n\n让我们来看看 YouTube 上九种常见的内容创作类型，以及如何利用它们来建立品牌与创作者之间的合作。\n\
  \n以 YouTuber iTwe4kz 将耳机制造商 KANOA 推向破产为例。¹⁰ 该公司据称试图贿赂 Cody（即 iTwe4kz）以获得正面报道，而他对此的回应是向他的\
  \ 60 万订阅者发布了一段长达 27 分钟的毫不留情的视频。¹¹\n\n在与这位知名科技评测 YouTuber 的合作中，KANOA 寄了一副耳机给这位科技\
  \ YouTuber 进行评测，但他收到的耳机无法使用，于是他联系对方要求寄一副新的。你会想，这很合理吧。然而，他们非但没有答应，反而提出支付他 500 美元换取一篇正面评测。他没有接受这个提议，反而被这一提议激怒了：\n\
  \n> 你想让我拿自己的诚信冒险，就为了让你卖掉这些破玩意儿（耳机）？你在开玩笑吗？五百美元？不，你不能给我五百美元然后我就发一篇好评。这就是垃圾！\n\n请注意，问题不在于合作、报酬，甚至也不在于产品有缺陷，而在于缺乏透明度和真实性。消费者期望品牌与创作者合作，也期望创作者展示他们的产品——但请记住他们最初关注这些频道的原因：\n\
  \n因为他们相信他们的观点。要求对一款无法正常工作的产品给出诚实评测，那么你得到的就会是你所要求的。\n\n## 穿搭指南\n\n穿搭指南（Lookbook）是一种风格化的视频，创作者在其中展示来自同一品牌的多个产品——通常属于时尚、服装和彩妆领域。将您的合作融入即将到来的相关文化日历事件和主题，例如返校季、春季或秋季。或者，您也可以将穿搭指南视频的主题定为特定受众或场景，例如职场、大码或约会之夜。所有这些例子都来自\
  \ YouTube 上最热门的搜索建议——这是一种有助于生成更有可能引起特定受众共鸣的视频创意的策略。这种方法还有另一个好处，即 YouTube 创作者非常重视能够引起他们受众共鸣的视频创意，并且更倾向于与那些深刻理解如何吸引新老订阅者的品牌合作。\n\
  \n## 梗与喜剧短剧\n\n“梗”（meme）一词最初由英国科学家理查德·道金斯在其 1976 年出版的《自私的基因》一书中提出，定义为“文化传播的单位”。¹²\n\
  \n他写道：“梗（知识、八卦、笑话等的离散单位）之于文化，就像基因之于生命。正如生物进化是由基因库中最适基因的生存所驱动，文化进化可能是由最成功的梗所驱动的。”\n\
  \n如今，梗通常指那些在社交媒体和网络上像病毒一样被复制和传播的有趣图片、视频或动图，往往带有细微变化——但这个词的起源实际上来自希腊语 mimēma，意为“被模仿之物”。\n\
  \n当然，当您想到梗时，会想到暴躁猫、瑞克摇和成功小孩。但梗的概念——对文化中相关观念的模仿——也可以作为创意策略的核心基础。这不同于制作一个“病毒式传播”的视频（顺便说一句，那是一个愚蠢的策略），而是要在文化中流行的东西上构建，或者以不同的变化形式复制，并取得不同程度的成功。\n\
  \n例如，2016 年，健身行业的几位 YouTuber 加入了“10,000 卡路里挑战”。顾名思义，这一挑战涉及记录摄入推荐每日卡路里量 5 倍的过程。在\
  \ YouTube 上搜索这个词，您会发现成千上万的视频，总观看量达数百万，整个创作者群体都在互相模仿，这为品牌创造了明确的机会，既可以制作植入视频，也可以制作专题视频，参与文化的传播。\n\
  \n创意概念也可以被设计成允许模仿的形式。2018 年，直达消费者品牌 BURST Oral Care 首次与科勒·卡戴珊合作，在 Instagram 上发布了一系列快拍和视频，展示其电动牙刷的效果。但她并没有刷牙，而是用一根裹满咖啡渣的玉米棒来演示产品。\n\
  \n当您看到科勒·卡戴珊、克莉丝·泰根或此后参与“Burst 玉米挑战”的众多名人和 YouTuber 的视频缩略图时，他们拿着牙刷和裹满咖啡的玉米棒摆姿势，您不禁会好奇发生了什么。一个可以被反复复制和模仿的创意概念，一项始于品牌合作的挑战，此后已被客户和其他\
  \ YouTuber 自发复制传播。\n\n\n\n\n\n## 游戏实况\n\n这类视频在游戏社区中非常流行，原因显而易见。在这类视频中，玩家会通关多个关卡或整款游戏，通常会配合对自己体验的解说和评价。\n\
  \n## 品牌/产品宣传\n\n在视频开头和结尾提及你的品牌、产品或服务，例如：“我与[品牌名]合作，为你带来这支视频。”\n\n## 最爱推荐\n\n创作者围绕一个他们热衷且当下热门的话题制作整支视频，例如：“我最爱的返校好物。”与穿搭展示视频类似，你可以利用YouTube的搜索建议来生成视频主题创意。\n\
  \n## 撰写有效的简报\n\n成功开展网红营销活动或项目的基石之一，是向网红和创作者撰写一份有效的简报。以下是一份问题清单，你需要回答这些问题，以帮助合作方理解你对他们有何要求。更多信息，请参阅第6章“规模化的一对一关系”中的“受沟通约束”部分。\n\
  \n- 1. 你和你的公司是谁？（介绍）\n- 2. 你的公司、产品或服务是做什么的？（背景）\n- 3. 你为什么联系我？（背景语境）\n- 4. 你期望我做什么？（简报）\n\
  - 5. 什么时候要完成？（承诺）\n- 6. 我们将如何合作？（流程）\n- 7. 我会得到多少报酬？（酬劳）\n- 8. 你希望我接下来做什么？（行动号召）\n\
  - 9. 这将如何帮助我为我的受众创作内容？（益处）\n- 10. 这会不会损害我的事业或个人品牌？（风险）\n- 11. 对我还有哪些我应该知道的额外好处吗？（益处）\n\
  - 12. 我怎么知道我可以信任你？（风险）\n- 13. 你们还和谁合作过？（社会证明和社群）\n- 14. 这会花费我多少时间？（承诺）\n- 15. 我什么时候能拿到报酬？（条款）\n\
  - 16. 你的营销目标是什么？（目标）\n- 17. 你的产品/服务有什么特别之处？（独特卖点）\n\n## 简报模板\n\n在过去的三年里，我的公司开发了一套久经考验的简报模板，成功应用于Instagram上数千次合作，几乎涵盖你能想到的所有品类和垂直领域。以下是我们使用的确切邮件模板、简报各部分的组织方式，以及如何回应上述17个问题。\n\
  \n主题：受邀参与与[品牌名]的Instagram付费合作\n\n嗨，@创作者，\n\n我是来自[你的公司]的[你的名字]。\n\n[简短的两句话介绍，以引发足够的兴趣让对方继续读下去。你可以在此提及你合作过的其他创作者或网红，但要尽量简短。]\n\
  \n如果你感兴趣，请继续阅读所有信息。在底部你会看到一个按钮，点击即可报名参与。如果你有任何问题，欢迎随时联系。\n\n/亚伦\n\n—与[品牌]合作邀请—\n\
  \n### 关于[品牌]\n\n用两句话简要介绍你的品牌。如果你在推广某个特定产品，请描述其核心优势和独特卖点。\n\n# 第4章 | 创意的艺术与科学\n\n\
  ### 关于这次活动\n\n用两段话说明活动内容。活动的背景是什么？这是否是更大营销计划的一部分？概括来说，创作者需要做什么？（你将在简报的后续部分提供详细说明。）这一部分应该有效地“推销”活动理念，帮助创作者判断你所提议的内容是否足够相关和有趣，值得他们继续读下去。\n\
  \n### 活动目标\n\n说明活动的目标，以及你希望通过合作达成什么成果。你将如何定义活动的成功？\n\n### 你的任务说明\n\n这些信息是针对Instagram账号@创作者的所有者量身定制的。\n\
  \n### 你需要做到\n\n- 创作者需要做什么来实现活动的创意简报？使用你的产品？安装应用？访问特定地点？等等。\n- 按照以下指南创建[#]条快拍和[#]条帖子的内容。\n\
  - 在[日期]之前将内容发送给我们审批。\n- 在[日期]发布已批准的内容。\n- 在你的帖子中包含以下内容：#合作 #活动 @提及。\n- 任何信息流帖子需在你的账号上保留30天。任何快拍需保留完整的24小时。\n\
  - 你不得在此活动发布日期前后24小时内为其他品牌发布任何赞助帖子或快拍。\n- 你的文案应使用你平时发帖所用的语言。\n- 遵循以下指南非常重要。\U0001F447\
  \U0001F447\U0001F447\n\n### 作为交换，你将获得\n\n- 参与此次活动，你将获得[金额]报酬。你需要自行承担社交平台费用和其他税费。请联系当地税务部门了解具体方式。\n\
  - 当我们确认你已遵循所有指南后，将支付这笔金额。届时你也会收到所有关于如何收款的信息。\n- 请允许最多14天到账。\n\n### 你的[总数量]条帖子指南\n\
  \n信息流帖子\n\n- 在项目符号中包含详细说明，以提供创意指南。\n- 提及图片中应包含什么、避免什么。\n\n文案\n\n- 以#广告或同等内容开头。\n\
  - 提及[话题点]。\n- 强调[重要注意事项]。\n- 行动号召：鼓励你的粉丝[行动号召]。\n\n快拍（4段以上视频片段，或你要求的任何形式）\n\n- 创意方向是什么？示例：展示一些“幕后花絮”，比如你如何[创意方向...]。\n\
  - 行动号召：鼓励你的粉丝[行动号召]。\n- 请务必在所有片段中包含话题标签和上滑链接。\n\n### 灵感\n\n附上一个文案示例或之前成功合作的链接。\n\
  \n最后，附上一张包含九张灵感图片的3×3灵感板。\n\n要加入活动，[点击此处/回复我/或其他行动号召]。\n\n这个邮件模板（当然会根据每场活动的具体情况进行不同程度的调整）已成功应用于Instagram和YouTube上超过10,000次合作。它还能进一步改进吗？当然可以，但它每次都能完成任务。\n\
  \n我知道当品牌方和营销专业人士看到这个模板时，可能会觉得简报过于详细、过长，没人会读，等等。首先，这是错误的。我亲眼目睹了这个模板在数千次合作中的使用情况。其次，创作者经常表达他们的感激之情，因为他们的疑问能在第一时间得到清晰完整的解答。为什么？因为它以结构化、易读的格式回应了全部17个问题。\n\
  \n请记住，一旦有人确认想与你合作，你可以补充关于产品的额外信息以及活动的详细注意事项；只要确保活动的范围保持不变即可。\n\n## YouTube创作者创意简报\n\
  \nYouTube在其官方品牌和创作者指南中，发布了一份六步指南，用于撰写有效的创作者创意简报，可在其网站上查阅。¹³ 他们建议品牌包含以下基本要素：目标、洞察、风格与信息、交付物、包含内容以及创意控制。\n\
  \n### 目标\n\n活动的目的是什么？你希望达成什么？第一个要素的关键考量包括你的挑战、目标，以及用于制定策略的洞察。YouTube建议你尽可能清晰具体，并聚焦于创作者在整体活动中所扮演的角色。此外，提供竞争基准并定义你用来衡量活动是否成功的指标也会有所帮助。\n\
  \n### 洞察\n\n你能提供什么关键洞察，以便创作者为其视频开发引人入胜的故事线？如果可能，请包括洞察、数据、市场或消费者洞察，以及你的品牌具体希望触达的人群。\n\
  \n### 风格与信息\n\n你的品牌个性是什么？是否有你希望创作者在视频中包含的话题点、关键信息、措辞或词语？简报的这一要素将有助于确保品牌一致性。\n\n\n\
  \n\n\n## 交付物\n\n创作方要求的最终交付物是什么？视频将在哪里发布？你要求获得哪些权利？\n\n## 包含内容\n\n你的视频中是否有某些必须具备的内容，或者需要避免的内容？此外，YouTube\
  \ 建议品牌方明确品牌安全要求、变现设置、FTC 合规要求以及品类排他性。在签署合同或启动内容制作之前，处理好所有要求非常重要。\n\n## 创意控制权\n\n\
  最后，创作方拥有什么样的创意控制权？在前期和内容审核期间提供详细的反馈，避免重拍或漫长的反馈周期。\n\n## 口碑传播\n\nSpaceX、比特币、Spotify、Uber、Slack、Flappy\
  \ Bird（你还记得 Flappy Bird，对吧？）和 Amazon Prime 有什么共同点？\n\n令人难以置信的增长——主要由口碑驱动。\n\n它们的用户、客户、忠实粉丝和品牌大使似乎都无法闭上嘴——这是件好事！但究竟是什么让像前面那些例子中的产品或服务值得被谈论？在这些例子中，是否存在一些共同的特征，使它们更有可能成功？\n\
  \n如果确实如此，作为营销人员，我们能否拆解这些要素，并将其原则融入我们的创意开发（甚至产品开发）中，从而更有可能取得成功？\n\n你还记得朋友向你推荐那个应用的时候吗？按下按钮，几分钟内就有专属司机到达。¹⁴\
  \ 那种可以随时免费点播任何歌曲的音乐流媒体服务呢？¹⁵ 还有那个简单得恼人却又让人上瘾的、有只拍打翅膀的小鸟的移动小游戏？¹⁶ 那只让所有人——包括它的创作者——都抓狂的小鸟。\n\
  \n## 口碑传播的七个原则\n\nFlappy Bird 征服了世界；它的越南创始人阮哈东精神崩溃，将该应用从 App Store 下架。但你还记得它最初在\
  \ Twitter 上爆火、然后席卷新闻的时候吗？这些事情看似随机，其实并非如此。\n\n我在音乐流媒体服务 Spotify 工作了五年多，专门负责用户增长（在加入\
  \ Spotify 之前，我在 King Digital Entertainment——即《糖果传奇》的开发商，另一个可以列入前述成功产品名单的绝佳例子——工作）。我拥有一种不公平的优势，能够亲身研究这些事情，在它们发生的同时，接触到外人无法获得的所有相关数据和洞察。\n\
  \n当我开始剖析是什么让某些产品或服务比其他产品或服务更常被谈论时，我发现你能够应用以下原则越多，你的品牌、产品或服务（或营销活动）就越有可能通过口碑获得动力。\n\
  \n要知道，世界上最好的营销（尤其是网红营销）不一定非要过度创意才能引发非凡的热议或口碑。相反，它可以被简化到这样一个程度：你是在放大市场上已经存在的、与你目标受众产生共鸣的信息。\n\
  \n这当然不是万能的解决方案，也不总是一帆风顺，但如果应用得当，它可能非常强大。\n\n说到应用洞察，你可能会想，这与网红营销以及本书的背景和内容有什么关系？简而言之，如果你的活动核心信息能够满足这些条件，那么你的活动参与度、赢得媒体效应和放大后的口碑传播都将显著提升。\n\
  \n因此，你可以通过问自己以下七个问题，来判断自己是否开发出了一个人们会谈论的创意、价值主张或传播策略。你不必对每个问题都回答“是”，但这些问题契合度越高，你的成功机会就越大。这些问题如下：\n\
  \n- 1. 它是否解决了一个问题？\n- 2. 它是否容易被谈论？\n- 3. 分享它是否会让人感觉良好？\n- 4. 它是否激发了一种“世界真奇妙”的感觉？\n\
  - 5. 它是否能开启对话？\n- 6. 它是否与我们的核心目标受众相关？\n- 7. 一旦体验过，它是否超出了你的预期？\n\n在这里，“它”指的是你的产品、服务、价值主张、创意或创意活动。回到本节开头列出的名单（SpaceX、Spotify、Uber、比特币、Slack、Flappy\
  \ Bird 和 Amazon Prime），问自己这七个问题，你会发现答案很多时候都是“是”。\n\n那么商业信息和广告呢？搜索“21 世纪顶级广告活动”¹⁷，你会看到\
  \ AdAge 的榜单上有这样的活动：\n\n- 《蠢蠢的死法》\n- 苹果：《买台 Mac》\n- 红牛：《Stratos 平流层计划》\n- 多芬：《真美行动》\n\
  - Old Spice：《你男人闻起来像这样的男人》\n\n去看看这些案例，再回到这些问题上，你会发现这些原则可以应用于一些有史以来最具标志性的广告（它们似乎也是被分享最多的广告）。那么，现在已经成为经典的\
  \ Old Spice 广告¹⁸（以 Isaiah Mustafa 骑着白马为特色）解决了什么问题（问题 #1）？\n\n它面向女性说话，同时又不让男性感到被排斥。\n\
  \n与此同时，红牛 Stratos¹⁹ 活动确实激发了一种“世界真奇妙”的感觉，或者用他们自己的话来说，“为了人类的利益，推进航空航天领域的科学发现。”²⁰\n\
  \n分享《蠢蠢的死法》视频²¹ 是否让人感觉良好？事实上，它太有趣了，以至于被做成了不止一款、而是两款手机游戏。经典的《买台 Mac》²² 活动是否开启了与其核心目标受众相关的对话？当然，它帮助苹果卖出了更多电脑，并提高了市场份额。²³\n\
  \n这些创意解决了问题，容易被谈论，分享起来感觉良好，激发“世界真奇妙”的感觉，开启对话，与核心目标客户群体相关，并且超出了我们作为消费者的预期。\n\n需要注意的是，在这些例子中，解决问题的程度、开启对话的程度以及带来好感觉的程度自然各不相同——但重要的是让你的信息和创意尽可能多地与这些原则保持一致，以产生更大的影响力。\n\
  \n让我们拆解口碑传播的七大核心原则，看看每一条如何应用到你自己创意开发中。\n\n### 原则 1：解决问题\n\n比任何其他产品都更好地解决问题的产品和服务，自然会获得有机的新用户增长。Uber\
  \ 是一个绝佳的例子；Slack 是另一个。SpaceX 在解决拯救人类的问题，而 Spotify 则让全世界的人都能听到世界上的音乐。\n\n但这也可以以娱乐的形式出现（Flappy\
  \ Bird、《糖果传奇》），或者以你传达某个问题或文化相关话题的方式出现（Old Spice：《你男人闻起来像这样的男人》，多芬：《真美行动》²⁴）。\n\n\
  具体到网红营销，我们有一些例子可以分享：\n\n我们的一位客户在 YouTube 上制作了一百多个视频，每个由创作者制作的视频都突出了他们特别喜欢该移动应用的某个特定功能，以及它如何为他们解决问题。\n\
  \n我们最近为 Adobe 制作并分发了一系列 60 秒视频（“咖啡休息教程”），幕后揭秘了世界上一些最有才华的摄影师如何编辑他们的照片。\n\n事实上，我们已经为\
  \ Adobe 制作了几个围绕这一理念的营销活动：在 Instagram 上关注才华横溢的摄影师的人们渴望学习他们如何创作内容，带他们走进照片制作的幕后。\n\n\
  ### 原则 2：让内容容易被谈论\n\n成功的一半往往在于将一个想法浓缩和简化到从内容创作者和内容消费者的角度来看都容易谈论的程度。保持简单，它就会容易且更有可能被谈论。简而言之，如果你不能在餐桌上用几句话分享出核心想法，那么它很可能不会在人群中传播开来。\n\
  \n\n\n\n\n一个概念、想法、产品或体验易于谈论的另一个好处是，它最终会缩短病毒式传播周期。关于病毒式传播已经有很多论述，所以我不会对这个主题进行深入探讨，但“病毒式传播周期时间”本质上是指从你的信息被某人接收到的那一刻起，到那个人将消息传给下一个人的时间。\n\
  \n病毒式传播周期时间越短，传播得越快。\n\n## 原则 3. 分享起来感觉良好\n\n我最近发现了哈佛商业评论 1966 年的一篇文章，作者是 Ernest\
  \ Dichter。 在这篇 52 年前的文章《口碑广告是如何运作的》中，这位美国心理学家和营销专家，被誉为动机研究的之父，概述了他研究发现的结果：一个人如果“从中得到好处”，就更有可能谈论一个品牌。\n\
  \n但这如何与我们分享感觉良好可分享的东西的原因联系起来呢？\n\n他的研究揭示，我们从传播感觉良好可分享的东西中获得自我满足感，具体来说是从确认我们对产品、服务或体验的所有权和喜悦的角度——更具体地说，是我们对其的发现。\
  \ 不妨回想一下最近在餐厅、音乐会或度假时的经历，让你感觉非常好，以及你如何回到经历后立即告诉朋友们。 它帮助你重温并获得当时感受到的美好感觉，也让另一个人感觉良好。\n\
  \n## 原则 4. 唤起世界是一个令人惊叹的地方的感觉\n\n> 世界上有许多负面的事情——同时发生着很多可怕的事情，有很多问题需要解决——但生活不能仅仅是解决一个又一个可悲的问题。\
  \ 需要有能激励你的事物，让你高兴地在早晨醒来并成为人类的一部分…\n> \n> —Elon Musk\n\n成功唤起世界是一个令人惊叹的地方的感觉的想法——尤其是表现良好的品牌、服务和产品——往往会唤起\
  \ precisely 这些感受。 这也延伸到小规模和宏大规模的人。\n\n肯尼迪通过宣布他将把人类送上月球，唤起了世界是一个令人惊叹的地方的感觉。 Elon\
  \ Musk 继承了他的脚步，并宣称他的目标是在火星上建立一个自给自足的城市。\n\n唤起世界是一个令人惊叹的地方的感觉这一原则不仅仅适用于那些要去太空的人——这个想法也可以从个人、品牌和讲故事的角度在微观尺度上应用。\
  \ 不妨看看 Instagram 上的 People Are Awesome，你就会看到数百万人如何参与、产生共鸣并分享围绕第四原则构建的故事。\n\n## 原则\
  \ 5. 开始一场对话\n\n最好的口碑是在办公室饮水机旁、与朋友共进晚餐时或在早晨通勤时被 overheard 的话题。 会引发讨论、挑起辩论，甚至使受众两极分化的对话话题。\n\
  \n围绕开始对话以放大其获得的媒体和口碑而构建的产品、服务和创意广告活动不计其数——当我想到这一第五原则时，浮现在我脑海的是我 2016 年与团队一起从事的一个营销项目。\
  \ 一个相当不寻常的公关活动，带有影响者营销的元素。 对话的开端和话题是什么？\n\n> “由避孕套材料制成的长跳服能否让运动员表现更好？”\n\nSKYN 避孕套的宣传噱头和营销活动恰逢\
  \ 2016 年奥运会。 受 Speedo 创纪录的高性能泳衣的启发，该泳衣因模仿鲨鱼皮而闻名（后来被奥运会禁止），SKYN 设法利用了已经发生的对话。\n\n\
  而且虽然该活动并没有推广其核心产品或避孕套的独特卖点，但它在每个人都在谈论奥运会的时候，开始了关于性能和替代材料设计（非乳胶产品，适合过敏或敏感人群）的对话。\n\
  \n> “当运动员跃入空中时，[跳服上的] 翻边会打开，产生向上的升力，有助于长跳运动员在空中停留更长时间，”他在接受 Complex 采访时解释道。 “这件服装尚未正式测试过\n\
  \n看，我们不会告诉朋友我们喜欢的产品和服务。 我们谈论的是我们无法想象的更伟大的事物。\n\n“你看到了吗”，“你听说过吗”，“你不会相信”，“看看这个”，和“你能想象吗”才是会出现在餐桌上的话题。\
  \ 而这很重要，因为 90% 的口碑发生在离线。³¹\n\n如果你能将你的活动、品牌、产品或服务（通常只是上述内容的其中一个方面）转变为餐桌话题，因为它超出了预期，你会通过口碑看到爆炸性增长。\
  \ 而且，这里是如何做到这一点的。\n\n## 放大已经进行的对话\n\n在核心层面，超越客户期望的关键在于弄清楚你的消费者到底在说什么（他们的朋友又会与他们的朋友分享），并放大该信息。\n\
  \n一旦你理解了口碑循环，你就会理解如何将产品营销转变为口碑的地点、方式和原因。\n\nPepsi Max 在 2017 年的一项影响者营销活动中应用了这一原则，其中每位参与者都分享了\
  \ Pepsi 和姜令人惊讶的绝佳组合——以及它如何超出他们的预期。 一个大胆的承诺，结果与那些喜欢 Pepsi Max 和姜味的人产生了很好的共鸣（原则 #7）。\n\
  \n回到我在 Spotify 的亲身经历，我想分享一种我用来逆向工程这一第七原则的方法。\n\n现在，应该指出的是，有一些事情我可以透露，而另一些我不能，但应该不会让人感到惊讶的是，像\
  \ Spotify 这样的订阅业务和像 King Digital Entertainment 这样的游戏发行公司的增长并不是随机的。\n\n然而非常强大的是，我敦促你为你的品牌、产品或服务所做的，是深入研究驱动口碑的定性和定量方面，以了解它如何应用于你的核心产品、服务或品牌，或应用于特定活动、产品发布、重新定位的开发，或在进入新的目标细分市场或市场时。\n\
  \n例如，在 2014 年，Spotify 用户增长的很大一部分是由口碑驱动的——虽然可以追踪推荐和流量来源，但更强大的方法是问你的用户为什么他们购买了你的产品，订阅了你的服务，或下载了你的应用。\n\
  你希望超越用户或客户的来源，了解如何和为什么。\n\n## 如何确定驱动你有机增长的因素\n\n为自己设置一个调查平台，如 SurveyMonkey³² 或 Typeform³³，并向过去\
  \ 30 天内购买了你产品的用户或客户发送电子邮件。\n\n电子邮件应简短扼要，并回答你为什么进行调查以及调查参与者能获得什么好处（例如，改善他们的体验或使其更相关并与他们的期望保持一致）。\n\
  \n你的第一步是弄清楚你的客户来自哪里。 第一个问题的三个示例：\n- 1. “是什么让你注册我们的服务？”\n- 2. “是什么让你购买我们的产品？”\n-\
  \ 3. “是什么让你下载我们的应用？”\n\n列出最常见的推荐来源，并让调查受访者选择一个主要来源。 几个示例（根据你的产品进行调整）：\n- 1. 我看到了你的产品的广告。\n\
  - 2. 一个朋友推荐了你的产品。\n- 3. 我在 Google 上找到了你。\n- 4. 我在新闻中读到过你。\n- 5. 其他（简短的文本答案）。\n\n\
  如果你第一次运行这种调查，你希望在此处包含第五个选项，以了解是否有你遗漏的推荐来源（或以与消费者在脑海中感知的方式不同的方式表述你的选项）。\n\n不用担心，你的目标不是建立一个可靠或科学的归因模型。\
  \ 你的目标是识别用户如何感知他们对你的产品的发现和首次体验。\n\n\n\n\n\n# 第4章 | 创意的艺术与科学\n\n现在，你需要做的是，找出所有选择了选项2（好友推荐）的用户，并通过后续提问来了解他们是如何以及为何这样选择的。同样，你会问三个问题（注意措辞，使其符合你的具体业务场景）：\n\
  \n记住，只有在“好友推荐了你的产品”这一答案为真时，才会继续问这些问题。\n\n1. 你的朋友当时说了什么，让你决定购买我们的产品/安装我们的应用/光顾我们的门店（等等）？\n\
  2. 以1-10分为标准，你有多大可能向认识的人推荐我们的服务/产品/品牌？\n3. 你会如何向朋友描述我们的服务？\n\n当你向客户开展这类调查时，你会发现的结果绝对会令人震惊。\n\
  \n第一个问题是最强有力的，因为它会精准地揭示你的产品在市场上是如何被认知的。你需要逐一分析每个回答，寻找反复出现的主题和关键词。关注这些答案。这可能会让你感觉是一项艰巨且耗时的任务……但请花时间去做，你将比地球上任何人都更快速地了解你的客户。\n\
  \n你会发现你的客户向朋友做出了什么样的承诺，而通过跟进第二个问题，你就会知道这些承诺是否被兑现。这些对话正发生在餐桌旁、电子邮件里、咖啡时间、学校、工作场所，以及清晨的通勤途中——无论你是否喜欢。如果你看到你的增长很大一部分来自朋友推荐，并且许多被推荐者也表示他们会向朋友推荐你的服务，那你就是走在了正确的道路上。第三个也是最后一个问题将帮助你了解他们对你服务的哪些方面印象深刻。\n\
  \n你还会发现，会存在多个群体和细分市场，代表着不同的需求、问题和解决方案。这正是我在Spotify所做的（以及最近为其他几个客户所做的），来精准揭示不同细分市场、年龄段、国家和用户群体中的客户是如何谈论他们所推广的服务、产品或体验的。将这些反复出现的共同主题融入你下一次的影响力营销活动中，你将放大已有的口碑效应。额外的好处是，它将帮助你现有的客户清晰地表达那些你知道能与他们谈论你品牌或服务的方式产生共鸣的内容。\n"
- '## 以创作者为中心的策略


  将你的价值扩展到金钱之外，并以创作者为中心的视角来提高影响力营销的投资回报率


  > 营销不是一个部门的功能，而是从客户视角看到的整个业务。

  >

  > ——彼得·德鲁克¹


  ### 关键问题


  - 为什么10个影响者中有9个会在社交媒体上关注品牌？

  - 品牌在Instagram上创建内容时犯的头号错误是什么？

  - 作为在线创作者或影响者，最大的十个挑战是什么？

  - 在决定想与哪些品牌合作时，影响者最关心什么？

  - 合理的金钱报酬水平是多少？


  ### 核心原则


  1. 金钱之外的价值。

  2. 成为以创作者为中心。

  3. 一致性、创造力和社区。

  4. 品牌自我评估。

  5. 没有免费的午餐。


  我有好消息和坏消息。先说好消息，好吗？在Instagram上，10个影响者和内容创作者中有9个会关注他们喜欢并想合作品牌。你已经吸引了他们的注意力！在注意力经济中，这是一种稀缺货币——争夺注意力的竞争正呈指数级增长。准备好听坏消息了吗？你很可能正在让他们大失所望，而且是极度失望。


  在筹备撰写这本书的过程中，我与Instagram上的200多位影响者²进行了交流，以了解他们对当前社交媒体格局的看法。这项研究揭示了几个相关的深刻见解，可以用来解决问题，并为创作者和品牌双方创造新的机会。


  贯穿本章的主要论点是：通过以创作者为中心的视角来进行影响力营销，你将增加他们与你合作的价值——而不是相反。作为交换，你将创造杠杆作用，从而提高你的投资回报率。但我们所说的“以创作者为中心”是什么意思呢？简单来说就是，每个问题、挑战和机会都应该首先通过你所合作的创作者和影响者的眼睛来观察。也就是说，当你从他们的参考框架来看待事物，并接纳他们的视角时，你将完全了解设身处地为他们着想是什么感觉。


  ### 创作者的期望


  让我们更深入地看看我们提到的好消息和坏消息。研究发现，87%的受访者（每位都是在Instagram上拥有至少10,000名粉丝的创作者）在Instagram上至少关注一个品牌。这显然是好消息，但他们对这些企业及其社交媒体存在有什么期望呢？在第一个问题的后续中，每位创作者都被要求分享他们对这些品牌的期望³，以及（从创作者的角度来看）他们最大的错误是什么⁴。检查一下对第一个问题的200个不同回答，四个清晰的主题浮出水面。


  ### 你为什么要关注Instagram上的品牌？


  1. 灵感：我关注他们是寻求灵感（28%）、新闻/潮流（10%）。

  2. 喜爱：我喜欢这个品牌及其产品（21%）。

  3. 合作：我已经与他们合作过（16%）或希望与他们合作（6%）。

  4. 发现：发现品牌的新产品（17%）。


  所以，你的品牌被影响者关注，他们向你寻求*灵感*、新闻和*潮流*，因为他们喜爱你的*品牌*和*产品*。他们想要发现新事物，并且要么与你合作过，要么希望在未来某个时候与你合作。


  ### 品牌自我评估


  在进入下一节之前，请先回答这些问题，我们将在下一节中找出品牌在Instagram上犯的最大错误——以及如何达到前面所提及的期望。


  1. 你在Instagram上的存在是否具有启发性，包含来自你所在行业的产品新闻和潮流？

  2. 你的关注者是否能轻松发现新产品？

  3. 你是否让创作者能够轻松地联系到你？


  接下来，同样的一批受访者被问了一个不同的问题。200个不同的回答被整理成33个不同的组别，其中80%的回答可以归入以下六个主题之一。


  ### 品牌在Instagram上创建内容时犯的头号错误是什么？


  1. 过于以产品为中心

  2. 不一致或没有清晰的主题

  3. 没有互动或在评论区回答问题

  4. 没有故事性、个性或真实性

  5. 过于商业化、交易化，而且……无聊！

  6. 你的内容看起来像杂志广告！


  我向每个分享这份列表的营销团队展示时，他们的反应都是“哎哟！他们说的就是我们！”确实是坏消息。是时候再进行一次自我评估了。


  ### 品牌自我评估


  根据Instagram上社交媒体影响者的说法，回答这些问题来评估你的品牌是否犯了这些最常见的错误。


  1. 你的内容是否主要关注产品，通常有产品特写？（过于以产品为中心）

  2. 你是否有一个创造性的主题并始终坚持如一？（不一致或没有清晰的主题）

  3. 你是否有专门的团队或个人来回应问题，并在评论区或私信中与关注者互动？（没有互动或在评论区回答问题）

  4. 你是否在讲述一个有趣或能体现个性的引人入胜的故事？（没有故事性、个性或真实性）

  5. 你是否主要关注业务的商业层面，并使用社交媒体渠道来销售产品？（过于商业化、交易化，而且……无聊！）

  6. 你是否使用为其他营销渠道制作的内容，比如杂志和/或广告？（你的内容看起来像杂志广告！）


  所以，好消息——吸引到了注意力。坏消息——期望未得到满足。无论如何，或多或少都取决于你在第二次自我评估中的回答。无论情况如何，我认为这六个清晰的主题是构建一个创作者和影响者喜爱的社交媒体存在的指导原则。


  这些见解中还隐藏着另一个重要的教训。这些反馈是基于数百位才华横溢的创作者的集体经验，而不是某一位行业专家或社交媒体顾问的意见。这数百位影响者，代表了数百万创作者，他们已经掌握了内容制作、分发和粉丝参与的艺术。他们首先是一线的实践者。在一个传统营销学者难以跟上步伐的世界里，他们正蓬勃发展——每个人都有一套自己的方法论，并随着他们适应不断变化的数字格局而持续演变。他们花在内容、语气和受众上的时间越多，就越倾向于凭直觉行事。创作者社区是一个关系紧密的群体。他们相互交流，分享建议，并向同行们寻求下一步的动向。


  那么，对于那些希望创作更优质内容、建立更大受众群并吸引社区参与的其他创作者和品牌来说，他们能从中得到什么启示呢？






  ## 一致性、创造力与社群


  这些专家小组成员是根据一个重要标准精心挑选出来的：拥有极高参与度的受众——至少高出平均水平 50%。换句话说，这些创作者不仅建立了庞大的粉丝群，而且他们的受众更有可能关注他们的内容。


  当被问及对其他创作者最重要的建议是什么时，有两个建议反复出现。


  保持一致性（或者找到自己的细分领域）以及与社群互动。


  回顾之前提到的常见错误清单，这些建议似乎是同一枚硬币的两面。关于一致性，一位创作者这样建议：“我建议他们首先把重心放在内容和质量上，而不是其他任何事情。人们点击你的主页时，第一眼就会决定是否关注你，因此维护一个形象或‘品牌’会让你的作品展示得更加井井有条，而如果人们
  1）明确知道能从你这里得到什么；2）欣赏你的质量和一致性，他们就更有可能关注你。”


  研究中经常提到的另一个常见错误是缺乏社群建设。“很多品牌会在推文中向粉丝提问，却无视粉丝向他们提出的问题。这是一个巨大的错误，表明他们根本不关心用户，”一位网红评论道。


  现在你已经站在他们的角度思考过，也更清楚地了解了创作者群体喜欢和不喜欢所关注品牌的哪些方面，是时候更进一步，揭示他们最大的问题是什么了。


  还记得我们的论点吗？提升创作者从与你的品牌合作中获得的价值，你就能提高自己的投资回报。但除了显而易见的额外金钱报酬之外，你如何提升他们的价值？解决他们的问题和挑战。当你做到这一点时，你交换的东西比金钱更有价值。作为你创造价值的回报，你将成为一个无价的合作伙伴。


  ## 超越金钱的价值


  作为在线内容创作者/网红，你面临的头号挑战是什么？如果你知道这个问题的答案，并能围绕解决他们的问题来制定你的网红营销策略，你将赢得创作者群体的心，并进而有机会将网红营销转化为你最有价值的分销渠道。为了省去你的麻烦，我们在过去几年里采访了数百位创作者和网红，并整理出了以下清单（按相关性排序）。


  ### 作为在线内容创作者/网红，你面临的头号挑战是什么？


  1. 创作高质量内容

  2. 击败 Instagram 算法

  3. 与粉丝互动

  4. 触达更广泛的受众

  5. 想出新点子

  6. 找到时间

  7. 获得与品牌的合作

  8. 脱颖而出、保持原创

  9. 创造真实且引人入胜的合作

  10. 频繁发布（每天发布）


  仔细观察，会发现两个清晰的主题浮现出来——内容策略（第 1、5、8、9 项）和受众互动（第 2、3、4、10 项）。换言之，如果你能构建一个以帮助网红创作高质量内容、构思新想法、脱颖而出并保持真实与吸引力为核心的内容策略，你就创造了远比金钱报酬更有价值的东西，而由此，你们双方都会看到这段合作关系的更大价值。同样，如果你能制定一个极具吸引力的创意简报或活动方案，例如通过交叉推广或分发（受众互动）来带来更多曝光，你就是在围绕几乎所有人都公认的首要痛点来构建策略。


  你注意到其中两个挑战不属于这两个主题吗？第 6 项“找到时间”和第 7 项“获得与品牌的合作”。我们来谈谈这两项。


  通过遵循第 6 章“规模化的一对一关系”中概述的步骤，你将掌握高效的艺术并消除限制——你会主动表明自己尊重合作对象的时间和精力。第二个挑战显然可以通过与你的品牌合作来实现，但还不止于此。如果你能展示出与你的品牌合作可能会带来额外的合作机会，你就能立即提升你们关系的价值。


  ## 品牌自评


  回顾这份清单。按 1 到 10 分打分，评估你的品牌在解决每项挑战方面的可能性——无论是总体而言，还是针对某个特定的活动简报。是什么会改变这个分数？


  ## 品牌与活动案例


  为了将这些洞察置于营销背景中，你现在将看到五个不同的公司案例，它们在产品、品牌和活动中实施了以创作者为中心的策略，以提升超越金钱的价值。


  ### Sugar Bear Hair


  www.sugarbearhair.com


  **业务内容：** 电商、头发矿物质产品


  **营销挑战：** 商品化，缺乏故事性


  **解决的痛点：** 高质量内容、真实合作、想出新点子


  **以创作者为中心的策略：** 通过以允许参与网红以不同创意方式表达对产品喜爱的方式设计产品，Sugar Bear Hair 得以挖掘庞大的创意人才库，并给予他们自由去构思新想法和创作高质量内容——即使这些内容都以他们的产品为核心。


  ### YouTube Music


  music.youtube.com


  **业务内容：** 优质音乐流媒体服务


  **营销挑战：** 市场饱和，用户对直接竞争产品有强烈偏好


  **解决的痛点：** 脱颖而出、保持原创、与粉丝互动、找到时间


  **以创作者为中心的策略：** YouTube Music 让艺术家和网红邀请他们的粉丝参加独家发布活动。这创造了一种体验，让参与者忍不住去传播真实的故事，并将所见所闻告诉其他人。


  ### Museum of Ice Cream


  **以创作者为中心的策略：** Museum of Ice Cream 是为 Instagram 而生的。与传统博物馆不同，展览的每个部分都经过设置，邀请参观者创作富有创意且高质量的内容。由于门票供不应求，Museum
  of Ice Cream 创造了一个让参观者（以及网红）能够创作独特内容和故事的场景。


  ## 创作者想要什么：品牌合作的决定因素


  以创作者为中心的拼图的几个部分开始各就各位。在本节中，我们将深入探讨以创作者为中心的网红营销方法的另一个重要方面，即创作者对你的品牌有什么期望、在寻找什么！*获得与品牌的合作*在网红的常见挑战清单中排名第七——但事实证明，并不是来自任何品牌的任何合作都可以。在
  2017 年的一个系列采访⁵中，我们采访了 81 位有影响力的社交媒体创作者，以了解他们每月会收到多少个品牌的合作邀约。结果呢？每月 10 到 100 个提案，平均
  20 个。显然，机会并不缺乏。然而，这些品牌邀约大多无人回应。这是为什么？


  ### 价值观与个人品牌契合


  品牌安全，以及确保你的品牌内容在一个规避风险、语境适当的环境中展示，是从事网红营销的营销人员经常提到的担忧。因此，品牌理所当然地投入时间和资源，以确保他们与正确的人合作。


  但请注意，这扇门是双向的，*个人品牌契合度*实际上是网红决定是否与你的品牌合作的首要考虑因素⁶。见图 5-1。


  ![](img/7ec2733715193510646aec32cc18284f_98_0.png)


  **图 5-1.** 网红在决定与哪些品牌合作时最看重什么？


  网红营销公司 AspireIQ 的研究发现，在对其平台上的 200 位网红进行调查后，个人品牌契合度（72% 的受访者）比金钱报酬、品牌知名度和免费产品价值加起来都更重要。这一洞察也反映在我自己公司发布的《2020
  年网红健康报告》中——我们发现*核心价值观一致*是与品牌合作的首要决定因素。见表 5-1。


  **表 5-1.** 品牌合作的决定因素


  | 因素 | 受访者比例 |

  |---|---:|

  | 他们付多少钱 | 14% |

  | 我知道他们的产品/服务有效 | 27% |

  | 我之前听说过他们的品牌 | 3% |

  | 他们的核心价值观与我的一致 | 34% |

  | 他们给我创作自由 | 23% |


  两项研究彼此独立，却都揭示了另一个有趣的洞察：*你的品牌价值观比你有多出名更重要。* AspireIQ 的调查中只有 4%，2020 年《网红健康报告》中只有
  3%。这是个好消息






  # 第5章 | 创作者中心策略


  你是否听过“便宜没好货”这个说法？这句谚语的意思是，如果你支付的报酬很低，就只能吸引到能力不足或技能不高的工人（因为更优秀的工人可以去别处赚取更高的薪水）。当你制定网红营销策略时，情况也是如此。


  正如AspireIQ的研究所示，金钱报酬的价值比免费产品的价值高出10倍（22%对比2%）。因此，你的产品在创作者眼中的感知价值通常非常低。我们公司基于Instagram和YouTube上超过10,000次合作进行的内部研究，包括对数千名网红的访谈和调查，进一步表明，只有8%的人对仅以免费产品作为报酬的合作持积极回应。用你的产品作为唯一报酬来补偿网红的实际后果是，你需要付出10倍的努力才能达到同样的效果。


  显然，产品赠送几乎没有价值，那么创作者如何决定合适的金钱报酬水平以及自身的价值呢？在2018年至2019年间，从YouTube和Instagram上的839位网红收集的数据表明，最常见的决定因素是“我的受众规模以及品牌要求我做的事情。”¹¹
  那么，创作者期望获得多少报酬呢？


  ### 行业费率


  近年来，网红营销领域发生了巨大变化，而且没有任何迹象表明该行业的增长轨迹会放缓。这些快速发展导致了格式、最佳实践和行业费率的不断变化。


  这正是媒体出版行业的本质——它一直由供需的良性循环所主导。最初，广告库存非常充足。由于供应过剩而需求不足，广告成本很低，几乎免费。因此，广告主像大雁一样蜂拥而至，利用这一新发现的机会，而供应的短缺最终为出版商或任何拥有广告库存的人创造了提高收费的机会。数字媒体中的广告成本因季度、行业和市场而异。在大多数平台和网络上，变化是即时的、实时的，更不用说新的创意格式、定向能力和广告技术了。


  > ¹¹ 内部研究，Relatable。2018–2019年。N=839（多选题：“你如何知道与品牌合作应该收取多少费用？”）


  我很想提供一份经得起时间考验的全面网红营销费率表——但无论我写下什么，很可能在你读到的时候已经过时了。然而，我们能做的是阐明“我的受众规模以及品牌要求我做的事情”真正意味着什么。


  暂且不论你认为正确的媒体规划和衡量营销效果的方式，当社交媒体创作者在品牌合作中提到他们的受众规模时，要么是指他们在Instagram上的粉丝数（而不是他们内容将获得的实际触达），要么是指YouTube上的预估观看量（而不是订阅者数量或实际观看次数）。


  在广告和网红营销中，CPM（“每千人成本”¹²）通常用于衡量和估算品牌为其广告中的1000个单位支付的费用，通常是触达、观看或曝光。在Instagram上，这个单位是粉丝。


  在YouTube的创作者社区中，CPV（“每次观看成本”）经常用于估算合作关系的成本或价值。但在这里，这个数字既不是基于频道订阅者（相当于Instagram上的粉丝），也不是基于已交付的观看量（实际曝光或触达），而是对未来观看量的预估。该预估通常基于发布后前30天内最近五到十个视频的平均或中位观看量。


  当然，两个平台上还有其他关键变量会影响每千名粉丝成本或每次观看成本。在Instagram上，这包括内容格式、工作量、内容版权、帖子或快拍数量以及季节性。对于YouTube来说，决定制作专属视频还是整合视频（参见第4章“创意的艺术与科学”中的“YouTube上九种经过验证的创意执行方式”）将比其他任何因素都更能影响你的每次观看成本——其中完全专属的视频比整合提及你的产品或品牌的视频成本高出1.5倍到3倍。


  ### 不多不少，恰到好处


  虽然报酬过低或完全不付报酬会产生实际影响，但支付过高也是如此。当你支付过高时，你会遇到另一个挑战：结果。毕竟你的营销预算有限（而且你的老板对这笔媒体预算能实现什么目标抱有不切实际的期望）。


  你如何平衡这两者？应用第6章“规模化的一对一关系”中概述的参与率概念，并记住15%–25%的网红接受你的条件是完全合理的。


  ### 设定明确的付款条款


  互联网创作者协会于2017年6月发布的研究报告《品牌合作现状》发现，29%的受访者曾经历过与品牌的合作中难以获得报酬的情况。每三个人中就有一个——这太疯狂了！我们对如此大比例的在线创作者会证实这种负面经历感到惊讶，于是调查了更大范围的社交媒体网红，得出了相同的结论。26%的人表示，他们做过赞助合作，被承诺付款，但最终根本没有收到报酬。


  这意味着很简单：你接触的每三个人中就有一个人过去曾在报酬上被骗过——如果没有，他们几乎肯定认识被骗过的人。那么，建议是什么？立即设定明确的付款条款，不留任何疑问的余地。你可以使用下面的图表（图5-2）来指导你的付款条款，并设定与预期一致的条款。


  ![](img/7ec2733715193510646aec32cc18284f_102_0.png)


  **图5-2.** 你认为获得报酬需要多长时间？


  本章前面引用的CreatorIQ调查揭示了另一个有价值的见解：网红认为与他们合作的品牌最关心什么。内容质量是最常见的答案（40%），其次是互动率（37%）、粉丝数量（16%）、品牌契合度（12%）和受众人口统计特征（6%）。


  ![](img/7ec2733715193510646aec32cc18284f_103_0.png)


  图5-3. 网红认为与他们合作的品牌最关心什么？


  虽然这些都是任何网红营销活动中明确定义的目标和重要的考虑因素，但创作者和品牌之间的期望保持一致也很重要——但情况并非总是如此。网红营销公司Activate在并行调查网红和营销专业人士时得出了同样的结论¹⁶，以了解每个群体如何看待品牌/创作者合作的目标。在品牌方面，78%的人将品牌知名度列为首要目标，而创作者中只有37%。他们的结论为品牌和创作者提供了一个很好的建议：“*如果网红对营销者的目标有更好的理解，他们就能更好地优化内容以帮助实现这些目标。*”


  第7章“四步网红营销框架”将准确展示如何为你的活动选择正确的营销目标和成功定义。但首先，在撰写有效的创作者中心简报时，还有一件同样重要的事情：创意的艺术与科学。


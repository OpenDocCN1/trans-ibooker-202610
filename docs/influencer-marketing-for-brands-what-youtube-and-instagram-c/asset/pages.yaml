  md: '**Table 7-9.** Creator parameters and values


    | Creator Parameter | Value |

    |---|---|

    | Location | United States |

    | Category | Fashion |

    | Shared values | Sustainability, Equality, Eco-Friendly |

    | Per creator posts or stories | 2 |

    | Total campaign participants | 10 |

    | Average following, or range | 100,000 |


    You may need to revise your assumptions, based on your total budget and unit cost—and
    that’s totally fine. If your target is to reach 2.3 million people, and each campaign
    participant has 100,000 followers, and each share two posts or stories, you’d
    need a total pool of 12 campaign participants to reach your goal.


    ```

    2.3 million reach/(100,000 followers x 2 posts) = 11.5 influencers (rounded to
    12).

    ```


    If your goal, on the other hand, was to create engagement, content production,
    video views, or sales, you’d have a different set of values.


    # The Four-Step Influencer Marketing Framework cheat sheet


    Following the steps outlined in this chapter, and you suddenly have a structured
    workflow each and every time you’re building an influencer marketing campaign.
    Plan or project. I strongly encourage you to improve and adapt this generalized
    process to suit the unique needs of your organization. Table 7-10 is a cheat sheet
    of the four-step framework.'

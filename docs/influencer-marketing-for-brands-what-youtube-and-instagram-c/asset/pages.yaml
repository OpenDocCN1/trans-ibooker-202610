    though they are centered around their product.


    # YouTube Music


    music.youtube.com


    **What they do:** Premium music-streaming service


    **Marketing challenge:** Saturated market, strong affinity for direct competition


    **Pain points solved:** Stand out and be original, engage my followers, finding
    the time


    **Creator-centric strategy:** YouTube Music had artists and influencers invite
    their fans for exclusive launch sessions. This enabled an experience where participants
    couldn’t stop themselves from distributing authentic storytelling and tell others
    about what was going on.'

- pgno: 114
  md: '# Chapter 6 | 1:1 Relationships at Scale


    Further, if you can answer the preceding questions, you’ll face follow-up questions,
    such as (again, in no particular order)


    +   9. How will this help me create content for my audience? (benefits)

    +   10. Any chance that this could hurt my career or personal brand? (risks)

    +   11. Are there other benefits for me that I should know? (benefits)

    +   12. How do I know that I can trust you? (risk)

    +   13. Who else have you worked with? (social proof and community)

    +   14. How much time will this take? (commitment)

    +   15. When will I get paid? (terms)

    +   16. What are your marketing goals? (objective)

    +   17. What makes your product/service special? (unique selling points)


    All perfectly reasonable questions, relevant to anyone deciding if what you’re
    proposing is interesting or not. Your end goal: To minimize asynchronous conversation
    by addressing and answering as many questions as possible, up front, that is,
    before the other party even decides if they want to work with you. And when you
    do, three things will happen: *First*, there’s a reduced dialog between both parties.
    *Second*, because there’s less dialog, your cycle time improves. Instead of multiple
    messages back and forth before you have addressed each relevant question (and
    likely hours, if not days, of calendar time), things can move forward in an instant.
    *Third*, because of the clear communication, your relationship with the other
    party skyrockets.


    There could be other frequently asked questions specific to your brief, campaign,
    or even product that should be addressed as well, but you might be better off
    addressing those further down the road when you begin to spot a pattern.


    # Step 4: Cash rules everything around me


    *Time required:* A couple of hours


    *Effort:* Mid


    *Impact:* Mid


    > “How much will I get paid?”'

- pgno: 32
  md: 'One of the biggest challenges with influencer marketing is knowing that you’re
    working with talent that has the same audience that you’re aiming to reach. Without
    this knowledge, you can’t really justify replacing your existing media dollars
    in channels that have these capabilities. By understanding who their followers
    are both individually and aggregated, you’ll know that you’re not just engaging
    an audience, but your audience. We’ll cover how you do this in detail in section
    “Finding the right creators.”


    # Affinity


    Strategy: Talent independence


    There are more than 2 million YouTube channels with 500+ subscribers. There are
    more than 10 million creators on Instagram with 1,000 followers. Work with a partner
    that can tap into this entire group of potential creators and help you find those
    that have an affinity for your brand, expertise, and credibility.


    Key questions: Affinity: Is there a natural liking for my brand or sympathy for
    the marketing message? Expertise: Is this person knowledgeable in my particular
    field? Credibility: Why is this person trusted or believed by their audience,
    and what’s the “reason to believe” in the marketing message or your promise?


    Unless you operate completely independently, you’re unlikely to get the right
    people onboard for your campaign. A multichannel network or talent agent will
    recommend their rooster and be limited to those that they represent, and sometimes
    they’ll be the perfect fit for your brand, but other times not. That doesn’t necessarily
    make them bad, but it limits their ability to help you build a talent pool proprietary
    to your business (we’ll cover this in depth later in this chapter.)


    With a talent-independent approach to identifying and onboarding the right people,
    we assure that we get the right people onboard every single time, without any
    compromise.


    # Strength of relationship


    Strategy: Optimize for engagement


    Engagement is a great proxy for how strong a relationship is. It’s also a great
    way to objectively assess if the audience is paying attention to your message.
    Aim to work with creators that have an exceptional level of engagement. How do
    you build strategies and campaigns that yield an exceptional level of engagement?
    This will be covered more thoroughly in Chapter 4: The Art and Science of Creativity.
    For now, just keep in mind that engagement will be an'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'important variable when you seek out to identify social media creators with
    influence.


    Key questions: *What target engagement rate should I aim for? Is this number reasonable
    with the former two strategies in mind?*


    The number of people that engage and interact with your campaign is more relevant
    than how many people you’ll potentially reach. That’s especially true if your
    overarching goal is to reach as many people as possible. Why is that? Unless they’re
    paying attention, you’re unlikely to change brand preference, consideration, and
    brand lift or see any kind of impact. By working only with those that have an
    exceptionally engaged audience, your campaign will see a more significant impact.
    A comprehensive engagement rate benchmark report across 15 major countries is
    available for free for at rlt.to/engagement-countries. Use the insights from the
    report to help answer the key questions outlined in this section.


    # Leaders and followers: Social media influencers as early adopters


    In the early 1960s, communication theorist and assistant professor at Ohio University,
    Everett Rogers noticed that ideas, innovations, and new technologies would follow
    a similar pattern as they were spread in culture and society.


    Rogers developed his *diffusion of innovations* theory and published his findings
    in his 1962 book: *Diffusion of Innovations*. In the book (now in its 5th edition)
    Rogers explains how, why, and at what rate new ideas and technologies are absorbed
    by society and how *innovations* are diffused³ in a population. For many (if not
    *most*) marketers, the act of developing new ideas that spread widely in society
    or within a specific population is the very definition of our jobs. As such, there
    are several valuable marketing lessons uncovered in findings published by Everett
    Rogers.


    Several of which are likely widely *adopted* (Get it?) within your own organization.
    Rogers proposes that adopters of any new innovation can be grouped by five different
    phases: innovators (2.5%), early adopters (13.5%), early majority (34%), late
    majority (34%), and laggards (16%), distributed mathematically as a bell curve.
    See Figure 3-1.


    ³ Defined as the process or state of something spreading more widely'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Chapter 3 | *Influence Is an Outcome, Not a Profession*


    ![](img/7ec2733715193510646aec32cc18284f_34_0.png)


    **Figure 3-1.** Product adoption, diffusion of innovations


    Different segments have different needs, and each adopter''s likelihood to accept
    your idea depends on understanding their unique characteristics, needs, attitudes,
    reasoning, and so forth. Rogers found, for instance, that *innovators* and *early
    adopters* will often spread the word, leading to more people accepting the idea,
    to a point where the idea will eventually hit a critical mass, or a point of market
    saturation.


    The different groups, and their key traits, are described in the following way:


    # Innovators (2.5%)


    Innovators are enthusiasts and risk takers who accept a high degree of uncertainty.
    They move fast and appreciate technology, innovation, new ideas, and so forth,
    for their own sake. They’re motivated by the idea of being an agent of change
    and are almost obsessed with venturesomeness, driven by a desire for the rash,
    the daring, and the risky.


    It’s common for the innovator to not be respected by other members of a local
    system. The innovator is a gatekeeper of new ideas and thus play an important
    role in the adoption process.


    # Early adopters (13.5%)


    Often the visionaries, role models, and trendsetters. This adopter category has,
    according to Everett Rogers, the highest degree of opinion leadership. They’re
    “the person to check with,” and it’s common for others to turn to this group for
    advice and information about an innovation or a new idea. While innovators are
    driven by a desire for risk (and potentially be wrong), early adopters know that
    they need impeccable judgment before they put their stamp of approval on a new
    idea.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Early adopters often make excellent test subjects to trial a new innovation,
    as they’re not too far ahead of the average individual in innovativeness.


    # Early majority (13.5%)


    Members of the early majority group are more cautious than early adopters and
    seek to avoid risk by adapting solutions that have been proven by others. They
    tend to avoid complexity, and reliability is an important consideration. They
    pay attention to (and follow) trends, but their adoption process is more deliberate.
    This doesn’t mean that the early majority doesn’t like new products—they’re not
    just as excited about them as the previous two groups.


    Rogers concludes, through his research, those that belong to the early majority
    are less likely to hold positions of opinion leadership. It’s easy to see why
    marketers and brands are obsessed with attracting the early majority: They make
    up a full third of your overall market and are more likely to stick with a product
    they like and buy it over and over again. In that sense, they differ from early
    adopters, who love to try things that are new.


    # Late majority (34%)


    When marketing to this group, you’re addressing the second half of your total
    potential market. Members of the late majority are conservative and await to adopt
    new ideas just after the average member of the total group. They are skeptics
    of innovators and early adopters and need full certainty before they feel safe
    enough to make a decision. Their decision-making process is slower than the previous
    groups, driven by necessity, cost sensitiveness, and peer pressure from others
    in society.


    # Laggards (16%)


    Laggards are suspicious of (and resistant to) innovation. It’s a rational opinion
    from their point of view, as their resources are limited and they must be certain
    that a new idea will not fail before they can adopt. Their point of reference
    tends to be in the past (“We’ve always done things this way!”), and they tend
    to isolate themselves from opinion leaders.


    Laggards value credibility, availability, and simplicity—and further studies have
    shown that there’s a strong correlation between this group and both lower income
    and lower levels of education. Price (and awaiting price falls or promotional
    activities) is therefore important in their decision-making process.


    This should seem familiar, basic even, because the findings have been around and
    been widely accepted, by most marketing professionals, for more than 50 years.
    Dig deeper, however, into the diffusion of innovations theory, and you’ll'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'begin to see an interesting parallel to influencer marketing. One of the big
    (and applicable) ideas in his book is the importance of peer-to-peer networks,
    and how traditional mass media is an effective way of spreading *information*,
    while conversations between individuals spread *adoption*. See Figure 3-2.


    ![](img/7ec2733715193510646aec32cc18284f_36_0.png)


    Figure 3-2. The Bass Forecasting Model


    # He found:


    > While mass media channels are often the most rapid and efficient means to inform
    an audience of potential adopters about the existence of an innovation, interpersonal
    channels are more effective in persuading an individual to accept a new idea,
    especially if the channel links two or more individuals who are similar in socioeconomic
    status, education or other important ways.


    Rogers continues: “Most people depend mainly upon a subjective evaluation of an
    innovation that is conveyed to them from another individual like themselves who
    have previously adopted the innovation.”⁴


    The concept of *peer networks* is an essential element to the diffusion of innovations
    theory and also explains why, and how, influencer marketing is so effective. Innovators,
    and early adopters, effectively become opinion leaders (or *individuals with influence*)
    that ignite an initial “take off” adoption process, furthering the adoption of
    an idea to achieve critical mass.


    ⁴Everett M. Rogers, Diffusion of Innovations, 5th Edition (Free Press, 2003)'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'So, how do you identify key opinion leaders relevant to your marketing objective?
    Rogers suggests that there are, generally, seven key traits that set opinion leaders
    apart:


    +   1. Opinion leaders have greater exposure to mass media than their followers.

    +   2. Opinion leaders are more “cosmopolite” than their followers. They are “people
    on the edge” and can bring new ideas from outside their social group to its members.

    +   3. Opinion leaders have greater contact with change agents than their followers.

    +   4. Opinion leaders have greater social participation than their followers.

    +   5. Opinion leaders have higher socioeconomic status than their followers.

    +   6. Opinion leaders are more innovative than their followers.

    +   7. Opinion leaders are more innovative when a social system’s norms favor
    change, but when the system’s norms do not favor change, opinion leaders are not
    especially innovative.


    # WHAT IS A “CHANGE AGENT”?


    A change agent is an individual who influences clients’ innovation-decisions in
    a direction deemed desirable by a change agency. A change agent usually seeks
    to secure the adoption of new ideas, but he or she may also attempt to slow the
    diffusion process and prevent the adoption of certain innovations with undesirable
    effects.


    > —Diffusion of Innovations, 5th Edition (2003)


    Consider how these traits are related to influencer marketing and identifying
    the right creators, social media influencers, and ambassadors for your brand or
    marketing message, but be careful not to mistake innovators for opinion leaders.
    Opinion leaders have followers, whereas innovators are the very first to adopt
    new ideas and are often perceived as deviants from the norm.'

- pgno: 93
  md: '# Consistency, creativity, and community


    The panelists were handpicked based on an important criteria: an exceptionally
    engaged audience—at least 50% above average. In other words, a group of creators
    that not only have built a large following, but also an audience that is more
    likely to pay attention to their content.


    When asked what their number one piece of advice is to other creators, two suggestions
    kept resurfacing.


    Consistency (or finding your niche) and engaging with your community.


    Thinking of the list of common mistakes from before, these suggestions appear
    to be a different side of the same coin. Here''s what one creator suggests, on
    consistency: “I would advise them to focus on their content and quality more than
    anything else—at first. People will click on your profile and their first glance
    will determine if they want to follow you or not, so maintaining an image or a
    ‘brand’ will showcase your work a lot more neatly and people will more likely
    follow you if they 1) know exactly what to expect from you; 2) enjoy the quality
    and consistency.”


    Another common mistake, frequently called out in the research, is the absence
    of community building. “Many brands will ask a question to their followers in
    their caption while ignoring questions their audience ask them. That’s a huge
    mistake and demonstrate that they really don’t care,” one influencer commented.


    Now that you’ve walked a few steps in their shoes, and have a better understanding
    of what the creative community like and dislike about the brands they follow,
    it’s time to dial things up a notch and uncover what their biggest problems are.


    Remember our thesis? Increase their value that creators will get from working
    with your brand, and you’ll improve your return on investment. But how do you
    increase their value—beyond obvious additional monetary compensation? You solve
    their problems and challenges. And when you do, you’re trading something far more
    valuable than money. In exchange for the value you create, you’ll become an invaluable
    partner.


    # Value beyond pay


    What’s your number one challenge as an online content creator/influencer? If you
    know the answer to this question and can shape your influencer marketing strategy
    to be centered around solving their problems, you’ll win the creative community
    and consequently unlock an opportunity to turn influencer marketing into your
    most valuable distribution channel. To save you the trouble, we’ve interviewed
    hundreds of creators and influencers over the last few years and identified the
    following list (in order of relevance).'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# What''s your number one challenge as an online content creator/ influencer?


    +   1. Creating high-quality content

    +   2. Beating the Instagram Algorithm

    +   3. Engage my followers

    +   4. Reach a bigger audience

    +   5. Coming up with new ideas

    +   6. Finding the time

    +   7. Getting collaborations with brands

    +   8. Stand out and be original

    +   9. Create authentic and engaging collaborations

    +   10. Posting frequently (every day)


    Observe closely, and two clear themes emerge—content strategy (#1, #5, #8, #9)
    and audience engagement (#2, #3, #4, #10). In other words, if you can build a
    content strategy that''s centered around helping influencers create high-quality
    content, dream up new ideas, stand out and be authentic and engaging you''ll create
    something that''s far more valuable than just monetary compensation, and as a
    result, you''ll both see greater value in the partnership. Similarly, if you can
    create a brief or campaign idea that''s wildly engaging and, for instance, can
    drive additional reach through cross-promotion or distribution (audience engagement),
    you''re building a strategy centered around pain points that almost everyone can
    agree are top priorities.


    Did you notice that two of the challenges belonged to neither of the themes? 6.
    Finding the time and 7. Getting collaborations with brands. Let''s address both.


    By following the steps outlined in Chapter 6: 1:1 Relationships at Scale, you''ll
    master the art of efficiency and eliminating constraints—you''ll demonstrate proactively
    that you respect the time and energy of those you seek to work with. The second
    challenge is obviously fulfilled by collaborating with your brand, but there''s
    more. If you can showcase how collaborating with your brand may result in additional
    partnerships, you''ll immediately increase the value of your relationship.'

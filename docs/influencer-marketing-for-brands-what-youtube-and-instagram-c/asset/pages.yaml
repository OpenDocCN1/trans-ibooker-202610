  md: 'So, how do you set yourself up to balance between the two?


    Within our agency, we optimize for *campaign participation rate*. Creators will
    accept or reject a collaboration on other factors than compensation, but this
    has, over the last few years, turned into a great proxy for us. The formula is
    simple:


    # Calculating your participation rate


    [Number of creators that accept your offer]/[number of creators you reach out
    to]


    Somewhere around 15%–25% is a good benchmark. Go lower than 15%, and you’ll have
    a constraint. Go beyond 25%, and you’re probably paying more than you have to.
    Remember this table from Chapter 5: Creator-Centric Strategies (from the section
    “What creators want: Determining factors for brand partnerships”).


    Table 6-2. Deciding factors, brand collaboration


    | Factor | Respondents |

    |---|---|

    | How much they pay | 14% |

    | That I know their product/service works | 27% |

    | That I have heard of their brand before | 3% |

    | That their core values are aligned with mine | 34% |

    | That they give me creative freedom | 23% |


    It’s evident that there are other deciding factors that will determine your participation
    rate—some more important than *how much you pay*. With this in mind, make sure
    that you’ve addressed the other factors outlined in this table if you see low
    participation rates even though you’re paying fair rates. The opposite is also
    true: If your core values are aligned, there’s creative freedom, you have demonstrated
    that you have an amazing product, and you could likely lower your compensation
    and maintain a decent participation rate.


    # Step 5: Let’s fire up the engines


    *Time required: A couple of hours*


    *Effort: Mid*


    *Impact: High*


    It’s all been leading up to this moment. We’ve set up a dedicated email address
    to create a single point of contact, implemented a system to allow for efficient
    dialog with multiple individuals in parallel, and addressed common questions'

- pgno: 136
  md: 'Chances are slim that you’ll rush to purchase a product you’ve never heard
    of, that you’ve never even considered…and your customers are no different. When
    you have an action-oriented marketing objective, you’re speaking to consumers
    that are ready to buy what you’re selling.


    The second consideration is your call to action and incentive. I’m of the opinion,
    and experience, that if you want consumers to drop everything they’re doing to
    follow your lead, you better give them a damn good reason. Most would agree, but
    the reasoning is also loaded with conflict—generally derived from the premise
    that a generous discount or too strong of a call to action can devalue their brand.


    > “We’re not the type of brand that offer… discounts.”


    Sure, many of the world’s most luxurious brands, like Louis Vuitton, Chanel, Hermès,
    Gucci, Rolex, and Cartier, wouldn’t ever hand out 30% discount code or promotional
    bundles to new or even existing prospective customers—but neither do they build
    campaigns with action-oriented objectives. Look no further than at the very same
    list of popular brands, however, and you’ll find companies like Apple, The New
    York Times, Disney, Spotify, Victoria’s Secret, Kate Spade, and Revolve, just
    to mention a few that, on the other hand, run special offers, promotions, and
    discount codes to drive their customers to buy their products.


    We don’t think less of them for their generous discount codes, $0.99 trials, hardware
    bundles, or Buy 2, Get 1 Free in-store promotions. We like them even more.


    Ever heard of the 40-40-20 rule? Originally developed by direct marketing expert
    Ed Mayers in the 1960s, he found that a direct mail campaign’s success is 40%
    attributed to targeting the right audience, 40% having an attractive offer, and
    20% on the creative. In other words, an unattractive offer is just as bad as targeting
    the wrong audience. So what’s the bottom line? If the primary goal of your marketing
    campaign is to drive consumers to take action, be aware that you’re speaking to
    a small group of prospective customers and that they’ll need a really good reason
    to reach for their wallet.


    # Content campaign


    Each of the former campaign objectives are dependent on having influencers create
    content for their audience—but the actual content production can also be considered
    your primary objective, independently of awareness, consideration, or conversion
    targets. Here, the core benefit is to counter traditional production of branded
    content (either in-house or through a traditional creative agency), which can
    be both expensive and time consuming. This is the core objective that you’ll address
    when you work with creators to produce'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Chapter 7 | The Four-Step Influencer Marketing Framework


    content for you brand. The goal? A steady flow of branded content for your social
    media channels—across paid or owned digital channels.


    With this kind of campaign, you’re turning influencer marketing into a method
    for content production, rather than media distribution, which this opens up a
    unique opportunity. Suddenly, you can optimize for aesthetics, taste and creativity—rather
    than audience, engagement, or reach.


    # The disconnect between marketing objectives and KPIs


    It is one thing to set objectives and another to measure the outcome and understand
    the results. In early 2019, my company interviewed 351 marketing teams⁹ to get
    a better sense of what their primary influencer marketing objectives were and
    how they measured their campaign results. The purpose of the research was twofold:
    First, to gain better knowledge on why they run influencer marketing campaigns,
    and secondly how they define their success.


    Fifty percent of respondents said that their primary objective for their influencer
    marketing was awareness or consideration, followed by sales (34%). Content production
    came in at first place, with 13% of respondents (Figure 7-1).


    ![](img/7ec2733715193510646aec32cc18284f_137_0.png)


    **Figure 7-1.** What is your main objective when running an influencer campaign?


    > ⁹ N=351, “The 2019 State of Influencer Marketing by Relatable”'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'To little surprise, the insights concludes that marketers believe that influencer
    marketing can be used for awareness, consideration, conversion, and content production—in
    that order.


    Following up to this question, the same respondents were asked how they’d primarily
    measure the success of their campaign—to get a sense of what their main key performance
    indicators are and how they relate to their marketing objectives.


    Forty-seven percent of respondents said that conversion or sales were their primary
    way to measure success. This was followed by engagement or clicks (26%), views/reach/impressions
    (16%), and quality of content (9.5%). But this struck me as odd. See Figure 7-2.


    ![](img/7ec2733715193510646aec32cc18284f_138_0.png)


    Figure 7-2. How would you primarily measure success of an influencer marketing
    campaign?


    A full 47% would evaluate the success of their influencer marketing based on conversion
    or sales, while sales itself is only a primary marketing objective for 34% of
    respondents. This is indicative of a disconnect between objectives and results,
    and it would seem like the marketing teams we spoke to would aim for one goal
    and then measure another.


    To dig deeper, responses were segmented in two different groups, based on their
    main objective: awareness/consideration in one group and sales in the other. See
    Table 7-4.'

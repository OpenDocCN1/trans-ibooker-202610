  md: 'You can use the same structure to populate the table with hundreds, or even
    thousands, of lines—each representative of a creator. Most spreadsheet software
    even have functions and features that will allow you to remove duplicates, validate
    email addresses, round a number (such as compensation) to the nearest integer,
    and sort or filter by certain values.


    # Step 2. Import to your email service provider


    Once completed, it’s time to export your table (in Google Sheets, you simply head
    over to main menu, select *file*, *download*, and *comma-separated values (.csv,
    current sheet)*). Then, head over to your email marketing service provider, and
    import the file. Each service provider will have a simple tutorial or instructions
    on how to do this. Directionally though, there should be an import contacts/audience
    or list feature. MailChimp call them *audiences*.


    When you import your table of contacts, you’ll have to map each column to a variable
    within the email marketing platform. MailChimp call these variables Audience fields
    and *|MERGE|* tags. *Audience fields* or *Merge tags* are variables associated
    and values with each contact (each *an influencer or creator*). When you import
    your table, make sure that you assign each column (e.g., followers) to a corresponding
    Audience field with the same, or similar, name. We’ll be using these fields to
    personalize our email communication in the next step.


    # Step 3. Create and send your email


    Remember the columns from our spreadsheet and the audience fields? These will
    now be put to good and effective use. The final step is to write your outreach
    email. Previous sections have covered both the questions you need to address in
    your first email and how to structure an effective brief. As such, this section
    will only include a short example to demonstrate the use of these variables.


    ```

    From: Your First And Last Name

    To: @*|INSTAGRAM|*

    Subject: Instagram collaboration with @*|INSTAGRAM|*


    Hi *|NAME|*,


    We’re such and such and are reaching out because of so and so. Would you be interested
    in a collaboration on @*|INSTAGRAM|* and @ourbrand? You’d be asked to do this
    and that, and your compensation is *|PAY|*.

    ```'

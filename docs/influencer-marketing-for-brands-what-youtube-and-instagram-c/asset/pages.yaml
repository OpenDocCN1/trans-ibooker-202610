- pgno: 153
  md: 'YouTube. Unlike traditional advertising, the longevity of each video is a new
    dimension—and unfair advantage—that now allows for you to leverage time to improve
    the return on your marketing investments, battle rising costs to advertise both
    traditionally and with influencer marketing, or all of the above.


    # Amplify your influencer marketing with branded content ads


    In any given 24-hour period, there’s far more content being produced than we could
    possibly consume in the same amount of time. The supply (of content production)
    far outweighs the demand (of attention or hours in the day).


    In many ways, this is great for consumers, since they get more variety, and the
    production threshold is higher. It should also, theoretically, not have any economic
    impact on the producers, whose lower per unit cost should be offset by higher
    volume. In theory, that is—but in practice, we only have 24 hours in a day, and
    as such, our demand for content is strictly limited to what we can afford. But
    consumers are not paying for content with their money, but rather their attention,
    and suddenly, there’s an attention economy.


    See, if you happened to grow up in the 70s, 80s or 90s, there’s a great chance
    that you remember the very first commercials that you saw on TV. That’s not because
    they were that good, but rather because demand (attention) was in excess to supply
    (content), and we paid generously with our attention. So what happened between
    then and now? Personal computers, the Internet, and smartphones, of course. According
    to classic economic theory, an event like that is called a positive supply shock.
    Technology made production more efficient, thus increasing its output.


    The same simple economics theory works on local level, as well. When there’s more
    content than we can consume on social media, companies like Facebook are forced
    to build algorithms and filters to help sort through the information competing
    for our attention. Else, social media would lose its relevance, and we’d turn
    elsewhere.


    Instagram is a prime example. With tens of millions of users producing and consuming
    content, it made sense to show everything, to everyone. With hundreds of millions
    of users, however, each with a larger number of followers and followings, there
    was suddenly an excess of content supply, which lead Instagram to redefine how
    content was consumed on their platform.⁶ All the posts would still be there, just
    in a different order, the announcement read. But double the user base to a billion
    people, build even better technology for even more efficient production (new storytelling
    formats, live streaming, face'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'filters, better smartphone cameras, and faster Internet speeds), and there’s
    another *positive supply shock*. But our demand (attention) isn’t growing—which
    means that you have to grab the attention from somebody else to expand your own
    audience.


    *This explains why there’s been a decline in organic distribution on platforms
    like Instagram and Facebook. My bet, based on these basic laws of supply and demand,
    is that both creators and brands will continue to see a decline in organic reach
    and distribution in the next few years. Depending on what your marketing goals
    are, this may or may not pose a challenge that you’ll eventually need to address.
    It has also given birth to a new opportunity for creators and brands.*


    In 2019, Instagram doubled down on their branded content tools to help businesses
    expand the reach of their influencer marketing campaigns beyond their original
    organic reach. By scaling the original feed posts or stories beyond the audience
    of the creator (targeting specific audiences and measuring the performance using
    the tools in their ads platform), the approach lets brands, creators, or their
    influencer marketing partners use campaign content beyond the scope of the original
    campaign. While similar tactics (with complicated workarounds) have certainly
    been possible before, the set of platforms and official support from Instagram
    makes the actual process very smooth. My bet is that by the time you’re reading
    this, there will be even more tools available at your disposal.


    I strongly encourage that you make yourself familiar with the official documentation
    from Instagram,⁷ as the step-by-step instructions outlined here might differ by
    the time you’re reading this. Either way, I’ll give you a brief overview of the
    workflow and experience.


    First, this strategy requires full collaboration with the creators and influencers
    you engage for your campaign—and should be a part of your brief. The setup is
    simple, but nevertheless to be followed step by step to work. Remember though—amplifying
    their branded feed posts and stories with additional media budget and getting
    in front of a bigger audience is a good thing where you both win!


    Second, when publishing a feed post or story, the creator should use the official
    branded content tool and tag you as their business partner. For this to work,
    your brand will need to approve the creator from your account. On publishing their
    story or post, the creator will also have to select “Allow Business Partner to
    Promote” for you to promote their post.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Next, once the creator has tagged your business in a branded content post and
    given permission to promote it, you just follow these simple steps:


    +   1. Go to Ads Manager and create an ad.

    +   2. Pick one of the available objectives for your branded content.

    +   3. At the Placements step, select either Instagram Feed or Stories.

    +   4. At the Ad level, your branded content will appear in the "Use Existing
    Post" section. In the Select Post window, navigate to the Branded Content tab.
    You''ll see the list of the branded content posts that a creator has given you
    permission to promote


    Suddenly, you have expanded your influencer marketing efforts to include retargeting,
    specific audience attributes, advanced frequency settings. You could, should you
    wish, build an entire paid social strategy that is centered around influencer
    marketing. Not only that, but you''re supporting creators by getting them in front
    of a bigger audience, with greater engagement, all while beating the algorithm
    on Instagram. Remember the most frequently cited challenges among creators and
    influencers? By amplifying their content, you''re addressing numbers #2, #3, and
    #4 on that list—all at the same time.


    # Frauds, fakes, and rise of the bots


    If you''re concerned about influencer marketing fraud, you''d not be alone. In
    fact, 75% of marketing teams and agencies are concerned about fake followers and
    bots, while only 20% claim to have experienced fraud in their own campaigns. Perhaps
    inevitable when a media channel gain real foothold with the mainstream—nevertheless
    a challenge that influencer marketing platforms, agencies, and in-house team will
    have to deal with to assure that they aren''t wasting their money.


    In mid-2018, Unilever took stance against influencer fraud, and its Chief Marketing
    Officer, Keith Weed, declared war on influencers that buy followers and likes
    on the platform. The declaration made headlines in the press, rightfully so, but
    advertising fraud has been around as long as the Internet and is estimated to
    cost advertisers more than $23 billion annually.⁸ The social media platforms themselves
    are cracking down on both bots and fake followers, but what can you do when you
    build your campaigns to avoid fraud in your campaigns?'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Foremost, it should be noted that an audience of inactive, or bot accounts,
    may be completely unintentional. If you have a public profile on a platform like
    Instagram, anyone can hit the follow button. Disregard the connotation that someone
    has fake, or real, followers, and seek to address your concerns by taking the
    following actions.


    # 1. The right audience


    The audience-first approach to influencer marketing (“Finding the right creators,”
    Chapter 3: Influence Is an Outcome, Not a Profession) is your first action toward
    assuring that their audience isn’t just real, but the right audience. If 80% of
    their followers are in a country other than where you’re marketing, it’s beside
    the point if they are real or not—isn’t it?


    # 2. Authentic engagement


    Even though the audience is real, there’s a chance that the actual engagement
    (comments and likes) is artificial. But how would you know? Look at the rate likes
    and comments are distributed over time. Consider the following graph in Figure
    8-1, with two real scenarios.


    ![](img/7ec2733715193510646aec32cc18284f_156_0.png)


    Figure 8-1. Organic engagement vs. fraud'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Each line represents the engagement rate on a Instagram Feed Post, from two
    different creators. After 24 hours, one of the posts has 10% engagement and the
    other 4%. The usernames have been removed to protect their privacy, but the analysis
    reveals that one of these has likely inflated their engagement rate artificially.
    See how the level of engagement flat lines for one of the posts at around 1% only
    to suddenly jump to 4% in an instant and then remains constant? There’s nothing
    organic about that and indicative of engagement fraud.


    # 3. Beyond vanity metrics


    Instagram and YouTube both offer creators and brands account analytics and insights,
    and it’s common practice for brands to either request screenshots or permission
    to access these insights. If follower audience or engagement rates don’t suffice,
    access to metrics such as feed post reach or story impressions can function as
    a precautionary measure to battle fraud.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Glossary


    **Above the line (ATL)** Above the line marketing includes mass marketing strategies
    which are largely untargeted and are focused on building the brand.


    **Accounts Reached** Unique accounts who viewed the content.


    **Activation** A marketing initiative to drive users to action through interactions
    and experiences.


    **Actual Impressions Rate** Impressions divided by total followers.


    **Affiliate Marketing** A marketing agreement between brand and influencer, where
    the brand pays compensation to the influencer for generating traffic or leads
    (through affiliate links) to a company''s website.


    **Agency** An agency can be either a marketing agency that runs campaigns or a
    talent management agency that represents influencers.


    **Algorithm** An algorithm is a detailed series of instructions, a computer code
    for carrying out an operation. It is widely used to determine or manipulate what
    content users of social media see in their feed and at what frequency. These are
    often designed based on parameters such as users'' historical behavior and patterns
    of use.


    **Always On (Program)** The campaign is occurring over a longer period of time,
    not with a single campaign or seasonal-specific timeline.


    **Ambassador** An individual who represents a brand and can be the face of a campaign
    for a specified duration.


    **Amplify** To drive additional distribution through optimized content.'
  merge: -1
  img_proc: true

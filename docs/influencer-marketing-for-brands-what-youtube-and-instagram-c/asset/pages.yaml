- pgno: 160
  md: '**Consideration** The extent to which consumers consider your brand for a given
    purchase occasion.


    **Content Calendar** A tool to plan content.


    **Content Marketing** The strategy of consistently producing high-quality content
    to engage one''s audience.


    **Conversion** The proportion of people viewing an advertisement and ending up
    making a purchase through the URL associated with the content. Conversion is measured
    by influencers using tracking links or promo codes.


    **Cost-per-Acquisition (CPA)** The metric that measures the cost of acquiring
    a customer or new user. Calculated by dividing the total media investment by number
    of acquisitions. For example, $100,000 media budget/1,000 sales = $100 cost per
    acquisition.


    **Cost per Click (CPC)** The metric that measures the cost of one customer clicking
    an advertisement or link and landing on the company''s website. For example, $100,000
    media budget/100,000 clicks = $1.00 cost per click.


    **Cost per Engagement (CPE)** The cost that is associated with each engagement
    or interaction, such as a like or comment. The cost per engagement is calculated
    by dividing the cost of the specific content by the total engagements it generates.
    For example, $100,000 media budget/200,000 engagements = $0.50 cost per engagement.


    **Cost per Mille (CPM) or Cost per Thousand (CPT)** refers to the cost per 1,000
    units. The unit is typically followers, video views, impressions, or Gross Reach.


    **Creator** See Influencer.


    **Creator-Centric** The practice of building out your influencer marketing strategy
    with a deep understanding of the challenges faced by the talent you recruit for
    your campaign (which, in exchange, typically yield a greater value for all parties
    and maximize return on investment).


    **Creative Brief** A set of ideas that provides direction for content creation.
    Creative briefs guide influencers to ensure their content meets the brand''s standards
    and is able to generate optimum engagement.


    **Collaboration** In influencer marketing, collaboration takes place when an influencer
    and a brand work together.


    **Deliverables** The expected results to be produced by the influencers.


    **Disclosure** A visible indicator, such as a written text that is required to
    clearly state the purpose of the collaboration, the connection between the influencer
    and the brand. Common indications include words or hashtags such as ad, paid,
    in collaboration with, or sponsored.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Glossary


    **Distribution Channel** The platform that is used to share content on.


    **Earned Media** The additional organic distribution generated from the media
    spend allocated to your marketing campaign.


    **Earned Media Value** The value of the additional organic distribution generated
    from your campaign with the assumption of a linear media distribution cost. Not
    to be confused with ROI.


    **eCommerce** The commercial transactions that are conducted electronically. The
    buying and selling of good or services, primarily on the Internet.


    **Engagement** A term used in social media and influencer marketing to describe
    the practice of interacting with content.


    **Engagement Rate** A proxy and key metric to determine the quality of an influencers
    content based on the number of interactions the content generates. The formula
    is generally total engagement divided by total Gross Reach or Follower Count.


    **Exclusivity** A specific right or restriction a brand or an agency might enact
    during the collaboration with an influencer.


    **Flat Lay** A photograph, usually taken directly from above to showcase a group
    of items laid out on a flat surface in a stylish way.


    **Feed** The platform interface where users view the content that is published
    by the people and influencers that they follow.


    **Follower Range** The term to describe influencers based on how many followers
    they have. For example, influencers can be categorized in micro- and macro-influencers.
    Influencer costs are usually based on their follow range.


    **Full Commercial Content Usage** The negotiated and secured terms to the right
    to use influencer generated content. This means that you have the right to use
    the content across your channels, but you do not own the content.


    **Guest Post** When a website invites another writer to publish content on their
    website.


    **Hashtag (#)** A word or phrase preceded by a hash sign (#), used on social media
    and websites to identify content on a specific topic. They are searchable keywords,
    for example, #relatable.


    **Haul** See *Unboxing*.


    **IGTV** A standalone vertical video application launched by Instagram. Unlike
    Instagram, it allows users to upload videos of up to an hour and each user page
    are named “channels.”


    **Impressions** The number of times a specific content is exposed to an audience.'

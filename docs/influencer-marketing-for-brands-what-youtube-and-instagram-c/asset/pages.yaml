- pgno: 145
  md: '# Targets


    The different campaign types each hold a set of variables that dictate your campaign
    targets: each a unit cost. If your objective is content production, the unit cost
    would be cost per asset. The cost for each asset dictates how many assets you
    can produce for your overall budget, and so on. If the campaign objective was
    awareness, and the KPI was reach, the unit cost would be CPM—the cost per 1,000
    people.


    Your goal is to identify a target unit cost that would be valuable for your company—balanced
    with current market rates, benchmarks, and industry averages. Here’s an example
    in Table 7-8:


    Table 7-8. Campaign goals and examples


    | Campaign Type | Attention Campaign | Interest Campaign | Action Campaign | Content
    Campaign |

    |---|---|---|---|---|

    | Objective | Awareness | Consideration | Conversion | Production |

    | KPIs | Reach | Total engagement | Sales | Quality |

    | Primary platform | Instagram | YouTube, Instagram | YouTube, Instagram | Instagram
    |

    | Budget | $80,000 | $80,000 | $80,000 | $80,000 |

    | Unit cost | $35 CPM | $0.75 cost per engagement | $100 cost per order | $800
    cost per asset |

    | Target | 2.3 million reach | 100,000+ interactions | 800 new clients | 100 social
    media-ready assets |

    | Business impact | +10% Brand lift | +25% consideration | $100,000 in sales |
    -30% production cost |


    As you can see, I’ve used the budget and unit cost to identify a target and refined
    the goals further with a line item that addresses the actual business impact.
    Does this guarantee and assure that the goals can be met? It depends on how realistic
    you’ve been, just like any other media investment. Finally, you can now outline
    exactly how many influencers you’ll use in your campaign, based on these targets,
    in combination with the values and parameters that you addressed in Step 3. Here’s
    an example in Table 7-9:'

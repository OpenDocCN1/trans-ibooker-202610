- pgno: 149
  md: '# Chapter 8 | Measuring What Matters


    **Key Questions** How do you measure the organic, untracked, impact of your influencer
    marketing? Why does influencer marketing on YouTube become cheaper, and not more
    expensive, over time? How do you deal with fraud, fakes and bots on Instagram?
    When, why and how do you amplify your organic content with paid advertising?


    **Core Principles** 1. The untracked majority. 2. The longevity of distribution
    on YouTube. 3. A three-step process for tackling fraud. 4. Amplify organic reach
    with paid media.


    A couple of years ago, I worked with a client in the fitness and nutrition industry.
    Influencer marketing worked really well for them on YouTube. Their main goal was
    to create traffic to the App Store and installs for their app. We had sophisticated
    end-to-end tracking in place to know exactly what happened to someone that watched
    a video, clicked a link, and installed their app.


    But they (and consequently my team and I) had a problem. We *didn’t know what
    the organic uptake from these efforts was*. Like, how many people would watch
    a video and install the app without clicking any tracking links? A common problem,
    of course. Across other media channels as well. You’d watch a commercial on TV
    and buy the product in the store the next week. And as such, attribution modeling
    (and the cause/effect of advertising) is something that marketers have struggled
    with since the dawn of time. But if you’re investing in a media channel, you’d
    want to know. Makes a big difference if you get one more customer or five, doesn’t
    it?


    That number *will* make, or break, your entire return on investment. To help our
    client with their challenge, we built a model that looked at normalized average
    traffic, uptake, correlation to video views, etc., and finally established a number
    and attribution model we felt comfortable with.


    For every install we could directly attribute, we’d get between three and four
    additional installs organically. That’s a multiplier of +300% to +400% in organic
    uptake. These numbers seemed like they were almost too good to be true. Naturally,
    I had my doubts. We looked at different markets, dates, cohorts, and videos, but
    couldn’t get to any other conclusion. And as the great fictional detective Sherlock
    Holmes once said,


    > *When you have eliminated the impossible, whatever remains, however improbable,
    must be the truth.*²


    The more we thought about it, the more sense it made. Turns out that the answer
    was right under my nose—and rather obvious. Consumers are less likely to stop
    in their tracks, interrupt whatever they’re watching, and follow a call to action
    in a video.


    ² Arthur Conan Doyle, *The Sign of Four* (1890)'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'You’re on your phone, watching a video from a creator on YouTube that you like.
    They recommend a smartphone app, and you’ll check it out later rather than abandon
    what you’re watching. Or you’re watching the video on your computer, see the app,
    and pull up your phone to get the app because, well, it’s for your phone. In either
    scenario, the direct attribution would be lost.


    But still, when your agency (me in this example) is telling you (the client) that
    things are four times better than the numbers you see in your dashboard, you better
    make sure that they’re in the right ballpark. Don’t get me wrong—I had full confidence
    in my team and our ability to build these models, but the datasets are limited,
    and there will always be a margin of error. Not everything that counts can be
    counted, and neither Facebook, YouTube, or Instagram allows for any third-party
    tracking on their platforms. In order to have a truly bulletproof attribution
    model, you’d have to analyze exactly who watched the video and who went to the
    App Store.


    But neither me or my company has access to that data, because I’m not Apple, Google,
    or Facebook. Thinking about it. Not even Facebook or Apple would have that data
    because they’re not allowed to track user behavior on YouTube. But Google runs
    both YouTube and the Play Store. They know what we watch and what apps we install.
    And it just so happens that they’ve published a whitepaper³ on how they built
    their own attribution model for influencer marketing on YouTube to combat our
    limited tracking capabilities and help marketers transition from assumptions to
    actual data.


    With permission from a select group of app publishers and game developers, the
    Google Play team analyzed a total of 250 videos with an aggregated total of 60
    million views. The study was conducted by looking at anonymized cohorts of signed-in
    Android users and their journey across YouTube and Google Play, across various
    segments and game categories—to address the following questions:


    Did the users who watched an influencer video actually download the game on Google
    Play afterward? And is the number possibly higher than the developers used to
    measure via a tracking link? Or in other words: is there an incremental upside
    nobody could prove so far?


    After investigating the post-watch user journey and comparing the results with
    the tracking efforts of each developer, the research team found that for every
    person who is clicking a tracking link of an influencer video on YouTube,'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'there are four more people who are not clicking but still downloading the game
    within four days after watching. Google call this group of users the “non-tracked
    majority,” and the 4x multiplier interestingly coincides with what we found in
    a completely different vertical, using a very different (yet accurate) methodology.


    Be aware that your share of “non-tracked majority” will differ. 4x sounds good,
    but it’s not a one-size-fits-all (I’ve seen it differ from 1.2x to 12x), and it’s
    important that you understand your own attribution metrics. Regardless of what
    your multiplier is, you’ve now seen the huge upside that “the non-tracked majority”
    will have on your business, specifically, if you’re driving installs to an app
    or sales in e-commerce.


    # DOWNLOAD FATIGUE


    The same study revealed another interesting and relevant insight that is directly
    applicable for brands that are turning to YouTube to drive sales, app installs,
    or website visitors. After promoting one influencer video about a mobile game,
    the second video from the same creator drove up to 3x less downloads than the
    first one, if being published within 12 months.


    This doesn’t rule out long-term collaborations or producing multiple videos with
    the same creators—but it does help predict the outcome of those efforts. Keep
    in mind that a second video from a creator with exceptional results, even if the
    results are 3x “worse,” could still be better than average. You’ll have to be
    the judge.


    Alternatively, a second video could prove to be an effective strategy for other
    marketing objectives, such as re-engaging an inactive, or lapsed, group of users.


    # The longevity of distribution on YouTube


    While collaborations with creators on YouTube require longer lead times, more
    work, and bigger up-front investment, the platform offers something that no other
    paid media channel in the world can counter: unlimited shelf life. When a creator
    publishes a video featuring your brand on their channel, the cost of that video
    is generally based on an estimated number of views that the video will accumulate
    in its first 30 days (see “Industry rates,” Chapter 5: Creator-Centric Strategies).


    But unlike other means of advertising (and even Instagram where most content gains
    very little exposure after about a week), the video on YouTube will continue to
    accumulate views long after its first been published. Day 30 doesn’t mark the
    end of your campaign, but rather the beginning. Consider the following assumptions:'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Month 1


    Video cost: $10,000


    Estimated views, 30 days: 100,000


    Estimated cost per view, 30 days: $0.10


    You launch the campaign and reach the target estimated views after 30 days, like
    predicted. But then, something powerful happens—the video continues to accumulate
    views across search, discovery, and recommendations on YouTube, and the day that
    video hits 200,000 views, your effective cost per view will be cut in half. That
    might happen after 60 days, 80 days, or 180 days, but rest assured that the longevity
    will work for, and not against, you. The closest analogy in the marketing industry
    would be search engine optimization—where you invest upfront in producing content
    that yields organic site visits over time, only the difference is that you, unlike
    with search engine optimization, will see an initial boost as well. Generally,
    although I should note that the outcome will depend on several factors, you can

- pgno: 97
  md: '**Creator-centric strategy:** Museum of Ice Cream is built for Instagram. Unlike
    a traditional museum, each part of the exhibition is set up in a way that invites
    its visitors to craft creative, high-quality content. With their tickets in more
    demand than supply, Museum of Ice Cream has created a setting that enables its
    visitors (and influencers) to create unique content and stories.


    # What creators want: Determining factors for brand partnerships


    Several pieces of the creator-centric puzzle are beginning to fall into place.
    In this section, we’ll be digging into another important aspect of the creator-centric
    approach to influencer marketing, namely, what creators expect and are looking
    for…from your brand! *Getting collaborations with brands* came in at number seven
    on the list of common challenges among influencers—but it turns out that it’s
    not just any collaboration, from any brand. In an interview series⁵ from 2017,
    we interviewed 81 influential social media creators to understand how many brands
    that they are approached by each month. The outcome? Between 10 and 100 proposals
    per month or 20 on average. Clearly, there’s no shortage of opportunities. Yet
    most of these brand inquiries go unanswered. But why?


    # Values and personal brand alignment


    Brand safety, and assuring that *your* branded content is displayed in a risk-averse
    contextually appropriate environment, is a commonly cited concern among marketers
    that practice influencer marketing. As such, brands rightfully invest both time
    and resources to assure that they team up with the right individuals.


    But be aware that the door swings both ways, and *personal brand alignment* is
    actually the number one deciding factor when influencers decide to partner, or
    not partner, with your brand⁶. See Figure 5-1.'

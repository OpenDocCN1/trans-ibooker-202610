- pgno: 6
  md: '# Introduction


    Is influencer marketing dead? Effective? Worth it? Ethical? Sustainable? Content
    marketing? Paid media? PR? An overhyped fad? Better than digital ads?


    The autocomplete feature from the most popular search engine in the world, with
    its corporate mission “to organize the world’s information…,” offers a fascinating
    glimpse into what questions the world is asking about any topic, at any given
    time. These search suggestions, or predictions (in the beginning of this paragraph),
    made me think about the intricacies of the influencer marketing industry.


    So many questions and so many different answers. There’s no question, however,
    that we live in a world where everything is getting more complex, where it’s impossible
    to keep up with all the information that is available at your fingertips—and knowledge
    alone just doesn’t cut it anymore. What we really need is synthesized wisdom,
    not additional information overload.


    If you work with marketing (either for a brand or an agency), you’re probably
    reading this book because you believe that influencer marketing can play an important,
    perhaps even critical, role in your business. There’s a great chance that you’re
    a marketing professional, founder, or social media creator that has seen the rise
    of influencer marketing and how this new digital media landscape has transformed
    entire industries.


    Savvy marketing teams at direct-to-consumer brands like Revolve, Gymshark, and
    Vanity Planet have played this transition to their advantage and spun up hundreds
    of millions of dollars in revenue by riding the influencer marketing wave. Art
    exhibitions (or museums, if you can call them that) like Color Factory, Museum
    of Ice Cream, and Egg House sell hundreds of thousands of tickets in days, and
    there’s a 6-month waitlist to have your picture taken with a backdrop of giant
    cherries and marshmallow clouds. Even traditional brands like Adobe, Volvo, and
    Samsung are rapidly catching on to reconsider the distribution of their media
    mix to win their next generation of consumers.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Introduction


    While these companies, and many others, have certainly transformed entire industries
    and changed the way we think about marketing, their impeccable timing should not
    be mistaken for luck. They''ve had to overcome the same obstacles and challenges
    as everybody else, asking the very same questions that lead you to where you are
    at this very moment.


    With this in mind, my goal over the next eight chapters is to deconstruct what
    makes influencer marketing really work, take you behind the scenes, and show you
    the precise methodology, structure, and strategies that have proven to be effective
    across thousands of collaborations between creators and brands—from start-ups
    with a handful of employees to the largest brands in the world.


    # 10,000 hours of practice


    Personally, I''ve always valued advice from those that practice what they preach.
    In that regard, it''s noteworthy that everything you read and all the tactics
    to go along are based on firsthand experience. My company, Relatable, has done
    over 10,000 influencer marketing collaborations (reaching well over half a billion
    people), across 40 different countries, in every vertical³ that you can imagine.


    Some of these insights are things that other agencies and industry experts probably
    would want to keep away from you. Proprietary tools of the trade, so to speak.
    It''s not standard operating procedure to document everything you know only to
    give it away. Especially not if you believe that part of your own business offering
    is built on having access to that knowledge. I''ve even been accused of giving
    too much away, insinuating that it could lead to less business, instead of more.
    Obviously, I believe the very opposite to be true. Adding to this, there are lots
    of talks these days about the importance of transparency. Unfortunately, it''s
    not practiced as frequently as it''s preached. Instead, it''s more common for
    brands to suffer from overpromise and industry jargon from partners that aren''t
    educating them enough.


    In times like these, the right thing to do is to share what you know that can
    hopefully be of value to others, with the intent of helping as many people as
    possible. And that''s why you''ll get nothing but full, radical transparency from
    here moving forward. These days, you win by sharing what you know with the world—not
    by keeping secrets. It''ll accelerate the growth of our industry and help both
    creators and brands.


    ³If you''ve ever thought that influencer marketing was limited to fashion or beauty
    brands, you''ll soon discover how deep the rabbit hole truly goes.'

    # Step 3: Creativity, creators, and content


    # Creativity


    Things are starting to fall into place and it’s time to outline the creative idea
    for your campaign, program, or activation. This will be the foundation of your
    messaging, your positioning, and what will be asked of creators and influencers
    in your brief.


    As discussed in Chapter 4: The Art and Science of Creativity, the act of turning
    new and imaginative ideas into reality really is a form of art. As such, there’s
    no bullet proof formula at hand. Instead, the suggestion is to seek inspiration
    from others that have deployed successful creative ideas within similar campaign
    strategies. This is also where creative agencies (or in-house creative teams)
    can be worth their weight in gold.'

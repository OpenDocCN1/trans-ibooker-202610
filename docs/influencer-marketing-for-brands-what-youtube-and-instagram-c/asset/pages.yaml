- pgno: 100
  md: '# Chapter 5 | Creator-Centric Strategies


    Ever heard the expression “if you pay peanuts, you get monkeys”? The idiom suggests
    that if you pay very low wages, you’ll only attract incompetent or unskilled workers
    (because better workers can go elsewhere to earn better wages). The same is true
    when you build your influencer marketing strategies.


    As seen in the research from AspireIQ, financial compensation ranked 10x higher
    than the value of free products (22% vs. 2%). As such, the perceived value of
    your products is generally very low. Internal research within our company, based
    on over 10,000 collaborations across Instagram and YouTube, including interviews
    and surveys to thousands of influencers, further suggests that only 8% responds
    positively to collaborations where the sole compensation is free products. The
    practical implications of compensating influencers with nothing but your product
    is that you’ll work 10x more to accomplish the same results.


    Clearly, little to no value is assigned to product giveaways, but how do creators
    decide on the right level of financial compensation and their value? Gathering
    data from 839 influencers across YouTube and Instagram, between 2018 and 2019,
    suggests that the most common determining factor is “the size of my audience and
    what the brand is asking me to do.”¹¹ So how much are creators looking to get
    paid, then?


    # Industry rates


    In recent years, the influencer marketing landscape has evolved dramatically,
    and there’s nothing indicating that the growth trajectory of the industry will
    slow down either. These rapid developments had led to ever-changing formats, best
    practices, and industry rates.


    It’s the very nature of the media publishing industry—which has always been dictated
    by a virtuous cycle of supply and demand. Initially, there’s advertising inventory
    in abundance. Because of the excess in supply, and lack of demand, it’s inexpensive
    to advertise. Almost free. As a result, advertisers flock like geese to leverage
    the new-found opportunity, and the shortage of supply eventually creates an opportunity
    for publishers or whomever owns the advertising inventory to charge more. The
    cost to advertise in digital media differs by quarter, industry, and market. On
    most platforms and networks, the change is instant, in real time, not to mention
    new creative formats, targeting capabilities, and advertising technologies.


    > ¹¹ Internal research, Relatable. 2018–2019. N=839 (Multi-choice question: “How
    do you know what to charge for a collaboration with a brand?”)'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'I’d love to offer a comprehensive influencer marketing rate card that would
    pass the test of time—but whatever I’d put in writing would likely be outdated
    by the time you’re reading this. What we can do, however, is to clarify what “the
    size of my audience and what the brand is asking me to do” really entails.


    Setting aside what you believe to be the right way to media plan and measure the
    impact of your marketing efforts, when a social media creator reference the size
    of their audience in the context of a brand deal, it’s either their followers
    on Instagram (as opposed to the actual reach their content will get) or estimated
    views on YouTube (as opposed to subscriber count or actual views).


    In advertising and influencer marketing alike, CPM (“cost per mille”¹²) is commonly
    used to measure and estimate what the brand will pay for 1000 units in their advertising,
    typically reach, views, or impressions. On Instagram, this unit is followers.


    Within the creator community on YouTube, CPV (“cost per view”) is frequently applied
    to estimate the cost, or value, of a partnership. Here, on the other hand, the
    number is neither based on channel subscribers (the equivalent of a follower on
    Instagram) or delivered views (actual impressions or reach), but an estimation
    of future viewership. That estimate is typically based on the average or median
    views of the five to ten most recent videos during the first 30 days after publishing
    date.


    Naturally, there will be other key variables across both platforms that will impact
    the cost per thousand followers or cost per view. On Instagram, this will include
    content format, workload, content rights, number of posts or stories, and seasonality.
    For YouTube, the decision to produce dedicated or integrated videos (see “Nine
    proven creative executions on YouTube” in Chapter 4: The Art and Science of Creativity)
    will impact your cost per view more than anything—where fully dedicated videos
    will cost anywhere from 1.5× to 3× more than an integrated mention of your product
    or brand.


    # NOT TOO LITTLE, NOT TOO MUCH


    While compensating too little or not at all has practical implications, so does
    paying too much. When you do, you’re introduced to another challenge: outcome.
    You do after all have a limited marketing budget (and a boss with unrealistic
    expectations for what can be accomplished with those media dollars).


    How do you balance the two? Apply the participation rate concept outlined in Chapter
    6: 1:1 Relationships at Scale and remember that it’s perfectly within reason that
    15%–25% of influencers accept your terms.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Set clear payment terms



- pgno: 9
  md: 'Then, in Chapter 3: Influence Is an Outcome, Not a Profession, we’ll dissect
    the real and often misunderstood implication of influence. We’ll break down the
    three key levers of influence; you’ll learn how to find the right influencers
    and creators for your brand and why it’s absolutely critical to own your talent
    pool.


    It’s been said that creative without strategy is art, and creative with strategy
    is called advertising. Personally, I’d like to believe that great advertising
    is part art, part science, and in Chapter 4: The Art and Science of Creativity
    you’ll learn how to use a set of proven set of creative strategies for Instagram
    and YouTube to incorporate to build powerful campaigns. You’ll learn about the
    seven principles of word of mouth and the secret to writing a perfect brief. It’s
    a very practical chapter, with an equally practical, and powerful, toolbox. With
    many of the fundamentals in place, we dial things up a notch in Chapter 5: Creator-Centric
    Strategies. The concepts in the chapter are not necessarily more advanced, but
    they do offer an entirely new perspective to influencer marketing, namely, one
    entirely focused on what creators are looking for when collaborating with brands,
    rather than the other way around.


    At this point, we’ve come far, and the many components and tactics that are essential
    for building out a successful influencer marketing program are beginning to fall
    in place. Unfortunately, it’s also quite common for both brands and creators to
    suffer from the many constraints that arise when it’s time to ramp up their campaigns.
    Chapter 6: 1:1 Relationships at Scale reveals seven powerful tactics that will
    reduce 80% of your overhead and eliminate the constraints that are holding you
    back. In Chapter 7: The Four-Step Influencer Marketing Framework, you’ll get a
    step-by-step framework to transforming influencer marketing into a scalable media
    channel that is fully aligned with the rest of your marketing. The framework is
    a very powerful, especially if you’re looking to compare your influencer marketing
    programs with other traditional advertising channels.


    Finally, in Chapter 8: Measuring What Matters, you’ll learn how to fight fraud,
    amplify your influencer marketing efforts with paid media, and two powerful concepts
    that will change the way you think about investing in digital advertising forever:
    The Untracked Majority and Longevity on YouTube.


    # To a man with a hammer, everything looks like a nail


    Finally, before we move forward, there’s something I’d like to address. As a marketer,
    you have a toolbox. One of the tools at your disposal is influencer marketing,
    but it’s risky to pick out the tool (the channel) before you know what you’re
    building (your marketing objective). This is a common mistake among marketing
    professionals. They’ll decide that their goal is to run an'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'influencer marketing program before they identify what their actual marketing
    objective is.


    As much as I’ll advocate that you turn influencer marketing into your most valuable
    marketing channel, there are, unfortunately, no one-size-fits-all solutions. It’s
    easy to get carried away and reason by analogy or the proxy of others, but don’t
    make the mistake of picking out the tool before you know what you’re building.


    As such, a large part of this book is structured to help you understand why, how,
    and when the various ways you can apply influencer marketing to your media mix
    are applicable and relevant for you and when they are not.


    Perhaps you’ve read statements like “There’s an 11× ROI on influencer marketing,”
    “You’ll make $7.00 for every $1.00 you spend on influencers,” or “Influencer marketing
    delivers better results than any other media channel.”


    Those statements and promises are absolutely true. Someone, or even a large number
    of brands, absolutely got those results. But are they relevant or applicable to
    you? They certainly could be, but we shouldn’t immediately assume that they are
    until you’ve assessed the situation. In fact, no strategy with substantial upside
    is entirely risk-free. You’ll likely fail a few times before you win big, even
    if you’re best in class. That’s just a part of the game!


    # TO THE MANY FREELANCERS, CREATORS, AND INFLUENCERS READING THIS BOOK


    In October 2017, Upwork and Freelancers Union published the results of their “Freelancing
    in America”⁵ study (conducted by independent research firm Edelman Intelligence)
    and found that more than 50% of all millennial workers have engaged in the economy
    with some kind of freelance work in the last 6 months.


    If you are a designer, videographer, photographer, writer, artist, model, or the
    like, selling work or services by the hour, or project, rather than working for
    a single employer on a regular salary, you’re a freelancer. If you create content
    for brands, on YouTube or Instagram, you’re also participating in the rapidly
    growing global freelance economy. It’s predicted that freelancers are expected
    to be the majority of the US workforce by 2027, based on current growth rates
    trajectory. In the very near future, the job title freelancer will be more popular
    than any other job, combined. But not only that. The study from Upwork also observed
    that almost half of working millennials (47%) are already freelance, a participation
    rate higher than any other generation.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'The bottom line: Your seemingly strange gig as a multitasking freelancing social
    media creator will soon be more common than getting a “real job.” If you belong
    to this group, the contents of this book will help you get a better understanding
    of what happens behind the scenes when you collaborate with a brand—and what their
    main challenges and problems are.


    You’ll understand their point of view better than ever before and become more
    client oriented. Brands will love working with you, not only because you create
    the right type of content, with the right message, to the right audience but because
    you understand the entire process better than they’ve ever witnessed with anybody
    else.


    You’ll become an invaluable partner, all while staying ahead of 10 million other
    content creators that are competing for a slice of the billion-dollar influencer
    marketing pie.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Origins


    # The Father of Affordable Luxury and Origin of Influencer Marketing


    > Beautiful forms and compositions are not made by chance.

    > —John Ruskin


    The computer, jet engine, and World Wide Web were all British inventions.


    As I’m typing this on a plane, en route from the United Kingdom to the United
    States (also, at one point, a British colonial territory), I realize that we owe
    a thing or two to the Britons. The engine outside my window seat, the laptop I’m
    typing on, and the www:// that likely led you to discover this book can all be
    attributed to the British. Influencer marketing also has its origins in England.
    And it all started almost 300 years ago, in Staffordshire, England.


    # From changemaker to tastemaker


    Born 1730 in Staffordshire, England, Josiah Wedgwood was an English potter and
    entrepreneur, credited with the industrialization of pottery manufacturing. Wedgwood
    has been described as both a magnetic and engaging individual, but also as an
    obsessive perfectionist. A Steve Jobs of the 17th century. He would walk his manufacturing
    floor with a wooden stick and smash the'
  merge: -1
  img_proc: true

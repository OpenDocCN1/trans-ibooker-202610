- pgno: 63
  md: '# Creative strategy 5: Amplifying Brand Experiences


    Brand experiences are now engineered specifically to be Instagram worthy for all
    the attendees; however, sometimes the beautiful installations don’t tell the full
    brand story themselves. Properly briefed influencers can tell this missing story.


    Example uses:


    +   - Influencers can create excitement before, during, and after an event, all
    while delivering various brand messages through a mixture of Instagram stories
    that tell the raw story and feed posts that capture the hero shot of the event.

    +   - Influencers can be used to be the “street photographers” of a brand experience,
    creating content for a carousel that tells the many parts of the event while also
    generating high-quality content for brand social feeds.


    Key benefits:


    +   - Allows brands to extend the reach of their events to larger audiences

    +   - Briefed influencers tell exactly the story you want to tell rather than
    just “hoping” people understand the point of the event or even know what it is
    celebrating.

    +   - Influencers create content that looks like content people like and share
    (it’s why they are influencers). This is naturally a perfect fit for brand social
    channels.


    # Creative strategy 6: Burst Campaigns


    An influencer gets reach, a crew gets noticed. Burst Campaigns are all about making
    an impact with a crew of influencers than can effectively blanket the Instagram
    feeds of their targeted users.


    Example uses:


    +   - Burst Campaigns are perfect for product launches, as 30–300 influencers
    all posting the same day will surely cut through the digital clutter.

    +   - Burst Campaigns can also strongly support a large brand campaign by mirroring
    the message of the campaign with an act of influencers that support the campaign
    message.'

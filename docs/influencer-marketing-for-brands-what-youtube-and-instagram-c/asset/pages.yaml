  md: '# Principle 1. Solving a problem


    are relevant to a core target segment of customers, and exceed our expectations
    as consumers.


    It’s to be noted that there’s naturally a varying degree of problem-solving, conversation-starting,
    and feel-good involved in each of these examples—which what’s important is to
    have your messaging and creative ideas align with as many of these principles
    as possible to create better impact.


    Let’s break down the seven core principles of word of mouth and uncover how each
    can be applied to your own creative development.


    Products and services that solve problems better than anything else will naturally
    have an organic intake of new users. Uber is an amazing example; Slack is another.
    Space X is solving the problem of saving humanity while Spotify is making the
    world’s music accessible to everyone.


    But this can also be in the form of entertainment (Flappy Bird, Candy Crush) or
    your way of communicating an issue or culturally relevant topic (Old Spice: The
    Man Your Man Could Smell Like, Dove: Campaign for Real Beauty²⁴).


    For influencer marketing specifically, we’ve got a few examples to share:


    One of our clients has produced more than a hundred videos on YouTube where each
    video, made by the creator, is highlighting a specific feature that they really
    like about the mobile app and how it solves a problem for them.


    We recently created and distributed a series of 60-second videos (“Coffee Break
    Tutorials”) for Adobe with a behind-the-scene look at how some of the most talented
    photographers in the world edit their photos.


    In fact, we’ve produced several campaigns for Adobe centered around the idea that
    people that follow talented photographers on Instagram are eager to learn how
    they create their content, taking them behind the scenes of how their photos are
    made.


    # Principle 2. Making it easy to talk about


    Half the battle is often to encapsulate and simplify an idea to a point where
    it’s easy to talk about from both a content creator and content consumer point
    of view. Keep it simple, and it will be easy and more likely to talk about. In
    short, if you can’t share the core idea in less than a few sentences around the
    dinner table, it’s likely not going to get passed around among people.'

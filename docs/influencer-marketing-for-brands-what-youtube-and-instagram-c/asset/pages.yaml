    With this in mind, the rest of this section is spent on setting you up to have
    the best chance possible of finding the right talent for brand. We’ll focus on
    the variables, characteristics, methodologies, and questions you should address
    in your quest to find the right talent for your campaign—and you can then seek
    out the right tools, platforms, or partners that will answer to your needs.


    # Owning your talent pool


    As you’ve seen, there are millions upon millions of talented and influential content
    creators across platforms like YouTube and Instagram. And while narrowing your
    search by using relevant applicable filters—such as category, reach, engagement,
    demography, audience, and even brand affinity—you can’t help but wonder if this
    is a sustainable long-term strategy. There’s nothing wrong with the outcome, but
    it’s an approach where you’re starting from scratch every single time, which can
    be very time consuming and inefficient. So, how do you win this game of finding
    a needle in a haystack of data?


    You play a different kind of game.


    Rather than to embark on a quest to find creators and influencers for a specific
    marketing objective or campaign, your short- and long-term goal should be to build
    your own pool of talent. Not to be mistaken for an ambassador'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'program (though that could certainly be an outcome), a talent pool is simply
    a group of individuals that you can activate long and short term, to meet your
    business and marketing objectives. This approach holds several additional benefits
    (outlined as follows) and will drive down the overall cost, time, and energy that
    you spend on your influencer marketing.


    The top-down funnel approach is similar to the one mentioned earlier, but the
    outcome is very different (Figure 3-6).


    ![](img/7ec2733715193510646aec32cc18284f_46_0.png)


    **Figure 3-6.** Top-down funnel, talent pool


    # The talent pool framework


    The ultimate goal of the talent pool strategy is to *increase* your speed of execution,
    quality, competitive advantage, business impact, and unlock economies of scale.
    Simultaneously, you’ll *reduce* internal politics, risk, and both direct and indirect
    competition from other brands fighting to work with the same creators. The best
    part? This is work that can, and should (in my opinion), be carried out well in
    advance of any specific go-to-market strategies and campaigns and even ahead of
    any approved media budgets. Your end goal is to build a pool of talented creators,
    or influencers, ahead of any potential campaign or marketing initiative. This
    can be coupled with an actual campaign, but it doesn’t have to. I’ll walk you
    through the entire process using a fictitious, yet realistic, example.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Direct-to-consumer baby product brand


    Markets: United States, United Kingdom

    Target audience: Millennial parents

    Potential objectives: Content creation, consideration, website sales

    Target: Talent pool of 100 creators on Instagram


    I’d like to start by studying the endgame. I know my brand, market, audience,
    objectives, and target. In this example, I’d like to have a talent pool of 100
    creators on Instagram that I can activate either short or long term.


    # Studying the endgame


    +   - [ ] Talent shortlist is approved by all relevant stakeholders.

    +   - [ ] Compensation structure in place for every single individual.

    +   - [ ] Their values, style, and content aligned with my company or marketing
    goals.

    +   - [ ] Engagement, reach, and other relevant KPIs align with our potential
    objectives.

    +   - [ ] The audience of the talent pool is the right audience.

    +   - [ ] Responsiveness and affinity—clear expressed interest in working with
    us.

    +   - [ ] Proprietary funnel insights (e.g., who drives sales, brand lift, content,
    etc.).


    Don’t worry about how you’ll put all of this in place for now if it seems overwhelming;
    we’ll cover that part later. The first thing we’ll do is to identify the overall
    opportunity. Similar to our prior example of gaming channels on YouTube, it’s
    a top-down approach. It doesn’t have to be, but I’ve found this model to be more
    effective than the other way around. See Figure 3-7.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '![](img/7ec2733715193510646aec32cc18284f_48_0.png)


    * Parents in the US, UK with at least 20,000 followers on Instagram and 3% engagement


    # Figure 3-7. Top-down funnel, Instagram example


    As you can see, we''ve identified a total of 2,665 potential creators within our
    vertical. They are parents, in our markets, with a sizable following and engaged
    audience. They don''t necessarily align with our values and audience or even have
    an interest in working with us, but this is just the starting point.


    This may seem overwhelming at first (especially if you''ve never worked with a
    partner, software as a service, or online platform), but trust me—you''ll narrow
    down the broader selection into a refined shortlist faster than you think. And
    you''re setting yourself up to work with this talent pool long term, so the upfront
    investment should be considered worthwhile. You''re solving the very first bottleneck
    to unlock an effective and scalable approach to influencer marketing—not just
    for one campaign, but for years to come.


    In microeconomics and business, the concept of economies of scale states that
    a company should be able to achieve a decreased cost per unit when they increase
    their production or output. This concept can be applied to influencer marketing
    as well to increase your efficiency. Reduced cost per unit arise from increased
    total output. Scale drives down cost through strategies like long-term commitment
    with top performing talent, long-term approach to building a sustainable talent
    pool (not one-off campaign) drives down your overall cost.'
  merge: -1

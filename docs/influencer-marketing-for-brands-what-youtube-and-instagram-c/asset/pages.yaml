- pgno: 129
  md: '# Chapter 7 | The Four-Step Influencer Marketing Framework


    **Key Questions**  How do you define your primary marketing objective? What are
    the four different marketing objectives for influencer marketing? Why are brands
    commonly picking the wrong KPIs for their marketing objectives? How do you come
    up with a strong creative idea for your campaign? How much should you be spending
    on influencer marketing, and how much does it cost?


    **Core Principles**  1. The Four-Step Influencer Marketing Framework. 2. Conversion
    is the outcome, not the strategy. 3. S.M.A.R.T. goals. 4. The four campaign types.
    5. The disconnect between marketing objectives and KPIs. 6. The seven questions
    that lead to creativity. 7. The insights-opportunity-idea questionnaire.


    The digital media landscape grows more complicated by the hour, and influencer
    marketing is no exception. There’s a need for structure and clarity. Without a
    framework, and a roadmap, you won’t be able to address how influencer marketing
    fits with your overall marketing strategy. It will hold you back from ramping
    up your ambitions and get other internal stakeholders aligned with your plans.
    This is where the Four-Step Influencer Marketing Framework comes into play.


    *First*, you’ll identify your primary marketing objective, target audience, and
    definition of success. *Second*, they’ll become input for platform strategy. *Third*,
    your platform strategy will guide creativity, creators, and content and, *finally*,
    outline your budget, goals, and media plan. This four-step process will provide
    the structure you need to turn influencer marketing into a scalable media channel,
    align stakeholders within your organization, and streamline your campaign planning
    process.


    # Step 1: Marketing objective, target audience, and definition of success


    The goal in the first step is to answer three questions. *What is your primary
    marketing objective? Who is your target audience? What is your definition of success?*
    Let’s go over each one.


    # Question 1: What is your primary marketing objective?


    Your objective should be a clearly defined goal, where you outline what you hope
    to accomplish. Challenge yourself to set an objective that is fully aligned with
    the overarching business and marketing strategy—and it’ll be easier to clarify
    how your influencer marketing plans align with the overarching goal of your business
    or long-term marketing strategy.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'The 2019 State of Influencer Marketing Report¹ revealed that a full 82% of
    respondents are currently advertising on Facebook. With that in mind, chances
    are that you’re familiar with the various ways you can configure your advertising
    campaigns on their platform. As such, the way brands and media buyers set objectives
    on for their advertising on Facebook can function as a great proxy for influencer
    marketing. The approach has two clear benefits: There’s clear consistency (across
    a major digital advertising channel and influencer marketing) and familiarity
    (with similar naming convention between the two).


    Here’s another important parallel to advertising on Facebook and important piece
    of advice: Each campaign should only have one primary objective. If multiple objectives
    are needed, plan separate campaigns for each. Use Table 7-1 to pick what your
    primary influencer marketing campaign objective is.


    # Table 7-1. Your objective and goals


    | Objective | Your Goal |

    |---|---|

    | Awareness | Brand awareness or reach. Increase people’s awareness of your business,
    brand, product, or service and get in front of as many consumers as possible in
    your target audience. |

    | Consideration | Encourage people to learn more about you and what you have to
    offer. Optimize for engagement and video views or spark a dialog with your target
    audience. |

    | Conversion or action | Encourage people to take a specific action, such as downloading
    your app, visiting a retail location or website, or buying your product. |

    | Production | Unlike Facebook or other advertising channels, influencer marketing
    can be used specifically with the goal of creating branded content for your brand.
    |


    When you’ve defined your marketing objective, write it down.


    # Conversion is the outcome, not the strategy


    It will be tempting to pick multiple objectives and reason that each objective
    is equally important. Equally, it’ll be tempting to decide that the end goal is
    the only thing that matters: the conversion event, revenue, and sales. Unfortunately,
    “performance marketing” has become synonymous with conversion—and it’s easy to
    trap yourself into reasoning that it’s the only part of the funnel worth optimizing
    for.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Chapter 7 | The Four-Step Influencer Marketing Framework


    Here’s a different perspective: There’s no such thing as *brand* or *performance*
    marketing. Only marketing with good and bad performance. Awareness, consideration,
    and then getting the customer to come through the door to buy your product were
    all imperative to getting the sale.


    The objective of the entire marketing function within a business is to drive bottom-line
    profits (unless, of course, your company is a *nonprofit*), and generating sales
    should obviously be the outcome of investing your dollars into marketing; but
    it’s precisely that: The outcome and result of all the things you did, leading
    up to the conversion event. Consider The Coca-Cola Company—one of the world’s
    most valuable brands. Their marketing team invests over $4 billion per year in
    above-the-line advertising, an investment that translates into over $40 billion
    in annual sales. Their marketing team understands that the acquisition event is
    the result of the overall marketing strategy. As such, a highly effective marketing
    effort to drive awareness and consideration is indeed a *performance marketing
    campaign*. It drives performance of the awareness objective. The outcome is bottom-line
    profits for the company.


    To be clear, there’s nothing wrong with an action-oriented marketing objective—just
    remember that customer acquisition is never the result of an isolated effort but
    rather the combination of multiple marketing initiatives.


    # Question 2: Who is your target audience?


    With a clearly defined marketing objective in place, it’s time to define your
    target audience. You’ll want to list the attributes of your target audience based
    on demographics, interests, and other relevant values. This isn’t the same as
    defining what kind of creators or influencers you’re looking for, but rather who
    their audience is. See Table 7-2.'
  merge: -1
  img_proc: true

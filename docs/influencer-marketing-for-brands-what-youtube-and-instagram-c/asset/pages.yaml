- pgno: 58
  md: 'Key Questions  How do you pick the right creative strategy for your influencer
    marketing campaign? What are the key elements of an effective brief? How do you
    create campaigns that are more likely to generate word of mouth?


    Core Principles  1. Great marketing is both science and art. 2. Proven creative
    executions on Instagram. 4. The creative strategy scorecard. 4. Proven creative
    executions on YouTube. 5. 17 questions for a highly effective brief. 6. The seven
    principles of word of mouth.


    Creativity—and the act of turning new and imaginative ideas into reality—is a
    rare form of art. In marketing, it’s often the distinction between an idea that
    outlives its creator and one that never sees the light of day. And while brilliant
    marketing is a true form of art, it’s also a science.


    It’s challenging to outline a bulletproof framework for creative work, as the
    definition of the word itself is “to imagine original ideas.” With that in mind,
    my job in this chapter will be to outline both the science (strategy) and the
    art (inspiration). Your job is to mash them up and create magic.


    You’ll learn 14 proven campaign strategies for Instagram followed by 9 different
    ways to create content on YouTube. I’ll even give you a scientific model for how
    to pick the right campaign strategy every single time. We’ll return to these creative
    strategies in Chapter 7: The Four-Step Influencer Marketing Framework where you’ll
    see how everything comes together. You’ll learn the seven principles of word of
    mouth—and how to incorporate each principle with your creative strategy. Then,
    I’ll break down the components of the brief template that we have used within
    my company across more than 10,000 collaborations between influencers and brands.
    Ready?


    # THE SEVEN QUESTIONS THAT LEAD TO CREATIVITY


    The following questions (see Chapter 7: The Four-Step Influencer Marketing Framework
    for details) can help spark your creativity and identify a message that resonates
    with creators, their community, and your customers.


    +   1. Do you have any unique insights about your target audience or your industry?

    +   2. What is the opportunity, based on those insights?

    +   3. What’s popular and relevant in culture, right now?

    +   4. What would connect with your audience at a deeper level and cross-cultural
    borders?'
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   5. What would create an emotional connection with the public?

    +   6. What would have value as a topic of discussion, due to being resonant and
    meaningful?

    +   7. What would engage, polarize, provoke, or entertain the audience of the
    creator?


    # 14 proven creative executions on Instagram


    The days where you could get someone on Instagram to post a selfie with a product
    placement and a discount code in the caption aren’t necessarily over—but it’s
    sure not as effective as it was in 2012. That year, Instagram had 10 million users.
    Fast-forward to mid-2018, and the number had grown to 1 billion monthly active
    users¹. The platform evolved, as did the way brands use the platform to collaborate
    with its most talented and influential creators.


    I’ve witnessed firsthand how challenging and overwhelming this transition has
    been for our clients. Even our own team of business developers and campaign operators
    suffered from the rapid pace of feature deployment when, in less than a year,
    Instagram launched Stories, Shopping, Polls, and Live Video.


    Meanwhile, the campaigns became more complex, and what started off as relatively
    straightforward execution quickly became very challenging to manage. Initially,
    clients came with relatively simple requests, like if they could pick which hashtag
    creators would use to promote their product launch. But then, from nowhere, they’d
    ask for branded experiences through Instagram Live or driving product preference
    through story polls. It became impossible to keep up, and something had to change,
    fast.


    On the other hand, after having worked on hundreds of campaigns, with thousands
    of creators and influencers, a pattern began to emerge. Most campaigns, it turns
    out, would deploy one or several of the same strategies. After careful examination
    and analysis, we identified a total of 14 different campaign strategies for influencer
    marketing on Instagram. Nine times out of ten, these strategies would cover pretty
    much any campaign objective, creative angle, or strategy, each with its own set
    of example uses, key benefits, and sometimes drawbacks.


    By the time you’re reading this, it’s likely that a thing or two has changed or
    evolved, but they’ve held true for over two years at this point, the online equivalent
    of a decade in the offline world.


    > ¹ https://techcrunch.com/2018/06/20/instagram-1-billion-users/'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Your brand, product, audience, messaging, goals, and campaign objectives are
    all variables that will dictate which of these strategies will be effective. It’s
    also common that several of them (between two and five) are applied for the same
    campaign.


    The 14 different creative executions, or strategies, for influencer marketing
    on Instagram are as follows:


    +   1. Single Feed Post Campaign

    +   2. Story-Only Campaign

    +   3. Pairing Feed Posts and Stories

    +   4. Multi-post Campaign (Ambassador Program)

    +   5. Amplifying Brand Experiences

    +   6. Burst Campaigns

    +   7. Going Live for Maximum Authenticity

    +   8. Supporting Hero Brand Campaigns

    +   9. Driving Consideration Through Polls

    +   10. Hyper Local Campaigns

    +   11. Swipe-Up Lead Generation

    +   12. Real-Time Recruitment

    +   13. Creating Content for Ads

    +   14. Using Influencers as Talent


    We’ll go through what each strategy entails along with example uses and key benefits.
    To help further, you’ll be assisted by a scorecard for additional support at the
    end of this section—but you’ll have to become familiar with the traits of each
    and trust your gut feeling as well.


    # Creative strategy 1: Single Feed Post Campaign


    Single Feed Post Campaigns allow for brands to work with the maximum number of
    people within their budget.


    Example uses:


    +   - Driving mass awareness around a new product

    +   - High-quality beauty shots incorporating the brand/product'

- pgno: 142
  md: 'With that in mind, the following questions can help spark your creativity and
    identify a message that resonates with creators, their community, and your customers.


    Do you have any unique insights¹⁰ about your target audience or your industry?


    What is the opportunity, based on those insights?


    What’s popular and relevant in culture, right now?


    What would connect with your audience at a deeper level and cross-cultural borders?


    What would create an emotional connection with the public?


    What would have value as a topic of discussion, due to being resonant and meaningful?


    What would engage, polarize, provoke, or entertain the audience of the creator?


    Finally, you’d have to consider if what you’ve identified, and what you’re proposing,
    is feasible to produce, and execute, for participating influencers. Summarize
    the answer to these three questions when you’ve identified the creative idea for
    your campaign.


    Table 7-6. Insight-opportunity-idea questionnaire


    | Question | Answer |

    |---|---|

    | What is the unique insight? | |

    | What is the opportunity? | |

    | What is the idea? | |


    Answering all three will help both internal and even external stakeholders see
    the full picture. Finally, reassure that the creative idea is aligned with the
    marketing objective, target audience, definition of success, and campaign strategies
    that you’ve outlined in Steps 1–2.


    # Creator selection process and type of content


    With a creative idea in place, it’s time to find the right talent for your campaign,
    with the right kind of content. Within the context of the framework, you’re only
    identifying the parameters that will guide campaign execution—and not an actual
    list of influencers or creators.'

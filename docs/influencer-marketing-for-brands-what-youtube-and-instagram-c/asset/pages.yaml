- pgno: 90
  md: 'I’ve got good news and bad news. Good news first, shall we? 9 out of 10 influencers
    and content creators on Instagram follow brands that they like and want to work
    with. You’ve got their attention! A scarce currency in the attention economy—where
    the battle for attention is growing exponentially. Ready for the bad news? Chances
    are that you’re letting them down, big time.


    In preparation for writing this book, I spoke with over 200 influencers on Instagram²
    to get their take on the current state of the social media landscape. The research
    uncovered several relevant insights that can be applied to solve problems and
    create new opportunities for both creators and brands.


    The main thesis throughout this chapter is this: With a creator-centric perspective
    to influencer marketing, you’ll increase their value of working with you—rather
    than the other way around. In exchange, you’ll create leverage that will improve
    your return on investment. But what do we mean by creator-centric? Simply that
    each problem, challenge, and opportunity should first be observed through the
    eyes of the creators and influencers that you’re working with. That, when you
    see things from their frame of reference and embrace their perspective, you’ll
    be fully aware of what it’s like to walk in their shoes.


    # What creators expect


    Let’s take a deeper look at those good and bad news of ours. The study found that
    87% of panelists (each a creator on Instagram with at least 10,000 followers)
    follow at least one brand on Instagram. That’s good news, obviously, but what
    do they expect from these businesses and their social media presence? Following
    up to the first question, each creator was asked to share both what they expect
    from these brands³ and what [from the perspective of the creator] their biggest
    mistakes are⁴. Examine the 200 different responses to the first question, and
    four clear themes emerge.


    # Why do you follow brands on Instagram?



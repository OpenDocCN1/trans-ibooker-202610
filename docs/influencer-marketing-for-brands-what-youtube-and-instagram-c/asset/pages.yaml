  md: 'compensation. Again, you don’t have to structure your compensation this way,
    but I’ve included the examples to demonstrate that you can be more sophisticated
    if you want.


    It should be noted that this is something you do internally. There isn’t a need
    for you to communicate the model you use to anyone. Just state what your budget
    suggestion is.


    Obviously, your overall budget and average industry rates will also play an essential
    role in how much your compensate someone you work with.¹⁰ A rate card or formula
    for how you compensate the talent you engage in your campaigns will be an essential
    cornerstone to mitigate the need to negotiate from scratch in every single engagement
    and dialog that you create. Plus, compensation will be an important consideration
    for someone to decide if they want to work with you and, as such, something you’ll
    want to be transparent with up front and as soon as possible.


    Suggest a budget, rather than negotiate one. That way, your counterpart can choose
    to accept or reject your suggestion. Once you have a formula in place, you can
    build a simple spreadsheet using Numbers, Excel, or Google Sheets that calculates
    your compensation automatically. Table 6-1 uses Example 1 from earlier.


    # Table 6-1. A dynamic model for calculating compensation


    |   | A | B | C |

    |---|---|---|---|

    | 1 | Instagram | Followers | Compensation |

    | 2 | CreatorA | 100,000 | =sum(B2/1000*30) |

    | 3 | CreatorB | 50,000 | =sum(B3/1000*30) |


    As you can see, the line items could be replicated with hundreds or even thousands
    of lines without additional work on your end.


    # Not too little, not too much


    Just like an employer hiring new members to their staff, you won’t attract workers
    with the right skills if the salary is too low. And while there’s certainly a
    long tail of talent out there (as covered in previous chapters), there’s no such
    thing as unlimited supply. Suggest compensation that is too low, and you’ll find
    that no creator, or influencer, will show interest in working with your brand.
    On the flipside, it’s obviously not wise to pay more than you have to.


    > ¹⁰This section won’t cover what those rates are or how to media plan your entire
    campaign, but rather focus on the shift required to make sure negotiation or discussions
    around compensation doesn’t become a constraint.'

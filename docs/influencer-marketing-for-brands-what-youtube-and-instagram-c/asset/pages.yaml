- pgno: 88
  md: '# Chapter 4 | The Art and Science of Creativity


    Now, what you’ll want to do is take all users that picked Option #2 (Friend recommendation)
    and follow up with questions that will get you to understand the how and the why.
    Again, you’ll ask three questions (phrase them so that they make sense for your
    specific business):


    Remember, these questions are only asked on the condition that the answer to “A
    friend recommended your product” is true.


    +   1. What did your friend/friends say that made you buy our product/install
    our app/visit our store (etc.)?

    +   2. On a scale of 1–10, how likely are you to recommend our service/product/brand
    to someone you know?

    +   3. How would you describe our service to your friends?


    What you’ll discover when you run this type of survey to your customers is absolutely
    mind-blowing.


    The first question is the most powerful of all, as it will reveal exactly how
    your product is perceived in the market. You’ll have to analyze each response
    individually and look for recurring themes and keywords. Pay attention to the
    answers. This can feel like a daunting and time-consuming task…but take the time,
    and you’ll instantly know more about your customers than anyone on the planet.


    You’ll discover what promises your customers are making to their friends, and
    by following up with the second question, you’ll see if the promise is fulfilled
    or not. These are the conversations that are taking place around dinner tables,
    in emails, over coffee, at schools, workplaces, and on the morning commute—whether
    you like it or not. If you’re seeing a large proportion of your growth coming
    from friend referrals and many of the referrals are expressing that they’d recommend
    your service to their friends, you’re on the right track. The third and final
    question will help you understand what parts of your service they are impressed
    by.


    You’ll also learn that there will be multiple clusters and segments representing

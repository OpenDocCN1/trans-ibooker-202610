    # Creative strategy 12: Real-Time Recruitment


    Brands love to talk about their involvement with big cultural moments and are
    willing to invest in bringing ambassadors to these events to promote the brand’s
    involvement. Real-Time Recruitment is a way to maximize the amount spent on influencers,
    as opposed to flights and hotels.


    Example uses:


    +   - Recruiting influencers that are at a high-impact festival or summer destination
    to post content on behalf of the brand.


    Key benefits:


    +   - Why spend money on getting influencers to an event if there are some already
    there? The key is to use technology to find them.


    # Creative strategy 13: Creating Content for Ads


    Influencers have generated their large followings by creating highly relevant,
    inspiring, and engaging content—exactly the type of creative work brands turn
    to their creative agencies for. Influencers can be used to create their own translation
    of the brand’s message, and the brand can then negotiate the rights for commercial
    reuse.


    Example uses:


    +   - Create highly engaging social content for a new product, reusing and promote,
    only content that received high-organic reach, ensuring marketing spend is allocated
    efficiently.'

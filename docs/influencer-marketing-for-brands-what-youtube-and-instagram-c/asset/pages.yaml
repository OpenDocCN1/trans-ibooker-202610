  md: '# Step 3: What the FAQ do you want?


    Time required: A couple of hours


    Effort: Mid


    Impact: Mid to high


    With a dedicated platform in place for handling negotiations, discussions, and
    general communication with influencers that you reach out to (and those that you''re
    actively working with), you''ve engineered a system where throughput of communication,
    or the number of creators you''re working with, doesn''t create additional bottlenecks.
    An ongoing conversation with 1, 10, or 100 individuals in parallel follows the
    same process, and a cluttered inbox is no longer the weakest link in your chain.
    Dr. Eliyahu Goldratt would have been proud. But we''re not done yet.


    Speaking of ongoing dialog, the third thing you''re going to do is reduce the
    number of messages that you send and receive to each person.


    First, we need to debunk a common myth among marketers, that is, people don''t
    read, or prefer, long-form content, especially email. I disagree with the entire
    premise. It depends entirely on what the content is—and if it''s relevant to its
    reader. And know this—most creators and influencers are utterly frustrated with
    agencies, brands, and marketers that can''t give them enough information and are
    left wondering: What the heck do you want?


    The following questions, as seen in Chapter 4: The Art and Science of Creativity,
    will inevitably run through the mind of anyone you seek to engage in any collaboration,
    partnership, talent pool, or ambassador program of any shape or form (in no particular
    order):


    +   1. Who are you and your company? (introduction)

    +   2. What does your company, product, or service do? (background)

    +   3. Why are you reaching out to me? (context)

    +   4. What is expected of me? (brief)

    +   5. When is it expected? (commitment)

    +   6. How will we be working together? (process)

    +   7. How much will I get paid? (compensation)

    +   8. What do you want me to do next? (call to action)'

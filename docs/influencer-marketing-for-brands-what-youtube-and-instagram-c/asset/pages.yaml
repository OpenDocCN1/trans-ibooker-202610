  md: '![](img/7ec2733715193510646aec32cc18284f_140_0.png)


    Figure 7-3. Comparing likelihood of disconnect by level of experience


    Marketers with an extensive level of experience are more likely to pick “engagement
    or clicks” as their main way of measuring the results of a campaign when the main
    objective is awareness/consideration (44%), while the metrics are actually reversed
    for marketing teams with little to no experience (18%).


    With this in mind, assure that your marketing objectives and definition of success
    are clearly aligned and defined—because, otherwise, there’s an overwhelming chance
    that your own organization will be as scattered as the outcome of our research.



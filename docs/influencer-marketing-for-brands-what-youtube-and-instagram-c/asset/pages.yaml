- pgno: 66
  md: '# Creative strategy 10: Hyper Local Campaigns


    Some products are closely tied to specific locations, such as restaurants, tourist
    attractions, or limited availability products. By having talented creators visit
    these locations, the story you tell and content you produce will naturally be
    both authentic and engaging.


    Example uses:


    +   - Restaurant that wants to promote a specific item on a menu at a location

    +   - Hotel or resort that wants to promote specific features of that location

    +   - Brand or product that wants to highlight the availability of a product in
    a certain place


    Key benefits:


    +   - This is a type of marketing that is unique to influencers—it''s real on-the-ground
    word of mouth, amplified by social media.

    +   - Influencers will be talking about their own, genuine experiences at these
    locations, so the content is extremely authentic.


    # Creative strategy 11: Swipe-Up Lead Generation


    The main KPIs for Instagram campaigns are typically reach and engagement, rather
    than direct sales. However, it''s possible to set up campaigns to feed another
    portion of the marketing funnel and measure success through the cost per lead
    and the cost difference of influencer-referred leads and those targeted by other
    means.


    Example uses:


    +   - Influencer content can drive to a brand page allowing the brand to retarget
    that consumer through existing Facebook or display campaign funnels.

    +   - Alternately, we can drive to an email-sign up page, allowing the brand to
    enter the leads into an email marketing campaign.'

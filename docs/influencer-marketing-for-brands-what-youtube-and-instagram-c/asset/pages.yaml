    # Nine proven creative executions on YouTube


    YouTube and Google have published their own official guidelines and suggestions⁴
    with an outline of nine different and proven creative executions for brands that
    seek to work with the millions of talented creators on their video platform.


    On YouTube, it’s common practice for brands, creators, and their agents or agencies
    to distinguish between dedicated and integrated videos. Dedicated videos are branded
    collaborations between creators and brands where your product or service is the
    only one featured in a video. Examples include tutorials, unboxing, lookbooks,
    branded storytelling, product demos, or sketches. Integrated videos mention your
    brand, but would also feature other content, products, or brands. Examples of
    use would include hauls,⁵ favorite products, unboxing, or contextually relevant
    shout-outs/mentions of your brand.


    Let’s review the nine common types of content creation on YouTube and how they
    can be used to build collaborations between brands and creators.'

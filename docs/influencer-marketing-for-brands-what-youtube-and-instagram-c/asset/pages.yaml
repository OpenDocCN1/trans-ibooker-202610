- pgno: 49
  md: 'As you narrow your selection, especially if your team is larger than one, you’ll
    have to make sure that there’s a clear definition of what you’re looking for in
    terms of style, diversity, sentiments, values, and such. There’s nothing worse
    than having one half of your team disapprove what the other half believe is perfect.
    If you have other stakeholders from other teams weigh in with their opinion, make
    sure that their feedback is assessed objectively.


    My next step, in this fictitious example, would be to analyze the audience of
    my preferred shortlist. To accomplish this, I’d use a third-party company or tool
    specialized in analyzing and profiling audiences and demographics in social media.
    A few examples are Demographics Pro,⁷ HypeAuditor,⁸ and the Audience Insights
    Tool available from my own company.⁹


    Congratulations are in order. We’ve identified a large pool of talented influencers
    and creators that we’d like to work with. Your other internal stakeholders have
    signed off on your shortlist (phew!)—a common bottleneck and time sink, eliminated
    for the foreseeable future. You and your team can now execute with greater speed
    than ever before. But remember, our endgame is to have a talent pool of 100 creators
    with both increased impact and reduced friction. Things are in motion, but the
    best is yet to come.


    # A two-way street


    In August 2019, my company polled over 2,000 influencers across 67 countries to
    understand what their deciding factors are when seeking out to collaborate with
    a brand.


    **Table 3-5.** Deciding factors, brand collaboration


    | Factor | Respondents |

    |---|---:|

    | How much they pay | 14% |

    | That I know their product/service works | 27% |

    | That I have heard of their brand before | 3% |

    | That their core values are aligned with mine | 34% |

    | That they give me creative freedom | 23% |


    Factors such as money, fame, and even creative freedom are outranked by having
    a shared set of core values. That doesn’t mean that those other factors can be
    ignored, but goes to show that the rigorous vetting process of finding the right
    creators for your brand will stand or fall by an equally rigorous'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'vetting process of your brand. Additionally, you’ll create a massive unfair
    advantage for your company if you can demonstrate to influencers and creators
    that you understand their point of view, something we’ll cover in depth in Chapter
    5: Creator-Centric Strategies.


    This far, we’ve narrowed down our selection by roughly 80%, from 2,665 to 500
    creators. They fit the criteria of our talent pool to perfection. Let’s see if
    the same can be said about our brand. If you examine the top-down funnel numbers
    outlined in the beginning of our fictitious example, you’ll notice that we’ve
    planned for a final steep drop-off. As outlined in our previous checklist, you’ll
    want to identify who’s responsive and share your core values along with a clearly
    expressed interest in working with your brand. We took a pass on roughly 80%,
    so it’s only fair to assume that 80% of creators will do the same with us. It’s
    perfectly understood if the process of reaching out to hundreds of influencers
    just to have them qualify you may seem overwhelming or even impossible, especially
    with all the previous work leading up to this stage. We’ll cover exactly how to
    engineer each step of the way in Chapter 6: Relationships at Scale. You’ll probably
    be surprised when you realize how easy this part actually is.


    Remember, the goal is to have those on your final shortlist raise their hand and
    let you know if they want to work with your brand as much as you’d like them to
    work with you. This is also an opportunity to identify other variables that can’t
    be assessed without their input. Do they work out at a local gym? Go to festivals?
    Like their current smartphone? Own a smartwatch? Use Cannabis? Drink alcohol?
    Eat meat? Plan to renovate their bathroom? Yes, these are all real examples. And
    when you know the answer, and they’ve raised their hand and confirmed that your
    values are aligned with theirs, you’ll never have to look for a needle in a haystack
    ever again.


    # From commodity to valuable asset


    By narrowing your search from millions, to thousands, to hundreds, you’re playing
    a different kind of game. You now have a talent pool of creators, or influencers,
    “owned” by your company. Rightfully, these amazing individuals doesn’t “belong”
    to you in any shape or form, but you’ve transformed a commodity into a valuable
    asset. But this is just the starting point.


    Let’s assume that you activate all 100 influencers in your talent pool for a campaign
    where the goal is to drive sales on your website. Each campaign participant is
    given a promotional code that their followers can use when they shop on your website.
    After a week, you analyze the outcome of your campaign. Suddenly, you have a data
    point and insight that nobody on the planet had last week. You know who sold products
    and who didn’t. You know who the bottom 20% are (that you likely shouldn’t engage
    for a second similar campaign with a similar objective), who the middle 60% are
    (that help you establish an average benchmark), and who your top performers, the
    top 20%, are (most valuable distribution, undervalued assets). See Figure 3-8.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/7ec2733715193510646aec32cc18284f_51_0.png)


    Figure 3-8. From commodity to valuable asset


    The same principle can be applied to measure other marketing funnel KPIs like
    reach, brand lift, website traffic, engagement, website traffic, lead generation,
    or app installs. If you were to replicate the very same campaign, with the very
    same structure, and change nothing but to exclude the bottom 20%, you’ve suddenly
    skewed the odds to somewhat in your favor. Double down on the top 20%, and you’re
    Billy Beane in Moneyball.¹⁰


    # The power of the long tail


    Amazon, Spotify, and Google have all built their companies on the premise of the
    long tail. The concept, in the context of business, was popularized in 2004, when
    Wired editor-in-chief Chris Anderson published an article entitled “The Long Tail.”¹¹


    In his article, Anderson argues that our culture and economy is shifting away
    from a focus on a relatively small number of hits (the head of the demand or distribution
    curve) toward an infinite, or at least rapidly expanding, number of niches in
    the tail (collectively with a larger market share than the head). He expanded
    his reasoning and published a book in 2006, The Long Tail: Why the Future of Business
    Is Selling Less of More. The book entered the New York Times bestseller list the
    same


    ¹⁰ Billy Beane, the baseball general manager whose story was the subject of Michael
    Lewis’ bestselling book Moneyball: The Art of Winning an Unfair Game


    ¹¹ www.wired.com/2004/10/tail/'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Chapter 3 | *Influence Is an Outcome, Not a Profession*


    year, and the theory of the long tail is since commonly adopted in business, economics,
    and marketing to explain how a sufficiently large number of niche players (books
    on Amazon, songs on Spotify, and web pages on Google) can compete with the large
    powerful few—in a world where markets are decentralized to match unlimited variety
    of both supply and demand.


    I’ve been fascinated by the long tail since Anderson first published his book,
    and his theories have personally given me an edge more than once, specifically
    in web development, e-commerce, and search engine optimization. As such, when
    co-founding our business in 2016, some 10 years after the book made the bestseller

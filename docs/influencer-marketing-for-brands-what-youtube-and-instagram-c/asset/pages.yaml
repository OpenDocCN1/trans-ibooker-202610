  md: '# Chapter 6 | !:! Relationships at Scale


    In this example, you’ve simply included an additional flat fee, but lowered the
    dynamic rate. Why would you do that? Because, in this example, you probably have
    to. Look at Creator C in the example. The flat fee assures that the absolute compensation
    is reasonable even for someone with a smaller following. You can also build your
    compensation on engagement and interaction rates, as follows:


    # Example 3


    Output: A feed post on Instagram, optimized for engagement


    Dynamic model: $0.30 per engagement on recent posts


    Formula: [Average engagement x follower count] x $0.45


    Creator A with 3% engagement and 100,000 followers (3,000 estimated interactions.).
    Budget: $1,350


    Creator B with 5% engagement and 50,000 followers (2,500 estimated interactions.).
    Budget: $1,125


    Is one model better than another? It depends entirely on what your campaign objective
    is. Let’s look at a fourth and final example on YouTube.


    # Example 4


    Output: A video on YouTube promoting your product


    Dynamic model: $150⁹ per 1,000 views, calculated on average view count on most
    recent videos


    Formula: [Average video views]/1000 x $150


    Minimum compensation: $2,000


    Maximum compensation: $6,000


    Creator A with 30,000 average views per video. Budget: $4,500


    Creator B with 50,000 average views per video. Budget: $6,000*


    Creator C with 10,000 average views per video. Budget: $2,000*


    In this example, note the minimum and maximum compensation. Why would we do this?
    You don’t have to, but it’s a way to mitigate for risk on both ends. On the lower
    side, we know that too low of an absolute compensation (minimum) isn’t attractive.
    Someone that will spend a week shooting a video for you will demand a certain
    base pay for their efforts. On the other end of the spectrum, your internal objectives
    might be to certain total number of videos, which wouldn’t be possible if each
    individual creator received too much


    > ⁹This is an entirely made up example and doesn’t constitute a recommendation
    on how much you should compensate someone.'

    # The YouTube creator’s creative brief


    YouTube has, in their official brand and creator guidelines, published a six-step
    guide to writing an effective creator’s creative brief, available on their website.¹³
    They recommend that brands include the following essential elements: Objective,
    Insight, Style and Messaging, Deliverables, Inclusions, and Creative Control.


    # Objective


    What is the purpose of the campaign and what are you hoping to achieve? Key considerations
    in this first element include your challenges, goals, and insights used to inform

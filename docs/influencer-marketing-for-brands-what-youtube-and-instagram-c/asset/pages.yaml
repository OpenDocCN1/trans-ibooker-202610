    # Step 4: Budget, targets, and media planning


    You’ve reached the fourth and final step of the Influencer Marketing Framework.
    Similar to our previous definition of success, we will now identify the exact
    targets and key performance indicators that are needed to reach your overarching
    campaign goals. Your final assignment is to take your overarching goals, KPIs,
    and unit costs and outline specific project targets. Table 7-3 from Step 1 with
    the four campaign types (reach, attention, action, content) will help guide what
    you should measure and how.


    Let’s start by addressing what will naturally decide the scope of your influencer
    marketing campaign: budgets.


    # Budgets


    *How much should we be spending on influencer marketing, and how much does it
    cost?*


    An increasing number of brands, and marketing teams, are allocating dedicated
    media budgets to influencer marketing. A 2019 survey from Influencer Marketing
    Hub[^1] across 800 marketing agencies and brands found that 86% of survey respondents
    had a dedicated marketing budget for influencer marketing, a number that was just
    37% in 2017. The same research revealed that marketing teams are not only spending
    more media dollars than ever before on influencer marketing, but that two of three
    respondents are planning to increase their spend additionally over the next year.


    [^1]: https://influencermarketinghub.com/influencer-marketing-2019-benchmark-report/'

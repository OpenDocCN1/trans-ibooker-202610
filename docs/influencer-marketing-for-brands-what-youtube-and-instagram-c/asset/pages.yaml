  md: "influence your decisions. Why? Expertise and credibility, the *first* lever\
    \ of influence. The *second* lever is the strength of your relationship. The better\
    \ you know each other, the more effective. We trust our friends, family, and those\
    \ we have a strong relationship with. We also have different strength of relationship\
    \ with those we follow or subscribe to online. The audience size of the personal\
    \ trainer, and the number of people she can reach, functions as a multiplier.\
    \ And that’s the *third* lever of influence.\n\n# The Formula\n\nInfluence = Audience\
    \ Reach x Affinity (Expertise, Credibility) x Strength of Relationship with Audience\
    \ (Engagement).\n\n+   1. **Audience Reach** is the size of the audience and who\
    \ they are. Subscribers, followers, or a network of friends.\n+   \n+   2. *Affinity\
    \ (Expertise, Credibility)* is making sure that there’s an affinity, a natural\
    \ liking, or sympathy for your message or brand. It’s equally about expertise,\
    \ as defined by “knowledge in a particular field” and credibility, defined as\
    \ “the quality of being trusted and believed in.” We’ll dive deeper into the attributes\
    \ creators value when working with brands in Chapter 5: Creator-Centric Strategies.\n\
    +   \n+   3. *Strength of Relationship with the Audience (Engagement)* is about\
    \ how close the audience is. If the relationship is weak, the audience isn’t paying\
    \ attention and the message will have low attention and low impact.\n\nWhen you\
    \ set yourself up to optimize for all three, you’ll be more likely to build influencer\
    \ marketing campaigns with a better outcome.\n\n# Audience size\n\n*Strategy:\
    \ Audience first*\n\nMake sure that the creator you’re working with has an audience\
    \ that overlaps with your audience. Assure that you understand how many creators\
    \ there are in a specific follower range and your market.\n\n**Key questions:**\
    \ *Who is our target audience? Who has an audience that can help us reach this\
    \ audience? How large audience should each person we’re working with have?*"

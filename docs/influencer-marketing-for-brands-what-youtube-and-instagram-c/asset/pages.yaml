    If you’ve skipped any of these steps, your entire workflow will break down as
    soon as you begin to increase your throughput. That’s how the Theory of Constraints
    works—in theory and in practice.


    Remember our exercise with the talent pool, from Chapter 4: The Art and Science
    of Creativity? The act of onboarding a hundred people to a campaign, ambassador
    program, or talent pool simultaneously may have seemed daunting—but as promised,
    I’ll now guide you through the steps you need to take to get there without breaking
    a sweat along the way. Just like with the customer service analogy and Intercom,
    we’ll use two tools that already exist (95% chance or so) within your organization:
    spreadsheets and email marketing. You’ve probably heard of email service platforms
    like MailChimp¹¹, Sendgrid¹² or Drip.¹³ I’ve personally used all three extensively,
    and I recommend them all. Just like with Intercom, I’d propose that you get a
    different account, or service, outside of what you use otherwise for communication
    with customers or other related email marketing initiatives.


    Your experience with email marketing platforms such like those mentioned in the
    preceding text will vary, so certain parts of this step will either seem very
    basic or very complicated, depending on your experience. Don’t worry though—just
    keep the end goal in mind: The shift we’re looking to make is to move you away
    from reaching out to influencers and creators one by one while building even stronger
    1:1 relationships.


    For the following steps, you’ll need a spreadsheet software such as Numbers, Excel,
    or Google Sheets and an account with one of the preceding email marketing services.
    In the following step-by-step instructions, we’ll use Google Sheets and MailChimp
    to set yourself up to reach out to 500 creators with the press of a single button.
    Note, the numbers could be 50 or 5,000. Same steps, same workflow, no constraints.
    Ready?


    # Step 1. Create a table


    Start by opening up an empty spreadsheet. Your table will consist of a line, or
    row, for each creator, and column for each variable we need to include in our
    email (Table 6-3). There’s no limit to the number of columns you can have—but

    | Gender | Female |

    | Other | N/A |


    # ## Question 3: What is your definition of success?


    Your definition of success should answer what your campaign key performance indicators
    (or KPIs) are as they relate to your previously defined *campaign objective*.
    Ever heard that your goals, or objectives, should be S.M.A.R.T.? First coined
    by George T. Doran in 1981³, the expression, and the acronym, suggests that your
    goals should be:


    +   - **Specific**—What, specifically, needs to be done to create business value.

    +   - **Measureable**—Track, quantify, or at least suggest an indicator of progress.

    +   - **Achievable**—The objective is accepted by those responsible to achieve
    it.

    +   - **Realistic**—State what results can realistically be achieved, given available
    resources.

    +   - **Timed**—Specify when the result(s) can be achieved.


    The S.M.A.R.T. mnemonic can be a great reminder for when you shape both your objective
    and your definition of success. But how do you set *specific* goals for influencer
    marketing or know what metrics you’re supposed to *measure*? How do you align
    your team and other stakeholders on what’s *achievable* and *realistic*, with
    the right time frame?


    You use a proven framework, across four different proven influencer marketing
    campaign types, as shown in Table 7-3.


    > ³ Doran, G. T. (1981). “There’s a S.M.A.R.T. way to write management’s goals
    and objectives.” Management Review. 70 (11): 35–36'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Table 7-3. The four campaign types


    | Campaign Type | Attention Campaign | Interest Campaign | Action Campaign | Content
    Campaign |

    |---|---|---|---|---|

    | Objective | Awareness | Consideration | Conversion | Production |

    | KPIs | Brand lift, reach, eCPM | Video views, cost per engagement, purchase
    intent, interest, favorability, sentiment, conversation | Website traffic (organic,
    direct), installs, sales, cost per acquisition | Quality, engagement, cost per
    asset vs. traditional production, speed |

    | Primary platform | Instagram | YouTube, Instagram | YouTube, Instagram | Instagram
    |

    | Unit cost | Audience reach, CPM | Total engagement, cost per engagement, cost
    per view | Cost per view on YouTube, target cost per acquisition × total budget
    | Cost per asset |


    If your primary objective is to increase awareness, you’d measure the impact of
    your campaign by metrics such as brand lift, total reach, and the effective cost
    per 1,000 people (eCPM). Your preference of platform would primarily be Instagram,
    and the cost of your campaign would scale up, or down, by the total audience you
    attempted to reach (unit cost). If your primary objective was to drive conversion,
    you’d select the action campaign. The KPIs change, and your goals are set on things
    like website traffic, cost per acquisition, or total sales.


    # The four campaign types


    # Attention campaign


    When you’re running an influencer marketing attention campaign, your main objective
    is to create awareness in a new, or existing, target audience. Your strategy?
    To reach as many relevant consumers as possible, at the lowest possible cost,
    with the greatest possible impact. To understand the real business impact of a
    reach campaign, it’s recommended, if conditions allow, to measure the metrics
    that matter with a brand lift study. When you do this, you go beyond impressions,
    views, or followers to understand what impact the campaign had on perception or
    behavior throughout the consumer journey—by asking the right questions to target
    consumers that have been exposed to the campaign.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Typical brand lift sample questions:


    +   - Do consumers recall the campaign?

    +   - Are my target consumers more aware of my brand?

    +   - Did the campaign move people to consider my brand or product?

    +   - Are consumers more favorably aligned with my brand’s message/identity?

    +   - Are consumers intending to purchase my product?

    +   - Are people more interested in my brand/product?


    Brand lift studies can be costly, though—and might not be applicable for campaigns
    with a smaller budget. In this case eCPM,⁴ and total reach, could be sufficient—as
    long as they are compared or benchmarked with similar previous activations. Awareness
    campaigns are typically suitable when a brand enters a new market or segment or
    when the general level of aided or unaided awareness in your target segment is
    low.


    Consider the following example and opportunity:


    As more consumers strive for wellness-oriented lifestyles, brands within the beverage
    industry are offering more nonalcoholic products. This is, for obvious reasons,
    a massive opportunity for the trillion⁵ dollar nonalcoholic beverage industry.
    The bad news? The level of awareness for these products is extremely low. A trend
    study on alcohol consumption among early adopters from late-2019⁶ revealed that
    consumers that are looking to reduce their alcohol consumption aren’t considering
    nonalcoholic cocktails or drink brands primarily because they don’t know what
    products that are out there (56%).


    This is a prime example of an industry that would benefit from an increased level
    of awareness.


    # Interest campaign


    In a world where people can watch, read, or listen to whatever they want, whenever
    they want, anywhere they want, capturing interest is more important than ever
    before. At this stage of the marketing funnel, your goal is to increase the level
    of consideration and encourage consumers to learn more about you and what you
    have to offer. It’s time to address how your offering



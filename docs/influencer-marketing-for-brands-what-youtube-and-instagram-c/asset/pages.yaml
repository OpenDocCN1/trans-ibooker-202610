- pgno: 54
  md: '# Chapter 3 | *Influence Is an Outcome, Not a Profession*


    See, consumers didn’t just turn their back on the old model of one-size-fits-all
    mass appeal—they turned toward something they liked better, something they welcomed
    with opened arms. For the very first time in their lives, unlimited variety of
    supply meant that there was that *perfectly tailored something* for *everyone*.
    When consumers have the option to choose what they paid attention to, they naturally
    pay more attention.


    Between 2015 and 2018, several marketing research companies, influencer marketing
    agencies, and social media platforms reported that the real power of influencer
    marketing sits with social media creators on Instagram with a smaller following,
    loosely referred to as “micro-influencers.”


    > “Micro-Influencers Are More Effective With Marketing Campaigns Than Highly Popular
    Accounts” reads the headline of an article published by Adweek in 2017.[^13]


    During the same time, around 2017, I drew the same conclusion. The fewer followers
    you have on social media, the more engaged the audience. It makes sense when you
    think about it, as per the theory of the long tail and unlimited variety of supply.
    This meant two things for marketers. First, there’s a greater supply of content
    creators found in the long tail. Secondly, their audiences are paying closer attention
    to what they’re doing. On the flipside, you’d have to collaborate with a much
    larger collective of creators to make up for the limited reach and sheer size
    of each individual audience.


    But then, that very same year, something happened: Instagram and its parent company
    Facebook began, quite literally, to *move things around*. With its most recent
    update, the order of the posts on a user’s feed would no longer show up in chronological
    order. Instead, their algorithm would switch the order of the posts on a user’s
    feed into what they think each account would like. It sparked some controversy
    at the time (changing the familiar seems to have that tendency), but came with
    intentions to improve the way its users experienced their product. The official
    announcement from Instagram, accurately titled “See the Moments You Care About
    First,” explained that as Instagram had grown, its users had begun to miss out
    on as much as 70% of their feeds. Including posts they’d actually care about the
    most.[^14]


    With complex algorithms in charge of serving its users with engaging content,
    something interesting happened with the long tail. Suddenly, content creators
    and influencers with both smaller and larger following began (at an aggregated
    average, I should note) to see greater attention[^15] from their audiences. See
    Figure 3-10.


    [^13] https://www.adweek.com/digital/micro-influencers-are-more-effective-with-marketing-campaigns-than-highly-popular-accounts/

    [^14] https://instagram.tumblr.com/post/141107034797/160315-news

    [^15] Engagement rate measured by total comments and likes divided by followers'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Engagement Rate Benchmark on Instagram, February 2019


    ![](img/7ec2733715193510646aec32cc18284f_55_0.png)


    Figure 3-10. Engagement rate benchmark on Instagram, Feb 2019


    As indicated by the left side of the graph seen in Figure 4-13, there’s a clear
    correlation between the size of your audience and how engaged they are, but it’s
    only half of the truth. Look to the right side of the graph, and engagement is
    not just stabilized, but increased. This is the Instagram algorithm at work, serving
    its users with the posts they actually care about the most. So, has the long tail
    lost its power? Does the head suddenly have more power than the tail? Judging
    by the graph, seeking to collaborate with influencers that has an audience of
    5 million followers (and an audience just as engaged as someone with 50,000 followers)
    seems like a no-brainer. Paradoxically, that conclusion would trick you down the
    wrong path. Perhaps contradictory at first, the tail has even more power than
    ever before. But remember that these numbers are aggregated averages. There may
    be more social media creators with a larger following and highly engaged audience,
    but there aren’t that many of them. Consider the following:


    # Group A


    Followers: 5,000,000+


    Average engagement: 3.5%


    Total creators: 1,300


    # Group B


    Followers: 50,000–100,000


    Average engagement: 3%


    Total creators: 175,000'

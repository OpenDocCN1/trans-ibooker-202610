- pgno: 14
  md: 'In Wedgwood: The First Tycoon, historian Brian Dolan explains:


    > Josiah had been told that The Queen was much impressed with the service he had
    worked on so frantically. The pieces were finished in his unique cream color,
    with green and gold decorations as requested, but best of all, the engine-turned
    cups fitted the saucers and the lid fitted the pot. As promised, it was craftsmanship
    fit for a queen, and Charlotte was so satisfied with her new service that she
    bestowed a special privilege on Josiah.


    We can’t tell for sure, but the special privilege was very likely a suggestion
    by Mr. Josiah Wedgwood himself. To honor Her Majesty, Josiah offered to rename
    his creamware “Queen’s Ware,” linking its uniqueness and brilliance to the image
    of the Queen—in return for using her assent to gain credibility in the marketplace
    for fashionable goods. With the endorsement of Her Majesty, Queen Charlotte, the
    most influential individual during their time, Josiah had set a plan in motion
    that would lay the foundation of the world’s very first affordable luxury brand.
    In a stroke of marketing genius, Josiah immediately began advertising in local
    newspapers announcing that “Mr. Josiah Wedgwood has had the honor of being appointed
    Potter to Her Majesty.” promoting his new product line of Queen’s Ware.


    # Chaos ensues in London


    Shortly thereafter, Josiah opened an exclusive showroom in London where his work
    could be seen on display—to build additional hype by capitalizing on consumers’
    newfound aspiration to live like royalty.


    Brian Dolan writes:


    > The showroom caused a sensation. Carriages created a roadblock on Greek Street,
    in Soho, and spectators crowded around to catch a glimpse of the exhibition through
    the storefront windows as much as to gaze at Wedgwood’s aristocratic patrons,
    who included Queen Charlotte, the wife of King George III.


    Picture that.


    It’s 1774, and Wedgwood engineered the biggest product launch of his time, through
    the use of newspaper advertising, fame, and word of mouth. Let’s fast-forward
    to November 5, 2015, 240 years later.


    Olivier Rousteing, Creative Director of the French fashion house Balmain, sets
    out to collaborate with H&M to launch their Balmain x H&M Collection He teams
    up with Rihanna, Kylie Jenner, and Gigi Hadid to name a few, to build anticipation
    and hype on social media to their millions of followers. These are the Queen Charlotte’s
    of our time.'
  merge: -1
  img_proc: true

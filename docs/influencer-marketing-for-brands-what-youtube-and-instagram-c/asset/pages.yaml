- pgno: 106
  md: 'Core Concepts 1. The Theory of Constraints. 2. The 80-20-80-20 strategy. 3.
    1:1 relationships at scale. 4. Campaign participation rates. 5. A dynamic model
    for compensating creators.


    When the founder of the largest bookstore in the world recommends a read, it’s
    wise to pay attention. With a trillion dollar market cap², Jeff Bezos has built
    one of the largest and most complex companies on the planet and has come a long
    way since Amazon was “just” a bookstore. Bezos and his organization has managed
    to identify the biggest constraints in their operations and built a structure
    to get the most out of those constraints. The recommended read in question, business
    novel The Goal, was published by Eliyahu Goldratt in 1984 and is considered a
    bible by the team that built Amazon’s fulfillment network.³


    # Theory of Constraints


    The book is an introduction to the Theory of Constraints (TOC)—a management concept
    developed by Dr. Goldratt that aims to help companies and managers systematically
    focus efforts, energy, and attention on the constraints of a system. The constraint
    is typically a bottleneck that restricts output, preventing the organization to
    increase the flow of throughput which otherwise would yield better delivery to
    customers, less firefighting, reduced cycle times, conflicts between team members,
    additional capacity, or higher net profits.


    See where I’m going with this?


    TOC’s key processes are, in short, focused on removing barriers that prevent each
    part from working together as an integrated whole. And despite its name, the “Theory
    of Constraints” is not particularly theoretical. Rather, it helps find practical,
    effective solutions to challenges within businesses.


    This chapter is dedicated to eliminate the many bottlenecks that marketing organizations
    face when they attempt to scale their influencer marketing. I didn’t realize it
    at the time, but the approach my company has taken over the last couple of years,
    to help our clients scale their influencer marketing programs, closely resembles
    several key components within the Theory of Constraints. Especially its mean thesis—that
    rather than trying to reduce costs, TOC declares that the most powerful and sustainable
    method for'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'increased profit (and return on investment) is to increase your throughput.
    In Chapter 4: The Art and Science of Creativity, we covered the many aspects of
    identifying the right influencers for your brand and how to build a talent pool
    for your brand. Many of the concepts that we’ve already covered are built on the
    premise of increased throughput, and in this chapter, I’ll pull back the curtain
    further and show you a set of practical solutions that will help you and your
    organization knock out the bottlenecks that have been holding you back.


    # The 80-20-80-20 strategy


    A global survey from 2019, across more than 350 participating marketing teams,
    revealed that bandwidth and time restraints are almost as common of a challenge
    as finding the right influencers.⁴ Further, the same survey respondents expressed
    issues with both “managing contracts and deadlines” and “processing payments to
    influencers.” Ask any marketer with even the slightest of experience within our
    industry, and you’ll hear about their challenges with email communication, contract
    negotiation, content submission, content approvals, logistics, payments, regulations,
    payments, tracking links, promo codes, and reporting.


    What’s worse is that there’s another person on the other end, the creator, jumping
    through the same hoops. It’s a frustrating experience for all parties for a simple
    reason; it doesn’t create any *real* value. These things become a means to an
    end, consuming as much as 80% of your time, leaving you with just 20% of your
    time to relationship building, creativity, and strategy (Figure 6-1) components
    that, at the end of the day, will make 100% of the difference.


    ⁴ Relatable 2019 State of Influencer Marketing Report (www.relatable.me/the-state-of-influencer-marketing-2019)'
  merge: -1
  img_proc: true
- pgno: 108
  md: '![](img/7ec2733715193510646aec32cc18284f_108_0.png)


    Figure 6-1. 80% overhead, 20% value


    On the other hand, as time consuming and frustrating it may be, most marketing
    teams that are successful with their influencer marketing efforts have all seen
    the importance of building one-to-one relationships with the creators and influencers
    that they''re working with. It moves the value beyond being pure transactional
    and allows for you to be more creative and strategic. It would seem like the very
    thing essential to their success is also what''s holding them back. So, how do
    you increase your throughput (scale your influencer marketing with efficiency)
    when your constraint (building one-to-one relationships) is critical to your success?
    And the answer is you don''t. You get rid of everything else.


    Instead of spending 20% of your time on creating value and 80% on overhead, you''re
    getting yourself a position where you spend 80% of your time on the things that
    create value and 20% on the overhead (Figure 6-2). But how? Through workflows,
    technology, and system thinking. With the mindset of a savvy engineer, and a dash
    of inspiration from the Theory of Constraints, I''ll walk you through the shift
    you need to make to eliminate a tremendous amount of overhead, permanently. And
    know this—everything you''re about to learn has been thoroughly implemented and
    tested across thousands of collaborations, across hundreds of different brands,
    over the last 3 years. As such, I''m confident that the advice and suggestions
    not only works in theory, but more importantly in practice.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/7ec2733715193510646aec32cc18284f_109_0.png)


    Figure 6-2. 80% value, 20% overhead


    The best part? You''ll write zero lines of code, and should you happen to hold
    a PhD in mathematics or computer science, I''m afraid it''ll be of little use.


    # 1:1 relationships at scale, with 80% less work


    The end goal is threefold: First, reduce the time you have to spend on factors
    that contribute little or no value, as outlined in the preceding text. Second,
    use the time and resources toward relationship building (and consequently strategy
    and creativity). I''ll stress this—the goal is to increase the amount of time
    you spend on the factors that create the most value. Third, build systems (again,
    no coding or PhD required) that can allow for you to scale your throughput by
    10 or even 100 times from where you are today. If you''re just starting out, I
    understand that the thought of running an influencer marketing program with 100
    creators simultaneously may seem very distant, but know this: Your constraints
    (80% overhead) are best eliminated from day one. We follow the very same process,
    and operate within the same system, to run an influencer marketing program with
    5, 50, or 500 participants, and it all thanks to an approach we implemented years
    ago where workflows, technology, and system thinking were integral to our operations
    and execution. Because of this, 97 of 100 polled influencers highly recommend
    working with us and the brands we represent and frequently cite that it''s been
    the most smooth and pleasant experience they''ve ever had when collaborating with
    a brand.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Constrained by communication


    Email communication (in general and particular within the context of influencer
    marketing) is a real-time suck. Not only when you’re building your talent pool
    (as per Chapter 4: The Art and Science of Creativity) but especially since it’s
    a platform of communication that will touch most of the constraints that are holding
    you back—from outreach, briefing, negotiation, and onboarding. Luckily, it’s also
    where you’ll see high impact (return) with relatively low effort (investment).


    Good old-fashioned email is also a method of communication preferred by creators
    and influencers regardless of social media platform, country, or industry—as long
    as it’s used effectively.


    # Step 1: Set up a dedicated email address


    Time required: 5–10 minutes


    Effort: Low


    Impact: N/A (but an essential first step)


    The very first thing you need to do (to optimize the rest of the steps outlined
    in this chapter) is setting up a dedicated email address used only for communication
    with influencers. As easy and obvious as this may seem, it’s essential that you
    address this before moving on. A chain is, after all, no stronger than its weakest
    link.


    The email address should be from an actual person within your company that is
    responsible for communication, and it’s important that it’s used only for that
    purpose. My work email address is aron@relatable.me (say hello!), so I’d set up
    an additional one with another alias, like aron.levin@relatable.me (not my primary
    inbox!). You’ll see better open rates, click-through rates, and reply rates if
    you use a real name instead of an impersonal alias like hello@yourcompany.com
    or collaborations@yourcompany.com. Set up the name of the account to be your full
    name, and don’t forget to upload a profile picture.


    # DO PEOPLE EVEN READ EMAILS?


    Based on a dataset on emails sent to more than 100,000 influencers and content
    creators, I can assure you that it’s a very effective form of communication if
    used properly. The following benchmarks can help you check if you’re hitting the
    right notes.'

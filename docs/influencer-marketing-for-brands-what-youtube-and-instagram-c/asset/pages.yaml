    ways to portray the brand.

    +   - If aiming for content creation, creates a wide range of high-quality in-feed
    content to choose from.


    # Creative strategy 2: Story-Only Campaign


    Story-Only Campaigns deliver the brand message in a raw way without the polish
    of the feed posts, which for some brands is exactly what they are looking for.
    Also they allow for the most influencers for the budget.


    Example uses:


    +   - Demonstrating how influencers use the product

    +   - Driving click-through to a landing page

    +   - Creating a sneak-peak look of a new product

    +   - Promoting a live experience


    Key benefits:


    +   - Working with a range of people for the campaign offers a number of different
    ways to portray the brand.

    +   - Raw storytelling format can feel more authentic.

    +   - Click-through rates are significantly better than in-feed.


    Notable caveats:


    +   - Too many stories in a clip can cause audiences to swipe away.


    # Creative strategy 3: Pairing Feed Posts and Stories


    Mixing behind-the-scene story content with high-quality feed post content tells
    a fuller brand story.'

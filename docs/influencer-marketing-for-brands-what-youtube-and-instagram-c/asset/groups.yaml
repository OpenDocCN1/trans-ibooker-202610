  - '[PAGE 86]


    See, we don’t tell our friends about products and services we like. We talk about
    what’s greater than we could possibly imagine.


    “Did you see,” “have you heard,” “you won’t believe,” “check this out,” and “can
    you imagine” are what will make it to the dinner table. And that’s important when
    90% of all word of mouth happens offline.³¹


    If you can turn your campaign, brand, product, or service (and often just ONE
    aspect of the aforementioned) into a dinner table topic because it exceeds expectations,
    you’ll see explosive growth through word of mouth. And here’s how you do exactly
    that.


    # Amplifying a dialog that’s already taking place


    The key to exceed the expectation of your customers—at its very core—comes down
    to figuring out exactly what it is that your consumers are saying about you (that
    their friends in turn are sharing with their friends) and amplify that message.


    Once you understand the word-of-mouth loop, you’ll understand the where, how,
    and why of how you can turn product marketing into word of mouth.


    Pepsi Max applied this principle in one of their influencer marketing campaigns
    in 2017 where each participant shared the surprisingly great combination of Pepsi
    and Ginger—and how it exceeded their expectations. A bold promise that turned
    out to resonate well (Principle #7) with those fond of Pepsi Max and the taste
    of ginger (Principle #6).


    Going back to my firsthand experience at Spotify, I’d like to share a method I
    used to reverse-engineer this seventh principle.


    Now, it should be noted that there are certain things I can disclose and others
    that I can’t, but it should come to little surprise that the growth of both a
    subscription business like Spotify and a game publishing company like King Digital
    Entertainment isn’t exactly random.


    What’s incredibly powerful though, and what I urge you to do for your brand, product,
    or service, is to dive into the qualitative and quantitative aspect of what drives
    word of mouth to understand how it can be applied for either your core product,
    service, or brand or to the development of a specific campaigns, product launch,
    repositioning, or when tapping into a new target segment or market.


    Back in 2014, for instance, a large proportion of the user growth at Spotify was
    driven by word of mouth—and while it’s possible to track referrals and'
  - '[PAGE 87]


    traffic sources, it’s even more powerful to ask your users why they bought your
    product, subscribed to your service, or downloaded your app.

    You’ll want to go beyond where the users or customers are coming from and understand
    the how and the why.


    # How to pinpoint what’s driving your organic growth


    Get yourself setup with a survey platform like SurveyMonkey³² or Typeform³³ and
    send out an email to users or customers that have purchased your product in the
    last 30 days.


    The email should be short and to the point, and answer why you’re running the
    survey and what the benefit it holds for the survey taker (e.g., improve their
    experience or make it more relevant and aligned with their expectations).


    Your first step is to figure out where your customers are coming from. Three examples
    for the first question:


    +   1. “What made you sign up for our service?”

    +   2. “What made you purchase our product?”

    +   3. “What made you download our app?”


    List the most common referral sources and have the survey respondents pick a primary
    one. A few examples (adjust to fit your product):


    +   1. I saw an ad for your product.

    +   2. A friend recommended your product.

    +   3. I found you on Google.

    +   4. I read about you in the news.

    +   5. Other (short-form answer in text).


    You’ll want to include the fifth option here if this is the first time you’re
    running this kind of survey to learn if there’s a referral source you’re missing
    (or phrasing your options in a different way than how they are perceived in the
    mind of the consumer).


    Don’t worry though, your goal isn’t to build a reliable or scientific attribution
    model. Your goal is to identify how users perceive their discovery and first experience
    with your product.'

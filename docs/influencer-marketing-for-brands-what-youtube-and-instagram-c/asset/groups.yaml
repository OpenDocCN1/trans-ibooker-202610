    ## Word of mouth


    What do SpaceX, Bitcoin, Spotify, Uber, Slack, Flappy Bird (You do remember Flappy
    Bird, right?), and Amazon Prime all have in common?


    Incredible growth—driven primarily by word of mouth.


    Their users, customers, loyal fans, and their brand ambassadors can’t seem to

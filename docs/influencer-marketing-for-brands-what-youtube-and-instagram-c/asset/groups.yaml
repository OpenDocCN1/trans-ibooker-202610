    locations, so the content is extremely authentic.


    # Creative strategy 11: Swipe-Up Lead Generation


    The main KPIs for Instagram campaigns are typically reach and engagement, rather
    than direct sales. However, it''s possible to set up campaigns to feed another
    portion of the marketing funnel and measure success through the cost per lead
    and the cost difference of influencer-referred leads and those targeted by other
    means.



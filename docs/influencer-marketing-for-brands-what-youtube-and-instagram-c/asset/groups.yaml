  - '[PAGE 78]


    I know what you might be from brands and marketing professionals when they see
    this is that the brief is too detailed, too long. Nobody will read it, and so
    on. First, that’s wrong. I’ve witnessed firsthand how this template has been used
    across thousands of collaborations. Secondly, creators frequently express how
    thankful they are for getting their questions answered upfront, with full clarity.
    Why? It answers each of the 17 questions, in a structured, easy-to-read, format.


    Remember, you can include additional information about your product and detailed
    do’s and don’ts for you campaign, once someone has confirmed that they want to
    work with you; just make sure that the scope of the campaign remain the same.


    # The YouTube creator’s creative brief


    YouTube has, in their official brand and creator guidelines, published a six-step
    guide to writing an effective creator’s creative brief, available on their website.¹³
    They recommend that brands include the following essential elements: Objective,
    Insight, Style and Messaging, Deliverables, Inclusions, and Creative Control.


    # Objective


    What is the purpose of the campaign and what are you hoping to achieve? Key considerations
    in this first element include your challenges, goals, and insights used to inform
    the strategy. YouTube suggests that you’re as clear and specific as possible and
    focus on the role the creator will play in the overall campaign. Further, it helps
    to provide competitive benchmarks and define which metrics you will use to determine
    if the campaign is successful.


    # Insight


    What key insight can you provide so that the creator can develop a compelling
    storyline for their video? If possible, include insights, data, market, or consumer
    insights, who your brand is specifically trying to reach.


    # Style and messaging


    What is the personality of your brand? Are there talking points, key messaging,
    phrasing, or words that you’d want the creator to include in their video? This
    element of the brief will help ensure brand consistency.'

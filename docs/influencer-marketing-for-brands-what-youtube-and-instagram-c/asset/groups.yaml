    # Chapter 2 | People Are Media Companies


    **Key Questions**  What’s the current state of the advertising industry? How is
    traditional advertising perceived by millennials and Generation Z (Gen Z)? Why
    are media dollars moving from traditional publishers to people? What is the future
    of the influencer marketing industry?


    **Core Principles**  1. Media dollars follow attention. 2. Democracy decentralized
    attention. 3. Knowledge is a commodity. 4. Creativity is the only gatekeeper.


    In 2019, the world will spend more than 700 billion dollars on advertising. What
    surprised me when I first heard this number was the split between digital and
    analog advertising. Can you guess how much of the 700 billion dollars that will
    be spent on digital advertising? At this point in time, I would have assumed the
    number to be an overwhelmingly majority. But the number sits at just 40%.² What’s
    more is that just 10 years earlier, the number was just 10%. It’s estimated to
    hit the 50% threshold by 2021.


    Meanwhile, TV, radio, print, and magazine advertising is, to little surprise,
    on the decline.


    Where’s all that money going, you may ask?


    Two-thirds³ of digital advertising budgets will be spent on mobile advertising.
    Here’s where it gets really interesting and at the same time really challenging,
    because when measuring how much time consumers spend in the mobile browser (i.e.,
    browsing websites on their smartphones in Safari, Chrome, or their favorite browser),
    the number is only around 6%, just 12 minutes out of 3.5 hours. So, the money
    is moving from analog to digital, from desktop to mobile, but *not* to the mobile
    Web, because that’s not where consumers are. Goodbye, programmatic display banners,
    homepage takeovers, and rich media formats. This form of advertising was probably
    never built for a mobile experience, anyway.


    On top of this, half of *millennials* now block traditional ads, while 70% of
    Gen Z are likely to avoid them altogether.⁴ Leading market research company eMarketer
    has published several reports on the topic, diving deeper into what’s driving
    the rapidly growing disapproval of traditional digital advertising—and the insights
    should have any traditional advertiser worried about their future.


    An overwhelming majority of consumers find traditional ads to be annoying, intrusive
    or disrupt what they’re currently doing.


    ² Publicis Groupe’s Zenith Advertising Expenditure Forecasts, December 2018

    ³ Digital Ad Spending Share, by Device, eMarketer, February 2019/Total Media Ad
    Spending, By Media, 2016–2022, eMarketer, September 2018

    ⁴ AdReaction: Engaging Gen X, Y and Z, Kantar Millward Brown, 2017'
  - '[PAGE 19]


    In a study from mid-2018, where respondents were asked what their main opinion
    on digital ads was, 42% of respondents said that they were “Too aggressive in
    following me on every device or browser.”⁵


    Around the same time, IAB UK (the industry organization for digital advertising
    and media owners, agencies, and brands) commissioned YouGov to conduct a study
    on consumer usage and attitude toward ad blocking. They asked the following question:


    > Which situations would make ad blocking users in Great Britain less likely to
    use ad blockers?


    Respondents were given multiple options, and while most claimed that less interruptive,
    annoying, and simply less advertising would have them reconsider their decision
    to block advertising on their devices, a full 81% answered none of the above from
    a list of eleven different options.


    There was absolutely nothing that would persuade them to change their minds about
    their decision to block advertising.


    Key takeaway Media dollars (advertising) are moving to platforms (smartphones)
    where there’s less traditional advertising inventory (mobile browser) while consumers
    are making matters worse (ad blockers).


    Finally, as I was researching the rise of ad blockers, I found another gem too
    good not to share. This one’s for kicks and giggles.


    In a 2018 survey⁶ of 103 ad agencies, publishers, and marketers in the United
    States conducted by Pressboard, 27.2% of respondents said they use an ad blocker.
    Meanwhile, according to eMarketer forecasts, the average ad blocker usage across
    the general population the same year was 25.2%.


    I’m not surprised, but it’s rather ironic.


    > “Eating your own dog food” is a commonly used phrase within tech companies that
    refers to the practice of using your own products.


    In the traditional advertising industry, however, the consensus seems to be that
    the stuff you feed your pets with should be kept at a safe distance. Someone should
    send those advertising executives to the doghouse.'
  - '[PAGE 20]


    Canine metaphors aside, Pressboard’s research further revealed that advertising
    professionals are more likely to rely on their friends than on ads when they decide
    whether or not to purchase a product. Nearly eight in ten respondents (78.6%)
    said that word of mouth from friends influenced their recent purchase decision.


    # Meteors fall to Earth all the time


    66 million years ago, an asteroid the size of a mountain traveling at 64,000 kilometers
    per hour collided with planet Earth. We all know what happened next. I’d like
    to pretend that the dinosaurs looked up at the sky earlier that day only to discard
    the distant asteroid as yet another meteoroid space-rock moving through our solar
    system at a safe distance.


    Or perhaps another shooting star unlikely to survive a trip through the atmosphere.
    Meteors do, after all, fall to Earth all the time.


    But minutes later, an explosive yield estimated at more than 100 trillion tons
    of TNT would wipe out 80% of life on Earth—including most of those dinosaurs.
    The seismic event that followed would be the equivalent to every earthquake that
    ever happened in history, all at the same time. Those close enough to observe
    the giant fireball, and unfit to survive, were first to go, and only one in five
    would survive what scientists today reference as the final of the five big mass
    extinction events. When faced with an existential threat, it’s easy to think that
    you are the exception to the rule and that things will be okay.


    But look no further than Blockbuster, Kodak, RadioShack, or Toys “R” Us to see
    what happens when you’re too slow to adapt or you think that you’re an exception
    to the rule. When Blockbuster finally went bust, analysts said that the Internet,
    on-demand streaming, and consumer behavior were to blame. But those are macro
    trends that inevitably changed their marketing conditions—and if you are to remain
    and thrive as a business, you have to adapt. Resist, or even hesitate, and you’ll
    eventually have no option but to suffer from the consequences. In the case of
    the iconic video rental chain, they simply couldn’t pay their late penalty fees
    and had no option but to file for bankruptcy.


    Analysts are perhaps right to blame disruptive companies like Netflix for what
    happened, but it’s more likely that Blockbuster sent itself into a death spiral
    long before consumers asked to stream their movies on demand. In early 2000, Reed
    Hastings (the founder of Netflix) flew to Dallas to meet with Blockbuster CEO
    John Antioco. He proposed that Netflix would run Blockbuster’s brand online in
    exchange for in-store promotion across its 9,000 locations. Their response? Hastings
    got laughed out of the room.'
  - '[PAGE 21]


    John Antioco and his leadership team had been made fully aware of the Asteroid,
    but it was quickly dismissed as yet another shooting star. Don’t be a meteor-gazing
    dinosaur on doomsday.


    # A glass half full


    While the advertising industry is knee-deep in trouble, it’s not just doom and
    gloom. There’s another side to the story. A 2017 study from Kantar Millward Brown
    found that 77% of both Generation Z (born 1996 or later) and millennials (born
    between 1981 and 1995) are positive to ads that show real people in real settings.
    Both segments also had more positive attitudes toward selected types of branded
    digital content: tutorials, social media feeds, sponsored events, advertorial,
    and other types of sponsored content. The study found that Generation Z members
    were not as interested in ads that featured celebrities, but receptive to ads
    that told an interesting story (56%), with humor (72%) and great music (58%).


    See, consumers, especially Generation Z and millennials (two segments that brands
    can’t seem to figure out), actually have a really positive sentiment toward advertising
    that understands their point of view—and when you achieve that, you have the opportunity
    to win big.


    In fact, when consumer insights company Toluna Group interviewed 898 consumers
    (for their 2019 D2C Survey) that recently had purchased a product online from
    a direct-to-consumer brand, they found that 34.6% first discovered the brand through
    an ad on social media.


    And finally, a full 44.7% of US Internet users between ages 18 and 34 say that
    they have bought a product/service recommended by an online influencer on YouTube
    or Instagram.


    In 2019, for the first time, US consumers will spend more time with their mobile
    devices than they do watching TV, more than 3.5 hours per day, on average. And
    while most of Gen Z or millennials won’t sit through a 30-second ad, they’ll happily
    spend 40 minutes, on average, each time they browse YouTube on their smartphones.
    It’s noteworthy that digital audio now accounts for the biggest share of time
    spent, with social media and digital video following. We listen to podcasts while
    browsing Instagram and Facebook or watch videos on YouTube to be entertained,
    learn new things, and solve problems.


    ⁷ AdReaction: Engaging Gen X, Y and Z, Kantar Millward Brown, 2017

    ⁸ Toluna, “D2C Survey,” March 6, 2019

    ⁹ Clever Real Estate, “Marketing to Millennials in 2019”

    ¹⁰ “US Time Spent with Mobile” report, eMarketer, May 2019'

    主要优势：


    - 网红营销在生成品牌内容方面已经是一种极具成本效益的方式。当内容已经制作完成并受到受众欢迎后，将其用于更广泛的受众自然是顺理成章的。


    ## 创意策略 14：将网红作为出镜人才


    时尚和生活方式领域的网红已经拥有定义时代潮流的造型。在制作品牌自有内容时，将网红用作出镜人才，不仅能让您获得镜头前表现力出色的人才，还能借助网红在谈论拍摄过程时带来的传播力。这是我们尚未尝试过的做法；不过，这是一个很有吸引力的想法。


    应用示例：


    - 在电视广告或社交媒体拍摄中选用前景或背景人才

    - 安排摄制组在网红参与品牌体验等其他活动时对其进行拍摄


    主要优势：


    - 可以通过合同约束网红发布关于拍摄的内容（尽管许多网红会自发发布）。

    - 网红的粉丝会希望看到品牌内容，以便在其中找到自己喜爱的网红。


    ## 创意策略评分卡


    如您所见，每种创意执行和营销活动类型都有各自的优势、应用示例，有时甚至还有不足之处。为了理清头绪，您可以根据它们的不同特征，结合特定品牌的环境或条件或您独特的营销活动目标，按相关性顺序对其不同优势进行排名。图
    4-1 展示了一张评分卡。


    | | A. 您是否正在推出新产品？ | B. 您是否希望将网红营销整合到更大的品牌营销活动中？ | C. 您是否正在策划品牌体验或活动？ | D. 您是否在
    Facebook 上投放广告？ | E. 您是否会赞助或整合营销与当下文化相关的事件，例如节日或特定地点活动？ | F. 您的产品/服务是否依赖于特定地点的可用性（例如零售店、健身房、活动）？
    | G. 您对网红筛选是否有非常具体的标准，以至于历来很难识别潜在人才，或者您认为情况会如此？ | H. 您是否在线直接向消费者销售产品？ | I. 您现有营销中是否有很大一部分是由自然口碑驱动的？
    | J. 您是网红营销新手吗？ | K. 您的产品是 App Store 或 Google Play 上的应用吗？ | L. 您的产品是否复杂，或需要深度叙事才能被欣赏或理解？
    |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|

    | 1. 单篇信息流帖子营销活动 | > | > | | | | > | > | | | | > | > |

    | 2. 仅快拍营销活动 | > | > | | > | > | > | > | | | > | | > |

    | 3. 信息流帖子与快拍搭配 | > | > | | > | > | | > | > | | > | | > |

    | 4. 多帖营销活动（大使合作） | | | | | | | > | | > | | | |

    | 5. 放大品牌体验 | > | > | | > | | | | | | | | |

    | 6. 爆发式营销活动 | > | > | | | | | | > | > | | | |

    | 7. 直播以获取最大真实感 | | > | | | | > | | | | | | > |

    | 8. 支持主力品牌营销活动 | > | | | | | | | | | | | |

    | 9. 通过投票推动用户考量 | > | | | | | | | | | | | > |

    | 10. 超本地营销活动 | | > | | > | > | | | | | | | |

    | 11. 向上滑动引导获客 | | | | | | | | > | | | > | |

    | 12. 实时招聘 | | | | > | | | | | | | | |

    | 13. 为广告制作内容 | | | > | | | | | > | | | > |

    | 14. 将网红作为出镜人才 | | | | | | > | | | | | | |


    ### 图 4-1. 创意策略评分卡


    如您所见，不同的问项（A–L）现在已映射到适用的创意执行方式。


    假设您正在推出新产品（问项 A）。如果答案是肯定的，那么爆发式营销活动（列表中的 #6）、投票（#9）和单篇信息流帖子（#1）通常都会是相关的创意策略。您的产品是否复杂，是否需要深度叙事才能被充分理解（问项
    M）？那么，仅快拍营销活动（#2）、信息流帖子与快拍搭配（#3）、直播以获取最大真实感（#7）以及通过投票推动用户考量（#9）都将适用。


    我非常鼓励使用评分卡来评估每个适用策略的相关性水平。您还可以使用一个免费的在线工具²，它将帮助您评估每个策略，同时提供印刷图表的高分辨率版本。³


    ## YouTube 上九种行之有效的创意执行方式


    YouTube 和 Google 已经发布了他们自己的官方指南和建议⁴，概述了九种不同的、行之有效的创意执行方式，供品牌与他们视频平台上数百万才华横溢的创作者合作时使用。


    在 YouTube 上，品牌、创作者及其经纪人或代理商通常会区分专题视频和植入视频。专题视频是创作者与品牌之间的品牌合作，您的产品或服务是视频中唯一被展示的内容。示例包括教程、开箱、穿搭指南、品牌叙事、产品演示或短剧。植入视频会提及您的品牌，但也会展示其他内容、产品或品牌。使用示例包括购物分享、⁵
    最爱产品、开箱或与上下文相关的品牌提及/口头推荐。


    让我们来看看 YouTube 上九种常见的内容创作类型，以及如何利用它们来建立品牌与创作者之间的合作。


    以 YouTuber iTwe4kz 将耳机制造商 KANOA 推向破产为例。¹⁰ 该公司据称试图贿赂 Cody（即 iTwe4kz）以获得正面报道，而他对此的回应是向他的
    60 万订阅者发布了一段长达 27 分钟的毫不留情的视频。¹¹


    在与这位知名科技评测 YouTuber 的合作中，KANOA 寄了一副耳机给这位科技 YouTuber 进行评测，但他收到的耳机无法使用，于是他联系对方要求寄一副新的。你会想，这很合理吧。然而，他们非但没有答应，反而提出支付他
    500 美元换取一篇正面评测。他没有接受这个提议，反而被这一提议激怒了：


    > 你想让我拿自己的诚信冒险，就为了让你卖掉这些破玩意儿（耳机）？你在开玩笑吗？五百美元？不，你不能给我五百美元然后我就发一篇好评。这就是垃圾！


    请注意，问题不在于合作、报酬，甚至也不在于产品有缺陷，而在于缺乏透明度和真实性。消费者期望品牌与创作者合作，也期望创作者展示他们的产品——但请记住他们最初关注这些频道的原因：


    因为他们相信他们的观点。要求对一款无法正常工作的产品给出诚实评测，那么你得到的就会是你所要求的。


    ## 穿搭指南


    穿搭指南（Lookbook）是一种风格化的视频，创作者在其中展示来自同一品牌的多个产品——通常属于时尚、服装和彩妆领域。将您的合作融入即将到来的相关文化日历事件和主题，例如返校季、春季或秋季。或者，您也可以将穿搭指南视频的主题定为特定受众或场景，例如职场、大码或约会之夜。所有这些例子都来自
    YouTube 上最热门的搜索建议——这是一种有助于生成更有可能引起特定受众共鸣的视频创意的策略。这种方法还有另一个好处，即 YouTube 创作者非常重视能够引起他们受众共鸣的视频创意，并且更倾向于与那些深刻理解如何吸引新老订阅者的品牌合作。


    ## 梗与喜剧短剧


    “梗”（meme）一词最初由英国科学家理查德·道金斯在其 1976 年出版的《自私的基因》一书中提出，定义为“文化传播的单位”。¹²


    他写道：“梗（知识、八卦、笑话等的离散单位）之于文化，就像基因之于生命。正如生物进化是由基因库中最适基因的生存所驱动，文化进化可能是由最成功的梗所驱动的。”


    如今，梗通常指那些在社交媒体和网络上像病毒一样被复制和传播的有趣图片、视频或动图，往往带有细微变化——但这个词的起源实际上来自希腊语 mimēma，意为“被模仿之物”。


    当然，当您想到梗时，会想到暴躁猫、瑞克摇和成功小孩。但梗的概念——对文化中相关观念的模仿——也可以作为创意策略的核心基础。这不同于制作一个“病毒式传播”的视频（顺便说一句，那是一个愚蠢的策略），而是要在文化中流行的东西上构建，或者以不同的变化形式复制，并取得不同程度的成功。


    例如，2016 年，健身行业的几位 YouTuber 加入了“10,000 卡路里挑战”。顾名思义，这一挑战涉及记录摄入推荐每日卡路里量 5 倍的过程。在
    YouTube 上搜索这个词，您会发现成千上万的视频，总观看量达数百万，整个创作者群体都在互相模仿，这为品牌创造了明确的机会，既可以制作植入视频，也可以制作专题视频，参与文化的传播。


    创意概念也可以被设计成允许模仿的形式。2018 年，直达消费者品牌 BURST Oral Care 首次与科勒·卡戴珊合作，在 Instagram 上发布了一系列快拍和视频，展示其电动牙刷的效果。但她并没有刷牙，而是用一根裹满咖啡渣的玉米棒来演示产品。


    当您看到科勒·卡戴珊、克莉丝·泰根或此后参与“Burst 玉米挑战”的众多名人和 YouTuber 的视频缩略图时，他们拿着牙刷和裹满咖啡的玉米棒摆姿势，您不禁会好奇发生了什么。一个可以被反复复制和模仿的创意概念，一项始于品牌合作的挑战，此后已被客户和其他
    YouTuber 自发复制传播。


    '

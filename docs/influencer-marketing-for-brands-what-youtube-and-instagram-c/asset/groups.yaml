    # Chapter 5 | Creator-Centric Strategies


    ![](img/7ec2733715193510646aec32cc18284f_98_0.png)


    **Figure 5-1.** What do influencers care about most when deciding which brands
    to work with?


    The study from influencer marketing firm AspireIQ found, surveying 200 influencers
    on their platform, that personal brand alignment (72% of respondents) was more
    important than financial compensation, brand recognition, and the value of free
    products combined. This insight is mirrored by the 2020 Influencer Wellness Report
    published by my own company—where we found *aligned core values* to be the number
    one deciding factor on deciding to partner with a brand. See Table 5-1.


    **Table 5-1.** Deciding factors, brand collaboration


    | Factor | Respondents |

    |---|---:|

    | How much they pay | 14% |

    | That I know their product/service works | 27% |

    | That I have heard of their brand before | 3% |

    | That their core values are aligned with mine | 34% |

    | That they give me creative freedom | 23% |


    Independent of each other, both studies reveal another interesting insight: *Your
    brand values are more important than how well known you are.* Just 4% in the survey
    by AspireIQ and 3% in the 2020 Influencer Wellness Report. This is great news'

    显然，你的总体预算和行业平均费率也会在决定你付给合作者多少报酬方面发挥关键作用。¹⁰ 一张费率卡或一套计算公式，用来确定你在营销活动中合作的创作者应得的报酬，将成为重要的基石，减少你在每一次合作和对话中从零开始谈判的必要性。此外，报酬也是对方决定是否愿意与你合作的重要考量因素，因此，你最好尽可能早地、主动地保持透明。


    提出一个预算建议，而不是去谈判一个预算。这样，你的合作对象可以选择接受或拒绝你的建议。一旦你有了计算公式，就可以用 Numbers、Excel 或 Google
    Sheets 制作一个简单的电子表格，自动计算报酬。表 6-1 使用了前面的示例 1。


    ## 表 6-1：计算报酬的动态模型


    |   | A | B | C |

    |---|---|---|---|

    | 1 | Instagram | 粉丝数 | 报酬 |

    | 2 | CreatorA | 100,000 | =sum(B2/1000*30) |

    | 3 | CreatorB | 50,000 | =sum(B3/1000*30) |


    如你所见，这些条目可以复制成成百上千行，而你无需额外工作。


    ## 不要过少，也不要过多


    就像雇主招聘新员工一样，如果工资太低，你吸引不到具备合适技能的人才。虽说市场上肯定存在长尾人才（如前几章所述），但供应并非无限。如果建议的报酬太低，你会发现没有创作者或网红愿意与你的品牌合作。反过来，支付超出必要的报酬显然也不明智。


    > ¹⁰本节不会讨论这些费率是多少，或者如何为你的整个营销活动制定媒介计划，而是聚焦于一种必要转变，以确保围绕报酬的谈判或讨论不会成为制约因素。


    那么，你该如何让自己在这两者之间取得平衡呢？


    在我们机构内部，我们以*营销活动参与率*为优化目标。创作者会根据报酬以外的其他因素接受或拒绝合作，但过去几年里，这一指标已成为我们很好的代理指标。公式很简单：


    ### 计算你的参与率


    [接受你提议的创作者数量] / [你联系的创作者数量]


    大约 15%–25% 是一个很好的基准。低于 15%，你就会遇到约束。超过 25%，你很可能支付了过高的报酬。请记住第 5 章“以创作者为中心的策略”中的这张表（出自“创作者想要什么：品牌合作的决定因素”一节）。


    ## 表 6-2：品牌合作的决定因素


    | 因素 | 受访者占比 |

    |---|---|

    | 报酬高低 | 14% |

    | 我知道他们的产品/服务有效 | 27% |

    | 我之前听说过他们的品牌 | 3% |

    | 他们的核心价值观与我的相符 | 34% |

    | 他们给我创作自由 | 23% |


    很明显，还有其他决定因素会影响你的参与率——有些比*支付多少报酬*更重要。考虑到这一点，如果你发现虽然支付的报酬合理，但参与率仍然很低，请确保你已经处理了表中列出的其他因素。反过来也一样：如果你们的价值观一致，有创作自由，你也证明了自己拥有出色的产品，那么你很可能降低报酬，同时仍能维持不错的参与率。


    ## 第 5 步：启动引擎


    *所需时间：几小时*


    *投入：中等*


    *影响：高*


    这一切都在为这一刻做准备。我们已经设置了一个专用电子邮件地址，作为单一联系点；实施了一套系统，以便与多人并行高效对话；并处理了常见问题，以缩短周期、建立更好的
    1:1 关系。你已拥有计算报酬的数学公式（五年级数学水平），并依赖参与率而非逐一个体谈判。


    如果你跳过了其中任何一步，一旦你开始提高吞吐量，整个工作流就会崩溃。这就是约束理论（Theory of Constraints）的运作方式——无论在理论上还是实践中都是如此。


    还记得第 4 章“创意的艺术与科学”中关于人才库的练习吗？同时将一百人引入一项营销活动、大使计划或人才库，可能看起来令人生畏——但正如承诺的那样，我现在将引导你完成所需的步骤，让你不费吹灰之力就能实现目标。就像客户服务类比和
    Intercom 一样，我们将使用两个你的组织中很可能已经存在的工具（95% 左右的概率）：电子表格和电子邮件营销。你可能听说过 MailChimp¹¹、Sendgrid¹²
    或 Drip¹³ 等邮件服务平台。我个人曾大量使用过这三家，并且都推荐。和 Intercom 的情况一样，我建议你使用一个独立的账户或服务，不要和你平时用于与客户沟通或其他相关邮件营销活动的账户混在一起。


    你对上述这类电子邮件营销平台的经验可能各不相同，因此本步骤的某些部分要么看起来非常简单，要么非常复杂，具体取决于你的经验。不过别担心——只要牢记最终目标：我们想要实现的转变，是让你不再一个接一个地联系网红和创作者，同时建立更牢固的
    1:1 关系。


    接下来，你需要一个电子表格软件（如 Numbers、Excel 或 Google Sheets），以及前面提到的某一家电子邮件营销服务的账户。在下面的分步说明中，我们将使用
    Google Sheets 和 MailChimp，让你只需按下一个按钮，就能联系 500 位创作者。请注意，这个数字可以是 50 或 5,000。同样的步骤，同样的工作流，没有任何限制。准备好了吗？


    ### 第 1 步：创建表格


    首先打开一个空白电子表格。你的表格将为每位创作者保留一行，并为我们需要在电子邮件中包含的每个变量保留一列（表 6-3）。列数没有限制——但我们会保持简单，只使用这六个必要的列。


    ## 表 6-3：创作者示例表


    | ID | Instagram | 名字 | 邮箱 | 粉丝数 | 报酬 |

    |---|---|---|---|---|---|

    |  |  |  |  |  |  |


    为了清晰起见，我在表 6-4 中列出了每一列的简要说明，并附带一行示例。


    ## 表 6-4：含各列说明的示例表


    | ID | Instagram | 名字 | 邮箱 | 粉丝数 | 报酬 |

    |---|---|---|---|---|---|

    | 唯一的数字标识符，每新增一行就递增 | 创作者的 Instagram 用户名，不包含任何其他字符 | 你联系对象的名字 | 电子邮件地址 | 我加入这一列是为了展示如何利用之前的例子自动计算报酬
    | 你将为这次合作、网红营销活动或项目向创作者支付的金额 |

    | 1 | aronlevin | Aron | aron@relatable.me | 20,000 | $1,000 |


    你的第一步就是在这张表中填入你想要联系的创作者或网红。我在表 6-5 中填入了三个虚构的用户名。


    ## 表 6-5：已填充数据的示例表


    | ID | Instagram | 名字 | 邮箱 | 粉丝数 | 报酬* |

    |---|---|---|---|---|---|

    | 1 | aronlevin | Aron | aron@relatable.me | 50,000 | $5,000 |

    | 2 | janedoe | Jane | jane@example.com | 100,000 | $10,000 |

    | 3 | johndoe | John | joe@example.com | 75,000 | $7,500 |


    > 注意：如需了解如何自动计算此数值的示例，请返回上一节。上表使用三个虚构示例仅作演示之用。

    '

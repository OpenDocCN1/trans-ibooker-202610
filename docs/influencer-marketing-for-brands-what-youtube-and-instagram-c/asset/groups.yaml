  - "[PAGE 83]\n\nThe other benefit of an easy-to-talk-about concept, idea, product,\
    \ or experience is how it ultimately shortens the viral cycle time. Much has been\
    \ written about virality so I won’t go into great depth on the subject, but “viral\
    \ cycle time” is essentially the time it takes from the second your message is\
    \ received by somebody until that person spreads the word to the next person.\n\
    \nThe shorter the viral cycle time, the quicker it spreads.\n\n# Principle 3.\
    \ Feel good to share\n\nI recently discovered an article from 1966 in the Harvard\
    \ Business Review by Ernest Dichter. In the 52-year-old article, titled “How Word-of-Mouth\
    \ Advertising Works,” the American psychologist and marketing expert, known as\
    \ the father of motivational research, outlined the findings from his research\
    \ uncovering that a person is more likely to talk about a brand if he “gets something\
    \ out of it.”\n\nBut how does this connect to why we’re sharing what feels good\
    \ to share?\n\nHis research revealed that we receive self-satisfaction from spreading\
    \ what feels good to share specifically from the point of view of confirming our\
    \ ownership and joy of the product, service, or experience—and more specifically\
    \ our discovery of it. Think no further than back to a recent experience at a\
    \ restaurant, concert, or vacation that made you feel really good and how you\
    \ came back from the experience and immediately told your friends about it. It\
    \ helped you relive and receive the lovely feeling you felt at that time, and\
    \ it made the other person feel good, too.\n\n# Principle 4. Evoke a sense that\
    \ the world is an amazing place\n\n> There are a lot of negative things in the\
    \ world—a lot of terrible things happening all the time, lots of problems that\
    \ need to get solved—but life cannot just be about solving one miserable problem\
    \ after another. There needs to be things that inspire you, that make you glad\
    \ to wake up in the morning and be part of humanity…\n> \n> —Elon Musk\n\nIdeas\
    \ that successfully evoke the sense that the world is an amazing place—especially\
    \ brands, services, and products that are doing well—tend to evoke precisely these\
    \ feelings. This also extends to people on both small and grand scale."

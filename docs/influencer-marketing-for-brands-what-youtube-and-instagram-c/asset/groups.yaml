  - '[PAGE 110]


    # Constrained by communication


    Email communication (in general and particular within the context of influencer
    marketing) is a real-time suck. Not only when you’re building your talent pool
    (as per Chapter 4: The Art and Science of Creativity) but especially since it’s
    a platform of communication that will touch most of the constraints that are holding
    you back—from outreach, briefing, negotiation, and onboarding. Luckily, it’s also
    where you’ll see high impact (return) with relatively low effort (investment).


    Good old-fashioned email is also a method of communication preferred by creators
    and influencers regardless of social media platform, country, or industry—as long
    as it’s used effectively.


    # Step 1: Set up a dedicated email address


    Time required: 5–10 minutes


    Effort: Low


    Impact: N/A (but an essential first step)


    The very first thing you need to do (to optimize the rest of the steps outlined
    in this chapter) is setting up a dedicated email address used only for communication
    with influencers. As easy and obvious as this may seem, it’s essential that you
    address this before moving on. A chain is, after all, no stronger than its weakest
    link.


    The email address should be from an actual person within your company that is
    responsible for communication, and it’s important that it’s used only for that
    purpose. My work email address is aron@relatable.me (say hello!), so I’d set up
    an additional one with another alias, like aron.levin@relatable.me (not my primary
    inbox!). You’ll see better open rates, click-through rates, and reply rates if
    you use a real name instead of an impersonal alias like hello@yourcompany.com
    or collaborations@yourcompany.com. Set up the name of the account to be your full
    name, and don’t forget to upload a profile picture.


    # DO PEOPLE EVEN READ EMAILS?


    Based on a dataset on emails sent to more than 100,000 influencers and content
    creators, I can assure you that it’s a very effective form of communication if
    used properly. The following benchmarks can help you check if you’re hitting the
    right notes.'

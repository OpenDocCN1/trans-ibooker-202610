    ## Chapter 4 | The Art and Science of Creativity


    Now, what you’ll want to do is take all users that picked Option #2 (Friend recommendation)
    and follow up with questions that will get you to understand the how and the why.
    Again, you’ll ask three questions (phrase them so that they make sense for your
    specific business):


    Remember, these questions are only asked on the condition that the answer to “A
    friend recommended your product” is true.


    1. What did your friend/friends say that made you buy our product/install our
    app/visit our store (etc.)?

    2. On a scale of 1–10, how likely are you to recommend our service/product/brand
    to someone you know?

    3. How would you describe our service to your friends?


    What you’ll discover when you run this type of survey to your customers is absolutely
    mind-blowing.


    The first question is the most powerful of all, as it will reveal exactly how
    your product is perceived in the market. You’ll have to analyze each response
    individually and look for recurring themes and keywords. Pay attention to the
    answers. This can feel like a daunting and time-consuming task…but take the time,
    and you’ll instantly know more about your customers than anyone on the planet.


    You’ll discover what promises your customers are making to their friends, and
    by following up with the second question, you’ll see if the promise is fulfilled
    or not. These are the conversations that are taking place around dinner tables,
    in emails, over coffee, at schools, workplaces, and on the morning commute—whether
    you like it or not. If you’re seeing a large proportion of your growth coming
    from friend referrals and many of the referrals are expressing that they’d recommend
    your service to their friends, you’re on the right track. The third and final
    question will help you understand what parts of your service they are impressed
    by.


    You’ll also learn that there will be multiple clusters and segments representing
    different needs, problems, and solutions. This is what I did at Spotify (and more
    recently for several other clients) to uncover exactly what customers in different
    segments, age-groups, countries, and cohorts were saying about the service, product,
    or experience they’re selling. Incorporate these commonly occurring themes into
    your next influencer marketing campaign, and you’ll amplify your existing word
    of mouth. As a bonus, it will help your existing customers distinctly express
    what you know will resonate with the way they already talk about your brand or
    services.


    ## Creator-Centric Strategies


    Extend your value beyond pay and increase your ROI with a creator-centric perspective
    to influencer marketing


    > Marketing is not a function, it is the whole business seen from the customer’s
    point of view.

    >

    > —Peter Drucker¹


    ### Key Questions


    - Why do 9 out of 10 influencers follow brands on social media?

    - What''s the number one mistake brands make when creating content on Instagram?

    - What are the ten biggest challenges as an online creator or influencer?

    - What do influencers care about the most when deciding which brands they want
    to work with?

    - What''s the right level of monetary compensation?


    ### Core Principles


    1. Value beyond pay.

    2. Becoming creator centric.

    3. Consistency, creativity, and community.

    4. Brand self-assessment.

    5. There''s no free lunch.


    I’ve got good news and bad news. Good news first, shall we? 9 out of 10 influencers
    and content creators on Instagram follow brands that they like and want to work
    with. You’ve got their attention! A scarce currency in the attention economy—where
    the battle for attention is growing exponentially. Ready for the bad news? Chances
    are that you’re letting them down, big time.


    In preparation for writing this book, I spoke with over 200 influencers on Instagram²
    to get their take on the current state of the social media landscape. The research
    uncovered several relevant insights that can be applied to solve problems and
    create new opportunities for both creators and brands.


    The main thesis throughout this chapter is this: With a creator-centric perspective
    to influencer marketing, you’ll increase their value of working with you—rather
    than the other way around. In exchange, you’ll create leverage that will improve
    your return on investment. But what do we mean by creator-centric? Simply that
    each problem, challenge, and opportunity should first be observed through the
    eyes of the creators and influencers that you’re working with. That, when you
    see things from their frame of reference and embrace their perspective, you’ll
    be fully aware of what it’s like to walk in their shoes.


    ### What creators expect


    Let’s take a deeper look at those good and bad news of ours. The study found that
    87% of panelists (each a creator on Instagram with at least 10,000 followers)
    follow at least one brand on Instagram. That’s good news, obviously, but what
    do they expect from these businesses and their social media presence? Following
    up to the first question, each creator was asked to share both what they expect
    from these brands³ and what [from the perspective of the creator] their biggest
    mistakes are⁴. Examine the 200 different responses to the first question, and
    four clear themes emerge.


    ### Why do you follow brands on Instagram?


    1. Inspiration: I follow them for inspiration (28%), news/trends (10%).

    2. Affinity: I like/love the brand and their products (21%).

    3. Collaboration: I have (16%) or want to (6%) work with them.

    4. Discovery: To discover new products from the brand (17%).


    So, your brand is followed by influencers that turn to you for *inspiration*,
    news, and *trends* because they love your *brand* and *products*. They want to
    discover what’s new, and either have worked with you or want to work with you
    at some point in the future.


    ### BRAND SELF-ASSESSMENT


    Answer these questions before you move onto the next section where we’ve identified
    the biggest mistakes brands make on Instagram—and how to live up to the expectations
    outlined previously.


    1. Is your presence on Instagram inspiring with product news and trends from your
    industry?

    2. Is it easy for your followers to discover new products?

    3. Are you making it easy for creators to reach out to you?


    Next, the same set of respondents were asked a different question. The 200 different
    answers were organized into 33 different groups, where 80% of responses could
    be assigned to one of these six themes.


    ### What’s the number one mistake brands make when creating content on Instagram?


    1. Too product-focused

    2. Not consistent or without a clear theme

    3. No interaction or answering questions in comments

    4. No storytelling, personality, or authenticity

    5. Too commercial, transactional, and… boring!

    6. Your content looks like a magazine ad!


    Every other marketing team I share the list with goes “Ouch! They’re talking about
    us!” Bad news, indeed. Time for another self-assessment.


    ### BRAND SELF-ASSESSMENT


    Answer these questions to assess if your brand is making any of the most common
    mistakes, according to social media influencers on Instagram.


    1. Is your content primarily focused on your product, typically with product close-ups?
    (Too product-focused)

    2. Do you have a creative theme that you follow with consistency? (Not consistent
    or without a clear theme)

    3. Do you have a team or person dedicated to answering questions and interact
    with your followers in comments and DMs? (No interaction or answering questions
    in comments)

    4. Are you telling a story that’s entertaining or engaging with personality? (No
    storytelling, personality, or authenticity)

    5. Are you primarily focused on the commercial aspect of your business, and do
    you use your social media channels to sell products? (Too commercial, transactional,
    and… boring!)

    6. Are you using content that was produced for other marketing channels, like
    magazines and/or ads? (Your content looks like a magazine ad!)


    So, good news—attention. Bad news—unfulfilled expectations. More or less anyway,
    depending on how you answered the questions in the second self-assessment. Either
    way, I’d consider these six clear themes your guiding principles to build a social
    media presence that creators and influencers love.


    There’s another important lesson hidden within these insights. The feedback is
    based on the collective experience of hundreds of talented creators, not a single
    industry expert or social media advisor. These hundreds of influencers, representative
    of millions of creators, have mastered the art of content production, distribution,
    and fan engagement. They are, first and foremost, practitioners. They are thriving—in
    a world where traditional marketing scholars are struggling to keep up—each with
    their own playbook that keeps evolving as they adapt to the ever-changing digital
    landscape. And the more time they spend on their content, their tone of voice,
    and their audience, the more inclined they are to navigate by intuition. The creator
    community is a tight-knit one. They talk to each other, share advice, and look
    to their peers for what’s coming next.


    So, what lessons do they have for other creators, and brands alike, that are looking
    to produce better content, build a bigger audience, and engage their community?


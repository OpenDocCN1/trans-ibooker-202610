    # The best time to plant a tree


    There’s a popular Chinese proverb that says: “The best time to plant a tree was
    20 years ago. The second best time is now.”


    But why plant a tree today if you can plant a faster-growing tree for less tomorrow?
    That’s what technology, the Internet, and social media have done to the traditional
    publishing world and other parts of society as well.


    The tools are cheaper, there’s an even bigger audience, and you can piggyback
    on the mistakes (and success) of others.


    That’s what has happened in the media industry in the last 10 years. Previously,
    you’d be in the hands of journalists, media moguls, or Hollywood power players
    to get in front of an audience.


    Nowadays, you don’t need the front page, a TV show, or a lead role in a feature
    film. It truly is a world without gatekeepers, and the only person you need permission
    from is yourself, and an audience. And the audience can be a very small segment
    of the market.


    In the 2017 book Hit Makers: How to Succeed in an Age of Distraction, Derek Thompson
    dives deep into the secret histories of pop culture hits and the science of popularity.
    He writes:


    > A simplistic definition of “popular” is the quality of being well-liked by most
    people. But the trouble with this definition is that there are few things that
    most people like.


    He extends his reasoning to conclude that “from a majoritarian standpoint, nothing
    is popular. The mainstream doesn’t exist. Culture is cults, all the way down.”


    This is true in book publishing, scripted movies, and social media. In June 2018,
    Instagram announced that it had reached an important milestone—1 billion monthly
    active users. It goes without saying that if you have a million followers on Instagram,
    you’re one of the most popular users on the platform. And if you happen to be
    one of the 11,621 users that belong to this rare group, congratulations, you’re
    now a part of the 0.001%.


    You are one of the most popular users on one of the largest social media networks
    in the world! But as strange as it may sound, while you may have built a larger
    following than 99.9% of the population, you’re simultaneously ignored by 999 million
    people, or 99.9%. Even with an audience of a million followers, if you were to
    get up on a stage in a room with a thousand random strangers that are active social
    media users, only one in a thousand would recognize who you were. You’re world
    famous to a million people, but they represent a minority of the entire population.
    The same is true if you have an audience of 100,000, 10,000 or 1,000 followers,
    subscribers, or fans. You are'

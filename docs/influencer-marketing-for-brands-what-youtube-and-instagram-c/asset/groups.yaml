  - '[PAGE 163]


    **Licensing** Acquiring the right to use influencer content based on permissions
    or usage rights. The process varies in based on the specific permissions a brand
    requests.


    **Link in Bio** A phrase and call to action (CTA) influencer''s use mostly on
    Instagram to signal to their audience that they have put more information in their
    bio.


    **Macro-influencer** An influencer with a larger following on one or several of
    their active platforms. On Instagram a macro-influencer usually haves 100,000
    followers or more.


    **Multi-channel Network (MCN)** A company or entity that works with multiple channels
    and content creators, consulting or assisting towards success on streaming video
    platforms such as YouTube.


    **Media Kit** The digital document, similar to a CV that influencer use when reaching
    out to brands for collaboration. It contains information about the influencer,
    previous experience, skills, channels, and followers.


    **Media Spend** The budget invested in a campaign or a marketing initiative. This
    will typically exclude other costs.


    **Micro-influencer** An influencer with a smaller but usually a highly engaged
    audience (typically 10–100K followers).


    **Millennials** The demographic cohort of individuals born between 1980s and 1990s
    who have reached young adulthood in the 21st century.


    **Most Valuable Distribution (MVD)** A term used to describe a brands most effective
    channel strategy and the best practice unique for their brand yielding the greatest
    return on investment with the lowest effort or energy.


    **Monetize** The process of converting services or assets into a stream of revenue.
    For influencers, monetization happens when they are able to earn money from created
    content their social media accounts or blogs. This is often by sponsored content
    or affiliate revenue.


    **Multi-tied Approach** The activation that strategically leverages various influencers
    across different audience sizes to ensure all key performance indicators are addressed
    and high-level brand goals are met.


    **Niche** A small segment in the market of population with unique or very specific
    characteristics or needs.


    **Off Brand** When content lacks alignment to the value a brand is aiming to achieve.


    **Organic vs. Paid** The two types of influencer content: non-sponsored and sponsored.
    Organic content is non-sponsored and holds no material connection to a brand.
    Paid content, or sponsored content, on the contrary is driven in some capacity
    by a sponsoring brand advertiser.'
  - '[PAGE 164]


    **Optimize** To make the best or most effective use. In influencer marketing,
    optimization refers to making the content perform better.


    **Organic** In influencer marketing, something happens organically when there
    is interaction without the intervention of payments.


    **Outreach** To reach out to *influencers* for collaborations.


    **Owned Media** Branded content published on a one’s own channels.


    **Page Views** The metric used to show how many views a page on a website got
    during a specified period of time.


    **Paid Media** Any media coverage that has been paid for.


    **Paid Post** A blog or social media post that has been paid for to be produced.
    Often paid posts are produced by influencers in collaboration with a brand in
    exchange for a form of compensation, monetary, or other.


    **Paid Reach** Impression that have been earned through a paid model. ROI is often
    measured by comparing the organic reach and the paid reach.


    **Personal Brand** The personal features, values, and qualities of an influencer.
    Influencers are mindful to make sure that potential brand partners aligns with
    or compliment their own personal brand, to ensure authentic content to their audiences.


    **Participation Rate** The share of *influencers* that accept to join your campaign
    (see *Outreach*).


    **Plandid** A photo that’s meant to look candid and casual, but is actually strategically
    planned out.


    **Platform** A social media channel or website where users post content. Platforms
    include Instagram, Twitter, YouTube, Snapchat, Music.ly, Facebook, and blogs.


    **Poll Interaction Rate** The share of an audience interacting with the Vote feature
    in *Instagram Stories*. Votes divided by views.


    **Product Integration** of a brand’s specific product through explicitly introducing,
    including, and mentioning it within influencers’ content.


    **Public Relations** The strategic professional communications process that specializes
    in a favorable media coverage of a brand or personality.


    **Qualify** When evaluating influencers for a specific campaign, some brands may
    have some prerequisites so a qualification process has to be done.


    **Reach** The total number of followers an influencer or a brand has. This may
    be on a specific social platform or on all social platforms that are active.


    **Reaction Video** Videos in which people react to events or other videos.'
  - '[PAGE 165]


    **Return on Investment (ROI)** The total value received on a marketing investment.


    **Sampling** Goods or services are provided as a form payment for the influencer
    in a collaboration.


    **Segment** A specific group of influencers differentiated by the type of content
    they create or by the specific audience demographics they reach. Examples: lifestyle,
    fashion, parenting, travel, and so on.


    **Sentiment** The opinions expressed by followers.


    **Sentiment Analysis** Computational process to identify opinions expressed by
    followers within the comments in response to influencer content. This helps to
    determine attitudes toward a particular topic or product.


    **Social Media** The collective of online communication channels that enable users
    to create and share content and to participate in social networking.


    **Swipe up** The feature on both Instagram Stories and Snapchat that allows the
    user to link to a website from their post, so that their audience can get more
    specific information. The user need to swipe up on the screen to land on the website.


    **Tag** Typically a @tag on a post to link to another user''s page on the platform.


    **Target Audience** The ideal group of consumers that a brand wants to attract
    with a marketing campaign.


    **Terms of Service (TOS)** The terms or rules that have to be agreed upon before
    using a product or a service.


    **Through the Line (TTL)** 360-degree advertising where campaigns are developed
    with the vision of brand building as well as conversion.


    **Total Accounts Reached** Total unique accounts that viewed the content.


    **Total Content Engagement** The sum of all shares, likes, and comments. Total
    content engagement works as an input for the Engagement Rate, a key metric that
    is a proxy for the quality of content based on the number of interactions.


    **Total Digital Audience** The total sum of an influencer''s potential reach across
    all his or hers active social platforms, including Facebook, Twitter, Instagram,
    Pinterest, YouTube, Tumblr, Snapchat, Musical.ly, and Blog monthly unique visits.


    **Tracking Links** URLs that are used to direct traffic to a landing page from
    somewhere other than your own website. Tracking links are included in marketing
    campaigns to help brands track, measure, and report the success of an influencer
    marketing campaign.'

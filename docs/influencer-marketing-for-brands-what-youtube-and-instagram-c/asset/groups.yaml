    +   10. Any chance that this could hurt my career or personal brand? (risks)

    +   11. Are there other benefits for me that I should know? (benefits)

    +   12. How do I know that I can trust you? (risk)

    +   13. Who else have you worked with? (social proof and community)

    +   14. How much time will this take? (commitment)

    +   15. When will I get paid? (terms)

    +   16. What are your marketing goals? (objective)

    +   17. What makes your product/service special? (unique selling points)


    # Brief template


    Over the last three years, my company has developed a proven brief template that
    has been successfully used in thousands of collaborations on Instagram, across
    pretty much any category and vertical that you could possibly imagine. What follows
    is the exact email template we use, how each element of the brief is structured,
    and how to address each of the 17 questions.


    Subject: Invite to paid Instagram campaign with [brand name]


    Hi @creator,


    [your name] from [your company] here.


    [Short two-sentence intro to spark enough interest to keep reading. You can mention
    other creators or influencers you’ve worked with here, but keep it very brief.]


    If you’re interested, read on for all the info. At the bottom you’ll find a button
    you tap to register your participation. If you have any questions, don’t hesitate
    to reach out.


    /Aron


    —INVITATION TO COLLABORATE WITH [BRAND]—


    # About [brand]


    Two short sentences about your brand. If you’re promoting a specific product,
    describe its key benefits and unique selling points.'

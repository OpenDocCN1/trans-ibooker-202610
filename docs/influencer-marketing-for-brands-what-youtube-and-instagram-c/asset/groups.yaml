  mdcn: "\n它在过去17年里花费了3390亿美元，而SpaceX只筹集了32亿美元。\n\n另一个极端是播客和音频广播。\n\n1964年，当摇滚乐仍被视为不适合公开播出时，爱尔兰商人Ronan\
    \ O’Rahilly不得不把他的离岸电台Radio Caroline设在公海，以避开英国当局的法律管辖。除了一家商业电视网之外，广播频率都由英国广播公司（BBC）掌握。\n\
    \n这些海盗电台会播放美国Top 40电台的音乐，收录滚石乐队、披头士乐队和谁人乐队等艺人的作品，并最终成为该国最受欢迎的电台之一。\n\n海盗电台本身并不违法，但在1967年，英国政府把向任何未获许可的离岸广播机构提供音乐、评论、燃料、食物和水的行为定为犯罪；打个比方，这一行为最终让他们的海盗船沉没。\n\
    \n如今，任何人都可以成为海盗。无需躲避法律，也无需担心冬季风暴或食物补给。如果你有有趣的故事，找一间安静的房间、一支不错的麦克风和一些免费音频软件，就能与世界上最大的广播机构争夺注意力。\n\
    \n我们既回到了太空探索的黄金时代，也回到了海盗的黄金时代——无论是当宇航员还是海盗，这都是一个大好时代。\n\n## 结论\n\n无论人们在哪个社交媒体平台上发布内容，注意力都在其他人身上。\n\
    \n几年前，目光投向Blogger、WordPress、Twitter和Facebook。如今则是Instagram、YouTube和Snapchat。谁知道再过几年目光会转向哪里，或者形式会变成什么样，但我敢打赌，我们仍会消费来自他人的内容。\n\
    \n个人拥有的发布能力，比不到20年前世界上最大的媒体公司还要强；眼球和注意力在哪里，广告费就可能跟到哪里。\n\n而如果我们希望继续从事营销和数字广告这一职业，我们的工作就是跟随变化，按照消费者的规则行事。话虽如此，不要把数字内容创作者仅仅视为“社交媒体明星”，而要视为现代杂志或电视频道。\n\
    \n你正在与新媒体出版方合作，以与消费者期望产生共鸣的方式传播你的信息。还记得Kantar Millward Brown的研究吗？这些消费者对展示真实场景中真实人物（而非名人）的广告持积极态度，也愿意接受在社交媒体、教程和其他类型的赞助内容中讲述有趣故事的广告。\n\
    \n所以，你需要转变思维方式，把社交媒体创作者和影响者视为媒体出版方，把相关投入视为广告支出。\n\n未来几年，品牌将把50亿至100亿美元的媒体预算投入到影响者营销中。这不是昙花一现的潮流，而是媒体消费的结构性转变。但*影响者*这个词经常被误用，也同样被误解。在下一章，你将学到*影响力是一种结果，而不是一种职业*——以及能够释放影响者营销对你品牌全部潜力的三大杠杆。\n\
    \n## 影响力是一种结果，而不是一种职业\n\n语境、采用、影响力杠杆，以及如何为你的品牌找到合适的创作者\n\n> *在一个选择无限的世界里，语境——而非内容——为王。*\n\
    >\n> ——克里斯·安德森¹\n\n**关键问题**  \n我如何为我的品牌找到合适的影响者？识别合适的影响者时应该看重哪些特质？影响者是早期采用者吗？什么样的互动率才算好？\n\
    \n**核心原则**  \n- 1. 影响力是一种结果，而不是一种职业。\n- 2. 社交媒体创作者是早期采用者。\n- 3. 拥有你自己的达人池。\n-\
    \ 4. 长尾的力量。\n- 5. 创新的扩散。\n\n¹ *长尾理论：为什么商业的未来是销量少而种类多*  \n© Aron Levin 2020  \n\
    A. Levin，*品牌影响者营销*，  \nhttps://doi.org/10.1007/978-1-4842-5503-2_3\n\n影响你的决策。为什么？专业知识和可信度，是影响力的*第一个*杠杆。*第二个*杠杆是你与对方关系的强度。你们越了解彼此，效果就越好。我们信任朋友、家人以及与我们关系牢固的人。我们也与在线上关注或订阅的对象有着不同强度的关系。那位私人教练的受众规模，以及她能够触达的人数，起到了乘数的作用。这就是影响力的*第三个*杠杆。\n\
    \n### 公式\n\n影响力 = 受众触达 × 亲和力（专业知识、可信度） × 受众关系强度（互动）\n\n- 1. **受众触达**指受众的规模以及他们是谁。可以是订阅者、关注者或好友网络。\n\
    - 2. *亲和力（专业知识、可信度）*是确保你的信息或品牌具有亲和力、天然的喜爱或共鸣。它同样关乎专业知识和可信度，专业知识指“在特定领域的知识”，可信度指“被信任和被信服的品质”。我们将在第5章“以创作者为中心的策略”中更深入探讨创作者在与品牌合作时看重的特质。\n\
    - 3. *受众关系强度（互动）*关注的是受众与你有多亲近。如果关系较弱，受众就不会关注，信息获得的注意力和影响力也会很低。\n\n当你为优化这三点而布局时，就更有可能打造出结果更好的影响者营销活动。\n\
    \n### 受众规模\n\n*策略：受众优先*\n\n确保你合作的创作者拥有与你的受众重叠的受众。确保你了解在特定关注者区间内有多少创作者，以及你所处市场的状况。\n\
    \n**关键问题：** *我们的目标受众是谁？谁的受众能帮助我们触达这一受众？我们合作的每个人应该拥有多大的受众规模？*\n\n### 亲和力\n\n*策略：人才独立*\n\
    \nYouTube上有超过200万个订阅者超过500人的频道。Instagram上有超过1000万拥有1000位关注者的创作者。与一个能够挖掘这整个潜在创作者群体，并帮你找到那些对你的品牌具有亲和力、专业知识和可信度的人选的伙伴合作。\n\
    \n关键问题：亲和力：我的品牌或营销信息是否有天然的喜爱或共鸣？专业知识：这个人是否在我所在的特定领域知识渊博？可信度：为什么这个人的受众会信任或相信他？在营销信息或你的承诺中，“值得相信的理由”是什么？\n\
    \n除非你完全独立运作，否则你很难为你的营销活动找到合适的人选。多频道网络（MCN）或艺人经纪公司只会推荐自己旗下的签约者，因而局限于他们代理的人；有时他们与你的品牌完美匹配，但有时并非如此。这并不一定意味着他们不好，但确实限制了他们帮助你建立专属于自己业务的人才库的能力（本章后面会深入讨论这一点）。\n\
    \n通过一种人才独立的方法来识别和引入合适人选，我们确保每次都能毫不妥协地让正确的人加入。\n\n### 关系强度\n\n*策略：优化互动*\n\n互动是衡量关系强度的绝佳指标。它也是客观评估受众是否在关注你信息的好方法。要与互动水平出众的创作者合作。如何制定策略和策划活动，以实现出色的互动水平？这将在第4章“创意的艺术与科学”中更详细地讨论。目前，只需记住：互动将是一个\n"

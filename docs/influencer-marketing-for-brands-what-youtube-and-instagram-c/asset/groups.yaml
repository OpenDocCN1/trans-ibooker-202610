    In October 2017, Upwork and Freelancers Union published the results of their “Freelancing
    in America”⁵ study (conducted by independent research firm Edelman Intelligence)
    and found that more than 50% of all millennial workers have engaged in the economy
    with some kind of freelance work in the last 6 months.


    If you are a designer, videographer, photographer, writer, artist, model, or the
    like, selling work or services by the hour, or project, rather than working for
    a single employer on a regular salary, you’re a freelancer. If you create content
    for brands, on YouTube or Instagram, you’re also participating in the rapidly
    growing global freelance economy. It’s predicted that freelancers are expected
    to be the majority of the US workforce by 2027, based on current growth rates
    trajectory. In the very near future, the job title freelancer will be more popular
    than any other job, combined. But not only that. The study from Upwork also observed
    that almost half of working millennials (47%) are already freelance, a participation
    rate higher than any other generation.'

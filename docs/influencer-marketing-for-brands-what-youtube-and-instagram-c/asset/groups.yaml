    ## 第7章 | 影响者营销四步框架


    为你的品牌创造内容。目标是什么？为你的社交媒体渠道（无论是付费还是自有数字渠道）提供稳定的品牌内容流。


    通过这类活动，你将影响者营销转变为内容生产的手段，而非媒体分发，这打开了一个独特的机会。突然之间，你可以优化审美、品味和创意，而不只是受众、互动或触达。


    ### 营销目标与KPI之间的脱节


    设定目标是一回事，衡量结果并理解成果是另一回事。2019年初，我的公司采访了351个营销团队⁹，以更好地了解他们的主要影响者营销目标是什么，以及他们如何衡量活动结果。这项研究的目的有两个：第一，更深入地了解他们为何开展影响者营销活动；第二，他们如何定义成功。


    50%的受访者表示，他们进行影响者营销的主要目标是品牌认知或购买考虑，其次是销售（34%）。内容生产排在第三位，占13%（图7-1）。


    ![](img/7ec2733715193510646aec32cc18284f_137_0.png)


    **图7-1.** 你在开展影响者活动时的主要目标是什么？


    > ⁹ N=351，“Relatable发布的2019年影响者营销状况”


    毫不意外，这些见解得出的结论是，营销人员认为影响者营销可以用于品牌认知、购买考虑、转化和内容生产——按此顺序排列。


    在这个问题之后，同一批受访者被问及他们主要如何衡量活动是否成功——以了解他们的主要关键绩效指标是什么，以及这些指标与营销目标的关系。


    47%的受访者表示，转化或销售是他们衡量成功的主要方式。其次是互动或点击（26%）、浏览/触达/曝光（16%）和内容质量（9.5%）。但这让我觉得奇怪。见图7-2。


    ![](img/7ec2733715193510646aec32cc18284f_138_0.png)


    图7-2. 你主要如何衡量一场影响者营销活动是否成功？


    整整47%的人会根据转化或销售来评估他们影响者营销的成功，而销售本身仅仅是34%受访者的主要营销目标。这表明目标和结果之间存在脱节，而且似乎与我们交谈的营销团队瞄准的是一个目标，衡量的却是另一个。


    为了更深入地研究，受访者根据其主要目标被分为两组：一组是品牌认知/购买考虑，另一组是销售。见表7-4。


    ![](img/7ec2733715193510646aec32cc18284f_140_0.png)


    图7-3. 按经验水平比较脱节的可能性


    当主要目标是品牌认知/购买考虑时，经验丰富的营销人员更可能选择“互动或点击”作为衡量活动结果的主要方式（44%），而对于经验很少或没有经验的营销团队，指标实际上发生了逆转（18%）。


    考虑到这一点，请确保你的营销目标和成功定义清晰一致且明确界定——否则，你自己的组织极有可能像我们的研究结果一样分散。


    ### 第2步：正确的活动策略


    还记得第4章《创意的艺术与科学》中提到的23种不同的活动和创意策略吗？有了明确的营销目标、目标受众和成功定义，是时候制定你的平台策略了。


    为了方便起见，请查看表7-5中的概述（更多信息请参阅第4章《创意的艺术与科学》）。


    **表7-5. 活动类型：Instagram和YouTube**


    | Instagram | YouTube |

    |---|---|

    | 单篇信息流帖子活动 | 产品教程/演示 |

    | 仅限快拍的活动 | 产品评测 |

    | 信息流帖子与快拍搭配 | 购物分享 |

    | 多帖活动（大使计划） | 开箱 |

    | 放大品牌体验 | 穿搭图册 |

    | 爆发式活动 | 梗图和喜剧 |

    | 实时招募 | 游戏实况 |

    | 直播追求最大真实感 | 品牌/产品提及 |

    | 支持主打品牌活动 | 最爱/推荐 |

    | 通过投票驱动购买考虑 |  |

    | 超本地化活动 |  |

    | 上滑获取线索 |  |

    | 为广告创作内容 |  |

    | 将影响者用作演员/人才 |  |


    通过检验每种策略的特点，并将其主要优势与本章第一步中的活动类型特征进行比较，你应该会得到一份包含2到5种活动策略的清单，这些策略将指导影响者营销四步框架中的下一步。


    ### 第3步：创意、创作者和内容


    **创意**


    一切开始步入正轨，是时候为你的活动、项目或推广勾勒出创意概念了。这将是你信息传达、定位以及简报中向创作者和影响者提出要求的基础。


    正如第4章《创意的艺术与科学》所讨论的那样，将新的、富有想象力的想法变为现实，实际上是一种艺术形式。因此，我们手头并没有万无一失的公式。相反，建议从那些在类似活动策略中成功运用创意想法的人身上寻找灵感。这也是创意机构（或内部创意团队）能够大展身手、价值千金的地方。


    考虑到这一点，以下问题可以帮助激发你的创意，并找到一个能与创作者、他们的社群以及你的客户产生共鸣的信息。


    - 关于你的目标受众或行业，你是否有任何独特的洞察¹⁰？

    - 基于这些洞察，机会在哪里？

    - 当下文化中有哪些流行且相关的内容？

    - 什么能与你的受众在更深层次上产生连接，并跨越文化边界？

    - 什么能与公众建立情感连接？

    - 什么话题因其共鸣性和意义而具有讨论价值？

    - 什么能够吸引、分化、激发或娱乐创作者的受众？


    最后，你需要考虑你所识别和提议的内容，对参与的影响者来说是否切实可行、便于制作和执行。当你确定活动的创意概念后，将这三个问题的答案进行总结。


    **表7-6. 洞察-机会-创意问卷**


    | 问题 | 答案 |

    |---|---|

    | 独特的洞察是什么？ | |

    | 机会是什么？ | |

    | 创意是什么？ | |


    回答这三个问题将有助于内部甚至外部利益相关者看到全貌。最后，确保创意概念与你前面第1步和第2步中概述的营销目标、目标受众、成功定义和活动策略保持一致。


    **创作者选择流程和内容类型**


    有了创意概念后，是时候为你的活动找到合适的人才，并匹配合适的内容类型。在此框架的语境下，你只需确定指导活动执行的参数——而不是一份具体的影响者或创作者名单。


    他们位于哪里？他们的个性特点如何？他们与你的品牌共享哪些价值观？他们属于哪些品类？每位影响者将创作并发布多少条内容？你将与少量影响者（每位都有更多受众）合作，还是相反？见表7-7。


    **表7-7. 选择流程、创作者参数和价值观**


    | 创作者参数 | 数值 |

    |---|---|

    | 所在地 | |

    | 品类 | |

    | 共享价值观 | |

    | 每位创作者发帖或快拍数 | |

    | 活动参与者总数 | |

    | 平均粉丝数或区间 | |


    ### 第4步：预算、目标和媒体规划


    你已经到达影响者营销框架的第四步，也是最后一步。与我们之前的成功定义类似，现在我们将确定实现总体活动目标所需的具体目标和关键绩效指标。你的最终任务是，基于总体目标、KPI和单位成本，概述具体的项目目标。第1步中的表7-3列出了四种活动类型（触达、关注、行动、内容），将有助于指导你应该衡量什么以及如何衡量。


    让我们从决定影响者营销活动范围的自然因素开始：预算。


    **预算**


    *我们应该在影响者营销上花多少钱？它的成本又是多少？*


    越来越多的品牌和营销团队正在为影响者营销分配专门的媒体预算。影响者营销中心（Influencer Marketing Hub）[^1]在2019年对800家营销机构和品牌进行的一项调查发现，86%的受访者拥有影响者营销的专项营销预算，而在2017年这一数字仅为37%。同一项研究还显示，营销团队不仅在影响者营销上投入的媒体资金比以往任何时候都多，而且三分之二的受访者计划在未来一年进一步增加支出。


    [^1]: https://influencermarketinghub.com/influencer-marketing-2019-benchmark-report/



    they create their content, taking them behind the scenes of how their photos are
    made.


    ### Principle 2. Making it easy to talk about


    Half the battle is often to encapsulate and simplify an idea to a point where
    it’s easy to talk about from both a content creator and content consumer point
    of view. Keep it simple, and it will be easy and more likely to talk about. In
    short, if you can’t share the core idea in less than a few sentences around the

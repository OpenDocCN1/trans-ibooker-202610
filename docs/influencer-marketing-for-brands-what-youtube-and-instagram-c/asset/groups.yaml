    be expected to double every 2 years, as a result of increases in the number of
    transistors a microchip can contain) in play (driving down costs and a reduced
    need for capital), the only thing that’s standing in our way is innovation (creativity).


    On one end of the spectrum, you’ll find Elon Musk. He probably couldn’t have built
    spaceships in the 1970s, but fast-forward to 2019 and his company, SpaceX, is
    now head to head with NASA—a state-funded organization'

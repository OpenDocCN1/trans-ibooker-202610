    The bird that drove everyone—including its creator—crazy.


    ## Seven principles of word of mouth


    Flappy Bird conquered the world; its Vietnamese founder Dong Nguyen lost his mind
    and took the app off the App Store. But do you remember when it first exploded
    all over Twitter and then blew up in the news? These things, seemingly random,
    are not.


    Having spent more than five years at music-streaming service Spotify, working
    specifically with user growth (and prior to Spotify at King Digital Entertainment,
    the maker of Candy Crush—another great example that could fit into the previously
    mentioned list of successful products), I’ve had the unfair advantage of getting
    to study these things firsthand, as they were taking place, with access to all
    the relevant data and insights that an outsider wouldn’t have.


    When I began to break down what caused certain products and services to be more
    talked about than others, I found that the more of the following principles you
    could apply, the more likely your brand, product, or service (or marketing campaign)
    would be to gain traction through word of mouth.


    See, the best marketing in the world (specifically influencer marketing) doesn’t
    have to be overly creative to drive exceptional buzz or word of mouth. Instead,
    it can be dressed down to a point where you’re amplifying a message that is already
    out there in the market that resonates with the audience you’re aiming to reach.


    It sure isn’t a one-size-fits-all solution, nor is it always easy, but can be
    extremely powerful when appropriately applied.


    Speaking of applied insights, you may wonder what this has to do with influencer
    marketing, and the context and contents of this book? In short, if the core message
    in your campaign can tick these boxes, then the engagement in your campaign, the
    earned media aspect, and the amplified word of mouth will improve dramatically.


    As such, you can identify if you’ve developed a creative idea, value proposition,
    or communication strategy that people will talk about, by asking yourself the
    following seven questions. You don’t need to answer each and every one with a
    yes, but the better they’re aligned, the greater your chances. The questions are:


    - 1. Does it solve a problem?

    - 2. Is it easy to talk about?

    - 3. Does it feel good to share?

    - 4. Does it evoke a sense that the world is an amazing place?

    - 5. Does it start a conversation?

    - 6. Is it relevant to our core target audience?

    - 7. Once experienced, does it exceed your expectations?


    It, in this scenario, is your product, service, value proposition, idea, or creative
    campaign. Go back to the list in the beginning of this section (SpaceX, Spotify,
    Uber, Bitcoin, Slack, Flappy Bird, and Amazon Prime), and ask yourself these seven
    questions, and you''ll see how the answer, more often than not, is a yes.


    How about commercial messages and advertising? Search for "Top Ad Campaigns of
    the 21st Century"¹⁷ and you''ll see that the list by AdAge is featuring campaigns
    like:


    - Dumb Ways to Die

    - Apple: Get a Mac

    - Red Bull: Stratos

    - Dove: Campaign for Real Beauty.

    - Old Spice: The Man Your Man Could Smell Like


    Check them out, go back to the questions, and you''ll see that these principles
    can be applied to some of the most iconic adverts ever produced (they seem to
    be the ones most frequently shared, as well). So what problem (question #1) does
    the now iconic Old Spice commercial [featuring Isaiah Mustafa on a white horse]¹⁸
    solve?


    It spoke to women, without alienating men.


    Meanwhile, the Red Bull Stratos¹⁹ campaign did, indeed, evoke a sense that the
    world is an amazing place or, to use their own words, "to advance scientific discoveries
    in aerospace for the benefit of mankind."²⁰



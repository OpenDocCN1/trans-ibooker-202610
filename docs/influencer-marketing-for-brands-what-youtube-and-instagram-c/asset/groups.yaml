    \ the eyes were on Blogger, WordPress, Twitter, and Facebook. Today it’s Instagram,\
    \ YouTube, and Snapchat. Who knows where it will be in another few years from\
    \ now or what the formats will look like, but I’d bet you that we’ll consume content\
    \ from other people.\n\nIndividuals have more publishing power than the largest\
    \ media companies in the world had less than 20 years ago, and where the eyeballs\
    \ and attention are, the advertising dollars likely will follow.\n\nAnd our job,\
    \ if we wish to remain in our profession as marketers and digital advertisers,\
    \ will be to follow along and play by the rules of the consumer. With that said,\
    \ think of digital content creators not merely as “social media stars” but as\
    \ modern magazines or TV channels.\n\nYou’re working with modern media publishers\
    \ to advertise your message in a way that resonates with the expectations of the\
    \ consumer. Remember the study from Kantar Millward Brown? These are consumers\

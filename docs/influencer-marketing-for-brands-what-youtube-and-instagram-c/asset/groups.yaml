    # Step 6: Who’s coming to your party? Répondez, s’il vous plaît!¹⁴


    *Time required:* A couple of hours


    *Effort:* Mid


    *Impact:* Mid


    As you implement Steps 1–5, you’ll quickly run into a constraint that will limit
    your throughput. And while this step isn’t strictly necessary, it will save you,
    and the people you work with, a tremendous amount of time. Consider the system
    we’ve implemented this far. It has a major flaw that will limit our abilities
    to scale—a constraint that will hold everything back until it’s resolved.


    That constraint is *you.*


    See, with each creator responding to your initial outreach, you’ll soon have issues
    keeping track of who’s in and who’s not. Initially, it won’t be a problem—but
    our goal is to eliminate the roadblocks that will arise further down the road,
    ahead of time. We need to clear the road to keep the engine running at full capacity,
    at all times. There are, after all, budgets, timelines, and marketing objectives
    to be met. To eliminate this constraint, we’ll use yet another proven method.
    This time though, it’s one from outside of office hours: It’s party time!


    If you’re hosting a party, it’s essential to keep track of who’s planning to attend
    the festivities, especially if you’re hosting a major event. You could have your
    guests give you a call or send you a text and let you know if they’ll make it—but
    imagine the headache such approach would cause if you’ve extended your invitation
    to hundreds of guests. What a mess! Nah, a much better way—and better experience
    for both parties—would be to send your guests to a website where they can respond
    with their status of attendance.


    Our goal is to have the many creators and influencers that you’ve invited to your
    campaign, program, or talent pool, not respond with their status in an email,
    but rather visit a website where they can let you know if they’re in or not.


    # Répondez, s’il vous plaît


    The two steps required to implement this small but meaningful improvement are
    quite literally as easy as throwing a birthday party. First, we need to build
    a way to capture responses, and secondly, we need to direct campaign participants
    to your page.


    > ¹⁴ French for “Please respond,” or in short *RSVP*'
  - '[PAGE 124]


    # Step 1: Capture responses


    While you could certainly build this yourself, there’s a range of online services
    available that will do everything for you—with no design, web development, or
    web hosting required. I’ll be walking you through the steps you need to take using
    yet another favorite service of mine—Typeform.¹⁵ (Other options include Jotform,¹⁶
    Formstack,¹⁷ Wufoo,¹⁸ Formsite,¹⁹ or Google Forms.²⁰)


    Set yourself up with an account. Login to their interface and start from scratch
    with a new form. There are both help sections, example forms, and tutorials available
    if you need help. For what we’re aiming to accomplish to eliminate constraints,
    your entire form could consist of just one single checkbox or dropdown field where
    you respond “Yes” or “No” or RSVP to your initial outreach.


    But how do you know who the respondent is if there’s nothing but a dropdown menu?
    Good question! Typeform allows for you to create what they call hidden fields.
    Within these hidden fields, you can pass other relevant variables to the responses
    you collect, such as their email address, Instagram username, Follower count,
    or compensation. Remember the Audience fields or Merge tags from before? If you
    include those values as hidden fields, you’ll know exactly who each respondent
    is. Rather than including a full tutorial on how to construct your form, I’d recommend
    the official tutorial from Typeform.²¹


    Pro Tip If you’re shipping a physical product to influencers, you can use the
    very same form to collect their shipping details, along with product preference
    and size(s).


    When your form is ready, you’ll have a link that anyone can access to fill out
    the form. This is the link that you’ll include in your initial outreach email.
    The link will also include a string of characters called “query strings” that
    will be added to the link.


    ```

    https://relatable1.typeform.com/to/typeformid?id=xxxxx&name=xxxxx&followers=xxxxx&instagram=xxxxx&compensation=xxxxx

    ```'

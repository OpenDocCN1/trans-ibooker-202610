    ## Engagement Rate Benchmark on Instagram, February 2019


    ![](img/7ec2733715193510646aec32cc18284f_55_0.png)


    Figure 3-10. Engagement rate benchmark on Instagram, Feb 2019


    As indicated by the left side of the graph seen in Figure 3-10, there’s a clear
    correlation between the size of your audience and how engaged they are, but it’s
    only half of the truth. Look to the right side of the graph, and engagement is
    not just stabilized, but increased. This is the Instagram algorithm at work, serving
    its users with the posts they actually care about the most. So, has the long tail
    lost its power? Does the head suddenly have more power than the tail? Judging
    by the graph, seeking to collaborate with influencers that has an audience of
    5 million followers (and an audience just as engaged as someone with 50,000 followers)
    seems like a no-brainer. Paradoxically, that conclusion would trick you down the
    wrong path. Perhaps contradictory at first, the tail has even more power than
    ever before. But remember that these numbers are aggregated averages. There may
    be more social media creators with a larger following and highly engaged audience,
    but there aren’t that many of them. Consider the following:


    | Group | Followers | Average engagement | Total creators |

    |-------|-----------|--------------------|----------------|

    | A | 5,000,000+ | 3.5% | 1,300 |

    | B | 50,000–100,000 | 3% | 175,000 |


    On average, if you were to disregard the total number of creators in each group,
    Group A would be a clear winner. But disregard the size of the group, and you''re
    failing to recognize that the size of the tail is greater than the head. A better
    question would be how many creators there are, in group B, with at least 3.5%
    engagement? The answer is more than 48,000. Perhaps an unfair approach to manipulate
    statistics, but remember we''re marketers, not mathematicians.



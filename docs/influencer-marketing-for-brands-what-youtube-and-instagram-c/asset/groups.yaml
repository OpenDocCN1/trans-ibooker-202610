    \n显然，产品赠送几乎没有价值，那么创作者如何决定合适的金钱报酬水平以及自身的价值呢？在2018年至2019年间，从YouTube和Instagram上的839位网红收集的数据表明，最常见的决定因素是“我的受众规模以及品牌要求我做的事情。”¹¹\
    \ 那么，创作者期望获得多少报酬呢？\n\n### 行业费率\n\n近年来，网红营销领域发生了巨大变化，而且没有任何迹象表明该行业的增长轨迹会放缓。这些快速发展导致了格式、最佳实践和行业费率的不断变化。\n\
    \n这正是媒体出版行业的本质——它一直由供需的良性循环所主导。最初，广告库存非常充足。由于供应过剩而需求不足，广告成本很低，几乎免费。因此，广告主像大雁一样蜂拥而至，利用这一新发现的机会，而供应的短缺最终为出版商或任何拥有广告库存的人创造了提高收费的机会。数字媒体中的广告成本因季度、行业和市场而异。在大多数平台和网络上，变化是即时的、实时的，更不用说新的创意格式、定向能力和广告技术了。\n\
    \n> ¹¹ 内部研究，Relatable。2018–2019年。N=839（多选题：“你如何知道与品牌合作应该收取多少费用？”）\n\n我很想提供一份经得起时间考验的全面网红营销费率表——但无论我写下什么，很可能在你读到的时候已经过时了。然而，我们能做的是阐明“我的受众规模以及品牌要求我做的事情”真正意味着什么。\n\
    \n暂且不论你认为正确的媒体规划和衡量营销效果的方式，当社交媒体创作者在品牌合作中提到他们的受众规模时，要么是指他们在Instagram上的粉丝数（而不是他们内容将获得的实际触达），要么是指YouTube上的预估观看量（而不是订阅者数量或实际观看次数）。\n\
    \n在广告和网红营销中，CPM（“每千人成本”¹²）通常用于衡量和估算品牌为其广告中的1000个单位支付的费用，通常是触达、观看或曝光。在Instagram上，这个单位是粉丝。\n\
    \n在YouTube的创作者社区中，CPV（“每次观看成本”）经常用于估算合作关系的成本或价值。但在这里，这个数字既不是基于频道订阅者（相当于Instagram上的粉丝），也不是基于已交付的观看量（实际曝光或触达），而是对未来观看量的预估。该预估通常基于发布后前30天内最近五到十个视频的平均或中位观看量。\n\
    \n当然，两个平台上还有其他关键变量会影响每千名粉丝成本或每次观看成本。在Instagram上，这包括内容格式、工作量、内容版权、帖子或快拍数量以及季节性。对于YouTube来说，决定制作专属视频还是整合视频（参见第4章“创意的艺术与科学”中的“YouTube上九种经过验证的创意执行方式”）将比其他任何因素都更能影响你的每次观看成本——其中完全专属的视频比整合提及你的产品或品牌的视频成本高出1.5倍到3倍。\n\
    \n### 不多不少，恰到好处\n\n虽然报酬过低或完全不付报酬会产生实际影响，但支付过高也是如此。当你支付过高时，你会遇到另一个挑战：结果。毕竟你的营销预算有限（而且你的老板对这笔媒体预算能实现什么目标抱有不切实际的期望）。\n\
    \n你如何平衡这两者？应用第6章“规模化的一对一关系”中概述的参与率概念，并记住15%–25%的网红接受你的条件是完全合理的。\n\n### 设定明确的付款条款\n\
    \n互联网创作者协会于2017年6月发布的研究报告《品牌合作现状》发现，29%的受访者曾经历过与品牌的合作中难以获得报酬的情况。每三个人中就有一个——这太疯狂了！我们对如此大比例的在线创作者会证实这种负面经历感到惊讶，于是调查了更大范围的社交媒体网红，得出了相同的结论。26%的人表示，他们做过赞助合作，被承诺付款，但最终根本没有收到报酬。\n\
    \n这意味着很简单：你接触的每三个人中就有一个人过去曾在报酬上被骗过——如果没有，他们几乎肯定认识被骗过的人。那么，建议是什么？立即设定明确的付款条款，不留任何疑问的余地。你可以使用下面的图表（图5-2）来指导你的付款条款，并设定与预期一致的条款。\n\
    \n![](img/7ec2733715193510646aec32cc18284f_102_0.png)\n\n**图5-2.** 你认为获得报酬需要多长时间？\n\
    \n本章前面引用的CreatorIQ调查揭示了另一个有价值的见解：网红认为与他们合作的品牌最关心什么。内容质量是最常见的答案（40%），其次是互动率（37%）、粉丝数量（16%）、品牌契合度（12%）和受众人口统计特征（6%）。\n\
    \n![](img/7ec2733715193510646aec32cc18284f_103_0.png)\n\n图5-3. 网红认为与他们合作的品牌最关心什么？\n\
    \n虽然这些都是任何网红营销活动中明确定义的目标和重要的考虑因素，但创作者和品牌之间的期望保持一致也很重要——但情况并非总是如此。网红营销公司Activate在并行调查网红和营销专业人士时得出了同样的结论¹⁶，以了解每个群体如何看待品牌/创作者合作的目标。在品牌方面，78%的人将品牌知名度列为首要目标，而创作者中只有37%。他们的结论为品牌和创作者提供了一个很好的建议：“*如果网红对营销者的目标有更好的理解，他们就能更好地优化内容以帮助实现这些目标。*”\n\
    \n第7章“四步网红营销框架”将准确展示如何为你的活动选择正确的营销目标和成功定义。但首先，在撰写有效的创作者中心简报时，还有一件同样重要的事情：创意的艺术与科学。\n\
    \n## 规模化的一对一关系\n\n### 约束理论以及如何扩展你的网红营销\n\n> 你所学到的是，工厂的产能等于其瓶颈的产能。\n> \n> ——艾利·高德拉特\n\
    \n关键问题 如何在扩展网红营销时消除带宽和时间限制？如何在减少80%工作量的同时，保持与创作者的一对一关系？如何将电子邮件沟通转化为你的优势，而不是瓶颈？活动参与率、邮件送达率、邮件打开率、邮件回复率和点击率的良好基准是什么？如何建立一个动态的创作者报酬模型并摆脱不必要的谈判？哪五种最有价值的第三方软件服务能让你的网红营销实现自动化？\n\
    \n"

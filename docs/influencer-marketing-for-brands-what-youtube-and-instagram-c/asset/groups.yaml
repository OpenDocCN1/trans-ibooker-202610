    Key benefits:


    +   - Influencer marketing is already an incredibly cost-effective way at generating
    brand content. After the content is already produced and is well-received by audiences,
    it makes sense to want to use that content for larger audiences.


    # Creative strategy 14: Using Influencers as Talent


    Influencers in fashion and lifestyle verticals already have zeitgeist-defining
    looks. When producing brand created content, using influencers as talent not only
    gets you camera-ready talent, but also the reach of the influencers as they talk
    about the shoot. This is not something we’ve done yet; however, it is a compelling
    idea.


    Example uses:


    +   - Casting foreground or background talent in the TV commercials or social
    media shoots

    +   - Using a camera crew to film influencers as they are used in other activations,
    such as brand experiences


    Key benefits:


    +   - Influencers can be contracted to post about the shoot (although many will
    do so organically).

    +   - Fans of the influencers will want to see the brand content to see their
    favorite influencers in it.


    # The creative strategy scorecard


    As you can see, each of these creative executions and campaign types has its own
    set of benefits, example uses, and sometimes even shortcomings. To make sense
    of it all, you can rank their different benefits by order of relevance based on
    their different characteristics, mapped to the circumstances or conditions of
    a specific brand, or your unique campaign goals. Figure 4-1 shows a scorecard.'

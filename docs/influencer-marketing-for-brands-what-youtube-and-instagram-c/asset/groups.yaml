    \ celebrities) and are receptive to ads that tell an interesting story in social\
    \ media, tutorials, and other types of sponsored content.\n\nSo, you’ll want to\
    \ shift your mindset and treat social media creators and influencers like media\
    \ publishers, and the investment like advertising spend.\n\nOver the next couple\
    \ of years, brands are set to allocate between 5 and 10 billion of their media\
    \ dollars to influencer marketing. It’s not a short-lived fad, but a tectonic\
    \ shift in media consumption. But the phrase *influencer* is frequently misused\
    \ and equally misunderstood. In the next chapter, you’ll learn that *influence\

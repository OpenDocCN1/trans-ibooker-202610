    \ channels as well. You’d watch a commercial on TV and buy the product in the\
    \ store the next week. And as such, attribution modeling (and the cause/effect\
    \ of advertising) is something that marketers have struggled with since the dawn\
    \ of time. But if you’re investing in a media channel, you’d want to know. Makes\
    \ a big difference if you get one more customer or five, doesn’t it?\n\nThat number\
    \ *will* make, or break, your entire return on investment. To help our client\
    \ with their challenge, we built a model that looked at normalized average traffic,\
    \ uptake, correlation to video views, etc., and finally established a number and\
    \ attribution model we felt comfortable with.\n\nFor every install we could directly\
    \ attribute, we’d get between three and four additional installs organically.\
    \ That’s a multiplier of +300% to +400% in organic uptake. These numbers seemed\
    \ like they were almost too good to be true. Naturally, I had my doubts. We looked\
    \ at different markets, dates, cohorts, and videos, but couldn’t get to any other\
    \ conclusion. And as the great fictional detective Sherlock Holmes once said,\n\
    \n> *When you have eliminated the impossible, whatever remains, however improbable,\
    \ must be the truth.*²\n\nThe more we thought about it, the more sense it made.\
    \ Turns out that the answer was right under my nose—and rather obvious. Consumers\
    \ are less likely to stop in their tracks, interrupt whatever they’re watching,\
    \ and follow a call to action in a video.\n\n² Arthur Conan Doyle, *The Sign of\
    \ Four* (1890)\n\nYou’re on your phone, watching a video from a creator on YouTube\
    \ that you like. They recommend a smartphone app, and you’ll check it out later\
    \ rather than abandon what you’re watching. Or you’re watching the video on your\
    \ computer, see the app, and pull up your phone to get the app because, well,\
    \ it’s for your phone. In either scenario, the direct attribution would be lost.\n\
    \nBut still, when your agency (me in this example) is telling you (the client)\
    \ that things are four times better than the numbers you see in your dashboard,\
    \ you better make sure that they’re in the right ballpark. Don’t get me wrong—I\
    \ had full confidence in my team and our ability to build these models, but the\
    \ datasets are limited, and there will always be a margin of error. Not everything\
    \ that counts can be counted, and neither Facebook, YouTube, or Instagram allows\
    \ for any third-party tracking on their platforms. In order to have a truly bulletproof\
    \ attribution model, you’d have to analyze exactly who watched the video and who\
    \ went to the App Store.\n\nBut neither me or my company has access to that data,\
    \ because I’m not Apple, Google, or Facebook. Thinking about it. Not even Facebook\
    \ or Apple would have that data because they’re not allowed to track user behavior\
    \ on YouTube. But Google runs both YouTube and the Play Store. They know what\
    \ we watch and what apps we install. And it just so happens that they’ve published\
    \ a whitepaper³ on how they built their own attribution model for influencer marketing\
    \ on YouTube to combat our limited tracking capabilities and help marketers transition\
    \ from assumptions to actual data.\n\nWith permission from a select group of app\
    \ publishers and game developers, the Google Play team analyzed a total of 250\

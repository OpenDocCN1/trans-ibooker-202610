    How do I find the right influencers for my brand? What attributes should I look\
    \ for when identifying the right influencers? Are influencers early adopters?\
    \ What is a good engagement rate?\n\n**Core Principles**  \n- 1. Influence is\
    \ an outcome, not a profession.\n- 2. Social media creators are early adopters.\n\
    - 3. Own your talent pool.\n- 4. The power of the long tail.\n- 5. Diffusion of\

    influencer marketing program before they identify what their actual marketing
    objective is.


    As much as I’ll advocate that you turn influencer marketing into your most valuable
    marketing channel, there are, unfortunately, no one-size-fits-all solutions. It’s
    easy to get carried away and reason by analogy or the proxy of others, but don’t
    make the mistake of picking out the tool before you know what you’re building.


    As such, a large part of this book is structured to help you understand why, how,
    and when the various ways you can apply influencer marketing to your media mix
    are applicable and relevant for you and when they are not.


    Perhaps you’ve read statements like “There’s an 11× ROI on influencer marketing,”
    “You’ll make $7.00 for every $1.00 you spend on influencers,” or “Influencer marketing
    delivers better results than any other media channel.”


    Those statements and promises are absolutely true. Someone, or even a large number
    of brands, absolutely got those results. But are they relevant or applicable to
    you? They certainly could be, but we shouldn’t immediately assume that they are
    until you’ve assessed the situation. In fact, no strategy with substantial upside
    is entirely risk-free. You’ll likely fail a few times before you win big, even
    if you’re best in class. That’s just a part of the game!



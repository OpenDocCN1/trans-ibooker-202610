    case of when YouTuber iTwe4kz sent headphone manufacturer KANOA into bankruptcy.¹⁰
    The company allegedly tried to bribe Cody (also known as iTwe4kz) for positive
    coverage, to which he responded with a brutal 27-minute video¹¹ to his 600,000
    subscribers.


    In a collaboration with the popular technology review YouTuber, KANOA sent a pair
    of headphones to the tech YouTuber to review, but the headphones he received didn’t
    work, to which he reached out with a request for a new pair. Fair enough, you’d
    think. Instead, they offered to pay him 500 dollars for a positive review. Rather
    than taking them up on the offer, the suggestion triggered a different response:


    > You want me to put my integrity on the line so that you can sell some of these
    pieces of shit [headphones]? Are you kidding me? Five hundred dollars? No you
    can’t give me five hundred and I’ll put out a good review. This is trash!


    Note that the problem isn’t the collaboration, compensation, or even the faulty
    product, but the lack of transparency and authenticity. Consumers expect brands
    to collaborate with creators and creators to showcase their products—but remember
    why they turned to their channel in the first place:


    Because they trust their opinion. Ask for an honest review of a product that doesn’t
    work, and you can expect what you asked for.


    # Lookbook


    A lookbook is a stylized video where a creator showcases multiple products from
    one brand—typically within fashion, clothing, and makeup. Integrate your collaboration
    in upcoming culturally relevant calendar events and themes, such as Back to School,
    Spring, or Fall. Alternatively, you can theme your lookbook videos to specific
    audiences or contexts, such as Work, Plus Size, or Date Night. All these examples
    are from most popular search suggestions on YouTube—a tactic that can help generate
    video ideas that are more likely to resonate with a specific audience. There’s
    another upside to this approach as well, namely, that YouTube creators place great
    value in video ideas that will resonate with their audience and are more inclined
    to work with those that have a good understanding of what will attract new and
    existing subscribers.'
  - '[PAGE 73]


    # Memes and Comedy Sketch


    The word meme was first coined by British scientist Richard Dawkins in his 1976
    book The Selfish Gene, defined as “a unit of cultural transmission.”¹²


    He writes: “Memes (discrete units of knowledge, gossip, jokes and so on) are to
    culture what genes are to life. Just as biological evolution is driven by the
    survival of the fittest genes in the gene pool, cultural evolution may be driven
    by the most successful memes.”


    Nowadays, memes are synonymous with funny images, videos, or gifs that are copied
    and spread like viruses in social media and online, often with slight variations—but
    the origin of the word actually derives from the Greek mimēma, “that which is
    imitated.”


    Sure, when you think of memes, Grumpy Cat, Rickrolling, and Success Kid all come
    to mind. But the idea of a meme—an imitation of an idea that is relevant in culture—can
    also function as the core foundation of a creative strategy. This isn’t the same
    as making a video that will “go viral” (which, for the record, is a silly strategy),
    but rather to build on something that is popular in culture or that can be replicated
    in different variations, with various degrees of success.


    In 2016, for instance, several YouTubers in the fitness industry joined “The 10,000
    Calorie Challenge.” As the name suggests, the challenge involved documenting the
    process of consuming 5x the amount of the recommended daily amount of calories.
    Search the phrase on YouTube, and you’ll find thousands of videos, with millions
    of views, with an entire community of creators imitating each other and a clear
    opportunity for brands to create both integrated and dedicated videos and participate
    in the transmission of culture.


    Creative concepts can be developed to allow for imitation as well. In 2018, direct-to-consumer
    brand BURST Oral Care first teamed up with Khloe Kardashian to publish a series
    of stories and videos on Instagram demonstrating the effectiveness of their electric
    toothbrush. But rather than brushing her teeth, the demonstration of the product
    is carried out on a cob of corn covered in coffee grounds.


    When you see a video thumbnail of Khloe Kardashian, Chrissy Teigen, or one of
    the many celebrities and YouTubers that have since participated in The Burst Corn
    Challenge, and they pose with a toothbrush and corn on the cob covered in coffee,
    you can’t help but wonder what’s going on. A creative concept that can be replicated
    and imitated again and again, a challenge started as a brand collaboration, but
    has since been replicated organically by both customers and other YouTubers.'

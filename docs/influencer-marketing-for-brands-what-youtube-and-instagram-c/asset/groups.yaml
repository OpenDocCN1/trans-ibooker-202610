    # Chapter 7 | The Four-Step Influencer Marketing Framework


    **Key Questions**  How do you define your primary marketing objective? What are
    the four different marketing objectives for influencer marketing? Why are brands
    commonly picking the wrong KPIs for their marketing objectives? How do you come
    up with a strong creative idea for your campaign? How much should you be spending
    on influencer marketing, and how much does it cost?


    **Core Principles**  1. The Four-Step Influencer Marketing Framework. 2. Conversion
    is the outcome, not the strategy. 3. S.M.A.R.T. goals. 4. The four campaign types.
    5. The disconnect between marketing objectives and KPIs. 6. The seven questions
    that lead to creativity. 7. The insights-opportunity-idea questionnaire.


    The digital media landscape grows more complicated by the hour, and influencer
    marketing is no exception. There’s a need for structure and clarity. Without a
    framework, and a roadmap, you won’t be able to address how influencer marketing
    fits with your overall marketing strategy. It will hold you back from ramping
    up your ambitions and get other internal stakeholders aligned with your plans.
    This is where the Four-Step Influencer Marketing Framework comes into play.


    *First*, you’ll identify your primary marketing objective, target audience, and
    definition of success. *Second*, they’ll become input for platform strategy. *Third*,
    your platform strategy will guide creativity, creators, and content and, *finally*,
    outline your budget, goals, and media plan. This four-step process will provide
    the structure you need to turn influencer marketing into a scalable media channel,
    align stakeholders within your organization, and streamline your campaign planning
    process.


    # Step 1: Marketing objective, target audience, and definition of success


    The goal in the first step is to answer three questions. *What is your primary
    marketing objective? Who is your target audience? What is your definition of success?*
    Let’s go over each one.


    # Question 1: What is your primary marketing objective?


    Your objective should be a clearly defined goal, where you outline what you hope
    to accomplish. Challenge yourself to set an objective that is fully aligned with
    the overarching business and marketing strategy—and it’ll be easier to clarify
    how your influencer marketing plans align with the overarching goal of your business
    or long-term marketing strategy.'

    If influencers are indeed early adopters, they’d be more likely to belong to the
    innovators and early adopters category and less likely to belong to the early
    majority, late majority, and laggards category. Table 3-2 shows what we found.


    ## Table 3-2. Comparison of adoption (influencers, general population)


    | Group | Influencers | General Population | Difference |

    |---|---|---|---|

    | Innovators | 29% | 2.5% | +1040% |

    | Early adopters | 48% | 13.5% | +255% |

    | Early majority | 21% | 34% | -37% |

    | Late majority | 1% | 34% | -97% |

    | Laggards | 1% | 16% | -93% |


    The bell curve is suddenly compressed to the left, with 29% of influencers identifying
    as innovators and 48% identifying as early adopters (Figure 3-3). On the other
    side of the distribution curve, they’re as much as 96% less likely (2% vs. 50%)
    to belong to the late majority or laggards stages.


    ![](img/7ec2733715193510646aec32cc18284f_39_0.png)


    ## Figure 3-3. Social media influencers are more likely to be innovators and early
    adopters


    Compared to a population average, and research that led to discovering the diffusion
    of innovations theory, social media influencers are on the other hand 10× more
    likely to be innovators and 2.5× more likely to be early adopters.


    This is remarkable and suggests that influencer marketing can not only replicate
    the characteristics of a traditional mass media channel to spread information
    but also drive conversations between individuals that spread adoption.


    Social media influencers are, in short, early adopters. That being so, if you
    believe in the diffusion of innovations theory, they influence the early majority
    to a greater extent than members of late majority or laggards. The same research
    project revealed a few other interesting insights as well, among other things
    the answer to another important question: Who influences those with influence?


    ## Do you trust your doctor?


    “More Doctors Smoke Camels Than Any Other Cigarette” reads an iconic (and wildly
    misleading) 1946 print ad that ran for a total of 8 years in the United States.


    During that time, from the 1930s to the late 1950s, physicians, doctors, and models
    in white lab coats were frequently hired by the major tobacco companies to propose
    that their deadly products were “just what the doctor ordered!” while slapping
    a “doctors recommend” label onto their packaging.


    Fortunately, Big Tobacco are no longer allowed to apply any such practices in
    their advertising and are both banned from certain advertising tactics and heavily
    regulated by the FDA and other regulatory agencies. It’s obvious why the use of
    an authoritative figure like a doctor or physician was so effective at the time,
    but it made me wonder—do authoritative individuals in such professions have major
    influence on what products or services that are adopted by trendsetters, influencers,
    innovators, and early adopters, these days? And, if so, to what degree?


    Going back to the research project mentioned in the previous section, the next
    part of the questionnaire was focused on a specific category: Health and Wellness.
    The choice of this specific vertical came with a hypothesis: It’s tricky for participants
    to correctly identify what would influence their decision unless it sits within
    an applicable context. Influence is, after all, very contextual.


    You could, for instance, assume that your physician has limited influence on your
    preference of music, while having greater influence within the context of your
    health, and so on.


    But this is where the insights from the survey surprised us. See Figure 3-4.


    ![](img/7ec2733715193510646aec32cc18284f_41_0.png)


    ## Figure 3-4. Factors that influence product adoption


    While it’s true that influence is contextual, our friends, family, and—noteworthy—other
    social media influencers outrank both health professionals, personal trainers,
    and primary physicians combined!


    ## What’s going on?


    Lots have happened in the world since the 1960s. While Big Tobacco’s “doctors
    recommend” label has been replaced by a Surgeon General’s cancer warning, the
    insights first published in Diffusion of Innovations (1962, Rogers) couldn’t be
    more relevant today. Influence might be contextual, with trust functioning as
    an important variable in its equation, but do you remember the excerpt from the
    previous section in this chapter, on the importance of peer-to-peer-networks?


    The early majority depend on what’s conveyed to them from other people that are
    like them, people that have previously adapted the innovation, and as you’ve learned,
    social media influencers are likely to be innovators and early adopters—driving
    adoption not only among each other but the early majority in particular. You want
    to influence those with influence? Drive adoption among those that drive early
    adoption? Get with their friends, their family, and other creators that they follow.


    Remember these insights are specific to the group that answered the survey (where
    the average person is a social media user with, on average, 75,000 followers)
    and not necessarily reflected by the general population, to help you understand
    how to influence those with influence.


    ## Finding the right creators


    > “How do I find the right influencers for my brand?”


    There’s no lack of platforms and tools available that can help you find the right
    creators, or influencers, for your marketing needs. So why is it still such a
    challenging task? Back in 2016, my company set out to discover exactly how many
    talented and creative, influential, individuals that exists on Instagram and YouTube.


    Crawling the Web, in a similar fashion to how Google has built their search engine
    technology, we identified roughly 10 million creators on Instagram with more than
    1,000 followers and 2 million YouTube channels with 500 subscribers or more. Now,
    10 million people may seem like a lot, but on a platform like Instagram, with
    more than a billion active users, you’re actually looking for a needle in a haystack
    that sits within the top 1%.


    Moreover, most of those 10 million potential creators (or 2 million YouTube channels)
    will not be relevant for your brand. Consider this breakdown of YouTube channel
    categories in Table 3-3.



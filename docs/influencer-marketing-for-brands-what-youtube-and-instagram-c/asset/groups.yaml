    标签。*受众字段（Audience fields）*或*合并标签（Merge tags）*是与每个联系人（每位*影响者或创作者*）相关联的变量及其值。当你导入表格时，请确保将每一列（例如粉丝数）分配给名称相同或相似的对应受众字段。我们将在下一步中使用这些字段来个性化我们的电子邮件沟通。



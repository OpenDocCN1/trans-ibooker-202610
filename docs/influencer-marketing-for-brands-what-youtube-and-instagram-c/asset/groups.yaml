    # About the Author


    ![](img/7ec2733715193510646aec32cc18284f_5_0.png)


    With a passion for technology, marketing, and sales, Aron Levin co-founded Relatable
    to empower millions of content creators from all over the world. Clients include
    large consumer brands like Adobe, Google, Volvo, Ralph Lauren, Chiquita, and Heineken,
    but also brave direct-to-consumer start-ups like Lifesum, bioClarity, and MVMT
    Watches.


    Aron is also known for his background at King Digital Entertainment (maker of
    Candy Crush and 100+ other games) where he led Advertising Operations and his
    role as Director, Growth at music-streaming service Spotify. He spends his time
    in Los Angeles, California, and Stockholm, Sweden, with his wife and two kids.
    He is also the author of The Content Marketing Calendar and the Relatable “Inner
    Circle” Newsletter that is published weekly to 100,000+ marketing professionals.'

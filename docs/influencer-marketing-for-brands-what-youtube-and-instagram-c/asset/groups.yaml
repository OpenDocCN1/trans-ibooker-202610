  - '[PAGE 27]


    that has spent $339 billion over the last 17 years, while SpaceX has raised just
    $3.2 billion.


    On the other end of the spectrum, you’ll find podcasts and audio broadcasts.


    In 1964, when rock n’ roll was still considered unfit for public broadcast, Irish
    businessman Ronan O’Rahilly had to operate his offshore radio station, Radio Caroline,
    on international water—out of British authorities’ legal reach. With the exception
    of a commercial TV network, the airwaves were owned by the British Broadcasting
    Corp (BBC).


    The pirates would stream music from American top 40 stations, featuring artists
    like The Rolling Stones, The Beatles, and The Who, and would eventually become
    one of the most popular radio stations in the country.


    The pirate radio station was never illegal, but in 1967, the British government
    made it a crime to supply music, commentary, fuel, food, and water to any unlicensed
    offshore broadcaster, an act that, figuratively speaking, would eventually sink
    their pirate ship.


    Nowadays, anyone can be a pirate. No need to run from the law and worry about
    winter storms or food supplies. Got an interesting story? Find a quiet room, decent
    microphone, and some free audio software, and you’ll compete for attention against
    the largest broadcasters in the world.


    We’ve returned to both the golden age of space exploration and piracy—and a great
    time to be either an astronaut or pirate.


    # Conclusion


    The eyeballs are on other people, regardless of what social media platform they
    publish their content on.


    A few years ago, the eyes were on Blogger, WordPress, Twitter, and Facebook. Today
    it’s Instagram, YouTube, and Snapchat. Who knows where it will be in another few
    years from now or what the formats will look like, but I’d bet you that we’ll
    consume content from other people.


    Individuals have more publishing power than the largest media companies in the
    world had less than 20 years ago, and where the eyeballs and attention are, the
    advertising dollars likely will follow.


    And our job, if we wish to remain in our profession as marketers and digital advertisers,
    will be to follow along and play by the rules of the consumer. With that said,
    think of digital content creators not merely as “social media stars” but as modern
    magazines or TV channels.'
  - '[PAGE 28]


    You’re working with modern media publishers to advertise your message in a way
    that resonates with the expectations of the consumer. Remember the study from
    Kantar Millward Brown? These are consumers that are positive to ads that show
    real people in real settings (rather than celebrities) and are receptive to ads
    that tell an interesting story in social media, tutorials, and other types of
    sponsored content.


    So, you’ll want to shift your mindset and treat social media creators, and influencers,
    like media publishers and the investment like advertising spend.


    Over the next couple of years, brands are set to allocate between 5 and 10 billion
    of their media dollars to influencer marketing. It’s not a short-lived fad, but
    a tectonic shift in media consumption. But the phrase *influencer* is frequently
    misused and equally misunderstood. In the next chapter, you’ll learn that *influence
    is an outcome, not a profession*—and the three main levers that hold the power
    to unlock the full potential of influencer marketing for your brand.'

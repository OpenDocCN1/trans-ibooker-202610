  mdcn: "\n\n一个概念、想法、产品或体验易于谈论的另一个好处是，它最终会缩短病毒式传播周期。关于病毒式传播已经有很多论述，所以我不会对这个主题进行深入探讨，但“病毒式传播周期时间”本质上是指从你的信息被某人接收到的那一刻起，到那个人将消息传给下一个人的时间。\n\
    \n病毒式传播周期时间越短，传播得越快。\n\n## 原则 3. 分享起来感觉良好\n\n我最近发现了哈佛商业评论 1966 年的一篇文章，作者是 Ernest\
    \ Dichter。 在这篇 52 年前的文章《口碑广告是如何运作的》中，这位美国心理学家和营销专家，被誉为动机研究的之父，概述了他研究发现的结果：一个人如果“从中得到好处”，就更有可能谈论一个品牌。\n\
    \n但这如何与我们分享感觉良好可分享的东西的原因联系起来呢？\n\n他的研究揭示，我们从传播感觉良好可分享的东西中获得自我满足感，具体来说是从确认我们对产品、服务或体验的所有权和喜悦的角度——更具体地说，是我们对其的发现。\
    \ 不妨回想一下最近在餐厅、音乐会或度假时的经历，让你感觉非常好，以及你如何回到经历后立即告诉朋友们。 它帮助你重温并获得当时感受到的美好感觉，也让另一个人感觉良好。\n\
    \n## 原则 4. 唤起世界是一个令人惊叹的地方的感觉\n\n> 世界上有许多负面的事情——同时发生着很多可怕的事情，有很多问题需要解决——但生活不能仅仅是解决一个又一个可悲的问题。\
    \ 需要有能激励你的事物，让你高兴地在早晨醒来并成为人类的一部分…\n> \n> —Elon Musk\n\n成功唤起世界是一个令人惊叹的地方的感觉的想法——尤其是表现良好的品牌、服务和产品——往往会唤起\
    \ precisely 这些感受。 这也延伸到小规模和宏大规模的人。\n\n肯尼迪通过宣布他将把人类送上月球，唤起了世界是一个令人惊叹的地方的感觉。 Elon\
    \ Musk 继承了他的脚步，并宣称他的目标是在火星上建立一个自给自足的城市。\n\n唤起世界是一个令人惊叹的地方的感觉这一原则不仅仅适用于那些要去太空的人——这个想法也可以从个人、品牌和讲故事的角度在微观尺度上应用。\
    \ 不妨看看 Instagram 上的 People Are Awesome，你就会看到数百万人如何参与、产生共鸣并分享围绕第四原则构建的故事。\n\n##\
    \ 原则 5. 开始一场对话\n\n最好的口碑是在办公室饮水机旁、与朋友共进晚餐时或在早晨通勤时被 overheard 的话题。 会引发讨论、挑起辩论，甚至使受众两极分化的对话话题。\n\
    \n围绕开始对话以放大其获得的媒体和口碑而构建的产品、服务和创意广告活动不计其数——当我想到这一第五原则时，浮现在我脑海的是我 2016 年与团队一起从事的一个营销项目。\
    \ 一个相当不寻常的公关活动，带有影响者营销的元素。 对话的开端和话题是什么？\n\n> “由避孕套材料制成的长跳服能否让运动员表现更好？”\n\nSKYN\
    \ 避孕套的宣传噱头和营销活动恰逢 2016 年奥运会。 受 Speedo 创纪录的高性能泳衣的启发，该泳衣因模仿鲨鱼皮而闻名（后来被奥运会禁止），SKYN\
    \ 设法利用了已经发生的对话。\n\n而且虽然该活动并没有推广其核心产品或避孕套的独特卖点，但它在每个人都在谈论奥运会的时候，开始了关于性能和替代材料设计（非乳胶产品，适合过敏或敏感人群）的对话。\n\
    \n> “当运动员跃入空中时，[跳服上的] 翻边会打开，产生向上的升力，有助于长跳运动员在空中停留更长时间，”他在接受 Complex 采访时解释道。 “这件服装尚未正式测试过\n\
    \n看，我们不会告诉朋友我们喜欢的产品和服务。 我们谈论的是我们无法想象的更伟大的事物。\n\n“你看到了吗”，“你听说过吗”，“你不会相信”，“看看这个”，和“你能想象吗”才是会出现在餐桌上的话题。\
    \ 而这很重要，因为 90% 的口碑发生在离线。³¹\n\n如果你能将你的活动、品牌、产品或服务（通常只是上述内容的其中一个方面）转变为餐桌话题，因为它超出了预期，你会通过口碑看到爆炸性增长。\
    \ 而且，这里是如何做到这一点的。\n\n## 放大已经进行的对话\n\n在核心层面，超越客户期望的关键在于弄清楚你的消费者到底在说什么（他们的朋友又会与他们的朋友分享），并放大该信息。\n\
    \n一旦你理解了口碑循环，你就会理解如何将产品营销转变为口碑的地点、方式和原因。\n\nPepsi Max 在 2017 年的一项影响者营销活动中应用了这一原则，其中每位参与者都分享了\
    \ Pepsi 和姜令人惊讶的绝佳组合——以及它如何超出他们的预期。 一个大胆的承诺，结果与那些喜欢 Pepsi Max 和姜味的人产生了很好的共鸣（原则\
    \ #7）。\n\n回到我在 Spotify 的亲身经历，我想分享一种我用来逆向工程这一第七原则的方法。\n\n现在，应该指出的是，有一些事情我可以透露，而另一些我不能，但应该不会让人感到惊讶的是，像\
    \ Spotify 这样的订阅业务和像 King Digital Entertainment 这样的游戏发行公司的增长并不是随机的。\n\n然而非常强大的是，我敦促你为你的品牌、产品或服务所做的，是深入研究驱动口碑的定性和定量方面，以了解它如何应用于你的核心产品、服务或品牌，或应用于特定活动、产品发布、重新定位的开发，或在进入新的目标细分市场或市场时。\n\
    \n例如，在 2014 年，Spotify 用户增长的很大一部分是由口碑驱动的——虽然可以追踪推荐和流量来源，但更强大的方法是问你的用户为什么他们购买了你的产品，订阅了你的服务，或下载了你的应用。\n\
    你希望超越用户或客户的来源，了解如何和为什么。\n\n## 如何确定驱动你有机增长的因素\n\n为自己设置一个调查平台，如 SurveyMonkey³² 或\
    \ Typeform³³，并向过去 30 天内购买了你产品的用户或客户发送电子邮件。\n\n电子邮件应简短扼要，并回答你为什么进行调查以及调查参与者能获得什么好处（例如，改善他们的体验或使其更相关并与他们的期望保持一致）。\n\
    \n你的第一步是弄清楚你的客户来自哪里。 第一个问题的三个示例：\n- 1. “是什么让你注册我们的服务？”\n- 2. “是什么让你购买我们的产品？”\n\
    - 3. “是什么让你下载我们的应用？”\n\n列出最常见的推荐来源，并让调查受访者选择一个主要来源。 几个示例（根据你的产品进行调整）：\n- 1. 我看到了你的产品的广告。\n\
    - 2. 一个朋友推荐了你的产品。\n- 3. 我在 Google 上找到了你。\n- 4. 我在新闻中读到过你。\n- 5. 其他（简短的文本答案）。\n\
    \n如果你第一次运行这种调查，你希望在此处包含第五个选项，以了解是否有你遗漏的推荐来源（或以与消费者在脑海中感知的方式不同的方式表述你的选项）。\n\n不用担心，你的目标不是建立一个可靠或科学的归因模型。\
    \ 你的目标是识别用户如何感知他们对你的产品的发现和首次体验。\n\n"

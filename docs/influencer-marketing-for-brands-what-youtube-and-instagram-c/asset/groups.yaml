    ## 游戏实况


    这类视频在游戏社区中非常流行，原因显而易见。在这类视频中，玩家会通关多个关卡或整款游戏，通常会配合对自己体验的解说和评价。


    ## 品牌/产品宣传


    在视频开头和结尾提及你的品牌、产品或服务，例如：“我与[品牌名]合作，为你带来这支视频。”


    ## 最爱推荐


    创作者围绕一个他们热衷且当下热门的话题制作整支视频，例如：“我最爱的返校好物。”与穿搭展示视频类似，你可以利用YouTube的搜索建议来生成视频主题创意。


    ## 撰写有效的简报


    成功开展网红营销活动或项目的基石之一，是向网红和创作者撰写一份有效的简报。以下是一份问题清单，你需要回答这些问题，以帮助合作方理解你对他们有何要求。更多信息，请参阅第6章“规模化的一对一关系”中的“受沟通约束”部分。


    - 1. 你和你的公司是谁？（介绍）

    - 2. 你的公司、产品或服务是做什么的？（背景）

    - 3. 你为什么联系我？（背景语境）

    - 4. 你期望我做什么？（简报）

    - 5. 什么时候要完成？（承诺）

    - 6. 我们将如何合作？（流程）

    - 7. 我会得到多少报酬？（酬劳）

    - 8. 你希望我接下来做什么？（行动号召）

    - 9. 这将如何帮助我为我的受众创作内容？（益处）

    - 10. 这会不会损害我的事业或个人品牌？（风险）

    - 11. 对我还有哪些我应该知道的额外好处吗？（益处）

    - 12. 我怎么知道我可以信任你？（风险）

    - 13. 你们还和谁合作过？（社会证明和社群）

    - 14. 这会花费我多少时间？（承诺）

    - 15. 我什么时候能拿到报酬？（条款）

    - 16. 你的营销目标是什么？（目标）

    - 17. 你的产品/服务有什么特别之处？（独特卖点）


    ## 简报模板


    在过去的三年里，我的公司开发了一套久经考验的简报模板，成功应用于Instagram上数千次合作，几乎涵盖你能想到的所有品类和垂直领域。以下是我们使用的确切邮件模板、简报各部分的组织方式，以及如何回应上述17个问题。


    主题：受邀参与与[品牌名]的Instagram付费合作


    嗨，@创作者，


    我是来自[你的公司]的[你的名字]。


    [简短的两句话介绍，以引发足够的兴趣让对方继续读下去。你可以在此提及你合作过的其他创作者或网红，但要尽量简短。]


    如果你感兴趣，请继续阅读所有信息。在底部你会看到一个按钮，点击即可报名参与。如果你有任何问题，欢迎随时联系。


    /亚伦


    —与[品牌]合作邀请—


    ### 关于[品牌]


    用两句话简要介绍你的品牌。如果你在推广某个特定产品，请描述其核心优势和独特卖点。


    ### 第4章 | 创意的艺术与科学


    ### 关于这次活动


    用两段话说明活动内容。活动的背景是什么？这是否是更大营销计划的一部分？概括来说，创作者需要做什么？（你将在简报的后续部分提供详细说明。）这一部分应该有效地“推销”活动理念，帮助创作者判断你所提议的内容是否足够相关和有趣，值得他们继续读下去。


    ### 活动目标


    说明活动的目标，以及你希望通过合作达成什么成果。你将如何定义活动的成功？


    ### 你的任务说明


    这些信息是针对Instagram账号@创作者的所有者量身定制的。


    ### 你需要做到


    - 创作者需要做什么来实现活动的创意简报？使用你的产品？安装应用？访问特定地点？等等。

    - 按照以下指南创建[#]条快拍和[#]条帖子的内容。

    - 在[日期]之前将内容发送给我们审批。

    - 在[日期]发布已批准的内容。

    - 在你的帖子中包含以下内容：#合作 #活动 @提及。

    - 任何信息流帖子需在你的账号上保留30天。任何快拍需保留完整的24小时。

    - 你不得在此活动发布日期前后24小时内为其他品牌发布任何赞助帖子或快拍。

    - 你的文案应使用你平时发帖所用的语言。

    - 遵循以下指南非常重要。👇👇👇


    ### 作为交换，你将获得


    - 参与此次活动，你将获得[金额]报酬。你需要自行承担社交平台费用和其他税费。请联系当地税务部门了解具体方式。

    - 当我们确认你已遵循所有指南后，将支付这笔金额。届时你也会收到所有关于如何收款的信息。

    - 请允许最多14天到账。


    ### 你的[总数量]条帖子指南


    信息流帖子


    - 在项目符号中包含详细说明，以提供创意指南。

    - 提及图片中应包含什么、避免什么。


    文案


    - 以#广告或同等内容开头。

    - 提及[话题点]。

    - 强调[重要注意事项]。

    - 行动号召：鼓励你的粉丝[行动号召]。


    快拍（4段以上视频片段，或你要求的任何形式）


    - 创意方向是什么？示例：展示一些“幕后花絮”，比如你如何[创意方向...]。

    - 行动号召：鼓励你的粉丝[行动号召]。

    - 请务必在所有片段中包含话题标签和上滑链接。


    ### 灵感


    附上一个文案示例或之前成功合作的链接。


    最后，附上一张包含九张灵感图片的3×3灵感板。


    要加入活动，[点击此处/回复我/或其他行动号召]。


    这个邮件模板（当然会根据每场活动的具体情况进行不同程度的调整）已成功应用于Instagram和YouTube上超过10,000次合作。它还能进一步改进吗？当然可以，但它每次都能完成任务。


    我知道当品牌方和营销专业人士看到这个模板时，可能会觉得简报过于详细、过长，没人会读，等等。首先，这是错误的。我亲眼目睹了这个模板在数千次合作中的使用情况。其次，创作者经常表达他们的感激之情，因为他们的疑问能在第一时间得到清晰完整的解答。为什么？因为它以结构化、易读的格式回应了全部17个问题。


    请记住，一旦有人确认想与你合作，你可以补充关于产品的额外信息以及活动的详细注意事项；只要确保活动的范围保持不变即可。


    ## YouTube创作者创意简报


    YouTube在其官方品牌和创作者指南中，发布了一份六步指南，用于撰写有效的创作者创意简报，可在其网站上查阅。¹³ 他们建议品牌包含以下基本要素：目标、洞察、风格与信息、交付物、包含内容以及创意控制。


    ### 目标


    活动的目的是什么？你希望达成什么？第一个要素的关键考量包括你的挑战、目标，以及用于制定策略的洞察。YouTube建议你尽可能清晰具体，并聚焦于创作者在整体活动中所扮演的角色。此外，提供竞争基准并定义你用来衡量活动是否成功的指标也会有所帮助。


    ### 洞察


    你能提供什么关键洞察，以便创作者为其视频开发引人入胜的故事线？如果可能，请包括洞察、数据、市场或消费者洞察，以及你的品牌具体希望触达的人群。


    ### 风格与信息


    你的品牌个性是什么？是否有你希望创作者在视频中包含的话题点、关键信息、措辞或词语？简报的这一要素将有助于确保品牌一致性。



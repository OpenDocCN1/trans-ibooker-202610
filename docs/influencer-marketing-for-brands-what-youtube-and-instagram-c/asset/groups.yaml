    ## 一致性、创造力与社群


    这些专家小组成员是根据一个重要标准精心挑选出来的：拥有极高参与度的受众——至少高出平均水平 50%。换句话说，这些创作者不仅建立了庞大的粉丝群，而且他们的受众更有可能关注他们的内容。


    当被问及对其他创作者最重要的建议是什么时，有两个建议反复出现。


    保持一致性（或者找到自己的细分领域）以及与社群互动。


    回顾之前提到的常见错误清单，这些建议似乎是同一枚硬币的两面。关于一致性，一位创作者这样建议：“我建议他们首先把重心放在内容和质量上，而不是其他任何事情。人们点击你的主页时，第一眼就会决定是否关注你，因此维护一个形象或‘品牌’会让你的作品展示得更加井井有条，而如果人们
    1）明确知道能从你这里得到什么；2）欣赏你的质量和一致性，他们就更有可能关注你。”


    研究中经常提到的另一个常见错误是缺乏社群建设。“很多品牌会在推文中向粉丝提问，却无视粉丝向他们提出的问题。这是一个巨大的错误，表明他们根本不关心用户，”一位网红评论道。


    现在你已经站在他们的角度思考过，也更清楚地了解了创作者群体喜欢和不喜欢所关注品牌的哪些方面，是时候更进一步，揭示他们最大的问题是什么了。


    还记得我们的论点吗？提升创作者从与你的品牌合作中获得的价值，你就能提高自己的投资回报。但除了显而易见的额外金钱报酬之外，你如何提升他们的价值？解决他们的问题和挑战。当你做到这一点时，你交换的东西比金钱更有价值。作为你创造价值的回报，你将成为一个无价的合作伙伴。


    ## 超越金钱的价值


    作为在线内容创作者/网红，你面临的头号挑战是什么？如果你知道这个问题的答案，并能围绕解决他们的问题来制定你的网红营销策略，你将赢得创作者群体的心，并进而有机会将网红营销转化为你最有价值的分销渠道。为了省去你的麻烦，我们在过去几年里采访了数百位创作者和网红，并整理出了以下清单（按相关性排序）。


    ### 作为在线内容创作者/网红，你面临的头号挑战是什么？


    1. 创作高质量内容

    2. 击败 Instagram 算法

    3. 与粉丝互动

    4. 触达更广泛的受众

    5. 想出新点子

    6. 找到时间

    7. 获得与品牌的合作

    8. 脱颖而出、保持原创

    9. 创造真实且引人入胜的合作

    10. 频繁发布（每天发布）


    仔细观察，会发现两个清晰的主题浮现出来——内容策略（第 1、5、8、9 项）和受众互动（第 2、3、4、10 项）。换言之，如果你能构建一个以帮助网红创作高质量内容、构思新想法、脱颖而出并保持真实与吸引力为核心的内容策略，你就创造了远比金钱报酬更有价值的东西，而由此，你们双方都会看到这段合作关系的更大价值。同样，如果你能制定一个极具吸引力的创意简报或活动方案，例如通过交叉推广或分发（受众互动）来带来更多曝光，你就是在围绕几乎所有人都公认的首要痛点来构建策略。


    你注意到其中两个挑战不属于这两个主题吗？第 6 项“找到时间”和第 7 项“获得与品牌的合作”。我们来谈谈这两项。


    通过遵循第 6 章“规模化的一对一关系”中概述的步骤，你将掌握高效的艺术并消除限制——你会主动表明自己尊重合作对象的时间和精力。第二个挑战显然可以通过与你的品牌合作来实现，但还不止于此。如果你能展示出与你的品牌合作可能会带来额外的合作机会，你就能立即提升你们关系的价值。


    ## 品牌自评


    回顾这份清单。按 1 到 10 分打分，评估你的品牌在解决每项挑战方面的可能性——无论是总体而言，还是针对某个特定的活动简报。是什么会改变这个分数？


    ## 品牌与活动案例


    为了将这些洞察置于营销背景中，你现在将看到五个不同的公司案例，它们在产品、品牌和活动中实施了以创作者为中心的策略，以提升超越金钱的价值。


    ### Sugar Bear Hair


    www.sugarbearhair.com


    **业务内容：** 电商、头发矿物质产品


    **营销挑战：** 商品化，缺乏故事性


    **解决的痛点：** 高质量内容、真实合作、想出新点子


    **以创作者为中心的策略：** 通过以允许参与网红以不同创意方式表达对产品喜爱的方式设计产品，Sugar Bear Hair 得以挖掘庞大的创意人才库，并给予他们自由去构思新想法和创作高质量内容——即使这些内容都以他们的产品为核心。


    ### YouTube Music


    music.youtube.com


    **业务内容：** 优质音乐流媒体服务


    **营销挑战：** 市场饱和，用户对直接竞争产品有强烈偏好


    **解决的痛点：** 脱颖而出、保持原创、与粉丝互动、找到时间


    **以创作者为中心的策略：** YouTube Music 让艺术家和网红邀请他们的粉丝参加独家发布活动。这创造了一种体验，让参与者忍不住去传播真实的故事，并将所见所闻告诉其他人。


    ### Museum of Ice Cream


    **以创作者为中心的策略：** Museum of Ice Cream 是为 Instagram 而生的。与传统博物馆不同，展览的每个部分都经过设置，邀请参观者创作富有创意且高质量的内容。由于门票供不应求，Museum
    of Ice Cream 创造了一个让参观者（以及网红）能够创作独特内容和故事的场景。


    ## 创作者想要什么：品牌合作的决定因素


    以创作者为中心的拼图的几个部分开始各就各位。在本节中，我们将深入探讨以创作者为中心的网红营销方法的另一个重要方面，即创作者对你的品牌有什么期望、在寻找什么！*获得与品牌的合作*在网红的常见挑战清单中排名第七——但事实证明，并不是来自任何品牌的任何合作都可以。在
    2017 年的一个系列采访⁵中，我们采访了 81 位有影响力的社交媒体创作者，以了解他们每月会收到多少个品牌的合作邀约。结果呢？每月 10 到 100 个提案，平均
    20 个。显然，机会并不缺乏。然而，这些品牌邀约大多无人回应。这是为什么？


    ### 价值观与个人品牌契合


    品牌安全，以及确保你的品牌内容在一个规避风险、语境适当的环境中展示，是从事网红营销的营销人员经常提到的担忧。因此，品牌理所当然地投入时间和资源，以确保他们与正确的人合作。


    但请注意，这扇门是双向的，*个人品牌契合度*实际上是网红决定是否与你的品牌合作的首要考虑因素⁶。见图 5-1。


    ![](img/7ec2733715193510646aec32cc18284f_98_0.png)


    **图 5-1.** 网红在决定与哪些品牌合作时最看重什么？


    网红营销公司 AspireIQ 的研究发现，在对其平台上的 200 位网红进行调查后，个人品牌契合度（72% 的受访者）比金钱报酬、品牌知名度和免费产品价值加起来都更重要。这一洞察也反映在我自己公司发布的《2020
    年网红健康报告》中——我们发现*核心价值观一致*是与品牌合作的首要决定因素。见表 5-1。


    **表 5-1.** 品牌合作的决定因素


    | 因素 | 受访者比例 |

    |---|---:|

    | 他们付多少钱 | 14% |

    | 我知道他们的产品/服务有效 | 27% |

    | 我之前听说过他们的品牌 | 3% |

    | 他们的核心价值观与我的一致 | 34% |

    | 他们给我创作自由 | 23% |


    两项研究彼此独立，却都揭示了另一个有趣的洞察：*你的品牌价值观比你有多出名更重要。* AspireIQ 的调查中只有 4%，2020 年《网红健康报告》中只有
    3%。这是个好消息



    另外还有四个人虽然没有点击，但在观看后四天内仍然下载了游戏。Google 将这类用户称为“非追踪多数”，而这个 4 倍乘数恰好与我们在一个完全不同的垂直领域中使用截然不同（但同样准确）的方法所得出的结论吻合。


    请注意，你的“非追踪多数”占比会有所不同。4 倍听起来不错，但它并非放之四海而皆准（我见过从 1.2 倍到 12 倍不等的差异），而理解你自己的归因指标至关重要。无论你的乘数是多少，你现在都已经看到了“非追踪多数”会给你的业务带来的巨大好处，尤其是当你在推动应用安装或电商销售时。


    ## 下载疲劳


    同一项研究还揭示了另一个有趣且相关的见解，它直接适用于那些正在借助 YouTube 推动销售、应用安装或网站访问量的品牌。在推广了一段关于手机游戏的网红视频后，如果同一创作者的第二段视频在
    12 个月内发布，其下载量最高只有第一段的三分之一。


    这并不排除长期合作或与同一创作者制作多支视频的可能性，但它确实有助于预测这些努力的成果。请记住，如果一位创作者的第一支视频表现非凡，即使第二支视频的结果“差”到只有原来的三分之一，仍有可能优于平均水平。最终需要你来判断。


    换一个角度看，第二支视频对于其他营销目标而言也可能是一种有效策略，例如重新激活不活跃或已流失的用户群体。


    ## YouTube 内容分发的长效性


    虽然与 YouTube 创作者合作需要更长的准备时间、更多的工作量和更大的前期投入，但该平台提供了一项世界上任何其他付费媒体渠道都无法匹敌的优势：无限的生命周期。当创作者在自己的频道上发布一段以你的品牌为特色的视频时，该视频的成本通常按其发布后前
    30 天内预计累积的观看量来计算（参见“行业费率”，第 5 章：以创作者为中心的策略）。


    但与其他广告方式不同（甚至包括 Instagram，上面大多数内容在大约一周后就几乎不再获得曝光），YouTube 上的视频在首次发布后很长时间内仍会持续累积观看量。第
    30 天并不代表你的营销活动结束，而恰恰是开始。请考虑以下假设：


    ### 第 1 个月


    - 视频成本：$10,000

    - 30 天预计观看量：100,000

    - 30 天预计单次观看成本：$0.10


    你启动营销活动，并按预期在 30 天后达到了目标预估观看量。但随后，一件强大的事情发生了——视频会在 YouTube 的搜索、发现和推荐中继续累积观看量，当视频达到
    200,000 次观看时，你的有效单次观看成本将减半。这可能会在 60 天、80 天或 180 天后发生，但请放心，这种长效性对你有利，而不是有弊。营销行业中最接近的类比是搜索引擎优化——你前期投入制作内容，随着时间推移获得自然访问流量；只不过与搜索引擎优化不同的是，你还能看到初期的流量爆发。总体而言，虽然我应该指出结果取决于多种因素，但你可以假设增长轨迹类似于表
    8-1。


    表 8-1. YouTube 视频的月度环比增长


    | 月份 | 环比增长 | 示例观看量 |

    | --- | --- | --- |

    | 1 | 100% | 100,000 |

    | 2 | 30% | 130,000 |

    | 3 | 12% | 142,000 |

    | 4 | 12% | 154,000 |

    | 5 | 10% | 164,000 |

    | 6 | 7% | 171,000 |

    | 7 | 7% | 178,000 |

    | 8 | 5% | 183,000 |

    | 9 | 5% | 188,000 |

    | 10 | 5% | 193,000 |

    | 11 | 5% | 198,000 |

    | 12 | 5% | 203,000 |


    将你的目标获客成本、平均视频点击率⁴、自然流量提升⁵以及网站（或应用内）转化率纳入考量，你就有了一个为你在 YouTube 上的网红营销效果进行建模的工具。与传统广告不同，每条视频的长效性是一个新的维度，也是一种不公平优势——现在，你可以利用时间来改善营销投资回报率，对抗传统广告和网红营销广告成本的不断上涨，或者同时实现以上目标。


    ⁴ 2019 年 9 月，平均 1.5%–5%，不包括自然流量提升。


    ⁵ 通过识别你的非追踪多数。


    ## 借助品牌内容广告扩大你的网红营销效果


    在任何 24 小时的时间段内，被生产出来的内容远多于我们在同一时间内可能消费的内容。内容生产的供给远远超过了对注意力（或一天中的时间）的需求。


    从许多方面来看，这对消费者是件好事，因为他们的选择更多，内容生产的门槛也更高了。理论上，这也不应对生产者产生任何经济影响，因为他们较低的单位成本应该会被更高的产量所抵消。然而这只是理论——在实践中，我们一天只有
    24 小时，因此我们对内容的需求严格限于我们能够消费的量。但消费者并不是用金钱为内容付费，而是用注意力来为内容付费，于是突然之间，一种注意力经济应运而生。


    你看，如果你恰好成长在 70 年代、80 年代或 90 年代，那么你很可能记得你在电视上看到的最早的那些广告。这并不是因为那些广告拍得有多好，而是因为需求（注意力）超过了供给（内容），而我们也慷慨地付出了自己的注意力。那么从那时到现在发生了什么？当然是个人电脑、互联网和智能手机。根据经典经济学理论，这样的事件被称为正供给冲击。技术提高了生产效率，从而增加了产出。


    同样简单的经济学理论也适用于局部层面。当社交媒体上的内容多到我们无法消费完时，像 Facebook 这样的公司就不得不构建算法和过滤器，帮助筛选争夺我们注意力的信息。否则，社交媒体就会失去其相关性，我们会转向其他地方。


    Instagram 就是一个典型的例子。当数千万用户在这里生产和消费内容时，把所有内容展示给所有人是合理的。然而，当用户达到数亿，而且每个人都拥有了更多的关注者和关注对象时，内容供给突然过剩，这促使
    Instagram 重新定义了其平台上的内容消费方式。⁶ 公告称，所有帖子仍然还会在那里，只是顺序不同。但如果用户基数再翻倍至十亿，并且技术进一步升级，实现更高效的内容生产（新的叙事形式、直播、美颜滤镜、更好的智能手机摄像头和更快的网络速度），就会迎来又一次*正供给冲击*。但我们的需求（注意力）并没有增长——这意味着你必须从别人那里夺取注意力，才能扩大自己的受众。


    *这就解释了为什么像 Instagram 和 Facebook 这样的平台上的自然分发量在下降。基于这些基本的供需法则，我预测，在未来几年里，创作者和品牌都将持续看到自然触达和分发量的下降。取决于你的营销目标，这或许会成为你最终需要应对的挑战，也或许不会。同时，这也为创作者和品牌催生了新的机遇。*


    2019 年，Instagram 加大了对品牌内容工具的投入，帮助企业将其网红营销活动的覆盖范围扩大到最初的自然触达之外。通过将原始帖子或快拍的分发规模扩大到创作者的受众之外（定向特定受众，并使用其广告平台中的工具衡量效果），这种方法让品牌、创作者或其网红营销合作伙伴能够在原始活动之外使用营销内容。虽然类似的策略（通过复杂的变通方式）以前当然也是可行的，但
    Instagram 提供的整套平台和官方支持让实际操作变得非常顺畅。我预测，当你读到这部分内容时，将会有更多工具可供你使用。


    我强烈建议你熟悉 Instagram 的官方文档⁷，因为此处概述的分步说明在你阅读时可能已经有所变化。无论如何，我将简要介绍工作流程和体验。


    首先，这一策略要求你与参与活动的创作者和网红充分协作——这也应该是你创意简报的一部分。设置很简单，但要使其生效，仍需一步一步地执行。不过要记住——用额外的媒体预算放大他们的品牌帖子和快拍，并让更大的受众看到，这是一件双赢的好事！


    其次，在发布帖子或快拍时，创作者应使用官方品牌内容工具，并将你标记为其业务合作伙伴。要让这生效，你的品牌需要在自己的账号中批准该创作者。在发布快拍或帖子时，创作者还必须选择“允许业务合作伙伴推广”，这样你才能推广他们的帖子。



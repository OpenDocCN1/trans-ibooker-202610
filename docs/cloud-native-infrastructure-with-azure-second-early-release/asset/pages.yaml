- pgno: 181
  md: '# Prometheus server


    Responsible for scraping the metrics and storing them in a time series database.


    # Client libraries


    Used to instrument application code and send the extracted metrics data to the
    Prometheus server. Client libraries are available in different languages, including
    C#, Python, Java, and Ruby.


    # Pushgateway


    Used to support short-lived jobs.


    # Exporters


    Run alongside applications that cannot be instrumented directly, such as HAProxy
    and statsd, to extract metrics which can be sent to the Prometheus server in the
    desired format.


    # Alertmanager


    Receives alerts from the Prometheus server and bubbles up the notifications efficiently.
    The Alertmanager does this in a number of consistent and effective ways:


    +   - It groups alerts of a similar type so that fewer alerts are sent across
    during a large outage.

    +   - It can throttle the notifications sent to the receiver system.

    +   - It allows the suppression of notifications for selected alerts if related
    alerts are already firing.


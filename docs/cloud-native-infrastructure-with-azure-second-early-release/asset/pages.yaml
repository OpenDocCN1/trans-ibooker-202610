- pgno: 331
  md: '# Chapter 10. Getting the Message


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 10th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at rfernando@oreilly.com.


    In this chapter, we will discuss the benefits of messaging in cloud native architectures
    and provide a brief history of messaging patterns so that you can understand their
    origin and evolution of interprocess communication to cloud native distributed
    systems.


    By the end of this chapter, you will be able to deploy the most common messaging
    implementations used in cloud native applications and microservices today. We
    will compare the capabilities of mature messaging solutions such as RabbitMQ and
    Kafka that have been in production for years, and we will implement common messaging
    patterns in NATS. Given the book’s focus on Azure, you will be able to manage
    Azure messaging offerings using Terraform. We will also provide small code samples
    in Python showing how easy it is to produce and consume messages and to validate
    proper deployment of the messaging infrastructure for both Azure and NATS.


    # The Need for Messaging


    The need for application and system components to pass messages in near-real time
    and exchange data is not unique to the cloud, or new to container-based microservices
    or even networked client/server applications. Anyone who has piped together commands
    at a shell prompt has used interprocess communication, which is a basic form of
    messaging.


    Even the most primitive operating systems provide the ability to pass messages
    and share data. This problem space (and various solutions) dates back to the 1970s
    and continued to evolve in the 2000s, especially in the financial services industry,
    where there was a need to communicate stock information to customers, exchange
    data between service providers and other institutions, and process orders. Unlike
    client/server interactions we most commonly encounter on the internet or in enterprise
    applications, messaging relies on an intermediary (called a broker) to sit between
    the sender and the receiver that generally does not follow the request-response
    paradigm so that communication becomes asynchronous. We’ll discuss why this is
    important shortly.


    As the cloud matured in the 2010s, the use of messaging managed services, such
    as Amazon SQS and RabbitMQ servers running on virtual machines, played a role
    in increasing the reliability and scalability of websites. By the mid-2010s, Kafka
    became a popular solution for messaging use cases, including log aggregation,
    clickstream analytics, and data pipelines. NATS is another lightweight and high-performance
    messaging implementation that has become popular for edge analytics and Internet
    of Things (IoT) use cases, due to its ability to scale down to smaller-footprint
    devices and its ease of operability.


    Queues and messaging publish/subscribe (affectionately known as “pub/sub”) patterns
    were among the early managed services offered by cloud providers, and Azure has
    multiple messaging services, including Azure Event Grid, Azure Event Hubs, and
    Azure Service Bus, which provide standards-based protocols and implementations
    that are compatible with Java, .NET, Python, and other SDKs. These services allow
    migration of existing workloads and/or development of new cloud native applications.


    Before we dive deeper into the history of messaging, the following are reasons
    why and when you would need to implement messaging either within your infrastructure
    or to be used by applications:'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Improves performance and throughput


    Using messaging patterns (whether simple queues or more complex publish/subscribe
    patterns) allows horizontal scalability and parallelization of workloads. Scaling
    producers, consumers, and brokers based on load is possible through virtual machine
    autoscaling approaches such as Azure Virtual Machine Scale Sets, through Kubernetes,
    or by the cloud service.


    # Increases resiliency


    The ability to have multiple senders (producers) and receivers (consumers) that
    exchange messages provides better resiliency. Furthermore, the fact that messages
    can accumulate in a queue (the senders keep sending) while your consumers are
    not processing ensures that messages are not lost and that you can perform maintenance
    on your workers. Depending on the queuing pattern, the system can survive connectivity
    failures between components as well as application failures in producers or consumers.


    # Ensures asynchronous operation


    Although the dreaded 502 gateway timeout errors on Apache and Nginx occur less
    frequently today, when we see them we are reminded of how early websites hit scalability
    problems when a large number of requests overwhelmed the ability of web servers
    to respond. The same principle applies when a database client connects to a backend
    database and the database runs out of threads or exhausts. When workers autoscale
    based on queue depth, the result is high rates of message processing responding
    to demand. Message queues also enable smaller-scoped service boundaries and are
    common in microservices application architectures. Lastly, because applications
    are not directly communicating (as in the case of RPC or even REST APIs), they
    can focus on the data that is being exchanged, assuming they are implementing
    a standard messaging protocol.


    # A Sample Messaging Use Case: Log Ingestion and Analytics


    To illustrate some of the real improvements that introduce message queues into
    an architecture, we will describe a log analytics software as a service (SaaS)
    solution that we can build and run. Log and event processing is a common use case
    for implementing messaging and streaming services.


    The product will collect system and security logs from on-premises devices and
    parse and ingest them into a full-text search engine that allows security analysts
    to detect and find attacks on their network. We’ve dramatically oversimplified
    the description of this platform, but the following examples show the benefits
    of introducing message queues that we listed earlier.


    Let’s walk through three generations of this product’s architecture and explore
    how the use of messaging evolved.


    # Generation 1: Without Queues


    The first generation of the solution was a real-time collection of events from
    an on-premises appliance that was posted to a load balancer which distributed
    logs to multiple ingest and search nodes (log collectors), as shown in Figure
    10-1. This was a tightly coupled architecture in which large numbers of events
    being collected (based on customer usage patterns) could cause slowdowns in ingestion,
    which could, in turn, cause challenges in searching the UI.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_333_0.png)


    Figure 10-1. Generation 1, without queues


    # Generation 2: With Cloud Queues and Object Storage


    The second iteration of this solution used cloud provider object storage and message
    queues to ingest message bundles, instead of directly sending to an ingest API.
    On each index/search node, there was a lightweight worker process that pulled
    messages off the queue. The worker process contained the path to the log bundle
    in the object storage, as shown in Figure 10-2.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_333_1.png)


    Figure 10-2. Generation 2, with cloud queues and object storage


    Both of these solutions had a monolithic application architecture which was addressed
    in the third generation of the platform. This generation also moved the parsing
    logic to the cloud and reduced the operational overhead for the on-premises customer
    teams.


    # Generation 3: With Memory-Based Pub/Sub Queuing


    The third generation of the platform implemented a microservices architecture
    and high-performance memory-based queues that allowed individual services to process
    messages to provide advanced analytics using a document database instead of the
    previous RDBMS-backed search engine. This separated the failure and performance
    domains and allowed for horizontal scaling of the system, as depicted in Figure
    10-3.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_334_0.png)


    Figure 10-3. Generation 3, with microservices architecture and horizontally scaled
    queues


    The adoption of messaging systems can be a key component in helping to scale a
    product. In the preceding example, the messaging system was used for scaling event
    processing. However, messaging systems can be used for other purposes, such as
    transporting analytics, logs, or any other formatted data that does not have to
    be acted upon in real time.


    # The Basics of Messaging Platforms


    The need for software components (whether client/server applications or individual
    programs running on a single computer) predates the cloud and even the internet.
    All but the most primitive general-purpose and embedded operating systems provide
    capabilities for programs to send and receive data to other programs.


    # Messaging Versus Streaming


    The Cloud Native Computing Foundation (CNCF) Landscape (shown in Figure 10-4)
    names the messaging category Streaming & Messaging, but in this chapter we will
    focus primarily on messaging. Kafka, NATS, and RabbitMQ provide streaming capabilities,
    but unlike streaming analytics platforms such as Spark and Flink, they are not
    enabled by default and were not the initial use cases for any of these messaging
    platforms. We will discuss messaging concepts in detail in the next section, but
    it’s important to note here that a key consideration for streaming systems is
    that operations occur on multiple messages, often with a time or ordered event
    window within memory operations for aggregations or filtering.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_335_0.png)


    Figure 10-4. The CNCF Streaming & Message Landscape


    # Messaging Fundamentals


    Understanding the similarities and differences between contemporary messaging
    solutions can help you determine which tool is best for the job or the problem
    at hand. As we have seen throughout this book, there is always more than one way
    to build something, and it is not always an easy decision to pick the right path
    until advertised capabilities of the tool are tested and validated with your specific
    infrastructure and use case. Before we explore how RabbitMQ, Apache Kafka, and
    NATS fit into the cloud native infrastructure and applications, we must understand
    the basic concepts and common capabilities in messaging, queuing, and streaming
    systems.


    # Producers and Consumers


    Just as when you are communicating with another human, a message always has a
    sender and a receiver, but the message may or may not be sent directly and you
    may or may not get a response. When you send an email, there are multiple intermediate
    parties (see Figure 10-5). These parties include your email client, your email
    provider’s servers (message transfer agents [MTAs], which play a broker role),
    the receiver’s server (another MTA), and a receiving email client. In this example,
    there are a number of consumers and producers; the email client queues messages
    to send/produce to the ISP’s mail servers, and the MTA then queues the sent messages
    and sends/produces them to the receiver’s MTA. The receiver’s email client will
    then receive/consume the messages from their ISP’s MTA.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_335_1.png)


    Figure 10-5. The SMTP mail protocol, an example of a queueing system


    Just as in the case of networking where there are unicast, multicast, and broadcast
    delivery patterns, in messaging there may be cases where a single consumer processes
    data from a single producer or multiple consumers (like an email). Messages may
    be pushed to or pulled by consumers depending on the platform and configuration.


    # Brokers and Clustering'

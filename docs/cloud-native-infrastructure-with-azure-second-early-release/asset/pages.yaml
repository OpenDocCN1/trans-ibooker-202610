  md: 'the table.


    # The Service Mesh


    A service mesh is a tool that adds observability, reliability, and security at
    the platform layer of cloud native applications. A service mesh is usually implemented
    as a scalable set of network proxies deployed as a sidecar beside the application.
    These proxies are primarily responsible for handling communication between the
    microservices and they operate at Layer 7 of the OSI stack. Along with several
    additional features, a service mesh also:


    +   - Provides traffic management through load balancing, rate limiting, traffic
    shifting, and circuit breakers

    +   - Helps in application release cycle management with Canary releases

    +   - Adds some reliability checks, such as health checks, retries, and timeouts
    out of the box

    +   - Assists with fault injection and debug routing

    +   - Provides security via TLS and ACL policies

    +   - Provides automatic metrics, logs, and traces for all the traffic within
    a cluster

    +   - Secures service-to-service communication in a cluster using strong, identification-based
    authentication and authorization


    The general architecture of a service mesh consists of two high-level components:
    a data plane and a control plane. Figure 7-2 depicts four services (A–D) deployed
    in a service mesh.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_245_0.png)


    Figure 7-2. Service mesh general architecture


    As you can see, each service instance has a sidecar proxy instance which is responsible
    for all the traffic flow and management. This basically means that when service
    A wants to talk to service C, for example, service A initiates the communication
    flow via its local sidecar proxy, which then reaches out to the service C sidecar
    proxy. This way, the service is not aware of the local network proxy and remains
    isolated from the larger network. So, whenever a service needs to talk to another
    service, the proxy intercepts the request from it and then forwards it to the
    receiver.


    The collection of all sidecar proxies constitutes the data plane of the service
    mesh architecture. The data plane is responsible for the following:


    +   - Request forwarding

    +   - Service discovery'
  merge: -1
  img_proc: true
- pgno: 246
  md: '+   - Health checking

    +   - Routing service requests

    +   - Load balancing

    +   - Authentication and authorization

    +   - Providing observability


    Hence, the data plane fundamentally touches every network request or packet in
    the cluster.


    The control plane, on the other hand, provides the policy and configuration details
    for all the sidecar proxies (data planes) in the service mesh. The control plane
    allows you to control and configure the data planes. All the high-level configuration
    is sent to the control plane, which is then translated to the data-plane-specific
    configuration. The control plane assists the data plane by:


    +   - Routing between services

    +   - Populating service discovery data for data plane usage

    +   - Specifying inputs for configurations responsible for load balancing, circuit
    breaking, and timeouts

    +   - Configuring validation, authentication, and authorization settings in the
    cluster


    In the next section we will take a look at Istio, which acts as the control plane
    to service mesh in a modern cloud native environment.


    # Introduction to Istio


    As monolithic applications transitioned toward microservices, developers and operations
    teams experienced challenges with regard to how the services would talk to one
    another in the service mesh. As a service mesh grows in size, it becomes difficult
    to manage and maintain. It also becomes difficult to even understand how the different
    moving parts work together.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Istio is an open source service mesh that simplifies the communication between
    microservices in distributed cloud native applications. Istio provides rich, built-in
    feature sets which enforce resiliency patterns such as retries, circuit breakers,
    shaping traffic, routing behavior, Canary deployment, and more. Moreover, Istio
    allows you to easily create a network of deployed microservices using load balancing,
    monitoring, and authentication, with almost no application code changes.


    As we discussed in the previous section, a service mesh architecture consists
    of a data plane and a control plane. Istio uses Envoy as its data plane and istiod
    as its control plane (as depicted in Figure 7-3):


    # Envoy (data plane)


    Envoy is a high-performance proxy written in C++ which intercepts all inbound
    and outbound traffic for each application in the service mesh. It is deployed
    as a sidecar along with the application and provides a lot of features, including
    TLS termination, load balancing, circuit breaking, health checks, dynamic service
    discovery, fault injection, and more.


    This sidecar proxy model allows you to use Istio as a service mesh without any
    code changes.


    # Istiod (control plane)


    Istiod manages and configures the proxies. Istiod consists of three subcomponents:


    +   - Pilot, responsible for configuring the Envoy proxies at runtime

    +   - Citadel, responsible for certificate issuance and rotation

    +   - Galley, responsible for validating, ingesting, aggregating, transforming,
    and distributing the config within Istio


    Istiod converts the high-level routing rules that control traffic into Envoy-specific
    configuration and propagates to the Envoy sidecars at runtime.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_248_0.png)


    Figure 7-3. Istio architecture


    Let’s take a look at how you can use Istio and Envoy in an Azure Kubernetes environment.


    # Installing Istio on Azure Kubernetes Service


    You can install Istio on a Kubernetes cluster in three ways:


    +   - Istio provides a command-line tool called istiocctl which can be used to
    provide a rich level of customization to the Istio control plane and the Envoy
    proxy data plane.

    +   - You can use the Istio Kubernetes operator to manage the installation via
    the custom resource definitions (CRDs) of the Kubernetes API.

    +   - You can use Helm charts to install Istio directly.


    As Helm charts are also indirectly used in methods 1 and 2, we’ll use them here
    to install Istio.'
  merge: -1
  img_proc: true

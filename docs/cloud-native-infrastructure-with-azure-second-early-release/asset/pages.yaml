  md: 'One of the ways you can create a Pod is by using the kubectl run command as
    follows:


    ```

    kubectl run <name of pod> --image=<name of the image from registry>

    ```


    The kubectl run command pulls a public image from a container repository and creates
    a Pod. For example, you can run a hazelcast image as follows, and expose the container’s
    port too:


    ```

    $ ~ kubectl run hazelcast --image=hazelcast/hazelcast --port=5701

    deployment.apps/hazelcast created

    ```


    **NOTE**

    In production environments, you should never run or create Pods, because these
    Pods are not directly managed by Kubernetes and will not get restarted or rescheduled
    in case of a failure. You should use Deployments as the preferred way of operating
    the Pods.


    The kubectl run command is rich in feature sets, and you can control many Pod
    behaviors. For example, if you wish to run a Pod in the foreground (i.e., with
    an interactive terminal inside the Pod) and you don’t wish to restart it if it
    crashes, you may do the following:


    ```

    $ ~ kubectl run -i -t busybox --image=busybox --restart=Never

    If you don''t see a command prompt, try pressing enter.

    / #

    ```


    This command will directly log you inside the container. And since you run the
    Pod in interactive mode, you can check out the status of the busybox changing
    from Running to Completed, such as in the following:


    ```

    $ ~ kubectl get pods

    NAME        READY   STATUS    RESTARTS   AGE

    busybox     1/1     Running   0          52s

    ```'

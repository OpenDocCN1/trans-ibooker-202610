- pgno: 188
  md: "Based on the four metrics types we mentioned earlier, there are primarily four\
    \ different ways that you can instrument your code. We discuss them in the following\
    \ sections.\n\n# Counters\n\nAs the name suggests, counters are mainly used to\
    \ count values which increase and can be reset to zero on restart when the application\
    \ restarts. For example, when a GET request is sent to the Python HTTP server\
    \ the following code increments the counter value by 1:\n\n```\nimport http.server\n\
    from prometheus_client import Counter, start_http_server\n\nhttp_requests = Counter('my_app_http_request','Description:\
    \ Num\nof HTTP request')\n\nclass SampleServer(http.server.BaseHTTPRequestHandler):\n\
    \    def do_GET(self):\n        http_requests.inc()\n        self.send_response(200)\n\
    \        self.end_headers()\n        self.wfile.write(b\"Simple Counter Example\"\
    )\n\nif __name__ == \"__main__\":\n    start_http_server(5555)\n    server = http.server.HTTPServer(('localhost',\
    \ 5551),\nSampleServer)\n    server.serve_forever()\n```\n\nYou can run this code\
    \ block as `python counter.py` in your terminal and it will start a simple HTTP\
    \ server. We are using start_http_server as an endpoint from where the metrics\
    \ will be scraped. You can access metrics on http://localhost:5555. To ingest\
    \ these metrics into Prometheus, you need to again configure the scrape_configs\
    \ file in the prometheus.yml file as follows:\n\n```\nscrape_configs:\n  - job_name:\
    \ 'prometheus'\n    static_configs:\n    - targets: ['localhost:9090']\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "```\n- job_name: node\n  static_configs:\n  - targets:\n    - localhost:9100\n\
    - job_name: my_application\n  static_configs:\n  - targets:\n    - localhost:5555\n\
    ```\n\nOnce you restart Prometheus, you will be able to access the metric through\
    \ the Expression browser via the PromQL expression `rate(my_app_http_request_total[1m])`.\
    \ The counter will increase every time you hit the application URL at http://localhost:5551.\
    \ The graph in Figure 6-4 shows an increased rate of incoming HTTP requests.\n\
    \n![](img/8d47d1b5dbca55e784ae602145a894c7_189_0.png)\n\nFigure 6-4. Counter metric\
    \ for an instrumented application\n\nAs you can see, it’s quite easy to instrument\
    \ code with counters. You can also use counters to count exceptions and errors\
    \ in code, and even have a custom value for your counter instead of increasing\
    \ it by one.\n\n# Gauges\n\nGauges primarily indicate the current state of an\
    \ entity and can go up or down. Gauges can be used in a couple of different scenarios:\
    \ for instance,"

  md: "CoreDNS offers a bunch of configuration options which are handled by a Corefile.\
    \ When CoreDNS starts it looks for a file named Corefile in the current directory\
    \ if the -conf flag is not passed. The file primarily defines the following:\n\
    \n+   - Which server listens on which port\n+   - For which zone each server is\
    \ authoritative\n+   - What plug-ins are loaded in a server\n\nA Corefile normally\
    \ looks like this:\n\n```\nZONE:[PORT] {\n  [PLUGIN]...\n}\n```\n\nwhere ZONE\
    \ represents the DNS zone, PORT is where the zone server runs (usually port 53),\
    \ and PLUGIN defines the plug-ins the user needs to load.\n\nAmong the most common\
    \ entries in a Corefile are the various server blocks that define a server within\
    \ CoreDNS (i.e., how queries for a particular domain name are processed). Here’s\
    \ an example:\n\n```\nexample.com {\n}\n```\n\nThe preceding server block will\
    \ handle all the queries that end up in example.com unless a more specific server\
    \ block, like foo.example.com, is present. For a more concrete example, say you\
    \ have the following in your Corefile:\n\n```\ncloudnativeazure.io:53 {\n  log\n\
    \  errors\n}\n\n.:53 {\n```"

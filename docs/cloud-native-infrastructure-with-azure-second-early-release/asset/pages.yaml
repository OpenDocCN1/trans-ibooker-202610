    # Installing Hubble


    You will also want to install Hubble, a UI that allows you to see a service map
    which depicts dependencies between services and statistics on network usage and
    performance. Hubble’s live-updating, graph-like interface (see Figure 8-6) allows
    you to present a lot of information about the layout and flow of data between
    containers. Furthermore, it provides an interface to model Cilium policy.'

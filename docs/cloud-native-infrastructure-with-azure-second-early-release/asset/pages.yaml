- pgno: 65
  md: '# PID


    The PID (process identifier) controller sets the maximum number of processes that
    can run in the cgroup.


    # Devices


    Applicable only to cgroups v1, this control allows the administrator to set allow/deny
    lists for what devices a cgroup can access on the host machine.


    # Network


    The network classifier (net_cls) cgroup provides an interface to tag network packets
    with a class identifier (classid).


    The network priority (net_prio) cgroup provides an interface to dynamically set
    the priority of network traffic generated by various applications.


    For the most part, network control functionality is better provided by eBPF in
    newer Linux kernel versions.


    # Namespaces


    Namespaces are a feature in Linux that allows you to limit noncompute resources
    so that one group of processes will see one set of resources and a second group
    of processes will see a different set of resources. At the time of this writing,
    Linux contains a set of namespace types as follows:


    # Mount (mnt)


    Controls the filesystem mounts that are available to the container. This means
    processes in different mount namespaces see different views of a directory hierarchy.'

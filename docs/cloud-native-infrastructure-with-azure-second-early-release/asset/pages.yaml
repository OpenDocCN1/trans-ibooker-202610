    +   - Alibaba Container Registry

    +   - Amazon Elastic Container Registry (Amazon ECR)

    +   - Azure Registry

    +   - Docker Registry

    +   - Google Container Registry

    +   - IBM Cloud Container Registry

    +   - JFrog Artifactory

    +   - Kraken

    +   - Portus

    +   - Quay


    Many of these systems are tied to specific vendors. However, Harbor is one of
    the most popular open source container registry systems, so we’ll explore it further.


    # Securely Storing Images with Harbor


    Harbor is the premier open source cloud native container registry platform. Created
    in 2016, Harbor stores container images and provides signing and security scanning
    functionality. Furthermore, Harbor supports high availability and replication
    functionality as well as a number of security'
  merge: -1

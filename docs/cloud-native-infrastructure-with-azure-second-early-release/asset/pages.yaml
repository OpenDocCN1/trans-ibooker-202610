- pgno: 52
  md: "# Packer\n\nAt the beginning of this chapter, we introduced the term *immutable\
    \ infrastructure*, which represents the shift in provisioning and deployment of\
    \ cloud native applications. One of the most widely used tools for building a\
    \ prebaked⁷ machine image is Packer. Machine images are primarily compute resources\
    \ that have all the configurations, metadata, artifacts, and related files preinstalled/configured.\
    \ Packer (https://www.packer.io) is an open source tool from HashiCorp that is\
    \ used to create machine images from a defined configuration. It automates the\
    \ whole process of machine image creation, which increases the speed of infrastructure\
    \ deployment. Just like Terraform is used to build infrastructure, Packer assists\
    \ in building machine images by baking all the essential software, binaries, and\
    \ so forth, into the machine image.\n\nMoreover, since all the software on the\
    \ machine image is installed and configured before the image is built, Packer\
    \ helps improve the overall stability of the infrastructure. It also supports\
    \ different cloud providers, which eventually create identical machine images\
    \ across multiple platforms. Let’s dive a bit deeper into how Packer can be used\
    \ to build images in Azure.\n\n# Installing Packer\n\nTo get started with Packer,\
    \ download the appropriate Packer binary for your local machine⁸ (https://www.packer.io/downloads.html).\
    \ Unzip the binary and move it to `/usr/local/bin`. This should set up Packer\
    \ on your machine; you can verify this by running `packer --help` on your shell:\n\
    \n```\n$ ~ packer --help\nUsage: packer [--version] [--help] <command> [<args>]\n\
    \nAvailable commands are:\n    build          build image(s) from template\n \
    \   console        creates a console for testing variable\ninterpolation\n   \
    \ fix            fixes templates from old versions of packer\n    inspect    \
    \    see components of a template\n```"
  merge: -1
  img_proc: true
- pgno: 53
  md: "```\nvalidate    check that a template is valid\nversion     Prints the Packer\
    \ version\n```\n\n# Building a Linux image on Azure\n\nPacker uses a configuration\
    \ file that defines the machine image. The configuration file is called a packer\
    \ template and is written in JSON. The template includes builders and provisioners.\
    \ Builders create a machine image for a platform by reading the configuration\

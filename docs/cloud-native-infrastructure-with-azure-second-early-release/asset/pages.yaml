    \    app: opa\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app:\
    \ opa\n  template:\n    metadata:\n      labels:\n        app: opa\n      name:\
    \ opa\n    spec:\n```"
  merge: -1

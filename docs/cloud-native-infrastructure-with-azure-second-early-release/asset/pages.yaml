- pgno: 194
  md: "Prometheus allows out-of-the-box support to scrape Azure virtual machines.\
    \ Azure service discovery (SD) configurations allow you to retrieve scrape targets\
    \ from Azure virtual machines. You can use Azure service discovery by setting\
    \ the Azure credentials in the *prometheus.yml* file as follows:\n\n```\n- job_name:\
    \ 'azure-nodes'\n  azure_sd_configs:\n    - subscription_id: '$SUBSCRIPTION_ID'\n\
    \      tenant_id: '$TENANT_ID'\n      client_id: '$CLIENT_ID'\n      client_secret:\
    \ '$CLIENT_SECRET'\n      port: 9100\n  relabel_configs:\n    - source_labels:\
    \ [__meta_azure_machine_tag_cloudnative]\n      regex: true.*\n      action: keep\n\
    \    - source_labels: [__meta_azure_machine_name]\n      target_label: web_instance\n\
    \    - source_labels: [__meta_azure_machine_tag_public_ip]\n      regex: (.*)\n\
    \      replacement: ${1}:9100\n      target_label: __address__\n```\n\nIn this\
    \ configuration, we are also using *relabeling*, which dynamically rewrites the\
    \ label set of a target before it gets scraped. Relabeling helps to manipulate\
    \ the metrics to keep your storage clean and not pollute it with nonrequired data.\
    \ Multiple relabelings are applied to the label set of each target in order of\
    \ occurrence in the configuration file.\n\nLet’s take a closer look at key parts\
    \ of the preceding *relabel_configs*:\n\n```\n__meta_azure_machine_tag_cloudnative\n\
    ```\n\nPrometheus looks through all the Azure virtual machine instances, and if\
    \ an instance has a tag called `cloudnative` it keeps the service.\n\nBasically,\
    \ this tells Prometheus: “If any virtual machine is found in the Azure account\
    \ whose tag is `cloudnative: true`, then scrape it; otherwise, ignore it."

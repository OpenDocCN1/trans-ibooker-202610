    # Deploying Applications and Services Using Helm: A Package Manager for Kubernetes'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'It’s likely quite clear to you by now that when it comes to Kubernetes, there
    are too many things to take care of. Even though you can make use of a managed
    service like Microsoft AKS, it’s difficult to maintain deployment and ReplicaSets
    as your requirements expand.


    Helm is a package manager for Kubernetes that allows you to fetch, deploy, and
    manage applications. Basically, Helm takes care of the pain of maintaining long
    YAML files which hold information on Pods, ReplicaSets, Services, RBAC settings,
    and so forth. Helm also offers rollbacks, release history information, and integrated
    testing hooks, which makes it super easy to manage the full lifecycle of your
    applications on a Kubernetes cluster.


    In this book, we are using the stable version of Helm, v3.3.1. Older versions
    (i.e., v2) used to have a server-side component called the Tiller which needed
    to be deployed on the Kubernetes cluster. Tiller possessed a potential security
    risk due to wider user privileges and management overhead, which initially caused
    less traction of Helm in the user community. With the introduction of the RBAC
    API, Helm now contains only client-side binaries and Tiller has been completely
    removed. Figure 5-4 depicts the basic workings of the Helm package manager.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_166_0.png)



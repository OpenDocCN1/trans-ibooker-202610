- pgno: 284
  md: 'Cilium can be installed on a self-managed Kubernetes cluster or on a managed
    AKS cluster. In both cases, Cilium can be deployed via Helm, which makes installation
    easy. Furthermore, Cilium provides a container to perform connectivity checks
    to verify that network traffic can flow freely between Pods on your cluster.


    For more information, see the specialized documentation for deploying Cilium on
    Azure.


    # Self-managed Cilium installation


    We will install Cilium using its quick-install file:


    ```

    $ kubectl apply -f

    https://raw.githubusercontent.com/cilium/cilium/v1.9/install/kubernetes/quick-install.yaml

    ```


    The following code will install the connectivity check between hosts:


    ```

    $ kubectl apply -f

    https://raw.githubusercontent.com/cilium/cilium/v1.9/examples/kubernetes/connectivity-check/connectivity-check.yaml

    ```


    This will deploy a series of Pods which will use various network paths to connect
    to one another in order to verify connectivity. Connectivity paths include with
    and without service load balancing and various network policy combinations.


    # AKS Cilium installation


    To set up Cilium on AKS, we will use a Helm chart.


    +   First we will create a new AKS cluster:


    ```

    $ export RESOURCE_GROUP_NAME=aks-test

    $ export CLUSTER_NAME=aks-test

    $ export LOCATION=westus

    ```'
  merge: -1
  img_proc: true
- pgno: 285
  md: "```\n$ az group create --name $RESOURCE_GROUP_NAME --location $LOCATION\n$\
    \ az aks create \\\n    --resource-group $RESOURCE_GROUP_NAME \\\n    --name $CLUSTER_NAME\
    \ \\\n    --location $LOCATION \\\n    --node-count 2 \\\n    --network-plugin\
    \ azure\n```\n\n+   - Now we will create a service principal to interact with\
    \ the Azure APIs and populate environment variables to pass to Helm:\n\n```\n\
    $ az ad sp create-for-rbac --name cilium-operator > azure-sp.json\n\n$ AZURE_SUBSCRIPTION_ID=\"\
    $(az account show | jq -r .id)\"\n$ AZURE_CLIENT_ID=\"$(jq -r .appId < azure-sp.json)\"\
    \n$ AZURE_CLIENT_SECRET=\"$(jq -r .password < azure-sp.json)\"\n$ AZURE_TENANT_ID=\"\
    $(jq -r .tenant < azure-sp.json)\"\n$ AZURE_NODE_RESOURCE_GROUP=\"$(az aks show\
    \ --resource-group $RESOURCE_GROUP_NAME --name $CLUSTER_NAME | jq -r .nodeResourceGroup)\"\
    \n```\n\n+   - We will install the Cilium repository locally and then install\
    \ Cilium on our Kubernetes cluster:\n\n```\n$ helm repo add cilium https://helm.cilium.io/\n\
    $ helm install cilium cilium/cilium --version 1.9.9 \\\n    --namespace kube-system\
    \ \\\n    --set azure.enabled=true \\\n    --set azure.resourceGroup=$AZURE_NODE_RESOURCE_GROUP\
    \ \\\n    --set azure.subscriptionID=$AZURE_SUBSCRIPTION_ID \\\n    --set azure.tenantID=$AZURE_TENANT_ID\
    \ \\\n```"

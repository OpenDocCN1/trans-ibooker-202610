    # Kubernetes in Production


    Now that we have covered the basics of Pods, Kubernetes concepts, and how the
    Kubernetes cluster works, let’s take a look at how to actually tie together the
    Pods and become production ready in a Kubernetes cluster. In this section, we
    will see how the concepts discussed in the previous section empower production
    workloads and how applications are deployed onto Kubernetes.


    # ReplicaSets


    As we discussed, ReplicaSets enable the self-healing capability of Kubernetes
    at the infrastructure level by maintaining a stable number of Pods. In the event
    of a failure at the infrastructure level (i.e., the nodes'
  merge: -1
  img_proc: true
- pgno: 131
  md: "which hold the Pods), the ReplicaSet will reschedule the Pods to a different,\
    \ healthy node. A ReplicaSet includes the following:\n\n# Selector\n\nReplicaSets\
    \ uses Pod labels to find and list the Pods running in the cluster to create replicas\
    \ in case of a failure.\n\n# Number of replicas to create\n\nThis specifies how\
    \ many Pods should be created.\n\n# Template\n\nThis specifies the associated\
    \ data of new Pods that a ReplicaSet should create to meet the desired number\
    \ of Pods.\n\nIn actual production use cases, you will need a ReplicaSet to maintain\
    \ a stable set of running Pods by introducing redundancy. But you don’t have to\
    \ deal with the ReplicaSet directly, since it’s an abstraction layer. Instead,\
    \ you should use Deployments, which offer a much better way to deploy and manage\
    \ Pods. A ReplicaSet looks like this:\n\n```\napiVersion: apps/v1\nkind: ReplicaSet\n\
    metadata:\n  name: myapp-cnf-replicaset\n  labels:\n    app: cnfbook\nspec:\n\
    \  replicas: 3\n  selector:\n    matchLabels:\n      app: cnfbook\n  template:\n\
    \    metadata:\n      labels:\n        app: cnfbook\n    spec:\n      containers:\n\
    \      - name: nginx\n```"
  merge: -1
  img_proc: true
- pgno: 132

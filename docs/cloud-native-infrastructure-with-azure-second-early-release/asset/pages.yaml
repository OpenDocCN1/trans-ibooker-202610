- pgno: 12
  md: '# Chapter 1. Introduction: Why Cloud Native?


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 1st chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at rfernando@oreilly.com.


    Even though using the cloud provides a way to solve problems with the scalability,
    availability, and reliability of our applications, it is not a silver bullet.
    We cannot put our applications in the cloud and expect them to be up and running
    forever, nor can we package our applications in containers to turn them into microservices
    that can run smoothly in the cloud. To take full advantage of what the cloud has
    to offer, we need to develop infrastructures and services with the cloud at the
    forefront of our minds.


    To truly understand the cloud native journey and its importance, we need to first
    look back at what the world of infrastructure and services looked like during
    the early days of the internet. So, let’s embark on this journey.


    # The Journey to the Cloud'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Back in the early days of the internet, the overall web application infrastructure
    was hosted using physical servers that needed to be procured and prepared before
    applications could be served from them. IT teams had to physically buy the servers
    and set them up on premises, install relevant server operating systems, prepare
    the environments, and then deploy applications on top of them. There were many
    problems with this approach: for example, you’d have underutilized servers (since
    you’d never end up fully using them), it was difficult to run multiple applications,
    and setup and maintenance costs were high. *Virtualization* was developed to allow
    more efficient utilization of physical servers. Virtualization creates an abstraction
    layer over physical hardware that allows underlying resources, such as processors,
    memory, and storage, to be divided and shared.


    Virtualization solved many problems with resource utilization and multitenancy,
    but you still needed to own the hardware to deploy your application and you still
    needed to maintain all the overhead of running your data center. This gave rise
    to the need to run infrastructure as a service (IaaS), where the servers are owned
    by third parties that are responsible for your applications’ underlying infrastructure.
    This was the beginning of the cloud computing era, and it allowed companies to
    focus on their applications and underlying environments without worrying about
    hardware, overhead, or configuration issues. IaaS was followed by platform as
    a service (PaaS), which focused on reducing the toil further by separating the
    underlying software environment and runtime. This meant developers only had to
    focus on writing their applications and defining the dependencies, and the service
    platform would be completely responsible for hosting, running, managing, and exposing
    the applications. PaaS led the way to fully managed cloud services with the advent
    of software as a service (SaaS), popularly known as “on-demand software,” which
    provides consumers with the application as a service on a pay-as-you-go basis.


    As cloud computing gained in popularity, so did the idea of having cloud native
    technologies that would use the cloud more efficiently while harnessing the full
    potential of cloud infrastructure and its various offerings. This gave rise to
    the development of cloud native infrastructure and cloud'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'native application development. Cloud native infrastructure creates an abstraction
    on the cloud provider’s underlying infrastructure and exposes the infrastructure
    with APIs. This infrastructure management philosophy makes it very easy to scale
    and reduce underlying complexity, which indirectly improves availability, resiliency,
    and maintainability. Similarly, cloud native applications fortify the bridge between
    the application and infrastructure by incorporating supporting features such as
    health checks, telemetry and metrics, resiliency, a microservices environment,
    and self-healing.


    Let’s now take a look at challenges in the cloud computing environment.


    # Challenges in the Cloud


    Public cloud providers have become a dominant enterprise solution for a lot of
    growing industry needs and business requirements. They give you advantages such
    as higher availability and scalability along with the flexibility to design your
    applications in a way which utilizes cloud services. When cloud solutions were
    first introduced, numerous challenges including security, effective cost management,
    compliance, and performance concerned potential customers. Those early challenges
    are now a thing of the past for the majority of cloud consumers, as they have
    been overcome with advances in both cloud provider technologies and the way enterprises
    deploy solutions on the cloud.


    Even though we have come a long way, this does not mean the cloud is perfect.
    There are still challenges in the cloud landscape, but they look very different
    from the ones we faced back when the cloud was still new. Customers today now
    have to consider the following challenges:


    Too many choices


    There are plenty of cloud providers out there with an extensive array of services
    to choose from. This means you need to hire expert architects and engineering
    teams who know how to operate the services and use'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'them according to your business use case. Not only is hiring these engineers
    difficult, but finding engineers who are experts in a specific field requires
    a significant time investment.


    # Rapid growth and development of cloud services and technologies


    A huge number of new cloud services are being released by cloud provider giants
    like Amazon, Microsoft, and Google. This results in a greater need to train engineers
    in these new services and a greater need to maintain these services in the future
    as the applications grow. Often, the level of investments in these services also
    indirectly causes vendor lock-in, resulting in a spiral of future constraints
    in application design.


    # Multiple generations of technology


    As we have moved into the cloud era, we have also lifted and shifted our application
    stacks from various generations of infrastructure solutions, ranging from virtual
    machines to containers to serverless technologies. This migration of applications
    requires a significant amount of effort to understand the underlying technologies
    and support them in the future.


    # Growing operational complexity


    These rapidly growing technologies, combined with accelerated migration of workloads
    to the cloud, have given rise to operational complexity and an ever-growing list
    of factors to look out for, including storage systems, security models, governance
    models, and management platforms, among others.


    # Evolution of business needs and technologies'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'New areas of technology and cultural change have also rapidly evolved the enterprise
    architecture. For instance, with the advent of the DevOps culture, a new application
    that once took weeks or months to develop can now be rolled out in a couple of
    minutes. More advanced areas, such as data science and machine learning, have
    also come into the picture, increasing business needs and overall engineering
    maturity.


    So, despite the power of cloud computing, businesses had to wade through numerous
    complexities. Eventually, it became clear that businesses wanted to have the speed,
    scale, and margin of the cloud but none of the overhead. To accomplish this, it
    was necessary to embrace the cloud native approach of application building, which
    would help companies take full advantage of the cloud.


    # Cloud Native Computing Foundation


    As more companies are adopting cloud native technologies, creating software in-house,
    and closely partnering with other businesses to quickly bring products to market,
    strides are being made to improve the cloud native domain. One organization that
    is helping to lead the way in this effort is the Cloud Native Computing Foundation
    (CNCF). Their mission is as follows:'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Cloud native technologies empower organizations to build and run scalable applications
    in modern, dynamic environments such as public, private, and hybrid clouds. Containers,
    service meshes, microservices, immutable infrastructure, and declarative APIs
    exemplify this approach.


    These techniques enable loosely coupled systems that are resilient, manageable,
    and observable. Combined with robust automation, they allow engineers to make
    high-impact changes frequently and predictably with minimal toil.


    The Cloud Native Computing Foundation seeks to drive the adoption of this paradigm
    by fostering and sustaining an ecosystem of open-source, vendor-neutral projects.
    We democratize state-of-the-art patterns to make these innovations accessible
    for everyone.


    CNCF has compiled an interactive cloud native landscape (https://landscape.cncf.io)
    that shows the full extent of today’s cloud native solutions. The CNCF landscape
    acts like a map to cloud native technologies and provides guidelines for building
    successful cloud native applications. Though the cloud native landscape provides
    a lot of information on how to build services, it can be challenging, especially
    for beginners, to work their way through it as it includes a number of services
    that are used together. In this book, we have chosen the best of the available
    technology while following the CNCF guidelines to better navigate the cloud native
    world.


    # Adopting a Cloud Native Infrastructure with Azure


    Now that you understand the origins of cloud computing, the challenges of operating
    in the cloud, and how cloud native offerings aimed to change the way services
    were being developed and delivered, let’s discuss how this book can help you moving
    forward.


    If you take a look at the cloud native movement and begin plotting its story from
    the beginning, the first technology that comes up is Kubernetes, and you’ll find
    plenty of people who have adopted it. On the surface, you might'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'observe that many companies have Kubernetes in the middle of their stack. This
    gives the impression that Kubernetes is an essential tool that can solve all your
    problems and magically make your environment self-healable and fault tolerant.
    This misconception has pushed a lot of people to explore Kubernetes as a silver
    bullet without fully understanding the deeper meaning. It’s important to understand
    the need for such solutions and gain insight to the full ecosystem while looking
    at the bigger picture.


    In the chapters that follow, we provide guidance on how to build cloud native
    environments following the guidelines suggested by CNCF. We wrote this book as
    a primer for engineers and enthusiasts who are just starting out with cloud native
    transformations and want to explore the overall need for cloud native architectures.
    You’ll learn practical ways to create cloud native infrastructures over Microsoft
    Azure by navigating the CNCF landscape. You’ll also learn the principles of cloud
    native infrastructure from a beginner’s perspective, and you’ll deploy mature
    solutions over Azure.¹ As Azure is one of the key players in the public cloud
    ecosystem, it provides a mature understanding of the infrastructure stack. We
    will take you through cloud infrastructure basics and explain how to become cloud
    native through various technologies while highlighting why these technologies
    are necessary. We will give an extensive overview of cloud native technologies
    and Azure services through a practical application, and we will showcase the advantages
    of being cloud based (with Azure) versus cloud native. Our end goal is to give
    you a book that showcases all the major cloud native technologies and their importance
    so that you can understand the logical reasoning behind the advantages of using
    these technologies.


    # Summary


    In this introductory chapter, we laid the foundation of what cloud computing is
    and how cloud native technologies help improve cloud adoption. You learned how
    the cloud became popular and how cloud computing evolved from physical hardware
    to a serverless environment.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'You also learned about the challenges with cloud computing and the growing
    need to adapt to cloud native technologies. We explained what cloud native means
    and how the rest of the book will follow the path to cloud native on Azure. We
    hope you find the journey ahead to be interesting and that this effort will help
    you adapt cloud native technologies more effectively.


    1 Azure also gives plenty of architectural guidelines, which showcase best practices
    for building services on Azure: see https://docs.microsoft.com/en-us/azure/architecture
    and https://azure.microsoft.com/pt-br/blog/azure-application-architecture-guide.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Chapter 2. Infrastructure as Code: Setting Up the Gateway


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 2nd chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at rfernando@oreilly.com.


    The cloud, with its rich assortment of solutions offering everything from effortless
    networking to “planet-scale” computing, is becoming the de facto home for most
    organizations regardless of their size. The ecosystem of most cloud providers
    is now larger than ever and includes simple virtual machines, complicated managed
    clusters, and even highly sophisticated infrastructure. Microsoft Azure, for example,
    offers a variety of well-built services for end users. These solutions are built
    on top of infrastructure that is resilient by nature, and they have well-defined
    service-level agreements (SLAs)¹ to meet the needs of all customers, from small
    start-ups to large enterprises.


    While the dynamic nature of cloud computing is a boon for organizations, it can
    be challenging to maintain services in cloud environments as your organization
    grows. As you leverage more and more cloud-based services to support your growing
    business needs, you quickly realize you can no'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'longer maintain your applications and underlying infrastructure by simply clicking
    into the web console each time you want to perform a new action. The evolutionary
    design of the cloud was built upon previous generations of hardware and virtualized
    infrastructure with a programmable control plane that provides flexibility in
    the form of API layers. These APIs are leveraged by infrastructure-as-code (IaC)
    tooling to enable cloud practitioners to easily maintain their environments.


    When you want to build a production-grade infrastructure from the ground up, you
    have to start treating your infrastructure definitions the same way you treat
    your code. Provisioning and scaling your infrastructure manually is not only cumbersome
    and time consuming; it is also an error-prone process—you cannot build the same
    infrastructure twice with the same level of confidence. When you treat your infrastructure
    as code, you also inherit software engineering principles such as version control,
    testability, automation, and speed of development as part of the DevOps strategy.
    IaC ensures that your infrastructure can be built in a consistent and repeatable
    manner. As more software development teams have adopted Agile methodologies, they
    are now required to move features and solutions more frequently and more quickly
    into the cloud. As such, infrastructure has become closely attached to applications,
    and teams are required to manage applications and infrastructure through a seamless
    process. Also, teams need to iterate and repeatedly deploy new features and underlying
    infrastructure more frequently. A quick way to implement IaC is to use the prewritten
    templates that are offered by cloud providers which give instructions on how to
    create an infrastructure. Azure natively supports Azure Resource Manager (ARM)
    templates, which are used to define and create infrastructure resources that shed
    light directly on the IaC philosophy. This combination of the cloud and IaC allows
    organizations to introduce changes more quickly and more efficiently.


    This chapter serves as a foundation for developing a rich understanding of IaC
    and Azure. First, we will introduce the IaC concept and its importance in building
    cloud native infrastructure. Then we will introduce Microsoft Azure, which is
    the cloud provider we will use throughout the book.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Next, we’ll dive into Terraform as a tool for implementing IaC. We will also
    cover Packer, which is primarily a tool for building machine images, and Ansible,
    to introduce you to configuration management while building cloud native applications.
    Finally, we’ll touch on Azure DevOps before we close the chapter. Let’s get started.


    # Infrastructure as Code and Its Importance in the Cloud Native World


    In the old days, when an IT team wanted to procure new hardware for application
    deployment, they first had to initiate a hardware procurement request, which would
    take days or even weeks to complete. Even after the hardware was finally delivered
    on premises, it would take a few more days to get it in a working state before
    applications could be deployed on it. Today, with the growth of DevOps and the
    cloud, these slow processes have vanished. Release cycles have become shorter,
    and the speed with which business requirements can be delivered has increased.


    However, even with the introduction of the cloud, managing infrastructure is still
    a problem. Although physical servers were replaced by virtual servers and the
    management of complex infrastructure became the responsibility of the cloud vendor,
    growing and scaling infrastructure was still a hard and error-prone task. Engineering
    teams needed to consistently build new infrastructures and software stacks while
    continuing to maintain the old infrastructure. To alleviate the tedium and fatigue
    associated with these tasks, the building and management of cloud-based systems
    became automated, resulting in a robust infrastructure and application environment.


    Eventually, as code was adapted to provision the compute, networking, and storage
    layers of the stack, the benefits of treating infrastructure as code became evident.
    This led to the movement of adapting IaC in cloud environments.


    *Infrastructure as code* is the philosophy of treating your infrastructure as
    programmable instructions. Just as you check in source control files, you'

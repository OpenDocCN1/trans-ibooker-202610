  md: '+   - Observe the state of the cluster.

    +   - Compare the observed and desired states to find differences.

    +   - Take actions based on the observed state.


    # Etcd


    Kubernetes uses etcd as a datastore. Etcd is a key-value store that is responsible
    for persisting all the Kubernetes objects. It was originally created by the CoreOS
    team and is now managed by CNCF. It is usually spun up in a highly available setup,
    and the etcd nodes are hosted on separate instances.


    # Worker Nodes


    A Kubernetes cluster contains a set of worker machines called worker nodes that
    run the containerized applications. The control plane manages the worker nodes
    and the Pods in the cluster. Some components run on all Kubernetes worker nodes;
    they are discussed in the following subsections.


    # Kubelet


    Kubelet is the daemon agent that runs on every node to ensure that containers
    are always in a running state in a Pod and are healthy. Kubelet reports to the
    API server about the currently available resources (CPU, memory, disk) on the
    worker nodes so that the API server can use the controller manager to observe
    the Pods’ state. Since kubelet is the agent that runs on the worker nodes, the
    worker nodes handle basic housekeeping tasks such as restarting containers if
    required and consistently conducting health checks.


    # Kube-proxy


    Kube-proxy is the networking component that runs on each node. Kube-proxy watches
    all Kubernetes services³ in the cluster and ensures that when a request to a particular
    service is made, it gets routed to the particular'

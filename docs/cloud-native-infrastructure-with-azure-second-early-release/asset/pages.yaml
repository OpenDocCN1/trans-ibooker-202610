    \ v1\nkind: Namespace\nmetadata:\n    name: knative-samples\n    labels:\n   \
    \     eventing.knative.dev/injection: enabled\n---\n# A default broker\napiVersion:\
    \ eventing.knative.dev/v1\nkind: Broker\nmetadata:\n    name: default\n    namespace:\
    \ knative-samples\n    annotations:\n        # Note: you can set the\neventing.knative.dev/broker.class\
    \ annotation to change\nthe class of the broker.\n        # The default broker\

    In the next section, we will look at OpenFaaS, which provides simple, no-frills
    functions on both standalone systems and Kubernetes clusters.


    # OpenFaaS


    OpenFaaS is another event-driven function service for Kubernetes that allows you
    to write functions in any language and then package them in Docker or OCI-compatible
    containers.


    # OpenFaaS Architecture


    The OpenFaaS reference architecture (as shown in Figure 11-5) is reasonably similar
    to KEDA. However, OpenFaaS does rely on metrics from Prometheus to act as an autoscaling
    signal.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_378_1.png)


    Figure 11-5. The OpenFaaS reference architecture'

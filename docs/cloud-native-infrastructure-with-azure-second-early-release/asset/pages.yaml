    Now that you understand how logging works in cloud native environments, let’s
    close the chapter with a discussion on distributed tracing.


    # Distributed Tracing in the Cloud Native World


    Distributed tracing is one of the critical pillars for gaining and building observability
    into modern cloud native applications. Distributed tracing enables you to track
    the flow of requests in a distributed system as they pass through multiple services
    and emit metadata information, such as the time spent at each service and underlying
    call details to other service endpoints. This metadata can be reassembled later
    to provide a more complete picture of the application’s behavior at runtime, which
    can help you solve issues such as pinpointing application latency problems and
    locating bottlenecks.


    Distributed tracing answers important questions, such as:'
  merge: -1
  img_proc: true
- pgno: 215
  md: '+   - What are the bottlenecks in a service?

    +   - How much time is spent at each stage/service of a distributed system?

    +   - What are the upstream and downstream services and what endpoints does a
    request touch?


    To better understand the fundamentals of distributed tracing, take a look at the
    simple web application depicted in Figure 6-7.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_215_0.png)


    Figure 6-7. A simple web application showcasing request propagation through various
    layers of services


    Referencing Figure 6-7, assume that you have a sample service which provisions
    some resources over a cloud based on the user’s plan. The normal flow of execution
    starts with the client making a request to the load balancer, which talks to the
    authentication service and the billing service, and allocates resources to the
    client by making a final call to the resource allocation service. In Figure 6-8,
    you can see the unique request IDs being propagated in the flow, which later helps
    to stitch together the traces.



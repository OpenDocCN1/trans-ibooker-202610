- pgno: 363
  md: '# Knative


    Knative is a serverless platform built on top of Kubernetes and was an early favorite
    in the industry given the buzz around Kubernetes at the time of release. One of
    the advantages of Knative is that the functions are packaged and executed as Docker
    containers, which makes integration effort into an existing cloud environment
    minimal.


    # Knative Architecture


    Knative has two modes of operation:


    +   - Knative Serving uses Kubernetes to deploy serverless functions or containers
    and has full support for autoscaling (including down to zero Pods). It also has
    an added bonus of supporting cloud networking solutions like Gloo and Istio.

    +   - Knative Eventing allows developers to develop applications built around
    an event-driven architecture. In an eventing deployment, you can specify event
    producers (sources) to respond to.


    Let’s look at how to install Knative on Kubernetes.


    # Installing and Running Knative Serving on Kubernetes


    In this section, we’ll run a basic Knative serving system.


    +   - Start by installing the custom resources:

    +   - Then install the serving components:


    ```

    kubectl apply -f https://github.com/knative/net-kourier/releases/download/v0.26.0/kourier.yaml

    ```


    ```

    kubectl apply -f

    https://github.com/knative/serving/releases/download/v0.26.0/serving-core.yaml

    ```'
  merge: -1
  img_proc: true
- pgno: 364
  md: "If you want to use any of the networking integrations (Kourier, Ambassador,\
    \ Contour, Istio), you can follow the networking layer instructions.\n\n+   -\
    \ Now you need to create your application. We will use Python’s Flask library\
    \ to create a simple application:\n+   ```\n+   Import logging\n+   import os\n\
    +   \n+   from flask import Flask\n+   \n+   app = Flask(__name__)\n+   Log =\n\
    +   \n+   @app.route('/', methods=['POST'])\n+   def hello_world():\n+       return\
    \ f'Hello world. Data {request.data}\\n'\n+   \n+   if __name__ == '__main__':\n\
    +       app.run(debug=True, host='0.0.0.0',\n+   port=int(os.environ.get('PORT',\
    \ 8080)))\n+   ```\n\n+   - Now you need a Docker image containing your serverless\
    \ application:\n+   ```\n+   FROM python:3.7-slim\n+   \n+   RUN pip install Flask\
    \ gunicorn\n+   \n+   WORKDIR /app\n+   COPY . .\n+   ```"
  merge: -1
  img_proc: true

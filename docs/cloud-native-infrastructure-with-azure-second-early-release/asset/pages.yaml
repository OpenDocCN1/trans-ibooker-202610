    Linux containers are a natural evolution of similar technologies such as FreeBSD
    jails, Solaris zones, and virtual machines. In many ways, containers bring together
    the best of these technologies.


    Because containers are not a primitive concept, a number of container software
    platforms are available. We’ll explore them later in this chapter. For now, let’s
    go through each of the basic container primitives.


    # Cgroups


    A control group (cgroup) is a Linux primitive that provides the ability to limit
    the resources a group of programs within a cgroup can access/allocate. This provides
    protection against the “noisy neighbor” problem. The following is a list of controls
    that cgroups provide:


    *CPU*


    The CPU subsystem control allows you to allocate a certain amount of CPU time
    (`cpuacct`) or a certain number of cores (`cpuset`) to a cgroup, so you can ensure
    that one process doesn’t overwhelm all the CPU resources on a physical machine.


    *Memory*


    The memory subsystem allows you to report and set limits for memory usage in a
    cgroup. This works for both user memory and swap memory.


    *Blkio*


    The blkio (pronounced block-i-o) controller subsystem provides a mechanism to
    limit the input/output operations per second (IOPS) or bandwidth (bps) from a
    cgroup to a block device.'

- pgno: 357
  md: 'Given the simplicity of the function model and the limited dependencies, the
    need to actively provision or manage the function is severely reduced.


    # Autoscaling


    The function scales automatically and no additional effort is required to scale
    the number of function workers up or down.


    # Faster development cycles


    Tying all of the preceding points together helps generate a faster engineering
    cycle, which can lead to increased developer and operator productivity.


    # Potential Downsides of Serverless


    Serverless can also have potential downsides that should be considered as well:


    # Debuggability


    When all of the compute is entirely ephemeral and short-lived, debugging your
    function is exceptionally complex.


    # Large number of functions


    While autoscaling is inherently built into all of the serverless functions, there
    are a number of side effects to always autoscaling. First, it can adversely affect
    performance, and second, managing connection pooling downstream becomes more complicated
    (especially with databases).


    # Vendor lock-in'
  merge: -1
  img_proc: true

- pgno: 218
  md: '# Traces


    A trace represents the entire journey of a request across all the services it
    touches during its traversal. A single complete trace usually consists of multiple
    spans for the request. For example, the complete transaction of the client from
    start to end consists of multiple spans.


    # Context propagation


    With every request from a service to a downstream service, a global request execution
    identifier is passed along as metadata which remains unique for each request.
    This global request execution identifier is used later to reconstruct the full
    execution of the request by grouping the records on the basis of the request identifier.
    The process of passing the execution identifier as request metadata is called
    *distributed context propagation*.


    The metadata that is being propagated across the spans also includes the trace
    ID and span ID along with two additional details: tags and logs. *Tags* are key-value
    pairs that can be added to spans to provide extra information like error codes
    and host details. *Logs* are also key-value pairs which capture span-specific
    logging messages and assist in debugging.


    # Sampling


    Collecting all the data in memory and then sending it to a tracing backend can
    have a severe impact on the network, application latency, and cost. To avoid this
    problem, the tracing system implements sampling. Sampling is the process of collecting
    and storing only a subset of trace data to avoid storage costs and performance
    overhead. There are various types of sampling methods, primarily classified as
    either head-based or tail-based sampling. For example, if you want to collect
    x number of traces per minute, you can use a type of sampling known as *rate limiting*.
    Similarly, if you want to sample traces when a certain type of error becomes prominent,
    you can use *context-sensitive sampling*.


    # General Tracing System Architecture and Trace Assembly'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'To implement a tracing system in a cloud native environment, you can make use
    of the already existing open source libraries (we will discuss this further in
    the next section), which will help you instrument your application without reinventing
    the wheel. In general, most tracing systems have a simple architecture, as shown
    in Figure 6-10.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_219_0.png)


    Figure 6-10. General distributed tracing system architecture


    To use distributed tracing, you first need to instrument your application code
    using a client library. Client libraries are available in many languages, including
    Java, Go, and Python. The library sends the data to an agent, which usually is
    available on the same instance or host. The agent is responsible for forwarding
    the traces to the backend (e.g., to the storage layer via an asynchronous buffered
    layer). Later, the traces are reconstructed and displayed to the user interface.
    The traces can also be used to perform further analysis and aggregation using
    data mining techniques.


    Traces are assembled by looking at the following in a request:


    # Incoming request span


    When a request comes into a service, the tracing system checks whether the request
    has a tracing header attached to it. If no tracing header is'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'attached, a root span is created; otherwise, a child span needs to be created.


    # Outgoing request span


    If a request is going out from one service to a different service, a span is created
    first and the receiving service continues the trace as described in the incoming
    request span.


    You can implement distributed tracing in cloud environments in several ways. We’ll
    take a look at some of them in the next section.


    # Tracing Standards, Tools, and Code Instrumentation


    Over the years, distributed tracing has evolved and become a standard way to profile
    and monitor applications in the cloud native world. In 2016, OpenTracing became
    a CNCF project whose single goal was to provide vendor-agnostic specifications
    for distributed tracing. During this time, Google was working on an open source
    community project called OpenCensus, which was later steered by Microsoft.


    OpenTracing and OpenCensus were two competing frameworks; their architectures
    were different, but they basically solved the same problem. The presence of two
    standards led to a bit of uncertainty in respect to support and contributions,
    which resulted in a lack of wide adoption in the industry. In May 2019, CNCF announced
    the merging of OpenTracing and OpenCensus into a single standard known as OpenTelemetry.
    OpenTelemetry combines the benefits of the previous standards and is supported
    by the community. In this section, we will look at how basic application code
    can be instrumented with OpenTracing and OpenTelemetry.


    Today the two most popular and practical tracing tools are Zipkin and Jaeger.
    Zipkin was the first tracing system that was developed by Google’s Dapper tracing
    infrastructure.⁵ Jaeger was developed at Uber and is'
  merge: -1
  img_proc: true
- pgno: 221

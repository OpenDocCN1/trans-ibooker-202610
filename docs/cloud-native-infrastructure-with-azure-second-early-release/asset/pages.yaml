    \     11s\nmyapp-cnf-replicaset-wqkl1           1/1     Running   0          11s\n\
    ```\n\n# Deployments\n\nIn production environments, one of the key things that\
    \ are constant is change. You will keep updating/changing the applications in\
    \ your production environment at a very rapid pace, since the most common task\
    \ you will be doing in production is rolling out new features of your application.\
    \ Kubernetes offers the Deployment object as a standard for doing rolling updates,\
    \ and provides a seamless experience to the cluster administrator as well as end\
    \ users. This means you can push updates to your applications without taking down\
    \ your applications, since Deployment ensures that only a certain number of Pods\
    \ are down while they are being updated. These are known as zero downtime deployments.\
    \ By default, deployments ensure that at least 75% of the desired number of Pods\
    \ are up. Deployments are the reliable, safe, and current way to roll out new\
    \ versions of applications with zero downtime in Kubernetes.\n\nYou can create\
    \ a deployment as follows:"

  md: "Special predefined scopes that are managed by Cilium.\n\n# IP/CIDR\n\nAn IP\
    \ or IP range (CIDR).\n\n# DNS names\n\nA DNS name.\n\nFor example, if you want\
    \ to allow traffic between two labeled Pods, you can create the following policy:\n\
    \n```\napiVersion: cilium.io/v2\nkind: CiliumNetworkPolicy\nmetadata:\n  name:\
    \ \"l3-rule\"\nspec:\n  endpointSelector:\n    matchLabels:\n      role: backend\n\
    \  ingress:\n  - fromEndpoints:\n  - matchLabels:\n      role: frontend\n```\n\
    \nYou can apply this policy by running:\n\n```\n$ cilium policy import l3-rule-example-1.yaml\n\
    ```\n\nFurthermore, if you want to create an L4 example where you want to limit\
    \ outbound egress DNS to the Google public DNS servers, you can write the rule\
    \ shown in the following example:\n\n```\napiVersion: \"cilium.io/v2\"\nkind:\
    \ CiliumNetworkPolicy\nmetadata:\n  name: \"allow-to-google-dns\"\nspec:\n  endpointSelector:\n\
    \    {}\n```"
  merge: -1

- pgno: 306
  md: "```\n- name: http\n  protocol: TCP\n  port: 8181\n  targetPort: 8181\n```\n\
    \n+   - Apply both files:\n\n```\n$ kubectl create -f deployment-opa.yaml\n$ kubectl\
    \ create -f service-opa.yaml\n```\n\n# Deploying Policy with OPA\n\nAs stated\
    \ earlier, OPA is a generalized policy engine and is pluggable with a number of\
    \ software ecosystems. In this example, we will provision SSH access to machines\
    \ using OPA.\n\nFor this example, we’ll have three groups:\n\n*sre*\n\nThese are\
    \ the administrators for all applications.\n\n*foo-frontend*\n\nThese are the\
    \ contributors to the foo-frontend application.\n\n*bar-backend*\n\nThese are\
    \ the contributors to the bar-backend application.\n\nWe will implement the following\
    \ policy:\n\n+   - The group `sre` can SSH into any host and run sudo commands.\n\
    \n+   - Other users in groups associated with the development of the application\
    \ can log in to the host, but cannot run sudo commands."
  merge: -1

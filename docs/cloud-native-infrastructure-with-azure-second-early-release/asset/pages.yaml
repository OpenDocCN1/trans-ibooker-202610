- pgno: 80
  md: 'While the Docker platform and OCI images remain industry leaders, there are
    still a number of other container offerings available.


    # Kata Containers


    Kata Containers are OCI-compliant containers that aim to enhance security. Kata
    Containers have the following lightweight container features:


    +   - Cgroups

    +   - Namespaces

    +   - Capability filters

    +   - Seccomp filtering

    +   - Mandatory access control


    Kata Containers also possess some virtual machine concepts, particularly a separate
    guest kernel per container and better hardware isolation. The `kata-runtime` process
    controls the instantiation of the OCI-compliant container. The largest difference
    is that there is a separate guest kernel per container instead of a shared kernel
    between container instances.


    # LXC and LXD


    LXC (Linux Containers) is one of the earliest container mechanisms to be released.
    LXC mainly uses the kernel’s cgroup and namespace capabilities as well as a standard
    set of library APIs to control the containers.


    LXD is the container management software and tools that help orchestrate the LXC
    APIs. The LXD daemon provides a REST API over a Unix socket/network that allows
    you to use the provided command-line tools or build your own.


    The ecosystem of both LXC and LXD is more oriented toward running infrastructure
    than application development due to a lack of development and deployment tooling.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Container Registries


    After building your container images, you will need places to store them and serve
    them. These are known as *container registries*. Container registries have grown
    in popularity due to their easy deployment mechanisms and their built-in replication
    mechanisms which replace the challenging rsync setups required for DEB and RPM
    package repositories.


    When deploying a container, the container deployment system will download the
    image from the registry to the host machine. Essentially, a container registry
    acts as a highly available container image file server (with some protections).
    All of the common containerization platforms allow you to configure a public or
    private repository as a source for the container images.


    While these responsibilities sound reasonably Vanal, there are a lot of overlooked
    features of container registries that are important parts of secure container
    deployments. Such features include:


    +   * *Image replication*

    +     Replicating the images to other container registries (globally)

    +   * *Authentication*

    +     Only allowing authorized users to access the registry and its contents

    +   * *Role-based access control*

    +     Restricting who can modify images and data within the registry

    +   * *Vulnerability scanning*

    +     Checking images for known vulnerabilities

    +   * *Garbage collection*

    +     Removing old images regularly

    +   * *Auditing*'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Providing trusted information on changes to the container registry for information
    security purposes


    Current cloud native products include (see the CNCF landscape for more):


    +   - Harbor


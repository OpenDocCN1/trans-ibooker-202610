  md: 'These plug-ins assign IP addresses to interfaces (dhcp, host-local, static).


    # Meta


    These are other native plug-ins that allow for actions such as:


    +   - Sysctl tuning

    +   - Bandwidth limiting

    +   - Firewalls

    +   - Flannel (which will be covered later in this chapter)


    You can find more information about these native plug-ins on the CNI plug-ins
    page.


    In addition to the CNI plug-ins we mentioned here, there is a vast ecosystem of
    third-party projects that are writing CNI-compatible plug-ins. More than 25 outside
    projects had taken advantage of the CNI standard at the time of this writing.
    These projects provide different types of functionality, including load balancing,
    IPAM, overlay networks, security, and network telemetry.


    Some of the smaller projects include:


    +   - Infoblox

    +   - Juniper Contrail

    +   - VMware NSX


    While some CNI plug-ins are designed for very specific infrastructure (e.g., Cisco’s
    ACI CNI), many work perfectly well with Azure and Azure services. In the following
    sections, we will explore Calico, Cilium, Weave, Flannel, and OPA, and discuss
    how these systems help build and secure network infrastructure.'

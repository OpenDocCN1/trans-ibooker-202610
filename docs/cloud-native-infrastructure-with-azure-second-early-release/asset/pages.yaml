  md: 'These mechanisms allow you to safely run numerous workloads together without
    worrying about resource contention or one system disturbing another. If you have
    a container orchestrator that is workload aware, you can efficiently utilize all
    of the resources on a host machine without performance degradation (known as *bin
    packing*). Done well at scale, this can create significant cost savings as you
    increase your infrastructure efficiency.


    # Security


    Building off the container isolation features, the OCI container runtime specification
    (discussed later in this chapter) provides a number of runtime-security-related
    features that ensure that if an application inside a container is compromised,
    the risk of lateral movement throughout your network is significantly reduced.
    Some of these features include:


    *Linux capabilities*


    These reduce the container’s access to kernel APIs.


    *User/group attributes*


    These set the user and group attributes of the container, which can then limit
    access to filesystem resources.


    *Devices*


    These control which devices a container has access to.


    *SELinux labels*


    Like other components of a Linux system (files, processes, pipes), SELinux labels
    can be applied to containers.


    *Sysctl*


    This adds (limited) additional controls to the container.'

    Up to this point, we have largely focused on taking on-premises concepts and discussing
    and implementing their cloud-based equivalents. In this chapter, we will take
    a deep dive into a new type of computing architecture known as serverless, which
    is rooted in cloud computing. Specifically, we will examine common serverless
    platforms including Azure function apps, Knative, KEDA, and OpenFaaS.


    # Introduction to Serverless Computing


    Similar to containers, there is a lot of hype around serverless computing and
    what can be done with it. This chapter will examine the features and benefits
    of serverless computing.


    # What Is Serverless?


    Unlike containers, which largely still contain a number of host-based concepts,
    serverless abstracts all of that away to the point where you are'
  merge: -1

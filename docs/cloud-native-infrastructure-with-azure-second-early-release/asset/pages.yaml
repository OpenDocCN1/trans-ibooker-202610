- pgno: 254
  md: 'Kiali is a management console for Istio that enables you to easily operate
    and configure a service mesh with added observability into your environment. Kiali
    provides a clear picture of the service mesh through dashboards that use traffic
    topology to display its structure and health. In this section, we will discuss
    how to install Kiali on a Kubernetes cluster to gain visibility into the Istio
    service mesh.


    We’ll start by installing the ingress and egress gateway for Istio from the istio-1.9.2
    directory that we used when we installed Istio earlier:


    ```


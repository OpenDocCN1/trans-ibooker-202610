- pgno: 145
  md: "```\nname: fluentd-elasticsearch\nnamespace: kube-system\nlabels:\n  central-log-k8s:\
    \ fluentd-logging\nspec:\n  selector:\n    matchLabels:\n      name: fluentd-elasticsearch\n\
    \  template:\n    metadata:\n      labels:\n        name: fluentd-elasticsearch\n\
    \    spec:\n      tolerations:\n      - key: node-role.kubernetes.io/master\n\
    \        effect: NoSchedule\n      containers:\n      - name: fluentd-elasticsearch\n\
    \        image: quay.io/fluentd_elasticsearch/fluentd:v2.5.2\n        resources:\n\
    \          limits:\n            memory: 200Mi\n          requests:\n         \
    \   cpu: 100m\n            memory: 200Mi\n        volumeMounts:\n        - name:\
    \ varlog\n          mountPath: /var/log\n        - name: varlibdockercontainers\n\
    \          mountPath: /var/lib/docker/containers\n          readOnly: true\n \
    \     terminationGracePeriodSeconds: 30\n      volumes:\n      - name: varlog\n\
    \        hostPath:\n          path: /var/log\n      - name: varlibdockercontainers\n\
    \        hostPath:\n          path: /var/lib/docker/containers\n```\n\nIn the\
    \ preceding DaemonSet configuration, we created a DaemonSet which will deploy\
    \ the Fluentd container on each node. We have also created a toleration which\
    \ does not schedule the Fluentd node on the master (control plan) nodes."

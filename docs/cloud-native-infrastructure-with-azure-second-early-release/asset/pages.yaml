  md: "> NOTE\n> The parameter EntityPath=mdfanz-eventhub (i.e., Endpoint=sb://mdfanz-eventhub-namespace.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;EntityPath=mdfanz-eventhubSharedAccessKey=jfMUbFqZX8UjG1cKLAeIp5CZVLcwcSGpuKdJX/CMzk=)\
    \ must be added to the connection string, because if you are creating a client\
    \ using NewHubfromConnectionString, the Send method does not allow an event grid\
    \ name to be specified as a parameter, so you need to add an EntityPath instead.\n\
    \n# Azure Event Grid\n\nAzure Event Grid was released for general availability\
    \ in 2018 and is the best of the Azure-offered messaging brokers, as it allows\
    \ multiple event sources to be routed to a variety of destinations within the\
    \ Azure ecosystem. Messages can be sent to/from the existing message services\
    \ we just discussed (Azure Service Bus and Azure Event Hubs) and to additional\
    \ services and endpoints (shown in Figure 10-16), such as Azure Functions, Web\
    \ Hooks, Logic Apps, and other in-application purposes (e.g., tracking how users\
    \ interact with the application). Azure Event Hubs is a first-class “serverless”\
    \ offering in which billing is by the event.\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_351_0.png)\n\
    \nFigure 10-16. The Event Grid ecosystem\n\nIn Figure 10-16, note the push nature\
    \ of the Event Grid as opposed to the general push-pull topology we’re used to\
    \ in other systems.\n\nAzure Event Grid uses terminology that slightly differs\
    \ from the other platforms we’ve discussed:\n\n# Domains\n\nDomains are analogous\
    \ to namespaces which separate use cases within the tenant.\n\n# Topics\n\nFor\
    \ Event Grids, there are two types of topics: system topics, which come from Azure\
    \ systems (Event Hubs, Blob Storage, etc.), as shown on the left in Figure 10-16;\
    \ and custom topics, which can be your own customized scheme wrapped in the Event\
    \ Grid Schema.\n\n# Deploying and using event grids\n\nAzure event grids have\
    \ a minimalistic Terraform deployment, as shown in the following example:\n\n\

    \  http:\n    paths:\n    - path: /\n      pathType: Prefix\n      backend:\n\
    \        service:\n          name: service1\n          port:\n            number:\
    \ 80\n```\n\nIngress controllers deal with many features and complexities, and\
    \ the Azure gateway ingress controller handles a lot of them; for example, leveraging\
    \ Azure’s native layer 7 application gateway load balancer to expose your services\
    \ to the internet. We will discuss this in more detail when we introduce AKS in\
    \ Chapter 5.\n\n# DaemonSet\n\nDaemonSets, as we discussed earlier, are typically\
    \ used to run an agent across a number of nodes in the Kubernetes cluster. The\
    \ agent is run inside a container abstracted by Pods. Most of the time, SREs and\
    \ DevOps engineers prefer to run a log agent or a monitoring agent on each node\
    \ to gain application telemetry and events. By default, a DaemonSet creates a\
    \ copy of a Pod on every node, though this can be restricted as well using a node\
    \ selector. There are a lot of similarities between ReplicaSets and DaemonSets,\
    \ but the key distinction between them is the requirement (with DaemonSets) of\
    \ running a single agent (i.e., Pod) application across all of your nodes.\n\n\
    One of the ways to run a logging container is by deploying a Pod in each node\
    \ using a DaemonSet. Fluentd is an open source logging solution widely used to\
    \ collect logs from systems. This example shows one of the ways to deploy Fluentd\
    \ using a DaemonSet:\n\n```\napiVersion: apps/v1\nkind: DaemonSet\nmetadata:\n\
    ```"

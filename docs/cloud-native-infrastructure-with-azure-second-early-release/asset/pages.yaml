    As monolithic applications were broken down into microservices, containers became
    the de facto housing for these microservices. Microservices are a cloud native
    architectural approach in which a single application is composed of many smaller,
    loosely coupled, and independent deployable components or services. Containers
    ensure that software runs correctly when moved between different environments.
    Through containers, microservices work in unison with other microservices to form
    a fully functioning application.


    While breaking monolithic applications into smaller services solves one problem,
    it creates bigger problems in terms of managing and maintaining an application
    without significant downtime, networking the various microservices, distributed
    storage, and so on. Containers help by decoupling applications into fast-moving,
    smaller codebases with a focus on feature development. However, although this
    decoupling is clean and'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'easy at first since there are fewer containers to manage, as the number of
    microservices in an application increases it becomes nearly impossible to debug,
    update, or even deploy the containerized microservices safely into the stack without
    breaking something or causing downtime.


    Containerizing applications was the first big step toward creating self-healable
    environments with zero downtime, but this practice needed to evolve further, especially
    in terms of software development and delivery in cloud native environments. This
    led to the development of schedulers and orchestrator engines like Mesos, Docker
    Swarm, Nomar, and Kubernetes. In this chapter and the next, we will focus on Kubernetes
    due to its maturity and wide industry adoption.


    Google introduced Kubernetes to the world in 2014, after spending almost a decade
    perfecting and learning from its internal cluster management system, Borg. In
    simple terms, Kubernetes is an open source container orchestration system. The
    term container orchestration primarily refers to the full lifecycle of managing
    containers in dynamic environments like the cloud, where machines (servers) come
    and go on an as-needed basis. A container orchestrator automates and manages a
    variety of tasks, such as provisioning and deployment, scheduling, resource allocation,
    scaling, load balancing, and monitoring container health. In 2015, Google donated
    Kubernetes to the Cloud Native Computing Foundation (CNCF).


    Kubernetes (aka K8S) is one of the most widely adopted pieces of a cloud native
    solution since it takes care of deployment, scalability, and maintenance of containerized
    applications. Kubernetes helps site reliability engineers (SREs) and DevOps engineers
    run their cloud workload with resiliency while taking care of scaling and failover
    of applications that span multiple containers across clusters.


    # WHY IS KUBERNETES CALLED K8S?


    Kubernetes is derived from a Greek word that means helmsman or pilot of a ship.
    Kubernetes is also called K8S. This numeronym was derived by replacing the eight
    letters between K and S (“ubernete”) with an 8.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Following are some of the key features that Kubernetes provides right out of
    the box:


    # Self-healing


    One of the most prominent features of Kubernetes is the process of spinning up
    new containers when a container crashes.


    # Service discovery


    In a cloud native environment, the containers move from one host to another. The
    process of actually figuring out how to connect to a service/application that
    is running in a container is referred to as service discovery. Kubernetes exposes
    containers automatically using DNS or the containers’ IP address.


    # Load balancing


    To keep the deployed application in a stable state, Kubernetes load-balances and
    distributes the incoming traffic automatically.


    # Automatic deployments


    Kubernetes works on a declarative syntax, which means you don’t have to worry
    about how to deploy applications. Rather, you tell what needs to be deployed and
    Kubernetes takes care of it.


    # Bin packing


    To make the best use of compute resources, Kubernetes automatically deploys the
    containers on the best possible host without wasting or impairing overall availability
    for other containers.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'In this chapter, we will dive into the major components and the underlying
    concepts of Kubernetes. Though this chapter doesn’t aim to teach Kubernetes in
    full, as there are already a wide array of books¹ that cover the topic at length,
    we want to build a strong foundation. This hands-on approach will help you better
    understand the nitty-gritty of the overall environment. Let’s start with a discussion
    of how the Kubernetes cluster works.


    # Kubernetes Components


    The Kubernetes cluster contains two types of node components:


    *Control plane*


    This is the governing component of the Kubernetes cluster. It ensures that a couple
    of important services (e.g., scheduling, starting up new Pods²) are always running.
    The core purpose of the control plane node is to make sure the cluster is always
    in a healthy and correct state.


    *Worker nodes*


    These are the compute instances that run your workload on your Kubernetes cluster
    which hosts all your containers.


    Figure 4-1 depicts the high-level components of Kubernetes. The lines signify
    the connections, such as worker nodes accepting a connection talking to the load
    balancer, which distributes traffic.'
  merge: -1
  img_proc: true

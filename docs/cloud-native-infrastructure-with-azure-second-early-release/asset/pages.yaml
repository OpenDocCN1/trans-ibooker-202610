- pgno: 83
  md: 'functions, including user management, role-based access control, and activity
    auditing.


    The beauty of Harbor is that it provides top-tier features even though it is open
    source, which makes it a great platform to utilize.


    # Installing Harbor


    When you utilize Harbor, it essentially becomes a critical component of your build
    and deploy pipelines. You should run it on a host that meets these recommended
    specifications:


    +   - Quad-core CPU

    +   - 8 GB of memory

    +   - Minimum 160 GB disk

    +   - Ubuntu 18.04/CentOS7 or later


    > NOTE

    > You will want to evaluate the performance of the disk SKU or configuration to
    match the performance you desire. Harbor is essentially a fileserver, and the
    performance of the disk will significantly affect your build and deploy times.


    Harbor supports multiple installation methods, including Kubernetes and Helm.
    As we haven’t yet explored Kubernetes, we are going to install Harbor manually.


    Harbor has two releases (or types of installations): an online installer and an
    offline installer. The online installer is smaller in size and relies on an internet
    connection to download the full image from Docker Hub (directly off the internet).
    The offline installer is larger in size and does not require an internet connection.
    If your security posture is restrictive, the offline installer may be a better
    option.


    The Harbor releases are listed on GitHub.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# VERIFYING THE INSTALLER


    It is recommended that you verify the integrity of the downloaded package. You
    will need to open outbound internet access to port TCP/11371 in order to reach
    the GPG keyserver. To verify the installer:


    +   1. Download the corresponding *.asc file for your installer version.

    +   2. Obtain the public key for Harbor releases: gpg --keyserver. hkps://keyserver.ubuntu.com
    --receive-keys 644FF454C0B4115C.

    +   3. Verify the package by running gpg -v -keyserver hkps://keyserver.ubuntu.com
    -verify <asc-filename>.


    You should see gpg: Good signature from "Harbor-sign (The key for signing Harbor
    build) in the output of the preceding command.


    # Configuring Harbor for installation


    Before configuring Harbor, you should enable HTTPS by installing a Secure Sockets
    Layer (SSL) certificate via your own certificate authority (CA) or through a public
    CA like Let’s Encrypt. More information on how to do this can be found in the
    Harbor documentation.


    All the installation parameters for Harbor are defined in a file called harbor.yml.
    The parameters defined in this file configure Harbor for its first use or when
    it is being reconfigured via the install.sh file. Details on all the configuration
    options can be found on GitHub. To get started, we will use the following required
    parameters:


    ```

    hostname: container-registry.example.com


    http:

    ```'

- pgno: 146
  md: '# NOTE


    Kubernetes offers scheduling features called *taints* and *tolerations*.


    +   - Taints in Kubernetes allow a node to repel a set of Pods (i.e., if you want
    certain nodes not to schedule some type of Pod).

    +   - Tolerations are applied to Pods, and allow (but do not require) the Pods
    to schedule onto nodes with matching taints.


    Taints and tolerations work together to ensure that Pods are not scheduled onto
    inappropriate nodes. One or more taints are applied to a node; this indicates
    that the node should not accept any Pods that do not tolerate the taints.


    You can check the Pods that were created automatically for each worker node as
    follows:


    ```

    $ kubectl apply -f fluentd.yaml

    daemonset.apps/fluentd-elasticsearch created

    ```



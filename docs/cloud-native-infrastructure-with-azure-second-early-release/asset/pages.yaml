    The CNCF Serverless Landscape highlights serverless computing and the associated
    programming model as well as message formats. Though serverless computing has
    been widely available, there is plenty of scope and depth in the development of
    this approach. You can explore serverless computing if your workload is asynchronous,
    sporadic, stateless, and highly dynamic in terms of changing business requirements.
    You can also start using various Azure services and see how they can compare with
    CNCF technologies.



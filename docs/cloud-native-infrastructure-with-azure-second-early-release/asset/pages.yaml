- pgno: 198
  md: 'Not only do these environments have many moving parts, but they’re also more
    complex, since now the systems are distributed and ephemeral, like Kubernetes
    Pods. This means the logs need to be shipped away and stored centrally to be viewed
    later.


    To solve the problems of logging at scale in a cloud native environment, we need
    a solution that can be plugged into an environment easily and integrate seamlessly.
    This is where Fluentd comes into the picture.


    # Logging with Fluentd


    Fluentd is an open source project from CNCF that can collect, parse, transform,
    and analyze logs. Fluentd basically acts as a unified logging layer by structuring
    the data as JSON (see Figure 6-5). This in turn helps it collect, filter, buffer,
    and output the logs across multiple sources and destinations.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_198_0.png)


    Figure 6-5. Fluentd acting as a logging layer


    Fluentd is written in CRuby, which is a C implementation of the Ruby programming
    language that comes with a small memory footprint of 30 to 40 MB and processes
    approximately 13K events per second per core. Let’s take a look at some of the
    core concepts of Fluentd and how it can be used to enable logging in cloud native
    environments.'
  merge: -1
  img_proc: true
- pgno: 199

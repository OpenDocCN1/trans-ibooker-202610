  md: "```\n$ ~ kubectl get pods\nNAME            READY   STATUS      RESTARTS   AGE\n\
    busybox         0/1     Completed   0          61s\n```\n\nAnother way to create\
    \ Pods in Kubernetes is by using the declarative syntax in Pod manifests. The\
    \ Pod manifests, which should be treated with the same importance as your application\
    \ code, can be written using either YAML or JSON. You can create a Pod manifest\
    \ for running an Nginx Pod as follows:\n\n```\napiVersion: v1\nkind: pod\nmetadata:\n\
    \  name: nginx\nspec:\n  containers:\n    - image: nginx\n      name: nginx\n\
    \      ports:\n        - containerPort: 80\n          name: http\n```\n\nThe Pod\
    \ manifests information such as kind, spec, and other information that is sent\
    \ to the Kubernetes API server to act on. You can save the Pod manifest with a\
    \ YAML extension and use apply as follows:\n\n```\n$ kubectl apply -f nginx_pod.yaml\n\
    pod/nginx created\n$ kubectl get pods\nNAME            READY   STATUS    RESTARTS\
    \   AGE\nnginx           1/1     Running   0          7s\n```\n\nWhen you run\
    \ kubectl apply the Pod manifest is sent to the Kubernetes API server, which instantly\
    \ schedules the Pod to run on a healthy node in the cluster. The Pod is monitored\
    \ by the kubelet daemon process, and if the Pod crashes, it’s rescheduled to run\
    \ on a different healthy node.\n\nLet’s now move on and take a look at how you\
    \ can implement health checks on your services in Kubernetes."

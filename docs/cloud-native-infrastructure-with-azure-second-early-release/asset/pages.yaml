  md: "The preceding command will log you inside the newly spun container and leave\
    \ you a command prompt.\n\nIn Kubernetes, DNS-based service discovery defines\
    \ a specification, or a DNS schema, that defines the DNS name used to locate the\
    \ services running in the cluster. All DNS records in a Kubernetes cluster fall\
    \ under a single domain referred to as the *cluster domain*, which is usually\
    \ set to `cluster.local` by default in most Kubernetes clusters. The DNS specification\

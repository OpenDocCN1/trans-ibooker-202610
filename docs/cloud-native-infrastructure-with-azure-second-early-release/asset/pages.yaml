  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_109_0.png)


    Figure 4-1. Kubernetes components


    Now let’s take a detailed look at each component.


    # Control Plane


    The control plane is primarily responsible for making global decisions about the
    Kubernetes cluster, such as detecting cluster state, scheduling Pods on nodes,
    and managing the lifecycle of the Pods. The Kubernetes control plane has several
    components, which we describe in the following subsections.


    # kube-apiserver (API server)


    The API server is the frontend of the Kubernetes control plane and the only component
    with direct access to the entire Kubernetes cluster. As you saw in Figure 4-1,
    the API server serves as the central point for all the interactions between the
    worker nodes and the controller nodes. The services running in a Kubernetes cluster
    use the API server to communicate with one another. You can run multiple instances
    of the API server because it’s designed to be scalable horizontally.


    # Kube scheduler'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'The Kube scheduler is responsible for determining which worker node will run
    a Pod (or basic unit of work; we will explain Pods in more detail later in this
    chapter). The Kube scheduler talks to the API server, which determines which worker
    nodes are available to run the scheduled Pod in the best possible way. The scheduler
    looks for newly created Pods which are yet to be assigned to a node, and then
    finds feasible nodes as potential candidates and scores each of them based on
    different factors, such as node resource capacity and hardware requirement, to
    ensure that the correct scheduling decision is made. The node with the highest
    score is chosen to run the Pod. The scheduler also notifies the API server about
    this decision in a process referred to as binding.


    # Kube controller manager


    Kubernetes has a core built-in feature that implements the self-healing capabilities
    in the cluster. This feature is called the Kube controller manager and it runs
    as a daemon. The controller manager executes a control loop called the reconciliation
    loop, which is a nonterminating loop that is responsible for the following:


    +   - Determining whether a node has gone down, and if so, taking action. This
    is done by the Node controller.

    +   - Maintaining the correct number of Pods. This is done by the Replication
    controller.

    +   - Joining the endpoint objects (i.e., servicers and Pods). This is done by
    the Endpoint controller.

    +   - Ensuring that default accounts and endpoints are created for new namespaces.
    This is done by the Service Account and Token controllers.


    The reconciliation loop is the driving force behind the self-healing capability
    of Kubernetes. Kubernetes determines the state of the cluster and its objects
    by continuously running the following steps in a loop:


    +   - Fetch the user-declared state (the desired state).'
  merge: -1
  img_proc: true

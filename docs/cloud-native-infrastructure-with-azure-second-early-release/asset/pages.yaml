  md: "```\n$ az servicebus namespace authorization-rule keys list --resource-group\
    \ $RES_GROUP --namespace-name $NAMESPACE_NAME --name RootManageSharedAccessKey\
    \ --query primaryConnectionString wBY=\n```\n\nAzure provides open source libraries\
    \ to send and receive messages to the Azure service in all popular programming\
    \ languages. The following example builds a simple producer and consumer in Python:\n\
    \n```\nfrom azure.servicebus import ServiceBusClient, ServiceBusMessage\n\nimport\
    \ os\nconnstr = os.environ['SERVICE_BUS_CONN_STR']\nqueue_name = os.environ['SERVICE_BUS_QUEUE_NAME']\n\
    \nmessages = [\"Testing 1\",\"Testing 2\", \"Testing 3\"]\n\nwith ServiceBusClient.from_connection_string(connstr)\
    \ as client:\n    s = client.get_queue_sender(queue_name)\n    r = client.get_queue_receiver(queue_name)\n\
    \n    print(s,r)\n\n    for m in messages:\n        s.send_messages(ServiceBusMessage(m))\n\
    \n    while True:\n        print(r.receive_messages(max_message_count=1,max_wait_time=10))\n\
    ```\n\nIn addition to RabbitMQ, readers familiar with AWS SNS and SQS will find\
    \ Service Bus straightforward and able to meet similar use cases.\n\n# Azure Event\
    \ Hubs\n\nAzure Event Hubs is designed to provide some of the capabilities of\

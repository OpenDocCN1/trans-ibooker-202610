    and application.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_229_0.png)


    Figure 6-12. Azure Monitor


    Azure Monitor also allows you to consume distributed trace data. There are primarily
    two ways to do this. The first is by using the transaction diagnostics view, which
    is similar to a call stack with a time dimension added in. The transaction diagnostics
    view provides visibility into one single transaction/request, and is helpful for
    finding the root cause of reliability issues and performance bottlenecks on a
    per-request basis. The second way is by using the application map view, which
    aggregates many transactions to show a topological view of how the systems interact,
    and what the average performance and error rates are.'

  md: 'degradation. You will need at least four cores for etcd to run, and the throughput
    will scale with an increase in CPU cores. You can find more information on capacity
    planning and hardware configurations for the cloud on the general hardware page
    and the AWS guide (etcd doesn’t currently publish an Azure-specific guide).


    We recommend running etcd on the following Azure SKUs:


    +   - Standard_D8ds_v4 (eight-core CPU)

    +   - Standard_D16ds_v4 (16-core CPU)


    These SKUs explicitly allow you to attach premium or ultra SSDs, which will increase
    the performance of the cluster.


    > **NOTE**

    > As with any production use case that we’ve discussed in this book, we strongly
    recommend that you enable accelerated networking on all Azure compute instances.


    # Autoscaling and Auto-remediation


    We would be remiss if we did not discuss how autoscaling and auto-remediation
    work with etcd. Autoscaling is not recommended for etcd as it could have unintended
    consequences if capacity additions or subtractions adversely affect cluster performance.
    That said, enabling auto-remediation (auto-healing) of bad etcd instances is considered
    to be OK. You can disable autoscaling for etcd by running the following command
    on your Kubernetes cluster:


    ```

    $ kubectl delete hpa etcd

    ```


    This will disable the Horizontal Pod Autoscaler (HPA), which is used in Kubernetes
    to automatically scale clusters up and down. You can find more information about
    the HPA in the Kubernetes documentation.'

    # Azure Fundamentals and Preparing Your Azure Environment


    Before we get started with Azure, it’s important to understand some of its basic
    constructs.² Understanding these concepts will help inform policy decisions in
    the future:


    Tenant


    An Azure tenant is an Azure Active Directory (AAD) representation of an organization.
    You are likely already familiar with traditional Active Directory (AD) services.
    When an organization creates an account with Microsoft, an AAD instance will be
    created.


    All AAD instances are completely separated from each other, as are all identities
    (user or service accounts). If you have an existing Microsoft tenant (e.g., for
    Office 365), you can utilize it for your Azure footprint. You can also create
    your own AAD tenant via the Azure Portal. Remember to enable multifactor authentication
    (MFA³) on your tenant.


    Subscriptions


    Azure subscriptions are essentially a billing container for your resources. You
    can also set specific Azure policies at the subscription level.


    Management groups'

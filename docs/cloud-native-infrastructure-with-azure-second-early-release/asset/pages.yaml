    If you are utilizing etcd for your core infrastructure, you will quickly understand
    how important it is for this infrastructure to run reliably. As an etcd cluster
    is a critical piece of your infrastructure, we recommend the following to ensure
    a stable etcd cluster in Azure.


    # Hardware Platform


    Consistent key-value store performance relies heavily on the performance of the
    underlying hardware. A poorly performing consistent key-value cluster can severely
    impact the performance of your distributed system. The same applies for etcd.
    If you are doing hundreds of transactions per second, you should utilize a managed
    solidstate drive (SSD) with your virtual machine (we recommend a premium or ultra
    SSD) to prevent performance'

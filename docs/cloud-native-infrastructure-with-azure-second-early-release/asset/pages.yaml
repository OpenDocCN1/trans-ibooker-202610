- pgno: 296
  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_296_0.png)


    Figure 8-8. An example Flannel architecture


    The Flannel project team recommends VXLAN or host-gw as backends for communication.
    If you need to encrypt traffic, IPsec is also an option. You can find more information
    about the supported backends in the Flannel documentation.


    Flannel does not allow you to run multiple networks from the one daemon; you will

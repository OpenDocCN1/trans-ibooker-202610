    # NATS Persistence with JetStream


    Although NATS introduced a persistence implementation called NATS Streaming in
    2019, it will be deprecated in June 2023. The second-generation implementation,
    called JetStream, has been under development since 2020 and will be the preferred
    option for use cases going forward. Although JetStream has a separate GitHub repository,
    it is now integrated into NATS Server 2.2.x and supported by the NATS CLI, which
    we will discuss shortly. NATS pub/sub only provided “at most once” delivery; JetStream
    allows “exactly once” delivery and more closely resembles the behavior of RabbitMQ
    queues and Kafka topics (see Figure 10-10).


    ![](img/8d47d1b5dbca55e784ae602145a894c7_342_0.png)


    # NATS Security


    An entire chapter could easily be written on how to configure the range of authentication,
    authorization, and encryption capabilities of NATS 2.3.x. In this section, we
    will cover the basic steps necessary to raise the bar from the insecure defaults
    we’ve been using in most of our examples so far, which are inappropriate for production
    deployments. A strong identity and secrets management infrastructure is the foundation
    of secure cloud systems, but is beyond the scope of this book. NATS provides a
    robust permissions subsystem that allows granular control to be defined on a topic
    basis² and uses distributed identity stores.


    # Nkey-based authentication


    Although NATS still supports token and username/password authentication, Nkey
    authentication is recommended going forward. It uses asymmetric cryptography and
    does not require a shared key to be stored on the server in plain-text or hashed
    format. Key management is extremely straightforward.


    To generate the key pairs, use the nk³ utility found within the nkeys repository:


    ```

    $ nk -gen user -pubout

    SUAGWCAMM XKR43EDIXVC5FEA5G3767ALGQR75N27NGPK37KZUURS7F32FE

    UBFHQJERKEBE323BXQEVT6257CIRJ4CIC5LGT6R2LJ524GQTUQHX CUK3

    ```


    The public key (which begins with a “U”) is configured on the server:


    ```

    $ cat server.conf

    net: 0.0.0.0

    port: 4242

    ```'

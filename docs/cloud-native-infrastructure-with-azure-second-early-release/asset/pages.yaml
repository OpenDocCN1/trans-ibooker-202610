    # Ingress


    The Service object helps expose the application both inside and outside the cluster,
    but in production systems we cannot afford to keep opening new and unique ports
    for all the services we deploy using NodePort, nor we can create a new load balancer
    every time we choose the service type to be LoadBalancer. At times we need to
    deploy an HTTP-based service and also perform SSL offloading, and the Service
    object doesn’t really help us in those instances. In Kubernetes, HTTP load balancing
    (or, formally, layer 7 load balancing) is performed by the Ingress object.


    To work with Ingress, we first need to configure an ingress controller.7 We will
    configure an Azure Kubernetes Service (AKS) Application Gateway ingress controller
    to understand this better and see how it behaves, but in general, one of the easiest
    ways to understand it better is by looking at the following:


    ```

    apiVersion: networking.k8s.io/v1

    kind: Ingress

    ```'
  merge: -1
  img_proc: true
- pgno: 142
  md: "```\nmetadata:\n  name: ingress-wildcard-host\nspec:\n  rules:\n  - host: \"\
    foo.bar.com\"\n    http:\n      paths:\n      - pathType: Prefix\n        path:\
    \ \"/bar\"\n        backend:\n          service:\n            name: hello-world-node-service\n\
    \            port:\n              number: 8080\n  - host: \"*.foo.com\"\n    http:\n\
    \      paths:\n      - pathType: Prefix\n        path: \"/foo\"\n        backend:\n\
    \          service:\n            name: service2\n            port:\n         \
    \     number: 80\n```\n\nIn the ingress manifest, we have created two rules and\
    \ mapped *foo.bar.com* as a host to one subdomain /bar which routes to our previous\
    \ service `hello-world-node-service`.\n\nSimilarly, we can have multiple paths\
    \ defined for a domain and route them to other services. There are various ways\
    \ to configure the ingress according to your needs, which might span from a single\
    \ domain routing to multiple services or multiple domains routing to multiple\
    \ domains (see Figure 4-7)."

- pgno: 339
  md: '# NATS Protocol Architecture


    Like RabbitMQ, NATS offers multiple messaging patterns, and its capabilities have
    continued to evolve from the initial pub/sub implementation, to NATS streaming
    (shown in Figure 10-8), to its newest storage subsystem, JetStream. Released in
    2020, JetStream is now available in NATS 2.2.x. NATS now also includes native
    MQTT protocol support.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_339_0.png)


    Figure 10-8. Basic NATS architecture


    Because the foundational architecture is publish/subscribe, NATS producers are
    called publishers and its consumers are called subscribers. NATS JetStream uses
    the internal consumer abstraction.


    The simplest possible exchange between a publisher and subscriber using the NATS
    CLI is the best way to see how simple the protocol is.


    Let’s look at an example. In the following code, a producer sends the message
    "arf" with the subject dog.food:


    ```

    $ echo "arf" | nats pub dog.food

    16:10:43 Reading payload from STDIN

    16:10:43 Published 4 bytes to "dog.food"

    ```


    In the following code, a consumer subscribes to the service for all messages that
    start with dog.:


    ```

    $ nats sub dog.*

    16:09:49 Subscribing on dog.*

    [#1] Received on "dog.food"

    ```


    # Clustering multiple NATS servers


    NATS allows multiple servers to be clustered together to provide high availability
    and load balancing.


    The simplest cluster can be started by doing the following:


    +   - Configuring a cluster URL with the -cluster argument when starting the server

    +   - Specifying routes in the additional server nodes


    Assuming we have two different Linux servers on 192.168.2.238 and 192.168.2.247,
    we can configure a cluster with the following commands:


    ```

    nats-server -DV -cluster nats://192.168.2.238:4248

    nats-server -DV -cluster nats://192.168.2.247:4248 -routes nats://192.168.2.238:4248

    ```


    # Using the Docker NATS server


    In addition to RPM and debs, Synadia distributes and maintains Docker images that
    are probably the easiest way to run a NATS server, as shown in Example 10-1.


    Example 10-1. Running NATS Using Docker'

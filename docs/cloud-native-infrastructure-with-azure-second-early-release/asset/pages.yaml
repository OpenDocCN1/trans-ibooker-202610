- pgno: 55
  md: "native environments.\n\n# Ansible\n\nAnsible is a simple configuration management\
    \ tool that allows you to provision, configure, and manage servers. Ansible makes\
    \ it really easy to manage servers that have no preinstalled agent running on\
    \ them, though you can configure Ansible as an agent-based system as well. Also,\
    \ you can leverage Ansible as a tool once you have created the infrastructure\
    \ using Terraform and prebaked machine images using Packer.\n\nThe basic concepts\
    \ of Ansible are as follows:\n\n*Playbooks*\n\nAnsible playbooks are a list of\
    \ tasks or *plays* that need to be executed on an instance. A simple example would\
    \ be:\n\n+   - Add the Nginx repository.\n+   - Install Nginx.\n+   - Create the\
    \ root directory.\n\nThis ordered list can be converted into an Ansible playbook\
    \ as follows:\n\n```\n---\n- hosts: local\n  vars:\n    - docroot: /var/www/serversforhackers.com/public\n\
    \  tasks:\n    - name: Add Nginx Repository\n      apt_repository: repo='ppa:nginx/stable'\
    \ state=present\n    - name: Install Nginx\n```"
  merge: -1
  img_proc: true
- pgno: 56
  md: "```\napt: pkg=nginx state=installed update_cache=true\n\n- name: Create Web\
    \ Root\n  file: dest=/etc/nginx\n    mode=775\n    state=directory\n    owner=www-data\n\
    \    group=www-data\n  notify:\n    - Reload Nginx\n```\n\n# Control node\n\n\
    This is usually the node from which you will be executing the Ansible playbook.\
    \ This could be any node where Ansible is installed. To run an Ansible playbook,\
    \ you can execute the following command in your terminal:\n\n```\nansible-playbook\
    \ -vi path_to_host_inventory_file playbook.yaml\n```\n\n# Managed nodes\n\nThe\
    \ nodes or the hosts that you want to manage are referred to as managed nodes.\
    \ These nodes are usually the remote servers. The best part about Ansible is that\
    \ you don’t need to install an agent on the remote instances to manage them. All\
    \ you need is a Secure Shell (SSH) daemon that is listening and Python installed\
    \ on the hosts. Ansible creates an SSH connection to execute the playbooks."
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Inventory file


    The inventory file holds the list of all the hosts Ansible is managing. The inventory
    usually holds IP addresses, hostnames, the SSH username, and keys to connect to
    the remote machine. The following is an example of the inventory:


    ```

    mail.example.com


    [webservers]

    foo.example.com

    bar.example.com


    [dbservers]

    one.example.com

    two.example.com

    three.example.com


    [midtierrservers]

    10.0.1.2

    10.2.3.4

    ```


    Since Ansible does not require a lot of overhead and is written in YAML, it serves
    as a great post-configuration tool. We will be using Ansible in this book at times
    to provision parts of the services.


    Before we wrap up this chapter, let’s take a quick look at Azure DevOps, which
    helps us combine all of these tools in an automated fashion to create a CI/CD
    pipeline.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Azure DevOps and Infrastructure as Code


    Azure offers *Azure DevOps*, which provides an end-to-end DevOps toolchain for
    developing and deploying applications and is primarily a hosted service for deploying
    CI/CD pipelines. You can use Terraform, Ansible, and Packer together as well,
    and build multistaged pipelines for your projects. Azure DevOps has a bunch of
    services, including *Azure Pipeline*, which is primarily used for building, testing,
    and deploying the CI/CD pipelines. We will not take a deep dive into Azure DevOps
    since it’s beyond the scope of this book, but you can read more about setting
    up Azure DevOps in the official documentation.⁹


    # Summary


    In this chapter, we introduced the steppingstones for building a modern cloud
    native environment using Azure. You created an Azure account, which will come
    in handy in upcoming chapters as you gain a deeper understanding of cloud native
    technologies. You were also introduced to Terraform, Packer, and Ansible: three
    helpful cloud native orchestrators that will assist you in deploying and managing
    your cloud infrastructure. Terraform is a cloud-agnostic tool for developing infrastructure
    as code from the ground up, Packer is used to create machine images for development
    of immutable artifacts, and Ansible is a configuration management tool.


    With this basic understanding of Azure and related technologies under your belt,
    we can move on to the next chapter, where we will talk about containers, the container
    registry, and containerizing your application.'
  merge: -1

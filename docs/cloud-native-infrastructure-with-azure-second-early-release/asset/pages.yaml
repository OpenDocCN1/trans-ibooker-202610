- pgno: 292
  md: 'NOTE

    Cilium provides an interactive tool to model network policies and visualize them.
    You can try it out on the Cilium Editor page.


    # Observability


    As we briefly mentioned earlier, Hubble is where Cilium operators can observe
    what is happening in their infrastructure. Once you install Hubble and the connectivity
    test (from the installation steps), you will be able to observe network flows
    within the namespace. In this section, we will go one step further and utilize
    a new Cilium feature that provides Layer 3 and Layer 4 protocol visibility, which
    will give you more specific details about the traffic on each port. You will need
    to implement Layer 7 policies to get Layer 7 observability features.


    To enable Layer 3 and Layer 4 visibility, you will need to enable annotations
    on your Pods. Here’s an example:


    ```

    $ kubectl annotate pods --all io.cilium.proxy-visibility="<Egress/53/UDP/DNS>,<Ingress/80/TCP/HTTP>"

    ```


    This will enable metrics on outbound (egress) DNS traffic as well as inbound (ingress)
    HTTP traffic to the Pod.


    Visibility information is represented by a comma-separated list of tuples in the
    annotation:


    ```

    <{Traffic Direction}/{L4 Port}/{L4 Protocol}/{L7 Protocol}>

    ```


    When enabled, Hubble will display protocol-specific information. See Figure 8-7
    as an example of DNS visibility.'
  merge: -1
  img_proc: true

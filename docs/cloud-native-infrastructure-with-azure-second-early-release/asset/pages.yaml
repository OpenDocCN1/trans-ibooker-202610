    # Service


    As we mentioned earlier, the Kubernetes environment is a very dynamic system where
    Pods are created, destroyed, and moved at a varying pace. This dynamic environment
    also opens a door to a well-known problem: finding the replica Pods where an application
    is residing, since multiple Pods are running for a deployment. Pods also need
    a way to find the other Pods in order to communicate. Kubernetes offers the Service
    object as an abstraction for a single point of entry to the group of Pods. The
    Service object has an IP address, a DNS name, and a port that never changes as
    long as the object exists. Formally known as service discovery, this feature basically
    helps other Pods/services reach other services in Kubernetes without dealing with
    the underlying complexity. We will discuss the cloud native service discovery
    approach in more detail in Chapter 6.


    To use a service, you can use the service manifest YAML. Suppose you have a simple
    “hello world” application already running as a deployment. One default technique
    to expose this service is to specify the service type as ClusterIP. This service
    will be exposed on the cluster’s internal IP and will only be reachable from within
    the cluster, as follows:'
  merge: -1
  img_proc: true
- pgno: 138
  md: "```\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: hello-world-service\n\
    spec:\n  type: ClusterIP\n  selector:\n    app: hello-world\n  ports:\n  - port:\
    \ 8080\n    targetPort: 8080\n```\n\nThe port represents the port where the service\
    \ will be available and the targetPort is the actual container port where the\
    \ service will be forwarded. In this case, we have exposed port 8080 of the hello-world\
    \ app on target port 8080 against the Pod IP:\n\n```\n$ kubectl get svc\nNAME\
    \                 TYPE        CLUSTER-IP     EXTERNAL-IP\nPORT(S)            \
    \  AGE\nhello-world-service  ClusterIP   10.32.0.40     <none>\n8080/TCP     \
    \        6s\n```\n\nThe IP address shown is the cluster IP and not the actual\
    \ machine IP address. If you SSH on a worker node, you can check whether the service\
    \ was exposed on port 8080 by simply doing a curl as follows:\n\n```\nubuntu@worker0:~$\
    \ curl http://10.32.0.40:8080\nHello World\n```\n\nIf you try to reach this IP\
    \ address from outside the cluster (i.e., any other node apart from workers),\
    \ you won’t be able to connect to it. So, you can use NodePort, which exposes\
    \ a service on each node’s IP at a defined port as follows:\n\n```\n---\napiVersion:\
    \ v1\nkind: Service\nmetadata:\n  name: hello-world-node-service\n```"

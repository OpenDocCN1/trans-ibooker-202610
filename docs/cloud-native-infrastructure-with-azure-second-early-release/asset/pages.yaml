    # Flannel


    Flannel is an (OSI) Layer 3 network fabric system for Kubernetes that was originally
    part of Red Hat’s CoreOS project. It is one of the simplest CNIs for Kubernetes.
    It relies on one binary agent, named flanneld, to run on each host to configure
    an overlay Pod network and then store the configuration in the Kubernetes data
    store. Flannel only provides network connectivity. It doesn’t support any kind
    of network policy enforcement.


    # Deploying Flannel'
  merge: -1
  img_proc: true
- pgno: 294
  md: "Flannel can be quickly installed when you’re setting up your cluster by running:\n\
    \n```\n$ kubectl apply -f\nhttps://raw.githubusercontent.com/coreos/flannel/master/Documentation/kube-flannel.yml\n\
    ```\n\nThe application of *kube-flannel.yml* will define the following:\n\n+ \
    \  - A `ClusterRole` and `ClusterRoleBinding` for role-based access control (RBAC).\n\
    \n+   - A Kubernetes service account for Flannel to use.\n\n+   - A `ConfigMap`\
    \ containing both a CNI configuration and a Flannel configuration. The network\
    \ in the Flannel configuration should match the Pod network’s Classless Inter-Domain\
    \ Routing (CIDR) scheme. The choice of backend is also made here, and it defaults\
    \ to VXLAN.\n\n+   - A DaemonSet for every architecture to deploy the Flannel\
    \ Pod on each node. The Pod has two containers: the Flannel daemon itself, and\
    \ an `initContainer` for deploying the CNI configuration to a location that the\
    \ kubelet can read.\n\nWhen you run Pods, they will be allocated IP addresses\
    \ from the Pod network CIDR. No matter which node those Pods end up on, they will\
    \ be able to communicate with one another.\n\n> **NOTE**\n> \n> This manifest\
    \ will configure the Pod network to be 10.244.0.0/16 and to use the VXLAN backend\
    \ by default. A 10.244.X.0/24 mask will be given to each node in the Pod.\n\n\
    You can reconfigure your backend to use a different address space, a smaller mask,\
    \ or different backend settings by modifying the data that’s"
  merge: -1
  img_proc: true
- pgno: 295
  md: 'written into *net-conf.json* in the *fkube-flannel.yaml* file. You can find
    more information on backend configuration from the Flannel backend documentation
    and Flannel configuration pages.


    Now Kubernetes worker nodes will have IP addresses from your Azure VNet, but any
    deployed Pod will have IP addresses from the configured Pod Network IP range.
    If you want to have multiple Pod Networks (for network traffic separation), you
    will have to run a separate `flanneld` process.


    # A Flannel Deep Dive


    Flannel is a simpler Kubernetes CNI and requires minimal configuration. It has
    pluggable backends that create overlay networks between machines on a network
    (see Figure 8-8). Supported transport backends include:


    +   - VXLAN

    +   - Host-gw

    +   - User Datagram Protocol (UDP)

    +   - Alivpc

    +   - Alloc

    +   - Amazon Virtual Private Cloud (VPC)

    +   - Google Compute Engine (GCE)

    +   - IPIP

    +   - IPsec'
  merge: -1

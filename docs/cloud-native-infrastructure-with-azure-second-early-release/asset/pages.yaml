- pgno: 336
  md: 'In our earlier email example, the intermediate components, the MTAs, act as
    brokers between the sender and the receiver. In many cases, the MTA software can
    be clustered. One or more brokers in a cluster allow senders and receivers to
    be decoupled from one another. RabbitMQ, Kafka, and NATS, the messaging implementations
    discussed in this chapter, require at least one broker, and following the principle
    of most distributed system protocols, they often require a minimum of three brokers
    and generally should be odd-numbered counts (for consistency algorithms). Considerations
    for clustering include state replication, leader election, node membership behavior,
    and cluster partitioning in the event of network failure (and the dreaded split-brain
    problem).


    Other considerations for clusters (which can quickly become a bottleneck) are
    how they can be scaled without downtime. The operational overhead of maintaining
    high-throughput and low-latency messaging clusters is why teams opt for the cloud
    provider to manage the infrastructure so that developers can focus on developing
    and optimizing producer and consumer applications.


    # Durability and Persistence


    Anyone who has ever sent an email to a nonexistent address has received error
    messages from a mail server indicating that after a certain period of time the
    message has expired. The implication is that your message is stored on an external
    system after it leaves your mail client.


    Depending on the messaging use case and the type of data being stored and processed,
    it may have more or less criticality, have higher or lower perishability, and
    be more or less critical that every message (or transaction) be stored before
    processing. Just as in the case of Transmission Control Protocol (TCP) and User
    Datagram Protocol (UDP) client/server applications, the amount of error handling
    and retry logic implemented at the application layer versus the underlying transport
    layer is important to consider when building a production system. Messaging systems
    distribute intelligence to the producers, consumers, and brokers in different
    ways.


    Furthermore, the mechanisms used to store the messages vary from system to system.
    Some systems have purely memory-based storage, which makes them less durable,
    particularly in cloud environments, and others have disk-backed solutions which,
    while having challenges in cloud environments, provide a more durable and reliable
    experience.


    # Message Delivery


    In addition to the source and destination, there are three important patterns
    you should be aware of for message-oriented platforms which we will be covering
    in this chapter:


    *At least once*


    Implies that there could be duplicates; in particular, if a consumer crashed and
    did not notify the broker that the message had been received, or that a message
    may be delivered to multiple consumers


    *At most once*


    Assumes a message might be sent but not actually be received or acknowledged by
    a consumer, putting the burden of redelivery on the client


    *Exactly once*


    A very limited situation in which transactions are required and messages must
    be delivered exactly one time


    The messaging architecture may support one or more of these patterns. These also
    may be configurable on the broker itself or in the consumer and producer client
    libraries.


    # Security'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'The sensitivity of the data contained in your message topic may vary, so it
    is necessary to have flexible controls on who can produce and consume to and from
    these topics. A message system should verify the identity of both the producer
    and consumer and then apply read/write permissions to the topic. Furthermore,
    the data that a system retains should be encrypted at rest.


    Now that you understand some of the fundamentals of messaging, let’s look at some
    common messaging patterns that you may come across.


    # Common Messaging Patterns


    We’re going to look at three common messaging architectures that you will see
    in modern infrastructure.


    # Simple Queue


    Producers (P) publish to a queue (B), and as consumers (C) read off the queue,
    messages are deleted and no other consumers will process the message.


    # Publish and Subscribe


    As shown in Figure 10-6, a Producer (P) sends messages, and all listening (subscribed)
    consumers (C) receive the messages. There may or may not be acknowledgment, but
    if consumers are not online, they will miss the message.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_337_0.png)


    Figure 10-6. A simple pub/sub message system


    # Durable Queue


    As shown in Figure 10-7, a Producer (P) sends messages to the broker (B) and (C)
    consumes independently processing messages in an ordered list based on a pointer,
    but may rewind to a known point in the list, such as the first message within
    a given window.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_337_1.png)


    Figure 10-7. A durable ordered message queue


    So far we’ve covered a lot of theory around messaging basics and architecture.
    We’ll now dive into the various cloud native messaging platforms.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# An Overview of Popular Cloud Native Messaging Platforms


    In this section, we will review a number of popular cloud native messaging platforms
    that have become commonplace in modern infrastructure.


    # RabbitMQ


    Although RabbitMQ is more than 15 years old and obviously predates widespread
    public adoption of the cloud and microservices, it is a proven messaging system
    that has powered critical workloads and has continued to be relevant in the world
    of containers and Kubernetes clusters. One of the reasons for this is that RabbitMQ
    was developed in Erlang/OTP, a functional programming language that is designed
    for scalability, concurrency, and reliability and is therefore ideal for building
    distributed systems that process millions to hundreds of millions of messages
    per day with very low downtime.


    # Apache Kafka


    In 2010, engineers at LinkedIn found that RabbitMQ could not scale to the complex
    nature and size of their ecosystem. Kafka was created to allow messaging to become
    the core of LinkedIn’s technology stack and has successfully scaled to trillions
    of messages a day across the site.


    Later in this chapter we will discuss Azure Event Hubs, a service that is compatible
    with Apache Kafka and allows applications to simply update the consumer/producer
    connection string, but may not make all of Kafka’s features available. Managed
    Kafka is also part of HDInsight, a broad suite of analytics services in the cloud
    on Azure. HDInsight is beyond the scope of this book.


    # CNCF CloudEvents


    CloudEvents was first started in 2017 within the CNCF Serverless Working Group.
    In CNCF’s own words: “CloudEvents is a specification for describing event data
    in common formats to provide interoperability across services, platforms and systems.”
    While this project does have large potential (and is supported by Azure Event
    Grids), we won’t cover it in further detail in this book.


    # Cloud Messaging Deep Dive with NATS


    NATS is another open source messaging implementation that has been accepted by
    CNCF. NATS was first released in 2011 and was initially implemented in Ruby as
    the messaging and service discovery layer for Cloud Foundry. It was later rewritten
    in Golang and is under very active development today. Although not as popular
    as RabbitMQ or Kafka, NATS provides multiple easily deployable options due to
    its single binary server available on multiple operating systems, processor architecture,
    and official Docker repositories. Client libraries are available for all popular
    programming languages. Simplicity, operability, performance, and security are
    cited as the advantages of NATS over other messaging implementations, as is the
    ability to easily use a bare minimum feature set with a preference for “at most
    once” delivery.


    Since the base pub/sub protocol does not implement message persistence, consumers
    must be active to receive the message, making NATS optimal for exchanging data
    that is highly perishable, and data that is frequently updated such as sensor
    data. By default, messages will be routed to all listening subscribers to that
    topic, similar to multicast networking.


    Given its low memory footprint and extremely high performance, NATS is also ideal
    for edge and IoT analytics use cases. For such a lightweight messaging implementation
    that focuses on simplicity, NATS has relatively sophisticated authentication and
    authorization capabilities and supports multitenancy by default through accounts.
    NATS Streams and NATS JetStream support both memory and disk-based persistence.
    NATS pub/sub and streaming have supported high availability and horizontal scalability
    from the start, and JetStream has been implementing them since early 2021.'
  merge: -1

  md: '# Deployments


    Kubernetes is primarily a declarative-syntax-focused orchestrator. This means
    that in order to roll out new features, you need to tell Kubernetes what you need
    to do and it’s up to Kubernetes to figure out how to perform that operation in
    a safe manner. One of the objects that Kubernetes offers in order to make the
    release of new versions of applications smoother is `Deployment`. If you manually
    go on updating Pods, you will need to restart the Pods, which will cause downtime.
    While a ReplicaSet knows how to maintain the desired number of Pods, it won’t
    do a zero-downtime upgrade. Here is where the `Deployment` object comes into the
    picture, as it helps roll out changes to Pods with zero downtime by keeping a
    predefined number of Pods active all the time before a new updated Pod is rolled
    out.


    # Services


    To expose an application that is running inside a Pod, Kubernetes offers an object
    called `Service`. Since Kubernetes is a very dynamic system, it is necessary to
    ensure that applications are talking to correct backends. Pods are short-lived
    processes in the Kubernetes world, as they are frequently created or destroyed.
    Pods are coupled with a unique IP address, which means that if you rely on just
    the IP address of Pods, you will most likely end up with a broken service when
    a Pod dies, as the Pod will get a different IP address after restart, even though
    you have ReplicaSets running. The `Service` object offers an abstraction by defining
    a logical set of Pods and a policy by which to access them. Each service gets
    a stable IP address and a DNS name that can be used to access the Pods. You can
    declaratively define the services that front your Pods and use the `Label-Selector`
    to access the service.


    # Namespaces


    Since multiple teams and projects are deployed in a production-grade environment,
    it becomes necessary to organize the Kubernetes objects. In a'

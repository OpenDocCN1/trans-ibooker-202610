- pgno: 24
  md: '# ANTIFRAGILE INFRASTRUCTURE


    Antifragile infrastructure are systems that can endure stress and showcase elasticity
    along with resiliency. Antifragile aims to build infrastructure that can handle
    unpredictable and irregular events while growing stronger.


    Today’s cloud native applications are considered to be applications in motion
    since the underlying infrastructure also keeps changing and upgrading. The cloud
    enables you to treat your infrastructures as short-lived entities rather than
    permanent entities. The cloud native approach promotes building infrastructure
    that is replaceable as opposed to fixing infrastructure that is broken. Since
    the cloud native approach decouples applications from your infrastructure, it
    gives engineers the control and confidence to make changes to the infrastructure,
    knowing that they can roll back and move forward with ease.


    # CLOUD NATIVE INFRASTRUCTURE PHILOSOPHY


    While building cloud native infrastructure, always treat your underlying infrastructure
    as short-lived entities rather than long-living, maintainable systems. This means
    that if a server goes down, it will be easy to kill it and bring up a new server
    instantly, rather than trying to fix it.


    The shift from monolithic architecture to microservices also helped IaC gain momentum
    by ensuring that modern applications were able to follow the “twelve-factor app”
    methodology, which allows infrastructure decisions to be made independent of application
    development. Another important advantage of IaC in building cloud native infrastructure
    is that it enables immutable infrastructure; that is, once the infrastructure
    is deployed, it can’t be changed or configured. In a typical mutable application
    deployment scenario, an application is developed, then it’s deployed on underlying
    infrastructure, and finally it’s configured on the underlying infrastructure (Figure
    2-1). This process introduces configuration drift, which gives rise to infrastructure
    that starts to transition away from the initial state. Immutable'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'infrastructure, on the other hand, focuses on redeployment of infrastructure
    and applications each time a new change is pushed, which tightly holds the infrastructure
    to its exact state. Immutability is achieved by developing and configuring your
    application in a prebaked (e.g., machine image) state and then deploying it (Figure
    2-2).


    ![](img/8d47d1b5dbca55e784ae602145a894c7_25_0.png)


    Figure 2-1. The mutable flow


    ![](img/8d47d1b5dbca55e784ae602145a894c7_25_1.png)


    Figure 2-2. The immutable flow


    The main advantages of building immutable infrastructure are:


    +   - Predictable infrastructure/systems rather than reactive infrastructure/systems

    +   - Deployments that are now atomic in nature

    +   - More control of your infrastructure, which leads to better telemetry


    Now that we have discussed IaC and its value when building cloud native infrastructure,
    let’s look at how you can use Microsoft Azure in your cloud native infrastructure.


    # Getting Started with Azure and Setting Up the Environment


    Microsoft Azure is a cloud provider with tens of regions across the globe. Azure
    allows you to quickly create and deploy infrastructure via both manual and automated
    means, as we’ll discuss throughout this book. Azure as a PaaS (platform as a service)
    gives a lot of flexibility to the developer'
  merge: -1

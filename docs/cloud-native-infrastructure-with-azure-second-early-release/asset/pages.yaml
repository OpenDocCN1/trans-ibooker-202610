    \  10.32.0.40     <none>\n8080/TCP         41m\n```\n\nNow we can access the service\
    \ on the node at port 30767:\n\n```\nubuntu@controller0:~$ curl http://10.240.0.21:30767\n\
    Hello World\n```\n\nThe IP in the curl command is the worker node’s physical IP\
    \ (not the cluster IP) address, and the port that is being exposed is 30767. You\

- pgno: 310
  md: '# Chapter 9. Distributed Databases and Storage: The Central Bank


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 9th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at rfernando@oreilly.com.


    One of the largest hurdles to overcome when building a cloud native infrastructure
    is operating reliable and scalable storage for both online and offline use. While
    earlier sentiment around storage services being run in the cloud was frowned upon,
    a number of cloud native storage projects have succeeded, the most prominent being
    Vitess. Cloud services, including Azure, have also significantly invested in managed
    disks for virtual machines and virtual machine scale sets, as well as advanced
    storage accounts (such as Gen2) and managed database services (such as MySQL,
    SQL Server, and Redis). All of this has made storage a first-class concept in
    Azure’s cloud. In this chapter, we will look at why you should run storage solutions
    at scale in Azure and how you can orchestrate them in a way that is easy to manage.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# The Need for Distributed Databases in Cloud Native Architecture


    Although Azure provides a number of managed data (both SQL and NoSQL) solutions,
    sometimes you may need to run larger and more specialized setups while operating
    in the cloud. The ecosystem of self-operated Cloud Native Computing Foundation
    (CNCF) database projects will allow you to scale to a larger size than Azure platform
    as a service (PaaS) services provide, and will give you more features and performance
    options.


    As this chapter will further discuss, the CNCF landscape lays out a set of storage
    solutions that are primarily designed for cloud operations. The benefit of these
    systems is that server management overhead is minimized, while you still have
    complete control over the system.


    In this chapter, we will examine some of the mature data stores that are part
    of the CNCF landscape. Vitess, Rook, TiKV, and etcd are all mature cloud data
    stores that are able to scale to a tremendous size and are being run as first-class
    data systems across Azure. These systems represent the foundational building blocks
    of a data ecosystem that’s operated in a cloud infrastructure.


    # RUNNING STATEFUL WORKLOADS ON AKS


    > At the time of this writing, Azure Kubernetes Service (AKS) supports multiple
    availability zones (i.e., multiple data centers within a region); however, it
    does not support multiple fault domains. This means that if your AKS cluster is
    in only one availability zone, it is theoretically possible to have downtime because
    multiple nodes in your cluster are unavailable. We recommend that you split your
    AKS cluster over multiple availability zones until AKS supports fault domains.


    # Azure Storage and Database Options


    Before you start building your cloud data stores, you should thoroughly evaluate
    your use case, particularly the storage, performance, and cost of'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'what you are trying to build. You may find that Azure’s PaaS services might
    be a better fit for a particular use case, rather than using a CNCF product. For
    example, Azure’s Hadoop Distributed File System (HDFS) storage offering, Gen2
    storage accounts, is an extremely economical solution for storing large volumes
    of data.


    At the time of this writing, Azure provides the following storage and database
    PaaS services:


    +   - Azure Cosmos DB

    +   - Azure Cache for Redis

    +   - Azure Database for:

    +     - MySQL

    +     - PostgreSQL

    +     - MariaDB

    +   - Storage accounts (providing blob, Network File System [NFS], and hierarchical
    storage)

    +   - Azure Storage Explorer


    We recommend that you evaluate the performance of these Azure offerings, specifically
    considering the performance, availability, and cost of a PaaS service, to ensure
    that you’re using the correct system for your use case. Azure provides a pricing
    calculator tool that is extremely useful for modeling costs.


    If you believe that an Azure PaaS service does not fit your requirements, continue
    reading this chapter to learn about other potential data storage solutions.


    # Introduction to Vitess: Distributed and Sharded MySQL'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'Vitess is a database cluster system for horizontal scaling of MySQL and MariaDB.
    It was created by YouTube engineers in 2010 as a means to protect and scale their
    databases. It provides a number of features that aid in performance, security,
    and monitoring, but most importantly, it offers powerful tools to manage database
    topologies and provide first-class support for vertical and horizontal sharding
    and resharding. In many aspects, it allows you to operate SQL databases in a NoSQL
    manner, while still getting all the benefits of running a relational database.


    # Why Run Vitess?


    You may be asking yourself: “Why should I run Vitess, instead of using Azure Cosmos
    DB?” Although Cosmos DB is an attractive option for globally distributed writes
    and replicas, the current cost model makes it prohibitively expensive to run at
    scale (thousands of queries per second), making a system like Vitess an attractive
    offering for those who need a high-throughput relational database with a more
    customizable setup.


    Vitess provides the following benefits:


    Scalability


    You can scale individual schemas up and down.


    Manageability


    A centralized control plane manages all database-related operations.


    Protection


    You can rewrite queries, build query deny lists, and add table-level access control
    lists (ACLs).


    Shard management


    You can easily create and manage database shards.


    Performance'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'A lot of the internals are built for performance, including client connection
    pooling and query deduping.


    Vitess helps you manage the operational and scaling overhead of relational databases
    and the health of your cluster. Furthermore, Vitess offers a wider range of configurables
    than traditional cloud database offerings (including Cosmos DB) which will help
    you meet your scaling and replication requirements.


    # The Vitess Architecture


    Vitess provides sharding as a service by creating a middleware-style system while
    still utilizing MySQL to store data. The client application connects to a daemon
    known as VTGate (see in Figure 9-1). VTGate is a cluster-aware router that routes
    queries to the appropriate VTTablet instances which manage each instance of MySQL.
    The Topology service stores the topology of the infrastructure, including where
    the data is stored and the ability of each VTTablet instance to serve the data.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_315_0.png)


    Figure 9-1. The Vitess architecture


    Vitess also provides two administrative interfaces: vtctl, a CLI; and vtctld,
    a web interface.


    VTGate is a query router (or proxy) for routing queries from the client to the
    databases. The client doesn’t need to know about anything except where the VTGate
    instance is located, which means the client-to-server architecture is straightforward.


    # Deploying Vitess on Kubernetes


    Vitess has first-class support for Kubernetes, and it is very straightforward
    to get started with it. In this walkthrough, we’ll create a cluster and a schema
    and then expand the cluster.


    +   - First, clone the vitess repository and move to the vitess/examples/operator
    folder:


    ```

    $ git clone git@github.com:vitessio/vitess.git

    $ cd vitess/examples/operator

    ```'
  merge: -1
  img_proc: true

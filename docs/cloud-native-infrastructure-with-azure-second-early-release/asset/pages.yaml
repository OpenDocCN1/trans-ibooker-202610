- pgno: 272
  md: '# Calico


    Calico is an open source network security and policy solution for containers,
    virtual machines, and bare metal installations under Windows and Linux. Calico
    provides network security policy enforcement as well as the ability to implement
    zero-trust networks. Calico supports multiple data planes, including a state-of-the-art
    pure Linux extended Berkeley Packet Filter (eBPF) data plane, standard Linux networking
    data plane, and Windows HNS data plane. Calico runs on top of the host data plane
    to perform network policy enforcement. It supports the standard Linux networking
    stack.


    # Why Would You Use Calico?


    Managing network connectivity and policy becomes exponentially more difficult
    as your infrastructure grows. Furthermore, it is exceptionally difficult to ensure
    that the intended policy is correct and is applied correctly, and that feedback
    on the policy is applied. This is where Calico shines. It allows you to define
    your network policy in an abstracted, scalable manager and then ensures that the
    policy is being applied without sacrificing network performance.


    # Basic Architecture


    Calico has a client/data store architecture that simplifies operation of the platform.
    It includes the following key components (also depicted in Figure 8-1):


    Felix


    The network programmatic daemon that installs network access control lists (ACLs),
    routing information, and interface management and state reporting


    BIRD'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Gets routing information from Felix and redistributes the routes over Border
    Gateway Protocol (BGP)


    # confd


    Listens for routing changes from the Calico data store and passes them on to BIRD


    # Calico CNI plug-in


    The interface to the container’s network interfaces


    # Data store


    Contains operational information about policies, workloads, and IPAM allocations


    # Typha


    A caching proxy for the data store that is used to scale the number of nodes connecting
    to the data store


    # calicoctl


    CLI for creating, reading, updating, and deleting Calico objects'
  merge: -1
  img_proc: true
- pgno: 274
  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_274_0.png)


    Figure 8-1. Calico architecture


    # Deploying Calico


    There are two options for deploying Calico: install it as part of the network
    policy engine in an AKS installation or deploy it manually on Kubernetes.'
  merge: -1

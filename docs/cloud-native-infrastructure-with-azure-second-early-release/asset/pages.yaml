- pgno: 183
  md: '# JOBS AND INSTANCES


    In Prometheus terms, an endpoint you can scrape is called an *instance*, and it
    usually corresponds to a single process. A collection of instances with the same
    purpose—a process replicated for scalability or reliability, for example—is called
    a *job*.


    Here is an example of an API server job with four replicated instances:


    ```

    job: api-server

    instance 1: 1.2.3.4:5670

    instance 2: 1.2.3.4:5671

    instance 3: 5.6.7.8:5670

    instance 4: 5.6.7.8:5671

    ```


    Let’s install and configure Prometheus to gain an understanding of some additional
    key concepts around the Prometheus ecosystem.


    # Installing and Configuring Prometheus


    To install and run Prometheus locally, first you need to download the correct
    release for your platform from https://prometheus.io/download. At the time of
    this writing, the latest version of Prometheus is 2.23. Once you have downloaded
    the tarball, go to the directory and extract it by using the following command:


    ```

    $ tar xvfz prometheus-2.23.0.darwin-amd64.tar.gz

    $ cd prometheus-2.23.0.darwin-amd64

    ```


    Once you are inside the Prometheus directory, you can configure Prometheus to
    scrape its own HTTP endpoint with the help of the *prometheus.yaml* file, which
    is in the Prometheus directory. The default file already contains TCP port 9090
    on the localhost where the Prometheus server runs. You can run Prometheus by executing
    the binary using the following command:


    ```

    $ ./prometheus


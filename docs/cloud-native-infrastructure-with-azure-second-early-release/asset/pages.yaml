    # Exploring the Kiali dashboard


    In this section, we’ll explain how you can use the Istio features right from the
    Kiali dashboard. For this demonstration, we’re using an example of a small travel
    application service. Though we will not focus much on the application, we will
    highlight Kiali’s features and how efficiently it provides every detail about
    your cloud native application. We will also provide a high-level overview of the
    business logic of the demo application. If you want to learn more, please refer
    to the official Kiali documentation for the travel demo.⁴


    This application simulates two business domains organized in different namespaces.
    The first namespace is called travel-portal and it has several travel shops, where
    users can search for and book flights, hotels, cars, and travel insurance. The
    shop applications can behave differently based on request characteristics such
    as channel (web or mobile) and user (new or existing). All the portals consume
    a service called travels that is deployed in the travel-agency namespace.


    The second namespace is called travel-agency and it hosts a set of services created
    to provide quotes for travel. A main travel service will be the business entry
    point for the travel agency. It receives a destination city and a user as parameters
    and it calculates all the elements that compose a travel budget: airfare, lodging,
    car reservation, and travel insurance.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Each service can provide an independent quote and the travel service must then
    aggregate them into a single response.


    There is a third namespace as well, called `travel-control`, which runs the main

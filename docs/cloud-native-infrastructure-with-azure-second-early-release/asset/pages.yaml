- pgno: 231
  md: '# Chapter 7. Service Discovery and Service Mesh: Finding New Territories and
    Crossing Borders


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 7th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at rfernando@oreilly.com.


    As modern applications moved to a microservices architecture, they became scalable
    and efficient over the cloud. Microservices favor breaking down an application
    into independent, decoupled components. Decoupling is usually achieved by separating
    the codebases into standalone applications that are connected using the network
    and well-defined APIs/interfaces that microservices use to communicate. Once you
    move your applications to a microservices architecture, a lot of opportunities
    open up: you can scale each individual service, decouple the release cycle for
    each service, choose a different language to write your individual application
    components, and even organize your team structure based on these independent services.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'However, now that you have broken your application into smaller applications,
    these binaries have their own lifecycle. This lifecycle gets scheduled independently
    and terminated independently as needed, while it’s maintaining communication over
    the network. Imagine if, in this scenario, you had a lot of microservices running
    and communicating with one another. You would likely start asking several questions,
    including the following:


    +   - How do the services communicate with one another when they are dynamic in
    nature? (That is, since services communicate over a network, the IP address doesn’t
    provide enough information to reach the services as they can be terminated independently
    and rescheduled on a different host.)

    +   - How do I control and manage the traffic or route traffic as needed, including
    advanced scenarios like Canary releases, A/B testing, and circuit breaking?

    +   - How can I ensure security between the services and encrypt the traffic between
    them?


    To solve these problems, you could start writing and building additional infrastructure-specific
    logic within your application. However, this would increase the application scope
    beyond your business needs, and you would have to implement this logic with every
    microservices stack that you use.


    Luckily, these problems have been solved in the cloud native environment space
    with the help of service discovery and service mesh technologies, which offer
    a much more flexible way to manage, secure, and provide far greater control over
    services.


    *Service discovery* is a mechanism through which services discover one another
    so that they can communicate. Service discovery is primarily focused on finding
    the network location of a service in the cloud. In traditional environments, where
    you have to deal with physical servers, you are aware of the static IP addresses
    for your servers and you can use a simple configuration file to store the IPs
    which can be used by your services'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'to reach out to other services. This setup works fine in a local or physical
    environment setup. But for highly scalable applications in the cloud, this approach
    fails, since now your application is dynamic in nature, which means the application
    can be restarted, rescheduled, or terminated as needed. In such scenarios, one
    cannot hardcode the IP, since it can change. Service discovery helps by storing
    a mapping for each service name to the IP address in the cloud.


    A *service mesh* focuses on solving the increased complexity that comes with interservice
    communication. A service mesh is a dedicated infrastructure that handles all service-to-service
    network communication within the cloud environment. It provides high visibility,
    resiliency, traffic management, and security control with little to no change
    to the existing application code.


    In this chapter, we will look at CoreDNS, a prominent service discovery platform
    in the cloud native world that is used by the Azure Kubernetes Service (AKS) for
    cluster DNS management and name resolution. We will also cover Istio, a prominent
    service mesh that is widely used in cloud environments like Azure.


    # Service Discovery


    Service discovery is a fundamental component of a modern cloud native environment.
    It is responsible for ensuring that services can find and communicate with one
    another over a network. Typically, service discovery involves a *service registry*
    where all the services/applications in the cloud environment need to register.
    The service registry is the central repository that holds the location of the
    services. In a typical scenario, a new service first registers itself with the
    service registry when it enters the environment. The service registry updates
    the latest network location of the service, and when a consumer service requests
    to connect to the service, the service registry serves the consumer with a location
    for the service.


    In this section, we will explore CoreDNS and see how it can be used as a service
    discovery tool in cloud environments.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Introduction to CoreDNS


    CoreDNS is an extensible DNS server that supports standard DNS, DNS over TLS,
    and DNS over gRPC protocols. CoreDNS was created by Miek Gieben in 2016 by utilizing
    a server framework developed as part of the Caddy¹ web server. It has a plug-in
    architecture that is highly configurable, flexible, and extensible. CoreDNS saw
    wider adoption after receiving support from the Cloud Native Computing Foundation
    (CNCF). In 2019, CoreDNS received the “graduated” maturity level from CNCF.²


    CoreDNS is now the official default DNS server with Kubernetes 1.13 and later,
    replacing kube-dns. CoreDNS solves the reliability and security issues in the
    original implementation of kube-dns through several key differences:


    +   - CoreDNS runs a single container, whereas kube-dns ran three containers:
    kube-dns, dnsmasq, and sidecar.

    +   - CoreDNS is designed for use as a general-purpose DNS server that is backward
    compatible with Kubernetes.

    +   - CoreDNS is primarily a Go process that enhances the functionality of kube-dns.


    The CoreDNS plug-in architecture ensures that the DNS server functionality remains
    stable and enables further functionality to be added using plug-ins. The end user
    can define multiple servers by configuring zones to serve on a particular port.
    Each server passes the requests through a plug-in chain which determines what
    type of response to send:


    +   - If multiple servers are configured to listen on the queried port, it will
    check which one has the most specific zone for the query using the longest suffix
    match. For example, if a user makes a query for www.health.abc.com and there are
    two servers configured as abc.com and health.abc.com, the query will be routed
    to the latter server.

    +   - Once an appropriate server has been found, it will be routed through the
    plug-in chain configured for the server.'

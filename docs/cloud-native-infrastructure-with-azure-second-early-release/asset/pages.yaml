    # Running Docker on Azure


    In Azure, there are two ways you can run your Docker container image: using Azure
    Container Instances or running your own virtual machine with Docker installed.
    In this section, we will demonstrate both of these methods.


    # Azure Container Instances


    Azure Container Instances (ACI) allows you to quickly spin up a container instance
    in Azure without having to manage underlying infrastructure. This provides a Docker-like
    service, but in the public cloud. ACI allows the deployment of Azure Container
    Registry images or Docker images from either private or public repositories.


    ACI also allows these instances to be placed in private or public networks depending
    on the use of the container images.


    Some additional features of ACI include:


    +   - No need to configure an OCI runtime specification'
  merge: -1
  img_proc: true
- pgno: 95
  md: '+   - The ability to pass environment variables to the container

    +   - Basic firewall management

    +   - Managed container restart policies


    Simply put, ACI is the easiest way to start running containers in Azure! ACI also
    gives you the ability to test new container images without creating a totally
    separate environment.


    There are some important caveats to note when running an Azure ACI:


    +   - There is a quad-core/16 GB limit to any single container instance.

    +   - The ACI settings for CPU and memory will override any runtime setting you
    applied to your container image.



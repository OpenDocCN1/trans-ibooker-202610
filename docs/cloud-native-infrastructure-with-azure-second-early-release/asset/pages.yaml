- pgno: 360
  md: 'When creating a function app, you must also link a storage account. This can
    be used for temporary storage. Each app will be provisioned with a public HTTP(s)
    endpoint at creation so that the function is accessible. It is possible to secure
    the function app using a private endpoint.


    # Creating a Function App


    In this section, we will create a function app using the Azure portal.


    +   - We will start by opening the Azure portal and clicking Create under Function
    App.

    +   - Now we will fill out the basic parameters of the function app:

    +     - We will create a new resource group called serverless-test.

    +     - The DNS name of our application will be ourtestfunctionapp.azurewebsites.net.

    +     - We will run code (a function) instead of a container.

    +     - The language will be Python v3.9.

    +     - The function app will be deployed in the region East US.

    +   - In the Hosting tab:

    +     - We will create a new storage account called functionstorageaccount. As
    storage account names are globally unique, you will need to pick your own name.

    +     - Because we are running Python, we must run Linux.

    +     - Finally, we will utilize the Consumption plan for the purposes of this
    example.

    +   - In the Monitoring tab:

    +     - We will turn off Application Insights.

    +     - Then we will click Review + Create.'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'Now that we have our function app created, we need to create a function. Visual
    Studio Code has an extension, Azure Functions, which makes it simple to create,
    test, and publish a function.


    +   - If you haven’t installed Visual Studio Code you can download it from the
    Visual Studio Code download page.

    +   - Once you’ve installed Visual Studio Code, you will need to install the Azure
    Functions extension.

    +   - Click the Azure icon on the Activity bar on the lefthand side of the screen,
    which will bring up the Azure Functions window. Click on “Create new project.”

    +   - A dialog box will pop up where you’ll need to choose a local directory in
    which to save your code.

    +   - You’ll then be prompted for some project information in separate Visual
    Studio Code pop-ups:

    +     - Select a language for your function project: choose Python.

    +     - Select a Python alias to create a virtual environment: choose the location
    of your Python interpreter.

    +     - If the location isn’t shown, type in the full path to your Python binary.

    +     - Select a template for your project’s first function: choose “HTTP trigger”.

    +     - Provide a function name: type HttpExample.

    +     - Pick an authorization level: choose Anonymous, which enables anyone to
    call your function endpoint. To learn about authorization levels, see the Authorization
    keys documentation.'
  merge: -1
  img_proc: true
- pgno: 362
  md: "+   - Select how you would like to open your project: choose “Add to workspace”.\n\
    +   - Using this information, Visual Studio Code generates an Azure Functions\
    \ project with an HTTP trigger. You can view the local project files in the Explorer.\
    \ To learn more about files that are created, see the Generated project files\
    \ documentation.\n\n+   - At this time, you’ll have the skeleton of a project\
    \ created. Add the following code to the *HttpExample* file, which will return\
    \ the IP of the client making a request to the function (similar to *icanhazip.com*):\n\
    \n```\nimport azure.functions as func\n\ndef main(req: func.HttpRequest ) -> func.HttpResponse:\n\
    \    response = False\n    if (req.headers.get('X-Forwarded-For')):\n        response\
    \ = req.headers.get('X-Forwarded-For').split(':')[0]\n    else:\n        response\
    \ = \"127.0.0.1\"\n    return func.HttpResponse(response)\n```\n\n+   - Test your\
    \ function by pressing F5 on your keyboard and then going to http://localhost:7071/api/HttpExample.\n\
    +   - To deploy to Azure, you will need to click the “Sign in to Azure…” button\
    \ in the Azure Functions window.\n+   - Click the Upload button, which will allow\
    \ you to upload your function to the app you created previously.\n\nNow that we’ve\
    \ looked at the Azure native offerings, let’s discuss the function apps deployed\
    \ with Kubernetes."

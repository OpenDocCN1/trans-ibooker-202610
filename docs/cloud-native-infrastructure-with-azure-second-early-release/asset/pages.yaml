  md: "# Using File\n\nYou can also provide a list of targets that can be read straight\
    \ from a YAML or JSON file without any network overhead. This is yet another static\
    \ method of service discovery in which Prometheus can read hosts directly from\
    \ a static file—for example, if you have an *inventory.json* file:\n\n```\n[\n\
    \  {\n    \"targets\": [\n      \"192.168.101.11:9100\"\n    ],\n    \"labels\"\
    : {\n      \"job\": \"node\",\n      \"Team\": \"dev\"\n    }\n  },\n  {\n   \
    \ \"targets\": [\n      \"192.168.101.155:9200\"\n    ],\n    \"labels\": {\n\
    \      \"job\": \"node\",\n      \"Team\": \"sre\"\n    }\n  }\n]\n```\n\nNow\
    \ you can update *prometheus.yml* using `file_sd_configs` under `scrap_configs`\
    \ as follows:\n\n```\nscrape_configs:\n  - job_name: file\n    file_sd_configs:\n\
    \      - files:\n        - 'inventory.json'\n```\n\nYou can find the targets being\
    \ scraped at http://localhost:9090/service-discovery.\n\n# Using azure_sd_config"

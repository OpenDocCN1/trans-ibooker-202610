- pgno: 27
  md: 'Azure management groups provide a means for organizing and managing subscriptions.
    You can use management groups to apply policy/governance to all the resources
    (including subscriptions) inside the management group. All subscriptions within
    the management group will inherit the management group policy by default.


    # Resource groups


    A resource group is a container that holds related resources for an Azure solution.
    The resource group includes those resources that you want to manage as a group.
    You decide which resources belong in a resource group based on what makes the
    most sense for your organization. Moreover, resources can be located in different
    regions from the resource group.


    # Regions


    An Azure region contains two or more availability zones. An availability zone
    is a physically isolated data center in a geographic region.


    Figure 2-3 depicts how these basic constructs are associated with each other.'

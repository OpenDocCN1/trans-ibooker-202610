    Fluentd is best understood with the help of its configuration file. You can find
    the default configuration file for Fluentd at /etc/td-agent/td-agent.conf. The
    configuration file contains a number of directives, as discussed in the following
    subsections.


    # source directive (where all the data is ingested)


    The source directive determines the data input source that needs to be enabled
    (i.e., where the data needs to be ingested from). The source directive submits
    an event to the Fluentd routing system. By default, Fluentd offers two standard
    input plug-ins. The http plug-in provides an HTTP endpoint to listen for incoming
    HTTP messages; the forward plug-in provides a TCP endpoint to accept TCP packets:


    ```

    <source>

    @type forward

    port 24224

    </source>

    ```


    ```

    <source>

    @type http

    port 9999

    bind 0.0.0.0

    </source>

    ```


    The preceding definition specifies two sources: in the first source we are receiving
    events from TCP port 24224 and in the second source we have an HTTP server listening
    on TCP port 9999.


    The event submitted by source to the Fluentd routing engine contains three entities:
    tag, time, and record. For example, in the following log output:


    ```

    2020-12-16 15:38:27 +0900 test.root: {"action":"logout","user":3}

    ```'
  merge: -1
  img_proc: true
- pgno: 201
  md: "2020-12-16 15:38:27 +0900 is the time, which is specified by input plug-ins\
    \ and has to be in Unix time format; test.root is the tag (according to Fluentd,\
    \ it is strongly recommended that the tag be in lowercase and a mix of digits\
    \ and underscores); and {\"action\":\"logout\",\"user\":3} is a JSON object.\n\
    \nThe input plug-ins are responsible for retrieving the event logs from external\
    \ sources. Generally, an input plug-in creates a thread, a socket, and a listening\
    \ socket. Input plug-ins are not just limited to http and forward. Following are\
    \ some additional plug-ins:\n\n# in_syslog\n\nFor retrieving log events via the\
    \ Syslog protocol on UDP or TCP. Fluentd creates a socket on port 5140; then,\
    \ all you need to do is set up your syslog daemon to send log events on this socket:\n\
    \n```\n<source>\n  @type syslog\n  port 5140\n  bind 0.0.0.0\n  tag system\n</source>\n\
    ```\n\n# in_tail\n\nAllows Fluentd to read events from the tail of logfiles, just\
    \ like the Unix tail -f command:\n\n```\n<source>\n  @type tail\n  path /var/log/httpd-access.log\n\
    \  pos_file /var/log/td-agent/httpd-access.log.pos\n```"
  merge: -1
  img_proc: true
- pgno: 202
  md: "```\ntag apache.access\n<parse>\n    @type apache2\n</parse>\n</source>\n```\n\
    \nFluentd offers additional input plug-ins, such as in_unix for retrieving records\
    \ from the Unix domain socket, and in_exec for executing external programs and\
    \ pulling event logs. You can even write your own custom input plug-ins.\n\n#\
    \ match directive (what to do with the input data)\n\nThe match directive determines\
    \ the output destination by looking for the events with matching tags. The standard\
    \ output plug-ins for Fluentd include file and forward. The match directive must\
    \ include a match pattern and an @type parameter which defines the output plug-in\
    \ to use. Once an event with a tag matches the pattern, it will be sent to the\
    \ output destination. Here’s an example use of the match directive:\n\n```\n<match\
    \ mywebapp.access>\n    @type file\n    path /var/log/mywebapp/access\n</match>\n\
    ```\n\nIn the preceding configuration, we are matching events tagged with mywebapp.access\
    \ and storing them in file at /var/log/mywebapp/access.\n\nIn addition to file\
    \ and forward, you can have other types of output plug-ins that basically determine\
    \ where you want to write the data to. For example, out_elasticsearch is an output\
    \ plug-in that writes the records to an Elasticsearch cluster endpoint. You would\
    \ first need to install the plug-in using:"
  merge: -1
  img_proc: true
- pgno: 203
  md: "```\nfluent-gem install fluent-plugin-elasticsearch\n```\n\nThen you can use\
    \ the following configuration to send the output data to an Elasticsearch endpoint:\n\
    \n```\n<match my.logs>\n  @type elasticsearch\n  host 192.168.23.13\n  port 9200\n\
    \  logstash_format true\n</match>\n```\n\nSimilarly, you can use out_copy to copy\
    \ events to multiple outputs, out_kafka2 to send records to a Kafka cluster, out_mongo\
    \ to write records to a MongoDB database, and stdout to simply write events to\
    \ standard output.\n\n# filter directive (the event processing pipeline)\n\nThe\
    \ filter directive acts like a rule to pass or reject an event based on a condition.\
    \ filter has the same syntax as match, but filter can be chained to a processing\
    \ pipeline. You can add a filter as follows:\n\n```\n<source>\n  @type http\n\
    \  port 9999\n  bind 0.0.0.0\n</source>\n```\n\n```\n<filter test.session>\n \
    \ @type grep\n  <exclude>\n    key action\n    pattern ^logout_session$\n  </exclude>\n\
    </filter>\n```\n\n```\n<match test.session>\n  @type stdout\n</match>\n```"
  merge: -1
  img_proc: true
- pgno: 204
  md: "In the preceding configuration, once the data is sourced, it goes through the\
    \ filter section and then the match section. The filter will accept or reject\
    \ the event based on its type and rule. Here we discarded the logout_session action\
    \ and used the type grep inside filter to exclude any message on which the action\
    \ key has the logout string.\n\nFollowing are some additional filter plug-ins:\n\
    \nfilter_record_transformer\n\nUsed to change an incoming event stream. You can\
    \ use the following configuration example for record_transformer:\n\n```\n<filter\
    \ myweb.access>\n    @type record_transformer\n    <record>\n        host_param\
    \ \"#{Socket.gethostname}\"\n    </record>\n</filter>\n```\n\nIn the preceding\
    \ configuration, record_transformer will add the host_param field to the log event.\n\
    \nfilter_geoip\n\nAdds geographic location information to logs using the MaxMind\
    \ GeoIP database.\n\nfilter_stdout\n\nPrints events to standard output and is\
    \ used mostly for debugging purposes."
  merge: -1
  img_proc: true
- pgno: 205
  md: "# system directive (sets system-wide configuration)\n\nYou can set a variety\
    \ of system-wide configurations using the system directive. Some of the configuration\
    \ options available in the system directive are:\n\n+   - log_level\n+   - suppress_repeated_stacktrace\n\
    +   - emit_error_log_interval\n+   - suppress_config_dump\n+   - without_source\n\
    +   - process_name\n\nYou can use the system configuration as follows:\n\n```\n\
    <system>\n  process_name my_app\n  log_level error\n  without_source\n</system>\n\
    ```\n\nHere we are first setting the supervisor and worker process names to my_app\
    \ and then setting the default log level to error. We are also instructing Fluentd\
    \ to start without any input plug-in.\n\n# label directive (for output grouping\
    \ and routing)\n\nLabels primarily solve the problem of maintaining and managing\
    \ the configuration file by allowing routing sections that do not follow the top-to-bottom\
    \ parsing order in the configuration file. You can think of labels as go-to statements\
    \ as well. Here is a simple configuration example for using labels:\n\n```\n<source>\n\
    \  @type http\n  bind 0.0.0.0\n```"
  merge: -1
  img_proc: true
- pgno: 206
  md: "```\nport 9999\n@label @MYCLUE\n</source>\n\n<filter test.session>\n    @type\
    \ grep\n    <exclude>\n        key action\n        pattern ^login$\n    </exclude>\n\
    </filter>\n\n<label @MYCLUE>\n    <filter test.session>\n        @type grep\n\
    \        <exclude>\n            key action\n            pattern ^logout$\n   \
    \     </exclude>\n    </filter>\n\n    <match test.session>\n        @type stdout\n\
    \    </match>\n</label>\n```\n\nIn the preceding configuration, the @label parameter\
    \ under source is the redirection toward the @MYCLUE label section. The control\
    \ will skip the filter definition for login and move directly to the @MYCLUE label.\n\
    \n# @include directive (to import config files)\n\nUsing the @include directive,\
    \ you can import configuration files from a separate directory. The @include directive\
    \ supports regular file path, glob pattern, and HTTP URL conventions as follows:\n\
    \n```\n# absolute path\n@include /path/to/config.conf\n\n# if using a relative\
    \ path, the directive will use\n# the dirname of this config file to expand the\
    \ path\n@include extra.conf\n\n# glob match pattern\n```"

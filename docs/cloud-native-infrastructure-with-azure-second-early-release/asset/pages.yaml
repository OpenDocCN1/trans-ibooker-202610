    \    - port: '53'\n      protocol: UDP\n  - ports:\n    - port: '53'\n      Protocol:\
    \ TCP\n```\n\nYou can apply the rule by running:\n\n```\n$ cilium policy import\
    \ l4-rule-example-1.yaml\n```\n\nFinally, Cilium also allows L7 visibility for\
    \ HTTP(s), Kafka, and DNS traffic. In the next example, we are allowing traffic\

- pgno: 372
  md: "KEDA is best installed using the Helm operator on Kubernetes. We will walk\
    \ through this now.\n\n+   - Add the KEDA Helm repository:\n+   \n+     $ helm\
    \ repo add kedacore\n+     https://kedacore.github.io/charts\n+   \n+   - Install\
    \ the Helm chart:\n+   \n+     $ kubectl create namespace keda\n+     $ helm install\
    \ keda kedacore/keda --namespace keda\n\nAfter this, your Kubernetes cluster will\
    \ be ready for function deployment.\n\nIn the next example, we will build a proof-of-concept\
    \ event system with an Azure Service Bus queue. We will produce messages to the\
    \ Azure Service Bus queue using a Python script and then use KEDA to scale a Python\
    \ consumption job.\n\n+   - Grab your Service Bus connection string using either\
    \ the manual method described in the Azure documentation or by running:\n+   \n\
    +     az servicebus namespace authorization-rule keys list \\\n+       -n RootManageSharedAccessKey\
    \ -g <group> --namespace-name <namespace> \\\n+       --query primaryConnectionString\
    \ -o tsv\n+   \n+   - You will need to get the Base64-encoded values of the connection\
    \ string and the queue name by running:\n+   \n+     $ echo -n \"<connection string>\"\
    \ | base64\n+     $ echo -n \"<queue name>\" | base64"
  merge: -1
  img_proc: true
- pgno: 373
  md: "+   - Now create a file called *secret.yaml*. Replace the `servicebus-queue`\
    \ and `servicebus-connectionstring` values with the Base64 strings generated in\
    \ the previous step.\n\n```\napiVersion: v1\nkind: Secret\nmetadata:\n  name:\
    \ sample-job-secret\n  namespace: default\ndata:\n  servicebus-queue:\n    <base64_encoded_servicebus_queue_name>\n\
    \  servicebus-connectionstring:\n    <base64_encoded_servicebus_connection_string>\n\
    ```\n\n+   - Create a second file, called *keda.yaml*, which will create your\
    \ scaled job. It will be running a docker image (`docker.pkg.github.com/prabdeb/sample-python-keda-service-bus-scaler/consumer:latest`)\
    \ when triggered:\n\n```\napiVersion: keda.sh/v1alpha1\nkind: TriggerAuthentication\n\
    metadata:\n  name: auth-service-bus-sample-job\nspec:\n  secretTargetRef:\n  \
    \  - parameter: connection\n      name: sample-job-secret\n      key: servicebus-connectionstring\n\
    ---\napiVersion: keda.sh/v1alpha1\nkind: ScaledJob\nmetadata:\n```"
  merge: -1

    \ into the backend infrastructure that you would have when running Kafka on virtual\
    \ machines or Kubernetes, you gain tighter integration with additional data services\
    \ such as Azure Blob Storage, Azure Data Lakes, and Azure Stream Analytics, to\
    \ name a few. Azure also supports both AMQP 1.0 and Kafka 1.0 protocols to maintain\
    \ compatibility with client libraries.\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_349_0.png)\n\
    \nFigure 10-15. Azure Event Hubs architecture\n\nAzure Event Hubs has some concepts\
    \ that transfer over from Azure Service Bus. We will quickly review them here:\n\
    \n*Producers*\n\nThese are the clients that send messages to Azure Event Hubs.\n\
    \n*Partitions*"

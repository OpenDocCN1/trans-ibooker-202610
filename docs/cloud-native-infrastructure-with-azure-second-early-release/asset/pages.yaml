    $ kubectl apply -f <(curl -L https://raw.githubusercontent.com/kiali/demos/master/travels/travel_portal.yaml)
    -n travel-portal

    $ kubectl apply -f <(curl -L https://raw.githubusercontent.com/kiali/demos/master/travels/travel_control.yaml)
    -n travel-control

    ```


    The first thing you need to do after you have deployed the travel demo application
    is enable sidecar proxy support. Start by enabling auto injection for all the
    newly created namespaces by clicking on the three dots in the highlighted box
    in Figure 7-6.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_261_0.png)



- pgno: 266
  md: '# Chapter 8. Networking and Policy Management: Behold the Gatekeepers


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 8th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at rfernando@oreilly.com.


    In the preceding chapters, we built infrastructure in Azure and explained how
    to discover and monitor our applications. Now it’s time to secure those applications!
    Although there have been numerous cloud data breaches over time because of simple
    misconfigurations, the reality is that securing cloud infrastructure is not difficult.
    Cloud networking technology has rapidly evolved, and today a number of vendors
    provide cloud native software that can help you enhance your network configuration
    as well as secure it.


    Azure comes with an offering, Azure Policy, that allows you to set a policy against
    a tenant, management group, or subscription, which provides a layer of security
    by default. For example, in Azure you can set a policy that will ensure that no
    storage accounts are accessible publicly within a management group or subscription.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'In this chapter, we will explore the power of container networking and the
    many ways you can use it to improve your infrastructure. We will also explain
    how to apply a policy to your infrastructure to keep it secure.


    We will start with a discussion about container networking and the standards that
    multiple projects are built around, then focus on products such as Calico, Flannel,
    and Weave which provide networking connectivity and network policy enforcement.
    We’ll conclude the chapter with a discussion about system policy enforcement with
    Open Policy Agent (OPA).


    # The Container Network Interface (CNI)


    As we mentioned in previous chapters, containers offer a vast array of security
    and portability features. One of the largest returns comes from the networking
    stack. The Linux cgroups and network namespace features open up a variety of network
    functionality that can be used to enhance security and telemetry, as well as manage
    performance. A good example of the flexibility and power of container network
    functionality is Cilium, a software tool that provides load balancing, security,
    telemetry, bandwidth management, and other capabilities as an add-on for Kubernetes.
    We’ll discuss Cilium in detail later in this chapter.


    In Chapter 3, we briefly mentioned how the industry has a standard specification
    for the container runtime and the container image. The Container Network Interface
    (CNI) was created in 2015 (and eventually was added to the Cloud Native Computing
    Foundation [CNCF] incubating project list) as a standard for configuring container
    network interfaces and associated network settings. The CNI specification allows
    management of the following primitives:


    +   - Interface names and network namespace bindings

    +   - IP addresses

    +   - Routing'
  merge: -1
  img_proc: true
- pgno: 268
  md: "+   - DNS settings\n+   - Sysctl settings\n\nAn example CNI configuration looks\
    \ like this:\n\n```\n{\n  \"cniVersion\": \"1.0.0\",\n  \"name\": \"dbnet\",\n\
    \  \"plugins\": [\n    {\n      \"type\": \"bridge\",\n      \"bridge\": \"cni0\"\
    ,\n      \"args\": {\n        \"labels\" : {\n          \"appVersion\" : \"1.0\"\
    \n        }\n      },\n      \"ipam\": {\n        \"type\": \"host-local\",\n\
    \        \"subnet\": \"10.1.0.0/16\",\n        \"gateway\": \"10.1.0.1\"\n   \
    \   },\n      \"dns\": {\n        \"nameservers\": [ \"10.1.0.1\" ]\n      }\n\
    \    },\n    {\n      \"type\": \"tuning\",\n      \"sysctl\": {\n        \"net.core.somaxconn\"\
    : \"500\"\n      }\n    }\n  ]\n}\n```\n\n# Why Would You Use a CNI?\n\nYou may\
    \ be asking yourself why the industry needs a specification just for networking.\
    \ As we alluded to in Chapter 3, the container ecosystem has a large number of\
    \ networking projects that plug into container systems like Docker and Kubernetes.\
    \ Multiple groups are creating publicly available"
  merge: -1
  img_proc: true
- pgno: 269
  md: "networking-related plug-ins, so there is a need for a standard way to describe\
    \ and control the container’s network layer.\n\nThe CNI platform enables true\
    \ infrastructure virtualization, meaning that you do not need to worry about managing\
    \ network infrastructure—including in the cloud! Utilizing the container platform\
    \ as network infrastructure greatly reduces the cost of implementing and operating\
    \ a complex network infrastructure and provides the ability to scale and upgrade\
    \ without having to invest in physical or dedicated virtual network devices.\n\
    \n# How Does CNI Work with Azure?\n\nAzure supports CNI, but it has two special\
    \ plug-ins that connect your containers to the Azure Virtual Network (VNet):\n\
    \n+   - azure-vnet, which implements the CNI network plug-in\n+   - azure-vnet-ipam,\
    \ which implements the CNI IP Address Management (IPAM) plug-in\n\nThese plug-ins\
    \ ensure that the container can correctly interface with the Azure VNet control\
    \ plane. You can use these plug-ins in both Azure Kubernetes Service (AKS) and\
    \ standalone Azure virtual machines.\n\n> NOTE\n> \n> Windows Networking\n> \n\
    > While the networking stacks for Linux and Windows are fundamentally very different,\
    \ the Azure CNI plug-ins do have first-class support for Windows, which means\
    \ you can run both Windows and Linux containers in the same infrastructure without\

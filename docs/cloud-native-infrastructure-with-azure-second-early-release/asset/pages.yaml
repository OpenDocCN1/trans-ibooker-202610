    # Best Practices While Using Docker


    The twelve-factor app tracks a number of characteristics of Dockerized and cloud-based
    applications. This means the application should be able to be deployed, started,
    stopped, and destroyed without causing problems. While we will talk about container
    storage solutions later in this book, you should try to avoid persisting data
    as much as is practically possible unless you’re reading data from a persistent
    volume or using a cloud native data service (see Chapter 9 for more on this).


    There are a few more best practices that you should follow:


    +   - Utilize the docker build options. These options allow you to customize your
    Docker image to add features such as cgroup controls, tags, network configurations,
    and more.

    +   - Utilize a .dockerignore file. Similar to .gitignore, a .dockerignore will
    ensure that certain files or folders are not included in the image build.

    +   - To reduce complexity, dependencies, file sizes, and build times, avoid installing
    extra or unnecessary packages.

    +   - Use multistage builds. If you need to install dependencies to compile your
    application, you can do this during the build process of your image, but only
    copy the output into the container image. This reduces the size of your image
    build.


    You can find more information on Dockerfile best practices on the Docker website.


    # Other Container Platforms'

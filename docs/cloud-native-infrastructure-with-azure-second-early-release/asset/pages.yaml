    team\": \"azure-sdk\"},\n    subject=\"Door1\",\n    event_type=\"Azure.Sdk.Demo\"\
    ,\n    data_version=\"2.0\"\n)\n\ncredential = DefaultAzureCredential(\"<access-key>\"\
    )\nendpoint = `https://my-eventgrid-topic.east-us.eventgrid.azure.net/api/events`\n\
    client = EventGridPublisherClient(endpoint, credential)\nclient.send(event)\n\
    ```\n\nA number of great examples on how to code with the Event Grid are available\
    \ at the Azure Event Grid client library for Python.\n\n# Summary\n\nYou have\
    \ many choices when picking messaging technologies to implement with new or existing\
    \ applications. As usual, the answer as to what and how to run a piece of technology\

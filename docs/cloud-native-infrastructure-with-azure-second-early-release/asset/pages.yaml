- pgno: 61
  md: 'of containers is that they provide virtual-machine-like isolation, but without
    the overhead of running an instance of the host operating system for each container.
    At scale, this can save a significant amount of system resources.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_61_0.png)


    Figure 3-1. The container operating paradigm


    # Isolation


    Containers provide isolation via a number of methods in a flexible manner that
    is configured by the administrator. Containers can be isolated in the following
    ways:


    # System resources


    Isolation is achieved via the CPU, memory, and disk cgroups.


    # Namespaces


    Isolation is achieved by allowing separate namespaces for each container.


    # POSIX limits


    Isolation with this method allows you to set rlimits on your container.'

- pgno: 190
  md: "say you need to know the number of active threads or number of items in a queue,\
    \ or you want to know the number of items in a cache.\n\nGauges use three main\
    \ methods: inc, dec, and set. The following example showcases how you can use\
    \ the three methods independently to track a metric that you are interested in:\n\
    \n```\nfrom prometheus_client import Gauge\nsample_gauge_1 = Gauge('my_increment_example_requests',\n\
    'Description of increment gauge')\nsample_gauge_2 = Gauge('my_decrement_example_requests',\n\
    'Description of decrement gauge')\nsample_gauge_3 = Gauge('my_set_example_requests',\
    \ 'Description of set gauge')\n\nsample_gauge_1.inc()      # This will increment\
    \ by 1\nsample_gauge_2.dec(10)    # This will decrement by given value of 10\n\
    sample_gauge_3.set(48)    # This will set to the given value of 48\n```\n\nIn\
    \ the preceding code, the inc() method will increment the value for 'my_increment_example_requests'\
    \ by 1, decrement the value for 'my_decrement_example_requests' by 10, and set\
    \ the value for 'my_set_example_requests' to 48.\n\n# Summary\n\nA summary usually\
    \ tracks the request duration or response size. It is typically used to find the\
    \ size and number of events. It uses an observe method which accepts the size\
    \ of the event. For example, in the following code, we are trying to find the\
    \ time it took for a request to complete:\n\n```\nimport http.server\nimport time\n\
    from prometheus_client import Summary, start_http_server\n\nLATENCY = Summary('latency_in_seconds','Time\
    \ for a request')\n\nclass SampleServer(http.server.BaseHTTPRequestHandler):\n\
    \    def do_GET(self):\n        start_time = time.time()\n```"
  merge: -1
  img_proc: true
- pgno: 191
  md: "```\nself.send_response(200)\nself.end_headers()\nself.wfile.write(b\"My application\
    \ with a Summary metric\")\nLATENCY.observe(time.time() - start_time)\n\nif __name__\
    \ == \"__main__\":\n    start_http_server(5555)\n    server = http.server.HTTPServer(('localhost',\
    \ 5551), SampleServer)\n    server.serve_forever()\n```\n\nTo run the preceding\
    \ code, you can follow the same approach we took in “Counter” on page XX. The\
    \ metric endpoint at http://localhost:5555/metrics will have two time series:\n\
    latency_in_seconds_count and latency_in_seconds_sum.\nThe former represents the\
    \ number of observe calls that were made and the latter is the sum of the values\
    \ passed to observe. If you divide the rate of these two metrics—\nrate(latency_in_seconds_count[1m])/rate(latency_in_seconds_sum[1m])—\n\
    you will get the average latency for the last minute.\n\n# Histograms\n\nHistograms\
    \ help you track the size and number of events in buckets while allowing you to\
    \ aggregate calculations of quantiles. Histograms can be used to measure request\
    \ durations for a specific HTTP request call.\n\nCode instrumentation for histograms\
    \ also uses the observe method, and you can combine it with time to track latency,\
    \ as in our previous example. The following code adds 10 seconds as a request\
    \ latency:\n\n```\nfrom prometheus_client import Histogram\nreq_latency = Histogram('request_latency_seconds',\
    \ 'Description of histogram')\nreq_latency.observe(10)    # Observe 10 (seconds\
    \ in this case)\n```\n\nInstrumentation is usually applied at the service level\
    \ or to the client libraries that are being used in the services. It’s important\
    \ to note that there"
  merge: -1

- pgno: 297
  md: '# Azure Policy


    While it is undoubtedly useful to actively run software that protects your cloud-based
    infrastructure, Azure Policy allows you to set a comprehensive policy against
    many aspects of your cloud infrastructure, particularly around resource security.


    Azure Policy performs three key functions:


    +   - Creates policies that prevent or enforce a certain configuration

    +   - Allows for reporting of compliance against your own policy as well as industry
    benchmarks

    +   - Brings your resources to compliance through bulk remediation for existing
    resources and automatic remediation for new resources


    Potential use cases for Azure Policy include implementing governance for resource
    consistency, regulatory compliance, security, cost, and management.


    Azure Policy definitions are defined in a JSON format and applied in a hierarchical
    manner; this means that one policy could be applied to one management group (and
    all the subscriptions/resources in it) and a more lenient policy could be set
    to a separate management group (and all the subscriptions/resources in it).


    # Azure Policy Quickstart


    Azure contains some built-in policies by default. You can view them by running
    this command in your terminal:


    ```

    $ az policy definition list

    ```


    Or you can view them in the Portal (Figure 8-9).'
  merge: -1
  img_proc: true
- pgno: 298
  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_298_0.png)


    Figure 8-9. An overview of available Azure Policy definitions


    Azure Policy also includes *initiatives*, which are collections of policies that
    align with an industry standard (e.g., PCI v3.2.1:2018).


    At this point, the policies have been created but they have no assigned scope.
    You can apply a policy on a subscription (and all the resources within the subscription),
    or you can apply it to a management group that will cover all child management
    groups and subscriptions.


    Either way, you will need to have the Microsoft.PolicyInsights resource provider
    registered for your subscription(s). You can enable it by running:


    ```

    $ az provider register --namespace ''Microsoft.PolicyInsights''

    ```


    Azure Policy has various policy enforcement modes, also known as *effects*. There
    are currently seven types of Azure Policy effects:'

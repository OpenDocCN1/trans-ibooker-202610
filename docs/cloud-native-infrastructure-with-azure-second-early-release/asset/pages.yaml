  img_proc: true
- pgno: 196
  md: "port. You can scrape kubelet nodes using the following Prometheus scrape_configs\
    \ command:\n\n```\nscrape_configs:\n  - job_name: 'kubelet'\n    kubernetes_sd_configs:\n\
    \      - role: node\n    scheme: https\n    tls_config:\n      ca_file: ca.crt\n\
    ```\n\nIn the preceding *prometheus.yml* configuration, the label is provided\
    \ as `kubelet` and the role is provided as `node`. We use the scheme `HTTPS` since\
    \ kubelet /metrics is available only over HTTPS, which requires a Transport Layer\

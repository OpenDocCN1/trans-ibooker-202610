- pgno: 287
  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_287_0.png)


    Figure 8-6. A screenshot of the Hubble UI displaying a simple architecture


    You can install Hubble using kubectl:


    ```

    kubectl apply -f

    https://raw.githubusercontent.com/cilium/cilium/v1.9/install/kubernetes/quick-hubble-install.yaml

    ```


    # Integrating Cilium with Your Cloud


    As we already mentioned, Cilium has a rich feature set that you can take advantage
    of. In this section, we will use Cilium as a network provider and as a policy
    enforcer (firewall). We will then look at observability with Cilium.


    # Host firewall


    Similar to our deep dive into Calico, here we will implement a set of network
    policies. The advantage of Cilium is that it can enforce policy on L3, L4, or
    L7. Network policy enforcement has three modes, as shown in Table 8-1.'
  merge: -1
  img_proc: true
- pgno: 288
  md: Table 8-1. Network policy enforcement
  merge: -1

- pgno: 275
  md: "# Deploying Calico via AKS installation\n\nAzure has introduced first-class\
    \ support for Calico as a network *policy* engine; it can be installed as part\
    \ of the creation of an AKS instance in the networking configuration step, as\
    \ shown in Figure 8-2.\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_275_0.png)\n\
    \nIn this step, if you click Calico as a part of the AKS installation, a Calico\
    \ Typha Pod will be installed onto each Kubernetes compute node.\n\n# Installing\
    \ Calico manually\n\nIf you want to manually install Calico on your Kubernetes\
    \ cluster, you can use kubectl to download the operator and install the components.\n\
    \n+   - First, install the operator and then the Calico resources. This will create\
    \ a `tigera-operator` namespace:\n+   \n+     ```\n+     $ kubectl create -f\n\
    +     https://docs.projectcalico.org/manifests/tigera-operator.yaml\n+     $ kubectl\
    \ create -f\n+     https://docs.projectcalico.org/manifests/custom-resources.yaml\n\
    +     ```\n\n+   - Validate that all Calico nodes are now running:\n+   \n+  \
    \   ```\n+     $ kubectl get pods -n calico-system\n+     ```\n\n+   - Wait until\
    \ all the Pods are in the Running state."
  merge: -1
  img_proc: true
- pgno: 276
  md: "> **WARNING**\n> \n> The `ipPools` configuration in *custom-resources.yaml*\
    \ file cannot be modified after deployment. This means the `ipPools` (the IP addresses\
    \ that are assigned to each Pod) are set after you apply the *custom-resources.yaml*\
    \ file.\n\n# Installing calicoctl\n\nTo control Calico, you will need to have\
    \ access to its CLI utility. There are a few ways to access the utility, as described\
    \ in the Calico installation documentation. For this example, we are going to\
    \ simply download the CLI onto our machine and run it as a kubectl plug-in.\n\n\
    +   - Log in to a host and navigate to /usr/local/bin:\n+   \n+     ```\n+   \
    \  $ cd /usr/local/bin\n+     ```\n\n+   - Download the binary:\n+   \n+     ```\n\
    +     $ curl -o kubectl-calico -O -L \"https://github.com/projectcalico/calicoctl/releases/download/v3.21.0/calicoctl-linux-ppc64le\"\
    \n+     ```\n\n+   - Set the binary to be executable:\n+   \n+     ```\n+    \
    \ $ chmod +x kubectl-calico\n+     ```\n\n+   - Verify that the plug-in works:\n\
    +   \n+     ```\n+     $ kubectl calico -h\n+     ```\n\n# A Calico Deep Dive\n\
    \nWe’ve discussed at a high level the benefits of using Calico and some basics\
    \ about how it works and how to install it. Now we will look at how to"
  merge: -1
  img_proc: true
- pgno: 277
  md: "use it. For the rest of this section, we will use eBPF as the data plane instead\
    \ of the standard Linux network stack.\n\nAzure does not allow unknown IPs in\
    \ its data plane, so you can only use a VXLAN-based overlay network between nodes.\
    \ This is only possible if you are building a self-managed cluster (Figure 8-3)\
    \ and not AKS. On AKS you must use Azure as the network provider, as shown in\
    \ Figure 8-4.\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_277_0.png)\n\nFigure\
    \ 8-3. Self-managed setup (with VXLAN)\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_277_1.png)\n\
    \nFigure 8-4. AKS network setup\n\n# Enabling eBPF\n\nThe next step for setting\
    \ up our Calico infrastructure is to enable the eBPF data plane. Enabling eBPF\
    \ allows you to take advantage of new kernel features and remove the use of kube-proxy\
    \ for load balancing. When eBPF is enabled, the use of kube-proxy will be disabled.\
    \ You can find out more about Calico’s implementation of eBPF in this blog post.\n\
    \nTo enable eBPF, follow these steps.\n\n+   Find the API server by running:\n\
    \n```\n$ kubectl get configmap -n kube-system kube-proxy -o jsonpath='{ .data.kubeconfig}'\
    \ | grep server`\n    server:\nhttps://d881b853ae312e00302a84f1e346a77.hcp.us-east-1.azmk8s.io\n\
    ```\n\n+   Update your tigera-operator namespace:"
  merge: -1
  img_proc: true
- pgno: 278
  md: "```\nkind: ConfigMap\napiVersion: v1\nmetadata:\n  name: kubernetes-services-endpoint\n\
    \  namespace: tigera-operator\ndata:\n  KUBERNETES_SERVICE_HOST: \"<API server\
    \ host>\"\n  KUBERNETES_SERVICE_PORT: \"<API server port>\"\n```\n\n+   - Restart\
    \ the operator to pick up the change:\n\n```\n$ kubectl delete pod -n tigera-operator\
    \ -l k8s-app=tigera-operator\n```\n\n+   - Disable the deployment of kube-proxy\
    \ (to save resources):\n\n```\n$ kubectl patch networks.operator.openshift.io\
    \ cluster --type merge -p '{\"spec\":{\"deployKubeProxy\": false}}'\n```\n\n+\
    \   - Using calicoctl, enable eBPF:\n\n```\n$ calicoctl patch felixconfiguration\
    \ default --patch='{\"spec\": {\"bpfEnabled\": true}}'\n```\n\nIf you have issues\
    \ running eBPF, Calico provides a troubleshooting guide.\n\nNOTE\nIf you are using\
    \ eBPF and have a kernel version later than 4.16, Calico will automatically attempt\
    \ to use XDP to process packets, which will provide performance improvements.\
    \ This is useful for high-throughput services or services that are being DOSed.\n\
    \n# Implementing Calico Security Policy"
  merge: -1
  img_proc: true
- pgno: 279
  md: "Now that we have our network configured, we are ready to apply some security\
    \ policy. The Calico network policy has a larger set of capabilities than Kubernetes,\
    \ including:\n\n+   - Policy ordering\n+   - Deny rules\n+   - Greater flexibility\
    \ on match rules\n\nCalico network policy supports securing applications using\
    \ OSI Layers 5 through 7 criteria, as well as cryptographic identity. You will\
    \ find examples on the Calico network policy configuration page.\n\nNetwork policy\
    \ can be enforced in a number of ways:\n\n+   - Globally (applies to all Pods\
    \ in all namespaces), known as GlobalNetworkPolicy\n+   - Per network or host,\
    \ known as HostEndpoint\n+   - Per namespace, known as NetworkPolicy\n\n# GlobalNetworkPolicy:\
    \ Allowing ICMP traffic\n\nThe first policy we will create is a global network\
    \ policy that allows ICMP traffic for ping and traceroute from all hosts within\
    \ the cluster. Create the file global-policy.yaml as follows:\n\n```\napiVersion:\
    \ projectcalico.org/v3\nkind: GlobalNetworkPolicy\nmetadata:\n  name: allow-ping-in-cluster\n\
    spec:\n  selector: all()\n  types:\n  - Ingress\n  ingress:\n  - action: Allow\n\
    \    protocol: ICMP\n    source:\n      selector: all()\n    icmp:\n```"
  merge: -1
  img_proc: true
- pgno: 280
  md: "```\ntype: 8 # Ping request\n- action: Allow\n  protocol: ICMPv6\n  source:\n\
    \    selector: all()\n  icmp:\n    type: 128 # Ping request\n```\n\nApply the\
    \ policy by running:\n\n```\n$ calicoctl create global-policy.yaml\n```\n\n# NetworkPolicy:\
    \ Allowing traffic within a namespace between two labels\n\nIn this example, we\
    \ will allow traffic from the production namespace with selector green to a Pod\
    \ in the same namespace with selector blue on port TCP/1234. Create a new file\
    \ called network-policy.yaml:\n\n```\napiVersion: projectcalico.org/v3\nkind:\
    \ NetworkPolicy\nmetadata:\n  name: allow-tcp-1234\n  namespace: production\n\
    spec:\n  selector: color == 'blue'\n  ingress:\n  - action: Allow\n    protocol:\
    \ TCP\n    source:\n      selector: color == 'green'\n    destination:\n     \
    \ ports:\n      - 1234\n```\n\nApply the policy by running:\n\n```\n$ calicoctl\
    \ create network-policy.yaml\n```\n\nOnce this policy is applied, traffic will\
    \ be able to flow to port TCP 1234 to any green Pod."
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Cilium


    One of the most innovative networking tools to be introduced over the past five
    years is the Cilium project, which heavily utilizes eBPF to provide a suite of
    networking, observability, and security features that are oriented toward cloud
    native infrastructure.


    Cilium utilizes the eBPF Linux kernel technology that enables low-overhead, high-powered
    visibility, and control logic for the kernel and the applications running on top
    of it. The use of eBPF makes Cilium a popular choice for infrastructure architects,
    as the platform provides features around three key pillars:


    # Networking


    Cilium implements its own CNI which utilizes Linux eBPF. This makes Cilium highly
    performant and allows it to perform load balancing instead of relying on kube-proxy.
    It also allows for multicluster connectivity, which is important for larger installations.


    # Observability


    Cilium’s use of eBPF makes it a unique piece of observability software. Cilium
    can perform deep-packet inspection on all layers of network connectivity and data.


    # Security


    One of the best features of Cilium is that it can perform transparent encryption
    between hosts via IPSec. This means you get end-to-end encryption via a highly
    efficient mechanism without having to make changes to your application. While
    Cilium provides its own label+CIDR matching security policy, it also does (OSI)
    Layer 7 filtering (e.g., filter outbound DNS queries or filter incoming HTTP requests).'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'Finally, Cilium allows you to perform Layer 7 introspection for policy-making
    decisions (see this blog post for more information).


    Cilium’s use of eBPF as its core enables the software to deeply introspect and
    manipulate (where needed) all network traffic without affecting system performance.


    The Cilium agent (cilium-agent) runs on every node (see Figure 8-5) and accepts
    the configuration via the Kubernetes API. The agent will turn that configuration
    into an eBPF program that runs against the container’s network interface, the
    host’s network, or one of the host’s network cards.'
  merge: -1
  img_proc: true

    \n+   - Build and push your new serverless image using:\n+   \n+     ```\n+  \
    \   docker push\n+     https://myharborinstallation.com/helloworld:v1\n+     ```\n\
    \n+   - Now define your serverless service in a file called *hello-world.yaml*:\n\
    +   \n+     ```\n+     apiVersion: serving.knative.dev/v1\n+     kind: Service\n\

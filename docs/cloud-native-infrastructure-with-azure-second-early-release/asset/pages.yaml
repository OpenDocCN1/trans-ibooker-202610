    Now that you’ve got the basics of Kubernetes components under your belt, let’s
    dig a bit deeper and learn more about the Kubernetes API server.


    # Kubernetes API Server Objects


    The API server is responsible for all the communication inside and outside a Kubernetes
    cluster, and it exposes a RESTful HTTP API. The API server, at a fundamental level,
    allows you to query and manipulate Kubernetes objects. In simple terms, Kubernetes
    objects are stateful entities that represent the overall state of your cluster
    (Figure 4-2). To start working with these objects, we need to understand the fundamentals
    of each.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_112_0.png)


    Figure 4-2. API server interaction with cluster objects


    # Pods


    In Kubernetes, Pods are the smallest basic atomic unit. A Pod is a group of one
    or more containers that get deployed on the worker nodes. Kubernetes is responsible
    for managing the containers running inside a Pod. Containers inside a Pod will
    always end up on the same worker node and are tightly coupled. Since the containers
    inside a Pod are co-located, they run in the same context (i.e., they share the
    network and storage). This shared context is characteristic of Linux namespaces,
    cgroups, and any other aspects which'
  merge: -1

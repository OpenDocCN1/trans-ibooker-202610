    # Prometheus on Kubernetes


    Kubernetes service discovery support is built right into Prometheus out of the
    box, allowing retrieval of scrape targets from the Kubernetes REST API. To make
    use of this capability, Prometheus must already be running inside the Kubernetes
    cluster. You can use Helm charts to configure and deploy Prometheus easily on
    an AKS cluster.


    Five types of roles can be configured to discover targets in Kubernetes clusters:
    node, service, Pod, endpoints, and ingress. Let’s take a closer look at these
    service discovery roles.


    # The node role


    The node role discovers all the nodes in the Kubernetes cluster. Since kubelet
    runs on each node in a Kubernetes cluster, the node role discovers the target
    nodes in the cluster with the address defaulting to kubelet’s HTTP'

  md: "# Installing OpenFaaS\n\nOpenFaaS has three recommended installation methods:\n\
    \n+   - Using `arkade`\n+   - Using `helm`\n+   - Installing with Flux or ArgoCD\n\
    \nTo be consistent with the rest of the book, we’ll deploy OpenFaaS using Helm.\n\
    \n+   - Create the namespaces (one for OpenFaaS core services and one for functions):\n\
    \n```\nkubectl apply -f\nhttps://raw.githubusercontent.com/openfaas/faas-netes/master/namespaces.yml\n\
    ```\n\n+   - Add the OpenFaaS Helm chart:\n\n```\nhelm repo add openfaas https://openfaas.github.io/faas-netes/\n\
    ```\n\n+   - Finally, deploy OpenFaaS:\n\n```\nhelm repo update \\\n  && helm\
    \ upgrade openfaas --install openfaas/openfaas \\\n    --namespace openfaas \\\
    \n    --set functionNamespace=openfaas-fn \\\n    --set generateBasicAuth=true\n\
    ```\n\n+   - You’ll be able to retrieve your administrator password by running\
    \ the following command; this will be used for accessing the OpenFaaS dashboard:"

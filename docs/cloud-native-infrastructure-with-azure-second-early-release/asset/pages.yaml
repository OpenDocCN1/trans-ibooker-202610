    \ as targets. It also returns all the metadata related to the Pods. You can scrape\
    \ Pods as follows:\n\n```\nscrape_configs:\n  - job_name: 'pods'\n    kubernetes_sd_configs:\n\
    \      - role: pod\n```\n\n# The endpoints role"

    Now that you understand how Fluentd works, let’s examine how to integrate it in
    cloud native environments and deploy it over container orchestrators like Kubernetes.


    # Fluentd on Kubernetes


    By default, in Kubernetes the logs from containers are written to standard output
    and the standard error stream. This is basic I/O logging, which Kubernetes offers
    out of the box. The Container engine redirects the streams to a logging driver
    configured in Kubernetes to write the logs to a file in JSON format. As a user,
    if you wish to see the logs you can use the `kubectl logs` command. The problem
    with this approach, though, is very evident: if a container crashes, or a Pod
    is evicted, or the node itself dies, you will no longer be able to access the
    application logs. Therefore, logs should have storage that is independent from
    containers, Pods, and'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'nodes. This concept is formally referred to as *cluster-level logging* and
    it requires a separate backend to store, analyze, and query the logs. While Kubernetes
    doesn’t natively provide a solution for cluster-level logging, we can combine
    Fluentd with a storage solution like Elasticsearch to construct a scalable solution.


    Before moving on to the preferred way of deploying Fluentd on Kubernetes, let’s
    take a look at the different approaches by which cluster-level logging can be
    implemented, along with their pros and cons. There are essentially two ways to
    build a cluster-level logging solution:


    +   - Use a sidecar container in every application Pod.

    +   - Use a node-level logging agent that runs on every node.


    Let’s take a closer look at each of these solutions.


    # Sidecar container approach


    Generally, in Kubernetes you run your applications in a Pod, as described in Chapter
    5. In the sidecar approach, you can create one or more sidecar containers inside
    the application Pod. The sidecar container approach can be used in two different
    ways:


    +   - You can use the sidecar container to stream the application logs to the
    container’s own stdout.

    +   - You can run a logging agent inside a sidecar container which basically picks
    the logs from application containers and ships them to a logging backend.


    There are some advantages to the sidecar container approach:


    +   - You can ship application logs being produced in different log formats (structured
    or unstructured) by having two sidecar containers to stream a particular logfile
    to different log streams.

    +   - Sidecar containers can read logs from files, sockets, or journald, and each
    sidecar container will print the log to the stdout and stderr'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'streams.


    +   - Sidecar containers can also be used to rotate the logfiles that cannot be
    rotated by the application itself.


    There are also some disadvantages to running a sidecar container:


    +   - Disk I/O can increase significantly in a scenario where you are writing
    the logs to a file and then streaming to stdout.


    +   - Since there is more than one Pod running your application, you would also
    have to deploy multiple sidecar containers in each Pod.


    # Node-level logging agent approach


    Another way to deal with logging in Kubernetes is to deploy a logging agent on
    each node of the Kubernetes cluster. The agent can be run as a container to a
    daemon which can have access to all the logs being produced by the application
    Pods. This is, in fact, the preferred way of running Fluentd agents as well.


    A Kubernetes DaemonSet is used to implement such a strategy where every node can
    run a copy of a Fluentd logging agent Pod. Fluentd officially provides a DaemonSet
    with correct rules to be deployed on Kubernetes clusters. You can grab a copy
    of the DaemonSet by cloning from the official Fluentd repository :


    ```

    $ git clone https://github.com/fluent/fluentd-kubernetes-daemonset

    ```


    Before you begin using the aforementioned DaemonSet, you need a Kubernetes cluster.
    If you are already running an Azure Kubernetes cluster (such as the Azure Kubernetes
    Service [AKS]), you can start by deploying a logging backend for storing the logfiles.
    Elasticsearch is one of the logging backends that can be used to store the generated
    logs. You can deploy Elasticsearch using Helm on Kubernetes as follows:'
  merge: -1
  img_proc: true

    a number of the systems we’ve discussed in this book (e.g., Kubernetes, TiKV,
    Calico, and Istio) leveraging it behind the scenes.


    Often, etcd is used to store configuration values, feature flags, and service
    discovery information in a key-value format. Etcd allows clients to watch these
    items for changes and reconfigures itself when they change. Etcd also is suitable

    evolved over time with the introduction of the cloud. To take full advantage of
    what the cloud has to offer, we need to develop solutions that are native to the
    cloud and not just retroactively adapt them for the cloud. We understood how cloud
    native is the way to go in order to fully utilize the power of the cloud.


    In Chapter 2, we introduced the steppingstones to building a modern cloud native
    environment using Azure. We set up an Azure account and got started with Ansible,
    Terraform, and Packer. By employing them as our key tools, we can enable production-ready
    services in an automated fashion. We'

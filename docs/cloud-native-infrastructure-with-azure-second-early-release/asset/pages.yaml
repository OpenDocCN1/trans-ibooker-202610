    # Labels and Selectors


    As you start using Kubernetes and creating objects, you’ll realize the need to
    identify or mark your Kubernetes resources in order to group them into logical
    entities. Kubernetes offers *labels* to identify metadata for objects, which easily
    allows you to group and operate the resources. Labels are key-value pairs that
    can be attached directly to objects like Pods, namespaces, daemon sets, and so
    on. You can add labels at any time and modify them as you may like. To find or
    identify your Kubernetes resources, you can query the labels using *label selectors*.
    For example, a label for a type of application tier can be:



    # Tracing: Key Concepts


    The Gantt chart in Figure 6-8 summarizes the following important key concepts
    of a distributed tracing system.


    # Spans


    A span represents a single operational call and is the primary building block
    of a distributed trace, which represents an individual unit of work done in a
    distributed system. Spans contain references to other spans, which allows multiple
    spans to be assembled into one complete trace. For example, in Figure 6-8, the
    span “load balancer transaction from start to end” includes other spans, like
    load balancer interacting with authentication service or load balancer interacting
    with billing service.


    The spans are created in the form of a parent–child relationship in which each
    span has a child, except for the root and the start service (Figure 6-9).'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/8d47d1b5dbca55e784ae602145a894c7_217_0.png)


    Figure 6-9. Anatomy of a span'
  merge: -1

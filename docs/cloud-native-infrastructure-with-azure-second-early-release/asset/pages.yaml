  md: "The *endpoints* role finds the targets from the service endpoints in a Kubernetes\
    \ cluster. For each endpoint address, one target is discovered per port. You can\
    \ scrape endpoints as follows:\n\n```\nscrape_configs:\n  - job_name: 'k8apiserver'\n\
    \    kubernetes_sd_configs:\n      - role: endpoints\n    scheme: https\n    tls_config:\n\
    \      ca_file: cert.crt\n```\n\n# The ingress role\n\nLastly, the *ingress* role\
    \ discovers a target for each path of each ingress. This role is also a way to\
    \ perform opaque monitoring of the ingress. You can scrape an ingress as follows:\n\
    \n```\nscrape_configs:\n  - job_name: 'gateway'\n    kubernetes_sd_configs:\n\
    \      - role: ingress\n    scheme: https\n    tls_config:\n      ca_file: cert.crt\n\
    ```\n\nHaving covered metrics in depth, let’s take a look at how logging is implemented\
    \ in cloud native applications.\n\n# Logging in the Cloud Native World\n\nLogs\
    \ are a crucial piece of information in any environment. They are primarily used\
    \ by engineers while troubleshooting an issue or gaining insights into a system.\
    \ But logging in general is complex. The complexity arises due to the various\
    \ ways to consume logs, differences in data formats, and the need to ensure that\
    \ the underlying application which is responsible for storing the logs also scales\
    \ well as the number of logs grows. In cloud native distributed environments,\
    \ logging becomes even more important."

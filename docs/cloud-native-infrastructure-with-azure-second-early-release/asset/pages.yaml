    # Summary


    Despite common misconceptions, it is possible to run large-scale data systems
    natively in Azure. In this chapter, we reviewed why it is advantageous to use
    cloud native data systems in Azure’s cloud. We covered four systems: Vitess (relational),
    Rook (blob), TiKV (key-value), and etcd (key-value configuration/service discovery).
    These systems are the bedrock of a cloud native architecture that stores and serves
    online data and offers a large upside over utilizing PaaS components. By now,
    you should understand what software makes sense for you to manage yourself as
    well as which PaaS services to use and how to deploy them in your infrastructure.


    The cloud, and in particular, Kubernetes, has become a much friendlier place to
    run your stateful infrastructure. While Azure Gen2 storage accounts are a great
    resource for blob storage, cloud native software can really help you build long-lasting,
    large-scale, stateful infrastructure.


    Now that you understand how you can store and serve data in a cloud environment,
    let’s look at how to move data between systems using real-time messaging.'

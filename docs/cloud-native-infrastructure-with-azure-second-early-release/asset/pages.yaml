- pgno: 251
  md: 'To take full advantage of Istio as a service mesh, Pods in the cluster must
    also use the Istio sidecar proxy. istio-proxy, which is basically the Envoy proxy,
    can be deployed in two ways: manually or automatically. The manual method allows
    you to modify the injection and proxy configuration. The automatic method, as
    the name suggests, enables an automatic proxy configuration at the time of Pod
    creation by using a mutating admission controller. Although the manual method
    is useful when you need a certain configuration, the automatic method is preferred.
    We’ll go through how to use the automatic method next.


    # KUBERNETES ADMISSION CONTROLLERS


    An admission controller is a piece of code that intercepts requests to the Kubernetes
    API server before the object is persisted but after the request is authenticated
    and authorized. Kubernetes provides a range of admission controllers which are
    compiled into the kube-apiserver library.


    A MutatingAdmissionController can modify objects that it admits. That is, it calls
    any mutating web hook that matches the request.


    To use automatic sidecar injection, use the label istio-injection on the desired
    namespace and set it to enabled. This allows any new Pods created in that namespace
    to have a proxy sidecar be deployed along with the application. To give you a
    better understanding of how this happens, first we’ll deploy an Nginx Pod with
    no sidecar injection, and then we will enable sidecar injection so that with future
    deployments, the sidecar proxy is automatically injected.


    Suppose we have deployed Nginx with one Pod:


    ```

    $ kubectl apply -f nginx_deploy.yaml

    deployment.apps/nginx-deployment created


    $ kubectl get deployment -o wide

    NAME                 READY   UP-TO-DATE   AVAILABLE   AGE

    CONTAINERS           IMAGES                  SELECTOR

    ```'
  merge: -1
  img_proc: true
- pgno: 252
  md: "```\nnginx-deployment    1/1    1    1    105s    nginx\nnginx:1.14.2    app=nginx\n\
    ```\n\n```\n$ kubectl get pod\nNAME    READY    STATUS    RESTARTS    AGE\nnginx-deployment-6b474476c4-bqgh8\
    \    1/1    Running    0    4m5s\n```\n\nLet’s label the default namespace istio-injection=enabled:\n\
    \n```\n$ kubectl label namespace default istio-injection=enabled --overwrite\n\
    namespace/default labeled\n$ kubectl get namespace -L istio-injection\nNAME  \
    \          STATUS    AGE    ISTIO-INJECTION\ndefault         Active    24m   \
    \ enabled\nistio-system    Active    18m\nkube-node-lease Active    25m\nkube-public\
    \     Active    25m\nkube-system     Active    25m\n```\n\nSince injection occurs\
    \ when the Pod is created, we can kill the Nginx Pod and spin a new Nginx Pod,\
    \ only this time the Pod will have a sidecar injected automatically:\n\n```\n\
    $ kubectl delete pod -l app=nginx\npod \"nginx-deployment-6b474476c4-bqgh8\" deleted\n\

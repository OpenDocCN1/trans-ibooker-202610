    \nkind: CiliumNetworkPolicy\nmetadata:\n  name: \"rule1\"\nspec:\n  description:\
    \ \"Allow HTTP GET /admin\nendpointSelector:\n  {}\ningress:\n- fromEndpoints:\n\
    \  toPorts:\n  - ports:\n    - port: \"80\"\n      protocol: TCP\n    rules:\n\
    \      http:\n      - method: \"GET\"\n        path: \"/admin\"\n```\n\nYou can\

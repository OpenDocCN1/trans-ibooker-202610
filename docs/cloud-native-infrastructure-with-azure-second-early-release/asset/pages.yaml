  md: '# Software you can install to run serverless functions


    ![](img/8d47d1b5dbca55e784ae602145a894c7_356_0.png)


    Figure 11-1. The CNCF Serverless Landscape


    While we won’t cover it in detail in this book, beyond the frameworks and primary
    cloud providers providing serverless offerings, edge-network (or CDN) providers
    are also offering serverless or “edge-compute” functionality. This has become
    extremely popular at companies like Cloudflare.


    # Benefits of Serverless


    When used correctly, serverless can come with major benefits to the user:


    Lower costs


    You are billed for the number of times or the amount of time your function runs,
    meaning that you do not have to pay for idle cloud resources.


    Eliminated operational overhead'

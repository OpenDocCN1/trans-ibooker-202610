- pgno: 371
  md: 'The controller and scaler will scale the number of Pods up or down depending
    on the signal from the metrics adapter.


    # Metrics adapter


    The metrics adapter acts as a Kubernetes metrics server that provides queue length
    or stream lag information to the agent. The scaler uses this information to scale
    containers up and down.


    You can see all of the KEDA scalers in the Scalers documentation.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_371_0.png)


    Figure 11-3. The KEDA reference architecture


    # Installing KEDA on Kubernetes'

    \      - name: http\n        containerPort: 8181\n    args:\n      - \"run\"\n\
    \      - \"--ignore=.*\"  # exclude hidden dirs created by Kubernetes\n      -\
    \ \"--server\"\n      - \"/policies\"\n    volumeMounts:\n      - readOnly: true\n\
    \        mountPath: /policies\n        name: policy\n    volumes:\n      - name:\
    \ policy\n        configMap:\n          name: policy\n```\n\n+   - Create the\
    \ service definition file (*servica-opa.yaml*):\n\n```\nkind: Service\napiVersion:\
    \ v1\nmetadata:\n  name: opa\n  labels:\n    app: opa\nspec:\n  type: NodePort\n\
    \  selector:\n    app: opa\n  ports:\n```"

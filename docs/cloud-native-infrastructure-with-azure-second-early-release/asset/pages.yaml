- pgno: 124
  md: "# Health checks\n\nKubernetes offers three types of HTTP health checks, called\
    \ *probes*, for ensuring the application is actually alive and well: liveness\
    \ probes, readiness probes, and startup probes.\n\n# *Liveness probe*\n\nThis\
    \ probe is responsible for ensuring that the application is actually healthy and\
    \ fully functioning. After deployment, your application may take a few seconds\
    \ before it is ready, so you can configure this probe to check a certain endpoint\
    \ in your application. For example, in the following Pod manifest, a liveness\
    \ probe has been used to perform an `httpGet` operation against the / path on\
    \ port 80. The `initialDelaySeconds` is set to 2, which means the endpoint / will\
    \ not be hit until this period is elapsed. Additionally, we have set the timeout\
    \ to be 1 second and the failure threshold to be 3 consecutive probe failures.\
    \ The `periodSeconds` is defined as how frequently Kubernetes will be calling\
    \ the Pods. In this case, it’s 15 seconds.\n\n```\napiVersion: v1\nkind: Pod\n\
    metadata:\n  name: mytest-pod\nspec:\n  containers:\n  - image: test_image\n \
    \   imagePullPolicy: IfNotPresent\n    name: mytest-container\n    command: ['sh',\
    \ '-c', 'echo Container 1 is Running ; sleep 3600']\n    ports:\n    - name: liveness-port\n\
    \      containerPort: 80\n      hostPort: 8080\n    livenessProbe:\n      httpGet:\n\
    \        path: /\n        port: 80\n      initialDelaySeconds: 2\n      timeoutSeconds:\
    \ 1\n```"
  merge: -1
  img_proc: true
- pgno: 125
  md: "```\nperiodSeconds: 15\nfailureThreshold: 3\n```\n\n# Readiness probe\n\nThe\
    \ readiness probe’s responsibility is to identify when a container is ready to\
    \ serve the user request. A readiness probe helps Kubernetes by not adding an\
    \ unready Pod’s endpoint to a load balancer too early. A readiness probe can be\
    \ configured simultaneously with a liveness probe block in the Pod manifest as\
    \ follows:\n\n```\ncontainers:\n  - name: test_image\n    image: test_image\n\
    \    command: [\"/bin/sh\"]\n    args: ['sh', '-c', 'echo Container 1 is Running\
    \ ; sleep 3600']\n    readinessProbe:\n      httpGet:\n        path: /\n     \
    \   port: 80\n      initialDelaySeconds: 5\n      periodSeconds: 5\n```\n\n# Startup\
    \ probe\n\nSometimes an application requires some additional startup time on its\
    \ first initialization. In such cases, you can set up a startup probe with an\
    \ HTTP or TCP check that has a failureThreshold * periodSeconds which is long\
    \ enough to cover the worst-case startup time:\n\n```\nstartupProbe:\n  httpGet:\n\
    \    path: /healthapi\n    port: liveness-port\n  failureThreshold: 30\n  periodSeconds:\
    \ 10\n```\n\n# Resource limits\n\nWhen you deal with Pods, you can specify the\
    \ resources your application will need. Some of the most basic resource requirements\
    \ for a Pod to run"
  merge: -1
  img_proc: true
- pgno: 126
  md: "are CPU and memory. Although there are more types of resources that Kubernetes\
    \ can handle, we will keep it simple here and discuss only CPU and memory.\n\n\
    You can declare two parameters in the Pod manifest: *request* and *limit*. In\
    \ the request block you tell Kubernetes the minimum resource requirement for your\
    \ application to operate, and in the limit block you tell Kubernetes the maximum\
    \ threshold. If your application breaches the threshold in the limit block, it\
    \ will be terminated or restarted and the Pod will be mostly evicted. For example,\
    \ in the following Pod manifest, we are placing a max CPU limit of 500m⁴ and a\
    \ max memory limit of 206Mi,⁵ which means if these values are crossed, the Pod\
    \ will be evicted and rescheduled on some other node:\n\n```\napiVersion: v1\n\
    kind: Pod\nmetadata:\n  name: nginx\nspec:\n  containers:\n    - image: nginx\n\
    \      name: nginx\n      ports:\n        - containerPort: 80\n          name:\
    \ http\n  resources:\n    requests:\n      cpu: \"100m\"\n      memory: \"108Mi\"\
    \n    limits:\n      cpu: \"500m\"\n      memory: \"206Mi\"\n```\n\n# Volumes\n\
    \nSome applications require data to be stored permanently, but because Pods are\
    \ short-lived entities and are frequently restarted or killed on the fly, all\
    \ data associated with a Pod can be destroyed as well. *Volumes* solve this problem\
    \ with an abstraction layer of storage disks in Azure. A volume is a way to store,\
    \ retrieve, and persist data across Pods throughout the"
  merge: -1
  img_proc: true
- pgno: 127
  md: "application lifecycle. If your application is stateful, you need to use a volume\
    \ to persist your data. Azure provides *Azure Disk* and *Azure Files* to create\
    \ the data volumes which provide this functionality.\n\n# *Persistent Volume Claim\
    \ (PVC)*\n\nThe PVC serves as an abstraction layer between the Pod and storage.\
    \ In Kubernetes, the Pod mounts volumes with the help of PVCs and the PVCs talk\
    \ to the underlying resources. One thing to note is that a PVC lets you consume\
    \ the abstracted underlying storage resource; that is, it lets you claim a piece\
    \ of preprovisioned storage. The PVC defines the disk size and disk type and then\
    \ mounts the real storage to the Pod; this binding process can be static, as in\
    \ a persistent volume (PV), or dynamic, as in a `Storage class`. For example,\
    \ in the following manifest we are claiming a `PersistentVolumeClaim` having storage\
    \ of `1Gi`:\n\n```\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n \
    \ name: persistent-volume-claim-app1\nspec:\n  accessModes:\n    - ReadWriteMany\n\
    \  resources:\n    requests:\n      storage: 1Gi\n  storageClassName: azurefilestorage\n\
    ```\n\n# *Persistent volume—static*\n\nA cluster administrator, usually the SRE\
    \ or DevOps team, can create a predefined number of persistent volumes manually,\
    \ which can then be used by the cluster users as they require. Persistent volume\
    \ is the static provisioning method. For example, in the following manifest we\
    \ are creating a `PersistentVolume` with a storage capacity of `2Gi`:\n\n```\n\
    apiVersion: v1\nkind: PersistentVolume\nmetadata:\n  name: static-persistent-volume-app1\n\
    ```"

  md: 'A downside of all of the serverless platforms is that your function code is
    directly tied into the software platform you’re running your functions on. This
    severely limits your portability over time.


    Now that we’ve explained what serverless is and some of the benefits of using
    the technology, we will look at various platforms on which to run serverless functions.


    # Azure Function Apps


    Azure function apps are Azure’s platform offering of serverless applications.
    Function apps provide the ability to run either code or containers in either Linux
    or Windows environments with support for multiple programming languages, including:


    +   - .NET Platform (C#, F#)

    +   - JavaScript and TypeScript

    +   - Python

    +   - Java

    +   - PowerShell Core


    An Azure function app will have an associated plan that dictates how your app
    will scale, the features that are available, and the price that you pay. At the
    time of this writing, there are three options:


    *Consumption*


    This is a basic plan in which the function scales automatically and you only pay
    when your functions are running.


    *Functions Premium*'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'This automatically scales based on demand using prewarmed workers. It runs
    with more powerful instances and allows some advanced network functionality.


    # App Service Plan


    This is for long-running scenarios in which you also need predictive scaling and
    billing.


    You can find more information about each plan on the Azure Functions hosting options
    documentation page.


    # Function App Architecture


    Azure’s app architecture (see Figure 11-2) fits in with the larger suite of Azure
    offerings including Cosmos DB, storage accounts, and Azure Pipelines. The native
    integration with Cosmos DB and storage accounts makes it an attractive offering
    for simple integration with other Azure offerings. While we won’t cover it in
    this book, Azure functions also tie in with the continuous integration/continuous
    deployment (CI/CD) offering in Azure Pipelines and can be monitored by Azure Monitor.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_359_0.png)


    Figure 11-2. Azure’s serverless function reference architecture'

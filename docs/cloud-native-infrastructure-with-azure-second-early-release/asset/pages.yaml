- pgno: 113
  md: 'maintain isolation (as we explained in Chapter 3). Pods also get a unique IP
    address.


    In typical scenarios, a single container is run inside a Pod, but in some instances,
    multiple containers need to work together in a Pod. This latter setup is usually
    referred to as a sidecar container. One of the most common examples of running
    a sidecar container is running a logging container for your application that will
    ship your logs to external storage, such as an ELK (Elasticsearch, Logstash, and
    Kibana) server, in case your application Pod crashes or a Pod is deleted. Pods
    are also smart in that if a process in a container dies, Kubernetes will instantly
    restart it based on the health checks defined at the application level.


    Another characteristic of Pods is that they allow horizontal scaling by replication
    implemented through ReplicaSets. This means that if you want your application
    to scale horizontally, you should create more Pods by using ReplicaSets.


    Pods are also ephemeral in nature, which means that if a Pod gets killed, it will
    be moved and restarted on a different host. This is also accomplished by using
    ReplicaSets.


    # ReplicaSets


    Reliability is a chief characteristic of Kubernetes, and since no one would be
    running a single instance of a Pod, redundancy becomes important. A ReplicaSet
    is a Kubernetes object that ensures that a stable set of replica Pods are running
    to maintain a self-healing cluster. All of this is achieved by the reconciliation
    loop, which keeps running in the background to observe the overall state of the
    Kubernetes cluster. ReplicaSets use the reconciliation loop and ensure that if
    any of the Pods crash or get restarted, a new Pod will be started in order to
    maintain the desired state of replication. In general, you should not directly
    deal with ReplicaSets, but rather, use the Deployment object, which ensures zero-downtime
    updates to your application and has a declarative approach toward managing and
    operating Kubernetes.'

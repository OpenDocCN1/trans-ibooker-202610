- pgno: 307
  md: "The following examples will create a policy that allows SSH authorization for\
    \ the sre group and the group associated with the application:\n\n```\npackage\
    \ sshd.authz\n\nimport input.pull_responses\nimport input.sysinfo\n\nimport data.hosts\n\
    \n# By default, users are not authorized.\ndefault allow = false\n\n# Allow access\
    \ to any user that has the \"admin\" role.\nallow {\n    data.roles[\"sre\"][_]\
    \ == input.sysinfo.pam_username\n}\n\n# Allow access to any user who contributed\
    \ to the code running on the host.\n#\n# This rule gets the \"host_id\" value\
    \ from the file\n\"/etc/host_identity.json\".\n# It is available in the input\
    \ under \"pull_responses\" because we\n# asked for it in our pull policy above.\n\
    #\n# It then compares all the contributors for that host against the username\n\
    # that is asking for authorization.\nallow {\n\nhosts[pull_responses.files[\"\
    /etc/host_identity.json\"].host_id].contributors[_] == sysinfo.pam_username\n\
    }\n\n# If the user is not authorized, then include an error message in the response.\n\
    errors[\"Request denied by administrative policy\"] {\n    not allow\n}\n```\n\
    \nWe’ll create a second policy that only allows sudo access for the sre group:"
  merge: -1
  img_proc: true
- pgno: 308
  md: "```\npackage sudo.authz\n\n# By default, users are not authorized.\ndefault\
    \ allow = false\n\n# Allow access to any user that has the \"admin\" role.\nallow\
    \ {\n    data.roles[\"sre\"][_] == input.sysinfo.pam_username\n}\n\n# If the user\
    \ is not authorized, then include an error message in the response.\nerrors[\"\
    Request denied by administrative policy\"] {\n    not allow\n}\n```\n\nNow we\
    \ can register both of these policies in OPA:\n\n```\ncurl -X PUT --data-binary\
    \ @sshd_authz.rego localhost:8181/v1/policies/sshd/authz\ncurl -X PUT --data-binary\
    \ @sudo_authz.rego localhost:8181/v1/policies/sudo/authz\n```\n\nAfter we successfully\
    \ execute these commands, our policy will be applied and only users in the sre\
    \ group will have SSH and sudo access to all machines. Meanwhile, the relevant\
    \ service group will only have SSH access to the machine on which the service\
    \ is deployed.\n\n# Summary\n\nAlthough operating cloud native infrastructure\
    \ brings immense benefits to the operator, it does present significant risk to\
    \ your business if the infrastructure is not well secured. In this chapter, we\
    \ reviewed a means to secure and audit your infrastructure. First we reviewed\
    \ the CNI standard and how it’s the foundation for other platforms like Flannel\
    \ and Cilium. We examined how those systems can be used to provide connectivity\
    \ and network security to your cloud infrastructure. Then we looked at non-network\
    \ policy mechanisms for managing your cloud infrastructure via Azure Policy as\
    \ well as policy for applications via Open Policy Agent."

- pgno: 302
  md: 'Open Policy Agent (OPA) is an open source, general-purpose policy engine that
    allows you to perform authorization policy actions against your software (Figure
    8-11). OPS allows you to specify policy as code and provides simple APIs for software
    to integrate with.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_302_0.png)


    Figure 8-11. How OPA works


    OPA policies are codified in a declarative language called Rego (see the policy
    language documentation). The policies are then deployed to the OPA service on
    the host. Unlike a number of the systems that we’ve discussed in this chapter,
    OPA does not perform any enforcement; rather, it performs'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'policy decision-making. OPA evaluates policies and data to produce query results
    which are sent back to the client. Policies are written in a high-level declarative
    language and can be loaded dynamically into OPA, remotely via APIs, or through
    the local filesystem.


    OPA provides a REST API that third-party services/systems like Kubernetes, SSH,
    Sudo, and Envoy can utilize to answer questions such as the following:


    +   - Which users can access which resources

    +   - Which subnets’ egress traffic is allowed

    +   - Which clusters a workload must be deployed to

    +   - Which registries’ binaries can be downloaded

    +   - Which OS capabilities a container can execute with

    +   - Which times of day the system be accessed


    You can find more details on the OPA REST API documentation page. The key APIs
    that OPA serves are as follows:


    ```

    GET /v1/policies

    ```


    Gets all the policies


    ```

    GET /v1/policies/<name>

    ```


    Returns a specific policy


    ```

    PUT /v1/policies/<name>

    ```


    Creates or updates a policy


    ```

    DELETE /v1/policies/<name>

    ```


    Deletes a policy


    ```

    GET/POST /v1/data/<name>

    ```'
  merge: -1
  img_proc: true
- pgno: 304
  md: "Allows you to return or create a document\n\nOPA allows you to centralize multiple\
    \ security policies across multiple pieces of infrastructure into one system.\
    \ You can find a full list of OPA integrations on the OPA Ecosystem page. Without\
    \ OPA, you would need to implement policy management for your software from scratch.\
    \ Required components such as the policy language (syntax and semantics) and the\
    \ evaluation engine need to be carefully designed, implemented, tested, documented,\
    \ and then maintained to ensure correct behavior and a positive user experience\
    \ for your customers.\n\n# Deploying OPA on Kubernetes\n\nDeploying OPA on Kubernetes\
    \ is straightforward.\n\n+   - Create the deployment definition file (*deployment-opa.yaml*):\n\

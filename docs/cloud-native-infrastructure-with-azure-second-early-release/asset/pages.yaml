    Over the past several years, containers have grown in popularity. Not only do
    they offer low overhead, high security, and high portability, they also follow
    best-practice cloud principles such as immutability, ephemerality, and autoscaling.


    In this chapter, we’ll explain what containers are and discuss the popular containerization
    platforms. In addition, we’ll look past the general industry hype and explain
    why you might want to use containers. We’ll also highlight some of their benefits,
    especially when it comes to the cloud.


    # Why Containers?


    Containers run on top of the host operating system and usually are orchestrated
    using software like Docker (as we’ll discuss later in this chapter) or Kubernetes
    (see Figure 3-1). One of the most important benefits'

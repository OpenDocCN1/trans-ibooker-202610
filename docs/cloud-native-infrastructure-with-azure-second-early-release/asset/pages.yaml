    stack. By building observable systems, you can have greater control over complex
    distributed systems that interact over boundaries. In this chapter, we also took
    a stab at observability and its growing need in the cloud native environment.
    With the three pillars of observability and an introduction to the preferred ways
    of doing logging, monitoring, and tracing over modern distributed systems over

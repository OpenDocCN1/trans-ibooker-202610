- pgno: 243
  md: "Azure DNS can be used to resolve hostnames in both public and private domains.\
    \ The public DNS feature can be used to host your prepurchased domain name via\
    \ Azure, while the private DNS lets you manage and resolve domain names within\
    \ virtual networks.\n\nCoreDNS also provides an Azure-specific plug-in that is\
    \ used to serve zones from Azure DNS. You can enable the Azure plug-in as follows:\n\
    \n```\nazure AZURE_RESOURCE_GROUP:ZONE... {\n    tenant <TENANT_ID>\n    client\
    \ <CLIENT_ID>\n    secret <CLIENT_SECRET>\n    subscription <SUBSCRIPTION_ID>\n\
    \    environment <ENVIRONMENT>\n    fallthrough [ZONES...]\n    access private\n\
    }\n```\n\nIn the preceding code:\n\n+   - AZURE_RESOURCE_GROUP:ZONE is the resource\
    \ group to which the hosted zones belong on Azure, and ZONE is the zone that contains\
    \ data.\n+   - CLIENT_ID and CLIENT_SECRET are the credentials for Azure, and\
    \ tenant specifies the TENANT_ID to be used. SUBSCRIPTION_ID is the subscription\
    \ ID.\n+   - environment specifies the Azure ENVIRONMENT.\n+   - fallthrough specifies\
    \ that if the zone matches and no record can be generated, the request should\
    \ be passed to the next plug-in. If ZONES is omitted, fall-through occurs for\
    \ all zones for which the plug-in is authoritative.\n+   - access specifies whether\
    \ the DNS zone is public or private. The default is public.\n\nWe’ve covered the\
    \ role and significance of service discovery in distributed cloud native environments,\

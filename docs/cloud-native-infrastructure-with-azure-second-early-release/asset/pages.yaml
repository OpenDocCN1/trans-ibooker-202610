- pgno: 23
  md: 'check in your infrastructure definitions. Treating your infrastructure as code
    provides numerous advantages, including the following:


    +   - The ability to check in a version of your infrastructure definitions and
    roll back to a particular version in case of an issue

    +   - Idempotence, which enables you to reproduce the exact same infrastructure
    with minimal effort

    +   - Standardized logging, monitoring, and troubleshooting across your stack

    +   - Reducing single points of failure in your engineering teams (i.e., where
    only one engineer knows how to build a particular type of system)

    +   - Increased developer productivity (the site reliability engineers [SREs]
    and/or DevOps engineers can focus on writing code that developers can use to build
    a test environment)

    +   - Minimal manual interaction, which leads to less error-prone infrastructure

    +   - Drastically reduced mean time to recover (MTTR) from failures

    +   - The ability to test your infrastructure even before it’s created


    With the benefits of IaC, it becomes evident that such tooling plays an important
    role in modern cloud native environments where applications must be changed on
    the fly. Changes can be minor, such as adding a new configuration tag, or major,
    such as adding new clusters to keep up with capacity requirements. A reliable
    IaC strategy helps developers manage these changes with ease without compromising
    the speed of the software development process. Once IaC is embedded into the core
    of your infrastructure build process, it also helps build antifragile infrastructure.'

    \        eventing.knative.dev/broker.class:\nMTChannelBasedBroker\nspec: {}\n\
    ---\n# hello-world app deployment\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
    \    name: hello-world\n    namespace: knative-samples\nspec:\n    replicas: 1\n\
    \    selector:\n        matchLabels: &labels\n```"

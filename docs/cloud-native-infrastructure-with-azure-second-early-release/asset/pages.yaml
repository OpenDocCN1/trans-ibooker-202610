  md: "are limits to the level of instrumentation that you can/should add, even though\
    \ Prometheus is efficient in handling multiple metrics.²\n\nNow that you understand\
    \ how code instrumentation works and how hosts are added to Prometheus and scraped,\
    \ let’s see how to add hosts to Prometheus to be scraped in a production environment.\n\
    \n# Finding Hosts\n\nPrometheus uses the static_configs file under scrape_configs\
    \ in the prometheus.yml file to find host targets to scrape. Cloud environments\
    \ are very dynamic in nature, and change occurs quite frequently, especially in\
    \ containerized environments. In such environments, manually adding hosts to the\
    \ prometheus.yml file will not scale very well. Prometheus offers a wide variety\
    \ of ways to handle such situations by supporting many sources, including Kubernetes,\
    \ Azure, and custom service discovery platforms. Service discovery is a simple\
    \ way to find all the services running in a distributed cloud environment. We\
    \ will talk in detail about service discovery in Chapter 7. Here, we’ll take a\
    \ look at a couple of ways we can find hosts in production to be scraped by Prometheus.\n\
    \n# Using Ansible\n\nIf the hosts are running node exporters, one of the simplest\
    \ ways to find the hosts is to statically update the prometheus.yml file with\
    \ the inventory hosts. Basically, every time you add a machine you should also\
    \ have a provision to add it to the prometheus.yml configuration file. The following\
    \ is a snippet for updating prometheus.yml using Ansible:\n\n```\nscrape_configs:\n\
    \  - job_name: {{ hostname }}\n    static_configs:\n      - targets:\n       \
    \ - {{ hostname }}:9100\n```\n\nYou can also loop over the hosts under any group\
    \ in an Ansible inventory and add them directly."

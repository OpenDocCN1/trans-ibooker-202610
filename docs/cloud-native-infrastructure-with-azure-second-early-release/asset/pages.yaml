  md: 'Figure 6-2 shows what these main components look like in the Prometheus architecture.


    ![](img/8d47d1b5dbca55e784ae602145a894c7_182_0.png)


    Figure 6-2. Prometheus architecture


    Prometheus stores all data as a *time series*; that is, streams of timestamped
    values that belong to the same metric and the same set of labeled dimensions.
    Each time series is uniquely identified by its *metric name* and an optional key-value
    pair called *labels*. Moreover, the client libraries offer basic quad-core metric
    types: Counter, Gauge, Histogram, and Summary. We will talk about these four types
    later in the chapter, as well as provide instrumentation examples.'

  \   1/1     Running   1          45m\n10.200.0.43   worker0   <none>           <none>\n\
  ```\n\n### Jobs\n\n有时我们需要运行一个小脚本直到它成功终止。Kubernetes 允许你使用 Job 对象来实现这一点。Job 对象创建并管理\
  \ Pod，这些 Pod 会运行直到成功完成，并且与普通 Pod 不同，一旦给定任务完成，这些由 Job 创建的 Pod 不会被重启。你可以使用一个 Job YAML\
  \ 来描述一个简单的 Job，如下所示：\n\n```\napiVersion: batch/v1\nkind: Job\nmetadata:\n  name:\
  \ examplejob\nspec:\n  template:\n    metadata:\n      name: examplejob\n    spec:\n\
  \      containers:\n      - name: examplejob\n        image: busybox\n        command:\

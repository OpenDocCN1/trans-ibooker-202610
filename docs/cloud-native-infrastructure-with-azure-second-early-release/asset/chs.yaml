  \ READERS\n\n对于早期发布读者的一则说明\n\n使用 Early Release 电子书，你可以在这些书籍的官方发布之前很久就利用这些技术——作者在撰写时提供的原始未编辑内容，以便你能尽早利用这些技术。\n\
  \n这将是最终书籍的第 5 章。请注意，GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑\
  \ rfernando@oreilly.com。\n\n现在你已经了解了 Kubernetes 集群在底层的工作原理，是时候检验这些知识并实际构建和使用一个 Kubernetes\
  \ 集群了。有多个工具可用于在生产环境中以高可用性创建和运行 Kubernetes 集群。其中一些更常见的工具是 kops、kubeadm、Kubespray\
  \ 和 Rancher。这些工具在构建集群方面有预写的剧本，可以与一系列技术组合无缝地在生产环境中运行。\n\n在本章中，我们将不使用预构建的工具。相反，我们将采取更动手的方式来构建一个你可以在生产环境中使用的集群。\n\
  \n### Creating a Kubernetes Cluster from Scratch\n\n在本节中，我们将使用 Ansible、Terraform\
  \ 和 Packer 从头构建一个 Kubernetes 集群。我们将向你展示如何手动构建集群，以便你更好地了解集群的各个组件。虽然这不是构建或运行生产级 Kubernetes\
  \ 集群的首选方式，但它将为你提供良好的基础知识。\n\n开始之前，你需要克隆本书的 GitHub（https://bit.ly/3kccjZZ）并打开 Chapter5\
  \ 文件夹。本章假设你已经按照第 2 章中的步骤设置了 Azure 账户，并且你已经通过 Terraform、Packer 和 Ansible playbooks\
  \ 尝试过创建基础设施。\n\n我们按如下方式安排了 Chapter5 Git 仓库中的代码：\n\n\n\n$ Chapter5 git:(master)\n\

  \ 代理自动注入（见图 7-5）。你可以使用此功能从 UI 启用或禁用 sidecar 代理的自动注入。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_259_0.png)\n\
  \n图 7-4. Kiali 仪表板展示简单的入站流量\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_260_0.png)\n\
  \n图 7-5. Kiali 仪表板显示默认命名空间中自动注入 sidecar 代理的状态\n\n### 探索 Kiali 仪表板\n\n在本节中，我们将解释如何直接从\
  \ Kiali 仪表板使用 Istio 功能。对于本次演示，我们使用一个小型旅行应用程序服务的示例。虽然我们不会过多关注应用程序，但我们将重点介绍 Kiali\
  \ 的功能以及它如何高效地提供有关你的云原生应用程序的每个细节。我们还将提供演示应用程序业务逻辑的高级概述。如果你想了解更多，请参考旅行演示的官方 Kiali\
  \ 文档。⁴\n\n该应用程序模拟了在不同命名空间中组织的两个业务域。第一个命名空间称为 travel-portal，它有多个旅行商店，用户可以在其中搜索和预订航班、酒店、汽车和旅行保险。商店应用程序可以根据请求特征（如渠道（网页或移动）和用户（新用户或现有用户））表现出不同的行为。所有门户都使用部署在\
  \ travel-agency 命名空间中的名为 travels 的服务。\n\n第二个命名空间称为 travel-agency，它托管了一组用于提供旅行报价的服务。主要的旅行服务将是旅行机构的业务入口点。它接收目的地城市和用户作为参数，并计算构成旅行预算的所有元素：机票、住宿、汽车预订和旅行保险。\n\
  \n每个服务都可以提供独立的报价，旅行服务必须将其聚合为单个响应。\n\n还有第三个命名空间，称为 `travel-control`，它运行具有不同功能的主业务仪表板。\n\
  \n我们按如下方式在服务中部署了这三个命名空间：\n\n```\n$ kubectl create namespace travel-agency\n$ kubectl\
  \ create namespace travel-portal\n$ kubectl create namespace travel-control\n```\n\
  \n```\n$ kubectl apply -f <(curl -L https://raw.githubusercontent.com/kiali/demos/master/travels/travel_agency.yaml)\
  \ -n travel-agency\n$ kubectl apply -f <(curl -L https://raw.githubusercontent.com/kiali/demos/master/travels/travel_portal.yaml)\
  \ -n travel-portal\n$ kubectl apply -f <(curl -L https://raw.githubusercontent.com/kiali/demos/master/travels/travel_control.yaml)\
  \ -n travel-control\n```\n\n部署旅行演示应用程序后，你需要做的第一件事是启用 sidecar 代理支持。首先通过点击图 7-6 中突出显示的框中的三个点，为所有新创建的命名空间启用自动注入。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_261_0.png)\n\n图 7-6. 为 `travel-portal`\
  \ 命名空间启用自动注入\n\n\n\n\n\n你也可以通过点击右上角的 Actions 按钮（见图 7-7）为已部署的工作负载（即 Pods）启用自动注入。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_262_0.png)\n\n图 7-7. 为 cars 工作负载启用自动注入\n\
  \n当你通过 Kiali 仪表板为工作负载启用自动注入时，它将自动重新部署应用程序 Pod 并注入 sidecar，这与我们之前讨论的为 Nginx Pod 的方法类似。\n\
  \n你还可以在 Services 选项卡中使用请求路由功能为服务生成流量规则，如图 7-8 所示，该规则将为 Istio 创建配置以将所需量的流量路由到某个网关主机，或使用断路器。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_263_0.png)\n\n图 7-8. Services 选项卡操作\n\
  \n你也可以通过点击 Add Rule 按钮在控制服务上使用请求路由功能来生成流量规则，这将添加一条默认规则，其中任何请求都将被路由到控制工作负载。同样，你也可以通过点击\
  \ Update 按钮向你的负载均衡器添加一个带有主机的网关并进行更新，如图 7-9 所示。\n\n### Update Request Routing\n\n\
  Matching selected: Match any request\n\nRules defined:\n\nHide Advanced Options\n\
  \n图 7-9. 通过 Kiali 在 Istio 配置中为服务添加请求路由\n\nKiali 还开箱即用地提供日志、通过 Prometheus 的指标，以及如果你在环境中部署了这些组件，则通过\
  \ Jaeger 的追踪。我们强烈建议你探索 Kiali UI 以了解其全部功能。\n\n### Summary\n\n在本章中，我们探讨了服务发现和服务网格，这两个重要的概念有助于你在像\
  \ Azure 这样的云环境中有效地将应用程序连接起来。我们介绍了 CoreDNS 作为 Kubernetes 环境中服务发现机制中取代 kube-dns 的默认\
  \ DNS。我们还介绍了 Istio 服务网格，它使用 Envoy 作为数据平面来获取有关服务的有用洞察，并提供 Istio 服务网格的完整功能集。我们以关于\
  \ Kiali 的部分作为本章的结尾，Kiali 为基于 Istio 的服务网格提供了一个完整的管理控制台。Kiali 能够通过提供堆栈中所有内容的单一视图，为云原生服务提供可观测性。\n\
  \n在下一章中，我们将深入讨论 Kubernetes 中的容器网络是如何工作的，以及你如何通过各种策略管理技术来紧密保护你的基础设施。\n\n- 1 阅读更多关于\
  \ Caddy 的内容请访问 https://caddyserver.com。\n- 2 CNCF 为项目分配不同的成熟度级别：sandbox、incubated\
  \ 和 graduated，这对应于《跨越鸿沟》图表中的 Innovators、Early Adopters 和 Early Majority 层级。成熟度级别是\
  \ CNCF 分配给项目的一个信号，用于识别哪些类型的企业应该采用该项目。\n- 3 https://github.com/coredns/coredns/releases/tag/v1.8.1\n\
  - 4 https://kiali.io/docs/tutorials/travels/02-install-travel-demo\n"
- "## Chapter 8. Networking and Policy Management: Behold the Gatekeepers\n\n### A\
  \ NOTE FOR EARLY RELEASE READERS\n\n对于早期发布读者的一则说明\n\n使用 Early Release 电子书，你可以在这些标题正式发布之前很久就利用这些技术——作者在写作时提供的原始未编辑内容——让你能够尽早利用这些技术。\n\
  \n这将是最终书籍的第 8 章。请注意，GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑\
  \ rfernando@oreilly.com。\n\n在前面的章节中，我们在 Azure 中构建了基础设施并解释了如何发现和监控我们的应用程序。现在是时候保护这些应用程序了！尽管由于简单的错误配置，过去发生了许多云数据泄露，但事实是，保护云基础设施并不困难。云网络技术已经迅速发展，今天有许多厂商提供云原生软件，可以帮助你增强网络配置并保护它。\n\
  \nAzure 提供了一个名为 Azure Policy 的功能，允许你针对租户、管理组或订阅设置策略，从而默认提供一层安全保护。例如，在 Azure 中，你可以设置一个策略，确保管理组或订阅中的任何存储帐户都不可公开访问。\n\
  \n在本章中，我们将探索容器网络的强大功能以及你可以用它来改进基础设施的多种方式。我们还将解释如何将策略应用于你的基础设施以保持其安全。\n\n我们将从关于容器网络及其被多个项目构建所围绕的标准规范的讨论开始，然后重点介绍\
  \ Calico、Flannel 和 Weave 等产品，它们提供网络连接和网络策略执行。我们将以关于使用 Open Policy Agent（OPA）进行系统策略执行的讨论作为本章的结尾。\n\
  \n### The Container Network Interface (CNI)\n\n正如我们在前几章中所提到的，容器提供了大量的安全性和可移植性功能。其中最大的回报之一来自网络栈。Linux\
  \ cgroups 和网络命名空间功能开启了各种网络功能，可用于增强安全性和遥测，以及管理性能。容器网络功能灵活性和强大功能的一个很好的例子是 Cilium，这是一个软件工具，为\
  \ Kubernetes 提供负载均衡、安全、遥测、带宽管理和其他功能作为插件。我们将在本章后面详细介绍 Cilium。\n\n在第 3 章中，我们简要提到了行业有一个用于容器运行时和容器镜像的标准规范。Container\
  \ Network Interface（CNI）于 2015 年创建（最终被添加到 Cloud Native Computing Foundation [CNCF]\
  \ 孵化项目列表中）作为配置容器网络接口和相关网络设置的规范。CNI 规范允许管理以下原语：\n\n- 接口名称和网络命名空间绑定\n- IP 地址\n- 路由\n\
  - DNS 设置\n- Sysctl 设置\n\n一个示例 CNI 配置如下所示：\n\n```\n{\n  \"cniVersion\": \"1.0.0\"\
  ,\n  \"name\": \"dbnet\",\n  \"plugins\": [\n    {\n      \"type\": \"bridge\",\n\
  \      \"bridge\": \"cni0\",\n      \"args\": {\n        \"labels\" : {\n      \
  \    \"appVersion\" : \"1.0\"\n        }\n      },\n      \"ipam\": {\n        \"\
  type\": \"host-local\",\n        \"subnet\": \"10.1.0.0/16\",\n        \"gateway\"\
  : \"10.1.0.1\"\n      },\n      \"dns\": {\n        \"nameservers\": [ \"10.1.0.1\"\
  \ ]\n      }\n    },\n    {\n      \"type\": \"tuning\",\n      \"sysctl\": {\n\
  \        \"net.core.somaxconn\": \"500\"\n      }\n    }\n  ]\n}\n```\n\n### Why\
  \ Would You Use a CNI?\n\n你可能会问自己，为什么行业只需要一个仅用于网络的规范。正如我们在第 3 章中提到的，容器生态系统有大量网络项目可插入\
  \ Docker 和 Kubernetes 等容器系统。多个团队正在创建公开可用的与网络相关的插件，因此需要一种标准方式来描述和控制容器的网络层。\n\nCNI\
  \ 平台实现了真正的网络虚拟化，这意味着你无需担心管理网络基础设施——包括在云中！利用容器平台作为网络基础设施大大降低了实施和运营复杂网络基础设施的成本，并提供了在无需投资物理或专用虚拟网络设备的情况下进行扩展和升级的能力。\n\
  \n### How Does CNI Work with Azure?\n\nAzure 支持 CNI，但它有两个特殊的插件可将你的容器连接到 Azure Virtual\
  \ Network（VNet）：\n\n- azure-vnet，它实现了 CNI 网络插件\n- azure-vnet-ipam，它实现了 CNI IP 地址管理（IPAM）插件\n\
  \n这些插件确保容器可以正确地与 Azure VNet 控制平面交互。你可以在 Azure Kubernetes Service（AKS）和独立的 Azure\
  \ 虚拟机中同时使用这些插件。\n\n> NOTE\n> \n> Windows Networking\n> \n> 虽然 Linux 和 Windows 的网络栈在根本上非常不同，但\
  \ Azure CNI 插件确实对 Windows 提供了第一类支持，这意味着你可以在同一基础设施中同时运行 Windows 和 Linux 容器，而无需创建单独的网络基础设施。\n\
  \nAzure CNI 配置如下所示：\n\n```\n{\n  \"cniVersion\": \"1.0.0\",\n```\n\n\n\n\n```\n\"\
  name\": \"azure\",\n\"plugins\": [\n    {\n        \"type\":\"azure-vnet\",\n  \
  \      \"mode\":\"bridge\",\n        \"bridge\":\"azure0\",\n        \"ipam\":{\n\
  \            \"type\":\"azure-vnet-ipam\"\n        }\n    },\n    \"ipam\": {\n\
  \        \"type\": \"azure-vnet-ipam\",\n        \"Environment\": \"azure\"\n  \
  \  },\n    \"dns\": {\n        \"nameservers\": [ \"10.1.0.1\" ]\n    }\n    },\n\
  \    {\n        \"type\": \"tuning\",\n        \"sysctl\": {\n            \"net.core.somaxconn\"\
  : \"500\"\n        }\n    }\n]\n}\n```\n\n使用 azure-vnet 和 azure-vnet-ipam 插件可将 IP\
  \ 配置和管理从主机转移到 Azure VNet 控制平面。\n\n### 各类 CNI 项目\n\nCNI 项目包含一组默认的 CNI 插件，分为三个类别：\n\
  \n*Main*\n\n这些插件创建接口（bridge、ipvlan、macvlan、ptp、host-device）。\n\n*IPAM*\n\n这些插件为接口分配\
  \ IP 地址（dhcp、host-local、static）。\n\n### Meta\n\n这些是其他原生插件，可用于执行以下操作：\n\n- Sysctl\
  \ 调优\n- 带宽限制\n- 防火墙\n- Flannel（将在本章后面介绍）\n\n您可以在 CNI 插件页面上找到有关这些原生插件的更多信息。\n\n除了我们在此提到的\
  \ CNI 插件之外，还有一个庞大的第三方项目生态系统在编写 CNI 兼容的插件。截至撰写本文时，已有超过 25 个外部项目利用了 CNI 标准。这些项目提供不同类型的功能，包括负载均衡、IPAM、覆盖网络、安全和网络遥测。\n\
  \n一些较小的项目包括：\n\n- Infoblox\n- Juniper Contrail\n- VMware NSX\n\n虽然一些 CNI 插件专为非常特定的基础设施而设计（例如\
  \ Cisco 的 ACI CNI），但许多插件与 Azure 和 Azure 服务配合使用效果非常好。在以下各节中，我们将探讨 Calico、Cilium、Weave、Flannel\
  \ 和 OPA，并讨论这些系统如何帮助构建和保护网络基础设施。\n\n### Calico\n\nCalico 是一个开源的网络安全和策略解决方案，适用于 Windows\
  \ 和 Linux 下的容器、虚拟机和裸机安装。Calico 提供网络安全策略执行以及实现零信任网络的能力。Calico 支持多种数据平面，包括最先进的纯 Linux\
  \ 扩展 Berkeley Packet Filter（eBPF）数据平面、标准 Linux 网络数据平面和 Windows HNS 数据平面。Calico 在主机数据平面之上运行以执行网络策略。它支持标准\
  \ Linux 网络栈。\n\n### 为什么要使用 Calico？\n\n随着基础设施的增长，管理网络连接和策略变得呈指数级困难。此外，确保预期策略正确且正确应用，以及对策略的反馈得到应用，异常困难。这正是\
  \ Calico 擅长的地方。它允许您以抽象、可扩展的管理器定义网络策略，然后确保策略得到应用，而不会牺牲网络性能。\n\n### 基本架构\n\nCalico\
  \ 具有客户端/数据存储架构，可简化平台操作。它包括以下关键组件（也在图 8-1 中显示）：\n\nFelix\n\n安装网络访问控制列表（ACL）、路由信息以及接口管理和状态报告的网络编程守护进程\n\
  \nBIRD\n\n从 Felix 获取路由信息并通过边界网关协议（BGP）重新分发路由\n\nconfd\n\n监听 Calico 数据存储的路由更改并将其传递给\
  \ BIRD\n\nCalico CNI 插件\n\n容器网络接口的接口\n\n数据存储\n\n包含有关策略、工作负载和 IPAM 分配的操作信息\n\nTypha\n\
  \n数据存储的缓存代理，用于扩展连接到数据存储的节点数量\n\ncalicoctl\n\n用于创建、读取、更新和删除 Calico 对象的 CLI\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_274_0.png)\n\
  \n图 8-1. Calico 架构\n\n### 部署 Calico\n\n部署 Calico 有两种选择：作为 AKS 安装中的网络策略引擎的一部分安装，或在\
  \ Kubernetes 上手动部署。\n\n### 通过 AKS 安装部署 Calico\n\nAzure 已为 Calico 作为网络 *policy* 引擎引入了第一类支持；它可以在创建\
  \ AKS 实例的网络配置步骤中作为安装的一部分安装，如图 8-2 所示。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_275_0.png)\n\
  \n在此步骤中，如果您在 AKS 安装过程中选择 Calico，将在每个 Kubernetes 计算节点上安装一个 Calico Typha Pod。\n\n\
  ### 手动安装 Calico\n\n如果您想在 Kubernetes 集群上手动安装 Calico，可以使用 kubectl 下载 operator 并安装组件。\n\
  \n- 首先，安装 operator 然后安装 Calico 资源。这将创建 `tigera-operator` 命名空间：\n  \n  ```\n  $ kubectl\
  \ create -f\n  https://docs.projectcalico.org/manifests/tigera-operator.yaml\n \
  \ $ kubectl create -f\n  https://docs.projectcalico.org/manifests/custom-resources.yaml\n\
  \  ```\n\n- 验证所有 Calico 节点是否正在运行：\n  \n  ```\n  $ kubectl get pods -n calico-system\n\
  \  ```\n\n- 等待所有 Pod 进入 Running 状态。\n\n> **WARNING**\n> \n> *custom-resources.yaml*\
  \ 文件中的 `ipPools` 配置在部署后无法修改。这意味着 `ipPools`（分配给每个 Pod 的 IP 地址）在您应用 *custom-resources.yaml*\
  \ 文件后即已设置。\n\n### 安装 calicoctl\n\n要控制 Calico，您需要访问其 CLI 实用程序。有几种方法可以访问该实用程序，如 Calico\
  \ 安装文档所述。对于此示例，我们将简单地将 CLI 下载到我们的机器上并作为 kubectl 插件运行。\n\n- 登录到主机并导航到 /usr/local/bin：\n\
  \  \n  ```\n  $ cd /usr/local/bin\n  ```\n\n- 下载二进制文件：\n  \n  ```\n  $ curl -o kubectl-calico\
  \ -O -L \"https://github.com/projectcalico/calicoctl/releases/download/v3.21.0/calicoctl-linux-ppc64le\"\
  \n  ```\n\n- 将二进制文件设为可执行：\n  \n  ```\n  $ chmod +x kubectl-calico\n  ```\n\n- 验证插件是否工作：\n\
  \  \n  ```\n  $ kubectl calico -h\n  ```\n\n### Calico 深度解析\n\n我们已经在高层次上讨论了使用 Calico\
  \ 的好处以及它如何工作以及如何安装的一些基础知识。现在我们将了解如何使用它。对于本节的其余部分，我们将使用 eBPF 作为数据平面，而不是标准 Linux 网络栈。\n\
  \nAzure 不允许在其数据平面中使用未知 IP，因此您只能在节点之间使用基于 VXLAN 的覆盖网络。这只有在您构建自管理集群（图 8-3）时才可能，而在\
  \ AKS 上则不行。在 AKS 上您必须使用 Azure 作为网络提供程序，如图 8-4 所示。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_277_0.png)\n\
  \n图 8-3. 自管理设置（使用 VXLAN）\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_277_1.png)\n\
  \n图 8-4. AKS 网络设置\n\n### 启用 eBPF\n\n设置 Calico 基础设施的下一步是启用 eBPF 数据平面。启用 eBPF 允许您利用新的内核功能并移除对\
  \ kube-proxy 进行负载均衡的使用。启用 eBPF 后，kube-proxy 的使用将被禁用。您可以在此博客文章中找到有关 Calico eBPF 实现的更多信息。\n\
  \n要启用 eBPF，请按照以下步骤操作。\n\n- 通过运行查找 API 服务器：\n\n```\n$ kubectl get configmap -n kube-system\
  \ kube-proxy -o jsonpath='{ .data.kubeconfig}' | grep server`\n    server:\nhttps://d881b853ae312e00302a84f1e346a77.hcp.us-east-1.azmk8s.io\n\
  ```\n\n- 更新您的 tigera-operator 命名空间：\n\n```\nkind: ConfigMap\napiVersion: v1\nmetadata:\n\
  \  name: kubernetes-services-endpoint\n  namespace: tigera-operator\ndata:\n  KUBERNETES_SERVICE_HOST:\
  \ \"<API server host>\"\n  KUBERNETES_SERVICE_PORT: \"<API server port>\"\n```\n\
  \n- 重新启动 operator 以应用更改：\n\n```\n$ kubectl delete pod -n tigera-operator -l k8s-app=tigera-operator\n\
  ```\n\n- 禁用 kube-proxy 的部署（以节省资源）：\n\n```\n$ kubectl patch networks.operator.openshift.io\
  \ cluster --type merge -p '{\"spec\":{\"deployKubeProxy\": false}}'\n```\n\n- 使用\
  \ calicoctl 启用 eBPF：\n\n```\n$ calicoctl patch felixconfiguration default --patch='{\"\
  spec\": {\"bpfEnabled\": true}}'\n```\n\n如果您在运行 eBPF 时遇到问题，Calico 提供了故障排除指南。\n\n\
  NOTE\n如果您使用 eBPF 且内核版本高于 4.16，Calico 将自动尝试使用 XDP 处理数据包，这将提供性能改进。这对于高吞吐量服务或遭受 DOS\
  \ 攻击的服务很有用。\n\n### 实现 Calico 安全策略\n\n\n\n\n\n现在我们已经配置好网络，可以开始应用一些安全策略了。Calico 网络策略的功能比\
  \ Kubernetes 更强大，包括：\n\n- 策略排序\n- 拒绝规则\n- 匹配规则的更大灵活性\n\nCalico 网络策略支持使用 OSI 第 5\
  \ 层到第 7 层标准以及加密身份来保护应用程序。你可以在 Calico 网络策略配置页面找到示例。\n\n网络策略可以通过以下几种方式强制执行：\n\n- 全局（适用于所有命名空间中的所有\
  \ Pod），称为 GlobalNetworkPolicy\n- 按网络或主机，称为 HostEndpoint\n- 按命名空间，称为 NetworkPolicy\n\
  \n### GlobalNetworkPolicy：允许 ICMP 流量\n\n我们创建的第一个策略是一个全局网络策略，允许集群内所有主机之间的 ICMP 流量用于\
  \ ping 和 traceroute。按如下方式创建文件 global-policy.yaml：\n\n```\napiVersion: projectcalico.org/v3\n\
  kind: GlobalNetworkPolicy\nmetadata:\n  name: allow-ping-in-cluster\nspec:\n  selector:\
  \ all()\n  types:\n  - Ingress\n  ingress:\n  - action: Allow\n    protocol: ICMP\n\
  \    source:\n      selector: all()\n    icmp:\n```\n\n```\ntype: 8 # Ping request\n\
  - action: Allow\n  protocol: ICMPv6\n  source:\n    selector: all()\n  icmp:\n \
  \   type: 128 # Ping request\n```\n\n通过运行以下命令应用策略：\n\n```\n$ calicoctl create global-policy.yaml\n\
  ```\n\n### NetworkPolicy：允许命名空间内两个标签之间的流量\n\n在此示例中，我们将允许来自 production 命名空间且选择器为\
  \ green 的流量访问同一命名空间中选择器为 blue 的 Pod，端口为 TCP/1234。创建一个名为 network-policy.yaml 的新文件：\n\
  \n```\napiVersion: projectcalico.org/v3\nkind: NetworkPolicy\nmetadata:\n  name:\
  \ allow-tcp-1234\n  namespace: production\nspec:\n  selector: color == 'blue'\n\
  \  ingress:\n  - action: Allow\n    protocol: TCP\n    source:\n      selector:\
  \ color == 'green'\n    destination:\n      ports:\n      - 1234\n```\n\n通过运行以下命令应用策略：\n\
  \n```\n$ calicoctl create network-policy.yaml\n```\n\n应用此策略后，流量将能够流向任何 green Pod\
  \ 的 TCP 1234 端口。\n\n### Cilium\n\n过去五年中引入的最具创新性的网络工具之一是 Cilium 项目，它大量利用 eBPF 来提供面向云原生基础设施的网络、可观测性和安全功能套件。\n\
  \nCilium 利用 eBPF Linux 内核技术，可为内核及其上运行的应用程序提供低开销、高性能的可见性和控制逻辑。eBPF 的使用使 Cilium 成为基础设施架构师的热门选择，因为该平台围绕三个关键支柱提供功能：\n\
  \n#### Networking\n\nCilium 实现了自己的 CNI，利用 Linux eBPF。这使得 Cilium 性能极高，并允许其执行负载均衡，而无需依赖\
  \ kube-proxy。它还允许多集群连接，这对于大型安装非常重要。\n\n#### Observability\n\nCilium 对 eBPF 的使用使其成为独特的观测软件。Cilium\
  \ 可以对网络连接和数据的所有层执行深度包检测。\n\n#### Security\n\nCilium 的最佳功能之一是它可以通过 IPSec 在主机之间执行透明加密。这意味着你可以通过高效的机制获得端到端加密，而无需更改应用程序。虽然\
  \ Cilium 提供了自己的 label+CIDR 匹配安全策略，但它也执行（OSI）第 7 层过滤（例如，过滤传出 DNS 查询或过滤传入 HTTP 请求）。\n\
  \n最后，Cilium 允许你对策略制定决策执行第 7 层内省（有关更多信息，请参阅此博客文章）。\n\nCilium 将 eBPF 作为其核心使用，使软件能够深入检查和操作（在需要时）所有网络流量，而不会影响系统性能。\n\
  \nCilium 代理（cilium-agent）在每个节点上运行（见图 8-5）并通过 Kubernetes API 接受配置。代理会将该配置转换为在容器的网络接口、主机的网络或主机之一的网卡上运行的\
  \ eBPF 程序。\n\n### Orchestration systems\n\n#### Cilium layer\n\nCilium CLI\n\nPolicy\
  \ repository\n\nPlug-ins\n\nCilium monitor\n\nCilium daemon\nCode generation\n\n\
  Bytecode injection\n\nBPF program\n\nBPF program\n\nBPF program\n\nBPF program\n\
  \neth0\n\nContainer\n\nContainer\n\nContainer\n\n#### Kernel\n\nFigure 8-5. The\
  \ Cilium architecture\n\n### Deploying Cilium\n\nCilium 可以安装在自管理的 Kubernetes 集群或托管的\
  \ AKS 集群上。在这两种情况下，Cilium 都可以通过 Helm 部署，这使得安装变得简单。此外，Cilium 还提供了一个容器来执行连接检查，以验证集群中\
  \ Pod 之间的网络流量是否可以自由流动。\n\n有关更多信息，请参阅部署 Cilium 到 Azure 的专用文档。\n\n#### Self-managed\
  \ Cilium installation\n\n我们将使用其 quick-install 文件安装 Cilium：\n\n```\n$ kubectl apply\
  \ -f\nhttps://raw.githubusercontent.com/cilium/cilium/v1.9/install/kubernetes/quick-install.yaml\n\
  ```\n\n以下代码将安装主机之间的连接检查：\n\n```\n$ kubectl apply -f\nhttps://raw.githubusercontent.com/cilium/cilium/v1.9/examples/kubernetes/connectivity-check/connectivity-check.yaml\n\
  ```\n\n这将部署一系列 Pod，它们将使用各种网络路径相互连接以验证连接性。连接路径包括有无服务负载均衡以及各种网络策略组合。\n\n#### AKS Cilium\
  \ installation\n\n要在 AKS 上设置 Cilium，我们将使用 Helm chart。\n\n- 首先我们将创建一个新的 AKS 集群：\n\
  \n```\n$ export RESOURCE_GROUP_NAME=aks-test\n$ export CLUSTER_NAME=aks-test\n$\
  \ export LOCATION=westus\n```\n\n```\n$ az group create --name $RESOURCE_GROUP_NAME\
  \ --location $LOCATION\n$ az aks create \\\n    --resource-group $RESOURCE_GROUP_NAME\
  \ \\\n    --name $CLUSTER_NAME \\\n    --location $LOCATION \\\n    --node-count\
  \ 2 \\\n    --network-plugin azure\n```\n\n- 现在我们将创建一个服务主体来与 Azure API 交互并填充环境变量以传递给\
  \ Helm：\n\n```\n$ az ad sp create-for-rbac --name cilium-operator > azure-sp.json\n\
  \n$ AZURE_SUBSCRIPTION_ID=\"$(az account show | jq -r .id)\"\n$ AZURE_CLIENT_ID=\"\
  $(jq -r .appId < azure-sp.json)\"\n$ AZURE_CLIENT_SECRET=\"$(jq -r .password < azure-sp.json)\"\
  \n$ AZURE_TENANT_ID=\"$(jq -r .tenant < azure-sp.json)\"\n$ AZURE_NODE_RESOURCE_GROUP=\"\
  $(az aks show --resource-group $RESOURCE_GROUP_NAME --name $CLUSTER_NAME | jq -r\
  \ .nodeResourceGroup)\"\n```\n\n- 我们将本地安装 Cilium 仓库，然后在 Kubernetes 集群上安装 Cilium：\n\
  \n```\n$ helm repo add cilium https://helm.cilium.io/\n$ helm install cilium cilium/cilium\
  \ --version 1.9.9 \\\n    --namespace kube-system \\\n    --set azure.enabled=true\
  \ \\\n    --set azure.resourceGroup=$AZURE_NODE_RESOURCE_GROUP \\\n    --set azure.subscriptionID=$AZURE_SUBSCRIPTION_ID\
  \ \\\n    --set azure.tenantID=$AZURE_TENANT_ID \\\n```\n\n```\n--set azure.clientID=$AZURE_CLIENT_ID\
  \ \\\n--set azure.clientSecret=$AZURE_CLIENT_SECRET \\\n--set tunnelDisabled \\\n\
  --set ipam.mode=azure \\\n--set masquerade=false \\\n--set nodeinit.enabled=true\n\
  --set kubeProxyReplacement=strict \\\n--set hostFirewall=true \\\n--set loadBalancer.algorithm=maglev\
  \ \\\n--set k8sServiceHost=REPLACE_WITH_API_SERVER_IP \\\n--set k8sServicePort=REPLACE_WITH_API_SERVER_PORT\n\
  ```\n\n- 我们可以通过检查是否已创建四个初始 Pod，并且 `cilium` 和 `cilium-operator` Pod 正在运行来验证安装：\n\n\
  ```\n$ kubectl -n kube-system get pods --watch\ncilium-operator-ad4375ds5-2x2q3\
  \        1/1     Running\n0               4m18s\ncilium-s5x8xk                 \
  \   1/1     Running\n0               4m19s\n```\n\n### Installing Hubble\n\n你还想安装\
  \ Hubble，这是一个 UI，允许你查看服务图，该图描绘了服务之间的依赖关系以及网络使用和性能的统计数据。Hubble 的实时更新、类似图形的界面（见图 8-6）允许你展示有关容器之间数据布局和流向的大量信息。此外，它还提供了一个建模\
  \ Cilium 策略的界面。\n\n\n\n\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_287_0.png)\n\
  \n图 8-6. 显示简单架构的 Hubble UI 截图\n\n你可以使用 kubectl 安装 Hubble：\n\n```\nkubectl apply\
  \ -f\nhttps://raw.githubusercontent.com/cilium/cilium/v1.9/install/kubernetes/quick-hubble-install.yaml\n\
  ```\n\n### 将 Cilium 与云集成\n\n正如我们之前提到的，Cilium 具有丰富的特性集可供利用。在本节中，我们将使用 Cilium 作为网络提供者和策略执行器（防火墙）。然后我们将查看\
  \ Cilium 的可观测性。\n\n### 主机防火墙\n\n与我们对 Calico 的深入探讨类似，这里我们将实现一组网络策略。Cilium 的优势在于它可以在\
  \ L3、L4 或 L7 上执行策略。网络策略执行有三种模式，如表 8-1 所示。\n\n表 8-1. 网络策略执行\n\n| 模式 | 描述 |\n|------|-------------|\n\
  | Default | 如果规则选择了端点并且规则具有 ingress 或 egress 部分，则端点将根据策略拒绝。 |\n| Always | 在所有端点上启用策略执行，即使没有规则选择特定端点。\
  \ |\n| Never | 在所有端点上禁用策略执行，并且允许所有流量。 |\n\n要为 Cilium 代理管理的全部端点在运行时配置策略执行模式，请使用以下命令并选择\
  \ default、always 或 never 之一的模式：\n\n```\n$ cilium config PolicyEnforcement={default,always,never}\n\
  ```\n\n策略是基于允许列表模型编写的，如果没有明确的允许规则，流量将被阻止。\n\nL3 和 L4 规则可以使用以下方法指定：\n\n#### 标签\n\n\
  使用选择器对 Pod 进行分组。\n\n#### 服务\n\n使用 Kubernetes 服务定义策略。\n\n#### 实体\n\nCilium 管理的特殊预定义作用域。\n\
  \n#### IP/CIDR\n\n一个 IP 或 IP 范围（CIDR）。\n\n#### DNS 名称\n\n一个 DNS 名称。\n\n例如，如果你想允许两个带标签的\
  \ Pod 之间的流量，可以创建以下策略：\n\n```\napiVersion: cilium.io/v2\nkind: CiliumNetworkPolicy\n\
  metadata:\n  name: \"l3-rule\"\nspec:\n  endpointSelector:\n    matchLabels:\n \
  \     role: backend\n  ingress:\n  - fromEndpoints:\n  - matchLabels:\n      role:\
  \ frontend\n```\n\n你可以通过运行以下命令应用此策略：\n\n```\n$ cilium policy import l3-rule-example-1.yaml\n\
  ```\n\n此外，如果你想创建一个 L4 示例，其中你想将出站 egress DNS 限制为 Google 公共 DNS 服务器，你可以编写以下示例中显示的规则：\n\
  \n```\napiVersion: \"cilium.io/v2\"\nkind: CiliumNetworkPolicy\nmetadata:\n  name:\
  \ \"allow-to-google-dns\"\nspec:\n  endpointSelector:\n    {}\n```\n\n```\negress:\n\
  - toCIDR:\n  - 8.8.8.8/32\n  - 8.8.8.4/32\n  toPorts:\n  - ports:\n    - port: '53'\n\
  \      protocol: UDP\n  - ports:\n    - port: '53'\n      Protocol: TCP\n```\n\n\
  你可以通过运行以下命令应用规则：\n\n```\n$ cilium policy import l4-rule-example-1.yaml\n```\n\n\
  最后，Cilium 还允许对 HTTP(s)、Kafka 和 DNS 流量进行 L7 可见性。在下一个示例中，我们允许所有 Pod 对 80 端口上的 /admin\
  \ 端点进行流量：\n\n```\napiVersion: \"cilium.io/v2\"\nkind: CiliumNetworkPolicy\nmetadata:\n\
  \  name: \"rule1\"\nspec:\n  description: \"Allow HTTP GET /admin\nendpointSelector:\n\
  \  {}\ningress:\n- fromEndpoints:\n  toPorts:\n  - ports:\n    - port: \"80\"\n\
  \      protocol: TCP\n    rules:\n      http:\n      - method: \"GET\"\n       \
  \ path: \"/admin\"\n```\n\n你可以在 Layer 7 policy Cilium 文档中找到有关 L7 策略规则的更具体细节。\n\n\
  NOTE\nCilium 提供了一个交互式工具来建模网络策略并可视化它们。你可以在 Cilium Editor 页面上尝试使用它。\n\n### 可观测性\n\n\
  正如我们之前简要提到的，Hubble 是 Cilium 操作员观察其基础设施中发生情况的地方。一旦你安装了 Hubble 和连接性测试（来自安装步骤），你将能够观察命名空间内的网络流。在本节中，我们将更进一步，利用\
  \ Cilium 的一项新功能，该功能提供 L3 和 L4 协议可见性，这将为每个端口上的流量提供更具体的详细信息。你需要实现 L7 策略才能获得 L7 可观测性功能。\n\
  \n要启用 L3 和 L4 可见性，你需要在 Pod 上启用注解。以下是一个示例：\n\n```\n$ kubectl annotate pods --all\
  \ io.cilium.proxy-visibility=\"<Egress/53/UDP/DNS>,<Ingress/80/TCP/HTTP>\"\n```\n\
  \n这将启用对 Pod 的出站（egress）DNS 流量以及入站（ingress）HTTP 流量的指标。\n\n可见性信息由注解中的逗号分隔的元组列表表示：\n\
  \n```\n<{Traffic Direction}/{L4 Port}/{L4 Protocol}/{L7 Protocol}>\n```\n\n启用后，Hubble\
  \ 将显示协议特定的信息。图 8-7 显示了 DNS 可见性的示例。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_293_0.png)\n\
  \n图 8-7. DNS 流量可观测性的示例\n\n如果你想了解如何检查传输层安全（TLS）加密连接，请访问 Inspecting TLS Encrypted\
  \ Connections with Cilium 页面。\n\n### Flannel\n\nFlannel 是 Kubernetes 的（OSI）第 3 层网络\
  \ fabric 系统，最初是 Red Hat CoreOS 项目的一部分。它是 Kubernetes 最简单的 CNI 之一。它依赖于一个名为 flanneld\
  \ 的二进制代理在每个主机上运行，以配置覆盖 Pod 网络，然后将配置存储在 Kubernetes 数据存储中。Flannel 仅提供网络连接。它不支持任何类型的网络策略执行。\n\
  \n### 部署 Flannel\n\n当你设置集群时，可以通过运行以下命令快速安装 Flannel：\n\n```\n$ kubectl apply -f\n\
  https://raw.githubusercontent.com/coreos/flannel/master/Documentation/kube-flannel.yml\n\
  ```\n\n应用 *kube-flannel.yml* 将定义以下内容：\n\n- 一个用于基于角色的访问控制（RBAC）的 `ClusterRole` 和\
  \ `ClusterRoleBinding`。\n- Flannel 使用的 Kubernetes 服务帐户。\n- 一个包含 CNI 配置和 Flannel\
  \ 配置的 `ConfigMap`。Flannel 配置中的网络应与 Pod 网络的无类域间路由（CIDR）方案匹配。 后端的选择也在此处进行，默认值为 VXLAN。\n\
  - 用于在每个节点上部署 Flannel Pod 的每个架构的 DaemonSet。Pod 有两个容器：Flannel 守护进程本身，以及用于将 CNI 配置部署到\
  \ kubelet 可读取的位置的 `initContainer`。\n\n当你运行 Pod 时，它们将从 Pod 网络 CIDR 分配 IP 地址。无论这些\
  \ Pod 最终位于哪个节点，它们都能够相互通信。\n\n> **NOTE**\n> \n> 此清单将配置 Pod 网络默认为 10.244.0.0/16 并默认使用\
  \ VXLAN 后端。每个节点在 Pod 中将获得一个 10.244.X.0/24 掩码。\n\n你可以通过修改写入 *kube-flannel.yaml* 文件中\
  \ *net-conf.json* 的数据来重新配置后端以使用不同的地址空间、更小的掩码或不同的后端设置。你可以在 Flannel backend 文档和 Flannel\
  \ 配置页面上找到有关后端配置的更多信息。\n\n现在 Kubernetes 工作节点将具有来自你的 Azure VNet 的 IP 地址，但任何部署的 Pod\
  \ 将具有来自配置的 Pod 网络 IP 范围的 IP 地址。如果你想要多个 Pod 网络（用于网络流量分离），你将不得不运行单独的 `flanneld` 进程。\n\
  \n### Flannel 深入解析\n\nFlannel 是一个更简单的 Kubernetes CNI，需要最少的配置。它具有可插拔的后端，可在网络上的机器之间创建覆盖网络（见图\
  \ 8-8）。支持的传输后端包括：\n\n- VXLAN\n- Host-gw\n- 用户数据报协议（UDP）\n- Alivpc\n- Alloc\n- Amazon\
  \ Virtual Private Cloud（VPC）\n- Google Compute Engine（GCE）\n- IPIP\n- IPsec\n\n\
  ![](img/8d47d1b5dbca55e784ae602145a894c7_296_0.png)\n\n图 8-8. Flannel 架构示例\n\nFlannel\
  \ 项目团队建议将 VXLAN 或 host-gw 作为通信后端。如果你需要加密流量，IPsec 也是一个选项。你可以在 Flannel 文档中找到有关支持后端的更多信息。\n\
  \nFlannel 不允许你从一个守护进程运行多个网络；你需要使用不同的配置文件运行单独的守护进程。\n\n\n\n\n\n### Azure Policy\n\
  \n虽然主动运行保护云基础设施的软件无疑很有用，但 Azure Policy 允许你针对云基础设施的许多方面制定全面的策略，尤其是在资源安全方面。\n\nAzure\
  \ Policy 执行三个关键功能：\n\n- 创建防止或强制执行特定配置的策略\n- 允许对你自己的策略以及行业基准进行合规性报告\n- 通过对现有资源的批量修复和对新资源的自动修复使你的资源达到合规\n\
  \nAzure Policy 的潜在用例包括实施资源一致性、监管合规性、安全、成本和管理方面的治理。\n\nAzure Policy 定义以 JSON 格式定义并以分层方式应用；这意味着一种策略可以应用于一个管理组（以及其中的所有订阅/资源），而更宽松的策略可以设置为另一个管理组（以及其中的所有订阅/资源）。\n\
  \n#### Azure Policy 快速入门\n\nAzure 默认包含一些内置策略。你可以通过在终端中运行以下命令查看它们：\n\n```\n$ az policy\
  \ definition list\n```\n\n或者你可以在门户中查看它们（图 8-9）。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_298_0.png)\n\
  \n图 8-9. 可用 Azure Policy 定义的概览\n\nAzure Policy 还包括 *initiatives*，它们是与行业标准（例如，PCI\
  \ v3.2.1:2018）保持一致的策略集合。\n\n此时，策略已经创建但尚未分配作用域。你可以在订阅（以及订阅内的所有资源）上应用策略，或者你可以将其应用于管理组，从而覆盖所有子管理组和订阅。\n\
  \n无论哪种方式，你都需要为你的订阅注册 Microsoft.PolicyInsights 资源提供程序。你可以通过运行以下命令启用它：\n\n```\n$ az\
  \ provider register --namespace 'Microsoft.PolicyInsights'\n```\n\nAzure Policy\
  \ 有各种策略执行模式，也称为 *effects*。目前有七种类型的 Azure Policy 效果：\n\n- Append\n- Audit\n- AuditIfNotExists\n\
  - Deny\n- DeployIfNotExists\n- Disabled\n- Modify\n\n你可以在文章 Understand Azure Policy\
  \ effects 中阅读有关其用法的介绍。\n\n#### 创建你自己的 Azure Policy\n\n创建你自己的 Azure 策略很容易。在以下示例中，我们创建了一个策略，只允许在美国境内的\
  \ Azure 区域部署资源。如果用户尝试在非美国区域创建资源，则将被拒绝：\n\n```\n{\n  \"properties\": {\n    \"displayName\"\
  : \"Allowed locations\",\n    \"description\": \"This policy enables you to restrict\
  \ the locations your organization can specify when deploying resources.\",\n   \
  \ \"mode\": \"Indexed\",\n    \"metadata\": {\n      \"version\": \"1.0.0\",\n \
  \     \"category\": \"Locations\"\n    },\n    \"parameters\": {\n      \"allowedLocations\"\
  : {\n        \"type\": \"array\",\n        \"metadata\": {\n          \"description\"\
  : \"The list of locations that can be specified when deploying resources\",\n  \
  \        \"strongType\": \"location\",\n          \"displayName\": \"Allowed locations\"\
  \n        }\n      }\n    }\n  }\n}\n```\n\n```\n},\n\"defaultValue\": [ \"westus2\"\
  , \"eastus\", \"eastus2\", \"southcentralus\", \"centralus\", \"northcentralus\"\
  , \"westus\", \"westcentralus\", \"westus3\" ]\n}\n```\n\n我们将通过运行以下命令创建策略：\n\n```\n\
  $ az policy definition create --name 'allowed-regions' --display-name 'Deny non-US\
  \ regions' --description 'This policy ensures that resources are only created in\
  \ US regions.' --rules 'region-rule.json' --params 'region-params.json' --mode All\n\
  ```\n\n在响应中，我们将在 id 字段中看到新策略的路径；例如：\n\n```\n\"id\": \"/subscriptions/<subscription-ID>/providers/Microsoft.Authorization/policyDefinitions/allowed-regions\"\
  \n```\n\n我们将通过运行以下命令将策略分配给我们的订阅：\n\n```\n$ az policy assignment create --name 'allowed-regions'\
  \ --scope '/subscriptions/<subscription-id>' --policy '/subscriptions/<subscription-ID>/providers/Microsoft.Authorization/policyDefinitions/allowed-regions'\n\
  ```\n\n策略现在将被应用。如果我们尝试在非美国区域创建资源，我们将收到类似于图 8-10 中的错误。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_301_0.png)\n\
  \n图 8-10. 由于 Azure Policy 而部署新资源组时出现的错误消息\n\nNOTE\nAzure Policy Limits\nAzure Policy\
  \ 在可以应用的策略、例外、参数和条件数量方面存在限制。这些限制可能会根据策略的作用域而变化。请阅读文档以了解更多详情。\n\n#### Azure Policy\
  \ for Kubernetes\n\nAzure Policy 还支持 Kubernetes，使你能够深入了解 Kubernetes 部署的策略并创建与 Kubernetes\
  \ 相关的策略。你可以通过阅读 Understand Azure Policy for Kubernetes clusters 和 Secure your cluster\
  \ with Azure Policy 找到更多相关信息，这些文章将指导你如何将 Azure Policy 应用于 Kubernetes。\n\n#### Open\
  \ Policy Agent\n\nOpen Policy Agent (OPA) 是一种开源的通用策略引擎，允许你对软件执行授权策略操作（图 8-11）。OPA\
  \ 允许你将策略指定为代码，并为软件集成提供简单的 API。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_302_0.png)\n\
  \n图 8-11. OPA 的工作原理\n\nOPA 策略以一种名为 Rego 的声明式语言编纂（请参阅 policy language documentation）。然后策略被部署到主机上的\
  \ OPA 服务。与本章中讨论的许多系统不同，OPA 不执行任何强制执行；相反，它执行\n\n策略决策。OPA 评估策略和数据以生成查询结果，然后将结果发送回客户端。策略以高级声明式语言编写，可以动态加载到\
  \ OPA 中，通过 API 远程加载，或通过本地文件系统加载。\n\nOPA 提供了一个 REST API，第三方服务/系统（如 Kubernetes、SSH、Sudo\
  \ 和 Envoy）可以利用它来回答以下问题：\n\n- 哪些用户可以访问哪些资源\n- 哪些子网的出站流量是允许的\n- 工作负载必须部署到哪些集群\n- 可以下载哪些注册表的二进制文件\n\
  - 容器可以使用哪些操作系统功能\n- 系统可以在一天中的哪些时间被访问\n\n你可以在 OPA REST API 文档页面上找到更多详细信息。OPA 提供的关键\
  \ API 如下：\n\n```\nGET /v1/policies\n```\n\n获取所有策略\n\n```\nGET /v1/policies/<name>\n\
  ```\n\n返回特定策略\n\n```\nPUT /v1/policies/<name>\n```\n\n创建或更新策略\n\n```\nDELETE /v1/policies/<name>\n\
  ```\n\n删除策略\n\n```\nGET/POST /v1/data/<name>\n```\n\n允许你返回或创建文档\n\nOPA 允许你将多个安全策略跨多个基础设施组件集中到一个系统中。你可以在\
  \ OPA Ecosystem 页面上找到 OPA 集成的完整列表。没有 OPA，你就需要从头开始为你的软件实现策略管理。所需组件（如策略语言（语法和语义）和评估引擎）需要经过精心设计、实现、测试、记录，然后维护，以确保正确行为并为你的客户提供积极的用户体验。\n\
  \n#### 在 Kubernetes 上部署 OPA\n\n在 Kubernetes 上部署 OPA 很简单。\n\n- 创建部署定义文件（*deployment-opa.yaml*）：\n\
  \n```\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: opa\n  labels:\n\
  \    app: opa\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: opa\n\
  \  template:\n    metadata:\n      labels:\n        app: opa\n      name: opa\n\
  \    spec:\n```\n\n```\ncontainers:\n  - name: opa\n    image: openpolicyagent/opa:edge\n\
  \    ports:\n      - name: http\n        containerPort: 8181\n    args:\n      -\
  \ \"run\"\n      - \"--ignore=.*\"  # exclude hidden dirs created by Kubernetes\n\
  \      - \"--server\"\n      - \"/policies\"\n    volumeMounts:\n      - readOnly:\
  \ true\n        mountPath: /policies\n        name: policy\n    volumes:\n     \
  \ - name: policy\n        configMap:\n          name: policy\n```\n\n- 创建服务定义文件（*service-opa.yaml*）：\n\
  \n```\nkind: Service\napiVersion: v1\nmetadata:\n  name: opa\n  labels:\n    app:\
  \ opa\nspec:\n  type: NodePort\n  selector:\n    app: opa\n  ports:\n```\n\n\n\n\
  \n\n- name: http\n  protocol: TCP\n  port: 8181\n  targetPort: 8181\n\n- Apply both\
  \ files:\n\n```\n$ kubectl create -f deployment-opa.yaml\n$ kubectl create -f service-opa.yaml\n\
  ```\n\n### Deploying Policy with OPA\n\n如前所述，OPA 是一个通用策略引擎，可与多种软件生态系统集成。在本示例中，我们将使用\
  \ OPA 为机器配置 SSH 访问。\n\n在本示例中，我们将有三个组：\n\n*sre*\n\n这些是所有应用程序的管理员。\n\n*foo-frontend*\n\
  \n这些是 foo-frontend 应用程序的贡献者。\n\n*bar-backend*\n\n这些是 bar-backend 应用程序的贡献者。\n\n我们将实现以下策略：\n\
  \n- 组 `sre` 可以 SSH 登录任何主机并运行 sudo 命令。\n- 与应用程序开发相关的其他用户组中的用户可以登录主机，但不能运行 sudo 命令。\n\
  \n以下示例将创建一个策略，允许 sre 组和与应用程序关联的组进行 SSH 授权：\n\n```\npackage sshd.authz\n\nimport\
  \ input.pull_responses\nimport input.sysinfo\n\nimport data.hosts\n\n### By default,\
  \ users are not authorized.\ndefault allow = false\n\n### Allow access to any user\
  \ that has the \"admin\" role.\nallow {\n    data.roles[\"sre\"][_] == input.sysinfo.pam_username\n\
  }\n\n### Allow access to any user who contributed to the code running on the host.\n\
  #\n### This rule gets the \"host_id\" value from the file\n\"/etc/host_identity.json\"\
  .\n### It is available in the input under \"pull_responses\" because we\n### asked\
  \ for it in our pull policy above.\n#\n### It then compares all the contributors\
  \ for that host against the username\n### that is asking for authorization.\nallow\
  \ {\n\nhosts[pull_responses.files[\"/etc/host_identity.json\"].host_id].contributors[_]\
  \ == sysinfo.pam_username\n}\n\n### If the user is not authorized, then include\
  \ an error message in the response.\nerrors[\"Request denied by administrative policy\"\
  ] {\n    not allow\n}\n```\n\n我们将创建一个第二个策略，仅允许 sre 组使用 sudo：\n\n```\npackage sudo.authz\n\
  \n### By default, users are not authorized.\ndefault allow = false\n\n### Allow\
  \ access to any user that has the \"admin\" role.\nallow {\n    data.roles[\"sre\"\
  ][_] == input.sysinfo.pam_username\n}\n\n### If the user is not authorized, then\
  \ include an error message in the response.\nerrors[\"Request denied by administrative\
  \ policy\"] {\n    not allow\n}\n```\n\n现在我们可以将这两个策略注册到 OPA 中：\n\n```\ncurl -X PUT\
  \ --data-binary @sshd_authz.rego localhost:8181/v1/policies/sshd/authz\ncurl -X\
  \ PUT --data-binary @sudo_authz.rego localhost:8181/v1/policies/sudo/authz\n```\n\
  \n在成功执行这些命令后，我们的策略将被应用，只有 sre 组中的用户才具有对所有机器的 SSH 和 sudo 访问权限。与此同时，相关的服务组将仅对部署服务的机器具有\
  \ SSH 访问权限。\n\n### Summary\n\n尽管运营云原生基础设施为运营者带来了巨大的好处，但如果基础设施未得到良好保护，也会给您的业务带来重大风险。在本章中，我们回顾了一种保护和审计基础设施的方法。首先我们回顾了\
  \ CNI 标准以及它如何成为 Flannel 和 Cilium 等其他平台的基础。我们研究了这些系统如何用于为云基础设施提供连接性和网络安全。然后我们研究了通过\
  \ Azure Policy 管理云基础设施以及通过 Open Policy Agent 管理应用程序的非网络策略机制。\n\n使用安全的网络设置以及明确定义的策略构建云基础设施将有助于确保您的基础设施以安全的方式扩展。现在您了解了容器和云网络的基础知识，我们将把讨论转向了解如何在云中存储和提供数据。\n"
- "## Chapter 9. Distributed Databases and Storage: The Central Bank\n\n### A NOTE\
  \ FOR EARLY RELEASE READERS\n\n对于早期发布的电子书，您可以在作者撰写时获得书籍的最原始形式——未经编辑的原始内容，以便您在这些书籍正式发布之前就能利用这些技术。\n\
  \n这将是最终书籍的第 9 章。请注意，GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何建议，或者如果您注意到本章中缺少材料，请联系编辑\
  \ rfernando@oreilly.com。\n\n在构建云原生基础设施时需要克服的最大障碍之一是为在线和离线使用运营可靠且可扩展的存储。虽然过去对在云中运行存储服务的看法并不受欢迎，但许多云原生存储项目取得了成功，其中最突出的是\
  \ Vitess。包括 Azure 在内的云服务也大量投资于虚拟机和虚拟机规模集的托管磁盘，以及高级存储账户（如 Gen2）和托管数据库服务（如 MySQL、SQL\
  \ Server 和 Redis）。所有这些都使存储成为 Azure 云中的一等概念。在本章中，我们将探讨为什么您应该在 Azure 中大规模运行存储解决方案，以及如何以易于管理的方式编排它们。\n\
  \n### The Need for Distributed Databases in Cloud Native Architecture\n\n尽管 Azure\
  \ 提供了许多托管数据（SQL 和 NoSQL）解决方案，但有时您可能需要在云中运行更大、更专业的设置。云原生计算基金会（CNCF）数据库项目的自运营生态系统将使您能够扩展到比\
  \ Azure 平台即服务（PaaS）服务提供的更大规模，并为您提供更多功能和性能选项。\n\n正如本章将进一步讨论的那样，CNCF 格局列出了主要为云操作而设计的存储解决方案集。这些系统的好处是服务器管理开销最小化，同时您仍对系统有完全控制权。\n\
  \n在本章中，我们将研究 CNCF 格局中一些成熟的数据存储。Vitess、Rook、TiKV 和 etcd 都是成熟的云数据存储，能够扩展到巨大的规模，并在\
  \ Azure 中作为一流的数据系统运行。这些系统代表了在云基础设施中运营的数据生态系统的基础构建块。\n\n### RUNNING STATEFUL WORKLOADS\
  \ ON AKS\n\n> 在撰写本文时，Azure Kubernetes Service（AKS）支持多个可用区（即区域内的多个数据中心）；然而，它不支持多个故障域。这意味着如果您的\
  \ AKS 集群仅位于一个可用区，理论上可能会出现停机，因为集群中的多个节点不可用。我们建议您将 AKS 集群分布在多个可用区，直到 AKS 支持故障域。\n\n\
  ### Azure Storage and Database Options\n\n在开始构建云数据存储之前，您应该彻底评估您的用例，特别是您试图构建的存储、性能和成本。您可能会发现\
  \ Azure 的 PaaS 服务更适合特定用例，而不是使用 CNCF 产品。例如，Azure 的 Hadoop 分布式文件系统（HDFS）存储产品 Gen2\
  \ 存储账户，是存储大量数据的极具经济性的解决方案。\n\n在撰写本文时，Azure 提供了以下存储和数据库 PaaS 服务：\n\n- Azure Cosmos\
  \ DB\n- Azure Cache for Redis\n- Azure Database for:\n  - MySQL\n  - PostgreSQL\n\
  \  - MariaDB\n- Storage accounts (providing blob, Network File System [NFS], and\
  \ hierarchical storage)\n- Azure Storage Explorer\n\n我们建议您评估这些 Azure 产品的性能，特别是考虑\
  \ PaaS 服务的性能、可用性和成本，以确保您为用例使用正确的系统。Azure 提供了定价计算器工具，对于建模成本非常有用。\n\n如果您认为 Azure PaaS\
  \ 服务不符合您的要求，请继续阅读本章以了解其他潜在的数据存储解决方案。\n\n### Introduction to Vitess: Distributed\
  \ and Sharded MySQL\n\n\n\n\n\nVitess 是一个用于 MySQL 和 MariaDB 水平扩展的数据库集群系统。它由 YouTube\
  \ 工程师于 2010 年创建，用以保护和扩展他们的数据库。它提供了许多有助于性能、安全性和监控的功能，但最重要的是，它提供了强大的工具来管理数据库拓扑，并为垂直和水平分片以及重新分片提供一流的支持。在许多方面，它允许你以\
  \ NoSQL 的方式操作 SQL 数据库，同时仍然获得运行关系型数据库的所有好处。\n\n### 为什么运行 Vitess？\n\n你可能会问自己：“为什么我应该运行\
  \ Vitess，而不是使用 Azure Cosmos DB？” 尽管 Cosmos DB 对于全球分布式写入和副本来说是一个有吸引力的选择，但当前的价格模型使其在规模化运行（每秒数千次查询）时成本高得令人望而却步，这使得像\
  \ Vitess 这样的系统对于需要高吞吐量关系型数据库且设置更可定制的人来说具有吸引力。\n\nVitess 提供了以下好处：\n\n#### 可扩展性\n\n\
  你可以将单个模式向上或向下扩展。\n\n#### 可管理性\n\n集中的控制平面管理所有数据库相关操作。\n\n#### 保护\n\n你可以重写查询、构建查询拒绝列表，并添加表级访问控制列表（ACL）。\n\
  \n#### 分片管理\n\n你可以轻松创建和管理数据库分片。\n\n#### 性能\n\n许多内部组件都是为性能而构建的，包括客户端连接池和查询去重。\n\n\
  Vitess 帮助你管理关系型数据库的运维和扩展开销以及集群的健康状况。此外，Vitess 提供的可配置选项范围比传统的云数据库产品（包括 Cosmos DB）更广，这将帮助你满足扩展和复制需求。\n\
  \n### Vitess 架构\n\nVitess 通过创建中间件风格的系统同时仍使用 MySQL 存储数据来提供分片即服务。客户端应用程序连接到一个名为 VTGate\
  \ 的守护进程（见图 9-1）。VTGate 是一个集群感知路由器，它将查询路由到适当的 VTTablet 实例，这些实例管理每个 MySQL 实例。拓扑服务存储基础设施的拓扑结构，包括数据存储位置以及每个\
  \ VTTablet 实例提供数据的能力。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_315_0.png)\n\n\
  图 9-1. Vitess 架构\n\nVitess 还提供了两个管理界面：vtctl，一个 CLI；以及 vtctld，一个 Web 界面。\n\nVTGate\
  \ 是用于将客户端查询路由到数据库的查询路由器（或代理）。客户端无需了解任何其他信息，只需知道 VTGate 实例的位置即可，这意味着客户端到服务器的架构非常简单。\n\
  \n### 在 Kubernetes 上部署 Vitess\n\nVitess 对 Kubernetes 具有一流的支持，并且入门非常简单。在本演练中，我们将创建一个集群和一个模式，然后扩展集群。\n\
  \n- 首先，克隆 vitess 仓库并移动到 vitess/examples/operator 文件夹：\n```\n$ git clone git@github.com:vitessio/vitess.git\n\
  $ cd vitess/examples/operator\n```\n- 现在，通过运行以下命令安装 Kubernetes 操作器：\n```\n$ kubectl\
  \ apply -f operator.yaml\n```\n- 接下来，通过运行以下命令创建一个初始 Vitess 集群：\n```\n$ kubectl apply\
  \ -f 101_initial_cluster.yaml\n```\n- 你可以通过以下方式验证初始集群安装是否成功：\n```\n$ kubectl get\
  \ pods\nNAME                                 READY   STATUS    RESTARTS   AGE\n\
  example-etcd-faf13de3-1              1/1     Running   0          78s\nexample-etcd-faf13de3-2\
  \              1/1     Running   0          78s\nexample-etcd-faf13de3-3       \
  \       1/1     Running   0          78s\nexample-vttablet-zone1-2469782763-bfadd780\
  \  3/3     Running   1          78s\nexample-vttablet-zone1-2548885007-46a852d0\
  \  3/3     Running   1          78s\nexample-zone1-vtctld-1d4dcad0-59d8498459-kwz6b\
  \  1/1     Running   2          78s\nexample-zone1-vtgate-bc6cde92-6bd99c6888-vwcj5\
  \  1/1     Running   2          78s\nvitess-operator-8454d86687-4wfnc     1/1  \
  \   Running   0          2m29s\n```\n\n你现在有一个运行中的小型单区域 Vitess 集群，包含两个副本。\n\n你可以在\
  \ Vitess Kubernetes Operations 示例页面中找到更多数据库操作示例。\n\n你会遇到的更常见用例之一是需要添加或删除数据库副本。你可以通过运行以下命令轻松完成此操作：\n\
  ```\n$ kubectl edit planetscale.com example\n\n### 要添加或删除副本，请将适当资源的 replicas 字段更改为所需值。例如\n\
  \nkeyspaces:\n- name: commerce\n  turndownPolicy: Immediate\n  partitionings:\n\
  \  - equal:\n      parts: 1\n      shardTemplate:\n        databaseInitScriptSecret:\n\
  \          name: example-cluster-config\n          key: init_db.sql\n        replication:\n\
  \          enforceSemiSync: false\n      tabletPools:\n      - cell: zone1\n   \
  \     type: replica\n        replicas: 2 # 更改此值\n```\n\n> NOTE\n> \n> 构建分布式数据存储的一个考虑因素是确定你的故障域大小。Vitess\
  \ 建议你每个服务器最多存储 250 GB 数据。虽然有一些 MySQL 性能原因，但其他常规运维任务在分片大小/故障域更大时变得更加困难。你可以在 Vitess\
  \ 博客上阅读有关 Vitess 建议每个服务器 250 GB 的原因。\n\n### Rook 简介：Kubernetes 的存储编排器\n\n到目前为止，我们已经介绍了关系型\
  \ SQL 数据库存储和高性能服务，但云中还需要提供和操作的还有其他类型的存储。这些被称为 blob 文件系统。Blob\n\n存储非常适合存储图像、视频和其他不适合关系型数据库的文件。Blob\
  \ 存储在高效存储和复制大量数据方面带来了额外的挑战。\n\nRook 是一个云原生文件、块和对象开源存储编排器，提供软件定义的 blob 存储。Rook 于\
  \ 2018 年毕业成为 CNCF 项目，专门设计用于在 Kubernetes 上运行存储。类似于 Vitess，Rook 管理集群的许多日常操作，包括自扩展和自愈，并自动化其他任务，如灾难恢复、监控和升级。\n\
  \n### Rook 架构\n\nRook 是一个 Kubernetes 编排器，而不是实际的存储解决方案。Rook 支持以下存储系统：\n\n- Ceph，一个高度可扩展的分布式存储解决方案，用于块存储、对象存储和共享文件系统，具有多年的生产部署经验\n\
  - Cassandra，一个高可用的 NoSQL 数据库，具有闪电般的性能、可调一致性和大规模可扩展性\n- NFS，允许远程主机通过网络挂载文件系统并像本地挂载一样与之交互\n\
  \nRook 可以在 Kubernetes 集群上编排多个存储提供商。每个都有自己的操作器用于部署和管理资源。\n\n### 在 Kubernetes 上部署\
  \ Rook\n\n在本示例中，我们将使用 Rook（Cassandra）Kubernetes 操作器部署一个 Cassandra 集群。如果你通过 Rook\
  \ 部署 Ceph 集群，也可以使用 Helm chart 进行部署。\n\n- 克隆 Rook 操作器：\n```\n$ git clone --single-branch\
  \ --branch master\nhttps://github.com/rook/rook.git\n```\n- 安装操作器：\n```\n$ cd rook/cluster/examples/kubernetes/cassandra\n\
  $ kubectl apply -f operator.yaml\n```\n- 你可以通过运行以下命令验证操作器是否已安装：\n```\n$ kubectl\
  \ -n rook-cassandra-system get pod\n```\n- 现在，进入 cassandra 文件夹并创建集群：\n```\n$ cd\
  \ rook/cluster/examples/kubernetes/cassandra\n$ kubectl create -f cluster.yaml\n\
  ```\n- 要验证所有期望的节点是否正在运行，请发出以下命令：\n```\n$ kubectl -n rook-cassandra get pod -l app=rook-cassandra\n\
  ```\n\n使用 Kubernetes `kubectl edit` 命令非常容易地将 Cassandra 集群向上或向下扩展。你只需将 `Spec.Members`\
  \ 的值向上或向下更改即可相应地扩展集群：\n```\n$ kubectl edit clusters.cassandra.rook.io rook-cassandra\n\
  ### 要扩展机架，请将机架的 Spec.Members 字段更改为所需值。\n### 要缩小机架，请将机架的 Spec.Members 字段更改为所需值\n\
  ### 编辑并保存 yaml 后，检查集群的 Status 和 Events 以获取正在发生的事情的信息：\n\napiVersion: cassandra.rook.io/v1alpha1\n\
  ```\n\n\n\n\nkind: Cluster\nmetadata:\n  name: rook-cassandra\n  namespace: rook-cassandra\n\
  spec:\n  version: 3.11.6\n  repository: my-private-repo.io/cassandra\n  mode: cassandra\n\
  \  annotations:\n  datacenter:\n    name: us-east2\n    racks:\n      - name: us-east2\n\
  \        members: 3 # 将此数字上调或下调\n\n```\n$ kubectl -n rook-cassandra describe clusters.cassandra.rook.io\
  \ rook-cassandra\n```\n\n> **NOTE**\n> \n> 你可以在 Cassandra CRD 文档中找到有关 Cassandra\
  \ 可配置项的更多详细信息。\n\n同样，Ceph 和 NFS 集群也可以使用 Rook 操作符轻松部署。\n\n### TiKV 简介\n\nTiKV（Titanium\
  \ Key-Value）由 PingCAP Inc. 创建，是一款开源的分布式事务型键值存储。与许多键值和 NoSQL 系统不同，TiKV 提供了简单的（原始）API\
  \ 以及提供原子性、一致性、隔离性和持久性（ACID）合规的事务 API。\n\n### 为什么使用 TiKV？\n\nTiKV 提供了以下功能：\n\n- 地理复制\n\
  - 水平扩展\n- 一致的分布式事务\n- Coprocessor 支持\n- 自动分片\n\n由于其自动分片和地理复制功能，以及能够扩展到存储超过 100 TB\
  \ 数据的能力，TiKV 是一个有吸引力的选择。它还通过使用 Raft 协议进行复制提供了强大的共识保证。\n\n### TiKV 架构\n\n如前所述，TiKV\
  \ 具有可用于不同用例的两种 API：原始和事务。表 9-1 概述了这两种 API 之间的差异。\n\n### 表 9-1 TiKV API：原始与事务\n\n\
  |  | 原始 | 事务 |\n|---|---|---|\n| 描述 | 一个较低级别的键值 API，用于直接与单个键值对交互 | 一个较高级别的键值 API，提供\
  \ ACID 语义 |\n| 原子性 | 单个键 | 多个键 |\n| 使用时机... | 你的应用程序不需要分布式事务或多版本并发控制（MVCC） | 你的应用程序需要分布式事务和/或\
  \ MVCC |\n\nTiKV 在每个节点中使用 RocksDB 作为存储容器，并利用 Raft 组提供分布式事务，如图 9-2 所示。Placement Driver\
  \ 充当集群管理器，并确保所有分片都满足其复制约束，并且数据已在池上进行负载均衡。最后，客户端使用 Google 远程过程调用（gRPC）协议连接到 TiKV\
  \ 节点，该协议针对性能进行了优化。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_324_0.png)\n\n图 9-2.\
  \ TiKV 架构\n\n在 TiKV 节点内（如图 9-3 所示），RocksDB 提供底层存储机制，Raft 为事务提供共识。TiKV API 为客户端提供交互接口，而\
  \ coprocessor 处理类似 SQL 的查询并从底层存储中组装结果。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_324_1.png)\n\
  \n图 9-3. TiKV 实例架构\n\n### 在 Kubernetes 上部署 TiKV\n\nTiKV 可通过多种自动化方法部署，包括 Ansible、Docker\
  \ 和 Kubernetes。在以下示例中，我们将使用 Kubernetes 和 Helm 部署一个基本集群。\n\n- 安装 TiKV 自定义资源定义：\n\
  \  \n  ```\n  $ kubectl apply -f\n  https://raw.githubusercontent.com/tikv/tikv-operator/master/manifests/crd.v1beta1.yaml\n\
  \  ```\n- 我们需要探索 Helm 操作符。首先，添加 PingCap 仓库：\n  \n  ```\n  $ helm repo add pingcap\
  \ https://charts.pingcap.org/\n  ```\n- 现在为 tikv-operator 创建一个命名空间：\n  \n  ```\n\
  \  $ kubectl create ns tikv-operator\n  ```\n- 安装操作符：\n  \n  ```\n  $ helm install\
  \ --namespace tikv-operator tikv-operator\n  pingcap/tikv-operator --version v0.1.0\n\
  \  ```\n- 部署集群：\n  \n  ```\n  $ kubectl apply -f\n  https://raw.githubusercontent.com/tikv/tikv-operator/master/examples/basic/tikv-cluster.yaml\n\
  \  ```\n- 你可以通过运行以下命令检查部署状态：\n  \n  ```\n  $ kubectl wait --for=condition=Ready\
  \ --timeout 10m\n  tikvcluster/basic\n  ```\n  \n  这将创建一个单主机存储集群，存储空间为 1 GB，并包含一个\
  \ Placement Driver（PD）实例。\n\n你可以在集群定义中修改 `replicas` 和 `storage` 参数以匹配你的需求。我们建议你为冗余目的至少使用三个副本进行存储。例如，如果你运行\
  \ `kubectl edit tikv.org TikvCluster` 并将 `replicas` 修改为 4，`storage` 修改为 500Gi：\n\
  \n```\napiVersion: tikv.org/v1alpha1\nkind: TikvCluster\nmetadata:\n  name: basic\n\
  spec:\n  version: v4.0.0\n  pd:\n    baseImage: pingcap/pd\n    replicas: 4\n  \
  \  # if storageClassName is not set, the default Storage Class\n    of the Kubernetes\
  \ cluster will be used\n    # storageClassName: local-storage\n    requests:\n \
  \     storage: \"1Gi\"\n    config: {}\n  tikv:\n    baseImage: pingcap/tikv\n \
  \   replicas: 4\n    # if storageClassName is not set, the default Storage Class\n\
  \    of the Kubernetes cluster will be used\n    # storageClassName: local-storage\n\
  \    requests:\n      storage: \"500Gi\"\n    config: {}\n```\n\n你将获得四个副本的 500 GB\
  \ 存储分区。\n\n### 关于 etcd 的更多内容\n\n我们已在整本书中（隐秘地）使用了 etcd。在这里我们将花一些时间详细讨论它。\n\nEtcd\
  \ 是一个强一致性（Raft 共识）的分布式键值存储，旨在用于分布式系统。它设计为能够优雅地处理领导者选举以及网络中断和意外节点停机等故障。Etcd 具有简单的\
  \ API（图 9-4），因此你会发现我们在这本书中讨论的许多系统（例如 Kubernetes、TiKV、Calico 和 Istio）在幕后利用了它。\n\n\
  通常，etcd 用于以键值格式存储配置值、功能标志和服务发现信息。Etcd 允许客户端监视这些项目以获取更改，并在它们更改时重新配置自身。Etcd 也适用于领导者选举和锁定用途。Etcd\
  \ 在 Kubernetes 中用作服务发现后端，也用于 Rook 中的编排。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_327_0.png)\n\
  \n图 9-4. Etcd 运行架构\n\n如果你利用 etcd 作为核心基础设施，你很快就会理解这个基础设施可靠运行有多重要。由于 etcd 集群是基础设施的关键部分，我们建议以下措施以确保\
  \ Azure 中 etcd 集群的稳定。\n\n### 硬件平台\n\n一致的键值存储性能在很大程度上依赖于底层硬件的性能。性能不佳的一致键值集群会严重影响分布式系统的性能。etcd\
  \ 也是如此。如果你每秒进行数百次事务，你应该为虚拟机使用托管固态硬盘（SSD）（我们推荐高级或超高速 SSD）以防止性能下降。你至少需要四个核心来运行 etcd，并且吞吐量会随着\
  \ CPU 核心数量的增加而扩展。你可以在通用硬件页面和 AWS 指南上找到有关容量规划和云硬件配置的更多信息（etcd 目前未发布 Azure 专用指南）。\n\
  \n我们建议在以下 Azure SKU 上运行 etcd：\n\n- Standard_D8ds_v4（八核 CPU）\n- Standard_D16ds_v4（16\
  \ 核 CPU）\n\n这些 SKU 明确允许你附加高级或超高速 SSD，这将提高集群的性能。\n\n> **NOTE**\n> 与我们在这本书中讨论的任何生产用例一样，我们强烈建议你在所有\
  \ Azure 计算实例上启用加速网络。\n\n### 自动扩展和自动修复\n\n如果我们不讨论自动扩展和自动修复如何与 etcd 配合使用，那就说不过去了。自动扩展不建议用于\
  \ etcd，因为如果容量增加或减少对集群性能产生不利影响，可能会产生意想不到的后果。也就是说，启用对损坏的 etcd 实例的自动修复（自动恢复）被认为是可以的。你可以通过在\
  \ Kubernetes 集群上运行以下命令来禁用 etcd 的自动扩展：\n\n```\n$ kubectl delete hpa etcd\n```\n\n\
  这将禁用水平 Pod 自动扩缩器（HPA），它用于在 Kubernetes 中自动将集群扩展或缩减。你可以在 Kubernetes 文档中找到有关 HPA 的更多信息。\n\
  \n\n\n\n\n### AZURE 自动扩缩容\n\nAzure 在其众多产品中提供自动扩缩容功能，包括虚拟机规模集和 Azure Functions。自动扩缩容功能允许你在适当时高效地将资源向上和向下扩展。使用虚拟机规模集时，扩展时新虚拟机可用可能存在长达\
  \ 10 分钟的延迟。\n\n### 可用性和安全性\n\nEtcd 是一个控制平面服务，因此它必须具有高可用性，并且与其通信必须安全。我们建议你在集群中运行至少三个\
  \ etcd 节点以确保集群的可用性。\n集群吞吐量将取决于存储性能。我们强烈建议不要对集群节点使用静态发现机制，而是按照 etcd 集群指南使用 DNS SRV\
  \ 记录。\n\n### Etcd TLS\n\nEtcd 支持客户端到服务器和对等（服务器到服务器）传输层安全（TLS）加密。我们强烈建议你启用此功能，因为\
  \ etcd 是一个控制平面系统。这里我们不会详细介绍实现细节（因为它们高度依赖于你的基础设施）。你可以在 etcd 安全文档中找到配置选项。\n\n### 基于角色的访问控制\n\
  \n自 etcd v2.1 起，基于角色的访问控制（RBAC）已成为 etcd API 的一项功能。使用 RBAC，你可以创建仅允许特定用户（或应用程序）访问\
  \ etcd 数据子集的访问模式。\n传统上，这是通过在向 etcd 发出 HTTP 请求时提供 HTTP 基本身份验证来实现的。自 etcd v3.2 起，如果你使用\
  \ `--client-cert-auth=true` 配置选项，客户端 TLS 证书的通用名称（CN）将被用作用户（而不是用户名/密码组合）。\n\n你可以在文档中找到如何将\
  \ RBAC 应用于你的 etcd 数据空间的示例。\n\n### 总结\n\n尽管存在常见的误解，但在 Azure 中原生运行大规模数据系统是可行的。在本章中，我们回顾了在\
  \ Azure 云中使用云原生数据系统的优势。我们介绍了四种系统：Vitess（关系型）、Rook（blob）、TiKV（键值）和 etcd（键值配置/服务发现）。这些系统是云原生架构的基石，用于存储和提供在线数据，并相比使用\
  \ PaaS 组件具有很大的优势。到现在为止，你应该了解哪些软件适合你自行管理，以及使用哪些 PaaS 服务以及如何在你的基础设施中部署它们。\n\n云，特别是\
  \ Kubernetes，已经成为运行有状态基础设施的更友好之地。虽然 Azure Gen2 存储账户是 blob 存储的绝佳资源，但云原生软件可以帮助你构建持久化的大规模有状态基础设施。\n\
  \n现在你了解了如何在云环境中存储和提供数据，让我们来看看如何使用实时消息传递在系统之间移动数据。\n"
- "# 第 10 章 获取消息\n\n## 早期发布读者的说明\n\n使用 Early Release 电子书，你可以在这些书籍正式发布之前很久就利用这些技术——作者在撰写时提供的原始未编辑内容。\n\
  \n这将是最终书籍的第 10 章。请注意，GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果在本章中发现缺失的材料，请联系编辑\
  \ rfernando@oreilly.com。\n\n在本章中，我们将讨论消息传递在云原生架构中的好处，并提供消息传递模式的简要历史，以便你了解其起源以及进程间通信向云原生分布式系统的演变。\n\
  \n到本章结束时，你将能够部署当今云原生应用程序和微服务中最常用的消息传递实现。我们将比较 RabbitMQ 和 Kafka 等成熟消息传递解决方案的功能，这些解决方案已在生产环境中使用多年，并且我们将在\
  \ NATS 中实现常见的消息传递模式。鉴于本书关注 Azure，你将能够使用 Terraform 管理 Azure 消息传递服务。我们还将提供 Python\
  \ 中的少量代码示例，展示生产和消费消息以及验证 Azure 和 NATS 消息传递基础设施的正确部署是多么容易。\n\n## 消息传递的需求\n\n应用程序和系统组件在接近实时传递消息和交换数据的需求并非云所独有，也不是容器化微服务或甚至网络化客户端/服务器应用程序的新需求。任何在\
  \ shell 提示符下管道化命令的人都使用过进程间通信，这是一种基本的消息传递形式。\n\n即使是最原始的操作系统也提供传递消息和共享数据的能力。这个问题空间（以及各种解决方案）可以追溯到\
  \ 1970 年代，并在 2000 年代继续演变，尤其是在金融服务行业，需要将股票信息传达给客户、在服务提供商和其他机构之间交换数据以及处理订单。与我们在互联网或企业应用程序中最常见的客户端/服务器交互不同，消息传递依赖于一个中间人（称为代理）在发送方和接收方之间，通常不遵循请求-响应范式，从而使通信变为异步。我们稍后会讨论为什么这很重要。\n\
  \n随着云在 2010 年代成熟，使用消息传递托管服务，例如 Amazon SQS 和在虚拟机上运行的 RabbitMQ 服务器，在提高网站的可靠性和可扩展性方面发挥了作用。到\
  \ 2010 年代中期，Kafka 成为消息传递用例的流行解决方案，包括日志聚合、点击流分析和数据管道。NATS 是另一种轻量级和高性能的消息传递实现，因其能够扩展到更小占地面积的设备以及易于操作性而在边缘分析和物联网（IoT）用例中变得流行。\n\
  \n队列和消息发布/订阅（亲切地称为“pub/sub”）模式是云提供商提供的早期托管服务之一，Azure 拥有多个消息传递服务，包括 Azure Event Grid、Azure\
  \ Event Hubs 和 Azure Service Bus，它们提供标准化的协议和实现，与 Java、.NET、Python 和其他 SDK 兼容。这些服务允许迁移现有工作负载和/或开发新的云原生应用程序。\n\
  \n在我们深入探讨消息传递的历史之前，以下是为什么以及何时需要在你的基础设施内实现消息传递或供应用程序使用：\n\n## 提高性能和吞吐量\n\n使用消息传递模式（无论是简单的队列还是更复杂的发布/订阅模式）允许工作负载的水平扩展和并行化。基于负载扩展生产者、消费者和代理是可能的，通过虚拟机自动扩缩容方法（如\
  \ Azure 虚拟机规模集）、通过 Kubernetes 或由云服务实现。\n\n## 提高弹性\n\n能够拥有多个发送方（生产者）和接收方（消费者）交换消息提供了更好的弹性。此外，消息可以累积在队列中（发送方继续发送），而你的消费者未处理时可确保消息不会丢失，并且你可以对工作进程进行维护。根据排队模式，系统可以承受组件之间的连接故障以及生产者或消费者中的应用程序故障。\n\
  \n## 确保异步操作\n\n尽管可怕的 Apache 和 Nginx 上的 502 网关超时错误今天发生的频率较低，但当我们看到它们时，我们会想起早期网站在大量请求压倒\
  \ Web 服务器响应能力时遇到的可扩展性问题。同样，当数据库客户端连接到后端数据库且数据库耗尽线程或耗尽时，同样原则适用。当工作进程根据队列深度自动扩缩容时，结果是响应需求的高消息处理速率。消息队列还能够实现更小范围的服务边界，并且在微服务应用程序架构中很常见。最后，因为应用程序不是直接通信（像\
  \ RPC 或甚至 REST API 的情况），它们可以专注于正在交换的数据，假设它们正在实现标准消息传递协议。\n\n## 一个示例消息传递用例：日志摄取和分析\n\
  \n为了说明引入消息队列到架构中的一些实际改进，我们将描述一个我们可以构建和运行的日志分析软件即服务（SaaS）解决方案。日志和事件处理是实现消息传递和流服务的常见用例。\n\
  \n该产品将从本地设备收集系统和安全日志，并将其解析并摄取到全文搜索引擎中，允许安全分析师检测和查找其网络上的攻击。我们极大地简化了该平台的描述，但以下示例展示了我们之前列出的引入消息队列的好处。\n\
  \n让我们回顾该产品架构的三个世代，并探讨消息传递的使用如何演变。\n\n## 第一代：没有队列\n\n解决方案的第一代是从本地设备实时收集事件并发布到负载均衡器，该负载均衡器将日志分发给多个摄取和搜索节点（日志收集器），如图\
  \ 10-1 所示。这是一个紧密耦合的架构，其中大量收集的事件（基于客户使用模式）可能导致摄取变慢，进而可能导致搜索 UI 出现挑战。\n\n\n\n\n\n\
  ![](img/8d47d1b5dbca55e784ae602145a894c7_333_0.png)\n\n图 10-1. 第一代，无队列\n\n## 第二代：使用云队列和对象存储\n\
  \n该解决方案的第二次迭代使用云提供商的对象存储和消息队列来摄取消息捆绑包，而不是直接发送到摄取 API。在每个索引/搜索节点上，都有一个轻量级的工作进程从队列中拉取消息。工作进程包含对象存储中日志捆绑包的路径，如图\
  \ 10-2 所示。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_333_1.png)\n\n图 10-2. 第二代，使用云队列和对象存储\n\
  \n这两种解决方案都具有单体应用程序架构，该架构在平台的第三代中得到解决。该代还将解析逻辑移至云端，并降低了本地客户团队的运营开销。\n\n## 第三代：基于内存的\
  \ Pub/Sub 队列\n\n平台的第三代实现了微服务架构和高性能基于内存的队列，允许各个服务处理消息以使用文档数据库而不是之前的基于 RDBMS 的搜索引擎提供高级分析。这分离了故障和性能域，并允许系统水平扩展，如图\
  \ 10-3 所示。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_334_0.png)\n\n图 10-3. 第三代，使用微服务架构和水平扩展的队列\n\
  \n采用消息系统可以帮助扩展产品的重要组成部分之一。在前面的示例中，消息系统用于扩展事件处理。然而，消息系统可用于其他用途，例如传输分析、日志或任何其他格式的数据，这些数据不必实时处理。\n\
  \n## 消息平台的基础\n\n软件组件的需求，无论是客户端/服务器应用程序还是在单台计算机上运行的单个程序，都早于云甚至互联网。除了最原始的通用和嵌入式操作系统外，所有操作系统都提供程序向其他程序发送和接收数据的功能。\n\
  \n## 消息与流式\n\nCloud Native Computing Foundation（CNCF）景观，图 10-4 所示，将消息类别命名为 Streaming\
  \ & Messaging，但在本章中我们将主要关注消息。Kafka、NATS 和 RabbitMQ 提供了流式功能，但与 Spark 和 Flink 等流式分析平台不同，它们默认未启用，也不是这些消息平台的初始用例。我们将在下一节详细讨论消息概念，但在这一点上需要注意，流式系统的关键考虑因素是操作发生在多个消息上，通常在内存操作中具有时间或有序事件窗口，用于聚合或过滤。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_335_0.png)\n\n图 10-4. CNCF 流式与消息景观\n\n\
  ## 消息基础\n\n了解当代消息解决方案之间的相似性和差异可以帮助您确定哪种工具最适合工作或手头的问题。正如我们在整本书中所看到的，构建某物的方法总不止一种，而且在工具的广告功能经过测试并在您的特定基础设施和用例中得到验证之前，选择正确的路径并不总是容易的。在我们探讨\
  \ RabbitMQ、Apache Kafka 和 NATS 如何融入云原生基础设施和应用程序之前，我们必须了解消息、队列和流式系统中的基本概念和常见功能。\n\
  \n### 生产者和消费者\n\n正如你与另一个人交流时一样，消息始终有一个发送者和接收者，但消息可能并非直接发送，你也可能不会得到回复。当你发送电子邮件时，有多个中间方，见图\
  \ 10-5。这些方包括你的电子邮件客户端、你的电子邮件提供商的服务器，消息传输代理 [MTA]，它们扮演代理角色，接收者的服务器，另一个 MTA，以及接收电子邮件客户端。在此示例中，有多个消费者和生产者；电子邮件客户端将消息排队以发送/生产到\
  \ ISP 的邮件服务器，然后 MTA 将已发送的消息排队并发送/生产到接收者的 MTA。接收者的电子邮件客户端将从其 ISP 的 MTA 接收/消费消息。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_335_1.png)\n\n图 10-5. SMTP 邮件协议，队列系统的示例\n\
  \n正如在网络中存在单播、多播和广播交付模式一样，在消息传递中可能存在单个消费者处理单个生产者的数据或多个消费者，类似于电子邮件的情况。消息可能由消费者推送或拉取，具体取决于平台和配置。\n\
  \n### 代理和集群\n\n在我们之前的电子邮件示例中，中间组件 MTA 在发送者和接收者之间充当代理。在许多情况下，MTA 软件可以集群化。集群中的一个或多个代理允许发送者和接收者彼此解耦。本章讨论的消息实现\
  \ RabbitMQ、Kafka 和 NATS 至少需要一个代理，并且遵循大多数分布式系统协议的原则，它们通常需要最少三个代理，并且通常应为奇数计数，以实现一致性算法。集群的考虑因素包括状态复制、领导者选举、节点成员行为以及网络故障时的集群分区，令人\
  \ dread 的脑裂问题。\n\n集群的其他考虑因素，可能会迅速成为瓶颈，是如何在不中断服务的情况下进行扩展。维护高吞吐量和低延迟消息集群的运营开销是团队选择云提供商管理基础设施的原因，以便开发人员可以专注于开发和优化生产者和消费者应用程序。\n\
  \n### 持久性和耐久性\n\n任何曾经向不存在的地址发送电子邮件的人都会收到邮件服务器的错误消息，指出在一定时间后消息已过期。暗示你的消息在离开你的邮件客户端后存储在外部系统上。\n\
  \n根据消息用例和存储和处理的数据类型，它可能具有更高的或更低的关键性，具有更高的或更低的易腐性，并且每条消息或事务是否必须在处理前存储更为关键。就像传输控制协议\
  \ TCP 和用户数据报协议 UDP 客户端/服务器应用程序一样，在构建生产系统时，应用程序层与底层传输层实现的错误处理和重试逻辑的数量是需要考虑的重要因素。消息系统以不同的方式将智能分配给生产者、消费者和代理。\n\
  \n此外，用于存储消息的机制因系统而异。一些系统具有纯内存存储，这使它们在云环境中耐久性较差，而其他系统具有磁盘支持的解决方案，虽然在云环境中存在挑战，但提供了更耐用和可靠的体验。\n\
  \n### 消息传递\n\n除了源和目的地之外，您还应该了解消息导向平台的三种重要模式，我们将在本章中介绍：\n\n- *至少一次*\n意味着可能存在重复；特别是如果消费者崩溃并且未通知代理已接收消息，或者消息可能被传递给多个消费者\n\
  \n- *至多一次*\n假设消息可能已发送但未被消费者实际接收或确认，将重传的负担放在客户端上\n\n- *恰好一次*\n在需要事务且消息必须恰好传递一次的非常有限的情况下\n\
  \n消息架构可能支持其中一种或多种模式。这些也可以在代理本身或消费者和生产者客户端库中配置。\n\n## 安全\n\n\n\n\n消息主题中包含的数据敏感性可能各不相同，因此需要对谁可以向这些主题生产和消费具有灵活的控制。消息系统应验证生产者和消费者的身份，然后对主题应用读写权限。此外，系统保留的数据应静态加密。\n\
  \n现在你已经了解了消息传递的一些基本原理，让我们来看一些你可能会遇到的常见消息传递模式。\n\n## 常见消息传递模式\n\n我们将介绍在现代基础设施中常见的三种消息传递架构。\n\
  \n### 简单队列\n\n生产者（P）发布到队列（B），随着消费者（C）从队列中读取，消息会被删除且不会有其他消费者处理该消息。\n\n### 发布和订阅\n\
  \n如图 10-6 所示，生产者（P）发送消息，所有监听（订阅）的消费者（C）都会收到消息。可能有也可能没有确认，但如果消费者不在线，他们将错过消息。\n\n\
  ![](img/8d47d1b5dbca55e784ae602145a894c7_337_0.png)\n\n图 10-6. 一个简单的 pub/sub 消息系统\n\
  \n### 持久队列\n\n如 10-7 图所示，生产者（P）将消息发送到代理（B），（C）独立消费基于指针的有序列表中的消息进行处理，但可以回退到列表中的已知点，例如给定窗口内的第一条消息。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_337_1.png)\n\n图 10-7. 一个持久的有序消息队列\n\n\
  到目前为止，我们已经涵盖了大量关于消息传递基础和架构的理论。我们现在将深入探讨各种云原生消息传递平台。\n\n## 主流云原生消息传递平台概述\n\n在本节中，我们将回顾一些在现代基础设施中已成为常见做法的主流云原生消息传递平台。\n\
  \n### RabbitMQ\n\n尽管 RabbitMQ 已有 15 多年历史，显然早于云和微服务的广泛公有云采用，但它是一个经过验证的消息系统，曾为关键工作负载提供支持，并在容器和\
  \ Kubernetes 集群的世界中持续保持相关性。其原因之一是 RabbitMQ 是用 Erlang/OTP 开发的，Erlang/OTP 是一种为可扩展性、并发性和可靠性而设计的函数式编程语言，因此非常适合构建每天处理数百万到数亿条消息且停机时间极低的分布式系统。\n\
  \n### Apache Kafka\n\n2010 年，LinkedIn 的工程师发现 RabbitMQ 无法扩展到其生态系统的复杂性和规模。Kafka 被创建以使消息传递成为\
  \ LinkedIn 技术栈的核心，并已成功扩展到全站每天数万亿条消息。\n\n本章后面我们将讨论 Azure Event Hubs，这是一项与 Apache\
  \ Kafka 兼容的服务，允许应用程序只需更新消费者/生产者连接字符串，但可能无法提供 Kafka 的所有功能。托管 Kafka 也是 HDInsight 的一部分，HDInsight\
  \ 是 Azure 云上的一个广泛的分析服务套件。HDInsight 超出了本书的范围。\n\n### CNCF CloudEvents\n\nCloudEvents\
  \ 最早于 2017 年在 CNCF Serverless 工作组中启动。用 CNCF 自己的话说：“CloudEvents 是用于以通用格式描述事件数据的规范，以提供跨服务、平台和系统的互操作性。”\
  \ 虽然该项目具有很大的潜力（并且得到 Azure Event Grids 的支持），但我们不会在本書中进一步详细介绍。\n\n### 使用 NATS 进行云消息传递深度解析\n\
  \nNATS 是另一个已被 CNCF 接受的开源消息传递实现。NATS 于 2011 年首次发布，最初以 Ruby 实现，作为 Cloud Foundry 的消息传递和服务发现层。后来改用\
  \ Golang 重写，目前处于非常活跃的开发中。虽然不如 RabbitMQ 或 Kafka 流行，但 NATS 由于其可在多个操作系统、处理器架构上运行的单二进制服务器以及官方\
  \ Docker 仓库，提供多种易于部署的选项。所有流行编程语言的客户端库均可用。简单性、可操作性、性能和安全性被认为是 NATS 相对于其他消息传递实现的优势，也是能够轻松使用最小功能集并偏好“至多一次”传递的能力。\n\
  \n由于基础 pub/sub 协议未实现消息持久化，消费者必须处于活动状态才能接收消息，这使得 NATS 非常适合交换高度易腐的数据，以及频繁更新的数据，例如传感器数据。默认情况下，消息将被路由到订阅该主题的所有监听订阅者，类似于多播网络。\n\
  \n由于其内存占用低且性能极高，NATS 也非常适合边缘和物联网分析用例。对于这样一个轻量级且专注于简单性的消息传递实现，NATS 具有相对复杂的身份验证和授权功能，并且默认通过账户支持多租户。NATS\
  \ Streams 和 NATS JetStream 支持内存和磁盘持久化。NATS pub/sub 和流式传输从一开始就支持高可用性和水平扩展，而 JetStream\
  \ 自 2021 年初以来一直在实现它们。\n\n## NATS 协议架构\n\n与 RabbitMQ 一样，NATS 提供多种消息传递模式，其功能已从最初的\
  \ pub/sub 实现不断发展，到 NATS 流式传输（如图 10-8 所示），再到其最新的存储子系统 JetStream。JetStream 于 2020\
  \ 年发布，现已在 NATS 2.2.x 中可用。NATS 现在还包括原生的 MQTT 协议支持。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_339_0.png)\n\
  \n图 10-8. 基本 NATS 架构\n\n由于基础架构是发布/订阅，NATS 生产者称为发布者，其消费者称为订阅者。NATS JetStream 使用内部消费者抽象。\n\
  \n使用 NATS CLI 在发布者和订阅者之间进行的最简单的交换是了解协议有多简单的最佳方式。\n\n让我们看一个例子。在以下代码中，生产者使用主题 dog.food\
  \ 发送消息 \"arf\"：\n\n```\n$ echo \"arf\" | nats pub dog.food\n16:10:43 Reading payload\
  \ from STDIN\n16:10:43 Published 4 bytes to \"dog.food\"\n```\n\n在以下代码中，消费者订阅服务以接收所有以\
  \ dog. 开头的消息：\n\n```\n$ nats sub dog.*\n16:09:49 Subscribing on dog.*\n[#1] Received\
  \ on \"dog.food\"\n```\n\n## 集群多个 NATS 服务器\n\nNATS 允许将多个服务器集群在一起以提供高可用性和负载均衡。\n\n\
  最简单的集群可以通过以下方式启动：\n\n- 使用 -cluster 参数在启动服务器时配置集群 URL\n- 在额外的服务器节点中指定路由\n\n假设我们在\
  \ 192.168.2.238 和 192.168.2.247 上有两个不同的 Linux 服务器，我们可以使用以下命令配置一个集群：\n\n```\nnats-server\
  \ -DV -cluster nats://192.168.2.238:4248\nnats-server -DV -cluster nats://192.168.2.247:4248\
  \ -routes nats://192.168.2.238:4248\n```\n\n## 使用 Docker NATS 服务器\n\n除了 RPM 和 deb\
  \ 之外，Synadia 还分发和维护 Docker 镜像，这可能是运行 NATS 服务器的最简单方式，如示例 10-1 所示。\n\n示例 10-1. 使用\
  \ Docker 运行 NATS\n\n```\n$ docker run -p 4222:4222 -p 8222:8222 -v ~/tmp/jetstream:/tmp/jetstream\
  \ nats -js -m 8222\n[1] 2021/06/26 21:23:21.572029 [INF] Starting nats-server\n\
  [1] 2021/06/26 21:23:21.572258 [INF] Version: 2.3.0\n[1] 2021/06/26 21:23:21.572289\
  \ [INF] Git: [56a144a]\n[1] 2021/06/26 21:23:21.572311 [INF] Name: NDT... \n[1]\
  \ 2021/06/26 21:23:21.572378 [INF] Node: N3Qm3ud7\n[1] 2021/06/26 21:23:21.572399\
  \ [INF] ID: NDT... \n[1] 2021/06/26 21:23:21.574923 [INF] Starting JetStream\n[1]\
  \ 2021/06/26 21:23:21.576592 [INF] \n[1] 2021/06/26 21:23:21.576622 [INF] JETSTREAM\n\
  [1] 2021/06/26 21:23:21.576631 [INF] \n[1] 2021/06/26 21:23:21.576639 [INF] \n[1]\
  \ 2021/06/26 21:23:21.576647 [INF] \n[1] 2021/06/26 21:23:21.576656 [INF] https://docs.nats.io/jetstream\n\
  [1] 2021/06/26 21:23:21.576664 [INF] ---------------- JETSTREAM ----------------\n\
  [1] 2021/06/26 21:23:21.576697 [INF] Max Memory: 2.06 GB\n[1] 2021/06/26 21:23:21.576711\
  \ [INF] Max Storage: 4.64 GB\n[1] 2021/06/26 21:23:21.576779 [INF] Store Directory:\
  \ \"/tmp/nats/jetstream\"\n[1] 2021/06/26 21:23:21.576800 [INF] --------------------------------------------\n\
  [1] 2021/06/26 21:23:21.579799 [INF] Starting http monitor on 0.0.0.0:8222\n[1]\
  \ 2021/06/26 21:23:21.580581 [INF] Listening for client connections on 0.0.0.0:4222\n\
  [1] 2021/06/26 21:23:21.581147 [INF] Server is ready\n```\n\n我们可以传递完整的命令行参数。在这种情况下，我们指定将\
  \ ~/tmp 目录中的卷挂载以用于 JetStream 持久化。\n\n## 监控 NATS 服务器\n\nNATS 暴露了一个监控端点，可以通过浏览器、命令行或网络浏览器查看，如图\
  \ 10-9 所示。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_340_0.png)\n\n图 10-9. NATS\
  \ 监控端点\n\n以下是 NATS 监控端点输出的示例：\n\n```\n$ curl http://100.119.182.45:8222/varz\n{\n\
  \  \"server_id\": \"ND6FZROVHED32BDLBTMCPXEN4L1KB2ROR3HO3GZ6DLDB64Z54SLG5GOD\",\n\
  \  \"server_name\": \"ND6FZROVHED32BDLBTMCPXEN4L1KB2ROR3HO3GZ6DLDB64Z54SLG5GOD\"\
  ,\n  \"version\": \"2.2.2\",\n  \"proto\": 1,\n```\n\n\n\n\n\n```\n\"git_commit\"\
  : \"a5f3aab\",\n\"go\": \"go1.16.3\",\n\"host\": \"0.0.0.0\",\n\"port\": 4222,\n\
  \"connect_urls\": [\n\"192.168.2.247:4222\",\n\"192.168.122.1:4222\",\n\"172.17.0.1:4222\"\
  ,\n\"100.119.182.45:4222\",\n\"[fd7a:115c:ale0:ab12:4843:cd96:6277:b62d]:4222\"\
  ,\n\"192.168.122.1:4222\",\n\"172.17.0.1:4222\",\n\"100.119.135.53:4222\",\n\"[fd7a:115c:ale0:ab12:4843:cd96:6277:8735]:4222\"\
  ,\n\"192.168.2.238:4222\"\n],\n\"max_connections\": 65536,\n\"ping_interval\": 120000000000,\n\
  \"ping_max\": 2,\n\"http_host\": \"0.0.0.0\",\n\"http_port\": 8222,\n\"http_base_path\"\
  : \"\",\n\"https_port\": 0,\n\"auth_timeout\": 2,\n\"max_control_line\": 4096,\n\

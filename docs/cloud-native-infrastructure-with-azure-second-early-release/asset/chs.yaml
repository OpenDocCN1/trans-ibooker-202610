  \ collector=loadavg\nlevel=info ts=2020-12-01T13:20:29.511Z\ncaller=node_exporter.go:112\
  \ collector=meminfo\nlevel=info ts=2020-12-01T13:20:29.511Z\ncaller=node_exporter.go:112\
  \ collector=netdev\nlevel=info ts=2020-12-01T13:20:29.511Z\ncaller=node_exporter.go:112\
  \ collector=textfile\nlevel=info ts=2020-12-01T13:20:29.511Z\ncaller=node_exporter.go:112\
  \ collector=time\nlevel=info ts=2020-12-01T13:20:29.511Z\ncaller=node_exporter.go:112\
  \ collector=uname\nlevel=info ts=2020-12-01T13:20:29.511Z\ncaller=node_exporter.go:191\
  \ msg=\"Listening on\" address=:9100\nlevel=info ts=2020-12-01T13:20:29.511Z caller=tls_config.go:170\n\

  \    },\n    \"createdAt\": \"2021-04-14T02:24:28.260000+00:00\",\n    \"deadLetteringOnMessageExpiration\"\
  : false,\n    \"defaultMessageTimeToLive\": \"10675199 days, 2:48:05.477581\",\n\
  \    \"duplicateDetectionHistoryTimeWindow\": \"0:10:00\",\n    \"enableBatchedOperations\"\
  : true,\n    \"enableExpress\": false,\n    \"enablePartitioning\": true,\n    \"\
  forwardDeadLetteredMessagesTo\": null,\n    \"forwardTo\": null,\n    \"id\": \"\
  /subscriptions/1bf91ee3-5b21-4996-bd72-ae38e8f26ce9/resourceGroups/terraform-servicebus/providers/Microsoft.ServiceBus/namespaces/mdfranz-servicebus-namespace/queues/mdfranz-servicebus-queue\"\
  ,\n    \"location\": \"Central US\",\n    \"lockDuration\": \"0:01:00\",\n    \"\
  maxDeliveryCount\": 10,\n    \"maxSizeInMegabytes\": 81920,\n    \"messageCount\"\

  \ Kubernetes 集群。\n\n现在你已经知道如何以困难的方式（半自动化）做到这一点，让我们来看看在 Azure 中运行生产 Kubernetes 集群的首选、无缝的方式。\n\
  \n### Azure Kubernetes Service\n\n如你所见，管理和维护 Kubernetes 集群的过程很复杂。从运营角度来看，它不仅仅是运行集群；还涉及安全性、性能、日志记录、升级集群、应用补丁等等。为了减少这种繁琐工作，Azure\
  \ 提供了名为 *Azure Kubernetes Service* 或 *AKS* 的托管解决方案。\n\nAKS 使在 Azure 中部署和管理 Kubernetes\
  \ 集群变得轻而易举。Azure 托管的 Kubernetes 解决方案消除了大量 Kubernetes 管理流程，你只需管理自己的应用程序即可。AKS 具有以下优势，包括：\n\
  \n- 集群的健康监控完全由 Azure 管理。\n- 底层节点的维护任务由 Azure 负责。\n- 控制平面由 Azure 管理和维护，而你作为用户只需管理代理节点。\n\
  - AKS 让你能够集成 Azure Active Directory 和 Kubernetes RBAC API 以实现安全和访问控制。\n- 应用程序和集群的所有日志都存储在\
  \ Azure Log Analytics 工作区中。\n- 相对于从头开始设置 Kubernetes 集群并处理底层资源权限，水平 Pod 自动扩缩器（HPA）和集群自动扩缩器使用起来非常顺畅。\n\
  - AKS 对存储卷提供无缝支持。\n\n现在你了解了 AKS 的优势，让我们创建一个 AKS 集群。有两种简单的方法可以做到这一点：使用 Azure 门户（手动方法）或使用\
  \ Terraform（自动化方法）。\n\n你可以通过 Azure 控制台导航并点击添加按钮（图 5-2）然后按照出现的说明开始部署 AKS 集群。\n\n\
  ![](img/8d47d1b5dbca55e784ae602145a894c7_164_0.png)\n\n图 5-2. 点击添加按钮创建 AKS 集群\n\n\
  或者，在 Terraform 中，你可以进入仓库 /cloud_native_azure/Chapter5/AKS 的 AKS 目录并执行以下命令：\n\n```\n\
  $ terraform apply\n```\n\n\n\n\n点击 Apply，几分钟后你应该就能拥有一个运行中的三节点 Kubernetes 集群（图 5-3）。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_165_0.png)\n\n图 5-3. 通过 Terraform 创建的\
  \ AKS 集群\n\n要下载 kubeconfig 文件，你可以使用本地系统的 Azure CLI 命令来获取托管 Kubernetes 集群的访问凭据，如下所示：\n\
  \n```\naz aks get-credentials --resource-group azure-k8stest --name akstest --file\
  \ config\n```\n\n你的 kubeconfig 将以 config 的名称下载；将其移动到 .kube 文件夹。现在你就可以像使用那种“硬核”方式创建的集群一样使用此集群：\n\
  \n```\n$ ~ kubectl get nodes\nNAME                              STATUS   ROLES \
  \   AGE   VERSION\naks-agentpool-42554519-vmss000000 Ready    agent    29m   v1.17.9\n\
  aks-agentpool-42554519-vmss000001 Ready    agent    29m   v1.17.9\naks-agentpool-42554519-vmss000002\
  \ Ready    agent    29m   v1.17.9\n```\n\n虽然此时你几乎可以创建任何资源并部署应用程序，但显然这不是一个生产级集群。网上有大量资源¹可以指导你创建生产级集群。\n\
  \n有了这些知识，我们就可以继续学习 Helm，Helm 主要作为一种工具来简化 Kubernetes 应用程序的安装和管理。\n\n### 使用 Helm 部署应用程序和服务：Kubernetes\
  \ 的包管理器\n\n到目前为止，你可能已经很清楚，对于 Kubernetes 来说，有太多事情需要处理。即使你可以使用 Microsoft AKS 这样的托管服务，随着需求的扩展，维护部署和\
  \ ReplicaSets 也很困难。\n\nHelm 是 Kubernetes 的包管理器，允许你获取、部署和管理应用程序。基本上，Helm 处理了维护包含\
  \ Pod、ReplicaSets、Services、RBAC 设置等信息的冗长 YAML 文件的痛苦。Helm 还提供回滚、发布历史信息和集成测试钩子，这使得在\
  \ Kubernetes 集群上管理应用程序的完整生命周期变得非常容易。\n\n在本书中，我们使用的是 Helm 的稳定版本 v3.3.1。旧版本（即 v2）曾经使用部署在\
  \ Kubernetes 集群上的服务器端组件 Tiller。Tiller 由于用户权限更宽泛和管理开销而存在潜在的安全风险，这最初导致 Helm 在用户社区中采用率较低。随着\
  \ RBAC API 的引入，Helm 现在仅包含客户端二进制文件，Tiller 已被完全移除。图 5-4 描述了 Helm 包管理器的基本工作原理。\n\n\
  ![](img/8d47d1b5dbca55e784ae602145a894c7_166_0.png)\n\n图 5-4. Helm chart 仓库和客户端交互\n\
  \n### Helm 基础\n\nHelm 客户端作为命令行实用程序安装给终端用户使用。客户端的主要职责是协助图表开发并管理仓库和发布。Helm 由以下组件组成：\n\
  \n#### Chart\n\nCharts 是 Helm 管理的 Kubernetes 包。Charts 包含在 Kubernetes 中创建应用程序所需的所有信息，包括在\
  \ Kubernetes 集群中运行应用程序或服务所需的资源定义。\n\n#### Repository\n\n这是存储所有 Helm charts 的数据库。\n\
  \n#### Config\n\n这是可以合并到打包的 chart 中以创建可发布对象的配置。\n\n#### Release\n\n发布是跟踪 Helm 在\
  \ Kubernetes 集群上安装的所有应用程序的一种方式。单个 chart 可以多次安装，每次新的安装都会创建一个新的发布。\n\n### 安装和管理 Helm\n\
  \n你可以从其官方仓库 https://github.com/helm/helm/releases 下载适用于你机器的最新 Helm 客户端版本。\n\n安装\
  \ Helm 后，我们需要添加一个 chart 仓库，以便从那里下载包。Google 提供了 Kubernetes charts 仓库，可以按如下方式添加：\n\
  \n```\n$helm repo add stable https://kubernetes-charts.storage.googleapis.com/\n\
  ```\n\n从一个相对简单的角度来看，Helm 从中央仓库拉取 charts 或包，然后在 Kubernetes 集群上安装/发布它们。\n\n### 搜索\
  \ Helm 仓库\n\n你可以使用 helm search 命令以两种不同的方式搜索 Helm 仓库。第一种方式是搜索你本地添加的仓库（就像我们在上一步中添加\
  \ stable 仓库时那样）：\n\n```\n$ helm search repo stable\nNAME                       \
  \   CHART VERSION   APP VERSION\n      DESCRIPTION\nstable/acs-engine-autoscaler\
  \   2.2.2           2.1.1\n      DEPRECATED Scales worker nodes within agent pools\n\
  stable/aerospike               0.3.3           v4.5.0.5\n      A Helm chart for\
  \ Aerospike in Kubernetes\nstable/airflow                 7.6.0           1.10.10\n\
  \      Airflow is a platform to programmatically autho...\n```\n\n```\nstable/ambassador\
  \              5.3.2      0.86.1\nDEPRECATED A Helm chart for Datawire Ambassador\n\
  stable/anchore-engine          1.6.9      0.7.2\nAnchore container analysis and\
  \ policy evaluatio...\nstable/apm-server              2.1.5      7.0.0\nThe server\
  \ receives data from the Elastic APM a...\nstable/ark                     4.2.2\
  \      0.10.2\nDEPRECATED A Helm\n.\n.\n.\n```\n\n此搜索在你机器上的本地数据上执行。\n\n搜索 Helm 仓库的另一种方式是通过搜索\
  \ Helm Hub。Helm Hub 由多个可用的公共仓库组成，因此如果你在本地仓库中找不到 chart，你始终可以在 Hub 中查找。在下面，我们搜索了所有“kafka”图表：\n\
  \n```\n$ ~ helm search hub kafka\nURL                                        CHART\
  \ VERSION   APP VERSION     DESCRIPTION\nhttps://hub.helm.sh/charts/kafkaesque/imagepuller\
  \   1.0.0           1.0\nPull container images to your nodes so that the...\nhttps://hub.helm.sh/charts/kafkaesque/pulsar\
  \        1.0.26          1.0\nApache Pulsar Helm chart for Kubernetes\nhttps://hub.helm.sh/charts/kafkaesque/pulsar-mo...\
  \  0.1.5           1.0\nA Helm chart for the Pulsar Monitor application\nhttps://hub.helm.sh/charts/kafkaesque/teleport\
  \      1.0.0\nTeleport Community\nhttps://hub.helm.sh/charts/bitnami/kafka     \
  \       11.8.4          2.6.0\nApache Kafka is a distributed streaming platform.\n\
  https://hub.helm.sh/charts/stable/kafka-manager     2.3.1           1.3.3.22\nA\
  \ tool for managing Apache Kafka.\nhttps://hub.helm.sh/charts/touk/hermes      \
  \        0.3.1           1.5.2\nA Helm chart for Kubernetes of Hermes, a reliab...\n\
  ```\n\n### 在 Kubernetes 上安装 Helm chart\n\n要安装 chart，你可以按如下方式运行 helm install 命令：\n\
  \n```\n$ ~ helm install my-first-server stable/tomcat\nNAME: my-first-server\nLAST\
  \ DEPLOYED: Thu Sep 10 00:04:17 2020\nNAMESPACE: default\nSTATUS: deployed\nREVISION:\
  \ 1\nTEST SUITE: None\nNOTES:\n1. Get the application URL by running these commands:\n\
  \    NOTE: It may take a few minutes for the LoadBalancer IP to be available.\n\
  \    You can watch the status of by running 'kubectl get svc -w my-first-server-tomcat'\n\
  \    export SERVICE_IP=$(kubectl get svc --namespace default my-first-server-\n\
  ```\n\n```\ntomcat -o jsonpath='{ .status.loadBalancer.ingress[0].hostname }'\n\
  \    echo http://$$SERVICE_IP:\n```\n\n这里我们尝试部署一个 Tomcat 服务器，我们选择的发布名称是 *my-first-server*。使用\
  \ kubectl，你可以检查为 Tomcat chart 创建的资源：\n\n```\n$ ~ kubectl get svc --namespace default\
  \ my-first-server-tomcat\nNAME                         TYPE           CLUSTER-IP\
  \     EXTERNAL-IP   PORT(S)\nAGE\nmy-first-server-tomcat       LoadBalancer   10.32.0.3\
  \      <pending>     80:31495/TCP\n56s\n```\n\n### 修改默认 chart 值\n\n有时你可能希望在实际安装\
  \ chart 之前对其进行自定义。要更改默认 chart 的值，首先你需要使用 helm show values 查看值：\n\n```\n$ helm show\
  \ values stable/tomcat\n### Default values for the chart.\n### This is a YAML-formatted\
  \ file.\n### Declare variables to be passed into your templates.\nreplicaCount:\
  \ 1\n\nimage:\n  webarchive:\n    repository: ananwaresystems/webarchive\n    tag:\
  \ \"1.0\"\n  tomcat:\n  .\n  .\nresources: {}\n### limits:\n### cpu: 100m\n### memory:\
  \ 256Mi\n### requests:\n### cpu: 100m\n### memory: 256Mi\n\nnodeSelector: {}\n\n\
  tolerations: []\n\naffinity: {}\n```\n\n要更改值，你可以使用 --values 参数或 --set 参数。使用前者的优点是你可以指定一个\
  \ YAML 文件，在安装 chart 时传递它。这会覆盖 chart 值。例如，在前面的 chart 中，如果我们想更改默认值，我们可以创建如下 YAML 文件并将其保存为\
  \ *custom_vals.yaml*：\n\n\n\n```\nlimits:\n    cpu: 200m\n    memory: 256Mi\nrequests:\n\
  \    cpu: 100m\n    memory: 256Mi\n```\n\n要安装更改后的值，可以执行以下操作：\n\n```\n$ helm install\
  \ --values custom_vals.yaml new-v2-install stable/tomcat\n```\n\n在下一节中，我们将讨论如何在\
  \ Helm 中管理发行版。\n\n### 管理 Helm 发行版\n\n在 Helm 的术语中，发行版是指在 Kubernetes 集群中运行的图表实例。同一集群中可以多次安装同一个图表，每次安装时都会创建一个新的发行版。本节将展示如何管理\
  \ Helm 发行版。\n\n### 检查发行版\n\n要查找发行版状态，可以使用 helm status，它会提供诸如修订号和上次部署时间等详细信息：\n\n\
  ```\n$ helm status my-first-server\nNAME: my-first-server\nLAST DEPLOYED: Thu Sep\
  \ 10 00:04:17 2020\nNAMESPACE: default\nSTATUS: deployed\nREVISION: 1\nTEST SUITE:\
  \ None\nNOTES:\n1. Get the application URL by running these commands:\n    NOTE:\
  \ It may take a few minutes for the LoadBalancer IP to be available.\n    You can\
  \ watch the status of by running 'kubectl get svc -w my-first-server-tomcat'\n \
  \   export SERVICE_IP=$(kubectl get svc --namespace default my-first-server-tomcat\
  \ -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')\n    echo http://$SERVICE_IP:\n\
  $ ~ helm show values stable/tomcat\n### Default values for the chart.\n### This\
  \ is a YAML-formatted file.\n### Declare variables to be passed into your templates.\n\
  replicaCount: 1\n```\n\n### 升级发行版\n\n当新版本发布或你进行了配置更改时，可以使用 helm upgrade 来升级已安装的图表：\n\
  \n```\n$ helm upgrade --values new_vals.yaml new-v2-install stable/tomcat\n```\n\
  \n这将使用相同的图表 stable/tomcat 升级 new-v2-install，但你可以在 new_vals.yaml 文件中更新新值。\n\n###\
  \ 回滚发行版\n\n如果需要回滚已部署的图表（发行版），可以简单地使用以下 helm rollback 选项：\n\n```\n$ ~ helm rollback\
  \ my-first-server 1\nRollback was a success! Happy Helming!\n$ ~\n```\n\n在这里，我们将\
  \ my-first-server 回滚到版本 1。\n\n### 卸载发行版\n\n要永久从集群中删除发行版，可以使用 helm uninstall：\n\n\
  ```\n$ ~ helm uninstall my-first-server\nrelease \"my-first-server\" uninstalled\n\
  ```\n\n### 为你的应用程序创建图表\n\n要为你的应用程序创建图表，请遵循 Helm 提供的默认打包格式。你可以使用图表来部署简单的 Pod 或包含\
  \ HTTP 服务器、数据库等的完整 Web 应用程序堆栈。图表包含目录中的一组文件。目录结构如下，其中顶级目录的名称（本例中为 nginx）是图表的名称：\n\
  \n```\n~ nginx/\n    Chart.yaml\n    LICENSE\n    README.md\n    values.yaml\n \
  \   values.schema.json\n    charts/\n    crds/\n    templates/\n```\n\n在目录中，Helm\
  \ 要求文件具有相同的结构和名称，因为 Helm 为其保留了这些名称。目录中的每个项目都有特定的用途：\n\n- Chart.yaml 以 YAML 格式包含有关图表的所有信息。\n\
  - LICENSE 是一个可选的纯文本文件，其中包含图表的许可证。\n- README.md 是一个人类可读的自述文件。\n- values.yaml 包含图表的所有默认配置值。\n\
  - values.schema.json 是一个可选的 JSON 模式文件，对 values.yaml 施加结构。\n- charts/ 包含当前图表所依赖的所有依赖图表。\n\
  - crds/ 包含自定义资源定义。\n- templates/ 是存放模板的目录，这些模板可以与值结合生成 Kubernetes 清单文件。\n\nChart.yaml\
  \ 文件是创建图表所必需的，它包含以下字段：\n\n```\napiVersion: The chart API version (required)\nname:\
  \ The name of the chart (required)\nversion: A SemVer 2 version (required)\nkubeVersion:\
  \ A SemVer range of compatible Kubernetes versions (optional)\ndescription: A single-sentence\
  \ description of this project (optional)\ntype: The type of the chart (optional)\n\
  keywords:\n  - A list of keywords about this project (optional)\nhome: The URL of\
  \ this projects home page (optional)\nsources:\n  - A list of URLs to source code\
  \ for this project (optional)\ndependencies: # A list of the chart requirements\
  \ (optional)\n  - name: The name of the chart (nginx)\n    version: The version\
  \ of the chart (\"1.2.3\")\n    repository: The repository URL (\"https://example.com/charts\"\
  ) or alias (\"@repo-name\")\n    condition (optional) A yaml path that resolves\
  \ to a boolean, used for enabling/disabling charts (e.g. subchart1.enabled )\n \
  \   tags: # (optional)\n      - Tags can be used to group charts for enabling/disabling\
  \ together\n    enabled: (optional) Enabled bool determines if chart should be loaded\n\
  \    import-values: # (optional)\n      - ImportValues holds the mapping of source\
  \ values to the parent key to be imported. Each item can be a string or pair of\
  \ child/parent sublist items.\n    alias: (optional) Alias to be used for the chart.\
  \ Useful when you have to add the same chart multiple times\nmaintainers: # (optional)\n\
  \  - name: The maintainers name (required for each maintainer)\n    email: The maintainers\
  \ email (optional for each maintainer)\n    url: A URL for the maintainer (optional\
  \ for each maintainer)\nicon: A URL to an SVG or PNG image to be used as an icon\
  \ (optional).\nappVersion: The version of the app that this contains (optional).\
  \ This needn't be SemVer.\ndeprecated: Whether this chart is deprecated (optional,\
  \ boolean)\nannotations:\n  example: A list of annotations keyed by name (optional).\n\
  ```\n\n### 使用 Helm 创建和管理图表\n\n你可以手动在图表目录中创建每个文件，也可以使用 Helm 为你创建蓝图，如下所示：\n\n```\n\
  $ helm create examplechart\nCreating examplechart\n```\n\n然后你可以编辑图表目录中的文件并将其打包成图表归档：\n\
  \n```\n$ helm package examplechart\nArchived examplechart.1.-.tgz\n```\n\n打包图表后，你可以使用\
  \ helm install 将其用于创建发行版。\n\n### 总结\n\n在本章中，你学习了如何创建 Kubernetes 集群，既可以从头开始手动使用 Azure\
  \ 创建，也可以作为托管服务使用 Azure AKS。我们还探讨了 Helm，它充当 Kubernetes 包管理器，帮助你使用单个模板创建和管理应用程序。\n\
  \n在继续之前，我们想强调 Kubernetes 单独管理起来很困难（尤其是在生产环境中），它绝对不是解决云原生环境中管理应用程序所有痛苦的灵丹妙药。鉴于管理\
  \ Kubernetes 集群的底层复杂性，很明显，像 AKS 这样的方法是管理在 Kubernetes 集群上运行的服务更好的方式。使用 AKS，你不必担心底层基础设施或生态系统的各个组成部分，因为大多数关键点，例如\
  \ Kubernetes 集群的高可用性和冗余，都已得到处理。\n\n话虽如此，让我们现在继续进入第 6 章，该章涉及在分布式系统中构建可观测性并帮助你的云原生应用程序变得更可靠。\n"
- "## 第 6 章. 可观测性：追踪面包屑\n\n## 早期发布读者的说明\n\n使用 Early Release 电子书，你可以在这些书籍的官方发布之前很久就利用这些技术——在作者撰写时获得书籍的最原始和未编辑内容。\n\
  \n这将是最终书籍的第 6 章。请注意，GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果在本章中发现缺少材料，请联系编辑\
  \ rfernando@oreilly.com。\n\n云原生系统的快速发展带来了基础设施配置、基础设施部署和软件管理方面的复杂性。应用程序被设计得更具弹性，这需要更深入地了解云环境的基础设施，包括故障模式和瓶颈。由于当今应用程序中众多新的活动部件和设计变化，对应用程序堆栈的可见性变得更加关键。\n\
  \n在本章中，我们将介绍可观测性的概念并解释为什么它在当今的云原生世界中是必要的。你将了解可观测性的三大支柱——日志、指标和追踪——并深入了解它们如何协同工作以创建可观测系统。我们还将介绍各种知名云原生工具，这些工具可用于创建可观测系统，并演示可观测性是监控的超集。最后，我们将展示如何利用\
  \ Azure 作为云\n\n\n\n平台用于在您的应用程序、底层基础设施和网络栈中获得可观测性。\n\n### 可观测性简介\n\n首先要理解可观测性这个词本身。可观测性一词源于数学中的控制理论世界，该理论主要致力于利用来自系统本身的反馈，通过控制器来控制*动态系统*的方法。在控制理论中，可观测性是指从外部输出的知识中测量系统内部状态的能力。相对于软件工程而言，可观测性意味着从其输出中了解应用程序的*确切*状态。通过设计使您的应用程序和基础设施具有可观测性，您本质上将能够追踪问题发生的*原因*以及*如何*修复它。使系统可观测的根本目标是使工程师能够清晰地看到问题，从其原因到其影响。\n\
  \n在当今的云原生基础设施中，可观测性变得更加相关，因为在快速变化的分布式环境中，软件和系统最终可能会失败。微服务、容器和无服务器计算的兴起导致了由相互连接的服务组成的复杂网络，它们彼此之间执行大量调用。当这些相互交织的服务网络行为异常时，在避免对业务造成干扰的同时找到问题的根本原因几乎是不可能的。快速定位复杂服务底层环境中的问题变得至关重要，这样业务就不会受到影响。可观测性通过让您询问系统的问题并快速获得答案来解决这个问题。\n\
  \n在讨论可观测性如何协助现代分布式环境之前，让我们先看看构成可观测系统的要素，并讨论该术语背后的原理以及将可观测性构建到系统中的理念背后的哲学。\n\n###\
  \ 可观测性：不仅仅是三大支柱\n\n可观测性背后的基本思想是通过有意义的洞察更好地了解应用程序。随着应用程序变得更加短暂和分布式，定义可观测系统的指导原则变得至关重要。云从业者已将*日志*、*指标*和*追踪*定义为构建现代可观测系统的三大主要垂直领域，或支柱。让我们快速了解一下这些支柱以及它们为何重要。\n\
  \n#### 指标\n\n指标代表在时间间隔内测量的数值数据。指标通常通过在主机上运行代理定期将数据发送到中央数据存储来收集，然后聚合数据以在仪表板上表示。然后指标用于构建警报系统，因为指标存储在时间序列数据库中。指标的一个例子是每秒查询数（qps）。\n\
  \n#### 日志\n\n日志代表系统中发生的事件（应用程序和基础设施）。日志包含内部状态和事件的详细信息。通常，它们以结构化格式写入并存储在应用程序系统中，可以轻松解析。良好的日志架构是获取系统中大部分信息的最基本工具，也是软件开发人员最常使用的第一个调试工具。以下是简单的\
  \ Apache 服务器访问日志示例：\n\n```\n10.185.248.71 - - [09/Jan/2015:19:12:06 +0000] 808840\
  \ \"GET\n/inventoryService/inventory/purchaseItem?\nuserId=20253471&itemId=23434300\
  \ HTTP/1.1\" 500 17 \"-\" \"Apache-\nHttpClient/4.2.6 (java 1.5)\"\n```\n\n####\
  \ 追踪\n\n最后但并非最不重要，追踪是学习单个事件在分布式系统中行为的现代解决方案。追踪可帮助您识别堆栈每一层所进行的处理量（即延迟）。在微服务和分布式系统的世界中，追踪\n\
  \n通过创建服务之间相关分布式调用的可视化，为事件提供有价值的洞察。\n\n图 6-1 展示了简单的追踪。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_177_0.png)\n\
  \n图 6-1. 显示追踪的示例应用程序\n\n仅仅因为您构建了包含日志、指标和追踪的系统并不意味着系统就是可观测的。然而。所有三个支柱都有其优缺点，我们将在本章的其余部分讨论，单独来看，它们只是起点，因为它们使您能够深入研究问题，但它们并不能直接解决您公司的用例或业务需求。为了利用这些支柱，您必须将它们一起使用，并结合影响您业务的因素。如果您将指标数据与日志和追踪分开收集，您很容易失去上下文，最终只能孤立地观察单个底层系统。相对于统一方法而言的可观测性意味着收集并保留底层上下文及其全部丰富性和维度。\n\
  \n### 可观测性：监控的超集\n\n监控主要专注于被动收集系统的事件、日志和指标。您通常会监控一个关键服务，您认为它可能会出错，因为您之前曾遇到过该服务的错误，或者您了解该服务的故障模式。监控采取主动方法，通过帮助您进行警报和容量规划，而可观测性采取更具反应性的方法，通过让您更仔细地检查应用程序堆栈，查看出了什么问题以及为什么会出错。\n\
  \n让我们看一个例子。想象一下，您公司的一名开发人员在尝试为旗舰应用程序添加新功能时修改了关键代码路径。不幸的是，他不小心引入了一个错误，这导致了停机。在这种情况下，您的监控系统将能够清楚地显示来自服务的错误率增加，但无法进一步深入研究。然而，将可观测性嵌入到您的堆栈中可以帮助您快速深入到问题中——比如\
  \ Redis 集群的问题——然后追踪可以直接引导您找到根本原因。\n\n重要的是要重申，在这种情况下，您的监控系统没有任何问题。它们正在做它们被设计来做的事情——告诉您何时出现问题。可观测性是帮助您弄清楚出了什么问题。\n\
  \n同样重要的是要注意，可观测性并不是监控的替代方案。相反，它是监控的超集，因为它提供了服务的整体概览以及对分布式系统中各种事件的细粒度洞察。此外，在分布式云环境中，多个服务运行并相互交互，如果系统没有被仪器化以暴露正确的故障使其浮现出来，找到故障的任务变得极其痛苦。可观测性通过在请求穿过服务时精确定位问题链来处理此类场景。\n\
  \n### 可观测性驱动开发\n\n正如我们所讨论的，云原生应用程序主要是分布式和基于微服务的，这使得它们在维护和管理方面本质上很复杂。任何运行生产级应用程序的人也意识到，当应用程序开始表现异常时，几乎不可能弄清楚哪个特定的移动部件是异常行为的根本原因。有时故障会通过传统的日志记录和监控设置被捕获，这可以在应用程序堆栈的复杂性下为您指明正确的方向。但随着服务的演进，您无法确定应用程序或其底层基础设施的所有故障模式。\n\
  \n可观测性驱动开发是为了解决在生产环境中寻找未知问题而做出的努力，它鼓励在软件开发生命周期的早期阶段添加可观测性方面。此外，它提倡在软件设计阶段对应用程序代码进行仪器化，以便以后更容易在同一位置而不是多个位置添加仪器化。它还旨在弥合开发人员和运维人员之间的差距，让开发人员拥有代码并在生产环境中轻松调试。工程团队不仅能够在生产中及早诊断故障和错误，而且还有助于这些团队衡量和分析运营和业务绩效。\n\
  \n在以下各节中，我们将研究现代云原生基础设施和应用程序可以通过哪些方式变得可观测。我们将深入研究三大支柱中的每一个，并了解在云原生环境中构建系统的首选方式，从指标开始。\n\
  \n### 在云原生世界中使用 Prometheus 监控指标\n\n正如我们在第 4 章中所讨论的，Kubernetes 极大地改变了现代应用程序的创建和部署方式。微服务和面向服务的架构已经改变了云原生环境的格局，因为功能添加和部署的速度已经加快。随着向这些现代架构的转变，传统的监控方法无法跟上此类架构的当前步伐，这些架构围绕着短暂的基础设施、多个\n\
  \n\n\n区域和可用区，有时甚至跨越云。所有这些新增的复杂层也为新的和未见过的故障模式打开了大门，而传统的监控方法根本无法跟上。\n\n为了应对监控现代云原生应用和基础设施的问题，我们需要重新审视可观测性的核心支柱之一：指标。正如我们所讨论的，指标是提供有关应用程序状态的海量信息的关键领域之一。谈到完全理解你的云原生应用时，传统的指标集往往达不到要求，需要收集自定义指标集以更好地衡量应用程序的整体性能和健康状况。此类指标通常配置为由应用程序本身发出，因此它们提供更精确的信息。这正是\
  \ Prometheus 大放异彩的地方。\n\nPrometheus 是一个开源的监控和报警系统，最初由 SoundCloud 构建，后来被云原生计算基金会（CNCF）收录为继\
  \ Kubernetes 之后的第二个项目。它主要为现代云原生应用设计，特别专注于指标领域。随着 Kubernetes 的出现，Prometheus 已成为监控暴露大量自定义指标的新云原生应用的事实标准方式之一。与监控领域的其前身相比，Prometheus\
  \ 也更轻量，因为它采用基于拉取的导出器模型，基本上从应用程序和基础设施中抓取数据。\n\n### Prometheus 组件和架构\n\nPrometheus\
  \ 主要是在大规模运行的基于容器的应用监控方面构建的。现代云原生应用暴露出需要收集的各种数据，以及底层移动部件的复杂性，而 Prometheus 正是从零开始构建来应对这种动态环境。为了支持云原生应用的新时代，Prometheus\
  \ 生态系统由以下五个主要组件组成：\n\n#### Prometheus server\n\n负责抓取指标并将它们存储在时间序列数据库中。\n\n#### Client\
  \ libraries\n\n用于为应用程序代码进行[content]\n\n区域和可用区，有时甚至跨越云。所有这些新增的复杂层也为新的和未见过的故障模式打开了大门，而传统的监控方法根本无法跟上。\n\
  \n为了应对监控现代云原生应用和基础设施的问题，我们需要重新审视可观测性的核心支柱之一：指标。正如我们所讨论的，指标是提供有关应用程序状态的海量信息的关键领域之一。谈到完全理解你的云原生应用时，传统的指标集往往达不到要求，需要收集自定义指标集以更好地衡量应用程序的整体性能和健康状况。此类指标通常配置为由应用程序本身发出，因此它们提供更精确的信息。这正是\
  \ Prometheus 大放异彩的地方。\n\nPrometheus 是一个开源的监控和报警系统，最初由 SoundCloud 构建，后来被云原生计算基金会（CNCF）收录为继\
  \ Kubernetes 之后的第二个项目。它主要为现代云原生应用设计，特别专注于指标领域。随着 Kubernetes 的出现，Prometheus 已成为监控暴露大量自定义指标的新云原生应用的事实标准方式之一。与监控领域的其前身相比，Prometheus\
  \ 也更轻量，因为它采用基于拉取的导出器模型，基本上从应用程序和基础设施中抓取数据。\n\n### Prometheus 组件和架构\n\nPrometheus\
  \ 主要是在大规模运行的基于容器的应用监控方面构建的。现代云原生应用暴露出需要收集的各种数据，以及底层移动部件的复杂性，而 Prometheus 正是从零开始构建来应对这种动态环境。为了支持云原生应用的新时代，Prometheus\
  \ 生态系统由以下五个主要组件组成：\n\n#### Prometheus server\n\n负责抓取指标并将它们存储在时间序列数据库中。\n\n#### Client\
  \ libraries\n\n用于为应用程序代码进行仪器化并将提取的指标数据发送到 Prometheus 服务器。客户端库有多种语言可用，包括 C#、Python、Java\
  \ 和 Ruby。\n\n#### Pushgateway\n\n用于支持短生命周期任务。\n\n#### Exporters\n\n在无法直接进行仪器化的应用程序旁边运行，例如\
  \ HAProxy 和 statsd，以提取可按所需格式发送到 Prometheus 服务器的指标。\n\n#### Alertmanager\n\n接收来自\
  \ Prometheus 服务器的告警并高效地向上冒泡通知。Alertmanager 以多种一致且有效的方式执行此操作：\n- 它对相似类型的告警进行分组，以便在大型中断期间发送的告警更少。\n\
  - 它可以限制发送到接收系统的通知。\n- 如果相关的告警已经触发，它允许对选定的告警抑制通知。\n- 它可以将告警发送到多个系统，例如 OpsGenie 和\
  \ PagerDuty 等。\n\n图 6-2 显示了 Prometheus 架构中这些主要组件的概况。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_182_0.png)\n\
  \n图 6-2. Prometheus 架构\n\nPrometheus 将所有数据存储为 *time series*；即属于同一指标和同一组标记维度的带时间戳的值流。每个时间序列由其\
  \ *metric name* 和一个可选的键值对 *labels* 唯一标识。此外，客户端库提供基本四核指标类型：Counter、Gauge、Histogram\
  \ 和 Summary。我们将在本章后面讨论这四种类型，并提供仪器化示例。\n\n### JOBS AND INSTANCES\n\n在 Prometheus\
  \ 术语中，可以抓取的端点称为 *instance*，它通常对应于单个进程。具有相同目的的一组实例——例如为可扩展性或可靠性而复制的进程——称为 *job*。\n\
  \n以下是具有四个复制实例的 API 服务器作业示例：\n\n```\njob: api-server\ninstance 1: 1.2.3.4:5670\n\
  instance 2: 1.2.3.4:5671\ninstance 3: 5.6.7.8:5670\ninstance 4: 5.6.7.8:5671\n```\n\
  \n让我们安装并配置 Prometheus 以了解 Prometheus 生态系统周围的一些额外关键概念。\n\n### Installing and Configuring\
  \ Prometheus\n\n要本地安装和运行 Prometheus，首先需要从 https://prometheus.io/download 下载适用于你的平台的正确版本。在撰写本文时，Prometheus\
  \ 的最新版本是 2.23。下载 tarball 后，进入目录并使用以下命令解压：\n\n```\n$ tar xvfz prometheus-2.23.0.darwin-amd64.tar.gz\n\
  $ cd prometheus-2.23.0.darwin-amd64\n```\n\n进入 Prometheus 目录后，你可以使用 Prometheus 目录中的\
  \ *prometheus.yaml* 文件配置 Prometheus 抓取其自己的 HTTP 端点。默认文件已包含 Prometheus 服务器运行的本地主机上的\
  \ TCP 端口 9090。你可以通过执行以下命令运行 Prometheus：\n\n```\n$ ./prometheus\nlevel=info ts=2020-11-29T06:51:43.519Z\
  \ caller=head.go:659\ncomponent=tsdb msg=\"On-disk memory mappable chunks replay\n\
  completed\" duration=7.944µs\nlevel=info ts=2020-11-29T06:51:43.519Z caller=head.go:665\n\
  component=tsdb msg=\"Replaying WAL, this may take a while\"\nlevel=info ts=2020-11-29T06:51:43.520Z\
  \ caller=head.go:717\ncomponent=tsdb msg=\"WAL segment loaded\" segment=0 maxSegment=0\n\
  level=info ts=2020-11-29T06:51:43.520Z caller=head.go:722\ncomponent=tsdb msg=\"\
  WAL replay completed\"\ncheckpoint_replay_duration=93.857µs wal_replay_duration=695.77µs\n\
  total_replay_duration=812.641µs\nlevel=info ts=2020-11-29T06:51:43.521Z caller=main.go:742\n\
  fs_type=19\nlevel=info ts=2020-11-29T06:51:43.521Z caller=main.go:745\nmsg=\"TSDB\
  \ started\"\nlevel=info ts=2020-11-29T06:51:43.521Z caller=main.go:871\nmsg=\"Loading\
  \ configuration file\" filename=prometheus.yml\nlevel=info ts=2020-11-29T06:51:43.712Z\
  \ caller=main.go:902\nmsg=\"Completed loading of configuration file\"\nfilename=prometheus.yml\
  \ totalDuration=190.710981ms\nremote_storage=6.638µs web_handler=591ns query_engine=807ns\n\
  scrape=189.731297ms scrape_sd=42.312µs notify=322.934µs\nnotify_sd=20.022µs rules=3.538µs\n\
  level=info ts=2020-11-29T06:51:43.712Z caller=main.go:694\nmsg=\"Server is ready\
  \ to receive web requests.\"\n```\n\n你可以在浏览器上访问 http://localhost:9090 上的 Prometheus\
  \ UI，并查看 Prometheus 服务器在 http://localhost:9090/metrics 上为其自身提供的各种指标。\n\n现在你可以使用\
  \ *Expression browser* 基本上运行查询或编写 PromQL¹ 表达式。\n\n> **NOTE**\n> \n> PromQL 是 Prometheus\
  \ 的功能性查询语言，可让你实时选择和聚合时间序列数据。数据可以在 Prometheus UI 上以表格或图表格式可视化。\n\n要使用 Expression\
  \ browser，使用从 localhost:9090/metrics 暴露的任何指标，例如\n\n```\nprometheus_http_requests_total\
  \ (which is a counter for all\n```\n\n对 Prometheus 服务器的所有 HTTP 请求）。然后点击 Graph 选项卡并在\
  \ Expression 控制台中输入该指标，如图 6-3 所示。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_185_0.png)\n\
  \n图 6-3. prometheus_http_requests_total 的 Expression browser 结果\n\n查询语言非常广泛，支持对指标进行许多函数和操作。例如，如果你想统计指标\
  \ prometheus_target_interval_length_seconds 返回的时间序列数量，你可以在 Expression browser 中发出以下命令：\n\
  \n```\ncount(prometheus_target_interval_length_seconds)\n```\n\n同样，如果你想了解某个指标每秒的增长速度，可以在\
  \ Expression browser 中使用 rate：\n\n```\nrate(prometheus_tsdb_head_samples_appended_total[1m])\n\
  ```\n\n### node_exporter\n\nnode_exporter 暴露了一系列主机级指标，例如 CPU、内存、磁盘空间、I/O 和网络带宽，以及各种内核级指标。你可以从以下位置下载\
  \ node-exporter：\n\n\n\nhttps://prometheus.io/download. 一旦你下载并解压了 tarball，就可以在不做任何更改的情况下直接运行二进制文件：\n\
  \n```\n$ cd node_exporter-1.0.1.darwin-amd64\n$ ./node_exporter\nlevel=info ts=2020-12-01T13:20:29.510Z\n\

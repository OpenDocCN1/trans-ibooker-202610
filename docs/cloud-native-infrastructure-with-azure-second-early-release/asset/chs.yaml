  \nnode_exporter 默认在 http://localhost:9100 上运行。prometheus.yml 中的 scrape_configs 文件需要更新一些信息，以便它可以通过抓取数据来监控\
  \ node_exporter：\n\n```\nscrape_configs:\n  - job_name: node\n    static_configs:\n\
  \    - targets:\n      - localhost:9100\n```\n\n一旦你重启 Prometheus 以应用新的更改，Prometheus\
  \ 将有两个端点目标来抓取指标数据。你也可以检查 http://localhost:9090/targets 端点。现在，假设你需要找出每个 CPU 花在不同类型工作上的秒数（即\
  \ user、system、iowait 等）；为此，你可以在表达式浏览器中使用 irate 函数运行以下查询：\n\n```\nirate(node_cpu_seconds_total{job=\"\
  node\"}[5m])\n```\n\njob=\"node\" 是匹配的标签，用于过滤指标。现在让我们看看应用程序的 instrumentation 如何与\
  \ Prometheus 协同工作。\n\n### Instrumentation of Applications\n\n要监控自定义服务，我们需要添加 instrumentation，这涉及将\
  \ tracing 库添加到应用程序代码中，以便我们可以实现 Prometheus 指标类型。在本节中，我们将看看如何借助客户端库来实现这一点，你可以使用这些客户端库来为你的应用程序代码进行\
  \ instrumentation。客户端库主要让你能够使用应用程序上的 HTTP 端点定义和公开内部指标，并且当 Prometheus 抓取你的应用程序实例时，客户端库会向其发送当前的指标状态。我们将使用\
  \ Python 作为首选的 instrumentation 库，不过在 https://prometheus.io/docs/instrumenting/clientlibs\
  \ 上还有更多客户端库实现。\n\n第一步是使用 pip 在你的主机上安装客户端库，如下所示：\n\n```\n$ pip install prometheus_client\n\
  ```\n\n基于我们之前提到的四种指标类型，你主要可以通过四种不同的方式来为代码进行 instrumentation。我们将在以下各节中讨论它们。\n\n####\
  \ Counters\n\n顾名思义，计数器主要用于计数会增加的值，并且在应用程序重启时可以重置为零。例如，当向 Python HTTP 服务器发送 GET 请求时，以下代码会将计数器值增加\
  \ 1：\n\n```\nimport http.server\nfrom prometheus_client import Counter, start_http_server\n\
  \nhttp_requests = Counter('my_app_http_request','Description: Num\nof HTTP request')\n\
  \nclass SampleServer(http.server.BaseHTTPRequestHandler):\n    def do_GET(self):\n\
  \        http_requests.inc()\n        self.send_response(200)\n        self.end_headers()\n\
  \        self.wfile.write(b\"Simple Counter Example\")\n\nif __name__ == \"__main__\"\
  :\n    start_http_server(5555)\n    server = http.server.HTTPServer(('localhost',\
  \ 5551),\nSampleServer)\n    server.serve_forever()\n```\n\n你可以在终端中以 `python counter.py`\
  \ 运行此代码块，它将启动一个简单的 HTTP 服务器。我们使用 start_http_server 作为指标将被抓取的端点。你可以在 http://localhost:5555\
  \ 上访问指标。要将这些指标摄入 Prometheus，你需要在 prometheus.yml 文件中再次配置 scrape_configs 文件，如下所示：\n\
  \n```\nscrape_configs:\n  - job_name: 'prometheus'\n    static_configs:\n    - targets:\
  \ ['localhost:9090']\n```\n\n```\n- job_name: node\n  static_configs:\n  - targets:\n\
  \    - localhost:9100\n- job_name: my_application\n  static_configs:\n  - targets:\n\
  \    - localhost:5555\n```\n\n一旦你重启 Prometheus，你将能够通过表达式浏览器使用 PromQL 表达式 `rate(my_app_http_request_total[1m])`\
  \ 访问该指标。每次你访问应用程序 URL http://localhost:5551 时，计数器都会增加。图 6-4 显示了传入 HTTP 请求的增加速率。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_189_0.png)\n\n图 6-4. 仪器化应用程序的计数器指标\n\n\
  正如你所见，使用计数器对代码进行 instrumentation 非常容易。你也可以使用计数器来计数代码中的异常和错误，甚至可以为计数器设置自定义值而不是每次增加一。\n\
  \n#### Gauges\n\nGauge 主要表示实体的当前状态，可以上升也可以下降。Gauge 可用于几种不同的场景：例如，\n\n假设你需要知道活动线程数或队列中的项目数，或者你想知道缓存中的项目数。\n\
  \nGauge 使用三种主要方法：inc、dec 和 set。以下示例展示了如何独立使用这三种方法来跟踪你感兴趣的指标：\n\n```\nfrom prometheus_client\
  \ import Gauge\nsample_gauge_1 = Gauge('my_increment_example_requests',\n'Description\
  \ of increment gauge')\nsample_gauge_2 = Gauge('my_decrement_example_requests',\n\
  'Description of decrement gauge')\nsample_gauge_3 = Gauge('my_set_example_requests',\
  \ 'Description of set gauge')\n\nsample_gauge_1.inc()      # This will increment\
  \ by 1\nsample_gauge_2.dec(10)    # This will decrement by given value of 10\nsample_gauge_3.set(48)\
  \    # This will set to the given value of 48\n```\n\n在前面的代码中，inc() 方法会将 'my_increment_example_requests'\
  \ 的值增加 1，将 'my_decrement_example_requests' 的值减少 10，并将 'my_set_example_requests'\
  \ 的值设置为 48。\n\n### Summary\n\nSummary 通常跟踪请求持续时间或响应大小。它通常用于查找事件的大小和数量。它使用 observe\
  \ 方法，该方法接受事件的大小。例如，在以下代码中，我们试图找出请求完成所需的时间：\n\n```\nimport http.server\nimport time\n\
  from prometheus_client import Summary, start_http_server\n\nLATENCY = Summary('latency_in_seconds','Time\
  \ for a request')\n\nclass SampleServer(http.server.BaseHTTPRequestHandler):\n \
  \   def do_GET(self):\n        start_time = time.time()\n```\n\n```\nself.send_response(200)\n\
  self.end_headers()\nself.wfile.write(b\"My application with a Summary metric\")\n\
  LATENCY.observe(time.time() - start_time)\n\nif __name__ == \"__main__\":\n    start_http_server(5555)\n\
  \    server = http.server.HTTPServer(('localhost', 5551), SampleServer)\n    server.serve_forever()\n\
  ```\n\n要运行前面的代码，你可以按照我们在“Counter”第 XX 页中采用的方法进行操作。http://localhost:5555/metrics\
  \ 上的指标端点将有两个时间序列：\nlatency_in_seconds_count 和 latency_in_seconds_sum。\n前者表示所做的 observe\
  \ 调用次数，后者是传递给 observe 的值的总和。如果将这两个指标的速率相除——\nrate(latency_in_seconds_count[1m])/rate(latency_in_seconds_sum[1m])——\n\
  你将得到过去一分钟的平均延迟。\n\n#### Histograms\n\n直方图帮助你在桶中跟踪事件的大小和数量，同时允许你聚合计算分位数。直方图可用于衡量特定\
  \ HTTP 请求调用的请求持续时间。\n\n直方图的代码 instrumentation 也使用 observe 方法，你可以将其与时间结合起来跟踪延迟，如我们之前的示例所示。以下代码将\
  \ 10 秒添加为请求延迟：\n\n```\nfrom prometheus_client import Histogram\nreq_latency = Histogram('request_latency_seconds',\
  \ 'Description of histogram')\nreq_latency.observe(10)    # Observe 10 (seconds\
  \ in this case)\n```\n\nInstrumentation 通常在服务级别或服务中使用的客户端库上应用。需要注意的是\n\n\n\n即使 Prometheus\
  \ 在处理多个指标时效率很高，也存在可以/应该添加的仪器化级别的限制。²\n\n现在你已经了解了代码仪器化是如何工作的，以及主机如何被添加到 Prometheus\
  \ 并被抓取，让我们看看如何在生产环境中将主机添加到 Prometheus 以便被抓取。\n\n### 查找主机\n\nPrometheus 使用 prometheus.yml\
  \ 文件中 scrape_configs 下的 static_configs 文件来查找要抓取的主机目标。云环境本质上非常动态，尤其是在容器化环境中，变化相当频繁。在这种环境中，手动将主机添加到\
  \ prometheus.yml 文件并不能很好地扩展。Prometheus 通过支持多种来源，包括 Kubernetes、Azure 和自定义服务发现平台，提供多种方式来处理这种情况。服务发现是在分布式云环境中查找所有正在运行服务的简单方法。我们将在第\
  \ 7 章详细讨论服务发现。在这里，我们将看看在生产环境中可以找到哪些主机供 Prometheus 抓取的几种方法。\n\n### 使用 Ansible\n\n\
  如果主机正在运行 node exporter，那么最简单的方法之一就是通过库存主机静态更新 prometheus.yml 文件。基本上，每次添加一台机器时，你还应该有将其添加到\
  \ prometheus.yml 配置文件的配置。以下是使用 Ansible 更新 prometheus.yml 的片段：\n\n```\nscrape_configs:\n\
  \  - job_name: {{ hostname }}\n    static_configs:\n      - targets:\n        -\
  \ {{ hostname }}:9100\n```\n\n你也可以在 Ansible 库存中的任何组下循环主机并直接添加它们。\n\n### 使用文件\n\n\
  你还可以提供可以直接从 YAML 或 JSON 文件读取的目标列表，而无需任何网络开销。这又是另一种静态服务发现方法，Prometheus 可以直接从静态文件读取主机——例如，如果你有一个\
  \ *inventory.json* 文件：\n\n```\n[\n  {\n    \"targets\": [\n      \"192.168.101.11:9100\"\
  \n    ],\n    \"labels\": {\n      \"job\": \"node\",\n      \"Team\": \"dev\"\n\
  \    }\n  },\n  {\n    \"targets\": [\n      \"192.168.101.155:9200\"\n    ],\n\
  \    \"labels\": {\n      \"job\": \"node\",\n      \"Team\": \"sre\"\n    }\n \
  \ }\n]\n```\n\n现在你可以使用 `file_sd_configs` 在 `scrap_configs` 下更新 *prometheus.yml*\
  \ 如下：\n\n```\nscrape_configs:\n  - job_name: file\n    file_sd_configs:\n      -\
  \ files:\n        - 'inventory.json'\n```\n\n你可以在 http://localhost:9090/service-discovery\
  \ 找到正在被抓取的目标。\n\n### 使用 azure_sd_config\n\nPrometheus 允许开箱即用地支持抓取 Azure 虚拟机。Azure\
  \ 服务发现 SD 配置允许你从 Azure 虚拟机检索抓取目标。你可以通过在 *prometheus.yml* 文件中设置 Azure 凭据来使用 Azure\
  \ 服务发现，如下所示：\n\n```\n- job_name: 'azure-nodes'\n  azure_sd_configs:\n    - subscription_id:\
  \ '$SUBSCRIPTION_ID'\n      tenant_id: '$TENANT_ID'\n      client_id: '$CLIENT_ID'\n\
  \      client_secret: '$CLIENT_SECRET'\n      port: 9100\n  relabel_configs:\n \
  \   - source_labels: [__meta_azure_machine_tag_cloudnative]\n      regex: true.*\n\
  \      action: keep\n    - source_labels: [__meta_azure_machine_name]\n      target_label:\
  \ web_instance\n    - source_labels: [__meta_azure_machine_tag_public_ip]\n    \
  \  regex: (.*)\n      replacement: ${1}:9100\n      target_label: __address__\n\
  ```\n\n在此配置中，我们还使用了 *relabeling*，它在目标被抓取之前动态重写目标的标签集。Relabeling 有助于操作指标以保持存储干净，不会被不需要的数据污染。多个\
  \ relabeling 会按配置文件中出现的顺序应用于每个目标的标签集。\n\n让我们更仔细地看看前面 *relabel_configs* 的关键部分：\n\n\
  ```\n__meta_azure_machine_tag_cloudnative\n```\n\nPrometheus 会查看所有 Azure 虚拟机实例，如果实例有一个名为\
  \ `cloudnative` 的标签，则保留该服务。\n\n基本上，这告诉 Prometheus：“如果在 Azure 账户中找到任何虚拟机，其标签为 `cloudnative:\
  \ true`，则抓取它；否则，忽略它。\n\n```\n__meta_azure_machine_name\n```\n\n在这里，Prometheus 查找\
  \ machine_name 然后将其放入 web_instance 标签中。\n\n```\n__meta_azure_machine_tag_public_ip\n\
  ```\n\n在这里，Prometheus 将 :9100 附加到公共 IP。它还替换 __address__ 标签的内容。\n\n一旦你运行了一些 Azure\
  \ 虚拟机，你可以在 http://localhost:9090/service-discovery 找到发现的目标以及从虚拟机中提取的元数据。\n\n现在我们已经了解了\
  \ Prometheus 中传统服务发现的工作原理，让我们看看 Prometheus 如何与 Kubernetes 协同工作，并在云原生应用中缩小监控差距。\n\
  \n### Prometheus on Kubernetes\n\nKubernetes 服务发现支持已内置到 Prometheus 中，开箱即用，允许从 Kubernetes\
  \ REST API 检索抓取目标。要使用此功能，Prometheus 必须已在 Kubernetes 集群内部运行。你可以使用 Helm charts 在 AKS\
  \ 集群上轻松配置和部署 Prometheus。\n\n可以在 Kubernetes 集群中配置五种类型的角色来发现目标：node、service、Pod、endpoints\
  \ 和 ingress。让我们更仔细地看看这些服务发现角色。\n\n### The node role\n\nnode 角色会发现 Kubernetes 集群中的所有节点。由于\
  \ kubelet 在 Kubernetes 集群中的每个节点上运行，node 角色会发现集群中的目标节点，其地址默认为 kubelet 的 HTTP\n\n\
  端口。你可以使用以下 Prometheus scrape_configs 命令抓取 kubelet 节点：\n\n```\nscrape_configs:\n\
  \  - job_name: 'kubelet'\n    kubernetes_sd_configs:\n      - role: node\n    scheme:\
  \ https\n    tls_config:\n      ca_file: ca.crt\n```\n\n在前面的 *prometheus.yml* 配置中，标签被提供为\
  \ `kubelet`，角色被提供为 `node`。我们使用 scheme `HTTPS`，因为 kubelet /metrics 仅通过 HTTPS 提供，这也需要传输层安全\
  \ TLS 证书。\n\n### The service role\n\n*service* 角色主要帮助你监控不透明系统以检查所有服务是否都在响应。service\
  \ 角色为每个服务的每个服务端口找到一个目标。你可以按如下方式抓取服务对象：\n\n```\nscrape_configs:\n  - job_name: prometheus-pushgateway\n\
  \    kubernetes_sd_configs:\n      - role: service\n```\n\n### The Pod role\n\n\
  *Pod* 角色负责发现集群中运行的所有 Pod 并将其中运行的容器作为目标公开。它还返回与 Pod 相关的所有元数据。你可以按如下方式抓取 Pod：\n\n\
  ```\nscrape_configs:\n  - job_name: 'pods'\n    kubernetes_sd_configs:\n      -\
  \ role: pod\n```\n\n### The endpoints role\n\n*endpoints* 角色从 Kubernetes 集群中的服务端点查找目标。对于每个端点地址，每个端口都会发现一个目标。你可以按如下方式抓取端点：\n\
  \n```\nscrape_configs:\n  - job_name: 'k8apiserver'\n    kubernetes_sd_configs:\n\
  \      - role: endpoints\n    scheme: https\n    tls_config:\n      ca_file: cert.crt\n\
  ```\n\n### The ingress role\n\n最后，*ingress* 角色为每个 ingress 的每个路径发现一个目标。此角色也是执行 ingress\
  \ 不透明监控的一种方式。你可以按如下方式抓取 ingress：\n\n```\nscrape_configs:\n  - job_name: 'gateway'\n\
  \    kubernetes_sd_configs:\n      - role: ingress\n    scheme: https\n    tls_config:\n\
  \      ca_file: cert.crt\n```\n\n在深入介绍指标之后，让我们看看云原生应用中日志是如何实现的。\n\n### Logging in\
  \ the Cloud Native World\n\n日志是任何环境中的关键信息。它们主要由工程师在排除问题或深入了解系统时使用。但日志记录通常很复杂。复杂性源于各种日志消费方式、数据格式差异，以及确保负责存储日志的底层应用程序也能随着日志数量增长而良好扩展的需求。在云原生分布式环境中，日志记录变得更加重要。\n\
  \n\n\n\n\n不仅这些环境拥有众多活动部件，而且它们也更加复杂，因为现在系统是分布式且临时的，如 Kubernetes Pod。这意味着日志需要被传输出去并集中存储，以便日后查看。\n\
  \n为了解决云原生环境中大规模日志记录的问题，我们需要一种可以轻松部署到环境中并无缝集成的解决方案。这就是 Fluentd 登场的时刻。\n\n### 使用 Fluentd\
  \ 进行日志记录\n\nFluentd 是 CNCF 的一个开源项目，可以收集、解析、转换和分析日志。Fluentd 基本上通过将数据结构化为 JSON（见图\
  \ 6-5）充当统一的日志层。这反过来有助于它在多个来源和目的地之间收集、过滤、缓冲和输出日志。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_198_0.png)\n\
  \n图 6-5. Fluentd 作为日志层\n\nFluentd 用 CRuby 编写，CRuby 是 Ruby 编程语言的 C 实现，内存占用小，仅为 30\
  \ 到 40 MB，并且每个核心每秒处理大约 13K 个事件。让我们来看看 Fluentd 的一些核心概念，以及它如何用于在云原生环境中启用日志记录。\n\n\
  首先，根据你的操作系统发行版，从官方 Fluentd 网站安装代理：https://docs.fluentd.org/installation。\n\n####\
  \ NOTE\n\n官方稳定的 Fluentd 分发包称为 td-agent。它确保稳定性，并附带了原始作者 Treasure Data Inc 推荐的预配置设置。\n\
  \n下载并为你的发行版安装 td-agent 后，确保它正在运行。例如，在 macOS 上你可以通过 launchctl 来实现：\n\n```\n$ ~ sudo\
  \ launchctl load /Library/LaunchDaemons/td-agent.plist\nPassword:\n$\n```\n\n你可以通过以下位置的日志确认代理是否正在运行：\n\
  \n```\n$ ~ tail -f /var/log/td-agent/td-agent.log\n2020-12-17 22:57:46 +0530 [info]:\
  \ adding match pattern=\"td.*.*\" type=\"tdlog\"\n2020-12-17 22:57:46 +0530 [warn]:\
  \ #0 [output_td] secondary type should be same with primary one primary=\"Fluent::Plugin::TreasureDataLogOutput\"\
  \ secondary=\"Fluent::Plugin::FileOutput\"\n2020-12-17 22:57:46 +0530 [info]: adding\
  \ match pattern=\"debug.**\" type=\"stdout\"\n2020-12-17 22:57:46 +0530 [info]:\
  \ adding source type=\"forward\"\n2020-12-17 22:57:46 +0530 [info]: adding source\
  \ type=\"http\"\n2020-12-17 22:57:46 +0530 [info]: adding source type=\"debug_agent\"\
  \n2020-12-17 22:57:46 +0530 [info]: #0 starting fluentd worker pid=96320 ppid=95841\
  \ worker=0\n2020-12-17 22:57:47 +0530 [info]: #0 [input_debug_agent] listening dRuby\
  \ uri=\"druby://127.0.0.1:24230\" object=\"Fluent::Engine\"\n2020-12-17 22:57:47\
  \ +0530 [info]: #0 [input_forward] listening port port=24224 bind=\"0.0.0.0\"\n\
  ```\n\n```\n2020-12-17 22:57:47 +0530 [info]: #0 fluentd worker is now\nrunning\
  \ worker=0\n```\n\nFluentd 最好通过其配置文件来理解。你可以在 /etc/td-agent/td-agent.conf 找到 Fluentd\
  \ 的默认配置文件。配置文件包含许多指令，如以下小节所述。\n\n### source 指令（所有数据的摄入位置）\n\nsource 指令确定需要启用的数据输入源（即数据需要从何处摄入）。source\
  \ 指令将事件提交到 Fluentd 路由系统。默认情况下，Fluentd 提供两个标准输入插件。http 插件提供 HTTP 端点以监听传入的 HTTP 消息；forward\
  \ 插件提供 TCP 端点以接受 TCP 数据包：\n\n```\n<source>\n@type forward\nport 24224\n</source>\n\
  ```\n\n```\n<source>\n@type http\nport 9999\nbind 0.0.0.0\n</source>\n```\n\n前面的定义指定了两个源：在第一个源中，我们从\
  \ TCP 端口 24224 接收事件，在第二个源中，我们有一个 HTTP 服务器监听 TCP 端口 9999。\n\nsource 提交给 Fluentd 路由引擎的事件包含三个实体：tag、time\
  \ 和 record。例如，在以下日志输出中：\n\n```\n2020-12-16 15:38:27 +0900 test.root: {\"action\"\
  :\"logout\",\"user\":3}\n```\n\n2020-12-16 15:38:27 +0900 是时间，由输入插件指定，必须采用 Unix\
  \ 时间格式；test.root 是标签（根据 Fluentd，强烈建议标签采用小写且由数字和下划线混合组成）；而 {\"action\":\"logout\"\
  ,\"user\":3} 是一个 JSON 对象。\n\n输入插件负责从外部源检索事件日志。通常，输入插件会创建一个线程、一个套接字和一个监听套接字。输入插件不仅限于\
  \ http 和 forward。以下是一些额外的插件：\n\n#### in_syslog\n\n用于通过 Syslog 协议在 UDP 或 TCP 上检索日志事件。Fluentd\
  \ 在端口 5140 上创建一个套接字；然后，你只需设置你的 syslog 守护进程在该套接字上发送日志事件即可：\n\n```\n<source>\n  @type\
  \ syslog\n  port 5140\n  bind 0.0.0.0\n  tag system\n</source>\n```\n\n#### in_tail\n\
  \n允许 Fluentd 读取日志文件的尾部，就像 Unix tail -f 命令一样：\n\n```\n<source>\n  @type tail\n  path\
  \ /var/log/httpd-access.log\n  pos_file /var/log/td-agent/httpd-access.log.pos\n\
  ```\n\n```\ntag apache.access\n<parse>\n    @type apache2\n</parse>\n</source>\n\
  ```\n\nFluentd 提供额外的输入插件，例如 in_unix 用于从 Unix 域套接字检索记录，以及 in_exec 用于执行外部程序并提取事件日志。你甚至可以编写自己的自定义输入插件。\n\
  \n### match 指令（对输入数据做什么）\n\nmatch 指令通过查找具有匹配标签的事件来确定输出目的地。Fluentd 的标准输出插件包括 file\
  \ 和 forward。match 指令必须包含一个匹配模式和一个 @type 参数，该参数定义要使用的输出插件。一旦具有标签的事件与模式匹配，它将被发送到输出目的地。以下是\
  \ match 指令的示例用法：\n\n```\n<match mywebapp.access>\n    @type file\n    path /var/log/mywebapp/access\n\
  </match>\n```\n\n在前面的配置中，我们匹配标记为 mywebapp.access 的事件，并将它们存储在文件 /var/log/mywebapp/access\
  \ 中。\n\n除了 file 和 forward 之外，你还可以拥有其他类型的输出插件，它们基本上决定了你想要将数据写入的位置。例如，out_elasticsearch\
  \ 是一个输出插件，将记录写入 Elasticsearch 集群端点。你首先需要使用以下命令安装插件：\n\n```\nfluent-gem install fluent-plugin-elasticsearch\n\
  ```\n\n然后你可以使用以下配置将输出数据发送到 Elasticsearch 端点：\n\n```\n<match my.logs>\n  @type elasticsearch\n\
  \  host 192.168.23.13\n  port 9200\n  logstash_format true\n</match>\n```\n\n同样，你可以使用\
  \ out_copy 将事件复制到多个输出，使用 out_kafka2 将记录发送到 Kafka 集群，使用 out_mongo 将记录写入 MongoDB 数据库，以及使用\
  \ stdout 将事件简单地写入标准输出。\n\n### filter 指令（事件处理管道）\n\nfilter 指令就像一条规则，根据条件通过或拒绝事件。filter\
  \ 的语法与 match 相同，但 filter 可以链接到处理管道。你可以按如下方式添加 filter：\n\n```\n<source>\n  @type\
  \ http\n  port 9999\n  bind 0.0.0.0\n</source>\n```\n\n```\n<filter test.session>\n\
  \  @type grep\n  <exclude>\n    key action\n    pattern ^logout_session$\n  </exclude>\n\
  </filter>\n```\n\n```\n<match test.session>\n  @type stdout\n</match>\n```\n\n在前面的配置中，一旦数据被源化，它会经过\
  \ filter 部分然后是 match 部分。filter 将根据其类型和规则接受或拒绝事件。在这里我们丢弃了 logout_session 操作，并在 filter\
  \ 中使用类型 grep 来排除 action 键具有 logout 字符串的任何消息。\n\n以下是一些额外的 filter 插件：\n\nfilter_record_transformer\n\
  \n用于更改传入的事件流。你可以使用以下配置示例用于 record_transformer：\n\n```\n<filter myweb.access>\n \
  \   @type record_transformer\n    <record>\n        host_param \"#{Socket.gethostname}\"\
  \n    </record>\n</filter>\n```\n\n在前面的配置中，record_transformer 将向日志事件添加 host_param\
  \ 字段。\n\nfilter_geoip\n\n使用 MaxMind GeoIP 数据库向日志添加地理位置信息。\n\nfilter_stdout\n\n将事件打印到标准输出，主要用于调试目的。\n\
  \n\n\n\n\n### system directive（设置系统范围配置）\n\n你可以使用 system directive 设置各种系统范围的配置。system\
  \ directive 中可用的配置选项包括：\n\n- log_level\n- suppress_repeated_stacktrace\n- emit_error_log_interval\n\
  - suppress_config_dump\n- without_source\n- process_name\n\n你可以使用如下方式使用系统配置：\n\n\
  ```\n<system>\n  process_name my_app\n  log_level error\n  without_source\n</system>\n\
  ```\n\n这里我们首先将 supervisor 和 worker 进程名称设置为 my_app，然后将默认日志级别设置为 error。我们还指示 Fluentd\
  \ 在没有任何输入插件的情况下启动。\n\n### label directive（用于输出分组和路由）\n\n标签主要通过允许路由部分不遵循配置文件中自上而下的解析顺序来解决维护和管理配置文件的问题。你也可以将标签视为\
  \ go-to 语句。以下是使用标签的简单配置示例：\n\n```\n<source>\n  @type http\n  bind 0.0.0.0\nport\
  \ 9999\n@label @MYCLUE\n</source>\n\n<filter test.session>\n    @type grep\n   \
  \ <exclude>\n        key action\n        pattern ^login$\n    </exclude>\n</filter>\n\
  \n<label @MYCLUE>\n    <filter test.session>\n        @type grep\n        <exclude>\n\
  \            key action\n            pattern ^logout$\n        </exclude>\n    </filter>\n\
  \n    <match test.session>\n        @type stdout\n    </match>\n</label>\n```\n\n\
  在前面的配置中，source 下的 @label 参数是向 @MYCLUE 标签部分的重定向。控制流将跳过 login 的 filter 定义，并直接移动到 @MYCLUE\
  \ 标签。\n\n### @include directive（导入配置文件）\n\n使用 @include directive，你可以从单独的目录导入配置文件。@include\
  \ directive 支持如下的常规文件路径、glob 模式和 HTTP URL 规范：\n\n```\n### absolute path\n@include\
  \ /path/to/config.conf\n\n### if using a relative path, the directive will use\n\
  ### the dirname of this config file to expand the path\n@include extra.conf\n\n\
  ### glob match pattern\n@include config.d/*.conf\n\n### http\n@include http://example.com/fluent.conf\n\
  ```\n\n在继续之前，让我们快速了解一下如何运行 agent 来查看日志。要运行如下的简单配置：\n\n```\n<source>\n  @type http\n\
  \  port 9999\n  bind 0.0.0.0\n</source>\n\n<filter myapp.test>\n  @type grep\n \
  \ <exclude>\n    key action\n    pattern ^logout$\n  </exclude>\n</filter>\n\n<match\
  \ myapp.test>\n  @type stdout\n</match>\n```\n\n你需要将前面的配置替换到默认位置 /etc/td-agent/td-agent.conf。你现在可以在\
  \ macOS 上按如下方式重新加载 td-agent：\n\n```\n$ sudo launchctl load /Library/LaunchDaemons/td-agent.plist\n\
  #check logs\n$ tail -f /var/log/td-agent/td-agent.log\n2020-12-21 12:21:57 +0530\
  \ [info]: parsing config file is succeeded path=\"/etc/td-agent/td-agent.conf\"\n\
  2020-12-21 12:21:58 +0530 [info]: using configuration file:\n<ROOT>\n  <source>\n\
  \    @type http\n    port 9999\n    bind \"0.0.0.0\"\n  </source>\n  <filter myapp.test>\n\
  \    <exclude>\n        key \"action\"\n        pattern ^logout$\n    </exclude>\n\
  </filter>\n<match myapp.test>\n    @type stdout\n</match>\n</ROOT>\n2020-12-21 12:21:58\
  \ +0530 [info]: starting fluentd-1.0.2\npid=43215 ruby=\"2.4.2\"\n2020-12-21 12:21:58\
  \ +0530 [info]: spawn command to main:\ncmdline=[\"/opt/td-agent/embedded/bin/ruby\"\
  , \"-Eascii-8bit:ascii-8bit\", \"/opt/td-agent/usr/sbin/td-agent\", \"--log\", \"\
  /var/log/td-agent/td-agent.log\", \"--use-v1-config\", \"--under-supervisor\"]\n\
  2020-12-21 12:21:58 +0530 [info]: gem 'fluent-plugin-elasticsearch' version '2.4.0'\n\
  2020-12-21 12:21:58 +0530 [info]: gem 'fluent-plugin-kafka' version '0.6.5'\n2020-12-21\
  \ 12:21:58 +0530 [info]: gem 'fluent-plugin-rewrite-tag-filter' version '2.0.1'\n\
  2020-12-21 12:21:58 +0530 [info]: gem 'fluent-plugin-s3' version '1.1.0'\n2020-12-21\
  \ 12:21:58 +0530 [info]: gem 'fluent-plugin-td' version '1.0.0'\n2020-12-21 12:21:58\
  \ +0530 [info]: gem 'fluent-plugin-td-monitoring' version '0.2.3'\n2020-12-21 12:21:58\
  \ +0530 [info]: gem 'fluent-plugin-webhdfs' version '1.2.2'\n2020-12-21 12:21:58\
  \ +0530 [info]: gem 'fluentd' version '1.0.2'\n2020-12-21 12:21:58 +0530 [info]:\
  \ adding filter\npattern=\"myapp.test\" type=\"grep\"\n2020-12-21 12:21:58 +0530\
  \ [info]: adding match\npattern=\"myapp.test\" type=\"stdout\"\n2020-12-21 12:21:58\
  \ +0530 [info]: adding source type=\"http\"\n2020-12-21 12:21:58 +0530 [info]: #0\
  \ starting fluentd worker\npid=43221 ppid=43215 worker=0\n2020-12-21 12:21:58 +0530\
  \ [info]: #0 fluentd worker is now running worker=0\n```\n\n现在你可以运行以下 curl 命令来模拟不同的操作：\n\
  \n```\n$ curl -i -X POST -d 'json={\"action\":\"login\",\"user\":2}' http://localhost:9999/myapp.test\n\
  ```\n\n```\nHTTP/1.1 200 OK\nContent-Type: text/plain\nConnection: Keep-Alive\n\
  Content-Length: 0\n```\n\n由于我们当前传递的 action 为 `login`，我们可以检查日志位置以验证它们是否已打印：\n\n```\n\
  2020-12-21 12:31:31.529967000 +0530 myapp.test:\n{\"action\":\"login\",\"user\"\
  :2}\n```\n\n如果你尝试在以下 curl 命令中发布 action 为 `logout`，它将根据我们指定的 filter 规则被丢弃，你将无法看到任何日志被打印：\n\
  \n```\n$ curl -i -X POST -d 'json={\"action\":\"logout\",\"user\":2}' http://localhost:9999/myapp.test\n\
  HTTP/1.1 200 OK\nContent-Type: text/plain\nConnection: Keep-Alive\nContent-Length:\
  \ 0\n```\n\n现在你了解了 Fluentd 的工作原理，让我们来研究如何在云原生环境中集成它并在像 Kubernetes 这样的容器编排器上部署它。\n\
  \n### Fluentd on Kubernetes\n\n默认情况下，在 Kubernetes 中，容器中的日志会写入标准输出和标准错误流。这是 Kubernetes\
  \ 开箱即用的基本 I/O 日志记录。容器引擎将流重定向到 Kubernetes 中配置的日志驱动程序，以将日志以 JSON 格式写入文件。作为用户，如果你想查看日志，可以使用\
  \ `kubectl logs` 命令。然而，这种方法的问题非常明显：如果容器崩溃，或者 Pod 被驱逐，或者节点本身死亡，你将无法再访问应用程序日志。因此，日志应该具有独立于容器、Pod\
  \ 和节点的存储。这种概念正式被称为 *cluster-level logging*，它需要一个单独的后端来存储、分析和查询日志。虽然 Kubernetes 本身并不提供集群级日志记录的解决方案，但我们可以将\
  \ Fluentd 与 Elasticsearch 等存储解决方案结合起来构建一个可扩展的解决方案。\n\n在继续介绍在 Kubernetes 上部署 Fluentd\
  \ 的首选方式之前，让我们先看看集群级日志记录可以通过哪些不同方法实现，以及它们的优缺点。基本上构建集群级日志记录解决方案有两种方式：\n\n- 在每个应用程序\
  \ Pod 中使用一个 sidecar 容器。\n- 使用在每个节点上运行的节点级日志代理。\n\n让我们更详细地了解一下这两种解决方案。\n\n### Sidecar\
  \ container approach\n\n通常，在 Kubernetes 中你会在 Pod 中运行应用程序，如第 5 章所述。在 sidecar 方法中，你可以在应用程序\
  \ Pod 内创建一个或多个 sidecar 容器。sidecar 容器方法可以用两种不同的方式使用：\n\n- 你可以使用 sidecar 容器将应用程序日志流式传输到容器的自己的\
  \ stdout。\n- 你可以在 sidecar 容器中运行一个日志代理，该代理基本上从应用程序容器中获取日志并将其发送到日志后端。\n\nsidecar 容器方法有一些优点：\n\
  \n- 你可以通过拥有两个 sidecar 容器来流式传输特定日志文件到不同的日志流，从而将以不同日志格式产生的应用程序日志发送出去（结构化或非结构化）。\n\
  - Sidecar 容器可以从文件、套接字或 journald 读取日志，并且每个 sidecar 容器会将日志打印到 stdout 和 stderr\n\n\n\
  \nstreams.\n\n- Sidecar 容器也可以用来轮换应用程序本身无法轮换的日志文件。\n\n运行 sidecar 容器也有一些缺点：\n\n- 在将日志写入文件然后再流式传输到\
  \ stdout 的场景中，磁盘 I/O 可能显著增加。\n\n- 由于运行应用程序的 Pod 不止一个，因此您还需要在每个 Pod 中部署多个 sidecar\
  \ 容器。\n\n### Node-level logging agent approach\n\n另一种处理 Kubernetes 中日志的方法是在 Kubernetes\
  \ 集群的每个节点上部署一个日志代理。代理可以作为容器运行到守护进程，该守护进程可以访问应用程序 Pod 产生的所有日志。事实上，这也是运行 Fluentd 代理的首选方式。\n\
  \nKubernetes DaemonSet 用于实现这种策略，其中每个节点都可以运行一个 Fluentd 日志代理 Pod 的副本。Fluentd 官方提供了一个具有正确规则的\
  \ DaemonSet，可部署在 Kubernetes 集群上。您可以通过从官方 Fluentd 仓库克隆来获取 DaemonSet 的副本：\n\n```\n\
  $ git clone https://github.com/fluent/fluentd-kubernetes-daemonset\n```\n\n在使用上述\
  \ DaemonSet 之前，您需要一个 Kubernetes 集群。如果您已经运行了 Azure Kubernetes 集群（例如 Azure Kubernetes\
  \ Service [AKS]），您可以开始部署用于存储日志文件的日志后端。Elasticsearch 是可用于存储生成的日志的日志后端之一。您可以使用 Helm\
  \ 在 Kubernetes 上按如下方式部署 Elasticsearch：\n\n```\n$ helm repo add elastic https://helm.elastic.co\n\
  $ helm install elasticsearch elastic/elasticsearch\n```\n\n您可以使用端口转发来检查 Elasticsearch\
  \ 集群是否已成功部署：\n\n```\n$ kubectl port-forward svc/elasticsearch-master 9200\nForwarding\
  \ from 127.0.0.1:9200 -> 9200\nForwarding from [::1]:9200 -> 9200\nHandling connection\
  \ for 9200\nHandling connection for 9200\n```\n\nElasticsearch 应可在 http://localhost:9200\
  \ 上使用。要部署 Fluentd DaemonSet，您首先需要在 fluentd-daemonset-elasticsearch-rbac.yaml 文件中修改以下环境变量：\n\
  \n- FLUENT_ELASTICSEARCH_HOST（Elasticsearch 端点）\n- FLUENT_ELASTICSEARCH_PORT（Elasticsearch\
  \ 端口，通常为 9200）\n\n在您使用 Elasticsearch 详细信息更新 YAML 文件后，您可以通过移动到 GitHub 仓库并按如下方式应用\
  \ DaemonSet 来在 AKS 上部署 Fluentd DaemonSet：\n\n```\n$ kubectl apply -f fluentd-daemonset-elasticsearch-rbac.yaml\n\
  ```\n\n这将在 Kubernetes 集群上部署 Fluentd DaemonSet，并且每个节点现在将至少运行一个 Fluentd Pod，该 Pod\
  \ 将把您的日志转发到 Elasticsearch：\n\n```\n$ ~ kubectl get pods --namespace=kube-system\
  \ -o wide\nNAME                          READY   STATUS    RESTARTS   AGE\nIP  \
  \           NODE                                      NOMINATED NODE   READINESS\
  \ GATES\nfluentd-6pttr                  1/1     Running   2          3h37m   10.240.0.27\
  \   aks-agentpool-25245360-vmss000000   <none>\nfluentd-9fj59                  1/1\
  \     Running   1          3h37m   10.240.0.147  aks-agentpool-25245360-vmss000001\
  \   <none>\n<none>\nfluentd-dh7pn                    1/1     Running   1\n139m \
  \   10.240.1.84    aks-agentpool-25245360-vmss000003    <none>\n<none>\nfluentd-g5cnv\
  \                    1/1     Running   2\n3h37m    10.240.1.25    aks-agentpool-25245360-vmss000002\
  \    <none>\n<none>\nfluentd-mzw2j                    1/1     Running   2\n139m\
  \    10.240.2.0    aks-agentpool-25245360-vmss000004    <none>\n<none>\nfluentd-z52r2\
  \                    1/1     Running   2\n139m    10.240.2.143    aks-agentpool-25245360-vmss000005\
  \    <none>\n<none>\nkube-proxy-56bv2                 1/1     Running   0\n139m\
  \    10.240.2.47    aks-agentpool-25245360-vmss000005    <none>\n<none>\n```\n\n\
  您还需要查看这些日志，您可以通过使用 Kibana 来实现。³ 您可以使用 Helm 类似地部署 Kibana 并按如下方式本地端口转发：\n\n```\n$\
  \ helm repo add elastic https://helm.elastic.co\n$ helm install kibana elastic/kibana\n\
  $ kubectl port-forward deployment/kibana-kibana 5601\nForwarding from 127.0.0.1:5601\
  \ -> 5601\nForwarding from [::1]:5601 -> 5601\n```\n\nKibana（图 6-6）现在应在您的 http://localhost:5601\
  \ 上启动并运行。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_214_0.png)\n\n图 6-6. 使用 Kibana\
  \ 展示日志\n\n另一个新的日志聚合工具是 Grafana Labs 的 Loki⁴。Loki 高效地记录特定的日志标签而不是整个日志流，并且可以轻松地与 Fluentd\
  \ 集成。我们不会深入探讨这个主题，因为它超出了本书的范围。\n\n现在您了解了云原生环境中日志的工作原理，让我们通过讨论分布式追踪来结束本章。\n\n###\
  \ Distributed Tracing in the Cloud Native World\n\n分布式追踪是为现代云原生应用程序提供和构建可观测性的关键支柱之一。分布式追踪使您能够跟踪请求在分布式系统中流经多个服务时的流程，并发出元数据信息，例如每个服务花费的时间以及对其他服务端点的底层调用详细信息。此元数据可以稍后重新组装，以提供应用程序在运行时行为的更完整图景，这可以帮助您解决诸如精确定位应用程序延迟问题和定位瓶颈等问题。\n\
  \n分布式追踪回答重要问题，例如：\n\n- 服务中的瓶颈是什么？\n- 在分布式系统的每个阶段/服务中花费了多少时间？\n- 上游和下游服务是什么，一个请求触及了哪些端点？\n\
  \n为了更好地理解分布式追踪的基础知识，请查看图 6-7 所示的简单 Web 应用程序。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_215_0.png)\n\
  \n图 6-7. 一个简单的 Web 应用程序展示请求通过各个服务层传播\n\n参考图 6-7，假设您有一个示例服务，该服务根据用户的计划在云上配置一些资源。执行的正常流程始于客户端向负载均衡器发出请求，负载均衡器与身份验证服务和计费服务通信，并通过对资源分配服务进行最终调用来为客户端分配资源。在图\
  \ 6-8 中，您可以看到在流程中传播的唯一请求 ID，这有助于稍后拼接跟踪。\n\n该事务流程可以使用甘特图可视化（见图 6-8）。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_216_0.png)\n\
  \n图 6-8. 简单 Web 应用程序中的 Span 和 Trace\n\n### Tracing: Key Concepts\n\n图 6-8 中的甘特图总结了分布式追踪系统的以下重要关键概念。\n\
  \n#### Spans\n\nSpan 代表单个操作调用，是分布式追踪的主要构建块，表示分布式系统中完成的工作单元。Span 包含对其他 Span 的引用，这使得多个\
  \ Span 可以组装成一个完整的 Trace。例如，在图 6-8 中，Span“负载均衡器从开始到结束的交易”包括其他 Span，例如负载均衡器与身份验证服务交互或负载均衡器与计费服务交互。\n\
  \nSpan 以父子关系的形式创建，其中每个 Span 都有一个子 Span，除了根和起始服务（图 6-9）。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_217_0.png)\n\
  \n图 6-9. Span 的解剖结构\n\n#### Traces\n\nTrace 代表请求在遍历过程中触及的所有服务的完整旅程。单个完整的 Trace 通常由请求对应的多个\
  \ Span 组成。例如，客户端从开始到结束的完整交易由多个 Span 组成。\n\n#### Context propagation\n\n每次服务向下游服务发出请求时，都会将全局请求执行标识符作为元数据传递，该标识符对每个请求都是唯一的。此全局请求执行标识符稍后用于通过基于请求标识符对记录进行分组来重建请求的完整执行。将执行标识符作为请求元数据传递的过程称为\
  \ *分布式上下文传播*。\n\n在 Span 之间传播的元数据还包括 Trace ID 和 Span ID 以及另外两个详细信息：标签和日志。*标签* 是可以添加到\
  \ Span 以提供额外信息（如错误代码和主机详细信息）的键值对。*日志* 也是键值对，捕获 Span 特定的日志消息并有助于调试。\n\n#### Sampling\n\
  \n在内存中收集所有数据然后发送到追踪后端会对网络、应用程序延迟和成本产生严重影响。为了避免这个问题，追踪系统实现了采样。采样是从收集和存储所有追踪数据中仅收集和存储追踪数据的一个子集，以避免存储成本和性能开销的过程。有各种类型的采样方法，主要分为基于头部或基于尾部的采样。例如，如果您想每分钟收集\
  \ x 个 Trace，您可以使用一种称为 *速率限制* 的采样类型。同样，如果您想在某种类型的错误变得突出时采样 Trace，您可以使用 *上下文敏感采样*。\n\
  \n### General Tracing System Architecture and Trace Assembly\n\n\n\n\n\n要实现云原生环境中的追踪系统，可以利用已有的开源库（我们将在下一节进一步讨论），这些库可以帮助你在不重复造轮子的情况下为应用程序进行\
  \ instrumentation。一般来说，大多数追踪系统都有一个简单的架构，如图 6-10 所示。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_219_0.png)\n\
  \n图 6-10. 通用的分布式追踪系统架构\n\n要使用分布式追踪，首先需要使用客户端库对应用程序代码进行 instrumentation。客户端库有多种语言可用，包括\
  \ Java、Go 和 Python。该库将数据发送到代理，该代理通常位于同一实例或主机上。代理负责将追踪数据转发到后端（例如，通过异步缓冲层转发到存储层）。之后，追踪数据将被重建并显示给用户界面。追踪数据还可用于使用数据挖掘技术进行进一步的分析和聚合。\n\
  \n追踪是通过查看请求中的以下内容来组装的：\n\n#### 入站请求 span\n\n当请求进入服务时，追踪系统会检查请求是否附带了追踪头。如果没有附带追踪头，则会创建根\
  \ span；否则，需要创建子 span。\n\n#### 出站请求 span\n\n如果请求从一个服务发出到另一个服务，首先会创建 span，并且接收服务会按入站请求\
  \ span 中所述继续追踪。\n\n你可以在云环境中以多种方式实现分布式追踪。我们将在下一节中查看其中的一些方法。\n\n### 追踪标准、工具和代码 Instrumentation\n\
  \n多年来，分布式追踪已经发展并成为云原生世界中分析应用程序和监控应用程序的标准方式。2016 年，OpenTracing 成为 CNCF 项目，其唯一目标是为分布式追踪提供厂商无关的规范。在此期间，Google\
  \ 正在开发一个名为 OpenCensus 的开源社区项目，后来由 Microsoft 主导。\n\nOpenTracing 和 OpenCensus 是两个竞争的框架；它们的架构不同，但基本上解决了相同的问题。两种标准的存在导致了对支持和贡献的不确定性，这导致了行业内缺乏广泛采用。2019\
  \ 年 5 月，CNCF 宣布将 OpenTracing 和 OpenCensus 合并为一个名为 OpenTelemetry 的单一标准。OpenTelemetry\
  \ 结合了之前标准的优点，并得到社区的支持。在本节中，我们将了解如何使用 OpenTracing 和 OpenTelemetry 对基本应用程序代码进行 instrumentation。\n\
  \n今天最流行和实用的两个追踪工具是 Zipkin 和 Jaeger。Zipkin 是由 Google 的 Dapper 追踪基础设施开发的第一个追踪系统。⁵\
  \ Jaeger 由 Uber 开发并得到 CNCF 支持。Jaeger 实现了 OpenTracing 规范，其首选部署方式是 Kubernetes。我们将讨论限制在\
  \ Jaeger。\n\nJaeger 密切遵循追踪系统的通用架构，它由三个主要组件组成：收集器、查询服务和 UI。它在每个主机上部署一个代理，该代理基本上聚合追踪数据并将其发送到收集器（缓冲服务）。追踪数据然后可以存储在数据库中，最好是\
  \ Elasticsearch 或 Cassandra。\n\n让我们现在看看一些可以用来用不同的追踪标准和 Jaeger 对代码进行 instrumentation\
  \ 的简单方法。\n\n例如，我们可以使用 Python Jaeger 客户端：\n\n```\n$ pip install jaeger-client\n```\n\
  \n从那里，我们可以在一个单一的 Docker 镜像中运行所有 Jaeger 组件：\n\n```\n$ docker run -d -p6831:6831/udp\
  \ -p16686:16686 jaegertracing/all-in-one:latest\n```\n\n我们可以使用 docker ps 检查 Docker\
  \ 容器：\n\n```\n$ ~ docker ps -a\nCONTAINER ID   IMAGE                     COMMAND\
  \                  CREATED          STATUS            PORTS                    \
  \                                             NAMES\n874b2a03ebaa   jaegertracing/all-in-one:latest\
  \   \"/go/bin/all-in-one-...\"   About a minute ago   Up About a minute   5775/udp,\
  \ 5778/tcp, 14250/tcp, 6832/udp, 14268/tcp, 0.0.0.0:6831->6831/udp, 0.0.0.0:16686->16686/tcp\
  \   jolly_mclean\n```\n\n你可以通过 http://localhost:16686 本地访问 Jaeger UI。\n\n现在让我们讨论如何借助\
  \ OpenTracing 对简单应用程序代码进行 instrumentation。在以下示例中，我们有一个电影预订程序，它有一些方法负责检查电影是否可用。如果可用，它会预订票：\n\
  \n```\nimport sys\nimport time\nimport logging\nimport random\nfrom jaeger_client\
  \ import Config\nfrom opentracing_instrumentation.request_context import\nget_current_span,\
  \ span_in_context\n\ndef initialize_tracer(service):\n    logging.getLogger('').handlers\
  \ = []\n    logging.basicConfig(format='%(message)s',\nlevel=logging.DEBUG)\n  \
  \  config = Config(\n        config={\n            'sampler': {\n              \
  \  'type': 'const',\n                'param': 1,\n            },\n            'logging':\
  \ True,\n        },\n        service_name=service,\n    )\n    return config.initialize_tracer()\n\
  \ndef booking_manager(movie):\n    with tracer.start_span('booking') as span:\n\
  \        span.set_tag('Movie', movie)\n        with span_in_context(span):\n   \
  \         get_cinema_details = check_movie(movie)\n            get_showtime_details\
  \ =\ncheck_movie_showtime(get_cinema_details)\n            book_movie_now(get_showtime_details)\n\
  \ndef check_movie(movie):\n    with tracer.start_span('CheckCinema',\nchild_of=get_current_span())\
  \ as span:\n        with span_in_context(span):\n            num = random.randint(1,30)\n\
  \            time.sleep(num)\n            cinema_details = \"Cinema Details\"\n\
  \            flags = ['false', 'true', 'false']\n            random_flag = random.choice(flags)\n\
  \            span.set_tag('error', random_flag)\n            span.log_kv({'event':\
  \ 'CheckCinema' , 'value':\ncinema_details })\n            return cinema_details\n\
  \ndef check_movie_showtime( cinema_details ):\n```\n\n```\nwith tracer.start_span('CheckShowtime',\n\
  child_of=get_current_span()) as span:\n    with span_in_context(span):\n       \
  \ num = random.randint(1,30)\n        time.sleep(num)\n        showtime_details\
  \ = \"Showtime Details\"\n        flags = ['false', 'true', 'false']\n        random_flag\
  \ = random.choice(flags)\n        span.set_tag('error', random_flag)\n        span.log_kv({'event':\
  \ 'CheckCinema' , 'value':\nshowtime_details })\n        return showtime_details\n\
  \ndef book_movie_now(showtime_details):\n    with tracer.start_span('BookShow',\n\
  child_of=get_current_span()) as span:\n        with span_in_context(span):\n   \
  \         num = random.randint(1,30)\n            time.sleep(num)\n            Ticket_details\
  \ = \"Ticket Details\"\n            flags = ['false', 'true', 'false']\n       \
  \     random_flag = random.choice(flags)\n            span.set_tag('error', random_flag)\n\
  \            span.log_kv({'event': 'CheckCinema' , 'value':\nshowtime_details })\n\
  \nassert len(sys.argv) == 2\ntracer = initialize_tracer('movie_booking')\nmovie\
  \ = sys.argv[1]\nbooking_manager(movie)\ntime.sleep(2)\ntracer.close()\n```\n\n\
  在前面的代码中，我们首先使用 initialize_tracer 方法初始化 tracer，该方法设置日志记录和采样的配置。代码中需要注意的另一点是我们如何使用\
  \ tracer 实例通过 start_span 启动新的 span，并使用 child_of 启动根 span 的新的子 span。例如，根 span 在 booking_manager\
  \ 方法中生成，其余方法（例如 check_movie_showtime 和 check_movie）主要是根 span 的子 span。\n\n我们还在方法中设置了标签和日志。例如：\n\
  \n```\n-> span.set_tag('error', random_flag)\n\n-> span.log_kv({'event': 'CheckCinema'\
  \ , 'value':\nshowtime_details })\n```\n\n你现在可以在 Python 控制台中简单地运行此程序，通过传递一个虚构的电影标题作为参数，如下所示：\n\
  \n```\n$ python jaeger_opentracing.py godfather\nInitializing Jaeger Tracer with\
  \ UDP reporter\nUsing sampler ConstSampler(True)\nopentracing.tracer initialized\
  \ to <jaeger_client.tracer.Tracer object at 0x10eeae410>[app_name=movie_booking]\n\
  Reporting span\nf99b147b abd58321:5ca566beb40e89b0:931be7dc309045fd:1\nmovie_booking.CheckCinema\n\
  Reporting span\nf99b147b abd58321:1ad5d00d2acbd02:931be7dc309045fd:1\nmovie_booking.CheckShowtime\n\
  Reporting span\nf99b147b abd58321:f36b9959f34f61dc:931be7dc309045fd:1\nmovie_booking.BookShow\n\
  Reporting span f99b147b abd58321:931be7dc309045fd:0:1\nmovie_booking.booking\n```\n\
  \n你现在可以访问 Jaeger UI 并在服务的下拉菜单中查找 movie_booking，然后你可以点击 Find Traces 按钮并看到追踪出现，如图\
  \ 6-11 所示。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_224_0.png)\n\n图 6-11. 电影预订服务的追踪\n\
  \n你可以看到图 6-11 中的四个 span，其中 movie_booking 是根 span，其余的是子 span。由于这是一个示例程序，为演示目的我们随机生成了一些错误并将其冒泡。在生产环境中，这些错误将\n\
  \n\n\nindicate problems that are occurring in the environment (e.g., Redis timing\
  \ out due to an I/O issue).\n\nWe can also instrument our code using OpenTelemetry,\
  \ since OpenTracing is now being phased out. First we would need to install the\
  \ OpenTelemetry API and SDK:\n\n```\npip install opentelemetry-api\npip install\
  \ opentelemetry-sdk\n```\n\nTo see how OpenTelemetry works, take a look at the following\
  \ Python code:\n\n```\nfrom opentelemetry import trace\nfrom opentelemetry.exporter\
  \ import jaeger\nfrom opentelemetry.sdk.trace import TracerProvider\nfrom opentelemetry.sdk.trace.export\
  \ import BatchExportSpanProcessor\n\ntrace.set_tracer_provider(TracerProvider())\n\
  \njaeger_exporter = jaeger.JaegerSpanExporter(\n    service_name=\"my-helloworld-service\"\
  ,\n    agent_host_name=\"localhost\",\n    agent_port=6831,\n)\n\ntrace.get_tracer_provider().add_span_processor(\n\
  \    BatchExportSpanProcessor(jaeger_exporter)\n)\n\ntracer = trace.get_tracer(__name__)\n\
  \nwith tracer.start_as_current_span(\"foo\"):\n    with tracer.start_as_current_span(\"\
  bar\"):\n        with tracer.start_as_current_span(\"tango\"):\n            print(\"\
  Hello world from Opentelemetry! Happy Tracing\")\n```\n\nThe preceding code is a\
  \ simple “hello world”-style Python script that uses OpenTelemetry. Note how we\
  \ are using the Jaeger exporter to tell us the location of the Jaeger agent.\n\n\
  You need Python3 to run the preceding script:\n\n```\n$ python3 opentelemetry_simple.py\n\
  Hello world from Opentelemetry! Happy Tracing\n```\n\nYou can view the spans being\
  \ populated on the UI again at the same Jaeger endpoint (http://localhost:16686)\
  \ under the my-helloworld-service service.\n\nYou can similarly instrument any code\
  \ depending on your application language. For example, you can instrument a Python\
  \ Flask application as follows:\n\n```\nimport flask\nimport requests\n\nfrom opentelemetry\
  \ import trace\nfrom opentelemetry.exporter import jaeger\nfrom opentelemetry.instrumentation.flask\
  \ import FlaskInstrumentor\nfrom opentelemetry.instrumentation.requests import RequestsInstrumentor\n\
  from opentelemetry.sdk.trace import TracerProvider\nfrom opentelemetry.sdk.trace.export\
  \ import (\n    ConsoleSpanExporter,\n    SimpleExportSpanProcessor,\n)\n\ntrace.set_tracer_provider(TracerProvider())\n\
  \njaeger_exporter = jaeger.JaegerSpanExporter(\n    service_name=\"flask_app_example\"\
  ,\n    agent_host_name=\"localhost\",\n    agent_port=6831,\n)\n\ntrace.get_tracer_provider().add_span_processor(\n\
  \    SimpleExportSpanProcessor(jaeger_exporter)\n)\n\napp = flask.Flask(__name__)\n\
  FlaskInstrumentor().instrument_app(app)\nRequestsInstrumentor().instrument()\n```\n\
  \n```\n@app.route(\"/\")\ndef hello():\n    tracer = trace.get_tracer(__name__)\n\
  \    with tracer.start_as_current_span(\"example-request\"):\n        requests.get(\"\
  http://www.example.com\")\n    return \"hello\"\n\napp.run(debug=True, port=5000)\n\
  ```\n\nYou can run the preceding script as follows, and hit http://localhost:5000\
  \ to generate traces in the Jaeger UI:\n\n```\n$ python3 opentelemetry_flask.py\n\
  * Serving Flask app \"opentelemetry_flask\" (lazy loading)\n* Environment: production\n\
  \  WARNING: This is a development server. Do not use it in a production deployment.\n\
  \  Use a production WSGI server instead.\n* Debug mode: on\n* Running on http://127.0.0.1:5000/\
  \ (Press CTRL+C to quit)\n* Restarting with stat\n* Debugger is active!\n* Debugger\
  \ PIN: 156-661-048\n127.0.0.1 - - [30/Dec/2020 20:54:37] \"GET / HTTP/1.1\" 200\
  \ -\n127.0.0.1 - - [30/Dec/2020 20:54:37] \"GET /favicon.ico HTTP/1.1\" 404 -\n\
  ```\n\nThese are a few ways you can use distributed tracing in your cloud native\
  \ environments to make them observable. Apart from the approaches mentioned here,\
  \ service meshes such as Istio also provide a sidecar implementation architecture\
  \ to perform distributed tracing. We will introduce service meshes in Chapter 7.\
  \ For more information on distributed tracing, please refer to *Mastering Distributed\
  \ Tracing* by Yuki Shkuro (Packt, 2019).\n\nNow let’s discuss what Azure has to\
  \ offer in the monitoring space.\n\n### Azure Monitor\n\nIn addition to the previously\
  \ mentioned tailor-made solutions for building observable systems, Microsoft Azure\
  \ also offers Azure Monitor, an off-the-shelf solution that can help you monitor\
  \ an application and infrastructure running in the cloud and in on-premises environments.\
  \ Azure Monitor primarily uses metrics and logs to find out how your application\
  \ is performing and proactively identifies potential issues affecting them along\
  \ with any resource dependency.\n\nAzure Monitor has various features which can\
  \ help you detect a variety of issues in your application and infrastructure, as\
  \ listed here and depicted in Figure 6-12:\n\n#### Application insights\n\nYou can\
  \ detect and diagnose issues across applications and dependencies by monitoring\
  \ the availability, performance, and usage of your web apps hosted in the cloud\
  \ or on premises.\n\n#### Azure Monitor for containers and virtual machines\n\n\
  You can monitor the performance of your containers running on AKS as well as the\
  \ virtual machine hosting them.\n\n#### Log analytics and log queries\n\nYou can\
  \ use Azure Monitor logs based on Azure Data Explorer to query logs.\n\n#### Workbooks\
  \ and dashboards\n\nYou can create flexible visualizations using workbooks and dashboards\
  \ for data analysis, which will allow you to tap into multiple data resources across\
  \ Azure.\n\n#### Azure Monitor metrics\n\nYou can use Azure Monitor metrics to collect\
  \ numerical data from your infrastructure and application.\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_229_0.png)\n\
  \nFigure 6-12. Azure Monitor\n\nAzure Monitor also allows you to consume distributed\
  \ trace data. There are primarily two ways to do this. The first is by using the\
  \ transaction diagnostics view, which is similar to a call stack with a time dimension\
  \ added in. The transaction diagnostics view provides visibility into one single\
  \ transaction/request, and is helpful for finding the root cause of reliability\
  \ issues and performance bottlenecks on a per-request basis. The second way is by\
  \ using the application map view, which aggregates many transactions to show a topological\
  \ view of how the systems interact, and what the average performance and error rates\
  \ are.\n\nFurthermore, you can integrate Azure Monitor with other systems and build\
  \ a custom observability platform that uses your monitoring data.\n\n### Summary\n\
  \nIn this chapter, we presented observability as a growing need in the cloud native\
  \ environment. We introduced observability and how it complements monitoring along\
  \ with how observability-driven development is the new true north for gaining insights\
  \ into your application and cloud infrastructure. We discussed the three pillars\
  \ of observability and introduced the preferred ways of logging, monitoring, and\
  \ tracing modern distributed systems over Azure. Lastly, we looked briefly at how\
  \ Azure offers its built-in solutions to perform some similar tasks with Azure Monitor.\
  \ With this knowledge under your belt, you can now confidently build observable\
  \ systems in cloud native environments and build observability into your application.\n\
  \nIn the next chapter, we will look at how service mesh and service discovery assist\
  \ in cloud native environments.\n\n- 1 You can read more about PromQL at https://prometheus.io/docs/prometheus/latest/querying/basics.\n\
  - 2 The Prometheus team has compiled best practices on the use of instrumentation\
  \ at https://prometheus.io/docs/practices/instrumentation/#counter-vs-gauge-summary-vs-histogram.\n\
  - 3 Kibana is an open source UI that is generally used to visualize data (logs).\
  \ More information is available at https://www.elastic.co/kibana.\n- 4 More information\
  \ on Loki is available at https://grafana.com/blog/2020/05/12/an-only-slightly-technical-introduction-to-loki-the-prometheus-inspired-open-source-logging-system.\n\
  - 5 https://research.google/pubs/pub36356\n"
- "## Chapter 7. Service Discovery and Service Mesh: Finding New Territories and Crossing\
  \ Borders\n\n### A NOTE FOR EARLY RELEASE READERS\n\nWith Early Release ebooks,\
  \ you get books in their earliest form—the author’s raw and unedited content as\
  \ they write—so you can take advantage of these technologies long before the official\
  \ release of these titles.\n\nThis will be the 7th chapter of the final book. Please\
  \ note that the GitHub repo will be made active later on.\n\nIf you have comments\
  \ about how we might improve the content and/or examples in this book, or if you\
  \ notice missing material within this chapter, please reach out to the editor at\
  \ rfernando@oreilly.com.\n\nAs modern applications moved to a microservices architecture,\
  \ they became scalable and efficient over the cloud. Microservices favor breaking\
  \ down an application into independent, decoupled components. Decoupling is usually\
  \ achieved by separating the codebases into standalone applications that are connected\
  \ using the network and well-defined APIs/interfaces that microservices use to communicate.\
  \ Once you move your applications to a microservices architecture, a lot of opportunities\
  \ open up: you can scale each individual service, decouple the release cycle for\
  \ each service, choose a different language to write your individual application\
  \ components, and even organize your team structure based on these independent services.\n\
  \n\n\n\n\n然而，现在你已经将应用程序拆分为更小的应用程序，这些二进制文件拥有各自的生命周期。该生命周期会独立调度并根据需要独立终止，同时通过网络保持通信。想象一下，在这种情况下，你运行着大量相互通信的微服务。你很可能会开始提出几个问题，包括以下问题：\n\
  \n- 当服务具有动态性时，服务之间如何相互通信？（也就是说，由于服务通过网络通信，IP地址不足以访问服务，因为它们可以独立终止并重新调度到不同的主机上。）\n\
  - 如何控制和管理流量或按需路由流量，包括金丝雀发布、A/B 测试和断路器等高级场景？\n- 如何确保服务之间的安全并加密它们之间的流量？\n\n为了解决这些问题，你可以开始在应用程序内编写和构建额外的基础设施特定逻辑。然而，这会使应用程序范围超出你的业务需求，并且你必须为使用的每个微服务栈实现此逻辑。\n\
  \n幸运的是，这些问题在云原生环境领域已通过服务发现和服务网格技术的帮助得到解决，这些技术提供了一种更灵活的方式来管理、保护服务并对服务提供更大的控制。\n\n\
  *服务发现*是一种服务相互发现以便通信的机制。服务发现主要关注在云中查找服务的网络位置。在传统环境中，你需要处理物理服务器，你知道服务器的静态IP地址，并且可以使用简单的配置文件存储\
  \ IP，这些 IP 可供你的服务用于访问其他服务。\n\n这种设置在本地或物理环境设置中运行良好。但对于云中高度可扩展的应用程序，这种方法会失败，因为现在你的应用程序具有动态性，这意味着应用程序可以根据需要重新启动、重新调度或终止。在这种情况下，不能硬编码\
  \ IP，因为它可能会更改。服务发现通过在云中为每个服务名称存储到 IP 地址的映射来提供帮助。\n\n*服务网格*专注于解决服务间通信带来的复杂性增加问题。服务网格是处理云环境中所有服务到服务网络通信的专用基础设施。它提供高可见性、弹性、流量管理和安全控制，而对现有应用程序代码几乎不需要或不需要更改。\n\
  \n在本章中，我们将介绍 CoreDNS，这是在云原生世界中一个突出的服务发现平台，被 Azure Kubernetes Service (AKS) 用于集群\
  \ DNS 管理和名称解析。我们还将介绍 Istio，这是一个在 Azure 等云环境中广泛使用的突出服务网格。\n\n### 服务发现\n\n服务发现是现代云原生环境的基本组件。它负责确保服务能够在网络上找到并相互通信。通常，服务发现涉及一个*服务注册表*，云环境中的所有服务/应用程序都需要在此注册。服务注册表是保存服务位置的中央存储库。在典型场景中，新服务首次进入环境时首先向服务注册表注册。服务注册表更新服务的最新网络位置，当消费者服务请求连接到该服务时，服务注册表会为消费者提供该服务的位置。\n\
  \n在本节中，我们将探索 CoreDNS，并了解它如何在云环境中用作服务发现工具。\n\n### CoreDNS 简介\n\nCoreDNS 是一个可扩展的 DNS\
  \ 服务器，支持标准 DNS、DNS over TLS 和 DNS over gRPC 协议。CoreDNS 由 Miek Gieben 于 2016 年创建，利用了作为\
  \ Caddy¹ Web 服务器的一部分开发的服务器框架。它具有高度可配置、灵活且可扩展的插件架构。CoreDNS 在获得 Cloud Native Computing\
  \ Foundation (CNCF) 的支持后获得了更广泛的采用。2019 年，CoreDNS 从 CNCF 获得了“毕业”成熟度级别。²\n\nCoreDNS\
  \ 现在是 Kubernetes 1.13 及更高版本的官方默认 DNS 服务器，取代了 kube-dns。CoreDNS 通过以下几个关键差异解决了 kube-dns\
  \ 原始实现中的可靠性和安全问题：\n\n- CoreDNS 运行单个容器，而 kube-dns 运行三个容器：kube-dns、dnsmasq 和 sidecar。\n\
  - CoreDNS 设计为可作为与 Kubernetes 向后兼容的通用 DNS 服务器使用。\n- CoreDNS 主要是一个 Go 进程，增强了 kube-dns\
  \ 的功能。\n\nCoreDNS 插件架构确保 DNS 服务器功能保持稳定，并使使用插件添加进一步功能成为可能。最终用户可以通过配置区域在特定端口上提供服务来定义多个服务器。每个服务器将请求通过插件链传递，以确定发送何种类型的响应：\n\
  \n- 如果配置了多个服务器监听查询端口，它将检查哪一个对查询具有最具体的区域，使用最长后缀匹配。例如，如果用户查询 www.health.abc.com 且配置了两个服务器\
  \ abc.com 和 health.abc.com，则查询将被路由到后者服务器。\n- 一旦找到合适的服务器，它将被路由通过为该服务器配置的插件链。\n\n\
  - 每个插件都会检查查询，并根据查询可能发生以下情况：\n  - 如果查询由插件处理，将向客户端发送适当的响应。查询处理在此停止，不再调用其他插件。\n  -\
  \ 如果查询未被插件处理，它将调用链中的下一个插件。如果链中最后一个插件也无法处理查询，CoreDNS 将向调用客户端返回 SERVFAIL。\n  - 如果查询使用\
  \ fall-through 方法处理，即链中其他插件也将被调用来查看查询，则使用关键字 `fallthrough` 来启用它。\n  - 如果查询使用提示处理，下一个链中的插件将始终被调用。但是，它会提供一个提示，允许它查看将返回给客户端的响应。\n\
  \n图 7-1 展示了 CoreDNS 处理查询时发生的步骤。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_236_0.png)\n\
  \n图 7-1. CoreDNS 查询过程\n\n现在让我们看看如何安装 CoreDNS 并使用配置文件，也称为 Corefile，来配置它。\n\n### 安装和配置\
  \ CoreDNS\n\n你可以通过使用二进制文件安装 CoreDNS，该二进制文件可在本书的 GitHub 位置³ 获取。一旦你为你的操作系统获取了二进制文件，你可以将其移动到本地\
  \ bin。例如，如果你下载了 macOS 的二进制文件 coredns_1.8.1_darwin_amd64.tgz，你可以解压文件并将其移动到 /usr/local/bin。验证\
  \ CoreDNS 是否正常工作，发出以下命令：\n\n```\n$ coredns -version\nCoreDNS-1.8.1\ndarwin/amd64,\
  \ go1.15.7, 95622f4\n```\n\nCoreDNS 提供了一堆由 Corefile 处理的配置选项。当 CoreDNS 启动时，如果未传递\
  \ -conf 标志，它会在当前目录中查找名为 Corefile 的文件。该文件主要定义以下内容：\n\n- 哪个服务器监听哪个端口\n- 每个服务器对哪个区域具有权威性\n\
  - 在服务器中加载哪些插件\n\nCorefile 通常看起来像这样：\n\n```\nZONE:[PORT] {\n  [PLUGIN]...\n}\n```\n\
  \n其中 ZONE 表示 DNS 区域，PORT 是区域服务器运行的位置（通常为端口 53），PLUGIN 定义用户需要加载的插件。\n\nCorefile 中最常见的条目之一是各种服务器块，它们在\
  \ CoreDNS 中定义一个服务器（即如何处理特定域名查询）。这里有一个例子：\n\n```\nexample.com {\n}\n```\n\n前面的服务器块将处理所有以\
  \ example.com 结尾的查询，除非存在更具体的服务器块，如 foo.example.com。对于更具体的例子，假设你的 Corefile 中有以下内容：\n\
  \n```\ncloudnativeazure.io:53 {\n  log\n  errors\n}\n\n.:53 {\n```\n\n\n\n\n\n```\n\
  forward . 8.8.8.8\nlog\nerrors\ncache\n}\n```\n\n在这个示例中，我们为 cloudnativeazure.io\
  \ 和根（.）服务器块配置了两个服务器块。两者都监听 53 端口。此外，还定义了多个插件：log，用于记录 CoreDNS 接收到的每个查询；errors，用于记录错误；cache，用于启用前端缓存（即除区域传输和元数据外的所有记录将被缓存，最长可达\
  \ 3600 秒）。你只需在 Corefile 所在的同一目录下输入 coredns 即可运行前面的 Corefile，或执行 coredns -conf Corefile：\n\
  \n```\n$ coredns -conf Corefile\n.:53\ncloudnativeazure.io.:53\nCoreDNS-1.8.1\n\
  darwin/amd64, go1.15.7, 95622f4\n```\n\n如果在另一个终端中对 cloudnativeazure.io 执行 dig，你会看到以下内容：\n\
  \n```\n$ ~ dig @127.0.0.1 cloudnativeazure.io:53\n; <<>> DiG 9.10.6 <<>> @127.0.0.1\
  \ cloudnativeazure.io:53\n; (1 server found)\n;; global options: +cmd\n;; Got answer:\n\
  ;; ->>HEADER<<- opcode: QUERY, status: NXDOMAIN, id: 48995\n;; flags: qr rd ra ad;\
  \ QUERY: 1, ANSWER: 0, AUTHORITY: 1, ADDITIONAL: 1\n\n;; OPT PSEUDOSECTION:\n; EDNS:\
  \ version: 0, flags;; udp: 4096\n;; QUESTION SECTION:\n;cloudnativeazure.io:53.\
  \      IN      A\n\n;; AUTHORITY SECTION:\n.                       1800    IN  \
  \    SOA     a.root-servers.net.\nnstld.verisign-grs.com. 2021021001 1800 900 604800\
  \ 86400\n```\n\n```\n;; Query time: 82 msec\n;; SERVER: 127.0.0.1#53(127.0.0.1)\n\
  ;; WHEN: Wed Feb 10 23:45:28 IST 2021\n;; MSG SIZE  rcvd: 126\n```\n\n你可以在 CoreDNS\
  \ 终端中看到如下日志：\n\n```\n$ coredns -conf Corefile\n.:53\ncloudnativeazure.io.:53\nCoreDNS-1.8.1\n\
  darwin/amd64, go1.15.7, 95622f4\n\n[INFO] 127.0.0.1:59741 - 48995 \"A IN cloudnativeazure.io:53.\
  \ udp 51 false 4096\" NXDOMAIN qr,rd,ra,ad 115 0.05160016s\n```\n\n我们在这里只介绍了 CoreDNS\
  \ 的基础知识。如需了解更多信息，建议阅读 John Belamaric 和 Cricket Liu 合著的 *Learning CoreDNS*（O’Reilly，2019）。\n\
  \n现在让我们讨论 CoreDNS 在 Kubernetes 中的服务发现用法。\n\n### Kubernetes 服务发现与 CoreDNS\n\n如前所述，CoreDNS\
  \ 是 Kubernetes v1.13 及更高版本中的默认服务发现机制，你可以从一开始就使用它。如以下代码块所示，运行在 kube-system 命名空间中的\
  \ Pod 类型为 core-dns：\n\n```\n$ kubectl get pods --namespace=kube-system -o wide\n\
  NAME                          READY   STATUS    RESTARTS   AGE   IP           NODE\
  \                                      NOMINATED NODE   READINESS GATES\ncoredns-748cdb7bf4-9xggk\
  \      1/1     Running   0          4h31m 10.244.0.3    aks-agentpool-13363041-vmss000002\
  \         <none>\ncoredns-748cdb7bf4-f6glb      1/1     Running   0          4h30m\
  \ 10.244.0.5    aks-agentpool-13363041-vmss000002         <none>\ncoredns-autoscaler-868b684fd4-7ck6z\
  \ 1/1 Running 0 4h30m 10.244.0.4 aks-agentpool-13363041-vmss000002 <none>\n```\n\
  \n```\n<none>\n\n$ kubectl get deployments --namespace=kube-system\nNAME       \
  \         READY   UP-TO-DATE   AVAILABLE   AGE\ncoredns             2/2     2  \
  \          2           4h31m\ncoredns-autoscaler  1/1     1            1       \
  \    4h31m\n```\n\nCoreDNS Kubernetes 插件会监视 Kubernetes 服务和端点资源，并缓存该数据。当请求发出时，CoreDNS\
  \ 插件会检查是否存在与请求名称对应的资源，然后返回适当的数据。响应记录是根据传入请求即时构建的，利用 Kubernetes API 服务器的 watch 功能。\n\
  \n让我们看看 CoreDNS 如何在 Kubernetes 集群中协助服务发现。假设你按如下方式在 Kubernetes 集群中运行一个简单的 Nginx Pod：\n\
  \n```\n$ kubectl get pods\nNAME    READY   STATUS    RESTARTS   AGE\nnginx   1/1\
  \     Running   0          3m20s\n```\n\n```\n$ kubectl get services\nNAME     \
  \    TYPE        CLUSTER-IP      EXTERNAL-IP   PORT(S)   AGE\nkubernetes    ClusterIP\
  \   10.0.0.1        <none>        443/TCP   41m\nnginx         ClusterIP   10.0.148.122\
  \    <none>        80/TCP    3m26s\n```\n\n要访问此 Nginx 服务器，你需要运行一个包含 dig 和 curl 等\
  \ DNS 工具的 infoblox/dnstools Pod。要运行此 Pod，可以使用以下命令：\n\n```\n$ kubectl run --restart=Never\
  \ -it --image infoblox/dnstools\ndnstools\nIf you don't see a command prompt, try\
  \ pressing enter.\ndnstools#\n```\n\n前面的命令会将你登录到新启动的容器中并提供一个命令提示符。\n\n在 Kubernetes\
  \ 中，基于 DNS 的服务发现定义了一种规范，或 DNS 模式，定义了用于定位集群中运行的服务的 DNS 名称。Kubernetes 集群中的所有 DNS 记录都属于一个单一域，称为\
  \ *集群域*，在大多数 Kubernetes 集群中默认通常设置为 `cluster.local`。DNS 规范定义了为分配给服务的每个 IP（即集群 IP）存在一个\
  \ A 记录，该记录包含集群 IP，其名称由服务名称和命名空间派生为 `service.namespace.svc.cluster-domain`。因此，要访问我们创建的\
  \ Nginx Pod，你可以从 `infoblox/dnstools` 容器中发出以下命令：\n\n```\ndnstools# curl nginx.default.svc.cluster.local\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>Welcome to nginx!</title>\n<style>\n   \
  \ body {\n        width: 35em;\n        margin: 0 auto;\n        font-family: Tahoma,\
  \ Verdana, Arial, sans-serif;\n    }\n</style>\n</head>\n<body>\n<h1>Welcome to\
  \ nginx!</h1>\n<p>If you see this page, the nginx web server is successfully installed\
  \ and working. Further configuration is required.</p>\n\n<p>For online documentation\
  \ and support please refer to <a href=\"http://nginx.org/\">nginx.org</a>.<br/>\n\
  Commercial support is available at <a href=\"http://nginx.com/\">nginx.com</a>.</p>\n\
  \n<p><em>Thank you for using nginx.</em></p>\n</body>\n```\n\n```\n</html>\ndnstools#\n\
  ```\n\n你也可以发出 dig 命令来查看服务的 A 记录：\n\n```\ndnstools# dig nginx.default.svc.cluster.local\n\
  \n; <<>> DiG 9.11.3 <<>> nginx.default.svc.cluster.local\n;; global options: +cmd\n\
  ;; Got answer:\n;; WARNING: .local is reserved for Multicast DNS\n;; You are currently\
  \ testing what happens when an mDNS query is leaked to DNS\n;; ->>HEADER<<- opcode:\
  \ QUERY, status: NOERROR, id: 52488\n;; flags: qr aa rd; QUERY: 1, ANSWER: 1, AUTHORITY:\
  \ 0, ADDITIONAL: 1\n;; WARNING: recursion requested but not available\n\n;; OPT\
  \ PSEUDOSECTION:\n; EDNS: version: 0, flags; udp: 4096\n; COOKIE: 5086e790e261bf20\
  \ (echoed)\n;; QUESTION SECTION:\n;nginx.default.svc.cluster.local. IN      A\n\n\
  ;; ANSWER SECTION:\nnginx.default.svc.cluster.local. 5 IN    A    10.0.148.122\n\
  \n;; Query time: 1 msec\n;; SERVER: 10.0.0.10#53(10.0.0.10)\n;; WHEN: Sat Feb 27\
  \ 07:37:10 UTC 2021\n;; MSG SIZE  rcvd: 119\n```\n\nMicrosoft Azure 还提供 DNS 即服务，通过名为\
  \ Azure DNS 的托管服务。我们接下来将介绍它。\n\n### Azure DNS\n\nAzure DNS 主要提供 Microsoft Azure\
  \ 基础设施来处理 DNS 域的名称解析。你可以使用 Azure DNS 来托管你的 DNS 域并管理你的 DNS 记录。通过在 Azure 中托管你的域，你可以使用与其它\
  \ Azure 服务相同的凭据、API、工具和计费来管理你的 DNS 记录。\n\nAzure DNS 可用于解析公共和私有域中的主机名。公共 DNS 功能可用于通过\
  \ Azure 托管你预先购买的域名，而私有 DNS 让你能够在虚拟网络内管理和解析域名。\n\nCoreDNS 还提供了一个 Azure 特定插件，用于从 Azure\
  \ DNS 提供区域。你可以按如下方式启用 Azure 插件：\n\n```\nazure AZURE_RESOURCE_GROUP:ZONE... {\n \
  \   tenant <TENANT_ID>\n    client <CLIENT_ID>\n    secret <CLIENT_SECRET>\n   \
  \ subscription <SUBSCRIPTION_ID>\n    environment <ENVIRONMENT>\n    fallthrough\
  \ [ZONES...]\n    access private\n}\n```\n\n在前面的代码中：\n\n- AZURE_RESOURCE_GROUP:ZONE\
  \ 是 Azure 上托管区域所属的资源组，ZONE 是包含数据的区域。\n- CLIENT_ID 和 CLIENT_SECRET 是 Azure 的凭据，tenant\
  \ 指定要使用的 TENANT_ID。SUBSCRIPTION_ID 是订阅 ID。\n- environment 指定 Azure ENVIRONMENT。\n\
  - fallthrough 指定如果区域匹配但无法生成记录，则请求应传递给下一个插件。如果省略 ZONES，则对插件具有权威性的所有区域都会发生回退。\n- access\
  \ 指定 DNS 区域是公共还是私有。默认值为 public。\n\n我们已经介绍了服务发现在分布式云原生环境中的作用和意义，那么让我们讨论一下服务网格带来的\n\
  \n\nthe table.\n\n### 服务网格\n\n服务网格是一种工具，可在云原生应用的平台层添加可观测性、可靠性和安全性。服务网格通常实现为可扩展的一组网络代理，以\
  \ sidecar 的形式部署在应用旁边。这些代理主要负责处理微服务之间的通信，并在 OSI 模型的第 7 层运行。除了若干附加功能外，服务网格还：\n\n-\
  \ 通过负载均衡、速率限制、流量切换和断路器提供流量管理\n- 通过金丝雀发布帮助应用发布周期管理\n- 开箱即用地添加一些可靠性检查，例如健康检查、重试和超时\n\
  - 协助故障注入和调试路由\n- 通过 TLS 和 ACL 策略提供安全性\n- 为集群内的所有流量提供自动指标、日志和追踪\n- 使用强身份识别的身份验证和授权，在集群中保护服务到服务的通信\n\
  \n服务网格的总体架构由两个高层组件组成：数据平面和控制平面。图 7-2 展示了部署在服务网格中的四个服务（A–D）。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_245_0.png)\n\
  \n图 7-2. 服务网格总体架构\n\n如你所见，每个服务实例都有一个 sidecar 代理实例，负责所有流量流和管理。这基本上意味着当服务 A 例如想要与服务\
  \ C 通信时，服务 A 通过其本地 sidecar 代理发起通信流，然后到达服务 C 的 sidecar 代理。这样，服务本身并不感知本地网络代理，并与更大网络隔离。因此，每当一个服务需要与另一个服务通信时，代理会拦截来自它的请求，然后转发给接收方。\n\
  \n所有 sidecar 代理的集合构成了服务网格架构的数据平面。数据平面负责以下工作：\n\n- 请求转发\n- 服务发现\n- 健康检查\n- 路由服务请求\n\
  - 负载均衡\n- 身份验证和授权\n- 提供可观测性\n\n因此，数据平面从根本上触及集群中的每个网络请求或数据包。\n\n另一方面，控制平面为服务网格中所有\
  \ sidecar 代理（数据平面）提供策略和配置细节。控制平面允许你控制和配置数据平面。所有高层配置都会发送到控制平面，然后被转换为数据平面特定的配置。控制平面通过以下方式协助数据平面：\n\
  \n- 服务间路由\n- 为数据平面使用填充服务发现数据\n- 指定负责负载均衡、断路和超时的配置输入\n- 在集群中配置验证、身份验证和授权设置\n\n在下一节中，我们将介绍\
  \ Istio，它在现代云原生环境中充当服务网格的控制平面。\n\n### Istio 简介\n\n随着单体应用向微服务转型，开发人员和运维团队在服务网格中服务如何相互通信方面遇到了挑战。随着服务网格规模的增长，管理和维护变得困难。甚至理解不同组件如何协同工作也变得困难。\n\
  \nIstio 是一个开源服务网格，简化了分布式云原生应用中微服务之间的通信。Istio 提供了丰富的内置功能集，可强制执行重试、断路器、整形流量、路由行为、金丝雀部署等弹性模式。此外，Istio\
  \ 允许你使用负载均衡、监控和身份验证轻松创建已部署微服务的网络，而几乎无需更改应用代码。\n\n正如我们在上一节讨论的，服务网格架构由数据平面和控制平面组成。Istio\
  \ 使用 Envoy 作为其数据平面，使用 istiod 作为其控制平面（如图 7-3 所示）：\n\n#### Envoy（数据平面）\n\nEnvoy 是一个用\
  \ C++ 编写的高性能代理，拦截服务网格中每个应用的全部入站和出站流量。它与应用一起作为 sidecar 部署，并提供大量功能，包括 TLS 终止、负载均衡、断路、健康检查、动态服务发现、故障注入等。\n\
  \n这种 sidecar 代理模型允许你在使用 Istio 作为服务网格时无需任何代码更改。\n\n#### Istiod（控制平面）\n\nIstiod 管理和配置代理。Istiod\
  \ 由三个子组件组成：\n\n- Pilot，负责在运行时配置 Envoy 代理\n- Citadel，负责证书签发和轮换\n- Galley，负责在 Istio\
  \ 内部验证、摄取、聚合、转换和分发配置\n\nIstiod 将控制流量的高层路由规则转换为 Envoy 特定配置，并在运行时传播到 Envoy sidecar。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_248_0.png)\n\n图 7-3. Istio 架构\n\n让我们看看如何在\
  \ Azure Kubernetes 环境中使用 Istio 和 Envoy。\n\n### 在 Azure Kubernetes Service 上安装 Istio\n\
  \n你可以通过三种方式在 Kubernetes 集群上安装 Istio：\n\n- Istio 提供了一个名为 istioctl 的命令行工具，可用于对 Istio\
  \ 控制平面和 Envoy 代理数据平面提供丰富的定制级别。\n- 你可以使用 Istio Kubernetes operator 通过 Kubernetes\
  \ API 的自定义资源定义（CRDs）来管理安装。\n- 你可以使用 Helm charts 直接安装 Istio。\n\n由于 Helm charts 也在方法\
  \ 1 和 2 中间接使用，我们将在这里使用它们来安装 Istio。\n\n### 使用 Helm 安装 Istio\n\n要使用 Helm 安装 Istio，你需要一个已经运行的\
  \ AKS 集群（如果需要复习如何在 Azure 中创建 AKS 集群，请查看第 5 章）。以下步骤将在 AKS 集群上安装 Istio：\n\n- 通过在本地机器上运行以下命令下载\
  \ Istio：\n  \n  ```\n  $ curl -L https://istio.io/downloadIstio |\n  ISTIO_VERSION=1.9.2\
  \ TARGET_ARCH=x86_64 sh -\n  \n  $ cd istio-1.9.2\n  ```\n- 创建一个新的命名空间用于 Istio 组件，名为\
  \ `istio-system`：\n  \n  ```\n  $ kubectl create namespace istio-system\n  \n  namespace/istio-system\
  \ created\n  ```\n- 安装包含 istiod 控制平面使用的集群范围资源的 Istio base chart：\n  \n  ```\n  $\
  \ helm install istio-base manifests/charts/base -n istio-system\n  NAME: istio-base\n\
  \  LAST DEPLOYED: Sun Mar 28 15:59:16 2021\n  NAMESPACE: istio-system\n  STATUS:\
  \ deployed\n  REVISION: 1\n  TEST SUITE: None\n  ```\n- 安装部署 istiod 服务的 Istio discovery\
  \ chart：\n\n```\n$ helm install istiod manifests/charts/istio-control/istio-discovery\
  \ -n istio-system\n\nNAME: istiod\nLAST DEPLOYED: Sun Mar 28 16:02:23 2021\nNAMESPACE:\
  \ istio-system\nSTATUS: deployed\nREVISION: 1\nTEST SUITE: None\n```\n\n- 验证安装：\n\
  \n```\n$ helm list -A\nNAME            NAMESPACE       REVISION UPDATED\nSTATUS\
  \  CHART                   APP VERSION\nistio-base      istio-system    1      \
  \  2021-03-28\n15:59:16.429126 +0530 IST    deployed    base-1.9.2\nistiod     \
  \     istio-system    1        2021-03-28\n16:02:23.950541 +0530 IST    deployed\
  \    istio-discovery-1.9.2\n```\n\n```\n$ kubectl get pods -n istio-system\nNAME\
  \                          READY   STATUS    RESTARTS\nAGE\nistiod-6d68c86c8d-5nv2r\
  \       1/1     Running   0\n10m\n```\n\n重要的是要确保每当在集群中部署新的 Pod 时，Istio sidecar 代理（Envoy\
  \ 代理）也会注入到同一个 Pod 中，以便你能利用 Istio 的所有功能。我们将在下一节讨论如何做到这一点。\n\n### 自动注入 Sidecar 代理（Envoy\
  \ 代理）\n\n\n\n\n\n为了充分利用 Istio 作为服务网格，集群中的 Pod 也必须使用 Istio sidecar 代理。istio-proxy，本质上是\
  \ Envoy 代理，可以通过两种方式部署：手动或自动。手动方法允许你修改注入和代理配置。自动方法顾名思义，在 Pod 创建时通过使用突变准入控制器实现自动代理配置。虽然手动方法在需要特定配置时很有用，但自动方法更受青睐。我们接下来将介绍如何使用自动方法。\n\
  \n### KUBERNETES ADMISSION CONTROLLERS\n\n准入控制器是一段在对象持久化之前但在请求经过身份验证和授权之后拦截对 Kubernetes\
  \ API 服务器请求的代码。Kubernetes 提供了一系列编译到 kube-apiserver 库中的准入控制器。\n\nMutatingAdmissionController\
  \ 可以修改其允许的对象。也就是说，它会调用与请求匹配的任何突变 webhook。\n\n要使用自动 sidecar 注入，请在所需命名空间上使用标签 istio-injection\
  \ 并将其设置为 enabled。这允许在该命名空间中创建的任何新 Pod 在应用程序旁边部署代理 sidecar。为了让你更好地了解其工作原理，首先我们将部署一个没有\
  \ sidecar 注入的 Nginx Pod，然后我们将启用 sidecar 注入，以便在未来的部署中 sidecar 代理会自动注入。\n\n假设我们已使用一个\
  \ Pod 部署了 Nginx：\n\n```\n$ kubectl apply -f nginx_deploy.yaml\ndeployment.apps/nginx-deployment\
  \ created\n\n$ kubectl get deployment -o wide\nNAME                 READY   UP-TO-DATE\
  \   AVAILABLE   AGE\nCONTAINERS           IMAGES                  SELECTOR\n```\n\
  \n```\nnginx-deployment    1/1    1    1    105s    nginx\nnginx:1.14.2    app=nginx\n\
  ```\n\n```\n$ kubectl get pod\nNAME    READY    STATUS    RESTARTS    AGE\nnginx-deployment-6b474476c4-bqgh8\
  \    1/1    Running    0    4m5s\n```\n\n让我们为 default 命名空间添加标签 istio-injection=enabled：\n\
  \n```\n$ kubectl label namespace default istio-injection=enabled --overwrite\nnamespace/default\
  \ labeled\n$ kubectl get namespace -L istio-injection\nNAME            STATUS  \
  \  AGE    ISTIO-INJECTION\ndefault         Active    24m    enabled\nistio-system\
  \    Active    18m\nkube-node-lease Active    25m\nkube-public     Active    25m\n\
  kube-system     Active    25m\n```\n\n由于注入发生在 Pod 创建时，我们可以杀掉 Nginx Pod 并重新启动一个新的\
  \ Nginx Pod，这次 Pod 将自动注入 sidecar：\n\n```\n$ kubectl delete pod -l app=nginx\npod\
  \ \"nginx-deployment-6b474476c4-bqgh8\" deleted\n\n$ kubectl get pod -l app=nginx\n\
  NAME    READY    STATUS    RESTARTS    AGE\nnginx-deployment-6b474476c4-pfgqv  \
  \  2/2    Running    0    57s\n```\n\n请注意，部署已启动了两个容器。这是在 Pod 中运行的 sidecar 代理。你可以通过以下方式使用\
  \ describe 验证：\n\n```\n$ kubectl describe pod -l app=nginx\n\nEvents:\n  Type  \
  \  Reason    Age    From\n  Message\n```\n\n```\n    ----    ------    ----    ----\n\
  ----------\n    Normal    Scheduled    <unknown>    default-scheduler\nSuccessfully\
  \ assigned default/nginx-deployment-6b474476c4-pfgqv\nto aks-agentpool-20139558-vmss000001\n\
  \    Normal    Pulling    2m35s    kubelet, aks-agentpool-20139558-\nvmss000001\
  \    Pulling image \"docker.io/istio/proxyv2:1.9.2\"\n    Normal    Created    2m34s\
  \    kubelet, aks-agentpool-20139558-\nvmss000001    Created container nginx\n \
  \   Normal    Created    2m34s    kubelet, aks-agentpool-20139558-\nvmss000001 \
  \   Created container istio-init\n    Normal    Started    2m34s    kubelet, aks-agentpool-20139558-\n\
  vmss000001    Started container istio-init\n    Normal    Pulled    2m34s    kubelet,\
  \ aks-agentpool-20139558-\nvmss000001    Container image \"nginx:1.14.2\" already\
  \ present on\nmachine\n    Normal    Pulled    2m34s    kubelet, aks-agentpool-20139558-\n\
  vmss000001    Successfully pulled image\n\"docker.io/istio/proxyv2:1.9.2\"\n   \
  \ Normal    Started    2m34s    kubelet, aks-agentpool-20139558-\nvmss000001   \
  \ Started container nginx\n    Normal    Pulling    2m34s    kubelet, aks-agentpool-20139558-\n\
  vmss000001    Pulling image \"docker.io/istio/proxyv2:1.9.2\"\n    Normal    Pulled\
  \    2m33s    kubelet, aks-agentpool-20139558-\nvmss000001    Successfully pulled\
  \ image\n\"docker.io/istio/proxyv2:1.9.2\"\n    Normal    Created    2m33s    kubelet,\
  \ aks-agentpool-20139558-\nvmss000001    Created container istio-proxy\n    Normal\
  \    Started    2m33s    kubelet, aks-agentpool-20139558-\nvmss000001    Started\
  \ container istio-proxy\n```\n\n现在你知道了如何部署 sidecar 代理，你就可以使用 Istio 进行流量管理、安全、策略执行和可观测性。我们不会深入探讨这些方面，因为它们超出了本书的范围。\n\
  \n在使用服务网格时，你应该能够可视化和管理它。在下一节中，我们将重点介绍 Kiali，一个用于基于 Istio 的服务网格的管理控制台。\n\n### Managing\
  \ Istio Service Meshes Using Kiali\n\nKiali 是 Istio 的管理控制台，可让你轻松操作和配置服务网格，并为你的环境提供额外的可观测性。Kiali\
  \ 通过使用流量拓扑来显示其结构和健康状况的仪表板，对服务网格提供清晰的视图。在本节中，我们将讨论如何在 Kubernetes 集群上安装 Kiali 以获得对\
  \ Istio 服务网格的可见性。\n\n我们将从 istio-1.9.2 目录开始安装 Istio 的 ingress 和 egress 网关，该目录我们在之前安装\
  \ Istio 时使用过：\n\n```\nIstio-1.9.2 $ helm install istio-ingress\nmanifests/charts/gateways/istio-ingress\
  \ -n istio-system\nNAME: istio-ingress\nLAST DEPLOYED: Mon Apr  5 15:19:01 2021\n\
  NAMESPACE: istio-system\nSTATUS: deployed\nREVISION: 1\nTEST SUITE: None\n```\n\n\
  ```\nIstio-1.9.2 $ helm install istio-egress\nmanifests/charts/gateways/istio-egress\
  \  -n istio-system\nNAME: istio-egress\nLAST DEPLOYED: Mon Apr  5 15:19:31 2021\n\
  NAMESPACE: istio-system\nSTATUS: deployed\nREVISION: 1\nTEST SUITE: None\n```\n\n\
  现在我们可以使用 Helm chart 安装 Kiali：\n\n```\n$ kubectl create namespace kiali-operator\n\
  namespace/kiali-operator created\n$ istio-1.9.2 helm install --set cr.create=true\
  \  --set\ncr.namespace=istio-system  --namespace kiali-operator  --repo\nhttps://kiali.org/helm-charts\
  \ kiali-operator kiali-operator\n\nNAME: kiali-operator\nLAST DEPLOYED: Mon Apr\
  \  5 15:27:03 2021\nNAMESPACE: kiali-operator\nSTATUS: deployed\nREVISION: 1\n```\n\
  \nTEST SUITE: None\nNOTES:\nWelcome to Kiali! For more details on Kiali, see:\n\
  https://kiali.io\n\nThe Kiali Operator [v1.32.0] has been installed in namespace\
  \ [kiali-operator]. It will be ready soon.\nYou have elected to install a Kiali\
  \ CR in the namespace [istio-system]. You should be able to access Kiali soon.\n\
  \nIf you ever want to uninstall the Kiali Operator, remember to delete the Kiali\
  \ CR first before uninstalling the operator to give the operator a chance to uninstall\
  \ and remove all the Kiali Server resources.\n\n(Helm: Chart=[kiali-operator], Release=[kiali-operator],\
  \ Version=[1.32.0])\n\n这将安装最新的 Kiali operator 以及 Kiali 自定义资源 CR，本质上是一个保存 Kiali 配置的\
  \ YAML 文件。\n\n要访问 Kiali 仪表板，我们首先需要正确地将其暴露到互联网。为此，我们需要按如下方式获取 ingress 网关地址：\n\n```\n\
  $ export INGRESS_HOST=$(kubectl -n istio-system get service istio-ingressgateway\
  \ -o jsonpath='{.status.loadBalancer.ingress[0].ip}')\n$ export INGRESS_DOMAIN=${INGRESS_HOST}.nip.io\n\
  ```\n\n现在我们需要创建一个自签名证书：\n\n```\n$ CERT_DIR=/tmp/certs\n$ mkdir -p ${CERT_DIR}\n\
  $ openssl req -x509 -sha256 -nodes -days 365 -newkey rsa:2048 -subj \"/O=example\
  \ Inc./CN=*.${INGRESS_DOMAIN}\" -keyout ${CERT_DIR}/ca.key -out ${CERT_DIR}/ca.crt\n\
  $ openssl req -out ${CERT_DIR}/cert.csr -newkey rsa:2048 -nodes -keyout ${CERT_DIR}/tls.key\
  \ -subj \"\n\"/CN=*.${INGRESS_DOMAIN}/O=example organization\"\n$ openssl x509 -req\
  \ -days 365 -CA ${CERT_DIR}/ca.crt -CAkey ${CERT_DIR}/ca.key -set_serial 0 -in ${CERT_DIR}/cert.csr\
  \ -out ${CERT_DIR}/tls.crt\n```\n\n\n\n\n\n```\n$ kubectl create -n istio-system\
  \ secret tls telemetry-gw-cert --key=${CERT_DIR}/tls.key --cert=${CERT_DIR}/tls.crt\n\
  ```\n\n此时，我们可以使用以下配置公开 Kiali，这些配置将创建一个网关、一个虚拟服务和一个目标规则：\n\n- `Gateway` 表示一个数据平面，通过为\
  \ HTTP/TCP 流量配置负载均衡器将流量路由到 Kubernetes 集群，而不管它将在哪里运行。\n- `VirtualService` 定义了一组在访问主机时要应用的流量路由规则。路由规则可以匹配特定类型的流量，当规则匹配时，流量将被发送到命名的目标服务。\n\
  - `DestinationRule` 配置在将流量转发到服务时要应用的一组策略。\n\n以下是代码：\n\n```\n$ cat <<EOF | kubectl\
  \ apply -f -\napiVersion: networking.istio.io/v1alpha3\nkind: Gateway\nmetadata:\n\
  \  name: kiali-gateway\n  namespace: istio-system\nspec:\n  selector:\n    istio:\
  \ ingressgateway\n  servers:\n  - port:\n      number: 443\n      name: https-kiali\n\
  \      protocol: HTTPS\n    tls:\n      mode: SIMPLE\n      credentialName: telemetry-gw-cert\n\
  \    hosts:\n    - \"kiali.${INGRESS_DOMAIN}\"\n---\napiVersion: networking.istio.io/v1alpha3\n\
  kind: VirtualService\nmetadata:\nname: kiali-vs\nnamespace: istio-system\nspec:\n\
  \  hosts:\n  - \"kiali.${INGRESS_DOMAIN}\"\n  gateways:\n  - kiali-gateway\n  http:\n\
  \  - route:\n    - destination:\n        host: kiali\n        port:\n          number:\
  \ 20001\n---\napiVersion: networking.istio.io/v1alpha3\nkind: DestinationRule\n\
  metadata:\n  name: kiali\n  namespace: istio-system\nspec:\n  host: kiali\n  trafficPolicy:\n\
  \    tls:\n      mode: DISABLE\n---\nEOF\n```\n\n现在你可以在 https://kiali.${INGRESS_DOMAIN}\
  \ 访问 Kiali UI（在我们的例子中是 https://kiali.40.118.246.227.nip.io）。当你访问此 URL 时，你会看到 Kiali\
  \ 登录屏幕，需要输入 Kiali 操作员的令牌。你可以通过以下方式获取令牌：\n\n```\n$kubectl get secrets --namespace=kiali-operator\

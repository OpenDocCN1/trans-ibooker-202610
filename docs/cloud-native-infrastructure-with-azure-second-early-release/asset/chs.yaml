  \ 所示。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_348_0.png)\n\n我们还可以看到命名空间中的总体指标，以及点击特定队列以提供有关存储和消息大小的更多详细信息（见图\
  \ 10-14）。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_348_1.png)\n\n### 在 Python\
  \ 中向 Service Bus 队列发送和接收消息\n\n假设我们在前面的步骤中成功创建了基础设施，我们可以通过运行 Azure CLI 命令检索可用于使用的连接字符串：\n\
  \n\n\n```\n$ az servicebus namespace authorization-rule keys list --resource-group\
  \ $RES_GROUP --namespace-name $NAMESPACE_NAME --name RootManageSharedAccessKey --query\
  \ primaryConnectionString\n```\n\nAzure 提供开源库，可在所有流行的编程语言中向 Azure 服务发送和接收消息。以下示例在\
  \ Python 中构建了一个简单的生产者和消费者：\n\n```\nfrom azure.servicebus import ServiceBusClient,\
  \ ServiceBusMessage\n\nimport os\nconnstr = os.environ['SERVICE_BUS_CONN_STR']\n\
  queue_name = os.environ['SERVICE_BUS_QUEUE_NAME']\n\nmessages = [\"Testing 1\",\"\
  Testing 2\", \"Testing 3\"]\n\nwith ServiceBusClient.from_connection_string(connstr)\
  \ as client:\n    s = client.get_queue_sender(queue_name)\n    r = client.get_queue_receiver(queue_name)\n\
  \n    print(s,r)\n\n    for m in messages:\n        s.send_messages(ServiceBusMessage(m))\n\
  \n    while True:\n        print(r.receive_messages(max_message_count=1,max_wait_time=10))\n\
  ```\n\n除了 RabbitMQ 之外，熟悉 AWS SNS 和 SQS 的读者会发现 Service Bus 非常直观，能够满足类似的使用场景。\n\n\
  ## Azure Event Hubs\n\nAzure Event Hubs 设计用于提供 Apache Kafka 的部分功能，以满足分区和消费者组的使用场景，但以托管的云服务形式提供（见图\
  \ 10-15）。虽然你失去了在虚拟机或 Kubernetes 上运行 Kafka 时对后端基础设施的可见性，但你获得了与 Azure Blob Storage、Azure\
  \ Data Lakes 和 Azure Stream Analytics 等其他数据服务更紧密的集成，等等。Azure 还支持 AMQP 1.0 和 Kafka\
  \ 1.0 协议，以保持与客户端库的兼容性。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_349_0.png)\n\n\
  图 10-15. Azure Event Hubs 架构\n\nAzure Event Hubs 有一些概念是从 Azure Service Bus 转移过来的。我们在这里快速回顾一下：\n\
  \n*生产者*\n\n这些是向 Azure Event Hubs 发送消息的客户端。\n\n*分区*\n\n消息被分片到各个分区，以便消息的副本可以被存储。\n\
  \n### 消费者组\n\n这些是协同工作以协调方式消费消息的客户端。\n\n### 使用 Terraform 管理 Azure Event Hubs\n\n\
  为向 Azure Event Hubs 发送消息而预配所需资源的 Terraform 代码与我们之前用于在 Azure Service Bus 中配置队列和主题的代码非常相似。我们必须声明一个资源组和一个命名空间，我们的\
  \ Event Hubs 实例将属于该命名空间：\n\n```\nprovider \"azurerm\" {\n  features {}\n}\n\nresource\
  \ \"azurerm_resource_group\" \"example\" {\n  name     = \"mdfranz-eventbus-group\"\
  \n  location = \"East US\"\n}\n\nresource \"azurerm_eventhub_namespace\" \"example\"\
  \ {\n  name                = \"mdfranz-eventhub-namespace\"\n  location        \
  \    = \"East US\"\n  resource_group_name = azurerm_resource_group.example.name\n\
  \  sku                 = \"Standard\"\n  capacity            = 1\n}\n\nresource\
  \ \"azurerm_eventhub\" \"example\" {\n  name                = \"mdfranz-eventhub\"\
  \n  namespace_name      = azurerm_eventhub_namespace.example.name\n  resource_group_name\
  \ = azurerm_resource_group.example.name\n  partition_count     = 1\n  message_retention\
  \   = 1\n}\n\nresource \"azurerm_eventhub_consumer_group\" \"example\" {\n  name\
  \                = \"mdfranz-consumergroup\"\n  resource_group_name = azurerm_resource_group.example.name\n\
  \  namespace_name      = azurerm_eventhub_namespace.example.name\n  eventhub_name\
  \       = azurerm_eventhub.example.name\n}\n```\n\n创建消费者组是可选的，因为存在默认消费者组。还请注意，具有多个消费者组需要标准\
  \ SKU 而不是基本 SKU。\n\n与 Azure Event Bus 一样，有多种方式可以对 Event Hubs 端点进行身份验证。最简单的方法是使用连接字符串，如以下示例所示：\n\
  \n```\n$ az eventhubs namespace authorization-rule keys list --resource-group mdfranz-eventbus-group\
  \ --namespace-name mdfranz-eventhub-namespace --name RootManageSharedAccessKey\n\
  {\n  \"aliasPrimaryConnectionString\": null,\n  \"aliasSecondaryConnectionString\"\
  : null,\n  \"keyName\": \"RootManageSharedAccessKey\",\n  \"primaryConnectionString\"\
  : \"Endpoint=sb://mdfranz-eventhub-namespace.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=jFMUbfQZX8UjGjcCKLAeIp5CZVLcWcSGpuKdJX/CMzK=\"\
  ,\n  \"primaryKey\": \"jFMUbfQZX8UjGjcCKLAeIp5CZVLcWcSGpuKdJX/CMzK=\",\n  \"secondaryConnectionString\"\
  : \"Endpoint=sb://mdfranz-eventhub-namespace.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=gFy7SuuGjw12GfoHXd6UQeZdy5Y0xu/gStZtQUhaxsY=\"\
  ,\n  \"secondaryKey\": \"gFy7SuuGjw12GfoHXd6UQeZdy5Y0xu/gStZtQUhaxsY=\"\n}\n```\n\
  \n> 注意\n> 参数 EntityPath=mdfanz-eventhub（即 Endpoint=sb://mdfanz-eventhub-namespace.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;EntityPath=mdfanz-eventhubSharedAccessKey=jfMUbFqZX8UjG1cKLAeIp5CZVLcwcSGpuKdJX/CMzk=）必须添加到连接字符串中，因为如果你使用\
  \ NewHubfromConnectionString 创建客户端，Send 方法不允许将事件网格名称指定为参数，因此你需要改为添加 EntityPath。\n\
  \n## Azure Event Grid\n\nAzure Event Grid 于 2018 年正式发布，是 Azure 提供的最佳消息代理之一，因为它允许多个事件源路由到\
  \ Azure 生态系统中的各种目的地。消息可以发送到/从我们刚刚讨论的现有消息服务（Azure Service Bus 和 Azure Event Hubs）以及其他服务和端点（见图\
  \ 10-16），例如 Azure Functions、Web Hooks、Logic Apps，以及其他应用内用途（例如跟踪用户与应用程序的交互方式）。Azure\
  \ Event Hubs 是一种首屈一指的“无服务器”产品，按事件计费。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_351_0.png)\n\
  \n图 10-16. Event Grid 生态系统\n\n在图 10-16 中，请注意 Event Grid 的推送特性，与我们在其他系统中习惯的通用推拉拓扑不同。\n\
  \nAzure Event Grid 使用的术语与我们讨论的其他平台略有不同：\n\n### 域\n\n域类似于命名空间，用于在租户内分隔使用场景。\n\n###\
  \ 主题\n\n对于 Event Grid，存在两种类型的主题：系统主题，来自 Azure 系统（Event Hubs、Blob Storage 等），如图 10-16\
  \ 左侧所示；以及自定义主题，可以是您自己的自定义方案，包装在 Event Grid Schema 中。\n\n### 部署和使用事件网格\n\nAzure 事件网格具有简约的\
  \ Terraform 部署，如以下示例所示：\n\n```\nresource \"azurerm_resource_group\" \"example\"\
  \ {\n  name     = \"example-resources\"\n  location = \"East US\"\n}\n```\n\n```\n\
  resource \"azurerm_eventgrid_topic\" \"example\" {\n  name                = \"my-eventgrid-topic\"\
  \n  location            = azurerm_resource_group.example.location\n  resource_group_name\
  \ = azurerm_resource_group.example.name\n\n  tags = {\n    environment = \"Production\"\
  \n  }\n}\n```\n\n你需要更改主题的名称，因为它在你部署到的 Azure 区域中是全局唯一的。一旦此 Terraform 部署应用完成，将创建一个新的\
  \ Event Grid 主题，名称为 https://<event-grid-topic-name>.<topic-location>.eventgrid.azure.net/api/events；或在我们的例子中，为\
  \ https://my-eventgrid-topic.east-us.eventgrid.azure.net/api/events。你可以通过运行 az eventgrid\
  \ topic key list --resource-group example-resources --name my-eventgrid-topic 来找到该主题的访问密钥。\n\
  \n这里有一个使用 azure-eventgrid Python 包的简单生产者：\n\n```\nfrom azure.identity import DefaultAzureCredential\n\
  from azure.eventgrid import EventGridPublisherClient, EventGridEvent\n\nevent =\
  \ EventGridEvent(\n    data={\"team\": \"azure-sdk\"},\n    subject=\"Door1\",\n\
  \    event_type=\"Azure.Sdk.Demo\",\n    data_version=\"2.0\"\n)\n\ncredential =\
  \ DefaultAzureCredential(\"<access-key>\")\nendpoint = `https://my-eventgrid-topic.east-us.eventgrid.azure.net/api/events`\n\
  client = EventGridPublisherClient(endpoint, credential)\nclient.send(event)\n```\n\
  \n大量关于如何使用 Event Grid 编程的优秀示例可在 Azure Event Grid Python 客户端库 中找到。\n\n### 总结\n\n\
  在为新应用或现有应用选择消息技术时，你有很多选择。像往常一样，关于如何运行某项技术的答案通常是“视情况而定！”我们在本章中讨论的开源和 Azure 消息产品之间存在显著的功能重叠。在选择消息服务之前，确保你了解自己的持久性、规模和安全需求，将为你部署消息基础设施奠定成功的基础。我们现在将进入我们最后的基础设施部分，无服务器计算。\n\
  \n\n\n\n\n## 第11章. 无服务器\n\n### 早期发布读者须知\n\n使用 Early Release 电子书，您可以在官方发布这些书名之前很久就利用这些技术——作者在撰写时的原始未编辑内容。\n\
  \n这将是最终书籍的第11章。请注意，GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何意见，或者如果您注意到本章中缺少材料，请联系编辑\
  \ rfernando@oreilly.com。\n\n到目前为止，我们主要关注将本地概念带入云端并讨论和实现其云端等价物。在本章中，我们将深入探讨一种新型计算架构——无服务器，它植根于云计算。具体来说，我们将研究常见的无服务器平台，包括\
  \ Azure 函数应用、Knative、KEDA 和 OpenFaaS。\n\n### 无服务器计算简介\n\n与容器类似，无服务器计算周围也有很多炒作，以及可以用它做什么。本章将探讨无服务器计算的功能和优势。\n\
  \n### 什么是无服务器？\n\n与容器不同，容器在很大程度上仍然包含许多基于主机的概念，而无服务器将所有这些都抽象掉了，以至于您只关心能够运行软件函数。\n\
  \n由于能够快速创建应用程序并在无需担心基础设施管理的情况下运行它们，无服务器获得了很大的流行。此外，无服务器将自动扩缩容视为一项首要功能，这意味着您无需担心其他事情，只需编写代码并使用标准化的框架部署机制进行部署即可。\n\
  \n无服务器的好处是服务器维护和配置大多不是问题。此外，如果您想不频繁地运行软件函数，无服务器函数可以是一种更经济的选择，因为您按请求付费，而不是按计算资源（即计算）的预留付费。\n\
  \n正如前面提到的，无服务器生态系统是一个相当新的领域，创新速度很快。除了大型云服务提供商提供函数平台外，像 Cloudflare、Netlify 和 Twilio\
  \ 这样的其他互联网公司也提供无服务器功能。\n\n### 什么是无服务器函数？\n\n无服务器函数是一个小型、短生命周期的程序，在触发时运行。无服务器函数可以通过\
  \ HTTP(s) 请求、通过计时器触发，或在 Azure Event Grid 中通过基于 Cosmos DB 或 Service Bus 事件触发函数来触发。\n\
  \n函数通常具有单一的自包含目的，执行速度快且依赖有限。此外，它通常不是高 qps（每秒查询数）的端点，因为性能是无服务器函数的次要关注点。\n\n您可能听说过像\
  \ https://icanhazip.com 这样的实用工具，它只返回您连接的公共 IP 地址。这可以很容易地作为无服务器函数编写和部署：\n\n```\n\
  async function handleRequest(request) {\n  const clientIP = request.headers.get(\"\
  CF-Connecting-IP\")\n```\n\n```\nreturn new Response(clientIP)\n}\n\naddEventListener(\"\
  fetch\", event => {\n  event.respondWith(handleRequest(event.request))\n})\n```\n\
  \n前面的示例为“fetch”类型的事件（即 HTTP GET）创建了一个事件监听器，当该事件被触发时，handleRequest 函数将被调用。函数解析 HTTP\
  \ 请求头 CF-Connecting-IP，即向无服务器函数发出请求的 IP。函数然后以请求的 IP 地址进行响应。\n\n### 无服务器生态系统\n\n\
  如前所述，尽管是一个新领域，无服务器生态系统已经见证了快速的系统开发。CNCF 无服务器生态系统（如图 11-1 所示）包含多个部分：\n\nTools\n\n\
  协助构建无服务器软件的软件框架\n\nSecurity\n\n专门用于保护无服务器基础设施的软件\n\nFrameworks\n\n用于构建无服务器函数的软件框架\n\
  \nHosted platform\n\n提供无服务器函数的公共提供商\n\nInstallable platform\n\n您可以安装以运行无服务器函数的软件\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_356_0.png)\n\n图 11-1. CNCF 无服务器生态系统\n\
  \n虽然本书中不会详细介绍，但除了框架和主要云服务提供商提供无服务器服务外，边缘网络（或 CDN）提供商也提供无服务器或“边缘计算”功能。这在 Cloudflare\
  \ 等公司变得非常流行。\n\n### 无服务器的优势\n\n正确使用时，无服务器可以为用户带来重大优势：\n\nLower costs\n\n您按函数运行的次数或运行时间计费，这意味着您无需为闲置的云资源付费。\n\
  \nEliminated operational overhead\n\n鉴于函数模型的简单性和依赖性有限，主动配置或管理函数的需要大大减少。\n\n####\
  \ Autoscaling\n\n函数会自动扩缩容，无需额外工作即可将函数工作进程数量向上或向下扩展。\n\n#### Faster development cycles\n\
  \n将上述所有要点结合起来有助于产生更快的工程周期，这可以提高开发人员和操作人员的生产力。\n\n### 无服务器的潜在缺点\n\n无服务器也可能存在一些潜在的缺点，需要考虑：\n\
  \n#### Debuggability\n\n当所有计算完全是短暂的且生命周期短时，调试函数变得异常复杂。\n\n#### Large number of functions\n\
  \n虽然自动扩缩容固有地内置于所有无服务器函数中，但始终自动扩缩容也会产生一些副作用。首先，它可能对性能产生不利影响，其次，下游连接池的管理变得更加复杂（尤其是在数据库方面）。\n\
  \n#### Vendor lock-in\n\n所有无服务器平台的一个缺点是，您的函数代码直接绑定到您运行函数的软件平台上。这在很大程度上限制了您随时间的移植性。\n\
  \n现在我们已经解释了无服务器是什么以及使用该技术的一些好处，我们将查看可以运行无服务器函数的各种平台。\n\n### Azure 函数应用\n\nAzure\
  \ 函数应用是 Azure 的无服务器应用程序平台提供。函数应用提供在 Linux 或 Windows 环境中运行代码或容器的能力，并支持多种编程语言，包括：\n\
  \n- .NET Platform (C#, F#)\n- JavaScript and TypeScript\n- Python\n- Java\n- PowerShell\
  \ Core\n\nAzure 函数应用将具有一个关联的计划，该计划决定了您的应用如何扩缩容、可用的功能以及您支付的价格。截至撰写本文时，有三个选项：\n\n\
  *Consumption*\n\n这是一个基本计划，函数会自动扩缩容，您仅在函数运行时付费。\n\n*Functions Premium*\n\n这会根据需求自动扩缩容，使用预热的工作进程。它运行在更强大的实例上，并允许一些高级网络功能。\n\
  \n#### App Service Plan\n\n这适用于需要预测扩缩容和计费的长期运行场景。\n\n您可以在 Azure Functions 主机选项文档页面上找到有关每个计划的更多信息。\n\
  \n### 函数应用架构\n\nAzure 的应用架构（见图 11-2）与更大的 Azure 产品套件相契合，包括 Cosmos DB、存储账户和 Azure\
  \ Pipelines。与 Cosmos DB 和存储账户的原生集成使其成为与其它 Azure 产品简单集成的有吸引力的选择。虽然本书不会涵盖，但 Azure\
  \ 函数也与 Azure Pipelines 中的持续集成/持续部署（CI/CD）提供集成，并且可以由 Azure Monitor 监控。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_359_0.png)\n\
  \n图 11-2. Azure 的无服务器函数参考架构\n\n\n\n\n\n创建函数应用时，还必须链接一个存储账户。这可用于临时存储。每个应用在创建时都会被分配一个公共的\
  \ HTTP(s) 端点，以便函数可以被访问。可以使用私有端点来保护函数应用。\n\n### 创建函数应用\n\n在本节中，我们将使用 Azure 门户创建一个函数应用。\n\
  \n- 我们将开始打开 Azure 门户并在 Function App 下点击 Create。\n- 现在我们将填写函数应用的基本参数：\n  - 我们将创建一个名为\
  \ serverless-test 的新资源组。\n  - 我们应用程序的 DNS 名称将是 ourtestfunctionapp.azurewebsites.net。\n\
  \  - 我们将运行代码（一个函数）而不是容器。\n  - 语言将是 Python v3.9。\n  - 函数应用将部署在 East US 区域。\n- 在 Hosting\
  \ 选项卡中：\n  - 我们将创建一个名为 functionstorageaccount 的新存储账户。由于存储账户名称在全球范围内唯一，您需要选择自己的名称。\n\
  \  - 因为我们运行的是 Python，所以必须运行 Linux。\n  - 最后，为本示例的目的，我们将使用 Consumption 计划。\n- 在 Monitoring\
  \ 选项卡中：\n  - 我们将关闭 Application Insights。\n  - 然后我们将点击 Review + Create。\n\n现在我们已经创建了函数应用，我们需要创建一个函数。Visual\
  \ Studio Code 有一个扩展，Azure Functions，它使创建、测试和发布函数变得简单。\n\n- 如果您尚未安装 Visual Studio\
  \ Code，您可以从 Visual Studio Code 下载页面下载。\n- 安装 Visual Studio Code 后，您需要安装 Azure Functions\
  \ 扩展。\n- 点击屏幕左侧活动栏上的 Azure 图标，这将打开 Azure Functions 窗口。点击“Create new project”。\n\
  - 将弹出一个对话框，您需要在其中选择一个本地目录来保存您的代码。\n- 然后您将被提示在单独的 Visual Studio Code 弹出窗口中输入一些项目信息：\n\
  \  - 选择函数项目的语言：选择 Python。\n  - 选择一个 Python 别名来创建虚拟环境：选择您的 Python 解释器的位置。\n  - 如果位置未显示，输入您的\
  \ Python 二进制文件的完整路径。\n  - 选择项目的第一个函数的模板：选择“HTTP trigger”。\n  - 提供函数名称：输入 HttpExample。\n\
  \  - 选择授权级别：选择 Anonymous，这允许任何人调用您的函数端点。要了解授权级别，请参阅 Authorization keys 文档。\n\n-\
  \ 选择您希望如何打开项目：选择“Add to workspace”。\n- 使用此信息，Visual Studio Code 生成一个带有 HTTP 触发器的\
  \ Azure Functions 项目。您可以在 Explorer 中查看本地项目文件。要了解更多关于创建的文件的信息，请参阅 Generated project\
  \ files 文档。\n\n- 此时，您将拥有一个项目的骨架。向 *HttpExample* 文件添加以下代码，这将返回向函数发出请求的客户端的 IP（类似于\
  \ *icanhazip.com*）：\n\n```\nimport azure.functions as func\n\ndef main(req: func.HttpRequest\
  \ ) -> func.HttpResponse:\n    response = False\n    if (req.headers.get('X-Forwarded-For')):\n\
  \        response = req.headers.get('X-Forwarded-For').split(':')[0]\n    else:\n\
  \        response = \"127.0.0.1\"\n    return func.HttpResponse(response)\n```\n\
  \n- 通过按键盘上的 F5 然后访问 http://localhost:7071/api/HttpExample 来测试您的函数。\n- 要部署到 Azure，您需要在\
  \ Azure Functions 窗口中点击“Sign in to Azure…”按钮。\n- 点击 Upload 按钮，这将允许您将函数上传到之前创建的应用。\n\
  \n现在我们已经了解了 Azure 原生的产品，让我们讨论使用 Kubernetes 部署的函数应用。\n\n### Knative\n\nKnative 是一个构建在\
  \ Kubernetes 之上的无服务器平台，在 Kubernetes 发布时因其热度而成为行业早期热门选择。Knative 的优势之一是函数被打包并作为 Docker\
  \ 容器执行，这使得将其集成到现有云环境中的工作量最小。\n\n### Knative 架构\n\nKnative 有两种运行模式：\n\n- Knative\
  \ Serving 使用 Kubernetes 部署无服务器函数或容器，并完全支持自动缩放（包括缩减到零 Pod）。它还额外支持 Gloo 和 Istio 等云网络解决方案。\n\
  - Knative Eventing 允许开发人员开发围绕事件驱动架构构建的应用程序。在事件化部署中，您可以指定事件生产者（源）以做出响应。\n\n让我们看看如何在\
  \ Kubernetes 上安装 Knative。\n\n### 在 Kubernetes 上安装和运行 Knative Serving\n\n在本节中，我们将运行一个基本的\
  \ Knative serving 系统。\n\n- 首先安装自定义资源：\n- 然后安装 serving 组件：\n\n```\nkubectl apply\
  \ -f https://github.com/knative/net-kourier/releases/download/v0.26.0/kourier.yaml\n\
  ```\n\n```\nkubectl apply -f https://github.com/knative/serving/releases/download/v0.26.0/serving-core.yaml\n\
  ```\n\n如果您想使用任何网络集成（Kourier、Ambassador、Contour、Istio），您可以按照网络层说明进行操作。\n\n- 现在您需要创建您的应用程序。我们将使用\
  \ Python 的 Flask 库创建一个简单的应用程序：\n```\nimport logging\nimport os\n\nfrom flask import\
  \ Flask\n\napp = Flask(__name__)\n\n@app.route('/', methods=['POST'])\ndef hello_world():\n\
  \    return f'Hello world. Data {request.data}\\n'\n\nif __name__ == '__main__':\n\
  \    app.run(debug=True, host='0.0.0.0', port=int(os.environ.get('PORT', 8080)))\n\
  ```\n\n- 现在您需要一个包含您的无服务器应用程序的 Docker 镜像：\n```\nFROM python:3.7-slim\n\nRUN pip install\
  \ Flask gunicorn\n\nWORKDIR /app\nCOPY . .\n```\n\n```\nCMD exec gunicorn --bind\
  \ :$PORT --workers 1 --threads 8 app:app\n```\n\n- 使用以下命令构建并推送您的新无服务器镜像：\n\n```\n\
  docker push https://myharborinstallation.com/helloworld:v1\n```\n\n- 现在在名为 *hello-world.yaml*\
  \ 的文件中定义您的无服务器服务：\n\n```\napiVersion: serving.knative.dev/v1\nkind: Service\nmetadata:\n\
  \  name: helloworld\n  namespace: default\nspec:\n  template:\n    metadata:\n \
  \     name: helloworld\n    spec:\n      containers:\n        - image: docker.io/test/helloworld:v1\n\
  ```\n\n- 使用以下命令部署函数：\n\n```\nkubectl apply -f hello-world.yaml\n```\n\n- 此时，您的无服务器函数将被部署。您可以通过运行以下命令找到函数的\
  \ URL：\n\n```\n$ kubectl get ksvc hello-world --output=custom-columns=NAME:.metadata.name,URL:.status.url\n\
  ```\n\n- 通过调用 URL 测试您的函数：\n\n```\n$ curl -X POST <URL found from above> -d \"My\
  \ Data\"\nHello World: My Data\n```\n\n现在一个基本的 serving 函数正在运行，让我们看看 Knative eventing。\n\
  \n### 在 Kubernetes 上安装和运行 Knative Eventing\n\n在本节中，我们将安装 Knative eventing 组件并编写一个简单的事件系统。\n\
  \n- 首先安装自定义资源：\n\n```\nkubectl apply -f https://github.com/knative/eventing/releases/download/v0.26.0/eventing-crds.yaml\n\
  ```\n\n- 现在安装 serving 组件：\n\n```\nkubectl apply -f https://github.com/knative/eventing/releases/download/v0.26.0/eventing-core.yaml\n\
  ```\n\n此时，您将拥有 eventing 组件已安装。我们将重用前面部分中的 Docker 镜像。然而，我们将配置 Knative，以便我们可以向 Knative\
  \ 内的消息总线发送 HTTP 消息，而不是发布到 HTTP 应用程序服务器。当消息到达消息总线时，它将触发我们的 Python 应用程序服务器。在更复杂的示例中，您可以将\
  \ Kafka 主题设置为事件源。\n\n- 创建一个 *knative-eventing.yaml* 文件：\n\n\n\n\n\n### 启用事件处理的示例应用命名空间\n\
  apiVersion: v1\nkind: Namespace\nmetadata:\n    name: knative-samples\n    labels:\n\
  \        eventing.knative.dev/injection: enabled\n---\n### 默认 Broker\napiVersion:\
  \ eventing.knative.dev/v1\nkind: Broker\nmetadata:\n    name: default\n    namespace:\
  \ knative-samples\n    annotations:\n        # Note: you can set the\neventing.knative.dev/broker.class\
  \ annotation to change\nthe class of the broker.\n        # The default broker class\
  \ is MTChannelBasedBroker,\nbut Knative also supports use of the other class.\n\
  \        eventing.knative.dev/broker.class:\nMTChannelBasedBroker\nspec: {}\n---\n\
  ### hello-world 应用部署\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n    name:\
  \ hello-world\n    namespace: knative-samples\nspec:\n    replicas: 1\n    selector:\n\
  \        matchLabels: &labels\napp: hello-world\ntemplate:\n  metadata:\n    labels:\
  \ *labels\n  spec:\n    containers:\n      - name: hello-world\n        image:\n\
  https://myharborinstallation.com/helloworld:v1\n        imagePullPolicy: IfNotPresent\n\
  ---\n### 暴露 helloworld-python 应用的服务。\n### 这将是 Trigger 的订阅者\napiVersion: v1\nkind:\
  \ Service\nmetadata:\n  name: hello-world\n  namespace: knative-samples\nspec:\n\
  \  selector:\n    app: hello-world\n  ports:\n    - protocol: TCP\n      port: 80\n\
  \      targetPort: 8080\n---\n### Knative Eventing Trigger 用于触发 helloworld-python\
  \ 服务\napiVersion: eventing.knative.dev/v1\nkind: Trigger\nmetadata:\n  name: hello-world\n\
  \  namespace: knative-samples\nspec:\nbroker: default\nfilter:\n  attributes:\n\
  \    type: dev.knative.samples.hello-world\n    source: dev.knative.samples/helloworldsource\n\
  subscriber:\n  ref:\n    apiVersion: v1\n    kind: Service\n    name: hello-world\n\
  \n- 在 Kubernetes 上应用 *knative-eventing.yaml* 配置：\n\n```\n$ kubectl apply -f knative-eventing.yaml\n\
  ```\n\n这将创建一个名为 `knative-samples` 的新 Kubernetes 命名空间以允许事件处理，并创建一个消息 Broker 来将消息传递给我们的\
  \ Python 应用服务器（在事件发生时）。\n\n- 我们现在将向我们的 Knative 消息 Broker 发送一个事件。以下是响应：\n\n```\n\
  curl -v \"broker-ingress.knative-eventing.svc.cluster.local/knative-samples/default\"\
  \ \\\n-X POST \\\n-d 'My data'\n```\n\n```\nEvent received. Context: Context Attributes,\n\
  \  specversion: 0.3\n  type: dev.knative.samples.hello-world\n  source: dev.knative.samples/helloworldsource\n\
  \  id: 536808d3-88be-4077-9d7a-6a3f162705f79\n  time: 2021-11-09T06:21:26.09471798Z\n\
  \  datacontenttype: application/json\n```\n\n```\nExtensions,\n    Knativearrivaltime:\
  \ 2021-11-09T06:21:26Z\n    knativehistory: default-kn2-trigger-kn-channel.knative-samples.svc.cluster.local\n\
  \    traceparent: 00-971d4644229653483d38c46e92a959c7-92c66312e4bb39be-00\n```\n\
  \n```\nHello World Message \"My data\"\nResponded with event Validation: valid\n\
  Context Attributes,\n    specversion: 0.2\n    type: dev.knative.samples.hifromknative\n\
  \    source: knative/eventing/samples/hello-world\n    id: 37458d77-01f5-411e-a243-a459bbf79682\n\
  Data,\n    My data\n```\n\n### KEDA\n\nKEDA 代表 *Kubernetes Event-Driven Autoscaling*。KEDA\
  \ 允许你根据传入事件的数量来扩展 Kubernetes 中的任何容器。KEDA 是 Kubernetes 的一个插件，并利用 Horizontal Pod Autoscaler\
  \ 根据多种事件源进行扩展，包括 Apache Kafka、Azure Event Hubs 和 NATS streaming。\n\n### KEDA 架构\n\
  \n典型的 KEDA 架构如图 11-3 所示，其中 KEDA 直接与 Kubernetes API 服务器、HPA 和配置的触发源交互。\n\nKEDA 组件执行以下角色：\n\
  \n*Controller and scaler*\n\n控制器和缩放器会根据指标适配器的信号向上或向下扩展 Pod 的数量。\n\n### 指标适配器\n\n\
  指标适配器充当 Kubernetes 指标服务器，为代理提供队列长度或流滞后信息。缩放器使用此信息来扩展容器。\n\n你可以在 Scalers 文档中查看所有\
  \ KEDA 缩放器。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_371_0.png)\n\n图 11-3. KEDA\
  \ 参考架构\n\n### 在 Kubernetes 上安装 KEDA\n\nKEDA 最好使用 Helm 操作符在 Kubernetes 上安装。我们现在将逐步进行。\n\
  \n- 添加 KEDA Helm 仓库：\n  \n  $ helm repo add kedacore\n  https://kedacore.github.io/charts\n\
  \  \n- 安装 Helm chart：\n  \n  $ kubectl create namespace keda\n  $ helm install keda\
  \ kedacore/keda --namespace keda\n\n之后，你的 Kubernetes 集群将准备好进行函数部署。\n\n在下一个示例中，我们将使用\
  \ Azure Service Bus 队列构建一个概念验证事件系统。我们将使用 Python 脚本向 Azure Service Bus 队列生成消息，然后使用\
  \ KEDA 来扩展 Python 消费作业。\n\n- 使用 Azure 文档中描述的手动方法或通过运行以下命令获取你的 Service Bus 连接字符串：\n\
  \  \n  az servicebus namespace authorization-rule keys list \\\n    -n RootManageSharedAccessKey\
  \ -g <group> --namespace-name <namespace> \\\n    --query primaryConnectionString\
  \ -o tsv\n  \n- 你需要通过运行以下命令获取连接字符串和队列名称的 Base64 编码值：\n  \n  $ echo -n \"<connection\
  \ string>\" | base64\n  $ echo -n \"<queue name>\" | base64\n\n- 现在创建一个名为 *secret.yaml*\
  \ 的文件。用上一 步生成的 Base64 字符串替换 `servicebus-queue` 和 `servicebus-connectionstring` 值。\n\
  \n```\napiVersion: v1\nkind: Secret\nmetadata:\n  name: sample-job-secret\n  namespace:\
  \ default\ndata:\n  servicebus-queue:\n    <base64_encoded_servicebus_queue_name>\n\
  \  servicebus-connectionstring:\n    <base64_encoded_servicebus_connection_string>\n\
  ```\n\n- 创建第二个文件，名为 *keda.yaml*，它将创建你的扩展作业。触发时它将运行一个 docker 镜像（`docker.pkg.github.com/prabdeb/sample-python-keda-service-bus-scaler/consumer:latest`）：\n\
  \n```\napiVersion: keda.sh/v1alpha1\nkind: TriggerAuthentication\nmetadata:\n  name:\
  \ auth-service-bus-sample-job\nspec:\n  secretTargetRef:\n    - parameter: connection\n\
  \      name: sample-job-secret\n      key: servicebus-connectionstring\n---\napiVersion:\
  \ keda.sh/v1alpha1\nkind: ScaledJob\nmetadata:\nname: servicebus-queue-so-sample-job\n\
  namespace: default\nspec:\n  jobTargetRef:\n    parallelism: 1 # max number of desired\
  \ pods\n    completions: 1 # desired number of successfully\nfinished pods\n   \
  \ activeDeadlineSeconds: 600 # Specifies the duration\nin seconds relative to the\
  \ startTime that the job may be\nactive before the system tries to terminate it;\
  \ value\nmust be positive integer\n    backoffLimit: 6 # Specifies the number of\
  \ retries\nbefore marking this job failed. Defaults to 6\n    template:\n      metadata:\n\
  \        labels:\n          app: sample-keda-job\n      spec:\n        containers:\n\
  \        - name: sample-keda-job\n          image: docker.pkg.github.com/prabdeb/sample-python-keda-service-bus-scaler/consumer:latest\n\
  \          env:\n          - name: SERVICE_BUS_CONNECTION_STR\n            valueFrom:\n\
  \              secretKeyRef:\n                name: sample-job-secret\n        \
  \        key: servicebus-connectionstring\n          - name: SERVICE_BUS_QUEUE_NAME\n\
  \            valueFrom:\n              secretKeyRef:\n                name: sample-job-secret\n\
  \                key: servicebus-queue\n        restartPolicy: Never\npollingInterval:\
  \ 30                                      # Optional.\nDefault: 30 seconds\n   \
  \ successfulJobsHistoryLimit: 100                      # Optional.\nDefault: 100.\
  \ How many completed jobs should be kept.\n    failedJobsHistoryLimit: 100     \
  \                    # Optional.\nDefault: 100. How many failed jobs should be kept.\n\
  \    #envSourceContainerName: {container-name}    # Optional.\nDefault: .spec.JobTargetRef.template.spec.containers[0]\n\
  \    maxReplicaCount: 100                                # Optional.\nDefault: 100\n\
  \    scalingStrategy:\n        strategy: \"custom\"                            \
  \ # Optional.\nDefault: default. Which Scaling Strategy to use.\n        customScalingQueueLengthDeduction:\
  \ 1            # Optional.\nA parameter to optimize custom ScalingStrategy.\n  \
  \      customScalingRunningJobPercentage: \"0.5\"  # Optional.\nA parameter to optimize\
  \ custom ScalingStrategy.\n    triggers:\n    - type: azure-servicebus\n       \
  \ metadata:\n            # Required: queueName OR topicName and\nsubscriptionName\n\
  \            queueName: <servicebus_queue_name>\n            # Required: Define\
  \ what Azure Service Bus to\nauthenticate to with Managed Identity\n           \
  \ namespace: <servicebus_namespace>\n            messageCount: \"10\" # default\
  \ 5\n        authenticationRef:\n            name: auth-service-bus-sample-job #\n\
  authenticationRef would need either podIdentity or define\na connection parameter\n\
  ```\n\n- 现在你可以使用以下命令将两个文件应用到 Kubernetes：\n\n\n```\n$ kubectl apply -f keda-config/jobs/secret.yaml\n\
  $ kubectl apply -f keda-config/jobs/keda.yaml\n```\n\n+   - 通过运行以下命令验证你的扩缩作业是否就绪：\n\
  \n```\n$ kubectl get ScaledJob\n$ kubectl get TriggerAuthentication\n```\n\n+  \
  \ - 你可以通过运行测试脚本来测试你的 KEDA 部署。首先你需要设置 Python 环境：\n\n```\n$ python3 -m venv .\n$ source\
  \ bin/activate\n$ pip3 install logger\n$ pip3 install azure-servicebus\n```\n\n\
  +   - 现在你需要创建你的程序来向 Azure Service Bus 队列发送消息。你需要修改 connection_string 和 queue_name：\n\
  \n```\nimport os\nimport sys\nimport time\nimport yaml\nfrom logger import logger\n\
  from azure.servicebus import ServiceBusClient,\nServiceBusMessage\n```\n\n```\n\
  def send_a_list_of_messages(sender):\n    messages = [ServiceBusMessage(f\"Message\
  \ in list {i}\")\n    for i in range(1000)]\n    sender.send_messages(messages)\n\
  \    logger.info(\"Sent a list of 1000 messages\")\n```\n\n```\ndef main():\n  \
  \  with open(\"azure-service-bus.yaml\", 'r') as stream:\n        config = yaml.safe_load(stream)\n\
  \n    logger.info(\"Start sending messages\")\n    connection_string = <FIXME>\n\
  \    queue_name = <FIXME>\n\n    queue =\nServiceBusClient.from_connection_string(conn_str=connecti\n\
  on_string, queue_name=queue_name)\n\n    with queue:\n        sender =\nqueue.get_queue_sender(queue_name=queue_name)\n\
  \        with sender:\n            send_a_list_of_messages(sender)\n\n    logger.info(\"\
  Done sending messages\")\n    logger.info(\"------------------------\")\n\nif __name__\
  \ == \"__main__\":\n    main()\n```\n\n+   - 运行 *python3 send_message_queue.py*。这将创建\
  \ 1,000 条消息并发送到 Azure Service Bus 队列。\n\n你可以在 Azure Service Bus 队列中看到消息被摄取然后处理（图\
  \ 11-4）。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_378_0.png)\n\n图 11-4. Azure\
  \ Service Bus 队列\n\n在下一节中，我们将介绍 OpenFaaS，它在独立系统和 Kubernetes 集群上都提供简单、无[content]\n\
  \n```\n$ kubectl apply -f keda-config/jobs/secret.yaml\n$ kubectl apply -f keda-config/jobs/keda.yaml\n\
  ```\n\n+   - 通过运行以下命令验证你的扩缩作业是否就绪：\n\n```\n$ kubectl get ScaledJob\n$ kubectl get\
  \ TriggerAuthentication\n```\n\n+   - 你可以通过运行测试脚本来测试你的 KEDA 部署。首先你需要设置 Python 环境：\n\
  \n```\n$ python3 -m venv .\n$ source bin/activate\n$ pip3 install logger\n$ pip3\
  \ install azure-servicebus\n```\n\n+   - 现在你需要创建你的程序来向 Azure Service Bus 队列发送消息。你需要修改\
  \ connection_string 和 queue_name：\n\n```\nimport os\nimport sys\nimport time\nimport\
  \ yaml\nfrom logger import logger\nfrom azure.servicebus import ServiceBusClient,\n\
  ServiceBusMessage\n```\n\n```\ndef send_a_list_of_messages(sender):\n    messages\
  \ = [ServiceBusMessage(f\"Message in list {i}\")\n    for i in range(1000)]\n  \
  \  sender.send_messages(messages)\n    logger.info(\"Sent a list of 1000 messages\"\
  )\n```\n\n```\ndef main():\n    with open(\"azure-service-bus.yaml\", 'r') as stream:\n\
  \        config = yaml.safe_load(stream)\n\n    logger.info(\"Start sending messages\"\
  )\n    connection_string = <FIXME>\n    queue_name = <FIXME>\n\n    queue =\nServiceBusClient.from_connection_string(conn_str=connecti\n\
  on_string, queue_name=queue_name)\n\n    with queue:\n        sender =\nqueue.get_queue_sender(queue_name=queue_name)\n\
  \        with sender:\n            send_a_list_of_messages(sender)\n\n    logger.info(\"\
  Done sending messages\")\n    logger.info(\"------------------------\")\n\nif __name__\
  \ == \"__main__\":\n    main()\n```\n\n+   - 运行 *python3 send_message_queue.py*。这将创建\
  \ 1,000 条消息并发送到 Azure Service Bus 队列。\n\n你可以在 Azure Service Bus 队列中看到消息被摄取然后处理（图\
  \ 11-4）。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_378_0.png)\n\n图 11-4. Azure\
  \ Service Bus 队列\n\n在下一节中，我们将介绍 OpenFaaS，它在独立系统和 Kubernetes 集群上都提供简单、无附加功能的函数。\n\
  \n### OpenFaaS\n\nOpenFaaS 是 Kubernetes 的另一个事件驱动函数服务，允许你使用任何语言编写函数，然后将它们打包到 Docker\
  \ 或 OCI 兼容的容器中。\n\n#### OpenFaaS 架构\n\nOpenFaaS 参考架构（如图 11-5 所示）与 KEDA 相当相似。然而，OpenFaaS\
  \ 确实依赖于 Prometheus 的指标作为自动扩缩信号。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_378_1.png)\n\
  \n图 11-5. OpenFaaS 参考架构\n\n### 安装 OpenFaaS\n\nOpenFaaS 有三种推荐的安装方法：\n\n- 使用 `arkade`\n\
  - 使用 `helm`\n- 使用 Flux 或 ArgoCD 安装\n\n为了与本书其余部分保持一致，我们将使用 Helm 部署 OpenFaaS。\n\n\
  - 创建命名空间（一个用于 OpenFaaS 核心服务，一个用于函数）：\n\n```\nkubectl apply -f\nhttps://raw.githubusercontent.com/openfaas/faas-netes/master/namespaces.yml\n\
  ```\n\n- 添加 OpenFaaS Helm 图表：\n\n```\nhelm repo add openfaas https://openfaas.github.io/faas-netes/\n\
  ```\n\n- 最后，部署 OpenFaaS：\n\n```\nhelm repo update \\\n  && helm upgrade openfaas\
  \ --install openfaas/openfaas \\\n    --namespace openfaas \\\n    --set functionNamespace=openfaas-fn\
  \ \\\n    --set generateBasicAuth=true\n```\n\n- 你可以通过运行以下命令检索管理员密码；该密码将用于访问 OpenFaaS\
  \ 仪表板：\n\n```\nPASSWORD=$(kubectl -n openfaas get secret basic-auth -o jsonpath=\"\
  {.data.basic-auth-password}\" | base64 --decode)\n&& \\\necho \"OpenFaaS admin password:\
  \ $PASSWORD\"\n```\n\n现在我们已经安装了 OpenFaaS，我们将编写一个 OpenFaaS 函数。\n\n### 编写你的第一个 OpenFaaS\
  \ 函数\n\n在本节中，我们将利用 faas-cli 快速创建和部署一个无服务器函数。\n\n- 通过在 OSX 上运行 `brew install faas-cli`，或在\
  \ Linux 上运行 `curl -sSL https://cli.openfaas.com | sudo sh` 来下载 faas-cli。\n- 创建一个文件夹来放置你的新函数：\n\
  - 使用 faas-cli 创建一个新的 Python 函数项目：\n\n```\nmkdir -p ~/functions && cd ~/functions\n\
  ```\n\n```\nfaas-cli new --lang python helloworld\n```\n\n这将创建三个新文件：\n\n```\n$ ls\n\
  helloworld/handler.py\nhelloworld/requirements.txt\nhelloworld.yml\n```\n\nhandler.py\
  \ 文件是你编写函数的地方。requirements.txt 文件与标准的 Python *requirements.txt 文件*相同。*helloworld.yml*\
  \ 文件定义了函数的一些样板。\n\n- 在 *handler.py* 文件中，我们将定义我们的函数。此函数将打印 \"Hello World! You said:\
  \ \" 加上发布到函数端点的数据：\n  \n  ```\n  def handle(req):\n      print(\"Hello World! You\
  \ said: \" + req)\n  ```\n\n- 最后，在你的 *helloworld.yml* 文件中，你将定义函数的相关元数据。http://127.0.0.1:31112\
  \ 是 OpenFaaS 网关/API 服务器的默认地址：\n  \n  ```\n  provider:\n    name: openfaas\n    gateway:\
  \ http://127.0.0.1:31112\n  \n  functions:\n    hello-python:\n      lang: python\n\
  \      handler: ./hello-world\n      image: hello-world\n  ```\n\n- 构建无服务器镜像并推送到你在第\
  \ 2 章中创建的 Harbor 仓库：\n  \n  ```\n  $ faas-cli build -f ./hello-world.yml\n  $ faas-cli\
  \ push -f ./hello-world.yml\n  ```\n\n- 部署到 Kubernetes 集群：\n  \n  ```\n  $ faas-cli\
  \ deploy -f ./hello-world.yml\n  Deploying: hello-python.\n  No existing service\
  \ to remove\n  ```\n\n```\nDeployed.\n200 OK\nURL: http://127.0.0.1:31112/function/hello-python\n\
  ```\n\n- 上一步输出了你可以测试的 URL。使用 `curl` 来测试它：\n\n```\n$ curl -X POST 127.0.0.1:31112/function/hello-world\
  \ -d\n\"My name is Michael\"\nHello world! My name is Michael\n```\n\n默认情况下，OpenFaaS\
  \ 使用每秒请求数（rps）作为执行自动扩缩的机制。你可以在 Autoscaling 文档页面上找到有关 OpenFaaS 自动扩缩配置的更多信息。\n\n此时，你将在\
  \ Kubernetes 上拥有一个运行中的 OpenFaaS 函数。你也可以使用 faasd 在 Kubernetes 外部运行 OpenFaaS。有关更多信息，请参阅\
  \ OpenFaaS 部署页面。\n\n最后，OpenFaaS 建立在 Kubernetes HPA 之上。你可以从 OpenFaaS Kubernetes 教程页面了解有关如何负载测试和自动扩缩你的\
  \ OpenFaaS 函数的更多信息。\n\n### 总结\n\n虽然无服务器绝对不是适合所有人的方案，但在正确的情况下使用可以提供显著的优势。无服务器空间仍在不断发展，但入门门槛极低，这使其成为令人兴奋的技术。在本章中，我们探讨了四种在\
  \ Azure 上运行无服务器函数的方式。首先我们介绍了 Azure 函数应用，然后介绍了三个领先的 CNCF 项目：Knative、KEDA 和 OpenFaaS。此时，我们已经概述了云原生基础设施的主要支柱。在第\
  \ 12 章中，我们将回顾你在整个旅程中学到的内容。\n\n## 第 12 章. 结论\n\n### 早期发布读者的注意事项\n\n使用 Early Release\
  \ 电子书，你可以在这些标题的正式发布之前很久就利用这些技术——作者在撰写时提供的原始和未编辑内容，以便你可以在这些技术正式发布之前利用它们。\n\n这将是最终书籍的第\
  \ 12 章。请注意，GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何意见，或者如果你注意到本章中缺少材料，请联系编辑 rfernando@oreilly.com。\n\
  \n我们已经到了本书的结尾，让我们回顾一下我们的旅程。在本书中，我们的目标是提供一个单一资源，你可以用它在 Azure 中构建和运行云原生基础设施。虽然 Azure\
  \ 是我们的重点，但你也可以将相同的知识应用于在不同云厂商平台上构建和运营你自己的云原生环境。让我们回顾一下你迄今为止学到的内容。\n\n我们首先回顾了基础设施和服务世界随着云的引入而随时间演变的过程。为了充分利用云所提供的优势，我们需要开发原生于云的解决方案，而不是事后将其改编为云。我们理解云原生是充分利用云强大功能的方式。\n\
  \n在第 2 章中，我们介绍了使用 Azure 构建现代云原生环境的基石。我们设置了 Azure 账户并开始使用 Ansible、Terraform 和 Packer。通过将它们作为我们的关键工具，我们可以以自动化方式启用生产就绪的服务。我们\n\
  \n\n\n我们选择 Microsoft Azure 作为云服务提供商，并且在整本书中我们同时使用了云原生和 Azure 服务来展示现代基础设施是如何构建和支持的。\n\
  \n在第 3 章中，我们向您介绍了容器和容器运行时，它们构成了现代云原生世界的基础。我们讨论了构成容器生态系统的抽象层。\n\n我们在第 4 章和第 5 章中转向了强大的编排器\
  \ Kubernetes，并展示了这个重要工具如何在现代云基础设施中用于促进云原生应用程序的平台。Kubernetes 推动了 Cloud Native Computing\
  \ Foundation（CNCF）的创立以及其适应，并是其下毕业的第一个项目。这导致了容器化世界的极大简化以及云原生生态系统的更高采用。我们深入研究了使该系统能够大规模运行的各种组件和概念，并学习了如何手动创建\
  \ Kubernetes 集群以及使用 Azure AKS 作为托管服务创建。\n\n此时，我们已经涵盖了最小云原生基础设施的基础是什么。下一步是添加一种获取应用程序和基础设施洞察的方法。因此，在第\
  \ 6 章中，我们介绍了可观测性的三大支柱的概念，以便您深入了解这个庞大的基础设施和应用程序堆栈。通过构建可观测的系统，您可以更好地控制跨边界交互的复杂分布式系统。在本章中，我们也尝试了可观测性及其在云原生环境中日益增长的需求。凭借可观测性的三大支柱以及在\
  \ Azure 上对现代分布式系统进行日志记录、监控和追踪的首选方式的介绍，我们以简要介绍 Azure 如何提供其内置解决方案 Azure Monitor 来执行类似任务作为本章的结尾。\n\
  \n当我们谈论边界和边境时，我们面临着在这种动态变化的环境中服务到服务通信的问题。因此，为了解决这个问题，我们在第 7 章中引入了服务发现和服务网格，以便找到服务并有效地与之通信。我们还仔细展示了服务网格和代理在高效控制微服务所在整体环境方面的需求。我们介绍了\
  \ CoreDNS 作为 Kubernetes 环境中默认的 DNS，取代了 kube-dns。我们还使用 Istio 介绍了服务网格，Istio 使用 Envoy\
  \ 作为其数据平面来获取有关服务的有用洞察，并提供 Istio 服务网格的完整功能集。在本章的最后，我们展示了 Kiali，它为基于 Istio 的服务网格提供了一个完整的管理控制台。\n\
  \n在第 8 章中，我们转向了云原生环境中网络和策略管理的问题。我们向您介绍了三个主要工具：Calico、Weave 和 Flannel，它们充当容器网络接口。我们还阐明了您如何使用开放策略管理在整个堆栈中强制执行策略。我们回顾了\
  \ CNI 标准以及它如何成为 Flannel 和 Cilium 等平台的基础。我们研究了这些系统如何用于为您的云基础设施提供连接和网络安全。我们还通过 Azure\
  \ Policy 查看了管理云基础设施的非网络策略机制，以及通过 Open Policy Agent 对应用程序的策略。\n\n在第 9 章中，我们使用 Vitess\
  \ 作为分布式数据库，探讨了存储在云原生环境中的感知和设计。我们还谈到了 Rook，它是一个广泛的存储编排器，可以通过诸如自扩展和自愈等功能帮助您减轻管理分布式存储系统的负担。在本章中，我们回顾了为什么在\
  \ Azure 云中使用云原生数据系统是有利的。我们涵盖了四种系统：Vitess（关系型）、Rook（blob）、TiKV（键值）和 etcd（键值配置/服务发现）。这些系统是云原生架构存储和提供在线数据的基石，并且相比使用\
  \ PaaS 组件具有很大的优势。\n\n在第 10 章中，我们谈到了如何在云原生环境中使用传统技术如 NATS、gRPC、Apache Kafka 和 RabbitMQ\
  \ 来构建和部署消息传递和流服务。\n\n最后，在第 11 章中，我们探讨了在 Azure 上运行无服务器函数四种不同方式。首先我们查看了 Azure Function\
  \ Apps，然后我们查看了三个领先的 CNCF 项目：Knative、KEDA 和 OpenFaaS。\n\n我们希望您能够很好地理解如何构建和使用云原生基础设施。现在您拥有了在\
  \ Azure 上构建和运营自己的云原生基础设施的知识。\n\n### 下一步？\n\nCNCF 景观相当庞大，它包含大量由许多优秀公司持续构建和支持的项目（图\
  \ 12-1）。这些项目从一开始就考虑了规模和可靠性而构建。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_386_0.png)\n\
  \n图 12-1. CNCF 景观\n\n我们强烈鼓励您探索 CNCF 景观中的其他技术，以根据您的用例构建您的云原生环境，并且我们也鼓励您探索 CNCF 无服务器景观（图\
  \ 12-2）。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_387_0.png)\n\n图 12-2. CNCF\
  \ 无服务器景观\n\nCNCF 无服务器景观突出了无服务器计算以及相关的编程模型和消息格式。虽然无服务器计算已经广泛可用，但在这种方法的开发中仍有大量的范围和深度。您可以探索无服务器计算，如果您的工作负载是异步的、间歇性的、无状态的，并且在不断变化的业务需求方面高度动态。您也可以开始使用各种\
  \ Azure 服务，并查看它们如何与 CNCF 技术进行比较。\n\n大多数这些项目都是开源的，是许多工程师为社区做出积极贡献的成果。开源也为这些项目的整体设计带来了大量的质量控制。这意味着云原生技术在全球范围内都得到很好的支持，并且易于适应。同样重要的是要指出，许多这些云原生技术都是为了解决需要高效解决的困难问题而产生的。因此，有时冒险提出难题同样重要，以便深入了解您的系统，这最终会引导您找到复杂问题的正确解决方案。\n\
  \n云原生景观仍在不断增长，我们鼓励您进一步探索其真正的潜力。祝您好运。\n\n### 关于作者\n\n**Nishant Singh** 是 LinkedIn\

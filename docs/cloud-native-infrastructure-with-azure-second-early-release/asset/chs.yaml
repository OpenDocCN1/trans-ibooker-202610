  \n图 2-8. 虚拟网络创建\n\n如图所示 2-9，Terraform 已将虚拟网络的状态存储在我们之前创建的 blob 存储账户上。\n\n\n\n\n\n\
  ![](img/8d47d1b5dbca55e784ae602145a894c7_50_0.png)\n\nFigure 2-9. Virtual network\
  \ state uploaded by Terraform on storage account\n\n同样地，你可以按照前面的步骤，使用位于 https://bit.ly/3bQjTEV\
  \ 的 Terraform 模块在其中一个子网内启动一台虚拟机。\n\n> WARNING\n> \n> 在完成本示例中的资源创建后，请确保使用 `terraform\
  \ destroy` 命令在每个资源目录中销毁它们，以防你的 Azure 账户已启用计费。\n\n### Terraform and ARM templates\n\
  \n在进入下一节之前，让我们先看看 Azure 原生为实现基础设施即代码提供的功能。如前所述，Azure 使用 ARM 模板来实现面向 Azure 工作负载的基础设施即代码。ARM\
  \ 模板以 JSON⁶ 文件的形式提供，该文件定义了项目的基础设施和配置。该文件使用与 Terraform 类似的声明式语法，让你声明所需的基础设施配置。除了声明式语法之外，ARM\
  \ 模板还继承了幂等性；也就是说，你可以多次部署相同的模板并获得相同类型的资源且处于相同状态。资源管理器负责将 ARM 模板转换为 REST API 操作。例如，如果你部署以下\
  \ ARM 模板：\n\n```\n\"resources\": [\n  {\n    \"type\": \"Microsoft.Storage/storageAccounts\"\
  ,\n    \"apiVersion\": \"2019-04-01\",\n    \"name\": \"teststorageaccount\",\n\
  \    \"location\": \"eastus\",\n    \"sku\": {\n      \"name\": \"Standard_LRS\"\
  \n    },\n    \"kind\": \"StorageV2\",\n    \"properties\": {}\n  }\n]\n```\n\n\
  资源管理器会将 JSON 转换为 REST API 操作，并将其发送到 Microsoft.Storage 资源提供程序，如下所示：\n\n```\nPUT\n\
  https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Storage/storageAccounts/teststorageaccount?api-version=2019-04-01\n\
  REQUEST BODY\n{\n  \"location\": \"eastus\",\n  \"sku\": {\n    \"name\": \"Standard_LRS\"\
  \n  },\n  \"kind\": \"StorageV2\",\n  \"properties\": {}\n}\n```\n\n你也可以使用 Terraform\
  \ 通过 AzureRM 提供程序的资源 azurerm_resource_group_template_deployment 来部署 ARM 模板。\n\n\
  ### Packer\n\n在本章开头，我们介绍了 *immutable infrastructure* 这一术语，它代表了云原生应用程序的配置和部署方式的转变。用于构建预烘焙⁷\
  \ 机器镜像的最广泛使用的工具之一是 Packer。机器镜像主要是预先安装/配置了所有配置、元数据、工件和相关文件的计算资源。Packer（https://www.packer.io）是\
  \ HashiCorp 的一个开源工具，用于根据定义好的配置创建机器镜像。它自动化了整个机器镜像创建过程，从而提高了基础设施部署的速度。就像 Terraform\
  \ 用于构建基础设施一样，Packer 通过将所有必要的软件、二进制文件等烘焙到机器镜像中来协助构建机器镜像。\n\n此外，由于机器镜像构建之前所有软件都已安装并配置好，Packer\
  \ 有助于提高基础设施的整体稳定性。它还支持不同的云提供商，最终可在多个平台上创建相同的机器镜像。让我们深入了解一下 Packer 如何在 Azure 中用于构建镜像。\n\
  \n#### Installing Packer\n\n要开始使用 Packer，请下载适用于你本地机器⁸ 的 Packer 二进制文件（https://www.packer.io/downloads.html）。解压二进制文件并将其移动到\
  \ `/usr/local/bin`。这样即可在你的机器上设置 Packer；你可以通过在 shell 上运行 `packer --help` 来验证：\n\n\
  ```\n$ ~ packer --help\nUsage: packer [--version] [--help] <command> [<args>]\n\n\
  Available commands are:\n    build          build image(s) from template\n    console\
  \        creates a console for testing variable\ninterpolation\n    fix        \
  \    fixes templates from old versions of packer\n    inspect        see components\
  \ of a template\n```\n\n```\nvalidate    check that a template is valid\nversion\
  \     Prints the Packer version\n```\n\n#### Building a Linux image on Azure\n\n\
  Packer 使用一个定义机器镜像的配置文件。该配置文件称为 packer template，并以 JSON 编写。模板包含 builders 和 provisioners。Builders\
  \ 通过读取配置和身份验证密钥为平台创建机器镜像。Provisioners 负责在镜像变为不可变之前在其上安装和配置软件。Figure 2-10 描述了 Packer\
  \ 镜像创建过程。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_53_0.png)\n\nFigure 2-10.\
  \ Image creation process using Packer\n\n你可以在 https://bit.ly/3GRgswf 找到与 Packer\
  \ 机器镜像创建相关的代码。要运行此代码，首先必须使用 example.json 文件中的身份验证详细信息更新代码。你可以从 bash_profile 文件中使用\
  \ Azure 账户的身份验证详细信息。\n\n运行的输出应如下所示：\n\n```\n$ 1.2.2.2 git:(master) X packer build\
  \ example.json\nazure-arm: output will be in this color.\n\n==> azure-arm: Running\
  \ builder ...\n==> azure-arm: Getting tokens using client secret\n==> azure-arm:\
  \ Getting tokens using client secret\n    azure-arm: Creating Azure Resource Manager\
  \ (ARM) client ...\n==> azure-arm: WARNING: Zone resiliency may not be supported\
  \ in East US, checkout the docs at https://docs.microsoft.com/en-us/azure/availability-zones/\n\
  ==> azure-arm: Creating resource group ...\n==> azure-arm:   -> ResourceGroupName\
  \ : 'pkr-Resource-Group-k9831evluk'\n==> azure-arm:   -> Location          : 'East\
  \ US'\n==> azure-arm:\n.\n.\n```\n\n```\n==> azure-arm:\nBuild 'azure-arm' finished.\n\
  \n==> Builds finished. The artifacts of successful builds are:\n--> azure-arm: Azure.ResourceManagement.VMImage:\n\
  \nOSType: Linux\nManagedImageResourceGroupName: CloudNativeAzure-group\nManagedImageName:\
  \ myfirstPackerImage\nManagedImageId: /subscriptions/b1234567-89017-6135-v94s-3v16ifk86912/resourceGroups/CloudNativeAzure-group/providers/Microsoft.Compute/images/myfirstPackerImage\n\
  ManagedImageLocation: East US\n```\n\nFigure 2-11 显示了我们在 Azure 门户中创建的镜像。你可以通过使用该镜像启动虚拟机来验证镜像中已烘焙了\
  \ Nginx Web 服务器和 HAProxy 负载均衡器及代理服务器。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_54_0.png)\n\
  \nFigure 2-11. Machine image creation with Packer\n\n现在你已经了解了 Packer 作为镜像构建工具的作用，让我们来看一下\
  \ Ansible，它在复杂云原生环境的管理中是一个巨大的补充。\n\n### Ansible\n\nAnsible 是一个简单的配置管理工具，允许你配置、配置和管理服务器。Ansible\
  \ 使管理未在其上运行预安装代理的服务器变得非常容易，尽管你也可以将 Ansible 配置为基于代理的系统。此外，在使用 Terraform 创建基础设施并使用\
  \ Packer 烘焙机器镜像后，你也可以利用 Ansible 作为工具。\n\nAnsible 的基本概念如下：\n\n*Playbooks*\n\nAnsible\
  \ playbooks 是需要在实例上执行的任务或 *plays* 的列表。一个简单的例子是：\n\n- 添加 Nginx 仓库。\n- 安装 Nginx。\n\
  - 创建根目录。\n\n这个有序列表可以转换为 Ansible playbook 如下：\n\n```\n---\n- hosts: local\n  vars:\n\
  \    - docroot: /var/www/serversforhackers.com/public\n  tasks:\n    - name: Add\
  \ Nginx Repository\n      apt_repository: repo='ppa:nginx/stable' state=present\n\
  \    - name: Install Nginx\n```\n\n```\napt: pkg=nginx state=installed update_cache=true\n\
  \n- name: Create Web Root\n  file: dest=/etc/nginx\n    mode=775\n    state=directory\n\
  \    owner=www-data\n    group=www-data\n  notify:\n    - Reload Nginx\n```\n\n\
  #### Control node\n\n这通常是你将执行 Ansible playbook 的节点。这可以是安装了 Ansible 的任何节点。要运行 Ansible\
  \ playbook，你可以在终端中执行以下命令：\n\n```\nansible-playbook -vi path_to_host_inventory_file\
  \ playbook.yaml\n```\n\n#### Managed nodes\n\n你想要管理的节点或主机被称为托管节点。这些节点通常是远程服务器。Ansible\
  \ 最好的地方在于，你无需在远程实例上安装代理即可管理它们。你只需要主机上正在监听的 Secure Shell（SSH）守护进程以及已安装的 Python。Ansible\
  \ 创建 SSH 连接以执行 playbooks。\n\n\n\n\n\n### 库存文件\n\n库存文件保存着 Ansible 管理的所有主机的列表。库存通常包含\
  \ IP 地址、主机名、用于连接远程机器的 SSH 用户名和密钥。以下是库存的示例：\n\n```\nmail.example.com\n\n[webservers]\n\
  foo.example.com\nbar.example.com\n\n[dbservers]\none.example.com\ntwo.example.com\n\
  three.example.com\n\n[midtierrservers]\n10.0.1.2\n10.2.3.4\n```\n\n由于 Ansible 不需要太多开销并且是用\
  \ YAML 编写的，因此它作为一个很好的后配置工具。我们将在本书中不时使用 Ansible 来配置服务的一部分。\n\n在结束本章之前，让我们快速了解一下 Azure\
  \ DevOps，它帮助我们以自动化方式将所有这些工具结合起来创建 CI/CD 管道。\n\n### Azure DevOps 和基础设施即代码\n\nAzure\
  \ 提供 *Azure DevOps*，它为开发和部署应用程序提供端到端的 DevOps 工具链，并且主要是一个用于部署 CI/CD 管道的托管服务。你也可以将\
  \ Terraform、Ansible 和 Packer 一起使用，并为你的项目构建多阶段管道。Azure DevOps 包含许多服务，其中包括 *Azure\
  \ Pipeline*，主要用于构建、测试和部署 CI/CD 管道。我们不会深入探讨 Azure DevOps，因为它超出了本书的范围，但你可以在官方文档中阅读有关设置\
  \ Azure DevOps 的更多信息。⁹\n\n### 总结\n\n在本章中，我们介绍了使用 Azure 构建现代云原生环境的基石。你创建了一个 Azure\
  \ 账户，这将在后续章节中派上用场，因为你将更深入地了解云原生技术。你还了解了 Terraform、Packer 和 Ansible：这三种有用的云原生编排器，将帮助你部署和管理云基础设施。Terraform\
  \ 是一种云无关的工具，用于从头开始开发基础设施即代码，Packer 用于创建机器映像以开发不可变构件，而 Ansible 是一种配置管理工具。\n\n有了对\
  \ Azure 和相关技术的这种基本理解，我们可以进入下一章，在那里我们将讨论容器、容器注册表以及将你的应用程序容器化。\n\n3 MFA 为登录过程增加了一层保护。在访问账户或应用时，用户需要提供额外的身份验证，例如扫描指纹或输入发送到其手机的代码。\n\
  \n4 Azure Cloud Shell 随附最新版本的 Cloud Shell。有关如何在 Cloud Shell 上开始使用 Terraform 的信息，请访问\
  \ https://docs.microsoft.com/en-us/azure/developer/terraform/get-started-cloud-shell。\n\
  \n5 Azure 服务主体是为应用程序、托管服务和自动化工具创建的身份，用于访问 Azure 资源。此访问权限受分配给服务主体的角色限制，让你控制可以访问哪些资源以及访问级别。\n\
  \n6 Azure 默认使用 JSON（JavaScript Object Notation）编写 ARM 模板。Azure 还提供了一种名为 Bicep 的领域特定语言，它也使用声明性语法来部署\
  \ Azure 资源。你可以使用 Bicep 代替 JSON，因为它降低了复杂性并改善了整体开发/管理体验。\n\n7 Prebaked 是一个术语，用来指在机器映像上预安装软件，以便稍后用于启动更多实例或容器。\n\
  \n8 Packer 默认在 Azure Cloud Shell 上可用。\n\n9 https://azure.microsoft.com/en-in/services/devops\n"
- "## 第 3 章. 容器化你的应用程序：不仅仅是盒子\n\n## 早期发布读者的说明\n\n使用 Early Release 电子书，你可以在官方发布这些标题之前很久就利用这些技术——作者在写作时提供的原始未编辑内容。\n\
  \n这将是最终书籍的第 3 章。请注意，GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑\
  \ rfernando@oreilly.com。\n\n在过去几年中，容器变得越来越受欢迎。它们不仅提供低开销、高安全性和高可移植性，而且还遵循诸如不可变性、临时性和自动扩展等最佳实践云原则。\n\
  \n在本章中，我们将解释容器是什么并讨论流行的容器化平台。此外，我们将超越一般的行业炒作并解释为什么你可能想要使用容器。我们还将重点介绍它们的一些好处，特别是在云方面。\n\
  \n### 为什么使用容器？\n\n容器运行在主机操作系统之上，通常使用 Docker（我们将在本章后面讨论）或 Kubernetes（见图 3-1）等软件进行编排。容器最重要的好处之一是\n\
  \n它们提供了类似虚拟机的隔离，但无需为每个容器运行主机操作系统实例的开销。在规模上，这可以节省大量的系统资源。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_61_0.png)\n\
  \n图 3-1. 容器操作系统范式\n\n### 隔离\n\n容器通过管理员配置的灵活方式通过多种方法提供隔离。容器可以通过以下方式进行隔离：\n\n### 系统资源\n\
  \n隔离是通过 CPU、内存和磁盘 cgroups 实现的。\n\n### 命名空间\n\n隔离是通过为每个容器允许单独的命名空间来实现的。\n\n### POSIX\
  \ 限制\n\n使用此方法进行隔离允许你在容器上设置 rlimits。\n\n这些机制允许你安全地一起运行大量工作负载，而不必担心资源竞争或一个系统干扰另一个系统。如果你有一个了解工作负载的容器编排器，你可以有效地利用主机机器上的所有资源，而不会出现性能下降（称为\
  \ *bin packing*）。在规模上做好这一点，可以在提高基础设施效率时创造显著的成本节约。\n\n## 安全\n\n在容器隔离功能的基础上，OCI 容器运行时规范（本章后面会讨论）提供了一系列与运行时安全相关的功能，确保如果容器内的应用程序被攻破，横向移动到整个网络的风险会显著降低。其中一些功能包括：\n\
  \n- *Linux capabilities*\n\n这些减少了容器对内核 API 的访问。\n\n- *用户/组属性*\n\n这些设置容器的用户和组属性，然后可以限制对文件系统资源的访问。\n\
  \n- *设备*\n\n这些控制容器可以访问哪些设备。\n\n- *SELinux 标签*\n\n与其他 Linux 系统组件（文件、进程、管道）一样，SELinux\
  \ 标签可以应用于容器。\n\n- *Sysctl*\n\n这为容器添加（有限的）额外控制。\n\n这些运行时安全功能层提供了一种确定性、受管理的部署应用程序的方式，显著降低了对主机基础设施和邻近应用程序的风险。在容器生态系统中，还有一套构件安全范式，我们将在本章后面介绍。\n\
  \n请注意，如果你想通过编排机制（Puppet/Chef 等）应用系统策略，在每个应用程序的基础上实现它要困难得多，而不是直接使用容器提供的功能。\n\n###\
  \ 打包和部署\n\n正如我们将在本书后面讨论的，容器镜像的标准化和这些镜像的可移植性非常有用。相对直接地，你可以将在桌面上运行的容器部署到生产环境，而无需显著的操作开销或执行额外的配置和管理步骤。Docker\
  \ 的座右铭是“Build, ship, and run”，这突出了容器化为软件开发生命周期带来的桌面到生产的理念。\n\n此外，鉴于我们将在本章后面讨论的 OCI\
  \ 镜像规范，只要你的容器注册表可用，你就可以确信部署系统将成功运行而不会出现问题。\n\n### 基本容器原语\n\n你可能会惊讶地知道，容器并不是 Linux\
  \ 中的一等概念。事实上，直到 2017 年 OCI 规范的创建，才对容器有了正式定义（我们将在本章后面谈论规范）。一个基本的容器通常由以下原语组成：\n\n\
  - Cgroups\n- Namespaces\n\n\n\n\n\n+   - 写入时复制 (CoW)\n+   - Seccomp-BPF\n\nLinux\
  \ 容器是 FreeBSD jail、Solaris zone 和虚拟机等类似技术的自然演进。在许多方面，容器将这些技术的优点结合在了一起。\n\n由于容器不是一个原始概念，因此有许多容器软件平台可用。我们将在本章后面探索它们。现在，让我们逐一介绍每个基本容器原语。\n\
  \n### Cgroups\n\n控制组（cgroup）是 Linux 的一个原语，提供限制 cgroup 内一组程序可以访问/分配的资源的能力。这提供了防止“嘈杂邻居”问题的保护。以下是\
  \ cgroup 提供的控制列表：\n\n*CPU*\n\nCPU 子系统控制允许你为 cgroup 分配一定量的 CPU 时间（`cpuacct`）或一定数量的核心（`cpuset`），以确保一个进程不会耗尽物理机上的所有\
  \ CPU 资源。\n\n*Memory*\n\n内存子系统允许你报告并为 cgroup 中的内存使用量设置限制。这适用于用户内存和交换内存。\n\n*Blkio*\n\
  \nblkio（发音为 block-i-o）控制器子系统提供了一种机制，用于限制 cgroup 对块设备的输入/输出操作每秒（IOPS）或带宽（bps）。\n\n\
  ### PID\n\nPID（进程标识符）控制器设置可以在 cgroup 中运行的最大进程数。\n\n### Devices\n\n仅适用于 cgroups v1，此控制允许管理员为\
  \ cgroup 在主机机器上可以访问的设备设置允许/拒绝列表。\n\n### Network\n\n网络分类器（net_cls）cgroup 提供了一个接口，用于为网络数据包标记类标识符（classid）。\n\
  \n网络优先级（net_prio）cgroup 提供了一个接口，用于动态设置各种应用程序生成的网络流量的优先级。\n\n在很大程度上，网络控制功能在更新的 Linux\
  \ 内核版本中更适合由 eBPF 提供。\n\n### Namespaces\n\n命名空间是 Linux 中的一个功能，允许你限制非计算资源，以便一组进程看到一组资源，而另一组进程看到另一组资源。截至本文撰写时，Linux\
  \ 包含以下命名空间类型：\n\n#### Mount (mnt)\n\n控制容器可用的文件系统挂载。这意味着不同挂载命名空间中的进程会看到不同的目录层次结构视图。\n\
  \n#### PID (pid)\n\n为容器提供独立编号的 PID 集合。这意味着在拥有自己的 PID 命名空间的容器内的第一个进程将具有 PID 为 1。PID\
  \ 1 的任何后代都将像常规 Unix 系统一样运行。\n\n#### Network (net)\n\n一个非常有用的功能，允许你虚拟化网络基础设施。每个命名空间将拥有私有的一组\
  \ IP 地址以及自己的路由表、套接字列表、连接跟踪表、防火墙和其他网络相关资源。\n\n#### Interprocess communication (ipc)\n\
  \n将进程与 Linux 进程间通信（IPC）隔离。示例包括管道和信号。\n\n#### Unix Time Sharing (uts)\n\n允许单个系统对不同进程显示不同的主机名和域名。\n\
  \n#### User ID (user)\n\n类似于 PID 命名空间；允许你在容器内拥有提升的权限但不影响整体系统。用户命名空间在命名空间之间提供用户标识隔离。用户命名空间包含一个映射表，将用户\
  \ ID 从容器的视角转换为系统的视角。这允许，例如，root 用户在容器中具有用户 ID 0，但在系统进行所有权检查时被视为用户 ID 1,400,000。\n\
  \n#### Control group (cgroup)\n\n隐藏进程所属的控制组的身份（这与 cgroup 原语不同）。\n\n#### Time (time)\n\
  \n允许进程以类似于 UTS 命名空间的方式看到不同的系统时间。\n\n### Copy on Write\n\n写入时复制（CoW）是一种内存管理技术，仅在资源被修改（或写入）时才复制内存。这种技术减少了所需的内存量。\n\
  \n### Capabilities\n\nLinux 能力允许管理员更严格地控制进程或 cgroup 在主机系统上的能力。你可以在 capabilities(7)\
  \ 手册页中找到能力列表。例如，如果你想在端口 80 上运行 Web 服务器，你只需要给 cgroup/进程 CAP_NET_BIND_SERVICE 能力。如果\
  \ Web 服务器被攻破，攻击者的行为将被限制，因为该进程没有系统权限执行其他管理命令。\n\n### Seccomp-BPF\n\nSeccomp（SECure\
  \ COMputing）对于在系统间创建绝对限制非常有用。Seccomp-BPF 允许按应用程序进行细粒度控制。Seccomp-BPF 提供按线程粒度（在严格模式下）。它在\
  \ 3.5 版本（2012 年）被添加到内核中。\n\nSeccomp-BPF 允许 Berkeley Packet Filter（BPF）程序（在内核空间运行的程序）过滤系统调用（及其参数），并在\
  \ Seccomp-BPF 程序退出后返回应发生什么的值。\n\n### Components of Running a Container\n\n正如我们在本章前面讨论的那样，容器不是\
  \ Linux 中的一等概念（没有 Linux 容器原语），这使得它们有点难以定义——也就是说，过去很难使容器具有可移植性。尽管如此，要运行容器，需要在容器构造与操作系统软件（或主机软件）之间存在某种定义的接口。\n\
  \n在本节中，我们将讨论容器软件的细节，包括容器运行时（运行容器的软件）、容器平台和容器编排器。\n\n首先，让我们快速查看容器生态系统中的抽象层（图 3-2）。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_68_0.png)\n\n图 3-2. 容器抽象的层\n\n在本节中，我们将从上到下遍历这些抽象层，看看我们如何从整齐编排的容器工作到使容器运行成为可能的低级\
  \ Linux 概念。\n\n### Container Orchestrators\n\n在最顶层的抽象层是容器编排器，它们执行管理容器生态系统的自动扩展、实例替换和监控的魔术，这使得容器作为一个概念如此有吸引力。正如我们在第\
  \ 4 章和第 5 章中讨论的那样，Kubernetes 是 Cloud Native Computing Foundation（CNCF）的毕业调度与编排平台。\n\
  \n容器编排器通常提供以下功能：\n\n- 根据实例负载自动扩展集群实例\n- 实例的配置和部署\n- 基础监控功能\n- 服务发现\n\n其他 CNCF 容器编排器包括：\n\
  \n- Azure Kubernetes Service (AKS)\n- Azure Service Fabric\n- Amazon Elastic Container\
  \ Service (ECS)\n- Docker Swarm\n- Apache Mesos\n- HashiCorp Nomad\n\n好的容器编排器使构建和维护计算集群变得简单。截至本文撰写时，容器编排器没有标准配置。\n\
  \n### Container Software\n\n容器守护进程位于编排器之下，提供执行守护进程的软件。根据你使用的编排器，这可能对你来说是透明的。本质上，容器守护进程管理容器运行时的生命周期。在许多情况下，这可能简单到启动或停止容器，也可能复杂到与\
  \ Cilium 等插件交互（我们将在第 8 章讨论）。\n\n常见的容器软件平台包括：\n\n- Docker\n- Mesos agent (Mesos)\n\
  - Kubelet (Kubernetes)\n- LXD (LXC)\n- Rkt\n\n正如我们将在本章后面讨论的那样，Docker 允许你获取一个镜像然后创建它的容器实例，本质上为用户提供了一个非编排操作的用户界面。Mesos\
  \ 代理或 kubelet 有所不同，因为它们由 CLI 或 REST API 驱动。\n\n### Container Runtimes\n\n容器运行时提供运行容器实例的接口。行业范围内，有两个标准的接口类别：\n\
  \n- Container runtime (runtime-spec)\n- Image specification (image-spec)\n\n容器运行时指定容器的配置（例如，能力、挂载和网络配置）。镜像规范包含有关镜像的文件系统布局和内容的<|message|>。\n\
  \n虽然每个容器守护进程或编排器都有自己的配置规范，但容器运行时是一个在镜像上具有标准化标准化的领域。\n\n三个最突出的容器运行时是：\n\n- Containerd\n\
  - CRI-O\n- Docker (直到 Kubernetes v1.2)\n\n### Containerd\n\n\n\n\n\nContainerd 是一个符合\
  \ OCI 的容器运行时，被 Docker 使用。Containerd 在使容器运行的所有 Linux 系统调用与配置容器的标准 OCI 配置之间充当抽象层。Containerd\
  \ 具有事件子系统，允许其他系统（如 etcd）订阅系统更改并相应地采取行动。值得注意的是，containerd 同时支持 OCI 和 Docker 镜像格式。What\
  \ is containerd? 是一篇提供进一步信息的优秀博文。\n\n### CRI-O\n\nCRI-O 是 Kubernetes 容器运行时接口（CRI）的一种实现，使\
  \ OCI 兼容的运行时成为可能。它被认为是用 Docker 和 containerd 的轻量级替代方案。CRI-O 还支持运行 Kata Containers（由\
  \ VMware 创建的类似虚拟机的容器）并且可以扩展到任何其他符合 OCI 的运行时。这使其成为多种用例的有吸引力的运行时。\n\n### Docker\n\n\
  不要将其与完整的 Docker 平台混淆，Docker 实际上包含一个运行时引擎，其本质上就是 containerd。Kubernetes 直到 Kubernetes\
  \ v1.20 版本才支持 Docker 作为容器运行时。\n\n### Containers\n\n容器实例是根据容器规范定义的软件的部署和运行。容器运行由一系列设置和限制所包含的定义软件（通常由镜像提供）。\n\
  \n### Operating System\n\n操作系统是最底层的构造，我们的容器运行在其上。在大多数容器运行时中，内核在所有容器实例之间共享。\n\n###\
  \ Open Container Initiative (OCI) Specification\n\n如前所述，容器在开始时并不是一个定义良好的概念。Open\
  \ Container Initiative（OCI）成立于 2015 年，以规范上述的运行时和镜像规范。\n\n容器的运行时配置在 config.json 文件中指定，该文件由容器运行时用来配置容器的运行参数。使用符合\
  \ OCI 的容器允许在多个容器编排器（例如 Docker 和 rkt）上运行相同的容器镜像/配置而无需进行任何修改。\n\n### OCI Image Specification\n\
  \nOCI 镜像规范概述了容器各层的定义方式。镜像的一些属性包括：\n\n- Author\n- Architecture and operating system\n\
  - User/group to run the container as\n- Ports that are exposed outside the container\n\
  - Environment variables\n- Entry points and commands\n- Working directory\n- Image\
  \ labels\n\n以下是一个容器镜像的示例：\n\n```\n{\n  \"created\": \"2021-01-31T22:22:56.015925234Z\"\
  ,\n  \"author\": \"Michael Kehoe <michaelk@example.com>\",\n  \"architecture\":\
  \ \"x86_64\",\n  \"os\": \"linux\",\n  \"config\": {\n```\n\n```\n\"User\": \"alice\"\
  ,\n\"ExposedPorts\": {\n    \"5000/tcp\": {}\n},\n\"Env\": [\n\"PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\
  ,\n    ],\n\"Entrypoint\": [\n    \"/usr/bin/python\"\n],\n\"Cmd\": [\n    \"app.py\"\
  \n],\n\"Volumes\": {\n    \"/var/job-result-data\": {},\n    \"/var/log/my-app-logs\"\
  : {}\n},\n\"WorkingDir\": \"/app\",\n\"Labels\": {\n    \"com.example.project.git.url\"\
  :\n\"https://example.com/project.git\",\n    \"com.example.project.git.commit\"\
  :\n\"45a939b2999782a3f005621a8d0f29aa387e1d6b\"\n    }\n},\n\"rootfs\": {\n    \"\
  diff_ids\": [\n\"sha256:c6f988f4874bb0add23a778f753c65efe992244e148a1d2ec2a8b664fb66bbd1\"\
  ,\n\"sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef\"\n\
  \    ],\n    \"type\": \"layers\"\n},\n\"history\": [\n    {\n        \"created\"\
  : \"2021-01-31T22:22:54.690851953Z\",\n        \"created_by\": \"/bin/sh -c #(nop)\
  \ ADD file:a3bc1e842b69636f9df5256c49c5374fb4eef1e281fe3f282c65fb853ee171c5 in /\"\
  \n    },\n    {\n        \"created\": \"2021-01-31T22:22:55.613815829Z\",\n    \
  \    \"created_by\": \"/bin/sh -c #(nop) CMD [\\\"sh\\\\\\\"]\",\n```\n\n```\n\"\
  empty_layer\": true\n}\n]\n}\n```\n\n### OCI Runtime Specification\n\n在高层面上，运行时配置规范提供了对以下容器属性的控制：\n\
  \n- Default filesystems\n- Namespaces\n- User ID and group ID mappings\n- Devices\n\
  - Control group configuration\n- Sysctl\n- Seccomp\n- Rootfs mount\n- Masked and\
  \ read-only paths\n- Mount SELinux labels\n- Hook commands\n- Other specialized\
  \ attributes (e.g., personality, unified, and Intel RDT)\n\nOCI 规范还涵盖了容器状态的定义方式以及容器的生命周期。\n\
  \n容器的状态可以通过状态函数（在 containerd 中，以及 runc）查询并返回以下属性：\n\n```\n{\n    \"ociVersion\"\
  : \"0.2.0\",\n```\n\n```\n\"id\": \"oci-container1\",\n\"status\": \"running\",\n\
  \"pid\": 4422,\n\"bundle\": \"/containers/redis\",\n\"annotations\": {\n    \"myKey\"\
  : \"myValue\"\n}\n}\n```\n\nOCI 容器的生命周期将所有运行时规范整合在一起，包括运行时规范如何与镜像规范交互。它定义了容器如何启动和配置，以及它如何与镜像的启动/停止钩子交互。\n\
  \n### Docker\n\nDocker 提供了一种平台即服务（PaaS），使用户能够以简化和标准化的方式在桌面上运行容器化应用程序。Docker 运行符合\
  \ OCI 的镜像，并且通常是部署代码到生产环境之前测试代码部署的一种手段。此外，Docker 桌面软件的广泛可用性为开发人员提供了一种轻松的机制来测试其代码的打包和部署，这使其成为开发人员有吸引力的系统。\n\
  \n### Building Your First Docker Image\n\nDocker 镜像本身是非 OCI 合规镜像（其结构与 OCI 规范不同），可在\
  \ Docker 上以及支持 Docker 运行时（containerd）的系统上运行。Docker 镜像的美妙之处在于其创建的快速和简单。每个容器镜像都由 Dockerfile\
  \ 定义。该文件由用于构建镜像、运行应用程序、将其暴露给网络并执行健康检查的属性和命令组成。它定义了哪些依赖项和文件被复制到容器镜像中，以及启动容器内应用程序要执行哪些命令。使用简单的（命令式）类似\
  \ shell 脚本的格式（逐条运行命令）构建 Docker 镜像的方法被那些处理痛苦的包管理或在 RPM 或 DEB（或 tarball）中捆绑应用程序的开发人员所青睐。\n\
  \nDocker 提供了完整的配置参考，可帮助您构建自己的容器。\n\n### BUILDING YOUR OWN CONTAINER\n\n理解容器如何工作的一个好方法是构建自己的基本容器。我们建议尝试\
  \ rubber-docker 工作坊。它逐步介绍了容器的基本组件并展示了它们是如何实现的。\n\n虽然 Dockerfile 允许复杂的设置，但创建镜像只需几行代码就异常简单。在以下示例中，我们将运行一个\
  \ Python Flask Web 应用程序并暴露端口 5000。\n\n- 创建一个 requirements.txt 文件：\n\n```\nFlask\
  \ >2.0.0\n```\n\n- 创建一个 app.py 文件：\n\n```\nfrom Flask import flask\n\napp = Flask(__name__)\n\
  \n@app.route('/')\ndef index():\n    return \"Hello, World\"\n```\n\n- 创建你的 Dockerfile，名为\
  \ Dockerfile：\n\n```\n1. FROM ubuntu:18.04\n2. COPY . /app\n```\n\n```\n3. WORKDIR\
  \ /app\n4. RUN pip3 install -r requirements.txt\n5. ENTRYPOINT [\"python3\"]\n6.\
  \ CMD [\"app.py\"]\n7. EXPOSE 5000\n```\n\n- 在第 1 行，我们采用一个基础镜像。在本例中，我们将使用 Docker\
  \ Hub 仓库中的 Ubuntu 18.04。\n- 在第 2 行，我们将当前目录复制到名为 *app* 的新镜像目录中。\n- 在第 3 行，我们将当前工作目录设置为\
  \ */app*。\n- 在第 4 行，我们使用 `pip` 安装应用程序定义的依赖项。\n- 在第 5 行，我们将入口点应用程序设置为 `python3`（这是\
  \ Docker/Python 的最佳实践）。\n- 在第 6 行，我们通过运行 *app.py* 启动应用程序。\n- 在第 7 行，我们将端口 5000 服务暴露到容器外部。\n\
  \n总体而言，此容器镜像复制我们的应用程序，然后安装应用程序的依赖项，启动自身，并允许在端口 5000（默认 Flask 端口）上进行网络连接。\n\n为了允许用户或其他应用程序访问你的容器，Dockerfile\
  \ 包含一个 `EXPOSE` 指令，允许容器网络栈在运行时监听指定端口。我们将在第 8 章讨论网络连接。\n\n\n\n\n\n#### NOTE\n\nDockerfile\
  \ 在技术上是容器运行时和镜像规范的混合体，因为它既提供了关于镜像内容的语义，也提供了其运行方式（即 CPU 或内存 cgroup 限制）。\n\n一旦你创建了\
  \ Dockerfile，你就可以使用 docker build 命令构建容器镜像。这通常使用当前文件路径（例如 docker build）完成，但你也可以使用\
  \ URL（例如 docker build https://github.com/abcd/docker-example）。你可以在文档中找到关于如何使用 docker\
  \ build 的完整参考。\n\n你应该为镜像创建一个标签，以便在将来构建镜像时能够快速轻松地引用它。你可以通过在构建时添加 --tag 选项来实现：\n\n\
  ```\ndocker build --tag example-flask-container\n```\n\n当你运行 docker build 时，你会看到类似以下的输出：\n\
  \n```\n[internal] load build definition from Dockerfile\n=> transferring dockerfile:\
  \ 203B\n[internal] load .dockerignore\n=> transferring context: 2B\n[internal] load\
  \ metadata for docker.io/library/ubuntu:18.04\n[1/6] FROM docker.io/library/ubuntu:18.04\n\
  [internal] load build context\n=> transferring context: 953B\nCACHED [2/6] WORKDIR\
  \ /app\n[3/6] COPY requirements.txt requirements.txt\n[4/6] RUN pip3 install -r\
  \ requirements.txt\n[5/6] COPY . .\n[6/6] CMD [ \"python3\", \"app.py\"]\nexporting\
  \ to image\n=> exporting layers\n=> writing image\nsha256:8cae92a8fbd6d091ce687b71b31252056944b09760438905b726625831\n\
  ```\n```\n564c4c\n=> naming to docker.io/library/example-flask-container\n```\n\n\
  ### Best Practices While Using Docker\n\n十二要素应用追踪了 Docker 化和云原生应用的许多特征。这意味着应用程序应该能够在不造成问题的情况下进行部署、启动、停止和销毁。虽然我们将在本书后面讨论容器存储解决方案，但你应该尽可能避免持久化数据，除非你是从持久卷读取数据或使用云原生数据服务（有关更多信息，请参阅第\
  \ 9 章）。\n\n你还应遵循以下最佳实践：\n\n- 利用 docker build 选项。这些选项允许你自定义 Docker 镜像以添加诸如 cgroup\
  \ 控制、标签、网络配置等功能。\n- 利用 .dockerignore 文件。与 .gitignore 类似，.dockerignore 将确保某些文件或文件夹不会包含在镜像构建中。\n\
  - 为减少复杂性、依赖项、文件大小和构建时间，避免安装额外的或不必要的软件包。\n- 使用多阶段构建。如果你需要安装依赖项来编译应用程序，你可以在镜像的构建过程中执行此操作，但只将输出复制到容器镜像中。这可以减少镜像构建的大小。\n\
  \n你可以在 Docker 网站上找到有关 Dockerfile 最佳实践的更多信息。\n\n### Other Container Platforms\n\n\
  虽然 Docker 平台和 OCI 镜像仍然是行业领导者，但仍然有许多其他容器解决方案可用。\n\n#### Kata Containers\n\nKata Containers\
  \ 是符合 OCI 的容器，旨在增强安全性。Kata Containers 具有以下轻量级容器功能：\n\n- Cgroups\n- Namespaces\n\
  - Capability filters\n- Seccomp filtering\n- Mandatory access control\n\nKata Containers\
  \ 也具有一些虚拟机概念，特别是每个容器一个独立的访客内核和更好的硬件隔离。`kata-runtime` 进程控制 OCI 合规容器的实例化。最大的区别是每个容器都有一个独立的访客内核，而不是容器实例之间共享内核。\n\
  \n#### LXC and LXD\n\nLXC（Linux Containers）是最早发布的容器机制之一。LXC 主要使用内核的 cgroup 和 namespace\
  \ 能力以及一套标准的库 API 来控制容器。\n\nLXD 是容器管理软件和工具，有助于编排 LXC API。LXD 守护进程通过 Unix 套接字/网络提供\
  \ REST API，允许你使用提供的命令行工具或构建自己的工具。\n\n由于缺乏开发和部署工具，LXC 和 LXD 的生态系统更偏向于运行基础设施而不是应用程序开发。\n\
  \n### Container Registries\n\n构建容器镜像后，你需要地方来存储和提供它们。这些被称为 *container registries*。由于其易于部署的机制以及内置的复制机制，容器注册表变得越来越受欢迎，这些机制取代了\
  \ DEB 和 RPM 软件包仓库所需的具有挑战性的 rsync 设置。\n\n部署容器时，容器部署系统会将镜像从注册表下载到主机机器。基本上，容器注册表充当高度可用的容器镜像文件服务器（带一些保护）。所有常见的容器化平台都允许你配置公共或私有仓库作为容器镜像的来源。\n\
  \n虽然这些职责听起来相当平常，但容器注册表的许多被忽视的功能是安全容器部署的重要组成部分。此类功能包括：\n\n- *Image replication*\n\
  \  将镜像复制到其他容器注册表（全球）\n- *Authentication*\n  仅允许授权用户访问注册表及其内容\n- *Role-based access\
  \ control*\n  限制谁可以修改注册表中的镜像和数据\n- *Vulnerability scanning*\n  检查镜像是否存在已知漏洞\n- *Garbage\
  \ collection*\n  定期删除旧镜像\n- *Auditing*\n  为信息安全目的提供有关容器注册表更改的可信信息\n\n当前云原生产品包括（请参阅\
  \ CNCF 景观了解更多）：\n\n- Harbor\n- Dragonfly\n- Alibaba Container Registry\n- Amazon\
  \ Elastic Container Registry (Amazon ECR)\n- Azure Registry\n- Docker Registry\n\
  - Google Container Registry\n- IBM Cloud Container Registry\n- JFrog Artifactory\n\
  - Kraken\n- Portus\n- Quay\n\n其中许多系统与特定厂商绑定。然而，Harbor 是最受欢迎的开源容器注册表系统之一，因此我们将进一步探索它。\n\
  \n### Securely Storing Images with Harbor\n\nHarbor 是首屈一指的开源云原生容器注册表平台。创建于 2016\
  \ 年，Harbor 存储容器镜像并提供签名和安全扫描功能。此外，Harbor 还支持高可用性和复制功能以及一系列安全功能，包括用户管理、基于角色的访问控制和活动审计。\n\
  \nHarbor 的美妙之处在于它即使是开源的也提供顶级功能，这使其成为一个很棒的平台。\n\n### Installing Harbor\n\n当你使用 Harbor\
  \ 时，它本质上成为构建和部署管道的关键组件。你应该在满足以下推荐规格的主机上运行它：\n\n- 四核 CPU\n- 8 GB 内存\n- 最小 160 GB\
  \ 磁盘\n- Ubuntu 18.04/CentOS7 或更高版本\n\n> NOTE\n> 你需要评估磁盘 SKU 或配置的性能以匹配你期望的性能。Harbor\
  \ 本质上是一个文件服务器，磁盘的性能将显著影响你的构建和部署时间。\n\nHarbor 支持多种安装方法，包括 Kubernetes 和 Helm。由于我们尚未探索\
  \ Kubernetes，因此我们将手动安装 Harbor。\n\nHarbor 有两种发行版（或安装类型）：在线安装程序和离线安装程序。在线安装程序体积较小，依赖于互联网连接从\
  \ Docker Hub（直接从互联网）下载完整镜像。离线安装程序体积较大，不需要互联网连接。如果你的安全态势是限制性的，离线安装程序可能是一个更好的选择。\n\
  \nHarbor 的发行版列在 GitHub 上。\n\n\n\n\n\n### 验证安装程序\n\n建议您验证下载包的完整性。您需要打开到端口 TCP/11371\
  \ 的出站互联网访问权限以访问 GPG 密钥服务器。要验证安装程序：\n\n- 1. 下载对应您安装程序版本的 *.asc 文件。\n- 2. 获取 Harbor\
  \ 发行版的公钥：gpg --keyserver. hkps://keyserver.ubuntu.com --receive-keys 644FF454C0B4115C。\n\
  - 3. 通过运行 gpg -v -keyserver hkps://keyserver.ubuntu.com -verify <asc-filename> 来验证包。\n\
  \n您应该在前一个命令的输出中看到 gpg: Good signature from \"Harbor-sign (The key for signing Harbor\
  \ build)。\n\n### 为安装配置 Harbor\n\n在配置 Harbor 之前，您应该通过您自己的证书颁发机构 (CA) 或通过公共 CA 如 Let’s\
  \ Encrypt 安装 Secure Sockets Layer (SSL) 证书以启用 HTTPS。有关如何执行此操作的更多信息可以在 Harbor 文档中找到。\n\
  \nHarbor 的所有安装参数都定义在一个名为 harbor.yml 的文件中。此文件中定义的参数在首次使用 Harbor 或通过 install.sh 文件重新配置时进行配置。有关所有配置选项的详细信息可以在\
  \ GitHub 上找到。为了开始，我们将使用以下必需参数：\n\n```\nhostname: container-registry.example.com\n\
  \nhttp:\n```\n\n```\n### port for http, default is 80. If https enabled, this port\n\
  will redirect to https port\n  port: 80\n\nhttps:\n  port: 443\n  certificate: /your/certificate/path\n\
  \  private_key: /your/private/key/path\n\nharbor_admin_password: Harbor12345\n\n\
  ### DB configuration\ndatabase:\n  password: root123\n  max_idle_conns: 50\n  max_open_conns:\
  \ 100\n\n### The default data volume\ndata_volume: /data\n\nclair:\n  updaters_interval:\
  \ 12\n\njobservice:\n  max_job_workers: 10\n\nnotification:\n  webhook_job_max_retry:\
  \ 10\n\nchart:\n  absolute_url: disabled\n\nlog:\n  level: info\n  local:\n    rotate_count:\
  \ 50\n    rotate_size: 200M\n    location: /var/log/harbor\n\nproxy:\n  http_proxy:\n\
  \  https_proxy:\n  no_proxy:\n127.0.0.1,localhost,.local,.internal,log,db,redis,nginx,core,portal,postgresql,jobservice,registry,registryctl,clair\n\
  ```\n\n### 构建 Packer 镜像\n\n利用我们来自第 2 章的知识，我们将构建一个 Packer 镜像来部署 Harbor。您可以使用以下 *harbor.json*\
  \ 文件：\n\n```\n{\n  \"builders\": [{\n    \"type\": \"azure-arm\",\n    \"client_id\"\
  : \"<place-your-client_id-here>\",\n    \"client_secret\": \"<place-your-client_secret-here>\"\
  ,\n    \"tenant_id\": \"<place-your-tenant-id-here>\",\n    \"subscription_id\"\
  : \"<place-your-subscription-here>\",\n    \"managed_image_resource_group_name\"\
  : \"CloudNativeAzure-group\",\n    \"managed_image_name\": \"harborImage\",\n  \
  \  \"os_type\": \"Linux\",\n    \"image_publisher\": \"Canonical\",\n    \"image_offer\"\
  : \"UbuntuServer\",\n    \"image_sku\": \"16.04-LTS\",\n    \"azure_tags\": {\n\
  \      \"env\": \"Production\",\n      \"task\": \"Image deployment\"\n    },\n\
  \    \"location\": \"East US\",\n    \"vm_size\": \"Standard_DS1_v2\"\n  }],\n \
  \ \"provisioners\": [{\n    \"execute_command\": \"chmod +x {{ .Path }}; {{ .Vars\
  \ }} sudo -E sh '{{ .Path }}'\",\n    \"inline\": [\n      \"apt-get update\",\n\
  \      \"apt-get upgrade -y\",\n      \"/usr/sbin/waagent -force -deprovision+user\
  \ && export HISTSIZE=0 && sync\"\n    ],\n    \"inline_shebang\": \"/bin/sh -x\"\
  ,\n    \"type\": \"shell\"\n  },\n  {\n  {\n    \"type\": \"shell\",\n    \"inline\"\
  : [\n      \"wget\n```\n\n```\nhttps://github.com/goharbor/harbor/releases/download/v2.1.3/harbor-online-installer-v2.1.3.tgz\
  \ -O /tmp/harbor-online-installer-v2.1.3.tgz\",\n    \"tar -xvf /tmp/harbor-online-installer-v2.1.3.tgz\"\
  \n  ]\n},\n{\n    \"type\": \"file\",\n    \"source\": \"{{template_dir}}/harbor.yml\"\
  ,\n    \"destination\": \"/tmp/harbor\"\n  },\n  {\n    \"type\": \"shell\",\n \
  \   \"inline\": [\n      \"sudo chmod 0777 /tmp/harbor/install.sh\",\n      \"sudo\
  \  /tmp/harbor/install.sh\"\n    ]\n  }\n]\n}\n```\n\n当您运行 `packer build harbor.json`\
  \ 时，您的镜像将带 Harbor 安装并配置构建。如果您使用 HTTPS（您应该使用），您将需要修改 Packer 文件以包含复制证书和私钥文件。\n\n###\
  \ 使用 Azure 容器注册表安全存储镜像\n\nAzure 提供了自己的容器注册表，称为 Azure Container Registry。由于注册表由 Azure\
  \ 提供，初始设置和持续维护要求比运行 Harbor 等软件时要少得多。\n\n### 安装 Azure 容器注册表\n\n部署容器实例异常简单。\n\n- -\
  \ 登录到 Azure 门户并点击“创建资源”，如图 3-3 所示。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_88_0.png)\n\
  \n图 3-3. Azure 门户主页\n\n- - 在搜索栏中搜索“container registry”，并点击来自 Microsoft 的 Container\
  \ Registry 提供（见图 3-4）。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_88_1.png)\n\n\
  图 3-4. 搜索 Azure 容器注册表\n\n您将看到一个表单，用于填写有关您将创建的注册表的基本信息（图 3-5）。\n\n### 创建容器注册表\n\n\
  Home > All resources > New > Marketplace > Container Registry >\n\nBasics Networking\
  \ Encryption Tags Review + create\n\nAzure Container Registry 允许您构建、存储和管理容器镜像和工件在私有注册表中，用于所有类型的容器部署。使用\
  \ Azure 容器注册表与您现有的容器开发和部署管道一起使用。使用 Azure Container Registry Tasks 在 Azure 上按需构建容器镜像，或自动化由源代码更新、容器基础镜像更新或计时器触发的构建。了解更多\n\
  \n### 项目详细信息\n\nSubscription *\n\nVisual Studio Enterprise\n\nResource group *\n\
  \n(New) rg-container-registry\n\nCreate new\n\n### 实例详细信息\n\nRegistry name *\n\n\
  cloudnativeinfra.azurecr.io\n\nLocation *\n\nEast US 2\n\nAvailability zones\n\n\
  Enabled\n\nAvailability zones are enabled on premium registries and in regions that\
  \ support availability zones. Learn more\n\nSKU *\n\nStandard\n\nReview + create\
  \ < Previous Next: Networking >\n\n图 3-5. 创建容器注册表的第一页\n\n- - 提供容器注册表以下基本详细信息：\n\n\
  #### Subscription\n\n选择您想要部署到的订阅。\n\n#### Resource group\n\n您可以使用现有资源组或创建新的。在这种情况下，我们将创建一个名为\
  \ rg-container-registry 的新资源组。\n\n### Registry name\n\n这将配置用于访问注册表的 URL。我们将使用 *cloudnativeinfra.azurecr.io*。这是全局唯一的，因此您需要选择自己的并确保不会收到错误消息提示它已被占用。\n\
  \n#### Region\n\n选择您的区域。我们将在 East US 2 区域部署。\n\n### SKU\n\n有三个层级。您可以在 Container\
  \ Registry 定价页面找到比较。我们将使用 Standard 层级。\n\n- - 选择您的 Networking 配置（图 3-6）。由于我们使用 Standard\
  \ 层级，我们无法在此处进行任何配置更改。因此，将创建的容器注册表可通过互联网访问，而不仅仅是在我们的 Azure 网络内。\n\n### 创建容器注册表\n\n\
  Home > All resources > New >\n\nBasics   Networking   Encryption   Tags   Review\
  \ + create\n\n### Network connectivity\n\n您可以公开通过公共 IP 地址连接到此注册表，或使用私有端点私有连接。了解更多\n\
  \nConnectivity method\nPublic endpoint (all networks)\nPrivate endpoint\n\nPrivate\
  \ endpoint connection is only available for Premium SKU.\n\nReview + create   <\
  \ Previous   Next: Encryption >\n\n图 3-6. 容器注册表网络配置\n\n- - 选择您的 Encryption 配置（图\
  \ 3-7）。Standard 层级为存储数据提供静态加密，而 Premium 层级允许用户设置自己的加密密钥。\n\n### 创建容器注册表\n\nHome\
  \ > All resources > New >\n\nBasics Networking Encryption Tags Review + create\n\
  \nAzure Container Registry 服务加密保护您的数据在静态时。Azure Container Registry 在推送到注册表时加密您的镜像和其他工件，并在拉取时自动解密。了解更多\n\
  \nCustomer-Managed Key Enabled Disabled\n\nCustomer-Managed Key is only available\
  \ for Premium SKU.\n\n图 3-7. 容器网络注册表加密\n\n- - 点击“Review + create”以创建您的容器注册表。这应该在不到两分钟内部署完成。\n\
  \n### 私有端点\n\n私有端点是 Azure 的一个概念，允许云资源通过 RFC1918 地址空间而不是公共 IP 可用。这意味着您的资源仅通过本地连接的网络可用，而不通过互联网。\n\
  \n如果您想通过 Terraform 部署您的容器注册表，以下代码将允许您这样做：\n\n```\nresource \"azurerm_resource_group\"\
  \ \"rg\" {\n  name = \"example-resources\" location = \"West Europe\"\n}\n```\n\n\
  ```\nresource \"azurerm_container_registry\" \"acr\" {\n  name = \"containerRegistry1\"\
  \n  resource_group_name = azurerm_resource_group.rg.name\n```\n\n\n\n\n\n```\nlocation\
  \ = azurerm_resource_group.rg.location\nsku = \"Premium\"\n\nidentity {\n    type\
  \ = \"UserAssigned\"\n    identity_ids = [\nazurerm_user_assigned_identity.example.id\
  \ ]\n}\n\nencryption {\n    enabled = true\n    key_vault_key_id = data.azurerm_key_vault_key.example.id\n\
  \    identity_client_id =\nazurerm_user_assigned_identity.example.client_id\n}\n\
  }\n\nresource \"azurerm_user_assigned_identity\" \"example\" {\n    resource_group_name\
  \ = azurerm_resource_group.example.name\n    location = azurerm_resource_group.example.location\n\
  \    name = \"registry-uai\"\n}\n\ndata \"azurerm_key_vault_key\" \"example\" {\n\
  \    name = \"super-secret\"\n    key_vault_id = data.azurerm_key_vault.existing.id\n\
  }\n```\n\n### 在注册表中存储 Docker 镜像\n\n正如我们之前讨论过的，你需要能够可靠地存储和提供容器镜像。一旦你构建了自定义镜像，就需要将其推送到注册表。此外，正如我们之前讨论过的，存储镜像的选项有很多，包括\
  \ Docker Registry 以及各个云提供商的容器注册表，例如 Azure Container Registry。在本例中，我们将使用本章前面创建的 Harbor\
  \ 注册表。\n\n首先我们将登录到注册表：\n\n```\n$ docker login <harbor_address>\n```\n\n例如：\n\n```\n\
  $ docker login https://myharborinstallation.com\n```\n\n现在我们将为镜像打标签：\n\n```\ndocker\
  \ tag example-flask-container <harbor_address>/demo/example-flask-container\n```\n\
  \n然后我们将其推送：\n\n```\ndocker push <harbor_address>/demo/example-flask-container\n\
  ```\n\n完成后，Harbor 将能够将我们的镜像提供给任何正在下载它的容器软件。\n\n### 在 Azure 上运行 Docker\n\n在 Azure\
  \ 中，运行 Docker 容器镜像有两种方式：使用 Azure Container Instances 或运行安装了 Docker 的自己的虚拟机。在本节中，我们将演示这两种方法。\n\
  \n#### Azure Container Instances\n\nAzure Container Instances (ACI) 允许你在无需管理底层基础设施的情况下快速在\
  \ Azure 中启动容器实例。这提供了一种类似 Docker 的服务，但位于公有云中。ACI 允许部署来自 Azure Container Registry\
  \ 的镜像，或来自私有或公共存储库的 Docker 镜像。\n\nACI 还允许这些实例根据容器镜像的使用情况放置在私有或公共网络中。\n\nACI 的一些附加功能包括：\n\
  \n- 无需配置 OCI 运行时规范\n- 能够将环境变量传递给容器\n- 基础防火墙管理\n- 受管理的容器重启策略\n\n简单来说，ACI 是在 Azure\
  \ 中开始运行容器的最简单方法！ACI 还使你能够在不创建完全独立的环境的情况下测试新的容器镜像。\n\n在运行 Azure ACI 时需要注意一些重要注意事项：\n\
  \n- 任何单个容器实例的限制为四核/16 GB。\n- ACI 的 CPU 和内存设置将覆盖你对容器镜像应用的任何运行时设置。\n\n#### 部署 Azure\
  \ Container Instance\n\n部署 Azure 容器实例非常简单。首先，登录到 Azure 门户，然后点击“创建资源”，如图 3-8 所示。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_95_0.png)\n\n图 3-8. Azure 门户主页\n\n点击左侧的\
  \ Containers，你会看到容器相关产品的列表，见图 3-9。点击 Container Instances 链接。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_96_0.png)\n\
  \n图 3-9. 搜索容器产品\n\n你将看到一个用于填写容器实例基本信息的表单，如图 3-10 所示。\n\n#### Create container instance\n\

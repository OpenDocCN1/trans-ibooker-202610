  \ 和控制节点的引导。Ansible playbook 包含逐步的指令，自解释性强，用于为集群引导控制节点。我们强烈建议你按照 playbook 中的 plays\
  \ 执行路径，以了解其中的细枝末节。\n\n### 使用 Ansible 部署和配置 Kubernetes 工作节点\n\n控制节点部署完成后，我们可以使用 *workers.yaml*\

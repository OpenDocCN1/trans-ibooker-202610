  skipped=4    rescued=0    ignored=0\ninventory_hostname=controller1 : ok=22    changed=19\
  \    unreachable=0    failed=0\nskipped=7    rescued=0    ignored=0\ninventory_hostname=controller2\
  \ : ok=22    changed=19    unreachable=0    failed=0\nskipped=7    rescued=0   \
  \ ignored=0\n```\n\n至此，控制节点[content]\n\n```\n$ ansible-playbook -vi hosts controllers.yaml\n\
  ```\n\n这条命令执行需要一些时间；完成后，你应该会看到以下输出：\n\n```\nPLAY RECAP\n********************************************************************************\n\
  ********************************************************************************\n\
  ********************************************************************************\n\

  \  controller-uid=f6887706-85ef-4752-8911-79cc7ab33886\nLabels:       controller-uid=f6887706-85ef-4752-8911-79cc7ab33886\n\
  \              job-name=examplejob\nAnnotations:  kubectl.kubernetes.io/last-applied-configuration:\n\
  {\"apiVersion\":\"batch/v1\",\"kind\":\"Job\",\"metadata\":{\"annotations\":{},\"\
  name\":\"examplejob\",\"namespace\":\"default\"},\"spec\":{\"template\":\n{\"metadat...\n\
  Parallelism:  1\n```\n\n```\nCompletions:      1\nStart Time:       Mon, 07 Sep\
  \ 2020 01:08:53 +0530\nCompleted At:     Mon, 07 Sep 2020 01:08:56 +0530\nDuration:\
  \         3s\nPods Statuses:    0 Running / 1 Succeeded / 0 Failed\nPod Template:\n\
  \  Labels:   controller-uid=f6887706-85ef-4752-8911-79cc7ab33886\n            job-name=examplejob\n\
  \  Containers:\n    examplejob:\n      Image:        busybox\n      Port:      \
  \   <none>\n      Host Port:    <none>\n      Command:\n        echo\n        Cloud\
  \ Native with Azure\n      Environment:  <none>\n      Mounts:       <none>\n  \
  \    Volumes:      <none>\nEvents:\n  Type    Reason           Age   From      \
  \      Message\n  ----    ------           ----  ----            -------\n  Normal\
  \  SuccessfulCreate  61s   job-controller  Created pod: examplejob-mcqzc\n  Normal\
  \  Completed         58s   job-controller  Job completed\n```\n\n### Summary\n\n\
  Kubernetes 是一个强大的平台，它建立在 Google 在大规模容器化应用中获得的十年的经验之上。Kubernetes 基本上促成了 Cloud Native\
  \ Computing Foundation 的诞生，并且是其下毕业的第一个项目。这导致了微服务生态系统在支持和更高采用云原生环境方面的整体简化。在本章中，我们查看了使\
  \ Kubernetes 能够大规模运行的各种组件和概念。本章还为即将到来的章节奠定了基础，在这些章节中我们将利用 Kubernetes 平台来服务生产级的云原生应用。\n\
  \n鉴于管理 Kubernetes 集群的底层复杂性，在第 5 章中我们将研究如何创建和使用此类集群。我们还将研究 Azure Kubernetes Service，以及更多内容。\n\
  \n1 *Managing Kubernetes* 由 Brendan Burns 和 Craig Tracey 编写（O’Reilly, 2019）；*Kubernetes\
  \ in Action* 由 Marko Luksa 编写（Manning, 2018）。\n\n2 Pod 是你可以在 Kubernetes 中创建和管理的最小可部署计算单元。\n\
  \n3 在 Kubernetes 中，服务是一种使你的 Pod 能够在 Kubernetes 集群内部被发现的方式。\n\n4 允许分数请求。例如，一个 CPU\
  \ 可以拆分为两个 0.5。表达式 0.1 等价于 100m。\n\n5 Limit 和 request 以字节为单位测量。内存可以用纯整数或使用后缀 E、P、T、G、M、K，或其\
  \ 2 的幂等价物 Ei、Pi、Ti、Gi、Mi、Ki 的定点数表示。\n\n6 你可以从 https://github.com/kubernetes-sigs/metrics-server\
  \ 安装 metric-server。\n\n7 对于 `Ingress` 资源正常工作，集群必须运行 ingress controller。与作为 `kube-controller-manager`\
  \ 二进制文件一部分运行的其他类型的控制器不同，ingress controller 并不会随集群自动启动。有不同类型的 ingress controller；例如，Azure\
  \ 提供了 AKS Application Gateway Ingress Controller 用于配置 Azure Application Gateway。\n"

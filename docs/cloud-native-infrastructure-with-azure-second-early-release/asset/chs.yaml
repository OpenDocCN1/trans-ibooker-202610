  ,\n```\n\n```\n\"/subscriptions/b5624140-9087-4311-a04b-3b16a2e84792/resourceGroups/K8Scluster/providers/Microsoft.Compute/virtualMachines/worker1\"\
  ,\n\"/subscriptions/b5624140-9087-4311-a04b-3b16a2e84792/resourceGroups/K8Scluster/providers/Microsoft.Compute/virtualMachines/worker2\"\
  ,\n],\n]\nworker_machine_name = [\n[\n\"worker0\",\n\"worker1\",\n\"worker2\",\n\
  ],\n]\nworker_machine_private_ips = [\n[\n\"10.240.0.20\",\n\"10.240.0.21\",\n\"\
  10.240.0.22\",\n],\n]\n```\n\nOnce the terraform apply is complete, you will see\
  \ that the nodes have been provisioned for your Kubernetes cluster (see Figure 5-1).\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_158_0.png)\n\nFigure 5-1. Worker and\
  \ controller nodes up and running\n\n### Using Ansible to Deploy and Configure the\
  \ Kubernetes Controller Nodes\n\nWith the infrastructure running, it’s time to configure\
  \ the cluster, since currently we just have the bare skeleton prepared. To deploy\
  \ and configure Kubernetes to work on the node, we will use Ansible playbooks.\n\
  \nFirst, update the host file in Chapter5/Ansible-Playbooks/hosts with the IP addresses\
  \ of the worker and controller instances, along with the SSH username and the path\
  \ of the SSH private key that was generated with ssh-keygen:\n\n```\n[controllers]\n\
  inventory_hostname=controller0 ansible_host=52.252.6.89\ninventory_hostname=controller1\
  \ ansible_host=52.254.50.7\ninventory_hostname=controller2 ansible_host=52.251.58.212\n\
  \n[workers]\ninventory_hostname=worker0 ansible_host=52.251.59.169\ninventory_hostname=worker1\
  \ ansible_host=52.251.59.78\ninventory_hostname=worker2 ansible_host=52.254.50.15\n\
  \n[all:vars]\nansible_user = ubuntu\nansible_ssh_private_key_file = /Users/SSH_KEYS/id_rsa\n\
  ```\n\nOnce the hosts file is updated, we need to update the groupvars (located\
  \ in the all file in the Chapter5/Ansible-Playbooks/group_vars directory) with the\
  \ loadbalancer_public_ip and the encryption key. Since Kubernetes stores a variety\
  \ of data, including cluster state, application configurations, and secrets, we\
  \ need to encrypt this data at rest. Kubernetes supports the ability to encrypt\
  \ cluster data at rest.\n\nTo create an encryption key, you can simply issue the\
  \ following command on your terminal and paste the generated secret in the group_vars/all\
  \ file as follows:\n\n```\n$ head -c 32 /dev/urandom | base64\nUvivn+4ONy9yqRf0ynRV0psEE7WsfyvYnM7VNakiNeA=\n\
  ```\n\nYou will also need to update the load balancer IP. The final group_vars should\
  \ look like this:\n\n```\n---\n#Change loadbalancer_public_ip\nloadbalancer_public_ip\
  \ : 52.254.73.23\ncontroller_private_ips_list : 10.240.0.10,10.240.0.11,10.240.0.12\n\
  ### Keep k8s_internal_virtual_ip as it is\nk8s_internal_virtual_ip: 10.32.0.1\n\
  k8s_cluster_cidr: \"10.200.0.0/16\"\nk8s_cluster_name: \"cloud-native-azure\"\n\
  ### Generate your own encryption_key : \"head -c 32 /dev/urandom | base64\"\nencryption_key:\
  \ Uvivn+4ONy9yqRf0ynRV0psEE7WsfyvYnM7VNakiNeA=\n#ETC config below for systemd file,\
  \ place private ip's. No need to change\ncontroller_0_ip: 10.240.0.10\ncontroller_1_ip:\
  \ 10.240.0.11\ncontroller_2_ip: 10.240.0.12\n```\n\nOnce we are done updating the\
  \ files, we need to install the client-side tools on the local system; mainly kubectl,\
  \ cfssl, and cfssljson. CFSSL is Cloudflare’s public key infrastructure/Transport\
  \ Layer Security (PKI/TLS) toolkit for signing, verifying, and bundling the TLS\
  \ certificates in general. We will be using this toolkit to generate the TLS certificate\
  \ for the Kubernetes nodes.\n\nYou can install the cfssl and cfssljson programs\
  \ on macOS as follows:\n\n```\n$ brew install cfssl\n```\n\nOn Linux, you can do\
  \ the following:\n\n```\n$ wget -q --show-progress --https-only --timestamping \\\
  \nhttps://github.com/cloudflare/cfssl/releases/download/v1.4.1/cfssl_1.4.1_linux_amd64\
  \ \\\nhttps://github.com/cloudflare/cfssl/releases/download/v1.4.1/cfssljson_1.4.1_linux_amd64\n\
  $ chmod +x cfssl_1.4.1_linux_amd64 cfssljson_1.4.1_linux_amd64\n$ sudo mv cfssl_1.4.1_linux_amd64\
  \ /usr/local/bin/cfssl\n$ sudo mv cfssljson_1.4.1_linux_amd64 /usr/local/bin/cfssljson\n\
  ```\n\nRun the cfssl version command to make sure it installed correctly:\n\n```\n\
  $ cfssl version\nVersion: dev\nRuntime: go1.14\n```\n\nTo install the kubectl binary\
  \ on OS X, we can do the following:\n\n```\n$ curl -LO \"https://storage.googleapis.com/kubernetes-release/release/$(curl\
  \ -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/darwin/amd64/kubectl\"\
  \n$ chmod +x ./kubectl\n$ sudo mv ./kubectl /usr/local/bin/kubectl\n```\n\nHere\
  \ is the command for installing on Linux:\n\n```\n$ curl -LO https://storage.googleapis.com/kubernetes-release/release/`curl\
  \ -s https://storage.googleapis.com/kubernetes-release/release/stable.txt`/bin/linux/amd64/kubectl\n\
  $ chmod +x ./kubectl\n$ sudo mv ./kubectl /usr/local/bin/kubectl\n```\n\nYou can\
  \ verify that the kubectl client is working correctly by running the following:\n\
  \n```\n$ kubectl version --client\nClient Version: version.Info{Major:\"1\", Minor:\"\
  17\", GitVersion:\"v1.17.3\", GitCommit:\"06ad960bfd03b39c8310aaf92dle7c12ce618213\"\
  , GitTreeState:\"clean\", BuildDate:\"2020-02-11T18:14:22Z\", GoVersion:\"go1.13.6\"\
  , Compiler:\"gc\", Platform:\"darwin/amd64\"}\n```\n\nNow we are ready to build\
  \ our controller nodes with Ansible. Move into the Ansible playbook directory (Chapter5/Ansible-Playbooks)\
  \ and run the following command:\n\n\n\n```\n$ ansible-playbook -vi hosts controllers.yaml\n\
  ```\n\n这条命令执行需要一些时间；完成后，你应该会看到以下输出：\n\n```\nPLAY RECAP\n********************************************************************************\n\
  ********************************************************************************\n\
  ********************************************************************************\n\

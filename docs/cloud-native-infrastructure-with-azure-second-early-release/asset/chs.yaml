  [\n  {\n    \"accessedAt\": \"0001-01-01T00:00:00+00:00\",\n    \"autoDeleteOnIdle\"\
  : \"10675199 days, 2:48:05.477581\",\n    \"countDetails\": {\n      \"activeMessageCount\"\
  : 0,\n      \"deadLetterMessageCount\": 0,\n      \"scheduledMessageCount\": 0,\n\
  ```\n\n```\n\"transferDeadLetterMessageCount\": 0,\n\"transferMessageCount\": 0\n\

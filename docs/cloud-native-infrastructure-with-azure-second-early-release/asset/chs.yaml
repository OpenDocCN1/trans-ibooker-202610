  \ Prometheus 导出器。¹\n\n## NATS 使用 JetStream 的持久性\n\n尽管 NATS 在 2019 年引入了名为 NATS Streaming\
  \ 的持久性实现，但它将在 2023 年 6 月被弃用。第二代实现 JetStream 自 2020 年起一直在开发中，将成为今后用例的首选方案。尽管 JetStream\
  \ 有单独的 GitHub 仓库，但它现在已集成到 NATS Server 2.2.x 中，并由 NATS CLI 支持，我们稍后会讨论。NATS pub/sub\
  \ 仅提供“至多一次”传递；JetStream 允许“恰好一次”传递，更接近 RabbitMQ 队列和 Kafka 主题的行为（参见图 10-10）。\n\n\
  ![](img/8d47d1b5dbca55e784ae602145a894c7_342_0.png)\n\n## NATS 安全\n\n完全可以写一整章来介绍如何配置\
  \ NATS 2.3.x 的各种身份验证、授权和加密功能。在本节中，我们将介绍将安全级别从我们在迄今为止的大多数示例中使用的不安全默认值提升到生产部署所不合适的程度所需的基本步骤。强大的身份和密钥管理基础设施是安全云系统的基础，但超出了本书的范围。NATS\
  \ 提供了一个强大的权限子系统，允许按主题为基础进行细粒度控制²并使用分布式身份存储。\n\n### 基于 Nkey 的身份验证\n\n尽管 NATS 仍支持令牌和用户名/密码身份验证，但今后推荐使用\
  \ Nkey 身份验证。它使用非对称加密，并且不需要在服务器上以明文或哈希格式存储共享密钥。密钥管理非常简单。\n\n要生成密钥对，请使用 nkeys 仓库中的\
  \ nk³ 实用程序：\n\n```\n$ nk -gen user -pubout\nSUAGWCAMM XKR43EDIXVC5FEA5G3767ALGQR75N27NGPK37KZUURS7F32FE\n\
  UBFHQJERKEBE323BXQEVT6257CIRJ4CIC5LGT6R2LJ524GQTUQHX CUK3\n```\n\n公钥（以“U”开头）配置在服务器上：\n\
  \n```\n$ cat server.conf\nnet: 0.0.0.0\nport: 4242\n```\n\n```\nauthorization {\n\
  \  users: [\n    { nkey: UBFHQJERKEBE323BXQEVT6257CIRJ4CIC5LGT6R2LJ524GQTUQHXCU\
  \ K3 }\n  ]\n}\n```\n\n私钥（或种子；“S”前缀即表示此含义）存储在磁盘上并作为参数传递给 NATS 客户端或作为代码中的变量。如同任何敏感材料一样，最好将这些密钥存储在外部密钥存储中，例如\
  \ Azure Key Vault 或 Kubernetes secret：\n\n```\n$ cat client.nkey\nSUAGWCAMM XKR43EDIXVC5FEA5G3767ALGQR75N27NGPK37KZUURS7F32FE\n\
  \n$ nats -s nats://127.0.0.1:4224 --nkey client.nkey pub \"foo\"\n12:57:17 Published\
  \ 4 bytes to \"foo\"\n```\n\n### TLS 身份验证\n\n尽管我们已有安全的身份验证（并且根据我们如何配置主题权限，可能还有授权），仅使用\
  \ Nkey 对于网络安全来说是不够的，因为 NATS 默认是一个 ASCII 明文协议。\n\n与大多数云原生协议一样，NATS 支持双向 TLS 加密。通常，TLS\
  \ 最大的挑战是证书和密钥管理，这超出了本书的范围。为演示目的，mkcert 比 OpenSSL 更容易生成用于端到端加密所需的证书颁发机构（CA）、客户端和服务器密钥对。\n\
  \n首先，我们在 ~/nats 目录中设置 CA 并创建客户端和服务器证书：\n\n```\n$ mkdir ~/nats && cd ~/nats\n\n###\
  \ Create the CA\n$ mkcert -install\n\n### Create the server\n$ mkcert -cert-file\
  \ server-cert.pem -key-file server-key.pem localhost 127.0.0.1 ::1\n\n### Generate\
  \ a certificate for client authentication.\n$ mkcert -client -cert-file client-cert.pem\
  \ -key-file client-key.pem localhost ::1 127.0.0.1 email@localhost\n$ cp -av `mkcert\
  \ -CAROOT`/* ~/nats\n```\n\n然后我们在 ~/nats 目录中启动服务器并添加 TLS 证书参数：\n\n```\n$ nats-server\
  \ -DV --tls --tlscert=server-cert.pem --tlskey=server-key.pem -ms 8222\n```\n\n\
  最后，我们使用客户端连接：\n\n```\n$ nats --tlscert=client-cert.pem --tlskey=client-key.pem account\
  \ info\n```\n\n在服务器上，我们应该看到成功的 TLS 连接：\n\n```\n[10108] 2021/06/28 14:46:40.126469\
  \ [DBG] 127.0.0.1:50192 - cid:11 - Client connection created\n[10108] 2021/06/28\
  \ 14:46:40.126573 [DBG] 127.0.0.1:50192 - cid:11 - Starting TLS client connection\
  \ handshake\n[10108] 2021/06/28 14:46:40.157446 [DBG] 127.0.0.1:50192 - cid:11 -\
  \ TLS handshake complete\n[10108] 2021/06/28 14:46:40.157468 [DBG] 127.0.0.1:50192\
  \ - cid:11 - TLS version 1.3, cipher suite TLS_AES_128_GCM_SHA256\n[10108] 2021/06/28\
  \ 14:46:40.157584 [TRC] 127.0.0.1:50192 - cid:11 - <- [CONNECT\n{\"verbose\":false,\"\
  pedantic\":false,\"tls_required\":true,\"name\":\"NATS CLI Version 0.0.23\",\"lang\"\
  :\"go\",\"version\":\"1.11.0\",\"protocol\":1,\"echo\":true,\"headers\":true,\"\
  no_responders\":true}\n]\n```\n\n## 在 Kubernetes 上部署 NATS\n\nNATS 可以使用 Helm chart\
  \ 快速安装。Helm chart 还会安装 Prometheus operator 和证书管理器，使你能够充分利用 NATS 随附的指标和 TLS 支持。\n\
  \n- 首先添加 Helm 仓库：\n- 然后安装 NATS 服务器：\n- 安装 NATS streaming 服务器（称为 stan）：\n- 完成这些步骤后，将有一个\
  \ Grafana Surveyor，你可以通过端口转发到 Pod 来查看：\n- 你可以在浏览器中 http://127.0.0.1:3000/d/nats/nats-surveyor?refresh=5s&orgId=1\
  \ 查看 Grafana。\n\n```\n$ helm repo add nats https://nats-io.github.io/k8s/helm/charts/\n\
  $ helm repo update\n```\n\n```\n$ helm install my-nats nats/nats\n```\n\n```\n$\
  \ helm install my-stan nats/stan --set stan.nats.url=nats://my-nats:4222\n```\n\n\
  ```\nkubectl port-forward deployments/nats-surveyor-grafana 3000:3000\n```\n\n你的\
  \ Help 部署提供了许多 Helm 可配置项。你可以在 NATS Helm 部署配置页面上阅读更多相关信息。\n\n你可以使用 nats-py 包以非常直接的方式用\
  \ Python 编写 NATS 代码。在以下示例中，我们用 Python 编写了一个基本的生产者和消费者。NATS 为你提供了公共服务器用于测试。如果要在自己的环境中测试，请将\
  \ nc = await nats.connect(\"nats://demo.nats.io:4222\") 替换为你的 NATS 实例地址：\n\n```\n\
  import time\n\nimport asyncio\nimport nats\nfrom nats.aio.errors import ErrConnectionClosed,\
  \ ErrTimeout, ErrNoServers\n\nasync def run():\n    # The Nats project provides\
  \ a public demo server `nats://demo.nats.io:4222`.\n    # You can add your own Nats\
  \ server on the next line\n    nc = await nats.connect(\"nats://demo.nats.io:4222\"\
  )\n\n    async def message_handler(msg):\n        subject = msg.subject\n      \
  \  reply = msg.reply\n        data = msg.data.decode()\n        print(\"Received\
  \ a message on '{subject} {reply}': {data}\".format(\n            subject=subject,\
  \ reply=reply, data=data))\n\n    # Simple publisher and async subscriber via coroutine.\n\
  \    sub = await nc.subscribe(\"foo\", cb=message_handler)\n\n    await nc.publish(\"\
  foo\", b'Message1')\n    await nc.publish(\"foo\", b'Message2')\n\n    time.sleep(5)\n\
  \    # Remove interest in subscription.\n    await sub.unsubscribe()\n```\n\n\n\n\
  \n### 终止与 NATS 的连接。\nawait nc.drain()\n\nif __name__ == '__main__':\n    loop =\
  \ asyncio.get_event_loop()\n    loop.run_until_complete(run())\n    loop.close()\n\
  \n## Azure 消息服务\n\n当商业公有云服务在 2000 年代中期首次推出时，存储和消息服务（如 AWS S3 和 AWS SQS）是首批可供客户使用的服务之一。Microsoft\
  \ Azure 提供了多种托管消息服务，以支持云特定实现，以及 AMQP 和 JMS 等基于标准的消息协议，以及我们在本章中已探讨的工作队列和发布/订阅等模式。所有\
  \ Azure 选项均提供“至少一次”传递。\n\n在 Azure Service Bus、Azure Event Hubs 和 Azure Event Grid\
  \ 之间进行选择时，应考虑以下标准：\n\n- 与本地消息线协议和平台（ActiveMQ、RabbitMQ）及工具的兼容性\n- 与其他 Azure 托管服务所需集成的程度\n\
  - 对有序消息和事务的需求\n- 处理事件流的能力\n- 使用大数据管道\n- 最大摄取速率（每秒事件数）\n- 可用的异步事件模式\n- 定价\n\n使用 Azure\
  \ 消息服务的主要好处之一是能够利用 Azure IAM 功能和密钥管理。让我们现在详细了解 Azure 的产品。\n\n## Azure Service Bus\n\
  \nAzure Service Bus 是一种托管队列服务，提供与 ActiveMQ 和 RabbitMQ 相当的企业级功能，但无需管理虚拟机上的多个代理或在\
  \ Kubernetes 之上的部署的开销。Azure Service Bus 可通过 Azure Service Bus Premium⁴ 跨多个可用区扩展，并旨在支持从本地\
  \ JMS 2.0 实现的迁移。\n\nService Bus 支持我们在本章开头讨论的简单消息队列和发布/订阅模式。最常见的模式是“拉取模型”，消费者轮询服务端点以获取新消息。就像\
  \ RabbitMQ 和 Kafka 一样，多个消费者可以在消息可用时尽可能快地处理消息，从而允许工作在多个工作节点之间分配。Azure Service Bus\
  \ 实现 AMQP 1.0⁵，并为 .NET、Java、Python、Go 等提供了完善的文档 SDK 和代码示例。\n\n### Service Bus 概念\n\
  \nAzure Service Bus 抽象（请参阅图 10-11 和图 10-12 了解参考架构）提供的功能与 NATS 中的功能相似。\n\n图 10-11.\
  \ 一个参考 Service Bus 架构\n\n图 10-12. 一个简单的消息架构\n\n### 命名空间\n\n命名空间允许将主题、队列和服务作为消息组件的容器进行分段，就像虚拟网络为虚拟机和负载均衡器等网络组件提供边界一样。Kafka\
  \ 没有提供可比的抽象，但 RabbitMQ 虚拟主机和 NATS 账户则提供。\n\n### 队列、主题和订阅\n\nAzure Service Bus 队列提供有序的\
  \ FIFO 消息集，其拉取方式类似于 Kafka 和 RabbitMQ 消费者或 NATS 基于拉取的消费者，而主题主要用于发布/订阅模式和面向大量消费者的点对多通信。订阅允许消费者基于过滤规则接收消息。就像\
  \ NATS JetStream 一样，消息是从订阅（类似于 JetStream 的消费者）中检索的，而不是从主题本身检索的（相当于 NATS JetStream\
  \ 流）。\n\n### 使用 Terraform 管理 Azure Service Bus\n\n尽管 Microsoft 提供了 Service Bus 管理的\
  \ Python SDK，但我们将继续使用 Terraform 来创建 Service Bus 命名空间、队列和主题。以下代码示例部署了一个新的 servicebus、命名空间、队列和主题：\n\
  \n```\nprovider \"azurerm\" {\n  features {}\n}\n\nresource \"azurerm_resource_group\"\
  \ \"example\" {\n  name     = \"terraform-servicebus\"\n  location = \"Central US\"\
  \n}\n\nresource \"azurerm_servicebus_namespace\" \"example\" {\n  name         \
  \       = \"mdfranz-servicebus-namespace\"\n  location            = azurerm_resource_group.example.location\n\
  \  resource_group_name = azurerm_resource_group.example.name\n  sku            \
  \     = \"Standard\"\n```\n\n```\ntags = {\n    source = \"terraform\"\n}\n\nresource\
  \ \"azurerm_servicebus_queue\" \"example\" {\n    name                = \"mdfranz-servicebus-queue\"\
  \n    resource_group_name = azurerm_resource_group.example.name\n    namespace_name\
  \      = azurerm_servicebus_namespace.example.name\n    enable_partitioning = true\n\
  }\n\nresource \"azurerm_servicebus_topic\" \"example\" {\n    name             \
  \   = \"mdfranz-servicebus-topic\"\n    resource_group_name = azurerm_resource_group.example.name\n\
  \    namespace_name      = azurerm_servicebus_namespace.example.name\n    enable_partitioning\
  \ = true\n}\n```\n\n使用 azure-cli，我们可以看到创建的资源：\n\n```\n$ az servicebus queue list\
  \ --namespace-name mdfranz-servicebus-namespace -g terraform-servicebus\n[\n  {\n\

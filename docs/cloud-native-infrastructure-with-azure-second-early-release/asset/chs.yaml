  \ branch=HEAD,\nrevision=3715be6ae899f2a9b9dbfd9c39f3e09a7bd4559f)\"\nlevel=info\
  \ ts=2020-12-01T13:20:29.510Z\ncaller=node_exporter.go:178 msg=\"Build context\"\
  \ build_context=\"\n(go=go1.14.4, user=root@4c8e5c628328, date=20200616-12:52:07)\"\
  \nlevel=info ts=2020-12-01T13:20:29.511Z\ncaller=node_exporter.go:105 msg=\"Enabled\
  \ collectors\"\nlevel=info ts=2020-12-01T13:20:29.511Z\ncaller=node_exporter.go:112\

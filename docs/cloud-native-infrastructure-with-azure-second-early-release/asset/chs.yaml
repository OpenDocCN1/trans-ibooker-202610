  \ IaC 的一种快速方法是使用云提供商提供的预写模板，这些模板说明了如何创建基础设施。Azure 原生支持 Azure 资源管理器（ARM）模板，用于定义和创建基础设施资源，直接阐明了\
  \ IaC 哲学。这种云与 IaC 的结合使组织能够更快、更高效地引入更改。\n\n本章为开发对 IaC 和 Azure 的丰富理解奠定了基础。首先，我们将介绍\
  \ IaC 概念及其在构建云原生基础设施中的重要性。然后我们将介绍 Microsoft Azure，这是我们将在整本书中使用的云提供商。\n\n接下来，我们将深入探讨\
  \ Terraform 作为实现 IaC 的工具。我们还将介绍 Packer，这主要是一个用于构建机器映像的工具，以及 Ansible，以便在构建云原生应用程序时向你介绍配置管理。最后，在结束本章之前，我们将简要介绍\
  \ Azure DevOps。让我们开始吧。\n\n### 基础设施即代码及其在云原生世界中的重要性\n\n在过去，当 IT 团队想要为应用程序部署采购新硬件时，他们首先必须发起硬件采购请求，这需要几天甚至几周的时间完成。即使硬件最终在本地交付，应用程序才能在上面部署之前，还需要几天时间才能使其处于工作状态。如今，随着\
  \ DevOps 和云的兴起，这些缓慢的过程已经消失。发布周期变得更短，满足业务需求的速度也加快了。\n\n然而，即使引入了云，管理基础设施仍然是一个问题。虽然物理服务器被虚拟服务器取代，复杂基础设施的管理成为云厂商的责任，但增长和扩展基础设施仍然是一项困难且容易出错的任务。工程团队需要在继续维护旧基础设施的同时，不断构建新的基础设施和软件堆栈。为了缓解与这些任务相关的单调和疲劳，基于云的系统的构建和管理变得自动化，从而产生了一个强大的基础设施和应用程序环境。\n\
  \n最终，随着代码被改编为配置计算、网络和存储层，基础设施即代码的好处变得显而易见。这导致了在云环境中采用 IaC 的运动。\n\n*基础设施即代码* 是将你的基础设施视为可编程指令的哲学。就像你签入源代码控制文件一样，你也会签入你的基础设施定义。将基础设施视为代码提供了众多优势，包括以下内容：\n\
  \n- 能够签入你的基础设施定义版本，并在出现问题时回滚到特定版本\n- 幂等性，使你能够以最小的努力重现完全相同的<|message|> 基础设施\n- 跨堆栈的标准化的日志记录、监控和故障排除\n\
  - 减少工程团队中的单点故障（即只有一名工程师知道如何构建特定类型的系统）\n- 提高开发人员生产力（站点可靠性工程师 [SRE] 和/或 DevOps 工程师可以专注于编写开发人员可以用来构建测试环境的代码）\n\
  - 最少的手动交互，从而导致更不易出错的基础设施\n- 显著减少故障的平均恢复时间（MTTR）\n- 甚至在基础设施创建之前就能测试你的基础设施\n\n有了 IaC\
  \ 的好处，很明显此类工具在现代云原生环境中发挥着重要作用，在这些环境中，应用程序必须即时更改。更改可以是微小的，例如添加新的配置标签，也可以是重大的，例如添加新集群以跟上容量需求。可靠的\
  \ IaC 策略有助于开发人员轻松管理这些更改，而不会损害软件开发过程的速度。一旦 IaC 嵌入到你的基础设施构建流程的核心，它还有助于构建反脆弱的基础设施。\n\
  \n\n\n\n\n### 反脆弱基础设施\n\n反脆弱基础设施是指能够承受压力并展现出弹性和韧性的系统。反脆弱旨在构建能够应对不可预测和不规则事件的基础设施，同时变得更加强大。\n\
  \n当今的云原生应用程序被视为处于运动中的应用程序，因为其底层基础设施也在不断变化和升级。云使你能够将基础设施视为短暂的实体而非永久的实体。云原生方法提倡构建可替换的基础设施，而不是修复损坏的基础设施。由于云原生方法将应用程序与基础设施解耦，它使工程师能够自信地对基础设施进行更改，同时知道他们可以轻松地回滚并继续前进。\n\
  \n### 云原生基础设施哲学\n\n在构建云原生基础设施时，始终将底层基础设施视为短暂的实体，而非长期维护的系统。这意味着如果一台服务器宕机，将其杀掉并立即启动一台新服务器会很容易，而不是尝试修复它。\n\
  \n从单体架构向微服务的转变也帮助 IaC 获得了发展势头，确保现代应用程序能够遵循“十二要素应用”方法论，该方法论允许在独立于应用程序开发的情况下做出基础设施决策。IaC\
  \ 在构建云原生基础设施时带来的另一个重要优势是，它能够实现不可变基础设施；也就是说，一旦基础设施部署完成，就无法更改或配置。在典型的可变应用程序部署场景中，应用程序被开发，然后部署到底层基础设施上，最后在底层基础设施上进行配置（图\
  \ 2-1）。此过程引入了配置漂移，导致基础设施开始偏离初始状态。相比之下，不可变基础设施专注于每次推送新更改时重新部署基础设施和应用程序，从而使基础设施紧密保持在其精确状态。不变性是通过在预烘焙（例如机器映像）状态下开发和配置应用程序然后再部署它来实现的（图\
  \ 2-2）。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_25_0.png)\n\n图 2-1. 可变流程\n\n\
  ![](img/8d47d1b5dbca55e784ae602145a894c7_25_1.png)\n\n图 2-2. 不可变流程\n\n构建不可变基础设施的主要优势是：\n\
  \n- 可预测的基础设施/系统，而非被动的基础设施/系统\n- 部署现在具有原子性\n- 对基础设施有更多控制，从而带来更好的遥测\n\n现在我们已经讨论了 IaC\
  \ 及其在构建云原生基础设施时的价值，让我们来看看如何在云原生基础设施中使用 Microsoft Azure。\n\n### 开始使用 Azure 并设置环境\n\
  \nMicrosoft Azure 是一家在全球拥有数十个区域的云服务提供商。Azure 允许你通过手动和自动化的方式快速创建和部署基础设施，正如我们在本书中将要讨论的那样。作为\
  \ PaaS（平台即服务），Azure 为开发者社区提供了大量灵活性以进行创新、创建和部署应用程序。我们选择 Azure 作为我们的云环境，是因为其速度、灵活性、安全、灾难恢复以及简单的学习曲线。\n\
  \n在本节中，我们将解释 Azure 周围的基本概念以及如何创建 Azure 账户。\n\n### Azure 基础知识和准备你的 Azure 环境\n\n在开始使用\
  \ Azure 之前，了解其一些基本构件非常重要。理解这些概念将有助于在未来做出政策决策：\n\nTenant\n\nAzure 租户是组织在 Azure Active\
  \ Directory（AAD）中的表示。你可能已经熟悉传统的 Active Directory（AD）服务。当组织在 Microsoft 创建账户时，将会创建一个\
  \ AAD 实例。\n\n所有 AAD 实例彼此完全隔离，所有身份（用户或服务账户）也是如此。如果你已有现有的 Microsoft 租户（例如 Office 365），你可以将其用于你的\
  \ Azure 部署。你也可以通过 Azure 门户创建自己的 AAD 租户。记得在租户上启用多因素身份验证（MFA）。\n\nSubscriptions\n\n\
  Azure 订阅本质上是资源的计费容器。你也可以在订阅级别设置特定的 Azure 策略。\n\nManagement groups\n\nAzure 管理组提供了一种组织和管理订阅的方式。你可以使用管理组对管理组内的所有资源（包括订阅）应用策略/治理。管理组内的所有订阅默认会继承管理组策略。\n\
  \n### Resource groups\n\n资源组是容纳 Azure 解决方案相关资源的容器。资源组包括你希望作为一组管理的资源。你根据对组织最有意义的方式决定哪些资源属于资源组。此外，资源可以位于与资源组不同的区域中。\n\
  \n### Regions\n\nAzure 区域包含两个或多个可用区。可用区是地理区域内的物理隔离数据中心。\n\n图 2-3 描述了这些基本构件如何相互关联。\n\
  \n![](img/8d47d1b5dbca55e784ae602145a894c7_28_0.png)\n\n图 2-3. Azure 基本构件\n\n###\
  \ 创建 Azure 账户\n\n你可以通过导航到 https://azure.microsoft.com 并使用免费计划来创建 Azure 账户。你需要使用\
  \ Microsoft 账户登录；Hotmail、Outlook 或 Office 365 账户均可使用，尽管我们强烈建议同时使用 MFA。按照 Azure 网站上的说明创建你的账户。要继续，请点击右上角的“我的账户”链接或直接前往\
  \ Microsoft Azure 门户：https://portal.azure.com。\n\n现在让我们讨论如何使用 Azure CLI。\n\n###\
  \ 安装 Azure CLI\n\nAzure CLI 是一组可用于创建和管理 Azure 资源的命令。你可以在 Azure 门户的网页浏览器中使用 CLI，或从\
  \ https://docs.microsoft.com/en-us/cli/azure/install-azure-cli 下载适当版本在本地机器上安装。例如，在\
  \ macOS 上，你可以使用命令 brew install azure-cli 安装 Azure CLI。\n\n你可以使用 az 命令按如下方式通过门户与\
  \ Azure 交互：\n\n```\n$ az account show\n{\n  \"environmentName\": \"AzureCloud\"\
  ,\n  \"id\": \"b5627140-9189-4305-a94c-3b199afe86791\",\n  \"isDefault\": true,\n\
  \  \"name\": \"Visual Studio Enterprise\",\n  \"state\": \"Enabled\",\n  \"tenantId\"\
  : \"baeb0498-d28a-41cd-a20d-d9409814a06k\",\n  \"user\": {\n    \"name\": \"cloudnative@xyz.com\"\
  ,\n    \"type\": \"user\"\n  }\n}\n```\n\n你甚至可以使用 Azure CLI 以声明式的方式脚本化你的云基础设施。这些脚本可以在\
  \ PowerShell 或 Bash 中执行。虽然 Azure 脚本对于创建、拆除和重新部署基础设施等任务效果良好，但由于 Azure CLI 命令缺乏幂等性，更新现有环境等任务并不直接。\n\
  \n除了 Azure 之外，还有其他工具可用于创建和管理云环境。我们接下来将查看其中一些更突出的工具。\n\n### prominents IaC 工具\n\n\
  如前所述，可以使用额外的工具通过遵循 IaC 方法来构建云原生基础设施。在这里，我们将重点介绍三种更受欢迎的开源工具，可与各种云提供商一起使用：\n\n- Terraform，一种基于\
  \ CLI 的 IaC 工具\n- Packer，用于构建机器映像的 CLI 工具\n- Ansible，一种配置管理工具\n\n你也可以在持续集成/持续部署（CI/CD）设置中使用所有这些工具；在这种情况下，只要你编写了\n\
  \n\n\nnew configuration it can be continuously integrated into your deployment pipeline.\n\
  \n### Terraform\n\nTerraform 是 HashiCorp 的开源 IaC 工具，使用 Go 编程语言编写。单词 *terraform*\
  \ 的意思是把一个星球的环境改造得与地球大气层非常相似，以至于人类物种能够在上面生存。当你把云服务提供商看作需要被改造为可管理的基础设施的环境时，这种类比就成立了，这样可以帮助你的应用程序充分利用云并发挥其真正潜力。\n\
  \nTerraform 帮助你以安全高效的方式在云中构建、更改和版本化基础设施。它使用声明式语法，这意味着你只需要告诉它*什么*你想要构建，而不是*如何*构建它。Terraform\
  \ 的一个主要优势是它支持一种易于理解的领域特定语言（DSL），称为 HashiCorp 语言（HCL），相对容易被人类解读。或者，你也可以使用 JSON 来实现相同的目的。此外，Terraform\
  \ 是云无关的，因此支持多个云提供商，这使得学习变得非常容易，因为你不必为不同的云提供商再次学习语言（HCL/JSON）。在本节中，我们将讨论如何利用 Terraform\
  \ 按照 IaC 哲学在 Azure 上构建基础设施。\n\n为了让你理解 Terraform 的工作原理，首先我们必须回顾一些基本术语：\n\n#### Providers\n\
  \nTerraform 中的 provider 通常（但不总是）是一个云提供商。provider 的职责是公开资源（例如云资源）并解释 API。Terraform\
  \ 支持的一些 provider 有 Azure、Amazon Web Services（AWS）、Google Cloud Platform（GCP）和 PagerDuty。\n\
  \n#### Plan\n\n当你使用命令 `terraform plan` 创建基础设施时，Terraform 会为你创建一个执行计划，该计划基于你通过 Terraform\
  \ 配置（.tf）文件编写的代码。执行计划包括 Terraform 将采取的构建所请求基础设施的步骤。\n\n#### Apply\n\n当你对 Terraform\
  \ 创建的计划感到满意时，你可以使用 `terraform apply` 命令来创建基础设施，最终达到期望状态（如果没有冲突或错误）。\n\n#### State\n\
  \nTerraform 需要一种方式来存储基础设施的状态，以便它可以管理它。状态存储在基于文本的 *state files* 中，这些文件保存了你的云资源与配置之间的映射。一般来说，Terraform\
  \ 可以以两种方式存储基础设施的状态：本地保存在初始化它的系统上，或远程存储。推荐远程存储状态的方法，因为它可以备份你的基础设施状态，并且更多工程师可以一起构建基础设施，因为现在有一个单一事实来源，使得了解基础设施的当前状态成为可能。状态文件不应检入\
  \ Git 仓库，因为它可能包含机密信息；你可以使用 Azure blob storage 代替。Terraform 默认也支持状态文件的锁定。\n\n####\
  \ Module\n\nterraform module 是一组一起使用的资源。模块通过抽象一次配置并多次使用的资源来帮助创建可重用的基础设施。使用模块的主要优势之一是它们允许你重用代码，该代码以后可以在团队之间跨各种项目共享。\n\
  \n#### Backend\n\nbackend 描述了状态将如何加载。它是你状态文件最终将被存储的位置。你可以使用本地文件存储或 Azure blob storage\
  \ 用于此目的。\n\nFigure 2-4 显示了 provider 和 resource 块。provider 块提及 Azure 资源管理器的版本，而两个\
  \ resource 块创建 Azure 资源组和虚拟网络。\n\n```\nprovider \"azurerm\" {\n  version = \"2.0.0\"\
  \n  features {}\n}\n\nresource \"azurerm_resource_group\" \"example\" {\n  name\
  \     = \"dummy-resource-group\"\n  location = \"West Europe\"\n}\n\nresource \"\
  azurerm_virtual_network\" \"example\" {\n  name                 = \"example-network\"\
  \n  resource_group_name  = azurerm_resource_group.example.name\n  location     \
  \        = azurerm_resource_group.example.location\n  address_space        = [\"\
  10.0.0.0/16\"]\n}\n```\n\nFigure 2-4. A simple Terraform file depicting resource\
  \ creation and the Azure provider\n\n现在我们已经介绍了 Terraform 的基础知识，让我们看看它们如何结合起来在 Azure\
  \ 中配置云原生基础设施。Figure 2-5 描述了总体工作流程。\n\n![](img/8d47d1b5dbca55e784ae602145a894c7_33_0.png)\n\
  \nFigure 2-5. Terraform workflow\n\n要开始使用 Terraform，请遵循以下步骤：\n\n- 使用 `terraform\
  \ init` 命令初始化 Terraform。如果你没有初始化目录，就无法运行 `plan` 和 `apply`。\n- 在你成功初始化 Terraform\
  \ 后，使用 `terraform plan` 命令创建执行计划或进行试运行。\n- 当你对计划的输出感到满意时，使用 `terraform apply` 命令创建你的基础设施。\n\
  \n根据你使用的 provider，基础设施将在相应的云提供商环境中进行配置（在我们的例子中，是 Microsoft Azure）。如果你想销毁你的基础设施，你可以简单地发出\
  \ `terraform destroy` 命令，这将删除与当前目录相对应的基础设施。使用 Terraform 删除基础设施时务必极其小心。\n\n> **WARNING**\n\
  > \n> 使用 Terraform 删除基础设施时务必极其小心。一旦基础设施被删除，状态文件将使用更新后的值进行更新。在删除基础设施之前，请目视检查 `terraform\
  \ destroy` 的输出，以免意外删除重要信息。\n\n现在你对工作流程和操作细节有了大致的了解，让我们更深入地实践 Terraform。\n\n####\
  \ Installing Terraform\n\n要将 Terraform 安装到你的机器上，⁴ 首先你必须为你的操作系统找到适当的二进制包（https://www.terraform.io/downloads.html）。如果你使用\
  \ Azure Cloud Shell，Terraform 的最新版本默认会存在。截至本文撰写时，Terraform 的当前版本是 0.12.28。要找到适当的二进制包：\n\
  \n```\n##### For Linux-based systems:\n$ wget\nhttps://releases.hashicorp.com/terraform/0.12.28/terraform_0.12.28_linux_amd64.zip\n\
  \n##### For macOS-based systems:\n$ wget\nhttps://releases.hashicorp.com/terraform/0.12.28/terraform_0.12.28_darwin_amd64.zip\n\
  ```\n\n一旦你获取了 ZIP 文件，解压二进制文件并将单个二进制文件移动到 /usr/local/bin。你可以通过从 shell 使用 Terraform\
  \ 的帮助来验证 Terraform 是否已安装：\n\n```\n$ ~ terraform --version\nTerraform v0.12.28\n\
  $ ~ terraform --help\nUsage: terraform [-version] [-help] <command> [args]\n```\n\
  \n可用的执行命令列在下面。\n最常用、最有用的命令首先显示，其次是较不常见或更高级的命令。如果你刚开始使用 Terraform，请坚持使用常用命令。对于其他命令，请在使用前阅读帮助和文档。\n\
  \n- Common commands:\n  - apply                Builds or changes infrastructure\n\
  \  - console              Interactive console for Terraform\n  - interpolations\n\
  \  - destroy              Destroy Terraform-managed infrastructure\n  - env    \
  \              Workspace management\n  - fmt                  Rewrites config files\
  \ to canonical format\n  - get                  Download and install modules for\
  \ the configuration\n  - graph                Create a visual graph of Terraform\
  \ resources\n  - import               Import existing infrastructure into Terraform\n\
  \  - init                 Initialize a Terraform working directory\n  - login  \
  \              Obtain and save credentials for a remote host\n  - logout       \
  \        Remove locally-stored credentials for a remote host\n  - output       \
  \        Read an output from a state file\n  - plan                 Generate and\
  \ show an execution plan\n  - providers            Prints a tree of the providers\
  \ used in the configuration\n  - refresh              Update local state file against\
  \ real resources\n  - show                 Inspect Terraform state or plan\n  -\
  \ taint                Manually mark a resource for recreation\n  - untaint    \
  \          Manually unmark a resource as tainted\n  - validate             Validates\
  \ the Terraform files\n  - version              Prints the Terraform version\n \
  \ - workspace            Workspace management\n\n\n\n\n\nAll other commands:\n \
  \ 0.12upgrade      Rewrites pre-0.12 module source code for v0.12\n  debug     \
  \       Debug output management (experimental)\n  force-unlock     Manually unlock\
  \ the terraform state\n  push             Obsolete command for Terraform Enterprise\n\
  legacy (v1)\n  state            Advanced state management\n$ ~\n\n### Setting up\
  \ Terraform access to a Microsoft Azure account\n\nNow that you have set up your\
  \ Azure account and set up Terraform locally, you can configure Terraform to access\
  \ your Azure account:\n\n- Click the Cloud Shell icon at the top-right corner in\
  \ your Azure portal account and then click “Create storage.” This will create a\
  \ new storage account for you, which will take a few minutes.\n- After selecting\
  \ Cloud Shell, you can choose either Bash or PowerShell. You can also change the\
  \ shell later if you want. Throughout this book, we will be using the Bash shell.\
  \ Once setup has completed, you will be presented with the following:\n\n```\nRequesting\
  \ a Cloud Shell.Succeeded.\nConnecting terminal...\n\nWelcome to Azure Cloud Shell\n\
  \nType \"az\" to use Azure CLI\nType \"help\" to learn about Cloud Shell\n\nnishant@Azure:~$\n\
  ```\n\n- Now you must get a list of subscription ID and tenant ID values. To do\
  \ this, run the following command in Cloud Shell to list all Azure account names,\
  \ subscription IDs, and tenant IDs:\n\n```\nnishant@Azure:~$ az account list --query\
  \ \"[].{name:name, subscriptionId:id, tenantId:tenantId}\"\n```\n\n```\n[{\n  \"\
  name\": \"Visual Studio Enterprise\",\n  \"subscriptionId\": \"b1234567-89017-6135-v94s-3v16ifk86912\"\
  ,\n  \"tenantId\": \"ba0198-d28a-41ck-a2od-d8419714a098\"\n}]\nnishant@Azure:~$\n\
  ```\n\n- Note the subscriptionId value from the returned JSON output. Then, while\
  \ still in Cloud Shell, replace the subscriptionId with the following command:\n\

  \n### 使用 Terraform 探索 Azure 基础设施\n\n现在我们已经用 Terraform 创建了基本的基础设施，让我们深入挖掘并创建额外的基础设施。\n\
  \n在示例 2-1 中，我们向你展示了如何将状态存储在本地。虽然这不是推荐的过程，但对于像资源组创建示例（test.tf）这样的基本使用来说已经足够。最好使用远程存储，如\
  \ Azure blob 存储，它为你的基础设施配置提供持久性和安全性。\n\n> WARNING\n> \n> Terraform 状态是事实来源，应始终存储在\
  \ Consul 或 Amazon DynamoDB Azure 存储等后端中，因为这将安全地存储你的基础设施状态以及用于更轻松管理或在灾难情况下回滚的版本控制。状态不应签入\
  \ Git 版本控制系统，因为 Git 包含机密。\n\n在下面的小节中，我们将在 Azure 账户中创建 blob 存储来存储我们所有的基础设施状态。我们还将遵循“不要重复自己”（DRY）原则，确保我们利用\
  \ Terraform 的模块。我们将讲解虚拟网络和虚拟机的创建。你可以在仓库 https://bit.ly/2ZSVSze 中找到模块。\n\n### 创建\
  \ Azure blob 存储\n\n要创建 Azure blob 存储，你需要使用以下模块：https://bit.ly/3bM6jCx。\n\n现在，按照“使用\
  \ Terraform 进行基本使用和基础设施设置”部分中概述的步骤部署存储账户。一旦你发出 `terraform plan` 命令，你将看到大量关于计划的信息与模块交织在一起。你还会注意到模块（例如\
  \ Storage_accounts）是抽象的，而资源文件看起来像这样：\n\n```\nmodule \"CloudNativeAzure-strg-backend\"\
  \ {\n  source = \"../Modules/Services/Storage_accounts\"\n  resource-grp-name =\
  \ \"CloudNativeAzure-group\"\n  storage-account-name = \"cnabookprod\"\n  azure-dc\
  \ = \"westus\"\n  storage-account-tier = \"Standard\"\n  storage-replication-type\
  \ = \"LRS\"\n  storage-container-name = \"cloud-native-devs\"\n  storage-container-access\
  \ = \"private\"\n}\n```\n\n```\nblob-name = \"cloud-native-with-azure\"\n}\n```\n\
  \n这展示了将可重复的基础设施抽象到模块后面的强大功能。一旦你使用 `terraform apply`，程序将运行，几分钟后你将看到一个名为 cnabookprod\
  \ 的存储账户和一个名为 cloud-native-with-azure 的 blob：\n\n```\n. \n. \nmodule.CloudNativeAzure-strg-\n\

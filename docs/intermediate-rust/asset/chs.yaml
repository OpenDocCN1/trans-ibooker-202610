- "# 2 基础\n\n![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_4_0.png)\n\n当你深入 Rust 更高级的领域时，确保自己对基础知识有扎实的理解非常重要。在\
  \ Rust 中，如同在任何编程语言中一样，当你开始以更复杂的方式使用语言时，各种关键字和概念的精确含义就变得至关重要。在本章中，我们将逐一讲解 Rust 的许多原语，并尝试更清晰地定义它们的含义、工作原理，以及它们为何恰恰是现在这个样子。具体来说，我们将研究变量和值的区别、它们在内存中的表示方式，以及程序所拥有的不同内存区域。然后，我们将讨论所有权、借用和生命周期方面的一些微妙之处，这些内容你需要在继续阅读本书之前掌握。\n\
  \n你可以从上到下通读本章，也可以将其作为参考资料，用来复习那些你不太确定的概念。我建议你只有在完全熟悉本章内容后再继续阅读，因为对这些原语工作方式的误解很快就会妨碍你理解更高级的主题，或者导致你错误地使用它们。\n\
  \n## 谈论内存\n\n并非所有内存都是平等的。在大多数编程环境中，你的程序可以访问栈、堆、寄存器、文本段、内存映射寄存器、内存映射文件，或许还有非易失性 RAM。在特定情况下选择使用哪一种，会影响你可以在其中存储什么、它保持可访问的时间有多长，以及你使用什么机制来访问它。这些内存区域的确切细节因平台而异，超出了本书的范围，但其中一些对于你如何推演\
  \ Rust 代码至关重要，值得在此介绍。\n\n### 内存术语\n\n在我们深入探讨内存区域之前，你首先需要了解值（value）、变量（variable）和指针（pointer）之间的区别。Rust\
  \ 中的值是类型与该类型值域中一个元素的组合。值可以通过其类型的表示转换为字节序列，但就其本身而言，你可以将值更多地理解为“你作为程序员所表达的含义”。例如，`u8`\
  \ 类型中的数字 6 是数学整数 6 的一个实例，它在内存中的表示是字节 `0x06`。类似地，`str` \"Hello world\" 是所有字符串值域中的一个值，其表示是其\
  \ UTF-8 编码。值的含义与这些字节存储的位置无关。\n\n值存储在一个“场所”（place）中，这是 Rust 术语，指“可以保存值的位置”。这个位置可以在栈上、堆上，或许多其他位置。存储值最常见的场所是变量，即栈上命名的值槽。\n\
  \n指针是保存某个内存区域地址的值，因此指针指向一个场所。指针可以被解引用，以访问其所指向内存位置中存储的值。我们可以将同一个指针存储在多个变量中，从而让多个变量间接引用内存中的同一位置，进而引用同一个底层值。\n\
  \n考虑清单 2-1 中的代码，它说明了这三个元素。\n\n```rust\nlet x = 42;\nlet y = 43;\nlet var1 = &x;\n\
  let mut var2 = &x;\nvar2 = &y;\n```\n\n*清单 2-1：值、变量和指针*\n\n这里有四个不同的值：42（一个 `i32`）、43（一个\
  \ `i32`）、x 的地址（一个指针）和 y 的地址（一个指针）。还有四个变量：x、y、var1 和 var2。后两个变量都持有指针类型的值，因为引用就是指针。虽然\
  \ var1 和 var2 初始存储相同的值，但它们存储的是该值的独立副本；当我们改变 var2 中存储的值时，var1 中的值不会改变。特别要注意，`=` 运算符将右侧表达式的值存储到左侧命名的场所中。\n\
  \n一个体现变量、值和指针之间区别的有趣例子是如下语句：\n\n```rust\nlet string = \"Hello world\";\n```\n\n\
  尽管我们向变量 string 赋值了一个字符串值，但该变量的*实际*值是指向字符串值 \"Hello world\" 第一个字符的指针，而不是字符串值本身。此时你可能会说：“等等，那么字符串值存储在哪里？指针指向哪里？”如果你这样问，那你的眼光很敏锐——我们马上就会讲到。\n\
  \n## 深入变量\n\n我之前给出的变量定义较为宽泛，本身可能不太有用。当你遇到更复杂的代码时，你需要一个更准确的心智模型来帮助你推理程序的真实行为。有很多这样的模型可供我们使用。详细描述它们会占用数章篇幅，超出本书范围，但大致可分为两类：高层模型和低层模型。高层模型适用于在生命周期和借用层面思考代码，低层模型则适用于推演不安全代码和裸指针。下面两节描述的变量模型足以应对本书大部分内容。\n\
  \n### 高层模型\n\n在高层模型中，我们不把变量视为保存字节的场所。相反，我们只将它们视为值在程序中实例化、移动和使用时赋予这些值的名称。当你向一个变量赋值时，该值从此就由该变量命名。当后续访问该变量时，你可以想象从该变量的前一次访问画一条线到新访问，这就在两次访问之间建立了依赖关系。如果变量中的值被移动，则不能再从它画出任何线。\n\
  \n在这个模型中，变量只在持有合法值时才存在；你无法从值未初始化或已被移动的变量画出线，因此它实际上并不存在。使用这个模型，你的整个程序由许多这样的依赖线组成，通常称为*流*（flow），每条流都追踪某个特定值实例的生命周期。当存在分支时，流可以分叉和汇合，每个分支都追踪该值的一个不同生命周期。编译器可以检查在程序的任何给定点，所有可以并行存在的流之间是否兼容。例如，不能有两条对某个值进行可变访问的并行流。也不能存在一条借用某个值的流，而同时没有一条拥有该值的流。清单\
  \ 2-2 展示了这两种情况的示例。\n\n```rust\nlet mut x;\n// 这种访问是非法的，因为无处可画流：\n// assert_eq!(x,\
  \ 42);\n❶ x = 42;\n    // 这没问题，可以从上面赋的值画一条流：\n❷ let y = &x;\n    // 这建立了来自 x 的第二条可变流：\n\
  ❸ x = 43;\n    // 这延续了来自 y 的流，而 y 又源自 x：\n❹ assert_eq!(*y, 42);\n```\n\n*清单 2-2：借用检查器会捕获的非法流*\n\
  \n首先，我们不能在 x 初始化之前使用它，因为我们无处画流。只有当我们向 x 赋值后，才能从它画出流。这段代码有两条流：一条是独占（`&mut`）流，从 ❶\
  \ 到 ❸；一条是共享（`&`）流，从 ❶ 经过 ❷ 到 ❹。借用检查器检查每条流的每个顶点，并检查是否存在其他不兼容的流并发存在。在这种情况下，当借用检查器检查\
  \ ❸ 处的独占流时，它会看到终止于 ❹ 的共享流。由于你不能同时对某个值进行独占使用和共享使用，借用检查器（正确地）拒绝了这段代码。注意，如果 ❹ 不存在，这段代码可以正常编译！共享流会在\
  \ ❷ 处终止，当在 ❸ 处检查独占流时，不存在冲突的流。\n\n如果声明了一个与之前同名的新变量，它们仍被视为不同的变量。这称为*遮蔽*（shadowing）——后面的变量通过相同的名称“遮蔽”了前面的变量。这两个变量共存，不过后续代码无法再命名先前的那个变量。这个模型大致对应于编译器（尤其是借用检查器）推演程序的方式，实际上也用于编译器内部以生成高效的代码。\n\
  \n### 低层模型\n\n变量为内存位置命名，这些位置可能持有合法值，也可能不持有。你可以将变量视为一个“值槽”。当你向其赋值时，槽被填满，其旧值（如果有的话）被丢弃并替换。当你访问它时，编译器会检查槽是否为空，因为为空意味着变量未初始化或其值已被移动。指向变量的指针引用该变量的后备内存，可以通过解引用来获取其值。例如，在语句\
  \ `let x: usize;` 中，变量 x 是一个\n\n\n栈上用于存放一个大小为 `usize` 的值的内存区域的名称，尽管它并没有一个定义明确的值（它的槽位是空的）。如果你为该变量赋值，例如使用\
  \ `x = 6`，那么这块内存区域随后就会存储表示值 6 的位。为 `x` 赋值时，`&x` 不会发生变化。如果你声明多个同名变量，它们最终仍会由不同的内存作为后备存储。这一模型与\
  \ C、C++ 以及许多其他底层语言所使用的内存模型相匹配，对于需要明确推理内存的场景很有用。\n\n> 在本例中，我们忽略 CPU 寄存器，并将其视为一种优化。实际上，如果某个变量不需要内存地址，编译器可能会使用寄存器为其提供存储，而不是使用一块内存区域。\n\
  \n你可能会发现，其中一种模型与你之前的模型更加吻合，但我强烈建议你尝试理解这两种模型。它们都同样有效，而且都是简化模型——任何有用的心智模型都必须如此。如果你能够从这两种视角来审视一段代码，就会发现分析复杂的代码片段、理解它们为何能够或不能编译，以及为何运行结果符合或不符合预期，会容易得多。\n\
  \n## 内存区域\n\n现在你已经掌握了我们如何引用内存，接下来需要讨论内存实际上是什么。内存有许多不同的区域，或许令人意外的是，并非所有区域都存储在计算机的\
  \ DRAM 中。你使用哪一部分内存，会对代码的编写方式产生重要影响。对于编写 Rust 代码而言，最重要的三个内存区域是栈、堆和静态内存。\n\n### 栈\n\
  \n栈是程序用于函数调用临时存储空间的一段内存。每次调用函数时，栈顶都会分配一块称为栈帧的连续内存。栈的底部附近是主函数的栈帧；当函数调用其他函数时，更多栈帧会被压入栈中。函数的栈帧包含该函数中的所有变量，以及函数接收的所有参数。当函数返回时，它的栈帧会被回收。\n\
  \n组成函数局部变量值的字节不会立即被清除，但访问它们并不安全，因为后续函数调用的栈帧可能与已回收的栈帧重叠，从而覆盖这些字节。即使它们尚未被覆盖，也可能包含不允许使用的值，例如函数返回时已经被移动的值。\n\
  \n栈帧，以及它们最终会消失这一关键事实，与 Rust 中的生命周期概念密切相关。存储在栈帧中的任何变量，在该栈帧消失后都无法访问，因此对它的任何引用，其生命周期最多只能与该栈帧的生命周期一样长。\n\
  \n### 堆\n\n*堆*是一块与程序当前调用栈无关的内存池。堆内存中的值会一直存在，直到被显式释放。当你希望某个值的存活时间超过当前函数栈帧的生命周期时，这一点非常有用。如果该值是函数的返回值，调用函数可以在自己的栈上留出一块空间，让被调用函数在返回前将该值写入其中。但如果你希望将该值发送给另一个线程，而当前线程与该线程可能完全没有共享的栈帧，就可以将它存储在堆上。\n\
  \n堆允许你显式分配连续的内存区域。这样做时，你会获得一个指向该内存区域起始位置的指针。在之后将其释放之前，这段内存都会为你保留；这个过程通常称为 *freeing*，名称源自\
  \ C 标准库中对应的函数。由于从堆中分配的内存在函数返回时不会消失，因此你可以在一个位置为某个值分配内存，将指向它的指针传递给另一个线程，然后让该线程安全地继续操作这个值。换句话说，当你在堆上分配内存时，所得指针的生命周期不受限制——它的生命周期有多长，取决于你的程序让它保持存活多久。\n\
  \n在 Rust 中，与堆交互的主要机制是 Box 类型。当你编写 `Box::new(value)` 时，`value` 会被放置在堆上，而你获得的返回值（`Box<T>`）是一个指向堆上该值的指针。当\
  \ Box 最终被丢弃时，这块内存就会被释放。\n\n如果你忘记释放堆内存，它就会永远存在，最终你的应用程序会耗尽计算机上的所有内存。这称为 *内存泄漏*，通常是你希望避免的情况。不过，有些情况下你确实希望显式泄漏内存。例如，假设你有一份整个程序都应能够访问的只读配置。你可以将它分配到堆上，并使用\
  \ `Box::leak` 显式泄漏它，从而获得指向它的 `'static` 引用。\n\n### 静态内存\n\n*静态内存*实际上是一个统称，指代程序编译到的文件中几个密切相关的区域。程序执行时，这些区域会自动加载到程序的内存中。静态内存中的值会在程序的整个执行期间存活。程序的静态内存包含程序的二进制代码，这些代码通常会被映射为只读。程序执行时，会在文本段中逐条执行二进制代码中的指令，并在调用函数时跳转到相应位置。静态内存还存储使用\
  \ `static` 关键字声明的变量所占用的内存，以及代码中的某些常量值，例如字符串。\n\n## 丢弃顺序\n\n当值离开作用域时，Rust 会自动丢弃这些值，例如清单\
  \ 2-3 中内层作用域里的 `x1` 和 `x2`。丢弃顺序的规则相当简单：变量（包括函数参数）按逆序丢弃，而嵌套值则按源代码中的顺序丢弃。\n\n这乍听起来可能有些奇怪——为什么会存在这种差异？不过，仔细观察后就会发现，这非常合理。假设你编写了一个函数，先声明一个字符串，然后将对该字符串的引用插入一个新的哈希表中。当函数返回时，必须先丢弃哈希表；如果先丢弃字符串，哈希表就会持有一个无效引用！一般来说，后声明的变量可能包含对先前值的引用，而由于\
  \ Rust 的生命周期规则，反过来的情况不可能发生。因此，Rust 按逆序丢弃变量。\n\n对于嵌套值，例如元组、数组或结构体中的值，我们本来也可以采用相同的行为，但这很可能会让用户感到意外。如果你构造了一个包含两个值的数组，那么最后一个元素先被丢弃似乎很奇怪。元组和结构体也是如此，最直观的行为是先丢弃元组的第一个元素或结构体的第一个字段，然后是第二个，依此类推。与变量不同，在这种情况下没有必要反转丢弃顺序，因为\
  \ Rust 目前不允许单个值中存在自引用。因此，Rust 选择了更符合直觉的方案。\n\n## 借用与生命周期\n\nRust 允许值的所有者通过引用将该值借给其他人，而不放弃所有权。引用是指针，同时附带了关于其使用方式的额外契约，例如该引用是否对被引用的值提供独占访问，或者被引用的值是否还可以被其他引用指向。\n\
  \n### 共享引用\n\n共享引用 `&T` 顾名思义，是一种可以被共享的指针。同一个值可以存在任意数量的其他引用，并且每个共享引用都实现了 `Copy`，因此你可以轻松地创建更多共享引用。共享引用背后的值不可变；你不能修改或重新赋值共享引用所指向的值，也不能将共享引用转换为可变引用。\n\
  \nRust 编译器可以假设，共享引用所指向的值在该引用存活期间不会发生变化。例如，如果 Rust 编译器发现某个函数多次读取共享引用背后的值，那么它完全可以只读取一次，然后重复使用该值。更具体地说，清单\
  \ 2-4 中的断言不应该失败。\n\n\n\n\n```rust\nfn cache(input: &i32, sum: &mut i32) {\n    *sum\
  \ = *input + *input;\n    assert_eq!(*sum, 2 * *input);\n}\n```\n\n*清单 2-4：Rust\
  \ 假定共享引用是不可变的。*\n\n编译器是否选择应用某个优化或多或少并不重要。编译器的启发式规则会随时间变化，因此你通常应该针对编译器被允许做什么来编写代码，而不是针对它在特定时刻的特定情况下实际做什么。\n\
  \n## 可变引用\n\n共享引用的替代方案是可变引用：`&mut T`。对于可变引用，Rust 编译器同样可以充分利用引用自带的约定：编译器假定没有任何其他线程访问目标值，无论是通过共享引用还是可变引用。换句话说，它假定可变引用是*独占的*。这带来了一些在其他语言中不易实现的巧妙优化。例如，以清单\
  \ 2-5 中的代码为例。\n\n```rust\nfn noalias(input: &i32, output: &mut i32) {\n    if *input\
  \ == 1 {\n❶       *output = 2;\n    }\n❷   if *input != 1 {\n        *output = 3;\n\
  \    }\n}\n```\n\n*清单 2-5：Rust 假定可变引用是独占的。*\n\n在 Rust 中，编译器可以假定 `input` 和 `output`\
  \ 不指向同一块内存。因此，在❶处对 `output` 的重新赋值不会影响❷处的检查，整个函数可以编译成一个单一的 `if-else` 块。如果编译器不能依赖独占可变性的约定，这种优化就是无效的，因为在类似\
  \ `noalias(&x, &mut x)` 的情况下，输入为 1 时可能会产生输出为 3 的结果。\n\n可变引用只允许你修改引用所指向的内存位置。你能否修改超出直接引用范围的值，取决于位于中间的类型所提供的方法。通过一个例子可能更容易理解，请看清单\
  \ 2-6。\n\n```rust\nlet x = 42;\nlet mut y = &x; // y is of type &i32\nlet z = &mut\
  \ y; // z is of type &mut &i32\n```\n\n*清单 2-6：可变性仅适用于直接引用的内存。*\n\n在这个示例中，你可以通过让指针引用不同的变量，将指针的值改为另一个值（也就是另一个指针），但你不能改变被指向的值（也就是\
  \ x 的值）。类似地，你可以通过 z 改变 y 的指针值，但你不能改变 z 本身来持有另一个不同的引用。\n\n拥有一个值和拥有对它的可变引用之间的主要区别在于，所有者负责在值不再需要时将其丢弃。除此之外，你可以通过可变引用做任何你拥有该值时可以做的事情，但有一个警告：如果你移动了可变引用后面的值，那么你必须留下另一个值来代替它。如果你不这么做，所有者仍然会认为它需要丢弃这个值，但那时已经没有值可供丢弃了！\n\
  \n清单 2-7 给出了你可以移动可变引用后面的值的几种方式的示例。\n\n```rust\nfn replace_with_84(s: &mut Box<i32>)\
  \ {\n    // this is not okay, as *s would be empty:\n❶   // let was = *s;\n    //\
  \ but this is:\n❷   let was = std::mem::take(s);\n    // so is this:\n❸   *s = was;\n\
  \    // we can exchange values behind &mut:\n    let mut r = Box::new(84);\n❹  \
  \ std::mem::swap(s, &mut r);\n    assert_ne!(*r, 84);\n❺ }\nlet mut s = Box::new(42);\n\
  replace_with_84(&mut s);\n```\n\n*清单 2-7：通过可变引用访问后必须留下一个值。*\n\n我加入了一些注释行，它们表示非法操作。你不能直接移动出值❶，因为调用者仍然认为自己拥有该值，并会在❺处再次释放它，从而导致双重释放。如果你只是想在后面留下一个有效的值，`std::mem::take`\
  \ ❷ 是一个不错的选择。它等价于 `std::mem::replace(&mut value, Default::default())`；它把 `value`\
  \ 从可变引用后面移出，但会在原位置留下一个新的、该类型的默认值。这个默认值是一个独立的、被拥有的值，因此调用者在❺处作用域结束时丢弃它是安全的。\n\n或者，如果你不需要引用后面的旧值，你可以用一个你已经拥有的值❸覆盖它，留给调用者稍后丢弃该值。当你这样做时，原本位于可变引用后面的值会立即被丢弃。\n\
  \n最后，如果你有两个可变引用，你可以在不拥有其中任何一个的情况下交换它们的值❹，因为两个引用最终都会得到一个合法的被拥有的值，供其所有者最终释放。\n\n##\
  \ 内部可变性\n\n有些类型提供*内部可变性*，这意味着它们允许你通过共享引用修改一个值。这些类型通常依赖额外的机制（如原子 CPU 指令）或不变量来提供安全可变性，而不依赖独占引用的语义。它们通常分为两类：一类允许你通过共享引用获得可变引用，另一类只允许你通过共享引用直接修改值。\n\
  \n第一类包括 `Mutex` 和 `RefCell` 等类型，它们包含安全机制，确保对于它们给出可变引用的任何值，同一时间只能存在一个可变引用（且不能存在共享引用）。在底层，这些类型（以及类似类型）都依赖于一个叫做\
  \ `UnsafeCell` 的类型，这个名字应该立刻让你对使用它产生犹豫。我们将在第 10 章更详细地介绍 `UnsafeCell`，但现在你应该知道，它是通过共享引用进行修改的*唯一*正确方式。\n\
  \n提供内部可变性的其他类型类别是那些不给出内部值的可变引用，而只是提供给你就地操作该值的方法的类型。`std::sync::atomic` 中的原子整数类型和\
  \ `std::cell::Cell` 类型属于这一类。你无法直接获得这类类型背后的 `usize` 或 `i32` 的引用，但你可以在给定时间点读取和替换它的值。\n\
  \n> **注意**\n> 标准库中的 `Cell` 类型是通过不变量实现安全内部可变性的一个有趣例子。它不能跨线程共享，也从不给出对 `Cell` 中所包含值的引用。相反，所有方法要么完全替换该值，要么返回所包含值的副本。由于对内部值不存在任何引用，因此移动它总是可以的。而且由于\
  \ `Cell` 不能跨线程共享，即使修改是通过共享引用进行的，内部值也永远不会被并发修改。\n\n## 生命周期\n\n如果你正在读这本书，你可能已经对生命周期的概念有所熟悉，很可能是通过编译器反复提示的违反生命周期规则的警告。这种程度的理解对于你将编写的大部分\
  \ Rust 代码来说已经够用，但随着我们深入 Rust 更复杂的部分，你需要一个更严谨的心智模型来工作。\n\n较新的 Rust 开发者常常被教导将生命周期视为与作用域相对应：生命周期在你取得对某个变量的引用时开始，在该变量被移动或超出作用域时结束。这通常是正确的，也通常很有用，但实际情况要稍微复杂一些。*生命周期*实际上是某个引用必须在其中有效的代码区域的一个名称。虽然生命周期经常与作用域重合，但并非必须如此，我们将在本节后面看到这一点。\n\
  \n## 生命周期与借用检查器\n\nRust 生命周期的核心是借用检查器。每当使用一个带有某个生命周期 `'a` 的引用时，借用检查器都会检查 `'a` 是否仍然存活。它通过从使用点回溯到\
  \ `'a` 开始的地方（即引用被取得的地方）来做到这一点，并检查该路径上是否存在冲突的使用。这确保了引用仍然指向一个可以安全访问的值。这类似于我们本章前面讨论的高层“数据流”心智模型；编译器会检查我们正在访问的引用的流是否与任何其他并行流冲突。\n\
  \n清单 2-8 展示了一个简单的代码示例，其中包含对 `x` 引用的生命周期标注。\n\n```rust\nlet mut x = Box::new(42);\n\
  ① let r = &x;          // 'a\nif rand() > 0.5 {\n②   *x = 84;\n} else {\n③   println!(\"\
  {}\", r);  // 'a\n④ }\n```\n\n*清单 2-8：生命周期不需要是连续的。*\n\n生命周期在①处我们取得对 `x` 的引用时开始。在第一个分支②中，我们立即尝试通过将其值改为\
  \ 84 来修改 `x`，这需要一个 `&mut x`。借用检查器取得对 `x` 的可变引用，并立即检查其使用情况。它在引用取得和使用之间没有发现冲突的使用，因此接受这段代码。如果你习惯于将生命周期视为作用域，这可能会让你感到惊讶，因为\
  \ `r` 在②处仍然在作用域内（它在③处才超出作用域）。但借用检查器足够聪明，能够意识到如果走这个分支，`r` 之后永远不会被使用，因此在这里对 `x` 进行可变访问是没问题的。或者换个说法，①处创建的生命周期并没有延伸到这个分支中：从\
  \ `r` 出发的流没有超过②，因此不存在冲突的流。借用检查器随后在③处的打印语句中发现了 `r` 的使用。它回溯到①，发现没有冲突的使用（②不在这条路径上），因此它也接受这次使用。\n\
  \n如果我们再在清单 2-8 的④处添加一次对 `r` 的使用，代码将无法编译。生命周期 `'a` 将会从①一直持续到④（`r` 的最后一次使用），当借用检查器检查我们对\
  \ `r` 的新使用时，它会在②处发现冲突的使用。\n\n生命周期可能会变得相当复杂。在清单 2-9 中，你可以看到一个带有空洞的生命周期示例，它在开始和最终结束之间会间歇性地无效。\n\
  \n```rust\nlet mut x = Box::new(42);\n① let mut z = &x;      // 'a\nfor i in 0..100\
  \ {\n```\n\n\n\n\n\n```\n2   println!(\"{}\", z);      // 'a\n3   x = Box::new(i);\n\
  4   z = &x;                  // 'a\n}\nprintln!(\"{}\", z);          // 'a\n```\n\
  \n清单 2-9：生命周期可以存在空洞。\n\n生命周期在①处开始，此时我们获取了对 `x` 的引用。接着，我们在③处将 `x` 移出，这会结束生命周期 `'a`，因为它已经不再有效。借用检查器通过将\
  \ `'a` 视为在②处结束来接受这次移动，因为这样在③处就不会存在从 `x` 流出的冲突。然后，我们通过在④处更新 `z` 中的引用来重新开始生命周期。无论代码此时是循环回到②，还是继续执行最后的打印语句，这两种使用方式现在都有一个有效值可供流出，并且不存在冲突流，因此借用检查器接受这段代码！\n\
  \n同样，这与我们之前讨论的内存数据流模型完全一致。当 `x` 被移动时，`z` 就停止存在。稍后我们重新赋值给 `z` 时，实际上创建了一个全新的变量，它只从那一刻起存在。基于这个模型，这个例子并不奇怪。\n\
  \n## 泛型生命周期\n\n有时，你需要在自定义类型中存储引用。这些引用需要具有生命周期，这样借用检查器才能在它们被该类型的各种方法使用时检查其有效性。如果你希望类型中的某个方法返回一个生命周期长于对\
  \ `self` 的引用的引用，这一点尤其重要。\n\nRust 允许你让类型定义对一个或多个生命周期参数具有泛型性，就像允许你让类型定义对类型参数具有泛型性一样。Steve\
  \ Klabnik 和 Carol Nichols 所著的《Rust 程序设计语言》（No Starch Press，2018 年）较为详细地介绍了这一主题，因此我不会在这里重复基础内容。不过，当你编写更复杂的此类类型时，需要注意这类类型与生命周期交互时的两个细节。\n\
  \n首先，如果你的类型还实现了 `Drop`，那么丢弃该类型会被视为使用了类型所泛型化的任何生命周期或类型。实际上，当你的类型的一个实例被丢弃时，借用检查器会在丢弃它之前检查：使用该类型的任意泛型生命周期是否仍然合法。如果你的丢弃代码确实使用了其中某些引用，这是必需的。如果你的类型没有实现\
  \ `Drop`，丢弃该类型就不算作一次使用；只要之后不再使用这些引用，用户就可以自由地使存储在类型中的引用失效，就像清单 2-7 中看到的那样。我们将在第 10\
  \ 章进一步讨论与丢弃相关的这些规则。\n\n其次，虽然一个类型可以对多个生命周期参数具有泛型性，但这样做往往只会给类型签名带来不必要的复杂性。通常，让一个类型对单个生命周期参数具有泛型性就足够了；对于插入该类型中的任何引用，编译器会将这个生命周期解析为这些引用生命周期中较短的那个。只有当一个类型包含多个引用，并且其方法返回的引用应当只与其中某一个引用的生命周期绑定时，你才真正需要使用多个泛型生命周期参数。\n\
  \n请考虑清单 2-10 中的类型，它为你提供了一个迭代器，用于遍历由某个特定字符串分隔的字符串片段。\n\n```\nstruct StrSplit<'s,\
  \ 'p> {\n    delimiter: &'p str,\n    document: &'s str,\n}\nimpl<'s, 'p> Iterator\
  \ for StrSplit<'s, 'p> {\n    type Output = &'s str;\n    fn next(&self) -> Option<Self::Output>\
  \ {\n        todo!()\n    }\n}\nfn str_before(s: &str, c: char) -> Option<&str>\
  \ {\n    StrSplit { document: s, delimiter: &c.to_string() }.next()\n}\n```\n\n\
  清单 2-10：需要对多个生命周期参数具有泛型性的类型\n\n构造这种类型时，你必须提供要搜索的分隔符和文档，这两者都是对字符串值的引用。当你请求下一个字符串时，会得到一个指向文档内部的引用。请考虑一下，如果在这个类型中使用单个生命周期，会发生什么。迭代器生成的值将同时与文档和分隔符的生命周期绑定。这会使\
  \ `str_before` 无法编写：返回类型将带有一个与函数内部局部变量相关联的生命周期——也就是 `to_string` 生成的 `String`——而借用检查器会拒绝这段代码。\n\
  \n## 生命周期方差\n\n方差是程序员经常接触、却很少知道其名称的概念，因为它大多是不可见的。乍看之下，方差描述了哪些类型是其他类型的子类型，以及何时可以用子类型代替超类型（反之亦然）。一般来说，如果类型\
  \ A 至少和类型 B 一样有用，那么 A 就是 B 的子类型。方差解释了为什么在 Java 中，如果 `Turtle` 是 `Animal` 的子类型，就可以将\
  \ `Turtle` 传递给接受 `Animal` 的函数；也解释了为什么在 Rust 中，可以将 `&'static str` 传递给接受 `&'a str`\
  \ 的函数。\n\n虽然方差通常隐藏在幕后，但它出现得足够频繁，以至于我们需要掌握其基本知识。`Turtle` 是 `Animal` 的子类型，因为 `Turtle`\
  \ 比某个未指定的 `Animal` 更“有用”——`Turtle` 能做 `Animal` 能做的一切，而且很可能还能做更多。同样，`'static` 是 `'a`\
  \ 的子类型，因为 `'static` 的存活时间至少和任意 `'a` 一样长，因此更有用。或者更一般地说，如果 `'b: 'a`（`'b` 的生命周期长于 `'a`），那么\
  \ `'b` 就是 `'a` 的子类型。这显然不是形式化定义，但已经足够接近，具有实际应用价值。\n\n所有类型都有方差，它定义了哪些其他相似类型可以替代该类型。方差有三种：协变、不变和逆变。如果可以直接用子类型替代某个类型，那么该类型就是协变的。例如，如果一个变量的类型是\
  \ `&'a T`，你可以向它提供类型为 `&'static T` 的值，因为 `&'a T` 关于 `'a` 是协变的。`&'a T` 关于 `T` 也是协变的，因此你可以将\
  \ `Vec<&'static str>` 传递给接受 `&Vec<&'a str>` 的函数。\n\n有些类型是不变的，这意味着你必须提供完全相同的类型。`&mut\
  \ T` 就是一个例子——如果某个函数接受 `&mut Vec<&'a str>`，你就不能向它传递 `&mut Vec<&'static str>`。也就是说，`&mut\
  \ T` 关于 `T` 是不变的。如果允许这样做，该函数就可以将一个生命周期较短的字符串放入 `Vec`，而调用者会继续使用这个 `Vec`，并认为它的类型是\
  \ `Vec<&'static str>`，从而错误地认为其中的字符串是 `'static` 的！任何提供可变性的类型通常出于同样的原因而是不变的，例如，`Cell<T>`\
  \ 关于 `T` 就是不变的。\n\n最后一种类别是逆变，它会出现在函数参数中。如果函数参数可以是“不那么有用”的类型，函数类型就会更有用。当你对比参数类型本身的方差与它们作为函数参数时的方差，这一点会更清楚：\n\
  \n```\nlet x: &'static str; // 更有用，存活时间更长\nlet x: &'a str; // 不那么有用，存活时间更短\n\nfn\
  \ take_func1(&'static str) // 限制更严格，因此不那么有用\nfn take_func2(&'a str) // 限制不那么严格，因此更有用\n\
  ```\n\n这种关系发生了反转，说明 `Fn(T)` 关于 `T` 是逆变的。\n\n那么，为什么学习生命周期时还需要了解方差？当你考虑泛型生命周期参数如何与借用检查器交互时，方差就变得相关了。请考虑清单\
  \ 2-11 所示的类型，它在单个字段中使用了多个生命周期。\n\n```\nstruct MutStr<'a, 'b> {\n    s: &'a mut &'b\
  \ str\n}\nlet mut s = \"hello\";\n① *MutStr { s: &mut s }.s = \"world\";\nprintln!(\"\
  {}\", s);\n```\n\n清单 2-11：需要对多个生命周期参数具有泛型性的类型\n\n乍看之下，这里的两个生命周期似乎没有必要——我们没有任何方法需要像清单\
  \ 2-10 中的 `StrSplit` 那样区分结构不同部分的借用。但如果你将这里的两个生命周期替换为单个 `'a`，代码就无法再编译！这一切都是由方差导致的。\n\
  \n在①处，编译器必须确定生命周期参数应当被设置为何值。如果有两个生命周期，`'a` 会被设置为对 `s` 的借用的待确定生命周期，而 `'b` 会被设置为 `'static`，因为所提供字符串\
  \ `\"hello\"` 的生命周期就是 `'static`。如果只有一个生命周期 `'a`，编译器就会推断出该生命周期必须是 `'static`。\n\n\n\
  \n\n\n当我们之后尝试通过共享引用来访问字符串引用 s 以打印它时，编译器会尝试缩短 MutStr 所使用的 s 的可变借用，以允许对 s 的共享借用。\n\
  \n在双生命周期的情况下，'a 恰好会在 println 之前结束，而 'b 保持不变。另一方面，在单生命周期的情况下，我们遇到了问题。编译器想要缩短对 s 的借用，但要做到这一点，它还必须缩短对\
  \ str 的借用。虽然 &'static str 通常可以缩短为任意 &'a str（&'a T 在 'a 上是协变的），但这里它位于 &mut T 之后，而\
  \ &mut T 在 T 上是不变的。不变性要求相关类型永远不会被子类型或超类型替换，因此编译器缩短借用的尝试失败了，并报告该列表仍被可变借用。哎！\n\n由于不变性带来的灵活性降低，你希望确保你的类型在尽可能多的泛型参数上保持协变（或在适当情况下保持逆变）。如果这需要引入额外的生命周期参数，你需要仔细权衡增加另一个参数的认知成本与不变性的易用性成本。\n\
  \n## 总结\n\n本章的目标是建立一个坚实的、共同的基础，以便在接下来的章节中继续构建。到现在为止，我希望你觉得你已经牢牢掌握了 Rust 的内存和所有权模型，并且那些你可能从借用检查器那里得到的错误看起来不那么神秘了。你可能已经了解了我们在这里涵盖的部分内容，但希望本章能让你更全面地了解这些内容是如何组合在一起的。在下一章中，我们将对类型做类似的事情。我们将回顾类型如何在内存中表示，了解泛型和\
  \ trait 如何生成运行代码，并查看 Rust 为更高级用例提供的一些特殊类型和 trait 构造。\n"
- "# 3 类型\n\n## 类型\n\n![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_22_0.png)\n\n现在基础已经讲完了，我们将看看\
  \ Rust 的类型系统。我们将跳过 *《Rust 编程语言》* 中介绍的基础知识，而是直接深入探讨不同类型如何在内存中布局、trait 和 trait 约束的方方面面、存在类型，以及跨\
  \ crate 边界使用类型的规则。\n\n## 内存中的类型\n\n每个 Rust 值都有一个类型。类型在 Rust 中有许多用途，我们将在本章中看到，但它们最基本的角色之一是告诉你如何解释内存中的位。例如，位序列\
  \ 0b10111101（用十六进制表示法写成 0xBD）本身没有任何意义，直到你给它分配一个类型。当在 u8 类型下解释时，该位序列是数字 189。当在 i8\
  \ 类型下解释时，它是 −67。当你定义自己的类型时，编译器的工作是确定所定义类型的每个部分在该类型的内存表示中的位置。你的 struct 的每个字段出现在位序列的哪个位置？你的\
  \ enum 的判别式存储在哪里？当你开始编写更高级的 Rust 代码时，理解这个过程是如何工作的很重要，因为这些细节既影响代码的正确性，也影响性能。\n\n\
  ### 对齐\n\n在我们讨论类型的内存表示如何确定之前，我们首先需要讨论对齐的概念，它决定了类型的字节可以存储在哪里。一旦类型的表示被确定，你可能会认为你可以取任意的内存位置，并将存储在那里的字节解释为该类型。虽然这在理论上是正确的，但在实践中，硬件也限制了给定类型的放置位置。最明显的例子是指针指向字节，而不是位。如果你将类型\
  \ T 的值放在计算机内存的第 4 位开始，你将无法引用它的位置；你只能创建指向字节 0 或字节 1（第 8 位）的指针。因此，所有值，无论其类型如何，都必须从字节边界开始。我们说所有值至少必须是字节对齐的——它们必须被放置在一个是\
  \ 8 的倍数的地址上。\n\n某些值比字节对齐有更严格的规则。在 CPU 和内存系统中，内存通常以大于单个字节的块进行访问。例如，在 64 位 CPU 上，大多数值以\
  \ 8 字节（64 位）的块访问，每次操作从 8 字节对齐的地址开始。这被称为 CPU 的字长。然后 CPU 使用一些技巧来处理更小值的读写，或跨越这些块边界的值。\n\
  \n在可能的情况下，你希望确保硬件能够以其“原生”对齐方式运行。要了解原因，请考虑如果尝试读取一个从 8 字节块中间开始的 i64（也就是说，指向它的指针不是\
  \ 8 字节对齐的）会发生什么。硬件将不得不进行两次读取——一次从第一个块的后半部分读取以到达 i64 的起始位置，另一次从第二个块的前半部分读取 i64 的其余部分——然后将结果拼接在一起。这不是很高效。由于该操作分散在对底层内存的多次访问中，如果你正在读取的内存被另一个线程并发写入，你最终可能会得到奇怪的结果。你可能会在另一个线程写入之前读取前\
  \ 4 个字节，在写入之后读取后 4 个字节，从而导致值损坏。\n\n对未对齐数据的操作被称为未对齐访问，可能导致性能不佳和严重的并发问题。因此，许多 CPU\
  \ 操作要求或强烈倾向于其参数自然对齐。自然对齐的值是其对齐方式与其大小匹配的值。例如，对于 8 字节加载，提供的地址需要是 8 字节对齐的。\n\n由于对齐访问通常更快，并提供更强的一致性语义，编译器会尽可能利用它们。它通过为每个类型赋予一个基于其包含的类型计算的对齐方式来实现这一点。内置值通常与其大小对齐，所以\
  \ u8 是字节对齐，u16 是 2 字节对齐，u32 是 4 字节对齐，u64 是 8 字节对齐。复杂类型——包含其他类型的类型——通常被分配为其包含的任何类型中最大的对齐方式。例如，包含\
  \ u8、u16 和 u32 的类型将是 4 字节对齐的，因为 u32 的存在。\n\n### 布局\n\n既然你已经了解了对齐，我们可以探讨编译器如何决定类型的内存表示，即布局。默认情况下，正如你很快会看到的，Rust\
  \ 编译器对如何布局类型给出的保证很少，这使得它成为理解底层原理的一个不好的起点。幸运的是，Rust 提供了一个 repr 属性，你可以将其添加到类型定义中，以请求该类型的特定内存表示。如果你能看到的话，你将看到的最常见的\
  \ repr 是 repr(C)。顾名思义，它以与 C 或 C++ 编译器布局相同类型的方式兼容的方式来布局该类型。这在编写使用外部函数接口与其他语言交互的 Rust\
  \ 代码时很有帮助，我们将在第 12 章中讨论，因为 Rust 将生成与其他语言编译器期望匹配的布局。由于 C 布局是可预测的且不会改变，repr(C) 在 unsafe\
  \ 上下文中也很有用，如果你正在使用指向该类型的原始指针，或者如果你需要在你知道具有相同字段的两个不同类型之间进行转换。当然，它也是我们迈出布局算法第一步的完美选择。\n\
  \n> 另一种有用的表示是 repr(transparent)，它只能用于具有单个字段的类型，并保证外部类型的布局与内部类型的布局完全相同。这与“newtype”模式结合使用时很方便，在\
  \ newtype 模式中，你可能希望以相同的方式操作某个 struct A 和 struct NewA(A) 的内存表示。如果没有 repr(transparent)，Rust\
  \ 编译器不保证它们具有相同的布局。\n\n那么，让我们看看编译器如何使用 repr(C) 布局一个特定类型：清单 3-1 中的 Foo 类型。你认为编译器会如何在内存中布局它？\n\
  \n```\n#[repr(C)]\nstruct Foo {\n    tiny: bool,\n    normal: u32,\n    small: u8,\n\
  \    long: u64,\n    short: u16,\n}\n```\n\n清单 3-1：对齐影响布局。\n\n\n\n\n\n首先编译器看到字段\
  \ `tiny`，其逻辑大小为 1 位（true 或 false）。但由于 CPU 和内存以字节为单位操作，`tiny` 在内存表示中被分配了 1 个字节。接下来，`normal`\
  \ 是一个 4 字节类型，因此我们希望它 4 字节对齐。但即使 `Foo` 是对齐的，分配给 `tiny` 的 1 个字节也会使 `normal` 错过其对齐。为了纠正这一点，编译器在内存表示中在\
  \ `tiny` 和 `normal` 之间插入 3 个字节的 *填充*——填充字节的值是不确定的，在用户代码中会被忽略。填充中没有值，但它确实占用空间。\n\n\
  对于下一个字段 `small`，对齐很简单：它是一个 1 字节值，结构体中当前字节偏移量为 1 + 3 + 4 = 8。这已经是字节对齐的，因此 `small`\
  \ 可以紧跟在 `normal` 之后。对于 `long` 我们又遇到问题了。我们现在已经在 `Foo` 中使用了 1 + 3 + 4 + 1 = 9 个字节。如果\
  \ `Foo` 是对齐的，那么 `long` 就不会像我们希望的那样 8 字节对齐，因此我们必须再插入 7 个字节的填充以使 `long` 再次对齐。这也恰好确保了最后一个字段\
  \ `short` 所需的 2 字节对齐，总计达到 26 字节。现在我们已经遍历了所有字段，还需要确定 `Foo` 本身的对齐方式。这里的规则是使用 `Foo`\
  \ 的所有字段中最大的对齐方式，由于 `long` 的存在，这将是 8 字节。因此，为了确保 `Foo` 在放置在例如数组中时仍然对齐，编译器随后添加最后 6\
  \ 个字节的填充，使 `Foo` 的大小为其对齐方式的倍数，达到 32 字节。\n\n现在我们准备抛弃 C 的遗留问题，考虑如果我们在列表 3-1 中不使用 `repr(C)`，布局会发生什么。C\
  \ 表示的主要限制之一是要求我们按原始结构体定义中出现的相同顺序放置所有字段。默认的 Rust 表示 `repr(Rust)` 去除了这一限制，同时去除了一些较小的限制，例如对于恰好具有相同字段的类型，字段顺序是确定的。也就是说，即使两个不同的类型共享完全相同的字段、类型相同、顺序相同，使用默认的\
  \ Rust 布局时也不能保证它们的布局相同！\n\n由于我们现在可以重新排序字段，我们可以将它们按大小递减的顺序放置。这意味着我们不再需要在 `Foo` 的字段之间使用填充；字段本身用于实现必要的对齐！`Foo`\
  \ 现在只是其字段的大小之和：只有 16 字节。这就是 Rust 默认情况下对类型在内存中的布局没有给出太多保证的原因之一：通过给编译器更大的重新排列的自由度，我们可以生成更高效的代码。\n\
  \n事实证明，还有第三种布局类型的方法，那就是告诉编译器我们不希望字段之间有任何填充。在这样做时，我们表示愿意承受使用未对齐访问带来的性能损失。这种行为最常见的用例是当每增加一个字节的内存影响都能感受到时，例如如果你有大量该类型的实例，如果内存非常有限，或者如果你将内存表示通过网络连接等低带宽介质发送。要选择此行为，你可以为类型添加注释\
  \ `#[repr(packed)]`。请记住，这可能导致代码运行速度大幅变慢，在极端情况下，如果你尝试执行 CPU 仅在对齐参数上支持的操作，这可能会导致程序崩溃。\n\
  \n有时，你希望给某个特定字段或类型提供比其技术上所需更大的对齐方式。你可以使用属性 `#[repr(align(n))]` 来做到这一点。这种行为的一个常见用例是确保在内存中连续存储的不同值（如数组中）最终位于\
  \ CPU 上的不同缓存行中。这样，你就可以避免 *伪共享*，伪共享可能导致并发程序中巨大的性能下降。伪共享发生在两个不同的 CPU 访问不同的值时，这些值恰好共享一个缓存行；虽然它们理论上可以并行操作，但它们最终都会争夺更新缓存中的同一个条目。我们将在第\
  \ 11 章更详细地讨论并发。\n\n## 复杂类型\n\n你可能好奇编译器如何在内存中表示其他 Rust 类型。这里有一个快速参考：\n\n- **元组**\
  \ 表示为与元组值类型相同且顺序相同的字段的结构体。\n- **数组** 表示为包含类型的连续序列，元素之间没有填充。\n- **联合** 每个变体的布局独立选择。对齐是所有变体中的最大值。\n\
  - **枚举** 与联合相同，但带有一个额外的隐藏共享字段来存储枚举变体判别式。判别式是代码用来确定给定值持有哪个枚举变体的值。判别式字段的大小取决于变体的数量。\n\
  \n## 动态大小类型和胖指针\n\n你可能在 Rust 文档的各种角落以及错误信息中遇到过标记 trait Sized。通常，它出现是因为编译器希望你提供一个\
  \ Sized 类型，但你（显然）没有提供。Rust 中大多数类型会自动实现 Sized——也就是说，它们在编译时大小已知——但有两个常见类型没有实现：trait\
  \ 对象和切片。如果你有例如 `dyn Iterator` 或 `[u8]`，它们没有明确定义的大小。它们的大小取决于只有程序运行时才知道的信息，而不是编译时，这就是为什么它们被称为\
  \ *动态大小类型 (DSTs)*。没有人能提前知道你的函数收到的 `dyn Iterator` 是这个 200 字节的结构体还是那个 8 字节的结构体。这带来了一个问题：编译器经常必须知道某个事物的大小才能生成有效代码，例如为类型为\
  \ `(i32, dyn Iterator, [u8], i32)` 的元组分配多少空间，或如果你的代码尝试访问第四个字段时使用什么偏移量。但如果类型不是 Sized，则该信息不可用。\n\
  \n编译器几乎在所有地方都要求类型为 Sized。结构体字段、函数参数、返回值、变量类型和数组类型都必须为 Sized。这一限制如此常见，以至于你编写的每个类型边界都包含\
  \ T: Sized，除非你明确使用 T: ?Sized 退出（? 表示“可能不是”）。但如果你有一个 DST 并且想对它做一些事情，例如真的希望你的函数接受\
  \ trait 对象或切片作为参数，这就没什么帮助了。\n\n解决办法是将其放在胖指针后面。胖指针就像普通指针一样，但它包含一个额外的字长字段，提供编译器生成处理该指针的合理代码所需的那部分关于该指针的额外信息。当你对\
  \ DST 取引用时，编译器会自动为你构造一个胖指针。对于切片，额外信息只是切片的长度。对于 trait 对象——嗯，我们稍后再说。并且至关重要的是，该胖指针是\
  \ Sized。具体来说，它是 usize 两倍大小（目标平台上字长）：一个 usize 用于保存指针，一个 usize 用于保存“完成”该类型所需的信息。\n\
  \n> NOTE Box 和 Arc 也支持存储胖指针，这就是为什么它们都支持 T: ?Sized。\n\n## Traits 和 Trait Bounds\n\
  \nTraits 是 Rust 类型系统的关键部分——它们是使类型能够相互协作的胶水，即使它们在定义时彼此不知道。Rust 编程语言很好地介绍了如何定义和使用\
  \ traits，所以我在这里不会重复。相反，我们将看看 traits 的一些更技术性的方面：它们是如何实现的，你必须遵守的限制，以及 traits 的一些更晦涩的使用。\n\
  \n## 编译和分发\n\n到现在为止，你可能已经在 Rust 中编写了相当多的通用代码。你在类型和方法上使用了泛型类型参数，也许还使用了几个 trait bounds。但你有没有想过当你编译泛型代码时会发生什么，或者当你在\
  \ dyn Trait 上调用 trait 方法时会发生什么？\n\n当你编写一个关于 T 的泛型类型或函数时，你实际上是在告诉编译器为你提供的每种类型 T 制作该类型或函数的副本。当你构造一个\
  \ Vec<i32> 或一个 HashMap<String, bool> 时，编译器本质上会复制粘贴泛型类型及其所有实现块，并用你提供的具体类型替换每个泛型参数的每个实例。它会制作一个完整的\
  \ Vec 类型副本，其中所有 T 都被替换为 i32，并制作一个完整的 HashMap 类型副本，其中所有 K 都被替换为 String，所有 V 都被替换为\
  \ bool。\n\n> NOTE 实际上，编译器并没有真正进行完整的复制粘贴。它只复制你使用的代码部分，因此如果你从未在 Vec<i32> 上调用 find，则\
  \ find 的代码不会被复制和编译。\n\n\n\n\n\n## 非泛型内部函数\n\n通常，泛型方法中的大量代码并不依赖于类型。例如，考虑 `HashMap::insert`\
  \ 的实现。计算所提供键的哈希值的代码取决于映射的键类型，但遍历映射的桶以找到插入点的代码可能并不依赖。 在这种情况下，更高效的做法是跨单态化共享非泛型部分的方法生成的机器代码，而仅在确实需要时生成不同的副本。\n\
  \n对于这种情况，你可以使用的一种模式是在泛型方法内部声明一个非泛型辅助函数来执行共享操作。这样就只剩下类型相关的代码需要编译器为你复制粘贴，同时允许辅助函数被共享。\n\
  \n将函数设为内部函数还有一个额外的好处，那就是不会用单一用途的函数污染你的模块。你也可以在方法外部声明这样的辅助函数；只是要小心不要将其设为泛型 `impl`\
  \ 块下的一个方法，因为那样它仍然会被单态化。\n\n静态分派的替代方案是 *动态分派*，它使代码能够在不知道该类型的情况下调用泛型类型上的 trait 方法。我之前说过，我们在清单\
  \ 3-2 中需要方法的多个实例的原因是，否则你的程序就不知道要跳转到哪个地址去调用给定模式上的 trait 方法 `is_contained_in`。好吧，使用动态分派，调用者只需告诉你即可。如果你用\
  \ `&dyn Pattern` 替换 `impl Pattern`，你就告诉调用者他们必须为此参数提供两条信息：模式的地址和 `is_contained_in`\
  \ 方法的地址。实际上，调用者给我们一个指向称为虚方法表，或 vtable 的内存块的指针，该表保存了所讨论类型的 trait 所有方法的实现地址，其中之一就是\
  \ `is_contained_in`。当方法内部的代码想要在提供的模式上调用 trait 方法时，它会在 vtable 中查找该模式的 `is_contained_in`\
  \ 实现的地址，然后调用该地址处的函数。这使我们能够无论调用者想要使用什么类型，都使用相同的函数体。\n\nNOTE 每个 vtable 还包含有关具体类型布局和对齐的信息，因为这些信息在使用类型时始终是必需的。如果你想看一个显式\
  \ vtable 的例子，可以看看 `std::task::RawWakerVTable` 类型。\n\n你会注意到，当我们使用 `dyn` 关键字选择动态分派时，我们必须在它前面加上一个\
  \ `&`。原因是我们不再能在编译时知道调用者传入的 pattern 类型的大小，因此我们不知道要为其预留多少空间。换句话说，`dyn Trait` 是\n\n\
  !Sized，其中 `!` 表示不是。为了使其成为 Sized 以便我们可以将其作为参数传递，我们将其放在指针后面（我们知道其大小）。由于我们还需要传递方法地址表，这个指针就变成了一个胖指针，其中额外的字保存指向\
  \ vtable 的指针。你可以使用任何能够容纳胖指针的类型来进行动态分派，例如 `&mut`、`Box` 和 `Arc`。清单 3-3 显示了清单 3-2 的动态分派等价物。\n\
  \n```\nimpl String {\n    pub fn contains(&self, p: &dyn Pattern) -> bool {\n  \
  \      p.is_contained_in(&*self)\n    }\n}\n```\n\n清单 3-3：使用动态分派的泛型方法\n\n实现 trait\
  \ 的类型与其 vtable 的组合被称为 trait 对象。大多数 trait 都可以转换为 trait 对象，但并非全部。例如，`Clone` trait，其\
  \ `clone` 方法返回 `Self`，就不能转换为 trait 对象。如果我们接受一个 `dyn Clone` trait 对象然后在其上调用 `clone`，编译器就不知道要返回什么类型。或者，考虑标准库中的\
  \ `Extend` trait，它有一个 `extend` 方法，该方法对提供的迭代器的类型是泛型的（因此可能存在多个实例）。如果你要调用一个接受 `dyn\
  \ Extend` 的方法，就没有单一的地址可以放在 trait 对象的 vtable 中的 `extend`；对于 `extend` 可能被调用的每种类型都必须有一个条目。这些就是不是对象安全的\
  \ trait，因此不能转换为 trait 对象的例子。为了成为对象安全，trait 的任何方法都不能是泛型的或使用 `Self` 类型。此外，trait 不能有任何静态方法（即第一个参数不解引用为\
  \ `Self` 的方法），因为不可能知道要调用该方法的哪个实例。例如，`FromIterator::from_iter(&[0])` 应该执行什么代码就不清楚了。\n\
  \n当阅读有关 trait 对象的资料时，你可能会看到提到 trait bound `Self: Sized`。这样的 bound 意味着 `Self` 并不是通过\
  \ trait 对象使用（因为它将是 `!Sized`）。你可以在 trait 上放置该 bound 以要求该 trait 永不使用动态分派，或者可以在特定方法上放置它以使该方法在通过\
  \ trait 对象访问 trait 时不可用。带有 `where Self: Sized` bound 的方法在检查 trait 是否对象安全时会被豁免。\n\
  \n动态分派可以缩短编译时间，因为不再需要编译类型和方法的多个副本，并且可以提高 CPU 指令缓存的效率。然而，它也阻止编译器针对使用的特定类型进行优化。使用动态分派时，编译器对清单\
  \ 3-2 中的 `find` 所能做的只是通过 vtable 插入对函数的调用——它无法再进行任何额外的优化，因为它不知道函数调用另一侧的代码是什么。此外，对\
  \ trait 对象的每次方法调用都需要 vtable 中的查找，这比直接调用方法会带来少量开销。\n\n当你需要在静态分派和动态分派之间做出选择时，很少有明确的正确答案。总体而言，你通常希望在库中使用静态分派，在二进制中使用动态分派。在库中，你希望允许用户决定哪种分派最适合他们，因为你不知道他们的需求是什么。如果你使用动态分派，他们就被迫同样使用，而如果你使用静态分派，他们可以选择是否使用动态分派。另一方面，在二进制中，你编写的是最终代码，所以除了你所编写的代码的需求外没有其他需求需要考虑。动态分派通常允许你编写更简洁的代码，省去泛型参数，并且编译速度更快，只是以（通常）边际的性能成本为代价，因此通常是二进制的更好选择。\n\
  \n## 泛型 Trait\n\nRust trait 可以以两种方式泛型化：使用泛型类型参数如 `trait Foo<T>` 或使用关联类型如 `trait\
  \ Foo { type Bar; }`。两者之间的区别并不立即明显，但幸运的是经验法则非常简单：如果期望对给定类型只有一种 trait 实现，就使用关联类型；否则使用泛型类型参数。\n\
  \n其原理是关联类型通常更容易使用，但不允许多次实现。因此，更简单地说，建议是只要能用就使用关联类型。\n\n对于泛型 trait，用户必须始终指定所有泛型参数并重复这些参数上的任何\
  \ bound。这很快就会变得混乱且难以维护。如果你向 trait 添加一个泛型参数，所有该 trait 的用户也必须更新以反映这一变化。而且由于对给定类型可能存在多个\
  \ trait 实现，编译器可能很难判断你打算使用哪个实例的 trait，导致像 `FromIterator::<u32>::from_iter` 这样糟糕的消除歧义函数调用。但好处是你可以在同一类型上多次实现\
  \ trait——例如，你可以针对多个右手边类型为你的类型实现 `PartialEq`，或者你可以同时实现 `FromIterator<T>` 和 `FromIterator<&T>`\
  \ 其中 `T: Clone`，正是因为泛型 trait 提供的灵活性。\n\n另一方面，使用关联类型时，编译器只需要知道实现 trait 的类型，而所有关联类型都会随之确定（因为只有一个实现）。这意味着所有\
  \ bound 都可以存在于 trait 本身中，而无需在使用时重复。反过来，这允许 trait 在不影响其用户的情况下添加进一步的关联类型。而且由于类型决定了\
  \ trait 的所有关联类型，你永远不需要使用上一段中显示的统一函数调用语法来消除歧义。然而，你不能针对多个 `Target` 类型实现 `Deref`，也不能使用多个不同的\
  \ `Item` 类型实现 `Iterator`。\n\n## 一致性与孤儿规则\n\nRust 对你可以在哪里实现 trait 以及可以在什么类型上实现它们有一些相当严格的规则。这些规则的存在是为了保持\n\
  \n\n\n*coherence* 属性：对于任何给定的类型和方法，只能有一种正确的选择来决定为该类型使用该方法的哪个实现。要了解其重要性，请考虑如果我可以为标准库中的\
  \ `bool` 类型编写自己的 `Display` trait 实现会发生什么。现在，对于任何尝试打印 bool 值并包含我的 crate 的代码，编译器都不会知道是选择我编写的实现还是标准库中的实现。两种选择都不是正确或更好，编译器显然不能随机选择。如果标准库根本不涉及，情况也一样，但我们有两个相互依赖的\
  \ crate，它们都为某个共享类型实现了 trait。coherence 属性确保编译器永远不会陷入这些情况，也永远不需要做出这些选择：总会有一个显而易见的选择。\n\
  \n一种简单的方式来维护 coherence 就是确保只有定义 trait 的 crate 才能为该 trait 编写实现；如果没有人可以实现该 trait，那么在其他地方就不会有冲突的实现。然而，这在实践中过于严格，本质上会使\
  \ trait 变得无用，因为除非你将自己的类型纳入定义 crate，否则就无法为自己的类型实现诸如 `std::fmt::Debug` 和 `serde::Serialize`\
  \ 之类的 trait。相反的极端情况，即说你只能为自己的类型实现 trait，解决了这个问题但引入了另一个问题：定义 trait 的 crate 现在无法为标准库或其它流行\
  \ crate 中的类型提供该 trait 的实现！理想情况下，我们希望找到一套规则，在下游 crate 为其自己的类型实现上游 trait 的需求与上游 crate\
  \ 能够在不破坏下游代码的情况下添加其自身 trait 的实现的需求之间取得平衡。\n\n> **NOTE**\n> \n> *Upstream 指的是你的代码所依赖的东西，而\
  \ downstream 指的是依赖你代码的东西。这些术语通常以 crate 依赖关系的直接意义使用，但也可以用来指代码库的权威分支——如果你对 Rust 编译器进行分支，那么官方\
  \ Rust 编译器就是你的“上游”。*\n\n在 Rust 中，建立这种平衡的规则是 *orphan rule* 孤儿规则。简单来说，孤儿规则规定，你只能在\
  \ trait *或* 类型是本地于你的 crate 时为类型实现 trait。因此，你可以为自己的类型实现 `Debug`，也可以为 `bool` 实现 `MyNeatTrait`，但你不能为\
  \ `bool` 实现 `Debug`。如果你尝试这样做，你的代码将无法编译，编译器会告诉你存在冲突的实现。\n\n这已经让你走得很远；它允许你为第三方类型实现自己的\
  \ trait，并为自己的类型实现第三方的 trait。然而，孤儿规则并不是故事的全部。还有许多额外的含义、注意事项和例外情况，你应该了解。\n\n## Blanket\
  \ Implementations  blanket 实现\n\n孤儿规则允许你使用类似 `impl<T> MyTrait for T where T: ...`\
  \ 的代码为一系列类型实现 trait，等等。这是一种 *blanket implementation*——它不限于某一种特定类型，而是适用于广泛的类型。只有定义\
  \ trait 的 crate 才允许编写 blanket 实现，并且向现有 trait 添加 blanket 实现被视为破坏性变更。如果不是这样，下游 crate\
  \ 中包含 `impl MyTrait for Foo` 的代码可能仅仅因为你更新了定义 `MyTrait` 的 crate 而突然停止编译，并出现冲突实现的错误。\n\
  \n## Fundamental Types 基础类型\n\n有些类型如此重要，以至于有必要允许任何人在其上实现 trait，即使这似乎违反了孤儿规则。这些类型被标记为\
  \ `#[fundamental]` 属性，目前包括 `&`、`&mut` 和 `Box`。就孤儿规则而言，基础类型几乎可以认为不存在——它们在检查孤儿规则之前被有效地擦除，以便允许你例如为\
  \ `&MyType` 实现 `IntoIterator`。仅凭孤儿规则，这种实现是不被允许的，因为它为外来的类型实现了外来的 trait——`IntoIterator`\
  \ 和 `&` 都来自标准库。对基础类型添加 blanket 实现也被视为破坏性变更。\n\n## Covered Implementations 覆盖实现\n\
  \n有一些有限的情况，我们希望允许为外来的类型实现外来的 trait，而孤儿规则通常不允许这样做。最简单的例子是当你想写类似 `impl From<MyType>\
  \ for Vec<i32>` 时。这里 `From` trait 是外来的，`Vec` 类型也是外来的，但不会有违反 coherence 的危险。这是因为冲突的实现只能通过标准库中的\
  \ blanket 实现添加（标准库否则无法命名 `MyType`），而这本身就是破坏性变更。\n\n为了允许这类实现，孤儿规则包含了一个狭窄的豁免，允许在非常特定的情况下为外来的类型实现外来的\
  \ trait。具体来说，给定的 `impl<P1...=Pn> ForeignTrait<T1...=Tn> for T0` 仅在至少一个 `Ti` 是本地类型并且在第一个这样的\
  \ `Ti` 之前没有 `T` 是泛型类型 `P1...=Pn` 之一时才被允许。泛型类型参数（`Ps`）*可以*出现在 `T0...Ti` 中，只要它们被某个中间类型\
  \ *covered* 覆盖即可。`T` 被视为 covered 如果它作为某个其它类型的类型参数出现（如 `Vec<T>`），但如果它单独存在（仅 `T`）或仅出现在基础类型后面（如\
  \ `&T`）则不算。因此，列表 3-4 中的所有实现都是有效的。\n\n```\nimpl<T> From<T> for MyType\nimpl<T> From<T>\
  \ for MyType<T>\nimpl<T> From<MyType> for Vec<T>\nimpl<T> ForeignTrait<MyType, T>\
  \ for Vec<T>\n```\n\n*Listing 3-4: Valid implementations of foreign traits for foreign\
  \ types*\n\n然而，列表 3-5 中的实现是无效的。\n\n```\nimpl<T> ForeignTrait for T\nimpl<T> From<T>\
  \ for T\nimpl<T> From<Vec<T>> for T\nimpl<T> From<MyType<T>> for T\nimpl<T> From<T>\
  \ for Vec<T>\nimpl<T> ForeignTrait<T, MyType> for Vec<T>\n```\n\nListing 3-5: Invalid\
  \ implementations of foreign traits for foreign types\n\n孤儿规则的这种放宽使在为现有 trait 添加新实现时，判断何种变更构成破坏性变更的规则变得复杂。特别是，向现有\
  \ trait 添加新实现只有在它包含至少一个新的本地类型，并且该新本地类型满足前面所述豁免规则时才是非破坏性的。添加任何其它新实现都是破坏性变更。\n\n>\
  \ NOTE 注意 `impl<T> ForeignTrait<LocalType, T> for ForeignType` 是有效的，但 `impl<T> ForeignTrait<T,\
  \ LocalType> for ForeignType` 是无效的！这可能看起来很随意，但如果没有此规则，你可以编写 `impl<T> ForeignTrait<T,\
  \ LocalType> for ForeignType`，而另一个 crate 可以编写 `impl<T> ForeignTrait<TheirType, T>\
  \ for ForeignType`，冲突只会在两个 crate 被组合时出现。与其完全禁止这种模式，孤儿规则要求你的本地类型出现在类型参数之前，这打破了平局并确保如果两个\
  \ crate 在各自独立时都保持 coherence，那么在组合时也保持 coherence。\n\n## Trait Bounds\n\n标准库充斥着 trait\
  \ bounds，无论是 HashMap 中的键必须实现 Hash + Eq，还是传给 thread::spawn 的函数必须为 FnOnce + Send +\
  \ 'static。当你自己编写泛型代码时，它几乎肯定会包含 trait bounds，否则你的代码无法对它泛型的类型做太多事情。随着你编写更复杂的泛型实现，你会发现你也需要更精确的\
  \ trait bounds，因此让我们看看实现这一点的方法。\n\n首先，trait bounds 不必是形式为 T: Trait 的形式，其中 T 是你的实现或类型所泛型的某个类型。bounds\
  \ 可以是任意的类型限制，甚至不需要包含泛型参数、参数类型或本地类型。你可以写一个像 where String: Clone 的 trait bound，即使\
  \ String: Clone 始终为真且不包含本地类型。你也可以写 where io::Error: From<MyError<T>>；你的泛型类型参数不需要只出现在左侧。这不仅允许你表达更复杂的\
  \ bounds，还可以避免不必要地重复 bounds。例如，如果你的方法想要构造一个键为某个泛型类型 T、值为 usize 的 HashMap<K, V, S>，而不是像\
  \ where T: Hash + Eq, S: BuildHasher + Default 这样写出 bounds，你可以写 where HashMap<T,\
  \ usize, S>: FromIterator。这可以节省你查找确切 bounds 要求的麻烦\n\n\n\n对于你最终使用的这些方法，它能更清晰地传达代码的“真实”需求。正如你所见，如果你想要调用的底层\
  \ trait 方法的边界很复杂，它还能显著降低你的边界复杂度。\n\n## DERIVE TRAIT\n\n虽然 `#[derive(Trait)]` 非常方便，但在\
  \ trait 边界的上下文中，你应该意识到它实现方式上一个细微之处。许多 `#[derive(Trait)]` 展开会被解糖为 `impl Trait for\
  \ Foo<T> where T: Trait`。这通常是你想要的，但并非总是如此。例如，考虑如果我们以这种方式为 `Foo<T>` 推导 `Clone` 会发生什么，而\
  \ `Foo` 包含一个 `Arc<T>`。`Arc` 无论 `T` 是否实现 `Clone` 都实现了 `Clone`，但由于推导出的边界，`Foo` 只有在\
  \ `T` 实现时才会实现 `Clone`！这通常不是太大的问题，但它确实添加了一个并不需要的边界。如果我们将类型重命名为 `Shared`，问题可能会变得更清晰一些。想象一下，一个拥有\
  \ `Shared<NotClone>` 的用户在编译器告诉他无法克隆它时会多么困惑！在撰写本文时，这就是标准库提供的 `#[derive(Clone)]` 的工作方式，尽管未来可能会改变。\n\
  \n有时，你希望对你泛型的类型的关联类型设置边界。作为一个例子，考虑迭代器方法 `flatten`，它接受一个产生项的迭代器，而这些项本身又实现了 `Iterator`，并产生这些内部迭代器的项的迭代器。它产生的类型\
  \ `Flatten` 是关于 `I` 的泛型，`I` 是外部迭代器的类型。`Flatten` 在 `I` 实现 `Iterator` 且 `I` 产生的项本身实现\
  \ `IntoIterator` 时实现 `Iterator`。为了让你能够写出这样的边界，Rust 允许你使用语法 `Type::AssocType` 来引用一个类型的关联类型。例如，我们可以使用\
  \ `I::Item` 来引用 `I` 的 `Item` 类型。如果一个类型有多个同名的关联类型，例如如果提供关联类型的 trait 本身是泛型的（因此存在多个实现），你可以使用语法\
  \ `<Type as Trait>::AssocType` 来消除歧义。使用这种方式，你不仅可以为外部迭代器类型写边界，还可以为该外部迭代器的项类型写边界。\n\
  \n在大量使用泛型的代码中，你可能会发现需要写一个关于类型引用 的边界。这通常没问题，因为你往往也会有一个泛型的生命周期参数，可以用作这些引用的生命周期。然而，在某些情况下，你希望边界表示“这个引用对任何生命周期都实现这个\
  \ trait”。这种情况极为罕见——在撰写本文时，标准库仅在三个地方使用了它——但确实会发生。这种类型的边界被称为高阶 trait 边界，它与 `Fn` trait\
  \ 结合使用时特别有用。例如，想象你希望对一个接受 `T` 的引用并返回 `T` 内部引用的函数进行泛型化。如果你写 `F: Fn(&T) -> &U`，你需要为这些引用提供一个生命周期，但你真正想说的是“任何生命周期，只要输出与输入相同”。使用高阶生命周期，你可以写\
  \ `F: for<'a> Fn(&'a T) -> &'a U` 来表示对于任何生命周期 `'a`，边界必须成立。Rust 编译器足够智能，可以在你以这种方式写带引用的\
  \ `Fn` 边界时自动添加 `for`，这也是你很少需要显式形式的部分原因，但了解它是有价值的。\n\n为了将所有这些内容整合起来，请考虑第 3-6 节中的代码，可用于为任何可迭代且其元素为\
  \ `Debug` 的类型实现 `Debug`。\n\n```\nimpl Debug for AnyIterable\n    where for<'a> &'a\
  \ Self: IntoIterator,\n        for<'a> <&'a Self as IntoIterator>::Item: Debug {\n\
  \    fn fmt(&self, f: &mut Formatter) -> Result<(), Error> {\n        f.debug_list().entries(self).finish()\n\
  \    }\n}\n```\n\nListing 3-6: An excessively generic implementation of Debug for\
  \ any iterable collection\n\n你几乎可以为任何集合类型复制粘贴此实现，它就会“正常工作”。当然，你可能想要一个更智能的 debug\
  \ 实现，但这很好地说明了 trait 边界的强大功能。\n\n## Marker Traits\n\n通常，我们使用 trait 来表示多个类型可以支持的功能；一个\
  \ `Hash` 类型可以通过调用 `hash` 来哈希，一个 `Clone` 类型可以通过调用 `clone` 来克隆，一个 `Debug` 类型可以通过调用\
  \ `fmt` 来格式化用于调试。但并非所有 trait 都是以这种方式功能的。一些 trait，称为标记 trait，反而表示实现类型的属性。标记 trait\
  \ 没有方法和关联类型，仅用于告诉你特定类型可以或不可以以某种方式使用。例如，如果一个类型实现了 `Send` 标记 trait，它是安全的跨线程边界发送。如果它没有实现此标记\
  \ trait，则不安全发送。与此行为没有关联的方法；它只是关于类型的事实。标准库在 `std::marker` 模块中有许多这些，包括 `Send`、`Sync`、`Copy`、`Sized`\
  \ 和 `Unpin`。其中大多数（除了 `Copy`）也是自动 trait；编译器会自动为类型实现它们，除非该类型包含不实现标记 trait 的内容。\n\n\
  标记 trait 在 Rust 中发挥着重要作用：它们允许你编写捕获代码中未直接表达的语义要求的边界。要求类型为 `Send` 的代码中没有对 `send` 的调用。相反，代码假设给定类型在单独的线程中使用是安全的，而如果没有标记\
  \ trait，编译器将无法检查该假设。这将取决于程序员记住假设并非常仔细地阅读代码，而我们都知道这不是我们希望依赖的东西。那条道路布满了数据竞争、段错误和其他运行时问题。\n\
  \n与标记 trait 类似的是 *标记类型*。这些是单元类型（像 `struct MyMarker;`）不持有数据也没有方法。标记类型用于，嗯，标记一个类型处于特定状态。当你希望使用户无法误用\
  \ API 时，它们非常有用。例如，考虑一个像 `SshConnection` 这样的类型，它可能尚未经过身份验证。你可以向 `SshConnection` 添加一个泛型类型参数，然后创建两个标记类型：`Unauthenticated`\
  \ 和 `Authenticated`。当用户首次连接时，他们会得到 `SshConnection<Unauthenticated>`。在其 `impl` 块中，你只提供一个方法：`connect`。`connect`\
  \ 返回一个 `SshConnection<Authenticated>`，并且只有在该 `impl` 块中你才提供运行命令等剩余方法。我们将在第 4 章进一步研究这种模式。\n\
  \n## Existential Types\n\n在 Rust 中，你很少需要在函数体中声明的变量的类型或你调用的方法的泛型参数的类型进行指定。这是因为 *类型推断*，编译器根据类型在代码中出现的上下文决定使用什么类型。编译器通常只为变量以及闭包的参数（和返回类型）推断类型；顶层定义如函数、类型、trait\
  \ 和 trait 实现块都需要你显式命名所有类型。这有几个原因，但主要原因是当你至少有一些已知的起点时，类型推断会容易得多。然而，并非总是容易，甚至可能完全不可能完全命名一个类型！例如，如果你从函数返回一个闭包，或从\
  \ trait 方法返回一个 async 块，其类型没有一个你可以输入到代码中的名称。\n\n为了处理这种情况，Rust 支持 *存在类型*。很可能，你已经见过存在类型在行动。所有标记为\
  \ `async fn` 或返回类型为 `impl Trait` 的函数都有一个存在返回类型：签名没有给出返回值的真实类型，只是提示函数返回 *某个* 实现调用者可以依赖的一组\
  \ trait 的类型。并且至关重要的是，调用者只能依赖返回类型实现这些 trait，而不能依赖其他任何东西。\n\n> NOTE\n> 技术上来说，并不严格正确地说调用者只依赖返回类型而没有其他依赖。编译器还会将\
  \ `Send` 和 `Sync` 等自动 trait 通过返回位置的 `impl Trait` 传播。我们将在下一章更详细地研究这个问题。\n\n这种行为就是存在类型名称的由来：我们断言存在某个与签名匹配的具体类型，并将找到该类型的工作留给编译器。编译器通常会通过对函数体应用类型推断来弄清楚这一点。\n\
  \n\n\n\n\n并非所有 impl Trait 的实例都使用 existential types。如果你将 impl Trait 用在函数的参数位置，它实际上只是该函数的一个未命名泛型参数的简写。例如，fn\
  \ foo(s: impl ToString) 基本上只是 fn foo<S: ToString>(s: S) 的语法糖。\n\nExistential types\
  \ 在实现带有关联类型的 trait 时特别有用。例如，想象你在实现 IntoIterator trait。它有一个关联类型 IntoIter，用于保存该类型可以被转换为的迭代器的类型。有了\
  \ existential types，你就不需要为 IntoIter 定义一个单独的迭代器类型。相反，你可以将关联类型写成 impl Iterator<Item\
  \ = Self::Item>，然后在 fn into_iter(self) 内部写一个求值为 Iterator 的表达式，例如通过对某个现有迭代器类型使用 map\
  \ 和 filter。\n\nExistential types 还提供了一个超越单纯便利性的特性：它们允许你执行零成本的类型擦除。不是仅仅因为它们出现在某个公共签名中就导出辅助类型——迭代器和\
  \ future 就是常见的例子——你可以使用 existential types 来隐藏底层具体类型。你的接口的使用者只能看到相关类型实现的相关 trait，而具体类型则作为实现细节保留下来。这不仅简化了接口，而且还使你能够在未来随意更改该实现，而不会破坏下游代码。\n\
  \n## Summary\n\n本章对 Rust 类型系统进行了全面回顾。我们既研究了编译器如何在内存中体现类型，也研究了它如何对类型本身进行推理。这对于编写\
  \ unsafe 代码、复杂的应用接口以及后续章节中的异步代码而言是非常重要的背景知识。你还会发现，本章中的许多类型推理也影响着你如何设计 Rust 代码接口，我们将在下一章中介绍这一点。\n\
  \n## Common Traits for Types\n\nRust 中的用户还会做出一个主要假设，即接口中的一切都“只需工作”。他们期望能够使用 {:?}\
  \ 打印任何类型，并将任何东西发送到另一个线程，并且他们期望每个类型都是 Clone。在可能的情况下，我们应再次避免让用户感到惊讶，并在不需要立即使用时也积极实现大多数标准\
  \ trait。\n\n由于第 3 章中讨论的 coherence 规则，编译器不会允许用户在需要时为这些 trait 实现。用户不被允许为外来的类型（如你接口中的类型）实现外来的\
  \ trait（如 Clone）。他们反而需要将你的接口类型包装在自己的类型中，即使这样，在没有访问该类型内部结构的情况下，编写合理的实现也可能相当困难。\n\n\
  这些标准 trait 中首要的是 Debug trait。几乎每种类型都可以，也应该实现 Debug，即使它只打印类型的名称。使用 #[derive(Debug)]\
  \ 通常是实现接口中 Debug trait 的最佳方式，但请记住，所有派生的 trait 都会自动为任何泛型参数添加相同的 bound。你也可以通过利用 fmt::Formatter\
  \ 上的各种 debug_helpers 来自行编写实现。\n\n紧随其后的是 Rust 的 auto-traits Send 和 Sync（以及在较小程度上\
  \ Unpin）。如果一个类型未实现这些 trait 中的一个，那应该有非常充分的理由。未实现 Send 的类型不能放入 Mutex 中，也不能在包含线程池的应用程序中甚至间接使用。未实现\
  \ Sync 的类型不能通过 Arc 共享，也不能放在静态变量中。用户已经习惯于类型在这些上下文中“只需工作”，尤其是在异步世界中几乎所有内容都在线程池上运行，如果你不确保你的类型实现了这些\
  \ trait，他们会感到沮丧。如果你的类型无法实现它们，请确保这一事实及其原因得到充分记录！\n\n接下来的一组几乎通用的 trait 你应该实现的是 Clone\
  \ 和 Default。这些 trait 可以轻松派生或实现，并且对大多数类型来说都有意义。如果你的类型无法实现这些 trait，请务必在文档中指出，因为用户通常期望能够轻松创建更多（和新的）类型的实例。如果他们不能，他们会感到惊讶。\n\
  \n在预期 trait 层级中更进一步的是比较 trait：PartialEq、PartialOrd、Hash、Eq 和 Ord。PartialEq trait\
  \ 尤其可取，因为用户在某个时候不可避免地会有两个你的类型的实例，他们希望使用 == 或 assert_eq! 进行比较。即使你的类型仅在同一实例时才相等，实现\
  \ PartialEq 也值得去做，以便你的用户可以使用 assert_eq!。\n\nPartialOrd 和 Hash 更为专门，可能适用范围不那么广，但只要有可能，你也希望实现它们。这对于用户可能用作\
  \ map 中的键的类型，或他们可能使用 std::collection 中的任何集合类型去去重的类型尤其正确，因为它们往往需要这些 bound。Eq 和 Ord\
  \ 在实现类型的比较操作上比 PartialEq 和 PartialOrd 有额外的语义要求。这些在这些 trait 的文档中都有很好的记录，只有当你确定这些语义确实适用于你的类型时才应实现它们。\n\
  \n最后，对于大多数类型，实现 serde crate 的 Serialize 和 Deserialize trait 是有意义的。这些可以轻松派生，并且 serde_derive\
  \ crate 甚至提供了仅重写一个字段或枚举变体的序列化的机制。由于 serde 是一个第三方 crate，你可能不希望在上面添加必需的依赖。大多数库因此选择提供一个\
  \ serde feature，仅在用户选择加入时才添加对 serde 的支持。\n\n你可能会想知道为什么我没有在本节中包含可派生的 trait Copy。Copy\
  \ 与提到的其他 trait 有两点不同。首先，用户通常并不期望类型是 Copy；恰恰相反，他们倾向于期望如果想要某物的两个副本，就必须调用 clone。Copy\
  \ 改变了移动给定类型值的语义，这可能会让用户感到惊讶。这与第二个观察相关：类型很容易不再是 Copy，因为 Copy 类型受到严格限制。一个起初简单的类型很容易最终需要持有\
  \ String 或其他非 Copy 类型。如果发生这种情况，并且你必须移除 Copy 实现，那是一个向后不兼容的更改。移除 Clone 实现的情况要少得多，因此这是一个负担更小的承诺。\n\
  \n## Ergonomic Trait Implementations\n\nRust 不会自动为实现了 trait 的类型的引用实现 trait。换句话说，你通常不能用\
  \ &Bar 调用 fn foo<T: Trait>(t: T)，即使 Bar: Trait。这是因为 Trait 可能包含接收 &mut self 或 self\
  \ 的方法，而这些方法显然不能在 &Bar 上调用。尽管如此，这种行为对于看到 Trait 只有 &self 方法的用户来说可能非常令人惊讶！\n\n因此，当你定义一个新的\
  \ trait 时，你通常希望为 &T where T: Trait、&mut T where T: Trait 以及 Box<T> where T: Trait\
  \ 提供适当的 blanket 实现，具体取决于 Trait 的方法接收者是什么。你可能只能实现其中一些，具体取决于 Trait 方法的接收者。标准库中的许多\
  \ trait 都有类似的实现，正是因为这会让用户感到更少惊讶。\n\n迭代器是另一个你通常希望在类型的引用上专门添加 trait 实现的案例。对于任何可以迭代的类型，请考虑为\
  \ &MyType 和 &mut MyType 在适用时实现 IntoIterator。这使得 for 循环开箱即用地与你类型的借用实例一起工作，就像用户期望的那样。\n\
  \n## Wrapper Types\n\nRust 在经典意义上没有对象继承。然而，Deref trait 及其表亲 AsRef 都提供了一种有点像继承的东西。这些\
  \ trait 允许你拥有类型 T 的值，并通过在 T 类型的值上直接调用它们来调用类型 U 的方法，如果 T: Deref<Target = U>。这对用户来说感觉像魔法，通常非常棒。\n\
  \n\n\n\n需求是对代码使用方式的限制，而承诺则是关于代码使用方式的保证。在设计新接口时，你需要仔细思考这份契约。一个好的经验法则是：避免施加不必要的限制，并且只做出你能够兑现的承诺。增加限制或移除承诺通常需要一次主版本号的语义化版本变更，并且很可能会破坏其他地方的代码。反之，放宽限制或增加新的承诺通常可以向后兼容。\n\
  \n在 Rust 中，限制通常以 trait 约束和参数类型的形式出现，承诺则以 trait 实现和返回类型的形式出现。例如，比较清单 4-1 中的三个函数签名。\n\
  \n```\nfn frobnicate1(s: String) -> String\nfn frobnicate2(s: &str) -> Cow<'_, str>\n\
  fn frobnicate3(s: impl AsRef<str>) -> impl AsRef<str>\n```\n\n清单 4-1：契约不同的相似函数签名\n\
  \n这三个函数签名都接收一个字符串并返回一个字符串，但它们是在截然不同的契约下完成这一点的。\n\n第一个函数要求调用者以 `String` 类型的形式拥有该字符串，并承诺返回一个拥有的\
  \ `String`。由于该契约要求调用者进行分配，并要求我们返回一个拥有的 `String`，我们日后无法以向后兼容的方式让这个函数变成零分配。\n\n第二个函数放宽了契约：调用者可以提供任何字符串引用，因此用户不再需要分配内存或放弃对\
  \ `String` 的所有权。它还承诺返回一个 `std::borrow::Cow`，这意味着它既可以返回字符串引用，也可以返回拥有的 `String`，具体取决于它是否需要拥有该字符串。这里的承诺是函数将始终返回一个\
  \ `Cow`，这意味着我们日后不能将其改为使用其他优化的字符串表示形式。调用者还必须专门提供一个 `&str`，因此如果他们拥有一个预先存在的 `String`，就必须先将其解引用为\
  \ `&str` 才能调用我们的函数。\n\n第三个函数解除了这些限制。它只要求用户传入一个能产生字符串引用的类型，并且只承诺返回值能产生字符串引用。\n\n\
  这些函数签名中没有哪一个比其他的更好。如果你在函数中需要拥有一个字符串，可以使用第一种参数类型来避免额外的字符串拷贝。如果你希望允许调用者利用已分配并返回拥有字符串的情况，那么第二个返回类型为\
  \ `Cow` 的函数可能是一个不错的选择。不过，我希望你从中明白的是：你应该仔细思考你的接口会把你绑定到怎样的契约上，因为事后更改它可能会造成破坏。\n\n\
  在本节的剩余部分，我会给出一些经常出现的接口设计决策示例，以及它们对你的接口契约的影响。\n\n## 泛型参数\n\n你的接口必须对用户施加的一个明显需求是：他们必须为你的代码提供哪些类型。如果你的函数明确接受一个\
  \ `Foo`，用户就必须拥有并交给你一个 `Foo`。这没有其他办法。在大多数情况下，使用泛型而不是具体类型是值得的，这样可以允许调用者传入任何符合函数实际需求的类型，而不仅仅是某个特定类型。将清单\
  \ 4-1 中的 `&str` 改为 `impl AsRef<str>` 就是这类放宽操作的一个例子。以这种方式放宽需求的一种做法是：先让参数完全不带约束地使用泛型，然后跟随编译器的错误提示，找出需要添加的约束。\n\
  \n然而，如果走到极端，这种方法会让每个函数的每个参数都变成各自的泛型类型，这既难以阅读又难以理解。对于究竟何时应该或不应该将某个参数设为泛型，并没有硬性规定，所以请运用你的最佳判断。一个好的经验法则是：如果你能想到用户可能合理地、频繁地想要使用其他类型来代替你最初使用的具体类型，那就将该参数设为泛型。\n\
  \n你可能还记得第 3 章中提到的：泛型代码会通过单态化，为每一种使用过的类型组合进行复制。想到这一点，让大量参数变成泛型的想法可能会让你担心二进制文件过大。在第\
  \ 3 章中我们还讨论了如何通过动态分发来缓解这一问题，而代价（通常是可忽略不计的）是性能损失，这一点在这里同样适用。\n\n对于你本来就通过引用接收的参数（回想一下，`dyn\
  \ Trait` 不是 `Sized`，你需要一个胖指针才能使用它们），你可以轻松地把泛型参数替换为使用动态分发的参数。例如，你可以使用 `&dyn AsRef<str>`\
  \ 而不是 `impl AsRef<str>`。\n\n不过，在你急着这么做之前，有几点需要考虑。首先，你是在代表你的用户做这个选择，他们无法选择不使用动态分发。如果你知道你应用动态分发的代码永远不会对性能敏感，那也许没问题。但如果某个用户想在高性能应用中使用你的库，那么在一个热循环中调用的函数里使用动态分发可能会成为交易破坏者。其次，在撰写本文时，只有当你有一个像\
  \ `T: AsRef<str>` 或 `impl AsRef<str>` 这样的简单 trait 约束时，动态分发才有效。对于更复杂的约束，Rust 不知道如何构造动态分发的\
  \ vtable，因此你不能使用例如 `&dyn Hash + Eq`。最后，请记住，使用泛型时，调用者总是可以通过传入一个 trait 对象来自己选择动态分发。反过来则不成立：如果你接收一个\
  \ trait 对象，调用者就必须提供 trait 对象。\n\n你可能会想先用具体类型来设计接口，然后再逐步泛型化。这可以行得通，但请记住，这类更改不一定向后兼容。为了理解原因，想象一下你把一个函数从\
  \ `fn foo(v: &Vec<usize>)` 改为 `fn foo(v: impl AsRef<[usize]>)`。虽然每个 `&Vec<usize>`\
  \ 都实现了 `AsRef<[usize]>`，但类型推断仍然可能给用户带来问题。考虑一下如果调用者调用 `foo(&iter.collect())` 会发生什么。在原始版本中，编译器可以确定应该收集到一个\
  \ `Vec` 中，而现在它只知道需要收集到某个实现了 `AsRef<[usize]>` 的类型中。而这样的类型可能不止一种，因此经过这一更改，调用者的代码将无法再编译！\n\
  \n## 对象安全\n\n当你定义一个 trait 时，该 trait 是否对象安全（参见第 3 章“编译与分发”一节的末尾，第 XX 页）是该 trait 契约中一个不成文的部分。如果\
  \ trait 是对象安全的，用户就可以使用 `dyn Trait` 将实现了该 trait 的不同类型当作一个共同的类型来处理。如果不是，编译器将不允许为该\
  \ trait 使用 `dyn Trait`。你应该更倾向于让你的 trait 保持对象安全，即使这会稍微牺牲一些使用上的便利性（例如用 `impl AsRef<str>`\
  \ 而不是 `&str`），因为对象安全可以为使用你的 trait 开辟新的方式。如果你的 trait 必须有一个泛型方法，请考虑它的泛型参数是否可以放在 trait\
  \ 本身上，或者它的泛型参数是否也可以使用动态分发来保持 trait 的对象安全性。另外，你还可以在该方法上添加 `where Self: Sized` 的 trait\
  \ 约束，这样该方法就只能通过 trait 的具体实例（而不能通过 `dyn Trait`）来调用。你可以在 `Iterator` 和 `Read` trait\
  \ 中看到这种模式的例子，它们都是对象安全的，但在具体实例上提供了一些额外的便捷方法。\n\n对于为了保护对象安全你愿意做出多少牺牲，并没有一个统一的答案。我的建议是：考虑你的\
  \ trait 将如何被使用，以及用户想要将其作为 trait 对象来使用是否有意义。如果你认为用户很可能想要将你的 trait 的许多不同实例放在一起使用，那么你就应该比在认为这种用例不太合理的情况下更加努力地提供对象安全。例如，动态分发对\
  \ `FromIterator` trait 没什么用，因为它的唯一方法不接收 `self`，所以你一开始就无法构造一个 trait 对象。同样地，`std::io::Seek`\
  \ 单独作为 trait 对象也没什么用处，因为你用这种 trait 对象唯一能做的就是 seek，而无法读或写。\n\n> **DROP TRAIT 对象**\n\
  >\n> 你可能会认为 `Drop` trait 作为 trait 对象也没什么用，因为你用 `Drop` 作为 trait 对象唯一能做的就是丢弃它。但事实证明，有些库专门就是想要能够丢弃任意类型。例如，一个提供延迟丢弃值的库，比如用于并发垃圾回收或仅仅是延迟清理，它只关心这些值能否被\n\
  \n\n\n被丢弃，且没有其他操作。有趣的是，Drop 的故事并不止于此；由于 Rust 需要能够丢弃 trait 对象，因此每个 vtable 都包含 drop\
  \ 方法。有效地，每个 dyn Trait 也都是一个 dyn Drop。\n\n请记住，对象安全是你的公共接口的一部分！如果你以向后兼容的方式修改 trait，例如添加一个具有默认实现的方法，但这使得\
  \ trait 不再对象安全，你需要提升你的主版本号。\n\n## 借用 vs. 所有权\n\n对于你在 Rust 中定义的几乎每个函数、trait 和类型，你都必须决定它是否应该拥有其数据，或仅持有对数据的引用。你所做的决定将对接口的易用性和性能产生深远的影响。幸运的是，这些决定通常会自行做出。\n\
  \n如果你的代码需要数据的所有权，例如调用接收 self 的方法或将数据移动到另一个线程，它必须存储所有权数据。当你的代码必须拥有数据时，它通常也应让调用者提供所有权数据，而不是通过引用接收值然后克隆它们。这让调用者控制分配，并且它明确说明了使用该接口的成本。\n\
  \n另一方面，如果你的代码不需要拥有数据，它应改为操作引用。其中一个常见的例外是像 i32、bool 或 f64 这样的小类型，它们直接存储和复制的成本与通过引用存储一样低廉。不过要小心不要假设这对所有\
  \ Copy 类型都成立；[u8; 8192] 是 Copy，但到处存储和复制它会很昂贵。\n\n当然，在现实世界中，事情往往没有那么清晰。有时，你事先并不知道你的代码是否需要拥有数据。例如，String::from_utf8_lossy\
  \ 只有在传入的字节序列包含无效的 UTF-8 序列时才需要接管所有权。在这种情况下，Cow 类型就是你的朋友：它允许你在数据允许时操作引用，并在必要时生成一个拥有值。\n\
  \n其他时候，引用生命周期使接口变得如此复杂以至于使用起来很痛苦。如果你的用户在你的接口之上编写代码时难以让代码编译通过，这就是一个信号，表明你可能想要（即使是不必要地）接管某些数据的所有权。如果你这样做，先从那些便宜克隆或不属于性能敏感部分的数据开始，然后再决定是否要堆分配可能是一个巨大的字节块。\n\
  \n## 可能失败且阻塞的析构函数\n\n以 I/O 为中心的类型的析构时通常需要执行清理工作。这可能包括将写入刷新到磁盘、关闭文件，或优雅地终止与远程主机的连接。执行此清理的自然位置是在类型的\
  \ Drop 实现中。不幸的是，一旦值被丢弃，我们除了 panic 之外就再也没有办法向用户传达错误。类似的问题出现在异步代码中，在那里我们希望在有待处理工作时完成收尾。drop\
  \ 被调用时，executor 可能正在关闭，我们没有办法做更多工作。我们可以尝试启动另一个 executor，但这会带来自己的问题，例如在异步代码中阻塞，正如我们在第\
  \ 9 章中将看到的那样。\n\n这些问题没有完美的解决方案，无论我们做什么，一些应用程序不可避免地会回退到我们的 Drop 实现。因此，我们需要通过 Drop\
  \ 提供尽力而为的清理。如果清理出错，至少我们尝试过了——我们吞掉错误并继续。如果 executor 仍然可用，我们可能会 spawn 一个 future 来执行清理，但如果它永远无法运行，我们也尽力了。\n\
  \n然而，我们应该为希望不留下任何松散线程的用户提供更好的替代方案。我们可以通过提供显式的析构函数来做到这一点。这通常采用接收 self 所有权并暴露固有错误（使用\
  \ -> Result<_, _>）或异步性（使用 async fn）的形式。谨慎的用户随后可以使用该方法优雅地拆除任何相关资源。\n\n> NOTE 确保你在文档中突出显示显式的析构函数！\n\
  \n一如既往，存在权衡。一旦你添加了显式的析构函数，你会遇到两个问题。首先，由于你的类型实现了 Drop，你就不能在析构函数中从该类型的任何字段中移出。这是因为\
  \ Drop::drop 在你的显式析构函数运行后仍会被调用，而它接收 &mut self，这要求 self 的任何部分都未被移动。其次，drop 接收 &mut\
  \ self，而不是 self，所以你的 Drop 实现不能简单地调用你的显式析构函数并忽略其结果（因为它不拥有 self）。解决这些问题的办法有几种，没有一种是完美的。\n\
  \n第一种方法是让你的顶层类型成为一个 newtype 包装器，包装一个 Option，而 Option 又持有某个内部类型，该内部类型持有类型的所有字段。你可以在两个析构函数中都使用\
  \ Option::take，并在内部类型尚未被取出时调用内部类型的显式析构函数。由于内部类型未实现 Drop，你可以在那里接管所有字段的所有权。这种方法的缺点是，你希望在顶层类型上提供的所有方法现在都必须包含代码来穿过\
  \ Option（你知道它在 drop 尚未被调用时始终是 Some）以访问内部类型的字段。\n\n第二个变通方法是让你的每个字段都 *可取出*。你可以通过将其替换为\
  \ None 来“取出”一个 Option（这就是 Option::take 所做的），但你也可以对许多其他类型这样做。例如，你可以通过简单地将它们替换为其廉价构造的默认值来取出\
  \ Vec 或 HashMap——std::mem::take 就是你的朋友。这里的方法在你的类型具有合理的“空”值时效果很好，但在你必须将几乎每个字段都包装在\
  \ Option 中，然后用匹配的 unwrap 修改这些字段的每个访问时就会变得繁琐。\n\n第三个选项是将数据放在 ManuallyDrop 类型内部，该类型解引用为内部类型，因此无需\
  \ unwrap。你也可以在 drop 中使用 ManuallyDrop::take 在销毁时接管所有权。这种方法的主要缺点是 ManuallyDrop::take\
  \ 是不安全的。没有任何安全机制来确保你不会在调用 take 之后尝试使用 ManuallyDrop 内部的值，或多次调用 take。如果你这样做，你的程序将静默地表现出未定义行为，坏事就会发生。\n\
  \n最终，你应该选择最适合你的应用程序的方法。我会倾向于采用第二个选项，只有当你发现自己陷入 Option 的海洋时才切换到其他方法。ManuallyDrop\
  \ 解决方案在代码足够简单以便你能轻松检查代码的安全性，并且你对自己的能力有信心时是优秀的。\n\n## 显而易见\n\n虽然一些用户可能熟悉支撑你的接口的实现方面的内容，但他们不太可能理解其所有规则和限制。他们不会知道在调用\
  \ bar 之后调用 foo 永远是不允许的，或只有在月亮处于 47 度角且过去 18 秒内没有人打喷嚏时调用 unsafe 方法 baz 才是安全的。只有当接口明确表明有些奇怪的事情正在发生时，他们才会去查阅文档或仔细阅读类型签名。因此，对你来说，让用户尽可能容易理解你的接口并尽可能难以错误使用它至关重要。你为此拥有的两个主要技术是你的文档和类型系统，让我们依次来看一下。\n\
  \n> NOTE 你也可以利用命名来提示用户接口中还有超出表面之外的东西。如果用户看到一个名为 dangerous 的方法，他们很可能会阅读其文档。\n\n##\
  \ 文档\n\n使你的接口透明的第一步是编写良好的文档。我可以写一整本书专门讲如何写文档，但让我们在这里专注于 Rust 特定的建议。\n\n首先，清楚地记录任何你的代码可能做一些意外的操作的情况，或依赖用户做超出类型签名所规定的事情。panic\
  \ 就是两者兼有的一个好例子。\n\n\n\n\n这些情况下：如果你的代码可能 panic，请记录这一事实，以及它可能 panic 的具体情形。同样，如果你的代码可能返回错误，请记录返回错误的情形。对于\
  \ unsafe 函数，请记录调用者必须保证什么，调用才是安全的。\n\n其次，在 crate 和模块级别为你的代码提供端到端的使用示例。这些比特定类型或方法的示例更重要，因为它们能让用户体会到所有内容是如何组合在一起的。当开发人员对接口结构有了较好的高层理解后，他们可能很快就会意识到特定的方法和类型是做什么的，以及应该在何处使用它们。端到端示例还为用户提供了定制用法的起点；他们可以——而且通常会——复制粘贴示例，然后根据自己的需求进行修改。这种“在做中学”的方式往往比让他们尝试从零散组件中拼凑出内容更有效。\n\
  \n**注意** 那些高度针对某个方法的示例，比如展示 len 方法确实返回长度的示例，不太可能向用户传达任何有关你代码的新信息。\n\n第三，组织好你的文档。如果你所有的类型、trait\
  \ 和函数都放在一个顶层模块中，用户将很难知道从哪里开始。要利用模块将语义相关的项目组合在一起。然后，使用文档内链接将这些项目互相关联起来。如果关于类型 A 的文档提到了\
  \ trait B，那么就应该在那里直接链接到该 trait。如果你让用户能够轻松探索你的接口，他们就不太可能错过重要的关联或依赖。同时，考虑使用 `#[doc(hidden)]`\
  \ 标记那些并非有意公开、但由于历史原因而需要保留的接口部分，以免它们使你的文档变得杂乱。\n\n最后，尽可能丰富你的文档。链接到能够解释概念、数据结构、算法或接口其他方面的外部资源，这些内容可能在其他地方已有很好的说明。如果有相关的话，RFC、博客文章和白皮书都是很好的选择。使用\
  \ `#[doc(cfg(...))]` 来突出显示仅在特定配置下可用的项目，以便用户很快意识到为什么文档中列出的某个方法不可用。使用 `#[doc(alias\
  \ = \"...\")]` 让类型和方法能够通过用户可能搜索的其他名称被发现。在顶层文档中，向用户指出常用的模块、功能、类型、trait 和方法。\n\n##\
  \ 类型系统指导\n\n类型系统是一个极好的工具，可以确保你的接口清晰明了、自我文档化且不易被误用。你可以使用多种技术，让你的接口很难被误用，从而更有可能被正确使用。\n\
  \n其中第一种是语义类型化（semantic typing），即添加类型来表示值的含义，而不仅仅是其原始类型。这里经典的例子是布尔值：如果你的函数接受三个 bool\
  \ 参数，很可能某个用户会弄错值的顺序，直到出了大问题才意识到。另一方面，如果它接受三个参数，而这三个参数是三种不同的两变体枚举类型，那么用户不可能在不被编译器警告的情况下弄错顺序：如果他们试图将\
  \ `DryRun::Yes` 传递给 overwrite 参数，那根本行不通，将 `Overwrite::No` 作为 dry_run 参数也同样行不通。你也可以在布尔值之外应用语义类型化。例如，在数值类型上创建一个\
  \ newtype，可以为其中包含的值提供单位，或者将原始指针参数限制为仅接受由另一个方法返回的那些指针。\n\n一种密切相关的技术是使用零大小类型（zero-sized\
  \ type）来表明某个类型的实例具有某个特定的事实。例如，考虑一个名为 Rocket 的类型，它表示真实火箭的状态。无论火箭处于什么状态，Rocket 的某些操作（方法）都应该可用，但有些操作只在特定情况下才有意义。例如，如果火箭已经发射过，就不可能再次发射。同样，如果火箭尚未发射，可能也不应该能够分离燃料箱。我们可以将这些状态建模为枚举变体，但那样所有方法在每个阶段都可用，而且我们需要引入可能的\
  \ panic。\n\n相反，如清单 4-2 所示，我们可以在 Rocket 上引入一个泛型参数 Stage，并用它来限制哪些方法在何时可用。\n\n```\n\
  ① struct Grounded;\nstruct Launched;\n// and so on\nstruct Rocket<Stage = Grounded>\
  \ {\n② stage: std::marker::PhantomData<Stage>,\n}\n\n③ impl Default for Rocket<Grounded>\
  \ {}\nimpl Rocket<Grounded> {\n    pub fn launch(self) -> Rocket<Launched> { }\n\
  }\n④ impl Rocket<Launched> {\n    pub fn accelerate(&mut self) { }\n    pub fn decelerate(&mut\
  \ self) { }\n}\n\n⑤ impl<Stage> Rocket<Stage> {\n    pub fn color(&self) -> Color\
  \ { }\n    pub fn weight(&self) -> Kilograms { }\n}\n```\n\n清单 4-2：使用标记类型来限制实现\n\
  \n我们引入单元类型来表示火箭可能处于的每个阶段 ①。我们实际上并不需要存储阶段本身——只需要它提供的元信息——因此我们将其存储在 PhantomData ②\
  \ 后面，以确保它在编译时被消除。然后，我们仅为持有特定类型参数的 Rocket 编写实现块。你目前只能在地面上构建火箭，并且只能从地面发射它 ③。只有火箭发射后，你才能控制它的速度\
  \ ④。无论火箭处于什么状态，有些事情你总是可以做的，我们将这些操作放在一个泛型实现块 ⑤ 中。你会注意到，通过这种方式设计的接口，用户根本不可能在错误的时间调用某个方法——我们已经将使用规则编码到了类型本身，并使得非法状态无法被表示。\n\
  \n这个概念也适用于许多其他领域；如果你的函数只有在给定的布尔参数为 true 时才使用某个指针参数，那么最好将这两个参数合并起来。使用一个枚举类型，其中一个变体表示\
  \ false（且不包含指针），另一个变体表示 true 并持有指针，这样调用者和实现者都不会误解这两者之间的关系。这是一个强大的思路，我非常鼓励你加以利用。\n\
  \n另一个让接口清晰明了的小而实用的工具是 `#[must_use]` 注解。将它添加到任何类型、trait 或函数上后，如果用户的代码接收了该类型或 trait\
  \ 的元素，或者调用了该函数，却没有显式地处理它，编译器就会发出警告。你可能已经在 Result 的上下文中见过这种情况：如果一个函数返回 Result，而你没有在某个地方赋值其返回值，就会收到编译器警告。不过，要注意不要过度使用这个注解——只有当用户不使用返回值时非常可能出错的情况下，才添加它。\n\
  \n## 约束\n\n随着时间推移，总会有用户依赖于你接口的每一个属性，无论是 bug 还是特性。对于公开可用的库来说尤其如此，因为你无法控制你的用户。因此，在做出对用户可见的更改之前，你应该仔细考虑。无论你是添加新的类型、字段、方法或\
  \ trait 实现，还是修改现有的这些，你都需要确保该更改不会破坏现有用户的代码，并且你计划长期保留这一更改。频繁的不向后兼容更改（语义化版本中的主版本号增加）必然会招致用户的愤怒。\n\
  \n许多不向后兼容的更改是显而易见的，比如重命名公共类型或删除公共方法，但有些则更为微妙，并且与 Rust 的工作方式紧密相关。在这里，我们将介绍一些更棘手的细微更改，以及如何为它们做好规划。你会看到，需要在某些更改与你希望接口具备的灵活性之间进行权衡——有时候，必须有所舍弃。\n\
  \n### 类型修改\n\n删除或重命名公共类型几乎肯定会破坏某些用户的代码。为了应对这种情况，你应该尽可能利用 Rust 的可见性修饰符，比如 `pub(crate)`\
  \ 和 `pub(in path)`。你拥有的公共类型越少，在不破坏现有代码的情况下，将来进行更改的自由度就越大。\n\n\n\n不过，用户代码对你的类型的依赖方式不仅仅是名称。请看代码清单\
  \ 4-3 中的公开类型以及该代码的给定用法。\n\n```\n```rust\n// in your interface\npub struct Unit;\n\
  // in user code\nlet u = lib::Unit;\n```\n```\n\n*代码清单 4-3：一个看起来无害的公开类型*\n\n现在，考虑如果给\
  \ Unit 添加一个私有字段会发生什么。即使你添加的字段是私有的，这一更改仍会破坏用户代码，因为用户依赖的构造函数消失了。类似地，请考虑代码清单 4-4 中的代码及其用法。\n\
  \n```\n```rust\n// in your interface\npub struct Unit { pub field: bool };\n// in\
  \ user code\nfn is_true(u: lib::Unit) -> bool {\n    matches!(u, Unit { field: true\
  \ })\n}\n```\n```\n\n*代码清单 4-4：访问单个公共字段的用户代码*\n\n在这里，给 Unit 添加私有字段同样会破坏用户代码，这次是因为\
  \ Rust 的穷尽模式匹配检查逻辑能够看到用户看不到的部分接口。它能够识别出还有更多字段，即使这些字段用户代码无法访问，也会将用户的模式视为不完整而拒绝。如果我们将元组结构体转换为具有命名字段的普通结构体，也会出现类似的问题：即使字段本身完全相同，任何旧模式都将不再适用于新的类型定义。\n\
  \nRust 提供了 `#[non_exhaustive]` 属性来帮助缓解这些问题。你可以将它添加到任何类型定义上，编译器将禁止在该类型上使用隐式构造函数（如\
  \ `lib::Unit { field1: true }`）和非穷尽模式匹配（即没有尾部 `, ..` 的模式）。如果你怀疑某个特定类型将来可能会被修改，添加这个属性是很好的做法。不过，它确实会限制用户代码，例如剥夺用户依赖穷尽模式匹配的能力，因此如果你认为某个类型可能会保持稳定，应避免添加它。\n\
  \n## trait 实现\n\n回顾第 3 章，Rust 的一致性规则禁止同一类型对同一 trait 有多个实现。由于我们不知道下游代码可能已经添加了哪些实现，为现有\
  \ trait 添加覆盖实现通常是一个破坏性变更。同样，为现有类型实现外部 trait，或为外部类型实现现有 trait，也是如此——在这两种情况下，外部 trait\
  \ 或类型的所有者可能会同时添加一个冲突的实现，因此这必然是一个破坏性变更。\n\n移除一个 trait 实现是破坏性变更，但为新类型实现 trait 从来都不是问题，因为没有任何\
  \ crate 会包含与该类型冲突的实现。\n\n也许与直觉相反，你也需要小心为现有类型实现任何 trait。为了解原因，请考虑代码清单 4-5 中的代码。\n\
  \n```\n// crate1 1.0\npub struct Unit;\npub trait Foo1 { fn foo(&self) }\n// note\
  \ that Foo1 is not implemented for Unit\n\n// crate2; depends on crate1 1.0\nuse\
  \ crate1::{Unit, Foo1};\ntrait Foo2 { fn foo(&self) }\nimpl Foo2 for Unit { ...\
  \ }\nfn main() {\n    Unit.foo();\n}\n```\n\n*代码清单 4-5：为现有类型实现 trait 可能会导致问题。*\n\
  \n如果你在 crate1 中为 Unit 添加 impl Foo1 for Unit，但不将其标记为破坏性变更，下游代码将突然无法编译，因为对 foo 的调用现在变得不明确了。如果下游\
  \ crate 使用了通配符导入（use crate1::*），这种情况甚至可能适用于新公共 trait 的实现。如果你提供了一个 prelude 模块，并指示用户使用通配符导入，那么你尤其需要牢记这一点。\n\
  \n对现有 trait 的大多数更改也都是破坏性变更，例如更改方法签名或添加新方法。更改方法签名会破坏该 trait 的所有实现，还可能破坏许多使用；而添加新方法“只是”破坏所有实现。不过，添加带有默认实现的新方法是可以的，因为现有实现将继续适用。\n\
  \n我在这里说“一般而言”和“大多数”，是因为作为接口作者，我们有一个工具可以用来规避其中一些规则：密封 trait。密封 trait 是一种其他 crate\
  \ 只能使用而不能实现的 trait。这立即使许多破坏性变更变为非破坏性。例如，你可以向密封 trait 添加新方法，因为你已知当前 crate 之外没有需要考虑的实现。类似地，你可以为新的外部类型实现密封\
  \ trait，因为你已知定义该类型的外部 crate 不可能添加冲突的实现。\n\n密封 trait 最常见的用途是用于派生 trait——即为实现了特定其他\
  \ trait 的类型提供覆盖实现的 trait。只有在密封某个 trait 对外部 crate 没有意义时，才应该将其密封。\n\n如果你的 crate 从\
  \ itercrate 1.0 升级到 itercrate 2.0，但除此之外没有其他变化，本清单中的代码将不再编译。即使没有类型发生变化，编译器也会（正确地）认为\
  \ itercrate1.0::Empty 和 itercrate2.0::Empty 是不同的类型。因此，你不能将后者赋值给前者，这会使你的接口发生破坏性变更。\n\
  \n为了缓解此类问题，通常最好使用 newtype 模式包装外部类型，然后只暴露你认为有用的外部类型部分。在许多情况下，你可以完全避免 newtype 包装，使用\
  \ impl Trait 只向调用者提供最小的契约。承诺得越少，破坏性变更就越少。\n\n## SemVer 技巧\n\nitercrate 这个例子可能会让你感到不快。如果\
  \ Empty 类型没有改变，那么为什么编译器不允许任何使用它的代码继续工作，无论代码使用的是 1.0 还是 2.0 版本？答案是……很复杂。归根结底，Rust\
  \ 编译器并不会仅仅因为两个类型具有相同的字段就认为它们是同一类型。举个简单的例子，假设 itercrate 2.0 为 Empty 添加了 #[derive(Copy)]。现在，根据你使用的是\
  \ 1.0 还是 2.0，该类型会突然具有不同的移动语义！而针对其中一种版本编写的代码，将与另一种版本不兼容。\n\n这个问题往往出现在大型、广泛使用的库中，在这些库中，随着时间的推移，破坏性变更很可能不得不发生在\
  \ crate 的某个地方。不幸的是，语义化版本控制发生在 crate 级别，而不是类型级别，因此任何一处的破坏性变更都是全局性的破坏性变更。\n\n但并非全无希望。几年前，David\
  \ Tolnay（serde 的作者，同时也是 Rust 生态众多其他贡献的作者）想出了一个巧妙的方法来应对这种情况。他称之为“semver 技巧”。其想法很简单：如果某个类型\
  \ T 在一次破坏性变更中保持不变（例如从 1.0 到 2.0），那么在发布 2.0 之后，你可以发布一个新的 1.0 次要版本，该版本依赖 2.0，并将 T\
  \ 替换为从 2.0 重新导出的 T。\n\n通过这样做，你确保了在两个主版本中实际上只有一个类型 T。这反过来意味着，任何依赖 1.0 的 crate 都将能够使用来自\
  \ 2.0 的 T，反之亦然。而且由于这只发生在你使用此技巧显式选择的类型上，那些实际上属于破坏性的变更仍将继续保持破坏性。\n\n## 自动 trait\n\n\
  Rust 有少数几个 trait 会根据每个类型所包含的内容自动为每个类型实现。其中与本次讨论最相关的是 Send 和 Sync，尽管 Unpin、Sized\
  \ 和 UnwindSafe\n\n## 总结\n\n在本章中，我们探讨了设计 Rust 接口的众多方面，无论它是用于外部使用，还是仅作为你的 crate 内不同模块之间的抽象边界。我们讲到了许多具体的陷阱和技巧，但最终，指导你思考的应该是高层原则：你的接口应当不意外、灵活、清晰且克制。在下一章中，我们将深入探讨如何在\
  \ Rust 代码中表示和处理错误。\n\n\n\n"
- "# 5 错误处理\n\n## 错误处理\n\n![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_60_0.png)\n\n对于除最简单程序之外的所有程序，你都会有一些可能失败的方法。在本章中，我们将探讨表示、处理和传播这些失败的不同方式，以及每种方式的优缺点。我们将首先探索表示错误的不同方法，包括枚举和类型擦除，然后研究一些需要不同表示技术的特殊错误情况。接下来，我们将了解处理错误的各种方式以及错误处理的未来。\n\
  \n值得注意的是，Rust 中错误处理的最佳实践仍然是一个活跃的讨论话题，而在撰写本文时，生态系统尚未形成统一的方法。因此，本章将侧重于基本原理和技术，而不是推荐特定的\
  \ crate 或模式。\n\n`source` 的实现很直接：我们对 `self` 进行匹配，提取并返回内部的 `std::io::Error`。\n\n其次，你的类型应该同时实现\
  \ `Display` 和 `Debug`，以便调用者可以有意义地打印你的错误。如果你实现了 `Error` trait，这是必需的。一般来说，`Display`\
  \ 的实现应该提供一行关于出错原因的描述，并且可以很容易地嵌入到其他错误消息中。显示格式应该使用小写字母，且不带结尾标点，以便很好地融入其他更大的错误报告中。`Debug`\
  \ 则应提供更具描述性的错误信息，包括可能有助于追踪错误原因的辅助信息，例如端口号、请求标识符、源代码位置等。\n\n> **注意** 在较旧的 Rust 代码中，你可能会看到对\
  \ `Error::description` 方法的引用，但该方法已被弃用，取而代之的是 `Display`。\n\n第三，你的类型如果可能的话，应该同时实现\
  \ `Send` 和 `Sync`，以便用户能够在线程之间共享错误。如果你的错误类型不是线程安全的，你会发现几乎不可能在多线程上下文中使用你的 crate。实现\
  \ `Send` 和 `Sync` 的错误类型也更容易与非常常见的 `std::io::Error` 类型一起使用，后者能够包装实现了 `Error`、`Send`\
  \ 和 `Sync` 的错误。当然，并非所有错误类型都能合理地实现 `Send` 和 `Sync`，例如它们如果与特定的线程局部资源绑定，那也没关系。你可能也不会将这些错误跨线程发送。然而，在将\
  \ `Rc<String>` 和 `RefCell<bool>` 类型放入错误之前，你需要意识到这一点。\n\n最后，在可能的情况下，你的错误类型应该是 `'static`。这样做最直接的好处是，它能让调用者更容易将你的错误向上传播到调用栈，而不会遇到生命周期问题。它还能让你的错误类型更容易与类型擦除的错误类型一起使用，我们稍后会看到。\n\
  \n## 不透明错误\n\n现在让我们考虑另一个例子：一个图像解码库。你给这个库一堆要解码的字节，它向你提供各种图像操作方法。如果解码失败，用户需要能够弄清楚如何解决问题，因此必须理解原因。但是，原因是图像头中的大小字段无效，还是压缩算法无法解压缩某个块，这重要吗？可能并不重要——即使应用程序知道确切原因，它也无法从任何一种情况中有意义地恢复。在这种情况下，作为库作者，你可能更希望提供一个单一的、不透明的错误类型。这也会让你的库更好用一些，因为到处都是只有一种错误类型。这种错误类型应该实现\
  \ `Send`、`Debug` 和 `Display`，并且可能还应该实现 `Error`，但除此之外，调用者不需要知道更多。你可以在内部表示更细粒度的错误状态，但没有必要向库的用户暴露这些。这样做只会不必要地增加\
  \ API 的规模和复杂性。\n\n你的不透明错误类型具体应该是什么，主要取决于你。它可以只是一个所有字段都私有的类型，只暴露有限的用于显示和检查错误的方法；也可以是一种严重类型擦除的错误类型，例如\
  \ `Box<dyn Error + Send + Sync + 'static>`，它除了表明自己是一个错误之外不透露任何信息，通常根本不让你的用户进行内省。决定在类型擦除的道路上走多远，主要取决于错误除了描述之外是否还有其他值得关注的信息。使用\
  \ `Box<dyn Error>` 时，你的用户几乎没有选择，只能向上冒泡你的错误。如果这个错误确实没有对用户有价值的信息，比如它只是一个动态错误消息，或者是程序深处大量不相关错误之一，那这可能没问题。但如果错误有一些有趣的方面，比如行号或状态码，你可能希望通过一个具体但不透明的类型来暴露这些。\n\
  \n> **注意**\n\n> 一般来说，社区共识是错误应该是罕见的，因此不应给“快乐路径”增加太多成本。出于这个原因，错误通常放在指针类型后面，例如 `Box`\
  \ 或 `Arc`。这样，它们不太可能给它们所在的整个 `Result` 类型增加太多体积。\n\n使用类型擦除的错误的一个好处是，它允许你轻松地组合来自不同来源的错误，而无需引入额外的错误类型。也就是说，类型擦除的错误通常可以很好地组合。如果你编写一个返回类型为\
  \ `Box<dyn Error + ...>` 的函数，那么你几乎可以在该函数内不加区分地对各种不同的错误使用 `?`，它们都会被转换成这个共同的错误类型。\n\
  \n`Box<dyn Error + Send + Sync + 'static>` 上的 `'static` 约束值得在类型擦除的语境下多花一些时间讨论。我在上一节中提到，它有助于让调用者传播错误，而不必担心失败方法引用的生命周期，但它还有一个更大的用途：支持向下转型（downcasting）。向下转型是将一种类型的项转换为更具体的类型的过程。这是\
  \ Rust 在少数几个允许你在运行时访问类型信息的情况之一；它是动态语言通常提供的更通用的类型反射的一个有限案例。在错误的语境中，向下转型允许用户将一个 `dyn\
  \ Error` 转换为具体的底层错误类型——前提是该 `dyn Error` 最初就是那个类型。例如，如果用户收到的错误是 `std::io::ErrorKind::WouldBlock`\
  \ 类型的 `std::io::Error`，他们可能希望采取某种特定操作，但在其他任何情况下都不会采取同样的操作。如果用户得到一个 `dyn Error`，他们可以使用\
  \ `Error::downcast_ref` 尝试将错误向下转型为 `std::io::Error`。`downcast_ref` 方法返回一个 `Option`，告诉用户向下转型是否成功。这里有一个关键观察：只有当目标类型参数为\
  \ `'static` 时，`downcast_ref` 才有效。如果我们返回一个不是 `'static` 的不透明 `Error`，就会剥夺用户进行这种错误内省的能力（如果他们希望这样做的话）。\n\
  \n生态系统中对于库的类型擦除错误（或更一般地说，其类型擦除类型）是否属于其公开且稳定的 API 存在一些分歧。也就是说，如果你的库中的方法 `foo` 返回\
  \ `lib::MyError` 作为 `Box<dyn Error>`，那么将 `foo` 改为返回不同的错误类型算不算是破坏性变更？类型签名没有改变，但用户可能已经编写了假设他们可以使用向下转型将该错误转换回\
  \ `lib::MyError` 的代码。我对此事的看法是，你选择返回 `Box<dyn Error>`（而不是 `lib::MyError`）是有原因的，除非有明确文档说明，否则这并不能保证向下转型的任何具体内容。\n\
  \n你可能想知道 `Error::downcast_ref` 如何保证安全。也就是说，它如何知道提供的 `dyn Error` 参数确实是指定类型 `T`？标准库中甚至有一个名为\
  \ `Any` 的 trait，它针对任何类型实现，并为 `dyn Any` 实现了 `downcast_ref`——这怎么会没问题呢？答案在于编译器支持的类型\
  \ `std::any::TypeId`，它可以让你获得任何类型的唯一标识符。`Error` trait 有一个名为 `type_id` 的隐藏的提供方法，其默认实现是返回\
  \ `TypeId::of::<Self>()`。类似地，`Any` 有一个对 `T` 的 blanket 实现 `impl Any for T`，在该实现中，它的\
  \ `type_id` 返回同样的值。在这些 `impl` 块的语境中，`Self` 的具体类型是已知的，因此这个 `type_id` 就是真实类型的类型标识符。这提供了\
  \ `downcast_ref` 所需的全部信息。`downcast_ref` 调用 `self.type_id`，它会通过动态大小类型的虚表（vtable，见第\
  \ 3 章）转发到底层类型的实现，并将该结果与所提供的向下转型类型的类型标识符进行比较。如果它们匹配，那么 `dyn Error` 或 `dyn Any` 背后的类型确实就是\
  \ `T`，从一个引用转换为另一个引用就是安全的。\n\n## 特殊错误情况\n\n有些函数可能会失败，但在失败时无法返回任何有意义的错误。从概念上讲，这些函数的返回类型是\
  \ `Result<T, ()>`。在某些代码库中，你可能会看到这种类型被表示为 `Option<T>`。虽然两者对于这类函数的返回类型都是合理的选择，但它们传达的语义含义不同，你通常应该避免将\
  \ `Result<T, ()>` “简化”为 `Option<T>`。`Err(())` 表示操作失败，应该重试、报告或以其他方式特殊处理。另一方面，`None`\
  \ 仅表示函数没有可返回的内容；它通常不被视为特殊情况或需要处理的情况。你可以从 `Result` 类型上的 `#[must_use]` 注解中看出这一点——当你得到\
  \ `Result` 时，语言期望处理这两种情况都很重要，而对于 `Option`，实际上两种情况都不需要处理。\n\n> **注意** 你还应该记住，`()`\
  \ 没有实现 `Error` trait。这意味着它不能被类型擦除为 `Box<dyn Error>`，并且在使用 `?` 时会有点麻烦。因此，在这些情况下，通常最好定义你自己的单元结构体类型，为它实现\
  \ `Error`，并将其作为错误而不是 `()` 使用。\n\n\n\n\n我们是否需要 Into，以及反过来呢？有几个原因，但让我们从历史原因开始：在 Rust\
  \ 早期，由于第 3 章讨论的相干性规则，根本不可能只保留一个。或者更具体地说，是相干性规则曾经的样子。\n\n假设你想在自己在 crate 中定义的一些本地类型和标准库中的某些类型之间实现双向转换。你可以明确地编写\
  \ `impl<T> From<Vec<T>> for MyType<T>` 和 `impl<T> Into<Vec<T>> for MyType<T>`。但如果你只有\
  \ From 或 Into，你就必须编写 `impl<T> From<MyType<T>> for Vec<T>` 或 `impl<T> Into<MyType<T>>\
  \ for Vec<T>`。然而，编译器过去会拒绝这些实现！只有从 Rust 1.41.0 开始，在相干性规则中加入了被覆盖类型的例外后，它们才是合法的。在此更改之前，必须同时拥有两个\
  \ trait。由于大量 Rust 代码是在 Rust 1.41.0 之前编写的，因此现在这两个 trait 都不能被移除。\n\n除此历史事实之外，即使我们今天可以从零开始，也有很好的人体工学原因需要同时保留这两个\
  \ trait。在不同情况下，使用其中一个往往会显著更容易。例如，如果你正在编写一个方法，该方法接受可以转换为 Foo 的类型，你更愿意写 `fn(impl Into<Foo>)`\
  \ 还是 `fn<T>(T) where Foo: From<T>`？反过来，要将字符串转换为语法标识符，你更愿意写 `Ident::from(\"foo\"\
  )` 还是 `<_ as Into<Ident>>::into(\"foo\")`？这两个 trait 都有其用途，我们最好同时保留它们。\n\n既然我们同时拥有两者，你可能会想知道在今天的代码中应该使用哪一个。答案其实很简单：实现\
  \ From，并在边界中使用 Into。原因在于 Into 对任何实现了 From 的 T 都有一个 blanket 实现，因此无论类型是否显式实现了 From\
  \ 或 Into，它都实现了 Into！\n\n当然，正如简单的事情经常会发生，故事并没有就此结束。由于编译器在使用 Into 作为边界时经常需要“经过” blanket\
  \ 实现，判断一个类型是否实现了 Into 的推理比判断它是否实现了 From 要复杂得多。在某些情况下，编译器还不够聪明，无法弄清这个谜题。因此，截至撰写时，`?`\
  \ 运算符使用的是 From，而不是 Into。大多数时候这并不会产生差异，因为大多数类型都实现了 From，但如果有差异，意味着来自旧库且仅实现 Into 而非\
  \ From 的错误类型可能无法与 `?` 一起使用。随着编译器变得更聪明，我可能会“升级”为使用 Into，到那时这个问题就会消失，但目前我们只能这样。\n\n\
  `?` 的第二个需要注意的方面是，这个运算符实际上只是对一个暂定名为 Try 的 trait 的语法糖。截至撰写时，Try trait 尚未稳定，但到你阅读本文时，很可能它或非常相似的东西已经被确定。由于细节尚未全部确定，我只会给你介绍\
  \ Try 的工作原理的大致轮廓，而不是完整的方法签名。其核心是，Try 定义了一个包装类型，其状态要么是进一步计算有用的状态（happy path），要么是无用的状态。你们中的一些人会正确地想到\
  \ monads，但我们在这里不会探讨这种联系。例如，在 `Result<T, E>` 的情况下，如果你有一个 `Ok(t)`，你可以通过解包 `t` 在 happy\
  \ path 上继续下去。另一方面，如果你有一个 `Err(e)`，你希望立即停止执行并产生错误值，因为由于你没有 `t`，进一步的计算是不可能的。\n\nTry\
  \ 的有趣之处在于它适用于的不仅仅是 `Result`。例如，`Option<T>` 也遵循相同的模式——如果你有一个 `Some(t)`，你可以在 happy\
  \ path 上继续，而如果你有一个 `None`，你希望产生 `None` 而不是继续。这种模式扩展到更复杂的类型，例如 `Poll<Result<T, E>>`，其\
  \ happy path 类型是 `Poll<T>`，这使得 `?` 应用于比你预期更多的情况下。当 Try 稳定时，我们可能会看到 `?` 开始与各种类型一起使用，以使我们的\
  \ happy path 代码更优雅。\n\n`?` 运算符已经可以在易错函数、doctest 和 `fn main` 中使用。为了发挥其全部潜力，我们还需要一种方法来限定这种错误处理。例如，考虑清单\
  \ 5-2 中的函数。\n\n```\n```rust\nfn do_the_thing() -> Result<(), Error> {\n    let thing\
  \ = Thing::setup()?;\n    // .. code that uses thing and ? ..\n    thing.cleanup();\n\
  \    Ok(())\n}\n```\n```\n\n*清单 5-2：使用 `?` 运算符的多步骤易错函数*\n\n这不会按预期工作。setup 和 cleanup\
  \ 之间的任何 `?` 都会导致整个函数提前返回，从而跳过清理代码！这正是 *try blocks* 旨在解决的问题。try block 基本上像一个单次迭代的循环，其中\
  \ `?` 使用 `break` 而不是 `return`，并且块的最终表达式具有隐式的 break。我们现在可以修复清单 5-2 中的代码以始终执行清理，如清单\
  \ 5-3 所示。\n\n```\n```rust\nfn do_the_thing() -> Result<(), Error> {\n    let thing\
  \ = Thing::setup()?;\n    let r = try {\n        // .. code that uses thing and\
  \ ? ..\n    };\n    thing.cleanup();\n    r\n}\n```\n```\n\n*清单 5-3：始终自行清理的多步骤易错函数*\n\
  \n截至撰写时，try blocks 也不稳定，但对其有用性已有足够的共识，它们很可能会以与此处描述类似的形式发布。\n\n## 摘要\n\n本章介绍了在 Rust\
  \ 中构造错误类型的两种主要方式：枚举和擦除。我们研究了你可能想要使用每种方式的情况以及各自的优点和缺点。我们还查看了一些 `?` 运算符幕后方面的内容，并考虑了\
  \ `?` 未来可能变得更加有用的方式。在下一章中，我们将从代码中后退一步，看看如何 *结构化* 一个 Rust 项目。我们将研究特性标志、依赖管理、版本控制，以及如何使用工作区和子\
  \ crate 管理更复杂的 crate。下一页见！\n\n## 项目结构\n\n![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_70_0.png)\n\
  \n本章为结构化你的 Rust 项目提供了一些思路。对于简单项目，cargo new 设置的结构很可能就是你几乎不会考虑的东西。你可能会添加一些模块来拆分代码，并为额外功能添加一些依赖，但就这样了。然而，随着项目规模和复杂度的增长，你会发现自己需要超越这一点。也许你的\
  \ crate 的编译时间变得难以控制，或者你需要条件依赖，或者你需要更好的持续集成策略。在本章中，我们将研究 Rust 语言，特别是 Cargo 提供的一些工具，使管理这些事情变得更容易。\n\
  \n## 特性\n\n特性是 Rust 自定义项目的首要工具。核心来说，一个特性只是一个构建标志，crate 可以将其传递给其依赖项以添加可选功能。特性本身没有语义含义——相反，你选择特性对你的\
  \ crate 的含义。\n\n通常，我们以三种方式使用特性：启用可选依赖、条件包含 crate 的额外组件，以及增强代码的行为。请注意，这三种用途都是增量的；特性可以增加\
  \ crate 的功能，但它们通常不应该做诸如移除模块或替换类型或函数签名之类的事情。这源于一个原则：如果开发者对其 Cargo.toml 做出简单更改，例如添加新依赖或启用特性，这不应该使他们的\
  \ crate 停止编译。如果一个 crate 具有互斥的特性，这一原则很快就会被破坏——如果 crate A 依赖于 crate C 的一个特性，而 crate\
  \ B 依赖于 C 的另一个互斥特性，那么添加对 crate B 的依赖就会破坏 crate A！因此，我们通常遵循的原则是：如果 crate A 在某组特性下可以编译\
  \ crate C，那么它也应该在 crate C 的所有特性都启用时编译。\n\nCargo 非常重视这一原则。例如，如果两个 crate（A 和 B）都依赖于\
  \ crate C，但它们各自在 C 上启用了不同的特性，Cargo 只会编译一次 crate C，并使用 A 或 B 所需的所有特性。也就是说，它会取 A 和\
  \ B 对 C 请求的特性的并集。由于这个原因，很难为 Rust crate 添加互斥特性；很可能某些两个依赖项会以不同的特性依赖于该 crate，如果这些特性是互斥的，下游\
  \ crate 将无法构建。\n\n> NOTE\n> 我强烈建议你配置你的持续集成基础设施以检查你的 crate 在其特性的任何组合下都能编译。有助于做到这一点的工具是\
  \ cargo-hack，你可以在 https://github.com/taiki-e/cargo-hack 上找到它。\n\n## 定义和包含特性\n\n\
  特性在 Cargo.toml 中定义。清单 6-1 显示了一个名为 foo 的 crate 的示例，其中有一个简单的特性可启用可选依赖 syn。\n\n```\n\
  [package]\nname = \"foo\"\n...\n[features]\nderive = [\"syn\"]\n\n[dependencies]\n\
  syn = { version = \"1\", optional = true }\n```\n\n清单 6-1：启用可选依赖的特性\n\n当 Cargo 编译此\
  \ crate 时，默认情况下不会编译 syn crate，从而减少编译时间（通常显著）。只有当下游 crate 需要使用 derive 特性启用的 API 并明确选择加入时，才会编译\
  \ syn crate。清单 6-2 显示了这样的下游 crate bar 如何启用 derive 特性，从而包含 syn 依赖。\n\n```\n[package]\n\
  name = \"bar\"\n...\n```\n\n\n\n```toml\n[dependencies]\nfoo = { version = \"1\"\
  , features = [\"derive\"] }\n```\n\nListing 6-2: Enabling a feature of a dependency\n\
  \n某些特性被使用得如此频繁，以至于让一个 crate 选择退出它们而不是选择进入它们更有意义。为了支持这一点，Cargo 允许你为一个 crate 定义一组默认特性。同样，它也允许你选择退出依赖项的默认特性。Listing\
  \ 6-3 显示了 foo 如何使其 derive 特性默认启用，同时也选择退出 syn 的某些默认特性，而只启用其 derive 特性所需的特性。\n\n```toml\n\
  [package]\nname = \"foo\"\n...\n[features]\nderive = [\"syn\"]\ndefault = [\"derive\"\
  ]\n\n[dependencies.syn]\nversion = \"1\"\ndefault-features = false\nfeatures = [\"\
  derive\", \"parsing\", \"printing\"]\noptional = true\n```\n\nListing 6-3: Adding\
  \ and opting out of default features, and thus optional dependencies\n\n这里，如果一个\
  \ crate 依赖于 foo 并且没有明确选择退出默认特性，它也将编译 foo 的 syn 依赖项。进而，syn 将仅使用列出的三个特性构建，而没有其他特性。以这种方式选择退出默认特性，并只选择你需要的特性，是减少编译时间的好方法！\n\
  \n## OPTIONAL DEPENDENCIES AS FEATURES\n\n当你定义一个特性时，等号后面跟随的列表本身就是一个特性列表。这乍一听可能有点奇怪——在\
  \ Listing 6-3 中，syn 是一个依赖项，而不是一个特性。事实证明，Cargo 会将每个可选依赖项都作为一个与依赖项同名的特性。你会在尝试添加一个与可选依赖项同名的特性时看到这一点；Cargo\
  \ 不允许这样做。Cargo 中为特性与依赖项提供不同命名空间的支持正在进行中，但在写作时尚未稳定。在此期间，如果你想拥有一个以依赖项命名的特性，你可以使用 package\
  \ = \"\" 重命名依赖项以避免名称冲突。特性启用的特性列表也可以包括依赖项的特性。例如，你可以写 derive = [\"syn/derive\"] 来让你的\
  \ derive 特性启用 syn 依赖项的 derive 特性。\n\nunit; Rust 编译器将一个 crate 基本上视为一个作为一个整体编译的大型源文件，最终转换为单个二进制输出（要么是二进制文件，要么是库）。\n\
  \n虽然这简化了编译器的许多方面，但也意味着大型 crate 在使用时会很痛苦。如果你更改了一个单元测试、一条注释或应用程序某一部分的类型，编译器必须重新评估整个\
  \ crate 以确定是否发生了变化。内部，编译器实现了许多机制来加快这一过程，例如增量重新编译和并行代码生成，但最终你的 crate 的大小是项目编译时间长短的一个重要因素。\n\
  \n因此，随着项目的增长，你可能希望将其拆分为多个相互依赖的 crate。Cargo 提供了你需要的功能来让这变得方便：工作区。*工作区* 是一组 crate（通常称为\
  \ *子 crate*），它们由一个顶层的 *Cargo.toml* 文件绑定在一起，如 Listing 6-4 所示。\n\n```toml\n[workspace]\n\
  members = [\n    \"foo\",\n    \"bar/one\",\n    \"bar/two\",\n]\n```\n\n*Listing\
  \ 6-4: A workspace Cargo.toml*\n\nmembers 数组是包含工作区中每个 crate 的目录列表。这些 crate 在各自的子目录中都有自己的\
  \ *Cargo.toml* 文件，但它们共享单个 *Cargo.lock* 文件和单个输出目录。crate 名称不需要与 members 中的条目匹配。工作区中的\
  \ crate 通常、但不是必须共享一个名称前缀，通常选择为“主”crate 的名称。例如，在 tokio crate 中，成员被称为 tokio、tokio-test、tokio-macros\
  \ 等。\n\n工作区最重要特性之一是，你可以通过在工作区根目录调用 cargo 来与工作区的所有成员交互。想检查它们是否都能编译？cargo check 会检查它们全部。想运行所有测试？cargo\
  \ test 会测试它们全部。这并不像将所有内容放在一个 crate 中那样方便，所以不要把所有东西都拆分成微小的 crate，但它是一个相当好的近似。\n\n\
  > **NOTE**  \n> *Cargo commands will generally do the “right thing” in a workspace.\
  \ If you ever need to disambiguate, such as if two workspace crates both have a\
  \ binary by the same name, use the -p flag (for package). If you are in the subdirectory\
  \ for a particular workspace crate, you can pass --workspace to perform the command\
  \ for the entire workspace instead.*\n\n一旦你有了包含工作区成员数组的工作区级 *Cargo.toml*，你就可以使用路径依赖让你的\
  \ crate 互相依赖，如 Listing 6-5 所示。\n\n```toml\n[patch.crates-io]\n# use a local (presumably\
  \ modified) source\nregex = { path = \"/home/jon/regex\" }\n# use a modification\
  \ on a git branch\nserde = { git = \"https://github.com/serde-rs/serde.git\", branch\
  \ = \"faster\" }\n# patch a git dependency\n[patch.'https://github.com/jonhoo/project.git']\n\
  project = { path = \"/home/jon/project\" }\n```\n\nListing 6-6: Overriding dependency\
  \ sources in Cargo.toml using [patch]\n\n即使你修补了一个依赖项，Cargo 也会注意检查 crate 版本，以确保你不会意外地修补了\
  \ crate 的错误主版本。如果你由于某种原因在传递依赖中依赖于同一 crate 的多个主版本，你可以通过为它们提供不同的标识符来分别修补它们，如 Listing\
  \ 6-7 所示。\n\n```toml\n[patch.crates-io]\nnom4 = { path = \"/home/jon/nom4\", package\
  \ = \"nom\" }\nnom5 = { path = \"/home/jon/nom5\", package = \"nom\" }\n```\n\n\
  Listing 6-7: Overriding multiple versions of the same crate in Cargo.toml using\
  \ [patch]\n\nCargo 会查看每个路径中的 Cargo.toml，意识到 /nom4 包含主版本 4 而 /nom5 包含主版本 5，并相应地修补这两个版本。package\
  \ 关键字告诉 Cargo 在两种情况下都按名称 nom 查找 crate，而不是像默认情况下那样使用依赖项标识符（左侧的部分）。你也可以在常规依赖项中使用 package\
  \ 这种方式来重命名依赖项！\n\n请记住，补丁在你发布 crate 时上传的包中不会被考虑。依赖于你的 crate 的 crate 只会使用它自己的 [patch]\
  \ 部分（可能为空），而不是你的 crate 的！\n\n## CRATES VS. PACKAGES\n\n你可能会想知道 package 和 crate 有什么区别。这些术语在非正式场合经常互换使用，但在\
  \ Rust 编译器、Cargo、crates.io 或其他地方谈论时，它们也有特定的定义会有所不同。我个人认为 crate 是一个从根 .rs 文件开始的 Rust\
  \ 模块层次结构（你可以在其中使用 crate 级属性如 #![feature]）——通常是像 lib.rs 或 main.rs 这样的文件。相比之下，package\
  \ 是一组 crate 和元数据，本质上就是 Cargo.toml 文件所描述的所有内容。这可能包括一个库 crate、多个二进制 crate、一些集成测试 crate，甚至多个本身具有\
  \ Cargo.toml 文件的工作区成员。\n\n## [profile]\n\n[profile] 部分允许你向 Rust 编译器传递额外的选项，以改变它编译\
  \ crate 的方式。这些选项主要分为三类：性能选项、调试选项以及以用户定义方式改变代码行为的选项。它们在调试模式或发布模式下编译时都有不同的默认值（也存在其他模式）。\n\
  \n三个主要的性能选项是 opt-level、codegen-units 和 lto。opt-level 选项通过告诉编译器以多大的激进程度优化你的程序来调整运行时性能（0\
  \ 表示“完全不优化”，3 表示“尽可能多地优化”）。设置越高，你的代码优化程度越高，这 *可能* 使其运行更快。额外的优化是以更高的编译时间为代价的，这就是为什么优化通常只在发布构建中启用。\n\
  \n> 你也可以将 opt-level 设置为 \"s\" 以优化二进制大小，这在嵌入式平台上可能很重要。\n\ncodegen-units 选项是关于编译时\
  \ *性能*。它告诉编译器允许将单个 crate 的编译拆分为多少个独立的编译任务（*代码生成单元*）。大型 crate 的编译拆分为越多部分，编译速度越快，因为更多线程可以帮助并行编译\
  \ crate。不幸的是，为了实现这种加速，线程需要在很大程度上独立工作，这意味着代码优化会受损。例如，想象一下在一个线程中编译的 crate 段可以从另一个段中的代码内联中受益——由于这两个段是独立的，这种内联就无法发生！因此，这个设置是在编译时性能和运行时性能之间权衡。默认情况下，Rust\
  \ 在调试模式下使用基本上无限制数量的代码生成单元（基本上是“尽可能快地编译”），而在发布模式下使用较少数量（写作时为 16）。\n\nlto 设置切换 *链接时优化\
  \ (LTO)*，它使编译器（如果你想在技术上说，是链接器）能够联合优化原本单独编译的程序的各个部分，即 *编译单元*。LTO 的确切细节超出了本书的范围，但基本思想是每个编译单元的输出都包含有关该单元中代码的信息。所有单元编译完成后，链接器会再次遍历所有单元，并使用这些额外信息来优化组合的编译代码。这一额外遍历会增加编译时间，但可以恢复大部分由于将编译拆分为更小部分而可能丢失的运行时性能。特别是，LTO\
  \ 可以为可能从跨 crate 优化中受益的性能敏感程序提供显著的性能提升。但要注意，跨 crate 的 LTO 会大大增加你的编译时间。\n\nRust 默认在每个\
  \ crate 内的所有 codegen units 之间执行 LTO，以试图弥补使用\n\n\n许多代码生成单元。由于 LTO 只在每个 crate 内部执行，而不是跨\
  \ crate 执行，因此这一额外遍并不会太繁重，增加的编译时间也应低于使用大量代码生成单元所节省的时间。Rust 还提供了一种称为 thin LTO 的技术，它可以让\
  \ LTO 遍在很大程度上并行化，代价是会错过一些“完整” LTO 遍本可以发现的优化。\n\n> 注意：LTO 在许多情况下也可以跨外部函数接口边界进行优化。更多细节请参阅\
  \ `linker-plugin-lto` rustc 标志。\n\n[profile] 部分还支持有助于调试的标志，例如 debug、debug-assertions\
  \ 和 overflow-checks。debug 标志告诉编译器在编译后的二进制文件中包含调试符号。这会增大二进制文件的大小，但意味着在回溯和剖析中你得到的是函数名称等信息，而不仅仅是指令地址。debug-assertions\
  \ 标志会启用 debug_assert! 宏以及其他相关的调试代码，这些代码在其他情况下不会编译（通过 cfg(debug_assertions)）。此类代码可能会让你的程序运行得更慢，但能让你更容易在运行时捕获可疑行为。overflow-checks\
  \ 标志，顾名思义，会对整数运算启用溢出检查。这会让它们变慢（你注意到这里的规律了吗？）但能帮助你及早发现棘手的 bug。默认情况下，调试模式下这些全部启用，发布模式下全部禁用。\n\
  \n## [profile.*.panic]\n\n[profile] 部分还有另一个值得拥有自己小节的标志：panic。该选项决定程序中的代码直接或间接（例如通过\
  \ unwrap）调用 panic! 时会发生什么。你可以将 panic 设置为 unwind（大多数平台上的默认值）或 abort。我们会在第 10 章更多地讨论\
  \ panic 和展开，但我这里先做一个简要总结。\n\n通常，在 Rust 中，当你的程序 panic 时，发生 panic 的线程会开始展开其栈。你可以把展开想象为从当前函数递归地强制返回到该线程栈底部。也就是说，如果\
  \ main 调用了 foo，foo 调用了 bar，bar 调用了 baz，那么 baz 中的 panic 会强制从 baz 返回，然后 bar、foo，最后从\
  \ main 返回，导致程序退出。发生展开的线程会正常释放栈上的所有值，这使这些值有机会清理资源、报告错误等。这给了运行中的系统在 panic 时优雅退出的机会。\n\
  \n当线程 panic 并展开时，其他线程不受影响地继续运行。只有在运行 main 的线程退出时（如果它退出），程序才会终止。也就是说，panic 通常被隔离在发生\
  \ panic 的线程中。\n\n这意味着展开是一把双刃剑；程序带着一些失败的组件勉强运行，这可能导致各种奇怪的行为。例如，想象一个线程在更新一个 Mutex\
  \ 中的状态进行到一半时发生 panic。任何随后获取该 Mutex 的线程都必须准备好处理状态可能处于部分更新、不一致状态的情况。因此，一些同步原语\n\n\
  （如 Mutex）会记住上次被访问时是否发生过 panic，并将此信息传递给任何随后尝试访问该原语的线程。如果某个线程遇到这种状态，它通常也会 panic，从而导致级联，最终终止整个程序。但这可以说比带着已损坏的状态继续运行要好！\n\
  \n支持展开所需的簿记并非没有代价，而且它通常需要编译器和目标平台的特殊支持。例如，许多嵌入式平台根本无法高效地展开栈。因此 Rust 支持另一种 panic\
  \ 模式：abort 确保在 panic 发生时整个程序立即退出。在这种模式下，任何线程都得不到清理的机会。这看起来可能很严厉，也确实如此，但它确保程序绝不会处于半运行状态，并且错误会立即显现。\n\
  \n> 警告\n> panic 设置是全局的——如果你将其设置为 abort，所有依赖项也会以 abort 模式编译。\n\n你可能已经注意到，当线程 panic\
  \ 时，它往往会打印一个回溯：导致 panic 发生的一系列函数调用。这也是一种展开形式，虽然它与此处讨论的展开 panic 行为是分开的。即使使用 panic=abort，你也可以通过向\
  \ rustc 传递 -Cforce-unwind-tables 来获得回溯，这会让 rustc 包含向上遍历栈所需的信息，同时在 panic 时仍会终止程序。\n\
  \n## Profile 覆盖\n\n你可以使用 profile 覆盖来仅为某个特定依赖项或特定 profile 设置 profile 选项。例如，清单 6-8\
  \ 展示了如何使用 [profile.<profile-name>.package.<crate-name>] 语法，在调试模式下为 serde crate 启用激进优化，并为所有其他\
  \ crate 启用适度优化。\n\n```toml\n[profile.dev.package.serde]\nopt-level = 3\n\n[profile.dev.package.\"\
  *\"]\nopt-level = 2\n```\n\n清单 6-8：覆盖特定依赖项或特定模式的 profile 选项\n\n如果某个依赖项在调试模式下慢得令人望而却步（例如解压缩或视频编码），而你需要它被优化以加快测试套件的运行，这种优化覆盖就很有用。你还可以在\
  \ ~/.cargo/config 中的 Cargo 配置文件里使用 [profile.dev]（或类似）部分来指定全局 profile 默认值。\n\n当你为特定依赖项设置优化参数时，请记住，这些参数只适用于作为该\
  \ crate 的一部分编译的代码；\n\n> 如果此示例中的 serde 有一个你在自己的 crate 中使用的泛型方法或类型，那么该方法或类型的代码将在你的\
  \ crate 中被单态化并优化，此时应用的是你的 crate 的 profile 设置，而不是 serde 的 profile 覆盖设置。\n\n## 条件编译\n\
  \n你编写的大多数 Rust 代码都是通用的——无论运行在什么 CPU 或操作系统上，行为都一样。但有时你必须做点特别的事情，才能让代码在 Windows、ARM\
  \ 芯片上工作，或者当针对特定平台应用程序二进制接口（ABI）编译时。又或者，你可能想在某个给定的 CPU 指令可用时编写特定函数的优化版本，或者在持续集成（CI）环境中运行时禁用一些缓慢但无趣的初始化代码。为了满足这类情况，Rust\
  \ 提供了条件编译机制，即只有在编译环境满足某些条件时，特定代码段才会被编译。\n\n我们使用 cfg 关键字来表示条件编译，你在第 XX 页的“在你的 crate\
  \ 中使用特性”中见过它。它通常以 #[cfg(condition)] 属性的形式出现，表示仅当 condition 为真时才编译下一个项目。Rust 还有 #[cfg_attr(condition,\
  \ attribute)]，如果 condition 成立，它会被编译为 #[attribute]，否则就是空操作。你还可以使用 cfg!(condition)\
  \ 宏将 cfg 条件作为布尔表达式求值。\n\n每个 cfg 构造都接受一个由选项组成的单一条件，例如 feature = \"some-feature\"\
  ，以及组合器 all、any 和 not，它们的功能正如你所预期。选项要么是简单的名称，如 unix，要么是与特性条件中使用的键/值对。\n\n有许多有趣的选项可以让编译依赖于它们。让我们从最常见到最不常见逐一介绍：\n\
  \n### 特性选项\n\n你已经见过这些示例。特性选项采用 feature = \"name-of-feature\" 的形式，如果命名的特性已启用，则该选项为真。你可以使用组合器在单个条件中检查多个特性。例如，如果特性\
  \ f1 或特性 f2 已启用，则 any(feature = \"f1\", feature = \"f2\") 为真。\n\n### 操作系统选项\n\n\
  这些选项使用键/值语法，键为 target_os，值为 windows、macos 和 linux 等。你还可以使用 target_family 来指定操作系统家族，其取值为\
  \ windows 或 unix。这些选项非常常见，因此它们拥有自己的命名简写，你可以直接使用 cfg(windows) 和 cfg(unix)。例如，如果你希望某个特定代码段只在\
  \ macOS 和 Windows 上编译，可以这样写：#[cfg(any(windows, target_os = \"macos\"))].\n\n\n\n\
  \n## 上下文选项\n\n这些选项让你能够针对特定的编译上下文来定制代码。其中最常用的是 `test` 选项，它仅在 crate 以测试（test）配置文件编译时为\
  \ `true`。请注意，`test` 只对正在被测试的 crate 设置，而不会对其任何依赖项设置。这也意味着，在运行集成测试时，你的 crate 并不会设置\
  \ `test`；是集成测试本身以测试配置文件编译，而你的实际 crate 则正常编译（即不设置 `test`）。`doc` 和 `doctest` 选项也同理，它们分别只在构建文档或编译\
  \ doctest 时设置。此外还有 `debug_assertions` 选项，默认在调试模式下会被设置。\n\n## 工具选项\n\n某些工具（如 `clippy`\
  \ 和 `Miri`）会设置自定义选项（后面会详述），让你在这些工具下运行时能够定制编译行为。通常，这些选项以相应工具的名称命名。例如，如果你希望某个计算密集型的测试不要在\
  \ Miri 下运行，可以给它加上 `#[cfg_attr(miri, ignore)]` 属性。\n\n## 架构选项\n\n这些选项让你能够基于编译器所针对的\
  \ CPU 指令集进行编译。你可以使用 `target_arch` 指定特定架构，其取值如 `x86`、`mips`、`aarch64`；也可以使用 `target_feature`\
  \ 指定特定的平台特性，其取值如 `avx` 或 `sse2`。对于非常底层的代码，你还会发现 `target_endian` 和 `target_pointer_width`\
  \ 选项也很有用。\n\n## 编译器选项\n\n这些选项让你能够使代码适应所编译所针对的平台 ABI，可通过 `target_env` 获得，其取值如 `gnu`、`msvc`\
  \ 和 `musl`。由于历史原因，该值通常为空，尤其是在 GNU 平台上。通常你只在需要直接与生态环境的 ABI 交互时才需要此选项，例如通过 `#[link]`\
  \ 链接到某个 ABI 特定的符号名时。\n\n虽然 `cfg` 条件通常用于定制代码，但有些也可以用于定制依赖项。例如，`winrt` 依赖通常只在 Windows\
  \ 上有意义，而 `nix` crate 可能只在基于 Unix 的平台上才有用。清单 6-9 给出了如何使用 `cfg` 条件来实现这一点的示例：\n\n```\n\
  [target.'cfg(windows)'.dependencies]\nwinrt = \"0.7\"\n[target.'cfg(unix)'.dependencies]\n\
  nix = \"0.17\"\n```\n\n清单 6-9：条件依赖\n\n在这里，我们指定 `winrt` 0.7 版仅在 `cfg(windows)` 条件下（即在\
  \ Windows 上）被视为依赖项，而 `nix` 0.17 版仅在 `cfg(unix)` 条件下（即在 Linux、macOS 及其他基于 Unix 的平台上）被视为依赖项。需要记住的一点是，`[dependencies]`\
  \ 部分在构建过程的很早阶段就会被求值，此时只有某些 `cfg` 选项可用。特别是，`feature` 和上下文选项此时还不可用，因此你不能使用这种语法来基于特性（features）和上下文引入依赖。不过，你可以使用任何仅依赖于目标规范或架构的\
  \ `cfg`，以及由调用 `rustc` 的工具（如 `cfg(miri)`）显式设置的任何选项。\n\n> 注意\n> *既然谈到了依赖规范，我强烈建议你设置\
  \ CI 基础设施，使用 `cargo-deny` 和 `cargo-audit` 等工具对依赖项进行基本审计。这些工具能够检测出：你是否在传递依赖中依赖了某个依赖项的多个主要版本、是否依赖于无人维护或存在已知安全漏洞的\
  \ crate、以及是否使用了你可能想要避免的许可证。使用这类工具是以自动化方式提升代码库质量的绝佳途径！*\n\n添加自定义的条件编译选项也相当简单。你只需要确保在\
  \ `rustc` 编译你的 crate 时传入 `--cfg=myoption`。最简单的做法是将你的 `--cfg` 添加到 `RUSTFLAGS` 环境变量中。这在\
  \ CI 中非常有用，你可能希望根据测试是在 CI 上运行还是在开发机上运行来定制测试套件：在 CI 设置中向 `RUSTFLAGS` 添加 `--cfg=ci`，然后在代码中使用\
  \ `cfg(ci)` 和 `cfg(not(ci))`。以这种方式设置的选项在 `Cargo.toml` 的依赖项中也可用。\n\n## 版本管理\n\n所有\
  \ Rust crate 都有版本，并且预期遵循 Cargo 实现的语义化版本（semantic versioning）规则。语义化版本规定了什么样的变更需要什么样版本的提升、哪些版本被认为是兼容的、以及以何种方式兼容。RFC\
  \ 1105 标准本身非常值得一读（其技术性并不强），但概括而言，它区分了三种变更：破坏性变更（breaking changes），需要主版本号的提升；新增功能（additions），需要次版本号的提升；以及缺陷修复（bug\
  \ fixes），只需要补丁版本号的提升。RFC 1105 很好地概述了在 Rust 中什么构成破坏性变更，我们在本书的其他地方也已涉及其中一些方面。\n\n\
  在这里，我不打算详细讨论不同变更类型的确切语义。相反，我想强调版本号在 Rust 生态系统中出现的一些不太直观的方式，在决定如何为自己的 crate 进行版本管理时，你需要牢记这些。\n\
  \n## 最低支持 Rust 版本\n\n第一个 Rust 特色是最低支持 Rust 版本（MSRV）。在 Rust 社区中，关于项目在 MSRV 和版本管理方面应遵循何种策略存在大量争论，而且没有真正完美的答案。问题的核心在于，一些\
  \ Rust 用户只能使用较旧版本的 Rust，这通常是在企业环境中，他们几乎没有选择余地。如果我们不断利用新稳定的 API，这些用户将无法编译我们 crate\
  \ 的最新版本，从而被落下。\n\ncrate 作者可以采用两种技术来让处于这种境地的用户生活更轻松一些。第一种是建立 MSRV 策略，承诺 crate 的新版本始终能够与过去\
  \ X 个月的任何稳定版本编译。具体数字各不相同，但 6 或 12 个月较为常见。考虑到 Rust 每六周一个发布周期，这分别对应最近四个或八个稳定版本。项目中引入的任何新代码都必须能够使用\
  \ MSRV 编译器编译（通常通过 CI 检查），或者等到 MSRV 策略允许时再按原样合并。这有时会很痛苦，因为这意味着这些 crate 无法利用语言提供的最新、最强大的功能，但这会让你的用户生活更轻松。\n\
  \n第二种技术是确保每当 MSRV 发生变化时，都提升 crate 的次版本号。因此，如果你发布了 crate 的 2.7.0 版本，并且该版本将你的 MSRV\
  \ 从 Rust 1.44 提升到 Rust 1.45，那么一个停留在 1.44 且依赖你 crate 的项目可以使用依赖版本限定符 `version = \"\
  2, <2.7\"` 来保持项目正常工作，直到它能够升级到 Rust 1.45。重要的是，你应递增次版本号，而不仅仅是补丁版本号，这样如果必要，你仍然可以针对之前的\
  \ MSRV 版本发布关键安全修复（通过再进行一次补丁发布）。\n\n有些项目非常重视 MSRV 支持，以至于他们将 MSRV 变更视为破坏性变更并递增主版本号。这意味着下游项目必须显式选择接受\
  \ MSRV 变更，而不是选择不接受——但这也意味着，那些没有如此严格 MSRV 要求的用户如果不更新依赖项，将看不到未来的缺陷修复，而这些依赖项更新可能也会要求他们发布破坏性变更。正如我所说，这些解决方案都不是没有缺点的。\n\
  \n如今在 Rust 生态系统中强制实施 MSRV 是很有挑战性的。只有一小部分 crate 提供 MSRV 保证，即使你的依赖项提供了，你也需要不断监控它们，以便了解它们何时提高了\
  \ MSRV。当它们提高时，你需要用前面提到的受限版本边界发布新版本的 crate，以确保你的 MSRV 不会随之改变。这可能反过来迫使你放弃对依赖项的安全和性能更新，因为你必须继续使用旧版本，直到你的\
  \ MSRV 政策允许更新。而这个决定也会传递给你的下游依赖方。已经有人提议将 MSRV 检查构建到 Cargo 本身中，但在撰写本文时，还没有任何可用的方案被稳定下来。\n\
  \n\n\n\n\n## 最低依赖版本\n\n当你首次添加依赖时，往往并不清楚应该为该依赖指定什么样的版本说明符。程序员通常会选择最新版本，或者仅仅选择当前的主版本号，但这两种选择很可能都是错误的。这里所说的“错误”，并不是指你的\
  \ crate 无法编译，而是指这种选择可能会在日后给你的 crate 用户带来麻烦。让我们来看看为什么这两种情况都有问题。\n\n首先，假设你添加了一个对 `uuid\
  \ = \"1.7.3\"`（最新发布版本）的依赖。现在设想某个开发者的项目依赖你的 crate，同时也依赖另一个 crate `foo`，而 `foo` 本身又依赖\
  \ uuid。再设想 `foo` 的作者对其 MSRV 策略非常谨慎，因此他们依赖 `uuid = \"1, <1.6\"`。这时你就会遇到麻烦。当 Cargo\
  \ 看到 `uuid = \"1.7.3\"` 时，它只考虑大于等于 1.7 的版本。但随后它发现 foo 对 uuid 的依赖要求小于 1.6，于是它放弃并报告说，没有与所有要求兼容的\
  \ uuid 版本。\n\n> *在实践中，crate 显式地不想要某个依赖项的较新版本，原因可能有很多。最常见的原因有：强制 MSRV、满足企业审计要求（较新版本会包含未经审计的代码），以及确保可重现构建（只使用明确列出的确切版本）。*\n\
  \n这很不幸，因为你的 crate 很可能完全可以与，比如说，`uuid 1.5.6` 一起编译。甚至可能任何 1.x 版本都能编译！但是，通过使用最新版本号，你在告诉\
  \ Cargo 只考虑该次版本号及以上的版本。那么，改用 `uuid = \"1\"` 是不是解决方案呢？不，这也不完全正确。你的代码可能确实依赖于只在 uuid\
  \ 1.6 中添加的某些东西，所以虽然 1.6.2 可以，1.5.6 却不行。如果你只在最终会使用较新版本的环境中编译你的 crate，你不会注意到这一点；但如果依赖图中的某个\
  \ crate 指定了 `uuid = \"1, <1.5\"`，你的 crate 将无法编译！\n\n正确的策略是列出包含你的 crate 所依赖的全部功能的最早版本，并确保即使你在\
  \ crate 中添加新代码，这一情况也仍然成立。但除了翻遍更新日志或反复试错之外，你如何确定这一点呢？最好的办法是使用 Cargo 的不稳定标志 `-Z minimal-versions`，它会让你的\
  \ crate 对所有依赖使用最低可接受版本，而不是最高版本。然后，将所有依赖仅设置为最新主版本号，尝试编译，并对任何无法编译的依赖添加次版本号。反复进行，直到一切都能正常编译，这时你就有了最低版本要求！\n\
  \n值得注意的是，与 MSRV 一样，最低版本检查也面临着生态系统采用的问题。你可能已经正确设置了所有版本说明符，但你依赖的项目未必如此。这使得 Cargo 的最低版本标志在实践中难以使用（这也是它仍然不稳定的原因）。如果你依赖\
  \ foo，而 foo 依赖 bar 时使用了说明符 `bar = \"1\"`，但实际上它需要 `bar = \"1.4\"`，那么无论你如何列出 foo，Cargo\
  \ 都会报告无法编译 foo，因为 `-Z` 标志告诉它始终优先选择最低版本。你可以通过直接在你的依赖中列出 bar 并给出合适的版本要求来绕过这个问题，但这些变通方法的设置和维护可能很麻烦。你最终可能会列出大量实际上只是通过传递依赖引入的依赖项，而且随着时间推移，你还得让这份列表保持最新。\n\
  \n> **注意**\n>\n> 目前有一个提案，提出一种标志：这种标志倾向于为当前 crate 选择最低版本，而为依赖项选择最高版本。这看起来相当有前景。\n\
  \n## 更新日志\n\n对于除最简单的 crate 之外的所有 crate，我都强烈建议保留更新日志。没有什么比看到某个依赖项进行了主版本升级，然后不得不翻遍\
  \ Git 日志来找出变更内容以及如何更新代码更令人沮丧的了。我建议你不要简单地把 Git 日志倾倒进一个名为 changelog 的文件，而是保留一份人工维护的更新日志。这样它更有可能真正有用。\n\
  \n一种简单而优秀的更新日志格式是 Keep a Changelog 格式，其文档位于 https://keepachangelog.com/。\n\n## 未发布的版本\n\
  \n即使依赖项的来源是目录或 Git 仓库，Rust 也会考虑版本号。这意味着，即使你还没有向 crates.io 发布版本，语义化版本控制依然很重要；在两次发布之间，你的\
  \ Cargo.toml 中列出的版本也很关键。语义化版本控制标准并未规定如何处理这种情况，但我会提供一种既相当有效又不会太繁琐的工作流程。\n\n发布一个版本后，立即将\
  \ Cargo.toml 中的版本号更新为下一个补丁版本，并加上像 `-alpha.1` 这样的后缀。如果你刚刚发布了 2.0.3，那么把新版本设为 2.0.4-alpha.1。如果你刚刚发布了\
  \ alpha 版本，则改为递增 alpha 编号。\n\n在两次发布之间修改代码时，要留意新增功能变更或破坏性变更。如果发生了这类变更，且自上次发布以来对应版本号尚未更改，就递增它。例如，如果上次发布的版本是\
  \ 2.0.3，当前版本是 2.0.4-alpha.2，然后你做了一处新增功能的变更，那么把这次变更后的版本设为 2.1.0-alpha.1。如果你做的是破坏性变更，则改为\
  \ 3.0.0-alpha.1。如果相应的版本号递增已经完成，只需递增 alpha 编号。\n\n当你发布时，去掉后缀（除非你想发布预发布版本），然后发布，再从头开始。\n\
  \n这个过程之所以有效，是因为它让两种常见的工作流程都运行得更好。首先，设想一个开发者依赖你的 crate 的主版本 2，但他们需要一个目前只在 Git 中可用的功能。这时你提交了一个破坏性变更。如果你不同时提升主版本号，他们的代码就会突然以意想不到的方式失败——要么无法编译，要么出现奇怪的运行时问题。如果你遵循这里给出的流程，Cargo\
  \ 反而会通知他们发生了破坏性变更，他们就必须解决这一问题，或者固定一个特定的提交。\n\n接下来，设想一个开发者需要某个他们刚刚为你的 crate 贡献的功能，但这个功能尚未包含在你\
  \ crate 的任何已发布版本中。他们通过 Git 依赖使用你的 crate 已经有一段时间了，所以他们项目中的其他开发者已经拥有你的 crate 仓库的旧检出。如果你不在\
  \ Git 中递增次版本号，这位开发者就无法传达他们的项目现在依赖于刚刚合并的功能。如果他们推送自己的更改，他们的同伴开发者会发现项目不再编译，因为 Cargo\
  \ 会复用旧的检出。另一方面，如果该开发者能为 Git 依赖递增次版本号，Cargo 就会意识到旧检出已经过时。\n\n这个工作流程绝非完美。它没有提供一种好的方式来传达两次发布之间的多个次版本或主版本变更，而且你仍然需要做一些工作来跟踪版本。然而，它的确解决了\
  \ Rust 开发者在处理 Git 依赖时最常遇到的两个问题；即使你在两次发布之间进行了多个这样的变更，这个工作流程也仍然能发现许多问题。\n\n如果你不太在意发布中版本号偏小或是否连续，你可以通过总是递增版本号中的适当部分来改进这个建议的工作流程。不过要注意，取决于你进行此类变更的频率，这可能会使你的版本号变得非常大！\n\
  \n## 总结\n\n在本章中，我们探讨了多种配置、组织和发布 crate 的机制，既是为了你自己受益，也是为了他人。我们还回顾了在 Cargo 中处理依赖和特性时一些常见的陷阱，希望这些以后不会让你措手不及。在下一章中，我们将转向测试，深入探讨如何超越我们所熟知并喜爱的\
  \ Rust 简单的 #[test] 函数。\n\n\n\n\n\n## Rust 测试机制\n\n要理解 Rust 提供的各种测试机制，你必须首先了解 Rust\
  \ 如何构建和运行测试。当你运行 `cargo test --lib` 时，Cargo 做的唯一特殊事情就是向 `rustc` 传递 `--test` 标志。该标志告诉\
  \ `rustc` 生成一个运行所有单元测试的测试二进制文件，而不是仅仅编译 crate 的库或二进制文件。在幕后，`--test` 有两个主要作用。首先，它启用\
  \ `cfg(test)`，以便你可以有条件地包含测试代码（稍后会详细介绍）。其次，它使编译器生成一个测试 harness：一个精心生成的 `main` 函数，在运行时调用程序中每个\
  \ `#[test]` 函数。\n\n### 测试 Harness\n\n编译器通过程序宏的混合生成测试 harness `main` 函数，我们将在第 8 章更深入地讨论这些宏，以及少量魔法。本质上，harness\
  \ 将每个用 `#[test]` 注释的函数转换为测试描述符——这是程序宏的部分。然后它将每个描述符的路径暴露给生成的 `main` 函数——这是魔法部分。描述符包含诸如测试的名称、其设置的任何附加选项（如\
  \ `#[should_panic]`）等信息。其核心是，测试 harness 遍历 crate 中的测试，运行它们，捕获其结果并打印结果。因此，它还包括解析命令行参数（例如\
  \ `--test-threads=1`）、捕获测试输出、以并行方式运行列出的测试并收集测试结果的逻辑。\n\n截至本文撰写时，Rust 开发者正在努力使测试\
  \ harness 生成的魔法部分成为一个公开可用的 API，以便开发者可以构建自己的测试 harness。这项工作仍处于实验阶段，但该提案与今天存在的模型相当接近。需要弄清楚的魔法的一部分是如何确保\
  \ `#[test]` 函数可供生成的 `main` 函数使用，即使它们位于私有子模块内部。\n\n集成测试（`tests/` 中的测试）遵循与单元测试相同的流程，唯一例外是它们各自被编译为独立的\
  \ crate，这意味着它们只能访问主 crate 的公共接口，并且在针对未使用 `#[cfg(test)]` 编译的主 crate 运行。每个 `tests/`\
  \ 中的文件都会生成一个测试 harness。`tests/` 下子目录中的文件不会生成测试 harness，以便你可以为测试拥有共享子模块。\n\nNOTE\
  \ 如果你明确希望为子目录中的文件生成测试 harness，可以通过调用该文件 `main.rs` 来选择加入。\n\nRust 不要求你使用默认的测试 harness。你可以改为选择退出它，并通过在\
  \ `Cargo.toml` 中为给定的集成测试设置 `harness = false` 来实现自己的 `main` 方法作为测试运行器，如清单 7-1 所示。然后你定义的\
  \ `main` 方法将被调用来运行测试。\n\n```\n[[test]]\nname = \"custom\"\npath = \"tests/custom.rs\"\
  \nharness = false\n```\n\n清单 7-1：选择退出标准测试 harness\n\n没有测试 harness，`#[test]` 周围的魔法就不会发生。相反，你需要编写自己的\
  \ `main` 函数来运行你想要执行的测试代码。本质上，你正在编写一个普通的 Rust 二进制文件，只是恰好由 `cargo test` 运行。该二进制文件负责处理默认\
  \ harness 通常做的所有事情（如果你想支持它们），例如命令行标志。`harness` 属性是为每个集成测试单独设置的，因此你可以有一个使用标准 harness\
  \ 的测试文件和一个不使用标准 harness 的测试文件。\n\n### 默认测试 HARNESS 的参数\n\n默认测试 harness 支持许多命令行参数来配置测试的运行方式。这些参数不是直接传递给\
  \ `cargo test`，而是传递给 Cargo 为你编译和运行的测试二进制文件，当你运行 `cargo test` 时。要访问该标志集，请在 `cargo\
  \ test` 后传递 `--`，然后是测试二进制文件的参数。例如，要查看测试二进制文件的帮助文本，你需要运行 `cargo test -- --help`。\n\
  \n通过这些命令行参数可以获得许多方便的配置选项。`--nocapture` 标志禁用运行 Rust 测试时通常发生的输出捕获。这在你想实时观察测试输出而不是在测试失败后一次性全部看到时很有用。你可以使用\
  \ `--test-threads` 选项限制并发运行的测试数量，这在你有一个挂起或段错误的测试并且想要通过顺序运行测试来找出它时很有帮助。还有 `--skip`\
  \ 选项用于跳过匹配特定模式的测试，`--ignored` 用于运行通常会被忽略的测试（例如需要外部程序运行的测试），以及 `--list` 用于仅列出所有可用测试。\n\
  \n请记住，这些参数都是由默认测试 harness 实现的，因此如果你禁用它（使用 `harness = false`），你需要在自己的 `main` 函数中自行实现你需要的参数！\n\
  \n没有 harness 的集成测试主要用于基准测试，如我们稍后会看到的，但它们在你想要运行不符合标准“一个函数，一个测试”模型的测试时也很方便。例如，你经常会看到无\
  \ harness 测试与模糊测试器、模型检查器以及需要自定义全局设置（例如在 WebAssembly 下或在处理自定义目标时）的测试一起使用。\n\n###\
  \ `#[cfg(test)]`\n\n当 Rust 为测试构建代码时，它会设置编译器配置标志 `test`，你可以用它与条件编译一起使用，以便在代码未被专门测试时将其编译掉。乍一看，这似乎很奇怪：你难道不想测试进入生产环境的完全相同的代码吗？你确实想，但仅在测试时可用的代码允许你在几个方面编写更好、更彻底的测试。\n\
  \n### 模拟\n\n在编写测试时，你通常希望对正在测试的代码以及你的代码可能交互的任何其他类型都有严格的控制。例如，如果你正在测试网络客户端，你可能不想通过真实网络运行单元测试，而是直接控制“网络”发出哪些字节以及何时发出。或者，如果你正在测试数据结构，你希望你的测试使用允许你在每次调用时控制每个方法返回值的类型。你可能还想收集指标，例如给定方法被调用的频率或是否发出给定字节序列。\n\
  \n这些“假”类型和实现被称为模拟，它们是任何广泛单元测试套件的关键特性。虽然你通常可以通过手动方式完成获得这种控制所需的工作，但让库为你处理大部分繁琐细节会更方便。这就是自动化模拟发挥作用的地方。模拟库将具有生成具有特定属性或签名的类型（包括函数）的设施，以及在测试执行期间控制和\
  \ introspect 这些生成项的机制。\n\nRust 中的模拟通常通过泛型实现——只要你的程序、数据结构、框架或工具对你可能想要模拟的任何内容都是泛型的（或接受\
  \ trait 对象），你就可以使用模拟库生成符合的类型来实例化这些泛型参数。然后你通过使用生成的模拟类型实例化你的泛型构造来编写单元测试，就开始了！\n\n\
  在泛型不方便或不合适的情况下，例如如果你想避免让类型的某个方面对用户泛型化，你可以改为将你想要模拟的状态和行为封装在专用结构体中。然后你将生成该结构体及其方法的模拟版本，并使用条件编译根据\
  \ `cfg(test)` 或仅测试的功能如 `cfg(feature = \"test_mock_foo\")` 使用真实或模拟实现。\n\n目前，Rust\
  \ 社区中还没有出现一个单一的模拟库，甚至一个单一的模拟方法成为“唯一真理”。我所知道的最广泛和最彻底的模拟库是 `mockall` crate，但它仍在积极开发中，还有许多其他竞争者。\n\
  \n\n\n\n\n## 仅用于测试的 API\n\n首先，拥有仅用于测试的代码可以让你向你的（单元）测试公开额外的方法、字段和类型，这样测试不仅可以检查公共\
  \ API 是否按预期行为，还可以检查内部状态是否正确。例如，考虑来自 `hashbrown` 的 `HashMap` 类型，该 crate 实现了标准库的 `HashMap`。`HashMap`\
  \ 类型实际上只是 `RawTable` 类型的包装器，而 `RawTable` 实现了大部分哈希表逻辑。假设在对空映射执行 `HashMap::insert`\
  \ 之后，你想检查映射中的单个桶是否非空，如清单 7-2 所示。\n\n```\n#[test]\nfn insert_just_one() {\n    let\
  \ mut m = HashMap::new();\n    m.insert(42, ());\n    let full = m.table.buckets.iter().filter(Bucket::is_full).count();\n\
  \    assert_eq!(full, 1);\n}\n```\n\n*清单 7-2：访问无法访问的内部状态的测试，因此无法编译*\n\n这段代码按原样编写将无法编译，因为虽然测试代码可以访问\
  \ `HashMap` 的私有 `table` 字段，但它无法访问 `RawTable` 的同样私有的 `buckets` 字段，因为 `RawTable` 位于不同的模块中。我们可以通过将\
  \ `buckets` 字段的可见性设为 `pub(crate)` 来修复这个问题，但我们真的不希望 `HashMap` 通常可以触及桶，因为它可能会意外破坏\
  \ `RawTable` 的内部状态。即使将桶作为只读提供也可能有问题，因为 `HashMap` 中的新代码随后可能会开始依赖 `RawTable` 的内部状态，从而使未来的修改变得更加困难。\n\
  \n解决方案是使用 `#[cfg(test)]`。我们可以向 `RawTable` 添加一个方法，该方法仅在测试时允许访问桶，如清单 7-3 所示，从而避免为其余代码添加脚枪。清单\
  \ 7-2 中的代码随后可以更新为调用 `buckets()` 而不是访问私有的 `buckets` 字段。\n\n```\nimpl RawTable {\n\
  \    #[cfg(test)]\n    pub(crate) fn buckets(&self) -> &[Bucket] {\n        &self.buckets\n\
  \    }\n}\n```\n\n*清单 7-3：使用 `#[cfg(test)]` 使内部状态在测试上下文中可访问*\n\n## 测试断言的记账\n\n拥有仅在测试期间存在的代码的第二个好处是，你可以增强程序以执行额外的运行时记账，然后由测试检查。例如，想象你正在编写自己的标准库中\
  \ `BufWriter` 类型的版本。在测试它时，你想确保 `BufWriter` 不会发出系统调用\n\n使用类似 `#[tokio::main] async\
  \ fn main` 的异步 main 函数，或者如果你想向文档测试添加额外的模块。\n\n要在文档测试中使用 `?` 运算符，你通常不必使用自定义 main\
  \ 函数，因为 `rustdoc` 包含一些启发式方法，如果你的代码看起来使用了 `?`（例如，如果它以 `Ok(())` 结尾），则将返回类型设置为 `Result<(),\
  \ impl Debug>`。如果类型推断在函数错误类型方面给你带来困难，你可以通过将文档测试的最后一行显式键入来消除歧义，如下所示：`Ok::<(), T>(())`。\n\
  \n文档测试具有许多额外的功能，在你为更复杂的接口编写文档时非常有用。首先是隐藏单个行的能力。如果你用 `#` 为文档测试的一行加前缀，该行在编译和运行时会被包含，但不会包含在文档中生成的代码片段中。这让你可以轻松隐藏对当前示例不重要的细节，例如为虚拟类型实现特征或生成值。如果希望在不每次都显示相同的引导代码的情况下呈现一系列示例，这也很有用。清单\
  \ 7-5 给出了文档测试中隐藏行的示例。\n\n````\n/// Completely frobnifies a number through I/O.\n\
  ///\n/// In this first example we hide the value generation.\n/// ```\n/// # let\
  \ unfrobnified_number = 0;\n/// # let already_frobnified = 1;\n/// assert!(frobnify(unfrobnified_number).is_ok());\n\
  /// assert!(frobnify(already_frobnified).is_err());\n/// ```\n///\n/// Here's an\
  \ example that uses `?` on multiple types\n/// and thus needs to declare the concrete\
  \ error type,\n/// but we don't want to distract the user with that.\n/// We also\
  \ hide the use that brings the function into scope.\n/// ```\n/// # use mylib::frobnify;\n\
  /// frobnify(\"0\".parse()?)?;\n/// # Ok::<(), anyhow::Error>(())\n/// ```\n///\n\
  /// You could even replace an entire block of code completely,\n/// though use this\
  \ _very_ sparingly:\n/// ```\n/// # /*\n/// let i = ...;\n/// # */\n/// # let i\
  \ = 42;\n/// frobnify(i)?;\n/// ```\nfn frobnify(i: usize) -> std::io::Result<()>\
  \ {\n````\n\n*清单 7-5：使用 # 在文档测试中隐藏行*\n\n> **注意：** 慎用此功能；如果用户复制粘贴示例后因你隐藏了必需步骤而无法工作，这会让用户感到沮丧。\n\
  \n与 `#[test]` 函数一样，文档测试也支持修改文档测试运行方式的属性。这些属性紧跟在用于表示代码块的三重反引号之后，并且多个属性可以用逗号分隔。\n\n\
  与测试函数一样，你可以指定 `should_panic` 属性来指示特定文档测试中的代码在运行时应 panic，或 `ignore` 来仅在 `cargo test`\
  \ 使用 `--ignored` 标志运行时检查代码段。你还可以使用 `no_run` 属性来指示给定的文档测试应编译但不应运行。\n\n属性 `compile_fail`\
  \ 告诉 `rustdoc` 文档示例中的代码不应编译。这向用户表明特定用法是不可能的，并且作为有用的测试提醒你在库的相关方面发生变化时更新文档。你也可以使用此属性来检查你的类型的某些静态属性是否成立。清单\
  \ 7-6 显示了如何使用 `compile_fail` 检查给定类型是否未实现 `Send`，这可能对于在不安全代码中维护安全保证是必要的。\n\n```compile_fail\n\
  # struct MyNonSendType(std::rc::Rc<()>);\nfn is_send<T: Send>() {}\nis_send::<MyNonSendType>();\n\
  ```\n\n*清单 7-6：使用 `compile_fail` 测试代码是否无法编译*\n\n`compile_fail` 是一个相当粗糙的工具，因为它没有说明代码为何无法编译。例如，如果代码因缺少分号而无法编译，`compile_fail`\
  \ 测试仍会显示成功。因此，你通常只应在确保测试确实以预期错误无法编译后才添加此属性。如果你需要更精细的编译错误测试，例如在开发宏时，请查看 `trybuild`\
  \ crate。\n\n## 额外测试工具\n\n测试不仅仅是运行测试函数并查看它们是否产生预期结果。测试技术、方法和工具的全面调查超出了本书的范围，但随着你扩展测试范围，你应该了解一些关键的\
  \ Rust 特定部分。\n\n### 静态检查\n\n你可能不认为 linter 的检查是测试，但在 Rust 中它们通常可以是。Rust linter `clippy`\
  \ 将其许多 lint 分类为正确性 lint。这些 lint 捕获编译但几乎肯定是 bug 的代码模式。一些例子是 `a = b; b = a`，它未能交换\
  \ `a` 和 `b`；`std::mem::forget(t)`，其中 `t` 是引用；以及 `for x in y.next()`，它只会遍历 `y` 中的第一个元素。如果你尚未将\
  \ `clippy` 作为 CI 流程的一部分运行，你可能应该这样做。\n\nClippy 还附带许多其他 lint，虽然通常有帮助，但可能比你更喜欢的更具主观性。例如，默认启用的\
  \ `type_complexity` lint，如果你在程序中使用特别复杂的类型，如 `Rc<Vec<Vec<Box<(u32, u32, u32, u32)>>>>`，就会发出警告。虽然该警告鼓励你编写更易读的代码，但你可能会发现它过于挑剔而缺乏广泛的实用性。如果代码的某个部分错误地触发了特定\
  \ lint，或你只想允许其特定实例，你可以使用 `#[allow(clippy::name_of_lint)]` 仅对该段代码选择退出 lint。\n\nRust\
  \ 编译器还附带了一套以警告形式存在的 lint，不过这些通常更侧重于编写惯用代码而不是检查正确性。相反，编译器中的正确性 lint 只是被视为错误（请查看 `rustc\
  \ -W help` 获取列表）。\n\n> **注意：** 并非所有编译器警告默认都启用。默认禁用的警告通常仍在完善中，或更多关于风格而非内容。一个很好的例子是“惯用\
  \ Rust 2018 版” lint，你可以用 `#![warn(rust_2018_idioms)]` 启用它。启用此 lint 后，编译器会告诉你是否未能利用\
  \ Rust 2018 版带来的更改。你可能还想养成在开始新项目时启用 `missing_docs` 和 `missing_debug_implementations`\
  \ 等 lint 的习惯，这些 lint 会在你忘记为 crate 中的任何公共项编写文档或为任何公共类型添加 `Debug` 实现时警告你。\n\n### 测试生成\n\
  \n编写良好的测试套件需要大量工作。即使你做了这项工作，你编写的测试也只测试你在编写时考虑的那组特定行为。幸运的是，你可以利用多种测试生成技术来开发更好、更全面的测试。这些技术为你生成输入以检查应用程序的正确性。存在许多此类工具，各有其优缺点，因此这里我只介绍这些工具使用的主要策略：模糊测试和属性测试。\n\
  \n### 模糊测试\n\n模糊测试已经写了整本书，但从高层次来看，想法很简单：向程序生成随机输入，看看它是否崩溃。如果程序崩溃，那就是 bug。例如，如果你正在编写\
  \ URL 解析库，你可以通过系统地生成随机字符串并将其抛给解析函数，直到它 panic 来模糊测试你的程序。完成。\n\n\n\n\n\n天真地讲，这需要花费很长时间才能产生结果：如果模糊测试器从\
  \ a 开始，然后是 b，然后是 c，依此类推，它需要很长时间才能生成一个棘手的 URL，比如 http://[:]。实际上，现代的模糊测试器使用代码覆盖率指标来探索代码中的不同路径，这使得它们能够比真正随机选择输入时更快地达到更高的覆盖率。\n\
  \n模糊测试器非常擅长找到代码未正确处理的奇怪边界情况。它们几乎不需要你进行设置：你只需将模糊测试器指向一个接受“可模糊”输入的函数，然后它就开始运行了。例如，清单\
  \ 7-7 显示了你如何对 URL 解析器进行模糊测试的示例。\n\n```\nlibfuzzer_sys::fuzz_target!(|data: &[u8]|\
  \ {\n    if let Ok(s) = std::str::from_utf8(data) {\n        let _ = url::Url::parse(s);\n\
  \    }\n});\n```\n\n清单 7-7：使用 libfuzzer 对 URL 解析器进行模糊测试\n\n模糊测试器会向闭包生成半随机的输入，任何形成有效\
  \ UTF-8 字符串的输入都会被传递给解析器。请注意，这里的代码并没有检查解析是否成功或失败——相反，它是在寻找解析器因违反内部不变量而 panic 或以其他方式崩溃的情况。\n\
  \n模糊测试器会一直运行直到你终止它，因此大多数模糊测试工具都内置了在探索一定数量的测试用例后停止的机制。如果你的输入不是一个简单可模糊的类型——比如哈希表——你通常可以使用像\
  \ arbitrary 这样的 crate 将模糊测试器生成的字节字符串转换为更复杂的 Rust 类型。看起来像魔法，但实际上在底层以非常直接的方式实现。该 crate\
  \ 定义了一个 Arbitrary trait，其中有一个名为 arbitrary 的单一方法，用于从随机字节源构造实现该类型的实例。像 u32 或 bool\
  \ 这样的原始类型会从该输入中读取必要数量的字节来构造自身的有效实例，而更复杂的类型如 HashMap 或 BTreeSet 则会从输入中产生一个数字来决定其长度，然后在内部类型上调用\
  \ Arbitrary 该次数。甚至还有一个属性 #[derive(Arbitrary)]，它通过对每个包含的类型调用 arbitrary 来实现 Arbitrary！要进一步探索模糊测试，我建议从\
  \ cargo-fuzz 开始。\n\n## Property-Based Testing\n\n有时你不仅想检查程序是否不会崩溃，还想检查它是否按预期工作。你的\
  \ add 函数没有 panic 很好，但如果它告诉你 add(1, 4) 的结果是 68，它可能仍然是错误的。这就是基于属性测试发挥作用的地方；你描述代码应遵守的若干属性，然后属性测试框架生成输入并检查这些属性是否确实成立。\n\
  \n使用基于属性测试的常见方法是首先编写一个简单但天真的代码版本，你确信它是正确的。然后，对于给定的输入，你将该输入同时提供给想要测试的代码和简化的天真版本。如果两个实现的結果或输出相同，你的代码就没问题——这就是你寻找的正确性属性——但如果不同，你很可能找到了一个\
  \ bug。你也可以使用基于属性测试来检查与正确性无关的属性，例如某个操作是否比另一个实现严格花费更少的时间。共同的原则是，你希望真实版本和测试版本之间的任何结果差异都是信息丰富且可操作的，以便每次失败都能让你做出改进。天真实现可能是你试图替换或增强的标准库实现（如\
  \ std::collections::VecDeque），也可能是你试图优化的算法的更简单版本（如天真与优化的矩阵乘法）。\n\n如果这种生成输入直到满足某个条件的方法听起来很像模糊测试，那是因为它确实如此——比我更聪明的人认为模糊测试“只是”基于属性测试，其中你测试的属性是“它不会崩溃”。\n\
  \n基于属性测试的一个缺点是它更依赖于提供的输入描述。而模糊测试会不断尝试所有可能的输入，属性测试往往由开发者注释引导，例如“0 到 64 之间的数字”或“包含三个逗号的字符串”。这使得属性测试能够更快地达到模糊测试可能需要很长时间随机遇到情况，但它确实需要人工工作，并且可能遗漏重要但小众的有\
  \ bug 的输入。随着模糊测试器和属性测试器越来越接近，模糊测试器也开始获得这种基于约束的搜索能力。\n\n如果你对基于属性的测试生成感兴趣，我建议从 proptest\
  \ crate 开始。\n\n## TESTING SEQUENCES OF OPERATIONS\n\n由于模糊测试器和属性测试器允许你生成任意的 Rust\
  \ 类型，你并不局限于在 crate 中测试单个函数调用。例如，假设你想测试某个类型 Foo 在对其执行特定操作序列时是否表现正确。你可以定义一个枚举 Operation\
  \ 来列出操作，并让你的测试函数接受一个 Vec<Operation>。然后你可以实例化一个 Foo 并依次对该 Foo 执行每个操作。大多数测试器都支持输入最小化，因此如果发现违反属性的输入，它们甚至会搜索仍然违反属性的最短操作序列！\n\
  \n## Test Augmentation\n\n假设你有一个宏伟的测试套件已经设置好，你的代码通过了所有测试。很辉煌。但有一天，其中一个通常可靠的测试莫名其妙地失败或因段错误而崩溃。这类非确定性测试失败的两个常见原因是：竞态条件，即测试可能仅在两个操作在不同线程中以特定顺序发生时才失败，以及\
  \ unsafe 代码中的未定义行为，例如如果某些 unsafe 代码从未初始化的内存中读取特定值。\n\n用普通测试捕获这类 bug 很困难——通常你没有足够的底层控制来对线程调度、内存布局和内容或其他随机系统因素编写可靠的测试。你可以让每个测试在循环中多次运行，但即使这样也可能无法捕获错误，如果坏情况足够罕见或不太可能的话。幸运的是，有工具可以帮助增强你的测试，使捕获这类\
  \ bug 变得容易得多。\n\n第一个就是令人惊叹的工具 Miri，它是 Rust 中间层中间表示（MIR）的解释器。MIR 是 Rust 的内部简化表示，有助于编译器在不必考虑\
  \ Rust 本身所有语法糖的情况下找到优化并检查属性。通过 Miri 运行你的测试与运行 cargo miri test 一样简单。Miri 解释你的代码而不是像普通二进制那样编译并运行它，这使得测试运行速度会慢不少。但作为回报，Miri\
  \ 可以跟踪每行代码执行时整个程序的状态。这使得 Miri 能够检测并报告如果你的程序表现出某些类型的未定义行为，例如未初始化内存读取、使用已 drop 的值后，或越界指针访问。与其让这些操作产生可能只有有时导致可观察测试失败（如崩溃）的奇怪程序行为，Miri\
  \ 会在它们发生时检测到并立即通知你。\n\n例如，考虑清单 7-8 中非常不安全的代码，它创建了对一个值的两个独占引用。\n\n```\nlet mut x\
  \ = 42;\nlet x: *mut i32 = &mut x;\nlet (x1, x2) = unsafe { (&mut *x, &mut *x) };\n\
  println!(\"{}\", x1, x2);\n```\n\n清单 7-8：Miri 检测到是错误的极度不安全代码\n\n在撰写本文时，如果你通过 Miri\
  \ 运行这段代码，你会得到一个指出问题所在的确切错误：\n\n```\nerror: Undefined Behavior: trying to reborrow\
  \ for Unique at alloc1383, but parent tag <2772> does not have an appropriate item\
  \ in the borrow stack\n--> src/main.rs:4:6\n|\n4 | let (x1, x2) = unsafe { (&mut\
  \ *x, &mut *x) };\n| ^^ trying to reborrow for Unique at alloc1383, but parent tag\
  \ <2772>\ndoes not have an appropriate item in the borrow stack\n```\n\n\n\n\n\n\
  # 8\n\n# 宏\n\n![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_104_0.png)\n\n宏本质上是一种让编译器替你编写代码的工具。你为编译器提供一个公式，让它根据给定的输入参数生成代码；每次调用宏时，编译器都会用执行该公式得到的结果来替换这次调用。你可以把宏看作自动化的代码替换，而替换规则由你来定义。\n\
  \nRust 的宏有各种不同的形态和规模，以便轻松实现多种不同形式的代码生成。两种主要的类型是*声明式*（declarative）宏和*过程式*（procedural）宏，本章将探讨这两类宏。我们还会看看宏在日常编码中派上用场的几种方式，以及更高级使用中可能出现的一些陷阱。本章假定你对宏已有一定了解，因此在阅读本章之前，我建议你先阅读\
  \ Rust 语言参考中关于宏的章节（https://doc.rust-lang.org/reference/macros.html）。\n\n来自 C 系语言的程序员可能已经习惯了\
  \ C 和 C++ 那片无法无天的土地，在那里你可以用 #define 把每个 true 改成 false，或者删除所有出现的 else 关键字。如果你正是如此，就需要把宏与“做坏事”的感觉分离开来。Rust\
  \ 中的宏远非 C 宏那样的狂野西部。它们（大多）遵循定义良好的规则，并且相当难以误用。\n\n# 声明式宏\n\n声明式宏是使用 macro_rules! 语法定义的，这种语法让你可以方便地定义类函数宏，而无需为此专门编写一个\
  \ crate（过程式宏则需要这样做）。一旦定义了声明式宏，你就可以用宏名后跟感叹号的方式调用它。我喜欢把这种宏想象成一种编译器辅助的查找替换：它能胜任许多常规、结构良好的转换任务，也能消除重复的样板代码。就你到目前为止使用\
  \ Rust 的经验而言，你所识别为宏的大多数宏很可能都是声明式宏。不过请注意，并非所有类函数宏都是声明式宏；macro_rules! 本身就是一个例子，format_args!\
  \ 是另一个。! 后缀仅仅向编译器表明：这个宏调用将在编译时被替换为不同的源代码。\n\n> 注意  \n> 由于 Rust 的解析器会专门识别并解析带有 !\
  \ 的宏调用，你只能在解析器允许的位置使用它们。它们在大多数你期望的位置都能工作，比如表达式位置或 impl 块中，但并非所有位置都可以。例如，（在撰写本文时）你不能在期望标识符或\
  \ match 分支的位置调用类函数宏。\n\n为什么声明式宏被称为“声明式”可能并不那么显而易见。毕竟，你在程序中不就是在“声明”一切吗？在这个语境下，“声明式”指的是：你并不说明宏的输入应该如何转换为输出，而只是声明当输入是\
  \ B 时，你希望输出看起来像 A。你声明事情应当如此，编译器会弄清楚为使你的声明成为现实所需的所有解析重连。这使得声明式宏简洁而富有表现力，不过由于用于表达声明的语言很有限，它们也往往相当晦涩难懂。\n\
  \n# 何时使用它们\n\n当你发现自己一遍又一遍地编写相同的代码，并且希望，嗯，别再这样时，声明式宏就主要派上用场了。它们最适合相当机械的替换——如果你的目标是做花哨的代码变换或大量代码生成，过程式宏可能更合适。\n\
  \n我最常使用声明式宏的场景，是发现自己正在编写重复且结构相似的代码，例如测试和 trait 实现。对于测试，我经常想用略有不同的配置多次运行同一个测试。我可能会有类似于清单\
  \ 8-1 所示的代码。\n\n```rust\nfn test_inner<T>(init: T, frobnify: bool) { ... }\n#[test]\n\
  fn test_1u8_frobnified() {\n    test_inner(1u8, true);\n}\n// ...\n#[test]\nfn test_i128_not_frobnified()\
  \ {\n    test_inner(1i128, false);\n}\n```\n\n*清单 8-1：重复的测试代码*\n\n虽然这样可行，但过于冗长、过于重复，也太容易因手工操作而出错。借助宏，我们可以做得更好，如清单\
  \ 8-2 所示。\n\n```rust\nmacro_rules! test_battery {\n    ($($t:ty as $name:ident),*)\
  \ => {\n        $(\n            mod $name {\n                #[test]\n         \
  \       fn frobnified() { test_inner::<$t>(1, true) }\n                #[test]\n\
  \                fn unfrobnified() { test_inner::<$t>(1, false) }\n            }\n\
  \        )*\n    }\n}\ntest_battery! {\n    u8 as u8_tests,\n    // ...\n    i128\
  \ as i128_tests\n}\n```\n\n*清单 8-2：让宏替你重复*\n\n这个宏会把每个逗号分隔的指令展开成自己的模块，每个模块包含两个测试：一个用\
  \ true 调用 `test_inner`，另一个用 false 调用。虽然宏定义并不简单，但它让添加更多测试变得容易得多。每个类型在 `test_battery!`\
  \ 调用中只占一行，宏会负责为 true 和 false 两种参数都生成测试。我们还可以让它为不同的 `init` 值生成测试。现在，我们忘记测试某个特定配置的可能性已大大降低！\n\
  \ntrait 实现的情况与此类似。如果你定义了自己的 trait，你通常会想为标准库中的多个类型实现该 trait，即使这些实现微不足道。假设你发明了 Clone\
  \ trait，并想为标准库中所有 Copy 类型实现它。与其手动为每个类型写出实现，不如使用类似清单 8-3 中的宏。\n\n```rust\nmacro_rules!\
  \ clone_from_copy {\n    ($( $t:ty ),*) => {\n        $(impl Clone for $t {\n  \
  \          fn clone(&self) -> Self { *self }\n        })*\n    }\n}\nclone_from_copy![bool,\
  \ f32, f64, u8, i8, /* ... */];\n```\n\n*清单 8-3：使用宏一蹴而就地为一众相似类型实现 trait*\n\n在这里，我们为每个提供的类型生成一个\
  \ Clone 实现，其函数体只是用 * 从 &self 中 Copy 出值。你可能会疑惑，为什么我们不添加一个对 T where T: Copy 的 blanket\
  \ 实现呢？我们确实可以这样做，但不这样做的重大原因之一是：那会迫使其他 crate 中恰好是 Copy 的类型也使用相同的 Clone 实现。有一个名为 specialization（特化）的实验性编译器特性可以提供变通方案，但在撰写本文时，该特性的稳定化仍有一段距离。所以，就目前而言，我们最好还是具体地逐一列出这些类型。这种模式也不仅限于简单的转发实现：例如，你可以轻松调整清单\
  \ 8-3 中的示例，为所有整数类型实现一个 AddOne trait！\n\n> 注意  \n> 如果你曾在“应该用泛型还是声明式宏”上犹豫不决，那就应该用泛型。泛型通常比宏更符合人体工程学，也更能与语言中的其他结构集成。如果你想要一条经验法则：如果你的代码因类型而变，使用泛型；否则，使用宏。\n\
  \n# 它们如何工作\n\n每种编程语言都有一种语法，规定组成源代码的各个字符如何转换成 token（记号）。token 是语言最底层的构建块，例如数字、标点字符、字符串字面量和字符字面量，以及标识符；在这一层，语言关键字和变量名之间没有区别。例如，文本\
  \ (value + 4) 在类似 Rust 的语法中会表示为包含五个 token 的序列：(、value、+、4、)。将文本转换为 token 的过程，也在编译器的其余部分与解析文本时那些棘手而底层的细节之间提供了一层抽象。例如，在\
  \ token 表示中没有空白的概念，并且 /*\"foo\"*/ 与 \"/*foo*/\" 有不同的表示（前者不是 token，后者是内容为 /*foo*/\
  \ 的字符串字面量 token）。\n\n一旦源代码被转换为 token 序列，编译器就会遍历该序列，并为这些 token 赋予语法含义。例如，由 () 界定的\
  \ token 组成一个分组，! token 表示宏调用，等等。这就是解析过程，它最终生成一棵抽象语法树（AST），该树描述了由\n\n\n\n## 编写声明式宏\n\
  \n对声明式宏所支持的全部语法进行详尽解释超出了本书的范围。不过，我们将介绍基础知识，因为其中有一些值得指出的奇特之处。\n\n声明式宏由两个主要部分组成：*匹配器*和*转录器*。一个给定的宏可以有多个匹配器，每个匹配器都有一个关联的转录器。当编译器发现一个宏调用时，它会从第一个匹配器到最后一个匹配器逐一检查；当它找到一个与调用中的令牌匹配的匹配器时，它就会遍历相应转录器的令牌来替换该调用。清单\
  \ 8-4 展示了声明式宏规则的不同部分是如何组合在一起的。\n\n```\nmacro_rules! /* macro name */ {\n  (/* 1st\
  \ matcher */) => { /* 1st transcriber */ };\n  (/* 2nd matcher */) => { /* 2nd transcriber\
  \ */ };\n}\n```\n\n*清单 8-4：声明式宏定义的组成部分*\n\n## 匹配器\n\n你可以把宏匹配器想象成一个令牌树，编译器会试图以预定义的方式对其进行扭曲和弯曲，以匹配调用点提供给它的输入令牌树。举个例子，考虑一个匹配器为\
  \ `$a:ident + $b:expr` 的宏。该匹配器可以匹配任意标识符（`:ident`）后跟一个加号，再后跟任意 Rust 表达式（`:expr`）。如果宏以\
  \ `x + 3 * 5` 被调用，编译器会发现，如果设置 `$a = x` 和 `$b = 3 * 5`，匹配器就能匹配成功。即使 `*` 从未出现在匹配器中，编译器也意识到\
  \ `3 * 5` 是一个有效表达式，因此可以与 `$b:expr` 匹配，后者接受任何表达式（即 `:expr` 部分）。\n\n匹配器可能会变得相当复杂，但它们拥有巨大的表达能力，很像正则表达式。举一个不那么复杂的例子，下面的匹配器接受一个序列（`$()`），该序列由逗号分隔（`,`）的一个或多个（`+`）键/值对组成，键/值对的格式为\
  \ `key => value`：\n\n```\n$(\\$key:expr => $value:expr),+\n```\n\n而且，关键在于，使用此匹配器调用宏的代码可以为键或值提供任意复杂的表达式——匹配器的魔力将确保键和值表达式被恰当地划分。\n\
  \n宏规则支持多种多样的*片段类型*；你已经见过用于标识符的 `:ident` 和用于表达式的 `:expr`，此外还有用于类型的 `:ty`，甚至还有用于任何单个令牌树的\
  \ `:tt`！你可以在 [Rust 语言参考书的第 3 章](https://doc.rust-lang.org/reference/macros-by-example.html)\
  \ 中找到片段类型的完整列表。这些，再加上重复匹配模式的机制（`$()`），使你能够匹配大多数简单的代码模式。然而，如果你发现用匹配器难以表达你想要的模式，那么你可以尝试使用过程宏，因为过程宏不需要遵循\
  \ `macro_rules!` 所要求的严格语法。我们稍后将在本章中更详细地介绍这些内容。\n\n## 转录器\n\n一旦编译器匹配了声明式宏的匹配器，它就会使用该匹配器关联的转录器生成代码。宏匹配器定义的变量称为元变量。编译器会将转录器中每个元变量的每次出现（如上一节示例中的\
  \ `$key`）替换为与匹配器该部分匹配的输入。如果匹配器中有重复（如那个示例中的 `$(),+`），你可以在转录器中使用相同的语法，它将对输入中的每个匹配重复一次，每次展开都会为该次迭代持有每个元变量的适当替换。例如，对于\
  \ `$key` 和 `$value` 匹配器，我们可以编写以下转录器，为每个匹配到的 `$key`/`$value` 对生成一次对某个 map 的 `insert`\
  \ 调用：\n\n```\n$(map.insert($key, $value;)+\n```\n\n注意，这里我们希望对每次重复使用分号，而不只是分隔重复，因此我们将分号放在重复括号内。你必须在转录器的每个重复中使用一个元变量，以便编译器知道要使用匹配器中的哪个重复（以防有多个重复）。\n\
  \n## 卫生性\n\n你可能听说过 Rust 宏是卫生的，也许认为卫生使它们更安全或更易于使用，但未必理解这意味着什么。当我们说 Rust 宏是卫生的，我们的意思是声明式宏（通常）不能影响未明确传递给它的变量。一个简单的例子是：如果你声明了一个名为\
  \ `foo` 的变量，然后调用一个也定义了名为 `foo` 的变量的宏，那么默认情况下，宏的 `foo` 在调用点（即宏被调用的地方）是不可见的。类似地，宏也不能访问在调用点定义的变量（甚至\
  \ `self` 也不行），除非它们被显式传入。\n\n在大多数情况下，你可以将宏标识符视为存在于自己的命名空间中，与它们展开成的代码的命名空间是分开的。例如，看看清单\
  \ 8-5 中的代码，其中有一个宏试图（但失败了）遮蔽调用点的一个变量。\n\n```\nmacro_rules! let_foo {\n    ($x:expr)\
  \ => {\n        let foo = $x;\n    }\n}\nlet foo = 1;\nlet_foo!(2);\n// expands\
  \ to let foo = 2;\nassert_eq!(foo, 1);\n```\n\n*清单 8-5：宏存在于它们自己的小宇宙中。大多数情况下如此。*\n\
  \n```rust\nlet mut x = 1;\nplease_set!(x, x + 1);\nassert_eq!(x, 2);\n```\n\n*清单\
  \ 8-6：让宏访问调用点的标识符*\n\n我们本可以在宏中使用 `$i + 1`，但不能使用 `x + 1`，因为名字 `x` 在宏的定义作用域中不可用。\n\
  \n关于声明式宏和作用域，还有最后一点要注意：与 Rust 中几乎所有其他内容不同，声明式宏只有在声明之后才存在于源代码中。如果你试图使用文件中靠后定义的宏，那将行不通！这适用于整个项目；如果你在一个模块中声明了一个宏，并想在另一个模块中使用它，那么声明宏的模块必须在\
  \ crate 中较早出现，而不是较晚。反过来，如果 `foo` 和 `bar` 是 crate 根部的模块，而 `foo` 声明了一个 `bar` 想要使用的宏，那么\
  \ `mod foo` 必须出现在 *lib.rs* 中的 `mod bar` 之前！\n\n> **注意**  \n> *对于这种奇特的宏作用域（正式名称为文本作用域），有一个例外：如果你用\
  \ `#[macro_export]` 标记宏。该注解实际上会将宏提升到 crate 的根，并将其标记为 pub，因此它可以在你的 crate 中的任何地方或由你的\
  \ crate 的依赖者使用。*\n\n## 过程宏\n\n你可以把过程宏看作是解析器和代码生成的组合，而你在其中编写胶水代码。在高层面上，使用过程宏时，编译器会收集输入宏的令牌序列，并运行你的程序来确定应该用哪些令牌来替换它们。\n\
  \n过程宏之所以被称为“过程”宏，是因为你定义的是给定一些输入令牌后*如何*生成代码，而不仅仅是写出生成什么代码。编译器这一侧涉及的智能很少——就编译器而言，过程宏或多或少是一个可以执行任意代码替换的源代码预处理器。你的输入必须能被解析为\
  \ Rust 令牌流这一要求仍然存在，但也仅此而已！\n\n## 过程宏的类型\n\n过程宏有三种不同的风格，每种都专门针对一个特定的常见用例：\n\n-  \
  \ 函数式宏，类似于 `macro_rules!` 生成的宏\n-   派生宏，如 `#[derive(Serialize)]`\n-   属性宏，如 `#[test]`\n\
  \n这三种类型都使用相同的基本机制：编译器向你的宏提供一个令牌序列，并期望你产生\n\n一个（可能）与输入树相关的令牌序列作为回报。然而，它们在宏的调用方式以及输出的处理方式上有所不同。接下来我们将逐一简要介绍。\n\
  \n## 函数式宏\n\n函数式宏是过程宏中最简单的形式。与声明式宏类似，它只是用过程宏返回的代码替换调用点的宏代码。然而，与声明式宏不同，所有的护栏都已移除：这些宏（像所有过程宏一样）不要求是卫生的，也不会保护你不与调用点周围代码中的标识符产生交互。相反，你的宏需要明确说明哪些标识符应与周围代码重叠（使用\
  \ `Span::call_site`），哪些应被视为宏私有的（使用 `Span::mixed_site`，我们稍后讨论）。\n\n## 属性宏\n\n属性宏同样是整体替换属性所附加的项，但它接受两个输入：属性中出现的令牌树（减去属性名）和它附加到的整个项的令牌树，包括该项可能拥有的任何其他属性。属性宏允许你轻松编写一个过程宏来转换某个项，例如向函数定义添加序言或尾声（就像\
  \ `#[test]` 所做的那样），或者修改结构体的字段。\n\n## 派生宏\n\n派生宏与另外两种略有不同，因为它是对宏目标进行添加，而不是替换。尽管这一限制可能看起来有些严格，但派生宏正是过程宏创建初期的主要推动因素之一。具体来说，著名的\
  \ serde crate 需要派生宏来实现其如今广为人知的 `#[derive(Serialize, Deserialize)]` 魔法。\n\n派生宏可以说是过程宏中最简单的，因为它们的形态非常固定：你只能在被注解的项后面追加项；不能替换被注解的项，也不能让派生过程接受参数。派生宏确实允许你定义辅助属性——放在被注解类型内部以给派生宏提供线索的属性（如\
  \ `#[serde(skip)]`）——但这些属性大多像标记一样起作用，并不是独立的宏。\n\n## 过程宏的代价\n\n在我们讨论每种过程宏类型何时适用之前，有必要讨论一下为什么在伸手拿起过程宏之前你可能要三思——也就是编译时间的增加。\n\
  \n过程宏可能因为两个主要原因而显著增加编译时间。首先，它们往往会带来一些相当\n\n\n依赖很重。例如，`syn` crate 为 Rust 标记流提供了解析器，大大简化了编写过程宏的体验，但在启用所有特性时，它可能需要数十秒才能编译完成。这个问题可以通过禁用不需要的特性，以及以调试模式而非发布模式编译过程宏来缓解（也应该这样做）。代码在调试模式下通常编译速度快几倍，对于大多数过程宏来说，你甚至不会注意到执行时间上的差异。\n\
  \n第二个原因是，过程宏很容易在不知不觉中生成大量代码。虽然宏让你不必真正输入生成的代码，但它并不能让编译器免于解析、编译和优化这些代码。随着你使用更多的过程宏，那些生成的样板代码会不断累积，从而拖慢编译时间。\n\
  \n值得指出的是，过程宏的实际执行时间很少成为整体编译时间的因素。虽然编译器必须等待过程宏完成其工作才能继续，但实际上大多数过程宏不会进行任何繁重的计算。*话虽如此，*\
  \ 如果你的过程宏特别复杂，你可能会发现编译过程会把大量执行时间花在你的过程宏代码上，这一点值得留意！\n\n## 那么，你认为你需要一个宏\n\n现在让我们看看每种过程宏的一些好的使用场景。我们先从简单的开始：派生宏。\n\
  \n## 何时使用派生宏\n\n派生宏只为一件事，而且仅此一件：在可以自动化的情况下，自动生成某个 trait 的实现。并非所有 trait 都有显而易见的自动化实现，但很多都有。在实践中，只有当某个\
  \ trait 经常被实现，并且它对任何给定类型的实现都相当明显时，你才应该考虑为它添加派生宏。第一点可能看起来像常识；如果你的 trait 只会被实现一两次，那么为它编写和维护一个复杂的派生宏可能并不值得。\n\
  \n然而，第二点可能看起来更奇怪：实现“显而易见”是什么意思？考虑一个像 `Debug` 这样的 trait。如果你被告知 `Debug` 的作用，并看到一个类型，你很可能会期望\
  \ `Debug` 的实现输出每个字段的名称以及其值的调试表示。这正是 `derive(Debug)` 所做的。那 `Clone` 呢？你可能会期望它直接克隆每个字段——同样，这正是\
  \ `derive(Clone)` 所做的。对于 `derive(serde::Serialize)`，我们希望它序列化每个字段及其值，而它也的确如此。总的来说，你希望\
  \ trait 的派生实现能够匹配开发者直觉中它大概会做的事情。如果某个 trait 没有明显的派生方式，或者更糟的是，你的派生实现与显而易见的实现不一致，那么最好不要为它提供派生宏。\n\
  \n## 何时使用函数式宏\n\n函数式过程宏更难给出一个通用的经验法则。你可能会说，当你想要一个函数式宏但无法用 `macro_rules!` 表达时，就应该使用函数式宏，但这是一个相当主观的指导原则。毕竟，如果你真的用心去做，声明式宏也能做很多事情。\n\
  \n有两个特别好的理由让人选择函数式过程宏：\n\n-   如果你已经有一个声明式宏，但其定义变得非常杂乱，导致宏难以维护。\n-   如果你有一个纯函数，需要在编译时执行，但无法用\
  \ `const fn` 表达。这方面的一个例子是 `phf` crate：当在编译时给出一组键时，它会使用完美哈希函数生成一个哈希映射或集合。另一个例子是 `hex-literal`，它接收一个十六进制字符串并将其替换为相应的字节。一般来说，任何在编译时不仅转换输入，而是实际对输入进行计算的宏，都可能是一个好的候选者。\n\
  \n我还要补充一点，我不建议仅仅为了破坏宏的卫生性而采用函数式过程宏。函数式宏的卫生性是一个能避免许多调试麻烦的特性，在你故意破坏它之前，应该非常仔细地思考。\n\
  \n## 何时使用属性宏\n\n接下来就剩下属性宏了。尽管它们可以说是过程宏中最通用的一种，但也最难确定在何时使用它们才是合适的。多年来，我反复看到四个用例是属性过程宏带来巨大价值的典型例子：\n\
  \n### 测试生成\n\n我们通常希望在不同的配置下运行同一个测试，或者使用相同的引导代码运行许多类似的测试。虽然声明式宏可以让你表达这一点，但如果你有一个像\
  \ `#[foo_test]` 这样的属性，在每个被标注的测试中引入设置前奏和收尾代码，或者一个像 `#[test_case(1)]`、`#[test_case(2)]`\
  \ 这样的可重复属性，用来标记某个测试应使用每个输入重复多次，那么你的代码通常会更容易阅读和维护。\n\n### 框架注解\n\n像 `rocket` 这样的库使用属性宏为函数和类型增加额外信息，框架随后利用这些信息，而无需用户进行大量手动配置。能够直接编写\
  \ `#[get(\"/<name>\")] fn hello(name: String)` 比设置一个带有函数指针等的配置结构体要方便得多。本质上，这些属性构成了一种微型的领域特定语言（DSL），隐藏了大量原本必需的样板代码。类似地，异步\
  \ I/O 框架 `tokio` 允许你使用 `#[tokio::main] async fn main()` 来自动设置一个运行时并运行你的异步代码，从而让你不必在每个异步应用的\
  \ `main` 函数中编写相同的运行时设置。\n\n### 透明中间件\n\n有些库希望以不引人注目的方式注入到你的应用程序中，以提供不改变应用功能的附加价值。例如，像\
  \ `tracing` 这样的追踪与日志库，以及像 `metered` 这样的指标收集库，允许你通过添加一个属性来透明地检测函数；之后每次调用该函数都会运行由该库决定的额外代码。\n\
  \n### 类型转换器\n\n有时你希望不仅仅是为类型派生 trait，而是以某种根本方式实际改变类型的定义。在这种情况下，属性宏是正确的选择。`pin_project`\
  \ crate 就是一个很好的例子：它的主要目的不是实现特定的 trait，而是确保对给定类型字段的所有固定访问都遵循 Rust 的 `Pin` 类型和 `Unpin`\
  \ trait 所规定的严格规则（我们将在第 9 章详细讨论这些类型）。它通过生成额外的辅助类型、为被标注的类型添加方法，并引入静态安全检查，确保用户不会意外地搬起石头砸自己的脚。虽然\
  \ `pin_project` 本来可以用过程式派生宏实现，但这可能会违背派生 trait 实现应显而易见的预期。\n\n## 它们是如何工作的？\n\n所有过程宏的核心是\
  \ `TokenStream` 类型，你可以遍历它来获取构成该标记流的各个 `TokenTree` 项。一个 `TokenTree` 要么是一个单独的标记——比如标识符、标点符号或字面量——要么是由\
  \ `()` 或 `{}` 等分隔符包围的另一个 `TokenStream`。通过遍历 `TokenStream`，你可以解析出任意你希望的语法，只要这些单独的标记是有效的\
  \ Rust 标记。如果你特别想将输入解析为 Rust 代码，那么你可能会想使用 `syn` crate，它实现了完整的 Rust 解析器，可以将 `TokenStream`\
  \ 转换为易于遍历的 Rust AST。\n\n对于大多数过程宏，你不仅需要解析 `TokenStream`，还需要生成 Rust 代码，注入到调用该过程宏的程序中。有两种主要方法。第一种是手动构造\
  \ `TokenStream`，每次扩展一个 `TokenTree`。第二种\n\n使用 TokenStream 的 FromStr 实现即可，你可以用 `\"\
  \".parse::<TokenStream>()` 将包含 Rust 代码的字符串解析为 TokenStream。你也可以混合使用这些方法；如果想在宏的输入前加上一些代码，只需为前言构造一个\
  \ TokenStream，然后使用 Extend trait 将原始输入追加上去。\n\n> NOTE TokenStream 还实现了 Display，它会以可读的方式打印流中的\
  \ token。这在调试时非常有用！\n\nToken 比我迄今描述的要稍微神奇一点，因为每个 token，实际上每个 TokenTree，都有一个 span。Span\
  \ 是编译器将生成的代码关联回生成该代码的源代码的方式。每个 token 的 span 标记了该 token 来自的原始源位置。例如，考虑 Listing 8-7\
  \ 中的宏，它为提供的类型生成一个平凡的 Debug 实现。\n\n```\nmacro_rules! name_as_debug {\n    ($t:ty)\
  \ => {\n        impl ::core::fmt::Debug for $t {\n            fn fmt(&self, f: &mut\
  \ ::core::fmt::Formatter<'_>) -> ::core::fmt::Result\n            {\n          \
  \      ::core::write!(f, ::core::stringify!($t))\n            }\n        }\n   \
  \ }\n}\n```\n\nListing 8-7: 一个实现 Debug 的非常简单的宏\n\n现在假设有人用 name_as_debug!(u31) 调用此宏。技术上，编译器错误发生在宏内部，具体在我们写\
  \ for $t 的地方（$t 的另一处使用可以处理无效类型）。但我们希望编译器指向用户代码中的 u31——事实上，span 正是让我们做到这一点。\n\n生成的代码中\
  \ $t 的 span 是映射到宏调用中 $t 的代码。该信息随后在编译器中传递并与最终的编译器错误关联。当该编译器错误最终被打印时，编译器会打印宏内部的错误，说明类型\
  \ u31 不存在，但会高亮宏调用中的 u31 参数，因为那是错误的关联 span！\n\nSpan 非常灵活，它们使你能够编写能通过 compile_error\
  \ 宏产生复杂错误信息的过程宏。顾名思义，compile_error! 会导致编译器在放置它的位置发出错误，并以提供的字符串作为消息。这看起来可能没什么用，直到你把它与\
  \ span 结合起来。通过将你为 compile_error! 调用生成的 TokenTree 的 span 设置为与输入的某个子集的 span 相等，你实际上是在告诉编译器“发出此编译器错误，并指向用户源代码的这一部分。”这两种机制结合起来，让宏产生的错误看起来源自代码的相关部分，即使实际的编译器错误在用户从未见过的生成的代码中的某个位置！\n\
  \n> NOTE\n>\n> 如果你曾好奇 syn 的错误处理是如何工作的，其 Error 类型实现了 Error::to_compile_error 方法，它会将其转换为仅包含\
  \ compile_error! 指令的 TokenStream。syn 的 Error 类型特别巧妙的地方在于它内部保存了一组错误，每个错误都会产生一个具有自己\
  \ span 的不同的 compile_error! 指令，这样你就可以轻松地从过程宏中产生多个独立的错误。\n\nspan 的威力还不止于此；span 也是\
  \ Rust 宏卫生性实现的机制。当你构造一个 Ident token 时，你也会给出该标识符的 span，而该 span 决定了该标识符的作用域。如果你将标识符的\
  \ span 设置为 Span::call_site()，标识符将在宏被调用的位置解析，因此不会与周围的作用域隔离。反之，如果你将其设置为 Span::mixed_site()，则（变量）标识符将在宏定义位置解析，因此相对于调用位置同名变量将完全卫生。Span::mixed_site\
  \ 之所以这样命名，是因为它与 macro_rules! 中标识符卫生性的规则相匹配，我们之前讨论过它是“混合”的，即在调用位置和宏定义位置之间解析标识符。\n\
  \n### Summary\n\n在本章中，我们介绍了声明式宏和过程宏，并探讨了在你自己的代码中何时可能觉得它们有用。我们还深入研究了支撑每种宏类型的机制，以及在编写自己的宏时需要注意的一些特性和陷阱。在下一章，我们将开始进入异步编程和\
  \ Future trait 的旅程。我保证——它就在下一页。\n"
- "# 9 ASYNCHRONOUS PROGRAMMING\n\n![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_120_0.png)\n\
  \n异步编程顾名思义，就是非同步的编程。在高层面上，异步操作在后台执行——程序不会等待异步操作完成，而是会立即继续执行下一行代码。如果你对异步编程还不熟悉，这个定义可能感觉不够，因为它并没有真正解释异步编程是什么。要真正理解\
  \ Rust 中的异步编程模型及其工作原理，我们必须先深入了解替代方案。也就是说，我们需要在理解异步模型之前先理解同步编程模型。这在澄清概念和展示使用异步编程的权衡方面都很重要：异步解决方案并不总是正确的！我们将从先快速了解异步编程作为概念的动机开始；然后深入探讨\
  \ Rust 中异步在底层实际如何工作。\n\n### What’s the Deal with Asynchrony?\n\n在我们进入同步和异步编程模型的细节之前，我们首先需要快速了解一下你的计算机在运行你的程序时实际在做什么。\n\
  \n计算机很快。非常快。事实上快到它们大部分时间都在等待事情发生。除非你在解压缩文件、编码音频或 crunch 数字，否则很可能你的 CPU 大部分时间都在空闲，等待操作完成。它在等待网络数据包到达，等待鼠标移动，等待磁盘完成写入字节，甚至可能只是等待主内存读取完成。从\
  \ CPU 的角度来看，在大多数此类事件之间，漫长的岁月过去了。当其中一个事件发生时，CPU 运行几条指令，然后又回到等待状态。看看你的 CPU 利用率——它可能在个位数徘徊，而且这很可能就是它大部分时间的状态。\n\
  \n### Synchronous Interfaces\n\n同步接口只允许你的程序（或更确切地说，你程序中的单个线程）一次执行一个操作；每个操作必须等待前一个同步操作完成后才能运行。你在野外看到的大多数接口都是同步的：你调用它们，它们去做一些事情，最终在操作完成后返回，你的程序就可以继续了。其原因正如本章后面会看到的，是使操作异步需要相当多的额外机制。除非你需要异步的好处，否则坚持同步模型需要的繁文缛节要少得多。\n\
  \n同步接口隐藏了所有这些等待；应用程序调用一个函数说“把这些字节写入这个文件”，一段时间后，该函数完成，下一行代码执行。在幕后，真正发生的是操作系统将写操作排队到磁盘，然后让应用程序休眠，直到磁盘报告写操作已完成。应用程序将其体验为函数执行时间很长，但实际上它根本没有执行，只是在等待。\n\
  \n以这种方式顺序执行操作的接口也常被称为阻塞，因为接口中必须等待某些外部事件发生才能取得进展的操作会阻塞进一步的执行，直到该事件发生。无论你将接口称为同步还是阻塞，其基本思想都相同：应用程序不会继续，直到当前操作完成。在操作等待期间，应用程序也在等待。\n\
  \n同步接口通常被认为易于使用且易于推理，因为你的代码一次只执行一行。\n\n\n\n\n但它们也只允许应用程序一次做一件事。这意味着如果你的程序想要等待用户输入或网络数据包，除非你的操作系统提供了专门用于此的操作，否则你就无计可施。同样，即使你的应用程序在磁盘写入文件时可以做一些其他有用的工作，它也没有这个选项，因为文件写入操作会阻塞执行！\n\
  \n## 使用多线程实现并发\n\n迄今为止，允许并发执行最常见的方法是使用多线程。在多线程程序中，每个线程负责执行一个特定的独立的阻塞操作序列，操作系统在线程之间进行复用，这样如果有任何线程可以取得进展，就能取得进展。如果一个线程被阻塞，其他某个线程可能仍然可以运行，因此应用程序可以继续做有用的工作。\n\
  \n通常，这些线程使用锁或通道之类的同步原语相互通信，以便应用程序仍能协调它们的工作。例如，你可能有一个等待用户输入的线程，一个等待网络数据包的线程，以及另一个等待其中任一线程在所有三个线程之间共享的通道上发送消息的线程。\n\
  \n多线程为你提供了并发——能够在同一时间执行多个独立操作的能力。运行应用程序的系统（在本例中为操作系统）负责在未被阻塞的线程中选择并决定下一个执行哪个线程。如果一个线程被阻塞，它可以选择运行另一个可以取得进展的线程。\n\
  \n多线程结合阻塞接口可以走得很远，而且大量可投入生产的软件都是以这种方式构建的。但这种方法并非没有缺点。首先，跟踪所有这些线程很快就会变得繁琐；如果你必须为每个并发任务启动一个线程，包括像等待键盘输入这样简单的任务，线程会迅速累积，跟踪所有这些线程如何交互、通信和协调所需的额外复杂性也会随之增加。\n\
  \n其次，在线程之间切换的成本会随着线程数量的增加而变得昂贵。每当一个线程停止运行，另一个线程在其位置重新启动时，你需要进行一次往返操作系统调度程序的调用，而这并非免费。在某些平台上，创建新线程也是一项相当重量级的过程。性能要求高的应用程序通常通过重用线程并使用允许你在许多相关操作上阻塞的操作系统调用来减轻这种成本，但最终你仍会遇到同样的问题：阻塞接口要求你拥有与你想要进行的阻塞调用数量一样多的线程。\n\
  \n最后，线程为你的程序引入了并行性。并发与并行之间的区别很微妙，但很重要：并发意味着你的任务执行是交错的，而并行意味着多个任务同时执行。如果有两个任务，用 ASCII\
  \ 表示可能看起来像 _-_-_（并发）与 =====（并行）。多线程并不一定意味着并行——即使你有许多线程，你可能只有一个核心，因此在给定时间只有一个线程在执行——但两者通常是相辅相成的。你可以通过使用\
  \ Mutex 或其他同步原语使两个线程在执行上互斥，但这会引入额外的复杂性——线程希望并行运行。而虽然并行通常是一件好事——谁不希望自己的程序在更多核心上运行得更快——但这也意味着你的程序必须处理对共享数据结构的真正同时访问。这意味着从\
  \ Rc、Cell 和 RefCell 迁移到更强大但也更慢的 Arc 和 Mutex。虽然你可能希望在并发程序中使用后者类型以实现并行，但线程会迫使你使用它们。\n\
  \n## 异步接口\n\n现在我们已经探讨了同步接口，我们可以来看一下替代方案：异步或非阻塞接口。异步接口是指可能不会立即产生结果，而可能表明结果将在稍后某个时间可用。这给了调用者机会在等待期间做其他事情，而不是必须休眠直到特定操作完成。在\
  \ Rust 用语中，异步接口是一种返回 Poll 的方法，如清单 9-1 所定义。\n\n```rust\nenum Poll<T> {\n    Ready(T),\n\
  \    Pending\n}\n```\n\n清单 9-1：异步的核心：“给你或稍后再来”的类型\n\nPoll 通常出现在以 poll 开头的函数的返回类型中——这些方法是信号表明它们可以尝试在不阻塞的情况下执行操作。我们将在本章后面了解它们具体如何做到这一点，但总的来说，它们在通常会阻塞之前尝试尽可能多地执行操作，然后返回。至关重要的是，它们记住自己停在了哪里，以便在以后可以再次取得进展时恢复执行。\n\
  \n这些非阻塞函数使我们能够轻松地并发执行多个任务。例如，如果你想从网络或用户键盘读取，以先有事件可用者为准，你所要做的就是在一个循环中轮询两者，直到其中一个返回\
  \ Poll::Ready。无需任何额外的线程或同步！\n\n这里的“循环”一词应该让你有点紧张。你不希望你的程序每秒烧掉三十亿次循环，而下一个输入可能要等几分钟才会出现。在阻塞接口的世界里，这不是问题，因为操作系统只是让线程休眠，然后在相关事件发生时负责唤醒它，但在这种大胆的新非阻塞世界中，我们如何避免在等待时浪费周期？这正是本章剩余大部分内容要讨论的问题。\n\
  \n这段代码看起来与等价的同步代码非常相似，而且易于阅读。我们只是在一个循环中发送收到的每条消息，直到没有更多消息为止，而每个 await 点都对应于同步变体可能阻塞的位置。现在想想如果你必须通过手动实现\
  \ Future trait 来表达这段代码会怎样。由于每次调用 poll 都是从函数顶部开始的，你需要打包必要的状态以从代码上次让出时的位置继续。结果相当丑陋，如清单\
  \ 9-4 所示。\n\n```rust\nenum Forward<T> { ①\n    WaitingForReceive(ReceiveFuture<T>,\
  \ Option<Sender<T>>),\n    WaitingForSend(SendFuture<T>, Option<Receiver<T>>),\n\
  }\n\nimpl<T> Future for Forward<T> {\n    type Output = (); ②\n    fn poll(&mut\
  \ self) -> Poll<Self::Output> {\n        match self { ③\n            Forward::WaitingForReceive(recv,\
  \ tx) => {\n                if let Poll::Ready((rx, v)) = recv.poll() {\n      \
  \              if let Some(v) = v {\n                        let tx = tx.take().unwrap();\
  \ ④\n                        *self = Forward::WaitingForSend(tx.send(v), Some(rx));\
  \ ⑤\n                        // Try to make progress on sending.\n             \
  \           return self.poll(); ⑥\n                    } else {\n              \
  \          // No more items.\n                        Poll::Ready(())\n        \
  \            }\n                } else {\n                    Poll::Pending\n  \
  \              }\n            }\n            Forward::WaitingForSend(send, rx) =>\
  \ {\n                if let Poll::Ready(tx) = send.poll() {\n                  \
  \  let rx = rx.take().unwrap();\n                    *self = Forward::WaitingForReceive(rx.receive(),\
  \ Some(tx));\n                    // Try to make progress on receiving.\n      \
  \              return self.poll();\n                } else {\n                 \
  \   Poll::Pending\n                }\n            }\n        }\n    }\n}\n```\n\n\
  清单 9-4：手动实现一个通道转发 future\n\n你很少需要在 Rust 中再写这样的代码了，但它提供了对底层工作原理的重要见解，所以让我们逐步分析一下。首先，我们将我们的\
  \ future 类型定义为一个枚举 ①，我们将使用它来跟踪我们当前正在等待的内容。这是由于\n\n\n\n当我们返回 `Poll::Pending` 时，下一次调用\
  \ `poll` 会再次从函数顶部开始执行。我们需要某种方式来知道之前执行到了哪一步，这样才能知道应该继续执行哪个操作。此外，我们还需要根据当前正在执行的操作来跟踪不同的信息：如果我们正在等待接收操作完成，就需要保留那个\
  \ `ReceiveFuture`（本示例中未展示其定义），以便下一次我们自己被轮询时可以对它进行轮询；`SendFuture` 也是如此。这里的 `Option`\
  \ 可能也会让你觉得有些奇怪；我们很快就会回到这个问题。\n\n当我们为 `Forward` 实现 `Future` 时，会将其输出类型声明为 `()` ②，因为这个\
  \ future 实际上不会返回任何内容。相反，当它完成了将输入通道中的所有内容转发到输出通道后，这个 future 就会完成（不产生任何结果）。在更完整的示例中，我们的转发类型的\
  \ `Output` 可能会是一个 `Result`，这样它就能将 `receive()` 和 `send()` 中的错误向上传递给负责轮询转发操作是否完成的函数。不过，这段代码已经足够复杂了，所以我们把这个问题留到以后再讨论。\n\
  \n当 `Forward` 被轮询时，它需要从上次停止的地方继续执行；我们可以通过匹配 `self` 当前持有的枚举变体来确定这一点 ③。无论进入哪个分支，第一步都是轮询会阻塞当前操作继续进行的\
  \ future；如果我们正在尝试接收，就轮询 `ReceiveFuture`；如果正在尝试发送，就轮询 `SendFuture`。如果这次调用 `poll`\
  \ 返回 `Poll::Pending`，那么我们无法取得任何进展，于是自己也返回 `Poll::Pending`。但如果当前的 future 完成了，我们就有工作要做了！\n\
  \n当其中一个内部 future 完成时，我们需要通过切换 `self` 中存储的枚举变体来更新当前操作。为此，我们必须从 `self` 中移出内容，以调用 `Receiver::receive`\
  \ 或 `Sender::send`——但我们做不到，因为手头只有 `&mut self`。因此，我们将必须移出的状态存储在一个 `Option` 中，然后使用\
  \ `Option::take` 将其移出 ④。由于我们接下来马上就要覆盖 `self` ⑤，这样做其实有些多余，因此这些 `Option` 始终都会是 `Some`；但有时为了让借用检查器满意，就需要使用这样的技巧。\n\
  \n最后，如果我们确实取得了进展，就会再次轮询 `self` ⑥，这样一来，如果我们能够立即继续处理尚未完成的发送或接收操作，就可以直接完成。这在实现真正的 `Future`\
  \ trait 时对于正确性而言确实是必要的，我们稍后会再讨论；不过目前可以把它看作一种优化。\n\n我们刚刚手写了一个状态机：一种拥有多个可能状态，并会响应特定事件在这些状态之间切换的类型。而且这还是一个相当简单的状态机。想象一下，在更复杂的使用场景中，如果还有额外的中间步骤，你得为此编写怎样一大段代码！\n\
  \n除了要编写这种笨重的状态机之外，我们还必须知道 `Sender::send` 和 `Receiver::receive` 返回的 future 的类型，这样才能将它们存储在我们的类型中。如果这些方法返回的是\
  \ `impl Future`，我们就没有办法写出各个变体所需的具体类型。这些 `send` 和 `receive` 方法还必须取得发送端和接收端的所有权；如果不是这样，它们返回的\
  \ future 的生命周期就会与对 `self` 的借用绑定，而这个借用会在我们从 `poll` 返回时结束。但这行不通，因为我们正试图将这些 future\
  \ 存储在 `self` 中。\n\n> 注意：你可能已经注意到，`Receiver` 看起来很像异步版本的 `Iterator`。其他人也注意到了这一点，标准库正在逐步添加一个专门用于那些能够合理实现\
  \ `poll_next` 的类型的 trait。从长远来看，这些异步迭代器（通常称为 stream）可能会获得一流的语言支持，例如能够直接对它们进行循环！\n\
  \n归根结底，这段代码难以编写、难以阅读，也难以修改。例如，如果我们想添加错误处理，代码的复杂度就会显著增加。幸运的是，还有更好的方法！\n\n## async/await\n\
  \nRust 1.39 为我们带来了 `async` 关键字以及与之密切相关的后缀运算符 `await`，我们在示例 9-3 的原始代码中使用了它们。二者结合起来，为编写类似示例\
  \ 9-5 中的异步状态机提供了一种更加便利的机制。具体来说，它们让你能够以一种完全不像状态机的方式编写代码！\n\n```\nasync fn forward<T>(rx:\
  \ Receiver<T>, tx: Sender<T>) {\n    while let Some(t) = rx.next().await {\n   \
  \     tx.send(t).await;\n    }\n}\n```\n\n示例 9-5：使用 async 和 await 实现通道转发 future，重复自示例\
  \ 9-3\n\n如果你对 `async` 和 `await` 不太熟悉，那么示例 9-3 与示例 9-5 之间的差异，或许能让你理解为什么 Rust 社区在它们加入\
  \ Rust 时会如此兴奋。不过，既然这是一本中级读物，那我们就深入一点，了解这段简短的代码究竟如何取代前面那段长得多的手动实现。为此，我们首先需要讨论生成器——`async`\
  \ 和 `await` 的实现机制。\n\n## 生成器\n\n简单来说，生成器是一段代码，其中包含一些由编译器额外生成的部分，使它能够在执行到一半时停止或让出执行权，之后再从上次让出的位置继续执行。以示例\
  \ 9-3 中的 `forward` 函数为例。假设它执行到了 `send` 调用，但通道当前已满。函数无法再取得任何进展，但也不能阻塞（毕竟这是非阻塞代码），所以它需要返回。现在假设通道最终有了空间，我们希望继续执行发送操作。如果我们从顶部再次调用\
  \ `forward`，它会再次调用 `next`，而我们之前尝试发送的项目就会丢失，这显然不行。因此，我们将 `forward` 转换为一个生成器。\n\n\
  每当 `forward` 生成器无法继续取得进展时，它都需要将当前状态存储在某个地方，这样当它最终恢复执行时，就能在正确的位置、以正确的状态继续运行。它通过一个由编译器生成的关联数据结构来保存状态，该数据结构包含生成器在某个时间点的全部状态。这个数据结构上的一个方法（同样由编译器生成）允许生成器从存储在\
  \ `&mut self` 中的当前状态恢复执行，并在生成器再次无法取得进展时更新状态。\n\n这种“返回，但允许我稍后恢复执行”的操作称为让出（yielding），它实际上意味着函数在返回的同时，将额外的状态保留在一旁。当我们稍后想要恢复对\
  \ `forward` 的调用时，就会调用生成器中已知的入口点（也就是恢复方法；对于异步生成器来说，这个方法就是 `poll`），生成器会检查之前存储在 `self`\
  \ 中的状态，以决定下一步该做什么。这正是我们在示例 9-4 中手动完成的事情！换句话说，示例 9-3 中的代码大致可以反糖化为示例 9-6 中所示的假想代码。\n\
  \n```\ngenerator fn forward<T>(rx: Receiver<T>, tx: Sender<T>) {\n    loop {\n \
  \       let mut f = rx.next();\n        let r = if let Poll::Ready(r) = f.poll()\
  \ { r } else { yield };\n        if let Some(t) = r {\n            let mut f = tx.send(t);\n\
  \            let _ = if let Poll::Ready(r) = f.poll() { r } else { yield };\n  \
  \      } else { break Poll::Ready(()); }\n    }\n}\n```\n\n示例 9-6：将 async/await\
  \ 反糖化为生成器\n\n在撰写本书时，生成器实际上还无法在 Rust 中使用——它们目前仅由编译器内部用于实现 `async/await`——但这种情况未来可能会改变。生成器在许多场景中都很有用，例如实现迭代器时不必携带一个结构体，或者使用能够确定如何一次让出一个项目的\
  \ `impl Iterator`。\n\n如果你仔细观察示例 9-3 和示例 9-5，那么在知道每个 `await` 或 `yield` 实际上都是函数的一次返回之后，它们可能会显得有些神奇。毕竟，函数中有多个局部变量，而当我们稍后恢复执行时，并不清楚这些变量是如何被恢复的。这正是生成器中由编译器生成的部分发挥作用的地方。编译器会透明地注入代码，在执行时将这些变量持久化到生成器的关联数据结构中，并从中读取它们，而不是将它们存储在栈上。因此，如果你声明、写入或读取某个局部变量\
  \ `a`，实际上操作的是类似于 `self.a` 的东西。问题解决！这一切确实非常奇妙。\n\n手动实现的 `forward` 与 `async/await`\
  \ 版本之间，有一个微妙但重要的区别：后者可以跨越让出点持有引用。这使得示例 9-5 中的 `Receiver::next` 和 `Sender::send`\
  \ 等函数可以接收 `&mut self`，而不是示例 9-3 中它们所接收的 `self`。如果我们尝试在手动状态\n\n\n\nmachine implementation,\
  \ the borrow checker would have no way to enforce that the `Receiver` stored inside\
  \ `Forward` cannot be referenced between when `Receiver::next` is called and when\
  \ the future it returns resolves, and so it would reject the code. Only by moving\
  \ the `Receiver` into the future can we convince the compiler that the `Receiver`\
  \ is not otherwise accessible. Meanwhile, with async/await, the borrow checker can\
  \ inspect the code before the compiler turns it into a state machine and verify\
  \ that `rx` is indeed not accessed again until after the future is dropped, when\
  \ the await on it returns.\n\n## THE SIZE OF GENERATORS\n\nThe data structure used\
  \ to back a generator’s state must be able to hold the combined state at any one\
  \ yield point. If your async fn contains, say, a `[u8; 8192]`, those 8 KiB must\
  \ be stored in the generator itself. Even if your async fn only contains smaller\
  \ local variables, it must also contain any future that it awaits, since it needs\
  \ to be able to poll such a future later, when `poll` is invoked.\n\nThis nesting\
  \ means that generators, and thus futures based on async functions and blocks, can\
  \ get quite large without any visible indicator of that increased size in your code.\
  \ This can in turn impact your program’s runtime performance, since those giant\
  \ generators may have to be copied across function calls and in and out of data\
  \ structures, which amounts to a fair amount of memory copying. In fact, you can\
  \ usually identify when the size of your generator-based futures is affecting performance\
  \ by looking for excessive amounts of time spent in the `memcpy` function in your\
  \ application’s performance profiles!\n\nFinding these large futures isn’t always\
  \ easy, however, and often requires manually identifying long or complex chains\
  \ of async functions. Clippy may be able to help with this in the future, but at\
  \ the time of writing, you’re on your own. When you do find a particularly large\
  \ future, you have two options: you can try to reduce the amount of local state\
  \ the async functions need, or you can move the future to the heap (with `Box::pin`),\
  \ so that moving the future just requires moving the pointer to it. The latter is\
  \ by far the easiest way to go, but also introduces an extra allocation and a pointer\
  \ indirection. Your best bet is usually to put the problematic future on the heap,\
  \ measure your performance, and then use your performance benchmarks to guide you\
  \ from there.\n\n## Pin and Unpin\n\nWe’re not quite done. While generators are\
  \ neat, a challenge arises from the technique as I’ve described it so far. In particular,\
  \ it’s not clear what happens if the code in the generator (or, equivalently, the\
  \ async block) takes a reference to a local variable. In the code from Listing 9-5,\
  \ the future that `rx.next()` returns must necessarily hold a reference to `rx`\
  \ if a next message is not immediately available so that it knows where to try again\
  \ when the generator next resumes. When the generator yields, the future and the\
  \ reference the future contains get stashed away inside the generator. But what\
  \ now happens if the generator is moved? Specifically, look at the code in Listing\
  \ 9-7 which calls `forward`.\n\n```rust\nasync fn try_forward<T>(rx: Receiver<T>,\
  \ tx: Sender<T>) -> Option<impl Future>\n{\n    let mut f = forward(rx, tx);\n \
  \   if f.poll().is_pending() { Some(f) } else { None }\n}\n```\n\n*Listing 9-8:\
  \ Moving a future after polling it*\n\nThe `try_forward` function only polls `forward`\
  \ once, to forward as many messages as possible without blocking. If the receiver\
  \ may still produce more messages (that is, if it returned `Poll::Pending` instead\
  \ of `Poll::Ready(None)`), those messages are deferred to be forwarded at some later\
  \ time by returning the forwarding future to the caller, which may choose to poll\
  \ again at a time when it sees fit.\n\nLet’s work through what happens here with\
  \ what we know about async and await so far. When we poll the `forward` generator,\
  \ it goes through the `while` loop some unknown number of times and eventually returns\
  \ either `Poll::Ready(())` if the receiver ended, or `Poll::Pending` otherwise.\
  \ If it returns `Poll::Pending`, the generator contains a future returned from either\
  \ `rx.next()` or `tx.send(t)`. Those futures both contain a reference to one of\
  \ the arguments initially provided to `forward` (`rx` and `tx`, respectively), which\
  \ must also be stored in the generator. But when `try_forward` returns the entire\
  \ generator, the fields of the generator also move. Thus, `rx` and `tx` no longer\
  \ reside at the same locations in memory, and the references stored in the stashed-away\
  \ future are no longer pointing to the right data!\n\nWhat we’ve run into here is\
  \ a case of a self-referential data structure: one that holds both data and references\
  \ into that data. With generators, these self-referential structures are very easy\
  \ to construct, and being unable to support them would be a significant blow to\
  \ ergonomics because it would mean you wouldn’t be able to hold references across\
  \ any yield point. The (ingenious) solution for supporting self-referential data\
  \ structures in Rust comes in the form of the `Pin` type and the `Unpin` trait.\
  \ Very briefly, `Pin` is a wrapper type that prevents the wrapped type from being\
  \ (safely) moved, and `Unpin` is a marker trait that says that the implementing\
  \ type can be removed safely from a `Pin`.\n\n## Pin\n\nThere’s a lot of nuance\
  \ to cover here, so let’s start with a concrete example of the wrapper `Pin`. In\
  \ Listing 9-2 I gave you a simplified version of the `Future` trait, but we’re now\
  \ ready to peel back one part of the simplification. Listing 9-8 shows the `Future`\
  \ trait somewhat closer to its final form.\n\n```rust\ntrait Future {\n    type\
  \ Output;\n    fn poll(self: Pin<&mut Self>) -> Poll<Self::Output>;\n}\n```\n\n\
  *Listing 9-8: A less simplified view of the `Future` trait with `Pin`*\n\nIn particular,\
  \ this definition requires that you call `poll` on `Pin<&mut Self>`. Once you have\
  \ a value behind a `Pin`, that constitutes a contract that that value will never\
  \ move again. This means that you can construct self-references internally to your\
  \ heart’s delight, exactly as you want for generators.\n\n> **NOTE** While `Future`\
  \ makes use of `Pin`, `Pin` is not tied to the `Future` trait—you can use `Pin`\
  \ for any self-referential data structure.\n\nBut how do you get a `Pin` to call\
  \ `poll`? And how can `Pin` ensure that the contained value won’t move? To see how\
  \ this magic works, let’s look at the definition of `std::pin::Pin` and some of\
  \ its key methods, shown in Listing 9-9.\n\n```rust\nstruct Pin<P> { pointer: P\
  \ }\nimpl<P> Pin<P> where P: Deref {\n    pub unsafe fn new_unchecked(pointer: P)\
  \ -> Self;\n}\nimpl<'a, T> Pin<&'a mut T> {\n    pub unsafe fn get_unchecked_mut(self)\
  \ -> &'a mut T;\n}\nimpl<P> Deref for Pin<P> where P: Deref {\n    type Target =\
  \ P::Target;\n    fn deref(&self) -> &Self::Target;\n}\n```\n\n*Listing 9-9: `std::pin::Pin`\
  \ and its key methods*\n\nThere’s a lot to unpack here, and we’re going to have\
  \ to go over the definition in Listing 9-9 a few times before all the bits make\
  \ sense, so please bear with me.\n\nFirst, you’ll notice that `Pin` holds a *pointer\
  \ type*. That is, rather than hold some `T` directly, it holds a type `P` that dereferences\
  \ through `Deref` into `T`. This means that rather than have a `Pin<MyType>`, you’ll\
  \ have a `Pin<Box<MyType>>`, `Pin<Rc<MyType>>`, or `Pin<&mut T>`. The reason for\
  \ this design is simple—`Pin`’s primary goal is to make sure that once you place\
  \ a `T` behind a `Pin`, that `T` won’t move, as doing so might invalidate self-references\
  \ stored in the `T`. If the `Pin` just held a `T` directly, then simply moving the\
  \ `Pin` would be enough to invalidate that invariant! In the remainder of this section,\
  \ I’ll refer to `P` as the *pointer* type and `T` as the *target* type.\n\nNext,\
  \ notice that `Pin`’s constructor, `new_unchecked`, is unsafe. This is because the\
  \ compiler has no way to actually check that the pointer type indeed promises that\
  \ the pointed-to (target) type won’t move again. Consider, for example, a variable\
  \ `foo` on the stack. If `Pin`’s constructor were safe, we could do `Pin::new(&mut\
  \ foo)`, call a method that requires `Pin<&mut Self>` (and thus assumes that `Self`\
  \ won’t move again), and then drop the `Pin`. At this point, we could modify `foo`\
  \ as much as we liked, since it is no longer borrowed—including moving it! We could\
  \ then pin it again and call the same method, which would be none the wiser that\
  \ any self-referential pointers it may have constructed the first time around would\
  \ now be invalid.\n\n\n\n\n\n## PIN 构造器的安全性\n\nPin 的构造器之所以不安全，另一个原因是其安全性取决于其自身安全的\
  \ trait 的实现。例如，Pin<P> 实现 get_unchecked_mut 的方式是使用 P 的 DerefMut::deref_mut 的实现。虽然对\
  \ get_unchecked_mut 的调用是不安全的，但为 P 实现的 DerefMut 并不是不安全的。然而它接收一个 &mut self，因此可以自由地（并且无需不安全代码）移动\
  \ T。Drop 也是如此。因此 Pin::new_unchecked 的安全要求不仅是指针类型不会让目标类型再次被移动（如 Pin<&mut T> 示例中那样），而且其\
  \ Deref、DerefMut 和 Drop 实现也不会通过它们接收到的 &mut self 移动指向的值。\n\n我们随后得到了 get_unchecked_mut\
  \ 方法，它会给你一个指向 Pin 指针类型后面 T 的可变引用。此方法也是不安全的，因为一旦我们给出一个 &mut T，调用者就必须承诺不会使用该 &mut\
  \ T 来移动 T 或以其他方式使它的内存失效，否则任何自引用都会失效。如果此方法不是不安全的，调用者就可以调用一个接受 Pin<&mut Self> 的方法，然后对两个\
  \ Pin<&mut _> 调用安全的 get_unchecked_mut 变体，然后使用 mem::swap 交换 Pin 后面的值。如果我们随后再次对任一\
  \ Pin 调用接受 Pin<&mut Self> 的方法，其关于 Self 未被移动的假设将被违反，并且它存储的任何内部引用都会失效！\n\n也许令人惊讶的是，Pin<P>\
  \ 总是实现 Deref<Target = T>，并且这是完全安全的。原因在于 &T 不允许你在不编写其他不安全代码的情况下移动 T（例如 UnsafeCell，我们将在第\
  \ 10 章讨论）。这是一个很好的例子，说明不安全块的作用域超出了它所包含的代码。如果你在一个应用程序的某个部分编写了代码（不安全地）使用 UnsafeCell\
  \ 替换了 & 后面的 T，那么该 &T 最初可能来自 Pin<&mut T>，而你现在已经违反了 Pin 后面的 T 永不移动的不变性，即使你在不安全地替换\
  \ &T 的地方甚至没有提到 Pin！\n\n## NOTE\n\n> 如果你在阅读本章的同时浏览过 Pin 文档，你可能注意到了 Pin::set，它接受一个\
  \ &mut self 和一个 <P as Deref>::Target，并安全地更改 Pin 后面的值。这之所以可能，是因为 set 不会返回之前被固定的值——它只是就地丢弃它并在那里存储新值。因此，它不会违反固定不变性：旧值在被放置在那里之后从未在\
  \ Pin 之外被访问过。\n\n## Unpin：安全固定的关键\n\n到目前为止，你可能会问：既然获取可变引用本身就是不安全的，为什么不让 Pin 直接持有\
  \ T 呢？也就是说，与其通过指针类型进行间接，不如让 `get_unchecked_mut` 的契约是只有在你没有移动 Pin 时调用它才是安全的。对此问题的答案在于指针设计所实现的一个巧妙的安全使用\
  \ Pin。回想一下，我们想要 Pin 的全部原因是为了能够拥有可能包含自身引用的目标类型（如生成器），并向其方法保证目标类型未被移动，因此内部自引用仍然有效。Pin\
  \ 让我们能够使用类型系统来强制执行该保证，这很棒。但不幸的是，以目前的设计，Pin 在使用上非常笨拙。这是因为即使你正在处理的目标类型不包含任何自引用，因此不在乎是否被移动，它也总是需要不安全代码。\n\
  \n这就是标记 trait Unpin 发挥作用的地方。对某个类型的 Unpin 实现仅仅断言该类型在使用为目标类型时可以安全地从 Pin 中移出。也就是说，该类型承诺它永远不会使用\
  \ Pin 关于被引用对象不再被移动的保证，当它用作目标类型时，因此这些保证可以被破坏。Unpin 是一个 auto-trait，像 Send 和 Sync 一样，因此编译器会自动为仅包含\
  \ Unpin 成员的任何类型实现它。只有明确选择退出 Unpin 的类型（如生成器）以及包含这些类型的类型才是 !Unpin。\n\n对于 Unpin 的目标类型，我们可以为\
  \ Pin 提供一个更简单的安全接口，如清单 9-10 所示。\n\n```\nimpl<P> Pin<P> where P: Deref, P::Target:\
  \ Unpin {\n    pub fn new(pointer: P) -> Self;\n}\n\nimpl<P> DerefMut for Pin<P>\
  \ where P: DerefMut, P::Target: Unpin {\n    fn deref_mut(&mut self) -> &mut Self::Target;\n\
  }\n```\n\n*清单 9-10：针对 Unpin 目标类型的 Pin 的安全 API*\n\n要理解清单 9-10 中的安全 API，请思考清单 9-9\
  \ 中不安全方法的安全要求：函数 `Pin::new_unchecked` 是不安全的，因为调用者必须承诺被引用对象不能在 Pin 外被移动，并且指针类型的 Deref、DerefMut\
  \ 和 Drop 实现不会通过它们接收到的引用移动被引用对象。这些要求是为了确保一旦我们给出一个指向 T 的 Pin，我们就永远不会再次移动该 T。但如果 T\
  \ 是 Unpin，它已声明即使它之前被固定过，被移动也没关系，所以调用者是否满足这些要求都没问题！\n\n同样，`get_unchecked_mut` 是不安全的，因为调用者必须保证不会从\
  \ `&mut T` 中移出 T——但对于 T: Unpin，T 已声明即使在被固定后被移动也没问题，所以该安全要求不再重要。这意味着对于 `Pin<P>` 其中\
  \ P::Target: Unpin，我们可以简单地为这两个方法提供安全变体（DerefMut 是 get_unchecked_mut 的安全版本）。事实上，我们甚至可以提供一个\
  \ `Pin::into_inner`，如果目标类型是 Unpin，就简单地返回拥有的 P，因为 Pin 本质上无关紧要！\n\n## 获取一个 Pin\n\n\
  有了我们对 Pin 和 Unpin 的新理解，我们现在可以开始使用清单 9-8 中要求 Pin<&mut Self> 的新 Future 定义。第一步是构造所需类型。如果\
  \ future 类型是 Unpin，那一步很容易——我们只需使用 `Pin::new(&mut future)`。如果它不是 Unpin，我们可以通过两种主要方式固定\
  \ future：堆上固定或栈上固定。\n\n让我们从堆上固定开始。Pin 的主要契约是一旦某物被固定，它就不能移动。固定 API 会确保 Pin 的所有方法和\
  \ trait 都满足这一点，因此任何构造 Pin 的函数的主要作用是确保如果 Pin 本身移动，被引用值也不会移动。确保这一点最简单的方法是将被引用对象放在堆上，然后只将指向被引用对象的指针放在\
  \ Pin 中。你可以随意移动 Pin，但目标仍会保持原位。这就是（安全）方法 `Box::pin` 背后的原理，它接受一个 T 并返回一个 `Pin<Box<T>>`。它没有魔法；它只是断言\
  \ Box 遵循 Pin 构造器、Deref 和 Drop 契约。\n\n> **UNPIN BOX**\n> \n> 说到 Box，看看 Box 的 Unpin\
  \ 实现。Box 类型无条件地为任何 T 实现 Unpin，即使该 T 不是 Unpin。这可能让你觉得奇怪，鉴于之前断言 Unpin 是一个 auto-trait，通常只有当类型的全部成员也是\
  \ Unpin 时才会为该类型实现。Box 在这方面是一个例外，原因与它能够提供安全 Pin 构造器的原因相同：如果移动一个 Box<T>，你并不会移动 T。换句话说，无条件的实现断言你可以将一个\
  \ Box<T> 从 Pin 中移出，即使 T 不能从 Pin 中移出。注意，这并不会让你能够将一个 !Unpin 的 T 从 Pin<Box<T>> 中移出。\n\
  \n另一个选项，栈上固定，要复杂一些，并且在撰写本文时需要一点点不安全代码。我们必须确保在 Pin 被丢弃后，不能再通过 `&mut` 访问被固定的值。我们通过在清单\
  \ 9-11 中所示的宏中对值进行遮蔽来实现这一点，或使用提供此宏的 crate 中的一个。有一天它甚至可能进入标准库！\n\n```\nmacro_rules!\
  \ pin_mut {\n    ($var:ident) => {\n        let mut $var = $var;\n        let mut\
  \ $var = unsafe { Pin::new_unchecked(&mut $var) };\n    }\n}\n```\n\n*清单 9-11：用于栈上固定的宏*\n\
  \n\n\n\n\n通过将要钉在栈上的变量名作为参数，宏确保调用者已经在栈上的某个位置拥有想要钉住的值。`$var` 的遮蔽确保调用者无法丢弃 `Pin` 后继续使用未钉住的值（这对于任何\
  \ `!Unpin` 的目标类型都会破坏 `Pin` 契约）。通过移动 `$var` 中存储的值，宏还确保调用者无法在不丢弃原始变量的情况下丢弃宏声明的 `$var`\
  \ 绑定。具体来说，如果没有那一行，调用者可以写（注意额外的作用域）：\n\n```rust\nlet foo = /* */; { pin_mut!(foo);\
  \ foo.poll() }; foo.mut_self_method();\n```\n\n在这里，我们向 `poll` 提供了 `foo` 的钉住实例，但随后我们又在没有\
  \ `Pin` 的情况下使用 `foo` 的 `&mut`，这违反了 `Pin` 契约。另一方面，有了额外的重新赋值，这段代码也会将 `foo` 移动到新的作用域中，使其在作用域结束后再也无法使用。\n\
  \n因此，栈上钉住需要不安全代码，不像 `Box::pin`，但避免了 `Box` 引入的额外分配，并且在 `no_std` 环境中也能工作。\n\n## 回到未来\n\
  \n我们现在有了钉住的 future，并且我们知道这意味着什么。但你可能已经注意到，大多数使用 `async` 和 `await` 编写的异步代码中都没有出现这些重要的钉住操作。而这是因为编译器把它隐藏起来了。\n\
  \n还记得我们讨论清单 9-5 时，我告诉你 `<expr>.await` 会反糖化成类似这样的代码吗：\n\n```rust\nloop {\n    if\
  \ let Poll::Ready(r) = expr.poll() {\n        break r\n    } else {\n        yield\n\
  \    }\n}\n```\n\n那是一个稍微简化的说法，因为正如我们所见，只有在你拥有 future 的 `Pin<&mut Self>` 时才能调用 `Future::poll`。反糖化实际上更复杂一些，如清单\
  \ 9-12 所示。\n\n```rust\n① match expr {\n    mut pinned => loop {\n        ② match\
  \ unsafe { Pin::new_unchecked(&mut pinned) }.poll() {\n            Poll::Ready(r)\
  \ => break r,\n            Poll::Pending => yield,\n        }\n    }\n}\n```\n\n\
  清单 9-12：`<expr>.await` 更准确的反糖化\n\n`match` ① 是一个巧妙的简写，确保展开后仍然是一个有效表达式，同时将表达式结果移动到一个我们可以随后在栈上钉住的变量中。除此之外，主要的新增部分是对\
  \ `Pin::new_unchecked` ② 的调用。该调用是安全的，因为要对包含的 async 块进行轮询，它必须已经因 `Future::poll` 的签名而被钉住。而我们正是由于对\
  \ async 块进行了轮询才到达了对 `Pin::new_unchecked` 的调用，因此生成器状态是被钉住的。由于 `pinned` 存储在对应 async\
  \ 块的生成器中（它必须是这样才能使 `yield` 正确恢复），我们知道 `pinned` 不会再移动。\n\n此外，一旦进入循环，`pinned` 只能通过\
  \ `Pin` 访问，因此没有任何代码能够从 `pinned` 中的值中移出。我们满足了 `Pin::new_unchecked` 的所有安全要求，代码是安全的。\n\
  \n## 去睡觉\n\n我们对 `Pin` 深入到了细节中，但现在走出来后，关于 futures 的另一个问题可能会让你感到困惑。如果对 `Future::poll`\
  \ 的调用返回 `Poll::Pending`，你需要有东西在稍后时间再次调用 `poll` 来检查是否可以取得进展。这个东西通常被称为 executor。你的\
  \ executor 可以是一个简单的循环，不断轮询你正在等待的所有 futures，直到它们都返回 `Poll::Ready`，但这会浪费大量本可用于更有用事情的\
  \ CPU 周期，比如运行你的网页浏览器。相反，我们希望 executor 做它能做的任何有用工作，然后去睡觉。它应该保持睡眠，直到其中一个 future 可以取得进展，然后才醒来再做一次遍历，然后再次去睡觉。\n\
  \n## 醒来\n\n决定何时重新检查某个 future 的条件差异很大。它可能是“当网络数据包到达此端口时”、“当鼠标光标移动时”、“当有人向此通道发送时”、“当\
  \ CPU 收到特定中断时”，甚至是“在经过这段时间后”。除此之外，开发者可以编写自己的 future 来包装多个其他 futures，因此可能有多个唤醒条件。某些\
  \ futures 甚至可能引入自己完全自定义的唤醒事件。\n\n为了适应这些众多用例，Rust 引入了 `Waker` 的概念：一种唤醒 executor 以发出可以取得进展的信号的方式。`Waker`\
  \ 是使 futures 周围整个机制工作的关键。executor 构造一个与 executor 用于睡觉的机制集成的 `Waker`，并在轮询任何 `Future`\
  \ 时将其传入。怎么做？通过我到目前为止一直对你隐瞒的 `Future::poll` 的额外参数。抱歉。清单 9-13 给出了 `Future` 的最终真实定义——不再有谎言了！\n\
  \n```rust\ntrait Future {\n    type Output;\n    fn poll(self: Pin<&mut Self>, cx:\
  \ &mut Context<'_>) -> Poll<Self::Output>;\n}\n```\n\n清单 9-13：带有 `Context` 的实际 `Future`\
  \ trait\n\n`&mut` `Context` 包含 `Waker`。参数是 `Context` 而不是直接的 `Waker`，这样我们就可以在必要时为\
  \ futures 增加额外的上下文。\n\n`Waker` 的主要方法是 `wake`（以及按引用变体 `wake_by_ref`）。`wake` 方法不接受参数，其效果完全由构造该\
  \ `Waker` 的 executor 定义。你看，`Waker` 实际上是关于 executor 的泛型。或者更准确地说，构造 `Waker` 的东西可以决定在调用\
  \ `Waker::wake` 时发生什么，在克隆 `Waker` 时发生什么，以及在丢弃 `Waker` 时发生什么。所有这些都通过手动实现的 vtable\
  \ 实现，其功能类似于我们在第 3 章很久以前讨论的动态分发。\n\n构造 `Waker` 是一个相当复杂的过程，其机制对于使用它来说并不是那么重要，但你可以在标准库中的\
  \ `RawWakerVTable` 类型中看到构建块。它有一个构造函数，接受 `wake` 和 `wake_by_ref` 的函数指针，以及 `Clone`\
  \ 和 `Drop`。`RawWakerVTable` 通常在 executor 的所有 wakers 之间共享，与一个旨在保存每个 `Waker` 实例特定数据（比如它属于哪个\
  \ future）的原始指针捆绑在一起，并被转换为 `RawWaker`。然后它被传递给 `Waker::from_raw` 以生成一个安全的 `Waker`，可以传递给\
  \ `Future::poll`。\n\n## Poll 契约\n\n到目前为止，我们一直回避 future 实际上如何使用 `Waker`。这个想法相当简单：如果\
  \ `Future::poll` 返回 `Poll::Pending`，那么它是 future 的责任确保 *某物* 在 future 下次能够取得进展时调用提供的\
  \ `Waker` 上的 `wake`。大多数 futures 通过仅在其他 future 也返回 `Poll::Pending` 时才返回 `Poll::Pending`\
  \ 来维护此属性；以这种方式它可以轻易满足 `poll` 的契约，因为内部 future 必须遵循相同的契约。但不能无止境地向下有乌龟。最终，你会遇到一个不轮询其他\
  \ futures 的 future，而是做类似写入网络套接字或尝试从通道接收之类的操作。这些通常被称为 *叶子 future*，因为它们没有子 future。叶子\
  \ future 没有内部 future，而是直接表示某个可能尚未准备好返回结果的资源。\n\n叶子 future 通常有两种形状：等待来自同一进程内事件的（如通道接收器），以及等待来自进程外部事件的（如\
  \ TCP 数据包接收）。等待内部事件的那些通常遵循相同的模式：将 `Waker` 存储在唤醒你的代码可以找到它的地方，并让该代码在生成相关事件时调用 `wake`。例如，考虑一个必须等待内存通道上消息的叶子\
  \ future。它将 `Waker` 存储在发送者和接收者之间共享的通道部分中，然后返回 `Poll::Pending`。当发送者稍后到来并向通道注入消息时，它会注意到等待接收者留下的\
  \ `Waker` 并在 `Waker` 上调用 `wake`\n\n\n在从 `send` 返回之前。现在，接收者被唤醒，轮询契约得到了履行。\n\n处理外部事件的叶\
  \ future 要复杂得多，因为生成它们所等待事件的代码对 future 或唤醒器一无所知。最典型的情况是，生成代码是操作系统内核，它知道磁盘何时就绪或定时器何时到期；但也可能是某个\
  \ C 库，在操作完成时回调 Rust，或者其他类似的外部实体。包装此类外部资源的叶 future 可以专门启动一个线程来执行阻塞式系统调用（或等待 C 回调），然后使用内部唤醒机制，但这会很浪费；每次操作需要等待时你都要启动一个线程，最终会留下大量一次性线程闲在那里等待各种事情。\n\
  \n相反，执行器往往会提供叶 future 的实现，这些实现在后台与执行器通信，以安排与操作系统的适当交互。具体如何编排取决于执行器和操作系统，但粗略地说，执行器会跟踪所有它在下一次进入睡眠时需要监听的事件源。当叶\
  \ future 意识到自己必须等待某个外部事件时，它会更新执行器的状态（它知道这个状态，因为该状态由执行器 crate 提供），将那个外部事件源连同它的 `Waker`\
  \ 一起纳入其中。当执行器无法再取得进展时，它会收集各个处于挂起状态的叶 future 正在等待的所有事件源，然后向操作系统发起一次大型阻塞调用，告诉操作系统：只要有叶\
  \ future 等待的资源出现新事件，就返回。在 Linux 上，这通常通过 `epoll` 系统调用实现；Windows、各种 BSD、macOS 以及几乎所有其他操作系统都提供类似的机制。当该调用返回时，执行器会对所有与操作系统报告了事件的事件源相关联的唤醒器调用\
  \ `wake`，轮询契约由此得到履行。\n\n> **注意**  \n> 反应堆 *是* 执行器的一部分，叶 future 会向它注册事件源，执行器在没有更多有用工作可做时也会等待它。将执行器与反应堆分开是可能的，不过将它们捆绑在一起通常会提升性能，因为两者更容易协同优化。\n\
  \n叶 future 与执行器之间的紧密集成有一个连锁效应：来自某个执行器 crate 的叶 future 往往无法与不同的执行器一起使用。或者至少，除非叶 future\
  \ 对应的执行器 *也* 在运行，否则它们无法使用。当叶 future 去存储自己的 `Waker` 并注册它正在等待的事件源时，它针对其构建的执行器必须已经设置了相应状态并处于运行状态，这样事件源才会真正被监控，`wake`\
  \ 也最终会被调用。有一些办法可以绕过这个问题，例如如果没有执行器在运行，就让叶 future 生成一个执行器，但这并不总是可取的，因为这意味着应用程序会不知不觉地同时运行多个执行器，从而降低性能，也意味着调试时你必须检查多个执行器的状态。\n\
  \n希望支持多个执行器的库 crate 必须在其叶资源上做到泛型化。例如，库可以不使用某个特定执行器的 `TcpStream` 或 `File` future\
  \ 类型，而是存储一个泛型 `T: AsyncRead + AsyncWrite`。然而，生态尚未确定这些 trait 到底应该是什么样、需要哪些 trait，所以目前要让代码真正跨执行器泛型是相当困难的。例如，虽然\
  \ `AsyncRead` 和 `AsyncWrite` 在生态中多少算是常见（或者必要时可以轻松适配），但目前还没有用于在后台运行 future（即 spawn，我们稍后会讨论）或用于表示定时器的\
  \ trait。\n\n## “唤醒”这个词并不恰当\n\n你可能已经意识到，`Waker::wake` 看起来未必会唤醒任何东西。例如，对于外部事件（如上一节所述），执行器本就已经处于唤醒状态，再让它对一个本来就属于该执行器的\
  \ `Waker` 调用 `wake`，看起来确实有点傻！事实上，`Waker::wake` 这个名称多少有些名不副实——实际上，它表示某个特定的 future\
  \ 已可运行。也就是说，它告诉执行器：当执行器有空处理它时，应确保轮询这个特定的 future，而不是再次进入睡眠，因为这个 future 可以取得进展。如果执行器当前正在睡眠，这可能会唤醒执行器，使其去轮询那个\
  \ future，但这更像是副作用，而非其主要目的。\n\n执行器必须知道哪些 future 是可运行的，原因有二。第一，它需要知道何时可以停止轮询某个 future\
  \ 并进入睡眠；仅仅轮询每个 future 直到其返回 `Poll::Pending` 是不够的，因为轮询后一个 future 可能会让前一个 future 得以推进。考虑这样一个场景：两个\
  \ future 通过通道来回向对方传递消息。当你轮询其中一个时，另一个变得就绪，反之亦然。在这种情况下，执行器绝不应该进入睡眠，因为总是有更多工作要做。\n\n\
  第二，知道哪些 future 可运行能让执行器避免不必要的轮询。如果一个执行器管理着数千个挂起的 future，它不应该仅仅因为一个事件使其中某一个 future\
  \ 可运行，就去轮询所有 future。如果真那样做，执行异步代码会变得非常慢。\n\n## 任务\n\n异步程序中的 future 会形成一棵树：一个 future\
  \ 可能包含任意数量的其他 future，而这些 future 又可能包含其他 future，一路向下直到与唤醒器交互的叶 future。每棵树的根，就是你交给执行器主“run”函数的那个\
  \ future。这些根 future 被称为任务，它们是执行器与 future 树之间唯一的接触点。执行器对任务调用 `poll`，从那时起，每个被包含的 future\
  \ 的代码都必须确定作为回应要轮询哪些内部 future，一路向下直到相关的叶。\n\n执行器通常会为它们轮询的每个任务构造一个独立的 `Waker`，这样稍后调用\
  \ `wake` 时，它们就知道是哪个任务刚刚变为可运行状态，并将其标记为可运行。这正是 `RawWaker` 中裸指针的用途——在共享各种 `Waker` 方法的代码的同时，区分不同的任务。\n\
  \n当执行器最终轮询一个任务时，该任务会从 `Future::poll` 实现的顶部开始运行，并且必须从那里决定如何到达更深层的、现在可以取得进展的 future。由于每个\
  \ future 只知道自己的字段，对整棵树一无所知，这一切都是通过一次次 `poll` 调用完成的，每次调用遍历树中的一条边。\n\n选择轮询哪个内部 future\
  \ 通常显而易见，但并非总是如此。在 async/await 的情况下，要轮询的 future 就是我们被阻塞等待的那个。但在一个等待多个 future 中第一个取得进展（通常称为\
  \ select）或等待一组 future 全部完成（通常称为 join）的 future 中，就有很多选择了。必须做出这种选择的 future 基本上就是一个子执行器。它可以轮询所有内部\
  \ future，但这样做可能相当浪费。因此，这些子执行器通常会在对任何内部 future 调用 `poll` 之前，先用它们自己的 `Waker` 类型包装在\
  \ `poll` 的 `Context` 中收到的 `Waker`。在包装代码中，它们会先在自己的内部状态中将刚刚轮询过的 future 标记为可运行，然后再对原始的\
  \ `Waker` 调用 `wake`。这样一来，当执行器最终再次轮询该子执行器 future 时，子执行器就可以查看自己的内部状态，弄清楚是哪个内部 future\
  \ 导致了当前这次 `poll` 调用，然后只轮询这些 future。\n\n## 用 `spawn` 将所有内容串联起来\n\n在使用异步执行器时，你可能会遇到一个生成\
  \ future 的操作。现在我们终于可以来探讨它的含义了！让我们通过一个例子来说明。首先，看一下清单 9-14 中的简单服务器实现。\n\n```rust\n\
  async fn handle_client(socket: TcpStream) -> Result<()> {\n    // Interact with\
  \ the client over the given socket.\n}\n\nasync fn server(socket: TcpListener) ->\
  \ Result<()> {\n    while let Some(stream) = socket.accept().await? {\n        handle_client(stream).await?;\n\
  \    }\n}\n```\n\n清单 9-14：顺序处理连接\n\n顶层 server 函数本质上是一个大型 future，它监听新连接，并在新连接到来时执行某些操作。你把这个\
  \ future 交给执行器，说“运行这个”，而且由于你不想让程序随后立即退出，你可能会让\n\n\n你的客户端 future 是 Send，它可以并行运行，因为它可以持有对不同任务的\
  \ &mut。清单 9-16 给出了这可能是什么样子的示例。\n\n```\nasync fn server(socket: TcpListener) -> Result<()>\
  \ {\n    while let Some(stream) = socket.accept().await? {\n        // Spawn a new\
  \ task with the Future that represents this client.\n        // The current task\
  \ will continue to just poll for more connections,\n        // and will run concurrently\
  \ (and possibly in parallel) with handle_client.\n        spawn(handle_client(stream));\n\
  \    }\n}\n```\n\n清单 9-16：通过生成 future 来创建可以并发轮询的更多任务\n\n当你生成一个 future，从而使其成为一个任务时，这有点像生成一个线程。future\
  \ 会在后台继续运行，并在执行器中与任何其他任务并发多路复用。然而，与生成的线程不同，生成的任务仍然依赖于被执行器轮询。如果执行器停止运行，无论是因为你丢弃了它还是因为你的代码不再运行执行器的代码，那么这些生成的任务将停止取得进展。在服务器示例中，想象一下如果主服务器\
  \ future 因某种原因得到解决会发生什么。既然执行器已将控制权交还给你的代码，它就无法继续做，嗯，任何事情。多线程执行器通常会生成在执行器将控制权交还给用户代码后仍继续轮询任务的后台线程，但并非所有执行器都这样做，因此在依赖这种行为之前请先检查你的执行器！\n\
  \n## ASYNC 代码中的阻塞\n\n你必须小心在异步代码中调用同步代码，因为执行器线程在执行当前任务所花费的任何时间，都是它没有花费在运行其他任务的时间。如果一个任务在一段较长时间内占用当前线程而没有将控制权交还给执行器，这可能发生在执行阻塞系统调用（如\
  \ std::sync::sleep）或在没有 await 的紧密循环中运行时，那么当前执行器线程负责的其他任务在那段时间内将无法运行。通常，这表现为某些任务能够取得进展的时间（如客户端连接时）与它们实际执行之间存在很长的延迟。\n\
  \n一些多线程执行器实现了工作窃取技术，其中空闲的执行器线程会从繁忙的执行器线程窃取任务，但这更多是一种缓解措施，而非解决方案。最终，你可能会陷入所有执行器线程都被阻塞的情况，因此在其中一个阻塞操作完成之前，没有任务会被运行。\n\
  \n总的来说，你应该非常小心在异步上下文中执行计算密集型操作或调用可能阻塞的函数。\n\ncontinued\n\n此类操作应尽可能转换为异步操作，或在专用线程上执行，然后使用支持异步的原语（如通道）进行通信。一些执行器还提供了用于指示异步代码的特定段可能会阻塞的机制，或用于在可能否则不会让出的循环上下文中自愿让出，这可以构成解决方案的一部分。一个好的经验法则是，没有任何\
  \ future 应该能够在不返回 Poll::Pending 的情况下运行超过 1 ms。\n\n## 总结\n\n在本章中，我们深入了解了 Rust 中可用的异步构造的幕后实现。我们看到了编译器如何实现生成器和自引用类型，以及为什么这项工作对于支持我们现在所知的\
  \ async/await 是必要的。我们还探讨了 future 如何被执行，以及唤醒器如何允许执行器在任何给定时刻只有其中一些可以取得进展时在任务之间进行多路复用。在下一章中，我们将\
  \ tackling 也许是 Rust 中最深奥和最受讨论的领域：unsafe 代码。深呼吸，然后翻页。\n\n"

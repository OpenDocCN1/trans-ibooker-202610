    The solution to this is to place them behind a fat pointer. A fat pointer is just
    like a normal pointer, but it includes an extra word-sized field that gives the
    additional information about that pointer that the compiler needs to generate
    reasonable code for working with the pointer. When you take a reference to a DST,
    the compiler automatically constructs a fat pointer for you. For a slice, the
    extra information is simply the length of the slice. For a trait object—well,

    ## 5


    ## 错误处理


    ![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_60_0.png)


    对于除最简单程序之外的所有程序，你都会有一些可能失败的方法。在本章中，我们将探讨表示、处理和传播这些失败的不同方式，以及每种方式的优缺点。我们将首先探索表示错误的不同方法，包括枚举和类型擦除，然后研究一些需要不同表示技术的特殊错误情况。接下来，我们将了解处理错误的各种方式以及错误处理的未来。


    值得注意的是，Rust 中错误处理的最佳实践仍然是一个活跃的讨论话题，而在撰写本文时，生态系统尚未形成统一的方法。因此，本章将侧重于基本原理和技术，而不是推荐特定的
    crate 或模式。


    `source` 的实现很直接：我们对 `self` 进行匹配，提取并返回内部的 `std::io::Error`。


    其次，你的类型应该同时实现 `Display` 和 `Debug`，以便调用者可以有意义地打印你的错误。如果你实现了 `Error` trait，这是必需的。一般来说，`Display`
    的实现应该提供一行关于出错原因的描述，并且可以很容易地嵌入到其他错误消息中。显示格式应该使用小写字母，且不带结尾标点，以便很好地融入其他更大的错误报告中。`Debug`
    则应提供更具描述性的错误信息，包括可能有助于追踪错误原因的辅助信息，例如端口号、请求标识符、源代码位置等。


    > **注意** 在较旧的 Rust 代码中，你可能会看到对 `Error::description` 方法的引用，但该方法已被弃用，取而代之的是 `Display`。


    第三，你的类型如果可能的话，应该同时实现 `Send` 和 `Sync`，以便用户能够在线程之间共享错误。如果你的错误类型不是线程安全的，你会发现几乎不可能在多线程上下文中使用你的
    crate。实现 `Send` 和 `Sync` 的错误类型也更容易与非常常见的 `std::io::Error` 类型一起使用，后者能够包装实现了 `Error`、`Send`
    和 `Sync` 的错误。当然，并非所有错误类型都能合理地实现 `Send` 和 `Sync`，例如它们如果与特定的线程局部资源绑定，那也没关系。你可能也不会将这些错误跨线程发送。然而，在将
    `Rc<String>` 和 `RefCell<bool>` 类型放入错误之前，你需要意识到这一点。


    最后，在可能的情况下，你的错误类型应该是 `''static`。这样做最直接的好处是，它能让调用者更容易将你的错误向上传播到调用栈，而不会遇到生命周期问题。它还能让你的错误类型更容易与类型擦除的错误类型一起使用，我们稍后会看到。


    ## 不透明错误


    现在让我们考虑另一个例子：一个图像解码库。你给这个库一堆要解码的字节，它向你提供各种图像操作方法。如果解码失败，用户需要能够弄清楚如何解决问题，因此必须理解原因。但是，原因是图像头中的大小字段无效，还是压缩算法无法解压缩某个块，这重要吗？可能并不重要——即使应用程序知道确切原因，它也无法从任何一种情况中有意义地恢复。在这种情况下，作为库作者，你可能更希望提供一个单一的、不透明的错误类型。这也会让你的库更好用一些，因为到处都是只有一种错误类型。这种错误类型应该实现
    `Send`、`Debug` 和 `Display`，并且可能还应该实现 `Error`，但除此之外，调用者不需要知道更多。你可以在内部表示更细粒度的错误状态，但没有必要向库的用户暴露这些。这样做只会不必要地增加
    API 的规模和复杂性。


    你的不透明错误类型具体应该是什么，主要取决于你。它可以只是一个所有字段都私有的类型，只暴露有限的用于显示和检查错误的方法；也可以是一种严重类型擦除的错误类型，例如
    `Box<dyn Error + Send + Sync + ''static>`，它除了表明自己是一个错误之外不透露任何信息，通常根本不让你的用户进行内省。决定在类型擦除的道路上走多远，主要取决于错误除了描述之外是否还有其他值得关注的信息。使用
    `Box<dyn Error>` 时，你的用户几乎没有选择，只能向上冒泡你的错误。如果这个错误确实没有对用户有价值的信息，比如它只是一个动态错误消息，或者是程序深处大量不相关错误之一，那这可能没问题。但如果错误有一些有趣的方面，比如行号或状态码，你可能希望通过一个具体但不透明的类型来暴露这些。


    > **注意**


    > 一般来说，社区共识是错误应该是罕见的，因此不应给“快乐路径”增加太多成本。出于这个原因，错误通常放在指针类型后面，例如 `Box` 或 `Arc`。这样，它们不太可能给它们所在的整个
    `Result` 类型增加太多体积。


    使用类型擦除的错误的一个好处是，它允许你轻松地组合来自不同来源的错误，而无需引入额外的错误类型。也就是说，类型擦除的错误通常可以很好地组合。如果你编写一个返回类型为
    `Box<dyn Error + ...>` 的函数，那么你几乎可以在该函数内不加区分地对各种不同的错误使用 `?`，它们都会被转换成这个共同的错误类型。


    `Box<dyn Error + Send + Sync + ''static>` 上的 `''static` 约束值得在类型擦除的语境下多花一些时间讨论。我在上一节中提到，它有助于让调用者传播错误，而不必担心失败方法引用的生命周期，但它还有一个更大的用途：支持向下转型（downcasting）。向下转型是将一种类型的项转换为更具体的类型的过程。这是
    Rust 在少数几个允许你在运行时访问类型信息的情况之一；它是动态语言通常提供的更通用的类型反射的一个有限案例。在错误的语境中，向下转型允许用户将一个 `dyn
    Error` 转换为具体的底层错误类型——前提是该 `dyn Error` 最初就是那个类型。例如，如果用户收到的错误是 `std::io::ErrorKind::WouldBlock`
    类型的 `std::io::Error`，他们可能希望采取某种特定操作，但在其他任何情况下都不会采取同样的操作。如果用户得到一个 `dyn Error`，他们可以使用
    `Error::downcast_ref` 尝试将错误向下转型为 `std::io::Error`。`downcast_ref` 方法返回一个 `Option`，告诉用户向下转型是否成功。这里有一个关键观察：只有当目标类型参数为
    `''static` 时，`downcast_ref` 才有效。如果我们返回一个不是 `''static` 的不透明 `Error`，就会剥夺用户进行这种错误内省的能力（如果他们希望这样做的话）。


    生态系统中对于库的类型擦除错误（或更一般地说，其类型擦除类型）是否属于其公开且稳定的 API 存在一些分歧。也就是说，如果你的库中的方法 `foo` 返回
    `lib::MyError` 作为 `Box<dyn Error>`，那么将 `foo` 改为返回不同的错误类型算不算是破坏性变更？类型签名没有改变，但用户可能已经编写了假设他们可以使用向下转型将该错误转换回
    `lib::MyError` 的代码。我对此事的看法是，你选择返回 `Box<dyn Error>`（而不是 `lib::MyError`）是有原因的，除非有明确文档说明，否则这并不能保证向下转型的任何具体内容。


    你可能想知道 `Error::downcast_ref` 如何保证安全。也就是说，它如何知道提供的 `dyn Error` 参数确实是指定类型 `T`？标准库中甚至有一个名为
    `Any` 的 trait，它针对任何类型实现，并为 `dyn Any` 实现了 `downcast_ref`——这怎么会没问题呢？答案在于编译器支持的类型
    `std::any::TypeId`，它可以让你获得任何类型的唯一标识符。`Error` trait 有一个名为 `type_id` 的隐藏的提供方法，其默认实现是返回
    `TypeId::of::<Self>()`。类似地，`Any` 有一个对 `T` 的 blanket 实现 `impl Any for T`，在该实现中，它的
    `type_id` 返回同样的值。在这些 `impl` 块的语境中，`Self` 的具体类型是已知的，因此这个 `type_id` 就是真实类型的类型标识符。这提供了
    `downcast_ref` 所需的全部信息。`downcast_ref` 调用 `self.type_id`，它会通过动态大小类型的虚表（vtable，见第
    3 章）转发到底层类型的实现，并将该结果与所提供的向下转型类型的类型标识符进行比较。如果它们匹配，那么 `dyn Error` 或 `dyn Any` 背后的类型确实就是
    `T`，从一个引用转换为另一个引用就是安全的。


    ## 特殊错误情况


    有些函数可能会失败，但在失败时无法返回任何有意义的错误。从概念上讲，这些函数的返回类型是 `Result<T, ()>`。在某些代码库中，你可能会看到这种类型被表示为
    `Option<T>`。虽然两者对于这类函数的返回类型都是合理的选择，但它们传达的语义含义不同，你通常应该避免将 `Result<T, ()>` “简化”为
    `Option<T>`。`Err(())` 表示操作失败，应该重试、报告或以其他方式特殊处理。另一方面，`None` 仅表示函数没有可返回的内容；它通常不被视为特殊情况或需要处理的情况。你可以从
    `Result` 类型上的 `#[must_use]` 注解中看出这一点——当你得到 `Result` 时，语言期望处理这两种情况都很重要，而对于 `Option`，实际上两种情况都不需要处理。


    > **注意** 你还应该记住，`()` 没有实现 `Error` trait。这意味着它不能被类型擦除为 `Box<dyn Error>`，并且在使用 `?`
    时会有点麻烦。因此，在这些情况下，通常最好定义你自己的单元结构体类型，为它实现 `Error`，并将其作为错误而不是 `()` 使用。



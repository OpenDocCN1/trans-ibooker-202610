    Clone only if T does! This isn’t usually too big of an issue, but it does add
    a bound where one isn’t needed. If we rename the type to Shared, the problem may
    become a little clearer. Imagine how confused a user that has a Shared<NotClone>
    will be when the compiler tells them that they cannot clone it! At the time of
    writing, this is how #[derive(Clone)] as provided by the standard library works,
    though this may change in the future.



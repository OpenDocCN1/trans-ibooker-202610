  - "[PAGE 138]\n\nbefore returning from send. Now the receiver is awoken, and the\
    \ poll contract is upheld.\n\nLeaf futures that deal with external events are\
    \ more involved, as the code that generates the event they’re waiting for knows\
    \ nothing of futures or wakers. Most often the generating code is the operating\
    \ system kernel, which knows when a disk is ready or a timer expires, but it could\
    \ also be a C library that invokes a callback into Rust when an operation completes\
    \ or some other such external entity. A leaf future wrapping an external resource\
    \ like this could spin up a thread that executes a blocking system call (or waits\
    \ for the C callback) and then use the internal waking mechanism, but that would\
    \ be wasteful; you would spin up a thread every time an operation had to wait\
    \ and would be left with lots of single-use threads sitting around waiting for\
    \ things.\n\nInstead, executors tend to provide implementations of leaf futures\
    \ that communicate behind the scenes with the executor to arrange for the appropriate\
    \ interaction with the operating system. How exactly this is orchestrated depends\
    \ on the executor and the operating system, but roughly speaking the executor\
    \ keeps track of all the event sources that it should listen for the next time\
    \ it goes to sleep. When a leaf future realizes it must wait for an external event,\
    \ it updates that executor’s state (which it knows about since it’s provided by\
    \ the executor crate) to include that external event source alongside its Waker.\
    \ When the executor can no longer make progress, it gathers all of the event sources\
    \ the various pending leaf futures are waiting for and does a big blocking call\
    \ to the operating system telling it to return when any of the resources the leaf\
    \ futures are waiting on have a new event. On Linux, this is usually achieved\
    \ with the epoll system call; Windows, the BSDs, macOS, and pretty much every\
    \ other operating system provide similar mechanisms. When that call returns, the\
    \ executor calls wake on all the wakers associated with event sources that the\
    \ operating system reported an event for, and thus the poll contract is fulfilled.\n\
    \n> **NOTE**  \n> A reactor *is the part of an executor that leaf futures register\
    \ event sources with and that the executor waits on when it has no more useful\
    \ work to do. It is possible to separate the executor and the reactor, though\
    \ bundling them together often improves performance as the two can be co-optimized\
    \ more readily.\n\nA knock-on effect of the tight integration between leaf futures\
    \ and the executor is that leaf futures from one executor crate often cannot be\
    \ used with a different executor. Or at least, they cannot be used unless the\
    \ leaf future’s executor is *also* running. When the leaf future goes to store\
    \ its Waker and register the event source it’s waiting for, the executor it was\
    \ built against needs to have that state set up and needs to be running so that\
    \ the event source will actually be monitored and wake eventually called. There\
    \ are ways around this, such as having leaf futures spawn an executor if one is\
    \ not already running, but this is not always advisable as it means that an application\
    \ can transparently end up with multiple executors running at the same time, which\
    \ can reduce performance and mean you must inspect the state of multiple executors\
    \ when debugging."
  - '[PAGE 139]


    Library crates that wish to support multiple executors have to be generic over
    their leaf resources. For example, instead of using a particular executor’s TcpStream
    or File future type, a library can store a generic T: AsyncRead + AsyncWrite.
    However, the ecosystem has yet to settle on exactly what these traits should look
    like and which traits are needed, so at the moment it’s fairly difficult to make
    code truly generic over the executor. For example, while AsyncRead and AsyncWrite
    are somewhat common across the ecosystem (or can be easily adapted if necessary),
    no traits currently exist for running a future in the background (spawning, which
    we’ll discuss later) or for representing a timer.


    # Waking Is a Misnomer


    You may already have realized that Waker::wake doesn’t necessarily seem to wake
    anything. For example, for external events (as described in the previous section)
    the executor is already awake, and it might seem silly for it to then call wake
    on a Waker that belongs to that executor anyway! The reality is that Waker::wake
    is a bit of a misnomer—in reality, it signals that a particular future is runnable.
    That is, it tells the executor that it should make sure to poll this particular
    future when it gets around to it rather than go to sleep again, since this future
    can make progress. This might wake the executor if it is currently sleeping so
    it will go poll that future, but that’s more of a side effect than its primary
    purpose.


    It is important for the executor to know which futures are runnable for two reasons.
    First, it needs to know when it can stop polling a future and go to sleep; it’s
    not sufficient to just poll each future until it returns Poll::Pending, since
    polling a later future might make it possible to progress an earlier future. Consider
    the case where two futures bounce messages back and forth on channels to one another.
    When you poll one, the other becomes ready, and vice versa. In this case, the
    executor should never go to sleep, as there is always more work to do.


    Second, knowing which futures are runnable lets the executor avoid polling futures
    unnecessarily. If an executor manages thousands of pending futures, it shouldn’t
    poll all of them just because an event made one of them runnable. If it did, executing
    asynchronous code would get very slow indeed.


    # Tasks


    The futures in an asynchronous program form a tree: a future may contain any number
    of other futures, which in turn may contain other futures, all the way down to
    the leaf futures that interact with wakers. The root of each tree is the future
    you give to whatever the executor’s main “run” function is. These root futures
    are called tasks, and they are the only point of contact between the executor
    and the futures tree. The executor calls poll on the task, and from that point
    forward the code of each contained future must figure out which inner future(s)
    to poll in response, all the way down to the relevant leaf.'

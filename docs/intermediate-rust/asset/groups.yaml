    以 I/O 为中心的类型的析构时通常需要执行清理工作。这可能包括将写入刷新到磁盘、关闭文件，或优雅地终止与远程主机的连接。执行此清理的自然位置是在类型的 Drop
    实现中。不幸的是，一旦值被丢弃，我们除了 panic 之外就再也没有办法向用户传达错误。类似的问题出现在异步代码中，在那里我们希望在有待处理工作时完成收尾。drop

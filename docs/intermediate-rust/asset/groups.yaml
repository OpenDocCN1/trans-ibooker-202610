    hardware also constrains where a given type can be placed. The most obvious example
    of this is that pointers point to bytes, not bits. If you placed a value of type
    T starting at bit 4 of your computer’s memory, you would have no way to refer
    to its location; you can create a pointer pointing only to byte 0 or byte 1 (bit
    8). For this reason, all values, no matter their type, must start at a byte boundary.
    We say that all values must be at least byte-aligned—they must be placed at an
    address that is a multiple of 8 bits.


    Some values have more stringent alignment rules than just being byte-aligned.
    In the CPU and the memory system, memory is often accessed in blocks larger than
    a single byte. For example, on a 64-bit CPU, most values are accessed in chunks
    of 8 bytes (64 bits), with each operation starting at an 8-byte-aligned address.
    This is referred to as the CPU’s word size. The CPU then uses some cleverness
    to handle reading and writing smaller values, or values that span the boundaries
    of these chunks.


    Where possible, you want to ensure that the hardware can operate in its “native”
    alignment. To see why, consider what happens if you try to read an i64 that starts
    in the middle of an 8-byte block (that is, the pointer to it is not 8-byte-aligned).
    The hardware will have to do two reads—one from the second half of the first block
    to get to the start of the i64, and one from the first half of the second block
    to read the rest of the i64—and then splice the results together. This is not
    very efficient. Since the operation is spread across multiple accesses to the

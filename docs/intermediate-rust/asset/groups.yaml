    ## Borrowed vs. Owned


    For nearly every function, trait, and type you define in Rust, you must decide
    whether it should own, or just hold a reference to, its data. Whatever decision
    you make will have far-reaching implications for the ergonomics and performance
    of your interface. Luckily, these decisions very often make themselves.


    If the code you write needs ownership of the data, such as to call methods that
    take self or to move the data to another thread, it must store the owned data.
    When your code must own data, it should generally also make the caller provide
    owned data, rather than taking values by reference and cloning them. This leaves
    the caller in control of allocation, and it is upfront about the cost of using
    the interface in question.


    On the other hand, if your code doesn’t need to own the data, it should operate
    on references instead. One common exception to this rule is with small types like
    i32, bool, or f64, which are just as cheap to store and copy directly as to store
    through references. Be wary of assuming this holds true for all Copy types, though;
    [u8; 8192] is Copy, but it would be expensive to store and copy it all over the
    place.


    Of course, in the real world, things are often less clear-cut. Sometimes, you
    don’t know in advance whether your code will need to own the data or not. For
    example, String::from_utf8_lossy needs to take ownership of the byte sequence
    that is passed to it only if it contains invalid UTF-8 sequences. In this case,
    the Cow type is your friend: it lets you operate on references if the data allows,
    and it lets you produce an owned value if necessary.


    Other times, reference lifetimes complicate the interface so much that it becomes
    a pain to use. If your users are struggling to get code to compile on top of your
    interface, that’s a sign that you may want to (even unnecessarily) take ownership
    of certain pieces of data. If you do this, start with data that is cheap to clone
    or is not part of anything performance-sensitive before you decide to heap-allocate
    what might be a huge chunk of bytes.


    ## Fallible and Blocking Destructors


    Types centered on I/O often need to perform cleanup when they’re dropped. This
    may include flushing writes to disk, closing files, or gracefully terminating
    connections to remote hosts. The natural place to perform this cleanup is in the
    type’s Drop implementation. Unfortunately, once a value is dropped, we no longer
    have a way to communicate errors to the user except by panicking. A similar problem
    arises in asynchronous code, where we wish to finish up when there is work pending.
    By the time drop is called, the executor may be shutting down, and we have no
    way to do more work. We could try to start another executor, but that comes with
    its own host of problems, such as blocking in asynchronous code, as we will see
    in Chapter 9.


    There is no perfect solution to these problems, and no matter what we do, some
    applications will inevitably fall back to our Drop implementation. For that reason,
    we need to provide best-effort cleanup through Drop. If cleanup errors, at least
    we tried—we swallow the error and move on. If an executor is still available,
    we might spawn a future to do cleanup, but if it never gets to run, we did what
    we could.


    However, we ought to provide a better alternative for users who wish to leave
    no loose threads. We can do this by providing an explicit destructor. This usually
    takes the form of a method that takes ownership of self and exposes any errors
    (using -> Result<_, _>) or asynchrony (using async fn) that are inherent to the
    destruction. A careful user can then use that method to gracefully tear down any
    associated resources.


    > NOTE Make sure you highlight the explicit destructor in your documentation!


    As always, there’s a trade-off. The moment you add an explicit destructor, you
    will run into two issues. First, since your type implements Drop, you can no longer
    move out of any of that type’s fields in the destructor. This is because Drop::drop
    will still be called after your explicit destructor runs, and it takes &mut self,
    which requires that no part of self has been moved. Second, drop takes &mut self,
    not self, so your Drop implementation cannot simply call your explicit destructor
    and ignore its result (because it doesn’t own self). There are a couple of ways
    around these problems, none of which are perfect.


    The first is to make your top-level type a newtype wrapper around an Option, which
    in turn holds some inner type that holds all of the type’s fields. You can then
    use Option::take in both destructors, and call the inner type’s explicit destructor
    only if the inner type has not already been taken. Since the inner type does not

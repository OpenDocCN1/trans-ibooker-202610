    \ use mylib::frobnify;\n/// frobnify(\"0\".parse()?)?;\n/// # Ok::<(), anyhow::Error>(())\n\
    /// ```\n///\n/// You could even replace an entire block of code completely,\n\
    /// though use this _very_ sparingly:\n/// ```\n/// # /*\n/// let i = ...;\n///\
    \ # */\n/// # let i = 42;\n/// frobnify(i)?;\n/// ```\nfn frobnify(i: usize) ->\
    \ std::io::Result<()> {\n````\n\n*清单 7-5：使用 # 在文档测试中隐藏行*\n\n> **注意：** 慎用此功能；如果用户复制粘贴示例后因你隐藏了必需步骤而无法工作，这会让用户感到沮丧。\n\
    \n与 `#[test]` 函数一样，文档测试也支持修改文档测试运行方式的属性。这些属性紧跟在用于表示代码块的三重反引号之后，并且多个属性可以用逗号分隔。\n\

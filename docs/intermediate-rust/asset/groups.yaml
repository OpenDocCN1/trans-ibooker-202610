    unix，要么是与特性条件中使用的键/值对。


    有许多有趣的选项可以让编译依赖于它们。让我们从最常见到最不常见逐一介绍：


    ### 特性选项


    你已经见过这些示例。特性选项采用 feature = "name-of-feature" 的形式，如果命名的特性已启用，则该选项为真。你可以使用组合器在单个条件中检查多个特性。例如，如果特性
    f1 或特性 f2 已启用，则 any(feature = "f1", feature = "f2") 为真。


    ### 操作系统选项


    这些选项使用键/值语法，键为 target_os，值为 windows、macos 和 linux 等。你还可以使用 target_family 来指定操作系统家族，其取值为
    windows 或 unix。这些选项非常常见，因此它们拥有自己的命名简写，你可以直接使用 cfg(windows) 和 cfg(unix)。例如，如果你希望某个特定代码段只在
    macOS 和 Windows 上编译，可以这样写：#[cfg(any(windows, target_os = "macos"))].


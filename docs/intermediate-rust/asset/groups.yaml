    \ `Pin<P>` 其中 P::Target: Unpin，我们可以简单地为这两个方法提供安全变体（DerefMut 是 get_unchecked_mut\
    \ 的安全版本）。事实上，我们甚至可以提供一个 `Pin::into_inner`，如果目标类型是 Unpin，就简单地返回拥有的 P，因为 Pin 本质上无关紧要！\n\
    \n## 获取一个 Pin\n\n有了我们对 Pin 和 Unpin 的新理解，我们现在可以开始使用清单 9-8 中要求 Pin<&mut Self> 的新\
    \ Future 定义。第一步是构造所需类型。如果 future 类型是 Unpin，那一步很容易——我们只需使用 `Pin::new(&mut future)`。如果它不是\
    \ Unpin，我们可以通过两种主要方式固定 future：堆上固定或栈上固定。\n\n让我们从堆上固定开始。Pin 的主要契约是一旦某物被固定，它就不能移动。固定\
    \ API 会确保 Pin 的所有方法和 trait 都满足这一点，因此任何构造 Pin 的函数的主要作用是确保如果 Pin 本身移动，被引用值也不会移动。确保这一点最简单的方法是将被引用对象放在堆上，然后只将指向被引用对象的指针放在\
    \ Pin 中。你可以随意移动 Pin，但目标仍会保持原位。这就是（安全）方法 `Box::pin` 背后的原理，它接受一个 T 并返回一个 `Pin<Box<T>>`。它没有魔法；它只是断言\
    \ Box 遵循 Pin 构造器、Deref 和 Drop 契约。\n\n> **UNPIN BOX**\n> \n> 说到 Box，看看 Box 的 Unpin\
    \ 实现。Box 类型无条件地为任何 T 实现 Unpin，即使该 T 不是 Unpin。这可能让你觉得奇怪，鉴于之前断言 Unpin 是一个 auto-trait，通常只有当类型的全部成员也是\
    \ Unpin 时才会为该类型实现。Box 在这方面是一个例外，原因与它能够提供安全 Pin 构造器的原因相同：如果移动一个 Box<T>，你并不会移动 T。换句话说，无条件的实现断言你可以将一个\
    \ Box<T> 从 Pin 中移出，即使 T 不能从 Pin 中移出。注意，这并不会让你能够将一个 !Unpin 的 T 从 Pin<Box<T>> 中移出。\n\
    \n另一个选项，栈上固定，要复杂一些，并且在撰写本文时需要一点点不安全代码。我们必须确保在 Pin 被丢弃后，不能再通过 `&mut` 访问被固定的值。我们通过在清单\
    \ 9-11 中所示的宏中对值进行遮蔽来实现这一点，或使用提供此宏的 crate 中的一个。有一天它甚至可能进入标准库！\n\n```\nmacro_rules!\
    \ pin_mut {\n    ($var:ident) => {\n        let mut $var = $var;\n        let\
    \ mut $var = unsafe { Pin::new_unchecked(&mut $var) };\n    }\n}\n```\n\n*清单 9-11：用于栈上固定的宏*\n\
    \n"

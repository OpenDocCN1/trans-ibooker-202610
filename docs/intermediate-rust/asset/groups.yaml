    \n叶 future 与执行器之间的紧密集成有一个连锁效应：来自某个执行器 crate 的叶 future 往往无法与不同的执行器一起使用。或者至少，除非叶\
    \ future 对应的执行器 *也* 在运行，否则它们无法使用。当叶 future 去存储自己的 `Waker` 并注册它正在等待的事件源时，它针对其构建的执行器必须已经设置了相应状态并处于运行状态，这样事件源才会真正被监控，`wake`\
    \ 也最终会被调用。有一些办法可以绕过这个问题，例如如果没有执行器在运行，就让叶 future 生成一个执行器，但这并不总是可取的，因为这意味着应用程序会不知不觉地同时运行多个执行器，从而降低性能，也意味着调试时你必须检查多个执行器的状态。\n\
    \n希望支持多个执行器的库 crate 必须在其叶资源上做到泛型化。例如，库可以不使用某个特定执行器的 `TcpStream` 或 `File` future\
    \ 类型，而是存储一个泛型 `T: AsyncRead + AsyncWrite`。然而，生态尚未确定这些 trait 到底应该是什么样、需要哪些 trait，所以目前要让代码真正跨执行器泛型是相当困难的。例如，虽然\
    \ `AsyncRead` 和 `AsyncWrite` 在生态中多少算是常见（或者必要时可以轻松适配），但目前还没有用于在后台运行 future（即 spawn，我们稍后会讨论）或用于表示定时器的\
    \ trait。\n\n## “唤醒”这个词并不恰当\n\n你可能已经意识到，`Waker::wake` 看起来未必会唤醒任何东西。例如，对于外部事件（如上一节所述），执行器本就已经处于唤醒状态，再让它对一个本来就属于该执行器的\
    \ `Waker` 调用 `wake`，看起来确实有点傻！事实上，`Waker::wake` 这个名称多少有些名不副实——实际上，它表示某个特定的 future\
    \ 已可运行。也就是说，它告诉执行器：当执行器有空处理它时，应确保轮询这个特定的 future，而不是再次进入睡眠，因为这个 future 可以取得进展。如果执行器当前正在睡眠，这可能会唤醒执行器，使其去轮询那个\
    \ future，但这更像是副作用，而非其主要目的。\n\n执行器必须知道哪些 future 是可运行的，原因有二。第一，它需要知道何时可以停止轮询某个 future\
    \ 并进入睡眠；仅仅轮询每个 future 直到其返回 `Poll::Pending` 是不够的，因为轮询后一个 future 可能会让前一个 future\
    \ 得以推进。考虑这样一个场景：两个 future 通过通道来回向对方传递消息。当你轮询其中一个时，另一个变得就绪，反之亦然。在这种情况下，执行器绝不应该进入睡眠，因为总是有更多工作要做。\n\
    \n第二，知道哪些 future 可运行能让执行器避免不必要的轮询。如果一个执行器管理着数千个挂起的 future，它不应该仅仅因为一个事件使其中某一个 future\
    \ 可运行，就去轮询所有 future。如果真那样做，执行异步代码会变得非常慢。\n\n## 任务\n\n异步程序中的 future 会形成一棵树：一个 future\
    \ 可能包含任意数量的其他 future，而这些 future 又可能包含其他 future，一路向下直到与唤醒器交互的叶 future。每棵树的根，就是你交给执行器主“run”函数的那个\
    \ future。这些根 future 被称为任务，它们是执行器与 future 树之间唯一的接触点。执行器对任务调用 `poll`，从那时起，每个被包含的\
    \ future 的代码都必须确定作为回应要轮询哪些内部 future，一路向下直到相关的叶。\n\n执行器通常会为它们轮询的每个任务构造一个独立的 `Waker`，这样稍后调用\
    \ `wake` 时，它们就知道是哪个任务刚刚变为可运行状态，并将其标记为可运行。这正是 `RawWaker` 中裸指针的用途——在共享各种 `Waker`\
    \ 方法的代码的同时，区分不同的任务。\n\n当执行器最终轮询一个任务时，该任务会从 `Future::poll` 实现的顶部开始运行，并且必须从那里决定如何到达更深层的、现在可以取得进展的\
    \ future。由于每个 future 只知道自己的字段，对整棵树一无所知，这一切都是通过一次次 `poll` 调用完成的，每次调用遍历树中的一条边。\n\
    \n选择轮询哪个内部 future 通常显而易见，但并非总是如此。在 async/await 的情况下，要轮询的 future 就是我们被阻塞等待的那个。但在一个等待多个\
    \ future 中第一个取得进展（通常称为 select）或等待一组 future 全部完成（通常称为 join）的 future 中，就有很多选择了。必须做出这种选择的\
    \ future 基本上就是一个子执行器。它可以轮询所有内部 future，但这样做可能相当浪费。因此，这些子执行器通常会在对任何内部 future 调用\
    \ `poll` 之前，先用它们自己的 `Waker` 类型包装在 `poll` 的 `Context` 中收到的 `Waker`。在包装代码中，它们会先在自己的内部状态中将刚刚轮询过的\
    \ future 标记为可运行，然后再对原始的 `Waker` 调用 `wake`。这样一来，当执行器最终再次轮询该子执行器 future 时，子执行器就可以查看自己的内部状态，弄清楚是哪个内部\
    \ future 导致了当前这次 `poll` 调用，然后只轮询这些 future。\n\n## 用 `spawn` 将所有内容串联起来\n\n在使用异步执行器时，你可能会遇到一个生成\
    \ future 的操作。现在我们终于可以来探讨它的含义了！让我们通过一个例子来说明。首先，看一下清单 9-14 中的简单服务器实现。\n\n```rust\n\
    async fn handle_client(socket: TcpStream) -> Result<()> {\n    // Interact with\
    \ the client over the given socket.\n}\n\nasync fn server(socket: TcpListener)\
    \ -> Result<()> {\n    while let Some(stream) = socket.accept().await? {\n   \
    \     handle_client(stream).await?;\n    }\n}\n```\n\n清单 9-14：顺序处理连接\n\n顶层 server\
    \ 函数本质上是一个大型 future，它监听新连接，并在新连接到来时执行某些操作。你把这个 future 交给执行器，说“运行这个”，而且由于你不想让程序随后立即退出，你可能会让\n"

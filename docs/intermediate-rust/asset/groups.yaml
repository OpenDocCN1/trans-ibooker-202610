    \ like:\n\n```\nloop { if let Poll::Ready(r) = expr.poll() { break r } else {\
    \ yield } }\n```\n\nThat was an ever-so-slight simplification, because as we've\
    \ seen you can only call Future::poll if you have a Pin<&mut Self> for the future.\
    \ The desugaring is actually a bit more sophisticated, as shown in Listing 9-12.\n\
    \n```\n① match expr {\n    mut pinned => loop {\n        ② match unsafe { Pin::new_unchecked(&mut\
    \ pinned) }.poll() {\n            Poll::Ready(r) => break r,\n            Poll::Pending\
    \ => yield,\n        }\n    }\n}\n```\n\nListing 9-12: A more accurate de-sugaring\
    \ of <expr>.await\n\nThe match ① is a neat shorthand to ensure that the expansion\
    \ remains a valid expression, while also moving the expression result into a variable\
    \ that we can then pin on the stack. Beyond that, the main new addition is the\
    \ call to Pin::new_unchecked ②. That call is safe because for the containing async\
    \ block to be polled, it must already be pinned due to the signature"
  - "[PAGE 136]\n\nof Future::poll. And the async block was polled for us to reach\
    \ the call to Pin::new_unchecked, so the generator state is pinned. Since pinned\
    \ is stored in the generator that corresponds to the async block (it must be so\
    \ that yield will resume correctly), we know that pinned will not move again.\n\
    Furthermore, pinned is not accessible except through a Pin once we’re in the loop,\
    \ so no code is able to move out of the value in pinned. Thus, we meet all the\
    \ safety requirements of Pin::new_unchecked, and the code is safe.\n\n# Going\
    \ to Sleep\n\nWe went pretty deep into the weeds with Pin, but now that we’re\
    \ out the other side, there is another issue around futures that may have been\
    \ making your brain itch. If a call to Future::poll returns Poll::Pending, you\
    \ need something to call poll again at a later time to check whether you can make\
    \ progress yet. That something is usually called the executor. Your executor could\
    \ be a simple loop that polls all the futures you are waiting on until they’ve\
    \ all returned Poll::Ready, but that would burn a lot of CPU cycles you could\
    \ probably have used for other, more useful things, like running your web browser.\
    \ Instead, we want the executor to do whatever useful work it can do, and then\
    \ go to sleep. It should stay asleep until one of the futures can make progress,\
    \ and only then wake up to do another pass, before going to sleep again.\n\n#\
    \ Waking Up\n\nThe condition that determines when to check back with a given future\
    \ varies widely. It might be “when a network packet arrives on this port,” “when\
    \ the mouse cursor moves,” “when someone sends on this channel,” “when the CPU\
    \ receives a particular interrupt,” or even “after this much time has passed.”\
    \ On top of that, developers can write their own futures that wrap multiple other\
    \ futures, and thus may have several wake-up conditions. Some futures may even\
    \ introduce their own entirely custom wake events.\nTo accommodate these many\
    \ use cases, Rust introduces the notion of a Waker: a way to wake the executor\
    \ to signal that progress can be made. The Waker is what makes the whole machinery\
    \ around futures work. The executor constructs a Waker that integrates with the\
    \ mechanism the executor uses to go to sleep, and passes the Waker in to any Future\
    \ it polls. How? With the additional parameter to Future::poll that I’ve hidden\
    \ from you so far. Sorry about that. Listing 9-13 gives the final and true definition\
    \ for Future—no more lies!\n\n```\ntrait Future {\n    type Output;\n    fn poll(self:\
    \ Pin<&mut Self>, cx: &mut Context<' _>) -> Poll<Self::Output>;\n}\n```\n\nListing\
    \ 9-13: The actual Future trait with Context"
  - '[PAGE 137]


    The `&mut` Context contains the Waker. The argument is a Context, not a Waker
    directly, so that we can augment the asynchronous ecosystem with additional context
    for futures should that be deemed necessary.


    The primary method on Waker is wake (and the by-reference variant wake_by_ref).
    The wake method takes no arguments, and its effects are entirely defined by the
    executor that constructed the Waker. You see, Waker is secretly generic over the
    executor. Or, more precisely, whatever constructed the Waker gets to dictate what
    happens when Waker::wake is called, when a Waker is cloned, and when a Waker is
    dropped. This all happens through a manually implemented vtable, which functions
    similarly to the dynamic dispatch we discussed way back in Chapter 3.


    It’s a somewhat involved process to construct a Waker, and the mechanics of it
    aren’t all that important for using one, but you can see the building blocks in
    the RawWakerVTable type in the standard library. It has a constructor that takes
    the function pointers for wake and wake_by_ref, as well as Clone and Drop. The
    RawWakerVTable, which is usually shared among all of an executor’s wakers, is
    bundled up with a raw pointer that is intended to hold data specific to each Waker
    instance (like which future it’s for), and turned into a RawWaker. That is in
    turn passed to Waker::from_raw to produce a safe Waker that can be passed to Future::poll.


    # The Poll Contract


    So far we’ve skirted around what a future actually does with a Waker. The idea
    is fairly simple: if Future::poll returns Poll::Pending, it is the future’s responsibility
    to ensure that *something* calls wake on the provided Waker when the future is
    next able to make progress. Most futures uphold this property by only returning
    Poll::Pending if some other future also returned Poll::Pending; in this way it
    trivially fulfills the contract of poll since the inner future must follow that
    same contract. But there can’t be turtles all the way down. At some point, you
    reach a future that does not poll other futures, but instead does something like
    write to a network socket or attempt to receive on a channel. These are commonly
    referred to as *leaf futures* since they have no children. A leaf future has no
    inner future, but instead directly represents some resource that may not be ready
    to return a result yet.


    Leaf futures typically come in one of two shapes: those that wait for events that
    originate within the same process (like a channel receiver), and those that wait
    for events external to the process (like a TCP packet receive). Those that wait
    for internal events all tend to follow the same pattern: store the Waker somewhere
    where the code that will wake you up can find it, and have that code call wake
    on the Waker when it generates the relevant event. For example, consider a leaf
    future that has to wait for a message on an in-memory channel. It stores the Waker
    inside the part of the channel that is shared between the sender and the receiver,
    and then returns Poll::Pending. When a sender later comes along and injects a
    message into the channel, it notices the Waker left there by the waiting receiver
    and calls wake on the Waker'

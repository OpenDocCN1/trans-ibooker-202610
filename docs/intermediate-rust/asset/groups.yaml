    \ cost of adding another parameter against the ergonomic cost of invariance.\n\
    \n## Summary\n\nThe aim of this chapter has been to establish a solid, shared\
    \ foundation that we can build on in the chapters to come. By now, I hope you\
    \ feel that you have a firm grasp on Rust's memory and ownership model, and that\

    First the compiler sees the field `tiny`, whose logical size is 1 bit (true or
    false). But since the CPU and memory operate in terms of bytes, `tiny` is given
    1 byte in the in-memory representation. Next, `normal` is a 4-byte type, so we
    want it to be 4-byte-aligned. But even if `Foo` is aligned, the 1 byte we allocated
    to `tiny` is going to make `normal` miss its alignment. To rectify this, the compiler
    inserts 3 bytes of *padding*—bytes with an indeterminate value that are ignored
    in user code—into the in-memory representation between `tiny` and `normal`. No
    values go into the padding, but it does take up space.


    For the next field, `small`, alignment is simple: it’s a 1-byte value, and the
    current byte offset into the struct is 1 + 3 + 4 = 8. This is already byte-aligned,
    so `small` can go immediately after `normal`. With `long` we have a problem again,
    though. We are now 1 + 3 + 4 + 1 = 9 bytes into `Foo`. If `Foo` is aligned, then
    `long` is not 8-byte-aligned the way we want it to be, so we must insert another
    7 bytes of padding to make `long` aligned again. This also conveniently ensures
    the 2-byte alignment we need for the last field, `short`, bringing the total to
    26 bytes. Now that we’ve gone through all the fields, we also need to determine
    the alignment of `Foo` itself. The rule here is to use the largest alignment of
    any of `Foo`’s fields, which will be 8 bytes because of `long`. So, to ensure
    that `Foo` remains aligned if placed in, say, an array, the compiler then adds
    a final 6 bytes of padding to make `Foo`’s size a multiple of its alignment at
    32 bytes.


    Now we are ready to shed the C legacy and consider what would happen to the layout
    if we did not use `repr(C)` in Listing 3-1. One of the primary limitations of
    the C representation is that it requires that we place all fields in the same
    order that they appear in the original struct definition. The default Rust representation
    `repr(Rust)` removes that limitation, along with a couple of other lesser restrictions,
    such as deterministic field ordering for types that happen to have the same fields.
    That is, even two different types that share all the same fields, of the same
    type, in the same order, are not guaranteed to be laid out the same when using
    the default Rust layout!


    Since we’re now allowed to reorder the fields, we can place them in decreasing
    order of size. This means we no longer need the padding between `Foo`’s fields;
    the fields themselves are used to achieve the necessary alignment! `Foo` is now
    just the size of its fields: only 16 bytes. This is one of the reasons why Rust
    by default does not give many guarantees about how a type is laid out in memory:
    by giving the compiler more leeway to rearrange things, we can produce more efficient
    code.


    It turns out there’s also a third way to lay out a type, and that is to tell the
    compiler that we do not want any padding between our fields. In doing so, we’re
    saying that we are willing to take the performance hit of using misaligned accesses.
    The most common use case for this is when the impact of every additional byte
    of memory can be felt, such as if you have a lot of instances of the type, if
    you have very limited memory, or if you’re sending the in-memory representation
    over a lower-bandwidth medium like a network connection. To opt in to this behavior,
    you can annotate your type with `#[repr(packed)]`. Keep in mind that this may
    lead to much slower code, and in extreme cases, this can cause your program to
    crash if you try to perform operations that the CPU supports only on aligned arguments.


    Sometimes, you want to give a particular field or type a larger alignment than
    it technically requires. You can do that using the attribute `#[repr(align(n))]`.
    A common use case for this is to ensure that different values stored contiguously
    in memory (like in an array) end up in different cache lines on the CPU. That
    way, you avoid *false sharing*, which can cause huge performance degradations
    in concurrent programs. False sharing occurs when two different CPUs access different
    values that happen to share a cache line; while they can theoretically operate
    in parallel, they both end up contending to update the same single entry in the
    cache. We’ll talk about concurrency in much greater detail in Chapter 11.


    ## Complex Types


    You might be curious about how the compiler represents other Rust types in memory.
    Here’s a quick reference:


    - **Tuple** Represented like a struct with fields of the same type as the tuple
    values in the same order.

    - **Array** Represented as a contiguous sequence of the contained type with no
    padding between the elements.

    - **Union** Layout is chosen independently for each variant. Alignment is the
    maximum across all the variants.

    - **Enumeration** Same as union, but with one additional hidden shared field that
    stores the enum variant discriminant. The discriminant is the value the code uses
    to determine which of the enum variants a given value holds. The size of the discriminant
    field depends on the number of variants.


    ## Dynamically Sized Types and Fat Pointers


    You may have come across the marker trait Sized in various odd corners of the
    Rust documentation and in error messages. Usually, it comes up because the compiler
    wants you to provide a type that is Sized, but you (apparently) did not. Most
    types in Rust implement Sized automatically—that is, they have a size that’s known
    at compile time—but two common types do not: trait objects and slices. If you
    have, for example, a `dyn Iterator` or a `[u8]`, those do not have a well-defined
    size. Their size depends on some information that is known only when the program
    runs and not at compile time, which is why they are called *dynamically sized
    types (DSTs)*. Nobody knows ahead of time whether the `dyn Iterator` your function
    received is this 200-byte struct or that 8-byte struct. This presents a problem:
    often the compiler must know the size of something in order to produce valid code,
    such as how much space to allocate to a tuple of type `(i32, dyn Iterator, [u8],
    i32)` or what offset to use if your code tries to access the fourth field. But
    if the type isn’t Sized, that information isn’t available.


    The compiler requires types to be Sized nearly everywhere. Struct fields, function
    arguments, return values, variable types, and array types must all be Sized. This
    restriction is so common that every single type bound you


    write includes T: Sized unless you explicitly opt out of it with T: ?Sized (the
    ? means “may not be”). But this is pretty unhelpful if you have a DST and want
    to do something with it, like if you really want your function to accept a trait
    object or a slice as an argument.


    The solution to this is to place them behind a fat pointer. A fat pointer is just
    like a normal pointer, but it includes an extra word-sized field that gives the
    additional information about that pointer that the compiler needs to generate
    reasonable code for working with the pointer. When you take a reference to a DST,
    the compiler automatically constructs a fat pointer for you. For a slice, the
    extra information is simply the length of the slice. For a trait object—well,
    we’ll get to that later. And crucially, that fat pointer is Sized. Specifically,
    it is twice the size of a usize (the size of a word on the target platform): one
    usize for holding the pointer, and one usize for holding the extra information
    needed to “complete” the type.


    > NOTE Box and Arc also support storing fat pointers, which is why they both support
    T: ?Sized.


    ## Traits and Trait Bounds


    Traits are a key piece of Rust’s type system—they are the glue that allows types
    to interoperate even though they don’t know about each other at the time they
    are defined. The Rust Programming Language does a great job of covering how to
    define and use traits, so I won’t go over that here. Instead, we’re going to take
    a look at some of the more technical aspects of traits: how they’re implemented,
    restrictions you have to adhere to, and some more esoteric uses of traits.


    ## Compilation and Dispatch


    By now, you’ve probably written a decent amount of generic code in Rust. You’ve
    used generic type parameters on types and methods, and maybe even a few trait
    bounds here and there. But have you ever wondered what actually happens to generic
    code when you compile it, or what happens when you call a trait method on a dyn
    Trait?


    When you write a type or function that is generic over T, you’re really telling
    the compiler to make a copy of that type or function for each type T. When you
    construct a Vec<i32> or a HashMap<String, bool>, the compiler essentially copy-pastes
    the generic type and all its implementation blocks and replaces all instances
    of each generic parameter with the concrete type you provided. It makes a full
    copy of the Vec type with every T replaced with i32, and a full copy of the HashMap
    type with every K replaced with String and every V with bool.


    > NOTE In reality, the compiler does not actually do a full copy-paste. It copies
    only parts of the code that you use, so if you never call find on a Vec<i32>,
    the code for find won’t be copied and compiled.


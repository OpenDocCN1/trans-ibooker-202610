    \ through the formula. You can think of macros as automatic code substitution\
    \ where you get to define the rules for the substitution.\n\nRust’s macros come\
    \ in many different shapes and sizes to make it easy to implement many different\
    \ forms of code generation. The two primary types are *declarative* macros and\
    \ *procedural* macros, and we will explore both of them in this chapter. We’ll\
    \ also look at some of the ways macros can come in handy in your everyday coding,\
    \ and some of the pitfalls that arise with more advanced use. Some familiarity\
    \ with macros is assumed, so before reading this chapter I recommend that you\
    \ read the chapter on macros in the Rust language reference (https://doc.rust-lang.org/reference/macros.html).\n\
    \nProgrammers coming from C-based languages may be used to the unholy land of\
    \ C and C++ where you can use #define to change each true to false, or to remove\
    \ all occurrences of the else keyword. If that’s the case for you, you’ll need\
    \ to disassociate macros from a feeling of doing something “bad.” Macros in Rust\
    \ are far from the Wild West of C macros. They follow (mostly) well-defined rules,\
    \ and are fairly misuse-resistant.\n\n# Declarative Macros\n\nDeclarative macros\
    \ are those defined using the macro_rules! syntax, which lets you conveniently\
    \ define function-like macros without having to resort to writing a dedicated\
    \ crate for the purpose (as you do with procedural macros). Once you’ve defined\
    \ a declarative macro, you can invoke it using the name of the macro followed\
    \ by an exclamation mark. I like to think of this kind of macro as a sort of compiler-assisted\
    \ search and replace: it does the job for many regular, well-structured transformation\
    \ tasks, and for eliminating repetitive boilerplate. In your experience with Rust\
    \ up until this point, most of the macros you have recognized as macros are likely\
    \ to have been declarative macros. Note, however, that not all function-like macros\
    \ are declarative macros; macro_rules! itself is one example of this, and format_args!\
    \ is another. The ! suffix merely indicates to the compiler that the macro invocation\
    \ will be replaced with different source code at compile time.\n\n> NOTE  \n>\
    \ Since Rust’s parser specifically recognizes and parses macro invocations annotated\
    \ with !, you can only use them in places where the parser allows them. They work\
    \ in most places you’d expect, like in expression position or in an impl block,\
    \ but not everywhere. For example, you cannot (at the time of writing) invoke\
    \ a function-like macro where an identifier or match arm is expected.\n\nIt may\
    \ not be immediately obvious why declarative macros are called declarative. After\
    \ all, don’t you “declare” everything in your program? In this context, declarative\
    \ refers to the fact that you don’t say how the macro’s inputs should be translated\
    \ into the output, just that you want the output to look like A when the input\
    \ is B. You declare that it shall be so, and the compiler figures out all the\
    \ parsing rewiring that has to happen to make your declaration reality. This makes\
    \ declarative macros concise and expressive, though it also has a tendency to\
    \ make them rather cryptic since you have a limited language to express your declarations\
    \ in.\n\n# When to Use Them\n\nDeclarative macros are primarily useful when you\
    \ find yourself writing the same code over and over, and you’d like to, well,\
    \ not do that. They’re best suited for fairly mechanical replacements—if you’re\
    \ aiming to do fancy code transformations or lots of code generation, procedural\
    \ macros are likely a better fit.\n\nI most frequently make use of declarative\
    \ macros in cases where I find myself writing repetitive and structurally similar\
    \ code, such as in tests and trait implementations. For tests, I often want to\
    \ run the same test multiple times but with slightly different configurations.\
    \ I might have something like what is shown in Listing 8-1.\n\n```rust\nfn test_inner<T>(init:\
    \ T, frobnify: bool) { ... }\n#[test]\nfn test_1u8_frobnified() {\n    test_inner(1u8,\
    \ true);\n}\n// ...\n#[test]\nfn test_i128_not_frobnified() {\n    test_inner(1i128,\
    \ false);\n}\n```\n\n*Listing 8-1: Repetitive testing code*\n\nWhile this works,\
    \ it’s too verbose, too repetitive, and too prone to manual error. With macros\
    \ we can do much better, as shown in Listing 8-2.\n\n```rust\nmacro_rules! test_battery\
    \ {\n    ($($t:ty as $name:ident),*) => {\n        $(\n            mod $name {\n\
    \                #[test]\n                fn frobnified() { test_inner::<$t>(1,\
    \ true) }\n                #[test]\n                fn unfrobnified() { test_inner::<$t>(1,\
    \ false) }\n            }\n        )*\n    }\n}\ntest_battery! {\n    u8 as u8_tests,\n\
    \    // ...\n    i128 as i128_tests\n}\n```\n\n*Listing 8-2: Making a macro repeat\
    \ for you*\n\nThis macro expands each comma-separated directive into its own module\
    \ that then contains two tests, one that calls `test_inner` with true, and one\
    \ with false. While the macro definition isn’t trivial, it makes adding more tests\
    \ much easier. Each type is one line in the `test_battery!` invocation, and the\
    \ macro will take care of generating tests for both true and false arguments.\
    \ We could also have it generate tests for different values for `init`. We’ve\
    \ now significantly reduced the likelihood that we’ll forget to test a particular\
    \ configuration!\n\nThe story for trait implementations is similar. If you define\
    \ your own trait, you’ll often want to implement that trait for a number of types\
    \ in the standard library, even if those implementations are trivial. Let’s imagine\
    \ you invented the Clone trait and want to implement it for all the Copy types\
    \ in the standard library. Instead of manually writing out an implementation for\
    \ each one, you can use a macro like the one in Listing 8-3.\n\n```rust\nmacro_rules!\
    \ clone_from_copy {\n    ($( $t:ty ),*) => {\n        $(impl Clone for $t {\n\
    \            fn clone(&self) -> Self { *self }\n        })*\n    }\n}\nclone_from_copy![bool,\
    \ f32, f64, u8, i8, /* ... */];\n```\n\nListing 8-3: Using a macro to implement\
    \ a trait for many similar types in one fell swoop\n\nHere, we generate an implementation\
    \ of Clone for each provided type whose body just uses * to Copy out of &self.\
    \ You may wonder why we don’t add a blanket implementation of Clone for T where\
    \ T: Copy. We could do that, but a big reason not to is that it would force types\
    \ in other crates to also use that same implementation of Clone for their own\
    \ types that happen to be Copy. There is an experimental compiler feature called\
    \ specialization that could offer a workaround, but at the time of writing the\
    \ stabilization of that feature that is still some way off. So, for the time being,\
    \ we’re better off enumerating the types specifically. This pattern also extends\
    \ beyond simple forwarding implementations: you could easily adapt the example\
    \ in Listing 8-3 to implement an AddOne trait to all integer types, for example!\n\
    \n> NOTE  \n> If you ever find yourself wondering if you should use generics or\
    \ a declarative macro, you should use generics. Generics are generally more ergonomic\
    \ than macros, and integrate much better with other constructs in the language.\
    \ If you want a rule of thumb: if your code changes based on type, use generics;\
    \ otherwise, use macros.\n\n# How They Work\n\nEvery programming language has\
    \ a grammar that dictates how the individual characters that make up the source\
    \ code can be turned into tokens. Tokens are the lowest-level building blocks\
    \ of a language, such as numbers, punctuation characters, string and character\
    \ literals, and identifiers; at this level, there’s no distinction between language\
    \ keywords and variable names. For example, the text (value + 4) would be represented\
    \ by the five-token sequence (, value, +, 4, ) in Rust-like grammar. The process\
    \ of turning text into tokens also provides a layer of abstraction between the\
    \ rest of the compiler and the gnarly low-level details of parsing text. For example,\
    \ in the token representation there is no notion of whitespace, and /*\"foo\"\
    */ and \"/*foo*/\" have distinct representations (the former is no token, the\
    \ latter is a string literal token with the content /*foo*/).\n\nOnce the source\
    \ code has been turned into a sequence of tokens, the compiler walks that sequence\
    \ and assigns syntactic meaning to the tokens. For example, ()-delimited tokens\
    \ make up a group, ! tokens denote macro invocations, and so on. This is the process\
    \ of parsing, which ultimately produces an abstract syntax tree (AST) that describes\
    \ the structure represented by the\n"
  mdcn: "\n\n# 8\n\n# 宏\n\n![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_104_0.png)\n\n\
    宏本质上是一种让编译器替你编写代码的工具。你为编译器提供一个公式，让它根据给定的输入参数生成代码；每次调用宏时，编译器都会用执行该公式得到的结果来替换这次调用。你可以把宏看作自动化的代码替换，而替换规则由你来定义。\n\
    \nRust 的宏有各种不同的形态和规模，以便轻松实现多种不同形式的代码生成。两种主要的类型是*声明式*（declarative）宏和*过程式*（procedural）宏，本章将探讨这两类宏。我们还会看看宏在日常编码中派上用场的几种方式，以及更高级使用中可能出现的一些陷阱。本章假定你对宏已有一定了解，因此在阅读本章之前，我建议你先阅读\
    \ Rust 语言参考中关于宏的章节（https://doc.rust-lang.org/reference/macros.html）。\n\n来自 C 系语言的程序员可能已经习惯了\
    \ C 和 C++ 那片无法无天的土地，在那里你可以用 #define 把每个 true 改成 false，或者删除所有出现的 else 关键字。如果你正是如此，就需要把宏与“做坏事”的感觉分离开来。Rust\
    \ 中的宏远非 C 宏那样的狂野西部。它们（大多）遵循定义良好的规则，并且相当难以误用。\n\n# 声明式宏\n\n声明式宏是使用 macro_rules!\
    \ 语法定义的，这种语法让你可以方便地定义类函数宏，而无需为此专门编写一个 crate（过程式宏则需要这样做）。一旦定义了声明式宏，你就可以用宏名后跟感叹号的方式调用它。我喜欢把这种宏想象成一种编译器辅助的查找替换：它能胜任许多常规、结构良好的转换任务，也能消除重复的样板代码。就你到目前为止使用\
    \ Rust 的经验而言，你所识别为宏的大多数宏很可能都是声明式宏。不过请注意，并非所有类函数宏都是声明式宏；macro_rules! 本身就是一个例子，format_args!\
    \ 是另一个。! 后缀仅仅向编译器表明：这个宏调用将在编译时被替换为不同的源代码。\n\n> 注意  \n> 由于 Rust 的解析器会专门识别并解析带有\
    \ ! 的宏调用，你只能在解析器允许的位置使用它们。它们在大多数你期望的位置都能工作，比如表达式位置或 impl 块中，但并非所有位置都可以。例如，（在撰写本文时）你不能在期望标识符或\
    \ match 分支的位置调用类函数宏。\n\n为什么声明式宏被称为“声明式”可能并不那么显而易见。毕竟，你在程序中不就是在“声明”一切吗？在这个语境下，“声明式”指的是：你并不说明宏的输入应该如何转换为输出，而只是声明当输入是\
    \ B 时，你希望输出看起来像 A。你声明事情应当如此，编译器会弄清楚为使你的声明成为现实所需的所有解析重连。这使得声明式宏简洁而富有表现力，不过由于用于表达声明的语言很有限，它们也往往相当晦涩难懂。\n\
    \n# 何时使用它们\n\n当你发现自己一遍又一遍地编写相同的代码，并且希望，嗯，别再这样时，声明式宏就主要派上用场了。它们最适合相当机械的替换——如果你的目标是做花哨的代码变换或大量代码生成，过程式宏可能更合适。\n\
    \n我最常使用声明式宏的场景，是发现自己正在编写重复且结构相似的代码，例如测试和 trait 实现。对于测试，我经常想用略有不同的配置多次运行同一个测试。我可能会有类似于清单\
    \ 8-1 所示的代码。\n\n```rust\nfn test_inner<T>(init: T, frobnify: bool) { ... }\n#[test]\n\
    fn test_1u8_frobnified() {\n    test_inner(1u8, true);\n}\n// ...\n#[test]\nfn\
    \ test_i128_not_frobnified() {\n    test_inner(1i128, false);\n}\n```\n\n*清单 8-1：重复的测试代码*\n\
    \n虽然这样可行，但过于冗长、过于重复，也太容易因手工操作而出错。借助宏，我们可以做得更好，如清单 8-2 所示。\n\n```rust\nmacro_rules!\
    \ test_battery {\n    ($($t:ty as $name:ident),*) => {\n        $(\n         \
    \   mod $name {\n                #[test]\n                fn frobnified() { test_inner::<$t>(1,\
    \ true) }\n                #[test]\n                fn unfrobnified() { test_inner::<$t>(1,\
    \ false) }\n            }\n        )*\n    }\n}\ntest_battery! {\n    u8 as u8_tests,\n\
    \    // ...\n    i128 as i128_tests\n}\n```\n\n*清单 8-2：让宏替你重复*\n\n这个宏会把每个逗号分隔的指令展开成自己的模块，每个模块包含两个测试：一个用\
    \ true 调用 `test_inner`，另一个用 false 调用。虽然宏定义并不简单，但它让添加更多测试变得容易得多。每个类型在 `test_battery!`\
    \ 调用中只占一行，宏会负责为 true 和 false 两种参数都生成测试。我们还可以让它为不同的 `init` 值生成测试。现在，我们忘记测试某个特定配置的可能性已大大降低！\n\
    \ntrait 实现的情况与此类似。如果你定义了自己的 trait，你通常会想为标准库中的多个类型实现该 trait，即使这些实现微不足道。假设你发明了 Clone\
    \ trait，并想为标准库中所有 Copy 类型实现它。与其手动为每个类型写出实现，不如使用类似清单 8-3 中的宏。\n\n```rust\nmacro_rules!\
    \ clone_from_copy {\n    ($( $t:ty ),*) => {\n        $(impl Clone for $t {\n\
    \            fn clone(&self) -> Self { *self }\n        })*\n    }\n}\nclone_from_copy![bool,\
    \ f32, f64, u8, i8, /* ... */];\n```\n\n*清单 8-3：使用宏一蹴而就地为一众相似类型实现 trait*\n\n在这里，我们为每个提供的类型生成一个\
    \ Clone 实现，其函数体只是用 * 从 &self 中 Copy 出值。你可能会疑惑，为什么我们不添加一个对 T where T: Copy 的 blanket\
    \ 实现呢？我们确实可以这样做，但不这样做的重大原因之一是：那会迫使其他 crate 中恰好是 Copy 的类型也使用相同的 Clone 实现。有一个名为\
    \ specialization（特化）的实验性编译器特性可以提供变通方案，但在撰写本文时，该特性的稳定化仍有一段距离。所以，就目前而言，我们最好还是具体地逐一列出这些类型。这种模式也不仅限于简单的转发实现：例如，你可以轻松调整清单\
    \ 8-3 中的示例，为所有整数类型实现一个 AddOne trait！\n\n> 注意  \n> 如果你曾在“应该用泛型还是声明式宏”上犹豫不决，那就应该用泛型。泛型通常比宏更符合人体工程学，也更能与语言中的其他结构集成。如果你想要一条经验法则：如果你的代码因类型而变，使用泛型；否则，使用宏。\n\
    \n# 它们如何工作\n\n每种编程语言都有一种语法，规定组成源代码的各个字符如何转换成 token（记号）。token 是语言最底层的构建块，例如数字、标点字符、字符串字面量和字符字面量，以及标识符；在这一层，语言关键字和变量名之间没有区别。例如，文本\
    \ (value + 4) 在类似 Rust 的语法中会表示为包含五个 token 的序列：(、value、+、4、)。将文本转换为 token 的过程，也在编译器的其余部分与解析文本时那些棘手而底层的细节之间提供了一层抽象。例如，在\
    \ token 表示中没有空白的概念，并且 /*\"foo\"*/ 与 \"/*foo*/\" 有不同的表示（前者不是 token，后者是内容为 /*foo*/\
    \ 的字符串字面量 token）。\n\n一旦源代码被转换为 token 序列，编译器就会遍历该序列，并为这些 token 赋予语法含义。例如，由 () 界定的\
    \ token 组成一个分组，! token 表示宏调用，等等。这就是解析过程，它最终生成一棵抽象语法树（AST），该树描述了由\n\n"

    # DROP ORDER


    Rust automatically drops values when they go out of scope, such as x1 and x2 in
    the inner scope in Listing 2-3. The rules for the order in which to drop are fairly
    simple: variables (including function arguments) are dropped in reverse order,
    and nested values are dropped in source-code order.


    This might sound weird at first—why the discrepancy? If we look at it closely,
    though, it makes a lot of sense. Say you write a function that declares a string
    and then inserts a reference to that string into a new hash table. When the function
    returns, the hash table must be dropped first; if the string were dropped first,
    the hash table would then hold an invalid reference! In general, later variables
    may contain references to earlier values, whereas the inverse cannot happen due
    to Rust’s lifetime rules. And for that reason, Rust drops variables in reverse
    order.


    Now, we could have the same behavior for nested values, like the values in a tuple,
    array, or struct, but that would likely surprise users. If you constructed an
    array that contained two values, it’d seem odd if the last element of the array
    were dropped first. The same applies to tuples and structs, where the most intuitive
    behavior is for the first tuple element or field to be dropped first, then the
    second, and so on. Unlike for variables, there is no need to reverse the drop
    order in this case, since Rust doesn’t (currently) allow self-references in a
    single value. So, Rust goes with the intuitive option.


    # Borrowing and Lifetimes


    Rust allows the owner of a value to lend out that value to others, without giving
    up ownership, through references. References are pointers that come with an additional
    contract for how they can be used, such as whether the reference provides exclusive
    access to the referenced value, or whether the referenced value may also have
    other references point to it.


    # Shared References


    A shared reference, &T, is, as the name implies, a pointer that may be shared.
    Any number of other references may exist to the same value, and each shared reference
    is Copy, so you can trivially make more of them. Values behind shared references
    are not mutable; you cannot modify or reassign the value a shared reference points
    to, nor can you cast a shared reference to a mutable one.


    The Rust compiler is allowed to assume that the value a shared reference points
    to will not change while that reference lives. For example, if the Rust compiler
    sees that the value behind a shared reference is read multiple times in a function,
    it is within its rights to read it only once and reuse that value. More concretely,
    the assertion in Listing 2-4 should never fail.'

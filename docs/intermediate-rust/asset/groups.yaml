    lints. These lints catch code patterns that compile but are almost certainly bugs.
    Some examples are a = b; b = a, which fails to swap a and b; std::mem::forget(t),
    where t is a reference; and for x in y.next(), which will iterate only over the
    first element in y. If you are not running clippy as part of your CI pipeline
    already, you probably should be.


    Clippy comes with a number of other lints that, while usually helpful, may be
    more opinionated than you’d prefer. For example, the type_complexity lint, which
    is on by default, issues a warning if you use a particularly involved type in
    your program, like Rc<Vec<Vec<Box<(u32, u32, u32, u32)>>>>>. While that warning
    encourages you to write code that is easier to read, you may find it too pedantic
    to be broadly useful. If some part of your code erroneously triggers a particular
    lint, or you just want to allow a specific instance of it, you can opt out of
    the lint just for that piece of code with #[allow(clippy::name_of_lint)].


    The Rust compiler also comes with its own set of lints in the form of warnings,
    though these are usually more directed toward writing idiomatic code than checking
    for correctness. Instead, correctness lints in the compiler are simply treated
    as errors (take a look at rustc -W help for a list).


    > NOTE

    > Not all compiler warnings are enabled by default. Those disabled by default
    are usually still being refined, or are more about style than content. A good
    example of this is the “idiomatic Rust 2018 edition” lint, which you can enable
    with #![warn(rust_2018_idioms)]. When this lint is enabled, the compiler will
    tell you if you’re failing to take advantage of changes brought by the Rust 2018
    edition. Some other lints that you may want to get into the habit of enabling
    when you start a new project are missing_docs and missing_debug_implementations,
    which warn you if you’ve forgotten to document any public items in your crate
    or add Debug implementations for any public types, respectively.


    # Test Generation


    Writing a good test suite is a lot of work. And even when you do that work, the
    tests you write test only the particular set of behaviors you were considering
    at the time you wrote them. Luckily, you can take advantage of a number of test
    generation techniques to develop better and more thorough tests. These generate
    input for you to use to check your application’s correctness. Many such tools
    exist, each with their own strengths and weaknesses, so here I’ll cover only the
    main strategies used by these tools: fuzzing and property testing.


    # Fuzzing


    Entire books have been written about fuzzing, but at a high level the idea is
    simple: generate random inputs to your program and see if it crashes. If the program
    crashes, that’s a bug. For example, if you’re writing a URL parsing library, you
    can fuzz-test your program by systematically generating random strings and throwing
    them at the parsing function until it panics. Done'

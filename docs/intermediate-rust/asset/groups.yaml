    ## 5


    ## ERROR HANDLING


    ![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_60_0.png)


    For all but the simplest programs, you will have methods that can fail. In this
    chapter, we’ll look at different ways to represent, handle, and propagate those
    failures and the advantages and drawbacks of each. We’ll start by exploring different
    ways to represent errors, including enumeration and erasure, and then examine
    some special error cases that require a different representation technique. Next,
    we’ll look at various ways of handling errors and the future of error handling.


    It’s worth noting that best practices for error handling in Rust are still an
    active topic of conversation, and at the time of writing, the ecosystem has not
    yet settled on a single, unified approach. This chapter will therefore focus on
    the underlying principles and techniques rather than recommending specific crates
    or patterns.


    The implementation of `source` is straightforward: we match on `self` and extract
    and return the inner `std::io::Error`.


    Second, your type should implement both `Display` and `Debug` so that callers
    can meaningfully print your error. This is required if you implement the `Error`
    trait. In general, your implementation of `Display` should give a one-line description
    of what went wrong that can easily be folded into other error messages. The display
    format should be lowercase and without trailing punctuation so that it fits nicely
    into other, larger error reports. `Debug` should provide a more descriptive error
    including auxiliary information that may be useful in tracking down the cause
    of the error, such as port numbers, request identifiers, source code location,
    and the like.


    > **NOTE** In older Rust code, you may see references to the `Error::description`
    method, but this has been deprecated in favor of `Display`.


    Third, your type should, if possible, implement both `Send` and `Sync` so that
    users are able to share the error across thread boundaries. If your error type
    is not thread-safe, you will find that it’s almost impossible to use your crate
    in a multithreaded context. Error types that implement `Send` and `Sync` are also
    much easier to use with the very common `std::io::Error` type, which is able to
    wrap errors that implement `Error`, `Send`, and `Sync`. Of course, not all error
    types can reasonably be `Send` and `Sync`, such as if they’re tied to particular
    thread-local resources, and that’s okay. You’re probably not sending those errors
    across thread boundaries either. However, it’s something to be aware of before
    you go placing `Rc<String>` and `RefCell<bool>` types in your errors.


    Finally, where possible, your error type should be `''static`. The most immediate
    benefit of this is that it allows the caller to more easily propagate your error
    up the call stack without running into lifetime issues. It also enables your error
    type to be used more easily with type-erased error types, as we’ll see shortly.


    ## Opaque Errors


    Now let’s consider a different example: an image decoding library. You give the
    library a bunch of bytes to decode, and it gives you access to various image manipulation
    methods. If the decoding fails, the user needs to be able to figure out how to
    resolve the issue, and so must understand the cause. But is it important whether
    the cause is the size field in the image header being invalid, or the compression
    algorithm failing to decompress a block? Probably not—the application can’t meaningfully
    recover from either situation, even if it knows the exact cause. In cases like
    this, you as the library author may instead want to provide a single, opaque error
    type. This also makes your library a little nicer to use, because there is only
    one error type in use everywhere. This error type should implement `Send`, `Debug`,
    and `Display`, and should probably also implement `Error`, but beyond that, the
    caller doesn’t need to know anything more. You might internally represent more
    fine-grained error states, but there is no need to expose those to the users of
    the library. Doing so would only serve to unnecessarily increase the size and
    complexity of your API.


    Exactly what your opaque error type should be is mostly up to you. It could just
    be a type with all private fields that exposes only limited methods for displaying
    and introspecting the error, or it could be a severely type-erased error type
    like `Box<dyn Error + Send + Sync + ''static>`, which reveals nothing more than
    the fact that it is an error and does not generally let your users introspect
    at all. Deciding how far to go down the route of type erasure is mostly a matter
    of whether there is anything interesting about the error beyond its description.
    With `Box<dyn Error>`, you leave your users with little option but to bubble up
    your error. That might be fine if it truly has no information of value to present
    to the user—for example, if it’s just a dynamic error message or is one of a large
    number of unrelated errors from deeper inside your program. But if the error has
    some interesting facets to it, such as a line number or a status code, you may
    want to expose that through a concrete but opaque type instead.


    > **NOTE**


    > In general, the community consensus is that errors should be rare and therefore
    should not add much cost to the “happy path.” For that reason, errors are often
    placed behind a pointer type, such as a `Box` or `Arc`. This way, they’re unlikely
    to add much to the size of the overall `Result` type they’re contained within.


    One benefit of using type-erased errors is that it allows you to easily combine
    errors from different sources without having to introduce additional error types.
    That is, type-erased errors often compose nicely. If you write a function whose
    return type is `Box<dyn Error + ...>`, then you can use `?` almost indiscriminately
    inside that function, on all sorts of different errors, and they will all be turned
    into that one common error type.


    The `''static` bound on `Box<dyn Error + Send + Sync + ''static>` is worth spending
    a bit more time on in the context of erasure. I mentioned in the previous section
    that it’s useful for letting the caller propagate the error without worrying about
    the lifetime bounds of the method that failed, but it serves an even bigger purpose:
    access to downcasting. Downcasting is the process of taking an item of one type
    and casting it to a more specific type. This is one of the few cases where Rust
    gives you access to type information at runtime; it’s a limited case of the more
    general type reflection that dynamic languages often provide. In the context of
    errors, downcasting allows a user to turn a `dyn Error` into a concrete underlying
    error type when that `dyn Error` was originally of that type. For example, the
    user may want to take a particular action if the error they received was a `std::io::Error`
    of kind `std::io::ErrorKind::WouldBlock`, but they would not take that same action
    in any other case. If the user gets a `dyn Error`, they can use `Error::downcast_ref`
    to try to downcast the error into a `std::io::Error`. The `downcast_ref` method
    returns an `Option`, which tells the user whether or not the downcast succeeded.
    And here is the key observation: `downcast_ref` works only if the argument is
    `''static`. If we return an opaque `Error` that’s not `''static`, we take away
    the user’s ability to do this kind of error introspection should they wish.


    There’s some disagreement in the ecosystem about whether a library’s type-erased
    errors (or more generally, its type-erased types) are part of its public and stable
    API. That is, if the method `foo` in your library returns `lib::MyError` as a
    `Box<dyn Error>`, would changing `foo` to return a different error type be a breaking
    change? The type signature hasn’t changed, but users may have written code that
    assumes that they can use downcast to turn that error back into `lib::MyError`.
    My opinion on this matter is that you chose to return `Box<dyn Error>` (and not
    `lib::MyError`) for a reason, and unless explicitly documented, that does not
    guarantee anything in particular about downcasting.


    You may wonder how `Error::downcast_ref` can be safe. That is, how does it know
    whether a provided `dyn Error` argument is indeed of the given type `T`? The standard
    library even has a trait called `Any` that is implemented for any type, and which
    implements `downcast_ref` for `dyn Any`—how can that be okay? The answer lies
    in the compiler-supported type `std::any::TypeId`, which allows you to get a unique
    identifier for any type. The `Error` trait has a hidden provided method called
    `type_id`, whose default implementation is to return `TypeId::of::<Self>()`. Similarly,
    `Any` has a blanket implementation of `impl Any for T`, and in that implementation,
    its `type_id` returns the same. In the context of these `impl` blocks, the concrete
    type of `Self` is known, so this `type_id` is the type identifier of the real
    type. That provides all the information `downcast_ref` needs. `downcast_ref` calls
    `self.type_id`, which forwards through the vtable for dynamically sized types
    (see Chapter 3) to the implementation for the underlying type and compares that
    to the type identifier of the provided downcast type. If they match, then the
    type behind the `dyn Error` or `dyn Any` really is `T`, and it is safe to cast
    from a reference to one to a reference to the other.


    ## Special Error Cases


    Some functions are fallible but cannot return any meaningful error if they fail.
    Conceptually, these functions have a return type of `Result<T, ()>`. In some codebases,
    you may see this represented as `Option<T>` instead. While both are legitimate
    choices for the return type for such a function, they convey different semantic
    meanings, and you should usually avoid “simplifying” a `Result<T, ()>` to `Option<T>`.
    An `Err(())` indicates that an operation failed and should be retried, reported,
    or otherwise handled exceptionally. `None`, on the other hand, conveys only that
    the function has nothing to return; it is usually not considered an exceptional
    case or something that should be handled. You can see this in the `#[must_use]`
    annotation on the `Result` type—when you get a `Result`, the language expects
    that it is important to handle both cases, whereas with an `Option`, neither case
    actually needs to be handled.


    > **NOTE** You should also keep in mind that `()` does not implement the `Error`
    trait. This means that it cannot be type-erased into `Box<dyn Error>` and can
    be a bit of a pain to use with `?`. For this reason, it is often better to define
    your own unit struct type, implement `Error` for it, and use that as the error
    instead of `()` in these cases.


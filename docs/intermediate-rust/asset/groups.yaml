    # Context options


    These let you tailor code to a particular compilation context. The most common
    of these is the test option, which is true only when the crate is being compiled
    under the test profile. Keep in mind that test is set only for the crate that
    is being tested, not for any of its dependencies. This also means that test is
    not set in your crate when running integration tests; it’s the integration tests
    that are compiled under the test profile, whereas your actual crate is compiled
    normally (that is, without test set). The same applies to the doc and doctest
    options, which are set only when building documentation or compiling doctests,
    respectively. There’s also the debug_assertions option, which is set in debug
    mode by default.


    # Tool options


    Some tools, like clippy and Miri, set custom options (more on that later) that
    let you customize compilation when run under these tools. Usually, these options
    are named after the tool in question. For example, if you want a particular compute-intensive
    test not to run under Miri, you can give it the attribute #[cfg_attr(miri, ignore)].


    # Architecture options


    These let you compile based on the CPU instruction set the compiler is targeting.
    You can specify a particular architecture with target_arch, which takes values
    like x86, mips, and aarch64, or you can specify a particular platform feature
    with target_feature, which takes values like avx or sse2. For very low-level code,
    you may also find the target_endian and target_pointer_width options useful.


    # Compiler options


    These let you adapt your code to the platform ABI it is compiled against and are
    available through target_env with values like gnu, msvc, and musl. For historical
    reasons, this value is often empty, especially on GNU platforms. You normally
    need this option only if you need to interface directly with the environment ABI,
    such as when linking against an ABI-specific symbol name using #[link].


    While cfg conditions are usually used to customize code, some can also be used
    to customize dependencies. For example, the dependency winrt usually makes sense
    only on Windows, and the nix crate is probably only useful on Unix-based platforms.
    Listing 6-9 gives an example of how you can use cfg conditions for this:


    ```

    [target.''cfg(windows)''.dependencies]

    winrt = "0.7"

    [target.''cfg(unix)''.dependencies]

    nix = "0.17"

    ```



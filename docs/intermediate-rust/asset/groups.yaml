    # Rust Testing Mechanisms


    To understand the various testing mechanisms Rust provides, you must first understand
    how Rust builds and runs tests. When you run cargo test --lib, the only special
    thing Cargo does is pass the --test flag to rustc. This flag tells rustc to produce
    a test binary that runs all the unit tests, rather than just compiling the crate’s
    library or binary. Behind the scenes, --test has two primary effects. First, it
    enables cfg(test) so that you can conditionally include testing code (more on
    that in a bit). Second, it makes the compiler generate a test harness: a carefully
    generated main function that invokes each #[test] function in your program when
    it’s run.


    # The Test Harness


    The compiler generates the test harness main function through a mix of procedural
    macros, which we’ll discuss in greater depth in Chapter 8, and a light sprinkling
    of magic. Essentially, the harness transforms every function annotated by #[test]
    into a test descriptor—this is the procedural macro part. It then exposes the
    path of each of the descriptors to the generated main function—this is the magic
    part. The descriptor includes information like the test’s name, any additional
    options it has set (like #[should_panic]), and so on. At its core, the test harness
    iterates over the tests in the crate, runs them, captures their results, and prints
    the results. So, it also includes logic to parse command line arguments (for things
    like --test-threads=1), capture test output, run the listed tests in parallel,
    and collect test results.


    As of this writing, Rust developers are working on making the magic part of test
    harness generation a publicly available API so that developers can build their
    own test harnesses. This work is still at the experimental stage, but the proposal
    aligns fairly closely with the model as it exists today. Part of the magic that
    needs to be figured out is how to ensure that #[test] functions are available
    to the generated main function even if they are inside private submodules.


    Integration tests (the tests in tests/) follow the same process as unit tests,
    with the one exception that they are each compiled as their own separate crate,
    meaning they can access only the main crate’s public interface and are run against
    the main crate compiled without #[cfg(test)]. A test harness is generated for
    each file in tests/. Test harnesses are not generated for files in subdirectories
    under tests/ to allow you to have shared submodules for your tests.


    NOTE If you explicitly want a test harness for a file in a subdirectory, you can
    opt in to that by calling the file main.rs.


    Rust does not require that you use the default test harness. You can instead opt
    out of it and implement your own main method that represents the test runner by
    setting harness = false for a given integration test in Cargo.toml, as shown in
    Listing 7-1. The main method that you define will then be invoked to run the test.'
  - '[PAGE 90]


    ```

    [[test]]

    name = "custom"

    path = "tests/custom.rs"

    harness = false

    ```


    Listing 7-1: Opting out of the standard test harness


    Without the test harness, none of the magic around #[test] happens. Instead, you’re
    expected to write your own main function to run the testing code you want to execute.
    Essentially, you’re writing a normal Rust binary that just happens to be run by
    cargo test. That binary is responsible for handling all the things that the default
    harness normally does (if you want to support them), such as command line flags.
    The harness property is set separately for each integration test, so you can have
    one test file that uses the standard harness and one that does not.


    # ARGUMENTS TO THE DEFAULT TEST HARNESS


    The default test harness supports a number of command line arguments to configure
    how the tests are run. These aren’t passed to cargo test directly but rather to
    the test binary that Cargo compiles and runs for you when you run cargo test.
    To access that set of flags, pass -- to cargo test, followed by the arguments
    to the test binary. For example, to see the help text for the test binary, you’d
    run cargo test -- --help.


    A number of handy configuration options are available through these command line
    arguments. The --nocapture flag disables the output capturing that normally happens
    when you run Rust tests. This is useful if you want to observe a test’s output
    in real time rather than all at once after the test has failed. You can use the
    --test-threads option to limit how many tests run concurrently, which is helpful
    if you have a test that hangs or segfaults and you want to figure out which one
    it is by running the tests sequentially. There’s also a --skip option for skipping
    tests that match a certain pattern, --ignored to run tests that would normally
    be ignored (such as those that require an external program to be running), and
    --list to just list all the available tests.


    Keep in mind that these arguments are all implemented by the default test harness,
    so if you disable it (with harness = false), you’ll have to implement the ones
    you need yourself in your main function!


    Integration tests without a harness are primarily useful for benchmarks, as we’ll
    see later, but they also come in handy when you want to run tests that don’t fit
    the standard “one function, one test” model. For example, you’ll frequently see
    harnessless tests used with fuzzers, model checkers, and tests that require a
    custom global setup (like under WebAssembly or when working with custom targets).'
  - '[PAGE 91]


    # #[cfg(test)]


    When Rust builds code for testing, it sets the compiler configuration flag test,
    which you can then use with conditional compilation to have code that is compiled
    out unless it is specifically being tested. On the surface, this may seem odd:
    don’t you want to test exactly the same code that’s going into production? You
    do, but having code exclusively available when testing allows you to write better,
    more thorough tests, in a few ways.


    # MOCKING


    When writing tests, you often want tight control over the code you’re testing
    as well as any other types that your code may interact with. For example, if you
    are testing a network client, you probably do not want to run your unit tests
    over a real network but instead want to directly control what bytes are emitted
    by the “network” and when. Or, if you’re testing a data structure, you want your
    test to use types that allow you to control what each method returns on each invocation.
    You may also want to gather metrics such as how often a given method was called
    or whether a given byte sequence was emitted.


    These “fake” types and implementations are known as mocks, and they are a key
    feature of any extensive unit test suite. While you can often do the work needed
    to get this kind of control manually, it’s nicer to have a library take care of
    most of the nitty-gritty details for you. This is where automated mocking comes
    into play. A mocking library will have facilities for generating types (including
    functions) with particular properties or signatures, as well as mechanisms to
    control and introspect those generated items during a test execution.


    Mocking in Rust generally happens through generics—as long as your program, data
    structure, framework, or tool is generic over anything you might want to mock
    (or takes a trait object), you can use a mocking library to generate conforming
    types that will instantiate those generic parameters. You then write your unit
    tests by instantiating your generic constructs with the generated mock types,
    and you’re off to the races!


    In situations where generics are inconvenient or inappropriate, such as if you
    want to avoid making a particular aspect of your type generic to users, you can
    instead encapsulate the state and behavior you want to mock in a dedicated struct.
    You would then generate a mocked version of that struct and its methods and use
    conditional compilation to use either the real or mocked implementation depending
    on cfg(test) or a test-only feature like cfg(feature = "test_mock_foo").


    At the moment, there isn’t a single mocking library, or even a single mocking
    approach, that has emerged as the One True Answer in the Rust community. The most
    extensive and thorough mocking library I know of is the mockall crate, but that
    is still under active development, and there are many other contenders.'

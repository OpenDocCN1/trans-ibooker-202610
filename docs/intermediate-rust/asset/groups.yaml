  - '[PAGE 121]


    start this chapter by taking a quick journey through what motivates asynchronous
    programming as a concept in the first place; then we’ll dig into how asynchrony
    in Rust actually works under the hood.


    # What’s the Deal with Asynchrony?


    Before we get to the details of the synchronous and asynchronous programming models,
    we first need to take a quick look at what your computer is actually doing when
    it runs your programs.


    Computers are fast. Really fast. So fast, in fact, that they spend most of their
    time waiting for things to happen. Unless you’re decompressing files, encoding
    audio, or crunching numbers, chances are that your CPU spends most of its time
    sitting idle, waiting for operations to complete. It’s waiting for a network packet
    to arrive, for the mouse to move, for the disk to finish writing some bytes, or
    maybe even just for a read from main memory to complete. From the CPU’s perspective,
    eons go by between most such events. When one does occur, the CPU runs a few more
    instructions, then goes back to waiting again. Take a look at your CPU utilization—it’s
    probably somewhere in the low single digits, and that’s likely where it hovers
    the majority of the time.


    # Synchronous Interfaces


    Synchronous interfaces only allow your program (or rather, a single thread in
    your program) to execute a single operation at a time; each operation has to wait
    for the previous synchronous operation to finish before it gets to run. Most interfaces
    you see in the wild are synchronous: you call them, they go do some stuff, and
    eventually they return when the operation has completed and your program can continue
    from there. The reason for this, as we’ll see later in this chapter, is that making
    an operation asynchronous takes a fair bit of extra machinery. Unless you need
    the benefits of asynchrony, sticking to the synchronous model requires much less
    pomp and circumstance.


    Synchronous interfaces hide all this waiting; the application calls a function
    that says “write these bytes to this file,” and some time later, that function
    completes and the next line of code executes. Behind the scenes, what really happens
    is that the operating system queues up a write operation to the disk, and then
    puts the application to sleep until the disk reports that it has finished the
    write. The application experiences this as the function taking a long time to
    execute, but in reality it isn’t really executing at all, just waiting.


    An interface that performs operations sequentially in this way is also often referred
    to as blocking, since the operation in the interface that has to wait for some
    external event to happen in order for it to make progress blocks further execution
    until that event happens. Whether you refer to an interface as synchronous or
    blocking, the basic idea is the same: the application does not move on until the
    current operation finishes. While the operation is waiting, so is the application.


    Synchronous interfaces are usually considered to be easy to work with and simple
    to reason about, since your code just executes one line at a time.'

    requirements are restrictions on how the code can be used, while the promises
    are guarantees about how the code can be used. When designing a new interface,
    you want to think carefully about this contract. A good rule of thumb is to avoid
    imposing unnecessary restrictions and to only make promises you can keep. Adding
    restrictions or removing promises usually requires a major semantic version change
    and is likely to break code elsewhere. Relaxing restrictions or giving additional
    promises, on the other hand, is usually backward compatible.


    In Rust, restrictions usually come in the form of trait bounds and argument types,
    and promises come in the form of trait implementations and return types. For example,
    compare the three function signatures in Listing 4-1.


    ```

    fn frobnicate1(s: String) -> String

    fn frobnicate2(s: &str) -> Cow<''_, str>

    fn frobnicate3(s: impl AsRef<str>) -> impl AsRef<str>

    ```


    Listing 4-1: Similar function signatures with different contracts


    These three function signatures all take a string and return a string, but they
    do so under very different contracts.


    The first function requires the caller to own the string in the form of the String
    type, and it promises that it will return an owned String. Since the contract
    requires the caller to allocate and requires us to return an owned String, we
    cannot later make this function allocation-free in a backward compatible way.


    The second function relaxes the contract: the caller can provide any reference
    to a string, so the user no longer needs to allocate or give up ownership of a
    String. It also promises to give back a `std::borrow::Cow`, meaning it can return
    either a string reference or an owned String, depending on whether it needs to
    own the string. The promise here is that the function will always return a `Cow`,
    which means that we cannot, say, change it to use some other optimized string
    representation later. The caller must also specifically provide a `&str`, so if
    they have, say, a pre-existing String of their own, they must dereference it to
    a `&str` to call our function.


    The third function lifts these restrictions. It requires only that the user pass
    in a type that can produce a reference to a string, and it promises only that
    the return value can produce a reference to a string.


    None of these function signatures is better than the others. If you need ownership
    of a string in the function, you can use the first argument type to avoid an extra
    string copy. If you want to allow the caller to take advantage of the case where
    an owned string was allocated and returned, the second function with a return
    type of `Cow` may be a good choice. Instead, what I want you to take away from
    this is that you should think carefully about what contract your interface binds
    you to, because changing it after the fact can be disruptive.


    In the remainder of this section I give examples of interface design decisions
    that often come up, and their implications for your interface contract.


    ## Generic Arguments


    One obvious requirement your interface must place on users is what types they
    must provide to your code. If your function explicitly takes a Foo, the user must
    own and give you a Foo. There is no way around it. In most cases it pays off to
    use generics rather than concrete types, to allow the caller to pass any type
    that conforms to what your function actually needs, rather than only a particular
    type. Changing `&str` in Listing 4-1 to `impl AsRef<str>` is an example of this
    kind of relaxing. One way to go about relaxing requirements this way is to start
    with the argument fully generic with no bounds, and then just follow the compiler
    errors to discover what bounds you need to add.


    However, if taken to the extreme, this approach would make every argument to every
    function its own generic type, which would be both hard to read and hard to understand.
    There are no hard-and-fast rules for exactly when you should or should not make
    a given parameter generic, so use your best judgment. A good rule of thumb is
    to make an argument generic if you can think of other types a user might reasonably
    and frequently want to use instead of the concrete type you started with.


    You may remember from Chapter 3 that generic code is duplicated for every combination
    of types ever used with the generic code through monomorphization. With that in
    mind, the idea of making lots of arguments generic might make you worried about
    overly enlarging your binaries. In Chapter 3 we also discussed how you can use
    dynamic dispatch to mitigate this at a (usually) negligible performance cost,
    and that applies here too.


    For arguments that you take by reference anyway (recall that `dyn Trait` is not
    Sized, and that you need a fat pointer to use them), you can easily replace your
    generic argument with one that uses dynamic dispatch. For instance, instead of
    `impl AsRef<str>`, you could take `&dyn AsRef<str>`.


    Before you go running to do that, though, there are a few things you should consider.
    First, you are making this choice on behalf of your users, who cannot opt out
    of dynamic dispatch. If you know that the code you''re applying dynamic dispatch
    to will never be performance-sensitive, that may be fine. But if a user comes
    along who wants to use your library in their high-performance application, dynamic
    dispatch in a function that is called in a hot loop may be a deal breaker. Second,
    at the time of writing, using dynamic dispatch will work only when you have a
    simple trait bound like `T: AsRef<str>` or `impl AsRef<str>`. For more complex
    bounds, Rust does not know how to construct a dynamic dispatch vtable, so you
    cannot take, say, `&dyn Hash + Eq`. And finally, remember that with generics,
    the caller can always choose dynamic dispatch themselves by passing in a trait
    object. The reverse is not true: if you take a trait object, that is what the
    caller must provide.



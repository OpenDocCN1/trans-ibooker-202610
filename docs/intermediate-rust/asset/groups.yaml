    # Generic Lifetimes


    Occasionally you need to store references within your own types. Those references
    need to have a lifetime so that the borrow checker can check their validity when
    they are used in the various methods on that type. This is especially true if
    you want a method on your type to return a reference that outlives the reference
    to self.


    Rust allows you to make a type definition generic over one or more lifetimes,
    just like it allows you to make it generic over types. The Rust Programming Language
    by Steve Klabnik and Carol Nichols (No Starch Press, 2018) covers this topic in
    some detail, so I won’t reiterate the basics here. But as you write more complex
    types of this nature, there are two subtleties around the interaction between
    such types and lifetimes that you should be aware of.


    First, if your type also implements Drop, then dropping your type counts as a
    use of any lifetime or type your type is generic over. Essentially, when an instance
    of your type is dropped, the borrow checker will check that it’s still legal to
    use any of your type’s generic lifetimes before dropping it. This is necessary
    in case your drop code does use any of those references. If your type does not
    implement Drop, dropping the type does not count as a use, and users are free
    to invalidate any references stored in your type as long as they do not use it
    any more, like we saw in Listing 2-7. We’ll talk more about these rules around
    dropping in Chapter 10.


    Second, while a type can be generic over multiple lifetimes, making it so often
    only serves to unnecessarily complicate your type signature. Usually, a type being
    generic over a single lifetime is fine, and the compiler will use the shorter
    of the lifetimes for any references inserted into your type as that one lifetime.

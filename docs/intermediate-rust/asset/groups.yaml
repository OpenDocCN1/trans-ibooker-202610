    \ `#[test]` 所做的那样），或者修改结构体的字段。\n\n## 派生宏\n\n派生宏与另外两种略有不同，因为它是对宏目标进行添加，而不是替换。尽管这一限制可能看起来有些严格，但派生宏正是过程宏创建初期的主要推动因素之一。具体来说，著名的\

    \ the bits make sense, so please bear with me.\n\nFirst, you’ll notice that `Pin`\
    \ holds a *pointer type*. That is, rather than hold some `T` directly, it holds\
    \ a type `P` that dereferences through `Deref` into `T`. This means that rather\
    \ than have a `Pin<MyType>`, you’ll have a `Pin<Box<MyType>>`, `Pin<Rc<MyType>>`,\
    \ or `Pin<&mut T>`. The reason for this design is simple—`Pin`’s primary goal\
    \ is to make sure that once you place a `T` behind a `Pin`, that `T` won’t move,\
    \ as doing so might invalidate self-references stored in the `T`. If the `Pin`\
    \ just held a `T` directly, then simply moving the `Pin` would be enough to invalidate\
    \ that invariant! In the remainder of this section, I’ll refer to `P` as the *pointer*\
    \ type and `T` as the *target* type.\n\nNext, notice that `Pin`’s constructor,\
    \ `new_unchecked`, is unsafe. This is because the compiler has no way to actually\
    \ check that the pointer type indeed promises that the pointed-to (target) type\
    \ won’t move again. Consider, for example, a variable `foo` on the stack. If `Pin`’s\
    \ constructor were safe, we could do `Pin::new(&mut foo)`, call a method that\
    \ requires `Pin<&mut Self>` (and thus assumes that `Self` won’t move again), and\
    \ then drop the `Pin`. At this point, we could modify `foo` as much as we liked,\
    \ since it is no longer borrowed—including moving it! We could then pin it again\
    \ and call the same method, which would be none the wiser that any self-referential\
    \ pointers it may have constructed the first time around would now be invalid.\n\

    it is twice the size of a usize (the size of a word on the target platform): one
    usize for holding the pointer, and one usize for holding the extra information
    needed to “complete” the type.


    > NOTE Box and Arc also support storing fat pointers, which is why they both support
    T: ?Sized.


    # Traits and Trait Bounds


    Traits are a key piece of Rust’s type system—they are the glue that allows types
    to interoperate even though they don’t know about each other at the time they
    are defined. The Rust Programming Language does a great job of covering how to
    define and use traits, so I won’t go over that here. Instead, we’re going to take
    a look at some of the more technical aspects of traits: how they’re implemented,
    restrictions you have to adhere to, and some more esoteric uses of traits.



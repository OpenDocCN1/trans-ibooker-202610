    Programmers coming from C-based languages may be used to the unholy land of C
    and C++ where you can use #define to change each true to false, or to remove all
    occurrences of the else keyword. If that’s the case for you, you’ll need to disassociate
    macros from a feeling of doing something “bad.” Macros in Rust are far from the
    Wild West of C macros. They follow (mostly) well-defined rules, and are fairly
    misuse-resistant.


    # Declarative Macros


    Declarative macros are those defined using the macro_rules! syntax, which lets
    you conveniently define function-like macros without having to resort to writing
    a dedicated crate for the purpose (as you do with procedural macros). Once you’ve
    defined a declarative macro, you can invoke it using the name of the macro followed
    by an exclamation mark. I like to think of this kind of macro as a sort of compiler-assisted
    search and replace: it does the job for many regular, well-structured transformation
    tasks, and for eliminating repetitive boilerplate. In your experience with Rust
    up until this point, most of the macros you have recognized as macros are likely
    to have been declarative macros. Note, however, that not all function-like macros
    are declarative macros; macro_rules! itself is one example of this, and format_args!
    is another. The ! suffix merely indicates to the compiler that the macro invocation
    will be replaced with different source code at compile time.


    > NOTE

    > Since Rust’s parser specifically recognizes and parses macro invocations annotated
    with !, you can only use them in places where the parser allows them. They work
    in most places you’d expect, like in expression position or in an impl block,
    but not everywhere. For example, you cannot (at the time of writing) invoke a
    function-like macro where an identifier or match arm is expected.


    It may not be immediately obvious why declarative macros are called declarative.
    After all, don’t you “declare” everything in your program? In this context, declarative
    refers to the fact that you don’t say how the macro’s inputs should be translated
    into the output, just that you want the output to look like A when the input is
    B. You declare that it shall be so, and the compiler figures out all the parsing
    rewiring that has to happen to make your declaration reality. This makes declarative
    macros concise and expressive, though it also has a tendency to make them rather
    cryptic since you have a limited language to express your declarations in.


    # When to Use Them


    Declarative macros are primarily useful when you find yourself writing the same
    code over and over, and you’d like to, well, not do that. They’re best suited
    for fairly mechanical replacements—if you’re aiming to do fancy code transformations
    or lots of code generation, procedural macros are likely a better fit.


    I most frequently make use of declarative macros in cases where I find myself
    writing repetitive and structurally similar code, such as in tests and'

    \nVariance is a concept that programmers are often exposed to but rarely know\
    \ the name of because it’s mostly invisible. At a glance, variance describes what\
    \ types are subtypes of other types and when a subtype can be used in place of\
    \ a supertype (and vice versa). Broadly speaking, a type A is a subtype of another\
    \ type B if A is at least as useful as B. Variance is the reason why, in Java,\
    \ you can pass a Turtle to a function that accepts an Animal if Turtle is a subtype\
    \ of Animal, or why, in Rust, you can pass a &'static str to a function that accepts\
    \ a &'a str.\n\nWhile variance usually hides out of sight, it comes up often enough\
    \ that we need to have a working knowledge of it. Turtle is a subtype of Animal\
    \ because a Turtle is more “useful” than some unspecified Animal—a Turtle can\
    \ do anything an Animal can do, and likely more. Similarly, 'static is a subtype\
    \ of 'a because a 'static lives at least as long as any 'a and so is more useful.\
    \ Or, more generally, if 'b: 'a ('b outlives 'a), then 'b is a subtype of 'a.\
    \ This is obviously not the formal definition, but it gets close enough to be\
    \ of practical use.\n\nAll types have a variance, which defines what other similar\
    \ types can be used in that type’s place. There are three kinds of variance: covariant,"

    \ 7-6 显示了如何使用 `compile_fail` 检查给定类型是否未实现 `Send`，这可能对于在不安全代码中维护安全保证是必要的。\n\n```compile_fail\n\
    # struct MyNonSendType(std::rc::Rc<()>);\nfn is_send<T: Send>() {}\nis_send::<MyNonSendType>();\n\

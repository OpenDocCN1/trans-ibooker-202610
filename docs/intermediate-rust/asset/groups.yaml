    # ASYNCHRONOUS PROGRAMMING


    ![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_120_0.png)


    Asynchronous programming is, as the name implies, programming that is not synchronous.
    At a high level, an asynchronous operation executes in the background—the program
    won’t wait for the asynchronous operation to complete, but will instead continue

    \ hygienic, and perhaps that being hygienic makes them safer or nicer to work\
    \ with, without necessarily understanding what that means. When we say Rust macros\
    \ are hygienic, we mean that a declarative macro (generally) cannot affect variables\
    \ that aren’t explicitly passed to it. A trivial example is that if you declare\
    \ a variable with the name foo, and then call a macro that also defines a variable\

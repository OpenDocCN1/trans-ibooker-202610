    \n### 对齐\n\n在我们讨论类型的内存表示如何确定之前，我们首先需要讨论对齐的概念，它决定了类型的字节可以存储在哪里。一旦类型的表示被确定，你可能会认为你可以取任意的内存位置，并将存储在那里的字节解释为该类型。虽然这在理论上是正确的，但在实践中，硬件也限制了给定类型的放置位置。最明显的例子是指针指向字节，而不是位。如果你将类型\

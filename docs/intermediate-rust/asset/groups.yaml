  - "[PAGE 32]\n\n*coherence* property: for any given type and method, there is only\
    \ ever one correct choice for which implementation of the method to use for that\
    \ type. To see why this is important, consider what would happen if I could write\
    \ my own implementation of the `Display` trait for the `bool` type from the standard\
    \ library. Now, for any code that tries to print a bool value and includes my\
    \ crate, the compiler won’t know whether to pick the implementation I wrote or\
    \ the one from the standard library. Neither choice is correct or better than\
    \ the other, and the compiler obviously cannot choose randomly. The same issue\
    \ occurs if the standard library is not involved at all, but we instead have two\
    \ crates that depend on each other, and they both implement a trait for some shared\
    \ type. The coherence property ensures that the compiler never ends up in these\
    \ situations and never has to make these choices: there will always be exactly\
    \ one obvious choice.\n\nA facile way to uphold coherence would be to ensure only\
    \ the crate that defines a trait can write implementations for that trait; if\
    \ no one else can implement the trait, then there can be no conflicting implementations\
    \ elsewhere. However, this is too restrictive in practice and would essentially\
    \ make traits useless, as there would be no way to implement traits like `std::fmt::Debug`\
    \ and `serde::Serialize` for your own types, unless you got your own type included\
    \ into the defining crate. The opposite extreme, saying that you can implement\
    \ traits for only your own types, solves that problem but introduces another:\
    \ a crate that defines a trait now cannot provide implementations of that trait\
    \ for types in the standard library or in other popular crates! Ideally, we would\
    \ like to find some set of rules that balances the desire for downstream crates\
    \ to implement upstream traits for their own types against the desire for upstream\
    \ crates to be able to add implementations of their own traits without breaking\
    \ downstream code.\n\n> **NOTE**\n> \n> *Upstream refers to something your code\
    \ depends on, and downstream refers to something that depends on your code. Often,\
    \ these terms are used in the direct sense of crate dependencies, but they can\
    \ also be used to refer to authoritative forks of a codebase—if you do a fork\
    \ of the Rust compiler, the official Rust compiler is your “upstream.”*\n\nIn\
    \ Rust, the rule that establishes that balance is the *orphan rule*. Simply stated,\
    \ the orphan rule says that you can implement a trait for a type only if the trait\
    \ *or* the type is local to your crate. So, you can implement `Debug` for your\
    \ own type, and you can implement `MyNeatTrait` for `bool`, but you cannot implement\
    \ `Debug` for `bool`. If you try, your code will not compile, and the compiler\
    \ will tell you that there are conflicting implementations.\n\nThis gets you pretty\
    \ far; it allows you to implement your own traits for third-party types and to\
    \ implement third-party traits for your own types. However, the orphan rule is\
    \ not the end of the story. There are a number of additional implications, caveats,\
    \ and exceptions to it that you should be aware of."
  - '[PAGE 33]


    # Blanket Implementations


    The orphan rule allows you to implement traits over a range of types with code
    like `impl<T> MyTrait for T where T: ...` and so on. This is a *blanket implementation*—it
    is not limited to just one particular type but instead applies to a wide range
    of types. Only the crate that defines a trait is allowed to write a blanket implementation,
    and adding a blanket implementation to an existing trait is considered a breaking
    change. If it were not, a downstream crate that contained `impl MyTrait for Foo`
    could suddenly stop compiling just because you update the crate that defines `MyTrait`
    with an error about a conflicting implementation.


    # Fundamental Types


    Some types are so essential that it’s necessary to allow anyone to implement traits
    on them, even if this seemingly violates the orphan rule. These types are marked
    with the `#[fundamental]` attribute and currently include `&`, `&mut`, and `Box`.
    For the purposes of the orphan rule, fundamental types may as well not exist—they
    are effectively erased before the orphan rule is checked in order to allow you
    to, for example, implement `IntoIterator` for `&MyType`. With just the orphan
    rule, this implementation would not be permitted since it implements a foreign
    trait for a foreign type—`IntoIterator` and `&` both come from the standard library.
    Adding a blanket implementation over a fundamental type is also considered a breaking
    change.


    # Covered Implementations


    There are some limited cases where we want to allow implementing a foreign trait
    for a foreign type, which the orphan rule does not normally allow. The simplest
    example of this is when you want to write something like `impl From<MyType> for
    Vec<i32>`. Here, the `From` trait is foreign, as is the `Vec` type, yet there
    is no danger of violating coherence. This is because a conflicting implementation
    could be added only through a blanket implementation in the standard library (the
    standard library cannot otherwise name `MyType`), which is a breaking change anyway.


    To allow these kinds of implementations, the orphan rule includes a narrow exemption
    that permits implementing foreign traits for foreign types under a very specific

  mdcn: "\n\n通过将要钉在栈上的变量名作为参数，宏确保调用者已经在栈上的某个位置拥有想要钉住的值。`$var` 的遮蔽确保调用者无法丢弃 `Pin` 后继续使用未钉住的值（这对于任何\
    \ `!Unpin` 的目标类型都会破坏 `Pin` 契约）。通过移动 `$var` 中存储的值，宏还确保调用者无法在不丢弃原始变量的情况下丢弃宏声明的 `$var`\
    \ 绑定。具体来说，如果没有那一行，调用者可以写（注意额外的作用域）：\n\n```rust\nlet foo = /* */; { pin_mut!(foo);\
    \ foo.poll() }; foo.mut_self_method();\n```\n\n在这里，我们向 `poll` 提供了 `foo` 的钉住实例，但随后我们又在没有\
    \ `Pin` 的情况下使用 `foo` 的 `&mut`，这违反了 `Pin` 契约。另一方面，有了额外的重新赋值，这段代码也会将 `foo` 移动到新的作用域中，使其在作用域结束后再也无法使用。\n\
    \n因此，栈上钉住需要不安全代码，不像 `Box::pin`，但避免了 `Box` 引入的额外分配，并且在 `no_std` 环境中也能工作。\n\n##\
    \ 回到未来\n\n我们现在有了钉住的 future，并且我们知道这意味着什么。但你可能已经注意到，大多数使用 `async` 和 `await` 编写的异步代码中都没有出现这些重要的钉住操作。而这是因为编译器把它隐藏起来了。\n\
    \n还记得我们讨论清单 9-5 时，我告诉你 `<expr>.await` 会反糖化成类似这样的代码吗：\n\n```rust\nloop {\n    if\
    \ let Poll::Ready(r) = expr.poll() {\n        break r\n    } else {\n        yield\n\
    \    }\n}\n```\n\n那是一个稍微简化的说法，因为正如我们所见，只有在你拥有 future 的 `Pin<&mut Self>` 时才能调用\
    \ `Future::poll`。反糖化实际上更复杂一些，如清单 9-12 所示。\n\n```rust\n① match expr {\n    mut\
    \ pinned => loop {\n        ② match unsafe { Pin::new_unchecked(&mut pinned) }.poll()\
    \ {\n            Poll::Ready(r) => break r,\n            Poll::Pending => yield,\n\
    \        }\n    }\n}\n```\n\n清单 9-12：`<expr>.await` 更准确的反糖化\n\n`match` ① 是一个巧妙的简写，确保展开后仍然是一个有效表达式，同时将表达式结果移动到一个我们可以随后在栈上钉住的变量中。除此之外，主要的新增部分是对\
    \ `Pin::new_unchecked` ② 的调用。该调用是安全的，因为要对包含的 async 块进行轮询，它必须已经因 `Future::poll`\
    \ 的签名而被钉住。而我们正是由于对 async 块进行了轮询才到达了对 `Pin::new_unchecked` 的调用，因此生成器状态是被钉住的。由于\
    \ `pinned` 存储在对应 async 块的生成器中（它必须是这样才能使 `yield` 正确恢复），我们知道 `pinned` 不会再移动。\n\n\
    此外，一旦进入循环，`pinned` 只能通过 `Pin` 访问，因此没有任何代码能够从 `pinned` 中的值中移出。我们满足了 `Pin::new_unchecked`\
    \ 的所有安全要求，代码是安全的。\n\n## 去睡觉\n\n我们对 `Pin` 深入到了细节中，但现在走出来后，关于 futures 的另一个问题可能会让你感到困惑。如果对\
    \ `Future::poll` 的调用返回 `Poll::Pending`，你需要有东西在稍后时间再次调用 `poll` 来检查是否可以取得进展。这个东西通常被称为\
    \ executor。你的 executor 可以是一个简单的循环，不断轮询你正在等待的所有 futures，直到它们都返回 `Poll::Ready`，但这会浪费大量本可用于更有用事情的\
    \ CPU 周期，比如运行你的网页浏览器。相反，我们希望 executor 做它能做的任何有用工作，然后去睡觉。它应该保持睡眠，直到其中一个 future\
    \ 可以取得进展，然后才醒来再做一次遍历，然后再次去睡觉。\n\n## 醒来\n\n决定何时重新检查某个 future 的条件差异很大。它可能是“当网络数据包到达此端口时”、“当鼠标光标移动时”、“当有人向此通道发送时”、“当\
    \ CPU 收到特定中断时”，甚至是“在经过这段时间后”。除此之外，开发者可以编写自己的 future 来包装多个其他 futures，因此可能有多个唤醒条件。某些\
    \ futures 甚至可能引入自己完全自定义的唤醒事件。\n\n为了适应这些众多用例，Rust 引入了 `Waker` 的概念：一种唤醒 executor\
    \ 以发出可以取得进展的信号的方式。`Waker` 是使 futures 周围整个机制工作的关键。executor 构造一个与 executor 用于睡觉的机制集成的\
    \ `Waker`，并在轮询任何 `Future` 时将其传入。怎么做？通过我到目前为止一直对你隐瞒的 `Future::poll` 的额外参数。抱歉。清单\
    \ 9-13 给出了 `Future` 的最终真实定义——不再有谎言了！\n\n```rust\ntrait Future {\n    type Output;\n\
    \    fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output>;\n\
    }\n```\n\n清单 9-13：带有 `Context` 的实际 `Future` trait\n\n`&mut` `Context` 包含 `Waker`。参数是\
    \ `Context` 而不是直接的 `Waker`，这样我们就可以在必要时为 futures 增加额外的上下文。\n\n`Waker` 的主要方法是 `wake`（以及按引用变体\
    \ `wake_by_ref`）。`wake` 方法不接受参数，其效果完全由构造该 `Waker` 的 executor 定义。你看，`Waker` 实际上是关于\
    \ executor 的泛型。或者更准确地说，构造 `Waker` 的东西可以决定在调用 `Waker::wake` 时发生什么，在克隆 `Waker` 时发生什么，以及在丢弃\
    \ `Waker` 时发生什么。所有这些都通过手动实现的 vtable 实现，其功能类似于我们在第 3 章很久以前讨论的动态分发。\n\n构造 `Waker`\
    \ 是一个相当复杂的过程，其机制对于使用它来说并不是那么重要，但你可以在标准库中的 `RawWakerVTable` 类型中看到构建块。它有一个构造函数，接受\
    \ `wake` 和 `wake_by_ref` 的函数指针，以及 `Clone` 和 `Drop`。`RawWakerVTable` 通常在 executor\
    \ 的所有 wakers 之间共享，与一个旨在保存每个 `Waker` 实例特定数据（比如它属于哪个 future）的原始指针捆绑在一起，并被转换为 `RawWaker`。然后它被传递给\
    \ `Waker::from_raw` 以生成一个安全的 `Waker`，可以传递给 `Future::poll`。\n\n## Poll 契约\n\n到目前为止，我们一直回避\
    \ future 实际上如何使用 `Waker`。这个想法相当简单：如果 `Future::poll` 返回 `Poll::Pending`，那么它是 future\
    \ 的责任确保 *某物* 在 future 下次能够取得进展时调用提供的 `Waker` 上的 `wake`。大多数 futures 通过仅在其他 future\
    \ 也返回 `Poll::Pending` 时才返回 `Poll::Pending` 来维护此属性；以这种方式它可以轻易满足 `poll` 的契约，因为内部\
    \ future 必须遵循相同的契约。但不能无止境地向下有乌龟。最终，你会遇到一个不轮询其他 futures 的 future，而是做类似写入网络套接字或尝试从通道接收之类的操作。这些通常被称为\
    \ *叶子 future*，因为它们没有子 future。叶子 future 没有内部 future，而是直接表示某个可能尚未准备好返回结果的资源。\n\n\
    叶子 future 通常有两种形状：等待来自同一进程内事件的（如通道接收器），以及等待来自进程外部事件的（如 TCP 数据包接收）。等待内部事件的那些通常遵循相同的模式：将\
    \ `Waker` 存储在唤醒你的代码可以找到它的地方，并让该代码在生成相关事件时调用 `wake`。例如，考虑一个必须等待内存通道上消息的叶子 future。它将\
    \ `Waker` 存储在发送者和接收者之间共享的通道部分中，然后返回 `Poll::Pending`。当发送者稍后到来并向通道注入消息时，它会注意到等待接收者留下的\
    \ `Waker` 并在 `Waker` 上调用 `wake`\n\n"

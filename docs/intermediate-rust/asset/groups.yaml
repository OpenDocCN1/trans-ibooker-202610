    Here, there are four distinct values: 42 (an `i32`), 43 (an `i32`), the address
    of x (a pointer), and the address of y (a pointer). There are also four variables:
    x, y, var1, and var2. The latter two variables both hold values of the pointer
    type, because references are pointers. While var1 and var2 store the same value
    initially, they store separate, independent copies of that value; when we change
    the value stored in var2, the value in var1 does not change. In particular, the
    `=` operator stores the value of the right-hand side expression in the place named
    by the left-hand side.


    An interesting example of where the distinction between variables, values, and
    pointers becomes important is in a statement such as:


    ```

    ```rust

    let string = "Hello world";

    ```

    ```


    Even though we assign a string value to the variable string, the *actual* value
    of the variable is a pointer to the first character in the string value "Hello
    world", and not the string value itself. At this point you might say, “But hang
    on, where is the string value stored, then? Where does the pointer point?” If
    so, you have a keen eye—we’ll get to that in a second.


    # Variables in Depth


    The definition of a variable I gave earlier is broad and unlikely to be all that
    useful in and of itself. As you encounter more complex code, you’ll need a more
    accurate mental model to help you reason through what the programs are really
    doing. There are many such models that we can make use of. Describing them all
    in detail would take up several chapters and is beyond the scope of this book,
    but broadly speaking, they can be divided into two categories: high-level models
    and low-level models. High-level models are useful when thinking about code at
    the level of lifetimes and borrows, while low-level models are good for when you
    are reasoning about unsafe code and raw pointers. The models for variables described
    in the following two sections will suffice for most of the material in this book.


    # High-Level Model


    In the high-level model, we don’t think of variables as places that hold bytes.
    Instead, we think of them just as names given to values as they are instantiated,
    moved, and used throughout a program. When you assign a value to a variable, that
    value is from then on named by that variable. When a variable is later accessed,
    you can imagine drawing a line from the previous access of that variable to the
    new access, which establishes a dependency relationship between the two accesses.
    If the value in a variable is moved, no lines can be drawn from it anymore.


    In this model, a variable exists only so long as it holds a legal value; you cannot
    draw lines from a variable whose value is uninitialized or has been moved, so
    effectively it isn’t there. Using this model, your entire program'

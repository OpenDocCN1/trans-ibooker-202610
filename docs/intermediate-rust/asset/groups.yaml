    For all but the most trivial crates, I highly recommend keeping a changelog. There
    is little more frustrating than seeing that a dependency has received a major
    version bump and then having to dig through the Git logs to figure out what changed
    and how to update your code. I recommend that you do not just dump your Git logs
    into a file named changelog, but instead keep a manual changelog. It is much more
    likely to be useful.



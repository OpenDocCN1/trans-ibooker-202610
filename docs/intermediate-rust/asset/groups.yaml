    Rust 表示 `repr(Rust)` 去除了这一限制，同时去除了一些较小的限制，例如对于恰好具有相同字段的类型，字段顺序是确定的。也就是说，即使两个不同的类型共享完全相同的字段、类型相同、顺序相同，使用默认的
    Rust 布局时也不能保证它们的布局相同！


    由于我们现在可以重新排序字段，我们可以将它们按大小递减的顺序放置。这意味着我们不再需要在 `Foo` 的字段之间使用填充；字段本身用于实现必要的对齐！`Foo`

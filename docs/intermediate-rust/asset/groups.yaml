  mdcn: "\n\n## 编写声明式宏\n\n对声明式宏所支持的全部语法进行详尽解释超出了本书的范围。不过，我们将介绍基础知识，因为其中有一些值得指出的奇特之处。\n\
    \n声明式宏由两个主要部分组成：*匹配器*和*转录器*。一个给定的宏可以有多个匹配器，每个匹配器都有一个关联的转录器。当编译器发现一个宏调用时，它会从第一个匹配器到最后一个匹配器逐一检查；当它找到一个与调用中的令牌匹配的匹配器时，它就会遍历相应转录器的令牌来替换该调用。清单\
    \ 8-4 展示了声明式宏规则的不同部分是如何组合在一起的。\n\n```\nmacro_rules! /* macro name */ {\n  (/*\
    \ 1st matcher */) => { /* 1st transcriber */ };\n  (/* 2nd matcher */) => { /*\
    \ 2nd transcriber */ };\n}\n```\n\n*清单 8-4：声明式宏定义的组成部分*\n\n## 匹配器\n\n你可以把宏匹配器想象成一个令牌树，编译器会试图以预定义的方式对其进行扭曲和弯曲，以匹配调用点提供给它的输入令牌树。举个例子，考虑一个匹配器为\
    \ `$a:ident + $b:expr` 的宏。该匹配器可以匹配任意标识符（`:ident`）后跟一个加号，再后跟任意 Rust 表达式（`:expr`）。如果宏以\
    \ `x + 3 * 5` 被调用，编译器会发现，如果设置 `$a = x` 和 `$b = 3 * 5`，匹配器就能匹配成功。即使 `*` 从未出现在匹配器中，编译器也意识到\
    \ `3 * 5` 是一个有效表达式，因此可以与 `$b:expr` 匹配，后者接受任何表达式（即 `:expr` 部分）。\n\n匹配器可能会变得相当复杂，但它们拥有巨大的表达能力，很像正则表达式。举一个不那么复杂的例子，下面的匹配器接受一个序列（`$()`），该序列由逗号分隔（`,`）的一个或多个（`+`）键/值对组成，键/值对的格式为\
    \ `key => value`：\n\n```\n$(\\$key:expr => $value:expr),+\n```\n\n而且，关键在于，使用此匹配器调用宏的代码可以为键或值提供任意复杂的表达式——匹配器的魔力将确保键和值表达式被恰当地划分。\n\
    \n宏规则支持多种多样的*片段类型*；你已经见过用于标识符的 `:ident` 和用于表达式的 `:expr`，此外还有用于类型的 `:ty`，甚至还有用于任何单个令牌树的\
    \ `:tt`！你可以在 [Rust 语言参考书的第 3 章](https://doc.rust-lang.org/reference/macros-by-example.html)\
    \ 中找到片段类型的完整列表。这些，再加上重复匹配模式的机制（`$()`），使你能够匹配大多数简单的代码模式。然而，如果你发现用匹配器难以表达你想要的模式，那么你可以尝试使用过程宏，因为过程宏不需要遵循\
    \ `macro_rules!` 所要求的严格语法。我们稍后将在本章中更详细地介绍这些内容。\n\n## 转录器\n\n一旦编译器匹配了声明式宏的匹配器，它就会使用该匹配器关联的转录器生成代码。宏匹配器定义的变量称为元变量。编译器会将转录器中每个元变量的每次出现（如上一节示例中的\
    \ `$key`）替换为与匹配器该部分匹配的输入。如果匹配器中有重复（如那个示例中的 `$(),+`），你可以在转录器中使用相同的语法，它将对输入中的每个匹配重复一次，每次展开都会为该次迭代持有每个元变量的适当替换。例如，对于\
    \ `$key` 和 `$value` 匹配器，我们可以编写以下转录器，为每个匹配到的 `$key`/`$value` 对生成一次对某个 map 的 `insert`\
    \ 调用：\n\n```\n$(map.insert($key, $value;)+\n```\n\n注意，这里我们希望对每次重复使用分号，而不只是分隔重复，因此我们将分号放在重复括号内。你必须在转录器的每个重复中使用一个元变量，以便编译器知道要使用匹配器中的哪个重复（以防有多个重复）。\n\
    \n## 卫生性\n\n你可能听说过 Rust 宏是卫生的，也许认为卫生使它们更安全或更易于使用，但未必理解这意味着什么。当我们说 Rust 宏是卫生的，我们的意思是声明式宏（通常）不能影响未明确传递给它的变量。一个简单的例子是：如果你声明了一个名为\
    \ `foo` 的变量，然后调用一个也定义了名为 `foo` 的变量的宏，那么默认情况下，宏的 `foo` 在调用点（即宏被调用的地方）是不可见的。类似地，宏也不能访问在调用点定义的变量（甚至\
    \ `self` 也不行），除非它们被显式传入。\n\n在大多数情况下，你可以将宏标识符视为存在于自己的命名空间中，与它们展开成的代码的命名空间是分开的。例如，看看清单\
    \ 8-5 中的代码，其中有一个宏试图（但失败了）遮蔽调用点的一个变量。\n\n```\nmacro_rules! let_foo {\n    ($x:expr)\
    \ => {\n        let foo = $x;\n    }\n}\nlet foo = 1;\nlet_foo!(2);\n// expands\
    \ to let foo = 2;\nassert_eq!(foo, 1);\n```\n\n*清单 8-5：宏存在于它们自己的小宇宙中。大多数情况下如此。*\n\
    \n```rust\nlet mut x = 1;\nplease_set!(x, x + 1);\nassert_eq!(x, 2);\n```\n\n\
    *清单 8-6：让宏访问调用点的标识符*\n\n我们本可以在宏中使用 `$i + 1`，但不能使用 `x + 1`，因为名字 `x` 在宏的定义作用域中不可用。\n\
    \n关于声明式宏和作用域，还有最后一点要注意：与 Rust 中几乎所有其他内容不同，声明式宏只有在声明之后才存在于源代码中。如果你试图使用文件中靠后定义的宏，那将行不通！这适用于整个项目；如果你在一个模块中声明了一个宏，并想在另一个模块中使用它，那么声明宏的模块必须在\
    \ crate 中较早出现，而不是较晚。反过来，如果 `foo` 和 `bar` 是 crate 根部的模块，而 `foo` 声明了一个 `bar` 想要使用的宏，那么\
    \ `mod foo` 必须出现在 *lib.rs* 中的 `mod bar` 之前！\n\n> **注意**  \n> *对于这种奇特的宏作用域（正式名称为文本作用域），有一个例外：如果你用\
    \ `#[macro_export]` 标记宏。该注解实际上会将宏提升到 crate 的根，并将其标记为 pub，因此它可以在你的 crate 中的任何地方或由你的\
    \ crate 的依赖者使用。*\n\n## 过程宏\n\n你可以把过程宏看作是解析器和代码生成的组合，而你在其中编写胶水代码。在高层面上，使用过程宏时，编译器会收集输入宏的令牌序列，并运行你的程序来确定应该用哪些令牌来替换它们。\n\
    \n过程宏之所以被称为“过程”宏，是因为你定义的是给定一些输入令牌后*如何*生成代码，而不仅仅是写出生成什么代码。编译器这一侧涉及的智能很少——就编译器而言，过程宏或多或少是一个可以执行任意代码替换的源代码预处理器。你的输入必须能被解析为\
    \ Rust 令牌流这一要求仍然存在，但也仅此而已！\n\n## 过程宏的类型\n\n过程宏有三种不同的风格，每种都专门针对一个特定的常见用例：\n\n-\
    \   函数式宏，类似于 `macro_rules!` 生成的宏\n-   派生宏，如 `#[derive(Serialize)]`\n-   属性宏，如\
    \ `#[test]`\n\n这三种类型都使用相同的基本机制：编译器向你的宏提供一个令牌序列，并期望你产生\n\n一个（可能）与输入树相关的令牌序列作为回报。然而，它们在宏的调用方式以及输出的处理方式上有所不同。接下来我们将逐一简要介绍。\n\
    \n## 函数式宏\n\n函数式宏是过程宏中最简单的形式。与声明式宏类似，它只是用过程宏返回的代码替换调用点的宏代码。然而，与声明式宏不同，所有的护栏都已移除：这些宏（像所有过程宏一样）不要求是卫生的，也不会保护你不与调用点周围代码中的标识符产生交互。相反，你的宏需要明确说明哪些标识符应与周围代码重叠（使用\

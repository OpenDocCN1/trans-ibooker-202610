    at https://keepachangelog.com/.


    # Unreleased Versions


    Rust considers version numbers even when the source of a dependency is a directory
    or a Git repository. This means that semantic versioning is important even when
    you have not yet published a release to crates.io; it matters what version is
    listed in your Cargo.toml between releases. The semantic versioning standard does
    not dictate how to handle this case, but I''ll provide a workflow that works decently
    well without being too onerous.


    After you''ve published a release, immediately update the version number in your
    Cargo.toml to the next patch version with a suffix like -alpha.1. If you just
    released 2.0.3, make the new version 2.0.4-alpha.1. If you just released an alpha,
    increment the alpha number instead.



  - "[PAGE 109]\n\n# Writing Declarative Macros\n\nAn exhaustive explanation of all\
    \ the syntax that declarative macros supports is outside the scope of this book.\
    \ However, we’ll cover the basics as there are some oddities that are worth pointing\
    \ out.\n\nDeclarative macros consist of two main parts: *matchers* and *transcribers*.\
    \ A given macro can have many matchers, and each matcher has an associated transcriber.\
    \ When the compiler finds a macro invocation, it walks the macro’s matchers from\
    \ first to last, and when it finds a matcher that matches the tokens in the invocation,\
    \ it substitutes the invocation by walking the tokens of the corresponding transcriber.\
    \ Listing 8-4 shows how the different parts of a declarative macro rule fit together.\n\
    \n```\nmacro_rules! /* macro name */ {\n  (/* 1st matcher */) => { /* 1st transcriber\
    \ */ };\n  (/* 2nd matcher */) => { /* 2nd transcriber */ };\n}\n```\n\n*Listing\
    \ 8-4: Declarative macro definition components*\n\n# Matchers\n\nYou can think\
    \ of a macro matcher as a token tree that the compiler tries to twist and bend\
    \ in predefined ways to match the input token tree it was given at the invocation\
    \ site. As an example, consider a macro with the matcher $a:ident + $b:expr. That\
    \ matcher will match any identifier (:ident) followed by a plus sign followed\
    \ by any Rust expression (:expr). If the macro is invoked with x + 3 * 5, the\
    \ compiler notices that the matcher matches if it sets $a = x and $b = 3 * 5.\
    \ Even though * never appears in the matcher, the compiler realizes that 3 * 5\
    \ is a valid expression, and that it can therefore be matched with $b:expr, which\
    \ accepts anything that is an expression (the :expr part).\n\nMatchers can get\
    \ pretty hairy, but they have huge expressive power, much like regular expressions.\
    \ For a not-too-hairy example, this matcher accepts a sequence ($()) of one or\
    \ more (+) comma-separated (,), key/value pairs given in key => value format:\n\
    \n```\n$(\\$key:expr => $value:expr),+\n```\n\nAnd, crucially, code that invokes\
    \ a macro with this matcher can give an arbitrarily complex expression for the\
    \ key or value—the magic of matchers will make sure that the key and value expressions\
    \ are partitioned appropriately.\n\nMacro rules support a wide variety of *fragment\
    \ types*; you’ve already seen :ident for identifiers and :expr for expressions,\
    \ but there is also :ty for types, and even :tt for any single token tree! You\
    \ can find a full list of the fragment types in Chapter 3 of the Rust language\
    \ reference (https://doc.rust-lang.org/reference/macros-by-example.html). These,\
    \ plus the mechanism for matching a pattern repeatedly ($()), enable you to match\
    \ most straightforward code patterns. If, however, you find that it is difficult\
    \ to express the pattern you want with a matcher, you may want to try a procedural\
    \ macro instead,"
  - "[PAGE 110]\n\nwhere you don’t need to follow the strict syntax macro_rules! requires.\
    \ We’ll look at these in more detail later in the chapter.\n\n# Transcribers\n\
    \nOnce the compiler has matched a declarative macro matcher, it generates code\
    \ using the matcher’s associated transcriber. The variables defined by a macro\
    \ matcher are called metavariables, and the compiler substitutes any occurrence\
    \ of each metavariable in the transcriber (like $key in the example in the previous\
    \ section) with the input that matches that part of the matcher. If you have repetition\
    \ in the matcher (like $(),+ in that same example), you can use the same syntax\
    \ in the transcriber and it will be repeated once for each match in the input,\
    \ with each expansion holding the appropriate substitution for each metavariable\
    \ for that iteration. For example, for the $key and $value matcher, we could write\
    \ the following transcriber to generate an insert call into some map for each\
    \ $key/$value pair that was matched:\n\n```\n$(map.insert($key, $value;)+\n```\n\
    \nNotice that here we want a semicolon for each repetition, not just to delimit\
    \ the repetition, so we place the semicolon inside the repetition parentheses.\
    \ You must use a metavariable in each repetition in the transcriber so that the\
    \ compiler knows which repetition in the matcher to use (in case there is more\
    \ than one).\n\n# Hygiene\n\nYou may have heard it said that Rust macros are hygienic,\
    \ and perhaps that being hygienic makes them safer or nicer to work with, without\
    \ necessarily understanding what that means. When we say Rust macros are hygienic,\
    \ we mean that a declarative macro (generally) cannot affect variables that aren’t\
    \ explicitly passed to it. A trivial example is that if you declare a variable\
    \ with the name foo, and then call a macro that also defines a variable named\
    \ foo, the macro’s foo is by default not visible at the call site (the place where\
    \ the macro is called from). Similarly, macros cannot access variables defined\
    \ at the call site (even self) unless they are explicitly passed in.\n\nYou can,\
    \ most of the time, think of macro identifiers as existing in their own namespace\
    \ that is separate from that of the code they expand into. For an example, take\
    \ a look at the code in Listing 8-5, which has a macro that tries (and fails)\
    \ to shadow a variable at the call site.\n\n```\nmacro_rules! let_foo {\n    ($x:expr)\
    \ => {\n        let foo = $x;\n    }\n}\nlet foo = 1;\nlet_foo!(2);\n// expands\
    \ to let foo = 2;\nassert_eq!(foo, 1);\n```\n\nListing 8-5: Macros exist in their\
    \ own little universes. Mostly."

    Listing 6-2: Enabling a feature of a dependency


    Some features are used so frequently that it makes more sense to have a crate
    opt out of them rather than in to them. To support this, Cargo allows you to define
    a set of default features for a crate. And similarly, it allows you to opt out
    of the default features of a dependency. Listing 6-3 shows how foo can make its
    derive feature enabled by default, while also opting out of some of syn’s default
    features and instead enabling only the ones it needs for the derive feature.


    ```

    [package]

    name = "foo"

    ...

    [features]

    derive = ["syn"]

    default = ["derive"]


    [dependencies.syn]

    version = "1"

    default-features = false

    features = ["derive", "parsing", "printing"]

    optional = true

    ```


    Listing 6-3: Adding and opting out of default features, and thus optional dependencies


    Here, if a crate depends on foo and does not explicitly opt out of the default
    features, it will also compile foo’s syn dependency. In turn, syn will be built
    with only the three listed features, and no others. Opting out of default features
    this way, and opting in to only what you need, is a great way to cut down on your
    compile times!


    # OPTIONAL DEPENDENCIES AS FEATURES


    When you define a feature, the list that follows the equal sign is itself a list
    of features. This might, at first, sound a little odd—in Listing 6-3, syn is a
    dependency, not a feature. It turns out that Cargo makes every optional dependency
    a feature with the same name as the dependency. You’ll see this if you try to
    add a feature with the same name as an optional dependency; Cargo won’t allow
    it. Support for a different namespace for features and dependencies is in the
    works in Cargo, but has not been stabilized at the time of writing. In the meantime,
    if you want to have a feature named after a dependency, you can rename the dependency
    using package = "" to avoid the name collision. The list of features that a feature
    enables can also include features of dependencies. For example, you can write
    derive = ["syn/derive"] to have your derive feature enable the derive feature
    of the syn dependency.'

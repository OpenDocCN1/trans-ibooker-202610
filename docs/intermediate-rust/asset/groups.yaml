  - '[PAGE 38]


    Not all instances of impl Trait use existential types. If you use impl Trait in
    argument position for a function, it’s really just shorthand for an unnamed generic
    parameter to that function. For example, fn foo(s: impl ToString) is mostly just
    syntax sugar for fn foo<S: ToString>(s: S).


    Existential types come in handy particularly when you implement traits that have
    associated types. For example, imagine you’re implementing the IntoIterator trait.
    It has an associated type IntoIter that holds the type of the iterator that the
    type in question can be turned into. With existential types, you do not need to
    define a separate iterator type to use for IntoIter. Instead, you can give the
    associated type as impl Iterator<Item = Self::Item> and just write an expression
    inside the fn into_iter(self) that evaluates to an Iterator, such as by using
    maps and filters over some existing iterator type.


    Existential types also provide a feature beyond mere convenience: they allow you
    to perform zero-cost type erasure. Instead of exporting helper types just because
    they appear in a public signature somewhere—iterators and futures are common examples
    of this—you can use existential types to hide the underlying concrete type. Users
    of your interface are shown only the traits that the relevant type implements,
    while the concrete type is left as an implementation detail. Not only does this
    simplify the interface, but it also enables you to change that implementation
    as you wish without breaking downstream code in the future.


    # Summary


    This chapter has provided a thorough review of the Rust type system. We’ve looked
    both at how the compiler manifests types in memory and how it reasons about the
    types themselves. This is important background material for writing unsafe code,
    complex application interfaces, and asynchronous code in later chapters. You’ll
    also find that much of the type reasoning from this chapter plays into how you
    design Rust code interfaces, which we’ll cover in the next chapter.'

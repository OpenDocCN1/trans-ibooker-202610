    Sometimes, you want to give a particular field or type a larger alignment than
    it technically requires. You can do that using the attribute `#[repr(align(n))]`.
    A common use case for this is to ensure that different values stored contiguously
    in memory (like in an array) end up in different cache lines on the CPU. That
    way, you avoid *false sharing*, which can cause huge performance degradations
    in concurrent programs. False sharing occurs when two different CPUs access different
    values that happen to share a cache line; while they can theoretically operate
    in parallel, they both end up contending to update the same single entry in the
    cache. We’ll talk about concurrency in much greater detail in Chapter 11.


    # Complex Types


    You might be curious about how the compiler represents other Rust types in memory.
    Here’s a quick reference:


    +   - **Tuple** Represented like a struct with fields of the same type as the
    tuple values in the same order.

    +   - **Array** Represented as a contiguous sequence of the contained type with
    no padding between the elements.

    +   - **Union** Layout is chosen independently for each variant. Alignment is
    the maximum across all the variants.

    +   - **Enumeration** Same as union, but with one additional hidden shared field
    that stores the enum variant discriminant. The discriminant is the value the code
    uses to determine which of the enum variants a given value holds. The size of
    the discriminant field depends on the number of variants.


    # Dynamically Sized Types and Fat Pointers


    You may have come across the marker trait Sized in various odd corners of the
    Rust documentation and in error messages. Usually, it comes up because the compiler
    wants you to provide a type that is Sized, but you (apparently) did not. Most
    types in Rust implement Sized automatically—that is, they have a size that’s known
    at compile time—but two common types do not: trait objects and slices. If you
    have, for example, a `dyn Iterator` or a `[u8]`, those do not have a well-defined
    size. Their size depends on some information that is known only when the program
    runs and not at compile time, which is why they are called *dynamically sized
    types (DSTs)*. Nobody knows ahead of time whether the `dyn Iterator` your function
    received is this 200-byte struct or that 8-byte struct. This presents a problem:
    often the compiler must know the size of something in order to produce valid code,
    such as how much space to allocate to a tuple of type `(i32, dyn Iterator, [u8],
    i32)` or what offset to use if your code tries to access the fourth field. But
    if the type isn’t Sized, that information isn’t available.


    The compiler requires types to be Sized nearly everywhere. Struct fields, function
    arguments, return values, variable types, and array types must all be Sized. This
    restriction is so common that every single type bound you'

    \n相反，执行器往往会提供叶 future 的实现，这些实现在后台与执行器通信，以安排与操作系统的适当交互。具体如何编排取决于执行器和操作系统，但粗略地说，执行器会跟踪所有它在下一次进入睡眠时需要监听的事件源。当叶\

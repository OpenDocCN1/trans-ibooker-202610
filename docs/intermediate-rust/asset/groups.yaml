    # NON-GENERIC INNER FUNCTIONS


    Often, much of the code in a generic method is not type-dependent. Consider, for
    example, the implementation of HashMap::insert. The code to compute the hash of
    the supplied key depends on the key type of the map, but the code to walk the
    buckets of the map to find the insertion point may not. In cases like this, it
    would be more efficient to share the generated machine code for the non-generic
    parts of the method across monomorphizations, and only generate distinct copies
    where this is actually needed.


    One pattern you can use for cases like this is to declare a non-generic helper
    function inside the generic method that performs the shared operations. This leaves
    only the type-dependent code for the compiler to copy-paste for you while allowing
    the helper function to be shared.


    Making the function an inner function comes with the added benefit that you do
    not pollute your module with a single-purpose function. You can instead declare
    such a helper function outside the method instead; just be careful that you don’t
    make it a method under a generic impl block, as then it will still be monomorphized.


    The alternative to static dispatch is *dynamic dispatch*, which enables code to
    call a trait method on a generic type without knowing what that type is. I said
    earlier that the reason we needed multiple instances of the method in Listing
    3-2 was that otherwise your program wouldn’t know what address to jump to in order
    to call the trait method is_contained_in on the given pattern. Well, with dynamic
    dispatch, the caller simply tells you. If you replace impl Pattern with &dyn Pattern,
    you tell the caller that they must give two pieces of information for this argument:
    the address of the pattern and the address of the is_contained_in method. In practice,
    the caller gives us a pointer to a chunk of memory called a virtual method table,
    or vtable, that holds the address of the implementation of all the trait’s methods
    for the type in question, one of which is is_contained_in. When the code inside
    the method wants to call a trait method on the provided pattern, it looks up the
    address of that pattern’s implementation of is_contained_in in the vtable and
    then calls the function at that address. This allows us to use the same function
    body regardless of what type the caller wants to use.



    \ writing out what code gets generated. There are very few smarts involved on\
    \ the compiler’s side—as far as it is aware the procedural macro is more or less\
    \ a source code preprocessor that may perform arbitrary code replacement. The\
    \ requirement that your input can be parsed as a stream of Rust tokens still holds,\
    \ but that’s about it!\n\n## Types of Procedural Macros\n\nProcedural macros come\
    \ in three different flavors, each specialized to a particular common use case:\n\
    \n- Function-like macros, like the ones that `macro_rules!` generates\n- Derive\

    # Alignment


    Before we talk about how a type’s in-memory representation is determined, we first
    need to discuss the notion of alignment, which dictates where the bytes for a
    type can be stored. Once a type’s representation has been determined, you might
    think you can take any arbitrary memory location and interpret the bytes stored

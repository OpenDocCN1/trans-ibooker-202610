    \ u8、u16 和 u32 的类型将是 4 字节对齐的，因为 u32 的存在。\n\n### 布局\n\n既然你已经了解了对齐，我们可以探讨编译器如何决定类型的内存表示，即布局。默认情况下，正如你很快会看到的，Rust\

    But they also only allow the application to do one thing at a time. That means
    if you want your program to wait for either user input or a network packet, you''re
    out of luck unless your operating system provides an operation specifically for
    that. Similarly, even if your application could do some other useful work while
    the disk is writing out a file, it doesn''t have that option as the file write
    operation blocks the execution!


    # Enabling Concurrency with Multithreading


    By far the most common solution to allowing concurrent execution is to use multithreading.
    In a multithreaded program, each thread is responsible for executing a particular
    independent sequence of blocking operations, and the operating system multiplexes

    \ but avoids the extra allocation that Box introduces, and also works in no_std\
    \ environments.\n\n# Back to the Future\n\nWe now have our pinned future, and\
    \ we know what that means. But you may have noticed that none of this important\
    \ pinning stuff shows up in most asynchronous code you write with async and await.\
    \ And that's because the compiler hides it from you.\n\nRemember back when we\

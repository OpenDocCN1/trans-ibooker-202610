    ## 上下文选项


    这些选项让你能够针对特定的编译上下文来定制代码。其中最常用的是 `test` 选项，它仅在 crate 以测试（test）配置文件编译时为 `true`。请注意，`test`
    只对正在被测试的 crate 设置，而不会对其任何依赖项设置。这也意味着，在运行集成测试时，你的 crate 并不会设置 `test`；是集成测试本身以测试配置文件编译，而你的实际
    crate 则正常编译（即不设置 `test`）。`doc` 和 `doctest` 选项也同理，它们分别只在构建文档或编译 doctest 时设置。此外还有
    `debug_assertions` 选项，默认在调试模式下会被设置。


    ## 工具选项


    某些工具（如 `clippy` 和 `Miri`）会设置自定义选项（后面会详述），让你在这些工具下运行时能够定制编译行为。通常，这些选项以相应工具的名称命名。例如，如果你希望某个计算密集型的测试不要在
    Miri 下运行，可以给它加上 `#[cfg_attr(miri, ignore)]` 属性。


    ## 架构选项


    这些选项让你能够基于编译器所针对的 CPU 指令集进行编译。你可以使用 `target_arch` 指定特定架构，其取值如 `x86`、`mips`、`aarch64`；也可以使用
    `target_feature` 指定特定的平台特性，其取值如 `avx` 或 `sse2`。对于非常底层的代码，你还会发现 `target_endian`
    和 `target_pointer_width` 选项也很有用。


    ## 编译器选项


    这些选项让你能够使代码适应所编译所针对的平台 ABI，可通过 `target_env` 获得，其取值如 `gnu`、`msvc` 和 `musl`。由于历史原因，该值通常为空，尤其是在
    GNU 平台上。通常你只在需要直接与生态环境的 ABI 交互时才需要此选项，例如通过 `#[link]` 链接到某个 ABI 特定的符号名时。


    虽然 `cfg` 条件通常用于定制代码，但有些也可以用于定制依赖项。例如，`winrt` 依赖通常只在 Windows 上有意义，而 `nix` crate
    可能只在基于 Unix 的平台上才有用。清单 6-9 给出了如何使用 `cfg` 条件来实现这一点的示例：


    ```

    [target.''cfg(windows)''.dependencies]

    winrt = "0.7"

    [target.''cfg(unix)''.dependencies]

    nix = "0.17"

    ```


    清单 6-9：条件依赖


    在这里，我们指定 `winrt` 0.7 版仅在 `cfg(windows)` 条件下（即在 Windows 上）被视为依赖项，而 `nix` 0.17 版仅在
    `cfg(unix)` 条件下（即在 Linux、macOS 及其他基于 Unix 的平台上）被视为依赖项。需要记住的一点是，`[dependencies]`
    部分在构建过程的很早阶段就会被求值，此时只有某些 `cfg` 选项可用。特别是，`feature` 和上下文选项此时还不可用，因此你不能使用这种语法来基于特性（features）和上下文引入依赖。不过，你可以使用任何仅依赖于目标规范或架构的
    `cfg`，以及由调用 `rustc` 的工具（如 `cfg(miri)`）显式设置的任何选项。


    > 注意

    > *既然谈到了依赖规范，我强烈建议你设置 CI 基础设施，使用 `cargo-deny` 和 `cargo-audit` 等工具对依赖项进行基本审计。这些工具能够检测出：你是否在传递依赖中依赖了某个依赖项的多个主要版本、是否依赖于无人维护或存在已知安全漏洞的
    crate、以及是否使用了你可能想要避免的许可证。使用这类工具是以自动化方式提升代码库质量的绝佳途径！*


    添加自定义的条件编译选项也相当简单。你只需要确保在 `rustc` 编译你的 crate 时传入 `--cfg=myoption`。最简单的做法是将你的 `--cfg`
    添加到 `RUSTFLAGS` 环境变量中。这在 CI 中非常有用，你可能希望根据测试是在 CI 上运行还是在开发机上运行来定制测试套件：在 CI 设置中向
    `RUSTFLAGS` 添加 `--cfg=ci`，然后在代码中使用 `cfg(ci)` 和 `cfg(not(ci))`。以这种方式设置的选项在 `Cargo.toml`
    的依赖项中也可用。


    ## 版本管理


    所有 Rust crate 都有版本，并且预期遵循 Cargo 实现的语义化版本（semantic versioning）规则。语义化版本规定了什么样的变更需要什么样版本的提升、哪些版本被认为是兼容的、以及以何种方式兼容。RFC
    1105 标准本身非常值得一读（其技术性并不强），但概括而言，它区分了三种变更：破坏性变更（breaking changes），需要主版本号的提升；新增功能（additions），需要次版本号的提升；以及缺陷修复（bug
    fixes），只需要补丁版本号的提升。RFC 1105 很好地概述了在 Rust 中什么构成破坏性变更，我们在本书的其他地方也已涉及其中一些方面。


    在这里，我不打算详细讨论不同变更类型的确切语义。相反，我想强调版本号在 Rust 生态系统中出现的一些不太直观的方式，在决定如何为自己的 crate 进行版本管理时，你需要牢记这些。


    ## 最低支持 Rust 版本


    第一个 Rust 特色是最低支持 Rust 版本（MSRV）。在 Rust 社区中，关于项目在 MSRV 和版本管理方面应遵循何种策略存在大量争论，而且没有真正完美的答案。问题的核心在于，一些
    Rust 用户只能使用较旧版本的 Rust，这通常是在企业环境中，他们几乎没有选择余地。如果我们不断利用新稳定的 API，这些用户将无法编译我们 crate
    的最新版本，从而被落下。


    crate 作者可以采用两种技术来让处于这种境地的用户生活更轻松一些。第一种是建立 MSRV 策略，承诺 crate 的新版本始终能够与过去 X 个月的任何稳定版本编译。具体数字各不相同，但
    6 或 12 个月较为常见。考虑到 Rust 每六周一个发布周期，这分别对应最近四个或八个稳定版本。项目中引入的任何新代码都必须能够使用 MSRV 编译器编译（通常通过
    CI 检查），或者等到 MSRV 策略允许时再按原样合并。这有时会很痛苦，因为这意味着这些 crate 无法利用语言提供的最新、最强大的功能，但这会让你的用户生活更轻松。


    第二种技术是确保每当 MSRV 发生变化时，都提升 crate 的次版本号。因此，如果你发布了 crate 的 2.7.0 版本，并且该版本将你的 MSRV
    从 Rust 1.44 提升到 Rust 1.45，那么一个停留在 1.44 且依赖你 crate 的项目可以使用依赖版本限定符 `version = "2,
    <2.7"` 来保持项目正常工作，直到它能够升级到 Rust 1.45。重要的是，你应递增次版本号，而不仅仅是补丁版本号，这样如果必要，你仍然可以针对之前的
    MSRV 版本发布关键安全修复（通过再进行一次补丁发布）。


    有些项目非常重视 MSRV 支持，以至于他们将 MSRV 变更视为破坏性变更并递增主版本号。这意味着下游项目必须显式选择接受 MSRV 变更，而不是选择不接受——但这也意味着，那些没有如此严格
    MSRV 要求的用户如果不更新依赖项，将看不到未来的缺陷修复，而这些依赖项更新可能也会要求他们发布破坏性变更。正如我所说，这些解决方案都不是没有缺点的。


    如今在 Rust 生态系统中强制实施 MSRV 是很有挑战性的。只有一小部分 crate 提供 MSRV 保证，即使你的依赖项提供了，你也需要不断监控它们，以便了解它们何时提高了
    MSRV。当它们提高时，你需要用前面提到的受限版本边界发布新版本的 crate，以确保你的 MSRV 不会随之改变。这可能反过来迫使你放弃对依赖项的安全和性能更新，因为你必须继续使用旧版本，直到你的
    MSRV 政策允许更新。而这个决定也会传递给你的下游依赖方。已经有人提议将 MSRV 检查构建到 Cargo 本身中，但在撰写本文时，还没有任何可用的方案被稳定下来。



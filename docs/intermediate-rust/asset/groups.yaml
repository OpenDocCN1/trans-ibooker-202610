  mdcn: "\n这些情况下：如果你的代码可能 panic，请记录这一事实，以及它可能 panic 的具体情形。同样，如果你的代码可能返回错误，请记录返回错误的情形。对于\
    \ unsafe 函数，请记录调用者必须保证什么，调用才是安全的。\n\n其次，在 crate 和模块级别为你的代码提供端到端的使用示例。这些比特定类型或方法的示例更重要，因为它们能让用户体会到所有内容是如何组合在一起的。当开发人员对接口结构有了较好的高层理解后，他们可能很快就会意识到特定的方法和类型是做什么的，以及应该在何处使用它们。端到端示例还为用户提供了定制用法的起点；他们可以——而且通常会——复制粘贴示例，然后根据自己的需求进行修改。这种“在做中学”的方式往往比让他们尝试从零散组件中拼凑出内容更有效。\n\
    \n**注意** 那些高度针对某个方法的示例，比如展示 len 方法确实返回长度的示例，不太可能向用户传达任何有关你代码的新信息。\n\n第三，组织好你的文档。如果你所有的类型、trait\
    \ 和函数都放在一个顶层模块中，用户将很难知道从哪里开始。要利用模块将语义相关的项目组合在一起。然后，使用文档内链接将这些项目互相关联起来。如果关于类型 A\
    \ 的文档提到了 trait B，那么就应该在那里直接链接到该 trait。如果你让用户能够轻松探索你的接口，他们就不太可能错过重要的关联或依赖。同时，考虑使用\
    \ `#[doc(hidden)]` 标记那些并非有意公开、但由于历史原因而需要保留的接口部分，以免它们使你的文档变得杂乱。\n\n最后，尽可能丰富你的文档。链接到能够解释概念、数据结构、算法或接口其他方面的外部资源，这些内容可能在其他地方已有很好的说明。如果有相关的话，RFC、博客文章和白皮书都是很好的选择。使用\
    \ `#[doc(cfg(...))]` 来突出显示仅在特定配置下可用的项目，以便用户很快意识到为什么文档中列出的某个方法不可用。使用 `#[doc(alias\
    \ = \"...\")]` 让类型和方法能够通过用户可能搜索的其他名称被发现。在顶层文档中，向用户指出常用的模块、功能、类型、trait 和方法。\n\n\
    ## 类型系统指导\n\n类型系统是一个极好的工具，可以确保你的接口清晰明了、自我文档化且不易被误用。你可以使用多种技术，让你的接口很难被误用，从而更有可能被正确使用。\n\
    \n其中第一种是语义类型化（semantic typing），即添加类型来表示值的含义，而不仅仅是其原始类型。这里经典的例子是布尔值：如果你的函数接受三个\
    \ bool 参数，很可能某个用户会弄错值的顺序，直到出了大问题才意识到。另一方面，如果它接受三个参数，而这三个参数是三种不同的两变体枚举类型，那么用户不可能在不被编译器警告的情况下弄错顺序：如果他们试图将\
    \ `DryRun::Yes` 传递给 overwrite 参数，那根本行不通，将 `Overwrite::No` 作为 dry_run 参数也同样行不通。你也可以在布尔值之外应用语义类型化。例如，在数值类型上创建一个\
    \ newtype，可以为其中包含的值提供单位，或者将原始指针参数限制为仅接受由另一个方法返回的那些指针。\n\n一种密切相关的技术是使用零大小类型（zero-sized\
    \ type）来表明某个类型的实例具有某个特定的事实。例如，考虑一个名为 Rocket 的类型，它表示真实火箭的状态。无论火箭处于什么状态，Rocket 的某些操作（方法）都应该可用，但有些操作只在特定情况下才有意义。例如，如果火箭已经发射过，就不可能再次发射。同样，如果火箭尚未发射，可能也不应该能够分离燃料箱。我们可以将这些状态建模为枚举变体，但那样所有方法在每个阶段都可用，而且我们需要引入可能的\
    \ panic。\n\n相反，如清单 4-2 所示，我们可以在 Rocket 上引入一个泛型参数 Stage，并用它来限制哪些方法在何时可用。\n\n```\n\
    ① struct Grounded;\nstruct Launched;\n// and so on\nstruct Rocket<Stage = Grounded>\
    \ {\n② stage: std::marker::PhantomData<Stage>,\n}\n\n③ impl Default for Rocket<Grounded>\
    \ {}\nimpl Rocket<Grounded> {\n    pub fn launch(self) -> Rocket<Launched> { }\n\
    }\n④ impl Rocket<Launched> {\n    pub fn accelerate(&mut self) { }\n    pub fn\
    \ decelerate(&mut self) { }\n}\n\n⑤ impl<Stage> Rocket<Stage> {\n    pub fn color(&self)\
    \ -> Color { }\n    pub fn weight(&self) -> Kilograms { }\n}\n```\n\n清单 4-2：使用标记类型来限制实现\n\
    \n我们引入单元类型来表示火箭可能处于的每个阶段 ①。我们实际上并不需要存储阶段本身——只需要它提供的元信息——因此我们将其存储在 PhantomData\
    \ ② 后面，以确保它在编译时被消除。然后，我们仅为持有特定类型参数的 Rocket 编写实现块。你目前只能在地面上构建火箭，并且只能从地面发射它 ③。只有火箭发射后，你才能控制它的速度\
    \ ④。无论火箭处于什么状态，有些事情你总是可以做的，我们将这些操作放在一个泛型实现块 ⑤ 中。你会注意到，通过这种方式设计的接口，用户根本不可能在错误的时间调用某个方法——我们已经将使用规则编码到了类型本身，并使得非法状态无法被表示。\n\
    \n这个概念也适用于许多其他领域；如果你的函数只有在给定的布尔参数为 true 时才使用某个指针参数，那么最好将这两个参数合并起来。使用一个枚举类型，其中一个变体表示\
    \ false（且不包含指针），另一个变体表示 true 并持有指针，这样调用者和实现者都不会误解这两者之间的关系。这是一个强大的思路，我非常鼓励你加以利用。\n\
    \n另一个让接口清晰明了的小而实用的工具是 `#[must_use]` 注解。将它添加到任何类型、trait 或函数上后，如果用户的代码接收了该类型或 trait\
    \ 的元素，或者调用了该函数，却没有显式地处理它，编译器就会发出警告。你可能已经在 Result 的上下文中见过这种情况：如果一个函数返回 Result，而你没有在某个地方赋值其返回值，就会收到编译器警告。不过，要注意不要过度使用这个注解——只有当用户不使用返回值时非常可能出错的情况下，才添加它。\n\
    \n## 约束\n\n随着时间推移，总会有用户依赖于你接口的每一个属性，无论是 bug 还是特性。对于公开可用的库来说尤其如此，因为你无法控制你的用户。因此，在做出对用户可见的更改之前，你应该仔细考虑。无论你是添加新的类型、字段、方法或\
    \ trait 实现，还是修改现有的这些，你都需要确保该更改不会破坏现有用户的代码，并且你计划长期保留这一更改。频繁的不向后兼容更改（语义化版本中的主版本号增加）必然会招致用户的愤怒。\n\
    \n许多不向后兼容的更改是显而易见的，比如重命名公共类型或删除公共方法，但有些则更为微妙，并且与 Rust 的工作方式紧密相关。在这里，我们将介绍一些更棘手的细微更改，以及如何为它们做好规划。你会看到，需要在某些更改与你希望接口具备的灵活性之间进行权衡——有时候，必须有所舍弃。\n\
    \n### 类型修改\n\n删除或重命名公共类型几乎肯定会破坏某些用户的代码。为了应对这种情况，你应该尽可能利用 Rust 的可见性修饰符，比如 `pub(crate)`\
    \ 和 `pub(in path)`。你拥有的公共类型越少，在不破坏现有代码的情况下，将来进行更改的自由度就越大。\n"

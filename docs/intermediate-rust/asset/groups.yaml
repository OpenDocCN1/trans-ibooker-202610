  - "[PAGE 112]\n\n```\n```rust\nlet mut x = 1;\nplease_set!(x, x + 1);\nassert_eq!(x,\
    \ 2);\n```\n```\n\n*Listing 8-6: Giving macros access to identifiers at the call\
    \ site*\n\nWe could have used `$i + 1` in the macro instead, but we could not\
    \ have used `x + 1`, as the name x is not available in the macro’s definition\
    \ scope.\n\nOne last note on declarative macros and scoping: unlike pretty much\
    \ everything else in Rust, declarative macros only exist in the source code after\
    \ they are declared. If you try to use a macro that you define further down in\
    \ the file, this will not work! This applies globally to your project; if you\
    \ declare a macro in one module and want to use it in another, the module you\
    \ declare the macro in must appear earlier in the crate, not later. Conversely,\
    \ if foo and bar are modules at the root of a crate, and foo declares a macro\
    \ that bar wants to use, then mod foo must appear before mod bar in *lib.rs*!\n\
    \n> **NOTE**  \n> *There is one exception to this odd scoping of macros (formally\
    \ called textual scoping), and that is if you mark the macro with `#[macro_export]`.\
    \ That annotation effectively hoists the macro to the root of the crate and marks\
    \ it as pub, so that it can then be used anywhere in your crate or by your crate’s\

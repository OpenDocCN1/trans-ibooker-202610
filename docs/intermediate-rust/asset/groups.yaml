    \ code, and take a look at some of the special type and trait constructs Rust\
    \ offers for more advanced use cases.\n\n## 3\n\n## Types\n\n![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_22_0.png)\n\
    \nNow that the fundamentals are out of the way, we’ll look at Rust’s type system.\
    \ We’ll skip past the basics covered in *The Rust Programming Language* and instead\
    \ dive head-first into how different types are laid out in memory, the ins and\
    \ outs of traits and trait bounds, existential types, and the rules for using\
    \ types across crate boundaries.\n\n## Types in Memory\n\nEvery Rust value has\
    \ a type. Types serve many purposes in Rust, as we’ll see in this chapter, but\
    \ one of their most fundamental roles is to tell you how to interpret bits of\
    \ memory. For example, the sequence of bits 0b10111101 (written in hexadecimal\
    \ notation as 0xBD) does not mean anything in and of itself until you assign it\
    \ a type. When interpreted under the type u8, that sequence of bits is the number\
    \ 189. When interpreted under the type i8, it is −67. When you define your own\
    \ types, it’s the compiler’s job to determine where each part of the defined type\
    \ goes in the in-memory representation for that type. Where does each field of\
    \ your struct appear in the sequence of bits? Where is the discriminant for your\
    \ enum stored? It’s important to understand how this process works as you begin\
    \ to write more advanced Rust code, because these details affect both the correctness\
    \ and the performance of your code.\n\n### Alignment\n\nBefore we talk about how\
    \ a type’s in-memory representation is determined, we first need to discuss the\
    \ notion of alignment, which dictates where the bytes for a type can be stored.\
    \ Once a type’s representation has been determined, you might think you can take\
    \ any arbitrary memory location and interpret the bytes stored there as that type.\
    \ While that is true in a theoretical sense, in practice the hardware also constrains\
    \ where a given type can be placed. The most obvious example of this is that pointers\
    \ point to bytes, not bits. If you placed a value of type T starting at bit 4\
    \ of your computer’s memory, you would have no way to refer to its location; you\
    \ can create a pointer pointing only to byte 0 or byte 1 (bit 8). For this reason,\
    \ all values, no matter their type, must start at a byte boundary. We say that\
    \ all values must be at least byte-aligned—they must be placed at an address that\
    \ is a multiple of 8 bits.\n\nSome values have more stringent alignment rules\
    \ than just being byte-aligned. In the CPU and the memory system, memory is often\
    \ accessed in blocks larger than a single byte. For example, on a 64-bit CPU,\
    \ most values are accessed in chunks of 8 bytes (64 bits), with each operation\
    \ starting at an 8-byte-aligned address. This is referred to as the CPU’s word\
    \ size. The CPU then uses some cleverness to handle reading and writing smaller\
    \ values, or values that span the boundaries of these chunks.\n\nWhere possible,\
    \ you want to ensure that the hardware can operate in its “native” alignment.\
    \ To see why, consider what happens if you try to read an i64 that starts in the\
    \ middle of an 8-byte block (that is, the pointer to it is not 8-byte-aligned).\
    \ The hardware will have to do two reads—one from the second half of the first\
    \ block to get to the start of the i64, and one from the first half of the second\
    \ block to read the rest of the i64—and then splice the results together. This\
    \ is not very efficient. Since the operation is spread across multiple accesses\
    \ to the underlying memory, you may also end up with strange results if the memory\
    \ you’re reading from is concurrently written to by a different thread. You might\
    \ read the first 4 bytes before the other thread’s write has happened and the\
    \ second 4 bytes after, resulting in a corrupted value.\n\nOperations on data\
    \ that is not aligned are referred to as misaligned accesses and can lead to poor\
    \ performance and bad concurrency problems. For this reason, many CPU operations\
    \ require, or strongly prefer, that their arguments are naturally aligned. A naturally\
    \ aligned value is one whose alignment matches its size. So, for example, for\
    \ an 8-byte load, the provided address would need to be 8-byte-aligned.\n\nSince\
    \ aligned accesses are generally faster and provide stronger consistency semantics,\
    \ the compiler tries to take advantage of them where possible. It does this by\
    \ giving every type an alignment that’s computed based on the types that it contains.\
    \ Built-in values are usually aligned to their size, so a u8 is byte-aligned,\
    \ a u16 is 2-byte-aligned, a u32 is 4-byte-aligned, and a u64 is 8-byte-aligned.\
    \ Complex types—types that contain other types—are typically assigned the largest\
    \ alignment of any type they contain. For example, a type that contains a u8,\
    \ a u16, and a u32 will be 4-byte-aligned because of the u32.\n\n### Layout\n\n\
    Now that you know about alignment, we can explore how the compiler decides on\
    \ the in-memory representation, known as the layout, of a type. By default, as\
    \ you’ll see shortly, the Rust compiler gives very few guarantees about how it\
    \ lays out types, which makes for a poor starting point for understanding the\
    \ underlying principles. Luckily, Rust provides a repr attribute you can add to\
    \ your type definitions to request a particular in-memory representation for that\
    \ type. The most common one you will see, if you see one at all, is repr(C). As\
    \ the name suggests, it lays out the type in a way that is compatible with how\
    \ a C or C++ compiler would lay out the same type. This is helpful when writing\
    \ Rust code that interfaces with other languages using the foreign-function interface,\
    \ which we’ll talk about in Chapter 12, as Rust will generate a layout that matches\
    \ the expectations of the other language’s compiler. Since the C layout is predictable\
    \ and not subject to change, repr(C) is also useful in unsafe contexts if you’re\
    \ working with raw pointers into the type, or if you need to cast between two\
    \ different types that you know have the same fields. And, of course, it is perfect\
    \ for taking our first steps into layout algorithms.\n\n> Another useful representation\
    \ is repr(transparent), which can be used only on types with a single field and\
    \ which guarantees that the layout of the outer type is exactly the same as that\
    \ of the inner type. This comes in handy in combination with the “newtype” pattern,\
    \ where you may want to operate on the in-memory representations of some struct\
    \ A and struct NewA(A) as if they were the same. Without repr(transparent), the\
    \ Rust compiler does not guarantee that they will have the same layout.\n\nSo,\
    \ let’s look how the compiler would lay out a particular type with repr(C): the\
    \ Foo type in Listing 3-1. How do you think the compiler would lay this out in\
    \ memory?\n\n```\n#[repr(C)]\nstruct Foo {\n    tiny: bool,\n    normal: u32,\n\
    \    small: u8,\n    long: u64,\n    short: u16,\n}\n```\n\nListing 3-1: Alignment\
    \ affects layout.\n"

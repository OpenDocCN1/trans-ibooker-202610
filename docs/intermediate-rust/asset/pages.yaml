  md: 'When you’re given the choice between static and dynamic dispatch, there is
    rarely a clear-cut right answer. Broadly speaking, though, you’ll want to use
    static dispatch in your libraries and dynamic dispatch in your binaries. In a
    library, you want to allow your users to decide what kind of dispatch is best
    for them, since you don’t know what their needs are. If you use dynamic dispatch,
    they’re forced to do the same, whereas if you use static dispatch, they can choose
    whether to use dynamic dispatch or not. In a binary, on the other hand, you’re
    writing the final code, so there are no needs to consider except those of the
    code you are writing. Dynamic dispatch often allows you to write cleaner code
    that leaves out generic parameters and will compile more quickly, all at a (usually)
    marginal performance cost, so it’s usually the better choice for binaries.


    # Generic Traits


    Rust traits can be generic in one of two ways: with generic type parameters like
    `trait Foo<T>` or with associated types like `trait Foo { type Bar; }`. The difference
    between these is not immediately apparent, but luckily the rule of thumb is quite
    simple: use an associated type if you expect only one implementation of the trait
    for a given type, and use a generic type parameter otherwise.


    The rationale for this is that associated types are often significantly easier
    to work with, but will not allow multiple implementations. So, more simply put,
    the advice is really just to use associated types whenever you can.


    With a generic trait, users must always specify all the generic parameters and
    repeat any bounds on those parameters. This can quickly get messy and hard to
    maintain. If you add a generic parameter to a trait, all users of that trait must
    also be updated to reflect the change. And since multiple implementations of a
    trait may exist for a given type, the compiler may have a hard time deciding which
    instance of the trait you meant to use, leading to awful disambiguating function
    calls like `FromIterator::<u32>::from_iter`. But the upside is that you can implement
    the trait multiple times for the same type—for example, you can implement `PartialEq`
    against multiple right-hand side types for your type, or you can implement both
    `FromIterator<T>` and `FromIterator<&T>` where `T: Clone`, precisely because of
    the flexibility that generic traits provide.


    With associated types, on the other hand, the compiler needs to know only the
    type that implements the trait, and all the associated types follow (since there
    is only one implementation). This means the bounds can all live in the trait itself
    and do not need to be repeated on use. In turn, this allows the trait to add further
    associated types without affecting its users. And because the type dictates all
    the associated types of the trait, you never have to disambiguate with the unified
    function calling syntax shown in the previous paragraph. However, you cannot implement
    `Deref` against multiple `Target` types, nor can you implement `Iterator` with
    multiple different `Item` types.



  md: '# Lifetimes and the Borrow Checker


    At the heart of Rust lifetimes is the borrow checker. Whenever a reference with
    some lifetime ''a is used, the borrow checker checks that ''a is still alive.
    It does this by tracing the path back to where ''a starts—where the reference
    was taken—from the point of use and checking that there are no conflicting uses
    along that path. This ensures that the reference still points to a value that
    it is safe to access. This is similar to the high-level “data flow” mental model
    we discussed earlier in the chapter; the compiler checks that the flow of the
    reference we are accessing does not conflict with any other parallel flows.


    Listing 2-8 shows a simple code example with lifetime annotations for the reference
    to x.


    ```

    let mut x = Box::new(42);

    ① let r = &x;          // ''a


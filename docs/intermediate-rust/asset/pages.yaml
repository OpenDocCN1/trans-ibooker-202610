  md: '# Minimum Supported Rust Version


    The first Rust-ism is the minimum supported Rust version (MSRV). There is much
    debate in the Rust community about what policy projects should adhere to when
    it comes to their MSRV and versioning, and there’s no truly good answer. The core
    of the problem is that some Rust users are limited to using older versions of
    Rust, often in an enterprise setting where they have little choice. If we constantly
    take advantage of newly stabilized APIs, those users will not be able to compile
    the latest versions of our crates and will be left behind.


    There are two techniques crate authors can use to make life a little easier for
    users in this position. The first is to establish an MSRV policy promising that
    new versions of a crate will always compile with any stable release from the last
    X months. The exact number varies, but 6 or 12 months is common. With Rust’s six-week
    release cycle, that corresponds to the latest four or eight stable releases, respectively.
    Any new code introduced to the project must compile with the MSRV compiler (usually
    checked by CI) or be held until the MSRV policy allows it to be merged as is.
    This can sometimes be a pain, as it means these crates cannot take advantage of
    the latest and greatest the language has to offer, but it will make life easier
    for your users.


    The second technique is to make sure to increase the minor version number of your
    crate any time that the MSRV changes. So, if you release version 2.7.0 of your
    crate and that increases your MSRV from Rust 1.44 to Rust 1.45, then a project
    that is stuck on 1.44 and that depends on your crate can use the dependency version
    specifier version = "2, <2.7" to keep the project working until it can move on
    to Rust 1.45. It’s important that you increment the minor version, not just the
    patch version, so that you can still issue critical security fixes for the previous
    MSRV release by doing another patch release if necessary.


    Some projects take their MSRV support so seriously that they consider an MSRV
    change a breaking change and increment the major version number. This means that
    downstream projects will explicitly have to opt in to an MSRV change, rather than
    opting out—but it also means that users who do not have such strict MSRV requirements
    will not see future bug fixes without updating their dependencies, which may require
    them to issue a breaking change as well. As I said, none of these solutions are
    without drawbacks.


    Enforcing an MSRV in the Rust ecosystem today is challenging. Only a small subset
    of crates provide any MSRV guarantees, and even if your dependencies do, you will
    need to constantly monitor them to know when they increase their MSRV. When they
    do, you’ll need to do a new release of your crate with the restricted version
    bounds mentioned previously to make sure your MSRV doesn’t also change. This may
    in turn force you to forego security and performance updates made to your dependencies,
    as you’ll have to continue using older versions until your MSRV policy permits
    updating. And that decision also carries over to your dependents. There have been
    proposals to build MSRV checking into Cargo itself, but nothing workable has been
    stabilized as of this writing.'

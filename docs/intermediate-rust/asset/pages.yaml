  md: 'The `&mut` Context contains the Waker. The argument is a Context, not a Waker
    directly, so that we can augment the asynchronous ecosystem with additional context
    for futures should that be deemed necessary.


    The primary method on Waker is wake (and the by-reference variant wake_by_ref).
    The wake method takes no arguments, and its effects are entirely defined by the
    executor that constructed the Waker. You see, Waker is secretly generic over the
    executor. Or, more precisely, whatever constructed the Waker gets to dictate what
    happens when Waker::wake is called, when a Waker is cloned, and when a Waker is
    dropped. This all happens through a manually implemented vtable, which functions
    similarly to the dynamic dispatch we discussed way back in Chapter 3.


    It’s a somewhat involved process to construct a Waker, and the mechanics of it
    aren’t all that important for using one, but you can see the building blocks in
    the RawWakerVTable type in the standard library. It has a constructor that takes
    the function pointers for wake and wake_by_ref, as well as Clone and Drop. The
    RawWakerVTable, which is usually shared among all of an executor’s wakers, is
    bundled up with a raw pointer that is intended to hold data specific to each Waker
    instance (like which future it’s for), and turned into a RawWaker. That is in
    turn passed to Waker::from_raw to produce a safe Waker that can be passed to Future::poll.


    # The Poll Contract


    So far we’ve skirted around what a future actually does with a Waker. The idea
    is fairly simple: if Future::poll returns Poll::Pending, it is the future’s responsibility
    to ensure that *something* calls wake on the provided Waker when the future is
    next able to make progress. Most futures uphold this property by only returning
    Poll::Pending if some other future also returned Poll::Pending; in this way it
    trivially fulfills the contract of poll since the inner future must follow that
    same contract. But there can’t be turtles all the way down. At some point, you
    reach a future that does not poll other futures, but instead does something like
    write to a network socket or attempt to receive on a channel. These are commonly
    referred to as *leaf futures* since they have no children. A leaf future has no
    inner future, but instead directly represents some resource that may not be ready
    to return a result yet.


    Leaf futures typically come in one of two shapes: those that wait for events that
    originate within the same process (like a channel receiver), and those that wait
    for events external to the process (like a TCP packet receive). Those that wait
    for internal events all tend to follow the same pattern: store the Waker somewhere
    where the code that will wake you up can find it, and have that code call wake
    on the Waker when it generates the relevant event. For example, consider a leaf
    future that has to wait for a message on an in-memory channel. It stores the Waker
    inside the part of the channel that is shared between the sender and the receiver,
    and then returns Poll::Pending. When a sender later comes along and injects a
    message into the channel, it notices the Waker left there by the waiting receiver
    and calls wake on the Waker'

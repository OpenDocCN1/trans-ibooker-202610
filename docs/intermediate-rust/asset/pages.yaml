  md: '# Common Traits for Types


    Users in Rust will also make the major assumption that everything in the interface
    “just works.” They expect to be able to print any type with {:?} and send anything
    and everything to another thread, and they expect that every type is Clone. Where
    possible, we should again avoid surprising the user and eagerly implement most
    of the standard traits even if we do not need them immediately.


    Because of the coherence rules discussed in Chapter 3, the compiler will not allow
    users to implement these traits when they need them. Users aren’t allowed to implement
    a foreign trait (like Clone) for a foreign type like one from your interface.
    They would instead need to wrap your interface type in their own type, and even
    then it may be quite difficult to write a reasonable implementation without access
    to the type’s internals.


    First among these standard traits is the Debug trait. Nearly every type can, and
    should, implement Debug, even if it only prints the type’s name. Using #[derive(Debug)]
    is often the best way to implement the Debug trait in your interface, but keep
    in mind that all derived traits automatically add the same bound for any generic
    parameters. You could also simply write your own implementation by leveraging
    the various debug_helpers on fmt::Formatter.


    Tied in close second are the Rust auto-traits Send and Sync (and, to a lesser
    extent, Unpin). If a type does not implement one of these traits, it should be
    for a very good reason. A type that is not Send can’t be placed in a Mutex and
    can’t be used even transitively in an application that contains a thread pool.
    A type that is not Sync can’t be shared through an Arc or placed in a static variable.
    Users have come to expect that types just work in these contexts, especially in
    the asynchronous world where nearly everything runs on a thread pool, and will
    become frustrated if you don’t ensure that your types implement these traits.
    If your types cannot implement them, make sure that fact, and the reason why,
    is well documented!


    The next set of nearly universal traits you should implement is Clone and Default.
    These traits can be derived or implemented easily and make sense to implement
    for most types. If your type cannot implement these traits, make sure to call
    it out in your documentation, as users will usually expect to be able to easily
    create more (and new) instances of types as they see fit. If they cannot, they
    will be surprised.


    One step further down in the hierarchy of expected traits is the comparison traits:
    PartialEq, PartialOrd, Hash, Eq, and Ord. The PartialEq trait is particularly
    desirable, because users will at some point inevitably have two instances of your
    type that they wish to compare with == or assert_eq!. Even if your type would
    compare equal for only the same instance of the type, it’s worth implementing
    PartialEq to enable your users to use assert_eq!.


    PartialOrd and Hash are more specialized, and may not apply quite as broadly,
    but where possible you will want to implement them too. This is especially true
    for types a user might use as the key in a map, or a type they may deduplicate
    using any of the std::collection set types, since they tend to require these bounds.
    Eq and Ord come with additional semantic requirements on the implementing type’s
    comparison operations beyond those of PartialEq and PartialOrd. These are well
    documented in the documentation'

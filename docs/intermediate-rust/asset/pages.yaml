- pgno: 70
  md: '# PROJECT STRUCTURE


    ![](img/bbeab1f2edc3d45a3e6f7f6efbbb1747_70_0.png)


    This chapter provides some ideas for structuring your Rust projects. For simple
    projects, the structure set up by cargo new is likely to be something you think
    little about. You may add some modules to split up the code, and some dependencies
    for additional functionality, but that’s about it. However, as a project grows
    in size and complexity, you’ll find that you need to go beyond that. Maybe the
    compilation time for your crate is getting out of hand, or you need conditional
    dependencies, or you need a better strategy for continuous integration. In this
    chapter, we will look at some of the tools that the Rust language, and Cargo in
    particular, provide that make it easier to manage such things.


    # Features


    Features are Rust’s primary tool for customizing projects. At its core, a feature
    is just a build flag that crates can pass to their dependencies in order to add
    optional functionality. Features carry no semantic meaning in and of themselves—instead,
    you choose what a feature means for your crate.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Generally, we use features in three ways: to enable optional dependencies,
    to conditionally include additional components of a crate, and to augment the
    behavior of the code. Note that all of these uses are additive; features can add
    to the functionality of the crate, but they shouldn’t generally do things like
    remove modules or replace types or function signatures. This stems from the principle
    that if a developer makes a simple change to their Cargo.toml, such as adding
    a new dependency or enabling a feature, that shouldn’t make their crate stop compiling.
    If a crate has mutually exclusive features, that principle quickly falls by the
    wayside—if crate A depends on one feature of crate C, and crate B on another mutually
    exclusive feature of C, adding a dependency on crate B would then break crate
    A! For that reason, we generally follow the principle that if crate A compiles
    against crate C with some set of features, it should also compile if all features
    are enabled on crate C.


    Cargo leans into this principle quite hard. For example, if two crates (A and
    B) both depend on crate C, but they each enable different features on C, Cargo
    will compile crate C only once, with all the features that either A or B requires.
    That is, it’ll take the union of the requested features for C across A and B.
    Because of this, it’s generally hard to add mutually exclusive features to Rust
    crates; chances are that some two dependents will depend on the crate with different
    features, and if those features are mutually exclusive, the downstream crate will
    fail to build.


    > NOTE

    > I highly recommend that you configure your continuous integration infrastructure
    to check that your crate compiles for any combination of its features. One tool
    that helps you do this is cargo-hack, which you can find at https://github.com/taiki-e/cargo-hack.


    # Defining and Including Features


    Features are defined in Cargo.toml. Listing 6-1 shows an example of a crate named
    foo with a simple feature that enables the optional dependency syn.


    ```

    [package]

    name = "foo"

    ...

    [features]

    derive = ["syn"]


    [dependencies]

    syn = { version = "1", optional = true }

    ```


    Listing 6-1: A feature that enables an optional dependency


    When Cargo compiles this crate, it will not compile the syn crate by default,
    which reduces compile time (often significantly). The syn crate will be compiled
    only if a downstream crate needs to use the APIs enabled by the derive feature
    and explicitly opts in to it. Listing 6-2 shows how such a downstream crate bar
    would enable the derive feature, and thus include the syn dependency.


    ```

    [package]

    name = "bar"

    ...

    ```'

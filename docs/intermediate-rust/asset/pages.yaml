  md: "Executors generally construct a separate Waker for each task they poll so that\
    \ when wake is later called, they know which task was just made runnable and can\
    \ mark it as such. That is what the raw pointer in RawWaker is for—to differentiate\
    \ between tasks while sharing the code for the various Waker methods.\n\nWhen\
    \ the executor eventually polls a task, that task starts running from the top\
    \ of its implementation of Future::poll, and must decide from there how to get\
    \ to the future deeper down that can now make progress. Since each future only\
    \ knows about its own fields, and nothing about the whole tree, this all happens\
    \ through calls to poll that each traverse one edge in the tree.\n\nThe choice\
    \ of which inner future to poll is often obvious, but not always. In the case\
    \ of async/await, the future to poll is the one we’re blocked waiting for. But\
    \ in a future that waits for the first of several futures to make progress (often\
    \ called a select), or for all of a set of futures (often called a join), there\
    \ are many options. A future that has to make such a choice is basically a subexecutor.\
    \ It could poll all of its inner futures, but doing so could be quite wasteful.\
    \ Instead, these subexecutors often wrap the Waker they receive in poll’s Context\
    \ with their own Waker type before they invoke poll on any inner future. In the\
    \ wrapping code, they mark the future they just polled as runnable in their own\
    \ state before they call wake on the original Waker. That way, when the executor\
    \ eventually polls the subexecutor future again, the subexecutor can consult its\
    \ own internal state to figure out which of its inner futures caused the current\
    \ call to poll, and then only poll those.\n\n# Tying It All Together with spawn\n\

  md: "before returning from send. Now the receiver is awoken, and the poll contract\
    \ is upheld.\n\nLeaf futures that deal with external events are more involved,\
    \ as the code that generates the event they’re waiting for knows nothing of futures\
    \ or wakers. Most often the generating code is the operating system kernel, which\
    \ knows when a disk is ready or a timer expires, but it could also be a C library\
    \ that invokes a callback into Rust when an operation completes or some other\
    \ such external entity. A leaf future wrapping an external resource like this\
    \ could spin up a thread that executes a blocking system call (or waits for the\
    \ C callback) and then use the internal waking mechanism, but that would be wasteful;\
    \ you would spin up a thread every time an operation had to wait and would be\
    \ left with lots of single-use threads sitting around waiting for things.\n\n\
    Instead, executors tend to provide implementations of leaf futures that communicate\
    \ behind the scenes with the executor to arrange for the appropriate interaction\
    \ with the operating system. How exactly this is orchestrated depends on the executor\
    \ and the operating system, but roughly speaking the executor keeps track of all\
    \ the event sources that it should listen for the next time it goes to sleep.\
    \ When a leaf future realizes it must wait for an external event, it updates that\
    \ executor’s state (which it knows about since it’s provided by the executor crate)\
    \ to include that external event source alongside its Waker. When the executor\
    \ can no longer make progress, it gathers all of the event sources the various\
    \ pending leaf futures are waiting for and does a big blocking call to the operating\
    \ system telling it to return when any of the resources the leaf futures are waiting\
    \ on have a new event. On Linux, this is usually achieved with the epoll system\
    \ call; Windows, the BSDs, macOS, and pretty much every other operating system\
    \ provide similar mechanisms. When that call returns, the executor calls wake\
    \ on all the wakers associated with event sources that the operating system reported\
    \ an event for, and thus the poll contract is fulfilled.\n\n> **NOTE**  \n> A\
    \ reactor *is the part of an executor that leaf futures register event sources\
    \ with and that the executor waits on when it has no more useful work to do. It\
    \ is possible to separate the executor and the reactor, though bundling them together\
    \ often improves performance as the two can be co-optimized more readily.\n\n\
    A knock-on effect of the tight integration between leaf futures and the executor\
    \ is that leaf futures from one executor crate often cannot be used with a different\
    \ executor. Or at least, they cannot be used unless the leaf future’s executor\
    \ is *also* running. When the leaf future goes to store its Waker and register\
    \ the event source it’s waiting for, the executor it was built against needs to\
    \ have that state set up and needs to be running so that the event source will\
    \ actually be monitored and wake eventually called. There are ways around this,\
    \ such as having leaf futures spawn an executor if one is not already running,\
    \ but this is not always advisable as it means that an application can transparently\
    \ end up with multiple executors running at the same time, which can reduce performance\
    \ and mean you must inspect the state of multiple executors when debugging."

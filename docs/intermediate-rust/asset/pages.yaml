- pgno: 77
  md: '```

    [patch.crates-io]

    # use a local (presumably modified) source

    regex = { path = "/home/jon/regex" }

    # use a modification on a git branch

    serde = { git = "https://github.com/serde-rs/serde.git", branch = "faster" }

    # patch a git dependency

    [patch.''https://github.com/jonhoo/project.git'']

    project = { path = "/home/jon/project" }

    ```


    Listing 6-6: Overriding dependency sources in Cargo.toml using [patch]


    Even if you patch a dependency, Cargo takes care to check the crate versions so
    that you don’t accidentally end up patching the wrong major version of a crate.
    If you for some reason transitively depend on multiple major versions of the same
    crate, you can patch each one by giving them distinct identifiers, as shown in
    Listing 6-7.


    ```

    [patch.crates-io]

    nom4 = { path = "/home/jon/nom4", package = "nom" }

    nom5 = { path = "/home/jon/nom5", package = "nom" }

    ```


    Listing 6-7: Overriding multiple versions of the same crate in Cargo.toml using
    [patch]


    Cargo will look at the Cargo.toml inside each path, realize that /nom4 contains
    major version 4 and that /nom5 contains major version 5, and patch the two versions
    appropriately. The package keyword tells Cargo to look for a crate by the name
    nom in both cases instead of using the dependency identifiers (the part on the
    left) as it does by default. You can use package this way in your regular dependencies
    as well to rename a dependency!


    Keep in mind that patches are not taken into account in the package that’s uploaded
    when you publish a crate. A crate that depends on your crate will use only its
    own [patch] section (which may be empty), not that of your crate!


    # CRATES VS. PACKAGES


    You may wonder what the difference between a package and a crate is. These two
    terms are often used interchangeably in informal contexts, but they also have
    specific definitions that vary depending on whether you’re talking about the Rust
    compiler, Cargo, crates.io, or something else. I personally think of a crate as
    a Rust module hierarchy starting at a root .rs file (one where you can use crate-level
    attributes like #![feature])—usually something like lib.rs or main.rs. In contrast,
    a package is a collection of crates and metadata, so essentially all that’s described
    by a Cargo.toml file. That may include a library crate, multiple binary crates,
    some integration test crates, and maybe even multiple workspace members that themselves
    have Cargo.toml files.'

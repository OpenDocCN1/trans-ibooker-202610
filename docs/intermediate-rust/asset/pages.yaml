  md: "unit; the Rust compiler treats a crate more or less as one big source file\
    \ compiled as one chunk that is ultimately turned into a single binary output\
    \ (either a binary or a library).\n\nWhile this simplifies many aspects of the\
    \ compiler, it also means that large crates can be painful to work with. If you\
    \ change a unit test, a comment, or a type in one part of your application, the\
    \ compiler must re-evaluate the entire crate to determine what, if anything, changed.\
    \ Internally, the compiler implements a number of mechanisms to speed up this\
    \ process, like incremental recompilation and parallel code generation, but ultimately\
    \ the size of your crate is a big factor in how long your project takes to compile.\n\
    \nFor this reason, as your project grows, you may want to split it into multiple\
    \ crates that internally depend on one another. Cargo has just the feature you\
    \ need to make this convenient: workspaces. A *workspace* is a collection of crates\
    \ (often called *subcrates*) that are tied together by a top-level *Cargo.toml*\
    \ file like the one shown in Listing 6-4.\n\n```\n```toml\n[workspace]\nmembers\
    \ = [\n    \"foo\",\n    \"bar/one\",\n    \"bar/two\",\n]\n```\n```\n\n*Listing\
    \ 6-4: A workspace Cargo.toml*\n\nThe members array is a list of directories that\
    \ each contain a crate in the workspace. Those crates all have their own *Cargo.toml*\
    \ files in their own subdirectories, but they share a single *Cargo.lock* file\
    \ and a single output directory. The crate names don’t need to match the entry\
    \ in members. It is common, but not required, that crates in a workspace share\
    \ a name prefix, usually chosen as the name of the “main” crate. For example,\
    \ in the tokio crate, the members are called tokio, tokio-test, tokio-macros,\
    \ and so on.\n\nPerhaps the most important feature of workspaces is that you can\
    \ interact with all of the workspace’s members by invoking cargo in the root of\
    \ the workspace. Want to check that they all compile? cargo check will check them\
    \ all. Want to run all your tests? cargo test will test them all. It’s not quite\
    \ as convenient as having everything in one crate, so don’t go splitting everything\
    \ into minuscule crates, but it’s a pretty good approximation.\n\n> **NOTE** \
    \ \n> *Cargo commands will generally do the “right thing” in a workspace. If you\
    \ ever need to disambiguate, such as if two workspace crates both have a binary\
    \ by the same name, use the -p flag (for package). If you are in the subdirectory\
    \ for a particular workspace crate, you can pass --workspace to perform the command\
    \ for the entire workspace instead.*\n\nOnce you have a workspace-level *Cargo.toml*\
    \ with the array of workspace members, you can set your crates to depend on one\
    \ another using path dependencies, as shown in Listing 6-5."

- pgno: 143
  md: 'Such operations should either be converted to asynchronous operations where
    possible or executed on dedicated threads that then communicate using a primitive
    that does support asynchrony, like a channel. Some executors also provide mechanisms
    for indicating that a particular segment of asynchronous code might block, or
    for yielding voluntarily in the context of loops that might otherwise not yield,
    which can comprise part of the solution. A good rule of thumb is that no future
    should be able to run for more than 1 ms without returning Poll::Pending.


    # Summary


    In this chapter, we’ve taken a look behind the scenes of the asynchronous constructs
    available in Rust. We’ve seen how the compiler implements generators and self-referential
    types, and why that work was necessary to support what we now know as async/await.
    We’ve also explored how futures are executed, and how wakers allow executors to
    multiplex among tasks when only some of them can make progress at any given moment.
    In the next chapter, we’ll tackle what is perhaps the deepest and most discussed
    area of Rust: unsafe code. Take a deep breath, and then turn the page.'

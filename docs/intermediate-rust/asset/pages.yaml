    # Existential Types


    In Rust you very rarely have to specify the types of variables you declare in
    the body of a function or the types of generic arguments to methods that you call.
    This is because of *type inference*, where the compiler decides what type to use
    based on what type the code the type appears in evaluates to. The compiler will
    usually infer types only for variables and for the arguments (and return types)
    of closures; top-level definitions like functions, types, traits, and trait implementation
    blocks all require that you explicitly name all types. There are a couple of reasons
    for this, but the primary one is that type inference is much easier when you have
    at least some known points to start the inference from. However, it’s not always
    easy, or even possible, to fully name a type! For example, if you return a closure
    from a function, or an async block from a trait method, its type does not have
    a name that you can type into your code.


    To handle situations like this, Rust supports *existential types*. Chances are,
    you have already seen existential types in action. All functions marked as `async
    fn` or with a return type of `impl Trait` have an existential return type: the
    signature does not give the true type of the return value, just a hint that the
    function returns *some* type that implements some set of traits that the caller
    can rely on. And crucially, the caller can only rely on the return type implementing
    those traits, and nothing else.


    > NOTE

    > Technically, it isn’t strictly true that the caller relies on the return type
    and nothing else. The compiler will also propagate auto-traits like Send and Sync
    through impl Trait in return position. We’ll look at this more in the next chapter.


    This behavior is what gives existential types their name: we are asserting that
    there exists some concrete type that matches the signature, and we leave it up
    to the compiler to find what that type is. The compiler will usually then go figure
    that out by applying type inference on the body of the function.'

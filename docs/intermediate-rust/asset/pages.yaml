  md: '(like Mutex) will remember if a panic occurred when they were last accessed
    and communicate that to any thread that tries to access the primitive subsequently.
    If a thread encounters such a state, it will normally also panic, which leads
    to a cascade that eventually terminates the entire program. But that is arguably
    better than continuing to run with corrupted state!


    The bookkeeping needed to support unwinding is not free, and it often requires
    special support by the compiler and the target platform. For example, many embedded
    platforms cannot unwind the stack efficiently at all. Rust therefore supports
    a different panic mode: abort ensures the whole program simply exits immediately
    when a panic occurs. In this mode, no threads get to do any cleanup. This may
    seem severe, and it is, but it ensures that the program is never running in a
    half-working state and that errors are made visible immediately.


    > WARNING

    > The panic setting is global—if you set it to abort, all your dependencies are
    also compiled with abort.


    You may have noticed that when a thread panics, it tends to print a backtrace:
    the trail of function calls that led to where the panic occurred. This is also
    a form of unwinding, though it is separate from the unwinding panic behavior discussed
    here. You can have backtraces even with panic=abort by passing -Cforce-unwind-tables
    to rustc, which makes rustc include the information necessary to walk back up
    the stack while still terminating the program on a panic.


    # PROFILE OVERRIDES


    You can set profile options for just a particular dependency, or a particular
    profile, using profile overrides. For example, Listing 6-8 shows how to enable
    aggressive optimizations for the serde crate and moderate optimizations for all
    other crates in debug mode, using the [profile.<profile-name>.package.<crate-name>]
    syntax.


    ```

    [profile.dev.package.serde]

    opt-level = 3

    [profile.dev.package."*"]

    opt-level = 2

    ```


    Listing 6-8: Overriding profile options for a specific dependency or for a specific
    mode


    This kind of optimization override can be handy if some dependency would be prohibitively
    slow in debug mode (such as decompression or video encoding), and you need it
    optimized so that your test suite won''t take several days to complete. You can
    also specify global profile defaults using a [profile.dev] (or similar) section
    in the Cargo configuration file in ~/.cargo/config.


    When you set optimization parameters for a specific dependency, keep in mind that
    the parameters apply only to the code compiled as part of that crate;



    [[test]]

    name = "custom"

    path = "tests/custom.rs"

    harness = false

    ```


    Listing 7-1: Opting out of the standard test harness


    Without the test harness, none of the magic around #[test] happens. Instead, you’re
    expected to write your own main function to run the testing code you want to execute.
    Essentially, you’re writing a normal Rust binary that just happens to be run by
    cargo test. That binary is responsible for handling all the things that the default
    harness normally does (if you want to support them), such as command line flags.
    The harness property is set separately for each integration test, so you can have
    one test file that uses the standard harness and one that does not.


    # ARGUMENTS TO THE DEFAULT TEST HARNESS


    The default test harness supports a number of command line arguments to configure
    how the tests are run. These aren’t passed to cargo test directly but rather to
    the test binary that Cargo compiles and runs for you when you run cargo test.
    To access that set of flags, pass -- to cargo test, followed by the arguments
    to the test binary. For example, to see the help text for the test binary, you’d
    run cargo test -- --help.


    A number of handy configuration options are available through these command line
    arguments. The --nocapture flag disables the output capturing that normally happens
    when you run Rust tests. This is useful if you want to observe a test’s output
    in real time rather than all at once after the test has failed. You can use the
    --test-threads option to limit how many tests run concurrently, which is helpful
    if you have a test that hangs or segfaults and you want to figure out which one
    it is by running the tests sequentially. There’s also a --skip option for skipping
    tests that match a certain pattern, --ignored to run tests that would normally
    be ignored (such as those that require an external program to be running), and
    --list to just list all the available tests.


    Keep in mind that these arguments are all implemented by the default test harness,
    so if you disable it (with harness = false), you’ll have to implement the ones
    you need yourself in your main function!


    Integration tests without a harness are primarily useful for benchmarks, as we’ll
    see later, but they also come in handy when you want to run tests that don’t fit
    the standard “one function, one test” model. For example, you’ll frequently see
    harnessless tests used with fuzzers, model checkers, and tests that require a
    custom global setup (like under WebAssembly or when working with custom targets).'

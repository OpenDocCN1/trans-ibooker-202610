  md: "# Writing Declarative Macros\n\nAn exhaustive explanation of all the syntax\
    \ that declarative macros supports is outside the scope of this book. However,\
    \ we’ll cover the basics as there are some oddities that are worth pointing out.\n\
    \nDeclarative macros consist of two main parts: *matchers* and *transcribers*.\
    \ A given macro can have many matchers, and each matcher has an associated transcriber.\
    \ When the compiler finds a macro invocation, it walks the macro’s matchers from\
    \ first to last, and when it finds a matcher that matches the tokens in the invocation,\
    \ it substitutes the invocation by walking the tokens of the corresponding transcriber.\
    \ Listing 8-4 shows how the different parts of a declarative macro rule fit together.\n\
    \n```\nmacro_rules! /* macro name */ {\n  (/* 1st matcher */) => { /* 1st transcriber\
    \ */ };\n  (/* 2nd matcher */) => { /* 2nd transcriber */ };\n}\n```\n\n*Listing\
    \ 8-4: Declarative macro definition components*\n\n# Matchers\n\nYou can think\
    \ of a macro matcher as a token tree that the compiler tries to twist and bend\
    \ in predefined ways to match the input token tree it was given at the invocation\
    \ site. As an example, consider a macro with the matcher $a:ident + $b:expr. That\
    \ matcher will match any identifier (:ident) followed by a plus sign followed\
    \ by any Rust expression (:expr). If the macro is invoked with x + 3 * 5, the\
    \ compiler notices that the matcher matches if it sets $a = x and $b = 3 * 5.\
    \ Even though * never appears in the matcher, the compiler realizes that 3 * 5\
    \ is a valid expression, and that it can therefore be matched with $b:expr, which\
    \ accepts anything that is an expression (the :expr part).\n\nMatchers can get\
    \ pretty hairy, but they have huge expressive power, much like regular expressions.\
    \ For a not-too-hairy example, this matcher accepts a sequence ($()) of one or\
    \ more (+) comma-separated (,), key/value pairs given in key => value format:\n\
    \n```\n$(\\$key:expr => $value:expr),+\n```\n\nAnd, crucially, code that invokes\
    \ a macro with this matcher can give an arbitrarily complex expression for the\
    \ key or value—the magic of matchers will make sure that the key and value expressions\
    \ are partitioned appropriately.\n\nMacro rules support a wide variety of *fragment\
    \ types*; you’ve already seen :ident for identifiers and :expr for expressions,\
    \ but there is also :ty for types, and even :tt for any single token tree! You\
    \ can find a full list of the fragment types in Chapter 3 of the Rust language\
    \ reference (https://doc.rust-lang.org/reference/macros-by-example.html). These,\
    \ plus the mechanism for matching a pattern repeatedly ($()), enable you to match\
    \ most straightforward code patterns. If, however, you find that it is difficult\
    \ to express the pattern you want with a matcher, you may want to try a procedural\
    \ macro instead,"

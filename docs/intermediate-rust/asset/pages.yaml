  md: "where you don’t need to follow the strict syntax macro_rules! requires. We’ll\
    \ look at these in more detail later in the chapter.\n\n# Transcribers\n\nOnce\
    \ the compiler has matched a declarative macro matcher, it generates code using\
    \ the matcher’s associated transcriber. The variables defined by a macro matcher\
    \ are called metavariables, and the compiler substitutes any occurrence of each\
    \ metavariable in the transcriber (like $key in the example in the previous section)\
    \ with the input that matches that part of the matcher. If you have repetition\
    \ in the matcher (like $(),+ in that same example), you can use the same syntax\
    \ in the transcriber and it will be repeated once for each match in the input,\
    \ with each expansion holding the appropriate substitution for each metavariable\
    \ for that iteration. For example, for the $key and $value matcher, we could write\
    \ the following transcriber to generate an insert call into some map for each\
    \ $key/$value pair that was matched:\n\n```\n$(map.insert($key, $value;)+\n```\n\
    \nNotice that here we want a semicolon for each repetition, not just to delimit\
    \ the repetition, so we place the semicolon inside the repetition parentheses.\
    \ You must use a metavariable in each repetition in the transcriber so that the\
    \ compiler knows which repetition in the matcher to use (in case there is more\
    \ than one).\n\n# Hygiene\n\nYou may have heard it said that Rust macros are hygienic,\
    \ and perhaps that being hygienic makes them safer or nicer to work with, without\
    \ necessarily understanding what that means. When we say Rust macros are hygienic,\
    \ we mean that a declarative macro (generally) cannot affect variables that aren’t\
    \ explicitly passed to it. A trivial example is that if you declare a variable\
    \ with the name foo, and then call a macro that also defines a variable named\
    \ foo, the macro’s foo is by default not visible at the call site (the place where\
    \ the macro is called from). Similarly, macros cannot access variables defined\
    \ at the call site (even self) unless they are explicitly passed in.\n\nYou can,\
    \ most of the time, think of macro identifiers as existing in their own namespace\
    \ that is separate from that of the code they expand into. For an example, take\
    \ a look at the code in Listing 8-5, which has a macro that tries (and fails)\

    # Memory Regions


    Now that you have a grip on how we refer to memory, we need to talk about what
    memory actually is. There are many different regions of memory, and perhaps surprisingly,
    not all of them are stored in the DRAM of your computer. Which part of memory
    you use has a significant impact on how you write your code. The three most important
    regions for the purposes of writing Rust code are the stack, the heap, and static
    memory.


    # The Stack


    The stack is a segment of memory that your program uses as scratch space for function
    calls. Each time a function is called, a contiguous chunk of memory called a frame
    is allocated at the top of the stack. Near the bottom of the stack is the frame
    for the main function, and as functions call other functions, additional frames
    are pushed onto the stack. A function’s frame contains all the variables within
    that function, along with any arguments the function takes. When the function
    returns, its stack frame is reclaimed.


    The bytes that make up the values of the function’s local variables are not immediately
    wiped, but it’s not safe to access them as they may have been overwritten by a
    subsequent function call whose frame overlaps with the reclaimed one. And even
    if they haven’t been overwritten, they may contain values that are illegal to
    use, such as ones that were moved when the function returned.


    Stack frames, and crucially the fact that they eventually disappear, are very
    closely tied to the notion of lifetimes in Rust. Any variable stored in a'

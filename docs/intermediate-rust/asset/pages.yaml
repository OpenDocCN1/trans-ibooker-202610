- pgno: 15
  md: '# Interior Mutability


    Some types provide *interior mutability*, meaning they allow you to mutate a value
    through a shared reference. These types usually rely on additional mechanisms
    (like atomic CPU instructions) or invariants to provide safe mutability without
    relying on the semantics of exclusive references. These normally fall into two
    categories: those that let you get a mutable reference through a shared reference,
    and those that just let you mutate through a shared reference.


    The first category consists of types like Mutex and RefCell, which contain safety
    mechanisms to ensure that, for any value they give a mutable reference to, only
    one mutable reference (and no shared references) can exist at a time. Under the
    hood, these types (and those like them) all rely on a type called UnsafeCell,
    whose name should immediately make you hesitate to use it. We will cover UnsafeCell
    in more detail in Chapter 10, but for now you should know that it is the *only*
    correct way to mutate through a shared reference.


    Other categories of types that provide interior mutability are those that do not
    give out a mutable reference to the inner value but instead just give you methods
    for manipulating that value in place. The atomic integer types in std::sync::atomic
    and the std::cell::Cell type fall into this category. You cannot get a reference
    directly to the usize or i32 behind such a type, but you can read and replace
    its value at a given point in time.


    > NOTE

    > The Cell type in the standard library is an interesting example of safe interior
    mutability through invariants. It is not shareable across threads and never gives
    out a reference to the value contained in the Cell. Instead, the methods all either
    replace the value entirely or return a copy of the contained value. Since no references
    can exist to the inner value, it is always okay to move it. And since Cell isn’t
    shareable across threads, the inner value will never be concurrently mutated even
    though mutation happens through a shared reference.


    # Lifetimes


    If you’re reading this book, you’re probably already familiar with the concept
    of lifetimes, likely through repeated notices from the compiler about lifetime
    rules violations. That level of understanding will serve you well for the majority
    of Rust code you will write, but as we dive deeper into the more complex parts
    of Rust, you will need a more rigorous mental model to work with.


    Newer Rust developers are often taught to think of lifetimes as corresponding
    to scopes: a lifetime begins when you take a reference to some variable and ends
    when that variable is moved or goes out of scope. That’s often correct, and usually
    useful, but the reality is a little more complex. A *lifetime* is really a name
    for a region of code that some reference must be valid for. While a lifetime will
    frequently coincide with a scope, it does not have to, as we will see later in
    this section.'

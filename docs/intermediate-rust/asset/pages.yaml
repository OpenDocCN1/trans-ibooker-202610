  md: 'many codegen units. Since the LTO is performed only within each crate, rather
    than across crates, this extra pass isn''t too onerous, and the added compile
    time should be lower than the amount of time saved by using a lot of codegen units.
    Rust also offers a technique known as thin LTO, which allows the LTO pass to be
    mostly parallelized, at the cost of missing some optimizations a “full” LTO pass
    would have found.


    > NOTE LTO can be used to optimize across foreign function interface boundaries
    in many cases, too. See the linker-plugin-lto rustc flag for more details.


    The [profile] section also supports flags that aid in debugging, such as debug,
    debug-assertions, and overflow-checks. The debug flag tells the compiler to include
    debug symbols in the compiled binary. This increases the binary size, but it means
    that you get function names and such, rather than just instruction addresses,
    in backtraces and profiles. The debug-assertions flag enables the debug_assert!
    macro and other related debug code that isn''t compiled otherwise (through cfg(debug_assertions)).
    Such code may make your program run slower, but it makes it easier to catch questionable
    behavior at runtime. The overflow-checks flag, as the name implies, enables overflow
    checks on integer operations. This slows them down (notice a trend here?) but
    can help you catch tricky bugs early on. By default, these are all enabled in
    debug mode and disabled in release mode.


    # [profile.*.panic]


    The [profile] section has another flag that deserves its own subsection: panic.
    This option dictates what happens when code in your program calls panic!, either
    directly or indirectly through something like unwrap. You can set panic to either
    unwind (the default on most platforms) or abort. We''ll talk more about panics
    and unwinding in Chapter 10, but I''ll give a quick summary here.


    Normally in Rust, when your program panics, the thread that panicked starts unwinding
    its stack. You can think of unwinding as forcibly returning recursively from the
    current function all the way to the bottom of that thread''s stack. That is, if
    main called foo, foo called bar, and bar called baz, a panic in baz would forcibly
    return from baz, then bar, then foo, and finally from main, resulting in the program
    exiting. A thread that unwinds will drop all values on the stack normally, which
    gives the values a chance to clean up resources, report errors, and so on. This
    gives the running system a chance to exit gracefully even in the case of a panic.


    When a thread panics and unwinds, other threads continue running unaffected. Only
    when (and if) the thread that ran main exits does the program terminate. That
    is, the panic is generally isolated to the thread in which the panic occurred.


    This means unwinding is a double-edged sword; the program is limping along with
    some failed components, which may cause all sorts of strange behaviors. For example,
    imagine a thread that panics halfway through updating the state in a Mutex. Any
    thread that subsequently acquires that Mutex must now be prepared to handle the
    fact that the state may be in a partially updated, inconsistent state. For this
    reason, some synchronization primitives'

  md: '# Minimal Dependency Versions


    When you first add a dependency, it’s not always clear what version specifier
    you should give that dependency. Programmers commonly choose the latest version,
    or just the current major version, but chances are that both of those choices
    are wrong. By “wrong,” I don’t mean that your crate won’t compile, but rather
    that making that choice may cause strife for users of your crate down the line.
    Let’s look at why each of these cases is problematic.


    First, consider the case where you add a dependency on `hugs = "1.7.3"`, the latest
    published version. Now imagine that a developer somewhere depends on your crate,
    but they also depend on some other crate, foo, that itself depends on hugs. Further
    imagine that the author of foo is really careful about their MSRV policy, so they
    depend on `hugs = "1, <1.6"`. Here, you’ll run into trouble. When Cargo sees `hugs
    = "1.7.3"`, it considers only versions >=1.7. But then it sees that foo’s dependency
    on hugs requires <1.6, so it gives up and reports that there is no version of
    hugs compatible with all the requirements.


    > *In practice, there are a number of reasons why a crate may explicitly not want
    a newer version of a dependency. The most common ones are to enforce MSRV, to
    meet enterprise auditing requirements (the newer version will contain code that
    hasn’t been audited), and to ensure reproducible builds where only the exact listed
    version is used.*


    This is unfortunate, as it could well be that your crate compiles fine with, say,
    `hugs 1.5.6`. Maybe it even compiles fine with any 1.x version! But by using the
    latest version number, you are telling Cargo to consider only versions at or beyond
    that minor version. Is the solution to use `hugs = "1"` instead, then? No, that’s
    not quite right either. It could be that your code truly does depend on something
    that was added only in hugs 1.6, so while 1.6.2 would be fine, 1.5.6 would not
    be. You wouldn’t notice this if you were only ever compiling your crate in situations
    where a newer version ends up getting used, but if some crate in the dependency
    graph specifies `hugs = "1, <1.5"`, your crate would not compile!


    The right strategy is to list the earliest version that has all the things your
    crate depends on and to make sure that this remains the case even as you add new
    code to your crate. But how do you establish that beyond trawling the changelogs,
    or through trial and error? Your best bet is to use Cargo’s unstable `-Z minimal-versions`
    flag, which makes your crate use the minimum acceptable version for all dependencies,
    rather than the maximum. Then, set all your dependencies to just the latest major
    version number, try to compile, and add a minor version to any dependencies that
    don’t. Rinse and repeat until everything compiles fine, and you now have your
    minimum version requirements!


    It’s worth noting that, like with MSRV, minimal version checking faces an ecosystem
    adoption problem. While you may have set all your version specifiers correctly,
    the projects you depend on may not have. This makes the Cargo minimal versions
    flag hard to use in practice (and is why it’s still unstable). If you depend on
    foo, and foo depends on bar with a specifier of `bar = "1"` when it actually requires
    `bar = "1.4"`, Cargo will report that it failed to compile foo no matter how you
    list foo because the `-Z` flag tells it'

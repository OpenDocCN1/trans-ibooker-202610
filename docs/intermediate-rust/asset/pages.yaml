- pgno: 89
  md: '# Rust Testing Mechanisms


    To understand the various testing mechanisms Rust provides, you must first understand
    how Rust builds and runs tests. When you run cargo test --lib, the only special
    thing Cargo does is pass the --test flag to rustc. This flag tells rustc to produce
    a test binary that runs all the unit tests, rather than just compiling the crate’s
    library or binary. Behind the scenes, --test has two primary effects. First, it
    enables cfg(test) so that you can conditionally include testing code (more on
    that in a bit). Second, it makes the compiler generate a test harness: a carefully
    generated main function that invokes each #[test] function in your program when
    it’s run.


    # The Test Harness


    The compiler generates the test harness main function through a mix of procedural
    macros, which we’ll discuss in greater depth in Chapter 8, and a light sprinkling
    of magic. Essentially, the harness transforms every function annotated by #[test]
    into a test descriptor—this is the procedural macro part. It then exposes the
    path of each of the descriptors to the generated main function—this is the magic
    part. The descriptor includes information like the test’s name, any additional
    options it has set (like #[should_panic]), and so on. At its core, the test harness
    iterates over the tests in the crate, runs them, captures their results, and prints
    the results. So, it also includes logic to parse command line arguments (for things
    like --test-threads=1), capture test output, run the listed tests in parallel,
    and collect test results.


    As of this writing, Rust developers are working on making the magic part of test
    harness generation a publicly available API so that developers can build their
    own test harnesses. This work is still at the experimental stage, but the proposal
    aligns fairly closely with the model as it exists today. Part of the magic that
    needs to be figured out is how to ensure that #[test] functions are available
    to the generated main function even if they are inside private submodules.


    Integration tests (the tests in tests/) follow the same process as unit tests,
    with the one exception that they are each compiled as their own separate crate,
    meaning they can access only the main crate’s public interface and are run against
    the main crate compiled without #[cfg(test)]. A test harness is generated for
    each file in tests/. Test harnesses are not generated for files in subdirectories
    under tests/ to allow you to have shared submodules for your tests.


    NOTE If you explicitly want a test harness for a file in a subdirectory, you can
    opt in to that by calling the file main.rs.


    Rust does not require that you use the default test harness. You can instead opt
    out of it and implement your own main method that represents the test runner by
    setting harness = false for a given integration test in Cargo.toml, as shown in
    Listing 7-1. The main method that you define will then be invoked to run the test.'

  md: '# [profile]


    The [profile] section lets you pass additional options to the Rust compiler in
    order to change the way it compiles your crate. These options fall primarily into
    three categories: performance options, debugging options, and options that change
    code behavior in user-defined ways. They all have different defaults depending
    on whether you are compiling in debug mode or in release mode (other modes also
    exist).


    The three primary performance options are opt-level, codegen-units, and lto. The
    opt-level option tweaks runtime performance by telling the compiler how aggressively
    to optimize your program (0 is “not at all,” 3 is “as much as you can”). The higher
    the setting, the more optimized your code will be, which *may* make it run faster.
    Extra optimization comes at the cost of higher compile times, though, which is
    why optimizations are generally enabled only for release builds.


    > You can also set opt-level to "s" to optimize for binary size, which may be
    important on embedded platforms.


    You can also set opt-level to "s" to optimize for binary size, which may be important
    on embedded platforms.


    The codegen-units option is about compile-time *performance*. It tells the compiler
    how many independent compilation tasks (*code generation units*) it is allowed
    to split the compilation of a single crate into. The more pieces a large crate’s
    compilation is split into, the faster it will compile, since more threads can
    help compile the crate in parallel. Unfortunately, to achieve this speedup, the
    threads need to work more or less independently, which means code optimization
    suffers. Imagine, for example, that the segment of a crate compiling in one thread
    could benefit from inlining some code in a different segment—since the two segments
    are independent, that inlining can’t happen! This setting, then, is a trade-off
    between compile-time performance and runtime performance. By default, Rust uses
    an effectively unbounded number of codegen units in debug mode (basically, “compile
    as fast as you can”) and a smaller number (16 at the time of writing) in release
    mode.


    The lto setting toggles *link-time optimization (LTO)*, which enables the compiler
    (or the linker, if you want to get technical about it) to jointly optimize bits
    of your program, known as *compilation units*, that were originally compiled separately.
    The exact details of LTO are beyond the scope of this book, but the basic idea
    is that the output from each compilation unit includes information about the code
    that went into that unit. After all the units have been compiled, the linker makes
    another pass over all of the units and uses that additional information to optimize
    the combined compiled code. This extra pass adds to the compile time but recovers
    most of the runtime performance that may have been lost due to splitting the compilation
    into smaller parts. In particular, LTO can offer significant performance boosts
    to performance-sensitive programs that might benefit from cross-crate optimization.
    Beware, though, that cross-crate LTO can add a lot to your compile time.


    Rust performs LTO across all the codegen units within each crate by default in
    an attempt to make up for the lost optimizations caused by using'

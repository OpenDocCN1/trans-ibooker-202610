    # Changelogs


    For all but the most trivial crates, I highly recommend keeping a changelog. There
    is little more frustrating than seeing that a dependency has received a major
    version bump and then having to dig through the Git logs to figure out what changed
    and how to update your code. I recommend that you do not just dump your Git logs
    into a file named changelog, but instead keep a manual changelog. It is much more
    likely to be useful.


    A simple but good format for changelogs is the Keep a Changelog format documented
    at https://keepachangelog.com/.


    # Unreleased Versions


    Rust considers version numbers even when the source of a dependency is a directory
    or a Git repository. This means that semantic versioning is important even when
    you have not yet published a release to crates.io; it matters what version is
    listed in your Cargo.toml between releases. The semantic versioning standard does
    not dictate how to handle this case, but I''ll provide a workflow that works decently
    well without being too onerous.


    After you''ve published a release, immediately update the version number in your
    Cargo.toml to the next patch version with a suffix like -alpha.1. If you just
    released 2.0.3, make the new version 2.0.4-alpha.1. If you just released an alpha,
    increment the alpha number instead.


    As you make changes to the code between releases, keep an eye out for additive
    or breaking changes. If one happens, and the corresponding version number has
    not changed since the last release, increment it. For example, if the last released
    version is 2.0.3, the current version is 2.0.4-alpha.2, and you make an additive
    change, make the version with the change 2.1.0-alpha.1. If you made a breaking
    change, it becomes 3.0.0-alpha.1 instead. If the corresponding version increase
    has already been made, just increment the alpha number.


    When you make a release, remove the suffix (unless you want to do a prerelease),
    then publish, and start from the top.


    This process is effective because it makes two common workflows work much better.
    First, imagine that a developer depends on major version 2 of your crate, but
    they need a feature that''s currently available only in Git. Then you commit a
    breaking change. If you don''t increase the major version at the same time, their
    code will suddenly fail in unexpected ways,'

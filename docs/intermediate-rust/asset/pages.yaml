  md: 'If your crate moves from itercrate 1.0 to itercrate 2.0 but otherwise does
    not change, the code in this listing will no longer compile. Even though no types
    have changed, the compiler believes (correctly) that itercrate1.0::Empty and itercrate2.0::Empty
    are different types. Therefore, you cannot assign the latter to the former, making
    this a breaking change in your interface.


    To mitigate issues like this, it’s often best to wrap foreign types using the
    newtype pattern, and then expose only the parts of the foreign type that you think
    are useful. In many cases, you can avoid the newtype wrapper altogether by using
    impl Trait to provide only the very minimal contract to the caller. By promising
    less, you make fewer changes breaking.


    # THE SEMVER TRICK


    The itercrate example may have rubbed you the wrong way. If the Empty type did
    not change, then why does the compiler not allow anything that uses it to keep
    working, regardless of whether the code is using version 1.0 or 2.0 of it? The
    answer is . . . complicated. It boils down to the fact that the Rust compiler
    does not assume that just because two types have the same fields, they are the
    same. To take a simple example of this, imagine that itercrate 2.0 added a #[derive(Copy)]
    for Empty. Now, the type suddenly has different move semantics depending on whether
    you are using 1.0 or 2.0! And code written with one in mind won’t work with the
    other.


    This problem tends to crop up in large, widely used libraries, where over time,
    breaking changes are likely to have to happen somewhere in the crate. Unfortunately,
    semantic versioning happens at the crate level, not the type level, so a breaking
    change anywhere is a breaking change everywhere.


    But all is not lost. A few years ago, David Tolnay (the author of serde, among
    a vast number of other Rust contributions) came up with a neat trick to handle
    exactly this kind of situation. He called it “the semver trick.” The idea is simple:
    if some type T stays the same across a breaking change (from 1.0 to 2.0, say),
    then after releasing 2.0, you can release a new 1.0 minor version that depends
    on 2.0 and replaces T with a re-export of T from 2.0.


    By doing this, you’re ensuring that there is in fact only a single type T across
    both major versions. This, in turn, means that any crate that depends on 1.0 will
    be able to use a T from 2.0, and vice versa. And because this happens only for
    types you explicitly opt into with this trick, changes that were in fact breaking
    will continue to be.



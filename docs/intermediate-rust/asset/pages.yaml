  md: 'its public and stable API. That is, if the method foo in your library returns
    lib::MyError as a Box<dyn Error>, would changing foo to return a different error
    type be a breaking change? The type signature hasn’t changed, but users may have
    written code that assumes that they can use downcast to turn that error back into
    lib::MyError. My opinion on this matter is that you chose to return Box<dyn Error>
    (and not lib::MyError) for a reason, and unless explicitly documented, that does
    not guarantee anything in particular about downcasting.


    You may wonder how Error::downcast_ref can be safe. That is, how does it know
    whether a provided dyn Error argument is indeed of the given type T? The standard
    library even has a trait called Any that is implemented for any type, and which
    implements downcast_ref for dyn Any—how can that be okay? The answer lies in the
    compiler-supported type std::any::TypeId, which allows you to get a unique identifier
    for any type. The Error trait has a hidden provided method called type_id, whose
    default implementation is to return TypeId::of::<Self>(). Similarly, Any has a
    blanket implementation of impl Any for T, and in that implementation, its type_id
    returns the same. In the context of these impl blocks, the concrete type of Self
    is known, so this type_id is the type identifier of the real type. That provides
    all the information downcast_ref needs. downcast_ref calls self.type_id, which
    forwards through the vtable for dynamically sized types (see Chapter 3) to the
    implementation for the underlying type and compares that to the type identifier
    of the provided downcast type. If they match, then the type behind the dyn Error
    or dyn Any really is T, and it is safe to cast from a reference to one to a reference
    to the other.


    # Special Error Cases


    Some functions are fallible but cannot return any meaningful error if they fail.
    Conceptually, these functions have a return type of Result<T, ()>. In some codebases,
    you may see this represented as Option<T> instead. While both are legitimate choices
    for the return type for such a function, they convey different semantic meanings,
    and you should usually avoid “simplifying” a Result<T, ()> to Option<T>. An Err(())
    indicates that an operation failed and should be retried, reported, or otherwise
    handled exceptionally. None, on the other hand, conveys only that the function
    has nothing to return; it is usually not considered an exceptional case or something
    that should be handled. You can see this in the #[must_use] annotation on the
    Result type—when you get a Result, the language expects that it is important to
    handle both cases, whereas with an Option, neither case actually needs to be handled.


    > NOTE You should also keep in mind that () does not implement the Error trait.
    This means that it cannot be type-erased into Box<dyn Error> and can be a bit
    of a pain to use with ?. For this reason, it is often better to define your own
    unit struct type, implement Error for it, and use that as the error instead of
    () in these cases.'

  - 12. 此处的大部分信息源自 Adler & Gundersen (2007)。请注意，“西方”文化是一个统称，指北美和西欧。但即使在这些地理区域内，文化价值观或规范也存在差异，可能影响问题解决和决策。例如，尽管大胆且快速的决策在美国商业中更为常见，但在德国，缓慢且规避风险的决策才是常态。

  - 13. 有关此研究的更多信息，参见 Javidan, M., Dorfman, P., W. Sully de Luque, M., & House R.
  J. (2006)。旁观者之眼：来自 GLOBE 项目的跨文化领导经验。《管理学展望》，20(1)，67–90。另见 House, R. J., Dorfman,
  P. W., Javidan, M., Hanges, P. J., & Sully de Luque, M. F. (2014)。跨文化战略领导力：GLOBE
  对 24 个国家 CEO 领导行为与有效性的研究。洛杉矶：Sage。

  - 14. 参见 Javidan, M., & Bowen, D. (2013)。经理的“全球思维”：它是什么、为什么重要以及如何培养。《组织动态》，42，145–155。另见
  Levy, O., Beechler, S., Taylor, S., & Boyacigiller, N. (2007)。当我们谈论“全球思维”时我们在谈论什么：跨国公司中的管理认知。《国际商业研究杂志》，38，231–258。

  - 15. 例如，参见 Levy 等人 (2007) 的工作。

  - 16. 参见 Tallman, S., & Pedersen, T. (2015)。什么是国际战略研究，什么不是？《全球战略杂志》，5，273–277。


  本教材配套的FlatWorld Homework通过易于使用的界面提供。可用多项选择题、填空题、匹配题和其他题型，且均可自动评分。利用作业题目的学生应该能看到他们在使用采纳者提供的Word文档或LMS包中的测试项目文件问题所进行的考试中的表现有所提高。


  ## 在线测验


  本教材在线版本的各章节和各部分均提供用于学生自我评估的测验问题。学生可以使用测验在阅读不同部分时或在完成一章后测试自己的理解情况。


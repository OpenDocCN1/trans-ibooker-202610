  ## 结论


  在全球背景下领导会对领导者的有效性带来特殊挑战。


  在本章中，我们首先探讨了全球领导力的含义。


  然后，通过以美国文化为例，我们确定了在准确理解其他文化之前，首先了解自己文化背景的重要性。


  接着，我们描述了具有全球领导者取向的各个方面如何为领导和影响不同文化的人们提供基础。


  我们还警告要防范文化误解以及可能因此对其他文化的人形成的负面归因。


  ### 10.5 讨论问题


  - 1. 你觉得哪些方面尤其突出，能够将美国文化与其他社会文化区分开来？你认为美国文化正在发生变化吗？如果是，是变好了还是变坏了？


  - 2. 对于想要成为更多“全球领导者”的领导者来说，了解本国文化可能与其他文化有何不同，为什么很重要？


  - 3. 参加第6节中可找到的“全球取向调查”。你的得分对你作为全球领导者的发展意味着什么？（提示：从知识技能与情感准备或投入度的角度思考。）


  - 4. 为什么民族主义是一个复杂的问题，因为这个问题周围既有负面的方面也有不那么负面的方面？为什么民族主义/全球主义是领导者需要越来越多地处理的又一个领导悖论？领导者有可能同时具有民族主义和全球取向吗？如果可能，如何实现？举个例子。为了更好地解决这些问题，阅读这篇文章将有所帮助。



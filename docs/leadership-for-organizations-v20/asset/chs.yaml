- '## 第 12 章 战略领导力与塑造组织文化


  > “如果您真的要转型一个企业，就必须了解文化……我花了五十五岁的年纪才明白这一点。文化就是一切。”——IBM 1993–2002 年首席执行官 Lou Gerstner


  ### 学习目标


  - 1. 解释竞争优势的关键要素，以及塑造组织文化与实现此类优势的相关性。

  - 2. 描述将文化与愿景、使命和战略保持一致所涉及的问题。

  - 3. 确定文化强度可能是好事也可能是坏事。

  - 4. 解释并管理领导者创建和强化文化所采取的步骤。


  在本书的前几章中，我们主要考虑了组织中不同管理层级相关的领导素质和行为。在第 10 章中，我们开始在考察核心宗旨和愿景时，将注意力转向更具战略性或更高层级的管理层。在本章和下一章中，我们继续关注战略领导力。战略领导力的宏观目标是为企业创造
  **竞争优势**。什么是竞争优势？回答这个问题的一种方法是采用基于资源的视角，以理解企业的宝贵资源，以及这些资源如何用于创造竞争优势。如果资源满足以下条件，则可创造此类优势：


  - 有价值，能使企业提高效率和效能；

  - 稀有且不易被其他企业模仿；以及

  - 非替代性或不易被其他非稀缺资源取替。[1]


  **竞争优势**


  企业基于有价值、稀有且不易模仿、非替代性资源为自身创造的优势。


  组织文化是企业实现竞争优势的一种途径。文化可以很有价值；例如，在可能激励员工、帮助服务客户以及激发创新方面。但是，仅有价值并不能保证竞争优势。如果某个有价值的东西可以被竞争对手轻易复制或模仿，那么它就不能作为竞争优势。尽管如此，文化不容易被复制或模仿，因为它涉及价值观、信念和规范等要素，这些要素需要长时间发展，并在组织成员中深植和共享。此外，文化及其创造的潜在价值是非替代性的。换句话说，它不能轻易被非稀缺资源（例如培训计划）所取代。换句话说，文化可以创造的有价值效果在很大程度上仅属于文化本身。本章后面在讨论领导文化的机制时，我们将看到培训计划如何帮助巩固或深植文化。但是，培训本身不应被视为文化作为竞争优势的替代品。


  本章所描绘的，战略领导者的职责是识别、保护和培育符合上述竞争优势标准的资源。领导者通过以下三个关键步骤来做到这一点：


  - 1. 建立或重新定向使命（或核心宗旨）以及共同愿景

  - 2. 制定战略

  - 3. 实施使命、愿景和战略


  第 2 步，制定战略，是战略管理书籍和课程中主要讨论的问题。第 1 步和第 3 步涉及战略领导力，这就是为什么我们在这本书中关注这两个步骤。在一定程度上，我们在第
  11 章中解决了第 1 步，我们将在第 13 章中继续讨论“重新定向”，因为我们正在考虑战略领导力在组织变革中的作用。在本章中，我们考虑战略领导者如何利用第 3
  步来塑造组织文化，以建立、实施，有时还要重新定向使命、愿景和战略——最终帮助实现竞争优势。在进一步描述领导力、文化和竞争优势之间的联系之前，我们首先关注组织的背景或环境如何创造持续需要积极的战略领导力，包括构建和塑造组织文化。


  ### 12.1 环境背景、竞争优势与组织文化


  将战略领导力置于背景中很重要；具体来说，是企业的环境背景。在很多方面，战略领导力关乎持续监控或扫描组织的环境背景，以确定新趋势、威胁和机遇——所有这些都可能（积极或消极）影响竞争优势。该背景大致可沿三个维度来描述：


  - 1. 经济（即全球化趋势、竞争加剧）；

  - 2. 监管（即可能影响企业开展业务方式的不断变化的地方、国家和全球法律/法规）；以及

  - 3. 技术（即不断变化的技术如何影响工作流程、产品和服务）。


  环境的某些方面对特定企业的相关性程度不一，取决于其业务和客户的性质。例如，监管问题尤其与医疗保健和能源行业相关。技术问题尤其与电子行业的企业相关。无论企业在哪个行业竞争，战略领导者的职责都是持续关注可能挑战现状的趋势和变化，即组织当前如何在其环境中运作以保持竞争优势。在本章中，我们的重点是战略领导者如何构建或塑造组织文化，以帮助确保其企业在环境中保持竞争力。如果存在文化差距，那么组织的价值观、规范和行为将不会与其环境的需求或要求保持一致，这可能会导致竞争劣势。换句话说，理想文化与实际行为之间会存在差异。战略领导者的职责是识别何时出现此类差距，然后采取措施缩小差距。


  让我们举个例子。20 世纪 90 年代初，IBM 公司正在走下坡路。其股价暴跌，许多华尔街分析师呼吁拆分该公司并分块出售。到 1992 年，已有超过 60,000
  个工作岗位流失，尽管前任首席执行官努力推动转型，公司似乎已走投无路。1993 年，Lou Gerstner 成为 IBM 历史上首位被任命为首席执行官的外部人士。在接下来的十年里，在他的领导下，该公司从一家失败的电脑制造商转型为一家成功的软件和服务企业。在描述这次转型时，Gerstner
  声称，之前的管理层无法转型 IBM 的主要原因并非由于尝试执行新战略。相反，情况是价值观和文化是为早期的时间点和其他战略而创建的。他主张：“直到我们解决了文化、价值观和行为问题，我们才能改变
  IBM。”[4]


  ### 组织文化与竞争优势


  举几个例子，可以说明在航空业取得成功有多难，这就是为什么组织文化（以及随之而来的领导力）可能成为竞争优势。

  http://en.wikipedia.org/wiki/Timeline_of_airline_bankruptcies

  https://www.cnn.com/2017/04/10/travel/passenger-removed-united-flight-trnd/index.html


  IBM 的故事只是众多例子之一，在这些例子中，组织文化和领导力被视为竞争优势的来源（例如西南航空、谷歌、诺德斯特龙、Zappos），或者作为变革的障碍和竞争劣势的来源（例如
  IBM、富国银行、柯达、安然）。德勤最近的一项研究揭示，86% 的美国高管认为文化是潜在的竞争优势，对企业成功至关重要。[5] 对高管的另一项最近调查发现，78%
  的财富 1000 强首席执行官和首席财务官将文化视为影响企业价值的前三个因素之一。[6] 研究人员对该主题的回顾揭示了该话题上超过 4,600 项研究。[7]
  然而，尽管受到所有这些关注，人们对什么是文化以及如何管理文化仍缺乏清晰认识。例如，在德勤研究中，68% 的受访者表示他们不理解文化，只有 19% 认为其组织拥有正确的文化。


  公司领导显然认为文化很重要，但文化究竟是什么？为什么它对于创造竞争优势如此重要？也许最重要的是，领导者如何创建、管理和改变文化？如果我们不清楚什么是文化，那么就很难看出它可能对竞争优势有何重要性，更重要的是，领导者如何创建和改变它。我们将在本章中解决这些问题。通过这样做，您将看到当文化与战略正确对齐时，它可以成为竞争优势的明确来源。或者，当文化不匹配时，它会阻碍战略的实施并成为竞争劣势。



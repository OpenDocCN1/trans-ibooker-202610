  \n在在线阅读器中查看\n\n## 结论\n\n道德、合乎道德和负责任的领导力形式显然非常重要，也是领导者、追随者以及整个社会关注的焦点。正如本章所见，与这些领导力方面相关的问题既复杂，有时也不够明确。领导者可以采取多种行动来展示这种领导力。但与此同时，领导者需要做出选择，这些选择最终将塑造其在工作场所中的道德、合乎道德和责任方式。总体而言，这一话题在未来几年可能变得更加重要。\n\

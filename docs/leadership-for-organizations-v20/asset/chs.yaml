  \ | |\n| 9. [ ] 如果其他人能够从“系统”中获益或“利用”系统，我会尝试做同样的事，而不是被甩在后面成为“冤大头”。 | |\n| **请使用上述量表回答第10–12题。**\
  \ | |\n| 10. [ ] 我总是做“正确”的事，即使对我重要的其他人（例如，我的老板、同事、同学、家人等）不做“正确”的事。 | |\n| 11. [\
  \ ] 一般来说，只要能避免惹上麻烦，我会做大多数需要做的事情来实现我的目标。 | |\n| 12. [ ] 如果我认真想想，我通常会追随我所关联的群体或组织的规范，而不会仔细考虑那些规范是“正确”还是“错误”。\
  \ | |\n\n### 评分\n\n将下列各项的分数相加，如下所示：\n\n| 第1水平（习前） | 第2水平（习俗） | 第3水平（后习俗） |\n|---|---|---|\n\
  | 2 | 3 | 1 |\n| 6 | 4 | 5 |\n| 7 | 9 | 8 |\n| 11 | 12 | 10 |\n\n例如，如果第2、6、7和11项的得分都为1，则你的第1水平总分将等于4。请注意，每一列或每个水平的可能得分范围为4–12，且所有三列的总和应为24。对于每一列：\n\
  \n- * 得分4–6 = 该水平非常强\n- * 得分7–9 = 该水平中等\n- * 得分10–12 = 该水平较弱\n\n### 6.5 附录B：和谐公司的信息共享（或不共享）\n\
  \n和谐公司（虚构名称）是一种日益增长的天然加工食品产品线的生产商和分销商。该公司以在生产中使用全天然成分并尽量减少加工来制作食物而自豪。他们的食品大多包括包装或瓶装物品，例如谷物、薯片、饼干、花生酱和果酱以及果汁。他们的产品主要在美国各地的天然食品商店和杂货店销售，最近还扩展到了加拿大和欧洲。\n\
  \n该公司雇佣约1000名员工，其设施位于美国西南部地区。该公司30年前由四位合伙人创立，至今仍是一家私营公司，此前曾抵制公开上市的机会。创始合伙人坚信尊重自然环境、帮助流浪汉（例如捐赠公司产品）以及为员工维持健康的工作环境。此外，他们还提供了良好的医疗保健福利、优厚的退休福利、为员工子女提供日托服务以及员工工作保障。管理层认为，这些政策和做法已经形成了一支敬业且忠诚的员工队伍。\n\
  \n该公司实现了强劲的销售增长，尤其是近年来，随着健康意识消费者需求的增加。此外，利润也很强劲，这在很大程度上归功于公司员工的效率和创新理念。管理层还考虑将产品线扩展到易腐食品、化妆品等领域。此外，还计划直接与一家专门经营天然食品的杂货店连锁合作，生产带有该连锁店标签的产品。总的来说，和谐公司的未来前景光明。另一方面，所有合伙人都快到退休年龄，且没有家庭成员准备接手公司。\n\
  \n### 收购提案\n\n近日，Dynamic Foods, Inc.（虚构名称）的官员以收购提案接近了和谐公司的创始合伙人。Dynamic Foods是一家总部位于伊利诺伊州芝加哥的大型上市食品加工公司。它注意到市场向天然加工食品发展的趋势，并希望在此市场占据一席之地。因此，收购和谐公司似乎颇具吸引力。此外，Dynamic\
  \ Foods将能够获得关于天然食品加工的技术知识，这些知识甚至可以转移到其主营业务的食品加工中。\n\n和谐公司的合伙人对最初的提案颇感兴趣。如上所述，他们都最近在考虑退休，Dynamic\
  \ Foods, Inc.的报价似乎非常有前景。看来经过一些努力，可能会达成一项交易。确实，两家公司正越来越接近达成一项初步协议，交易达成的可能性相当大。\n\n\
  Dynamic Foods, Inc.过去曾因其他收购交易而启动重组和裁员。因此，如果发生收购，它可能会利用和谐公司的资源来寻找改善其盈利能力的方法，即使这意味着裁员和解雇。作为交易中的收购方，他们随后如何管理目标公司（即和谐公司）将由Dynamic\
  \ Foods, Inc.决定，而不是由和谐公司决定。确实，如果发生收购，和谐公司很可能会出现大规模裁员。\n\n合伙人之间对于如何就Dynamic Foods,\
  \ Inc.的提案与员工和其他人分享信息存在分歧。其中几位合伙人认为，谨慎的做法是不泄露任何信息。换句话说，和谐公司的这些合伙人希望将即将发生的收购消息对员工和媒体保密。他们的想法是，如果员工知道即将达成的交易，他们可能会大声抗议，谈论他们的恐惧以及对自身和社区的潜在负面影响。此外，他们可能会向当地媒体投诉，试图传播他们的不满。尽管员工在过去受到了良好的对待，但被Dynamic\
  \ Foods收购的可能性甚至可能引发工作放缓或破坏公司设施。此类员工负面行为的结果是，最终达成交易可能会变得困难甚至不可能。\n\n相比之下，对于其他合伙人来说，谨慎的做法是向员工披露即将达成的交易的信息，目的是让他们了解情况，了解他们对相关替代方案的意见，并保持积极的士气。毕竟，这种行为更符合该公司在过去开展员工关系的方式。\n\
  \n### 即将召开的会议\n\n虽然你们公司没有工会，但一位合伙人每周与员工代表会面，讨论员工关切和管理层的新计划。合伙人和基层经理通常认为，这种主动的员工关系方式使员工没有寻求工会代表。最近，员工代表为本周的会议向该合伙人发送了一封电子邮件。在这封信中，他表示，他听说工厂里Dynamic\
  \ Foods, Inc.的访客最近参观了公司场地并参观了工厂。他只是想知道此次访问是怎么回事，并且表示希望将此事列为本周会议的首要议程。在会议中，他肯定会问一些尖锐的问题。\n\
  \n想象你正在扮演即将与员工代表开会的这位合伙人的角色。同时，想象代表在会议开始时问道：“Dynamic Foods, Inc.代表的此次访问是否意味着和谐公司的合伙人可能正在考虑出售公司？”请考虑以下问题。\n\
  \n- 1. 你认为应该向代表透露哪些信息（如果有的话）？\n- 2. 你将如何报告该信息（即，你会使用哪些具体措辞）？\n- 3. 你对待该代表的方法有哪些利弊？\n\
  \n注意，在回答这些问题时，不要假设存在任何本身要求你对员工代表保密的法律义务。但也要假设，你向这个人报告的任何信息都可能迅速传播给员工。正如俗话所说，“人们会议论……”\n\
  \n\n\n### 6.6 附录 C：山景健身（大流行病背景下创业领导力的一个案例研究）\n\n> “谁能想到你只凭一条小毛巾和一个大梦想就能创建一家公司？”——汤姆·哈滕，山景健身创始人兼首席执行官\n\
  \n汤姆·哈滕在1991年于亚利桑那州立大学就读大三期间，于凤凰城地区创立了山景健身。在越来越受“企业”健身连锁（如 LA Fitness、Lifetime Fitness\
  \ 等）主导的市场中，哈滕的基本理念是让他的健身房对会员更友好、更贴心。他的第一家健身房位于阿瓦图基。作为他领导力和客户服务方法的一个例子，他通过提供免费毛巾来表达对会员的感谢，并且每月在俱乐部举办包含披萨、啤酒和软饮的社交活动。到2020年春季，山景健身已发展到十八家分店和超过90,000名会员。哈滕最近撰写了一本关于其业务演变的自传，书名为\
  \ *永远梦想*。\n\n## 2020年大流行病\n\n2020年3月中旬，COVID-19 病毒大流行在全球爆发。在美国，被认定为“必要”的企业（如杂货店）获政府行政命令允许继续营业。然而，其他被认定为“非必要”的企业被迫关闭。健身房和健身俱乐部属于后一类企业。这一分类从一开始就引起争议，因为健身房和健身俱乐部显然有助于会员的身心健康，从而可能使人们不易感染\
  \ COVID-19 或其他疾病。确实，全国各地的一些健身房业主曾强烈抗议关闭其业务。\n\n为遵守亚利桑那州州长杜西的行政命令，山景健身关闭了运营，并将大部分员工停薪留职近两个月。到2020年5月中旬，亚利桑那州州长办公室允许健身房和健身俱乐部重新开放，但仅限于遵守美国疾病控制与预防中心（CDC）制定的社交距离指导方针。山景健身勤勉地试图遵守这些指导方针，并重新开放了其设施。然而，到2020年6月底，亚利桑那州的\
  \ COVID-19 病例数似乎在“激增”。不清楚病例数增加的原因，但这可能归因于多种因素，例如增加检测以发现现有病例。尽管病例数增加，医院 ICU 仍未接近最大容量，而对\
  \ ICU 容量的担忧最初正是关闭“非必要”企业的关键原因。\n\n为应对病例“激增”，2020年6月29日下午约3点，州长道格·杜西下令针对包括健身房/健身俱乐部、酒吧、电影院和水上乐园在内的特定行业，当晚8点前恢复关闭。该命令预计至少持续到2020年7月27日。汤姆·哈滕最初决定忽略新的行政命令，继续营业。这导致其设施被多次开出各2,500美元的罚单，并且哈滕面临被捕的可能性。\n\
  \n哈滕立即起诉州长办公室，试图获得针对行政命令的禁令。他举行了一场新闻发布会，解释自己的行为。然而，在2020年7月7日（星期二），亚利桑那州巡回法院作出不利于他的裁决，决定不推翻州长的行政命令。当天，哈滕宣布他将遵守法院的决定，并于下午2点前停止运营。他还宣布，至少到2020年7月27日，他将继续支付员工工资。\n\
  \n但与此同时，哈滕向亚利桑那州上诉法院提起上诉。2020年8月4日，该法院作出如下裁决：“行政命令（按其实施方式）违反了程序正当法律程序……健身中心必须获得及时机会申请重新开放。该流程必须在本命令生效之日起一周内建立。”本质上，哈滕赢得了诉讼，他随即宣布将于一周后，即2020年8月11日重新开放其健身房。但实际上，截至2020年8月12日，由于州长办公室缺乏明确指导方针，他尚未重新开放。哈滕在接受当地新闻台采访时描述了自己的情况。\n\
  \n2020年8月12日之后，在一份新的法庭文件中，哈滕似乎超越了其自身组织甚至其所属行业（健身俱乐部），承担起更广泛的事业。具体来说，他说：“我们最终是正确的，我想我代表所有小企业主发言，无论是健身俱乐部、水上乐园还是其他企业。以新冠病毒为名滥用职权、对小企业所为的事必须停止。我们当然都了解病毒的严重性，但我们都必须被允许共同前进并保持企业运营。否则，我们将继续看到企业倒闭，整个行业被消灭。”\n\

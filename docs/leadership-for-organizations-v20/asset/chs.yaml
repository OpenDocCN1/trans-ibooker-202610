  等人 (2007)。

  - 18. 有关好奇心情感层面的更多信息，参见 Harrison, S. H., Sluss, D. M., & Ashforth, B. E. (2011)。好奇心助猫适应环境：特质好奇心在新来者适应中的作用。《应用心理学杂志》，96，211–220。另见
  Litman, J. (2005)。好奇心与学习的乐趣：对新信息的渴望与喜爱。《认知与情绪》，19，793–814。


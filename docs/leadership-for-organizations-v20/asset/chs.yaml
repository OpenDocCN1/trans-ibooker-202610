  ## 结论


  如果将本章与前一章结合起来，信息应该很清楚。有效的领导过程不仅仅关乎领导及其行为。它也关乎追随者。追随者需要以下列方式有效，才能获得得分：


  | 类别 | |

  |---|---|

  | 思维方式（问题 1–4） | |

  | 参与度（问题 5–8） | |

  | 对领导的忠诚度（问题 9–12） | |

  | 总分： | |





  ## 解释


  对于每个维度，得分为 0 或 1 应视为低分；得分为 2 或 3 应视为中等；得分为 4 应视为高分。


  对于总分，得分为 4 或以下应视为有效追随性低分；得分为 5–8 应视为有效追随性中等；得分为 9–12 应视为有效追随性高分。



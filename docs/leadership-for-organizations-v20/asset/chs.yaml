  如前所述，如果文化通过规范性影响和信息性影响发挥作用，从而指导员工关注什么以及如何行动，那么战略领导者的工作就是确保人们获得非常清晰的信号，告诉他们什么重要以及如何行动。从这个意义上说，这全部关乎所谓的社会建构；也就是说，战略领导者的根本任务是帮助员工解释和理解他们正在做什么以及为什么这样做。这听起来可能有点难以理解，但正如我们将看到的，它实际上非常简单。


  从新员工的角度来看待这个挑战。想象你刚刚加入一家新公司。你可能在想什么？你的首要关注点之一就是弄清楚你需要如何行为才能融入并取得成功。你将如何决定如何行为才能被群体接受并在工作中取得成功？可以肯定的是，你可能会观察他人，仔细聆听高级领导者说什么和做什么，看看谁得到了奖励，并向他人寻求关于该做什么或避免做什么的建议。你可能很快就会开始了解文化的方方面面。我应该早点来晚点走吗？我应该如何着装？我应该如何对待其他员工或客户/客人？可以走捷径吗？我可以反对老板吗？可以犯错误吗？随着时间的推移，这些问题的答案会变得清晰。正如我们所指出的，在强势文化中，你将需要如何行为才能融入并取得成功会更加清晰。在弱势文化中，适当的行为方式就不那么清晰了。


  另一个值得注意的有趣现象是，如果直接询问，组织中老资格员工（即任职时间较长的人）很少有人能公开阐述公司共享的规范和价值观。由于文化（如规范和价值观）大部分比喻上都在表面之下，组织老兵可能无法阐述其组织文化的某些方面。他们日复一日地生活在那种文化中。但就像鱼在水中一样，人们学会了视文化为理所当然。[24]
  本书第 10 章讨论的社会层面的文化类型也是如此。


  ### 领导文化的机制


  如果文化通过规范和价值观运作，领导者可以做些什么来塑造和改变它们呢？了解文化通过规范和价值观运作，结果发现这些组织的领导者使用五种常见的机制或杠杆。这些杠杆都基于以下心理学：当人们处于对“正确”行为方式有非常明确期望的环境中时，很难不遵守。在这种情况下，我们通常只有两种选择：（1）遵守并按预期行事，因此融入并被接受；或者（2）不按预期行事，在大多数情况下，会在心理上或身体上被排除在组织之外。以下是五个关键杠杆：


  - 1. 领导者的日常行为。


  大多数人都希望融入并被所在的群体或组织接受。为了做到这一点，我们会关注领导者。我们聆听他们说的话，观察他们做的事。换句话说，我们“观察老板”。我们试图弄清楚他们认为什么重要，以便自己能够取得成功。我们会注意他们花时间在哪里、提出什么问题、喜欢和不喜欢什么，以及他们认为什么是高优先级。我们也会注意他们是否以身作则（而非虚伪或不一致）以及是否走基层。我们利用这些信息来决定自己如何行动、关注什么和忽略什么，以及如何被视为一名好员工。可以把领导者视为向组织发送信号的信号发生器，这反过来又帮助员工解读自己应该如何行动。当他们的信号清晰且一致时，员工会很快学会如何行动。例如，在
  Zappos，已故首席执行官托尼·谢伊（Tony Hsieh）没有私人办公室——只是他人中间的一个普通隔间。领导者的沟通和行为是领导文化的第一个，也许也是最重要的杠杆。


  - 2. 社会活动和仪式。


  强势文化领导者通常鼓励社会活动和仪式，以在组织成员之间建立联系。他们强调内在奖励和外在奖励（成为群体的一部分本身就是一种奖励），并利用群体认可来传递群体成员身份。他们甚至可能让家人、朋友和客户参与这些活动。例如，Mary
  Kay Ash（Mary Kay 化妆品创始人）在举办精心策划的活动方面非常有效



  华丽的年度颁奖典礼，奖励包括珠宝、皮草、豪车等等，以此奖励员工。[25]


  ## 3. 通过故事、专业语言和符号传递明确信号。


  强文化组织通常在传达对人员行为的期望方面非常清晰，有时甚至会暗示该组织并不适合每个人，或许只有特殊的人才能成功（例如，“少数人。骄傲的人。海军陆战队。”）。这些信息通过故事不断传达，故事生动地描绘了那些态度和行为体现企业文化的员工。他们庆祝这些个人，并常常将他们塑造成英雄。有时故事由领导者本人讲述，尽管文化信息也可能由员工、客户和其他领导者的代理人传播。[26]
  此外，领导者和员工可能会使用某些专属于组织的短语、口号或术语，以强化成员身份感和归属感（例如，“谷歌员工”，“一人为所有人，所有人为一人”）。此外，符号或象征性行动可以传达文化的某些方面。例如，想象一家公司总部大楼，其中包括高层管理团队成员、人力资源（HR）专家和客户服务员工。如果高层管理成员位于顶层，而人力资源和客户服务员工位于较低楼层，这会传递关于文化的什么信号？或者，如果高层管理成员位于第一层或中间楼层，而人力资源和客户服务员工位于顶层，又会传递什么信号？简而言之，实体建筑内部员工和部门的布局甚至可以象征一种文化。


  - 4. 选拔与社会化。


  强文化组织的战略领导者喜欢使用选拔和社会化程序，以帮助确保文化不断得到加强。毕竟，古老的谚语“造就一个地方的是人”是正确的。[27] 如果人确实造就一个地方，那么就必须以文化为宗旨正确选拔他们，并建立机制让他们学习或被社会化到公司的特定规范和价值观中。例如，强文化公司（例如，Google、西南航空、Zappos、Bridgewater
  和 Cypress）的招聘流程通常包含多个步骤，而这些流程中有两点是共同的。首先，新员工的选拔在很大程度上（或甚至更多）基于他们与公司文化价值观的契合度，而非仅仅基于其技术技能或工作经验。其次，选拔过程不仅涉及人力资源专家，实际团队成员或同事也会参与（例如，现有团队成员面试潜在候选人）。此类程序的设计既帮助筛选文化契合的人员，也让申请人有机会主动退出。例如，在
  Zappos 培训计划接近尾声时，新员工会被提供 3,000 美元辞职，以确保留下的人不仅仅是为了薪水。2015 年，Zappos 收到了超过 250,000
  份申请，而只有 250 个职位空缺。[28] 我们应该注意，选拔和社会化对于公司基层管理层可能尤为重要。如果战略领导者无法指望基层领导者帮助朝着统一的方向构建和塑造文化，那么形成与战略领导者愿景相符的强文化的可能性将微乎其微。


  培训是实现技能发展和社会化的关键机制。然而，回到本章开头提出的竞争优势要素，培训不应被视为文化的替代品；相反，它仅仅是另一种帮助植根文化的机制。让我们以客户服务为例。关于客户服务的价值观和信念，随着时间的推移，可以基于本节中提到的其他领导文化机制（例如领导者的日常行动和沟通）成为文化的一部分。如果客户服务不能通过这些其他机制在文化中不断植根或加强，那么客户服务培训对员工行为产生积极影响的可能性就不大。简而言之，培训本身不应被视为文化的替代品。


  - 5. 精心对齐的奖励系统。


  最后，强文化组织的领导者确保奖励系统与预期行为精确对齐。显然，金钱是一种重要的激励因素，但它不是塑造文化的好方法。通常，货币奖励的频率过低，无法强化特定行为。相反，强文化公司的领导者更可能使用认可、赞许和地位来表明符合规范。有时这些象征性奖励（例如，本月员工、感谢证书）可能看起来微不足道，但当它们被真诚地颁发时，可以作为强化文化的强大力量。许多组织面临的巨大危险是，正式奖励系统（例如，金钱和晋升）可能与期望的行为不一致。例如，当领导者声称团队合作或创新很重要，但员工看到非团队合作者却得到晋升，或者那些尝试创新却失败的人受到惩罚时，他们很快就会形成这样的信念：他们的领导者要么脱离现实，要么更糟，是操纵者。简而言之，如果领导者实际上奖励
  A，却口头声称期望 B，那么文化期望将变得不清晰，员工也会变得缺乏动力。[29]


  总之，这五种机制基于这样一个观点：要塑造文化并使其强大，领导者需要就预期的态度和行为发出强烈信号。通过始终如一地传递关于预期行为的相同信息，让人们参与进来，提供文化的生动示例，并公开地选拔、社会化和奖励那些践行价值观的人，领导者帮助员工理解成功所需条件。随着时间的推移，这些期望可以植根于组织中，以至于新员工能迅速理解对他们的期望。


  ## 案例示例


  从战略领导者的角度来看，关键是向组织成员发送清晰的信号。图 12.3 提供了实现这一目标的大致框架。首先，战略领导者的信念和价值观可以作为其行动的基础。在美国最大的对冲基金
  Bridgewater Associates（桥水基金）中，CEO 雷·达利奥（Ray Dalio）相信他所谓的“激进透明”。[80] 他希望公司里每个人都始终彼此完全诚实，即使说真话让人不舒服。因此，所有会议都会被录像，并提供给所有员工观看。新员工通常会对批评的直截了当感到震惊，但达利奥认为，完全诚实是建立理想精英制度的唯一方式。他的价值观和信念塑造了他的行为。


  ![](img/5a5fcd49e67d713bc6c99c1cc791987a_201_0.png)


  这些行为（包括他的行为以及他在组织设计方面所做的选择）向员工传达了什么重要以及如何行事。


  ## 图 12.3 文化是如何被领导的


  ![](img/5a5fcd49e67d713bc6c99c1cc791987a_202_0.png)


  其次，达利奥和他的团队不断地向他人传达什么重要以及他们应当如何行为。研究表明，当一条信息反复传达时，人们更有可能相信它。当战略领导者不断强化某些价值观和行动重要的信号时，我们开始明白他们是认真的。通用电气公司前任首席执行官杰克·韦尔奇（Jack
  Welch）曾说过，如果领导者想要有效地管理文化，就必须做两件事：(1) 不遗余力地传递相同的信息，以及 (2) 不断重复——即反复传达同一条信息。


  如果战略领导者在传递文化内涵方面不遗余力，并且员工能看到其他人因行为得当而获得奖励（或受到惩罚），那么就会形成规范，告诉新人某些行为和态度是被期望的。随着时间的推移，这些规范会变得根深蒂固。例如，在桥水基金，员工使用
  iPad 不断地相互评估以及评估他们的主管。这些评估会被录入员工的永久记录中，并公开供人查阅。被称为“队长”的指定经理会不断监控文化，以确保遵守原则。达利奥承认他的文化并不适合所有人，但他相信这是公司成功的核心。


  桥水基金和其他强文化公司的共同点在于，其战略领导者在传达融入并取得成功所需的态度和行为方面非常清晰。他们还确保组织内的人力资源系统保持一致，包括他们寻求雇佣的人才类型、招聘方式、新员工的培训和发展方式、奖励哪些行为，以及晋升哪种类型的人。清晰的领导信号与一致的人力资源系统相结合，使人们对预期行为有了清晰的认识。




  ## 本章视频案例


  本章视频案例强调了构建道德文化、以身作则以及作为领导者保持可见性的重要性。


  ## 克里斯·史密斯——文化、优先事项与收购


  克里斯·史密斯是一家中型设备租赁公司的首席执行官，他描述了一个情景：他曾考虑收购一家文化似乎与其现有公司文化不一致的公司的利弊。


  ![](img/5a5fcd49e67d713bc6c99c1cc791987a_203_0.png)


  在在线阅读器中查看


  ## 结论


  正如本章所见，组织文化可以是竞争优势的来源（例如，Zappos），也可以在与战略不一致时成为竞争劣势（例如，20 世纪 90 年代初的 IBM）。它也可以是员工之间自豪感和动力的来源，或是愤世嫉俗和人员流动的来源。把文化做对（即，创建或塑造文化）是战略领导者的一项基本任务。正如我们所示，如果领导者将文化视为共享的规范和价值观，以及由人和系统强化的行为模式，那么文化可以随时间被创建、塑造，甚至改变。在下一章中，我们将把注意力转向组织变革，包括显著重塑文化的可能性。


  ### 12.5 讨论问题


  - 1. 什么使资源（或组织的其他方面）成为公司的竞争优势？组织文化如何/为何可以成为竞争优势？


  - 2. 组织文化究竟是什么，为什么冰山模型（参见图 12.1）是文化的一个好隐喻？


  - 3. 本章前面列出了组织文化的四个常见维度。你的组织（或你的大学）在这些维度上表现如何？你个人更希望在你所在的组织中看到哪些维度得到强调，为什么？


  - 4. 什么是“强”组织文化？强文化是好事、坏事，还是取决于情况？请解释。


  - 5. 领导力与文化之间有何联系？换句话说，领导者可以做些什么来帮助塑造组织文化？你在所在的组织中是否经历过任何示例？请解释。



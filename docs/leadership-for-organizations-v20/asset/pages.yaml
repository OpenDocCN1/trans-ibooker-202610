    the NBA all-star and former mayor of Sacramento, California, has said "You need
    to make people feel like they are doing something bigger than their individual
    work."[17] Indeed, potential employees, customers, and even investors tend to
    get more excited by the "bigger" statements on the right side. In the case of
    Liberty Mutual, it is mundane to be guided by a simple mission of selling insurance.
    On the other hand, since the overarching mission is actually to help people live
    safer and more secure lives, employees and other stakeholders are more likely

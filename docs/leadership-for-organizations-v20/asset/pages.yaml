  md: '# # 12.4 How Do Leaders Create and Reinforce Culture?


    How do strategic leaders create and shape norms and values in their organizations?
    Table 12.1 shows a set of strong culture firms from around the world. They include
    companies like Maersk in Denmark, Fanuc in Japan, and Zappos and Walmart in the
    United States. They include small and large firms, private companies, publicly-listed
    firms, and military organizations. They span industries from high tech to low-tech,
    financial services, manufacturing companies, and health care. Although the norms
    and values that define them are oftentimes different, the processes and techniques
    through which their leaders create and shape them are highly similar.


    | Company | Company |

    |---|---|

    | Nordstrom | Google |

    | Walmart | Oracle |

    | First Republic bank | Southwest Airlines |

    | Bridgewater Associates | United States Marine Corps |

    | SAS Institute | Fanuc |

    | IDEO | Nike |

    | Mars | Intel |

    | Lululemon | DaVita |

    | Zappos | Netflix |

    | Facebook | Trader Joe''s |

    | Commerce Bank | McKinsey |

    | Mary Kay | Maersk |

    | Special Forces | The Ritz Carlton |

    | JetBlue Airways | SEALs |

    | Publix | ISS |

    | Sewell | NetApp |

    | Cypress Semiconductor | REI |

    | P&G | USAA |

    | Disney | Apple |

    | Chick-Fil-A | Twitter |

    | Costco | Patagonia |

    | Whole Foods | Samsung |


    If, as we have described, culture acts through normative and informational influence,
    thus guiding employees in terms of what to focus upon and how to act, then the
    strategic leader''s job is to make sure that people get very clear signals telling
    them what is important and how to act. In this sense, it is all about what is
    known as a social construction; that is, the fundamental task of a strategic leader
    is to help employees interpret and make sense out of what they are doing and why
    they are doing it. This may sound a bit incomprehensible, but as we will see,
    it is actually very straightforward.'

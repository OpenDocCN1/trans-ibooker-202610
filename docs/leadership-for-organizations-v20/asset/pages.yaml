    the company was transformed from a failing maker of computers to a successful
    software and services business. In describing this transformation, Gerstner claimed
    that the main reason the prior management could not transform IBM was not due
    to attempts to execute new strategy. Instead, it was a case that the values and
    culture had been created for an earlier point in time and other strategies. He
    argued that “Until we got to the issues of culture and values and behavior, we
    never would have changed IBM.”[4]


    # Organizational Culture and Competitive Advantage


    Examples of just how difficult it is to succeed in the airline industry, which
    is why organizational culture (and the leadership that goes along with it) could
    be competitive advantage.

    http://en.wikipedia.org/wiki/Timeline_of_airline_bankruptcies

    https://www.cnn.com/2017/04/10/travel/passenger-removed-united-flight-trnd/index.html


    The IBM story is just one example of many whereby organizational culture and leadership
    are identified as either a source of competitive advantage (e.g., Southwest Airlines,
    Google, Nordstrom, Zappos), or alternatively, as a barrier to change and a source
    of competitive disadvantage (e.g., IBM, Wells Fargo, Kodak, Enron). A recent Deloitte
    study revealed that 86 percent of U.S. executives believe that culture is a potential
    competitive advantage and important to business success.[5] Another recent survey
    of executives found that 78 percent of Fortune 1000 CEOs and CFOs viewed culture
    as one of the top three things affecting a firm’s value.[6] A review of the subject
    by researchers revealed more than 4,600 studies on the topic.[7] Yet, in spite
    of all this attention, there is still a lack of clarity about what culture is
    and how it can be managed. For instance, in the Deloitte study, 68 percent of
    the respondents indicated that they did not understand culture, and only 19 percent
    believed that their organizations have the right culture.


    Culture is clearly seen as important by company leaders, but what is it really?
    And why is it so important for creating competitive advantage? And, maybe most
    importantly, how do leaders create, manage, and change cultures? If we are not
    clear about what culture is, then it is difficult to see how it might matter for
    the purpose of competitive advantage and, more importantly, how leaders can create
    and change it. We address these issues in this chapter. In so doing, you will
    see how culture, when properly aligned with strategy, can be a clear source of
    competitive advantage. Alternatively, when the culture is misaligned, it can hinder
    the implementation of strategy and become a competitive disadvantage.



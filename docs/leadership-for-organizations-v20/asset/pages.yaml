  md: '# The Bottom Line: Know Thy Own Culture


    In sum, the overall purpose of this section on American culture is to stress that
    a necessary first step of being an effective global leader is to understand one’s
    own cultural influences. In so doing, one can get a better feel for some of the
    reasons as to why s/he thinks, feels, and behaves, and how individuals from other
    cultures may differ. Note that we have stressed both the broader cultural or societal
    context, as well as how culture applies to work setting issues. Thus, the global
    leader must inevitably deal with how culture affects life both personally, as
    well as in work settings. Indeed, as we will see, work and non-work lives often
    blend together when working in cultures outside of the United States. We now turn
    our attention to what a global leadership orientation is all about, and why it
    is important.


    # 10.3 Global Leadership Orientation


    In this book, we have considered, and in subsequent chapters will continue to
    talk about, different leadership styles. For example, we have considered participative
    and servant leaders. Accordingly, one possible approach to understanding effectiveness
    in global leader roles is to determine how these styles may, or may not, apply
    well across cultures. Indeed, there is much research along these lines. For example,
    participative leadership tends to fit better in cultures, such as the United States
    and Western European countries, with low power distance. However, participative
    leadership is not as accepted in Asian cultures. On the other hand, more paternal
    approaches to leadership (i.e., being a “fatherly” figure or taking care of followers
    and their families) is more applicable to Asian cultures. Furthermore, leadership
    qualities like visionary and inspirational tend to be equally important in most
    cultures around the world.[13]


    Rather than considering how various styles of leadership may or may not apply
    to leaders in different cultural contexts, another way of considering effective
    global leaders is to focus on the type of orientation or mindset that such leadership
    requires. Is there such a thing as a global mindset, and if so, how exactly does
    it apply to global leaders? Some authors have indeed attempted to answer these
    questions.[14] One way to approach this issue is to look at what is required from
    leaders in terms of both know-how and emotional engagement.


    Effectiveness in global leader roles requires the individual’s ability to make
    sense of unfamiliar, ill-defined, and changing situations. They then must take
    actions, sometimes quite novel or creative, to deal with interactions with a diverse
    set of stakeholders. These stakeholders may be diverse not only in terms of ethnicity
    or culture, but also in terms of their function or roles. They could include suppliers,
    customers, representatives and governmental and non-governmental organizations,
    and so forth. At times, the global leader is likely to encounter constraints that
    could thwart his or her goals. For example, Cuba represents a longstanding, Communist
    country that is beginning to open itself to capitalism and free markets. Organizations
    from Western countries are increasingly attempting to do business there. However,
    various rules are imposed on businesses, which represent a holdover from Communist
    thinking and culture. For example, we know of one instance of a business that
    was accustomed to motivating employees through incentives—a practice that is common
    to capitalistic thinking and Western ways of doing business. But in Cuba, in line
    with Communist/Socialist traditions, employees must be paid equally with no room
    for individual incentives, at least in terms of formal compensation practices.


    If a leader has both the requisite know-how and emotional make-up, they stand
    a good chance of overcoming and dealing with such constraints. In the above example,
    the leader of the organization attempted to work around the rules by allowing
    “star” employees to shop free of charge at a store that was generally off-limits
    to local Cubans (i.e., because of prohibitive expense), and instead'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'was meant for foreign nationals, such as the leader. However, there was no
    rule that prevented the leader from allowing certain Cuban employees, as a special
    reward, to have access to the store. In short, the leader showed both know-how
    of the business culture and bureaucratic rules, as well as emotional resilience
    to engage the culture positively and deal with his challenge in a productive manner.


    A great deal of research has addressed cognitive and skill-based attributes of
    effective global leaders, although much less attention has been devoted to more
    emotional or affective qualities.[15] Here, we suggest that both know-how and
    emotional factors are required for global leaders. But what are such qualities
    all about?


    # Global Orientation Factors


    Based on emerging research, we identify three key factors that are associated
    with a global orientation on the part of leaders: (1) global business know-how,
    (2) cross-cultural know-how, and (3) cross-cultural engagement. Together, these
    factors represent both the cognitive and emotional make-up that is essential for
    a leader attempting to influence in a global context. We address each of these
    factors separately.


    **Global business know-how.** Business tends to be conducted differently in different
    countries around the world. Accordingly, the global leader needs to possess knowledge
    in such industry-level areas as customers, competitors, supply chains, and risks
    of doing business. A leader will also need know-how regarding how government and
    government regulations affect doing business in different countries, as well as
    the extent to which doing business coincides with non-business, cultural norms.


    A classic example is the extent to which business and socializing, especially
    through the intake of alcohol, might mix. In cultures such as that of the U.S.,
    there is the common cultural norm of “not mixing business and pleasure.” In other
    words, business pursuits are largely kept separate from personal or social activities.
    However, in many other cultures (e.g., Asian cultures) business and socializing
    are heavily intertwined. That is, the norm is that business largely gets accomplished
    through social activities that might involve the consuming of alcohol.


    **Cross-cultural know-how.** As mentioned earlier, it is important for a leader
    to first have knowledge of his or her own culture. Based on that knowledge, the
    leader can form a better understanding of other cultures, which is essential for
    effectiveness in a global leader role. Cross-cultural know-how pertains to a variety
    of issues including politics, religion, art, and history of cultures. Oftentimes
    in other cultures, these issues end up getting intertwined with how business is
    done.[16] For example, given that business and social pursuits can blend together,
    discussions of things like local politics and history can naturally arise in the
    course of discussing business matters with customers, suppliers, government officials,
    and even local employees. While no global leader is expected to be an expert on
    the cultures in which he or she is doing business, a rudimentary knowledge of
    basic issues will give the leader more credence. And perhaps more importantly,
    asking questions and showing curiosity may be even more important than a high
    level of expertise.


    **Cross-cultural engagement.** Global leaders are likely to face challenges that
    might be emotionally taxing. They need to not only have knowledge of other cultures.
    In addition, they must continually engage people and groups from other cultures,
    and then adapt to the multicultural environments in which they are immersed.[17]
    To engage means to show emotional enthusiasm, excitement, curiosity, and passion
    about people and ways of doing things in different parts of the world.[18] Note
    that it also means that these positive emotions will outweigh more negative ones,
    such as fear and anxiety. Engagement further implies having a high degree of openness
    towards diversity and life as it is experienced in different countries. Leaders
    with a strong desire to engage cross-culturally anticipate and experience a feeling
    of joy and excitement in unfamiliar cultural'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'environments. For example, there is evidence that expatriates who show a lack
    of passion for diversity and engaging in cross-cultural contexts tend to experience
    failure.[19]


    On the other hand, cross-cultural engagement does not imply that the global leader
    will set aside all of his or her own cultural values. For example, American culture
    emphasizes equality in terms of race, ethnicity, and gender. However, such norms
    and values are often lacking in other cultures. When engaging cross-culturally,
    the idea is to understand and avoid negative judgments about the norms, beliefs,
    and values that are prevalent in another culture. But at the same time, it does
    not imply simply accepting those aspects of the other culture and behaving accordingly.


    Along similar lines, it is quite possible that a leader could feel tension in
    having a sense of patriotism or identity toward his or her own home country, while
    simultaneously having a global orientation. This sense of patriotism and identity
    is analogous to the concept of nationalism. That concept has been much maligned
    because of how some people would associate nationalism with negative phenomena,
    such as a feeling of superiority, disdain for or prejudice toward other groups,
    or isolationism. However, at its core, nationalism is simply about a strong sense
    of pride in one''s own cultural background. That said, we recognize that the tension
    between nationalism (or country-specific patriotism) versus globalism represents
    yet another paradox that leaders will need to increasingly navigate as we look
    toward the future.


    This tension can be seen in recent developments at Google. Despite some push-back
    from employees and other constituencies, leaders at Google moved ahead on plans
    to build a search engine in China that would allow for government-based censorship.[20]
    At the same time, the firm appears to be increasingly hesitant to work cooperatively
    with the U.S. Department of Defense.[21] Actions of this nature could be viewed
    as taking an imbalanced global stance, while not reflecting a sense of country-specific
    patriotism that many employees or customers might desire. In short, leaders at
    firms like Google are likely to increasingly face the paradox of dealing with
    nationalistic demands (or serving the interests of one''s home country) on the
    part of various constituencies, while simultaneously pursuing global initiatives.
    We maintain that it is possible, and even largely desirable, for leaders to be
    both nationalists and globalists simultaneously. In other words, as noted in a
    recent article in the Harvard Business Review, nationalism versus globalism represents
    a false dichotomy.[22] It is possible, and even desirable, to pursue both simultaneously.


    How do you stack up in terms of having a global leader orientation? To help answer
    this question, try taking the survey in Section 6.


    # 10.4 Avoiding Misinterpretations


    The possibility of misinterpretations represents a key pitfall in cross-cultural
    interactions. A lack of cultural self-awareness, combined with a lack of awareness
    of other cultures with which one is dealing, can easily lead to misinterpretations
    and poor communication. These problems can occur in the course of business or
    social interactions. Consider the Saudi businessman who attempts to hold the hand
    of his male American counterpart as they walk together down a hall. Such behavior
    might be considered as “normal” by the Saudi, but could be misinterpreted as a
    sexual gesture by the American.


    As another example, buyer/seller negotiations represent a common situation in
    which business people and leaders from different cultures might find themselves.
    Consider the case of a small team of Japanese negotiators interacting with a small
    team of American counterparts. Although the negotiations take place in Japan,
    they are conducted in English, which would not be uncommon. In the middle of a
    particularly frustrating round of negotiations, members of the Japanese team announce
    that they need to essentially huddle privately for just a little while. They do
    so in the back of the same room in which the negotiations are being held, but
    in full view of the'

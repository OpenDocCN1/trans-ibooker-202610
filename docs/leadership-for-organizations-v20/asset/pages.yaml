  md: '# CHAPTER 9

    Men and Women in Leadership Roles


    > "Diversity: the art of thinking independently together." —Malcolm Forbes, publisher
    of Forbes magazine


    > "My senior leadership team is half people who have been at GM for a long time
    like me, and others who have joined the company in the past five years from different
    industries, experiences, and countries. You have a better picture of the world.
    The diversity of thought is where you can make better business decisions." —Mary
    Barra, CEO of General Motors


    # Learning Objectives


    +   1. Describe the challenges faced by minority group members (including women)
    who attempt to lead.

    +   2. Summarize and compare the concepts of glass celling and glass cliff.

    +   3. Explain and manage the major challenges facing majority group members who
    attempt to lead in an increasingly diverse work context.

    +   4. Appraise oneself in terms of the extent of an inclusive mindset.

    +   5. Identify and manage the paradox of building cultural homogeneity, while
    allowing for diversity.


    Diversity is a fact of life. To at least some degree, it has been present in many
    societies for thousands of years, and in recent years, it has become increasingly
    present in organizations. Issues surrounding diversity have been the subject of
    much research in organizations.[1] Our focus in this chapter is on the implications
    of diversity regarding leadership. To address this topic, we focus on two types
    of challenges. First, there are the challenges faced by individuals (e.g., women)
    who attempt to lead in work settings where the traditional control or power has
    been centered in others (e.g., men). Second, there are the challenges pertaining
    largely to inclusiveness that are faced by those traditional power holders who
    attempt to lead in an increasingly diverse work setting. In both instances, we
    do not intend to make any political or ideological statements. Instead, we simply
    seek to point out the challenges that are faced by both women and men who attempt
    to lead in organizations, as well as solutions to those challenges.


    People who attempt to lead can represent different ethnicities, races, and genders.
    While many of the issues are similar for these different categories, in this chapter
    we will focus primarily on women in leadership roles in both the examples that
    we present, as well as the videos associated with this chapter. Our emphasis reflects
    the frequent concerns in recent times pertaining to what has been termed the glass
    ceiling and glass cliff, which will be described below. These concerns represent
    important issues for modern organizations. Indeed, one need only examine how many
    women are CEOs of Fortune 500 firms in order to start to get a feel for these
    issues. Specifically, as'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'of May 2018, only 24 of the 500 CEOs (i.e., slightly less than 5 percent) were
    women.[2] Obviously, such a low percentage does not come close to the participation
    rate of women in the workforce, or even the managerial ranks.


    We begin this chapter with a specific focus on women in leadership roles, and
    the challenges that they face. We then circle back around to the broader issue
    of diversity, and the importance of all organizational members, including those
    in leader roles, to have an inclusive mindset.


    # ## 9.1 Challenges for Women Who Attempt to Lead


    **glass ceiling**

    An invisible, but nevertheless real, barrier that keeps women from rising up to
    higher managerial levels in organizations.


    Diversity presents challenges for women who attempt to lead in work settings where
    the traditional control or power has been centered in men. Largely, these challenges
    involve two metaphors: (1) the glass ceiling, and (2) the glass cliff. The **glass
    ceiling** pertains to an invisible, but nevertheless real, barrier that keeps
    women from rising up to higher managerial levels in organizations.[3] Numerous
    factors can cause such barriers, such as “old boy” clubs or networks from which
    managers might be chosen or promoted.


    **glass cliff**

    A phenomenon whereby once a woman is able to break through the glass ceiling,
    that individual may end up in positions or circumstances in which they fail.


    The **glass cliff** is a newer concept, but equally as problematic. The idea is
    that once a woman is able to break through the glass ceiling, that individual
    may end up in positions or circumstances in which they fail— or metaphorically
    fall off the slippery glass cliff. It could be that the individual may have been
    purposefully put into a higher-level position where the likelihood of failure
    was high,[4] or alternatively simply experience discrimination, sexual harassment,
    or lack of support once in a leadership position.[5] But regardless of the reason,
    the individual ends up failing, and falling off the glass cliff.


    It is interesting to note that a woman may face multiple glass ceilings and glass
    cliffs throughout her career. For example, a woman may break through a glass ceiling
    into middle management, is able to avoid the glass cliff at that level, but then
    face another glass ceiling or glass cliff at higher levels of management. Next,
    we address specific challenges that are associated with glass ceilings and cliffs.


    # ## Attributions of Being a Diversity Hire or Promotion


    **reverse discrimination**

    Occurs when favorable actions (e.g., hiring, promotion and work assignments) toward
    group members who are in the minority are perceived to be unfair or unwarranted
    by group members who are in the majority.


    When a woman is able to break through the glass ceiling, that person may be surrounded
    by others (e.g., followers, fellow leaders, and so forth) who either subtly or
    overtly suggest that the reason for the individual’s promotion or placement was
    simply the person’s sex. In other words, these others make the attribution (see
    Chapter 7) that the reason for this individual breaking through the glass ceiling
    is **reverse discrimination**. **Reverse discrimination** occurs when favorable
    actions (e.g., hiring, promotion and work assignments) toward group members who
    are in the minority are perceived to be unfair or unwarranted by group members
    who are in the majority. In other words, there could be the perception that there
    were more qualified men for a position, but the only reason that the woman was
    promoted was because of her sex. If the new leader picks up on these perceptions,
    the likely outcome is defensiveness, lack of confidence, or the proverbial “chip
    on the shoulder.”


    The obvious problem is that the female leader could show her defensiveness or
    lack of confidence that stem from these attributions, and as a result, have a
    difficult time leading and influencing. Eventually, the end result could be that
    the leader slides off, or gets pushed off, the'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'glass cliff. One solution to this challenge is simply for the leader to have
    a strong self-concept and to reason out in her own mind how she fully deserves
    her new position, despite the negative attributions of others. In addition, it
    helps to have a higher-level leader or mentor to reassure the individual of her
    worth, and how she attained her position on merit, rather than bias based on gender
    or minority status. Indeed, mentors or role models are important for leaders at
    all levels of management, and may be particularly important for female leaders
    who are able to break through the glass ceiling.


    # Perceived Role Incongruity and Stereotyping


    role incongruity

    A situation in which an individual could be perceived to be incongruent with the
    leadership role because of that person''s gender or background.


    Role incongruity involves a situation in which an individual could be perceived
    to be incongruent with the leadership role because of that person''s gender or
    background. For many people, the prototype that they have in their minds for people
    in leadership roles, especially in American culture, is one that stresses forcefulness,
    top down command-and-control, decisiveness, and even aggressive behavior at times.
    In other words, their implicit theory of what leadership is all about is associated
    with male behavior, which is perhaps not so surprising since males have traditionally,
    predominantly occupied leadership roles.[6] However, it can be incongruent with
    ways of leading that are more commonly associated with women. As compared to men,
    when in leadership roles, women tend to favor a consensual, collaborative, and
    relationship-building approach.[7] The irony is that increasingly, the more “female”
    approach may be what is actually necessary to achieve effectiveness in modern
    work settings.


    But nevertheless, prototypes based on ongoing images of the hard-driving leader
    persist, which can cause perceptions of incongruity for women who attempt to lead.
    It is the so-called “backlash effect” in which women leaders who behave in more
    male like or aggressive ways are punished for not being “nice.” The upshot of
    this perceived incongruity is that they may be stereotyped as ineffective or inappropriate
    for many leadership roles, which again, can cause lack of acceptance of women
    in those roles. As a result, women who are already in leadership roles can become
    defensive, lose confidence, and so forth when exposed to such negative stereotyping.
    The metaphoric glass cliff phenomenon could then follow.


    As an example of perceived role incongruity, an interesting study showed how,
    as compared to male leaders, female leaders were seen as neither capable nor appropriate
    for applying strict disciplinary actions to followers.[8] In other words, followers
    (i.e., both men and women) preferred that if disciplinary actions had to be administered
    to them, they wanted it to be conducted by a male leader. In other words, the
    old saying, “wait until your father gets home...,” seems to apply to how followers
    view the application of disciplinary actions. In short, this study reinforces
    the notion of men being forceful and even aggressive in their leadership role—but
    not women, who are expected to be more nurturing and understanding.


    To meet this challenge, we recommend two key strategies for female leaders. First,
    women should attempt to develop a situational or contingency stance toward the
    negative attributions and stereotypes that they might encounter. That is, in some
    circumstances or contexts, a forceful stance may seem incongruent, but nevertheless
    may be necessary in order to maintain respect and authority. For example, when
    confronted directly regarding her authority, collaboration and relationship-building
    may need to take a back seat, and instead, the female leader will need to be firm
    and forceful. In other situations, the female leader might respond more collaboratively
    with humor or probing questions. For example, if an off-the-cuff, stereotypical
    comment is made by a male colleague about women, the female leader might respond
    with a probing question that in a friendly manner attempts to force an explanation
    as to the validity of the stereotype.[9] In this example, the female leader would
    not attempt to “get in the face” of the male colleague, but at the same time,
    she does not allow that colleague to simply get away with stereotypical or degrading
    statements.


    Second, and perhaps as a catch-22, responses to stereotyping or challenges to
    one’s authority must be met in an authentic manner. Regardless of a leader’s sex,
    forcefulness or aggressive actions'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'on the part of the leader must be viewed as authentic by followers in order
    to achieve effectiveness. Indeed, authenticity may be even more of a requirement
    for female leaders, since forceful or aggressive actions may be seen as incongruent.
    The following video highlights the advantages of authenticity for all leaders,
    and perhaps especially female leaders.


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_143_0.png)


    As an additional note, problems with perceived role incongruity are not the sole
    domain of female leaders. They can also occur for leaders with certain ethnic
    backgrounds. For example, individuals with Asian backgrounds have found difficulty
    breaking into leadership roles in American firms, as well as maintaining those
    positions once attained.[10] In other words, the glass ceiling and glass cliff
    both may apply to people with Asian ethnic backgrounds. Possible reasons for such
    difficulties can again include perceived role incongruity. The hard-driving, forceful,
    and direct prototype of effective leadership that has developed over time in North
    American culture is based on traditional behaviors that are associated with white
    men. People with Asian backgrounds, men and women, oftentimes are not congruent
    with this prototype. That is, they are often more circumspect, less forceful,
    and less direct in leadership roles. Indeed, such individuals may be pigeonholed
    as technical experts, analytical types, and so forth—but not as leaders. Not surprisingly,
    they either do not obtain leadership positions, or they may have a hard time holding
    on to them once attained. Again, such incongruity is not based on actual role
    requirements, but rather on others’ (e.g., majority group members) perceptions
    of what personal qualities are required in leadership roles.


    # ## 9.2 Challenges for Male Leaders in an Increasingly Diverse Environment


    Traditionally, power, control, and influence in most North American organizations
    have resided with men, specifically white men. As suggested previously, we make
    no attribution here as to exactly how or why power, control, and influence in
    organizations has traditionally tended to reside with white men. For the most
    part, we will leave such an analysis to historians, sociologists, political analysts,
    anthropologists, and so forth. Our goal is to simply take this tradition as a
    given, and move forward in terms of addressing the challenges faced by men who
    attempt to lead in an increasingly diverse environment. These challenges largely
    boil down to three issues: (1) lack of an inclusive mindset; (2) maximizing the
    benefits of diversity, while reducing its potential downside, and (3) dealing
    with the paradox of building cultural homogeneity, while allowing for diversity.'

  md: "Think about this challenge from a new employee's perspective. Imagine that\
    \ you have just joined a new company. What is likely to be on your mind? One of\
    \ your first concerns is to figure out how you need to behave in order to fit\
    \ in and be successful. How will you decide how to behave in order to be accepted\
    \ by the group and be successful at your job? One thing for sure is that you are\
    \ likely to watch other people, listen carefully to what senior leaders say and\
    \ do, see who gets rewarded, and ask others for advice about what to do or what\
    \ to avoid. It probably will not take long before you will start to get a feel\
    \ for what the culture is all about. Should I show up early and work late? How\
    \ should I dress? How should I treat other employees or customers/clients? Is\
    \ it OK to cut corners? Can I disagree with my boss? Is it OK to make mistakes?\
    \ Over time, the answers to these questions will become clear. As we have indicated,\
    \ in stronger cultures, there will be greater clarity about how you will need\
    \ to behave to fit in and be successful. In weaker cultures, the appropriate ways\
    \ of acting will not be as clear.\n\nIt is also interesting to note that few people\
    \ among the older guard of an organization (i.e., those with longer tenure) will\
    \ be able to openly articulate the shared norms and values of the firm, if asked\
    \ directly. Since much of culture, such as norms and values, is metaphorically\
    \ under the surface, organizational veterans may not be able to articulate aspects\
    \ of their organization's culture. They have lived that culture on a day-to-day\
    \ basis. But just like fish in water, people learn to take their culture for granted.[24]\
    \ The same way can be said about the types of societal-level cultures considered\
    \ in Chapter 10 of this book.\n\n# Mechanisms for Leading Cultures\n\nIf culture\
    \ operates through norms and values, what can leaders do to shape and change them?\
    \ Understanding that culture operates through norms and values, it turns out that\
    \ there are five common mechanisms or levers that leaders in these organizations\
    \ use. These levers are all based on the underlying psychology that when people\
    \ are in settings where there are very clear expectations for the \"right\" way\
    \ to behave, it is very difficult to not comply. In these circumstances, we typically\
    \ have only two choices: (1) comply and behave as expected, and consequently,\
    \ fit in and are accepted; or alternatively, we (2) do not behave as expected\
    \ and, in most cases, will be excluded either psychologically or physically from\
    \ the organization. These are the five key levers:\n\n+   1. Day-to-day leader\
    \ actions.\n+   \n+   Most people want to fit in and be accepted by their group\
    \ or organization. To do this, we pay attention to our leaders. We listen to what\
    \ they say and watch what they do. In other words, we \"boss watch.\" We're trying\
    \ to figure out what they think is important so that we can be successful. We\
    \ note where they spend their time, what questions they ask, what they like and\
    \ dislike, and what they see as high priorities. We also note whether they are\
    \ leading-by-example (versus being hypocritical or inconsistent) and leading-by-walking\
    \ around. We use this information to decide how to act ourselves, what to pay\
    \ attention to and what to ignore, and how to be seen as a good employee. Think\
    \ of leaders as signal generators communicating to the organization, which in\
    \ turn, helps employees interpret how they should act. When their signals are\
    \ clear and consistent, employees quickly learn how to act. At Zappos, for example,\
    \ the late CEO, Tony Hsieh, had no private office—just a regular cubicle in the\
    \ midst of others. Leader communication and behavior represent the first, and\
    \ perhaps most important, lever for leading culture.\n\n+   2. Social activities\
    \ and ceremonies.\n+   \n+   Strong culture leaders typically encourage social\
    \ activities and ceremonies to build ties among organizational members. They emphasize\
    \ intrinsic as well as extrinsic rewards (being a part of the group is a reward\
    \ itself), and use group approval to signal group membership. They may even involve\
    \ families, friends, and clients in these activities. As an example, Mary Kay\
    \ Ash (founder of Mary Kay Cosmetics) was very effective at holding elab-"

  md: '# FIGURE 8.1 Team Leadership and Stages of Team Development


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_133_0.png)


    Three things should be noted about Figure 8.1. First, the goal of a team leader
    should be to move the team as expeditiously as possible toward the 4th stage of
    performing. In this latter stage, the team is fully functioning and productive.
    This is not to say that any stage can be overlooked or hurried through. For example,
    although it would seem that the 2nd stage of “storming” should be as quick as
    possible, or even ignored, it has its purpose in terms of airing differences and
    identifying underlying interpersonal problems.


    Second, although there is a natural progression forward from stages 1 to 4, it
    is possible for a team to revert back to an earlier stage. For example, a team
    might be in either the norming or performing stage, and experience a major event
    that might cause conflict within the team (e.g., a new team member, who other
    team members do not like interpersonally). In this instance, the team could quickly
    revert back to the storming stage. As another example, a new leader might be introduced
    into a team, and he attempts to get rid of members (either voluntarily or involuntarily),
    who he perceives to be detrimental to the team. As a result of the turnover, the
    team might in essence be forced back to the forming stage of development.


    Third, this latter example demonstrates the potential effect of leadership at
    the various stages of development. In the forming stage, the leader attempts to
    form ground rules of behavior. For example, in a relatively temporary problem-solving
    team, a leader might establish brainstorming as a ground rule, whereby virtually
    no idea for solving a problem would be dismissed out of hand. The leader might
    also put forth a vision of what the final product or solution of the team might
    look like. As mentioned later in this chapter, that vision could be initially
    crafted or honed through shared leadership processes with team members.


    In the storming stage, attempts to surface underlying differences that could be
    causing conflict, while encouraging dialogue, rather than argumentative discussion.
    With dialogue, judgment and preconceived notions are suspended, people are asked
    to listen rather than just talk or push their own ideas, and all voices are heard.
    With that said, it is not realistic that all conflict in teams can be solved through
    dialogue, and in some instances involving deeply ingrained or personal problems,
    team members may need to be separated, transferred, or even fired. Unfortunately,
    in order to avoid confronting conflict, a leader might attempt to simply sweep
    that conflict under the table, so to'

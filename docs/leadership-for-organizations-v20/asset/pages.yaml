  md: 'The COVID-19 crisis that began in 2020 made the demonstration of compassion
    on the part of leaders even more relevant. Employees were faced with all sorts
    of new stressors in their lives, such as the homeschooling of children or actually
    catching the virus—themselves or significant others. Such circumstances made the
    need for leading with love even more relevant.


    Another aspect of leading with love is attempting to instill fun and excitement
    into work. The expression “hump day” refers to Wednesdays. The idea is that the
    work week is halfway done, and at the end of the work day on Friday, fun can begin.
    The implicit notion is that work is work, and fun is fun, but the two will not
    cross paths. Leading with love involves breaking down such stereotypes about work
    vs. fun. The philosophy of leading with love is that the line between work and
    play should be blurred. Steve Denning is the Chairman of General Atlantic Partners,
    a $20 billion private equity firm. He says that “success without fun isn’t really
    success, and fun without success isn’t really fun.”[27] You need both.


    To better understand leading with love, it is informative to think about its opposite—leading
    with fear, anxiety, and negative emotions. Leading with fear has either overtly
    or in a more passive way constituted the norm of influence practices in the past.
    Fear in organizations manifests itself in many ways, such as fear of failing to
    perform, fear of personal loss, fear of being judged, and so forth.


    Why would one lead through fear, versus through leading with love? The answer
    to this question can be found in what has become known as Theory X versus Theory
    Y assumptions.[28] Leaders with Theory X assumptions believe that people tend
    to dislike work and want to avoid it. Accordingly, in order to get work accomplished,
    followers (or subordinates) need to be tightly controlled, which would include
    a sense of fear that if they perform or behave poorly, they will be strictly punished.
    On the other hand, leaders with Theory Y assumptions believe that the average
    person does not dislike work, will accept and even seek out more responsibility,
    and can be entrusted with setting their own direction or maintaining self-control.
    It should be apparent that a leader with a strong Theory X philosophy would be
    likely to lead through fear, while a leader with a strong Theory Y philosophy
    would be more prone to leading with love.


    What are the likely outcomes of leading with love vs. fear? When one leads through
    fear, short-term production goals might be achieved, but in the long run, followers
    will be very hesitant to try new things or to innovate. As such, they will be
    very risk-averse and perform only up to minimal expectations. On the other hand,
    the likely results of leading with love include trust and commitment, emotional
    engagement, innovation, and sustained customer service.


    Despite the likely benefits of leading with love, there are certainly skeptics
    and naysayers who might suggest that it reflects a “pie in the sky” mentality
    that does not take into account the reality of a workforce that oftentimes is
    not ready to be led with love. Such thinking would suggest that leading with love
    simply reflects what might be termed “unconditional positive regard.” But in reality,
    this is far from the truth. For example, leading with love does not imply that
    a leader would never disagree or provide critique to a follower. However, when
    he does so, it is not for the purpose of ridiculing or proving the follower to
    be wrong. Instead, the goal is to help the follower to grow, learn, and succeed.



  md: 'job (e.g., following instructions or established procedures), and serve relevant
    constituent groups (e.g., customers and clients). A highly responsible follower
    is also more likely to be very engaged in his or her work, and to think critically
    about ways to solve problems that might prevent responsibilities from being met.


    Organizations have mechanisms to hold people accountable for their actions and
    performance. These mechanisms include written codes of conduct, performance appraisal
    systems, and so forth. For some followers, especially those who are less effective,
    their only accountability comes from these *external* mechanisms that might hold
    one to account, so to speak. In other words, there needs to be to external demands
    or pressures (e.g., from one’s boss) for those followers to be accountable for
    their actions. In contrast, more effective followers go beyond being held to account
    by others in that they have their own *internal* sense of accountability. Thus,
    if responsibilities do not get met, the accountable/effective follower will not
    try to shuffle blame to others, but instead will live up to the adage, “the buck
    stops here.”[4] In contrast, less effective followers try to minimize their responsibilities
    and largely do not have an internal sense of accountability.[5]


    It should be obvious that leaders admire and desire followers who are both responsible
    and have an internal sense of accountability. Such followers are likely to be
    viewed as both engaged and loyal by the leader, since they do not upwardly delegate.
    That is, they do not attempt to push responsibilities (e.g., responsibilities
    for solving problems that they have been given) back to the leader; nor do they
    blame the leader when problems or poor performance occur. Upward delegation can
    be very annoying for leaders, and they do not appreciate followers who consistently
    engage in such practices.


    **Balancing service with the courage to challenge.** Effective followers walk
    a tightrope between serving and challenging. By serving, we refer to being highly
    engaged, showing responsibility, and being loyal to the leader. On the other hand,
    there are times when effective followers demonstrate their critical, independent
    thinking by showing courage, challenging the status quo (e.g., established procedures),
    and even challenging their leaders. The question becomes precisely how, and under
    what circumstances, challenges are shown.


    Let’s take a hypothetical example. If a follower challenges her leader to change
    an important work method or procedure, perhaps by using new technology, then such
    a challenge is appropriate and will likely be viewed as a demonstration of good
    followership. However, if the follower persists in pushing her point of view,
    perhaps to the point of engaging in acts that are seen as disloyal by the leader
    (e.g., the follower taking her ideas to the leader’s boss), then the follower
    is not balancing service with the courage to challenge. Instead, the balance has
    shifted too far away from service. Overall, this balance can at times not be an
    easy one to navigate. Nevertheless, an effective follower has both the emotional
    intelligence and political savvy (i.e., social astuteness and interpersonal skills)
    that we discussed in Chapter 2 and Chapter 3 that will allow him or her to deal
    with this tightrope. One practical way to find this balance comes from the military
    context where subordinates are often encouraged to challenge decisions so long
    as the discussion is still open. Once the boss indicates that a decision has been
    made, the subordinate is expected to “disagree but commit” to executing the decision.


    **Supporting organizational goals and directions, or having the courage to leave.**
    To be an effective follower means that one’s loyalty extends beyond one’s immediate
    formal leader, or supervisor. It also means being loyal to the organization. There
    are times when organizational members may question the direction or changes occurring
    in the organization. The changes may pertain to new technologies, organizational
    restructuring, new work methods, and so forth. As stated above, it is good for
    followers to be critical, independent thinkers, which could mean questioning the
    reasonableness or viability of such changes.


    However, there comes a tipping point when a follower might take his questioning
    too far by, for example, persisting to the extent of becoming an obstructionist.
    When that occurs, his critical, independent thinking is no longer productive,
    at least in the current organizational setting. When that occurs, there are only
    two courses of action. First, the follower could simply disengage, and become
    alienated. However, in the long run, disengagement and alienation is neither good
    for the'

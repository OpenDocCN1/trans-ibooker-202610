- pgno: 112
  md: 'Hatten immediately sued the governor''s office in an attempt to get an injunction
    against the executive order. He did a press conference, explaining his actions.
    However, on Tuesday July 7, 2020, the circuit court of Arizona ruled against him
    by deciding to not overturn the governor''s executive order. The same day, Hatten
    announced that he would follow the court''s decision and shut down operations
    by 2 p.m. He also announced that at least through July 27, 2020, he would continue
    to pay his employees.


    But simultaneously, Hatten appealed to the Superior Court of Arizona. On Aug.
    4, 2020, that court made the following ruling: “The Executive Orders, as implemented,
    violate procedural due process . . . fitness centers must be provided a prompt
    opportunity to apply for reopening. The process for doing so must be in place
    within one week from the date of entry of this Order.” In essence, Hatten won
    his case, and he promptly announced that he would reopen his gyms a week later
    on August 11, 2020. In reality, as of August 12, 2020, he had not reopened because
    of a lack of clear guidelines from the governor''s office. Hatten describes his
    situation in an interview with a local news affiliate.


    In a new court filing after August 12, 2020, Hatten appeared to be taking up a
    broader cause beyond his own organization or even his industry, health clubs.
    Specifically, he said, “We''re right in the end, and I think I speak for all small
    business owners, whether it''s health clubs, water parks or other businesses.
    The abuse of power and what he''s doing to small businesses under the guise of
    coronavirus, has to be stopped. We all certainly understand the serious nature
    of the virus, but we all have to be allowed to move forward together and keep
    our businesses open. Otherwise, we will continue to see businesses close their
    doors and entire industries wiped out.”'

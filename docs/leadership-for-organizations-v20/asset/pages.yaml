  md: '# FIGURE 5.3 Follower Development Model: Appropriate Decision-Making Style


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_82_0.png)


    Two things are of special note in Figure 5.2 and Figure 5.3. First, some questions
    can be skipped, as shown by dashed lines. The research of Vroom and Jago would
    suggest that depending on the answer to some of the questions, other questions
    might be skipped. Second, Figure 5.2 refers to a time-sensitive model, while Figure
    5.3 involves a follower development model. Some decision-making that leaders face
    is very time-sensitive in that a decision must be made relatively quickly, which
    can occur most readily through directive or consultative styles. On the other
    hand, if a decision is not so pressing, the follower development model might be
    used. Part of a leader''s responsibility is to develop the abilities of followers,
    including decision-making and problem-solving abilities. Allowing more involvement
    in decision-making processes represents a way for leaders to help give followers
    a better understanding of work and organizational issues, and may even lead to
    positive outcomes such as heightened organizational commitment and effort on the
    part of followers.


    A close inspection of Figure 5.2 and Figure 5.3 reveals that the development-oriented
    model yields more instances of facilitative and delegative styles being prescribed
    for the leader. This should not be surprising in that these styles are characterized
    by the most follower involvement. With that said, there are going to be some instances
    when the two models converge and yield the same prescribed style. Sample written
    cases are listed in Section 6. Each case provides enough information to use the
    decision tree models that are shown in Figure 5.2 and Figure 5.3 in order to come
    up with a prescribed leader style.


    After inspecting Figure 5.2 and Figure 5.3, two logical questions arise regarding
    the necessity and practically of using these somewhat complex decision trees to
    determine the extent to which followers should be involved in decision-making.
    First, why are these decision trees better than simply weighing and balancing
    the seven questions that are posed in Table 5.4? In other words, if answers to
    more of the questions point in the direction of more follower involvement, then
    the leader would simply choose either facilitate or delegate as the decision-making
    strategy. The answer is that Vroom and Jago have conducted extensive research
    that weighs and balances answers to the various questions, and in some instances,
    certain questions are more important than others in determining the best strategy.
    The decision trees take into account this research.[7] Remember that as discussed
    in Chapter 1, effective leadership is both an art and a science. The'

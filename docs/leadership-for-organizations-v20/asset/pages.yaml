    university’s endowment level has grown at rates equaling or surpassing almost
    any university in the country. In essence, this means that the university has
    been able to secure large amounts of funds from rich donors. Furthermore, as compared
    to when Crow took office, university scientists have engaged in increased technology
    transfer efforts. For example, in 2020, ASU ranked #10 worldwide in terms of patent
    awards at universities.[18] Moreover, both faculty and the university have gained
    from revenue streams that are the result of licensing/commercializing the intellectual
    property associated with faculty research.


    The stature of ASU among universities has also gone up. For example, since 2016,
    ASU has been ranked #1 every year by the U.S. News & World Report in terms of
    “most innovative schools”, ahead of famous institutions like Stanford and MIT.[79]
    As a specific example of innovativeness, by the spring of 2020, the Biodesign
    Institute at ASU had built and deployed a high-speed robotic system capable of
    processing 2,000 COVID-19 test kits a day. Indeed, during Crow’s tenure, ASU has
    begun to shed its top party school image for one of academic excellence and research.
    Renowned researchers are prevalent in ASU’s many nationally recognized departments
    and programs, including a Nobel Prize winner in economics. Under Crow, ASU has
    also been able to increase its ability to attract top students, including National

  md: '# Notes


    +   1. As mentioned earlier in this chapter, consulting/selling is significantly
    different from facilitating/participating. The degree of power that is shared
    between leader and follower(s) is the key difference. Consulting is very popular
    with managers because it is relatively easy, it makes sense in many situations,
    and provides for employee input while allowing the manager to maintain control
    of the decision-making process. However, it does not involve true participation,
    although it may seem that the manager is involving employees in his/her decision-making
    to at least some degree. Maintaining power through the control over the decision
    is significantly different from sharing the decision-making power, as is the case
    with the facilitating/participating style.


    +   2. Cases 4 and 5 are individual in nature (i.e., one-on-one between a leader

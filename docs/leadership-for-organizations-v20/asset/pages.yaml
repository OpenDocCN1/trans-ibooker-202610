  md: '# 5.1 Path-Goal Leadership


    At a basic level, the relationship between leaders and followers is all about
    transactions. Leaders and the organizations that they represent get something
    out of the transaction (i.e., employee performance), while at the same time, followers
    benefit as well from the transaction (i.e., various rewards such as continuous
    employment and better work assignments). The problem is that issues or difficulties
    may arise on a day-to-day basis that keep these transactions from being implemented
    to everyone’s satisfaction. To this end, the overall purpose of path-goal leadership
    is for leaders to adapt their style to fit the situational needs of followers
    and their work environment.[8] The goal is for leaders to use an appropriate style
    that will clarify the actions that need to be taken by followers (i.e., the “path”)
    so that they can realize their rewards, while avoiding problems, such as reprimands.
    But simultaneously, the needs of the work environment, including the leader him/herself,
    must be met in order for a transaction to be effective.


    Let’s consider some examples based on follower needs that are shown in Table 5.2.
    If a follower is relatively new on the job or is facing a task with which she
    has no experience, it would help to have directive leadership. That directive
    leadership will provide clarity so that the follower will be more assured that
    her efforts will lead to effective performance and rewards (e.g., job security,
    the possibility of more responsibility, and so forth). In addition, if there is
    a great time pressure to get something done, the leader may feel a need to be
    directive in order to realize organizational goals, as well as the personal goals
    of followers.


    TABLE 5.2 Situational Demands, Path-Goal Leadership Styles, and Effects on Followers


    | Follower Needs | Leadership Style | Effects on Followers |

    |---|---|---|

    | Work is ambiguous for followers; time pressures exist in work environment |
    Directive | Clarifies what needs to be done in order to attain rewards |

    | Followers lack confidence or need personal support | Supportive | Increases
    followers’ confidence or emotional ability to achieve work results |

    | Followers both desire, and should have, more voice or involvement | Participative
    | Allows a sense of control in making sure that results are achieved, and rewards
    are attained |

    | Work is not challenging for followers | Achievement-oriented | Allows followers
    to strive for higher-level goals |


    If a follower lacks confidence, the leader should focus on supportive behaviors
    to help prop up the follower’s self-confidence. Such is oftentimes the case for
    new employees. Although positive reinforcement should be applied to all followers,
    it may be especially important for new employees who may lack confidence. Further,
    from time to time, followers may experience personal difficulties (e.g., problematic
    personal relationships, death of a significant other, and so forth) that might
    hurt them emotionally, and threaten their ability to accomplish work goals. Under
    such circumstances, it behooves the leader to show supportive behavior:


    As also shown in Table 5.2, sometimes followers desire more involvement or voice,
    which in and of itself, could reflect a personal goal (i.e., followers may have
    a felt need for involvement in their work settings). For example, followers may
    feel a need to get involved in a range of decision-making, even beyond how their
    job tasks are performed, such as team scheduling, production standards, quality
    improvement efforts, and so forth. By being more participative and allowing employee
    voice, the leader enhances the follower’s sense of control, and ensures that their
    needs are met. On the other hand, and as articulated further later in this chapter,
    there can be a conflict between a follower’s desire for more participation, versus
    their readiness or capability to effectively handle that participation—at least
    in the eyes of the leader.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'From a path-goal perspective, follower voice can have an additional advantage
    that goes beyond task-related or workplace decision-making. When leaders allow
    followers to speak up or have a voice, they can learn more about their own personal
    goals or needs. For example, the head of a minor league baseball league, Dave
    Kavalk, described a conversation to us about an employee who had not been following
    his directives. Instead of just reprimanding the employee, he took the opportunity
    to provide the employee with a voice, thereby learning about a special desire
    that the employee had to play the role of a team’s mascot. In a path-goal model,
    Kavalk negotiated with the employee about how this desire could be satisfied if
    the employee learned to more conscientiously follow directives. In this way, the
    goals of both Kavalk and the employee were attained.


    Finally, achievement-oriented leadership may be warranted when a follower is not
    being appropriately challenged. If not properly challenged, followers may get
    bored and frustrated, which could eventually lead to turnover. But again, it is
    always possible that a follower may think that she could use more challenging
    work, and she might even lobby her leader for it, but the leader may feel differently,
    or such opportunities are simply not available in the organizational context.
    This often occurs for relatively new employees, or employees who are “freshly
    minted” from school. The leader may feel that the new employee is not ready for
    increased challenges, or that the new employee has not “paid her dues” in terms
    of time spent conducting lower-level tasks.


    One thing that should be emphasized is that these styles are neither mutually
    exclusive, nor rigid in their application. In other words, it is possible that
    in a given situation, a follower might best be served by the leader applying more
    than one style relatively simultaneously, although one of those styles might be
    predominant. For example, a leader might choose to be mainly directive, but still
    be somewhat supportive. In addition, if in a given situation, a leader has shown
    a strong tendency toward being supportive, but it has not worked out well in terms
    of achieving goals for either the follower or the organization, it is always possible
    to switch to another style over time (e.g., become more directive).


    As a final note about path-goal leadership, it should be clear in the above discussion
    that it is largely about the follower, and specifically dealing with individual
    follower needs. However, the follower is not the only one with needs. The needs
    of the organization, as well as those of the leader, must be met in order for
    a transaction to be effective. It is quite possible for the needs of the various
    parties to clash. For example, there could be times when a follower needs personal
    support, but the needs of the organization or the leader suggest that a more directive
    approach is warranted. Highly uncertain or crisis conditions come to mind, whereby
    even if a follower has personal problems (which might suggest the need for supportive
    leadership), the leader might perceive a lack of time to provide such support,
    or more pressing demands of the organization. Accordingly, the leader might become
    highly directive and demanding of the follower in that situation, while showing
    less concern for supportiveness.


    # 5.2 Hersey/Blanchard Approach to Situational Leadership


    Decision-making is an obviously important task for leaders. From a leadership
    perspective, we focus on the process by which leaders make decisions, rather than
    the nature of the decisions that are actually made.⁴ We especially consider the
    extent to which they involve followers in that process. Hersey and Blanchard put
    forth a situational leadership approach that has been used primarily to help leaders
    determine a decision-making style in various situations that they face.⁵ The basic
    question is if, and to what degree, followers should get involved in decision-making.


    Decision-making styles. As shown in Figure 5.1, there are four basic styles that
    may be used. The first style is to be directive, whereby the leader makes decisions
    for followers and provides explicit'
  merge: -1
  img_proc: true
- pgno: 78
  md: "directives or instructions. A second style is consultative, whereby the leader\
    \ seeks input from followers, allows for questions, and overall provides followers\
    \ with some degree of “voice” in the decision-making process. Indeed, the leader\
    \ might even go through more than one iteration whereby a solution to a problem\
    \ is posed, followers provide input, the leader reformulates a modified solution,\

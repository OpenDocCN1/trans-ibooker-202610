- pgno: 39
  md: '**internal locus of control**


    One''s belief that by and large, the things that happen to that individual in
    life are due to his or her own actions and efforts. On the other hand, a person
    with an external locus of control believes that luck, fate, or outside forces
    (e.g., other people or events) are the determinants of his or her outcomes in
    life.


    **Internal locus of control** is related to the qualities described above. This
    characteristic pertains to one''s beliefs about fate or luck, versus personal
    control. An individual with a strong locus of control believes that by and large,
    the things that happen to that individual in life are due to his or her own actions
    and efforts. On the other hand, a person with an external locus of control believes
    that luck, fate, or outside forces (e.g., other people or events) are the determinants
    of his or her options in life. Can you guess which type of individual would probably
    be seen as more of a leader? If you guess the internal locus of control, you are
    correct. People tend to follow those who believe that they are the masters of
    their own fate.


    As an example, Nelson Mandela, while imprisoned for twenty-seven years, maintained
    a mindset that he was the master of his own fate, not his captors. This mindset
    inspired not only himself to endure the hardships of prison, but also others around
    him. In communication with fellow prisoners on Robben Island in South Africa,
    he would frequently quote the words of Winston Churchill, “We are still masters
    of our fate. We still are captains of our souls.”[5] David Neeleman was the founder
    and CEO of JetBlue Airways, but in 2007 he was fired. After getting over the shock,
    he said, “The worst thing in life is to be a victim.”[6] He moved to Brazil and
    founded a new airline, Azul, which is now very successful. His resilience stems
    from his internal locus of control.


    # Self and Other Awareness


    Leaders are people who are aware not only of themselves, but also other people
    to whom they relate in some manner. Self-awareness implies an understanding of
    one’s own beliefs, emotions, values, strengths, and weaknesses. Take the example
    of a person who strongly values community service and social responsibility. If
    that individual does not understand why he or she possesses such values, it would
    be hard to explain to or convince others (i.e., those who might follow this person’s
    lead) why certain actions are necessary. Further, by understanding how one’s social
    responsibility values can be blended with the fiduciary responsibilities of the
    firm, the leader will have a better chance of “selling” those values to employees,
    customers, shareholders, and so forth.


    On the other hand, effective leaders are also aware of others’ strengths, motivators
    and desires, and fears and self-doubts. Most importantly, leaders can recognize
    how these things differ across individuals. Armed with such capabilities, leaders
    are able to better influence people toward goals. Liz Smith is the CEO of Bloomin
    Brands, a $4 billion restaurant chain with 1,500 locations and 100,000 employees.
    When asked what she thought was the most important trait for a leader, she replied,
    “The one thing you need more than anything else as a leader is self-awareness.”[7]


    # Emotional Intelligence


    In Chapter 1, we considered differences between “management” and “leadership”.
    One key difference pertains to affect or emotions. In managerial terms, emotions
    can represent a nuisance, and something to be either ignored or dismissed as irrelevant
    in work settings. In other words, managers tend to think in more task-oriented
    terms about getting work done in as efficient a manner as possible. But to leaders,
    emotions are to be embraced and harnessed, and they are key to understanding themselves,
    as well as how to influence others. Emotions can come in many forms—including
    both positive and negative emotions. Positive emotions pertain to things like
    joy, excitement, and enthusiasm, while negative emotions involve sadness, fear,
    anger, and anxiety. It should not be surprising that the ability to deal with
    one’s own as well as others’ emotions, or what has become known as emotional intelligence,
    is a key personal quality that is relevant to effective leadership.[8]


    As shown in Table 2.1, emotional intelligence has several key components pertaining
    to: (1) the awareness of one’s emotions and those of others, and (2) actions taken
    towards one’s emotions and'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'those of others. In terms of awareness, there are two elements. First, there
    is self-awareness. People who are self-aware are highly in tune to their own emotions,
    and the effect of those emotions on their functioning. Thus, a self-aware person
    might recognize that she is highly anxious, and that this anxiety is noticed by
    others, such as followers. Given that followers take their cues from leaders,
    a lot of anxiety, especially in times of crisis, would be highly demotivating
    and stressful for followers. Second, there is social awareness. People who are
    socially aware can recognize and show empathy toward the emotions that are being
    felt by others. For example, a leader might pick up on the fact that followers
    are showing a lot of trepidation during times of change (e.g., an organizational
    restructuring), and thus try to be a calming force of reassurance for followers
    that change will end up being beneficial for all.


    | | Awareness | Actions Taken |

    |---|---|---|

    | Focus on Self | Self-awareness | Self-management |

    | Focus on Others | Social awareness | Relationship management |


    Regarding actions taken, again, emotional intelligence pertains to one''s own
    emotions, as well as the emotions of others. First, there is self-management.

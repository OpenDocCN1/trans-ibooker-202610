  md: "# # The Milgram Experiment\n\n![](img/5a5fcd49e67d713bc6c99c1cc791987a_192_0.png)\n\
    \nView in the online reader\n\nThe answer is to be found in the power of norms,\
    \ or social expectations, and how in many situations, we look to either the context\
    \ or people in leadership positions for guidance in how to feel and act. In the\
    \ prison experiment mentioned above, subjects who were put in the position of\
    \ prison guards started to feel powerful and act in a coercive manner toward other\
    \ subjects who were prisoners. In the Milgram experiments, subjects reacted in\
    \ an obedient way to the experimenter, even when they themselves felt uncomfortable\
    \ and questioned their own behavior. In social settings, including organizations\
    \ in which we work, we often rely on information from the context and others (e.g.,\
    \ leaders) to guide our own behavior. This influence comes in two forms: (1) informational\
    \ social influence or descriptive norms (e.g., no one wears a tie around here),\
    \ or (2) normative social influence or injunctive norms where there is approval\
    \ or disapproval for behaving or not behaving in a particular way (e.g., we make\
    \ fun of people who wear a tie). Although this agreement may seem unimportant,\
    \ the overwhelming evidence is that descriptive and injunctive norms are powerful\
    \ determinants of how people in organizations behave. Agreement among an organization’s\
    \ members about how to think and behave helps people fit in and coordinate actions.\
    \ A failure to comply can result in an individual being isolated or excluded from\
    \ the group.\n\n> **strong culture**\n> \n> Tightly shared norms, beliefs, and\
    \ values among organizational members.\n\nWhen members of an organization agree\
    \ that certain behaviors are important (there is agreement about the content of\
    \ the norm), and when people feel strongly and are willing to sanction others\
    \ for noncompliance (there is intensity about the norm), then a strong culture\
    \ exists. That is, a strong culture is one in which there are tightly shared norms,\
    \ beliefs, and values regarding appropriate behavior among organizational members.\
    \ Under these circumstances, new members have two choices: (1) they can either\
    \ comply and fit in, or (2) not comply and are likely to be excluded socially\
    \ and psychologically. What many people underestimate is how powerful the effects\
    \ of culture are on behavior. Often, we tend to think that behavior is a function\
    \ of the individual’s values, needs, and personality, rather than the expectation\
    \ of others. While personality may be one important determinant of behavior in\
    \ unconstrained situations, it is much less important in groups and organizations\
    \ where there are very strong norms and values (e.g., religious organizations,\
    \ the military). In these situations, behavior is largely driven by the expectations\
    \ of others. Perhaps most importantly, leaders can have a large effect on norms\
    \ and values—and their enforcement. Thus, it behooves leaders to understand the\
    \ norms and values that develop in their organizations and can become ingrained\
    \ in culture. A strong culture can be both positive and valuable. But as also\
    \ shown in the experiments described above, a strong culture can potentially be\
    \ negative and destructive."
  merge: -1
  img_proc: true

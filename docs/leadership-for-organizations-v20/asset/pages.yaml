  img_proc: true
- pgno: 174
  md: 'Beyond change, transformational leadership is also about developing a bond
    between leaders and followers, largely through the building of trust. More transactional
    forms of leadership, such as the path-goal approach that we addressed in Chapter
    2, are oriented toward getting goals accomplished in the here-and-now. While transactional
    leadership can be beneficial, it does not help to build the long-term bonds and
    trust that accompanies transformational leadership.


    # # 11.3 Mission as a Basis for New Visions


    **mission** Represents a relatively enduring core purpose of an organization that
    is established by its founding leader(s), and is its reason for existing.


    As previously mentioned, vision is a core element of what makes a leader inspirational.
    Before describing the nature of leader vision, it is important to consider the
    connection to an organization’s mission. Mission (also known as core purpose)
    represents a relatively enduring quality of an organization that is established
    by its founding leader(s). It endures despite changing technologies, economic
    circumstances, and other changes in an organization’s environment.[13] Mission
    is essentially the organization’s broad purpose or reason for existing. Although
    it is not a vision per se, mission provides a basis for creating new visions as
    the organization develops over time.


    The nature of a firm’s mission can vary, which has implications for how it is
    managed, and whether or not key stakeholders (e.g., investors, potential employees,
    and customers) are drawn to the firm. Moreover, the nature of its mission can
    affect firm performance over time. So how exactly can a firm’s mission vary, and
    why is firm performance affected? Think of mission as a continuum that goes from
    narrow to broad. When narrow, mission is framed in terms of a specific product
    or monetary goal (e.g., profits). When broader, mission is framed in terms of:
    (1) innovation, (2) excellence, or (3) socially-based, core purpose. Some examples
    are shown in Table 11.1.[14]


    # TABLE 11.1 Alternative Core Purpose (Mission) Statements


    | Narrow, and not Actual (but could have been possible) | Broader, and Actual
    |

    | :--- | :--- |

    | Mary Kay: Sell cosmetics | Mary Kay: Enrich the lives of women |

    | 3M: Make adhesive and abrasives | 3M: Have a perpetual quest to solve problems
    |

    | Dollar General: Sell things for less than $1 and still make a profit | Dollar
    General: Give low income people a good deal |

    | Liberty Mutual: Sell insurance | Liberty Mutual: Help people live safer, more
    secure lives |

    | General Electric: Be competitive in each industry in which it does business
    | General Electric: Be either #1 or #2 in each industry in which it does business
    |

    | Motorola: Make televisions | Motorola: Apply technology to benefit the public
    |

    | Starbucks: Sell cups of coffee to go (or to drink in the store) | Starbucks:
    ??? |

    | Apple: Make personal computers | Apple: ??? |


    The “Narrow, and not Actual” mission statements on the left side of Table 11.1
    are all hypothetical. In other words, they could have been the actual mission
    statements of these organizations, but because of the original and subsequent
    leaders of these firms, those “Narrow, and not Actual” statements were not the
    actual basis of these firms’ missions over time. In contrast, the “Broader, and
    Actual” mission statements on the right side of Table 11.1 were in reality implemented
    over time. Our'

- pgno: 186
  md: '# # CHAPTER 12 Strategic Leadership and Shaping Organizational Culture


    > > "If you''re really going to transform an enterprise, you''ve got to understand
    culture... It took me to age fifty-five to figure that out. Culture is everything."—Lou
    Gerstner, CEO of IBM 1993–2002


    # ## Learning Objectives


    +   1. Explain the key elements of competitive advantage and how the shaping of
    organizational culture is relevant to achieving such advantage.

    +   2. Describe the issues involved in aligning culture with vision, mission,
    and strategy.

    +   3. Determine how culture strength can be either a good or bad thing.

    +   4. Explain and manage the steps that a leader takes to create and reinforce
    culture.


    In prior chapters of this book, we have largely considered leadership qualities
    and behaviors that are relevant at various levels of management in organizations.
    In Chapter 10, we began to turn our attention to more strategic or upper levels
    of management in our consideration of core purpose and vision. In this chapter
    and the next, we continue our focus on strategic leadership. The overarching goal
    of strategic leadership is to create **competitive advantage** for a firm. What
    exactly is competitive advantage? One way of answering this question is to use
    a resource-based perspective in order to understand a firm''s valuable resources
    and how those resources might be brought to bear in terms of creating a competitive
    advantage. Such advantage can be created if resources are:


    +   * valuable by enabling a firm to improve its efficiency and effectiveness;

    +   * rare and not easily imitated by other firms; and

    +   * non-substitutable or not easily replaced by some other non-rare resource.[1]


    **competitive advantage**


    The advantage that a firm creates for itself based on valuable, rare and not easily
    imitated, and non-substitutable resources.


    Organizational culture is one means through which competitive advantage of a firm
    can be achieved. Culture can be valuable; for example, in terms of potentially
    motivating employees, helping to serve customers, and stimulating innovation.
    However, being valuable alone does not ensure competitive advantage. If something
    that is valuable can be easily copied or imitated by a competitive firm, then
    it will not serve as a competitive advantage. That said, culture is not easily
    copied or imitated because it involves elements like values, beliefs, and norms
    that take a long time to develop and become engrained and shared among organizational
    members. Further, culture and the potential value that it creates is non-substitutable.
    In other words, it cannot be easily replaced by a non-rare resource (e.g., training
    programs). Stated another way, the valuable effects that culture can create are
    largely unique to culture itself. Later in this chapter when we consider mechanisms
    for leading culture, we will see how training programs can help solidify or engrain
    culture. But training per se, should not be viewed as a substitute for culture
    as a competitive advantage.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'As portrayed in this chapter, it is the job of the strategic leader to identify,
    protect, and nurture resources that meet the above criteria of competitive advantage.
    The leader does so through three key steps:


    +   1. establishment or redirection of a mission (or core purpose) and a shared
    vision

    +   2. formulating strategy

    +   3. implementing mission, vision, and strategy


    Step 2, formulating strategy, is the primary issue addressed in books and courses
    on strategic management. Steps 1 and 3 pertain to strategic leadership, which
    is why we focus on these two steps in this book. To some degree, we addressed
    step 1 in Chapter 11, and we will continue to address “redirection” in Chapter
    13 as we consider the role of strategic leadership in organizational change. In
    the current chapter, we consider how strategic leaders use step 3 to shape organizational
    culture for the purpose of establishing, implementing, and sometimes redirecting
    mission, vision, and strategy—ultimately to help achieve competitive advantage.
    Before attempting to describe further the connection between leadership, culture,
    and competitive advantage, we first focus on how an organization’s context or
    environment creates the ongoing need for active, strategic leadership, including
    the building and shaping of organizational culture.


    # 12.1 Environmental Context, Competitive Advantage, and Organizational Culture


    It is important to put strategic leadership in context; specifically, the environmental
    context of firms. In many ways, strategic leadership is about continuously monitoring
    or scanning an organization’s environmental context for the purpose of determining
    new trends, threats, and opportunities—all of which can potentially affect (positively
    or negatively) competitive advantage. That context can be largely characterized
    along three dimensions:


    +   1. economic (i.e., globalization trends, increased competition);

    +   2. regulatory (i.e., changing local, national, and global laws/regulations
    that can affect how a firm does business); and

    +   3. technological (i.e., how changing technology can affect work processes,
    products, and services).


    Aspects of the environment are more or less relevant to a particular firm depending
    on the nature of its business and customers. For example, regulatory issues are
    especially relevant to healthcare and energy sectors. Technological issues are
    especially relevant to firms in electronics industries. Regardless of the industry
    in which a firm competes, the job of the strategic leader is to continuously keep
    an eye on trends and changes that might challenge the status quo, or how the organization
    is currently maneuvering in its environment to maintain competitive advantage.
    In this chapter, our focus is on how a strategic leader builds or shapes organizational
    culture to help ensure that his or her firm remains competitive in its environment.
    If there is a culture gap, then an organization’s values, norms, and behavior
    will not be aligned with the needs or demands of its environment, which can engender
    competitive disadvantage. In other words, there will be a difference between desired
    culture and actual behavior. It is the job of strategic leaders to identify when
    gaps of this nature are occurring, and then take steps to reduce the gap.


    Let’s take an example. In the early 1990s, the IBM Company was failing. Its stock
    price had plummeted, and many Wall Street analysts were calling for the firm to
    be broken up and sold off in pieces. By 1992, more than 60,000 jobs had been lost
    and, in spite of the previous CEO’s efforts at transformation, the company seemed
    doomed. In 1993, Lou Gerstner became the first outsider'

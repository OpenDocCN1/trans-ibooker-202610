  md: 'Zappos emphasizes hiring only people who fit their culture, train all newcomers
    in the Zappos way, and they encourage all employees to always help their customers
    (internal or external). This means there are no limits to how long a customer
    service representative may stay on the phone with a customer (the longest customer
    call was almost six hours). By 2008, the company had more than $1 billion in sales.
    In more recent times, more than 75 percent of Zappos customers are repeat buyers,
    and the company has moved from selling just shoes into housewares and other clothing
    items. This customer loyalty stems directly from their culture.


    **Cypress Semiconductor.** Beyond helping to execute vision, mission, and strategies,
    organizational culture can also be valuable in attracting, motivating and retaining
    employees. If a company has very strong norms and values, these can act as a signal
    to potential employees and help them decide on whether the firm is a good fit
    for them. Cypress Semiconductor is a firm that is sometimes described as “the
    Marines of Silicon Valley.”(21) It largely has an achievement culture that emphasizes
    very high levels of individual performance, great attention to detail, and complete
    transparency and openness. It does not emphasize collaboration (i.e., not a clan
    culture) or customers. Nevertheless, because the culture is so clear, Cypress
    can attract people who like this type of work environment, and they are able to
    screen out those who will not fit. Some people might find the Cypress culture
    too aggressive and restrictive, but for those who like the culture, Cypress is
    a great place to work.


    # # “Strong” Culture and Competitive Advantage


    By being clear about norms and values, a strong culture can also be a great source
    of motivation for employees. If employees like the culture and what the organization
    stands for, they may identify with the firm; that is, they admire what the firm
    stands for and are proud to tell others that they work there. Further, they may
    internalize the norms and values of the company as their own; that is, their own
    norms and values of behavior are the same as those of the organization. If employees
    identify or internalize the norms and values of the organization, research would
    suggest that they are more likely to be highly motivated and willing to go the
    extra mile for the company.(22)


    In sum, culture can be important for leaders and their organizations for multiple
    reasons. First, acting as a social control system, it can help (or hinder) the
    execution of strategy. Second, when an organization has a strong culture, it is
    better able to attract, motivate and retain the right types of employees and more
    likely to screen out those who will not provide a good fit. But overall, when
    culture is strong (i.e., tightly shared norms, beliefs, and values among organizational
    members), it can help create competitive advantage. Specifically, a strong culture
    can meet the requirements of competitive advantage in that it provides value,
    is not easily imitated by other firms, and is difficult to substitute with some
    other, non-rare resource.


    With that said, we should also acknowledge that as suggested earlier, a strong
    or tight culture is not always a good thing. It is possible for a strong culture
    to encourage norms and values that are destructive for both the firm and its employees,
    as was the case with Enron a number of years ago.(23) Enron had a culture that
    was strong, but characterized in terms of unethical norms and values. Although
    these norms and values were widely shared by employees, the resulting actions
    and behaviors on their part did not result in competitive advantage in the long
    run. As another example, a firm may develop a strong culture over time that not
    only fails to include adaptability as a dimension, but actually includes norms
    and values that discourage flexibility and change. In a world that increasingly
    demands ongoing change on the part of firms, such strong cultures can be counter-productive.
    The following section will describe how leaders can use these insights to create
    and shape culture for competitive advantage.'

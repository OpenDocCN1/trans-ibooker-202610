  md: '# CHAPTER 2

    Leader Traits and Characteristics


    > "There''s no telling how far a person can go if he''s willing to let other people
    take the credit." —Robert Woodruff, CEO Coca-Cola Company


    > "To handle yourself, use your head; to handle others, use your heart." —Eleanor
    Roosevelt


    > "They laugh at me because I am different. I laugh at them because they''re all
    the same." —Kurt Cobain


    > "I''ve failed many times in my life and career and because of this, I''ve learned
    a lot. Instead of feeling defeated countless times, I''ve used it as fuel to drive
    me to work harder. So today, join me in accepting our failures. Let''s use them
    to motivate us to work even harder." —Phil Mickelson (tweet on May 11, 2021—prior
    to winning the PGA Championship on May 23, 2021)


    # Learning Objectives


    +   1. Summarize the psychological and emotional traits that are associated with
    effective leaders.

    +   2. Describe the paradoxical nature of leadership qualities.

    +   3. Contrast leader behavioral styles in terms of generalized vs. decision-making
    behavior.

    +   4. Identify how a leading with love philosophy is key to being a more relations-oriented
    leader.

    +   5. Describe how there are neurological underpinnings of effective leader traits
    and behaviors.


    Imagine an individual who when you think of this person, the word “leader” stands
    out in your mind. In other words, you think of this person as personifying what
    leadership is all about. He or she could be someone with whom you have had actual
    contact in the past, or alternatively, the person could be someone who you have
    observed from afar (e.g., through reading, media reporting, documentaries, and
    so forth). What one trait or characteristic stands out in your mind that makes
    you want to think of this individual as a leader? The chances are that you are
    thinking about a quality that will be featured in this chapter.'

    meetings with faculty and students. He has been known to either intentionally
    or unintentionally embarrass or even lash out at people (sometimes in public)
    who pose challenges to his own ideas or authority—even when those challenges are
    constructive in nature. One journalist claimed that this behavior has created
    a “culture of retaliation” at ASU.[90]


    Sixth, in more recent years, Crow has been noticeably absent in terms of visits
    to units/colleges or the various campuses. During the earlier years of his tenure,
    he had more of a physical presence throughout the university (e.g., town hall
    meetings with faculty, students, and staff). In later years, this presence seems

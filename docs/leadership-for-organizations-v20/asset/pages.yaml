- pgno: 52
  md: '# Leader-Member Exchange and Relationship-Building


    > "Even the worst employee can make a difference. The test of leading is not with
    the easy-to-manage employee, but with the difficult-to-manage employee. Work with
    that person, set new goals and coach and encourage him or her to succeed." —Bob
    Nelson, author and management consultant


    # Learning Objectives


    +   1. Identify how leader-member exchange (LMX) forms.

    +   2. Define in-group versus out-group relationships.

    +   3. Describe the LMX dilemma in terms of out-group formation.

    +   4. Formulate what can be done to prevent or remedy the LMX dilemma.

    +   5. Identify the importance of political savvy on the part of leaders as a
    means of building relationships with and influencing peers, customers, suppliers,
    and superiors.


    Leadership is largely about forming and maintaining relationships over time with
    individuals who the leader is attempting to influence. Indeed, relationships are
    key to the influence processes that are essential to leader effectiveness. In
    other words, leaders influence, and relationship-building is pivotal to being
    able to influence others. Relationships can be formed with a variety of individuals,
    including peers, superiors, customers, and perhaps most importantly, followers.
    In this chapter, we address all of these types of targeted individuals with a
    particular focus on followers. We begin by describing the nature of relationship-building
    with followers and its importance.


    # 3.1 Leader-Member Exchange


    A person in a leadership role can initially come into contact with a follower
    in one of two ways. First, the leader can be involved in selecting the follower
    into his or her team, perhaps in conjunction with others who might have input
    in the selection process (e.g., human resource officials). Second, the leader
    might be placed (e.g., through promotion, transfer, and so forth) into a context
    where followers already exist. In either instance, the leader will form a relationship
    with followers that evolves over time. There is some truth to the old adage, “love
    (or hate) at first sight,” which would suggest that the relationship between leader
    and follower gets carved in stone early on. Nevertheless, there is at least some
    tendency for relationships to change or evolve over time—sometimes to be more
    favorable, but unfortunately, sometimes to be less favorable.'

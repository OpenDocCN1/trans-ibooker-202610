  md: 'Americans. Although the Japanese negotiators cannot be clearly heard, it is
    obvious that they are speaking to one another in Japanese.


    During the Japanese side-conference, the Americans also huddle and talk among
    themselves. One of the Americans speaks up and says, "You know these Japanese
    guys are really rude. For the most part, when I''m speaking, they won''t even
    make eye contact with me. To add insult to injury, they can''t even be honest
    with me. I know that sometimes they just want to say ''no'' to my face, but they
    don''t have the decency or maybe guts <big grin> to just come right out and say
    it." A second American speaks up and says, "Yeah man, I hear what you are saying.
    Look at them right now—all huddled up and whispering in Japanese. I''d bet that
    they''re plotting some slick maneuver in these negotiations."


    After about 5–10 minutes, the Japanese negotiators return to the table, and announce,
    "It is getting close to dinner time. We think that this might be a good time to
    take a break, and for all of us to go to dinner together. Perhaps we can find
    a restaurant and continue getting to know one another over food and drinks." One
    of the Americans then whispers in the ear of one of his colleagues, "These guys
    are just trying to stall. We had planned on wrapping this negotiation up today
    and being on a plane back to the U.S. tomorrow. And now these guys are just talking
    about eating, drinking, and schmoozing. Jeeezzz ..."


    As mentioned in Chapter 7, people have a tendency to form quick judgments or attributions,
    oftentimes negative in nature, about the motives, behaviors, and personalities
    of others. This tendency can be even stronger in cross-cultural situations that
    provide a lot of uncertain or confusing information, such as the ones mentioned
    above. Indeed, we can clearly see these negative attributions or judgments in
    the words of the American negotiators who are attempting to make sense of the
    behavior of their Japanese counterparts.


    In many instances, such attributions are wrong, and can lead to counterproductive
    behavior (e.g., negative accusations). For example, more often than not, when
    negotiators whose first language is not English (e.g., the Japanese individuals
    in our example) want to take a side-bar huddle, it is not because they are plotting
    some sneaky maneuver. Rather, it is simply because they do not understand some
    of the English that is being spoken, and are attempting to interpret it among
    themselves. One might wonder why they simply do not ask for clarification directly
    to the Americans. But in doing so, they might feel embarrassed or lose face.[28]
    In the Saudi example, it may simply be customary in his culture to hold hands
    with a male colleague, and it has no sexual connotations. It follows that any
    attribution of motives to the contrary on the part of the American would be a
    misinterpretation.



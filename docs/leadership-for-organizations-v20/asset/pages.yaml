  img_proc: true
- pgno: 53
  md: '# leader-member exchange (LMX)


    The manner in which relationships between leader and followers forms or evolves;
    how a follower assumes roles; how the leader acts or responds towards the follower,
    and the “chemistry” that occurs.


    How exactly do these relationships form or evolve? Much of the answer to this
    question lies in how a follower assumes roles, how the leader acts or responds
    towards the follower, and in the ‘chemistry’ that occurs. In other words, when
    it comes to leader-member relationships or what is known as leader-member exchange
    (LMX), it definitely “takes two to tango.” to quote an old adage. To some people,
    this may seem counterintuitive, since they might feel that leadership is all about
    the leader, and what he or she does in relation to followers. However, our premise
    in this chapter, as well as the next, is that followers also play a key role in
    LMX.


    The main idea of LMX is that leader-follower relationships are based on exchanges.
    But what exactly do leaders and followers exchange? In other words, what are the
    “currencies” of exchange?[1] Essentially, there are two types of exchanges: (1)
    tangible, and (2) intangible. Tangible exchanges are in line with what we traditionally
    consider “currencies” to be all about. They are economic or productivity-based.
    The most basic exchange is one’s salary for satisfactory performance. However,
    tangible exchanges can be a bit more passive in the form of simply being left
    alone if one is performing satisfactorily. For example, a follower may simply
    prefer to be left alone or avoided by the boss if that follower is performing
    adequately, rather than being continually questioned, being the subject of abuse
    or ridicule, and so forth. In other words, such avoidance could be seen by some
    followers as a positive exchange—or at least a lack of negative exchange.


    Tangible exchanges form the foundation of a relationship between leader and follower,
    and if missing or perceived to be unfair, could certainly cause problems. However,
    exchanges of this nature do not account for the full scope of possibilities with
    regard to leader-follower relationships, and they do not fully explain the long-term
    nature of relationships. Indeed, not all exchanges involve monetary currencies,
    or things that are readily translatable into monetary value. Intangible exchanges
    are also important to consider. An intangible exchange pertains to things like
    friendship (or friendliness), acceptance of mutual responsibility, loyalty, and
    trust. For example, trust is a powerful factor in any relationship, including
    those between leaders and followers. Without trust, the leader will feel a need
    to closely monitor the actions and behaviors of the follower, which takes a lot
    of time and tends to generate anxiety on the part of both leader and follower.
    Likewise, the follower will only put forth enough effort to satisfy the “contractual”
    nature of their relationship.[2] Moreover, the follower will not be motivated
    to be creative or find solutions to vexing problems, for fear of failure or reprimand.
    However, if trust exists, the relationship is more relaxed, and followers are
    likely to be motivated to put forth extra effort and creativity, and accept greater
    responsibility.


    In terms of the characterizations of LMX, one of two basic directions are likely
    to occur. These different directions are commonly referred to as in-groups vs.
    out-groups, and they are depicted in Figure 3.1.[3] First, a follower could become
    part of a leader’s in-group, which is based largely on the type of intangible
    exchanges described above. Leaders embrace followers into their in-groups for
    different reasons, but one key reason is that a follower will demonstrate early
    on that he or she can perform well and take on increasing responsibility. This
    would obviously take pressure off of a leader to have to closely monitor the follower,
    which given the time demands of leaders, is always a welcomed relief. Alternatively,
    the leader might embrace a follower because he or she has similar values, interests,
    or background. For example, a leader who enjoys playing golf as a pastime will
    naturally take favorably to a follower who also plays golf. The two individuals
    will likely spend more time together, perhaps as compared to time spent by the
    leader with other followers, which then reinforces in-group membership. Keep in
    mind that such “membership” is informal, and not discussed or perhaps not even
    recognized by either party. The upshot of being in the leader’s in-group is that
    the follower will enjoy better work assignments or conditions (e.g., hours worked),
    receive positive coaching and feedback, and be able to provide a lot of input
    into decision-making and problem-solving.'

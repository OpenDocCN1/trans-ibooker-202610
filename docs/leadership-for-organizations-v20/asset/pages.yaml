    \ makes it clear that he or she has just one voice, and followers have equal voice.\
    \ Finally, the leader may choose a delegative style, whereby the decision-making\
    \ process and its implementation is turned over to followers.\n\n# FIGURE 5.1\
    \ Leader Decision-Making Styles\n\n![](img/5a5fcd49e67d713bc6c99c1cc791987a_78_0.png)\n\
    \nSource: Adapted from Vroom, V.H. (2000). Leadership and the decision-making\

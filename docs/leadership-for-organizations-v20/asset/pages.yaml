- pgno: 32
  md: 'These six principles are reinforced throughout this book and in the associated
    case videos that you will view. It is our hope that when most other things about
    your learning in this course are forgotten, you will remember and practice these
    principles. If so, you are well on your way to being an effective leader.


    # # 1.4 Discussion Questions


    +   1. How is leading different from managing? Why is each function important
    in its own way?

    +   2. What does it mean that leadership can be understood and applied at different
    levels: individual, team, and organizational?

    +   3. Why is the development of leadership skills important for you personally?

    +   4. How is context relevant to the display of effective leadership?

    +   5. What does it mean that we can learn about effective leadership by recognizing
    prior research findings, and why is such learning better than an understanding
    based only on individuals'' experiences?

    +   6. Among the six principles listed at the end of this chapter, which one(s)
    do you think you will remember most clearly years from now, and why?


    # # 1.5 Appendix: Role Modeling Leadership from WWII—The Cases of Band of Brothers
    and Red Tails


    # ## Band of Brothers


    Band of Brothers is an HBO miniseries that tells the story of the 506th Parachute
    Infantry Regiment of the 101st Airborne division of the U.S. Army in World War
    II.[25] Specifically, it is a dramatic reenactment of individuals in a particular
    company ("E" or "Easy" Company) of that Regiment. Several individuals who are
    featured in the miniseries display aspects of leadership, or leader-member relations,
    that are highlighted in this book.


    Below, we list those individuals, and the concepts in this book that they especially
    depict.


    **Major Richard Winters.** Major Winters is the main character of the miniseries.
    He demonstrates a number of aspects of effective leadership, including the following:


    +   - **Relations-oriented leadership**—As described in Chapter 2, relations-oriented
    leadership is a primary dimension of behavior that is shown by effective leaders.
    Major Winters demonstrates such leadership on numerous occasions, such as when
    he comforts a private, Albert Blithe, who appears to be exhibiting battle fatigue.
    This is also an example of individualized consideration, as described in Chapter
    11.

    +   - **Task-oriented leadership**—As also described in Chapter 2, task-oriented
    leadership is important for effective leaders. Throughout the miniseries, Major
    Winters shows his ability as a military tactician. He directs his men in some
    difficult maneuvers in such a way that achieves'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'results, while minimizing casualties to the extent possible. He displays his
    task-oriented leadership in a confident and clear manner, while not seeming excessively
    authoritarian.


    +   • Leader-member exchange—As described in Chapter 3, it is important for leaders
    to form good one-on-one relations, or leader-member exchange (LMX) with followers.
    In general, Major Winters did a good job of forming high-quality relationships,
    or high LMX, with his men. However, one particular man, Staff Sergeant Bill Guarnere,
    gravitated to what is referred to in Chapter 3 as Major Winter’s out-group (i.e.,
    low-quality relationship). Guarnere’s personality and demeanor differed from Winters,
    in that Guarnere was more boisterous, liked to consume alcohol, and so forth.
    In contrast, Winters was relatively quiet or reserved and did not consume alcohol.
    Guarnere mistakenly assumed that Winters was a pious Quaker, who might not even
    be willing to fire his weapon in battles. On D-Day, Winters proved his worth as
    a both a leader and fighter. At the end of that momentous day, a scene showed
    how despite not being a consumer of alcohol, Winters was willing to have a symbolic
    drink with Guarnere to celebrate their Company victory. From that point on, relations
    between Winters and Guarnere improved.


    # Captain Herbert Sobel.


    Captain Sobel is the first commander of Easy Company during their basic training.
    Captain Sobel shows no evidence of relations-oriented leadership. Although he
    is task-oriented, unlike Winters, he does so in a demeaning and authoritarian
    manner. In addition, to be an effective, task-oriented leader, one must have knowledge
    and skill pertaining to the task. However, Captain Sobel demonstrated his lack
    of military tactician abilities in war games prior to actual fighting. Further,
    Sobel failed to recognize the value of shared leadership, as considered in Chapter
    8 of this book. Specifically, during basic training, Winters was a lieutenant
    and 2nd in charge of Easy Company. Sobel could recognize Winters’ leadership abilities,
    but felt threatened by him, rather than feeling comfortable with Winters as a
    secondary leader in Easy Company.


    # Captain Ronald Speirs.


    Captain Speirs is featured throughout the miniseries as a sort of charismatic
    figure (see Chapter 11) who was both feared and admired by the men in his Regiment.
    He was feared because of a reputation for being unpredictable; for example, executing
    German prisoners of war, as well as even one of his own men (for disobeying an
    order while being intoxicated). Behavior of this nature would generally be seen
    as unethical or immoral (see Chapter 6). On the other hand, Captain Speirs and
    others might argue that he behaved in a manner that was in line with the context
    at the time. The importance of context for understanding effective leadership
    is described earlier in this chapter. In any event, he was also admired for his
    personal courage (see Chapter 2), and he was inspiring (see Chapter 11) because
    of his ability to quickly take the Command of Easy Company in the middle of a
    particular battle (for the town of Foy, Belgium).


    # First Lieutenant Lynn “Buck” Compton.


    Lieutenant Compton is portrayed as an effective combat leader who is very much
    beloved by his men. Indeed, he likes to hang out with privates and non-commissioned
    officers and form close personal relationships. However, as described in Chapter
    2, Lieutenant Compton has too strong of a need for affiliation. Early in the miniseries,
    Major Winters has a conversation with Compton, warning him that he should not
    get too close to his subordinates. Indeed, toward the middle of the series, Compton
    suffers an emotional breakdown after seeing so many of his men either die or get
    severely wounded. Because of that breakdown, he is relieved of his duties for
    the remainder of the war.


    # First Lieutenant Norman Dykes.


    Lieutenant Dyke was a good example of what is referred to earlier in this chapter
    as a laissez-faire sort of leader. For a portion of the miniseries, he was the
    Commander of Easy Company. But he was frequently missing when the men under his
    command needed his support or direction. Most importantly, he failed to make decisions,
    which is an important type of leader behavior. Such individuals can be considered
    “non-leaders”, and that is generally a bad thing for individuals in leadership
    positions.


    # Second Lieutenant Carwood Lipton.


    Although Second Lieutenant Lipton was an officer, he is portrayed in the miniseries
    as more of an informal leader (see Chapter 8) who essentially takes up the slack
    for the lack of leadership shown by First Lieutenant Dyke. Specific leadership
    qualities that are shown by Second Lieutenant Lipton include relations- and task-oriented
    leadership (see Chapter 2).'

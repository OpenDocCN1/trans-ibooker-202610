  md: 'ous stakeholder interests will be addressed, rests with the leaders of firms.
    That is, different firms will pursue different paths to CSR. These paths depend
    on the choices that leaders make, and those choices depend on their individual
    responsibility orientations.


    Before considering those orientations, it is important to first reflect on why
    and how CSR is relevant to leaders, their policies, and their decision-making.
    First and perhaps foremost, CSR can enhance revenues for their firms, since there
    is consumer demand for "green" products and services, firms that are charitable,
    and so forth. Firms may even be able to charge a premium for their products and
    services if their CSR reputations are strong. Second, leaders may use CSR as an
    expression of their own values of serving others and society. In other words,
    some leaders may see CSR as a vehicle or mechanism through which they can realize
    their own values.


    Third, beyond a sense of responsibility that is relevant to leaders and CSR, it
    is important to distinguish a sense of accountability. A leader may feel an obligation
    to attempt to serve the interests of one or more stakeholder groups. We refer
    to that as a sense of responsibility. But on the other side of the coin, a leader
    may or may not take personal acceptance of performance outcomes associated with
    serving the interests of the stakeholder group(s) toward which the leader perceives
    responsibility. Indeed, if a leader truly feels a sense of accountability, in
    the case of poor performance, the leader would accept negative personal repercussions,
    and they would attempt to make amends by rectifying the negative outcomes that
    the stakeholder experienced.


    Consider the example of a customer service supervisor. That person may feel a
    sense of responsibility toward serving the needs of customers. However, to also
    show accountability, that person will need to accept blame when the needs of a
    customer are not met, rather than blaming others (e.g., her subordinates). And
    in addition, that person will show accountability by taking steps to make sure
    that the customer''s concerns are rectified. But again, as noted above, a sense
    of responsibility does not necessarily equate to a sense of accountability. A
    leader might have a sense of responsibility toward a particular stakeholder group,
    but at the same time, not really have a sense of accountability with regard to
    holding oneself to account for positive outcomes pertaining to those stakeholders.


    With these issues in mind, we see three predominant types of orientations that
    leaders might have: (a) traditional economist, (b) opportunity seeker, and (c)
    integrator.[8] A traditional economist orientation is centered on the belief that
    a firm and its leadership should be responsible toward just one narrow set of
    a firm''s constituents, specifically owners or shareholders. This orientation
    is actually a very defensive approach to CSR and is characterized by leaders who
    believe that despite possible fiduciary advantages, CSR programs and initiatives
    can be costly, and therefore should generally not be pursued. One possible exception
    might be to restore a firm''s reputation after an environmental or consumer disaster
    that is attributable to the firm. In the following video, Kevin O''Leary displays
    an interesting example of the traditional economist orientation toward responsibility.


    # Bill Clinton''s Bold Business Prediction


    Former President Bill Clinton predicted U.S. corporations will care more about
    employees and customers rather than shareholders in the future. The Closing Bell
    panel weighs in.


    http://video.cnbc.com/gallery/?video=3000313195#


    An opportunity seeker orientation involves a recognition of the concerns of a
    range of stakeholders, including those beyond owners or shareholders. As such,
    although the opportunity seeker may feel a somewhat broad sense of responsibility
    toward at least some other stakeholder groups (e.g., employees), he or she only
    feels a sense of accountability toward owners or shareholders. This more narrow
    sense of accountability is also shared by the traditional economist orientation.
    For the opportunity seeker, CSR initiatives are pursued for two key reasons: (1)
    virtue-signaling, and (2) fiduciary benefits for owners or shareholders. When
    a leader engages in virtue signaling, there is a'

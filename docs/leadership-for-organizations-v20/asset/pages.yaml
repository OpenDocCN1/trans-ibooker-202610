- pgno: 57
  md: "# 3.2 Political Savvy\n\nLeaders influence followers through building and maintaining\
    \ good relationships. But oftentimes the target of influence is not formal subordinates\
    \ or direct reports. Instead, leaders may influence peers, customers/clients,\
    \ suppliers, and even their own superiors through the formation and maintenance\
    \ of good relationships.[6] Here are examples of why they need to influence these\
    \ types of individuals:\n\n+   **Peers**—to gain information or cooperation that\
    \ may be relevant to the team's and the leader's effectiveness.\n+   \n+   **Customers/Clients**—to\
    \ ensure that customers or clients will be satisfied, thereby continuing their\
    \ business with leader and his/her organization.\n+   \n+   **Suppliers**—to ensure\
    \ that appropriate supplies or input into a production or service process for\
    \ which the leader is responsible will be of high quality and delivered in a timely\
    \ manner.\n+   \n+   **Superiors**—to ensure that the leader has necessary information\
    \ and resources, and be part of the boss's in-group.\n\n**political savvy**\n\n\
    The ability to effectively understand others at work, and to use such knowledge\
    \ to influence others to act in ways that enhance one’s personal and/or organizational\
    \ objectives.\n\nThe key to achieving these influence outcomes is political savvy,\
    \ which involves building and maintaining relationships with each of the types\
    \ of individuals mentioned above. Leaders do so by using their political savvy.[7]\
    \ Gerald Ferris and colleagues defined **political savvy** in terms of \"the ability\
    \ to effectively understand others at work, and to use such knowledge to influence\
    \ others to act in ways that enhance one's personal and/or organizational objectives.\"\
    [8] Accordingly, influence is attained by building and maintaining relationships.\
    \ Ferris and colleagues identified four components that go into political savvy:\
    \ (1) social astuteness, (2) interpersonal influence, (3) networking ability,\
    \ and (4) apparent sincerity.\n\nFirst, social astuteness involves the ability\
    \ to carefully observe others, especially in social situations. Individuals with\
    \ such astuteness can accurately understand and interpret social interactions\
    \ involving themselves and others. In addition, they are highly self-aware of\
    \ themselves and how they come across to others. As an example, a socially astute\
    \ leader would be very observant at social gatherings in terms of who is talking\
    \ to whom (e.g., to whom people with the most formal power are speaking), who\
    \ appears to be enjoying themselves vs. those who are bored, and so forth. This\
    \ leader would also have a keen sense of how others at the social gathering are\
    \ reacting to him/her.\n\nSecond, politically skilled individuals have a persuasive\
    \ way of achieving interpersonal influence. Some of this influence is relatively\
    \ clear and not-so-subtle, such as attempts to clarify *quid pro quo* arrangements.\
    \ But at other times, the persuasion is subtler, such as coy attempts at ingratiation.\
    \ Further, politically savvy leaders are adaptable or flexible to different targets\
    \ of influence or contextual conditions. For example, such leaders may realize\
    \ that some targets of influence need very clear and overt *quid pro quo* understanding,\
    \ while others would find such attempts at influencing to be manipulative and\
    \ repugnant.\n\nThird, networking and political savvy go hand-in-hand. Leaders\
    \ with political savvy understand the nature of networks, and how through networking,\
    \ they can better position both themselves and their organizations for success.\
    \ In other words, they recognize how people in networks hold valuable assets and\
    \ connections for getting things done. In particular, leaders may serve as, or\
    \ recognize others who serve as, “brokers” in a network.[9] Brokers are individuals\
    \ who connect other individuals in a network. For instance, a leader may recognize\
    \ how a particular customer could connect the leader and his/her team to another\
    \ potential customer.\n\nFurther, politically savvy leaders recognize the difference\
    \ between *strong* and *weak* ties.[10] Strong ties imply a deeper relationship\
    \ or friendship, while weak ties are more of an acquaintance nature. Politically\
    \ savvy leaders recognize that not all of their linkages in a network can involve\
    \ strong ties, since deep relationships are simply not feasible or even desirable\
    \ with all individuals. However, a recognition and cultivation of numerous weak\
    \ ties, especially with influential people,"
  merge: -1
  img_proc: true
- pgno: 58
  md: "can be useful to the leader because they help provide important connections\
    \ or information. In other words, both strong and weak ties are important for\
    \ the politically savvy leader.\n\nFourth, politically savvy leaders are adept\
    \ at showing apparent sincerity. The term 'apparent' is significant here. What\
    \ is really important is that the leader comes off as seeming to be sincere in\
    \ his or her relationships and transactions. But over time, if the leader is not\
    \ genuinely honest and forthright, others will see through him or her, and the\
    \ leader will damage relationships and the ability to influence. That is, the\
    \ leader will be potentially seen as manipulative. For example, a global bank\
    \ was struggling and appointed a new leader. He was initially seen by others as\
    \ charismatic. He was a great orator and talked with passion about the importance\
    \ of people, both employees and customers. Initially, people were excited and\
    \ energized by his bold vision for the institution. He seemed sincere in his claims.\
    \ But over time, it became apparent that he was sincere only about advancing his\
    \ own career. Within a year, the employees turned against him, feeling deceived.\
    \ In the end he failed completely to turn the bank around and was replaced.\n\n\
    There are connections between a number of traits or characteristics that were\
    \ considered in Chapter 2 and political savvy. For example, honesty and integrity\
    \ (or at least their appearance) are important characteristics if a leader is\
    \ to be both politically savvy and effective. But over time, if the leader's \"\
    apparent\" sincerity seems fake or inconsistent, the leader will come off as disingenuous,\
    \ and thus, lose influence. In a similar manner, the leader might appear to be\
    \ seeking personalized, rather than socialized, power. Inevitably, people who\
    \ the leader is seeking to influence will not react favorably to his or her attempts\
    \ at political savvy. As another example, emotional intelligence and political\
    \ savvy appear to go hand-in-hand. It is hard to imagine that a leader who lacks\
    \ emotional intelligence would somehow be able to show political savvy. In sum,\
    \ the traits that we considered in Chapter 2 go hand-in-hand with the effective,\
    \ or ineffective, use of political savvy. In Section 4, there is a survey to help\
    \ you gauge your own political savvy.\n\n# Video Cases for This Chapter\n\nThe\
    \ two video cases for this chapter illustrate issues pertaining to relationship\
    \ building on the part of leaders with their followers. Various challenges come\
    \ up, such as the development of in-group versus out-group relationships; and\
    \ dealing with individuals who are not just problematic for leaders, but also\
    \ for their teammates.\n\n+   **Chris Tilghman — First Time Manager**\n+   \n\
    +   This case video deals with the challenges of a new manager, Chris Tilghman,\

    Third, an integrator orientation involves a broad sense of both responsibility
    and accountability on the part of the leader. This type of leader is likely to
    be characterized in terms of post-conventional morality as described earlier in
    this chapter. Instead of virtue signaling, they engage in CSR initiatives out

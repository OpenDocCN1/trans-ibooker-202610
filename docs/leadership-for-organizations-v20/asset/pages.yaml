    The common denominator of the hypothetical statements on the left side is that
    they focus on a particular product or profits. On the right side of Table 11.1,
    we see a different story or theme. All of these statements are broader in their
    own way. An example of an innovation theme can be seen with 3M. The GE mission
    was reshaped under the leadership of perhaps its most famous CEO, Jack Welsh.
    It clearly represents an excellence theme. A number of these themes are clearly

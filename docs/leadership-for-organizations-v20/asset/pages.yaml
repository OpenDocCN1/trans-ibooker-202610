  md: '# 5.3 Vroom/Jago Approach to Situational Leadership


    While the work of Hersey and Blanchard is useful in an attempt to understand situational
    leadership, the situational factor to be considered, follower readiness, is somewhat
    simplistic or incomplete. There are other factors that come into play, including
    the significance of the problem or decision at hand, leader expertise to deal
    with the problem on his or her own, the amount of commitment that is necessary
    from followers, and followers'' ability to work together as a team to solve a
    problem (assuming that the problem is team, rather than individual, based). All
    of these factors are considered simultaneously by an approach to situational leadership
    that was authored by Vroom and Jago.[6]


    As shown in Table 5.4, in any given decision-making situation, there are seven
    questions that are relevant to determining the degree of follower involvement.
    Depending on the answers to these questions, the leader would be pushed more or
    less toward follower involvement in the decision-making process. A distinguishing
    aspect of this process is that the leader follows a decision tree analysis as
    shown in Figure 5.2 and Figure 5.3. A decision tree allows for branching out in
    different directions with the different questions that are depicted in Table 5.4.
    The path that one takes in the decision tree depends on the answer to a prior
    question in Table 5.4. For instance, in the scheduling problem described above,
    although the clinic manager had sufficient information to make the decision, she
    also realized that acceptance among her subordinates would be critical and that
    they had the skills to come up with a good solution. Using the models depicted
    in Figure 5.2 and Figure 5.3, these aspects of the situation would push the manager
    to be either facilitative or delegative.


    | Situational Questions | Implications for Follower Involvement |

    | :--- | :--- |

    | 1. How important is the decision or problem in relation to the effectiveness
    of the organization? | If the decision lacks importance, then most of the remaining
    questions will not be relevant. In most instances, the leader should simply make
    a decision on his or her own, although that''s not always the case. However, if
    the decision is important, then the remaining questions become more relevant,
    and different styles may be appropriate, depending on how the remaining questions
    are answered. |

    | 2. For implementation purposes, how important is follower commitment to carrying
    out any decision that is made? | Some decisions can be carried out even if followers
    are not involved or committed to its implementation. However, if implementation
    requires follower commitment, a high degree of follower involvement in decision-making
    is required. |

    | 3. How much expertise or information does the leader have with regard to decision
    or problem at hand? | If the leader''s expertise or information is minimal, he
    or she should involve followers in the decision-making. |

    | 4. If the leader was to make the decision alone, would followers just go along
    with it? | In some contexts, followers are used to leaders simply making decisions
    on their own, and the followers just go along with those decisions. If that is
    the case, then follower involvement in the decision-making at hand will be less
    important. |'

  md: 'Don''t dramatize this. Suck it up. It will pass.”[34] Her point is that a follower’s
    job is to offer advice to the leader, but once a decision has been made, even
    if it is not what you recommended, your job is to help implement the decision
    and not whine or even worse, undermine the boss’s efforts.


    # Work With the Leader''s Style, Goals, and Perspective


    In some ways, leaders are like anyone else—they have their own style, goals, and
    perspectives on various issues. Some leaders play things “by the book,” so to
    speak; while others are more free-wheeling and loose regarding rules. Some leaders
    are very much quantity-oriented, while others stress quality or service. Of course,
    it is always possible that there might be stylistic or goal-based differences
    between a leader and a follower, making it difficult to manage up. But there can
    be a “meeting of the minds,” so to speak, as long as the follower recognizes the
    nature leader’s style and goals, and attempts to make compromises.


    Again, let’s take a hypothetical example. Suppose that a follower does not like
    to closely adhere to a lot of bureaucratic rules and procedures, but her boss
    would prefer that followers more closely adhere to their job descriptions, formal
    handbooks, and so forth. It could be that certain rules or procedures are most
    important to the leader, and if adhered to, the leader will be happy. To properly
    manage up, the onus is on the follower to determine the particular “trigger buttons”
    of the leader and thus avoid deviations that would upset the leader.


    Let’s also take the example of students’ perspective on what constitutes fairness
    (e.g., in relation to grades or grading processes). In general, students think
    of fairness from their own personal perspective. Thus, they ask themselves the
    question, “was I treated fairly by this instructor?” However, instructors have
    to balance what is fair to an individual student, versus what is fair to the overall
    class of students. By at least attempting to understand the instructor’s perspective
    on fairness in grading, a student is demonstrating how to better manage up.


    # Role Model the Behavior That You Seek


    One of the authors once heard an individual complain about her boss, “I just wish
    that he would give me more recognition and praise...” In reply, the author asked,
    “How often do you give your boss recognition and praise?” With a bewildered look,
    she replied, “Well that’s his job and his responsibility. He’s the one who should
    be recognizing me for all of the things that I do right.” To be sure, we do not
    totally disagree with her; it is a leader’s responsibility to find and recognize
    followers for their actions and performance. But not to beleaguer a point that
    we have made throughout this chapter and the prior one, “it takes two to tango.”
    So if a follower is looking for her leader to praise her more, she should find
    ways to praise her leader. As another example, if a follower wants his leader
    to be more cheerful, he should smile and say hello when he greets the leader in
    the morning.


    Obviously, there is no guarantee that behavior such as that suggested above will
    be reciprocated. After all, some individuals are just depressed or angry people,
    making them “tough nuts to crack” in terms of things like cheerfulness or pleasantness,
    despite one’s best overtures. However, call it karma, call it “one good turn begets
    another,” or whatever. If a follower would rather see a certain type or style
    of behavior from the leader, then the follower needs to manage up by role modeling
    such behavior.'

    In other words, they might argue that short-term demands and a largely irresponsible
    (or even lazy) labor force precludes any serious consideration of servant leadership.
    We argue that servant leadership can work in an organization, but only if the
    traditional pyramidal and inverted pyramid find a way to come together. In other
    words, we recognize that most organizations will have a formal, pyramidal structure.
    But some organizations will also be able'

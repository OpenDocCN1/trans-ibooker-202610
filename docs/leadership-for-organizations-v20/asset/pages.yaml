  md: '# Kotter''s Eight-Step Model of Planned Change


    The general principles of unfreeze, change, and refreeze have been elaborated
    by John Kotter into a widely-used eight-step change model.[8] This model is portrayed
    in Figure 13.2:


    FIGURE 13.2 Eight-Stage Model of Planned Organizational Change


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_213_0.png)


    +   1. Create a sense of urgency—Confronted with the need to change well-established
    routines, many employees ask themselves three important questions about the proposed
    change: Why? When? What''s in it for me? Thus, there is the need to develop among
    employees a sense that there is an important need to change, as well as a commitment
    to make something happen. If the change is reactive, this is most often seen in
    the form of a potential threat. If the change is proactive, it often takes the
    form of a great opportunity that can be captured. Although in general, the message
    (or vision) to followers should be positive when promoting change (e.g., by being
    excited and enthusiastic about change), at least at the beginning, leaders may
    have to provide a dose of negative messaging. That is, there needs to be a message
    (or vision) that if change is not pursued, negative things are likely to happen
    for the firm, its employees, and its customers.


    +   2. Form a powerful coalition—Since organizations are often inertial and resist
    change, the beginnings of a change effort require the identification of those
    key people who will support the change. This group can provide the initial energy
    for the change effort. As a part of forming this coalition, it is also useful
    to think carefully about how these change warriors can be used to identify and
    overcome those who might resist the change effort. On the opposite side of the
    coin, it is also important to identify powerful individuals who might thwart change.
    Such individuals need to be either persuaded, or potentially fired. The relationship
    building skills described in Chapter 3 can be quite handy in helping to form a
    powerful coalition for change.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '3. Create a vision for change—Leader vision is an important aspect of effective
    leadership, and its role has been considered multiple times in this book. Perhaps
    nowhere is it as important as in the leading of change. Indeed, a key aspect of
    the leading of change is to provide an emotionally compelling reason for the change.
    Vision messages need not be complicated, and indeed, the purpose of the change
    effort should be expressed in a simple, emotionally compelling message. This vision
    and the associated strategy can help people understand what you are trying to
    achieve through the change, and how the effort can benefit them. It should help
    others “see” what the future organization will look like. The main goal is to
    provide a simple vision that inspires an emotional reaction. For example, when
    the Japanese construction equipment firm Komatsu was threatened by the American
    firm Caterpillar, their leaders adopted the simple vision of “Destroy Caterpillar”
    as a rallying cry.


    4. Communicate and role-model the vision widely—Once formulated, the vision and
    reason for the change needs to be communicated frequently and powerfully at all
    levels of the organization. The communication should not simply be a slogan or
    message, but instead, illustrated with stories and examples. If employees are
    to be convinced that a change effort is important, they need to see and hear the
    message again and again, and through different means. Multiple forms of media
    should be used including video-casts, town hall meetings, and simple leading-by-walking
    around. Moreover, key leaders (e.g., CEOs) need to communicate directly to organizational
    members. But especially in larger organizations, they can also use surrogates
    (i.e., trusted followers or coalition members) to go out and spread the word regarding
    the need for change.[9] While a vision is important, if people do not see their
    leaders behaving consistently with the vision, it becomes little more than hot
    air. Worse, if leaders are not seen to be walking the talk, the vision will generate
    cynicism and resistance on the part of the employees. The implication is clear:
    senior leaders need to be continually modeling the changes that they want to see.


    5. Remove obstacles—As the change unfolds, careful attention should be paid to
    identifying obstacles to the change so that people in the organization are empowered
    to act. These obstacles might include anything from the way the organization is
    structured, processes in place that currently reward or even train inappropriate
    behavior, and dealing with the people who oppose change. If a structure, HR process,
    or metric is lacking or seen to be hindering the change, leaders should remove
    the obstacle, and replace it with processes that are more favorable to the change.
    For example, training procedures may need to be changed. Further, a term that
    is anathema to change is bureaucracy. Bureaucratic procedures are designed to
    reinforce the status quo—not to help smooth the way for change. Many people in
    organizations have done quite nicely in the past in terms of job security and
    their careers by enforcing the current bureaucracy. Accordingly, there is a disincentive
    for such individuals to change. It follows that leaders of change need to be continually
    on the lookout for impeding bureaucracy and bureaucrats who might be resisting
    change. Indeed, direct action needs to be taken to deal with bureaucratic structures
    or rules that impede change, as well as the bureaucrats who might resist change.
    Similarly, large-scale organizational change may require new reporting relationships,
    which can also signal the importance of change.


    6. Create short-term wins—In any change effort, many people will be initially
    skeptical and looking for indications that the effort is serious and can be successful,
    even if in little ways. A powerful way to signal this is to look for small initial
    successes, or quick wins, that can be held up as examples of the change effort.
    This might require finding easy wins that can be achieved without help from critics
    or that require little investment. For example, individual employees who are living
    or personifying the change should be acknowledged through stories, celebrations,
    or awards.'
  merge: -1
  img_proc: true

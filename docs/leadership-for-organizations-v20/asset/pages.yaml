  md: '# FIGURE 12.2 The Triangle of Success at Southwest Airlines: Aligning Culture
    and Strategy


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_195_0.png)


    Second, Southwest emphasizes low costs and high asset utilization. Airlines represent
    a high fixed asset industry, so a key to success is to efficiently utilize assets.
    As an example, Gary Kelly, the current CEO of Southwest, was the architect for
    fuel hedging techniques that the firm has used over time to greatly reduce costs.[8]
    Indeed, fuel represents a major cost for airlines, and unique strategies or techniques
    for controlling such costs can represent a competitive advantage. Further, while
    on the ground, Southwest is able to turn around their airplanes quickly to get
    them ready to fly again. This is due in part to employee cooperation (e.g., pilots
    helping to clean cabins), which is stressed by the culture. It is also due to
    relatively low labor costs, as compared to industry norms.


    What has been the result for Southwest Airlines over time? As shown in Figure
    12.2, Southwest''s culture is a key part of, although not the only reason for,
    their strategic success. That culture is interconnected to its ability to generate
    customer satisfaction, and maintain low costs while effectively utilizing assets.
    Throughout its history, strategic leaders at Southwest have made wise choices
    and implemented policies that continually align culture and strategy in order
    to achieve competitive advantage. It is interesting to note that since its inception
    decades ago, Southwest Airlines had never had an unprofitable quarter—that is,
    until the pandemic in 2020, when the bottom essentially fell out of the airline
    industry. Aside from 2020, the same can certainly not be said for its competitors,
    which have not only failed to achieve quarterly profits both prior and during
    the pandemic, but have also realized numerous bankruptcies over the years.[9]


    **Zappos.** A similar illustration of how culture can be a source of competitive
    advantage can be seen in Zappos, the successful online shoe company. In 1998,
    Tony Hsieh sold his first internet company to Microsoft for $285 million. In 1999,
    he invested in a new company that was selling shoes online. Although initially
    skeptical, he soon realized that this was potentially a huge market. But to be
    successful it would require the company to do five things: (1) stock a huge inventory,
    (2) provide 24/7 access, (3) offer fast delivery, (4) provide customers with easy
    returns, and (5) most importantly, offer amazing customer service.


    From the outset, Hsieh has emphasized the importance of culture: “Our whole belief
    is that if you get the culture right, most of the other stuff like delivering
    great customer service or building a long-term enduring brand will just happen
    naturally on its own.... Zappos is a service company that just happens to sell
    shoes.”[10] The Zappos culture is built on 10 values, some of which include delivering
    WOW service, embracing change, and creating fun and a little weirdness.'

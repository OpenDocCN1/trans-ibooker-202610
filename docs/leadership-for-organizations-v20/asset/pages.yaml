- pgno: 94
  md: '# # Ethical, Moral, and Responsible Leadership


    > > "Make people who work for you feel important. If you honor and serve them,
    they''ll honor and serve you." —Mary Kay Ash, founder of Mary Kay Cosmetics


    > > "If you don''t give people information, they''ll make up something to fill
    the void." —Carla O''Dell, president of O''Dell & Associates


    # ## Learning Objectives


    +   1. Explain the key principles of ethical and moral leadership.

    +   2. Compare leaders at different levels of moral development, and the implications
    of these levels on their behavior and performance.

    +   3. Appraise oneself in terms of predominant level of moral development.

    +   4. Discuss the kinds of actions that leaders can take to demonstrate ethical
    and moral leadership.

    +   5. Appraise the types of issues that can complicate considerations of ethical
    and moral leadership.

    +   6. Consider what it means to be a servant leader and how it pertains to the
    paradox of control that leaders face.


    The topic of ethical and moral leadership (EML) has grown in importance in recent
    years. We are frequently exposed to stories in the media of leaders at various
    levels of management who have acted in an unethical or irresponsible manner. Some
    of these individuals have suffered a great personal price. As an example, Jeff
    Skilling, ex-CFO and ex-CEO of Enron, served over 10 years in prison for his role
    in that scandal. Such individuals create problems not only for themselves, but
    also for their organizations, as well as the image of the greater management profession.
    Overall, it should not be so surprising that the public image of organizational
    leaders, especially those at higher levels of large corporations is not very favorable.
    Indeed, the public tends to lack confidence in these individuals, and they are
    largely not trusted to tell the truth.


    Nevertheless, research shows that organizations that are guided by leaders with
    a stronger ethical/moral compass do exist, and they tend to outperform their competitors.
    These organizations do so by first establishing an organizational climate that
    stresses such things as **procedural justice**, or the establishment of fairness
    and consistency in how employees are treated. Organizations that have a climate
    of this nature are characterized by decision-making that is free of biases, favoritism,
    and personal interests. Top-level leaders are the ones who establish and reinforce
    such climates.


    **procedural justice**

    The establishment of fairness and consistency in how employees are treated.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'However, issues and challenges pertaining to EML are relevant to leaders at
    all levels of organizations. For top-level executives, it involves setting policies,
    making strategic decisions, and leading-by-example—all of which helps to establish
    an ethical climate. This climate gets reflected in the behavior of lower-level
    managers, for whom EML is relevant in terms of setting an example, enforcing ethical
    standards, acting in an open and truthful manner, and avoiding abusive behavior.


    What is EML all about? In Table 6.1, we list seven principles that are at the
    core of EML. They involve values and beliefs, as well as behaviors in which ethical
    and moral leaders engage. Each of these principles are described in detail below.
    A guiding premise is that EML is not just about what is in a leader''s head (e.g.,
    values); it''s also about the decisions and actions that the leader takes. With
    these principles in mind throughout this chapter, we organize our discussion of
    EML in terms of: (1) the ethical/moral person, (2) ethical/moral actions as a
    leader, (3) responsibility and accountability, and (4) complicating questions.


    | # | Principle |

    |---|---|

    | 1 | Acting in accordance with one''s own (developed) sense of values or principles
    pertaining to justice and what is right |

    | 2 | Speaking and acting truthfully—having integrity |

    | 3 | Showing courage to go against established norms or popular opinion, if need
    be |

    | 4 | Acting authentically with transparency—for example, by openly communicating
    and not concealing important information |

    | 5 | Taking steps to actively identify moral/ethical issues and enforce standards
    |

    | 6 | Serving the interests of others, rather than just oneself—being responsible
    to a wide range of stakeholders |

    | 7 | Assuming personal accountability for results pertaining to all stakeholders
    |


    # 6.1 The Ethical/Moral Person


    Marine Corps General James Mattis (former U.S. Secretary of Defense), argues,
    “You can’t make ethical decisions on the fly. It has to be ingrained in your mind
    for the entirety of your life.” He goes on to note, “If you run down the ethical
    sidelines, you’re likely to step out of bounds. You must coach yourself and your
    team to run in the ethical middle of the field.” It is difficult to consider what
    EML is all about without understanding its basis in what can be termed the “ethical/moral
    person.” In other words, an understanding of what it means to be an ethical or
    moral leader begins with a consideration of the person’s moral development, which
    gets at the core of the ethical/moral person. Bruce Lee once said, “knowledge
    earns you power, but character earns you respect.” Character is something that
    develops in a person, largely in terms of his or her moral reasoning. As shown
    in Table 6.2, the moral development and reasoning of an individual would suggest
    three possible levels.'
  merge: -1
  img_proc: true
- pgno: 96
  md: "# TABLE 6.2 Levels of Moral Development\n\n## Level 3 -- Post-conventional\n\
    * Does not necessarily adhere to what others think is right vs. wrong\n* Has a\
    \ strong, internalized sense of right vs. wrong\n* Tends to put the concerns of\
    \ others, or the greater good, above his or her own self-interests\n\n## Level\
    \ 2 -- Conventional\n* Lives up to the expectations, obligations, and norms of\
    \ a group with which one feels a sense of identity (e.g., religious affiliations,\
    \ clubs, professions, and so forth)\n* Adheres to the laws of society\n\n## Level\
    \ 1 -- Pre-conventional\n* Acts in accordance with self-interests\n* Follows the\
    \ rules or the law in order to avoid getting into trouble\n\nAt the **pre-conventional**\
    \ level, an individual is primarily concerned with following rules or laws in\
    \ order to avoid penalty or punishment. These rules and laws can be in different\
    \ entities with which the individual is associated, such as organizations or society\
    \ as a whole. At the **conventional** level, the individual follows in line with\
    \ the groups (e.g., fraternities, sororities, clubs etc.) or societal entities\
    \ (e.g., religious affiliations, cultural norms, etc.) with which he or she identifies.\
    \ The individual is also very much in tune to simply correlating existing rules\
    \ and laws with morality. In other words, conventional moral development would\
    \ suggest that if it's legal, it must be moral. The **post-conventional** person\
    \ is in line with the principle in Table 6.2 of acting in accordance with one's\
    \ own (developed) sense of values or principles pertaining to justice and what\
    \ is right. People who are at this level of development act in an independent\
    \ manner when it comes to ethical or moral values, and if they perceive the necessity,\
    \ post-conventional people might even violate the law to pursue their own perceptions\
    \ of justice, right vs. wrong, and so forth.\n\n> **pre-conventional**\n> \n>\
    \ A level of moral development at which an individual is primarily concerned with\
    \ following rules or laws in order to avoid penalty or punishment.\n\nThese different\
    \ levels should not be viewed as stages, whereby an individual is at only a single\
    \ level in his or her development. Instead, a person might be predominantly at\
    \ one level, while showing signs of being at the other two levels. For example,\
    \ an individual might in most spheres of life demonstrate that she is at the post-conventional\
    \ level. However, when it comes to something like her personal tax returns, she\
    \ might be more conventional or even pre-conventional by taking her accountant's\
    \ advice, and claiming deductions that, while debatable, simply represent the\
    \ norm for other taxpayers (i.e., conventional morality). Or perhaps she uses\
    \ deductions that might be claimed without any likelihood of punishment by the\
    \ IRS (i.e., pre-conventional morality). Nevertheless, for behaviors involving\
    \ most other individuals or endeavors, she is largely post-conventional. As another\
    \ example, criminals are largely at pre-conventional levels of morality. But for\
    \ certain issues (e.g., other criminals who they encounter who are child predators),\
    \ they may actually show signs of post-conventional thinking about right vs. wrong.\n\
    \n> **conventional**\n> \n> Level of moral development at which an individual\
    \ follows in line with the groups (e.g., fraternities, sororities, clubs etc.)\
    \ or societal entities (e.g., religious affiliations, cultural norms, etc.) with\
    \ which he or she identifies.\n\n> **post-conventional**\n> \n> Level of moral\
    \ development at which an individual acts in accordance with one's own (developed)\
    \ sense of values or principles pertaining to justice and what is right.\n\nAmong\
    \ these different levels of development, the conventional level is probably the\
    \ most prevalent, and that is true in a lot of different spheres of life, and\
    \ for different roles that people take on. Think about the financial collapse\
    \ of 2008 and 2009, and the fallout that ensued in the housing market. Many homeowners\
    \ found themselves in a situation where the value of their homes was significantly\
    \ less than the amount owed on mortgages. And many of those homeowners simply\
    \ \"walked out\" on their mortgages; that is, stopped paying their lenders. Although\
    \ many of these individuals realized that, in a way, it was wrong to do so (i.e.,\
    \ level 3 reasoning), they nevertheless determined that so many other people were\
    \ walking out on their mortgages without immediate punishment. So why not just\
    \ join the crowd? Such reasoning reflects either level 1 or 2 reasoning.\n\nMany\
    \ people in leadership roles also engage in conventional or level 2 reasoning\
    \ and behavior. As an example, in 2005, Procter & Gamble took over Gillette. The\
    \ then CEO of Gillette, Jim Kilts, ended up taking a $160 million golden parachute\
    \ deal. These deals involve contract agreements at"
  merge: -1
  img_proc: true
- pgno: 97
  md: 'the beginning of an executive''s tenure that lay out what would happen if the
    firm is taken over by another firm, and the executive''s employment is terminated.
    In the case of Gillette, his original employment contract included a golden parachute
    that specified $160 million in compensation if his employment was to be terminated
    through acquisition by another firm. To the naïve observer, this might seem like
    an inordinate amount of money. It could even be considered unethical or unjust,
    since as in all takeover deals, at least some of the employees of Gillette were
    displaced without favorable severance packages. However, in CEO circles and the
    minds of many financial analysts, such a golden parachute deal would be seen as
    simply living up to the expectations of the CEO culture, at least with regard
    to CEOs of similarly sized firms. In other words, the CEO of Gillette was doing
    nothing more, and nothing less, than any CEO would do in his position. In short,
    he was following conventional moral development.


    Two things should be apparent with the examples provided above. First, moral development
    can, at least to some degree, be in the eyes of the beholder. What some people
    view as conventional morality, or just “following the crowd,” might be viewed
    by others as immoral. Indeed, one of the things that can complicate a consideration
    of ethical/moral leadership is that it is largely in the eye of the beholder.
    Who one person might identify as an outstanding leader, another person might have
    his or her doubts.


    Second, conventional morality is a fluid phenomenon. That is, it can change with
    the times. Societal, political, and business leaders are best judged through the
    conventional morality of their historical times—not the current times. For example,
    when viewed through the norms and values (i.e., conventional morality) of the
    1700s, the Founding Fathers of the United States might generally be viewed in
    a favorable light. However, if viewed through a current-day lens, some of their
    actions (e.g., slave ownership) would certainly seem abhorrent and inexcusable.
    Further, perhaps in some respects, there may be a present-day coarsening of conventional
    morality in society and various institutions (e.g., the institution of CEO and
    executive management). In other words, executives who simply “follow the crowd”
    that consists of their peers may be increasingly becoming what many people might
    view as unethical or immoral. Stated another way, from an ethical/moral point
    of view, the “new normal” might not always be such a good thing.


    We should note that post-conventional morality is also, at least to some extent,
    in the eye of the beholder. As an example, in the recent pandemic, there have
    been a mixture of opinions about vaccinations and procedures, such as vaccination
    mandates that are issued by various levels of government. Some individuals might
    argue that having mandates is morally wrong. Those individuals might do so out
    of their sense of right vs. wrong: for example, the notion that mandates infringe
    too deeply into individuals’ civil liberties or freedom. Moreover, individuals
    with this viewpoint might claim that they are attempting to represent the greater
    good, rather than merely their own self-interests. With all of that said, there
    are people at the opposite end of the spectrum who argue in favor of vaccination
    mandates based on their own post-conventional morality. Our point is that post-conventional
    morality can be somewhat nebulous because of differing values or priorities that
    people hold dear.


    So how do you personally stack up in terms of these three levels of moral development?
    To answer this question, complete the survey shown in Section 4 at the end of
    this chapter. This instrument forces you to choose among three items, each of
    which may seem somewhat true about you. But you need to pick the one that is most
    true about you, then the one that is next most true about you, and finally, the
    one that is least true about you. For the instrument to be accurate, it is important
    that you answer in terms of how you really are, as opposed to how you might like
    to see yourself. In other words, do not answer in terms of how you would like
    to see yourself; be honest and answer as you actually are on a day-to-day basis.'

  md: '# # A Case Example


    The key from a strategic leader''s perspective is to send clear signals to organizational
    members. Figure 12.3 provides a broad outline for how this is done. First, the
    beliefs and values of strategic leaders can act as a basis for their actions.
    At Bridgewater Associates, the largest hedge fund in the United States, CEO Ray
    Dalio believes in what he calls "radical transparency."[80] He wants everyone
    in the company to consistently be totally honest with each other, even if it is
    uncomfortable telling the truth. Therefore, all meetings are videotaped and made
    available to all employees. New employees are often taken aback at how direct
    the criticism is, but Dalio believes that being completely honest is the only
    way to have an ideal meritocracy. His values and beliefs have shaped his actions.


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_201_0.png)


    These actions, both his behavior and the choices that he has made about how to
    design the organization, signal to employees what is important and how to act.'

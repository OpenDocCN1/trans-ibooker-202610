  md: '![](img/5a5fcd49e67d713bc6c99c1cc791987a_161_0.png)


    > > **cultural blinders**

    > > Making the mistake of assuming too many similarities between ourselves and
    those who come from a different culture.


    The lesson to be learned from all of these examples is that a lack of understanding
    of one’s own and others'' cultures can result in having what can be metaphorically
    termed “cultural blinders”. When we wear such blinders, we are liable to make
    the mistake of assuming too many similarities between ourselves and those who
    come from a different culture. For example, one may think to herself, “I make
    eye contact when speaking to another person. So if this Japanese guy is not making
    eye contact with me, there must be something wrong here.” The end result of such
    thinking is a tendency toward negative attributions or judgments of others’ motives,
    and thus, misinterpretations. If the goal is to influence, which is obviously
    the case for leaders, that goal will not be furthered by negative attributions
    and the type of thinking or actions that are likely to result.


    By having a global orientation, leaders will be slow to make negative attributions.
    Their cross-cultural know-how and tendency to engage enthusiastically with members
    of other cultures will prevent negative attributions and misinterpretations. Moreover,
    if understanding about a particular behavior is lacking (e.g., the Saudi hand
    holding), they might take the time to ask questions and seek advice from others
    who have more experience with a particular culture.'

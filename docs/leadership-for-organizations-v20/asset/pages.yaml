  md: '# CHAPTER 5

    Situational Leadership


    > > "Motivation is based on what you bring to it as an individual. What is motivational
    to one person isn''t motivational to another." —Bob Nelson, author and management
    consultant


    # Learning Objectives


    +   1. Identify why flexible approaches to situational leadership are more practical.

    +   2. Apply situational leadership to instances involving day-to-day leader behavior,
    as well as specifically to decision-making.

    +   3. Appraise the potential problems with applying situational leadership principles.

    +   4. State other important leadership issues that are not taken into account
    by situational leadership approaches.


    A question that is continually addressed in this book is: What makes for effective
    leadership? For many years, the predominant approach to understanding effective
    leadership was to identify behavioral factors that would be practiced by any good
    leader across situations and contexts. In other words, the predominant approach
    was generic. Thus, the type of styles that were identified in Chapter 2, such
    as relations- and task-oriented leadership, were considered to be universal behavioral
    qualities that should be practiced across situations and contexts.


    On the other hand, when asked what effective leadership is all about, one thing
    that is likely to come to mind for many people is that, “it depends.” And rightfully
    so—to a large extent, it does depend. Effective leadership, and more specifically
    the behavioral style that should be emphasized, partly depends on the nature of
    the people who the leader is attempting to lead, or followers. As mentioned in
    Chapter 1, it may also depend on the greater context in which the leader and followers
    find themselves. That greater context can include a host of factors, such as industry,
    institution or type of work, and even the geographical context.


    In this chapter, we will explore what “it depends” is all about. As we will see,
    this situational point of view of effective leadership has a number of practical
    implications for how leaders should lead on a day-to-day, or problem-to-problem,
    basis. On the other hand, it also has a number of challenges for leaders. For
    example, getting an accurate reading of followers and their needs and expectations
    can be challenging. However, such a reading is critical if situational leadership
    is to be effective.


    There are two ways to consider situational leadership. The first is an inflexible
    approach. It essentially assumes that a leader has a predominant style that is
    not flexible. In other words, the leader will attempt to use a desired or “comfortable”
    style, regardless of the situation. For example, a leader with a predominant task-oriented,
    directive style will want to use it regardless of the nature of the followers
    who he or she is leading, and regardless of the context. So even if the situation
    called for a more people-oriented approach, the leader would still want to remain
    task-oriented or directive. One possibility would be to simply place such a leader
    in a context that at least for the most part, would benefit from a task-oriented,
    directive leader. Examples might include situations in which work standards or
    conduct have become lax, workers are accustomed to such leadership'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'in the past, and in certain jobs or institutions in which directive leadership
    is the norm (e.g., military or paramilitary organizations).


    Likewise, there are some contexts that institutional norms and the nature of workers
    typically require more of a people-oriented or participative style. Examples include
    the leading of knowledge workers (e.g., university faculty members, computer science
    specialists, engineers) and volunteer organizations. A leader with a predominantly
    people-oriented or participative style would be placed in such contexts.


    inflexible

    An approach to situational leadership whereby a leader’s style is considered to
    be static (or not flexible), and the leader is matched to the prevailing situation.


    Accordingly, an inflexible approach could make sense at times. If a particular
    leader is known for being task-oriented or directive, it could be a good match
    for some situations, while being more of a people-oriented or participative leader
    might make sense in other situations. In other words, the situation is static,
    and there is not much need for leader flexibility in terms of the type of style
    that might be shown toward followers.


    But with that said, there are two key problems with the inflexible approach to
    situational leadership. First, the general situation or context may shift over
    time. For example, when a leader is first assigned to a particular context, followers
    may generally need and expect a more authoritarian approach. However, over time,
    followers may mature and develop, thus making a directive approach less appropriate,
    while necessitating more people-oriented qualities on the part of the leader,
    such as participative behavior. However, it may not be practical or desirable
    to just simply fire or transfer leaders around in order to fit a particular context
    or changes in that context over time. Second, most situations are fluid and can
    essentially “zig-zag” in terms of the required leadership approach at a particular
    point in time. Some followers may need more of a “human touch” at times in terms
    of people-oriented leadership, or they may have the need and capability to be
    more fully involved in decision-making. However, other followers may need a more
    directive approach. In addition, the leader him or herself may not have enough
    knowledge or expertise to tackle certain problems alone, and thus, might need
    some participation on the part of followers, depending on the issue or decision
    to be made.


    flexible

    An approach to situational leadership whereby any given leader can handle and
    adapt to the various needs and capabilities of different followers and situations
    at various points in time.


    In short, more of a flexible approach to situational leadership is warranted,
    whereby any given leader can handle and adapt to the various needs and capabilities
    of different followers and situations at various points in time. Accordingly,
    we describe three such approaches in the remainder of this chapter: (1) path-goal,
    (2) Hersey/Blanchard situational leadership, and (3) Vroom/Jago contingency leadership.
    Although they all represent different forms of a flexible approach, Table 5.1
    depicts different aspects and foci of these models. Perhaps most importantly in
    terms of the targeted behavior, path-goal represents a generalized form of flexible
    leadership because it pertains to day-to-day interactions with followers, and
    the problems or issues that they face, that may or may not involve decision-making
    processes. Somewhat more narrowly, both the Hersey/Blanchard and Vroom/Jago approaches
    deal more specifically with how leaders go about making decisions that affect
    or could include followers. We consider these different approaches in more detail
    below.


    | | Targeted Behavior | Situational Factor(s) | Possible Leader Styles |

    |---|---|---|---|

    | Path-Goal | Day-to-day interactions and problems or issues that are faced by
    followers | Needs of the follower and leader, as well as demands of the work environment
    | Directive, supportive, participative, achievement-oriented |

    | Hersey/Blanchard | Decision-making | Follower readiness in terms of both ability
    and motivation | Directive, consultative, facilitative, delegative |

    | Vroom/Jago | Decision-making | Nature of the decision, situational readiness
    of followers, and leader expertise | Directive, consultative, facilitative, delegative
    |'

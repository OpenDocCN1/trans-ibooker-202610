- pgno: 178
  md: '# How are Leader Values Connected to Inspiration/Vision?


    Values pertain to strongly held beliefs that tend to guide the actions of individuals.
    Specifically with regard to leaders, values are relevant to decisions that are
    made. It should be apparent by now that there is a link between values and inspiration/vision,
    but what exactly is that link? Some research by Sully de Luque and colleagues
    has directly addressed that question.[20] The researchers examined over 500 companies
    spanning seventeen countries from several different continents. First, they asked
    CEOs of these firms how much importance should be attached to various considerations
    or groups/entities when these CEOs make strategic decisions. They labelled the
    importance of these considerations as decision-making values. One set of items
    dealt with stakeholders, including employees, customers, physical environment,
    and the greater community or nation in which the firm operates. These people or
    entities are referred to as stakeholders, since they all have a stake in how the
    firm operates or what it accomplishes—both good and potentially bad. CEOs who
    rated these items as highly important in their decision making were characterized
    by the researchers as strong on stakeholder-based values.


    A second set of items pertained to economic concerns, such as the importance of
    considering profits, sales volume, and cost controls. When CEOs reported that
    such concerns should take predominant importance in their strategic decision-making,
    the researchers characterized those CEOs as strong on economic values. In rating
    both stakeholder and economic values, CEOs were asked which ones should be predominant,
    versus being more secondary. Before proceeding, try taking the survey in Section
    7 to see how you personally view stakeholder vs. economic values.


    The researchers also asked followers or subordinates of each CEO about that person''s
    leadership. CEOs who were rated high on inspirational/visionary leadership were
    seen by followers as being energetic and enthused, and having good insight into
    what may happen in the future. In addition, these followers rated their CEOs on
    autocratic leadership. CEOs who were rated high were seen as telling subordinates
    what to do in a commanding manner and forcing their ideas on to others.


    Results of this research are depicted in Figure 11.2. As shown in the figure,
    this research connects three questions:


    +   1. What are the values that CEOs stress when they make strategic decisions?
    Are stakeholder values predominant for a particular CEO, or does the CEO put the
    most emphasis on economic values?

    +   2. How do followers view the CEOs in terms of inspirational/visionary leadership,
    versus autocratic leadership?

    +   3. What outcomes does the firm experience?'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# FIGURE 11.2 Connecting Leader Values, Inspiration/Vision, and Firm Outcomes


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_179_0.png)


    Several findings of the study help us to answer how a leader''s values connect
    to inspiration/vision. First, leaders who had strong stakeholder values in their
    strategic decision-making were more likely to be seen as inspiring/visionary,
    and less likely to be viewed as autocratic by followers. In contrast, leaders
    with strong economic values were more likely to be seen as autocratic, and less
    likely to be viewed as inspirational/visionary. Second, organizations with inspirational/visionary
    CEOs tended to achieve more commitment and extra effort from employees, while
    those with autocratic CEOs achieved less. Third, as a bottom line outcome, organizations
    with inspirational/visionary CEOs (and those with stakeholder values) had a stronger
    chance of achieving better financial outcomes in terms of return on investment
    and sales growth relative to competitors.


    What can we learn from this research? We see the following key takeaways:


    +   * Stakeholder values engender perceptions of better leadership. Leadership
    is largely in the eye of the beholder. In other words, what really matters is
    how others view an individual''s leadership. Ask yourself the following question:
    In a leadership role, would you rather be viewed as inspiring/visionary, or would
    you rather be viewed as autocratic? Most people who want to learn more about and
    develop their own leadership would probably say the former—inspiring/visionary.
    It could be that on a day-to-day basis, a leader who shows that he or she attempts
    to stress a broad range of stakeholders when making decisions is demonstrating
    a long-term, visionary perspective that followers find to be inspiring. Conversely,
    when a leader seems to be more narrowly stressing profits, controlling costs,
    and so forth, there is a good chance that he or she is doing so in an autocratic
    manner and is less inspiring.


    +   * Stakeholder values are associated with inspiring core purpose and an integrator
    orientation to responsibility. We note two things here about stakeholder values.
    First, these values are very much in line with the socially-based, core purposes
    shown on the right side of Table 11.1, which individuals also find to be inspiring.
    Second, strong stakeholder values are in line with the type of integrator orientation
    to responsible leadership that was discussed in Chapter 6. In other words, a strong
    and broad sense of stakeholder-based values on the part of leaders aligns with
    an integrator orientation toward responsibility.


    +   * Stakeholder values and inspirational/visionary leadership are likely to
    result in good outcomes. The outcomes that these values and leadership are likely
    to achieve are not only in terms of direct effects on employees (i.e., commitment
    and extra effort), but also in terms of bottom-line financial outcomes of the
    firms of leaders.


    +   * Stakeholder values and inspiring/visionary leadership are global. One interesting
    aspect of this research is that it involved firms from many countries and continents
    (including Africa).'
  merge: -1
  img_proc: true

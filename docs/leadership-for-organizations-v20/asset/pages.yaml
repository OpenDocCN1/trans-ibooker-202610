  md: '# Seeking, Receiving, and Giving Feedback


    > "There are two things that people want more than sex and money . . . recognition
    and praise. Every single person you meet has a sign around his or her neck that
    says, ''Make me feel important.'' If you can do that, you''ll be a success not
    only in business, but in life too." —Mary Kay Ash, founder of Mary Kay Cosmetics


    > "The more high technology around us, the more the need for the human touch."
    —John Nesbitt, author of Megatrends


    > "The way the positive reinforcement is carried out is more important than the
    amount." —B. F. Skinner, author and psychologist


    # Learning Objectives


    +   1. Explain the importance of not only giving feedback as a leader, but also
    seeking and receiving feedback.

    +   2. Identify and use the elements of effective listening in the leader role.

    +   3. Describe the key challenges of delivering feedback effectively.

    +   4. Explain and demonstrate the steps of coaching one-on-one.

    +   5. Summarize the value and uses of 360-degree feedback as a mechanism of both
    feedback receiving and coaching.


    Mary Kay Ash, founder of Mary Kay Cosmetics, was quite the leader. She was certainly
    spot on with the above quote in which she highlights the important role of leaders
    as feedback givers, especially as a means of providing positive reinforcement.
    But feedback is not a one-way street. It is also important for leaders to seek,
    and then appropriately receive, feedback. All three aspects of feedback—seeking,
    receiving, and giving—can present challenges for leaders. For example, if leaders
    do not appropriately give feedback, followers will likely lack motivation.


    On the other hand, if leaders do not seek and receive feedback, they cannot continually
    learn about themselves and others.[1] John Donahoe is the CEO of ServiceNow, a
    cloud computing company with 6,000 employees, and the former CEO of eBay. He''s
    a big believer in the importance of feedback and claims that “Feedback is a gift
    ... if you’re too proud to learn and grow—you’re dead.”[2] Hamid Moghadam, the
    CEO of Prologis, the world’s leading industrial real estate firm, observes that'
  merge: -1
  img_proc: true
- pgno: 115
  md: '"Leaders don''t hear the truth as often or in as much detail as they need to."[1]
    The only effective solution is for leaders to seek out and take in feedback from
    others.


    In this chapter, we first address the leader''s attention to the seeking and receiving
    of feedback. Then we devote attention to the giving of feedback, including potential
    problems that can occur. In our consideration of feedback giving, we pay special
    attention to the process of one-on-one coaching. Finally, we consider the leader''s
    role, as both receiver and giver, in a popular feedback process known as 360-degree
    feedback.


    # # 7.1 Seeking and Receiving Feedback as a Leader


    **avoidant orientation**

    An orientation for receiving feedback that involves avoiding failure and negative
    evaluations on the part of others.


    Leaders attempt to influence others, and for that very reason alone, it is especially
    important for leaders to understand how they come across to others. The way that
    leaders can form an accurate understanding is through their seeking and receiving
    feedback. Unfortunately, it is not always so simple. People vary in the extent
    to which they are motivated to seek and constructively receive feedback. There
    are essentially three types of feedback seekers in terms of their potential goals
    when it comes to receiving feedback: (1) avoidant, (2) performance prove, and
    (3) learning.[4] An avoidant orientation involves avoiding failure and negative
    evaluations on the part of others. In other words, the feedback receiver takes
    steps to avoid negative feedback. A performance prove orientation is similar except
    that these individuals do attempt to seek and filter feedback that will confirm
    one''s competence. Either way, these two learning orientations only allow for
    the intake of positive feedback. However, leaders may best learn from feedback
    that is not always so positive.


    **performance prove orientation**

    An orientation for receiving feedback whereby the focus is on seeking and filtering
    feedback that will confirm one''s competence.


    Indeed, it is very likely that feedback seekers who are either avoidant or performance
    prove will have what can be referred to as "blind spots." These are problems for
    which a leader may not be aware, but could nevertheless hinder his or her effectiveness
    or career progression. Blind spots can obviously pertain to more negative aspects
    of one''s behavior, such as indecisiveness, or even aggressiveness and abusiveness.
    But it could even refer to more seemingly positive aspects of behavior, such as
    being too much of a "nice guy" by refusing to take actions that could harm others,
    even if those actions would foster the greater good. For example, a leader could
    be blind to the fact that he needs to confront and discipline an employee who
    is causing problems with other team members, and thus damaging the morale of the
    rest of the team.


    **learning orientation**

    An orientation for receiving feedback that involves a desire for betterment (i.e.,
    in terms of behavior, knowledge, and skills) through one''s broad effort to both
    seek and receive feedback, positive and negative.


    Accordingly, the most constructive form of feedback seeking and receiving for
    people in general, and perhaps leaders in particular, is what has been termed
    a learning orientation. This orientation involves a desire for betterment (i.e.,
    in terms of behavior, knowledge, and skills) through one''s broad effort to both
    seek and receive feedback—positive and negative. Individuals with a learning orientation
    are less likely to have blind spots, at least for extended periods of time, since
    they are active feedback seekers and receivers. To get a better feel for how these
    orientations pertain to you personally, try answering the statements posed in
    Section 4. Do you personally want to learn through feedback, or is feedback something
    to be avoided or simply used to confirm your worth and accomplishments?


    # # Receiving Feedback Through Listening


    A learning orientation will make one more predisposed toward learning from negative
    feedback. In other words, it shows a willingness or motivation to improve based
    on feedback. However, a learning orientation does not guarantee that such learning
    will occur. To truly follow through and be a'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'good feedback receiver, one must also be a good listener. In the modern world,
    the notion of ‘listening’ now extends beyond face-to-face interactions to include
    how one processes and responds to information that is received in a virtual medium,
    such as chat or email.


    Listening involves many elements, but here we emphasize three things: (1) listen
    actively and avoid distractions, (2) listen more and speak less, and (3) avoid
    quick judgments.[5] Active listening involves such obvious things as eye contact
    and occasional nodding in response to what the other person is saying. But it
    also involves asking probing or clarifying questions. The goal of such questioning
    should not be “gotcha” or “one-upmanship.” Instead, the goal should be a better
    understanding of what is being communicated. In addition, the listener should
    avoid distractions. In this increasingly technological, multi-tasking world, the
    avoidance of distractions is easier said than done. Individuals, including leaders,
    are subject to multiple demands or projects, have cell phones that are constantly
    active, and so forth. So being focused and in the moment, or what is also known
    as mindfulness,[6] is not easy to achieve, but nevertheless, is a necessity to
    effectively listen and receive feedback.


    There is a tendency when one listens to negative feedback to want to immediately
    fire back with clarifications, excuses, or counter-information—and to even do
    so while talking over the person who is providing feedback. However, it is important
    to essentially “hold one’s fire,” and simply take in the feedback. In so doing,
    the leader or feedback recipient shows respect toward the person who is providing
    the feedback.


    In addition to allowing the other individual to provide feedback without immediately
    firing back, the leader should avoid quick judgments about the feedback provider.
    People in general have a tendency to form quick judgments or attributions about
    the motives and behaviors of others. For example, when receiving negative feedback,
    an individual may quickly size up the feedback provider as callous, uninformed,
    unfair, and so forth. The problem is that such quick judgments can cloud our understanding
    and positive use of the information that we receive. As stated in more detail
    below, communication senders should avoid speaking in terms of judgments and attributions.
    But at the same time, when leaders are communication receivers, they should try
    to look beyond judgments and attributions in order to learn from feedback.


    # 7.2 Giving Feedback as a Leader


    It should not come as a surprise that a key activity involved in leading is the
    giving of feedback. But what is not so clear are the challenges that leaders face
    when giving feedback, and how feedback giving relates to other processes, such
    as coaching. Here, we first describe such challenges. We then proceed to consider
    the process of coaching individuals one-on-one, and the role of giving feedback
    when serving as a coach. We further consider a systematic feedback program that
    is relevant to both feedback giving and receiving, specifically 360-degree feedback.


    # Challenges When Delivering Feedback


    There are a number of challenges for leaders attempting to provide feedback to
    followers. Some of those challenges deal with aspects of the followers. After
    all, as repeatedly emphasized throughout this book, “it takes two to tango”—in
    other words, effective leadership involves both leaders and followers. For example,
    if followers themselves have either avoidant or performance proof goal orientations,
    it can be very difficult to provide feedback, regardless of how constructive that
    feedback might be. But here, we will emphasize two issues of particular importance:
    (1) communication media, and (2) judgments and attributions.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Communication Media


    Gradually over time, the options of communication media have grown in number and
    complexity. Over a hundred years ago, leaders had one simple option: face-to-face
    communication. Then with the invention of the telephone, leaders had an additional
    means of communicating with followers. In most recent times, the options have
    grown even further. Less than thirty years ago, the telephone was restricted to
    landline capabilities, but now cell phones are extremely common around the world,
    making phone communication much more available and convenient. Moreover, email,
    texting, video conferencing, and "chat" pose additional, communication media possibilities.
    Accordingly, in any given instance in which a leader feels the need to communicate
    or give feedback to one or more followers, the logical question becomes: which
    medium should be chosen?


    That is not an easy question to answer. The COVID-19 pandemic oftentimes restricted
    the face-to-face option and made more virtual modes of communication unavoidable
    in many instances. But even under more normal circumstances, a leader will mistakenly
    use an electronic, virtual medium, such as email or texting, simply because it
    is expedient. In other words, the leader may be experiencing a busy day, and feels
    the need to send a follower a quick message, so he or she simply sends an email
    or text message. However, the appropriate medium depends on the nature of the
    communication or the feedback. The key factor to consider is the "richness" of
    the communication medium, and whether that richness matches the nature of the
    feedback to be given. In essence, richness refers to the extent to which communication
    not only conveys information, but also properly takes into account emotions—on
    the part of both the sender and the receiver. As mentioned in Chapter 2, emotions
    are not ignored by effective leaders; instead, they are embraced.


    Electronic or virtual media such as email, chat, or text messaging can effectively
    and efficiently send information, sometimes to thousands or even millions of people
    in a single message.[7] But those media may not adequately deal with emotions
    or potentially contentious matters. In other words, the emotions of the communication
    sender may not come through clearly, and perhaps more importantly, the emotions
    of the communication receiver may not be properly understood or handled by electronic
    media. In contrast, media such as phone or face-to-face contact are much better
    in terms of effectively dealing with emotions. The communicator can adequately
    get his or her emotions across, and the receiver can adequately show the emotions
    that result from the communication. Overall, if the leader is the sender of feedback,
    he or she is in a much better position to deal with emotions effectively through
    either phone or, even more so, face-to-face communication.


    With all of that in mind, here are a number of recommendations to which leaders
    should adhere as givers of feedback when it comes to electronic and other communication
    media:


    +   - Think carefully about the nature of the feedback that is given. If it is
    controversial, laden with potentially negative emotions (either in terms of the
    emotions being portrayed by the sender, or the emotions that are likely to be
    generated on the part of the receiver), or highly complex, then electronic forms
    of communication are not best. Instead, the leader should simply pick up the phone
    or communicate face-to-face.

    +   - If using email: (a) use an appropriate subject line to grab the receiver''s
    attention, and (b) keep the message relatively short and to the point.

    +   - If either email or text messaging does not seem to be working well in terms
    of the results that are expected by the feedback sender, then just pick up the
    phone and call the feedback receiver. The call might serve to quickly clear up
    the confusion or quell negative emotions.

    +   - Be careful not to send information in email messages that you might not
    want to be distributed widely. Even though you may have appropriately restricted
    an email message to just one or a few people, email has a way of finding itself
    in the hands of an unintended audience.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '+   * Think very carefully before you hit the “send” button for either email
    or text messages. Sometimes email or texting is viewed as a quick and easy way
    to get something “off your chest.” That is not the proper use of such communications
    media.


    +   * Consider the nature of feedback receiver. If the person is someone with
    whom you already have a somewhat long-term, amicable relationship, then there
    is less potential for misunderstandings or negative emotions when using electronic
    communication. However, if the communication receiver is not as familiar with
    the sender, or does not have a close working relationship, there is much more
    room for problems with electronic communication.[8]


    An interesting aspect of these recommendations is that they can apply to more
    than feedback giving on the part of leaders to followers. They can also apply
    to co-workers, or even personal relationships. For example, one might consider
    these recommendations when communicating with a significant other, such as husband
    or wife.


    # # Judgments and Attributions


    People have a natural tendency to judge. They judge or size up situations, and
    more importantly, they judge other people. Leaders are no exception. They evaluate
    the actions of followers and form judgments or attributions regarding the cause
    or motives behind those actions. An **attribution** is essentially a judgment
    regarding a person’s motives or personality as a perceived explanation for the
    cause of that person’s behavior or performance. On the one hand, it is possible
    for attributions to be external. In such instances, the cause (or blame) is not
    placed on the individual, but rather the individual’s circumstances (e.g., family
    issues, lack of cooperation from co-workers, unfair procedures to which the follower
    has been subjected, and so forth). Father Greg Boyle runs Homeboy Industries,
    an on-the-job-training program in Los Angeles to help former gang members. He
    constantly deals with people whose actions can easily invoke negative emotions.
    He describes how his approach is “to stand in awe—not judgment.”[9] Rather than
    judging them, he understands the difficult situations in which they live and appreciates
    how hard it has been for them.


    attribution

    A judgment regarding a person’s motives or personality as a perceived explanation
    for the cause of that person’s behavior or performance.


    On the other hand, we often make attributions that are quite internal (i.e., to
    the person’s motives, nature, or personality) and negative in nature. Indeed,
    the tendency that we have to overestimate the effect of internal factors, while
    underestimating the effect of external factors, has traditionally been termed
    the fundamental attribution error.[10] Some examples of making strong internal
    attributions, and actually communicating those attributions, include the following:


    +   * “You show up late to class because you do not care about this class or your
    education.”

    +   * “When you express your opinions so strongly it shows that you don’t really
    value the opinions of others and that you are arrogant.”

    +   * “When you do not show concern for my frustrations, it just goes to show
    how you don’t care about the feelings of others.”

    +   * “When they are in negotiations, people from Asian cultures (such as Japan)
    avoid eye contact because they are trying to be deceptive as a way of manipulating
    the situation.”


    As a feedback giver, negative attributions can seem cathartic for leaders. That
    is, a communication of an attribution can help in terms of quickly “getting something
    off your chest.” In addition, a leader might feel that he or she is getting to
    the point and stating feedback in terms that can be quickly understood and acted
    upon by followers. However, attributional communication on the part of leaders
    can be very problematic. Specifically, people do not like to be judged, and the
    communication of attributions is likely to make the feedback receiver very defensive,
    rather than successfully leading to behavior change. If one becomes defensive,
    then the goal of the feedback (i.e., performance improvement) has little chance
    of success. Kevin Johnson, the NBA all-star and former mayor of Sacramento, California,
    offered a suggestion to avoid such negative attributions when he said, “Stick
    to your principles, but abandon your assumptions.”[11] Marine Corps General James
    Mattis said the same thing slightly differently, “Don’t apologize for your values,
    but don’t assume that they are right.”[12]'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'So instead of laying negative attributions on followers, what is the solution?
    That is not an easy question to answer, especially since as a general rule, people
    do not like to receive negative feedback. Nevertheless, negative feedback on the
    part of leaders is sometimes necessary to not only satisfy the goals of the organization,
    but to also help followers develop. But negative feedback need not be delivered
    in the form of judgments or attributions. As an alternative, leaders can specifically
    confront the negative behavior, report how that behavior affects them and the
    organization, and together problem solve as to a solution. Using the showing up
    late to class example mentioned above, a leader might:


    +   a. Describe the behavior to the follower (“I noticed that you showed up late
    to class today”).

    +   b. Describe how the behavior makes the leader feel (e.g., frustrated), or
    its effects on the organization (e.g., disturbing to the class process).

    +   c. Ask questions as to why the behavior may have occurred and together determine
    how the behavior can be prevented in the future. As phrased by Walt Whitman, “be
    curious, not judgmental.”


    Notice how the above actions on the part of the leader involve no judgement or
    attribution of motive. But at the same time, the leader is feeding back his or
    her concerns, as well as listening to the follower. While there is no guarantee
    of behavioral change on the part of the follower, there is at least a better chance
    of success, while reducing the tendency toward a defensive reaction. In short,
    alternatives to attributional communication that are more precise, behavioral,
    and non-judgmental can be worthwhile when interacting with followers and co-workers,
    and even in personal relationships. Bill Campbell, the widely admired coach of
    Steve Jobs, Larry Page, Sergey Brin, and numerous other Silicon Valley CEOs, said
    it quite simply, “Be direct—not mean.”[13]


    # One-on-One Coaching


    Coaching is commonplace in many spheres of life, including sports and organizations.
    Our reason for introducing coaching here is that it constitutes a primary means
    by which leaders give feedback, and followers receive it. For the sake of describing
    leadership techniques, we partition coaching into one-on-one interactions between
    a leader and follower, versus the type of coaching that is shown by a leader to
    a team as a whole. This latter form of coaching is emphasized in the next chapter.
    Of course, in reality, these two forms of coaching can mix together in a fluid
    manner. For example, in one moment, a leader may provide coaching to a single
    follower, while shortly thereafter, the coaching is directed toward the overall
    team. The common denominator is that coaching in general is targeted toward performance
    improvement.


    As shown in Table 7.1, one-on-one coaching may be viewed in terms of a logical
    sequencing of steps.[14] First, it is imperative that the coach establish performance
    goals or standards in his or her own mind, and then communicate them to the person
    being coached. This may seem intuitive, but it is quite possible that a coaching
    effort could turn into the proverbial “blind leading the blind” without a clear
    understanding by all parties concerned as to what effective performance is all
    about.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# TABLE 7.1 Key Steps of One-on-One Coaching


    | Key Steps of One-on-One Coaching |

    | :--- |

    | 1. Establish and communicate performance goals or standards |

    | 2. Collect performance data or make observations |

    | 3. Analyze performance, including "gaps" |

    | -preferred vs. actual performance |

    | -self vs. other assessment |

    | 4. Provide feedback, advice, and encouragement |

    | -follow the "be here now" principle |

    | -timely, specific, behavioral, balanced, and "owned" |

    | -avoid negative attributions or judgments |

    | 5. Get the follower''s agreement that a problem exists |

    | 6. Mutually devise and implement a development plan |


    Second, effective coaching is based on good data. At a minimum, such data might
    consist of systematic, ongoing observations by the coach. However, it could also
    involve systematically-collected data from other sources. For example, below we
    will consider how 360-degree feedback processes can supply the data upon which
    coaches can provide their own feedback. As a caveat, one thing that can be detrimental
    is to rely on hearsay. When coaches base their feedback on hearsay or “I’ve heard
    it said that you ...,” defensive reactions are likely to ensue on the part of
    the person being coached. That person will naturally question the motives or validity
    associated with the hearsay evidence.


    Third, the coach needs to process or analyse the data that have been gathered.
    An emphasis should be placed on potential gaps. The primary gap of concern is
    the difference between the desired or preferred performance that is identified
    in the first step, versus the actual performance that is suggested by the data
    that is gathered in step 2. However, a gap that is less obvious, but equally important,
    is the extent to which the person being coached perceives things differently than
    do others. For example, if an individual perceives that she is already performing
    at a high level on a particular dimension (e.g., quality of performance), but
    the coach or others do not perceive such a high level, then there is obviously
    a challenge for the coach to bring the individual’s perceptions more in line with
    those of others.


    Fourth, based on the previous three steps, the key to coaching is to provide feedback,
    advice, and encouragement. In other words, this step gets at the heart of coaching,
    but on the other hand, it is not likely to be successful if the prior three steps
    are ignored. To successfully implement this step, the coach needs to follow the
    “be here now” principle that was emphasized in Chapter 1. That is, the coach needs
    to provide feedback and attend to cues from the person being coached with a minimum
    of distractions, and with full attention being shown toward that person (e.g.,
    being in a listening mode, as well as feedback giving mode). Further, the feedback
    and advice needs to be timely, specific, behavioral, balanced, and “owned.” That
    is, feedback and advice should be: (a) as soon after any negative performance
    indicators are observed; (b) specific and behavioral in nature rather than vague
    and filled with general judgments or attributions; (c) balanced in terms of including
    positive feedback; and (d) “owned” in terms of the coach believing in the feedback,
    rather than simply relaying information from others. Regarding the latter point,
    even if much of the data that forms the basis of feedback is garnered from other
    individuals or sources, it is imperative for the coach to say that he or she believes
    in the validity of the data, rather than simply being a messenger.


    The idea of balancing feedback is that the person being coached should not be
    overwhelmed with negative feedback. Getting back to the opening quote of this
    chapter, Mary Kay Ash was a'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'champion of providing recognition and praise to her followers in order to make
    them feel valued and important. While negative feedback should not be avoided
    if warranted, the coach needs to ensure that the feedback recipient feels valued,
    and the best way to do that is to make sure that any negative feedback is balanced
    with positive reinforcement.


    As noted above, it is important for the leader to listen, rather than just provide
    feedback. This may involve interspersing constructive questions that are directed
    toward the behaviour of the person being coached, and then carefully listening
    to that person''s answers. The overall goal is to make sure that the feedback
    being provided is understood.


    Fifth, it is imperative that the coach gets a verbal acknowledgement or agreement
    that a performance problem exists. This is often a forgotten step, since coaching
    interactions often disintegrate into one-way communication exercises in which
    the coach talks, but the person being coached remains quiet. However, it is important
    that the feedback is not only understood, but that a problem is recognized by
    part of the person being coached; indeed, a problem that needs to be corrected.


    Finally, to complete a coaching process, the coach and person being coached need
    to mutually agree on what actions will be taken after the coaching process is
    completed. Without this final step, it may not be clear as to the precise action
    steps to be taken to ensure performance improvement.


    # 360-Degree Feedback


    It is very common for employees of organizations to receive formal feedback regarding
    their performance through such mechanisms as performance appraisal systems. The
    typical process is that such feedback is received from one''s supervisor formally
    on paper, as well as through a face-to-face meeting, which is done on an annual
    basis. A numeric evaluation is often applied (e.g., a 5-point scale, whereby 5
    is the highest performance rating). As people move into leadership roles, performance
    (and thus, performance feedback) becomes more complex. That is, individuals increasingly
    have effects not only on objective performance indices (e.g., sales, productivity,
    etc.), but they also have an impact on a wide range of other people, such as the
    employees who they supervise. In addition, communication and feedback become even
    more important as people enter leadership roles. As mentioned earlier, while we
    typically think about leaders as communication givers, it is equally important
    to think about leaders as communication receivers. If leaders do not receive and
    absorb communication well through feedback, they are not likely to be successful—especially
    as they attempt to advance to higher level positions.


    The practice of 360-degree feedback in organizations was conceived largely as
    a means of leader development.[15] As depicted in Figure 7.1, the underlying concept
    is that it is desirable for leaders to receive and learn from feedback from a
    variety of hierarchical and lateral sources (hence, the term “360-degree”) including
    bosses, subordinates, peers, and customers. Although some 360-degree feedback
    efforts include multiple sources, upward feedback is most common. Indeed, given
    the importance of leader-follower relationships, it is not surprising to see an
    emphasis on upward feedback.[16]'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# FIGURE 7.1 360-Degree Feedback


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_122_0.png)


    A typical 360-degree feedback system will involve a survey administered to at
    least one source of individuals (e.g., followers) in addition to one’s boss. It
    also commonly includes self-perceptions. The survey will oftentimes be focused
    on the types of leadership qualities and behaviors that are considered in this
    book. It can include rated items and/or space for write-in comments. The identity
    of the individuals, other than one’s boss, who complete the survey remains anonymous
    in an attempt to solicit honest feedback. That feedback is cumulated and put into
    a feedback report, which is then delivered to the feedback recipient, typically
    by one’s boss or an external coach/consultant through a coaching process. Thus,
    although 360-feedback is primarily related to feedback receiving on the part of
    leaders, it can also be pertinent to feedback giving if facilitated by a leader’s
    boss. The feedback report can include numeric scores on rated items, as well as
    transcribed write-in comments. Regarding numeric scores, averages for a given
    survey item could be fed back, as well as frequencies (e.g., how many people rated
    the individual as 1, 2, 3, 4, or 5 on a 5-point scale).


    In theory, the basic idea of 360-degree feedback is that recipients will receive
    the feedback, analyze and carefully consider it, and then make attempts to improve
    their leader’s behavior based on the feedback. For some recipients, this is indeed
    the case as shown in some research studies.[17] However, in many instances, the
    effects of 360-degree feedback are minimal at best. Two key reasons may account
    for potential lack of success with a 360-degree feedback process. First, recipients
    may have a bad attitude toward the feedback or have the type of performance prove
    goal orientation that was considered earlier in this chapter. For example, if
    some of the feedback comes from followers who are viewed simply as “subordinates,”
    people receiving the feedback who are in formal leadership positions may not think
    that it is important. And they may even feel that subordinates do not have the
    “right” to supply such feedback. As another example, the feedback recipient may
    have vastly overrated him or herself in relation to the ratings of others on various
    dimensions. Accentuating these problems is the fact that 360-degree feedback systems
    are often administered simply as a developmental add-on to the more formal, performance
    appraisal process. In other words, it is used just for leader development purposes
    alone. However, it may have no “teeth” in a particular organizational setting
    in terms of directly determining raises, promotions, and the ability to stay in
    (or be promoted to) a leadership role.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Second, feedback reports might be delivered to recipients without appropriate
    follow up coaching, which can potentially be delivered by one''s supervisor, or
    outsiders (e.g., HR specialists, consultants, and executive coaches). A key advantage
    of 360-degree feedback is that it provides data that is systematically collected,
    rather than feedback that is based on hearsay. Accordingly, these types of processes
    can provide very tangible data upon which coaching can proceed. Yet, there is
    no guarantee that coaching will indeed accompany a 360-degree feedback process.
    For example, one''s supervisor might deliver the feedback report without actually
    helping the recipient to work through the feedback to determine what might be
    learned and changed, as well as why such change is important (e.g., to learn from
    the feedback in order to obtain higher level leadership positions). Since leadership
    and coaching represent a two-way street, if the feedback recipient has a negative
    attitude toward the process, it will be that much harder for the supervisor/coach
    to help guide the recipient. So for the process to be successful, a coach needs
    to help the recipient to learn from the feedback, and the recipient needs to be
    open to change based on the feedback.


    Finally, even if coaching accompanies the feedback, if the feedback recipient
    does not take follow-up steps to improve, then the 360-degree feedback process
    is liable to be all for naught. One possible approach is for the feedback recipient
    to take just three or four items or issues from the data, and have a meeting with
    those who provided the feedback. The goal is to learn more about why those items/issues
    were rated relatively low, or how the recipient can improve. Obviously, the goal
    should not be to identify who said what in the survey, or to debate the validity
    of the survey process. Instead, the feedback recipient should simply listen, take
    notes, and ask constructive questions regarding how improvements might be made.
    In our own experience with 360-degree feedback, this follow-up step is crucial
    if feedback recipients are to learn and change their behavior.


    In sum, while 360-degree feedback can help develop leaders in terms of the receiving
    aspect of leader communication, its implementation has challenges. The feedback
    can reveal blind spots that the leader did not realize, and if improved, could
    greatly enhance the leader''s development. On the other hand, aspects of the leader,
    as well as the context within which the feedback is administered, all work to
    determine whether or not 360-degree feedback will be successful.


    # Video Cases for This Chapter


    The video cases for this chapter depict the seeking/receiving of feedback, as
    well as the giving of feedback on the part of leaders. These videos reflect instances
    where feedback seeking/receiving and giving can be somewhat informal or off-the-cuff.
    They also demonstrate how feedback can be delivered and received in a more systematic
    manner through coaching.'

  md: 'Also, and especially in his early years at ASU, Crow had a reputation for personally
    working tirelessly in the determined pursuit of goals and change efforts, even
    if such change was controversial in nature. Combined with his personal intelligence
    or brilliance, his efforts served as a personal role model of energetic, hard
    work. For example, stories abound of such things as the very few hours of sleep
    he obtained per night in lieu of hours devoted to his job. Given the high standards
    that he seemed to set for himself, it should not be surprising that he set high
    standards for ASU units and individuals. In terms of effort and devotion, it would
    seem clear that, at least at the beginning of his tenure, Crow led-by-example.
    In addition, in the early years of his tenure at ASU, Crow became known for attempting
    to spread his vision widely through off-campus speeches to the community, as well
    as on-campus town hall meetings.


    Large public universities tend to be stodgy with long-term, in-grained problems.
    As such, they become like large ocean-liners in terms of resisting change, not
    being entrepreneurial or innovative, and not being able to change course. However,
    Crow has shown little hesitancy to pursue quick changes or take advantage of potential
    opportunities. A term that he has coined in the pursuit of change is to take action
    “post-haste.” Especially in the early years of his administration, he used such
    language to emphasize the need for quick change, or else the university might
    suffer dire consequences. Examples of relatively quick, yet major changes or opportunities
    that he has personally spearheaded include:


    +   - Tuition increases to make ASU more in line with that of comparable universities

    +   - Support gained from the cities of Scottsdale and Phoenix to subsidize ASU
    growth

    +   - Job cuts and furloughs in the 2009 recession

    +   - Joint venture for online education with Starbucks

    +   - Acquisition of the Thunderbird School of Global Management


    Section 5 suggests that a favorable aspect of Crow’s leadership is his apparent
    not succumbing to internal politics in his decision-making. In general, major
    decisions or actions appear to be taken based on principle or vision, rather than
    in accordance with internal politics that are often in play at universities. On
    the other hand, he has demonstrated a good understanding of the external political
    environment surrounding the university, and in the process, has garnered a high
    degree of support from state and local governments, as well as large donors and
    other benefactors to the university—even the President of the United States.


    Finally, Crow himself has received honors and accolades. For example, he was one
    of four recipients of the 2013 Academic Leadership award bestowed by the Carnegie
    Corporation of New York. The award is designed to honor university presidents
    who show such things as commitment to access on the part of potential students,
    international engagement, and the formation of partnerships with local communities.
    One feature of the award is that it is accompanied by a $500K grant to the recipient’s
    institution (i.e., ASU) to be allocated at the discretion of the recipient to
    further his/her academic priorities.


    In sum, there are clearly favorable aspects regarding Crow’s approach to his leadership
    role in fostering change at ASU. Aside from stylistic issues, it is difficult
    to challenge the notion that the tangible accomplishments or outcomes mentioned
    above are largely due to his own ideas, efforts, and force of will. Nevertheless,
    problematic aspects of his leadership have also been identified by people within
    the university, as well as those who are external.


    # Controversial Aspects of Crow’s Leadership


    The controversial nature of Crow’s approach to leading change at ASU is captured
    by the mixed review that he has received in the media. On the one hand, articles
    describe him as charismatic, visionary, courageous, and bold. On the other hand,
    a more negative or dark side has also been portrayed in the media. To be fair,
    many of the more negative articles have come from a single source—a Phoenix-based
    tabloid-style newspaper, the New Times, and they were mostly earlier in'

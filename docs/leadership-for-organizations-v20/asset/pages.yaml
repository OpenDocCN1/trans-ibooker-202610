- pgno: 172
  md: '# # Charismatic Leadership


    Charismatic leadership is a term that is often reserved for leaders who are perceived
    to be extraordinary as people, as well as in the manner in which they lead. Much
    has been written about charismatic leadership, and the term is used in common
    parlance to describe some leaders.[4] Some of the qualities that are commonly
    associated with charismatic leaders include:


    +   - Self-confidence and conviction based on strongly-held beliefs and values
    with which others can identify

    +   - High energy and passion for the vision or sense of purpose toward which
    the leader wants to strive

    +   - Appeals to both followers'' thought processes and their emotions

    +   - Perceived as a role model

    +   - Strong liking or devotion on the part of followers


    One thing that needs to be made clear is that much of the above is in the eye
    of the beholder. In other words, some potential followers might admire a leader''s
    beliefs/values, vision, and sense of purpose, while others may not. This may be
    especially true with regard to political or governmental leaders. For example,
    if an individual''s own ideological or political values lean largely to the right,
    she or he will have a difficult time viewing a far-left political leader as charismatic,
    and vice versa. With that said, the focus of this book is on organizational leadership,
    and in that realm, such ideological-based differences between followers and leaders
    are not as likely to be relevant to perceptions of charismatic leadership. In
    our discussion that follows, we will see examples of the type of values and vision
    that a broad swath of potential followers can rally around.


    In addition, leaders will tend to have more charismatic appeal and be effective
    if they take strong, decisive actions during times of crisis.[5] Crisis can be
    personal (e.g., fear of everlasting damnation) or organizational (e.g., anxiety
    regarding falling sales and market share). Charismatic leaders are able to assuage
    such fears and anxiety by providing confidence for followers that through the
    leader''s vision and actions, crises can be addressed. Winston Churchill, Nelson
    Mandela, President John F. Kennedy, Fidel Castro, and Martin Luther King Jr. are
    often held up as charismatic political or societal leaders who rallied their countrymen
    during times of crisis. People like Steve Jobs at Apple, Herb Kelleher at Southwest
    Airlines, and Alan Mulally at Ford are often held up as organizational leaders
    who, in times of uncertainty and crisis, were able to help save their companies
    from destruction.


    But charismatic leadership can be a “double-edged sword.” In other words, charisma
    and its potentially powerful effects can be used for the purpose of doing good.
    Alternatively, there is a dark side to charisma in that it can be used for bad
    or even evil purposes. Leaders who have used their charisma in a way that has
    resulted in great harm to others include such individuals as Jim Jones. Jones
    was a religious leader who had many of the above qualities. In the 1970s, he was
    able to persuade about 1,000 of his followers to relocate from northern California
    to Guyana, which is in northern South America. Eventually, he also manipulated
    over 900 of these followers to commit a mass suicide by drinking Kool-Aid that
    was laced with cyanide.[6] The term “Kool-Aid drinker” was spawned from this horrific
    tragedy, and it is meant to imply an individual who will engage in dangerous actions
    without careful consideration, based largely on blind obedience to a charismatic
    leader.


    What distinguishes these two types of charismatic leaders? To a large extent,
    we can refer back to the two types of need for, and use of, power discussed in
    Chapter 2: (1) socialized, versus (2) personalized. The charismatic leaders whose
    need for power is largely socialized will use their charismatic influence and
    associated power in order to do good for other people. In contrast, leaders whose
    need for power is largely personalized will use their charisma to garner resources
    or manipulate situations for their own gain. Oftentimes, personalized charismatics
    prey upon potentially vulnerable followers, who lack self-confidence or a strong
    self-concept, as was the case with'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Jim Jones.[7] Perhaps no leader in the organizational world is purely socialized,
    or purely personalized. But the hope is that leaders who show charismatic qualities
    and behavior will do so largely for socialized, rather than personalized, purposes.


    # Transformational Leadership


    Transformational leadership has elements that overlap with charisma in that they
    both result in inspiration on the part of followers. Bernard Bass is largely credited
    with first applying the concept of transformational leadership to organizations.[8]
    Subsequently, researchers have found that transformational leadership is highly
    associated with performance in organizations.[9] We focus here on what we call
    the “Three I’s” of transformational leadership, which include: (1) inspirational
    motivation, (2) individualized consideration, and (3) intellectual stimulation.[10]


    inspiration

    Articulating a compelling vision of the future, having a strong sense of purpose,
    showing enthusiasm and optimism, and building trust.


    **Inspiration** is at the core of what transformational leadership is all about.
    Through inspirational motivation, leaders articulate a compelling vision of the
    future and have a strong sense of purpose. They are enthusiastic and optimistic
    about the future and the pursuit of goals. Further, they attempt to inspire collectively
    by rallying people around their vision and purpose. Indeed, the leader inspires
    by seeming to put the interests of the group ahead of his or her own self-interests.
    Jeff Immelt, the former CEO of General Electric, describes the need for the inspirational
    component of transformational leadership by saying, “People want to be a part
    of something that lasts.”[11] Paul Polman, the Dutch CEO of Unilever, said “People
    want to make a bigger difference in life than just growing market share or improving
    products.”[12] Both of these leaders attempted to appeal to people’s desire to
    contribute to the larger society. As such, the transformational leader is more
    socialized, rather than personalized, in his or her need for power. A key element
    of inspiration is trust. People tend to be inspired by a leader who they trust
    to have their best interests in mind.


    individualized consideration

    Treating each follower as an individual, rather than just a member of the group.


    In Chapter 2, we considered various leader styles, including being relations-oriented
    and considerate. A considerate leader shows friendliness towards followers and
    is supportive. However, consideration alone does not in and of itself imply that
    the leader is treating followers as unique individuals. **Individualized consideration**
    goes beyond such a style in that the leader treats each follower as an individual,
    rather than just a member of the group. A leader can practice individualized consideration
    by getting to know each member, starting with his or her name, interests, and
    developmental needs and aspirations. A leader who effectively coaches followers
    in the manner described in Chapter 7 is likely to show individualized consideration.
    Sometimes, by showing “tough love” in the coaching process, the leader is demonstrating
    this form of leadership, as long as it is apparent to the follower that the leader
    is doing so out of concern for the follower’s development and individual needs.
    As is the case with inspiration, individualized consideration on the part of the
    leader goes a long way to help build trust on the part of followers.


    intellectual stimulation

    Helping followers to think about problems and issues in new ways.


    **Intellectual stimulation** is the third “I” of the three I’s of transformational
    leadership. Whereas inspirational motivation and individualized consideration
    are more oriented toward emotional aspects of leading, intellectual stimulation
    is more cognitive. That is, it involves helping followers to think about problems
    and issues in new ways. The intellectually stimulating leader questions assumptions,
    and is constantly on the lookout for the problem of groupthink that was mentioned
    in Chapter 8.


    The bottom line of transformational leadership is that it is oriented largely
    toward change. Since at its core, leadership is largely about change, it is no
    wonder that transformational leaders epitomize what leadership is all about. Inspirational
    motivation stresses the value of change through a compelling vision. Individualized
    consideration attempts to help followers change and develop themselves individually.
    Intellectual stimulation deals with changing thought processes and the way that
    followers go about solving problems. We will continue with the change theme in
    Chapter 13, where it will be evident that to accomplish change, organizations
    need transformational leaders.'

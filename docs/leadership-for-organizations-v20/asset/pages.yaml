    \ for change leaders is to understand whose cooperation is critical and who the\
    \ key players are who can derail the effort. Once identified, the challenge for\
    \ the change leader is to identify the key actors who can be enlisted to support\
    \ the change, but to also identify those who might slow down or block the change\

    # 11.4 Effective Leader Vision


    Like goals, vision represents a future-oriented articulation on the part of leaders.
    However, goals tend to be very tangible and short-term (e.g., monetary goals like
    profits or market share), while vision is less tangible and oriented toward a
    long timeframe. Accordingly, a basic feature of visionary leadership is that it
    is oriented toward the future. How do you stack up in terms of having a future
    orientation? To help answer this question, try taking the survey that is in Section
    6.


    As a classic example of leader vision, in 1961, President John Kennedy went in
    front of Congress and then made speeches to the public about how he envisioned
    the United States putting a man on the moon, and returning him back to the earth
    safely, by the end of the decade. Below, we describe five key elements of effective
    leader vision. As we consider these elements, we will refer back to President
    Kennedy''s vision.


    +   1. Long-term and bold. In their book, Built To Last: Successful Habits of
    Visionary Companies, Collins and Porras coined the acronym **BHAG**, which stands
    for “big hairy audacious goal.”[18] A BHAG largely characterizes what vision is
    all about. It is both long-term and bold. If President Kennedy had proclaimed
    that the United States should put a man in space and return him to earth, it would
    have been neither long-term nor bold, since at the time, the country was on the
    cusp of already doing so. But the idea of putting a man on the moon was a bold
    and daring stretch.


    +   2. Change-oriented. A vision does not involve relatively incremental tweaks
    to the status quo. Instead, it is highly change oriented, and can even be described
    as radical in nature. Moreover, in order to justify radical change, visionary
    leaders point toward important environmental changes and threats. For example,
    as a justification for his vision, President Kennedy pointed toward threats from
    the Soviet Union, and what was termed the “space race” at the time.


    +   3. Reflects high ideals and values, provides meaning, and energizes. Similar
    to the core purpose or mission statements that we see on the right side of Table
    11.1, vision is all about high ideals and values. The pursuit of these ideals
    and values, in turn, provides meaning to people, energizes them emotionally, and
    brings them together as a collective. In the case of President Kennedy''s vision,
    values such as innovation and exploration, which were already deep within the
    American psyche, were brought to bear. As a result, people across the United States
    felt energized and excited to make the vision become a reality.


    BHAG Big hairy audacious goal; oftentimes used to characterize what vision is
    all about because it is both long-term and bold.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '4. Possible to attain and within a latitude of acceptance. There can be a fine
    line between vision and insanity. Vision extends one''s perspective in ways that
    can seem far-fetched and risky. But if the vision goes too far, it can seem ridiculous
    and not worth considering. If President Kennedy had said that by the end of the
    1960s, the United States should commit itself to putting a man on Mars, and returning
    him safely to earth, people would have thought that he was either joking or had
    lost his mind. In short, while a vision stretches people''s imaginations, it is
    nevertheless viewed as possible, and thus acceptable. Interestingly, leaders such
    as Elon Musk in more recent times are espousing a vision that includes the colonization
    of Mars, and potentially returning Mars visitors safely back to earth.[19] Such
    vision, though still bold, is now seen as possible to attain and within a latitude
    of acceptance.


    5. Shared widely, but pieced out individually. The idea of a vision being “shared”
    is a two-way street. That is, it is not only important for a leader to share or
    communicate a vision widely among followers, but it is also important that followers
    take the vision to heart, so to speak, and share it. In other words, if a vision
    is to ultimately be implemented, a wide swath of followers need to be emotionally
    committed to that vision. One way to make sure of such commitment is to not make
    it “the leader’s vision” per se. In other words, it is desirable for followers
    to co-create vision along with the leader, or at least have a voice in terms of
    how the vision is shaped. For example, a leader might “float” a new vision. Followers
    then work with the leader to hone or modify that vision. In addition, to realize
    shared vision, it is important that followers, or groups of followers, understand
    how the vision applies to their own work or their organizational units. In the
    case of President Kennedy’s vision, various units of NASA, the military (e.g.,
    the U.S. Navy), and private organizations (e.g., contractors for NASA) each had
    their own parts to play to ensure the realization of the vision.


    The previous elements outline the nature of effective leader vision. However,
    it is not just the words that matter, but also how the leader behaves in relation
    to the words. Visionary leaders communicate enthusiastically with both passion
    and energy. Moreover, they serve as role models for their visions. For example,
    consider a leader who introduces a new vision that includes greatly improved attention
    to customers and their needs. Followers will need to see actions or signals, as
    reflected in the leader’s own behavior, that attending to customers has truly
    taken on more significance, perhaps even at the expense of other, more short-term

    which we also mentioned in Chapter 2. Examples of this paradox in action:


    +   - maintaining overall control of situations, while at the same time offering
    autonomy to followers;

    +   - stressing conformity in how work should be done, while allowing for exceptions;
    being clear with followers in terms of how things should be done, but at the same
    time, not being picky or micro-managing;

    +   - placing high requirements on followers, but also allowing them to make mistakes
    at the same time; and

    +   - in an overall sense, realizing that the best way to maintain control is
    to let go of control.


    If leaders can simultaneously deal with these seemingly contrasting actions, they
    are effectively handling the paradox of control, and they are demonstrating servant
    leadership. Southwest Airlines provides an example of both. Like most organizations,
    Southwest Airlines has a traditional pyramidal structure in place that includes
    employees, lower-level managers, and higher-level managers. Thus, in a formal
    sense, like other organizations, lower-level employees report to higher-level
    managers. But simultaneously, it has a servant leadership culture. As an example
    of how the paradox plays out at this firm, while high customer service requirements
    are stressed by managers, followers are allowed leeway in exactly how customers
    are served. Further, mistakes are tolerated, as long as employees are attempting
    to serve customers’ needs. In the true sense of this paradox, management is able
    to gain control by giving up control.


    # Responsible Leadership Orientation


    Especially at higher levels of leadership, executives increasingly deal with issues
    pertaining to corporate social responsibility (CSR). CSR essentially involves
    actions on the part of the firm that appear to advance, or acquiesce in the promotion
    of some social good, beyond the immediate fiduciary interests of the firm and
    its shareholders, and beyond that which is required by law. Such actions may result
    in a company embodying socially responsible attributes in their products or services
    (e.g., the use of organic ingredients, lack of testing of products on animals,
    and products or services that are safe).hs It should also be noted that “social
    good” can pertain to a range of possible stakeholders, including employees, suppliers,
    and community groups (e.g., charities). The choices regarding policies and actions
    pertaining to CSR, including the extent and manner in which vari-'

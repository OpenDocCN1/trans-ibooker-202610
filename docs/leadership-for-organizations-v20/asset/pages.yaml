    representatives, and so forth. However, in other contexts, bribery would be considered
    both illegal and immoral. As another example, the use of alcohol, especially in
    the context of doing business, can vary. In some Western contexts, some minimal
    or ‘social’ use of alcohol might be deemed appropriate in the course of doing
    business. But in some Eastern cultural contexts, more excessive uses of alcohol
    are commonplace. We will consider the implications of cross-cultural contexts
    on leadership in more detail in Chapter 10.



  md: '# 8.3 Shared Leadership


    shared leadership

    Mutual influence and shared responsibility among team members, whereby they lead
    each other toward the team''s goals.


    Ultimately, the goal of a team leader should be to develop team members to the
    point of being able to share in the leadership role. Coach Phil Jackson captures
    this saying, “Leadership is not about forcing your will on others. It’s about
    mastering the art of letting go.”[15] Shared leadership occurs when there is mutual
    influence and shared responsibility among team members, whereby they lead each
    other toward the team’s goals.[16] But why is shared leadership so important in
    teams and organizations? The answer to this question is actually quite simple.
    The various functions of teams in terms of getting tasks done, dealing with the
    personal or emotional needs of team members, and effecting change when necessary
    oftentimes cannot be readily handled by a single leader, especially in larger
    teams. Instead, it helps to think of the overall leadership capacity of a team
    in terms of its multiple members.[17]


    Let’s take an example. Imagine a situation in which you are involved in a project
    team, and the formal leader of the team has delegated control of some important
    decision-making and implementation of decisions to team members. You have a peer
    on the team who for whatever reason seems unmotivated. However, this individual,
    and her cooperation is imperative if the project is to be successful. In this
    instance, it is essential that you or other team members attempt to show leadership
    influence for the purpose of motivating the individual, rather than waiting for
    the formal leader to act.


    This particular example is reflective of a situation that many team members find
    themselves in these days as organizations increasingly structure in terms of semi-autonomous
    teams. In such instances, teams are largely autonomous in terms of control from
    formal leaders. Instead, team members organize and lead themselves.[18] While
    semi-autonomous teams can increase member motivation and psychological well-being,
    they also necessitate that members share in the leadership function.


    Throughout this book, we have stressed that an important part of the leadership
    function for formal leaders is to develop followers not only in terms of their
    technical abilities, but also with regard to their ability to make decisions,
    solve problems on their own, and assume increasing responsibility. For example,
    in Chapter 5, we stressed how the developmental model of decision-making put forth
    by Vroom and Jago can be used in an attempt to develop followers’ problem-solving
    and decision-making skills.[19] The overall goal for the formal leader should
    be to enable successful delegation of decision-making to followers. Reed Hastings,
    the founder and CEO of Netflix has said, “I take pride in making as few decisions
    as possible.”[20] In his view, great leaders get great performance by orchestrating
    the appropriate context (i.e., selecting the right people, leading-by-example,
    and reinforcing the right behavior), rather than trying to control all decision-making.
    But beyond decision-making, the goal should also be to delegate other aspects
    of the leadership role, including the motivation of fellow team members. We are
    not suggesting that formal leaders practice laissez-faire, which implies being
    absent when they are needed or not getting involved when important issues arise
    for which the team could use assistance.[21] But nevertheless, if followers can
    be developed to assume more of the leadership role, teams and organizations will
    be in a better position to achieve effectiveness.'

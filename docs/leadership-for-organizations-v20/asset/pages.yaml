- pgno: 59
  md: '# Andrew Brandt—Dealing With a Star


    Andrew Brandt, a business manager for the Green Bay Packers, discusses issues
    in dealing with a player who has problems forming positive relationships with
    him and other managers with the Packers, as well as fellow teammates.


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_59_0.png)


    View in the online reader


    # Conclusion


    In this chapter, we have considered the importance of relationship building and
    maintenance for leaders. Effective leaders need to demonstrate consistently strong
    relationships with followers through leader-member exchange processes. But moreover,
    they also need to demonstrate favorable relationships with people who are not
    direct reports. They do so through their political savvy.


    One thing that should be clear in this chapter is that as mentioned above, “it
    takes two to tango.” The role of followers in leadership processes is often forgotten
    or underestimated. However, in Chapter 4, the role of followers will come to the
    forefront.


    # 3.3 Discussion Questions


    +   1. Why do some followers tend to gravitate over time to a leader''s in-group,
    while others gravitate to a leader''s out-group?

    +   2. How will a leader likely treat in-group members differently from out-group
    members in terms of the type of leader behavior described in Chapter 2?

    +   3. Why might out-group members be a problem for a leader? How is the old saying,
    “it takes two to tango,” relevant to in-group vs. out-group formation?

    +   4. There is also an old saying that “one bad apple can spoil the whole bunch.”
    How is this saying relevant to out-group formation and its implications for an
    overall team?

    +   5. What, if anything, can be done to prevent or remedy out-group formation?
    Consider the leader, followers, and greater organizational context in which leaders
    and followers find themselves (such as HR policies and procedures).

    +   6. Explain why political savvy might be important to you as a leader, or as
    just an effective employee of an organization. Is political savvy all about “sucking
    up,” or is there more to it?'

  md: '# # 13.5 Appendix: Twenty Years of Leadership and Organizational Change—The
    Case of Michael Crow and Arizona State University


    # ## Introduction


    On July 1, 2002, Michael Crow succeeded Lattie Coor as President of Arizona State
    University (ASU). He arrived from Columbia University where he had served as Executive
    Vice-Provost from 1998–2002. Upon his arrival, President Crow reported in speeches
    to internal and external audiences that ASU was a good “regional” university.
    However, it had not received a high level of national or international prominence
    in terms of being considered a “world-class” university. Various metrics were
    cited in Crow’s speeches including university rankings, level of endowment, and
    level of sponsored research funding.


    At the same time, Crow’s early vision pointed toward the necessity of having a
    world-class university in Phoenix if the city was to be considered world-class
    in its own right as it develops in the twenty-first century. From economic, sociologic,
    and political viewpoints, he made a strong case that it is not really feasible
    for a city to achieve world-class status without the development of a world-class
    university within its geographical proximity. To a large extent, this basic principle
    provided the foundation for his broader vision of ASU.[13]


    # ## The Institutional Context of Universities


    The change effort in which Crow and ASU have engaged over the past 20 years is
    taking place in a larger society, and more specifically, an institutional context
    involving universities. That context has existed largely unchanged for over 200
    years. Traditional elements of this context that includes ASU and other universities
    are as follows:


    +   - Students in traditional classroom environment at a designated location;
    in other words, not distributed either geographically or virtually (e.g., through
    online education)

    +   - Basic (rather than applied or community-oriented) research emphasis

    +   - Support for research provided solely by national agencies and foundations
    (e.g., National Institute of Health, National Science Foundation, and so forth)

    +   - Specialized research efforts in disciplinary areas (e.g., chemistry, physics,
    engineering), as opposed to interdisciplinary efforts (e.g., engineering combined
    with management; sustainability, and so forth)

    +   - Large percentage of public university budgets based on state legislature
    support


    In many ways, the above elements form the genetic code for the traditional university.
    However, there are new trends and forces for change in the environments of universities
    that threaten to render aspects of this code as obsolete. Examples include:


    +   - Demand on the part of students for the university to, in essence, go where
    they are (e.g., online education and locating the university at multiple sites,
    including international locations), rather than simply existing in the confines
    of a particular geographic location or physical classroom.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '+   - More applied and interdisciplinary teaching and research efforts

    +   - Support for research provided by sources (e.g., business corporations; municipalities)
    in addition to national agencies and foundations

    +   - Dramatically less state funding for public universities as a percentage
    of their overall budgets (e.g., ASU has gone from around 40 percent at the beginning
    of Crow''s tenure to around 10 percent in 2017)[14]


    In short, in recent times, the institutional context of universities has been
    ripe for change—or at least the perceived need for change. At the same time, the
    actual institutions and many of their constituents may show resistance. It is
    into this environment that Michael Crow ventured.


    # The New Vision


    A few years into Crow''s tenure as ASU president, there was a groundbreaking for
    a new building to house the Cronkite School of Journalism at the growing downtown
    Phoenix campus of ASU. At that event, the legendary news commentator, Walter Cronkite,
    described Crow as “a true visionary of our time. He entered the Phoenix metropolitan
    area, took the reins of the university, and gave it direction and energy beyond
    what anyone could have imagined.”[15] His vision has been dubbed “the new American
    university for the 21st century.” So what is it about this vision that was new?


    The summarized vision and goals that Crow established for ASU over his first ten
    years can be found in Exhibit 1 at the end of this case.[16] A number of key elements,
    ideas, and principles are at the core of the vision. These elements and examples
    of how they have been implemented thus far are shown in Exhibit 2 at the end of
    this case. Exhibit 2 also shows challenges and even failures to achieve the vision.
    First, Crow has taken an interdisciplinary approach to research efforts. A key
    example is the $150 million Biodesign Institute that integrates researchers and
    projects from a number of functional areas such as physics, engineering, and microbiology.
    Other examples include the Global Institute of Sustainability and the School of
    Earth and Space Exploration. Second, Crow envisioned, and has sought to instill,
    an institutional culture of entrepreneurial enterprise. Specifically, he has attempted
    to speed up decision-making processes oriented toward change, as well as the actual
    implementation of those decisions. Third, Crow has emphasized a vision of “one
    university in many places.” Some examples of the unification include:


    +   - One accreditation for all campuses, as opposed to separate accreditations
    for respective campuses prior to his arrival

    +   - Integrated evaluation and promotion processes for faculty members across
    campuses

    +   - The evolution of unified faculty and student governing entities (e.g., one
    faculty senate) across campuses

    +   - Elimination of campus Provost positions at the separate ASU campuses

    +   - Combining of previously independent, but overlapping colleges (e.g., separate
    business schools on West and Tempe campuses)


    Furthermore, Crow has emphasized a non-tiering (i.e., no status differences) of
    colleges/schools and campuses. Prior to his arrival, the norms, culture, and accreditation
    standards across campuses suggested a form of tiering, whereby the Tempe campus
    was at the top of the pyramid, while other campuses were somewhat lower in the
    hierarchy—in other words, what might be termed “satellite” campuses. Indeed, a
    longstanding tradition of the university was to refer to Tempe as the “Main” campus.
    At least on paper, that designation and terminology has disappeared. In short,
    the current approach at integration would, at least on the surface, attempt to
    minimize such tiering or status differences.


    Fourth, Crow''s speeches and written messages to the university and community
    have emphasized inclusiveness, rather than exclusiveness. He cites examples of
    universities that gauge their effectiveness in terms of the numbers and types
    of students that they are able to exclude (i.e., not admit). Instead, Crow stresses
    the importance of including and retaining a wide and diverse range'

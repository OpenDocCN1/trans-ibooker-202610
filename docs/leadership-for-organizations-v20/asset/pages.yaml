  md: '# FIGURE 12.1 An Iceberg Model of Communication


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_190_0.png)


    Norms are clearly a key aspect of organizational culture. Depending on the company,
    these norms may include important things like how we:


    +   - deal with each other

    +   - deal with customers

    +   - handle disagreements

    +   - show concern for getting things right (e.g., pay attention to detail)

    +   - try to do new things or innovate

    +   - treat other people


    They may also tell us other, more tangible things such as:


    +   - how to dress

    +   - how formal or informal we are with each other (e.g., use of titles vs. first
    names)

    +   - what the physical layout of the organization looks like (e.g., private offices
    vs. cubicles)

    +   - what types of terminology we use (e.g., very formal vs. more colloquial
    or pop culture terms)


    For instance, in some organizations, people are expected to be polite and never
    challenge the boss. If someone does so, we may observe others warning that person,
    “This isn’t how we do things around here.” If the individual continues to speak
    out and disagree, that person may even be sanctioned or asked to leave. In other
    organizations, like Intel (a large semiconductor firm) or McKinsey (a major consulting

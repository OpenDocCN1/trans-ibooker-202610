  md: '# # Inspirational and Visionary Leadership


    > "How do you inspire people to achieve more than they expect they can achieve?"—Nelson
    Mandela (played by Morgan Freeman) to François Pienaar (played by Matt Damon)
    in the movie Invictus


    > "Leadership has less to do with position than it does with disposition."—John
    Maxwell, Senior Pastor, Skyline Wesleyan Church


    > "The most common way that people give up their power is by thinking that they
    don''t have any."—Alice Walker, American Novelist and Pulitzer Prize winner


    > "Without vision, the people perish."—the Bible


    # ## Learning Objectives


    +   1. Describe how leaders can have different bases of power, and how their power
    affects the manner in which leaders influence others.

    +   2. Summarize what charismatic and transformational leadership are all about,
    and how they pertain to inspiration.

    +   3. Explain how organizational missions can vary in ways that are more or less
    inspiring and sustainable.

    +   4. Identify the elements of effective leader vision.

    +   5. Diagram how leader values, inspiring/visionary leadership, and likely firm
    outcomes go together.


    In many ways, the essence of leadership is to be able to inspire. When one inspires
    another individual, that person influences in a special way. The influence is
    not born out of fear, coercion, one''s position, or monetary exchange. Instead,
    it occurs for positive and oftentimes very intangible reasons. Have you ever really
    felt inspired by another individual? If so, what was it about that person that
    seemed to inspire you, and what actions or behaviors on your part resulted from
    the inspiration?'

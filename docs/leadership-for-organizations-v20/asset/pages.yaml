- pgno: 202
  md: '# FIGURE 12.3 How Culture is Led


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_202_0.png)


    Second, Dalio and his team constantly communicate to others what is important
    and how they are expected to behave. We know from research that people are likely
    to believe a message when it is communicated again and again. When strategic leaders
    constantly reinforce the signal that certain values and actions are important,
    we begin to understand that they are serious. Jack Welch, a famous former CEO
    of General Electric used to say that if leaders were going to be effective at
    managing culture, they had to do two things: (1) be relentless in sending the
    same message, and (2) be repetitive—that is, repeat the same message again and
    again.


    If a strategic leader is relentless in signaling what the culture is all about,
    and if employees can see others being rewarded (or punished) for behaving appropriately,
    then norms will emerge that tell newcomers that certain behaviors and attitudes
    are expected. Over time, these norms become embedded. For example, at Bridgewater,
    employees use iPads to constantly evaluate each other and their supervisors. These
    evaluations are fed into an employee''s permanent record and made public and reviewed.
    Designated managers who are known as “captains” constantly monitor the culture
    to ensure compliance with the principles. Dalio acknowledges that his culture
    is not for everyone, but he believes that it is core to the success of the company.


    What Bridgewater and other strong culture companies have in common is that their
    strategic leaders are very clear in communicating what attitudes and behavior
    are needed to fit in and be successful. What they have also done is to ensure
    that the HR systems in the organization are aligned, including the types of people
    who they seek to hire, how they recruit, how new employees are trained and developed,
    what behaviors are rewarded, and the types of people who are promoted. The combination
    of clear leader signaling and aligned HR systems results in clarity about the
    expected behaviors.'

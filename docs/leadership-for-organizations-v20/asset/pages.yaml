  md: '# # Servant Leadership


    # ## servant leadership


    A way for a leader to show responsibility toward others (especially followers)
    by assuming the role of servant, specifically by mentoring, providing necessary
    tools and information, helping to develop others, and looking out for their welfare.


    One way for a leader to show responsibility toward others, and certainly to lead
    with love, is for that leader to assume the role of servant. **Servant leadership**
    can most clearly be seen in the relationship between leaders and followers. It
    provides a mechanism for a leader to show responsibility toward others. In the
    specific case of followers, this means mentoring, providing necessary tools and
    information, helping to develop followers, and looking out for their welfare.[14]


    As stated by Mary Kay Ash, founder of Mary Kay Cosmetics, “make people who work
    for you feel important. If you honor and serve them, they’ll honor and serve you.”
    When assuming this role, a leader will help followers to grow and develop, and
    take care of problems (work-related, and perhaps even personal) that followers
    might not otherwise be able to handle. Figure 6.1 shows how servant leadership
    compares to a traditional, top-down structure. At the top of Figure 6.1, we can
    see a traditional, pyramidal top-down organization. Autocratic leadership is the
    primary mode of leading that is likely to be associated with such a structure.
    Lip service may be paid to customers or clients, but in many such organizations,
    it may seem like clients/customers are really at the bottom of the hierarchy.
    In contrast, the bottom portion of the figure shows how this structure can be
    turned upside-down in terms of an inverted pyramid whereby employees and clients/customers
    are at the top of the pyramid.


    # **FIGURE 6.1 Traditional and Inverted Pyramidal Structures**


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_101_0.png)


    Is servant leadership just “pie in the sky,” so to speak, or can it be actually
    implemented in organizations? Skeptics might point to reasons for servant leadership
    not really being realistic, given short-term productivity or business demands,

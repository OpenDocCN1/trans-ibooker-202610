- pgno: 144
  md: '# Lack of an Inclusive Mindset


    We all have different orientations toward diversity, which can ultimately affect
    how we attempt to lead others who have different backgrounds (i.e., different
    in terms of ethnicity, age, sex, and so forth). We suggest that before proceeding
    further, you go to Section 4 and complete the Inclusive Mindset Scale. As you
    will see, there are three dimensions associated with having an inclusive mindset;
    (1) curiosity regarding others from diverse backgrounds, (2) engaging people from
    diverse backgrounds, and (3) courage and commitment to diversity.


    As shown in Table 9.1, the three dimensions of an inclusive mindset largely boil
    down to three levels of inclusiveness and associated behaviors with each level.[10]
    At the lowest level, a leader would tend to minimize differences. The leader would
    not really be curious about how people from different backgrounds could think,
    perceive, or act in different ways, and instead simply tends to avoid people who
    are different, while surrounding himself with those who are similar. At a more
    moderate level of inclusiveness, the leader has some degree of acceptance of others
    who are different, but does not really embrace the value of diversity or show
    much curiosity regarding different ways of thinking, perceiving, and acting that
    might be based on diversity. Finally, at the highest level of inclusivity, the
    leader proactively takes an interest in those with different backgrounds, and
    attempts to engage in interpersonal interactions with them. Perhaps most importantly,
    a proactive orientation toward diversity suggests that the leader would monitor
    and attempt to rectify situations in which he encounters attitudes or behavior
    that would run counter to the valuing of diversity.


    | Level of Inclusiveness | Indicative Behaviors |

    |---|---|

    | Proactive Inclusion | —Takes an active and respectful interest in people from
    diverse backgrounds<br>—Actively attempts to engage in interpersonal interactions
    with people who come from backgrounds different from their own<br>—Clearly monitors
    and confronts attitudes or behaviors that run counter to the valuing of diversity
    |

    | Moderate Acceptance | —Shows a moderate degree of curiosity about people from
    different backgrounds<br>—Shows some acceptance of people from diverse backgrounds,
    but does not go out of one''s way to embrace or engage with them<br>—Tends to
    stay silent when non-inclusiveness is observed, or diversity is undervalued |

    | Minimization of Differences | —Shows little curiosity regarding learning about
    people from different backgrounds<br>—Trivializes the importance of cultural or
    ethnic differences, at least in terms of potential effects of diversity on work
    settings<br>—Tends to only associate with other people who are like that person
    in terms of ethnic background, age group, gender, and so forth |


    Why should an inclusive orientation or mindset matter for an individual who is
    attempting to lead in an increasingly diverse environment? Let’s take an example
    that is likely to occur quite often. Perhaps a work team has been traditionally
    composed of middle-aged men. Because of retirement or some other reason for turnover,
    a member of the team departs the organization, and is replaced by a young woman.
    This individual is substantially different from others in the team not only in
    age, but also in terms of gender.[12] At a team meeting, one established member
    even jokes about the new member, “you know, you remind me of my daughter ...”
    Or even worse, an established member might make a sexually harassing comment such
    as, “I hope that you always wear'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'such sexy dresses to work . . .” Then as the meeting progresses, and the team
    is attempting to solve various issues that it faces, the new team member attempts
    to speak up and provide input at times. But her input is repeatedly greeted with
    a lack of eye contact and various team members cutting her off before she can
    finish communicating her thoughts.


    There can be a number of reasons for such team dynamics. One key explanation is
    stereotyping, which occurs when an individual holds rigid and often negative beliefs
    directed toward a group of people. In the above example, the middle-aged male
    team members may largely stereotype the young woman as naive, or just another
    “millennial.” Moreover, the usurping of power may be at play, whereby the older
    men are attempting to put the new member “in her place.” The upshot is that her
    input is dismissed or ignored, and she is not given the same respect that is afforded
    to other team members.


    Regardless of the reason, team dynamics of this nature reflect the subtle (or
    even not so subtle), but unfair and even counterproductive, power differences
    that can accompany diversity. If such dynamics were to continue, a host of negative
    outcomes could occur. For example, there could be frustration on the part of the
    new team member, to the point where she essentially “shuts down” during team meetings.
    In terms of productivity and innovation, the new team member may be able to view
    the team’s problems from a different vantage or framework. If she is effectively
    shut down, the team will not be able to take advantage of her potentially helpful
    or new ideas. Further, the new member may begin to withdraw or become the type
    of alienated follower that we considered in Chapter 4.


    In the above example, a leader who minimizes differences in individuals’ backgrounds
    may not even perceive these team dynamics. That is, the leader will not be attuned
    to the possibility that the new addition to the team is being talked over and
    even potentially disrespected (e.g., “you remind me of my daughter . . .”). On
    the other hand, a leader with a proactive orientation toward inclusiveness would
    be sensitive to the display of such subtle power differences. This person would
    lead-by-example by identifying these displays when they occur, attempting to reduce
    any such behavior in the team, and taking a personal interest in the views of
    the female group member. Overall, he would attempt to instill the norm or value
    in the team that despite differences in gender or backgrounds, all team members
    and their ideas are to be respected.


    # Maximizing the Benefits of Diversity, While Reducing its Potential Downside


    It is clear from prior research that diversity provides benefits to teams and
    an organization as a whole.[13] Specifically, diversity makes for a more in-depth
    basis for problem-solving and decision-making. This occurs because of how diversity
    is associated with a broader base of perspectives and experiences. In addition,
    diversity tends to minimize the risk of groupthink occurring, which we considered
    in Chapter 8.


    At the same time, the effective leader of diversity will recognize that there
    is at least a potential downside to diversity, which should be avoided or minimized.
    Diversity can add stress and more potential for destructive conflict in a team.
    When people from different backgrounds come together, there is more potential
    for misunderstandings, stereotyping, and distrust. To use a term from Chapter
    8 and team development, the likelihood of remaining or reverting back to the storming
    stage gets enhanced. Accordingly, the obvious challenge for the leader is to simultaneously
    maximize the benefits that diversity yields, while minimizing its potential downside
    effects.


    A good first step is for the leader to have an inclusive mindset as described
    above. Such a leader will not only look for how diversity can provide value, but
    that leader will also be in tune to how problems with diversity can form, yet
    be alleviated. By having an inclusive mindset, the example that the leader relays
    the message to other team members that inappropriate actions toward a'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'female or ethnic group member, whether intentional or more subtle, are not
    to be tolerated. At the same time, the inclusive leader will be sensitive toward
    other group members (e.g., white men) who may believe that reverse discrimination
    could be at play. It is the job of the leader to assure these majority group members
    that favorable or supportive actions toward those in the minority are not due
    to reverse discrimination, but rather due to the merit of these minority group
    members.


    On the other hand, leaders in organizations have to understand that in most situations,
    they are leading a range of individuals, not just women or minoritized group members.
    Accordingly, leaders must be sensitive to issues such as reverse discrimination
    and how fairness can be interpreted in different ways among diverse individuals
    who are being led. Societal events in the United States in the summer of 2020
    brought to light ongoing issues pertaining to the treatment of minoritized people,
    especially those who are Black, in society. Resulting efforts to bring about positive
    change in both society and organizations are laudable. However, those efforts
    could backfire in organizations if used as an excuse to “shame” or in some way
    discriminate in a reverse manner toward majority group members. Policies and leader
    efforts along such lines would only serve to damage the development of a team
    orientation and building of the type of cultural homogeneity or unity discussed
    next.


    # Paradox: Building Unity, While Allowing for Diversity


    As emphasized repeatedly in this book, effective leadership is largely about dealing
    with paradoxes. When it comes to leading diversity, a key paradox is balancing
    the leader’s desire to create a unified team culture and sense of purpose with
    the desire to embrace diversity. Leaders strive to get their followers on the
    same page (i.e., unity) when it comes to things like values and norms. For example,
    customer support and service may be a key value for a lot of leaders, and they
    attempt to make it an integral part of the culture for all team members. In other
    words, they try to build a strong, unified culture in the teams or organizations
    that they lead because of the cohesiveness and sense of purpose that follows.[44]
    On the other hand, in the spirit of embracing diversity, leaders also want to
    allow for individual differences between employees based on their backgrounds,
    personalities, styles, and sex.


    Thus, the way to reconcile this paradox is to recognize potential problems with
    inclusiveness (e.g., both overt or unintentional discriminatory practices), while
    simultaneously treating everyone fairly (minoritized and non-minoritized members
    alike). Furthermore, leaders should set the goal or overarching values of the
    team, while simultaneously allowing employees some leeway to uniquely pursue those
    goals or values. For example, again consider the value/goal of customer service
    and support, which has been a theme of Southwest Airlines since its inception.
    Southwest allows employees to pursue customer service and support in their own
    unique ways. Some employees may use humor in an attempt to brighten the flying
    experience of customers, while others are more reserved, but nevertheless, helpful
    to customers in solving problems or making for a satisfying flying experience.[55]
    Moreover, given the increasingly diverse customer base of many organizations,
    having diverse employees can help a firm to better understand and adjust its practices
    to satisfy customer demands.



  md: '+   - Establishing trust,

    +   - Listening to problems, and

    +   - Resolving personal or interpersonal problems.


    Leaders may also show behaviors that can be characterized as _task-oriented_,
    which includes such things as:


    +   - Work scheduling,

    +   - Directing work activities,

    +   - Maintaining efficiency, and

    +   - Enforcing rules.


    Overall, a blend of _relations-_ and _task-oriented_ behaviors is key to leader
    effectiveness. However, as we will see in Chapter 5, in certain situations _relations-oriented_
    behavior should be stressed, while in other situations, _task-oriented_ behavior
    works best.


    # # Decision-Making


    More specific than day-to-day actions and behaviors (or generalized leader behaviors),
    leaders are inherently decision-makers. In other words, a specific, important
    behavior in which leaders engage is decision-making. In Chapter 1, we defined
    leadership in terms of influence processes. As such, in attempting to understand
    effective leadership, we seek to determine styles of leader decision-making rather
    than the actual nature or basis of decisions made. As an example, a leader could
    make a decision that emphasizes shareholder or production interests, over the
    interests of customers. While the nature of such decisions has implications for
    a leader''s organization, they do not address leadership processes per se.


    Four basic styles of leader decision-making have been identified.[25] First, a
    leader may approach a decision-making process in an _autocratic_ manner, whereby
    she makes the decision alone and simply announces it to followers. Second, a leader
    may first _consult_ with followers, get their ideas and suggestions, and then
    make the decision by herself. Third, the leader could use _participation/facilitation_,
    whereby she presents the nature of the problem to followers, possible boundaries
    in which a decision or solution might be derived, and then together the leader
    and followers come to consensus as to a decision. Fourth, the leader might _delegate_,
    which involves one or more followers deriving a decision pertaining to a problem
    on their own. While the leader would play no role in the decision-making process,
    she might serve in a supporting role to provide advice, encouragement, information,
    and resources to followers in their own decision-making. We will return to these
    styles in Chapter 5 as we consider the particular contexts or situations in which
    each is most beneficial.


    # # Leading With Love


    If we assume that relations-oriented leadership is truly important, and perhaps
    traditionally undervalued by people in leadership roles, then the question becomes
    exactly how can one be more relations-oriented as a leader? One philosophy that
    has been put forth in recent times is the notion of leading with love.[26] In
    a metaphoric sort of way, **leading with love** can be likened to relations-oriented
    leadership ''on steroids'' in order to show compassion, make work fun, and reduce
    fear in the workplace. When leading with love, relations are developed with followers
    by showing deep understanding, compassion, and concern for the individual. Leading
    with love involves acknowledging the value of others and not assuming negative
    motives on their part.


    > **leading with love**

    > Relations-oriented leadership "on steroids" in order to show compassion, make
    work fun, and reduce fear in the workplace.'

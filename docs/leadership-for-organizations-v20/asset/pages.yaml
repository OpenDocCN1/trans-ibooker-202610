  md: '# 6.6 Appendix C: Mountainside Fitness (A Case Study in Entrepreneurial Leadership
    in a Pandemic)


    > "Who knew you could build a company on a small towel and a big dream?" —Tom
    Hatten, Founder and CEO of Mountainside Fitness


    Tom Hatten founded Mountainside Fitness in the Phoenix, AZ area in 1991 while
    he was still a junior at Arizona State University. In a market that was increasingly
    dominated by "corporate" gym chains (e.g., LA Fitness, Lifetime Fitness, etc.),
    Hatten’s basic idea was to make his gym friendlier and more personal for clients.
    His first gym was located in Ahwatukee, AZ. As an example of his approach to leadership
    and customer service, he showed appreciation to his members by providing free
    towels, and he would put on monthly socials at the club that included pizza, beer,
    and soft drinks. By the spring of 2020, Mountainside Fitness had grown to eighteen
    locations and over 90,000 members. Hatten recently wrote an autobiography about
    the evolution of his business, entitled *Dream On*.


    # The Pandemic of 2020


    In the middle of March 2020, the COVID-19 virus pandemic ensued around the world.
    In the United States, businesses deemed to be "essential" (e.g., grocery stores)
    were allowed by government executive orders to remain open. However, other businesses
    that were deemed to be "non-essential" were closed. Gyms and health clubs were
    among these latter businesses. This classification was controversial from the
    start, since gyms and health clubs obviously contribute to physical and mental
    health of their members, thus potentially making people less susceptible to COVID-19
    or other illnesses. Indeed, some gym owners around the country have vehemently
    protested against the closure of their businesses.


    In compliance with the executive order from Governor Ducey of Arizona, Mountainside
    Fitness shut down its operations and furloughed most of its employees for almost
    two months. Toward the middle of May 2020, the governor’s office of Arizona allowed
    gyms and health clubs to reopen, but only in accordance with social distancing
    guidelines established by the U.S. Centers for Disease Control (CDC). Mountainside
    Fitness diligently attempted to adhere to those guidelines, and it reopened its
    facilities. However, toward the end of June 2020, COVID-19 cases in Arizona appeared
    to be "spiking" in terms of numbers. It was not clear as to why the increased
    numbers were occurring although it was probably due to host of factors, such as
    increased testing to identify existing cases. Despite the increase in cases, hospital
    ICUs were not yet close to maximum capacity, the fear of which was a key reason
    originally for the shutdown of "non-essential" businesses.


    In response to the "spike" in cases, at approximately 3 pm on June 29, 2020, Governor
    Doug Ducey ordered a return to the shutdown by 8 p.m. that evening for targeted
    businesses, including gyms/health clubs, bars, movie theaters, and water parks.
    The order was to be in effect until at least July 27, 2020. Tom Hatten initially
    decided to ignore the new executive order by keeping his establishments open.
    This resulted in multiple citations of $2,500 each at his facilities, as well
    as the possibility of Hatten’s arrest.'

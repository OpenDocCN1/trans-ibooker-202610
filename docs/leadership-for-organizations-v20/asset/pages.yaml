    problems might include emotionally-based conflict and lack of clarity regarding
    goals, mission, and individuals’ responsibilities. While video conferencing is
    not a panacea for such issues, it can nevertheless help.


    Third, leaders need to remind members regarding communication ground rules for
    highly sensitive (e.g., emotionally sensitive) or complex information. Specifically,
    information of such nature should be communicated through either phone, videoconferencing,
    or the occasional opportunities of face-to-face meetings.


    Finally, perhaps more so than many other types of teams, highly dispersed, virtual
    teams often times do not have formal leaders. Accordingly, the shared leadership
    processes that we considered earlier in this chapter may be especially relevant
    and necessary. In other words, perhaps especially in virtual teams, it behooves
    all members to share in the leadership role.


    # Video Case for This Chapter


    The video case for this chapter deals with a leader who has taken over the leading
    of a struggling team. The team seems to lack initiative, motivation, and direction.
    In essence, it is a group of struggling individuals, rather than a well-functioning
    and coordinated team.


    # Bob Holden— Taking on a Struggling Team


    In this video, Bob Holden of Rent.com, takes over a team that has struggled, largely
    because of poor prior leadership. He works to develop shared vision and renewed
    energy.



  img_proc: true
- pgno: 54
  md: '# FIGURE 3.1 In-Groups Versus Out-Groups


    | | In-Group Characteristics | | Out-Group Characteristics | |

    |---|---|---|---|---|

    | | Leader | Follower | Leader | Follower |

    | | grants autonomy, responsibility, and interesting assignments | strong performance;
    assumes responsibility | assigns routine tasks and closely monitors | weak performance;
    does not assume responsibility |

    | | provides support and encouragement | has values, background, etc. similar
    to the leader | is quick to point out mistakes made by the follower | has values
    or background that differs from the leader |

    | | allows for mistakes | shows loyalty toward the leader | does not allow for
    follower input into decision-making | shows a lack of loyalty and may even undermine
    the leader |

    | | allows for follower input into decision-making | volunteers input in a constructive
    manner, rather than undermining the leader | shows little trust toward the follower
    | demonstrates a lack of trustworthiness |

    | | shows trust toward the follower | demonstrates trustworthiness | | |


    The bottom line is that an in-group relationship between a leader and follower
    is based on trust. The leader trusts that the follower will assume increasing
    responsibility with little need for close supervision. The follower trusts that
    the leader will support him/her and look out for that person''s best interests.
    While feelings of trust can potentially start to form early on in their relationship,
    in order to solidify, the leader and follower will continually seek cues from
    each other over time and observe each other''s actions.


    On the other hand, it is possible that an out-group relationship might form, and
    be based primarily on tangible exchanges. Out-groups can be characterized as the
    mirror opposite of in-groups. An out-group member is likely to be a poor performer
    or one that simply cannot or will not assume a higher level of responsibility.
    He or she often does just enough work to satisfactorily meet expectations. The
    out-group member may have a much different background (e.g., based on gender,
    age, or ethnicity) from the leader, and not share values or interests with the
    leader. One thing that can quickly and irrevocably put an individual into the
    out-group is if that individual publicly disrespects or undermines the leader.
    This can happen in many different ways. For example, a follower might show disrespect
    toward the leader in a team meeting or in their conversations with other leaders
    in the organization (e.g., the leader''s boss). As another example, the follower
    may continually try to ignore or undermine attempts at organizational change or
    new directions that the leader is attempting to pursue. If these sorts of actions
    occur on the part of a follower, there will be a lack of trust on the part of
    the leader toward the follower.


    One thing that should be made clear is that the in-group vs. out-group distinction
    regarding leader-member relationships is a pure, and perhaps sometimes artificial,
    distinction. As an alternative, three other possibilities come to mind. First,
    some followers may be in-between, i.e., neither in the in-group nor the out-group.
    These followers may be moderately valued and trusted by the leader, but not to
    the extent of in-group members. Second, it is possible that all followers are
    in the out-group. This obviously represents a toxic situation, and if it occurs,
    it is probably the result of poor leader behavior. Third, it is possible that
    all followers are in the in-group. As discussed below, this situation represents
    the ideal, and it is likely to require positive actions on the part of both the
    leader and all followers in order to be realized. Again, “it takes two to tango.”


    # The LMX “Dilemma”


    Although some degree of out-group membership is a naturally occurring phenomenon
    for leaders, in an ideal sense, it is not desirable. Out-group membership has
    the potential for much negative fallout. For example, since by definition, out-group
    members tend to be marginal performers, their presence is likely to negatively
    affect an organization''s performance. But perhaps even of equal importance, there
    is the saying that “one bad apple can spoil the entire bunch.” What this means'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'is that if out-group membership is allowed to foster and linger, it is likely
    to harm the dynamics of relationships in the overall team or organization. In
    short, out-group formation represents a dilemma for a leader.


    Let’s consider an example. An out-group member may set a dangerous precedent that
    poor behavior (e.g., marginal performance) is acceptable. Accordingly, others
    may question the fairness of having to behave or perform at a higher level, or
    to “pick up the slack.” Moreover, although LMX is all about relationships between
    leader and follower, out-group members are likely to have poor relations with
    other followers, especially those in the in-group. Again, we get back to the adage,
    “one bad apple can spoil the whole bunch.” The more that a team contains individuals
    with out-group relationships with the leader, the higher the chance of such spoilage
    occurring.


    Further, to this point, in using the terms “in-group” and “out-group”, we have
    specifically considered the nature of separate relationships between a leader
    and each follower. However, if a person has a poor relationship with his or her
    leader, that person is also likely to have poor relationships with fellow team
    members. An exception might be when all or most team members have poor relationships
    with the leader. Nevertheless, in general, when out-group relationships go beyond
    the leader to affect follower-follower relationships, there is bound to be a negative
    impact on team cohesion and morale. Subsequently, team performance will suffer.


    So the bottom line is that although out-group formation tends to be a natural
    phenomenon when it comes to relationships between a leader and individual followers,
    it is not something that should be tolerated or ignored over time. But if that’s
    the case, then what is the solution? How can out-group formation be remedied,
    or just prevented in the first place?


    Those are not easy questions to answer. And it might be very tempting to simply
    put the onus on the leader to take actions to minimize out-group membership. To
    be sure, it is indeed fitting and proper for the leader to take actions to either
    prevent or remedy out-group formation. However, recall in Chapter 1 that inevitably,
    leadership effectiveness involves a combination of three factors: the leader,
    followers, and their context.


    With that said, obviously, the leader plays an important role. To prevent out-group
    formation in the first place, the leader needs to maintain the leading with love
    philosophy that was considered in Chapter 2. With that overall philosophy, the
    leader stands the best chance of developing in-group relationships with the greatest
    percentage of followers. In addition, the leader needs to be cognizant of how
    certain followers might slip into an out-group, and how the leader him/herself
    could instigate such processes. As an example, we are aware of a faculty member
    who seemed to be in a Department Chairperson’s (i.e., the faculty member’s first-level
    supervisor) out-group. One sign is that the faculty member was never asked to
    get involved in formal, important committee work, such as being responsible for
    search activities for new faculty members. Instead, only the same, relatively
    small group of faculty members or “favorites” (i.e., in-group members) were targeted
    for important committee work. In this instance, the targeting had little, if anything,
    to do with performance of the people who were placed on committees. In short,
    it is imperative that the leader not play favorites, monitor if out-group formation
    might be occurring, attempt to understand the individual needs or styles of each
    follower, and remedy the situation if it appears that out-group formation is taking
    place.


    On the other hand, followers play an important role in the relationship-making
    process with leaders, and thus in understanding what it takes to achieve effective
    leadership. Stated another way, leaders can demonstrate in an equal or uniform
    manner the effective characteristics and behaviors that were discussed in Chapter
    2. But if particular followers do not reciprocate in kind, problems will develop
    causing those followers to sink into the leader’s out-groups. In the next chapter,
    we will go into depth regarding the nature of good followership and how to manage
    upwardly. But for now, suffice it to say that good followers, especially those
    who are able to avoid out-group membership, pay attention to the following:


    +   • Performing to the best of their ability and not shirking added responsibilities,'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - Being punctual and conscientious, and

    +   - Showing loyalty to the leader and certainly not doing anything that would
    undermine what the leader is attempting to accomplish.


    One obvious exception to the last bullet above is if the leader was engaging in
    some sort of unethical, unsafe, or clearly unproductive act, in which case the
    issue of whistleblowing would arise. We will consider such issues in more depth
    in later chapters in this book.


    Finally, there is the greater organizational context that comes into play that
    can affect the nature of leader-follower relationships or LMX. As mentioned in
    Chapter 1, leadership is not just about leaders, or even just about leaders and
    followers. The context in which they exist must always be considered if we are
    to truly understand effective leadership processes. A context can either help
    to facilitate leader-follower relationships, or it could even serve to damage
    them.


    Let''s consider a few key examples. First, many people in leadership positions
    are simply not aware of the potential occurrence of the LMX dilemma that is described
    above. Nor are they aware of what they themselves could do to potentially prevent
    such a situation from occurring, or at least remedying it after the fact. Accordingly,
    leaders should either be coached by their own supervisors, or trained to help
    deal with such problems. For example, leaders could be trained to recognize how
    their own biases and stylistic preferences could cause them to gravitate toward
    some followers (i.e., in-group members), while essentially shunning or not fully
    accepting others (i.e., out-group members). Such training could also include ideas
    for how to understand different individuals and their styles, and how to be more
    inclusive of all followers.


    Second, organizational staffing processes can help prevent the LMX dilemma. Oftentimes,
    staffing is focused on technical skills and experience, rather than taking into
    account the extent to which an individual might fit within the greater organization,
    and more specifically, a team. But when person-organization fit is properly taken
    into account, we would expect to see fewer instances of out-group membership.[4]
    What exactly does that mean? For one thing, it would mean that any individual
    who might be inserted into a team would be thoroughly vetted by the formal leader
    through interviewing and having access to selection information (e.g., reference
    checking, resumes, and so forth). But in addition, other members of the team should
    be involved in the staffing process to ensure that the new member would get along
    with the team as a whole. While LMX is specifically about the relationship between
    a leader and a follower, if there are difficulties in relations among team members,
    it could end up affecting relationships between the leader and individual followers.
    So the bottom line is that while it may be important to properly screen individual
    followers in terms of technical skills or experience, they should also be selected
    to match (or “fit”) the leader and the team.


    Southwest and WestJet Airlines represent organizations that have always stressed
    person-organization/team fit and the importance of relationships in the work setting.[5]
    For example, at time of selection into the organization, WestJet looks at personal
    qualities (e.g., sense of humor, penchant for wanting to have fun, desire to help
    others, and so forth) at least as much as they consider technical qualifications
    of candidates. In doing so, they help to ensure that everyone in the organization,
    and within teams, are on common ground in terms of key personal characteristics
    or values. As such, the chances of eventual out-group formation are minimized.


    With all of that said, we should note that there is a potential danger in too
    much stress on person-organization, or person-team, fit. With too much emphasis
    on fit, the leader and team might be prone to select new members who only look
    like them, think like them, and act like them. When this happens, we might end
    up seeing a lack of diversity, which could result in complacency, lack of change,
    and what is often referred to as groupthink. Groupthink occurs when members of
    teams become so cohesive that they refuse to even listen to divergent points of
    view, or to filter in outside information that might run counter to decision-making
    processes. It tends to happen more in homogeneous or non-diverse teams. We will
    address the topics of team and diversity leadership in more detail in Chapter
    8 and Chapter 9. For now, we simply caution that while person-organization or
    person-team fit is important in order to minimize the LMX dilemma, it can also
    be taken too far.'

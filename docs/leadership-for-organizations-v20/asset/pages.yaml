  md: 'common goals or vision. Phil Jackson is a controversial figure in the world
    of professional basketball. But most people agree that in his earlier years as
    a coach, he would find a way to deal with the prima donnas or superstars on his
    teams, and get them to work together as a team. Moreover, he would capitalize

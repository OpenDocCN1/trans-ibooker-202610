  md: '# # Conclusion


    The goal of this chapter has been to highlight the importance, and nature, of
    leading teams. Although there are some common elements regarding leading individuals
    vs. leading teams, there are also some unique aspects of team leadership. In this
    chapter, we have laid out the basic elements of team leadership, how such leadership
    occurs at various stages of team development, and the negative things that can
    happen if leadership is missing in teams. Further, we described shared leadership
    and the reason for its importance. Finally, we examined the growing relevance
    and ways of leading in a virtual environment.


    # ## 8.5 Discussion Questions


    +   1. One of the many paradoxes in leadership is the challenge of encouraging
    a team effort while simultaneously encouraging individuals to excel. Why is this
    paradox a challenge for team leaders, and how can they best deal with it? What
    are some examples, real or hypothetical?

    +   2. What is “shared” leadership, why is it so important in many teams, and
    how can it be challenging to share leadership in a team? What are some examples,
    real or hypothetical?

    +   3. How can you tell that groupthink is occurring, and why is this phenomenon
    something about which leaders should be concerned?

    +   4. What can leaders do to either prevent or alleviate groupthink when it seems
    to be occurring?

    +   5. What are some of the challenges when it comes to leading and influencing
    in a “virtual” team context? Can you think of examples that you have personally
    experienced, perhaps in student teams? If so, how did you deal with them, and
    might you have done something different if you had it to do all over again?'

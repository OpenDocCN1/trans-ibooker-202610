  md: 'decision trees clearly represent the more scientific way of understanding and
    practicing effective leadership.


    Second, would a manager really stop everything that he or she is doing in order
    to sit down and work his or her way through these models? Practically speaking,
    leaders are busy people who are sometimes on the go, or engaging in what has become
    known as “multi-tasking.” So would they actually have the time or ability to use
    the Vroom and Jago models? In our own experience, the answer is actually yes,
    especially for more important decisions for which the leader may have time to
    reflect about the best way to approach it. At a minimum, these models can serve
    as a more systematic way to check “gut-level” reactions that a leader might have
    regarding how to approach a decision-making process. Indeed, the cases in the
    Section 6 ask you to compare your “gut-level,” or first impression choice of a
    decision style, to what the Vroom/Jago models would suggest. In some instances,
    they might be the same thing. But in other instances, the models might contradict
    your “gut-level” choices. If that occurs, then it is quite possible that the models
    are picking up on something that your first impression of the case may be missing.


    # 5.4 Putting Situational Leadership in Perspective


    Situational leadership represents a practical, day-to-day tool for leaders. The
    models that we have described in this chapter help to answer the “it all depends”
    issue for leaders who struggle with how to proceed in a variety of situations
    that might involve followers. But with that said, there are three key limitations
    of situational leadership that we need to address before concluding this chapter:
    (1) the extent of leader flexibility, (2) differences in leader and follower perceptions,
    and (3) limited scope.


    Leader flexibility. It is arguable as to the extent that a leader can truly exhibit
    each of the styles that are featured in this chapter. For example, some leaders
    may simply have a natural tendency to be task-oriented or directive, while others
    feel more comfortable being supportive or participative. In other words, they
    cannot readily alter their styles to fit the needs of a given situation. The original
    proponents of the inflexible way of considering situational leadership, mentioned
    early in this chapter, stressed this issue. Overall, while potential inflexibility
    may be problematic, we believe that leaders should at least attempt to be more
    flexible in their styles, depending on the situation.


    Differences in perceptions. It should be clear that the models and approaches
    described in this chapter rely on the leader’s perceptions regarding how to proceed
    in various situations. While the models help guide the leader, in the end, it
    boils down to his or her perceptions regarding situational factors. However, followers
    might not have the same perceptions. Thus, in a particular instance, a leader
    might use one or more of the models described in this chapter and determine that
    either a directive or consultative approach should be taken. But followers might
    perceive that a facilitative, or even delegative, approach would be better for
    them. If there is a difference, who is right?


    In a way, the question is moot, since the leader will choose an approach that
    he or she thinks is the best. Nevertheless, at least to some degree, leadership
    is a granting process. That is, leaders cannot lead unless followers grant or
    accept a leader’s right to lead them.[8] To be sure, the Vroom/Jago models do
    to some extent take this granting process into account. Specifically, their models
    ask the question regarding whether followers would follow a leader’s directive
    if the leader was to make a decision on his or her own. But again, it comes back
    to the issue of perceptions. If a leader answers this question as “yes,” but in
    reality, followers would not necessarily follow a decision that was made autocratically,
    then there could be problems in terms of actually getting a decision implemented.'

    # ## 6.2 Responsible and Accountable Leadership


    As shown in Table 6.1, an important element of ethical/moral leadership involves
    serving the interests of others, rather than merely one''s own self-interests.
    In other words, EML involves being responsible to others. For organizational leaders,
    these others can include a range of people and entities, including followers,
    owners or shareholders, customers, and the greater community or society. The key
    term here is “can include.” There can be differences in how a leader determines
    the breadth and nature of the “others” to whom the leader will acknowledge and
    show responsibility.'

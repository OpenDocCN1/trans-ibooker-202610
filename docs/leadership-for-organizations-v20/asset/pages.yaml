- pgno: 134
  md: 'speak. In other words, the leader might simply avoid a festering conflict,
    such as two team members who seem to be continually arguing or undermining each
    other. However, such avoidance behavior rarely works, and the conflict might spread
    to other team members, even to the point of forming separate factions within a
    team.


    In the *norming* stage, the leader attempts to apply clarity to roles, norms,
    and values of the team. For example, the leader may help to clarify the different
    obligations and team needs that various members can help to satisfy. As a further
    example, the leader might attempt to stress the norm of showing up on time to
    meetings (i.e., either face-to-face or virtual).


    Finally, in the *performing* stage, the leader works to help build the team''s
    identity, especially if the team will be relatively ongoing over time. For example,
    team members might be encouraged to wear T-shirts to work (at least on certain
    days) displaying the team''s logo or perhaps a nickname. Perhaps even more importantly,
    when a team is in the performing stage, it is important for the leader to monitor
    the team''s environment for any changes that are occurring that could affect the
    team''s goal or mission. If changes are needed, it is important for the leader
    to introduce new ideas or vision.


    # When Leadership Is Lacking


    Figure 8.1 also shows what can happen if leadership is lacking at any of the four
    stages of team development. In the *forming* stage, a lack of leadership could
    cause confusion and a lack of common direction or norms for the team. When the
    team is *storming*, a lack of leadership could engender distrust and the type
    of negative judgments and attributions between team members that was considered
    in Chapter 7 of this book. The communication of such judgments and attributions
    can cause conflict to be highly destructive, rather than fostering the constructive
    solution of problems. For example, if a leader observes a team member accusing
    another member as being lazy or irrational, the leader can insist that such accusations
    not be part of the team discourse, and instead, emphasize dialogue whereby specific
    problematic behaviors are considered and discussed in a respectful manner. If
    roles, norms, and values are not clarified by the leader in the *norming* stage,
    there could be a lack of teamwork toward common goals, and the team might even
    drift back to the *storming* stage.


    Finally, if leadership is lacking in the *performing* stage, the team''s goals
    and mission could become outdated in relation to the needs of its environment
    (e.g., customers). It is interesting that often if a team is clearly performing
    on all cylinders, so to speak, it can be tempting for a leader to take a hands-off
    or laissez-faire approach. The leader may go into more of a managerial or administrative
    mode, but not show the type of leadership that has been described in this chapter
    and elsewhere in the book. Unfortunately, this is a key reason why so many teams
    start to engage in groupthink, which so often occurs in the performing stage,
    and is likely to inevitably damage a team''s viability.'

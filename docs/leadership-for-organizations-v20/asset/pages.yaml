    # 12.2 What Is Organizational Culture All About?


    organizational culture

    The expectations that organizational members share about how to think and act.


    Culture can be considered at different levels. For example, societies or countries
    have identifiable cultures.[8] But our focus here is on understanding and recognizing
    culture at an organizational level. Broadly speaking, **organizational culture**
    refers to the expectations that organizational members share about how to think
    and act. These expectations are determined based on shared assumptions, values,
    and beliefs that define what is important, as well as norms that define the appropriate
    attitudes and behaviors of organizational members. As such, these social expectations
    act as important guides for how members should behave when no one is watching
    or there is no one to ask for guidance. In sum, organizational culture represents
    shared values (that define what is important) and norms or shared social expectations
    that define appropriate attitudes and behaviors for organizational members.


    One helpful way to think about organizational culture has been suggested by Ed
    Schein, perhaps the most important scholar of organizational culture.[9] In line
    with an iceberg metaphor (see Figure 12.1), he suggested that we think about culture
    as occurring at three different levels: (1) basic underlying assumptions and beliefs
    about the organization that may be unconscious or taken for granted (e.g., people
    are self-interested and need to be carefully watched, versus people are inherently
    good and can be trusted), (2) norms and values that can be espoused (e.g., employees
    are our most important asset and can be trusted, versus we really do not trust
    employees), and (3) cultural artifacts like company symbols, dress, and language
    that are visible but sometimes hard to decipher. In his seminal book, Schein began
    by claiming that “the only thing of real importance that leaders do is to create
    and manage culture (p. 2).” He finishes some 300 pages later by concluding that
    “The unique and essential feature of leadership is the manipulation of culture
    (p. 317).”'
  merge: -1
  img_proc: true

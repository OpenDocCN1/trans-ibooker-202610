- pgno: 225
  md: 'his administration. For example, in a series of three articles in 2004 and
    2007,[27] this newspaper used flamboyantly-titled articles to portray what it
    believes to be Crow''s dark side as a leader in terms of instilling fear such
    that employees felt intimidated to not speak up or challenge a various changes.
    The media has also criticized Crow for attempting to make ASU operate like a business
    corporation, although Crow might argue that this was necessary because of budgetary
    demands. Some additional controversial aspects are portrayed in Section 5.


    *First*, generally when there is talk or writing about the new vision at ASU,
    it is seen as Crow''s vision, rather than a common, shared vision that he has
    tried to form with existing ASU faculty and administrators. To be fair, many people
    have bought into his vision. But for the most part, Crow''s strategy for vision
    formation and implementation has not been to try to co-create or build shared
    vision, or a guiding coalition of support, among existing personnel. Rather, he
    has brought in personnel (e.g., mid to high-level administrators) who largely
    “manage” their respective units in a top-down manner, rather than “lead” in a
    more collaborative manner (i.e., both within units and across units). For example,
    although Crow has met with existing faculty members, lower-level administrators,
    and students to share his vision, it is not as clear that their own aspirations
    for the future of ASU, or doubts regarding Crow''s vision and its implementation,
    have truly been taken into account.


    *Second,* Crow''s relationship with students has been at best, shaky over the
    years. His early push for steadily increasing tuition may have had merit, but
    it has understandably caused some friction between himself and students. As another
    example, it seems pretty apparent that Crow has been determined to get rid of
    ASU''s image as a party school. One action taken along those lines is to reduce
    the fraternity/sorority (i.e. “Greek”) presence on campus. Some students have
    argued that Crow''s statements and actions toward Greek life have fostered a somewhat
    hostile climate toward students who maintain a Greek affiliation.[28] On the other
    hand, it could be argued that some actions on the part of Greek-affiliated students
    have warranted criticism, such as racially-distasteful behaviors at a Martin Luther
    King, Jr. theme party that was held by the Tau Kappa Epsilon fraternity in January
    of 2014. As a result of those behaviors, Crow directed the university to permanently
    sever ties with that fraternity.[29]


    *Third,* Crow has shown a tendency to not share information about major, forthcoming
    changes until they actually have been planned out and formally announced to the
    media. Examples include the potential spinning off of the West campus to form
    a separate university in 2004, the Starbucks initiative, and the more recent acquisition
    of the Thunderbird School of Global Management. In each of these instances, press
    releases of the pending changes came before actual discussions with, and involvement
    of, faculty and students.


    Crow might argue that information was only provided to individuals on a “need
    to know” basis, although in line with principles from Chapter 6, some people might
    question such thinking. To be fair, a counter-argument to early disclosure of
    these initiatives could be made. Specifically, such disclosure might have only
    led to extensive rumors, inaccurate media coverage, and political maneuvering.
    But at the same time, the lack of early communication to, and involvement of,
    people who must ultimately implement change (e.g., faculty and lower-level administrators)
    can leave them with feelings of distrust or a lack of empowerment to act. In such
    a case, changes might not be implemented as efficiently or timely as might otherwise
    occur.


    *Fourth,* once a significant organizational or structural change is announced,
    Crow has shown a tendency to simply delegate the implementation to lower level
    administrators. This style has contributed to Crow being perceived as a leader
    who operates only at “30,000 feet.” While such delegation can make sense given
    the time demands of his job, it may also make sense to become personally involved
    at least to some degree in implementation efforts. This type of involvement would
    help to ensure that the implementation coincides with his vision of the university.


    The continuing pervasiveness of bureaucracy at ASU is a case in point. Deans and
    other lower-level administrators could have taken more steps over the past twenty
    years to reduce the bureaucracy, but there is little apparent effort to lower

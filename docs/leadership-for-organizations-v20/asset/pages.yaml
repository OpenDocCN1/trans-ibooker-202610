    # TABLE 5.3 Effective Leadership Style Based on Follower Readiness


    | Leadership Style | Follower Readiness Levels |

    | :--- | :--- |

    | Directive | Level 1: Lack of ability and confidence regarding problem at hand
    |

    | Consultative | Level 2: Lack of ability, but confidence, motivation, or responsibility
    to be involved in decision-making |

    | Facilitative | Level 3: Strong ability or information pertaining to the problem
    at hand, but low confidence to make a decision independently |

    | Delegative | Level 4: Very high readiness in terms of ability, confidence, and
    responsibility to address the problem at hand |


    For instance, consider the following situation that happened to a recent MBA graduate
    who was appointed the manager of a kidney dialysis clinic. Although she had several
    years of experience as a teacher and educational administrator, she had little
    experience in health care. The clinic consisted of forty staff members, including
    kidney dialysis technicians, nurses, administrative personnel, and social workers,
    all of whom had long tenure and in-depth technical skills. The problem facing
    the new manager was a complicated scheduling issue that needed to accommodate
    vacations, person time off, and unexpected absences. The manager''s first instinct
    was to use her considerable spreadsheet skills and construct the optimal schedule
    for the clinic. Doing this quickly in a *directive* mode would be both quick and
    efficient. Upon reflection, however, she realized that the staff—although they
    may have lacked her modeling skills—were willing, able and confident enough to
    come up with the schedule themselves. Although it took longer, by *delegating*
    the task and decision-making to her staff, she ended up with a schedule that the
    employees "owned." In other words, they were willing to live with the schedule
    that they had devised in a way they might not have occurred had she simply used
    her own expertise to solve the problem and make the decision.


    **fluidity**


    How different styles of leadership might be shown to the same followers in different
    decision-making situations, or even in the same situation over time.


    **Fluidity** is one thing that should be made clear about the real-world application
    of the Hersey/Blanchard approach, as well as that of Vroom/Jago which follows
    below. That is, different styles of leadership might be shown to the same followers,
    in different decision-making situations. For example, over time, followers may
    achieve a relatively high level of readiness with regard to the technical aspects
    of their own work; and hence, the leader might either be facilitative or delegative
    with these aspects. However, for broader organizational issues (e.g., unit-level
    scheduling and work standards), followers may not be so ready to assume control
    of decision-making. In those circumstances, either a directive or consultative
    approach would be optimum. Even for a given decision-making process, depending
    on how things proceed, the leader might feel the need to change course over time.
    For example, a leader may have initially determined that delegation was the way
    to go to formulate a vacation schedule for her employees. But after a few meetings
    among employees, it becomes apparent to them that they cannot reach agreement
    due to a lack of confidence, responsibility, or knowledge regarding scheduling
    parameters. If this were to occur, the leader might feel the need to backtrack
    and either use a more facilitative or consultative approach to solve the problem
    and make decisions. Of course, as will be considered later in the chapter, followers
    may not understand or appreciate fluidity in the leader''s decision-making, which
    might cause them to question or even not accept the leader''s situational approach.'

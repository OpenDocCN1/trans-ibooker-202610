- pgno: 170
  md: 'Below the dashed line, we see two bases of **soft power**: (1) expert, and
    (2) personal. They are referred to as soft power, since they do not rely on one’s
    position in an organization, and indeed, these bases of power can be applied by
    people at any level. In addition, the use of soft power results in commitment
    and a strong willingness to be influenced, rather than to simply comply. Expertise
    can come in many forms, depending on the context. For example, on athletic teams,
    both coaches and players can demonstrate their knowledge of the game, and thus
    have a strong basis of power in relation to others, such as other players. Moreover,
    players can demonstrate superior physical capabilities pertaining to their sport,
    which can help add to their ability to influence. Personal or referent power is
    a bit more nebulous, but nevertheless very important as a basis of influence.
    It involves having respect or admiration for a leader, which can occur for a variety
    of reasons; for example:


    **soft power** Expert or personal sources of power that do not rely on one’s position
    in an organization, and indeed, these bases of power can be applied by people
    at any level.


    +   - based on the individual''s accomplishments;

    +   - based on personal characteristics that others tend to see as favorable (e.g.,
    by showing humility and recognizing the efforts of others); and

    +   - by showing behaviors that others want to emulate.


    Putting all of these bases of power together, one thing to emphasize is that they
    all have their place, so to speak. Even coercion may need to be used with certain
    individuals, although it is not reflective of leadership and should only be seen
    as a short-term basis of power. Nevertheless, it should be obvious that softer
    sorts of power, specifically expertise and personal/referent, together form a
    better foundation for power and influence in the long run.


    # # Influence Tactics


    There is a clear connection between the bases of power that a person emphasizes
    and how that person will choose to influence others. The most prominent influence
    tactics for leaders are shown on the right side of Figure 11.1. The tactics that
    are above the dashed line on the right tend to go along with the bases of power
    that are above the dashed line on the left. For example, the use of punishment
    stems from a coercive basis of power, and in both instances, leadership per se
    is not being shown. But as already noted, it may be necessary for people in leadership
    positions to use punishment on occasion. Furthermore, it is possible for punishment
    to not be so retributive or threatening. For example, it can be used in a more
    corrective manner to help followers learn from their errors and mistakes.[2]


    One way to influence others that is often forgotten or not taken into account
    is to simply be clear about what you want or seek. For example, students do not
    have formal power over their professors, but they do have a form of legitimate
    power. That is, it is the professor’s responsibility to make for a good learning
    experience for the student. In our experience, when students approach professors
    for the purpose of influencing them in some manner, it may not be clear as to
    exactly what the student desires or is seeking. More clarity and directness oftentimes
    would serve the student’s cause.


    The notion of *quid pro quo* is all about transactions and being able to influence
    another’s behavior in exchange for rewards. It obviously follows from a leader
    having reward power. As such, it forms the basis of transactional forms of leadership,
    which can be quite effective at times.[8] While quid pro quo can be effective,
    it may also be somewhat limiting for a leader. That is, in many situations, a
    leader may have limited tangible items (e.g., pay increases) to use to influence
    a follower’s behavior. It thus makes sense for leaders to think about less tangible
    means of influence.


    As shown below the dashed line in the right-side box in Figure 11.1, less tangible
    means of influence are possible for leaders, and they follow from either expert
    or referent power. People with strong expertise are more adept at influencing
    through rational persuasion. They bring their expertise to play when making arguments
    to rationally persuade in a particular direction. For example, if a leader is
    attempting to persuade followers to use a new approach to deal with customers,
    she'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'could show that she has expertise regarding multiple approaches, including
    the new one for which she is attempting to argue. While expertise alone does not
    guarantee that people will “buy” an argument, it certainly can help in terms of
    persuading.


    Leaders may further appeal to vision or a higher sense of purpose. We will discuss
    what leader vision is all about later in this chapter. We will also consider what
    it means to have a higher sense of purpose, and why it can influence others.


    Finally, leaders can use their referent power to influence by making people feel
    good to be around them. This may sound quite simple, but it is actually not easy
    for a leader to achieve. People tend to feel good around a leader when they feel
    understood, accepted, valued, and not continually worried about how they might
    appear in the eyes of the leader (e.g., they feel like they can just “let their
    hair down”). When people feel good around a leader, they also respect and trust
    that person. This form of influence can be very potent for a leader.


    In sum, there are a host of influence tactics that leaders can use that stem from
    their bases of power. Although it might seem like the tactics that are below the
    dashed lines in Figure 11.1 are most desirable, the ones above the dashed line
    can be effective as well. The key for the leader is to develop a full range of
    bases of power, and then use all of these influence tactics, depending on the
    person being influenced and the situation.


    **Targets of influence.** Leaders can have multiple targets of influence. First,
    the most obvious target is immediate followers (i.e., individuals who report to
    a leader). Indeed, much of this book is oriented to a consideration of how leaders
    influence direct reports. But beyond followers, leaders often need to influence
    others who can affect their success, or the success of their followers. Specifically,
    and perhaps especially at higher levels of organizations, they can influence by
    developing allies and network ties beyond their immediate teams. In other words,
    leaders realize that they cannot be successful simply on the basis of the cooperation
    of direct reports. Instead, they often need to influence others (e.g., suppliers,
    higher-level leaders, customers, government officials, and so forth), and thus,
    need to develop allies and network ties that go beyond the immediate team.


    In Chapter 3, we considered the importance of political savvy, which pertains
    largely to this influence tactic. The politically savvy leader uses both expert
    and referent power as a means of forming allies and network ties. Moreover, reward
    power and quid pro quo are part of the toolbox for the politically savvy leader.
    The influence tactics that are displayed above and below the dashed line in Figure
    11.1 are not mutually exclusive. There is no rule against a leader using a tactic
    like quid pro quo to help solidify the development of network ties. On the other
    hand, it also helps for the leader to be able to influence potential allies and
    people in a network based on expertise and likeability (i.e., referent power).
    For example, a leader might influence a supplier in part by making it clear that
    the leader can ensure prompt payment for products or services rendered—in other
    words, quid pro quo. However, the leader can also demonstrate expertise about
    the supply chain and challenges that are faced by the supplier, and do so in a
    manner that gains the supplier’s admiration and trust (i.e., referent power).
    Together, the leader is using multiple bases of power to influence the supplier
    and develop him as a strong network tie.


    # 11.2 Charismatic and Transformational Leadership


    Inspiration forms the common denominator of influence tactics below the dashed
    lines in Figure 11.1. When leaders are able to rationally persuade, display vision
    and a higher sense of purpose, and make people feel good to be around them, then
    they are able to inspire. There are two related forms of leadership that share
    this ability to inspire at their core: (1) charismatic, and (2) transformational.'

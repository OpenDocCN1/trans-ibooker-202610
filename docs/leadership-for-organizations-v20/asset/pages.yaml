    # Preventing or Dealing With Team “Illnesses”


    **groupthink**

    When information that would run counter to established ways of thinking and acting
    in a team, and associated minority dissent, are essentially shut down or ignored
    by the majority.


    **free-riding/social loafing**

    Phenomenon whereby some members of a team may work less diligently or with less
    effort toward team goals simply because they realize that there are others in
    the team who will pick up the slack.


    There are systematic maladies or “illnesses” to which teams are especially vulnerable.
    Here we consider two main issues: (1) **groupthink**, and (2) **free-riding/social
    loafing**. Teams tend to have a desire to achieve harmony or a lack of conflict.
    But a key source of disharmony or conflict is information or thought processes
    that would run counter to a team’s way of thinking about problems, or their norms.
    Groupthink occurs when information that would run counter to established ways
    of thinking and acting in a team, and associated minority dissent, are essentially
    shut down or ignored by the majority.[9] Groupthink tends to develop when the
    bulk of a team, oftentimes the in-group of the leader, becomes excessively cohesive.
    In doing so, it stops thinking creatively about problems, and it ignores information
    that might run counter to the team’s way of doing things or solving problems.
    It follows that new challenges are not likely to be met successfully.


    To begin to understand what norms are and how they operate to affect groupthink,
    let’s consider a famous experiment that, at first glance, may seem puzzling. In
    this experiment, a group of college students were asked to estimate the length
    of lines projected on a screen. Watch “Asch Conformity Experiment”. Unbeknownst
    to the real subject, the other participants were part of the experiment, and they
    gave what are clearly inaccurate estimates (too long or too short). When the naive
    subject was asked for his estimate, he or she just went along with the group.[10]
    The same thing happens with groupthink. Because of normative pressure, members
    tend to go along with the direction that a group is taking, even if there is evidence
    to the contrary. If such evidence is introduced, there is likely to be pressure
    to ignore it, and even shame the person who introduces it.


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_131_0.png)


    What can leaders do to prevent or deal with groupthink? Obviously, the first challenge
    is to realize that like illnesses that can affect individuals, no team is immune
    from groupthink. In other words, leaders need to realize that groupthink can creep
    into a team, and in all likelihood, it will if left unchecked. But more importantly,
    it is imperative that leaders take steps to actively prevent groupthink, or deal
    with it as it occurs. One possibility is to delegate the role of naysayer to one'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'or more team members. That is, a particular team member(s) could be designated
    to be the devil''s advocate for the team, and present information or opinions
    that run counter to the general flow of the team''s thinking when dealing with
    issues and problems. Perhaps the chosen individual already has a reputation as
    being somewhat of a rebel, but is nevertheless a good employee who has the goals
    or mission of the organization at heart.


    Groupthink is not the only potential problem facing teams, and it is not the only
    problem with which leaders should deal. Free-riding and social loafing are highly
    similar phenomena whereby some members of a team may work less diligently or with
    less effort toward team goals simply because they realize that there are others
    in the team who will pick up the slack.[11] One potential reason for free-riding/social
    loafing is what has been termed diffusion of responsibility. For years, diffusion
    of responsibility was examined in social contexts, whereby bystanders might not
    come to the aid of a person in need of assistance (e.g., a person being attacked
    on a street) because of the perception that others were observing the same event,
    which might cause a person to think, “why should I take action or assume responsibility;
    why not let others do so?”[12] However, the same thing could happen in teams in
    organizations as they pursue goals, whereby some team members might feel less
    responsibility to take actions simply because of their realization of having other
    team members who could take up the slack. The problems of free-riding/social loafing
    are twofold. First, when one or more members are not contributing, the overall
    performance of the team is likely to suffer. Second, perceptions of inequity or
    injustice are likely to occur, whereby highly performing members may start to
    feel like “suckers” who are being taken advantage of by the free riders or social
    loafers.


    What can leaders do to prevent or deal with free-riding/social loafing? As is
    the case with groupthink, the first step is to simply recognize the likelihood
    of the phenomenon occurring. In other words, the leader should be on the lookout
    for free-riding/social loafing among team members. Other things that leaders can
    do is to make sure that individuals understand minimal standards, and then take
    steps to monitor to make sure that everyone in the team is contributing. Finally,
    this problem is related to out-group membership in that out-groupers are more
    likely to be free riders or social loafers. Accordingly, the potential damage
    of this phenomenon is just one more reason why leaders should also attempt to
    prevent or remedy out-group formation.


    # 8.2 Leadership and the Stages of Team Development


    Teams tend to progress in certain stages as they develop over time. The four primary
    stages are shown in Figure 8.1.[13] An additional stage, adjournment, has been
    recognized by some authors.[14] During this final stage, the team is essentially
    disbanding. It is perhaps most relevant to temporary project teams. In our analysis
    here, we will focus on the stages that are shown in Figure 8.1, since they deal
    directly with a team''s performance and the accomplishment of its mission.'

    As a case example, one of the authors of this book previously served as department
    Chairperson in a relatively small business school. The management team of the
    school (i.e., the Dean, department chairpersons, and program directors) were considering
    the possibility of the school developing online programs of study. This consideration
    occurred at a point in time when online programs were in their early stage of
    development. The author continually pointed out problems with the development
    of online platforms, such as costs and the fact that other, bigger schools would
    be formidable competitors. He attempted to forcefully make his case in a series
    of meetings. But after some period of time, it became clear that most of the other
    people on the management team were leaning toward developing online programs.
    He made the choice of not attempting to obstruct the team’s efforts, but also
    not to quit his position. Instead, despite his doubts, he decided to support the
    greater team’s efforts in terms of this new direction.


    # Two Caveats for Effective Followership


    Sometimes it is not easy or straightforward to be an effective follower. There
    are a few caveats for effective followership that need to be mentioned. First,
    as stressed throughout Chapter 3, “it takes two to tango.” So just as effective
    followership is important to realize effective leadership, the reverse is also
    true—effective leadership is important for effective followership. If leaders
    do not encourage and reinforce independent, critical thinking and high levels
    of engagement on the part of followers, it is not likely to materialize. Instead,
    we are more likely to see either conformist or alienated followers.


    We should further acknowledge that, in addition to the leader, organizational
    environments may or may not encourage effective followership. That is, aside from
    the leaders themselves, some contexts encourage independent thinking and engagement.
    In these environments, followers are likely to see other role models of effective
    followership, and they are likely to draw courage from others to challenge the
    status quo by being critical, independent thinkers. In short, it is easier to
    be an effective follower in some organizational contexts, as compared to others.
    Again, we return to a principle that was laid out in Chapter 1; specifically,
    that effective leadership processes involve three elements working in concert:
    the leader, the follower, and the context.


    Second, loyalty can sometimes be taken too far—in terms of loyalty to either the
    leader, or the organization. Regarding both leaders and the greater organization,
    there may be times when excessive loyalty can be harmful, especially when moral
    values or even laws have been compromised. When this happens, the effective follower
    should no longer be blindly loyal, and instead, should speak up. A first step
    is to follow the maxim of “speaking truth to power.” The hope is that proper steps
    will be taken to change behavior or policies. As an example, Michael Woodford
    had been hired to be CEO by Olympus, the camera producer, several years ago. He
    discovered fraudulent behavior within the firm in order to cover up financial
    losses. He went to the Board of Directors, who essentially oversaw all actions
    and policies of the firm, including the CEO. However, the Board did nothing, except
    fire Woodford when he went public with the story. In the end, the Board ended
    up resigning, and several senior executives pleaded guilty to fraud.[6] In this
    particular instance, Woodford did not stay loyal to his superiors, nor to the
    organization that they were attempting to uphold. However, it could be argued
    that by “speaking truth to power,” he was defending the organization as it should
    be, rather than as it was.


    In essence, the above example represents whistleblowing, and the risks for the
    individual who engages in such behavior. Whistleblowing is the disclosure by a
    person, usually an employee in a'

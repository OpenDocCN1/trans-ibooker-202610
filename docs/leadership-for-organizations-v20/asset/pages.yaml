  md: '# # CHAPTER 10

    # Global Leadership


    > "The Chinese use two brush strokes to write the word ''crisis.'' One brush stroke
    stands for danger; the other for opportunity. In a crisis, be aware of the danger—but
    recognize the opportunity."—President John F. Kennedy


    # ## Learning Objectives


    +   1. Describe how global leadership can be distinguished from more generic ways
    of thinking about leadership.

    +   2. Identify how the American cultural context is somewhat unique as compared
    to other cultures, and implications for global leaders.

    +   3. Explain the elements of a global leadership orientation and why they are
    important for a global leader''s effectiveness.

    +   4. Appraise one''s own global leadership orientation.

    +   5. Identify misinterpretations in cross-cultural situations and how to avoid
    them.


    In Chapter 9, we addressed the role of diversity in leadership, with a special
    focus on women and men in leadership roles. In this chapter, diversity continues
    to take center stage. However, we now direct our attention more broadly to the
    global context in which leaders increasingly find themselves. Indeed, the global
    operations of firms have accelerated in recent times. For example, according to
    the World Trade Organization, global exports in 2014 were almost double that of
    2005.[1] Coinciding with the global operations of firms, we see greater interaction
    among people from different cultures and societies. Accordingly, to achieve performance
    goals, global firms need to work effectively with a multitude of diverse stakeholders
    such as suppliers, customers, community members, governments, and non-governmental
    organizations.[2]


    As a result, individuals at different levels in organizations need to assume global
    leader roles in order to ensure their own and their organizations'' effectiveness.
    In so doing, they attempt to learn from the thinking of people in cultures other
    than their own. The opening quote of this chapter from President John Kennedy
    is emblematic of the thinking and broader perspective of a globally-oriented leader.


    # ## 10.1 Who Are Global Leaders?


    There are essentially two types of global leaders, and their distinction centers
    around one’s geographically-based, current living situation. First, an expatriate
    role represents a classic or traditional way of thinking about global leaders.
    An *expatriate* is essentially an individual who lives, typically with his or
    her family, in a country other than his or her origin, for at least six months
    at a time. So if an individual worked for a multi-national firm, was from the
    United States, but she did an extended assignment (e.g., one year) in Brazil,
    then that person would be considered an expatriate.


    **expatriate**

    An individual who lives, typically with his or her family, in a country other
    than his or her origin, for at least six months at a time.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'There can be many challenges for both expatriates and their firms. They include
    personal and family adjustments when living in other countries and additional
    expenses that are incurred by expatriates (e.g., education expenses for children
    of expatriates, moving expenses, and so forth).[3] Indeed, much research has been
    devoted to expatriates in terms of their ability to adjust to the requirements
    of living and working in a different country.[4]


    A second approach to understanding global leader positions has grown in popularity
    in recent years. Specifically, global leader roles can be defined in terms of
    interactions with individuals from other parts of the world, regardless of whether
    one actually spends time living outside of his/her home country.[5] Given the
    advances in technology (e.g., teleconferencing) and international travel in recent
    years, this second approach to global leadership has become increasingly expedient
    and prominent. For example, a leader who is a “global domestic” is based in his
    or her own home country, but most of that person’s responsibilities or work-based
    interactions are with individuals in, or from, other countries.[6] While that
    person is likely to spend time traveling or interacting with stakeholders of his/her
    firm in other countries, the person remains based in his/her home country. And
    then there are the truly global leaders like Carlos Ghosn. Ghosn’s parents were
    Lebanese, but he was born in Brazil, lived as a child in Lebanon, went to college
    in France, was the CEO of the French tire company, Michelin, and went on to head
    up the car companies Nissan in Japan and Renault in France. He speaks fluent Portuguese,
    French, English, and Arabic, and spends much of his time on airplanes. Despite
    his qualities, Ghosn fell into trouble because of alleged gross misuse of funds
    at Nissan. As of early 2020, he was considered a fugitive from legal authorities
    in multiple countries.[7]


    In sum, global leader roles reflect multiple types of internationally-based work
    contexts, which range from individuals who are fully embedded in a foreign country
    (e.g., expatriates) to those who live in their home or base country, but often
    engage with others from different cultures. A common denominator in global leader
    roles is a need to engage people from geographically diverse backgrounds or cultures.
    But what is this engagement all about, why is it important, and what life experiences
    tend to predict global leadership? We answer those questions in the sections that
    follow.


    # 10.2 Understanding the American Cultural and Business Context


    We begin with a simple principle: to understand and deal with other cultural or
    business contexts as a leader, one must first understand his or her own home context.
    In other words, the leader needs to first have a solid grasp on his or her own
    cultural context and ways of doing business and solving problems. From that cultural
    platform, the leader can then better understand and potentially adapt to other
    cultures that might be different. Below, to illustrate this principle, we highlight
    the example of the American cultural and business context. Although the American
    context is considered here, the same principle could be applied to leaders from
    any culture.


    +   1. Cultural looseness.


    Some cultures have strong social norms about what is the “right” behavior to show,
    and they also have strong means of sanctioning the wrong behavior—both through
    laws and social mechanisms of approval or disapproval.[8] For example, many Asian
    cultures tend to be characterized by cultural tightness. In contrast, American
    culture tends to be rather loose; for example, by fostering expectations that
    people will “do their own thing.” Part of the looseness stems for the existence
    of an array of sub-cultures that, to some degree, are even geographically-based
    (e.g., values and lifestyle in the Southern region of the United States are different
    from those of the North).


    Dualism When seemingly disparate aspects of a culture occur simultaneously; for
    example, individualism and collectivism.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 2. People can change or better themselves under the right conditions.


    For many years, the U.S. has been known as the country of opportunity, which is
    why so many people have wanted to immigrate to the U.S. That is, they come from
    countries where the socioeconomic class in which one is born becomes fixed for
    life at birth. In contrast, in the United States, cultural norms and values encourage
    people to better themselves; for example, through education. In recent times,
    some people may question the extent to which all groups in the U.S. have equal
    opportunity in terms of bettering oneself. But nevertheless, the overall principle
    remains characteristic of American culture.


    # 3. Individualism.


    The U.S. has historically been known for its “rugged individualism.” In other
    words, it has traditionally encouraged, celebrated, and rewarded individualism
    efforts. Other cultures tend to be more collective in nature, with individualism
    being discouraged. For example, an old saying in Japan is, “the nail that sticks
    out will get hammered in.” With all of that in mind, more collective sentiment
    and efforts nevertheless exist within American culture, especially when people
    feel threatened by outsiders, as is the case during war or major terrorist attacks.
    In recent times, the COVID-19 pandemic stimulated a more collective sentiment,
    as could be seen in such phrases as “we are all in this together.” Indeed, a form
    of dualism exists in the American culture that in some ways celebrates individualism,
    while also encouraging collectivism. For example, there is the saying that “There
    is no I in team” or a member should sometimes “Take one for the team.” Dualism
    is similar to the paradox theme that is stressed throughout this book. In other
    words, leaders need to embrace and try to harmonize seemingly disparate phenomena
    that they encounter.


    # 4. Universalism.


    Americans traditionally have tended to be universalists, rather than particularists
    or what is also termed relativists.[9] Universalists believe that there are certain
    principles or values that hold true across all contexts. For example, Americans
    tend to believe that telling lies or acting hypocritically is always a bad thing.
    In contrast, particularists will tend to believe that it all depends on the situation
    or context. For example, if one must tell a lie or simply omit part of the truth
    to serve the needs of a family member or friend, so be it in the mind of a particularist.
    With that said, once again, cultural dualism comes into play. For example, although
    universalism has been more a traditional element of American culture, particularism
    appears to be on the rise among many people.[10]


    # 5. “Doing” is better than “being.”


    Do you “work to live”, or do you “live to work”? While many Americans might want
    to think of themselves as working to live, in reality, for many Americans, work
    becomes a form of identity or even calling—that is they “live to work.” In other
    words, the American culture is very performance-oriented, and work life is central
    to who a person is.[11] As such, career goals will often become equal or greater
    in value than personal life goals (e.g., having and devoting time to family).
    In contrast, in a “being” culture, people tend to place more value on non-work
    activities, such as family and enjoying life outside of work. Given the looseness
    of American culture mentioned above, there is certainly variance among Americans
    in terms of this aspect of culture. However, “doing” and accomplishing things,
    especially in association with one’s work life, is predominant in American culture.


    # 6. Time should be revered and carefully managed.


    Have you ever heard the expression that “time is money”? Some cultures, especially
    “doing” cultures, tend to revere and value time. American culture is one example.
    Other cultures are more nonchalant or carefree with regard to time. Thus, in those
    cultures, if an individual arrives 15 minutes late for a meeting, the common sentiment
    might be: who should care?


    # 7. The past is gone, and only the present and future are really important.


    The band Fleetwood Mac is famous for the song “Don’t Stop.” In this song, they
    talk about focusing on the future, rather than the past. This song is emblematic
    of American culture.'

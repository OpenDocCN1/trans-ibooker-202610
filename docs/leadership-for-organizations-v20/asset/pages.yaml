    # 8.1 Key Elements of Team-Oriented Coaching and Leadership


    There are some basic elements involved in team leadership. The elements described
    below serve as the foundation for how leaders can develop or coach teams to achieve
    maximum performance. After first describing these elements, we will consider how
    they come into play throughout the stages of a team''s development.


    # Avoidance of Out-Group Relationships


    In Chapter 3, we considered the potential problem of out-group relations between
    a leader and individual team members. If an effective team can be formed while
    essentially ignoring followers who have a poor relationship with the leader, then
    out-group membership might not be such a big issue for leaders who attempt to
    build teams. However, in reality, out-group membership is anathema to team leadership
    for several reasons. First, other team members often have problems with out-group
    members. Indeed, fairness issues can surface in that in-group members may start
    to believe that out-group members are getting a “free ride.” If this happens,
    it will be difficult for a leader to form a unified team that is working collaboratively
    on common goals.


    Second, even if fairness issues do not surface, the old adage “one bad apple can
    spoil the whole bunch” might come into play. In other words, an out-group member
    might spread his or her problems regarding the leader to other members of the
    team, essentially ‘infecting’ them with negative attitudes or feelings toward
    the leader and maybe the team as a whole. The upshot is that it will be difficult
    for the leader to form a unified team. Accordingly, as stressed earlier in this
    book, leaders should make attempts to avoid out-group formation in the first place.
    But if an out-group or a single “bad apple” somehow develops, the leader should
    take steps to remedy the situation.


    # Shared Values, Goals, and Vision


    “Everyone is on the same page.” That’s a metaphor for the foundation of what a
    team is all about. Whether the team is in sports, the business world, government,
    and so forth, if a collection of individuals is to function as a team, then everyone
    on that team must be on the same page. But what exactly does that mean? We argue
    that it means a shared sense of values, goals, and vision.


    An example of a shared sense of values is the shared importance placed on playing
    defense in college basketball. Players, especially players who seek to eventually
    join the National Basketball Association (NBA), come out of high school wanting
    to demonstrate their ability to run, shoot, dunk—in other words, play offense.
    However, to win championships in college basketball, a team must also be excellent
    on the defensive side of the ball. John Calipari, coach of the University of Kentucky,
    has shown an ability to recruit high-level players, who often join the NBA after
    just one year of college play. However, through persuasion, reward, and discipline
    systems, he is also able to instill values and skills pertaining to defense.9'

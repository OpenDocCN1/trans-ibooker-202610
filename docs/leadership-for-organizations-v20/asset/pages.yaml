  md: 'Researchers, therapists, and physicians commonly measure physiological phenomena
    in the brain in terms of changes in blood flow and electrical activity. This activity
    occurs in one of two ways. First, the brain reacts physiologically to stimuli
    in our environments. For example, if a tiger were to walk into your immediate
    proximity, your brain would immediately engage in changes in blood flow and electrical
    activity that are related to fear and flight. Second, when your brain is in an
    alert but resting state (i.e., not being subjected to stimuli), it has what is
    known as a distinct, intrinsic electrical structure or pattern. Like height, weight,
    personality, and so forth, each of us have unique, intrinsic structures that can
    be assessed through what is known as quantitative electroencephalogram (qEEG).29
    Such neural structures differ between individuals, and they are relatively stable
    over time. However, in line with the concept of brain plasticity, these structures
    can potentially change over time due to life experiences, traumatic injury, and
    even systematic training.


    # Inside the Brain of a Leader


    Can neurological rewiring boost leadership skills? https://www.inc.com/magazine/201306/eric-markowitz/brain-leadership-inside.html


    In recent years, research has shown that intrinsic structures in the brain are
    associated with various aspects of effective leadership, such as visionary, ethical/moral,
    non-abusive, and complex reasoning forms of leadership.30 In other words, we differ
    on those intrinsic structures, and these differences are associated with whether
    or not we will tend to be effective as leaders. What is not as yet clear are the
    practical implications of such research. One possibility is that a technique like
    neurofeedback could be used to help develop the potential for better leadership
    behavior. Through neurofeedback, the brain might be trained to be more conducive
    to effective leader cognition, emotions, and behavior.31 While not a “magic bullet”
    for prospective leaders, perhaps neurofeedback might be paired with other leader
    development approaches, such as the 360-degree feedback processes considered in
    Chapter 7 of this book. Another possibility might be to actually use neurologically-based
    data to help form the basis for the selection or promotion of individuals into
    leadership positions. Indeed, the business world and media are starting to take
    note of these potential implications of neuroscience.32


    Yet both of these potential implications raise ethical issues (e.g., privacy)
    that will most likely come into play in future years as this research moves forward.
    For example, is it ethical to change the electrical brain structures of individuals
    in an attempt to make them better leaders? Who says when and how brain-based data
    might be used to help select and promote leaders? Despite such difficult questions,
    one thing is for sure: the brain represents a new frontier for both understanding
    and developing leadership potential.



- pgno: 37
  md: 'As mentioned in Chapter 1, to really understand what leadership processes are
    all about, we must consider the leader, followers, and the context in which leadership
    is occurring. Obviously, the starting point is the leader, so it makes sense to
    devote some significant attention to what qualities make someone an effective
    leader, and how individuals attempt to lead. In this chapter, we distinguish between:
    leader traits and leader behaviors.


    # 2.1 Leader Traits


    trait

    A distinguishing quality or characteristic (i.e., physical, cognitive, emotional).


    A trait is a distinguishing quality or characteristic (i.e., physical, cognitive,
    emotional). For many years, researchers and practitioners (e.g., leadership coaches
    and trainers) have been attempting to identify individual traits, or sets of traits,
    that can distinguish leaders from non-leaders. Formally, this has become known
    as the “Great Man approach” to understanding effective leadership.[1] Over time,
    a number of traits have been potentially identified including both physical and
    psychological traits. As an example of the former, researchers have looked at
    such physical qualities as gender, height, and physical appearance. As can be
    seen in the term “Great Man,” the initial thinking (or bias) in this approach
    was that only men could truly be leaders. As we will see throughout this book,
    nothing could be further from the truth, and indeed, women have as much or more
    potential for effective leadership. Overall, the search for physical qualities
    that would separate out people who might be effective leaders has not been very
    successful or consistent. But with that said, some research would point toward
    the relevance of certain psychological or emotional traits, or combinations of
    such qualities. We separate these traits into the following categories.


    +   - Psychological capital

    +   - Self and other awareness [including emotional intelligence]

    +   - Motive profile

    +   - Character

    +   - Complexity and paradoxical nature


    # Psychological Capital


    People who are seen as leaders tend to be positive. In other words, they are anything
    but “Debbie Downers.” Psychological capital is a term that pertains to positive
    characteristics of leaders. Let’s take a look at the four factors that make up
    a leaders’ psychological capital.[2] First, leaders tend to have and retain hope.
    There are many factors that can drive down hope, such as economic uncertainty,
    chaos or division in society, and so forth. But through it all, leaders with strong
    psychological capital retain their hope.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/5a5fcd49e67d713bc6c99c1cc791987a_38_0.png)


    Second, leaders maintain their strong self-efficacy. That is, they are confident
    in what they can do and what can be accomplished. Without such confidence, they
    may not attempt "stretch" goals that extend themselves and their followers beyond
    what they might have originally conceived as possible. In the movie, Invictus,
    Nelson Mandela (played by Morgan Freeman) asked a captain of the national rugby
    team, Francois Pienaar (played by Matt Damon), how a leader can inspire people
    to achieve more than they expect they can achieve. It first takes self-efficacy
    on the part of a leader to raise up the self-efficacies of their followers. We
    will consider inspirational leadership further in Chapter 11.


    > **grit**

    > Courage and resolve.


    Third, leaders maintain resilience, and they persist, even in the face of setbacks.
    Disappointments and lack of success are bound to happen as people pursue goals.
    However, effective leaders understand that failures are inevitable, and they are
    part of learning. They possess resilience, which enables them to persist in the
    face of setbacks, rather than quickly giving up. There is a saying that "winners
    never quit, and quitters never win." Leaders take this saying to heart. In short,
    the common denominator is that leaders have grit—in other words, courage and resolve.
    On the other hand, it is important for leaders to understand the fine line between
    resilience and persistence on the one hand, and "cutting bait" on the other. That
    said, leaders tend not to "cut bait" too easily.


    Fourth, leaders portray optimism. Colin Powell, the former Army general and Secretary
    of State, claimed that "Perpetual optimism is a force multiplier."45 Optimism
    is key to leadership because it gives people who might follow the leader a sense
    of hope, and it is very much related to the idea of transformational leadership,
    which we will consider in Chapter 11 of this book.


    A theme that runs through all of the factors of psychological capital is that
    the leaders who possess them have a passion for the goals that they pursue. That
    passion is accompanied by a high level of energy. When combined, their passion
    and energy tend to be contagious, which is a key reason why others follow their
    lead. Steve Jobs, co-founder of Apple, was notorious for his deep passion and
    energy to produce high-tech products that could be made both useful and simple
    for consumers. His followers were strongly influenced by him, despite his tendencies
    to be critical and even abusive at times.46 They were caught up in his ideas,
    passion, and drive to see those ideas come to fruition in terms of personal computers,
    cell phones, and other products.


    It should be noted that all of these qualities are not only relevant to leaders,
    but entrepreneurs as well. Successful entrepreneurs are known for their passion,
    energy, optimism, resilience, and persistence. Without these qualities, they might
    succumb to naysayers or doubters who would question their ideas and not provide
    necessary support, such as initial financial support.'

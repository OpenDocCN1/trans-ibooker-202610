  md: "# 12.3 Aligning Culture With Vision,\nMission, and Strategy\n\nIs there such\
    \ a thing as a “right” or best organizational culture? Asked another way, are\
    \ there particular norms and values that will make any organization effective,\
    \ and thus toward which a leader should direct his or her efforts? By and large,\
    \ the answer is a “qualified” no. With that said, perhaps there are certain types\
    \ of strongly shared norms and values that will prove to be effective for just\
    \ about any firm. For example, one could argue that certainly over the long term,\
    \ an organizational culture characterized by shared ethical norms and values is\
    \ more likely to sustain competitive advantage, as compared to one that is less\
    \ ethical.\n\nAside from ethical norms and values, organizational cultures can\
    \ be characterized in terms of a number of dimensions. One popular characterization\
    \ considers the following four dimensions and associated norms and values:\n\n\
    +   1. Order and consistency—adherence to rules and procedures, emphasis on stability\
    \ rather than change, top-down command-and-control, reliance on proven approaches;\n\
    +   \n+   2. Achievement—being the best (e.g., leading in market share in an industry),\
    \ aggressive action, emphasis on accomplishing “the numbers”, emphasis on personal\
    \ initiative, competitiveness;\n+   \n+   3. Clan—emphasis on building consensus\
    \ and teamwork, equal status, being sensitive to the needs of others, having a\
    \ friendly or “family” environment;\n+   \n+   4. Adaptability—emphasis on experimentation,\
    \ innovation, creativity, and risk-taking.[64]\n\nTwo issues should be especially\
    \ noted regarding these dimensions. First, although some organizations will emphasize\
    \ or have one of the above dimensions as predominant in its culture, other organizations\
    \ may attempt to emphasize more than one of these dimensions simultaneously. Further,\
    \ to some degree, an organization could have at least some of each of the above\
    \ dimensions present in its culture. Second, there is some evidence that organizations\
    \ with cultures that promote innovation (i.e., adaptability) and collaboration\
    \ (i.e., clan) are more likely to perform better financially and have employees\
    \ who are more positive about their work experience.[65] Conversely, a culture\
    \ that is characterized by a high degree of order and consistency may become too\
    \ rule-bound or bureaucratic, and thus, not be flexible in terms of changing environmental\
    \ demands. With all that said, the real key is that there should be an alignment\
    \ between the dimension(s) that is emphasized in a firm’s culture and the pursuit\
    \ of competitive advantage. In other words, culture should be used as a mechanism\
    \ to ensure the pursuit of vision, mission, and strategies that will achieve competitive\
    \ advantage.\n\nSome firms are quite large, making the task of building and shaping\
    \ culture that much more difficult. For example, Walmart has 1.4 million employees\
    \ in the United States. In a firm so large, how can any leader ensure that these\
    \ employees are coordinated and doing the right things? The answer is that a fundamental\
    \ task of any strategic leader is to coordinate the activities of large numbers\
    \ of people pursuing interdependent activities. To accomplish this, strategic\
    \ leaders design control systems that help employees understand what is important\
    \ and how to behave. This means using both formal control systems (e.g., performance\
    \ management systems, budgeting systems, inventory control systems, etc.) and\
    \ social control systems (e.g., the culture of the organization)—as well as the\
    \ alignment of formal and social control systems.\n\nTo be successful, leaders\
    \ need to design control systems that support or are aligned with the firm’s mission\
    \ and culture, as well as the leader’s vision and strategic goals. If one is a\
    \ leader in an organization with a strategy of being a low-cost provider to its\
    \ customers, then that leader will probably need control systems that allow him\
    \ or her to monitor costs and expenses and, when necessary, act to reduce them.\
    \ At least to some degree, the leader may need to build an order and consistency\
    \ culture. If the leader’s strategy is to be an innovator, that person will need\
    \ control sys-"
  merge: -1
  img_proc: true
- pgno: 194
  md: 'tems and an *adaptability* culture that promote innovation (e.g., by providing
    resources for new products and measuring the sales of new versus old products).
    In addition, if innovation is the key strategic goal, "control" could start to
    resemble the paradox discussed in previous chapters. That is, leaders often gain
    control by giving up control. In any event, substantial research confirms that
    the alignment of strategy, control systems, and culture is associated with organizational
    performance.[16]


    Finally, it should be noted that the four dimensions described above represent
    only one framework, or set of dimensions, for understanding organizational culture.
    For example, cultures can also be characterized in terms of the extent to which
    norms, values, and beliefs are moral or ethical. We will see an example of moral/ethical
    culture in the video case mentioned later in this chapter.


    # Case Examples


    **Southwest Airlines.** Since organizational culture can be thought of as a social
    control system, the same logic of aligning the culture with vision, mission, and
    strategy applies. If a leader’s strategy emphasizes low costs, does the organizational
    culture support this? To illustrate this point, think about Southwest Airlines,
    the biggest and most successful low-cost airline in the U.S. What culture has
    Southwest developed in order to ensure low costs? Airlines are a capital-intensive
    business, and one of the keys to success in any capital-intensive business (e.g.,
    airlines, hotels, oil refineries, semiconductor manufacturing) is high asset utilization.
    In Southwest’s case, this means keeping the airplanes in the air. Part of this
    issue is handled through the formal control system and aspects of an *order and
    consistency culture* that efficiently schedules airplanes. But an equally, if
    not more important part is by turning around the airplanes quickly and being responsive
    to customers. Here, the key is a culture that promotes both flexibility and creativity
    (i.e., *adaptability culture*), as well as teamwork (i.e., *clan culture*), on
    the part of all employees.


    An example of teamwork is how employees at Southwest do not strictly delineate
    their roles. For the purpose of turning around the airplanes quickly, pilots,
    ramp agents, and flight attendants typically work together to get a parked airplane
    ready for its next flight. In short, because employees care about each other and
    the company, they are more willing to pitch in, help each other out, and use their
    initiative to solve problems when they arise.[17]


    Figure 12.2 depicts a "triangle of success" at Southwest with organizational culture
    as one point in the triangle. However, as also depicted in Figure 12.2, some key
    decisions or strategies have been executed throughout the firm’s history to implement
    its emphasis on combining customer satisfaction with the pursuit of low costs.
    *First*, customer satisfaction is not just a slogan, but has been implemented
    using a number of policies and strategies. For example, Southwest attempts to
    have point-to-point (or nonstop) flights between cities. Although not totally
    unique in the industry, this scheduling strategy stands in contrast to the hub-and-spoke
    model of large airlines like Delta and United, which rely on funneling passengers
    through one or more hub airports with connecting flights to destination cities.
    While somewhat efficient as a means of scheduling, the downside of a hub-and-spoke
    model is that it forces extra, connecting flights that are less than desirable
    for passengers. In addition, Southwest stresses on-time performance and encourages
    friendly service on the part of employees.'
  merge: -1
  img_proc: true

- pgno: 169
  md: 'In this chapter, we will unlock some of the mystique surrounding inspirational
    and visionary leadership. In so doing, we will also consider a key way that leaders
    inspire, specifically through vision. We will further consider some popular concepts
    associated with inspiration, including transformational leadership. And we will
    address a more controversial way of understanding leader inspiration, namely charisma.
    In addition, we will explain how mission or sense of purpose forms the basis of
    a new vision, and how a very narrow, product or economic-based mission can limit
    future vision. Finally, we will consider exactly what constitutes effective leader
    vision.


    # # 11.1 The Connection Between Bases of Power and Influence


    Power is basically the ability to get things done in a manner that suits one''s
    goals. Power is important for leaders since it forms the basis of influence. A
    diagram that shows the relationship between power and influence is shown in Figure
    11.1.


    FIGURE 11.1 Bases of Power and Influence Tactics for Leaders


    | Bases of Power | Influence Tactics |

    | :--- | :--- |

    | • Coercive

    • Formal or legitimate

    • Reward/resources |

    • Punishment

    • Being clear about what you want or seek

    • Quid pro quo |

    |--|

    | • Expert

    • Personal (“referent”) |

    • Rational persuasion

    • Appeal to vision or higher purpose

    • Making people feel good to be around you (i.e., making people admire, respect,
    and trust you) |


    # # Hard Versus Soft Power


    > **hard power**

    > Coercive, formal/legitimate, and reward/resources sources of power that tend
    to be derived on the basis of one''s position in an organizational hierarchy.


    On the left side of the figure, we see the bases of power.[1] On top of the dashed
    line are three bases of what can be termed **hard power**: (1) coercive, (2) formal/legitimate,
    and (3) reward/resources. In organizations, these hard sources of power tend to
    be derived on the basis of one''s position in the hierarchy. Based on a manager''s
    position, that person could coerce people to perform better, or else those individuals
    would face punishment or reprimand (e.g., reduced salary, worse job assignments,
    lowered job security). On a more positive basis, hard power can be used to provide
    rewards and resources (e.g., pay increases, better training or equipment) for
    desired behavior. Coercion is featured in red, since in many ways it is the antithesis
    of what leadership is all about. This is not to say that coercion should never
    be considered by a manager. However, its overuse will only result in either resistance
    or a feeling of helplessness on the part of followers, neither of which is a good
    thing.'

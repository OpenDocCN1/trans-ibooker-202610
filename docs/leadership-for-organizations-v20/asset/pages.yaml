  md: '# CHAPTER 13

    # Generating Organizational Change Through Strategic Leadership


    > > "If you don''t like change, you''re going to like irrelevance a lot less."—Alan
    Mulally, CEO of Ford from 2006–2014


    > > "Leadership is the capacity to translate vision into reality."—Warren Bennis,
    author and management consultant


    # ## Learning Objectives


    +   1. Explain how the accelerating pace of change due to technological, competitive,
    and regulatory factors increases the importance of strategic leadership.

    +   2. Contrast the different types of organizational change, and how these may
    require different leadership strategies.

    +   3. Describe a change framework for diagnosing and leading organizational change.

    +   4. Identify the major causes of resistance to change, and how leaders can
    deal with such resistance.


    # ### 13.1 Why the Leading of Change Has Become So Important


    What do the following firms have in common: IBM (computers), Ingram (electronics
    distribution), Johnson & Johnson (pharmaceuticals); Nokia (mobile phones), Vivendi
    (media), and Toyota (automobiles)? The answer may not be so obvious because these
    firms come from different countries and compete in different industries. But there
    is something that ties them all together: these are all old companies (average
    age is 135 years old) that are alive today only because in the face of the need
    for dramatic change, they had leaders who helped them move into new businesses.
    Each of these firms began in a different business and now competes in a new one.
    Now think about the following companies: Polaroid, DEC, U.S. Steel, Smith Corona,
    Kodak, and GM. These were well-known companies in the past that, in the face of
    change, have failed and either gone bankrupt or been acquired'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'by other, more successful firms. What is the critical difference between these
    two lists? The answer is leadership. The companies that were able to adapt and
    change had leaders who were able to find new business opportunities and ways of
    making necessary change happen, while the companies that failed had leaders who
    were unable to adapt in the face of the need for change.


    We all know that we live in an era of unprecedented change. But what is interesting
    and important is that recent research has documented two big insights that are
    critical for managers to understand. First, the evidence is that the pace of change
    is accelerating.[1] The penetration of new technologies like the internet, mobility,
    and artificial intelligence is happening faster than at any point in history.
    The average automobile today has more computing power than the Apollo mission
    that first landed Neil Armstrong on the moon in 1969. Netscape, the first widely
    used web browser, was introduced in 1993. Twenty-five years later, more than three
    billion people were using the internet. The Flip Video camera first appeared in
    2006 and was the hottest selling Christmas gift in 2007. Four years later, the
    company was essentially obsolete, replaced by the cell phone. These technological
    shifts have doomed great companies like Kodak (digital imaging), Blockbuster (video
    streaming), Borders (ebooks), the Chicago Tribune (online news), and Circuit City
    (online shopping).


    But it is not only technological change that is disrupting business today. We
    are also seeing significant shifts in consumer preferences (communication, transportation),
    government regulation (banking, airlines), competition (off-shoring, low cost
    producers), and new business models (hospitality, transportation). For example,
    the rise of ride-sharing (Uber, Lyft, ZipCar) and autonomous vehicles combined
    with millennials'' lower needs for owning a car are threatening automakers, and
    especially, taxi companies. The world-wide deregulation of the airline industry
    that has given rise to widespread availability of low-cost airlines has driven
    many airlines into bankruptcy and threatened other full-service carriers. Online
    banking and electronic payments are threatening banks and financial services companies.
    In the face of these changes, the evidence is also that companies are failing
    at an increasing rate. One estimate is that the average lifespan of a company
    in the Standard and Poor''s 500 (large U.S. firms) is roughly twelve years.[2]
    In the face of change, large firms are failing at an increasing rate.


    More recently we all witnessed the COVID-19 pandemic. Many "non-essential" businesses
    were forced to shut down for extended periods of time. Others that managed to
    stay open were only allowed to do so with dramatic changes, such as social distancing
    rules for employees and customers and limited capacities. Still others have permanently
    closed.


    It is certainly true that in many instances, reasons unrelated to leadership practices
    can be blamed for business failures or closures. However, in other instances,
    the reasons for business failures go beyond technology, diseases, and so forth.
    But instead, they include the inability of company leaders to lead change. An
    analysis of corporate failures has shown that oftentimes it is not so much the
    case that firms have missed the shifts in technologies or markets, but instead,
    they had leaders who failed to adapt to the shifts fast enough. For example, for
    almost fifty years Smith Corona was the world''s largest typewriter company. They
    failed when manual typewriters were replaced by word processors and personal computers.
    Ironically, Smith Corona had one of the first word processors. However, their
    leaders ignored this and focused on making money from the typewriter business,
    rather than aggressively promoting word processing. The leaders at Kodak knew
    that digital imaging threatened film sales, and although the company invented
    the first digital camera, they focused on film sales until it was too late. The
    leaders at Blockbuster waited until it was too late to enter video rentals by
    mail. The evidence is that these failures stemmed not from a lack of understanding
    of the new technologies, but that the leaders of these companies were unable,
    unwilling, or lacked the courage or insight to help their companies adapt to these
    changes. The overall goal of this chapter is to help you understand why senior
    leaders seem to find it so difficult to manage change and to provide you with
    several frameworks and suggestions for how you as a leader, now or in the future,
    might think about leading organizational change.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 13.2 Four Basic Frames of Organizational Change


    Before turning our attention to the leading of change, it is first useful to differentiate
    among several different types of change. A two-dimensional model of organizational
    change is shown in Figure 13.1. Whether it comes from shifts in technology, new
    business models, or changes in the market, organizational change can be categorized
    in one of two ways: reactive vs. proactive. In addition to this dimension, change
    can also be thought of as incremental vs. discontinuous.


    FIGURE 13.1 Types of Organizational Change


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_208_0.png)


    # Reactive Change


    A first type of change occurs when, in the face of some performance threat (e.g.,
    declining revenues and profits, new competitors stealing customers, changing technologies
    that make existing products less attractive), firms change after the threat has
    affected the existing business. For example, as low-cost airlines like Southwest
    began to attract customers, the initial response by the major U.S. airlines (e.g.,
    United, Delta, and American) was to do nothing. It was only after they saw significant
    financial losses and several bankruptcies that the major airlines began to respond
    aggressively by cutting costs, increasing efficiencies, and, in some cases, starting
    their own low-cost airlines. More recently we have seen brick and mortar stores
    like Walmart begin to react to the threat of online sales by aggressively trying
    to beef up their own online capabilities.


    As an even more recent example, the COVID-19 pandemic led to wide scale operational
    changes with regard to how firms do business. Here are just some of the changes
    that we witnessed:'
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   1. Mask-wearing on the part of employees and customers of retail outlets;

    +   2. Widespread availability and use of disinfectants for both customers and
    employees;

    +   3. Social distancing of employees and customers;

    +   4. Increased use of employees working from home.


    **reactive change**

    Change that occurs after a threat has affected the existing business.


    From a leader’s perspective, **reactive change** can often be difficult because
    it begins from a position of weakness. Firms may have fewer resources to apply,
    have less time to experiment, and if they are late to react, they may not have
    the depth of expertise that their competitors do. While being a first-mover does
    not always give a company a strategic advantage, being late to the game may make
    it more difficult for leaders to catch up. One small advantage that reactive change
    may offer, however, is the presence of a “burning platform.” That is, leaders
    can point to lower profits, loss of market share, loss of jobs, or the success
    of competitors as a way to motivate and focus employees on the need to change.


    # Proactive Change


    **proactive change**

    Anticipating a coming change and actively embracing it before the competition
    does.


    With **proactive change**, leaders anticipate a coming change and actively embrace
    it before the competition does. In other words, they see an opportunity gap that
    they wish to fill. Reed Hastings, the founder and CEO of Netflix, began his business
    by renting videos and DVDs by mail. But he anticipated that as broadband became
    faster and more widely available, customers would be able to stream video content,
    rather than rent videos, so he proactively invested in the technology to permit
    subscribers to stream content, even though he knew it would undermine his existing
    distribution business. Then, he anticipated that the generation of new content
    would become critical to future success, so he embarked on an aggressive strategy
    of developing his own content.


    Amazon began as an online bookstore, but its founder, Jeff Bezos, has aggressively
    moved into other businesses, selling everything from diapers to industrial robots,
    as well as groceries (Amazon Fresh), electronic hardware (Kindle, Echo), computing
    services (Amazon Web Services, Twitch), producing movies and television content
    (Amazon Studios), and providing transportation services (Prime Air, Amazon Flex).
    Hearst, a $10 billion media company, began in 1880 as a newspaper company but
    has been transformed into a digital media company. In each of these transformations,
    the leaders of the firm saw a coming disruption and proactively invested in the
    new businesses, sometimes by leveraging existing assets and capabilities and sometimes
    by acquiring other companies.


    Proactive change (i.e., making changes before a disruption occurs) is clearly
    a good thing to do. But ironically, proactive change is also harder than reactive
    change. This is because firms, when successful, develop inertia or resistance
    to change. O’Reilly and Tushman refer to this as the “success syndrome.” [3] They
    describe how successful firms develop skills, systems, processes, structures,
    metrics, and cultures that enable them to become more efficient over time. But,
    the same alignment of people, structure, and culture that produces success makes
    change more difficult. When successful, people both see less need for change and
    are more reluctant to change the formula that has made them successful, especially
    when that change might lead to negative personal outcomes (e.g., reductions to
    their pay and bonuses, at least in the short term). Complicating this is the fact
    that when successful, people in the company do not see any compelling reason to
    change. There is no “burning platform” to motivate the need to change. People
    often ask, “Why do we need to change? We’re already successful. Why should we
    devote resources to a new business that might be less profitable?” As a result,
    while successful firms may have the resources to invest in new initiatives, they
    are often resistant to making these changes. This places the burden on leaders
    to create a compelling vision for *why* it is important to change and to ensure
    that the forces for stability and inertia do not preclude proactive change efforts.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# # Incremental Change


    Most organizational change is **incremental**, involving small improvements to
    existing products and processes in order to improve efficiency or make products
    and services more attractive to customers. For example, by refining existing processes,
    a manufacturer may figure out ways to improve production processes or reduce cost.
    An internet service provider may learn how to increase the speed of delivery by
    refining code. When Apple markets a new iPhone, although advertising may attempt
    to indicate otherwise, new versions are better or more attractive because of relatively
    small refinements in how they work and look. These improvements are based on existing
    capabilities and technologies that get incrementally better over time. Often these
    advances are based on a systematic continuous improvement process like six-sigma
    or kaizen that rely on a disciplined methodology of plan-do-check-act.[4]


    From a leadership and change perspective, two things are important to note here.
    *First*, incremental changes are an expected part of day-to-day activities and
    do not necessarily require extraordinary efforts on the part of leaders. *Second*,
    because incremental changes are usually based on existing knowledge and capabilities,
    they are most often accomplished within existing organization structures.


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_210_0.png)


    # # Discontinuous Change


    While incremental changes build on known processes, **discontinuous change** typically
    requires new skills, capabilities, and perspectives, and may also need significant
    new resources to implement. To succeed, these changes often require major shifts
    in structures and processes that can challenge the existing way of operating.
    For example, when Netflix began video streaming, it required a completely new
    set of technologies and challenged their conventional way of distributing DVDs
    by mail. When genetically modified seeds to protect crops from disease became
    available, it required agricultural chemical companies to learn new skills (biology
    rather than chemistry) and undermined their existing business of selling fungicides
    and herbicides. As another example, the COVID-19 pandemic has, to some degree,
    changed the perspectives of many individuals (and leaders) regarding the need
    for traditional work facilities and hours. That is, some people are questioning
    the need for devoted office space in central locations, as opposed to people working
    largely from home or other locations with more flexible work hours. The availability
    of advanced video-conferencing capabilities has contributed to this thinking.
    The upshot is that, as we move into the future, even without a pandemic, we may
    start to see some fundamental changes in how many organizations structure and
    schedule work.


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_210_1.png)


    Because discontinuous change can be so disruptive or create uncertainty, it requires
    leaders to think and act very differently in order to succeed in their change
    efforts. It can also lead to the type of widespread resistance to change that
    we will consider later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# ## 13.3 The Role of the Leader in Change


    Figure 13.1 provides a simple framework illustrating how these two types of change
    can interact. Typically, the most radical change involves proactive, discontinuous
    actions on the part of leaders and their firms. In other words, the change is
    fundamentally transformative. Given that people are largely leery of change, transformative
    change can be especially challenging for leaders. In Chapter 1, we made a fundamental
    distinction between _management_ and _leadership_, noting that managers work within
    existing structures to make systems operate effectively and deliver results, while
    leaders are responsible for setting a vision and helping the organization adapt
    to change. Based on Figure 13.1, a different way of saying this is that managers
    are most often responsible for incremental or reactive change, while true leaders
    are more often concerned with transformation and discontinuous change. While incremental
    change is important, it typically can be achieved through careful planning, measurement
    and feedback. On the other hand, discontinuous (both transformation and re-orientation)
    change is riskier, more important, and requires more involvement on the part of
    leaders.


    For example, think about the leadership challenges associated with transforming
    a large organization like IBM. That firm began as a manufacturer of mechanical
    tabulating equipment, moved into computers and software (same customers but a
    completely different technology), leveraged these assets and capabilities to become
    a company that also provides business solutions and consulting, and is now trying
    to become a provider of artificial intelligence solutions. Each of these shifts
    required leaders to dramatically change how they did business and where they allocated
    their resources; in other words, major transformative change. In contrast, think
    about how the leaders of companies like Kodak or Polaroid who, when confronted
    with disruptive changes in their core business of film and instant photography,
    failed to help their organizations make the changes needed. What is it that differentiates
    the leaders of successful versus unsuccessful organizational change efforts?


    To a large extent, we will attempt to answer that question in the remainder of
    this chapter. Undoubtedly, in a company as large as IBM or the former Kodak, one
    person alone cannot be responsible for the success or failure of the entire change
    process. However, people in leadership positions can play an especially large
    role. Let us take one of the larger-than-life icons of recent history in the business
    world, Steve Jobs, one of the founders of Apple. Jobs is known for many acts of
    leading and effecting change throughout a career that spanned approximately three
    decades. But one not-so-well known act was the use of a mouse on personal computers.
    Jobs came across the possibility of how a mouse could revolutionize personal computing
    around 1980 in the early stages of Macintosh development.[5] He and some colleagues
    at Apple witnessed a demonstration at a Xerox research and development laboratory

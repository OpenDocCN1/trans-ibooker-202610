  md: '# 8.4 Leading Virtual Teams


    **virtual team**

    A team that is geographically distributed, oftentimes relatively temporary in
    nature, and largely dependent on virtual media for communication purposes.


    Increasingly, people work in jobs that both allow and even require geographical
    dispersion, i.e., distally remote. Various forces are responsible for this trend.
    Most recently, the COVID-19 pandemic forced individuals and teams to work remotely
    using virtual technology. During the pandemic, university students clearly saw
    this happen through the use of such technologies as Zoom.[22] But even beyond
    educational settings, it is likely that after the pandemic, distally remote work
    will continue to increase.[23] Even before the pandemic, there were trends toward
    remote work, including globally-oriented business, individuals’ desires to work
    at least partially from their homes, and virtual technology that allows for dispersions.
    The upshot is that teams are, and will increasingly be, geographically distributed.
    In other words, members are spread out over widely diverse regions of the country
    or world. Oftentimes, such teams are relatively temporary in nature, perhaps focusing
    on a specific problem or project. Because of the dispersion, teams of this nature
    are forced to communicate through virtual media, such as email, chat systems,
    and video conferencing. Accordingly, the label **virtual team** is often used.


    There are advantages and potential disadvantages when leading virtual teams. Oftentimes,
    virtual teams are formed on a temporary basis. In such cases, team members are
    brought together from different localities of an organization who have the right
    mix of skills, know-how, and motivation to accomplish the team’s goals. Accordingly,
    from the get-go, the leader is presented with a situation in which he or she may
    not have to worry about having the complete set of skills and expertise that is
    necessary to accomplish the team’s mission. There is a high likelihood that such
    a mix has been designed into the team at time of selection.


    On the other hand, there can be challenges when it comes to leading virtual teams
    – both temporary and more permanent teams. Research has shown that less transformational
    leadership tends to occur, or at least be perceived, in virtual as compared to
    face-to-face teams.[24] As we will discuss in more detail in Chapter 11, transformational
    leadership is an especially effective form of leadership that stresses inspiration,
    change, and development. However, it may be difficult for leaders to show such
    leadership in a virtual setting.


    In highly virtual teams, there is also the issue of “out of sight, out of mind”.
    That is, virtual teams may be especially prone to the type of free-riding/social
    loafing problems discussed earlier in this chapter. Since members have little
    or no face-to-face contact with either the leader or other team members, they
    could become demotivated or simply “slip through the cracks.” This problem is
    accentuated by the fact that virtual teams are often subject to a matrix structure,
    whereby team members have permanent membership in another unit or team, while
    being assigned more temporary membership in the virtual team. When this occurs,
    the virtual team member may attempt to free-ride at times when more pressing matters
    occur in his or her permanent team.[25]


    As yet another example, in Chapter 7, we considered some of the problems that
    can result from communication through virtual media. In teams that are essentially
    not highly virtual (i.e., geographically proximal), communication such as email
    may still be used, even though face-to-face contact may be readily possible. However,
    virtual teams by definition rely predominantly on virtual media for communication.
    It follows that they are highly prone to the type of communication issues that
    were considered in Chapter 7. Thus, communication that is complex, interpersonal,
    or emotionally-charged may be especially difficult and problematic in virtual
    teams. Overall, problems of free-riding/social loafing and poor communication
    foster tendencies for virtual teams to have group process (i.e., group dynamics)
    difficulties.[26]


    How might some of these challenges be addressed by leaders? Although in some ways,
    the effective leading of virtual teams is similar to that of teams in general,
    there are some things upon which the virtual team leader should especially focus.
    *First*, it is a good idea that if at all possible, a virtual team should meet
    face-to-face early on (e.g., in the forming stage), in order to foster trusting
    relationships and ’gel’ as a team. In addition, leaders can use an initial face-to-face
    meeting (e.g.,'
  merge: -1

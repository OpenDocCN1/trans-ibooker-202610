  md: '# true resistors


    Employees in a change process who actively or passive-aggressively attempt to
    undermine change efforts.


    The resistors, or bottom one-third, pose a more serious challenge. As noted in
    our above example of the multinational bank, if left unchecked, these resistors
    can totally derail a change effort. It may be best to think of this bottom one-third
    in terms of bad versus worse. In other words, the “bad” are likely to stay relatively
    quiet. While they do not support change efforts, they also do not undermine them.
    Eventually, these individuals make a choice to either live with the change, or
    voluntarily depart the organization. On the other hand, a fraction of this one-third
    are “worse” in their behavior. They will actively or passive-aggressively attempt
    to undermine change efforts. Indeed, these “true resistors” are not just the problem
    of a higher-level change leader; they are also the nemesis of lower-level leaders
    who are responsible for implementing change. Fred Hasan, the former Chairman of
    Bausch & Lomb, is explicit about this, “The passive-aggressives are ones who on
    the surface appear to be nodding their heads, but they are actually not with you
    and they undermine culture change in a big way. You’ve got to get these types
    out of the system as soon as possible.”[12] Bottom line: “true resistors” must
    be dealt with directly, and if need be, in a harsh manner (i.e., firing).


    # Video Cases for This Chapter


    The video cases for this chapter illustrate leaders facing challenges associated
    with organizational change, especially those dealing with resistance. Although
    they come from many different backgrounds and industries, there is a common denominator
    in terms of their take on how to deal with “true resistors.”


    +   Nancy Barry—Getting Buy-In


    Nancy Barry was the President of Women’s World Banking from 1996–2006. The Bank
    promoted provided micro-finance lending to more than 20 million low income entrepreneurs.
    She describes how a small portion of employees will not embrace a change effort,
    and how to deal with those individuals. She differentiates between leading by
    consensus (i.e., in a network of stakeholders), versus leading more directly or
    forcefully (i.e., within her own team).


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_217_0.png)


    View in the online reader'

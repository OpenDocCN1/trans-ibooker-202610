  md: '# # Actions as a Leader


    As leaders, individuals can engage (or not engage) in a number of actions to demonstrate
    EML. We consider several key actions here: (1) serving as a role model for ethical
    values, (2) demonstration of courage, (3) enforcing ethical/moral standards, (4)
    openly communicating and sharing information, and (5) avoiding abusiveness. First,
    effective leaders in general, and ethical leaders in particular, realize that
    they are always "on stage," so to speak. So others are watching what they do,
    or not do. Ethical leaders "walk the talk." They do not expect others to do what
    they themselves are not willing to do. As an example, if a leader might expect
    a sales representative to not be exorbitant in terms of expenses that might be
    charged to a customer (e.g., meals or travel), the leader himself should practice
    such frugality.


    Second, moral courage involves the strength to work through challenges and fears
    that may involve moral principles or uncertainties. Oftentimes, this means nonconformity
    and speaking up when immoral behavior is perceived. This can obviously be a difficult
    thing for a leader. For example, a leader (or any organizational member) may observe
    that hiring, promotions, favorable job assignments, and so forth, may favor majority
    group members. However, people of color and different ethnic groups are left out.
    It can take courage to speak up and at least raise the possibility of injustices.[9]


    Third, and related to courage, EMLs make decisions that pertain to ethics and
    ethical infractions. Specifically, they enforce ethical standards, even if it
    might cause problems for the leader or be unpopular. Accordingly, the leader will
    show consistency in his or her enforcement of ethical violations, while avoiding
    making exceptions. Along with this consistency, the leader will show "sentinel-like"
    qualities in terms of monitoring his or her context for ethical violations. In
    some circumstances, it might be easier to simply adopt the maxim, "see no evil,
    hear no evil." However, an EML will think and act differently. At the same time,
    an ethical leader should be careful to not go too far in emphasizing the enforcement
    aspect of taking actions. If enforcement is overemphasized, negative fallout could
    occur in the organization, such as employee fear, lack of initiative, and lack
    of risk taking.


    At first glance, it might seem like the enforcement of ethical standards might
    be anathema to leading with love (see Chapter 2), and instead, might be more akin
    to leading through fear. But in reality, a leader needs to maintain and enforce
    ethical standards for the ultimate good of not just the overall organization,
    but also individual followers. For example, if a follower was continually violating
    ethical standards, it would do no good to just let the problem fester and linger.
    To demonstrate "tough" love, the leader would need to confront the issue, and
    perhaps even apply disciplinary procedures.


    Fourth, an EML will lean towards open communication and the sharing of information.[10]
    People in leadership roles tend to be privy to information that others at lower
    levels of the organization do not have. Nevertheless, the information can be relevant
    to those lower-level individuals in terms of their own personal needs and security.
    Examples include pending organizational restructuring (e.g., layoffs), negative
    information that could affect the future of the firm, radical changes in the technology
    that is used to accomplish work in a firm, and so forth. Organizations and their
    leaders who tend to not be open communicators might like to use expressions such
    as, "need to know basis," which would imply that only certain individuals (i.e.,
    typically people at higher levels of the organization) should be privy to important
    information. To be fair, there can be rational reasons as to why only certain
    people should be privy to certain information, especially information pertaining
    to potential change in organizations. Specifically, there could be the fear of
    widespread panic if certain information, such as a pending layoff, was publicly
    announced. With that said, the EML will attempt to be as open as possible by sharing
    information whenever possible. In so doing, he or she will be leading with love,
    rather than fear.


    In short, the idea is to try to avoid what has been humorously referred to as
    the mushroom perspective of leading: "keep them in the dark, feed them a bunch
    of crap, and hope that they will"'

  md: '7. Build on the change—Major change efforts are more like marathon races, rather
    than sprints. A few short-term wins do not guarantee long-term success. For this
    reason, leaders need to be careful not to declare victory too soon. This might
    include setting a series of goals to be accomplished and emphasizing the need
    for constant feedback and improvement.


    8. Anchor the changes in the organizational culture—As we discussed in Chapter
    12, culture can be thought of as a social control system that drives behavior.
    For a change effort to be sustained, it is important that the new ways of behaving
    are reflected in the culture. This may include the creation of new positions that
    embody the change effort and send a very clear signal to employees about what
    is important. For example, the appointment of a “Chief Innovation Officer,” who
    is part of the top management team, can signal to the organization a new emphasis
    on innovation and change. Further, Human Resource functions can be a powerful
    way of communicating what is important during a change effort. Changes in how
    promotions and rewards are allocated are critical, and must be seen as aligning
    with change efforts. However, as also noted in Chapter 12, the big danger in a
    change effort is that the existing formal reward system (e.g., money and promotion)
    may not become aligned with the desired new behaviors. If through reward systems,
    leaders continue to reward the old way of doing things (i.e., the old culture),
    while professing to hope for changed behavior, the inconsistency will be glaring
    and demotivating.


    In sum, Kotter’s eight-step model elaborates on the unfreeze-change-refreeze logic.
    The first three steps (sense of urgency, form a powerful coalition, and create
    a vision) suggest ways to unfreeze from the current state, and get people mobilized
    for change. Steps four to six (communicate the vision, remove obstacles, and create
    short-term wins) are ways that a leader can implement the change. The final two
    steps (build the change and anchor the change in the culture) are ways leaders
    can refreeze or sustain the change.


    Both of these models emphasize the need for leaders of change to accomplish two
    important tasks. First, there is the need to help those who are affected by the
    change to understand why it is necessary and important that they support the change
    effort. This can occur by both creating a sense of anxiety (i.e., if change does
    not occur) and offering a positive sense of future opportunity (i.e., through
    new vision). Second, change leaders need to have a comprehensive plan for implementing
    the change that allows them to ensure that the change effort is systematic and
    controlled.


    One thing that stands out in Figure 13.2 is the purple box. Although change needs
    to be anchored in the existing organizational culture, there is also the long-term
    reality that change is ongoing. So although leaders want change to “stick,” so
    to speak, they also want to keep their eyes on the future and the potential need
    for additional change. In other words, at least in the long-term, change should
    be viewed as an ongoing process.


    A key reality in applying these models to real-life situations is that leaders
    need to acknowledge and deal with resistance to change.[10] Leaders of successful
    change efforts need to anticipate this reality and have a plan to overcome resistance.
    The following section will suggest a number of strategies and tactics that can
    help deal with resistance.


    # Dealing With Resistance to Change


    U.S. Army General Patricia McQuiston has said that, “People don’t hate change.
    They hate change that is forced upon them.”[11] In reality, there are various
    shades of perceptions toward change, ranging from eagerness to pursue it, to outright
    despise or fear of change. Regardless, resistance to change is a normal and inevitable
    part of the process of organizational transformation. As we described earlier
    when discussing the “paradox of success,” organizations survive partly because
    they learn over time and get successively better by incorporating this learning
    into how they operate (their systems, processes, structures, metrics and culture).
    Like organizations, people do the same. Through experience, we hone our skills
    and get better at our jobs. These processes make us'
  merge: -1
  img_proc: true

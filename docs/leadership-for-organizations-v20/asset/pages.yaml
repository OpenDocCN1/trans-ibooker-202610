    But where should a leader interested in building and shaping culture begin? Although
    there is a great deal of interesting research on all three of these levels that
    are depicted in Figure 12.1, and each can be important, from a leadership perspective,
    it is most useful for us to focus on norms and values because these can be shaped
    and managed directly.[10] From this perspective, cultural norms and values can
    be reinforced by leaders and the systems that those leaders put into place (e.g.,
    what is measured and rewarded in performance appraisal systems).


    # How Norms Affect Behavior


    In the 1970s, Phil Zimbardo, a Stanford Professor, conducted an experiment in
    which students acting as guards in a mock prison began to abuse the other students
    who were prisoners.[11]


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_191_0.png)


    In the well-known Milgram experiments in the 1960s, subjects were asked to give
    an increasing level of electric shocks to another person when that person failed
    to answer correctly.[12] Results typically show that when pressured by an authority
    figure (i.e., experimenter), more than 60 percent of participants are prepared
    to deliver what they think could be a fatal electric shock. Why would people behave
    this way?'

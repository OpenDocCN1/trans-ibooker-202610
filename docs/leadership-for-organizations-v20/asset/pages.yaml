    # Some Hard Bumps Along the Path of Change


    Despite the accomplishments and outcomes summarized thus far, there have been
    some definite bumps along the way for ASU and Michael Crow over the past 20 years.
    That is, the path toward change has not always been smooth, and some might argue
    that the bumpiness could have been predicted and even prevented. Some of the challenges
    have been due to economic problems in AZ and the country as a whole. But others
    are more personal to Michael Crow, his style of leadership, and approach toward
    change.


    # Institutional and Economic Challenges to Change


    Making broad-sweeping change in an academic institution is not an easy thing to
    do. There are a number of institutional challenges. First, bureaucracy is one
    such challenge because of how it represents an obstacle to change, de-empowering
    people to act in accordance with the goals of change. Crow himself has referred
    to it as "the virus of the agency".[22] Bureaucracy involves rigid adherence to
    rules and procedures, despite conditions that might dictate that such rules or
    procedures be softened or even altogether ignored. In a speech as early as the
    fall of 2002, Crow told ASU faculty and administrators that even after just three
    months as president, he had noticed what seemed to be an incredible amount of
    bureaucracy at ASU. Nevertheless, 20 years later, the bureaucracy at ASU seems
    to be going strong in terms of paperwork, rules, and rigid procedures for students,
    faculty, and staff alike. Indeed, in some ways, the COVID-19 pandemic only served
    to increase bureaucracy at ASU.


    Second, there is the issue of faculty governance, which is a hallmark principle
    in academic institutions across the United States—as well as in many other countries.
    The basic idea is that that much of the strategic governance of the university
    should emanate from faculty members. Relevant aspects of governance include policies,
    curricula and programs, and evaluation procedures (e.g., evaluation of the faculty).
    Crow''s top-down approach to change is not always congruent with faculty governance
    traditions and expectations. We know from research that a lack of voice on the
    part of employees tends to reduce organizational commitment.[23]


    Third, additional long-standing norms or beliefs present challenges to the types
    of changes that Crow seeks. Despite recent claims to the contrary (see http://vimeo.com/110929715),
    other than some new colleges (e.g., Sustainability), there is little evidence
    of interdisciplinary teaching and research within the ASU system, and little evidence
    of increased entrepreneurship. As is the case at most traditional universities,
    ASU''s organizational structure and systems (e.g., promotion and tenure systems
    for faculty members) largely continue to support a functional, "silo" approach
    that stresses disciplinary specialties—not interdisciplinary thinking and action,
    or entrepreneurship (e.g., on the part of faculty members).


    As a further example of entrenched norms or beliefs, many faculty members and
    students have their doubts about the inclusiveness principle. Simply stated, they
    believe that it''s a code word for lowering standards and allowing students into
    the university who are either unprepared or sim-'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'ply lack basic abilities. Many faculty members and students further believe,
    right or wrong, that the true motive is to receive more tuition money from students,
    as well as more allocation of state, federal, and private (i.e., donor) funds.
    The above-mentioned partnership with Starbucks could be viewed largely as an attempt
    to increase student tuition revenue through various sources, including both federal
    and private (e.g., Starbucks) funds. For Starbucks, support for a single, online
    program through ASU might lessen pressures on store managers to make scheduling
    accommodations for employees who attempt to attend traditional university classes
    while maintaining their jobs. As such, for both ASU and Starbucks, it is questionable
    as to whether the initiative truly represents an attempt to "do good," versus
    being more economic or strategic in terms of its motives.[24] Moreover, there
    is some evidence that the goal of inclusiveness, especially if it is based largely
    upon online education, makes it all the more difficult to achieve university retention
    goals, and thus, keep the university highly ranked.[25]


    Finally, there have been some significant setbacks along the way. As shown in
    Figure 1, early on Crow noted the importance of having a medical school as part
    of ASU. Commonsense would suggest that a glaring deficiency in a metropolitan
    area the size of Phoenix is the absence of a major medical school that is associated
    with a university in the local area. From the beginning, Crow recognized this
    deficiency, as well as the potential of a medical school to add significant research
    funding possibilities for the university. However, he also noted the difficulties
    in starting such a school from scratch (e.g., the need for state and federal funding).
    Thus, he attempted a partnership with the University of Arizona, which saw benefits
    in expanding its own medical school efforts into the Phoenix area. But because
    of economic concerns in the state of Arizona and other reasons that have not been
    made public,[26] in the spring of 2010, the joint venture was dissolved. Subsequently,
    it appears that the University of Arizona will go it alone to expand its own medical
    school into the downtown Phoenix area.


    More recently, and to his credit, Crow has developed a partnership with the Mayo
    Clinic, to pursue medical education in Scottsdale. Some ASU faculty are now associated
    with this effort, and research grant dollars (that are typically generated by
    medical schools) flow into ASU. Thus, ASU may reap some of the benefits of a medical
    school without having one formally under its control.


    # # Michael Crow as a Leader of Change


    No one can question that Michael Crow has been a force for change, personally
    spearheading a number of changes at ASU during his tenure as President. But just
    as Crow has had his supporters, he has also had his critics and detractors—both
    internally and externally. Favorable versus problematic or challenging aspects
    of his leadership approach are summarized in Section 5 at the end of this case.
    These issues are considered below.


    # ## Favorable Qualities


    On the positive side, Michael Crow has clearly shown visionary qualities. Especially
    early on, he was able to light a fire for change by putting forth new, bold, value-laden
    ideas and goals that projected out in the future—and by framing such change as
    being absolutely necessary to meet budgetary challenges and increase the stature
    of the university. Indeed, especially in his early years at ASU, he had been known
    to talk about ASU thirty and forty years into the future, as well as how steps
    taken in the present pave the way for that future. He has also been a staunch
    defender of the university. In the midst of budget cuts in 2009 (i.e., the height
    of the recession), Crow went to the media, including television shows, to make
    a strong case against the state legislature and its proposed budget cuts. He went
    so far as to claim that such cuts to Arizona universities would condemn the state
    to "third-world status" in the future.'

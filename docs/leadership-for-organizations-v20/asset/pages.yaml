- pgno: 30
  md: '# A Look Into the Future


    A colleague of ours routinely admitted to his students that several years after
    taking his course, students would forget 99 percent of what they learned. He went
    further to suggest that such is the case for all courses that students take, not
    just his own. Such a large percentage may be a bit of an exaggeration, and it
    might vary from course to course. Nevertheless, his basic point is well taken.
    Our colleague went on to further explain to students that despite the overwhelming
    amount of course material that would be forgotten over time, he hoped that some
    key principles would be remembered throughout the years and careers of students.
    We agree with our colleague, and accordingly have derived our own list of 6 principles
    pertaining to effective leadership that we hope students will remember years after
    attending this course. These principles will be stressed throughout the course
    and the videos:


    +   1. Consider leaders, followers, and the context. For many people, effective
    leadership is all about effective leaders. Undoubtedly, aspects of the individual
    leader (e.g., personal characteristics and behaviors) are important in leadership
    processes. But perhaps to the surprise of some, aspects of followers are highly
    important as well. It may seem counterintuitive, but at least to some degree,
    leaders can only influence if followers allow them to.²⁰ Moreover, when followers
    demonstrate the type of followership that we consider in Chapter 4, there is a
    good chance that people in leadership positions will be better leaders. As the
    adage goes, “it takes two to tango.” In addition, as suggested above and reinforced
    in Chapter 5, we cannot truly understand effective leadership without a handle
    on the context or situation in which leaders and followers are interacting. It
    probably is not too hard to imagine that day-to-day “normal” situations might
    require a different form of leadership, as compared to when a crisis is occurring.
    In short, an understanding of effective leadership processes inherently involves
    the simultaneous consideration of leaders, followers, and the context. This combination
    is shown in Figure 1.1.


    FIGURE 1.1 Determinants of Leader Effectiveness


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_30_0.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   2. Lead-by-example. Effective leaders never expect followers to do things
    that they would not do themselves. Throughout history, the most inspiring combat
    leaders have been those who were out in front of their soldiers. Modern organizations
    are certainly not analogous to combat, but nevertheless the principle of leading-by-example
    is still valid. For example, in better service-based organizations, it is not
    surprising to see people in leadership positions engaging in frontline, customer
    service activities, especially during peak times. As another example, during the
    COVID-19 pandemic in 2020 and 2021, we saw a number of political leaders who strongly
    suggested that to avoid the spread of the virus, citizens should avoid travel
    during holidays. But yet, they themselves were caught traveling to visit family,
    or simply for pleasure. Such incongruent behavior does not inspire confidence;
    nor does it make followers (in this instance, citizens) follow other directives
    that might be issued. Hypocrites cannot (or at least should not) be viewed as
    leaders.


    +   3. Lead-by-walking-around. For some reason, people in leadership roles oftentimes
    think that they can stay physically separated from the people who they lead. Nothing
    could be further from the truth. The best leaders are those who get out among
    the people who they are leading. They do so not for the purpose of checking up
    on them, but rather to show that they are concerned and want to serve or help
    their followers. A person who was notorious for leading-by-wandering-around was
    Sam Walton, founder of Walmart. Walton became known for how he would drive his
    pickup truck around to various Walmart stores, rather than staying confined to
    corporate headquarters.


    +   4. Give recognition. People in leadership roles are often stingy when it comes
    to giving praise or recognition. Dick Kovacevich, the former CEO of Wells Fargo,
    claimed that “Recognition is the highest return, most undervalued management tool
    in America.”[22] Simple praise costs nothing, and it is rare to find people who
    feel like they have received enough praise in their jobs. The bottom line is that
    simple praise, as long as it is sincere, is highly motivational to people, and
    effective leaders are not afraid to dish it out.


    +   5. Think and act paradoxically. A paradox involves two seemingly opposite
    phenomena that would appear to be in conflict and irreconcilable. But nevertheless,
    the two phenomena (or poles of a paradox) are interdependent and need to be harmoniously
    reconciled over time in order to achieve effectiveness.[22] When a leader thinks
    and acts paradoxically, that person does not engage in “either-or” choosing of
    a paradoxical pole, but instead, embraces both poles simultaneously in a “both-and”
    sort of manner. As an example, in Chapter 2, we will see how oftentimes, the best
    way for a leader to gain control is by giving up control. On the surface, these
    would seem like irreconcilable notions. However, in reality, leaders find that
    the gaining of control of organizational effectiveness can best be achieved by
    giving up much control to followers—or allowing more autonomy. We will explore
    a number of other leadership paradoxes in this book.


    +   6. Be here now. Back in the 1970s, Ram Dass wrote a book entitled, Be Here
    Now.[23] In many ways, Dass was ahead of his time in that he talked about the
    need for people to truly experience the present and be mindful. Since then, advancing
    technology (e.g., cell phones) and cultural norms (e.g., multi-tasking) have pushed
    people towards not experiencing the here and now; that is, not experiencing being
    in one time and place in one’s consciousness. In other words, and to use more
    current terminology, the modern world pushes us to not experience mindfulness.
    For example, while carrying on a verbal conversation with an individual who is
    physically present, one might simultaneously be eyeing his or her cell phone and
    responding to text messages. The obvious result is split attention. However, to
    a large extent, leadership is not a split attention game. Andy Card, President
    Bush’s chief of staff, said that “You shouldn’t leave the room until the door
    is shut,” meaning that a leader needs to be solely focused on the conversation
    at hand.[24] In the above example, if a leader is having a conversation with a
    follower who is experiencing performance or personal problems, that follower needs
    the leader’s undivided attention and mindfulness. At that point, in order to “be
    here now,” the leader needs to turn off the phone and be totally available for
    the follower.'

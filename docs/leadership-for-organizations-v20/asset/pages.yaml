- pgno: 22
  md: '# # CHAPTER 1

    # Introduction


    > > "Before you are a leader, success is all about growing yourself. When you
    become a leader, success is all about growing others." —Jack Welch, former CEO
    of GE


    > > "Leadership is the art of getting someone else to do something you want done
    because he wants to do it." —President and General Dwight D. Eisenhower


    # ## Learning Objectives


    +   1. Define organizational leadership.

    +   2. Describe the difference between leadership and management.

    +   3. Summarize the ways that leaders are both born and made.

    +   4. Explain how organizations benefit from leadership.

    +   5. Discuss the importance of context to leadership.

    +   6. Describe how leadership can be learned based on both science and as an
    art.


    Various writers, pundits, and executives have argued that leadership is the key
    to sustained competitive advantage on the part of organizations—both in the United
    States, as well as internationally. On the other hand, many people have grown
    cynical about existing people who are in leadership positions in both public and
    private sectors. Such cynicism is not surprising given alarming corporate scandals
    in recent years, a lack of accountability on the part of individuals in leadership
    roles, and stories of unethical or abusive management practices by supervisors,
    mid-level managers, and executives. Nevertheless, it is clear from research that
    increasingly, the possession of leadership qualities and the display of effective
    leader behaviors are requirements for organizational effectiveness, as well as
    for individuals attempting to progress in managerial positions in their careers.[1]
    As such, it is important for aspiring managers to learn about the nature of effective
    leadership practices and how they can develop their own competencies in this area.
    In short, leadership qualities represent a source of competitive advantage for
    both you and the organizations in which you will be associated. But what is effective
    leadership all about?'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# # 1.1 Defining Organizational Leadership


    **leadership**

    The process of exerting intentional influence toward the ideas, beliefs/values,
    capabilities, and behaviors of others, willingly on their part, toward an organizational
    goal(s) or vision.


    Various definitions of **leadership** can be found in the literature. For example,
    Gary Yukl, a renowned leadership scholar, defined leadership as “a process whereby
    intentional influence is exerted over other people to guide, structure, and facilitate
    activities and relationships in a group or organization.”[2] Our own definition
    is more specific in terms of what that influence is all about: the process of
    exerting intentional influence toward the ideas, beliefs/values, capabilities,
    and behaviors of others, willingly on their part, toward an organizational goal(s)
    or vision.


    Several things should be noted regarding our definition. First, although the term
    “leadership” has been applied to inanimate organizations (e.g., XYZ firm is a
    technological leader in the computer industry), we view leadership as something
    that is shown by individuals, rather than organizations as a whole. In other words,
    people show leadership, not organizations.


    Second, leadership is a process, rather than simply referring to people in formal
    leadership roles. Common parlance might refer to particular individuals as “leaders”
    in their respective organizations, simply because of their job titles. However,
    we argue that just because an individual occupies a formal leadership role (e.g.,
    supervisor or manager), it does not necessarily mean that the person demonstrates
    leadership.


    Third, beyond people in formal leadership roles, leadership could involve other
    individuals, or what might be termed “informal” leaders. You have probably known
    such people who, although they had no official leadership title, they routinely
    influenced their coworkers. We will consider informal leadership in some detail
    in Chapter 8.


    Fourth, organizations have various levels at which leadership might be exhibited.
    These include individual, group or team, and organization levels. We will focus
    on particular levels in certain chapters. For example, we target the individual
    level, or one-on-one leadership in Chapter 3. Team-level leadership is the subject
    of Chapter 8. Organizational or strategic leadership is considered in Chapter
    12 and Chapter 13. Although there are commonalities in terms of effective leadership
    behavior at each of these levels, there are also differences. For example, visionary
    leadership, a topic that we address in Chapter 11, is most relevant at executive
    or strategic levels. However, it is also relevant when leading individuals and
    teams.


    Fifth, and perhaps most importantly, leadership is an active process, and it is
    positive in the sense that individuals are willingly influenced, rather than coerced
    or bullied. Thus, what has been termed laissez-faire is not leadership because
    it is inactive in the sense of avoiding interactions with followers, not being
    present when needed, or not making decisions.[3] A good example of laissez-faire
    can be seen in the inactions of Lieutenant Norman Dyke, Jr. in the HBO series,
    *Band of Brothers*.[4] Lieutenant Dyke was frequently missing when the men under
    his command needed support or direction. Most importantly, he failed to make decisions,
    which is an important type of leader behavior. In addition, negative actions like
    coercion, bullying, and abusiveness do not constitute what leadership is all about.
    For example, actions such as ridiculing followers in front of their peers runs
    counter to effective leadership.[5]'

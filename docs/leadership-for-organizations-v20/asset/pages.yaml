  md: '# # CHAPTER 4

    Followership: Managing Up and Sideways


    > > "Followers are more important to leaders than leaders are to followers." —Bob
    Nelson, author and management consultant


    # ## Learning Objectives


    +   1. Identify effective versus less effective follower types.

    +   2. Recognize the specific actions that are typically taken by more effective
    followers.

    +   3. Appreciate specific actions that can be taken to effectively manage up
    and sideways.


    Not everybody identifies with being a leader. In other words, some people do not
    see themselves as leaders, and when they become members of organizations (business
    or otherwise), they are not likely to aspire to formal leadership roles. Nevertheless,
    as we will see in Chapter 8, organizational members are increasingly expected
    to share the leadership role with their fellow coworkers, as well as the boss.
    So like it or not, it is becoming increasingly difficult to escape from the role
    of leader.


    But with that said, one thing is for sure: organizational members are all followers.
    That is, we all have a boss or an individual who monitors our behavior, whether
    or not we are fulfilling the requirements of our job descriptions, and the extent
    to which we are contributing to organizational goals. Accordingly, when we go
    to work for organizations, we all need to practice good followership.[1] And related
    to good followership, we need to manage effectively in an upward direction (i.e.,
    toward the boss). In some ways, it may sound odd to "manage" upwardly. It is commonly
    conceived that management is a downward process—from those with organizationally
    provided authority, to those who have less authority. Yet in reality, it is not
    only possible for followers to exercise upward management, it is also a necessity.


    In this chapter, we address three primary issues. First, we examine the nature
    of effective followership by comparing it to other, less effective, types of followership.
    Second, we identify positive means of managing upwardly. As a special topic of
    particular importance in modern times, we address whistleblowing, and how it pertains
    to followership and managing up. Third, we deal with an influence-related issue
    that is often forgotten, but nevertheless important—how to manage sideways in
    dealing with peers.


    # ## 4.1 Types of Followers


    One thing that should be dispelled from the get-go is that good followership equates
    to being a "yes man," or "yes woman," or what is commonly known as "brown-nosing."
    The basic notion is that good'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'followership simply boils down to always agreeing with the leader or lots of
    ingratiation behaviors. Yes, it is true that many leaders overtly or more subtly
    encourage such behavior on the part of followers. However, behavior of this sort
    is not good for leaders, followers, or their organizations in the long run.


    Before we actually describe what effective followership is all about, we first
    provide a rationale for why it is so important for organizations. One way to understand
    the importance of effective followership is to consider what can happen in the
    leader-member exchange (LMX) processes that were considered in Chapter 3. When
    a follower is a “yes” man or woman, the proverbial “brown-noser,” or just simply
    withdrawn and passive (e.g., barely meeting minimal work expectations), the LMX
    relationships could get strained, eventually leading to the follower being relegated
    to the leader’s out-group. Perhaps in some instances, leaders will like a follower
    who always agrees with, or ingratiates, him or herself to the leader. However,
    especially for effective leaders, such follower behavior tends to run thin over
    time, and a leader will expect the type of effective follower behavior that we
    consider below.


    At the organizational level, when followers are generally just agreeing with leaders
    and “sucking up,” we can expect to see a lack of initiative, creative problem-solving,
    and an upward flow of important information that leaders need to make better decisions.
    The matter gets even worse if some followers retreat into silence and lack of
    engagement, and only do their jobs according to established expectations (e.g.,
    in line with their formal job descriptions).


    # Effective Versus Less Effective Follower Types


    As shown in Table 4.1, follower effectiveness can vary along three dimensions:
    (1) thinking style, (2) level of engagement, and (3) loyalty to the leader.<sup>[2]</sup>
    First, followers who are independent, critical thinkers are inquisitive, do not
    take things at face value (e.g., question supposed “truths” or established ways
    of doing things), and attempt to show creativity and innovative approaches to
    work and problems. On the other hand, followers who are dependent, uncritical
    thinkers accept the status quo and established ways of thinking and acting. They
    pursue performance expectations, but do not attempt to be very creative or innovative.


    | Type of Follower | Thinking Style | Level of Engagement | Loyalty to the Leader
    |

    |---|---|---|---|

    | Conformist | Dependent, Uncritical | ? | Strong |

    | Alienated | Independent, Critical | Unengaged | ? |

    | Effective | Independent, Critical | Engaged | Strong |


    Second, followers can be either highly engaged, or disengaged. To be engaged,
    means to be fully committed to one’s job and to the responsibilities that it entails.
    Such individuals are self-starters, rather than waiting to be told what to do.
    Although they are adept at following instructions and established procedures,
    they are also likely to go beyond the basic requirements of their jobs and engage
    in what is known as organizational citizenship behavior.<sup>[3]</sup> This behavior
    includes doing extra or discretionary things to improve the organization and its
    image, and helping coworkers or new people who may be struggling. Conversely,
    a less engaged follower is not so committed, does demonstrate organizational citizenship
    behavior, and may even appear to be lazy or irresponsible. In addition, an engaged
    follower takes responsibility for their own development, rather than simply waiting
    for the leader or organization to suggest training and development opportunities.


    Third, followers can demonstrate varying levels of loyalty to the leader. A highly
    loyal follower would be very truthful to his or her leader, and never attempt
    to undermine the leader’s efforts, either in private or in public. Notice that
    this is not the same as being a “yes man or woman” or'
  merge: -1
  img_proc: true

    Limited scope. Situational leadership generally represents a somewhat reactive,
    short-term, or maintaining the status quo approach to effective leadership. But
    in reality, some leadership actions should be more long-term and oriented toward
    change. Moreover, there are a number of contemporary issues in leadership that
    are simply not considered, at least directly, by situational leadership. These
    issues will be addressed in the remainder of this book, and they include such

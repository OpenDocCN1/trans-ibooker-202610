  md: '# Bill Campbell—Gaining Commitment


    Bill Campbell was a successful CEO and a noted advisor and coach to other high-tech
    CEOs, including Steve Jobs. He describes how he tried to enlist the cooperation
    of a recalcitrant subordinate who continued to resist a change effort, and what
    actions he took in the face of this resistance.


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_218_0.png)


    View in the online reader


    # Conclusion


    Some people might argue that at its most basic element, leadership is really about
    change. The role of a senior leader is to anticipate threats and opportunities
    and to help the organization address these issues. This chapter has described
    why this process is becoming more important as the pace of change accelerates
    in the business world, and how leaders might think about implementing change.
    We have provided both a conceptual framework to think about different types of
    change that might confront leaders and offered a set of practical steps that a
    leader might take to increase the probability of successful change. In Section
    5, we have included a detailed case on the leading of a major change effort at
    Arizona State University over the past twenty years. The case represents an institutional
    setting (i.e., universities) in which major change is especially challenging.


    # 13.4 Discussion Questions


    +   1. Based on Figure 13.1, why is proactive, discontinuous change the most challenging
    for leaders?

    +   2. In which stage(s) is leadership behavior most clearly represented in the
    8-stage model of planned organizational change that is displayed in Figure 13.2?

    +   3. When it comes to dealing with resistance to change, what is the 1/3 rule
    all about, and how does it pertain to leading change? How is dealing with “fence-sitters”
    relevant to the 1/3 rule? How is dealing with “true” resistors” relevant to the
    1/3 rule?'

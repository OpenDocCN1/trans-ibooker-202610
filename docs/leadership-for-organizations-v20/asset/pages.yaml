- pgno: 28
  md: '# # 1.3 Approach and Organization of the Chapters of This Book


    # # Leadership Is Both a Science and an Art


    Some people might claim that an understanding of leadership is just common sense.
    But then again, there is a saying, “Common sense is like deodorant. The people
    who need it the most don’t use it.” Perhaps something similar can be said about
    leadership. All joking aside, while some of what we report in this book may seem
    like commonsense, one big problem with relying on commonsense is that it can vary
    among individuals. In other words, what may seem like commonsense to one individual
    might actually seem wrong or contraindicated by another. As an example, consider
    a person in a supervisory position who has a follower who has a new baby at home,
    and that baby has been keeping him or her up at night. It might seem commonsensical
    that the follower should be shown a high degree of support from the supervisor,
    even to the point of allowing the follower’s performance to slip for a period
    of time. On the other hand, another individual’s commonsense might be more skeptical,
    and say that it all depends on the situation and whether the individual’s performance
    is critical to the team. While some research on leadership has largely confirmed
    what might be intuitive or held as commonsense on the part of many people, much
    research has also identified seemingly counterintuitive aspects of effective leadership.
    In short, in this book, we rely largely on scientifically-based research to tease
    out our understanding of effective leadership.


    Furthermore, we recognize that leadership can be understood and learned through
    role modeling, practice, feedback, and experience. With that said, we suggest
    that experience as a way of learning about effective leadership can be a double-edged
    sword. We have known people who have attempted to teach leadership through their
    own eyes and personal experiences. In many cases, individuals have a wealth of
    good experience from which they can draw to help others develop their own leadership.
    Nevertheless, there is another old saying, “While learning through experience
    is good, learning from the experiences of others is even better.” What this means
    is that even the most experienced leader should not over-generalize principles
    of good leadership based on his or her own experiences. Instead, the wisest approach
    is to take into account the experiences of others, as well as what systematic
    research has revealed.


    In summary, our approach is based on three key principles or techniques. First,
    we base much of what is written in this book on systematic research. Second, we
    use case videos to help students learn through the role-modeling of actual, real-life
    leaders. Role-modeling is known to be an effective means of developing leaders,
    and our video-based approach is equipped to take advantage of this principle.
    Many of the leaders who are featured in the videos are in first-time or lower-level
    leadership positions, with which many students can readily identify. Students
    can use material in this book to help them analyze the situations and leadership
    dilemmas that are described by the individuals in respective videos. Third, students
    will learn through story-telling, which is not only an effective means of practicing
    leadership, but also developing one’s own leadership capabilities. In other words,
    students can develop insights and skills (and role models) by hearing the stories
    of individuals who have faced leadership challenges, and then made decisions or
    taken actions to deal with those challenges.


    Role models (both positive and negative) for effective leadership can be found
    in a variety of media or sources. One prominent source is cinema, including movies
    and miniseries. In other words, cinematic productions often portray leaders and
    leadership principles that align with much of what you will see in this book.
    One such cinematic production, Band of Brothers, was a miniseries that aired on
    HBO. It portrays the story of a company of men and their leaders in the U.S.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Airborne infantry in WWII. The nature of this miniseries and examples of how
    its characters illustrate both effective and ineffective leadership can be found
    in Section 5. Red Tails is another cinematic production that is also described
    in Section 5. It involves the story of the Tuskegee Airmen, Black pilots and support
    staff who displayed excellent performance in fighting the German Luftwaffe in
    WWII, two leaders of the Red Tails are featured in Section 5.


    # # Organization of This Book


    The chapters are divided into three sections:


    +   - I. Foundations for effective leadership

    +   - II. Contemporary issues with leadership

    +   - III. Visionary and strategic leadership


    In Part I, we primarily overview topics that have received a lot of traditional
    attention in the field of leadership. These topics include leadership characteristics
    (e.g., traits and behavioral styles), relationship building, followership, and
    situational/contingency leadership. Although these areas are somewhat traditional
    in leadership thinking, we will add a few new twists. For example, we will describe
    the principle of “leading with love” as a means of demonstrating people- or relations-oriented
    leadership. We will further introduce political savvy as a way of thinking about
    relationship-building that leaders use beyond one’s immediate subordinates or
    team members


    In Part II, we go into areas that have received more contemporary attention. In
    other words, these areas are prominent in more recent thinking about effective
    leadership. They include ethical/responsible leadership, feedback processes, team
    and shared leadership, and leadership in diverse environments. Some especially
    interesting and timely issues will receive attention. For example, we will highlight
    how leadership intersects with corporate social responsibility, how feedback receiving
    is equally important for leaders as is feedback giving, and how diversity issues
    for leaders can be considered in both domestic and cross-cultural ways.


    In Part III, we focus on more strategic issues pertaining to leadership. We begin
    this section with inspirational/visionary leadership, which while applicable at
    all levels, takes on special relevance at strategic levels of leadership. We then
    conclude with chapters dealing with how leaders help to form or shape organizational
    culture, as well as lead organizational change.


    # # Video Cases for This Book


    Video cases are an integral part of this book and associated learning. Not only
    do these videos bring to life the material in the various chapters, they are based
    on two key learning principles. First, students will learn through the role-modeling
    of actual leaders in these videos. Role-modeling is known to be an effective means
    of developing leaders, and our video-based approach is equipped to take advantage
    of this principle. Second, students will learn through story-telling, which is
    not only an effective means of practicing leadership, but also developing one’s
    own leadership capabilities. In other words, students can develop insights and
    skills (and role models) by hearing the stories of individuals in these videos
    who have faced leadership challenges, and then made decisions or taken actions
    to deal with those challenges.


    There are two types of video cases that are featured. First, capstone cases depict
    leaders, who are often at very high levels of their organizations (e.g., CEOs),
    give their brief takes on leadership processes, qualities, or particular incidents.
    Second, incident cases generally depict lower-level leaders and their description
    of particular incidents that they have experienced, how they handled those incidents,
    outcomes of their actions, and lessons that they learned.'

  md: '# # 7.4 Appendix: Feedback Orientation Survey


    Respond to the following statements. If the statement is mostly true of you or
    your beliefs, then respond "T". If it is mostly false regarding you or your beliefs,
    respond "F".


    | Statement | Answer |

    |---|---|

    | 1. I can''t stand to hear about my failures. | |

    | 2. If somebody wants to give me negative feedback, I would just as soon that
    they keep it to themselves. | |

    | 3. I tend to get physically upset when I hear bad or unfavorable things about
    me. | |

    | 4. I try to avoid situations where my failures or imperfections might be seen
    by others. | |

    | 5. If I have to receive feedback, I would much rather that it reveals my competencies,
    rather than exposing my imperfections. | |

    | 6. I believe that the only good reason for getting feedback is to receive acknowledgement
    from others regarding one''s positive traits or performance. | |

    | 7. I know that I am competent, and I like to hear others confirm my perception
    of myself. | |

    | 8. I only want to hear when others have good things to say about me. | |

    | 9. I feel like I can definitely learn when others provide me with negative feedback.
    | |

    | 10. The primary goal of getting feedback should be to learn and improve, not
    to get praise from others. | |

    | 11. It''s not so important to get feedback unless that feedback provides information
    that will allow me to improve myself. | |

    | 12. I try to embrace, rather than avoid, information that will reveal my weaknesses
    or faults. | |


    # ## Scoring


    Questions 1–4 reflect an avoidant orientation; questions 5–8 reflect a performance
    prove orientation, and questions 9–12 reflect a learning orientation. Add up the
    number of “T” responses that you had for each orientation. If that score is 3
    or 4 on a given orientation, this means that you are especially oriented in that
    direction in terms of seeking and receiving feedback. For example, a score of
    4 on learning orientation would suggest that you truly desire feedback, even if
    it is negative.'

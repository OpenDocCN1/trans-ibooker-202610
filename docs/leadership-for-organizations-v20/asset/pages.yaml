  md: '# # Dedication and Acknowledgments


    I (David A. Waldman) would like to dedicate this book to my mother, Ida Waldman,
    and my deceased father, Lester Waldman. If one is lucky, the leadership that is
    experienced in life begins in the home. I was lucky enough to have two parents
    who together served as leader role models for me. And for that leadership, I will
    be forever grateful. I would further like to dedicate this book to three iconic
    giants in leadership thinking—Bernard Bass, Robert House, and Boas Shamir—all
    three of whom served as mentors in my development as a leadership scholar. Finally,
    I want to thank all of my past and present students. Learning is a two-way street,
    and many of the ideas and examples that I have learned from students have found
    their way into this book.


    Charles O''Reilly would like to dedicate this book to all the past students who
    have gone on to assume leadership roles and, in doing so, have assumed responsibility
    for others'' hopes, dreams, and, in some cases, for their very lives.


    Together, we would like to acknowledge the extraordinary efforts of Susan Feland
    at Stanford''s Graduate School of Business, who has been the driving force behind
    the development, production, and distribution of the video cases that are featured
    in this book. In addition, Michael Anderson and Matt Downs are two Stanford graduates
    who developed the initial set of videos and demonstrated that they could be a
    powerful way to help students learn about and develop leadership.'

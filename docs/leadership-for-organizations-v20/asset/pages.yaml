  md: 'orate, annual award ceremonies with rewards of jewelry, fur, luxury cars, and
    so forth for employees.[25]


    # 3. Clear signals through stories, specialized language, and symbols.


    Strong culture organizations typically are very clear in communicating how they
    expect people to behave, sometimes even signaling that the organization is not
    for everyone, and perhaps only special people will succeed (e.g., “The few. The
    proud. The Marines.”). These messages are relentlessly communicated through stories
    that provide vivid illustrations of employees whose attitudes and behavior exemplify
    the culture. They celebrate these individuals and often make heroes of them. Sometimes
    stories are told by leaders themselves, although it is also possible that cultural
    messages are spread by employees, customers, and other surrogates of leaders.[26]
    In addition, leaders and employees may use certain phrases, slogans, or terms
    that are special to the organization and reinforce membership and inclusion (e.g.,
    “Googlers,” “All for one and one for all”). Further, symbols or symbolic actions
    can signal aspects of a culture. For example, imagine a company headquarters building
    that includes top management team members, human resource (HR) specialists, and
    customer service employees. What signal would be sent about the culture if top
    management members were located on the top floor, while HR and customer service
    employees were on lower floors? Alternatively, what would be the signal if the
    top management members were on the first or a middle floor, while HR and customer
    service employees were on the top floor? In short, even the layout of employees
    and units within physical buildings can be symbolic of a culture.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '+   4. Selection and socialization.


    Strategic leaders in strong cultures like to use selection and socialization procedures
    to help ensure that the culture gets continually reinforced. After all, the old
    adage, “the people make the place,” is true.[27] And if the people do make the
    place, it is essential that they be properly selected with the culture in mind,
    and then mechanisms put into place to learn or get socialized to the firm’s specific
    norms and values. For example, strong culture companies (e.g., Google, Southwest
    Airlines, Zappos, Bridgewater, and Cypress) often have multiple steps in their
    recruitment processes, and two things are common to such processes. First, new
    employees are selected based as much (or more) on their fit to the firm’s cultural
    values, as compared to their technical skills or experience for the job. Second,
    rather than just HR specialists involved in selection, actual team members or
    peers will get involved (e.g., existing team members interview prospective candidates).
    Procedures of this nature are designed to both help screen people for cultural
    fit, but also to give the applicant a chance to voluntarily exit. For example,
    toward the end of the Zappos training program, new employees are offered $3,000
    to quit, ensuring that those who stay are doing it for more than a paycheck. In
    2015, Zappos had more than 250,000 applications for 250 openings.[28] We should
    note that selection and socialization may be especially important for the lower-level
    management ranks in a firm. If a strategic leader cannot count on lower-level
    leaders to help build and shape culture in a unified direction, the chances of
    forming a strong culture that matches the vision of the strategic leader will
    be minimal.


    Training is a key mechanism by which both skill development and socialization
    are achieved. However, getting back to the elements of competitive advantage that
    are presented at the beginning of this chapter, training should not be viewed
    as a substitute for culture; rather it’s simply another mechanism to help engrain
    culture. Let’s take the example of customer service. Values and beliefs pertaining
    to customer service can, over time, become part of a culture based on other mechanisms
    for leading culture that we mention in this section, such as day-to-day leader
    actions and communication. If customer service is not continually engrained or
    reinforced in a culture through these other mechanisms, customer service training
    is not as likely to have a positive impact on employee behavior. In short, training
    per se should not be viewed as a substitute for culture.


    +   5. A carefully aligned reward system.


    Finally, leaders in strong culture organizations ensure that the reward system
    is precisely aligned with the expected behavior. Clearly, money is an important
    motivator, but it is not a very good way to shape culture. Oftentimes, monetary
    rewards are too infrequent to reinforce specific behaviors. Instead, leaders in
    strong culture firms are more likely to use recognition, approval, and status
    to signal compliance with the norms. Sometimes these symbolic rewards (e.g., employee
    of the month, certificates of appreciation) can seem trivial, but when they are
    awarded with sincerity, they can act as powerful reinforcement of the culture.
    The big danger in many organizations is that the formal reward system (e.g., money
    and promotion) may not be aligned with the desired behaviors. When leaders claim,
    for example, that teamwork or innovation is important, but employees see others
    who are not team players getting ahead, or if those who try to innovate and fail
    are punished, then they quickly form the belief that their leaders are either
    out of touch with reality or, worse, manipulative. In short, cultural expectations
    will not become clear, and employees will become demotivated, if leaders actually
    reward A, while professing to hope for B.[29]


    In sum, these five mechanisms are based on the idea that to shape culture and
    make it strong, leaders need to send strong signals about what attitudes and behaviors
    are expected. By consistently sending the same messages about expected behaviors,
    getting people involved, providing vivid illustrations of the culture, and visibly
    selecting, socializing, and rewarding those who live the values, leaders help
    employees understand what it takes to succeed. Over time, these expectations can
    become embedded in the organization such that new employees quickly understand
    what is expected of them.'
  merge: -1
  img_proc: true

    +   - More than half of ASU freshmen students in the fall of 2017 who were from
    the state of Arizona were minority students.

    +   - By 2017, ASU was graduating more Native Americans than all of the University
    of California system campuses combined (even though California has more Native
    American residents than any other state).

    +   - Fifty percent of students in 2017 were from families at or below the median
    income level. In 1990, this number was 3 percent. In both 2016 and 2017, ASU also

  img_proc: true
- pgno: 155
  md: 'In many ways, Americans do not dwell on the past or value history. Instead,
    the focus is on the present and future possibilities. While there is some value
    in stressing the present and future, there is also merit in understanding history
    so that there is less of a tendency to not repeat the mistakes of the past. However,
    some other cultures may value an understanding of history more than is evident
    in the American culture.


    # 8. Openness and directness.


    Americans tend to be open to other people, even strangers, rather than remaining
    private or aloof. As an example, Americans tend to smile at, and even say hello,
    to strangers on the street. In a similar vein, Americans tend to value being direct
    and to the point. As an example, when Americans say “yes,” they mean yes, and
    when Americans say “no,” they mean no. To some people reading this characterization,
    it may seem so obvious as to elicit the thought of how anyone person who does
    not practice such directness must be dishonest. But this is exactly the point
    when it comes to understanding our own culture, and how it might differ from the
    cultural norms and values elsewhere. That is, certain aspects of behaving may
    seem so obvious to us that we do not even realize that they are the result of
    cultural influence, and that norms and values may not be the same in different
    cultures. For example, in a culture like Japan, it is considered to be impolite
    and even provocative to say “no,” even if that is how one feels. In other words,
    it is not dishonest to avoid saying “no,” even though that might reflect one’s
    true feelings or intentions. So in Japan, instead of coming right out and saying
    “no,” the individual might instead say something like “that would be difficult”
    or use body language that would be suggestive of “no” in that culture.


    As a note of caution, while making distinctions between cultures can be helpful,
    it can also be overdone, which can then lead to inappropriate stereotyping of
    cultures and their people. While there are noticeable differences between cultures,
    there are also noticeable differences in cultural values, beliefs, and norms within
    a given culture, such as the American culture. An understanding of one’s cultural
    background, as well as that of others, must take this fact into account.


    Finally, we will add one more aspect to our characterization of American culture.
    And unfortunately, despite other more positive aspects of its culture (e.g., the
    norm that people can change or better themselves), this aspect is not so positive.
    Specifically, American culture tends to be dominated by parochialism, and even
    ethnocentrism and arrogance, regarding cultural norms and values. In other words,
    while the rest of the world tends to be quite aware of what American culture is
    all about, Americans typically have little knowledge of other cultures. Moreover,
    Americans oftentimes believe that their culture is superior to others. As an example,
    since they highly revere time, an American tourist in France is likely to expect
    fast service in a Parisian restaurant. However, in Paris, such service would seem
    highly disrespectful, since it would be perceived by the Parisian service provider
    as impolitely hurrying the dining experience.


    # Problem-Solving and Decision-Making


    Much of the act of leading involves problem-solving and decision-making. Thus,
    it is appropriate to consider how American culture tends to differ from many other
    cultures regarding problem-solving and decision-making. Table 10.1 shows a comparison
    of typical problem-solving and decision-making as driven by American culture,
    as compared to many other cultures, especially cultures that are non-Western.[12]
    First, American leaders face difficult situations (or problems) continuously with
    a mindset that they should be solved as quickly as possible. Further, if they
    are not solved, people should be held accountable. In many other cultures, there
    is more acceptance that problems exist and are not immediately solvable. As an
    example, imagine an American firm building a plant off-shore in a non-Western
    context. The American firm has contracted with a construction firm that is based
    in that cultural context to build the plant. After months of building activity,
    that construction firm reports back that the plant will not be completed on schedule
    because of problems with its own suppliers. The immediate American reaction would
    be to tell the construction firm to deal'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'with the problem despite its suppliers, and complete the plant as originally
    contracted. However, the immediate reaction of the construction firm is to just
    accept the problem as it is, and delay the construction timeline.


    # TABLE 10.1 American Versus Other Cultures: Leader Problem-Solving and Decision-Making


    | American | Non-Western |

    | :--- | :--- |

    | 1. Difficult situations should be viewed as problems to be solved | 1. Acceptance
    of, and dealing with problematic situations the way that they actually are |

    | 2. "Get it in writing" | 2. Relationship and trust building |

    | 3. Linear or sequential thinking when working through the issues of a deal |
    3. Integrative or holistic thinking when working through the issues of a deal
    |

    | 4. Relatively frequent delegation of decision-making | 4. Decision-making by
    management only |

    | 5. Quick, sometimes bold decision-making | 5. Slow or risk-averse decision-making
    |

    | 6. Leaders help followers solve problems and provide answers for themselves
    | 6. Leaders are the supposed experts, so they are expected to have all the answers
    |


    Second, America tends to be a litigious society, which goes by the saying, “get
    it in writing.” However, many other cultures are not so litigious, and deals are
    made more through time taken to build relationships and trust. This type of thinking
    can confuse an American leader who might want to consummate a deal quickly by
    getting corporate lawyers to simply put details in a contract, and having that
    contract signed by all parties concerned. In contrast, instead of relying on lengthy
    contracts, leaders from other cultural contexts may want to move slowly and build
    a relationship, perhaps through social activities outside of the work setting.


    Third, American leaders are largely linear or sequential thinkers when it comes
    to deal-making, while other cultures (e.g., especially Asian cultures) may be
    more integrative or holistic in their approach to a deal. Take the case of a buyer-seller
    relationship, which typically can involve various aspects of the deal—quantity
    of product or services that are sold, delivery date, service agreements, and so
    forth. The typical American thinking would be to settle each aspect of the deal
    sequentially before moving on to the next aspect. However, leaders from other
    cultures might want to take a more holistic approach where all aspects of the
    deal are continually negotiated until everything is settled simultaneously at
    the end of a bargaining process.


    Fourth, there is more of a tendency to delegate decision-making, or at least attempt
    to delegate, in American culture. Some American students may be thinking that
    you knew a leader who was not so adept at delegating, and there are many cases
    of such leadership. But overall, there is at least more of a tendency to delegate
    decision-making and responsibility in American or Western cultures, as compared
    to other cultures in which there is an expectation that leaders do not delegate.
    Instead, it is their role to make decisions, while subordinates implement those
    decisions.


    Fifth, American leaders are expected to be quick in their decision-making, as
    well as sometimes bold with the decisions that are made. Perhaps you have heard
    the expression, “paralysis by analysis,” which implies that leaders should not
    over-analyze a problem and instead, should take quick action. In contrast, in
    other cultures, the norm is to move more slowly and more cautiously when it comes
    to decision-making.


    Finally, in American culture, it is the job of the leader to help followers solve
    problems for themselves. To do so, American leaders might refer followers to various
    information sources or provide them with training. But in many other cultures,
    the job of the leader is to be the expert who can provide answers for an array
    of issues that their followers might bring to them. In other words, leaders are
    expected to have all of the answers. After all, isn’t this why they were chosen
    to be leaders in the first place? Such thinking may seem foreign to the typical
    American mind because American culture stresses that nobody is perfect or has
    all of the answers, including people in leadership roles.'

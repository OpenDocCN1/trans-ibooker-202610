    # ## 2.2 Leader Behaviors


    A consideration of effective leader traits is interesting, and it is frequently
    the topic of discussion in both academic and popular culture circles. However,
    traits are not easily developed or modified. This fact runs in contrast to how
    in Chapter 1, we stressed the notion that effective leaders are at least somewhat
    “made,” rather than born. So what exactly can get “made,” so to speak?


    **leader behaviors**

    Actions taken in the pursuit of influencing others and attaining goals.


    To answer this question, leadership thinkers have for years turned to behaviors.
    [24] In other words, the goal is to identify specific behaviors, or categories
    of behaviors, that might be associated with effective leaders. **Leader behaviors**
    involve actions taken in the pursuit of influencing others and attaining goals.
    They can be thought of in two ways: (1) generalized, and (2) decision-making.


    # ## Generalized Leader Behavior


    On a day-to-day basis, leaders may have numerous interactions with followers.
    In these interactions, more effective leaders are likely to show relations-oriented
    behavior, which can include such things as:


    +   - Respecting ideas and feelings,'

- pgno: 130
  md: 'Likewise, in the business world, leaders need to instill values that they want
    to see in the teams that they lead. They can do so by leading-by-example, talking
    a lot (e.g., in team meetings) about shared values, and rewarding behavior that
    is in line with the desired values. Anne Stausboll was the CEO of one of the nation''s
    largest retirement funds (CalPERS). She has said that “It’s all about how you
    build the team, empower and appreciate. The more time you spend nurturing and
    developing, the more successful you’ll be in your career.”(4)


    Take the example of customer service. If a leader wants to make customer service
    a core value of the team, the leader must show through his or her own actions
    the value and importance of customer service. Further, the leader needs to be
    consistent in terms of how customer service is rewarded at both the individual
    and team levels. So often, leaders and organizations talk a lot about the importance
    of one set of behaviors, and yet another set of behaviors gets rewarded. In other
    words, leaders may talk a lot about the importance of one set of behaviors or
    results, and yet a very different set of behaviors or results is actually rewarded.(5)
    For example, a leader might espouse that “customers and their needs should drive
    everything that we do.” But in reality, the leader and the greater reward system
    in the organization simply provides rewards based on the amount of sales to customers.
    Such inconsistencies will not help the leader to build a cohesive and effective
    team.


    Shared values form the basis of shared goals and vision. As will be described
    in a later chapter, goals are more short-term and tangible (e.g., increase customer
    satisfaction ratings by 20 percent over the next year). Vision tends to be less
    concrete and occurs over a longer time horizon (e.g., revolutionize the way that
    leaders are developed in the future through neurofeedback procedures). In the
    early 1980s, Steve Jobs took charge of the team that invented the Macintosh. Although
    Jobs was never viewed as a technical genius, he was seen by others and prided
    himself in being the “keeper of the vision.”(6) In other words, on the various
    project teams that he led, he was instrumental at driving the formation of vision,
    and then maintaining vision even when conflict might erupt within a team, and
    deadlines were not met. The initial development of the Macintosh is a good example.(7)


    # Dealing With the Paradox of Interdependence Versus Individuality


    Team leaders have conflicting goals at times. On the one hand, they want team
    members to be somewhat interdependent, working collaboratively toward team goals
    and vision. But on the other hand, they want to encourage individuals to excel
    and show initiative. Indeed, although they would seem to conflict, these two goals
    are interdependent. In other words, it’s hard to have a great overall team without
    individuals who excel. On the other hand, it’s easier for individuals to excel
    in the context of a supportive and collaborative team. That said, how exactly
    can such a seeming contradiction be managed or led? There is no easy answer. For
    example, it might be natural for the leader to simply form strong bonds or relationships
    with those individuals who excel, while being more detached from other team members.
    However, as already noted, such differential treatment of followers tends to result
    in in-groups versus outgroups, which runs counter to team development.


    In addition, the cross-cultural issues that are addressed later in Chapter 10
    can come into play. For example, in a highly collectivist society (e.g., Japan),
    the leader of a team would tend to stress interdependence, rather than individual
    initiative. As such, the paradox of interdependence versus individuality becomes
    less of an issue. In contrast, in a cultural context like that of the United States,
    both individualism and collectivism are stressed. Accordingly, the paradox of
    interdependence versus individuality becomes more relevant and challenging as
    leaders attempt to maximize team effectiveness.


    One possible solution to this paradox is for the leader to find ways for everyone
    on the team to excel. This means understanding each individual member, and what
    he or she brings to the table in terms of respective skills and motivations. Once
    this is known, the leader can work with each individual to excel, while simultaneously
    encouraging interdependence and collaboration toward'

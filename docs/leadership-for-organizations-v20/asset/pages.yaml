- pgno: 27
  md: 'over time, it is likely to wear on the individual. That is, the individual
    will grow weary of feeling the need to always look over the shoulders of the others
    who he or she is attempting to influence. In return, those individuals will grow
    weary of being micro-managed. The overall situation is not healthy or even productive
    for everyone involved. In contrast, with the type of leadership practices that
    are portrayed in this book, through empowerment, inspiration, and appropriate
    interpersonal behavior, self-leadership on the part of others accrues over time.
    Eventually, through ''leading'', an individual does not feel the need to always
    be micro-managing others, which then feeds into greater fulfillment and more productivity
    on the part of both the leader and followers. A case in point is Ricardo Semler,
    a highly successful Brazilian businessman, who began his career in a highly directive
    and authoritarian mode, but finished in a more empowering manner.[18] Semler credits
    this change in style to his becoming physically healthier, and even prolonging
    his life.


    # How Does Context Affect Leadership?


    context


    The various circumstances in which a leader finds him or herself. These circumstances
    can involve the extent to which decisions need to be made quickly as opposed to
    constituting less of an emergency, the nature of the tasks or work settings facing
    the leader, and even cultural or geographic circumstances.


    When one considers what effective leadership is all about, one of the first things
    that might come to mind is that it all depends on the situation or context. **Context**
    pertains to the various circumstances in which a leader finds him or herself.
    These circumstances can involve the extent to which decisions need to be made
    quickly as opposed to constituting less of an emergency, the nature of the tasks
    or work settings facing the leader, and even cultural or geographic circumstances.
    But why is it that some people may be seen as leader-like in some contexts, but
    not others? Unfortunately, the answer to this question is not easy or straightforward,
    and indeed, we address the issue of context and situations in depth in Chapter
    5. For now, suffice it to say that context comes into play in two key ways with
    regard to the practice of leadership. First, different approaches or styles of
    leadership are necessary to achieve effectiveness, depending on the context or
    situation. Perhaps it is not too difficult to picture how certain followers, jobs,
    industries, or even institutions might dictate different approaches to leadership.
    For example, a more directive approach is more apparent for a Marine drill sergeant,
    rather than an employee working for Google or IBM. But even within a given context,
    appropriate leadership behavior can vary depending on the situation at a particular
    point in time. For example, even at Google, a new hire may need more directive
    leadership, as compared to a more seasoned employee.


    The above explanation and examples are relatively straightforward and easy to
    picture. But what may not be so evident is how the context of some organizations
    may either stifle, or conversely facilitate, leadership behavior. A famous leadership
    scholar, Warren Bennis, wrote about this phenomenon in his book, *Why Leaders
    Can''t Lead*.[19] In some organizations, cultures have developed over time that
    prevent the practice of leadership. For example, a highly mechanized or rule-based
    organization (i.e., bureaucratic) tends to emphasize norms of behavior that would
    reinforce the status quo. Obviously, since leaders are oriented toward continuous
    improvement and change, they would find such a culture to be stifling and frustrating.
    The end result is that individuals with leadership tendencies would either conform
    and be frustrated, or eventually end up exiting that organization. However, other
    types of organizational cultures (e.g., those oriented toward experimentation
    and adaptation) would tend to encourage leadership behavior that is oriented toward
    change. We will consider this issue in more detail in Chapter 12.'

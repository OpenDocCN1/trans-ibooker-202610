    # 4.2 Managing Up


    > managing up

    > Closely aligned with being an effective follower;

    > involves building a good work relationship with the leader, while simultaneously
    getting one''s needs met.


    The idea of managing up is closely aligned with being an effective follower. It
    essentially involves building a good work relationship with the leader, while
    simultaneously getting one’s needs met. In many ways, it mirrors what we considered
    in Chapter 3 in terms of how leaders build relationships with followers. But in
    this instance, the table is turned, and the onus is on the follower to attempt
    to develop the relationship. To some, this may seem counterintuitive. After all,
    isn’t the burden of the leader to worry about relationship building with followers?
    The obvious answer is of course; however, it does not negate the necessity of
    followers doing their part by properly managing up. Here we consider several key
    aspects of managing up: (1) accept feedback and direction; (2) work with, rather
    than against, the leader’s style and goals; and (3) role model the behavior that
    you would like to see from the leader.


    # Accept Feedback and Direction


    > feedback

    > Information that is provided to an individual pertaining to that person’s behavior
    and performance.


    Feedback involves information that is provided to an individual pertaining to
    that person’s behavior and performance. In Chapter 7, we will deal with the importance
    of accepting feedback from a range of sources. For now, suffice it to say that
    to manage up, one must first listen to, and accept, the feedback that is coming
    down from the leader. A strong relationship cannot be built by a follower with
    his or her leader if the follower is consistently not listening to, or devaluing,
    the advice or ideas that are provided by the leader. In some ways, it is again
    a balancing act. As mentioned earlier, effective followership is largely about
    independent, critical thinking. Good leaders will expect and accept such an attribute
    on the part of followers. But on the other hand, it can be taken too far. In other
    words, sometimes independent, critical thinkers shut out the ideas and advice
    of others. When this happens on the part of a follower, that individual will have
    a difficult time forming a good relationship with the leader, and the follower
    is not likely to get his or her needs met.


    Let’s take a hypothetical example. Suppose that a follower has an idea on a project
    that could have much relevance to the effectiveness of that person’s boss and
    even the greater organization. He is proud of his idea since it represents an
    innovative approach that nobody else on that person’s team, including his boss,
    has considered. In short, the follower has shown independent, critical thinking
    by deriving the idea. When presented to his boss, she acknowledges the innovativeness
    of the idea, and thanks him for it. But at the same time, she provides reasons
    for why the idea should not be pursued, at least at this point in time. What should
    the follower do in order to properly manage up? Should he continue to pursue the
    idea, perhaps even going around his boss to other people (e.g., coworkers)? Should
    he attempt to find a compromise, or simply come back to the idea at a later point
    in time? There is no easy answer to these questions. However, for the purpose
    of managing up, it might behoove the follower to at least temporarily back off,
    and maybe reintroduce the idea later. Liz Smith, the CEO of a restaurant company,
    says, “It’s your job to get along with your boss.'

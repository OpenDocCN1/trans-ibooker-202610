  md: '# # About the Authors


    # ## David A. Waldman


    **David A. Waldman** is a professor of management in the W. P. Carey School of
    Business at Arizona State University. His research interests focus largely on
    leadership processes, especially at the upper levels of organizations and in a
    global context, and he is heralded as being one of the top ten leadership researchers
    in the world according to the Web of Science (based on most publications with
    "leader" or "leadership" in article titles). He was the recipient of the 2020
    Network of Leadership Scholars'' Eminent Leadership Scholar award. Much of his
    research has been interdisciplinary. For example, his recent work in the area
    of organizational neuroscience have gained notoriety in both academic and practitioner
    circles, including publications in the Academy of Management Journal and the Journal
    of Applied Psychology, and Personnel Psychology, as well as write-ups in the Wall
    Street Journal, Inc. Magazine, and the Financial Times. With regard to those efforts,
    he is the recipient of the 2021 Lifetime Achievement Award of the Organizational
    Neuroscience interest group of the Academy of Management. Further, he is recognized
    as largely originating the concept of responsible leadership, which involves understanding
    leadership processes in the domain of corporate social responsibility. Finally,
    he has pioneered research to address management and organizational issues that
    are relevant to technology transfer efforts, including highly cited work in Research
    Policy.


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_12_0.png)


    Beyond the journals mentioned above, Professor Waldman''s accomplishments include
    over 130 articles in such journals as the Academy of Management Review, Academy
    of Management Perspectives, Administrative Science Quarterly, Organization Science,
    Journal of Management, Organizational Research Methods, and The Leadership Quarterly.
    According to Google Scholar, his work has been cited over 34,000 times, and he
    is among the top 2 percent of scientists in the world in terms of citation impact.
    He has also published five books on 360-degree feedback, leadership and open communication,
    organizational neuroscience, corporate social responsibility, and leadership for
    organizations, respectively. He has been a principal investigator on grants approximating
    $2 million from such agencies as National Science Foundation (NSF), Defense Advanced
    Research Projects Agency (DARPA), and the Kauffman Foundation. Professor Waldman
    is on the editorial review boards of the Academy of Management Journal, Academy
    of Management Review, Academy of Management Perspectives, Journal of Applied Psychology,
    Personnel Psychology, and The Leadership Quarterly. He is a Fellow of the Academy
    of Management, American Psychological Association, and the Society for Industrial
    and Organizational Psychology.


    Professor Waldman has consulted for, and made presentations at, a number of companies
    and governmental agencies in the United States, Canada, and Mexico. They include
    such firms as IBM, Nortel, Goodyear-Mexico, Homestake Mining Organization, the
    Arizona Department of Public Safety, and the Information Technology Alliance.
    His primary emphasis in these activities include: (1) helping leaders to better
    understand and navigate the paradoxes that they increasingly face, and (2) realize
    and act upon the neurological bases of their leadership abilities.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# # Charles O''Reilly


    ![](img/5a5fcd49e67d713bc6c99c1cc791987a_13_0.png)


    Charles O''Reilly B.S. (Chemistry), University of Texas at El Paso; M.B.A. (Information
    Systems), Ph.D. (Organizational Behavior) University of California at Berkeley.
    He has taught at UCLA, Berkeley, and been a visiting professor at the Harvard
    Business School. He has won teaching awards at Berkeley and Stanford and received
    both a Lifetime Achievement Award and the Distinguished Scholarly Contribution
    Award from the Academy of Management.


    Charles'' current research focuses on leadership, innovation, and organizational
    culture and change. He has also developed and served as faculty director of numerous
    Executive Education programs, including Leading Change and Organizational Renewal
    and The Human Resources Executive Program. He has consulted widely with firms
    in the United States, Europe, and Asia. In 2002 he, Michael Tushman, and Andrew
    Binns founded Change Logic, a consulting firm that helps firms lead disruption.


    Charles has published more than 100 articles and five books. His most recent book,
    Lead and Disrupt: How to Solve the Innovator''s Dilemma (Stanford University Press,
    2nd ed. 2021), explores why successful firms sometimes fail—and what it takes
    for leaders to help their organizations survive and prosper over long time periods.
    His next book, Corporate Explorers: How Corporations Can Beat Startups at the
    Innovation Game (with Andy Binns and Michael Tushman), describes what it takes
    for large companies to out innovate small ones.'
  merge: -1
  img_proc: true

    # # A Three-Stage Approach for Generating Organizational Change


    Leaders realize that change and its effective implementation do not happen overnight.
    Instead, change represents a process that unfolds over time. Below, we will consider
    two ways of thinking about a change process. The first one has been around a while,
    but is conceptually simple and still represents a useful way for leaders to consider
    how to drive change in organizations. It essentially involves three steps: (1)
    unfreeze, (2) change, and (3) refreeze.[6]


    **Unfreeze.** The first step is for leaders to provide a compelling reason for
    why change is necessary and important. For reactive change, this is typically
    less difficult. Employees may already be aware of declining profits, increased
    pressure on reducing costs, and the success of competitors. For proactive change,
    the challenge is more difficult. Can the leader create the perception of a looming
    crisis, or demonstrate a huge opportunity? This might involve providing evidence
    that demonstrates that the firm is under-performing using customer feedback or
    benchmarking data to convince people that storm clouds are on the horizon, or
    to paint a picture of a huge future opportunity. In short, the leadership challenge
    is to provide a credible reason, either a threat or opportunity, as to why employee’s
    need to embrace change. As the saying goes, “people change because they see the
    light or they feel the fire.”[7]


    **Change.** Once there is a credible reason for change, then the leader needs
    to provide a reasonable plan for dealing with the change. This should include
    a transition manager (the person responsible for implementing the change), the
    transition team (who is on the team), the resources necessary (money, people),
    feedback metrics (how people will know when they are succeeding), and a clear
    time frame for implementation. In developing this plan, it is important for the
    leader to build support with key power groups within the organization and to anticipate
    and, if possible, to preempt resistance. This might include an analysis of who
    is likely to be affected positively or negatively by the change effort, and whose
    opposition might undermine or derail the change. It should be noted that change
    efforts should not be all top-down. These efforts could also provide for the involvement
    of employees to build commitment (e.g., task forces, town hall meetings, surveys).


    **Refreeze.** Once the change effort has been accomplished, it is important to
    ensure that there is no backsliding. This means making sure that the new behaviors
    and processes are firmly embedded into the organization. This effort could include
    the development and monitoring of new milestones and metrics, the realignment
    of incentives to reward the new behaviors and to sanction the old ones, and the
    continued communication of the new vision.'

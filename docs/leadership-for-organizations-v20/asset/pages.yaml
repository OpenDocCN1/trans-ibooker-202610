    # ## Additional Considerations of Ethical/Moral Leadership: Some Nagging Questions


    EML can be complicated by some difficult questions. We consider some of those
    questions here.


    +   1. **Does ethical/moral leadership involve universal values and behaviors,
    or is it particular to a context (e.g., cultural context)?**


    # universalism versus relativism


    Deals with whether a leader believes that there are ethical values/ principles
    that can be applied to his/her actions across contexts, versus whether such actions
    depend on the context.


    The concept of **universalism versus relativism** deals with whether a leader
    believes that there are ethical values/principles that can be applied to his/her
    actions across contexts, versus whether such actions depend on the context. For
    example, should a leader always opt to tell the truth (i.e., universalism), or
    might there be situations where the leader should “bend” or “spin” the truth in
    order to best serve the needs of the organization (i.e., relativism)? At least
    in the United States, research has actually shown that leaders with more universalism
    values, beliefs, and actions tend to be viewed as more ethical, as compared to
    those who are relativists.[3]'

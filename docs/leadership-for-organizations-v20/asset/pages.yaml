- pgno: 128
  md: '# # Team and Shared Leadership


    > > "If you want to go fast, go alone. But if you want to go far, go together."
    —old African proverb


    > > "A genuine leader is not a searcher for consensus, but a molder of consensus."
    —Martin Luther King, Jr.


    # ## Learning Objectives


    +   1. Explain the key elements of team-oriented leadership.

    +   2. Compare how leadership is necessary at the various stages of a team''s
    development, and how problems can develop if leadership is lacking.

    +   3. Describe the role and importance of shared leadership in teams.

    +   4. Identify the nature and relevance of virtual teams, as well as how they
    can be effectively led.


    Leadership is all about influencing people toward common goals or visions. Sometimes
    that influence occurs one-on-one, as was emphasized in Chapter 3 of this book.
    Through relationship-building, leaders are able to influence individuals. However,
    a leader''s influence may also be directed toward an entire group or team of individuals.
    A group is simply a collection of individuals performing similar tasks that when
    added together, will help to further the overall goals of the group. But a team
    is more than just a collection of individuals who do similar tasks. It involves
    individuals who work collaboratively and cooperatively to achieve commonly-held
    goals or vision.


    Teams can come in different sizes, purposes, duration, and locations. For example,
    some teams are formed to be relatively ongoing, while other teams are formed simply
    to solve specific problems, and then they are disbanded. Some teams are mostly
    or totally in the same geographic proximity, while other teams are more geographically
    distributed and must operate largely through virtual media (e.g., email and video
    conferencing).


    A high performing team is cohesive, but not so cohesive that it fails to adapt
    to changing information or circumstances (e.g., new technology or ways to serve
    customers) in its environment. In addition, a high performing team is able to
    take advantage of the diverse backgrounds, motivations, and abilities of its members,
    while simultaneously dealing with conflicts and disagreements that arise. In short,
    while teams have potential to perform beyond simple collections of individuals
    with similar tasks, they are not without their challenges. It is the job of leaders
    to ensure that the needs of teams are met. These include making sure that the
    team has clear vision and task direction, supportive and relations-oriented (i.e.,
    socio-emotional) needs are recognized and dealt with, and change-oriented needs
    are addressed when necessary.


    In this chapter, we emphasize how effective leaders are oriented toward building
    high performing teams, rather than simply maintaining groups of individuals. In
    so doing, we will emphasize three issues associated with team leadership: (1)
    key elements or factors defining team leadership,


    **group**

    A collection of individuals performing similar tasks in that when added together,
    will help to further the overall goals of the group.


    **team**

    A collection of individuals who work collaboratively and cooperatively to achieve
    commonly-held goals or vision.'

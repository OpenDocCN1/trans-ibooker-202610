- '# 关于作者


  **Sam Newman** 是 ThoughtWorks 的技术专家，目前他将时间分配在帮助客户和担任 ThoughtWorks 自有内部系统的架构师之间。他在世界各地多个领域的各种公司工作过，常身处开发世界与
  IT 运维领域之间。如果问他做什么，他会说，“我与人们合作构建更好的软件系统。”他撰写过文章，在会议上发表过演讲，并不时为开源项目贡献代码。


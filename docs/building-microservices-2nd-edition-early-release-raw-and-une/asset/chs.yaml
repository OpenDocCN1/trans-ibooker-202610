- "# 第6章 构建\n\n我们花了很多时间介绍微服务的设计方面，但现在需要更深入地了解你的开发流程可能需要如何改变以适应这种新的架构风格。在接下来的章节中，我们将讨论如何部署和测试微服务，但在那之前，我们需要先了解先发生什么——当开发者准备提交更改时会发生什么？\n\
  \n我们将从回顾一些基础概念开始探索——持续集成和持续交付。无论使用何种系统架构，这些都是重要概念，但微服务带来了许多独特的问题。从那里开始，我们将讨论管道，以及管理服务源代码的不同方式。\n\
  \n## A Brief Introduction to Continuous Integration\n\n*持续集成 (CI)* 已经存在多年了，然而花点时间回顾一下基础知识是值得的，尤其是在我们考虑微服务、构建和版本控制仓库之间的映射时——有不同的选项需要考虑。\n\
  \n在 CI 中，核心目标是以频繁的方式让每个人保持同步，我们通过确保新签入的代码能正确地与现有代码集成来实现这一点。为此，CI 服务器检测到代码已提交，检出代码，并执行一些验证，例如确保代码能够编译并且测试通过。最低限度，我们期望这种集成每天进行一次，尽管在实践中我曾在多个团队工作过，开发者实际上每天会多次集成他们的更改。\n\
  \n作为此过程的一部分，我们通常会创建用于进一步验证的构件（artifact），例如部署正在运行的服务以对其运行测试（我们将在本章后面再次讨论构件创建）。理想情况下，我们希望只构建一次这些构件，并将其用于该版本代码的所有部署。这样做是为了避免重复做同样的事情，并且能够确认我们部署的构件就是我们测试过的构件。为了使这些构件能够被重用，我们将它们放在某种仓库中，由\
  \ CI 工具本身提供或在单独的系统上。\n\n我们很快会更深入地探讨构件的作用，并且将在 \\[Link to Come\\] 中深入探讨测试。\n\nCI\
  \ 有许多好处。我们可以快速获得代码质量的反馈。它还可以自动化二进制构件的创建。构建构件所需的所有代码本身都是版本控制的，因此如果需要我们可以重新创建构件。我们还可以从已部署的构件追溯到代码，并且根据\
  \ CI 工具本身的功能，还可以看到对代码和构件运行了哪些测试。正因如此，CI 才如此成功。\n\n### Are You Really Doing CI?\n\
  \nCI 是一项关键实践，使我们能够快速轻松地进行更改，没有它，迈向微服务的旅程将是痛苦的。我怀疑你所在组织可能正在使用 CI 工具，但这可能并不等于真正实践\
  \ CI。我见过很多人将采用 CI 工具与真正拥抱 CI 混为一谈——一个使用良好的 CI 工具会帮助你实践 CI。但使用 Jenkins、CircleCI、Travis\
  \ 或其他众多选项中的任何一个，并不保证你实际上做对了 CI。\n\n那么你如何知道自己是否真正实践 CI？我非常喜欢 Jez Humble 提出的三个问题，他用这些问题来测试人们是否真正理解\
  \ CI 的含义——也许问问自己同样的问题会很有趣：\n\nDo you check in to mainline once per day?\n\n: \n\n\
  你需要确保你的代码能够集成。如果不经常将你的代码与其他人的更改一起检查，你最终会使未来的集成变得更困难。即使你使用短期分支来管理更改，也应尽可能频繁地将其集成到单个主干分支中，至少每天一次。\n\
  \nDo you have a suite of tests to validate your changes?\n\n: \n\n没有测试，我们只知道语法上集成成功了，但不知道是否破坏了系统的行为。没有验证代码按预期行为的\
  \ CI 并不是 CI。\n\nWhen the build is broken, is it the #1 priority of the team to fix\
  \ it?\n\n: \n\n\n\n\n通过的绿色构建意味着我们的更改已安全集成。红色构建意味着最近的更改可能未成功集成。你需要停止所有不参与修复构建的进一步签入，以使其再次通过。如果你让更多更改堆积起来，修复构建所需的时间将急剧增加。我曾与一些团队合作过，他们的构建已损坏数天，最终花费大量精力才获得通过的构建。\n\
  \n# 分支模型\n\n在构建和部署相关的诸多话题中，似乎没有哪个比使用源代码分支进行功能开发更具争议性。源代码中的分支允许在隔离环境中进行开发，而不会干扰他人的工作。表面上看，为每个正在进行的功能创建源代码分支——也称为功能分支——似乎是一个有用的概念。\n\
  \n问题在于，当你在功能分支上工作时，你并不会定期将更改与其他人集成。从根本上说，你是在*延迟*集成。当你最终决定将更改与其他人集成时，你将面临一个更复杂的合并。\n\
  \n另一种方法是让每个人都签入到同一个源代码“主干”。为了防止更改影响他人，会使用诸如功能标志等技术来“隐藏”未完成的工作。每个人都基于同一主干工作的做法称为*基于主干的开发*。\n\
  \n关于这个话题的讨论很微妙，但我自己的看法是，频繁集成——以及对该集成的验证——带来的好处足以使基于主干的开发成为我偏好的开发方式。此外，实现功能标志的工作在渐进式交付方面通常是有益的，我们将在第\
  \ 7 章中探讨这一概念。\n\n## 谨慎使用分支\n\n尽早集成，经常集成。避免为功能开发使用长期存在的分支，而应考虑基于主干的开发。如果确实必须使用分支，请保持它们简短！\n\
  \n撇开我自己的轶事经验不谈，越来越多的研究表明减少分支数量并采用基于主干的开发的有效性。DORA 和 Puppet 于 2016 年发布的《DevOps 现状报告》^(1)对全球各组织的交付实践进行了严格研究，并探讨了高绩效团队常用的实践：\n\
  \n> 我们发现，在合并到主干之前具有非常短生命周期（少于一天）的分支或分支，以及总共少于三个活跃分支，是持续交付的重要方面，并且都有助于提高性能。每天将代码合并到主干或\
  \ master 中也是如此。\n> \n> DevOps 现状报告 2016\n\n在随后的几年中，《DevOps 现状报告》继续更深入地探讨这一主题，并继续发现该方法有效性的证据。\n\
  \n分支繁重的方法在开源开发中仍然很常见，通常通过采用“GitFlow”开发模型来实现。值得注意的是，开源开发与正常的日常开发不同。开源开发的特点是大量来自时间有限的“不受信任”提交者的临时贡献，其更改需要由较少数量的“受信任”贡献者进行审查。典型的日常闭源开发通常由一个紧密团结的团队完成，他们都拥有提交权限，即使他们决定采用某种形式的代码审查流程。因此，适用于开源开发的方法可能不适用于你的日常工作。即使如此，2019\
  \ 年的《DevOps 现状报告》^(2)进一步探讨了这一主题，发现了一些关于开源开发以及“长期存在”分支影响的有趣见解：\n\n> 我们的研究发现扩展到开源开发的某些领域：\n\
  > \n> *   更早提交代码更好：在开源项目中，许多人观察到更快地合并补丁以防止重新基线有助于开发人员更快地移动。\n> \n> *   小批量工作更好：大型“补丁炸弹”比更小、更易读的补丁集更难、更慢地合并到项目中，因为维护者需要更多时间来审查更改。\n\
  > \n> 无论你是在闭源代码库还是开源项目上工作，短生命周期分支；小而可读的补丁；以及对更改的自动测试都能让每个人更高效。\n> \n> DevOps 现状报告\
  \ 2019\n\n# 构建流水线和持续交付\n\n在进行 CI 的早期，我当时的 ThoughtWorks 同事和我意识到在构建中有时具有多个阶段的价值。测试是这种情况非常常见的案例。我可能有很多快速、小范围的测试，以及少量大范围、慢速的测试。如果我们一起运行所有测试，并且我们在等待长范围慢速测试完成时，可能无法在快速测试失败时获得快速反馈。而且如果快速测试失败，运行较慢的测试可能也没有什么意义！解决这个问题的方案是在我们的构建中设置不同的阶段，创建所谓的*构建流水线*。一个阶段用于更快的测试，如果它通过则触发用于较慢测试的单独阶段。\n\
  \n这种构建流水线概念为我们提供了一种跟踪软件在清除每个阶段时进展的良好方式，有助于我们了解软件的质量。我们创建可部署的构件，即最终将部署到生产环境的东西，并在整个流水线中使用该构件。在我们的上下文中，该构件将与我们想要部署的微服务相关。在图\
  \ 6-1 中我们看到了这种情况——相同的构件在流水线的每个阶段中使用，使我们更有信心软件将在生产中工作。\n\n![](img/sample-pipeline.png)\n\
  \n*持续交付 (CD)* 在此概念的基础上更进一步。正如 Jez Humble 和 Dave Farley 同名书籍中所述^(3)，CD 是我们对每次签入的生产就绪度获得持续反馈的方法，并且将每次签入都视为发布候选。\n\
  \n要充分拥抱这一概念，我们需要对将软件从签入到生产所涉及的所有流程进行建模，并了解给定版本的软件在发布许可方面的进展情况。在 CD 中，我们通过对软件必须经历的每个阶段进行建模来实现这一点，无论是手动还是自动化的，我们刚刚在图\
  \ 6-1 中为我们的 `Catalog` 服务分享了一个示例。大多数 CI 工具如今都为定义和可视化此类构建流水线状态提供了一定支持\n\n如果新的 `Catalog`\
  \ 服务通过流水线某阶段执行的任何检查，它就可以进入下一步。如果它未通过某个阶段，我们的 CI 工具可以告知我们该构建已通过哪些阶段，并提供有关失败内容的可见性。如果我们需要做些什么来修复它，我们会做出更改并签入，允许我们微服务的新的版本尝试通过所有阶段，然后才能用于部署。在图\
  \ 6-2 中，我们看到了一个示例。`build-120` 在快速测试阶段失败，`build-121` 在性能测试阶段失败，但 `build-122` 一直成功到达生产环境。\n\
  \n![](img/failing-pipeline.png)\n\n## 工具\n\n\n\n\n理想情况下，你希望使用一个将 CD 作为一等概念拥抱的工具。我见过很多人尝试\
  \ hack 并扩展 CI 工具使其执行 CD，往往导致复杂的系统，其易用性远不及从一开始就内置 CD 的工具。完全支持 CD 的工具允许你定义和可视化这些流水线，对软件的整个生产路径进行建模。随着代码的一个版本在流水线中移动，如果它通过了其中一个自动化验证阶段，就会进入下一个阶段。\n\
  \n一些阶段可能是手动的。例如，如果我们有一个手动的用户验收测试（UAT）流程，我应该能够使用 CD 工具对其进行建模。我可以看到下一个可用的构建已准备好部署到我们的\
  \ UAT 环境中，部署它，如果它通过了我们的手动检查，就将该阶段标记为成功，以便它可以进入下一步。如果后续阶段是自动化的，那么它将被自动触发。\n\n## Tradeoffs\
  \ and Environments\n随着我们将微服务构件通过此流水线移动，我们的微服务会被部署到不同的环境中。不同的环境服务于不同的目的，并且可能具有不同的特征——我们将在第\
  \ 7 章中更详细地讨论这一点。\n\n构建流水线，因此确定你需要的环境本身就是一种平衡行为。流水线早期，我们希望快速反馈软件的生产就绪情况。我们希望尽快让开发人员知道是否存在问题——越早获得问题发生的反馈，修复起来就越快。随着我们的软件越来越接近生产环境，我们希望对软件能够正常工作有更大的确定性，因此我们会部署到越来越像生产的环境中——我们可以在图\
  \ 6-3 中看到这种权衡。\n\n![](img/balance-pipeline.png)\n\n你在开发笔记本上获得最快的反馈——但这与生产环境相差甚远。你可以将每个提交都部署到是对实际生产环境忠实再现的环境中，但这可能会花费更长时间并成本更高。因此找到平衡至关重要，并且持续审查快速反馈与对生产环境的需求之间的权衡可以是一项极其重要的持续活动。\n\
  \n## Artifact Creation\n随着我们将微服务移动到不同的环境中，我们必须有实际可部署的东西。事实证明，关于可以使用哪种类型的部署构件，有多种不同的选择。一般来说，你创建哪种构件在很大程度上取决于你为部署而选择采用的技术。我们将在下一章深入探讨这个问题，但我想给你一些非常重要的提示，说明构件创建应如何融入你的\
  \ CI/CD 构建流程中。\n\n为了保持简单，我们将回避我们正在创建的确切构件类型——暂时将其视为一个可部署的 blob。现在，我们需要考虑两条重要规则。首先，正如我之前提到的，我们应该只构建一次构件。一次又一次地构建同样的东西是浪费时间，对地球有害，并且如果构建配置不完全相同，理论上可能会引入问题。在某些编程语言中，不同的构建标志可能会使软件的行为大不相同。其次，你验证的构件应该是你部署的构件！如果你构建一个微服务，对其进行测试，说“是的，它正在工作”，然后再次构建以部署到生产环境，你如何知道你验证的软件与你部署的软件是相同的？\n\
  \n将这两个想法结合起来，我们有一个相当简单的方法。只构建一次你的可部署构件，并且理想情况下在流水线中尽早完成。我通常会在编译代码（如果需要）并运行快速测试后执行此操作。一旦创建，该构件将被存储在适当的存储库中——这可能是像\
  \ Artifactory 或 Nexus 这样的东西，或者是一个容器注册表。你选择的部署构件可能决定了构件存储的性质。然后，这个相同的构件可以用于流水线中后续的所有阶段，直到包括部署到生产环境。所以回到我们之前的流水线，我们可以在图\
  \ 6-4 中看到，我们在流水线的第一阶段为我们的 `Catalog` 服务创建了一个构件，然后相同的 `build-123` 构件作为慢速测试、性能测试和生产阶段的一部分被部署。\n\
  \n![](img/same-artifact.png)\n\n如果同一个构件将在多个环境中使用，任何因环境而异的配置方面都需要保留在构件本身之外。作为一个简单的例子，我可能希望配置应用程序日志，以便在运行慢速测试阶段时，`DEBUG`\
  \ 级别及以上的所有内容都被记录下来，以便我有更多信息来诊断测试失败的原因。不过，我可能会决定将其更改为 `INFO` 以减少性能测试和生产部署的日志量。\n\n\
  ### Artifact Creation Tips\n构建你的微服务的部署构件一次。在你想部署该版本微服务的所有地方重复使用相同的构件。保持你的部署构件与环境无关——将环境特定的配置存储在其他地方。\n\
  \n## Mapping Source Code and Builds to Microservices\n我们已经研究过一个可能激起对立阵营的话题——功能分支\
  \ vs 主干分支开发——但事实证明，本章的争议并未结束。另一个可能引发相当多不同意见的话题是我们微服务的代码组织。现在，我有自己的偏好，但在进入那之前，让我们先探讨一下组织微服务代码的主要选项。\n\
  \n### One Giant Repo, One Giant Build\n如果从最简单的选项开始，我们可以将所有东西放在一起。我们有一个单一的、巨大的存储库存储所有代码，并有一个单一的构建，如图\
  \ 6-5 所示。对此源代码存储库的任何签入都会触发我们的构建，在其中我们将运行与所有微服务相关的所有验证步骤，并生成多个构件，所有这些都与同一个构建相关联。\n\
  \n![](img/one-big-build.png)\n\n与其他方法相比，这在表面上似乎简单得多：需要担心的存储库更少，并且概念上构建更简单。从开发人员的角度来看，事情也相当直接。我只需签入代码。如果我必须同时处理多个服务，我只需要担心一次提交。\n\
  \n这种模式如果接受锁步发布（lock-step releases）的理念，即不介意同时部署多个服务，那么可以很好地工作。一般来说，这绝对是一种需要避免的模式，但在项目的早期阶段，尤其是如果只有一个团队在处理所有事情时，这在短时间内可能是有意义的。\n\
  \n\n\n让我解释一下这种方法的一些显著缺点。如果我对单个服务进行一行修改——例如在图 6-5 中更改 `User` 服务的行为——*全部*其他服务都会被验证和构建。这可能比所需花费更多时间——我在等待那些可能不需要测试的东西。这会影响我们的周期时间，即将单个更改从开发推进到生产的速度。更令人担忧的是，知道应该部署哪些构件或不应该部署哪些构件。我现在是否需要部署所有构建服务才能将我的小更改推送到生产环境？这很难判断；仅通过阅读提交信息来猜测哪些服务*真正*发生了变化是困难的。使用这种方法的组织通常会退回到一起部署所有内容，而我们真的想避免这种情况。\n\
  \n此外，如果我对 `user` 服务的一行更改破坏了构建，在该问题修复之前就无法对其他服务进行其他更改。再想想这样一个场景：多个团队都在共享这个庞大的构建。谁负责？实际上，我几乎从未见过这种方法被使用，除了在项目的最早阶段。说实话，接下来的两种方法都明显更可取，所以我们将重点关注它们。\n\
  \n## 模式：每个微服务一个仓库（又称多仓库）\n\n采用每个微服务一个仓库模式（在与单仓库模式比较时更常被称为多仓库模式），每个微服务的代码都存储在其自己的源代码仓库中，如图\
  \ 6-6 所示。这种方法在源代码更改和 CI 构建之间建立了直接的映射关系。\n\n![](img/06-one-repo-per-microservice.png)\n\
  \n对 `User` 源代码仓库的任何更改都会触发匹配的构建，如果构建通过，我将拥有可用于部署的 `User` 微服务的新版本。为每个微服务拥有单独的仓库也允许你按仓库为基础更改所有权，如果你希望为微服务考虑强所有权模型，这是有意义的（稍后会详细介绍）。\n\
  \n这种模式的直接性虽然带来了某些挑战。具体来说，开发人员可能会同时处理多个仓库，特别是在尝试同时对多个仓库进行更改时，这尤其痛苦。此外，无法以原子方式在单独的仓库之间进行更改，至少使用\
  \ `Git` 时不行。\n\n### 跨仓库复用代码\n\n使用这种模式时，没有任何东西可以阻止微服务依赖于在不同仓库中管理的其他代码。一个简单的实现机制是将想要复用的代码打包成库，然后使其成为下游微服务的显式依赖。我们可以在图\
  \ 6-7 中看到一个例子，其中 `Invoice` 和 `Payroll` 服务都使用了 `Connection` 库。\n\n![](img/reusing-code-across-repos.png)\n\
  \n如果你想推出对 `Connection` 库的更改，你必须在匹配的源代码仓库中进行更改，并等待其构建完成以获得新的版本化构件。要实际部署使用此新版本库的 `Invoice`\
  \ 或 `Payroll` 服务的新版本，你需要更改它们使用的 `Connection` 库的版本。这可能需要手动更改（如果你依赖特定版本），也可以根据你使用的\
  \ CI 工具的性质配置为动态发生。这些概念在 Jez Humble 和 Dave Farley 所著的书籍《Continuous Delivery》中得到了更详细的阐述^(4)。\n\
  \n当然需要记住的重要一点是，如果你想推出 `Connection` 库的新版本，那么我们也需要部署新构建的 `Invoice` 和 `Payroll` 服务。请记住，我们在“DRY\
  \ 与微服务世界中代码复用的风险”中探讨的关于复用和微服务的所有注意事项仍然适用——如果你选择通过库复用代码，那么你必须接受这些更改无法以原子方式推出的事实，否则我们就会破坏独立部署的目标。你还必须意识到，可能更难知道某些微服务是否使用库的特定版本，如果你试图弃用旧版本库的使用，这可能会有问题。\n\
  \n### 跨多个仓库工作\n\n那么，除了通过库复用代码之外，我们还能如何对一个以上的仓库进行更改？让我们看另一个例子。在图 6-8 中，我想更改 `Inventory`\
  \ 服务公开的 API，并且我还需要更新 `Shipping` 服务以便它可以使用新的更改。如果 `Inventory` 和 `Shipping` 的代码在同一个仓库中，我可以一次性提交代码。现在，我必须将更改拆分为两部分——一个提交用于\
  \ `Inventory`，另一个提交用于 `Shipping`。\n\n![](img/commit-across-repos.png)\n\n如果一个提交失败而另一个成功，这种拆分更改可能会导致问题——例如，我可能需要进行两次更改来回滚更改，如果在此期间其他人已签入，这可能会变得复杂。实际上，在这种特定情况下，我无论如何都可能希望对提交进行一定程度的分阶段处理。我希望在更改\
  \ `Shipping` 服务中的任何客户端代码之前，确保更改 `Inventory` 服务的提交有效——如果 API 中没有新的功能，就没有必要拥有使用它的客户端代码。\n\
  \n我与多个人交谈过，他们认为这种缺乏原子部署的情况是一个重大问题。我当然可以理解这带来的复杂性，但我认为在大多数情况下，这指向了一个更大的潜在问题。如果你不断在多个微服务之间进行更改，这表明你的服务边界可能不在正确的位置，并且可能意味着服务之间耦合过多。正如我们已经讨论过的，我们试图优化我们的架构和微服务边界，以便更改更有可能在微服务边界内应用。跨切更改应该是例外，而不是常态。\n\
  \n#### 提示\n\n如果你不断在多个微服务之间进行更改，这很可能表明你的微服务边界位置错误。如果发现这种情况发生，考虑将微服务重新合并可能值得一试。\n\n\
  然后还有在正常工作流程中必须从多个仓库拉取并推送到多个仓库的麻烦。根据我的经验，这可以通过使用支持多个仓库的 IDE 来简化（这是我在过去 5 年中使用过的所有\
  \ IDE 都能处理的事情），你也可以编写简单的包装脚本来简化命令行工作。\n\n### 何时使用此模式\n\n使用每个微服务一个仓库的方法对于小型团队和大型团队同样有效，但如果你发现自己在微服务边界之间进行大量更改，那么它可能不适合你，我们接下来讨论的单仓库模式可能更合适——尽管在服务边界之间进行大量更改可以被视为某种不正常情况的警告信号，正如我们之前讨论过的。它还可能使代码复用比使用单仓库方法更复杂，因为你需要依赖代码被打包成版本构件。\n\
  \n## 模式：单仓库\n\n\n\n采用单仓库（monorepo）方法时，多个微服务（或其他类型项目）的代码存储在同一个源代码仓库中。我见过单仓库仅由一个团队使用来管理其所有服务的源代码控制的情况，尽管这一概念是由一些非常大的科技公司推广的，在这些公司中，多个团队以及数百甚至数千名开发人员都可以在同一个源代码仓库上工作。\n\
  \n将所有源代码放在同一个仓库中，可以以原子方式跨多个项目进行源代码更改，并且还能实现从一个项目到下一个项目的更细粒度的代码复用。Google 可能是采用单仓库方法的公司中最为人熟知的例子，尽管它远非唯一一家。虽然这种方法还有其他一些好处——例如提高对他人代码的可见性——但能够轻松复用代码并对多个不同项目产生影响的更改，通常被认为是采用这种模式的主要原因。\n\
  \n如果我们以上面的例子为例，我们想要对 `Inventory` 进行更改以使其暴露一些新行为，并同时更新 `Shipping` 服务以使用我们所暴露的这一新功能，那么这些更改可以在一次提交中完成，如\
  \ 图 6-9 所示。\n\n![](img/atomic-commit-across-microservices.png)\n\n当然，就像上面讨论的多仓库模式一样，我们仍然需要处理部署方面的问题。如果我们想避免同步部署，就需要仔细考虑部署的顺序。\n\
  \n# 原子提交 vs 原子部署\n\n能够跨多个服务进行原子提交并不意味着原子发布。如果你发现自己想要同时更改多个服务的代码并在同一时间将其全部发布到生产环境，这就违反了独立部署的核心原则。有关更多信息，请参阅\
  \ “DRY 与微服务世界中代码复用的风险”。\n\n## 映射到构建\n\n对于每个微服务使用单个源代码仓库，将源代码映射到构建过程是直接的。该源代码仓库中的任何更改都可以触发相应的\
  \ CI 构建。对于单仓库来说，情况会变得稍微复杂一些。\n\n一个简单的起点是将单仓库内部的目录映射到构建，如 图 6-10 所示。例如，对 `user-service`\
  \ 目录所做的更改会触发 `User service build`。如果你签入的代码同时更改了 `user-service` 目录和 `catalog-service`\
  \ 目录中的文件，那么 `User service build` 和 `Catalog service build` 都将被触发。\n\n![](img/monorepo.png)\n\
  \n随着目录结构的变得更复杂，情况会变得更加复杂。在大型项目中，你可能会出现多个不同的目录想要触发同一个构建，而某些目录会触发多个构建。在最简单的情况下，你可能有一个\
  \ `common` 目录被所有微服务使用，对其的更改会导致所有微服务都被重新构建。在更复杂的情况下，团队最终需要采用更基于图的构建工具，如开源的 `Bazel`\
  \ 工具，以更有效地管理这些依赖关系（`Bazel` 是 Google 自有内部构建工具的开源版本）。实施新的构建系统可能是一项重要的工作，因此不能轻率行事——但没有像这样的工具，Google\
  \ 自己的单仓库是不可能实现的。\n\n单仓库方法的好处之一是，你可以在项目之间实践更细粒度的复用。在多仓库模型中，如果我想复用他人的代码，它很可能需要被打包为一个版本化的构件，然后我可以在构建中将其包含进来（例如\
  \ nuget 包、JAR 文件或 NPM）。由于我们的复用单元是一个库，我们可能会引入比实际需要更多的代码。从理论上讲，在单仓库中我可以直接依赖另一个项目中的单个源文件——尽管这当然会使你的构建映射变得更复杂。\n\
  \n## 定义所有权\n\n对于团队规模较小、代码库规模较小的项目，单仓库很可能能很好地与你习惯的传统构建和源代码管理工具配合使用。然而，随着单仓库变得更大，你可能需要开始寻找不同类型的工具。我们将在\
  \ [稍后提供链接] 中更详细地探讨所有权模型，但在此期间，值得简要探讨一下当我们思考源代码控制时这是如何发挥作用的。\n\nMartin Fowler 之前曾撰写过关于不同所有权模型的内容^(6)，概述了从\
  \ `Strong Ownership` 到 `Weak Ownership` 再到 `Collective Ownership` 的所有权滑动尺度。自 Martin\
  \ 提出这些术语以来，开发实践已经发生了变化，因此或许值得重新审视并重新定义这些术语。\n\n在 `Strong Ownership` 下，某些代码由特定人群专门拥有。如果该群体之外的人想要进行更改，他们必须请求所有者为他们进行更改。`Weak\
  \ Ownership` 仍然具有定义所有者的概念，但所有权群体之外的人被允许进行更改，尽管任何这些更改都必须由所有权群体中的某人进行审查和接受。这涵盖了在合并拉取请求之前，将拉取请求发送给核心所有权团队进行审查的做法。在\
  \ `Collective Ownership` 下，任何开发人员都可以更改任何代码片段。\n\n对于开发人员数量较少的情况（一般指导原则为 20 人或更少），你可以采用\
  \ `Collective Ownership`——即任何开发人员都可以更改任何其他微服务。随着人员增多，你更有可能希望转向 `Strong` 或 `Weak`\
  \ 所有权模型，以创建更明确的责任边界。如果其源代码控制工具不支持更细粒度的所有权控制，这可能会给使用单仓库的团队带来挑战。\n\n一些源代码工具允许你在单个仓库内指定特定目录甚至特定文件路径的所有权。Google\
  \ 最初在其单仓库上基于 Perforce 实现了该系统，然后才开发了自己的源代码控制系统，GitHub 自 2016 年起也支持此功能^(7)。在 GitHub\
  \ 中，你可以创建一个 `CODEOWNERS` 文件，它允许你将所有者映射到目录或文件路径。你可以在 示例 6-1 中看到一些示例，这些示例取自 GitHub\
  \ 自己的文档，展示了这些系统可以带来的灵活性类型。\n\n### 示例 6-1. 如何在 GitHub CODEOWNERS 文件中指定特定目录所有权的示例\n\
  \n```\n# In this example, @doctocat owns any files in the build/logs\n# directory\
  \ at the root of the repository and any of its\n# subdirectories.\n/build/logs/\
  \ @doctocat\n\n# In this example, @octocat owns any file in an apps directory\n\
  # anywhere in your repository.\napps/ @octocat\n\n# In this example, @doctocat owns\
  \ any file in the `/docs`\n# directory in the root of your repository.\n/docs/ @doctocat\n\
  ```\n\nGitHub 自身的代码所有权概念确保当针对相关文件提出任何拉取请求时，会请求源文件代码所有者进行审查。对于较大的拉取请求，这可能成为一个问题，因为你最终可能需要多个审查者的批准，但无论如何，力求更小的拉取请求有很多很好的理由。\n\
  \n## 工具\n\n\n\nGoogle 自己的单仓库规模庞大，且需要大量工程投入才能在规模上正常运行。考虑诸如经历了多代演进的基于图的构建系统、用于加快构建时间的分布式对象链接器，以及可动态保持依赖文件受控的\
  \ IDE 和文本编辑器插件——这是一项庞大的工作。随着 Google 的成长，他们在使用 Perforce 时越来越遇到限制，最终不得不创建自己的专有源代码控制工具\
  \ Piper。我在 2007-2008 年在 Google 的这一部分工作时，有超过一百人在维护各种开发者工具，其中很大一部分工作用于处理单仓库方法带来的影响。当然，如果你有成千上万名工程师，这是可以证明其合理性的。\n\
  \n为了更详细地了解 Google 使用单仓库背后的 rationale，我可以推荐 Rachel Potvin、Josh Levenbeg 的文章“为什么 Google\
  \ 将数十亿行代码存储在单个仓库中”^(8)。事实上，我建议任何认为“我们应该使用单仓库，因为 Google 这样做！”的人都必须阅读它。你的组织可能不是 Google，也可能没有\
  \ Google 类型的问题、限制或资源。换句话说，你最终得到的任何单仓库可能都不会是 Google 的。\n\nMicrosoft 在规模上也遇到了类似的问题。他们采用了\
  \ Git 来帮助管理 Windows 的主要源代码仓库。该代码库的完整工作目录约为 270GB 的源文件^(9)。下载所有内容需要很长时间，而且也不需要——开发者最终只会在这个整体系统的很小一部分上工作。因此\
  \ Microsoft 必须创建一个专用的虚拟文件系统 VFS For Git（以前称为 GVFS），确保只有开发者需要的源文件才会被实际下载。\n\nVFS\
  \ For Git 是一个令人印象深刻的成就，Google 自身的工具链也是如此，尽管对于这类公司来说，很容易证明在这种技术上的投资是合理的。另外也值得指出的是，虽然\
  \ VFS For Git 是开源的，但我尚未遇到 Microsoft 之外的团队在使用它，而且 Google 支持其单仓库的庞大工具链大部分是闭源的（Bazel\
  \ 是一个显著的例外，但开源的 Bazel 在多大程度上反映了 Google 内部实际使用的情况尚不明确）。\n\nMarkus Oberlehner 的文章“Monorepos\
  \ in the wild”^(10)向我介绍了 Lerna^(11)，这是一个由 Babel Javascript 编译器团队创建的工具。Lerna 的设计目的是使从同一个源代码仓库生成多个版本化产物变得更容易。我无法直接谈论\
  \ Lerna 在此任务上的有效性（除了一系列显著的缺陷外，我也不是有经验的 Javascript 开发者），但从表面上看，它似乎在某种程度上简化了这种方法。\n\
  \n## “mono” 有多“单”？\n\nGoogle 并非将**全部**代码存储在单仓库中。有些项目，尤其是那些在公开环境中开发的项目，被保存在其他地方。然而，至少根据之前提到的\
  \ ACM 文章，截至 2016 年，Google 的 95% 代码都存储在单仓库中。在其他组织中，单仓库可能仅限定于一个系统或少数几个系统。这意味着一家公司可以为组织的各个部分拥有少量单仓库。\n\
  \n我也曾与实践按团队划分单仓库的团队交谈过。从技术上讲，这可能与该模式的原始定义不完全一致（该定义通常以多个团队共享同一个仓库来讨论），但我仍然认为它更像是“单仓库”。在这种情况下，每个团队都有自己的单仓库，完全由其控制。该团队拥有的所有微服务的代码都存储在该团队的单仓库中，如图\
  \ 6-11 所示。\n\n![](img/per-team-mono-repo.png)\n\n对于实践集体所有权的团队来说，这种模式有很多好处，可以说在规避大规模出现的一些挑战的同时获得了单仓库方法的大部分好处。这种折中方案在遵循现有组织所有权边界的工作方式方面很有意义，并且可以在一定程度上缓解对该模式在大规模使用时的担忧。\n\
  \n## 在何处使用此模式\n\n一些在非常大规模下工作的组织发现单仓库方法对他们非常有效。我们迄今为止已经提到了 Google 和 Microsoft，但我们可以将\
  \ Facebook、Twitter 和 Uber 添加到列表中。这些组织有一个共同点——它们都是大型、技术导向的公司，能够投入大量资源来充分利用这种模式。我认为单仓库在光谱的另一端效果很好，即开发者和团队数量较少的情况下。在\
  \ 10-20 名开发者的情况下，使用单仓库方法更容易管理所有权边界并保持构建过程简单。痛点似乎出现在中间的组织中——那些规模足以开始遇到需要新工具或工作方式的问题，但又没有额外带宽来投资这些想法的组织。\n\
  \n## 我会使用哪种方法？\n\n根据我的经验，单仓库方法的主要优势——更细粒度的复用和原子提交——似乎抵不过在规模上出现的问题。对于小型团队来说，任何方法都可以，但随着规模扩大，我认为每个微服务一个仓库（多仓库）的方法更直接。从根本上说，我担心单仓库可能带来的跨服务更改的鼓励、更混乱的所有权界限以及对新工具的需求。\n\
  \n所有权方面的担忧可以通过细粒度的所有权控制来缓解，但这通常需要工具和/或更高的谨慎程度。随着单仓库周边工具的成熟度提高，我对此的看法可能会改变，但尽管在基于图的构建工具的开源开发方面做了大量工作，我仍然看到这些工具链的采用率非常低。所以对我来说是多仓库。\n\
  \n# 摘要\n\n本章我们涵盖了一些重要思想，无论你是否最终使用微服务，这些思想都应该对你有所帮助。在这些思想周围还有许多需要探索的方面，从持续交付到基于主干的开发，从单仓库到多仓库。我为你提供了大量资源和进一步阅读的材料，但现在是时候转向一个需要深入探索的重要主题——部署。\n\
  \n^(1) 2016 年 DevOps 状况报告 - [*https://puppet.com/resources/report/2016-state-devops-report/*](https://puppet.com/resources/report/2016-state-devops-report/)\n\
  \n^(2) Accelerate State Of Devops 2019 [*https://services.google.com/fh/files/misc/state-of-devops-2019.pdf*](https://services.google.com/fh/files/misc/state-of-devops-2019.pdf)\n\
  \n^(3) Jez Humble 和 David Farley，*持续交付：通过构建、测试和部署自动化实现可靠的软件发布* (Upper Saddle River:\
  \ Addison Wesley, 2010) 了解更多细节。\n\n^(4) 请参阅 Jez Humble 和 Dave Farley 所著 *Continuous\
  \ Delivery* 中的“管理依赖图”，第 363-373 页\n\n^(5) [*https://bazel.build*](https://bazel.build)\n\
  \n^(6) [*https://martinfowler.com/bliki/CodeOwnership.html*](https://martinfowler.com/bliki/CodeOwnership.html)\n\
  \n\n\n^(7) [*https://help.github.com/en/github/creating-cloning-and-archiving-repositories/about-code-owners*](https://help.github.com/en/github/creating-cloning-and-archiving-repositories/about-code-owners)\n\
  \n^(8) [*https://cacm.acm.org/magazines/2016/7/204032-why-google-stores-billions-of-lines-of-code-in-a-single-repository/fulltext*](https://cacm.acm.org/magazines/2016/7/204032-why-google-stores-billions-of-lines-of-code-in-a-single-repository/fulltext)\n\
  \n^(9) 参见 Git 虚拟文件系统设计历史 [*https://docs.microsoft.com/en-us/azure/devops/learn/git/gvfs-design-history*](https://docs.microsoft.com/en-us/azure/devops/learn/git/gvfs-design-history)\n\
  \n^(10) [*https://medium.com/@maoberlehner/monorepos-in-the-wild-33c6eb246cb9*](https://medium.com/@maoberlehner/monorepos-in-the-wild-33c6eb246cb9)\n\
  \n^(11) [*https://lerna.js.org/*](https://lerna.js.org/)\n"
- "# 第7章 部署\n\n部署单体应用程序是一个相当直接的过程。微服务由于其相互依赖性以及丰富的技术选项，完全是另一回事。当我撰写本书第一版时，本章已有很多内容可谈论你可用的各种选择。自那以后，Kubernetes\
  \ 逐渐成为主流，而 Function As A Service 平台（FAAS）为我们提供了更多思考如何真正交付软件的方式。\n\n尽管过去十年技术可能已经改变，但我认为与构建软件相关的许多核心原则并未改变。事实上，我认为确保我们彻底理解这些基础思想更为重要，因为它们可以帮助我们理解如何在这种新技术的混乱环境中导航。考虑到这一点，本章将确保突出一些与部署相关的核心原则，这些原则值得牢记，同时也展示你可用的不同工具在将这些原则付诸实践方面可能如何提供帮助（或造成阻碍）。\n\
  \n不过首先，让我们稍微掀开幕布，看看当我们从系统架构的逻辑视图转向真实的物理部署拓扑时会发生什么。\n\n## 从逻辑到物理\n\n到目前为止，当我们谈论微服务时，我们是以逻辑意义而非物理意义谈论它们的。我们可以谈论我们的\
  \ `Invoice` 微服务如何与 `Order` 微服务通信，如 图 7-1 所示，而无需实际查看这些服务部署的物理拓扑。架构的逻辑视图通常会抽象掉底层物理部署问题——在本章范围内，这一概念需要改变。\n\
  \n![](img/logical-view.png)\n\n这种对微服务的逻辑视图在实际在真实基础设施上运行它们时可能会隐藏大量复杂性。让我们看看此类图表可能会隐藏哪些细节。\n\
  \n### 多个实例\n\n当我们思考这两个微服务的部署拓扑时，其并不像一件事与另一件事通信那样简单。首先，似乎很可能我们会有每个服务的多个实例。\n\n拥有服务的多个实例可以让你处理更多负载，并且可以提高系统的健壮性，因为你可以更容易地容忍单个实例的故障。因此，我们可能有\
  \ `Invoice` 的一个或多个实例与 `Order` 的一个或多个实例通信。这些实例之间通信的确切处理方式将取决于通信机制的性质，但如果我们假设在这种情况下使用某种基于\
  \ HTTP 的 API，负载均衡器就足以处理将请求路由到不同实例，如 图 7-2 所示。\n\n![](img/06-multiple-instances.png)\n\
  \n你想要的实例数量将取决于应用程序的性质——你需要评估所需的冗余度、预期负载水平等，以得出可行的数量。你可能还需要考虑这些实例将在何处运行。如果出于健壮性原因拥有服务的多个实例，你可能希望确保这些实例不会全部位于同一底层硬件上。进一步说，这可能要求你将不同的实例不仅分布在多台机器上，而且分布在不同的数据中心，以防止整个数据中心变得不可用。这可能导致像\
  \ 图 7-3 中那样的部署拓扑。\n\n![](img/06-multiple-instances-multiple-dcs.png)\n\n这可能看起来过于谨慎——整个数据中心不可用的几率有多大？好吧，我无法对每种情况回答这个问题，但至少在处理主要云服务提供商时，这绝对是你必须考虑的事情。对于托管虚拟机之类的东西，AWS、Azure\
  \ 或 Google 都不会为单台机器提供 SLA，也不会为单个可用区（对于这些提供商而言，这是数据中心的最接近等价物）提供 SLA。实际上，这意味着你部署的任何解决方案都应分布在多个可用区中。\n\
  \n### 数据库\n\n进一步说，还有一个我们到目前为止忽略的重要组件——数据库。正如我已经讨论过的，我们希望微服务隐藏其内部状态管理，因此微服务用于管理其状态的任何数据库都被认为隐藏在微服务内部。\n\
  \n这导致了经常提到的格言“不要共享数据库”，我希望到现在为止其理由已经足够充分。\n\n但当我们考虑到我有多个微服务实例这一事实时，这如何运作？每个微服务实例是否应该有自己的数据库？一句话，不。在大多数情况下，如果我访问我的\
  \ `Order` 服务的任何实例，我希望能够获取有关同一订单的信息。因此，我们需要在同一逻辑服务的不同实例之间实现一定程度的共享状态。这在 图 7-4 中显示。\n\
  \n![](img/06-multiple-instances-one-db.png)\n\n但这是否违反了我们的“不要共享数据库”规则？并不真的。我们主要担心之一是，当在多个不同的微服务之间共享数据库时，与访问和操作该状态相关的逻辑现在分散在不同的微服务中。但在这里，数据是由不同实例的\
  \ **same** 微服务共享的。访问和操作状态的逻辑仍然保留在单个逻辑微服务内。\n\n#### 数据库部署与扩展\n\n与我们的微服务一样，到目前为止我们主要以逻辑意义谈论数据库。在上面的\
  \ 图 7-3 中，我们忽略了底层数据库的冗余或扩展需求的任何问题。我们还回避了你将使用的大多数数据库的一个重要概念——你可以在同一数据库基础设施上管理多个逻辑隔离的数据库。\n\
  \n\n\n## 物理数据库部署\n\n这里使用的确切术语在不同数据库厂商之间有所差异，但总体而言，物理数据库部署可能托管在多台机器上，原因有很多。一个常见的例子是将读写负载在主节点和一个或多个指定用于只读目的的节点之间进行拆分（这些节点通常被称为只读副本）。如果我们为\
  \ `Order` 服务实现这一想法，可能会出现类似 图 7-5 中的情况\n\n![](img/06-read-replicas.png)\n\n所有只读流量都进入其中一个只读副本节点，并且可以通过添加额外的只读节点来进一步扩展读流量。由于关系数据库的工作方式，通过添加额外机器来扩展写操作更困难（通常需要分片模型，这会增加额外复杂性），因此将只读流量转移到这些只读副本通常可以释放写节点上的更多容量以允许进一步扩展。\n\
  \n在此复杂图景中还需考虑的是，同一个数据库基础设施可以支持多个逻辑隔离的数据库。因此，`Invoice` 和 `Order` 的数据库可能都由同一个底层数据库引擎和硬件提供服务，如\
  \ 图 7-6 所示。这可以带来显著的好处，因为它允许你将硬件集中起来为多个微服务服务，可以降低许可成本，并且还可以帮助减少数据库本身管理的相关工作。\n\n\
  ![](img/06-same-physical-database.png)\n\n这里需要认识到的重要一点是，尽管这两个数据库可能运行在相同的硬件和数据库引擎上，但它们仍然是逻辑隔离的数据库。它们不会相互干扰（除非你允许这种情况）。需要考虑的一个主要因素是，如果这个共享的数据库基础设施出现故障，你可能会影响多个微服务，这可能造成灾难性影响。\n\
  \n在我看来，以“on-prem”方式管理自身基础设施并运行的组织更有可能出于我之前概述的成本原因，将多个不同的数据库托管在共享的数据库基础设施上。配置和管理硬件很痛苦（而且历史上数据库至少不太可能运行在虚拟化基础设施上），因此你希望它更少。\n\
  \n另一方面，运行在公共云提供商上的团队更有可能按每个微服务的基础来配置专用的数据库基础设施，如 图 7-7 所示。配置和管理此基础设施的成本要低得多。例如，AWS\
  \ 的关系数据库服务（RDS）可以自动处理备份、升级、多可用区故障转移等相关问题，其他公共云提供商也有类似的产品。这使得为你的微服务拥有更隔离的基础设施在成本上更加有效，让每个微服务所有者拥有更多控制权，而不必依赖共享服务。\n\
  \n![](img/06-different-db-infrastructure.png)\n\n## 环境\n\n当你部署软件时，它运行在某个环境中。每个环境通常会服务于不同的目的，而你可能拥有的环境的确切数量会因软件开发方式以及软件部署到最终用户的方式而大不相同。有些环境会有生产数据，有些则不会。有些环境可能包含所有服务，而其他环境可能只有少量服务，缺失的服务在测试目的下会被假服务替代。\n\
  \n通常，我们认为我们的软件会经过多个预生产环境，每个环境都有其目的，以允许软件开发并测试其准备投入生产的情况——我们之前在 “权衡与环境” 中探讨过这一点。从开发人员笔记本电脑，到持续集成服务器，再到集成测试环境及以后——环境的确切性质和数量取决于多种因素，但主要由你选择如何开发软件驱动。在\
  \ 图 7-8 中，我们看到 MusicCorp 的 `Catalog` 微服务的流水线。微服务会经过不同的环境，然后最终进入生产环境，在那里我们的用户将使用新软件。\n\
  \n![](img/manual-pipeline.png)\n\n我们的微服务运行的第一个环境将是开发人员在提交代码之前工作的任何地方，很可能是他们的本地笔记本电脑。提交代码后，CI\
  \ 流程会启动快速测试。快速和慢速测试阶段都部署到我们的 CI 环境中。如果慢速测试通过，微服务将被部署到预生产环境以允许手动验证（这完全是可选的，但对很多人来说仍然很重要）。如果此手动验证通过，微服务随后将被部署到生产环境。\n\
  \n理想情况下，此过程中的每个环境都应是生产环境的精确副本。这将让我们更有信心软件在到达生产环境时能够正常工作。然而，实际上，我们通常负担不起运行整个生产环境的多个副本，因为这太昂贵了。\n\
  \n我们还希望在流程早期调整环境以实现快速反馈。至关重要的是，我们尽早知道我们的软件是否工作或不工作，以便我们能快速修复问题。我们越早知道软件的问题，修复起来就越快，故障的影响也越小。在本地笔记本电脑上发现问题要比在预生产测试中发现好得多，但同样，在预生产测试中发现问题可能比在生产环境中发现要好得多（尽管我们将在\
  \ \\[待定链接\\] 中探讨围绕此的一些重要权衡）。\n\n这意味着更接近开发者的环境将被调整以提供快速反馈，因此可能会损害它们“生产环境般”的程度。但随着环境越来越接近生产，我们希望它们越来越像最终的生产环境，以确保我们能发现问题。\n\
  \n作为一个简单的实际例子，让我们重新审视之前 `Catalog` 服务的例子，并查看 图 7-9 中的不同环境。本地开发人员笔记本电脑上，我们的服务以在本地运行的单个实例部署。软件构建速度快，但部署为单个节点，运行的硬件与我们在生产环境中预期的非常不同。在\
  \ CI 环境中，我们部署服务的两个副本进行测试，确保我们的负载均衡逻辑正常工作。我们将两个实例都部署到同一台机器上——这降低了成本，使事情更快，并且在流程的这个阶段仍然能提供足够的反馈。\n\
  \n![](img/06-environment-toplogy.png)\n\n最后，在生产环境中，我们的微服务作为实例部署在四个 Pod 中，分布在四台机器上，而这些机器又分布在两个不同的数据中心。\n\
  \n这只是你如何使用环境的示例，你需要的确切设置会因你构建的内容以及部署方式而大不相同。例如，如果你需要为每个客户部署一份软件副本，你可能拥有多个生产环境。\n\
  \n\n\n然而关键在于，从一个环境到另一个环境，你的微服务的确切拓扑结构会发生变化。因此你需要找到方法来改变从一个环境到另一个环境的实例数量，以及任何特定于环境的配置。我们还希望只构建一次服务实例，因此可以推断任何特定于环境的信息需要与已部署的服务构件分离。\n\
  \n你如何在一个环境到另一个环境之间改变微服务的拓扑结构，将在很大程度上取决于你用于部署的机制，以及拓扑结构变化的程度。如果从一个环境到另一个环境唯一发生变化的是微服务实例的数量，这可能就像参数化该值一样简单，以便在部署活动的一部分中传入不同的数字。我们稍后会涉及\
  \ Kubernetes 主题，看看实现特定于环境更改的一些选项。\n\n因此，总结一下，单个逻辑微服务可以部署到多个环境中。从一个环境到下一个环境，每个微服务的实例数量可以根据每个环境的需求而变化。\n\
  \n# 微服务部署原则\n\n面对如此多的微服务部署选项，我认为在此领域建立一些核心原则很重要。对这些原则的扎实理解无论你最终做出什么选择都将对你有所帮助。我们很快会详细讨论每个原则，但为了开始，这里是我们将要涵盖的核心思想。\n\
  \nIsolated Execution:\n以隔离的方式运行微服务实例，使其拥有自己的计算资源，并且其执行不会影响附近运行的其他微服务实例。\n\nFocus\
  \ On Automation:\n随着微服务数量的增加，自动化变得越来越重要。专注于选择允许高度自动化的技术，并将自动化作为文化核心的一部分来采用。\n\n\
  Infrastructure As Code:\n表示基础设施的配置以简化自动化并促进信息共享。将此代码存储在源代码控制中以允许重建环境。\n\nZero-downtime\
  \ Deployment:\n进一步推进独立部署能力，并确保部署微服务的新版本可以在不影响服务用户（无论是人类还是其他微服务）的情况下完成。\n\nDesired\
  \ State Management:\n使用一个维护微服务处于定义状态的平台，在发生故障或流量增加时根据需要启动新实例。考虑使用 GitOps 将其与基础设施即代码结合使用，以推动更多运维任务从代码驱动。\n\
  \n## 隔离执行\n\n你可能很想，特别是在微服务之旅的早期，就把所有的微服务实例都放在一台机器上（这可能是一台物理机器或单台虚拟机），如 图 7-10 所示。纯粹从主机管理角度来看，这更简单。在一个团队管理基础设施而另一个团队管理软件的世界里，基础设施团队的工作量通常是其需要管理的主机数量的函数。如果更多服务被打包到单个主机上，随着服务数量的增加，主机管理工作量并不会增加。\n\
  \n![](img/bdms_0606.png)\n\n然而，这个模型存在一些挑战。首先，它可能使监控变得更加困难。例如，在跟踪 CPU 时，我是否需要独立于其他服务跟踪一个服务的\
  \ CPU？还是我关心的是整个主机的 CPU？副作用也很难避免。如果一个服务承受了巨大的负载，它最终可能会减少系统其他部分可用的资源。这是一个在线时尚零售商 [Gilt](http://bit.ly/1z1WR3T)\
  \ 遇到的问题。从 Ruby on Rails 单体应用开始，他们决定转向微服务以使应用程序更容易扩展，同时更好地适应日益增长的开发人员数量。最初 Gilt 在一台机器上共存了许多微服务，但其中一个微服务的负载不均会对该主机上运行的其他所有内容产生不利影响。这也使主机故障的影响分析变得更加复杂——停用一台主机可能会产生很大的连锁反应。\n\
  \n服务的部署也可能更复杂一些，因为确保一次部署不会影响另一次部署会导致额外的麻烦。例如，如果每个微服务都有不同的（并且可能相互矛盾的）依赖项，我该如何使其工作？\n\
  \n这种模式也可能抑制团队的自主性。如果不同团队的服务安装在同一主机上，谁来为其服务配置主机？很可能这最终会由一个中央团队处理，这意味着部署服务需要更多的协调。\n\
  \n从根本上说，在同一台机器（虚拟或物理）上运行大量微服务实例最终会严重削弱微服务整体的关键原则之一——独立部署能力。因此，我们确实希望以隔离的方式运行微服务实例，如\
  \ 图 7-11 所见。\n\n![](img/bdms_0608.png)\n\n每个微服务实例都有自己的、隔离的执行环境。它可以安装自己的依赖项，拥有自己的一套隔离资源。\n\
  \n正如我的老同事 Neal Ford 所说，我们围绕部署和主机管理的许多工作实践都是为了优化资源稀缺性而进行的尝试。过去，如果我们想要另一台机器来实现隔离，唯一的选择就是购买或租用另一台物理机器。这通常需要很长的提前期并导致长期的财务承诺。在我的经验中，客户每两到三年才配置一次新服务器并不少见，而在这些时间表之外尝试获取额外机器是困难的。但按需计算平台大幅降低了计算资源的成本，而虚拟化技术的改进意味着即使对于内部托管的基础设施也具有更大的灵活性。\n\
  \n随着容器化加入其中，我们在配置隔离执行环境方面拥有前所未有的更多选择。如 图 7-12 所示，大致而言，我们从为服务提供专用物理机器的极端情况开始，这提供了最好的隔离但可能成本最高，到另一端的容器，提供较弱的隔离但往往更具成本效益且配置速度快得多。我们将在本章后面再讨论容器化等技术的具体细节。\n\
  \n![](img/isolation-tradeoffs.png)\n\n如果你将服务部署到类似 PAAS 的工具上，例如 AWS Lambda、Heroku\
  \ 或类似工具，这种隔离会为你提供。取决于平台本身的性质，你很可能期望你的微服务实例在幕后运行在容器或专用 VM 中。\n\n总体而言，容器周围的隔离已经得到足够改进，使其成为微服务工作负载更自然的选择。容器和\
  \ VM 之间隔离的差异已减少到对于绝大多数工作负载而言“足够好”的程度，这在很大程度上就是它们如此受欢迎的原因，并且在大多数情况下往往是我的默认选择。\n\n\
  ## 专注于自动化\n\n\n\n随着你添加更多的微服务，你需要处理的活动部件也会增多。更多的进程、更多需要配置的事项、更多需要监控的实例。转向微服务会将大量复杂性推向运维领域，如果你以纯手动方式管理运维流程，这意味着服务越多，就需要越多的人来处理。\n\
  \n相反，你需要对自动化保持不懈的关注。选择能够让事情以自动方式完成的工具和技术，最好是以基础设施即代码为目标，我们稍后会介绍。\n\n随着微服务数量的增加，自动化变得愈发重要。认真考虑能够实现高度自动化的技术，并将自动化作为文化核心的一部分来采纳。\n\
  \n自动化也是我们确保开发人员仍保持生产力的方式。赋予他们自助式 provision 单个服务或服务组的能力，是让开发人员生活更轻松的关键。理想情况下，开发人员应能够访问与我们生产服务部署所使用的完全相同的工具链，以便我们能及早发现问题。本章我们将探讨大量[content]\n\

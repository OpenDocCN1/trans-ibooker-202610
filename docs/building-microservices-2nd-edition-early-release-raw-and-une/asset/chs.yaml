  \ 自动化\n\n随着微服务数量增加，你需要处理的活动部件也会增多。更多的进程、更多配置项、更多需要监控的实例。转向微服务会把大量复杂性推向运维层面，如果你仍以纯手动方式管理运维流程，那么服务越多，就需要越多的人来操作。\n\
  \n相反，你需要对自动化保持不懈的关注。选择能够让事情以自动方式完成的工具和技术，最好是以基础设施即代码为目标，我们稍后会介绍。\n\n随着微服务数量的增加，自动化变得愈发重要。认真考虑能够实现高度自动化的技术，并将自动化作为文化核心的一部分来采纳。\n\

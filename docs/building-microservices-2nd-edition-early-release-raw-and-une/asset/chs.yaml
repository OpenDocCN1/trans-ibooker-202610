- "# 第2章 如何建模微服务\n\n> *我的对手的推理让我想起异教徒，有人问世界立于何物之上，他回答，“立于一只乌龟之上。”但乌龟又立于何物之上？“立于另一只乌龟之上。”*\n\
  >\n> Joseph Barker (1854)\n\n\n\n所以你知道微服務是什麼，並且希望對它們的關鍵優勢有所了解。你現在可能迫不及待想要開始構建它們，對吧？但從何開始呢？在本章中，我們將探討一些基礎概念，例如信息隱藏、耦合和內聚，並了解它們如何改變我們對微服務邊界劃分的思考方式。我們還將探討你可能使用的不同分解形式，以及更深入地聚焦於領域驅動設計作為一種極其有用的技術。\n\
  \n我們將探討如何思考你的微服務邊界，以便最大化優勢並避免一些潛在的劣勢。但首先，我們需要一些可操作的內容。\n\n## 介绍 MusicCorp\n\n關於想法的書籍配合示例會更好說明。盡可能地，我會分享來自真實世界的故事，但我發現擁有一個虛構的情境來工作也很實用。在整本書中，我們將不斷回顧這個情境，看看微服務的概念在這個世界中如何運作。\n\
  \n那麼讓我們把注意力轉向領先的線上零售商 MusicCorp。MusicCorp 近期曾是實體零售商，但在留聲機唱片業務一落千丈後，它將越來越多的精力集中在線上。公司擁有一個網站，但覺得現在是加倍押注線上世界的時機。畢竟，那些用於音樂的智能手機只是曇花一現的潮流（Zunes\
  \ 顯然好得多），音樂迷們也很樂意等待 CD 送到家門口。品質重於便利，對吧？而且雖然他們可能剛剛得知 Spotify 實際上是一種數位音樂服務，而不是某種針對青少年的護膚療法，MusicCorp\
  \ 對自己的專注方向相當滿意，並確信所有這些串流業務很快就會消退。\n\n儘管有點落後於時代，MusicCorp 仍有宏大的抱負。幸運的是，它決定自己征服世界的最佳機會是確保能夠盡可能輕鬆地進行變更。微服務萬歲！\n\
  \n## 什么构成良好的微服务边界？\n\n在 MusicCorp 的團隊一股腦衝出去，創建一個又一個服務試圖向所有人提供八軌錄音帶之前，讓我們踩下煞車，談談我們需要牢記的最重要的基本思想。我們希望我們的微服務能夠以獨立的方式被變更、部署，並將其功能發布給用戶。能夠獨立於另一個微服務之外變更一個微服務的能力至關重要。那麼在思考如何劃定它們的邊界時，我們需要考慮哪些事項呢？\n\
  \n本質上，微服務只是另一種模組化分解的形式，儘管它在模型之間具有基於網路的交互以及由此帶來的所有相關挑戰。幸運的是，這意味著我們可以依賴模組化軟體和結構化程式設計領域中大量的既有成果，來幫助我們確定如何定義邊界。有鑑於此，讓我們更深入地探討三個關鍵概念，我們在第\
  \ 1 章中曾簡要提及，這些概念對於理解什麼構成良好的微服務邊界至關重要——信息隱藏、內聚性和耦合。\n\n### 信息隐藏\n\n我們在第 1 章中介紹了信息隱藏——這是由\
  \ David Parnas 提出的概念，用於探討定義模組邊界的最有效方式。信息隱藏描述了將盡可能多的細節隱藏在模組（或在我們的情況下面向微服務）邊界後面的願望。Parnas\
  \ 探討了模組理論上應給我們帶來的益處^(1)，具體如下：\n\n開發時間改善\n\n: \n\n透過允許模組獨立開發，我們可以讓更多工作並行進行，並減少向項目添加更多開發人員的影響。\n\
  \n可理解性\n\n: \n\n每個模組都可以獨立檢視並獨立理解。這反過來使得理解整個系統的功能變得更容易。\n\n靈活性\n\n: \n\n模組可以彼此獨立變更，允許對系統功能進行變更而無需其他模組變更。此外，模組可以以不同的方式組合以提供新功能。\n\
  \n這份期望的特徵清單很好地補充了我們試圖透過微服務架構實現的目標——事實上我現在將微服務視為另一種形式的模組化架構。Adrian Colyer 實際上回顧了\
  \ David Parnas 這個時期的多篇論文並以微服務為對象進行了審視，他的總結非常值得閱讀^(2)。\n\n正如 Parnas 在其大部分工作中所探討的那樣，現實是擁有模組並不意味著你實際上能實現這些成果。很多取決於\
  \ *如何* 模組邊界是如何形成的。根據他自己的研究，信息隱藏是充分發揮我們模組化架構潛力的關鍵技術，以現代的眼光來看，同樣適用於微服務。\n\n在 Parnas\
  \ 的另一篇論文^(3)中，我們有這句精闢之言：\n\n> 模組之間的連接是模組彼此之間所做的假設。\n>\n> David Parnas\n\n透過減少一個模組（或微服務）對另一個模組所做的假設數量，我們直接影響它們之間的連接。保持假設數量較少，更容易確保我們可以變更一個模組而不影響其他模組。如果變更模組的開發人員清楚了解該模組如何被他人使用，他們將更容易安全地進行變更，而無需上游調用方也必須變更。\n\
  \n對於微服務而言，這同樣適用，只是我們還有機會在無需部署任何其他東西的情況下部署該變更的微服務，arguably 放大了 Parnas 所描述的三個期望特徵：開發時間改善、可理解性和靈活性。\n\
  \n信息隱藏的影響以多種方式體現，我將在整本書中持續探討這一主題。\n\n### 内聚性\n\n我聽過描述內聚性最簡潔的定義是這個：“一起變更的代碼，待在一起。”對於我們的用途來說，這是一個相當不錯的定義。正如我們已經討論過的，我們圍繞業務功能變更的便利性來優化微服務架構——因此我們希望功能以這樣的方式分組，以便我們可以在盡可能少的地方進行變更。\n\
  \n我們希望相關行為放在一起，無關行為放在別處。為什麼呢？好吧，如果我們想變更行為，我們希望能夠在一個地方進行變更，並盡快發布該變更。如果我們必須在許多不同的地方變更該行為，我們就必須發布許多不同的服務（也許同時）來交付該變更。在許多不同的地方進行變更速度較慢，同時部署大量服務則有風險——這兩者我們都希望避免。\n\
  \n因此我們希望在問題域內找到邊界，以確保相關行為位於一處，並且盡可能鬆散地與其他邊界通信。如果相關功能分散在系統各處，我們說內聚性較弱——而對於我們的微服務架構，我們的目標是強內聚性。\n\
  \n### 耦合\n\n當服務鬆散耦合時，對一個服務的變更不應要求對另一個服務進行變更。微服務的全部目的就是能夠對一個服務進行變更並部署它，而無需變更系統的任何其他部分。這真的非常重要。\n\
  \n\n\n什么样的因素会导致紧密耦合？一个典型的错误是选择一种将一个服务紧密绑定到另一个服务的集成方式，导致服务内部的变更需要消费者也进行变更。\n\n松耦合的服务只了解与之协作的服务所需的最低限度信息。这也意味着我们可能希望限制一个服务到另一个服务的不同类型的调用数量，因为除了潜在的性能问题之外，频繁的通信可能导致紧密耦合。\n\
  \n不过耦合有多种形式，我见过不少关于耦合本质的误解，尤其是在服务化架构的背景下。考虑到这一点，我认为深入探讨这一主题很重要，我们稍后会这样做。\n\n###\
  \ 耦合与内聚的相互作用\n\n我们已经提到过，耦合和内聚的概念显然相关。逻辑上，如果相关功能分散在系统各处，对这些功能的变更会在这些边界间产生连锁反应，意味着耦合更紧密。由结构化设计先驱\
  \ Larry Constantine 命名的康斯坦丁定律^(4) 精辟地概括了这一点：\n\n> 结构稳定如果内聚性强且耦合度低。\n\n> 康斯坦丁定律，Albert\
  \ Endres 和 Dieter Rombach\n\n这里提到的稳定性对我们很重要。为了让我们的微服务边界实现独立部署的承诺，使我们能够并行工作于微服务并减少在这些服务上工作的团队之间的协调量，我们需要在边界本身保持一定的稳定性。如果微服务暴露的契约不断以不向后兼容的方式发生变化，那么上游消费者也将不得不不断变更。\n\
  \n基于这一思路，如果我们能保持内聚性强、耦合松散，那么稳定性就应该随之而来。这里的一个变数是，有时系统的某些部分可能经历如此多的变更，以至于稳定性可能无法实现。我们将在本章后面探讨一个这样的例子，当时我会分享\
  \ SnapCI 背后产品开发团队的经验。\n\n### 耦合的类型\n\n从上面的概述中，你可能会推断出所有耦合都是坏的。这并不完全正确。最终，系统中的一些耦合是不可避免的。我们想要做的是减少耦合的数量。\n\
  \n在结构化编程的背景下，人们已做了大量工作来研究耦合的不同形式，而结构化编程主要考虑的是模块化（非分布式、单体）软件。这些不同的评估耦合模型中有许多重叠或冲突，而且在任何情况下它们主要谈论的是代码层面的事物，而非考虑基于服务的交互。由于微服务是一种模块化架构风格（尽管增加了分布式系统的复杂性），我们可以利用许多这些原始概念并将其应用于微服务系统的背景下。\n\
  \n并非所有想法都能干净地映射，因此我尽力为微服务的不同耦合类型综合出一个可行的模型。在这些想法能干净地映射到先前定义的地方，我保留了那些术语。在其他地方，我不得不创造新术语或融合其他地方的想法。因此请将以下内容视为建立在该领域大量先前研究成果之上，我试图在微服务的背景下赋予其更多意义。\n\
  \n在 图 2-1 中，我们看到不同耦合类型的简要概述，它们按从低（理想）到高（不理想）的顺序组织。\n\n![](img/different_coupling_examples.png)\n\
  \n接下来，我们将逐一查看每种耦合形式，并查看示例以展示它们如何在我们的微服务架构中体现。\n\n#### 领域耦合\n\n领域耦合描述了一种情况，即一个微服务需要与另一个微服务交互，因为它需要使用另一个微服务提供的功能^(7)。\n\
  \n在 图 2-2 中，我们看到 MusicCorp 内部 CD 订单管理的部分情况。在此示例中，`Order Processor` 调用 `Warehouse`\
  \ 微服务来预留库存，并调用 `Payment` 微服务来收取付款。因此，`Order Processor` 对于此操作依赖于并与 `Warehouse` 和\
  \ `Payment` 微服务耦合。我们看不到 `Warehouse` 和 `Payment` 之间存在此类耦合，因为它们不交互。\n\n![](img/domain_coupling_example.png)\n\
  \n在微服务架构中，这种类型的交互在很大程度上是不可避免的。基于微服务的系统依赖多个微服务协作才能完成工作。我们仍然希望将其保持在最低限度——每当你看到单个微服务以这种方式依赖多个下游服务时，这可能是一个令人担忧的迹象——它可能意味着该微服务承担了太多职责。\n\
  \n作为一般规则，领域耦合被认为是一种松散的耦合形式，尽管即使在这里我们也可能遇到问题。需要与大量下游微服务通信的微服务可能指向逻辑过度集中的情况。随着服务之间传输更复杂的数据集，领域耦合也可能变得有问题——这通常指向我们稍后将探讨的更成问题的耦合形式。\n\
  \n请记住信息隐藏的重要性。只分享你绝对必须分享的内容，并且只发送你绝对需要的最少数据。\n\n#### 透传耦合\n\n透传耦合^(8) 描述了一种情况，即一个微服务将数据传递给另一个微服务，纯粹是因为该数据被某个更下游的微服务所需要。从许多方面来看，它是实现耦合中最成问题的形式之一，因为它意味着调用方不仅知道它所调用的微服务又调用了另一个微服务，而且可能还需要知道那个隔了一层的微服务的工作方式。\n\
  \n作为透传耦合的示例，让我们深入了解 MusicCorp 订单处理的部分工作方式，见 图 2-4。在这里，我们有一个 `Order Processor`，它向\
  \ `Warehouse` 发送请求以准备订单发货。作为请求负载的一部分，我们发送了 `Shipping Manifest`。此 `Shipping Manifest`\
  \ 不仅包含客户地址，还包含运输类型。`Warehouse` 只是将此清单传递给下游的 `Shipping` 微服务。\n\n![](img/tramp_coupling.png)\n\
  \n透传耦合的主要问题是下游所需数据的变更可能导致更显著的上游变更。在我们的示例中，如果 `Shipping` 现在需要更改数据的格式或内容，那么 `Warehouse`\
  \ 和 `Order Processor` 很可能都需要变更。\n\n这种情况有几种修复方法。第一种是考虑调用微服务是否可以直接绕过中间方。在我们的示例中，这可能意味着\
  \ `Order Processor` 直接与 `Shipping` 通信。现在，在这种特定情况下，这会带来其他一些问题。我们的 `Order Processor`\
  \ 的领域耦合增加，因为 `Shipping` 是它需要了解的又一个微服务——如果这只是唯一的问题，这可能仍然可以接受，因为领域耦合当然是一种更松散的耦合形式。不过在此解决方案变得更复杂，因为必须先在\
  \ `Warehouse` 预留库存，然后才能使用 `Shipping` 发货，货物发出后我们还需要相应更新库存。这将更多复杂性和逻辑推入 `Order Processor`，而这些逻辑之前是隐藏在\
  \ `Warehouse` 内部的。\n\n\n\n\n## 微服务耦合模式\n\n### 跳板耦合\n\n![](img/tramp_coupling_shipping_direct.png)\n\
  \n对于这个具体示例，我可能会考虑一个更简单（尽管更细微）的变更，即完全隐藏 `Order Processor` 对 `Shipping Manifest` 的需求。将管理库存和安排包裹派送的工作都委托给我们的\
  \ `Warehouse` 服务的想法是有意义的，但我们不喜欢的是我们泄露了一些低层实现，即 `Shipping` 微服务需要一个 `Shipping Manifest`。隐藏这一细节的一种方法是让\
  \ `Warehouse` 在其契约中接收所需的信息，然后在本地构建 `Shipping Manifest`。现在，这意味着如果 `Shipping` 服务更改其服务契约，只要所需数据由\
  \ `Warehouse` 收集，那么从 `Order Processor` 的角度来看，这一变更将是不可见的。\n\n![](img/tramp_coupling_hiding.png)\n\
  \n虽然这有助于保护 `Warehouse` 微服务免受 `Shipping` 的某些变更影响，但仍有一些情况需要所有各方进行变更。让我们考虑我们想要开始国际运输的想法。作为其中的一部分，`Shipping`\
  \ 服务需要在 `Shipping Manifest` 中包含一个 `Customs Declaration`。如果这是一个可选参数，那么我们可以毫无问题地部署\
  \ `Shipping` 微服务的新版本。但如果这是一个必需参数，则 `Warehouse` 需要创建它。它可能能够利用其已有的（或被提供的）信息来完成此操作，但如果需要额外信息，则可能需要\
  \ `Order Processor` 向其传递额外信息。\n\n尽管在这种情况下我们并未消除需要在全部三个微服务中进行变更的需求，但我们获得了关于何时以及如何进行这些变更的更大控制权。如果我们采用初始示例中那种紧密的（直通）耦合，添加这个新的必需\
  \ `Customs Declaration` 可能需要对全部三个微服务进行同步发布。至少通过隐藏这一细节，我们可以更轻松地分阶段部署。\n\n一种最终的方法可以帮助减少直通耦合，即让\
  \ `Order Processor` 仍然通过 `Warehouse` 将 `Shipping Manifest` 发送给 `Shipping` 微服务，但让\
  \ `Warehouse` 完全不知道 `Shipping Manifest` 本身的结构。`Order Processor` 将清单作为订单请求的一部分发送，但\
  \ `Warehouse` 并不会尝试查看或处理该字段——它只是将其视为数据块而不关心其内容。它只是原样转发。`Shipping Manifest` 格式的变更仍然需要对\
  \ `Order Processor` 和 `Shipping` 微服务进行变更，但由于 `Warehouse` 不关心清单本身实际包含的内容，因此无需变更。\n\
  \n### 共同耦合\n\n共同耦合发生在两个或多个微服务使用同一组数据时。这种耦合形式的一个简单且常见的例子是多个微服务使用同一个共享数据库，但这也可能表现为使用共享内存或共享文件系统。\n\
  \n共同耦合的主要问题是数据结构的变更可能同时影响多个微服务。请考虑 图 2-7 中 MusicCorp 的一些服务的示例。正如我们之前讨论的，MusicCorp\
  \ 在全球运营，因此需要有关其运营所在国家的各种信息。在这里，多个服务都在从共享数据库读取静态参考数据。如果该数据库的模式以向后不兼容的方式更改，则需要对数据库的每个消费者进行更改。实际上，由于这个原因，像这样的共享数据往往很难更改。\n\
  \n![](img/common_coupling_reference_data.png)\n\n图 2-7 中的示例相对来说相当温和。这是由于静态参考数据本质上并不经常更改，而且该数据也是只读的——因此我倾向于对这种方式共享静态参考数据感到宽松。然而，如果公共数据的结构更改得更频繁，或者多个微服务对同一数据进行读写，则共同耦合会变得更成问题。\n\
  \n图 2-8 向我们展示了一种情况，其中 `Order Processor` 和 `Warehouse` 服务都在从共享的 `Order` 表中读写，以帮助管理向\
  \ MusicCorp 客户派送 CD 的流程。两个微服务都在更新 `STATUS` 列。`Order Processor` 可以设置 `PLACED`、`PAID`\
  \ 和 `COMPLETED` 状态，而 `Warehouse` 将应用 `PICKING` 或 `SHIPPED` 状态。\n\n![](img/common_coupling_order_update.png)\n\
  \n尽管你可能会认为 图 2-8 是一个有些人为的例子，但这个简单直接的共同耦合示例有助于说明一个核心问题。从概念上讲，我们有 `Order Processor`\
  \ 和 `Warehouse` 微服务管理订单生命周期的不同方面。在对 `Order Processor` 进行更改时，我能否确定我不会以破坏 `Warehouse`\
  \ 对世界的看法的方式更改订单数据，反之亦然？\n\n确保某物的状态以正确方式更改的一种方法是创建有限状态机。状态机可用于管理某个实体从一个状态到另一个状态的转换，确保禁止无效的状态转换。在\
  \ 图 2-9 中，可查看 MusicCorp 中订单的状态允许转换。订单可以从 `PLACED` 转到 `PAID`，但不能直接从 `PLACED` 转到 `PICKING`（这个状态机可能不足以满足完整端到端购买和货物运输所涉及的现实业务流程，但我想给出一个简单的示例来说明这个概念）。\n\
  \n![](img/state_machine_example.png)\n\n在这个特定示例中的问题是 `Warehouse` 和 `Order Processor`\
  \ 都共享管理此状态机的责任。我们如何确保它们对允许的转换达成一致？有方法可以在微服务边界之间管理此类流程，我们将在讨论 Sagas 时在 [链接待定] 中再次回到这个话题。\n\
  \n这里的一个潜在解决方案是确保单个微服务管理订单状态。在 图 2-10 中，`Warehouse` 或 `Order Processor` 都可以向 `Order`\
  \ 服务发送状态更新请求。在这里，`Order` 微服务是任何给定订单的事实来源。在这种情况下，真正重要的是我们将来自 `Warehouse` 和 `Order\
  \ Processor` 的请求视为请求——*请求*。在这种情况下，`Order` 服务的工作是管理与订单聚合相关的可接受状态转换。因此，如果它收到来自 `Order\
  \ Processor` 的将状态从 `PLACED` 直接更改为 `COMPLETED` 的请求，如果该更改无效，它可以自由拒绝该请求。\n\n#### 提示\n\
  \n确保你将发送到微服务的请求视为下游微服务在无效时可以拒绝的东西。\n\n\n\n我在这种情况下看到的一种替代方法是，将 `Order` 服务实现为基本上只是数据库\
  \ CRUD 操作的包装器，请求直接映射到数据库更新。这类似于一个对象拥有私有字段但提供公共的 getter 和 setter —— 行为已从微服务泄漏到上游消费者（降低了内聚性），我们又回到了在多个不同服务之间管理可接受状态转换的世界。\n\
  \n### 警告\n如果你看到一个微服务看起来只是数据库 CRUD 操作的薄包装层，那说明你可能存在弱内聚和更紧密的耦合，因为本应存在于该服务中以管理数据的逻辑反而分散在系统的其他地方。\n\
  \n![](img/common_coupling_order_service.png)\n\n共同耦合的来源也是资源竞争的潜在来源。多个微服务使用同一个文件系统或数据库可能会使该共享资源过载，如果共享资源变慢甚至完全不可用，可能会导致严重问题。共享数据库尤其容易出现此问题，因为多个消费者可以对数据库本身运行任意查询，而这些查询的性能特征可能差异巨大。我见过不止一个数据库被昂贵的\
  \ SQL 查询拖垮 —— 我可能也曾一两次是罪魁祸首^(9)。\n\n所以共同耦合 **有时** 可以接受，但通常不行。即使它无害，也意味着我们对共享数据可以做出的更改受到限制，但它通常也反映出代码缺乏内聚性。它还可能在操作竞争方面给我们带来问题。正因如此，我们认为共同耦合是耦合形式中最不理想的一种，但它会变得更糟。\n\
  \n### 内容耦合\n内容耦合描述的是上游服务深入下游服务的内部并更改其内部状态的情况。这种情况最常见的表现是外部服务直接访问另一个微服务的数据库并直接更改它。内容耦合与共同耦合之间的区别很微妙。表面上看，在这两种情况下，两个或多个微服务都在读写同一组数据。在共同耦合中，你明白自己在使用一个共享的外部依赖。你知道它不在你的控制之下。而在内容耦合中，所有权界限变得不清晰，开发者更改系统也变得更加困难。\n\
  \n让我们回顾一下来自 MusicCorp 的早期示例。在 图 2-11 中，我们有一个 `Order` 服务，它本应管理系统中订单的允许状态变更。`Order\
  \ Processor` 向 `Order` 服务发送请求，不仅委托了将要进行的确切状态变更，还将决定哪些状态转换是允许的责任委托给了 `Order` 服务。另一方面，`Warehouse`\
  \ 服务直接更新存储订单数据的表，绕过了 `Order` 服务中可能用于检查允许更改的任何功能。我们只能希望 `Warehouse` 服务有一套一致的逻辑来确保只进行有效更改。最好的情况，这代表了逻辑的重复。最坏的情况，`Warehouse`\
  \ 中关于允许更改的检查与 `Order` 服务中的不同，结果我们可能会得到处于非常奇怪、令人困惑状态的订单。\n\n![](img/content_coupling_order_service.png)\n\
  \n在这种情况下，我们还面临订单表内部数据结构暴露给外部方的 issue。当更改 `Order` 服务时，我们现在必须非常小心地对该特定表进行更改 —— 这甚至假设我们很清楚该表正被外部方直接访问。这里的简单修复方法是让\
  \ `Warehouse` 向 `Order` 服务本身发送请求，在那里我们可以审核请求，同时隐藏内部细节，从而使对 `Order` 服务的后续更改变得容易得多。\n\
  \n如果你正在开发一个微服务，明确区分可以自由更改的内容和不可以更改的内容至关重要。明确地说，作为开发者，你需要知道何时正在更改服务向外部世界公开的契约的一部分功能。你需要确保在此处进行更改不会破坏上游消费者。不会影响微服务公开的契约的功能可以放心更改。\n\
  \n毫无疑问，共同耦合出现的所有问题在内容耦合中也同样适用，但内容耦合有一些额外的麻烦，使其如此成问题 —— 问题大到足以让一些人将这种耦合形式称为 *病理耦合*。\n\
  \n当你允许外部方直接访问 *你的* 数据库时，你的数据库实际上就成为该外部契约的一部分，尽管你无法轻易推断什么可以更改，什么不可以。你已失去定义什么是共享的（因此不易更改）和什么是隐藏的能力。信息隐藏已经荡然无存。\n\
  \n简而言之，避免内容耦合。\n\n## 领域导向分解的替代方案\n到目前为止，我们已经研究了内聚性和耦合性在预先形成的微服务上的相互作用。正如我在 第 1 章\
  \ 中介绍的那样，我们用来寻找微服务边界的主要机制围绕着领域本身。领域导向的边界在使我们更容易与组织结构保持一致、更容易以不同方式组合功能以向用户提供不同体验方面带来好处，并且经验表明，这些边界往往比其他分解形式更稳定。\n\
  \n虽然我认为总体上使用领域作为识别微服务边界的主要机制是最合理的，但偶尔也有其他方法可能有用，要么作为领域导向分解的替代方案，要么作为额外的工具。\n\n###\
  \ 易变性\n我越来越多地听到对领域导向分解的抵制，经常是由倡导者推动的，他们主张易变性应成为分解的主要驱动因素。基于易变性的分解要求你识别系统中变化更频繁的部分，并将该功能提取到自己的服务中，以便更有效地进行开发。从概念上讲，我对此没有问题，但将其作为唯一做法来推广并无帮助，尤其是在我们考虑推动我们走向微服务的不同驱动因素时。例如，如果我的最大问题与扩展应用程序的需求有关，基于易变性的分解可能不会带来太多好处。\n\
  \n\n\n### 基于波动性的分解\n\n基于波动性的分解背后的思维方式在诸如双模 IT 之类的方案中也很明显。由 Gartner 提出的概念，双模 IT 将世界划分为名字很顺口的“Mode\
  \ 1”（又名记录系统）和“Mode 2”（又名创新系统）类别，具体取决于不同系统需要运行的快慢。据我们所知，Mode 1 系统变化不大，也不需要太多业务参与。Mode\
  \ 2 才是行动所在，系统需要快速变化，并且需要业务的高度参与。暂且不论这种分类方案固有的极端过度简化，它还暗示了一种非常固定的世界观，并且掩盖了随着企业寻求“数字化转型”而在各行业中显而易见的那种变革。过去不需要太多变化的系统部分突然需要变化，以便开拓新的市场机会，并以他们以前从未设想过的方式为客户提供服务。\n\
  \n让我们回到 MusicCorp。他们涉足我们现在所称的数字化的第一次尝试只是拥有一个网页。在 90 年代中期，它所提供的只是待售物品的清单，但你只能打电话下单。它不过是报纸广告的翻版。然后，在线订购成为可能——现在整个仓库此前一直以纸质方式处理，必须进行数字化。谁知道呢，也许\
  \ MusicCorp 某个阶段不得不考虑将音乐以数字形式提供？虽然你可能会认为 MusicCorp 落伍了，但你仍然可以体会到公司在认识到不断变化的技术和客户行为可能需要在难以预见的业务部分进行重大改变时所经历的动荡程度。\n\
  \n我也讨厌双模 IT 这一概念，因为它成为人们把难以改变的东西扔进一个整洁的小盒子并说“我们不需要处理里面的问题——它是 Mode 1”的方式。这又是公司可以采用的另一种模型，以确保实际上什么都不必改变。它也回避了这样一个事实：经常功能上的变化也需要“记录系统”（Mode\
  \ 1）的变化，以允许“创新系统”（Mode 2）的变化。在我的经验中，采用双模 IT 的组织最终确实拥有两种速度——慢和更慢。\n\n公平地说，对于基于波动性分解的支持者来说，他们中许多人并不一定推荐像双模\
  \ IT 这样简化的模型。事实上，我发现如果主要驱动因素是快速上市，那么这种技术对于帮助确定边界非常有用——在这种情况下，提取经常变化（或需要经常变化）的功能是完全合理的。但归根结底，目标决定了最合适的机制。\n\
  \n### 数据\n\n你持有和管理的数据的性质可能会促使你采用不同的分解形式。例如，你可能希望限制处理个人身份信息（PII）的服务，以降低数据泄露风险，同时简化对\
  \ GDPR 等事物的监督和实施。\n\n对于我最近的一位客户，一家我们称之为 PaymentCo 的支付公司，某些类型数据的使用直接影响了我们关于系统分解所做的决策。PaymentCo\
  \ 处理信用卡数据，因此其系统需要遵守支付卡行业（PCI）制定的关于如何管理此数据的各种要求。作为其中的一部分，他们的系统和流程需要接受审计。他们需要处理完整的信用卡数据，且数据量之大意味着其系统必须符合\
  \ PCI 1 级，这是最严格的级别，要求对与数据管理相关的系统和实践进行季度外部评估。\n\n许多 PCI 要求都是常识，但确保整个系统符合这些要求的要求，尤其是系统需要由外部机构审计的需求，证明相当繁重。因此，他们希望将处理完整信用卡数据的系统部分分离出来——意味着只有系统的一个子集需要这种额外的监督级别。在\
  \ 图 2-12 中，我们可以看到我们设计的简化形式。在绿色区域（此处以虚线包围）运行的服务永远看不到完整的信用卡信息——这仅限于红色区域（以破折号包围）的流程（和网络）。网关将调用重定向到适当的服务（和适当的区域）——信用卡信息通过此网关时，实际上也在红色区域。\n\
  \n![](img/pci_separation.png)\n\n由于信用卡信息从未流入绿色区域，该区域内的所有服务都可以免于完整的 PCI 审计。红色区域内的服务在这种监督范围内。在设计过程中，我们尽一切努力限制必须进入该红色区域的内容。需要注意的关键是，我们必须确保信用卡信息绝对不会流向绿色区域——如果绿色区域中的微服务可以请求此信息，或者红色区域中的微服务将此信息发送回绿色区域，那么清晰的分离界限就会被破坏。\n\
  \n数据隔离通常由各种隐私和安全问题驱动——我们将在 \\[待定链接\\] 中稍后回到这个话题和 PaymentCo 的例子。\n\n### 技术\n\n使用不同技术的需求也可以成为寻找边界的一个因素。你可以在单个运行的微服务中容纳不同的数据库，但如果你想混合不同的运行时模型，你可能会面临挑战。如果你确定你的功能的一部分需要在像\
  \ rust 这样的运行时中实现，以获得额外的性能提升，这最终会成为一个主要的推动因素。\n\n当然，如果将其作为分解的通用手段采用，我们必须意识到它可能把我们带向何方。我们在开篇章节中讨论过的经典三层架构，并在\
  \ 图 2-13 中再次展示，是相关技术被分组在一起的例子。正如我们已经探索过的，这通常是一种不太理想的架构。\n\n![](img/three-tiered.png)\n\
  \n### 组织\n\n正如我们在 第 1 章 中介绍康威定律时所建立的那样，组织结构和最终得到的系统架构之间存在固有的相互作用。撇开已显示出这种联系的研究不谈，在我自己的轶事经验中，我一次又一次地看到这种情况发生。你如何组织自己最终会推动你的系统架构，无论好坏。在帮助我们定义服务边界时，我们必须将其视为决策的关键部分。\n\
  \n定义一个所有权会跨越多个不同团队的服务边界不太可能产生我们期望的结果——正如我们在 \\[待定链接\\] 中进一步探讨的那样，微服务的共享所有权是一件棘手的事情。因此，在考虑何时何地定义边界时，我们必须考虑现有的组织结构，并且在某些情况下甚至可能考虑改变组织结构以支持我们想要的架构。\n\
  \n\n\n即使我们在现有的组织结构内开展工作，也存在边界划分不当的危险。 多年前，我和几位同事曾与一家加州的客户合作，帮助公司采用一些更清洁的代码实践并更[content]\n\
  即使我们在现有的组织结构内开展工作，也存在我们无法将边界放在正确位置的危险。 多年前，我和几位同事曾与一家加州的客户合作，帮助公司采用一些更清洁的代码实践并向自动化测试迈进。\
  \ 我们从一些易于取得的成果开始，例如服务分解，这时我们注意到一个更令人担忧的问题。 我无法详细说明该应用程序的功能，但它是一个面向公众的应用程序，拥有庞大的全球客户群。\n\
  \n团队和系统都已成长。 最初是某一个人的设想，系统不断增加更多功能，也拥有更多用户。 最终，组织决定通过让一支驻巴西的新开发团队承担部分工作来提升团队产能。\
  \ 系统被拆分，前半部分应用程序本质上是无状态的，实现了面向公众的网站，如 图 2-14 所示。 系统的后半部分只是一个位于数据存储之上的远程过程调用（RPC）接口。\
  \ 本质上，可以想象你把代码库中的一个存储库层抽取出来做成一个独立的服务。\n\n![](img/a30-onion.png)\n\n更改经常需要对两个服务同时进行。\
  \ 两个服务都使用低级、RPC 风格的方法调用进行通信，这些调用过于脆弱（我们将在 第 3 章 中进一步讨论）。 服务接口也非常啰嗦，导致性能问题。 这导致需要复杂的\
  \ RPC 批处理机制。 我称之为 *onion architecture*，因为它有很多层，而且当我们需要切开它时让我哭泣。\n\n乍一看，沿着地理/组织线拆分之前单体系统的想法完全合理，我们将在\
  \ \\[待定链接\\] 中进一步展开。 然而，这里团队并没有沿着堆栈做一个纵向的、业务导向的切片，而是选取了之前进程内的 API 并做了一个横向切片。 更好的模式应该是加州团队拥有一个端到端的纵向切片，由前端和数据访问功能的相关部分组成，而巴西团队则负责另一个切片。\n\
  \n## 不同目标，不同驱动\n\n微服务不是目标。 拥有微服务并不会让你“获胜”。 采用微服务架构应该是一个有意识的决定，是基于理性决策的决定。 你应该考虑采用微服务架构，以便实现你当前系统架构无法实现的目标。\n\
  \n如果你不清楚自己想要实现什么，又如何为决策过程提供信息以决定应该采取哪些选项呢？ 你通过采用微服务想要实现的目标将极大地改变你投入时间的重点，以及你在创建微服务时的积极程度。\
  \ 它也有助于指导你哪种方法在寻找微服务边界时最有意义。 PaymentCo 例如就以其对数据的主导关注为指导。\n\n换句话说，虽然我可以分享我自己的观点，即我们应该如何定义微服务边界，并且我认为围绕业务域对其建模是一个合理的起点，但其他因素也可能在决定你想要选择何种分解方式时发挥作用。\n\
  \n### 混合模型与例外\n\n正如我希望到目前为止已经很清楚，我在寻找这些边界方面并不教条。 如果你遵循信息隐藏的指导原则并理解耦合与内聚之间的相互作用，那么你很可能会避免所选机制中最糟糕的一些陷阱。\
  \ 我认为通过关注这些思想，你是 *more* 可能会最终得到一个面向领域的架构，但这只是顺带一提。 事实是，即使你决定将“domain-oriented”作为定义微服务边界的主要机制，混合模型也常常有其理由。\n\
  \n我们迄今为止概述的不同机制之间也存在很多潜在的相互作用。 在这里选择过于狭隘会导致你遵循教条，而非做正确的事情。 基于波动性的分解如果你的重点是提高交付速度会很有意义，但如果这导致你抽取一个跨越组织边界的服务，那么请预期你的变更速度会因交付冲突而受损。\n\
  \n我可能会基于对业务域的理解定义一个不错的 `Warehouse` 服务，但如果该系统的某部分需要在 C++ 中实现，而另一部分需要在 Kotlin 中实现，那么你就需要沿着这些技术线进一步分解。\n\
  \n对我而言，组织和领域驱动的服务边界是我起点的选择。 这是我通常会采用的工具，因为作为一条经验法则，它往往是最有效的方法。 但它只是一个通用模型。 领域是唯一驱动这种决策的因素的情况也极为罕见。\
  \ 通常，我们上面概述的许多因素都会发挥作用，而哪些因素影响你的决策将取决于你试图解决的问题。 你需要查看自己的具体情况来确定什么最适合你——希望我在这里为你提供了一些不同的选项供考虑。\
  \ 只要记住，如果有人说“The only way to do this is `X`!” 他们很可能只是在兜售更多的教条。 你可以做得更好。\n\n话虽如此，让我们通过更详细地探讨领域驱动设计，更深入地研究领域建模的话题。\n\
  \n## 足够的领域驱动设计\n\n正如我们所见，将我们的服务围绕业务域进行建模对我们的微服务架构具有显著优势。 问题是如何提出该模型——而这正是领域驱动设计（DDD）发挥作用的地方。\n\
  \n让我们的程序更好地代表程序本身运行的现实世界的需求并不是一个新想法。 如 Simula 之类的面向对象编程语言被开发出来是为了让我们能够建模真实的域。 但要让这个想法真正成形，仅靠编程语言的能力是不够的。\n\
  \nEric Evans’ 领域驱动设计^(10) 提出了一系列重要思想，帮助我们在程序中更好地表示问题域。 这些思想的全面探讨超出了本书的范围，但我将提供在微服务架构背景下最重要的思想的简要概述。\n\
  \n### 通用语言\n\n通用语言指的是我们应该努力在代码中使用与用户相同的术语的想法。 这种想法的核心是，通过在交付团队和实际使用系统的人之间拥有共同的语言，将更容易对现实世界域进行建模，并且也应改善沟通。\n\
  \n作为一个反例，我回忆起在大型全球银行工作时的一件事。 我们在企业流动性领域工作，这是一个花哨的术语，基本上指的是在同一企业实体持有的不同账户之间转移现金的能力。\
  \ 产品负责人非常好合作，她对自己想要推向市场的各种产品有着极其深刻的理解。 与她合作时，我们会讨论诸如 haircuts 和 end-of-day sweeps\
  \ 之类的事情，这些在她的世界里很有意义，并且对她的客户也有意义。\n\n\n\n另一方面，代码中完全没有这种语言。先前曾做出决定，使用标准的数据模型来构建数据库。它被广泛称为“The\
  \ IBM banking model”，但我从未弄清楚这究竟是 IBM 的标准产品，还是只是 IBM 顾问的创作。通过定义松散的概念“arrangement”，理论上任何银行操作都可以被建模。贷款？那就是一个\
  \ arrangement。买股票？那也是一个 arrangement！申请信用卡？猜猜看——那也是一个 arrangement！\n\n数据模型污染了代码的程度，以至于代码库完全失去了对我们正在构建的系统的真实理解。我们并不是在构建一个通用的银行应用程序。我们正在构建一个专门用于管理企业流动性的系统。问题在于我们必须将产品负责人的丰富领域语言映射到通用的代码概念——这意味着需要大量工作来帮助翻译。因此，我们的业务分析师经常花费时间反复解释同样的概念。\n\
  \n将真实世界的语言融入代码后，一切变得容易得多。使用直接来自产品负责人的术语编写的用户故事，开发者更有可能理解其含义并弄清楚需要做什么。\n\n### 聚合\n\
  \n在 DDD 中，`aggregate` 是一个有些令人困惑的概念，存在许多不同的定义。它只是一个任意的对象集合吗？我应该从数据库中取出最小的单元吗？我一直使用的方法是首先将聚合视为真实领域概念的表示——比如\
  \ `Order`、`Invoice`、`Stock Item` 等。聚合通常围绕着生命周期，这使得它们可以作为状态机来实现。\n\n以 MusicCorp 领域为例，`Order`\
  \ 聚合可能包含多个代表订单中商品的明细项。这些明细项只有作为整体 `Order` 聚合的一部分才有意义。\n\n我们希望将聚合视为自包含的单元；我们希望确保处理聚合状态转换的代码与状态本身一起分组。因此，一个聚合应该由一个微服务管理，尽管单个微服务可能负责管理多个聚合。\n\
  \n总体而言，将聚合视为具有状态、具有身份，并且其生命周期将在系统中管理的实体。它们通常指现实世界中的概念。\n\n在考虑聚合和微服务时，单个微服务将处理一种或多种不同类型聚合的生命周期和数据存储。如果另一个服务中的功能想要更改其中一个聚合，它需要直接请求对该聚合的更改，或者让聚合本身对系统中的其他事物做出反应以启动自己的状态转换，也许通过订阅其他微服务发出的事件。\n\
  \n这里的关键在于，如果外部方请求聚合的状态转换，聚合可以说不。理想情况下，你希望以这样的方式实现聚合，使得非法状态转换是不可能的。\n\n聚合可以与其他聚合存在关系。在\
  \ 图 2-15 中，我们有一个 `Customer` 聚合，它与一个或多个 `Orders` 以及一个或多个 `Wishlists` 相关联。这些聚合中的每一个都可以由同一个微服务管理，也可以由不同的微服务管理。\n\
  \n![](img/ch01-customer-to-order.png)\n\n如果聚合之间的关系存在于单个微服务的范围内，如果使用关系数据库，这些关系可以很容易地使用类似外键关系的方式存储。如果这些聚合之间的关系跨越微服务边界，我们需要某种方式来建模这种关系。在\
  \ 图 2-16 中，我们在财务账簿中针对客户做了一笔分录——这可能代表一个 `Payment` 聚合。在账簿表中，我们存储客户的引用，这里以 URI 的形式，我们在构建基于\
  \ REST 的系统时可能会使用它^11)。我们将在 第三章 中重新讨论此类跨服务关系的主题，以更详细地探讨这些引用的性质和用途。\n\n![](img/customer_references.png)\n\
  \n将系统拆分为聚合的方式有很多，其中一些选择高度主观。出于性能原因或实现便利性，你可能会决定随着时间的推移重新塑造聚合。不过起初，我认为实现方面的考虑是次要的，最初让系统用户的心理模型成为我初始设计的指导，直到其他因素发挥作用。\n\
  \n### 有界上下文\n\n`bounded context` 通常代表组织内部更大的组织边界。在该边界范围内，需要履行明确的职责。这有点模糊，所以让我们看另一个具体例子。\n\
  \n在 Music Corp，我们的仓库热闹非凡——管理发出的订单（以及偶尔的退货）、接收新库存、进行叉车比赛等等。其他地方，财务部门可能没那么好玩，但仍在组织内部发挥重要作用，处理工资单、支付运费等。\n\
  \n有界上下文隐藏实现细节。存在内部关注点——例如，所使用的叉车类型对仓库以外的人来说几乎没有兴趣。这些内部关注点应隐藏于外部世界——他们不需要知道，也不应该关心。\n\
  \n从实现角度来看，有界上下文包含一个或多个聚合。一些聚合可能在有界上下文之外暴露；其他聚合可能在内部隐藏。与聚合一样，有界上下文可能与其他有界上下文存在关系——当映射到服务时，这些依赖关系成为服务间的依赖关系。\n\
  \n让我们暂时回到 MusicCorp 业务。我们的领域是我们运营的整个业务。它涵盖从仓库到接待台，从财务到订购的一切。我们可能在软件中建模所有这些，也可能不建模，但那确实是我们运营的领域。让我们思考一下该领域中看起来像\
  \ Evans 所指的有界上下文的部分。\n\n#### 隐藏模型\n\n对于 MusicCorp，我们可以将财务部门和仓库视为两个独立的有界上下文。它们都对外部世界有明确的接口（以库存报告、工资单等形式），并且它们有只有它们自己需要知道的细节（叉车、计算器）。\n\
  \n现在财务部门不需要知道仓库详细的内部运作。不过它确实需要知道一些事情——例如它需要知道库存水平以保持账目最新。图 2-17 显示了一个示例上下文图。我们看到仓库内部的概念，如\
  \ `Picker`（拣货人员）、代表库存位置的货架等等。同样，总账中的分录对财务至关重要，但在此并未外部共享。\n\n![](img/shared_model.png)\n\
  \n\n\n不过，要计算公司的估值，财务员工需要我们持有的股票信息。此时，库存项就成为两个上下文之间的共享模型。然而，请注意，我们不需要盲目地从仓库上下文中暴露有关库存项的所有信息。在\
  \ 图 2-18 中，我们可以看到仓库有界上下文内的 `Stock Item` 包含对货架位置的引用，但共享表示仅包含一个计数。因此，存在仅限内部的表示，以及我们公开的外部表示。通常，当你有不同的内部和外部表示时，为避免混淆，将它们命名为不同名称可能有益——在这种情况下，一种方法可以是将共享的\
  \ `Stock Item` 称为 `Stock Count`。\n\n![](img/stock_item_representations.png)\n\n\
  ### 共享模型\n\n我们还可以拥有出现在多个有界上下文中的概念。在 图 2-17 中我们看到 `customer` 同时存在于两个位置。这意味着什么？`customer`\
  \ 被复制了吗？思考这个问题的方式是，从概念上讲，`finance` 和 `warehouse` 都需要了解一些关于我们的 `customer` 的信息。`Finance`\
  \ 需要了解对 `customer` 支付的财务款项，而 `Warehouse` 需要了解 `customer` 的程度在于它知道已发送了哪些包裹，以便追踪交付。\n\
  \n在这种情况下，像 `customer` 这样的共享模型在不同的有界上下文中可能具有不同的含义，因此可能被称为不同的名称。我们可能很乐意在 `Finance`\
  \ 中保留名称“`customer`”，但在 `Warehouse` 中我们可能称他们为“`recipient`”，因为那是他们在该上下文中扮演的角色。我们在两个位置都存储有关\
  \ `customer` 的信息，但信息是不同的。`Finance` 存储有关 `customer` 的财务付款（或退款）的信息，`warehouse` 存储与已发货商品相关的信息。我们仍可能需要将这两个本地概念链接到全局\
  \ `customer`，并且可能希望查找有关该 `customer` 的通用共享信息，如其姓名或电子邮件地址——我们可以使用 图 2-16 中所示的技术来实现这一点。\n\
  \n### 将聚合和有界上下文映射到微服务\n\n`aggregate` 和 `bounded context` 都为我们提供了具有明确界面的内聚单元，与更广泛的系统交互。`aggregate`\
  \ 是一个自包含的状态机，专注于我们系统中单一的领域概念，而 `bounded context` 则代表一组相关的聚合，同样具有对外部世界的明确接口。\n\n\
  因此两者都可以作为服务边界良好地工作。在起步阶段，正如我已经提到的，你希望减少处理的服务数量。因此，你可能应该以涵盖整个 `bounded contexts`\
  \ 的服务为目标。随着你逐渐熟悉，并决定将这些服务拆分为更小的服务，请围绕 `aggregate` 边界进行拆分。\n\n### 一直到底都是乌龟\n\n起初，你可能会识别出若干粗粒度的有界上下文。但这些有界上下文本身又可以包含进一步的有界上下文。例如，你可以将\
  \ `warehouse` 分解为与订单履行、库存管理或货物接收相关的能力。在考虑微服务的边界时，首先以更大、更粗粒度的上下文为出发点，然后在希望获得拆分这些缝隙带来的好处时，沿着这些嵌套上下文进行细分。\n\
  \n这里的一个技巧是，即使你后来决定将建模整个有界上下文的服务拆分为更小的服务，你仍然可以将其决策隐藏在外部世界之外——也许是通过向消费者提供更粗粒度的 API。将服务分解为更小部分的决定可以说是实现层面的决策，因此如果可以的话，我们不妨将其隐藏。在\
  \ 图 2-19 中我们看到了一个例子。我们已将 `Warehouse` 拆分为 `Inventory` 和 `Shipping`。就外部世界而言，仍然只有 `Warehouse`\
  \ 微服务。不过在内部，我们进一步分解了事物，以便让 `Inventory` 管理 `Stock Items`，并让 `Shipping` 管理 `Shipments`。记住，我们希望将单个\
  \ `aggregate` 的所有权保留在单个微服务内部。\n\n![](img/nested-services.png)\n\n这又是另一种信息隐藏形式——我们以这样的方式隐藏了关于内部实现的决策，以至于如果未来此实现细节再次发生变化，我们的消费者将不会察觉。\n\
  \n偏好嵌套方法另一个原因可能是将架构分块以简化测试。例如，在测试消费仓库的服务时，我不必为仓库上下文内的每个服务创建存根，只需为更粗粒度的 API 创建存根即可。这也可以在考虑更大范围的测试时为你提供一个隔离单元。例如，我可能会决定进行端到端测试，在其中启动仓库上下文内的所有服务，但对于所有其他协作方，我可能会为其创建存根。我们将在\
  \ \\[Link to Come\\] 中进一步探讨测试和隔离。\n\n### 过早分解的危险\n\n基于对领域理解不清而分解微服务存在危险。一个这样的例子来自我之前的公司\
  \ `ThoughtWorks`。他们的一款产品名为 `SnapCI`，这是一款托管的持续集成和持续交付工具（我们将在 \\[Link to Come\\] 中稍后讨论这些概念）。该团队之前曾在另一款类似工具\
  \ `Go-CD` 上工作过，这是一款现在开源的持续交付工具，可以在本地部署而不是托管在云中。\n\n尽管 `SnapCI` 和 `Go-CD` 项目在早期有一些代码复用，但最终\
  \ `SnapCI` 证明是一个完全新的代码库。尽管如此，团队在 CD 工具领域之前的经验使他们更有信心更快地识别边界，并将系统构建为一组微服务。\n\n不过几个月后，很明显\
  \ `SnapCI` 的用例有细微的不同，以至于最初对服务边界的把握并不完全正确。这导致在各服务之间进行了大量更改，并伴随着较高的变更成本。最终团队将服务合并回一个单体系统中，给了他们更多时间来更好地理解边界应该存在于何处。一年后，团队随后能够将单体系统拆分为微服务，其边界被证明更加稳定。这远非我见过的唯一一个这种情况的例子。过早地将系统分解为微服务可能代价高昂，尤其是在你对该领域不熟悉的情况下。在许多方面，拥有一个你想要分解为微服务的现有代码库，比从一开始就尝试转向微服务要容易得多，正是出于这个原因。\n\
  \n### 以业务概念进行沟通\n\n我们对系统实施的更改通常是关于业务希望对系统行为做出的更改。我们正在更改向客户公开的功能——能力。如果我们的系统沿着代表我们领域的边界上下文进行分解，我们想要做出的更改更有可能被隔离到单个微服务边界。这减少了我们需要进行更改的地方数量，并允许我们快速部署该更改。\n\
  \n\n\n也非常重要将这些微服务之间的通信视为相同的业务概念。软件对业务领域的建模不应止步于有界上下文的概念。组织各部分之间共享的相同术语和思想应在接口中得到体现。将表单在这些微服务之间传递的想法视为组织内部表单传递的方式可能会很有用。\n\
  \n## 事件风暴\n\n*事件风暴* 是由 Alberto Brandolini 开发的一种技术，是一种协作头脑风暴练习，旨在帮助揭示领域模型。与让架构师坐在角落里自行构想领域模型是什么的表示相比^(12)，事件风暴将技术和非技术利益相关者聚集在一起进行联合练习。其理念是通过将领域模型的发展作为一项联合活动，最终形成对世界的共享、连贯的视图。\n\
  \n值得在此提及的是，虽然使用事件风暴定义出的领域模型可用于实现事件驱动系统，而且映射非常直接，你也可以用这样的领域模型构建更偏向请求/响应式的系统。\n\n\
  ### 后勤安排\n\nAlberto 对事件风暴的运行方式有一些非常具体的看法，而在其中一些观点上我非常赞同。首先，让所有人聚到一个房间里。这通常是最困难的一步——让人们的日程对齐可能是一个问题，找到足够大的房间也可能是一个问题。在新冠疫情前的世界里这些问题都存在，但我在英国因病毒而封锁期间撰写此文时，我意识到未来这可能更成问题。不过关键在于同时让所有利益相关者到场。你希望为计划建模的领域各部分都有代表——用户、领域专家、产品负责人，或任何最适合帮助代表该领域部分的人。\n\
  \n一旦大家在同一个房间里，Alberto 建议移除所有椅子，以确保每个人都起身参与。作为一名腰不好的人，虽然我理解这一点，但这可能并不适合所有人。我同意 Alberto\
  \ 的一点是需要有足够大的空间进行建模。这里常见的解决方案是将大卷的牛皮纸钉在房间的墙上，以便利用所有墙面来记录信息。\n\n主要的建模工具是便利贴，用来捕捉不同的概念，不同颜色的便利贴代表不同的概念。\n\
  \n### 流程\n\n练习从参与者识别 *领域事件* 开始。这些代表系统中发生的事情——它们是你关心的事实。“Order Placed” 在 MusicCorp\
  \ 的上下文中将是一个我们关心的良好事件，“Payment Received” 也是如此。这些被记录在橙色便利贴上。就在这一点上，我对 Alberto 的结构又有一点不同意见，因为事件是你将捕捉到的数量最庞大的东西，而橙色便利贴出人意料地难以获得^(13)。\n\
  \n接下来，参与者识别导致这些事件发生的命令。命令是由人类做出的决定去做某事（软件的用户）。在这里，你试图理解系统的边界，并识别系统中的关键人类参与者。命令被记录在蓝色便利贴上。\n\
  \n对于事件风暴会议中的技术人员来说，在这个阶段他们应该倾听非技术同事在此提出的想法。这项练习的关键部分是不让任何当前实现扭曲对领域是什么的认知（那是后来的事）。在这个阶段，你希望创造一个空间，可以将关键利益相关者头脑中的概念提炼出来，并将这些想法公开。\n\
  \n在记录了事件和命令后，接下来是聚合体。你在此阶段拥有的事件不仅有助于分享系统中发生的事情，而且开始突出潜在的聚合体可能是什么。想想前面提到的领域事件“Order\
  \ Placed”。这里的名词——Order——很可能是一个潜在的聚合体。而“Placed”是可能发生在订单上的事情，因此这很可能是聚合体生命周期的一部分。聚合体用黄色便利贴表示，与该聚合体相关的命令和事件会被移动并聚集在聚合体周围。这也有助于你理解聚合体之间的关系——一个聚合体的事件可能会触发另一个聚合体的行为。\n\
  \n在识别出聚合体后，它们随后被分组到有界上下文中。有界上下文最常见的是遵循公司的组织结构，而练习的参与者非常适合理解哪些聚合体被组织的哪些部分使用。\n\n\
  事件风暴远不止于此——这只是简要概述。要更详细地了解事件风暴的工作方式，我建议你阅读 Alberto 所著的（目前正在进行中）书籍“事件风暴^(14)”。\n\n\
  ## 总结\n\n在本章中，你已经了解了一些构成良好微服务边界的内容，以及如何在问题空间中找到缝隙，从而获得低耦合和强内聚的双重好处。对领域有详细的理解可以成为帮助我们找到这些缝隙的重要工具，通过将微服务与这些边界对齐，我们确保所得系统有很大机会保持这些优点。我们还得到了关于如何进一步细分微服务的提示，这将在后面更深入地探讨。我们还介绍了\
  \ MusicCorp，这是我们将在整本书中使用的示例领域。\n\nEric Evans 的 *领域驱动设计* 中提出的思想对我们找到服务的合理边界非常有用，而我在这里只是浅尝辄止。我推荐\
  \ Vaughn Vernon 的书籍 *实现领域驱动设计*（Addison-Wesley），以帮助你理解这种方法在实践中的具体操作。\n\n尽管本章大部分内容都是高层次的，但在下一章我们需要更技术化。服务之间接口的实现存在许多陷阱，可能导致各种麻烦，如果我们要防止系统变成一个庞大、纠缠不堪的混乱，我们必须深入探讨这一主题。\n\
  \n^(1) Parnas, David, “On the criteria to be used in decomposing systems into modules”,\
  \ 1971 [*https://kilthub.cmu.edu/articles/On\\_the\\_criteria\\_to\\_be\\_used\\\
  _in\\_decomposing\\_systems\\_into\\_modules/6607958*](https://kilthub.cmu.edu/articles/On_the_criteria_to_be_used_in_decomposing_systems_into_modules/6607958)\n\
  \n^(2) 明显的起点是 Adrian 对“On the criteria…”的总结 [*https://blog.acolyer.org/2016/09/05/on-the-criteria-to-be-used-in-decomposing-systems-into-modules/*](https://blog.acolyer.org/2016/09/05/on-the-criteria-to-be-used-in-decomposing-systems-into-modules/)，但对\
  \ Parnas 早期著作“Information Distribution Aspects of Design Methodology”的介绍包含了一些很棒的见解以及\
  \ Parnas 本人的评论： [*https://blog.acolyer.org/2016/10/17/information-distribution-aspects-of-design-methodology/*](https://blog.acolyer.org/2016/10/17/information-distribution-aspects-of-design-methodology/)\n\
  \n^(3) Parnas, David, “Information distribution aspects of design methodology”,\
  \ 1971\n\n\n\n^(4) 在我所著的《Monolith To Microservices》一书中，我将此归因于 Larry Constantine\
  \ 本人。虽然该陈述简洁地概括了 Constantine 在这一领域的大部分工作，但这段引文实际上应归于 Albert Endres 和 Dieter Rombach\
  \ 来自他们所著的书“A Handbook of Software and Systems Engineering”。\n\n^(5) Constantine,\
  \ Larry and Edward Yourdon, Structured Design, Yourdon Press\n\n^(6) Page-Jones,\
  \ Meilir, Practical Guide to Structured Systems Design (Yourdon Press Computing)\n\
  \n^(7) 这个概念与 Domain Application Protocol 类似，后者定义了组件在基于 REST 的系统中交互的规则。\n\n^(8) Pass\
  \ through coupling 是我为 M. Page-Jones 在《The Practical Guide to Structured Systems\
  \ Design》中最初描述为 Tramp coupling 的概念所取的名称。我在这里选择使用不同的术语，是因为我发现原术语有些问题，并且对更广泛的受众来说意义不大\n\
  \n^(9) 好吧，不止一次两次。**很多**次不止一次两次…\n\n^(10) Eric Evans, *领域驱动设计：应对软件核心复杂性* (Boston:\
  \ Addison-Wesley, 2004)。\n\n^(11) 我知道有些人反对在 REST 系统中使用模板化 URI，我理解原因——我只是想让这个示例保持简单\n\
  \n^(12) 如果这是你，我并无冒犯之意——我自己也做过不止一次\n\n^(13) 我的意思是，为什么不选黄色呢？它是常见颜色！\n\n^(14) Event\
  \ Storming, Alberto Brandolini, Leanpub (work in progress) [*https://leanpub.com/introducing\\\
  _eventstorming*](https://leanpub.com/introducing_eventstorming)\n"
- "# 第3章 微服务通信风格\n让微服务之间的通信做到正确对很多人来说是个难题，很大程度上是因为我感觉人们倾向于在没有先考虑你可能想要的不同类型的通信之前就选择一种技术方法。在本章中，我将尝试拆解不同的通信风格，以帮助你理解每种风格的优缺点，并帮助你理解哪种方法最适合你的问题域。\n\
  我们将研究同步阻塞和异步非阻塞通信机制，并比较请求-响应协作与事件驱动协作。\n到本章结束时，你应该能更好地理解可供选择的各种选项，并将具备基础知识，这将在后续章节开始探讨更详细的实现问题时提供帮助。\n\
  \n## 从进程内到进程间\n好吧，让我们先把容易的部分排除掉——至少我*希望*是容易的部分。也就是说，跨网络在不同进程*之间*进行的调用（进程间）与在单个进程*内部*进行的调用（进程内）**非常**不同。在一个层面上，我们可以忽略这种区别。例如，很容易认为一个对象对另一个对象进行方法调用，然后就将这种交互映射到两个微服务通过网络通信。撇开微服务不仅仅是对象这一事实不谈，这种思维会给我们带来很多麻烦。\n\
  让我们现在来看一下这些差异中的一些，以及它们如何改变你对微服务之间交互的思考方式。\n\n### 性能\n进程内调用和进程间调用的性能存在根本差异。当我进行进程内调用时，底层的编译器和运行时可以执行大量优化来减少调用的影响，包括内联调用，使其就像根本没有调用一样。进程间调用则不可能进行此类优化。数据包必须被发送。应预期进程间调用的开销相比进程内调用的开销是显著的。前者是可以非常精确测量的——仅在数据中心往返一个数据包就需要毫秒级时间——而进行方法调用的开销是你无需担心的。\n\
  这通常会让你想要重新思考 API。进程内有意义的 API 在进程间情况下可能就不合适了。我可以在进程内无顾虑地跨 API 边界进行 1000 次调用。我是否想在两个微服务之间进行\
  \ 1000 次网络调用？也许不。\n当我将参数传递给方法时，我传递的数据结构通常不会移动——更可能的是我传递的是内存位置的指针。将对象或数据结构传递给另一个方法并不需要分配更多内存来复制数据。\n\
  而在网络上通过微服务进行调用时，数据实际上必须序列化为可在网络上传输的形式。然后数据需要被发送，并在另一端反序列化。因此，我们可能需要更关注进程之间传输的有效载荷大小。最近一次你在进程内传递数据结构时意识到它的大小是什么时候？现实是，你可能不需要知道——现在，你需要了。这可能会让你减少发送或接收的数据量（如果我们考虑到信息隐藏，这也许不是坏事），选择更高效的序列化机制，甚至将数据卸载到文件系统并仅传递指向该数据的指针。\n\
  这些差异可能不会立即给你带来问题，但你确实需要意识到它们。我见过很多试图让开发者忽略网络调用正在发生的尝试。我们创造抽象来隐藏细节的愿望是我们能够更高效地做更多事情的重要部分，但有时我们创造的抽象隐藏得太多。开发者需要意识到如果他们做某事会导致网络调用，否则不要对日后出现一些糟糕的性能瓶颈感到惊讶。\n\
  \n### 更改接口\n当我们考虑进程内接口的更改时，推出更改的过程很直接。实现接口的代码和调用接口的代码都打包在同一个进程中。事实上，如果我使用具有重构能力的\
  \ IDE 更改方法签名，通常 IDE 本身会自动重构对该更改方法的调用。推出此类更改可以以原子方式完成——接口的两侧都打包在单个进程中。\n然而，在微服务之间进行通信时，公开接口的微服务和使用该接口的消费微服务是可单独部署的微服务。当对微服务接口进行向后不兼容的更改时，我们要么需要与消费者进行锁定式部署，确保它们更新为使用新接口，要么找到某种方式分阶段推出新的微服务契约。我们将在本章后面更详细地探讨这个概念。\n\
  \n### 错误处理\n在进程内，如果我调用一个方法，错误的性质往往相当直接。简而言之，错误要么是预期且易于处理的，要么是灾难性的，以至于我们只是将错误沿调用栈向上传播。总的来说，错误是确定的。\n\
  \n\n\n在分布式系统中，错误的性质可能有所不同。你容易受到各种超出控制范围的错误的影响。网络会超时。下游微服务可能暂时不可用。网络会断开连接，由于消耗过多内存而导致容器被杀死，在极端情况下，你的数据中心的部分区域甚至可能起火^(1)。\n\
  \n其中许多错误往往是暂时的——它们是短暂的问题，可能自行消失，因此是你可能想要重试的事情——比如简单的网络超时。其他问题则难以轻易处理。因此，拥有更丰富的错误返回语义变得很重要，以便客户端能够采取适当的行动。\n\
  \nHTTP 就是一个理解这一重要性的协议示例。每个 HTTP 响应都有一个状态码，其中 400 和 500 系列代码保留用于错误。400 系列错误代码是请求错误——本质上，下游服务是在告诉客户端原始请求存在问题。因此，你可能应该放弃——例如重试\
  \ `404 Not Found` 有什么意义呢？500 系列响应代码与下游问题相关，其中一部分会提示客户端问题可能是暂时的。例如 `503 Service Unavailable`\
  \ 表示下游服务器无法处理请求，但这可能是临时状态。在这种情况下，上游客户端可能会决定重试该请求。另一方面，如果客户端收到 `501 Not Implemented`\
  \ 响应，重试可能帮助不大。\n\n无论你是否选择基于 HTTP 的协议来进行微服务之间的通信，如果你对错误性质有丰富的语义，就能让客户端更容易执行补偿操作，进而帮助你构建更健壮的系统。\n\
  \n## 进程间通信技术：选择太多\n\n> “在一个选择太多而时间太少 的世界里，显而易见的做法就是直接忽略一些东西。”\n>\n> Seth Godin\n\
  \n我们可用于进程间通信的技术范围非常广。因此，我们常常会被选择所困扰。经常，我发现人们只是倾向于使用他们熟悉的技术，或者只是他们在会议上了解到最新的热门技术。这样做的问题在于，当你选择了特定的技术时，你往往也在接受随之而来的思想和限制。这些限制可能并不适合你——而且技术背后的思维方式可能与你试图解决的问题并不一致。\n\
  \n如果你试图构建一个网站，像 Angular 或 React 这样的单页应用技术就是一个糟糕的选择。同样，尝试将 Kafka 用于请求-响应真的不是一个好主意，因为它是为了更基于事件的交互而设计的（我们稍后会谈到这些主题）。然而我一次又一次地看到技术被用在错误的地方。人们选择新的闪亮技术（如微服务！）而不考虑它是否适合他们的问题。\n\
  \n就微服务之间通信可用的令人眼花缭乱的技术阵列而言，我认为首先谈论你想要的通信风格，然后再寻找实现这些风格的合适技术是很重要的。基于这一点，让我们来看一下我使用了几年的模型，它可以帮助区分微服务到微服务通信的不同方法，进而帮助你筛选想要查看的技术选项。\n\
  \n## 微服务通信风格\n\n在 图 3-1 中，我们可以看到我使用的模型的概述。\n\n异步非阻塞：\n发出调用的微服务能够在调用是否被接收的情况下继续处理。\n\
  \n请求-响应：\n一个微服务向另一个微服务发送请求，要求执行某项操作。它期望收到对请求的响应以告知结果。\n\n事件驱动：\n微服务发出事件，其他微服务消费这些事件并据此做出反应。发出事件的微服务不知道是否有任何微服务消费它发出的事件。\n\
  \n通用数据：\n不常被视为通信风格，微服务通过某些共享数据源进行协作。\n\n在使用此模型帮助团队决定合适方法时，我花费大量时间了解他们所处的环境。他们在可靠通信、可接受的延迟和通信量方面的需求都会影响技术选择。但总的来说，我倾向于先决定在给定情况下同步还是异步通信更合适。如果同步通信是一个选项，那么我坚定地处于请求-响应通信的世界中。如果异步通信更有意义，那么我需要做第二个选择，即事件驱动、基于请求-响应的还是基于通用数据的通信是否更合适。正如我们将要探讨的，事件驱动通信本质上是异步的，但请求-响应调用可以同步或异步实现。\n\
  \n## 模式：同步阻塞\n\n在同步阻塞调用中，微服务向下游进程（很可能是另一个微服务）发送某种调用，并在调用完成并且可能在收到响应之前被阻塞。在 图 3-2\
  \ 中，`Order Processor` 向 `Loyalty` 微服务发送调用，以通知它应向客户账户添加一些积分。\n\n![](img/sync-example.png)\n\
  \n通常，同步阻塞调用是在等待下游进程的响应。这可能是因为调用的结果需要用于某些后续操作，或者只是为了确保调用成功，如果不成功则执行某种重试。因此，我看到的几乎所有同步阻塞调用也都构成请求-响应调用，我们稍后会讨论这一点。\n\
  \n### 优点\n\n阻塞的同步调用有一种简单而熟悉的感觉。我们中的许多人以根本上同步的风格学习编程，像阅读脚本一样阅读代码，每一行依次执行，下一个代码行等待轮到它做某事。你在其中使用进程间调用的大多数情况可能都是以同步、阻塞的方式完成的。例如在数据库上运行\
  \ SQL 查询，或向下游 API 发出 HTTP 请求。\n\n从较少分布的架构（如单进程单体）迁移过来时，在还有很多其他全新的事物发生时，坚持这些熟悉的思想是有意义的。\n\
  \n### 缺点\n\n\n\n## 同步调用\n\n同步调用的主要挑战在于发生的固有时间耦合，我们在第 2 章中简要探讨过这一主题。当上面的示例中 `Order\
  \ Processor` 向 `Loyalty` 发出调用时，`Loyalty` 微服务需要可达，调用才能工作。如果 `Loyalty` 微服务不可用，则调用将失败，`Order\
  \ Processor` 需要弄清楚要执行何种补偿操作——这可能涉及立即重试，将调用缓冲以便稍后重试，或者干脆放弃。\n\n由于调用发送方处于阻塞状态并等待下游微服务响应，因此如果下游微服务响应缓慢，或者网络延迟存在问题，则调用发送方将被阻塞很长时间等待响应。如果\
  \ `Loyalty` 微服务处于显著负载下，对请求响应缓慢，这反过来会导致 `Order Processor` 响应缓慢。\n\n因此，与异步调用相比，使用同步调用会使系统更容易受到下游中断引发的级联问题的影响。\n\
  \n### 何时使用\n\n对于简单的微服务架构，我对使用同步阻塞调用并没有太大的问题。对许多人来说，它们的熟悉性是在掌握分布式系统时的一大优势。\n\n对我而言，这类调用开始变得有问题的地方在于当你开始出现更多调用链时——例如在图\
  \ 3-3 中，我们有一个来自 MusicCorp 的示例流程，其中我们正在检查可能存在欺诈活动的付款。`Order Processor` 调用 `Payment`\
  \ 服务以完成付款。`Payment` 服务随后希望与 `Fraud Detection` 微服务核实是否应允许此操作。`Fraud Detection` 微服务随后需要从\
  \ `Customer` 微服务获取信息。\n\n![](img/fraud-detection-long-chain.png)\n\n如果所有这些调用都是同步且阻塞的，我们可能会面临许多问题。任意四个相关微服务中的一个出现问题，或它们之间的网络调用出现问题，都可能导致整个操作失败——我们可说故障面更大。这还不包括这类长链可能导致显著的\
  \ *资源竞争* 这一事实。在幕后，`Order Processor` 很可能有一个网络连接处于打开状态，等待 `Payment` 的回复。`Payment`\
  \ 随后也有一个网络连接处于打开状态，等待 `Fraud Detection` 的响应，以此类推。需要保持打开的大量连接会对运行中的系统产生影响——你更有可能遇到可用连接耗尽的问题，或因此遭受网络拥塞增加。\n\
  \n为了改善这种情况，我们可以首先重新审视微服务之间的交互。例如，也许我们可以将 `Fraud Detection` 的使用从主要购买流程中移除，如图 3-4\
  \ 所示，而让它在后台运行。如果它发现某个特定客户存在问题，其记录会相应更新，并且这可以在付款流程的更早阶段进行检查。实际上，这意味着我们将部分工作并行化。通过缩短调用链的长度，我们会看到操作整体延迟改善，并将我们的一个微服务（`Fraud\
  \ Detection`）从购买流程的关键路径中移除，对于关键操作而言，这减少了一个需要担心的依赖。\n\n![](img/fraud-detection-background.png)\n\
  \n我们当然也可以在不改变此处工作流程的情况下，用某种非阻塞交互方式替换阻塞调用的使用，我们接下来会探讨这一点。\n\n## 模式：异步非阻塞\n\n在异步通信中，将调用发送到网络上的行为不会阻塞发出调用的微服务。它能够继续进行其他处理，而无需等待响应。如果需要响应，它可以在响应返回时处理该响应。非阻塞异步通信有多种形式，但我们将更详细地研究我在微服务架构中看到的三种最常见的风格。它们是：\n\
  \n通过共享数据通信\n\n: \n\n上游微服务更改某些共享数据，随后一个或多个微服务会使用这些数据。\n\n请求-响应\n\n: \n\n一个微服务向另一个微服务发送请求，要求其执行某项操作。当请求的<|message|>\n\
  \n\n\n最终，在考虑异步通信是否适合你的情况下，你还需要考虑想要选择哪种 *type* 的异步通信，因为每种都有其自身的权衡。总体而言，确实存在一些特定的用例会让我倾向于使用某种形式的异步通信。长时间运行的进程是一个明显的候选者，正如我们在上文\
  \ 图 3-5 中探讨的那样。此外，存在长调用链且难以重构的情况也可能是一个不错的候选。我们将在后面深入探讨这一点，当我们查看三种最常见的异步通信形式时——请求-响应调用、事件驱动通信以及通过共享数据进行通信。\n\
  \n## 模式：通过共享数据进行通信\n\n一种涵盖多种实现方式的通信风格是通过共享数据进行通信。这种模式用于一种情况，即一个微服务将数据放入定义的位置，然后另一个微服务（或可能多个）使用这些数据。它可以简单到一个微服务将文件丢在某个位置，而稍后另一个微服务拾取该文件并对其进行处理。这种集成风格本质上是异步的。\n\
  \nAn example of this is shown in 图 3-6, where the `New Product Importer` creates\
  \ a file that is then read by the downstream `Inventory` and `Catalog` microservices.\n\
  \n![](img/common-data.png)\n\n这种模式在某种程度上是你会看到的最常见的通用进程间通信模式，然而我们有时却完全没有将其视为一种通信模式——很大程度上我认为是因为进程之间的通信往往间接到难以察觉。\n\
  \n### 实现\n\n要实现此模式，你需要某种用于数据持久存储。文件系统在许多情况下已经足够。我构建过许多系统，它们只是定期扫描文件系统，注意到新文件的存在并据此做出反应。当然你也可以使用某种健壮的分布式内存存储。值得注意的是，任何将要对该数据采取行动的下游微服务都需要自己的机制来识别新数据是否可用——轮询是解决此问题的常见方案。\n\
  \n此模式的两个常见示例是数据湖和数据仓库。在这两种情况下，这些解决方案通常旨在帮助处理大量数据，但可以说它们在耦合方面处于光谱的相反两端。对于数据湖，源系统以其认为合适的任何格式上传原始数据，而这些原始数据的下游消费者预计知道如何处理该信息。对于数据仓库，仓库本身是一个结构化数据存储。向数据仓库推送数据的微服务需要了解数据仓库的结构——如果结构以向后兼容的方式发生变化，则这些生产者将需要更新。\n\
  \n对于数据仓库或数据湖，假设信息流是单向的。一个微服务将数据发布到公共数据存储，下游消费者读取该数据并执行适当的操作。这种单向流可以使信息流的推理变得更容易。更成问题的一种实现是使用共享数据库，其中多个微服务同时对同一数据存储进行读写，我们在探讨公共耦合时在\
  \ 第 2 章 中讨论过其示例——图 3-7 显示了 `Order Processor` 和 `Warehouse` 都在更新同一记录。\n\n![](img/common_coupling_order_update.png)\n\
  \n### 优点\n\n此模式可以非常简单地实现，使用大家普遍理解的技术。如果你可以读取或写入文件，或读取和写入数据库，你就可以使用此模式。使用普遍且易于理解的技术也能够在不同类型的系统之间实现互操作性，包括旧的\
  \ mainframe 应用或可定制的现成软件（COTS）产品。这里数据量也较少令人担忧——如果你一次性发送大量数据，此模式可以很好地工作。\n\n### 缺点\n\
  \n下游消费微服务通常会通过某种轮询机制，或许是通过定期触发的定时任务来意识到有新数据需要处理。这意味着该机制在低延迟情况下不太可能有用。当然你可以将此模式与其他类型的调用结合起来，通知下游微服务有新数据可用。例如，我可以将文件写入共享文件系统，然后向感兴趣的微服务发送调用，通知它有新数据可能需要处理。这可以缩小数据发布与数据处理之间的差距。总体而言，如果你使用此模式处理非常大的数据量，低延迟不太可能成为你的需求重点。如果你有兴趣发送更大量的数据并希望以更“实时”的方式处理它们，那么使用某种流技术如\
  \ Kafka 会更合适。\n\n另一个很大的缺点，如果你记得我们对 图 3-7 中公共耦合的探讨，就会相当明显，那就是公共数据存储成为潜在的耦合源。如果该数据存储的结构以某种方式发生变化，它可能会破坏微服务之间的通信。\n\
  \n通信的健壮性也将取决于底层数据存储的健壮性。这严格来说不是一个缺点，但需要注意的是。如果你将文件丢在文件系统上，你可能希望确保文件系统本身不会以有趣的方式失败。\n\
  \n### 何时使用\n\n此模式真正闪光的地方在于实现进程之间的互操作性，而这些进程可能对可使用的技术有限制。让现有系统与你的微服务的 GRPC 接口通信或订阅其\
  \ Kafka 主题，从微服务的角度来看可能更方便，但从消费者的角度来看则不然。旧系统可能对可支持的技术有限制，并且变更成本高。另一方面，即使是旧的 mainframe\
  \ 系统也应该能够从文件中读取数据。当然，这一切都取决于使用广泛支持的数据存储技术——我也可以使用类似 redis 缓存的东西来实现此模式。但你的旧 mainframe\
  \ 系统能与 redis 通信吗？\n\n此模式的另一个主要优势在于共享大量数据时。如果你需要在文件系统上发送多 GB 的文件，或将数百万行加载到数据库中，那么此模式就是最佳选择。\n\
  \n## 模式：请求-响应通信\n\n使用请求-响应时，微服务向下游服务发送请求，要求其执行某项操作，并期望收到包含请求结果的响应。这种交互可以通过同步阻塞调用进行，也可以在异步非阻塞方式下实现。这种交互的一个简单示例显示在\
  \ 图 3-8 中，其中 `Chart` 微服务，该服务汇总不同流派的畅销 CD，向 `Inventory` 服务发送请求，要求获取某些 CD 的当前库存水平。\n\
  \n![](img/fetch-stock-level.png)\n\n\n\n# 模式：请求-响应通信\n\n像这样从其他微服务检索数据是请求-响应调用的常见用例。有时，你只需要确保某件事得到执行。在图\
  \ 3-9 中，`Warehouse`微服务收到了来自`Order Processor`的请求，要求其预留库存。`Order Processor`只有在确认库存已成功预留时才继续进行付款。如果库存无法预留——也许是因为商品不再可用——则可以取消付款。在这种需要按特定顺序完成调用的情况下使用请求-响应调用是很常见的。\n\
  \n![](img/reserve-stock.png)\n\n## 实现：同步与异步\n\n像这样的请求-响应调用可以以阻塞的同步方式或非阻塞的异步方式实现。在同步调用中，你通常会看到与下游微服务建立网络连接，并通过该连接发送请求。连接保持打开，等待下游微服务响应。在这种情况下，发送响应的微服务实际上不需要知道发送请求的微服务的任何信息——它只是通过入站连接将内容返回。\n\
  \n使用异步请求响应，情况就不那么直接了。让我们重新审视与预留库存相关的流程。在图 3-10 中，预留库存的请求作为消息通过某种消息代理发送出去，我们将在本章后面探讨消息代理。与消息直接从`Order\
  \ Processor`发送到`Inventory`微服务不同，它会先进入队列。`Inventory`在有能力时从该队列消费消息。它读取请求，执行预留库存的相关工作，现在需要将响应发送回`Order\
  \ Processor`正在读取的队列。`Inventory`微服务需要知道将响应路由到哪里。在我们的示例中，它通过另一个队列发送此响应，而该队列随后被`Order\
  \ Processor`消费。\n\n因此，在非阻塞的异步交互中，接收请求的微服务要么需要隐式地知道将响应路由到哪里，要么需要被告知响应应发送到哪里。使用队列时，我们还获得了额外的好处，即多个请求可以缓冲在队列中等待处理。这在请求无法快速处理时很有帮助。微服务可以在准备好时消费下一个请求，而不是被太多调用压垮。当然，这在很大程度上取决于队列吸收这些请求的能力。\n\
  \n当微服务以这种方式接收响应时，它可能需要将响应与原始请求关联起来。这具有挑战性，因为可能已经过去了很长时间，并且根据所用协议的性质，响应可能不会返回到发送请求的微服务的同一实例。在将预留库存作为下单一部分的示例中，我们需要知道如何将库存已预留的响应与特定订单关联起来，以便继续处理该订单。一种简单的方法是将与原始请求相关联的任何状态存储到数据库中，这样当响应到来时，接收实例可以重新加载相关状态并据此行动。\n\
  \n## 何时使用\n\n请求-响应调用对于在继续进一步处理之前需要请求结果的任何情况都非常合理。它也非常适合微服务需要知道调用是否失败，以便执行某种补偿操作，例如重试的情况。如果符合你的情况，请求-响应是一个明智的方法——然后唯一剩下的问题就是决定采用同步还是异步实现，其权衡与我们之前讨论的相同。\n\
  \n## 模式：事件驱动通信\n\n与请求-响应调用相比，事件驱动通信看起来相当奇怪。与微服务要求其他微服务执行某事不同，微服务会发出事件，而这些事件可能被其他微服务接收也可能不被接收。这是一种固有的异步交互，因为事件监听器将在自己的执行线程上运行。\n\
  \n事件是对某事已发生的一种陈述，几乎总是发生在发出事件的微服务的世界内部发生的某事。发出事件的微服务对其他微服务使用该事件的意图一无所知，事实上甚至可能不知道其他微服务的存在。它在需要时发出事件，这就是它的全部责任。\n\
  \n在图 3-11 中，我们看到`Warehouse`发出与订单打包过程相关的事件。这些事件被两个微服务`Notifications`和`Inventory`接收，并据此做出反应。`Notifications`微服务发送电子邮件以通知客户订单状态的变化，而`Inventory`微服务则可以在商品被打包进客户订单时更新库存水平。\n\
  \n![](img/warehouse-events.png)\n\n与请求-响应模型相比，这是一种职责的倒置。有了事件，`Warehouse`只是广播事件，假定感兴趣方会据此做出反应。它不知道事件的接收者是谁，使得事件驱动交互通常耦合更松散。与请求-响应调用相比，这是一种职责的倒置，可能需要一段时间才能理解。与请求-响应相比，我可能会期望`Warehouse`在适当时告诉`Notifications`微服务发送电子邮件。在这种模型中，`Warehouse`需要知道哪些事件需要通知客户。采用事件驱动交互时，我们反而将这种责任推入`Notifications`微服务。\n\
  \n我们在此看到的事件驱动交互中的职责分配，可以映射到组织试图创建更自主团队时所看到的相同职责分配。与将所有责任集中控制不同，我们希望将其推入团队本身，以便它们能够更自主地运作——我们将在\\\
  [链接待定\\]中重访这一概念。在这里，我们将职责从`Warehouse`推向`Notifications`和`Payment`——这可以帮助我们减少像`Warehouse`这样的微服务的复杂性，并在系统中实现更均衡的“智能”分布。我们将在比较编排和编舞时更详细地探讨这一想法。\n\
  \n### 实现\n\n这里我们需要考虑两个主要部分：一种让微服务发出事件的方式，以及一种让消费者获知事件已发生的方式。\n\n传统上，像`RabbitMQ`这样的消息代理试图处理这两个问题。生产者使用\
  \ API 将事件发布到代理。代理处理订阅，允许消费者在事件到达时收到通知。这些代理甚至可以处理消费者的状态，例如帮助跟踪他们之前看到哪些消息。这些系统通常设计为可扩展且具有弹性，但这并非免费。它会增加开发过程的复杂性，因为你可能需要运行另一个系统来开发和测试你的服务。可能还需要额外的机器和专业知识来保持此基础设施的运行。但一旦运行，它可以成为实现松耦合事件驱动架构的非常有效的方式。总的来说，我很喜欢这种方式。\n\
  \n\n\n然而，仍需警惕中间件的世界，其中消息代理只是其中很小的一部分。队列本身是完全合理、有用的东西。然而，厂商倾向于与其捆绑大量软件，这可能导致越来越多的智能被推入中间件，正如\
  \ `Enterprise Service Bus` 之类的东西所证明的那样。确保你知道自己得到的是什么：让中间件保持愚蠢，将智能保留在端点中。\n\n另一种方法是尝试使用\
  \ `HTTP` 作为传播事件的方式。`ATOM` 是一种符合 `REST` 的规范，定义了（其中包括）发布资源订阅源的语义。存在许多客户端库允许我们创建和消费这些订阅源。因此，当我们的客户服务发生变化时，我们的客户服务就可以将事件发布到这样的订阅源。我们的消费者只需轮询订阅源，查找更改。一方面，我们可以重用现有的\
  \ `ATOM` 规范和任何相关库，这很有用，而且我们知道 `HTTP` 处理扩展非常好。然而，`HTTP` 在低延迟方面表现不佳（某些消息代理在该方面表现出色），而且我们仍需处理消费者需要跟踪已看到的消息并管理自身轮询计划这一事实。\n\
  \n我见过人们花费大量时间实现更多开箱即用的行为，这些行为在合适的消息代理中已经提供，以便让 `ATOM` 适用于某些用例。例如，`Competing Consumer\
  \ pattern` 描述了一种方法，即启动多个工作器实例来竞争消息，这对于扩展工作器数量以处理一系列独立作业非常有效（我们将在 \\[Link to Come\\\
  ] 中稍后讨论）。然而，我们希望避免两个或更多工作器看到同一条消息的情况，因为我们最终会做比需要更多的工作任务。有了消息代理，标准队列会处理这个问题。有了 `ATOM`，我们现在需要在所有工作器之间管理自己的共享状态，以尽量减少重复劳动的可能性。\n\
  \n如果你已经拥有一个良好、健壮的消息代理可用，请考虑使用它来处理事件的发布和订阅。但如果你还没有，请看看 `ATOM`，但要意识到沉没成本谬误。如果你发现自己想要消息代理提供的越来越多支持，到了一定程度，你可能想要改变你的方法。\n\
  \n就我们实际通过这些异步协议发送的内容而言，与同步通信相同的考虑也适用。如果你目前对使用 `JSON` 编码请求和响应感到满意，就坚持使用它。\n\n###\
  \ 事件中有什么？\n\n在 图 3-12 中，我们看到一个事件从 `Customer` 微服务广播出去，通知感兴趣的各方有新客户在系统中注册。两个下游微服务\
  \ `Loyalty` 和 `Notifications` 关心此事件。`Loyalty` 微服务通过为新客户设置账户来响应接收事件，以便他们开始赚取积分，而\
  \ `Notifications` 微服务则向新注册的客户发送电子邮件，欢迎他们体验 `MusicCorp` 的奇妙乐趣。\n\n![](img/customer-registration-events.png)\n\
  \n对于请求，我们是在要求一个微服务执行某事，并提供执行请求操作所需的信息。对于事件，我们是在广播一个其他各方**可能**感兴趣的事实，但由于发出事件的微服务无法也不应该知道谁接收该事件，我们如何知道其他各方可能需要从事件中获得什么信息？那么，到底应该在事件中包含什么？\n\
  \n#### 仅一个 ID\n\n一个选项是事件仅包含新注册客户的标识符，如 图 3-13 所示。`Loyalty` 微服务只需要此标识符来创建匹配的忠诚度账户，因此它拥有所需的所有信息。然而，虽然\
  \ `Notifications` 微服务知道在接收到此类事件时需要发送欢迎电子邮件，但它需要额外信息来完成工作——至少是电子邮件地址，可能还有客户姓名以便给电子邮件增添个人色彩。由于这些信息不在\
  \ `Notifications` 微服务接收到的事件中，因此它别无选择，只能从 `Customer` 微服务获取这些信息，我们在 图 3-13 中可以看到这一点。\n\
  \n![](img/customer-registration-events-callback.png)\n\n这种方法有一些缺点。首先，`Notification`\
  \ 微服务现在必须知道 `Customer` 微服务，增加了额外的领域耦合。虽然领域耦合，如我们在 第 2 章 中讨论的那样，在耦合谱系中属于较松散的一端，但我们仍希望在可能的情况下避免它。如果\
  \ `Notification` 接收到的事件包含其所需的所有信息，则不需要此回调。接收微服务的此回调还可能导致另一个主要缺点——即在接收微服务数量很大的情况下，发出事件的微服务可能会因此受到大量请求的冲击。想象一下，如果五个不同的微服务都接收到相同的客户创建事件，并且都需要请求额外信息——它们都需要立即向\
  \ `Customer` 微服务发送请求以获取所需内容。随着对特定事件感兴趣的微服务数量增加，这些调用的影响可能会变得显著。\n\n#### 完全详细的事件\n\
  \n我更喜欢的替代方案是，将所有内容放入事件中，而你本可以否则通过 `API` 共享这些内容。如果你允许 `Notifications` 微服务请求给定客户的电子邮件地址和姓名，为什么不一开始就将其放入事件中呢？在\
  \ 图 3-14 中，我们看到这种方法——`Notification` 现在更具自足性，能够在无需与 `Customer` 微服务通信的情况下完成工作。事实上，它可能永远不需要知道\
  \ `Customer` 微服务甚至存在。\n\n![](img/customer-registration-events-detailed.png)\n\n\
  除了信息更丰富的事件可以实现更松散的耦合之外，信息更丰富的事件还可以充当给定实体发生了什么的历史记录。这可以帮助你在实施审计系统时，或许甚至提供在特定时间点重构实体的能力——这意味着这些事件可以用作\
  \ `event sourcing` 的一部分，我们稍后会简要探讨这一概念。\n\n虽然这种方法绝对是我的首选，但它并非没有一些缺点。首先，如果事件相关的数据很大，我们可能会担心事件的大小。现在，现代消息代理（假设你使用它来实现事件广播机制）对消息大小有相当宽松的限制。`Kafka`\
  \ 中消息的默认最大大小为 1MB，而 `RabbitMQ` 的最新版本对单条消息的理论上限为 512MB（从之前的 2GB 限制下降！），尽管对于这种大消息可能会出现一些有趣的性能问题。但即使是\
  \ `Kafka` 上消息最大大小提供的 1MB，也给了我们发送大量数据的很大空间。最终，如果你进入了一个开始担心事件大小的领域，那么一种混合方法可能是部分信息在事件中，而其他（较大）数据可以根据需要查找。\n\
  \n\n\n在 图 3-14 中，`Loyalty` 不需要知道客户的电子邮件地址或姓名，然而由于该信息通过事件被发送，它仍然会收到这些信息。这可能会引起担忧，如果我们试图限制哪些微服务可以看到何种类型的数据——例如，我可能希望限制哪些微服务可以看到个人身份信息（或\
  \ PII）、支付卡详细信息或类似的敏感数据。解决此问题的一种方法可能是实现类似 Split Horizon Communication 的机制，我们将在 [链接待定]\
  \ 中稍后探讨。\n\n另一个需要考虑的是，一旦我们将数据放入事件中，它就成为我们与外部世界契约的一部分。我们必须意识到，如果我们从事件中移除一个字段，可能会破坏外部方。信息隐藏在事件驱动协作中仍然是一个重要概念——我们放入事件中的数据越多，外部方对该事件的假设就越多。我的一般原则是，如果我愿意通过请求-响应\
  \ API 共享相同的数据，那么我就乐意将信息放入事件中。\n\n### 是否有效？\n\nTODO: 移至工作流讨论？\n\n其中一些异步的东西看起来很有趣，对吧？事件驱动架构似乎能带来更解耦、可扩展的系统。而且确实可以。但这些编程风格确实会导致复杂性增加。这不仅仅是我们刚才讨论的管理发布和订阅消息所需的复杂性，还包括我们可能面临的其他问题。例如，在考虑长时间运行的异步请求-响应时，我们必须思考响应回来时该怎么办。它是否返回到发起请求的同一个节点？如果是，如果该节点宕机了怎么办？如果不是，我是否需要在某个地方存储信息以便相应地做出反应？如果有合适的\
  \ API，短暂的异步可能更容易管理，但即便如此，对于习惯于进程内同步消息调用的程序员来说，这也是一种不同的思维方式。\n\n是时候讲一个警示故事了。2006\
  \ 年，我正在为一家银行构建定价系统。我们会查看市场事件，并确定投资组合中需要重新定价的项目。一旦确定了需要处理的项目列表，我们就会把它们全部放到消息队列中。我们利用网格创建了一个定价工作进程池，可以根据需要扩展和缩减定价集群。这些工作进程使用竞争消费者模式，每一个都尽可能快地吞噬消息，直到没有剩余可处理的消息为止。\n\
  \n系统已经运行起来，我们感到相当自满。然而，就在我们发布新版本后不久，我们遇到了一个棘手的问题。我们的 worker 不断死亡。并且死亡。并且死亡。\n\n\
  最终，我们追踪到了问题。出现了一个 bug，导致某种类型的定价请求会使 worker 崩溃。我们使用的是事务队列：当 worker 死亡时，其对请求的锁定超时，定价请求会被放回队列——然后另一个\
  \ worker 拾取它并死亡。这是 Martin Fowler 所称的 [灾难性故障转移](http://bit.ly/1EmZMss) 的一个经典例子。\n\
  \n除了 bug 本身之外，我们还未能为队列中的作业指定最大重试限制。我们修复了 bug 本身，并配置了最大重试次数。但我们也意识到需要一种查看并可能重放这些错误消息的方法。我们最终不得不实现一个消息医院（或死信队列），如果消息失败则会被发送到那里。我们还创建了一个\
  \ UI 来查看这些消息，并在需要时重试它们。这些问题对于只熟悉同步点对点通信的人来说并不 immediately 显而易见。\n\n事件驱动架构以及一般异步编程所带来的相关复杂性让我相信，你在开始采用这些想法时应保持谨慎。确保已具备良好的监控，并强烈考虑使用\
  \ correlation IDs，它允许你在进程边界之间追踪请求，我们将在 \\[链接待定\\] 中深入介绍。\n\n我还强烈建议查看 *企业集成模式*（Addison-Wesley），其中包含有关该领域可能需要考虑的不同消息模式的更多详细信息。\n\
  \n## 摘要\n\n在本章中，我们拆解了一些微服务通信的关键风格，并讨论了各种权衡。并非总有一个唯一的 **正确** 选项，但希望我已提供足够的信息，关于同步和异步调用、事件驱动和请求-响应风格的通信，以帮助你在特定上下文中做出正确的选择。\n\
  \n本章主要关注一个微服务如何与另一个微服务通信，在下一章中我们将超越这一点，探讨如何让多个微服务协作以实现工作流。\n\n^(1) 真实故事\n\n^(2)\
  \ 请注意，这非常简化——例如，我完全省略了错误处理代码。如果你想了解更多关于 `async/await` 的内容，特别是 JavaScript，The Modern\
  \ JavaScript Tutorial 是一个很好的起点：[*https://javascript.info/*](https://javascript.info/)\n"
- "# 第4章 实现微服务通信\n\n在微服务之间通信的方式上，有令人眼花缭乱的各种选择。但哪一个是正确的：SOAP？XML-RPC？REST？GRPC？\n\n\
  正如我们在上一章讨论的那样，你的技术选择在很大程度上应基于你想要的通信风格。决定是使用阻塞同步还是非阻塞异步调用，请求-响应还是事件驱动协作，将有助于你从原本可能很长的技术列表中筛选出合适的选项。\n\
  \n在本章中，我们将现在来看一些用于微服务通信的常见技术。但新的选项总是在出现，所以在讨论具体技术之前，让我们先思考一下我们希望从所选技术中获得什么。\n\n\
  ## 使向后兼容变得容易\n\n在对微服务进行更改时，我们需要确保不会破坏任何消费微服务的兼容性。因此，我们希望确保所选技术能让进行向后兼容的更改变得容易。像添加新字段这样简单的操作不应破坏客户端。我们理想情况下还希望能够验证所做的更改是否向后兼容——并在将微服务部署到生产环境之前获得该反馈的方式。\n\
  \n## 使接口明确\n\n微服务向外部世界公开的接口明确非常重要。这意味着微服务的消费者能够清楚地知道该微服务公开了哪些功能。但这也意味着在微服务上工作的开发者能够清楚地知道哪些功能需要保持完整以供外部方使用——我们希望避免微服务的更改导致兼容性意外破坏的情况。\n\
  \n模式可以在确保微服务公开的接口明确方面发挥很大作用。我们可以考虑的一些技术需要使用模式，而另一些则使用模式是可选的。无论如何，我强烈建议使用模式，以及足够的支持文档，以明确消费者可以期望微服务提供的功能。\n\
  \n## 保持 API 技术无关\n\n\n\n如果你在 IT 行业待了超过 15 分钟，你就不需要我告诉你我们工作在一个变化迅速的领域。唯一确定的 *是* 变化。新的工具、框架和语言不断涌现，实现了可以帮助我们更快、更有效地工作的新想法。现在，你可能是一家\
  \ `.NET` 店。但一年后，或五年后呢？如果想尝试可能让你更高效的替代技术栈怎么办？\n\n我非常喜欢保持选择开放，这也是我如此推崇微服务的原因。我也认为确保微服务之间通信所使用的\
  \ API 保持技术无关非常重要。这意味着要避免规定我们可以用哪些技术栈来实现微服务的集成技术。\n\n## 让服务对消费者更简单\n\n我们希望让消费者轻松使用我们的微服务。如果作为消费者的使用成本高得离谱，那么拥有一个结构优美的微服务也没什么意义！所以让我们思考一下是什么让消费者能够轻松使用我们美妙的新服务。理想情况下，我们希望客户端在技术选择上拥有完全自由，但另一方面，提供客户端库可以简化采用。然而，这样的库往往与我们想要实现的其他目标不兼容。例如，我们可能会使用客户端库来让消费者更方便，但这可能会以增加耦合为代价。\n\
  \n## 隐藏内部实现细节\n\n我们不希望消费者受制于我们的内部实现。这会导致耦合增加。这意味着如果我们想在微服务内部更改某些东西，就可能破坏消费者，因为需要他们也进行更改。这增加了变更成本——而这正是我们试图避免的。它还意味着我们不太可能想要做出更改，因为担心需要升级消费者，这可能导致服务内部技术债务增加。因此，任何推动我们暴露内部表示细节的技术都应避免。\n\
  \n我们可以考察的技术种类繁多，但与其广泛查看这个领域的长长选项列表，我将重点介绍一些最受欢迎和有趣的选择。我们将考察的选项如下：\n\n远程过程调用 (`RPC`)\n\
  \n允许在远程进程上调用本地方法调用的框架。常见选项包括 `SOAP` 和 `GRPC`。\n\n`REST`\n\n一种架构风格，其中你公开资源（`Customer`、`Order`\
  \ 等），这些资源可使用一组通用动词（`GET`、`POST`）访问。`REST` 不止于此，但我们稍后会讲到。\n\n`GraphQL`\n\n一种相对较新的协议，允许消费者定义自定义查询，从多个下游微服务获取信息，并过滤结果仅返回所需内容。\n\
  \n消息代理\n\n允许通过队列或主题进行异步通信的中间件。\n\n待办：展示此技术与我们之前概述的风格的对比？\n\n## 远程过程调用\n\n*远程过程调用*\
  \ 指的是进行本地调用并使其在某处远程服务上执行的技术。市面上有多种不同类型的 `RPC` 技术。大多数该领域的技术需要显式模式，例如 `SOAP` 或 `GRPC`。使用单独的模式使得为不同技术栈生成客户端和服务器存根变得更容易，因此例如，我可以有一个公开\
  \ `SOAP` 接口的 `Java` 服务器，以及从接口的 Web 服务定义语言（`WSDL`）定义生成的 `.NET` 客户端。其他技术，如 `Java RMI`，要求客户端和服务器之间更紧密的耦合，要求两者使用相同的底层技术，但避免了共享接口定义的需求。然而，所有这些技术都有相同的核心特征，即让远程调用看起来像本地调用。\n\
  \n通常，使用 `RPC` 技术意味着你采用了一种序列化协议。`RPC` 框架定义了数据的序列化和反序列化方式。例如 `GRPC` 使用 `protocol buffer`\
  \ 序列化格式来实现此目的。某些实现绑定到特定的网络协议（如 `SOAP`，它名义上使用 `HTTP`），而其他实现可能允许你使用不同类型的网络协议，这些协议本身可以提供额外功能。例如，`TCP`\
  \ 提供交付保证，而 `UDP` 不提供但开销更低。这可以让你为不同的用例使用不同的网络技术。\n\n具有显式模式的 `RPC` 框架使得生成客户端代码变得非常容易。这可以避免对客户端库的需求，因为任何客户端都可以根据此服务规范自行生成代码。然而，要使客户端代码生成工作，客户端需要某种方式在带外获取模式——换句话说，消费者需要在计划调用之前访问模式。`AVRO\
  \ RPC` 在这里是一个有趣的例外，因为它可以选择将完整模式与负载一起发送，从而允许客户端动态解释模式。\n\n客户端代码生成的便捷性是 `RPC` 的主要卖点之一：其易用性。我只需进行一次普通的\
  \ 方法调用并理论上忽略其余部分这一事实是巨大的优势。\n\n### 挑战\n\n正如我们所见，`RPC` 提供了一些很好的优势，但它并非没有缺点——而且某些\
  \ `RPC` 实现可能比其他实现更成问题。许多这些问题可以得到解决，但值得进一步探讨。\n\n#### 技术耦合\n\n一些 `RPC` 机制，如 `Java\
  \ RMI`，与特定平台紧密绑定，这可能限制客户端和服务器可使用的技术。`Thrift` 和 `protocol buffers` 对替代语言有令人印象深刻的支持，这可以在一定程度上减少这一缺点，但请注意，有时\
  \ `RPC` 技术会带来互操作性限制。\n\n在某种程度上，这种技术耦合可以是一种暴露内部技术实现细节的形式。例如，使用 `RMI` 不仅将客户端绑定到 `JVM`，服务器也是如此。\n\
  \n公平地说，有一些 `RPC` 实现没有此限制——`GRPC`、`SOAP` 和 `Thrift` 都是允许不同技术栈之间互操作性的例子。\n\n#### 本地调用不等于远程调用\n\
  \n`RPC` 的核心思想是隐藏远程调用的复杂性。但这可能导致隐藏过多。某些形式的 `RPC` 试图让远程方法调用看起来像本地方法调用，这掩盖了这两者非常不同的事实。我可以进行大量本地、进程内调用而无需过度担心性能。然而，使用\
  \ `RPC` 时，编组和解组负载的成本可能很显著，更不用说在网络上传输所需的时间。这意味着你需要以不同方式思考远程接口与本地接口的 API 设计。只是拿一个本地\
  \ API 试图使其成为服务边界而没有进一步思考，很可能会惹上麻烦。在最糟糕的例子中，如果抽象过于不透明，开发人员可能在不知情的情况下使用远程调用。\n\n\n\
  \n你需要考虑网络本身。众所周知，分布式计算谬误之首是[“网络是可靠的”](http://bit.ly/1LbdCzY)。网络不可靠。即使你的客户端和你正在通信的服务器都正常，它们也可能而且会失败。它们可能快速失败，也可能缓慢失败，甚至可能损坏你的数据包。你应该假设你的网络充斥着随时可能发泄怒火的恶意实体。因此，你可以预期的故障模式是不同的。故障可能是由远程服务器返回错误引起的，也可能是你调用不当造成的。你能区分这两者吗？如果能，你能做些什么？当远程服务器开始缓慢响应时，你又该怎么办？我们将在讨论弹性时在\\\
  [链接待定\\]中涵盖这个话题。\n\n### 脆弱性\n\n一些最流行的 RPC 实现会导致一些糟糕的脆弱性形式，Java 的 RMI 就是一个很好的例子。让我们考虑一个非常简单的\
  \ Java 接口，我们决定将其作为客户服务的远程 API。示例 4-1 声明了我们将远程公开的方法。Java RMI 然后为我们的方法生成客户端和服务器存根。\n\
  \n#### 示例 4-1. 使用 Java RMI 定义服务端点\n\n```\nimport java.rmi.Remote;\nimport java.rmi.RemoteException;\n\
  \npublic interface CustomerRemote extends Remote {\n  public Customer findCustomer(String\
  \ id) throws RemoteException;\n\n  public Customer createCustomer(String firstname,\
  \ String surname, String emailAddress)\n      throws RemoteException;\n}\n```\n\n\
  在此接口中，`createCustomer` 接受名字、姓氏和电子邮件地址。如果我们决定允许 `Customer` 对象仅使用电子邮件地址创建会怎样？我们可以在此时相当容易地添加一个新方法，如下所示：\n\
  \n```\n...\npublic Customer createCustomer(String emailAddress) throws RemoteException;\n\
  ...\n```\n\n问题是现在我们也需要重新生成客户端存根。想要使用新方法的客户端需要新的存根，并且根据规范更改的性质，即使不需要新方法的消费者也可能需要升级他们的存根。当然，这在一定程度上是可以管理的。现实是，像这样的更改相当常见。RPC\
  \ 端点通常最终会有大量的方法，用于以不同的方式创建或与对象交互。这部分是由于我们仍然将这些远程调用视为本地调用。\n\n不过还有另一种脆弱性。让我们看看我们的\
  \ `Customer` 对象是什么样的：\n\n```\npublic class Customer implements Serializable {\n\
  \  private String firstName;\n  private String surname;\n  private String emailAddress;\n\
  \  private String age;\n}\n```\n\n现在，如果事实证明，尽管我们在 `Customer` 对象中公开了 `age` 字段，但我们的消费者从未使用它会怎样？我们决定要删除这个字段。但是如果服务器实现从该类型的定义中删除了\
  \ `age`，而我们没有对所有消费者做同样的操作，那么即使他们从未使用过该字段，消费者端反序列化 `Customer` 对象的相关代码也会中断。要推出此更改，我必须同时部署新的服务器和客户端。这对于任何推广使用二进制存根生成的\
  \ RPC 机制来说都是一个关键挑战：你无法将客户端和服务器部署分开。如果你使用这项技术，同步发布可能会成为你的未来。\n\n如果我想重构 `Customer`\
  \ 对象，即使没有删除字段，也会出现类似问题——例如，如果我想将 `firstName` 和 `surname` 封装到新的 `naming` 类型中以便于管理。当然，我可以通过将字典类型作为调用的参数传递来解决这个问题，但那样的话，我会失去生成的存根的许多好处，因为我仍然需要手动匹配和提取我想要的字段。\n\
  \n实际上，作为有线二进制序列化一部分使用的对象可以被视为 `expand-only` 类型。这种脆弱性导致类型通过线路暴露并成为大量字段的集合，其中一些字段不再使用但无法安全删除。\n\
  \n### 何时使用\n\n尽管存在缺点，我实际上非常喜欢 RPC，而更现代的实现，例如 GRPC，[content]\n你需要考虑网络本身。众所周知，分布式计算谬误之首是[“网络是可靠的”](http://bit.ly/1LbdCzY)。网络不可靠。即使你的客户端和你正在通信的服务器都正常，它们也可能而且会失败。它们可能快速失败，也可能缓慢失败，甚至可能损坏你的数据包。你应该假设你的网络充斥着随时可能发泄怒火的恶意实体。因此，你可以预期的故障模式是不同的。故障可能是由远程服务器返回错误引起的，也可能是你调用不当造成的。你能区分这两者吗？如果能，你能做些什么？当远程服务器开始缓慢响应时，你又该怎么办？我们将在讨论弹性时在\\\
  [链接待定\\]中涵盖这个话题。\n\n### 脆弱性\n\n一些最流行的 RPC 实现会导致一些糟糕的脆弱性形式，Java 的 RMI 就是一个很好的例子。让我们考虑一个非常简单的\
  \ Java 接口，我们决定将其作为客户服务的远程 API。示例 4-1 声明了我们将远程公开的方法。Java RMI 然后为我们的方法生成客户端和服务器存根。\n\
  \n#### 示例 4-1. 使用 Java RMI 定义服务端点\n\n```\nimport java.rmi.Remote;\nimport java.rmi.RemoteException;\n\
  \npublic interface CustomerRemote extends Remote {\n  public Customer findCustomer(String\
  \ id) throws RemoteException;\n\n  public Customer createCustomer(String firstname,\
  \ String surname, String emailAddress)\n      throws RemoteException;\n}\n```\n\n\
  在此接口中，`createCustomer` 接受名字、姓氏和电子邮件地址。如果我们决定允许 `Customer` 对象仅使用电子邮件地址创建会怎样？我们可以在此时相当容易地添加一个新方法，如下所示：\n\
  \n```\n...\npublic Customer createCustomer(String emailAddress) throws RemoteException;\n\
  ...\n```\n\n问题是现在我们也需要重新生成客户端存根。想要使用新方法的客户端需要新的存根，并且根据规范更改的性质，即使不需要新方法的消费者也可能需要升级他们的存根。当然，这在一定程度上是可以管理的。现实是，像这样的更改相当常见。RPC\
  \ 端点通常最终会有大量的方法，用于以不同的方式创建或与对象交互。这部分是由于我们仍然将这些远程调用视为本地调用。\n\n不过还有另一种脆弱性。让我们看看我们的\
  \ `Customer` 对象是什么样的：\n\n```\npublic class Customer implements Serializable {\n\
  \  private String firstName;\n  private String surname;\n  private String emailAddress;\n\
  \  private String age;\n}\n```\n\n现在，如果事实证明，尽管我们在 `Customer` 对象中公开了 `age` 字段，但我们的消费者从未使用它会怎样？我们决定要删除这个字段。但是如果服务器实现从该类型的定义中删除了\
  \ `age`，而我们没有对所有消费者做同样的操作，那么即使他们从未使用过该字段，消费者端反序列化 `Customer` 对象的相关代码也会中断。要推出此更改，我必须同时部署新的服务器和客户端。这对于任何推广使用二进制存根生成的\
  \ RPC 机制来说都是一个关键挑战：你无法将客户端和服务器部署分开。如果你使用这项技术，同步发布可能会成为你的未来。\n\n如果我想重构 `Customer`\
  \ 对象，即使没有删除字段，也会出现类似问题——例如，如果我想将 `firstName` 和 `surname` 封装到新的 `naming` 类型中以便于管理。当然，我可以通过将字典类型作为调用的参数传递来解决这个问题，但那样的话，我会失去生成的存根的许多好处，因为我仍然需要手动匹配和提取我想要的字段。\n\
  \n实际上，作为有线二进制序列化一部分使用的对象可以被视为 `expand-only` 类型。这种脆弱性导致类型通过线路暴露并成为大量字段的集合，其中一些字段不再使用但无法安全删除。\n\
  \n### 何时使用\n\n尽管存在缺点，我实际上非常喜欢 RPC，而更现代的实现，例如 GRPC，优秀，而其他实现存在重大问题，会让我敬而远之。例如 Java\
  \ RMI 在脆弱性和技术选择有限方面存在诸多问题，而 SOAP 从开发人员角度来看相当笨重，尤其与更现代的选择相比。\n\n如果你打算选择这种模型，请注意与\
  \ RPC 相关的一些潜在陷阱。不要将远程调用抽象到网络完全被隐藏的程度，并确保可以在不要求客户端进行同步升级的情况下演进服务器接口。例如，找到客户端代码的正确平衡很重要。确保你的客户端不会对即将进行网络调用一无所知。客户端库在\
  \ RPC 的上下文中经常被使用，如果结构不当可能会有问题。我们稍后会更详细地讨论它们。\n\n如果我在该领域寻找选项，GRPC 将是我的首选清单之首。利用 HTTP/2\
  \ 构建，它具有令人印象深刻的性能特征和良好的通用易用性。我也欣赏 GRPC 周围的生态系统，包括像 Protolock^(1) 这样的工具，我们将在本章讨论模式时稍后讨论。\n\
  \nGRPC 很好地适合同步请求-响应模型，但也可以与响应式扩展结合使用。每当我在对客户端和服务器端都有相当控制权的情况下，我都会将其列为首选。如果你必须支持各种可能需要与你的微服务通信的其他应用程序，客户端代码需要根据服务器端模式编译可能会有问题。在这种情况下，采用某种形式的\
  \ REST over HTTP API 可能更合适。\n\n## REST\n\nRepresentational State Transfer（REST）是一种受\
  \ Web 启发的架构风格。REST 风格背后有许多原则和约束，但我们将重点关注那些在微服务世界中面对集成挑战时真正帮助我们，以及在为服务接口寻找 RPC 的替代风格时真正帮助我们的原则。\n\
  \n在思考 REST 时，最重要的是资源的概念。你可以将资源视为服务本身所了解的事物，比如 `Customer`。服务器根据请求创建该 `Customer` 的不同表示。资源在外部的显示方式与其在内部的存储方式完全解耦。例如，客户端可能会请求\
  \ `Customer` 的 JSON 表示，即使它以完全不同的格式存储。一旦客户端拥有了该 `Customer` 的表示，它就可以提出更改请求的请求，而服务器可能会或可能不会遵守它们。\n\
  \nREST 有许多不同的风格，我在这里只简要涉及。我强烈建议你查看 [Richardson 成熟度模型](http://bit.ly/1fh2AGt)，其中比较了\
  \ REST 的不同风格。\n\nREST 本身并不真正谈论底层协议，尽管它最常用在 HTTP 上。我以前见过使用非常不同的协议实现 REST，例如串行或 USB，尽管这可能需要大量工作。HTTP\
  \ 作为规范的一部分提供的一些功能，例如动词，使得在 HTTP 上实现 REST 更容易，而对于其他协议，你将不得不自己处理这些功能。\n\n### REST\
  \ 与 HTTP\n\n\n\nHTTP 本身定义了一些有用的功能，与 REST 风格配合得非常好。例如，HTTP 动词（例如 `GET`、`POST` 和 `PUT`）在\
  \ HTTP 规范中已有明确的含义，说明它们应如何与资源协同工作。REST 架构风格实际上告诉我们，方法应在所有资源上以相同的方式表现，而 HTTP 规范恰好定义了一组我们可以使用的\
  \ 方法。`GET` 以幂等的方式检索资源，而 `POST` 创建新资源。这意味着我们可以避免许多不同的 `createCustomer` 或 `editCustomer`\
  \ 方法。相反，我们只需 `POST` 一个客户表示以请求服务器创建新资源，并发起 `GET` 请求来检索资源的表示。从概念上讲，在这些情况下只有一个以 `Customer`\
  \ 资源形式存在的 *endpoint*，而我们可以对其执行的操作已内置于 HTTP 协议中。\n\nHTTP 还带来了一个庞大的支持工具和技术生态系统。我们可以使用像\
  \ Varnish 这样的 HTTP 缓存代理和像 `mod_proxy` 这样的负载均衡器，许多监控工具开箱即对 HTTP 有大量支持。这些构建块使我们能够处理大量\
  \ HTTP 流量并以相当透明的方式智能路由。我们还可以使用 HTTP 的所有可用安全控制来保护通信。从基本认证到客户端证书，HTTP 生态系统为我们提供了许多工具来简化安全流程，我们将在\
  \ \\[待定链接\\] 中更深入地探讨该主题。话虽如此，要获得这些好处，你必须很好地使用 HTTP。使用不当，它可能和任何其他技术一样不安全且难以扩展。但如果使用得当，你会得到很多帮助。\n\
  \n请注意 HTTP 也可以用于实现 RPC。`SOAP` 例如通过 HTTP 路由，但不幸的是几乎没有使用规范。动词被忽略，诸如 HTTP 错误代码之类的简单事物也被忽略。`GRPC`\
  \ 另一方面被设计为利用 `HTTP/2` 的功能，例如能够在单个连接上发送多个请求-响应流。\n\n## 超媒体作为应用状态的引擎\n\nREST 中引入的另一个原则可以帮助我们避免客户端和服务器之间的耦合，是\
  \ *hypermedia as the engine of application state* 的概念（通常缩写为 `HATEOAS`，而且确实需要一个缩写）。这是一个相当晦涩的表述和一个相当有趣的概念，所以让我们稍微拆解一下。\n\
  \n超媒体是一个概念，即一段内容包含指向各种格式（例如文本、图像、声音）的其他内容的链接。这应该很熟悉，因为这就是普通网页所做的：你会跟随链接，这些链接是一种超媒体控件，以查看相关内容。`HATEOAS`\
  \ 背后的想法是客户端应通过这些指向其他资源的链接与服务器进行交互（可能导致状态转换）。它不需要通过知道要访问哪个 URI 来知道客户在服务器上的确切位置；相反，客户端会查找并导航链接以找到所需内容。\n\
  \n这是一个有点奇怪的概念，所以让我们先退一步，考虑人们如何与网页交互，我们已经确定网页富含超媒体控件。\n\n想想 Amazon.com 购物网站。购物车的位置随时间发生了变化。图形发生了变化。链接发生了变化。但作为人类，我们足够聪明，仍然能看到购物车，知道它是什么，并与之交互。我们对购物车的含义有理解，即使表示它的确切形式和底层控件已经改变。我们知道如果想查看购物车，这就是我们想要交互的控件。这就是网页能够随时间逐步变化的方式。只要客户与网站之间的这些隐式契约仍然得到满足，变更就不需要是破坏性变更。\n\
  \n使用超媒体控件，我们试图为我们的电子消费者实现同样的 *smarts* 水平。让我们看看我们可能为 MusicCorp 拥有的一个超媒体控件。我们在 示例\
  \ 4-2 中访问了一个代表特定专辑目录条目的资源。除了专辑信息外，我们还看到一些超媒体控件。\n\n### 示例 4-2. 用于专辑列表的超媒体控件\n\n\
  ```\n<album>\n  <name>Give Blood</name>\n  <link rel=\"/artist\" href=\"/artist/theBrakes\"\
  \ /> \n  <description>\n    Awesome, short, brutish, funny and loud. Must buy!\n\
  \  </description>\n  <link rel=\"/instantpurchase\" href=\"/instantPurchase/1234\"\
  \ /> \n</album>\n```\n\n![1](img/#ch04.xhtml#co_implementing_microservice_communication_CO1-1)\n\
  \n: \n\n此超媒体控件向我们展示了在哪里找到有关艺术家的信息。\n\n![2](img/#ch04.xhtml#co_implementing_microservice_communication_CO1-2)\n\
  \n: \n\n如果我们想购买专辑，我们现在就知道去哪里了。\n\n在此文档中，我们有两个超媒体控件。读取此类文档的客户端需要知道，关系为 `artist` 的控件是获取艺术家信息需要导航到的位置，而\
  \ `instantpurchase` 是用于购买专辑的协议的一部分。客户端必须以与人类需要理解购物网站上购物车是待购买商品所在位置的方式，同样理解 API 的语义。\n\
  \n作为客户端，我不需要知道要访问哪个 URI 方案来 *buy* 专辑，我只需要访问资源，找到购买控件，然后导航到那里。购买控件的位置可能会改变，URI 可能会改变，或者网站甚至可能将我发送到另一个服务，而作为客户端我不会在意。这为我们提供了客户端和服务器之间大量的解耦。\n\
  \n在这里我们从底层细节中得到了极大的抽象。只要客户端仍能找到与协议理解相匹配的控件，我们就可以完全改变控件呈现方式的实现，就像购物车控件可能从简单的链接变为更复杂的\
  \ JavaScript 控件一样。我们也可以自由地向文档添加新控件，也许代表我们可以对相关资源执行的新状态转换。我们只有在从根本上改变了某个控件的语义使其行为大不相同，或者完全删除某个控件时，才会破坏我们的消费者。\n\
  \n理论上，通过使用这些控件来解耦客户端和服务器，我们随着时间的推移获得显著的好处，希望能抵消启动这些协议所需的时间增加。不幸的是，虽然这些想法在理论上看起来都很合理，但我发现这种形式的\
  \ REST 很少被实践，原因我尚未完全弄清楚。这使得 `HATEOS` 特别成为我向已致力于使用 REST 的人推广的一个更难的概念。从根本上讲，REST 中的许多想法都以创建分布式超媒体系统为前提，而这并不是大多数人最终构建的东西。\n\
  \n## 挑战\n\n就易用性而言，历史上你无法像使用 RPC 实现那样为你的基于 HTTP 的 REST 应用协议生成客户端代码。这经常导致人们创建提供客户端库供消费者使用的\
  \ REST API。这些客户端库为你提供了 API 绑定，使客户端集成更简单。问题是客户端库可能导致客户端和服务器之间耦合方面的一些挑战，我们将在 “DRY\
  \ 与微服务世界中代码重用的弊端” 中讨论这个问题。\n\n\n\n## 通过 HTTP 的 REST\n\n近年来，这一问题在某种程度上得到了缓解。源自 `Swagger`\
  \ 文档格式的 `OpenAPI` 规范^(2)，现已能够让你在 `REST` 端点上定义足够的信息，以便在多种语言中生成客户端代码。在我的经验中，即使团队已在使用\
  \ `Swagger` 进行文档，我也很少看到他们实际使用这一功能。我怀疑这可能是由于将其使用改造到现有 API 中的困难所致。我也担心之前仅用于文档的规范现在被用来定义更明确的契约。这可能导致规范变得更加复杂——例如，将\
  \ `OpenAPI` 模式与 `protocol buffer` 模式进行比较，差异相当明显。尽管我有所保留，但这一选项现在存在是件好事。\n\n性能也可能是一个问题。`REST`\
  \ over `HTTP` 的负载实际上可能比 `SOAP` 更紧凑，因为它支持 `JSON` 等替代格式甚至二进制格式，但它仍然远不如 `Thrift` 可能实现的二进制协议那样精简。对于低延迟需求而言，每次请求\
  \ `HTTP` 的开销也可能是一个问题。当前使用的所有主流 `HTTP` 协议在底层都需要使用传输控制协议（`TCP`），与替代网络协议相比存在效率低下的问题，而某些\
  \ `RPC` 实现则允许你使用替代 `TCP` 的网络协议，例如用户数据报协议（`UDP`）。\n\n由于需要使用 `TCP` 而对 `HTTP` 设定的限制正在得到解决。目前正在定稿的\
  \ `HTTP/3` 正在转向使用更新的 `QUIC` 协议。`QUIC` 提供了与 `TCP` 类似的能力（如在 `UDP` 之上的改进保证），但在 `TCP`\
  \ 之上具有一些显著改进，已被证明可提高延迟并减少带宽。很可能 `HTTP/3` 在公共互联网上产生广泛影响前需要数年时间，但可以合理假设组织在其内部网络中可以更早受益。\n\
  \n具体来说，关于 `HATEOS`，你可能会遇到额外的性能问题。由于客户端需要导航多个控件才能找到给定操作的正确端点，这可能导致非常啰嗦的协议——每个操作可能需要多次往返。最终，这是一个权衡。如果你决定采用\
  \ `HATEOS` 风格的 `REST`，我建议你先让客户端导航这些控件，然后在必要时再进行优化。请记住，通过使用 `HTTP`，我们开箱即用获得了大量帮助，正如我们之前讨论的那样。过早优化的弊端早已被充分记录，因此我在这里无需赘述。还请注意，其中许多方法都是为创建分布式超文本系统而开发的，并非全部适用！有时你会发现自己只是想要老式的\
  \ `RPC`。\n\n尽管存在这些缺点，`REST` over `HTTP` 对于服务间交互仍是一个明智的默认选择。如果你想了解更多，我推荐 `REST in\
  \ Practice`（O’Reilly）^(3)，它深入涵盖了 `REST` over `HTTP` 的主题。\n\n### 使用场景\n\n由于其在行业中的广泛使用，如果你希望允许尽可能多的各种客户端访问，基于\
  \ `REST` over `HTTP` 的 API 对于同步请求-响应接口来说是一个显而易见的选择。把 `REST` over `HTTP` 仅仅看作“对大多数事情来说足够好”的选择是错误的，但其中确实有一定道理。这是一种被广泛理解的接口风格，大多数人都熟悉，并且保证了来自各种技术的互操作性。\n\
  \n很大程度上得益于 `HTTP` 的能力，以及 `REST` 在多大程度上建立在这些能力之上（而不是隐藏它们），这些 API 在需要大规模和有效请求缓存的情况下表现出色。正因如此，它们是向外部方或客户端接口公开\
  \ API 的显而易见选择。与更高效的通信协议相比，它们可能会表现不佳，虽然你可以在 `REST` 基于的 API 之上构建异步交互协议，但与通用微服务到微服务通信的替代方案相比，这并不是一个很好的契合。\n\
  \n尽管在智力上欣赏 `HATEOS` 背后的目标，但在我的经验中，我从未见过实现这种 `REST` 风格的额外工作在长期内带来有价值的收益，也回想不起在过去几年里与任何实施微服务架构的团队交谈过他们能谈及使用\
  \ `HATEOS` 的价值。我自己的经验显然只是数据点之一，我不怀疑对某些人来说它可能运作良好。但这个概念似乎并没有像我想象的那样流行起来。可能是 `HATEOS`\
  \ 背后的概念对我们来说太陌生了，也可能是该领域缺乏工具或标准，或者也许该模型根本不适用于我们最终构建的系统类型。\n\n因此，在边界使用时，它工作得非常出色，而对于微服务之间基于同步请求-响应的通信，它也很棒。\n\
  \n## GraphQL\n\n近年来，`GraphQL`^(4) 变得更受欢迎，很大程度上是因为它在某一特定领域表现出色。具体来说，它使客户端设备能够定义查询，从而避免为检索相同信息而发出多次请求。这可以显著提高受限客户端设备的性能，并避免实现定制的服务器端聚合的需求。\n\
  \nTODO：我需要一张图片？\n\n以一个简单例子来说，想象一下移动设备想要显示一个页面，展示客户最新订单的概览。该页面需要包含有关客户的一些信息。以及客户最近\
  \ 5 个订单的信息。屏幕只需要客户记录中的几个字段，并且只需要每个订单的日期、价值和发货状态。移动设备可以向两个下游微服务发出调用以检索所需信息，但这将涉及多次调用，包括拉回实际上不需要的信息。尤其是对于移动设备来说，这可能很浪费——它会消耗比所需更多的移动设备数据套餐，并且可能需要更长时间。\n\
  \n`GraphQL` 允许移动设备发出单个查询来拉回所有所需信息。要实现这一点，你需要一个微服务向客户端设备公开 `GraphQL` 端点。此 `GraphQL`\
  \ 端点是所有客户端查询的入口，并公开客户端设备使用的模式。该模式公开客户端可用的类型，并且还提供了一个不错的图形化查询构建器，使创建这些查询变得更容易。通过减少客户端设备发出的调用次数和检索的数据量，你可以很好地处理在微服务架构中构建用户界面时出现的一些挑战。\n\
  \n### 挑战\n\n起初，一个挑战是 `GraphQL` 规范缺乏语言支持，最初 `JavaScript` 是你唯一的选择。这已得到极大改善，所有主要技术现在都支持该规范。事实上，`GraphQL`\
  \ 及其各种实现在整体上都有显著改进，使其比几年前可能的情况风险小得多。尽管如此，该技术仍存在一些挑战，你可能需要了解。\n\n\n\n## GraphQL\n\
  \n由于客户端设备可以发出动态变化的查询，这可能会导致服务器端负载问题。我听说过一些团队因此遇到问题，`GraphQL` 查询导致服务器端出现显著负载。将 `GraphQL`\
  \ 与类似 `SQL` 的技术相比，我们在那里也有同样的问题。一个昂贵的 `SQL` 语句可能会给数据库带来重大问题，可能对更广泛的系统产生较大影响。同样的问题也适用于\
  \ `GraphQL`。不同之处在于，至少对于 `SQL`，我们有数据库查询规划器等工具，可以帮助我们诊断有问题的查询，而 `GraphQL` 的类似问题则更难追踪。请求的服务器端限流是一个潜在问题，但由于调用的执行可能分布在多个微服务中，这远非简单直接。\n\
  \n与普通的基于 `REST` 的 `HTTP` `APIs` 相比，缓存也更复杂。使用基于 `REST` 的 `API`，我可以设置多个响应头之一，帮助客户端设备或中间缓存（如内容分发网络）缓存响应，以便无需再次请求。这在\
  \ `GraphQL` 中无法以相同的方式实现。我看到的关于此问题的建议似乎围绕着为每个返回的资源关联一个 `ID`（请记住，`GraphQL` 查询可能包含多个资源），然后让客户端设备根据该\
  \ `ID` 缓存请求。据我所知，这使得在没有额外工作或额外工具的情况下使用内容分发网络（`CDNs`）或缓存反向代理变得异常困难。\n\n尽管我见过一些针对此问题的特定实现解决方案（如\
  \ `JavaScript` `Apollo` 实现中发现的），缓存感觉在 `GraphQL` 的初始开发中要么是有意要么是无意地被忽略了。如果你发出的查询在性质上高度特定于某个特定用户，那么这种缺乏请求级缓存当然可能不是致命问题，因为你的缓存命中率可能很低。不过我确实在想，这种限制是否意味着你最终仍会为客户端设备采用混合解决方案，其中一些（更通用的）请求通过普通的基于\
  \ `REST` 的 `HTTP` `APIs`，而其他请求通过 `GraphQL`。\n\n另一个问题是，虽然 `GraphQL` 理论上可以处理写入，但似乎并不像读取那样合适。这确实导致团队使用\
  \ `GraphQL` 进行读取，而使用 `REST` 进行写入的情况。\n\n最后一个问题可能完全是主观的，但我仍然认为值得提出。`GraphQL` 给人一种你只是在处理数据的感觉，这可能会强化这样一种想法：你所通信的微服务实际上只是数据库的包装器。我实际上见过很多人将\
  \ `GraphQL` 与 `OData` 相比较，后者是一种设计用于从数据库访问数据的通用 `API` 技术。正如我们已经详细讨论过的，仅仅将微服务视为数据库包装器的想法可能非常成问题。微服务通过网络接口公开功能。其中一些功能可能需要或导致数据暴露，但它们仍应具有自己的内部逻辑和行为。只是因为你在使用\
  \ `GraphQL`，不要陷入，或一个事件。 而不是一个微服务直接与另一个微服务通信，而是它将一条消息发送给消息代理，并附带有关消息应如何发送的信息。\n\n\
  ### Topics and Queues\n\n代理通常提供队列、主题或两者。队列通常是点对点的。发送者将消息放入队列，消费者从该队列读取。在基于主题的系统中，多个消费者能够订阅主题，每个已订阅的消费者都会收到该消息的副本。\n\
  \n消费者可以代表一个或多个微服务——通常建模为 `consumer group`。当你有多个微服务实例，并且希望其中任何一个都能接收消息时，这很有用。在 图\
  \ 4-1 中，我们看到一个示例，其中 `Order Processor` 有三个部署的实例，都属于同一个 `consumer group`。当消息放入队列时，`consumer\
  \ group` 中的只有一个成员会收到该消息——这意味着队列充当负载分发机制——这是我们在 第 3 章 中简要提及的 `Competing Consumers`\
  \ 模式的一个例子。\n\n![](img/queues.png)\n\n使用主题时，你可以拥有多个 `consumer groups`。在 图 4-2 中，表示订单已付款的事件被放到\
  \ `Order Status` 主题上。该事件的副本被 `Warehouse` 微服务和 `Notifications` 微服务接收，两者都位于单独的 `consumer\
  \ groups` 中。每个 `consumer group` 只有一个实例会看到该事件。\n\n![](img/topics.png)\n\n初看之下，队列看起来就像只有一个\
  \ `consumer group` 的主题。两者之间区别的很大一部分在于，通过队列发送消息时，会知道消息发送给谁。对于主题而言，此信息对消息发送者是隐藏的——他们不知道谁（如果有的话）最终会收到消息。\n\
  \n主题非常适合基于事件的协作，而队列更适合请求/响应通信。这应被视为一般指导而非严格规则。\n\n### Guaranteed Delivery\n\n那么为什么使用代理呢？从根本上说，它们提供了一些对异步通信非常有用的功能。它们提供的属性各不相同，但最有趣的功能是保证交付，这是所有广泛使用的代理以某种方式支持的功能。保证交付描述了代理确保消息被交付的承诺。\n\
  \n\n\n## 消息代理基础\n\n从发送消息的微服务的角度来看，这非常有用。如果下游目标不可用，这就不是问题——代理会保留消息直到能够投递。这可以减少上游微服务需要担心的事情。与同步直接调用相比，例如\
  \ `HTTP` 请求，如果下游目标无法到达，上游微服务需要决定如何处理请求——是否重试调用，还是放弃？\n\n要实现保证投递，代理需要确保尚未投递的任何消息都会以持久的方式保存，直到能够投递为止。为了兑现这一承诺，代理通常会作为某种集群系统运行，确保单台机器的丢失不会导致消息丢失。正确运行代理通常涉及很多工作，部分原因是管理集群软件的挑战。经常情况下，如果代理未正确设置，保证投递的承诺会被削弱。例如，`RabbitMQ`\
  \ 要求集群中的实例通过相对低延迟的网络通信，否则实例可能会对正在处理的当前消息状态产生混淆，导致数据丢失。我并不是强调这一特定限制来说明 `RabbitMQ`\
  \ 有任何不好，所有代理在运行方式上都有限制，以兑现保证投递的承诺。如果你计划自行运行代理，请务必仔细阅读文档。\n\n也值得注意的是，特定代理对保证投递的含义可能有所不同。再次强调，阅读文档是一个很好的起点。\n\
  \n## 信任\n\n代理的一大吸引力是保证投递的属性。但要实现这一点，你不仅需要信任创建代理的人，还需要信任代理的运行方式。如果你构建的系统基于投递有保证的假设，而由于底层代理的问题事实并非如此，这可能会导致严重问题。当然希望的是，你将这项工作外包给了由能比你做得更好的人创建的软件。最终，你必须决定你愿意多大程度上信任你所使用的代理。\n\
  \n## 其他特性\n\n除了保证投递之外，代理还可以提供其他你可能觉得有用的特性。\n\n大多数代理可以保证消息投递的顺序，但这并非普遍适用，即使如此，这一保证的范围也可能有限。例如在\
  \ `Kafka` 中，排序仅在单个 `partition` 内得到保证。如果你无法确定消息会按顺序接收，你的消费者可能需要对此进行补偿，也许可以通过延迟处理乱序接收的消息，直到缺失的消息到达为止。\n\
  \n一些代理在写入时提供事务——例如 `Kafka` 允许你在单个事务中写入多个 `topics`。一些代理还可以提供读取事务性，这是在通过 Java 消息服务（`JMS`）API\
  \ 使用多个代理时我曾使用过的功能。这在你希望确保消息被消费者处理后再从代理中移除时很有用。\n\n一些代理承诺的另一个、颇具争议的功能是精确一次投递。提供保证投递的一种较简单的方式是允许消息被重新发送。这可能导致消费者多次看到同一条消息（即使这种情况很少见）。大多数代理会尽力减少这种情况发生的可能性，或将其对消费者隐藏，但一些代理更进一步，保证精确一次投递。这是一个复杂的话题，因为我曾与一些专家交谈，他们表示在所有情况下保证这一点是不可能的，而其他专家则说你基本上可以用一些简单的变通方法做到这一点。无论如何，如果你选择的代理声称实现了这一点，那么请对其实实现方式给予\
  \ **really** 小心的关注。更好的做法是构建你的消费者，使其做好可能多次接收同一条消息的准备，并能处理这种情况。一个非常简单的例子是让每条消息都有一个\
  \ `ID`，消费者在接收消息时可以检查它。如果已处理过具有该 `ID` 的消息，则可以忽略该消息。\n\n## 选择\n\n存在各种消息代理。流行示例包括 `RabbitMQ`、`ActiveMQ`\
  \ 和 `Kafka`（我们稍后会进一步探讨）。主要公共云厂商也提供各种产品来扮演这一角色，从你可以在自己的基础设施上安装的托管版本，到特定于某个平台的定制实现。例如\
  \ AWS 拥有 Simple Queue Service（`SQS`）、Simple Notification Service（`SNS`）和 `Kinesis`，它们都提供不同类型的完全托管代理。事实上\
  \ `SQS` 是 AWS 发布的首个产品，于 2006 年推出。\n\n## Kafka\n\n`Kafka` is worth highlighting as\
  \ a specific broker, due in large part to its popularity in recent years. Part of\
  \ this popularity is due to its use in helping moving large volumes of data around\
  \ as part of implementing stream processing pipelines. This can help move from batch-oriented\
  \ processing to more real-time processing.\n\n由于近年来其流行度，`Kafka` 作为特定代理值得重点介绍。其流行的一部分原因是它在实现流处理管道时帮助移动大量数据。这可以帮助从批处理转向更实时的处理。\n\
  \n`kafka` 有几个值得强调的特性。首先，它是为超大规模设计的——它在 LinkedIn 构建时用于用单一平台取代多个现有消息集群。`Kafka` 构建时允许多个消费者和生产者——我曾与一家大型科技公司的专家交谈过，该公司在同一集群上有超过\
  \ 50K 个生产者和消费者在工作。公平地说，很少有组织会在这种规模上遇到问题，但对于某些组织而言，能够轻松（相对而言）扩展 `kafka` 的能力非常有用。\n\
  \n`kafka` 的另一个相当独特的功能是消息持久性。对于普通消息代理，一旦最后一个消费者接收到消息，代理就不再需要保留该消息。而在 `Kafka` 中，消息可以存储一段可配置的时间。这意味着消息可以永久存储。这可以让消费者重新摄取已处理过的消息，或让新部署的消费者处理之前发送的消息。\n\
  \n最后，`Kafka` 正在推出内置的流处理支持。与其使用 `Kafka` 将消息发送到 `Apache Flink` 等专用流处理工具，不如在 `Kafka`\
  \ 本身内部完成一些任务。使用 `KSQL`，你可以定义类似 SQL 的语句，即时处理一个或多个 `topics`。这可以提供类似动态更新的物化数据库视图的东西，其数据源是\
  \ `Kafka` 主题而不是数据库。这些功能为分布式系统中数据的管理方式打开了一些非常有趣的可能性。如果你想更详细地探索这些想法，我可以推荐“Designing\
  \ Event-Driven Systems” by Ben Stopford^(5)（我必须推荐 Ben 的书，因为我为它写了前言！）。对于对 `Kafka`\
  \ 的更深入了解，我建议“Kafka: The Definitive Guide”^(6)。\n\n### TODO: 挑战\n\n### TODO: 何时使用它\n\
  \n## 序列化格式\n\n\n\n我们之前考察的一些技术选型——具体来说是一些 RPC 实现——会在数据序列化和反序列化方面为你做出选择。例如选择 GRPC\
  \ 时，发送的任何数据都会被转换为 protocol buffer 格式。然而，许多技术选项在网络调用的数据转换方式上给了我们很大的自由度。选择 Kafka 作为你的消息代理，你就可以以多种格式发送消息。那么应该选择哪种格式呢？\n\
  \n## 文本格式\n\n使用标准文本格式可以让客户端在消费资源时拥有很大的灵活性。REST API 通常主要使用文本格式作为请求和响应体，即使理论上你完全可以愉快地通过\
  \ HTTP 发送二进制数据。事实上，这就是 GRPC 的工作方式——底层使用 HTTP，但发送的是二进制 protocol buffers。\n\nJSON\
  \ 已取代 XML 成为首选的文本序列化格式。你可以列出许多导致这种情况的原因，但主要原因是 API 的主要消费者之一通常是浏览器，而 JSON 在浏览器中非常契合。JSON\
  \ 变得流行部分是由于对 XML 的反弹，部分原因是支持者认为与 XML 相比，它相对更紧凑、更简单。现实是，JSON 与 XML 负载的大小差异很少非常巨大，尤其是这些负载通常会被压缩。还值得指出的是，JSON\
  \ 的部分简洁性是有代价的——在我们急于采用更简单协议的过程中，模式被抛到了一边（稍后会详细介绍）。\n\nAVRO 是一种有趣的序列化格式。它以 JSON 作为底层结构，并用它来定义基于模式的格式。AVRO\
  \ 在消息负载格式中获得了很大流行，部分原因是能够将模式作为负载的一部分发送，这可以使支持多种不同的消息格式变得容易得多。\n\n不过就个人而言，我仍然是 XML\
  \ 的粉丝。某些工具支持更好。例如，如果我想仅提取负载的某些部分（我们将在 “微服务之间的变更处理” 中更详细地讨论这一技术），我可以使用 XPATH，这是一个广为人知的标准，拥有大量工具支持，甚至可以使用\
  \ CSS 选择器，许多人觉得这样更简单。对于 JSON，我有 JSONPATH，但这并没有得到广泛支持。我觉得很奇怪，人们因为 JSON 轻量而选择它，然后又试图将像超媒体控制这样的概念强加进去，而这些概念在\
  \ XML 中早已存在。我承认，不过，我可能在这里属于少数派，而 JSON 是大多数人的首选格式！\n\n## 二进制格式\n\n文本格式的优点在于便于人类阅读，并提供与不同工具和技术的大量互操作性，而二进制序列化协议的世界则是当你开始担心负载大小或读写负载的效率时应该去的地方。Protocol\
  \ buffers 已经存在一段时间了，并且经常在 GRPC 范围之外使用——它们可能代表了微服务通信中最流行的二进制序列化格式。\n\n不过这个领域很大，还有许多其他格式是在各种需求的考虑下开发的。Simple\
  \ Binary Encoding^(7)、Cap’n Proto^(8) 和 FlatBuffers^(9) 都值得一提。虽然每个格式都有大量基准测试，突出它们相对于\
  \ protocol buffers、JSON 或其他格式的相关优势，但基准测试存在一个根本问题，即它们不一定代表你将如何使用它们。如果你想从序列化格式中挤出最后几个字节，或将读写这些负载所需的时间削减到微秒级，我强烈建议你自行比较这些各种格式。在我的经验中，绝大多数系统很少需要担心此类优化，因为它们通常可以通过发送更少的数据或根本不进行调用来实现所需的改进。不过，如果你正在构建超低延迟的分布式系统，请确保你准备好一头扎进二进制序列化格式的世界。\n\
  \n## 模式\n\n反复出现的一个讨论是，我们是否应该使用模式来定义我们的端点公开的内容以及它们接受的内容？模式可以有许多不同的类型，通常选择序列化格式会决定你可以使用哪种模式技术。如果你使用的是原始\
  \ XML，你会使用 XML Schema Definition（XSD），原始 json，你会使用 JSON-Schema。我们之前提到的一些技术选型（具体来说是相当一部分\
  \ RPC 选项）需要使用显式模式，因此如果你选择了这些技术，你就必须使用模式。SOAP 通过使用名为 Web Service Definition Language（WSDL）的模式规范工作，而\
  \ GRPC 需要使用 protocol buffer 规范。我们探索的其他技术选型使模式的使用成为可选的，这就是事情变得更有趣的地方。\n\n就我个人而言，我支持为微服务端点拥有显式模式。这有两个关键原因。首先，它在很大程度上是对微服务端点公开的内容以及它可以接受的内容的明确表示。这让微服务开发者以及他们的使用者都更容易。模式可能无法取代良好的文档需求，但它们确实可以帮助减少所需的文档量。\n\
  \n我喜欢显式模式的另一个原因在于它们有助于捕获微服务端点的意外破坏。我们稍后会探讨如何处理微服务之间的变更，但在那之前，先探讨不同类型的破坏以及模式可以发挥的作用是值得的。\n\
  \n### 结构性与语义性契约破坏\n\n总体而言，我们可以将契约破坏分为两类——*structural* 破坏和 *semantic* 破坏。结构性破坏指的是端点的结构发生改变，导致消费者不再兼容的情况——这可能表示字段或方法被移除，或新增了必需字段。语义性破坏指的是微服务端点的结构保持不变，但行为发生了变化，从而破坏了消费者的期望。\n\
  \n让我们举一个简单的例子。你有一个高度复杂的 `Hard Calculations` 微服务，它在端点上公开了一个 `calculate` 方法。这个 `calculate`\
  \ 方法接受两个整数，两者都是必需字段。如果你修改 `Hard Calculations` 使 `calculate` 方法现在只接受一个整数，那么消费者就会中断——他们会发送包含两个整数的请求，而\
  \ `Hard Calculations` 微服务会拒绝这些请求。这是一个结构性变更的例子，通常这类变更更容易被发现。\n\n语义变更更成问题。这是指端点的结构没有改变，但端点的行为发生了改变。回到我们的\
  \ `calculate` 方法，假设在第一个版本中，提供的两个整数被相加并返回结果。到目前为止一切正常。现在，我们修改 `Hard Calculations`\
  \ 使 `calculate` 方法现在将整数相乘并返回结果。`calculate` 方法的语义发生了变化，可能破坏消费者的期望。\n\n### 是否应该使用模式？\n\
  \n\n\n通过使用模式并比较不同版本的模式，我们可以捕获结构性破坏。捕获语义性破坏需要使用测试。如果您没有模式，或者有模式但决定不比较模式更改以确保兼容性，那么在进入生产环境之前捕获结构性破坏的负担也落在测试上。可以说，这种情况在某种程度上类似于编程语言中的静态与动态类型。与静态类型语言相比，类型在编译时固定——如果您的代码对类型的实例执行不允许的操作（例如调用不存在的方法），则编译器可以捕获该错误。这可以让您将测试工作重点放在其他类型的问题上。然而，对于动态类型语言，您的一些测试需要捕获静态类型语言中编译器会发现的错误。\n\
  \n现在，我对静态与动态类型语言都比较宽松，我发现自己在两者中都非常高效（相对而言）。当然，动态类型语言为您提供了一些显著的优势，这对许多人来说足以证明放弃编译时安全性的合理性。然而就个人而言，如果我们把讨论拉回到微服务交互上，我并没有发现模式与无模式通信之间存在类似的平衡权衡。简单来说，我认为拥有显式模式所带来的好处远远超过了基于无模式通信所带来的任何感知收益。\n\
  \n无模式端点的主要论点似乎是模式需要更多工作且价值不足。我认为这在很大程度上是想象力的失败，部分是良好工具的失败，这些工具本可以帮助模式在用于捕获结构性破坏时发挥更大价值。\n\
  \n实际上，问题并不是你是否有模式——而是该模式是否*显式*。如果你正在从无模式 API 消费数据，你仍然对其中应该包含什么数据以及数据应如何结构化有期望。处理数据的代码将带着对数据结构如何的假设集来编写。在这种情况下，模式可以说完全是隐式的，而非显式^(10)。我对显式模式的许多渴望源于我认为尽可能明确微服务所做（或不做）的暴露是很重要的。\n\
  \n最终，模式提供的许多内容是对客户端与服务器之间结构契约的一部分的显式表示。它们有助于使事情明确化，并且可以极大地帮助团队之间的沟通，同时也作为安全网。在变更成本降低的情况下，例如客户端和服务器由同一团队拥有时，我对你没有模式会更宽松一些。\n\
  \n## 微服务之间的变更处理\n\n我关于微服务收到的最常见问题，在“它们应该有多大？”之后就是“如何处理版本控制？”。当这个问题被提出时，它很少是关于应该使用何种编号方案的查询，而更多是关于如何处理微服务之间契约的变更。\n\
  \n如何处理变更实际上可以分解为两个主题。稍后，我们将讨论如果需要进行破坏性变更会发生什么。但在此之前，我们将讨论如何避免首先进行破坏性变更。\n\n## 避免破坏性变更\n\
  \n如果您想避免破坏性变更，有一些关键思想值得探索——其中许多我们在本章开头已经涉及过。如果您能将这些思想付诸实践，您会发现让微服务彼此独立变更变得容易得多。\n\
  \n**扩展变更**：向微服务接口添加新事物，不要删除旧事物\n\n**宽容读取器**：在消费微服务接口时，对你期望的内容保持灵活。\n\n**合适的技术**：选择使接口向后兼容变更更容易的技术。\n\
  \n**显式接口**：明确微服务暴露的内容。这对客户端更友好，也让微服务的维护者更容易理解什么可以自由更改。\n\n**及早捕获意外的破坏性变更**：建立机制，在这些变更部署之前捕获会破坏生产环境中消费者的接口变更。\n\
  \n这些思想确实相互强化，并且许多都建立在我们迄今为止经常讨论的信息隐藏这一关键概念之上。让我们逐一查看。\n\n### 扩展变更\n\n最容易开始的地方可能是只向微服务契约添加新事物，不要删除任何其他内容。考虑向负载添加新字段的示例——假设客户端在某种程度上容忍此类变更，这不应产生实质性影响。例如，向客户记录添加新的\
  \ `dob` 字段应该没问题。\n\n### 宽容读取器\n\n微服务的消费者如何实现，在使向后兼容变更变得容易方面可以起到很大作用。具体来说，我们希望避免客户端代码过于紧密地绑定到微服务的接口。让我们考虑一个电子邮件微服务，其工作是偶尔向我们的客户发送电子邮件。它被要求向\
  \ ID 为 1234 的客户发送订单已发货邮件。它会去检索该 ID 的客户，并得到类似 示例 4-3 中所示的响应。\n\n#### 示例 4-3. 来自客户服务的示例响应\n\
  \n```\n<customer>\n  <firstname>Sam</firstname>\n  <lastname>Newman</lastname>\n\
  \  <email>sam@magpiebrain.com</email>\n  <telephoneNumber>555-1234-5678</telephoneNumber>\n\
  </customer>\n```\n\n现在要发送电子邮件，电子邮件微服务只需要 `firstname`、`lastname` 和 `email` 字段。我们不需要知道\
  \ `telephoneNumber`。我们希望简单地提取我们关心的那些字段，并忽略其余部分。一些绑定技术，尤其是强类型语言使用的技术，可能会尝试绑定*所有*字段，无论消费者是否想要它们。如果我们意识到没有人使用\
  \ `telephoneNumber` 并决定将其删除会怎样？这可能导致消费者不必要地中断。\n\n同样，如果我们想重构我们的 `Customer` 对象以支持更多细节，也许添加一些进一步的结构，如\
  \ 示例 4-4 所示会怎样？电子邮件服务想要的数据仍然在那里，并且名称也相同，但如果我们的代码对 `firstname` 和 `lastname` 字段的存储位置做出非常明确的假设，则它可能会再次中断。在这种情况下，我们可以改用\
  \ XPath 来提取我们关心的字段，从而让我们对字段的位置漠不关心，只要我们能找到它们即可。这种实现能够忽略我们不关心的变更的读取器模式——是 Martin\
  \ Fowler 所称的 [宽容读取器](http://bit.ly/1yISOdQ)。\n\n#### 示例 4-4. 重构的客户资源：数据仍然都在，但我们的消费者能找到吗？\n\
  \n```\n<customer>\n  <naming>\n    <firstname>Sam</firstname>\n    <lastname>Newman</lastname>\n\
  \    <nickname>Magpiebrain</nickname>\n    <fullname>Sam \"Magpiebrain\" Newman</fullname>\n\
  \  </naming>\n  <email>sam@magpiebrain.com</email>\n</customer>\n```\n\n\n\n客户端尽可能灵活地消费服务的例子展示了\
  \ [Postel 定律](http://bit.ly/1Cs7dfR)（又称为 *健壮性原则*），其表述为：“在你所做的事情上保守，在你接受他人所提供的内容上宽容。”\
  \ 这条智慧的原始上下文是网络中设备的交互，在那里你应该预期各种奇怪的事情会发生。在基于微服务的交互的上下文中，这促使我们尝试构建客户端代码以容忍负载的变化。\n\
  \n## 合适的技术\n正如我们已经探讨过的，某些技术在允许更改接口方面可能更脆弱——我已经强调过我对 `Java RMI` 的个人挫败感。另一方面，一些集成实现会不遗余力地使其尽可能容易地进行更改而不破坏客户端。在光谱的简单端，`protocol\
  \ buffers`，作为 `GRPC` 组成部分使用的序列化格式，具有字段编号的概念。`protocol buffer` 中的每个条目都必须定义一个字段编号，客户端代码期望找到它。如果添加了新字段，客户端并不关心。`AVRO`\
  \ 允许将模式与负载一起发送，从而使客户端能够像动态类型一样潜在地解释负载。\n\n在光谱的更极端端，`REST` 概念中的 `HATEOS` 在很大程度上都是关于通过使用前面讨论过的超媒体链接，使客户端即使在端点发生变化时也能使用\
  \ `REST` 端点。这当然要求你接受整个 `HATEOS` 思维方式。\n\n## 显式接口\n我是一个 **大** 粉丝，喜欢微服务公开显式模式来说明其端点的作用。拥有显式模式可以让消费者清楚地知道他们可以期待什么，但它也让正在开发微服务的开发者更加清楚哪些东西应该保持不变以确保不会破坏消费者。换句话说，显式模式在使信息隐藏的边界更加明确方面大有帮助——模式中公开的内容按定义就不是隐藏的。\n\
  \n对于 `RPC` 来说，拥有显式模式已久，而且事实上是许多 `RPC` 实现的要求。另一方面，`REST` 通常将模式的概念视为可选，以至于我发现 `REST`\
  \ 端点的显式模式几乎绝迹。这种情况正在改变，随着前面提到的 `OpenAPI` 规范获得关注，以及 `JSON Schema` 规范也在成熟。\n\n异步消息协议在这一领域面临更大的困难。你可以很容易地为消息的负载提供模式，事实上这正是\
  \ `AVRO` 经常被使用的领域。然而拥有显式接口需要比这更进一步。如果我们考虑一个触发事件的微服务，它公开了哪些事件？目前正在进行一些为基于事件的端点创建显式模式的尝试。其中之一是\
  \ `AsyncAPI`^(11)，它已吸引了不少知名用户，但获得最多关注的似乎是得到 Cloud Native Computing Foundation 支持的\
  \ `CloudEvents` 规范^(12)。Azure 的事件网格产品支持 `CloudEvents` 格式，这是不同厂商支持该格式的迹象，有助于互操作性。这仍然是一个相当新的领域，未来几年会如何发展很有趣。\n\
  \n## 尽早捕获意外破坏性变更\n确保我们尽快发现会破坏消费者的变更至关重要，因为即使我们选择了最佳的技术，微服务的无害更改也可能导致消费者中断。正如我们已经提到的，使用模式可以帮助我们发现结构性变更，前提是我们使用某种工具来帮助比较模式版本。针对不同模式类型，有大量工具可供选择。我们有用于\
  \ `protocol buffers` 的 `ProtoLock`^(13)，用于 `JSON-Schema` 的 `json-schema-diff-validator`^(14)，或用于\
  \ `openAPI` 规范的 `openapi-diff`^(15)。这一领域的工具似乎不断涌现——你所寻找的并不是仅仅报告两个模式之间的差异，而是能够基于兼容性通过或失败的东西——这将允许你在发现不兼容的模式时使\
  \ `CI` 构建失败，确保你的微服务不会被部署。\n\n开源的 `Confluent` 模式注册表^(16) 支持 `JSON-schema`、`AVRO`\
  \ 和 `protocol buffers`，并且能够比较新上传的版本以实现向后兼容。虽然它是在 `Kafka` 被使用的生态系统的一部分下构建的，但该注册表与\
  \ `kafka` 毫无关联，你可以在其他情况下利用它来确保基于模式比较的向后兼容性。\n\n模式比较工具可以帮助我们捕获结构性破坏，但语义性破坏呢？或者如果你根本没有使用模式呢？那么我们就需要测试。这是一个我们将在\
  \ \\[待定链接\\] 中更详细探讨的话题，但我想强调消费者驱动的契约测试，它明确有助于这一领域。只要记住，如果你没有模式，就要期望你的测试需要做更多工作来捕获破坏性变更。\n\
  \n如果你支持多个不同的客户端库，使用你支持的每个库对最新服务运行测试是另一种有帮助的技术。一旦你意识到自己将破坏某个消费者，你可以选择完全避免破坏，或者接受它并开始与负责消费服务的团队进行正确的对话。\n\
  \n## 管理破坏性变更\n你已经尽最大努力确保对微服务接口所做的更改向后兼容，但你意识到你必须进行一个会构成破坏性变更的更改。在这种情况下你可以做什么？你有三个主要选择：\n\
  \nLock-step Deployment\n:\n要求公开接口的微服务及其所有消费者同时更改\n\nCoexist Incompatible Microservice\
  \ Versions\n:\n并行运行微服务的旧版本和新版本\n\nEmulate The Old Interface\n:\n让你的微服务公开新接口，同时也模拟旧接口\n\
  \n### Lock-Step Deployment\n当然，锁步部署违背了独立部署性。如果我们希望能够部署具有接口破坏性变更的微服务新版本，同时仍以独立的方式进行，我们需要给消费者时间升级到新接口。这就引出了我接下来要考虑的另外两个选项。\n\
  \n### Coexist Incompatible Microservice Versions\n\n\n\n## 多个服务版本\n\n另一种经常被引用的版本化方案是让服务的不同版本同时运行，并让旧的消费者将流量路由到旧版本，而新版本则使用新版本，如\
  \ 图 4-3 所示。Netflix 在更改旧消费者成本过高的情况下会谨慎使用这种方法，尤其是在遗留设备仍绑定到 API 旧版本这种罕见情况下。个人而言，我并不喜欢这个想法，也理解\
  \ Netflix 为何很少使用它。首先，如果我需要在服务中修复内部 bug，我现在必须修复并部署两套不同的服务。这很可能意味着我必须为服务分支代码库，而这总是存在问题。其次，这意味着我需要智能逻辑来将消费者导向正确的微服务。这种行为不可避免地会出现在某个中间件中或一堆\
  \ `nginx` 脚本里，使得系统行为更难推理。最后，考虑服务可能管理的任何持久状态。由任一版本服务创建的客户都需要被存储并对所有服务可见，无论数据最初是由哪个版本创建的。这可能成为复杂性的额外来源。\n\
  \n![](img/multiple-service-versions.png)\n\n在短时间内共存并发服务版本可能是完全合理的，尤其是在进行蓝绿部署或金丝雀发布等操作时（我们将在\
  \ [待补充链接] 中更详细讨论这些模式）。在这些情况下，我们可能只共存几个分钟或几个小时的版本，并且通常同时只存在两种不同的服务版本。升级消费者并发布新版本所需的时间越长，你就越应该考虑在同一个微服务中共存不同的端点，而不是共存完全不同的版本。我仍然不相信这项工作对普通项目来说是值得的。\n\
  \n## 模拟旧接口\n\n如果我们已尽一切努力避免引入破坏性接口变更，下一步工作就是限制影响范围。我们想要避免的是强迫消费者与我们同步升级，因为我们始终希望保持独立发布微服务的能力。我成功使用过的一种方法是在同一个运行中的服务中共存旧接口和新接口。因此，如果我们想要发布破坏性变更，我们部署的新服务版本会同时暴露端点的旧版本和新版本。\n\
  \n这使我们能够尽快发布新的微服务以及新接口，同时给消费者迁移时间。一旦所有消费者不再使用旧端点，你就可以将其连同相关代码一起移除，如 图 4-4 所示。\n\n\
  ![](img/emulate-endpoints.png)\n\n我上次使用这种方法时，由于消费者数量和我们所做的破坏性变更数量，我们陷入了一点混乱。这意味着我们实际上共存了端点的三个不同版本。我不推荐这样做！保留所有代码以及确保它们都能正常工作的相关测试绝对是额外的负担。为了使其更易管理，我们内部将所有对\
  \ V1 端点的请求转换为 V2 请求，然后将 V2 请求转换为 V3 端点。这意味着我们可以清楚地划分当旧端点(们)被淘汰时将退役哪些代码。\n\n这实际上是扩展与收缩模式的一个例子，它允许我们分阶段引入破坏性变更。我们\
  \ *expand* 所提供的能力，同时支持旧的和新的做法。一旦旧消费者以新的方式操作，我们就 *contract* 我们的 API，移除旧功能。\n\n如果你要共存端点，就需要一种让调用方相应路由请求的方式。对于使用\
  \ HTTP 的系统，我见过通过请求头中的版本号以及 URI 本身来实现——例如 `/v1/customer/` 或 `/v2/customer/`。我对哪种方法更有意义感到犹豫。一方面，我喜欢\
  \ URI 保持不透明以阻止客户端硬编码 URI 模板，但另一方面，这种方法确实更明显，可以简化请求路由。\n\n对于 RPC，事情可能会有点棘手。我曾通过在\
  \ protocol buffers 中将方法放在不同的命名空间来处理这个问题——例如 `v1.createCustomer` 和 `v2.createCustomer`——但当你试图支持在网络上传输的相同类型的不同版本时，这可能会变得非常痛苦。\n\
  \n## 我更倾向于哪种方法？\n\n对于同一团队管理微服务和所有消费者的情况，我在有限情况下对同步发布持相对宽松态度。假设这确实是一次性情况，那么在影响仅限于单个团队的情况下这样做是可以证明的。我对此非常谨慎，因为一次性活动可能变成常规业务，而独立部署能力也就此丧失。过度使用同步部署，很快你就会得到一个分布式单体。\n\
  \n如我们所讨论，共存同一微服务的不同版本可能存在问题。我只会在计划让微服务版本并行运行很短时间的情况下考虑这样做。现实是，当你需要给消费者升级时间时，可能需要数周甚至更久。在其他可能共存微服务版本的情况下，比如蓝绿部署或金丝雀发布，所涉及的持续时间要短得多，从而抵消了这种方法的缺点。\n\
  \n在我看来，我的总体偏好是在可能的情况下使用旧端点的模拟。实现模拟的挑战在我看来比共存微服务版本更容易处理。\n\n## 社会契约\n\n你选择哪种方法在很大程度上取决于消费者对这些变更如何进行的期望。保留旧接口会产生成本，理想情况下你希望尽快关闭它并移除相关代码和基础设施。另一方面，你希望给消费者尽可能多的时间进行变更。并且请记住，在许多情况下，你所做的向后不兼容变更往往是消费者要求的，或者实际上最终会使他们受益。当然，微服务维护者的需求与消费者之间存在平衡——这需要讨论。\n\
  \n我发现，在许多情况下，这些变更将如何处理从未被讨论过，导致各种挑战。就像模式一样，对如何进行向后不兼容变更有一定程度的明确性可以大大简化事情。\n\n你不需要大量的文件和巨大的会议来就这些事情达成一致。但微服务的拥有者和消费者需要在几件事上达成明确共识。假设你不走同步发布的路线，我建议明确以下几点：\n\
  \n*   你将如何提出接口需要变更的问题？\n*   消费者和微服务团队将如何协作以就变更的外观达成一致？\n*   谁被期望执行更新消费者的工作？\n* \
  \  变更达成一致后，消费者在新接口被移除前有多长时间迁移到新接口？\n\n\n\n\n## 以消费者为先的微服务架构\n\n请记住，有效微服务架构的秘诀之一是采用以消费者为先的方法。你的微服务存在的意义就是被其他消费者调用。他们的需求至关重要，如果你对微服务进行的更改会给上游消费者带来问题，就必须将此考虑在内。\n\
  \n当然在某些情况下可能无法更改消费者。我听说 Netflix 曾遇到（至少在历史上）问题，老式机顶盒使用旧版本的 Netflix API。这些机顶盒无法轻松升级，因此旧端点必须保持可用，直到旧机顶盒的数量下降到可以停用其支持的水平为止。停止旧消费者访问你的端点的决定有时会变成财务问题——维护旧接口要花费你多少钱，与你从这些消费者那里赚取的钱相权衡。\n\
  \n## 追踪使用情况\n\n即使你同意消费者应在某个时间停止使用旧接口，你能知道他们是否真的停止使用了吗？确保为微服务公开的每个端点都设置日志记录会有帮助，确保拥有某种客户端标识符也很有帮助，这样如果需要与他们合作让他们迁移\
  \ away from 旧接口，你就可以联系相关团队。这可能像要求消费者在进行 HTTP 请求时将其标识符放在用户代理头中一样简单，或者你可以要求所有调用都通过某种\
  \ API 网关进行，客户端需要密钥来识别自己。\n\n## 极端措施\n\n因此，假设你知道某个消费者仍在使用你想移除的旧接口，并且他们在迁移到新版本方面拖拖拉拉，你能怎么办？嗯，首先要做的就是与他们交谈。也许你可以伸出援手帮助他们完成更改。如果一切都失败了，即使他们已经同意，他们仍然不升级，那么我见过一些极端技术被使用。\n\
  \n在一家大型科技公司，我与他们讨论过他们如何处理这个问题。内部规定，在旧接口被淘汰前有一个非常宽裕的一年期限。我问他们如何知道消费者是否仍在使用旧接口，他们回复说他们其实并不在意追踪这些信息。一年后他们就直接关闭旧接口。内部认可的是，如果这导致某个消费者出现故障，那么在该公司看来这是消费微服务团队的责任——他们有一年的时间进行更改，却没有做到。当然，这种方法对很多人来说行不通（我说是极端的！）。它还导致了很大程度的低效。通过不知道旧接口是否被使用，他们失去了在一年期满前将其移除的机会。个人而言，即使我要建议在一定时间后直接关闭端点，我仍然肯定希望追踪会受到影响的是谁。\n\
  \n我看到的另一个极端措施实际上是在弃用库的背景下，但理论上也可以用于微服务端点。给出的例子是一个旧库，人们正试图在组织内部将其淘汰，改用更新更好的库。尽管做了大量工作，其他团队仍在拖延。解决方案是在旧库中插入\
  \ sleep，使其对调用的响应变慢（并记录日志以显示发生了什么）。随着时间的推移，团队只是不断增加 sleep 的持续时间，直到最终其他团队收到信息。你显然必须非常确定自己已经用尽了让消费者升级的其他合理努力，才考虑这样做！\n\
  \n## DRY 与微服务世界中代码重用的风险\n\n我们开发者经常听到的一个缩写是 DRY：don’t repeat yourself。虽然其定义有时被简化为尝试避免代码重复，但\
  \ DRY 更准确的意思是我们希望避免重复系统的 *行为和知识*。总体而言这是非常明智的建议。拥有大量做相同事情的代码行会使你的代码库比所需更大，因此更难推理。当你想要更改行为，而该行为在系统的许多部分中重复时，很容易忘记需要更改的所有地方，这可能导致错误。因此，一般来说，将\
  \ DRY 作为座右铭是有意义的。\n\nDRY 促使我们创建可重用的代码。我们将重复的代码提取到抽象中，然后可以从多个地方调用。也许我们甚至会进一步创建一个可以在任何地方使用的共享库！不过事实证明，在微服务环境中共享代码比这更复杂。正如\
  \ always，我们有不止一个选项需要考虑。\n\n## 通过库共享代码\n\n我们不惜一切代价想要避免的是过度耦合微服务和消费者，以至于微服务本身的任何微小更改都会导致消费者不必要的更改。然而，有时使用共享代码会产生这种耦合。例如，在一家客户处我们有一个通用领域对象的库，代表了系统中使用的核心实体。这个库被我们所有的服务使用。但当其中一个对象被更改时，所有服务都必须更新。我们的系统通过消息队列通信，队列中现在\
  \ *无效* 的内容也必须被清空，如果你忘记了，后果不堪设想。\n\n如果你的共享代码的使用 ever 泄漏到服务边界之外，你就引入了一种潜在的耦合形式。使用像日志库这样的通用代码是可以的，因为它们是对外界不可见的内部概念。RealEstate.com.au\
  \ 使用定制的服务模板来帮助启动新服务的创建。该公司没有让这段代码共享，而是为每个新服务复制它，以确保耦合不会渗入。\n\n通过库共享代码的真正重要一点是，你无法一次性更新库的所有使用。虽然多个微服务可能都使用同一个库，但它们通常是通过将该库打包到微服务部署中来实现的。因此，要升级所使用的库版本，你就需要重新部署微服务。如果你想在完全相同的时间在所有地方更新同一个库，这可能导致多个不同的微服务同时进行大规模部署，并带来所有相关的头痛问题。\n\
  \n因此，如果在微服务边界之间使用库进行代码重用，你必须接受同一库的多个不同版本可能同时存在。当然，你可以随着时间的推移尝试将它们全部更新到最新版本，但只要你能接受这一事实，那么尽情通过库重用代码吧。如果你确实需要在完全相同的时间为该代码的所有用户更新它，那么你实际上需要考虑通过专门的微服务来重用代码。\n\
  \n不过，与通过库重用相关的一个特定用例值得进一步探讨。\n\n### 客户端库\n\n我曾与不止一个团队交谈过，他们坚持认为为你的服务创建客户端库是创建服务之初必不可少的一部分。理由是这使得使用你的服务变得容易，并避免了消费服务本身所需代码的重复。\n\
  \n\n\n当然，问题在于如果同一批人同时创建服务器 API 和客户端 API，就存在本应存在于服务器上的逻辑开始泄漏到客户端的危险。我应该知道：我自己也做过这种事。客户端库中渗入的逻辑越多，内聚性就开始瓦解，你会发现自己必须更改多个客户端才能将服务器的修复部署出去。你还限制了技术选择，尤其是当你强制要求必须使用客户端库时。\n\
  \n我喜欢的客户端库模式是 Amazon Web Services (AWS) 的模式。底层的 SOAP 或 REST Web 服务调用可以直接进行，但每个人最终都会使用其中一种现有的各种软件开发工具包（SDK），它们为底层\
  \ API 提供了抽象。这些 SDK 虽然是由社区或除 API 本身工作人员之外的 AWS 人员编写的。这种程度的分离似乎有效，并避免了一些客户端库的陷阱。这之所以能如此有效，部分原因是客户端控制升级发生的时间。如果你自己走客户端库这条路，请确保情况就是这样。\n\
  \nNetflix 特别强调客户端库，但我担心人们纯粹将其视为避免代码重复的手段。事实上，Netflix 使用的客户端库在很大程度上（如果不是更多的话）是为了确保其系统的可靠性和可扩展性。Netflix\
  \ 的客户端库处理服务发现、故障模式、日志记录以及其他与服务本身性质无关的方面。如果没有这些共享客户端，就很难确保 Netflix 所运营的庞大规模下每一段客户端/服务器通信都能表现良好。它们在\
  \ Netflix 的使用确实使快速启动和提高生产率变得容易，同时也确保系统表现良好。然而，据 Netflix 至少一位人士称，随着时间的推移，这导致了客户端和服务器之间存在一定程度的耦合，这是有问题的。\n\
  \n如果你正在考虑客户端库方法，将客户端代码分离出来以处理底层传输协议（可以处理诸如服务发现和故障之类的事情）与与目标服务本身相关的事情可能是很重要的。决定是否要坚持使用客户端库，或是否允许使用不同技术栈的人调用底层\
  \ API。最后，请确保客户端控制何时升级其客户端库：我们需要确保保持独立于彼此发布服务的能力！\n\n## 服务网格和 API 网关\n\n服务网格和 API\
  \ 网关确实提供了一种在微服务之间共享代码的潜在方式，而无需创建新的客户端库或新的微服务。非常简单地说，服务网格和 API 网关可以作为微服务之间的代理。这意味着它们可用于实现一些微服务无关的行为，否则这些行为必须在代码中完成，例如服务发现或日志记录。\n\
  \n如果你使用 API 网关或服务网格为微服务实现共享的通用行为，那么这种行为必须是完全通用的——换句话说，代理中的行为与单个微服务的任何特定行为无关。\n\n\
  API 网关和服务网格是需要更深入探讨的话题——我们将在 \\[链接待定\\] 中再次讨论它们。\n\n## 摘要\n\n所以，我们在这里涵盖了很多内容——让我们分解一下我们所涵盖的一些内容。\n\
  \n* 首先，确保你试图解决的问题指导你的技术选择。基于你的上下文和你偏好的通信风格，使用它来选择最适合你的技术——不要陷入先选技术这个陷阱。再次分享的 图 4-5\
  \ 模型可以帮助指导你的决策，但仅仅遵循这个模型并不能替代坐下来思考你自己的情况。\n\n![](img/comms-styles.png)\n\n* 无论你做出什么选择，都应考虑使用模式作为使你的契约更明确的一部分，同时也有助于捕获意外的破坏性变更。\n\
  \n* 在可能的情况下，力求做出向后兼容的更改，以确保独立部署仍然成为可能。\n\n* 如果你确实必须进行向后不兼容的更改，请找到一种方法让消费者有时间升级，以避免同步部署。\n\
  \n接下来，我们需要解决大多数人并非从微服务架构开始的事实，并探讨如何将现有的单体系统迁移到微服务架构。\n\n^(1) [*https://protolock.dev/*](https://protolock.dev/)\n\
  \n^(2) [*https://github.com/OAI/OpenAPI-Specification/*](https://github.com/OAI/OpenAPI-Specification/)\n\
  \n^(3) Robinson, Ian, Jim Webber, and Savas Parastatidis, “REST 实战：超媒体与系统架构”。 O’Reilly\
  \ 2010\n\n^(4) [*https://graphql.org/*](https://graphql.org/)\n\n^(5) Stopford,\
  \ Ben. *设计事件驱动系统*. O’Reilly 2017.\n\n^(6) Narkhede, Neha, Gwen Shapira and Todd\
  \ Palino. *Kafka：权威指南*. O’Reilly 2017\n\n^(7) [*https://github.com/real-logic/simple-binary-encoding*](https://github.com/real-logic/simple-binary-encoding)\n\
  \n^(8) [*https://capnproto.org/*](https://capnproto.org/)\n\n^(9) [*https://google.github.io/flatbuffers/*](https://google.github.io/flatbuffers/)\n\
  \n^(10) Martin Fowler 在无模式数据存储的背景下更详细地探讨了这一点： [*https://martinfowler.com/articles/schemaless/*](https://martinfowler.com/articles/schemaless/)\n\
  \n^(11) [*https://www.asyncapi.com/*](https://www.asyncapi.com/)\n\n^(12) [*https://cloudevents.io/*](https://cloudevents.io/)\n\
  \n^(13) [*https://github.com/nilslice/protolock*](https://github.com/nilslice/protolock)\n\
  \n^(14) [*https://www.npmjs.com/package/json-schema-diff-validator*](https://www.npmjs.com/package/json-schema-diff-validator)\n\
  \n^(15) 请注意，这个领域实际上有三个同名工具！ [*https://github.com/Azure/openapi-diff*](https://github.com/Azure/openapi-diff)\
  \ 似乎最接近一个真正通过或失败兼容性检查的工具\n\n^(16) [*https://github.com/confluentinc/schema-registry#documentation*](https://github.com/confluentinc/schema-registry#documentation)\n"
- '# 第5章 工作流


  在之前的两章中，我们研究了与一个微服务如何与另一个微服务通信相关的方面。但当我们希望多个微服务协同工作时，也许是为了实现一个业务流程，会发生什么？如何在分布式系统中建模和实现这类工作流可能是一个难以做对的问题。


  在本章中，我们将研究使用分布式事务解决此问题相关的陷阱，并研究 Saga——一个概念，它可以帮助我们以更令人满意的方式建模微服务工作流。


  ## 事务





  在作为同一整体操作的一部分进行多项更改时，我们希望了解这些更改是否全部已完成。我们也希望在这些更改发生过程中出现错误时能够清理自身。通常，这导致我们使用类似数据库事务的东西。


  泛指来说，当我们在计算的上下文中思考事务时，我们会想到一个或多个即将发生的操作，我们希望将其视为一个单一单元。我们希望知道事务是否已完成，或未完成——但无论如何，作为事务一部分发生的所有操作要么全部完成，要么全部不完成，作为一个整体。


  你日常最常处理的事务形式是在使用数据库时。在这里，我们使用事务来确保一个或多个数据项成功存储——在关系数据库中，这可能涉及在单个事务内更新多个表。


  ## ACID Transactions


  通常，当我们谈论数据库事务时，我们说的是 `ACID` 事务。`ACID` 是一个缩写，概述了数据库事务的关键属性，这些属性使我们能够依赖系统来确保数据存储的持久性和一致性。`ACID`
  代表 `atomicity`、`consistency`、`isolation` 和 `durability`，以下是这些属性为我们提供的：


  ### Atomicity

  确保事务内的所有操作要么全部完成，要么全部失败。如果我们尝试进行的任何更改因某种原因失败，则整个操作将被中止，就好像从未进行过任何更改一样。


  ### Consistency

  当对数据库进行更改时，我们确保其处于有效且一致的状态。


  ### Isolation

  允许多个事务同时运行而互不干扰。这是通过确保一个事务期间所做的任何中间状态更改对其他事务不可见来实现的。


  ### Durability

  确保一旦事务完成，我们确信在系统故障的情况下数据不会丢失。


  值得注意的是，并非所有数据库都提供 `ACID` 事务。我使用过的所有关系数据库系统都提供，诸如 `Neo4j` 等许多较新的 NoSQL 数据库也是如此。`MongoDB`
  多年来仅在对单个文档进行的更改上支持 `ACID` 事务，这可能会导致问题，如果你想对多个文档进行原子更新的话。^(1)


  本书并非对这些概念进行详细深入探讨的书籍；为了简洁起见，我确实简化了一些描述。对于那些希望进一步探索这些概念的人，我推荐 *设计数据密集型应用*。^(2) 在接下来的内容中，我们主要关注
  `atomicity`。这并不意味着其他属性不重要，而是当我们开始将功能拆分为微服务时，`atomicity` 通常是我们首先遇到的问题。


  ## Still ACID, but Lacking Atomicity?


  我明确指出，使用微服务时我们仍然可以使用 `ACID` 风格的事务。例如，微服务可以自由地对其自己的数据库操作使用 `ACID` 事务。只是这些事务的范围缩小了，其有用性也随之降低。请考虑
  图 5-1。我们正在跟踪将新客户 onboarding 到 `MusicCorp` 的流程。我们已到达流程的末尾，其中涉及将客户的 `Status` 从 `PENDING`
  更改为 `VERIFIED`。由于注册现已完成，我们还希望从 `PendingEnrollments` 表中删除匹配的行。在单个数据库中，这是在单个 `ACID`
  数据库事务的范围内完成的——要么两个新行都被写入，要么都不写入。


  ![](img/momi_0446.png)


  将其与 图 5-2 进行比较。我们正在进行完全相同的更改，但现在每个更改都在不同的数据库中进行。这意味着有两种事务需要考虑，每种事务都可能独立于另一个而成功或失败。


  ![](img/momi_0447.png)


  当然，我们可以决定对这两个事务进行排序，仅在能够更改 `Customer` 表中的行时才从 `PendingEnrollments` 表中删除一行。但我们仍然需要考虑如果随后从
  `PendingEnrollments` 表的删除失败该怎么办——所有这些逻辑都需要我们自己实现。尽管如此，能够重新排序步骤以处理这些用例是一个非常有用的想法（当我们探索
  `sagas` 时我们会再次回到这一点）。但从根本上说，通过将此操作分解为两个单独的数据库事务，我们必须接受整个操作已失去保证的 `atomicity`。


  这种 `atomicity` 的缺乏可能会开始导致重大问题，特别是如果我们正在迁移以前依赖此属性的系统。在这一点上，人们开始寻找其他解决方案，以便能够对同时对多个微服务进行的更改进行推理。通常，人们首先考虑的第一个选项是分布式事务。让我们看一下实现分布式事务最常见的算法之一
  `two-phase commit`，以便探索与分布式事务整体相关的挑战。


  ## Two-Phase Commits


  `two-phase commit algorithm`（有时缩写为 `2PC`）经常被用来尝试赋予我们在分布式系统中进行事务性更改的能力，在该系统中，整体操作的一部分可能需要更新多个独立进程。分布式事务，特别是两阶段提交，经常被转向微服务架构的团队提出作为解决他们面临挑战的一种方式。但正如我们将看到的，它们可能无法解决你的问题，甚至可能给你的系统带来更多混乱。


  `2PC` 被分为两个阶段（因此得名 `two-phase commit`）：投票阶段和提交阶段。在投票阶段，中央协调器联系将参与事务的所有工作者，并询问是否可以进行某些状态更改的确认。在
  图 5-3 中，我们看到两个请求，一个是将客户状态更改为 `VERIFIED`，另一个是从我们的 `PendingEnrollments` 表中删除一行。如果所有工作者都同意他们被要求的状态更改可以进行，则算法进入下一阶段。如果任何工作者表示更改无法进行，也许是因为请求的状态更改违反了某些本地条件，则整个操作中止。


  ![](img/momi_0448.png)


  重要的是要强调，更改并不会在工作者表示可以进行更改后立即生效。相反，工作者保证它将在未来的某个时间点能够进行该更改。工作者如何做出这样的保证？例如，在 图 5-3
  中，Worker A 表示它将能够更改 `Customer` 表中行的状态，以将该特定客户的状态更新为 `VERIFIED`。如果在稍后某个时间点不同的操作删除了该行，或进行了另一个较小的更改，尽管如此意味着稍后更改为
  `VERIFIED` 无效怎么办？为了保证稍后可以进行此更改，Worker A 很可能必须锁定该记录，以确保此类更改无法发生。




  如果有任何工作节点没有投票赞成提交，则需要向所有各方发送回滚消息，以确保它们能够本地清理，从而允许工作节点释放它们可能持有的任何锁。如果所有工作节点都同意进行更改，我们就进入提交阶段，如图
  5-4 所示。在这里，实际进行更改，并释放相关的锁。


  ![](img/momi_0449.png)


  需要注意的是，在这种系统中，我们无法以任何方式保证这些提交会在完全相同的时间发生。协调器需要向所有参与者发送提交请求，而该消息可能会在不同时间到达并被处理。这意味着，如果我们允许在事务协调器之外查看这些工作节点的状态，那么我们可能会看到对
  `Worker A` 所做的更改，但尚未看到对 `Worker B` 的更改。协调器之间的延迟越大，以及工作节点处理响应的速度越慢，这种不一致的窗口可能就越宽。回到我们对
  `ACID` 的定义，隔离确保我们在事务期间看不到中间状态。但使用这种 `two-phase commit`，我们就失去了这一点。


  `two-phase commit` 在其核心工作时，经常只是协调分布式锁。工作节点需要锁定本地资源，以确保提交可以在第二阶段进行。在单进程系统中管理锁并避免死锁并不有趣。现在想象一下在多个参与者之间协调锁的挑战。这并不好看。


  与 `two-phase commit` 相关的一系列故障模式我们没有时间深入探讨。考虑这样一个问题：工作节点投票同意继续进行事务，但在被要求提交时却没有响应。那时我们该怎么办？其中一些故障模式可以自动处理，但有些可能会使系统处于需要手动拆解的状态。


  参与者越多，系统中的延迟越大，`two-phase commit` 就会出现越多的问题。它们可以快速地为系统注入大量延迟，尤其是在锁定的范围很大或事务持续时间很长的情况下。正因如此，`two-phase
  commit` 通常仅用于非常短暂的操作。操作时间越长，资源被锁定的时间就越长！


  # 分布式事务——坚决说不


  出于迄今为止列出的所有原因，我强烈建议你避免使用像 `two-phase commit` 这样的分布式事务来协调微服务之间状态的变更。那还能做什么呢？


  好吧，第一个选项可以是首先根本不拆分数据。如果你有一些状态想要以真正原子且一致的方式管理，并且你无法在没有 `ACID` 风格事务的情况下合理地获得这些特性，那么就将该状态保留在单个数据库中，并将管理该状态的功能保留在单个服务（或你的单体应用）中。如果你正在研究将单体应用拆分的位置，以及哪些分解可能容易（或困难），那么你很可能会决定，现在拆分当前在事务中管理的数据太难处理了。先在系统的其他区域工作，以后再回来处理这个问题。


  但如果确实需要拆分这些数据，但又不想承受管理分布式事务的所有痛苦会怎样？如何在多个服务中执行操作同时避免锁定呢？如果操作需要花费几分钟、几天，甚至几个月怎么办？在这种情况下，我们可以考虑一种替代方法：`sagas`。


  # Saga


  与 `two-phase commit` 不同，`saga` 在设计上是一种算法，可以协调多个状态变更，但避免了长时间锁定资源的需求。我们通过将涉及的步骤建模为可独立执行的离散活动来实现这一点。它还带来额外好处，即迫使我们明确建模业务流程，这可能带来显著益处。


  核心思想首次在 Hector Garcia-Molina 和 Kenneth Salem 的“Sagas”中概述，^(3) 反映了他们所称的 `long lived
  transactions` (`LLTs`) 操作的最佳处理方式的挑战。这些事务可能需要很长时间（几分钟、几小时，甚至几天），并且作为该过程的一部分需要对数据库进行更改。


  如果你直接将 `LLT` 映射到普通的数据库事务，单个数据库事务将跨越 `LLT` 的整个生命周期。这可能导致在 `LLT` 进行期间，多行甚至整个表被长时间锁定，如果其他进程尝试读取或修改这些被锁定的资源，就会造成严重问题。


  相反，论文的作者建议我们应该将这些 `LLTs` 拆分为一系列事务，每个事务都可以独立处理。其思路是，这些“子”事务的持续时间会更短，并且只会修改整个 `LLT`
  影响的数据的一部分。因此，由于锁的范围和持续时间大大减少，底层数据库的争用会少得多。


  虽然 `sagas` 最初被设想为帮助针对单个数据库的 `LLTs` 的机制，但该模型同样适用于协调跨多个服务的变更。我们可以将单个业务流程分解为一组调用，作为单个
  `saga` 的一部分向协作服务发出。


  ### 注意


  在继续之前，你需要明白，`saga` 并不会在我们习惯于普通数据库事务的 `ACID` 术语中给予我们原子性。当我们将 `LLT` 拆分为单独的事务时，我们在
  `saga` 本身的级别上没有原子性。我们确实对 `LLT` 内部的每个子事务具有原子性，因为每个子事务如果需要都可以关联到一个 `ACID` 事务性变更。`saga`
  给予我们的只是足够的信息来推理它所处的状态；处理其影响是我们的责任。


  让我们看一下 MusicCorp 的一个简单的订单履行流程，概述在 图 5-5 中，我们可以用它在微服务架构的上下文中进一步探索 `sagas`。


  ![](img/momi_0450.png)


  在这里，订单履行流程被表示为单个 `saga`，流程中的每个步骤代表可由不同服务执行的某个操作。在每个服务内部，任何状态变更都可以在本地 `ACID` 事务中处理。例如，当我们使用
  `Warehouse` 服务检查和预留库存时，内部 `Warehouse` 服务可能会在其本地 `Reservation` 表中创建一个记录预留的行；此更改将在普通事务中处理。


  ## Saga 失败模式


  由于 `saga` 被拆分为单独的事务，我们需要考虑如何处理失败——更具体地说，如何在发生故障时恢复。原始的 `saga` 论文描述了两种恢复类型：`Backward
  recovery` 和 `Forward recovery`。


  `Backward recovery` 涉及回滚失败并在之后进行清理——回滚。为此工作，我们需要定义补偿操作以允许我们撤销先前已提交的事务。`Forward recovery`
  允许我们从故障发生点继续，并保持处理。为此工作，我们需要能够重试事务，这反过来意味着我们的系统需要持久化足够的信息以允许此重试发生。




  根据所建模业务流程的性质，你可能会考虑任何故障模式都会触发向后恢复、向前恢复，或是两者的混合。


  ## Saga 回滚


  使用 ACID 事务，如果遇到问题，我们会在提交发生前触发回滚。回滚后，就像什么都没发生过一样：我们试图进行的更改并未发生。而在我们的 Saga 中，却涉及多个事务，其中一些可能在我们决定回滚整个操作之前就已经提交了。那么，在事务已经提交之后，我们如何回滚它们呢？


  让我们回到订单处理的示例，如 图 5-5 所概述。考虑一种潜在的故障模式。我们已经进行到尝试打包商品，却发现商品在仓库中找不到，如 图 5-6 所示。我们的系统认为商品存在，但它根本不在货架上！


  ![](img/momi_0451.png)


  现在，假设我们决定只回滚整个订单，而不是给客户将商品放入缺货待补选项。问题是我们已经收取了款项并为该订单授予了忠诚度积分。


  如果所有这些步骤都在单个数据库事务中完成，简单的回滚就会清理所有问题。然而，订单履行过程中的每个步骤都由不同的服务调用处理，每个调用都在不同的事务范围内运行。整个操作并没有简单的“回滚”。


  相反，如果你想实现回滚，就需要实现补偿事务。*补偿事务*是一种撤销先前已提交事务的操作。要回滚我们的订单履行流程，我们将为 Saga 中已提交的每个步骤触发补偿事务，如
  图 5-7 所示。


  ![](img/momi_0452.png)


  值得指出的是，这些补偿事务可能无法完全具有与正常数据库回滚相同的行为。数据库回滚发生在提交之前；回滚后，就好像事务从未发生过。在这种情况下，当然这些事务*确实*发生了。我们正在创建一个新的事务来撤销原始事务所做的更改，但我们无法回滚时间，使其好像原始事务从未发生过一样。


  因为我们不能总是干净地撤销一个事务，所以我们说这些补偿事务是*语义回滚*。我们不能总是清理一切，但在 Saga 的上下文中我们做了足够的事情。例如，我们的一个步骤可能涉及向客户发送电子邮件告知订单正在途中。如果我们决定回滚它，你就无法撤回电子邮件！^(4)
  相反，你的补偿事务可以导致向客户发送第二封电子邮件，告知订单出现问题且已被取消。


  让与回滚相关的信息保留在系统中是完全合适的。事实上，这可能是非常重要的信息。你可能希望在 `Order` 服务中为此中止的订单保留记录，并附带发生了什么的信息，原因有很多。


  ## 重新排序步骤以减少回滚


  在 图 5-7 中，我们可以通过重新排序步骤使可能的回滚场景变得稍微简单一些。一个简单的更改就是仅在订单实际发出时才授予积分，如 图 5-8 所见。


  ![](img/momi_0453.png)


  这样，如果在尝试打包和发送订单时出现问题，我们就无需担心该阶段被回滚。有时只需调整流程的执行方式即可简化回滚操作。通过提前那些最可能失败的步骤并更早地使流程失败，你可以避免触发后期的补偿事务，因为那些步骤根本就未被触发。


  如果能够容纳这些更改，它们可以让你的生活变得轻松许多，避免为某些步骤甚至创建补偿事务的需要。如果实现补偿事务很困难，这尤其重要。你可能可以将步骤移至流程的后期阶段，在该阶段它永远不需要被回滚。


  ## 混合失败回退和失败前行情况


  拥有混合的故障恢复模式是完全合适的。某些故障可能需要回滚；其他故障可能是向前失败。例如，对于订单处理，一旦我们从客户处收取了款项，商品也被打包，剩下的唯一步骤就是派送包裹。如果由于某种原因我们无法派送包裹（也许我们使用的配送公司今天货车没有空间装载订单），回滚整个订单似乎非常奇怪。相反，我们很可能会重试派送（也许将其排队到次日），如果失败，则需要人工干预来解决情况。


  ## 实现 Saga


  到目前为止，我们已经研究了 Saga 工作方式的逻辑模型，但我们需要更深入地研究实现 Saga 本身的方法。我们可以查看两种 Saga 实现风格。*编排式 Saga*
  更接近原始解决方案空间，主要依赖于集中式协调和跟踪。它们可以与 *编舞式 Saga* 相比较，后者避免了集中式协调的需求，转而采用更松散耦合的模型，但这会使跟踪
  Saga 的进展变得更加复杂。


  ### 编排式 Saga


  编排式 Saga 使用中央协调器（从现在起我们称之为 *编排器*）来定义执行顺序并触发任何所需的补偿操作。你可以将编排式 Saga 视为一种命令和控制方法：中央编排器控制何时发生什么，并且由此带来对任何给定
  Saga 正在发生情况的良好可见性。


  以 图 5-5 所示的订单履行流程为例，让我们看看这种中央协调流程如何作为一组协作服务工作，如 图 5-9 所示。


  ![](img/momi_0454.png)


  在这里，我们的中央 `Order Processor` 扮演编排器的角色，协调我们的履行流程。它知道执行操作所需的服务，并决定何时调用这些服务。如果调用失败，它可以决定因此采取什么行动。这些编排式处理器倾向于在服务之间大量使用请求-响应调用：`Order
  Processor` 向服务（例如 `Payment Gateway`）发送请求，并期望收到响应，告知请求是否成功并提供请求结果。


  将业务流程明确建模在 `Order Processor` 内部是非常有益的。它允许我们在系统的某一个地方查看并了解该流程 supposed to work 的方式。这可以使新员工的入职变得更容易，并有助于更好地理解系统的核心部分。


  不过，也有几个缺点需要考虑。首先，从其本质上讲，这是一种某种程度上耦合的方法。我们的 `Order Processor` 需要了解所有相关服务，导致我们之前在
  [待定链接] 中讨论的领域耦合程度更高。虽然这本身并不坏，但我们仍希望尽可能将领域耦合保持在最低限度。在这里，我们的 `Order Processor` 需要了解并控制太多事情，以至于这种耦合形式很难避免。




  另一个更微妙的问题是，本应下推到服务中的逻辑可能会开始被编排器吸收。如果这种情况开始发生，你可能会发现你的服务变得贫血，几乎没有自己的行为，只是像 `Order
  Processor` 这样的编排器下达指令一样接受命令。重要的是，你仍然应将构成这些编排流程的服务视为具有自身本地状态和行为的实体。它们负责自己的本地状态机。


  #### 警告

  如果逻辑有可以被集中的地方，它就会被集中！


  避免编排流程过度集中的一种方法可以是确保为不同的流程配备不同的服务担任编排器的角色。你可能有一个处理下单的 `Order Processor` 微服务，一个处理退货和退款流程的
  `Returns` 微服务，一个处理新库存到货并上架的 `Goods Receiving` 微服务，等等。像我们的 `Warehouse` 微服务这样的服务可能会被所有这些编排器使用；这种模型使你更容易将功能保留在
  `Warehouse` 微服务本身，以便在所有这些流程中重用功能。


  ### 协作式 Saga

  协作式 Saga 旨在将 Saga 运行的责任分摊给多个协作服务。如果编排是命令与控制，那么协作式 Saga 则代表一种信任但验证的架构。正如我们在 图 5-10
  中的示例中所看到的，协作式 Saga 通常会大量使用事件来进行服务之间的协作。


  ![](img/momi_0455.png)


  这里有很多内容，所以值得更详细地探讨。首先，这些微服务正在对收到的事件做出反应。从概念上讲，事件在系统中被广播，感兴趣的各方能够接收它们。记住，正如我们在 第
  3 章 中讨论的那样，你不会将事件发送 *向* 微服务；你只是将其发出，而对这些事件感兴趣的微服务能够接收它们并据此采取行动。在我们的示例中，当 `Warehouse`
  服务收到第一个 `Order Placed` 事件时，它知道自己的工作是预留适当的库存，并在完成后发出事件。如果无法收到库存，`Warehouse` 需要引发适当的事件（也许是
  `Insufficient Stock` 事件），这可能会导致订单被中止。


  通常，你会使用某种消息代理来管理事件的可靠广播和传递。可能有多个微服务对同一事件做出反应，这时你就会使用主题。对某类事件感兴趣的各方会订阅特定主题，而无需担心这些事件来自何处，代理确保主题的持久性以及其上的事件成功传递给订阅者。例如，我们可能有一个
  `Recommendation` 服务也监听 `Order Placed` 事件，并利用它构建你可能喜欢的音乐选择数据库。


  在前述架构中，没有任何一个服务知道其他微服务。它们只需要知道在收到某个事件时该做什么——我们大幅减少了领域耦合的程度。本质上，这使得架构耦合度大大降低。随着流程的实现被分解并分发到这里的四个微服务中，我们也避免了逻辑集中的问题（如果你没有可以集中逻辑的地方，那么它就不会被集中！）。


  其反面是，现在弄清楚发生了什么可能会更困难。有了编排，我们的流程在编排器中被明确建模。现在，以这种方式呈现的架构，你将如何建立对流程应如何进行的心理模型？你必须单独查看每个服务的行为，并在自己的脑海中重新构建这幅图景——即使对于像这样简单的业务流程来说，也远非直接的过程。


  缺乏对业务流程的显式表示已经够糟糕了，但我们也缺乏了解 Saga 处于何种状态的方法，这也可能剥夺我们在需要时附加补偿操作的机会。我们可以将部分责任推给各个服务以执行补偿操作，但从根本上说，我们需要一种了解
  Saga 状态的方式来进行某些类型的恢复。缺乏一个可以查询 Saga 状态的中心位置是一个大问题。编排提供了这一点，那么在这里我们如何解决这个问题呢？


  实现此目的最简单的方法之一是，通过消费发出的事件，从现有系统中投影出关于 Saga 状态的视图。如果我们为 Saga 生成一个唯一 ID，我们就可以将其放入作为该
  Saga 部分发出的所有事件中——这就是所谓的 `correlation ID`。然后我们可以有一个服务，其工作只是吸取所有这些事件并呈现每个订单处于何种状态的视图，并且如果其他服务无法自行完成，可以以编程方式执行操作来解决履行过程中的问题。我认为某种形式的
  `correlation ID` 对于这种协作式 Saga 来说是必不可少的，但它们在更广泛的范围内也有很多价值，我们在 \[链接待定\] 中更深入地探讨了这一点。


  ### 混合风格

  虽然编排式 Saga 和协作式 Saga 看起来像是关于 Saga 如何实现的两极对立观点，但你可以很容易地考虑混合搭配模型。你的系统中可能有一些业务流程更自然地适合其中一种模型。你的
  Saga 也可能同时包含多种风格。例如，在订单履行用例中，在 `Warehouse` 服务的边界内，管理包裹的包装和派送时，我们可能会使用编排流程，即使原始请求是作为更大协作式
  Saga 的一部分发出的。^(5)


  如果你决定混合风格，重要的是你仍然有一种清晰的方式来理解 Saga 的一部分发生了什么。没有这一点，了解故障模式会变得复杂，故障恢复也会变得困难。


  ### 我应该使用协作还是编排？

  实现协作式 Saga 可能会带来你和你的团队不熟悉的想法。它们通常假设大量使用事件驱动的协作，而这并不被广泛理解。然而，根据我的经验，与跟踪 Saga 进度相关的额外复杂性几乎总是被更松散耦合架构带来的好处所抵消。


  撇开我个人的喜好不谈，我关于编排与协作的一般建议是，当一个团队拥有整个 Saga 的实现时，我对使用编排式 Saga 非常宽松。在这种情况下，更内在耦合的架构在团队边界内更容易管理。如果涉及多个团队，我更倾向于更分解的协作式
  Saga，因为它更容易将实现 Saga 的责任分配给团队，而更松散耦合的架构允许这些团队更独立地工作。


  ## Saga 与分布式事务

  正如我希望到现在已经解释清楚的那样，分布式事务带来了一些重大挑战，除了某些非常特定的情况外，我倾向于避免。分布式系统先驱 Pat Helland 总结了为我们今天构建的这类应用程序实现分布式事务的根本挑战：^(6)




  > 在大多数分布式事务系统中，单个节点的故障会导致事务提交停滞。这反过来会导致应用程序卡住。在这种系统中，系统越大，系统宕机的可能性就越大。当飞行一架需要所有发动机都工作的飞机时，增加一台发动机反而会降低飞机的可用性。

  >

  > Pat Helland，超越分布式事务


  在我的经验中，将业务流程显式建模为 Saga 可以避免许多分布式事务的挑战，同时还有额外的好处，即原本可能被隐式建模的流程也能变得更加明确和显而易见，让你的开发者更容易理解。将系统的核心业务流程作为一等概念会带来诸多好处。


  关于编排和编舞实现的更全面讨论，以及各种实现细节，已超出本书范围。它在第 4 章的 *构建微服务* 中有介绍，但我也推荐 *企业集成模式* 来深入了解该主题的许多方面。^(7)


  ## Summary


  因此，正如我们所见，在微服务架构中实现工作流的路径归结为显式建模我们试图实现的过程。这让我们回到了在微服务架构中对业务域各方面进行建模的想法——如果我们的微服务边界也是主要以业务域为定义，那么显式建模业务流程是有意义的。


  无论你更倾向于编排还是编舞，希望你现在能更好地判断哪种模型更适合你的问题空间。


  本章重点关注我们在已将功能拆分为独立微服务之后会发生什么。但如果您已经有一个现有的单体系统怎么办？在下一章中，我们将探讨如何拆分您的单体应用程序并迁移到微服务。


  ^(1) 这现在已经改变，Mongo 4.0 作为一部分发布了多文档 ACID 事务支持。我本人没有使用过 Mongo 的这个功能；我只是知道它存在！


  ^(2) 参见 Martin Kleppmann，*设计数据密集型应用*（Sebastopol，O’Reilly Media, Inc.，2017）。


  ^(3) 参见 Hector Garcia-Molina 和 Kenneth Salem，“Sagas”，载于 *ACM Sigmod Record* 16 卷第
  3 期（1987）：249–259。


  ^(4) 你真的做不到。我试过！


  ^(5) 这超出了本书范围，但 Hector Garcia-Molina 和 Kenneth Salem 进一步探讨了如何将多个 Saga “嵌套”以实现更复杂流程。欲了解更多信息，请参阅
  Hector Garcia-Molina 等人，“Modeling Long-Running Activities as Nested Sagas”，*Data
  Engineering* 14 卷第 1 期（1991 年 3 月：14–18）。


  ^(6) 参见 Pat Helland，“Life Beyond Distributed Transactions”，*acmqueue* 14 卷第 5 期。


  ^(7) Saga 在这两本书中都没有明确提及，但编排和编舞都涵盖了。虽然我无法评价 *企业集成模式* 作者的经验，但我在撰写 *构建微服务* 时本人并不了解
  Saga。


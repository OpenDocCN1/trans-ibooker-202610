    During the structural examination described in this chapter, you have gathered
    a lot of relevant information about the structure of the code. If you have applied
    these exercises not only to the example code snippet in this chapter, but also
    to a code base that you are actually reading, there are a lot of things you can
    do with your newly gained understanding of the code base.


    In many cases, you could commit some of the information you gather back into the
    code base. This information might help you if you decide to explore the code in
    more depth, for example using exercises later in this book, but it might also
    help newcomers after you find their way in the code base. In this section we outline
    some ways in which the gathered information can be useful.


    ## Expand documentation


    While writing documentation might not be your first priority, however, research
    shows that actively processing information you have just learned is a great way
    to store that information in your long time memory. So trying to write a little
    write up of your findings is going to be valuable to you, and it might also be
    valuable to add to the project.


    A useful exercise at this point can be to deliberately simplify the results of
    previous exercises. The results of `Exercise 2.1` and `Exercise 2.2` can serve
    as good starting points for written documentation. Don''t just commit every single
    table with every single entry, but actively think how to summarize it. This is
    both valuable for you, and for the project; committing all results will likely
    be overwhelming for future readers. The simplifying/summarizing will further consolidate
    your understanding.


    ## Improve comments


    Some information that you have found while reading can also be committed to the
    source code itself. The brief text snippets resulting from `Exercise 2.3` could,
    if this information was not yet present in the code, be placed right before a
    method call.


    ## Discuss code quality


    Sometimes while examining the code from a structural perspective, you will find
    parts of the code that have code smells, specifically structural code smells.
    Here are some to look out for.


    ### Note


    Code smells are generally separated into two categories: structural and linguistic.


    Structural code smells are the code smells that come from Fowler''s original book,
    and refer to the way code is organized. Examples of such smells are `Message chains`
    in which methods call other methods, which in turn call other methods etc, `long
    parameter lists` or `large classes`.


    The other type of code smells are linguistic code smells as defined by Venera
    Arnaoudova. Linguistic code smells refer to names of variables or classes that
    do not aptly describe what they do. That can be vague names such as `fetch` or
    names that omit part of the functionality, such as a conversion method that converts
    but also stores information about the conversion in the database.


    ### Size


    Looking at the sizes of objects alone can already reveal bloated classes, data
    classes or very small classes. The analysis of size you performed in `Exercise
    2.1` can point you to this particular code smell.


    These findings can serve as a great conversation starter with your team to talk
    about code history and code quality. Here are some questions to consider based
    on this analysis:


    *   Is there a reason these classes are large, small or only contain data?

    *   Is this a historical reason or is there a good justification for the size
    of the classes?


    ### Smells in Relationships


    Other code smells pertaining to object components are `inappropriate intimacy`
    and `feature envy`, which both point to two or more classes that have too much
    interaction to be useful. You can detect these code smells by looking at the table
    that you created in `Exercise 2.2` and examining if there exists a number of classes
    that often work on each other''s fields (`inappropriate intimacy`) or one that
    very often class fields or classes of another (`feature envy`). Again, there might
    be good reasons for this design, but it is something to discuss, for example:


    *   Do we understand why these classes are intimately related?

    *   Are there alternative ways in which the classes could be organized?


    ### Smells in Functional Components


    The smells above concerned object components, but there are also code smells of
    functional components that can be found with structural analysis. For example,
    the results of `Exercise 2.2` is a `message chain`. Start at an entry point in
    the table and follow the functional components it calls, and then the functional
    components that that component calls, etc. If you have to make a large number
    of `hops` in the table, that indicates the presence of a `message chain`. Now,
    `message chains` are not necessarily bad, however, if you find one you can discuss
    whether:


    *   Some of the methods on the path are so small they could be merged?

    *   There are specific scenarios in the code that call long chains that could
    be solved differently, for example with caching or early returns?


    Another smell which can be found with structural analysis is `dead code`. Are
    there any methods that are not called at all? These might represent `dead code`.
    Be sure to also examine alternative ways in which `dead code` might be used, such
    as calls from the test suite for example, or from other parts of the code base.
    This is especially relevant in multi-lingual code bases in which static source
    code analysis might not always find dependencies.


    ## Refactor


    When you find code that has code smells using structural analysis, sometimes you
    will want to improve the code. If you decide to do a refactor, the analysis that
    you performed so far can also guide the refactorings.


    ### Large Class


    If you find large classes in the size analysis, these classes could be split up.
    A relationship table like the one you created in `Exercise 2.2` can help you find
    groups of methods that call each other. If two or three subgroups exist in these
    methods, the large class could be split into those subgroups without causing too
    many dependencies between the new classes.


    ### Small Class


    On the other hand, if you find small classes in your analysis, you might want
    to merge them into another class. The relationship table like the one you created
    in `Exercise 2.2` can help you decide which class would be a good home for the
    small number of fields and methods in the small class. Ideally this would be a
    class with which this small class shares the most fields and methods.


    ### Data Class


    For a `data class` (a class that has a lot of fields but no or hardly any methods)
    a similar analysis can be made; this class could be merged with a class that often
    accessed the fields of the `data class`. If there is no such class, maybe the
    code


    ### Long Parameter List


    In some cases, you will find methods or functions with long parameter lists. These
    can be found in `Exercise 2.3` as lines with a lot of `Xs`. In the case of methods
    on a class, these long parameter lists might be shortened by moving some of the
    parameters to be fields on the class. In functions or methods, you might group
    some of the parameters into larger objects. For example, a function that has `x`,
    `y` and `z` as parameters might be refactored into a function that uses just the
    `point` data type, which then contains `x`, `y` and `z` fields.


    ### One Call Functions


    In `Exercise 2.3` you might have identified methods that are only called in one
    place. This is not necessarily a smell as defined by Fowler, however such organization
    might point to premature generalization where an abstraction is introduced that
    is not used (yet). While this might be worth it in some cases, it will also cause
    the editor to `hop` when reading and debugging, causing more cognitive load because
    your brain has to reorient itself. These methods might be inlined reducing that
    cognitive load, at the expense of making the method in which the method or function
    is inlined longer.


    ### Dead Code

    '
  trans: '

    在本章所述的结构检查过程中，你已经收集了大量关于代码结构的相关信息。如果你不仅将这些练习应用于本章的示例代码片段，还应用于你正在阅读的实际代码库，那么凭借你新获得的对代码库的理解，你可以做很多事情。


    在许多情况下，你可以将收集到的部分信息提交回代码库。如果你决定更深入地探索代码（例如使用本书后面的练习），这些信息可能会对你有帮助，但它也可能帮助你之后的新人熟悉代码库。在本节中，我们将概述收集到的信息可能发挥作用的一些方式。


    ## 扩展文档


    虽然编写文档可能不是你的首要任务，但研究表明，主动处理刚学到的信息是将其存储在长期记忆中的好方法。因此，尝试写一小篇关于你发现的总结对你来说很有价值，添加到项目中可能也很有价值。


    此时一个有用的练习是刻意简化前几个练习的结果。`Exercise 2.1` 和 `Exercise 2.2` 的结果可以作为书面文档的良好起点。不要只是提交每一个包含所有条目的表格，而要主动思考如何对其进行总结。这对你和项目都很有价值；提交所有结果可能会让未来的读者感到不知所措。简化/总结的过程将进一步巩固你的理解。


    ## 改进注释


    阅读过程中发现的一些信息也可以提交到源代码本身。如果代码中尚无此信息，`Exercise 2.3` 产生的简短文本片段可以直接放在方法调用之前。


    ## 讨论代码质量


    有时在从结构角度检查代码时，你会发现代码中存在代码异味，具体来说是结构性代码异味。以下是一些需要留意的类型。


    ### 注意


    代码异味通常分为两类：结构性和语言性。


    结构性代码异味源自 Fowler 的原著，指的是代码组织方式。例如 `Message chains`（消息链），即方法调用其他方法，后者又调用其他方法等，`long
    parameter lists`（长参数列表）或 `large classes`（大类）。


    另一类代码异味是 Venera Arnaoudova 定义的语言性代码异味。语言性代码异味指变量或类的名称不能恰当地描述其功能。这可能是模糊的名称，如 `fetch`，或者遗漏了部分功能的名称，例如一个转换方法既执行转换，又将转换信息存储在数据库中。


    ### 规模


    仅查看对象的规模就能揭示膨胀的类、数据类或非常小的类。你在 `Exercise 2.1` 中执行的规模分析可以指向这一特定的代码异味。


    这些发现可以作为与团队讨论代码历史和代码质量的绝佳切入点。以下是基于此分析需要考虑的一些问题：


    *   这些类规模大、小或仅包含数据是否有原因？

    *   这是历史原因，还是类的规模有合理的理由？


    ### 关系中的异味


    涉及对象组件的其他代码异味是 `inappropriate intimacy`（不合理的亲密性）和 `feature envy`（特性依恋），两者都指向两个或多个类之间存在过多的交互而不利于解耦。你可以通过查看在
    `Exercise 2.2` 中创建的表格来检测这些代码异味，检查是否存在多个类经常操作彼此的字段（`inappropriate intimacy`），或者一个类非常频繁地访问另一个类的字段或方法（`feature
    envy`）。同样，这种设计可能有合理的理由，但这值得讨论，例如：


    *   我们是否理解这些类为何如此紧密相关？

    *   是否有其他组织这些类的替代方式？


    ### 功能组件中的异味


    上述异味涉及对象组件，但也存在可以通过结构分析发现的功能组件代码异味。例如，`Exercise 2.2` 的结果是一个 `message chain`。从表格中的一个入口点开始，跟随它调用的功能组件，然后是该组件调用的功能组件，以此类推。如果你必须在表格中进行大量
    `hops`（跳转），则表明存在 `message chain`。现在，`message chains` 不一定是坏事，但是，如果你发现了一个，可以讨论是否：


    *   路径上的某些方法是否小到可以合并？

    *   代码中是否存在调用长链的特定场景，可以用不同方式解决，例如使用缓存或提前返回？


    另一个可以通过结构分析发现的异味是 `dead code`（死代码）。是否有完全未被调用的方法？这些可能代表 `dead code`。请务必检查 `dead
    code` 可能被使用的其他方式，例如来自测试套件的调用，或来自代码库其他部分的调用。这在多语言代码库中尤为重要，因为静态源代码分析可能并不总能找到依赖关系。


    ## 重构


    当你使用结构分析发现存在代码异味的代码时，有时你会想要改进代码。如果你决定进行重构，迄今为止你执行的分析也可以指导重构工作。


    ### 大类


    如果在规模分析中发现大类，这些类可以被拆分。像 `Exercise 2.2` 中创建的关系表可以帮助你找到相互调用的方法组。如果这些方法中存在两三个子组，则可以将大类拆分为这些子组，而不会导致新类之间产生过多依赖。


    ### 小类


    另一方面，如果在分析中发现小类，你可能想将它们合并到另一个类中。像 `Exercise 2.2` 中创建的关系表可以帮助你决定哪个类适合作为小类中少量字段和方法的归宿。理想情况下，这应该是一个与该小类共享最多字段和方法的类。


    ### 数据类


    对于 `data class`（拥有大量字段但没有或几乎没有方法的类），可以进行类似的分析；该类可以与经常访问 `data class` 字段的类合并。如果不存在这样的类，也许代码


    ### 长参数列表


    在某些情况下，你会发现带有长参数列表的方法或函数。这些可以在 `Exercise 2.3` 中作为包含大量 `Xs` 的行找到。对于类上的方法，可以通过将某些参数移至类的字段来缩短这些长参数列表。对于函数或方法，你可以将某些参数分组为更大的对象。例如，一个以
    `x`、`y` 和 `z` 为参数的函数可以重构为仅使用 `point` 数据类型的函数，后者包含 `x`、`y` 和 `z` 字段。


    ### 单调用函数


    在 `Exercise 2.3` 中，你可能识别出了仅在一处被调用的方法。这不一定是 Fowler 定义的异味，然而这种组织可能指向过早泛化，即引入了一个尚未被使用的抽象。虽然在某些情况下这可能值得，但它也会导致编辑器在阅读和调试时
    `hop`（跳转），因为大脑必须重新定向，从而增加认知负荷。这些方法可以内联以减少认知负荷，代价是使内联该方法或函数的方法变长。


    ### 死代码


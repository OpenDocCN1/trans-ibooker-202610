    If you found dead code in examining the relationships in the code, you might want
    to remove that dead code when you have verified it is indeed no longer needed.


    ## Summary


    Code can be read in different dimensions: structure, domain, concepts, context,
    and collaboration. This chapter explored the structural dimension and looked at
    how variables, functions and objects in code can relate to each other, and how
    that information can be used while reading code. The following chapter explores
    domain.


    ^([1](#ch01.html#id134-marker)) See “Eye Movements in Code Reading: Relaxing the
    Linear Order” by Teresa Busjahn et al. (2015), https://ieeexplore.ieee.org/document/7181454.


    ^([2](#ch01.html#id136-marker)) See for example: https://medium.com/nerd-for-tech/how-to-generate-uml-diagrams-from-your-existing-code-814d27bd1537


    ^([3](#ch01.html#id137-marker)) https://www.sciencedirect.com/science/article/pii/S1045926X02902375&sa=D&source=docs&ust=1658912480042497&usg=AOvVaw3mvAJmKBMgrgVt4HM9Ez13


    # Chapter 2. Understanding the Business Domain of Your Code in More Depth


    The previous chapter examined relationships in code, without diving into the content
    of the code in depth. This chapter will do the reverse and examine the content
    of the code without looking at the way it is connected. We will specifically look
    at terms and concepts within the business domain of the code, in other words,
    the real-world problem that the code is solving.


    When you are reading unfamiliar information such as unfamiliar code, your brain
    will be engaging in a lot of different activities at the same time. You are trying
    to *understand* the structure, how it all relates to each other using your working
    memory. In the previous chapter we have learned techniques to support your working
    memory in examining relationships.


    But you will also be *remembering* information that you have already stored in
    your long-term memory. Doing these things in parallel is very energy consuming
    and will make it harder to understand code. It is therefore important to concentrate
    on the domain concepts in an unfamiliar code snippet and verify there is no confusion
    there, before you engage in more complex activities like debugging or reviewing.


    This chapter will not be useful for all code reading purposes. If you are working
    with a code base of which the domain is very familiar to you, for example because
    you have been working in a certain field, like insurance or pensions for a long
    time, the domain concepts will not be overwhelming for your brain. But if you
    are just getting used to a new code base for a new customer or if you are trying
    to get to know a new open source project that uses new terms, examining and learning
    domain concepts from code will greatly ease further engagement with the code.


    Therefore, this chapter solely examines the business domain concepts present in
    the code. With domain here we refer to the business domain or problem of the code.
    The programming domain will be covered in Chapter 4. Examining the domain concepts
    is useful because if you miss a thorough understanding of what words in the code
    mean precisely, it will be hard to understand the code as a whole. This relates
    to your long-term memory, as discussed in Chapter 2: if you do not have some prior
    understanding, remembering and analyzing code will be a lot harder than needed.


    Variable and method or function names can be great sources of information about
    the domain aspects of code, since they will very often contain words used in the
    domain. In his book *Patterns of Enterprise Application Architecture*, Martin
    Fowler describes a domain model as having two components: behavior and data.^([1](#ch02.html#id139))
    Words that occur in variables often point to either data or behavior: verbs will
    often refer to behaviour, while nouns refer to objects. So in a sense, in this
    chapter you will be looking at objects and their functionality, but you will gather
    the information from names rather than from the structure of the code.


    The exercises and techniques in this chapter thus focus only on the domain aspects
    of code, helping you answer questions like: What are the central domain concepts
    in this code base and how do they relate to each other?


    At the end of the chapter, you will know X techniques to be applied to more deeply
    understand the domain of a codebase:


    *   List all variable names

    *   Identify different parts of variable names

    *   Look at name molds


    ## Running example


    As in the previous chapter, we will use one example code snippet in this chapter.
    Don’t worry if it looks entirely overwhelming! We will go through it step by step.


    ### Example code: Bracket colorization in the Monaco Editor

    '

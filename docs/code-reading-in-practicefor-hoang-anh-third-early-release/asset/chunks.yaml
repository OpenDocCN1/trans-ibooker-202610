    are used in the code. While writing this exercise, I realized that in the Hedy
    code base we sometimes say `parse tree`, but also use `tree` in other places.
    While that might be very clear to the code team, using synonyms can be confusing
    for newcomers. And using synonyms can even impact experienced developers negatively,
    for example by hampering searchability, since looking for "parse tree" will not
    reveal locations of "tree" in the code.


    # After reading


    ## Exercise 3.5: Describe concepts


    Now is a good time to reexamine the concepts that you have gathered from the names
    in Exercise 3.2. Do you understand enough about the domain to describe the meaning
    of each concept? If not, describe this in the meaning column so you can go back
    to this list later when you have gathered more information.


    | Concept | Meaning |

    | --- | --- |

    | `Bracket` | One bracket, can be unexpected if a closing bracket |

    | `Bracket Pair` | Two brackets is code belonging together, should get the same
    color in the editor |

    | … |  |

    |  |  |

    |  |  |


    ## Enrich domain understanding


    Once you have investigated the code and made an effort to understand the domain
    concepts from the code itself, it can be very valuable to enrich your knowledge
    in two ways.


    Firstly, you can direct your attention outside of the codebase. Depending on your
    context, this might be a deep dive into the documentation trying to obtain more
    information about the concepts that you have found in an open source project,
    or a session with an experienced colleague within a company. In both cases, you
    are looking to gather more depth in your understanding of the concepts that you
    have just learned about. A great exercise is to double check your findings from
    exercises 3.2 and 3.4. Can you verify that the meaning and synonyms from exercise
    3.6a are correct, and that the datatype from exercise 3.6b are correct?


    Secondly, after expanding your knowledge of all domain concepts with information
    outside of the code base, a second way to deepen understanding is to reread the
    code. Now is a great moment to let go of the small focus on the names in the code,
    and read the code as a whole again. Because your knowledge is now expanded, you
    will certainly pick up on new things in the code that did not occur to you before.


    ## Expand documentation


    Some of the information about domain concepts and behaviour can serve as excellent
    documentation to add to a readme file. In particular, you have explored a lot
    of important concepts in the code, and these might not live somewhere in a documentation
    file yet. In a sense, you might have been starting to document the `Ubiquitous
    Language` of the project.


    ### Ubiquitous Language


    Eric Evans coined the term `Ubiquitous Language` in his Domain Driven Design book.
    With the ubiquitous language, Evan denotes a language that developers and users
    of software systems share. Often this language only partially emerges naturally
    and parts of it will need to be deliberately designed. Evans states that the `Ubiquitous
    Language` should be based on the Domain Model used in the software since natural
    language concepts tend to be imprecise.


    The information that you have gathered so far could be converted into documentation.
    The lists of concepts that you created in exercises 3.6a and 3.6b can serve as
    starting points for a list of domain concepts. From there, you can expand, for
    example by:


    *   Ensuring that all abbreviations or acronyms in variable or function names
    are either replaced by full words, or if people prefer keeping them, documented

    *   Describing domain objects that felt similar to you but turned out to be different.
    If they are not exactly the same but there are reasons that they look similar,
    such as similar names or similar behaviour, other people might be confused too.
    Documenting how these concepts differ subtly can be very useful

    *   Discussing these lists with users. Do they recognize and understand all concepts?
    What concepts are missing and are they maybe missing or represented in other ways?

    *   If you work a context where DDD is practiced and a `Ubiquitous Language` is
    used, you can check whether the list of your concepts is similar to the documentation
    of the `Ubiquitous Language` that already exists.


    Furthermore, you will likely find some names that do not exactly describe the
    functionality of code, such as `analyze()`, `convert()`, or `process()`. While
    reading the code, you might have found a deeper understanding of those words,
    based on examining the call trace of the function, variable names in the function
    or comments. You might be able to commit to the documentation, specifically the
    `docstrings` of these functions to aid future readers.


    ## Discuss code quality


    While examining the code from the domain perspective, you might find parts of
    the code that have code smells, specifically linguistic code smells, which are
    code smells relating to the naming of objects, functions, methods or variables.
    Your domain findings can serve as a great conversation starter with your team
    to talk about naming quality.


    **Similar objects**


    Your domain analysis might point to objects that seem very similar. Apart from
    documenting the differences, as explained above, you might also want to dive deeper
    into the reasons that the code is like it is, for example by discussing:


    *   Are these domain concepts truly synonyms or are they different, and if so,
    how?

    *   Are there historical reasons for the similarities? Sometimes when a new product
    or process is introduced, it comes with its own objects since the author might
    not be aware of places in the code where it could fit.


    **Linguistic code smells**


    Chapter 2 discussed two different code smells: structural smells as described
    by Fowler, and linguistic code smells as defined by Arnaoudova. Since this chapter
    focuses on domain concepts, it makes sense to evaluate the quality of the names
    in terms of smells. You can focus on specific types of linguistic smells, which
    Arnaudova distinguished between in her work, three for functions/methods and three
    for identifiers.


    *   Methods that do more than they say

    *   Methods that say more than they do

    *   Methods that do the opposite of what they say

    *   Identifiers whose names say that they contain more than what the entity contains

    *   Identifiers whose names say that they contain less than what the entity contains

    *   Identifiers whose names say the opposite of what the entity contains

    '
  trans: '

    让我们首先关注代码中存在的概念。从概念列表开始，判断你是否能用自己的话解释领域概念的含义。


    如果不能，阅读更多代码可能不是最好的下一步。相反，你可能想通过询问队友或其他贡献者，或阅读注释和文档，从其他来源收集更多关于这些概念的信息。


    尤其有价值的是，还要调查你是否怀疑代码中使用了同义词。在编写这个练习时，我意识到在 Hedy 代码库中，我们有时说 `parse tree`，但在其他地方也使用
    `tree`。虽然这对代码团队来说可能非常清楚，但使用同义词会让新手感到困惑。甚至使用同义词还会对经验丰富的开发人员产生负面影响，例如妨碍可搜索性，因为查找
    "parse tree" 无法找到代码中 "tree" 的位置。


    # 读后


    ## 练习 3.5：描述概念


    现在是重新审视你在练习 3.2 中从名称中收集到的概念的好时机。你是否足够了解该领域，以描述每个概念的含义？如果不，请在含义列中描述这一点，以便稍后在收集到更多信息时回到此列表。


    | Concept | Meaning |

    | --- | --- |

    | `Bracket` | 一个括号，如果是右括号可能会出乎意料 |

    | `Bracket Pair` | 两个括号是属于一起的代码，在编辑器中应获得相同的颜色 |

    | … |  |

    |  |  |

    |  |  |


    ## 丰富领域理解


    一旦你调查了代码并努力从代码本身理解领域概念，用两种方式丰富你的知识将非常有价值。


    首先，你可以将注意力转向代码库之外。根据你的上下文，这可能是深入文档以获取关于你在开源项目中发现的概念的更多信息，或者是与公司内部经验丰富的同事进行一次会议。在这两种情况下，你都是在寻求加深对刚刚了解的概念的理解。一个很好的练习是复查练习
    3.2 和 3.4 的发现。你能验证练习 3.6a 中的含义和同义词是否正确，以及练习 3.6b 中的数据类型是否正确吗？


    其次，在利用代码库外部的信息扩展了所有领域概念的知识后，加深理解的第二种方法是重读代码。现在是放弃对代码中名称的狭隘关注、整体重读代码的大好时机。因为你的知识现在扩展了，你一定会注意到代码中之前未曾注意到的新事物。


    ## 扩展文档


    关于领域概念和行为的一些信息可以作为添加到 readme 文件中的优秀文档。特别是，你已经探索了代码中许多重要概念，这些概念可能尚未存在于任何文档文件中。在某种意义上，你可能已经开始记录项目的
    `Ubiquitous Language`（通用语言）。


    ### 通用语言


    Eric Evans 在其《领域驱动设计》一书中创造了 `Ubiquitous Language`（通用语言）一词。Evans 用通用语言指代开发人员和软件系统用户共享的语言。这种语言通常只有一部分自然产生，部分需要刻意设计。Evans
    指出，`Ubiquitous Language` 应基于软件中使用的领域模型，因为自然语言概念往往不够精确。


    你迄今收集的信息可以转化为文档。你在练习 3.6a 和 3.6b 中创建的概念列表可以作为领域概念列表的起点。从那里，你可以扩展，例如通过：


    *   确保变量或函数名中的所有缩写或首字母缩略词要么被完整单词替代，要么如果人们倾向于保留它们，则进行记录

    *   描述那些让你感觉相似但实际不同的领域对象。如果它们不完全相同但有看起来相似的原因，例如相似的名称或相似的行为，其他人也可能会感到困惑。记录这些概念的细微差别非常有用

    *   与用户讨论这些列表。他们能识别并理解所有概念吗？缺少什么概念？它们是否可能缺失或以其他方式表示？

    *   如果你在一个实践 DDD 并使用 `Ubiquitous Language` 的环境中工作，你可以检查你的概念列表是否与现有的 `Ubiquitous
    Language` 文档相似。


    此外，你可能会发现一些名称不能准确描述代码功能，例如 `analyze()`、`convert()` 或 `process()`。在阅读代码时，你可能通过检查函数的调用跟踪、函数中的变量名或注释，对这些词有了更深入的理解。你或许可以致力于完善文档，特别是这些函数的
    `docstrings`（文档字符串），以帮助未来的读者。


    ## 讨论代码质量


    在从领域角度审视代码时，你可能会发现代码中存在代码异味的部分，具体来说是语言学代码异味，即与对象、函数、方法或变量命名相关的代码异味。你的领域发现可以作为与团队讨论命名质量的绝佳切入点。


    **相似对象**


    你的领域分析可能指向看起来非常相似的对象。除了记录差异（如上所述），你可能还想深入探究代码如此的原因，例如通过讨论：


    *   这些领域概念真的是同义词还是不同的？如果不同，有何不同？

    *   相似性是否有历史原因？有时引入新产品或流程时，会带来自己的对象，因为作者可能不知道代码中哪些地方适合它。


    **语言学代码异味**


    第 2 章讨论了两种不同的代码异味：Fowler 描述的结构性异味，以及 Arnaoudova 定义的语言学代码异味。既然本章关注领域概念，按异味评估名称质量是合理的。你可以关注特定类型的语言学异味，Arnaoudova
    在其著作中将其区分为函数/方法三种和标识符三种。


    *   做得比说得多的方法

    *   说得比做得多的方法

    *   做与说相反的方法

    *   名称暗示包含内容多于实体实际包含内容的标识符

    *   名称暗示包含内容少于实体实际包含内容的标识符

    *   名称暗示内容与实体实际包含内容相反的标识符

    '

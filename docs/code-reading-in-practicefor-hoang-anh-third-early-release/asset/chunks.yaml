    \  |\n\n当代码库组织良好时，名称可以让你对代码在做什么有可靠的理解。像 `passwordHashed` 这样的名称清楚地表明正在对密码执行哈希操作。不过，通常从名称中识别概念需要对领域有理解。例如，考虑\
    \ Lark 代码片段的前几行。让我们看看这段代码片段顶部的变量 `Branch`：\n\n```\nBranch = Union[Tree[str], str]\n\
    TreeOrCode = Union[Tree[str], str]\nMatchResult = Dict[str, Tree]\n_TEMPLATE_MARKER\
    \ = '$'\n```\n\n名称 `Branch` 本身可以指代编程中已知的几个概念，对于许多开发人员来说，他们可能想到的第一个 *branch* 是像\

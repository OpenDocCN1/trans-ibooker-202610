    ## Examining the structure


    After a thorough examination of the MR, it is time to dig into the files. You
    can use what you learned in chapter 2 to understand the structure of the new version
    of the code.


    ### Exercise 11.2: List all components


    **Object components**


    | Component name | Lines of Code | Size (small/medium/large) |

    | --- | --- | --- |

    | `AsyncDaemonHealthCheckExtensions` | 97 | small |


    **Functional components**


    | Method/function name | Lines of Code | Size (small/medium/large) |


    \ mapping\n               template variable names to their matching tree nodes.\n\
    \               If no match was found, returns None.\n       \"\"\"\n       tree\
    \ = self.conf._get_tree(tree)\n       return self.conf._match_tree_template(self.tree,\
    \ tree)\n\n   def search(self, tree: TreeOrCode):\n       \"\"\"Search for all\
    \ occurances of the tree template inside ``tree``.\n       \"\"\"\n       tree\
    \ = self.conf._get_tree(tree)\n       for subtree in tree.iter_subtrees():\n \
    \          res = self.match(subtree)\n           if res:\n               yield\
    \ subtree, res\n\n   def apply_vars(self, vars: Mapping[str, Tree]):\n       \"\
    \"\"Apply vars to the template tree\n       \"\"\"\n       return _ReplaceVars(self.conf,\
    \ vars).transform(self.tree)\n\n\ndef translate(t1: Template, t2: Template, tree:\
    \ TreeOrCode):\n   \"\"\"Search tree and translate each occurrence of t1 into\
    \ t2.\n   \"\"\"\n   tree = t1.conf._get_tree(tree)      # ensure it's a tree,\
    \ parse if necessary and possible\n   for subtree, vars in t1.search(tree):\n\
    \       res = t2.apply_vars(vars)\n       subtree.set(res.data, res.children)\n\
    \   return tree\n\n\nclass TemplateTranslator:\n   \"\"\"Utility class for translating\
    \ a collection of patterns\n   \"\"\"\n\n   def __init__(self, translations: Mapping[TreeOrCode,\
    \ TreeOrCode]):\n       assert all(isinstance(k, Template) and isinstance(v, Template)\
    \ for k, v in translations.items())\n       self.translations = translations\n\
    \n   def translate(self, tree: Tree):\n       for k, v in self.translations.items():\n\
    \           tree = translate(k, v, tree)\n       return tree\n```\n\n## Context\n\

    ## 检查结构


    在对 MR 进行彻底检查后，是时候深入研究文件了。你可以利用第 2 章所学的知识来理解代码新版本的结构。


    ### 练习 11.2：列出所有组件


    **对象组件**


    | 组件名称 | 代码行数 | 大小（小/中/大） |


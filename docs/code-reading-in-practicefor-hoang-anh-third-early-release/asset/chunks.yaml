- raw: "Identifying these code smells is most easily done by starting with the tables\
    \ you made for exercises 3.1 and 3.3 and comparing the two sources where you can\
    \ learn about types. Firstly, the types you can gather from the names (such as\
    \ find\\_id, which indicates an id, maybe a string or integer will be returned)\
    \ versus the names the function definitions define (such as int find\\_id()).\
    \ Of course this will be a lot different in static languages versus in dynamic\
    \ ones. Exercise 3.6 can help you to compare these two sources.\n\n### Exercise\
    \ 3.6 Examine types of identifiers and functions/methods\n\nFor this exercise,\
    \ examine your lists of identifiers and function/methods in the codebase that\
    \ you created in exercises 3.1 and 3.3. For each of the identifiers and function/methods\
    \ identify the type expected based on the name and the type determined by reading\
    \ the code or gathering information from other sources. If you have done exercise\
    \ 2.3 where you describe dependency between methods, that table might also support\
    \ your understanding of the role and output value of methods.\n\nFor now, try\
    \ to focus on the output values of the code, for example by looking at the locations\
    \ of the return keyword or the final lines. At this stage of code reading, you\
    \ are specifically interested in the naming dimensions, not yet in deeper reading,\
    \ to avoid overloading your working memory.\n\n| Identifier name || Type expected\
    \ based on name || Type gathered from reading code |\n\n| --- | --- | --- |\n\n\
    | *keywords\\_requiring\\_indentation* ||   ||   |\n\n| --- | --- | --- |\n\n\
    | *imported\\_product* ||   ||   |\n\n| *…* ||   ||   |\n\n| *Function or method\
    \ name* ||   ||   |\n\n| *process\\_input\\_string* ||   ||   |\n\n| *check\\\
    _program\\_size\\_is\\_valid* ||   ||   |\n\n| *…* ||   ||   |\n\n# Check for\
    \ linguistic smells automatically\n\nAre you curious about whether your codebase\
    \ suffers from linguistic antipatterns? Is your codebase written in Java? In that\
    \ case you can evaluate smells automatically with the Linguistic Anti-Pattern\
    \ Detector (LAPD) that Arnaoudova created based on her research. LAPD is available\
    \ as an extension of Eclipse Checkstyle plugin.^([2](#ch02.html#id140))\n\nName\
    \ molds\n\n: \n\nName molds are patterns in which elements in a variable name\
    \ are typically combined (see further breakout box) and form are a great dimension\
    \ for examining code quality. Using many different name molds in a code base makes\
    \ the code unnecessarily hard to read. If you want to examine the name molds in\
    \ your code base, you have already done some partial work in exercise 3.2 where\
    \ you listed the names and their word/domain parts. You can now expand this table\
    \ in the next exercise to detect different molds.\n\n### Exercise 3.7 Examine\
    \ name molds\n\nExamine the names of the identifiers in the code base and determine\
    \ the order in which the elements appear, as illustrated by the examples. I distinguish\
    \ verbs, nouns, adjectives, and quantifiers here, but you might want to add your\
    \ own categories where that makes sense, such as acronyms (EBIT) or filters (monthly,\
    \ per customer).\n\nHow many different orders of words can you find? It is also\
    \ interesting to discuss patterns that arise. Are the orders or words similar\
    \ locally or globally, i.e. does one method have a lot of one mold while another\
    \ method uses a different one?\n\n| Variable name || Elements || Order |\n\n|\
    \ --- | --- | --- |\n\n| *keywords\\_requiring\\_indentation* || *keyword, requiring,\
    \ indentation* || *noun, verb, noun* |\n\n| --- | --- | --- |\n\n| *imported\\\
    _product* || *imported, product* || *adjective, noun* |\n\n| *minimum\\_distance*\
    \ || *minimum, distance* || *quantifier, noun* |\n\n|   ||   ||   |\n\n|   ||\
    \   ||   |\n\n|   ||   ||   |\n\n###### Note\n\nName molds^([3](#ch02.html#id141))\
    \ are patterns in which elements in a variable name are typically combined. For\
    \ example, when a name was needed for the maximal benefits someone can\n\nreceive\
    \ per month, you could choose max\\_benefit, or max\\_benefit\\_per\\_month, or\
    \ max\\_benefit\\_num. Each of these contains the same domain concepts, but expressed\
    \ in different ways. Feitelson ran an experiment with 47 developers which showed\
    \ that the probability that two developers select the same name is low: the median\
    \ probability in the study was only 7%! And diverse variable names put more strain\
    \ on your working memory since you will have to search for the relevant parts\
    \ in different places each time.\n\n## Refactor\n\nIf you want to use the findings\
    \ of this chapter to improve your code base, there are a number of refactorings\
    \ that you can consider, partly also based on the quality issues from section\
    \ 3.4.2.\n\nSimilar sounding objects\n\n: \n\nIn some cases, similar sounding\
    \ objects may warrant a code change. Here are a couple questions to ask:\n\n*\
    \   If they are genuinely different, can you rename one to minimize overlap and\
    \ confusion?\n\n*   If they are the same, can they be merged into one object sharing\
    \ some of the similarities?\n\nVague-sounding names\n\n: \n\nYou will likely find\
    \ some names that do not exactly describe the functionality of code, such as analyze,\
    \ convert. What could be a more precise name for vague names like process()?\n\
    \nSmelly names\n\n: \n\nIf you identified names which do not fully match their\
    \ implementation in exercise 3.9, you might want to rename the method or identifiers\
    \ to be more precise. You may also want to discuss their implementation with someone\
    \ more familiar with the code base, to determine why the name does not match the\
    \ implementation. In some cases a change to the implementation might be better\
    \ than a change to the name. For example, when you have a method called return\
    \ name\\_and\\_id which only returns an id, which is then used in several places\
    \ to later fetch a name, it might be better to actually return the name and the\
    \ id and refactor the code to centralize fetching the name.\n\n# Summary\n\nCode\
    \ can be read in different dimensions: structure, domain, concepts, context, and\
    \ collaboration. This chapter explored the domain dimension and looked at how\
    \ variables, functions and objects are named, what you can learn from the names\
    \ and how names can be used to understand and improve code quality. The following\
    \ chapter explores programming concepts.\n\n^([1](#ch02.html#id139-marker)) https://martinfowler.com/books/eaa.html\n\
    \n^([2](#ch02.html#id140-marker)) http://www.veneraarnaoudova.ca/linguistic-anti-pattern-detector-lapd/\n\
    \n^([3](#ch02.html#id141-marker)) Dror G. Fietelson et al., [“How Developers Choose\
    \ Names”](https://www.cs.huji.ac.il/w~feit/papers/Names22TSE.pdf)\n\n# Chapter\
    \ 3. Conceptual Examination\n\nIn the previous chapters, you examined relationships\
    \ in code, without diving into the content of the code in-depth, and you studied\
    \ the variable names in isolation without looking at the structure, giving you\
    \ two different lenses through which to read code.\n\nThis chapter will bring\
    \ both techniques together as you examine the programming concepts present in\
    \ the code. Concepts often manifest in two ways; they are either clearly written\
    \ into the names, for example in a name like customerArray, or they can be determined\
    \ from the structure of the code, for example in a code snippet like this:\n\n\
    ```\nforeach (customer in customers)\n{\n    customer.free_account();\n}\n```\n\
    \nYou can also find information about programming concepts by looking at types\
    \ and imports, or by looking at specific syntactic elements that are connected\
    \ to concepts, like \\* for pointers and . for objects.\n\nDeeply understanding\
    \ the programming concepts used in a piece of code is useful because it will help\
    \ you mentally process the code better, and will help you to understand what prior\
    \ knowledge you might be missing.\n\nThe exercises and techniques in this chapter\
    \ focus on the conceptual aspects of code, helping you answer questions like:\
    \ What are the important programming concepts in this code base, and how do they\
    \ relate to the domain and to the structure of the code?\n\n# Running example"
  fmt: "\n识别这些代码异味最简单的方法是从练习 3.1 和 3.3 制作的表格入手，对比两个可以了解类型的来源。首先，从名称中收集的类型（如 `find_id`，表明返回一个\
    \ id，可能是字符串或整数）与函数定义中定义的名称类型（如 `int find_id()`）进行对比。当然，在静态语言与动态语言中这会有很大不同。练习 3.6\
    \ 可以帮助你对比这两个来源。\n\n### 练习 3.6 检查标识符和函数/方法的类型\n\n在该练习中，检查你在练习 3.1 和 3.3 中创建的代码库中的标识符列表和函数/方法列表。对于每个标识符和函数/方法，根据名称识别预期类型，并通过阅读代码或从其他来源收集信息确定实际类型。如果你完成了练习\
    \ 2.3（描述方法间的依赖关系），该表格也可能有助于你理解方法的角色和输出值。\n\n目前，尝试关注代码的输出值，例如查看 `return` 关键字的位置或最后几行代码。在这个代码阅读阶段，你特别关注命名维度，而非深度阅读，以避免工作记忆过载。\n\
    \n| 标识符名称 | 基于名称预期的类型 | 从代码阅读收集的类型 |\n| --- | --- | --- |\n| `keywords_requiring_indentation`\
    \ |  |  |\n| `imported_product` |  |  |\n| `…` |  |  |\n| 函数或方法名称 |  |  |\n| `process_input_string`\
    \ |  |  |\n| `check_program_size_is_valid` |  |  |\n| `…` |  |  |\n\n# 自动检查语言异味\n\
    \n你是否好奇代码库是否存在语言反模式？代码库是用 Java 编写的吗？如果是，你可以使用 Arnaoudova 基于研究创建的语言反模式检测器（LAPD）自动评估异味。LAPD\
    \ 作为 Eclipse Checkstyle 插件的扩展可用。^([2](#ch02.html#id140))\n\n## 命名模式\n\n命名模式是变量名中元素通常组合的模式（详见后文突出框），是检查代码质量的一个重要维度。在代码库中使用许多不同的命名模式会使代码不必要地难以阅读。如果你想检查代码库中的命名模式，你已经在练习\
    \ 3.2 中完成了部分工作，当时你列出了名称及其单词/领域部分。现在你可以在下一个练习中扩展此表以检测不同的模式。\n\n### 练习 3.7 检查命名模式\n\
    \n检查代码库中标识符的名称，确定元素出现的顺序，如示例所示。这里我区分动词、名词、形容词和量词，但你可能想添加自己的类别，如首字母缩略词（EBIT）或过滤器（monthly,\
    \ per customer）。\n\n你能找到多少种不同的单词顺序？讨论出现的模式也很有趣。这些顺序或单词在局部或全局是否相似，即一个方法是否大量使用一种模式，而另一个方法使用不同的模式？\n\
    \n| 变量名 | 元素 | 顺序 |\n| --- | --- | --- |\n| `keywords_requiring_indentation` |\
    \ `keyword, requiring, indentation` | `noun, verb, noun` |\n| `imported_product`\
    \ | `imported, product` | `adjective, noun` |\n| `minimum_distance` | `minimum,\
    \ distance` | `quantifier, noun` |\n|  |  |  |\n|  |  |  |\n|  |  |  |\n\n######\
    \ 注记\n\n命名模式^([3](#ch02.html#id141))是变量名中元素通常组合的模式。例如，当需要为某人每月可获得的最大福利命名时，你可以选择\
    \ `max_benefit`、`max_benefit_per_month` 或 `max_benefit_num`。这些名称包含相同的领域概念，但表达方式不同。Feitelson\
    \ 对 47 名开发者进行了实验，结果显示两名开发者选择相同名称的概率很低：研究中的中位数概率仅为 7%！多样化的变量名会给工作记忆带来更大压力，因为你每次都要在不同位置搜索相关部分。\n\
    \n## 重构\n\n如果你想利用本章的发现改进代码库，可以考虑以下重构，部分基于第 3.4.2 节的质量问题。\n\n### 发音相似的对象\n\n在某些情况下，发音相似的对象可能需要代码变更。以下是几个问题：\n\
    \n*   如果它们真正不同，能否重命名一个以最小化重叠和困惑？\n*   如果它们相同，能否合并为一个对象，共享一些相似性？\n\n### 模糊的名称\n\
    \n你可能会发现一些名称不能准确描述代码功能，如 `analyze`、`convert`。对于像 `process()` 这样模糊的名称，什么更精确的名称更好？\n\
    \n### 异味名称\n\n如果你在练习 3.9 中发现名称与实现不完全匹配，可能需要重命名方法或标识符使其更精确。你也可能想与更熟悉代码库的人讨论其实现，以确定名称为何不匹配实现。在某些情况下，修改实现比修改名称更好。例如，当你有一个名为\
    \ `return name_and_id` 的方法但只返回 id，然后在多处用它获取名称时，最好实际返回名称和 id，并重构代码以集中获取名称的逻辑。\n\
    \n# 总结\n\n代码可以在不同维度阅读：结构、领域、概念、上下文和协作。本章探讨了领域维度，研究了变量、函数和对象的命名方式、从名称可以学到什么，以及如何利用名称理解和提高代码质量。下一章将探讨编程概念。\n\
    \n^([1](#ch02.html#id139-marker)) https://martinfowler.com/books/eaa.html\n\n\
    ^([2](#ch02.html#id140-marker)) http://www.veneraarnaoudova.ca/linguistic-anti-pattern-detector-lapd/\n\
    \n^([3](#ch02.html#id141-marker)) Dror G. Fietelson et al., [“How Developers Choose\
    \ Names”](https://www.cs.huji.ac.il/w~feit/papers/Names22TSE.pdf)\n\n# 第 3 章 概念考察\n\
    \n在前几章中，你在不深入代码内容的情况下考察了代码中的关系，并孤立地研究变量名而不看结构，给了你两个不同的视角来阅读代码。\n\n本章将把这两种技术结合起来，考察代码中存在的编程概念。概念通常以两种方式体现：要么明确写在名称中（如\
    \ `customerArray`），要么从代码结构中确定（如下面的代码片段）：\n\n```\nforeach (customer in customers)\n\
    {\n    customer.free_account();\n}\n```\n\n你也可以通过查看类型和导入，或查看与概念相关的特定语法元素（如指针的\
    \ `*` 和对象的 `.`）来了解编程概念。\n\n深入理解代码片段中使用的编程概念很有用，因为它能帮助你更好地在心理上处理代码，并帮助你理解可能缺少的先验知识。\n\
    \n本章的练习和技术侧重于代码的概念方面，帮助你回答诸如：这段代码库中重要的编程概念是什么？它们如何与领域和代码结构相关联？\n\n# 运行示例\n"

- raw: "When you read very unfamiliar code, you have no model of the code in your\
    \ long-term memory. Simply scrolling through the code will give your brain some\
    \ nuggets of new information, but it will not directly help to form a mental model.\
    \ Making the relationships explicit and storing them in a table or graphs supports\
    \ your memory in quickly processing new insights about the code.\n\nWhen reading\
    \ unfamiliar code, and sometimes even when reading familiar code, it can be hard\
    \ to get a good overview of all the dependencies in the code base. Often, when\
    \ bugs occur in code, an overlooked dependency is the cause, for example when\
    \ a method is not called which should have been. So, for a deeper level of understanding\
    \ code, understanding the connections within the code is an important first step.\
    \ It will help you form a mental model of the code and as such, strengthen your\
    \ prior knowledge and thus make it easier to reason about the code.\n\nLet’s dive\
    \ into the types of relationships that code can contain, since three different\
    \ types of components can relate to each other in different ways. Table 2-1 presents\
    \ an overview of the different relationships.\n\nFirstly, when object components\
    \ are classes, two components can relate to other classes with inheritance in\
    \ object oriented languages. For example, because one class inherits from another\
    \ class, but also when both classes inherit from a similar base class. Classes\
    \ can also contain functional components as methods and classes.\n\nIn some languages\
    \ functional components can use objects as parameters, and functions can call\
    \ static methods defined on classes. Furthermore functional components can call\
    \ each other creating a dependency between two functional components in both object-oriented\
    \ and functional languages. In object-oriented languages methods can also be related\
    \ because one method overrides the other one. Singular components can be used\
    \ inside the body of functional components.\n\nSingular components do not depend\
    \ on the other two object types.\n\nTable 1-1. Different ways in which components\
    \ can relate to each other \n\n|  ️ || Object Component || Functional Component\
    \ || Singular Component |\n\n| --- | --- | --- | --- |\n\n| Object Component ||\
    \ Inherits from (OO) || Contains as method (OO) || Contains as field (OO) |\n\n\
    | Functional Component || Uses are parameter (OO, FP)  \n\nCalls on static method\
    \ (OO) || Calls (OO, FP)  \n\nOverrides (OO) || Used in body |\n\n| Singular Component\
    \ || \\- || \\- || \\- |\n\n## IDE support for dependency analysis\n\nThe IDE\
    \ can help you to determine relationships between components in different ways.\n\
    \n### Search\n\nA simple and quick way to understand dependencies in a code base\
    \ is using **search functionality**. While you will probably use search functionalities\
    \ all the time when writing and debugging code, you can use the IDE in a slightly\
    \ different way when specifically looking to find relationships, by searching\
    \ when the code is **folded**.\n\nWhen you search for names of constants, variables\
    \ or methods when the code is folded, results will be highlighted in the folded\
    \ code blocks. This gives a quick overview of usage of constants and variables,\
    \ or the calling of methods. For example, suppose you want to know what methods\
    \ use the PREFIX\\_CODE constant defined in the code snippet above. See figure\
    \ 2-3 for the results that appear when searching the code for the string PREFIX\\\
    _CODE in the search bar.\n\n![](assets/structural_examination_672754_06.png)\n\
    \nThis view can immediately help you find the specific dependency of object or\
    \ functional components on singular objects (in figure 2-3 on the singular object\
    \ PREFIX\\_CODE).\n\nOf course, string matching is limited. In fact, the full\
    \ code base from Figure 2-3 has a second constant called TURTLE\\_PREFIX\\_CODE\
    \ that would also be found with a search for PREFIX\\_CODE in other places in\
    \ the code (which are not shown in the figure).\n\n### Dependency features\n\n\
    A second, more powerful method to examine structure is to use **dependency features**\
    \ in the IDE to list dependencies explicitly. In many IDEs, right clicking a constant,\
    \ variable or method will reveal the option to list all usages, as shown in [Figure 1-7](#ch01.html#fig_6_find_usages_feature_shown_in_pycharm).\n\
    \n![](assets/structural_examination_672754_07.png)\n\nThe list of usages which\
    \ the IDE now shows will also be the usages of PREFIX\\_CODE in functions and\
    \ objects.\n\nIn most IDEs, find usages-features do not just find dependencies\
    \ on variables, they can also detect other relationships including class inheritance\
    \ and function calls. However, often IDEs do not clearly distinguish between different\
    \ types of relationships, which can be confusing when you are trying to form a\
    \ mental model of the code.\n\nFor example, figure 2-5 shows the result of finding\
    \ dependencies for a class called `ConvertToPython`. You can see an inheritance\
    \ relationship in line 1186, as well as calls to static methods (lines 1359 and\
    \ 1479) in the class.\n\n![](assets/structural_examination_672754_08.png)\n\n\
    ### Exercise 2.2: Relationships\n\n\\[To Come\\]\n\n## Informal relationships\
    \ in code\n\nSo far we have examined formal relationships, but often code components\
    \ also have informal relationships, which by default can’t be found by tools.\
    \ We will therefore expand our understanding with a bit of manual analysis and\
    \ look for these connections. You can do this by lightly browsing the code and\
    \ just let things jump out at you. Don’t worry if you miss something.\n\n### Connections\
    \ based on names and comments\n\nA first example of informal relationships between\
    \ code components are comments, like a comment in one class saying something like\
    \ “this class is similar to class X and we should consider merging them”. This\
    \ is not a formal relationship between classes like inheritance but does give\
    \ us more depth in understanding the code. Another one is similar naming. In our\
    \ running example, `IsComplete()` and `IsValid()` share both a formal relationship\
    \ because they have the same superclass, but they are also similar in name, and\
    \ play a similar role on the call site.\n\n### Connections based on parameters\n\
    \nAnother more informal type of relationship that can exist between components\
    \ and requires some manual inspection are the relationships that can occur at\
    \ the parameter level. Functional components can be connected when they use the\
    \ same parameters frequently, which Fowler calls a Data Clump. Even if functions\
    \ are not formally connected by being grouped in a class, they can still be similar\
    \ because they operate on the same type of objects. For example, when your code\
    \ base contains a Canvas object that you write information to, multiple classes\
    \ can have methods that use that Canvas as a parameter without calling each other.\
    \ While these methods lack a formal connection, they do have a relationship, one\
    \ that is hard to determine without manual inspection of the method declarations.\n\
    \n### Exercise 2.3: Examine parameters\n\nExamine the parameters of the functions\
    \ of methods in your code base from Exercise 2-1. If you have done exercise 2.2\
    \ you can simply copy all function lines. Now list the parameters that occur in\
    \ these functions as column headers and mark cells with an X when a function uses\
    \ a certain parameter.\n\n| Component || program\\_text || skulpt || URL || …\
    \ |\n\n| --- | --- | --- | --- | --- |\n\n| *parse (F)* || *X* ||   ||   ||  \

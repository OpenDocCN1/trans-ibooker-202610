- raw: "As in previous chapters, I provide one example code snippet to help you work\
    \ through the concepts presented in this chapter: for this chapter, you are learning\
    \ how to uncover concepts embedded in the code. Don’t worry if it looks entirely\
    \ overwhelming! By the end of the chapter, you will be able to make sense of it…\n\
    \n## Reading the example snippet\n\nLater sections of the chapter include exercises\
    \ to complete with the example snippet, but you might want to get a sense of the\
    \ code before reading on. A great way to start is to use the exercises from previous\
    \ chapters, to understand the structure and domain of the code.\n\n## Example\
    \ code: Tree templates in Lark (Python)\n\n```\nfrom typing import Union, Optional,\
    \ Mapping\n\nfrom lark import Tree, Transformer\nfrom lark.exceptions import MissingVariableError\n\
    \nBranch = Union[Tree[str], str]\nTreeOrCode = Union[Tree[str], str]\nMatchResult\
    \ = Dict[str, Tree]\n_TEMPLATE_MARKER = '$'\n\n\nclass TemplateConf:\n   #Template\
    \ Configuration Allows customization for different uses of Template\n\n   def\
    \ __init__(self, parse=None):\n       self._parse = parse\n\n   def test_var(self,\
    \ var: Union[Tree, str]) -> Optional[str]:\n       \"\"\"Given a tree node, if\
    \ it is a template variable return its name. Otherwise, return None.\n\n     \
    \  This method may be overridden for customization\n\n       Parameters:\n   \
    \        var: Tree | str - The tree node to test\n       \"\"\"\n       if isinstance(var,\
    \ str) and var.startswith('$'):\n           return var.lstrip('$')\n\n       if\
    \ isinstance(var, Tree) and var.data == 'var' and len(var.children) > 0:\n   \
    \        first_child = var.children[0]\n           if isinstance(first_child,\
    \ str) and first_child.startswith('$'):\n               return first_child.lstrip('$')\n\
    \n       return None\n\n   def _get_tree(self, template: TreeOrCode):\n      \
    \ if isinstance(template, str):\n           assert self._parse\n           template\
    \ = self._parse(template)\n\n       assert isinstance(template, Tree)\n      \
    \ return template\n\n   def __call__(self, template):\n       return Template(template,\
    \ conf=self)\n\n   def _match_tree_template(self, template, tree):\n       template_var\
    \ = self.test_var(template)\n       if template_var:\n           return {template_var:\
    \ tree}\n\n       if isinstance(template, str):\n           if template == tree:\n\
    \               return {}\n           return None\n\n       assert isinstance(template,\
    \ Tree), template\n\n       if template.data == tree.data and len(template.children)\
    \ == len(tree.children):\n           res = {}\n           for t1, t2 in zip(template.children,\
    \ tree.children):\n               matches = self._match_tree_template(t1, t2)\n\
    \               if matches is None:\n                   return None\n\n      \
    \         res.update(matches)\n           return res\n\n\nclass Template:\n  \
    \ \"\"\"Represents a tree templates, tied to a specific configuration\n\n   A\
    \ tree template is a tree that contains nodes that are template variables.\n \
    \  Those variables will match any tree.\n   (future versions may support annotations\
    \ on the variables, to allow more complex templates)\n   \"\"\"\n\n   def __init__(self,\
    \ tree: Tree, conf = TemplateConf()):\n       self.conf = conf\n       self.tree\
    \ = conf._get_tree(tree)\n\n   def match(self, tree: TreeOrCode):\n       \"\"\
    \"Match a tree template to a tree.\n\n       A tree template without variables\
    \ will only match ``tree`` if it is equal to the template.\n\n       Parameters:\n\
    \           tree (Tree): The tree to match to the template\n\n       Returns:\n\
    \           Optional[Dict[str, Tree]]: If match is found, returns a dictionary\
    \ mapping\n               template variable names to their matching tree nodes.\n\
    \               If no match was found, returns None.\n       \"\"\"\n       tree\
    \ = self.conf._get_tree(tree)\n       return self.conf._match_tree_template(self.tree,\
    \ tree)\n\n   def search(self, tree: TreeOrCode):\n       \"\"\"Search for all\
    \ occurances of the tree template inside ``tree``.\n       \"\"\"\n       tree\
    \ = self.conf._get_tree(tree)\n       for subtree in tree.iter_subtrees():\n \
    \          res = self.match(subtree)\n           if res:\n               yield\
    \ subtree, res\n\n   def apply_vars(self, vars: Mapping[str, Tree]):\n       \"\
    \"\"Apply vars to the template tree\n       \"\"\"\n       return _ReplaceVars(self.conf,\
    \ vars).transform(self.tree)\n\n\ndef translate(t1: Template, t2: Template, tree:\
    \ TreeOrCode):\n   \"\"\"Search tree and translate each occurrence of t1 into\
    \ t2.\n   \"\"\"\n   tree = t1.conf._get_tree(tree)      # ensure it's a tree,\
    \ parse if necessary and possible\n   for subtree, vars in t1.search(tree):\n\
    \       res = t2.apply_vars(vars)\n       subtree.set(res.data, res.children)\n\
    \   return tree\n\n\nclass TemplateTranslator:\n   \"\"\"Utility class for translating\
    \ a collection of patterns\n   \"\"\"\n\n   def __init__(self, translations: Mapping[TreeOrCode,\
    \ TreeOrCode]):\n       assert all( isinstance(k, Template) and isinstance(v,\
    \ Template) for k, v in translations.items() )\n       self.translations = translations\n\
    \n   def translate(self, tree: Tree):\n       for k, v in self.translations.items():\n\
    \           tree = translate(k, v, tree)\n       return tree\n```\n\n## Context\n\
    \nThe code snippet above is code from a Python parser framework called Lark. If\
    \ you want to examine the code in the browser or in the IDE, you can find it here:\
    \ [https://github.com/lark-parser/lark/blob/953171821ed307f700fddf27f3fcb9483346bd46/lark/tree\\\
    _templates.py](https://github.com/lark-parser/lark/blob/953171821ed307f700fddf27f3fcb9483346bd46/lark/tree_templates.py).\n\
    \nIf you have done a domain exercise, you have probably noticed that the domain\
    \ of this code is mainly a programming domain: parsing and templating.\n\n# Learning\
    \ from names and operations\n\nWhen a code base is well organized, names can give\
    \ you a solid understanding of what code is doing. A name like password**Hashed**\
    \  indicates clearly that a hash is being performed on a password. Often though,\
    \ recognizing concepts from names requires an understanding of the domain. For\
    \ example, consider the first few lines of the Lark code snippet. Let’s look at\
    \ the variable Branch at the top of this code snippet:\n\n```\nfrom typing import\
    \ Union, Optional, Mapping\nfrom lark import Tree, Transformer\nfrom lark.exceptions\
    \ import MissingVariableError\nBranch = Union[Tree[str], str]\nTreeOrCode = Union[Tree[str],\
    \ str]\nMatchResult = Dict[str, Tree]\n_TEMPLATE_MARKER = '$'\n```\n\nThe name\
    \ Branch in itself can refer to several concepts known in programming, and for\
    \ many developers the first *branch* they will likely think of is a branch in\
    \ a version control system like GitHub. But *branch* can also be a domain concept,\
    \ indicating a certain instance of a shop (the Detroit branch) If you know something\
    \ about parsing and are somewhat familiar with the Lark library, you may be able\
    \ to deduce that the branch that is meant here is the name of subtree of a parse\
    \ tree. Now try out [Exercise 4.1](#ch03.html#exercise_4_1_examine_concepts_in_all_variable_name).\n\
    \n## Exercise 4.1 Examine concepts in all variable names in the codebase\n\nFor\
    \ this exercise, write down the variables found in the Lark code snippet. Which\
    \ programming concepts come to mind based on the names?\n\n| Variable name ||\
    \ Programming concept(s) |\n\n| --- | --- |\n\n| *Branch* || *Trees, Parsing*\
    \ |\n\n| --- | --- |\n\n| *TreeOrCode* || *Trees, Parsing* |\n\n|   ||   |\n\n\
    |   ||   |\n\n|   ||   |\n\n## Learning from behavior\n\nVariable names can be\
    \ a source of conceptual information. But, names are not the only place in the\
    \ code where you can learn about concepts that are present in a piece of code.\
    \ You can also identify concepts from the operations performed with or on variables.\
    \ For example, if you see a line of code such as settings.next, you can deduce\
    \ that settings is a type over which you can iterate, giving rise to the hypothesis\
    \ that setting will be an iterator or a stream."

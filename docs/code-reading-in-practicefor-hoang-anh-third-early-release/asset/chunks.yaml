- raw: "Finally, when you are doing any kind of analysis manually, it can be tempting\
    \ to dive deep into the code, but it is better in this phase to try to limit yourself\
    \ to finding the dependencies. Later chapters cover other exercises looking at\
    \ names, code quality, and other aspects of the code.\n\n## A top to bottom read\n\
    \nNow that we have formed a first basic understanding of the code base and its\
    \ components, it is a good time for a time to bottom read, without relying on\
    \ IDE features. While IDEs can help illuminate dependencies, reading the entire\
    \ code snippet from the top to the bottom can also be very useful, because you\
    \ are then building a more complete model of the code. But it is important to\
    \ timebox this activity or you end up going into a rabbit hole and getting frustrated\
    \ by a lack of understanding. Use, for example, 10 minutes and read the code in\
    \ that time. Keep your diagram handy and note down any new information.\n\n# Entry\
    \ points\n\nNow that you have gained some initial understanding of the different\
    \ components and their relationships to each other, it is time to make a plan\
    \ for reading the code. You’ll do that firstly by locating an *entry point.* An\
    \ entry point is a point where you will start reading.\n\nThere are many different\
    \ ways in which you can read code, which I discuss later in this book, in Part\
    \ Z. For now, let’s focus on reading by following the execution flow of the code.\n\
    \n## Finding entry points\n\nWhile it is not always clear where unfamiliar code\
    \ starts, often, you can guess a few places in the code where you expect the execution\
    \ to start, like a main() method in a C like language, code guarded by an if \\\
    _\\_name\\_\\_ == “\\_\\_main\\_\\_”: in Python, or a method related to the /index\
    \ route in a web application. Finding generic entry points can be done with text\
    \ search, if you have a good guess of what the name of the starting method will\
    \ be. For example, it can be main in many C programs, a controller in an MVC app,\
    \ or a default route like /index.html for web apps. Unit tests can also serve\
    \ as great entry points, but will will dive deeper into reading test code specifically\
    \ later in the book.\n\nHowever, sometimes you will lack a good guess of where\
    \ the execution starts. In such a case, you can use a table like the one you constructed\
    \ in Exercise 2.2 to help find another entry point. First, ignore the object and\
    \ singular components and just focus on the rows and columns of functional components.\
    \ Now look at the functional components that have an empty or almost empty column,\
    \ and also have a full row. These are functional components that are not, or hardly\
    \ called but do call a lot of other functions and as such can be interesting places\
    \ to start an exploration.\n\n## Reading from the entry point\n\nNow that you\
    \ have identified an entry point, you can start to build a mental model of the\
    \ remainder of the code. You can again use the IDE to help you understand code\
    \ dependencies by placing a breakpoint on the entry point and stepping into each\
    \ dependent code block examining the **slice** of code that you are interested\
    \ in. A slice is a part of the code that relates to a certain function or variable\
    \ and is exactly that part of the code that this variable is used in or that this\
    \ function leads into.\n\nIf you want to step through a slice of code, in most\
    \ IDEs you can place a breakpoint such that the code will stop when the execution\
    \ reaches the breakpoint. You can do so by clicking in the gutter next to the\
    \ code, which will create a breakpoint indicated by a red dot as shown in Figure\
    \ 2-6.\n\n![](assets/structural_examination_672754_09.png)\n\nOnce you have placed\
    \ the breakpoint, you can follow the execution path using the IDE to step into\
    \ each of the called functions. Again, your instincts might be to dive into each\
    \ method in detail and read all the inner workings. But at this level of reading,\
    \ the concrete goal is to scratch the surface of the code and not go too much\
    \ deeper, so as not to tax your working memory. Don’t worry, that phase will come\
    \ later!\n\nA good strategy at this point is to try to contextualize the relationships\
    \ that you have, summarizing the why of the relationship in one or two sentences.\n\
    \n### Exercise 2.4\n\nFollow the call stack of your chosen entry point and read\
    \ from there. Fill the table with the relationship types between the functions.\
    \ Describe the role of the dependency in one or two sentences.\n\n| Component\
    \ || parse (F) || execute (F) || validate\\_tree(F) |\n\n| --- | --- | --- | ---\
    \ |\n\n| *parse (F)* ||   ||   || *calls the validate\\_tree()n function to determine\
    \ if the parse tree can be processed* |\n\n| --- | --- | --- | --- |\n\n| *execute\
    \ (F)* || *calls the parse() function to obtain the transpiled code which then\
    \ can be executed* ||   ||   |\n\n| *validate\\_tree(F)* ||   ||   ||   |\n\n\
    You can find the dependencies manually or using the IDE. While using the IDE can\
    \ feel easier, stepping through the code can be useful but is also likely to be\
    \ overwhelming. If the IDE will step into a piece of code that is located far\
    \ away from the current line, you will have to reorient yourself in the codebase\
    \ again, and you will easily lose track. This is especially true if there are\
    \ pieces of code in which multiple execution paths come together, like when a\
    \ function gathers information from several other methods and combines them. For\
    \ example, the function print\\_ask\\_args below first checks the variables in\
    \ all arguments (and throws if that is not possible) and then transforms each\
    \ of the arguments in the next line.\n\n```\ndef print_ask_args(self, args):\n\
    \   args = self.check_var_usage(args)\n   transformed_args = [self.process_variable_for_fstring(a)\
    \ for a in args]\n   return ''.join(transformed_args)\n```\n\nIn such complex\
    \ cases, manual reading aided by search might be less demanding and thus more\
    \ effective than “hopping” through the code using the IDE using breakpoints.\n\
    \nIn addition to making notes in a dependency table (see exercise 2.3), visualizations\
    \ as Unified Modeling Language (UML) class diagrams like the one in figure 2-X\
    \ can help support this type of code reading as well. In a class diagram we described\
    \ the classes in a system as boxes containing their fields and methods. For example\
    \ in figure 2-X, `Client`, `Receiver`, `Invoker`, `Command` and `ConcreteCommand`\
    \ are classes and `execute()` is a method of `Command` and `ConcreteCommand`.\n\
    \nIf you are looking for specific information, it is especially important to keep\
    \ an eye on your history, and determine if what you are reading is helping you\
    \ to answer concrete questions about the code.\n\n![](assets/structural_examination_672754_10.png)\n\
    \n## Different kinds of entry points\n\nYour prior knowledge of a code base will\
    \ impact what entry point to use, as well as the activities you are performing.\
    \ For example, when you are looking at a codebase that is quite unfamiliar to\
    \ you, starting at a generic entry point like a main method can be helpful because\
    \ it helps you build a mental model of what happens in the code in the order that\
    \ it will happen at runtime too.\n\nBut in a more familiar code base, it is more\
    \ likely that you will start with a context-specific entry point, and which type\
    \ depends on the activity. For example, while debugging, a failing test will be\
    \ a natural entry point to start your reading process from. Later in this book,\
    \ in chapter X we will dive into the process of code reading when debugging is\
    \ depth. While optimizing, a line flagged by the profiler is a good place to start.\
    \ Later chapters of this book, particularly in Part 2, will dive into different\
    \ types of reading scenarios with different types of entry points.\n\n# After\
    \ the read"

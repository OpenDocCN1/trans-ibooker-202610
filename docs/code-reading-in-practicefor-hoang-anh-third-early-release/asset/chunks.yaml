  trans: "\n# 第 4 章：理解代码上下文\n\n在第 3 章中，你根据从代码中收集到的信息创建了一个概念图。正如我当时解释的那样，你的大脑存储概念的方式更像是一张地图，而不是一个列表。因此，再次创建一个概念及其关系的概念图会非常有用。用信息来源丰富该图，以便在需要时帮助你重新审视或完善信息。\n\
    \n## 阅读后\n\n在本章中，你学习了更深入理解代码库上下文的技术。如果你已将本章的练习和技术应用到你正在处理的代码库中，你可以再次将学到的信息分享到代码库本身。你可能会惊讶地发现，在许多项目中，文档与代码之间的联系是多么微弱。我可以告诉你，在写这本书的过程中，遵循我自己的建议后，我自己的开源仓库中的文档有了显著改善！\n\
    \n## 以初学者的视角改进词汇表\n\n在研究 SWA Corona Warn App（一个我完全不熟悉的领域）时，我花了相当长的时间才深入理解概念并建立与代码的相关联系。如果你以类似的方式、使用类似的技术阅读另一个代码库，我可以保证，将你学到的东西分享到文档中，对项目维护者来说将非常有用。当你成为专家时，你会遭受我们所谓的**专家诅咒**。当你知晓或理解某事时，你几乎无法想象竟然有人不知道你知道的事情！因此，以全新的视角改进项目文档非常有价值。\n\
    \n## 讨论文档质量\n\n一个更容易的贡献方式可能是帮助维护者了解当前文档的质量。例如，分享阅读代码和初始文档后遗留的问题列表，能为文档可以改进的地方提供相关线索。此外，分享相关信息的来源对维护者也非常有帮助。在我们的示例仓库中，我确信维护者会想知道我从记录\
    \ `teletan` 含义的 `PR` 中学到了多少，并将其中一些内容移至文档中。\n\n## 扩展代码注释\n\n在其他章节中，你从代码中收集信息，然后将其添加到文档中，但在本章中，你阅读代码外部的文档，并可以将其提交回代码库。例如，你可以从现有的词汇表或定义列表中获取信息并添加到代码中。\n\
    \n在我们的示例片段中，增加一行注释会让理解发生了什么容易得多。\n\n原始代码如下：\n\n```kotlin\nval teletan = currentTan.value\n\
    \       if (!teletan.isTanValid) {\n           Timber.w(\"Tried to set invalid\
    \ teletan: %s\", teletan)\n           return\n       }\n```\n\n但你可以像这样扩展它：\n\n\
    ```kotlin\nval teletan = currentTan.value\n// The server returns a `TeleTan` based\
    \ on the received `TAN` value \n       if (!teletan.isTanValid) {\n          \
    \ Timber.w(\"Tried to set invalid teletan: %s\", teletan)\n           return\n\
    \       }\n```\n\n## 总结\n\n代码可以从不同维度阅读，包括查看结构、领域和编程概念。本章探讨了代码片段的上下文。\n\n# 第 5\
    \ 章：为代码审查而阅读\n\n如今，代码审查是软件行业一项成熟的实践。`代码审查` 是软件开发生命周期中的质量保证步骤。许多公司将其置于将代码变更合并回\
    \ `trunk`（主干）之前，使用 `git` 等版本控制时，也称为 `main` 或 `master` 分支。以这种方式实施时，它通常具有阻塞性，意味着如果不进行\
    \ `代码审查`，代码变更就无法合并回去。\n\n审查者在 `代码审查` 期间的主要活动是阅读。就像代码阅读一样，没人教过如何做一个正确的 `代码审查`。你是在实践中学会的。在本章中，我将带你了解我进行\
    \ `代码审查` 的方法，并重点介绍一些发现可能破坏代码未来可读性问题的技巧和窍门。\n\n## 如何进行代码审查？\n\n尽管这是一项成熟的实践，但 `代码审查`\
    \ 在我们行业中并不是一个定义明确的实践。它可以是一项个人活动，审查者异步给出反馈。它也可以是一项结对活动，代码作者带领审查者浏览实现，同时即时讨论和修改反馈。\n\
    \n我（Gien）工作过的每一家公司，做 `代码审查` 的方式都不同。当团队有测试人员时，手动测试不是软件开发人员审查的部分。当没有测试人员时，测试是 `代码审查`\
    \ 存在的主要原因。有些公司有标准化的 `代码审查` 方式，但并非所有公司都有。当 `代码审查` 没有正式结构时，我请求的每次 `代码审查` 都不一样，取决于接手请求的人。\n\
    \n这也取决于公司的 `持续集成 (CI)` 实践。有些公司将自动化质量保证作为 `CI` 流水线的一部分，有些则没有。我曾在自动化测试有限或缺失的公司工作，在这些公司中，`代码审查`\
    \ 的主要原因也是测试。\n\n对我来说，`代码审查` 的目的有二：发现代码中的改进点，并在团队中分发知识。其他一切都不在范围内。以下是构建 `代码审查`\
    \ 时需要牢记的一些事项：\n\n*   `代码审查` 不是一种确保开发人员遵循代码规范的控制机制。\n*   它不是一种培训团队中“初级”开发人员的技术。\n\
    *   `代码审查` 是向开发生命周期添加测试的糟糕方式。\n*   重构代码以实现这些改进不必是 `代码审查` 的一部分。\n\n如果你想要质量保证，不应将复杂的\
    \ `代码审查` 作为 `CI` 流水线中的阻塞步骤实施。`代码审查` 本身应该是一个持续的过程，可以在任何时候进行：在你进行代码变更之前、期间或之后。你应该自动化代码规范、缺陷检测和测试。这有时被称为持续代码质量。\n\
    \n无论你是修复缺陷、添加新功能还是重构代码，你都应该在开始让团队成员能够进行 `代码审查` 的那一刻创建 `合并请求 (MR)`。你应该在 `MR` 中添加足够的信息，以便团队成员了解你将更改什么以及如何更改。\n\
    \n## 自动化代码审查的部分环节\n\n刚开始学习一门语言，或弄清楚如何在其新版本中使用新特性，可能是个挑战。这就是为什么大多数编程语言都提供代码规范建议。这些指南基本上是创作者关于如何最好地使用该语言的声明。例如，Microsoft\
    \ 提供了命名规范、代码布局、注释、安全性和通用语言指南的最佳实践。\n\n例如，我们在第 2 章已经提到，Python 类使用 `snake_case`\
    \ 命名。这是一个命名规范的例子。C# 的类有不同的命名约定，即 `PascalCase`，你为类中的每个单词使用大写字母。“在两个方法之间留一个空行”是代码布局规范的一个例子。你可以在这里查看所有内容：`https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/coding-style/coding-conventions`\n"

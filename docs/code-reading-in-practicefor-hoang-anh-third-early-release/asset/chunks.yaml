- raw: 'You might wonder why I am talking about code conventions in a chapter about
    code reviews. Since you have to read code that was written by somebody else during
    a code review, it is easier if some things are agreed upon beforehand such as
    naming and the layout of files. Opening a file and finding a completely different
    way of naming or layouting can be very confusing. You want to focus on reading
    the code, but instead you have to take the time to get used to the layout of the
    file. You want to remove as many barriers as possible to increase readability.


    But! What are the conventions you should follow in a team? This has been the topic
    of many heated discussions in some of my previous teams. Every programmer has
    their own preference. Every programmer thinks their preference is right, and all
    the other ones are wrong. I too thought like that for a very long time and I must
    confess I still get lured into this discussion trap sometimes. In general, my
    advice is to use the guidelines that your language offers you and automate the
    discussion away.


    ## Code formatters


    A *code formatter* is a tool that formats your code into a specific layout. Most
    IDE’s have built-in code formatters and shortcuts that can format your code according
    to a set of specifications in your settings. In more general code editors like
    Visual Studio Code, you have to install a plug-in for your language.


    There are a few ways that you can automate code formatting. You can enable formatting
    when saving a file, as shown in [Figure 5-6](#ch05.html#fig_6_5_add_a_comment_to_the_line_that_is_incorrect_acco).


    ![](assets/reading_for_code_reviews_309317_01.png)


    Unfortunately, not every IDE offers auto-formatting on save. What you can do then
    is format on committing changes to your version control. Git offers *Hooks*, a
    way of automatically executing scripts before or after certain git commands are
    executed. One of those Hooks is the “pre-commit hook”. You can add anything to
    this hook, but a common practice is to add a code formatter here.


    If you use an automated code formatter, code reviews are no longer a control mechanism
    for checking code layout conventions. The reviewer will also be able to focus
    on what is important: finding improvements and understanding the code.


    ## Linters


    *Linters* go a bit further than code formatters. They analyze your code against
    a set of rules to find bugs, detect code smells and vulnerabilities. They also
    find style violations for you, but unlike a code formatter, they don’t fix those
    automatically. When you start looking for a linter, you will find that it gets
    a bit fuzzy though. Some linters can automatically correct style violations and
    code smells, others cannot. What they can analyze also differs. SonarQube, for
    example, can analyze multiple programming languages, configuration files for Docker,
    even your SQL statements. Pylint on the other hand is specifically developed to
    analyze Python.


    Same as with code formatters, you can install (some) of them in your IDE or use
    the pre-commit hook to run them.


    # Analyzing the dimensions


    During a code review, you analyze all four dimensions of code reading for understandability:
    structure, business domain, programming concepts, and context. Together, they
    need to form a clear, and cohesive picture.


    Depending on my familiarity with the part of the codebase that changed, I like
    to start my code reviews differently. Let’s go through an illustrative example
    I created for this book. I picked Marten, a .NET library that allows PostgreSQL
    to function as a document database or an event store. The open source project
    can be found here: [https://github.com/JasperFx/marten](https://github.com/JasperFx/marten).
    I copied over one of their merge requests I will be evaluating: [https://github.com/codereadinginpractice/marten/pull/1](https://github.com/codereadinginpractice/marten/pull/1)


    If you want to start contributing to an open source project, but you are uncertain
    how to do that, doing a code review is a good way to start.


    ## Getting a feel for the merge request


    First, I get a general feel for the MR. I have a look at conversations, commits
    and quickly check the collapsed view of files changed, as shown in [Figure 5-6](#ch05.html#fig_6_5_add_a_comment_to_the_line_that_is_incorrect_acco).2.
    I can see here that it is a small MR with mostly added lines of code, because
    the color blue is dominant in this overview.


    ![](assets/reading_for_code_reviews_309317_02.png)


    If I look at the sidebar, I can gain even more information. Next to each file
    name, there is a symbol to indicate what happened to the file ([Figure 5-6](#ch05.html#fig_6_5_add_a_comment_to_the_line_that_is_incorrect_acco).3).
    I can easily see that 4 new files were added, and 3 files were changed. No files
    were removed in this MR.


    ![](assets/reading_for_code_reviews_309317_03.png)


    You can also gain a lot of information from looking at displayed information in
    the MR. As shown in [Figure 5-6](#ch05.html#fig_6_5_add_a_comment_to_the_line_that_is_incorrect_acco),
    you can get an indication on how much has changed between the two files. In this
    example there are 3 changes in the file docs/.vitepress/config.ts. There are more
    additions to this file then there are removals. You can see this by looking at
    the color indications next to the number of changes: blue means lines of code
    were added to the right file that is not in the left file.. Red indicates lines
    of code were removed from the left file. Two squares are blue and one is red,
    so there were more lines of code added to config.ts than there were removed.


    ![](assets/reading_for_code_reviews_309317_04.png)


    Let’s take an even deeper dive. Look for the numbers between two @@ underneath
    the file name. This gives you information about what is displayed from each file.
    We can read -173,7 +173, 8 as followed:


    *   The minus sign indicates that lines of code that appeared in the left file,
    are removed from the right file.


    *   The number 173 is the line number of the first line of code that is displayed
    in the diff view.


    *   The 7 means that there are 7 lines of code displayed for the left file.


    *   The plus sign indicates that lines of code were added to the right file, that
    are not in the left file.


    *   The right file starts displaying also at line 173, but it is displaying 8
    lines of code.


    Once you are finished with reviewing the differences, you can mark the file as
    viewed. I like this feature because reviewing changes can be very exhausting and
    cannot always be completed in one sitting. This MR is pretty small, only 7 files
    were changed and one of those is the gitignore file so I can review it in one
    go. However, I have had review requests that changed over 15 files and that is
    too much to do at once. I review larger merge requests in smaller chunks and use
    the reviewed check to keep track of what I already did.


    I also try to understand what the purpose of the code changes is. Is this merge
    request:


    *   Fixing a bug?


    *   Adding a new feature?


    *   Changing or expanding an existing feature?


    *   Refactoring existing code?


    *   …?


    This might sound normal to you, but I have encountered merge requests where it
    took some effort to figure out what exactly was happening. Generally, people should
    be separating these types of code changes and creating a merge request for each
    of them, but this is not always the case. The MR from the example adds a new feature
    to the codebase, as shown in [Figure 5-6](#ch05.html#fig_6_5_add_a_comment_to_the_line_that_is_incorrect_acco).


    ![](assets/reading_for_code_reviews_309317_05.png)


    From the description alone you can already find domain concepts that you need
    to understand in order to do your code review. I already mentioned async daemon.
    As an exercise, find other domain concepts and add them to the Name column in
    Exercise 11.1. You don’t have any information yet on Type, Concept or Component
    so let’s leave those blank for now.



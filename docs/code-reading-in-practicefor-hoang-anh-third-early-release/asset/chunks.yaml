    # 理解代码关系


    当你阅读非常陌生的代码时，你的长期记忆中没有该代码的模型。仅仅浏览代码会给你的大脑提供一些新信息的碎片，但这不会直接帮助形成心智模型。使关系显性化并将它们存储在表格或图表中，能辅助你的记忆快速处理关于代码的新洞察。


    阅读陌生代码时，有时甚至阅读熟悉代码时，很难全面掌握代码库中的所有依赖关系。通常，当代码中出现 Bug 时，被忽视的依赖关系是原因所在，例如本应被调用的方法未被调用。因此，为了更深层次地理解代码，理解代码内部的连接是重要的第一步。它将帮助你形成代码的心智模型，从而强化你的先验知识，进而使推理代码变得更加容易。


    ## 代码中的关系类型


    让我们深入探讨代码可能包含的关系类型，因为三种不同类型的组件可以通过不同的方式相互关联。表 2-1 概述了不同的关系。


    首先，当对象组件是类时，在面向对象语言中，两个组件可以通过继承与其他类相关联。例如，因为一个类继承自另一个类，但也包括两个类都继承自相似的基类的情况。类也可以包含作为方法和类的功能组件。


    在某些语言中，功能组件可以使用对象作为参数，函数可以调用类上定义的静态方法。此外，功能组件可以相互调用，在面向对象和函数式语言中都会在两个功能组件之间创建依赖关系。在面向对象语言中，方法也可以因为一个方法重写了另一个方法而相关联。单元组件可以在功能组件的主体内被使用。


    单元组件不依赖于另外两种对象类型。


    ### 表 2-1：组件相互关联的不同方式


    | | 对象组件 | 功能组件 | 单元组件 |

    |---|---|---|---|

    | 对象组件 | 继承自 (OO) | 包含作为方法 (OO) | 包含作为字段 (OO) |

    | 功能组件 | 用作参数 (OO, FP)<br>调用静态方法 (OO) | 调用 (OO, FP)<br>重写 (OO) | 在主体中使用 |

    | 单元组件 | - | - | - |


    ## 用于依赖分析的 IDE 支持


    IDE 可以通过不同方式帮助你确定组件之间的关系。


    ### 搜索


    理解代码库中依赖关系的一种简单快捷的方法是使用**搜索功能**。虽然你在编写和调试代码时可能一直在使用搜索功能，但当专门寻找关系时，你可以通过在代码**折叠**时搜索，以稍微不同的方式使用
    IDE。


    当代码折叠时搜索常量、变量或方法的名称，结果将在折叠的代码块中高亮显示。这能快速概览常量和变量的使用情况，或方法的调用情况。例如，假设你想知道哪些方法使用了上述代码片段中定义的
    `PREFIX_CODE` 常量。请参见图 2-3，了解在搜索栏中搜索字符串 `PREFIX_CODE` 时出现的结果。


    ![](img/structural_examination_672754_06.png)


    此视图能立即帮助你找到对象或功能组件对单元对象的特定依赖关系（在图 2-3 中为单元对象 `PREFIX_CODE`）。


    当然，字符串匹配是有限的。事实上，图 2-3 中的完整代码库还有一个名为 `TURTLE_PREFIX_CODE` 的第二个常量，在代码的其他地方（图中未显示）搜索
    `PREFIX_CODE` 时也会被找到。


    ### 依赖功能


    检查结构的第二种、更强大的方法是使用 IDE 中的**依赖功能**来显式列出依赖关系。在许多 IDE 中，右键单击常量、变量或方法将显示列出所有用法的选项，如图
    1-7 所示。


    ![](img/structural_examination_672754_07.png)


    IDE 现在显示的用法列表也将是 `PREFIX_CODE` 在函数和对象中的用法。


    在大多数 IDE 中，查找用法功能不仅能找到对变量的依赖，还能检测包括类继承和函数调用在内的其他关系。然而，IDE 通常无法清晰地区分不同类型的关系，这在你试图形成代码的心智模型时可能会造成困惑。


    例如，图 2-5 显示了为名为 `ConvertToPython` 的类查找依赖关系的结果。你可以在第 1186 行看到继承关系，以及该类中对静态方法的调用（第
    1359 行和第 1479 行）。


    ![](img/structural_examination_672754_08.png)


    ### 练习 2.2：关系


    [待补充]


    ## 代码中的非正式关系


    到目前为止，我们已经研究了正式关系，但代码组件通常也存在非正式关系，这些关系默认无法通过工具发现。因此，我们将通过一些手动分析来扩展理解，寻找这些连接。你可以通过浏览代码来做到这一点，只需让事物自然而然地跳入眼帘。如果遗漏了什么，不必担心。


    ### 基于名称和注释的连接


    代码组件之间非正式关系的第一个例子是注释，例如一个类中的注释写着“此类与类 X 相似，我们应考虑合并它们”。这不是类之间像继承那样的正式关系，但确实让我们对代码有了更深入的理解。另一个例子是相似的命名。在我们的持续示例中，`IsComplete()`
    和 `IsValid()` 既拥有正式关系（因为它们拥有相同的超类），在名称上也很相似，并在调用点扮演相似的角色。


    ### 基于参数的连接


    另一种可能存在于组件之间、需要一些手动检查的更非正式的关系类型是参数层面的关系。当功能组件频繁使用相同的参数时，它们就可以被连接起来，Fowler 称之为数据泥团。即使函数没有通过在类中分组而正式连接，它们仍然可能因为操作同一类型的对象而相似。例如，当你的代码库包含一个你写入信息的
    `Canvas` 对象时，多个类可以拥有使用该 `Canvas` 作为参数的方法，而这些方法之间并不相互调用。虽然这些方法缺乏正式连接，但它们确实存在关系，如果不手动检查方法声明，这种关系很难确定。


    ### 练习 2.3：检查参数


    检查练习 2-1 中你的代码库里函数或方法的参数。如果你已经完成了练习 2.2，可以直接复制所有函数行。现在将这些函数中出现的参数作为列标题列出，并在函数使用某个参数时在单元格中标记
    X。


    | 组件 | program_text | skulpt | URL | … |

    |---|---|---|---|---|

    | `parse` (F) | X | | | |

    | `execute` (F) | X | X | X | |


    此分析可能帮助你找到因为操作相同参数而相关联的方法模式，因此它们将在一列中共享许多 X。


    你可能想在练习 2.2 的表格中记录一些这些参数连接，特别是当参数有强烈重叠且功能相似时。


    '

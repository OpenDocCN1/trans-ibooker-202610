  trans: '

    一旦你列出了所有变量名，就可以开始更深入地探索领域。正如我们在练习 3.1 中所见，变量名通常由许多不同的部分组成，例如 `independentColorPoolPerBracketType`。


    变量名通常包含单独的部分，如 `quantifiers`（量词）、`programming concepts`（编程概念）和 `domain concepts`（领域概念）。


    # 量词


    `Quantifiers`（量词）是指代数量的名称部分，如 `count`、`number_of`、`maximum` 或 `filtered`。有时这些量词还包含被量化的对象，如
    `maximum_refund_per_month`。


    # 编程概念


    `Programming concepts`（编程概念）也会出现在名称中。例如，在 `m_object` 这样的名称中，`object` 可以指代语言中的特定概念。名称中指代概念的其他部分有
    `list`、`hash`、`table`、`string` 或 `number`。在本章中，我们暂不关注概念；那是第 4 章的主题。


    # 领域概念


    `Domain concepts`（领域概念）指向领域，如 `customer`、`import`、`parser`、`code` 或 `language`。变量名的某些部分指向概念，通常以名词形式出现，如
    `customer` 或 `code`，但它们也可以以动词形式表示 `domain behavior`（领域行为），如 `import` 或 `parse`。


    通过拆解名称，你可以初步了解代码库中涉及哪些概念和行为。


    # 自动提取领域概念


    除了手动方法，你还可以使用工具来提取领域概念。虽然文本分析工具通常用于文本，但它们也可以应用于代码。例如：<https://pypi.org/project/wordcloud/>


    一旦你收集了示例代码片段（或你正在调查的自己的文件或模块）中的所有名称，我们的下一步是确定代码中的哪些概念属于领域概念。因为如果我们想更好地理解领域，首先需要知道领域中有哪些概念。我们将从将变量名拆分为不同的单词开始，然后确定名称中的哪些单词是领域概念，这并不像你想象的那么简单。


    首先，有时甚至很难找到这些部分。例如，考虑名称 `getInlineClassName()`。我们是在获取 `Inline Class`（内联类）的名称？还是在获取
    `Class` 的 `Inline Name`（内联名称）？换句话说，`Inline` 是 `Class` 的属性还是 `Name` 的属性？你可能需要进一步阅读代码才能弄清楚！


    而且，即使你能找到所有部分，什么是领域概念也不总是清晰的。例如，名称 `ColorizedBracketPairsDecorationProvider` 可以拆分为五个单词：`Colorized`、`Bracket`、`Pairs`、`Decoration`
    和 `Provider`。


    然而，如果不进一步了解这段代码的功能，就很难分辨什么是编程概念，什么是领域概念：`Decoration` 和 `Provider` 可能指代编程概念，`Pairs`
    可能是一种数据类型，甚至 `Brackets` 也是代码中出现的东西。


    因此，我们可能需要收集更多关于代码功能的知识，以便为练习 3.2 做出一些判断。看看你能理解多少，不要过度思考。如果你不确定，可以随意将概念放入 `Unclear`（不确定）列。


    ## 练习 3.2：区分名称中的不同部分


    从练习 3.1 的变量列表中，提取变量名中的单个单词，并将它们分为量词、编程概念和领域概念。如果你不确定，就把概念放在 `Unclear` 列中。


    | 名称 | 量词 | 编程 | 领域 | 不确定 |

    | --- | --- | --- | --- | --- |

    | `ColorizedBracketPairsDecorationProvider` | | | `Provider` | `Colorized`, `Bracket
    Pair`, `Decoration` |

    | | | | | |


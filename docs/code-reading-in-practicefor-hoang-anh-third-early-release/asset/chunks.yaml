    99% 的程序。表 4.X 描述了变量在程序中可以扮演的不同角色。


    | Role | Description | Example | How to recognize this role |

    | --- | --- | --- | --- |

    | Fixed value | 一个在初始化后值不再改变的变量扮演固定值的角色。 | 固定值变量的例子包括数学常量如 `pi`，或从文件或数据库读取的数据。
    | 在某些语言中常量可以被显式表达（如果值被改变会抛出错误），在其他语言中命名约定可能暗示常量值，如 Python 中的大写。但常量也可能只是一个初始化一次然后只赋值的变量。
    |

    | Stepper | 在循环迭代时，总有一个变量遍历一系列值。这就是步进器的角色，其值在迭代开始时就可以预测。 | 遍历 `for` 循环的变量 `i`
    是典型的步进器，但更复杂的步进器也是可能的，例如每次迭代都从 `i` 开始的内层循环变量 `j`。 | 通常是与循环一起使用的整数 `i`、`j`、`m`
    或 `n`。 |

    | Flag | 一个用于指示某事已发生或为真的变量。 | 典型例子有 `is_set`、`is_available` 或 `is_error`。标志通常是布尔值，但也可以是整数甚至字符串。
    | 标志通常可以从变量名识别，指示状态，如 `is____` 或 `has____`。标志也常用于条件中，直接使用（`if is_set`）或带等值检查（`if
    value == "set"` 或 `1`，针对非布尔标志）。 |

    | Walker | 走者也遍历数据结构，类似于步进器。区别在于遍历数据结构的方式。步进器总是遍历预先已知的一系列值。而走者是以在循环开始前未知的方式遍历数据结构的变量。
    | 取决于编程语言，走者可以是指针或整数索引。走者可以遍历列表（例如在搜索中），但更常遍历栈或树等数据结构。 | 当我们不知道它们将遍历的确切值集合时，走者可用于循环（如搜索），或与链表等数据结构相关联，用于查找应添加新元素的位置。
    |

    | Most recent holder | 一个在遍历一系列值时保存最近遇到的值的变量是最近持有者。 | 例如，它可能存储从文件读取的最新行，即 `line

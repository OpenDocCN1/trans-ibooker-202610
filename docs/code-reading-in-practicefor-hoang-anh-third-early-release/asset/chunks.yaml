    如果在检查代码关系时发现了死代码，在验证其确实不再需要后，你可能想要移除这些死代码。


    ## 总结


    代码可以从不同维度阅读：结构、领域、概念、上下文和协作。本章探讨了结构维度，分析了代码中的变量、函数和对象如何相互关联，以及如何在阅读代码时利用这些信息。下一章将探讨领域。


    ^(1) 参见 Teresa Busjahn 等人（2015）的《Eye Movements in Code Reading: Relaxing the Linear
    Order》（代码阅读中的眼动：放宽线性顺序），https://ieeexplore.ieee.org/document/7181454。


    ^(2) 例如参见：https://medium.com/nerd-for-tech/how-to-generate-uml-diagrams-from-your-existing-code-814d27bd1537


    ^(3) https://www.sciencedirect.com/science/article/pii/S1045926X02902375&sa=D&source=docs&ust=1658912480042497&usg=AOvVaw3mvAJmKBMgrgVt4HM9Ez13


    # 第 2 章 深入理解代码的业务领域


    上一章在不深入代码内容的情况下考察了代码中的关系。本章将反其道而行之，在不考察连接方式的情况下审视代码内容。我们将专门关注代码业务领域内的术语和概念，换句话说，就是代码所要解决的现实问题。


    当你阅读陌生信息（如陌生代码）时，你的大脑会同时进行许多不同的活动。你试图利用工作记忆去*理解*结构，以及所有部分如何相互关联。在上一章中，我们学习了在考察关系时支持工作记忆的技巧。


    但你也会在*回忆*已存储在长期记忆中的信息。并行做这些事非常消耗精力，会增加理解代码的难度。因此，在进行调试或审查等更复杂的活动之前，专注于陌生代码片段中的领域概念，并确认没有困惑，这一点很重要。


    本章并非对所有代码阅读目的都有用。如果你正在处理一个领域对你非常熟悉的代码库，例如因为你在某个领域（如保险或养老金）工作了很长时间，领域概念不会让你的大脑不堪重负。但如果你刚开始接触新客户的代码库，或者试图了解一个使用新术语的开源项目，从代码中考察和学习领域概念将极大地减轻后续与代码打交道的难度。


    因此，本章仅考察代码中存在的业务领域概念。此处的领域是指代码的业务领域或问题。编程领域将在第 4 章介绍。考察领域概念很有用，因为如果你错过了对代码中词汇确切含义的透彻理解，就很难整体理解代码。这与你的长期记忆有关，正如第
    2 章所讨论的：如果你缺乏一些先验理解，记忆和分析代码将比必要时困难得多。


    变量、方法或函数名可以成为代码领域方面的重要信息来源，因为它们通常包含领域中使用的词汇。在《*企业应用架构模式*》一书中，Martin Fowler 将领域模型描述为包含两个组成部分：行为和数据。^(1)
    变量中出现的词汇通常指向数据或行为：动词通常指代行为，而名词指代对象。因此，从某种意义上说，在本章中你将关注对象及其功能，但你将从名称而非代码结构中收集信息。


    本章的练习和技巧因此仅关注代码的领域方面，帮助你回答诸如以下问题：该代码库中的核心领域概念是什么？它们如何相互关联？


    读完本章后，你将掌握 X 种技巧，可用于更深入地理解代码库的领域：


    *   列出所有变量名

    *   识别变量名的不同部分

    *   查看命名模式


    ## 贯穿示例


    正如上一章一样，本章我们将使用一个示例代码片段。即使它看起来完全令人不知所措，也别担心！我们将逐步讲解。


    ### 示例代码：Monaco Editor 中的括号着色

    '

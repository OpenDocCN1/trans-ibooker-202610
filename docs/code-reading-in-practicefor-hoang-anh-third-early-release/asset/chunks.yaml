- raw: "In Chapter 3 you created a concept map based on what you gathered from the\
    \ code. As I explained then, your brain also stores concepts more like a map than\
    \ like a list. Therefore it can be very useful to again create a concept map of\
    \ the concepts and their relationships. Enrich the map with the sources of information\
    \ so it will help you to revisit or refine information when needed.\n\n# After\
    \ reading\n\nIn this chapter you have learned techniques to more deeply understand\
    \ the context of a code base. If you have applied the exercises and techniques\
    \ of this chapter to a code base you are working with, you can again share the\
    \ information you have learned within the code base itself. You might be surprised\
    \ how little connection there is between the documentation and the code in many\
    \ projects. I can tell you that while writing this book, the documentation in\
    \ my own open-source repository has improved significantly after following my\
    \ own advice!\n\n## Improve the glossary with a beginner’s eye\n\nWhile I was\
    \ examining the SWA Corona Warn App, a domain I was not knowledgeable in at all,\
    \ it took me quite a while to deeply understand the concepts and make the relevant\
    \ connections into the code. If you are reading another code base in a similar\
    \ way, using similar techniques, I can guarantee you that it would be very useful\
    \ to the project maintainers if you would share what you have learned in the documentation.\
    \ When you are an expert, you suffer from what we call the Curse of Expertise.\
    \ When you know or understand something, it becomes almost inconceivable to you\
    \ that someone might not know the things you know! So improving project documentation\
    \ with fresh eyes can be very valuable.\n\n## Discuss documentation quality\n\n\
    An easier way to contribute might be to help maintainers understand the quality\
    \ of the current documentation. For example, sharing the list of questions that\
    \ remained after reading the code and initial documentation gives relevant pointers\
    \ toward where documentation could be improved. Also sharing the sources of relevant\
    \ information can be very helpful for maintainers. In our example repository I\
    \ am sure the maintainers would like to know how much I learned from the PR documenting\
    \ the teletan meaning, and move some of that to the documentation.\n\n## Expand\
    \ code comments\n\nIn other chapters you gathered information from the code, and\
    \ then added it to the documentation, but in this chapter, you read documentation\
    \ outside of the code, which you could commit back into the code base. For example,\
    \ you could take information from an existing glossary or definition list and\
    \ add it to the code.\n\nIn our example snippet, the addition of one line of comment\
    \ would have made it a lot easier to understand what is happening.\n\nThe original\
    \ code read:\n\n```\nval teletan = currentTan.value\n       if (!teletan.isTanValid)\
    \ {\n           Timber.w(\"Tried to set invalid teletan: %s\", teletan)\n    \
    \       return\n       }\n```\n\nBut you could expand it like this:\n\n```\nval\
    \ teletan = currentTan.value\n// The server returns a TeleTan based on the received\
    \ TAN value \n       if (!teletan.isTanValid) {\n           Timber.w(\"Tried to\
    \ set invalid teletan: %s\", teletan)\n           return\n       }\n```\n\n# Summary\n\
    \nCode can be read in different dimensions, including looking at the structure,\
    \ the domain and the programming concepts. This chapter explored the context of\
    \ a code snippet.\n\n# Chapter 5. Reading for code reviews\n\nCode reviews are\
    \ a well established practice in the software industry these days. A *code review*\
    \ is a quality assurance step in the software development lifecycle. A lot of\
    \ companies put them right before merging code changes back to the trunk, also\
    \ referred to as the main or master branch, when using a version control like\
    \ git. It often has a blocking quality when implemented like this, meaning that\
    \ the code changes cannot be merged back without a code review being performed.\n\
    \nThe main activity of a reviewer during a code review is reading. Just as with\
    \ code reading, nobody is taught how to do a proper code review. You learn it\
    \ along the way. In this chapter, I will walk you through my approach to a code\
    \ review and highlight some tips and tricks on finding issues that can tamper\
    \ with the future readability of code.\n\n# How to do a code review?\n\nAlthough\
    \ it is a well established practice, a code review is not a well defined practice\
    \ in our industry. It can be an individual activity where reviewers give feedback\
    \ asynchronously. It can also be a pairing activity where the author of the code\
    \ walks the reviewer(s) through the implementation while discussing and changing\
    \ the feedback immediately.\n\nEvery company I (Gien) have worked for, did their\
    \ code reviews differently. When there were testers on the team, manual testing\
    \ was not part of the review the software developer did. When there were no testers,\
    \ testing was the main reason code reviews existed. Some companies had a standardized\
    \ way of doing code reviews, but not all of them. When there was no formal structure\
    \ for the code review, each code review I requested was done differently, depending\
    \ on the person picking up the request.\n\nIt also depended on the *continuous\
    \ integration (CI)* practices of the company. Some companies had automated quality\
    \ assurance as part of the CI pipeline, others didn’t. I worked for companies\
    \ where automated testing was limited or absent, and in those companies the main\
    \ reason for code reviews was also testing.\n\nFor me, the purpose of a code review\
    \ is twofold: to find improvements in the code and to distribute knowledge in\
    \ the team. Everything else is out of scope. Here are some things to keep in mind\
    \ when structuring a code review:\n\n*   A code review is not a control mechanism\
    \ to make sure developers follow the code conventions.\n\n*   It is not a technique\
    \ to educate “junior” developers on the team.\n\n*   Code reviews are a bad way\
    \ to add testing to your development lifecycle.\n\n*   Refactoring the code to\
    \ implement those improvements does not have to be part of a code review.\n\n\
    If you want quality assurance, you shouldn’t implement elaborate code reviews\
    \ as a blocking step in your CI pipeline. Code reviews itself should be an ongoing\
    \ process that can be done at any time: before, during or after you make code\
    \ changes. You should automate code conventions, bug detection and testing. This\
    \ is sometimes referred to as continuous code quality.\n\nWhether you are fixing\
    \ a bug, adding a new feature or refactoring code, you should create the merge\
    \ request (MR) the moment you start to make a code review possible for your team\
    \ members. You should add enough information to your MR so that your team members\
    \ can understand what you will be changing and how you will change it.\n\n# Automating\
    \ parts of the code review\n\nStarting out with a language or figuring out how\
    \ to use new features in a new version of it, can be a challenge. This is why\
    \ most programming languages offer recommendations for code conventions. The guidelines\
    \ are basically a statement of their creators on how to use the language best.\
    \ For example, Microsoft offers best practices for naming conventions, code layouts,\
    \ comments, security, and general language guidelines.\n\nFor example, we already\
    \ mentioned in chapter 2 that Python classes are written in snake\\_case. That\
    \ is an example of a naming convention. C# has a different naming conversion for\
    \ classes, PascalCase, where you use an uppercase letter for every word in your\
    \ class. “Leave a blank line between two methods” is an example of a code layout\
    \ convention. You can have a look at all of them here: [https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/coding-style/coding-conventions](https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/coding-style/coding-conventions)"

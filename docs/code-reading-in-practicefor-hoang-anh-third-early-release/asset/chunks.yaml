- raw: "And behaviour that you can learn from is more expansive than just naming.\
    \ Syntax can also be a rich source of understanding. Many syntactic elements are\
    \ connected to concepts, for example, a variable that is used with a dot notation,\
    \ like var.children indicates that var is something like and an object or class\
    \ with fields that you can access. children\\[0\\] means that children is a list\
    \ or array in most programming languages. If you are familiar with the programming\
    \ language, of course these things are not hard to recognize. But it has been\
    \ my experience reading code myself and reading code with others in code reading\
    \ workshops that in a setting where cognitive load is really high, like reading\
    \ an unknown code base, even in a known language, you have to pay deliberate attention\
    \ to these hints or they are easily missed.\n\nFurthermore, these syntactic concepts\
    \ are usually very programming language dependent, so reading them with full attention\
    \ in a code base in a language you are less familiar with is even harder . For\
    \ example, in C++, if you see a type with an asterisk, like mobj\\_t\\* thing\
    \ and field acces with thing->flags it is sensible to conclude that the variable\
    \ thing is a pointer. But this requires knowledge of C like languages, and if\
    \ you are familiar with . style access, retrieving the memory that -> also indicates\
    \ field access can be harder than you think, even if you know it well! (see the\
    \ next sidebar).\n\nThis again underlines how important it is to have a solid\
    \ understanding of a programming language’s syntax when you read code. One symbol\
    \ like an asterisk is easily missed but radically changes your view on the type\
    \ of the variable and thus on the concepts in the code base.\n\n## Exercise 4.2\
    \ Examine concepts in all variable names in the codebase\n\nFor this exercise,\
    \ write down the operations that are applied to the variables in the codebase.\
    \ Which programming concepts can you find in the operations?\n\n| Variable name\
    \ || Operations connected to the name || Programming concept(s) |\n\n| --- | ---\
    \ | --- |\n\n| *.update()* || *res.update(matches)* || *dictionary* |\n\n| ---\
    \ | --- | --- |\n\n| *\\[0\\]* || *return \\_get\\_template\\_name(var.children\\\
    [0\\])* || *list* |\n\n|   ||   ||   |\n\n|   ||   ||   |\n\n|   ||   ||   |\n\
    \n|   ||   ||   |\n\n# Using roles of variables to gain a deeper understanding\n\
    \nVariable names can give you a great impression of the concepts in the code base,\
    \ but there is even more you can learn about concepts from variables alone. A\
    \ great way to gain a deeper understanding of what concepts a piece of code uses\
    \ is examining it using the **roles of variables** framework.\n\nRoles of variables,\
    \ as described by Jorma Sajaniemi at the University of Eastern Finland, is a framework\
    \ that gives precise names to the different ways that variables are used in code.\n\
    \nFor example a variable i in a loop like for i in range(classes): is not just\
    \ a variable, or even an integer, it has a more specific role and that is of traversing\
    \ the elements of the range one by one. Even without seeing the body of the loop,\
    \ you can say with some certainty that the i will be used to index the list classes.\
    \ If you see another integer variable called max\\_class\\_size, it will have\
    \ different connotations for most programmers, even not having seen anything else.\
    \ Such a variable is not likely to be used to index a list but will likely hold\
    \ a value representing the highest number of students in a class.\n\nWhile most\
    \ programmers will know and understand these variables do different things, roles\
    \ of variables gives us a precise vocabulary to consider the differences. For\
    \ example, i in the above example is a **stepper**, a variable stepping through\
    \ a list of values that is fixed, while max\\_class\\_size is a **most-wanted\
    \ holder**, a variable that stores a value that has been searched for.\n\nSajaniemi^([1](#ch03.html#id144))\
    \ describes 11 different roles that cover most of the programs that you will encounter\
    \ day to day. His research has even shown that the 11 roles cover 99% of programs\
    \ that novices will write. Table 4.X describes the different roles that variables\
    \ can play in a program.\n\n| Role || Description || Example || How to recognize\
    \ this role |\n\n| --- | --- | --- | --- |\n\n| Fixed value || A variable whose\
    \ value does not change after initialization plays the role of a fixed value.\
    \ || Examples of fixed-value variables include mathematical constants like pi,\
    \ or data read from a file or database.  \n\n || In some languages constants can\
    \ be expressed (and an error will be thrown if the value is changed) in other\
    \ languages the naming convention might give a hint a constant value is meant,\
    \ such as uppercase in Python. But a constant might also simply be a variable\
    \ that is initialized once and then only assigned to. |\n\n| --- | --- | --- |\
    \ --- |\n\n| Stepper || When iterating in a loop, there is always a variable stepping\
    \ through a list of values. That is the role of the stepper, whose value can be\
    \ predicted as soon as the interaction starts. || A variable i that iterates over\
    \ a for loop is the canonical stepper, but more complicated steppers are also\
    \ possible, such as an inner loop variable j start starts at i each iteration.\
    \ || Is often an integer i  \n\nor j or m or n that is used in conjunction with\
    \ a loop. |\n\n| Flag || A variable used to indicate that something has happened\
    \ or is the case. || Typical examples are is\\_set, is\\_available, or is\\_error.\
    \ Flags are often Booleans, but they can be integers or even strings. || Flags\
    \ are often recognizable from the variable name that indicates a state, like is\\\
    _\\_\\_ or has\\_\\_\\_\\_. Flags are also often used in conditions, either directly\
    \ (if is\\_set) or with an equality check (if value == “set” or 1) in the case\
    \ of a non-Boolean flag. |\n\n| Walker || A walker also traverses a data structure,\
    \ similar to a stepper. The difference lies in the way the data structure is traversed.\
    \ A stepper always iterates over a list of values that are known beforehand. A\
    \ walker, on the other hand, is a variable that traverses a data structure in\
    \ a way that is unknown before the loop starts. || Depending on the programming\
    \ language, walkers can be pointers or integer indices. Walkers can traverse lists,\
    \ for example in a search, but more often traverse data structures like a stack\
    \ or a tree.  \n\n || Walker can be used in loops when we do not know the precise\
    \ set of values that they will iterate over, such as in a search, or can be connected\
    \ with data structures like a linked list, where it is used to find the position\
    \ where a new element should be added. |\n\n| Most recent holder || A variable\
    \ that holds the most-recent value encountered in going through a series of values\
    \ is a most recent holder. || For example, it might store the latest line read\
    \ from a file, i.e. line = file.readline(), or a copy of the array element last\
    \ referenced by a stepper element = list\\[i\\]. || Most recent holders can only\
    \ occur within a loop body, and they will be updated in each iteration of the\
    \ loop. |\n\n| Most wanted holder || Often when you are iterating over a list\
    \ of values, you are doing that to search for a certain value. The variable that\
    \ holds the result of this search, or the best value found so far, is what we\
    \ call a most wanted holder.  \n\n || Examples of a most wanted holder are a variable\
    \ that stores a minimum value, a maximum value, or the first value meeting a certain\
    \ condition. || Like most recent holders, most wanted holders can also only occur\
    \ within a loop body, but they will only be updated under certain conditions,\
    \ when a value is found matching the search better (i.e. a value higher than the\
    \ currently stored maximum) |\n\n| Gatherer || A gatherer is a variable that collects\
    \ data and aggregates it into one value. || This can be a variable that starts\
    \ at zero and collects values while iterating through a loop, like this:  \n\n\
    sum = 0  \n\nfor i in range(list):  \n\nsum += list\\[i\\]  "

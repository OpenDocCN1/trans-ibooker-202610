    \ in the gutter next to the code, which will create a breakpoint indicated by\
    \ a red dot as shown in `Figure 2-6`.\n\n![](assets/structural_examination_672754_09.png)\n\
    \nOnce you have placed the breakpoint, you can follow the execution path using\
    \ the IDE to step into each of the called functions. Again, your instincts might\
    \ be to dive into each method in detail and read all the inner workings. But at\
    \ this level of reading, the concrete goal is to scratch the surface of the code\
    \ and not go too much deeper, so as not to tax your working memory. Don't worry,\
    \ that phase will come later!\n\nA good strategy at this point is to try to contextualize\
    \ the relationships that you have, summarizing the why of the relationship in\
    \ one or two sentences.\n\n### Exercise 2.4\n\nFollow the call stack of your chosen\
    \ entry point and read from there. Fill the table with the relationship types\
    \ between the functions. Describe the role of the dependency in one or two sentences.\n\
    \n| Component | `parse (F)` | `execute (F)` | `validate_tree(F)` |\n| --- | ---\
    \ | --- | --- |\n| `parse (F)` | | | `calls the validate_tree() function to determine\
    \ if the parse tree can be processed` |\n| `execute (F)` | `calls the parse()\
    \ function to obtain the transpiled code which then can be executed` | | |\n|\
    \ `validate_tree(F)` | | | |\n\nYou can find the dependencies manually or using\
    \ the IDE. While using the IDE can feel easier, stepping through the code can\
    \ be useful but is also likely to be overwhelming. If the IDE will step into a\
    \ piece of code that is located far away from the current line, you will have\
    \ to reorient yourself in the codebase again, and you will easily lose track.\
    \ This is especially true if there are pieces of code in which multiple execution\
    \ paths come together, like when a function gathers information from several other\
    \ methods and combines them. For example, the function `print_ask_args` below\
    \ first checks the variables in all arguments (and throws if that is not possible)\
    \ and then transforms each of the arguments in the next line.\n\n```python\ndef\
    \ print_ask_args(self, args):\n   args = self.check_var_usage(args)\n   transformed_args\
    \ = [self.process_variable_for_fstring(a) for a in args]\n   return ''.join(transformed_args)\n\
    ```\n\nIn such complex cases, manual reading aided by search might be less demanding\
    \ and thus more effective than \"hopping\" through the code using the IDE using\
    \ breakpoints.\n\nIn addition to making notes in a dependency table (see `Exercise\
    \ 2.3`), visualizations as Unified Modeling Language (UML) class diagrams like\
    \ the one in `Figure 2-X` can help support this type of code reading as well.\
    \ In a class diagram we described the classes in a system as boxes containing\
    \ their fields and methods. For example in `Figure 2-X`, `Client`, `Receiver`,\
    \ `Invoker`, `Command` and `ConcreteCommand` are classes and `execute()` is a\
    \ method of `Command` and `ConcreteCommand`.\n\n![](assets/structural_examination_672754_10.png)\n\
    \nIf you are looking for specific information, it is especially important to keep\
    \ an eye on your history, and determine if what you are reading is helping you\
    \ to answer concrete questions about the code.\n\n## Different Kinds of Entry\
    \ Points\n\nYour prior knowledge of a code base will impact what entry point to\
    \ use, as well as the activities you are performing. For example, when you are\
    \ looking at a codebase that is quite unfamiliar to you, starting at a generic\
    \ entry point like a `main` method can be helpful because it helps you build a\
    \ mental model of what happens in the code in the order that it will happen at\
    \ runtime too.\n\nBut in a more familiar code base, it is more likely that you\
    \ will start with a context-specific entry point, and which type depends on the\
    \ activity. For example, while debugging, a failing test will be a natural entry\
    \ point to start your reading process from. Later in this book, in `Chapter X`\
    \ we will dive into the process of code reading when debugging is depth. While\
    \ optimizing, a line flagged by the profiler is a good place to start. Later chapters\
    \ of this book, particularly in `Part 2`, will dive into different types of reading\
    \ scenarios with different types of entry points.\n\n# After the Read\n"
  trans: "\n最后，当你手动进行任何类型的分析时，可能会想要深入研究代码，但在这个阶段，最好试着将自己限制在寻找依赖关系上。后续章节将介绍其他练习，涉及名称、代码质量以及代码的其他方面。\n\
    \n# 自顶向下阅读\n\n现在我们已经对代码库及其组件有了初步的基本了解，是时候进行一次自顶向下的阅读了，且不依赖 IDE 功能。虽然 IDE 可以帮助阐明依赖关系，但从头到尾阅读整个代码片段也非常有用，因为这样你可以建立一个更完整的代码模型。但给这个活动设定时间限制很重要，否则你会陷入“兔子洞”，因缺乏理解而感到沮丧。例如，用\
    \ 10 分钟时间，在这段时间内阅读代码。随身携带你的图表，并记下任何新信息。\n\n# 入口点\n\n现在你已经对不同组件及其相互关系有了一些初步了解，是时候制定一个阅读代码的计划了。你将首先通过定位一个\
    \ `entry point`（入口点）来做到这一点。入口点是你开始阅读的地方。\n\n阅读代码有多种不同的方式，我将在本书后面的第 Z 部分进行讨论。现在，让我们专注于通过跟随代码的执行流来阅读。\n\
    \n## 寻找入口点\n\n虽然不总是清楚陌生代码从哪里开始，但通常你可以猜测代码中有几个地方是执行开始的地方，比如类 C 语言中的 `main()` 方法、Python\
    \ 中受 `if __name__ == \"__main__\":` 保护的代码，或 Web 应用程序中与 `/index` 路由相关的方法。如果你对启动方法的名称有很好的猜测，可以通过文本搜索找到通用的入口点。例如，在许多\
    \ C 程序中可能是 `main`，在 MVC 应用中可能是 `controller`，或 Web 应用的默认路由如 `/index.html`。单元测试也可以作为极好的入口点，但我们将在本书后面深入探讨专门阅读测试代码的内容。\n\
    \n然而，有时你缺乏关于执行从何处开始的良好猜测。在这种情况下，你可以使用像 `Exercise 2.2` 中构建的表格来帮助寻找另一个入口点。首先，忽略对象和单例组件，只关注功能组件的行和列。现在看看那些列为空或几乎为空，但行却很满的功能组件。这些是不被调用或几乎不被调用，但会调用许多其他函数的功能组件，因此可以作为开始探索的有趣切入点。\n\
    \n## 从入口点开始阅读\n\n现在你已经确定了一个入口点，可以开始构建代码其余部分的心智模型。你可以再次利用 IDE 来帮助理解代码依赖关系，方法是在入口点设置断点，并逐步进入每个依赖的代码块，检查你感兴趣的代码\
    \ `slice`（切片）。切片是与特定函数或变量相关的代码部分，正是该变量被使用的部分或该函数所引导的部分。\n\n如果你想逐步执行代码的一个 `slice`，在大多数\
    \ IDE 中，你可以设置一个断点，使代码在执行到达断点时停止。你可以通过点击代码旁边的边栏来实现，这将创建一个由红点指示的断点，如 `Figure 2-6`\
    \ 所示。\n\n![](img/structural_examination_672754_09.png)\n\n一旦设置了断点，你就可以使用 IDE 逐步进入每个被调用的函数，以跟随执行路径。同样，你的本能可能是深入研究每个方法的细节并阅读所有内部工作原理。但在这个阅读层面，具体目标是浅尝辄止地了解代码，不要走得太深，以免过度占用你的工作记忆。别担心，那个阶段稍后会到来！\n\
    \n此时一个好的策略是尝试将你拥有的关系情境化，用一两句话总结依赖关系的“为什么”。\n\n### Exercise 2.4\n\n跟随你选择的入口点的调用栈并从那里开始阅读。用函数之间的关系类型填充表格。用一两句话描述依赖关系的作用。\n\
    \n| Component | `parse (F)` | `execute (F)` | `validate_tree(F)` |\n| --- | ---\
    \ | --- | --- |\n| `parse (F)` | | | `调用 validate_tree() 函数以确定解析树是否可被处理` |\n|\
    \ `execute (F)` | `调用 parse() 函数以获取转译后的代码，随后可执行` | | |\n| `validate_tree(F)` |\
    \ | | |\n\n你可以手动查找依赖关系，也可以使用 IDE。虽然使用 IDE 可能感觉更容易，但逐步执行代码可能有用，也很容易让人不知所措。如果 IDE\
    \ 会步入远离当前行的代码片段，你将不得不在代码库中重新定位自己，并且很容易迷失方向。当多条执行路径汇聚在一起的代码片段中，这种情况尤其明显，比如当一个函数从其他几个方法收集信息并将它们组合时。例如，下面的函数\
    \ `print_ask_args` 首先检查所有参数中的变量（如果不可能则抛出异常），然后在下一行转换每个参数。\n\n```python\ndef print_ask_args(self,\
    \ args):\n   args = self.check_var_usage(args)\n   transformed_args = [self.process_variable_for_fstring(a)\
    \ for a in args]\n   return ''.join(transformed_args)\n```\n\n在这样复杂的情况下，辅以搜索的手动阅读可能比使用断点在\
    \ IDE 中“跳跃”式地阅读代码要求更低，因此更有效。\n\n除了在依赖表中做笔记（见 `Exercise 2.3`），统一建模语言（UML）类图等可视化图表（如\
    \ `Figure 2-X` 所示）也可以帮助支持这种类型的代码阅读。在类图中，我们将系统中的类描述为包含其字段和方法的框。例如在 `Figure 2-X`\
    \ 中，`Client`、`Receiver`、`Invoker`、`Command` 和 `ConcreteCommand` 是类，`execute()`\
    \ 是 `Command` 和 `ConcreteCommand` 的方法。\n\n![](img/structural_examination_672754_10.png)\n\
    \n如果你在寻找特定信息，特别重要的是要留意你的历史记录，并判断你正在阅读的内容是否有助于回答关于代码的具体问题。\n\n## 不同种类的入口点\n\n你对代码库的先验知识将影响使用哪种入口点，以及你正在执行的活动。例如，当你查看一个对你来说相当陌生的代码库时，从像\
    \ `main` 方法这样的通用入口点开始可能会有帮助，因为它能帮助你按照运行时发生的顺序，建立代码中发生什么的心智模型。\n\n但在一个更熟悉的代码库中，你更有可能从一个上下文相关的入口点开始，具体类型取决于活动。例如，在调试时，一个失败的测试将是开始阅读过程的自然入口点。本书后面的\
    \ `Chapter X` 我们将深入探讨调试时的代码阅读过程。在优化时，性能分析器标记的行是一个好的起点。本书后面的章节，特别是 `Part 2`，将深入探讨具有不同入口点类型的不同阅读场景。\n\
    \n# 阅读之后\n"

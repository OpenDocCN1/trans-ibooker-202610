    \      .filter((c) => !!c)\n       .filter(c => !c.isTransparent());\n   for (let\
    \ level = 0; level < 30; level++) {\n       const color = colorValues[level %\
    \ colorValues.length];\n       collector.addRule(`.monaco-editor .${colorProvider.getInlineClassNameOfLevel(level)}\
    \ { color: ${color}; }`);\n   }\n});\n```\n\n## Reading the example snippet\n\n\
    This chapter will contain specific exercises to help you engage with the example\

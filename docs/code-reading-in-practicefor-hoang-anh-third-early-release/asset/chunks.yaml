  trans: '


    # 代码组件的三种类型


    1.  首先是 `object components`（**对象组件**），用于创建有意义的抽象。代码中的对象组件示例包括用户创建的数据类型、结构体或类。在贯穿示例中，`IsComplete`
    是一个对象。在本书的其余部分，我们将使用 Python 命名约定，因此对象（如类）将采用 `PascalCase` 写法。


    2.  还有 `functional components`（**函数组件**），执行逻辑在其中被分组，例如方法或函数。在我们的示例中，`is_program_complete()`
    是一个方法。本书其余部分的约定是，在函数和方法名称末尾加上 `()` 以示区分。


    3.  最后，代码可以包含 `singular components`（**独立组件**），即不包含在对象或函数组件中的变量或常量，例如 `command_make_color`。我们将在本书其余部分使用
    Python 命名约定，因此变量等将采用 `snake_case` 写法。


    # 不同范式中的组件


    这三种组件在不同编程语言中以不同形式出现，并非所有语言都支持这三种对象。例如，对象当然常见于面向对象语言，但这些语言传统上不允许在类外部定义变量，因此没有位于对象或函数组件之外的变量或常量。


    函数组件当然是函数式语言中使用的核心组件。在面向对象语言中，函数组件以类内部方法的形式出现。


    在大多数纯面向对象语言（如 Java 或 C#）中，独立组件是不可能存在的，非对象的组件必须存在于类中，因此类外部没有独立变量。在类内部，它们以字段的形式出现。在函数式语言中，变量可以随时声明，无论是在函数内部还是外部。


    如今，许多语言允许多种范式共存，包括函数式和面向对象，例如 Python 或 JavaScript。在这些语言中，所有三种组件都可以（且通常会）同时存在。


    # IDE 对结构化阅读的支持


    虽然集成开发环境（IDE）主要是为编写代码设计的，但它们也包含许多有助于阅读代码的功能。许多 IDE 支持代码折叠功能，通过仅显示函数、方法或循环的摘要视图而非其实现细节，帮助管理阅读时的复杂度。对于方法/函数或类，最小化视图将显示其定义，包括方法/函数的参数，以及类的继承信息。对于循环，通常完整显示包含循环代码（`for`、`while`、`forEach`）的那一行，而隐藏循环体。


    ## 代码折叠


    在大多数情况下，代码折叠通过 `gutter`（**边栏**，通常位于代码旁并包含行号的侧边栏）中的一个小减号来完成，如图 2-1 所示。许多 IDE 也有折叠代码的快捷键。在
    JetBrains IDE（如 PyCharm 或 CLion）中，`ctrl`（Windows）或 `command`（Mac）配合 `-` 或 `+`
    可折叠或展开当前代码块，而 `ctrl`（Windows）或 `command`（Mac）配合 `shift` 和 `-/+` 可折叠或展开文件中的所有内容。


    `Ctrl+NumPad - / Ctrl+NumPad +` 。PyCharm 折叠或展开当前代码片段，例如单个方法。要折叠或展开所有代码片段，请按 `Ctrl+Shift+NumPad
    - / Ctrl+Shift+NumPad +`。


    ![](img/structural_examination_672754_02.png)


    这是一种在不被细节淹没的情况下查看组件的绝佳方式。然而，这种视图使得难以看出单个组件的大小，这可能会限制你对代码库的洞察，因为大小可以作为优先级的有用指标。较大的函数在代码库中往往比较小的函数扮演更重要的角色。你可以通过查看行号来绕过这一限制。例如，图
    2-2 显示了一个从第 86 行开始、共 12 行的常量赋值，以及一个位于第 99 行、包含 52 行的方法定义。


    ![](img/structural_examination_672754_03.png)


    虽然这可能看起来令人惊讶，但以这种折叠方式阅读代码已经能帮助你获得初步理解。例如，折叠视图会向你展示有哪些组件、它们的类型是什么、不同类型的组件各有多少，以及它们的大小如何相互比较。


    ## 结构视图


    查看代码中所有组件的另一种方法是使用许多 IDE 都包含的结构视图。该视图如图 2.1 所示，展示了三种类型组件的概览：用蓝色标记并带 C 字母的对象、用黄色标记并带
    v 字母的独立变量，以及用粉色标记并带 f 字母的函数。


    ![](img/structural_examination_672754_04.png)


    类可以展开，显示内部的方法，如图 2.2 所示。方法也用粉色标记，但字母为 m 而非 f。


    ![](img/structural_examination_672754_05.png)


    ## 练习 2.1：列出所有组件


    打开 Hedy 仓库，导航到 `hedy.py` 文件。上述代码片段位于：`https://github.com/hedyorg/hedy/blob/ba6834b4a46edf1aac67c9d9e017bc279535062a/hedy.py#L2861`。给自己一点时间熟悉环境，然后仅查看组件。该代码片段包含哪些对象组件（类或结构体）？代码中有哪些函数组件（方法或函数）？组件有多大？它们的大小看起来平衡吗？有没有特别大或特别小的组件引起你的注意？代码中包含哪些独立组件（变量、常量）？


    填写下表以指导你的阅读。在本练习及本书后续所有练习中，部分字段已用*斜体*填写，以帮助你入门。


    ### 对象组件


    | 组件名称 | 代码行数 | 大小（小/中/大） |

    | --- | --- | --- |

    | `ParseTree` | 267 | 大 |

    | `Variable` | 53 | 小 |

    |   |   |   |

    |   |   |   |


    ### 函数组件


    | 方法/函数名称 | 代码行数 | 大小（小/中/大） |

    | --- | --- | --- |

    | `parse()` | 121 | 大 |

    | `execute()` | 53 | 中 |

    | `checht_parse_tree()` |   |   |


    ### 独立组件


    | 变量名 |   |   |

    | --- | --- | --- |

    | `characters_that_need_escaping` |   |   |

    | `character_skuplt_cant_parse` |   |   |

    |   |   |   |


    # 组件间的关系


    现在已经确定了代码的核心三大组件，理解它们之间的关系就变得很重要。同样，可能会很想直接开始阅读代码以详细调查其功能，但在不看代码功能的情况下，从组件如何关联中仍能学到很多。第
    X 章概述了许多检查代码细节的技术。


    代码结构维度的一个重要部分不仅是组件本身，还有它们相互连接的方式。要理解代码中关系的重要性，你需要更多地了解人们通常如何处理新信息。在理解新信息时，你的大脑总是试图将新信息与你已知或已理解的事物联系起来。因此，你的大脑会形成一个信息的心智模型，供你用来推理新信息。显式地使信息间的联系可见，将帮助你的大脑更轻松地理解。



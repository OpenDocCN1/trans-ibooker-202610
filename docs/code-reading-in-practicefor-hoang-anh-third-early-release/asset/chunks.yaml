  fmt: '

    Once you have listed all variable names, you can start to dive into the domain
    more. As we have seen in Exercise 3.1, variable names are very often compounded
    of a lot of different parts, like `independentColorPoolPerBracketType`.


    Variable names often contain separate parts such as `quantifiers`, `programming
    concepts`, and `domain concepts`.


    # Quantifiers


    `Quantifiers` are parts of names that refer to quantities, like `count`, `number_of`,
    `maximum`, or `filtered`. Sometimes these quantifiers also include what is being
    quantified over, like `maximum_refund_per_month`.


    # Programming concepts


    `Programming concepts` also occur within names. For example, from a name like
    `m_object`, `object` can refer to a specific concept in a language. Other parts
    of names that refer to concepts are `list`, `hash`, `table`, `string`, or `number`.
    In this chapter, we will not yet focus on concepts now; that is the topic of Chapter
    4.


    # Domain concepts


    `Domain concepts` refer to the domain, like `customer`, `import`, `parser`, `code`,
    or `language`. Some parts of variable names point to concepts, often in the form
    of nouns, like `customer` or `code`, but they can also represent `domain behavior`
    in the form of verbs like `import` or `parse`.


    Picking apart the names, you can get an introductory sense of what concepts and
    behavior play a role in the code base.


    # Extracting domain concepts automatically


    In addition to the manual approach, you can also use tools to extract domain concepts.
    While text analysis tools are typically meant for text, they could be applied
    to code too. For example: <https://pypi.org/project/wordcloud/>


    Once you have gathered all names in our example code snippet (or in your own file
    or module that you are currently investigating), our next step is to determine
    what concepts in the code are even part of the domain. Because if we want to understand
    the domain better, we first need to know what concepts are in the domain. We will
    start by splitting the variable names into different words, and then determining
    which words in names are domain concepts, which is not as straightforward as you
    might think.


    Firstly, sometimes even finding the parts is not easy. For example, consider the
    name `getInlineClassName()`. Are we getting the name of an `Inline Class`? Or
    are we getting an `Inline Name` of a `Class`? In other words, is `Inline` an attribute
    of `Class` or of `Name`? You might need some further reading of the code to even
    know!


    And, even if you can find all parts, what a domain concept is is not always clear.
    For example, the name `ColorizedBracketPairsDecorationProvider` can be split up
    into five words: `Colorized`, `Bracket`, `Pairs`, `Decoration`, and `Provider`.


    However, without further knowledge of what this code does, it is hard to know
    what is a programming concept and what is a domain concept: `Decoration` and `Provider`
    can refer to programming concepts, `Pairs` could be a datatype, and even `Brackets`
    is something that occurs in code.


    We will therefore potentially have to gather more knowledge about what the code
    does to make some of the decisions for Exercise 3.2. See what you can understand,
    and don''t overthink it. If you don''t know, feel free to place concepts in the
    `Unclear` column.


    ## Exercise 3.2: Distinguish different parts within the names


    From the list of variables from Exercise 3.1, extract the separate words within
    the variable names, and divide them into quantifiers, programming concepts, and
    domain concepts. If you don''t know, just put the concept in the `Unclear` column.


    | Name | Quantifiers | Programming | Domain | Unclear |

    | --- | --- | --- | --- | --- |

    | `ColorizedBracketPairsDecorationProvider` | | | `Provider` | `Colorized`, `Bracket
    Pair`, `Decoration` |

    | | | | | |

    | | | | | |

    | | | | | |

    | | | | | |


    If you have access to domain experts (which is not always the case if you are
    reading code from an open source project), this is a good point to discuss the
    list of concepts. Great questions to ask are:


    - Are there any synonyms in the list of domain concepts that might not be obvious?

    - Are there any central domain concepts or behaviours that this list misses?


    # Determining relationships between Domain Concepts


    Once you have formed an initial idea of the central domain concepts, we are going
    to explore how the concepts fit together to form a more coherent picture of what
    the domain entails. We will work with the domain concepts that we have gathered
    so far in Exercise 3.1. We will dive into what type these concepts are, using
    the terminology of Chapter 2.


    In Chapter 2 we have distinguished objects and functions, and that distinction
    is relevant in the domain dimension too. In a domain, we also have objects, like
    `Decorations`, that can be used in functions like `getDecorationsInRange()`. When
    examining the domain, one more distinction is useful: between objects and object
    attributes. Objects like `Bracket Pairs` can have attributes like `Colorized`
    because in this domain a pair of brackets can get a certain color. So `Colorized`
    is not a domain concept in itself but a modifier used with `Bracket Pairs`.


    The types we have gathered in Exercise 3.1 can also help in determining the component
    types of the domain concepts. Functions tend to contain more generic words, especially
    verbs such as `execute`, `read`, `load`, or `create`. However, function names
    often also reveal domain-specific behavior such as `buying`, `selling`, `placing
    an order`, or `favoriting an item`. And function names are not limited to behavior.
    Function names can also reveal domain concepts; for example, a function name such
    as `getDecorationsInRange()` tells us that there is such a thing as a `range`
    that decorations fall into.


    ## Mapping concepts into components


    List all names and their types from Exercise 3.1, and all concepts in the names
    from Exercise 3.2 in the gray columns. These go in the first 3 gray columns of
    this table, and are not new information. Now fill out the final column, dividing
    the concepts into `Object` or `Function` components, or `Attributes`.


    ### Exercise 3.3: Concepts and components


    | Name | Type (3.1) | Concept (3.2) | Component |

    | --- | --- | --- | --- |

    | `ColorizedBracketPairsDecorationProvider` | `Class` | `Bracket Pair` | `Object`
    |

    | | | `Colorized` | `Attribute (of Bracket Pair)` |

    | | | `Decoration` | `Attribute (of Bracket Pair)` |

    | | | | |

    | | | | |

    | | | | |


    ## Finding relationships between concepts


    While a flat list of concepts can be very useful to gain insight into the core
    concepts in a code base, visualization can be a richer way to store knowledge,
    which is also more in line with how your brain processes information. Rather than
    flat lists or hierarchies, your brain stores information more like networks, so
    making these links explicit helps to gain better insights and to remember information
    better.


    ### Exercise 3.4: Concept relations and map


    Combine the list of concepts with that of behaviour. Which ones belong together?


    | Concept → Operation ↓ | `program` | `tree` | | |

    | --- | --- | --- | --- | --- |

    | `check if valid` | `x` | | | |

    | `process` | | `x` | | |

    | | | | | |

    | | | | | |

    | | | | | |


    # Expanding knowledge


    You have now looked at names occurring in both variables and functions or methods
    and gathered two domain categories from the names: concepts and behaviour. Before
    you summarize your findings, let''s focus on these two categories separately.
    The aim of the next step in reading is to try to define the concepts and behaviours
    as precisely as possible, based on your prior knowledge of code and domain, and,
    if possible, on documentation and knowledge of others.


    ## Gathering more knowledge about concepts


- raw: "Once you have listed all variable names, you can start to dive into the domain\
    \ more. As we have seen in Exercise 3.1, variable names are very often compounded\
    \ of a lot of different parts, like `independentColorPoolPerBracketType`.\n\n\
    Variable names often contain separate parts such as **quantifiers**, and **programming\
    \ concepts** but also **domain concepts**.\n\n**Quantifiers** are parts of names\
    \ that refer to quantities, like count, number\\_of, maximum, or filtered. Sometimes\
    \ these quantifiers also include with is being quantified over, like maximum\\\
    _refund\\_per\\_month.\n\n**Programming concepts** also occur within names, for\
    \ example from a name like m\\_object, object can refer to a specific concept\
    \ in a language. Other parts of names that refer to concepts are list, hash, table,\
    \ string, or number. In this chapter, we will not yet focus on concepts now, that\
    \ is the topic of chapter 4.\n\n**Domain concepts** refer to the domain, like\
    \ customer, import, parser, code, or language. Some parts of variable names point\
    \ to concepts, often in the form of nouns, like customer or code, but they can\
    \ also represent *domain behavior* in the form of verbs like import, or parse.\n\
    \nPicking apart the names, you can get an introductory sense of what concepts\
    \ and behavior play a role in the code base.\n\n# Extracting domain concepts automatically\n\
    \nIn addition to the manual approach, you can also use tools to extract domain\
    \ concepts. While text analysis tools are typically meant for text, they could\
    \ be applied to code too, for example: [https://pypi.org/project/wordcloud/](https://pypi.org/project/wordcloud/)\n\
    \nOnce you have gathered all names in our example code snippet (or in your own\
    \ file or module that you are currently investigating) our next step is to determine\
    \ what concepts in the code are even part of the domain. Because if we want to\
    \ understand the domain better, we first need to know what concepts are in the\
    \ domain. We will start by splitting the variable names into different words,\
    \ and then determining which words in names are domain concepts, which is not\
    \ as straightforward as you might think.\n\nFirstly, sometimes even finding the\
    \ parts is not easy. For example, consider the name getInlineClassName(). Are\
    \ we getting the name of an Inline Class? Or are we getting an Inline Name of\
    \ a Class? In other words, is Inline an attribute of Class or of Name? You might\
    \ need some further reading of the code to even know!\n\nAnd, even if you can\
    \ find all parts, what a domain concepts is is not always clear. For example,\
    \ the name ColorizedBracketPairsDecorationProvider can be split up into five words:\
    \ Colorized, Bracket, Pairs, Decoration and Provider.\n\nHowever, without further\
    \ knowledge of what this code does, it is hard to know what is a programming concept\
    \ and what is a domain concept: Decoration and Provider can refer to programming\
    \ concepts, Pairs could be a datatype, and even Brackets is something that occurs\
    \ in code.\n\nWe will therefore potentially have to gather more knowledge about\
    \ what the code does to make some of the decisions for Exercise 3.2. See what\
    \ you can understand, and don’t overthink it, it you don’t know, feel free to\
    \ place concepts in the Unclear column\n\n### Exercise 3.2 Distinguish different\
    \ parts within the names\n\nFrom the list of variables from exercise 3.1, extract\
    \ the separate words within the variable names, and divide them into quantifiers,\
    \ programming concepts and domain concepts. If you don’t know, just put the concept\
    \ in the Unclear column.  \n\n| Name || Quantifiers || Programming || Domain ||\
    \ Unclear |\n\n| --- | --- | --- | --- | --- |\n\n| *ColorizedBracketPairsDecorationProvider*\
    \ ||   || *Provider* || *Colorized*  \n\n*Bracket Pair* || *Decoration* |\n\n\
    | --- | --- | --- | --- | --- |\n\n|   ||   ||   ||   ||   |\n\n|   ||   ||  \
    \ ||   ||   |\n\n|   ||   ||   ||   ||   |\n\n|   ||   ||   ||   ||   |\n\n|  \
    \ ||   ||   ||   ||   |\n\nIf you have access to domain experts (which is not\
    \ always the case if you are reading code from an open source project), this is\
    \ a good point to discuss the list of concepts. Great questions to ask are:\n\n\
    *   Are there any synonyms in the list of domain concepts that might not be obvious?\n\
    \n*   Are there any central domain concepts or behaviours that this list misses?\n\
    \n# Determining relationships between Domain Concepts\n\nOnce you have formed\
    \ an initial idea of the central domain concepts, we are going to explore how\
    \ the concepts fit together to form a more coherent picture of what the domain\
    \ entails. We will work with the domain concepts that we have gathered so far\
    \ in Exercise 3.1 We will dive into what type these concepts are, using the terminology\
    \ of Chapter 2.\n\nIn Chapter 2 we have distinguished objects and functions, and\
    \ that distinction is relevant in the domain dimension too. In a domain, we also\
    \ have objects, like Decorations, that can be used in functions like getDecorationsInRange().\
    \ When examining the domain, one more distinction is useful, between objects and\
    \ object attributes. Objects like Bracket Pairs can have attributes like Colorized\
    \ because in this domain a pair of brackets can get a certain color. So Colorized\
    \ it not a domain concept in itself but a modifier used with Bracket Pairs.\n\n\
    The types we have gathered in Exercise 3.1 can also help in determining the component\
    \ types of the domain concepts. Functions tend to contain more generic words,\
    \ especially verbs such as execute, read, load or create. However function names\
    \ often also reveal domain-specific behavior such as buying, selling, placing\
    \ an order or favoriting an item. And function names are not limited to behavior.\
    \ Function names can also reveal domain concepts; for example, a function name\
    \ such as getDecorationsInRange() tells us that there is such a thing as a range\
    \ that decorations fall into.\n\n## Mapping concepts into components\n\nList all\
    \ names and their types from Exercise 3.1, and all concepts in the names from\
    \ Exercise 3.2 in the gray columns. These go in the first 3 gray columns of this\
    \ table, and are not new information. Now fill out the final column, dividing\
    \ the concepts into Object or Function components, or Attributes.\n\n### Exercise\
    \ 3.3: Concepts and components\n\n| Name || Type (3.1) || Concept (3.2) || Component\
    \ |\n\n| --- | --- | --- | --- |\n\n| *ColorizedBracketPairsDecorationProvider*\
    \ || *Class* || *Bracket Pair* || *Object* |\n\n| --- | --- | --- | --- |\n\n\
    |   ||   || *Colorized* || *Attribute (of Bracket Pair)* |\n\n|   ||   || *Decoration*\

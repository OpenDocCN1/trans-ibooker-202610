    | | | | | |

    | | | | | |


    如果你能接触到领域专家（如果你在阅读开源项目的代码，这并不总是可行），这是一个讨论概念列表的好时机。值得提出的好问题包括：


    - 领域概念列表中是否有可能不明显的同义词？

    - 该列表是否遗漏了任何核心领域概念或行为？


    # 确定领域概念之间的关系


    一旦你对核心领域概念有了初步的了解，我们将探讨这些概念如何组合在一起，形成一个更连贯的图景，展示领域包含的内容。我们将使用第 2 章的术语，深入探讨迄今为止在练习
    3.1 中收集的领域概念的类型。


    在第 2 章中，我们区分了对象和函数，这种区分在领域维度中同样适用。在领域中，我们也有对象，如 `Decorations`，它们可以用在函数中，如 `getDecorationsInRange()`。在审视领域时，还有一个区分很有用：对象与对象属性之间的区别。像
    `Bracket Pairs` 这样的对象可以拥有像 `Colorized` 这样的属性，因为在这个领域中，一对括号可以获得特定的颜色。所以 `Colorized`
    本身不是一个领域概念，而是一个与 `Bracket Pairs` 一起使用的修饰符。


    我们在练习 3.1 中收集的类型也有助于确定领域概念的组件类型。函数往往包含更多通用词汇，尤其是动词，如 `execute`、`read`、`load` 或
    `create`。然而，函数名也经常揭示特定领域的行为，如 `buying`、`selling`、`placing an order` 或 `favoriting
    an item`。函数名不仅限于行为。函数名也可以揭示领域概念；例如，函数名 `getDecorationsInRange()` 告诉我们存在一个 `range`（范围），装饰物落在这个范围内。


    ## 将概念映射到组件


    将练习 3.1 中的所有名称及其类型，以及练习 3.2 中名称中的所有概念列在灰色列中。这些内容填入表格的前 3 个灰色列，并非新信息。现在填写最后一列，将概念分为
    `Object`（对象）或 `Function`（函数）组件，或 `Attributes`（属性）。


    ### 练习 3.3：概念与组件


    | 名称 | 类型 (3.1) | 概念 (3.2) | 组件 |

    | --- | --- | --- | --- |

    | `ColorizedBracketPairsDecorationProvider` | `Class` | `Bracket Pair` | `Object`
    |

    | | | `Colorized` | `Attribute (of Bracket Pair)` |

    | | | `Decoration` | `Attribute (of Bracket Pair)` |

    | | | | |

    | | | | |

    | | | | |


    ## 寻找概念之间的关系


    虽然概念的扁平列表有助于深入了解代码库中的核心概念，但可视化可以是一种更丰富的知识存储方式，这也更符合大脑处理信息的方式。大脑存储信息更像是网络，而不是扁平列表或层级结构，因此使这些联系显性化有助于获得更好的洞察并更好地记忆信息。


    ### 练习 3.4：概念关系与映射


    将概念列表与行为列表结合起来。哪些属于一组？


    | 概念 → 操作 ↓ | `program` | `tree` | | |

    | --- | --- | --- | --- | --- |

    | `check if valid` | `x` | | | |

    | `process` | | `x` | | |

    | | | | | |

    | | | | | |

    | | | | | |


    # 扩展知识


    你现在已经查看了变量和函数或方法中出现的名称，并从名称中收集了两个领域类别：概念和行为。在总结你的发现之前，让我们分别关注这两个类别。阅读的下一步旨在尝试尽可能精确地定义概念和行为，基于你对代码和领域的先验知识，以及如果可能的话，基于文档和他人的知识。


    ## 收集关于概念的更多知识


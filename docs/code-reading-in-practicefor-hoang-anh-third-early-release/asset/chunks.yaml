- raw: '1.  Firstly there are *object components*, which are used to create meaningful
    abstractions. Examples of object components in code are user-created datatypes,
    structs or classes. In the running example, `IsComplete` is an object. We will
    use Python naming conventions in the remainder of the book, so objects such as
    classes will be written in PascalCase.


    2.  There are also *functional components* in which execution is grouped, like
    methods or functions. In our example `is_program_complete()` is a method. The
    convention in the remainder of the book will be to denote functions and methods
    with `()` at the end.


    3.  Finally code can contain  *singular components* that are variables or constants
    not contained in either objects or functional components, such as `command_make_color`.
    We will use Python naming conventions in the remainder of the book, so objects
    such as classes will be written in `snake_case`.


    ## Components in different paradigms


    These three components appear in different forms in different programming languages,
    and not all languages support all three objects. For example, objects are, of
    course, commonly present in object-oriented languages, but these languages traditionally
    do not allow for variables to be defined outside of classes and thus do not have
    variables or constants living outside of object or functional components.


    Functional components on the other hand are, of course, the core component used
    in functional languages. In object-oriented languages, functional components take
    the form of methods within classes.


    Singular components are not possible in most pure OO languages like Java or C#,
    components that are not objects must live within classes and as such there are
    no singular variables outside classes. Inside classes they take the form of fields.
    In functional languages variables may always be declared, inside or outside functions.


    Nowadays, many languages allow for multiple paradigms including functional and
    object-oriented, for example Python or JavaScript. In these languages all three
    components can (and will often) be present.


    ## IDE support for structural reading


    While Interactive Development Environments (IDEs) are mostly designed for writing
    code, they also contain a lot of features that can help in reading. Many IDEs
    support a code folding or collapse feature, which helps to manage the complexity
    in reading by showing only a summarized view of functions, methods or loops, rather
    than their implementations. For a method/function or class, the minimized view
    will show the definition, including parameters for method/functions, and including
    inheritance information for classes. For loops, typically the line containing
    the loop code (for, while, forEach) is shown in full, while the loop’s body is
    hidden.


    ### Code folding


    In most cases, code folding will be done with a little minus in the *gutter*,
    the side bar typically placed next to code also containing line numbers, as shown
    in Figure 2-1. Many IDEs also have shortcuts to fold code. In Jetbrains IDEs like
    PyCharm or CLion ctrl (on Windows) or command ( on Mac) combined with - or + folds
    or unfolds the current block, while ctrl (on Windows) or command ( on Mac) combined
    with shift and -/+ folds or unfolds everything in the file.


    `Ctrl+NumPad - / Ctrl+NumPad +` . PyCharm folds or unfolds the current code fragment,
    for example, a single method. To collapse or expand all code fragments, press
    `Ctrl+Shift+NumPad - / Ctrl+Shift+NumPad +`


    ![](assets/structural_examination_672754_02.png)



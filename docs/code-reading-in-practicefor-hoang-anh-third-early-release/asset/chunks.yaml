    # Using roles of variables to gain a deeper understanding


    变量名可以让你对代码库中的概念有很好的印象，但仅从变量本身你还能了解更多关于概念的信息。深入理解一段代码使用了什么概念的一个好方法是使用 **roles of
    variables** 框架来分析它。


    正如芬兰东大学的 Jorma Sajaniemi 所描述的，变量角色是一个框架，它给变量在代码中不同的使用方式赋予了精确的名称。


    例如，在 `for i in range(classes):` 这样的循环中的变量 `i` 不仅仅是一个变量，甚至不仅仅是一个整数，它有一个更具体的角色，即逐个遍历范围的元素。即使不看循环体，你也可以相当确定地认为
    `i` 将被用来索引列表 `classes`。如果你看到另一个名为 `max_class_size` 的整数变量，它对大多数程序员会有不同的含义，即使没有看到其他任何东西。这样的变量不太可能用于索引列表，而更可能保存一个表示班级学生最高人数的值。


    虽然大多数程序员都知道并理解这些变量做不同的事情，但变量角色给了我们一个精确的词汇来思考这些差异。例如，上面例子中的 `i` 是一个 **stepper**（步进器），一个遍历固定值列表的变量，而
    `max_class_size` 是一个 **most-wanted holder**（最想要持有者），一个存储已搜索值的变量。



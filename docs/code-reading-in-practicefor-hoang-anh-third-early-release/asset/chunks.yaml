    # Variable Roles


    Its value can, however, also be calculated directly in functional languages or
    languages that encompass certain functional aspects, i.e. `functional_total =
    sum(list)`. Gatherers look quite differently based on the programming language
    in question. In imperative pieces of code, they can only occur in conjunction
    with a loop, while in functional languages they can be expressed with pattern
    matching also.


    ## Container


    A container is any data structure that holds multiple elements that can be added
    and removed.


    Examples of containers are lists, arrays, stacks, and trees. In many cases we
    can recognize containers syntactically, since they are initialized with special
    symbols, like `customers = []` or `symbols = {}`.


    ## Follower


    Some algorithms require you to keep track of a previous or subsequent value. A
    variable in this role is called a follower and is always coupled to another variable.


    Examples of follower variables are a pointer that points to a previous element
    in a linked list when traversing the list, or the lower index in a binary search.


    ## Organizer


    Often data has to be processed in some way. For example, in some languages, you
    cannot access individual characters in a string without converting the string
    to a character array first. Or you retrieved a collection of elements but you
    also want to store a sorted version of that list to filter in various ways later
    on, and sorting once is more effective than sorting each time. These are examples
    of organizers, which are variables that are only used for rearranging or storing
    values differently. Often, organizers are temporary variables.


    Examples are sorting or filtering variables, for example in pandas:


    ```

    filtered = df[df["variable"] == "A"]

    ```


    Organizers are always connected to other variables whose values they reshape or
    transform.


    ## Temporary


    Temporary variables are variables that are used only briefly and are often called
    `temp` or `t`. These variables may be used to swap data or to store the result
    of a computation that is used multiple times in a method or function.


    Examples: `temp`, `foo`, `bar`, `thing`


    Temporary variables are often recognized based on their names that might have
    `temp` at the beginning or the end, but this is not always the case. Another way
    to recognize temporary variables is to notice that they are only used in a few
    lines of code that are located closely together.



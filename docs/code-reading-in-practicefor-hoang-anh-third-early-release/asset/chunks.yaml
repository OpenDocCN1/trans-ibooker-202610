    the side bar typically placed next to code also containing line numbers, as shown
    in Figure 2-1. Many IDEs also have shortcuts to fold code. In Jetbrains IDEs like
    PyCharm or CLion `ctrl` (on Windows) or `command` (on Mac) combined with `-` or
    `+` folds or unfolds the current block, while `ctrl` (on Windows) or `command`
    (on Mac) combined with `shift` and `-/+` folds or unfolds everything in the file.



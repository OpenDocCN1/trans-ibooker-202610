    ## Chapter 1. Structural Examination


    The following chapters dive into five different dimensions of code reading: structure,
    domain, concepts, context, and collaboration.


    I have often seen unfamiliar code and got deterred from reading on after seeing
    a few lines of code that did not make any sense to me, even in programming languages
    I was quite comfortable with. There are different reasons that code can be hard
    to read. For example the code can contain *code smells* like long methods, or
    methods with confusing or contradicting names. In other cases, code can be organized
    well, but hard to read because you yourself lack knowledge. A code base filled
    with domain concepts that you are unfamiliar with, or algorithms and data structures
    that you do not know will be hard to grok, even if it is written and documented
    perfectly.


    But sometimes the confusion lies in the fact that the code is connected in ways
    that you do not yet know. When you are new to a code base, you are still learning
    what methods call which other methods, what parameters play a role in similar
    parts of the code base and how the important business domain concepts are represented
    in the code. This chapter focuses on that part of confusion about code: the lack
    of knowledge of how the various code elements relate to each other. Stop scrolling
    around in the code base in the hopes of finding understanding, or reading docs
    that do not yet have meaning, but instead expand your structural knowledge using
    focused exercises.


    The exercises and techniques in this chapter help to answer questions like: Is
    the code organized in methods and classes? What methods and classes depend on
    each other? What is the ''flow'' of the code? Are there clear *entry points* such
    as a main method where the code execution will start?


    At the end of the chapter, you will know X techniques to be applied to more deeply
    understand the code structure of a new code base.


    List of techniques in this chapter (to come)


    ### Background & Running Example


    Let''s study this small code snippet from the Hedy code base. Give yourself a
    few minutes to read the code, but do not worry if you do not fully understand
    it at this point.


    ![](assets/structural_examination_672754_01.png)


    When you are reading code that is unfamiliar to you, it will be tempting to dive
    into all the details. What is a syntax tree? What does it mean for it to be complete,
    and what is a lookup table, and what are its entries?


    However, these small details are likely to overwhelm your *working memory*. Your
    *working memory* acts a bit like the processor of your brain, it processes information
    when you read it. Research tells us that your *working memory* is really small,
    it only has about 2 to 6 "spots" to store information in! When you have only a
    little bit of prior knowledge, each line of code, or even each individual element
    might take up one spot, but if you know a lot about the code base, each method
    might hold a spot, causing you to be able to process a lot more. This process
    is called *chunking*.


    As an illustration of the idea of *chunking*, imagine that you have to remember
    the numbers 1934 5023 7544 1846 and also 1918 1945 1990 2003. Most likely the
    second number set is a lot easier to understand since you can remember it using
    prior knowledge: First World War, Second World War, First Gulf War, Second Gulf
    War. Those four chunks make the second example easy to process, but lacking such
    chunks the first string of numbers will be extremely hard to remember or reason
    with.


    This example underlines why it is so important to first gain some deeper understanding
    of the concepts and their relationships: without solid prior knowledge of the
    structure of the code, it will be harder than necessary to read unfamiliar code.


    For the example above, this means that we will need to understand the meaning
    of the basic building blocks of the code: `parse tree`.


    ### Structural Components


    Now that you understand why it is important to understand the structure of code,
    you can start examining a number of techniques to gain this understanding. One
    of the first techniques to apply when reading unfamiliar code is to understand
    its division into components; this includes classes and methods in an Object-oriented
    project, or functional components in a more functional style program. It is tempting
    to start to read individual lines of code when you examine unfamiliar code for
    the first time, but as explained above, focusing on small details can be confusing
    and also feel overwhelming. Starting your analysis with the structural components
    instead provides a high level view that will aid in your more detailed line-by-line
    read later.


    #### Objects and Functions


    When we examine the code in the code snippet for this chapter, we immediately
    see that there are different types of code present. We see a class called `IsComplete`,
    a function called `is_program_complete()` and variables that are not included
    in classes, such as `command_make_color`. When finding our grounding in a new
    code base, it will help our *working memory* if we explicitly understand the components
    and their roles. Also, each type of component will be read in a different way:
    you go reading a class in a different way than a method, for example because you
    can step through a method. We therefor start with a division of code into three
    types of structural components:


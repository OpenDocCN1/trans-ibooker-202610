    首先，你需要做的是制定一个清晰的搜索计划，其中包含一个你在搜索更多信息时想要了解的事项列表。如果你已经浏览了上面的代码片段，无论是否使用了前几章的练习，这些可能是你仍然会困惑的地方：


    *   什么是 `tan`？

    *   什么是 `teletan`？

    *   `organizer` 的角色是什么？

    *   如何判断一个 `tan` 是否有效？

    *   `tan` 何时会变化？


    我经常在没有明确搜索计划的情况下浏览代码库，很容易浪费大量时间去想“嗯，这很有趣”或“噢，那是什么意思？”，但最终却没有多少进展可言。试着记录你的计划，并在每次搜索后评估你是否取得了有意义的进展，即使这很难判断！本章剩余部分的示例侧重于
    `tan` 和 `teletan` 的含义作为搜索计划的问题，但如果你愿意，可以随意扩大范围。


    ## 使用通用搜索引擎


    当然，Google 可以作为查找信息的一个很好的第一步，但遗憾的是，取决于你的搜索历史，`tan` 和 `teletan` 并不能真正给出很多结果：


    ![](img/context_examination_487104_01.png)


    `organizer` 也是如此，这是一个非常通用的词，有多种含义（从办公用品到策划婚礼的人）。根据领域不同，通用搜索可能不会产生太多有用的线索。


    此外，甚至很难识别出嵌入在你不熟悉的语言中的领域概念。如果我没有告诉你 `tan` 是一个领域概念，很难从像 `TraceLocationWarnTanViewModel`
    这样的名称中提炼出哪些部分是领域概念！是在追踪位置吗？“warn `tan`” 是一种 `tan` 的形式，相对于可能的 error `tan`？是 `tan`
    在警告，还是它被警告了？仅凭代码，这几乎不可能弄清楚，所以你需要将范围扩大到代码之外。


    ## 使用代码搜索引擎


    除了通用搜索引擎，许多编码平台还允许在仓库内搜索，如图 5.2 所示，或通过以下链接在线查找：[`github.com/corona-warn-app/cwa-app-android/search?q=teletan`](https://github.com/corona-warn-app/cwa-app-android/search?q=teletan)


    ![](img/context_examination_487104_02.png)


    搜索一个术语时，你可以在搜索结果的左侧看到找到了多种类型的结果。让我们逐步了解一下结果的类型以及你可以从中学到什么。我强烈建议你如果可能的话自行浏览这些结果！


    **代码**


    : 第一类结果是代码。在某些情况下，你可以深入代码本身，并利用前几章的技术从中了解更多关于概念的信息。然而，本章的目标是将你的搜索范围扩大到代码库之外。GitHub
    代码搜索的好处在于，如果你点击左侧的“Code”，将只显示代码结果，你可以快速浏览所有 `teletan` 的实例，以帮助了解与其搭配使用的操作。这将允许你像练习
    3.6 那样，检查应用于 `teletan` 的不同操作有哪些。例如，你可以看到 `teletan` 可以是有效或无效的，可以被屏蔽，并且从一个测试中，你可以了解到
    `teletan` 允许你“获取注册令牌”。


    **提交**


    : GitHub 搜索提供了除代码之外的稳健来源，你也可以在 IDE 中搜索这些来源。点击左侧的“Commits”将显示所有与搜索词匹配的提交。


    这再次让你能够扩展关于该概念内涵的知识；你可以看到 `teletans` 不应在错误报告中可见 (`0ff23e7`)，存在“原始” `teletan` 这种东西
    (`1628fe`)，它从 7 个字符扩展到了 10 个字符 (`b31fd1d`)，并且输入可以被验证 (`4dc73f1`)。通过这种方式，甚至无需克隆或复刻项目，你就能轻松获得关于代码库中发生什么的一些见解。


    ![](img/context_examination_487104_03.png)


    **议题**


    : 同样，点击“Issues”会显示所有议题，它们通常与提交相关，但并非总是如此。例如，议题 77 ([`github.com/corona-warn-app/cwa-app-android/issues/77`](https://github.com/corona-warn-app/cwa-app-android/issues/77))
    提到了 `teletan` 并给出了清晰的定义：*“提交阳性 COVID-19 结果是一项安全/隐私敏感任务，涉及扫描二维码或输入 `teleTAN`。此过程中涉及的数据应受到保护。”*
    当我自己阅读代码库时，该议题中的描述对理解 `teletan` 最有帮助，且包含了我在代码、注释或文档中找不到的信息！


    ## 记录你的发现！


    这是重新审视你的搜索计划的好时机，你回答了相关问题吗？把你在哪里找到了什么信息记录下来也非常有价值，特别是当你不是一次性完成所有搜索，而是计划稍后继续工作时。记录下什么信息帮助回答了什么问题，可以极大地减轻后续搜索的难度。


    ## 检查项目文档


    除了代码，图 5.2 中的搜索还显示了一个 markdown 文件和一个 svg 文件。虽然你可能不会在“代码”搜索下寻找这些信息，但这里经常也会显示文档文件。查看代码搜索中显示的
    Markdown 文件可能很有趣，因为这些文件通常包含项目文档，本例即是如此。


    ![](img/context_examination_487104_04.png)


    还有一个 svg 文件（一张图片），显示了一个包含更多信息的架构图。


    ![](img/context_examination_487104_05.png)


    虽然该图表不一定有助于理解 `teletan` 的确切含义，但它确实从整体上更深入地展示了项目。


    现在你已经找到了大量围绕代码的相关信息，是时候整合这些信息了。研究表明，主动尝试回忆信息是将该信息保留在长期记忆中的最佳方式（见下文注释）


    ## 精细化加工


    在第 4 章中，我提到了存储强度和提取强度的区别。虽然很难提高存储强度，但可以通过尝试回忆信息来轻松增加提取强度。单纯复制信息远不如在查阅之前尝试回忆它那么有效！


    ### 练习 5.2 总结概念


    写下你在开始检查代码片段时不熟悉的概念。根据在字符串中收集的信息以及对仓库中非代码文档的搜索，你将如何定义该代码库中的相关概念？


    | 概念 | 用你自己的话 |

    | --- | --- |

    | `tan` |   |

    | `teletan` |   |

    | `organizer` |   |

    | `registration` |   |

    | `…` |   |


    ## 丰富理解


    在前几章中，你从代码中收集了领域概念和编程概念的列表，在本章中，你探索了来自代码、文档、议题和拉取请求的词汇表或定义列表。特别是当从代码、文档、注释和议题等各种来源收集信息时，要跟踪你在哪里读到了什么可能很难。如果你想以后深入研究某个特定来源，这将很重要。所以如果你还没有这样做，请记下一些笔记，注明哪些文档帮助你学习了哪些概念。


    ## 创建概念图


    '

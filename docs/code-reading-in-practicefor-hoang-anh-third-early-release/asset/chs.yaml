  | | | | | |\n| | | | | |\n| | | | | |\n\n如果你能接触到领域专家（如果你在阅读开源项目的代码，这并不总是可行），这是一个讨论概念列表的好时机。值得提出的好问题包括：\n\
  \n- 领域概念列表中是否有可能不明显的同义词？\n- 该列表是否遗漏了任何核心领域概念或行为？\n\n### 确定领域概念之间的关系\n\n一旦你对核心领域概念有了初步的了解，我们将探讨这些概念如何组合在一起，形成一个更连贯的图景，展示领域包含的内容。我们将使用第\

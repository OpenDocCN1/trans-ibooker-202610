  \n| 标识符名称 | 基于名称预期的类型 | 从代码阅读收集的类型 |\n| --- | --- | --- |\n| `keywords_requiring_indentation`\
  \ |  |  |\n| `imported_product` |  |  |\n| `…` |  |  |\n| 函数或方法名称 |  |  |\n| `process_input_string`\
  \ |  |  |\n| `check_program_size_is_valid` |  |  |\n| `…` |  |  |\n\n### 自动检查语言异味\n\
  \n你是否好奇代码库是否存在语言反模式？代码库是用 Java 编写的吗？如果是，你可以使用 Arnaoudova 基于研究创建的语言反模式检测器（LAPD）自动评估异味。LAPD\
  \ 作为 Eclipse Checkstyle 插件的扩展可用。^(2)\n\n#### 命名模式\n\n命名模式是变量名中元素通常组合的模式（详见后文突出框），是检查代码质量的一个重要维度。在代码库中使用许多不同的命名模式会使代码不必要地难以阅读。如果你想检查代码库中的命名模式，你已经在练习\
  \ 3.2 中完成了部分工作，当时你列出了名称及其单词/领域部分。现在你可以在下一个练习中扩展此表以检测不同的模式。\n\n##### 练习 3.7 检查命名模式\n\

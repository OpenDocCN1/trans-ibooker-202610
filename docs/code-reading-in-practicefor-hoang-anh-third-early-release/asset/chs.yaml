  \n一旦你调查了代码并努力从代码本身理解领域概念，用两种方式丰富你的知识将非常有价值。\n\n首先，你可以将注意力转向代码库之外。根据你的上下文，这可能是深入文档以获取关于你在开源项目中发现的概念的更多信息，或者是与公司内部经验丰富的同事进行一次会议。在这两种情况下，你都是在寻求加深对刚刚了解的概念的理解。一个很好的练习是复查练习\
  \ 3.2 和 3.4 的发现。你能验证练习 3.6a 中的含义和同义词是否正确，以及练习 3.6b 中的数据类型是否正确吗？\n\n其次，在利用代码库外部的信息扩展了所有领域概念的知识后，加深理解的第二种方法是重读代码。现在是放弃对代码中名称的狭隘关注、整体重读代码的大好时机。因为你的知识现在扩展了，你一定会注意到代码中之前未曾注意到的新事物。\n\
  \n#### 扩展文档\n\n关于领域概念和行为的一些信息可以作为添加到 readme 文件中的优秀文档。特别是，你已经探索了代码中许多重要概念，这些概念可能尚未存在于任何文档文件中。在某种意义上，你可能已经开始记录项目的\
  \ `Ubiquitous Language`（通用语言）。\n\n##### 通用语言\n\nEric Evans 在其《领域驱动设计》一书中创造了 `Ubiquitous\
  \ Language`（通用语言）一词。Evans 用通用语言指代开发人员和软件系统用户共享的语言。这种语言通常只有一部分自然产生，部分需要刻意设计。Evans\
  \ 指出，`Ubiquitous Language` 应基于软件中使用的领域模型，因为自然语言概念往往不够精确。\n\n你迄今收集的信息可以转化为文档。你在练习\
  \ 3.6a 和 3.6b 中创建的概念列表可以作为领域概念列表的起点。从那里，你可以扩展，例如通过：\n\n*   确保变量或函数名中的所有缩写或首字母缩略词要么被完整单词替代，要么如果人们倾向于保留它们，则进行记录\n\
  *   描述那些让你感觉相似但实际不同的领域对象。如果它们不完全相同但有看起来相似的原因，例如相似的名称或相似的行为，其他人也可能会感到困惑。记录这些概念的细微差别非常有用\n\
  *   与用户讨论这些列表。他们能识别并理解所有概念吗？缺少什么概念？它们是否可能缺失或以其他方式表示？\n*   如果你在一个实践 DDD 并使用 `Ubiquitous\
  \ Language` 的环境中工作，你可以检查你的概念列表是否与现有的 `Ubiquitous Language` 文档相似。\n\n此外，你可能会发现一些名称不能准确描述代码功能，例如\
  \ `analyze()`、`convert()` 或 `process()`。在阅读代码时，你可能通过检查函数的调用跟踪、函数中的变量名或注释，对这些词有了更深入的理解。你或许可以致力于完善文档，特别是这些函数的\
  \ `docstrings`（文档字符串），以帮助未来的读者。\n\n#### 讨论代码质量\n\n在从领域角度审视代码时，你可能会发现代码中存在代码异味的部分，具体来说是语言学代码异味，即与对象、函数、方法或变量命名相关的代码异味。你的领域发现可以作为与团队讨论命名质量的绝佳切入点。\n\
  \n**相似对象**\n\n你的领域分析可能指向看起来非常相似的对象。除了记录差异（如上所述），你可能还想深入探究代码如此的原因，例如通过讨论：\n\n*  \
  \ 这些领域概念真的是同义词还是不同的？如果不同，有何不同？\n*   相似性是否有历史原因？有时引入新产品或流程时，会带来自己的对象，因为作者可能不知道代码中哪些地方适合它。\n\
  \n**语言学代码异味**\n\n第 2 章讨论了两种不同的代码异味：Fowler 描述的结构性异味，以及 Arnaoudova 定义的语言学代码异味。既然本章关注领域概念，按异味评估名称质量是合理的。你可以关注特定类型的语言学异味，Arnaoudova\
  \ 在其著作中将其区分为函数/方法三种和标识符三种。\n\n*   做得比说得多的方法\n*   说得比做得多的方法\n*   做与说相反的方法\n*   名称暗示包含内容多于实体实际包含内容的标识符\n\
  *   名称暗示包含内容少于实体实际包含内容的标识符\n*   名称暗示内容与实体实际包含内容相反的标识符\n\n\n\n识别这些代码异味最简单的方法是从练习\
  \ 3.1 和 3.3 制作的表格入手，对比两个可以了解类型的来源。首先，从名称中收集的类型（如 `find_id`，表明返回一个 id，可能是字符串或整数）与函数定义中定义的名称类型（如\

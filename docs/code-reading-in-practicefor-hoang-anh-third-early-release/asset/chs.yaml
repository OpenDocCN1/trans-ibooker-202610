  \ `Decorations`，它们可以用在函数中，如 `getDecorationsInRange()`。在审视领域时，还有一个区分很有用：对象与对象属性之间的区别。像\
  \ `Bracket Pairs` 这样的对象可以拥有像 `Colorized` 这样的属性，因为在这个领域中，一对括号可以获得特定的颜色。所以 `Colorized`\
  \ 本身不是一个领域概念，而是一个与 `Bracket Pairs` 一起使用的修饰符。\n\n我们在练习 3.1 中收集的类型也有助于确定领域概念的组件类型。函数往往包含更多通用词汇，尤其是动词，如\
  \ `execute`、`read`、`load` 或 `create`。然而，函数名也经常揭示特定领域的行为，如 `buying`、`selling`、`placing\
  \ an order` 或 `favoriting an item`。函数名不仅限于行为。函数名也可以揭示领域概念；例如，函数名 `getDecorationsInRange()`\
  \ 告诉我们存在一个 `range`（范围），装饰物落在这个范围内。\n\n#### 将概念映射到组件\n\n将练习 3.1 中的所有名称及其类型，以及练习 3.2\
  \ 中名称中的所有概念列在灰色列中。这些内容填入表格的前 3 个灰色列，并非新信息。现在填写最后一列，将概念分为 `Object`（对象）或 `Function`（函数）组件，或\
  \ `Attributes`（属性）。\n\n##### 练习 3.3：概念与组件\n\n| 名称 | 类型 (3.1) | 概念 (3.2) | 组件 |\n\

  #### 理解领域概念


  现在你已经清楚地理解了 MR 和文件的结构，是时候回到领域概念了。


  让我们回到 MR 的对话选项卡，在那里你找到了称为 *异步守护进程* 和 *健康检查* 的领域概念。从文本中你可以推断出 *异步守护进程* 是一个现有概念，而
  *健康检查* 的功能是为它实现的。你记下了这些概念但没有做任何处理。现在让我们利用现有的文档来查找这些词的含义，并将它们记录在练习 11.3 中。这包括在此 MR
  中添加的新文档。你还应该阅读注释（如果有），看看还有哪些其他领域概念。


  ##### 练习 11.3：将所有领域概念添加到列表中并在文档中搜索其含义。


  | 名称 | 含义 |

  | --- | --- |

  | *异步守护进程* | *异步投影处理引擎* |

  | *健康检查* |   |


  一旦你理解了新旧领域语言的含义，就可以查看测试，了解这些概念是如何工作的。首先检查测试的名称，并给出你自己的表述，说明你认为测试在做什么。以 `` `should_add_settings_to_services`
  `` 为例。即使你知道大多数领域概念的含义，也很难推断出这到底在测试什么。意思是：使用异步守护进程扩展的健康检查应该向服务添加设置？哪些服务现在应该具有这些设置？


  你还必须分析测试是否做了名称所暗示的事情。如果你查看 `` `should_be_healthy_with_one_projections_lagging` ``
  的测试实现，你会发现断言语句与测试名称不匹配。根据代码，健康检查应该返回不健康状态：`` `result.Status.ShouldBe(HealthStatus.Unhealthy)`
  ``；这是要在 MR 中添加为注释的内容，如 图 5-6 所示。


  ![](img/reading_for_code_reviews_309317_06.png)


  让我们看看另一个领域概念。`` `HealthCheckResult` `` 是所用库中的一个领域概念，在代码中被使用。我倾向于通过引入自己的领域概念并将其转换为我的概念来保护我的代码免受此类泄漏的影响。这也是一个非常通用的名称，我可以将其改为更具体的名称，如
  `` `AsyncDaemonHealthStatus` ``，这比原名称能告诉我更多关于该方法返回值的信息。


  我还注意到这里过度使用了 `Unhealthy`。可能发生三种情况：异步守护进程是健康的、不健康的，或者在尝试确定时发生某种错误。在最后一种情况下，我不知道异步守护进程的健康状态如何，但他们却声称它是不健康的。我会尝试找到更好的方法来处理这种情况。


  ##### 练习 11.4：调查领域概念 `AsyncDaemonHealthCheckSettings`。



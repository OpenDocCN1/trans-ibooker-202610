  \ per customer）。\n\n你能找到多少种不同的单词顺序？讨论出现的模式也很有趣。这些顺序或单词在局部或全局是否相似，即一个方法是否大量使用一种模式，而另一个方法使用不同的模式？\n\
  \n| 变量名 | 元素 | 顺序 |\n| --- | --- | --- |\n| `keywords_requiring_indentation` | `keyword,\
  \ requiring, indentation` | `noun, verb, noun` |\n| `imported_product` | `imported,\
  \ product` | `adjective, noun` |\n| `minimum_distance` | `minimum, distance` | `quantifier,\
  \ noun` |\n|  |  |  |\n|  |  |  |\n|  |  |  |\n\n##### 注记\n\n命名模式^(3)是变量名中元素通常组合的模式。例如，当需要为某人每月可获得的最大福利命名时，你可以选择\
  \ `max_benefit`、`max_benefit_per_month` 或 `max_benefit_num`。这些名称包含相同的领域概念，但表达方式不同。Feitelson\
  \ 对 47 名开发者进行了实验，结果显示两名开发者选择相同名称的概率很低：研究中的中位数概率仅为 7%！多样化的变量名会给工作记忆带来更大压力，因为你每次都要在不同位置搜索相关部分。\n\
  \n#### 重构\n\n如果你想利用本章的发现改进代码库，可以考虑以下重构，部分基于第 3.4.2 节的质量问题。\n\n##### 发音相似的对象\n\n\
  在某些情况下，发音相似的对象可能需要代码变更。以下是几个问题：\n\n*   如果它们真正不同，能否重命名一个以最小化重叠和困惑？\n*   如果它们相同，能否合并为一个对象，共享一些相似性？\n\
  \n##### 模糊的名称\n\n你可能会发现一些名称不能准确描述代码功能，如 `analyze`、`convert`。对于像 `process()` 这样模糊的名称，什么更精确的名称更好？\n\
  \n##### 异味名称\n\n如果你在练习 3.9 中发现名称与实现不完全匹配，可能需要重命名方法或标识符使其更精确。你也可能想与更熟悉代码库的人讨论其实现，以确定名称为何不匹配实现。在某些情况下，修改实现比修改名称更好。例如，当你有一个名为\
  \ `return name_and_id` 的方法但只返回 id，然后在多处用它获取名称时，最好实际返回名称和 id，并重构代码以集中获取名称的逻辑。\n\n\
  ### 总结\n\n代码可以在不同维度阅读：结构、领域、概念、上下文和协作。本章探讨了领域维度，研究了变量、函数和对象的命名方式、从名称可以学到什么，以及如何利用名称理解和提高代码质量。下一章将探讨编程概念。\n\

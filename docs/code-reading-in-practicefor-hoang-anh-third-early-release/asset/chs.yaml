  \ X509 注释给出了如何在代码库外继续搜索的提示。如果你还不熟悉 X509，现在可能会想知道它是什么。\n\n### 检查代码片段周围环境\n\n现在你已经对所检查的内容找到了一些着力点，可以尝试在代码库外部寻找信息。但在这样做之前，为你想要回答的问题制定一个搜索计划是明智的。我曾花费许多个下午随意浏览页面，并没有真正跟踪自己是否取得了进展。虽然如果你想在一个更大的新领域或编程语言中建立一些基础，这可能有用，但如果你只是想出于明确目的（使用应用、修复\
  \ Bug）来理解某些代码，你可能不会对所有东西都感兴趣。\n\n#### 制定清晰的搜索计划\n\n\n\n\n\n首先，你需要做的是制定一个清晰的搜索计划，其中包含一个你在搜索更多信息时想要了解的事项列表。如果你已经浏览了上面的代码片段，无论是否使用了前几章的练习，这些可能是你仍然会困惑的地方：\n\

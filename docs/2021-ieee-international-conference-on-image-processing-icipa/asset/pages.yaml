  md: '# 3.2. Loss Functions of the IF-GAN


    The loss function of the IF-GAN is given below:


    ℒ = λ₁ · ℒ_cGAN(G, D) + λ₂ · ℒ_L1(G) + λ₃ · ℒ_softmax(E) + λ₄ · ℒ_IL(E)


    where the hyperparameters λ₁, λ₂, λ₃, and λ₄ are used to balance the four terms.
    ℒ_L1 is the dominant loss for expressive face generation and ℒ_softmax is the
    dominant supervision signal to classify the expressive face. ℒ_cGAN must be jointly
    optimized with ℒ_L1 to better produce outputs with the distribution of real data.
    Larger ℒ_IL results in inseparable features and slow convergence according to
    [5]. Therefore, the weights of ℒ_L1 and ℒ_softmax are higher than other losses.


    The cGAN loss function ℒ_cGAN(G, D) is defined as:


    ℒ_cGAN(G, D) = 𝔼[log D({I_SE, I_AE})] + 𝔼[log(1 − D({I_SE, G(I_SE)}))]


    where G(I_SE) is the generated image Î_AE, {I_SE, G(I_SE)} is a fake tuple, and
    {I_SE, I_AE} is a real tuple.


    Competing against the discriminator D, G(·) learns the true data distribution
    using L1 distance:


    ℒ_L1(G) = 𝔼[‖I_AE − G(I_SE)‖₁]


    E is jointly trained with D and G, using softmax loss and expression label l_e
    to define expression loss:


    ℒ_softmax(E) = 𝔼[log p(l_e | {I_SE, I_AE})] + 𝔼[log p(l_e | {I_SE, G(I_SE)})]


    Island loss ℒ_IL(E) [5], which simultaneously reduces the intra-class variations
    and increases the inter-class differences, is employed jointly with the softmax
    loss to train expression classifier E:


    ℒ_IL(E) = Σ_{i=1}^M ‖x_i − c_{y_i}‖₂² + α Σ_{j=1}^N Σ_{k≠j}^N ( (c_k · c_j)/(‖c_k‖₂‖c_j‖₂)
    + 1 )


    where M is the number of images; N is the number of expression classes; c_k and
    c_j denote the k^th and j^th expression centers; (·) denotes dot product; α =
    0.03 balances the two terms. Minimizing the island loss pushes same-class samples
    closer while separating them from other samples.


    # 4. EXPERIMENTS


    # 4.1. Experimental Datasets


    BU-3DFE [26]: Following [1, 12], we used 1,200 images of six basic expressions
    (anger, disgust, fear, happiness, sadness, and surprise) with high intensity,
    i.e., the last two levels.


    CK+ [27, 28], with 118 subjects, has 327 videos labeled with one of seven expressions,
    i.e., contempt and six basic expressions. As in [5], the last three frames from
    309 videos labeled as one of six basic expressions formed a 927-image experimental
    dataset.


    MMI [29] has 208 sequences of 31 subjects displaying six basic expressions in
    frontal-view. Like [4], we collected three peak frames in the middle, for a total
    of 624 images.


    RAF-DB [7] is a large spontaneous FER dataset of thousands of subjects with various
    head poses, lighting conditions, and occlusions. We used the RAF-DB single-label
    subset (12,271 training images and 3,068 testing images) labeled with one of neutral
    or six basic expressions.


    For the posed facial expression datasets, we used a 10-fold cross-validation strategy,
    i.e., each dataset was split into 10 subsets, mutually exclusive by subjects.
    For each run, there were 8 training, one validation, and one testing subsets.
    Reported results are the average of 10 runs. RAF-DB experiments used the standard
    training and testing sets.


    # 4.2. Preprocessing


    We employed the given cropped RAF-DB face images. BU-3DFE, CK+, and MMI face regions
    were aligned based on the eye centers and nose tip, detected by MTCNN [30] and
    then scaled to 256 × 256 with random horizontal flipping and random -5° and 5°
    rotations before randomly cropping to 224 × 224 patches during training. The center-cropped
    patches are used in testing.


    # Table 1: Performance comparison on three posed datasets.


    | Method | BU-3DFE | CK+ | MMI |

    |---|---|---|---|

    | Center Loss [21] | – | 92.25 | 73.40 |

    | Island Loss [5] | – | 94.39 | 74.68 |

    | IACNN [4] | – | 95.37 | 71.55 |

    | DLP-CNN [7] | – | 95.78 | – |

    | FN2EN [10] | – | 96.80 | – |

    | IA-gen [1] | 76.83 | 96.57 | – |

    | Lopes et al. [8] | 72.89 | 96.76 | – |

    | APM [15] | – | – | 74.04 |

    | PPDN [6] | – | 97.3 | – |

    | FERLfTc [14] | 82.89 | – | – |

    | uGMM-MIK [18] | – | – | 73.2 |

    | DeRL [12] | 84.17 | 97.3 | 73.23 |

    | ResNet-101 | 82.5 | 94.82 | 71.15 |

    | IF-GAN w/o attention | 84.25 | 95.79 | 73.56 |

    | IF-GAN | 85.25 | 97.52 | 75.48 |


    # 4.3. CNN Implementation Details


    ResNet-101 [25], pre-trained on ImageNet [31], was our baseline model and also
    the expression classifier E in the IF-GAN. For evaluation, the baseline and IF-GAN
    were fine-tuned on each dataset’s training set, with the other three datasets
    used as additional training data. For each 10-fold evaluation run for the posed
    FER datasets, the six “average” identity expressive images were obtained by averaging
    all same-label expressive images in its training set.


    1 In our experiments, we set λ₁ = 1, λ₂ = 20, λ₃ = 10, and λ₄ = 1 empirically.


    2 To make a fair comparison, the island loss is also employed.'

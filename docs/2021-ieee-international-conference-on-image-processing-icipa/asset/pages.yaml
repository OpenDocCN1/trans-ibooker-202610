- pgno: 3
  md: 'With significant pose variations in RAF-DB, the “average” identity expressive/neutral
    images were obtained by averaging all images with the same expression label in
    the three posed datasets containing only frontal view faces. IF-GAN thus achieves
    both pose-invariant and identity-free FER.


    The baseline and IF-GAN were implemented in PyTorch [32] and optimized with Adam
    [33] with mini-batch size 50, β1 = 0.9, β2 = 0.99, and a weight decay parameter
    of 1e-4 over 100 epochs. Learning rate μ, initially 1e-4, was reduced by a 0.9
    factor every 10 epochs.


    # 4.4. Experimental Results


    # Table 2: Performance comparison on the RAF-DB.


    | Method | Accuracy |

    |---|---|

    | Island Loss [5] | 83.64 |

    | Center Loss [7] | 83.68 |

    | DLP-CNN [7] | 84.13 |

    | gACNN [17] | 85.07 |

    | APM [15] | 85.17 |

    | LDL-ALSG [13] | 85.53 |

    | IPA2LT(LTNet) [11] | 86.77 |

    | RAN [19] | 86.90 |

    | Covariance Pooling [9] | 87.00 |

    | SCN [20] | 88.14 |

    | ResNet-101 | 86.31 |

    | IF-GAN w/o attention | 87.32 |

    | IF-GAN | 88.33 |


    As shown in Table 1 and 2, IF-GAN with the self-attention module not only outperforms
    the baseline ResNet-101 and IF-GAN without the self-attention module, but also
    achieves state-of-the-art results on all four datasets versus other methods in
    comparison. On CK+, DeRL [12] and PPDN [6] reach state-of-the-art performance,
    but DeRL [12] is not end-to-end trainable and thus incurs high computational cost
    while PPDN [6] uses reference neutral images, which are not available for most
    real-world applications.


    # 4.5. Expression Transfer Analysis


    ![](img/c4f0907ab0498411e01ae8e451ecaa82_3_0.png)


    Fig. 5: Examples of expression transfer results on four datasets.


    Fig. 5 demonstrates “average” identity expressive image generation from input
    images. Generated face images completely remove identity information of the input
    images while possessing the expression information.


    # 4.6. Attention Map Analysis


    ![](img/c4f0907ab0498411e01ae8e451ecaa82_3_1.png)


    Fig. 6: Demonstration of long-range dependency learning across feature maps by
    visualizing the attention maps from the last U-Net layer self-attention module,
    the ones closest to the generated image. In each box, the first image is the input
    expressive image, the second image is the generated “average” identity expressive
    image, and the final three images are learned attention maps for three query locations
    indicated by three dots. Best viewed in color.


    To understand what self-attention modules learned after the 56 × 56 feature maps
    in Fig. 3, we visualized the attention maps from the last U-Net layer self-attention
    module for different input images in Fig. 6. We noticed that the self-attention
    modules learn to model the relationships among regions according to similarity
    of intensity, texture, and edge rather than just spatial adjacency. Furthermore,
    most of the attention maps have highlighted regions around the lip, nose, cheek,
    eyes, and eyebrows, consistent with the psychological studies [34]. For example,
    in Fig. 6 (e), the three attention maps for three query locations focus on eye
    and eyebrow, lip, and cheek regions, respectively, and are highly related to a
    set of facial action units (AUs) [35], which describe an expression. In Fig. 6
    (d), regions highlighted for generating a happiness expression are located around
    the cheek, AU6 (Cheek Raiser), and around the lip corners, AU12 (Lip Corner Puller).
    In Fig. 6 (f), the regions related to a surprise expression [28], i.e., AU5 (Upper
    Lid Raiser) and AU27 (Mouth Stretch), are most highlighted. The self-attention
    module demonstrates similar observations for other expressions.


    # 5. CONCLUSION


    This work describes an end-to-end IF-GAN framework for identity-free FER. Differing
    from other subject-independent methods, IF-GAN removes identity-related information
    completely. Experimental results on four facial expression datasets show the proposed
    IF-GAN achieves state-of-the-art performance. Furthermore, results on RAF-DB show
    the IF-GAN can deal with variations in pose, occlusion, and illumination.


    # 6. ACKNOWLEDGEMENT


    This work was supported by National Science Foundation under CAREER Award IIS-1149787.
    The Titan Xp used for this research was donated by the NVIDIA Corporation.'

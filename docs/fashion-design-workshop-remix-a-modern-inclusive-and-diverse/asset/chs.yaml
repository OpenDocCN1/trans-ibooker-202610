  关于艺术家


  ![Image](img/f0128-01.jpg)


  **Stephanie Corfee** is an artist, designer, and author who works from her home
  studio in Malvern, Pennsylvania.

  **Stephanie Corfee** 是一位艺术家、设计师和作者，在宾夕法尼亚州马尔文的家庭工作室工作。She and her husband have three
  sons, plus one brand-new baby girl.

  她和丈夫有三个儿子，外加一个刚出生的小女儿。Stephanie has written and illustrated several art books and
  a coloring book, and she licenses her paintings and surface designs for gifts, apparel,
  and home accessories.

  Stephanie 写过并插画了多本艺术书和一本涂色书，并将她的绘画和表面设计授权用于礼品、服装和家居饰品。Stephanie also teaches online
  classes available on her website, as well as on Skillshare.com.

  Stephanie 还在她的网站以及 on Skillshare.com 上教授在线课程。“The most rewarding part of my job
  is hearing from students or customers who have used my books. When they tell me
  they feel encouraged and inspired to create, it makes my whole day.”

  “我工作中最有回报的部分是听到使用过我书籍的学生或顾客的声音。当他们告诉我他们感到受到鼓励和启发去创作时，我整天都会感到开心。”Learn more at [www.stephaniecorfee.com](http://www.stephaniecorfee.com).


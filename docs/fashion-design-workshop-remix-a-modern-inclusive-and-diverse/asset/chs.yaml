- '# 第 5 章


  ## 特殊场合：分步项目


  ![Image](img/f0102-01.jpg)


  ### 正装（或非正式装）


  我们已经确定时尚是我们日常生活不可或缺的一部分，每项活动都有相应的服装。但最具标志性的服装始于高级定制时装的世界：由著名设计师创作的定制、高端、独一无二的时装。从
  Lady Gaga 佩戴的夸张时尚到 Oprah Winfrey 身着的经典礼服，特殊场合的设计就是魅力开始的地方！从这些时尚前卫的设计中借鉴一个或多个灵感，创作出你自己独特的正装系列！


  #### 红毯魅力


  ![Image](img/f0104-01.jpg)


  1


  从一个木棍人开始。


  ![Image](img/f0104-02.jpg)


  2


  填充轮廓，标示出颈部、手臂、腿部和躯干。在脸上添加中心线和水平视线。


  ![Image](img/f0104-03.jpg)


  3


  勾勒出礼服的基本设计特征。画时思考领口、裙摆形状、丰满度和角度。勾勒出与礼服风格相衬的发型。


  ![Image](img/f0105-01.jpg)


  4


  擦除初始草图的结构线并完成细节。


  ![Image](img/f0105-02.jpg)


  这件礼服不对称、大胆且不繁琐——散发自信的时尚！强劲的黑色轮廓强调了礼服的形状，而随意的彩色笔触则表现质感和光泽。浅色调的条状填充营造出高光，使插画具有工作室草图般的氛围。


  #### 经典舞会礼服


  ![Image](img/f0106-01.jpg)


  1


  以经典姿势开始画一个木棍人。


  ![Image](img/f0106-02.jpg)


  2


  添加轮廓开始构建姿势。


  ![Image](img/f0107-01.jpg)


  3


  勾勒你的设计！画这件裙摆蓬松的两件式礼服。保持形状简单，让渐变色成为焦点。添加一款优雅的发型来衬托整体造型。


  ![Image](img/f0107-02.jpg)


  4


  擦除不必要的线条和草图痕迹，展现干净的设计。


  ![Image](img/f0108-01.jpg)


  5


  添加细节。画上带细带的 floral 高跟鞋，在高低不一的裙摆下露出迷人一角。


  ![Image](img/f0109-01.jpg)


  将线稿转移到水彩纸上。用漂亮的蓝色柔和渐变的水彩创造渐变效果。添加简单的金色鞋子、耳环和配套腰带增添光彩。深海军蓝的裙衬与鞋上的薰衣草花朵形成完美对比。


  #### 花卉燕尾服


  ![Image](img/f0110-01.jpg)


  1


  以简单姿势开始画一个木棍人。用椭圆形画头部；然后用水平线堆叠肩膀、胸部、腰部和臀部。


  ![Image](img/f0110-02.jpg)


  2


  通过勾勒结构为人物增加重量。在脸上添加中线和视线。


  ![Image](img/f0111-01.jpg)


  3


  画出燕尾服的基本结构。


  ![Image](img/f0111-02.jpg)


  4


  擦除结构线。


  ![Image](img/f0112-01.jpg)


  5


  除了口袋方巾，这件燕尾服的细节都围绕花卉图案！在西装上画一些粗糙的花卉以平衡布局。


  ![Image](img/f0113-01.jpg)


  这件有趣的燕尾服的个性来自俏皮的花卉图案和色彩搭配的运动鞋。用你想要的色调的水彩上色，让这款设计焕发生机！


  #### 俏皮有趣的舞会皇后


  ![Image](img/f0114-01.jpg)


  1





  画一个符合你设计的姿势的简笔画人物。这个稍微有点 tricky，因为它展示的是人物背对观众，侧头看向一侧肩膀。腰后系带的肩部丝带细节与蝴蝶结让这个姿势最理想。始终考虑服装最突出的设计特点，然后创造最能展现这些细节的姿势。


  ![Image](img/f0114-02.jpg)


  2


  为造型增加体积感，同时加上中线、视线和发型。


  ![Image](img/f0114-03.jpg)


  3


  画出设计！这件华丽的派对礼服色彩鲜艳、独一无二，肩上系带的丝带蝴蝶结是其特色。楔形运动鞋为本已奇思妙想的造型增添了俏皮感。


  ![Image](img/f0115-01.jpg)


  4


  擦掉不必要的草图痕迹，然后添加配饰，如粗大的珠饰手链、褶边袜子以及配得上舞会皇后的头冠！


  ![Image](img/f0115-02.jpg)


  这幅最终插图采用数字上色，以捕捉明亮饱和的色彩和白底彩色闪光效果，但你也可以使用马克笔和墨水同样有效地呈现这种效果。


  ### Traditional Tux

  传统燕尾服


  ![Image](img/f0116-01.jpg)


  1


  画一个适合你设计的简化人物姿势。


  ![Image](img/f0116-02.jpg)


  2


  为人物增加形体和发型。


  ![Image](img/f0116-03.jpg)


  3


  画出你的设计！注意比例和结构。


  ![Image](img/f0117-01.jpg)


  4


  擦掉旧的草图线条，并添加你喜欢的任何细节！


  ![Image](img/f0117-02.jpg)


  这种优雅自信的风格值得一种富有表现力的绘画技巧。刷笔绘画能带来出色的线条质感和纹理。数字上色或使用粗马克笔添加大胆对比的黑色，以增强冲击力。粉色头发只是为了好玩！



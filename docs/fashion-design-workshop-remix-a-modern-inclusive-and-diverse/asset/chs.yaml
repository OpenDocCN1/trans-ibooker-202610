  通过从关节到关节勾勒简笔画人形来增加体积。在面部添加中线和眼线，以及她头顶的花朵。


  ![Image](img/f0041-02.jpg)


  3

  勾勒服装，包括方形的衬衫、上肩披肩、蓬松裙子和靴子。


  ![Image](img/f0042-01.jpg)



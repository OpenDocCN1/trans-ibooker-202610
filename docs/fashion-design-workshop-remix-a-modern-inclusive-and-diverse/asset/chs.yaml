  # 第 4 章

  ## 日常时尚：分步项目

  ![Image](img/f0056-01.jpg)

  ### 当代时尚设计

  时尚无处不在！从穿前卫风格的音乐人到咖啡店读诗的嬉皮士，时尚影响不容否认。无论海滩、瑜伽馆、夜出或舞会，都有适合每个场合和个人风格的时尚。以下项目创意帮助你想象为不同背景和体型的人设计时尚。

  #### 三种风格的瑜伽服

  ![Image](img/f0058-01.jpg)

  1

  画简笔画人形，关节用圆圈。用能最好展示设计的瑜伽姿势。

  ![Image](img/f0059-01.jpg)

  2

  从关节到关节连点成线增加体积。面部加显示眼睛位置的线。用简化形状表示手脚。

  ![Image](img/f0059-02.jpg)

  3

  添加设计松散细节，如袖长或轮廓。加几条线显示发型，几笔铅笔标记面部特征。快速自信工作效果最好。

  ![Image](img/f0060-01.jpg)

  4

  擦除不需要线条清理插图。加深最强曲线和细节。

  ![Image](img/f0060-02.jpg)

  5

  为服装添加细节。勾勒缝线、裙摆、图案、褶皱和褶裥。完成服装结构和其它风格要点。

  ![Image](img/f0061-01.jpg)

  绘画风格选择影响很大。此处人物仍铅笔画，仅服装着色和图案化，更突出时尚。最终插图为平板数位绘制，可选任意工具。

  ![Image](img/f0062-01.jpg)

  1

  以简笔画为模型姿势基础。用椭圆作头部，肩、胸、腰、臀用简单水平线。

  ![Image](img/f0062-02.jpg)

  2

  为线稿增加体积。 fuller 人物在每个关节周围留更多空间，线条更弯曲。注意模型腰宽与臀宽关系，以此指导。

  ![Image](img/f0063-01.jpg)

  3

  创建服装轮廓和基本形状。标记领口、袖长及关键设计，如开衩裤脚和裹身毛衣。选发型，松散勾勒形状。

  ![Image](img/f0064-01.jpg)

  4

  擦除原线和杂乱草图。干净轮廓有助于选择最终细节和配饰。

  ![Image](img/f0064-02.jpg)

  5




  精炼艺术细节，添加腰带、针织衫罗纹、紧身裤条纹、发带和瑜伽袜。记住风格在于细节，因此在添加美丽且实用的点缀时要深思熟虑。


  ![图像](img/f0065-01.jpg)


  这是一幅更紧凑、传统的绘画，使用铅笔起稿，随后用水彩和彩色铅笔完成。画面干净，细节清晰可见。


  ![图像](img/f0066-01.jpg)


  1

  勾画出所需姿势的基础棍棒人形。


  ![图像](img/f0067-01.jpg)


  2

  继续如前所述填充形体。


  ![图像](img/f0067-02.jpg)


  3

  为人物添加基础服装形状。想象这个人穿着这些衣服。他们的发型会是什么样？在本步骤中确定这些细节。


  ![图像](img/f0068-01.jpg)


  4

  清理你的草图！


  ![图像](img/f0068-02.jpg)


  5

  添加能让你的服装脱颖而出的细节。作为设计师，你的任务是在你创作的每件物品上体现独特的个人观点。确保你的设计反映出你是谁——这正是让它们脱颖而出的原因。


  ![图像](img/f0069-01.jpg)


  对于这幅最终插图，干净的草图被放在灯箱上，上面覆盖水彩纸。水彩以水洼的形式涂抹，随后用彩色铅笔绘制短裤上的图案。细细的黑色墨水轮廓为整体增色。


  ## 休闲氛围


  ![图像](img/f0070-01.jpg)


  1

  从休闲姿势开始。为头部画一个椭圆，肩线，以及显示松弛姿态的棍棒状四肢。


  ![图像](img/f0070-02.jpg)


  2

  用适合你设计的体型填充形体。


  ![图像](img/f0071-01.jpg)


  3

  开始勾勒服装轮廓。一件休闲 T 恤搭配短袖衬衫、卷起的紧身牛仔裤和便鞋，时尚感十足。几笔淡淡的铅笔线条暗示了一些胡须。


  ![图像](img/f0072-01.jpg)


  4

  擦除不需要的铅笔线条以清理草图。


  ![图像](img/f0072-02.jpg)


  5

  尽情添加细节和配饰，享受乐趣。这位潮人背着背包，戴着太阳镜、厚重手表，穿着棋盘格运动鞋，还有一些纹身。几条编织手链，让这个家伙真正体现了“潮”这个词。


  ![图像](img/f0073-01.jpg)


  最终插图具有休闲、艺术化的风格，与该设计的都市氛围相呼应。让你的想象力自由驰骋，并请你的缪斯来影响这里未体现的其他创意。


  ## 冲浪与沙滩


  ![图像](img/f0074-01.jpg)


  1

  这位冲浪者似乎渴望动起来，头发在风中飘扬。从所需姿势的棍棒人形开始。


  ![图像](img/f0074-02.jpg)


  2

  为人物增加重量感。这个姿势是侧脸，因此勾勒下巴有助于确定比例。快速草绘凌乱的波浪状头发，并画一条水平线表示眼睛位置。


  ![图像](img/f0075-01.jpg)


  3

  继续构建形体，体现你选择的时尚。比基尼底裤搭配收腰防晒衣是经典组合。


  ![图像](img/f0076-01.jpg)


  4

  擦除不必要的草图线条和标记。


  ![图像](img/f0076-02.jpg)


  5

  现在让它成为你的专属！在上衣正面添加大胆的图案，并在袖子上加一条条纹。松散的海滩风辫子、脚踝饰品和图案冲浪板让整体造型完整。


  ![图像](img/f0077-01.jpg)


  使用松散的水彩渲染和笔触为这个有趣而清新的设计上色。


  ## 深夜时分


  ![图像](img/f0078-01.jpg)


  1

  模特姿势与你设计的时尚基调和主题相符非常重要。这套夜店服装是对称的，模特正面站立、肩膀方正时会显得格外醒目。


  ![图像](img/f0078-02.jpg)


  2

  填充形体并添加几笔铅笔线条，指示与服装相匹配的发型。


  ![图像](img/f0079-01.jpg)


  勾勒服装的结构轮廓。上衣包括薄纱叠层和宽松袖子。裙子在裙摆处有交叉设计。添加高跟绑带凉鞋，打造有趣、时尚的造型。


  ![图像](img/f0080-01.jpg)


  4

  通过擦除旧草图线条来清理你的插图。为这个夜晚造型暗示一个大胆的唇色。


  ![图像](img/f0080-02.jpg)


  5

  添加几个最后的细节。记住简单形状往往自成一格，不需要太多繁琐的装饰。在这种情况下，裙子上的褶皱臀部、厚重耳环和包，以及鞋上的脚踝带就足够了。


  ![图像](img/f0081-01.jpg)


  虽然这套服装可以用多种颜色呈现，但黑色增添了醒目、高对比度的魅力，与薄纱风格相得益彰。戏剧性的黑色服装也非常适合在其他地方点缀色彩。这位模特展示了彩色渐变发色，以及与之相配的金色手拿包、耳环和鞋子。这绝对是一个引人注目的造型，适合一夜狂欢和尽情舞蹈！


  ## 摇滚


  ![图像](img/f0082-01.jpg)


  1

  从棍棒人形开始，尝试与该设计相匹配的姿势。如果你喜欢，可以参考一张展示该造型强势姿势的照片。


  ![图像](img/f0082-02.jpg)


  2

  填充形体，并画上简单的眼睛、嘴唇和头发的涂鸦。


  ![图像](img/f0083-01.jpg)


  3

  使用简单线条绘制服装，体现形状、体积、裙摆和层次。紧身项圈是这一时尚宣言的重要部分，因此在本步骤中加入它——或添加任何你喜欢的其他配饰。


  ![图像](img/f0084-01.jpg)


  4

  擦除任何多余线条和结构线。


  ![图像](img/f0084-02.jpg)


  5

  现在添加摇滚细节来展现你的风格！在牛仔裤上添加破洞，为鞋子添加钉饰鞋带，穿上渔网袜，并搭配一件图案背心。


  ![图像](img/f0085-01.jpg)


  使用马克笔或其他你喜欢的工具添加大胆、图形化的色彩。紫色头发、黑色西装夹克和李子色牛仔裤恰到好处。


  ## 在雪坡上


  ![图像](img/f0086-01.jpg)


  1

  从一个建立良好比例和平衡姿势的棍棒人形开始。


  ![图像](img/f0086-02.jpg)


  2

  构建形体，然后在头部添加垂直中心线和水平视线。


  ![图像](img/f0087-01.jpg)


  3

  是时候设计滑雪服了！这幅插图展示了复古风格的两件套轮廓，配有仿毛皮装饰靴子和毛球针织帽。别忘了护目镜或时尚太阳镜，它们是成品造型的重要部分。


  ![图像](img/f0088-01.jpg)


  4

  擦除任何不必要的铅笔线条。检查你的作品并不断完善形状和比例，直到得到一幅干净的画作。


  ![图像](img/f0088-02.jpg)


  5

  这套滑雪服包括一件 70 年代风格条纹的短款羽绒夹克和配套滑雪裤。添加配套手套、腰部罗纹装饰、抓绒上的拉链以及一些滑雪板，使其更具真实感。


  ![图像](img/f0089-01.jpg)


  阴影在纸上传达你的设计方面起着重要作用。如果没有每条接缝线的阴影，这件羽绒夹克看起来就像只是有条纹。注意高光区域如何向前突出，而暗部则后退。瞬间蓬松！罗纹针织帽和腰带也受益于深色阴影与浅色的对比。最后，注意夹克如何在裤子和抓绒上投下阴影。利用这种简单技巧让你的设计看起来更逼真。


  ## 都市混搭


  ![图像](img/f0090-01.jpg)


  1

  使用基本线条和每个关节处的圆圈勾勒这个姿势。


  ![图像](img/f0091-01.jpg)


  2





  构建人物形象。按照你的喜好绘制四肢。


  ![Image](img/f0091-02.jpg)


  3


  勾勒出设计的结构。在本例中，它是一件合身的夹克搭配休闲衬衫和及踝休闲裤。


  ![Image](img/f0092-01.jpg)


  4


  使用可塑橡皮擦清理旧的草图线条。细化剩余的线条和曲线，确保你对比例满意。


  ![Image](img/f0092-02.jpg)


  5


  尽情享受细节！添加条纹、波点、袖口处的夹克衬里，以及鞋面上的时尚设计。别忘了像口袋和闭合件这样的功能性细节。


  ![Image](img/f0093-01.jpg)


  将最终草图转化为全彩设计是你将自己的美学和独特视角注入艺术的机会。在本例中，氛围是奇思妙想且古怪的。使用细黑墨线增加个性，并用大胆色调的水彩营造质感和趣味。这种时尚是为个性十足的人准备的，因此绘画风格充满活力。


  ### Tennis Pro


  ![Image](img/f0094-01.jpg)


  1


  首先画一个稳健的站姿。用简单的水平线堆叠肩膀、胸部、腰部和臀部。从那里开始，在每个关节处加上圆形，并为手脚添加简单形状。


  ![Image](img/f0094-02.jpg)


  2


  开始为人物增加体积，注意这位运动员强壮结实的四肢和宽阔的肩膀。在脸上添加中线和视线。


  ![Image](img/f0095-01.jpg)


  3


  设计服装！即使是像网球裙或其他运动服这样简单的单品，你也可以让创意自由流淌。不对称的裙摆和单肩设计搭配撞色，看起来自信而有能力。束起的发型适合运动，运动鞋必不可少。


  ![Image](img/f0096-01.jpg)


  4


  擦除旧的草图线条并细化绘画，直到它平衡得当。


  ![Image](img/f0096-02.jpg)


  5


  添加小细节，如条纹、缝线、一条手臂上的配套护腕，以及获胜的袜子。网球拍完成了整体造型！


  ![Image](img/f0097-01.jpg)


  对于这种大胆、强劲、不拖泥带水的设计，选择干净、图形化的插画风格是合理的。在本例中，最终作品是在平板上数字绘制的。醒目的平面色彩被添加到干净的黑线稿上。这种技巧与时尚的感觉相契合。


  ### Boho Chic


  ![Image](img/f0098-01.jpg)


  1


  画一个符合设计想法的姿势的人物。在本例中，无忧无虑的姿势非常适合自由奔放的音乐节参与者。


  ![Image](img/f0098-02.jpg)


  2


  通过勾勒结构填充木棍人形。根据体型创建曲线，并在脸上添加中线和视线。


  ![Image](img/f0099-01.jpg)


  3


  设计衣服！添加简单轮廓以显示服装中每件单品的形状。对于这位音乐节时尚达人来说，这是一套奇思妙想的组合，包括吊带上衣、破洞牛仔裤、一件系在上方的薄纱裹裙，以及松垮的麂皮质感靴子。


  ![Image](img/f0099-02.jpg)


  4


  擦除结构线以获得设计的干净版本。


  ![Image](img/f0100-01.jpg)


  5


  装饰并添加细节！这套服装是多多益善、充满乐趣的。在靴子上添加珠饰，并在裙子上添加有趣的花卉图案。勾勒出雏菊链发带、飞行员墨镜，以及系在一臂上的印花围巾。长编织双马尾完成了这一造型。


  ![Image](img/f0101-01.jpg)


  这位波西米亚美女值得一种与她个性相匹配的插画风格。用焦赭色铅笔勾勒人物轮廓增添了泥土般的效果。使用遮盖液“绘制”裙子上的花卉图案。接下来，添加半透明的水彩渲染，使裙子具有浪漫、空灵的感觉。待颜料干后，轻轻擦去遮盖液，露出“花朵”空隙，然后可以用鲜艳的红粉色填充。添加一些淡色的背景细节，为人物营造出空间感——这是设计师常用的艺术技巧。



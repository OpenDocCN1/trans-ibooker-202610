    画一个符合你设计的姿势的简笔画人物。这个稍微有点 tricky，因为它展示的是人物背对观众，侧头看向一侧肩膀。腰后系带的肩部丝带细节与蝴蝶结让这个姿势最理想。始终考虑服装最突出的设计特点，然后创造最能展现这些细节的姿势。


    ![Image](img/f0114-02.jpg)


    2


    为造型增加体积感，同时加上中线、视线和发型。


    ![Image](img/f0114-03.jpg)


    3


    画出设计！这件华丽的派对礼服色彩鲜艳、独一无二，肩上系带的丝带蝴蝶结是其特色。楔形运动鞋为本已奇思妙想的造型增添了俏皮感。


    ![Image](img/f0115-01.jpg)


    4


    擦掉不必要的草图痕迹，然后添加配饰，如粗大的珠饰手链、褶边袜子以及配得上舞会皇后的头冠！


    ![Image](img/f0115-02.jpg)


    这幅最终插图采用数字上色，以捕捉明亮饱和的色彩和白底彩色闪光效果，但你也可以使用马克笔和墨水同样有效地呈现这种效果。



    When drawing figures in fashion design, the focus is generally on the garment,
    so drawing simple faces and hairstyles is common. For example, drawing one eye
    and a mouth can be enough to indicate expression without worrying about getting
    the proportions right. That’s not to say that you can’t be more detailed if you
    like. Trust your instincts and draw your models in a way that feels right for
    your designs. Likewise, hairstyles can be minimal or bold. Think about the personality
    of your design and match your hairstyle and facial expressions to that tone.


    ![Image](images/f0019-01.jpg)


    ## Keeping a Sketchbook


    Inspiration can strike at any time, and a trusty sketchbook is the best place
    to capture your brilliant ideas as they happen! Jot down an idea for a reversible
    jacket or sketch a diagram for a shoe. Maybe the colors in a piece of street art
    will inspire a quirky graphic tee or a ball gown. Or perhaps you’ll want to create
    a textures library. Carrying a sketchbook means you’ll be able to capture inspiration
    when it strikes!


    ### Sketchy Spontaneity

    Who wouldn’t love a peek inside the sketchbook of a fashion design icon? These
    scribbled ideas and messily sketched musings are the stuff of dreams! Fill a notebook
    with partial ideas, flashes of brilliance, and pencil sketches galore! Working
    quickly when inspiration strikes is where the magic happens, and your notebooks
    act as idea factories on days when the creativity is not flowing so freely. Add
    color with paint if the mood strikes!


    ![Image](images/f0020-01.jpg)![Image](images/f0020-02.jpg)


    ## Flatlay Fashions


    Occasionally, you might find that you want to skip drawing figures and jump straight
    into the design part. Creating hand-drawn flatlay fashions—curating all of the
    wardrobe essentials into one complete look—is a fun way to get the creative juices
    flowing. The term “flatlay” refers to styling a complete outfit—kind of like you
    might do when you lay clothing and accessories across the bed to pull together
    a look.


    To draw a flatlay design, sketch one central item of clothing—such as a patterned
    sundress—then build an outfit around it. You might add sandals or flip-flops,
    sunglasses, a straw hat, and a summery tote for a perfect day at the beach. Your
    sketchbook is perfect for creating flatlay designs.


    ![Image](images/f0021-01.jpg)


    [*OceanofPDF.com*](https://oceanofpdf.com)


    # Chapter 2


    ## Express Yourself


    ![Image](images/f0022-01.jpg)


    ### Uncovering Your Style


    The quiz below is designed to help reveal what makes you tick when it comes to
    fashion. Use your discoveries as a roadmap that leads you directly into the land
    of your personal style. Follow it to create something fabulous—or abandon it and
    create something totally outside of your comfort zone!


    #### Part I: Q & A


    Review the questions below and write your answers on a separate sheet of paper
    or in a notebook; then consider how your responses help inform your aesthetic
    as a designer. Remember, there are no “right” or “wrong” answers!


    1\. What color(s) appear most in your closet?


    2\. What color(s) do you dislike?


    3\. What pattern(s) appear most in your closet (for example, stripes, polka dots,
    paisley, etc.)?


    4\. What pattern(s) do you dislike?


    5\. Which celebrity/designer styles do you like best?


    6\. What types of fashion do you draw most often? (for example, casual, formal,
    bridal gowns, accessories, etc.)?


    7\. If you can/could make your own clothes, what items do/would you most love
    to make?


    8\. Where do you picture your fashions being worn: in a big city, in a small town,
    on the runway?


    9\. Do you prefer dresses and skirts or jeans and khakis?


    10\. Do you prefer soft and flowy or structured and tailored clothes?


    11\. Do you like to express yourself through fashion?


    12\. When it comes to clothing, what are the most important things you look for:
    a) comfort b) style c) a good fit d) usefulness


    13\. Do you like to: a) be ahead of trends b) stay in tune with trends c) do your
    own thing


    14\. What style or types of clothing do you love the most?


    15\. Do you like to match, or do you prefer to mix colors and patterns?


    16\. When you spot someone wearing a unique outfit, what is your first thought:
    a) “That’s cool!” b) “That’s weird!”


    17\. If you could only wear one shirt for the rest of your life, what type of
    shirt would you choose?


    18\. Do you like graphic or statement T-shirts?


    19\. What word best describes how you view yourself?


    a) tough b) sweet c) rebellious d) cute e) sophisticated


    20\. Would you like to design clothes that suit your personal fashion style or
    a completely different style?


    21\. What item of clothing should be in every closet?


    22\. What accessory should be in every closet?


    23\. What designer would you most like to work with or learn from?


    24\. What would you like the world to say about your designs?


    #### Part II: Discovering Your Style Muses


    Review the style muses shown [here](#ch02.xhtml#page_26). In light of your answers
    from the quiz, have any of your opinions changed? Take some more time to answer
    the questions below.


    ![Image](images/f0025-01.jpg)


    ##### Soft & Romantic (shown [here](#ch02.xhtml#page_26))


    What do you like or dislike about this sketchy, softly shaded style?


    ##### Chic & Minimal (shown [here](#ch02.xhtml#page_26))


    What do you like or dislike about this clean, bold, graphic style?


    ##### Playful & Cute (shown [here](#ch02.xhtml#page_27))


    What do you like or dislike about this whimsical style?


    ##### Avant Garde / Couture (shown [here](#ch02.xhtml#page_28))


    What do you like or dislike about this spontaneous, artsy style?


    ##### Editorial (shown [here](#ch02.xhtml#page_29))


    What do you like about this carefully rendered style?


    ### Style Muses


    The next few pages feature a range of styles and techniques—we’ll call them style
    muses—to help jump-start your creativity. Notice how a particular drawing style
    lends itself to a specific type of fashion. For example, a quirky and playful
    outfit might be drawn in loose sweeping strokes, whereas chic and sophisticated
    apparel is usually drawn using clean, bold lines.


    #### Soft & Romantic


    If this style appeals to you, you might be a dreamer, a lover of romantic novels
    and history, or someone who adores soft colors, flowers, and pretty little details.


    Your muse is soft-spoken, sweet, and gentle.


    ##### Drawing Style:

    Sketchy, textural feel


    Softly shaded


    Thin, even lines


    Muted tones, like Sepia


    ##### Fashion Style:

    Flowing shapes


    Sheer fabrics


    Ruffles


    Delicate details, like lace and embroidery


    Florals


    ![Image](images/f0026-01.jpg)


    #### Chic & Minimal


    If this style appeals to you, you may be a no-nonsense type who values results
    and efficiency. You care about looking pulled together, but you don’t want to
    fuss with a million little details.


    Your muse is a leader with a strong personality and confidence.


    ##### Drawing Style:

    Black-and-white forms


    Bold shapes


    Graphic details


    Dark marker or ink


    ##### Fashion Style:

    Simple and confident


    Clean and unfussy


    Strong silhouettes


    Comfort combined with sophistication


    Minimal details


    Tailored look


    ![Image](images/f0026-02.jpg)


    #### Playful & Cute


    If this style appeals to you, you are probably a free spirit who loves having
    fun. You find joy in everything and you don’t take yourself too seriously.


    Your muse has a bright, chirpy personality and a perma-smile; they are everybody’s
    best friend.


    ##### Drawing Style:

    Illustrative


    Vibrant colors and patterns


    Chunky lines


    Bright markers or colored pencils


    ##### Fashion Style:

    Whimsical graphics


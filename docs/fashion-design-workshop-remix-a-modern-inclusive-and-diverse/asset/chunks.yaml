    # Chapter 4


    ## Everyday Fashions: Step-by-Step Projects


    ![Image](images/f0056-01.jpg)


    ### Contemporary Fashion Design


    Fashion is literally all around us! From the aspiring musician rocking an edgy
    vibe to the cool poetry-reading hipster at the coffee shop, the influence of fashion
    cannot be denied. Whether at the beach, the yoga studio, a night out on the town,
    or the prom, there is a type of fashion to match every occasion and individual
    style. Here are a few project ideas to get you started imagining all of the ways
    you can design fashions for people from all backgrounds and body types.


    #### Yoga Wear in Three Styles


    ![Image](images/f0058-01.jpg)


    1

    Sketch a stick figure, including circles for the joints. Use a yoga pose that
    will best show off the design you have planned.


    ![Image](images/f0059-01.jpg)


    2

    Add volume to the figure by “connecting the dots” from joint to joint. Add a line
    to the face that shows eye placement. Use simplified shapes to indicate hands
    and feet.


    ![Image](images/f0059-02.jpg)


    3

    Add loose details of your design, such as sleeve length or silhouette. Add a few
    sketched lines to show hairstyle and a few swipes of the pencil to mark facial
    features. Work quickly and confidently for the best results.


    ![Image](images/f0060-01.jpg)


    4

    Clean up your illustration by erasing unneeded lines. Darken the strongest curves
    and details.


    ![Image](images/f0060-02.jpg)


    5

    Add details to the clothing. Sketch in seams, hems, patterns, folds, and gathers.
    Finalize the garment’s construction and any other style points.


    ![Image](images/f0061-01.jpg)


    Creative choices in your drawing style make a big difference. Here, the figure
    remains drawn in pencil and only the clothing is colored and patterned, which
    highlights more of the fashion. This final illustration was created digitally
    by drawing on a tablet with a stylus, but you can choose whatever tools work best
    for you!


    ![Image](images/f0062-01.jpg)


    1

    Draw a stick figure as a base for your model’s pose. Start with an oval for the
    head and simple horizontal lines for the shoulders, chest, waist, and hips.


    ![Image](images/f0062-02.jpg)


    2

    Add volume to your line art. For fuller figures, add more space around each joint
    and more curve to each line. Pay attention to whether the width of the waist is
    smaller or larger than the width of the hips on your model, and use those proportions
    to guide you.


    ![Image](images/f0063-01.jpg)


    3

    Create the clothing silhouette and basic shapes. Mark the neckline, sleeve length
    and any key design features, such as the split pant hems and wraparound sweater.
    Choose a hairstyle, and loosely sketch the shape.


    ![Image](images/f0064-01.jpg)


    4

    Erase your original lines and stray sketch marks. Seeing your clean silhouette
    will help you to choose final details and accessories.


    ![Image](images/f0064-02.jpg)


    5


    \n    [*OceanofPDF.com*](https://oceanofpdf.com)\n\n    ## Introduction\n\n  \
    \  Welcome to Fashion Design Workshop: REMIX—where fashion design, illustration,\
    \ and creativity intersect with inclusivity, empowerment, and individuality! In\
    \ this companion to my first book, Fashion Design Workshop (Walter Foster Publishing),\
    \ we dive deeper into creative expression through learning the art of fashion\
    \ design, including experimenting with a range fun and engaging techniques across\
    \ a variety of media, while simultaneously learning to cultivate a uniquely personal\
    \ style. Fashion Design Workshop: REMIX is a celebration of design and how we\
    \ express ourselves through fashion regardless of body type, physical ability,\
    \ or gender."

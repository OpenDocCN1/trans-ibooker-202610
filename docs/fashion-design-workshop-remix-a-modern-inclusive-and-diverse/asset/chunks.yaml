    For this sketch, a simple, straightforward pose showing off the clothing and headdress
    works best.


    ![Image](images/f0040-01.jpg)


    1

    Draw an oval for the head and a stick figure made of lines and circles.


    ![Image](images/f0041-01.jpg)


    2

    Add volume to the figure by outlining the stick figure moving from joint to joint.
    Add a midline and eyeline to the face, as well as the flowers atop her head.


    ![Image](images/f0041-02.jpg)


    3

    Sketch in the clothing, including a boxy blouse, shoulder wrap, full skirt, and
    boots.


    ![Image](images/f0042-01.jpg)


    4

    Erase unnecessary lines to reveal the basic garments only.


    ![Image](images/f0042-02.jpg)


    5

    Add the details! Since this fashion is inspired by an iconic artist, try using
    some motifs that are fitting to her style, such as a square frame of ribbon trim
    on the blouse and a band of decorative trim on the skirt. Add bulky statement
    jewelry to punch up the effect.


    ![Image](images/f0043-01.jpg)


    Using any art tools of your choosing, add deep color with lots of texture. In
    this case, the hand-painted art is outlined lightly in charcoal. Painted decorative
    ribbons shine in bright colors, and rosy cheeks and bright red lips complete the

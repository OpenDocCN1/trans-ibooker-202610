    Erase any unneeded sketch lines.


    ![Image](images/f0046-01.jpg)


    5

    Add the defining details that make the look unique. Tailored seamlines are shown
    here, plus wrist gloves and jewels!


    ![Image](images/f0047-01.jpg)


    Celebrities and other famous figures often become well-known for their signature
    looks, which makes them almost instantly identifiable. Many fashion designers
    dream of the day that a celebrity wears one of their creations. The little black
    dress, flats, gloves, and sparkly jewels are all signatures of Audrey Hepburn.

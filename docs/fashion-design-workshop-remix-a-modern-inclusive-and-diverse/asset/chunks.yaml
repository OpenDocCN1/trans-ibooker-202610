    # Chapter 6

    第 6 章


    ## Design a Line

    设计一条线


    ![Image](img/f0118-01.jpg)


    ### Mini Collections

    小型系列


    另一个挑战设计技能的好方法是基于一个单词创作三件套的小型系列。构建系列会迫使你思考不同服装单品和穿搭方式。设计休闲服、晚装、分体装、连衣裙、运动服等。使用一个主题词保持整体一致。


    ![Image](img/f0120-01.jpg)


    #### Idea Factory: Mix & Match

    点子工厂：混搭


    需要一个启动点来激发创意？试试这些有趣的练习，获得即时灵感！


    在纸上，A 栏填入形容词，如颜色、质地、感受等。B 栏填入名词，包括人、地点和事物。


    **Column A Examples**

    **A 栏示例**


    Pink

    粉色


    Fuzzy

    柔软的


    Happy

    快乐的


    Sparkly

    闪亮的


    Somber

    沉郁的


    **Column B Examples**

    **B 栏示例**


    Rock Star

    摇滚明星


    Beach

    海滩


    Leopard

    豹纹


    Teenager

    青少年


    Latte

    拿铁


    现在随机从 A 栏选一个词，与 B 栏的一个词配对。例如：Fuzzy Rock Star、Pink Leopard 或 Sparkly Latte。


    这些组合听起来可能很傻，但可以用它们来激发时尚灵感！Fuzzy Rock Star 可能激发一套包括人造毛皮夹克和皮裤的造型。Pink Leopard 可能激发粉色动物纹，但粉色丝绸睡衣套装配小豹纹拖鞋怎么样？Sparkly
    Latte 似乎很适合做 T 恤图案，或者可能只是一条美丽的奶油金拿铁色亮片裙。用这些启动点来点燃你的设计引擎，然后大胆发挥！


    #### Collection I: Cupcake

    系列一：纸杯蛋糕


    这个以纸杯蛋糕为主题的系列采用明亮欢快的色彩和奇思妙想的点缀。修身的短裤配上雪葩燕尾条纹，与带有古怪细节的女性化衬衫形成对比（图 1）。一件印有纸杯蛋糕图案的图形
    T 恤配有小彼得潘领，显得端庄，并搭配彩虹糖屑印花的 midi 裙（图 2）。最后，一件明亮的渐变色薄纱连衣裙外搭波点西装外套（图 3）。这个迷你系列充满甜品店氛围，细节丰富有趣！


    ![Image](img/f0121-01.jpg)


    #### Collection II: Birds of a Feather

    系列二：同类相聚


    这个以鸟类为主题的系列优雅时尚。孔雀色出现在晚礼服上，左肩还有戏剧性的羽毛和褶饰（图 1）。第二个设计采用单色系。红色、酒红色和淡紫色营造出低调的精致感，裙摆和袖口有羽毛细节（图
    2）。最后的造型舒适休闲：一件超大号奶油色缆编毛衣在中性色调中于领口处饰有翅膀贴花（图 3）。这个系列就像窥探了一位上流社会鸟类爱好者的衣橱！


    ![Image](img/f0122-01.jpg)


    #### Collection III: Artiste

    系列三：艺术家


    一个以艺术家为主题的迷你系列很有趣可以想象。第一个设计暗示了艺术工作室风格。沾满油漆的牛仔裤和条纹船领 T 恤感觉非常休闲且富有创意（图 1）。第二个设计中，奇特的连袖
    T 恤配铅笔裙，外搭工作室围裙（图 2）。最后，亚麻灯笼裤配一件挺括的棉质衬衫式连衣裙，在第三套造型中显得毫不费力地时髦（图 3）。这个系列给人一种为某位精彩的画家或工匠打造的胶囊衣橱的感觉。


    ![Image](img/f0123-01.jpg)



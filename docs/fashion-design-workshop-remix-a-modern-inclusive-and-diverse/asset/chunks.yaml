    ### Avant Garde / Couture

    If this style appeals to you, you are likely a pusher of boundaries and a lover
    of experimentation and high-art. You like to challenge the mainstream and make
    people do a double-take.

    Your muse is a free-thinker and thought provocateur who doesn’t mind being on
    display.


    #### Drawing Style:

    - Spontaneous, loose lines

    - Unfinished curves

    - Abstract and slightly exaggerated

    - Bold colorful strokes


    #### Fashion Style:

    - Fashion over function

    - Highly unique and creative

    - Artsy vibe

    - Unusual forms and silhouettes


    ![Image](images/f0028-01.jpg)


    ### Editorial

    If this style appeals to you, you have a vivid imagination and love to tell a
    story with clothing and accessories. You have a great eye and are always on the
    lookout for pieces that have a past or are truly special. You are inspired by
    characters in movies and in life. You might be an aspiring costume designer!

    Your muse is Hollywood’s “It” girl—past or present—who can morph and change into
    any character; she always gets a stylized spread in a high-fashion magazine.


    #### Drawing Style:

    - Carefully rendered in draftsman pencil

    - Detailed and refined

    - Literal drawing style with shading and contour

    - Visible sketch lines


    #### Fashion Style:

    - Creative and theatrical

    - Inspired by a story or character

    - Dramatic and intentional

    - Fashion-forward

    - Thoughtfully edited and detail focused


    ![Image](images/f0029-01.jpg)


    ## Capturing Your Vision

    Now that you’ve learned some of the basics and have spent a bit of time practicing
    the mechanics of fashion illustration, you’re ready to get creative using a variety
    of art tools to bring your vision to life! Let the fun begin!


    ### Pencil & Pastel

    When you’re sketching on the go and paint is not an option, colored pencils and
    pastel pencils can give a rich, creamy jolt of color. These tools are perfect
    for creating the bold patterns and vibrant color combinations you might see in
    a Playful & Cute or Editorial design theme.


    ![Image](images/f0030-01.jpg)


    ### Marker

    Many fashion illustrators rely on art markers and water-based markers for their
    work. Markers are a versatile tool and can be used effectively for almost any
    fashion design illustration. Because of the wide range of available colors, markers
    are especially fun to use on Playful & Cute and Avante Garde designs. The sophisticated
    palette of color options makes it easy to layer in stripes, dots, squiggles, and
    saturated hues.


    ![Image](images/f0031-01.jpg)


    ### Dark Paper & Metallic Paint Pen or White Pencil

    Nothing beats metallic paint pens and dark papers for adding shine to your designs.


    ![Image](images/f0032-01.jpg)


    ### Ink

    Ink pens deliver clean, professional results with contrast and intensity. Try
    out different types to see what works best for your style! Ink tools are ideal
    for creating designs that are Chic & Minimal.


    ![Image](images/f0033-02.jpg)


    #### Inky Drama

    A high-contrast ink illustration with exaggerated proportions feels edgy and cool.
    Create bold designs using nothing but black ink on white paper for instant drama
    with a dash of high fashion. This technique is perfect for metropolitan styles
    and no-nonsense fashions, especially when silhouettes or drape-like designs are
    the main focus.


    ![Image](images/f0033-01.jpg)


    ### Brush Pen & Variable Line Weight

    Emphasizing line weights in fashion illustration makes drawings appear more interesting
    and professional. Line-weight drawings are perfect for Avant Garde/Couture design
    styles. Thinner line weights allow the eye to rest, while thicker line weights
    draw the eye to strong curves and angles, as well as to convey the weight of a
    figure or object. Balancing the variety of line thickness in the drawing will
    make even the simplest designs look more vibrant!


    ![Image](images/f0034-01.jpg)


    ### Mixed Media & Collage

    If drawing prints and patterns isn’t up your alley or you want to really mix things
    up, use collage papers to add a textural element to your fashion illustrations.
    Start by drawing your design and then using a light box to transfer it to your
    collage papers. You can also use a variety of mixed media to create truly unique
    fashions!


    ![Image](images/f0035-01.jpg)


    #### Add fun with found objects

    Fabrics, flowers, sequins, glitter, painted papers, and even food add interest
    and creativity to your fashions! Think pressed flowers added to a wedding gown
    or thin ribbons glued onto a fringy skirt. Real sequins and glitter added to a
    cocktail dress design sketched on black paper adds maximum sparkle. And patterned
    fabrics can be used to show patchwork and prints.


    ![Image](images/f0035-02.jpg)


    ### Watercolor

    Watercolor is undoubtedly one of the most versatile paint media available. It
    paints wet, but it dries fast. Watercolor layers easily. It is endlessly mixable
    and leaves beautiful “shimmering” effects, depending on how it is applied. It
    can add a quick pop of color to an ink drawing, or it can be used to create an
    entire illustration all on its own! Watercolor is ideal for designs that are Soft
    & Romantic.


    #### Tube Watercolor

    Tube paints are perfect for creating washes and for layering. They also tend to
    appear more transparent. Once the paint dries in a palette, it can be reactivated
    with a little water—so there is no waste! Use paintbrushes with tube paints.


    #### Dry Pan Watercolor

    Perfect for traveling or for painting on location. Activate dry paints with water
    using a waterbrush or paintbrush, and mix in the palette lid. Less water makes
    for a chalkier, more opaque application; more water increases the paint’s transparency.


    #### Techniques

    **Wet-onto-Dry.** Apply watercolor to dry paper for precise results; the effect
    is similar to using a marker.

    **Wet-into-Wet.** Applying watercolor to wet paper will allow the paint to flow
    into the wet space and create patterns and gradients, such as the colorful hair
    in the example shown on the opposite page.

    **Spatter.** Load a brush with water and paint; then flick over the pages to add
    sparkle, splash, and pizzazz. The effect creates a dynamic feel that can liven
    up your illustrations.

    **Pouncing.** Load a brush with paint, and then pounce it onto the page to create
    small puddles that dry in interesting ways. This is another unique way to create
    beautiful texture.

    **Layering.** Overlapping wet paint onto dry paint can create tonal overlays that
    add depth and richness; this works especially well for gathered skirts and gowns.

    **Splash & Spatter.** The combination of flowy watercolor with tightly drawn ink
    illustrations creates a perfect blend of hard and soft lines. Use line art to
    create your design; then add streaks, spatters, drips, and overlays of transparent
    watercolor.


    ![Image](images/f0036-01.jpg)![Image](images/f0037-01.jpg)



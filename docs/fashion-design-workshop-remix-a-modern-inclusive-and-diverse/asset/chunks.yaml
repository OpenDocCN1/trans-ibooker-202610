    Using templates is a great way to get started drawing! Scan or photocopy one or
    more of the templates shown [here](#ch06.xhtml#page_124). Place the template on
    the light box with your choice of paper over the top. Turn on the light box to
    illuminate the template beneath the clean sheet of paper. Trace the figure lightly
    onto your paper to transfer the template to the page.


    ![Image](images/f0010-01.jpg)


    You can create endless designs using one template! You can also adapt an existing
    template (Figure 1) to any body type. Create a larger figure by tracing along
    the template just outside the lines shown (Figure 2). For narrower shoulders or
    a slender body type, trace along the template just inside the lines (Figure 3).


    ![Image](images/f0010-02.jpg)


    **Figure 1**


    ![Image](images/f0010-03.jpg)


    **Figure 2**


    ![Image](images/f0010-04.jpg)


    **Figure 3**


    ### Gesture Drawing

    If you love a sketchy quality, gesture drawings are for you. Gesture drawing focuses
    on shape and volume. This method involves working quickly in pencil, without erasing,
    while glancing back and forth from the subject (or reference photo) to the drawing
    page. The only goal is to achieve good balance and proportion. Drawings made this
    way usually reflect the artist’s unique hand and style. There may be sharp lines
    and angles or sweeping curves and soft edges. Once you’re satisfied with your
    sketch, you’ll darken the final shapes to bring the drawing forward.


    ![Image](images/f0011-01.jpg)


    1

    To practice gesture drawing, select a few reference photos.


    ![Image](images/f0011-02.jpg)


    2

    Sketch quickly from your photos with a focus on shape, proportion, and balance.


    ![Image](images/f0011-03.jpg)


    3

    Darken the best lines, and then add some detail and shading.


    ![Image](images/f0011-04.jpg)


    To create a template from a gesture drawing, place the drawing on a light box
    and trace main figure lines onto a clean sheet of paper. Then sketch a new fashion
    onto your blank template!


    ### Architectural Figure Building

    Architectural figure building is a useful technique for achieving accurate proportions.
    (It is also the technique used in the step-by-step projects featured throughout
    the book.) Architectural figure building requires you to start a figure using
    simple lines and angles as key points of reference, as shown in the steps on the
    opposite page.


    ![Image](images/f0012-01.jpg)


    Each figure design starts with a basic stick-like shape, but there are other considerations
    to take into account.

    • Does a hand rest on a hip? Is an arm raised? If so, where does the elbow align
    with the head? In this methodical approach, visualizing and drawing these details
    realistically helps establish accurate proportions in the final illustration.

    • Focus on the horizontal lines that denote the shoulders, chest, waist, and hips.
    Notice if the midline (think of it like the spine) is vertical or slanted. Also
    recognize if the hipline is tilted. Often, models will stand with one hip popped
    out, which creates an angled tilt. A model walking the runway will also have a
    slanted hipline.

    • Indicate the joints with small dots or circles. This is a great tool for checking
    proportions. Elbows usually hit at the waist. Wrists are usually one-third of
    the way between the hips and knees.


    Once you train your eye to see the underlying architecture of a figure, you’ll
    be able to create a template for any body type and shape.


    ![Image](images/f0013-01.jpg)


    1

    Establish the internal framework of the figure. First sketch an oval for the head,
    and then add the “line of action,” or midline, to create the center of the torso.
    Next, add horizontal lines to begin establishing the figure. You should have lines
    that delineate the shoulder, chest, waist, and hips. As you sketch in these lines,
    you will establish the posture. Add lines for the arms and legs.


    ![Image](images/f0013-02.jpg)


    2

    Once the basic stick figure is in place, begin filling in the form and volume
    of the model in any size or shape desired.


    ![Image](images/f0013-03.jpg)


    3

    Begin creating the fashion you’d like to design. To make it more visually interesting,
    add a hairstyle and accessories, and suggest some facial features.


    ![Image](images/f0013-04.jpg)


    4

    Clean up your lines with a kneaded eraser and refine the details.


    ### Drawing on a Tablet

    Drawing digitally on a tablet is convenient and portable, making it easy to design
    anywhere! Files are easy to clean up and make print-ready, plus there are tools
    you can use to experiment with color and pattern.


    ![Image](images/f0014-01.jpg)


    1

    Sketch your figure on the tablet screen, or scan a template from the book and
    import it to your drawing program.


    ![Image](images/f0014-02.jpg)


    2

    Reduce the opacity of the figure sketch layer. Make a new layer on top of the
    figure sketch. Draw your fashion design just like you would if you were using
    a light box. When you complete your design, turn off the figure sketch layer to
    reveal your clean drawing.


    ![Image](images/f0014-03.jpg)


    3

    Keep your line art design layer on top and “Multiply” the layer. Next, add one
    or several layers underneath to color your clothing. You can use a variety of
    different brush textures to suit your taste. Choose from pencil, paint, ink, and
    more.


    ![Image](images/f0015-01.jpg)


    4

    Use color-editing tools to change the entire color story or to experiment with
    just one part. This allows for fine-tuning to get color palettes just right, while
    your line art layer stays perfectly intact!


    **Digital “Ink.”**

    Use a stylus to create a minimalist design using only gray or black. This effect
    has a modern feel to it.


    ![Image](images/f0015-02.jpg)


    ## Fashion for Everyone!

    Fashion is for everyone—and it’s definitely not a one-size-fits-all game! Today’s
    designers understand that fashion serves purposes outside of the utilitarian function
    of simply dressing people. Fashion supports creative expression, confidence, and
    individuality. Here are some tips to get you started designing fashions for a
    wide range of people of all shapes and sizes!


    ![Image](images/f0016-01.jpg)


    1

    **Design for everybody and every *body*!** Practice drawing all sorts of figure
    proportions like the ones shown above. Find inspiration from fashion and lifestyle
    magazines, social media, and on television. Red Carpet wrap-ups are especially
    great since they show full-length poses of celebrities of all shapes and sizes.


    ![Image](images/f0016-02.jpg)


    2

    **Select a favorite outfit from your closet or a magazine.** Adapt the design
    to fit a variety of body types. Don’t forget to add accessories!


    ![Image](images/f0017-01.jpg)


    3

    **Design an original fashion.** Then tweak and alter your design to fit a variety
    of body types. Add details that will flatter the body you are designing for, as
    shown in the example at right.


    ![Image](images/f0017-02.jpg)


    ## Adaptive Apparel

    Fashion can and should be customized to meet the needs of people with disabilities.
    A growing number of high-end fashion brands are rolling out lines that take these
    clients’ needs into account by positioning seams, zippers, buttons, and the like
    in areas that are easy to manage. Other considerations include using breathable
    fabrics, incorporating Velcro, magnetic closures, and other easy-to-use fasteners
    into designs, and designing pockets, tags, and other details for comfort. Design
    fashions that complement all body types and also accommodate mobility devices.


    ![Image](images/f0018-01.jpg)


    ## Making Faces

    '
  trans: '

    使用模板是开始绘画的绝佳方式！扫描或复印此处所示的一个或多个模板。将模板放在灯箱上，上面覆盖你选择的纸张。打开灯箱，使模板在干净的纸张下方被照亮。轻轻描摹人形到纸上，将模板转移到页面上。


    ![Image](img/f0010-01.jpg)


    使用一个模板即可创作出无限的设计！你还可以将现有的模板（图 1）适配到任何体型。通过沿着模板在所示线条外描摹来创建更大的身形（图 2）。对于较窄的肩膀或纤细的体型，沿着模板在内侧线条内描摹（图
    3）。


    ![Image](img/f0010-02.jpg)


    **图 1**


    ![Image](img/f0010-03.jpg)


    **图 2**


    ![Image](img/f0010-04.jpg)


    **图 3**


    ### 姿势绘画

    如果你喜欢草图的质感，姿势绘画适合你。姿势绘画注重形状和体积。这种方法要求在铅笔上快速作画，不擦除，同时在主体（或参考照片）和绘画页面之间来回瞥视。唯一的目的是达到良好的平衡和比例。这样制作的绘画通常反映出艺术家独特的笔触和风格。可能有尖锐的线条和角度，也可能有流畅的曲线和柔和的边缘。一旦你对草图满意，就加深最终的形状，使绘画更突出。


    ![Image](img/f0011-01.jpg)


    1

    练习姿势绘画时，选择几张参考照片。


    ![Image](img/f0011-02.jpg)


    2

    从照片中快速素描，重点关注形状、比例和平衡。


    ![Image](img/f0011-03.jpg)


    3

    加深最好的线条，然后添加一些细节和阴影。


    ![Image](img/f0011-04.jpg)


    要从姿势绘画中创建模板，将绘画放在灯箱上并在干净的纸上描摹主要的人形线条。然后在空白模板上勾勒新的时装！


    ### 建筑式人形构建

    建筑式人形构建是实现准确比例的有用技巧。（它也是本书中逐步项目中使用的技巧。）建筑式人形构建要求你使用简单的线条和角度作为关键参考点开始绘制人形，如对面页面的步骤所示。


    ![Image](img/f0012-01.jpg)


    每个身形设计都始于一个基本的类似棍子的形状，但还有其他需要考虑的因素。

    • 手是否靠在臀部？手臂是否抬起？如果是，肘部与头部对齐的位置在哪里？在这种有条理的方法中，真实地视觉化和绘制这些细节有助于在最终插图中建立准确的比例。

    • 关注表示肩膀、胸部、腰部和臀部的水平线。注意中线（想象成脊柱）是垂直还是倾斜的。还要注意臀线是否倾斜。通常，模特会站立时一侧臀部突出，这会产生角度倾斜。走秀的模特也会有倾斜的臀线。

    • 用小点或圆圈标示关节。这是在检查比例方面的一个很好的工具。肘部通常在腰部位置。手腕通常位于臀部和膝盖之间三分之一处。


    一旦你训练眼睛看到人形的底层结构，你就能为任何体型和形状创建模板。


    ![Image](img/f0013-01.jpg)


    1

    建立人形的内部框架。首先为头部勾勒一个椭圆，然后添加“动作线”，或中线，以创建躯干的中心。接下来，添加水平线以开始建立人形。你应该有界定肩部、胸部、腰部和臀部的线条。随着你勾勒这些线条，你将确定姿势。添加手臂和腿部的线条。


    ![Image](img/f0013-02.jpg)


    2

    一旦基本的人形轮廓就位，就开始填充模型在任何所需大小或形状上的形态和体积。


    ![Image](img/f0013-03.jpg)


    3

    开始创建你想要设计的时装。为了使其更具视觉趣味，添加发型和配饰，并勾勒一些面部特征。


    ![Image](img/f0013-04.jpg)


    4

    用可塑橡皮清理线条并细化细节。


    ### 在平板上绘画

    在平板上数字绘画方便且便携，使你在任何地方都能轻松设计！文件易于清理并制作成可打印格式，而且还有工具可供你尝试颜色和图案。


    ![Image](img/f0014-01.jpg)


    1

    在平板屏幕上勾勒你的身形，或从书中扫描模板并导入到你的绘图程序中。


    ![Image](img/f0014-02.jpg)


    2

    降低人形草图层的透明度。在人形草图层上方新建一个图层。像使用灯箱一样绘制你的时装设计。当你完成设计后，关闭人形草图层以显示干净的绘画。


    ![Image](img/f0014-03.jpg)


    3

    保持你的线稿设计图层在最上层并“正片叠底”该图层。接下来，在下方添加一个或多个图层来为服装上色。你可以使用各种不同的画笔纹理来满足你的喜好。可选择铅笔、油画、墨水等。


    ![Image](img/f0015-01.jpg)


    4

    使用颜色编辑工具更改整个色彩故事或仅尝试其中一部分。这允许微调以使配色方案恰到好处，同时你的线稿图层保持完美完整！


    **数字“墨水。”**

    使用触控笔仅用灰色或黑色创建极简设计。这种效果具有现代感。


    ![Image](img/f0015-02.jpg)


    ## 时装人人皆宜！

    时装适合每个人——而且绝对不是“一刀切”的游戏！今天的设计师明白，时装的功能超出了仅仅为人们穿衣的实用功能。时装支持创造性表达、自信和个性。以下是一些帮助你开始为各种体型和大小的人设计时装的技巧！


    ![Image](img/f0016-01.jpg)


    1

    **为每个人和每个*身体*设计！** 练习绘制各种如上图所示的身形比例。从时尚和生活方式杂志、社交媒体以及电视上寻找灵感。红毯回顾尤其很棒，因为它们展示了各种体型和大小的名人全身姿势。


    ![Image](img/f0016-02.jpg)


    2

    **从你的衣柜或杂志中挑选一件最喜欢的服装。** 将设计适配到各种体型。别忘了添加配饰！


    ![Image](img/f0017-01.jpg)


    3

    **设计一件原创时装。** 然后调整和改变你的设计以适应各种体型。添加能衬托你正在设计的身体的细节，如右侧示例所示。


    ![Image](img/f0017-02.jpg)


    ## 适应性服装

    时装可以而且应该根据残疾人士的需求进行定制。越来越多的高端时装品牌推出系列，考虑到这些客户的需求，将接缝、拉链、纽扣等放置在易于管理的区域。其他考虑因素包括使用透气面料，在设计中加入魔术贴、磁性闭合件和其他易于使用的紧固件，以及为舒适度设计口袋、标签和其他细节。设计时装以衬托所有体型，同时也能适应行动辅助设备。


    ![Image](img/f0018-01.jpg)


    ## 绘制面部


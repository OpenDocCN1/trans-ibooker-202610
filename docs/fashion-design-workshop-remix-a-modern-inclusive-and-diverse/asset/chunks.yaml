    # Chapter 6


    ## Design a Line


    ![Image](images/f0118-01.jpg)


    ### Mini Collections


    Another great way to challenge your design skills is to create three-piece mini
    collections based on a single word. Building collections forces you to think about
    different pieces of apparel and ways of dressing. Design loungewear, evening wear,
    separates, dresses, sportswear, and more. Use one theme word to keep everything
    consistent.


    ![Image](images/f0120-01.jpg)


    #### Idea Factory: Mix & Match


    Need a jump-start to get your creative juices flowing? Try these fun exercises
    for some instant inspiration!


    On a piece of paper, fill column A with adjectives, such as colors, textures,
    feelings, etc. Fill column B with nouns, including people, places, and things.


    **Column A Examples**


    Pink


    Fuzzy


    Happy


    Sparkly


    Somber


    **Column B Examples**


    Rock Star


    Beach


    Leopard


    Teenager


    Latte


    Now randomly choose one word from column A and match it with one word from column
    B. Examples: Fuzzy Rock Star, Pink Leopard, or Sparkly Latte.


    These may sound like silly combinations but use them to inspire some fashion!
    Fuzzy Rock Star might inspire an outfit that includes a faux fur jacket with leather
    pants. Pink Leopard could inspire a pink animal print, but what about a pink silk
    pajama set with little leopard slippers? Sparkly Latte seems like a great T-shirt
    graphic, or maybe it’s just a sequined skirt in a beautiful creamy golden latte
    color. Use these kick-starts to rev your design engine, and then run with it!


    #### Collection I: Cupcake


    This cupcake-themed collection features bright, cheerful colors and whimsical
    touches. Slim, cropped pants with a sherbet tuxedo stripe contrast with a feminine
    blouse with quirky details (Figure 1). A graphic tee featuring a cupcake has a
    little Peter Pan collar for a prim feel and is paired with a rainbow sprinkle-print
    midi skirt (Figure 2). Finally, a bright ombré tulle dress is topped with a polka
    dot blazer (Figure 3). This mini collection has a sweets shop vibe full of fun
    details!


    ![Image](images/f0121-01.jpg)


    #### Collection II: Birds of a Feather


    This bird-themed collection is sophisticated and stylish. Peacock colors feature
    in the evening gown along with dramatic feathers and draping on the left shoulder
    (Figure 1). The second design uses a monochromatic color family. Red, burgundy,
    and mauve create subtle sophistication with feather detailing on the skirt hem
    and armholes (Figure 2). The last look is cozy and casual: An oversized cream
    cable-knit sweater has a winged appliqué across the neckline in a neutral color
    palette (Figure 3). This collection is like a peek into the closet of a high-society
    bird lover!


    ![Image](images/f0122-01.jpg)


    #### Collection III: Artiste


    A mini collection with an Artiste theme is a fun one to imagine. The first design
    suggests an art studio look. Paint-spattered jeans and a striped boatneck tee
    feel perfectly casual and creative (Figure 1). A quirky raglan tee and pencil
    skirt combination is topped with a workroom apron in the second design (Figure
    2). Finally, linen balloon pants and a crisp cotton button-down tunic feel effortlessly
    cool in the third fashion (Figure 3). This collection gives the feel of a capsule
    wardrobe for some fabulous painter or artisan.


    ![Image](images/f0123-01.jpg)



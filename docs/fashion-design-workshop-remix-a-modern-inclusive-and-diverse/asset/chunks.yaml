    In this book, aspiring fashion designers, trendsetters, and style gurus are invited
    to explore a wide variety of tools and materials that can be used to illustrate
    and design a range of fashions—from fancy dresses and red carpet-worthy looks
    to sportswear and chic urban outfits. Using graphite pencils, pens, and markers,
    as well as watercolor paint, metallic paint pens, and even collage, fashionistas
    of all backgrounds will embrace the creativity that comes with trying different
    types of mixed media to create fashions that run the range from classic and conventional
    to wild and whimsical. Try all of the suggested tools to learn what works best
    for you and your personal style—be it traditional drawing methods or digital illustration
    tools.


    In [Chapter 1](#ch01.xhtml#ch01), you’ll learn everything you need to get started,
    including how to work with the various featured art tools, as well as basic drawing
    and sketching techniques. [Chapter 2](#ch02.xhtml#ch02) includes a comprehensive
    quiz for uncovering your personal style and then goes into greater detail for
    using myriad art techniques to suit every style and design theme.


    In [Chapters 3](#ch03.xhtml#ch03), [4](#ch04.xhtml#ch04), and [5](#ch05.xhtml#ch05),
    you’ll begin putting your knowledge into practice by following step-by-step projects
    that demonstrate how to create a range of designs inspired by pop culture and
    contemporary fashion. In [Chapter 6](#ch06.xhtml#ch06), you’ll learn how to create
    your own uniquely themed fashion line, while the last four pages of the book include
    templates in varying shapes and sizes, which you can scan or photocopy to use
    over and over again.


    Whether you are an experienced fashionista or just starting out for the first
    time, you’re sure to find creative design ideas, inspiration, and a plethora of
    art tips and techniques for taking your fashion illustration game to the next
    level!


    ![Image](images/f0004-01.jpg)


    [*OceanofPDF.com*](https://oceanofpdf.com)


    # Chapter 1


    ## Getting Started


    ### Tools & Materials


    **Sketchpad or Loose Drawing Paper.** Keep a variety of sketchpads or notebooks
    on hand in various sizes. Jot quick sketches on smaller pages; then work out your
    ideas on larger sheets. Be sure to use heavier papers with any wet media, such
    as marker or watercolor, to prevent warping.


    ![Image](images/f0006-01.jpg)![Image](images/f0006-02.jpg)


    **Kneaded Eraser.** These pliable erasers can be shaped to a point for precision.
    They never wear down, and they don’t leave eraser dust behind. They are also very
    gentle on paper.


    ![Image](images/f0006-04.jpg)


    **Graphite Pencils.** Any pencil will do, but you may prefer a mechanical pencil
    because the leads stay sharp and produce a consistent line thickness.


    **Colored Pencils.** Colored pencils are a convenient and easy method to add color.
    Professional-grade colored pencils have a waxy, soft lead that is excellent for
    shading and building up layers of color. Watercolor pencils are another excellent
    choice for adding touches of color to your artwork.


    **Pastel Pencils.** Pastel pencils are exactly what they sound like: traditional
    soft pastels encased in a wooden barrel. They draw like pencils and can be sharpened
    using a regular pencil sharpener. They have a slightly chalkier texture than traditional
    colored pencils and can be used to layer and blend colors.


    **Markers.** Transparent water-based markers are available in a wide variety of
    styles. They are great for laying down large areas of vibrant color, and they
    also allow for layering and blending, which comes in handy for rendering sheer
    fabrics.


    ![Image](images/f0006-05.jpg)


    **Pigment Ink Pens.** These permanent ink pens won’t bleed, and they come in lots
    of different nib sizes. The thinnest nibs are perfect for rendering tiny details;
    thicker nibs and brush tips are great for bold or variable line weights.


    ![Image](images/f0007-01.jpg)


    **Light Box.** Use a light box to transfer rough drawings onto clean paper for
    a beautiful finished drawing with no stray marks. (See “Light Box & Templates”
    shwon [here](#ch01.xhtml#page_10).)


    ![Image](images/f0007-02.jpg)


    **Watercolor Paper.** Cold-pressed watercolor paper offers a rough surface that
    takes watercolor paint beautifully. Its thick stock prevents the paper from buckling.


    ![Image](images/f0007-03.jpg)


    **Dark-colored Pastel Paper.** Dark papers are perfect for creating dramatic evening
    fashions. Bridal gowns, lace, and organza fabrics rendered in white pencil show
    up beautifully on mid-tone and darker papers.


    ![Image](images/f0007-04.jpg)


    **Blue Draftsman Pencil.** Blue pencil (or any light or mid-value colored pencil)
    is a great tool for starting off a sketch. Once the basics are scribbled out in
    blue, switch over to a black pencil to refine the drawing.


    ![Image](images/f0007-05.jpg)


    **Watercolor Paint.** Watercolor is an excellent option for coloring your designs.
    Use watercolor to build up vibrancy, create textures and blooming effects, and
    mix shades.


    ![Image](images/f0008-01.jpg)


    **Watercolor Paintbrushes.** Watercolor brushes are specifically made to hold
    water-based pigments. They come in a variety of sizes for broad washes and small
    details.


    ![Image](images/f0008-02.jpg)


    **Waterbrush & Brush Pens.** The ultimate tool for fuss-free versatility is the
    waterbrush. The handle is a reservoir. Fill it with water and then gently squeeze
    the handle to add moisture to your paint or ink. Dip the nib in the color; then
    apply to the paper using strokes of variable widths. Brush pens come in myriad
    colors. The brush-like tips lay down smooth lines perfect for graphic designs.


    ![Image](images/f0008-03.jpg)


    **Masking Fluid.** This rubbery liquid can be painted onto watercolor paper as
    a resist that prevents watercolor paint from absorbing into the treated areas.
    It’s great for creating patterns and details. Simply paint the masking fluid on
    the desired area of the paper and then apply watercolor as you normally would.
    Once the entire area is dry, gently rub off the masking fluid to reveal the paper
    beneath untouched by the paint.


    ![Image](images/f0008-04.jpg)


    **Washi Tape.** Use bits of patterned washi tape for metallic accents, dotted
    bags, hair scarves, patchwork, or other creative designs. It comes in a variety
    of patterns and finishes, and its adhesive back makes applying it a breeze.


    ![Image](images/f0008-05.jpg)


    **Metallic Paint Pens.** Add gold, copper, or silver sparkle to any design with
    this easy-to-use tool. Nothing captures the gleam quite as well, plus metallic
    paint pens can be applied over nearly any other media.


    ![Image](images/f0009-01.jpg)


    **Gel Pens.** Opaque details are easy to add to any illustration with gel pens.
    White opaque gel pens are perfect for adding highlights, as well as shiny surfaces
    and glittery speckles.


    ![Image](images/f0009-02.jpg)


    **White Pencil.** White pencil marks create a beautiful effect on darker papers.
    Use them for bridal designs, veils, lace, or any other delicate designs.


    ![Image](images/f0009-03.jpg)


    **Collage Papers.** Scrapbook paper or hand-painted scraps are fun for adding
    bits of pattern to skirts, dresses, hats, and more.


    ![Image](images/f0009-04.jpg)


    **3-D Materials.** Flowers, ribbons, feathers—even food—can add a bit of quirky
    fun to your designs. Make sure to photograph your illustrations so you’ll have
    your ideas saved for future use!


    ![Image](images/f0009-05.jpg)


    ### Basic Figure Drawing


    Before you can design the clothes, you’ve got to draw the models. This can be
    the biggest obstacle for many aspiring designers. Drawing people seems hard at
    first, but don’t worry! There are a few different ways to draw figures.


    #### Light Box & Templates


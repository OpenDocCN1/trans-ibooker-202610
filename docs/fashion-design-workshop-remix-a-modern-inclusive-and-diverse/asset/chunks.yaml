  trans: '

    在时装设计中绘制人形时，重点通常放在服装上，因此绘制简单的面部和发型是很常见的。例如，画一只眼睛和一张嘴就足以表现表情，而不必担心比例是否准确。这并不意味着如果你喜欢就不能更详细。相信你的直觉，以适合你设计的方式绘制模特。同样，发型的处理可以简约也可以大胆。思考你设计的个性，并使发型和面部表情与之相匹配。


    ![图像](img/f0019-01.jpg)


    ## 保持一本速写本


    灵感可能随时降临，而可靠的速写本是最适合记录你精彩灵感的场所！记下可反穿夹克的想法，或为鞋子画一张示意图。也许街头艺术中的色彩会激发你创作一件古怪的印花 T
    恤或一件舞会礼服。或者你可能想创建一个纹理库。随身携带速写本意味着当灵感来临时你能够捕捉到它！


    ### 随意的速写

    谁不想一窥时尚设计偶像的速写本呢？这些涂鸦般的点子和潦草的构思正是梦想的素材！用零碎的想法、灵光一现的瞬间和大量的铅笔速写填满一本笔记本！在灵感来临时迅速工作，魔力就发生在这里，而你的笔记本在创造力不那么充沛的日子里充当着创意工厂。如果心情合适，就用颜料添加色彩！


    ![图像](img/f0020-01.jpg)![图像](img/f0020-02.jpg)


    ## 平铺时尚


    偶尔，你可能会发现自己想跳过绘制人形，直接进入设计部分。创作手绘平铺时尚——将所有衣橱必备单品策划成一套完整造型——是激发创意的好方法。“平铺”一词指的是为一套完整的服装做造型——有点像你把衣物和配饰铺在床上搭配出造型那样。


    要画一个平铺设计，先勾勒一件核心服饰——例如一件印花连衣裙——然后围绕它构建整套造型。你可以添加凉鞋或人字拖、太阳镜、草帽和夏日托特包，打造完美的海滩一日造型。你的速写本非常适合创作平铺设计。


    ![图像](img/f0021-01.jpg)


    [*OceanofPDF.com*](https://oceanofpdf.com)


    # 第 2 章


    ## 表达自我


    ![图像](img/f0022-01.jpg)


    ### 发掘你的风格


    下面的测验旨在帮助揭示你在时尚方面关注的是什么。利用你的发现作为路线图，直接通往你个人风格的领域。遵循它来创造出精彩的东西——或者抛弃它，创造出完全超出你舒适区的东西！


    #### 第一部分：问答


    阅读下面的问题并在单独的纸张或笔记本上写下你的答案；然后思考你的回答如何帮助塑造你作为设计师的美学。请记住，没有“正确”或“错误”的答案！


    1\. 你衣橱里出现最多的颜色是什么？


    2\. 你不喜欢什么颜色？


    3\. 你衣橱里出现最多的图案是什么（例如，条纹、波点、波斯纹等）？


    4\. 你不喜欢什么图案？


    5\. 你最喜欢哪位名人/设计师的风格？


    6\. 你最常绘制哪种类型的时尚？（例如，休闲、正装、婚纱、配饰等）？


    7\. 如果你能/可以自己做衣服，你最想做哪些单品？


    8\. 你想象你的时尚会被穿在哪儿：大城市、小镇还是 T 台上？


    9\. 你更喜欢连衣裙和裙子还是牛仔裤和卡其裤？


    10\. 你更喜欢柔软飘逸还是结构化剪裁的衣服？


    11\. 你喜欢通过时尚表达自我吗？


    12\. 在服装方面，你最看重的是什么：a) 舒适 b) 风格 c) 良好合身 d) 实用性


    13\. 你喜欢：a) 引领潮流 b) 跟上潮流 c) 做自己的事


    14\. 你最喜欢什么风格或类型的服装？


    15\. 你喜欢搭配统一，还是更喜欢混搭颜色和图案？


    16\. 当你看到有人穿着独特的服装时，你的第一反应是：a) “那很酷！” b) “那很奇怪！”


    17\. 如果你一生只能穿一件衬衫，你会选择什么类型的衬衫？


    18\. 你喜欢印花或有态度的 T 恤吗？


    19\. 哪个词最能描述你对自己的看法？


    a) tough b) sweet c) rebellious d) cute e) sophisticated


    20\. 你想设计符合你个人时尚风格的衣服，还是完全不同的风格？


    21\. 每间衣橱都应该有什么服装单品？



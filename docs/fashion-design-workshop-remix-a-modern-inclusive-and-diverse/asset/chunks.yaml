    # Chapter 3


    ## Iconic Designs: Step-by-Step Projects


    ![Image](images/f0038-01.jpg)


    ### Inspiration from Pop Culture

    By now, you have probably learned more about your personal design style, discovered
    what types of fashion inspire you, and learned how to use a variety of tools to
    create special effects in your illustrations. You’re well on your way to becoming
    a forward-thinking designer! For even more inspiration and ideas, it’s helpful
    to look to iconic figures from pop culture—both past and present—to see how their
    styles might further influence your own work. After all, it’s not uncommon for
    professional fashion designers to create complete outfits with certain celebrity
    muses in mind!


    #### Trailblazing Artist


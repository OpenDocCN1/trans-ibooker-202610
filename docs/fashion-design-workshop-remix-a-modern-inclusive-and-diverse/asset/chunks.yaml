    Refine the art adding the waist tie, sweater ribbing, leggings stripe, headbands,
    and yoga socks. Remember that style is in the details, so be thoughtful as you
    add both beautiful and practical touches.


    ![Image](images/f0065-01.jpg)


    This is a more tight and traditional drawing using pencil to sketch, followed
    by watercolor and colored pencil to finish. It is clean and clearly shows the
    details.


    ![Image](images/f0066-01.jpg)


    1

    Sketch a basic stick figure in the desired pose.


    ![Image](images/f0067-01.jpg)


    2

    Continue to fill in the form as before.


    ![Image](images/f0067-02.jpg)


    3

    Add the basic garment shapes to your figure. Imagine the person wearing these
    clothes. What hairstyle would they have? Work out those details in this step.


    ![Image](images/f0068-01.jpg)


    4

    Clean up your sketch!


    ![Image](images/f0068-02.jpg)


    5

    Add details that will set your garments apart. As a designer, your job is to impart
    your unique point of view on each item you create. Be sure that your designs reflect
    who you are—that is what will make them stand out.


    ![Image](images/f0069-01.jpg)


    For this final illustration, the clean sketch was placed on a light box with watercolor
    paper on top. Watercolor was applied in puddles followed by colored pencil to
    create the pattern on the shorts. Thin outlines in black ink polish the look.


    ## Casual Vibe


    ![Image](images/f0070-01.jpg)


    1

    Start with a casual pose. Draw an oval for the head, shoulder lines, and stick
    limbs that show a loose posture.


    ![Image](images/f0070-02.jpg)


    2

    Fill in the form with the body type to suit your design.


    ![Image](images/f0071-01.jpg)


    3

    Begin the outlines of clothing. A casual T-shirt layered with a short-sleeve button-down,
    rolled skinny jeans, and slip-ons are on fleek. A few faint pencil strokes suggest
    a bit of facial hair.


    ![Image](images/f0072-01.jpg)


    4

    Erase unneeded pencil lines to clean up the sketch.


    ![Image](images/f0072-02.jpg)


    5

    Have some fun adding details and accessories. This hipster sports a backpack,
    sunglasses, a chunky watch, checkerboard sneakers, and some body art. A few corded
    bracelets, and this guy puts the “hip” in hipster.


    ![Image](images/f0073-01.jpg)


    The final illustration has a casual, artsy flair that mirrors the urban vibe of
    this particular design. Let your imagination run free and call upon your own muses
    to influence other ideas not reflected here.


    ## Surf & Sand


    ![Image](images/f0074-01.jpg)


    1

    This surfer begs to be in motion with hair blowing in the wind. Start with a stick
    figure in the desired pose.


    ![Image](images/f0074-02.jpg)


    2

    Add weight to the figure. This pose has the face in profile, so suggesting the
    chin is helpful for establishing proportion. Sketch quick messy waves of hair
    and a horizontal line to indicate eye placement.


    ![Image](images/f0075-01.jpg)


    3

    Continue to build out the form, indicating the fashion of your choice. Bikini
    bottoms and a cropped rash guard make a classic combination.


    ![Image](images/f0076-01.jpg)


    4

    Erase unnecessary sketch lines and marks.


    ![Image](images/f0076-02.jpg)


    5

    Now make it your own! Add a bold graphic to the front of the top and a stripe
    down the sleeve. A loose beachy braid, ankle bracelets, and patterned surfboard
    bring the look together.


    ![Image](images/f0077-01.jpg)


    Use loose watercolor washes and strokes to add color to this fun and fresh design.


    ## After Hours


    ![Image](images/f0078-01.jpg)


    1

    Model poses that fit the tone and theme of the fashion you are designing are important.
    This nightclub outfit is symmetrical and will look striking on a model facing
    forward with squared shoulders.


    ![Image](images/f0078-02.jpg)


    2

    Fill out the form and add a few pencil strokes that indicate a hairstyle that
    matches the outfit.


    ![Image](images/f0079-01.jpg)


    Draw the structural outlines of the outfit. The top includes a sheer overlay with
    billowy sleeves. The skirt features a crisscross at the hemline. Add high-heeled
    strappy sandals for a fun, trendy look.


    ![Image](images/f0080-01.jpg)


    4

    Clean up your illustration by erasing any old sketch lines. Suggest a bold lip
    color for this nighttime look.


    ![Image](images/f0080-02.jpg)


    5

    Add a few final details. Remember that simple shapes often speak for themselves
    and don’t need too many fussy extras. In this case, a shirred hip on the skirt,
    chunky earring and bag, plus ankle straps on the shoes are all that is needed.


    ![Image](images/f0081-01.jpg)


    While this outfit could work in loads of different colors, black adds a striking,
    high-contrast appeal that matches the sheer style. A dramatic black outfit is
    also perfect for adding splashes of color elsewhere. This model shows off colorful
    ombré hair and matching clutch, earrings, and shoes in gold. It’s definitely an
    attention-grabbing look meant for a night of dancing and having fun!


    ## Rock-n-Roll


    ![Image](images/f0082-01.jpg)


    1

    Start with a stick figure, experimenting with poses that match this design. If
    you like, work from a reference photo that shows a strong pose for this look.


    ![Image](images/f0082-02.jpg)


    2

    Fill in the form, and a simple eye, lip, and scribble of hair.


    ![Image](images/f0083-01.jpg)


    3

    Draw the clothing using simple lines, indicating shape, volume, hemlines, and
    layering. A choker necklace is a huge part of this fashion statement, so include
    it in this step—or add any other accessories that you’d like.


    ![Image](images/f0084-01.jpg)


    4

    Erase any stray lines and structural lines.


    ![Image](images/f0084-02.jpg)


    5

    Now add the rocking details to show your style! Add rips to the jeans, studded
    straps to the shoes, fishnet socks, and a graphic tank top.


    ![Image](images/f0085-01.jpg)


    Use markers or your other favorite tools to add bold, graphic color. Purple hair,
    a black blazer, and plum-hued jeans hit the mark.


    ## On the Slopes


    ![Image](images/f0086-01.jpg)


    1

    Begin with a stick figure that establishes a pose with good proportion and balance.


    ![Image](images/f0086-02.jpg)


    2

    Build out the form, and then add a vertical centerline and horizontal eyeline
    to the head.


    ![Image](images/f0087-01.jpg)


    3

    Time to design the ski suit! This illustration shows the silhouette of a retro-inspired
    two-piece ensemble with faux fur-trimmed boots and a pom-pom knitted cap. Don’t
    forget the goggles or fashionable sunglasses, which are a big part of the finished
    look.


    ![Image](images/f0088-01.jpg)


    4

    Erase any unnecessary pencil lines. Check your work and refine shapes and proportions
    until you have a clean drawing.


    ![Image](images/f0088-02.jpg)


    5

    This ski attire includes a puffer-style cropped jacket with circa 1970s-inspired
    stripes and coordinating ski pants. Add matching mittens, ribbed trim at the waist,
    a zipper on the fleece, and some skis to make it legit.


    ![Image](images/f0089-01.jpg)


    Shading can play a big part in conveying your design on paper. Without the shading
    on each seamline, this puffer jacket would just look like it had stripes. Notice
    how the highlighted areas come forward and the dark areas recede. Instant puff!
    The ribbed knit cap and waistband also benefit from the use of dark shading against
    lighter color. Lastly, notice how the jacket is casting a shadow on the pants
    and fleece. Take advantage of this easy technique to make your designs appear
    more realistic.



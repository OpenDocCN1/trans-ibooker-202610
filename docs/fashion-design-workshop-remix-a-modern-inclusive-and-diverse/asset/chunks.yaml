- raw: "    Using templates is a great way to get started drawing! Scan or photocopy\
    \ one or more of the templates shown [here](#ch06.xhtml#page_124). Place the template\
    \ on the light box with your choice of paper over the top. Turn on the light box\
    \ to illuminate the template beneath the clean sheet of paper. Trace the figure\
    \ lightly onto your paper to transfer the template to the page.\n\n    ![Image](images/f0010-01.jpg)\n\
    \n    You can create endless designs using one template! You can also adapt an\
    \ existing template (Figure 1) to any body type. Create a larger figure by tracing\
    \ along the template just outside the lines shown (Figure 2). For narrower shoulders\
    \ or a slender body type, trace along the template just inside the lines (Figure\
    \ 3).\n\n    ![Image](images/f0010-02.jpg)\n\n    **Figure 1**\n\n    ![Image](images/f0010-03.jpg)\n\
    \n    **Figure 2**\n\n    ![Image](images/f0010-04.jpg)\n\n    **Figure 3**\n\n\
    \    #### Gesture Drawing\n\n    If you love a sketchy quality, gesture drawings\
    \ are for you. Gesture drawing focuses on shape and volume. This method involves\
    \ working quickly in pencil, without erasing, while glancing back and forth from\
    \ the subject (or reference photo) to the drawing page. The only goal is to achieve\
    \ good balance and proportion. Drawings made this way usually reflect the artist’s\
    \ unique hand and style. There may be sharp lines and angles or sweeping curves\
    \ and soft edges. Once you’re satisfied with your sketch, you’ll darken the final\
    \ shapes to bring the drawing forward.\n\n    ![Image](images/f0011-01.jpg)\n\n\
    \    1\n\n    To practice gesture drawing, select a few reference photos.\n\n\
    \    ![Image](images/f0011-02.jpg)\n\n    2\n\n    Sketch quickly from your photos\
    \ with a focus on shape, proportion, and balance.\n\n    ![Image](images/f0011-03.jpg)\n\
    \n    3\n\n    Darken the best lines, and then add some detail and shading.\n\n\
    \    ![Image](images/f0011-04.jpg)\n\n    To create a template from a gesture\
    \ drawing, place the drawing on a light box and trace main figure lines onto a\
    \ clean sheet of paper. Then sketch a new fashion onto your blank template!\n\n\
    \    #### Architectural Figure Building\n\n    Architectural figure building is\
    \ a useful technique for achieving accurate proportions. (It is also the technique\
    \ used in the step-by-step projects featured throughout the book.) Architectural\
    \ figure building requires you to start a figure using simple lines and angles\
    \ as key points of reference, as shown in the steps on the opposite page.\n\n\
    \    ![Image](images/f0012-01.jpg)\n\n    Each figure design starts with a basic\
    \ stick-like shape, but there are other considerations to take into account.\n\
    \n    • Does a hand rest on a hip? Is an arm raised? If so, where does the elbow\
    \ align with the head? In this methodical approach, visualizing and drawing these\
    \ details realistically helps establish accurate proportions in the final illustration.\n\
    \n    • Focus on the horizontal lines that denote the shoulders, chest, waist,\
    \ and hips. Notice if the midline (think of it like the spine) is vertical or\
    \ slanted. Also recognize if the hipline is tilted. Often, models will stand with\
    \ one hip popped out, which creates an angled tilt. A model walking the runway\
    \ will also have a slanted hipline.\n\n    • Indicate the joints with small dots\
    \ or circles. This is a great tool for checking proportions. Elbows usually hit\
    \ at the waist. Wrists are usually one-third of the way between the hips and knees.\n\
    \n    Once you train your eye to see the underlying architecture of a figure,\
    \ you’ll be able to create a template for any body type and shape.\n\n    ![Image](images/f0013-01.jpg)\n\
    \n    1\n\n    Establish the internal framework of the figure. First sketch an\
    \ oval for the head, and then add the “line of action,” or midline, to create\
    \ the center of the torso. Next, add horizontal lines to begin establishing the\
    \ figure. You should have lines that delineate the shoulder, chest, waist, and\
    \ hips. As you sketch in these lines, you will establish the posture. Add lines\
    \ for the arms and legs.\n\n    ![Image](images/f0013-02.jpg)\n\n    2\n\n   \
    \ Once the basic stick figure is in place, begin filling in the form and volume\
    \ of the model in any size or shape desired.\n\n    ![Image](images/f0013-03.jpg)\n\
    \n    3\n\n    Begin creating the fashion you’d like to design. To make it more\
    \ visually interesting, add a hairstyle and accessories, and suggest some facial\
    \ features.\n\n    ![Image](images/f0013-04.jpg)\n\n    4\n\n    Clean up your\
    \ lines with a kneaded eraser and refine the details.\n\n    #### Drawing on a\
    \ Tablet\n\n    Drawing digitally on a tablet is convenient and portable, making\
    \ it easy to design anywhere! Files are easy to clean up and make print-ready,\
    \ plus there are tools you can use to experiment with color and pattern.\n\n \
    \   ![Image](images/f0014-01.jpg)\n\n    1\n\n    Sketch your figure on the tablet\
    \ screen, or scan a template from the book and import it to your drawing program.\n\
    \n    ![Image](images/f0014-02.jpg)\n\n    2\n\n    Reduce the opacity of the\
    \ figure sketch layer. Make a new layer on top of the figure sketch. Draw your\
    \ fashion design just like you would if you were using a light box. When you complete\
    \ your design, turn off the figure sketch layer to reveal your clean drawing.\n\
    \n    ![Image](images/f0014-03.jpg)\n\n    3\n\n    Keep your line art design\
    \ layer on top and “Multiply” the layer. Next, add one or several layers underneath\
    \ to color your clothing. You can use a variety of different brush textures to\
    \ suit your taste. Choose from pencil, paint, ink, and more.\n\n    ![Image](images/f0015-01.jpg)\n\
    \n    4\n\n    Use color-editing tools to change the entire color story or to\
    \ experiment with just one part. This allows for fine-tuning to get color palettes\
    \ just right, while your line art layer stays perfectly intact!\n\n    **Digital\
    \ “Ink.”**  \n\n    Use a stylus to create a minimalist design using only gray\
    \ or black. This effect has a modern feel to it.\n\n    ![Image](images/f0015-02.jpg)\n\
    \n    ### Fashion for Everyone!\n\n    Fashion is for everyone—and it’s definitely\
    \ not a one-size-fits-all game! Today’s designers understand that fashion serves\
    \ purposes outside of the utilitarian function of simply dressing people. Fashion\
    \ supports creative expression, confidence, and individuality. Here are some tips\
    \ to get you started designing fashions for a wide range of people of all shapes\
    \ and sizes!\n\n    ![Image](images/f0016-01.jpg)\n\n    1\n\n    **Design for\
    \ everybody and every *body*!** Practice drawing all sorts of figure proportions\
    \ like the ones shown above. Find inspiration from fashion and lifestyle magazines,\
    \ social media, and on television. Red Carpet wrap-ups are especially great since\
    \ they show full-length poses of celebrities of all shapes and sizes.\n\n    ![Image](images/f0016-02.jpg)\n\
    \n    2\n\n    **Select a favorite outfit from your closet or a magazine.** Adapt\
    \ the design to fit a variety of body types. Don’t forget to add accessories!\n\
    \n    ![Image](images/f0017-01.jpg)\n\n    3\n\n    **Design an original fashion.**\
    \ Then tweak and alter your design to fit a variety of body types. Add details\
    \ that will flatter the body you are designing for, as shown in the example at\
    \ right.\n\n    ![Image](images/f0017-02.jpg)\n\n    ### Adaptive Apparel\n\n\
    \    Fashion can and should be customized to meet the needs of people with disabilities.\
    \ A growing number of high-end fashion brands are rolling out lines that take\
    \ these clients’ needs into account by positioning seams, zippers, buttons, and\
    \ the like in areas that are easy to manage. Other considerations include using\
    \ breathable fabrics, incorporating Velcro, magnetic closures, and other easy-to-use\
    \ fasteners into designs, and designing pockets, tags, and other details for comfort.\
    \ Design fashions that complement all body types and also accommodate mobility\
    \ devices.\n\n    ![Image](images/f0018-01.jpg)\n\n    ### Making Faces"

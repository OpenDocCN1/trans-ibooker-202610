    # CREATE A CLIMATE OF TRUST


    Leaders put trust-building on their agendas; they don’t leave it to chance. It’s
    the central issue in human relationships within and outside organizations. Without
    trust you cannot lead. Individuals who are unable to trust others fail to become
    leaders precisely because they can’t bear to be dependent on the words and work
    of others. So they either end up doing all the work themselves or supervise work
    so closely that they become over-controlling micromanagers. Because they don’t
    trust other people, the result is that those people don’t trust them in return.


    Psychologists find that individuals who are capable of trusting people are happier
    and more psychologically adjusted than those who view the world with suspicion
    and distrust.¹ Trusting individuals are also liked more by their peers and often
    sought out as friends. You listen more to those you trust and more readily accept
    their influence. The most effective leadership situations are those in which each
    member of the team trusts the leader, as well as one another.



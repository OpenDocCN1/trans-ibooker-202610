  mdcn: "\n\n# 领导力\n# 在\n# 高等\n# 教育中\n\nJAMES M. KOUZES\n\nand\n\nBARRY Z. POSNER\n\
    \n# 产生差异的实践\n\n# 领导力\n# 在\n# 高等\n教育中\n\nJAMES M. KOUZES\n\nAND\n\nBARRY Z. POSNER\n\
    \n畅销书《领导力挑战》的作者\n\n![](img/7ddf49e8d8cd889f8f7c75097442c3e0_1_0.png)\n\n# 《高等教育中的领导力》赞誉\n\
    \n> “与科泽斯和波斯纳之前的畅销书一样，本书始于基于证据的个人例证，然后提出将行为转化为实践的策略。从本书中获得的智慧和领导力实践为拥抱高等教育并在其中蓬勃发展提供了宝贵的领导技能。我们期待为全校的同事购买副本。这部作品及时、切中要害、积极、注重解决方案，而且一如既往地非常易于理解。”\n\
    > \n> —Adrian Popa, Department Chair, Gonzaga University\n\n> “鉴于高等教育正处于重大变革的时代，无论我们身处何种职位，本书都及时地作为一份实地指南，帮助我们在工作中产生差异并影响教育的未来。书中提供了来自大学和学院领导者的具体案例，将有助于进一步支持我们的工作，无论是对学生还是对教职员工的专业发展，在分享最佳实践方面。”\n\
    > \n> —Helen Wong, Head of Co-curricular Programs, Dean of Students’ Office, Hong\
    \ Kong University of Science and Technology\n\n> “我喜欢这本书的地方在于它以鼓舞人心和启发性的方式运用了日常知识。阅读这本书时，我感到被重视和受鼓舞，即使作为一名行政岗位的工作者。我会鼓励我的同事和高级管理层阅读这本书，因为它以一种激励我们产生变革的方式承认了我们对社区和环境的感受。”\n\
    > \n> —Aysen Ulupinar, Executive Assistant to the Associate Vice Chancellor, University\
    \ of North Carolina at Charlotte\n\n> “科泽斯和波斯纳提醒我们，学生也会通过观察领导者来学习，而诚实、胜任力和鼓舞人心的愿景在高等教育中与在其他领域一样必不可少。这本书不应该放在书架上——它的页面应该被放大并贴在所有了解自己始终被学生观察的大学领导者的墙上，因为他们始终在教授领导力。”\n\
    > \n> —Tom Schnaubelt, Assistant Vice Provost and Executive Director, Haas Center\
    \ for Public Service, Stanford University\n\n> “我喜欢科泽斯和波斯纳将理论与实践融合的方式，创造出既有经验的领导者也有新兴领导者都能轻松产生共鸣并记住的东西。令人耳目一新的是书中提供了来自高等教育领域的切实案例，证明领导力不必被定义为学术或专业，而应是‘有目的、有人的’。”\n\
    > \n> —Clare Litten, Senior Academic Search Consultant, University of Auckland\n\
    \n> “这是一本高等教育从业者的领导力必备书籍，对应对当今复杂问题以及明天未知可能性提供了深刻的建议。”\n> \n> —Clarence Green,\
    \ Chief of University Police, Northwest Missouri State University\n\n> “与每个其他行业一样，高等教育比以往任何时候都更迫切需要有效的领导力。阅读这本书，以便更好地理解领导行为如何影响他人，以及你如何释放自己内在的领导者，以及你所共事的人的领导力。”\n\
    > \n> —Cheryl Johnson, Leadership Development Consultant, CAJ Leadership Consulting\n\
    \n> “科泽斯和波斯纳正将他们的领导力模型和洞见直接应用于高等教育领域。干得好！在该领域正经历如此多变革的当下，《高等教育中的领导力》恰逢其时。高等教育中的每个人都可以成为领导者，而在高等教育工作的人每个人都需要阅读这本书！”\n\
    > \n> —Joseph Phillips, Dean, Albers School of Business and Economics, Seattle\
    \ University\n\n> “这本书与高等教育中的所有领导者相关，充满了实用故事和经验教训。我将在我所有的高等教育领导力研讨会和辅导中使用这本奠基性书籍！”\n\
    > \n> —Lillas Marie Hatala, Canadian higher education leadership development consultant\n\
    \n> “这本书是高等教育领域的游戏规则改变者。它独特之处在于识别了经过高度研究、被证明的领导行为，为你提供直接数据以了解你作为领导者的表现。这是一个非常个性化和指导性的过程，使你在生活的各个方面变得更有效。”\n\
    > \n> —Todd Sutherland, Chief Student Affairs Officer, Texas A&M University at\
    \ Galveston\n\n> “我最看重科泽斯和波斯纳作品的是他们对领导力的易懂且鼓舞人心的观点：每个人都能想到一次‘个人最佳’的领导经历，并致力于实践创造更多此类经历的行为。本书中的案例说明，无论我们的职责或职位如何，我们都可以创造非凡的事情。这在高等教育等级结构中具有至关重要的赋权作用。”\n\
    > \n> —Abby Conover, Coordinator of Undergraduate Initiatives, Biology Teaching\
    \ and Learning, University of Minnesota\n\n> “在高等教育面临挑战的今天，这本书的出现再及时不过了。科泽斯和波斯纳为学术管理者提供了成为变革型领导者的路线图，在过去半个世纪最具挑战性的学术环境中。他们创造了一套学术企业家的工具包。”\n\
    > \n> —**Joseph DiAngelo, Dean, Haub School of Business, Saint Joseph’s University,\
    \ and Past Chair, AACSB International**\n\n> “赞扬科泽斯和波斯纳继续证明某些‘旧做法’确实是最好的！我在我的副本上贴了标签——非常、非常好的提醒，我永远不会太忙而不能展现更好的领导力。”\n\
    > \n> —**Elizabeth Barron Silva, Senior Assistant Dean of Finance and Administration,\
    \ Santa Clara University**\n\n> “《高等教育中的领导力》将科泽斯和波斯纳经过检验的模型带入高等教育的背景中，提供了量身定制的案例、实用的建议和有帮助的反思问题，让任何读者都能思考并为行动做好更充分的准备。”\n\
    > \n> —**Willow Jacobson, Professor, School of Government, University of North\
    \ Carolina**\n\n> “虽然科泽斯和波斯纳关于领导力的教训和反思以前就与我产生强烈共鸣，但有了这本书，这些教训现在牢牢扎根于我在大学校园的日常体验中，使我更好地为下一步承担新举措做好准备。”\n\
    > \n> —**Susan Dorn, Leadership Gift Officer, Bowdoin College**\n\n# 领导力\n# 在\n\
    # 高等\n教育中\n\n# 领导力\n在\n高等\n教育中\n\n*产生差异的实践*\n\nJAMES M. KOUZES\nAND\nBARRY Z.\

    When you’re open, you make yourself vulnerable; this vulnerability is what makes
    you more human and more trustworthy to others. If neither person in a relationship
    takes the risk of trusting, at least a little, the relationship remains stalled
    at a low level of caution and suspicion; there’s no connection. If leaders want
    the higher levels of performance that come with trust and collaboration, they
    must demonstrate their trust *in* others before asking for trust *from* others.


    This is something that Cathy Avila understood and put into practice as a residential
    learning community director. “As a leader,” Cathy told us, “I am an open book.
    I share very personal pieces of myself so that the people I lead have a thorough
    picture of my journey through life up until that point and will better understand
    how I work and why I work the way I do.” Cathy soon discovered that when she demonstrated
    her trust in the residence staff by being the first to share personal information,
    challenges, goals, and fears, it made a big difference. For some staff, “it was
    the first time an adult (let alone their boss) had been honest and up-front with
    them.” By opening her heart, Cathy motivated staff members to share their deeper
    selves with others in the group.



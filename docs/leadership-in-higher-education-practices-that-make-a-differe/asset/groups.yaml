    # FOCUS ON CLEAR STANDARDS


    Imagine the frustration of Alice in *Alice in Wonderland* when she played a croquet
    match in which the mallets were flamingos, the wickets were playing-card soldiers,
    and the balls were hedgehogs. Everyone kept moving and the rules kept changing.
    There was no way to know how to play the game much less win it.


    You needn’t go down the rabbit hole to know how Alice felt. Haven’t you, at one
    time or another, been at a place where you’re not sure where you’re supposed to
    be going, what the ground rules are that govern how to behave, or how you’re doing
    along the way? And just when you think you’ve got the hang of it, the organization
    comes along and changes everything. This is a recipe for maddening frustration
    and pitiful performance. The antidote is making sure that people know both what
    they are supposed to do and how they are to do it. The data shows that people
    are proud to tell others about the organization they work for in direct relationship
    to the extent that their leaders “make it a point to let people know about his/her
    confidence in their abilities” (see figure 6.1).


    If you want the people in your department to have a strong desire to succeed and
    make a difference, they must feel “in the flow.” *Flow* occasions are those times
    when people experience pure enjoyment and effortlessness in what they do.² This
    psychological state requires clear standards—in both values and goals—because
    these help people concentrate their efforts and avoid distractions.


    Is it better that people set their own goals, or should leaders set the goals
    for others? In the best of all worlds, individuals would set their own. Realistically,
    however, goals are often handed down, and the challenge is to find a middle ground—a
    path to determine mutually acceptable objectives. People feel best'

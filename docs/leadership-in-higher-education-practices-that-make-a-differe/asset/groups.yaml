    # RESEARCH-BASED PRACTICES


    *Leadership in Higher Education* is written to enhance your abilities, and the
    principles and practices described in it are based solidly on quantitative and
    qualitative research. The book has its origins in a study we began in 1983. We
    wanted to know what people did when they were at their “personal best” in leading
    others. These were experiences in which people, per their own perceptions, set
    their individual leadership standards of excellence. We started with an assumption
    that to discover best practices we didn’t have to interview and survey star performers,
    select celebrities in academe, or people “at the top.” Instead we assumed that
    by asking people at all levels and across a broad array of organizational settings
    to describe extraordinary experiences, we would be able to find and identify patterns
    of success. And we surely did.


    The results of our initial investigation—and of the ongoing research we have conducted
    for nearly four decades—have been striking in their consistency and are a refutation
    of many leader stereotypes.³ People frequently assume, for example, that leadership
    is different from one institution to the next. Nothing could be further from the
    truth. While each campus may look different from the outside, we find that what
    leaders do when they are at their best is quite similar. This pattern of behavior
    varies little across higher-education settings and circumstances. In the appendix
    we describe more fully the research basis for this book, involving a database
    of over 125,000 respondents and more than 100 interviews and case studies. True
    enough, the context keeps evolving, and the landscape of higher education has
    shifted over time, but leadership remains an understandable and generalizable
    process. Leadership is not a fad. While each leader is a unique individual, there
    are shared patterns to the practice of leadership.


    # A GUIDEBOOK ON LEADERSHIP'
  - '[PAGE 18]


    Think of *Leadership in Higher Education* as a guidebook to take along on your
    leadership journey. We have designed it to describe what leaders do, explain the
    fundamental principles that support these leadership practices, and provide actual
    case examples of real people on college and university campuses who demonstrate
    each practice. Based on the real-world experiences of thousands of people who
    have answered the call for leadership, we offer specific recommendations on what
    you can do to make these practices your own and to continue your development as
    a leader.


    Chapter 1 introduces you to our point of view about leadership and briefly describes
    The Five Practices of Exemplary Leadership revealed in our research. In it we
    also describe the characteristics that people most desire in their leaders. We
    present the foundation on which all great leadership is built. We tell the leadership
    story from the inside and move outward, describing leadership first as a personal
    journey of exploration and then as a mobilization of others. Our research has
    shown that leadership is not the private reserve of a few charismatic men and
    women. It is a process people use when they are bringing forth the best from themselves
    and others. Liberate the leader in everyone, and extraordinary things happen.


    In chapters 2 through 6, we explore The Five Practices, one to a chapter. The
    discussions are built on the results of our research, and we expand your understanding
    of leadership by drawing on studies of other scholars. We do not summarize the
    literature or all the various conceptual perspectives on leadership; instead we
    provide a particular point of view on leading that is empirically sound and practically
    valuable. We illustrate each practice with case examples, recommend actions you
    can take to put the practice to use, and pose questions for you to reflect on
    in developing your leadership capabilities. There is no sacred sequence to these
    chapters. We suggest that you read chapter 1 and then go wherever your interests
    are. Please remember'

    to carry out the project. We had to step back and let the students learn from
    their experiences, even if they made some mistakes. This was risky because some
    of my colleagues felt the conference would not be of high quality if the students
    weren’t closely monitored—and there was a chance they could have been right.”


    While Jackie admitted to being “a little nervous” at the start, she challenged
    the student leaders to excel by “constantly posing questions, asking them what
    their vision and goals were and how they could include and empower others to get
    there.” She also encouraged and supported the students when they stumbled “to
    always learn from their experience.” The conference turned out to be a huge success,
    engaging large numbers of students from very diverse backgrounds. A broader range
    of students assumed leadership roles in the conference than ever before. Not only
    did the program receive a university-based award but the two student coordinators
    also received individual service awards for their leadership.



    # Model the Way


    Titles are granted; it’s your behavior that wins you respect. This sentiment was
    shared across all the cases we collected. Leaders Model the Way. They know that
    if they want to gain commitment and achieve the highest standards, they must be
    models of the behaviors they expect of others. You must first be clear about your
    guiding principles before you can hold them up for others to emulate. Once you
    are clear about your core values, you can give them voice, share them with others,
    and act on them. “It’s as straightforward,” Andy Ceperley* told us, “as never
    asking anyone else to do something you’re not willing to do yourself.”


    Andy has served in career services positions, both in the United States and abroad,
    experiencing a wide variety of academic institutions: public and private, secular
    and nonsecular, centralized and decentralized. In helping turn around one university’s
    career center, which had experienced substantial'

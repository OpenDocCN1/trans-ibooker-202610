  - "[PAGE 2]\n\n# Praise for Leadership in Higher Education\n\n> > “As with Kouzes\
    \ and Posner’s previous bestsellers, this work begins with personal illustrations\
    \ grounded in evidence followed by strategies for converting behaviors into practice.\
    \ Wisdom and leadership practices gained from this book offer invaluable leadership\
    \ skills for embracing and flourishing in higher education. We look forward to\
    \ purchasing copies for our colleagues across the university. This work is timely,\
    \ on point, positive, solution oriented, and as always, very accessible.”\n> \n\
    > —Adrian Popa, Department Chair, Gonzaga University\n\n> > “Given the current\
    \ era of significant change in higher education, this book is timely as a field\
    \ guide, no matter what positions we are in, to make a difference in our work\
    \ and impact the future of education. With specific examples from university and\
    \ college leaders, it will help further support our work, both with students and\
    \ with professional development for staff and faculty, in sharing best practices.”\n\
    > \n> —Helen Wong, Head of Co-curricular Programs, Dean of Students’ Office, Hong\
    \ Kong University of Science and Technology\n\n> > “What I love about this book\
    \ is that it is uses everyday knowledge in an inspiring and enlightening way.\
    \ When reading this book, I felt valued and inspired, even as someone who serves\
    \ in an administrative role. I would encourage my colleagues and senior administration\
    \ to read this book because it acknowledges our feelings about our community and\
    \ environment in a way that inspires us to produce change.”\n> \n> —Aysen Ulupinar,\
    \ Executive Assistant to the Associate Vice Chancellor, University of North Carolina\
    \ at Charlotte"
  - "[PAGE 3]\n\n> “Kouzes and Posner remind us that students also learn by observing\
    \ those who lead and that honesty, competence, and an inspiring vision are as\
    \ essential in higher education as in other domains. This book doesn’t belong\
    \ on a shelf—its pages should be enlarged and pinned to the walls of all college\
    \ leaders who know they are always being observed by students and, as such, are\
    \ always teaching leadership.”\n> \n> —Tom Schnaubelt, Assistant Vice Provost\
    \ and Executive Director, Haas Center for Public Service, Stanford University\n\
    \n> “I enjoyed the way Kouzes and Posner have blended theory and practice, creating\
    \ something both experienced and emerging leaders will relate to easily (and retain).\
    \ It is refreshing to have tangible examples from the higher education sector,\
    \ demonstrating that leadership does not need to be defined as academic or professional,\
    \ rather, ‘of purpose and people.’”\n> \n> —Clare Litten, Senior Academic Search\
    \ Consultant, University of Auckland\n\n> “This is a higher education practitioners’\
    \ go-to book for leadership with profound advice on dealing with the complex problems\
    \ of today as well as the unknown possibilities of tomorrow.”\n> \n> —Clarence\
    \ Green, Chief of University Police, Northwest Missouri State University\n\n>\
    \ “Like every other industry, higher education is in desperate need of effective\
    \ lead-ership—more so now than ever before. Read this book so that you can better\
    \ understand how leadership actions and behaviors influence others and how you\
    \ can liberate the leader within you, as well as those you work with.”\n> \n>\
    \ —Cheryl Johnson, Leadership Development Consultant, CAJ Leadership Consulting"
  - '[PAGE 4]


    > “Kouzes and Posner are applying their leadership model and insights directly
    to the higher education sector. Bravo! With this sector now under so much disruption,
    *Leadership in Higher Education* is arriving just in the nick of time. Everyone
    in higher education can be a leader, and everyone who works in higher education
    needs to read this book!”


    —Joseph Phillips, Dean, Albers School of Business and Economics, Seattle University


    > “This book is relevant to all leaders in higher education, peppered with practical
    stories and lessons learned. I will be using this foundational book in all my
    Leadership in Higher Education workshops and coaching!”


    —Lillas Marie Hatala, Canadian higher education leadership development consultant


    > “This book is a game changer for higher education. It’s unique in that it identifies
    highly researched, proven leadership behaviors that provide direct data to you
    as to your performance as a leader. It is a very personalized and prescriptive
    process to becoming more effective in all aspects of your life.”


    —Todd Sutherland, Chief Student Affairs Officer, Texas A&M University at Galveston


    > “What I value most about Kouzes and Posner’s work is their accessible and inspiring
    view of leadership: everyone can think of a ‘personal best’ leadership experience
    and commit to practicing behaviors that create more of them. The examples throughout
    this book illustrate that all of us can make exceptional things happen, regardless
    of our charge or position. This is vitally empowering within the hierarchical
    structures of higher education.”


    —Abby Conover, Coordinator of Undergraduate Initiatives, Biology Teaching and
    Learning, University of Minnesota'
  - '[PAGE 5]


    > “With the challenges facing higher education today, this book could not be time-lier.
    Kouzes and Posner provide a road map for academic administrators to become transformative
    leaders in the most challenging academic environment of the last half century.
    They have created a toolkit for academic entrepreneurs.”


    —**Joseph DiAngelo, Dean, Haub School of Business, Saint Joseph’s University,
    and Past Chair, AACSB International**


    > “Kudos to Kouzes and Posner for continuing to demonstrate that some ‘old practices’
    really are the best! I stuck tabs in my copy—very, very good reminders that I
    can never be too busy to demonstrate better leadership.”


    —**Elizabeth Barron Silva, Senior Assistant Dean of Finance and Administration,
    Santa Clara University**


    > “*Leadership in Higher Education* brings Kouzes and Posner’s tested model into
    the context of higher education with tailored examples, practical suggestions,
    and helpful reflective questions that will get any reader thinking and more prepared
    to act.”


    —**Willow Jacobson, Professor, School of Government, University of North Carolina**


    > “While lessons and reflections on leadership from Kouzes and Posner have resonated
    strongly with me before, with this book those lessons are now firmly rooted in
    my day-to-day experience on a college campus, better equipping me for next steps
    in taking on new initiatives.”


    —**Susan Dorn, Leadership Gift Officer, Bowdoin College**'

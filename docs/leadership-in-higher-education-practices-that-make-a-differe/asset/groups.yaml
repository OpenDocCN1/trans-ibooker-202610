    Individual recognition increases the recipient’s sense of worth, and it improves
    performance. Public celebrations have this effect *and more*. Every time you can
    bring the group together is a chance to renew commitment. Exemplary leaders seldom
    let pass any opportunity to make sure that everyone knows why they’re all there
    and how they’re going to act in service of that purpose. Whether it’s in honor
    of an individual, group, or organizational achievement, celebrations offer leaders
    the perfect opening to explicitly communicate and reinforce the actions and behaviors
    that are important in realizing shared values and goals.


    Celebrations are much more than parties; they’re ceremonies and rituals that create
    meaning. At such occasions it’s vitally important to be clear about the statements
    you’re making and the behaviors you’re reinforcing. You should be fully aware
    that people are going to leave the event remembering and repeating what you say
    and what they see. You should always be personally prepared with the key messages
    you want to send. Each time ask yourself, *What values do we hold dear, what visions
    do we aspire to realize, and what behaviors do we want to reinforce?* Be prepared
    for every public opportunity to reinforce the culture and the meaning you want
    to instill.


    # Provide Social Support


    Supportive relationships at work—relationships characterized by a genuine belief
    in and advocacy for the interests of others—are critically important to maintaining
    personal and organizational vitality. Ceremonies and celebrations are opportunities
    to build healthier groups and to enable members of the organization to get to
    know and care about one another.


    > “Life is too short to be miserable,” says Charles Ambelang, vice president for
    human resources (although he came to the university originally as director of
    the student union). “You'

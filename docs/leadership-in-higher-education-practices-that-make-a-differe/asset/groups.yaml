    This was very true in Susan Tomaro’s experience when she had the challenging assignment
    of planning a weeklong new-student orientation program during a time that overlapped
    with the Jewish High Holy Days. Not only would there be conflicting events but
    the two activities would be competing over the use of limited campus facilities.
    It was her first year in this position, and she immediately went to work to build
    strong relationships with the Office of Religious Life and Hillel.


    ![](img/7ddf49e8d8cd889f8f7c75097442c3e0_121_0.png)


    **Figure 5.1** The extent that leaders are viewed as developing cooperative relationships
    among the people they work with increases team spirit in their work groups.'

    \nBarry Posner\n\nJohn Brennan\n\n**吉姆·库泽斯**和**巴里·波斯纳**共同参与高等教育管理工作已有超过\n\n《有史以来最佳书籍》，荣获美国医疗保健高管委员会、《快公司》杂志的年度图书荣誉，以及全国书评编辑评选的“评论家选择奖”。\n\

    我们在此章中介绍并简要说明、并将在后续章节中广泛讨论的卓越领导力的五项实践，并非我们所研究的人或少数耀眼明星或独特人格的私有财产。它们对任何接受挑战、带领人们和组织走向从未涉足之地的人来说，在任何大学组织或情境中都是可用的。


    关于领导力的最大神话之一是有些人拥有“它”，有些人没有。相关的神话是如果你没有“它”，你就学不会“它”。两者都与经验证据相去甚远。³ 在反思他们的个人最佳领导力经历后，人们通常得出的结论与卡内基教学促进基金会的
    Tanvi Lotwala 相同：“我们所有人天生都是领导者。我们都具有与生俱来的领导品质；我们所需要做的只是打磨它们并将其带到前台。这是一个持续的过程，让我们作为领导者不断发展自己，但除非我们每天接受向我们提出的领导力挑战，否则我们无法变得更好。”


    此外，这一领导力操作系统已被广泛研究和检验。数百名学者已将卓越领导力的五项实践框架应用于他们对高等教育中领导力的研究。从对大学校长、⁴ 商务和财务主管、⁵
    院长和系主任、⁶ 学生事务和项目管理人员、⁷ 体育主管和教练、⁸ 图书馆员、⁹ 以及教员¹⁰ 等人的研究中，许多学者发现这些领导力实践与组织和职业有效性密切相关。


    经验证据明确表明，在高等教育中频繁使用卓越领导力五项实践的领导者，其部门和职能中拥有最投入和最有成效的人。根据对其直接下属的调查，卓越领导者比最不投入的直接下属的领导者更有可能以超过六倍的频率运用五项实践。更具体地说，直接下属感受到例如被组织重视、正在发挥作用、个人有效等程度——都与他们观察到领导者参与卓越领导力五项实践的频率直接相关。¹¹


    ## Model the Way


    头衔是授予的；是你行为赢得尊重。这一观点在我们收集的所有案例中都有体现。领导者以身作则。他们知道如果想要获得承诺并实现最高标准，他们必须成为自己期望他人表现的行为的榜样。你必须首先明确自己的指导原则，然后才能将其树立起来供他人效仿。一旦你明确了自己的核心价值观，你就可以为其发声，与他人分享并付诸行动。“这很直接，”Andy
    Ceperley* 告诉我们，“就是永远不要要求别人做你自己不愿意做的事。”


    Andy 在职业服务岗位上任职，既在美国也在国外，经历了各种各样的学术机构：公立和私立，世俗和非世俗，集中化和分散化。在帮助扭转一所大学职业中心的局面时，该中心经历了大量员工流失并烧毁了几任主任，他解释说他有必要亲自“深入与校园各方人士进行对话”。他采访了50多个人并提出了大量问题，认真倾听他们对职业中心的看法。在建立关系时，Andy
    通常首先分享他对职业中心作为服务组织的意义的价值观和信念，以及他关于此类中心如何有效与校园社区互动的经验。他确保职业中心每一位员工都能进行类似的反思性思考。


    正如 Andy 所指出的那样，为了有效地以身作则，领导者必须首先明确自己的指导原则。他们必须找到真实的声音，清晰而鲜明地阐述自己的价值观。因为领导者被期望为自己的信念挺身而出，他们最好有一些可以捍卫的信念。通过知道自己最看重什么，Andy
    能够更好地做出与他珍视的原则一致的决定。然而，仅此是不够的。领导者还必须确保自己的行为与价值观和标准一致。


    领导者的行为比言语更重要，用以证明他们对自己所说的话的认真程度。言行必须一致；如果不一致，虚伪就会蔓延，愤世嫉俗就会滋长。像 Andy 一样，领导者需要率先垂范，通过日常行动树立榜样，提供他们对信念深深承诺的证据。他们证明某事重要的最好方式之一就是亲身示范。领导者以行动树立的榜样比他们所说的任何话都更有力量。卓越的领导者言行一致。


    ## Inspire a Shared Vision



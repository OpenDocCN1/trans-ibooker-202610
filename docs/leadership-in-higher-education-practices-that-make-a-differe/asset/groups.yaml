    ## CHAPTER 2

    ### Model the Way


    Tonya Nilsson，土木工程系的高级讲师，回忆起她的母亲曾是一家当地图书馆的管理者，母亲经常说“她永远不会要求员工做她自己不愿意做的事情”。这句座右铭深深植根于
    Tonya 的内心，她认为“如果我自己不愿意以身作则地示范更好的教学，就不应该评判某人教学无效且不愿提升自己”。这只是 Tonya 原因之一，她会定期为自己配备各种教学工具以更好地与学生互动，并参与专注于改善学生学习的大学委员会。在这些场合，她与同事分享自己的价值观和信念，并鼓励他们使用更有效的教学方法。她认为所有教师都是领导者，不应仅限于管理内容传授，还应培养并为下一代工程师和科学家做好准备。


    Tonya 确保自己在自己的课堂上将价值观与行动保持一致。例如，她认为教师尊重学生的一种方式就是准时开始上课。她在课程开始时就明确表示迟到是不可接受的。她在上课一开始就进行测验，以说明迟到可能带来负面后果。她在自己的行动中也贯彻这一点，表示如果她迟到会给学生加分。


    Tonya 还认为工程师必须善于沟通至关重要，因为这不仅确保安全，也维持项目进展。她强调沟通技能的发展，并在讲座中以身作则。她上课时先给出议程或概述，告知学生她的学习目标和将要讲解的内容。她会确保板书清晰易读，问题-解决方案讲义易于理解。“我所做的一切必须在课程结束后很长时间仍然清晰，”她说。


    像 Tonya 这样的领导者明白，他们必须充分理解驱动自己的价值观、信念和假设。他们必须自由而诚实地选择将用于指导自己行动的原则。在你能够清晰传达信息之前，你必须明确自己想要传达的信息。而在你能够
    *do* 你所说之前，你必须确保你 *mean* 你所说。


    然而，仅靠言语是不够的，无论多么高尚。你必须找到 *你的* 声音，并以真实、独特代表你自己的方式传达你的信念，以便他人认识到说话的人是你，而不是别人。“最重要的是，学术院长——以及所有领导者——必须正视自己，”Deryl
    Leaming，前院长、学术领导力多部著作的作者解释道。“他们必须了解自己的倾向和动机，并对自己是谁感到自在。”¹


    在高等教育中最有效的领导者是那些最频繁地“以身作则”的人。我们询问直接下属他们的领导者在《领导力实践问卷》（LPI）中与“以身作则”相关的六种行为的参与频率，评估范围从
    1（几乎从不）到 10（几乎总是）。我们还询问了他们一个单独的问题，关于


    被招募到初创运营部门担任大型公立大学商业与领导力项目的总监。


    像任何新领导者一样，Lillas 意识到她“必须赢得可信度。在任何组织中，建立可信度是一个需要时间、努力、奉献和耐心的过程。”此外，她意识到作为高等教育领域的外来者进入会尤其困难，因为人们对意图和能力可转移性存在怀疑。在她的案例中情况更甚，因为她最初的项目之一是为系主任开发领导力发展项目。想象一下他们的嘀咕：*一个来自零售业的人怎么可能帮助培养学术界人士的技能？*


    > “在最初几年，”Lillas 说，“一些唱反调的人嘲笑我的工作，说‘你在谈论商业，而这是一所大学’，或‘你不能赶猫群’，或‘别搞花哨的’，等等。尽管当时有些痛苦，但这不仅带来了挑战，还促使我坚持下去……它强化了我为建立比我所经历的更鼓舞人心、更有支持性的文化做出贡献的意图。”


    在整个具有挑战性的项目中，Lillas 依靠一种简单的方法来帮助她坚持下去。每天她都用个人日记写作进行反思和沉思。“我用日记与内心的微小声音对话，”她说。“每晚我都会问，*我今天做了什么来体现我珍视的这一价值观？我无意中做了什么来表明这对我来说不是价值观？我需要做更多什么来更充分地表达我的价值观？*”通过每天澄清和重申自己的价值观，Lillas
    能够增强自己在机构文化以及人们相互关系和尊重方面的决心。


    正如 Lillas 的故事所说明的，价值观是你的指南，是你个人的底线。它们为你提供道德罗盘，帮助你在日常生活中航行。价值观的清晰对于辨别东西南北至关重要。你越清晰，坚持所选道路就越容易。在困难和不确定的时期，你尤其需要这种指导。当日常挑战可能让你偏离航向时，拥有一些路标来告诉你所在的位置并保持在正轨上至关重要。


    价值观也作为行动的指南。它们指导你关于做什么和不做什么的决定，以及何时说 yes 或 no 并理解 *为什么* 你是认真的。例如，如果你相信激烈的辩论可以激发思考和创造力，你就应该知道当持不同观点的人在提出新想法时不断被打断时该怎么做。如果你更重视协作而非个人主义成就，你就会知道当你经验最丰富的职业中心顾问跳过团队会议并拒绝与同事分享信息时该怎么做。如果你更重视独立和主动性而非一致性和服从，你就更有可能在认为政策错误时站出来并挑战它。


    正如 *figure 2.1* 中的数据所示，人们对领导者有效性的评价与其认为领导者对其个人领导哲学是否清晰之间存在显著关系。只有 3% 的人认为那些几乎从不/很少对其个人领导哲学清晰的领导者是有效的；对于那些被认为非常频繁/几乎总是对其领导哲学清晰的领导者，有效性百分比上升了超过
    30 倍。



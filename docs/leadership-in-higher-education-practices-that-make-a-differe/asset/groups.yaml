    最优秀的大学领导者能够激发并利用这种人类渴望，通过传达学院工作的意义和重要性，使人们理解自己在延续这一工作方面的[content]


    这个前景让她感到兴奋，她能够相当详细地想象这个项目将如何运作以及谁可能会参与其中。正如她告诉我们的：“我能看到学生在课堂上坐着，听着一位教员与他们谈论伦理困境和滑坡。我能看到学生小组讨论不同的文化背景如何影响我们的领导行为。我能看到学生在他们的组织中承担更积极的角色。我能看到学生在项目结束时在我们的招待会上领到证书时会多么兴奋。”从她最初的直觉——以及大量的辛勤工作——中诞生了一个成功的试点项目，50名学生探索了他们的领导风格并培养了领导技能。如今，
    many 年后，这个项目仍然让 Jo-Anne 感到微笑——它仍在校园中继续，激励着不断增长的学生领导群体。


    像 Jo-Anne 一样，我们采访的许多人提到，分析他们的个人最佳领导经历这一练习对他们来说是启发性的：通过突出过去的关键教训，他们能够为尚未探索的领导之路生成富有洞察力的路线图。从直接经验和主动探索中获得的知识，一旦储存在潜意识中，就成为领导者直觉、洞察力和愿景的基础。


    展望未来是一个始于灵感、一种感觉或一种认为某事值得去做的信念的过程。你对未来的愿景可能很模糊，但至少你专注于一个有意义的主题。你相信现状可以比今天更好。你顺从自己的直觉行事，愿景变得稍微清晰一些。你做一些让你前进的事情，愿景变得更加清晰。你关注它，体验它，沉浸其中。你让事情开始运转，随着时间的推移，你在梦想中看到更多细节。这是一个迭代的过程，最终会产生一些你和他人能够表述的东西。


    ## 让他人加入


    愿景关乎希望、梦想和抱负。它们是对实现某项雄心壮志的强烈渴望的宣言。它们是乐观主义的表达。你能想象一位领导者通过说“我希望你加入我一起做平凡的事”来招募他人加入事业吗？不太可能。愿景激励人们想象令人兴奋的可能性、突破性项目和革命性的社会变革。然而，这样的宏伟抱负无法实现，除非它们被你的利益相关者——员工、教员、行政人员、学生、校友、捐赠者或其他你希望争取的人——所共享。这正是
    Derek McCormack 副校长告诉我们的，当他被要求发展机构时，他意识到他的工作“不是自己寻找愿景，而是创造一个共同愿景，这样我们才能一起踏上同一旅程。”


    它’s not enough for a leader to have a vision; the members of the leader’s department
    must also understand, accept, and commit to it. When others shared with us their
    Personal-Best Leadership Experiences, they made comments similar to Derek’s. People
    frequently talked about the need to get buy-in from others on the vision. They
    explained how they had to communicate the purpose and build support for a unified
    direction. They knew that everyone had to commit to a common purpose. They understood
    that to get everyone on the same journey, they had to be able to communicate why
    others should want to join in, what it would mean to them, and how it would benefit
    them. While you might be able to see how others’ interests are served, if they
    can’t see how their needs are connected to the larger vision, they will be reluctant
    to climb aboard. But when they do, the department’s and the institution’s ability
    to change and reach its potential soars.


    Getting others on board means you need to listen deeply. From the conversations
    you have with constituents, you need to find a common purpose that unites potentially
    diverse motivations and aspirations. You need to be able to instill a sense of
    pride in being unique. You need to paint pictures that make the vision come alive,
    and you need to speak with conviction and enthusiasm about the exciting possibilities.


    ### Listen Deeply


    Identifying who your constituents are and discovering their common aspirations
    are required steps that leaders must take in enlisting others. No matter how grand
    the dream of an individual visionary, if others don’t see in it the possibility
    of realizing their own hopes and desires, they won’t follow. You must show others
    how they too will be served by the long-term vision of the future and how their
    specific needs can be satisfied.


    What this takes is attentive listening so that you can sense the purpose in others.
    By knowing your constituents, listening to them, and soliciting their advice,
    you are better able to give voice to their concerns. You can stand before others
    and say with assurance, “Here’s what I heard you say that you want for yourselves.
    Here’s how your own needs and interests will be served by enlisting in a common
    cause.” In a sense, leaders hold up a mirror and reflect back to their constituents
    what they say they most desire. When people see that reflection, they recognize
    themselves and can embrace the image.


    Appreciating that leadership is a relationship puts listening in its proper perspective.
    It has been said that no great idea enters the mind through an open mouth. Exemplary
    leaders know that they need not have all the ideas or all the answers themselves.
    The origin of a vision does not arise from gazing at a crystal ball; there are
    clues all around you if you are able to listen for them as they are passed on
    from students, colleagues, alumni, parents, and donors. There is no shortage of
    ideas and opportunities for making your part of the institution even better than
    it already is.


    To accurately and faithfully hear what constituents want—what they hope to make
    you understand, appreciate, and include in the vision—requires periodically suspending
    regular activities and spending time simply listening to others. Get to know your
    constituents by visiting their hangouts; go to sporting events, recitals, dining
    halls, the library, lectures, and classes. Get out of your office and wander into
    the offices of faculty and staff colleagues. Have coffee, breakfast, lunch, afternoon
    breaks, or some unstructured time with constituent groups. Find out what’s going
    on with them and what they are hoping to achieve from their relationship with
    you and your program.


    ### Discover a Common Purpose


    Have you asked people in your department or program why they stay? More likely,
    and especially if staffing is part of your responsibilities, you worry about turnover,
    retention rates, and why people leave. Instead think about the vast majority of
    those who stay and ask them why they stick around. Why do you? The most important
    reason people give about why they don’t leave or aren’t looking for another position
    is that they find the work they are doing to be challenging, meaningful, and purposeful.


    Academic institutions, on both the faculty and staff sides, have an advantage
    over many other types of organizations in that our colleagues generally start
    out with a shared commitment to learning and personal and professional development.
    Listening with sensitivity to the aspirations of others reveals common values
    that link everyone on campus. People want a chance to be tested, a chance to make
    it on their own, to take part in a social experiment, to do something well, to
    do something good, and to change the way things are.⁴ Aren’t these the essence
    of what most leadership opportunities are all about?


    What people want from their workplace has not changed very dramatically over the
    years despite economic upturns and downturns. Regardless of profession, industry,
    or location, people rank “interesting work” well above “high income” as important.
    And the quality of leadership (“working for a leader with vision and values”)
    is even more motivating than dollars. Would it surprise you that the most frequently
    mentioned measure of success in work life is “personal satisfaction for doing
    a good job”? People cite this between three and four times as often as “getting
    ahead” or “making a good living.”⁵


    Universities have seldom been places where people go to work to maximize their
    financial gains. There’s considerable opportunity for campus leaders to appeal
    to much more than material rewards. Great leaders evoke meaning. The values and
    interests of freedom, self-actualization, learning, community, excellence, justice,
    service, and social responsibility truly attract people to a common cause. Shared
    visions are “a force in people’s hearts, a force of impressive power.”⁶


    There is a deep human yearning to make a difference. People want to know that
    they’re doing something meaningful on this earth, that there’s a purpose to their
    existence. Work can provide that purpose, and increasingly the workplace is where
    people pursue meaning and identity.⁷ The best university-based leaders are able
    to bring out and make use of this human longing by communicating the meaning and
    significance of the college’s work so that people understand their own important
    role in perpetuating it. When leaders clearly communicate a shared vision of an
    organization, they ennoble those who work on its behalf. They elevate the human
    spirit.


    ### Take Pride in Being Unique


    Visions communicate what makes the team, department, school, or university singular
    and unequaled; they set the



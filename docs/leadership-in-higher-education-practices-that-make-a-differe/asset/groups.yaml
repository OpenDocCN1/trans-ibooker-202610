  - '[PAGE 28]


    To enlist people in a vision, leaders must know their constituents and speak their
    language. Similar to others we interviewed, Kelly knew that people must believe
    that leaders understand their needs and have their interests at heart before they
    will come on board. Leaders breathe life into the hopes and dreams of others and
    enable them to see exciting possibilities. Leaders forge a unity of purpose by
    showing constituents how the dream is for the common good. Leaders ignite passion
    in others by expressing enthusiasm for the compelling vision of their group, communicating
    their zeal through vivid language and an expressive style.


    # Challenge the Process


    Leaders are pioneers—people who are willing to step out into the unknown. They
    search for opportunities to innovate, grow, and improve. Every single personal-best
    leadership case we collected involved some change from the status quo. Not one
    person claimed to have achieved a personal best by keeping things the same—by
    doing what had always or had already been done. All leaders Challenge the Process.


    But leaders aren’t the only creators or originators of new curricula, programs,
    services, or processes. In fact, it’s more likely that they’re not: innovation
    comes more from listening than from telling, from asking questions and hearing
    what others are thinking and have to say. When challenging the process, the leader’s
    primary contributions are the recognition of good ideas, the support of those
    ideas, and the willingness to challenge the system to get new products, processes,
    services, and systems adopted. It might be more accurate, then, to say that leaders
    are *early adopters* of innovation.


    J. Patrick Murphy, CM, didn’t dream up the idea for a public services graduate
    program out of his imagination alone. He listened to the aspirations espoused
    by the university’s'
  - '[PAGE 29]


    president and the yearnings of many students about wanting to apply the lessons
    being learned in the classroom more directly in their communities. Pat also heard
    several of his colleagues express an interest in being involved with a program
    that intersected the private and public sectors and how there seemed to be opportunities
    to apply best practices from the for-profit sector to community-based organizations.


    Pat’s own dean was not initially supportive, citing financial and strategic limitations.
    Not easily discouraged, Pat shopped around the proposal to other parts of the
    campus (which at his relatively conservative university was considered a governance
    taboo), gaining interest and support for an interdisciplinary approach (not just
    in the curriculum but in staffing and funding as well). He even approached several
    members of the board of trustees, circled back with the president, and found sufficient
    support for what has now turned out to be the largest graduate program at the
    college.


    Funding for the program was tight at the onset, as it generally is at colleges
    and universities, so Pat raised monies through several novel initiatives. For
    example, Pat and his colleagues founded a small consulting and executive training
    business and launched several fundraising programs, including a “pub night” to
    raise scholarship money for students studying in Ireland. Many of these efforts
    Pat had to initially bring in under the radar to keep from attracting too much
    attention; sometimes, he would say, “asking for forgiveness rather than permission”
    was necessary to learn what ideas were or were not feasible.


    Leaders know well that innovation and change involve experimentation and risk.
    One way you can deal with these potential risks and failures is to approach change
    through incremental steps and small wins. Learning also unlocks the door to progress,
    and exemplary leaders make a point to ask, “What can we learn?” when things don’t
    go as expected.'
  - '[PAGE 30]


    Learning leads to little victories, which when piled on top of one another build
    confidence that people can meet even the most significant challenges. In so doing,
    leaders strengthen commitment to the long-term future.


    # Enable Others to Act


    Grand dreams don’t become significant realities through the actions of a single
    person. Leadership is a team effort, and to make extraordinary things happen in
    organizations exemplary leaders Enable Others to Act. They foster collaboration,
    developing relationships and building trust. Leaders engage all those who must
    make the project work—which was precisely the conclusion Charlie Slater reached
    when recounting his Personal-Best Leadership Experience of launching a new doctoral
    program. When asked who the leader was in developing this program, he quickly
    replied, “There was not a single leader but rather many leaders. At different
    times in the process, each one of them was critical. The program would not have
    come about without the leadership of all these people.”


    Leaders make it possible for the people around them to accomplish great things.
    They appreciate that those expected to produce at their most inspired levels must
    feel a sense of personal power and ownership. Charlie talked about how the university
    president, while favoring the idea, clearly understood that such an initiative
    couldn’t successfully be launched by executive fiat, so he passed along his blessings
    to the dean, who in turn asked Charlie, because of his background and positive
    working relationships with the faculty, to accept this leadership challenge. Charlie
    knew that such a program could not be developed and sustained through the efforts
    of a single champion, and he worked with myriad faculty colleagues within the
    school to bring this new program to life.'
  - '[PAGE 31]


    This underscored for Charlie, as it did for others reflecting on their Personal-Best
    Leadership Experiences, the importance of commitment-and-support leadership versus
    the command-and-control techniques of previous generations. The work of leaders
    is making people feel strong, capable, and committed. Leaders enable others not
    by hoarding the power they have but by giving it away. The university president
    could not have made the program a reality by himself, and, in fact, no single
    person or group could have advocated successfully for the program without the
    cooperation of others. Working together, exemplary leaders strengthen everyone’s
    capacity to deliver on the possibilities they imagine and the promises they make.


    In the cases we analyzed, leaders like Charlie proudly discussed teamwork, collaboration,
    trust, and empowerment as essential elements of their efforts. People don’t stick
    around for very long or perform at their best if their leader makes them feel
    weak, dependent, or alienated. But when a leader makes people feel strong and
    capable, raising their belief that they can do more than they ever thought possible,
    people will give their all. In our research it was not unusual for people to indicate
    that when working with their best leaders they gave to the endeavor more than
    100 percent of themselves because that leader was able to elicit from them more
    than what they themselves had thought possible. When leadership is a relationship
    founded on trust and confidence, people take risks, make changes, and keep organizations
    and movements alive.


    # Encourage the Heart


    The climb to the top of any endeavor is arduous and steep, and it is altogether
    easy for people to become exhausted, frustrated, and disen-chanted. Leaders Encourage
    the Heart of their constituents to carry on, to continue even when they might
    be tempted to give up. Genuine acts of caring, whether exhibited in dramatic gestures
    or simple actions— for example, bringing'
  - '[PAGE 32]


    food to a sick colleague, visiting people in the hospital, or sending a handwritten
    note of appreciation—uplift the spirits and draw people forward. Jennifer Dirking,
    associate director for her community college’s foundation, says that she is always
    on the lookout for ways to foster a climate in which “people feel cared about
    and genuinely appreciated.”


    An award for the “most outstanding faculty member” used to be given each year
    at Barry Posner’s school. In those days he was a faculty member and said that
    he “could never understand how there could be one award, with so many disciplines,
    and, given each discipline’s different standards, how the faculty and dean’s office
    could decide on what ‘most outstanding’ meant.” So, when he became dean, Barry
    says,


    > I was determined we’d change the system and do more to recognize the excellence
    among our *many* faculty colleagues. Working with our Council of Department Chairs,
    we established a specific set of accomplishments, from unsatisfactory to exemplary,
    which were appropriate to all disciplines and all ranks. Any faculty member who
    could be exemplary in teaching and scholarship and service would certainly be,
    in any of our minds, “extraordinary”—and that’s what we called the award. We could
    all be proud when anyone in the school was extraordinary.


    In the first year, six Extraordinary Faculty Awards were given. Five years later
    13 were awarded. As Barry recalls, “I thought it was great that the standards
    hadn’t changed, but the behavior—and hence the performance—of our faculty had
    risen to the ideal we set. With this change in criteria for the award, we took
    a giant step in eliminating competition among ourselves for ‘who’s the best’ and
    rather collectively focused on what everyone needed to do to be at their best.”


    It is part of the leader’s job to show appreciation for people’s contributions
    and to create a culture of celebration. Over the years we’ve seen thousands of
    examples of individual recognition and group celebration, from handwritten thank-you
    notes to marching bands and “This Is Your Life” ceremonies.'

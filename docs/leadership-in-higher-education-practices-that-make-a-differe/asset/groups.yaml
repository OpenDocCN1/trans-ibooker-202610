    are winners right now! If you believe that people are winners, you will treat
    them that way. Moreover, if you want people to be winners, you have to behave
    in ways that communicate to them that they are winners. And it’s not just about
    your words. It’s also about your tone of voice, posture, gestures, and facial
    expressions. No yelling, frowning, cajoling, making fun of, or putting them down
    in front of others. Instead it’s about being friendly, positive, supportive, and
    encouraging. Offer positive reinforcement, share lots of information, listen carefully
    to people’s input, provide sufficient resources to do their jobs, give increasingly
    challenging assignments, and lend them your support and assistance.



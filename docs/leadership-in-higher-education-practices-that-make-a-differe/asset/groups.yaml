    \n吉姆和巴里开发了被广泛使用且广受好评的*《领导力实践清单》*，这是一份评估领导行为的360度问卷。全球已有超过500万人完成了LPI。超过700篇博士论文和学术研究项目基于“卓越领导五项实践”框架。欲了解更多关于吉姆和巴里的出版物和研究，请访问\

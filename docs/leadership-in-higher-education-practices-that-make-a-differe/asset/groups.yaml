    Susan understood that she would not be able to argue that her program was more
    important than these religious holidays to those involved with them, nor would
    they be able to necessarily claim that this religiously important time trumped
    priority over use of the campus facilities. Susan understood that they needed
    to work together to resolve potential conflicts. What she did was “provide information
    about the various challenges we all faced and seek everyone’s help to change the
    way we would do things this time around. I asked people on all sides to think
    outside the box and recognize that the issues could be resolved only by getting
    many people involved and working together. Nobody was going to be successful without
    the support of everyone working together with one another.” A zero-sum solution
    would not be to anyone’s benefit.


    Leaders, like Susan, appreciate that collaboration results from people understanding
    that they have to rely and depend on one another for their mutual success. With
    this realization, asking for help and sharing information comes naturally. Because
    they see themselves in a mutually beneficial relationship, finding and setting
    a common goal is not problematic.


    Charlie Slater also understood the importance of positive interdependence and
    collaboration when talking about his Personal-Best Leadership Experience. In the
    successful development and implementation of the university’s first doctoral program,
    Charlie told us that “there were many leaders” and that this accomplishment would
    not have been possible “without the leadership and cooperation of so many people.”
    Everyone was willing to cooperate with one another, assuming complementary roles
    to move the possibility into reality. The university’s president started the ball
    rolling. Charlie and a small group of faculty then worked together to advocate
    for the program and to keep pushing the project along. Throughout the process,
    different individuals and groups'
  - '[PAGE 123]


    enabled others through advocacy, reconciliation, and negotiation.


    For example, a veteran faculty member came forward at a key point to lend support.
    By emphasizing the group’s shared beliefs and couching them in moral terms, she
    was able to reconcile competing factions. Charlie explained that her efforts were
    “crucial to connecting the university’s mission and values to the doctoral program.”
    By helping faculty acknowledge these shared beliefs, Charlie’s colleagues were
    able to make the time to develop a curriculum, establish learning objectives and
    research standards, and continue their commitment to these tasks amid other demands.


    Whether it’s launching a doctoral program, designing a new campus facility, changing
    personnel benefits, bringing updated software online, shifting financial record-keeping
    systems, instituting new safety procedures for science labs, or expanding public
    safety protocols, for people to work together as a team you have to ensure that
    they have a specific reason for being together and cooperating with one another.
    Make sure the people you are working with understand the goal they are working
    toward, feel a shared stake in the outcome, have an appreciation for the talents
    and resources individuals bring to the endeavor, and have the latitude necessary
    to be both imaginative and strategic. A focus on a collective purpose binds people
    in cooperative efforts. Shared values and visions serve this function for the
    long term, and group goals provide this same common focus for the shorter term.
    Only through shared goals and recognized interdependence in one another’s success
    can people diligently strive to devise integrative solutions.



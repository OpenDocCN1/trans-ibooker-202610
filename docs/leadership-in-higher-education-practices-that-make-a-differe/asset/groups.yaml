    When anyone asks me that question, I tell them I have the secret to success in
    life. The secret to success is to stay in love. Staying in love gives you the
    fire to ignite other people, to see inside other people, to have a greater desire
    to get things done than other people. A person who is not in love doesn’t really
    feel the kind of excitement that helps them to get ahead and to lead others and
    to achieve. I don’t know any other fire, any other thing in life that is more
    exhilarating and is more positive a feeling than love is.


    “Staying in love” isn’t the answer we expected to get—at least not when we *began*
    studying leadership. But after nearly 40 years of being leaders, researching leadership,
    and developing leaders, we continue to be struck by how many people use the word
    *love* freely when talking about their own motivations to lead and in explaining
    why they endured the hardships, made the personal sacrifices, and accomplished
    what they did.


    Of all the things that sustain a leader over time, love is the most lasting. It’s
    hard to imagine leaders on any college campus getting up day after day and putting
    in the long hours and hard work it takes to make a difference without having their
    hearts in it. This may just be the best-kept secret of successful leaders: *If
    you love what you’re doing, you will never have to work.*


    So, stay in love with leading. Stay in love with your colleagues who do the work.
    Stay in love with the students, faculty, staff, and alumni who are transformed
    because of their time at your institution. Stay in love with the scholarship,
    ideas, programs, and applications that emerge through and because of what you
    and so many others contribute.


    Leadership is *not* an affair of the head. Leadership is, after all, an affair
    of the heart.



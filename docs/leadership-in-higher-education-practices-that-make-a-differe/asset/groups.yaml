    laugh, see the humor in a situation, and thank people for doing a good job.” Unofficially,
    Charlie is referred to as HR’s CEO—chief encouragement officer.


    When he took the helm, the HR workgroup was demoralized and fearful. The team
    was used to an environment in which there was little recognition of success and
    severe consequences for failure. His staff told us, “The HR team needed someone
    to appreciate our individual and collective efforts. Charlie focused on encouraging
    everyone to be a contributing member of the team and to work toward a collective
    commitment to deeply held values and service to the campus community.”


    Charlie regularly encourages members of the department by letting them know that
    he believes in them and has confidence that they will be successful. He also does
    crazy, spur-of-the-moment things to celebrate the team’s accomplishments, like
    going to the grocery store and buying boxes of popsicles and ice cream bars. He’ll
    return to the office with his booty of icy goodness, empty the mail cart, load
    it up with treats, and then play ice-cream truck music on his smart-phone while
    cruising through the office, giving everyone their pick of frozen delight.


    Charlie sets up celebratory outings for the team, such as an “HR at the movies”
    night. When a recent blockbuster was released, he bought 40 tickets so that each
    HR staff member could ask a family member or friend to join them for the film
    and then dinner afterward to discuss what they saw and how it translated back
    to their work. He organizes a Friday-night trip to the local Minor League Baseball
    game for HR staff and their families. “It’s a fun and relaxing way to end the
    week and spend time getting to know more about our fellow team members as well
    as their families,” one of his staff members explained.'

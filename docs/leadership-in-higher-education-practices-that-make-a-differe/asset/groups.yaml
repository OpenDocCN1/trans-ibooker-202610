    这个前景让她感到兴奋，她能够相当详细地想象这个项目将如何运作以及谁可能会参与其中。正如她告诉我们的：“我能看到学生在课堂上坐着，听着一位教员与他们谈论伦理困境和滑坡。我能看到学生小组讨论不同的文化背景如何影响我们的领导行为。我能看到学生在他们的组织中承担更积极的角色。我能看到学生在项目结束时在我们的招待会上领到证书时会多么兴奋。”从她最初的直觉——以及大量的辛勤工作——中诞生了一个成功的试点项目，50名学生探索了他们的领导风格并培养了领导技能。如今，
    many 年后，这个项目仍然让 Jo-Anne 感到微笑——它仍在校园中继续，激励着不断增长的学生领导群体。


    像 Jo-Anne 一样，我们采访的许多人提到，分析他们的个人最佳领导经历这一练习对他们来说是启发性的：通过突出过去的关键教训，他们能够为尚未探索的领导之路生成富有洞察力的路线图。从直接经验和主动探索中获得的知识，一旦储存在潜意识中，就成为领导者直觉、洞察力和愿景的基础。


    展望未来是一个始于灵感、一种感觉或一种认为某事值得去做的信念的过程。你对未来的愿景可能很模糊，但至少你专注于一个有意义的主题。你相信现状可以比今天更好。你顺从自己的直觉行事，愿景变得稍微清晰一些。你做一些让你前进的事情，愿景变得更加清晰。你关注它，体验它，沉浸其中。你让事情开始运转，随着时间的推移，你在梦想中看到更多细节。这是一个迭代的过程，最终会产生一些你和他人能够表述的东西。


    ## 让他人加入


    愿景关乎希望、梦想和抱负。它们是对实现某项雄心壮志的强烈渴望的宣言。它们是乐观主义的表达。你能想象一位领导者通过说“我希望你加入我一起做平凡的事”来招募他人加入事业吗？不太可能。愿景激励人们想象令人兴奋的可能性、突破性项目和革命性的社会变革。然而，这样的宏伟抱负无法实现，除非它们被你的利益相关者——员工、教员、行政人员、学生、校友、捐赠者或其他你希望争取的人——所共享。这正是
    Derek McCormack 副校长告诉我们的，当他被要求发展机构时，他意识到他的工作“不是自己寻找愿景，而是创造一个共同愿景，这样我们才能一起踏上同一旅程。”


    领导者拥有愿景是不够的；领导者的部门成员也必须理解、接受并致力于它。当其他人分享他们的个人最佳领导经历时，他们的评论与 Derek 的类似。人们经常谈到需要让他人认同愿景。他们解释了他们如何传达目的并为统一方向建立支持。他们知道每个人都必须致力于共同目的。他们理解为了让每个人踏上同一旅程，他们必须能够传达为什么他人应该加入、这对他们意味着什么以及这将如何使他们受益。虽然你可能能够看到他人利益如何得到满足，但如果他们看不到自己的需求与更大愿景的联系，他们就不愿意登船。但一旦他们加入，部门和机构改变并实现其潜力的能力就会飞跃。


    让他人加入意味着你需要深度倾听。从与利益相关者的对话中，你需要找到一个将潜在不同的动机和抱负统一起来的共同目的。你需要能够激发人们对独特性感到自豪。你需要描绘出让愿景栩栩如生的画面，并充满信念和热情地谈论令人兴奋的可能性。


    ### 深度倾听


    确定你的利益相关者是谁并发现他们的共同抱负，是领导者在争取他人时必须采取的必要步骤。无论个人愿景者的梦想多么宏大，如果他人在其中看不到实现自身希望和欲望的可能性，他们就不会跟随。你必须向他人展示他们自己也将从长期的未来愿景中受益，以及他们的具体需求如何得到满足。


    这需要专注的倾听，以便你能感受到他人内在的目的。通过了解你的利益相关者、倾听他们并征求他们的建议，你能更好地表达他们的关切。你可以自信地站在他人面前说：“这是我听到的你们想要为自己实现的东西。这就是你们通过加入共同事业而自身需求和利益将如何得到满足。”从某种意义上说，领导者举起一面镜子，将他人所说最渴望的东西反射回去。当人们看到那面反射时，他们认出了自己并能够拥抱那个形象。


    认识到领导是一种关系，使倾听处于其应有的位置。据说，没有伟大的想法会通过张开的嘴进入大脑。杰出的领导者知道他们不必自己拥有所有的想法或所有的答案。愿景的起源并非来自凝视水晶球；如果你能够倾听，就会在你周围找到线索，因为它们会从学生、同事、校友、家长和捐赠者那里传递过来。没有缺乏改进机构各部分的方法和机会。


    为了准确而忠实地听到利益相关者想要什么——他们希望你理解、欣赏并纳入愿景的内容——需要定期暂停常规活动，花时间单纯地倾听他人。通过访问他们的聚集地来了解你的利益相关者；去体育赛事、音乐会、食堂、图书馆、讲座和课堂。走出你的办公室，漫步到教员和员工同事的办公室。与利益相关者群体一起喝咖啡、吃早餐、午餐、下午茶，或进行一些非正式的时间。了解他们正在发生什么以及他们希望从与你和你的项目的关系中实现什么。


    ### 发现共同目的


    你曾问过部门或项目中的人们为什么留下吗？更可能的是，尤其是如果你负责人员配置，你会担心人员流动、留任率以及人们为什么离开。相反，思考大多数留下的人，并问他们为什么坚持下来。你为什么留下？人们关于为什么不离开或不寻找另一个职位的最重要原因，是他们发现自己正在做的工作具有挑战性、有意义且有目的。


    学术机构在教员和员工方面都比许多其他类型的组织具有优势，因为我们的同事通常从对学习和个人及职业发展的共同承诺开始。对他人抱负的敏感倾听揭示了将校园所有人联系起来的共同价值观。人们希望有机会接受考验，有机会靠自己成功，参与社会实验，做得好，做得好，并改变现状。⁴
    这些难道不是大多数领导机会的本质吗？


    尽管经济起伏，人们对工作场所的期望并没有发生很大变化。无论职业、行业或地点如何，人们都将“有趣的工作”排在“高收入”之上。领导质量（“为一位有愿景和价值观的领导者工作”）甚至比金钱更具激励性。你会惊讶吗？在工作生活中最常提到的成功衡量标准是“为做好工作而获得的个人满足感”？人们提到这一点是“取得进步”或“过上好生活”的三到四倍。⁵


    大学很少是人们为了最大化财务收益而去工作的地方。校园领导者有相当大的机会去吸引远不止物质奖励的东西。伟大的领导者唤起意义。自由、自我实现、学习、社区、卓越、正义、服务和社会责任的价值观真正吸引人们投身于共同事业。共同愿景是“人们心中的力量，令人印象深刻的力量”。⁶



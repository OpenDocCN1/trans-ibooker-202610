    ## 积极沟通并富有表现力


    为了培养团队精神、培养乐观主义、促进韧性并重燃信心，领导者学会看到光明面。他们保持希望。他们增强其追随者对今天的挣扎将带来更光明明天的信念。


    人们想要充满热情、步伐轻快、态度积极的领导者，因为这传达了他们将参与一段振奋人心的旅程。人们会追随积极进取的人，而不是那些愤世嫉俗者，他们会给出十个原因说明某事为何做不到，或让他人对自己或他们正在做的事情感觉不好。唱反调的人只会阻碍前进的步伐；他们不会开启前进的步伐。


    研究神经网络的研究人员已记录到，当人们感到被拒绝或被排除在外时，大脑会激活一个用于记录身体疼痛的区域。⁸ 人们实际上比鼓励的话语更频繁、更详细、更强烈地记住消极评论。当负面言论成为一种执念时，人们的大脑会失去思维效率。这更说明领导者需要保持积极。积极的生活态度拓宽了人们对未来可能性的概念，而这些令人兴奋的选择会相互累积。⁹
    在肯定的环境中，人们变得更具创新性并看到更多选择。那些拥有更多积极性的人也


    问候。¹¹ 相应地，*魅力*可以更好地被理解为*表现力*。


    人们常常低估自己表现力的能力。我们发现，人们普遍认为自己缺乏感染力的自我认知，与他们谈论个人最佳领导经历或理想未来时——甚至是即将到来的假期和度假时的表现形成鲜明对比。当谈论希望、梦想和成功时，人们几乎总是富有情感表现力。谈论对未来的深切渴望时，表现力是自然而然的：人们会向前倾身、挥动手臂、眼睛发亮、声音充满情感、并微笑。他们充满热情、表达清晰、乐观向上、令人振奋。情感驱动着表现力。¹²
    简而言之，人们*就是*鼓舞人心的！所需要的只是愿意与他人分享你的热情，而不是将其锁起来并认为表现力 somehow “不专业”。在校园中产生影响的领导者对自己所做的事情充满热情，并发自内心地领导。


    ## 反思问题：*激励*

    ### 共同愿景


    愿景为人类能量提供了焦点。这使与部门、项目或机构相连的每个人都能更清晰地看到前方以及当每个人都贡献了自己的一份力量时未来会是什么样子。考虑到这一点，他们可以高效而自信地为整体做出贡献。


    但仅由领导者看到的愿景不足以产生有组织的行动。你必须让他人看到令人兴奋的可能性。你通过传达他人的希望和梦想来赋予愿景生命，使他们清楚地了解他们的价值观和利益如何通过对未来的特定长期愿景而得到满足。谈谈你自己的信念和你组织的独特性，并让他人为成为特别事物的一部分而感到自豪。保持积极向上、富有表现力，并以你的能量、乐观和希望的展望吸引追随者。



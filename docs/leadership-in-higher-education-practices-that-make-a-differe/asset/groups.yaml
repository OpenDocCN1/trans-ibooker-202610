    “我的工作团队有强烈的团队精神。”


    “我很自豪地告诉别人我为这个组织工作。”


    “我致力于这个组织的成功。”


    “如果工作需要，我会更努力地工作更长时间。”


    “我在工作中效率很高。”


    “我清楚工作中对我的期望是什么。”


    “我觉得我的组织重视我的工作。”


    “我能够有效地满足工作的要求。”


    “在我的工作场所，人们似乎信任管理层。”


    “我觉得我在这个组织中有所作为。”



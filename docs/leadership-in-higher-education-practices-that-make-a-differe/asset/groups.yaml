    takes, the one who gives will feel taken advantage of, and the one who takes will
    feel superior. In that climate, cooperation is virtually impossible. To forge
    cooperative relationships, you must establish norms of reciprocity among all parties
    and within teams.


    The power of reciprocity is dramatically demonstrated in a well-known study generally
    referred to as the “prisoner’s dilemma.” The dilemma is that two parties (individuals
    or groups) are confronted with a series of situations in which they must decide
    whether to cooperate. They don’t know in advance how the other party will behave.
    There are two basic strategies: cooperate (don’t say anything) or compete (blame
    the other party); and there are four possible outcomes based on the choices players
    make: win-lose, lose-win, lose-lose, and win-win.


    The maximum individual payoff comes when one player selects a non-cooperative
    strategy and the other player chooses to cooperate in good faith. In this “I win
    but you lose” approach, one party gains at the other’s expense. Although this
    might seem to be the most successful strategy—at least for the non-cooperative
    player—it rarely proves successful in the long run mainly because the other player
    won’t continue to cooperate in the face of the first player’s non-cooperative
    strategy. This typically leads to both parties deciding not to cooperate and attempting
    to maximize their respective individual payoffs. In the end both lose. When both
    parties choose to cooperate, however, both win, though in the short run the personal
    payoff for a cooperative move (win-win) is less than what it might be for a competitive
    one (win-lose).


    Over the years researchers have found, amazingly enough, that when faced with
    such dilemmas the most successful strategy in the long run is quite simple: cooperate
    on the first move and then do whatever the other player did on the previous move.'

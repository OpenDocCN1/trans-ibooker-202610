    而且教职员工都曾有时建议该节目是关于如何在任何组织环境中取得成功的案例研究。


    对我们来说，这一结论令人不安，我们强烈反对任何现实生活中的应用。引人入胜与否，《幸存者》以及类似的节目传授的都是在“现实世界”中生存的完全错误的经验。在现实世界中，更不用说在高等教育中，如果人们像电视上的这些选手那样行事，他们都会死去。正如著名的人类学家
    Lionel Tiger 所说，“竞赛格式残酷地扭曲了本应涉及持续合作的完全不同的结果。岛上的行为……反映了奖品的性质，以及赢得它所要求的东西。人类生存的目标一直是为另一天而坚持下去，并且是在群体中。”³


    《幸存者》所缺少的合作与协作的最重要方面之一是相互依存感，即每个人都知道自己除非让每个人都成功——或者至少除非他们协调自己的努力——否则就无法成功。如果没有

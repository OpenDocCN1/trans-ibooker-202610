    as the dean of student life at a small private non-secular university, but she
    put it to good use when she found herself as the link between the administration
    and a student group protesting the university’s acceptance of a major donation
    from a government defense contractor. Jeanne needed to find a way to keep the
    protest from escalating, to ensure everyone’s safety, to safeguard the health
    of the students who decided to fast as part of their protest, and to formulate
    a win-win outcome.


    Jeanne aimed to cultivate a calm, collaborative setting rather than a confrontational
    one. This she managed step by step, gaining agreements and trust from multiple
    parties along the way. She made sure that a neutral location was used for meetings,
    emphasizing the importance of face-to-face communication and careful listening.
    She began each conversation with the students by asking about their health and'

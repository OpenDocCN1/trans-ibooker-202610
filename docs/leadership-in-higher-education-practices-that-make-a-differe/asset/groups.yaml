    This incremental change process that leaders like Richard use has been called
    “small wins,” as each success enables leaders to build people’s commitment to
    a course of action.¹⁰ The alumni or development office does much the same thing
    when they ask graduating students and recent alumni for a small contribution.
    They know that it’s easier to go back and request more in the future from those
    who’ve made an initial pledge than to return to someone who’s never made a contribution.
    Leaders start with actions that are within their control, that are tangible, that
    are doable, and that can get the ball rolling.



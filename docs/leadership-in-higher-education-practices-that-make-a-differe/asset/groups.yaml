    context, something that individuals believe they can work on together and be recognized
    for accomplishing. They help people keep their eyes on the target, motivating
    them to put the phone in do-not-disturb mode, shut out the noise, and focus their
    time and efforts. Without goals, people won’t know what to do with their own capabilities,
    as expressed in the old refrain *If you don’t know where you are going, any road
    will get you there.*


    Standards and goals, however, are not entirely sufficient. People also need to
    know if they’re making progress toward a goal or just marking time. People’s motivation
    to increase their productivity on a task goes up *only* when they have a challenging
    goal *and* receive feedback on their progress.³ Goals without feedback, and feedback
    without goals, have little effect on motivation; however, together they keep people
    on track. The equivalent in academic advising would be working with a student
    who doesn’t care about improving his performance (grades) or in the classroom
    with an instructor who does not provide her students with feedback on their assignments.


    With clear goals and detailed feedback, people can become self-correcting, as
    well as more easily understand their place in the bigger picture. With feedback
    they can determine whether they are on the right track going forward and what
    help they need to be most productive. Many staff and faculty leaders echoed to
    us the sentiment that *You might not always like the feedback, but being aware
    of your shortcomings is essential for improving.* From a credibility perspective,
    how can you know if you are doing what you say you will do if you never get any
    feedback about your behavior? Feedback offers you a perspective about yourself
    and how you are doing that only others can provide. It’s the avenue for understanding
    whether you are properly executing and advancing on your goal.


    In one study of the effects of feedback on self-confidence, graduate students
    were praised, criticized, or received no'

    当 KIM LOEB 成为专业、应用和继续教育（PACE）执行主任时，该项目规模很小且亏损。她立即着手重组 PACE，通过彻底改革数十年未更新的项目和课程，重新聚焦学生服务并引入专业发展资源，以确保她的团队充分发挥能力。五年内，Kim
    的项目提供了超过 600 个全日制和兼职项目、课程和研讨会。它招收了来自 30 多个不同国家的学生，并产生了超过 100 万美元的收入。“人们说你的大学派你去国际招生旅行真是太好了，”Kim
    告诉我们。“但不；他们没有派我。我们创造了这些机会。”



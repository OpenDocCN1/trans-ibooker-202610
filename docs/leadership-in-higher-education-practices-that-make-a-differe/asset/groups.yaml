    ## Foster Personal Responsibility and Accountability


    Accountability is a critical element in every collaborative effort. When people
    take personal responsibility and are held accountable for their actions, their
    colleagues will be considerably more inclined to want to work with them and be
    generally more cooperative. Everyone has to do their part for a group to function
    effectively. Personal accountability is enhanced when you structure a situation
    so that people have to work collaboratively with one another. Knowing that your
    peers are expecting you to be prepared and to do your job is a powerful force
    in motivating people to do well. The feeling of not wanting to let the rest of
    the group down strengthens people’s resolve to do their best. Additionally, the
    more people believe that everyone else is competent and taking responsibility
    for their own part of the job, the more trusting and cooperative they’re going
    to be. It’s also true that people will be more committed to doing their part when
    they are confident that others will be doing theirs.


    When you explicitly give people the freedom to make choices, you are implicitly
    increasing the degree of personal responsibility they must necessarily accept.
    The interconnectedness between choice and accountability takes on increasing importance
    in virtually linked global workplaces. As Holly’s Personal-Best Leadership Experience
    revealed, to foster accountability she needed to delegate authority and give others
    a chance to take ownership. She realized that by trusting others with responsibility,
    she was letting them know that she believed in them and had confidence in their
    abilities and judgment. Given the level of trust Holly demonstrated in them, they
    in turn felt greater motivation to follow through on their commitments. When you
    allow others to take on more responsibility, you also benefit by being freed up
    to take on new duties and learning opportunities yourself.


    Some people are reluctant to share power because they contend that cooperative
    endeavors minimize individual accountability. They think that if people are encouraged
    to work collectively, somehow they’ll take less responsibility for their own actions
    than if they are encouraged to compete or to do things on their own. Some people,
    it’s true, will become social loafers, slacking off while others do their jobs
    for them. But that doesn’t last long because their team members will quickly tire
    of carrying the extra load. Either the shirker steps up to the responsibility
    or the team wants that person out. Part of your job is to set up conditions that
    enable each and every team member to feel a sense of ownership for a successful
    outcome.


    ## QUESTIONS FOR REFLECTION: ENABLE OTHERS TO ACT



    constituents to each other and to those on the outside who are central to key
    networks. It will make them more effective, more engaged in critical tasks, and
    more satisfied with their lives and work.


    The most well-connected individuals are typically those who have been most involved
    in many campus activities. They haven’t been typecast in one discipline, pedagogy,
    function, administrative body, or community. They’ve moved in and out of a range
    of assignments, committees, and experiences. They know people from a wide range
    of departments and programs, and they have made connections across faculty, staff,
    and even student, alumni, and community domains. They’ve honed their interpersonal
    skills and knowledge so that they’re credible to their constituents, and they’ve
    not dug themselves into a rut. Most college campuses are organized into discrete
    units, promoting specialization, but when it comes to leadership, you have to
    draw on your connections. If those connections are in only your specialty, it’s
    likely that you’ll be less influential than you could be if your connections cross
    a lot of boundaries. When it comes to social connections, there’s a real long-term
    payoff in mining deep and wide.


    For example, when he was dean, Douglas Farenick undertook a significant revision
    of the science school’s document that described the assignment of faculty duties,
    performance standards, allocation of sabbaticals, and the like. He was well aware
    that any changes would require buy-in by a majority of the faculty and could not
    be imposed from the top down. The faculty would need to trust and endorse the
    dean’s philosophy behind any changes. Doug used the social capital he had developed,
    asking six faculty members whom he had productive relationships with, and who
    represented both the discipline and the gender diversity of the institution, to
    consider the possible changes, draft the proposed revisions, and select one of
    their members to present the rationale to the faculty as a whole.'
  - '[PAGE 129]


    Consequently, the policy changes came from respected faculty members who had deeper
    and more personal ties with the faculty as a whole than the dean did, and produced
    greater acceptance than any hierarchical decision would have.


    In an era that is becoming more and more dependent on virtual connections, there’s
    a temptation to believe that such connections automatically lead to better relationships
    and greater trust. The hitch is, there really is no such thing as *virtual* trust.⁸
    Virtual trust, like virtual reality, is still one step removed from the real thing.
    People are social animals; it is our nature to want to interact face-to-face.
    If this weren’t true, you might as well abandon having faculty in the classroom
    altogether and let wireless personal digital assistants do all the teaching. Bits
    and bytes make for a fragile social foundation. This may sound heretical in a
    world driving itself more and more to depend on electronic connections, but you
    have to figure out how to combine and balance the benefits of technology with
    the social imperative of human contact. Data and information may be virtually
    shared, but ensuring understanding, sensitivity, knowledge, and action online
    or at a distance are kinks still to be worked out.


    # GENERATE POWER ALL AROUND


    Exemplary leaders make those around them feel strong and capable. They make it
    possible for people to take responsibility for success—and ownership of it—by
    enhancing their competence and self-confidence. Exemplary leaders listen to others’
    ideas and act on them, involve others in important decisions, and acknowledge
    and give credit for others’ contributions. Long before *empowerment* was written
    in to the popular vernacular, exemplary leaders understood how vital it was that
    their constituents felt proficient and effective.'
  - '[PAGE 130]


    Feeling powerful—literally, feeling *able*—comes from a deep sense of being in
    control of life. People everywhere share this inclination, and when they feel
    able to determine their own destiny and believe that they can mobilize the resources
    and support necessary to complete a task, they persist in their efforts to achieve.
    But when people feel that they are controlled by others and believe that they
    are unsupported or lack the necessary resources, they show little to no commitment
    to excel (although they may still have to comply). Leadership behaviors that increase
    another’s sense of self-confidence, self-determination, and personal effectiveness
    make that individual more powerful and greatly enhance the possibility of their
    achieving success. Gallup surveys involving millions of people around the world
    decidedly show that the extent to which people feel powerful and engaged in their
    work is directly linked to positive organizational outcomes, such as productivity,
    commitment, and retention.[^9]


    Creating a climate on campus where people are involved and feel important is at
    the heart of strengthening others. Correspondingly, you have to provide them with
    the latitude to make decisions based on what they believe should be done. You
    must provide an environment both that builds their ability to perform a task or
    complete an assignment and that promotes a sense of self-confidence in their judgment.
    People must experience a sense of personal accountability so that they can own
    their achievements. Exemplary leaders help others learn new skills and develop
    their existing talents, as well as provide the institutional supports required
    for ongoing growth and change. In the final analysis, you are turning your constituents,
    the people you work with, into leaders.



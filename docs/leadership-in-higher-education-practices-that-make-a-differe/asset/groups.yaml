    ## QUESTIONS FOR REFLECTION: ENCOURAGE THE HEART


    Leaders expect to do their best and expect the best of their constituents. With
    clear standards they help people focus on what needs to be done. By paying attention,
    offering encouragement, personalizing appreciation, and maintaining a positive
    outlook, leaders stimulate, rekindle, and focus people’s energies and drive.


    You need to recognize individual contributions to vision and values and be creative
    in demonstrating appreciation. Celebrating values and victories together reinforces
    the fact that extraordinary performance is the result of many people’s efforts.
    By celebrating people’s accomplishments visibly, and in group settings, you nourish
    and sustain a team spirit. Telling stories about individuals who have made exceptional
    efforts and achieved phenomenal successes provides role models for others to emulate.
    Social interaction increases people’s commitments to the standards of the group
    and has a profound effect on people’s well-being. By getting personally involved
    in recognition and celebrations, you set the example and foster a culture of support
    and community.


    In developing your competence in the leadership practice of Encourage the Heart,
    spend some time reflecting on the following questions. After you’ve given them
    sufficient consideration, let others know what you are thinking and willing to
    do.


    - How can you be even more conscientious and thoughtful about saying “thank you”
    to people who are making a difference, even if the outcome is part of their job
    description?

    - In recognizing both individual and group accomplishments, how can you more directly
    link the results achieved to shared values and purpose?

    - In what creative ways can you get people together to celebrate the accomplishments
    of the unit, marking the progress that’s been made?

    - How can you best remind people that achievements are the result of the entire
    group’s efforts and not just the work of a single individual? What creative strategies
    can you develop for ensuring that people feel they are “all for one and one for
    all”?



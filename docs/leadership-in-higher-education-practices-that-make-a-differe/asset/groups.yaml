  mdcn: '


    要让人们加入到一个愿景中，领导者必须了解自己的追随者并说他们的语言。与我们采访的其他人类似，Kelly 知道人们必须相信领导者理解他们的需求并将他们的利益放在心上，他们才会加入进来。领导者为他人的希望和梦想注入生命力，并使他们能够看到令人兴奋的可能性。领导者通过向追随者展示梦想是为了共同利益，从而锻造出目标的统一。领导者通过对团队引人注目的愿景表达热情，以生动的语言和富有表现力的风格传达他们的热情，从而在他人心中点燃激情。


    ## 挑战现状


    领导者是先锋——愿意踏入未知的人。他们寻找创新、成长和改进的机会。我们收集的每一例个人最佳领导案例都涉及对现状的某种改变。没有一个人声称自己是通过保持不变——做一直以来或已经做过的事情——来实现个人最佳的。所有领导者都挑战现状。


    但领导者并不是新课程、新项目、新服务或新流程的唯一创造者或发起者。事实上，他们更可能不是：创新更多来自倾听而非讲述，来自提问和倾听他人在想什么、想说什么。当挑战现状时，领导者的主要贡献是识别好主意、支持这些想法，以及愿意挑战体制以使新产品、新流程、新服务和新系统得以采纳。也许更准确地说，领导者是创新的*早期采用者*。


    J. Patrick Murphy，CM，并不是凭空想象出公共服务研究生项目的想法。他倾听了大学校长所宣扬的抱负，以及许多学生希望将课堂上学到的经验更直接地应用于社区的渴望。Pat
    还听到几位同事表达了参与一个连接私营和公共部门的项目的兴趣，以及似乎有机会将营利部门的最佳实践应用于社区组织的想法。


    Pat 的院长最初并不支持，理由是财务和战略上的限制。Pat 并没有轻易气馁，他在校园的其他部门推广该提案（在他所在的相对保守的大学里，这被视为一种治理禁忌），获得了对跨学科方法（不仅在课程上，而且在人员配备和资金上）的兴趣和支持。他甚至接触了几位董事会成员，重新与校长沟通，并获得了足够的支持，最终该项目成为学院规模最大的研究生项目之一。


    该项目的资金在起步时很紧张，就像在大学里通常一样，因此 Pat 通过几种新颖的举措筹集了资金。例如，Pat 和他的同事创办了一家小型咨询和行政培训公司，并启动了几个筹款项目，包括在爱尔兰学习的学生奖学金筹款的“酒吧之夜”。其中许多努力
    Pat 最初不得不暗中进行，以免引起太多关注；有时，他会说，“先斩后奏”有时是必要的，以便了解哪些想法是可行或不可行的。


    领导者深知创新和变革涉及试验和风险。你可以通过渐进的步骤和小胜利来应对这些潜在的风险和失败。学习也为进步打开了大门，杰出的领导者会在事情不如预期时特意问：“我们能学到什么？”


    学习带来小胜利，这些胜利层层累积，建立起人们能够应对最重大挑战的信心。如此一来，领导者加强了对长期未来的承诺。


    ## 使他人能够行动


    宏伟的梦想不会通过一个人的行动成为重大的现实。领导力是团队的努力，为了让组织中发生非凡的事情，杰出的领导者使他人能够行动。他们培养协作，发展关系并建立信任。领导者调动所有必须使项目成功的人——这正是
    Charlie Slater 在讲述他启动新博士项目的个人最佳领导经历时得出的结论。当被问及谁是开发该项目的领导者时，他迅速回答说：“不是单一的领导者，而是许多领导者。在过程的不同阶段，每个人都很关键。如果没有这些人的领导，该项目就不会出现。”


    领导者使他们周围的人能够成就伟大的事情。他们认识到，被期望在最具灵感的水平上产出的人必须感受到个人权力和主人翁意识。Charlie 谈到大学校长虽然赞成这个想法，但清楚地知道这样的倡议不能通过行政命令成功启动，所以他将自己的祝福传给了院长，院长又因他的背景以及与教师的积极工作关系而请
    Charlie 接受这一领导挑战。Charlie 知道这样的项目不能仅靠一个倡导者来开发和维持，他与学校内众多的教师同事一起合作，使这个新项目得以实现。


    这让 Charlie 深刻认识到，正如其他反思个人最佳领导经历的人一样，承诺与支持型领导比前几代人的命令与控制技术更重要。领导者的工作是让人们感到强大、有能力且有承诺。领导者不是囤积自己拥有的权力，而是将其分出去。大学校长不可能独自使该项目成为现实，事实上，没有任何个人或团体能够在没有他人合作的情况下成功倡导该项目。共同工作，杰出的领导者增强了每个人实现他们设想的可能性和兑现承诺的能力。


    在我们分析的案例中，像 Charlie 这样的领导者自豪地讨论了团队合作、协作、信任和赋权作为他们努力的必备要素。如果领导者让人们感到软弱、依赖或疏离，人们不会待很久也不会发挥最佳水平。但当领导者让人们感到强大和有能力，提高他们相信自己可以做到比以往认为可能的更多的信念时，人们会竭尽全力。在我们的研究中，人们表示在与最好的领导者合作时，他们投入到事业中的精力超过了
    100%，因为那位领导者能够激发他们发挥出他们自己认为不可能的能力。当领导力建立在信任和信心的关系之上时，人们会冒险、做出改变，并让组织和运动保持活力。


    ## 鼓舞人心


    任何事业的攀登都艰难而陡峭，人们很容易变得筋疲力尽、沮丧和幻灭。领导者鼓舞其追随者的心，使他们坚持下去，即使他们可能想放弃。真诚的关怀行为，无论是戏剧性的姿态还是简单的行动——例如，给生病的同事送食物、探望住院的人，或寄出一封手写的感谢信——都能振奋精神，激励人们向前。Jennifer
    Dirking，她所在社区学院基金会的副主任说，她一直在寻找培养“人们感到被关心和真正被感激”的氛围的方法。


    Barry Posner 学校每年都会颁发“最杰出教师”奖。在那些日子里他是教师，他说他“从来不明白为什么只有一个奖项，有这么多学科，而且鉴于每个学科不同的标准，教师和院长办公室如何决定‘最杰出’的含义。”因此，当他成为院长时，Barry
    说，


    > 我决心我们要改变制度，并在表彰我们*众多*教师同事的卓越方面做更多工作。与我们的系主任委员会合作，我们制定了一套适用于所有学科和所有职级的具体成就标准，从不满意到
    exemplary。任何在教学、学术和服务方面都能达到 exemplary 的教师，在我们任何人的眼中都一定是“非凡的”——而这就是我们称该奖项的名字。我们都可以为学校里任何非凡的人感到自豪。


    第一年，颁发了六个非凡教师奖。五年后，颁发了 13 个奖项。Barry 回忆道：“我认为标准没有改变，但我们教师的行为——因此表现——已经提升到我们设定的理想水平。这次对奖项标准的改变，我们在消除我们之间‘谁是最好的’的竞争方面迈出了巨大一步，而更集体地关注每个人需要做什么才能发挥最佳水平。”


    领导者的工作之一是表达对人们贡献的感激，并创造一种庆祝的文化。多年来，我们见证了成千上万的个人表彰和集体庆祝的例子，从手写的感谢信到游行乐队和“这是你的生活”仪式。



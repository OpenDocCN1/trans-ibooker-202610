    feedback on their performance in a simulation of creative problem-solving. They
    had been told that their efforts would be compared with how well hundreds of others
    had done on the same task. Those who heard nothing about how well they did suffered
    as great a blow to their self-confidence as those who were criticized.⁴ People
    hunger for feedback. They prefer to know how they are doing. No news has the same
    impact as bad news. This is one of the reasons why efforts to abolish grades in
    schools and colleges almost always fail.


    # Expect the Best


    Exemplary leaders have high expectations, both of themselves and of the people
    they work with. These expectations are powerful because they are the frames into
    which people fit reality. People are much more likely to see what they expect
    to see, even when their perspectives differ from what may actually be occurring.
    There is ample research evidence that people act in ways that are consistent with
    the expectations that other people have of them. If you expect others to fail,
    they probably will. If you expect them to succeed, they probably will.⁵ The expectations
    you hold as a leader are the frame into which people fit their own realities.


    Your expectations shape how you behave toward others. The high expectations that
    leaders have of others are based in large part on their expectations of themselves.
    This is one reason why it is so critical for leaders to Model the Way. Your own
    record of achievement and dedication, and your daily demonstrations of what and
    how things need to be accomplished, give credibility to the expectations you have
    of others.


    Exemplary leaders treat people in a way that bolsters their self-confidence, making
    it possible for them to achieve more than they may have initially believed possible
    of themselves. Feeling appreciated by others increases a person’s sense of self-worth,'

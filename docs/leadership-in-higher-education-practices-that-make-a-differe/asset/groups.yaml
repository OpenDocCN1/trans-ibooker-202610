    \n第1章向你介绍我们对领导力的观点，并简要描述我们在研究中揭示的典范领导的五项实践。在其中我们还描述了人们最希望在领导者身上看到的特征。我们提出了所有伟大领导力建立的基础。我们从内部讲述领导故事并向外扩展，首先将领导力描述为探索的个人旅程，然后是动员他人。我们的研究表明，领导力不是少数魅力男性和女性的私人保留。它是人们在发挥自身和他人最佳潜能时所使用的过程。释放每个人内心的领导者，非凡的事情就会发生。\n\

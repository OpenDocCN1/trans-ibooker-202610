    To us this conclusion is troubling, and we take strong exception to any real-life
    application. Riveting or not, *Survivor* and shows like it teach all the wrong
    lessons about how to survive in the “real world.” In the real world, let alone
    in higher education, if people were to behave as these players on television did,
    they’d all be dead. As the acclaimed anthropologist Lionel Tiger put it, “The
    contest format distorted savagely what would have otherwise been a very different
    outcome involving ongoing cooperation. The behavior on the island… is a reflection
    of the nature of the prize, and what winning it demanded. The goal of human survival
    has always been to endure for another day, and in the group.”³


    One of the most significant aspects of cooperation and collaboration missing from
    *Survivor* is a sense of interdependence, a condition under which everyone knows
    that they cannot succeed unless everyone else succeeds—or at least that they can’t
    succeed unless they coordinate their efforts. If there is no sense of *We are
    all in this together*, that the success of one depends on the success of the others,
    it’s virtually impossible to set the conditions for positive teamwork.


    The motivation for working diligently on your own job, keeping in mind the overall
    common objective, is reinforced when the end result is what gets rewarded and
    not the individual efforts. To make extraordinary things happen, people have to
    rely on one another. Leaders take an active role in creating both a positive context
    and a structure for cooperation and collaboration. The leaders who were reported
    as most often “developing cooperative relationships among the people they work
    with” were viewed by their direct reports, as illustrated in figure 5.1, as instilling
    the strongest feelings of team spirit.'

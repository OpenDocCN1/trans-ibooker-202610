- pgno: 85
  md: 'impressions, not in numbers. We recall images of reality, not abstractions
    from it.


    When you invent the future, you need to get a mental picture of what things will
    be like long before you begin the journey. Images are your windows on the world
    of tomorrow. When talking about taking people (your department or program) to
    places they have never been before, you start by imagining what this would look
    like. For example, in spreading the word across campus about the new Student Leadership
    Institute, Jo-Anne helped others imagine it. She emphasized “that the program
    had not been done before.” She told students being recruited for the pilot project:
    “This is new. It is going to be great—and you are part of making it great. Imagine
    being able to learn how to build a team within your club, deal with someone who
    is sloughing off on their job, or run an effective meeting.” Jo-Anne conveyed
    vivid images of the concrete skills that students would gain by being involved.
    She explained how they could do all of this in a few hours a week, in time between
    classes. By spending time one-on-one and in small groups, she made the vision
    real and enlisted others in it.


    Just as Jo-Anne did, leaders animate the vision and make manifest the purpose
    so that others can see it, hear it, taste it, touch it, feel it. Leaders make
    full use of the power of language in communicating a shared identity and giving
    life to visions. Successful leaders use metaphors and other figures of speech
    to lend vividness and tangibility to abstract ideas. Leaders draw word pictures,
    give examples, tell stories, and relate anecdotes. They find ways of giving expression
    to their hopes for the future. In making the intangible vision tangible, leaders
    ignite constituents’ passion and develop a shared sense of destiny.


    Lori Ann Roth, her university’s director of training and organizational development,
    told us about another method for conveying a shared image of the future—one that
    involved not'

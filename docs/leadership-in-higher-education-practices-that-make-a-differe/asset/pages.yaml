    that motivated me to construct a project that would raise complicated ethical
    issues. Everyone is equal. Everyone has a gift to give. Everyone has something
    to learn. Love and justice can guide us to a new level of awareness.”


    # Explore Your Past


    As contradictory as it might seem, in aiming for the future you need to look back
    to your past. Looking backward can actually enable you to see farther than if
    you only stare straight ahead. Understanding your personal history can help you
    identify themes, patterns, and beliefs that both underscore why you care about
    particular issues or circumstances now and explain why making them better in the
    future is such a high priority.


    Consider the journey taken by William Hwang, who founded United InnoWorks Academy,
    a nonprofit dedicated to opening the world of science and engineering to middle-school
    students from disadvantaged backgrounds; it aims to not only ignite their love
    of learning but also inspire volunteerism in college students. His passion was
    sparked when he reflected on his own experiences in high school, when he had attended
    several special summer programs that were “born from someone’s imagination and
    hard work...that changed, reshaped, and'
  merge: -1

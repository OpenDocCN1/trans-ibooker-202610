  md: 'else’s experience. You can lead only out of your own. Unless it’s your style,
    your words, it’s not you; it’s an abstraction.


    It’s one thing to give voice to your words; it’s another to give voice in tune
    and with a personal style. If you’re not the genuine article, can you expect others
    to respect you? People don’t follow your technique. They follow *you*—your message
    and your embodiment of that message. To be a leader, you must confront this central
    issue for yourself. You don’t have to copy someone else, you don’t have to read
    a script written by someone else, and you don’t have to wear someone else’s fashions.
    Instead you are free to choose what you want to express and the way you want to
    express it. We’d argue that you have a responsibility to your constituents to
    express yourself in a singular manner—in a way they would immediately recognize
    as yours. Researchers have consistently demonstrated a significant relationship
    between a leader’s clarity and commitment to a set of core values and their likelihood
    of being successful.⁴


    # Build and Affirm Shared Values


    Clarity about personal values is an essential part of finding your voice. Leaders
    don’t stand up for just some personal or idiosyncratic values. In the process
    of setting an example, leaders endeavor to lead their constituents from what *I*
    believe to what *we* believe. In other words: Do What We Say We Will Do. A leader’s
    promise is really an organization’s promise, regardless of whether the organization
    is a team of two, a department of 15, a program involving several hundred, or
    a school of many thousand.


    Nicole Matouk was a student records analyst in the law school when the university
    implemented a major transition from the semester to the quarter system. Because
    of all the necessary preparations in advance of the change—for example, overhauling
    the computer systems—and because of the quarter'

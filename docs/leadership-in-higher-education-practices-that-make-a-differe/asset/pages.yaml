    the Arc de Triomphe, the Seine, Notre Dame, good food, wine, romance—all are images
    of real places and real sensations. No one calls out the kilometers, population,
    or gross domestic product of Paris. The same would be true for your college or
    university campus. Why? Human memory is stored in images and sensory'

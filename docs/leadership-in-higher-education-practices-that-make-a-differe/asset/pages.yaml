  md: 'from generation to generation. To understand the teaching power of stories,
    all you have to do is listen to the tales that alumni relate when they are together
    during homecoming events:


    +   - The story about an administrative assistant who enabled them to graduate
    on time by approving their petition to add a class after the enrollment deadline

    +   - The faculty member who made a point of coming to their volleyball games,
    visibly cheering, and talking about how they played when they came to class or
    bumped into each other in the student union

    +   - The counseling center director who always made time in his schedule to speak
    with them whenever they were feeling stressed-out

    +   - The department chair who found the resources to send them to an overseas
    (expensive!) conference, which enabled them to make connections with colleagues
    that otherwise would not have been possible

    +   - The residence hall director who spent hours listening to them complain about
    a roommate and eventually helped them find a better place to live


    While the leader’s message is vital, and how it is framed is critical, the process
    by which it is communicated is just as significant. Stories can serve as mental
    maps that help people make the connection between what is important—the purpose
    and values—and how to put those things into practice. When people hear a story
    about how someone like themselves enacted a value, they are more likely to see
    themselves doing the same.'

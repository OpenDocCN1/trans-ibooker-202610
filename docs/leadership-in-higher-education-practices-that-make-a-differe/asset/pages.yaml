    why do people do many things for little or no tangible reward? Extrinsic rewards—the
    traditional cliché of “what gets rewarded gets done”—certainly can’t explain these
    actions in higher education. Institutions can’t pay people to care about students,
    alumni, or even their colleagues; they can’t pay people to care about their classes,
    programs, services, facilities, families, or even the college’s bottom line.


    A sense of meaning and purpose is what gets people through the tough times, when

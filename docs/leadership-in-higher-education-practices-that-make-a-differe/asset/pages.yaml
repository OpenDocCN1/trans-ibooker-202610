- pgno: 75
  md: 'influenced me in amazing ways. They helped me focus, opened my eyes to new
    and exciting possibilities.”


    William remembered a track teammate who had few role models and was on probation
    throughout high school; thinking about him sparked, as William explained, “a burning
    desire to do something to help others who might be lacking the same opportunities.”
    He decided to devote himself to something that could bring opportunities of the
    kind he had to underprivileged children who needed them the most, and the United
    InnoWorks Academy was born. Beginning with a single program in 2003, InnoWorks
    has nurtured more than 2,400 students at 14 university chapters around the world,
    and those numbers continue to grow.


    As William learned to appreciate, when you gaze first into your past, you elongate
    your future. You also magnify your future and give it detail as, like William,
    you recall the richness of your past experiences. So, to envision the possibilities
    in the distant future, look first to the past. When you do, you’re likely to find
    that your central theme has been there for a long time.


    In addition to identifying lifelong themes, there’s another benefit to looking
    back before looking ahead: you can gain a greater appreciation for how long it
    can take to fulfill aspirations. You also realize that many, many paths can be
    pursued and that there may be new summits that you want to climb.


    None of this is to say that the past is your future. Adopting that extremely dangerous
    perspective would be like trying to drive to the future while looking only in
    the rearview mirror. From that angle you’d drive yourself and your program right
    off a cliff. The point is to avail yourself of the widest variety of experiences
    possible. Broaden your experiences and expand your network of'

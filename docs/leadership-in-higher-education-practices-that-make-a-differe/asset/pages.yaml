- pgno: 171
  md: 'Leadership *can* be taught, but not solely in classrooms, seminars, or books
    such as this one. Not only do you need a conceptual foundation but, more importantly,
    you also have to have guidance, practice, feedback, and reinforcement. You can’t
    read a book on public speaking and suddenly expect to be more comfortable and
    a better speaker in front of groups. You wouldn’t accept a physician who has only
    academic knowledge. Leadership in this regard is a clinical skill and is learned,
    developed, and honed in practice settings.


    Our collective task is to liberate the leader within each and every person. Rather
    than view leadership as an innate set of character traits—a self-fulfilling prophecy
    that dooms each campus and society at large to have only a few good leaders—it’s
    far healthier and more productive to assume that it’s possible for *everyone*
    to learn to lead. By assuming that leadership is learnable, you can discover how
    many good leaders there really are. Somewhere, sometime, the leader within each
    individual may get the call to step forward—for the department, the function,
    the program, and the college, as well as for their families, congregations, neighborhoods,
    and communities. By believing in yourself and your capacity to learn to lead,
    you make sure you’ll be prepared when that call comes.


    Surely you shouldn’t mislead people into believing that they can attain unrealistic
    goals, but neither should you assume that only a few can ever achieve excellence
    in leadership—or in any other human endeavor. Those who are most successful at
    bringing out the best in others are those who set achievable “stretch” goals and
    believe that they can develop the talents of others.


    The most effective leaders are continuously learning. They see *all* experiences
    as learning experiences, not just those sessions in a formal classroom or workshop.
    They’re always looking for ways to improve themselves and their organizations.
    By reading this book, reflecting on the questions at the end of each chapter,'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'and engaging in other personal development activities, you’re demonstrating
    a predisposition to lead. Even if some people think that they’re not able to learn
    to lead, you must believe that you can. That’s where it all starts—with your own
    belief in yourself.


    Regardless of how much you now know about leadership, becoming the best leader
    you can be is a lifelong journey of continuous improvement. And in keeping with
    the scientific method embedded in the scholarly traditions of higher education,
    this requires hypothesis testing. It means persistent experimentation, reflection,
    drawing lessons from experience and applying them to subsequent experiments, receiving
    new feedback, analyzing the outcomes, and so on in a continuous iterative process.
    In doing so you become a leadership researcher, offering proof to the claim that
    the best leaders are the best learners.²


    # CONTRASTS AND CONTRADICTIONS


    In analyzing thousands of case studies, numerous interviews, and millions of survey
    responses, we identified The Five Practices of Exemplary Leadership as an operating
    system for leaders. We learned that in performing at their personal bests, people
    Model the Way, Inspire a Shared Vision, Challenge the Process, Enable Others to
    Act, and Encourage the Heart. Along with many scholars, we have found that leaders
    who more frequently engage in The Five Practices are significantly more likely
    to achieve extraordinary results than those who use these practices less often.


    That said, here is a warning: Any leadership practice can become destructive.
    Virtues can become vices. There’s a point at which each of The Five Practices,
    taken to extremes, can lead you astray. Finding your voice and setting an example
    are essential to establishing your credibility and making a'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'difference—but an obsession with being seen as a role model can lead to being
    too focused on your own values and ways of doing things. It can cause you to discount
    others’ views and be closed to feedback. It can push you into isolation for fear
    of losing privacy or being “found out.” It can also blind you to being more concerned
    with style than substance.


    Leaders set themselves apart from other credible people by being forward-looking
    and communicating a clear and shared vision of the future. Yet a singular focus
    on one vision of the future can keep you from seeing or even imagining other possibilities
    as well as prevent you from acknowledging the realities of the present. It can
    cause you to miss the exciting prospects that are just out of your sight or make
    you hang on just a little too long to an old, tired, out-of-date technology. Exploiting
    your powers of inspiration can cause others to surrender their will because your
    own energy, enthusiasm, and charm may be so magnetic that others don’t think for
    themselves.


    Challenging the process is essential to promoting innovation and progressive change.
    Seizing the initiative and taking risks are necessary for learning and continuous
    improvement; but taken to extremes, you can cause needless turmoil, confusion,
    and paranoia. If you seldom slow down enough to give people the opportunity to
    gain confidence and competence, they’ll lose their motivation to try new things.
    Change for change’s sake can be just as demoralizing as complacency.


    Collaboration and teamwork are essential to getting extraordinary things done
    in today’s turbulent world. Innovation depends on high degrees of trust. People
    must be given the power to control their own lives if they are to accomplish great
    things. But an overreliance on collaboration and trust may be rooted in the avoidance
    of conflict or an unwillingness to examine decisions critically. These dynamics'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'may be a way of evading accountability or *not* taking charge when the situation
    requires. Delegating power and responsibility can become a way of dumping too
    much on others when they’re not adequately prepared to handle it.


    People do perform at higher levels when they are challenged and encouraged. Personal
    recognition and group celebration inspire the spirit and momentum that can carry
    a group forward even during the toughest of challenges. At the same time, a constant
    focus on who should be recognized and when celebrations should be held can turn
    you into a gregarious minstrel. You can lose sight of the mission because you’re
    having so much fun. Don’t become overly consumed by all the perks and pleasures
    and lose sight of the purpose behind the recognition.


    Far more insidious than all of these possible vices, however, is the treachery
    of hubris, the Achilles’ heel of leadership. It’s good to be royalty, gratifying
    to have influence, and exhilarating to have scores of people cheering your every
    word. In many all-too-subtle ways, it’s easy to be seduced by power and importance.
    All evil leaders have been infected with the disease of hubris, becoming bloated
    with an exaggerated sense of self and pursuing their own sinister ends. How can
    you avoid this?


    The answer is humility.³ You can avoid excessive pride only if you recognize that
    you don’t know everything, that there are other smart, talented, experienced,
    and dedicated people.⁴ Knowing that you’re only human helps—that you are never
    as good or as bad as others may believe. It also helps to recognize that nothing
    great was ever accomplished alone—that you need the help of others. In the context
    of education, it’s only fitting to note that leaders are constantly learning.
    Listen to what your colleagues have to say. Find the honesty to admit your mistakes
    and the grace to step back, correct, and forgive yourself. Hold'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'on to humility: it’s the only way we know to resolve the conflicts and contradictions
    of leadership.


    In fact, research on organizations that transition from mediocrity (or worse)
    to long-term superiority reveals a remarkable pattern of humility among the chief
    executives of “good-to-great” companies: “In contrast to the very I-centric style
    of the comparison leaders, we were struck by how the good-to-great leaders didn’t
    talk about themselves.... They’d talk about the company and the contributions
    of other executives as long as we’d like but would deflect discussion about their
    own contributions.”⁵ Similarly, their compelling modesty is perhaps why many of
    the best leaders within higher education are not the ones to grab the headlines
    in The Chronicle of Higher Education and the local or national press or gain rock-star
    status in the popular leader-as-hero culture. Instead these leaders focus their
    attention and will on their institutions and on others.


    This is consistent with our own findings. The leaders in higher education whom
    we’ve met and interviewed cared more about the institution than they did about
    their own successes. As we’ve discussed, exemplary leaders know that they can’t
    do it alone and they act accordingly. They lack the pride and pretense displayed
    by many people who may have succeeded in the short term but leave behind a weak
    organization that fails to thrive after their departure. Instead, with self-effacing
    humor⁶ and generous and sincere credit to others, they reach higher and higher
    levels of achievement; they make extraordinary things happen.


    There is yet another way to avoid the temptations of power that lead to becoming
    overbearing and presumptuous. Refuse to become one-dimensional, focused narrowly
    on your work and organization. Do not allow work to consume you. Get involved
    in the world that surrounds you. The very best leaders have'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'numerous pursuits and interests—arts, literature, science, technology, entertainment,
    sports, politics, law, religion, friends, and family.


    There’s one other valuable lesson that will help you deal with the contrasts and
    contradictions of leadership. Nothing in our research even hints that leaders
    should be perfect. Leaders aren’t saints. They’re human beings full of flaws and
    failings like everyone else. They make mistakes. We advise all aspiring leaders
    to adopt the attitude of a novice—to always remain open and full of wonder. The
    best leaders, as we’ve said, continue to be the best learners.


    # KEEP HOPE ALIVE


    People look to willingly follow those leaders who demonstrate an enthusiastic
    and genuine belief in the capacity of others, who strengthen people’s will, who
    supply the means to achieve, and who express optimism for the future. People want
    leaders who remain passionate and maintain a bit of humor (especially not taking
    themselves too seriously) despite obstacles and setbacks. Every college and university—and
    the business of higher education— desperately needs leaders with a positive, confident,
    can-do approach.


    Being at one’s personal best as a leader is never an easy or straightforward experience.
    Everyone we talked with acknowledged the hard work, disappointments, setbacks,
    mistakes, misgivings, and sacrifices they endured. They encountered them when
    reviewing and updating curriculum, revising the faculty handbook, establishing
    a new service-learning program, or moving from the concept of dormitories to residential
    learning communities. They were evident when building a new twenty-first-century
    library, holistically integrating student affairs programs with the academic affairs
    programs, requiring a common platform across the campus for'
  merge: -1
  img_proc: true
- pgno: 177
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 178
  md: 'difficulty of today and envision the potential of tomorrow. Hope enables people
    to bounce back even after being stressed, stretched, and depressed. Hope enables
    people to find the will and the way to aspire to greatness.⁷


    And yet hope is not the final thing that you must keep alive. We have one more
    lesson to share.


    # THE SECRET TO SUCCESS IN LIFE


    Early in our study of leadership bests, we were fortunate to cross paths with
    US Army Major General John H. Stanford. During his service, John endured military
    tours in Vietnam, was highly decorated, headed up the army’s Military Traffic
    Management Command (and handled the logistics for Desert Storm), and had the steadfast
    loyalty of his troops. Following his military career, he became the chief administrator
    for Fulton County, Georgia (which includes Atlanta), as it geared up to host the
    1996 Summer Olympics. He was subsequently recruited to the position of superintendent
    for the Seattle, Washington, school district, where he sparked a revolution in
    public education.


    John was a renaissance individual who served at the local, national, and international
    levels. His distinguished career transcended and bridged the armed services, public
    administration, and education. His answer to one of our interview questions significantly
    influenced our understanding of leadership at the deepest level, and he gave voice
    to how we saw him live his life.


    We asked John how he would go about developing leaders, whether at a college or
    university, in the military, in government, in the nonprofit sector, or in private
    business. Here is what he told us:'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'When anyone asks me that question, I tell them I have the secret to success
    in life. The secret to success is to stay in love. Staying in love gives you the
    fire to ignite other people, to see inside other people, to have a greater desire
    to get things done than other people. A person who is not in love doesn’t really
    feel the kind of excitement that helps them to get ahead and to lead others and
    to achieve. I don’t know any other fire, any other thing in life that is more
    exhilarating and is more positive a feeling than love is.


    “Staying in love” isn’t the answer we expected to get—at least not when we *began*
    studying leadership. But after nearly 40 years of being leaders, researching leadership,
    and developing leaders, we continue to be struck by how many people use the word
    *love* freely when talking about their own motivations to lead and in explaining
    why they endured the hardships, made the personal sacrifices, and accomplished
    what they did.


    Of all the things that sustain a leader over time, love is the most lasting. It’s
    hard to imagine leaders on any college campus getting up day after day and putting
    in the long hours and hard work it takes to make a difference without having their
    hearts in it. This may just be the best-kept secret of successful leaders: *If
    you love what you’re doing, you will never have to work.*


    So, stay in love with leading. Stay in love with your colleagues who do the work.
    Stay in love with the students, faculty, staff, and alumni who are transformed
    because of their time at your institution. Stay in love with the scholarship,
    ideas, programs, and applications that emerge through and because of what you
    and so many others contribute.


    Leadership is *not* an affair of the head. Leadership is, after all, an affair
    of the heart.


    # TAKE THE NEXT STEP


    At the end of each chapter, we asked you to reflect on a few questions. Now at
    the end of this book, we have one final'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'question for you: *What are you actually going to do now to be an even better
    leader?*


    From the examples of leaders in this book and from decades of research and experience,
    we know that everyone can lead. But make no mistake. Leadership is never easy.
    Reading about leadership is easy. Attending a leadership training program is easy.
    Actually applying what you learn is *not* easy. When we teach seminars on leadership,
    we finish by asking participants if they heard anything that was too complex,
    too esoteric to understand, or too difficult to grasp. The answer is always no.
    The leadership challenge is not in knowing the concepts; it’s in putting them
    into practice. Then we ask: *What are you actually going to do now to be an even
    better leader?*


    We believe that you know what you can do to be an even better leader than you
    are right now, but *doing* it is a different story. To really change and improve,
    you first must fall deeply in love with the idea of being an exemplary leader.
    Then and only then will you have the strength and resilience necessary to overcome
    your hesitation and deeply ingrained habits. Pain and discomfort are inevitable
    on the leadership journey, but so are joy and the thrill of accomplishment if
    you stick with it.


    In this book we’ve given you dozens of things you can do to improve your leadership
    skills in The Five Practices. *What are you going to do?* We hope that when you
    look around and say, “Something needs to change” or “Something can be improved
    or can be better than it is right now,” you’ll also look in the mirror and see
    that you are the person who could make the difference.


    There’s a popular riddle about 12 frogs that goes like this: If 12 frogs are sitting
    on a log at the edge of a pond and five of those 12 frogs decide to jump into
    the pond, how many frogs remain on the log? What’s your answer? Seven? Zero? Twelve?
    Five?'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'The correct answer is 12. Twelve frogs remain on the log. Why? The reason is
    that there is a huge difference between *deciding* to do something and actually
    *doing* it. Now that you’ve finished reading this book, please keep the imperative
    of this riddle in mind.


    You’ve read about how leadership makes a difference, and you’ve learned about
    The Five Practices of Exemplary Leadership operating system. You’ve been presented
    with numerous examples and illustrations about the behaviors of people in higher
    education who make extraordinary things happen. You’ve been presented with many
    questions and issues to reflect on and offered many suggestions on leadership
    actions you can take right now.


    Decide to do something different that will make you an even better leader. Then
    hop off the log and get into the water!'
  merge: -1
  img_proc: true

  md: 'The most important way leaders instill this can-do attitude is by providing
    opportunities for people to gain mastery of a task, often one step at a time.
    Training is crucial to building self-efficacy and to encouraging initiative. Isn’t
    it interesting, perhaps ironic, that “training”—the sine qua non of higher education—is
    too infrequently applied to the development of faculty and staff capabilities?
    Exemplary college and university leaders design and build learning opportunities
    for more than just the students. They fully appreciate that knowledge, like any
    institutional asset, deteriorates over time. They realize that people can’t do
    what they don’t know how to do. Short of firing everyone who doesn’t come with
    all the skills intact—a virtual impossibility—capabilities need to be continuously
    upgraded. More and more higher-education institutions are recognizing the importance
    of lifelong learning by investing in administrative and management development
    programs (as opposed to content-based training) for faculty and staff alike.[^3]


    Leaders provide opportunities for people to exceed their previous levels of performance.
    They regularly set the bar higher. And the best leaders understand the importance
    of setting the bar at a level at which people feel they can succeed. Raise it
    too high, and people will fail; if they fail too often, they’ll quit trying. Raise
    the bar a bit at a time, and eventually more people master the situation. This
    awareness of the human need for challenge and a sensitivity to the need to succeed
    is among the critical balancing skills of any leader.



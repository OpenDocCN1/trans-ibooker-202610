- pgno: 83
  md: 'Although every unit (department, program, or school) within a university must
    be aligned with the overall organizational vision, it can express its unique purpose
    within the larger whole. Every function and every department can differentiate
    itself by finding its most distinctive qualities. Each can be proud of the ideal
    and unique image of its future as it works toward the collective future of the
    larger institution.


    # Invoke Images of the Future


    A beacon of light cutting through the fog is an image you can picture in your
    mind. Leaders often talk about the future with such visual references. They speak
    about foresight, focus, forecasts, future scenarios, points of view, and new perspectives.
    Visions are images in the mind, and leaders make them real to others by making
    them more concrete and tangible. They bring impressions to life by painting word
    pictures. As shown in figure 3.2, the more frequently that leaders were seen as
    “describing a compelling image of what our future could look like,” the more their
    direct reports indicated that they were clear about what was expected of them
    in their jobs.'

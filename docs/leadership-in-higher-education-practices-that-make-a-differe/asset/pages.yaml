    # Explore Your Inner Territory


    We were talking about where leadership begins, and our conversation went something
    like this:


    Jim: I think leadership begins with discontent. You are dissatisfied with the
    status quo, the ways things are currently going.


    Barry: True enough, but that’s too dismal a view for me. I think leadership actually
    begins with caring. What do you care enough about to see if it could be any better?


    Jim: Okay, then, let’s look up the word caring in the dictionary.'

- pgno: 52
  md: 'Nicole’s experience reaffirms that people are more loyal and committed when
    they believe that their values and those of the organization are aligned. They
    can be more creative and engaged because they become immersed in what they are
    doing. The quality and accuracy of communication and the integrity of the decision-making
    process increase when people across the campus feel that they share common values.


    Discovering and affirming shared values is the foundation for building productive
    and genuine work relationships. While credible leaders honor the diversity of
    their many constituencies, they also stress their common values. Leaders build
    on agreement. They don’t try to get everyone to be in accord on everything—this
    goal is unrealistic, perhaps even impossible. Moreover, to achieve it would negate
    the very advantages of diversity. But to take the first step, then a second, and
    then a third, people must have some common core of understanding. If disagreements
    over fundamental values persist, the result is intense conflict, false expectations,
    and diminished capacity.


    Recognition of institutional values that everyone can embrace provides the campus
    community with a common language and framework for communicating the premise for
    making key decisions. Research clearly shows that alignment of individual, group,
    and institutional values generates tremendous energy.⁵ Agreement intensifies commitment,
    enthusiasm, and drive; individuals have reasons for caring about their work. When
    people can care about what they are doing, they are more effective and satisfied.
    They experience less stress and tension. Shared values are the internal compasses
    that enable people to act both independently and interdependently.⁶


    Important as it is that leaders forthrightly articulate the principles for which
    they stand, what leaders say and do must be consistent with the aspirations of
    their constituents. When'

  md: 'line is that more than anything people want leaders who are credible.


    People must be able to believe in their leaders—that her words can be trusted,
    that he will do what he says, that she is personally excited and enthusiastic
    about the direction in which the group is headed, and that he has the knowledge
    and skills to lead. This is the First Law of Leadership: If people don’t believe
    in the messenger, they won’t believe the message.


    What does it take to “believe in the messenger” and be viewed as credible? When
    we ask people, “What does credibility look like in action? How do you know if
    someone is credible?” their answers do not vary by the nature of their institution
    or by what they do or even by who they are (e.g., age, gender, ethnicity, faculty,
    staff). These are the most common phrases people use to describe the behaviors
    and actions of people who are credible:


    +   - “They practice what they preach.”

    +   - “They walk the talk.”

    +   - “Their actions are consistent with their words.”

    +   - “They put their money where their mouth is.”

    +   - “They follow through on their promises.”

    +   - “They do what they say they will do.”


    That last response is the most frequent. When it comes to deciding whether a leader
    is believable, people first listen to the words, then they watch the actions.
    A judgment of “credible” is handed down when words and deeds are consonant. If
    people don’t see consistency—if, for instance, special favors are alleged around
    admissions, popular or favorite students aren’t'

- pgno: 84
  md: '![](img/7ddf49e8d8cd889f8f7c75097442c3e0_84_0.png)


    **Figure 3.2** People’s clarity about what is expected of them in their jobs increases
    with the frequency to which leaders describe a compelling image of what our future
    could look like.



  md: 'well-being—not with any ultimatums. She gained their trust by promising that
    the university would call the police or campus safety department only if needed,
    rather than having a constant police presence.


    As a result, the protest remained peaceful, the students fasted for four days—with
    no health problems—and a dialogue about the development of a corporate gift policy
    for the institution began. If Jeanne had not taken the small-wins approach and
    had instead seen the situation as an enormous problem, the protest could have
    escalated and resulted in a disaster. But it didn’t. Jeanne realized that incremental
    steps were the most promising path to a successful resolution. Afterward she made
    use of this experience to involve students in reflecting on what they had learned—about
    the demonstration, about the university, about corporations, and about themselves.
    Turning a protest into a learning opportunity—a teachable moment—required being
    open about the process and made it a win for everyone.


    Small wins form the basis for a consistent pattern of accomplishment that attracts
    people who want to be allied with a successful venture. Small wins build people’s
    confidence and reinforce their natural desire to feel successful. Because additional
    resources tend to flow to winners, slightly larger steps or wins can be attempted
    next. A series of small wins therefore provides a foundation of stable building
    blocks. Each win preserves gains and makes it harder to return to preexisting
    conditions; each win also offers information that facilitates learning and adaptation.


    Small wins also deter opposition for a simple reason: it’s hard to argue against
    success. Thus small wins decrease resistance to subsequent proposals. In achieving

- pgno: 130
  md: 'Feeling powerful—literally, feeling *able*—comes from a deep sense of being
    in control of life. People everywhere share this inclination, and when they feel
    able to determine their own destiny and believe that they can mobilize the resources
    and support necessary to complete a task, they persist in their efforts to achieve.
    But when people feel that they are controlled by others and believe that they
    are unsupported or lack the necessary resources, they show little to no commitment
    to excel (although they may still have to comply). Leadership behaviors that increase
    another’s sense of self-confidence, self-determination, and personal effectiveness
    make that individual more powerful and greatly enhance the possibility of their
    achieving success. Gallup surveys involving millions of people around the world
    decidedly show that the extent to which people feel powerful and engaged in their
    work is directly linked to positive organizational outcomes, such as productivity,
    commitment, and retention.[^9]


    Creating a climate on campus where people are involved and feel important is at
    the heart of strengthening others. Correspondingly, you have to provide them with
    the latitude to make decisions based on what they believe should be done. You
    must provide an environment both that builds their ability to perform a task or
    complete an assignment and that promotes a sense of self-confidence in their judgment.
    People must experience a sense of personal accountability so that they can own
    their achievements. Exemplary leaders help others learn new skills and develop
    their existing talents, as well as provide the institutional supports required
    for ongoing growth and change. In the final analysis, you are turning your constituents,
    the people you work with, into leaders.


    # Ensure Self-Leadership


    Leaders accept and act on this paradox: *You become most powerful when you give
    your own power away.* This is'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'precisely the realization that Mark Delucchi shared in his Personal-Best Leadership
    Experience, which arose in connection with a Habitat for Humanity Collegiate Challenge.
    Quite simply, Mark gave students the power and the authority to carry out their
    assignments and jobs: “Although I tried to instill in them what I thought was
    important, I had them articulate what it was they wanted from this experience.
    I gave them the space and resources to achieve the goals as they defined them.”
    Mark took this approach not simply with the group but with each individual. For
    example, when the student coordinator came to him with a question, Mark’s response
    was, “It’s your show. What do *you* want to do?” Mark encouraged people to run
    with their ideas and to see what they came up with. If something went wrong, “I
    was right there to help them learn and then move on.”


    Traditional thinking promotes the archaic idea that power is a fixed sum: *If
    I have more, you have less.* Naturally, people with this view hold tightly to
    the power that they perceive is theirs and are extremely reluctant to share it
    with anyone. This notion is wrongheaded and inconsistent with all the evidence
    on high-performing organizations. As Mark found out, he didn’t lose any influence
    with the group or on the project because “it really was their show.” Being a leader,
    Mark explained, “requires you to give up something. By giving some of the responsibility
    to others, they become invested and passionate about the project. Then my job
    becomes finding ways to help them see how it all comes together. But you’ve got
    to believe in the capabilities of your team to make this work.”


    From her experience in higher education, especially as the university’s training
    and organizational development director, Lori Ann Roth seconded Mark’s experience:
    “It’s not really about giving your power away,” Lori explained. “What you are
    giving is an opportunity for people to make their *own* ‘power—'

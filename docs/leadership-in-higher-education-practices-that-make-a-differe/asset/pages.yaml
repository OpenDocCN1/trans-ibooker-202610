- pgno: 69
  md: 'The most effective leaders in higher education are those who most frequently
    Inspire a Shared Vision. We asked direct reports how often their leaders engaged
    in the six behaviors associated with Inspire a Shared Vision on the *Leadership
    Practices Inventory*, with assessments ranging from 1 (Almost never) to 10 (Almost
    always). We also asked them a separate question about the extent to which they
    agreed or disagreed with the statement *Overall, this person is an effective leader*
    (1 = Strongly disagree and 5 = Strongly agree). The analysis showed that the effectiveness
    ratings of leaders by their direct reports increased systematically (*p* < 0.001)
    as leaders were observed engaging more and more frequently in the behaviors associated
    with inspiring a shared vision. There was a remarkable 85 percent bump in effectiveness
    from the bottom to the top quartile.


    # CLARIFY YOUR VISION


    No matter what term is used—*vision, purpose, mission, legacy, dream, calling,*
    or *burning agenda*—the intent is the same. People who exercise leadership want
    to do something significant and accomplish something that no one else has yet
    achieved. What that something is—that sense of meaning and purpose—must come from
    within. That’s why, just as we said about values, you must first clarify your
    own visions of the future before you can expect to enlist others in a shared vision.
    To create a climate of meaningfulness, first you must believe in something yourself.
    Before you can inspire others, *you* must be inspired. Your passion is an indicator
    of what you feel most deeply about and find worthwhile in and of itself. It’s
    a clue to what is *intrinsically* rewarding to you.


    You can’t impose a vision on others. It must be something that has meaning to
    them, not just to you. Leaders must foster conditions under which people will
    do things because they *want* to, not because they have to. One of *the* most
    important'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'practices of leadership is giving life and work a sense of meaning and purpose
    by offering an exciting vision of the future that could be better than what exists
    at the moment.¹ Leaders structure environments so that personal values and department,
    program, or institutional visions intersect. For example, people’s answer to the
    question about how often their leader “shows others how their long-term interests
    can be realized by enlisting in a common vision” was strongly related to the extent
    to which they felt they were making a difference in their organization, as shown
    in figure 3.1.


    In this digital age, people often ask, “How can I have a vision of what’s going
    to happen on this campus, or in this state, let alone in the grander business
    of higher education, five or 10 or even two years from now, when I don’t even
    know what’s going to happen next week or even over this next term?” Here are a
    couple of ways of answering this question. First, Martin Luther King Jr. spoke
    poignantly about his dream, but he also said that you don’t have to see the whole
    staircase to take the first step. So long as you have some idea about where you
    are going, you can take the next step.'

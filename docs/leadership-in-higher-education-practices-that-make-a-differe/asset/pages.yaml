- pgno: 72
  md: '*you do?* We’ve asked this question many, many times, and we get the same answers:
    “I slow way down, turn my lights on, grab the steering wheel with both hands,
    tense up, lean forward, and turn off the radio.” Then you go around the next curve
    in the road, the fog has lifted, and it’s clear again. What do you do? Relax,
    turn the lights off, speed up, turn the radio back on, and enjoy the scenery.


    This analogy illustrates the importance of clarity of vision, *especially* what
    it takes to move ahead quickly and confidently. How fast can you drive in the
    fog without risking your own or other people’s lives? How comfortable are you
    riding in a car with someone who drives fast in the fog? Are you able to drive
    more quickly when it’s foggy or when it’s clear? It’s obvious, isn’t it? You can
    go more quickly when your vision is clear.


    # Discover Your Theme


    Just knowing that having a vision is essential doesn’t make one manifest over
    your head like a light bulb. When we ask people to tell us where their visions
    come from, they often have great difficulty describing the process. And when they
    do provide an answer, typically it’s more about a feeling, a sense, a hunch, a
    gut reaction. After all, there’s no map or interstate highway to the future. When
    people first take on their roles as leaders—whether they’re appointed or they
    step forward and volunteer—they often don’t have a *clear vision* of the future.


    In the beginning what leaders on college campuses typically have is a *theme*.
    They have concerns, desires, hypotheses, propositions, arguments, hopes, and dreams—core
    concepts around which they organize their aspirations and actions. Leaders often
    begin the process of envisioning the future by discovering their themes. What
    leaders eventually say about their vision is an elaboration, an interpretation,
    and a variation on those themes. Fortunately, there are ways to improve your'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'ability to articulate your themes, and ultimately your visions, of the future.[^2]


    For example, finding your vision, like finding your voice, is a process of self-exploration
    and self-creation. It’s an intuitive, emotional undertaking. There’s often no
    logic to it. What we’ve seen is that exemplary leaders have a passion for their
    departments, their causes, their programs, their students, their subject matter,
    their technologies, their communities—something other than their own fame and
    fortune. Leaders care about something much bigger than themselves and much bigger
    than all of us. Leaders care about making a difference by changing the status
    quo in some meaningful way.


    And emotions are contagious. If you don’t care deeply about something, how can
    you expect others to feel any sense of conviction? How can you expect others to
    get jazzed if you’re not energized and excited yourself? How can you expect others
    to suffer through the inevitable long hours and hard work if you’re not similarly
    committed?


    We asked Kent Koth why he selected a particular project as his Personal-Best Leadership
    Experience. His answer speaks volumes about how in leading others we discover
    our own passions: “This was the defining moment in my budding professional life.
    It was at this moment that I knew what I was born to do. I had found my place
    in the world.”


    Kent wanted to provide an educational and service opportunity for students to
    engage with issues and people with whom they were unfamiliar. As a community outreach
    program coordinator, he traveled to San Francisco with a group of students for
    the campus’s first-ever “alternative” spring break. This group slept on the floor
    of a downtown church and worked at local homeless shelters. Each night they cooked
    dinner together and discussed the day’s events as they ate. After dinner'

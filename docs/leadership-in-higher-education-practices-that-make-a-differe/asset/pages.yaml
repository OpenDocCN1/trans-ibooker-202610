  img_proc: true
- pgno: 111
  md: 'Easy comfort and security are not only unrealistic but also potentially stultifying.


    Your view of events contributes to your ability to cope with change and stress.
    To take that first step, to start that new project, and to initiate improvement,
    you have to believe, like Karen, that you can influence the outcome of the situation.
    You have to be curious about whatever is going on. You have to look for learning
    every step of the way. With a hardy attitude, you can transform stressful events
    into positive opportunities for growth and renewal.


    What’s more, you can help your team feel the same way. For example, when Karen
    asked the production manager for a proposal to modernize the equipment, he came
    back with a five-year plan. Karen asked, “What would happen if we made this investment
    in one year?” His eyes opened wide in an expression that said, Wow, we really
    could change this place! He returned with a one-year plan that made strategic
    and financial sense.


    People with a hardy attitude take change, risk, turmoil, and the strains of life
    in stride. Whether the stressful event they encounter is positive or negative,
    they react similarly. They consider the incident engaging, believe they have the
    capacity and capability to influence the outcome, and see it as an opportunity
    for learning and development.


    You can’t enlist and retain people if you don’t cultivate an atmosphere that promotes
    psychological hardiness. Given alternatives, people won’t remain long with a cause
    that distresses them. To accept the challenge of change, they need to believe
    that they can overcome adversity. You can help the people you work with cope more
    effectively by promoting conditions in which people experience commitment rather
    than alienation, control rather than powerlessness, and challenge rather than
    threat. For example, provide and assign tasks that'

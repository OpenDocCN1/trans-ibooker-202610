    # LEADERSHIP IS LEARNED


    There persists a pernicious myth that leadership is reserved for only a handful
    of special people. That myth is perpetuated every time someone asks, “Are leaders
    born or made?” Whenever people ask us this question—which is almost every time
    we give a speech or conduct a class or workshop—our answer, always offered with
    a smile, is this: “We’ve never met a leader who was not born. *All* leaders are
    born. So are all college presidents, deans, coaches, teachers, scholars, registrars,
    directors, actors, accountants, artists, parents—you name it.” We’re all born
    with various sets of skills and abilities. What you do with what you have before
    you die, well, that’s entirely up to you.


    There’s another leadership myth that stands in the way of personal and organizational
    success—that leadership is associated with position. It’s an assumption that leadership
    starts with a capital *L* and that when you’re on top you’re automatically a leader.
    This view is part of a larger hero myth'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'that inhibits people from seizing the initiative and keeps them waiting for
    someone to ride in and save the day.¹


    It’s pure mythology that only a lucky few can ever understand the intricacies
    of leadership. Leadership is not a place, it’s not a gene, and it’s not a secret
    code. The truth is that leadership is an observable set of skills and abilities
    that are useful whether one is in the chancellor’s office, bookstore, library,
    classroom, dining hall, housing, human resources, public safety, information technology,
    media service, or student development. Any skill can be strengthened, honed, and
    enhanced—given the motivation and desire—through practice and feedback, along
    with good role models and coaching. So, all leaders are born and all leaders are
    made.


    It’s very curious and revealing that no one has ever asked us, “Can management
    be taught? Are managers born or made?” Why is management viewed as a set of skills
    and abilities while leadership is typically seen as a set of innate personality
    characteristics? It’s simple. People assume that management can be taught, and
    because they do, hundreds of business schools have been established, and each
    year thousands of management courses are taught. By assuming that people can learn
    the attitudes, skills, and knowledge associated with good management practices,
    schools and universities have raised the caliber of managers. They’ve also contributed
    to the idea that good management skills are attainable.


    The same can be said for leadership. It’s not the absence of leadership potential
    that inhibits the development of more leaders; it’s the persistence of the myth
    that leadership can’t be taught and can’t be learned. This debilitating myth is
    a far more powerful deterrent to leadership development than are the talents of
    any person or the fundamentals of the leadership process. And this myth is entirely
    antithetical to the essence of any educational philosophy.'

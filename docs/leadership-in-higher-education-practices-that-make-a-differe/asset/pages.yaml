  md: '# FOSTER A SPIRIT OF COMMUNITY


    All over the world, in every country, in every culture, and on every campus, people
    stop working on certain days or occasions during the year and take the time to
    celebrate. Impromptu ceremonies are often convened to rejoice in the acceptance
    of a colleague’s manuscript for publication, the award of a new contract for a
    research laboratory, the opening of a new facility or art installation, reaccreditation,
    and the like. Banquets are organized to acknowledge individuals and groups who’ve
    accomplished the extraordinary. Colleagues get together with one another at the
    end of work on an exhausting task force or promotion committee and give each other
    high-fives for a job well done. Even in tragic times, people come together in
    remembrance and song to honor those before them and to reaffirm their common humanity.


    Why do people take time away from work to gather together, tell stories, and raise
    their spirits? Sure, everyone needs a break from the pace and intensity of their
    job, but celebrating is not a frivolous excuse to goof off. Celebrations are among
    the most significant ways people have to proclaim their respect and gratitude,
    to renew their sense of community, and to remind themselves of their binding values
    and traditions. Celebrations serve as important a purpose in the long-term health
    of campus institutions as does the daily performance of tasks.


    What leaders know from practice is confirmed in our research. Performance improves
    when leaders bring people together to rejoice in their achievements and to reinforce
    their shared principles. By bringing people together, sharing the lessons from
    success, and getting personally involved, leaders strengthen in others the courage
    required to make a difference and make extraordinary things happen in their organizations.'

  md: 'Books of All Time,” receiving book-of-the-year honors from the American Council
    of Healthcare Executives, *Fast Company*, and the Critics’ Choice Award from the
    nation’s book review editors.


    They have also written other award-winning, inspiring, and practical books on
    leadership, including: *Stop Selling and Start Leading: How to Make Extraordinary
    Sales Happen; Learning Leadership: The Five Fundamentals of Becoming an Exemplary
    Leader; Turning Adversity into Opportunity; Finding the Courage to Lead; Great
    Leadership Creates Great Workplaces; Credibility: How Leaders Gain and Lose It,
    Why People Demand It; The Truth about Leadership: The No-Fads, Heart-of-the-Matter
    Facts You Need to Know; Encouraging the Heart: A Leader’s Guide to Rewarding and
    Recognizing Others; A Leader’s Legacy; Extraordinary Leadership in Australia and
    New Zealand: The Five Practices That Create Great Workplaces; Making Extraordinary
    Things Happen in Asia: Applying The Five Practices of Exemplary Leadership; and
    The Student Leadership Challenge: Five Practices for Becoming an Exemplary Leader.*


    Jim and Barry developed the widely used and highly acclaimed *Leadership Practices
    Inventory*, a 360-degree questionnaire assessing leadership behavior. The LPI
    has been completed by more than 5 million people around the globe. Over 700 doctoral
    dissertations and academic research projects have been based on The Five Practices
    of Exemplary Leadership framework. For more about all of Jim and Barry’s publications
    and research, visit leadershipchallenge.com.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Berrett–Koehler Publishers


    **Berrett-Koehler** is an independent publisher dedicated to an ambitious mission:
    *Connecting people and ideas to create a world that works for all.*


    Our publications span many formats, including print, digital, audio, and video.
    We also offer online resources, training, and gatherings. And we will continue
    expanding our products and services to advance our mission.


    We believe that the solutions to the world’s problems will come from all of us,
    working at all levels: in our society, in our organizations, and in our own lives.
    Our publications and resources offer pathways to creating a more just, equitable,
    and sustainable society. They help people make their organizations more humane,
    democratic, diverse, and effective (and we don’t think there’s any contradiction
    there). And they guide people in creating positive change in their own lives and
    aligning their personal practices with their aspirations for a better world.


    And we strive to practice what we preach through what we call “The BK Way.” At
    the core of this approach is *stewardship*, a deep sense of responsibility to
    administer the company for the benefit of all of our stakeholder groups, including
    authors, customers, employees, investors, service providers, sales partners, and
    the communities and environment around us. Everything we do is built around steward-ship
    and our other core values of *quality*, *partnership*, *inclusion*, and *sustainability.*


    This is why Berrett-Koehler is the first book publishing company to be both a
    B Corporation (a rigorous certification)'
  merge: -1
  img_proc: true

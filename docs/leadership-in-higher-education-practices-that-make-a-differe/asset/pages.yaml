  img_proc: true
- pgno: 59
  md: 'response. Housing departments and programs, for example, have moved from simply
    penalizing people for breaking the rules to encouraging people to follow the rules
    determined by the residents themselves—these “rules” then represent the shared
    values of the community.


    Critical incidents are those events in leaders’ lives that offer the chance to
    improvise while still staying true to the script. Although they can’t be explicitly
    planned, it’s useful to keep in mind that the way you handle such incidents—how
    you link actions and decisions to shared values—says volumes about what’s important.


    For example, some deans and departments make it a big deal when a faculty member’s
    book receives an award, and others don’t. One university advancement officer vigorously
    rings a bell, located in the center of the office, and calls everyone together
    whenever anyone successfully solicits a donation over a certain amount; many just
    take such accomplishments for granted. Some athletic directors make a personal
    appearance in the team’s locker room after a narrow overtime defeat to remind
    the players about being proud to play at their best in spite of the scoreboard.
    After a particularly disturbing racial incident, the campus police chief made
    a personal appearance at a meeting of the student senate to talk about such tensions
    and the need to reach out and ensure the safety of each person (students, faculty,
    and staff) on campus. He also held individual discussions with each public safety
    officer, over three shifts, to share similar beliefs and to learn about their
    concerns.


    # Tell Stories to Teach Virtues


    Critical incidents are often the most dramatic sources of moral lessons about
    how people should and should not behave. They become stories to pass along, whether
    around the classrooms and residence halls; among faculty, staff, and students;
    or even'

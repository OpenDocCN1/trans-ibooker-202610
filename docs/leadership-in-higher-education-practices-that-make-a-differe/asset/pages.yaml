  md: 'without outsight is like seeing clearly with blinders on—you just don’t get
    the complete picture. It can also be useful to get outside your usual discipline
    or functional field. Attend a conference in an entirely different area from your
    own; take a class in a different field; tour facilities in industries with which
    you are unfamiliar. See the world through a different lens.


    To get a good sense of the external realities, you must get up from your desk,
    get out of your office, and talk with your constituents—local citizens, staff,
    employers, trustees, alumni, faculty, students, suppliers, vendors, managers,
    or just interested parties. You have to listen—in person, on the phone, via email,
    via websites, through social media—and stay in touch with what is going on around
    you. You also need to put yourself into new situations, which forces you to examine
    and confront your existing paradigms; this is akin to gathering data and analyzing
    it. Be willing to hear, consider, and accept ideas from sources outside higher
    education.


    For example, consider “associating,” the discovery skill linked with innovators,
    which involves making connections across “seemingly unrelated questions, problems,
    or ideas.”⁶ Consider how you might stir the imagination by starting a discussion
    with your colleagues about such questions as: *How would Disney engage with our
    admissions process? How would Southwest Airlines cut our costs? How would Starbucks
    design our alumni relations program? How would Amazon register our students?*


    # EXPERIMENT AND TAKE RISKS



  img_proc: true
- pgno: 187
  md: 'directors, demographic differences of leadership practices within a historically
    black university, and so on. Moreover, researchers have looked at leadership in
    a variety of higher-education settings and environments; for example, public and
    private schools, secular and nonsecular campuses, two-year and four-year colleges,
    on-campus and online programs, as well as institutions inside and outside the
    United States.


    In this book are specific references to the research most directly applicable
    to higher education. This data and analysis draw on a subsection of the Kouzes
    Posner normative LPI database, a sample of more than 125,000 people in *higher
    education* who completed the LPI and provided information about themselves and
    how they feel about their organization and their leaders. Each chapter includes
    data about the impact of leadership on people and how consistently the most effective
    leaders in higher education are the ones who make the most frequent use of The
    Five Practices.


    In addition to the quantitative data, we collected Personal-Best Leadership Experience
    cases from more than 100 people in a variety of roles in higher education—president’s
    office, campus safety, library, athletics, student activities, housing, public
    safety, alumni relations, health centers, and other campus organizations and functions.
    Their stories and case studies bring the data to life. They show you more specifically
    what exemplary leadership practices and behaviors look like and the positive impact
    they have. They illustrate that leadership is not something available to only
    a few select leaders in an institution. They are evidence that leadership is a
    set of skills and abilities available to everyone on campus.


    We know from our research that the more frequently you put The Five Practices
    to use, the more effective you will be in bringing out the best in your group,
    department, and institution. The opportunity is there. The evidence is there.'

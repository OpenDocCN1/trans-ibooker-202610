  img_proc: true
- pgno: 32
  md: 'food to a sick colleague, visiting people in the hospital, or sending a handwritten
    note of appreciation—uplift the spirits and draw people forward. Jennifer Dirking,
    associate director for her community college’s foundation, says that she is always
    on the lookout for ways to foster a climate in which “people feel cared about
    and genuinely appreciated.”


    An award for the “most outstanding faculty member” used to be given each year
    at Barry Posner’s school. In those days he was a faculty member and said that
    he “could never understand how there could be one award, with so many disciplines,
    and, given each discipline’s different standards, how the faculty and dean’s office
    could decide on what ‘most outstanding’ meant.” So, when he became dean, Barry
    says,


    > I was determined we’d change the system and do more to recognize the excellence
    among our *many* faculty colleagues. Working with our Council of Department Chairs,
    we established a specific set of accomplishments, from unsatisfactory to exemplary,
    which were appropriate to all disciplines and all ranks. Any faculty member who
    could be exemplary in teaching and scholarship and service would certainly be,
    in any of our minds, “extraordinary”—and that’s what we called the award. We could
    all be proud when anyone in the school was extraordinary.


    In the first year, six Extraordinary Faculty Awards were given. Five years later
    13 were awarded. As Barry recalls, “I thought it was great that the standards
    hadn’t changed, but the behavior—and hence the performance—of our faculty had
    risen to the ideal we set. With this change in criteria for the award, we took
    a giant step in eliminating competition among ourselves for ‘who’s the best’ and
    rather collectively focused on what everyone needed to do to be at their best.”


    It is part of the leader’s job to show appreciation for people’s contributions
    and to create a culture of celebration. Over the years we’ve seen thousands of
    examples of individual recognition and group celebration, from handwritten thank-you
    notes to marching bands and “This Is Your Life” ceremonies.'

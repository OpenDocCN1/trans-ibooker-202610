- pgno: 48
  md: 'We grabbed one off the shelf and opened it to *care*. The first meaning: “suffering
    of mind: GRIEF.” There it was. Suffering and caring, discontent and concern—all
    come from one source. Deep within all of us, there is something we hold dear,
    something we’ll fight hard to secure and celebrate joyfully when we achieve it.


    In time we realized that what we both were saying is that *leadership begins with
    something that grabs hold of you and won’t let go.* Something isn’t working, and
    you care enough to change it. Finding your voice requires exploring your inner
    territory. You have to take a journey into your heart and soul to discover your
    values. You must wrestle with them enough to determine what’s really important
    to you, what’s underlying your choices and the boundaries and standards you set,
    and what motivates you to take the actions you do.


    You *must* know what you care about. You can be authentic only when you lead others
    according to the principles that matter most to you. Otherwise you’re just putting
    on an act. If you don’t care, how can you expect others to do so? If you don’t
    burn with desire to be true to something you hold passionately, how can you expect
    that commitment from others? And until you get close enough to the flame to feel
    the heat, how can you know the source?


    The fact is that the first person who must follow you is you! To lead others you
    first have to believe in yourself. If you do not, others will not believe in you
    or have confidence in you and consequently will not willingly follow your lead.³

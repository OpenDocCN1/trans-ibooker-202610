- pgno: 77
  md: 'The prospect excited her, and she could visualize in some detail how the program
    would operate and who might be involved in it. As she told us: “I could see students
    sitting in a class, listening to a faculty member talk with them about ethical
    dilemmas and slippery slopes. I could see small groups of students talking about
    how different cultural backgrounds influence our leadership behaviors. I could
    see students taking on more active roles in their organizations. I could see how
    excited students would be to get their certificates at our reception at the end
    of the program.” From her initial gut feeling—and lots of hard work—came a successful
    pilot program in which 50 students explored their leadership styles and developed
    leadership skills. Now, many years later, the project still makes Jo-Anne smile—and
    it continues on the campus, inspiring an ever-growing group of student leaders.


    Like Jo-Anne, many of the people we interviewed mentioned that the exercise of
    analyzing their Personal-Best Leadership Experiences was enlightening for them:
    by highlighting critical lessons from the past, they were able to generate insightful
    road maps for leadership highways still to be explored. The knowledge gained from
    direct experience and active searching, once stored in the subconscious, becomes
    the basis for leaders’ intuition, insight, and vision.


    Envisioning the future is a process that begins with an inspiration, a feeling,
    or a sense that something is worth doing. Your vision of the future may be fuzzy,
    but at least you’re focused on a meaningful theme. You believe that the present
    situation could be better than it is today. You act on your instincts, and the
    vision gets a little clearer. You do something else that moves you forward, and
    the vision gets clearer still. You pay attention to it, experience it, immerse
    yourself in it. You get the ball rolling, and over time you see more detail in
    your dream. It’s an iterative process, one that eventually results in something
    that you and others can articulate.'

    Another way to think about this is to imagine you’re driving along the Pacific
    Coast Highway heading south from San Francisco on a bright, sunny day. The hills
    are on your left, the ocean on your right. On some curves the cliffs plunge several
    hundred feet to the water. You can see for miles and miles. You’re cruising along
    at the speed limit, tunes blaring, top down, wind in your hair, and not a care

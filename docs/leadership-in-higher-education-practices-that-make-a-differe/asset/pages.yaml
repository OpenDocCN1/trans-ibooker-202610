- pgno: 103
  md: 'Richard’s experience illustrates that change, or learning, doesn’t typically
    happen overnight: it’s a step-by-step process. Leaders break projects, dreams,
    and aspirations into smaller pieces so that their constituents can make progress.
    An essential building block in achieving these small wins is soliciting feedback.
    When students volunteered to participate in trials, Richard’s team would make
    sure everyone understood that it was an experiment and that students and faculty
    were required to give feedback about their experiences. That information would
    be forwarded to the various academic committees, and they would make any necessary
    adjustments.


    Reflecting on the experience, Richard said, “So you do it small scale, you make
    sure it’s a trial, you take the feedback very seriously, and you spend a lot of
    time deliberating about what worked and what didn’t. And then you try it again
    and again.”


    Whether it was a success or a failure, Richard’s team constantly monitored what
    they were doing while they were doing it and after they had done it. He went on
    to explain: “We have an informal debrief, a more formal debrief, a formal debrief
    that involves the full evaluation, the final evaluation, and then the preliminary
    for the next delivery. We revisit that again, looking at the changes that are
    being made and planned as we go to the next time we deliver it. That is time-consuming,
    but that’s part and parcel of a constantly evolving program.”


    The academic community has always understood that major breakthroughs are likely
    the result of the work of scores of researchers, as countless contributions finally
    add up to a solution. Advances in medicine or biophysics, for example, often involve
    many experiments focused on various pieces of the problem. Likewise, taking the
    sum total—all the “little” improvements in technology regardless of the industry—has
    contributed to a more substantial increase in organizational productivity than
    all the great inventors and their inventions.⁹'

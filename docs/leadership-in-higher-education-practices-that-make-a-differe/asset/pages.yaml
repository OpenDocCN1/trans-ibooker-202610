    # Produce Social Capital


    The new currency of the information age and the IoT (Internet of Things) is not
    intellectual capital; it is *social capital*—the collective value of the people
    we know and what we’ll do for one another. When social connections are strong
    and numerous, there’s more trust, reciprocity, information flow, collective action,
    and even happiness.⁷ Therefore part of your personal agenda should be to get connected
    to the sources of information, resources, and influences you will need to make
    a difference. Make sure you also connect your colleagues and'

    # Learn from Mistakes


    There’s no denying that change and leadership involve taking risks, and with any
    uncertain action there are always, at a minimum, mistakes and, worse yet, failures.
    To be sure, failure can be costly. For the individual who leads a failed project,
    it can mean a stalled career or even a lost job. For the scholar, pursuing a new
    avenue of research may result in failure to receive tenure or a promotion. For
    the institute or center, it can lead to a loss of contracts and funding. For a
    dean or college president, it can mean a vote of no confidence.


    It is, however, absolutely essential to take risks. On the academic side, all
    scholarship, with its scientific method of hypothesis testing, is an experiment
    in risk-taking (with the goal of explaining variance or the unknown). On the staff
    side, few programs have ever become better by not doing anything different. Over
    and over again, people in our studies tell us how mistakes, setbacks, and even
    failures have played a role in their successes. Without those experiences, there
    would have been little to no learning, and they would have been unable to achieve
    their aspirations or discover breakthrough achievements.


    For instance, Lillas Marie Hatala, as a program director for her university’s
    continuing education division, told us about her first encounters with the dean

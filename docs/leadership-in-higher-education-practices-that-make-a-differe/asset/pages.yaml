  md: 'When people expect their interactions to continue into the future (e.g., they’ll
    run into one another at some campus event, they’ll continue to serve on this committee
    for several years, participate in a subsequent task force, attend another game
    or performance), they are much more likely to cooperate in the present. Knowing
    that you have to deal with someone in the future ensures that neither you nor
    they will easily forget about how you’ve treated one another. When future interactions
    are likely to be frequent, the consequences of today’s actions on tomorrow’s dealings
    are that much more pronounced. In the end, enduring relationships are more likely
    to produce collaboration than short-term ones, and you have every incentive as
    a leader to build such relationships for yourself and for the people in your department
    or program.


    Kelly, in fact, goes out of her way to deliberately walk around her campus, not

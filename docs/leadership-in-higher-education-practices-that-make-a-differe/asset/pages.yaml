  md: 'say is your top priority? Whether it’s faculty, students, staff, or alumni,
    the question is, *How much of your daily time do you spend with them?* When Jeanne
    O’Laughlin, OP, was president of a small religious university, her vision was
    to create a caring environment on campus. To back that up, she routinely stopped
    and talked with students she met as she walked across campus. The first day on
    the job, another college president pedaled to work on an old bicycle and chained
    it to the sign that said “President’s Car”—providing a simple statement about
    the values of sustainability and frugality.


    Leaders make obvious connections between how they allocate their time and what
    they consider to be their priorities and core values. What does it mean when the
    provost comes to a meeting of the student senate or conducts a meeting with students
    in the administration building versus the student union? What signal does it send
    when the vice president for business services comes to a school’s faculty meeting
    to discuss the budget rather than sending a budget analyst? If you say alumni
    are important, how much time goes by without meeting with them? If you say students
    are important, when’s the last time you sat in on a class, attended a student
    presentation, or joined in a student-sponsored event?


    Setting an example often means arriving early, staying late, and being there to
    show you care. Faculty members who show up early to their classes and linger afterward
    to answer questions and chat with students successfully communicate their own
    and their institution’s commitment to caring about students. Learning the names
    and areas of study and interest of the students who work in your office sets an
    example of how people should be treated—and valued—in the work-place, even if
    they are part-time or temporary.


    Calendars never lie when it comes to sending a message to others about how you
    prioritize your time and how this'

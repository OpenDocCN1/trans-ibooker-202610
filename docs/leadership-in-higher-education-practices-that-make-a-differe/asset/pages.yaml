  img_proc: true
- pgno: 132
  md: '> not giving them power per se but giving them an opportunity to create, to
    make decisions, and to feel that they are in control.”


    Research solidly backs up Lori’s and Mark’s viewpoint. Researchers have found
    that the more people believe that they have some degree of influence and control
    in their organization, greater organizational effectiveness and member satisfaction
    follow. Shared power results in higher job fulfillment and performance throughout
    the organization.[^10]


    When you make other people powerful, in both tangible and intangible ways, you
    are demonstrating profound trust in and respect for their abilities. When leaders
    help others grow and develop, that help is reciprocated. People who feel capable
    of influencing their leaders are more strongly attached to those leaders and more
    committed to effectively carrying out their responsibilities.[^11] They *own their
    jobs*, feeling and accepting accountability for their actions and results and
    being compelled in many ways to not let their leaders’ expectations and trust
    in them dissipate.


    # Provide Choices


    If you desire higher levels of performance and greater initiative, you must be
    proactive in designing work that allows people choice in what they do. In other
    words, they need to have *discretion*; that means being able to take nonroutine
    action, exercise independent judgment, and make decisions that affect how they
    do their work without having to check with someone else.



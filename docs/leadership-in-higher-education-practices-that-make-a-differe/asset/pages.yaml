    # CREDIBILITY IS THE FOUNDATION OF LEADERSHIP


    While the fact that what people look for in their leaders has remained consistent
    over time, despite the ever-shifting forces affecting higher education, there
    is another profound implication revealed by this descriptive data. These survey
    results have a solid conceptual foundation in what social psychologists and communication
    experts refer to as “credibility.” In assessing such questions as why some people
    are more believable than others, how reputations are formed, what constitutes
    opinion leaders, or what factors create role models, researchers have demonstrated
    that the key dimensions of credibility are remarkably similar to the four characteristics
    people most desire in their leaders.¹⁵


    If you are going to ask others to follow you to some uncertain future—a future
    that may not be realized in their tenure or even their lifetime—and if the journey
    is going to require hardships and possibly sacrifices, it is imperative that people
    believe in you, the person they will be following. The countless programs to develop
    leaders, the courses and classes, the books and CDs, the blogs and websites offering
    tips and techniques—all are meaningless unless the people who are supposed to
    be following believe in the person who’s supposed to be leading. The bottom'

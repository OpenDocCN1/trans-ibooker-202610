    > His fondest wish for the project, Kent told us, “was for students to return
    to campus with a new sense of passion and commitment to social justice. I hoped
    the trip would serve as the spark to ignite a lifelong exploration of commitment
    to others. I dreamed that these students would come away stronger, wiser, and

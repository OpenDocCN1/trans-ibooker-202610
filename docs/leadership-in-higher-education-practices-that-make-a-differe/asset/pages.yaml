    # Practice Positive Communication and Be Expressive


    To foster team spirit, breed optimism, promote resilience, and renew faith and
    confidence, leaders learn to look on the bright side. They keep hope alive. They
    strengthen their constituents’ belief that struggles today will produce a more
    promising tomorrow.


    People want leaders with enthusiasm, with a bounce in their step and a positive
    attitude, because this conveys that they’ll be participating in an invigorating
    journey. People with a can-do attitude are followed, not those cynics who give
    10 reasons why something can’t be done or who don’t make others feel good about
    themselves or what they’re doing. Naysayers only stop forward progress; they do
    not start it.


    Researchers working with neural networks have documented that when people feel
    rebuffed or left out, the brain activates a site for registering physical pain.⁸
    People actually remember downbeat comments far more often, in greater detail,
    and with more intensity than they do encouraging words. When negative remarks
    become a preoccupation, people’s brains lose mental efficiency. This is all the
    more reason for leaders to be positive. A positive approach to life broadens people’s
    concepts of future possibilities, and these exciting options build on one another.⁹
    In an affirming environment, people become more innovative and see more options.
    Those who enjoy more positivity are also'

  md: 'Leaders face a similar challenge: that mountain (a curriculum change, or shift
    in parking policy, or integration of marketing practices) looks much too high
    and difficult to climb; even taking the first few steps can’t be contemplated.
    Getting yourself and others to exchange old mind-sets and habits for new ways
    of thinking and acting is daunting. Even with the best intentions, people tend
    to revert to old and familiar patterns, especially in times of stress. Therefore
    leaders must get people to want to change the direction in which they’re currently
    headed on a one-step-at-a-time basis.⁷


    The most effective change processes are incremental; leaders break down big problems
    into small, doable steps and get the people around them to say yes numerous times,
    not just once. Successful leaders help others see how progress can be made by
    breaking down the journey into measurable goals and milestones. This was precisely
    the process Richard Hall, associate dean, employed when developing and launching
    a new executive MBA program, an education space the university had never entered.


    One of the most radical things they did, which had never been done before, was
    to integrate faculty from a variety of fields seemingly unrelated to a business
    education, such as philosophy, art, and music. The faculty stumbled a lot at the
    beginning of the program, as did the students, in sorting out what was happening
    and how they were to take responsibility for integrating the lessons and learnings
    across the various disciplines. Richard and his team referred to the multiple
    iterations of faculty and student efforts as “trials” and viewed each as a learning
    opportunity. The program’s eventual success was due to their ability to build
    on these trial experiences as a series of small wins. The methodology, Richard
    explained, was “trialing things wherever possible in bite-size chunks, on a small
    scale. Failing often, and failing fast, and being prepared to be as agile as we
    could and changing things as needed.”⁸'

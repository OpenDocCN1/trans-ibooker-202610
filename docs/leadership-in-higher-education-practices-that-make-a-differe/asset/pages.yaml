  md: 'Learning leads to little victories, which when piled on top of one another
    build confidence that people can meet even the most significant challenges. In
    so doing, leaders strengthen commitment to the long-term future.


    # Enable Others to Act


    Grand dreams don’t become significant realities through the actions of a single
    person. Leadership is a team effort, and to make extraordinary things happen in
    organizations exemplary leaders Enable Others to Act. They foster collaboration,
    developing relationships and building trust. Leaders engage all those who must
    make the project work—which was precisely the conclusion Charlie Slater reached
    when recounting his Personal-Best Leadership Experience of launching a new doctoral
    program. When asked who the leader was in developing this program, he quickly
    replied, “There was not a single leader but rather many leaders. At different
    times in the process, each one of them was critical. The program would not have
    come about without the leadership of all these people.”


    Leaders make it possible for the people around them to accomplish great things.
    They appreciate that those expected to produce at their most inspired levels must
    feel a sense of personal power and ownership. Charlie talked about how the university
    president, while favoring the idea, clearly understood that such an initiative
    couldn’t successfully be launched by executive fiat, so he passed along his blessings
    to the dean, who in turn asked Charlie, because of his background and positive
    working relationships with the faculty, to accept this leadership challenge. Charlie
    knew that such a program could not be developed and sustained through the efforts
    of a single champion, and he worked with myriad faculty colleagues within the
    school to bring this new program to life.'

    The Five Practices of Exemplary Leadership—which we introduce and briefly illustrate
    in this chapter and will discuss extensively in later ones—aren’t the private
    property of the people we studied or of a few select shining stars or unique personalities.
    They’re available to anyone, in any collegiate organization or situation, who
    accepts the challenge of taking people and organizations to places they have never
    been before.


    One of the greatest myths about leadership is that some people have “it” and some
    don’t. A corollary myth is that if you don’t have “it,” you can’t learn “it.”
    Neither could be further from the empirical truth.³ After reflecting on their
    Personal-Best Leadership Experiences, people typically come to the same conclusion
    as Tanvi Lotwala with the Carnegie Foundation for the Advancement of Teaching:
    “All of us are born leaders. We all have leadership qualities ingrained; all that
    we need is polishing them up and bringing them to the forefront. It is an ongoing
    process to develop ourselves as a leader, but unless we take on the leadership
    challenges presented to us on a daily basis, we cannot become better at it.”


    Furthermore, this leadership operating system has been widely studied and tested.
    Hundreds of scholars have applied The Five Practices of Exemplary Leadership framework
    to their investigation of leadership in higher education. From studies of college
    presidents,⁴ business and finance officers,⁵ deans and department chairs,⁶ student
    affairs and program administrators,⁷ athletic directors and coaches,⁸ librarians,⁹'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'and faculty,¹⁰ among others, numerous scholars have found these leadership
    practices closely correlated with organizational and professional effectiveness.


    Empirical evidence conclusively shows that those leaders in higher education who
    use The Five Practices most frequently have the most highly engaged and productive
    people in their departments and functions. According to surveys of their direct
    reports, exemplary leaders are more than six times more likely to employ The Five
    Practices in comparison with the frequency observed in the leaders of the least
    engaged direct reports. More specifically, the extent to which direct reports
    feel, for example, valued by their organizations, that they are making a difference,
    and that they are personally effective—all are directly related to how frequently
    they observe their leaders engaging in The Five Practices of Exemplary Leadership.¹¹


    # Model the Way


    Titles are granted; it’s your behavior that wins you respect. This sentiment was
    shared across all the cases we collected. Leaders Model the Way. They know that
    if they want to gain commitment and achieve the highest standards, they must be
    models of the behaviors they expect of others. You must first be clear about your
    guiding principles before you can hold them up for others to emulate. Once you
    are clear about your core values, you can give them voice, share them with others,
    and act on them. “It’s as straightforward,” Andy Ceperley* told us, “as never
    asking anyone else to do something you’re not willing to do yourself.”


    Andy has served in career services positions, both in the United States and abroad,
    experiencing a wide variety of academic institutions: public and private, secular
    and nonsecular, centralized and decentralized. In helping turn around one university’s
    career center, which had experienced substantial'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'staff turnover and burned out several directors, he explained how it was necessary
    for him to personally get “very deep into conversations with people across the
    campus.” He interviewed more than 50 people and asked tons of questions, listening
    attentively to their perceptions of the career center. In building relationships,
    Andy typically began by sharing his values and beliefs about what it meant for
    the career center to be a service organization and his experiences about how such
    a center effectively engages with the campus community. He made sure to facilitate
    similar reflective thinking on the part of every staff member in the career center.


    To effectively model the behavior they expect of others, as Andy noted, leaders
    must first be clear about their guiding principles. They must find their authentic
    voice, clearly and distinctively articulating their values. Because leaders are
    expected to stand up for their beliefs, they’d better have some beliefs to stand
    up for. By knowing what he valued most, Andy was better prepared to make decisions
    that were consistent with the principles he held dear. By itself, however, this
    isn’t enough. Leaders must also make sure that what they are doing is consistent
    with their values and standards.


    Leaders’ deeds are far more important than their words when demonstrating how
    serious they are about what they say. Words and deeds must be consistent; if they
    are not, hypocrisy spreads and cynicism grows. Like Andy, leaders need to go first
    and set an example through daily actions that provide evidence that they are deeply
    committed to their beliefs. One of the best ways they prove that something is
    important is by demonstrating it themselves. The model that leaders set with their
    actions is far more powerful than anything they say. Exemplary leaders walk the
    talk.


    # Inspire a Shared Vision'
  merge: -1
  img_proc: true
- pgno: 27
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 28
  md: 'To enlist people in a vision, leaders must know their constituents and speak
    their language. Similar to others we interviewed, Kelly knew that people must
    believe that leaders understand their needs and have their interests at heart
    before they will come on board. Leaders breathe life into the hopes and dreams
    of others and enable them to see exciting possibilities. Leaders forge a unity
    of purpose by showing constituents how the dream is for the common good. Leaders
    ignite passion in others by expressing enthusiasm for the compelling vision of
    their group, communicating their zeal through vivid language and an expressive
    style.


    # Challenge the Process


    Leaders are pioneers—people who are willing to step out into the unknown. They
    search for opportunities to innovate, grow, and improve. Every single personal-best
    leadership case we collected involved some change from the status quo. Not one
    person claimed to have achieved a personal best by keeping things the same—by
    doing what had always or had already been done. All leaders Challenge the Process.


    But leaders aren’t the only creators or originators of new curricula, programs,
    services, or processes. In fact, it’s more likely that they’re not: innovation
    comes more from listening than from telling, from asking questions and hearing
    what others are thinking and have to say. When challenging the process, the leader’s
    primary contributions are the recognition of good ideas, the support of those
    ideas, and the willingness to challenge the system to get new products, processes,
    services, and systems adopted. It might be more accurate, then, to say that leaders
    are *early adopters* of innovation.



- pgno: 58
  md: 'allocation aligns with your values and priorities—or not. Time, obviously,
    is a finite quantity, so make sure your distribution of it is in synch with where
    and what you want people to pay attention to. Don’t be too busy to take a moment
    to chat and get to know the people who work with, and around, you.


    # Turn Critical Incidents into Teachable Moments


    Choosing to spend time on core values is essential in sending the signal that
    you’re serious about an issue. But even the most disciplined leaders can’t stop
    the intrusion of the unexpected. There are constant interruptions, brief interactions,
    and extraordinary variety in everyday life on a college campus. Critical incidents—chance
    occurrences, particularly at a time of stress and challenge—offer significant
    moments of learning for leaders and constituents. Critical incidents present opportunities
    for leaders to teach valuable lessons about appropriate norms of behavior.


    Jim Lyons, dean of students, was always on the lookout for critical incidents
    that he called “teachable moments” for the campus. These were the times that something
    unexpected happened, usually (but not always) negative, and campus administrators
    had a leadership choice to make about how they wanted to frame and respond to
    the incident.


    For example, when a violation of the university’s honor code occurs (as it will
    inevitably), is the focus narrowly on dealing with students caught cheating or
    is it more broadly focused on bringing the entire campus community (students,
    faculty, and staff) into a discussion of what it means to have, and live by, an
    honor code? What does it mean to be responsible and accountable not just for your
    behavior but also for how others behave? Incidents will happen, and the question
    for leaders is more than what the punishment will be. It’s bigger than that. It’s
    about the lessons they want to teach as a result of their'

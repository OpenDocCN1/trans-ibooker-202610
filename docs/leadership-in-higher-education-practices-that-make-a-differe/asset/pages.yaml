  md: 'Mandela, Golda Meir, and Eleanor Roosevelt, to name a few. Another consistent
    thread that’s woven through the list of admired historical leaders is that they
    were all individuals who served during times of turbulence, conflict, innovation,
    and change. They’re people who triumphed against tremendous odds, who took initiative
    when there was inertia, who confronted tradition and the established order, and
    who mobilized people and institutions in the face of stiff resistance.


    Leadership and challenge are inextricably linked, just as leadership and principles
    are inextricably linked. The implication is crystal clear. The leaders people
    admire are ones who have the *courage of their convictions*. They expect their
    leaders to have values, but it’s even more essential that these leaders are willing
    to stand up for their beliefs during times of intense challenge and radical change.


    What gets *you* going in the morning, eager to embrace whatever might be in store

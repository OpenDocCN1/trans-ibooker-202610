  md: 'system itself, which required an additional term of work, by the end of the
    school year everyone was exhausted and in need of encouragement. The associate
    dean sent an email to the people working in the registrar’s office, asking for
    their feedback about the transition and inviting them to meet with her over coffee
    and talk informally about the transition process.


    Everyone had the opportunity to address the topics they felt strongly about, and
    all had equal and ample time to express themselves. No one felt pressured, and
    the staff felt free to voice their opinions without fear of retribution. The associate
    dean asked directly about what things they could do to provide students with faster
    and more accurate answers and to give students an enhanced, more hassle-free experience.
    Nicole commented that “not only did the associate dean’s questions keep us from
    taking a bath in the negative emotions we were feeling but they helped us refocus
    on our goals as an office.” Some of the dean’s questions had to do with making
    their jobs more efficient; others dealt with new systems that could be implemented
    to make procedures easier for both the students and the staff.


    Nicole went on to explain:


    She used these questions to affirm our shared values. She didn’t have to struggle
    to think of the questions she wanted to ask or how she would connect what we were
    discussing to our goals; her values were guiding her questions. As we talked I
    could tell she was leading me in a certain direction, but it didn’t seem manipulative.
    This was so much more powerful to me than reading about the values in the handbook.
    I was generating the answers to her questions, so I felt this is what I believe,
    not just what I am supposed to agree with. Not only did this meeting help our
    team individually generate answers that were in line with our values and the office’s
    values but it also helped us affirm our shared values as an office. We came out
    of that meeting more united and with the knowledge that we were all working to
    achieve the same thing instead of pulling against each other for time and attention.'

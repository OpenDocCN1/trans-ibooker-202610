- pgno: 43
  md: 'Tonya also believes that it is imperative that engineers communicate well because
    doing so not only ensures safety but also maintains project progress. She stresses
    the development of communication skills and demonstrates the same in her lectures.
    She begins class with an agenda or overview, informing students of her learning
    objectives and what she is going to cover. She takes care to ensure that her board
    notes are legible and clearly stated and that problem-solution handouts are easy
    to understand. “Everything I do must be clear long after the class session is
    over,” she says.


    Leaders like Tonya understand that they must fully comprehend the values, beliefs,
    and assumptions that drive them. They have to freely and honestly choose the principles
    they will use to guide their actions. Before you can clearly communicate your
    message, you must be clear about the message you want to deliver. And before you
    can *do* what you say, you must be sure that you *mean* what you say.


    Words themselves, however, aren’t enough, no matter how noble. You must find *your*
    voice and authentically communicate your beliefs in ways that uniquely represent
    who you are so that others recognize that you’re the one who’s speaking and not
    someone else. “Above all else, academic deans—and all leaders—must come to terms
    with themselves,” explains Deryl Leaming, former dean and the author of several
    books on academic leadership. “They must understand their own inclinations and
    motivations and be comfortable with who they are.”¹



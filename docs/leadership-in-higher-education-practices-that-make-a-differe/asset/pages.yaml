  md: 'constituents in conversations about values issues. After all, if there’s no
    agreement about values, what exactly is the leader—and everyone else—going to
    model?


    Shared values must be more than campus or program advertising slogans. They must
    be genuinely supported and broadly endorsed. Faculty and staff must be able not
    only to enumerate the values but also to provide relatively common interpretations
    of how those values are put into practice. They must know how the values influence
    the way they teach, address issues, recruit faculty, hold ceremonies, provide
    services to students and alumni, and so on. They must also know how these values
    contribute directly to making their college or university unique and distinctive.


    Shared values emerge from listening, appreciating, and building consensus. We
    observed one student union director who spent his first months going around both
    the building and the campus, talking with people. He listened as people told him
    about what was working and what needed improvement or fixing. In these conversations
    he also had an opportunity to share information about himself, his values, and
    his experiences on other campuses. When changes were made, he referenced them
    against much of what he had heard in these conversations, and people could tell
    that he had been true to his promise to listen and be responsive.


    For people on campus and within various departments and programs to understand
    the values and come to agree with them, they must participate in the process.
    A unified voice on values results from discovery and dialogue: unity is forged,
    not forced. You must provide a chance for people within your department, program,
    or unit to engage in a discussion of what the values mean and how their personal
    beliefs and behaviors are influenced by what the institution stands for.'

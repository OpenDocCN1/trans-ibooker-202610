- pgno: 167
  md: '# Leadership Is Everyone’s

    Business


    Beyond the leadership practices, and beyond the essential behaviors, actions,
    and reflections, there is another fundamental truth about leadership that you
    should appreciate: *leadership is every-one’s business.* This is as true in institutions
    of higher learning as it is in manufacturing, high technology, health care, government,
    military services, and nonprofit agencies. Regardless of organization, function,
    discipline, or over time and geography, the best leaders understand this reality.
    No one is at his or her personal best as a leader without involving others in
    making the extraordinary happen.


    While serving as dean, John Seybolt came to have a clear view of his school’s
    future. He knew that given the extremely high competition for outstanding faculty,
    the school needed major new sources of external funding. As he told us, “My fondest
    dream at the time was that we would receive a significant endowment for the school,
    giving it the freedom and flexibility to fund people and projects that could really
    make a difference. I also dreamed that because of these gifts, people would ‘stand
    up and take notice’ of the school and its potential.” The school had long been
    referred to as “a hidden treasure.” John countered that statement by pointing
    out that “a hidden treasure is just that—*hidden*—and that’s not what we want
    to be.”'

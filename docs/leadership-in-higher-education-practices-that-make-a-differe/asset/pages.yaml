    # Develop Friendships


    Managerial myth says you shouldn’t get too close to your colleagues, that you
    can’t be friends with people at work. Well, set that myth aside. Over five years
    researchers observed groups of friends and groups of acquaintances (people who
    knew each other only slightly) performing motor-skill and decision-making tasks.
    The results were unequivocal: The groups composed of friends completed, on average,
    more than three times as many projects as the groups consisting merely of acquaintances.
    Regarding decision-making assignments, groups of friends were more than 20 percent
    more effective than groups of acquaintances.¹²


    There is an important caveat, however: friends have to be firmly committed to
    the group’s goals. If not, friends may not do better than anyone else. This is
    precisely why it is necessary that you are clear about standards and create conditions
    of shared vision and values. When it comes to performance, commitment to standards
    and good relations between people go together.


    People are more willing to follow someone they like and trust. Becoming fully
    trusted, as previously noted, requires that you ante up first by being open yourself:
    open to others and open *with* others. Just as an open door is a physical demonstration
    of a willingness to let others in, an open heart is an emotional demonstration.
    This means letting others know more about you —what you care about, why you make
    the choices you do, and so forth. We don’t mean tabloid-style disclosures. We
    mean talking about your hopes and dreams, your family and friends, your interests
    and pursuits—the same things you’d like to know about them.'

  md: 'leaders with an enduring focus on long-term outcomes. Research shows that grittiness
    is associated with those individuals who most often Challenge the Process.<sup>12</sup>


    Moreover, the ability to grow and thrive in stressful, risk-abundant situations,
    such as the one that Karen and her colleagues faced, is highly dependent on how
    you view change. Psychologists, intrigued by people who experience a high degree
    of stress and yet are able to cope with it positively, have discovered that these
    individuals have a distinctive attitude toward stress, which they call “psychological
    hardiness.”<sup>13</sup> Researchers over the past 40 years have found that in
    groups as diverse as corporate managers, entrepreneurs, students, nurses, lawyers,
    and combat soldiers, those high in psychological hardiness are much more likely
    to withstand serious challenges and bounce back from failure than those low in
    hardiness.<sup>14</sup> And the good news is that hardiness is an attitude that
    people can learn and that leaders can support.


    There are three key beliefs to being psychologically hardy: *commitment, control,*
    and *challenge.* All were evident in Karen’s personal-best leadership case study.
    To turn adversity into advantage, first you need to commit yourself to what’s
    happening. You have to get involved, engaged, and curious. You can’t sit back
    and wait for something to happen. When you commit, you find in whatever you are
    doing something that seems interesting, meaningful, or worthwhile. You also have
    to take control of your own life. You need to attempt to influence what is going
    on. While all of your attempts may not be successful, you can’t sink into powerlessness
    or passivity or victim-hood. You can’t engage in denial or feel disengaged, bored,
    and empty. Finally, if you are going to be psychologically hardy, you need to
    view challenge as an opportunity to learn from both negative and positive experiences.
    You can’t play it safe. Personal improvement and fulfillment come through the
    continual process of being engaged in the uncertainties of life.'

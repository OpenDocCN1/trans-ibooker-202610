- pgno: 55
  md: 'You must also be prepared to discuss values and expectations in the recruitment,
    selection, and orientation of new people to your team, department, or program.
    On this exact point, a research center Fellow lamented that “values are, unfortunately,
    often communicated very poorly, not just in academia. They become another item
    to check off the list, along with how to fill out forms for parking, selecting
    health-care options, and where to get office supplies. With so many tasks to accomplish,
    discussion of values and beliefs often falls by the wayside.” He believed that
    values “cannot be defined and then set aside to gather dust. They need to be lived
    and their importance demonstrated overtly in decisions.”


    # LEAD BY EXAMPLE


    Leaders *enact* the meaning of the organization in every decision they make and
    in every step they take toward the future they envision. Leaders understand that
    they bring shared values to life in a variety of settings—in weekly department
    meetings, one-on-one conferences, donor telephone calls, faculty and staff council
    sessions, and visits with alumni, vendors, suppliers, and community members. For
    example, the data in figure 2.2 shows that the more often leaders are observed
    setting a personal example of what they expect of others, the more their direct
    reports indicate that they trust management.


    How you spend your time, how you react to critical incidents, the stories you
    tell, the questions you ask, and the language you use—all are leadership tools
    for setting an example. How you apply these tools should not be haphazard and
    left to chance. Although serendipity may play a role, you must continuously be
    on the lookout for ways to establish yourself as a leader by demonstrating how
    core beliefs shape and govern your actions.


    Modeling the way may appear rather basic and obvious, but it’s all in the attention
    and the doing. Each tool enables you to make'

  md: '# CHAPTER 2

    # Model the Way


    Tonya Nilsson, a senior lecturer in the civil engineering department, recalls
    that her mother, who was a manager at a local library, would often remark that
    “she would never ask her employees to do something she wouldn’t be willing to
    do herself.” This mantra is firmly ingrained in Tonya, who feels that it isn’t
    right for her “to judge someone for being an ineffective teacher and for being
    unwilling to step it up if I am not willing to model better teaching myself.”
    This is just one of the reasons why Tonya routinely equips herself with various
    teaching tools to better engage with her students and participates in university
    committees focused on improving student learning. In these venues she shares her
    values and beliefs with colleagues and encourages them to use more-effective teaching
    methods. She believes that all teachers are leaders who should not restrict themselves
    to merely managing content delivery but should also be nurturing and prepare the
    next generation of engineers and scientists.


    Tonya makes sure that she aligns her values and actions in her own classroom.
    For example, she believes that one way teachers demonstrate respect for their
    students is by starting class on time. She makes it clear at the onset of her
    courses that being late for class is unacceptable. She holds quizzes at the very
    beginning of class to make the point that being late can have negative consequences.
    She follows this up in her own actions by indicating that she’ll give students
    extra points if she is ever tardy.'

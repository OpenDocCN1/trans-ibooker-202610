- pgno: 64
  md: 'To commit to doing something without the capacity to perform it is either disingenuous
    or stupid. There’s nothing courageous about boldly saying you’ll successfully
    launch a new curriculum or turn around a residential learning community if you
    have neither the skills nor the resources to do it. Leaders must be aware of the
    degree to which they have the capabilities to do what they say. And if they lack
    the competence, they must dedicate themselves to continuous learning and improvement.


    This is something Jackie kept firmly in mind when working with the students on
    the conference. As she said, “I shared my own learnings with the students—including
    past mistakes—and I was willing to change direction based on new information.”
    She made sure that she was part of the learning community and, rather than frame
    herself as an expert, she acknowledged areas (student culture and schedules, as
    just two examples) about which the students knew more and could teach her.


    Acquiring competence involves being honest with yourself about your abilities.
    People who exaggerate their abilities to perform a task or achieve a goal, or
    who inflate their claims of possessing admirable qualities or desirable material
    goods, are called phonies and fakes and are seldom followed for very long. Your
    value as a leader is determined by your guiding beliefs and your ability to act
    on them.


    To be genuine requires that you honestly and continuously assess your existing
    capabilities and are willing to learn new ones. Keep in mind that left untended,
    everyone’s skills and abilities, like any other asset, deteriorate over time.
    And it should come as no surprise to anyone on a college campus that learning
    takes time and conscious attention. If leaders expect others to do things that
    they have never done before, which is the basis for any improvement or innovative
    effort, fostering a climate in which people can learn and be unafraid to admit
    what they don’t know is essential. Such a climate occurs only in those'

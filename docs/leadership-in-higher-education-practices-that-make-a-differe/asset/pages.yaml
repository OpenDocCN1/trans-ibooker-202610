  md: 'disciplined for honor codes violations, misconduct by alumni donors is overlooked,
    staff are maligned, colleagues are denigrated—they conclude that the leader is,
    at best, not really serious or, at worst, an outright hypocrite. When leaders
    do practice what they preach—and do so consistently—people are more willing to
    entrust them with their careers, their security, and their future.


    This realization leads to a straightforward prescription for establishing credibility:
    *DWYSYWD*, or *Do What You Say You Will Do*. This commonsense definition of credibility
    corresponds directly to the leadership practice of Model the Way. To Model the
    Way and be credible in action, you must be clear about your beliefs; you must
    know what you stand for. That’s the *say* part of DWYSYWD. Then you must put what
    you say into practice: you must act on your beliefs and *do*. It is when leaders’
    words and deeds match up that people see them as believable and credible. To be
    authentic, to gain and sustain the moral authority to lead, is essential to the
    practice of Model the Way.


    Because of this important connection between words and actions, we begin discussing

- pgno: 61
  md: 'Judith Ramaley, a former biology professor and university president, suggests
    that aspiring leaders can become good storytellers by inviting members of their
    college community to tell them about the good things that are happening and what
    they believe contributes to the quality of the institution. Armed with this material,
    she says, “you can be a storyteller…and your stories will help create meaning
    and direction for the institution.”⁷


    When a leader is trying to communicate the values of an organization, what would
    have more of an impact: a policy statement that says “Thou shalt establish personal
    relationships with alumni” or a story about the dean attending the Alumni Association’s
    monthly TGIFs? Similarly, what would be more persuasive: seeing statistics about
    how much stress students experience while at college or hearing a story about
    a student on your campus—who might have been in your class or worked in your office—who
    had committed suicide? If you said the story, your answer is consistent with the
    data. In fact, information is more quickly and accurately remembered when it is
    first presented in the form of an example or a story, especially compared with
    facts, figures, and formal policy pronouncements.⁸ Stories are far better able
    to accomplish the objectives of teaching, mobilizing, and motivating than bullet
    points on an overhead. Well-told stories reach inside people and pull them along.
    They give everyone the sense of being there and of learning what is really important
    about the experience.


    # Choose Words and Questions Deliberately


    It’s been said that people are “prisoners” of their organizational vocabulary.⁹
    If you disagree, try talking about the personnel in your college or university
    for even a day without using the words *employee, manager, boss, supervisor, staff,
    subordinate,* or *hierarchy*. We’ve all come to accept certain words as the'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'reality of organizational life. Those words can trap you into a particular
    way of thinking about your roles and relationships.


    Leaders understand the power of words and are attentive to language. The words
    we choose to use are metaphors for concepts that define attitudes and behaviors,
    structures and systems. Our words evoke images of what we hope to accomplish and
    how we expect people to behave. Too often on college campuses, some people hold
    tightly to designations that set them apart—and frequently above—others. Such
    distinctions make it challenging to find common ground.


    Consider the simple shift in language and meaning when the vernacular *extracurricular*—describing
    those activities on campus directed by the student affairs divisions—was dropped
    in favor of *co-curricular*, recognizing the holistic notion of the educational
    and learning process on campus. The shift in thinking on college campuses from
    building “dormitories” to establishing “residential learning communities” is another
    effort in this same direction. This shift in language changes how many staff members
    and faculty understand the role they play on campus in the education of young
    men and women.


    Questions too are quite powerful ways to focus attention. Just like professors
    do in a classroom with students, when leaders ask questions they send people on
    mental journeys—quests—in search of answers. The questions that leaders ask send
    messages about what’s most important to them and reinforce the focus of their
    department or program. Questions constitute one more measure of how serious you
    are about your espoused beliefs; the nature and substance of your questions reveal
    the values that should be attended to and how much energy should be devoted to
    them.


    The importance of raising questions was a key leadership insight for Jackie Schmidt-Posner
    in her job in the public'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'service center and as the institutional adviser for a large student-run conference.
    She purposefully asked questions that “brought the student coordinators back to
    the vision and purpose of the project. Once they had their eye on the ball, they
    could develop the necessary strategies.” Jackie realized that a significant part
    of her role was often “to focus the group through asking the tough questions.”
    Think about how your questions can frame the issue and set the agenda.¹⁰


    Questions can help people escape the trap of their own paradigms by broadening
    their perspectives and enabling them to take responsibility for their own viewpoints.
    Asking questions can do the same for you. The process forces you to listen attentively
    to the people around you and what they are saying. This action demonstrates your
    respect for their ideas and opinions. If you are genuinely interested in what
    other people have to say, you need to ask their opinion, especially before giving
    your own. Asking what others think facilitates their participation in decision-making
    and often increases support for the resulting choice. Asking the right questions
    reduces the risk that a decision might be undermined by either inadequate consideration
    or unexpected opposition. Of course, you must not only listen to their responses
    but also be open to giving their feedback serious consideration in subsequent
    decisions. Sincerity must underlie the asking.


    # Develop Your Competence


    Words alone do not make a leader credible. Having a clear and authentic message
    is a necessary first step, but the ability to consistently deliver the message
    and act on it requires a high level of skill. Before you can do the right things,
    you have to know how to do them. You cannot do what you don’t know how to do,
    no matter how moral or noble the purpose and regardless of whether others affirm
    the direction.'

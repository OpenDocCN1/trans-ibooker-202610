- pgno: 46
  md: 'As Lillas’s story illustrates, values are your guides, your personal bottom
    line. They equip you with a moral compass by which to navigate the course of your
    daily life. Clarity of values is essential to discerning which way is north, south,
    east, and west. The clearer you are, the easier it is to stay on the path you’ve
    chosen. You especially need this kind of guidance in difficult and uncertain times.
    When there are daily challenges that can throw you off course, it’s crucial that
    you have some signposts that tell you where you are and keep you on track.


    Values also serve as guides to action. They inform your decisions on what to do
    and what not to do, as well as when to say yes or no and understand *why* you
    mean it. If you believe, for instance, that heated debate can stimulate thinking
    and creativity, you should know what to do if people with differing views keep
    getting cut off when they offer up a fresh idea. If you value collaboration over
    individualistic achievement, you’ll know what to do when your most experienced
    career center adviser skips team meetings and refuses to share information with
    colleagues. If you value independence and initiative over conformity and obedience,
    you’ll be more likely to speak up and challenge a policy when you think it’s wrong.


    As the data in *figure 2.1* shows, there is a dramatic relationship between how
    people rate the effectiveness of their leaders and the extent to which they find
    them clear about their leadership philosophy. Only 3 percent of people rate as
    effective those leaders who are viewed as almost never/rarely being clear about
    their personal leadership philosophy; the effectiveness percentage goes up by
    a factor of more than 30 for those leaders reported as very frequently/almost
    always clear about their leadership philosophy.'

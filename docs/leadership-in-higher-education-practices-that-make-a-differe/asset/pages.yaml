  md: '# Challenge the Process


    WHEN KIM LOEB BECAME EXECUTIVE DIRECTOR of Professional, Applied and Continuing
    Education (PACE), the program was small and losing money. She immediately set
    about restructuring PACE by overhauling programs and courses that hadn’t been
    updated in decades, refocusing initiatives on student services and bringing in
    professional development resources to ensure that her team was working to full
    capacity. Within five years Kim’s program offered more than 600 full- and part-time
    programs, courses, and workshops. It recruited students from more than 30 different
    countries and generated over $1 million in revenue. “People say it’s so great
    your university sends you on international recruitment trips,” Kim told us. “But
    no; they don’t send me. We create these opportunities.”


    Much of the credit for PACE’s new directions is due to Kim’s encouraging her team

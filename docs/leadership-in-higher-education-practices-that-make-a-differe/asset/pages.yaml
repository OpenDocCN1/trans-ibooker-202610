- pgno: 15
  md: '# Preface


    LEADERSHIP IN HIGHER EDUCATION: *Practices That Make a Difference* is about how
    people on college and university campuses mobilize others to want to struggle
    for shared aspirations and make extraordinary things happen. It’s about the behaviors
    that leaders use to transform values into actions, visions into realities, obstacles
    into innovations, segments into solidarity, and risks into rewards. It’s about
    exercising leadership that creates the climate in which people work together to
    turn challenging opportunities into remarkable successes.


    College and university leaders can and do make a difference in the strength of
    their institutions. Many, in fact, assert that leadership, more than any other
    single factor, will determine the future vitality of higher education.¹ Goldie
    Blumenstyk, a senior writer at *The Chronicle of Higher Education*, notes that
    “cruise-control leadership is no longer an option” and that a balance is needed
    between knee-jerk reactions to the latest trend and flat-footed reluctance to
    go after real opportunities.² Not only are there no shortages of challenges facing
    people involved in institutions of higher education but the opportunities for
    providing leadership within them are also available to everyone, every day.


    # WHO SHOULD READ THIS BOOK?


    The fundamental purpose of this book is to assist people throughout the higher-education
    community in leading others to places they have never been before. Leadership
    matters whether you are a faculty member, department chair, program director,
    dean, vice president, or president. Likewise, leadership'
  merge: -1
  img_proc: true

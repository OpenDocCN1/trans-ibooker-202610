- '## CHAPTER 2

  ### Model the Way


  Tonya Nilsson，土木工程系的高级讲师，回忆起她的母亲曾是一家当地图书馆的管理者，母亲经常说“她永远不会要求员工做她自己不愿意做的事情”。这句座右铭深深植根于
  Tonya 的内心，她认为“如果我自己不愿意以身作则地示范更好的教学，就不应该评判某人教学无效且不愿提升自己”。这只是 Tonya 原因之一，她会定期为自己配备各种教学工具以更好地与学生互动，并参与专注于改善学生学习的大学委员会。在这些场合，她与同事分享自己的价值观和信念，并鼓励他们使用更有效的教学方法。她认为所有教师都是领导者，不应仅限于管理内容传授，还应培养并为下一代工程师和科学家做好准备。


  Tonya 确保自己在自己的课堂上将价值观与行动保持一致。例如，她认为教师尊重学生的一种方式就是准时开始上课。她在课程开始时就明确表示迟到是不可接受的。她在上课一开始就进行测验，以说明迟到可能带来负面后果。她在自己的行动中也贯彻这一点，表示如果她迟到会给学生加分。


  Tonya 还认为工程师必须善于沟通至关重要，因为这不仅确保安全，也维持项目进展。她强调沟通技能的发展，并在讲座中以身作则。她上课时先给出议程或概述，告知学生她的学习目标和将要讲解的内容。她会确保板书清晰易读，问题-解决方案讲义易于理解。“我所做的一切必须在课程结束后很长时间仍然清晰，”她说。


  像 Tonya 这样的领导者明白，他们必须充分理解驱动自己的价值观、信念和假设。他们必须自由而诚实地选择将用于指导自己行动的原则。在你能够清晰传达信息之前，你必须明确自己想要传达的信息。而在你能够
  *do* 你所说之前，你必须确保你 *mean* 你所说。


  然而，仅靠言语是不够的，无论多么高尚。你必须找到 *你的* 声音，并以真实、独特代表你自己的方式传达你的信念，以便他人认识到说话的人是你，而不是别人。“最重要的是，学术院长——以及所有领导者——必须正视自己，”Deryl
  Leaming，前院长、学术领导力多部著作的作者解释道。“他们必须了解自己的倾向和动机，并对自己是谁感到自在。”¹


  在高等教育中最有效的领导者是那些最频繁地“以身作则”的人。我们询问直接下属他们的领导者在《领导力实践问卷》（LPI）中与“以身作则”相关的六种行为的参与频率，评估范围从
  1（几乎从不）到 10（几乎总是）。我们还询问了他们一个单独的问题，关于


  被招募到初创运营部门担任大型公立大学商业与领导力项目的总监。


  像任何新领导者一样，Lillas 意识到她“必须赢得可信度。在任何组织中，建立可信度是一个需要时间、努力、奉献和耐心的过程。”此外，她意识到作为高等教育领域的外来者进入会尤其困难，因为人们对意图和能力可转移性存在怀疑。在她的案例中情况更甚，因为她最初的项目之一是为系主任开发领导力发展项目。想象一下他们的嘀咕：*一个来自零售业的人怎么可能帮助培养学术界人士的技能？*


  > “在最初几年，”Lillas 说，“一些唱反调的人嘲笑我的工作，说‘你在谈论商业，而这是一所大学’，或‘你不能赶猫群’，或‘别搞花哨的’，等等。尽管当时有些痛苦，但这不仅带来了挑战，还促使我坚持下去……它强化了我为建立比我所经历的更鼓舞人心、更有支持性的文化做出贡献的意图。”


  在整个具有挑战性的项目中，Lillas 依靠一种简单的方法来帮助她坚持下去。每天她都用个人日记写作进行反思和沉思。“我用日记与内心的微小声音对话，”她说。“每晚我都会问，*我今天做了什么来体现我珍视的这一价值观？我无意中做了什么来表明这对我来说不是价值观？我需要做更多什么来更充分地表达我的价值观？*”通过每天澄清和重申自己的价值观，Lillas
  能够增强自己在机构文化以及人们相互关系和尊重方面的决心。


  正如 Lillas 的故事所说明的，价值观是你的指南，是你个人的底线。它们为你提供道德罗盘，帮助你在日常生活中航行。价值观的清晰对于辨别东西南北至关重要。你越清晰，坚持所选道路就越容易。在困难和不确定的时期，你尤其需要这种指导。当日常挑战可能让你偏离航向时，拥有一些路标来告诉你所在的位置并保持在正轨上至关重要。


  价值观也作为行动的指南。它们指导你关于做什么和不做什么的决定，以及何时说 yes 或 no 并理解 *为什么* 你是认真的。例如，如果你相信激烈的辩论可以激发思考和创造力，你就应该知道当持不同观点的人在提出新想法时不断被打断时该怎么做。如果你更重视协作而非个人主义成就，你就会知道当你经验最丰富的职业中心顾问跳过团队会议并拒绝与同事分享信息时该怎么做。如果你更重视独立和主动性而非一致性和服从，你就更有可能在认为政策错误时站出来并挑战它。


  正如 *figure 2.1* 中的数据所示，人们对领导者有效性的评价与其认为领导者对其个人领导哲学是否清晰之间存在显著关系。只有 3% 的人认为那些几乎从不/很少对其个人领导哲学清晰的领导者是有效的；对于那些被认为非常频繁/几乎总是对其领导哲学清晰的领导者，有效性百分比上升了超过
  30 倍。






  ![](img/7ddf49e8d8cd889f8f7c75097442c3e0_47_0.png)


  图 2.1 领导者的效能评级随着他们被视为拥有清晰领导哲学的程度而系统地提高。


  ## 探索你的内心疆域


  我们之前谈到领导力从何开始，我们的对话大致如下：


  吉姆：我认为领导力始于不满。你对现状、对事情当前的发展方式感到不满意。


  巴里：没错，但对我来说这种看法过于阴郁。我认为领导力实际上始于在乎。你在乎什么，才会去看它能否变得更好？


  吉姆：好吧，那我们查一下字典里“在乎”这个词的意思。


  我们从书架上拿下一本词典，翻到 *在乎* 这个词条。第一个释义是：“内心痛苦：悲伤。” 就是这样。痛苦与在乎、不满与关切——都源于同一个源头。在我们每个人的内心深处，都有一些珍视的东西，我们会努力去守护它，并在达成时欢欣庆祝。


  后来我们意识到，我们俩其实说的是同一个意思：*领导力始于某种紧紧抓住你、让你无法放手的东西。* 有些事情不对劲，而你在乎到愿意去改变它。找到自己的声音，需要探索你的内心疆域。你必须踏上一段深入心灵与灵魂的旅程，去发现你的价值观。你必须与这些价值观充分角力，才能确定什么对你真正重要、什么是你的选择以及你所设定的边界和标准背后的根基、什么驱使你采取行动。


  你*必须*知道自己在乎什么。只有按照对你最重要的原则去领导他人，你才是真实的。否则你只是在演戏。如果你自己都不在乎，又怎能期待别人在乎？如果你没有对心中热切坚持之事保持真诚的强烈渴望，又怎能期待他人也作出这样的承诺？而如果你不曾靠近火焰去感受热度，又怎会知道火源在哪里？


  事实上，第一个必须追随你的人就是你自己！要领导他人，你首先必须相信自己。如果你不相信自己，别人就不会相信你或对你有信心，因而也不会心甘情愿地追随你的领导。³ 一位职员告诉我们，她很少能像她所说的那样与主管“达成共识”，因为她觉得无法了解主管的主张：“我不确定他真正觉得重要的是什么，因此对他的建议犹豫不决。”
  与此观察形成对照的，是一位即将上任的系主任的认识。他意识到：“我希望在教职员工身上看到的任何改变，都必须从我开始，因为我是他们的榜样。如果我要实施的任何事情我自己都不先相信，同事凭什么相信？如果我没有展现出我期望他人具备的价值观，他们为什么要追随我或这些价值观？”


  艾伦·格拉斯曼（Alan Glassman）在接受了大学校长的请求，在一场自然灾害摧毁了校园大部分建筑后领导该校首个战略规划流程时，他自己也不得不探索这样的问题。为什么艾伦会接受这个邀请，尤其是在几位“高薪且资历过硬”的外部顾问已被项目解聘之后？艾伦解释说，他之所以迎接这一挑战，是因为他感到自己“想要回馈一个在职业生涯中一直对我支持有加的校园”。此外，他说，这也是一个机会，让他亲身参与并见证“一种高参与度的组织变革框架”的创建和发展，而这一框架正是他在课堂上讲授多年的内容。


  这段经历不仅考验了他的信念体系，也考验了他能在多大程度上以身作则地示范自己的期望。他设计了一个高参与度的流程，让教职员工有机会为学校“创造未来”。通过唤起人们回馈校园的愿望，艾伦“为志愿者创造了站出来提供服务与观点的空间”。这一过程印证了艾伦最深刻的价值观之一：只要有机会，人们就会作出贡献，做正确的事。


  和艾伦一样，人们从他们的“最佳领导经历”中发现，成为一位可信的领导者，需要学会以独一无二的方式表达自己。你无法用别人的价值观、别人的话语来领导。你无法凭借别人的经验来领导。你只能凭借自己的经验。如果那不是你的风格、你的话语，那就不是你，而是一种抽象。


  说出你的话语是一回事，而以合宜的调子并带有个人风格地表达出来则是另一回事。如果你不是真材实料，怎能期望别人尊重你？人们追随的不是你的技巧，而是*你本人*——你的讯息，以及你对这讯息的体现。要成为领导者，你必须亲自面对这个核心问题。你不必模仿别人，不必照本宣科地读别人写的脚本，也不必套用别人的风格。相反，你可以自由选择你想表达的内容以及你表达的方式。我们认为，你有责任以独特的方式向你的追随者表达自己——一种他们一眼就能认出是你的方式。研究人员一贯证明，领导者对一套核心价值观的清晰度和承诺与其成功的可能性之间存在显著关系。⁴


  ## 建立并确认共同价值观


  清晰地了解个人价值观是找到自己声音的重要一环。领导者不仅仅坚持某些个人的或独特的价值观。在以身作则的过程中，领导者努力引导其追随者从“*我*相信”走向“*我们*相信”。换句话说：说到做到。领导者的承诺实际上就是组织的承诺，无论这个组织是一个两人的团队、一个
  15 人的部门、一个涉及数百人的项目，还是一所数千人的学校。


  尼科尔·马图克（Nicole Matouk）是法学院的一名学生记录分析师。当时，大学正在进行从学期制到学季制的重大转轨。由于转轨前需要进行大量准备工作——例如全面改造计算机系统——而且学季制本身又需要多出一个学期的工作量，到学年结束时，所有人都精疲力竭，迫切需要鼓励。副院长给注册处的工作人员发了一封邮件，征求他们对这次转轨的反馈，并邀请他们与她一起喝咖啡，非正式地聊一聊转轨过程。


  每个人都有机会谈论自己深有感触的话题，也都有平等而充足的时间表达自己。没有人感到压力，工作人员可以畅所欲言，不必担心遭到报复。副院长直接询问，他们可以做些什么来为学生提供更快、更准确的答案，并让学生获得更好、更省心的体验。尼科尔评论说：“副院长的提问不仅让我们没有沉溺于负面情绪之中，还帮助我们把注意力重新集中在作为办公室的目标上。”
  院长的一些问题涉及如何提高工作效率；另一些则涉及可以实施哪些新系统来让学生和工作人员的程序都变得更简便。


  尼科尔接着解释道：


  她用这些问题来确认我们的共同价值观。她不需要费力去想该问什么问题，或思考如何把我们讨论的内容与我们的目标联系起来；是她的价值观在引导她的提问。在我们交谈时，我能感觉到她在引导我走向某个方向，但并没有操控的感觉。这对我来说，比在手册中读到那些价值观要有力量得多。我是在自己生成她问题的答案，所以我觉得这就是我相信的东西，而不只是我理应认同的东西。这次会议不仅帮助我们的团队成员各自生成与我们的价值观和办公室价值观一致的答案，还帮助我们确认了我们作为整个办公室的共同价值观。我们开完会后更加团结，并且明白我们都在为实现同一个目标而努力，而不是为了时间和关注而彼此拉扯。






  妮可的经历再次证实，当人们相信自己的价值观与组织的价值观一致时，他们会更加忠诚和投入。他们可以更具创造力和参与感，因为他们沉浸在自己所做的事情中。当校园里的人们感到他们拥有共同的价值观时，沟通的质量和准确性以及决策过程的完整性都会提高。


  发现并肯定共同的价值观是建立富有成效和真诚的工作关系的基石。虽然可信赖的领导者尊重其众多利益相关群体的多样性，但他们也强调共同的价值观。领导者建立在共识之上。他们不会试图让每个人在所有事情上都达成一致——这一目标是不现实的，甚至可能是不可实现的。而且，要实现这一目标将否定多样性本身的优势。但要迈出第一步，然后第二步，再然后第三步，人们必须拥有某种共同的核心理解。如果对基本价值观的分歧持续存在，其结果就是激烈的冲突、错误的期望和能力的减弱。


  对每个人都能接受的机构价值观的认可，为校园社区提供了共同的语言和框架，用以传达做出关键决策的前提。研究清楚地表明，个人、群体和机构价值观的一致性会产生巨大的能量。⁵
  共识会加强承诺、热情和动力；个人有理由关心自己的工作。当人们能够关心自己所做的事情时，他们会更有效率、更满意。他们感受到的压力和紧张更少。共同的价值观是使人们能够既独立又相互依存行动的内部指南针。⁶


  领导者坦率地阐明他们所坚持的原则固然重要，但领导者所说和所做的事情必须与利益相关者的愿景一致。当利益相关者在关于价值观问题的对话中。毕竟，如果对价值观没有共识，领导者——以及其他每个人——到底要树立什么样的榜样呢？


  共同的价值观必须不仅仅是校园或项目的宣传口号。它们必须得到真正的支持和广泛的认可。教职员工不仅能够列举价值观，还能够提供关于这些价值观如何付诸实践的相对一致的解释。他们必须知道这些价值观如何影响他们教学、处理问题、招聘教师、举行仪式、为学生和校友提供服务等方式。他们还必须知道这些价值观如何直接有助于使他们的学院或大学独一无二、与众不同。


  共同的价值观源于倾听、欣赏和建立共识。我们观察到一位学生会主任，他在上任后的前几个月里走遍了建筑物和校园，与人们交谈。他倾听人们讲述什么有效、什么需要改进或修复。在这些对话中，他也有机会分享关于他自己、他的价值观以及他在其他校园的经历的信息。当做出改变时，他会将其与他在这些对话中听到的许多内容相对照，人们可以看出他忠实于倾听和回应的承诺。


  为了让校园里以及各个部门和项目中的人们理解价值观并认同它们，他们必须参与到这一过程中。关于价值观的统一声音源于发现和对话：团结是锻造出来的，而不是强加的。你必须为部门、项目或单位内的人们提供机会，讨论价值观的含义以及他们的个人信念和行为如何受到机构所代表的价值观的影响。


  你还必须准备好在招聘、选拔和新成员加入你的团队、部门或项目时的入职过程中讨论价值观和期望。就在这一点上，一位研究中心研究员感叹道：“价值观，遗憾的是，往往传达得很糟糕，不仅仅是在学术界。它们变成了待办清单上的另一项，与如何填写停车表格、选择医疗保健选项以及在哪里获取办公用品并列。随着需要完成的任务如此之多，关于价值观和信念的讨论往往被搁置。”他认为价值观“不能被定义然后束之高阁积灰。它们需要被践行，并且其重要性需要在决策中明确体现。”


  ## LEAD BY EXAMPLE


  领导者*体现*组织在他们做出的每一个决定和迈向他们设想的未来的每一步中的意义。领导者明白，他们在各种场合中赋予共同价值观以生命——在每周的部门会议上、一对一的会议中、与捐赠者的电话中、教职员工理事会会议上，以及与校友、供应商、供货商和社区成员的会面中。例如，图
  2.2 中的数据显示，领导者被观察到更频繁地以身作则树立他们对他人的期望时，其下属表示他们对管理层的信任程度越高。


  你如何花费时间、你如何应对关键事件、你讲述的故事、你提出的问题以及你使用的语言——所有这些都是树立榜样的领导工具。你如何运用这些工具不应是随意且听天由命的。虽然偶然性可能发挥作用，但你必须不断寻找以身作则树立领导力的方式，展示核心信念如何塑造和规范你的行动。


  树立榜样可能看起来相当基础和显而易见，但一切在于关注和行动。每个工具都使你能够有意识地承诺一种共同的方式，使其对他人可见且具体。对这些工具的审慎应用常常会挑战有抱负的领导者，但未能使用它们将助长愤世嫉俗。始终牢记，有时你必须走的最远的距离是从你的嘴到你的脚，从你所说的话到你所做的事。


  ![](img/7ddf49e8d8cd889f8f7c75097442c3e0_56_0.png)


  **Figure 2.2** 领导者以身作则树立他们对他人的期望，会增加人们对他们的信任程度。


  ## Spend Time and Pay Attention


  你如何花费时间是对你而言最重要的事情的最清晰的指标，尤其是对他人而言。你说你的首要任务是什么？无论是教职员工、学生还是校友，问题是，*你每天有多少时间花在他们身上？*
  当 Jeanne O’Laughlin, OP 在担任一所小型宗教大学校长时，她的愿景是创造一个关怀的校园环境。为了支持这一点，她在穿过校园时 routinely
  停下来与遇到的学生交谈。上任的第一天，另一位学院校长骑着一辆旧自行车去上班，并将其锁在写着“校长座驾”的标志上——这提供了一个关于可持续性和节俭价值观的简单声明。


  领导者会在他们如何分配时间与他们认为的优先事项和核心价值观之间建立明显的联系。当教务长参加学生参议院会议或在行政楼而非学生会与学生举行会议时，这意味着什么？当负责业务服务的副校长亲自来到学校的教职员工会议上讨论预算，而不是派一名预算分析师时，这传递了什么信号？如果你说校友很重要，有多久没有与他们会面了？如果你说学生很重要，上一次你旁听一堂课、参加学生展示或参加由学生发起的活动是什么时候？


  树立榜样往往意味着提前到场、晚些离开，并亲自到场以表明你关心。教职员工提前到课并在课后停留以回答问题和与学生聊天，成功传达了他们自己及其机构对关怀学生的承诺。了解在你办公室工作的学生的姓名、学习和兴趣领域，为人们如何在工作场所被对待——以及被重视——树立了榜样，即使他们是兼职或临时员工。


  日程安排在向他人传达你如何优先安排时间以及这种



  allocation aligns with your values and priorities—or not. Time, obviously, is a
  finite quantity, so make sure your distribution of it is in synch with where and
  what you want people to pay attention to. Don’t be too busy to take a moment to
  chat and get to know the people who work with, and around, you.


  ## Turn Critical Incidents into Teachable Moments


  Choosing to spend time on core values is essential in sending the signal that you’re
  serious about an issue. But even the most disciplined leaders can’t stop the intrusion
  of the unexpected. There are constant interruptions, brief interactions, and extraordinary
  variety in everyday life on a college campus. Critical incidents—chance occurrences,
  particularly at a time of stress and challenge—offer significant moments of learning
  for leaders and constituents. Critical incidents present opportunities for leaders
  to teach valuable lessons about appropriate norms of behavior.


  Jim Lyons, dean of students, was always on the lookout for critical incidents that
  he called “teachable moments” for the campus. These were the times that something
  unexpected happened, usually (but not always) negative, and campus administrators
  had a leadership choice to make about how they wanted to frame and respond to the
  incident.


  For example, when a violation of the university’s honor code occurs (as it will
  inevitably), is the focus narrowly on dealing with students caught cheating or is
  it more broadly focused on bringing the entire campus community (students, faculty,
  and staff) into a discussion of what it means to have, and live by, an honor code?
  What does it mean to be responsible and accountable not just for your behavior but
  also for how others behave? Incidents will happen, and the question for leaders
  is more than what the punishment will be. It’s bigger than that. It’s about the
  lessons they want to teach as a result of their response. Housing departments and
  programs, for example, have moved from simply penalizing people for breaking the
  rules to encouraging people to follow the rules determined by the residents themselves—these
  “rules” then represent the shared values of the community.


  Critical incidents are those events in leaders’ lives that offer the chance to improvise
  while still staying true to the script. Although they can’t be explicitly planned,
  it’s useful to keep in mind that the way you handle such incidents—how you link
  actions and decisions to shared values—says volumes about what’s important.


  For example, some deans and departments make it a big deal when a faculty member’s
  book receives an award, and others don’t. One university advancement officer vigorously
  rings a bell, located in the center of the office, and calls everyone together whenever
  anyone successfully solicits a donation over a certain amount; many just take such
  accomplishments for granted. Some athletic directors make a personal appearance
  in the team’s locker room after a narrow overtime defeat to remind the players about
  being proud to play at their best in spite of the scoreboard. After a particularly
  disturbing racial incident, the campus police chief made a personal appearance at
  a meeting of the student senate to talk about such tensions and the need to reach
  out and ensure the safety of each person (students, faculty, and staff) on campus.
  He also held individual discussions with each public safety officer, over three
  shifts, to share similar beliefs and to learn about their concerns.


  ## Tell Stories to Teach Virtues


  Critical incidents are often the most dramatic sources of moral lessons about how
  people should and should not behave. They become stories to pass along, whether
  around the classrooms and residence halls; among faculty, staff, and students; or
  even from generation to generation. To understand the teaching power of stories,
  all you have to do is listen to the tales that alumni relate when they are together
  during homecoming events:


  - The story about an administrative assistant who enabled them to graduate on time
  by approving their petition to add a class after the enrollment deadline

  - The faculty member who made a point of coming to their volleyball games, visibly
  cheering, and talking about how they played when they came to class or bumped into
  each other in the student union

  - The counseling center director who always made time in his schedule to speak with
  them whenever they were feeling stressed-out

  - The department chair who found the resources to send them to an overseas (expensive!)
  conference, which enabled them to make connections with colleagues that otherwise
  would not have been possible

  - The residence hall director who spent hours listening to them complain about a
  roommate and eventually helped them find a better place to live


  While the leader’s message is vital, and how it is framed is critical, the process
  by which it is communicated is just as significant. Stories can serve as mental
  maps that help people make the connection between what is important—the purpose
  and values—and how to put those things into practice. When people hear a story about
  how someone like themselves enacted a value, they are more likely to see themselves
  doing the same.


  Judith Ramaley, a former biology professor and university president, suggests that
  aspiring leaders can become good storytellers by inviting members of their college
  community to tell them about the good things that are happening and what they believe
  contributes to the quality of the institution. Armed with this material, she says,
  “you can be a storyteller…and your stories will help create meaning and direction
  for the institution.”⁷


  When a leader is trying to communicate the values of an organization, what would
  have more of an impact: a policy statement that says “Thou shalt establish personal
  relationships with alumni” or a story about the dean attending the Alumni Association’s
  monthly TGIFs? Similarly, what would be more persuasive: seeing statistics about
  how much stress students experience while at college or hearing a story about a
  student on your campus—who might have been in your class or worked in your office—who
  had committed suicide? If you said the story, your answer is consistent with the
  data. In fact, information is more quickly and accurately remembered when it is
  first presented in the form of an example or a story, especially compared with facts,
  figures, and formal policy pronouncements.⁸ Stories are far better able to accomplish
  the objectives of teaching, mobilizing, and motivating than bullet points on an
  overhead. Well-told stories reach inside people and pull them along. They give everyone
  the sense of being there and of learning what is really important about the experience.


  ## Choose Words and Questions Deliberately


  It’s been said that people are “prisoners” of their organizational vocabulary.⁹
  If you disagree, try talking about the personnel in your college or university for
  even a day without using the words *employee, manager, boss, supervisor, staff,
  subordinate,* or *hierarchy*. We’ve all come to accept certain words as the reality
  of organizational life. Those words can trap you into a particular way of thinking
  about your roles and relationships.


  Leaders understand the power of words and are attentive to language. The words we
  choose to use are metaphors for concepts that define attitudes and behaviors, structures
  and systems. Our words evoke images of what we hope to accomplish and how we expect
  people to behave. Too often on college campuses, some people hold tightly to designations
  that set them apart—and frequently above—others. Such distinctions make it challenging
  to find common ground.


  Consider the simple shift in language and meaning when the vernacular *extracurricular*—describing
  those activities on campus directed by the student affairs divisions—was dropped
  in favor of *co-curricular*, recognizing the holistic notion of the educational
  and learning process on campus. The shift in thinking on college campuses from building
  “dormitories” to establishing “residential learning communities” is another effort
  in this same direction. This shift in language changes how many staff members and
  faculty understand the role they play on campus in the education of young men and
  women.


  Questions too are quite powerful ways to focus attention. Just like professors do
  in a classroom with students, when leaders ask questions they send people on mental
  journeys—quests—in search of answers. The questions that leaders ask send messages
  about what’s most important to them and reinforce the focus of their department
  or program. Questions constitute one more measure of how serious you are about your
  espoused beliefs; the nature and substance of your questions reveal the values that
  should be attended to and how much energy should be devoted to them.


  The importance of raising questions was a key leadership insight for Jackie Schmidt-Posner
  in her job in the public




  在服务中心，并担任一个大型学生会议的机构顾问。她故意提出一些“让学生协调员重新回到项目的愿景和目的”的问题。一旦他们专注目标，就能制定出必要的策略。Jackie
  意识到她角色的重要部分往往是“通过提出棘手的问题来引导团队聚焦。”想一想你的问题如何框定议题并设定议程。¹⁰


  问题可以通过拓宽视角帮助人们摆脱自身范式的陷阱，并使他们能够为自己的观点负责。提问对你自己也有同样的作用。这个过程迫使你认真倾听周围的人以及他们所说的话。这一行为表明你尊重他们的想法和意见。如果你真心想听别人说的话，就需要先问他们的意见，尤其是在发表自己的意见之前。询问别人的想法有助于他们参与决策，并往往增加对最终选择的支持。提出正确的问题可以降低因考虑不周或意外反对而破坏决策的风险。当然，你不仅要倾听他们的回答，还要在后续决策中开放地认真考虑他们的反馈。提问必须以真诚为基础。


  ## 发展你的能力


  仅凭言语并不能让领导者获得信任。拥有清晰而真实的信息是必要的第一步，但始终如一地传递信息并付诸行动的能力需要高水平的技能。在你做正确的事情之前，你必须知道如何去做。无论目的多么道德或崇高，也无论他人是否肯定方向，你都无法做自己不知道如何做的事情。


  在没有能力完成的情况下承诺去做某事，要么是虚伪，要么是愚蠢。如果你既没有技能也没有资源，却大胆宣称将成功启动一门新课程或扭转一个住宿学习社区，这毫无勇气可言。领导者必须清楚自己在多大程度上拥有说到做到的能力。如果缺乏这种能力，他们就必须致力于持续学习和改进。


  这是 Jackie 在与学生合作筹办会议时牢记在心的一点。正如她所说：“我与学生们分享了自己的学习心得——包括过去的错误——并且我愿意根据新信息调整方向。”她确保自己属于学习社区的一员，而不是把自己标榜为专家；她承认在某些领域（如学生文化和日程安排，仅举两例）学生们懂得更多，甚至能教她。


  获得能力意味着要诚实地面对自己的能力。那些夸大自己完成任务或实现目标的能力，或者吹嘘自己拥有令人钦佩的品质或理想的物质财富的人，被称为伪君子和骗子，很少有人会长期追随他们。你作为领导者的价值，取决于你的指导信念以及你将其付诸行动的能力。


  要做到真诚，你需要诚实且持续地评估自己现有的能力，并愿意学习新能力。请记住，如果放任不管，每个人的技能和能力都像其他资产一样会随时间退化。在大学校园里，任何人都不会对学习需要时间和有意识的关注感到惊讶。如果领导者期望别人去做他们从未做过的事——这是任何改进或创新努力的基础——那么营造一种让人们能够学习、并且不怕承认自己无知的氛围至关重要。这种氛围只有在领导者也亲身参与学习过程、以身作则的情况下才会出现。


  ## 反思问题：*以身作则*


  要走上成为榜样型领导者的道路，你迈出的第一步必须是向内看。这是发现并拥有个人价值观和信念的一步。在找到自己的声音时，你会辨别出指导自己决策和行动的原则，并能以独特的方式表达自己。在确认共同价值观时，你会加强对人人都应秉持原则的承诺。


  以身作则，就是把你所说要做的事情的“做”的部分付诸行动。言行一致是对你信誉的第一个考验。领导者的衡量标准是言行的一致性。你必须出现，关注，并直接参与到成就不凡之事的进程中。正是言行之间的一致性建立了信誉，而你是一点一滴赢得它的。以身作则，是你让愿景和价值观变得具体的方式，也是你提供“证据”证明自己可信、有能力且亲自投入的方式。


  在培养“以身作则”这一领导力实践的能力时，花些时间反思以下问题。在你充分考虑之后，让他人知道你在想什么、愿意做什么。


  - 你的三个最重要的价值观是什么？你的工作团队/组织最重要的价值观是什么？你的价值观与他们的价值观之间有什么共同点？

  - 你的价值观如何影响和指导你的领导行动？


  ## 激发共同愿景


  琼·卡特（Joan Carter）接手大学 Adobe Lodge 的总经理兼行政主厨时，该餐厅的会员数量和销售额连续几年严重下滑。教职员工不满意，餐厅的资产负债表“令人担忧”，她的团队也分裂成几派。


  琼把这一切都看在眼里，但她看到的是一颗蒙尘的钻石。“我看到一座美丽而历史悠久的建筑，充满传教时代的风情与特色，它应当、能够、也必将成为校园里的*热门之地*。”在她的想象中，Lodge
  熙熙攘攘。她看到教授和大学员工在漂亮的封闭庭院里闲聊，享用着品质高、吸引力强且价格实惠的餐点。她微笑着设想自己的团队帮助校友策划美丽、个性化且专业宴会的婚礼招待会和周年庆典。


  琼能看到一支以客户满意度为首要关切的快乐员工队伍，一个能制作出远优于“宴会餐”产品的厨房，以及一个不惜一切代价让活动出色的餐饮服务团队。她不太确定 Lodge
  是如何恶化到那种地步的，但这并不重要。她决定不去追求快速修复，而是着手教导每个人这家餐厅可以变得多么独特和壮观。


  在接下来的两年里，她与顾客交谈、与员工合作，她灌输了一个愿景，将 Lodge 视为一个


  在高等教育中，最有效的领导者是那些最经常激发共同愿景的人。我们询问直接下属，他们的领导者在《领导力实践清单》（*Leadership Practices Inventory*）中与激发共同愿景相关的六种行为出现的频率，评分从
  1（几乎从不）到 10（几乎总是）。我们还单独问了一个问题，即他们在多大程度上同意或不同意“*总的来说，这个人是一位有效的领导者*”这一陈述（1=非常不同意，5=非常同意）。分析显示，随着领导者被观察到越来越频繁地表现出与激发共同愿景相关的行为，直接下属对其有效性的评分也系统地提高（*p*
  < 0.001）。从最低四分位数到最高四分位数，有效性出现了 85% 的显著跃升。


  ## 明确你的愿景


  无论使用什么术语——*愿景、宗旨、使命、遗志、梦想、召唤*或*燃烧的议程*——意图都是一样的。发挥领导力的人想要做有意义的事，成就别人尚未取得的成就。那件事是什么——那种意义感和目的感——必须来自内心。这就是为什么，正如我们关于价值观所说的那样，你必须先明确自己对未来的愿景，才能期望他人加入共同愿景。要创造有意义感的氛围，首先你自己必须相信某件事。在激励他人之前，*你*必须被激励。你的热情表明你最深刻感受什么，并认为什么本身有价值。它是一条线索，暗示着什么对你是*本质上*有回报的。


  你不能把愿景强加给他人。它必须对他们有意义，而不仅仅是对你。领导者必须创造条件，让人们因为*想*做而做事，而不是因为不得不做。*最*重要的事情之一……



  领导力的实践，就是通过描绘一个比现状更美好的激动人心的未来愿景，赋予生活和工作的意义与目的。¹领导者构建环境，使个人价值观与部门、项目或机构的愿景相交汇。例如，当被问及领导者多久一次“向他人展示如何通过共同愿景实现其长期利益”时，人们的回答与他们认为自己正在组织中发挥作用的程度密切相关，如图3.1所示。


  在这个数字时代，人们常常问：“我连下周甚至下个学期会发生什么都不知道，又怎么可能对五年、十年甚至两年后这个校园、这个州，更不用说整个高等教育领域将会发生什么有一个愿景呢？”有几种方式可以回答这个问题。首先，马丁·路德·金曾深情地谈论过他的梦想，但他也说过，你不需要看到整个楼梯才能迈出第一步。只要你对前进的方向有一些想法，你就能迈出下一步。


  ![](img/7ddf49e8d8cd889f8f7c75097442c3e0_71_0.png)


  图3.1 人们感到自己在组织中发挥作用的程度，与他们所报告的领导者向其展示如何通过共同愿景实现长期利益的频率直接相关。


  另一种思考方式是想象你正沿着太平洋海岸公路，在一个阳光明媚的日子里从旧金山向南行驶。左边是山丘，右边是海洋。在一些弯道处，悬崖陡降数百英尺直达水面。你可以看到数英里之外。你以限速巡航，音乐震天响，敞篷落下，风吹过你的头发，无忧无虑。突然，毫无征兆地，你转过一个弯，遇到了一片你从未见过的浓雾。你*会怎么做？*我们一次又一次地问这个问题，得到的答案总是一样：“我放慢速度，打开车灯，双手紧握方向盘，绷紧身体，身体前倾，关掉收音机。”然后你转过下一个弯，雾气消散，又变得清晰了。你会怎么做？放松，关掉车灯，加速，重新打开收音机，享受风景。


  这个类比说明了愿景清晰的重要性，*尤其是*对于快速而自信地前进而言。在雾中你能开多快而不危及自己或他人的生命？与一个在雾中开快车的人同车，你会感到多自在？在雾天还是晴天时，你能开得更快？这很明显，不是吗？当你的愿景清晰时，你可以走得更快。


  ## 发现你的主题


  仅仅知道愿景至关重要，并不会让一个愿景像灯泡一样突然出现在你的头顶。当我们请人们告诉我们他们的愿景来自何处时，他们往往很难描述这个过程。即使他们给出了答案，通常也更多是一种感觉、一种直觉、一种预感、一种本能的反应。毕竟，没有通向未来的地图或州际公路。当人们初次担任领导角色时——无论是指派的还是主动站出来的志愿者——他们往往对未来没有*清晰的愿景*。


  起初，大学校园里的领导者通常拥有的是一个*主题*。他们有担忧、渴望、假设、主张、论点、希望和梦想——这些是围绕其组织抱负和行动的核心概念。领导者通常通过发现自己的主题来开始构想未来的过程。领导者最终关于其愿景的表述，不过是这些主题的阐述、诠释和变奏。幸运的是，有一些方法可以提高你阐述自己未来主题乃至终极愿景的能力。[^2]


  例如，找到你的愿景，就像找到你的声音一样，是一个自我探索和自我创造的过程。这是一项直觉性的、情感性的事业。通常没有什么逻辑可言。我们所看到的是，模范领导者对他们的部门、事业、项目、学生、学科、技术、社区充满热情——这些超越了个人名利。领导者关心的是比他们自己大得多、也比我们所有人都大得多的事情。领导者关心的是通过某种有意义的方式改变现状，从而发挥作用。


  情绪是会传染的。如果你对某件事没有深切的关心，你怎么能期待别人感到任何信念？如果你自己都没有干劲和热情，你怎么能期待别人兴奋起来？如果你自己都没有同样的投入，你怎么能期待别人忍受不可避免的长时间辛劳和艰难工作？


  我们问肯特·科斯（Kent Koth），为什么他选择某个特定项目作为他个人最佳领导力经历。他的回答充分说明了在领导他人时我们如何发现自己内心的激情：“那是我萌发的职业生涯中的决定性时刻。就在那一刻，我明白了自己生来要做什么。我找到了自己在世界上的位置。”


  肯特希望为学生提供一个教育和服务的机会，让他们接触自己不了解的问题和人群。作为社区拓展项目协调员，他带领一群学生前往旧金山，参加校园首次的“另类”春假。这群人睡在市中心教堂的地板上，在当地无家可归者收容所工作。每天晚上，他们一起做晚饭，边吃边讨论当天发生的事情。晚饭后，他们聚在一起参加团队建设活动，讨论与服务经历相关的社会问题，在小组日志中写作，并为第二天的工作做准备。


  > 肯特告诉我们，他对这个项目最大的愿望“是让学生们带着对社会正义的新的热情和承诺回到校园。我希望这次旅行能成为点燃终生探索对他人的承诺的火花。我梦想这些学生离开时变得更坚强、更明智、更有同情心。”肯特发现了自己的主题：“我拥有一股对正义的热情，这促使我构建了一个能引发复杂伦理问题的项目。每个人都是平等的。每个人都有可以给予的礼物。每个人都有值得学习的东西。爱与正义可以引导我们达到新的觉悟水平。”


  ## 探索你的过去


  尽管这看似矛盾，但要瞄准未来，你需要回望过去。回顾过去实际上能让你比只盯着前方看得更远。理解你的个人经历有助于你识别那些主题、模式和信念，它们既强调了为什么你现在关心某些问题或情况，也解释了为什么让它们在未来变得更好是如此优先的事项。


  想想威廉·黄（William Hwang）的旅程，他创立了联合创新工坊学院（United InnoWorks Academy），这是一个非营利组织，致力于向来自弱势背景的中学生打开科学和工程世界的大门；其目标不仅在于点燃他们对学习的热爱，还在于激发大学生的志愿服务精神。当他回顾自己在高中时的经历时，他的热情被点燃了——当时他参加了几个特别的暑期项目，这些项目“源于某人的想象力和辛勤工作……以惊人的方式改变、重塑并影响了我。它们帮助我集中注意力，让我看到了新的、令人兴奋的可能性。”


  威廉记得一位田径队友，这位队友几乎没有榜样，整个高中都处于留校察看状态；正如威廉所说，想到他激发了他“一种强烈的渴望，想要做些什么来帮助那些可能缺乏同样机会的人。”他决定投身于一项事业，为最需要机会的弱势儿童带来他曾拥有的那种机会，于是联合创新工坊学院诞生了。从2003年的一个项目开始，创新工坊已在全球14所大学分会培养了超过2400名学生，而且这些数字还在继续增长。


  正如威廉逐渐领悟到的那样，当你首先凝视过去时，你就延长了你的未来。当你像威廉一样回忆过去经历的丰富性时，你也放大了你的未来并赋予其细节。所以，要构想遥远未来的可能性，首先要回望过去。当你这样做时，你很可能会发现你的核心主题早已存在。


  除了识别终生主题之外，在向前看之前回望过去还有另一个好处：你可以更深刻地体会到实现抱负可能需要多长时间。你还会意识到，许多许多道路都可以探索，也许还有新的高峰等待你去攀登。


  这一切并不是说过去就是你的未来。采取这种极其危险的视角，就像试图只看后视镜开车驶向未来一样。那样你会把自己和你的项目直接开下悬崖。关键在于让自己尽可能广泛地体验各种经历。拓宽你的经验，扩展你的网络。






  这个前景让她感到兴奋，她能够相当详细地想象这个项目将如何运作以及谁可能会参与其中。正如她告诉我们的：“我能看到学生在课堂上坐着，听着一位教员与他们谈论伦理困境和滑坡。我能看到学生小组讨论不同的文化背景如何影响我们的领导行为。我能看到学生在他们的组织中承担更积极的角色。我能看到学生在项目结束时在我们的招待会上领到证书时会多么兴奋。”从她最初的直觉——以及大量的辛勤工作——中诞生了一个成功的试点项目，50名学生探索了他们的领导风格并培养了领导技能。如今，
  many 年后，这个项目仍然让 Jo-Anne 感到微笑——它仍在校园中继续，激励着不断增长的学生领导群体。


  像 Jo-Anne 一样，我们采访的许多人提到，分析他们的个人最佳领导经历这一练习对他们来说是启发性的：通过突出过去的关键教训，他们能够为尚未探索的领导之路生成富有洞察力的路线图。从直接经验和主动探索中获得的知识，一旦储存在潜意识中，就成为领导者直觉、洞察力和愿景的基础。


  展望未来是一个始于灵感、一种感觉或一种认为某事值得去做的信念的过程。你对未来的愿景可能很模糊，但至少你专注于一个有意义的主题。你相信现状可以比今天更好。你顺从自己的直觉行事，愿景变得稍微清晰一些。你做一些让你前进的事情，愿景变得更加清晰。你关注它，体验它，沉浸其中。你让事情开始运转，随着时间的推移，你在梦想中看到更多细节。这是一个迭代的过程，最终会产生一些你和他人能够表述的东西。


  ## 让他人加入


  愿景关乎希望、梦想和抱负。它们是对实现某项雄心壮志的强烈渴望的宣言。它们是乐观主义的表达。你能想象一位领导者通过说“我希望你加入我一起做平凡的事”来招募他人加入事业吗？不太可能。愿景激励人们想象令人兴奋的可能性、突破性项目和革命性的社会变革。然而，这样的宏伟抱负无法实现，除非它们被你的利益相关者——员工、教员、行政人员、学生、校友、捐赠者或其他你希望争取的人——所共享。这正是
  Derek McCormack 副校长告诉我们的，当他被要求发展机构时，他意识到他的工作“不是自己寻找愿景，而是创造一个共同愿景，这样我们才能一起踏上同一旅程。”


  领导者拥有愿景是不够的；领导者的部门成员也必须理解、接受并致力于它。当其他人分享他们的个人最佳领导经历时，他们的评论与 Derek 的类似。人们经常谈到需要让他人认同愿景。他们解释了他们如何传达目的并为统一方向建立支持。他们知道每个人都必须致力于共同目的。他们理解为了让每个人踏上同一旅程，他们必须能够传达为什么他人应该加入、这对他们意味着什么以及这将如何使他们受益。虽然你可能能够看到他人利益如何得到满足，但如果他们看不到自己的需求与更大愿景的联系，他们就不愿意登船。但一旦他们加入，部门和机构改变并实现其潜力的能力就会飞跃。


  让他人加入意味着你需要深度倾听。从与利益相关者的对话中，你需要找到一个将潜在不同的动机和抱负统一起来的共同目的。你需要能够激发人们对独特性感到自豪。你需要描绘出让愿景栩栩如生的画面，并充满信念和热情地谈论令人兴奋的可能性。


  ### 深度倾听


  确定你的利益相关者是谁并发现他们的共同抱负，是领导者在争取他人时必须采取的必要步骤。无论个人愿景者的梦想多么宏大，如果他人在其中看不到实现自身希望和欲望的可能性，他们就不会跟随。你必须向他人展示他们自己也将从长期的未来愿景中受益，以及他们的具体需求如何得到满足。


  这需要专注的倾听，以便你能感受到他人内在的目的。通过了解你的利益相关者、倾听他们并征求他们的建议，你能更好地表达他们的关切。你可以自信地站在他人面前说：“这是我听到的你们想要为自己实现的东西。这就是你们通过加入共同事业而自身需求和利益将如何得到满足。”从某种意义上说，领导者举起一面镜子，将他人所说最渴望的东西反射回去。当人们看到那面反射时，他们认出了自己并能够拥抱那个形象。


  认识到领导是一种关系，使倾听处于其应有的位置。据说，没有伟大的想法会通过张开的嘴进入大脑。杰出的领导者知道他们不必自己拥有所有的想法或所有的答案。愿景的起源并非来自凝视水晶球；如果你能够倾听，就会在你周围找到线索，因为它们会从学生、同事、校友、家长和捐赠者那里传递过来。没有缺乏改进机构各部分的方法和机会。


  为了准确而忠实地听到利益相关者想要什么——他们希望你理解、欣赏并纳入愿景的内容——需要定期暂停常规活动，花时间单纯地倾听他人。通过访问他们的聚集地来了解你的利益相关者；去体育赛事、音乐会、食堂、图书馆、讲座和课堂。走出你的办公室，漫步到教员和员工同事的办公室。与利益相关者群体一起喝咖啡、吃早餐、午餐、下午茶，或进行一些非正式的时间。了解他们正在发生什么以及他们希望从与你和你的项目的关系中实现什么。


  ### 发现共同目的


  你曾问过部门或项目中的人们为什么留下吗？更可能的是，尤其是如果你负责人员配置，你会担心人员流动、留任率以及人们为什么离开。相反，思考大多数留下的人，并问他们为什么坚持下来。你为什么留下？人们关于为什么不离开或不寻找另一个职位的最重要原因，是他们发现自己正在做的工作具有挑战性、有意义且有目的。


  学术机构在教员和员工方面都比许多其他类型的组织具有优势，因为我们的同事通常从对学习和个人及职业发展的共同承诺开始。对他人抱负的敏感倾听揭示了将校园所有人联系起来的共同价值观。人们希望有机会接受考验，有机会靠自己成功，参与社会实验，做得好，做得好，并改变现状。⁴
  这些难道不是大多数领导机会的本质吗？


  尽管经济起伏，人们对工作场所的期望并没有发生很大变化。无论职业、行业或地点如何，人们都将“有趣的工作”排在“高收入”之上。领导质量（“为一位有愿景和价值观的领导者工作”）甚至比金钱更具激励性。你会惊讶吗？在工作生活中最常提到的成功衡量标准是“为做好工作而获得的个人满足感”？人们提到这一点是“取得进步”或“过上好生活”的三到四倍。⁵


  大学很少是人们为了最大化财务收益而去工作的地方。校园领导者有相当大的机会去吸引远不止物质奖励的东西。伟大的领导者唤起意义。自由、自我实现、学习、社区、卓越、正义、服务和社会责任的价值观真正吸引人们投身于共同事业。共同愿景是“人们心中的力量，令人印象深刻的力量”。⁶


  人类渴望有所作为的深层渴望。人们希望知道自己在这个世界上做着有意义的事情，生活是有目的的。工作可以提供这种目的，而且工作场所越来越成为人们追求意义和身份的地方。⁷
  最优秀的大学领导者能够激发并利用这种人类渴望，通过传达学院工作的意义和重要性，使人们理解自己在延续这一工作方面的[content]


  这个前景让她感到兴奋，她能够相当详细地想象这个项目将如何运作以及谁可能会参与其中。正如她告诉我们的：“我能看到学生在课堂上坐着，听着一位教员与他们谈论伦理困境和滑坡。我能看到学生小组讨论不同的文化背景如何影响我们的领导行为。我能看到学生在他们的组织中承担更积极的角色。我能看到学生在项目结束时在我们的招待会上领到证书时会多么兴奋。”从她最初的直觉——以及大量的辛勤工作——中诞生了一个成功的试点项目，50名学生探索了他们的领导风格并培养了领导技能。如今，

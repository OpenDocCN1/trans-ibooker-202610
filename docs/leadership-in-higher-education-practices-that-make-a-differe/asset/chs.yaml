  affiliation 不会始终保持最新。其次，因为示例旨在关注个人——他的或她的行动——不应将其与机构相关的任何声誉或特殊情况混淆。我们通常会描述该机构，以为示例提供一些背景，并通过展示大学环境的广度来证明这些经历的有效性（即可推广性）。*


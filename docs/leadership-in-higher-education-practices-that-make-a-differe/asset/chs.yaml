  这些对受人钦佩的领导者特征的调查揭示出与人们讲述其 Personal-Best Leadership Experiences 的故事中一致的模式。卓越领导力的五项实践和受人钦佩的领导者特征是对同一主题的互补视角。当他们处于巅峰表现时，领导者不仅仅是在取得成果。他们也在回应他们合作的人的期望，强调了领导力是一种关系，并且这种关系是对目的和他人的服务。


  随着我们在后续章节中关于领导力实践的文本中，将诚实、胜任、有启发性和前瞻性这些个人特征编织进去，你将更详细地看到卓越领导者如何回应其利益相关者的需求。例如，如果你想以身作则，被视为诚实是必不可少的。领导力实践
  Inspire a Shared Vision 要求你具有前瞻性和启发性。当领导者 Challenge the Process 时，他们增强了人们认为他们充满活力并关心未来的认知。值得信赖，这是诚实的一个同义词，


  意味着你将他人的最佳利益放在心上，并且是领导者 Enable Others to Act 的原因和方式的必备组成部分。在认可和庆祝显著的贡献和成就——即 Encourage
  the Heart——时，你加强了人们对共同价值观的承诺，并强调了协作与实现愿景的一致性。当领导者在 The Five Practices 全部方面表现出能力时，他们向他人表明他们有能力创造非凡的事情。


  ## CREDIBILITY IS THE FOUNDATION OF LEADERSHIP


  尽管人们对领导者的期望在高等教育面临不断变化的力量影响下保持一致，但这一描述性数据揭示了另一个深刻的含义。这些调查结果在社会心理学家和传播专家所称的“可信度”方面具有坚实的理论基础。在评估为什么有些人比其他人更可信、声誉如何形成、什么构成意见领袖或什么因素创造榜样等问题时，研究人员已证明，可信度的关键维度与人们最希望在领导者身上看到的四个特征
  remarkably similar。¹⁵


  如果你要要求他人跟随你走向某个不确定的未来——这个未来可能在他们的任期内甚至一生中都无法实现——并且旅程需要艰辛和可能的牺牲，那么人们必须相信你，这个他们将要追随的人。无数培养领导者的项目、课程和班级、书籍和
  CD、提供技巧和技术的博客和网站——如果本应追随的人不相信本应领导的人，一切都毫无意义。底线是，人们最想要的是可信的领导者。


  人们必须能够相信他们的领导者——她的话可以被信任，他会兑现他所说的，她对团队所朝的方向个人上感到兴奋和热情，他拥有领导所需的知识和技能。这是领导力的第一定律：如果人们不相信信使，他们就不会相信信息。


  要“相信信使”并被视为可信需要什么？当我们问人们，“可信度在行动中是什么样子的？你如何知道某人是否可信？”他们的答案不会因其机构的性质或他们所做的工作甚至他们是谁而有所不同，例如年龄、性别、种族、教职员工。这些是人们用来描述可信人士的行为和行动的最常见短语：


  - “They practice what they preach.”

  - “They walk the talk.”

  - “Their actions are consistent with their words.”

  - “They put their money where their mouth is.”

  - “They follow through on their promises.”

  - “They do what they say they will do.”


  最后一条回应是最频繁的。当判断一位领导者是否可信时，人们首先听取言语，然后观察行动。当言行一致时，就会做出“可信”的判断。如果人们看不到一致性——例如，如果在招生方面据称有特殊优待，热门或喜爱的学生不受



  对荣誉准则违规行为进行纪律处分，对校友捐赠者的不当行为视而不见，对员工进行诋毁，对同事进行贬低——他们得出结论，领导者充其量是不够认真，最糟糕的是彻头彻尾的伪君子。当领导者身体力行所倡导的原则，并且始终如一时，人们更愿意将自己的职业、自身的安全和未来托付给他们。


  这一认识引出了建立可信度的直接处方：*DWYSYWD*，即 *Do What You Say You Will Do*。这一常识性的可信度定义与领导力实践“以身作则”直接对应。要以身作则并在行动上具有可信度，你必须明确自己的信念；你必须知道自己坚持什么。那就是
  DWYSYWD 中的 *say* 部分。然后你必须将所说付诸实践：你必须践行自己的信念并 *do*。正是当领导者的言行一致时，人们才会认为他们可信。保持真实，获得并维持领导的道德权威，对“以身作则”这一实践至关重要。


  正因为言行之间存在这种重要的联系，我们在讨论五项实践时，首先对赋予“以身作则”生命力的原则和行为进行全面审视。在接下来的章节中，我们将向你介绍在大学里将五项领导力实践付诸行动并在各自机构内创造非凡成就的人们。



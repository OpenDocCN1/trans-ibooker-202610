  ## 让他人加入


  愿景关乎希望、梦想和抱负。它们是对实现某项雄心壮志的强烈渴望的宣言。它们是乐观主义的表达。你能想象一位领导者通过说“我希望你加入我一起做平凡的事”来招募他人加入事业吗？不太可能。愿景激励人们想象令人兴奋的可能性、突破性项目和革命性的社会变革。然而，这样的宏伟抱负无法实现，除非它们被你的利益相关者——员工、教员、行政人员、学生、校友、捐赠者或其他你希望争取的人——所共享。这正是
  Derek McCormack 副校长告诉我们的，当他被要求发展机构时，他意识到他的工作“不是自己寻找愿景，而是创造一个共同愿景，这样我们才能一起踏上同一旅程。”


  它’s not enough for a leader to have a vision; the members of the leader’s department
  must also understand, accept, and commit to it. When others shared with us their
  Personal-Best Leadership Experiences, they made comments similar to Derek’s. People
  frequently talked about the need to get buy-in from others on the vision. They explained
  how they had to communicate the purpose and build support for a unified direction.
  They knew that everyone had to commit to a common purpose. They understood that
  to get everyone on the same journey, they had to be able to communicate why others
  should want to join in, what it would mean to them, and how it would benefit them.
  While you might be able to see how others’ interests are served, if they can’t see
  how their needs are connected to the larger vision, they will be reluctant to climb
  aboard. But when they do, the department’s and the institution’s ability to change
  and reach its potential soars.


  Getting others on board means you need to listen deeply. From the conversations
  you have with constituents, you need to find a common purpose that unites potentially
  diverse motivations and aspirations. You need to be able to instill a sense of pride
  in being unique. You need to paint pictures that make the vision come alive, and
  you need to speak with conviction and enthusiasm about the exciting possibilities.


  ### Listen Deeply


  Identifying who your constituents are and discovering their common aspirations are
  required steps that leaders must take in enlisting others. No matter how grand the
  dream of an individual visionary, if others don’t see in it the possibility of realizing
  their own hopes and desires, they won’t follow. You must show others how they too
  will be served by the long-term vision of the future and how their specific needs
  can be satisfied.


  What this takes is attentive listening so that you can sense the purpose in others.
  By knowing your constituents, listening to them, and soliciting their advice, you
  are better able to give voice to their concerns. You can stand before others and
  say with assurance, “Here’s what I heard you say that you want for yourselves. Here’s
  how your own needs and interests will be served by enlisting in a common cause.”
  In a sense, leaders hold up a mirror and reflect back to their constituents what
  they say they most desire. When people see that reflection, they recognize themselves
  and can embrace the image.


  Appreciating that leadership is a relationship puts listening in its proper perspective.
  It has been said that no great idea enters the mind through an open mouth. Exemplary
  leaders know that they need not have all the ideas or all the answers themselves.
  The origin of a vision does not arise from gazing at a crystal ball; there are clues
  all around you if you are able to listen for them as they are passed on from students,
  colleagues, alumni, parents, and donors. There is no shortage of ideas and opportunities
  for making your part of the institution even better than it already is.


  To accurately and faithfully hear what constituents want—what they hope to make
  you understand, appreciate, and include in the vision—requires periodically suspending
  regular activities and spending time simply listening to others. Get to know your
  constituents by visiting their hangouts; go to sporting events, recitals, dining
  halls, the library, lectures, and classes. Get out of your office and wander into
  the offices of faculty and staff colleagues. Have coffee, breakfast, lunch, afternoon
  breaks, or some unstructured time with constituent groups. Find out what’s going
  on with them and what they are hoping to achieve from their relationship with you
  and your program.


  ### Discover a Common Purpose


  Have you asked people in your department or program why they stay? More likely,
  and especially if staffing is part of your responsibilities, you worry about turnover,
  retention rates, and why people leave. Instead think about the vast majority of
  those who stay and ask them why they stick around. Why do you? The most important
  reason people give about why they don’t leave or aren’t looking for another position
  is that they find the work they are doing to be challenging, meaningful, and purposeful.


  Academic institutions, on both the faculty and staff sides, have an advantage over
  many other types of organizations in that our colleagues generally start out with
  a shared commitment to learning and personal and professional development. Listening
  with sensitivity to the aspirations of others reveals common values that link everyone
  on campus. People want a chance to be tested, a chance to make it on their own,
  to take part in a social experiment, to do something well, to do something good,
  and to change the way things are.⁴ Aren’t these the essence of what most leadership
  opportunities are all about?


  What people want from their workplace has not changed very dramatically over the
  years despite economic upturns and downturns. Regardless of profession, industry,
  or location, people rank “interesting work” well above “high income” as important.
  And the quality of leadership (“working for a leader with vision and values”) is
  even more motivating than dollars. Would it surprise you that the most frequently
  mentioned measure of success in work life is “personal satisfaction for doing a
  good job”? People cite this between three and four times as often as “getting ahead”
  or “making a good living.”⁵


  Universities have seldom been places where people go to work to maximize their financial
  gains. There’s considerable opportunity for campus leaders to appeal to much more
  than material rewards. Great leaders evoke meaning. The values and interests of
  freedom, self-actualization, learning, community, excellence, justice, service,
  and social responsibility truly attract people to a common cause. Shared visions
  are “a force in people’s hearts, a force of impressive power.”⁶


  There is a deep human yearning to make a difference. People want to know that they’re
  doing something meaningful on this earth, that there’s a purpose to their existence.
  Work can provide that purpose, and increasingly the workplace is where people pursue
  meaning and identity.⁷ The best university-based leaders are able to bring out and
  make use of this human longing by communicating the meaning and significance of
  the college’s work so that people understand their own important role in perpetuating
  it. When leaders clearly communicate a shared vision of an organization, they ennoble
  those who work on its behalf. They elevate the human spirit.


  ### Take Pride in Being Unique


  Visions communicate what makes the team, department, school, or university singular
  and unequaled; they set the



  组织要与其他所有机构区分开来。与同城另一家机构做着完全相同的工作，那么在这家机构工作就没有优势。学生、教师、员工或校友想要加入你，他们首先必须明白你所提供的东西有何独特之处，能够脱颖而出。独特性培养自豪感。它提升组织中每个人的自尊和自信。人们对自己工作的学院、自己的学生和毕业生越感到自豪，他们就越有可能积极参与。


  例如，在描述她最敬佩的一位领导者时，Lina Chen告诉我们：“她让我感到自豪；她让我觉得我所做的事情很特别，并且做出了独特的贡献。”Lina在大学的研究实验室里与著名科学家一起工作，但她既不是学者也不是研究员。她负责计算机支持，确保所有设备正常运行而无任何问题。然而，她说，她的领导并不是这样描述她的工作职责的：


  > 她首先向我解释了这项研究的重要性，以及它如何影响许多人的生活。此外，我们的研究结果越准确，对相关人员就越有益，因为我们可以帮助改善他们的生活质量。保持计算机设备正常运行至关重要，因为它能让研究人员的工作更轻松。你在帮助他们改善环境，让世界变得更美好。


  对Lina来说，这“让我的工作变得非常有意义，并激励我成为这个正在改变世界的团队的一员。”


  像Lina的领导者那样，通过确保每个参与者都感到自己的工作独特，并相信无论职位头衔或具体职责如何，他们都扮演着至关重要的角色，来让人们对他们设想的愿景感到兴奋。独特感还使得大型机构中的较小单位能够拥有自己的愿景，同时仍然是集体愿景的一部分。


  尽管大学内的每个单位（系、项目或学院）都必须与整体组织愿景保持一致，但它可以在更大的整体中表达自己独特的目标。每个职能部门和每个系都可以通过找到自己最独特的品质来使自己与众不同。每一个都可以为自己未来的理想和独特形象感到自豪，同时为更大机构的集体未来而努力。


  ## 唤起未来图景


  一道穿透迷雾的灯塔之光，是你能在脑海中想象的画面。领导者经常用这样的视觉参考来谈论未来。他们谈论远见、聚焦、预测、未来情景、观点和新的视角。愿景是脑海中的图像，领导者通过使其更加具体和有形，将它们变为现实。他们通过描绘文字图画使印象栩栩如生。如图3.2所示，领导者越频繁地被认为“描绘了一个令人信服的未来图景”，他们的直接下属就越表示他们清楚自己工作中的期望。


  ![](img/7ddf49e8d8cd889f8f7c75097442c3e0_84_0.png)


  **图3.2** 领导者描述令人信服的未来图景的频率越高，人们对自己工作期望的清晰度也随之提高。


  在我们的研讨会和课堂上，我们经常用一个练习来说明描绘文字图画的力量。我们请人们想一想法国巴黎这座城市，并大声说出脑海中浮现的第一件事。回答——埃菲尔铁塔、凯旋门、塞纳河、巴黎圣母院、美食、葡萄酒、浪漫——都是真实地点和真实感受的图像。没有人会喊出巴黎的平方公里、人口或国内生产总值。对于你的学院或大学校园来说也是如此。为什么？因为人类的记忆存储在图像和感官印象中，而不是数字中。我们记住的是现实的图像，而不是对现实的抽象。


  当你创造未来时，你需要在开始旅程之前很久就获得对事物将会是什么样子的心理图像。图像是你通往明日世界的窗口。在谈论带领人们（你的系或项目）去往他们从未去过的地方时，你首先要想象这会是什么样子。例如，在校园里传播新的学生领导力学院的消息时，Jo-Anne帮助其他人想象它。她强调“这个项目以前从未做过。”她告诉正在招募参加试点项目的学生：“这是全新的。它将会很棒——而你是让它变得很棒的一部分。想象一下能够学习如何在你的俱乐部内建立团队、应对工作中偷懒的人，或者主持一次有效的会议。”Jo-Anne通过生动的图像传达了学生参与其中将获得的具体技能。她解释了他们如何能在每周几小时内、课间时间完成所有这些。通过一对一的和小群体的时间投入，她使愿景变得真实，并让他人参与其中。


  正如Jo-Anne所做的那样，领导者激活愿景并彰显目标，以便他人能看到、听到、品尝、触摸、感受到它。领导者在传达共同身份和赋予愿景生命力时充分利用语言的力量。成功的领导者使用隐喻和其他修辞手法为抽象想法增添生动性和具体性。领导者描绘文字图画、举例、讲故事、叙述轶事。他们找到表达对未来的希望的方式。在使无形愿景有形化过程中，领导者点燃支持者的热情，并发展共同的命运感。


  Lori Ann Roth，她所在大学的培训与组织发展主管，告诉我们另一种传达共同未来图景的方法——不仅涉及文字图画，还涉及实际图片。她描述了她的团队如何制作了一个真正的愿景板：他们将使命宣言贴在泡沫核心海报板上，每个人添加与之共鸣的图片、文字、感受或短语，然后他们把它挂在公共区域的墙上。“当你看着它时，你确实能感受到创造愿景时的团队精神和情感，”Lori说。“每天看到愿景板提醒我们每个人都要做一些事情来朝着愿景前进。”


  像Lori和Jo-Anne这样的领导者向他人传授愿景。他们让支持者参与关于他们的生活、他们自己的希望和梦想的对话，以及他们如何通过分享和参与愿景看到这些得以实现。Lori、Jo-Anne和其他模范领导者知道他们不能将个人梦想强加给他人。他们知道创造共同愿景就是发展一种*共同*的命运感。这是关于招募他人，使他们看到自己的兴趣和愿望如何与愿景一致，从而被动员起来，将个人精力投入到实现愿景中。


  同样，Sean Collins知道，他必须与校园里的其他人互动，才能勾勒出一个可能性的统一图景。当他成为环境、健康与安全主管时，校园研究和教学实验室并非都能统一防范化学品泄漏，而且到处都是没有标签的容器。他的愿景是建立和维护100%安全的空间，并在此过程中在校园内培育一种安全文化。


  他相信教师们内心也认同这个愿景，因为“没有一位教师愿意看到自己的学生在实验室受伤，或因检查机构而关闭实验室。”他知道自己不能单方面做出决定，而且，他也不可能亲自全天候在每个实验室确保达到安全标准。





  这意味着他必须让他人接受他的愿景，并*希望*让所有相关人员尽可能安全地使用实验室。他花了很多时间倾听直接负责实验室的人员，突出他们共同关切和愿景的领域，并与他们合作找到适合所有相关人员的解决方案。最终，他能够将一种隐含共享的东西转变为教师明确支持的东西。


  ## 积极沟通并富有表现力


  为了培养团队精神、培养乐观主义、促进韧性并重燃信心，领导者学会看到光明面。他们保持希望。他们增强其追随者对今天的挣扎将带来更光明明天的信念。


  人们想要充满热情、步伐轻快、态度积极的领导者，因为这传达了他们将参与一段振奋人心的旅程。人们会追随积极进取的人，而不是那些愤世嫉俗者，他们会给出十个原因说明某事为何做不到，或让他人对自己或他们正在做的事情感觉不好。唱反调的人只会阻碍前进的步伐；他们不会开启前进的步伐。


  研究神经网络的研究人员已记录到，当人们感到被拒绝或被排除在外时，大脑会激活一个用于记录身体疼痛的区域。⁸ 人们实际上比鼓励的话语更频繁、更详细、更强烈地记住消极评论。当负面言论成为一种执念时，人们的大脑会失去思维效率。这更说明领导者需要保持积极。积极的生活态度拓宽了人们对未来可能性的概念，而这些令人兴奋的选择会相互累积。⁹
  在肯定的环境中，人们变得更具创新性并看到更多选择。那些拥有更多积极性的人也


  问候。¹¹ 相应地，*魅力*可以更好地被理解为*表现力*。


  人们常常低估自己表现力的能力。我们发现，人们普遍认为自己缺乏感染力的自我认知，与他们谈论个人最佳领导经历或理想未来时——甚至是即将到来的假期和度假时的表现形成鲜明对比。当谈论希望、梦想和成功时，人们几乎总是富有情感表现力。谈论对未来的深切渴望时，表现力是自然而然的：人们会向前倾身、挥动手臂、眼睛发亮、声音充满情感、并微笑。他们充满热情、表达清晰、乐观向上、令人振奋。情感驱动着表现力。¹²
  简而言之，人们*就是*鼓舞人心的！所需要的只是愿意与他人分享你的热情，而不是将其锁起来并认为表现力 somehow “不专业”。在校园中产生影响的领导者对自己所做的事情充满热情，并发自内心地领导。


  ## 反思问题：*激励*

  ### 共同愿景


  愿景为人类能量提供了焦点。这使与部门、项目或机构相连的每个人都能更清晰地看到前方以及当每个人都贡献了自己的一份力量时未来会是什么样子。考虑到这一点，他们可以高效而自信地为整体做出贡献。


  但仅由领导者看到的愿景不足以产生有组织的行动。你必须让他人看到令人兴奋的可能性。你通过传达他人的希望和梦想来赋予愿景生命，使他们清楚地了解他们的价值观和利益如何通过对未来的特定长期愿景而得到满足。谈谈你自己的信念和你组织的独特性，并让他人为成为特别事物的一部分而感到自豪。保持积极向上、富有表现力，并以你的能量、乐观和希望的展望吸引追随者。


  在培养激励共同愿景这一领导实践的胜任力时，花一些时间反思以下问题。在你充分考虑之后，让他人知道你是谁，以及你能否将此作为激励你部门的座右铭？


  - 在招募某人加入你的团队时，你如何说明你所做的工作——以及你为何这样做——从而使你单位的工作变得重要且有意义？


  ## 挑战流程


  当 KIM LOEB 成为专业、应用和继续教育（PACE）执行主任时，该项目规模很小且亏损。她立即着手重组 PACE，通过彻底改革数十年未更新的项目和课程，重新聚焦学生服务并引入专业发展资源，以确保她的团队充分发挥能力。五年内，Kim
  的项目提供了超过 600 个全日制和兼职项目、课程和研讨会。它招收了来自 30 多个不同国家的学生，并产生了超过 100 万美元的收入。“人们说你的大学派你去国际招生旅行真是太好了，”Kim
  告诉我们。“但不；他们没有派我。我们创造了这些机会。”


  PACE 新方向的大部分功劳归功于 Kim 鼓励她的团队考虑创新想法和机会。她不会因为想法或技能组合与自己不同而感到受威胁。相反，她认为她的每个团队成员都有独特的东西可以提供：“我总是尝试为我们的团队引入拥有与我不同技能的人。”她的开放和脆弱帮助她将
  PACE 扩展到如果独自工作就不可能实现的方向。


  当然，PACE 的成就并不意味着每一次改变都是成功的。“我们确实开发了一些不算成功的项目，”Kim 告诉我们。她知道


  1（几乎从不）到 10（几乎总是）。我们还问了他们一个单独的问题，关于他们在多大程度上同意或不同意以下陈述：*总体而言，这个人是一位有效的领导者*（1 = 强烈不同意，5
  = 强烈同意）。直接下属对领导者的有效性评级随着领导者更频繁地表现出与挑战流程相关的行为而系统性地提高（*p* < 0.001）。从最低四分位到最高四分位，有效性提升了巨大的
  84%。


  ## 抓住改善的契机


  学院和大学通常不是变革的堡垒，往往恰恰相反。教师常常固守熟悉的东西，行政部门在采用新系统和流程方面可能行动缓慢，而校友热爱传统。尽管如此，在神圣的殿堂里，变革是每个机构
  DNA 的核心。毕竟，学生将因机构经历而改变。否则，有什么意义呢？正如高等教育众多著作的作者 Jeffrey Buller 所承认的那样，“在学术环境中，我们需要为自己设定一个更高的目标，而不是仅仅满足于现状。”¹


  挑战流程并不是为了变革而变革，而是与高等教育的目的相一致，为了变得更好。大学校园的领导者是受改善现状的动机驱动，使现状不仅不同，而且更好。改善当前情况需要变革。期望通过一遍又一遍地做同样的事情就能获得更好的结果是愚蠢的。


  在高等教育内外，当人们讲述他们个人最佳领导经历的故事时，他们谈论的是变革的挑战。当我们观察领导者时，我们看到他们的工作与逆境、不确定性、困难、破坏、转型、过渡、恢复和


  新的开始有关。有时变化很小，有时变化很大，但它们都关乎唤醒新的可能性。领导者并不总是必须改变历史，但他们确实必须改变“照常营业”。


  当被问及谁启动了他们选为个人最佳领导经历的项目时，我们假设大多数人会说自己。但实际上超过一半的案例是由领导者以外的人发起的——通常是其直接上级、经理、系主任、主任或院长。然而，如果领导力关乎抓住主动权，当人们被分配工作和任务时，他们如何能被称为“领导者”？


  我们认为，超过一半的案例并非自发发起，这是一个非常积极的信号。它解放了那些认为自己必须亲自启动所有变革的人，并鼓励了创新和改进是每个人的责任这一理念。如果人们报告的最佳表现仅限于他们成为主管、系主任、主任或某个头头时，大多数领导经历就会消失——校园内外的大多数变革也会随之消失。现实是，人们在工作中所做的大部分工作都是被分配的；很少有人能从零开始启动任何事情。被认为“在预见和应对变革方面采取主动”的领导者同时也被其直接下属评估为能发挥出人们的最好才能和能力，正如图
  4.1 的分析所示。


  抓住主动权与职位关系不大，而与态度和行动关系更大。创新和卓越是各层面的人们促成事情发生的结果。因此，当谈到变革和持续改进时，每个人都需要相信自己可以主动做些不同的事情。这是责任




  高挑战面前，许多人不愿采取行动，生怕把事情弄得更糟。


  由于其高关注度，一年一度的“你可以带来改变”会议一直以来都被多位工作人员严格微观管理——直到杰基·施密特-波斯纳（Jackie Schmidt-Posner）成为负责该会议的学生们的顾问。正如她所说：“我向我们的员工发起挑战，要求他们言行一致，并通过赋予学生自主执行该项目来支持学生发展。我们必须退后一步，让学生从他们的经历中学习，即使他们犯了一些错误。这有风险，因为我的一些同事认为，如果学生不受到严密监督，会议的质量就无法保证——而且他们有可能是对的。”


  尽管杰基承认一开始“有点紧张”，但她通过“不断提出问题，询问他们自己的愿景和目标是什么，以及他们如何包容他人、赋能他人来实现目标”来挑战学生领袖，让他们追求卓越。当学生们遭遇挫折时，她也鼓励和支持他们“始终从经历中学习”。结果，会议取得了巨大成功，吸引了大量背景各异的学生参与。比以往任何时候都更广泛的学生在会议中承担了领导角色。该项目不仅获得了校级奖项，两位学生协调人还因其领导力获得了个人服务奖。


  像杰基这样敢于发声并挑战过程的领导者，相信他们有能力应对自己所处的局面。他们也相信自己有能力帮助他人。² 自我效能感高的人——即相信自己能够很好地应对未来情况、并有能力采取行动实现目标——比那些自我效能感低的人更有可能采取行动。


  领导者灌输这种“我能行”态度最重要的方式，是为人们提供掌握任务的机会，通常是一步一步来。培训对于建立自我效能感和鼓励主动性至关重要。有趣的是，也许具有讽刺意味的是，“培训”——高等教育的必要条件——却很少被应用于提升教职员工的能力？优秀的高校领导者不仅为学生设计和构建学习机会。他们深知，知识就像任何机构资产一样，会随时间推移而老化。他们意识到，人们无法做到自己不知道如何做的事情。除非解雇所有技能不完整的人——这实际上是不可能的——否则就需要不断提升能力。越来越多的高等教育机构认识到终身学习的重要性，并投资于面向教职员工的管理与发展项目（而非基于内容的培训）。³


  领导者为人们提供超越以往表现水平的机会。他们经常提高标准。而最优秀的领导者明白，将标准设定在人们认为自己能够成功达到的水平至关重要。标准定得太高，人们会失败；如果失败太频繁，他们会放弃尝试。逐步提高标准，最终会有更多人掌控局面。这种对人们挑战需求的认知，以及对成功需求的敏感度，是任何领导者必备的关键平衡技能之一。


  ## 让挑战富有意义


  当我们让人们回想那些历史领袖，如果他们今天还活着，人们会*心甘情愿*追随的人，所有被提名的人都是对原则性问题有坚定信念的人：苏珊·B·安东尼、穆斯塔法·凯末尔·阿塔图尔克、耶稣基督、温斯顿·丘吉尔、圣雄甘地、玛丽亚·克拉维、马丁·路德·金、温迪·科普、亚伯拉罕·林肯、纳尔逊·曼德拉、果尔达·梅厄、埃莉诺·罗斯福，等等。这些受人敬仰的历史领袖还有一条贯穿始终的共同特征：他们都曾在动荡、冲突、创新和变革时期任职。他们是在巨大的不利条件下取得胜利的人，在惰性面前主动采取行动，在传统和既定秩序面前挺身而出，并在强大的阻力面前动员了民众和机构。


  领导力与挑战密不可分，正如领导力与原则密不可分。其含义十分明确。人们敬佩的领导者，是那些拥有*坚守信念的勇气*的人。他们期望领导者有价值观，但更重要的是，这些领导者愿意在剧烈的挑战和激进的变革中坚持自己的信仰。


  是什么让*你*清晨振奋，渴望迎接这一天可能发生的一切？是什么驱使*你*日复一日做到最好？为什么人们要突破自身极限去完成非凡之事？同样，为什么人们会在几乎没有实际回报的情况下做许多事？外在奖励——传统老话“得到奖励的事才会被完成”——显然无法解释高等教育中的这些行为。机构无法花钱让人们去关心学生、校友甚至同事；无法花钱让人们去关心自己的课堂、项目、服务、设施、家庭，甚至学校的盈亏底线。


  意义感和目标感是支撑人们度过艰难时期的动力，在这些时期，他们甚至觉得无法早起、无法再迈出一步、无法再讲一堂课、无法再评阅一本蓝皮书、无法再写一篇文章、无法再写一份战略报告、无法再翻新一栋宿舍楼、无法再参加一场动员会、无法再组织一场招待会或迎新活动。应对生活和工作中挑战与不确定性的动力来自内心，而不是别人抛出的某种“胡萝卜”。对金（Kim）和她的PACE团队来说，一个主要的激励因素就是始终关注任何改变会对她每天接触的学生产生什么影响：“我们做这些是为了改变学生的生活，”她告诉我们。将这种崇高的转型可能性放在首位，是他们持续努力改革项目的核心。


  我们的研究以及许多其他研究都清楚地表明，如果人们想做到最好，他们必须*从内心受到激励*。⁴ 这一点在高等教育领域尤其如此。他们参与的任务或项目必须具有内在回报性。说到卓越，肯定*不是*“得到奖励的事才会被完成”，而是“*有回报*的事才会被完成。”领导者触动人们的心灵和头脑。他们让教职员工在学院整体使命的背景下，理解、认同并相信其特定组织单位或部门的高尚目标。


  ## 向外寻求新创意


  面对新挑战时，人们会生活在高度的模糊性之中。变化及其伴随的不确定性打破了惯常的平衡。然而，正是这些波动、扰动和不平衡才是创造力的主要来源。⁵ 领导者必须在带领各自的部门、项目和机构穿越高等教育日益成为“永久性急流”的过程中拥抱创新。


  领导者明白，改进和创新可能来自任何地方。例如，一些关于课程和项目变革的最佳新想法来自校友。技术应用常常在……之后进入大学校园


  没有外部视角就像戴着马眼罩看得清楚——你无法看到全貌。


  走出你常用的学科或职能领域也很有用。参加一个与你所在领域完全不同的会议；上一门不同领域的课程；参观你并不熟悉的行业设施。透过不同的镜头看世界。


  为了准确把握外部现实，你必须从书桌前站起来，走出办公室，与你的相关群体交谈——当地居民、员工、雇主、董事、校友、教职员工、学生、供应商、经销商、管理者，或仅仅是感兴趣的人士。你必须倾听——当面、打电话、通过电子邮件、通过网站、通过社交媒体——并随时了解周围发生的事。你还需要让自己置身于新的情境中，这会迫使你审视并直面自己现有的思维模式；这类似于收集数据并加以分析。要乐于听取、考虑并接受来自高等教育之外的想法。


  例如，想想“关联”——与创新者相关的发现技能，它涉及在“看似无关的问题、难题或想法”之间建立联系。⁶ 想象一下，你可以通过与同事展开讨论来激发想象力，讨论如下问题：*迪士尼会如何参与我们的招生流程？西南航空会如何削减我们的成本？星巴克会如何设计我们的校友关系项目？亚马逊会如何为我们的学生注册？*


  ## 进行尝试并承担风险


  如果我们谈论的是挑战现状，你可能会问：*为什么不从大处着手？* 遗憾的是，过于宽泛地构想问题可能会让人不知所措。仅仅是思考大问题，就可能击垮我们甚至去想象还能做什么的能力，更不用说增强我们解决问题的意愿了。




  领导者面临着类似的挑战：那座山（一次课程改革，或停车政策的调整，或营销实践的整合）看起来高得难以攀登，困难重重；甚至连迈出最初几步都难以设想。让自己和他人放弃旧的思维模式和习惯，换取新的思考和行动方式，令人望而生畏。即使怀着最好的意愿，人们在压力之下也倾向于回到旧的、熟悉的模式。因此，领导者必须让人们一步一步地想要改变他们目前的方向。⁷


  最有效的变革过程是渐进式的；领导者将大问题分解成小而可行的步骤，并让周围的人多次说“是”，而不仅仅是一次。成功的领导者帮助他人看到，通过将旅程分解为可衡量的目标和里程碑，可以取得进展。理查德·霍尔（Richard
  Hall）副院长在开发和推出一所大学从未涉足的教育领域——新的EMBA项目时，正是采用了这一过程。


  他们做出的最激进的事情之一，也是前所未有的，就是整合来自看似与商科教育无关的多个领域的教师，例如哲学、艺术和音乐。项目初期，教师们在梳理发生了什么以及他们如何承担起整合跨学科课程和学习成果的责任时磕磕绊绊，学生也是如此。理查德和他的团队将教师和学生多次的努力迭代称为“试验”，并将其视为学习机会。该项目的最终成功归功于他们能够将这些试验经验作为一系列小胜利来积累。理查德解释说，其方法论是“在可能的情况下以小块、小规模的方式试验事物。经常失败，快速失败，并准备好尽可能灵活，根据需要进行改变。”⁸


  理查德的经历说明，变革或学习通常不会一夜之间发生：它是一个循序渐进的过程。领导者将项目、梦想和抱负分解成更小的部分，以便其成员能够取得进展。实现这些小胜利的一个基本构建块是征求反馈。当学生自愿参与试验时，理查德的团队会确保每个人都明白这是一次实验，并且学生和教师必须对自己的经历提供反馈。这些信息将被转发给各个学术委员会，他们会做出必要的调整。


  回顾这段经历时，理查德说：“所以你小规模地做，确保它是一次试验，你非常认真地对待反馈，并花大量时间推敲什么有效、什么无效。然后你再试一次又一次。”


  无论是成功还是失败，理查德的团队在做事时以及做完后都会不断监控他们正在做的事情。他继续解释道：“我们有一个非正式的回顾、一个更正式的回顾、一个涉及全面评估的正式回顾、最终评估，然后是下一次交付的初步评估。我们会再次审视在下一次交付时正在进行和计划的更改。这很耗时，但这是不断发展的项目的一部分。”


  学术界一直都明白，重大的突破很可能源于众多研究人员的共同工作，因为无数贡献最终累积成解决方案。例如，医学或生物物理学的进步通常涉及针对问题各个部分进行的许多实验。同样，汇总所有“小”的技术改进，无论行业如何，都比所有伟大发明家及其发明对组织生产率的提升贡献更大。⁹


  进步更可能是对工具和流程进行渐进式改进的结果，而非思维的根本性转变。领导者牢记梦想，然后在行动中不断调整。


  ## 让小胜利发挥作用


  像理查德这样的领导者所使用的这种渐进式变革过程被称为“小胜利”，因为每一次成功都能让领导者增强人们对某项行动方案的承诺。¹⁰ 校友或发展办公室在向应届毕业生和近期校友请求小额捐款时也是如此。他们知道，未来再次向已做出初步承诺的人请求更多捐款，比回到从未捐赠过的人那里要容易得多。领导者从自己可控、可触及、可行的行动开始，以推动事情进展。


  小胜利的过程可能最初并未出现在小私立非世俗大学学生生活院长珍妮·罗森伯格（Jeanne Rosenberger）的脑海中，但当她发现自己成为学校接受一家政府国防承包商巨额捐赠后学生抗议团体与校方之间的纽带时，她很好地运用了它。珍妮需要找到一种方法防止抗议升级，确保每个人的安全，保障参与绝食抗议的学生健康，并制定双赢的结果。


  珍妮的目标是营造一个冷静、协作的环境，而非对抗性的环境。她一步步地实现了这一点，并在沿途赢得了多方的协议和信任。她确保会议在中立地点举行，强调面对面沟通和认真倾听的重要性。她每次与学生交谈时都先询问他们的健康和福祉——而不是提出任何最后通牒。她通过承诺只有在必要时才会呼叫警察或校园安全部门，而不是让警察持续在场，从而赢得了他们的信任。


  结果，抗议保持和平，学生绝食了四天——没有健康问题——并且关于制定机构企业捐赠政策的对话开始了。如果珍妮没有采取小胜利的方法，而是将情况视为一个巨大的问题，抗议可能会升级并导致灾难。但事实并非如此。珍妮意识到，渐进的步骤是成功解决问题的最有希望的途径。事后，她利用这次经历让学生反思他们学到了什么——关于示威、关于大学、关于企业，以及关于他们自己。将抗议转变为学习机会——一个可教的时刻——需要对过程保持开放，这让每个人都获益。


  小胜利构成了持续成就模式的基础，吸引了希望与成功事业结盟的人。小胜利增强了人们的信心，并强化了他们渴望成功的自然欲望。因为额外的资源往往会流向赢家，所以可以尝试稍大一点的步骤或胜利。因此，一系列小胜利提供了稳定构建块的基础。每一次胜利都保留了成果，使回到既有状况变得更难；每一次胜利也提供了促进学习和适应的信息。


  小胜利还能阻止反对意见，原因很简单：很难反对成功。因此，小胜利减少了对后续提案的抵制。在取得小胜利时，你确定了开始的地方。你让项目看起来可行，并且在现有技能和资源水平之内。这种方法最大限度地降低了尝试的成本，减少了失败的风险。随着小胜利的取得，自然力量被启动，推动行动迈向另一个小胜利。这种一步步获胜的简单策略，比大规模的彻底改革和庞大项目更常取得成功。它不仅仅更容易；也是因为个人和群体的承诺已融入到过程中。


  ## 从错误中学习


  毫无疑问，变革和领导力涉及承担风险，而任何不确定的行动至少会带来错误，更糟的是失败。必须承认，失败可能是代价高昂的。对于领导失败项目的个人来说，这可能意味着职业生涯停滞甚至失业。对于学者来说，追求新的研究方向可能导致无法获得终身教职或晋升。对于学院或研究中心来说，这可能导致合同和资金的损失。对于院长或大学校长来说，这可能意味着不信任投票。


  然而，承担风险绝对是必要的。在学术方面，所有的学术研究，其科学方法就是假设检验，本质上就是一种冒险实验（目标是解释方差或未知）。在员工方面，很少有项目会因不做任何改变而变得更好。一次又一次，我们研究中的人们告诉我们，错误、挫折甚至失败在他们的成功中发挥了作用。没有这些经历，就不会有学习，他们也无法实现自己的抱负或取得突破性成就。


  例如，莉拉斯·玛丽·哈塔拉（Lillas Marie Hatala）作为其大学继续教育部门的项目主任，告诉我们她第一次与商学院院长会面时的经历，以及他们在哪个组织部门应该提供商业和领导力项目的问题上发生了冲突。他们的讨论


  谈判似乎常常像利拉斯所说的那样，“进一步，退两步”，但最终他们成功化解了分歧。利拉斯意识到，成功的协作需要一些反复沟通，才能形成共同愿景、找到共同价值观，并制定出切实可行的运营计划。


  这看起来可能有点讽刺，但很多人都认同这样一种观点：当人们有机会接受考验——甚至可能失败——时，工作的整体质量反而会提高。无论做什么事，学习曲线从来都不是一条直线。事实上，大多数创新都可以称为“中途的失败”。在任何新的尝试中，你很少能不犯错就学到东西。想想你学习一项新运动或新游戏的时候。也许是滑雪、单板滑雪、冲浪、滑板、网球、高尔夫、曲棍球、桥牌，或是最新的电子游戏。你几乎不可能在第一次尝试时就做得完美。


  没有什么是第一次就能完美完成的——运动如此，游戏如此，高等教育更是如此。当然，这不是为了鼓吹失败而鼓吹失败。我们从不主张失败应当成为努力的目标。相反，我们主张学习。韧性是通过从错误和挫折中学习的过程建立起来的。领导者不会轻易放弃自己或他人，当事情没有按预期发展时，他们会把结果视为暂时的、局部的、可改变的。


  卓越的领导者不会在以创新为名犯了错误时寻找可以指责的人。相反，他们会问：从这次经历中能学到什么？利拉斯在与院长谈判时采用的方法正是如此，而且数据也支持这一观点。领导者被报告为“当事情不如预期时，会问‘我们能学到什么？’”的程度，与其直接下属所表达的对组织的承诺水平显著相关（p
  < 0.001）。


  没有简单的测试可以确定最佳的学习策略。但很明显，领导者以学习的意愿、对学习重要性的认识，以及对学习不可避免地会涉及犯错的认知，来对待每一个新的、不熟悉的经历。


  同样，也没有简单的测试可以确定新事业中的适当风险水平。成本、收益、潜在损失和潜在收益——都必须权衡。要知道，一个人的风险可能是另一个人的日常活动，你必须将团队成员当前的技能和任务的需求考虑在内。但即使你能把风险计算到小数点后五位，每一次创新仍然会让你面临一些危险。也许，任何人能做的最健康的事情就是完成一次风险评估，并确定可以学到的东西是否值得付出代价。


  ## 培养心理韧性


  不确定性和风险伴随着任何改善现状的努力而来。但领导者如何能够接受领导工作中不可避免的错误、挫折甚至失败，以及随之而来的压力？你如何帮助他人应对变革的压力？事实证明，让人生病的并不是压力本身，而是人们如何看待和应对压力事件。


  与我们分享的个人最佳领导力经历——比如珍妮所面临的校园抗议，或者杰基那样将会议主导权交给学生——都是艰难而压力重重的项目却带来了热情和乐趣的清晰例证。在讲述自己的最佳经历时，人们通常表示，他们并没有被具有挑战性的经历带来的压力击垮，反而因这些经历而充满活力。凯伦·斯莱基·赫尔当然也是如此，当她


  那些持久关注长期成果的领导者。研究表明，坚毅性与最常挑战现状的那些人相关。¹²


  此外，在压力大、风险多的环境中成长和茁壮的能力，比如凯伦和她的同事们所面临的那种情况，高度取决于你如何看待变革。心理学家对那些经历高度压力却能积极应对的人感到好奇，他们发现这些人对压力有一种独特的态度，他们称之为“心理韧性”。¹³
  过去40年的研究人员发现，在像企业管理者、创业者、学生、护士、律师和战斗士兵这样多样化的群体中，心理韧性高的人比韧性低的人更有可能经受住严峻的挑战并从失败中恢复过来。¹⁴
  好消息是，韧性是一种人们可以学习的态度，领导者也可以支持这种态度。


  心理韧性有三个关键信念：*承诺、控制*和*挑战。* 在凯伦的“最佳领导力”案例研究中，这三者都得到了体现。要把逆境变为优势，首先你需要对正在发生的事情做出承诺。你必须参与进去、投入其中并保持好奇。你不能坐等事情发生。当你做出承诺时，你会在所做的事情中发现一些有趣、有意义或值得的东西。你还必须掌控自己的生活。你需要试图影响正在发生的事情。虽然你的所有尝试不一定都会成功，但你不能陷入无力感、被动或受害者心态。你不能否认现实，也不能感到疏离、无聊和空虚。最后，如果你想具备心理韧性，你需要将挑战视为从积极和消极经历中学习的机会。你不能墨守成规。个人的进步和成就感来自于持续投入生活的不确定性之中。


  轻易获得的舒适和安全不仅不现实，而且可能令人停滞不前。


  你对事件的看法影响着你在变革和压力中的应对能力。要迈出第一步、启动新项目、发起改进，你必须像凯伦一样相信自己能够影响局势的结果。你必须对正在发生的一切保持好奇。你必须每一步都寻找学习的机会。有了坚韧的态度，你可以将压力事件转化为成长和更新的积极机遇。


  更重要的是，你可以帮助你的团队也产生同样的感受。例如，当凯伦要求生产经理提交一份设备现代化提案时，他带回了一个五年计划。凯伦问：“如果我们把这项投资在一年内完成会怎样？”他的眼睛睁得大大的，表情仿佛在说：哇，我们真的可以改变这个地方！他带回了一个在战略和财务上都有意义的一年计划。


  具有坚韧态度的人能够从容应对变革、风险、动荡和生活的压力。无论遇到的压力事件是积极的还是消极的，他们的反应都类似。他们认为这件事很吸引人，相信自己有能力和实力去影响结果，并将其视为学习与发展的机会。


  如果你不营造一种培养心理韧性的氛围，就无法吸引和留住人才。如果有选择，人们不会在一个让他们痛苦的事业中久留。要接受变革的挑战，他们需要相信自己能够克服逆境。你可以通过促进让人们体验承诺而非疏离、控制而非无力、挑战而非威胁的环境，来帮助你共事的人更有效地应对压力。例如，提供和分配具有挑战性但在个人技能范围内、且有助于建立其控制感的任务。给予奖励和认可而非惩罚，可以培养承诺。鼓励人们看到变革如何能带来一系列可能性，有助于培养适应性的态度。


  了解到人们将自己做到最好与意义感、掌控感和激励感联系起来，并且人们在思考自己最佳状态时会偏向于坚韧，这很有启发性。同样有帮助的是，知道人们在感到不投入、无足轻重和受到威胁时不会表现出卓越。此外，承诺感、控制感和挑战感提供了内在线索，帮助你辨别自己是在卓越表现，而不仅仅是熬过一天。


  ## 反思问题：

  ### 挑战现状


  追求变革是一场冒险。它考验你的技能和能力，唤醒沉睡的才能。它是领导力的训练场。卓越的领导者会寻找机会做出改变——即使这些机会有时是强加给他们的，而不是他们自己选择的。你需要对任何让你的部门或项目陷入虚假安全感的事物保持警惕；不断发起并启动新的举措。你需要站在这场变革的前面，而不是在后面试图追赶。你的注意力焦点应该少放在日常运营上，多放在未经尝试和未经检验的事情上。问问：“什么是新的？下一步是什么？什么更好？”未来就在那里。


  领导者进行实验，并从错误中学习。你的主要领导任务之一，是识别并消除阻碍创新和创造力的自我强加的限制和组织惯例。然而，创新总是有风险的，你必须承认失败是实验生活中的一个事实。相反


  与其惩罚，不如鼓励；与其为错误追责，不如从中学习；与其增加规则，不如促进灵活性。拥抱持续改进和终身学习。


  领导者对变化持有坚韧的态度。走出日常惯例的束缚，尝试创造性的可能。营造一种氛围，让教职员工都能接受变得更好的挑战。通过拥有并培养心理坚韧的态度，你可以将创新与进化可能带来的混乱和压力变成一场冒险。通过着手开始、迈出第一步并取得小胜利来奠定基础。


  在培养你践行“挑战现状”这一领导实践的能力时，花些时间反思以下问题。在充分考虑之后，让其他人了解你在想什么、愿意做什么。


  -   ▶ 你在你的部门或单位正在开展或支持哪些实验或试点项目？这些是否足够？你打算如何评估——不仅是结果，还有学习收获？

  -   ▶ 你能做些什么来确保团队中的成员感到你支持他们，在他们发挥外部洞察、主动创新并尝试新想法时为他们撑腰？你还能多做些什么？

  -   ▶ 要让你比现在更多地说“行”，需要什么？你能做些什么来让他人更容易说“行”，并承担他们从未做过的事情？

  -   当事情不如预期时，你能做些什么，以学习的视角看待结果或过程？你如何表明自己愿意为缺点和失误负责？


  ## 使众人行


  卡罗琳·博恩是一所大型州立大学知名医学院的女性健康倡议项目总监。作为美国国立卫生研究院项目的一部分，女性健康倡议是迄今开展的针对绝经后女性健康问题规模最大、最具雄心的纵向研究之一。这项研究需要周密的规划、分析能力和一丝不苟的细节关注。


  由于其敏感性和重要性，它还需要工作人员高度协作和相互信任。但卡罗琳到来时，这种氛围并不存在。当时的重点似乎是竞争和猜疑，而非合作和支持。尽管工作人员们工作很努力，但招募工作并未达到全国研究项目的预期目标。生产力和士气都很低落。


  卡罗琳立即采取措施营造一种不同的氛围，让人们感到彼此熟悉，并受到同事的尊重和信任。在完成需求评估的过程中，她采访了每一位工作人员。她发现，虽然人们对这项研究充满热情，但他们因缺乏制度、组织性，尤其是团队协作而感到沮丧；事实上，她说：“团队中的每个人都是才华横溢的专业人士，但每个人都准备辞职。他们都喜欢自己的工作，但感觉不到支持。”


  （1 = 非常不同意，5 = 非常同意）。分析显示，随着领导者被观察到越来越频繁地展现出与“使众人行”相关的行为，直接下属对其有效性的评分系统性地提高（p <
  0.001）。从最低四分位数到最高四分位数，有效性评分提升了40%。


  ### 营造信任氛围


  领导者把建立信任列入议事日程；他们不会任其自然发展。信任是组织内外人际关系中的核心问题。没有信任，你就无法领导。无法信任他人的人之所以成不了领导者，正是因为他们无法忍受依赖他人的言语和工作。于是，他们要么自己包揽所有工作，要么对工作进行过于严密的监督，从而变成过度控制的微观管理者。因为他们不信任别人，结果别人也不信任他们。


  心理学家发现，能够信任他人的人比那些以怀疑和不信任看待世界的人更快乐，心理适应也更好。¹ 信任他人的人也更受同伴喜爱，常常被主动结交为朋友。你会更愿意倾听你信任的人，也更容易接受他们的影响。最有效的领导情境是团队中的每个成员既信任领导者，也相互信任。


  想象一下你在系务会议中的教师同事、在项目评审会议中的行政同事，或甚至是全校范围的工作组或治理委员会。再设想这些人参与一个角色扮演练习。他们获得关于一项艰难政策决策（如项目预算削减）的相同事实信息，然后被要求作为一个小组解决与该信息相关的问题。其中一半的小组被预先告知预期会有信任行为（“你从以往的经验中得知，你可以信任小组中的其他成员，并能与他们坦诚地表达感受和分歧”）；另一半则被预先引导预期会有不信任行为。这两组成员在彼此互动和协作解决问题的方式上会出现巨大差异，你会感到惊讶吗？


  诸如此类的研究一致表明，那些被告知可以信任角色扮演同伴和管理者的小组成员报告称，在所测量的*每一个*因素上，他们的讨论和决策都比低信任组成员更积极。高信任组的成员更坦率地表达感受，对小组的问题和目标有更清晰的认识，并会寻找更多备选行动方案。他们还报告称，由于这次会议，他们对结果有更大的影响力，对会议更满意，执行决策的动机更强，团队也更紧密。


  在另一项模拟中，参与者被告知，根据以往经验，他们的主管总是可以被信任，或者并非总是可以被信任。在主管不值得被信任的小组中，人们会忽视或歪曲主管为开放和诚实所做的真诚努力。不信任感如此强烈，以至于成员们把主管的坦诚视为欺骗他们的巧妙手段，并进一步破坏主管的努力。那些尝试信任和开放却遭到拒绝的主管，也以同样的方式回应。毫不奇怪，低信任组中超过三分之二的参与者表示，他们会认真考虑另找职位。人们不愿与缺乏信任的人共事，也不愿在缺乏信任的环境中工作。²


  必须牢记的是，上述报告的事件确实发生过，但它们是一次*模拟*；参与者当时是在角色扮演！人们之所以有这样的行为和反应，是因为他们被告知彼此不能信任。他们的行动表明，信任或不信任可以仅凭一个暗示就产生——而且只需几分钟。简单来说，信任是个人对组织满意度的重要预测指标。


  当你倾听他人，并为他们提供自由贡献、做出选择和创新的机会时，你就表明了你信任他们。当你培养开放、参与、个人满足感以及对卓越的高度承诺时，你就是在展示信任。既然知道信任至关重要，就要确保你考虑不同的观点，借助他人的专业知识和能力，并让他人在群体决策中发挥影响。人们需要相信，他们可以依靠你去做符合所有人最大利益的事情。没有信任，就不会有“我们”的感觉。


  虽然信任是一个互惠的过程，但作为领导者，你必须是先拿出诚意的那个人。一位图书馆工作人员告诉我们：“如果我的主管似乎从不信任我，我凭什么信任她？”这种心声在校园里许多人那里得到回应，在层级关系中尤其能说明问题。当管理者说“信任我”，却没有通过行动表明她信任他人，或者没有花时间倾听并对被影响持开放态度，信任便不会开花结果、茁壮成长。信任催生信任。事实是：信任在先，追随在后。


  ### 促进积极的相互依赖与合作





  而且教职员工都曾有时建议该节目是关于如何在任何组织环境中取得成功的案例研究。


  对我们来说，这一结论令人不安，我们强烈反对任何现实生活中的应用。引人入胜与否，《幸存者》以及类似的节目传授的都是在“现实世界”中生存的完全错误的经验。在现实世界中，更不用说在高等教育中，如果人们像电视上的这些选手那样行事，他们都会死去。正如著名的人类学家
  Lionel Tiger 所说，“竞赛格式残酷地扭曲了本应涉及持续合作的完全不同的结果。岛上的行为……反映了奖品的性质，以及赢得它所要求的东西。人类生存的目标一直是为另一天而坚持下去，并且是在群体中。”³


  《幸存者》所缺少的合作与协作的最重要方面之一是相互依存感，即每个人都知道自己除非让每个人都成功——或者至少除非他们协调自己的努力——否则就无法成功。如果没有 *我们都在同一条船上*
  的意识，即一个人的成功取决于他人的成功，那么几乎不可能为积极的团队合作设定条件。


  为自己的工作勤奋努力，同时牢记整体共同目标的动机，在最终结果被奖励而不是个人努力时得到强化。要让非凡的事情发生，人们必须相互依赖。领导者积极参与创造合作与协作的积极环境和结构。据报道，最常“在他们工作的人之间发展合作关系”的领导者，其下属认为他们，如图
  5.1 所示，灌输了最强烈的团队精神。


  这在 Susan Tomaro 的经历中体现得非常明显，当时她在与犹太教高圣日重叠的时间里，承担了策划为期一周的新生入学指导项目的具有挑战性的任务。不仅会有冲突的活动，而且这两个活动还会争夺有限校园设施的使用权。这是她担任该职位的第一个年头，她立即着手与宗教生活办公室和希伯来会建立牢固的关系。


  ![](img/7ddf49e8d8cd889f8f7c75097442c3e0_121_0.png)


  **Figure 5.1** 领导者被认为在他们工作的人之间发展合作关系的程度，会增加其工作团队中的团队精神。


  Susan 理解到，她无法争辩说她的项目比这些宗教节日对相关人员更重要，他们也无法必然声称这个宗教重要时期优先于校园设施的使用。Susan 理解到他们需要共同努力解决潜在的冲突。她的做法是“提供有关我们所有人面临的各种挑战的信息，并寻求大家的帮助来改变我们这次做事的方式。我要求各方的人跳出思维定式并认识到，问题只有通过让许多人参与并共同努力才能得到解决。没有大家相互合作的支持，没有人会成功。”零和解决方案对任何人都没有好处。


  像 Susan 这样的领导者认识到，协作源于人们理解他们必须相互依赖和依靠才能取得共同成功。有了这种认识，寻求帮助和分享信息变得自然而然。因为他们看到自己处于互利的关系中，找到并设定共同目标就不会有问题。


  Charlie Slater 在谈到他的最佳个人领导经历时也理解了积极相互依存和协作的重要性。在大学首个博士项目的成功开发和实施中，Charlie 告诉我们“有很多领导者”，并且这一成就“如果没有这么多人的领导和合作就不可能实现”。每个人都愿意相互合作，承担互补的角色，将可能性变为现实。大学校长首先推动了这一进程。Charlie
  和一小群教师随后共同努力倡导该项目并推动项目进展。在整个过程中，不同的个人和团体通过倡导、调解和谈判使他人得以实现。


  例如，一位资深教师在关键时刻站出来提供支持。通过强调群体的共同信念并以道德术语表述，她能够调和相互竞争的派系。Charlie 解释说，她的努力“对于将大学的使命和价值观与博士项目联系起来至关重要”。通过帮助教师承认这些共同信念，Charlie
  的同事们能够抽出时间制定课程、建立学习目标和研究标准，并在其他需求中继续致力于这些任务。


  无论是启动博士项目、设计新的校园设施、改变人事福利、推出更新的软件、转移财务记录保存系统、为科学实验室制定新的安全程序，还是扩大公共安全协议，要让人们作为团队共同工作，你必须确保他们有在一起并相互合作的具体原因。确保你合作的人理解他们正在努力实现的目标，对结果有共同的利益，欣赏个人为事业带来的才能和资源，并拥有必要的自主权以便富有想象力和战略性。关注集体目的将人们团结在合作努力中。共同的价值观和愿景在长期内发挥此功能，而团体目标则为短期提供同样的共同焦点。只有通过共同目标和对彼此成功所认识到的相互依存，人们才能勤奋地努力设计整合性解决方案。


  ## 支持互惠规范


  互惠感对于富有成效的长期关系至关重要。如果一方总是付出而另一方总是索取，付出的一方会感到被利用，而索取的一方会感到优越。在这种氛围中，合作几乎是不可能的。要建立合作关系，你必须在所有各方之间以及团队内部建立互惠规范。


  互惠的力量在众所周知的通常被称为“囚徒困境”的研究中得到了有力的证明。困境在于两个当事人（个人或团体）面临一系列情况，他们必须决定是否合作。他们事先不知道另一方将如何行为。有两种基本策略：合作（什么都不说）或竞争（指责另一方）；并且根据玩家的选择有四种可能的结果：赢-输、输-赢、输-输和赢-赢。


  最大个人收益出现在一个玩家选择非合作策略而另一个玩家真诚合作时。在这种“我赢你输”的做法中，一方以另一方的损失为代价获益。虽然这似乎是最成功的策略——至少对非合作玩家而言——但从长远来看很少成功，主要是因为在面对第一个玩家的非合作策略时，另一名玩家不会继续合作。这通常导致双方都决定不合作并试图最大化各自的个人收益。最终双方都输了。然而，当双方选择合作时，双方都赢了，尽管从短期来看，合作举动（赢-赢）的个人回报小于竞争举动（赢-输）的回报。


  多年来，研究人员惊讶地发现，面对此类困境时，从长远来看最成功的策略非常简单：在第一次行动时合作，然后做对方在上一次行动中所做的事。





  预期的结果得以实现。⁶ “这种面对面互动的需求随着问题的复杂性而增加。例如，在处理新生入学导向中许多日程安排挑战时，苏珊与校园内能帮助思考问题和推动变革的关键人物进行了多次一对一的讨论——“争取他们的帮助并协同工作。”最后，苏珊告诉我们，由于这些多次互动，她与许多核心合作伙伴（包括校园拉比）成为了很好的朋友。


  寻找方法为团队成员提供频繁且持久的机会，让他们跨学科、跨部门（或学院、大学、项目或分支机构）交流和融合。尽管电子邮件、语音邮件、应用程序和短信等虚拟工具在保持联系方面很方便，但它们无法取代积极的面对面沟通。仅仅亲自到场在建立成功关系方面要有效得多。


  凯利·麦金斯与校园领导者共同创建的领导力发展项目的一个好处是，每年同期的所有成员都在同一校园内，这使得即使项目结束后，协作和联系也能继续。当参与者起初问她“接下来怎么办？”时，她把责任放回他们身上：“你们能做些什么来保持在一起？你们认为下一步是什么？”项目中一位部门主管插话，主动提出在培训课程之外安排时间，在当地一家酒吧聚会——他甚至愿意请第一轮酒。“你们真正需要的就是这个，”凯利说。“你只需要让他们在同一个空间里。我可以协调后勤——时间和地点，提供一点统筹。要保持这些关系并从共同经历中持续学习，你需要做的就是这些。”


  当人们预期他们的互动会持续到未来（例如，他们会在某个校园活动中偶遇，会继续在这个委员会任职数年，参加后续的工作组，参加另一场比赛或演出）时，他们更有可能在当下进行合作。知道未来必须与某人打交道，确保你和他们都不会轻易忘记彼此是如何对待对方的。当未来的互动可能频繁时，今天的行动对明天交往的影响就更加显著。归根结底，持久的关系比短期关系更有可能产生合作，作为领导者，你完全有动力为自己以及你的部门或项目中的人建立这样的关系。


  事实上，凯利不辞辛苦地特意在校园里散步，不仅仅是为了欣赏美景，而是因为“很大程度上，这样做我必然会遇到一些原本见不到的人。四处走动为这些意外的相遇创造了可能。”这让她能够开启原本可能不会有的对话，从而维持长期关系，甚至了解到校园里发生的她原本可能不知道的事情。


  创造社会资本


  信息时代和物联网（IoT）的新货币不是智力资本，而是*社会资本*——即我们认识的人以及我们愿意为彼此做些什么的集体价值。当社会联系强有力且众多时，就会有更多的信任、互惠、信息流动、集体行动，甚至幸福感。⁷
  因此，你个人议程的一部分应该是与那些你需要的、能带来改变的信息、资源和影响力来源建立联系。还要确保将你的同事和成员彼此联系起来，并与那些在关键网络中处于核心地位的外部人士联系起来。这将使他们更有效率，更积极参与关键任务，并对他们的生活和工作更加满意。


  人脉最广的人通常是那些最积极参与校园活动的人。他们没有被局限于某一学科、教学法、职能、行政机构或社区。他们进出于各种任务、委员会和经历之中。他们认识来自广泛部门和项目的人，并在教职员工、甚至学生、校友和社区领域之间建立了联系。他们锤炼了自己的人际交往技能和知识，从而在成员中具有可信度，而且他们没有使自己陷入一成不变的困境。大多数大学校园被组织成独立的单元，鼓励专业化，但谈到领导力时，你必须依靠你的人脉。如果你的关系仅存在于自己的专业领域，那么相比于你跨越许多边界建立联系，你可能影响力更小。就社会关系而言，深入而广泛地经营会带来真正的长期回报。


  例如，当道格拉斯·法雷尼克担任院长时，他对科学学院的职责分配、绩效标准、休假安排等文件进行了重大修订。他非常清楚任何变更都需要大多数教师的支持，不能自上而下强行推行。教师们需要信任并认可院长在变更背后的理念。道格利用他积累的社会资本，邀请六位与他有良好关系、并且代表了该学科和机构性别多样性的教师，来考虑可能的变更，起草修订提案，并选择其中一位成员向全体教师陈述理由。


  因此，这些政策变更来自于比院长更受尊敬、与全体教师有更深厚个人关系的教师，并且比任何自上而下的决定都获得了更大的接受度。


  在一个越来越依赖虚拟联系的时代，人们容易相信这种联系会自动带来更好的关系和更大的信任。问题在于，实际上并不存在所谓的*虚拟*信任。⁸ 虚拟信任就像虚拟现实一样，与真实事物仍隔一步之遥。人是社会性动物；我们天生就希望面对面互动。如果不是这样，你倒不如完全放弃让教师在教室里授课，而让无线个人数字助理来做所有教学。比特和字节构成的社会基础是脆弱的。在一个越来越依赖电子联系的世界里，这听起来可能是异端邪说，但你必须设法将技术的好处与人类接触的社会需求结合起来并取得平衡。数据和信息可以虚拟共享，但要确保在线或远程的理解、敏感、知识和行动，仍是需要解决的难题。


  全方位创造力量


  模范领导者让周围的人感到强大和有能力。他们通过提升他人的能力和自信心，使人们能够对成功承担责任并拥有成功。模范领导者倾听他人的想法并付诸行动，让他人参与重要决策，并认可和赞赏他人的贡献。早在*赋能*成为流行词汇之前，模范领导者就已经明白让成员感到精通和有效是多么重要。


  感到有力量——确切地说，感到*有能力*——源于一种对生活掌控的深层感觉。世界各地的人都有这种倾向，当他们感到能够决定自己的命运，并相信能够调动完成任务所需的资源和支持时，他们就会坚持努力去实现目标。但当人们感到被他人控制，并认为自己得不到支持或缺乏必要资源时，他们就会表现出很少甚至没有追求卓越的承诺（尽管他们可能仍然必须服从）。领导者那些增强他人自信心、自主性和个人效能的行为，会使个人更强大，并大大增加其成功的可能性。盖洛普对全球数百万人的调查明确显示，人们在工作中感到有力量和被参与的程度，与生产效率、承诺和留任率等积极的组织成果直接相关。[^9]


  在校园里创造一种让每个人都参与并感到重要的氛围，是增强他人能力的关键。相应地，你必须给予他们根据自己认为应该做的事情来做出决定的自由。你必须提供一个既能培养他们执行任务或完成作业的能力，又能增强他们对自己判断的自信心环境。人们必须体验到个人责任感，这样他们才能拥有自己的成就。模范领导者帮助他人学习新技能，发展现有才能，并提供持续成长和变革所需的制度支持。归根结底，你是在把你的成员、与你共事的人，培养成领导者。


  ## 确保自我领导力


  领导者接受并践行这一悖论：*当你放弃自己的权力时，你变得最强大。* 这就是


  这正是马克·德卢基（Mark Delucchi）在“个人最佳领导力体验”中领悟到的，而这一体验源于一次“仁人家园大学生挑战赛”（Habitat for Humanity
  Collegiate Challenge）。简而言之，马克赋予了学生执行任务和工作的权力与权威：“尽管我试图向他们灌输我认为重要的东西，但我还是让他们明确表达自己想从这次经历中得到什么。我给了他们空间和资源，去实现他们自己定义的目标。”马克不仅对团队整体采取这种做法，对每个个体也是如此。例如，当学生协调员带着问题来找他时，马克的回答是：“这是你的舞台。*你*想怎么做？”马克鼓励人们大胆践行自己的想法，看看他们会想出什么。如果出了问题，“我会就在他们身边帮助他们学习，然后继续前行。”


  传统思维推崇一种过时的观念，认为权力是固定不变的：*如果我拥有的更多，你拥有的就更少。*自然，持这种观点的人会紧紧抓住他们认为属于自己的权力，极不情愿与任何人分享。这种观念是错误的，与所有关于高绩效组织的证据都相悖。正如马克所发现的，他并没有失去对团队或项目的影响力，因为“这确实是他们的舞台。”马克解释说，作为领导者，“需要你放弃一些东西。通过把部分责任交给他人，他们会投入其中并对这个项目充满热情。然后我的工作就变成想办法帮助他们看到这一切是如何融为一体的。但你必须相信你的团队有能力做到这一点。”


  洛丽·安·罗斯（Lori Ann Roth）凭借她在高等教育领域的经验，尤其是担任大学培训与组织发展总监的经历，赞同马克的经验。洛丽解释说：“这其实不是把你的权力交出去。你所给予的，是人们创造*自己*的‘权力’的机会——并非给予他们权力本身，而是给他们一个去创造、去决策，并让他们感到自己能掌控局面的机会。”


  研究充分支持了洛丽和马克的观点。研究人员发现，人们越是相信自己在组织中有一定的影响力和掌控力，组织的效能和成员满意度就越高。共享权力会带来整个组织中更高的工作成就感和绩效。[^10]


  当你以有形和无形的方式让他人变得强大时，你就展现了对其能力的深切信任和尊重。当领导者帮助他人成长和发展时，这种帮助会得到回报。那些觉得自己有能力影响领导者的人，会更坚定地追随这些领导者，并更投入地有效履行自己的职责。[^11]
  他们*对工作有主人翁意识*，感受并接受对自己行动和结果的担当，并在许多方面自觉不辜负领导者的期望和信任。


  ### 提供选择


  如果你渴望更高的绩效和更强的主动性，就必须主动设计工作，让人们在所做的事情上有选择权。换句话说，他们需要拥有*自主决定权*；这意味着能够采取非常规行动、独立做出判断，并在影响其工作方式的决策中自主决定，而不必请示他人。


  查理·斯莱特（Charlie Slater）在开发那个新博士项目时处理的各种审议和决策，远非例行公事。他确保自己向各个利益相关群体（如教师评议会）提出的任何方案，都能让他们就该项目的引入和构建方式进行选择。对于在该项目正式启动前实际注册的第一批学生，他也同样如此。在开发另类春假项目时，肯特·科斯（Kent
  Koth）确保在每个人都怀有相同的“大愿景”的同时，学生们无论是个体还是集体，都对如何安排日常活动拥有许多选择。


  通过这些方式，像查理和肯特这样的领导者，不仅会在那些负责项目或计划的成功与活力的人心中培养出主人翁意识，还会让他们拥有*实际*的所有权。选择会激发人们对自身生活的权力感和掌控感，数据也支持这一论断。人们越是频繁地表示他们的领导者“在决定如何开展工作方面给予人们极大的自由和选择权”，他们的高效能感就越显著提升，如图5.2所示。


  你希望人们主动积极、自我导向。你希望他们独立思考，而不是不断问“我该怎么办？”如果你总是告诉人们该做什么以及该怎么做，这种能力就无法培养。除非他们获得一定程度自主权，否则他们真的学不会独立行动。如果他们没有任何选择自由，只能按照组织规定的方式行事，那么当学生、校友或同事的行为超出预设脚本时，他们如何应对呢？


  ![](img/7ddf49e8d8cd889f8f7c75097442c3e0_134_0.png)


  **图5.2** 那些被视为在决定如何开展工作方面给予人们自由和选择的领导者，会提升直接下属的效能感。


  如果人们必须问“老板们”该做什么——即使他们知道需要做什么并且觉得自己能做——这个过程会拖慢整个组织。如果他们的老板不知道，他们还得去问经理，然后沿着组织层级一路向上。要打造一个高效且有效的组织，唯一的方法就是赋予人们权力，让他们在运用知识和技能时发挥最佳判断。这样做本身就是一种明确的信任实践。


  虽然选择是必要的，但仅有选择还不够。如果缺乏专业完成工作所需的知识、技能、信息和资源——而且没有能力有效执行所需的选择——人们会感到不知所措和无能为力。这意味着你需要确保自己已经为人们做好做出这些选择的准备，并让他们接受组织指导原则的教育。然而，即使人们拥有资源，有时他们也可能不确定自己是否被允许使用这些资源，或者当事情进展不如预期时是否有人支持他们。


  ### 培养能力与信心


  人们无法做到自己不会做的事情。因此，当你增加成员的自主空间和决定权时，也必须增加在培训和发展上的投入，并提供在工作中学习的机会。人们可能不愿运用自己的判断力，部分原因是不确定如何完成关键任务，也可能因为害怕犯错。关于“最佳职场”（Great
  Place to Work）公司的研究表明，“确保员工获得所需的培训，并让他们参与影响其工作的决策，能够同时培养能力和敬业精神。”¹²


  增强他人能力需要对提升人们能力和培养他们信心的举措进行前期投入。领导者知道，如果人们要感到强大，就必须不断提升和发展自己的技能与能力。领导者知道他们需要与成员分享信息和资源。做好的信心在增强他人的过程中至关重要。仅仅因为个人知道如何做某事，并不一定意味着他们会去做。


  面对招生办公室部分员工技能不足的情况，霍莉·王（Holly Wang）抽出时间与每位团队成员并肩工作，向他们展示并讨论如何处理各种情况。当关键问题出现时，她迅速将整个团队召集在一起，向他们讲解她如何处理争议和解决问题的心路历程——并明确期望下次他们能够独立处理。她还建立了临时伙伴关系，让每个伙伴更了解对方，这种交叉培训有助于提升双方的技能。随着信心的增强，他们彼此的理解和信任也加深了。对其他团队成员的教育、培训和辅导建立了自信，霍莉的团队也变得更加强大。


  赋能他人行动不仅仅是一种实践。它是一个心理过程中的关键一步，这一过程影响着对自我决定的内在需求。为了在生活中体验到某种秩序感和稳定感，所有人都有一种影响他人和生活事件的内在需求。领导者会采取行动并创造条件，以增强成员的自尊和内心的效能感。当人们感到自己能够应对各种事件和情况时，他们就有条件去发挥领导力。


  没有足够的自信心，人们就缺乏迎接艰巨挑战所需的信念。缺乏自信会表现为无助感、无力感和严重的自我怀疑。建立自信需要培养人们的内在力量，使他们能够勇敢地踏入未知领域、做出艰难抉择、面对反对意见，并沉着应对意外，因为他们相信自己的技能和决策能力。


  实证研究记录了自信如何影响人们的表现。在一项研究中，参与者被告知决策是一种通过练习培养的技能。他们越努力实践，能力就越强。另一组参与者则被告知决策反映的是……



  他们基本的智力天赋。潜在认知能力越高，决策能力就越好。


  两组人员都在一个模拟组织中处理一系列问题。认为决策能力是可习得技能的参与者，持续为自己设定有挑战性的目标，运用良好的问题解决策略，并促进了组织生产力。而那些认为决策能力是与生俱来的（即要么有要么没有）的参与者，在遇到困难时对自己失去了信心。他们降低了对组织的期望，问题解决能力下降，组织生产力也随之下降。有趣的是，那些对自己的判断失去信心的参与者，往往更多地把过错归咎于他人而非自己，他们对别人相当苛刻，认为别人缺乏动力、不值得上级关注。¹³


  正如这些研究——以及你自己的经验——所强调的，无论工作多么困难，拥有信心并相信自己的能力是促进和维持持续努力的关键。培养自我效能感并不是“积极思维力量”的翻版。领导者要传达出他们相信人们能够成功的信念。这种信念在“最佳领导经历”中显而易见：有人相信他们，并给他们机会去实现非凡的事情。知道有人期望他们成功，激励他们拓展自我，并在任何困难或挫折面前坚持下去。


  ## 培养个人责任感和担当


  责任感是每一项协作努力中的关键要素。当人们承担个人责任并为自己的行为负责时，同事会更愿意与他们合作，总体上也会更加配合。每个人都必须尽自己的本分，团队才能有效运作。当你安排情境让人们必须相互协作时，个人责任感就会增强。知道同伴期望你做好准备并做好本职工作，是激励人们表现优异的有力动力。不想让团队其他人失望的感觉，会增强人们尽最大努力的决心。此外，人们越是相信其他人都称职并承担自己的职责，他们就越会信任和合作。同样，当人们确信其他人会尽到自己的本分时，他们自己也会更投入地履行自己的职责。


  当你明确赋予人们选择的自由时，你实际上也是在增加他们必须承担的个人责任程度。在虚拟相连的全球工作场所中，选择与责任之间的相互关联变得越来越重要。正如霍莉的“最佳领导经历”所揭示的，要培养责任感，她需要下放权力，给他人掌握主动权的机会。她意识到，通过信任他人并赋予责任，她是在让他们知道她相信他们，并信任他们的能力和判断力。鉴于霍莉所表现出的信任程度，他们反过来也更有动力去兑现自己的承诺。当你允许他人承担更多责任时，你也能从中受益，因为你可以腾出手来承担新的职责和学习机会。


  有些人不愿分享权力，因为他们认为合作努力会削弱个人责任。他们认为，如果鼓励人们集体工作，他们对自己行为的责任感会比被鼓励竞争或独自做事时更少。诚然，有些人会变成“社会惰化者”，由别人替他们干活，自己却偷懒。但这种状况不会持续太久，因为团队成员很快就会厌倦承担额外负担。要么偷懒者振作起来承担责任，要么团队希望此人出局。你的部分工作就是创造条件，让每一位团队成员都能对成功的结果产生主人翁感。


  ## 反思问题：赋能他人行动


  “你无法独自完成”是卓越领导者的信条——而且理由充分。你不可能单枪匹马地改变一切。促进协作才能使部门、项目、学校和其他联盟有效运作。只有当您培养相互依赖感——一种“我们同舟共济”的感觉——协作才能持续。共同的目标和角色有助于相互依存。知道别人会互惠互利，是帮助他人实现目标的最佳激励。帮助带来帮助，正如信任带来信任。关注可以获得什么，有助于在可能引发分歧的问题上达成一致。通过以身作则来营造信任氛围。确保关键成员能够相互建立人际联系。努力使这些互动持久，并将人们与多种影响和信息来源连接起来。


  领导者将下属变为领导者——使人们能够自主行动。当你让他们能够行使选择和自由裁量权，培养他们行动和卓越的能力与信心，并培养促使行动的责任感和担当时，你就强化了他们。卓越的领导者将他人的服务作为自己权力和影响力的运用方向，因为他们知道，有能力和自信的人表现最佳。


  在培养“赋能他人行动”这一领导实践的胜任力时，请花时间思考以下问题。在充分考虑后，让他人知道你的想法和愿意采取的行动。


  - 你如何为人们提供在工作中成长、发展和拓展的机会？你在哪些地方可以赋予人们更多的责任和担当？

  - 你如何与团队中的成员分享更多信息和责任？你如何让他们更了解本单位或职能范围之外发生的事情？

  - 你可以在哪里为你的团队与更大机构中的其他人建立联系——并借此提供新的体验？你如何将团队外部的人与团队内部的人联系起来？

  - 你如何表现出你相信人们能够学习、创新并做出更大贡献？他们在哪些方面可以比现在拥有更大的自由度和裁量权？


  ## 激励人心


  当詹妮弗·纽特福尔和她的大学图书馆员工在三年内完成了五年战略规划时，她想展示团队的成就以获得公众认可。图书馆管理团队向大学与研究图书馆协会提交了一份申请，重点介绍了他们如何评估自身工作、与社区的互动以及组织结构如何转型。他们获得了“卓越学术图书馆奖”，正如詹妮弗所说：“这是对我们所取得成就的一个很好的总结。看到它整合在一起，真的令人惊叹。”


  “这个奖项的伟大之处，”詹妮弗继续说道，“不仅仅是给图书馆带来的一块牌匾和一笔适度的奖金，更是让每个人真正一起庆祝的机会。”她的机构计划了一场盛大的庆祝活动，詹妮弗借此机会展示了图书馆如何从过去僵化的领导实践中走出来：“我想让校园看到，*这就是现在的我们。你所认识的那个旧图书馆已经不存在了。*”这次公开表彰是一个机会，来认可她的员工多年来为彻底改革图书馆并克服挑战所付出的努力。她安排为员工发放带有图书馆标志的抓绒外套，并举行了一个规模较小的、图书馆内部的纪念活动，让每个人都能看到并触摸到真正的奖杯。她还装订了获奖申请书的副本，让图书馆的每一位工作人员都能



  他们过去三年辛勤工作的有形象征。将所有人聚在一起时，詹妮弗说，“是一个很好的时刻，停下来对自己说，‘看看我们取得了什么成就。’”


  与我们交谈过的许多其他领导者一样，詹妮弗深知认可人们的独特之处并庆祝他们的贡献与成就的重要性。在个人最佳领导力案例研究中，我们一次又一次地看到，人们表示自己工作强度极大、时间很长——并且乐在其中。然而，要连续几个月保持这种节奏，人们需要鼓励，而卓越的领导者总是会帮助人们找到勇气，去做他们从未做过的事情。


  领导者通过认可个人贡献和共同庆祝胜利来激励他人。大多数人对“有一位关心下属的老板”的重视程度甚至超过了对金钱或附带福利的重视。事实上，员工在一家公司待多久、工作成效如何，更多取决于他们与直属上司的关系，而非其他任何因素。¹


  在高等教育领域，最有效的领导者是那些最频繁地“激励人心”的人。我们询问直接下属，他们的领导在《领导力实践清单》上践行与“激励人心”相关的六种行为的频率如何，评估从1（几乎从不）到10（几乎总是）。我们还单独询问了他们一个问题，即他们在多大程度上同意或不同意这样的说法：*总体而言，这个人是一位有效的领导者*（1
  = 非常不同意，5 = 非常同意）。分析表明，随着领导者越来越多地践行与“激励人心”相关的行为，下属对其有效性的评分呈系统性上升（*p* < 0.001）。从最低四分位数到最高四分位数，有效性评分提升了近63%。


  ## 聚焦明确的标准


  想象一下《爱丽丝梦游仙境》中爱丽丝在玩槌球时的挫败感：球槌是火烈鸟，球门是纸牌士兵，球则是刺猬。所有人都在移动，规则也在不断变化。她根本不知道该怎么玩这个游戏，更不用说赢了。


  你不必跳进兔子洞也能体会爱丽丝的感受。难道你不曾在某个时刻，身处一个不知道自己该往哪里去、不知道该遵循什么基本行为准则、也不知道自己一路上做得怎样的境地？而正当你以为自己已经掌握了要领时，组织却突然出现，改变了一切。这是令人抓狂的挫败感和糟糕表现的根源。解决办法是确保人们既知道自己该做什么，也知道该怎么做。数据显示，人们为自己所在的组织感到自豪的程度，与领导者“特意让下属了解自己对他们能力的信心”的程度直接相关（见图6.1）。


  如果你希望部门的人有强烈的成功愿望并希望有所作为，他们必须感到自己“处于心流之中”。*心流*时刻是指人们在做事时体验到纯粹的愉悦和毫不费力的状态。² 这种心理状态需要明确的标准——无论是在价值观还是目标方面——因为这些能帮助人们集中精力，避免分心。


  是人们自己设定目标更好，还是应该由领导者为他人设定目标？在理想情况下，人们会自己设定目标。然而，现实往往是目标由上而下传达，挑战在于找到一个中间地带——一条确立双方都能接受的目标的路径。当人们有机会参与影响自己相当一部分工作职责时，他们对自己的感觉和对所做工作的感觉会更好。你的挑战——也是机遇——在于确保人们知道他们为之服务的最终目标，并明白自己所做的事情很重要。有了这一点，他们就有理由去关心，并愿意自愿付出额外努力去创造不同。


  ![](img/7ddf49e8d8cd889f8f7c75097442c3e0_144_0.png)


  **图6.1** 领导者让他人了解自己对其能力的信心程度，会提升直接下属的自豪感。


  如果没有标准和目标，组织中的任务往往让人感觉只是瞎忙。明确的标准和目标为工作提供了背景，让人们相信他们可以共同努力并因完成目标而获得认可。它们能帮助人们紧盯目标，激励他们把手机调到勿扰模式，屏蔽噪音，集中时间和精力。没有目标，人们就不知道该用自己的能力做什么，正如那句老话所说：*如果你不知道要去哪里，任何道路都能把你带到那里。*


  然而，标准和目标并不完全足够。人们还需要知道自己是在朝着目标前进，还是在消磨时间。只有当人们拥有一个有挑战性的目标*并且*收到关于自己进展的反馈时，他们提高任务效率的动力才会上升。³
  没有反馈的目标，或者没有目标的反馈，对动机的影响都很小；但两者结合起来，就能让人保持在正轨上。在学术指导中的类似情况是：面对一个不在乎提高自己表现（成绩）的学生，或者在课堂上，老师不向学生提供关于作业的反馈。


  有了明确的目标和详细的反馈，人们就能自我修正，也更容易理解自己在全局中的位置。通过反馈，他们可以判断自己是否走在正确的道路上，以及需要什么帮助才能最具成效。许多教职工领导者向我们表达了这样的观点：*你可能并不总是喜欢反馈，但意识到自己的不足是改进的关键。*
  从可信度的角度来看，如果从不获得关于自己行为的反馈，你怎么知道自己是否做到了所说的要去做的事？反馈为你提供了一个关于你自己以及你做得好坏的视角，而这种视角只有他人才能提供。它是你了解自己是否在执行任务并朝着目标前进的途径。


  在一项关于反馈对自信影响的研究中，研究生在一个创造性问题解决模拟任务中的表现受到了表扬、批评或没有收到任何反馈。他们事先被告知，自己的表现将与其他数百人在同一任务上的表现进行比较。那些对自己表现好坏毫无所闻的人，其自信受到的打击与受到批评的人一样大。⁴
  人们渴望反馈。他们更愿意知道自己的表现如何。没有消息和坏消息的影响是一样的。这也是为什么在中学和大学里取消成绩的努力几乎总是失败的原因之一。


  ## 期待最好的结果


  卓越的领导者对自己和共事的人都有很高的期望。这些期望之所以强大，是因为它们是人们安放现实的框架。人们更倾向于看到他们期望看到的东西，即使他们的看法与实际情况可能有所不同。大量研究证据表明，人们的行为方式会受到他人对自己期望的影响。如果你期望别人失败，他们很可能会失败。如果你期望他们成功，他们很可能会成功。⁵
  作为领导者，你所持有的期望就是人们安放自己现实的框架。


  你的期望塑造了你对他人的行为方式。领导者对他人的高期望在很大程度上建立在对自己的期望之上。这就是为什么领导者必须“以身作则”如此关键。你自己的成就和奉献记录，以及你日常展示的需要完成什么以及如何完成的方式，为你对他人所持有的期望提供了可信度。


  卓越的领导者以能够增强他人自信的方式对待他们，使他们有可能取得超出自己最初认为可能达成的成就。感受到他人的欣赏会增强一个人的自我价值感，


  这反过来又促成你在工作和家庭中的成功。

  研究和日常经验都证实，自尊心强的男性和女性会“感到自己独一无二、有能力、有安全感、有力量，并且与周围的人紧密相连。”⁶ 这在所有年龄、教育水平和社会经济背景中都是如此。如果你的生活中有一个相信你的人，并且他/她不断通过与你的互动强化这种信念，你就会被这种支持深深影响。


  相信他人是推动绩效的格外强大的力量。如果你希望共事的人拥有赢家心态，你必须相信他们已经就是赢家。不是他们将来某一天会成为赢家，而是他们此刻就是赢家！如果你相信人们是赢家，你就会以对待赢家的方式对待他们。此外，如果你希望人们成为赢家，你就必须通过你的行为向他们传递“你们就是赢家”的信号。这不仅仅关乎你的言辞，也关乎你的语调、姿态、手势和面部表情。不要大喊大叫、皱眉、哄骗、取笑，也不要当着别人的面贬低他们。相反，应当友善、积极、支持、鼓励。给予积极强化，分享大量信息，认真倾听他人的意见，提供足够资源让他们做好工作，布置更具挑战性的任务，并给予他们你的支持和帮助。


  这是一个良性循环：你相信下属的能力，你的积极期望让你在行动中更加积极，而那些鼓舞人心的行为产生了更好的结果，又强化了你对人们能力的信念。这个良性循环真正强大之处在于，当人们看到自己能够实现非凡表现时，他们就会对自己产生这样的期望，于是另一个良性循环又开始了。


  他们的积极动作比其他保龄球手提升显著得多，也是对未来继续从事这项运动兴趣最高的。⁹


  在你能领导他人之前，你必须相信他人，也必须相信自己。与越来越多关于成长型思维模式重要性的研究一致，相信人们可以改变——可以发展新技能和能力——这种信念对于被领导者和持有这一期望的领导者都能产生神奇的效果。成长型思维模式的人相信他们的特质——如智力、天赋和能力——可以通过时间和努力去学习和发展，而固定型思维模式的人则认为这些特质自出生起数量就固定不变，无法大幅改变。¹⁰


  在充满挑战的时期，尤其是遭遇挫折时，可以预期固定型思维模式的人会回避那些可能暗示自身短板的活动。“显得不傻”驱动着他们的行动和决定。相反，成长型思维模式的人把生活视为一段旅程，在其中挑战和挫折被视为学习和提高的机会。我们的研究发现，固定型思维模式的人不太倾向于“激励人心”，因为他们对人们“可能”完成的事情没有很高的期望；他们倾向于关注哪里出了错或不管用，而不是什么是对的而且运行良好。¹¹


  ## 关注


  领导者经常走动。他们不会把所有时间都花在办公室里或办公桌后面。他们会出席演示会、参加会议、巡视校园、走访学生会、顺便走进实验室，在校友聚会上做演讲，举办圆桌讨论、

  与社区团体交流，还会到同事的办公室串门问候。四处走动是领导者的工作常态。


  这不是无目的的游荡。领导者外出是有原因的。外出走动的一个核心原因就是表明你关心他人。表达关心的一种方式就是*关注*人们，关注他们正在做什么以及他们的感受。你必须透过组织结构图、职位描述和人们扮演的正式角色，看到内在的这个人。如果你清楚自己要寻找的标准，如果你相信并期望人们会像赢家一样表现，你就会发现大量例子，人们既在正确地做事，也在做正确的事。


  关注不能隔着距离——不能只靠读报告或听二手信息。与你共事的人想知道你是谁、你的感受如何，以及你是否真的在乎。他们想要看到真真切切的你。因为距离近是预测两个人是否会交谈的最佳单一指标，所以如果你要沟通交流并了解他们的动态，你就必须接近人们。对你而言，这意味着定期在走廊里走动，参加各种校园活动（社交、体育、戏剧等），经常去相关场所与他人非正式地待在一起（如员工休息室、教师俱乐部、学生会等），甚至经常出差，去其他校园和机构的同行那里走访。


  外出走动的另一个好处是提高你自己的可见度，让你更被别人所了解。然而，不要仅仅为了被人看到才这么做；这么做是因为在你去了解他人的同时，他们也在了解你。关注并积极欣赏他人会增强他们对你的信任。人们更信任自己认识的人，而不是陌生人。依据互惠原则，如果人们

  知道你真心关心他们，他们就更可能关心你。


  ## 发展友谊


  管理界有一种传言说你不应与同事走得太近，你不能和工作中的同事做朋友。好吧，且把这个传言放到一边。在五年多时间里，研究人员观察了朋友群体和熟人群体（彼此只有略微了解的人）执行运动技能和决策任务的情况。结果一目了然：由朋友组成的群体平均完成的项目数量是仅由熟人组成的群体的三倍多。在决策任务方面，朋友群体的效率比熟人群体高出20%以上。¹²


  然而，有一个重要的告诫：朋友必须坚定地致力于团队的目标。如果做不到，朋友的表现可能不会比其他任何人更好。这正是为什么你必须明确标准并创造共享愿景和价值观的条件。在绩效方面，对标准的承诺和人们之间的良好关系相辅相成。


  人们更愿意追随自己喜欢和信任的人。如前所述，要获得完全信任，你需要首先付出代价，让自己保持开放：对他人开放，并*与*他人坦诚相见。正如敞开的门是愿意让他人进入的有形表现，敞开的心扉是一种情感上的表现。这意味着要让他人更多地了解你——你关心什么，你为什么做出这样的选择，等等。我们不是指小报式的爆料，而是指谈论你的希望和梦想、家人和朋友、兴趣和追求——那些你也想了解他们的事情。


  当你敞开自己时，你让自己变得脆弱；正是这种脆弱使你更有人性，也更值得他人信任。如果一段关系中的任何一方都不愿意冒一点信任的风险，关系就会停留在谨慎和怀疑的低水平上，毫无连接可言。如果领导者想要获得信任和协作带来的更高绩效，他们必须先展现*对*他人的信任，然后才能要求*来自*他人的信任。


  凯西·阿维拉作为住宿学习社区主任，理解并实践了这一点。“作为领导者，”凯西告诉我们，“我是一本打开的书。我会分享很多关于我个人的事情，让被我领导的人能够完整了解我迄今为止的人生历程，从而更好地理解我如何工作以及为何以这种方式工作。”凯西很快发现，当她率先分享个人信息、挑战、目标和恐惧，以此向住宿员工展示信任时，产生了巨大的不同。对某些员工来说，“这是第一次有成年人（更不用说他们的老板了）对他们如此诚实和坦率。”通过敞开心扉，凯西激励了团队成员向小组中的其他人分享自己更深层次的自我。


  披露信息可能有风险。你无法确定别人会欣赏你的坦率、理解你的经历、赞同你的抱负、支持你的计划，或者按照你本意解读你的言行。但是，像凯西那样展示愿意承担这种风险的态度，你就会鼓励他人承担类似的风险——从而迈出寻找共同点、建立互信的必要第一步。


  ## 个性化认可


  关于认可，一个常见的抱怨是它往往太可预测、太没有人情味。一种一刀切的方法


  认可的感觉往往显得虚伪、勉强且缺乏思考。就像餐厅里庆祝生日那样：工作人员对某人唱歌，其他桌的人虽然不认识那个人，也跟着唱起来。无论初衷多么好，久而久之，这些例行公事会增加人们的愤世嫉俗，实际上还会损害信誉。你不能只是走过场似的表扬，不能只是走在校园里说：“谢谢你，不管你是谁，不管你正在做什么。”至关重要的是要关注团队中每个人的喜好和厌恶。要让认可变得有意义，你必须了解你的受众。通过个性化的认可，你传达出的信息是：你花了时间去留意这项成就，找到了负责的人，并及时表达了感谢。


  当卡琳·贝希特尔将她所谓的“‘一堆各自为政的项目’转变为‘一个真正的研究员项目’”时，她特意在人们为遴选过程所做的贡献与遴选结果之间建立起个人化的联系。卡琳不只是写感谢信；她将每一封都写得个性化。她还与他们分享“入选研究员名单，并展示具体的申请材料以及他们提出的具体推荐意见如何在决策过程中发挥了关键作用”。这种个性化与公开的肯定对每个参与者都是一种鼓舞。当她请某人解释他是如何取得一项非凡成就时，她也给予了认可。对成就背后的故事表现出兴趣，既是对结果的尊重，也是对达成结果的人的尊重。¹³


  不个性化的认可很快就会被遗忘和轻视。当我们请人们讲述他们“最有意义的认可”时，他们一致表示这些认可都是“个人化的”。他们说那种感觉很特别。正如其他研究者所指出的，“在恰当的时候来自恰当的人的一句真诚的感谢，对员工来说可能比加薪、正式奖励或满满一墙的证书和奖牌更有意义。”¹⁴


  认可和奖励在多大程度上以个人化的方式（而非非个人化的方式）落实到每个人身上，也在很大程度上解释了领导者及其组织如何通过认可人们的贡献来获得激励效果（或没有效果）。领导者激发他人最好的一面，不是通过在人们脚下*点*火，而是通过在人们心中*点燃*火焰。肯定人们的成就，会让他们感到被重视和被信任，强化他们正在取得进展的意识，并激励该个体以及其他人投入更大的努力、达到更高的绩效水平。


  个性化认可归根结底在于*体贴*。你需要真诚，并真心关心这个人。把你对某个人的观察所得拿出来，问一问自己：*怎样才能真正让她觉得这件事特别而独一无二？我能做些什么来让这成为一次难忘的经历，让他永远记得自己的贡献有多重要？*


  ## 综合运用多种认可与奖励方式


  不要错误地认为人们只对金钱奖励有反应。尽管加薪和奖金无疑受到重视，但个体对奖励和认可的需求与珍视远不止于此。而且，顺便提一下，研究表明大多数人会把现金奖金用来付账单，几个月后他们甚至不会记得钱是怎么花的，甚至不记得自己收到了多少钱。¹⁵
  现金乃至加薪的更大问题在于，其供应量有限，尤其是在高等教育领域，而且大多数情况下它们都不在你的直接或及时控制范围内。


  人们对各种非正式的致谢方式都会有反应。在同事面前对某人的表现进行口头认可，以及可见的纪念物，如证书、奖牌、奖杯和纪念品，也是强有力的成就纪念方式。例如，一位教员第三次获得一项享有盛誉的写作奖时，他的系主任送给他一顶破旧的帽子，因为获奖对这位教员来说已经是“家常便饭”了。


  还有很多其他表达感谢的方式，它们都在你的影响范围和能力之内。例如，你可以寄一张手写便条（比电子消息更好），在会议上对某人的出色工作或成就作出评价，或者只是顺便去他们的格子间或办公室，让他们知道你留意到了他们正在做的出色工作。人们告诉我们，自发的、意想不到的奖励通常比预期的正式奖励更有意义。而且，要想达到最佳效果，请确保你的认可是高度具体的，并且紧跟在适当行为之后给予。过于笼统或过于迟缓都会削弱这种举动的积极力量。


  作为领导者经常走出去走动的最重要好处之一是，你可以亲眼观察到人们做对了事情，然后当场或在下一个公开场合认可并奖励他们。此外，依赖组织的正式奖励体系通常需要比利用内在奖励付出多得多的努力——内在奖励是工作本身所固有的，包括成就感、发挥创造力的机会、工作带来的挑战，以及圆满完成工作的满足感等因素。尽管有些人可能不这么想，但研究表明，在提高工作满意度、敬业度、留任率和绩效方面，内在奖励远比工资和附加福利重要。¹⁶


  通常，简单而个人化的举动才是最有意义的奖励。个人祝贺在员工列出的最有力的非金钱激励因素中位居榜首。¹⁷ 调查还表明，79%离职的员工将缺乏认可列为主要原因。¹⁸
  例如，高级副教务长丽莎·米洛拉谈到，感谢他人是多么重要，哪怕只是一句简单的感谢，感谢他们的时间、努力、信任以及愿意参与对话。她从不把教务办公室任何行政人员的工作量视为理所当然，而且她总是给他们寄手写感谢信。她也总是努力在人们就某个问题向她反馈后给予回应，她说，即使“我不打算对反馈采取任何行动，我也要让他们知道，我非常感谢他们的意见。”与丽莎不同，没有足够多的人充分利用那两个有力而廉价的字：“谢谢”。


  负责某医学院领导力发展与教育的简·宾格经常询问人们希望得到什么样的认可。她发现大多数人只想要一个简单的举动，表明他们的工作受到欣赏和重视。作为系主任，罗恩·西尔斯告诉我们，他发现每次教员会议开始时留出时间让大家感谢同事的贡献和努力是“极其有力的”。“没有人愿意被忽视或感到不被欣赏，”他说；“而且，这样做还能将我们的感谢与我们的核心价值观紧密联系起来。”


  对于自己的努力能够被注意、被认可、被感激，几乎是最基本的需求了。这对校园里的每个人都适用——学者、工程师、艺术家、辅导员、宿舍管理员、预算分析师、体育教练、设施维护人员，以及校长办公室的人。拥有最浓厚感谢氛围的机构，往往是最富有创新精神和活力的组织。


  ## 培育共同体精神


  在世界各地，在每个国家、每种文化、每所校园里，人们都会在一年中的某些日子或场合放下工作，抽出时间去庆祝。即兴的仪式常常是为了庆祝同事的稿件被接受发表、研究实验室获得新合同、新设施或艺术装置揭幕、再次获得认证等等。人们组织宴会，表彰那些取得了非凡成就的个人和团体。同事们在一个耗费精力的特别工作组或晋升委员会工作结束后，会聚在一起，为出色完成工作而互相击掌庆祝。即使在悲痛的时刻，人们也会聚在一起，以追思和歌声向先辈致敬，并重申他们共通的人性。


  为什么人们会从工作中抽出时间聚在一起，讲述故事，振奋精神？当然，每个人都需要从工作的节奏和强度中稍作休息，但庆祝并不是无所事事的轻浮借口。庆祝活动是人们表达尊重和感激、更新共同体意识、提醒自己共同价值观和传统的最重要方式之一。对于校园机构的长期健康发展而言，庆祝活动与日常履行职责同样重要。


  领导者从实践中得来的经验在我们的研究中得到了证实。当领导者把人们聚集在一起，为他们的成就欢欣鼓舞，并强化他们共同的原则时，绩效就会提高。通过把人们聚集起来，分享成功的经验，并亲自参与其中，领导者增强了其他人所需的勇气，从而在自己的组织中创造改变，成就非凡。





  个人的认可会提升被认可者的价值感，并改善其表现。公开庆祝也有这种效果，*而且不止于此*。每次你能把大家聚在一起，都是重新激发承诺的机会。卓越的领导者很少放过任何机会，以确保每个人都明白他们为何在此，以及他们将如何为实现那个目标而行动。无论是为了表彰个人、团队还是组织成就，庆祝活动都为领导者提供了绝佳的契机，来明确传达和强化那些对实现共同价值观和目标至关重要的行为。


  庆祝活动远不止是聚会；它们是创造意义的仪式和庆典。在这样的场合，明确你要传达的讯息和你要强化的行为至关重要。你应当充分意识到，人们离开活动时，会记住并复述你所说的话和所看到的事情。你应当时刻亲自准备好想传递的关键信息。每次都要问自己：*我们珍视什么样的价值观？我们渴望实现什么愿景？我们要强化哪些行为？*
  为每一次公开机会做好准备，以强化你希望灌输的文化和意义。


  ## 提供社会支持


  工作中的支持性关系——即真诚地相信并倡导他人利益的关系——对于维持个人和组织的活力至关重要。仪式和庆祝活动是建立更健康团队、让组织成员相互了解和关心的机会。


  > “人生苦短，不必自寻烦恼，”人力资源副总裁查尔斯·安贝朗说（虽然他最初是以学生会主任的身份来到这所大学的）。“你希望拥有的工作体验是：能与他人互动、一起欢笑、在情境中看到幽默，并感谢人们做好工作。”非正式地，查理被称为人力资源部的CEO——首席鼓励官。


  当他掌舵时，人力资源工作组士气低落、惶恐不安。团队已经习惯于一个很少认可成功、对失败严加惩罚的环境。他的员工告诉我们：“人力资源团队需要有人来欣赏我们个人和集体的努力。查理专注于鼓励每个人成为团队中有所贡献的一员，并致力于对深层价值观和校园社区服务的集体承诺。”


  查理经常让部门成员知道他相信他们，并相信他们会成功，以此来鼓励他们。他还会做一些疯狂、一时兴起的举动来庆祝团队的成就，比如去杂货店买几盒冰棒和冰淇淋。他会带着他的冰爽战利品回到办公室，清空送信车，装满零食，然后一边在办公室里巡游，一边用智能手机播放冰淇淋车的音乐，让每个人挑选自己喜欢的冷冻美食。


  查理为团队组织庆祝式郊游，比如“人力资源看电影之夜”。当最近一部大片上映时，他买了40张票，让每位人力资源员工可以邀请一位家人或朋友一起看电影，然后共进晚餐，讨论所看的内容以及如何将其与工作联系起来。他还组织人力资源员工及家人周五晚上去看当地的小联盟棒球赛。“这是一种有趣而放松的周末结束方式，也能让我们花时间更多地了解团队伙伴及其家人，”他的一名员工解释道。


  努力，以及他们彼此需要并可以相互依靠来把事情做成并取得成功。这些提醒在动荡和压力时期建立起继续前行的勇气，并强化了一个事实：需要一群人怀着共同目标、在信任与协作的氛围中一起工作，才能超越平凡。


  社会支持的理由还因这样一个事实而得到进一步强化：无论在正式还是非正式互动中，当人们彼此喜欢时，信息交换更容易发生。即使在互联网和智能手机时代，人们在与他人聚会时也比独自坐在工位前更愿意分享东西。当庆祝活动打破职能和层级界限时，人们就有机会与自身领域之外的人交流想法并获得启发。


  ## 亲自参与


  无论你在哪里发现以共同价值观为基础的强大文化，你也会发现无数亲自践行这些价值观的领导者。领导者通过行动使价值观变得具体。那位因为离建筑中心更近而选择不太理想套房的宿舍管理员，那位为了按时把论文发还给学生而整个周末都在工作的教师，以及那位继续授课以保持与学生联系的学术管理者——他们都向他人表明，践行价值观非常重要。这与“激励人心”是一样的道理：无论是通过个人认可还是集体庆祝，领导者都必须以身作则。


  向人们展示你真正关心他们、欣赏他们的努力的唯一方式，就是与他们在一起，亲自参与。你必须走走廊，在宿舍楼里转悠，在食堂吃饭，在图书馆里漫步，征求并倾听反馈，讲述成就的故事。这种可见性可能会让你容易受到批评，但肯定也会让你更加真实、更加真诚。对你的同事来说，你不仅是研究生项目主任，还是那个在开放日与他们交谈过的人。你不仅是公共安全主管，还是那个来到体育部办公室，为让球员和客队嘉宾感到更受欢迎而集思广益的人。当你亲自参与时，真诚度会提升。通过直接、可见地向他人表明你在意他们、希望他们成功、会为他们加油，你正在发出积极的信号。此外，如果你这样做，他人也更有可能采取同样的行动。就是这么简单。那些最强烈感到组织重视他们工作的人，也最赞同他们的领导者“亲自参与表彰人员和庆祝成就”，如图6.2所示。


  ![](img/7ddf49e8d8cd889f8f7c75097442c3e0_163_0.png)


  图6.2 领导者亲自参与表彰人员和庆祝成就的程度，会增强人们对其工作受到重视的感受。


  四处走动、亲自参与以表示你关心，这样的另一个好处是，这段经历为你提供了发现和讲述那些赋予价值观人性化面孔的故事的机会。第一人称的例子总是比第三人称的例子更有力量、更令人难忘。这正是“我亲眼所见”与“有人告诉我”之间的显著差别。你应该时刻留意部门中“发现人们做正确的事情”，而这不能靠待在办公桌、柜台或电脑屏幕后面做到。你需要亲眼看到并了解正在做对的事情，不仅是为了让个人和团队知道继续保持良好工作，而且是为了能够向他人讲述那些有所作为的行为。这样一来，你可以分享近距离的亲身经历，说明在实时情境中将共同价值观付诸实践到底意味着什么。你让价值观不仅仅是口头宣言；你让它们活了起来。你在部门或机构中推崇每个人都认同的榜样。


  讲述校园里的人们如何践行价值观的故事，是传递人们应该如何行动和决策信息的最快、最有效的方式之一。²¹ 通过讲故事，你能比通过幻灯片演示中的要点或移动设备上的推文更好地实现教学、动员和激励的目标。倾听并理解领导者讲述的故事，比公司政策或员工手册更能让人们了解组织的价值观和文化。故事传达着组织内部真正发生的事情。讲得好的故事会触动人们的内心并带动他们。它们模拟亲临其境的真实体验，给人们一种情感上的吸引力，让他们了解体验中真正重要的东西。通过庆祝活动强化这些故事，会加深这种联系。


  因为领导是一种关系，人们更可能加入与自己有私人联系感的人所领导的倡议。正是领导者与成员之间的这种人际联系，确保了更多的承诺和支持。丽莎代表自己和整个教务长办公室，尽一切努力确保教师知道他们的工作产生了全校公认的影响。营造一种庆祝胜利的社区精神并时常举办庆祝活动，是她整个职业生涯的特点。对于学生团体，她总是努力去


  将他们聚集起来，颁发证书或小礼品以表谢意。对于教职员工，她会安排午餐和晚餐，感谢大家付出的时间和努力。


  据丽莎所说，这些都不必是盛大的活动；“这实际上是一种聚在一起的精神。”找到一种方式说谢谢——并且是真心实意地说——是表达尊重和提升个人可信度的非常具体的方式。


  我们以“以身作则”开始了《卓越领导力的五种实践》的讨论，现在我们又回到了这里。如果你希望别人相信某件事并按照这些信念行事，你必须亲自参与并树立榜样。你必须言行一致。如果你希望人们忠于共同价值观，你自己也必须忠于这些价值观。如果你想要建立并维持一种卓越非凡的文化，你必须认可、奖励、强化并庆祝卓越的努力和成功。你必须亲自参与庆祝那些有助于塑造并维持这种文化的行为。而且，如果你希望人们在巨大的逆境面前有勇气继续前行，你必须亲自鼓励他们。


  ## 反思问题：激励人心


  领导者期望自己做到最好，也期望追随者做到最好。他们以明确的标准帮助人们专注于需要完成的事情。通过关注、给予鼓励、个性化的赞赏以及保持积极的心态，领导者激发、重燃并聚焦人们的能量和驱动力。


  你需要认可个人对愿景和价值观的贡献，并创造性地表达赞赏。共同庆祝价值观和胜利，强化了一个事实：卓越的表现是许多人共同努力的结果。通过公开地、在集体场合中庆祝人们的成就，你能够滋养并维持团队精神。讲述那些付出非凡努力并取得巨大成功的个人的故事，为他人提供了效仿的榜样。社交互动增强了人们对团体标准的承诺，并对人们的幸福感产生深远影响。通过亲自参与认可和庆祝活动，你树立了榜样，并营造了一种相互支持和社群文化的氛围。


  在培养你“激励人心”这一领导力实践的能力时，花些时间反思以下问题。在充分考虑之后，让他人知道你的想法和你愿意采取的行动。


  - 对于那些正在带来改变的人，即使其成果属于他们本职工作的一部分，你如何能更加自觉而体贴地向他们说“谢谢”？

  - 在认可个人和集体成就时，你如何更直接地将取得的成果与共同的价值观和目标联系起来？

  - 你能用哪些创造性的方式把人们聚在一起，庆祝部门的成就，并标志着所取得的进展？

  - 你如何最好地提醒人们，成就是整个团队努力的结果，而不仅仅是单个人的工作？你能制定哪些创造性的策略，确保人们感受到“我为人人，人人为我”？


  ## 领导力是每个人的事


  除了这些领导力实践，除了这些基本的行为、行动和反思，关于领导力还有一个你应该领会的基本真理：*领导力是每个人的事。* 无论在高教机构，还是在制造业、高科技、医疗保健、政府、军队和非营利组织中，都是如此。无论组织、职能、学科或跨越时间与地域，最优秀的领导者都理解这一现实。没有人能在不让他人参与创造非凡成就的情况下，发挥出自己作为领导者的最佳状态。


  在担任院长期间，约翰·塞博尔特对学院的未来有了清晰的认识。他知道，鉴于在选拔杰出教师方面的激烈竞争，学院需要大量新的外部资金来源。正如他告诉我们的：“我当时最大的梦想是学院能获得一笔可观的捐赠，从而有自由和灵活性去资助那些真正能发挥作用的个人和项目。我还梦想，因为这些捐赠，人们会‘注意到’学院及其潜力。”长期以来，学院一直被称作“一颗隐藏的宝石”。约翰反驳了这种说法，他指出：“一颗隐藏的宝石就是那样——*隐藏着*——而我们不想成为那样。”


  一个比过去和从前都显著更好的事物。他们看到了别人看不到的机会；他们在别人因概率而气馁的地方抓住了可能性。他们为了某项事业动员他人，并分享必要的资源，使他人也能成为独当一面的领导者。并非每一位领导者都发起了他们所书写和谈论的个人最佳领导力项目，但每个人都挺身而出。许多人接受了任务，然后发现自己身上未曾意识到的潜力。没有人在被挑战去发挥真正的力量之前，知道自己有多强大。招生顾问保罗·加西亚从她的个人最佳领导力经历中反思道：“我必须承认，我当时对这个角色感到不安，因为我从未把自己看作是天生的领导者。然而，接受挑战后，我意识到我可以成为一名领导者。”


  ## 领导力是可以习得的


  有一个有害的迷思一直存在，认为领导力只属于少数特殊人物。每当有人问：“领导者是天生的还是后天造就的？”这个迷思就被强化。每当人们问我们这个问题——几乎每次我们演讲、上课或举办工作坊时都会被问到——我们的回答总是面带微笑：“我们从未见过不是天生的领导者。*所有*领导者都是天生的。所有大学校长、院长、教练、教师、学者、注册主任、董事、演员、会计师、艺术家、父母——凡是你想得到的——也都是天生的。”我们天生就具备各种技能和能力。你在有生之年如何运用你所拥有的，嗯，那完全取决于你自己。


  还有另一个领导力迷思阻碍着个人和组织的成功——即领导力与职位挂钩。这种假设认为领导力是以大写的 *L* 开头的，而且当你身处高层时，你就自动成为领导者。这种观点是更大的“英雄迷思”的一部分，它抑制了人们主动把握机会，让他们一直等待有人骑着马冲进来拯救局面。¹


  认为只有少数幸运儿才能理解领导力的复杂性，这纯属神话。领导力不是一个位置，不是一种基因，也不是一套秘密代码。事实是，领导力是一套可以观察到的技能和能力，无论你是在校长办公室、书店、图书馆、教室、食堂、宿舍、人力资源部、公共安全部、信息技术部、媒体服务部还是学生发展部门，这些技能都很有用。任何技能都可以在动力和愿望的驱动下，通过练习、反馈以及良好的榜样和指导来加强、磨砺和提升。所以，所有领导者都是天生的，所有领导者也都是后天造就的。


  非常奇怪且耐人寻味的是，从来没有人问过我们：“管理可以教吗？管理者是天生的还是后天培养的？”为什么管理被视为一套技能和能力，而领导力通常被视为一套天生的性格特征？原因很简单。人们认为管理是可以教的，正因为他们这么认为，数百所商学院才得以建立，每年有数千门管理课程在教授。由于假设人们能够学习与优秀管理实践相关的态度、技能和知识，各类院校提高了管理者的素质。它们也促成了一种观念：优秀的管理技能是可以获得的。


  领导力也是如此。阻碍更多领导者发展的，并不是领导潜力的缺乏，而是一个迷思的持续存在，即领导力不能被教授，也不能被学习。这个有害的迷思对领导力发展的阻碍作用，远远大于任何个人的天赋或领导力的基本要素。而且，这个迷思与任何教育哲学的本质完全背道而驰。




  领导力*可以*被传授，但不仅仅是在教室、研讨会或像本书这样的书籍中。你不仅需要概念基础，更重要的是，你还必须有指导、实践、反馈和强化。你不能读一本关于公开演讲的书，就突然期望自己在人群面前更自在、更善于演讲。你不会接受一位只有学术知识的医生。在这方面，领导力是一种临床技能，是在实践环境中学习、发展和磨炼出来的。


  我们共同的任务是解放每个人内在的领导者。与其把领导力看作一套与生俱来的性格特征——这种自我实现的预言会使每所校园乃至整个社会注定只有少数优秀领导者——不如假设*每个人*都有可能学会领导，这样更健康也更有成效。通过假设领导力是可学习的，你就能发现真正有多少优秀的领导者。在某个地方、某个时刻，每个人内在的领导者可能会接到挺身而出的召唤——为了院系、职能、项目和学院，也为了他们的家庭、会众、邻里和社区。通过相信自己和你学习领导的能力，你就能确保当召唤来临时你已经做好准备。


  当然，你不应该误导人们相信他们可以实现不切实际的目标，但也不应该假设只有少数人能在领导力——或任何其他人类努力中——达到卓越。那些最善于激发他人最佳表现的人，是那些设定可实现“拓展性”目标并相信自己能够培养他人才能的人。


  最有效的领导者持续学习。他们把*所有*经历都视为学习经历，而不仅仅是正规课堂或研讨会的那些课程。他们总是在寻找提升自己和组织的方法。通过阅读本书、反思每章末尾的问题，并参与其他个人发展活动，你正在展现出领导的倾向。即使有些人认为他们无法学会领导，你也必须相信你能。这就是一切的起点——源于你对自己的信念。


  无论你现在对领导力了解多少，成为最好的领导者是一场持续改进的终身旅程。遵循高等教育学术传统中蕴含的科学方法，这需要假设检验。它意味着持续的实验、反思、从经验中吸取教训并将其应用于后续实验、接收新的反馈、分析结果，如此循环往复。这样做，你就成为了一名领导力研究者，为“最优秀的领导者是最善于学习者”这一论断提供证明。²


  ## 对比与矛盾


  在分析数千个案例研究、大量访谈和数百万份调查回复后，我们将“卓越领导的五种实践”确定为领导者的操作系统。我们了解到，在发挥个人最佳表现时，人们会以身作则、共启愿景、挑战现状、使众人行、激励人心。与许多学者一样，我们发现，更频繁践行这五种实践的领导者，比那些较少使用这些实践的人更有可能取得非凡成就。


  话虽如此，这里有一个警告：任何领导实践都可能变得具有破坏性。美德可能变成恶习。五种实践中的每一种，一旦走向极端，都可能使你误入歧途。发现自己的声音并树立榜样，对于建立信誉和有所作为至关重要——但如果痴迷于被视为榜样，可能导致过于关注自己的价值观和做事方式。它会使你轻视他人的观点，对反馈持封闭态度。它可能会因为害怕失去隐私或被“发现”而将你推向孤立。它还会蒙蔽你，让你更关心形式而非实质。


  领导者通过具有前瞻性并传达清晰、共同的未来愿景，从而与其他可信之人区分开来。然而，仅仅专注于一种未来愿景，可能会使你无法看到甚至想象其他可能性，也会使你无法承认当下的现实。它可能使你错过那些超出视野的令人兴奋的前景，或者让你对一个陈旧、乏味、过时的技术执着得有点太久。利用你的激励力量可能会导致他人放弃自己的意志，因为你自身的能量、热情和魅力可能如此具有吸引力，以至于他人不再独立思考。


  挑战现状对于促进创新和进步性变革至关重要。掌握主动权和承担风险是学习和持续改进所必需的；但如果走向极端，你可能会造成不必要的动荡、混乱和偏执。如果你很少放慢脚步，给人们获得信心和能力的机会，他们就会失去尝试新事物的动力。为改变而改变，与自满一样令人士气低落。


  在当今动荡的世界中，协作和团队合作对于完成非凡之事至关重要。创新依赖于高度的信任。如果人们要成就伟大的事情，就必须被赋予掌控自己生活的权力。但过度依赖协作和信任，可能源于回避冲突或不愿批判性地审视决策。这些动态可能是一种逃避责任的方式，或者在情况需要时*不*去掌管。委派权力和责任，可能会变成在他人尚未做好充分准备时，把过多东西硬塞给他们的方式。


  当人们受到挑战和鼓励时，他们的表现确实会更高。个人认可和集体庆祝能激发精神和动力，即使在最艰巨的挑战中也能推动群体前进。与此同时，持续关注谁应该被认可、何时应该举行庆祝活动，可能会让你变成一个爱交际的吟游诗人。你可能会因为太开心而忘记使命。不要过度沉迷于各种福利和快乐，而忽视了认可背后的目的。


  然而，比所有这些可能的恶习更阴险的是傲慢的背叛，它是领导力的阿喀琉斯之踵。身居王位固然好，拥有影响力令人满足，有无数人为你的每句话欢呼令人兴奋。在许多极其微妙的方式中，人们很容易被权力和重要性所诱惑。所有邪恶的领导者都感染了傲慢之病，自我意识膨胀，追求自己险恶的目的。你如何才能避免这一点？


  答案是谦逊。³ 只有认识到自己并非无所不知，还有其他人聪明、有才华、有经验、有奉献精神，你才能避免过度骄傲。⁴ 知道自己只是普通人会有所帮助——你永远不会像别人认为的那样好或那样坏。认识到任何伟大的成就都不是独自完成的——你需要他人的帮助，这也很有帮助。在教育背景下，值得注意的是领导者不断学习。倾听同事的意见。找到承认错误的诚实，以及后退、纠正和原谅自己的风度。紧握谦逊：这是我们已知的解决领导力冲突和矛盾的唯一方法。


  事实上，对从平庸（或更差）转向长期卓越的组织的研究揭示了“从优秀到卓越”公司首席执行官们中一种显著的谦逊模式：“与对照组领导者以自我为中心的风格形成鲜明对比的是，我们惊讶地发现，从优秀到卓越的领导者从不谈论自己……只要我们有兴趣，他们会谈论公司和其他高管的贡献，但会回避讨论自己的贡献。”⁵
  同样，他们令人信服的谦逊也许正是高等教育中许多最优秀的领导者不登上《高等教育纪事报》和本地或全国媒体头条，也不在流行的“领导者即英雄”文化中获得摇滚明星地位的原因。相反，这些领导者将注意力和意志集中在他们的机构和他人的身上。


  这与我们自己的发现一致。我们遇到并采访过的高等教育领导者，关心机构胜过关心自己的成功。正如我们讨论过的，卓越的领导者知道他们不能单打独斗，并且据此行事。他们没有许多可能短期成功但离开后留下一个无法蓬勃发展的薄弱组织的人所表现出的骄傲和矫饰。相反，凭借自谦的幽默⁶
  和慷慨真诚地归功于他人，他们达到了越来越高的成就水平；他们成就了非凡之事。


  还有另一种方法可以避免导致变得专横和自以为是的权力诱惑。拒绝变得片面，只狭隘地关注你的工作和组织。不要让工作消耗你。投身于你周围的世界。最优秀的领导者还有



  众多追求和兴趣——艺术、文学、科学、技术、娱乐、体育、政治、法律、宗教、朋友和家庭。


  还有一堂宝贵的课可以帮助你应对领导力中的对比和矛盾。我们的研究中没有任何迹象表明领导者应该完美无缺。领导者不是圣人。他们是充满缺陷和不足的人，就像其他人一样。他们会犯错。我们建议所有有志成为领导者的人都采取新手的态度——始终保持开放和充满惊奇。正如我们所说，最好的领导者继续是最好的学习者。


  ## KEEP HOPE ALIVE


  人们愿意追随那些表现出对他人能力充满热情和真诚信念的领导者，他们增强人们的意志，提供实现目标的手段，并表达对未来的乐观。人们希望领导者在障碍和挫折面前依然保持热情并保持一点幽默（尤其是不要太过自视甚高）。每一所大学——以及高等教育事业——都迫切需要具有积极、自信、能做到的领导者。


  作为一名领导者达到个人最佳状态从来都不是容易或直接的经历。我们谈话的每个人都承认他们所承受的艰苦工作、失望、挫折、错误、疑虑和牺牲。他们在审阅和更新课程、修订教职员工手册、建立新的服务学习项目，或从宿舍概念转向住宿学习社区时遇到了这些问题。当建设一座新的21世纪图书馆、整体整合学生事务项目与学术事务项目时，它们也很明显，要求校园范围内有一个共同平台来应对当今的困难并展望明天的潜力。希望使人们即使在承受压力、被拉伸和沮丧之后也能反弹。希望使人们找到意志和方式去追求伟大。⁷


  然而希望并不是你必须保持活力的最后事物。我们还有一课要分享。


  ## THE SECRET TO SUCCESS IN LIFE


  在我们研究领导力典范的早期，我们很幸运地与美国陆军少将约翰·H·斯坦福德相遇。在他的服役期间，约翰在越南执行过军事任务，获得过高度嘉奖，领导过陆军军事交通管理司令部（并处理了沙漠风暴行动的后勤），并赢得了部队的坚定忠诚。军事生涯结束后，他成为佐治亚州富尔顿县（包括亚特兰大）的首席行政官，该县正为举办1996年夏季奥运会做准备。随后他被招募担任华盛顿州西雅图学区学监，在那里他引发了公立教育革命。


  约翰是一位文艺复兴式的人物，他在地方、国家和国际层面服务。他的杰出职业生涯超越并连接了武装部队、公共行政和教育。他对我们采访问题之一的回答极大地影响了我们对领导力的最深层次理解，并体现了他如何生活。


  我们问约翰，他将如何培养领导者，无论是在大学还是大学，在军队、政府、非营利部门或私营企业。他是这样告诉我们的：


  当任何人问我这个问题时，我告诉他们我知道成功的秘诀。成功的秘诀是保持相爱。保持相爱给你点燃他人的火花、看透他人、比他人更有欲望去完成事情的动力。一个不相爱的人真的不会感受到那种帮助他们取得进步、领导他人并取得成就的兴奋。我不知道生活中还有什么火花、什么事物比爱更令人振奋、更积极的感觉。


  “保持相爱”并不是我们预期的答案——至少不是当我们*开始*研究领导力时。但在近40年的领导、研究领导力以及培养领导者的经历后，我们仍然惊讶于有多少人在谈论自己领导的动机以及解释他们为何忍受艰辛、做出个人牺牲并取得成就时，会自由地使用*爱*这个词。


  在所有能让领导者长期坚持的事物中，爱是最持久的。很难想象任何大学校园里的领导者能日复一日地起床、投入长时间的艰苦工作来产生影响，而没有将心投入其中。这可能是成功领导者的最好保密秘密：*如果你爱你所做的事情，你就永远不必工作。*


  所以，继续爱上领导。继续爱上做工作的同事。继续爱上因在你的机构度过时光而发生转变的学生、教师、员工和校友。继续爱上通过你和许多人的贡献而产生并因其而存在的学术、思想、项目和应用。


  领导力*不是*头脑的事。领导力毕竟是心灵的事。


  ## TAKE THE NEXT STEP


  在每一章的结尾，我们请你反思几个问题。现在在这本书的结尾，我们有一个最后的问题给你：*你现在实际上打算做什么来成为更好的领导者？*


  从本书中领导者的例子以及数十年的研究和经验来看，我们知道每个人都可以领导。但不要误会。领导力从来都不容易。阅读关于领导力的内容很容易。参加领导力培训项目很容易。真正应用你所学到的东西*不容易*。当我们教授领导力研讨会时，我们会以询问参与者是否听到任何过于复杂、过于深奥难以理解或过于难以把握的内容来结束。答案总是没有。领导力的挑战不在于了解概念；而在于将其付诸实践。然后我们问：*你现在实际上打算做什么来成为更好的领导者？*


  我们相信你知道自己可以做什么来比现在成为更好的领导者，但*去做*就是另一回事。要真正改变和改进，你首先必须深深地爱上成为典范领导者的想法。然后并且只有然后你才会有克服犹豫和根深蒂固习惯所需的力量和韧性。痛苦和不适在领导之旅中不可避免，但如果你坚持下去，喜悦和成就的激情也是如此。


  在这本书中，我们给了你数十种方法来在五项实践中提升你的领导力技能。*你打算做什么？*我们希望当你环顾四周说“有些事情需要改变”或“有些事情可以改进或可以比现在更好”时，你也会照镜子并看到你就是那个可以带来改变的人。


  有一个关于12只青蛙的流行谜语是这样的：如果12只青蛙坐在池塘边的一根木头上，其中5只决定跳进池塘，那么木头上还剩下多少只青蛙？你的答案是什么？七只？零只？十二只？五只？


  正确答案是12。木头上仍然有12只青蛙。为什么？原因在于*决定*做某事和实际上*去做*之间存在巨大差异。现在你已经读完这本书，请牢记这个谜语的紧迫性。


  你已经读到领导力如何产生影响，并且了解了卓越领导力的五项实践操作系统。你被提供了许多关于高等教育中那些让人发生非凡事情的人的行为的例子和说明。你被提供了许多反思的问题和议题，并被提供了许多你可以立即采取的领导行动建议。


  决定做一些不同的事情来让你成为更好的领导者。然后跳下木头，跳进水中！





  '
- '## 附录：本书的研究基础


  虽然 *高等教育中的领导力* 是作为提升和支持各级高等教育领导者能力的实用指南而撰写，但所述原则与实践均扎实地植根于研究。


  我们对领导力的研究工作源于一个始于1983年的研究项目。我们想了解领导者们在以“个人最佳”状态领导他人时做了什么。这些经历是指人们在自己感知中设定了个人卓越领导标准的时刻。我们最初假设，要发现最佳实践，并不需要去访谈和调查优秀公司中的明星员工。相反，我们假设，通过询问不同层级、来自各种组织环境的人们描述非凡经历，我们就能找到并识别成功的模式。


  最初的“个人最佳领导经历”调查包含38个开放式问题；以下为其中一部分：


  - *谁发起了这个项目？*

  - *你为这次经历做了哪些准备？*

  - *你使用了什么特殊技巧和策略让其他人参与这个项目？*


  你会如何描述这次经历的特点或感受？


  你从这次经历中学到了什么关于领导力的经验？


  该调查通常需要一到两个小时完成，在研究的初始阶段，我们收集了550多份这样的深度调查。另有780名经理填写了一份简短的两页表格。


  除了书面案例研究，我们还进行了42次深度访谈，访谈对象主要是来自世界各地各类公私企业中处于中高层管理职位的人员。访谈通常持续45至60分钟。自最初的研究以来，我们持续累积的研究档案现已包含5000多个个人最佳案例（以及使用简短表格获得的10000多个案例），并且我们在全球范围内访谈了500多人，涵盖了各类组织中各个层级和职能的人。


  *领导力实践清单*（LPI）的创建既是为了验证我们定性研究的发现，也是为了提供一种评估手段，帮助人们发展自己的领导能力。LPI的项目源于对个人最佳领导经历中表现出的行为进行具体的一句话描述。通过长久的讨论、与受访者和领域专家的反复反馈，以及对基于行为的陈述进行实证分析，这些陈述被选中、修改或删除。


  LPI包含30条陈述，对应于“卓越领导的五种实践”每一种实践下的六项关键行为。参与者填写LPI-自我版，并请五到十位熟悉其行为的人填写LPI-观察者版。LPI-观察者版是自愿的，受访者需标明他们与领导者的关系（上级、同事/同级、直接下属或其他）。除经理外，观察者的身份是匿名的。完成LPI大约需要10分钟。每条行为陈述使用10点李克特量表，数值越高表示该领导行为出现得越频繁。量表的锚点分别为：(1)
  *几乎从不*做出陈述中所描述的行为，(2) *很少*，(3) *难得*，(4) *偶尔*，(5) *间或*，(6) *有时*，(7) *较为经常*，(8) *通常*，(9)
  *非常频繁*，(10) *几乎总是*做出陈述中所描述的行为。五种领导实践的得分范围从6到60；整个LPI（综合所有五种实践）的得分范围从30到300。


  五种实践框架和LPI已经使用了35年以上，既应用于实际的领导力发展项目，也应用于数百个研究项目。来自200多个国家的超过370万人完成了LPI 360在线评估；其中超过57.5万人是领导者，其余是观察者，包括领导者的上级、同事/同级和直接下属。使用这种在线形式能够接触到一个庞大的国际样本，这些参与者是真正感兴趣且投入的，他们展现的是自然行为，而非在研究情境中的表现。LPI是一种成熟的领导力概念化方式，已被证明适用于不同环境和不同文化。


  我们和其他研究人员多年来进行的研究一致证实了LPI和“卓越领导的五种实践”模型的信度和效度。从研究角度看，信度关乎一致性或“可重复性”。这意味着，假设被测量的事物没有改变，测量工具（评估、调查、问卷）会一次又一次地给出相同的结果。


  （请记住，信度是跨个体测量的一种特性，并不代表个体自身的信度（一致性）。）


  由于随机误差（通常称为“噪音”）会导致分数因与受访者无关的原因而不同，分数很少（如果有的话）能百分之百可靠（即完全相同）。测量工具包含的误差越少，其信度越高。工具信度高于0.60被视为良好，高于0.80则非常强。LPI的内部信度（以Cronbach
  alpha系数衡量）始终很强，通常高于0.81。


  检验任何测量工具的信度时，另一个考虑因素是它可能因个体或组织差异而发生怎样的变化。如果不存在系统性变异，则表明该工具相当稳健，可以安全（可靠）地应用于各种样本总体特征。总的来说，LPI分数已被发现独立于各种人口统计学特征（如年龄、婚姻状况、经验年限、教育水平、族裔）和组织特征（如规模、职能领域、服务年限、直线职位与参谋职位、行业）。


  信度是对框架或测量工具的一阶检验，它是必要的，但不足以让人确信该工具确实测量了它声称要测量的东西，也不足以确定其分数（结果）对受访者是否有意义或效用。从实践角度看，这是对“那又怎样？”问题的回答，即：我的分数在某种实质性结果上有什么不同？这被称为效度。


  与信度一样，效度也通过多种方式确定。最常见的效度评估称为表面效度，它考察的是，在主观评价的基础上，主管人员、传统黑人大学中领导实践的群体差异等等。此外，研究人员还研究了各种高等教育环境和情境中的领导力；例如，公立和私立学校、宗教与非宗教校园、两年制和四年制学院、校内与在线项目，以及美国境内外的院校。


  本书具体引用了最直接适用于高等教育的研究。这些数据和分析取自Kouzes Posner规范LPI数据库的一个子集，样本包括超过12.5万名 *高等教育* 人士，他们完成了LPI，并提供了关于自身及其对组织和领导者感受的信息。每一章都包含领导力对人们的影响的数据，并且表明在高等教育中，最有效的领导者总是那些最频繁使用“五种实践”的人。


  除了定量数据之外，我们还收集了来自100多位在高等教育中担任不同角色的人士的“个人最佳领导经历”案例，这些角色包括校长办公室、校园安全、图书馆、体育、学生活动、宿舍、公共安全、校友关系、健康中心以及其他校园组织和职能部门。他们的故事和案例研究使数据变得鲜活起来。它们更具体地向你展示了卓越领导实践和行为是什么样子，以及它们所产生的积极影响。它们还说明，领导力并不是机构中少数精选领导者才拥有的东西。它们证明了领导力是一套校园里每个人都可以获得的技能和能力。


  我们从研究中得知，你越频繁地运用“五种实践”，就越能有效地激发你的团队、部门和机构的最佳状态。机会就在那里。证据就在那里。






  正如我们在第7章结尾所说的，剩下的就是：“决定去做一些不同的事情，让你成为更好的领导者。然后跳下圆木，进入水中！”



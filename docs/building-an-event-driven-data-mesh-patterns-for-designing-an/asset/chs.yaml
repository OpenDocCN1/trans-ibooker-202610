  \ layer provides the REST API for operational use cases, such as requesting the\
  \ assembly of a new automobile and modifications to existing inventory.\n\n图 3-1\
  \ 展示了从图 2-1 扩展的汽车领域限定上下文。内部实现使用关系数据库，表格代表组成汽车所需的组件/实体。防腐层为操作用例提供 REST API，例如请求组装新汽车和对现有库存进行修改。\n\
  \nAdditionally, the domain publishes two data products to event streams—one based\
  \ on items and the other based on orders. Specialized business logic extracts and\
  \ isolates the internal model from the data published to the event stream. Whatever\
  \ you choose to expose via your anti-corruption layer becomes part of the public\
  \ API, so be careful about what you add and how you add it.\n\n此外，该领域向事件流发布两个数据产品——一个基于项目，另一个基于订单。专业化的业务逻辑从发布到事件流的数据中提取并隔离内部模型。您通过防腐层选择暴露的任何内容都将成为公共\
  \ API 的一部分，因此要小心添加什么以及如何添加。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_61_0.png)\n\
  \nFigure 3-1. An ecommerce domain including an event-stream API for data products\
  \ and a REST API for operational concerns\n\n图 3-1. 包含用于数据产品的事件流 API 和用于操作问题的 REST\
  \ API 的电子商务领域\n\nNote that the internal implementation need not be event-driven\
  \ to extract or use event-driven data products. Chapter 8 covers integrating nonevent-driven\
  \ systems with event-driven ones and the options you have for bridging the gap.\
  \ You may also note that we’re incorporating traditional request-response options\

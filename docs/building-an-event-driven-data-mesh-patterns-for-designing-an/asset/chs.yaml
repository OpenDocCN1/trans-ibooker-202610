  \ 8 章介绍了将非事件驱动系统与事件驱动系统集成以及弥合差距的可用选项。您还可能注意到，我们将传统的请求-响应选项与事件流结合使用。这是非事件驱动但需要为外部消费者提供格式良好的数据产品的记录系统的非常常见模式。我们只是维护现有\
  \ API，并根据消费者需求和现有数据要求添加事件驱动型数据产品。\n\nFigure 3-2 shows an abstracted implementation\
  \ of an event-driven automotive domain, complete with domain events specific to\
  \ the internal operational of the system.\n\n图 3-2 展示了事件驱动型汽车领域的抽象化实现，包含特定于系统内部操作的领域事件。\n\
  \nYou may choose to expose certain domain events to the outside world, but you must\
  \ be careful about which ones you select to expose. We’ll cover event design and\
  \ selecting which events to expose (and which to conceal) more in Chapter 7. At\
  \ this stage, just be aware that you don't need an event-driven system to produce\
  \ event streams and that not all event types are suitable for production as a data\
  \ product.\n\n您可以选择向外部暴露某些领域事件，但必须小心选择暴露哪些事件。我们将在第 7 章中更详细地介绍事件设计以及选择暴露哪些事件（以及哪些事件隐藏）。此时，只需意识到您不需要事件驱动系统来生成事件流，并且并非所有事件类型都适合作为数据产品进行生产。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_62_0.png)\n\nFigure 3-2. Data products\
  \ are purpose-built for external usage and are meant to be coupled on. Domain events\
  \ may not be suitable for data product purposes\n\n图 3-2. 数据产品是为外部使用专门构建的，旨在被耦合。领域事件可能不适合用于数据产品目的\n\
  \nFor now, let’s now take a closer look at events, records, and messages, as well\
  \ as the relationship between an event stream and an event broker.\n\n现在，让我们更深入地了解事件、记录和消息，以及事件流与事件代理之间的关系。\n\
  \n### Events, Messages, and Records\n\n### 事件、消息和记录\n\nAn event is an occurrence\
  \ in an application recorded into a record (the container holding the event data)\
  \ and published to an event stream hosted by an event broker.\n\n事件是应用程序中发生的情况，记录到记录（保存事件数据的容器）中，并发布到由事件代理托管的事件流中。\n\
  \nI generally avoid using the term message when discussing event streams and event-driven\
  \ architectures because it’s a term that has adopted different meanings to different\
  \ people over time. In common parlance, we send a message to a person or to a specific\
  \ private group—an intended recipient and not a posting (like a message board) for\
  \ public general-purpose use. In contrast, data products are meant to be broadcast\
  \ and shared widely, with the intention of letting others subscribe to and use them\
  \ however they choose (much like a public post on channel-based social media). For\
  \ clarity's sake, I’ll use event or record instead of message for the remaining\
  \ chapters of this book.\n\n在讨论事件流和事件驱动架构时，我通常避免使用“消息”这个术语，因为它随着时间的推移被不同的人赋予了不同的含义。在日常用语中，我们向某个人或特定的私人群组发送消息——即预期的接收者，而不是像留言板那样面向公众的通用用途发布。相比之下，数据产品旨在广播和广泛共享，目的是让其他人根据自己的选择订阅和使用它们（很像基于频道的社交媒体上的公开帖子）。为了清晰起见，我在本书剩余章节中将使用事件或记录而不是消息。\n\
  \nEach logical record is made up of three components:\n\n每个逻辑记录由三个组件组成：\n\n####\
  \ The key\n\n#### 键\n\nThe key is optional, but extremely useful. It contains a\
  \ unique ID associated with the contents of the event, just like the primary key\
  \ of a relational table. Data is almost always partitioned according to the key,\
  \ such that all data of the same key goes to the same partition and consumer instance,\
  \ allowing for vast amounts of data to be processed in parallel.\n\n键是可选的，但非常有用。它包含与事件内容关联的唯一\
  \ ID，就像关系表的主键一样。数据几乎总是根据键进行分区，这样相同键的所有数据都会进入相同的分区和消费者实例，从而允许大量数据并行处理。\n\n#### The\
  \ value\n\n#### 值\n\nContains the bulk of the data relating to the event. If the\
  \ key can be thought of as the primary key of a row in a database table, then the\
  \ value can be thought of as all of its column values. Every property and field\
  \ recorded during the creation of the event should go in the value component. Values\
  \ should always have a well-defined schema, whereas a key can contain a schema or\
  \ a primitive.\n\n包含与事件相关的大部分数据。如果可以将键视为数据库表中某行的主键，那么值可以被视为该行的所有列值。事件创建期间记录的每个属性和字段都应放入值组件中。值应始终具有定义良好的架构，而键可以包含架构或原始类型。\n\
  \n#### The header (also known as “record properties”)\n\n#### 标题（也称为“记录属性”）\n\n\
  Contains metadata about the event itself, such as timestamps, tracking IDs, and\
  \ other custom user-defined fields. Both the presence of a header and its format\
  \ depend on what technologies you’re using to create and communicate events. Headers\
  \ are commonly composed of a simple key-value map appended to the key-value pair.\n\
  \n包含关于事件本身的元数据，例如时间戳、跟踪 ID 和其他自定义用户定义的字段。标题是否存在及其格式取决于您用于创建和通信事件的技术。标题通常由附加到键值对的简单键值映射组成。\n\
  \nFigure 3-3 shows the structure of an event recording a sale of six items (in an\
  \ array) purchased by user-id-6384291. The header contains both the timestamp that\
  \ shows when the event was created as well as a custom_tracking_id specified by\
  \ the event producer.\n\n图 3-3 显示了记录用户 user-id-6384291 购买六个项目（数组中的）销售事件的结构。标题既包含显示事件创建时间的时间戳，也包含由事件生产者指定的\
  \ custom_tracking_id。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_63_0.png)\n\n\
  Figure 3-3. A sales event showing the purchase of six items\n\n图 3-3. 显示购买六个项目的销售事件\n\
  \nOne final thing to note: events are immutable. You can never modify an event once\
  \ it is published to the event stream. Instead, you create and publish a new event\
  \ containing the necessary correction or update. Immutability is essential for ensuring\
  \ that every consumer has access to precisely the same data set and can reproduce\
  \ the same results of a computation at a later point in time.\n\n最后需要注意的是：事件是不可变的。一旦事件发布到事件流，您就永远无法修改它。相反，您创建并发布包含必要更正或更新的新事件。不可变性对于确保每个消费者都能访问完全相同的数据集，并且可以在稍后时间点重现相同计算的结果至关重要。\n\
  \n### What’s an Event Stream? What Is It Not?\n\n### 什么是事件流？什么不是？\n\n> The business\
  \ facts are best presented as business Domain Events, can be stored and served as\
  \ distributed logs of time-stamped events for any authorized consumer to access.\n\
  > \n> —Zhamak Dehghani\n\n> 业务事实最好以业务领域事件的形式呈现，可以存储并作为时间戳事件的分布式日志提供，供任何授权消费者访问。\n\
  > \n> ——Zhamak Dehghani\n\nEvent streams are hosted on an event broker, with perhaps\
  \ the most common option being Apache Kafka (a personal favorite of your author).\
  \ The event broker, such as in the case of Kafka, provides a structure known as\
  \ a topic that we can write our events to. It also handles everything from data\
  \ replication and rebalancing to client connections and access controls. Publishers\
  \ write events to the event stream hosted in the broker, while consumers subscribe\
  \ to event streams and receive the events.\n\n事件流托管在事件代理上，最常见的选项或许是 Apache Kafka（作者个人最爱）。事件代理（如\
  \ Kafka 的情况）提供一种称为主题的结构，我们可以将事件写入其中。它还处理从数据复制和再平衡到客户端连接和访问控制的一切。发布者将事件写入代理中托管的事件流，而消费者订阅事件流并接收事件。\n\
  \nIn its most basic form, an event stream is a time-stamped sequence of business\
  \ facts pertaining to a domain. Events form the basis for communicating important\
  \ business data between domains in a reliable and repeatable way, leading us to\
  \ the following requirements:\n\n在最基本的形式中，事件流是关于某个领域的带时间戳的业务事实序列。事件构成了以可靠且可重复的方式在领域之间传达重要业务数据的基础，这引出了以下要求：\n\
  \n- **Immutable**\n  Events cannot be modified once written to the log. Only new\
  \ events may be added.\n\n- **不可变**\n  事件一旦写入日志就无法修改。只能添加新事件。\n\n- **Durable and\
  \ replayable**\n  Events are durable, such that they can be consumed immediately\
  \ or in the future.\n  Events can be replayed by new and existing consumers alike,\
  \ provided the event broker has sufficient storage to host the historical data.\n\
  \n- **持久且可重放**\n  事件是持久的，因此可以立即消费或在未来消费。\n  新旧消费者均可重放事件，前提是事件代理具有足够的存储空间来托管历史数据。\n\
  \n- **Scalability and indefinite storage**\n  The event broker provides high availability,\
  \ scalability, and indefinite retention, allowing the event stream to become the\
  \ single source of truth for specific domain data.\n\n- **可扩展性和无限存储**\n  事件代理提供高可用性、可扩展性和无限保留，使事件流能够成为特定领域数据的单一真实来源。\n\
  \nEvent streams rely on the durable append-only log, an immutable data structure\
  \ that only permits appending of new data. Once written, data cannot be altered.\
  \ The log is durable, such that consumers can consume the data as many times as\
  \ they need. Events are not deleted once they are read, nor are they simply discarded\
  \ in the case of an absence of consumers.\n\n事件流依赖于持久的仅追加日志，这是一种仅允许追加新数据的不可变数据结构。一旦写入，数据就无法更改。日志是持久的，因此消费者可以按需多次消费数据。事件在读取后不会被删除，也不会在没有消费者的情况下被简单丢弃。\n\
  \n\n\n\n\nFigure 3-4 展示了一个带有两个分区的持久追加式日志。新数据会追加到两个分区中的某一个的末尾。每个独立的逻辑消费者由一个 _消费者组_\
  \ 表示，并负责消费事件并递增其组所属的偏移量指针。在拥有足够处理能力的情况下，逻辑消费者可以实时跟上数据流，而从较早偏移量开始的新消费者则需要处理所有事件才能赶上当前时间。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_65_0.png)\n\n_图 3-4. 带有两个分区和两个独立消费者组的持久追加式日志_\n\
  \n不幸的是，由于悠久且常常混乱的历史，事件代理常常被与 _瞬态消息传递_ 和 _队列_ 混淆。这三种选项各不相同，无论是瞬态消息传递还是队列，都不适合用于构建事件驱动的数据网格。让我们快速看看原因。\n\
  \n## 瞬态消息传递\n\n_通道_ 是用于在一个生产者和一个或多个订阅者之间传递消息的瞬态基底。消息不会存储任何显著的时间长度，也不会由代理写入持久存储。在系统故障或通道上缺少订阅者的情况下，消息会被简单地丢弃，提供至多一次交付。NATS.io\
  \ 是这种实现形式的示例。\n\n图 3-5 展示了一个单一生产者向事件代理中的瞬态通道发送消息。瞬态消息随后会传递给当前订阅的消费者。在此图中，Consumer\
  \ `0` 获得消息 7 和 8，但 Consumer `1` 无法获得，因为它是新订阅的且无法访问历史数据。相反，Consumer `1` 只会收到消息 9\
  \ 及任何后续消息。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_66_0.png)\n\n图 3-5. 转发消息的瞬态消息传递代理\n\
  \n瞬态通信非常适合简单性、低开销（无磁盘！）和易用性。它便于构建消息传递架构，尽管缺乏可靠性保证可能会限制其有用性。根据您的部署情况，它可能高可用，也可能不是高可用。\n\
  \n消息传递架构便于系统之间的点对点通信，这些系统不一定需要至少一次交付且可以容忍一定的数据丢失。例如，在线约会应用 Tinder 使用 NATS 来通知用户更新。如果消息未收到，也不是什么大事——错过给用户的推送通知对用户体验只有轻微（尽管是负面的）影响。\n\
  \n瞬态消息传递代理缺乏构建事件驱动数据产品所需的事件无限期保留、持久性和可重放性。消息传递架构对于当前操作目的的系统间事件驱动通信很有用，但完全不适合用于提供传递数据产品的手段。\n\
  \n## 排队\n\n队列是等待处理的存储事件或消息的持久序列。更常见的用例之一是工作队列，生产者会发布“待办工作”事件。订阅者出队一个事件，对其进行处理，并向队列代理发出工作完成的信号，随后代理删除该事件。图\
  \ 3-6 展示了两个订阅者从队列中消费事件。请注意，队列主要包含当前正在处理和尚未处理的事件。已经处理过的事件在被消费并由消费者标记为已处理后会被删除。\n\n\
  队列中不一定能保证处理顺序。虽然您可以通过每个分区（或队列）只允许一个消费者实例来强制执行处理顺序，但这可能会显著限制吞吐量。有多个订阅者按先到先得的方式异步（且竞争性地）选择、处理和确认事件，这相当常见。此外，延迟和网络分区可能导致竞争订阅者多次处理同一事件。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_67_0.png)\n\n图 3-6. 两个订阅者各处理事件子集的队列\n\
  \n历史上，队列代理要求队列中存储的事件具有最大保留时间。如果事件在一定时间内未被处理，它们会被标记为死信，不再发送给订阅者，随后被删除。类似于瞬态通信，基于时间的保留和不可重放的数据影响了（错误的）观点，即代理不能用于无限期保留数据。\n\
  \n事件驱动的数据产品需要可重放性，且 _每个_ 消费者必须获得 _所有_ 事件，顺序必须与发布时 _完全相同_。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_67_1.png)\n\
  \n现代队列代理倾向于通过采用持久追加式日志来同时支持可重放性和事件无限期保留，我们将在下一节中更详细地介绍这一点。例如，Solace 和 RabbitMQ Streams\
  \ 都允许单个消费者重放队列事件。然而，这些系统在支持现代数据网格所需的严格顺序语义、无限期重放性和可扩展性要求方面存在困难。\n\n队列最好在单个应用程序级别使用，作为\
  \ _缓冲区_，用于输入事件或进程间通信。它们对于确保每个事件只由一个消费者处理非常有用，但不适合作为传递完整数据集以构成事件驱动数据产品的通道。\n\n在下一节中，我们将了解消费者如何使用事件流提供的事件。\n\
  \n事件流支持事件驱动的业务逻辑。在消费事件后，消费者应用程序可以更新其状态、执行逻辑、联系其他系统并生成其自身事件，仅举几例。订阅多个事件流的消费者会执行特定于该流的业务逻辑，将数据集成到其应用空间中。\n\
  \n状态事件是构成大多数事件驱动数据产品的关键组件。让我们更仔细地看看这些。\n\n## 状态事件和事件携带状态传递\n\n状态事件包含事件创建时特定业务实体的整个公共状态。可以将状态事件视为数据库表中的一行——它包含与该实体相关的所有数据，即您作为数据产品所有者希望向外部公开的数据。它不包含源域私有的任何状态。\n\
  \n对行的任何更改都会简单地导致一个新事件，其中包含现在已更新数据的完整副本（包括未更改的内容），并追加到不可变事件流中。这种模型非常强大，并通过一种称为事件携带状态传递（ECST）的模式，构成了事件驱动数据网格的基础。\n\
  \n正如其名称所暗示的，事件携带关于实体的状态，并允许将异步的最终一致状态传输给数据的消费者。每个消费者都可以通过一种称为物料化（参见下一节）的过程来重新创建状态，其中状态的只读模型可以被任何需要它的消费者重新创建和处理。\n\
  \n您的事件定义可以随时间变化和演进，我们将在第 6 章中更详细地讨论这一点。在向事件添加新字段时，数据产品所有者需要决定是重新发布包含新字段的更新状态事件，还是仅将其包含在未来的新事件中。在关系型数据库表中，这类似于添加一个新列，然后运行迁移作业以将该列填充到表中的每一行。\n\
  \n第 7 章更详细地介绍了状态事件和动作事件两种类型，包括每种类型的变体、权衡以及每种类型最适合使用的场景。与此同时，让我们先继续使用状态模型，因为它构成了大多数事件驱动数据网格通信的基础。\n\
  \n\n\n\n\n## Materializing Events\n\nMaterialization is the process of consuming\
  \ an event and merging it into your own local data store. If a record with the same\
  \ primary key already exists in that store, it is usually simply overwritten, though\
  \ you may choose to implement more complex merging logic if you choose.\n\n物质化是消费事件并将其合并到本地数据存储中的过程。如果该存储中已存在具有相同主键的记录，通常会简单地覆盖它，尽管你可以选择实现更复杂的合并逻辑。\n\
  \nIn practice, consumers don't usually need to store the entire event contents,\
  \ but only the subset of data relevant to its domain. This substantially reduces\
  \ the amount of data stored and processed, and helps keep the footprint of the consumer\
  \ service small.\n\n在实践中，消费者通常不需要存储整个事件内容，而只需存储与其领域相关的数据子集。这大大减少了存储和处理的数据量，并有助于保持消费者服务的足迹较小。\n\
  \nFigure 3-7 shows a consumer materializing the item event stream into its own state\
  \ store. The consumer has decided to keep only the most recent record and to discard\
  \ the older values for a given item. In this example, item key = 123 has been updated\
  \ by the change of type from hat to helmet, as represented by the event at offset\
  \ 2. Upon consumption, the consumer commonly evicts the previous materialized value\
  \ for that key (offset 0) by overwriting the data in the database with the newest\
  \ values. In some cases, you may want to keep a list of previous entries for a given\
  \ key, a subject we'll cover more in “Slowly Changing Dimensions” on page 193.\n\
  \n图 3-7 展示了一个消费者将物品事件流物质化到其自身状态存储中的过程。该消费者决定仅保留最新记录，并丢弃给定物品的较旧值。在此示例中，物品键 = 123\
  \ 已通过将类型从帽子更改为头盔来更新，如偏移量 2 处的事件所示。消费时，消费者通常会通过用最新值覆盖数据库中的数据来驱逐该键（偏移量 0）的先前物质化值。在某些情况下，你可能希望为给定键保留先前条目的列表，我们将在第\
  \ 193 页的“慢速变化维度”中更多地讨论此主题。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_69_0.png)\n\
  \nFigure 3-7. A consumer materializing the item event stream into its local database\n\
  \n图 3-7. 消费者将物品事件流物质化到其本地数据库中\n\nThanks to materialization, consumers can also execute\
  \ logic based on changes from one event to another, since they retain the “current”\
  \ state in memory and obtain the “new” state from the event stream. They can infer\
  \ changes to any field within the event, which provides them with exceptional flexibility\
  \ in how they use and process the event data.\n\n归功于物质化，消费者还可以根据一个事件到另一个事件的变化执行逻辑，因为它们在内存中保留了“当前”状态，并从事件流中获取“新”状态。它们可以推断事件中任何字段的变化，这为它们使用和处理事件数据的方式提供了卓越的灵活性。\n\
  \nUp next: materialization's fancier and often more complex cousin, aggregation.\n\
  \n接下来：物质化更花哨且通常更复杂的表亲，聚合。\n\n## Aggregating Events\n\nAn _aggregation_ is an entity\
  \ composed by merging multiple state events together. An aggregation could be as\
  \ simple as a running sum but could also entail using multiple event types to build\
  \ a more complex result. Figure 3-8 shows two instances of a single consumer application\
  \ processing two partitions from a single event stream.\n\n一个 _聚合_ 是由合并多个状态事件而组成的实体。聚合可能像运行总和一样简单，也可能涉及使用多种事件类型来构建更复杂的结果。图\
  \ 3-8 展示了单个消费者应用程序处理来自单个事件流的两个分区的两个实例。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_70_0.png)\n\
  \n_Figure 3-8. Aggregating state local to each consumer instance. The key is represented\
  \ by the shape of the event._\n\n_图 3-8. 聚合每个消费者实例本地的状态。键由事件的形状表示。_\n\nConsumer\
  \ instance 0 has processed all of the events in its assigned partition 0 and is\
  \ awaiting new incoming events. The database within its boundary shows the current\
  \ SUM aggregations that it has computed. Meanwhile, Consumer instance 1 is still\
  \ processing historical data from its assigned partition 1 and is catching up to\
  \ the current head event.\n\n消费者实例 0 已处理其分配的分区 0 中的所有事件，并正在等待新的传入事件。其边界内的数据库显示了它计算的当前\
  \ SUM 聚合。与此同时，消费者实例 1 仍在处理其分配的分区 1 中的历史数据，并正在赶上当前头事件。\n\nOne of the major advantages\
  \ of event-driven data products is that they make it very easy for you, as a consumer,\
  \ to build your own aggregates. Instead of relying on the data product owner to\
  \ build your aggregates for you, you can simply ingest the data into your own domain\
  \ and aggregate it according to your own needs. If your derived data product is\
  \ “just” an aggregation, you could consider republishing it to the data mesh as\
  \ an aggregate-aligned data product (recall “The Three Data Product Alignment Types”\
  \ on page 33). Alternatively, you may choose to make a consumer-aligned data product\
  \ if you end up building an aggregation with more complex business logic that joins\
  \ and mixes multiple input streams.\n\n事件驱动数据产品的主要优势之一是，它们使你作为消费者能够非常轻松地构建自己的聚合。不依赖数据产品所有者为你构建聚合，你可以简单地将数据摄取到自己的领域，并根据自己的需求进行聚合。如果你的派生数据产品“只是”一个聚合，你可以考虑将其重新发布到数据网格中作为聚合对齐的数据产品（回顾第\
  \ 33 页的“三种数据产品对齐类型”）。或者，如果你最终构建了一个具有更复杂业务逻辑且连接和混合多个输入流的聚合，你可以选择制作消费者对齐的数据产品。\n\n\
  While this strategy does require extra work on your part, it also provides you with\
  \ substantial _operational freedom_: you can simply change your computation and\
  \ replay the event stream to rebuild the results instead of relying on the upstream\
  \ data product owner to redefine and re-create the aggregate for you.\n\n虽然此策略确实需要你额外的工作，但它也为你提供了大量的\
  \ _操作自由_：你可以简单地更改计算并重放事件流以重建结果，而不依赖上游数据产品所有者为你重新定义和重新创建聚合。\n\nHowever, building\
  \ your own aggregates brings the risk that a peer in another domain may be computing\
  \ the same aggregate, with logic that doesn’t match yours. As your data mesh evolves,\
  \ expect to see aggregations in consumer domains moved upstream to become formal\
  \ aggregate data products, reducing the risk of similar-yet-different and duplicate\
  \ aggregates.\n\n但是，构建自己的聚合会带来风险：另一个领域中的同行可能正在计算相同的聚合，但其逻辑与你的不匹配。随着你的数据网格不断发展，预计会看到消费者领域中的聚合被上移，成为正式的聚合数据产品，从而降低相似但不同以及重复聚合的风险。\n\
  \n## Operations, Analytics, and Limited Resources\n\nRenegotiating team responsibilities\
  \ is part of implementing a data mesh. But one of the risks is that this renegotiation\
  \ can become untenable for those holding new responsibilities, especially if they\
  \ lack sufficient resources. For example, a very popular source domain may find\
  \ itself responsible for creating a large number of different kinds of data products\
  \ but be unable to dedicate sufficient resources to the efforts.\n\n重新谈判团队职责是实施数据网格的一部分。但其中一个风险是，这种重新谈判可能对于承担新职责的人来说变得不可持续，尤其是当他们缺乏足够资源时。例如，一个非常受欢迎的源领域可能会发现自己负责创建大量不同类型的数据产品，但无法为此投入足够的资源。\n\
  \nThe reality is that we live in a world with multiple competing requirements. While\
  \ data mesh can prescribe clean and neat boundaries about who _should_ be responsible\
  \ for creating, building, and maintaining a data product, the reality is often quite\
  \ a bit messier. Operational concerns tend to take precedence over creating new\
  \ data products _unless those data products also serve operational use cases_. For\
  \ example, the sales data product of “Source-aligned data products” on page 33 illustrates\
  \ operational concerns—a sale has occurred, the data is published in an event, and\
  \ consumers will now react to it to fulfill it. At the same time, this data product\
  \ can also be used to compute analytical results, such as the daily sales aggregate-aligned\
  \ data product in “Aggregate-aligned data products” on page 33.\n\n现实是，我们生活在一个有多个竞争性需求的世界里。虽然数据网格可以规定关于谁\
  \ _应该_ 负责创建、构建和维护数据产品的清晰整洁边界，但现实往往要混乱得多。运营问题往往优先于创建新的数据产品 _除非这些数据产品也服务于运营用例_。例如，第\
  \ 33 页“源对齐数据产品”中的销售数据产品说明了运营问题——一次销售已发生，数据以事件形式发布，消费者现在将对此做出反应以完成履行。同时，此数据产品还可用于计算分析结果，例如第\
  \ 33 页“聚合对齐数据产品”中的每日销售聚合对齐数据产品。\n\nBuilding your own aggregates from source-aligned\
  \ and other aggregate-aligned data products is an essential escape hatch to the\
  \ problem of insufficient resources. Source-aligned data products are fairly easy\
  \ to create in comparison to aggregates, and the fact that they can be tailored\
  \ to support operational use cases tends to give them a much higher priority in\
  \ the responsibility queue of the data domain owner. When resources are tight, focus\
  \ on creating general-purpose source-aligned data products that can be used by many\
  \ different teams.\n\n从源对齐和其他聚合对齐数据产品构建自己的聚合是解决资源不足问题的重要退出通道。与聚合相比，源对齐数据产品相对容易创建，而且它们可以定制以支持运营用例的事实往往使它们在数据领域所有者的责任队列中拥有更高的优先级。当资源紧张时，应专注于创建可供多个不同团队使用的通用源对齐数据产品。\n\
  \nThere remains a popular though incorrect notion that event streams are incapable\
  \ of storing data indefinitely. And that even if you _could_ do it, you shouldn’t,\
  \ because they’re not built for that purpose. This mentality is an extremely outdated\
  \ viewpoint, often based on the historical limitations of messaging systems, queues,\
  \ and nascent event brokers. In the next section, we'll evaluate the role of event\
  \ streams from the lens of data through time, the Kappa and Lambda architectures,\
  \ and the modern way to think about event streams.\n\n仍然存在一种流行但错误的观念，即事件流无法无限期存储数据。而且，即使你\
  \ _能_ 做到，也不应该这样做，因为它们不是为此目的构建的。这种心态是一种极其过时的观点，通常基于消息系统、队列和初级事件代理的历史局限性。在下一节中，我们将从随时间推移的数据、Kappa\
  \ 和 Lambda 架构以及思考事件流的现代方式的角度来评估事件流的作用。\n\n## The Kappa Architecture\n\nThe Kappa\
  \ architecture posits the use of an event stream as the source of both current and\
  \ historical data. Consumers who want a complete picture of the data simply set\
  \ their offset to the beginning of the stream and consume all of the data in sequence,\
  \ eventually reaching the real-time head of the stream. This architecture is in\
  \ contrast to the Lambda architecture, which posits two separate storage layers,\
  \ one for historical data and one for near real-time data. We'll come back to Lambda\
  \ in a bit.\n\nKappa 架构主张使用事件流作为当前和历史数据的来源。想要完整了解数据的消费者只需将偏移量设置为流的开头，并按顺序消费所有数据，最终到达流的实时头部。这种架构与\
  \ Lambda 架构形成对比，Lambda 架构主张两个独立的存储层，一个用于历史数据，一个用于近实时数据。我们稍后将回到 Lambda。\n\nThe Kappa\
  \ architecture was first presented in 2014 by Jay Kreps, co-creator of Apache Kafka\
  \ and cofounder of Confluent. The Kappa architecture has only relatively recently\
  \ become feasible, in large part due to technical advances in modern event brokers.\n\
  \nKappa 架构于 2014 年首次由 Jay Kreps（Apache Kafka 的共同创建者和 Confluent 的联合创始人）提出。Kappa 架构直到相对最近才变得可行，很大程度上归功于现代事件代理的技术进步。\n\
  \nIndefinite retention provided by tiered storage is now the norm for modern event\
  \ brokers, making it easy and affordable to store as much data as you need in the\
  \ stream. Deletion of old records through compaction keeps the size of streams built\
  \ for ECST to a minimum, in line with the scope of the actual data domain. Figure\
  \ 3-9 shows the end-to-end workflow in a Kappa architecture. The producer (1) writes\
  \ events as they occur into the event stream (2), and each consumer is responsible\
  \ for processing that data, including storing it in its own internal state store\
  \ (3).\n\n分层存储提供的无限期保留现在已成为现代事件代理的常态，使在流中存储所需的尽可能多的数据变得简单且负担得起。通过压缩删除旧记录可以将构建用于\
  \ ECST 的流的大小降至最小，与实际数据领域的范围保持一致。图 3-9 展示了 Kappa 架构中的端到端工作流。生产者（1）在事件发生时将其写入事件流（2），每个消费者负责处理该数据，包括将其存储在其自身内部状态存储中（3）。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_72_0.png)\n\nFigure 3-9. In the Kappa\
  \ architecture, each consumer independently consumes events and builds its own state\n\
  \n图 3-9. 在 Kappa 架构中，每个消费者独立消费事件并构建其自身状态\n\nOf course there are some trade-offs\
  \ with the Kappa architecture. For example, you must build your service’s state\
  \ by processing the entire history of events. For extremely large data sets, particularly\
  \ if there is an insufficient partition count, you could be looking at many hours.\
  \ New and existing applications that need to build or rebuild their state will need\
  \ to account for that with historical data processing time.\n\n当然，Kappa 架构存在一些权衡。例如，你必须通过处理整个事件历史来构建服务的状态。对于极大的数据集，特别是分区数量不足的情况下，这可能需要数小时。新的和现有的需要构建或重建其状态的应用程序需要将历史数据处理时间纳入考虑。\n\
  \nConsumer applications can rely on maintaining their own snapshots of materialized\
  \ state to bootstrap loading their application. In the event of an outage or a failure,\
  \ a restarted application can simply load its own personal snapshot, complete with\
  \ offset tracking history, and resume processing from precisely where it left off.\
  \ The application remains responsible for building and loading its own snapshots,\
  \ though this functionality comes out of the box with leading stream-processing\
  \ technologies such as Apache Kafka Streams, Apache Flink, and Apache Spark.\n\n\
  消费者应用程序可以依靠维护其自身物质化状态的快照来引导加载其应用程序。在发生中断或故障时，重新启动的应用程序可以简单地加载其自身快照，包括偏移量跟踪历史记录，并从中断处的精确位置恢复处理。应用程序仍负责构建和加载其自身快照，尽管此功能与领先的流处理技术（如\
  \ Apache Kafka Streams、Apache Flink 和 Apache Spark）一起开箱即用。\n\nThe Kappa architecture\
  \ is key to building decoupled event-driven services (and microservices) and provides\
  \ your applications’ builders with unparalleled flexibility for application development.\
  \ The business logic for consuming, transforming, storing, and reacting to state\
  \ changes is completely within the consumer’s control. Modern cloud service providers\
  \ offer easy access for requisitioning storage space, memory, compute, network I/O,\
  \ and durability to help build and use data products.\n\nKappa 架构是构建解耦的事件驱动服务（以及微服务）的关键，并为你的应用程序构建者提供了无与伦比的灵活性来进行应用程序开发。消费、转换、存储和响应状态变更的业务逻辑完全在消费者的控制之下。现代云服务提供商提供便捷的访问方式来申请存储空间、内存、计算、网络\
  \ I/O 和持久性，以帮助构建和使用数据产品。\n\nExample 3-1 shows a Kafka Streams application with two\
  \ KTables, which is just a stream materialized into a table using ECST. Next, the\
  \ inventory KTable and the sales KTable are joined using a nonwindowed INNER join\
  \ to create a KTable of denormalized and enriched item inventory. Stream-processing\
  \ frameworks make it very easy to handle event streams, build up internal state\
  \ using ECST, and merge and join data from various data products, in just a few\
  \ lines of code.\n\n示例 3-1 展示了带有两个 KTable 的 Kafka Streams 应用程序，它只是使用 ECST 将流物质化为表。接下来，库存\
  \ KTable 和销售 KTable 使用非窗口化 INNER join 连接，以创建非规范化和丰富的物品库存 KTable。流处理框架使处理事件流、使用 ECST\
  \ 构建内部状态以及合并和连接来自各种数据产品的数据变得非常简单，只需几行代码。\n\n## Example 3-1. Showcasing joins with\
  \ Kafka Streams\n\n示例 3-1. 使用 Kafka Streams 展示连接\n\n```\nStreamsBuilder builder\
  \ = new StreamsBuilder();\n//Materialized state of the \"inventory\" stream\nKTable\
  \ inventory = builder.table(\"inventory\")\n//Materialized state of the \"items\"\
  \ stream\nKTable sales = builder.table(\"items\")\n\n//Join events on primary key\
  \ and apply custom business logic\n//Note that inventory and items need to be keyed\
  \ on the same itemId\nKTable enrichedItemInventory = inventory.join(items, ...)\n\
  ```\n\nSomething similar can be accomplished in SQL code using Apache Flink. In\
  \ Example 3-2, Inventory and Items are materialized tables based on the associated\
  \ Kafka topics. An Enriched_Item_Inventory table is created by INNER joining on\
  \ the item_id (primary key) of the two tables.\n\n使用 Apache Flink 的 SQL 代码可以完成类似的操作。在示例\
  \ 3-2 中，Inventory 和 Items 是基于关联的 Kafka 主题的物质化表。Enriched_Item_Inventory 表是通过对两个表的\
  \ item_id（主键）进行 INNER join 创建的。\n\n\n\n\n\n## Example 3-2. Showcasing joins with\
  \ Flink SQL\n\n```\nCREATE TABLE Inventory (\n item_id VARCHAR,\n quantity BIGINT,\n\
  \ timestamp TIMESTAMP(3),\n PRIMARY KEY (item_id) ENFORCED,\n) WITH (\n 'connector'\
  \ = 'kafka',\n 'topic' = 'inventory',\n 'properties.bootstrap.servers' = 'localhost:9092',\n\
  \ 'properties.group.id' = 'my_app_group_id',\n 'format' = 'avro',\n 'scan.startup.mode'\
  \ = 'earliest-offset'\n);\n```\n\n```\nCREATE TABLE Items (\n item_id VARCHAR PRIMARY\
  \ KEY,\n name VARCHAR,\n description VARCHAR,\n brand VARCHAR,\n timestamp TIMESTAMP(3),\n\
  \ PRIMARY KEY (item_id) ENFORCED,\n) WITH (\n 'connector' = 'kafka',\n 'topic' =\
  \ 'items',\n 'properties.bootstrap.servers' = 'localhost:9092',\n 'properties.group.id'\
  \ = 'my_app_group_id',\n 'format' = 'avro',\n 'scan.startup.mode' = 'earliest-offset'\n\
  );\n```\n\n```\nCREATE TABLE Enriched_Item_Inventory AS\nSELECT *\nFROM INVENTORY\n\
  INNER JOIN ITEMS\nON ITEMS.item_id = INVENTORY.item_id;\n```\n\nFlink SQL 代码简洁、整洁且强大。你可以快速且轻松地编写极其有用的数据转换，利用\
  \ Kappa 架构，几乎无需进行大量操作。Kafka Streams 和 Flink 是最流行的流处理框架之一；如果你在寻找功能齐全、事件驱动的框架，二者都是不错的选择。为了简洁起见，我不会逐一介绍每种可能的选项和框架，但我确实建议你在为自己的用例选择一种之前，先熟悉一下各种选项。\n\
  \nKappa 架构是构建和使用事件流数据产品的最佳方式。它简单有效，允许使用者通过单个数据产品 API 获取历史数据和实时数据。尽管 Kappa 有明显的优势，但你可能会遇到建议使用\
  \ Lambda 架构的情况，这种建议基于一种如今已被证明是错误的假设，即事件流无法无限期保留数据。现在，让我们来看看 Lambda 架构究竟是什么，以及为什么它不如\
  \ Kappa。\n\n## Lambda 架构及其为何不适用于数据网格\n\nLambda 架构是离线历史批处理数据与在线事件流数据的复合体。在这种架构中，使用者从这两个来源获取数据，并必须在自己的领域内将其重新组合成一致的模型。该架构有两个主要版本，我们将逐一介绍。\n\
  \n在第一个版本中，批处理数据层包含由域所有者进行的某种计算的结果，例如物化或聚合。在启动时，使用者将批处理层数据加载到其上下文中，然后切换到事件流层以读取和处理事件。\n\
  \n图 3-10 展示了 Lambda 架构的简化实现。生产者将新事件 (1) 写入事件流 (2) 和批处理数据层 (3)。请注意，批处理数据存储并非从事件流获取其数据，而是直接将新数据\
  \ (1) 合并到其数据库中。服务层 (4) 包含两个定期更新的批处理数据物化视图。在此例中，一个视图用于使用者 A，另一个视图用于使用者 B。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_75_0.png)\n\
  \n图 3-10. Lambda 架构，数据同时写入批处理和事件流\n\n为什么需要两个物化视图？考虑两个需求不同但相似的使用者。一个使用者需要按销售区域拆分的每小时净销售额聚合，而另一个使用者需要不含季节性商品的每日总销售额。如果没有完整的事件历史记录，这两个使用者仍然依赖于\
  \ Lambda 批处理所有者来为他们维护、计算和提供历史结果。\n\n你可能还会注意到这种方法的另一个问题——每个使用者都需要服务层的所有者来计算和维护他们自己的业务逻辑要求！这导致了一种共享责任模型，使用者无法完全拥有自己的业务逻辑。如果他们需要更改业务逻辑，则必须在生产者端在批处理数据组合期间进行更改，并在使用者端在合并事件流数据时进行更改。\n\
  \n在 Lambda 架构的第二个版本中，批处理数据层只是一个事件的长期存储，由事件代理之外维护，如图 3-11 所示。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_76_0.png)\n\
  \n图 3-11. 从事件流构建的 Lambda 批处理存储\n\n在此版本中，新数据 (1) 写入事件流 (2)，最终复制 (3) 到批处理数据存储 (4)。批处理存储不应用任何特殊业务逻辑，只是不可变、递增事件的次要存储，通过可查询\
  \ API (5) 供使用者 (6) 使用。每个使用者负责从批处理数据存储将所需的事件边加载/引导到其自身上下文中，在此过程中构建自己的状态。一旦构建好当前状态，他们就切换到实时事件流\
  \ (2)。\n\n这将与事件解释和建模相关的业务逻辑直接置于每个使用者的领域内。生产者不再需要为使用者支持任何自定义的预计算视图，大大简化了运维问题。\n\n\
  现在，你可能会觉得这种 Lambda 变体有点奇怪——如果只是存储原始事件，为什么要使用第二个状态存储？还记得我提到过设计倾向于假设不可能在代理中无限期存储事件吗？Lambda\
  \ 架构基于这样一个观念：不可能在事件代理中存储事件的完整历史记录。\n\n然而，现代事件代理结合廉价磁盘和廉价云存储，使得无限期保留成为现实。尽管曾经很有前景，但\
  \ Lambda 架构已被证明比许多人最初认为的更复杂、更难以实现。让我们来看看导致 Lambda 架构在大规模使用中极其困难的一些主要问题：\n\n### The\
  \ producer must maintain two code paths\n\n一条路径负责将数据插入批处理数据存储，另一条构建要发布到事件流的事件。对事件流和批处理数据存储进行原子提交并不容易实现，因此你面临重复数据或丢失数据的真实风险。从批处理读取的数据可能与从流中读取的数据结果不同。\n\
  \n### The consumer must maintain two code paths\n\n正如生产者必须维护两条代码路径来发布数据一样，使用者也必须维护两条代码路径来解析数据。数据的流和批处理两种表示都需要保持一致，在实践中很难做到，尤其是在数据随时间变化和演变的长期内。\n\
  \n### A batch data-sourced consumer and a stream-sourced consumer may not converge\
  \ on the same result\n\n你有一个自第 0 天起就在运行的使用者。它从未从批处理数据存储加载过任何数据。其内部状态完全是通过消费和聚合事件流构建的。你启动了第二个使用者，它是第一个的完全副本，但它从批处理数据存储引导其状态。一旦它们都跟上了最新的偏移量，你暂停新数据的输入。它们的状态相同吗？答案应该是响亮的“是的！”，但不幸的是，在实践中，这通常是一个令人沮丧的“不。”从多个来源并通过多条代码路径解析一致状态在实践中往往非常复杂。\n\
  \n### The batch data store and stream data models must evolve in sync\n\n随着源领域模型的演进，事件流中的数据表示通常也会发生变化，批处理存储的格式也是如此。生产者必须确保其写入事件流的内容与批处理服务层中的模型完全一致。在所有这些过程中，主要从批处理读取的历史使用者和仅从事件流读取的实时使用者最终都必须拥有相同数据的副本。如果这听起来很难做好，你是对的。我几乎没见过它被成功使用。\n\
  \n### Merging multiple Lambda-based data products is difficult\n\nLambda 架构的致命一击在于合并多个\
  \ Lambda 数据产品的困难。每个 Lambda 数据产品都维护着关于事件流保留的自身规则，即在何时将事件数据折叠\n\n\n\n进入批处理，事件如何被折叠成批处理，以及批处理与流之间重复数据重叠的时间段。结果是批处理数据与流数据之间的一条接缝，每个数据产品都有其自己的接缝及其自身的细微差别，这些差别很少与另一个数据产品的接缝对齐。\n\
  \n调和接缝被证明是极其困难的。每个消费者应用程序不仅必须调和每个批处理到批处理的关系，还必须调和每个批处理到流和流到流的关系。两个 Lambda 数据产品会产生四个需要管理的唯一关系，而三个\
  \ Lambda 数据产品会产生八个(!)（2*2*2）个唯一关系，这些关系必须被解释和调和。每增加一个 Lambda 来源，复杂度都会呈指数级增加。\n\n\
  直言不讳地说，我从未见过基于 Lambda 的数据产品被广泛成功使用，仅仅是因为解决超过单个 Lambda 来源太困难了。虽然 Lambda 架构在某些情况下可用于有限的应用，但在实践中，它们对于数据网格的目的来说简单来说是不够的。相反，对于大多数数据产品的生产和使用，请坚持使用\
  \ Kappa 架构。\n\n## 支持 Kappa 架构的要求\n\n现代事件代理结合廉价高效的云存储，让我们可以在事件对业务仍然相关的时间内存储事件。例如，10\
  \ 年前创建的用户账户实体事件将无限期地保留在流中，直到有一天用户被删除或账户因不活跃而被清除。否则，从账户流开头开始读取的新消费者将看到该账户，无论过去了多少时间。\n\
  \n管理流中保留的确切数据、保留时间以及删除时间取决于四件事：无限事件保留、无限存储、紧缩和删除。让我们逐一了解：\n\n- 无限期事件保留\n- 您的事件代理应该允许您无限期地保留流中的事件，就像您期望在关系数据库中存储数据并保持其对业务的相关性一样。许多事件代理不允许您这样做，强制执行基于时间的数据保留上限。那些事件代理对于我们构建事件驱动的数据网格的目的来说完全不合适。\n\
  \n- 无限存储\n- 无限期保留事件还需要有足够的存储空间。分层存储是解决此问题的常见方法，其中事件代理将旧段卸载到较慢且更便宜的“冷”存储中，将最近的“热”数据保留在内存中以提供快速服务。底层数据存储的卸载和管理对客户端完全透明，使我们只能使用单个事件代理流协议。\n\
  \n## 紧缩\n\n紧缩是删除给定键的较旧事件的操作，前提是同一键的较新事件存在于流分区中。紧缩对于保持事件流的大小与实体域的键空间成比例至关重要。事件代理会定期扫描事件流，识别要删除的事件，并将其从流中清除。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_79_0.png)\n\n支持紧缩的事件代理通常允许您选择一个最小时间段（紧缩滞后时间），在此期间事件不会被紧缩。这为您的消费者提供了一个时间段，他们可以在其中消费和处理所有事件，以便所有状态转换都可用。Apache\
  \ Kafka 使用 24 小时作为默认紧缩滞后时间，但在实践中，通常会根据每个用例调整紧缩滞后时间。\n\n## 删除\n\nECST 还要求能够从流分区中删除特定键的数据。墓碑是包含要删除的实体键且主体为\
  \ null 值的记录。墓碑告诉消费者，该键的实体已被删除，与其关联的任何数据现在可以（并且通常应该）从其状态存储中删除。墓碑记录可以像任何其他记录一样被紧缩，尽管墓碑本身也会被删除。\n\
  \n图 3-12 显示了事件流紧缩的示例。事件代理遍历事件日志，保留其遇到的键列表。它会将任何具有同一键的较新记录的较旧记录标记为删除。由于偏移量 4 处有一个\
  \ K=20 的事件（较新），紧缩器可以删除所有较早的 K=20 事件，例如偏移量 1 处的事件。同时，偏移量 2 处的 K=10 是一个墓碑事件，因此它和偏移量\
  \ 0 处的事件都被删除。所有剩余事件保留其偏移量。\n\n紧缩滞后时间通常设置为几天（或几周），这意味着比滞后时间年轻的事件不会被紧缩。将其设置为比 24 小时默认值更长的一个常见原因是考虑到周末可能会崩溃的非关键服务。运维团队可以等到下一个工作日来修复崩溃的服务并使其重新启动，而无需担心错过未紧缩的事件。\n\
  \n紧缩发生的具体方式和时间取决于事件代理。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_80_0.png)\n\n\
  图 3-12. 由于更新值或墓碑而紧缩同一键的旧事件\n\n## 选择事件代理\n\n选择支持 Kappa 架构模式的合适事件代理对于创建自助服务数据网格至关重要。临时消息传递和队列都不足以支撑数据网格——您需要确保您的事件代理支持以持久仅追加日志形式的事件流。\n\
  \n要选择代理，您需要关注基本要求并自行做出明智的决定。这些包括：\n\n### 无限持久数据容量\n\n您必须能够在事件对业务仍然相关的时间内存储所有相关事件。对于大多数数据产品，您需要将它们无限期存储。数据产品消费者必须能够随时访问和重播事件。\n\
  \n### 可扩展性\n\n虽然在云计算时代可扩展性大体上是理所当然的，但您需要确保您的事件代理可以扩展到极高的吞吐量和客户端数量。此外，事件代理必须能够高性能地提供存储的数据，因为数据产品遵循一次写入、多次读取的访问模式。\n\
  \n### 支持工具\n\n模式注册表、访问控制、元数据目录系统以及治理和血缘系统在构建数据网格中都发挥着重要作用。我们将在第 5 章中更详细地介绍这些内容，但根据您的事件代理选择考虑可用选项很重要。\n\
  \n### 作为服务部署的代理\n\n通过使用云服务，您可以绕过管理自己的事件代理部署及其带来的所有开销。如果您专注于构建数据网格，不必管理自己的基础设施可以大大节省时间和金钱。事件代理通常作为提供支持工具的较大平台的一部分出现，因此请确保您调查完整的平台产品。\n\
  \n### 保留期\n\n最终但决定性的标准是保留期。您可以在事件流中保留事件多长时间？数据产品必须在任何消费者按需时完整可用，因此任何限制保留期的事件代理都不适合用于数据网格。表\
  \ 3-1 比较了几种流行事件代理的保留期。您会注意到，只有 Kafka 和 Pulsar 提供无限期存储事件的能力。\n\n表 3-1. 流行事件代理的最大事件保留期\n\
  \n| 代理名称 | 保留期 |\n| :--- | :--- |\n| Kafka | 无限 |\n| Pulsar | 无限 |\n| Amazon Kinesis\
  \ | 365 天 |\n| Microsoft Event Hubs Premium | 90 天 |\n| Google Pub/Sub | 31 天 |\n\
  \n由于 Apache Kafka 在流处理行业的主导地位、出色的支持软件和工具以及广泛的用户知识基础，它是我目前首选的事件代理。在我的选择中，我也带有主观偏见，因为我从\
  \ 2014 年起就一直在使用 Kafka，曾为其代码库做出过贡献，并且还与它的联合创始人在 Confluent 工作过。\n\n最受欢迎的项目也往往拥有最多的社区构建的工具和贡献。模式注册表、代码生成器、处理框架、操作系统集成和数据目录集成只是需要考虑的必要依赖中的一些。Apache\
  \ Kafka 的 KIP-405 提供了一个绝佳的例子，即社区中的一些大厂商聚集在一起合作，直接在 Kafka 中构建分层存储支持，使无限期主题保留和可扩展存储变得更便宜且更可靠。\n\
  \n\n\n\n\n## 摘要\n\n技术将随时间不断变化，新的选项无疑会出现。因此需要注意的是，如果 AWS、Microsoft 或 Google 选择在其事件代理中支持无限保留，它们也可能成为支持事件驱动型数据网格的可行候选者。\n\
  \n你选择的事件代理是数据网格成功的关键组件。为构建数据网格的基础，请选择安全、可靠且经过大量测试的选项。\n\n事件流是服务大多数数据产品的最佳选择，因为它们提供了一种实时、不可变、持久、可重播且可扩展的数据服务方式。其实时界面可以为运营和分析用例提供动力。队列和短暂消息系统常被误认为与事件流等价。事实并非如此，本章将对此进行阐述。\n\
  \n物料化和聚合是事件流消费者的两种常见操作。这些操作使消费者能够通过在其自身边界内存储事件驱动数据来生成自己的最终一致性状态。访问可重播的历史数据源是另一个重要的数据产品需求。事件流通常被认为不适合无限期维护数据，部分原因是技术的历史局限性，部分原因是人们预先认为事件只能是短暂或短暂存在的。本章解决了这些问题，并讨论了处理事件流的历史和现代选项。Kafka\
  \ 架构使事件流能够成为当前和历史数据的单一来源，且在实践中比旧的且不那么有用的 Lambda 架构更易于使用。\n\n最后，我还概述了选择事件代理的要求和注意事项。现实是，目前只有少数几个选项，尽管随着事件驱动架构日益流行，仍有改进空间。实施数据网格本身就具有挑战性，因此请确保选择流行且受支持良好的技术。你会发现更容易招聘人才来帮助构建你的数据网格，并利用\
  \ SaaS 解决方案和开源项目来提高生产力。\n\n在下一章中，我们将探讨治理。如果我们计划发布数据供他人使用和消费，我们将需要一些标准、安全性以及一定程度的监督和控制。\n"
- "## 联邦治理\n\n数据网格架构本质上是去中心化的，并且将重要职责下放给数据产品所有者。数据网格也从一定程度的集中化中受益，体现在数据产品兼容性和通用自助工具方面。不同的意见、偏好、业务需求、法律限制、技术和技术债务只是影响我们如何协同工作的众多因素中的几个。\n\
  \n联邦治理使我们能够区分哪些决策应保留在本地层面，哪些决策必须在所有领域范围内全局做出。引用 Dehghani 的话：“最终，全局决策有一个目的，即通过数据产品的发现与组合来创建互操作性和复合网络效应。”\
  \ 我们需要找出、强制执行和支持共同的构建块和运作模式，以使数据网格对每个人都有效。\n\n建立联邦治理团队是朝着发现共同点以达成互利解决方案迈出的第一步之一。你的治理团队将具体做什么将取决于你自己的业务需求，但本章将介绍几种常见的职责。\n\
  \n联邦治理旨在找到个人自主权与自上而下的集中控制之间、职责下放与为一致性和秩序创建总体规则和指南之间的适当平衡。像任何形式的有效政府一样，我们需要参与、代表、辩论和协作行动才能真正完成工作。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_85_0.png)\n\n制定章程是建立联邦治理团队的重要第一步。这概述了该团队的职责和责任，例如建立数据产品格式、质量水平、互操作性、安全性和支持技术的标准。它还规定了生产者、消费者和经理的责任，以及任何其他社会和技术方面。\n\
  \n联邦治理主要关注以下几个主要领域：\n\n### 数据问题\n\n涉及数据在组织内如何创建和使用。具体而言，包括数据产品类型、元数据、架构、支持、可发现性、血缘、质量和互操作性。\n\
  \n### 技术问题\n\n包括你希望纳入数据网格的编程语言、框架和流程。评估现有技术的适用性以及审核新选项，仍然是联邦治理的关键组成部分。\n\n### 法律、业务和安全问题\n\
  \n涉及法规合规性和安全问题，例如处理财务数据、个人可识别数据和其他形式的敏感数据。业务级要求也可能起作用，例如内部数据安全性、访问策略和保留要求。\n\n###\
  \ 自助平台问题\n\n使用户更容易做正确的事情。用户需要一个可靠的自助平台来构建和使用数据产品。简化工具、减少摩擦，并让每个人都能轻松完成工作是数据网格的基石。自助平台提供了一个在源头应用法规和安全政策的机会，让你了解数据如何在组织中流动。\n\
  \n这些领域相互关联，并为查看治理团队优先事项提供了一个有用的视角。在我们阅读本章剩余部分时，请牢记这四个领域，因为每个部分都会涉及其中一项或多项主要问题。\n\
  \n但是首先——谁来治理？\n\n## 成立联邦治理团队\n\n治理团队需要一个 *授权* 才能有效开展工作。授权包括两个主要组成部分。第一个是 *机构* 组成部分，即“高层”支持数据网格和治理团队，为成员提供一定程度的权威、所有权和责任。第二个组成部分是\
  \ *社会* 组成部分，即那些本应使用数据网格的人认识到其重要性并支持它。缺少其中任何一个组成部分，该举措可能会失败。\n\n治理团队由组织各个部门的人员组成，他们充当与构建和支持明确定义的数据网格相关的团队、产品、技术和流程的代表。作为同事的代表，每个成员从其问题空间提出想法、需求和疑虑，并共同努力找出令人满意的解决方案。\n\
  \n寻找代表通常很简单，只需要求一名志愿者代表团队担任固定时期（例如三个月）即可，但他们必须精通团队所面临的挑战。高级技术人员常常被“志愿”（选中）担任此角色，因为他们通常最了解团队需求、问题空间和历史背景，例如过去的改革尝试。过去改革努力可能失败通常有相当重要的技术原因，而这种历史背景往往有助于指导讨论，找到通往新成功解决方案的道路。\n\
  \n联邦治理团队的规模将随组织的规模而变化，但应限制在能够进行有效的一小时会议的规模。如果群组太小，你可能会发现代表性不足，疏远队友并损害信任和支持。如果群组太大，你可能会发现人们开始觉得自己的意见并不重要，或者群组中的其他人会做出艰难的选择。找到联邦治理团队的最佳规模，或许具有讽刺意味，取决于联邦治理团队本身。从小规模开始，并在遇到代表性边界时随时吸纳更多成员。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_86_0.png)\n\n收集匿名反馈，了解团队对自己的运作情况的看法，以及来自团队外部队友和利益相关者的反馈。这将帮助团队举行更有效的会议，为治理领域找到适当的边界，并确定有效的团队规模和章程。\n\
  \n一旦你有了初始团队，就可以开始实施标准来简化数据网格体验。\n\n\n\n\n## 实施标准\n\n联邦治理团队负责制定一套数据产品和技术标准。\n\n将贵组织必须支持的技术想象为一个空间有限的物理工具箱。\n\
  \n如果要向工具箱添加新工具，需要确保有足够空间，且没有其他同样合适的工具可以胜任。\n\n对工具箱施加合理的限制，可以确保技术蔓延得到控制，并且只添加提供重大改进的工具。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_87_0.png)\n\n为新工具、语言、标准和技术设立进入壁垒，对减少蔓延、排除边缘选项以及防范时兴实现方式，*至关重要*。\n\
  \n保持工具箱精简小巧，可以让您在自助式数据网格平台上为每个工具提供一流支持，这要容易得多。\n\n标准应通过*提案*引入，并详细解释新选项为何优于工具箱中已有的内容。\n\
  \n新选项可能涵盖工具箱中尚无对应方案的急需用例。\n\n或者，新选项可能在绝对意义上优于已有使用的内容。\n\n提案人必须讲述一个故事，并提供示例，说明其建议为何是良好的，以及会对工具和选项选择产生什么影响。\n\
  \n在将提议的标准或技术添加到一流认可的工具箱之前，*试用*它非常重要。\n\n确保试用凸显技术的重要性、它比现有内容优在哪里，以及在现有工具和支持的背景下，它带来了什么权衡。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_87_1.png)\n\n要注意，不要让试用系统以“临时”（但实际是永久）的基础被提升到生产环境。\n\
  \n在关键路径之外的系统中测试新技术和框架很重要，以便您可以重写或放弃它们而不会造成业务延迟。\n\n让我们来看看贵治理团队需要建立的一些主要标准。\n\n##\
  \ 支持多模态数据产品类型\n\n如第31页“数据产品是多模态的”中所述，您的联邦治理团队需要决定您_支持_和_不支持_哪些数据产品类型和端口。\n\n事件流是本书涵盖的核心数据产品类型，但您也可以选择支持其他类型，例如云数据存储中的批量计算Parquet文件，我们将在第9章中进一步讨论。\n\
  \n支持多种数据产品类型为数据产品所有者提供了更多选项，但代价是治理和自助工具的复杂性大幅增加。\n\n了解支持每种数据产品类型所需的机会成本和工作量非常重要。\n\
  \n例如，您需要确保已考虑信息安全、加密、访问控制、数据产品互操作性和自助式数据平台集成。\n\n添加新的数据产品类型可能需要大量工作，如果投资回报率不高，那么使用现有（尽管略有次优）类型提供数据产品可能更合理。\n\
  \n如果您认为支持新的数据产品类型是有道理的，那么您应该创建一个提案，并在联邦治理会议上提出供审议。\n\n我们将在第85页的“2. 起草提案”中进一步探讨提案。\n\
  \n这里的目标不是约束数据产品所有者，而是确保提供的工具受到支持、满足治理要求、易于使用，并涵盖必要的业务用例。\n\n不要为了多样性或新鲜感而向工具箱添加新工具，尤其是在已有现成且受支持良好的方式可以提供足够访问和使用的情况下。\n\
  \n## 支持数据产品架构\n\n架构框架实际上是数据的编程语言。\n\n就像您用代码构建应用程序一样，您也用自己的代码构建数据产品架构。\n\n该代码的确切外观以及为您选择哪些选项最佳，将在第6章中详细介绍。\n\
  \n目前，请考虑您可能支持多少种、哪些类型的架构和格式。\n\n最常见的两个考虑因素包括：\n\n- **事件架构**\n  \n  Apache Avro、Protocol\
  \ Buffers（Protobuf）和 JSON Schema 往往是事件最常见的格式。每种格式都有其自身的权衡，特别是关于类型强制、架构演进能力、默认值、枚举和文档。\n\
  \n- **文件格式**\n  \n  写入云存储桶的批量文件传统上遵循大数据文件惯例，包括 CSV、JSON、Avro、Protocol Buffers、Parquet\
  \ 和 ORC——仅举几例。此外，请考虑构建在这些基本文件格式之上的较新开源技术，例如 Apache Iceberg、Apache Hudi 和 Delta Lake。每种技术都提供更高级别的文件系统类型功能，例如隐藏分区、事务和压缩，并可以使使用批量托管的数据产品更加易于使用，代价是与技术的耦合更紧密。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_89_0.png)\n\n最好为每种数据产品类型标准化为仅一个事件架构框架或文件格式。\n\
  \n例如，流使用 Avro，数据湖中批量计算的文件使用 Parquet。\n\n只有在绝对必要时才扩展以支持其他格式。\n\n单一格式大大简化了工具和消费者体验，同时保持复杂性和风险较低。\n\
  \n如果必须支持多种文件格式或事件架构，请确保数据产品所有者能找到易于遵循的说明，了解应使用哪种格式以及原因。\n\n否则，当相邻团队最终使用完全不同的架构框架实现其数据产品时，会引入摩擦，使其共同消费者的消费和使用变得更加困难。\n\
  \n接下来，让我们看看一些编程语言问题和疑虑。\n\n## 支持编程语言和框架\n\n生成数据产品的一种常见方法是使用源领域中已在使用的语言。\n\n团队已经精通该语言，这简化了数据产品的创建和支持。\n\
  \n另一种选择是选择组织其他部分正在使用的语言（或工具），也许是因为它更适合创建数据产品。\n\n我们将在第8章中探讨将现有数据引导到事件驱动数据产品的具体细节。\n\
  \n有时开发者会利用创建数据产品的机会尝试一种新的冷门语言，无论是否正式支持。\n\n这将使该开发者未来长期承担所有支持和维护责任，如果没有其他人学习该语言，产品将面临风险。\n\
  \n随着时间的推移，构建数据产品的开发者很可能会转向新项目或工作机会，进一步增加风险。\n\n重要的是，仅在广泛使用或否则由贵组织正式支持的语言中实现数据产品。\n\
  \n如果您认为一种语言有更广泛使用的价值，那么最好创建一个提案（参见第85页的“2. 起草提案”）并与联邦治理团队讨论。\n\n决定为构建数据产品支持哪些语言（和框架），主要基于与构建任何其他服务相同的标准。\n\
  \n这些因素包括：\n\n### 社会因素\n\n这是一种广为人知的技术吗？我们的开发者熟悉它吗？行业内是否有其他人在使用它，并且他们是否取得了成功？人们是否愿意使用它？对新雇员是否有吸引力，我们能否在市场上找到具备这些技能的人？\n\
  \n### 技术因素\n\n它是以简单有效的方式解决我们的问题吗？它是一种经过验证的技术，未来多年将继续更新和改进吗？\n\n### 集成因素\n\n它是否易于支持？它是否与我们现有的开发、测试、构建和部署流水线集成良好？您是否可以获得与其集成的代码检查工具（linters）、调试器、内存分析器、测试工具和其他生产力增强工具？\n\
  \n### 事件代理客户端\n\n您的事件代理是否有用您选择的语言编写的高性能客户端？您能否足够快地生成和消费事件？\n\n### 支持性工具\n\n您的语言和框架是否与您的事件架构（第6章）配合良好？它们是否支持代码生成器？您能否生成测试事件来测试您的数据产品输入和输出？\n\
  \n决定支持哪些语言以及支持程度如何，将由贵组织和治理团队决定。\n\n选择贵组织熟悉且具有事件代理支持的语言。\n\n## 元数据标准和要求\n\n一个良好的数据网格需要为每个数据产品定义明确的元数据。\n\
  \n数据网格用户应该能够发现并识别其业务用例所需的数据产品。\n\n数据产品所有者在注册数据产品时必须提供所有必需的元数据，才能获准将数据产品发布到网格中。\n\
  \n强制执行元数据要求对于确保只有定义明确且受支持良好的数据产品可供他人使用至关重要，以免我们重蹈第17页“坏数据：不作为的代价”中讨论的先前数据战略的覆辙。\n\
  \n对于健康的数据网格，有几个字段至关重要。在本节中，我们将逐一介绍它们，并为您提供一些基本示例，供您的治理团队考虑。\n\n\n\n\n## 域和所有者\n\n\
  首先是所有权。谁拥有数据产品？它来自哪里？此元数据包括域命名空间和数据产品所有者的名称。数据产品所有者的名称是一个自然人，他代表该域的数据产品。\n\n## 分级服务级别\n\
  \n数据产品需要支持和正常运行时间保证。但是保证到什么程度？如果数据产品遇到故障，应采取什么适当措施？许多公司已经将其应用程序组织成分级系统，最高级别拥有 24\
  \ 小时轮值班次，最低级别提供简单的尽力而为支持。你应该将相同的分级系统应用于数据产品，并提供与同一级别的任何其他服务或产品相同的支持和保证。以下是四级系统示例：\n\
  \n### 一级\n\n对业务运营至关重要的数据产品，其中停机或故障会对客户或业务财务造成重大影响。为实时运营应用提供支持的数据产品通常属于此类别。\n\n###\
  \ 二级\n\n对业务很重要但不如一级关键的数据产品。此级别的故障可能导致客户体验下降，但不会完全阻止客户与您的系统交互。此级别的数据产品也通常为实时运营应用提供支持。\n\
  \n### 三级\n\n可能影响业务后台任务和运营的数据产品，但通常对消费者不可见，也不会对他们造成重大影响。但是，如果此级别的数据产品支持时间敏感的用例，故障时可能仍需要进行干预。\n\
  \n### 四级\n\n具有最大恢复时间窗口的数据产品。不必为这些数据产品设置轮值班次；它们可以等到下一个工作日再解决。\n\n正常运行时间和可用性并不是数据产品服务级别的唯一考虑因素。您还需要监控数据产品，以确保它们满足\
  \ SLA，我们将在“监控和告警”第 122 页中更深入地介绍此内容。\n\n## 数据质量分类\n\n数据产品提供的数据质量也应进行分类，类似于 SLA 分级系统的方法。一种选择是利用数据湖架构中常用的铜、银、金奖章分类。让我们来看看每个分类：\n\
  \n### 铜\n\n来自原始源格式的未结构化和原始数据，未经过转换。可能与源系统的内部数据模型强耦合，并且可能还包含需要清理或净化的字段。还可能包含结构良好且已定义的数据，但其质量是断断续续的，或者数据所有者根本无法提供更高的保证。\n\
  \n### 银\n\n结构良好的数据，具有强类型，通常经过清理和标准化。通常经过反规范化，足以直接使用，最常见的外键关系已被连接和解决，以便消费者使用。已应用类型检查和约束，以确保最低数据质量（例如，99.99%\
  \ 的事件通过质量检查）。事件上下文已明确定义和记录，类型检查和约束也是如此。如果消费者希望在数据上施加他们自己进一步、更严格的约束，他们最好与数据产品所有者沟通以评估选项。\n\
  \n### 金\n\n最高级别的质量。通常被称为“权威”，金级质量的数据产品旨在毫无保留地依赖。数据产品经过严格测试和监控，其类型检查和约束超过了银质量级别（例如，99.9999%\
  \ 的事件通过质量检查）。金数据产品通常更复杂，由重大聚合和转换构建而成，提供重大价值，消费者自己很难复制。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_92_0.png)\n\
  \n数据质量分类与数据产品对齐（源对齐、聚合对齐和消费者对齐）是分开的，仅关注数据质量。\n\n您可以自由选择备选分类模型。重要的是，您的数据网格用户必须能够轻松理解并将建模应用到他们自己的数据产品上，以保留数据生产者和消费者之间的共同理解。\n\
  \n## 隐私、财务和自定义标记\n\n在与安全和财务信息代表协作下，治理团队可以制定要应用于数据产品的标记，以帮助自动化特殊处理。例如，您可以选择包含类似于\
  \ SLA 的安全分类分级系统。您还可以选择使用与事件流中包含的数据类型相关的标记，例如财务、PII 或基于区域的标记。\n\n支持数据产品上的标记可以更轻松地应用治理规则，因为它们可以按标记基础应用。例如，寻求使用带有财务标记的数据产品的消费者需要证明其符合组织的财务数据处理要求。标记还能更轻松地按消费者基础审计数据使用情况。\n\
  \n## 上游元数据依赖\n\n上游服务和数据产品各自拥有自己的 SLA、数据质量级别和其他保证。任何依赖上游服务或数据产品的服务或数据产品在制定自身保证时都必须考虑这些依赖。例如，当服务依赖具有四级保证的数据产品时，无法提供一级支持。我们将在本章后面的“数据产品血缘”第\
  \ 92 页中进一步介绍血缘。\n\n作为治理要求的一部分，您可以选择为数据质量和 SLA 建立最低上游要求，以支持您的生产应用程序，无论它们是运营型、分析型、服务型还是数据产品。一种常见的约定是仅允许在生产中使用具有一级或二级\
  \ SLA 保证的服务。\n\n上游数据质量要求不那么严格——完全可以用一级铜数据产品支持一级金数据产品。事实上，这通常是铜数据转换为高质量金层数据产品的方式。\n\
  \n您可以在创建数据产品时强制执行上游检查，我们将在第 5 章中更详细地探讨此内容。\n\n## 元数据总结示例\n\n图 4-1 显示了用户查找数据产品信息时可能看到的示例。虽然我们将在第\
  \ 5 章中更详细地探讨元数据目录，但目前您可以将其视为一个只读数据库，您可以在其中查找可用数据产品及其属性。\n\n数据产品名称、域和用户都是在发布时创建的强制元数据。还包含描述字段，用于描述上下文并将数据产品与其他类似数据产品区分开来。关于服务、质量和安全级别的元数据也存在，还有描述\
  \ PII、财务和区域信息的标记。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_94_0.png)\n\n图 4-1.\
  \ 数据网格用户可能期望看到的数据产品元数据示例\n\n元数据中的架构字段来自架构注册表，该组件存储和管理事件流的架构，是自助服务数据平台的重要组成部分。我们将在第\
  \ 99 页的“架构注册表”中更详细地介绍此内容。代理名称和主题名称也被提取，以提供数据产品的数字地址。\n\n元数据帮助我们就哪些数据产品可用于我们的用例做出明智决策。数据产品之间的兼容性对于使我们能够合并来自不同来源的数据至关重要，这是下一节的主题。\n\
  \n## 确保跨域数据产品兼容性和互操作性\n\n有许多因素构成了跨域聚合、合并和比较数据产品的过程。作为本章开头概述的数据关切的一部分，互操作性和易用性仍然是联邦治理的两个主要关注点。关于通用实体、时区、聚合边界以及事件映射、分区和流大小的技术细节的规则和指南均属于治理团队的职权范围。让我们现在来看看这些领域。\n\
  \n\n\n\n\n## 定义和使用常见实体\n\n定义跨业务多个领域使用的最小实体是首要的重要步骤之一。让我们先看一个示例。\n\n一家电商公司定义了一个包含两个字段的通用\
  \ Item 实体：long id 和 long upc_code。预期数据产品所有者在任何引用其电商项目的数据产品中都使用 Item 实体，无论是 Order、Inventory\
  \ entry 还是 Return。这些相关实体各自使用通用且标准化的 Item 版本，从而消除了消费者对同一数据的类似但不同表示进行解释的需求。\n\n通用实体并不妨碍你向数据产品添加更多关于该实体的信息。你可以自由扩展数据产品以包含关于\
  \ Item 的其他信息，例如服装项目的 size 和 color，或食品项目的 weight 和 serving_size。可以将通用实体视为不同领域数据产品之间的附着点，以及实体数据模型的可扩展基础。\n\
  \n## 事件流键控和分区\n\n事件流式数据产品的互操作性受流分区数、事件键和分区分配算法的影响（参见第 3 章）。事件流包含一个或多个分区，每个事件根据分区分配算法、事件键和分区数量被分配到一个分区。以下是一些有用的互操作性提示：\n\
  \n### 分区数量\n\n如果事件分区数量大小相同，从多个流连接和聚合数据产品的计算强度可以大大降低。虽然像 Kafka Streams 和 Flink 这样的事件流处理器可以根据需要自动重新分区事件流，但这需要更多的处理能力，并可能产生更高的成本。尝试使用\
  \ T恤尺寸方法来标准化分区数量，例如 x-small=1、small=4、medium=8、large=16、x-large=32、xx-large=64、jumbo=256。作为自助服务平台的一部分（我们将在下一章中介绍），你可以向数据网格用户提供基于键空间、事件数量和消费者重新处理需求的分区数量选择指南。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_95_0.png)\n\n如果你正在构建基于通用实体键的数据产品，请检查其他也基于该实体键的数据产品的分区数量——如果它们都在使用相同的分区数量，你最好也使用该数量。\n\
  \n### 事件键\n\n使用原始值（如 string、int 或 long）来处理事件键是最佳选择。通用实体的唯一 ID 是实现互操作性的最佳选择。\n\n\
  ### 分区分配算法\n\n该算法以事件键作为输入，并返回要写入事件的分区 ID。不同编程语言和框架的事件生产者客户端可能使用不兼容的算法，导致事件流无法互操作，尽管使用相同的事件键和相同的分区数量。虽然使用像\
  \ Kafka Streams 这样的单一框架可以确保分区分配一致，但你需要做一些研究，作为自助服务平台的一部分来评估其他框架。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_96_0.png)\n\
  \n要小心热分区，即不成比例的大量事件被分配到单个分区的情况。例如，99% 的所有事件可能被分配到单个分区，而其余分区仅获得 1% 的数据。这通常是由于键空间极窄造成的，但也可能是由于分区分配算法不合适造成的。\n\
  \n从一开始就要考虑兼容性的键和分区非常重要，因为你创建的许多数据产品都会长期存在。更改分区是可能的，但通常需要将数据重写到新的事件流并迁移消费者。坚持使用 T恤尺寸，根据消费者的需求（例如，重新处理、并行化）制定一些选择分区数量的建议，并根据可用的客户端框架定义通用分区分配算法。\n\
  \n## 时间和时区\n\n数据产品可能与时间窗口或时间段相关联。例如，按聚合对齐的数据产品可能表示一段时间内的数据，例如每小时或每天的聚合。作为确保互操作性标准的一部分，为所有基于时间的数据产品建立主要时区，例如\
  \ UTC-0。如果消费者不必处理时区转换和夏令时问题，他们将获得更简单的体验来组合不同的基于时间的数据产品。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_96_1.png)\n\
  \n在适用的情况下，你应将聚合周期和时区相关信息作为数据产品元数据的一部分包含在内。这些信息将帮助你的消费者决定是否需要进行进一步处理，以将其与其他数据产品合并。\n\
  \n现在我们已经介绍了提供数据产品兼容性的方法，是时候深入探讨社会层面了。我们如何对数据网格标准和要求做出有效决策？\n\n## 治理会议是什么样子？\n\n\
  全面介绍高效会议的内容超出了本书的范围，但以下几点指导应该能帮助你入门。首先，确保遵循所有技术会议共通的最佳实践。其次，提前很久发送邀请，并为会议提供议程。第三，确保有主持人和负责做笔记、记录行动事项的人，并确保每个人都知道下次会议需要完成什么。轮换职责和义务以确保平等代表是常见的做法。\n\
  \n让负责运营系统的人员与负责分析系统的人员坐在同一会议室里非常重要。你可能会惊讶，或者可能只是失望，这种情况发生得如此之少。“数据团队”与“工程团队”的隔离长期困扰着\
  \ IT 领域，正如我们在第 17 页的“糟糕数据：不作为的代价”中所提到的。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_97_0.png)\n\
  \n与任何会议一样，性格强势或嗓门大的人可能会试图主导谈话。确保有主持人主持会议，并确保每个人都有机会不受打断地发言。如果会议变得激烈并开始变得无效，请休息 5\
  \ 分钟或当天休会。\n\n在数据网格转型的初始阶段，你应该预期会频繁开会。你将有许多事情要讨论、解决、支持和标准化。随着时间的推移，你可以预期开会频率会降低。\n\
  \n但是，治理团队应该关注哪些主要任务呢？让我们来看看五个主要领域，并讨论它们与数据网格的关系。\n\n### 1. 识别现有问题\n\n治理团队的第一项任务是识别问题所在。你的团队应由组织各部门的个人组成，他们对技术和数据格局有很好的了解。自下而上的基层报告问题和困难的方法通常效果最好。请同事们识别他们遇到问题的领域、面临的障碍和阻碍，以及他们希望能做什么——无论是从业务需求还是简化运营复杂性的角度。\n\
  \n让每个人使用卡片或便利贴列出他们的主要问题和困难。然后你可以将相似的问题聚集在一起，从而找到可能产生最大影响的改进领域。\n\n识别问题是改进所有人数据网格的第一步。常见问题可能包括缺乏自助服务工具、现有产品中数据不一致，以及关于重复数据、信息安全、PII\
  \ 和财务信息缺乏政策。一旦问题被识别，你就可以确定哪些最重要，并投入资源来解决它们。\n\n### 2. 起草提案\n\n下一步是创建一份提案，阐明问题，解释为什么解决它很重要，阐述挑战和机遇，并识别可能的解决方案。提案很像许多民主制度的议院、参议院和议会中提出的法案。它提出变更，提供详细信息，并指定范围，全部打包成一个可讨论的单元。\n\
  \n不仅治理团队可以创建待审提案——组织中的任何人都可以创建一个。事实上，跟进那些识别出问题的人通常能取得最佳结果——他们通常对如何改善事情有一些想法，只是需要有人来组织和推动必要的工作。提案应专注于解决具体识别出的、对数据网格用户有实际影响的问题。\n\
  \n提案示例可能包括：\n\n- 在数据产品中引入字段级加密以限制访问某些敏感信息\n- 实施处理跨多个云部署的数据产品的法规\n- 向数据产品元数据添加自定义标记以改进搜索功能\n\
  - 向数据产品添加命名空间以启用命名空间级别的安全访问\n- 在自助服务平台中引入集中式身份验证和授权服务，以统一各云服务的身份管理\n\n虽然提案可以涵盖广泛的关注领域，但大多数时候它们应该导致可供数据网格用户使用的自助服务工具和平台得到改进。强制实施新流程固然很好，但如果它没有融入数据网格用户每天使用的工具和服务中，那么它很可能不会被遵循或使用。\n\
  \n\n\n\n提案应该说明问题成功解决后的样子。制作原型来展示解决方案的具体运作方式，能让想法扎根于实际层面，而非理论层面。在推广到一般使用之前，请设计实验、运行测试、分配研究、调查选项并制作技术原型。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_99_0.png)\n\n### 3. 审阅提案\n\n联合治理团队审阅提案，以确定解决方案的可行性和所需的实施资源。你审阅这些提案的方式因团队而异，尤其是在考虑远程工作、时区和其他分布因素时。一个效果较好的选择是让联合治理团队的成员分别审阅提案，做出任何笔记或标记任何疑虑，然后再召开更大范围的小组会议。如果你能让所有人聚在一起（无论是数字会议室还是实体会议室），你可能会发现更容易提出问题、辩论选项并制定统一计划。你也可以异步会面，并决定只有在存在足够分歧或困惑时才聚在一起。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_99_1.png)\n\n保持审阅的开放性和包容性。邀请你认为能够通过提供额外背景和信息来帮助的组织中的个人。你可能需要主动寻找并邀请他们，因为大多数人通常都很忙。确保不要依赖相同的人来审阅每个提案，以免给人一种除了这些人之外，其他人不受欢迎为联合治理做出贡献的印象。\n\
  \n审阅的主要目标应该是验证所提议的解决方案、审核任何原型、识别任何遗漏的考虑因素，并评估所涉工作的边界。审阅可能导致提案被拒绝——要么退回给创建者进行额外工作，要么由于其他无法克服的问题而直接被拒绝。通过审阅的提案将需要最后一步——规划和执行实施工作。\n\
  \n### 4. 实施提案\n\n被接受的提案接下来必须转换为详细的工作项。将提案分解为增量步骤，以构建、测试、部署和验证你的数据网格更改。使用你现有的工单系统来详细说明每个工作项，包括要完成的工作描述、成功的样子是什么，以及完成所需的时间和精力估计。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_100_0.png)\n\n实施提案与实施任何其他产品功能的过程相同。虽然你在数据网格之旅开始时可能可以避免配备自助数据平台产品经理，但你会发现，这是完成工作的必不可少角色。\n\
  \n你还需要找人来完成工作！取决于你的组织，你可能已经选择指派一人或多人来实施数据网格平台工单。或者，你可以要求提案创建者提供完成工作所需的人时，因为他们很可能是对该解决方案最熟悉的人。\n\
  \n无论你选择如何实施工作，都要专注于在合理的时间内将迭代改进投入使用。和其他任何产品一样，你的数据网格本身需要帮助你的同事解决数据访问、使用和发布问题。如果你未能建立对数据网格平台的信心，人们将根本不会使用它，而是诉诸于他们自己的临时数据访问机制。在这种情况下，你的数据网格将毫无用处，纯属浪费时间。\n\
  \n### 5. 存档提案\n\n将所有已接受和已拒绝的提案，以及关于其讨论的笔记（或录制的视频），保存在一个常用的可访问位置，例如云端文件驱动器。人们应该能够查询提案以查看其状态，以及哪些已被接受或拒绝，以及原因。透明度至关重要，因为它提供了记录某项技术或决策被采用或未被采用的原因。\n\
  \n存档提案还可以消除一些运营复杂性。你可以搜索现有提案，看看是否之前已经提出过类似的内容，以及如果有，结果如何。最初不采用某事的理由可能不再适用，因此值得用新提案重新审视。\n\
  \n在下一节中，我们将探讨安全性和访问控制。这两者对于建立可靠的所有权和安全框架，以及防止未经授权的访问和意外修改彼此的数据产品，都是必不可少的。\n\n##\
  \ 数据安全性和访问策略\n\n你的数据网格的安全性和访问实践在很大程度上取决于你业务的法律和业务要求。例如，银行的安全性和访问控制要求将远高于匿名留言板网站。由于这是一个庞大的研究领域，我们将假设你遵循“良好的安全实践”，而是专注于与制作和使用事件驱动数据产品相关的几个重要概念和技术。\n\
  \n纵深防御应该是你处理安全性和访问控制时的指导原则。没有单一的东西能保护你的数据免受未经授权的使用，无论是来自好意但未经授权的同事，还是来自外部入侵者。默认限制访问、强制对用户和服务进行身份验证，以及保护和加密私人、财务及其他敏感信息，每一项都有助于减少爆炸半径并减轻后果。\n\
  \n身份管理是数据安全性的基础组件，因为所有用户和服务权限都将与其关联。我们将在下一章中更详细地探讨这个主题，即第110页的“服务和用户身份”。目前，让我们调查一下你的治理团队可能选择在你的数据网格中实施和支持的几个最重要的安全原则。\n\
  \n### 默认禁用数据产品访问\n\n数据产品应仅供注册的使用者使用。如果你未注册为数据产品的使用者，则无法读取它。虽然这一原则引入了一道门槛，但与允许任何想要的人以只读方式读取数据产品相比，它迫使用户和服务注册为明确的使用者。我们需要知道谁在读取什么，以便任何更改和请求都能有效地上下游传达。\n\
  \n### 考虑端到端加密\n\n根据信息安全要求，你可能需要在将数据产品数据发布到事件代理之前对其进行加密。数据在事件代理中保持加密状态，防止对磁盘上的数据进行任何未经授权的后门访问。拥有分配的解密密钥的注册使用者可以本地消费和解密数据以供其自身使用。\n\
  \n简化数据加密和解密是自助平台的功能。但是，由治理团队来确定要求和支持的用例。\n\n端到端加密通常是处理敏感数据所必需的。在生产者端加密数据可以在事件的网络通信和数据存储期间提供额外安全性，并确保事件代理的云提供商无法以任何方式读取（或泄露）未加密的数据。此外，端到端充当纵深防御——有人可能会获得读取你的事件数据的权限，但如果没有解密密钥，就无法解码和使用原始数据。\n\
  \n图4-2展示了一个使用端到端加密的生产者和使用者客户端。生产者在将数据写入事件流之前对其进行了加密，并将密钥发布到了密钥管理服务（KMS）。想要读取数据产品的使用者必须从KMS获取解密密钥的访问权限，然后将其应用于从流中读取的每个事件。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_102_0.png)\n\n图4-2. 作为事件流提供的数据产品中端到端加密的实际运作\n\
  \nKMS为你提供了一个安全地创建、共享、存储和轮换密钥的机制。虽然你可以在没有正式自助数据平台支持的情况下开始，但如果最终使用大量加密，你很可能需要投资于简化此过程。\n\
  \n你可能并不总是需要加密整个事件——有时仅加密敏感字段就足够了。让我们来看看。\n\n### 字段级加密\n\n字段级加密为数据产品所有者提供了加密特定字段的能力，以便只有选定的使用者可以访问数据。可识别个人身份、账户和财务信息是字段级加密的常见用例。例如，在建模银行转账时，你可能会在用户和账户字段上使用字段级加密，但保持金额和日期时间字段未加密。拥有解密权限的使用者可以访问解密后的信息以结算账户余额，而没有解密权限的分析系统仍然可以跟踪一段时间内资金的流动情况，所有这些都来自同一个数据产品。表4-1显示了事件中电子邮件、用户和账户字段的加密情况。\n\
  \n\n\n\n## 表 4-1. 使用字段级加密部分加密事件\n\n| 字段名 | 原始事件 | 部分加密事件 |\n|---|---|---|\n| email\
  \ | adam@bellemare.com | n2Zl@p987NhB4.L0P |\n| user | abellemare | 9ajkpZp2kH |\n\
  | account | VD8675309 | OP1wW81Mx |\n| amount | $777.77 | $777.77 |\n| datetime\
  \ | 2022-02-22:22:22:22 | 2022-02-22:22:22:22 |\n\n您也可以选择使用格式保留加密来维护事件数据的格式。在此示例中，我们对\
  \ email、user 和 account 字段使用了格式保留加密——保持与原始字段相同的字母数字字符、间距和字符数，但不向没有解密权限的用户泄露任何 PII。\n\
  \n使用字段级加密的一个优势是，它允许对消费者进行更精细的访问控制。您的消费者只需为所需数据请求解密密钥，而不是为整个负载请求，从而减少意外泄露信息的潜在风险。\n\
  \n格式保留加密特别适用于事后对数据进行加密，因为您不需要与下游消费者重新协商架构。相比之下，使用非格式保留加密通常会导致畸形，例如将长银行账户 ID 转换为\
  \ 64 字符字符串，或将复杂嵌套对象加密为哈希字节数组。\n\n无论是端到端还是字段级加密，对敏感数据进行加密还可以帮助我们满足另一项重要的治理要求：被遗忘权和数据删除权。\n\
  \n## 数据隐私、被遗忘权和加密碎片化\n\n通用数据保护条例（GDPR）是（除其他事项外）一项要求谨慎处理、存储和删除数据的法律。它是您的组织可能需要遵守的法律约束的一个极好示例，以便守法经营。如果您打算创建有用数据产品的数据网格，那么您极有可能会涉及个人、账户和财务信息，这可能需要您采取额外步骤和预防措施来确保安全。\n\
  \nGDPR 第 17 条规定，个人有权要求删除其所有个人数据，且不得无故拖延。乍一看，这项规定似乎与数据网格的原则直接相悖：发布定义明确的数据产品，供其他团队和服务自行使用。事件驱动的数据产品似乎会进一步加剧这一问题，因为消费者会将数据读入其自身的本地数据存储和缓存中。\n\
  \n加密碎片化是一种您可以使用的技术，通过覆盖或删除加密密钥来确保数据变得不可用。简而言之，您允许最终用户完全控制何时删除其密钥，从而在密钥删除后使其数据在密码学上不可用。您可以将加密碎片化与任何形式的加密一起使用，包括端到端加密和字段级加密。\n\
  \n与此同时，加密数据产品的消费者只需联系中央 KMS 并请求访问解密密钥。只要消费者拥有正确的权限，解密密钥就会传回给他们，然后他们即可根据需要解密和处理数据。\n\
  \n为什么要这样做？我们难道不能只是在数据产品中筛选数据并直接删除它吗？那难道不是更安全吗？\n\n删除数据产品数据仍然是一个合理的选择；然而，有几个复杂因素使得加密和加密碎片化成为重要的考虑因素：\n\
  \n### 大量数据\n\n大量数据可能存储在备份、磁带驱动器、冷云存储以及其他昂贵且访问缓慢的介质中。读取所有历史数据、选择性删除记录，然后将其写回存储，可能非常昂贵且极其耗时。加密碎片化使您可以避免在组织中搜索每一段旧数据。\n\
  \n### 部分加密数据仍然有用\n\n仅删除用户的 PII 通常就足以满足 GDPR 第 17 条的要求。事件中剩余的数据对某些消费者用例（例如构建分析聚合）仍然可能有用。我们可以保留剩余数据，并仍能从中获得有限的收益。\n\
  \n### 多系统中的数据\n\n删除解密密钥会同时使所有消费者服务中的所有数据访问失效。我们无需担心数据何时被删除，尤其是对于数据删除速度较慢的系统。\n\n\
  ### 进一步的纵深防御\n\n加密碎片化为防止数据安全事件提供了额外的安全层。泄露加密数据的危害远小于泄露未加密数据，并有助于降低数据安全漏洞的风险和影响。\n\
  \n加密碎片化无法保护您免受那些疏忽地存储解密数据或解密密钥的消费者的威胁。您可以通过确保消费者遵循清晰简单的信息安全政策来应对这一问题，例如仅保留解密密钥 10\
  \ 分钟，然后删除它们并需要从 KMS 再次请求。您还可以使用访问控制列表来跟踪哪些服务请求数据解密访问权限，以便您的信息安全团队可以审计其合规性。\n\n保护和处理数据的规则和法规是治理团队职责的主要组成部分。这些问题对组织的可行性和生存至关重要，不能留给单个数据产品所有者临时实施。请确保您和您的联邦治理团队对处理数据的法律和业务要求有扎实的了解，以便您能够指导自助服务数据平台的安全要求。\n\
  \n下一个相关组件是数据产品血缘。虽然访问控制和加密有助于满足法律数据处理要求，但了解数据产品的所有上游和下游依赖关系很重要。让我们更深入地了解血缘，看看它如何改进我们的数据网格。\n\
  \n## 数据产品血缘\n\n血缘允许我们跟踪哪些服务正在读取和写入数据产品，包括消费者客户端是否正在主动读取流。基本读/写权限，以及客户端身份，为我们提供了可用于跟踪依赖关系和血缘的相当清晰的图景。我们可以确定哪些系统和用户可以或不可以访问敏感数据，以及数据在从一个客户端和产品传输到下一个客户端和产品时所经过的路由和路径。\n\
  \n对于由开源 Apache Kafka 支持的事件驱动型数据网格，访问控制是在事件代理本身上建立的。许多 SaaS 提供商还以基于角色的访问控制（RBAC）的形式提供更高级别的功能，让您可以根据规则和角色构成角色。无论哪种情况，权限对于跟踪和构建血缘都是必不可少的。\n\
  \n在实现时需要考虑的数据血缘主要有两种类型。第一种是基于拓扑的血缘，它显示服务和数据产品之间在某个时间点的依赖关系。第二种是基于记录的血缘，它跟踪记录通过服务的传播。让我们逐一查看。\n\
  \n## 基于拓扑的血缘\n\n基于拓扑的血缘以图形形式显示数据产品及其消费者之间的依赖关系，箭头从数据产品指向注册的消费者。新数据产品会显示为图上的节点，数据产品的消费者也是如此。图形可能会显示哪些客户端正在主动消费事件、消费速率、它们是否是最新的，或者它们是否正在重播历史数据。还可以将服务和数据产品信息及元数据添加到拓扑中，为潜在的数据网格用户提供另一种发现模式。\n\
  \n基于拓扑的血缘相对容易获得，因为权限和客户端身份对信息安全来说已经是必不可少的，并且坦率地说，到处都是良好的做法。您甚至可以通过将客户端身份和权限导出到文件中，然后使用所选的图形框架将其重建为图形来自行构建。\n\
  \n当今绝大多数血缘工具都专注于基于拓扑的血缘，通常提供一个吸引人且可交互的图形，您可以单击以查看其他信息，例如上游和下游依赖关系。虽然许多工具只能提供当前的拓扑，但其他工具已开始推出时间点血缘，让您可以查看和下载特定时间点的血缘。\n\
  \n基于拓扑的血缘有助于跟踪哪些消费者访问了哪些数据产品。如果产品中出现错误数据，您还可以检测哪些下游消费者可能受到影响，以便开始采取补救措施。最后，数据产品所有者可以简单查询血缘图，了解谁在消费其数据产品，以便与他们协调即将发生的更改。\n\
  \n## 基于记录的血缘\n\n基于记录的血缘专注于跟踪单个记录的历史记录，记录它去过的所有地方、处理它的系统以及它可能相关的任何派生事件。基于记录的血缘应为审计员提供事件生命周期的全面历史记录，以便进行进一步调查。基于记录的血缘实现起来要复杂得多，因为需要考虑许多特殊情况。基于记录的血缘可以与基于拓扑的血缘结合使用，尽管它倾向于两者中实现较少的一种。\n\
  \n一种简单的实现选项是记录事件从数据产品到消费者的全过程进度。在其旅程的每个阶段，都会将唯一服务 ID、处理时间和任何其他必要元数据附加到记录，通常\n\n\n\
  在标题中。然而，基于记录的血缘在规模上实现往往要困难得多，因为存在几个主要的复杂因素：\n\n### 同一事件的多个消费者\n\n一条记录可以被许多不同的用户消费，导致同一事件的多个副本，每个副本都有自己的血缘。\n\
  \n### 并非所有消费者都会发出事件\n\n一些消费者不发出事件，而可能通过 REST API 提供对数据的访问。他们需要采取额外步骤来创建他们已摄取的哪些记录的日志，并确保数据可供查询。\n\
  \n### 聚合和连接事件\n\n聚合可能由大量事件组成，使得跟踪与其组成相关的所有记录不切实际。连接也是如此，尽管在实践中，连接通常只涉及少量事件。\n\n\
  ### 复杂转换\n\n消费者可能有相当复杂的用例，其中输入事件无法轻松映射到输出。\n\n将记录血缘存储在记录中的一种替代方案是改用外部数据库。每个服务必须向端点报告其已消费、处理和发出的事件。当多个服务已消费和使用了数据产品时，此选项确实更容易跟踪记录使用情况，包括使用后不再发出新事件的情况。\n\
  \n然而，它并未解决与连接、聚合和复杂转换相关的问题，在记录级血缘中留下了潜在的缺口。此外，您还需要投资于客户端工具，以自动将每条记录的状态报告给中央服务，包括考虑缩放、宕机和客户端语言支持。\n\
  \n重要的是，您要考虑想要血缘的原因以及它旨在帮助解决的问题。血缘没有放之四海而皆准的解决方案。银行的血缘需求将远大于出售袜子的商店，因此您需要确保治理团队了解其自身组织的真实需求。存在可以概念性地解决本节讨论的问题的血缘解决方案，但它们需要时间和精力来实现——时间和精力可能最好花在别处。\n\
  \n如果您不清楚自己血缘解决方案旨在解决什么问题，就有构建完全无关之物的风险。您必须确定需要哪些审计以及系统面临哪些风险，然后提出详细建议，说明血缘解决方案如何帮助您满足需求。\n\
  \n## 摘要\n\n联邦治理涵盖广阔领域。\n\n数据网格需要一个治理团队来帮助为组织的各种技术、领域、数据模型和用例带来秩序。治理是一种高度社会化的承诺，需要与同事合作，为实施数据网格的障碍提出有效解决方案。作为治理团队的一部分，您将专注于识别共同的标准、框架、语言和工具，以帮助支持数据网格用例。\n\
  \n治理团队与技术领域专家合作，识别自助平台的改进领域。如果您希望组织中的每个人都遵守数据加密政策，那么将其默认集成到数据产品平台中，而不是留给每个团队自己实施，会容易得多。同样，治理团队确保数据网格的使用者的声音被听到，他们的投诉得到处理，并且成功故事被分享和典范化。\n\
  \n联邦治理还涉及跟踪数据使用情况，确保其符合法律要求和良好的信息安全实践。您需要强大的访问控制，以确定哪些系统和人员可以访问哪些数据，但您需要在确保团队在需要时能够访问大部分数据之间取得平衡。数据可能还需要加密（部分或全部），并且可能还需要无限期归档，这再次取决于您的数据处理要求。\n\
  \n最后，治理还涉及为自助平台的实施提供方向。治理团队及其技术专家应将自助平台功能编码化和简化，使用户容易做*正确的事*，难以做*错误的事*。我们将在下一章中更详细地探讨这一点。\n"
- "## 自助数据平台\n\n自助数据平台使所有网格用户能够轻松发现、使用、发布、管理和保护数据及数据产品。我们已经介绍了构成该平台的一些组件：用于提供事件流的事件代理、用于跟踪基本元数据的元数据存储以及用于管理数据产品访问的访问控制。在本章中，我们将从极简主义到理想状态，介绍自助平台的功能。\n\
  \n还有几个重要的总体问题有待解决：潜在消费者如何发现可用的数据产品？发现后，如何将它们插入现有的应用程序和分析中？如何在数据产品之上构建新应用程序？同样，数据产品发布者的工作流程是什么样的？他们如何管理数据产品并与客户实际通信？自助平台必须为每个这些问题提供简化的解决方案。\n\
  \n自助数据平台部分由组织中已使用的组件组成，部分由需要构建或购买的组件组成。例如，您可能已经拥有一个元数据目录，用于跟踪重要数据集，也可以用于跟踪数据产品元数据。您可能正在使用\
  \ Docker 镜像部署应用程序，在 Kubernetes 上运行它们，并使用基于云的监控服务进行监控。但是，您可能缺乏流处理框架、连接器系统和工作流程标准化来启动和运行数据网格。您拥有什么和缺少什么将因组织而异，因此最好关注核心需求以确定着手处理什么。\n\
  \n从本质上讲，数据网格自助平台只是将组织使用的各个组件和子平台粘合在一起的胶水代码。它简化了团队、人员和服务用于使数据网格成为现实的流程。虽然我意识到此描述可能有些模糊，但现实是，每个组织的数据网格都受到现有系统、流程、治理、人员、团队和技术的强烈影响。您的自助平台将独特于您的组织，但将共享本章将介绍的一些共同主题：身份、发现、身份验证、授权、管理、通信和计算。\n\
  \n在本章中，我们将介绍数据网格自助平台应具备的所有重要功能——并且我们将非常务实地进行。构建数据网格最重要的是能够获得短期收益来测试、尝试并重复什么有效、什么无效。为此，我们将数据网格的方法划分为三级成熟度模型，专注于迭代构建和改进自助功能，同时仍能产生实际业务价值。\n\
  \n### 自助平台成熟度模型\n\n自助平台有三个主要成熟度级别。\n\n我的一位同事经常将构建自助平台称为“边飞边造飞机”，并且充分理由：与软件领域的大多数事物一样，我们希望将其作为最小项目启动并运行，以便开始从中获取价值：\n\
  \n- 级别 1：最小可行平台（MVP）\n  定义了构建一个勉强可用平台所需的最小投资。此模型将帮助您从可用的数据产品中立即获取价值，同时提供获取反馈和规划迭代改进的机会。\n\
  \n- 级别 2：扩展平台（EP）\n  定义了一个更强大且具备生产能力的自助平台，修复了 MVP 的许多缺陷。数据网格用户操作更加简化并集成到平台中，以至于手动出错的空间大大减少。\n\
  \n- 级别 3：成熟平台（MP）\n  定义了完全开发并集成的平台。用户可以轻松发现、发布、管理、演进和删除数据产品。数据产品可以轻松为运营和分析应用程序提供动力。\n\
  \n这些成熟度级别并非金科玉律，您不需要在一个级别完成所有事情后再进入下一个级别。您自己的平台的构建和演化将类似于本章概述的内容，但将根据您的起始位置、业务需求和独特的治理要求而有所不同。\n\
  \n\n\n\n\n在以下各节中，我们将更详细地查看每个级别。我们将评估平台级别，识别优势和不足，并讨论如何逐步解决缺陷。\n\n在您收集反馈并观察用例时，您会发现需要投入更多资源的领域，这将引导您从一个级别进入下一个级别。专注于获得增量价值，并确保您添加的功能确实在解决用户面临的用例问题。数据网格自助服务平台只需由您决定其复杂程度即可——那么您能够接受的最小程度是什么？让我们来找出答案。\n\
  \n## Level 1: 最小可行平台\n\nMVP旨在成为您数据网格之旅的起点。MVP绝非理想实现——它仅包含实施核心数据网格原则所需的足够功能，并为用户提供一个快速粗糙但坚实的基础以获得实践经验。\n\
  \nMVP中的四个主要组件包括事件代理、模式注册表、元数据目录和连接器服务。事件代理的选择在第67页“选择事件代理”中已介绍，出于本章的目的，我们将考虑将Kafka作为首选代理。\n\
  \n让我们依次查看剩余的三个组件。\n\n### 模式注册表\n\n事件架构定义详细说明了事件的名称、类型、范围、必填字段、默认值和文档，类似于表架构详细说明关系型数据库表中的数据。第6章将更详细地介绍架构，但出于本章的目的，您可以将架构视为一种强类型数据定义，它为数据的生产者和消费者提供通用协议。示例5-1显示了一个简化的Person\
  \ Protobuf架构，详细说明了发布到事件流的Person对象的id、name和height。\n\n### 示例 5-1. 简化的Person Protobuf架构定义\n\
  \n```\nmessage Person {\n  int32 id = 1;\n  string name = 2;\n  int32 height = 3;\n\
  }\n```\n\n模式注册表是事件架构定义的存储库，它将每个架构映射到所属的事件流。它充当守门组件，防止不符合已注册架构的事件进入事件流，从而确保严格的数据质量。它还为用户提供API来查找事件流的架构，作为选择最适合其用途的数据产品过程的一部分。我们将在第143页“模式注册表的作用”中更详细地介绍模式注册表。目前，只需将模式注册表视为既是守门组件，又是提供轻松查找事件流数据产品架构的方式即可。\n\
  \nConfluent提供了一种常用且易于集成的针对Kafka的开源模式注册表，开箱即用即可提供所有这些功能。正如我们在第67页“选择事件代理”中讨论过的，轻松免费地访问社区构建的工具和服务，使实施和维护数据网格比在内部构建和维护自己的工具要容易得多。\n\
  \n接下来，让我们看看元数据目录。\n\n### 一个极其基础的元数据目录\n\n我们MVP平台的元数据目录是一个基于云的简单电子表格。注册数据产品只需填写事件流和架构的元数据即可。写入权限仅限于数据产品所有者，组织中的其他人均为只读。或者，仅允许团队负责人修改电子表格，以避免意外更改或删除。\n\
  \n表5-1展示了一个最小基础电子表格可能的样子。\n\n| 名称 | 主题 | 引导 URI | 所有者 | SLA | 质量 | 架构 URI | 描述 |\n\
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 销售 | gold_sales | k1.brk.kek:9093\
  \ | @bondolabs | 第1级 | 黄金 | ../gold_sales | 标准销售数据，包括已清洗的支付类型 |\n| 订单 | gold_orders\
  \ | k1.brk.kek:9093 | @smahmood | 第1级 | 黄金 | ../gold_orders | 标准订单数据，不含 PII |\n\
  | 页面浏览量 | page_views | x3.brk.wuu:9093 | @vsalamanca | 第3级 | 青铜 | ../page_views\
  \ | 从 Google Analytics 导入的页面浏览量指标 |\n\n名称表示数据产品名称，而主题和引导统一资源标识符（URI）的组合指示如何连接到由\
  \ Kafka 代理提供服务的事件流。所有者表示与数据产品所有者通信的 Slack 账号（或电子邮件地址）。SLA 和 Quality 只是治理团队强制要求的元数据类型的两个示例，如前面在第\
  \ 77 页“元数据标准和要求”中所述。架构 URI 提供指向模式注册表 API 的链接，该 API 为该事件流的架构生成人类可读的页面。最后，描述提供一段描述数据产品的可读文本，并解释元数据中可能缺失的任何上下文。\n\
  \n电子表格是开始传达有哪些数据产品、它们位于何处、其格式以及归谁所有的一种非常简单易行的方式。您也可以选择使用关系型数据库之类的工具，但考虑到产品处于这一阶段不需要编程\
  \ API，共享电子表格通常是开始的最快方式。\n\n接下来，让我们看看最后一个组件：连接器。\n\n### 连接器\n\n连接器允许您轻松地从数据库 *提取*\
  \ 数据并将其写入事件流。它们还允许您 *写入* 数据，即从事件流读取并写入目标数据库。各个连接器通常运行在分布式连接器框架之上，提供可扩展性、冗余性和资源隔离。连接框架通常作为事件代理的附加组件提供，例如\
  \ Kafka 和 Kafka Connect。\n\n连接器提供了一种构建数据产品的基本方法，使您能够从源数据库提取数据、对其进行转换，并将其沉入事件流。Kafka\
  \ 提供了大量连接器，使您能够从 MySQL、Postgres、Oracle、MongoDB、Microsoft SQL Server 和 DynamoDB（仅举几例）提取数据。类似于源连接器，匹配的沉连接器提供了一种简便方法，可将事件流中的数据写入您选择的数据库。您还可以编写自定义连接器来连接不常见或没有现成连接器的旧系统。\n\
  \n转换是选择和建模数据产品的重要组成部分，在本章随后介绍的更成熟的平台中，我们将评估一些更强大的选项。但对于我们的 MVP，我们可以使用内置转换组件来重塑并仅选择我们想要从源中获取的数据。Kafka\
  \ 的 *单消息转换* 允许您将开箱即用的转换串联起来，以最小的努力过滤、修改和转换数据。与自定义连接器代码一样，如果没有现有转换符合您的需求，您也可以实现自己的自定义转换。\n\
  \n我们将在第 8 章稍后详细介绍如何使用连接器从现有系统引导数据。目前，让我们总结一下这个 MVP。\n\n### Level 1 总结：它是如何工作的？\n\
  \n图 5-1 说明了 MVP 的四个主要组件以及基本的注册和使用工作流。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_115_0.png)\n\
  \n图 5-1. 用于驱动事件驱动型数据网格的最小可行自助服务平台\n\n数据产品所有者创建一个源连接器 (1)，并授予其对其团队数据库中特定表的读取权限。连接器启动，读取表架构，并自动创建一个架构\
  \ (2) 以注册到模式注册表。接下来，连接器增量读取源表行，并自动将其转换为与已注册架构匹配的事件。然后将事件写入与该表关联的事件流 (3)。\n\n数据产品所有者随后可以选择将事件流注册为数据产品\
  \ (4)。使用其写入权限，他们将治理要求的元数据添加到电子表格中，将自己标记为该产品的所有者，并完成任何其他必填字段。他们还将电子表格中的元数据链接到事件代理中存储的架构的\
  \ URL (5)。模式注册表不仅用于序列化和反序列化事件，还用于人类用户的数据发现，以回答“此事件流中的数据格式是什么？”这一问题。\n\n\n\n\n\n\
  最后，潜在消费者可以发现元数据电子表格中有哪些数据产品可用，并选择其用例所需的产品。然后他们可以创建一个新的接收器连接器将数据写入自己的数据库（6a），或者仅使用\
  \ Kafka Streams 或 Flink 等流处理框架原生消费数据（6b）。\n\nMVP 自助数据平台使您无需过度投资于可能不需要的工具、系统或流程，即可轻松开始实践数据网格。您可以开始实践发布数据产品，以及争论和协商角色和职责、元数据要求、服务级别、连接接口和架构类型。您将体会到数据网格带来的社会变革，并识别出哪些人和团队接受变革，哪些人和团队将面临更大困难。\n\
  \n在开始使用自助平台时，最重要的是内化并践行“你用不着它”原则。根据您和团队成员遇到的痛点，按需构建新功能。向联邦治理团队表达您遇到的问题，以便共同决定自助平台下一组功能和改进。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_116_0.png)\n\n> 在构建数据网格 MVP 时，专注于解决一系列主要痛点。然后您可以将成功的痛点解决作为建立对数据网格平台信任的方式，并收集那些可能有自己相关痛点的其他人的反馈。\n\
  \nMVP 存在一些不足之处，我们将在下一节中探讨解决方法。首先，由于注册是自愿的，元数据电子表格可能无法准确反映可用内容。其次，没有权限控制——任何人都可以读取或写入任何事件流，这是不良做法。第三，您无法真正知道谁在使用您的数据产品。第四，没有强制执行安全或数据质量标准。我们将探讨通过将自助平台进一步演进到\
  \ Level 2 和 Level 3 来解决这些问题。\n\n## Level 2：扩展平台\n\n扩展平台 (EP) 解决了 MVP 的若干不足，例如缺乏用户和服务身份、缺乏权限，以及一个不一定能反映现实的低成本数据目录。\n\
  \n最好将 EP 视为专注于两个主要成果。第一是让数据产品所有者和潜在数据产品消费者更容易使用数据网格。对于数据产品所有者，这意味着使他们能够将其事件流发布为数据产品；而对于消费者，这意味着让他们轻松找到数据产品、注册为消费者，并设置所需的任何连接器以将数据传入其自身服务空间。\n\
  \n第二个主要成果是实现基本的服务身份和控制。至少，服务需要唯一身份以分配权限。虽然看似简单，但我们还必须考虑自助平台通常跨越许多子平台组件——代码仓库、事件代理和计算资源，仅举三个常见的包含内容。\n\
  \n扩展平台的组件和功能包括：\n\n- 功能齐全的元数据目录\n- 数据产品管理服务和 UI\n- 服务和用户身份\n- 基本访问控制\n- 用于构建数据产品的流处理\n\
  \n首先与您的基础设施和平台工程人员交谈。您需要弄清楚如何利用现有系统和工具用于数据网格自助平台。您的工程团队可能已经有构建、容器化、测试、部署和监控应用程序的流程。不要重复造轮子——复制他们已有的内容来构建和部署数据产品，并根据需要进行调整。\n\
  \n首先，让我们看看如何用更强大、更有用的东西来改进这个共享电子表格“数据目录”。\n\n## 功能齐全的元数据目录\n\n首要任务是用合适的数据目录取代电子表格。\n\
  \n可供选择的选项很多。流行的开源软件 (OSS) 项目包括 Apache Atlas 和 Amundsen，仅举我在数据网格实现中成功使用过的两个例子。虽然您也可以使用关系数据库来建模和构建自己的数据目录，但这些现成的专用数据目录产品包含自己的发现\
  \ UI、格式良好的 API 以及发布、搜索和建模功能。\n\n功能齐全的元数据目录的一些重要功能包括：\n\n### 元数据建模\n\n除数据产品元数据外，您还可以为人员、团队、应用程序、事件代理和连接器创建元数据。您还可以为这些元素之间的关系创建元数据模型，从而形成一个可遍历的关系图。\n\
  \n### 搜索功能\n\n数据目录还可以提供搜索功能，以供您查询元数据条目。根据您选择的数据目录，除了基本字符串匹配外，您可能还可以使用 SQL 或类似 SQL\
  \ 的查询功能。搜索功能是使平台自助化的必要组成部分，因此在投资之前请确保已评估目录的功能。\n\n### 通过图遍历进行依赖项识别\n\n通过图遍历识别上游和下游依赖项对于验证数据网格的完整性非常重要。例如，在添加新的依赖数据产品或消费者应用程序时，您可以验证所有上游数据产品和服务是否满足最低服务级别，从而不违反您自己的\
  \ SLA。同样，您可以使用相同的图形功能来识别数据的所有现有消费者，以便您可以通知他们即将发生的变化。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_118_0.png)\n\
  \n数据目录往往会长期过时，通常是因为它们被当作文档来对待——事后更新，如果有人记得做的话。数据目录成为创建、发现和使用数据产品的运营工作流一部分至关重要，随着新产品的创建、删除和订阅而自动更新。\n\
  \n一旦您选择了新的功能齐全的数据目录，下一步就是确保其正确集成到数据产品管理工作流中。您可以通过保持其最新所需的手动交互量来衡量数据目录集成的成功程度，零手动交互是成功的指标。您的数据目录应仅通过数据产品管理服务来填充和更改。我们将在下一节中更详细地探讨这一点。\n\
  \n## 数据产品管理服务和 UI\n\nMVP 中的 UI 不存在。数据网格用户必须创建他们的数据产品，手动将其添加到电子表格中，并希望其他人遵循相同的规则。很可能有人会跳过填写强制性元数据，意外删除他人的条目，或者不正式注册数据产品。毕竟，即使数据不在电子表格中，您仍然可以使用它！\n\
  \n获得数据产品 UI 的最简单方法是使用已包含 UI 和搜索元素的数据目录。如果它还包含一种设置细粒度权限的方法，以便大多数用户仅具有只读权限，则更好（下一节将详细介绍）。但是，如果您决定自行设计\
  \ UI，您需要考虑消费者如何浏览和搜索可用数据产品以及管理自己的数据产品。它必须支持的基本操作包括：\n\n### 浏览数据产品\n\n用户需要浏览现有数据产品以查看可用内容。图\
  \ 5-2 显示了 UI 的示例，包括名称、描述和一些元数据相关信息。单击数据产品将提供有关该产品的更多信息。\n\n### 浏览流数据产品\n\n| 名称 |\
  \ 描述 | 领域 | |\n| :--- | :--- | :--- | :--- |\n| 客户订单-加拿大 | 来源于加拿大的订单 | ecom.customer.orders\
  \ | 查看 |\n| 客户订单 | 来源于美国的订单 | ecom.customer.orders | 查看 |\n| 物品库存 | 全球物品库存 | ecom.inventory\
  \ | 查看 |\n\n图 5-2. 数据产品浏览 UI，包括域信息、已注册消费者列表和元数据\n\n### 查看数据产品信息\n\n每个数据产品都应有一个详细页面，展示完整的数据范围，包括所有者、描述、架构、数字位置以及治理团队认为相关的任何其他信息。图\
  \ 5-3 显示查看数据产品时您可能会看到的信息。请注意，有一些按钮可启用自助操作，包括向现有消费者发送消息、向数据产品所有者发送消息以及请求注册为消费者。\n\
  \n\n\n\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_120_0.png)\n\n图 5-3. 数据网格用户可查看的数据产品信息\n\
  \n## 搜索门户\n\n搜索引擎支持对元数据、架构、描述和文档进行查询。图 5-4 显示了一个示例搜索界面，用户可以在其中指定关键字和要搜索的字段。您也可以选择直接暴露数据目录的搜索\
  \ API 作为低工作量的选项——只需提供一些查询示例，以确保您的消费者能够弄清楚如何使用它。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_120_1.png)\n\
  \n图 5-4. 用于搜索数据产品的搜索 UI\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_121_0.png)\n\
  \n新消费者能够自行注册的能力是自助服务能力的一项良好检验，因为它需要用户身份、应用程序服务账户以及事件流读写访问控制之间的集成。\n\n数据产品管理仍然是自助服务平台的第二大主要要求。用户必须能够识别可以发布的事件流，将其注册为数据产品，并弃用不再需要的任何数据产品：\n\
  \n### 识别候选数据产品\n\n系统必须向用户提供可注册的事件流列表。从语义上讲，这些是属于用户所属域或用户对其拥有某种管辖权的流。一种简单的选项是仅允许创建事件流的用户将其注册为数据产品。更高级的选项包括与事件代理的用户和组织账户集成（将在下一部分“服务和用户身份”中介绍，第\
  \ 123 页），这样只有属于拥有该流的团队或组的用户才能管理它。\n\n### 注册数据产品\n\n一旦数据产品所有者确定了想要作为数据产品发布的事件流，他们理想情况下可以点击一个大的“注册”按钮来启动注册流程。随后，他们应被提示输入联邦治理规定的强制性元数据，例如\
  \ Name、Owner、SLA、Quality 和 Description。其他属性应自动提取，例如底层流名称、事件代理地址、架构以及与权限和访问控制相关的元数据。\n\
  \n### 弃用和注销数据产品\n\n最终，可能需要移除某个数据产品。弃用会锁定数据产品，使只有现有消费者能够继续使用它，同时将其标记为已弃用并将其从搜索结果中隐藏。随后，数据产品所有者需负责为其当前用户提供弃用计划，包括迁移计划以及必须完成工作的时间表。您应确保只有没有现有注册消费者的已弃用数据产品才能被删除，以防意外删除对系统至关重要的数据产品。\n\
  \n图 5-5 展示了管理 UI 可能的外观。从顶部开始，您可以看到登录控制台的域和用户。在“未注册的流”标题下是可作为数据产品发布的候选项——目前只有一个，即名为\
  \ Ecom.Orders.USA 的流。这些流仅显示给活跃用户，因为它们与该流的所有权相关联。最后，当前已注册的两个数据产品显示在“已注册的数据产品”标题下，包含所有强制性元数据以及用于查看、更新和弃用它们的多个控件。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_122_0.png)\n\n图 5-5. 用于注册和注销数据产品的管理 UI\n\
  \n数据产品管理 UI 是数据网格中用于浏览、发现、管理、注册、弃用和移除数据产品的主要枢纽。构建数据管理服务时，有句话建议您牢记：首先专注于数据产品消费者的需求，例如发现功能，因为当前和潜在消费者将构成自助服务平台用户最大的群体。如果您注册数据产品的流程还稍显简陋，那也没关系，因为您使用和发现数据产品的频率将远高于发布新数据产品的频率。\n\
  \n在下一节中，我们将回答：如何知道谁拥有数据产品？或者哪些服务可能正在请求访问权限？\n\n## 服务和用户身份\n\n身份识别是管理和跟踪数据网格中数据访问的重要组成部分。对于数据产品，了解所有者是谁以及哪些服务正在使用它非常重要。同样，了解数据产品本身的上游依赖关系也很重要。身份构成了数据产品所有权的基础，并简化了发布控制、访问请求和依赖跟踪，如本节后面所述。但首先，以下是我们将在接下来的几个部分中回顾的几个概念：\n\
  \n### 主体\n\n主体是标识用户或服务的唯一字符串。例如，Google 使用电子邮件地址作为服务账户主体，而遵循 RFC1779 的安全套接字层 (SSL)\
  \ 证书主体格式类似于 CN=Common Name,O=Organization,L=Location,ST=State,C=Country。无论格式如何，唯一性及其与服务或用户的关联都是必不可少的。\n\
  \n### 用户账户\n\n用户账户代表人类用户。这类账户通常用于登录系统并访问分配给用户的资源。\n\n### 组织账户\n\n代表组织的账户。例如，GitHub\
  \ 提供组织账户，以便将项目、存储库和软件包的所有权分配给一个组，而不是单个用户。Confluent Cloud 和 Google Cloud 也有各自的组织账户版本，允许对用户、服务和其他资源进行更细致的组织。\n\
  \n### 服务账户\n\n专门为代表服务而创建的账户。应用程序使用服务账户来访问资源、连接到 API 并访问事件流。每个数据产品都会分配一个服务账户，用于创建数据产品的应用程序以及存储数据的事件流。\n\
  \n创建自助服务平台需要面对统一下层子平台中多个服务账户和用户账户的挑战。\n\n图 5-6 展示了构建数据网格时可选用的仅三个子平台示例：GitHub/GitLab、Google\
  \ Cloud 和 Confluent Cloud。这些平台各自拥有一套用户账户和组织账户，以及适用于 Google 和 Confluent 的服务账户。结果是，每项服务（无论是云服务还是其他）最终都会拥有自己的用户和服务账户集，以及管理资源、权限和成员身份的相似但不同的方式。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_124_0.png)\n\n图 5-6. 在数据网格中为每个子平台管理单独的账户和资源是一项具有挑战性的工作\n\
  \nSales 数据产品位于 SalesDP 仓库中，属于 BrawnDO Labs 组织的一部分。随后，该项目会（例如）使用 Kubernetes 平台在 Google\
  \ Cloud 中编译和部署。托管数据产品应用程序代码的 Kubernetes pod 在 sales-dp@brawnolabs.gcp Kubernetes\
  \ 特定服务账户下运行。此外，Sales 数据产品中的代码需要拥有自己的凭据集以访问 sales-dp.cc Confluent Cloud 服务账户，从而能够成功将数据写入其事件流。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_124_1.png)\n\n> 构建数据网格最具挑战性的部分之一，是将各种身份机制、用户账户、服务账户和组织集成到一个精简的自助服务解决方案中。您尝试支持的技术、平台和服务类型越多，您的体验就会越复杂、越具挑战性。\n\
  \n针对 EP 解决方案，请确保您已创建并正在使用用户账户、服务账户和组织。服务应与服务账户保持 1:1 映射。用户应映射到组织，这些组织允许他们仅访问其参与的数据产品和服务。让我们来看看基本访问控制包含哪些内容。\n\
  \n\n\n\n\n## 基本访问控制\n\n访问控制建立在数据网格中服务和用户身份实现的基础上。正如每个子平台都有其自身身份的概念和边界一样，每个平台也都有其控制访问和授予权限的方式。图\
  \ 5-7 展示了您需要考虑的用户和服务访问控制类型的一小部分示例，延续 GitHub/GitLab、Google Cloud（GCP）和 Confluent\
  \ Cloud 的示例。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_125_0.png)\n\n图 5-7. 每个子平台都有与其自身用户和服务身份相关的一组权限\n\
  \n访问密钥是向用户和服务帐户授予权限的常见方式。管理员生成访问密钥和密钥，它们实际上充当用户名和密码，满足身份需求。\n\n接下来，管理员在各自平台内为每个访问密钥帐户授予权限。在\
  \ GitHub、GCP 和 Confluent Cloud 示例中，用户需要获得推送提交到 GitHub 并将其编译并部署到 GCP 中 Kubernetes\
  \ 应用程序的访问权限。同时，与应用程序关联的服务帐户需要某些 Kubernetes 和 GCP API 权限来运行应用程序，以及 Confluent Cloud\
  \ 权限来创建主题、写入事件、更新架构以及更新任何其他元数据。\n\n虽然让人工参与分配和管理服务帐户及权限可能有点繁琐，但在数据网格演进的这个阶段，这仍然是您的最佳选择。您应该致力于保持流程灵活，开销低。例如，只需打开一个工单，将其分配给管理员，然后在公司的基于频道的即时通讯应用中友好地提醒他们。\n\
  \n> 嗨，Seedle！\n> 您能否将以下 Kafka 权限添加到我们的微服务？\n> \n> - 服务名称：ShippableOrdersResolver\n\
  >   - 主题名称：Shopping.Orders.v1\n>     - 权限：read, describe\n>   - 主题名称：Shopping.Payments.v2\n\
  >     - 权限：read, describe\n>   - 主题名称：Sales.ShippableOrders.v1\n>     - 权限：write,\
  \ describe\n> \n> 谢谢！\n\n工单将为您提供最少量的审计，明确谁请求了权限、谁授予了权限以及何时发生。您还可以避免在自助服务平台内所有子平台之间完全自动化权限管理编排的问题。这可以留到以后，等您更好地理解数据网格技术栈和用户需求时再处理。\n\
  \n但现在，让我们回到谈论这些密钥的话题。虽然*您*可以将它们本地保存到自己的系统中用于个人使用（安全风险不谈），但对于容器化应用来说，不幸的是事情并不那么简单。相反，我们可以将密钥存储在专门构建的密钥存储中——例如\
  \ AWS KMS、Google KMS 或任何其他符合您云提供商要求的密钥管理存储。\n\n一旦您的密钥生成并安全地存储在 KMS 中，下一步就是将它们与容器化应用程序集成。一种常见的方式是在运行时将密钥注入容器中，这样任何其他系统都无法查看它们。但是，这需要仔细的设置和配置，并且存在意外泄露密钥的风险。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_127_0.png)\n\n将密钥作为身份验证和访问控制的主要方式存在许多安全风险，尤其是在存储密钥和正确限制访问方面。我建议您读一本现代服务安全方面的书来了解新的最佳实践，因为这些内容都远远超出了本书的范围。\n\
  \n访问密钥只是管理权限的一种方式；我们将在第 3 级探讨一种更强大的选项。由于权限与身份紧密相关，在跨越多个子平台和服务时，很难获得端到端权限的简单视图。我不会对此步骤描绘一幅美好的图景——将多个平台的权限和身份编排和简化为一个统一的身份系统是困难的。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_127_1.png)\n\n您可以允许用户自由地将其服务注册为事件流消费者，而无需安全检查，除非流中包含\
  \ PII、财务或其他敏感数据。如果需要权限，您可以让消费者提交工单（人工介入），或者让他们在授予访问权限之前经过明确的条款和条件确认。请与您的治理团队商讨应如何继续。\n\
  \n## 构建数据产品的流处理\n\n对于 MVP，我们依赖连接器来完成简单流转换的大部分处理工作——例如屏蔽敏感信息或将数据从一种格式转换为另一种格式。但现实是，您将需要更强大的流处理器来构建功能齐全的事件驱动数据产品。例如，您需要能够维护状态并聚合事件来构建聚合对齐的数据产品（参见第\
  \ 33 页的“三种数据产品对齐类型”）。您还需要将流连接在一起以构成消费者对齐的数据产品，因为数据通常来自业务的不同部分，并且在许多用例中需要进行协调。\n\n\
  流行的流处理框架包括 Kafka Streams、Apache Flink 和 Apache Spark Structured Streaming 等。每个框架都提供广泛的高阶流处理功能，用于构建、使用和消费事件驱动的数据产品，并将完全适合您自己的数据网格需求。除了确定要使用的技术外，您还需要确定如何运行它并将其与您自己的应用程序运营集成。您的选择实际上归结为“我是自己管理它？”还是“我依赖云服务提供商来为我管理它？”最重要的是，无论您选择何种技术，都要让团队成员轻松地创建、运行和管理代码，以构建和使用数据产品。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_128_0.png)\n\n构建事件驱动数据产品不一定需要使用流处理框架——一个基本的事件生产应用程序也可以正常工作。但是，如果没有事件驱动处理框架，您可能会发现使用事件流数据产品更加困难，例如将流连接在一起和构建复杂的事件驱动状态机等任务。\n\
  \n在内部（或在您自己的云中）运行自己的技术相当不言而喻。关于这个主题有大量信息，因此我将留给您自己去弄清楚如何自行托管流处理框架。但是，您应该认真研究云服务提供商，了解他们提供什么以及他们如何减少您构建和运行数据网格的工作量。云服务提供商在现代架构中扮演着越来越重要的角色，其最重要的贡献在于减少完成工作所需的繁琐劳动和开销。\n\
  \n流处理器既功能强大又复杂，运行起来也不容易。例如，Apache Spark Notebook 多年来一直是进行大数据分析工作的常见方式；分析人员只需将代码写入笔记本并原样部署——就像容器化应用程序一样。Databricks（由\
  \ Apache Spark 的创建者创立）最早承担的价值主张之一是减少管理 Spark 集群和部署数据处理应用程序的繁琐工作。相反，重点是让用户轻松地编写、测试、部署和监控笔记本——这正是我们希望在自己的事件驱动数据网格中具备的特性。\n\
  \n在事件驱动的世界中，我们会遇到许多其他问题：我们不仅需要流处理框架，还需要运行托管和提供所有流的事件代理。像 Confluent 这样的云服务提供商不仅消除了所有流处理开销，还负责所有事件代理和数据存储的扩展，并提供数据目录、托管连接器、身份管理和访问控制。\n\
  \n托管流处理让您创建持久的流式查询来重构、连接、聚合和重塑事件，从而让您从其他流中创建新的数据产品。您只需编写代码、启动作业，云服务就会处理其余部分——随着负载变化进行上下扩展，并在发生故障或异常时恢复。\n\
  \n当然，还有许多其他云服务提供商提供广泛的替代技术和功能。您需要根据自己组织的需求，确定哪些最适合您。\n\n云计算为您的数据网格之旅奠定了基础。您无需专注于托管、监控和调优常用技术，只需将其外包\n\
  \n\n\n专注于从数据本身中获取价值，构建数据产品，并学习使用云平台。您将更早地获得关于什么有效、什么无效的反馈，如果发现初始选择不合适，可以更换技术选型，而无需在基础设施和运维上投入过多。您的主要目标应该是在过度投资之前\
  \ _尝试不同方案_ 以找出什么有效。之后随时可以优化；目前，您正在尝试找出什么有效、什么无效。云计算使这项任务变得容易得多。\n\n第 2 级就讲到这里了。让我们回顾一下所学内容，并了解它们如何协同工作。\n\
  \n## 第 2 级总结：它是如何协同工作的？\n\nEP 旨在解决 MVP 在服务和用户身份方面的不足。它还基于功能齐全的数据目录，提供了改进数据产品管理和发现的手段。\n\
  \n集中式数据产品管理服务和 UI 构成了面向用户控件的基础。用户可以发现已发布的数据产品，查看元数据，并决定哪些数据产品满足其自身服务的用例。管理服务将事件代理、元数据目录、架构注册表和子平台整合为一体，打造自助式体验。自助式\
  \ UI 体现了构建数据网格的以消费者为中心的特点：使用户能够轻松查找和使用数据产品。\n\n然而，创建数据产品所需的代码和计算能力仍不在迄今为止所涵盖的范围内。我们提到过可以使用\
  \ GitHub、Confluent Cloud 和 Kubernetes 等服务分别存储代码、托管事件流以及提供通用计算，但尚未将这些服务集成到我们功能完备的自助式平台中。\n\
  \n自助式平台也远未实现完全自动化。仍需人工参与平台请求的日常服务工作。管理员需要手动为服务和用户管理角色、账户和权限。\n\n进入第 3 级相当困难，如同所有数据网格相关工作一样，只有在第\
  \ 2 级的痛点超过了自助式平台的投资成本时才应尝试。在下一节中，我们将探讨完全成熟平台的功能。\n\n## 第 3 级：成熟平台\n\n成熟平台（MP）是将身份、服务、流程和数据产品整合为一套精简操作的最终形态。它高度依赖于跨多种服务、平台和技术实施身份、访问控制和工作流。MP\
  \ 致力于减少早期自助式平台中遇到的手动步骤和重复性开销，并为日常操作强化和精简一组选定的数据网格操作。\n\n例如，使用 Kafka Streams 创建数据产品消费者应用可能是您业务的主要用例。因此，您可以从自助式\
  \ UI 的单个按钮中精简 Git 仓库、Docker 容器和仓库存储、Kubernetes 任务、测试、编译和部署流水线，以及监控、权限分配和服务所有权等所有内容的创建。如果听起来工作量很大，没错，确实如此！但随着您的数据网格需求增长，您对通过投资新功能来精简其使用的需求也会随之增长。\n\
  \nMP 更多是一个目标，而非实际终点。如果您发现功能较少、自动化和精简程度较低的简单平台运行良好，那很好！继续使用它，直到发现它无法满足您的需求。将多种服务、跨平台身份管理、团队、人员和系统整合到一个集中式控制面板中相当困难。请记住，有些云服务提供商花费了大量时间才使其运作正常。如果您觉得具有挑战性，那是有充分理由的。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_130_0.png)\n\n> 您很可能需要使用像 Terraform 这样的基础设施即代码解决方案来帮助管理数据网格的基础设施组件。Terraform\
  \ 是领先的基础设施管理解决方案之一，可以在许多云提供商、SaaS 解决方案和平台之间集成“整合”操作。\n\n实施成熟平台功能所带来的最大收益是效率。普通用户将更轻松地创建、发布、管理和使用数据产品。您将遇到更少的事件和停机、数据质量问题以及影响最终用户的数据不一致。您可以预期查找和使用数据的开销将大幅降低，正如前面在第\
  \ 17 页“糟糕的数据：不行动的代价”中讨论的那样。\n\n成熟平台的组件和功能包括：\n\n- 身份验证、识别和访问管理\n- 与现有应用交付流程集成\n\
  - 以编程方式管理数据产品的 API\n- 监控和告警\n- 多区域和多云数据产品\n\n首先，让我们看看如何在自助式平台上标准化身份和访问管理。\n\n##\
  \ 身份验证、识别和访问管理\n\n身份验证、识别和访问管理（IAM）本身是一个广泛的领域，本章无法对其进行全面阐述。与身份验证和 IAM 相关的大量工作涉及将平台中各主要基础设施组件的各种身份、角色和权限整合在一起。例如，Kubernetes、Apache\
  \ Kafka 和 GitHub/GitLab 各自提供自己的身份管理系统，但仅限于其自身服务范围内。鉴于我们的数据产品由代码、数据和基础设施组成，我们需要找到一种方法（例如使用\
  \ Terraform）来弥补差距，并整合出统一的身份体验。\n\n但什么是身份验证，什么是授权？想象一下入住酒店时的情形。前台工作人员会通过要求您提供身份证或预订代码来\
  \ _验证身份_，以确保您是您所说的那个人。接着，他们会发给您一张房卡来 _授权_ 您进入房间——该房卡仅对该房间有效，并在退房时到期。授权和身份验证对于构建数据网格都至关重要，这些要求最好使用\
  \ OAuth2 及其配套的 OpenID Connect（OIDC）等标准框架来实现。\n\n幸运的是，这一问题的根源在很大程度上已随时间得到解决。我们可以遵循一些最佳实践，并利用现有技术作为构建自助式平台的起点。\n\
  \nOAuth2 是授权领域的领先行业协议之一。正如原始互联网工程任务组（IETF）规范中所述，“OAuth 2.0 授权框架使第三方应用程序能够获取对 HTTP\
  \ 服务的有限访问权限，无论是代表资源所有者协调资源所有者与 HTTP 服务之间的审批交互，还是允许第三方应用程序以自己的名义获取访问权限。”\n\nKubernetes、GitHub、GitLab\
  \ 和 Apache Kafka 均集成并支持 OAuth2，因此您可以很大程度上统一身份验证和授权控制。OAuth2 是一种相当常见的标准，因此您很可能发现将其扩展到您已在使用的其他云服务和平台很容易。\n\
  \nOAuth2 服务通过使用访问令牌提供授权。当一个应用程序想要与另一个应用程序通信时，它首先向 OAuth2 服务器请求访问令牌。请求应用程序向 OAuth2\
  \ 服务器标识自身，并根据业务规则和权限可能获得持有者令牌。然后，请求应用程序可以使用该持有者令牌，将其提交给最初想要连接的应用程序。\n\nOIDC 与 OAuth2\
  \ 协同工作，使得在不直接共享用户和服务凭据的情况下实现应用程序之间的数据共享成为可能。OIDC 通过主要关注身份验证而非授权来扩展 OAuth2。使用 OIDC\
  \ 对账户进行身份验证后，便会使用 OAuth2 规范进行授权。OAuth2 有助于缓解在数据网格中处理多个不同服务和框架时固有的主要问题，并允许您整合出一致的体验。\n\
  \n在 OAuth2 统一下，您的自助式用户将能够：\n\n- 在单一位置声明和管理用户及服务账户\n- 依赖 OAuth2 标准和工具与云服务提供商平台及应用集成\n\
  - 从单一位置管理大多数权限和访问控制\n- 将身份验证和授权作为构建和使用数据产品的强制步骤\n\n您还可以使用其他技术来实现类似目的；这只是一种选择。例如，安全断言标记语言（SAML）1.0\
  \ 于 2002 年发布，至今仍是一种常用的替代方案。无论如何，最终目标是一致的：统一并精简人员、系统和数据产品之间的身份管理和访问控制。\n\n接下来，让我们看看如何交付和部署数据产品。\n\
  \n## 与现有应用交付流程集成\n\n您很可能已经拥有某种现有的应用程序开发和部署流水线。有用且可持续的自助式数据平台应尽可能复用现有流水线。数据产品与其他任何应用程序非常相似，尤其与微服务、特别是事件驱动型微服务相似。事实上，如果将两者并排比较，您可能很难定义事件驱动型数据产品与事件驱动型微服务之间的区别：两者都使用代码、计算资源和内存，并将结果打包为通过事件流提供的数据。\n\
  \n由于您可能会构建多个数据产品，因此会遇到使用微服务时所面临的同样的开销——即微服务税。每个新的数据产品都需要一个 Git 仓库和一个构建流水线，\n\n\n\
  \n此外，还需提供一种方式来容器化编译后的应用程序，将其部署到计算资源（例如通过 Kubernetes），并对其进行扩缩容、监控和更新。\n\n无论您之前如何构建现有的应用交付流程，都需要评估如何利用它来部署数据产品。如果您拥有一个单体技术栈，且只有少量自定义构建和部署的服务，那么这很可能会相当具有挑战性。不过，如果您已经在运行多个服务，并拥有相对成熟的部署和管理流程，那么这可能会容易得多。\n\
  \n在第 114 页的“用于构建数据产品的流处理”中，我们探讨了一些使用流处理框架构建和使用数据产品的选项，特别是探讨了使用云服务而非自托管解决方案。如果您选择遵循云端路线，很可能能够利用其推荐的最佳实践来将数据产品应用交付到生产环境。您会发现，许多云服务商都简化了其首选“代码容器”的管理和部署，无论是\
  \ Docker 镜像、Notebooks 还是持续查询。无论您身处何地，我给您的建议始终如一：尝试寻找一家能为您提供轻松构建、测试、存储、部署和运行数据产品代码方式的云服务商。\n\
  \n## 以编程方式管理数据产品的 API\n\n数据产品管理 UI 已扩展，以提供一个与您的身份验证和授权服务集成的编程式 API。此功能的目的是提供一个用于自动化管理数据产品的\
  \ API，包括发布、更新、弃用和删除。该 API 很可能只是为支持自助服务 UI 的 API 的扩展，并扩展为向选择与其集成的任何工具和服务提供 API 访问权限。除了面向最终用户的直接用例之外，API\
  \ 的其他使用候选对象还包括部署流水线、监控系统和审计用例。\n\n让我们避免深入 API 规范的繁琐细节，专注于需要使用此 API 支持的领域：\n\n- **身份管理**\n\
  \  简化人类用户和服务帐户身份的创建与管理，对于协调所有候选数据产品的资源和权限分配至关重要。\n\n- **资源创建**\n  创建候选数据产品所需的所有资源都可以以应用程序的形式创建。资源包括服务身份、代码仓库、构建和部署流水线、Kubernetes\
  \ 资源、Kafka 主题、注册表主题和监控资源。需要为候选数据产品指定拥有相关访问权限的数据产品所有者。\n\n## 权限管理\n\n在创建候选数据产品时，需要指定一个人类所有者（或所有者团队）作为所有者。所有者将对数据产品操作拥有完全控制权，包括发布、授予读取权限、更新、弃用和删除数据产品。权限管理还可能需要与信息安全审查和控制集成，以确保遵循数据策略。\n\
  \n## 发布、弃用和删除数据产品\n\n数据产品生命周期的三个主要阶段包括：作为正式数据产品发布供他人使用、弃用以防止新用户使用它，以及删除以移除数据的所有可能用途。联邦治理团队需要指定在这些状态之间移动的要求，包括是否允许步骤回退（删除\
  \ → 弃用）以及弃用和删除之间的最小过渡时间。\n\n## 更新数据产品\n\n数据产品在其生命周期内可能会被更新。架构演进以适应消费者需求，仍然是事件驱动型数据产品中最常见的变更之一。其他更新包括对元数据的更改，例如降低\
  \ SLA 或在人员离职时更改数据产品所有者。可能会添加新标签，移除现有标签，并且基于法律要求的新信息安全法规可能会生效，从而更改对数据产品的权限访问模型。更新可能影响当前和潜在消费者，因此最好设置通知和消息传递系统以实现沟通。\n\
  \n## 破坏性变更流程\n\n传达即将发生的破坏性变更（例如对数据产品进行重大重构）需要建立明确的参与规则。数据产品所有者需要向消费者提供足够的预警，以便他们有时间了解影响、制定计划并做出反应。我们将在第\
  \ 140 页的“协商破坏性架构变更”中广泛介绍破坏性变更流程。\n\n## 消息传递\n\n自助服务平台用户应能够订阅关于数据产品的细粒度通知。当数据产品更新时，注册为数据产品消费者的服务帐户所属人员或团队应接收通知。理想情况下，数据产品所有者应向所有消费者发送即将发生的变更的通知，以便他们可以调查是否需要在其端采取行动。其他用户可能希望在新数据产品发布、弃用或删除时，或当现有数据产品的所有权变更为新人员或团队时接收通知。您很可能需要将消息传递\
  \ API 与企业即时通讯服务（例如 Slack 或 Microsoft Teams）或企业电子邮件服务器集成。请勿创建您自己的消息传递系统。\n\n## 搜索与发现\n\
  \n用户必须能够搜索可用的数据产品、人员、团队和服务，以了解数据网格中的情况。搜索功能通常可以由数据目录本身提供，但您需要向 API 用户传递足够的信息，以确保他们知道如何构建查询。发现很大程度上是简化搜索的一种功能——只需返回符合我条件的所有数据产品、人员、团队或服务。\n\
  \n关于 API 的决策应基于用户的需求，但最初将完全由 UI 的要求（“数据产品管理服务和 UI”，第 106 页）驱动。您可能会发现可以为 UI 和其他自动化用例复用同一\
  \ API，但可能需要进化部分功能并标准化接口。同样，应根据用户需求对其进行进化，且不要投资超出您即时需求的内容。\n\n## 监控与告警\n\n监控数据产品并针对异常行为发出告警，是构建可靠数据网格的必不可少的一环。在第\
  \ 77 页的“元数据标准和要求”中，我们使用分级系统为数据产品分配了 SLA：第 1 级意味着“立即起床修复”，而第 4 级意味着“可以等到我们有空闲时间再处理。”同样，我们分配了从青铜到黄金的分级质量评级。评级的具体定义并不像确保我们可以衡量质量和\
  \ SLA 以确保其满足要求那样重要。\n\n满足 SLA 的两个主要组成部分是更新频率以及自上一次事件写入数据产品以来的时间。写入频率越高，如果更新突然停止，就越可能存在问题。了解数据产品的更新频率非常重要，因为数据产品可能会快速更新，然后在数小时或数天内保持不变。智能告警服务可以基于历史模式进行训练，从而得出一个考虑周期性更新模式的自定义告警。\n\
  \n满足数据质量要求始于定义明确的架构，第 6 章将对此进行介绍。架构为数据产品的数据模型提供强类型和明确要求，并防止畸形数据进入事件流。然而，数据质量度量可以超出简单的类型检查，还可以包括验证字段内容（例如，验证数值\
  \ val-）等操作。\n\n\n\n值落在某个范围内、字符串格式正确，或数据落在预期分布中）。某些数据产品，例如涉及财务交易的数据产品，可能需要完美的数据质量——任何异常都是问题，且必须触发警报。其他数据产品，例如分析聚合，可能可以容忍一定范围内的意外值。可以通过创建专门构建的数据产品消费者来测量数据质量指标，该消费者读取流、将每个事件与预期值进行比较，并将任何异常值报告给监控系统。\n\
  \n像监控任何其他应用程序一样监控您的数据产品。您应确保构成数据产品的应用程序代码健康且拥有足够资源，事件流包含预期数据，并通过严格测试和直接数据分析来防范质量问题。\n\
  \n## 多区域和多云数据产品\n\n数据网格可能由多个区域中的多个云服务组成。例如，您可能拥有多个 Kafka 集群、多个 Kubernetes 部署和多个云存储桶。可扩展性要求通常在采用多个基础设施部署方面起重要作用，尽管数据本地性和区域法规也是重要考虑因素。在其他国家可能违法的业务活动（例如，大麻和酒精销售）相关的数据应保留在原始国家。同样，GDPR\
  \ 和数据隐私法律倾向于要求关于公民的数据也保留在原始国家。\n\n在自助服务平台级别应用治理控制，可以为允许和不允许的内容提供主要控制点。在构建您自己的多云部署时，需要考虑多个因素：\n\
  \n### 区域权限要求\n\n联合治理在确定数据产品可以访问和复制到的边界方面起着重要作用。例如，在美国运行的应用程序可能因法律限制而无法访问数据产品。同样，基于数据驻留限制，您可能无法将数据产品从一个区域复制到另一个区域。\n\
  \n### 简化的数据产品复制\n\n设置跨云或跨区域的数据产品复制可能具有挑战性。您不仅需要复制数据本身，还需要更新元数据以反映新的依赖项、新的云信息以及所有权权限（例如，谁拥有复制过程本身）。对于\
  \ Kafka 支持的事件流，您可以选择使用开源的 MirrorMaker 2.0。如果您需要精确的逐字节复制，包括偏移量、消费者组、权限和架构，则可能需要研究更强大的工具，例如\
  \ Confluent Replicator。\n\n### 增强的数据产品元数据\n\n您可以增强元数据以包含区域和云服务提供商限制及权限。例如，您可以限制将包含加密\
  \ PII 的数据产品复制到欧元区以外，以确保遵守 GDPR。同样，数据产品处理也需要保持在精选的允许云环境列表中的部署内（例如，可以使用 Azure 或 GCP，但不能使用\
  \ AWS）。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_137_0.png)\n\n云服务提供商可以让您轻松启动一个与生产环境镜像的完整专用环境。然后，您可以将生产级别的数据产品复制到新环境中，并在真实的生产数据产品上进行开发、QA\
  \ 或测试。完成后，只需删除环境即可。\n\n图 5-8 说明了数据产品源、专用复制器应用程序和目标集群的可视化拓扑。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_137_1.png)\n\
  \n图 5-8. 展示多区域数据产品复制拓扑的元数据\n\n您选择复制的内容和方式将取决于您组织的需求。然而，一个保持不变的关键方面是需要跟踪正在复制的内容、复制的所有者以及复制的目标。将此信息和这些依赖项作为自助服务平台元数据条目的一部分进行跟踪。\n\
  \n## 第 3 级总结：它是如何工作的？\n\n第 3 级平台的主要主题包括统一身份管理和简化的数据产品运营。要达到这一点需要投入大量工作，投资应仅由需求驱动，而不仅仅是为了挑战。与信息安全和限制对敏感信息的访问相关的治理要求，仍然是推动统一身份管理、身份验证和授权的最大动力。数据产品和事件驱动应用程序的广泛采用，推动了与仅仅创建数据产品并将其投入使用相关的所有开销的简化。\n\
  \n## 摘要\n\n您自助服务数据平台的确切演变将因组织而异，但将涉及本章中列出的所有功能。您可能会发现，在实现第 2 级的某个功能之前先实现了第 3 级的一个功能——这完全没问题。本章中提出的级别仅仅是平台随时间演变的粗略指南。\n\
  \n在创建自助服务平台时，您应遵循的指导原则是关注平台用户的用例：数据产品所有者和数据产品消费者，无论他们是数据分析师、数据科学家、应用程序开发人员还是任何其他职位。您希望专注于使同事能够满足自己的需求，而不让他们做不应该做的事情（例如删除他人的数据产品）。\n\
  \n如在第 1 级中所介绍，最小自助服务平台实际上非常小且精简，没有太多关于您可以或不可以做什么的护栏。但是，它是启动关于平台应如何变化的真实讨论的绝佳起点，区分其_必须_拥有的功能与锦上添花的功能，并将讨论集中在有用的迭代改进上。在构建平台的过程中，您会犯错。错误会发生。但弄清楚您独特的旧系统、技术选择、业务需求和队友技能组合如何与业务用例相关联，是开发过程的一部分。\n\
  \n尽可能专注于使用现成组件，不要重复造轮子。尽可能利用云服务，除非绝对必要，否则避免编写自定义内部工具。例如，使用 Kubernetes 而不是编写自己的云规模容器管理系统。使用\
  \ Apache Kafka 而不是编写自己的事件代理。使用 OAuth2 而不是编写自己的身份管理服务。使用 Terraform 来简化各种平台组件之间基础设施和服务资源的协调。自助服务平台的全部意义在于使访问和使用重要业务数据变得容易，这一点必须始终是您集中精力的指导原则。\n\
  \n过去几章深入探讨了数据网格的原因和方法以及事件流的关键作用。在下一章中，我们将关注事件架构，以及它们如何对定义数据产品生产者与其每个消费者之间的通用数据合同至关重要。\n"
- "## 事件架构\n\n定义良好的架构对于任何数据产品都至关重要。对于事件，架构由字段名称、类型、默认值和边界的显式声明组成，为人类和机器都提供了对数据内容的清晰认识。架构为数据产品生产者和消费者提供了对数据的清晰、共同理解。架构消除了歧义，支持发现和自助服务，并减少了使用数据的人误解数据的风险。\n\
  \n架构简化了数据发现和自助服务。您可以将文档嵌入架构本身，使数据定义和文档紧密耦合。代码生成器配合架构，可以生成适合消费者选择的编程语言的类和对象。同样，事件生成器可以使用架构生成与定义匹配的事件，为生成各种边界条件的测试数据提供了一种机制。\n\
  \n架构为随时间演变数据提供了框架，尽管您的架构演化选项取决于技术选择。使用架构演化的主要目的是在添加新业务需求以及领域转移和扩展时更新和更改数据，而不会不当地影响数据产品的消费者。\n\
  \n本章对事件驱动数据网格的架构进行了*规定性和主观性*的审视。有许多不同的架构技术和通过事件在系统之间传递数据的许多不同方式。然而，有些方法和技术比其他方法更好——它们更常见、更灵活，并且也反映了大多数企业使用和传递事件的方式。\n\
  \n\n\n\n\n## 序列化与反序列化简介\n\n在深入探讨架构之前，让我们退一步，更好地了解架构如何与通过数据产品提供重要业务数据相关联。为此，我们需要查看事件是如何创建、序列化并通过网络发送以存储在事件流中的。我们还将查看这一过程的逆过程，即事件从事件流中被消费、反序列化并由消费者处理。\n\
  \n序列化是将带有明确定义架构的事件对象转换为字节序列的操作。生产者内存中的表示被序列化（转换）为字节序列，以便可以轻松地通过网络发送并写入事件流。架构提供了确保数据可以转换为字节序列的约束。例如，一个指定名为\
  \ length 的字段必须是 Integer 的架构，在尝试将 length 设置为字符串值 \"six feet\" 时进行序列化会抛出异常。\n\n图 6-1\
  \ 显示了生产者将生产者语言对象转换为字节序列并将其写入事件流的工作流程。请注意，架构附加到序列化的事件上，这样消费者就可以获得一份用于反序列化的副本。我们有一些技巧可以消除随每个事件发送架构的需求，我们将在本章后面介绍。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_141_0.png)\n\n图 6-1. 生产者将事件对象序列化为字节并将其写入事件流\n\
  \n在事件流的另一端，消费者执行逆过程并将字节序列反序列化为对象。图 6-2 说明了消费、反序列化并将数据转换为可由消费者业务逻辑代码处理的事件表示的过程。\n\
  \n架构技术是事件驱动数据网格的重要组成部分，因为它们支撑着数据产品与其消费者之间的契约。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_142_0.png)\n\
  \n图 6-2. 消费者从事件流中读取并将字节反序列化回事件表示\n\n## 什么是架构？\n\n事件架构等同于数据库表的定义：至少，它指定名称、类型、限制和默认值。架构确保事件数据生产者及其所有消费者对数据有共同的理解。架构与事件流\
  \ API 共同构成了事件流 API 的一部分。您可以将其视为等效于提供 JSON 编码数据的 REST API——两者都有通信协议，并且都返回格式良好的信息负载：\n\
  \n> 事件流 API + 事件架构 == REST API + JSON 架构\n\n数据产品所有者负责创建和管理事件架构定义，包括遵守任何联邦治理标准，例如标准时间格式和\
  \ PII 要求。潜在消费者和利益相关者对架构提案提供反馈，在远程工作时代，这通常以代码评审的形式出现。\n\n本节将以一个简单的 Protobuf 驱动示例开头，以说明使用架构的一些更有说服力的理由。让我们从示例\
  \ 6-1 开始，该示例展示了 Person 的架构。\n\n### 示例 6-1. 带 Protobuf 的 Person 架构\n\n```\nmessage\
  \ Person {\n//The person's unique ID\nint32 id = 1;\n//The person's full legal name\n\
  string name = 2;\n//Measured in centimeters, rounded to the nearest centimeter\n\
  int32 height = 3;\n\nenum CountryCode {\nABW = 0;\nAFG = 1;\n...\nZWE = 248;\n}\n\
  //ISO3166-1-alpha-3 standard. AAA=OTHER\nCountryCode country = 4;\n}\n```\n\n事件架构详细说明了人员的\
  \ id、name 和 height，以及其 ISO 3166 三字母拉丁脚本国家代码。此架构构成了数据生产者和消费者之间_数据契约_的一部分。它是一方写入数据和另一方读取数据的共同理解。\n\
  \n图 6-3 显示了两个客户端：一个写入事件流的 Java 生产者和一个从事件流中读取事件并将其读入自身内存空间的 C++ 消费者。生产者可以使用 Java\
  \ 的 Protobuf 代码生成器自动为 Person 架构创建类和客户端代码。消费者可以使用 C++ 代码生成器类似地生成其自己的结构体和客户端代码。\n\n\
  ![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_143_0.png)\n\n图 6-3. 带架构序列化事件的生产者到事件流到消费者工作流\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_143_1.png)\n\nAvro 和 Protobuf 都有许多代码生成器，支持多种语言。您可以找到\
  \ C++、C#、Dart、Go、Java、Kotlin 和 Python 等语言的支持和代码生成器。\n\n示例 6-2 展示了一个生产者 Java 客户端，我们使用它创建一个名为“麦肯齐·贝尔马尔”的人及其相关属性。接下来，我们将对象序列化并写入名为\
  \ ProtoPerson.data 的文件（我们使用文件作为事件代理客户端的占位符，只是为了避免用正确的事件代理客户端生产、重试和错误处理代码使本示例变得臃肿）。\n\
  \n### 示例 6-2. 使用 Java 填充从 Protobuf 架构生成的 Person 对象\n\n```java\nPerson mack = Person.newBuilder()\n\
  \    .setId(4291)\n    .setName(\"Mackenzie Bellemare\")\n    .setHeight(45)\n \
  \   .setCountryCode(\"CAD\")\n    .build();\noutput = new FileOutputStream(\"ProtoPerson.data\"\
  );\nmack.writeTo(output);\n```\n\n消费者从文件（即事件）中读取 Person 数据，使用架构对其进行反序列化，最后将其转换为消费者语言原生的对象或结构体。示例\
  \ 6-3 展示了一个 C++ 消费者，它使用 ParseFromIstream 函数将序列化字节转换为结构良好的 Person 类对象。\n\n### 示例\
  \ 6-3. 使用 C++ 解析序列化的 Protobuf Person 对象\n\n```cpp\nPerson mack;\nfstream input(argv[1],\n\
  \    ios::in | ios::binary);\nmack.ParseFromIstream(&input);\n\n// mack is now populated\
  \ with the id, name, and height received in the event\nid = mack.id();\nname = mack.name();\n\
  height = mack.height();\ncc = mack.countryCode();\n```\n\n那么，这种方法的主要好处是什么？\n\n###\
  \ 标准化的数据契约\n\n架构构成了数据生产者及其所有消费者（现在和未来）之间理解的基础。负责根据架构生产数据的生产者，如果数据不符合要求，将被阻止序列化对象。消费者则可以依赖架构来提供强定义的类型、名称、文档以及关于数据的其他信息。从数据创建之初就保持高质量标准对于健康的数据网格至关重要。\n\
  \n### 为讨论奠定基础\n\n架构为我们就数据的内容和形式进行切实讨论提供了基础。明确的架构与拉取请求评审相结合，使我们能够就事件中应包含和不应包含的内容，以及数据产品是否能解决其旨在解决的问题进行富有成效的讨论。\n\
  \n### 代码生成\n\n代码生成让应用程序以其原生语言中的对象形式操作事件，为您处理解析、转换和对象创建。它通过让您针对编程语言中明确定义的类而非通用对象类型的映射编写代码，大大简化了业务逻辑。\n\
  \n### 架构演进\n\n您的数据契约会随时间而变化。最好的架构选项为架构演进提供了安全路径，包括规则、限制和保障措施，防止您无意中与消费者违反数据契约。架构演进将在本章后面更详细地介绍。\n\
  \n### 测试事件生成器\n\n事件生成器让您创建与架构匹配的数据，包括外键和主键关系等特定参数约束。您可以使用这些事件来测试事件驱动服务代码，并用它们为消费者生成示例事件以在其服务中尝试。Kafka\
  \ Connect Datagen 就是这样一个生成器的示例，您可以在其中指定正在生成的数据的约束和范围。示例 6-4 显示了一个包含 userid 的架构片段，其中有效数据输出的范围将从\
  \ User_1 变化到 User_9。\n\n### 示例 6-4. Kafka Connect Datagen 规范\n\n```\n{\n\"name\"\
  : \"userid\",\n\"type\": {\n    \"type\": \"string\",\n    \"arg.properties\": {\n\
  \        \"regex\": \"User_[1-9]{0,1}\"\n    }\n}\n},\n```\n\n由此可见，架构有很多显著好处，那么下一个问题是：您应该使用哪种架构技术？\n\
  \n## 我们有哪些架构技术选项？\n\n有许多可用于构建事件驱动数据产品的架构技术。然而，在功能、普遍性、社区开发、易用性和支持性工具方面，有几种技术脱颖而出。Google\
  \ 的 Protobuf 和 Apache Avro 都符合这一标准。JSON Schema 对偏好 JSON 的人来说有些流行，但请不要将其与无架构 JSON\
  \ 的一团混乱混淆（稍后会详细介绍）。\n\n\n\n\n\n> Martin Kleppman 在 _设计数据密集型应用_（O’Reilly）第 4 章中对\
  \ JSON、XML、Protobuf、Thrift 和 Avro 撰写了出色的拆解与分析。如果你想了解这些模式技术的底层工作原理，建议阅读此书。\n\n我们不会涉及其他序列化技术（包括\
  \ Thrift），因为它们不常用于事件驱动的数据网格。这并不表示它们从未被使用，或不能被使用，而只是它们并非首选。最常见的三种选择包括 Protobuf、Avro\
  \ 和 JSON Schema。让我们逐一查看。\n\n## Google 的 Protocol Buffers，即 Protobuf\n\nProtobuf\
  \ 于 2008 年开源，长期以来因其 gRPC 格式而广受欢迎。近来，它已被证明是与 Avro 竞争顶级模式格式的有力竞争者。以下是关于 Protobuf 数据类型和模式管理的几个要点：\n\
  \n- 支持标量（例如，string、integer、boolean 等）和复杂数据类型。\n- 模式不作为事件的一部分存储，而是在单独的文件中维护。Protobuf\
  \ 文件通常通过 _模式注册表_ 共享，本章后面将在第 143 页的“模式注册表的作用”中介绍。\n- 你可以通过引用存储在其他文件中的模式声明来组合复杂模式。\n\
  - 不支持动态类型。不过，考虑到数据产品需要强类型和定义明确的模式，这并非重大缺陷。\n\n以下是使用 Protobuf Proto3 版本定义的 Person\
  \ 对象示例：\n\n```\nmessage Person {\n  //The person's unique ID\n  int32 id = 1;\n\
  \  //The person's full legal name\n  string name = 2;\n  //Measured in centimeters,\
  \ rounded to the nearest centimeter\n  int32 height = 3;\n\n  enum CountryCode {\n\
  \    ABW = 0;\n    AFG = 1;\n    ...\n    ZWE = 248;\n  }\n  //ISO3166-1-alpha-3\
  \ standard. AAA=OTHER\n  CountryCode country = 4;\n}\n```\n\nProtobuf 有两个主要版本，在默认值和缺失数据处理方面功能不同。Protobuf\
  \ v2 允许将字段标记为 required 或 optional，支持设置自定义默认值，并能够确定字段是包含在消息中还是缺失。这些功能都使模式演进更易于管理，因为它们为生产者提供了更严格的边界，为消费者提供了更强的保证。\n\
  \nProtobuf v3 引入了对 JSON 编码的支持，以及许多其他功能，但代价是移除了 required/optional 和自定义默认值。与任何开源社区一样，这一决定在两个阵营中都有支持者和反对者。许多组织选择继续使用\
  \ Protobuf v2 标准，而其他组织则已转向 Protobuf v3。\n\n## Apache Avro\n\nApache Avro 是另一种极其常见的模式和序列化格式，由\
  \ Apache 软件基金会创建。Avro 最初于 2009 年发布，多年来常与 Apache Kafka 关联，同时也是一种基于行的大数据存储格式。以下是关于\
  \ Avro 数据类型和模式管理的几个要点：\n\n- 支持原始类型（例如，string、integer、boolean 等）和复杂数据类型。\n- 默认情况下，模式作为数据的一部分存储。模式也可以与数据解耦并独立存储。\n\
  - 通过随事件包含模式，Avro 提供动态反序列化。消费者可以将事件反序列化为 GenericRecord 对象，该对象根据模式和数据动态构建和填充。当消费客户端没有代码生成器时，通常使用此功能。\n\
  - 你可以通过引用存储在其他文件中的模式声明来组合复杂模式。\n- 虽然模式演进是可能的，但它未被明确定义为标准的一部分。\n\n以下是前一个代码片段中同一 Person\
  \ 对象的 Avro 模式示例：\n\n```\n{\n  \"type\": \"record\",\n  \"name\": \"Person\",\n \
  \ \"namespace\": \"com.event.driven.datamesh\",\n  \"doc\": \"Example of a Person\
  \ record\",\n  \"fields\": [\n    {\n      \"name\": \"id\",\n      \"type\": \"\
  integer\",\n      \"doc\": \"The person's unique ID\"\n    },\n    {\n      \"name\"\
  : \"name\",\n      \"type\": \"string\",\n      \"doc\": \"The person's full legal\
  \ name\"\n    },\n    {\n      \"name\": \"height\",\n      \"type\": \"integer\"\
  ,\n      \"doc\": \"Measured in centimeters, rounded to the nearest centimeter\"\
  \n    },\n    {\n      \"name\": \"countryCode\",\n      \"type\": \"enum\",\n \
  \     \"symbols\": [\"AAA\", \"ABW\", ... \"ZWE\"],\n      \"doc\": \"ISO3166-1-alpha-3\
  \ standard. AAA=OTHER\"\n    }\n  ]\n}\n```\n\n你可能注意到，Avro 模式比 Protobuf 略显冗长。在 Avro\
  \ 中，type 和 doc 等所有属性都完全包含在字段定义中。相比之下，Protobuf 中的注释只是使用 C/C++ 风格语法添加。从语义上讲，两者非常相似。\n\
  \n本章将要介绍的下一个也是最后一种模式技术是 JSON Schema。\n\n## JSON Schema\n\nJSON Schema 格式允许你对 JSON\
  \ 文档进行注释和验证。与 Avro 和 Protobuf 不同，你可以使用 *无模式* 的 JSON 文档。无模式 JSON 意味着模式中并未真正定义什么 *应该*\
  \ 和 *不应该* 包含在内，也没有任何类型或默认值。无模式 JSON 不适合用于数据产品，因为它为错误、误解和缺失数据留下了太多空间。\n\n以下是关于 JSON\
  \ Schema 数据类型和模式管理的几个要点：\n\n- 支持六种原始类型（null、boolean、object、array、number、string）以及一些更复杂的类型。\n\
  - 你可以通过引用存储在其他文件或位置中的模式来组合复杂模式。\n- 数据验证与 Protobuf 和 Avro 类似。生产者在将数据写入事件流之前，会先针对其模式进行验证。\n\
  - 支持向数字、字符串、数组和对象添加验证关键字，以实施数据质量。\n\n以下是前一个代码片段中同一 Person 对象的 JSON Schema 表示：\n\n\
  ```\n{\n  \"$id\": \"https://example.com/person.schema.json\",\n  \"$schema\": \"\
  https://json-schema.org/draft/2020-12/schema\",\n  \"title\": \"Person\",\n  \"\
  type\": \"object\",\n  \"properties\": {\n    \"id\": {\n      \"type\": \"number\"\
  ,\n      \"description\": \"The person's unique ID\"\n    },\n    \"name\": {\n\
  \      \"type\": \"string\",\n      \"description\": \"The person's full legal name\"\
  \n    },\n    \"height\": {\n      \"type\": \"number\",\n      \"description\"\
  : \"Measured in centimeters, rounded to the nearest centimeter\",\n      \"minimum\"\
  : 1,\n      \"maximum\": 300\n    },\n    \"countryCode\": {\n      \"type\": \"\
  string\",\n      \"enum\": [\"AAA\", \"ABW\", ... \"ZWE\"],\n      \"description\"\
  : \"ISO3166-1-alpha-3 standard. AAA=OTHER\"\n    }\n  }\n}\n```\n\nJSON Schema 是迄今为止讨论的唯一一种既包含用于指定模式的语言，又包含用于限制某些属性范围的验证参数的技术。如\
  \ height 属性所示，人的身高被限制在 1 到 300 厘米之间，描述中还包含关于四舍五入到最近整数的更多信息。这些约束将防止系统意外将身高以毫米输入，但不幸的是，它们仍无法防止系统以英寸写入身高。\n\
  \n## 模式演进：随时间变更你的模式\n\n即使你在第一次尝试中创建了完美的数据模型，它也不可避免地需要随时间而改变。新的业务职责可能导致领域扩展，从而为数据产品创造新的需求。虽然新系统可能需要访问最新的数据格式，但无需新数据的现有系统需要保证其数据契约不会发生变化。模式演进允许我们变更模式，以便在不破坏现有消费者兼容性的情况下满足新消费者的用例。\n\
  \nAvro、Protobuf 和 JSON Schema 之间共有的模式演进属性有几种。第一种是兼容模式，事件可以根据模式版本之间的更改进行前向或后向转换。兼容模式对于变更管理、防止（非故意的）破坏性更改，以及免除消费者为每个模式版本编写自定义代码（例如，如果\
  \ schema.version==1 则执行此操作，如果 schema.version==2 则执行那项操作，等等）至关重要。\n\n主要兼容模式如下：\n\n\
  - 向后兼容\n\n使用新模式的消费者可以读取使用旧模式生成的数据。这种兼容模式对于确保使用最新模式的消费者仍能读取和处理早期版本编码的旧数据非常重要。\n\n\
  例如，删除字段是向后兼容的。假设我们有如下所示的记录：\n\n```\n{\n\"type\": \"record\",\n\"name\": \"Example\"\
  ,\n\"doc\": \"This is Version 1\",\n\"fields\": [\n{ \"name\": \"id\", \"type\"\
  : \"integer\" },\n{ \"name\": \"foobar\", \"type\": \"string\" }\n]\n}\n```\n\n\
  我们可以为版本 2 移除 foobar 字段，如下所示：\n\n```\n{\n\"type\": \"record\",\n\"name\": \"Example\"\
  ,\n\"doc\": \"This is Version 2\",\n\"fields\": [\n```\n\n\n\n{ \"name\": \"id\"\
  , \"type\": \"integer\" }\n]\n}\n```\n\n请注意，架构转换器（作为架构框架的一部分）可以采用版本 1 数据，仅通过删除 foobar\
  \ 字段将其转换为版本 2。因此，版本 2 与使用版本 1 编写的事件向后兼容。\n\n## 向前兼容\n\n使用旧架构（版本 1）的消费者仍然可以读取使用较新架构（版本\
  \ 2）编写的新事件。它们只能访问与其版本匹配的数据。这种兼容模式非常重要，因为当针对当前架构版本编写代码的现有消费者回退其消费者偏移量以读取事件流中的历史数据时，需要用到它。\n\
  \n从前面的示例中，您会注意到我们无法将版本 2 转换为版本 1，因此它不是向前兼容的。为什么？版本 1 缺少字段 foobar 的默认值，而消费者在转换期间需要该默认值来填充缺失的值。\n\
  \n我们需要在发布之前修改我们的版本 1 架构以添加默认值（幸好我们始终在拉取请求中创建兼容性测试用例，对吧？）。在 Avro 中，指定默认值就像下面这样简单：\n\
  \n```\n{\n\"type\": \"record\",\n\"name\": \"Example\",\n\"doc\": \"This is Version\
  \ 1, but with a default value for foobar\",\n\"fields\": [\n{\n\"name\": \"id\"\
  ,\n\"type\": \"integer\"\n},{\n\"name\": \"foobar\",\n\"type\": \"string\",\n\"\
  default\": \"DEFAULT_VALUE_STRING\"\n}\n]\n}\n```\n\n“默认值”这个术语可能有点误导。与关系型数据库表不同，关系型数据库表的默认值在写入时填充，这些默认值是在读取时使用的。此外，默认值仅在记录本身不包含该字段时才应用。结合我们之前的示例：如果您尝试将使用架构版本\
  \ 2 写入的记录转换为架构版本 1，转换器会注意到原始事件中不存在字段 foobar。因此，在创建转换后的版本 1 记录时，它将设置 foobar=\"DEFAULT_VALUE_STRING\"\
  ，而不是抛出异常。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_152_0.png)\n\nAvro、JSON Schema\
  \ 和 Protobuf v2 均支持自定义默认值。这对于确保记录在多次更改后仍保持兼容性是一个强大的选项。开发人员经常使用默认值来标记数据因兼容性转换而缺失（例如\
  \ DEFAULT_VALUE_STRING），而不是因为有效负载实际接收到的 foobar 为 null。\n\nGoogle 的 Protobuf v3 作为一种故意的设计决策，移除了自定义默认值，因此您可能会发现\
  \ Protobuf v3 用于演进目的稍微困难一些。\n\n与所有架构相关的事物一样，请确保查看所选架构的具体细节以了解更多详情。这四个标准中的每一个都有比本章能够舒适容纳的更多内容。\n\
  \n## 完全兼容\n\n当事件可以立即向前和立即向后转换时。\n\n## 完全传递兼容\n\n当事件可以与事件流中任何其他版本进行前向和后向转换时。这是最强的保证，这意味着每一次架构演进都与之前的架构完全兼容。版本\
  \ 3 架构可以转换为版本 2 和版本 1，反之亦然。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_152_1.png)\n\
  \n事件驱动的数据产品应尽可能遵循完全传递兼容。它为消费者提供了最强的保证，并确保它们仅在业务用例发生变化时才需要更新代码，而不是因为架构损坏。虽然您可以根据需要放宽数据产品的兼容性级别，但需要确保这不会对消费者产生不利影响。\n\
  \n尽管架构演进非常有帮助，但总会有这样一个时刻，即您的领域发生重大变化以至于架构演进不再足够。必须进行破坏性变更，并且必须谨慎处理。\n\n## 协商破坏性架构变更\n\
  \n破坏性变更最常见的原因是源领域模型的边界发生转移，这通常源于业务模式的扩展。添加新产品线或服务可能需要重新思考和重新定义数据所有权，从而导致与现有数据产品不能一对一映射的新边界。举个简单的例子，User\
  \ 数据模型以前可能使用简单字符串对 address 进行建模，如下所示：\n\n示例 6-5。\n\n```\n{\n\"type\": \"record\"\
  ,\n\"name\": \"User\",\n\"namespace\": \"user.namespace\",\n\"fields\": [\n{ \"\
  name\": \"first_name\", \"type\": \"string\" },\n{ \"name\": \"last_name\", \"type\"\
  : \"string\" },\n{ \"name\": \"address\", \"type\": \"string\" }\n]\n}\n```\n\n\
  但是，新的本地性功能需要创建一个包含 home_address、work_address 和 phone_number 的 Address 对象。以下是新标准化\
  \ User_v2 对象的 Avro 架构。请注意，home_address 和 work_address 均为 Address 对象，且 Address 对象允许可选包含\
  \ phone_number：\n\n示例 6-6。\n\n```\n{\n\"type\": \"record\",\n\"name\": \"User_v2\"\
  ,\n\"namespace\": \"user.namespace\",\n\"fields\": [\n{ \"name\": \"first_name\"\
  , \"type\": \"string\" },\n{ \"name\": \"last_name\", \"type\": \"string\" },\n\
  { \"name\": \"home_address\",\n\"type\": {\n\"type\" : \"record\",\n\"name\" : \"\
  Address\",\n\"namespace\" : \"user.namespace.inner\",\n\"fields\" : [\n{\"name\"\
  : \"phone_number\", \"type\": [\"null\", \"string\"]},\n{\"name\": \"address\",\
  \ \"type\": \"string\"},\n{\"name\": \"city\", \"type\": \"string\"},\n{\"name\"\
  : \"country\", \"type\": \"string\"}\n]\n}\n],\n{ \"name\": \"work_address\",\n\"\
  type\": \"user.namespace.inner.Address\"\n}\n]\n}\n```\n\n下游消费者将不再可用旧的单字符串 address\
  \ 字段。但是，它们都了解这一变更吗？仍然依赖字符串 address 字段的系统会怎样？\n\n协调涉及多个团队的变更可能具有挑战性，重新谈判已发布数据产品的边界也是如此。不过，我们无需重复造轮子，可以借鉴现有先例来规范这一过程。\n\
  \n对于维护良好的 API（无论是库、框架还是 REST API），保持与旧客户端的一定程度的向后兼容性是常见政策。新客户端可以使用最新的 API 调用来驱动其业务逻辑，而旧客户端可以继续使用较旧的\
  \ API 调用。最终，API 调用将被弃用并随后删除，这给应用程序的维护人员留出时间以迁移到较新的 API。我们可以采用同样的流程来处理数据产品架构中的破坏性变更，如一系列步骤中所述。\n\
  \n### 步骤 1：设计新数据模型\n\n数据产品所有者必须与其团队一起为数据产品提出一个新的候选模型。在整个源领域需要重大变更的情况下（例如单个领域拆分为两个或两个领域变为三个），最大的挑战可能是重新定义新领域的边界以及对现有数据产品的新约束。需要根据对源领域所做的更改来审查现有数据产品，以便将新的候选数据产品提交给现有消费者进行审查。\n\
  \n### 步骤 2：与现有消费者和联合治理团队进行迭代\n\n一旦您的候选数据产品准备就绪，就该与您的现有客户（或至少为获取最早反馈而选定的最重要客户子集）预约会议了。讨论领域模型的变更、对现有数据产品提出的变更，以及您计划创建以应对模型转移的任何新数据产品。同样，某些现有数据产品在新模型中可能没有直接等价物，随后将被删除。\n\
  \n这些讨论通常会产生丰富的反馈，供数据产品所有者带回团队并应用到其数据产品中。这是一个审查和修订的迭代过程，但能提供最佳的整体结果，因为它保持了数据网格的消费者驱动特性，同时减少了浪费的工作量。\n\
  \n在您的组织经历的前几次破坏性架构变更中，让联合治理团队参与进来是个好主意，因为这可以为完善流程提供宝贵的经验和反馈。例如，数据产品所有者可能难以识别所有利益相关者和消费者（由于数据发现和自助服务工具不佳），或者缺乏将旧数据产品标记为弃用的能力。就像我们不太可能第一次就将数据产品架构设计正确一样，我们第一次进行破坏性架构变更时也可能会遇到一些问题。识别和解决常见问题对于改善数据网格的自助服务特性至关重要。\n\
  \n### 步骤 3. 制定发布计划、数据迁移计划和弃用计划\n\n在新架构和数据产品获准继续推进后，下一步涉及制定发布指南和弃用计划。将受影响的消费者与所需变更的影响相结合，可以让我们了解他们进行必要迁移所需的时间和精力。同样，这也表明数据产品所有者在迁移期间需要提供多少支持。发布计划应反映迁移所有消费者预计所需的时间，并预留一些安全余量。\n\
  \n数据迁移是破坏性数据产品变更的重要因素。在事件流中保留完整历史记录需要将之前的事件数据模型迁移到新模型，或者从源数据重新创建事件。当破坏性变更仅仅是对现有字段的重新建模时，前者可行，但在创建新数据时往往会力不从心。在我们的示例中，我们重新定义了\
  \ Address，添加了 work_address 和 home_address。我们缺乏关于当前 address 是工作地址还是家庭地址的信息，即使能够找出，我们也只有一个\
  \ address，需要收集信息来填充另一个字段。\n\n数据产品所有者可以通过创建与新架构匹配的新记录来回填 User_v2 事件流。但是，这些新记录仅代表当前时间点的\
  \ User。原始 User 流中的历史事件在没有额外工作的情况下不会被迁移。\n\n最后，数据产品所有者必须在一段时间内（例如 8 到 12 周）同时支持 User\
  \ 和 User_v2 数据产品，以便消费者可以从旧产品迁移到新产品。数据产品所有者的团队将协助他们进行他们的\n\n\nmigration needs, including\
  \ clarifying details about the new domain, any changes to semantics, and assisting\
  \ in rebuilding internal state stores.\n\n### 步骤 4. 执行发布\n\nThe new data products\
  \ are released alongside the existing ones, such that consumers have time to migrate\
  \ over. Mark the original User data product as *deprecated* to block new consumers\
  \ from registering as readers, and instead redirect them to use the latest version,\
  \ User_v2. The User data product with the old `string address` value will co-exist\
  \ with the new User_v2 data product for a predetermined period of time.\n\n新数据产品与现有数据产品一起发布，以便消费者有时间进行迁移。将原始\
  \ User 数据产品标记为 *废弃*，以阻止新消费者注册为读者，并改为将它们重定向到使用最新版本 User_v2。带有旧 `string address` 值的\
  \ User 数据产品将与新的 User_v2 数据产品在预定时间段内共存。\n\nWhile most consumers will work in a timely\
  \ manner to migrate their applications to the new data product, there will be those\
  \ who lag behind due to lack of resources and competing priorities. While you can\
  \ certainly send them ever-more-frequent reminder messages, at some point the integrity\
  \ of the data mesh will become at risk: it is unreasonable for the producer service\
  \ to maintain two versions of the data product indefinitely, especially since the\
  \ business domain model has permanently shifted. Noncompliance is not abnormal in\
  \ a data mesh, and at this point it would be best to consult your federated governance\
  \ team on how to proceed: migrate the code of non-complying consumers, escalate\
  \ up the business chain, or simply proceed with the deprecation plan and halt production\
  \ of new events to that event stream. Usually the threat of a production outage\
  \ is sufficient to finish the migrations.\n\n虽然大多数消费者会及时将其应用程序迁移到新数据产品，但也会有因资源不足和优先级冲突而落后的消费者。虽然你当然可以向他们发送越来越频繁的提醒消息，但到了某个时候，数据网格的完整性将面临风险：生产者服务无限期地维护两个版本的数据产品是不合理的，尤其是业务领域模型已经永久性转移。在数据网格中，不合规并非异常，此时最好咨询联邦治理团队如何进行：迁移不合规消费者的代码、升级业务链条，或直接继续弃用计划并停止向该事件流生成新事件。通常，生产中断的威胁足以完成迁移。\n\
  \nNavigating a breaking schema change is a fairly involved process that requires\
  \ explicit communication between the data product owner and all of its consumers.\
  \ The precise steps in your process will depend on your own implementation details,\
  \ but should look similar to what we just covered.\n\n应对破坏性架构变更是一个相当复杂的过程，需要数据产品所有者与所有消费者之间进行明确沟通。你流程中的精确步骤将取决于你自己的实现细节，但应该与我们刚才介绍的类似。\n\
  \nManaging schemas well requires keeping track of previous versions and ensuring\
  \ compatibility rules are followed. Consumers additionally need the ability to discover\
  \ which schemas belong to which event streams as part of self-service tooling requirements.\
  \ A *schema registry* provides a solution for these needs, among others, and is\
  \ an essential part of an event-driven data mesh, as we shall see in the next section.\n\
  \n良好管理架构需要跟踪先前版本并确保遵循兼容性规则。消费者还需要能够发现哪些架构属于哪些事件流，作为自助服务工具要求的一部分。*架构注册表*为这些需求（以及其他需求）提供了解决方案，是事件驱动型数据网格的重要组成部分，我们将在下一节中看到这一点。\n\
  \n## The Role of the Schema Registry\n\nA schema registry is a service that allows\
  \ us to register schemas in association with their event streams. One of the main\
  \ roles of the schema registry is to reduce the number of bytes sent over the network.\
  \ Back in “A Brief Introduction to Serialization and Deserialization” on page 128,\
  \ we saw that the basic serialization process appends a full copy of the schema\
  \ to each event record, which results in a significant amount of duplicated data\
  \ sent over the network. Figure 6-4 shows a producer writing events with a full\
  \ copy of each schema, reducing throughput, increasing data replication costs, and\
  \ increasing the load on consumers.\n\n## 架构注册表的角色\n\n架构注册表是一种服务，允许我们将架构与其事件流关联注册。架构注册表的主要角色之一是减少通过网络发送的字节数。正如在“序列化和反序列化简介”第\
  \ 128 页中所见，基本序列化过程会将架构的完整副本附加到每个事件记录，导致通过网络发送大量重复数据。图 6-4 显示生产者携带每个架构的完整副本写入事件，降低吞吐量，增加数据复制成本，并增加消费者的负载。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_157_0.png)\n\nFigure 6-4. Each serialized\
  \ event published to the event stream with the entire schema, resulting in excessive\
  \ network utilization and storage overhead\n\n图 6-4. 将带有完整架构的每个序列化事件发布到事件流，导致过度的网络利用率和存储开销\n\
  \nA schema registry can absolve us of the need to write the schema with each event.\
  \ Instead, we can store the schema external to the event and just use a unique ID\
  \ in its place to track the associated schema. Thus, whenever a consumer reads an\
  \ event, it can simply reference the schema registry to obtain the schema associated\
  \ with that ID.\n\n架构注册表可以让我们不需要在每个事件中写入架构。相反，我们可以将架构存储在事件之外，并使用唯一 ID 来跟踪关联的架构。因此，每当消费者读取事件时，它可以简单地引用架构注册表来获取与该\
  \ ID 关联的架构。\n\nFigure 6-5 shows the entire end-to-end process. Instead of serializing\
  \ the schema along with the event, the producer service queries the schema registry\
  \ (1), registers the schema (2), then replaces the schema with a short unique ID\
  \ (3 and 4). This event is then produced to the event stream (5). The process is\
  \ performed in reverse on the consumer side: the event is read from the stream (6),\
  \ the schema registry is queried using the unique ID (7 and 8). Once the schema\
  \ is obtained (9), the record can then be deserialized (10 and 11) for processing\
  \ by the consumer’s business logic.\n\n图 6-5 展示了完整的端到端过程。生产者服务不再将架构与事件一起序列化，而是查询架构注册表（1）、注册架构（2），然后用短唯一\
  \ ID 替换架构（3 和 4）。然后将该事件生成到事件流（5）。消费者端执行相反的过程：从流中读取事件（6），使用唯一 ID 查询架构注册表（7 和 8）。一旦获得架构（9），记录即可被反序列化（10\
  \ 和 11），供消费者的业务逻辑处理。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_157_1.png)\n\n\
  Figure 6-5. Leveraging a schema registry in an event-driven producer/consumer workflow\n\
  \n图 6-5. 在事件驱动型生产者/消费者工作流中利用架构注册表\n\nPrecisely how the schema is replaced by the\
  \ unique ID depends on both the producer’s serialization logic and any limitations\
  \ in the format of events in the schema registry. For example, Confluent’s Kafka\
  \ Schema Registry replaces the schema with a 5-byte prefix.\n\n架构被唯一 ID 替换的确切方式取决于生产者的序列化逻辑以及架构注册表中事件格式的任何限制。例如，Confluent\
  \ 的 Kafka Schema Registry 会将架构替换为 5 字节前缀。\n\nUsing a schema registry requires serializers\
  \ and deserializers to adhere to the proprietary format. And while Confluent’s schema\
  \ registry is fairly widely used with Kafka, it’s not the only schema registry,\
  \ and not all schema registries will use the same format. As part of building self-service\
  \ tools, your governance team will need to negotiate which schema to support for\
  \ building your data mesh.\n\n使用架构注册表要求序列化程序和反序列化程序遵循专有格式。虽然 Confluent 的架构注册表与 Kafka\
  \ 一起被广泛使用，但它不是唯一的架构注册表，也不是所有架构注册表都会使用相同的格式。作为构建自助服务工具的一部分，您的治理团队需要协商为构建数据网格支持哪种架构。\n\
  \nA schema registry provides other benefits in addition to network and disk I/O\
  \ savings. Here are a few other significant benefits provided by a schema registry:\n\
  \n架构注册表除了节省网络和磁盘 I/O 之外，还提供其他好处。以下是架构注册表提供的几个其他重要好处：\n\n### Data discovery\n\n###\
  \ 数据发现\n\nThe schema registry provides a mapping of event streams to its registered\
  \ schemas. Prospective consumers can examine the schemas to see if the stream contains\
  \ the data they’re interested in. Self-service tooling can provide search functionality\
  \ on top of the schema registry API to search for specific fields, documentation,\
  \ or metadata tags.\n\n架构注册表提供事件流与其注册架构的映射。潜在消费者可以检查架构，以查看流是否包含他们感兴趣的数据。自助服务工具可以在架构注册表\
  \ API 上提供搜索功能，以搜索特定字段、文档或元数据标签。\n\n### Schema evolution validation\n\n### 架构演进验证\n\
  \nRegistering a schema with the schema registry is a mandatory part of the write\
  \ path of an event to a stream. This action provides a hook for validating the producer’s\
  \ current schema against that stored in the registry. Did the user evolve the schema\
  \ in a way that is unauthorized by the schema registry (e.g., the new schema does\
  \ not support backward compatibility)? Throw an exception. Is the schema completely\
  \ invalid compared to what was registered under that ID before? Throw an exception.\
  \ Is the event malformed? Throw an exception. The schema registry provides a safeguard\
  \ against unintentional and unauthorized changes, protecting the data integrity\
  \ so that the data product can meet its quality and reliability SLAs.\n\n向架构注册表注册架构是将事件写入流时的强制性步骤。此操作提供了一个挂钩，用于验证生产者的当前架构与注册表中存储的架构。用户是否以架构注册表未授权的方式演进了架构（例如，新架构不支持向后兼容性）？抛出异常。架构与之前在该\
  \ ID 下注册的架构相比是否完全无效？抛出异常。事件是否格式错误？抛出异常。架构注册表提供了一种防护措施，防止意外和未经授权的更改，保护数据完整性，以便数据产品可以满足其质量和可靠性服务级别协议（SLA）。\n\
  \n### Automatically updated documentation\n\n### 自动更新的文档\n\nThe schema registry\
  \ provides a minimal form of automatically updated documentation for each event\
  \ stream. Users can view all the registered schemas, including the names, types,\
  \ and doc fields. Embedded schema docs are very useful for highlighting any idiosyncrasies\
  \ or corner cases in the data. They are also far more likely to be up to date because\
  \ they are embedded, as opposed to documentation maintained independently by an\
  \ outside party.\n\n架构注册表为每个事件流提供一种自动更新的文档的简化形式。用户可以查看所有注册的架构，包括名称、类型和文档字段。嵌入式架构文档非常有助于突出显示数据中的任何特性或边缘情况。它们也更有可能保持最新，因为它们是嵌入式的，而不是由外部方独立维护的文档。\n\
  \n### Downloadable schemas to generate code\n\n### 可下载的架构用于生成代码\n\nA consumer can\
  \ download schemas to generate class definitions and test events for their unit\
  \ tests.\n\n消费者可以下载架构以生成类定义和测试事件，用于其单元测试。\n\nYou can write a custom registration\
  \ script to evaluate the schema during the registration process. A simple and common\
  \ check is to verify that every value in a schema has a “doc” string of nonzero\
  \ length to ensure that there is _some_ documentation for each field. Another option\
  \ is to scan for PII patterns and request an additional verification step if something\
  \ suspicious is found. Similarly, you can automatically generate class definitions\
  \ and run validation tests prior to deployment.\n\n您可以编写自定义注册脚本，在注册过程中评估架构。一个简单而常见的检查是验证架构中的每个值都具有非零长度的\
  \ \"doc\" 字符串，以确保每个字段都有 _一些_ 文档。另一个选项是扫描 PII 模式，如果发现可疑内容，请求额外验证步骤。同样，您可以在部署前自动生成类定义并运行验证测试。\n\
  \nSchema registries provide many benefits for a low overhead and are an essential\
  \ component of an event-driven data mesh. The savings on network and storage costs\
  \ alone make them a valuable choice, with the remaining functionality providing\
  \ the icing on the cake.\n\n架构注册表以较低的开销提供许多好处，是事件驱动型数据网格的重要组成部分。仅节省网络和存储成本就使它们成为有价值的选择，其余功能则锦上添花。\n\
  \nSo now that we’ve covered schemas, schema registries, and the benefits of using\
  \ both, we have one last schema-related question before winding up the chapter.\
  \ How do we manage schemas in relation to our data product producer and consumer\
  \ applications?\n\n既然我们已经介绍了架构、架构注册表以及使用两者的好处，在结束本章之前，我们还有一个最后的架构相关问题。我们如何在数据产品生产者和消费者应用程序的关系中管理架构？\n\
  \n## Best Practices for Managing Schemas in Your Codebase\n\n## 在代码库中管理架构的最佳实践\n\
  \nThere are several schools of thought for storing event schemas in your codebase.\
  \ One is to centralize all of your data product schemas in one big repository, using\
  \ references to tie them to the codebase that actually owns the schema. Another\
  \ is to decentralize and store schemas in the code repository of the producers and\
  \ rely on the self-service data platform to tie them all together.\n\n在代码库中存储事件架构有几种思路。一种是将所有数据产品架构集中在一个大型仓库中，使用引用将它们与实际拥有架构的代码库绑定。另一种是去中心化，将架构存储在生产者的代码仓库中，并依赖自助服务数据平台将它们全部连接起来。\n\
  \nHowever, the best practice is a combination of the two: a centralized code repository\
  \ for shared-use schemas with data product owners retaining their own schemas internal\
  \ to their projects. Let’s take a deeper look at how this works in practice by first\
  \ examining *schema composition* and its role in a data mesh.\n\n然而，最佳实践是两者的结合：用于共享架构的集中式代码仓库，数据产品所有者在其项目内保留自己的架构。让我们先检查\
  \ *架构组合* 及其在数据网格中的作用，以更深入地了解这在实践中如何运作。\n\nApache Avro, Protobuf, and JSON Schema\
  \ each provide the ability to import schemas from other files just as you would\
  \ import a class or a library into your code. This is a powerful feature that enables\
  \ us to compose a schema from simple common building blocks.\n\nApache Avro、Protobuf\
  \ 和 JSON Schema 都提供从其他文件导入架构的能力，就像将类或库导入代码一样。这是一个强大的功能，使我们能够从简单的公共构建块中组合架构。\n\n\
  First, you’ll need to consult with your federated governance team to come up with\
  \ standardizations of common cross-domain entities. In this case, previous meetings,\
  \ discussions, and arguments have led to the standardization of two simple (but\
  \ useful!) entities within the organization—base_user, representing the unique ID\
  \ of a user:\n\n首先，您需要与联邦治理团队协商，制定常见跨域实体的标准化方案。在此情况下，之前的会议、讨论和争论已导致组织内两个简单（但有用！）实体的标准化——base_user，表示用户的唯一\
  \ ID：\n\n\n\n```\npackage myorg.common;\n\nmessage base_user {\n  String uuid =\
  \ 1;\n}\n```\n\n和 base_item，包含特定电子商务产品的唯一 ID：\n\n```\npackage myorg.common;\n\n\
  message base_item {\n  int64 id = 1;\n}\n```\n\n数据产品所有者可以将这两个基础定义都导入到 user_clicked_on_item\
  \ 架构定义中，并加上一个通用时间戳字段，以组合他们的事件定义：\n\n```\nimport \"common_schemas/base_user.proto\"\
  \nimport \"common_schemas/base_item.proto\"\nimport \"google/protobuf/timestamp.proto\"\
  ;\n\nmessage user_clicked_on_item {\n  myorg.common.base_user user = 1;\n  myorg.common.base_item\
  \ item = 2;\n  google.protobuf.Timestamp timestamp = 3;\n  String websiteURI = 4;\n\
  }\n```\n\n使用标准形式组合架构，可以大大简化跨组织合并数据产品的工作。例如，此事件可以按 base_user、base_item 或 Timestamp\
  \ 与其他事件进行聚合，甚至可以按这三者的组合进行聚合。此外，遵循通用定义意味着您还可以利用通用单元测试和验证插件，显著降低出错机会，保持数据质量和可靠性处于高位。\n\
  \n通用架构组件应保持相当精简，仅包含数据产品所有者必须填充的字段。请记住，您始终可以创建包含更广泛字段列表的其他组件。例如，您可以选择创建一个通用的 item_details\
  \ 组件，包含扩展 base_item 所需的所有标准信息，并将其作为额外组件包含在数据产品的架构中。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_160_0.png)\n\
  \n将通用架构组件存储在集中式仓库中，并在编译时将其拉入本地系统。将应用程序的架构与代码一起存储在其自身仓库中。然后，您可以在将架构提升为数据产品时，选择将事件架构发布到数据产品发现平台。\n\
  \n将数据产品的架构与创建事件流的代码一起存储，可以简化整个审查流程。您只需创建代码审查，确定现有消费者，并将其添加为审查者。严格的方法要求每个消费者批准更改，确保每个人都了解可能影响其应用程序的更改。\n\
  \n在本章的下一节也是最后一节中，我们将探讨如何选择要使用的架构技术。\n\n## 选择架构技术\n\n选择要采用的架构格式时，有几个主要因素。第一个是优先级：您是否已经在使用某种架构格式？如果是，这将是首先要考虑的最佳候选方案。您的联邦治理团队将负责调查其在贵组织中的适用性，并发现是否存在任何需要解决的重大障碍或痛点，以防止进一步采用。管理单一架构格式比管理多种格式要容易得多。\n\
  \n第二个主要因素是支持性工具的可用性及其如何集成到您的自助服务环境中。代码生成器、用于测试目的的事件生成器、架构注册表支持和数据发现支持都是重要的子因素。虽然\
  \ Avro 和 Protobuf 通常都有大量支持，但其他架构框架可能没有那么多支持、采用度和可用工具，尤其是在事件流媒体的上下文中。使用架构技术的整个目标是改善自助服务功能，确保高质量的数据产品，并消除出错的余地。请使用可靠、广泛且支持良好的工具。\n\
  \n第三个主要因素涉及架构特定特性及其是否适合您的用例。例如，您可能需要 JSON Schema、Protobuf v2 和 Avro 提供的非空和非零默认值。您可能也更偏好\
  \ JSON Schema 的内置数据质量检查（例如，最小值、最大值），或者更偏好 Avro 和 Protobuf 的更快速序列化和反序列化。\n\n作为现实世界的示例，我们可以参考\
  \ Saxo Bank 的 Paul Makkar。在他的演讲“Kafka 和数据网格”中，他概述了他和他的团队在选择 Protobuf 而非 Avro 时所做的决定。我在以下侧边栏中总结了评估。\n\
  \n### 为什么 Saxo Bank 选择 Protobuf 而非 Avro\n\nSaxo Bank 的工程组织主要是一个 .NET 商店，最初尝试将 Apache\
  \ Avro 用作生成代码、验证架构和集成到其工作流的主要架构技术。然而，该组织发现这并不像期望的那样有效。Avro 与 .NET 的集成实在太困难了。Avro\
  \ 的 C# 和 Python 客户端落后于 Java 实现，需要更多手动步骤，并引入了许多摩擦点。您可以在 Confluent 的博客上阅读有关具体问题和评估的更多信息。\n\
  \nSaxo Bank 随后试用了 Protobuf 作为首选架构，并遇到了更少的问题。代码生成器完全按照数据格式规范所需的方式工作，序列化和反序列化没有问题，并且公司总体上对开发人员和数据产品所有者的体验更加满意。\n\
  \n基于构建自助服务工具的原则，Saxo Bank 还选择投资于使用 Buf，这是一种用于管理和使用 Protobuf 架构的主观工具，为他们提供了 lint\
  \ 工具、样式指南、命名约定和枚举用法工具。\n\nProtobuf 注释功能允许 Saxo Bank 的工程师直接将元数据（例如 PII 标记和有关加密数据的规范）嵌入到架构中。不关心该字段（例如加密的\
  \ PII）的消费者可以忽略这些注释，但需要访问更多有关如何解锁数据信息的消费者（例如对身份验证和解密组件的引用）可以启用这些注释。\n\n转向 Protobuf\
  \ 的决定是基于识别使用 Avro 的痛点、调查替代方案以及评估常见用例。对 Protobuf 的进一步测试表明，它远比其他方案更适合 Saxo Bank 的需求，因此联邦治理团队选择统一并支持所有人使用的单一标准。\n\
  \n对于 Saxo Bank 来说，正在使用的技术（.NET）和与支持性工具（例如 Buf）的重要集成在 Protobuf 的采用中发挥了重要作用。\n\n###\
  \ 摘要\n\n架构是事件驱动型数据产品的重要组成部分。它们为事件流的生产者和消费者提供结构和清晰度，并构成对数据产品内容的可靠且明确的定义。\n\n代码生成器在架构本身和业务逻辑之间架起了一座桥梁，对生产者和消费者都有好处。前者受益于严格的类型定义以及可选字段和必填字段的区分，确保不会意外产生格式错误或遗漏数据。随后，后者也受益于相同的明确类型系统，无需解释和标准化数据。架构提供了一种在尽可能靠近数据源的地方实施质量控制的手段。\n\
  \n架构演进提供了随时间推移演变和更改架构的能力，并有明确的预先规则，规定在兼容性要求下允许哪些更改。尽管仍可能发生破坏性更改，但架构提供了确定新数据产品可能是什么样子的通用框架。而且由于它们通常作为代码库的一部分集成，架构更改可以遵循与标准业务应用程序代码更改相同的审查流程。\n\
  \n虽然有许多选择可供您选择，但 Apache Avro 和 Google 的 Protobuf 仍然是您的最佳选择，JSON Schema 作为合理的第三选择。您对其中一种的投资将取决于您现有的技术选择，但最好仍由您的联邦治理团队集中讨论和决定。\n\
  \n在下一章中，我们将探讨如何利用所学的架构知识，将其应用于事件设计问题。有许多不同的方法来建模和设计事件。我们将探讨最佳实践，以及最好避免的陷阱和注意事项。\n\
  \n\n\n\n"
- "## 事件类型简介\n\n设计事件驱动架构事件的方式有很多种。但是，有些方式比其他方式更适合在事件驱动数据网格中使用。本章介绍为事件驱动数据产品设计事件的最佳策略，包括如何避免在此过程中遇到的众多陷阱。\n\
  \n支撑所有事件设计的主要事件类型有两种：*状态* 事件，如我们在第 55 页的“状态事件和承载状态的状态传输”中首次介绍，以及 *增量* 事件，我们将在本章中更详细地介绍。\n\
  \n图 7-1 显示了一个稳态下的简单方波，根据增量定期在一个状态和另一个状态之间切换。类似于这个方波，我们将事件建模为要么捕获状态本身，要么捕获从一个状态过渡到另一个状态的边缘。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_164_0.png)\n\n图 7-1. 变化过程中的状态与增量\n\n\
  系统中任何事件都有三个阶段：\n\n- 1. 初始状态\n- 2. 改变初始状态以产生最终状态的增量\n- 3. 最终状态（也是下一个变更周期的初始状态）\n\n\
  我们遇到的大多数事件都可以完全归类为状态或增量。以这种方式看待事件有助于分离关注点并集中设计精力：\n\n## 状态事件\n\n状态事件充分描述了实体在特定时间点的状态，是跨领域传递数据产品的最佳选择。状态事件通常是事件驱动数据网格中最灵活、最有用的事件类型。\n\
  \n## 增量事件\n\n这些事件描述状态之间的过渡，通常仅包含关于更改了什么的信息。增量事件之所以与众不同，是许多事件驱动应用程序开发者遇到的第一类事件类型。然而，正如我们稍后将讨论的，这些事件通常不太适合事件驱动数据网格。\n\
  \n虽然可能存在兼具各自特征的混合事件，但这类事件较少见，因为它们可能导致不希望的强耦合。我们将在本章后面详细讨论这些问题。\n\n让我们先来看看状态事件。\n\
  \n## 扩展状态事件和承载状态的状态传输\n\n第 55 页的“状态事件和承载状态的状态传输”同时介绍了状态事件和 ECST。作为回顾，状态事件展示了实体在特定时刻的当前状态，很像关系数据库中的一行。ECST\
  \ 允许事件流的任何消费者将其所需的任何数据选择物化、聚合并存储在其自己的领域边界内，以供自行使用。在本节中，我们将探讨扩展状态事件的一些有用选项。\n\n状态事件可以仅包含“现在”状态，或者可能包含“前/后”状态（我们将在下一章的第\
  \ 179 页“变更数据捕获”中介绍这种模式）。这两种选项各有优劣，我们将逐一审查。首先，让我们看看这些选项中的每一种如何影响事件流的压缩。\n\n定义 ECST\
  \ 事件结构和内容有两种主要设计策略：\n\n## 当前状态\n\n包含创建事件时的完整公共状态。\n\n## 前/后状态\n\n包含事件发生 _前_ 的完整公共状态和事件发生\
  \ _后_ 的完整公共状态。\n\n让我们详细研究每一种，以便更好地了解其权衡。\n\n## 当前状态事件\n\n该事件仅包含实体的当前状态，需要与之前的状态事件进行比较才能确定更改了什么。例如，给定\
  \ `item_id` 的 _库存_ 事件将仅包含该时间点库存数量的最新值。这种设计策略有几个主要优点：\n\n### 精简\n\n状态事件在事件流中占用的空间最小。网络流量也被最小化。\n\
  \n### 简单\n\n事件代理为该实体存储任何先前的状态事件，因此如果您需要历史状态，只需回滚并重播消费者偏移量即可。您可以根据消费者对历史数据的需求，为每个事件流设置独立的压缩策略。\n\
  \n### 可压缩\n\n您可以使流中的事件数量与领域的键空间成正比。\n\n它还有几个细微差别，并非完全是缺点，而是需要考虑的事项：\n\n### 对状态更改原因不敏感\n\
  \n下游消费者不会得知数据更改的 _原因_，只能得到新的公共状态。原因很简单：这消除了消费者对源领域 _内部状态转换_ 进行耦合的能力。考虑关系数据库表中的数据——我们通常不会在数据本身中传达数据更改的原因，状态事件也是如此（注：我们稍后将研究如何通过混合事件稍微放宽这一规则）。\n\
  \n### 消费者必须维护状态以检测转换\n\n无论业务逻辑多么简单或复杂，消费者都必须维护自己的状态来检测某些字段的特定变化。例如，客户将地址更改为另一个国家可能需要您向其发送新的法律文件，这取决于他们离开的国家和移入的国家。通过让消费者负责为跟踪转换物化状态，计算这些边缘的责任完全落在消费者的领域内。\n\
  \n使用 _当前状态事件_ 构建的数据产品灵活且相当易于使用，应该构成您大多数数据产品的基础。如果您也希望将状态转换打包到事件中，那么前/后状态是不二之选。\n\
  \n## 前/后状态事件\n\n该策略依赖于提供过渡发生前的状态和过渡发生后的状态。如第 179 页的“变更数据捕获”中所述，变更数据捕获（CDC）系统经常使用前/后策略。下面展示了两个具有简单双字段架构的前/后用户事件：\n\
  \n```\nKey: 26\nValue: {\n before: { name: \"Adam\", country: \"Atlantis\" },\n\
  \ after: { name: \"Adam\", country: \"Canada\" }\n}\n```\n\n显示 Key = 26 删除的后续前/后状态事件。请注意，旧数据仍保留在\
  \ before 字段中：\n\n```\nKey: 26\nValue: {\n before: { name: \"Adam\", country: \"\
  Canada\" },\n after: null\n}\n```\n\n这种设计有一些好处：\n\n### 单事件中的简单状态转换\n\n前/后事件在单个事务中展示了每个更改的字段，以及所有未更改的字段。但是，更改原因不包括在内。\n\
  \n### 消费者无需维护状态即可检测简单更改\n\n某些消费者如果只关心检测简单的状态转换，可以不必维护状态。例如，如果我们想向从马达加斯加搬到加拿大的用户发送文件，那么我们的消费者只需检查事件的前和后字段是否符合其标准。但是，如果\
  \ Adam 先从马达加斯加搬到埃塞俄比亚，然后很快又搬到加拿大，导致发生两个事件，这就行不通了。消费者业务逻辑将无法对这一事件序列触发，因为它不维护任何状态。在实践中，理论上的无状态消费者很少实现，因为任何合理复杂度的服务绝大多数都需要维护状态。\n\
  \n这种设计也有一些缺点：\n\n### 压缩困难\n\n使用前/后逻辑删除事件会导致后字段设置为 null，但整个值本身并非 null。默认情况下，像 Apache\
  \ Kafka 这样的事件代理不会将其识别为墓碑（tombstone），因此不会将其删除。虽然从技术上讲可能可以重写压缩逻辑，但通常不可行，尤其是当您大量依赖\
  \ SaaS 解决方案时。\n\n但是，有一些选项，具体取决于您使用的工具。Debezium 已通过允许您在前/后事件后生成一个墓碑来绕过这一限制，生成两个事件而不是仅一个。\n\
  \n根据 Debezium 的文档：\n\n> 数据库 DELETE 操作会导致 Debezium 生成两条 Kafka 记录：\n> \n> * 一条包含 \"\
  op\": \"d\"、之前行数据和某些其他字段的记录。\n> \n> * 一条与被删除行具有相同键且值为 null 的墓碑记录。此记录是 Apache Kafka\
  \ 的标记。它表示日志压缩可以移除所有具有此键的记录。\n\n### 剩余信息的风险\n\n如前所述，除非您发出一系列删除操作，否则之前的数据可能会无意中无限期地保留在前字段中。\n\
  \n### 数据存储和网络使用量翻倍\n\n前/后事件平均会使通过网络传输和存储在磁盘上的数据量翻倍。生产者、消费者和事件代理各自承担部分负载。在某些情况下这可能微不足道。更新频率低或数据量小的事件或许无需担心，但极高数据量的事件流成本可能会迅速增加。这可能特别昂贵，具体取决于与高可用性生产者、消费者和事件代理部署相关的跨区域数据传输费用。\n\
  \n我在设计事件流数据产品时建议使用当前状态事件而不是前/后。消费者将需要为其业务流程关心的记录维护状态，但磁盘空间相对便宜，他们只需选择自己需要的领域子集。这也简化了\n\
  \n\n\n与 before/after 相比，事件代理的操作具有更低的跨区域流量成本、更少的代理磁盘使用量和更少的代理网络复制开销。此外，消除了因不当压缩删除而导致数据泄露的风险。\n\
  \n在下一节中，我们将了解增量事件，其中事件是根据变化而非状态本身来建模的。\n\n## 增量事件\n\n增量事件表示特定领域中发生的变化，在图 7-1 中表示为转换的边。增量事件*仅*包含有关状态变化的信息，而不包含过去或当前状态。增量事件通常以过去时态的动词形式表述，表示某事已发生。例如：\n\
  \n- itemAddedToCart\n- itemRemovedFromCart\n- orderPaid\n- orderShipped\n- orderReturned\n\
  - userMoved\n- userDeleted\n\n您可能会发现，您对这些事件类型的熟悉程度超过对 ECST 中使用的状态类型的熟悉程度。增量事件在历史上一直相当常见，特别是在\
  \ Lambda 架构的背景下（参见第 62 页的“Lambda 架构及其为何不适用于数据网格”）。增量事件也通常在领域*内部*用于*事件溯源*，这是我们在回到数据产品之前将要探讨的主题。\n\
  \n## 使用增量事件的事件溯源\n\n事件溯源是一种基于记录领域内*所发生的事情*作为不可变的仅追加事件序列的架构模式。这些事件被*聚合*以按其发生顺序应用领域特定逻辑，一个接一个地构建当前状态。\n\
  \n此架构常被推广为传统关系型数据库框架中常见的创建、读取、更新、删除（CRUD）模型的替代方案。在 CRUD 模型中，实体的完全可变状态会被直接修改，因此仅保留最终状态。尽管支撑\
  \ CRUD 的数据库可以生成已发生更改的审计日志，但该日志主要用于审计目的，而非用于驱动业务逻辑。\n\nCRUD 模型存在一些限制，可能使事件溯源成为一个有吸引力的替代方案。首先，操作必须在调用时直接针对数据存储进行处理。在高负载下，这会显著减慢操作速度并导致超时和失败。其次，对同一实体的高并发操作可能导致数据冲突和事务失败，进一步增加系统负载。\n\
  \n但 CRUD 模型也具有若干明显优势。虽然这很大程度上取决于数据库，但大多数 CRUD 实现都提供强读后写一致性。它也相当直观且易于使用，有大量工具和框架支持。对于许多软件开发人员来说，这是他们遇到的第一种状态维护模型。图\
  \ 7-2 展示了一系列 CRUD 事件（一个创建、两个更新）对冰箱状态应用更改。状态是完全可变的，并且在应用创建或更新命令后，仅保留更新后的状态。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_170_0.png)\n\
  \n图 7-2. 使用 CRUD 命令更新冰箱内容，反映在数据库中\n\n在事件溯源架构下，这些创建、更新和销毁操作被建模为写入持久性仅追加日志（该日志会无限期保留它们）的事件。使用单个数据库表作为仅追加日志并不少见。也可以使用\
  \ Apache Kafka 之类的事件代理来托管仅追加日志，尽管这会引入额外的延迟。在任何一种情况下，当前状态都是通过按日志中写入的顺序消费事件，并一次应用一个事件来生成最终状态的。\n\
  \n图 7-3 展示了相同的冰箱示例，但 CRUD 操作改为建模为领域事件。虽然这些示例事件类似于 CRUD，但领域所有者拥有设计增量以适应其自身业务用例的完全自由权。例如，他们可以扩展正在创建的事件集，以还包含诸如下述增量：\n\
  \n- turn_lights_on/turn_lights_off\n- turn_cooling_on/turn_cooling_off\n- open_door/close_door\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_171_0.png)\n\n图 7-3. 使用事件溯源构建冰箱内容\n\n\
  领域聚合器（2）与将新领域事件写入日志的进程（1）是分离的，并允许写入和聚合过程独立扩展。一个领域还可以包含多个领域聚合器，并可根据领域需求将同一日志聚合到两个不同的内部状态存储中。\n\
  \n事件溯源的主要缺点之一是它是最终一致的，这对于某些用例来说可能是一个重大障碍。将事件写入日志与在状态中看到物化结果之间总会存在一定的延迟。并且，由于多个并发客户端都可以针对同一实体写入事件，因此很难将最终状态中的任何特定修改归因于您的客户端刚刚追加的增量。这可能使其不适用于需要强一致性的应用程序。\n\
  \n事件溯源是构建内部状态的 CRUD 模型的合理替代方案。事件溯源的问题在于，当它被*用作跨领域通信的手段时*，将内部领域增量暴露给外部世界，供他人耦合（并误解）。这些特定于领域的事件及其与聚合和彼此之间的关系会随时间变化，因此，在领域内为事件溯源定义的事件*不适合作为数据产品用于跨领域通信*！正如我们不允许域外的服务直接耦合我们的数据模型一样，我们也不应允许服务耦合我们私有的领域事件数据模型。\n\
  \n这并不是说您不能在域边界之外公开任何事件。但是，*您在域边界之外公开的任何事件*都会成为公共数据合约的一部分，并要求您的域数据产品所有者予以支持。这意味着确保其语义含义不会随时间漂移，数据不会演变，并且其他人不会尝试使用它来在外部使用您的逻辑副本重建您的私有内部域。未能维护“此处的事件”和“那里的事件”的边界，可能导致极其复杂的耦合、重构困难，以及外部消费者对事件的误解所引起的微妙错误。\n\
  \n## 为什么增量事件不适用于事件驱动的数据产品\n\n接下来的几节将说明将增量事件用于事件驱动数据产品的问题。将增量事件用作领域间通信数据的手段存在几个问题。让我们逐个查看每个问题。\n\
  \n### 可能事件类型集是无限的\n\n首先，在任何非平凡领域中都可能发生无限数量的增量事件。仅这一点本应阻止大多数人尝试使用增量模型创建事件流数据产品，但不幸的是事实并非如此。但是，真的会有*无限数量*的增量事件吗？\n\
  \n实际上，您的领域所需的增量事件实际集无疑是有限的。真正的问题是，每个增量事件的消费者都需要知道如何将其正确集成到聚合中——如果没有这种能力，您就无法通过数据产品有效地传达状态。\n\
  \n让我们看一个示例。图 7-4 显示了一组用于构建购物车内容的简单电子商务事件。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_173_0.png)\n\
  \n图 7-4. 购物车增量事件，用于构建购物车的当前状态\n\n添加和删除相当简单：可以添加项目，也可以删除项目。消费者需要按正确顺序解释和应用每个这些事件，以构建其聚合。但是，假设领域中的一项新功能允许用户更新购物车中的项目数量：以前，域所有者可能会先发出删除事件，然后发出带有新数量的添加事件，而现在他们可能只需发出一个更新事件即可。\n\
  \n图 7-5 显示了发布到世界上的新“更新项目数量”事件流。现在，如果消费者需要购物车模型，他们还必须在聚合代码中考虑这些更新事件。随着领域范围的变化，事件的含义及其与聚合的关系也会发生变化。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_173_1.png)\n\n图 7-5. 新的更新事件改变了购物车增量事件的解释方式\n\
  \n人们（错误地）选择将增量事件用于跨领域通信的常见原因之一是，他们认为不应要求其他消费者维护状态以触发特定更改。但是，可能的增量范围使这变得行不通。将购物车领域简单扩展以包含优惠券、运费估算和订阅等功能，会增加消费者必须考虑的信息量，如图\
  \ 7-6 所示。\n\n\n\n\n\n## 购物车事件流\n\n| 添加商品 | 添加优惠券 | 添加订阅 |\n| --- | --- | --- |\n\
  | 移除商品 | 移除优惠券 | 移除订阅 |\n| 更新商品数量 | 应用运费估算 | 修改订阅日期 |\n\n图 7-6. 定义购物车的增量事件随着新增业务功能而扩散\n\
  \n将此扩展后的购物车领域暴露给消费者，要求消费者能够识别、使用这些事件并从中构建出正确的聚合。这引出了跨领域使用增量事件的下一个重大问题。\n\n## 解释事件的逻辑必须复制到每个消费者\n\
  \n消费者如何知道自己是否正确解读了增量事件？当引入新的领域事件时，消费者又如何保持最新状态？关键在于让消费者能够正确运行，而无需不断更新其逻辑以应对新增和多样的增量事件。\n\
  \n在状态模型中，消费者只需物化状态事件即可知道自己获得了完整的公共领域。他们可能不知道转换发生的原因（本章后面会稍微再讨论这一点），但可以确信整个公共领域都已存在，并且作为消费者，他们不必担心正确构建聚合。\n\
  \n图 7-7 展示了两个消费者，它们各自复制了生产者用于构建聚合状态的逻辑。消费者负责识别、理解并正确应用添加、移除和更新领域事件，以生成聚合的适当最终状态。领域的复杂性至关重要；非常简单的领域可能能够应对这一点，但任何具有有意义复杂性的领域都会发现此解决方案行不通。\n\
  \n间歇性问题可能会引起进一步的复杂性——托管在延迟代理上的事件流在提供某些事件时可能会出现延迟，导致消费者接收到的事件与其他流中的事件顺序不一致。错误顺序应用的增量通常会导致错误的状态转换，并可能触发错误的业务操作。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_175_0.png)\n\n图 7-7. 构建状态时解释增量事件的逻辑被复制到多个位置\n\
  \n此外，每个消费者可能会以略有不同的方式实现自己的聚合逻辑——通常是因为消费者未能随领域演进更新聚合逻辑。一个消费者可能会最多等待 30 秒以接收迟到的事件，而另一个消费者可能根本不等待，直接丢弃任何迟到事件，从而生成相似但不同的聚合。\n\
  \n生产者聚合其内部领域的任何变化（包括新事件或更改的增量语义）都必须传播到消费者逻辑中——如果你之前使用过分布式服务（或微服务），可能会对此想法感到不安。使用增量事件在领域之间进行通信会将生产者、事件定义和消费者紧密耦合在一起，试图管理这一点是徒劳的。\n\
  \n## 这些事件与事件流的映射效果不佳\n\n迄今讨论的问题中，我们一直基于这样一个假设：任何新的增量事件都会立即被消费者识别和理解，尽管他们可能尚不明白如何将这些事件应用于领域。现实要混乱得多。增量事件消费者需要在新增量创建时收到通知，以便他们可以更新代码，将事件集成到其数据模型中。协调可能非常困难，尤其是当有许多不同的消费者时。本小节的主要问题在于：消费者如何了解其模型中必须考虑的新领域事件？\n\
  \n一个常见的建议（遗憾的是，这错过了要点）是简单地“将所有内容放在同一个事件流中，以便消费者可以访问并选择是否需要使用它”。尽管现有消费者最终会接收到这些新事件类型，但此提议无法解决消费者使用这些数据所需的代码更改和集成问题。\n\
  \n此外，这更有可能导致消费者抛出异常，被丢弃为“坏数据”，或者更糟糕的是，在消费者的业务逻辑中导致静默处理错误。这也违反了每个事件流使用单一可演进模式的惯例，这是许多处理事件流的框架和技术的事实标准。\n\
  \n这里的关键问题是，新的事件定义需要与将事件聚合为模型的人员协作。如果将新增量事件放入新的独立事件流中，可以更容易发现并遵循每个事件流一个模式的惯例，但消费者仍然需要手动收到通知，告知这个新流的存在！无论哪种情况，都需要代码更新才能理解这些数据，而未能集成它则会导致错误聚合的风险。\n\
  \n我喜欢将此与状态模型进行对比，在状态模型中，状态领域可以根据需要更改，数据产品的组合完全封装在生产者服务内部。对业务领域所做的任何修改都在一处进行，并反映在发布到事件流的更新数据模型中。\n\
  \n## 所有权反转：消费者将业务逻辑放入生产者\n\n增量的第四个问题围绕业务逻辑的所有权和位置展开。例如，消费者可能需要知道包裹何时已发货，以便向预期收件人发送一封通知其包裹正在送达的电子邮件。确定包裹已发货的业务逻辑必然必须位于生产者中，如图\
  \ 7-8 所示。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_176_0.png)\n\n图 7-8. 消费者业务需求被推入生产者的业务逻辑；在此示例中，消费者\
  \ A 只想了解包裹何时发货，而不想了解包裹的任何其他状态\n\n然而，随着业务用例范围的扩大，这很快变得不可行。每个依赖状态转换的新业务需求也需要将其业务逻辑放置在生产者服务中（参见图\
  \ 7-9），以便在该“边缘”发生时生成事件。这很难扩展和管理，更不用说跟踪所有权和依赖关系了。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_177_0.png)\n\
  \n图 7-9. 消费者需求的范围可能会变得相当大，因为对于任何复杂度的大多数领域都有许多可能的增量\n\n增量事件的全部目的是避免在消费者服务中维护状态，但它们要求生产者完全具备并愿意仅为消费者履行业务逻辑。例如，考虑这些相当合理的用例：\n\
  \n- 我要追踪用户之前打电话投诉后的退货情况：一个 user ReturnedItemAfterTelephoneComplaint 事件。\n- 我想知道用户是否至少看到过三次该商品的广告，随后购买了它：一个\
  \ userSawAtLeastThreeAdsThenPurchasedIt 事件。\n\n这些示例事件可能有点过分，但现实是，这些正是企业所关心的条件类型。在每种情况下，消费者都应该维护自己的状态并构建这些事件的自身计算，但相反，它通过将检测边缘的责任推回给生产者来避免这样做。产生的高度特定的事件不是数据产品，而是一个紧密耦合的、不可行的复杂系统。\n\
  \n最后一个因素是，单个系统很少能够提供这些高度专用事件所需的所有信息。考虑图 7-10 的示例。在此示例中，消费者需要在广告服务和支付服务（均在其各自的领域内）的状态满足特定标准时采取行动：用户必须看到广告三次，并最终购买该商品。\n\
  \n\n\n\n即使我们说服了广告团队生成 userSawAdvertisementThreeTimes 和 userReturnedItemAfterTelephoneComplaint\
  \ 事件，消费者仍然需要将其存储在自己的状态存储中，并等待来自支付服务的匹配购买。即使是最复杂、最繁琐的事件定义也无法解释处理完全位于另一个领域的数据。消费者仍然必须能够维护状态，尽管我们竭尽全力想要避免这一点。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_178_0.png)\n\n图 7-10. 特定于消费者的增量事件触发逻辑被上推到广告服务和支付服务两端\n\
  \n如果我们的消费者想要将业务逻辑从三条广告更改为四条广告，该怎么办？需要协商一套全新的事件定义，并将其置于生产者的边界内，这应该能让你了解这个想法在实践中效果有多差。生产者输出一组通用状态，让消费者自己决定如何处理这些数据集，要合理得多。\n\
  \n## 无法在不引入过度复杂性的情况下维护历史数据\n\n反对将增量事件用于事件驱动型数据产品的第五个也是最后一个观点，基于维护可用历史数据的困难。旧的状态事件可以简单地进行压缩，但增量事件不行。将不断增长的事件日志作为历史信息来源进行管理变得困难得多。\n\
  \n每个增量事件对于聚合最终状态都是必不可少的。而且可能不仅要处理单个事件流，还可能有多个与领域中不同增量相关的增量流。图 7-11 显示了三个简单购物车增量事件的示例，过去\
  \ 10 年来这些事件已经变得非常庞大——庞大到新消费者可能需要连续处理三周左右才能处理完数据量，以便赶上当前状态。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_179_0.png)\n\
  \n图 7-11. 这个流中的增量事件实在太多，新消费者无法合理地消费\n\n清理旧数据当然是一种解决方案，但我看到的另一种尝试是将较旧的事件卸载到大型侧边状态存储中，该存储可以边加载到新消费器中。这里的想法是，消费者可以并行加载所有这些事件，从而快得多地启动。问题是，应用这些事件的顺序可能很重要，而仅仅将事件移动到非流式系统，然后再将其流回新消费者，这有点荒谬。因此，下一个解决方案是根据所有增量事件在该时间点构建状态的*快照*。如图\
  \ 7-12 所示。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_179_1.png)\n\n图 7-12. 将旧事件加载到引导侧边存储中需要聚合到状态模型\n\
  \n这里有一点讽刺意味。在试图避免创建可公开使用的状态定义时，我们发现自己正在做同样的事情，即将数据存储在侧边存储中。新消费者当然可以使用它快得多地启动，但现在他们既要从快照状态存储读取，然后又要完美地切换到事件流。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_180_0.png)\n\n图 7-13. 这让我们回到了 Lambda\
  \ 架构，涉及增量事件、聚合状态，以及同时处理批处理和流处理的需求\n\n图 7-13 表明，我们现在已经走了一圈，回到了我们一直试图避免的 Lambda 架构本身，以及所有的运营复杂性和固有问题。\n\
  \n以下是用于跨域通信的增量事件的不幸常见但不充分的论点：\n\n- 维护重复状态是浪费的，它将占用太多磁盘空间。\n- 消费者会知道事件的含义。他们怎么可能误解它呢？\n\
  - 得了吧，我真的只关心这一个转换，如果我将其与之耦合，也不是什么大不了的事。\n- 就为我发布一个自定义事件吧。\n- 那个不想使用状态事件的人\n\n增量事件在私有域的内部边界内是完全可以的，在那里，事件定义与解释和应用它们所需逻辑之间的紧密耦合可以得到一致应用。但是，在域边界之间使用相同的增量事件是危险的，将它们作为在其他应用程序中构建状态的手段更是绝对不可行。专注于为数据产品使用状态事件，并将增量事件留在封闭系统内部通信。\n\
  \n尽管如此，有时从不同的角度审视事件设计是合理且有用的。让我们来看看测量事件及其有用之处。\n\n## 测量事件\n\n测量事件在许多领域中很常见，由在特定时间点发生的事件的完整记录组成。在我们的日常世界中，有常见的示例：网站分析，也许最典型的是由\
  \ Google Analytics 体现，就是其一。每个网站、社交媒体体验和移动应用程序上发生的用户行为跟踪是另一个。每次你点击按钮、查看广告或在 Instagram\
  \ 帖子上停留时，都会将其记录为测量事件。\n\n测量事件长什么样子？以下是一个记录用户在网页上查看广告事件的用户行为事件示例：\n\n```\nKey: \"\
  USERID-8271949472726174\"\nValue: {\n utc_timestamp: \"2022-01-22T15:39:19Z\"\n\
  \ ad_id: 1739487875123\n page_id: 364198769786\n url: https://www.somewebsite.com/welcome.html\n\
  \ }\n```\n\n测量是在特定时间点的状态快照。但是，测量具有一些使其与我们之前讨论的状态事件不同的特征。\n\n### 测量事件通常形成聚合对齐的数据产品\n\
  \n测量通常用于创建聚合对齐的数据产品。例如，userViewedAd 测量可用于计算大量数据集，回答诸如“哪个 page_id 最受欢迎？”、“用户何时看到的广告最多？”以及“每个用户在会话中平均看到多少条广告？”等问题。相比之下，基本状态事件通常用作源对齐的数据产品。\n\
  \n### 测量事件源可能会丢失数据\n\n在测量事件的创建和摄入到事件流之间，丢失某些测量事件并不罕见。例如，广告拦截程序非常擅长阻止网站分析事件，因此你的报告和仪表板不太可能完全准确。但是，它们对于许多分析目的来说，通常已经足够好，尤其是用于构建聚合。\n\
  \n### 测量事件可能支持对时间敏感的应用程序\n\n考虑一个在其装配线上测量温度、湿度和其他空气质量指标的工厂。这些测量的一个*分析*用例可能是跟踪和识别工厂环境的长期趋势。但一个*运营*用例可能是在传感器值出现偏差时快速反应，改变装配线吞吐量，或者如果环境条件未达到规格要求，则完全关闭它。\n\
  \n在发生网络连接问题的情况下，传感器可能正在等待发布现在已有 30 到 60 秒历史的数据，而新数据在后面堆积。根据测量流的*目的*及其预先协商的服务级别目标（SLO），它可能会选择丢弃旧事件并简单地发布最新事件。这很大程度上取决于这些数据是用于实时目的，还是用于构建能够容忍中断和延迟的全面历史图景，就像网站分析中那样。\n\
  \n### 收集和使用测量值的实践\n\n职业生涯初期，我曾在 RIM（现 BlackBerry）工作，从内部开发者的 BlackBerry 设备收集测量数据。基本上，每当设备上发生“坏事”时，我们就会生成测量数据转储，将其打包，然后发送到后端服务器进行进一步处理。“坏事”包括掉线、掉短信、BlackBerry\
  \ 信使无法发送消息、蜂窝调制解调器芯片重置，以及关键业务应用程序生成的自定义触发器。其目的是收集所有这些测量数据，用于自动生成问题报告以及帮助开发人员进行调试。\n\
  \n关于收集测量值，有几个关键点是我当时学到的，并一直沿用至今。首先，对受控负载拥有定义明确的架构至关重要，因为这使自动化后处理变得容易得多（谁不讨厌空指针呢？），并减少了为处理格式错误数据而添加特殊逻辑所花费的时间。其次，测量的完整性比实时性能更重要。我们接收到几个小时、几天甚至几周前的测量事件并不罕见——这可能是由于测试设备暂时断开连接所致，例如一位从北美飞往亚洲的高管，或者仅仅是我们的一位开发人员在通勤上班途中被困在隧道里。但我们向依赖消费者发布的\
  \ SLO 反映了这一情况，只有在错过每日报告时才会有人催要数据。\n\n\n\n\n## 混合事件——带有一点增量的状态\n\n混合事件是状态和增量的混合物。最好将这些视为可能包含关于\
  \ _为什么_ 或 _如何_ 某事发生的少量信息的状态事件。为清晰起见，让我们看一个示例。\n\n考虑以下场景。一家公司提供一项在线服务，要求用户在使用前注册。用户可以通过多种方式注册：\n\
  \n- 通过主页上的主注册按钮\n- 通过电子邮件广告链接\n- 使用第三方帐户（例如 Google 帐户）\n- 由管理员为他们手动创建帐户\n\n混合数据产品的消费者想知道用户是_如何_注册的。对于运营用例，我们想知道下次他们登录时应为其提供哪个引导工作流。出于分析目的，我们想知道哪种注册方式最常见，以便分配开发资源。\n\
  \n对此注册建模的一种方法是使用用户状态事件，并使用单个枚举指示注册机制（毕竟，你只能注册一次！）。记录示例如下：\n\n```\nKey: \"USERID-9283716596927463\"\
  \nValue: {\n  name: \"Randolf T. Bandit\"\n  signup_time: \"2022-02-22T22:22:22Z\"\
  \n  birthday: \"2000-01-01T00:00:00Z\"\n  // An enum of (MAIN, VIA_AD_EMAIL, THIRD_PARTY,\
  \ or ADMIN)\n  method_of_signup: \"VIA_AD_EMAIL\"\n}\n```\n\n创建混合事件时，我们将原本会是增量事件的内容合并到单个状态事件中。我们没有使用\
  \ `signed_up_via_email`、`signed_up_via_homepage`、`signed_up_via_third_party` 和 `signed_up_via_admin`\
  \ 事件，而是将它们压平为单个枚举并附加到用户实体上。用户状态事件中的值域需要考虑每种可能的枚举设置：例如，我们可能还想包含有关使用了哪个第三方登录提供商或哪个电子邮件活动促使用户注册的信息。\n\
  \n问题的关键就在这里：混合事件的主要问题。领域中某事物_如何_产生的确切机制在很大程度上是私有细节，但通过公开此信息，我们也向下游消费者暴露了内部业务逻辑过程以供耦合。\n\
  \n此信息对消费者的主要风险在于，用户注册的*如何*会随时间而变化。这既可能是语义上的意义变化（与五年前和五年后相比，现在“主”注册方式究竟是什么？），也可能是枚举值的扩展或收缩。这些语义通常只是源领域的关注点，但通过暴露这些以增量为中心的接缝，它们变成了消费者的关注点。\n\
  \n还有一种可能（或可能性）是，生产者必须更新混合事件以考虑新的注册方式：通过公司新发布的移动应用程序（将 `VIA_MOBILE_APP` 添加到 `method_of_signup`\
  \ 枚举中）。此事件的消费者必须被告知此事件的即将发生的更改，并且必须在更新事件定义之前确认它们可以处理此新 `method_of_signup` 的处理。否则，消费者在处理过程中可能会遇到致命错误，因为它们的业务逻辑不会考虑新类型。这只是我们在第\
  \ 161 页看到的“解释事件的逻辑必须复制到每个消费者”这一问题的另一个方面。\n\n但是，在此示例中，对消费者的风险较低，但不为零，原因如下：\n\n- 消费者的注册方式是不可变的。真正的风险在于\
  \ `method_of_signup` 的含义随时间推移而漂移。事件所有者可以通过提供非常清晰的枚举含义文档（例如，在事件架构本身中）并严格遵守其自身定义来防止这种情况。\n\
  - 填充 `method_of_signup` 的逻辑总体上相当简单，因此不太可能随时间推移而漂移。通过电子邮件链接注册是一个二进制增量——要么你通过电子邮件链接注册了，要么没有。相比之下，基于本章前面提到的\
  \ `userReturnedItemAfterTelephoneComplaint` 增量事件的枚举有更多的顺序依赖性和误解方式，并且随时间推移含义漂移的可能性要大得多。\n\
  \n混合事件是一种权衡。使用混合事件所承担的风险与您试图跟踪的增量的复杂性及其随时间（无论是否有意）改变的可能性成正比。我建议您尝试进一步解耦生产者和消费者系统，以避免传达数据更改的*为什么*或*如何*的细节。如果您选择在事件中包含增量类型字段，请注意它成为数据契约的一部分，并仔细考虑它与源系统引入的耦合。\n\
  \n## 通知事件\n\n在结束本章之前，还要讨论最后一种事件类型。通知包含最小的一组信息，指示某事已发生，并包含指向包含更多信息的资源的链接或 URI。移动电话可能是最熟悉的通知来源——您有新消息，有人喜欢您的帖子，或者您有足够的心来恢复免费游戏——单击此处前往。\n\
  \n您在手机上可能收到的简单后台通知示例如下。您的即时通讯应用程序会发出“NEW_MESSAGE”通知，包括状态（用于图标显示）、应用程序名称以及指向应用程序本身的点击式\
  \ URI：\n\n```\nValue: {\nstatus: \"NEW_MESSAGE\"\nsource: \"messaging_app\"\napplication_uri:\
  \ \"/user/chat/192873163812392\"\n}\n```\n\n通知事件经常被滥用，试图在不发送状态本身的情况下传达状态。相反，通知中发送的是指向状态的指针，期望收件人登录到源服务器并获取数据。以下就是这种示例，其中通知包含状态已更改的信息，并且存在用于查找完整当前状态的访问\
  \ URI：\n\n```\nKey: 12309131238218\nValue: {\nstatus: \"PARTIAL_RETURN\"\nutc_timestamp:\
  \ \"2021-21-13T13:11:42Z\"\naccess_uri: \"serverURI:8080/orders/values/12309131238218\"\
  \n}\n```\n\n乍一看，这似乎是一个整洁简洁的解决方案：它允许消费者在接收到事件时简单地查询完整的公共状态，而无需在其他地方复制或暴露该数据。主要问题之一是，该事件实际上并不提供该时间点的状态记录——除非\
  \ access_uri 中包含的数据完全不可变（通常不是）。由于这种反模式通常构建在可变状态存储之上，当您收到 PARTIAL_RETURN 通知时，access_uri\
  \ 中关联的状态可能已经再次更新为新状态。\n\n这种竞争条件使得通知成为传达状态的不可靠机制。例如，带有 SOLD -> PARTIAL_RETURN ->\
  \ FULL_RETURN 状态更新的销售将发出三个不同的事件，每个状态对应一个。处理滞后的消费者可能无法在 PARTIAL_RETURN 状态最终变为 FULL_RETURN\
  \ 之前访问它，从而完全错过该完整状态转换。更糟糕的是，处理积压的新消费者将看不到任何之前的状态——只能看到当前时钟时间存储在 access_uri 中的内容。\n\
  \n对此设计的最后一击（进一步证实其不适合用于数据产品）是它增加了远大的复杂性。通知的域所有者不仅必须发布事件，还必须为涉及该状态的同步请求提供服务。这包括管理事件流生产者和同步查询\
  \ API 的访问控制、授权和性能扩展。\n\n相反，将事件所需的状态作为该时间点的不可变记录来生成要好得多。这需要很少的努力，并大大简化了领域之间的数据通信。\n\
  \n## 总结\n\n本章内容涉及面很广，在继续之前，让我们花点时间回顾一下。\n\n事件主要可以定义为状态或增量。状态事件支持事件携带的状态传输，是跨领域传达数据的最佳选择。状态事件依赖于事件代理功能，例如无限保留、持久状态和压缩，以帮助我们管理事件量。状态设计允许我们将事件代理作为数据产品的主要来源，从而使用\
  \ Kappa 架构，同时巧妙地避免其前身 Lambda 架构相关的陷阱。\n\n增量事件是思考事件驱动架构的常见方式，但对于跨领域通信来说不足。增量牢牢属于事件溯源阵营，在单个有界上下文内的通信中可能非常宝贵。当允许外部方耦合时，就会滥用增量事件。这会导致暴露应保持私有的内部业务逻辑、流程和事件。简而言之，不要将增量事件用于跨领域耦合。\n\
  \n测量事件记录发生的情况，例如来自人类用户、分布式系统和物联网（IoT）设备的情况。测量事件源于数据分析领域，由精确时刻的本地化状态快照组成。这些事件经常用于组成详细的聚合或对快速测量变化做出反应。\n\
  \n混合事件和通知事件应谨慎使用，如果使用的话。混合事件主要是状态事件，但可以暴露有关某事为何发生的信息，类似于增量事件。这形成了一个引入紧密耦合的接缝，特别是当为何随时间变化时。通知事件相当\n\
  \n\n\n对数据产品领域而言无关紧要，除非它们被滥用为传递外部可变数据指针的手段。务必避免这种情况。\n\n在下一章中，我们将探讨如何将此处讨论的内容与现有数据系统集成，以及如何为消费者制作有用的数据产品。\n"
- "## 引导数据产品\n\n创建事件驱动数据产品主要有两种场景。第一种涉及从尚未以事件形式存在的现有数据源创建数据产品。正如本书前文所提及的，这些数据源包括常规数据库（关系型、文档型、键值型等）、云文件系统，甚至\
  \ FTP 文件转储。本章将探讨如何将这些现有数据源引导至事件驱动的数据网格。\n\n第二种场景涉及已处于事件流中的数据源，例如由原生事件驱动服务生成的数据。由于数据源已经是事件驱动的，创建数据产品更多地是将需要发出的数据和应保留在内部的数据形式化的过程。\n\
  \n不要过度担心首个数据产品是否完全正确。事实上，最好先积累一些经验，找出哪些有效、哪些不够理想，然后在此基础上进行迭代。你可以将构建数据产品与构建自助服务平台类比起来。第\
  \ 99 页的“第 1 级：最小可行平台”是一个基本但有用的平台，可用于开始使用数据网格，你可根据需要对其进行增量改进。以同样的方式考虑你的首个数据产品——即\
  \ MVP 数据产品，它们将让你踏上实时、事件驱动处理之路，并让数据可供其他人按需使用。\n\n本章将探讨多种技术，包括 CDC 和事务性外出箱，它们能帮助你将数据从当前所处位置引导至有用的数据产品。我们还将查看可能出现的陷阱和问题，以及解决这些问题的一些可能性。让我们开始吧。\n\
  \n### 入门：使用连接器进行引导\n\n连接器使你能够轻松地将现有数据引导至事件流，而无需彻底重构源应用程序。现实是，大多数创建数据的系统（如业务实体和操作事实）也是其唯一数据来源。同样，这些系统也投入了数千（或数百万？）个开发工时——我们不会仅仅为了提取数据而对系统进行大规模改造。相反，我们需要顺应系统当前的状态。正如我们在第\
  \ 101 页的“连接器”中所讨论的，连接器就是为此而来。\n\n数据引发了关于谁拥有数据、连接器以及内部和外部数据模型之间转换的讨论。对内部数据域的修改可能会损坏连接器，进而破坏下游数据产品的\
  \ SLA。中断和故障往往会推动补救需求，从而实现更清晰的职责分工。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_189_0.png)\n\
  \n在引导数据时，请务必明确谁负责流程的哪些部分，并确保各方了解各自的职责。重新谈判支撑数据网格的社会契约与技术考量同样重要。\n\n引导现有数据不仅仅是从可靠的单体架构中获取数据——数据可以存储在任何类型的数据库中，包括关系型、文档型、键值型、时序型、流式数据库以及云存储中的大型文件。尽管每种存储方式都不同，但获取数据通常分为两大类：定期查询数据库或追踪变更日志。最终，我们希望提取重要的业务数据，将其建模为对预期消费者有用的形式，并将其作为格式良好的数据产品发出。但在深入查询和变更日志之前，让我们先看看一种常见的反模式。\n\
  \n#### 双写\n\n如图 8-1 所示，双写是人们在开始使用事件驱动系统时最常见的做法之一。简而言之，应用程序所有者试图同时向数据库记录*和*事件流写入更新。然而，由于应用程序数据库和事件流是完全独立的数据存储引擎，两者之间没有原子写保证。\n\
  \n双写棘手的地方在于它们大多数时候都能正常工作。只要没有间歇性故障，你就不会遇到问题。但时不时会遇到问题——网络可能会超时，应用程序代码中可能存在 bug，事件代理或数据库可能会间歇性不可用，等等。如果你不针对这些特定故障模式进行测试和监控，通常会发现几周或几个月后某些关键数据从数据产品中丢失。而追溯到源头很可能会发现，短暂的间歇性中断导致事件丢失。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_190_0.png)\n\n*图 8-1. 数据库与事件流之间的双写*\n\
  \n虽然可以创建协调系统并引入两阶段提交来跨异构系统编排原子写保证，但这通常较为复杂，并且通常可以避免。本章剩余部分将探讨一些其他选项，帮助你找到更好的方法将数据写入事件流。\n\
  \n如果你不介意某些数据丢失，双写是可以接受的——例如，当你将测量值或其他形式的容错数据写入数据产品时。但在所有需要事件流中数据完整表示的其他场景下，你将希望使用基于查询的轮询、CDC\
  \ 或事务性外出箱表。让我们现在逐一查看这些方法。\n\n#### 通过轮询数据库创建数据产品\n\n数据库天生用于查询，我们可以简单地定期查询数据库，将结果转换为事件，并将其发布到事件流中。像\
  \ Kafka Connect 这样的工具就是专门为此目的构建的，既提供现成连接器套件，也提供编码和部署自有连接器的手段。\n\n当你能轻松识别自上次轮询以来哪些记录发生了变化时，基于查询的轮询效果最好。例如，updated_at\
  \ 或 modified_at 时间戳是常见选择，如 Kafka Connect JDBC 连接器所示。每次轮询循环启动时，它会使用上次循环中看到的最高 updated_at\
  \ 时间戳，并将其作为当前循环的最小时间戳输入。返回的行将转换为事件，连接器会更新其存储的 updated_at 时间戳以供下次循环使用。\n\n事件架构会根据查询结果的格式自动推断。如果上游数据库定义发生更改，并且该更改包含在查询结果中，则事件架构也可能随之更改。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_191_0.png)\n\n请确保连接器平台、连接器执行、连接器代码以及生成事件的所有者的所有权和职责明确。你和你的同事应该能够轻松识别在出现问题时应找谁沟通。\n\
  \n使用基于查询的轮询有几大优点：\n\n##### 查询灵活性\n\n数据库专门用于高效处理查询，因此查询数据库是将静态数据移入事件驱动数据产品的一种简便且低成本的入门方式。\n\
  \n##### 周期灵活性\n\n你可以根据需要以任意频率进行查询，以确保满足 SLA。\n\n##### 数据模型隔离\n\n你在内部数据模型和发布到事件流的数据产品模型之间获得了隔离。你可以创建视图和物化视图来反规范化数据模型，仅选择需要向外部发出的数据。\n\
  \n使用基于查询的轮询也有几大缺点：\n\n##### 数据库资源使用\n\n数据库查询在复杂性和性能使用方面可能非常庞大。你可能会发现，由于查询复杂性、结果量或常规操作负载，无法获得足够的性能来满足\
  \ SLA。虽然你可以在一定程度上通过只读副本来缓解此问题，但这会引入额外的成本和复杂性，并且并非所有数据库系统都提供此选项。\n\n##### 将错过硬删除\n\
  \n从数据库中硬删除的记录不会在查询中返回（毕竟它们已被删除）。你可能需要将数据库转换为使用软删除来跟踪删除操作。然后，你将不得不将软删除事件转换为墓碑，否则你的消费者将需要自行处理软删除。使用\
  \ CDC 可以克服这种复杂性。\n\n##### 将错过间歇性变更\n\n由于我们按特定间隔进行轮询，一个轮询与下一个轮询之间发生的多个变更在查询中只会显示为单个结果。如果你正在尝试\n\
  \n\n\n要捕获所有变更，您需要查看 CDC，如下一节所述。\n\n还有一点——当您将数据从数据库引导至事件流时，您可能需要通过称为“快照”的过程来摄入整个现有数据集。拍摄快照可能是一项资源密集型活动，因为您需要在进入迭代轮询循环之前，将待捕获数据中的整个数据集加载到事件流中。虽然对几千条记录进行快照很快，但对几十亿条记录进行快照必然需要花费更长时间。\n\
  \n由于操作要求，对数据库进行快照处理更加复杂。数据库通常在处理实时流量，不能中断或进入性能降级状态。但是，快照处理通常要求锁定相关表（或数据集），以防止在快照过程中发生任何新写入。根据数据库实现和数据大小，表可能只需锁定片刻，或者可能需要在整个快照过程中保持锁定。即使锁定时间很短，相关数据库的流量率可能非常高，以至于任何锁定都是完全不可接受的。\n\
  \n只读副本是避免在对数据库进行快照处理时出现操作障碍的常见解决方案。快照针对副本执行，副本的表在快照完成前均锁定写入（和复制）。接下来，副本表被解锁，排队的更新被应用到数据库表中。然后，快照连接器切换到基于\
  \ updated_at 时间的迭代更新模式。一旦赶上当前时间（或尽可能接近），连接器即可切换到指向主数据库，并拆除只读副本。\n\n基于查询的轮询和表锁定是将数据从数据库中导出的过时过程。虽然它仍然完全\
  \ *有效*，但使用 CDC 技术进行引导变得越来越普遍。此外，一些最近的创新使得无需锁定数据源即可获得最终一致的快照成为可能——但这依赖于访问数据库的变更日志。让我们来看看使用\
  \ CDC 以及这种解决方案如何为引导提供更好的解决方案。\n\n## 变更数据捕获\n\nCDC 是从数据库底层日志中捕获变更并将其转换为事件的过程。您可能会问，什么是日志？PostgreSQL\
  \ 具有预写日志（WAL），作为保持数据完整性过程的一部分——对数据库所做的更改首先写入持久的 WAL，然后再应用到底层数据模型。在发生数据库故障时，WAL 与已保存到磁盘的数据配合使用，确保不会丢失任何信息。\n\
  \n许多数据库提供对这些日志的编程只读访问——例如，MySQL 提供二进制日志，而像 MongoDB 这样的其他数据库则以更直接的方式提供 CDC 事件，而不是跟踪日志。CDC\
  \ 为构建您的数据产品提供了许多选项。\n\n首先，CDC 为您提供关于数据库中所做更改的*一切*信息。您的事件流将收到给定行或文档的每个更新，因此您不会错过任何状态转换。其次，CDC\
  \ 为您提供选项，以决定在事件中包含哪些字段以及特定元数据（例如有关连接器或数据库特定信息的元数据）。此外，您可以选择同时包含 before 和 after 字段，详细说明更改前的行或文档的完整状态以及更改后的完整状态。我们之前在第\
  \ 154 页的“Before/After State Events”中提及过这一点。\n\n有关您可以和不能做什么的更多信息，您需要查阅 CDC 或数据库的文档。例如，Debezium\
  \ 的 PostgreSQL 文档包含有关可用数据的完整描述以及如何配置连接器以仅选择所需内容的说明。\n\n一些 CDC 框架还提供了一种更高效地对特定数据库进行快照且无需锁定表的方法。正常的操作读取和写入可以继续不受中断，而生成的快照与当前表的状态最终一致。一篇\
  \ Debezium 博客文章解释了这一创新。它基于 Netflix 的一篇论文，该论文指出：\n\n> DBLog 利用基于水印的方法，使我们能够将事务日志事件与直接从表中选择的行交错，以捕获完整状态。我们的解决方案允许日志事件在处理选择时继续进展而不会停滞。选择可以随时在所有表、特定表或表的特定主键上触发。DBLog\
  \ 分块执行选择并跟踪进度，允许暂停和恢复。基于水印的方法不使用锁，对源的影响最小。\n>\n> ——Andreas Andreakis 和 Ioannis Papapanagiotou，Netflix\n\
  \n不阻塞操作用例的实时表快照对于引导事件驱动型数据产品是一大利好。快照机制可以配置为尽量减少资源使用，为活动激增留出足够空间，尽管这可能会导致快照完成时间更长。与此同时，在幕后，CDC\
  \ 系统将增量快照查询的结果与日志事件交错在一起，将其转换为事件并写入流中。\n\n快照完成后，CDC 进程将继续跟踪数据库的事件日志并将变更转换为事件。\n\n\
  ![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_194_0.png)\n\n近年来，CDC 越来越流行。许多数据库现在与流行的\
  \ CDC 工具提供原生集成，而一些云服务提供商拥有自己的完全托管连接器，这些连接器可直接将您的数据库与事件流挂钩，几乎不需要您进行任何操作。\n\nCDC 提供多项优势：\n\
  \n- **非阻塞快照**\n  CDC 可以在不干扰源数据库正常操作的情况下创建快照。\n\n- **性能损耗极小**\n  从数据库日志中捕获事件不会影响正常的操作性能。CDC\
  \ 服务在其专用资源上运行，仅需主机以跟踪输出日志的形式提供少量性能。\n\n- **延迟极低**\n  通过 CDC 创建事件非常快。对数据库表所做的更改通常会在一两秒内反映在关联的事件流中。\n\
  \n- **兼容硬删除**\n  硬删除会出现在数据库日志中，并随后转换为删除事件。删除还可以建模为墓碑事件，这样不再相关的实体可以从事件流和下游消费者的物化视图中完全删除（图\
  \ 3-12）。\n\n使用 CDC 也有几个缺点：\n\n- **内部数据模型暴露**\n  内部数据模型直接反映在数据库日志中，因此也反映在提取的事件中。与基于查询的更新不同，后者可以使用视图提供隔离，底层数据模型的隔离必须经过精心选择地管理。对内部数据库模型所做的完全有效的架构更改会反映到下游的事件架构中，并可能导致消费者出现故障。\n\
  \n- **高度规范化的事件流**\n  内部模型耦合导致镜像源关系的事件流。规范化的数据库表会产生规范化的事件流，并且通常要求消费者在使用前对数据进行反规范化。虽然跨数据流连接事件是可能的，但这仍然比在专为该目的构建的关系数据库内部解决连接更复杂、效率更低。我们将在第\
  \ 186 页的“Denormalization and Eventification”中更详细地讨论这一点。\n\n\n\n\n\nCDC 连接器相较于仅查询的连接器有了显著改进。它们降低了构建数据产品的门槛，并使开始使用事件流变得更加容易。然而，仍有改进空间，特别是关于进一步隔离内部数据模型与发布到外部世界的内容。接下来，让我们看看事务性外出箱模式。\n\
  \n## 使用事务性外出箱的变更数据捕获\n\n一个 *事务性外出箱* 是一个专用的数据库表，它充当要写入事件流的事件的临时输出缓冲区。当你更新 *内部领域模型*\
  \ 时，你只选择想要暴露给外部世界的数据并将其写入外出箱。然后，一个独立的异步进程（例如专用 CDC 连接器）会从外出箱中消费数据并将其写入事件流。图 8-2\
  \ 展示了端到端过程。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_195_0.png)\n\n*图 8-2. 使用事务性外出箱和专用连接器从数据库获取事件*\n\
  \n事务性外出箱模式是一种比仅捕获现有内部模型表更具侵入性的替代方案，因为它需要修改数据库和现有代码。首先，我们需要为要转换为事件的数据创建一个外出箱。最常见的选项是为每个领域实体创建一张表，并根据表的架构强制执行数据类型。\n\
  \n其次，我们需要修改应用程序代码，将相关内部实体更新封装在 *事务* 中。你的数据库必须支持事务，此模式才能正常工作。在事务中，你需要选择要暴露的数据并将其写入外出箱。最后，你可以关闭并提交事务。内部领域模型的更新要么原子性发生，要么完全不发生。\n\
  \n示例 8-1 的 Python 代码演示了在 MySQL 数据库中对 `EcomItem` 进行原子更新。内部模型更新在事务性外出箱更新之前执行，但两者均包含在单个事务中以保持一致性。\n\
  \n### 示例 8-1. 内部模型和事务性外出箱的原子更新\n\n```\ntry:\n    conn = mysql.connector.connect(host='localhost',\n\
  \                                    database='python_db',\n                   \
  \                 user='abellemare',\n                                    password='definitelynotpassword')\n\
  \    conn.autocommit = False\n    cursor = conn.cursor()\n\n    # Perform the internal\
  \ domain model update\n    internal_model_update = \"\"\"\n        Update EcomItem\n\
  \        set price = 1299.99\n        where id = 4291\"\"\"\n    cursor.execute(internal_model_update)\n\
  \n    # Select the subdomain of the internal model we want to write to\n    # the\
  \ transactional outbox\n    internal_sub_model_query = \"\"\"\n        Select name,\
  \ price\n        from EcomItem\n        where id = 4291\"\"\"\n    cursor.execute(internal_sub_model_query)\n\
  \    name_and_price = cursor.fetchone()\n\n    if (name_and_price == None):\n  \
  \      raise Exception(\"Unexpected missing record. Can't get name_and_price\")\n\
  \n    # Insert the selected data into the outbox\n    outbox_insert = \"\"\"INSERT\
  \ INTO EcomItem_Outbox (id, name, price)\n        VALUES (4291, %s, %s)\"\"\"\n\n\
  \    # Pass the name and price in to replace the query wildcards\n    cursor.execute(outbox_insert,\
  \ name_and_price)\n\n    # Commit the internal and outbox updates atomically\n \
  \   conn.commit()\n\nexcept mysql.connector.Error as error:\n    # reverting changes\
  \ because of exception\n    conn.rollback()\n\nfinally:\n    # Close the database\
  \ connection\n    if conn.is_connected():\n        cursor.close()\n        conn.close()\n\
  ```\n\n在此示例中，我们首先将 EcomItem 价格更新为 $1299.99。接着，我们从刚刚更新的表中选择名称和价格——我们至少必须查询名称，因为我们想要生成一个基于状态的事件，该事件包含我们刚刚更新的项目的所有当前状态。最后，我们将事件编写并以表\
  \ 8-1 所示的 EcomItem_Outbox 格式写入，就像处理任何其他关系型数据库表一样。\n\n### 表 8-1. EcomItem_Outbox\
  \ 表定义\n\n| ID | 名称 | 价格 | 日期时间 |\n|---|---|---|---|\n| 4291 | \"花哨笔记本电脑\" | 1299.99\
  \ | 2022-06-22 11:33:12 |\n\n关于我们的 SQL 表定义，有两点需要注意。其一，我们对事件中预期的每个强制字段都使用了 NOT NULL。除非满足所有约束，否则向外出箱插入新事件将会失败。其二，如果应用程序代码未提供\
  \ Datetime 字段，我们将默认使用 CURRENT_TIMESTAMP 填充该字段。你可以将此时间戳作为事件架构的一部分，或者使用它来填充事件的元数据，以指示事件创建时间。\n\
  \n确保内部模型、事务性外出箱表模型和事件架构兼容。使用预部署来确保内部模型更新能正确转录到外出箱表模型和事件架构，以避免易于预防的运行时错误。\n\n从外出箱获取数据可以使用本章前面讨论过的完全相同的技术来完成：要么通过轮询连接器直接查询外出箱，要么使用\
  \ CDC 连接器。\n\n你还需要不定期清理外出箱表。如果你使用基于查询的轮询机制，清理就像在将外出箱中的每一行写入事件流时将其删除一样简单。\n\nDebezium\
  \ 提供了一种名为外出箱事件路由器的全功能外出箱到 Kafka 主题机制。它防止从外出箱表传播 DELETE 事件，但可以通过将 route.tombstone.on.empty.payload\
  \ 设置为 true 来发送墓碑。此外，它会自动清理外出箱表，以防止其无限增长。\n\n尽可能使用开箱即用、免费可用的产品（如 Debezium）来简化你的数据网格之旅。大量的开发时间和测试时间已投入到其强化中，它将为你提供比大多数自建方案更加强大的解决方案。你最好将精力花在构建数据产品和建立自服务平台上，而不是试图重新发明\
  \ CDC 解决方案。\n\n某些数据库存储引擎允许你创建一张不将数据保存到数据库而改为将其写入数据库日志的表。MySQL 的 BLACKHOLE 存储引擎会简单地丢弃所有写入，但会将所有\
  \ INSERT、UPDATE 和 DELETE 操作保留到日志中。BLACKHOLE 存储引擎所需的磁盘 IO 很少，并且让你无需清理表，因为没有任何数据被写入其中。\n\
  \n使用事务性外出箱有许多优点：\n\n- 内部数据模型隔离：外出箱提供了内部数据模型与外部数据模型之间的隔离，允许两者独立演进。\n- 外出箱恰好一次语义：事务确保内部模型和外出箱数据要么一起创建，要么完全不创建。内部模型更新失败将阻止事件写入外出箱，反之亦然。测试你的代码并覆盖每条代码路径。\n\
  - 早期架构强制执行：外出箱表架构决定了事件架构。写入外出箱的所有事件都将符合事件流架构要求，从而显著降低出错的可能性。\n- 非规范化数据：你可以在事务期间选择对数据进行非规范化处理，以便下游消费者不必自己关联数据。我们将在“非规范化和事件化”第\
  \ 186 页中详细介绍这一点。\n\n通过事务性外出箱生成事件也有几个缺点：\n\n- 数据库必须支持事务：值得再次强调的是，你的数据库必须支持事务。如果不支持，你将不得不选择不同的数据访问模式。\n\
  - 应用程序代码更新：必须更新应用程序代码以启用此模式，这需要开发和测试资源。\n- 外出箱写入可能导致事务失败：由于向外出箱写入问题导致的事务失败也会导致向内部模型写入失败。这对你的用例可能无法接受，但可以通过在部署代码之前全面测试代码并验证事务性更新来轻松防止。\n\
  \n\n\n\n## 数据库性能影响\n\n对数据存储的性能影响可能非常显著，特别是当大量记录被写入、读取和从外发箱中删除时。这可能会对响应时间和客户体验产生负面影响。\n\
  \n外发箱在内部领域模型和外部事件模型之间提供了一个抽象层。我们可以利用这一层进一步对数据进行反规范化和重构，以满足数据产品消费者的需求。让我们更深入地探讨这一点。\n\
  \n## 反规范化和事件化\n\n规范化数据的主要目标之一是最小化冗余。然而，当存储的数据附加到一个可以根据需要轻松解析和反规范化它的处理引擎时，规范化效果通常最好。\n\
  \n一些消费者只需要一个信息量极少的、非常简单的事件驱动数据产品。另一些消费者可能希望包含大量关于实体的额外信息，并请求进行广泛的反规范化以获得扁平化结果。在一组事件流中处理反规范化比在一组表格中处理更具挑战性，因此我们非常有必要仔细考虑哪些内容应该进入反规范化事件流，哪些不应该。\n\
  \n例如，考虑以下关系型电子商务、商家和库存数据模型。表 8-2 中所示的 EcomItem 与表 8-3 中的 Merchant 表存在外键关系（merchant_id）。EcomItem\
  \ 还与表 8-4 中的 Inventory 表存在主键关系（inventory_id），后者包含当前库存中的商品数量。\n\n### 表 8-2. EcomItem\
  \ 表定义\n\n| id | name | price | merchant_id | inventory_id | updated_at |\n|---|---|---|---|---|---|\n\
  | 4291 | \"Mirage Block Set\" | 1299.99 | 4 | 44291 | 2021-03-22 13:05:00 |\n\n\
  ### 表 8-3. Merchant 表定义\n\n| id | name | premium_partner | updated_at |\n|---|---|---|---|\n\
  | 4 | \"Devin's Trading Cards\" | true | 2019-08-12 19:00:37 |\n\n### 表 8-4. Inventory\
  \ 表定义\n\n| id | quantity_in_stock | updated_at |\n|---|---|---|\n| 44291 | 3 | 2021-01-09\
  \ 07:33:13 |\n\n虽然这个模型是简化的，但你在许多在线电子商务市场平台上通常会发现类似的模型——例如 Amazon、eBay、Alibaba、Etsy\
  \ 和 Shopify 等企业。\n\nMerchant.premium_partner 指定商家是否已注册并支付了高级商务体验费用：更好的广告交易、首选广告投放位置和首选搜索结果位置。其他运营功能包括每个\
  \ EcomItem 上传视频和更多图片的能力、创建商品捆绑包，以及提供 AI 生成的自定义交易，以便为注重成本的客户找到令人满意的价格点。这些服务中的大部分都需要\
  \ EcomItem 信息来面向最终客户提供服务——但它们也都需要商家信息用于品牌和展示目的，以及确定商家是否需要 premium_partner 待遇。\n\n\
  由于这些流具有高度关系性，每个消费者服务都需要对 EcomItem 和 Merchant 执行相同的外键连接，以便将数据格式化为其业务用例所需的格式。图 8-3\
  \ 显示了一个小的消费者子集，每个消费者都需要消费并连接每个事件流。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_200_0.png)\n\
  \n图 8-3. 每个消费者都必须连接相同的数据来确定高级合作伙伴状态\n\n这种安排存在一些显著的缺点：\n\n- **重复处理** 每个消费者都需要自行执行这些连接。每个客户端都会有重复代码，并在连接上使用大致相同数量的资源。对于小型数据集，这可能无关紧要，但对于大规模数据处理（包括处理分区事件流），在处理资源方面可能变得非常昂贵。\n\
  \n## 客户端代码限制\n\n每个消费者客户端都需要能够自行解析连接。大多数可扩展流式连接解决方案（例如 Apache Kafka Streams、Flink\
  \ 和 Spark）基于 Java 虚拟机 (JVM)，但某些解决方案也支持 Python 和 SQL。然而，对于 Go、JavaScript、Ruby、Rust\
  \ 等其他流行编程语言，没有一流支持。你也可以使用专用关系数据库来解析连接，但你的客户端可能需要文档、键值、地理或时序数据库。\n\n事件化是一种实现模式，用于将高度关系性的流转换、反规范化和重塑为更适合事件驱动消费者的格式。在\
  \ DDD 术语中，我们正在将聚合根作为事件来创建。我们早先对使用 EcomItem 的评估表明，我们还需要包含关于商家的信息，尤其是其 premium_partner\
  \ 状态。同样，我们可以将库存信息视为聚合根范围之外，因为它很少被消费者在一两个特定用例之外使用。\n\n执行事件化时需要考虑几个因素：\n\n### 消费者需求和用例\n\
  \n提高易用性是事件化的主要目标，需要了解消费者的需求。聚合根以易于访问且随时可用的格式提供必要的核心信息，因此消费者无需自己单独、重复地完成这项工作。\n\n\
  ### 反规范化程度\n\n反规范化数据的多少取决于消费者用例以及数据的大小和变更频率。我们将在第 192 页“事件中应该包含什么？以及哪些应该保留？”中更详细地介绍此问题。\n\
  \n### 用于关联流连接的键\n\n正如我们在第 82 页“事件流键控和分区”中讨论的那样，事件化期间选择的事件键应便于对其他事件流进行连接。请确保你的事件键以一种方式进行设置，使其与大多数消费者不需要的关联流进行连接时兼容。库存就是这样一个流的示例。\n\
  \n### 构建外部数据模型\n\n事件化为你提供了转换和标准化数据的机会，并可以隐藏内部数据模型的部分内容，避免其与下游系统耦合。生成的反规范化和重塑架构将成为数据产品\
  \ API 的一部分。\n\n可以在两个主要领域实现事件化模式：写入外发箱表时，以及使用专用服务连接规范化流时。让我们逐一探讨这些方法。\n\n## 事务性外发箱中的事件化\n\
  \n一种选择是在将数据写入外发箱之前，先选择内部模型数据并对其进行反规范化。如果我们采用第 182 页“使用事务性外发箱的变更数据捕获”中的示例代码，可以对其进行调整，添加一个查询来选择和连接\
  \ EcomItem 和 Merchant 数据，然后将其重塑为外发箱表的外部模型。示例 8-2 展示了将关系型数据重塑为更合适的反规范化事件格式的代码示例。\n\
  \n### 示例 8-2. 写入外发箱前的事件化\n\n```\n...\n#### Assume that we have just updated the\
  \ internal model\n#### Next, we select fields from the internal model and denormalize\
  \ it\n#### by joining against the Merchant table.\ninternal_model_query = \"\"\"\
  \nselect e.name, e.price, m.name as merchant_name, m.premium_partner\nfrom EcomItem\
  \ as e, Merchant as m,\njoin on e.merchant_id = Merchant.id\nwhere e.id = 4291\"\
  \"\"\n\ncursor.execute(internal_model_query)\nresult = cursor.fetchone()\n\n####\
  \ Create the insert statement for the outbox table\noutbox_insert = \"\"\"\nINSERT\
  \ INTO\nEnriched_EcomItem_Outbox (id, name, price, merchant_name, premium_partner)\n\
  VALUES (4291, %s, %s, %s, %s)\"\"\"\n\ncursor.execute(outbox_insert, result)\n####\
  \ Commit the internal and outbox updates atomically\nconn.commit()\n...\n\n```\n\
  \n在此代码片段中，我们在应用程序创建或更新 EcomItem.id=4291 的数据时，为 Enriched_EcomItem_Outbox 创建一个条目。内部关系模型仍然在数据库中封装，而外发箱提供了一个更适合事件驱动消费者的数据模型。但是，当商家数据发生变化时该怎么办呢？考虑一位决定支付高级合作伙伴状态的商家。\n\
  \n\n之前创建的所有 Enriched_EcomItem 事件都必须 *也* 更新，以反映当前的高级状态。如果不这样做，意味着事件流将永久不准确，不再反映现实，这可能会导致下游消费者在响应和处理该商户数据时出现问题。简单来说，如果您打算反规范化数据，那么每当\
  \ *任何* 字段发生更改时，您都需要更新事件。无论您以何种 *方式* 反规范化数据，无论是使用内部 outbox 表还是专用事件化服务，这一点都适用，正如我们将在下一节中看到的那样。\n\
  \n事务性 outbox 表作为一种低开销的方式来隔离内部和外部数据模型，效果非常好。如果您的源数据位于关系数据库中，依靠数据库引擎快速高效地将数据反规范化为事件友好格式，而不是让每个消费者自行处理，这非常容易。通过使事件流易于使用，您可以改善消费者的数据产品用户体验，帮助他们专注于使用数据，而不是与数据作斗争。\n\
  \n然而，并不总是可以将 outbox 表构建到数据库中，更不用说在事务中反规范化数据了。除了根本不支持事务的数据库之外，没有积极开发的旧系统以及对性能有严格要求的系统可能不合适。当事务性\
  \ outbox 不可行时，最好考虑在源域之外的专用服务中进行事件化。现在让我们来看看这一点。\n\n## 专用服务中的事件化\n\n在源数据库 *之外* 进行事件化需要一个专门构建的微服务或流\
  \ SQL 应用程序。例如，图 8-4 展示了一个专用事件化服务的高级概览，它将 `EcomItem` 和 `Merchant` 数据合并在一起，形成一个用于下游使用的单一丰富流。像\
  \ Apache Kafka Streams 和 Flink 这样的事件驱动处理技术为合并数据提供了简单的高级框架。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_203_0.png)\n\
  \n*图 8-4. 在专用服务中使用 CDC 事件流进行事件化*\n\n以 Kafka Streams 为例——如果我们使用上一节中相同的 `Merchant`\
  \ 和 `EcomItem` 模型，我们可以创建一个简单的 Java 应用程序，将两者合并为一个基于状态的事件。代码大致如示例 8-3 所示，不过您也可能希望查看一个功能齐全的示例：\n\
  \n### 示例 8-3. 将 EcomItem 与 Merchant 数据合并并丰富的 Kafka Streams 微服务\n\n```\npublic Topology\
  \ buildTopology(Properties envProps) {\n    //Configuration code not shown for brevity\n\
  \    //Create the Serdes\n    MerchantSerde merchantSerde = new MerchantSerde(...);\n\
  \    EcomItemSerde ecomItemSerde = new EcomItemSerde(...);\n    EnrichedEcomItemSerde\
  \ enrichedEcomItemSerde = new EnrichedEcomItemSerde(...);\n\n    //Create the application\
  \ builder and create two tables.\n    KStreamBuilder builder = new KStreamBuilder();\n\
  \n    //A KTable is the materialization of a state-modeled event stream\n    KTable<Long,\
  \ Merchant> merchantTable =\n        builder.table(Serdes.Long(), merchantSerde,\
  \ merchantTopic);\n    KTable<Long, EcomItem> ecomItemTable =\n        builder.table(Serdes.Long(),\
  \ ecomItemSerde, ecomItemTopic);\n\n    ecomItemTable\n        .join( merchantTable,\n\
  \            EcomItem::getMerchantId,\n            new EcomToMerchantJoiner() )\n\
  \        .toStream()\n        .to(enrichedEcomItemTopic, Produced.with(Serdes.Long(),\
  \ enrichedEcomItemSerde));\n\n    return builder.build();\n}\n```\n\n示例 8-4 中展示了\
  \ EcomToMerchantJoiner 类。它通过扩展 ValueJoiner 类指定如何将两个实体合并在一起。\n\n### 示例 8-4. 连接器服务用于填充\
  \ EnrichedEcomItem 的 EcomToMerchantJoiner 定义\n\n```\npublic class EcomToMerchantJoiner\
  \ implements\n    ValueJoiner<EcomItem, Merchant, EnrichedEcomItem> {\n    public\
  \ EnrichedEcomItem apply(EcomItem e, Merchant m) {\n        return EnrichedEcomItem.newBuilder()\n\
  \            .setId(e.getId())\n            .setName(e.getName())\n            .setPrice(e.getPrice())\n\
  \            .setMerchantName(m.getMerchantName())\n            .setPremiumPartner(m.getPremiumPartner())\n\
  \            .build();\n    }\n}\n```\n\n或者，如果您想进一步简化，可以依赖类似 Flink SQL 的东西，使用非常简单的类\
  \ SQL 查询来完成相同的操作。示例 8-5 展示了使用 Flink SQL 将相同实体合并在一起的更简单方法。\n\n### 示例 8-5. 事件化服务的\
  \ Flink SQL 版本\n\n```\nSELECT *\nFROM EcomItem\nINNER JOIN Merchant\nON EcomItem.merchantId\
  \ = Merchant.id\n```\n\nSQL 层使解决流式连接和反规范化实体变得更加容易，并将自助服务平台功能开放给非 JVM 开发人员。简单的 SQL\
  \ 层非常适合事件化的目的，因为我们并未执行任何复杂的业务逻辑，只是解决连接并发出丰富的实体。\n\n使用外部事件化微服务有几个显著优势，包括：\n\n- 减少对数据库资源的需求\n\
  - 简化源域的应用程序逻辑\n\n但是，也有一些挑战需要处理：\n\n- 同步数据库表、连接器和事件化微服务的更改\n- 寻找一个强大的流连接器框架；只有几种选择，而且它们都是基于\
  \ JVM 的\n- 争论微服务的所有权（提示：域所有者负责构建有用的数据产品）\n\n无论您选择在源数据库内部、在数据库外部使用专门构建的微服务，还是在消费者本身反规范化业务实体，考虑对消费者的影响都很重要。专注于为您的消费者使域数据尽可能易于使用，并共同努力制定一个各方都能接受的解决方案。\n\
  \n## 事件中应该包含什么？以及什么应该保留在外？\n\n确定事件中应包含哪些数据和应排除哪些数据需要进行微妙的权衡。有几个因素会影响这一决定。消费者需求、更新频率、数据大小以及由此产生的总负载都是需要考虑的因素。\n\
  \n让我们考虑一下我们电子商务示例的扩展。EcomItem.inventory_id 指定了与 Inventory 数据（表 8-4）的关系，指明库存中有多少件该商品。\n\
  \n每当库存发生变化时，例如由于销售、退货或收到货物，库存域可以发出带有更新库存的新状态事件。对于变化极其频繁的产品（想想黑色星期五“门槛破产”销售），您可能会面临大量的库存事件。虽然只发布事件样本仍然是一个有效的选择，但您会失去对确切发生情况的准确性，同时增加事件发生和消费者响应事件的能力之间的延迟。\n\
  \n如果将 EcomItem 与 Inventory 连接（EcomItem.inventory_id = Inventory.id），那么每次 Inventory\
  \ 更新都会触发对物化 EcomItem 表的相应连接。这可能会产生大量事件，而不关心库存数量的消费者将被无关紧要的更新所淹没。\n\n同样，请考虑一个包含给定\
  \ EcomItem 前 100 条评论的 Reviews 聚合数据产品。虽然这些数据可能不会频繁更改，但将其与 EcomItem 连接意味着，每当我们更新 Reviews\
  \ 或 EcomItem 中的任何一个时，我们也会重新发出包含前 100 条评论的整个负载。就像频繁更新一样，许多消费者可能根本不关心内容，但仍然需要处理流中传输的非常大的数据大小。\n\
  \n最后，您可能会发现，您既有一个流中变化率非常高的数据，又有另一个流中负载大小非常大的数据。将两者连接在一起意味着您现在将拥有变化率很高的 _大量_ 数据。这可能会对您的事件代理、事件化流程和消费者产生叠加的高负载。\n\
  \n您需要通过与消费者交谈并与联邦治理团队合作，为您的数据产品找到适当的平衡点，以制定一些准则，帮助您的同行做出类似决策。\n\n作为一般规则，避免连接频繁变化或大小非常大的数据。您最好将这些组件留在丰富事件之外，并让消费者选择将其集成到自己的服务中。当然，您始终可以创建一个将\
  \ Inventory 作为 EcomItem 一部分的新数据产品。\n\n## 缓慢变化维度\n\n让我们继续我们的电子商务示例。我们看到，对于给定的 Merchant\
  \ 有许多 EcomItems，如果我们想要反规范化 EcomItem.merchantId 数据，我们就必须与 Merchant 进行连接。然而，Merchant\
  \ 数据可能很长一段时间都不会更改，尽管它当然 _可能_ 随时更改。\n\n\n\n\n\n这种类型的数据被称为缓慢变化维（SCD），通常是静态的，但可能会不可预测地变化。SCDs\
  \ 长期以来一直是数据仓库和数据湖模型的领域，被有意建模用于处理跨越广泛时间范围的大型分析查询。但是，我们如何对它们进行建模？它们对我们的数据产品会有什么影响？\n\
  \n虽然存在众多 SCD 子类型分类，但与数据产品最相关的是 Type 1 和 Type 2 数据模型方法。让我们仔细看看每一种，了解它们如何影响我们构建数据产品的方式。\n\
  \n## Type 1: 使用新值覆盖\n\n使用 Type 1 建模时，仅保留最近的值。假设我们有一个没有高级状态的商家，如表 8-5 中的账户所示。如果该商家决定支付高级状态费用，我们需要生成一个新的实体事件来覆盖先前的事件。\n\
  \nTable 8-5. Type 1: The first state event of Devin’s Trading Cards\n\n| id | name\
  \ | premium_partner | updated_at |\n|---|---|---|---|\n| 4 | \"Devin's Trading Cards\"\
  \ | false | 2010-04-22 23:15:01 |\n\nTable 8-6 显示了将 premium_partner 设置为 true 的更新商家实体事件的结果。\n\
  \nTable 8-6. Type 1: Updated premium status for Devin’s Trading Cards\n\n| id |\
  \ name | premium_partner | updated_at |\n|---|---|---|---|\n| 4 | \"Devin's Trading\
  \ Cards\" | true | 2019-08-12 19:00:37 |\n\n先前的记录不再需要，事件代理可以在稍后的时间压缩掉旧事件。虽然您可以选择保留数据更长一段时间，但\
  \ Type 1 维度建模不考虑变更历史记录——这时 Type 2 就派上用场了。让我们来看看。\n\n## Type 2: 追加新值\n\n使用 Type 2\
  \ 维度建模时，Merchant.premium_partner 的变更值会被追加并与一个新的状态事件集成。事件消费者可以访问该字段的先前版本，并可用于确定实体在特定时间点的状态。例如，根据商家的\
  \ premium_partner 状态，构建一段时间内的参与度分析。同样，同一事件还提供用于运营目的的最新 premium_partner 值，确保服务其内容的端点为商家提供适当的高级待遇。\n\
  \nTable 8-7. Type 2: Updated Merchant data is appended to the event, complete with\
  \ version IDs for previous updates\n\n| id | name | premium_partner | updated_at\
  \ | version |\n|---|---|---|---|---|\n| 4 | \"Devin's Trading Cards\" | false |\
  \ 2010-04-22 23:15:01 | 0 |\n| 4 | \"Devin's Trading Cards\" | true | 2019-08-12\
  \ 19:00:37 | 1 |\n\nType 1 和 Type 2 SCD 建模策略都可以支持运营和分析用例。运营用例通常只关心最新值——当发生变更时，运营系统可以对新状态事件做出反应并相应采取行动。分析系统往往需要数据历史记录，包括字段变更的时间，以便根据这些属性构建准确的聚合。\n\
  \n状态事件的默认选择通常是 Type 1 建模——您的应用程序仅发布最新数据，由事件流提供先前值的历史记录。您的消费者模型需要选择在其自身域数据存储中保留先前的值。\n\
  \nType 2 模型迫使消费者考虑 SCD 的影响，因为状态事件数据模型包含先前值的完整历史记录。如果消费者只想要最新值，它仍然需要显式地从历史记录中选择。因此，尽管\
  \ Type 2 模型更加冗长，并且对消费者来说需要多一些开销，但它们降低了消费者忽略变更历史记录的可能性。\n\n在结束本章之前，让我们再看一个必要事项：将云存储（HDFS、S3\
  \ 等）中存储的文件中的数据提取出来，加载到事件流中。\n\n## 将云存储文件引导至事件流\n\n连接器允许我们从事件流中获取数据，将其重新组合为文件，并将其写入云存储，以便与现有的批处理管道连接。但是，如果我们想要做相反的操作，即获取存储在云存储中的数据并将其加载到事件流中，该怎么办呢？迁移到事件驱动的数据网格不会一蹴而就，将现有静态数据引导至事件流是一个重要的选项。\n\
  \n批次计算数据长期以来一直是许多数据分析平台的主流。数据通常结构化为一组大型文件，采用 Parquet 等列式格式。这些数据由定时作业定期计算，该作业读取输入数据批次，对其进行处理，并将结果数据批次写回云存储。批次计算数据通常也基于时间进行分区，通常与小时、天、周和年等自然周期对齐。\n\
  \n我们可以将静态数据载入事件驱动数据产品的主要方式有几种。这些选项包括：\n\n- Refactoring the job to produce events\n\
  \n此选项要求您的作业语言中可用事件生产者客户端。您只需在作业中包含事件代理生产者代码，使其同时写入云存储 *和* 事件代理即可。此方法确实引入了双重写入风险，如前所述，在第\
  \ 176 页“双重写入”中所述。\n\n- Writing to broker after job completes\n\n由于您已经在使用定时批处理作业，可以简单地添加一个步骤来读取新数据、将其转换为事件，并将其写入事件代理。此方法的一大好处是，您可以使用任何想要的技术或语言。您的初始作业可能是一个您不愿碰触的旧\
  \ Apache Pig 工作流，而您的事件代理作业可以是另一种语言中非常简单且精简的应用程序。缺点是，您需要再次将数据读入内存，这会增加成本和延迟。\n\n\
  - Using a connector\n\n您还可以使用连接器来简单地监听新文件和文件夹的创建。例如，*此 Kafka 连接器* 可以从 S3 存储桶中读取采用\
  \ Avro、Parquet、CSV、文本、JSON 或二进制/字节信息格式的文件，并将数据写入 Kafka 主题。此选项允许您依赖现有的批处理作业来创建数据，并依赖自助服务连接器将这些数据带入事件流。从这里开始，您可以开始将数据重新建模为格式良好的数据产品。\n\
  \n将数据引导至事件流是迈向事件驱动数据网格的一大步。这些引导的流通常对于运营用例来说太慢，但通常足以将基于批处理的分析作业过渡到流式应用程序。您的消费者将能够为所有数据源使用单个流式协议，而不是混合使用各种云和流式协议。\n\
  \n一旦将批处理数据引导至事件驱动数据产品，就开始向消费者征求反馈。一旦他们习惯了使用流，可能会要求您将数据产品提升到实时速度。通过遵循数据即产品原则，您可以规划工作、确定优先级，并构建数据管道路线图以迁移至实时流。\n\
  \n## 摘要\n\n数据网格建立在现有系统和数据存储的基础之上。将来自现有来源的数据引导至初步数据产品是构建成功数据网格的重要步骤。许多现有系统和数据源将保持原样，没有真正的机会进行大规模重构并重新创建为新事物。至关重要的是，我们能够满足这些系统的现状，以最小的麻烦提取数据。\n\
  \n连接器在自助服务引导过程中发挥着关键作用。它们实现了将数据提取为流形式的基本目标，在此基础上，您可以开始协商数据产品的更精细要点：延迟、事件大小、反规范化和更新频率。确切放入什么和省略什么因消费者的需求而异。与他们交谈，与他们合作，并对您的产品进行迭代。\n\
  \n但是，如果您不希望通过事件流提供所有数据产品，该怎么办？如果您由于第三方 API 和现有批处理数据的巨大惯性而无法做到，该怎么办？下一章将探讨这些问题，并讨论如何将非事件驱动的数据产品集成到您的数据网格中。\n\
  \n\n\n\n"
- "## 将事件驱动数据集成到静态数据中\n\n事件驱动的数据产品为消费者提供了卓越的灵活性，但它们可能并不适合每个用例。现有系统和依赖关系在任何架构中都扮演着重要角色，转向数据网格取决于在支持现有用例的同时推动渐进式变革。许多系统、处理作业和计算高度依赖静态数据，尤其是分析领域中的系统。\n\
  \n在本章中，我们将重点介绍将事件驱动数据集成到静态数据中。我们将探讨奖牌架构及其在现代数据分析工作流中的作用。我们将探索策略和权衡，以确定何时将事件流转换为静态文件批次。最后，我们将查看一个现实世界示例，将理论与实践相结合。让我们开始吧。\n\
  \n### 分析与奖牌架构\n\n变革最好的方式是首先站在用户的角度去满足他们。基于批次的数据分析管道和工作流在大多数行业中非常常见，许多组织在基于批次的数据工程、数据科学、数据分析和报告工作流上投入了大量资源。“数据产品是多模态的”在第\
  \ 31 页介绍了多模态数据产品的概念，但迄今为止我们主要使用事件流。虽然事件流通常是驱动运营和实时分析用例的最佳选择，但我们仍需要与基于批次的工作流集成。\n\
  \n图 9-1 展示了使用在第 79 页“数据质量分类”中引入的奖牌术语的典型端到端数据分析管道分布。\n\n一般而言，数据工程师从源中提取（E）数据，将其加载（L）到暂存区，并执行任何必要的初始转换（T）——这是一个\
  \ ELT 过程。这个 *铜层数据* 然后供给管道的下一步，进一步清理和标准化数据，并将其组合成更高质量的 *银层数据* 格式。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_213_0.png)\n\
  \n图 9-1. 跨多个团队的典型批次数据处理工作流\n\n银层数据随后可能会进一步处理和聚合成金层数据集，代表最高质量级别，通常构建用于服务单一业务功能。它也可以按原样用于构建业务特定的聚合，这些聚合不属于可供他人使用的奖牌分级数据集。\n\
  \n数据分析师依赖于建模良好的银层和金层数据（以及 SLA 和支持），将其摄入商业智能（BI）和分析工具。在此，他们执行分析、编写报告，并影响数据驱动的决策。\n\
  \n将事件驱动的数据产品集成到现有批次数据工作流中，是一场酸性测试，用来检验你的数据网格是否真正是一种新数据沟通方式的基础，还是仅仅服务于有限子集的另一种临时机制。图\
  \ 9-2 说明了如何将事件流作为批次数据工作流的源进行集成，而不是使用现有的专用构建代码。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_213_1.png)\n\
  \n图 9-2. 使用事件流和连接器为现有工作流提供动力\n\n你可能首先会注意到，数据工程团队不再可见——他们现在正在构建数据网格的自助服务平台并支持其采用。此外，确保数据质量和标准化的工作已上游推送给数据产品所有者。数据科学家或分析工程师可能仍参与构建数据产品，尽管他们的参与并非强制性的。\n\
  \n图 9-2 中数据产品用户的其余职责涉及创建和配置将事件驱动数据沉入云存储的连接器。自助服务平台应该为他们提供所需的一切，以满足他们自己的连接器用例，如第\
  \ 101 页“连接器”中所述。\n\n事件驱动的数据产品让我们移除自定义构建的点对点数据管道作业，这些作业通常连接一个系统到另一个系统。但这要求我们以消费者基于现有作业已经期望的格式和频率提供数据。让我们在下一节中看看这个问题。\n\
  \n### 将事件流连接到现有批次数据流\n\n数据流很少简单干净——它们通常是层层堆叠的不令人满意的妥协、“临时”解决方案变成永久方案，以及黑客式的变通方法，最终支持关键业务用例。代码库中散布着\
  \ \"TODO–临时黑客！修复这个！\"，古老的积压工单详细说明需要实施的必要更改，通常由已经离开组织的人编写。简而言之，数据流看起来很像任何其他应用程序的代码——但它们也分布在多个作业中，涉及多样化的框架、语言和数据库。\n\
  \n正如构建数据网格的自助服务平台是一个渐进式过程一样，将数据产品连接到现有基于批次的数据流也是如此。首先，而且最重要的是，你不会在不久的将来重构和替换多年精心打造的业务逻辑。在许多情况下，你甚至不应该尝试。没必要仅仅为了变革而尝试更改那些已经足够好用的东西。相反，你应该将精力集中在要么对坏数据敏感，要么需要比现有数据流支持的速度快得多的结果的关键业务用例上。\n\
  \n集成事件流数据产品需要消费事件，将它们转换为合适的格式（例如 Parquet），并将它们沉入云文件系统。我们的集成策略是用来自专用构建数据产品的新数据集来替换批次创建的数据集。但这不是我们需要做的唯一事情。事实上，最好看一个示例来了解这个策略在实践中如何运作。\n\
  \n考虑一家电子商务和广告平台公司，它为其业务合作伙伴提供付费推广广告服务。业务合作伙伴创建广告活动、分配预算，并相互竞标以获得向最终用户展示其广告的权利。广告平台公司必须为其业务合作伙伴提供计费结果和洞察报告。毕竟，他们想知道他们的广告效果如何、谁在点击广告，以及他们欠多少钱。\n\
  \n然而，存在一个问题。业务合作伙伴经常收到财务团队的账单，这些账单与分析团队报告的互动不匹配。例如，合作伙伴可能被账单为 1,200 次独特互动，但他们的分析报告仅显示\
  \ 1,154 次独特互动。这是怎么回事？让我们看看多年来积累的数据流，以了解复杂性以及错误可能在哪里混入。\n\n图 9-3 展示了端到端流程，从摄入和解析分析服务器日志中的原始数据（1）开始。数据每\
  \ 15 分钟从服务器日志中提取（2），转换为粗糙的非结构化批次文件，并加载（3）到云文件系统中作为基本 HTTP 日志事件。接下来，一个每 15 分钟启动一次的定期作业处理之前\
  \ 15 分钟的数据，清理它，标准化字段，并根据用户操作（例如点击、查看、滚动）将其发出到不同的数据集（4）。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_215_0.png)\n\
  \n图 9-3. 批次计算的互动和预算报告不一致\n\n因此，我们想要获取如下形式的服务器日志事件批次：\n\n```\n42.241.222.101 - -\
  \ [22/Jan/2021:23:27:13 +0000] \"GET /ad/1312412323?a=click&b=29&id=A675E098&device=iPhone12\
  \ HTTP/2.0\" 200 5316 \"https://sample.domain.com/\" \"Mozilla/5.0 (Windows NT 6.1)\
  \ AppleWebKit/537.36 (KHTML, like Gecko) Chrome/72.0.3626.119 Safari/537.36\" \"\
  2.75\"\n```\n\n并将它们转换为具有如下表格模式的良好结构数据批次：\n\n| long | string | datetime | int | string\
  \ | enum |\n|---|---|---|---|---|---|\n| adId | userId | datetime | bidInCents |\
  \ url | device |\n| 131241232 | A675E09 | 22/Jan/2021:23:27:13 +0000 | 29 | sample.domain.com/\
  \ | iPhone12 |\n\n接下来，我们从广告和预算数据库（5）获取数据，并将其 ELT 到云文件系统上可用的数据集（6）。这个作业每 60 分钟启动一次，创建预算数据的完整快照，包括自上次运行以来未更改的任何行。\n\
  \n财务团队（7）和分析报告团队（8）都从同一组点击事件开始工作——这是一个好做法，我们将在本章后面再次提及。但每个团队独立于另一个团队行动，报告差异（9）就可能在此处混入，导致困惑，不知道哪个报告（如果有的话）是正确的。\n\
  \n首先：用户会话定义。每个团队以自己的方式计算用户会话。虽然两个团队都知道广告仅在会话内是唯一的，但每个团队用于计算会话的精确业务逻辑各不相同。一种常见定义依赖于\
  \ 30 分钟超时——只要用户在该 30 分钟内执行某种活动，会话将保持打开。但另一种常见做法是在午夜截止点切断会话，在午夜关闭会话，并在之后立即打开另一个会话。\n\
  \n财务团队遵守午夜截止点——毕竟，这是获取另一个可计费事件的好方法，也是一种相当标准（尽管过时）的做法。与此同时，分析报告团队仅使用 30 分钟超时。这是差异之一。\n\
  \n第二：独特用户归因。分析团队很早就开始了，并且多年来一直在努力识别独特用户。账户 ID、电话号码、设备 ID，以及最近的 iOS 和 Android 广告\
  \ ID，使识别和标记独特用户的合法性和逻辑变得复杂。相比之下，按推广付费广告的计费相对较新——但他们认为独特识别仅仅是使用设备广告 ID 的问题。毕竟，“每个人都知道”这就是你应该做的。\n\
  \n\n\n\n最终结果是，两个团队都拥有经过单元测试验证的明确定义的业务逻辑，能够根据其测试用例识别唯一用户，并输出相当准确的结果。当然，它们的结果可能不一致，但误差仅几个百分点。这就是第二个差异。\n\
  \n难怪会出现一些问题，而且还有许多其他更微妙的领域可能会出现问题，但这两点足以供我们分析。虽然我相信你可能已经在构思解决方案，但让我们退后一步，透过数据网格的视角来看看问题出在哪里。\n\
  \n## 透过数据网格的视角：发生了什么？\n\n首先，这些原始数据集不是数据产品。它们不是专门构建的，也没有使用明确定义的结构创建，也没有要求满足下游消费者的特定需求。日志只是尽力而为地提取并解析成一批数据。结构是事后由既不拥有数据也不拥有发出数据的应用程序的人员添加的。\n\
  \n其次，缺乏领域所有权。用户应该如何询问数据的含义？虽然你可能能够与拥有广告和预算数据库的团队交谈并从他们那里得到答案，但你很难从编写前端服务的应用程序开发人员那里获得关于引导式nginx日志的清晰解释。没有数据产品负责人。没有官方联系点。向下游用户的沟通几乎完全基于部落知识和对当前已注册数据管道的手动调查。上游数据的变更只有在下游消费者的作业中断时才会被发现。\n\
  \n第三，缺乏领域负责人和数据产品负责人已经培养了一种保护主义和孤岛化的文化。既然上游数据集容易出现突然和意外的破坏性变更，为什么还要依赖它们呢？最好从尽可能接近源头的地方获取数据，这样别人就无法破坏你的数据。只依赖自己团队的工作，并尽量减少对他人的依赖。虽然你公司的同事肯定都是出于好意，但你了解你的直接队友，并与他们紧密合作，以确保你的数据流正常运行。\n\
  \n最终结果是一种被动、保护和孤立主义的文化，这并非源于恶意或疏忽，而是由于完全缺乏成文的职责和角色。\n\n## 透过数据网格的视角：如何解决？\n\n让我们回头看看图9-3。我猜你首先想到的可能是，我们应该将(7)和(8)中的重复逻辑推回上游，在一个共同位置执行会话构建和唯一用户识别。如果是这样，你的直觉是正确的。让我们看看图9-4，看看当这个工作流由事件驱动的数据网格驱动时可能是什么样子。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_218_0.png)\n\n图9-4. 与事件驱动的数据产品集成并将公共计算逻辑推回上游\n\
  \n首先需要注意的是，点击事件(1)已被提升为源对齐数据产品，并通过事件流提供。这次转换相当简单，只需要在点击事件发生时从分析服务器原生生成它们即可。当数据已经完全可用时，无需解析nginx日志。领域所有者接受了数据产品负责人的职责，并承诺创建一个点击事件数据产品。一旦数据开始流动，它就会保持流动，当我们将其连接(2)到云存储时，可以简单地将其减速为15分钟批处理格式文件。\n\
  \n源对齐点击流数据产品的架构指定如下：\n\n```\nKey: String, //user_account\nValue: {\n    user_account:\
  \ String,\n    utc_timestamp: Datetime,\n    ad_id: long,\n    page_id: String,\n\
  \    bid_in_cents: int\n}\n```\n\n接下来，我们召集了财务团队和分析报告团队的代表共同制定通用的唯一用户和会话创建逻辑。我们从他们的领域中提取了现有的业务逻辑，将其统一，并为两者制定了共同定义。由于他们的用例都需要会话和唯一性，这两个步骤都在单个进程(3)中发生，数据每15分钟以批处理方式发出(4)。请注意，如果我们决定将(4)中的数据视为聚合对齐数据产品，我们需要指定一名数据产品负责人，并确保遵循所有通用的数据产品管理和元数据要求。\n\
  \n每小时参与度报告(5)已更新，以从(4)中的共同数据获取数据。虽然每小时参与度报告仍会根据自身要求重塑数据，但它不会对唯一用户或会话分类做出决策。竞价系统(6)暂时保持不变。它继续从分析报告团队接收每小时预算支出输入。\n\
  \n预算报告(7)继续依赖于与广告和预算数据库关联的ETL作业批处理创建的每小时数据快照。为什么不升级到事件驱动的数据产品？因为在我们示例的约束下，根本没有业务需求进行此更改——基于批处理的预算文件创建工作已经足够好，且没有引起任何问题。\n\
  \n实施数据网格是一个渐进的过程，识别哪些问题领域最能从数据即产品中受益非常重要。在理想世界中，我们希望每个数据源都是一个形成良好的数据产品，且没有任何重复的业务逻辑，但现实是，我们需要在哪里投入时间和精力方面进行选择。\n\
  \n## 平衡文件大小、SLA和延迟\n\n在将事件流中的事件驱动数据产品集成到批处理中时（特别是写入云文件系统时），需要解决一些技术问题。以下是你需要考虑的主要因素：\n\
  \n### 执行数据格式转换\n\n事件架构通常不适合现代大数据处理，因此你需要将事件转换为具有合适架构格式的文件块。虽然Avro和Protobuf仍然是事件流的常见选择，但列式格式（如Parquet）对于云文件系统来说通常是最常见的，因为它们对于批处理工作负载提供的性能处理远高于以事件为中心的Avro和Protobuf格式。\n\
  \n### 处理架构演进\n\n架构演进会给情况增加一些复杂性。通常，每个事件演进都需要自己的文件，因为列式格式架构是基于每个文件确定的。因此，版本1事件进入版本1文件，而版本2事件进入版本2文件。事件流中的架构越多，你最终在云文件系统中会得到的文件就越多。\n\
  \n### 平衡文件大小与延迟\n\n你的下游消费者在文件写入云文件系统之前无法使用数据。如果你想尽量减少事件发生到其在云文件系统中出现之间的延迟，你最终会频繁写入大量小文件。延迟会相当低，但想要加载和处理这些数据的应用程序会又慢又低效。云文件系统的一个主要问题是，它们需要为正在加载的所有数据协调架构——而拥有大量小文件会导致处理时产生大量开销。或者，你可以选择仅在文件达到一定大小（例如100\
  \ MB）或一定时间边界（例如每小时）时才写入文件，其代价是数据可用的延迟更长。\n\n### 实现连接后文件合并\n\n一种常见的技术是频繁写入许多小文件（例如每分钟一次），以确保特定批处理消费者具有非常低的延迟。然后，在时间边界结束时（例如每小时一次），你启动一个新的批处理作业，将许多小文件重新合并为少数几个大文件。作为最后一步，你更新云文件系统的元数据条目（例如Apache\
  \ Hive），将未来的批处理作业重定向到合并后的文件，从而大幅提升其性能。\n\n将事件流中的事件集成到静态数据中需要仔细考虑数据产品的用例。如果你的组织已有批处理计算的数据，你通常可以重复使用现有的约定和SLA作为你自己的。如果人们习惯每30分钟更新一次数据，那么以30分钟的更新频率作为你的SLA开始是可以的。数据格式转换和架构演进同样并非事件流特有的问题，你可能会发现可以从现有的数据管道和工作流中汲取灵感来处理这些问题。\n\
  \n## 预算忧郁：过度支出的故事\n\n迁移到通用的“每唯一用户广告点击会话”数据产品已取得良好效果——差异已消失，不再有业务合作伙伴投诉。但是，我们至今一直选择忽略的问题仍然存在。\n\
  \n目前，广告通过竞价过程投放给最终用户。业务合作伙伴会看到关于最终用户的信息，例如年龄、位置和兴趣，并可以根据相关性提交竞价，以获得向最终用户投放广告的权利。获胜竞价者的广告随后会被推送到最终用户的UI上。但是，业务合作伙伴仅在最终用户点击广告时才会被收费。仅仅查看是不够的。\n\
  \n广告在各种属性和多个系统上投放，直到广告已投放并页面已加载之后，我们才知道广告是否被点击。到那时，我们只能等待看最终用户是否会点击它。\n\n\n\n\n\
  目前，预算支出报告是按小时批次计算的。每小时我们都会从投标系统导出数据，以获取新的和更新的投标预算事实。按小时频率的后果是，我们最早能在一小时后计算预算完成情况——实际上，这将花费更长时间，因为我们还需要考虑处理时间以及将其\
  \ ETL 回投标系统的时间。我们的目标是缩短聚合点击、计算剩余预算以及通知投标系统哪些预算应该或不再允许投标之间的时间。\n\n目前，我们经常会遇到这样的商业伙伴：他们的预算在技术上已经用完，但投标系统尚未收到包含更新的每小时报告。在此期间，算法继续使用该商业伙伴的预算条目来激进地投放广告位，出价高于其他\
  \ _确实_ 有剩余预算但出价较低的商业伙伴。\n\n最终结果是收入损失，因为我们无法向商业伙伴收取超过其明确说明的预算限制的额外广告点击费用。相反，我们需要一个更紧密的循环，以缩短预算用尽与投标系统停用相关投标之间的时间。\n\
  \n图 9-5 说明了我们架构的演进，以帮助我们实现这些目标。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_221_0.png)\n\
  \n图 9-5. 预算完成系统的进一步演进，以使用事件驱动的数据产品\n\n源对齐点击事件 (1) 由专门构建的微服务 (2) 聚合为会话，从而生成聚合对齐的数据产品\
  \ (3)。此流已由广告点击团队域所有者有意提升为数据产品状态，因为它不仅支持图 9-5 中的工作流，还支持其他应用程序和流程（未显示）。聚合数据产品具有以下架构：\n\
  \n```\nKey: String, //user_account\nValue: {\n  user_account: String,\n  session_start:\
  \ Datetime,\n  session_end: Datetime,\n  //Map of unique ad_id clicked and the corresponding\
  \ bid amount\n  unique_ad_id_to_bid_price_in_cents: Map[Long, int]\n}\n```\n\nunique_ad_id_to_bid_price_in_cents\
  \ 只是一个包含映射到出价金额的唯一 ad_id 集合的映射。例如，请考虑以下代码片段：\n\n```\nunique_ad_id_to_bid_price_in_cents:\
  \ Map[Long, int] =\n  [ [77883344, 29],\n    [12937163, 14],\n    [01845672, 0]\n\
  \  ]\n```\n\n此会话中的用户点击了三个广告。每个广告的中标出价分别为 29 美分、14 美分和 0 美分。最后一个值表示没有人愿意为了展示该广告的权利支付任何金额。\n\
  \n除图 9-5 所述内容外，投标团队已设置 CDC 连接器 (4) 以发出详细描述投标预算 (5) 的事实流。这使得投标预算完成服务 (6) 能够在更新发生时立即容纳新的、修改的和取消的预算。\n\
  \n请注意，投标团队并未将投标预算的 CDC 流建立为数据产品。它仍然是团队域内的私有事件流，仅对分析报告团队拥有的服务 (6) 可见且可用。如果投标预算变得更加广泛需要，投标团队可以重新审视将其提升为数据产品（包含所有治理和支持要求）的决定。\n\
  \n投标预算实体具有以下架构：\n\n```\nKey: long, //budget_id\nValue: {\n  budget_id: long,\n \
  \ ad_id: long,\n  amount_in_cents: long,\n  remaining_amount_in_cents: long,\n \
  \ maximum_bid_in_cents: int,\n  start: Datetime,\n  end: Datetime\n}\n```\n\n为简化本示例，每个\
  \ budget_id 均按 1:1 归属于特定的 ad_id。每个预算包含完整预算金额、可用剩余金额以及最高出价，均以美分表示。由于大多数广告系列都基于日期范围运行，因此还有开始和结束日期，用于进一步区分投标资格。\n\
  \n投标预算完成服务 (6) 将投标预算物化到其自身状态存储中。它还将每个按唯一用户划分的广告点击会话物化，并将唯一会话点击分配给每个预算。该服务检查每个新事实的变化（无论是另一次归因点击、会话结束，还是预算修改），并相应更新分配的预算支出。\n\
  \n为降低投标预算状态流事件 (7) 可能产生的极高频率，除非事件表示预算已用尽，否则每 60 秒仅每个 budget_id 发出一次更新。在这种情况下，它会立即发出，以缩短从预算用尽到其从付费推广中移除之间的端到端延迟。\n\
  \n最后，投标预算状态流事件 (7) 通过数据库下沉连接器 (8) 集成回投标系统，该连接器将事件转换为数据库 UPSERT 命令。这完成了预算计算循环，为投标系统提供其预算完成情况的近乎实时数据，与基于旧版的一小时以上反馈循环相比，大幅削减了不可收回的投标成本。\n\
  \n投标预算完成服务 (6) 仍由分析报告团队所有，原因是历史遗留。毕竟，他们之前计算过批量报告，因此目前仍对其负责。社会变化可能会缓慢到来，也许有一天，投标系统将能够在其自身域内计算自己的结果。接受并专注于渐进式变化是采用数据网格的关键部分。\n\
  \n技术变革也可能缓慢到来。尽管本示例中有两个事件驱动的微服务，但投标系统仍坚定地是一个非事件驱动的应用程序，只需要访问一个数据流。第 101 页的“连接器”是弥合现有非流式系统与事件驱动数据产品之间差距的重要工具，并真正使渐进式变化既可行又实际。\n\
  \n如果您决定支持非流式数据产品，您需要考虑它们如何与您的事件流并行工作。让我们现在看一下。\n\n## 将自助服务平台扩展到非流式数据产品\n\n您需要根据独特的用例，选择要纳入平台的非流式数据产品。第\
  \ 31 页的“数据产品是多模式的”介绍了数据产品可能具有的多种模式，包括批量计算的文件、请求-响应 API 和事件流。但什么算作独立的数据产品，什么算作单个数据产品的\
  \ _模式_？您如何在自助服务平台中表示它？让我们看看影响我们选项的几个因素：\n\n### 所有权\n\n担任数据产品所有者角色的人是唯一可以拥有数据产品的个人。不能有多个所有者。如果单个数据产品要通过多种模式提供，则必须有一个共同所有者，能够保证每种模式的支持和一致性。\n\
  \n### 技术边界\n\n第 179 页的“变更数据捕获”对于从数据库中提取事件非常有用，特别是当数据库所有者不愿或无法将业务数据作为原生生成的事件流提供时。在此情况下，CDC\
  \ 流是一个独立的数据产品，其所有权与源数据库所有者提供的任何请求-响应数据产品分离。请记住，如果事务系统的所有者不愿或无法与 CDC 流所有者合作，您最多只能得到一个易于导致\
  \ SLA 失效和数据模型损坏的“创可贴”解决方案。尽可能共同努力以维护数据产品的连续性和架构兼容性至关重要。\n\n### 对齐和组合逻辑\n\n尽管都是对同一数据的聚合，但源自\
  \ 1 分钟销售聚合流的一批 60 分钟销售聚合是两个独立的数据产品。\n\n多模式数据网格应识别数据产品之间的关系，这些关系表现为同一产品的模式，或通过与其他产品的关系来体现。例如，您可以选择将\
  \ SQL 可查询和事件流作为单个数据产品的两种模式。通过自助服务发现工具找到的元数据条目，将类似于图 9-6。\n\n无论您如何展示批量创建的数据产品，都需要确保对发现、计算和发布提供一流支持。在集成多种数据产品模式时，没有捷径或轻松的退出途径，因此，始终最好是先从尽可能少的模式开始，仅在必要时才扩展选择范围。\n\
  \n\n\n\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_225_0.png)\n\n图 9-6. 一个自助式 UI，同时显示单个数据产品的\
  \ Hive 表和 Kafka 主题模式\n\n## 摘要\n\n数据网格本质上是多模式的，数据产品可以通过多种方式提供。事件流仍然是大多数数据产品的最佳选择，因为通过流为操作性和分析性用例提供动力，远比使用静止的文件批次更容易。\n\
  \n自大数据诞生以来，基于批处理的计算一直是构建数据管道并提供分析结果的主流方式。将批处理计算的文件替换为事件流源是最常见的首个集成步骤之一。沉降连接器将事件流重新组合成一批文件，以匹配格式和聚合要求。最终结果是一组事件流，既可以为实时操作性和分析性系统提供动力，同时也可以为现有基于批处理的数据管道提供动力的源系统。\n\
  \n你如何分类由沉降连接器创建的文件批次由你决定。你可以选择将其视为同一数据产品的两种模式，但必须确保单一的所有权和责任。你也可以选择将它们视为不同的数据产品。事件流可能与源对齐，而沉降到云存储的数据可能是按小时聚合对齐的数据产品。血缘和依赖跟踪对于发现紧密相关的数据产品仍然很重要。\n\
  \n对多模式数据产品的自助式平台支持仍然是关键要求。除了发现之外，你还需要确保你的数据网格用户可以将其服务注册为消费者，并管理其非流式数据产品的发布。元数据要求会因产品模式而异，安全访问、信息处理、扩展和演变的方式也会如此。请确保联邦治理团队的代表已仔细评估并优先排序了支持你的数据产品模式所需的功能。\n\
  \n在接近本书结尾之际，还有一个主题需要处理。分布式系统通常必须处理最终一致性，分布式异步事件驱动架构也不例外，我们将在下一章中看到。\n"
- "## 最终一致性\n\n最终一致性是人们对分布式系统和事件驱动数据产品的主要关注点之一。但最终一致性对不同的人可能意味着不同的事情。例如，应用程序开发人员可能正在使用不提供一致读后写的数据库，例如大型分布式数据库的情况，或使用事件溯源来构建状态时。在事件驱动的数据网格中，我们更关心多个消费系统订阅事件驱动数据产品的影响，以及如何与各自按自己的速率读取数据的单个消费者一起工作。\n\
  \n有些人一直在研究、从事并思考最终一致性，时间相当长了。Pat Helland 就是这样一个人，他撰写了一篇出色的文章，汇集了众多思想领袖在该主题上的见解和观点。\n\
  \n> 1995 年，Doug [Terry] 在 Bayou 论文中创造了“最终一致性”这一短语，\n> 我对他的观点很感兴趣。当他定义最终一致性时，其意思是：\n\
  > 对象集合中的每个对象，该对象的所有副本最终都将具有相同的值。随后，他问道：“是啊，我本应该称之为最终收敛。”\n> \n> ——Pat Helland\n\n\
  Helland 接着讨论了 Peter Alvaro 的一个定义，该定义出自他的 2015 年博士论文《面向分布式系统的数据中心编程》：\n\n> 当所有消息都已送达时，如果所有副本对存储值的集合达成一致，则该系统是收敛的，或者说是“最终一致的”。\n\
  > \n> ——Peter Alvaro\n\nTerry 和 Alvaro（哈！）都趋同于最终一致性的同一定义，将重点放在独立副本最终收敛于同一组存储值上。我们将继续使用“最终一致性”术语，但请记住，我们实际上是在讨论数据的收敛。\n\
  \n持续物化事件流的消费者可以轻松地告诉你它在数据存储中拥有哪些数据，但无法告诉你它没有哪些数据。因为数据存储最终会收敛，所以在被查询时它可能会告诉你没有某个数据，但随后可能会在下一个时钟周期立即接收并处理该数据。然而，消费者确实有能力告诉你它是否已追上某个给定偏移量，我们可以在解决关于收敛的问题时利用这一知识。\n\
  \n在事件驱动世界中，关于最终一致性的许多问题和担忧都源于对“因其而发生不好的事情”的担忧。它经常被用作一种威胁性术语，列在架构概览论述的缺点部分。但它不一定是缺点，因为只需注意几件大事。有两个主要原因，导致两个独立的消费者服务可能尚未收敛：\n\
  \n### *服务滞后*\n\n数据产品中的所有数据都是一致的，但有一个服务只是在数据的消费、处理和存储方面滞后。\n\n### *数据产品滞后*\n\n数据产品中的数据并不*一致*，但每个服务都已完全同步到最新数据。对于事件驱动的数据产品，要么生产者未能写入数据，要么事件流可能不可用。在最坏的情况下，数据产品可能严重滞后，以至于违反其\
  \ SLA。\n\n请注意，这两个选项并非互斥。一个或多个消费者服务 *和* 一个或多个流同时缺少数据是完全可能的。尽管收敛最终会带来一致性，但这只会是短暂的，直到我们的服务和数据产品再次暂时缺少数据并需要处理以追上进度。\n\
  \n问题是，最终一致性并没有你想象中那么大的影响，我们将在本章后面探讨一些处理它的好方法。绝大多数时间，你的事件驱动服务都会跟上最新事件，并实际处于同一个时间气泡中，就像普通的旧式同步服务一样。这就是我认为它会引起大量担忧的原因之一——你永远不知道*何时*你的服务会开始滞后并转入其自己的时间气泡，如果发生这种情况，如何检测以及该怎么办。\n\
  \n问题的关键在于，只有当一个独立上下文向另一个独立上下文提出同步问题，且无法保证其内部数据集已同步时，最终一致性才真正开始成为一个问题。\n\n## 逐步趋于一致，一次一个事件\n\
  \n每个事件驱动处理实例实际上都存在于其自己的时间气泡中，其内部时间完全基于其已消费并集成到状态中的事件时间戳。绝大多数事件流都按递增偏移量和时间戳顺序提供数据，尽管事件也可能乱序（本章后面将详细讨论）。因此，尽管消费服务可以自由查看墙钟时间，但其自身的内部时间完全基于其已消费事件的时间戳。\n\
  \n请参看图 10-1，它显示两个独立消费者正在从单个事件流中读取数据。每个服务都完全独立，正在处理事件、应用业务逻辑并将数据保存到状态中。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_230_0.png)\n\
  \n图 10-1. 最终一致性问题的关键\n\n每个服务向外部世界提供的结果，无论是通过请求-响应 API、输出事件流还是其他方式，都极不可能与另一项服务中类似物化的数据精确同步。差异和令人困惑的结果正是由此引入的。在\
  \ t=900 时，消费者 2 向 t=220 时的消费者 1 询问其 Sunflowers 数据的副本。由于消费者 1 甚至从未听说过 Sunflowers，它所能做的全部就是回复“未找到”。\n\
  \n与事件驱动数据产品的消费者形成对比的是，设想两个通过请求-响应 API 通信的同步服务，并且它们在各自的服务中拥有并存储所有数据。当其中一项服务向另一项服务发出\
  \ API 调用时，它并不在想：“那边现在是什么时间呢？”\n\n\n\n\n\n除了使用偏移量或递增事件 ID，您还可以选择使用事件时间，即事件发生的时间，来处理收敛问题。在通过\
  \ CDC 创建事件的情况下，事件时间通常定义为数据被 upserted 到源数据库的时间。\n\n假设这两个服务处于同一个时间气泡中，并且具有相同的墙钟时间或足够接近，以至于我们不关心。这一假设在很大程度上是正确的，因为同步服务不会像事件驱动系统那样将工作缓冲在大型队列中以待以后处理。相反，它会立即处理或失败请求，并返回其可用的最新数据，代表当前的墙钟时间。\n\
  \n让我们来看一家简单的运输和送货公司。在此模型中，司机是可以驾驶卡车的员工。对于我们想要派出进行送货的每辆卡车，都需要一名司机，否则该车辆将无法前往。在同步和异步系统中，将司机分配给卡车会受到什么影响？\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_231_0.png)\n\n图 10-2. 服务的内部时间由其输入偏移量的并集决定\n\
  \n与此同时，右侧的服务源自事件流。在此示例中，请注意卡车查找服务有 7 小时的时间滞后，因为它在物化其传入事件方面落后了。如果驱动程序服务请求卡车服务提供一辆新卡车以供分配，则可能没有可用卡车，尽管新卡车已发布到事件流中。该服务必须赶上进度；否则，它将产生非确定性结果。\n\
  \n虽然要求所有司机和卡车在单个原子事件中一起注册似乎很诱人，但这对于我们的业务用例不幸的是行不通。许多专业司机不拥有自己的卡车，有些公司出租卡车但不提供司机。每个都必须独立注册。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_232_0.png)\n\n系统时间在很大程度上已同步到毫秒级，这在很大部分归功于与网络时间协议（NTP）服务器的频繁同步。如果您要求两个事件之间具有完美的时间对齐，则应重构您的领域以将关键的时间敏感数据放入同一单个事件中。否则，您将不得不计划处理最终一致性。\n\
  \n虽然滞后的服务是收敛问题的一个来源，但第二个来源是：尽管所有消费者都已完全赶上进度，事件流仍未更新。当一个流中的事件与另一个流中的数据相关时（例如通过外键或主键），这尤其成问题。让我们暂时抛开滞后、延迟和处理时间，假设您拥有一个服务，可以即时消费和物化任何数量的事件，来自任何数量的流。在图\
  \ 10-3 的情况中，我们有一个花盆构建器服务，正在从两个流中消费和连接数据，以确定每种花卉类型花盆中应放入的最佳土壤。\n\n| 键 | 值 | 时间 |\
  \ 偏移量 |\n|---|---|---|---|\n| 10 | Daisies, SoilType=BLL | 150 | 1 |\n| 20 | Daffodils,\
  \ SoilType=BRL | 220 | 2 |\n| 30 | Sunflowers, SoilType=UKR | 350 | 3 |\n| 40 |\
  \ Poppies, SoilType=BLG | 900 | 4 |\n\n| 键 | 值 | 时间 | 偏移量 |\n|---|---|---|---|\n\
  | BLL | Black loam | 160 | 1 |\n| BRL | Brown loam | 230 | 2 |\n\n图 10-3. 源事件流中的数据尚未收敛\n\
  \n尽管该服务与每个事件流完全同步，但在 Preferred Soil 流中没有向日葵和罂粟的匹配记录。花盆构建器服务需要等待，直到它能够为这些花卉获取匹配的\
  \ Preferred Soil 事件。这两个流可能不同步的原因有很多：它们可能来自不同的领域，它们可能有不同的 SLA，Preferred Soil 的生产者可能宕机，网络可能分区，或者事件代理可能不可用，仅举几例。\n\
  \n尽管数据可能根本不存在 _任何地方_，但在许多情况下，我们根据某些业务规则和属性期望数据存在。例如，Preferred Soil 与 Flowers 具有外键关系，因此我们可以期望任何填充了土壤类型字段的\
  \ Flowers 记录都有对应的 Preferred Soil 记录。然而，向日葵和罂粟的记录都缺失。此数据可能仍会出现，但正如本示例所示，即使是现有事件流的完全最新消费者，也可能由于非自身原因与上游系统不一致。\n\
  \n我们面临的最终一致性问题基本上归结为尚未收敛的消费者和尚未收敛的事件流。接下来，让我们看看一些更详细的实用场景和处理最终一致性的一些策略。\n\n## 处理最终一致性的策略\n\
  \n在处理最终一致性时，无论是在服务之间还是在单个服务内，您都有两个主要选项。第一个选项是简单地等待状态变为一致，例如等待完成连接、结束会话或最终完成聚合的事件。在查询给出不一致答案的外部服务时，此选项同样适用——您可以简单地等待并在稍后重试查询。您也可以选择输出一个指示缺乏一致性的不完整结果，但您需要在收到适当数据以采取行动时使用最终结果更新它。\n\
  \n第二个选项是在一定时间后放弃。_放弃是最终的_。如果您等待的缺失事件在您放弃后的一瞬间出现，也为时已晚，无法对其做任何处理。如果您查询的服务器最终拥有您需要的结果，也无关紧要，因为您不会收到通知或后续请求。超时表明您的数据产品\
  \ SLA 存在需要解决的失败。\n\n让我们来看看几种处理最终一致性的策略。\n\n### 防止故障以避免不一致\n\n数据网格是分布式的，因此我们必须应对分布式系统的所有问题。系统会崩溃。网络会分区。事件流将不可用。云存储将无法访问。Amazon\
  \ S3 会宕机，导致一大群无聊的软件开发人员创建模因。图 10-4 展示了基本数据产品创建和使用工作流中主要关注的领域。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_234_0.png)\n\
  \n图 10-4. 间歇性问题可能导致收敛到一致状态的延迟\n\n每个编号组件都可能遭受其自身范围的故障，导致事件到达最终目的地的延迟。数据库 (1) 可能会遭受崩溃、网络不可用甚至磁盘故障。连接器\
  \ (2 和 4) 同样可能崩溃、抛出异常，或无法连接到代理 (3)、云数据存储 (5) 或本机事件驱动消费者 (6)。\n\n您可以通过良好的 DevOps\
  \ 实践、监控、资源扩展和测试来降低故障概率。同样重要的是，确保您的消费者服务有足够的资源进行扩展并及时了解最新事件，并且您的生产者方面的任何中断或故障都能按照商定的\
  \ SLA 尽快识别和修复（“分层服务级别”第 78 页）。\n\n### 使用事件驱动的数据产品，而非请求-响应服务器 API 调用\n\n考虑一种业务用例，我们需要将卡车和司机分配给配送路线。与其将卡车数据存储在一个服务中，司机数据存储在另一个服务中，路线存储在第三个服务中，不如简单地将数据发布到流中，并让每个消费者自行决定如何使用它。我们不会跨多个系统进行\
  \ API 调用，而是将其摄入到单个服务中，该服务具有一个单一的时间气泡，专门用于编排驱动程序路由分配。\n\n\n\n\n\n以事件流形式添加数据源是对服务的简单扩展。图\
  \ 10-5 展示了添加 `package` 流的过程，该流有助于改进分配给路线的卡车和司机的选择，并发出运单以指示包裹的分布。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_235_0.png)\n\
  \n图 10-5. 仅从事件流获取数据可为商业决策提供最终一致性数据\n\n消费者服务能够完全查看每个事件的时间戳，并可以询问代理其是否已赶上任何给定输入流的最新状态。因此，消费者服务可以自行判断自身是否处于收敛状态，并相应地采取行动。\n\
  \n图 10-5 中的人类用户可以作为分配卡车和司机到路线的业务逻辑的一部分发挥作用。货运管理系统可以提出分配建议，人类用户可以接受或拒绝这些分配，也可以根据情况自行覆盖。\n\
  \n必须确保消费者服务逻辑能够正确处理流和分区之间以任何时间顺序到达的数据。例如，假设一名司机拥有自己的卡车，是该卡车的唯一司机，且不会开任何其他卡车。您的消费者服务可能会先收到卡车注册事件，然后收到司机注册事件，或者反过来，两者皆有可能。您的业务逻辑必须考虑数据以任何顺序到达的情况，因为这两种都是完全有效的用例，且发生的可能性可能相同。\n\
  \n如 Kafka Streams、Flink 和 Spark 等流处理框架默认支持异步性，因此非常适合用于处理更复杂用途的事件驱动型数据产品。简单的事件流消费者客户端很少具备处理异步时间到达的能力，因此会将管理异步性的复杂性转嫁给消费者。请确保清楚了解消费者客户端提供和不提供的功能。\n\
  \n## 在服务器响应中暴露最终一致性\n\n您可能之前见过采用这种策略。曾经在线预订过航班、酒店或租车，并看到小小的旋转图标，上面写着“请等待确认，不要刷新”吗？在\
  \ UI 领域，暴露系统的最终一致性是常见做法，我们可以采用此策略用于服务器之间的通信。\n\n这种策略有几种选择：\n\n- *当滞后超过阈值时停止提供服务*\n\
  \  查询服务会监控其自身对输入事件流偏移量的消费者滞后，且仅在滞后低于阈值时提供数据。与返回数据不同，您的服务会返回一条消息，指示尚未准备就绪，例如 HTTP\
  \ 503（服务不可用）。您也可以选择返回 `Retry-After` 响应，指示基于典型吞吐量处理，服务何时应准备就绪。如果消费者滞后低于阈值，服务会正常处理查询并提供响应。\n\
  \n- *向请求者提供过时数据*\n  您的服务可以无论数据有多过时，都向请求者提供响应。您可以在负载中包含一个指示数据已过时的响应，并清楚表明由请求客户端自行决定如何继续。在某些情况下，客户端并不太在意过时数据；而在其他情况下，这至关重要，客户端可以选择推迟进一步处理，直到能够使用最新数据提供请求为止。\n\
  \n- *提供回调 API*\n  客户端可以注册，以便在您的服务不再滞后时处理其请求，并随请求数据接收回调。此策略的实现更为复杂，因为客户端必须阻塞并等待回调，或者需要实现上下文切换逻辑来处理其他任务，直到回调发生。此外，您的服务还需要缓冲和处理回调，并为用户提供服务等级协议\
  \ (SLA)。\n\n但事件时间呢？您能否使用自上一个新事件以来的时间来检测自己是否滞后？在某些情况下可以，但在许多其他情况下不行。让我们来看一个示例。\n\n\
  用户点击事件源对齐型数据产品每秒可提供数百或数千个事件。根据历史趋势，如果几分钟内没有新的点击事件，您的服务可以相当安全地推断自己正在滞后，或者源数据产品已违反其\
  \ SLA。\n\n但是，请考虑用户实体状态的源对齐型压缩数据产品，其中每个事件表示用户的当前状态。仅在用户更新字段、注册新用户或删除现有用户时，才会发布新事件。尽管事件之间可能相隔数小时（或数天），流中的数据仍然有效，任何已消费该流的服务都保持收敛和最新状态。它只是没有收到任何新事件（因为没有新事件！），因此无法提供比上一个事件的事件时间更多的信息。\n\
  \n仅使用最后处理的事件的事件时间来推断滞后很容易导致误判。尽管在高频更新的情况下，您 *可以* 使用事件时间来推断滞后，但这对于许多其他用例仍然不适用。只要有可能，您最好依赖偏移量来检测和暴露滞后。\n\
  \n## 为新服务和数据重新处理做计划\n\n当启动新的消费者服务时，您需要决定它是处理历史数据，还是仅从当前墙钟时间开始。对于新服务，处理历史数据非常简单：只需将消费者偏移量指向输入流的开头并让它运行！该服务会尽可能快速地消费和处理事件，物化状态、计算结果，并在必要时写入生成的输出事件。新服务的好处在于，尚无现有服务正在查询它们或依赖其输出，因此您不必担心意外破坏任何东西。\n\
  \n但是，为现有服务重新处理历史数据可能更加微妙。请参考您的业务用例来确定需要多少历史数据。对于某些流和应用程序用例，您可以重新启动消费者，以基于时间的偏移量（例如，最近\
  \ 30 天的数据）来读取。其他流和用例（例如，上一节中创建所有用户的完整物化状态）需要消费压缩的 User 事件流的完整历史记录。\n\n重新处理历史数据的一个常见原因是您的消费者系统存在错误，并做了一些不好的事情。这些不好的具体内容因服务而异，但主要分为两类：要么是您通过同步请求-响应向他人提供了错误数据，要么是您将错误记录写入了输出事件流。对于前者，您无能为力——无法回头撤销已提供的数据。对于事件流输出，您确实有几种选择，但这完全取决于输出对您的消费者的影响。\n\
  \n修复由错误数据引起的问题不仅仅限于事件驱动型数据产品。错误数据也可以通过请求-响应 API、云存储中的批量计算文件和直接数据库查询来传播。修复错误数据对用户影响的科学在很大程度上取决于适当的工作流设计、故障模式的识别，以及预先实施恢复选项。\n\
  \n## 修复错误事件数据的选项包括：\n\n- *向数据产品发布更正数据*\n  生成包含更正数据的新事件，并将其发布到现有的输出事件流中。如果您的服务本身由事件流驱动，则在此过程中可能需要将输入偏移量回退。您的消费者将获得更正的事件，由它们自行决定如何处理对账。当修复后的事件流不驱动无法逆转的消费者用例时，此选项合适。例如，适合的用例涉及发布电子商务网站上显示的产品评论的更正翻译。\n\
  \n  数据产品中的错误可能需要正式声明事件。根据错误的严重程度、数据产品内容和数据的重要性，您可能需要通知所有消费者并启动事件解决流程。无论数据是通过直接请求还是通过事件流提供，此情况均适用。\n\
  \n- *清除并重新创建数据产品*\n  在某些情况下，您需要一个更复杂的解决方案来处理之前的错误数据。并非所有工作流都容易逆转，您可能需要创建全新的流、弃用旧流，并将所有消费者迁移到更正后的数据上。这是一个重量级选项，需要停止全局协调，但在无法接受进一步传播错误数据时，这可能是唯一的选择。\n\
  \n最后，如果您发现需要从时间起点重新处理事件流（那是一个非常严重的错误！），请考虑对下游消费者的影响。他们将不得不消费您的服务写入输出主题的每个事件。如果您发现自己将要这样做，请务必提前警告他们并相应协调。您可能需要限制输出速率，他们可能需要水平扩展其消费者以应对这种情况。\n\
  \n\n\n\n\n## 在时间边界上同步数据产品\n\n事件流数据产品服务于广泛的消费者用例，当然，包括通过连接器将数据沉降到云存储中。Apache Spark、Flink、Presto\
  \ 或 BigQuery 等大数据分析处理依赖于格式良好、批量创建的数据，通常以 Parquet、ORC、Avro 或其他大数据格式的形式存在。许多组织开发了高度依赖批量数据的数据工程、科学和分析管道。构建良好的数据网格应该满足这些人的需求，在其当前所处位置提供支持，而不强迫他们转向事件流。\n\
  \n事件流是连续的数据流，而你可以将云存储数据视为静态数据。这意味着我们需要对如何将数据写入磁盘保持高度警惕，并应遵循大数据专业人士已有的分区标准。根据时间戳对数据进行分区（无论是\
  \ 1 分钟、5 分钟、30 分钟还是 1 小时分区）是非常普遍的做法。分区使上述大数据处理引擎只能加载其关心的数据范围，而无需加载其他内容。当然，你也可以根据许多其他属性对数据进行分区，例如事件类型、位置、信息安全法规和\
  \ PII 详细信息，但这些都是你需要与治理团队以及理想情况下了解和使用数据的人讨论的政策。\n\n时间边界在大数据领域的批量处理中非常重要，原因有以下几点。首先，仅加载和处理计算管道结果所需的数据，要比将大量数据集从云存储读入内存然后丢弃大部分数据高效且经济得多。其次，批量处理作业要求在开始处理之前，某个时间槽中的所有数据都必须存在。如果数据以\
  \ 30 分钟为一个块收集，这意味着我们可以每 30 分钟启动一个处理作业来计算下一批结果。许多大数据分析计算都涉及时间分析，拥有精确的时间范围对于准确性至关重要。\n\
  \n第三，同样重要的是，大数据作业通常需要与其他数据集进行关联。通过以相同的方式、在相同的日期和时间边界上对所有云存储数据集进行分区，我们使用户能够选择适合其用例的时间范围。如果他们只需要最近半个小时，没问题。如果他们需要最近\
  \ 30 天，也都可用。\n\n入门最简单的方法是查看你的事件代理提供了哪些沉降器选项。例如，Confluent 提供了一个免费与 Kafka Connect\
  \ 一起使用的 AWS S3 沉降器。它具有一个易于配置的格式选项（Avro, Parquet, JSON, Raw Bytes），以及多种数据分区器选项，包括自定义时间基、每日和每小时选项。沉降器解决方案选项的灵活性使你能够轻松地将事件流数据转换为支持现有批量数据管道所需的格式。\n\
  \n在结束本章之前，还有一个重要主题需要探讨。尽管我们付出了最大努力，事件仍可能以乱序方式发布到事件流中，并需要由下游消费者进行解决。让我们来看看处理这些事件的选项。\n\
  \n## 乱序事件\n\n想象一个流分区中每个事件都按完美递增的时间戳顺序排列的世界并不难，但要实现这一点却要困难得多。考虑图 10-6 中的一对生产者，它们获取网站上的用户行为点击事件并将其转换为事件。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_240_0.png)\n\n图 10-6. 间歇性故障可能导致事件以乱序的时间顺序写入\n\
  \n实例 1 暂时无法连接到事件代理，但会在连接恢复前在内部缓冲点击事件。当连接恢复时，实例 1 可以将其事件积压写入事件流，且不会丢失数据。但是，事件流中的事件（以实例\
  \ 1 接收它们的时间戳标记）现在与实例 0 的事件在时间顺序上不一致。\n\n临时中断不是你会遇到这种问题的唯一场景。事实上，乱序数据最常见的来源是无法完美同步分布式时钟。尽管\
  \ NTP 服务器和原子钟可以让我们非常接近完美的事件时间同步，但事实是，我们总会存在一些偏差——这里几毫秒，那里几百毫秒。配置错误、bug 和人为错误也不可避免地会带来他们自身的偏差和漂移源。\n\
  \n你可以选择在接收事件代理接收到事件并将其发布到流时，用代理的时钟时间为事件打上时间戳。使用代理接收到的事件时间只是掩盖了时钟偏差问题，因为真正的事件时间是事件实际发生的时间，而不是记录到代理的时间。是否使用它由你决定，但最好是保留原始事件时间戳，并承诺在消费者端处理乱序数据。\n\
  \n乱序事件很重要，因为它们会影响消费者收敛到的状态。两个对乱序事件处理方式不同的独立消费者可能会达到永久不同的状态，并且永远不会收敛。在某些情况下这可能无关紧要，但在其他情况下可能至关重要。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_241_0.png)\n\n我在《构建事件驱动微服务》一书的第 6 章中介绍了流处理框架用于处理事件、推进时间以及识别乱序数据的主要技术。如果你有兴趣了解内部细节，请参考该章节。\n\
  \n由于事件可能会以乱序方式写入，并且不能保证具有单调递增的时间戳——我们该如何处理它们呢？让我们来看看。\n\n## 解决延迟到达事件\n\n事件只能从消费者的角度被视为延迟，每个消费者都可以自由定义什么是延迟，什么不是。例如，一个消费者维护一个有时间边界的聚合数据窗口，比如每小时的广告点击数，该数据源自源对齐的广告点击流。窗口操作是处理延迟到达数据的绝佳强制函数，因为它们只要求你回答一个简单的问题：“这个特定事件是否属于你的时间窗口，还是不属于？”\n\
  \n图 10-7 显示了用户点击的广告、递增的偏移量以及用户点击时的事件时间。\n\n| 值 | 时间 | 偏移量 |\n| :--- | :--- | :---\
  \ |\n| 广告:\"CoffeeKing-3\", 用户ID:\"Adam\" | 100 | 1 |\n| 广告:\"TeaQueen-7\", 用户ID:\"\
  Justin\" | 500 | 2 |\n| 广告:\"Diet Cola-0\", 用户ID:\"Renata\" | 200 | 3 |\n| 广告:\"\
  CoffeeKing-4\", 用户ID:\"Adam\" | 600 | 4 |\n| 广告:\"KhlavKalash-0\", 用户ID:\"Homer\"\
  \ | 300 | 5 |\n| 广告:\"TeaQueen-3\", 用户ID:\"Lisa\" | 700 | 6 |\n| 广告:\"MountainDont-0\"\
  , 用户ID:\"Bonko\" | 800 | 7 |\n\n图 10-7. 基于事件时间的乱序事件，代表广告点击\n\n一个时间窗口与另一个时间窗口之间并不总是有明确的界限。请注意，从偏移量\
  \ 2 到 5，事件时间来回摆动，表明存在非常接近的竞争条件，可能是在两个*几乎*同步的生产者实例之间。这种重叠的摆动事件时间在由多个生产者实例创建的事件流中相对常见，你需要相应地制定计划来处理它们。\n\
  \n功能齐全的事件处理框架，如 Kafka Streams、Apache Spark 和 Apache Flink，都具有以可预测且确定的顺序选择和处理事件的功能。每个处理线程从下一批可能的事件中选择时间戳最低（最早）且偏移量最低（最早）的事件，然后通过其业务逻辑分派它。这些框架各自都有自己的方式来跟踪处理实例所看到的时间——Spark\
  \ 和 Flink 使用水位线，而 Kafka Streams 使用流时间。我会在我的书《构建事件驱动微服务》第 6 章中更详细地讨论这个问题。\n\n当你的流处理器窗口操作看到事件时间大于窗口截止值的事件时，它会启动一个新窗口并关闭旧窗口，将其发送到下游输出。由于输入事件流可能在时间上乱序，那么下一个本应进入初始窗口的事件会怎样呢？嗯，你有几个选项：\n\
  \n- *丢弃它*\n\n你可以直接丢弃该事件，因为窗口已关闭，任何基于时间的聚合都可能已完成。但是，这个选项很像当你看到人们正在奔跑以赶上航班时猛地关上飞机舱门——也许多等几秒钟也无妨。\n\
  \n- *保持窗口打开并延迟输出*\n\n你也可以推迟关闭窗口，直到过去一定时间。你将获得更高的完整性可能性，但这要求你的下游消费者能够容忍更高的延迟。\n\n\
  - *保持窗口打开并输出多个更新*\n\n你可以在达到事件时间阈值后立即输出窗口结果，但然后并行维护旧窗口和新窗口。旧窗口将在宽限期内保留，你可以在宽限期到期前合并延迟到达的事件。到那时，你最终关闭旧窗口，如果在宽限期内结果已更新，则再次输出结果。之后，任何延迟到达的事件都会被直接丢弃。\n\
  \n你的消费者应该如何处理乱序事件并没有一成不变的规则——这完全取决于每个消费者。由于每个消费者都是独立的，你可能会发现这会引入非收敛行为，*尤其是在直接*\n\
  \n\n\n比较跨同步边界的数据，例如通过同步请求-响应 API 进行的查询。如果无法承担不收敛的风险，则应确保您的应用程序或服务直接从源数据产品中消费并自行计算其结果。\n\
  \n上游数据产品的 SLA 至关重要。请确保您的消费服务可以容忍输入数据产品在 SLA 指定的时间段内中断。例如，如果您的源数据产品可能会在某一时间段内（例如\
  \ 5 分钟）不可用（或不产生数据），则应确保您的消费服务至少可以处理 *至少* 5 分钟的中断（不过 15 到 20 分钟会安全得多）。\n\n在事件驱动的数据产品中，迟到数据并非严格意义上的问题。批量计算的数据集也可能迟到——处理作业可能仅仅因为资源不足、故障或输入数据量异常大而耗时过长。依赖上游数据集的下游批量作业要么本身会延迟，要么会产生不完整的结果并需要在以后重新运行。事件流只是将时间顺序的考量提到了更重要的位置。\n\
  \n## 摘要\n\n最终一致性管理起来有点棘手，但总的来说，关键在于意识到它是如何被引入的，并判断是否需要对其进行缓解。事件流为每个消费者提供了收敛到相同最终状态的手段。虽然每个消费者都必须通过正确处理和将数据集成到自己的领域来履行自己的义务，但无论数据是通过事件流、静态数据批量还是请求-响应\
  \ API 来源，这一责任都保持不变。\n\n在事件驱动领域，滞后的消费服务通常会与另一个完全最新的服务或数据集不一致。在它们之间比较数据可能会显示出不一致，这是可以预料的，因为两者都在各自的相对时间框架内运行。有很多方法可以处理这个问题。一种方法是简单地通过其他上下文各自的事件流来获取数据。如果不可能，则应计划应对不一致，并制定重试和缓解策略来处理它们。\n\
  \n当一个数据产品中的数据引用另一个可能尚未生成的数据产品中的数据时（例如任何事件通过主键或外键连接的数据产品），也会出现最终一致性问题。虽然消费者可能都已跟上最新写入的事件，但它们尚未与数据的上游生产者收敛到相同状态。\n\
  \n最后，乱序数据可能会带来额外的复杂性，尤其是当许多并行生产者向同一流写入带有略有偏移的时间戳的事件时。消费者可以使用迟到逻辑独立处理乱序事件，但他们必须意识到，他们最终可能会以与邻居不同的方式解释数据。最佳实践是将迟到逻辑的实现与数据产品的\
  \ SLA 关联起来，以便您的消费者在 SLA 保证范围内对任何可用性或一致性问题具有韧性。\n\n在我们的下一章也是最后一章中，我们将回顾本书中涵盖的内容，并总结在未来数据网格中需要注意的事项。\n"
- '## 汇总


  数据网格建立在四个原则之上，这些原则基于处理难以使用的数据时吸取的教训，此类数据通常不过是运营应用程序排放的一种废气。在数据原始来源之外获取和访问数据的机制通常是作为后续添加的，以临时方式附加到源系统上。


  数据网格将数据提升为产品，采用与业务中任何其他产品相同的严谨性、所有权和功能管理。取而代之的是目的明确、受维护和支持的模式，而非“随便用，自己想办法”的数据访问方式。这既是社会转变，也是技术转变，需要自上而下和自下而上的支持。我们重新思考如何拥有、创建、发现和访问数据，然后构建使其运作所需的流程、治理和技术。


  事件流是实现数据网格的首选方案。它们为历史数据和实时数据通信提供了一种单一机制，构成了数据网格的基本构建块，供消费者根据需要使用、混合和匹配。


  数据网格基于四个主要原则：领域所有权、数据即产品、联邦治理和自助服务平台。这些原则共同帮助我们专注于安全、有效且大规模地在整个组织中传达重要业务数据：


  - 领域所有权


  最了解数据的人被赋予了责任，需要让同事和同行随意使用和访问这些数据。域所有者会与潜在消费者协商以获取数据需求，并确保满足业务需求。他们仍负责保护内部领域模型，防止外部方过度暴露和不可接受的耦合，以便内部模型和外部数据产品都能独立演变和变化。


  ### 数据即产品


  重要业务数据需要作为构建块原语，随时可靠地为您的应用程序提供，无论应用程序的运行时、环境或代码库如何。我们可以通过专注于将数据创建为产品来实现这一目标，将数据视为一等公民，并配备专用所有权、最低质量保证、SLA
  以及干净可靠访问的可扩展机制。


  数据产品充当构建业务服务的基本构建块，使消费者能够为自己的用例访问和使用数据。


  ### 联邦治理


  联邦治理关注的是维持稳定与秩序，平衡个人自主权与自上而下的集中控制。


  由参与数据网格的人员组成的治理团队，负责满足域所有者、数据产品创建者、数据产品用户和基础设施提供者的需求。与任何有效治理形式一样，治理团队需要参与、代表、辩论和协作行动才能完成有意义的工作。治理团队指导自助服务平台的需求，重点是提高可发现性、易用性和与其他数据产品的互操作性。


  成功的联邦治理将产生易于构建、管理和使用的数据产品。数据产品所有者在自助服务平台上构建和管理其数据产品时应拥有合理的选择。还应为他们提供护栏，以支持必要的非功能性业务要求，例如加密、访问控制和自动数据保留管理。


  ### 自助服务平台


  正如每个数据网格实现都独一无二一样，其自助服务平台也是如此。创建自助服务平台的主要目标包括使以下操作变得容易：


  - 浏览、发现和搜索可用的数据产品

  - 授予、限制和管理访问控制

  - 申请计算、存储和服务组件，包括事件流

  - 管理数据产品生命周期，包括原型设计、发布、弃用和删除


  构建自助服务平台需要与数据产品所有者和联邦治理团队密切合作。您成功的最佳机会是从一个最小可行产品开始，该产品由您已经使用的技术和控制系统组成。将您的自助服务数据平台视为任何其他产品，随着使用模式和要求变得更加清晰，迭代添加和测试新功能。


  ### 数据网格的事件流


  事件是关于某事发生的不可变且自包含的记录。事件流是事件的不断更新的数据结构，每个流代表一组重要的业务事实。


  事件流是服务数据产品的理想机制，因为它们提供了一种简单而强大的方式，可在整个组织中可靠地传达重要业务数据。事件流快速、可扩展且高效，可让消费者在新数据可用时立即得知，并能针对任何用例在整个业务中实现实时响应。


  状态事件是构建数据产品的最佳选择，尽管您在选择上有一定余地。您可以包含诸如 _原因_ 状态发生变化的信息，将增量事件的某些方面与状态事件结合起来。但要谨慎，不要在数据产品中过度暴露源领域中的特定业务逻辑转换，因为它们会引入强耦合接缝。


  Kappa 架构与状态事件协同工作。您可以仅从事件流中获取数据产品的完整历史，而不必像 Lambda 架构那样将历史和实时数据访问分开。历史状态可以通过从较早时间点消费事件流来访问。您可以使用压缩来消除较旧、不再相关的状态事件，使消费者访问数据变得快速、简单且廉价。


  简单性是使数据网格运作的关键，事件流提供了一种简单而强大的解决方案，可让数据随时可用。


  ### 与现有系统集成


  数据网格实现很少（如果有的话）是从零开始的开发。数据网格解决的痛点很大程度上是由组织的增长和多个不同用例对重要业务数据的需求造成的。因此，在构建数据网格时，您需要应对所有现有系统，并迭代努力改善数据在整个组织中的创建、共享和使用方式。





  从现有数据库和系统中引导数据是开始使用数据网格的重要部分。您可以快速轻松地将数据发布到事件流中，以便消费者可以开始在自己的领域中试用它。它还能引发关于谁拥有连接器、进而谁拥有数据、领域以及管理功能请求以更改可用数据及其表示方式的讨论。


  通常，引导式数据反映了源系统的内部领域模型。来自关系数据库的高度规范化数据往往难以使用，下游用户需要进行复杂且代价高昂的反规范化。事件频率、事件大小和紧密的内部耦合仍然是引导式数据产品需要关注的问题。


  引导式数据产品仍然是通往一流数据产品（具有明确架构、反规范化数据结构以及与内部数据模型隔离）途中的垫脚石。但它们仍然是数据网格迭代增长的重要部分。


  ## 运营、分析与两者之间的一切


  数据网格最初是为了解决分析领域固有的数据访问和可靠性问题而提出的。然而，它已被证明是为运营系统以及那些难以分类为其中一类的系统提供动力的一种强大非标签解决方案。可靠地访问干净、定义明确、低延迟的数据是战略灵活架构的基石。您可以自由创建、测试和试用新业务系统，而无需为数据访问而苦苦挣扎。您的系统将不再像弗兰肯斯坦的怪物那样，仅仅为了访问底层数据而被拼凑在一起。


  事件流在为对时间敏感的应用程序提供动力方面发挥着关键作用。运营系统（尤其是有人参与循环的系统）从低延迟状态事件中获益匪浅。分析系统则通过从运营系统的相同来源获取数据而获益，缓解了历史上困扰数据领域的“类似却又不同”的数据来源问题。


  ## 摘要


  事件驱动的数据网格是对未来的投资。要成功采用它，需要识别组织中的数据痛点，以便开始应用四项原则。通过帮助同事了解数据网格如何解决他们长期存在的数据问题，获得他们的支持。


  进行迭代工作。您的数据网格不会一夜之间突然出现。试用新解决方案，从错误中吸取教训，并进行迭代改进。一路上发现价值对于保持人们投入并从数据产品中获益至关重要。


  最后，在构建数据网格的过程中庆祝成功。道路将曲折曲折，有时您可能会感觉倒退。与同行分享您的磨难与考验，并共同努力寻找共同点和新的前进方向。祝您未来之旅顺利。


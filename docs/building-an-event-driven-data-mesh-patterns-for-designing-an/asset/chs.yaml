- "## 事件驱动的数据通信\n\n企业与数据的关系正在快速变化。企业的所有数据都能整齐地装入单个关系数据库的日子已经一去不复返。始于二十多年前的大数据革命已经发展演变，仅将海量数据集存储在大数据湖中进行批量分析已不再足够。速度和互联互通已成为下一代主要竞争性业务要求，再次改变了企业创建、存储、访问和共享重要数据的方式。\n\
  \n数据是企业的命脉。但企业创建、共享和使用数据的许多方式都是杂乱无章且彼此脱节的。数据网格为重新审视这些往往功能失调的关系提供了一个全面的框架，并提供了一种在组织内思考、构建和共享数据的新方式，从而使我们能够做出有帮助和有用的事情：为客户提供更好的服务、无错误的报告、可操作的洞察，以及实现真正的数据驱动流程。\n\
  \n为了了解我们试图修复的问题，我们首先需要了解现代企业面临的主要数据问题。\n\n首先，支撑公司业务分析引擎的大数据系统在规模和复杂性上已急剧膨胀。已经有许多尝试来解决和降低这种复杂性，但它们都未能达标。\n\
  \n其次，大型企业的业务运营早已超越了由单体部署服务的阶段。多服务部署已成为常态，包括微服务和面向服务的架构。这些模块化系统的边界很少容易定义，尤其是当许多独立的运营和分析系统依赖于对同一数据集的只读访问时。这里存在一种对立的张力：一方面，将业务功能部署在同一个应用程序中可以提供对该系统生成和存储的所有数据的一致访问。另一方面，这些业务功能之间除了需要共同只读访问重要业务数据外，可能根本没有任何关系。\n\
  \n第三，运营和分析领域共同面临的一个问题：无法访问高质量、文档齐全、自动更新且可靠的数据。组织处理的数据量年年大幅增加，迫切需要更好的排序、存储和使用数据的方法。这种压力给将一切保存在单个数据库中的理想致命一击，并迫使开发人员将单体应用程序拆分为带有各自数据库的独立部署。与此同时，大数据团队努力跟上这些运营系统的碎片化和重构步伐，因为他们仍然独自负责获取自己的数据。\n\
  \n数据在历史上一直被视为二等公民，被视为业务应用程序排放的废气或副产品。这种以应用为先的思维仍然是当今计算环境中问题的主要根源，导致了临时搭建的数据管道、拼凑在一起的数据访问机制以及相似却不尽相同的真理来源不一致。数据网格通过从根本上改变我们与数据的关系，直面这些缺陷。数据及其访问权不再是次要的副产品，而是被提升为与任何其他业务服务地位平等的一等公民。\n\
  \n重要的业务数据需要作为应用程序的构建块原语，随时可靠地可用，无论应用程序的运行时、环境或代码库如何。我们将数据视为一等公民，配备专属所有权、最低质量保证、服务级别协议（SLA）以及用于干净可靠访问的可扩展机制。事件流是提供此数据的理想机制，以一种简单而强大的方式在组织内可靠地传达重要业务数据，使每个消费者能够访问和使用他们需要的数据原语。\n\
  \n在本章中，我们将审视塑造当今常用运营和分析工具与系统的力量，以及伴随它们而来的问题。当代数据架构中巨大的低效为我们提供了丰富的经验，我们将把这些经验应用到事件驱动的解决方案中。这将为下一章奠定基础，届时我们将讨论数据网格的整体。\n\
  \n## 什么是数据网格？\n\n数据网格由扎马克·德赫加尼发明。它是跨组织创建、访问和共享数据方式的一项社会和技术转变。数据网格提供了一种 *通用语言*，用于讨论不同团队、领域和服务的需求与职责，以及它们如何协作使数据成为一等公民。本章探讨构成数据网格基础的原则。\n\
  \n\n\n\n在我的上一本书 *Building Event-Driven Microservices*（O'Reilly）中，我引入了 *数据通信层* 这一术语，涉及与数据网格许多相同的原则：将数据视为一等公民，形式化域间通信的结构，将数据发布到事件流以供通用用途，并使数据生产者和消费者都能轻松使用。虽然我喜欢数据通信层这一术语，但现实是，我认为数据网格的语言和形式化原则为我们讨论这个问题提供了一切所需，*无需*\
  \ 引入另一个“数据某某某”范式。\n\nDehghani 的书 *Data Mesh*（O'Reilly）深入详细地展示了数据网格的理论和思想领导力，但仍然必然对特定实施保持中立。\n\
  \n在本书中，我们将探讨数据网格的一个实际实现，它使用事件流作为跨域数据通信的主要数据产品模式。我们可以更加务实，理论方面不那么深入，而在事件驱动设计的实施方面更加具体和明确。虽然我认为事件流从根本上说是跨域通信的最佳选择，但它们也伴随着权衡，我当然也会涵盖这些权衡，并在最适合的地方提及非流式可能性。\n\
  \n数据网格基于四个主要原则：域所有权、数据即产品、联邦治理和自助服务平台。这些原则共同帮助我们构建一种在整个组织内传达重要业务数据的方式。我们将在下一章更详细地评估这些原则，但在到那之前，让我们先看看\
  \ *为什么数据网格今天很重要*。\n\n## 事件驱动的数据网格\n\n大数据实时流动的现代竞争要求，结合现代云计算，要求我们重新思考企业如何创建、存储、移动和使用数据。这种新数据架构的基础是事件，即代表真实业务活动的数据量子，通过大量专门构建的事件流提供。事件流提供了一种中枢神经系统的手段，使业务单元能够访问和使用基本的、自更新的数据构建块。这些数据构建块与容器化、基础设施即服务（IaaS）、持续集成（CI）和持续部署（CD）管道以及监控解决方案并列，是现代云应用程序构建所依赖的组件。\n\
  \n事件流并非新事物。但支撑以前事件驱动架构的许多技术限制，例如有限的规模、保留期和性能，已在很大程度上得到缓解。现代多租户事件代理配备分层存储，可以存储无限量的数据，消除了限制以前架构的严格容量限制。生产者将其重要的业务域数据写入事件流，使其他人可以与该流耦合并使用数据构建块来构建自己的应用程序。最后，消费者应用程序反过来可以创建自己的事件流，与他人共享自己的业务事实，从而为所有人创建一个标准化的通信网格。\n\
  \n数据网格为构建这个互联的中枢神经系统提供了非常有用的概念和语言。图 1-1 显示了数据网格可能的基本示例。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_17_0.png)\n\
  \n图 1-1. 一个非常基础的 Hello Data Mesh 实现\n\n拥有操作系统 Alpha 的团队从其服务边界中选择一些数据，对其进行重新建模，并将其写入源对齐数据产品（该产品由他们拥有，我们将在“三种数据产品对齐类型”第\
  \ 33 页中详细介绍数据产品对齐）。拥有操作系统 Beta 的团队将数据从该数据产品读取到其自身服务边界中，再次对其进行重新建模、转换，并仅存储他们需要的内容。\n\
  \n与此同时，第三个团队连接到 Alpha 团队的数据产品，并使用它来构建自己的聚合对齐数据产品。同一团队随后使用其聚合对齐数据产品，既为流式分析用例提供动力，又将一批文件写入云存储，数据分析师将使用它来编写报告并为现有的基于批处理的分析作业提供动力。\n\
  \n这个图表仅仅是数据网格冰山的一角，还有许多领域需要涵盖。但事件驱动数据网格的要点是，将数据以实时方式轻松提供给任何需要它的消费者。\n\n数据网格解决的许多问题已经存在很长时间了。我们现在将进行一次简短的历史回顾，以便更好地理解我们正在解决\
  \ *什么* 问题，以及 *为什么* 数据网格是一个非常相关且强大的解决方案。\n\n## 在操作面中使用数据\n\n数据通常由正在 *处理业务事务* 的操作系统创建。最终，这些数据往往会被拉入分析面用于分析和报告。在本节中，我们将重点介绍操作面的一些内容，以及与其他操作（和分析）服务共享业务数据的常见挑战。\n\
  \n### 数据单体\n\n在线事务处理（OLTP）数据库构成了当今大多数操作计算机服务的基础（为简单起见，我们将其称为“单体”）。单体系统在操作面中往往扮演重要角色，因为一致的同步通信通常比异步通信更容易理解和开发。关系型数据库，例如\
  \ PostgreSQL 和 MySQL，在单体应用程序中占据重要地位，为应用程序提供原子性、一致性、隔离性和持久性（ACID）事务以及一致状态。\n\n应用程序和数据库共同展示了以下\
  \ *单体数据原则*：\n\n- *数据库是真理来源*\n  单体依赖底层数据库作为应用程序的持久信息存储。任何新记录或更新记录首先都会写入数据库，使其成为这些实体的\
  \ *权威真理来源*。\n\n- *数据具有强一致性*\n  当单体的数据存储在典型的关系型数据库中时，它具有强一致性。这为业务逻辑提供了强读后写一致性，并且得益于事务，它不会意外访问部分更新的记录。\n\
  \n- *只读数据随时可用*\n  存储在单体数据库中的数据可以由单体的任何部分轻松访问。只读访问权限确保不会对数据进行意外更改。\n\n请注意，数据库应仅由拥有它的服务直接访问，而不应用作集成点。\n\
  \n这三个原则构成了使单体架构强大的约束力。您的应用程序代码对存储在单体数据库中的整个数据范围具有只读访问权限，作为一组权威、一致且可访问的数据基元。只要功能在同一应用程序中，这个基础就使构建新应用程序功能变得容易。但如果您需要构建一个新应用程序呢？\n\
  \n### 为操作问题传达数据的困难\n\n新应用程序无法依赖于如果它作为单体的一部分构建时所能获得的相同轻松访问数据基元的方式。如果新应用程序不需要单体中的任何业务数据，这将不是问题。但情况很少如此，因为企业实际上是一组重叠的域，尤其是共同核心，相同的数据服务于多个业务需求。例如，电子商务零售商可能依赖其单体来处理订单、销售和库存，但需要一个由文档数据库（或其他数据库类型）驱动的新应用程序来实现纯文本搜索功能。图\
  \ 1-2 凸显了问题的关键：如何将数据从 Ol’ Reliable 移入新的文档数据库以提供搜索功能？\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_19_0.png)\n\
  \n图 1-2. 新搜索服务团队必须想办法将所需数据从单体中导出并保持最新\n\n这给新搜索服务团队带来了一些困境。该服务需要访问单体中的项目、商店和库存数据，但它还需要将所有数据建模为搜索引擎的一组文档。团队尝试解决此问题的两种常见方法是：一种是将数据复制并转换到搜索引擎，试图保留三个单体数据原则。第二种是使用\
  \ API 重构源系统的服务边界，例如\n\n\n\nthat the same data isn’t simply copied out—but served\
  \ completely from a single system. Both can achieve some success, but are ultimately\
  \ insufficient as a general solution. Let’s take a look at these in more detail\
  \ to see why.\n\n## 策略 1：在服务之间复制数据\n\nThere are several mechanisms that fall under\
  \ this strategy. The first and simplest is to just reach into the database and grab\
  \ the data you need, when you need it. A slightly more structured approach is to\
  \ periodically query the source database and dump the set of results into your new\
  \ structure. While this gives you the benefit of selecting a different data store\
  \ technology for your new service, there are a few major drawbacks:\n\n### 与源紧密耦合\n\
  \nYou remain coupled on the source database’s internal model and rely on it exclusively\
  \ to handle your query needs.\n\n### 对源的性能负载\n\nLarge data sets and complex queries\
  \ can grind the database to a halt. This is especially true in the case of denormalizing\
  \ data for analytical use cases, where multi-table and complex joins are common.\n\
  \nThe second most common mechanism for the data replication strategy is a read-only\
  \ replica of the source database. While this may help alleviate query performance\
  \ issues, consumers still remain coupled on the internal model. And, unfortunately,\
  \ each additional external coupling on the internal data model makes change more\
  \ expensive, risky, and difficult for all involved members.\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_20_0.png)\n\
  \nCoupling on the internal data model of a source system causes many problems. The\
  \ source model will change in the course of normal business evolution, which often\
  \ causes breakages in both the periodic queries and internal operations of all external\
  \ consumers. Each coupled service will need to refactor its copy of the model to\
  \ match what is available from the source, migrate data from the old model to the\
  \ new model, and update its business code accordingly. There is a substantial amount\
  \ of risk in each of these steps, as a failure to perform each one correctly can\
  \ lead to misunderstandings in the meaning of the models, divergent copies of the\
  \ data, and ultimately incorrect business results.\n\nData replication strategies\
  \ become more difficult to maintain with each new independent source and each new\
  \ required replica. This introduces a few new issues:\n\n- The original data set\
  \ can be difficult to discover\n\nIt's not uncommon for a team to accidentally couple\
  \ its service on a copy of the original data, rather than the original data itself.\
  \ It can be difficult to discover what the original source of data is without resorting\
  \ to informal knowledge networks.\n\n- Increase in point-to-point connections\n\n\
  Additionally, each new independent service may become its own authoritative source\
  \ of data, increasing the number of point-to-point connections for inter-service\
  \ data replication.\n\nPoint-to-point replication of data between services introduces\
  \ additional complexity, while simultaneously introducing tight coupling on the\
  \ internal data model of the source. It is insufficient for building the modern\
  \ data communications layer.\n\n## 策略 2：使用 API 避免数据复制需求\n\nDirectly coupled request-response\
  \ microservices, also sometimes known as synchronous microservices, are another\
  \ common approach to dealing with accessing remote data. Microservices can directly\
  \ call the API of another service to exchange small amounts of information and perform\
  \ work on each other's behalf.\n\nFor example, you may have one microservice that\
  \ manages inventory-related operations, while you have other microservices dedicated\
  \ to shipping and accounts. Each of these services' requests originate from the\
  \ dedicated mobile frontend and web frontend microservices, which stitch together\
  \ operations and return a seamless view to users, as shown in Figure 1-3.\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_21_0.png)\n\
  \n*Figure 1-3. An example of a simple ecommerce microservice architecture*\n\nSynchronous\
  \ microservices have many benefits:\n\n- Purpose-built services serve the needs\
  \ of the business domain.\n- The owners have a high level of independence to use\
  \ the tools, technologies, and models that work best for their needs.\n- Teams also\
  \ have more control over the boundaries of their domains, including control and\
  \ decision making over how to expand them to help serve other clients' needs.\n\n\
  There are numerous books written on synchronous microservices, such as *Building\
  \ Microservices* by Sam Newman (O’Reilly) and *Microservices Patterns* by Chris\
  \ Richardson (Manning), that go into far more detail than I have space for, so I\
  \ won't delve into them in much detail here.\n\nThe main downsides of this strategy\
  \ are the same as with a single service:\n\n- There is no easy and reliable mechanism\
  \ for accessing data beyond the mechanisms provided in the microservices' API.\n\
  - Synchronous microservices are usually structured to offer up an API of *business\
  \ operations*, not for serving reliable bulk data access to the underlying domain.\n\
  - Most teams resort to the same fallbacks as a single monolith does: reach into\
  \ the database and pull out the data you need, when you need it, (see Figure 1-4).\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_22_0.png)\n\nFigure 1-4. The microservice\
  \ boundaries may not line up with the needs of the business problem\n\nIn this figure,\
  \ the new service is reliant on the inventory, accounts, and shipping services just\
  \ for access to the underlying business data—but not for the execution of any business\
  \ logic. While this form of data access *can* be served via a synchronous API, it\
  \ may not be suitable for all use cases. For example, large data sets, time-sensitive\
  \ data, and complex models can prevent this type of access from becoming reality.\
  \ In addition, there is the operational burden of providing the data access API\
  \ and data serving performance on top of that of the base microservice functionality.\n\
  \nOperational systems lack a generalized solution for communicating important business\
  \ data between services. This isn’t something that’s isolated to just operations.\
  \ The big data domain, underpinning and powering analytics, reporting, machine learning,\
  \ AI, and other business services, is a voracious consumer of full data sets from\
  \ all across the business.\n\nWhile domain boundary violations in the form of smash\
  \ and grab data access are the foundation on which big data engineering has been\
  \ built (I have been a part of such raids during the decade I have spent in this\
  \ space), fortunately for us, it has provided us with rich insights that we can\
  \ apply to make a better solution for all data users. But before we get to that,\
  \ let’s take a look at the big data domain requirements for accessing and using\
  \ data and how this space evolved to where it is today.\n\n## The Analytical Plane:\
  \ Data Warehouses and Data Lakes\n\nWhereas operational concerns focus primarily\
  \ on OLTP and server-to-server communication, analytical concerns are historically\
  \ focused on answering questions about the overall performance of the business.\
  \ Online analytical processing (OLAP) systems store data in a format more suitable\
  \ to analytical queries, allowing data analysts to evaluate data on different dimensions.\
  \ Data warehouses help answer questions such as “How many items did we sell last\
  \ year?” and “What was our most popular item?” Answering these questions requires\
  \ remodeling operational data into a model suitable for analytics, and also accounting\
  \ for the vast amounts of data where the answers are ultimately found.\n\nGetting\
  \ data into a data warehouse has historically relied on a process known as Extract,\
  \ Transform, and Load (ETL), as shown in Figure 1-5.\n\n\n\n\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_24_0.png)\n\
  \n图 1-5. 典型的数据仓库 ETL 工作流\n\n从历史上看，数据仓库在提供分析结果方面已被证明很成功。但不断增加的数据量和计算负载需要更大的磁盘驱动器和更强大的计算芯片，最终触及了计算机硬件的物理极限。因此，与其继续纵向扩展，不如转向横向扩展。\n\
  \n对 Google 来说，对大规模扩展的需求显而易见，该公司于 2003 年 10 月发表了 **Google 文件系统**。这个时代见证了大数据的诞生，并促使全球对如何创建、存储、处理以及最终使用数据进行了大规模重新思考。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_24_1.png)\n\n许多现代数据仓库也提供高可扩展性，但直到大数据革命到来，这才成为现实。从历史上看，数据仓库受到与任何在单服务器上运行的系统相同的因素的限制。\n\
  \n**Apache Hadoop** 迅速成为解决传统 OLAP 系统面临的扩展问题的权威方法。由于它是免费开源的，任何公司、任何地方都可以使用它，前提是你能弄清楚如何管理基础设施要求。它还提供了一种计算分析的新方式，在这种方式下，你不再受限于受单台计算机资源限制的专有系统。\n\
  \nHadoop 引入了 Hadoop 分布式文件系统 (HDFS)，这是一个耐用、容错的文件系统，使得创建、存储和处理跨越多个通用硬件节点的真正大规模数据集成为可能。虽然\
  \ HDFS 现在已被 Amazon S3 和 Google Cloud Storage 等方案大部分取代，但它为一个大胆的新想法铺平了道路：无论大小，将所需的所有数据复制到一个单一逻辑位置，并应用处理来清理、筛选并将数据重塑为推导重要业务分析所需的格式。\n\
  \n大数据架构在对待数据的心态上引入了重大转变。它不仅解决了现有 OLAP 系统的容量问题，还向数据世界引入了一个新概念：使用非结构化或半结构化数据不仅是可以接受的，而且是更可取的，而不是像数据仓库那样强制执行写入时模式。在这个大数据新世界中，你可以自由地写入带有或不带任何模式或结构的数据，并在查询时通过应用读取时模式稍后解决所有问题。许多数据工程师很高兴摆脱了写入时模式的要求，因为这使得只需将数据放入生态系统变得更容易。\n\
  \n表 1-1. 关系型数据库管理系统与 Hadoop 的比较（约 2009 年）\n\n| | 传统 RDBMS | MapReduce |\n|---|---|---|\n\
  | 数据大小 | GB | PB |\n| 访问 | 交互式和批处理 | 批处理 |\n| 更新 | 多次读写 | 写一次，多次读取 |\n| 结构 | 静态模式\
  \ | 动态模式 |\n| 完整性 | 高 | 低 |\n| 扩展 | 非线性 | 线性 |\n\n值得注意的是，这份 2009 年的权威指南推广 MapReduce\
  \ 作为处理具有动态模式的低完整性数据的解决方案，强调 HDFS 应该以低完整性存储非结构化数据，并带有在运行时解决的各种可能相互冲突的模式。它还指出，这些数据是“写一次，多次读取”，这恰恰是你需要一个强大、一致、强制执行的模式的场景——这为善意但不受约束的数据使用者提供了大量机会，让他们应用一个误解或使数据无效的读取时模式。\n\
  \n写入时模式（包括带有类型、默认值、可空性和名称的定义明确的列）并不一定以任何方式限制下游转换。它也不强迫你在写入前反范式化或连接任何数据。\n\n模式确实为你提供了一个合理性检查，确保你摄入的数据至少符合下游处理器的最基本预期。放弃这个合理性检查会将错误检测推向下游，给试图使用数据的人带来重大困难。\n\
  \n在 Hadoop 早期，我认为我自己——或者许多其他人——都没有意识到读取时模式的概念最终会如何改变数据的收集、存储和分析方式。我们相信并支持这样一种想法：按需获取数据，事后再弄清楚，稍后重新构建、清理并强制执行模式。这也让那些考虑迁移到\
  \ Hadoop 以缓解分析约束的人觉得非常容易接受，因为这种迁移不会限制你的写入过程，也不会用严格的数据摄入规则来烦扰你——毕竟，你可以在数据复制过后再修复它！\n\
  \n不幸的是，将非结构化数据存储以供读取时模式使用这一基本原则，被证明是大数据革命引入的代价最高、破坏性最大的信条之一。让我们来看看这如何具体负面影响分布式数据访问，以及为什么定义明确的模式化数据是数据网格中如此重要的信条。\n\
  \n## 读取时模式的组织影响\n\n在读取时而非写入时强制执行模式，会导致我们所谓的“坏数据”大量泛滥。缺乏写入时检查意味着写入 HDFS 的数据可能不符合读者在现有工作中使用的模式，如图\
  \ 1-6 所示。一些坏数据会导致消费者停止处理，而其他坏数据可能会悄然未被发现。虽然这两者都有问题，但静默失败可能是致命的，而且难以检测。\n\n| 记录 ID\
  \ | 名称（字符串，非 NULL） | 大小（字符串，非 NULL） | 数量（int > 0） | 价格（Float） | 是否符合预期模式 |\n|---|---|---|---|---|---|\n\
  | 1 | \"Adam Bellerame\" | \"Medium\" | -3 | $12.50 | 否 |\n| 2 | \"Mackenzie B.\
  \ Dog\" | \"Small\" | 15 | $22.37 | 是 |\n| 3 | 8675309 | NULL | 12 | $98.75 | 否\
  \ |\n| 4 | NULL | \"Extra-Large\" | 100 | <null> | 否 |\n| ... | ... | ... | ...\
  \ | ... | ... |\n| 100 | \"Julia Banderas\" | \"Tiny\" | 2 | $12.50 | 是 |\n\n图 1-6.\
  \ 数据集中坏数据的示例，仅在读取时发现\n\n为了更好地理解读取时模式的破坏性影响，让我们来看看三个角色及其相互关系。虽然我受限于自身经验，但在职业生涯中，我很有幸与来自不同公司和业务线的许多其他数据人员交谈。我可以自信地说，虽然不同组织的职责有所不同，但这一角色摘要在很大程度上适用于大多数使用大数据的当代组织：\n\
  \n### 数据分析师\n\n负责回答业务问题、生成洞察并创建数据驱动的报告。数据分析师查询数据工程师提供的数据集。\n\n### 数据工程师\n\n负责从组织各处系统中获取重要业务数据，并将其转换为数据分析师可使用的格式。\n\
  \n### 应用开发人员\n\n负责开发解决业务问题的应用程序。该应用程序的数据库也是数据分析师完成工作所需数据的*也是*来源。\n\n从历史上看，采用 Hadoop\
  \ 最常见的方式是建立一个专门的*数据团队*，它可以是常规工程团队的子集，也可以完全独立于该团队。数据工程师会进入应用开发人员的数据库，获取所需数据，并将其拉出放入\
  \ HDFS。数据科学家会对其进行清理和重构（并可能在此基础上构建机器学习模型），然后将其传递用于分析。\n\n最后，数据分析师会查询和处理捕获的数据集，以回答他们的分析问题。然而，这种模式导致了许多问题。数据团队与应用开发人员之间的交流不频繁，通常围绕确保数据团队的查询负载不影响生产服务能力展开。\n\
  \n这种关注点和职责的分离存在三个主要问题。让我们来看看它们。\n\n### 问题 1：违反数据模型边界\n\n摄入到分析领域的数据与源的*内部数据模型*耦合，导致该数据的所有下游用户都直接耦合。对于简单且很少更改的源，这可能不是什么大问题。但许多模型跨越多个表，是专门为\
  \ OLTP 操作构建的，并且随着业务用例的变化可能会进行大量重构。直接耦合于这个内部模型会使所有下游用户暴露于这些变化之下。\n\n\n\n\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_28_0.png)\n\
  \n我见过的一个例子是，表格修改默默破坏了下游作业，涉及将一个字段从 boolean 改为 long。原始版本代表对“客户是否付费推广此项？”这一问题的答案。更新版本代表新扩展域的预算\
  \ ID，将模型的这一部分与预算及其关联类型（包括新的试用类型）联系起来。该企业已采用“先试后买”模式，即预留，比如，几百美元的广告积分来展示推广效果，而不将其计入总毛收益。\n\
  \n摄取这些数据到 HDFS 的作业毫无滞后（无写入 schema），但一些下游作业开始报告奇怪的值。其中大多数是 Python 作业，它们轻易地将新的 Long\
  \ 值评估为 Booleans，导致各种用户分析的过度归因。不幸的是，因为没有作业实际中断，此问题直到一位客户开始询问其报告中异常结果时才被发现。这只是我遇到的众多例子之一，其中出于好意、合理的对系统数据模型的更改，会对所有已与之耦合的人产生意外后果。\n\
  \n### Problem 2: Lack of single ownership\n\n应用开发人员是领域专家和源数据模型的掌控者，但他们将数据传达给其他团队（例如大数据团队）的责任通常不存在。相反，他们的职责通常在其应用程序和数据库的边界处结束。\n\
  \n与此同时，数据工程师的任务是找到一种方法，及时将数据从应用开发人员的数据库中提取出来，而不会对生产系统产生负面影响。数据工程师依赖于数据源，但通常对数据源的变化几乎没有影响力，使其角色非常被动。这种生产/数据鸿沟在许多组织中是一个非常真实的障碍，尽管尽力而为、有协议、集成检查和预防性工具，数据摄取管道中的中断仍然是常见主题。\n\
  \n最后，负责实际使用数据来获取商业价值的数据分析师，与领域专家（应用开发人员）相隔两度分离；如果中间还有一层不断处理数据的数据科学家，则相隔三度分离。分析师和数据科学家都必须处理数据工程师能够提取的任何数据，包括解决与其现有读取\
  \ schema 不匹配的不一致数据。由于数据分析师经常与其他数据分析师共享他们的 schema，他们还需要确保其解析后的 schema 不会破坏彼此的工作。随着组织及其数据的增长，这变得越来越难以做到，而不幸的是，他们的解决努力仍然局限于仅惠及其他分析师。运营用例必须自己想办法获取数据。\n\
  \n### Problem 3: Do-it-yourself and custom point-to-point data connections\n\n小型组织的数据团队可能只有寥寥数名成员，而大型组织的数据团队则由数百或数千名成员组成。对于大型数据组织来说，根据用例、团队边界和技术边界，将相同的数据源拉入数据平台的多个不同子域中是很常见的。\n\
  \n例如，销售数据可能会被拉入分析部门、消费者报告部门和应收账款部门。每个子组通常会独立创建、调度和执行 ETL 作业，将数据拉入其自身的子域，从而导致源数据的多个独立托管副本，如图\
  \ 1-7 所示。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_29_0.png)\n\nFigure 1-7. Three\
  \ analytical domains, each grabbing data from where it can to get its work done\n\
  \n尽管专门构建的点对点数据连接让用户能在需要的地方访问所需数据，但最终会造成一团混乱。很难说 ETL 作业归谁所有，尤其是当用户和团队共享访问凭据时。追溯血缘、新鲜度以及确定数据集的所有权同样困难，通常会导致新\
  \ ETL 作业的进一步增多。毕竟，如果你不确定数据是否正是你所需要的，那么不如自己制作一个作业和一个副本以求保险。\n\n在源上强制执行访问控制可以帮助澄清谁可以访问哪些数据，但仅限于主源。但是，限制数据访问可能会适得其反。冗长或繁琐的访问流程可能导致人们直接从其他受保护较少的源制作副本。在图\
  \ 1-7 中，请注意，预测域只是通过从用户洞察域复制销售数据来规避源访问控制。\n\n但这些副本 _really_ 是同一份数据吗？同步频率、转换、时区、间歇性故障以及错误的环境（例如，暂存环境而非生产环境）只是可能影响复制源完整性的少数问题。你可能\
  \ _think_ 你得到了正确的数据，但实际上并没有，而且你并不知道。例如，你复制一个数据集，以为它同步到 UTC-0 时间，但实际上它同步到 UTC-6。数据的格式、分区和顺序可能看起来相同，但这些难以检测、未记录的差异仍然存在。\n\
  \n自定义点对点连接难以维护，会导致数据泛滥，并可能导致许多重复的同步作业，这些作业生成相似但不同的数据。\n\n这种支离破碎的模式以及数据所有权和分发的责任导致了\
  \ _bad data_，这在时间、金钱和错失机会方面代价高昂。让我们先看看成本，然后再总结数据网格声称能解决这些问题的原因。\n\n## Bad Data:\
  \ The Costs of Inaction\n\n坏数据通常在应用到 schema 之前都不易被发现。例如，你无法将 TEXT 插入数据库的 Int32 列中。然而，通过使用读取时\
  \ schema，我们实际上将数据验证推迟到了数据管道流程的末尾。虽然我们的 _sources_ 可能使用 schema，但不能保证我们无数个点对点管道已正确将\
  \ schema 与数据一起捕获。许多 Int32 被当作 String 捕获，或者最糟糕的是，被当作 Object 捕获。\n\n修复坏数据成本高昂，而且其范围越广，代价越高。所有访问、使用、复制或处理过该数据的人都可能受到影响，并可能需要采取缓解措施。更复杂的是，并非每个消费者都会以相同的方式“修复”它。这可能导致与其他结果不一致的分歧结果，并且难以检测、追踪和纠正，堪称噩梦。\n\
  \n坏数据通常由出于好意的人无意中创建，仅仅是因为许多数据传输工具具有点对点的“伸手去抓”特性。大规模的使用进一步加剧了这一问题，团队发现不仅他们的数据集副本是错误的，而且已经错误好几个月，使用该数据集计算的每个下游作业的结果也都是错误的。这些作业可能使用数百或数千个处理节点，拥有\
  \ 32 倍到 128 倍更多的 GB 内存，每晚处理数百 TB 的数据。这仅在重新运行所有受影响作业的处理成本上就可能高达数百万甚至数千万或数亿美元。\n\n\
  商业决策也可能受到影响。我了解一个场景的细节，其中一家公司错误地向其客户共同收取了数百万美元的账单，有些情况下多收了，有些情况下少收了。原因其实相当无辜：一个\
  \ schema 变更与复杂的“伸手去抓”数据 ETL 链结合，导致在读取时应用 schema 时出现了一些数据解释问题。直到一位客户注意到其账单成本远超参与成本时，才启动了调查并发现了根本问题。\n\
  \n数据在现代计算中日益凸显的地位促使其他人研究相关成本，尤其是坏数据给企业带来多少损失。结果触目惊心。\n\n2016 年，IBM 的一份报告被《哈佛商业评论》（HBR）重点介绍，估计坏数据的财务影响仅在美国就高达\
  \ 3.1 万亿美元。尽管原始报告（令人沮丧地）不再可用，但 HBR 保留了一些更相关的数字：\n\n- 50%—知识工作者浪费在寻找数据、查找和纠正错误以及为不信任的数据寻找确认来源上的时间比例。\n\
  - 60%—数据科学家花在清理和组织数据上的时间比例的估计值。\n\n坏数据问题已经存在很长时间。随着原始源的变化，数据副本会产生分歧。副本会过时。在一个数据集中检测到的错误不会在重复副本中修复。与解释和理解数据相关的领域知识仍然不完整，原始数据所有者的支持也是如此。\n\
  \n数据网格提议通过将数据提升为一等公民、像任何其他产品一样来解决此问题。一个具有定义良好的 schema、域文档、标准化访问机制和 SLA 的数据产品可以在源头上大幅减少坏数据的影响。消费者一旦与数据产品耦合，仍可能犯自己的业务逻辑错误——这是不可避免的。但是，他们\n\
  \n\n很少仅在试图获取、理解和解释解决其业务问题所需的数据时无意中犯错。不行动不是解决方案。\n\n## 我们能统一分析与运营工作流吗？\n\n工程核心还存在另一个问题——不仅仅是数据团队面临这些数据访问和质量问题。每一个需要访问存储在其他数据库中的数据的\
  \ OLTP 应用程序，都与数据团队面临相同的数据访问问题。你如何为运营需求访问被锁定在另一服务中的重要业务数据？\n\n为了实现服务间更好的运营通信，曾有过多次尝试，包括面向服务架构、企业服务总线，当然还有点对点请求-响应微服务。但是，在这些架构中，每个服务的数据都封装在其自身数据库内，其他服务无法访问。从某种程度上说，这是件好事——内部模型受到保护，并且你拥有一个单一的真实来源。应用程序提供运营\
  \ API，其他应用程序可以调用这些 API 来代其执行工作。然而，这些解决方案并未解决根本问题：即无法全面、只读地访问权威数据集，以供其自行的运营用例使用。\n\
  \n更进一步的复杂之处在于，如今许多运营用例都依赖于分析结果。想想机器学习、推荐引擎、AI 等等。某些用例，例如生成畅销产品月度报告，可以明确标记为“分析型”，并从定期计算的作业中得出。\n\
  \n其他用例则不那么明确。考虑一家电子商务零售商，希望根据当前库存（运营型）、用户以往购买记录（分析型）以及用户实时预估的购物会话意图（分析型和运营型）来投放鞋类广告。在实际中，运营与分析之间的边界很少被清晰界定，而完全相同的数据集可能为多种目的所需要——分析型、运营型，或两者之间。\n\
  \n数据分析与传统运营系统在访问其他数据库中包含的数据时都面临巨大困难。这些困难因数据量、速度和规模的不断增加而进一步加剧，同时系统也被迫向外扩展而非向上扩展，因为各个服务的计算限制已达到瓶颈。大多数组织的数据通信策略都基于过去的技术，未能充分考虑现代云存储、计算和软件即服务（SaaS）的产品。这些工具和技术改变了组织内数据建模、存储和通信的方式，我们将在本书余下部分更详细地探讨这一点。\n\
  \n## 借助数据网格重新思考数据\n\n数据网格解决方案的前提很简单。将重要的业务数据集发布到专用、持久且易于访问的数据结构中，这些结构被称为 *数据产品*。数据的原始创建者负责对数据进行建模、演进、质量控制和支持，并对其给予与组织中任何其他产品相同的一流关怀。\n\
  \n潜在消费者可以探索、发现并订阅其业务用例所需的数据产品。数据产品应有良好的描述、易于解释，并构成一组自更新数据基元的基础，用于驱动业务服务和分析。\n\n\
  事件流在数据产品基础中扮演着最佳角色，因为它们为所有消费者提供了不可变、可追加、持久且可重放的基础。这些流成为组织内运营、分析及所有其他形式工作负载的根本真实来源。\n\
  \n该架构通过利用现代云计算和 SaaS 构建（将在第 5 章中更详细地介绍）。一个良好的工程栈使得在整个应用生命周期中创建和管理应用变得容易，包括获取计算资源、提供可扩展性、日志记录和监控功能。事件流为现代工程栈提供了正式化和标准化的数据访问，以完成工作。\n\
  \n让我们通过本提案的视角，重新审视本章前文提到的 *单体数据原则*。这三项原则概述了在单体内并置新业务功能的主要影响因素。一组自更新事件流将如何与这些原则相关联？\n\
  \n*数据库是真实来源 → 事件流是真实来源*\n\n数据域的所有者现在负责构建面向外部的模型，并将其作为一组事件写入一个（或多个）事件流。作为交换，其他服务不再能直接访问并依赖于内部数据模型，生产者也不再负责代表查询服务提供定制的业务任务（这在微服务架构中很常见）。事件流成为系统间主要的耦合点。下游服务从事件流中消费事件，针对自身目的对其建模，并将其存储在自己的专用数据存储中。\n\
  \n*数据具有强一致性 → 数据具有一致最终性*\n\n事件流生产者可以为其自身内部状态保留强读后写一致性，以及诸如本地 ACID 事务等其他数据库优势。然而，事件流的消费者在处理事件和建模状态方面是独立的，因此依赖于其对已处理数据的最终一致性视图。消费者没有事件流的写入权限，因此无法修改数据源。消费者系统设计必须考虑到最终一致性，我们将在本书后续部分更详细地探讨这一主题。\n\
  \n*只读数据随时可用（保持不变！）*\n\n事件流提供了一种正式化的机制，以只读、自更新的格式传递数据，消费者不再需要创建、管理和维护自己的提取机制。如果消费者应用程序需要保留状态，则它会使用自己的专用数据存储来实现，这与生产者的数据库完全独立。\n\
  \n数据网格正式化了组织内数据的所有权边界，并标准化了存储和通信机制。它还提供了一个可重用的框架，用于生产、消费、建模和使用数据，不仅适用于当前系统，也适用于尚未构建的系统。\n\
  \n## 对事件驱动数据网格的常见异议\n\n在讨论事件驱动数据网格时，我经常遇到几种常见的异议。尽管我们将在本书中更详细地介绍这些情况，但我现在想提出它们，以承认这些异议的存在，但每一个异议都是可以管理的。\n\
  \n### 生产者无法为每个人的用例建模数据\n\n这一论点实际上是正确的，尽管它忽略了重点。生产者的主要职责是为其域数据提供准确可靠的面向外部的公共模型，供消费者使用。这些数据模型只需暴露其他团队可以依赖的域部分；其余内部模型保持不可访问。例如，电子商务域将拥有独立的销售、商品和库存模型及事件流，简单详细说明每个销售、商品和库存级别的当前属性和值，而一家航运公司可能为每个货件、卡车和司机拥有事件流。\n\
  \n这些模型刻意简单且专注于单个域定义，从而形成紧凑、模块化的数据构建块，其他系统可以利用这些构建块构建自己的数据模型。摄入这些事件的消费者可以根据需要重新构建它们，包括将其与其他流中的事件关联，或将其与现有状态合并，以得出用于解决其业务用例的模型。消费者还可以与生产者团队接洽，请求向公共模型添加更多信息或对某些字段和值进行澄清。\n\
  \n\n\n\n由于生产者团队拥有原始数据模型，它最有资格决定模型的哪些方面应当暴露并允许他人与之耦合。事实上，没有比实际 *创建原始数据源* 的团队更有资格定义其含义以及他人应如何解释其字段、关系和值的含义。这种方法让数据源所有者能够抽象掉其内部复杂性，例如其高度规范化的关系模型或文档存储。对内部源模型的更改可以对消费者隐藏，否则消费者会直接与其耦合，从而减少中断和错误。\n\
  \n### 制作多份数据副本是不好的\n\n讽刺的是，这一反对意见在潜意识里与第一个论点相对立。虽然和之前的论点一样，它确实有一定道理。同一数据集的多份副本可能会并且确实会不经意地不同步、变得过时，或者以其他方式提供与原始数据源不一致的数据。然而，我们的提议并非让数据复制变得无序，而是要建立一个正式化且得到良好支持的流程，以制定明确的规则和职责，拥抱这一现实而非逃避它。\n\
  \n这种论点主要有三种子类型。\n\n### 数据应仅有一个主副本，所有系统都应直接引用它\n\n这一信念未能考虑到以下事实：自大数据运动兴起之初（实际上，OLAP\
  \ 也是如此）以来，全球的大数据分析团队就一直在违反这一原则，因为他们的需求无法通过某个数据库中存储的单个主副本来满足。它也未能考虑到其他运营系统的各种需求，这些系统遵循相同的边界突破性数据获取策略。这根本站不住脚。\n\
  \n源系统无法为所有业务用例对其数据进行建模，是同一数据集最终会存在多份副本的主要原因。一个系统可能需要在关系模型中支持 ACID 事务，而另一个系统必须支持用于地理位置和纯文本搜索的文档存储。第三个消费者可能需要将这些数据集写入\
  \ HDFS，以应用 MapReduce 风格的处理来得出其制作的 364 份该数据副本的结果，并与其他年度数据集交叉引用。所有这些都无法由单个中央数据库提供服务，如果不是因为建模问题，则是因为无法为所有用例提供满意的性能。\n\
  \n### 创建、存储和更新同一数据的多个副本在计算上成本过高\n\n这一论点过分关注移动和存储数据需要花费金钱，因此存储同一数据的副本是浪费的（当然，不考虑重建模型和性能等因素）。这一论点未能考虑到云计算的低成本，特别是当今主要云服务提供商异常廉价的存储和网络成本。它也未能考虑构建和支持自定义\
  \ ETL 管道所需的开发人员工时，这是创建、查找和使用数据中数万亿美元低效问题的一部分。\n\n对于大多数业务应用程序来说，优化以最大限度减少数据传输、应用程序大小和磁盘使用量已不再像过去那样重要。相反，优先事项应放在最大限度减少访问数据构建块所需的开发人员精力上，并着重于运营灵活性。\n\
  \n### 管理跨系统和分布式数据集的信息安全策略太难\n\n通过数据产品正式化数据访问，允许您应用用户和服务访问控制。加密让您能够保护所有敏感数据不被未经授权的消费者访问，因此只有获得许可的人才能读取敏感数据。\n\
  \n自助服务平台在数据网格架构中发挥着重要作用，因为它强制执行所有安全策略、访问控制和加密要求。信息安全合规性已集成到数据产品生产者和消费者的正常工作流程中，使执行和审计合规性变得容易得多。\n\
  \n### 最终一致性太难以管理\n\n通过事件流传输的数据确实需要考虑并规划最终一致性。然而，认为最终一致性太难以管理的抱怨通常基于对其对整体业务流程影响程度的误解。我们可以正确定义系统边界，以考虑系统之间的最终一致性，同时在系统内部实现强一致性。无法回避——如果某个业务流程需要完美一致性，那么数据的创建和使用必须在同一服务边界内。但大多数业务流程不需要这样，对于那些需要的业务流程，本书所提议的任何内容都不会阻止您获得它。我们将在第十章中更详细地讨论如何处理最终一致性。\n\
  \n## 摘要\n\n面对真实的业务需求，现有的数据通信策略会力不从心。通过越过服务边界直接获取其数据的做法并不可持续，但它极其普遍，并且通常支持多个关键系统和分析工作流。将系统重构为整齐的模块化微服务并不能解决数据访问问题；您业务的其他部分，例如大数据分析和机器学习团队，仍然需要跨组织领域对当前和历史数据进行全面访问。无论以何种方式，数据副本\
  \ *都* 会被创建，我们要么对抗这一现状，要么接受这一事实并致力于使其变得更好。选择后者，我们可以使用事件流来标准化并简化组织内的数据通信，作为自动更新的单一事实来源。\n\
  \n事件构成了事件驱动架构中通信的基础，并从根本上塑造了我们解决问题的空间。通过事件流传递的事件构成了构建异步和响应式系统的基础模块。这些基础模块是与同步 API\
  \ 类似的原语：其他应用程序可以发现它们、与它们耦合，并使用它们来构建自己的服务。最终一致性、消费者特定模型、只读副本和流物化视图只是本书将探讨的部分概念，还包括现代云计算、存储和网络资源在这种新数据架构中的作用。\n\
  \n后续章节将深入探讨构建和使用事件驱动数据网格。我们将探讨如何设计事件，包括状态事件、动作事件和通知事件，以及生产和消费它们的模式。本书涵盖了大规模事件处理，包括多集群和多区域、隐私和法规合规性的最佳实践，以及处理最终一致性和异步通信的原则。我们将探讨适应事件驱动数据网格所需的社会和文化变革，并查看一些突出其他人成功经验和所学教训的现实案例研究。\n\
  \n最后，我们还将探讨您可以在自己的组织中采取的实际步骤，以开始向此目标构建。这种架构的最佳之处在于它是模块化和渐进式的，您可以一次在业务的一个领域开始利用其优势。虽然有一些初始投资，但现代云计算和\
  \ SaaS 解决方案几乎消除了进入壁垒，使您更容易开始并测试这是否是适合您的解决方案。\n"
- "## 数据网格\n\n我常听到的一个有说服力的电梯演讲将数据网格称为“数据的微服务”——相同的原则，但你是将它们应用于数据而不是服务。使用微服务的组织将有一个目录来查找可用服务，包括其\
  \ API、SLA、领域所有者、安全信息和访问控制，以及任何其他特定于组织的信息。微服务目录为您提供了可用于拼凑新业务应用程序的功能视图。\n\n在微服务和数据网格两个领域中，常见的基础设施服务（例如\
  \ Git、Kubernetes、容器、持续集成、监控）提供自助工具，让您专注于构建有用的业务服务，而不是迷失在基础设施和平台中。数据网格与微服务架构形成直接类比——但使用的是数据集，而不是服务。\n\
  \n构建良好的数据网格的优势包括：\n\n- 发现可信赖且可靠的数据，使投入使用更加便宜和快速。\n- 使发布新数据源变得更加容易，以便他人可以快速而轻松地使用它们。\n\
  - 将数据视为一流产品，就像其他任何关键任务产品一样，包括专用资源、明确定义的职责、SLA 和产品发布周期。\n- 减少并最终消除不可靠、脆弱且昂贵的数据管道和\
  \ ETL。\n\n\n\n\n\n- 通过将事件流作为单一事实来源，消除分析系统与运营系统之间的数据不一致性。\n\n数据网格依赖于四个相互关联的原则。我们将简要探讨每个原则，以及事件驱动数据在这些原则中所起的作用。后续章节将深入讨论这些原则、它们之间的关系，以及构建由事件流驱动的数据网格的具体内容。\n\
  \n## 原则 1：领域所有权\n\n领域所有权的核心在于对自己的领域强制执行主权，无需征求他人批准或许可即可对其进行更改或修改。这一原则通过明确回答“领域所有权人”来确定性地回答“谁负责这个数据集？”这一问题。但完全的所有权伴随着一组重要的职责：以适合域外使用者使用的模式导出内部领域数据的一个子集。\n\
  \n在数据网格中，该数据的所有者负责使其随时可用——不再由数据的潜在使用者去想方设法访问它。首先，拥有源数据的团队最有资格确定模型的哪些部分应该（和不应该）向下游消费者暴露。其次，在源端建立数据所有权使责任边界形式化，简化了长期困扰传统集中式数据团队的所有权问题。\n\
  \n但是，责任不仅限于为导出建模数据，还包括处理待处理数据问题、确保访问方式保持可靠、确保数据模型的演变与历史预期保持兼容（第 137 页“架构演变（随时间变更架构）”有更多介绍），以及确保满足约定的\
  \ SLA。这不仅仅是改变谁为导出建模数据，而是最终责任的彻底转移。将数据建模和可用性的所有权转移给生产者，是远离当今数据仓库和数据湖策略中常见的集中化的根本性转变。与其让数据工程师和数据科学家试图弄清楚如何从服务边界内部获取数据（例如，将数据抓取到\
  \ ETL 作业中），源数据的所有者必须努力通过受支持良好且可靠的媒介提供必要的数据。\n\n## 领域驱动设计简介\n\n领域驱动设计（DDD）由 Eric\
  \ Evans 在《领域驱动设计》(Addison-Wesley) 中创建并阐述，是一种应用于数据和领域建模的软件设计方法。它专注于对软件模型的结构和语言进行建模，以匹配业务领域。与数据网格类似，它也为我们提供了一种讨论软件和数据模型的通用语言。我们将借用\
  \ DDD 的通用语言来开始讨论如何在系统之间共享数据。区分“这里的数据”与“那里的数据”对于驾驭数据网格成功所需的社会变革和责任下放至关重要。\n\n首先，我们有领域，即领域驱动设计中的领域。领域是个人或团队拥有控制权的兴趣或关注领域，包括构成它的所有实体、聚合、业务逻辑和上下文。简而言之，领域由我们在特定领域关注的事物组成，以便尝试为某个问题构建解决方案。\n\
  \n接下来是有界上下文。有界上下文被定义为领域内域模型适用的边界。在实践中，有界上下文还包含所谓的通用语言，它描述了边界内的每个组件，包括如何识别它、它与其他组件的关系，以及它的建模方式。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_40_0.png)\n\n通用语言仅在有界上下文中是通用的——在另一个有界上下文中，相同的术语可能（并且经常）表示不同的含义。含义上的细微差别可能导致混淆和数据解释及使用的不一致。\n\
  \n实体是在领域内定义的具有唯一标识的事物或项目。这些最好被视为具有独特属性的对象，这些属性会随着时间的推移而经常变化和演变。例如，电子商务平台的实体包括待售商品、优惠券、交易、运输以及与仓库相关的事务，例如创建包裹和管理库存水平。\n\
  \n最后，聚合是一组可以作为单个单元处理的实体。进一步以我们的电子商务示例为例，将优惠券、商品、交易、运输和支付信息聚合起来，构成订单的基础。但是，要组合此订单聚合，需要应用特定于领域的业务逻辑将每个实体集成到聚合中——应用的顺序和方式完全是领域聚合所有者的关注点。\n\
  \n图 2-1 展示了一个简化的汽车制造领域，其中包含一个带有实体、聚合和业务逻辑的单一有界上下文。每个实体、聚合和流程在边界内都具有完全一致的含义，任何向外部世界暴露内部数据的行为都通过防腐层进行。\n\
  \n有了这些定义，我们就可以开始精确讨论我们要做什么：从领域的有界上下文中发布重要实体和聚合，以供其他领域使用。所有向域外提供的数据都将通过防腐层进行，因为我们想要控制哪些数据暴露、哪些数据不暴露，以确保外部各方不会直接耦合到内部模型。这使领域所有者能够在不不必要地影响外部数据消费者的情况下，演变和更改内部实现。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_41_0.png)\n\n_图 2-1. 汽车制造领域示例，包括防腐层_\n\
  \n但是，我们如何知道从领域中选择和共享哪些数据？\n\n## 从您的领域中选择要暴露的数据\n\n决定从领域中暴露哪些数据可能有点棘手。最好的起点之一是识别对领域至关重要的实体，因为它们通常是值得评估的首选候选项。鉴于前一节中的电子商务示例，我们可以暴露与待售商品和已创建订单相关的数据。由于该领域也映射到物理世界，暴露当前库存也是合理的，以确保库存正确地向最终用户显示。\n\
  \n我们还可能会将选定的支付信息作为单独的数据集暴露出来，因为这将为财务团队提供重要信息。我们可以通过唯一 ID 映射将支付与订单关联起来，允许下游消费者根据需要将它们合并，或者简单地只使用与其用例相关的数据。\n\
  \n但是，确定哪些领域数据对其他人有必要的最佳方法，就是直接询问他们。采取以客户为中心的方法，关注依赖于您领域的业务流程的需求。这就带我们来到了下一个数据网格原则。\n\
  \n## 原则 2：将数据视为产品\n\n这一原则将数据提升到一等公民的地位，与组织创建的任何其他产品同等对待。这是对数据创建、存储和向其他领域传达方式的完全重新构想。通过应用现有生产产品的同样产品严谨性，我们可以形式化跨领域构建和传达数据的方式。\n\
  \n领域所有者负责识别、提取和建模其数据，以便作为数据产品呈现给外部访问。毕竟，除了领域模型专家，还有谁更适合构建用于导出的数据？而且与任何其他产品一样，会识别并咨询潜在消费者，以确保数据产品是为满足其需求而构建的。但是，数据产品不仅仅是数据本身——它还包括构建数据的代码、存储数据的基础设施，以及用于访问数据的端口（或模式），如图\
  \ 2-2 所示。\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_42_0.png)\n\n图 2-2. 构成数据产品的代码、数据、基础设施和端口\n\
  \n这四个组件是所有数据产品共有的。每个数据产品创建者都需要牢记这些组件来识别和构建其数据产品。\n\n我们将简化数据产品的创建和管理，就像对待微服务一样，以减少每个数据产品所有者的开销和琐碎工作。我们希望构建和支持数据产品很容易，而不会陷入运营开销中。我们将在本章后面介绍自助服务，但在讨论将数据作为产品提供时，请牢记这一点。\n\
  \n\n\n\n构建数据产品时需要考虑四个主要因素。数据产品必须提供不可变且带时间戳的数据，以便消费者获得可一致复现的结果。数据产品是多模态的，尽管某些模式比其他模式更适合特定用例。取决于模式，您可能最终需要通过查询拉取数据，或者数据可能会通过订阅推送给您，这会影响您能支持的用例类型。最后，数据产品是与源域、聚合或消费者域对齐构建的，这进一步影响了用例的可能性。让我们逐一看看这些因素。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_43_0.png)\n\n创建数据产品是域所有者的一项正式承诺，承诺投入时间、资源和专业知识，使其域数据的部分对外部客户可用。这包括提供稳定的\
  \ API、SLA（例如，我们是否需要半夜起来修复它？），以及优先处理和处理客户功能请求。\n\n## 数据产品提供不可变且带时间戳的数据\n\n数据产品提供的数据必须是不可变且带时间戳的。消费者在查询数据时必须获得一致的结果，无论查询何时执行。例如，今天对给定日期范围执行的查询和一个月后对同一日期范围执行的查询必须产生相同的结果。同样，读取同一数据产品的两个独立消费者必须能够获得完全相同的数据。对该数据的任何修改都需要作为数据集的新增量更改发布。\n\
  \n在考虑迟到数据时，这些要求会变得更棘手一些。数据产品所有者如何将明显迟到但仍可能对数据产品至关重要的数据合并进来？在与消费者协商后，一个选择是：在宽限期（例如一小时）过后再发布新数据，之后所有其他迟到数据均会被丢弃。第二个选择是直接丢弃数据并忽略它。虽然这样能保持一致性，但对于那些更关注准确性而非及时性的某些数据产品消费者来说，这可能会带来问题。\n\
  \n第三个选项，由事件流启用，是让迟到数据一旦到达就立即发布。迟到数据作为事件发布，带有其发生的准确但迟到的时间戳。流消费者会看到事件时间戳稳步增加，直到遇到迟到事件，此时他们可以选择自己的处理方式。\n\
  \n不可变且带时间戳的数据使得多个消费者能够长期一致且反复使用数据产品。至于迟到数据，我们将在第 10 章中更详细地探讨这一点。\n\n## 数据产品是多模态的\n\
  \n创建数据产品并没有确定的“正确方式”，也没有单一预期的形式、格式或模式。数据产品本质上是多模态的，您用于共享数据的确切模式可以协商确定。我们将在第 4 章中更详细地探讨模式选择这一主题。\n\
  \n与此同时，同一数据产品可以以多种不同的格式和 API 提供。例如，单个数据产品可能：\n\n- 生成到事件流中，并在发生更改时更新\n- 组合成一组 Parquet\
  \ 文件，每日更新到云存储桶中\n- 保持存储在 REST API 后面，按需提供给客户端\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_44_0.png)\n\
  \n图 2-3. 多模态数据产品，通过三个不同的端口提供数据：REST API、事件流和云存储桶\n\n批量计算的数据产品在数据网格中确实有其位置。毕竟，数据仓库和数据湖架构在很大程度上依赖于定期计算的数据批次来驱动其定期执行的作业。绝大多数分析工作负载都是在批量计算的数据源基础上大规模构建的。然而，大多数操作系统无法依赖批量计算作业那缓慢的频率。没有人想等待\
  \ 30 分钟让一批数据处理完成，才知道自己的航班是否真正预订成功。事件流为快速变化的运动数据提供了基础，并能实现更快速、更响应灵敏的应用程序，无论是分析应用还是操作应用。它们还提供了将数据聚合为大批量文件的灵活性，以支持经典的数据分析场景。我们将在第\
  \ 9 章中更详细地探讨这些用例。虽然批量数据产品对于基于批量的分析工作负载仍将有用，但事件流构成了驱动事件驱动的操作和分析工作负载，并支持域间快速高效数据通信的总体介质。\n\
  \n## 通过推送或拉取访问数据产品\n\n用户访问数据产品主要有两种方式：通过拉取机制或推送机制。拉取机制对大多数人来说更熟悉——这是 REST API、SQL、图形查询语言或存储在云存储中的文件提供的类型。数据存储在某种查询处理接口背后，最终，消费者客户端会发出查询将数据拉入其域中。\n\
  \n拉取查询会返回与查询子句匹配的所有数据，数据量可能非常大。消费者必须等到查询完成且数据返回后，才能开始处理数据。完成后，生成的数据批次需要写入其自己的输出位置，这取决于最终记录数，也可能需要一些时间。基于拉取的数据\
  \ API 会导致大量数据的周期性并行查询和处理：吞吐量高，但延迟也高。拉取查询的主要问题是，唯一了解更新数据是否可用的方式是发出查询——如果您需要每秒轮询一次，这可能代价相当高昂。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_45_0.png)\n\n相比之下，事件流提供的推送机制会在有新数据可用时通知下游服务。服务只需订阅事件流，即可注册为监听器，并在有新事件可供消费后不久收到通知。消费者按自己的速率处理事件，理想情况下能跟上流入速率，避免落后。\n\
  \n事件流管理消费者订阅的开销通常非常小，尤其是与拉取 API 相比。事件发生到注册消费者收到有事件可处理的通知之间延迟很低。而且，如果您希望同时支持操作和分析用例，您将需要具有实时性能的数据产品。基于拉取的查询\
  \ API 根本不适合提供对数据产品最新更改的实时访问。\n\n推送和拉取机制之所以重要，是因为同类相吸。您通过拉取 API 提供的数据产品越多，您就越多拥有基于拉取\
  \ API 的数据产品。您通过推送式事件流提供的数据越多，您就越多拥有使用推送式事件流的数据产品。您关于他人如何访问数据产品所做的选择会波及整个组织，影响的不只是您的直接消费者。\n\
  \n在下一节中，我们将了解您可以构建的最常见的数据产品类型。\n\n## 三种数据产品对齐类型\n\n数据产品可以与源域、聚合或消费者域对齐。现在让我们逐一看看它们。\n\
  \n### 源对齐数据产品\n\n源对齐数据产品与源域的操作系统对齐，是驱动事件驱动的操作系统和分析系统的理想候选者。例如，源对齐数据产品可能会发出包含项目、价格、运输和付款信息详细信息的销售事实，如示例\
  \ 2-1 所示。\n\n### 示例 2-1. 源对齐销售事件的数据内容\n\n```\nValue: {\n\tsales_id: 8675309,\n\t\
  item_ids: [4625382, 4625382, 4625382, 100900],\n\ttotal_usd: 89.12,\n\tdatetime:\
  \ \"2022-11-12T03:51:19Z\",\n\tshipping_address: \"123 Fake Street, Springfield\"\
  \n}\n```\n\n### 聚合对齐数据产品\n\n聚合对齐数据产品针对特定业务标准提供多个数据点的聚合，例如，每家商店每小时的销售聚合，包含一组销售 ID\
  \ 和美元金额，包括销售总数量和总美元金额。数据产品所有者负责构建聚合，但需要与预期的消费者协商，以确保他们\n\n对聚合有共同的理解。以下显示聚合对齐的每日销售事件的数据内容：\n\
  \n```\nValue: {\n    date: \"2022-11-12\",\n    total_items_sold: 41292,\n    total_items_value_usd:\
  \ 1902712.22\n}\n```\n\n### 消费者对齐的数据产品\n\n消费者对齐的数据产品高度定制，旨在为单个领域的特定用例服务。例如，消费者可以混合销售聚合、库存聚合和客户画像聚合，丰富数据，然后通过一组复杂的业务逻辑对其进行处理，以便在其领域内进一步使用。以下显示用于预测给定消费者用于广告定位价值的消费者对齐事件的数据内容：\n\
  \n```\nValue: {\n    user_id: \"UUID-123456789\",\n    predicted_item_ids_to_advertise:\
  \ [4625382, 100901],\n    cost_tolerance: \"high\",\n    conversion_probability:\
  \ 0.1233,\n    estimated_spend_usd: 500.00,\n    ad_bid_limit_usd: 9.75\n}\n```\n\
  \n这三种数据产品对齐方式在所有者和消费者的职责之间做出权衡。在一端，源对齐的数据产品相当通用。构建它们相对容易，消费者可以将它们用于各种目的。然而，消费者必须应用自己的业务逻辑和转换，并执行任何重塑以生成更符合其需求的内容。\n\
  \n聚合对齐的数据产品是领域所有者将业务逻辑应用于内部领域数据的结果。虽然简单版本可能包括对源对齐领域的聚合，但聚合对齐的数据产品通常还会混合来自其他数据产品的数据。这通常出于可用性考虑：例如，我们用商店位置、销售代表信息和产品类别丰富销售聚合，因为这些是下游消费者最常见的数据用例。\n\
  \n通过采用常见的消费者用例并将其应用于源产品，我们避免了消费者错误计算其自身聚合的风险，同时也减少了数据产品用户的整体负担。然而，这确实要求数据产品所有者拥有足够的资源来支持数据产品改进请求，这并不总是可能的。这让我们回到了第三种类型，即消费者对齐的数据产品。\n\
  \n消费者对齐的数据产品承认，数据产品所有者不可能为每个消费者提供其所需的所有数据。事实上，创建消费者对齐数据产品最常见的原因之一是将来自多个不同领域的数据产品混合在一起，而单个数据产品所有者无法自行提供。消费者对齐的数据产品高度专注于满足消费者的特定领域需求，无论是用于单个应用程序还是其领域内的多个应用程序。\n\
  \n考虑一个需要销售数据、支付数据、库存数据和仓库数据的电子商务运输领域。由于这些数据跨越多个领域，并且需要特殊的业务逻辑来关联和重塑，因此消费者创建了一个专注于满足这些需求的消费者对齐数据产品。图2-4显示这四个领域向运输领域的消费者对齐数据产品提供源对齐数据产品（1）。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_48_0.png)\n\n图2-4. 使用来自四个不同领域的数据产品创建的消费者对齐数据产品\n\
  \n如果由事件流驱动，消费者对齐的数据产品为运输领域可以发送给客户的产品提供实时更新的数据产品，同时为运输服务和运输分析服务提供支持。可以从运输分析结果中创建第二个数据产品（图2-4中的2），进行聚合以突出显示关键绩效指标来监控整个运输领域的健康状况。\n\
  \n但数据产品不仅仅用于分析。事件流为驱动运营和分析用例提供了最佳解决方案。\n\n## 事件驱动的数据产品作为运营系统的输入\n\n数据产品可用于服务分析和运营用例，但适用性在很大程度上取决于数据产品的模式和运营消费者的延迟容忍度。越接近实时数据，运营用例和分析用例之间的界限就越模糊。幸运的是，工作负载的定义方式其实并不那么重要——重要的是，消费者的性能目标能够通过数据产品的服务级别限制来满足。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_49_0.png)\n\n> 数据网格最初是为跨领域服务分析数据产品而构想的。但由事件流实时组合和提供的数据产品可以同时满足运营和分析需求。将运营系统的驱动视为数据网格的“非标签”应用，类似于某些药品被用于非其最初创建目的的其他用途。\n\
  \n事件流为这种双重用例提供了最佳解决方案，我们将在第3章中进一步探讨它们。支付微服务可以在毫秒级从事件流中获取销售事件，而从每小时将批次写入云存储的数据产品获取数据则太慢了。数据越接近实时，就越适合运营用例。\n\
  \n将事件流数据产品作为驱动运营系统的手段来推广，是为数据网格建立内部组织支持的一个有力卖点。非分析团队可能会怀疑为制定数据产品承担新职责的必要性，因为他们自己从交易中得不到任何好处。然而，通过实时事件流推广数据产品访问可以作为一种强大的激励，因为事件流还解锁了运营事件驱动服务，而不仅仅是分析，这一切只需一个数据产品的代价。\n\
  \n接下来，让我们看看治理在数据网格中发挥的作用。\n\n## 原则3：联邦治理\n\n创建数据产品要求领域所有者在向消费者建模、构建和交付数据方面拥有一定的自主权。然而，通过赋予他们自主权和独立性，您存在着跨数据产品实现出现重大技术蔓延的风险，这使得消费者更难将数据产品用于自己的目的。联邦治理专注于在消费者需求、数据产品所有者的自主权、业务合规和安全要求以及全球数据产品要求之间找到平衡。\n\
  \n数据产品创建者受益于可以随意组合数据产品的自由，而数据产品消费者则受益于与其他现有数据产品匹配的简单易用的数据访问界面。合规和安全要求可能禁止自主权和易用性，同时保护企业免受严重的财务和法律后果。联邦治理是一项平衡工作。找到中间点并非易事，需要您组织中大量人员的参与和意见。\n\
  \n联邦治理大致可分为两项主要任务。第一项是建立适用于数据网格所有用户的跨组织政策，包括数据产品标准和数据处理要求。第二项是提供使用自助服务工具创建和使用数据产品的指导，以便轻松参与数据网格。\n\
  \n治理团队是一个专门构建的团队，由代表各个领域、技术要求和业务用例的个人组成。他们的工作不是向他人指示可以和不可以做什么，而是讨论多领域问题空间固有的问题，探索解决方案，并尝试找到共同点以减少潜在蔓延的范围。\n\
  \n例如，联邦治理机构可能决定组织在实现数据产品时应使用PostgreSQL数据库而非MySQL数据库——并非因为其中一个必然优于另一个，而是因为该组织拥有支持其中一个而非另一个的技术专长、熟悉度、监控和值班手册。同样，组织可能会选择使用一种编程语言而非另一种，或一种云服务提供商而非另一种。治理团队通过选择、支持和推广仅几种经过验证的用于创建数据产品的技术，力求减少技术蔓延。\n\
  \n\n\n\n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_51_0.png)\n\n构建涵盖广泛技术、语言、规范和 API\
  \ 的数据网格会使其难以使用和支持。构建良好的数据网格与构建良好的微服务平台非常相似。支持的技术选择越少，构建支持工具以及应用访问控制、安全措施和数据管理政策就越容易。在决定为哪些技术提供一流支持、为哪些技术不提供支持之间找到平衡点，是联邦治理中最具争议的问题之一。这需要健康且基于事实的辩论才能成功。\n\
  \n让我们深入探讨联邦治理的几个具体关注领域。第 4 章将更详细地介绍这些领域。\n\n## 指定数据产品语言、框架和 API 支持\n\n您将支持哪些数据产品技术和格式？前面的\
  \ MySQL/PostgreSQL 示例涉及此问题，但远不止于数据库。公司通常面临的最常见技术选择是支持哪些编程语言。软件开发人员在实现应用程序时，想要尝试新的语言、框架和技术，这很自然。但这伴随着额外长期支持的增量成本，例如监控集成、测试框架和领域专业知识。数据产品类型、数据格式和使用的模式技术只是联邦治理管辖的标准中仅有的几个示例。\n\
  \n## 建立数据产品生命周期要求\n\n数据产品与其他任何产品一样都有生命周期。联邦治理负责准确概述数据产品所有者如何将其发布到数据网格。指定要收集的数据产品元数据、确定质量和\
  \ SLA 分类以及建立发布流程，只是必要生命周期要求的几个示例。数据产品与软件应用程序一样，会被创建、更新，最终被弃用和删除。简化此流程并确保数据网格中的每个参与者保持一致并拥有相同的预期非常重要。\n\
  \n## 建立数据处理和信息安全政策\n\n数据处理政策各不相同，并深受地区法律影响，例如《一般数据保护条例》(GDPR) 和《加州消费者隐私法》(CCPA)。个人有权要求从相关数据中清除或删除所有个人身份信息\
  \ (PII)，即“被遗忘权”，这是构建和提供数据产品的重要原则。您的组织具体如何实现这一点由您决定，但应包括加密碎片化和默认匿名化等选项。我们将在第 4 章中更详细地介绍这些主题。\n\
  \n## 识别和标准化跨领域同形异义词\n\n领域通常对常见业务实体有不同但相似的定义。跨领域识别和标准化这些内容是确保数据产品互操作性的重要步骤。一个常见的示例是用户实体：一个领域可能使用自增\
  \ Long 类型作为唯一标识符，而另一个领域可能使用字符串 UUID。标准化同形异义词以使用通用标识符是联邦治理团队的职责，这使得使用数据产品更加简单，且不易出现用户错误。\n\
  \n## 形式化自助服务平台要求\n\n支撑数据网格日常功能的自助服务工具由联邦要求指导。依赖通用工具可降低创建、发布、发现和使用数据产品的门槛。联邦治理最适合收集监控、日志、访问控制、计算服务和存储服务等广泛横跨关注点的需求。这些需求被编码化并提供给自助服务平台团队，以构建支持数据网格所需的工具。\n\
  \n在总结本章之前，让我们简要了解一下第四个也是最后一个数据网格原则。\n\n## 原则 4：自助服务平台\n\n自助服务是支撑数据网格的最后一项原则。它具体包含的内容因组织而异，因此与其告诉你它应该包含什么，不如说明参与者的服务需求，我认为这样更有帮助。他们的需求将帮助您做出如何构建自助服务平台的决策。三个主要用户角色包括：\n\
  \n- *潜在消费者*\n  消费者必须能够找到所需的数据产品，作为消费者订阅，并将数据提取/获取到自己的领域。他们随后可以基于数据创建自己的数据产品。\n\n\
  - *数据产品创建者*\n  这些人希望使用自助服务平台来获得创建数据产品的支持。这包括自助计算、存储和处理，以及一种将其与其代码库集成、测试和部署的简化方式。\n\
  \n### 数据产品所有者\n\n所有者必须能够长期管理其数据产品。这包括向现有消费者发布即将发生的变更通知、处理功能请求、就破坏性变更发布指南、管理警报和值班轮班以及管理数据产品生命周期（例如弃用和删除）。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_53_0.png)\n\n您对数据产品形态的联邦治理要求越严格，构建自助服务平台就越容易。一个仅支持一种或两种数据产品格式且带有非常主观的处理框架的自助服务平台，比支持众多选项的平台要容易得多。这是微服务世界中吸取的艰辛教训，我们最好也将其应用于数据网格。\n\
  \n至少，自助服务的具体构成将取决于您的优先事项、现有工具和框架以及文化。没有一劳永逸的解决方案，但我们可以仔细研究一些事项，帮助您了解这对您来说可能是什么样子。\n\
  \n### 发现数据产品和依赖项\n\n参与数据网格的每个人都需要能够轻松浏览、搜索和查找可用的数据产品。这包括但不限于数据产品位置、API、元数据、所有权、文档、数据示例以及已在使用它的现有应用程序链接。数据目录是集中查找可用数据产品的常用工具，每个数据产品所有者负责更新和维护其记录（有关此主题的更多内容请参阅第\
  \ 5 章）。\n\n潜在消费者可以就数据产品是否适合解决其业务需求做出明智的决定。虽然简单的字母顺序列表在小型数据网格中可能足以用于发现，但随着数据产品数量增加，它很快就会变得不可行。搜索和过滤功能成为关键，尤其是通过更复杂的架构和文档查询来识别相关数据产品时。\n\
  \n您可以通过将电子邮件或即时通讯集成到平台中，使数据产品所有者轻松联系。只需点击一下按钮，您的潜在消费者就可以被转发到相关的即时通讯频道，并与数据产品所有者或值班支持专家直接联系。非常受欢迎的数据产品甚至可以将收集的常见问题解答作为其数据目录元数据的一部分，这些内容来自这些对话。\n\
  \n最后，数据产品生产者和消费者的血缘追踪仍然是依赖关系跟踪的重要元素。构建良好的自助服务平台不仅会提供整个数据网格的当前血缘，还会提供历史血缘快照。数据产品所有者可以使用血缘追踪来识别其数据产品的所有消费者，与他们沟通以识别任何未满足或共同的需求，或告知他们数据产品即将发生的变更。数据产品消费者也可以使用血缘来识别其数据来源，以进一步验证其数据产品选择，或因潜在的信息安全或法律问题而排除任何上游数据产品。\n\
  \n## 数据产品管理控制\n\n自助服务平台需要标准化数据产品生命周期的管理，正如我们在第 38 页“建立数据产品生命周期要求”中概述的那样。创建数据产品不仅需要获取计算和存储资源，还需要申请核心仓库、部署流水线、监控集成以及元数据的收集和显示。弃用和删除数据产品需要通知消费者、传达预期和迁移策略，并遵循数据删除和移除的既定政策。创建管理数据产品的控制需要与这些服务中的每一个集成，并确保发布到数据网格的数据产品之间的兼容性。\n\
  \n总而言之，在多语言数据产品实现中，做好数据产品管理控制既困难又昂贵。这也扩展到数据政策应用领域，例如法律要求的合规性。如果您需要确保数据产品不含 PII，那么扫描一组使用单一数据存储模式创建的数据产品，比扫描关系型、NoSQL、图、时序和事件流等多种数据存储要容易得多。您支持的类型和语言越多，自助服务工具就需要越广泛，以确保在数据产品中正确应用数据管理政策。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_54_0.png)\n\n自助服务平台为数据产品所有者提供的选项越多，自助服务平台团队需要做的工作就越多，以确保这些选项符合治理政策、数据安全政策和法规政策。对于某些组织来说，这可能只是意味着他们将把问题留给数据产品所有者自行解决，因为政策失败的影响较低，而且他们根本不太在意。但许多组织没有这种奢侈，政策违规可能是一种极其昂贵且具有破坏性的场景，必须避免。支持多种多样的数据产品会增加政策违规的风险，而仅支持少数产品则会降低风险。\n\
  \n\n\n\n\n## 数据产品访问控制\n\n对数据产品的自助式访问控制是另一个关注领域。注册数据产品访问权限对消费者来说应该简单易行。为每个消费者设置一组独立的凭据，可以实现消费者级别的权限和访问控制、依赖项识别，并且在结合生产者权限时，能够创建谁可以访问哪些数据的完整依赖图。需要注意的是，这些数据直接来自真实的运营访问控制，而不是作为几乎总是不完整的自愿加入方案的一部分。\n\
  \n由于敏感信息而设置的访问限制应经过更严格的审批流程，以符合联合治理要求。这使得对敏感信息访问的审计追踪留有痕迹，并允许信息安全团队审计消费者遵守数据处理策略的情况。\n\
  \n## 构建和使用数据产品的计算和存储资源\n\n构建数据产品可能需要源域已有资源之外的额外计算和数据存储资源。例如，操作系统可能在其数据库中创建和记录销售，但很大程度上无法提供按销售人员、部门和促销优惠划分的每日销售汇总数据产品。与其让域所有者扩展和支持自己的工具来满足数据产品构建需求，不如通过共享自助平台为他们提供一组工具和选项。\n\
  \n现在，平台的这一部分高度依赖实现，并且根据你已经使用的工具和技术而有很大差异。由于我们正在构建事件驱动的数据网格，我们需要能够轻松申请一个事件流（或主题）来写入我们的事件。我是\
  \ Apache Kafka 的长期用户和贡献者，如果你以前没听说过它，可能需要花几分钟熟悉一下。我建议先从 Confluent 的“What is Kafka？”开始了解。\n\
  \n自助数据网格的用户可能需要访问一整套控制功能。用户可能需要通过访问控制指定主题所有权、记录保留时长（在大多数情况下为无限）以及谁可以和谁不能读取数据的权限限制。用户还必须能够将\
  \ Kafka 主题与数据产品元数据关联，以便数据产品易于发现，并具有完善的文档和架构。\n\n用户还需要能够申请数据处理资源，以便填充其数据产品。虽然可用于构建数据产品的计算资源有许多可能的选项，但我们可能希望将其缩小到仅几种技术。作为治理团队的唯一成员，我可能会决定选择以下技术来帮助我构建数据网格：\n\
  \n### 流处理\n\n原生事件流处理器，例如 Kafka Streams 或 Apache Flink。两者都提供了处理通过 Kafka 主题提供的数据产品的框架，包括流表连接和表表连接等丰富功能。\n\
  \n### 批处理\n\n可处理大量批量数据的大数据处理框架，如果还能处理某些流式用例（例如 Apache Spark、Apache Flink）则得分更高。这些框架可以更轻松地使用由定期更新的批量数据集或通过批量数据和事件流混合提供的数据产品。\n\
  \n### 流 ↔ 批处理数据处理\n\n用于将数据从流转换为批量数据或反之的工具。Kafka Connect 是此技术的典型示例，你可以使用各种连接器将批量数据放入\
  \ Kafka 主题以供流式使用，或从事件流获取数据并将其写入批量数据存储。\n\n无论你选择支持哪种处理框架选项，自助团队也将负责维护和支持它们。我们将在第\
  \ 5 章中更详细地介绍自助能力。\n\n但你的选择不局限于仅仅是内部支持的内容。云计算和 SaaS 可以为你提供创建数据网格所需的构建块。\n\n## 通过\
  \ SaaS 提供自助服务\n\nSaaS 解决方案正在改变最终用户与其计算、存储和处理资源的关系。对于数据网格，它们理想情况下开箱即用，提供易于使用的服务来访问数据、以某种方式转换数据，并将其写回数据存储位置。以下是一些示例：\n\
  \n### Confluent with Apache Kafka\n\n提供 Apache Kafka 和支持工具即服务，包括 Kafka Connect 和基于\
  \ SQL 的流处理。“Apache Kafka 是一种开源分布式事件流平台，被成千上万家公司用于高性能数据管道、流式分析、数据集成和关键任务应用程序。”\n\n\
  ### StarTree with Apache Pinot\n\n作为 Dehghani 数据网格范式的大力支持者，StarTree 提供 Apache Pinot\
  \ 和支持工具即服务。Pinot 被描述为“一种实时分布式 OLAP 数据存储，用于交付低延迟的可扩展实时分析。”\n\n### Databricks with\
  \ Apache Spark\n\n提供 Apache Spark 和支持工具即服务，以简化你对 Spark 的使用。“Apache Spark 是一种多语言引擎，用于在单节点机器或集群上执行数据工程、数据科学和机器学习。”\n\
  \n这些 SaaS 产品中每一个的重要部分在于，它们使获取数据的处理和存储资源变得容易，但仅限于其自身服务的范围内。它们为你提供现成的构建块，以便根据你团队的需求和能力组建自己的数据网格解决方案。当然，你完全可以自行启动和管理自己的服务，但现代计算已强烈转向支持基于云的服务。\n\
  \n除非你已经拥有可用于构建数据网格的强大计算、磁盘和流处理平台，否则最好依赖 SaaS 解决方案来启动你的实现。你将能够立即从数据产品中获取价值，并可以开始研究哪些方面工作良好以及需要更改什么。试用\
  \ SaaS 解决方案几个月并发现它不适合你的需求，远比先构建整个内部平台 _然后_ 发现它不满足你的需求要好得多。\n\n在刚开始时，保持费用和开销低。当你找到最适合你用例的技术后，随时可以再考虑优化成本。你很可能需要使用几种技术，尤其是如果你希望支持多种数据产品模式的话。但至少，你将需要一个强大可靠的事件代理，例如\
  \ Apache Kafka，来为你的事件驱动型数据产品提供服务。\n\n## 总结\n\n数据网格涵盖范围很广。一方面，它是对组织内部责任和社会规范的严格重新谈判。域及其团队成为创建和发布其自身一流数据产品的责任主体，大幅减少了无处不在的集中式数据团队的职责范围。另一方面，它通过自助功能简化了数据产品的定义、创建、建模和使用的技术支持。\n\
  \n很像议会一样，代表组织各成员、应用程序、产品和业务用例的联合治理团队聚集在一起讨论、辩论、争论和立法。每个成员确保其选民的代表性，目标是在完全域自治和专制的自上而下命令之间找到平衡。\n\
  \n发现共同点将产生所需语言、框架、工具和技术的图景。自助平台团队需要将精力集中在创建支持常见用例和工作流的受支持良好的工具箱上。与此同时，数据产品所有者可以开始使用平台工具构建和共享他们的数据产品。\n\
  \n图 2-5 显示了基本事件驱动数据网格的概览。域所有者可以原生写入其数据（1）或使用连接器（2）将其写入存储在事件代理中的事件流（3）。域所有者可以将其数据产品和相关元数据发布到发现端点（4），允许其他人自行发现和使用数据产品。\n\
  \n![](img/4a76b8ac0abd2ab4b0aad729485a0a2b_58_0.png)\n\n图 2-5. 事件驱动数据网格的鸟瞰图\n\n\
  运营服务（5）和分析服务（6）均可从事件驱动数据产品中原生获取数据，根据情况选择源对齐、聚合对齐和消费者对齐产品。不原生支持事件流的现有服务可以再次依赖自助连接器（7）来根据需要消费、重塑和插入数据。\n\
  \n最后，横跨整个组织的治理（8）和自助平台（9）支撑每个数据产品的常见用例。治理侧重于安全\n\n\n\npolicies, roles, ownership,\
  \ access controls, and lineage, while the self-service platform focuses on making\
  \ it easy to find, use, and manage data products within the requirements of the\
  \ organization.\n\n策略、角色、所有权、访问控制和血缘，而自助服务平台则专注于在组织要求范围内，让查找、使用和管理数据产品变得轻松。\n\n\
  Event streams play a pivotal role in data mesh because they provide a single unified\
  \ mechanism of providing data for both real-time and batch processes, be they operational,\
  \ analytical, or somewhere in between. Unlike periodically computed batch data sets,\
  \ event streams can be used not only by analytical users, but by operational applications\
  \ too. This choice greatly reduces the quantity of similar-yet-different data sets\
  \ that can regularly cause problems and provides you with a common baseline for\
  \ building all of your data-powered applications.\n\n事件流在数据网格中发挥着关键作用，因为它们为实时和批处理流程（无论是操作性的、分析性的，还是介于两者之间）提供了一种单一的统一机制来提供数据。与定期计算的批量数据集不同，事件流不仅可以被分析用户使用，也可以被操作性应用程序使用。这一选择大大减少了经常引起问题的相似但又不完全相同的数据集的数量，并为您构建所有数据驱动型应用程序提供了一个共同的基准。\n\
  \nIn the next chapter, we’ll take a closer look at how to use event streams to build\
  \ data products, including some fundamental event-stream properties, the relationship\
  \ between the stream and the consumer, historical data, and composing state.\n\n\
  在下一章中，我们将更深入地探讨如何使用事件流来构建数据产品，包括一些事件流的基本属性、流与消费者之间的关系、历史数据以及状态组合。\n"
- "## Event Streams for Data Mesh\n\n## 面向数据网格的事件流\n\nAn event is published to an\
  \ event stream for use by any interested subscribers. But what are the properties\
  \ of an event stream and are they any different than a queue? Or a messaging system?\
  \ What makes up an event, and how do we ensure we correctly compose reusable event\
  \ streams? In this chapter, we’ll take a good look at events and event streams,\
  \ including requirements, differentiation from other similar architectures, and\
  \ some of the modes of use that they unlock for our consumer services.\n\n事件被发布到事件流中，供任何感兴趣的订阅者使用。但是事件流的属性是什么，它们与队列有什么不同吗？或者与消息系统有什么不同吗？事件由什么组成，我们如何确保正确地组合可重用的事件流？在本章中，我们将深入探讨事件和事件流，包括要求、与其他类似架构的区别，以及它们为我们的消费者服务解锁的一些使用模式。\n\
  \nFirst, let's start with the event. An *event* is a well-defined record of an occurrence\
  \ containing all of the information about what happened. Events are commonly based\
  \ on business entities or on relationships between entities. For a simple automotive\
  \ example, we could expect to see entity events detailing information about *items*,\
  \ *orders*, and *coupons*. In terms of relationships between entities, you may expect\
  \ to see events such as *item_added_to_cart* and *coupon_applied_to_order*.\n\n\
  首先，让我们从事件开始。一个*事件*是对发生情况的定义明确的记录，包含关于发生了什么的所有信息。事件通常基于业务实体或实体之间的关系。以简单的汽车示例，我们可能会期望看到关于*项目*、订单和*优惠券*的实体事件详细信息。在实体关系方面，你可能会期望看到诸如*商品添加到购物车*和*优惠券应用于订单*这样的事件。\n\
  \nWe’ll get more into precisely what events are, how they’re structured, and the\
  \ supporting technologies we’ll need to use in a moment. First, it’s important to\
  \ understand a few key concepts about the role that event streams play in an event-driven\
  \ data mesh.\n\n我们稍后将深入探讨事件究竟是什么、它们如何结构化，以及我们需要使用的支持技术。首先，了解事件流在事件驱动型数据网格中所扮演角色的几个关键概念非常重要。\n\
  \nFigure 3-1 shows an extension of the automotive domain bounded context from Figure\
  \ 2-1. The internal implementation uses a relational database, with tables representing\

- '## 关于作者


  **亚当·贝尔梅尔** 是 Confluent CTO 办公室的首席技术专家。此前，他曾是 Shopify 数据平台的首席工程师，并自 2014 年起在 Flipp
  工作，先后担任高级开发人员和首席职位。他还曾担任嵌入式软件开发和质量保证方面的职位。他的专长包括 DevOps (Kafka、Spark、Mesos、Zookeeper
  Clusters；以编程方式构建、缩放和销毁)；技术领导力 (将 Avro 格式引入我们端到端的数据，倡导将 Kafka 用作事件驱动的微服务总线，原型化 JRuby、Scala
  和 Java Kafka 客户端，并专注于消除技术阻碍以实现产品交付)；软件开发 (使用 Spark 和 Kafka 库在 Java 和 Scala 中构建微服务)；以及数据工程
  (重塑从用户设备收集行为数据并将其与机器学习、计费和分析团队共享的方式)。他是 *构建事件驱动微服务* (O''Reilly) 的作者。


  ## 版权页


  *构建事件驱动的数据网格* 封面上的动物是红天堂鸟 (*Paradisaea rubra*)。这些鸟仅分布于印度尼西亚的两个岛屿：Waigeo 和 Batanta。


  该物种的雄鸟以其鲜艳的羽毛而闻名。它们胸部两侧有长长的红色羽毛，脸部呈绿色，每只眼睛上方有羽毛绒球，尾羽呈长长的螺旋形。雌鸟大多呈棕色，没有装饰。这些鸟具有 lek
  求偶系统，雄鸟聚集进行竞争性求偶仪式，而雌鸟则观察并选择配偶。


  这些鸟的饮食主要由水果、浆果和昆虫组成。*天堂鸟科* 在新几内亚的森林中起着传播种子的重要作用。


  由于栖息地丧失，红天堂鸟的保护状态为近危。O''Reilly 封面上的许多动物处于濒危状态；它们都对世界至关重要。



  \ g0/0\nVAN-R1(config-if)#ipv6 ospf 1 area 0\n\nVAN-R1(config-if)#interface s0/3/0\n\
  VAN-R1(config-if)#ipv6 ospf 1 area 0\nVAN-R1(config-if)#exit\nVAN-R1(config)#exit\n\
  ```\n\n- 在 LA-R1 上配置 OSPFv3，输入以下命令：\n\n```\nLA-R1>enable\nLA-R1#config term\nLA-R1(config)#ipv6\
  \ unicast-routing\nLA-R1(config)#ipv6 router ospf 1\n%OSPFv3-4-NORTRID: OSPFv3 process\

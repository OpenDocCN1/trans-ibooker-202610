  - 了解实施安全程序的最佳实践\n\n思科 CCNA 认证的新关注点之一是增加了安全主题。在本章中，您将学习威胁、漏洞和利用等基本安全概念。您还将了解系统遭受攻击的常见原因，以及通过遵循常见安全最佳实践来缓解这些攻击的方法。\n\

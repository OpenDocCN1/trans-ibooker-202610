  \ 0.0.0.2\nLA-R1(config-rtr)#exit\nLA-R1(config)#interface g0/0\nLA-R1(config-if)#ipv6\
  \ ospf 1 area 0\nLA-R1(config-if)#interface s0/3/0\nLA-R1(config-if)#ipv6 ospf 1\
  \ area 0\nLA-R1(config-if)#exit\nLA-R1(config)#exit\nLA-R1#\n01:51:40: %OSPFv3-5-ADJCHG:\

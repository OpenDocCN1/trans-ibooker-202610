  \ term\n  VAN-SW2(config)#vtp mode client\n  VAN-SW2(config)#vtp password vtppass\n\
  \  ```\n\n- 13. 使用 show vtp status 命令验证模式已更改为 client。\n- 14. 使用 show vlan 命令验证已从\

- '# 无线网络


  在本章中，您将


  - 了解无线网络概念，例如射频、SSID 和信道

  - 了解无线标准和协议

  - 了解无线架构、WLC 定位和 AP 模式

  - 了解管理访问连接


  网络不再局限于使用有线或缆线设备。当今的网络结合了有线系统和使用射频 (RF) 向 *无线接入点* (WAP) 传输数据的无线系统。WAP 可能与有线网络相连，这使得无线设备能够与整个网络进行通信。


  本章将向您介绍无线网络的世界！为了 CCNA 认证考试，了解无线网络的各个方面非常重要，因此请务必好好学习本章。本章将向您介绍无线基础知识，讨论无线安全问题，然后向您展示如何设置无线网络。


  ### 无线网络简介


  在无线网络中，射频 (RF) 通过空气将数据从一个设备传输到另一个设备。无线网络在办公室中特别有用，它们使员工可以在任何位置使用笔记本电脑连接到网络，而不仅仅是使用台式计算机




  硬连线到网络。大多数笔记本电脑都安装了无线网卡以实现无线连接。


  如您所知，计算机以 1 和 0 的形式处理数据。使用无线时，无线网络设备中的收发器负责将该数据编码为 RF 波。如果您能观察 RF 波，您会发现波的低频部分是
  0，而波的高频部分是 1（参见图 15-1）。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_872_0.png)


  图 15-1 无线电波表示正在传输的数据（1 和 0）。


  当系统在无线网络上发送数据时，计算机无线网卡中内置的收发器将数据（1 和 0）编码为无线电波。收发器随后将数据传递到设备上的无线天线，通过空气将无线电波发送到接收设备，接收设备的天线接收无线电波并将其传递给收发器。然后收发器将无线电波转换为数据（1
  和 0），供接收设备读取。


  ## 无线概念


  创建无线网络使用多种网络组件。在本节中，我们将介绍您需要熟悉的常见组件。


  ## 无线接入点


  WAP 设备，通常简称为接入点，为您的网络添加无线功能。它负责发送和接收无线电波，以使无线设备能够与局域网（LAN）上的其他设备通信。无线设备（例如笔记本电脑）向
  LAN 上的设备（例如打印机）发送数据，先将数据无线发送到无线接入点，接入点再将数据转发给连接到有线网络的设备（打印机）。图 15-2 显示了使用 WAP 的典型网络设置。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_873_0.png)


  图 15-2 WAP 使无线设备能够与 LAN 通信。


  ## 无线客户端


  无线客户端是指安装了无线网卡并能与 RF 信号通信的任何设备。无线客户端示例包括笔记本电脑、智能手机、平板电脑以及任何安装了无线网卡的其他设备。无线客户端（也称为无线站）通常通过
  WAP 连接到网络。


  要将无线客户端连接到无线网络，您需要一个 WAP，它拥有天线，可在无线客户端和接入点之间发送和接收无线信号，但接入点也连接到有线网络，以便无线客户端可以访问有线网络上的资源。大多数家庭用户都有无线路由器，它既执行接入点的功能，还包括网络地址转换（NAT）、网络防火墙和动态主机配置协议（DHCP）服务等其他功能。虽然大多数
  IT 人员将无线接入点和无线路由器的术语混用，但从技术上讲它们是不同的设备。无线接入点专注于为无线客户端提供连接，而无线路由器也提供此功能，但还提供刚才提到的其他服务。


  ## 无线局域网控制器


  拥有多个接入点（AP）的企业网络可以使用无线局域网控制器（WLC）从中心点配置多个 AP。如果您配置 WLC 使用中心 Remote Authentication
  Dial-In User Service（RADIUS）服务器，WLC 还可以为网络上所有 AP 提供集中式身份验证。


  WLC 与 AP 以相同方式连接到网络——它们都连接到网络交换机，交换机是网络上的有线设备（即，不是无线连接）。一旦所有 AP 和 WLC 都连接到网络，WLC
  就可用于向 AP 部署配置设置或执行其他管理任务，例如软件升级。


  图 15-3 展示了 WLC 和 AP 在网络上可能的部署位置示例。请注意 2、3、4 楼的 AP，它们为这些楼层上的设备提供无线访问。另请注意，每个 AP 都通过有线以太网连接到交换机；此交换机称为
  *分发系统*（DS）。DS 可以是专用于 WAP 连接的交换机，也可以是所有其他有线设备连接的有线网络交换机。请注意，Cisco 9300 交换机可以在其上安装
  WLC 控制器软件，因此如果您在分支机构使用 9300 交换机，则可以部署分支 WLC，无需任何额外硬件。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_875_0.png)


  图 15-3 接入点和无线局域网控制器连接到交换机。


  每个 AP 都有自己的管理 IP 地址，您可以远程连接到该 AP 并更改配置设置。或者，您可以将 WLC 添加到网络中，用于集中管理所有 AP 的配置。请注意，在图
  15-3 中，WLC 位于 1 楼，也连接到交换机，即分发系统。


  WLC 上连接到交换机（分发系统）的端口是 *分发端口*。由于 WLC 通过该端口发送大量数据，包括 CAPWAP（Control and Provisioning
  of Wireless Access Points，无线接入点控制与提供）隧道中发往 AP 的流量以及来自无线客户端的流量，因此 WLC 常拥有多个分发端口，用于将
  WLC 连接到分发系统（交换机）。这些分发端口始终作为中继端口（而非接入端口）运行，因为它们需要承载所有虚拟局域网（VLAN）的流量。还常将分发端口组合为 *链路聚合组*（LAG），以聚合组内所有端口的带宽。LAG
  还为端口提供负载均衡，确保没有任何一个端口过载；如果某个端口失效，组内其他端口可通过链路容错处理工作负载。


  ## 综合起来


  让我们来看看一个典型的无线网络设置，使用 AP 为网络上属于不同 VLAN 的客户端提供网络访问。在图 15-4 中，您可以看到一个包含两个 VLAN 的 Cisco
  交换机：VLAN 10 供会计部门使用，VLAN 20 供营销部门使用。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_876_0.png)


  图 15-4 单个 AP 提供多个无线网络


  为每个部门提供无线访问，我们将接入点连接到交换机，但请注意，图中的接入点连接的是位于两个 VLAN 之外的端口。这是因为我们需要 AP 转发两个 VLAN 的流量。因此，我们将
  AP 连接到交换机，并将 AP 连接的端口配置为中继端口，以便它能够承载 VLAN 10 和 VLAN 20 的流量。


  要配置 AP，您可以通过 CLI 或 Web GUI 连接到 AP 并配置两个 *服务集标识符*（SSID）。SSID 是客户端在看到可用网络列表时会选择的无线网络名称；即客户端将连接的无线网络。每个
  AP 可以提供多个无线网络或多个 SSID。在我们的示例中，我们为会计部门配置一个 SSID（ACCT_WLAN），为营销部门配置一个 SSID（MKT_WLAN），然后将每个
  SSID 分配给相应的 VLAN。


  ## 天线类型


  典型的无线网络环境涉及使用带有连接天线的 WAP，通过空气传输无线电信号。新的 CCNA 考试期望您了解无线技术使用的这些类型的无线天线：


  - **全向** 向所有方向发送无线电信号，以覆盖广泛的范围或区域。

  - **半向** 向单一方向发送无线电信号，但该方向上的信号覆盖范围广泛。您可以将其比作向下照射但覆盖下方广阔区域的路灯。半向天线的示例是设施中的走廊无线天线。

  - **高度定向** 也称为 *单向*，此天线向单一方向发送无线电信号，覆盖非常小的区域。回到光的比喻——您可以将其比作聚光灯照射时覆盖小区域的方式。高度定向天线可用于医院或仓库的长走廊，覆盖狭长、窄小、封闭的空间。


  此外，一些常见做法可以帮助覆盖无线网络所需的区域并控制与无线网络的连接。通过操纵天线特性，几种方法可以帮助实现无线网络的区域覆盖和安全性。


  为了获得更好的性能和区域覆盖，请尝试保持天线之间的视线通畅。虽然这不是必需的，但请记住，越多



  信号需要穿越的物体越多，信号就会越弱。另外，请确保 WAP 上的天线与无线客户端保持合理距离。如果客户端太远，可能无法连接。从安全角度来看，你希望通过将 WAP（及其天线）放置在建筑物中心来限制谁可以连接到你的无线网络。请记住，如果将
  AP 放置在靠近建筑物外墙的位置，建筑物外部的人员可能会连接到你的无线网络。


  你还可以更改 AP 上的功率电平来控制信号强度。如果客户端因为太远而无法连接到 AP，你可以通过提高 AP 功率电平来解决问题，这会增强信号，使其传输距离更远。从安全角度来看，请注意，最好*降低*功率电平，以便信号范围不会超出建筑物墙壁。


  ## 无线网络类型


  你可以创建两种主要的无线网络模式：特设模式或基础设施模式。这些模式各自被称为无线模式，并且各有优势。


  使用*特设模式*时，无线设备（如笔记本电脑）会在对等环境中连接到其他无线设备，而不需要 WAP。使用*基础设施模式*时，无线客户端连接到一个中心设备，即 WAP。无线客户端将数据发送到
  AP，然后 AP 将数据转发到目标（如图 15-5 所示）。如前所述，无线客户端连接到 AP 后，可以访问有线网络上的网络资源，因为 AP 已连接到有线网络。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_879_0.png)


  图 15-5 运行在基础设施模式下的典型无线网络


  特设模式的优势是你不需要购买 AP；基础设施模式的好处是，当你使用 WAP 时，你可以控制谁可以连接到无线网络，并且许多设备可以同时连接到 AP 以共享信息。


  ## 无线术语


  为了 Cisco CCNA 考试，你需要熟悉许多其他无线术语和概念。其中一些术语在本章中已经提到过：


  ### 基本服务集 (BSS)


  这指的是只有一个 AP 的无线网络。所有无线客户端都连接到该单个 AP 以访问网络。


  ### 基本服务集标识符 (BSSID)


  这是 WAP 的 MAC 地址。当你使用无线安全工具来评估无线网络的安全性时，你会注意到这些工具使用“BSSID”标签来标识 AP MAC。当你使用许多命令行安全工具时，你通常使用
  --bssid 开关来指定正在测试的 AP。


  ### 服务集标识符 (SSID)


  这是无线网络的名称。配置 AP 时，你需要通过设置 SSID 设置来配置无线网络的名称。


  ### 分布式系统 (DS)


  这是将 AP 连接到 LAN 的网络交换机。


  ### 扩展服务集 (ESS)


  在较大的组织中，办公环境跨越大面积区域（如多个楼层或多个建筑物），你可能无法为所有无线客户端提供单个 AP 服务（即 BSS），因为它们在地理上分布很广。在这种情况下，你需要设置一个
  ESS，它由多个配置了相同 SSID 的接入点组成，这些接入点分布在建筑物的不同位置，以服务该区域内的无线客户端。


  创建 ESS 需要满足以下条件：


  - 每个 AP 必须配置相同的 SSID。

  - 每个 AP 必须配置不同的、非重叠的信道。

  - AP 必须覆盖重叠 10% 的区域，以便漫游的无线客户端不会丢失连接。


  图 15-6 对比了 BSS 与 ESS。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_881_0.png)


  图 15-6 BSS 与 ESS 的对比


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_881_1.png)


  **考试提示** 请务必了解本节讨论的无线术语，以备 CCNA 考试之用。


  ## 无线标准


  电气和电子工程师学会（IEEE）委员会已在 802 项目模型中开发了无线网络的无线标准。无线及多个标准由 802.11 项目模型定义。


  ### 802.11a


  802.11a 无线标准是一个较旧的标准，运行在 5 GHz 频率上。802.11a 设备可以以 54 Mbps 传输数据，且与 802.11b 和 802.11g
  设备不兼容。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_882_0.png)


  **考试提示** 考试时请记住，802.11a 是早期的无线标准，其运行频率与 802.11b 和 802.11g 不同。这使其与 802.11b/g 不兼容。请记住，802.11a
  定义了在 5 GHz 频率下以 54 Mbps 运行的无线环境。


  ### 802.11b


  802.11b 无线标准的传输速率为 11 Mbps，使用 2.4 GHz 频率。这些设备与 802.11g/n 设备兼容，因为它们运行在相同频率上并遵循 Wi-Fi
  标准。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_882_1.png)


  **考试提示** 请注意，802.11b 运行在 11 Mbps，而 802.11g 运行在 54 Mbps。802.11n 标准设计用于高达 600 Mbps！


  ### 802.11g


  802.11g 无线标准是一个较新的标准，设计用于与 802.11b 兼容，但也提高了传输速率。802.11g 设备的传输速率为 54 Mbps，使用 2.4
  GHz 频率。


  所有 802.11g 设备都与 802.11b/n 设备兼容，因为它们都遵循 Wi-Fi 标准并运行在相同的 2.4 GHz 频率上。


  ### 802.11n


  802.11n 无线标准于 2009 年末推出。802.11n 的目标是提高传输速率，超越当前标准（如 802.11g）所支持的速率。802.11n 支持高达
  600 Mbps 的传输速率。


  为了帮助实现这一点，802.11n 引入了两个新功能：多输入多输出 (MIMO) 和信道绑定。MIMO 使用多个天线来实现比单个天线更多的吞吐量。信道绑定使 802.11n
  能够通过两个非重叠信道传输数据，以实现更多吞吐量。802.11n 设计为与 802.11a、802.11b 和 802.11g 向后兼容，并可以在 2.4 GHz
  或 5 GHz 频率下运行。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_883_0.png)


  **考试提示** 当今的无线网络称为 Wi-Fi，即无线保真。802.11b、802.11g 和 802.11n 都是 Wi-Fi 标准的一部分，因此彼此兼容。


  ### 802.11ac


  802.11ac 无线标准于 2014 年获批，被认为是一种在 5 GHz 频率范围内运行的高吞吐量无线标准。802.11ac 标准通过增加信道宽度并提供与 802.11n
  标准类似的功能（例如 MIMO 和多用户 MIMO (MU-MIMO)）来实现潜在的 1 Gbps 吞吐量，后者涉及启用多个发射器同时发送独立信号，并让多个接收器同时接收独立信号。


  大多数 802.11ac 无线路由器都带有通用串行总线 (USB) 3.0 端口，你可以在其中连接外部硬盘驱动器到无线路由器，并向客户端流式传输高清视频。


  重要的是要注意，802.11a 是无线网络的早期实现，与早期的 Wi-Fi 网络（如 802.11b 和 802.11g）不兼容。作为兼容性的一个示例，我的家庭无线网络有一个是
  802.11g 设备的 AP，但我的一台旧笔记本电脑有一张 802.11b 无线网卡。我的旧笔记本电脑可以在网络上通信，因为这两个标准彼此 100% 兼容。在此示例中，带有
  802.11b 网卡的笔记本电脑只能以 11 Mbps 连接，而带有 802.11g 网卡的我的新笔记本电脑可以以 54 Mbps 连接。


  ## 需记住的有关无线标准的关键点



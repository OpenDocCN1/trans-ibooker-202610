  \ [1/0] via 15.0.0.1\nR   14.0.0.0/8 [120/1] via 16.0.0.1, 00:00:15, Serial0/3/1\n\
  \n1   2 3   4       5\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_688_0.png)\n"
- "# OSPF 路由\n\n在本章中，您将\n\n- 了解 Open Shortest Path First 协议的基础知识\n- 了解 OSPF 的工作原理\n\
  - 了解如何配置 OSPF\n- 了解 OSPF 故障排除\n\n开放式最短路径优先（OSPF）协议是一种链路状态协议，用于处理 IP 流量的路由。OSPF 版本\
  \ 2（如 RFC 2328 所述）是一种开放标准，路由信息协议（RIP）的版本 1 和 2 也是如此（RIP 也是一种路由协议）。第 11 章简要介绍了链路状态协议。如您将在本章中看到，OSPF\
  \ 大量借鉴了第 11 章中描述的概念，但 OSPF 也具有某些独特功能，这些功能将在此处介绍。除了介绍 OSPF 的特性外，本章还提供了相关信息，使您能够使用\
  \ OSPF 进行基本路由配置。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_689_0.png)\n\n**注意**\
  \ OSPF 的一个优秀资源是“OSPF 设计指南”，可以从思科网站免费查看和下载：[思科 OSPF 设计指南](www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/7039-1.html)。它详细介绍了单区域和多区域设计。\n\
  \n## OSPF Overview\n\nOSPF 创建于 20 世纪 80 年代中期，旨在解决 RIP 在大型企业网络中的许多缺陷和可扩展性问题。由于基于开放标准，OSPF\
  \ 在当今许多企业网络中非常流行，并具有许多优势，包括：\n\n- 由于基于开放标准，它可以在大多数路由器上运行。\n- 它使用由 Edsger Dijkstra\
  \ 开发的 SPF 算法来提供无环拓扑。\n- 它通过链路状态通告（LSA）提供触发式增量更新，从而实现快速收敛。\n- 它是无类协议，支持带有变长子网掩码（VLSM）和路由汇总的分层设计，从而减少路由开销。\n\
  - 它包含两层层次结构，可将问题限制在区域内并减少路由开销。\n- 它具有智能度量（代价），即接口带宽的倒数。\n- 它允许您通过汇总和过滤广泛控制路由更新信息。\n\
  \n鉴于其优势，OSPF 确实也有其劣势：\n\n- 它需要更多内存来保存邻接关系（OSPF 邻居列表）、拓扑（包含所有路由器及其路由/链路的链路状态数据库）和路由表。\n\
  - 运行 SPF 算法需要额外的 CPU 处理，尤其是在首次打开路由器且它们正在初始构建邻接关系和拓扑表时。\n- 对于大型网络，需要仔细设计，通过将路由器分隔到不同区域来将网络划分为适当的分层设计。\n\
  - 与距离矢量协议相比，它的配置更复杂，故障排除更困难。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_691_0.png)\n\
  \n**考试提示** 为考试记住 OSPF 的优点和缺点。\n\n了解任何路由协议的优缺点在选择协议时很有用。通常，OSPF 用于大型企业网络，这些网络要么存在混合路由供应商环境，要么要求路由协议采用开放标准的策略，这使得公司在需要替换现有任何路由器时具有灵活性。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_691_1.png)\n\n**提示** 通常，当拥有超过 50 台路由器时，思科建议使用更先进的路由协议，例如开放式最短路径优先（OSPF）或增强型内部网关路由协议（EIGRP）。在混合供应商环境中，这两者之间基本只有一种选择：OSPF。\n\
  \n## Hierarchical Design: Areas\n\n为了为非常大的网络提供可扩展性，OSPF 支持两个重要概念：自治系统和区域。*Autonomous\
  \ systems*（ASs）在第 11 章中介绍过。在 AS 内，*areas* 用于提供分层路由。区域是一组相邻网络。基本上，区域用于控制跨网络共享路由信息的时间和数量。在扁平网络设计中（例如使用\
  \ IP RIP 的网络），如果某个路由器发生变化（可能是路由震荡问题），它会影响整个网络中*每台*路由器。通过设计正确的分层网络，这些变化可以限制在单个区域内。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_692_0.png)\n\n**考试提示** 请记住，OSPF 支持两层层次结构：主干（区域\
  \ 0 或 0.0.0.0）和连接到主干的区域。\n\nOSPF 实现了两层层次结构：主干和连接到主干的区域，如图 12-1 所示。此网络包括一个主干和三个连接到主干的区域。每个区域都分配了一个\
  \ 32 位长度的唯一编号。区域编号可以用单个十进制数字表示，例如 1，也可以用点分十进制格式表示，例如 0.0.0.1。区域 0 是特殊区域，代表 OSPF\
  \ 网络的顶层层次结构，通常称为*主干*。通过正确的 IP 寻址设计，您应该能够在区域之间汇总路由信息。通过汇总路由信息（例如，为每个区域提供一条汇总路由），您正在减少路由器需要知道的信息量。例如，图\
  \ 12-1 中的每个区域都分配了一个单独的 B 类网络编号。通过区域间边界路由器上的汇总，其他区域不需要查看所有 B 类子网——只需查看各自区域的汇总网络编号（即\
  \ B 类网络编号本身）。\n\n\n\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_693_0.png)\n\n图\
  \ 12-1 OSPF 分层设计\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_693_1.png)\n\n**注意**\
  \ OSPF 中的骨干（区域 0）是必需的，非 0 区域（如区域 1、2、3 等）必须连接到骨干。首选连接是物理连接；不过，OSPF 支持一项称为 *虚拟链路*\
  \ 的功能，它使区域能够逻辑上连接到骨干。虚拟链路的讨论超出了本书的范围。\n\n例如，区域 2 不需要查看区域 1 的 172.18.0.0 网络号的所有子网，因为从区域\
  \ 2 到骨干只有两条路径。然而，区域 2 需要查看其所有内部子网，以便为其在区域 2 内部的自身内部网络创建优化的路由表。因此，在设计正确的 OSPF 网络中，每个区域应仅包含其自身区域的特定路由以及到达其他区域的汇总路由。通过执行此汇总，路由器拥有较小的拓扑数据库（它们仅了解自身区域中的链路和汇总路由），且其路由表更小（它们仅了解自身区域的路由和汇总路由）。通过正确的分层设计，您可以将\
  \ OSPF 扩展到非常大的规模。第 5 章讨论了路由汇总。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_694_0.png)\n\
  \n**考试提示** 请注意，CCNA 考试仅关注单区域设计，本章其余部分的材料仅涵盖单区域概念。然而，CCNP 级别的材料花费大量时间在单区域和多区域设计上。设计多区域\
  \ OSPF 网络可能变得非常复杂，并需要大量的网络知识和技能。\n\n## 度量结构\n\n与使用跳数作为度量的 RIP 不同，OSPF 使用开销。开销实际上是链路带宽的倒数：连接速度越快，开销越低。最首选的路径是累积开销值最低的路径。通过将开销作为度量，OSPF\
  \ 将比 RIP 选择更智能的路径。（度量在本章后面的“OSPF 度量值”部分中有更深入的讨论。）\n\n请记住，在同步串行链路上，无论物理链路的时钟速率如何，带宽始终默认为\
  \ 1544 Kbps。您需要使用 **带宽** 接口子配置模式命令正确配置此设置（在 [第 11 章](Chapter 11) 中讨论）。如果您有多个通往目的地的同步串行路径，尤其是它们具有不同时钟速率时，这一点非常重要。OSPF\
  \ 支持到单个目的地最多 16 条等价开销路径的负载平衡；然而，默认情况下仅使用 4 条等价开销路径。请记住，如果您在串行接口上未正确配置带宽度量，路由器可能会意外包含不同时钟速率的路径，这可能导致负载平衡问题。\n\
  \n例如，如果您有一个以 1544 Kbps 时钟的串行连接和另一个以 256 Kbps 时钟的连接，且您未更改带宽值，OSPF 会将 *两者* 都视为 1544\
  \ Kbps，并在尝试通过这些链路到达单个目的地时使用 1544 Kbps。这是因为无论接口的时钟速率如何，串行链路的默认带宽都是 1544。当路由器执行负载平衡时，这可能会导致吞吐量问题——一半的连接将走一条链路，另一半走另一条，从而为\
  \ 256-Kbps 连接创建拥塞问题。因此，请记住，您应使用 **带宽** 命令更改接口的带宽。\n\n## OSPF 操作\n\n如前所述，OSPF 是一种链路状态协议，类似于\
  \ [第 11 章](Chapter 11) 中泛型描述的协议。然而，每种链路状态协议（例如 OSPF 和 Intermediate System-Intermediate\
  \ System（IS-IS））都有其自身独特的功能和特性。本节将向您介绍 OSPF 在单区域设计中的操作方式。\n\n## 路由器标识\n\nOSPF 网络中的每个路由器都需要一个唯一的\
  \ ID——该 ID 不仅在区域内必须唯一，在整个 OSPF 网络中也必须唯一。该 ID 用于为 OSPF 路由器提供唯一标识。该 ID 包含在路由器生成的任何其他\
  \ OSPF 路由器将处理的 OSPF 消息中。\n\n路由器 ID 根据以下标准之一选择：\n\n- 使用路由器活动环回接口上的最高 IP 地址（这是路由器上的逻辑接口）。\n\
  - 如果不存在带有 IP 地址的环回接口，则在路由器启动时使用其活动接口上的最高 IP 地址。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_696_0.png)\n\
  \n**注意** 环回通常具有主机掩码 (/32)。Cisco 支持环回接口的其他掩码，但许多厂商将您限制在 /32 掩码。\n\n路由器 ID 由路由器用于向网络中的其他\
  \ OSPF 路由器宣布自身。该 ID 必须是唯一的。如果未配置环回接口，路由器将使用其一个活动物理接口上的最高 IP 地址。可选地，您可以手动定义路由器 ID，并始终确保无论路由器上存在什么接口，都能定义其方式。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_696_1.png)\n\n**考试提示** 请记住，在 CCNA 考试中，路由器如何为\
  \ OSPF 获取其路由器 ID：活动环回上具有最高 IP 地址，或活动物理接口上具有最高 IP 地址。\n\n如果不存在活动接口，OSPF 进程将不会启动，因此您的路由表中将不会有任何\
  \ OSPF 路由。因此，强烈建议您使用环回接口，因为它始终处于活动状态，因此路由器可以获得路由器 ID 并启动 OSPF。\n\n## 查找邻居\n\n与 RIP\
  \ 几乎接受任何其他 RIP 路由器的路由更新不同（除非配置了带身份验证的 RIPv2），OSPF 有一些关于是否以及如何共享路由信息的规则。首先，在路由器接受来自另一个\
  \ OSPF 路由器的任何路由信息之前，路由器必须在它们的连接接口上构建相邻性。当此相邻性建立后，这两个路由器（在连接接口上）被称为邻居，表示两者之间的特殊关系。\n\
  \nOSPF 路由器通过共享链路状态通告（LSA）了解其 OSPF 邻居并构建其相邻性和拓扑表，LSA 存在不同类型。在了解路由器连接到哪些邻居以及跟踪已知邻居时，OSPF\
  \ 路由器会每 10 秒生成 LSA hello 消息。当发现邻居并与邻居形成相邻性时，路由器期望看到来自邻居的 hello 消息。如果在默认 40 秒的死时间内未看到邻居的\
  \ hello，则该邻居被宣布为死亡。当这种情况发生时，路由器将通过 LSA 消息向其他相邻的 OSPF 路由器通告此信息。\n\n为了使两个路由器成为邻居，以下项目必须在每个路由器上匹配：\n\
  \n- 区域编号\n- 其连接接口上的 hello 和死间隔定时器\n- OSPF 密码（可选），如果已配置\n- 区域 stub 标志，指示区域类型（stub\
  \ 用于包含 OSPF 消息和路由信息，这超出了本书的范围）\n- 连接接口上的最大传输单元（MTU）大小\n\n如果这些项目不匹配，路由器将不会形成相邻性并将忽略彼此的路由信息。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_697_0.png)\n\n**考试提示** 对于 Cisco CCNA\
  \ 考试，请记住 hello 进程用于发现和维护与其他 OSPF 路由器的邻居关系。为了形成邻居关系，同一网段上的两个 OSPF 路由器必须处于同一区域，必须具有匹配的\
  \ hello 和死间隔定时器，如果配置了身份验证则必须具有相同的密码，必须是相同类型（stub、not-so-stubby 或 no stub），并且其接口上必须配置相同的\
  \ MTU 大小。\n\n假设您同时在网段上开启了所有路由器。在这种情况下，OSPF 路由器将经历三个状态，称为 *交换过程*，以确定它们是否将成为邻居：\n\n\
  1. **Down 状态** 路由器未与任何其他路由器交换任何 OSPF 信息。\n2. **Init 状态** 目标路由器接收新路由器的 hello 并将其添加到其邻居列表中（假设前面要点中的值匹配）。请注意，此时通信仅为单向。\n\
  3. **双向状态** 新路由器接收来自目标路由器的单向答复（对其初始 hello 报文的响应），并将目标路由器添加到其邻居数据库中。\n\n一旦路由器进入 *双向*\
  \ 状态，它们即被视为邻居。此时，将进行选举过程以在网段上选举指定路由器（DR）和备份指定路由器（BDR）。\n\n## 指定路由器和备份指定路由器\n\nOSPF\
  \ 路由器不会与任何路由器形成相邻性。相反，在 OSPF 的 *每个* 广播段上实现了客户端/服务器设计。对于每个多路访问广播段，例如以太网，有一个 DR 和一个\
  \ BDR，以及其他称为 *DROTHERs* 的 OSPF 路由器。例如，如果您在交换区域中有十个 VLAN，您将有十个 DR 和十个 BDR。网段不拥有这两个路由器的唯一例外是在\
  \ WAN 点对点链路上。\n\n\n\n\n当 OSPF 路由器启动时，它会在其连接的每个多访问网段上与 DR（指定路由器）和 BDR（备份指定路由器）建立邻接关系；如果它连接到三个网段，它将建立三组邻接关系。任何路由信息的交换都是在这些\
  \ DR/BDR 路由器和网段上的其他 OSPF 邻居之间进行的（反之亦然）。OSPF 路由器使用 IP 多播地址 224.0.0.6 与 DR 进行通信。DR\
  \ 和 BDR 使用多播 IP 地址 224.0.0.5 与所有 OSPF 路由器进行通信。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_699_0.png)\n\
  \n**考试提示** 请记住，对于 CCNA 考试，OSPF 路由器使用链路状态通告（LSAs）相互通信。LSA 的一种类型是 hello（保持活动包），用于建立邻居关系并作为保活功能。Hellos\
  \ 每 10 秒生成一次。在共享链路信息（直连路由）时，链路信息发送到 DR（224.0.0.6），然后 DR 将链路信息传播给网段上的其他所有人（224.0.0.5）。在点对点链路上，由于不使用\
  \ DR/BDR，所有 OSPF 数据包都寻址到 224.0.0.5。\n\n具有最高优先级的 OSPF 路由器成为该网段的 DR。如果优先级相同，具有最高路由器\
  \ ID（不是网段上的 IP 地址）的路由器将成为 DR。默认情况下，所有路由器的优先级均为 1（优先级范围可以是 0 到 255——这是一个 8 位值）。如果\
  \ DR 发生故障，BDR 会被提升为 DR，并且另一台路由器会被选举为 BDR。图 12-2 展示了选举过程的示例，其中路由器 E 被选举为 DR，路由器 B\
  \ 被选举为 BDR。请注意，在此示例中，每台路由器都具有默认优先级 1；因此，由于路由器 E 具有最高的路由器 ID，它被选为 DR；由于路由器 B 具有第二高的路由器\
  \ ID，它被选为 BDR。如果一台路由器的优先级为 0，它将永远不会成为 DR 或 BDR。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_700_0.png)\n\
  \n### 图 12-2 DR 和 BDR 选举过程\n\nDR 和 BDR 的优先级是基于接口逐一对应修改的，并且在接口子配置模式下使用 `ip ospf priority`\
  \ 命令进行配置。一旦 DR 和 BDR 被选举出来，即使其他具有更高优先级的路由器与它们建立邻接关系，它们也会保持这些角色：只有当不存在 DR 或 BDR 时，才会发生选举或重新选举。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_700_1.png)\n\n**考试提示** CCNA 考试中理解的一个重要主题是路由器如何成为\
  \ DR。具有最高优先级（或最高路由器 ID）的路由器成为 DR——请注意，这并不意味着链路上具有最高 IP 地址的路由器。这个过程适用于多访问网段，但不适用于不使用\
  \ DR/BDR 的点对点链路。将优先级设置为 0 意味着该路由器永远不会成为 DR 或 BDR。\n\n## 共享路由信息\n\n在选举出 DR/BDR 对之后，路由器继续生成\
  \ hellos 以维持通信。这被视为一种 *exstart*（交换开始）状态，在此状态下，OSPF 路由器准备好共享链路状态信息。路由器经历的过程被称为 *exchange\
  \ protocol*（交换协议），概述如下：\n\n1.  **Exstart 状态** DR 和 BDR 与网段上的其他 OSPF 路由器建立邻接关系。然后，在每个邻接关系中，具有最高路由器\
  \ ID 的路由器成为主节点（master），并首先启动交换过程（共享其链路状态信息）。请注意，DR 不一定是交换过程的主节点。邻接关系中的剩余路由器将是主节点（slave）。\n\
  2.  **Exchange 状态** 主节点首先向主节点分享链路状态信息。这些被称为 *database description packets*（数据库描述包，DBDs，有时也称为\
  \ DDPs）。DBDs 包含链路状态类型、通告路由器的 ID、通告链路的开销（cost）以及链路的序列号。主节点回复一个 LSACK——对主节点 DBD 的确认。主节点随后将\
  \ DBD 的信息与其自身的信息进行比较。\n3.  **Loading 状态** 如果主节点拥有比主节点更新的信息，主节点将向主节点的原始 DBD 响应一个链路状态请求（LSR）。主节点随后向主节点发送包含链路详细信息的链路状态更新（LSU）。主节点然后将此内容纳入其本地链路状态数据库。同样，主节点将向主节点生成一个\
  \ LSACK，以确认其已接收 LSU。如果主节点拥有更新的信息，它将重复交换和加载状态。\n4.  **Full 状态** 一旦主节点和主节点同步，它们就被视为处于完全（full）状态。\n\
  \n总结这四个步骤，OSPF 路由器共享一种 LSA 消息，以披露有关可用路由的信息；基本上，LSA 更新消息包含一条链路和一个状态，以及其他信息。*链路*是生成该更新的路由器接口（一条直连路由）。*状态*是对此接口的描述，包括其上配置的\
  \ IP 地址以及该路由器与其相邻路由器的关系。然而，OSPF 路由器不会与任何 OSPF 路由器共享此信息——它是在 OSPF 路由器和网段上的 DR/BDR\
  \ 之间共享的。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_702_0.png)\n\n**考试提示** 熟悉路由器将与\
  \ DR/BDR 共享路由所经历的四个步骤。还要记住，OSPF 路由器与 DR/BDR 共享有关其直连路由的信息，其中包括链路状态类型、通告路由器的 ID、通告链路的开销以及链路的序列号。\n\
  \n进入完全状态后，OSPF 使用增量更新。这意味着每当发生变化时，只有该变化会与 DR 共享，然后 DR 将此信息与其他网段上的路由器共享。图 12-3 展示了此过程的示例。在此示例中，连接到路由器\
  \ C 的网络 Z 关闭。路由器 C 向 DR 和 BDR（目的多播地址为 224.0.0.6）发送多播，告知它们此变化。一旦 DR 和 BDR 内部整合了此变化，DR\
  \ 随后通过多播消息（发送到 224.0.0.5，即所有 OSPF 路由器）告知网段上的其他路由器有关网络 Z 的变化。任何接收该更新的路由器随后将此更新共享到它们连接的其他网段的\
  \ DR。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_703_0.png)\n\n### 图 12-3 LSA 更新过程\n\
  \n请注意，OSPF 路由器之间的通信是面向连接的，即使使用了多播。例如，如果一台路由器向 DR 告知变化，DR 会用通信源确认这条新信息。同样，当 DR 将此信息与网段上的其他路由器共享时，DR\
  \ 期望从每个这些邻居处获得确认。请记住，当 OSPF 路由器与另一台路由器交换更新时，该过程需要确认：这确保路由器或路由器们已接收更新。\n\n增量更新过程的一个例外是，DR\
  \ 每 30 分钟泛洪其数据库，以确保网段上的所有路由器都具有最新的链路状态信息。它使用目的地址 224.0.0.5（网段上所有 OSPF 路由器）来实现这一点。\n\
  \n每个 LSA 消息都与其类型相关联。本书重点关注以下三种类型，它们都位于单个区域内：\n\n-   **LSA 类型 1（路由器 LSA）** 这些由每台路由器为属于该区域的每条链路生成。它们仅在该所属区域内泛洪。此\
  \ LSA 的链路 ID 是生成它的路由器的路由器 ID。\n-   **LSA 类型 2（网络 LSA）** 这些由 DR 生成，并描述连接到该网段的路由器。它们在网络段所属的区域内发送。链路\
  \ ID 是指定路由器的接口 IP 地址，该地址描述特定网段。\n-   **LSA 类型 5（外部 LSA）** 自治系统外部 LSA 由自治系统边界路由器（ASBR）生成，并包含指向当前\
  \ AS 外部网络的路由。链路 ID 是 LSA 中通告的网络号。\n\n总之，前两种 LSA 类型代表本地区域内的链路，而最后一种 LSA 类型代表来自不同自治系统的链路。这些\
  \ LSA 类型被放置在路由设备上的本地数据库中。还有其他 LSA 类型，但它们超出了本书的范围。\n\n在使用链路状态信息构建路由表时，OSPF 路由器可以在其路由表中保留至多\
  \ 16 条通往单一目的地的路径。唯一的限制是，这些路径必须具有相同的累积开销度量。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_704_0.png)\n\
  \n**考试提示** 在 CCNA 考试中请记住，双向状态表明两台 OSPF 路由器是邻居。完全状态表明路由器之间链路共享的完成。为了构建和维护 OSPF 数据库，使用\
  \ hello（建立邻居）和 LSA（路由信息）消息。\n\n## OSPF 配置\n\n\n\n\n配置 OSPF 与配置 RIP 等路由协议略有不同。配置\
  \ OSPF 时，请使用以下语法：\n\n```\nRouter(config)# router ospf process_ID\nRouter(config-router)#\
  \ network IP_address wildcard_mask area area_#\n```\n\n进程 ID 在本地具有重要意义，用于区分同一路由器上运行的\
  \ OSPF 进程。它可以是 1 到 65,535 之间的任何数字。您的路由器可能是两个 OSPF 自治系统之间的边界路由器，为了在路由器上区分它们，您将为它们分配唯一的进程\
  \ ID。请注意，这些 ID 号码在不同路由器之间不需要匹配，并且与自治系统编号无关。如果您的路由设备连接到两个不同的 OSPF 网络，则需要使用不同的进程编号：每个\
  \ OSPF 网络都需要一个不同的、本地唯一的进程编号。每个 OSPF 进程都有自己的由进程 ID 标识的 OSPF 数据库。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_705_0.png)\n\
  \n**考试提示** 请记住，在思科 CCNA 考试中，配置 OSPF 路由进程时，必须指定进程 ID（标识符）。它唯一标识路由器上 OSPF 数据库的一个实例，并且仅在本地具有重要意义：它不需要在\
  \ AS 中的每个路由器上匹配。它可以是 1 到 65,535 之间的任何数字。\n\n配置 OSPF 时，您使用 network 命令指定哪些接口进入哪个 OSPF\
  \ 区域。不同的进程 ID 号用于标识路由设备连接的不同 OSPF 网络。因此，例如，network 0.0.0.0 255.255.255.255 area\
  \ 0 命令将把所有接口包含在区域 0 中。每个 OSPF 进程都有自己的由进程 ID 标识的 OSPF 数据库。\n\n从配置 OSPF 的命令中可以看到，此命令的语法与\
  \ RIP 的配置语法不同，在 RIP 中您只需指定一个类地址。OSPF 是无类别的。使用此配置命令，您可以非常具体地指定哪个接口属于哪个区域。此命令的语法列出一个\
  \ IP 地址或网络号，后面跟一个 *通配符掩码*，它与子网掩码不同。通配符掩码告诉路由器地址中感兴趣的部分——换句话说，应该匹配地址的哪一部分。此掩码也用于访问列表，访问列表将在第\
  \ 17 章中详细讨论。\n\n通配符掩码长度为 32 位。某一位位置中的 0 表示必须匹配，某一位位置中的 1 表示路由器不关心。实际上，通配符掩码是一个 *反向*\
  \ 子网掩码，其中 1 和 0 已切换。使用通配符掩码，您可以非常具体地指定哪些接口属于哪些区域。配置命令的最后部分告诉路由器这些地址属于路由器上的哪个区域。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_706_0.png)\n\n**考试提示** 与 RIP 不同，**network**\
  \ 语句允许您指定 IP 地址和通配符掩码，通配符掩码是一个反向子网掩码。您还必须指定这些地址属于哪个区域：**network *network_# wildcard_mask\
  \ area area_#***。将子网掩码转换为通配符掩码的技巧是用 255.255.255.255 减去子网掩码；结果将是相应的通配符掩码。（您将在第 17\
  \ 章中详细了解访问列表和通配符掩码的工作原理。）在考试中，您需要能够查看 OSPF **network** 命令中的通配符掩码，并确定它包含哪个接口或哪些接口。\n\
  \n让我们看一些代码示例，了解通配符掩码的工作原理。请使用图 12-4 中所示的路由器作为示例。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_707_0.png)\n\
  \n**图 12-4 OSPF 网络配置示例**\n\n```\nRouter(config)# router ospf 1\nRouter(config-router)#\
  \ network 10.1.1.1 0.0.0.0 area 0\nRouter(config-router)# network 10.1.2.1 0.0.0.0\
  \ area 0\nRouter(config-router)# network 172.16.1.1 0.0.0.0 area 0\nRouter(config-router)#\
  \ network 172.16.2.1 0.0.0.0 area 0\n```\n\n在此示例中，地址为 10.1.1.1、10.1.2.1、172.16.1.1\
  \ 和 172.16.2.1 的接口都与区域 0 相关联。通配符掩码 0.0.0.0 表示，要将接口放入区域 0，必须与路由器接口上的地址进行精确匹配。\n\n\
  下面是另一个实现相同目的的示例：\n\n```\nRouter(config)# router ospf 1\nRouter(config-router)# network\
  \ 10.0.0.0 0.255.255.255 area 0\nRouter(config-router)# network 172.16.0.0 0.0.255.255\
  \ area 0\n```\n\n在此示例中，地址以 10 或 172.16 开头的接口将包含在区域 0 中。\n\n或者，如果路由器上的所有接口都属于同一区域，您可以使用此配置：\n\
  \n```\nRouter(config)# router ospf 1\nRouter(config-router)# network 0.0.0.0 255.255.255.255\
  \ area 0\n```\n\n在此示例中，所有接口都放置在区域 0 中。\n\n可以看到，OSPF 非常灵活，使您能够指定哪些接口将参与 OSPF 以及它们将属于哪个区域。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_708_0.png)\n\n**视频 12.01.** 随本书附带的数字资源包含配置路由器\
  \ OSPF 的多媒体演示。\n\n### 环回接口\n\n环回接口是路由器上的一个逻辑虚拟接口。默认情况下，路由器上没有环回接口，但可以轻松创建。所有 IOS\
  \ 平台都支持环回接口，您可以根据需要创建任意数量的这些接口。这些接口被视为路由器上的物理接口：您可以为它们分配寻址信息，将其网络号包含在路由更新中，甚至可以在它们上终止\
  \ IP 连接，例如 telnet 和 SSH。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_708_1.png)\n\
  \n**考试提示** 请记住环回接口的价值，以备思科 CCNA 考试之用。环回接口是一个始终保持启动状态的逻辑接口。使用 interface loopback\
  \ 命令创建它。\n\n您可能希望创建环回接口的一些原因：\n\n- 为 OSPF 路由器分配路由器 ID\n- 用于测试目的，因为此接口始终保持启动状态\n\
  - 终止特殊连接，例如 GRE 隧道或 IPsec 连接，因为此接口始终保持启动状态\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_709_0.png)\n\
  \n**提示** OSPF 路由器 ID 在启动 OSPF 路由进程时选择。当您手动执行 **router ospf** 命令或在路由器启动时加载路由器配置时，会发生这种情况。因此，如果在启用\
  \ OSPF 后创建环回接口，则不会将环回接口用作路由器 ID；但是，如果重启路由器，默认情况下将使用环回接口。因此，我建议您先创建环回接口并为其分配 IP 地址，然后再启用\
  \ OSPF，以消除对路由器 ID 是什么的任何混淆。\n\n要创建环回接口，请使用以下命令：\n\n```\nRouter(config)# interface\
  \ loopback port_#\nRouter(config-if)# ip address IP_address subnet_mask\n```\n\n\
  可以看到，创建环回接口很简单。您可以指定 0 到 2147483647 之间的端口号。您使用的编号仅在本地具有重要意义。进入环回接口后，您几乎可以在其上执行任何接口命令；例如，您可以使用\
  \ **ip address** 命令为其分配 IP 地址。\n\n### 默认路由传播\n\n在连接到 ISP 的边界 OSPF 路由器上，您通常有一个指向\
  \ ISP 的默认路由。要获取此路由并将其重新分发到您的 OSPF 进程，基本上将您的边界路由器变为 ASBR，请使用以下配置：\n\n```\nRouter(config)#\
  \ ip route 0.0.0.0 0.0.0.0 ISP_interface_or_IP_address\nRouter(config)# router ospf\
  \ process_ID\nRouter(config-router)# default-information originate\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_710_0.png)\n\
  \n**提示** 请确保您的默认路由不指向内部网络，而是指向 ISP 的网络；否则，您将创建一个路由循环。\n\n### OSPF 度量值\n\n您可以通过两种方式影响\
  \ OSPF 用于为路由表选择最佳成本路由的成本度量值。首先，请记住，成本度量值是路由器接口累积带宽值的倒数。思科计算成本度量值所使用的默认度量是：cost =\
  \ 10⁸ / (接口带宽)；10⁸ 表示 100 Mbps。您还可以通过使用 **auto-cost reference-bandwidth** 命令更改 10⁸\
  \ 的值来影响成本值。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_710_1.png)\n\n**考试提示** 在考试中，您需要记住表\
  \ 12-1 中的 OSPF 接口成本，尤其是串行连接的成本。\n\n表 12-1 包含不同接口类型的一些默认成本。\n\n\n\n\n\n| Cost Value\
  \ | Interface Type |\n|---|---|\n| 1785 | 56-Kbps 串行线路 |\n| 1652 | 64-Kbps 串行线路\
  \ |\n| 64 | T1 |\n| 10 | 以太网 (10 Mbps) |\n| 1 | 快速以太网 (100 Mbps) |\n| 1 | 千兆以太网\
  \ (1000 Mbps/1 Gbps) |\n| 1 | 10 千兆以太网 (10 Gbps) |\n| 1 | 100 千兆以太网 (100 Gbps) |\n\
  \n表 12-1 不同 IOS 接口的默认 OSPF 成本\n\n手动更改接口成本，请使用以下配置：\n\n```\nRouter(config)# interface\
  \ type [slot_#/]port_#\nRouter(config-if)# ip ospf cost cost_value\n```\n\n请注意，成本是在接口内分配的。该值范围为\
  \ 1 到 65,535。请注意，每个供应商可能使用不同的计算方法来得出成本值。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_711_0.png)\n\
  \n**注意** 在给定网段上，每台路由器的链路成本必须匹配非常重要。网段上的成本值不匹配会导致路由器持续运行 SPF 算法，大大影响路由器性能。\n\n通常，您不会更改接口上的默认成本值。但是，由于\
  \ OSPF 使用带宽的倒数作为度量值，并且串行接口默认带宽为 1544 Kbps，您肯定希望将串行接口的带宽度量值与其实时时钟速率匹配。要配置路由器接口的带宽，请使用以下命令：\n\
  \n```\nRouter(config)# interface type [slot_#/]port_#\nRouter(config-if)# bandwidth\
  \ speed_in_Kbps\n```\n\n例如，如果时钟速率为 64,000，您将使用 **bandwidth 64** 命令正确配置带宽。请注意，**bandwidth**\
  \ 命令的速度单位为 *Kbps*。例如，假设您使用 **bandwidth 64000** 配置了带宽。路由器会假设接口的带宽度量值为 64 Mbps，而不是\
  \ Kbps。\n\n默认情况下，路由器会在路由表中放置最多 8 条到目标的等成本 OSPF 路径。可通过以下配置将其增加到最多 16 条等成本路径：\n\n\
  ```\nRouter(config)# router ospf process_ID\nRouter(config-router)# maximum-paths\
  \ #_of_max_paths\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_712_0.png)\n\n\
  **考试提示** 对于 CCNA，请记住 **bandwidth** 命令应用于同步串行接口，以将带宽度量值与接口的时钟速率匹配。无论同步串行接口的时钟速率如何，其默认带宽度量值均为\
  \ 1544 Kbps。最大路径数的默认值为 8。\n\n## OSPF Authentication\n\nOSPF 支持对邻居和路由更新进行身份验证。这是用于防止恶意\
  \ OSPF 路由器将错误或误导性路由信息注入到拓扑数据库中。身份验证可以使用明文密码或使用 MD5 算法创建的数字签名来完成。在两者中，后者更安全：明文密码可能被两个\
  \ OSPF 邻居之间的窃听者看到。使用 MD5 时，为了防止重放攻击（例如，相同信息始终发送到邻居，如 hello 消息），消息中包含一个非递减序列号，以确保消息和签名是唯一的。身份验证信息放置在每个\
  \ LSA 中，并在被 OSPF 路由器接受前进行验证。要成为邻居，两个对等点上的密钥信息（明文密码或 MD5 算法的密钥）必须匹配。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_713_0.png)\n\
  \n**注意** 请记住，如果两个 OSPF 邻居上的密码/密钥值不匹配，将不会发生邻接。在两种方法中，使用 MD5 绝对比明文密码安全得多。\n\n配置身份验证是一个两步过程：指定要使用的密码/密钥，并启用身份验证。密钥的配置是按接口进行的，这意味着同一接口上的每个相邻\
  \ OSPF 路由器都必须使用该密码/密钥。配置密码/密钥值的命令如下：\n\n```\nRouter(config)# interface type [slot_#/]port_#\n\
  Router(config-if)# ip ospf authentication-key password\n```\n\n从 Cisco IOS 12.4\
  \ 开始，路由器会将任何超过八个字符的密码截断为八个字符。密码以明文形式存储在路由器配置中。要对其加密，请使用 service password-encryption\
  \ 命令，该命令在第 17 章中讨论。\n\n接下来，您必须指定密码是以明文发送还是由 MD5 用于创建数字签名。这可以在接口上或按区域进行。要指定接口方法，请使用此配置：\n\
  \n```\nRouter(config)# interface type [slot_#/]port_#\nRouter(config-if)# ip ospf\
  \ authentication [message-digest]\n```\n\n如果省略 **message-digest** 参数，密钥将作为明文密码发送。\n\
  \n您的另一个选项是为路由器关联的区域配置密码/密钥的使用：\n\n```\nRouter(config)# router ospf process_ID\n\
  Router(config-router)# area area_# authentication\n    [message-digest]\n```\n\n\
  同样，如果省略 **message-digest** 参数，密钥将作为明文密码发送。\n\n在两种方法中，后者是较旧的方法：接口方法（前者）是在 IOS 12.0\
  \ 中添加的，是首选方法。\n\n## OSPF Troubleshooting\n\n配置 OSPF 后，可使用以下命令查看和排查 OSPF 配置和操作：\n\
  \n- **show ip protocols**\n- **show ip route**\n- **show ip ospf**\n- **show ip\
  \ ospf database**\n- **show ip ospf interface**\n- **show ip ospf neighbor**\n-\
  \ **debug ip ospf adj**\n- **debug ip ospf events**\n- **debug ip ospf packet**\n\
  \n以下各部分将介绍这些命令。\n\n## The show ip protocols Command\n\n**show ip protocols** 命令显示您在路由器上配置并运行的所有\
  \ IP 路由协议。以下是使用 OSPF 的此命令示例：\n\n```\nRouter# show ip protocols\nRouting Protocol\
  \ is \"ospf 1\"\n    Outgoing update filter list for all interfaces is not set\n\
  \    Incoming update filter list for all interfaces is not set\n    Router ID 192.168.100.1\n\
  \    Number of areas in this router is 1. 1 normal 0 stub 0 nssa\n    Maximum path:\
  \ 4\n    Routing for Networks:\n      0.0.0.0 255.255.255.255 area 0\n    Routing\
  \ Information Sources:\n      Gateway          Distance      Last Update\n     \
  \ 192.168.1.100     110           00:00:24\n      192.168.100.1     110        \
  \   00:00:24\n    Distance: (default is 110)\n```\n\n在此示例中，路由器 ID 为 192.168.100.1。所有接口都在参与\
  \ OSPF（0.0.0.0 255.255.255.255）并位于区域 0。此网络中有两台 OSPF 路由器：192.168.1.100（另一台路由器）和 192.168.100.1（本路由器）。请注意，默认管理距离为\
  \ 110。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_715_0.png)\n\n**考试提示** Cisco\
  \ CCNA 要求您了解连接路由、静态路由、RIP、EIGRP 和 OSPF 的管理距离。请记住，连接路由的默认管理距离为 0；静态路由为 1；RIP 路由的管理距离为\
  \ 120；EIGRP 路由的管理距离为 90；OSPF 路由的管理距离为 110。有关管理距离的更多信息，请复习第 11 章。\n\n## The show\
  \ ip route Command\n\n您的路由器在路由表中保存到目的地的最佳 IP 路径列表。要查看路由表，请使用 **show ip route** 命令：\n\
  \n```\nRouter# show ip route\nCodes: C - connected, S - static, I - IGRP, R - RIP,\n\
  \      M - mobile, B - BGP, D - EIGRP, EX - EIGRP external,\n      O - OSPF, IA\
  \ - OSPF inter area, N1 - OSPF NSSA\n      external type 1, N2 - OSPF NSSA external\
  \ type 2,\n      E1 - OSPF external type 1, E2 - OSPF external type 2,\n      E\
  \ - EGP, i - IS-IS, L1 - IS-IS level-1,\n      L2 - IS-IS level-2, * - candidate\
  \ default,\n      U - per-user static route, o - ODR,\n      T - traffic engineered\
  \ route\nGateway of last resort is not set\n        10.0.0.0/24 is subnetted, 1\
  \ subnets\nO         10.0.1.0 [110/65] via 192.168.1.100, 00:04:18, Serial0\nC \
  \    192.168.1.0/24 is directly connected, Serial0\nC     192.168.100.0/24 is directly\
  \ connected, Ethernet0\n```\n\n在此示例中，有一条 OSPF 路由（**O**）：10.0.1.0。该路由的管理距离为 110，度量成本为\
  \ 65，可通过邻居 192.168.1.100 到达。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_716_0.png)\n\
  \n**考试提示** 对于 CCNA 考试，请记住 OSPF 路由在 **show ip route** 命令的输出中显示为 **O**。请记住括号（[ ]）中的两个数字：管理距离和成本（在处理\
  \ OSPF 路由时）。\n\n## The show ip ospf Command\n\n要查看路由器 OSPF 配置的概述，请使用 **show ip ospf**\
  \ 命令：\n\n\n```\nRouter# show ip ospf\n  Routing Process \"ospf 1\" with ID 10.1.1.1\
  \ and Domain ID 10.1.1.1\n  Supports only single TOS(TOS0) routes\n  Supports opaque\
  \ LSA\n  SPF schedule delay 5 secs, Hold time between two SPFs 10 secs\n  Minimum\
  \ LSA interval 5 secs. Minimum LSA arrival 1 secs\n  LSA group pacing timer 100\
  \ secs\n  Interface flood pacing timer 55 msecs\n  Retransmission pacing timer 100\
  \ msecs\n  Number of external LSA 0. Checksum Sum 0x0\n  Number of opaque AS LSA\
  \ 0. Checksum Sum 0x0\n  Number of DCbitless external and opaque AS LSA 0\n  Number\
  \ of DoNotAge external and opaque AS LSA 0\n  Number of areas in this router is\
  \ 1. 1 normal 0 stub 0 nssa\n  External flood list length 0\n    Area BACKBONE(0)\n\
  \      Number of interfaces in this area is 2\n      Area has message digest authentication\n\
  \      SPF algorithm executed 4 times\n      Area ranges are\n      Number of LSA\
  \ 4. Checksum Sum 0x29BEB\n      Number of opaque link LSA 0. Checksum Sum 0x0\n\
  \      Number of DCbitless LSA 3\n      Number of indication LSA 0\n      Number\
  \ of DoNotAge LSA 0\n      Flood list length 0\n```\n\n此命令显示 OSPF 定时器配置及其他统计信息，包括在某个区域内运行\
  \ SPF 算法的次数。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_717_0.png)\n\n**视频** 12.02。随本书附带的数字资源包含使用\
  \ **show ip route** 和 **show ip ospf** 命令的多媒体演示。\n\n## show ip ospf database 命令\n\
  \n要显示特定路由设备的 OSPF 数据库相关信息列表，包括 OSPF 链路状态的集合，请使用 **show ip ospf database** 命令。以下是一个示例：\n\
  \n```\nRouter# show ip ospf database\nOSPF Router with ID(192.168.1.11) (Process\
  \ ID 1)\n```\n\n**路由器链路状态（区域 0）**\n\n| 链路 ID | 通告路由器 | 老化时间 | 序列号 | 校验和 | 链路计数 |\n\
  | --- | --- | --- | --- | --- | --- |\n| 192.168.1.8 | 192.168.1.8 | 1381 | 0x8000010D\
  \ | 0xEF60 | 2 |\n| 192.168.1.11 | 192.168.1.11 | 1460 | 0x800002FE | 0xEB3D | 4\
  \ |\n| 192.168.1.12 | 192.168.1.12 | 2027 | 0x80000090 | 0x875D | 3 |\n| 192.168.1.27\
  \ | 192.168.1.27 | 1323 | 0x800001D6 | 0x12CC | 3 |\n\n**网络链路状态（区域 0）**\n\n| 链路\
  \ ID | 通告路由器 | 老化时间 | 序列号 | 校验和 |\n| --- | --- | --- | --- | --- |\n| 172.16.1.27\
  \ | 192.168.1.27 | 1323 | 0x8000005B | 0xA8EE |\n| 172.17.1.11 | 192.168.1.11 |\
  \ 1461 | 0x8000005B | 0x07AC |\n\n在这两个部分中，路由器链路状态部分表示 LSA 类型 1 消息，网络链路状态部分表示 LSA\
  \ 类型 2 消息。链路 ID 列代表路由器 ID 号。通告路由器列代表通告路由设备的路由器 ID。老化时间列表示链路状态信息已存在的时间。序列号列用于检测来自\
  \ OSPF 邻居的旧 LSA 或重复 LSA。校验和列是更新的校验和，以确保可靠性。链路计数列代表为路由设备检测到的接口数量。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_718_0.png)\n\
  \n**考试提示** 在 CCNA 考试中，请记住，**show ip ospf database** 命令显示从其他 OSPF 路由设备学习到的 OSPF 链路集合。\n\
  \n## show ip ospf interface 命令\n\n在逐接口的基础上，您的 OSPF 路由器会跟踪某个接口属于哪个区域，以及哪些邻居（如果有）连接到该接口。要查看此信息，请使用\
  \ **show ip ospf interface** 命令：\n\n```\nRouter# show ip ospf interface\nEthernet1\
  \ is up, line protocol is up\nInternet Address 172.16.255.1/24, Area 0\nProcess\
  \ ID 100, Router ID 172.16.255.1, Network Type BROADCAST, Cost: 10\nTransmit Delay\
  \ is 1 sec, State DROTHER, Priority 1\nDesignated Router id 172.16.255.11, Interface\
  \ address 172.16.255.11\nBackup Designated router id 172.16.255.10, Interface addr\
  \ 172.16.255.10\nTimer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit\
  \ 5\nHello due in 0:00:03\nNeighbor Count is 3, Adjacent neighbor count is 2\n \
  \ Adjacent with neighbor 172.16.255.10  (Backup Designated Router)\n  Adjacent with\
  \ neighbor 172.16.255.11  (Designated Router)\n```\n\n在此示例中，路由器 ID 为 172.16.255.1。其状态为\
  \ DROTHER，这意味着它*不是* DR 或 BDR。实际上，DR 是 172.16.255.11，BDR 是 172.16.255.10（这些是它们的路由器\
  \ ID）。还要注意，hello 和 dead 间隔计时器已设置为其默认值：分别为 10 秒和 40 秒。共有三个邻居具有两个邻接关系——请记住，邻接关系仅在路由器与\
  \ DR 和 BDR 之间建立，而不是与网段上的所有路由器建立。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_719_0.png)\n\
  \n**考试提示** **show ip ospf interface** 命令显示您的路由器 ID、DR 和 BDR 的 ID、hello 计时器（10 秒）、dead\
  \ 间隔（40 秒）、邻居数量以及邻接数量。请记住，要和另一台 OSPF 路由器成为邻居，hello 和 dead 间隔时间值必须匹配。在 CCNA 考试中，要能够识别此命令的输出。\n\
  \n## show ip ospf neighbor 命令\n\n要查看路由器的所有 OSPF 邻居，请使用 **show ip ospf neighbor**\
  \ 命令：\n\n```\nRouter# show ip ospf neighbor\n```\n\n| ID | 优先级 | 状态 | 失效时间 | 地址\
  \ | 接口 |\n| --- | --- | --- | --- | --- | --- |\n| 172.16.255.11 | 1 | FULL/DR |\
  \ 0:00:31 | 172.16.255.11 | Ethernet0 |\n| 172.16.255.10 | 1 | FULL/BDR | 0:00:33\
  \ | 172.16.255.10 | Ethernet0 |\n| 172.16.255.9 | 1 | 2WAY/DROTHER | 0:00:35 | 172.16.255.9\
  \ | Ethernet0 |\n| 172.16.254.2 | 1 | FULL/DR | 0:00:39 | 172.16.254.2 | Serial0.1\
  \ |\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_720_0.png)\n\n**考试提示** 在 CCNA 考试中请记住，**show\
  \ ip ospf neighbor** 命令会列出路由器的所有 OSPF 邻居、它们的 OSPF 状态、路由器 ID 以及邻居连接到的接口。\n\n在此示例中，有三台路由器连接到\
  \ Ethernet0：172.16.255.11 是 DR，172.16.255.10 是 BDR，而 172.16.255.9 是另一台 OSPF 路由器（DROTHER）。请注意，对于\
  \ DR 和 BDR，状态为 *完全*，这是符合预期的，因为此路由器和 DR/BDR 之间会相互共享路由信息。DROTHER 路由器处于 *双向* 状态，这表示该路由器是邻居，但此路由器和\
  \ DROTHER 路由器不会直接相互共享路由信息，因为另一台路由器*不是* DR 或 BDR。或者，您可以将邻居的 ID 添加到 **show ip ospf\
  \ neighbor** 命令中，以获取有关特定邻居的更多信息。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_720_1.png)\n\
  \n**警告** 如果 OSPF 路由器接口上的 MTU 大小不同，它们将不会成为邻居；请使用 **show interfaces** 或 **show ip\
  \ interfaces** 命令验证每个邻居的 MTU 大小。\n\n## debug ip ospf adj 命令\n\n要进行更详细的故障排除，您可以使用\
  \ **debug** 命令。如果要查看路由器与其他路由器建立邻接关系的过程，请使用 **debug ip ospf adj** 命令：\n\n```\nRouter#\
  \ debug ip ospf adj\n172.16.255.11 on Ethernet0, state 2WAY\nOSPF: end of Wait on\
  \ interface Ethernet0\nOSPF: DR/BDR election on Ethernet0\nOSPF: Elect BDR 172.16.255.10\n\
  OSPF: Elect DR 172.16.255.11\n        DR: 172.16.255.11 (Id) BDR: 172.16.255.10\
  \ (Id)\nOSPF: Send DBD to 172.16.255.11 on Ethernet0\n        seq 0x10DB opt 0x2\
  \ flag 0x7 len 32\nOSPF: Build router LSA for area 0, router ID 172.16.255.11\n\
  ```\n\n在此示例中，您可以看到 DR 和 BDR 的选举过程以及与 DR 共享链路（DBD）的过程。\n\n如果两台路由器错误配置了 OSPF 的认证类型，例如一台使用明文密码，另一台使用\
  \ MD5，您会通过之前的 **debug** 命令看到以下输出：\n\n```\nOSPF: Rcv pkt from 192.168.1.1, Serial1/0:\n\

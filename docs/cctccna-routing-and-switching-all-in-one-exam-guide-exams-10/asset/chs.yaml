  \ 3\n  VAN-SW1(config-vlan)#name Mkt\n  VAN-SW1(config-vlan)#exit\n  ```\n\n- 8.\
  \ 使用 do show vlan 命令显示 VLAN 列表。注意这两个额外的 VLAN。\n- 9. 通过控制台登录 VAN-SW2。\n- 10. 使用 show\

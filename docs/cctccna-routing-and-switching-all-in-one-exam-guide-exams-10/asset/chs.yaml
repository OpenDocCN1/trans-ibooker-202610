  \  |  |\n| 子网 4 |  |  |  |\n\n新子网掩码：________________\n\n## 有类与无类寻址\n\n第 4 章介绍了不同类别的\
  \ IP 地址。你在系统上使用的每个 IP 地址都属于三大主要类别之一：A 类、B 类或 C 类。这称为有类寻址。表 5-1 总结了三大主要地址类别。请注意，在\
  \ Octet Setup\n列中，N 表示网络 ID，H 表示主机 ID，用于标识地址的网络 ID 部分和主机 ID 部分。\n\n| 地址类别 | 第一个八位字节的值\
  \ | 八位字节设置 | 主机数 |\n|---|---|---|---|\n| A 类 | 1-127 | N.H.H.H | 16,777,214 |\n\
  | B 类 | 128-191 | N.N.H.H | 65,534 |\n| C 类 | 192-223 | N.N.N.H | 254 |\n\n表 5-1\
  \ 复习有类 IP 地址\n\n你所学到的关于不同地址类别的一切内容，包括网络 ID、主机 ID 和默认子网掩码，都基于有类寻址。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_230_0.png)\n\
  \n**考试提示** 对于考试，你需要记住有类 IP 寻址在八位字节处划分 IP 地址的网络 ID 部分和主机 ID 部分。例如，B 类地址使用前两个八位字节作为网络\
  \ ID，后两个八位字节作为主机 ID。\n\n## IP 子网零\n\n对于 Cisco CCT 和 CCNA 考试，你应该熟悉的另一个子网划分概念是 IP\
  \ 子网零。几年前，一些网络设备和协议在将网络划分为多个子网时无法使用创建的第一个和最后一个子网。这是因为一些旧的路由协议在路由器共享网络信息时没有将子网掩码信息与网络\
  \ ID 一起发送。这意味着如果网络被子网划分，例如划分为四个子网，当路由器共享对 192.168.1.0 网络的了解时，接收路由器无法知道它是被子网划分的还是整个\
  \ 192.168.1.0 网络。今天的路由协议会将子网掩码\n信息与路由一起发送——例如 192.168.1.0/26——因此可以确定这是四个子网划分网络中的第一个。\n\
  \nCisco 设备在对网络进行子网划分时可以使用第一个和最后一个子网，因为设备上配置的 **ip subnet-zero** 命令表示我们可以使用第一个和最后一个子网。如果命令更改为\
  \ **no ip subnet-zero**，我们将不允许在路由器上使用第一个和最后一个子网。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_231_0.png)\n\
  \n**注意** 你将在第 7 章学习一些 Cisco IOS 命令。\n\n## 可变长子网掩码\n\n我们迄今为止介绍的子网划分技术存在的一个问题是，我们创建的每个子网分配的\
  \ IP 地址数量相同。这有时会浪费地址，因为每个子网可能不需要相同数量的 IP 地址。例如，在图 5-3 中，你可以看到一个具有三个子网的网络。子网 1 有\
  \ 21 个主机，子网 2 有 2 个主机，子网 3 有 56 个主机。每个子网上的每个主机都需要子网内的一个 IP 地址，我们希望在节约地址的同时将网络划分为三个子网。\n\
  \n网络 ID：216.83.11.0\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_232_0.png)\n\n##\
  \ 图 5-3 VLSM 场景\n\n为实现此目标，请查看你的网络 ID（216.83.11.0），并首先处理较大的子网——在本例中为子网 3。子网 3 需要\
  \ 56 个主机，因此要计算子网信息，你需要确定需要多少个主机位来创建支持 56 个主机的子网。你可以使用以下公式：\n\n2^{host bits} − 2\
  \ = 支持的主机数\n\n根据该公式，我们需要 6 个主机位来支持子网 3 上的 56 个主机，如下所示：\n\n2^6 = 64 − 2 = 子网 3 支持\
  \ 62 个主机\n\n请记住，使用 6 个主机位会给你比所需多一些的主机地址，但你无法再降低，因为五个主机位仅支持 30（32 − 2）个主机。你减去 2 是因为每个子网有两个保留地址——网络\
  \ ID 和广播地址。还请注意，虽然此子网支持 62 个主机，但\n地址数量为 64——这称为块大小（或子网大小）。\n\n请记住，如果主机位有 6 位（第四个八位字节下面有六个\
  \ 0），则意味着剩下的两位是子网位（接下来以粗体突出显示）。有了这些信息，你现在可以按如下方式记录子网 3 的子网掩码：\n\n```\n11111111.11111111.11111111.11000000\
  \ = 255.255.255.192\n```\n\n现在要显示这是哪个地址范围，你可以在显示第四个八位字节中使用的不同 IP 地址的网格上绘制网络。请注意，子网\
  \ 3 将使用 64 个地址的块，但你只能使用其中 62 个（2 个保留）。这意味着数字 0–63 是子网 3 的地址，如图 5-4 所示。请注意，这记录为 216.83.11.0/26。/26\
  \ 表示子网掩码中有 26 位已启用，它控制此子网中使用的地址数量（64）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_233_0.png)\n\
  \n## 图 5-4 为最大 VLSM 子网绘制地址\n\n现在查看网络上主机数下一个最高的，你会看到子网 1 需要 21 个主机（或 21 个 IP 地址）。要计算此子网块，请使用以下公式：\n\
  \n```\n2^5 = 32 − 2 = 30 hosts supported on subnet 1\n```\n\n30 个主机比所需的 21 个多一些，但这是可以的，如前例所述。有了这些信息，你现在可以按如下方式记录子网\
  \ 1 的子网掩码：\n\n```\n11111111.11111111.11111111.11100000 = 255.255.255.224\n```\n\n\
  现在在显示第四个八位字节中不同 IP 的网格上绘制子网 1，如图 5-5 所示。请记住，子网 1 将使用 32 个地址的块，但其中两个不可用。因为子网 3 使用地址\
  \ 0–63，子网 1 将从 64 开始并持续 32 个地址，将达到 95（64 – 95 = 32 地址块大小）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_234_0.png)\n\
  \n## 图 5-5 为下一个 VLSM 子网绘制地址\n\n这意味着数字 64–95 是子网 1 的地址，如图 5-5 所示。请注意，这记录为 216.83.11.64/27。/27\
  \ 表示子网掩码中有 27 位已启用，它控制此子网中使用的地址数量（32）。\n\n我们规划网格要添加的最后一个子网是子网 2。因为我们只需要此子网上的两个 IP\
  \ 地址（WAN 链路的两侧各一个），我们需要使用以下公式计算两个主机：\n\n```\n2² = 4 − 2 = 2 hosts supported on subnet\
  \ 2\n```\n\n这意味着我们只需要两个主机位来支持只需要两个 IP 地址的子网。这给出了以下二进制 IP 配置：\n\n```\n11111111.11111111.11111111.11111100\
  \ = 255.255.255.252\n```\n\n请注意，块大小为四（即使只有两个可用地址）。这意味着我们将使用下一个地址 96–99 作为此子网第四个八位字节中的地址（见图\
  \ 5-6）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_235_0.png)\n\n图 5-6 为 WAN 链路绘制\
  \ VLSM 地址\n\n请注意，这记录为 216.83.11.96/30。/30 表示子网掩码中有 30 位已启用，它控制此子网中使用的地址数量，在本例中为四（块大小）。\n\
  \n好消息是我们已经为三个子网规划了 IP 地址方案，并且看看未来网络更改仍可用的地址有多少！地址 100–255 仍可用！现在这就是节约 IP 地址并完成工作！\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_235_1.png)\n\n提示 我已将块指定为连续地址以便于视觉展示。在现实世界中，你可能希望将其稍微分散一些，以便在无需更改所有地址块的情况下适应增长。\n\
  \n## 练习 5-3：在网络上使用 VLSM\n\n在本练习中，你将根据图 5-7 所示的网络图计算每个不同网络段的 VLSM。你需要进行子网划分的网络地址是\
  \ 200.45.6.0。\n\n记录每个网络段的子网信息：\n\n子网 #1：________________\n\n\n\n子网 #2：________________\n\
  \n子网 #3：________________\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_236_0.png)\n\
  \n图 5-7 VLSM 练习的网络图\n\n## 路由汇总\n\n路由汇总是指在路由表中将一组连续的网络号码作为单个汇总或聚合路由进行通告的能力。路由汇总使您能够将子网划分的路由汇总回类边界。例如，如果您使用网络\
  \ ID 192.168.1.0/24 并将其子网划分为 192.168.1.0/26，从而得到四个网络，您可以在路由表中汇总这些子网并将其作为单个 C 类网络号\
  \ 192.168.1.0/24 进行通告，如图 5-8 所示。在此示例中，路由更新中的路由条目从四个减少到一个。请注意，在此示例中，同一个类网络 192.168.1.0\
  \ 有两个关联的掩码：255.255.255.192（用 /26 标识）和 255.255.255.0（用 /24 标识）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_237_0.png)\n\
  \n图 5-8 简单的路由汇总示例\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_237_1.png)\n\n注意 这不是关于路由汇总的完整讨论。我们尚未学习路由，但我想介绍路由汇总和\
  \ CIDR 的主题，以便您熟悉这些术语。您将在第 11 章和第 12 章学习路由。\n\n### 汇总的优势\n\n汇总使您能够通过提供以下优势来创建更高效的路由环境：\n\
  \n- 它减少路由表的大小，减少内存和处理需求。\n- 它减少路由更新的大小，减少带宽需求。\n- 它防止路由表不稳定。\n\n路由汇总也有一些缺点：\n\n\
  - 汇总路由可能包含未使用的子网，并且路由器可能会收到针对未使用路由的数据包，尽管它们在数学上属于汇总路由。在这种情况下，路由器将丢弃这些数据包。\n- 路由器可能会为路由选择不同的路径，因为该路径比汇总路由更具体。\n\
  \n目前不必太担心这些路由问题。我提出它们只是为了提供完整的优缺点讨论。本章更多地关注数字背后的设计，因此让我们谈谈路由汇总是如何执行的。\n\n要计算汇总路由，您首先列出每个网络\
  \ ID，然后将其转换为二进制形式。我们的四个子网可以列出如下：\n\n```\n192.168.1.0/26      11000000.10101000.00000001.00000000\n\
  192.168.1.64/26     11000000.10101000.00000001.01000000\n192.168.1.128/26    11000000.10101000.00000001.10000000\n\
  192.168.1.192/26    11000000.10101000.00000001.11000000\n```\n\n接下来，您从左到右识别这四个网络\
  \ ID 中有多少位是相同的。这就是您的汇总路由：\n\n```\n192.168.1.0/26      11000000.10101000.00000001.00000000\n\
  192.168.1.64/26     11000000.10101000.00000001.01000000\n192.168.1.128/26    11000000.10101000.00000001.10000000\n\
  192.168.1.192/26    11000000.10101000.00000001.11000000\n```\n\n请注意，在第四个八位组的最初两位中，位开始为每个子网而变化。在该点之前的所有位都是创建汇总路由的公共位。当您将公共位转换回十进制时，您将得到汇总路由\
  \ 192.168.1.0/24。\n\n## 无类域间路由（CIDR）\n\n无类域间路由（CIDR），在 RFC 2050 中指定，是 VLSM 和路由汇总的扩展。使用\
  \ VLSM，您可以将子网汇总回 A 类、B 类或 C 类网络边界。回顾我们的示例，如果您有一个 C 类网络 192.168.1.0/24 并使用 26 位掩码对其进行子网划分，您就创建了四个子网。使用路由汇总，您可以将这四个子网汇总回\
  \ 192.168.1.0/24。CIDR 更进一步，使您能够汇总一组连续的 A 类、B 类和/或 C 类网络号。这种做法通常被称为 *超网*。当今的无类协议支持超网。然而，它最常由使用边界网关协议（BGP）进行路由的互联网服务提供商（ISP）配置。\n\
  \n图 5-9 显示了 CIDR 的一个示例。在此示例中，路由器连接到四个 C 类网络：192.168.0.0/24、192.168.1.0/24、192.168.2.0/24、192.168.3.0/24。它将这些路由汇总为\
  \ 192.168.0.0/22。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_239_0.png)\n\n图 5-9\
  \ CIDR 示例\n\n让我们分解 CIDR 是如何执行的。如我所说，CIDR 是 VLSM 和路由汇总的扩展，因此汇总这些 C 类网络的技术与路由汇总相同。查看网络地址的二进制形式，您可以识别公共位以确定汇总网络。查看下面的二进制，您可以看到四个网络的前两个八位组中的所有位都是相同的。在第三个八位组中，前\
  \ 6 位也是相同的，总共 22 位对所有网络都是公共的（因此这就是我们的汇总路由）。请注意此次汇总的子网掩码：255.255.252.0。该掩码连同起始网络\
  \ 192.168.0.0 包括从 192.168.0.0 到 192.168.3.255 的地址，这些地址位于该路由器后面。\n\n```\n192.168.1.0/24\
  \      11000000.10101000.00000001.00000000\n192.168.2.0/24      11000000.10101000.00000010.01000000\n\
  192.168.3.0/24      11000000.10101000.00000011.10000000\n192.168.4.0/24      11000000.10101000.00000100.11000000\n\
  ```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_240_0.png)\n\n**考试提示** 对于考试请记住 CIDR\
  \ 与 VLSM 相似，即 CIDR 使您能够将多个连续的类网络汇总在一起，例如多个 C 类网络。这也称为超网。\n\n因为需要一种标准方法来指示 IP 地址中网络位有多少位，所以创建了\
  \ *CIDR 表示法*。使用 CIDR 表示法，您指定 IP 地址和正斜杠（/），后跟构成网络 ID 的位数。例如，10.0.0.0/8 指定网络 ID 是前八位（这意味着子网掩码为\
  \ 255.0.0.0）。同样，131.107.64.0/18 表示该网络 ID 是对 B 类地址进行子网划分的结果。\n\n需要注意的是，CIDR 表示法已在许多配置对话框和命令中变得司空见惯，在这些对话框和命令中您必须输入网络\
  \ ID 和子网掩码。\n\n## 练习 5-4：额外的子网划分实践\n\n因为子网划分是思科 CCNA 认证考试中如此重要的主题，所以尽可能多地练习它很重要。在本次额外练习中，您将练习子网划分\
  \ A 类、B 类和 C 类地址。\n\n### 任务 1：子网划分一个 B 类网络\n\n您有一个 B 类网络 ID 为 150.87.0.0，并且需要将此网络划分为\

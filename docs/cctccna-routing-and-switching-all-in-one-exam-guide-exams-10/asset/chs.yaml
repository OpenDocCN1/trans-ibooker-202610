  Layer 3 源地址：________________\nLayer 3 目标地址：________________\n\n### 章节回顾\n\n在本章中你学习了\
  \ TCP/IP 的基础知识以及该协议为何在当今网络市场中如此常见。以下列表总结了你所学的内容：\n\n- IP 地址和子网掩码是最重要的配置设置，必须正确指定才能在基于\
  \ TCP/IP 的网络上进行通信。接下来重要的是默认网关，它指定在本地网络外通信时将数据包路由到的位置。\n- 动态主机配置协议（DHCP）会自动为工作站配置正确的\
  \ TCP/IP 设置，使你免于手动配置每个工作站的负担。\n- TCP/IP 地址涉及对 IP 地址、子网掩码、网络类别和特殊保留地址的深入了解。（你应该为考试记住每个网络类别。）\n\
  - 与你的 CCT 和 CCNA 考试相关的 TCP/IP 最重要部分是 TCP/IP 配置概念。你需要这些来配置 TCP/IP 工作站。这些概念包括 IP 地址、子网掩码和默认网关。\n\
  \n牢固掌握本章介绍的材料，你在考试中不会遇到任何 TCP/IP 相关问题的问题。不仅这里介绍的材料对每项考试都很重要，而且在你通过考试并继续从事网络专业人员职业后也很重要。\n\
  \n\n\n## 快速复习\n\n### TCP/IP 基础\n- TCP/IP 地址是 32 位地址。\n- IP 地址是分配给系统的一个唯一值，用于在网络上标识该系统。\n\
  - 子网掩码用于确定 IP 地址的网络 ID 部分。\n- 网络 ID 用于确定目标系统是否在同一网络上。如果两个系统的网络 ID 相同，则它们位于同一网络上。\n\
  - 主机 ID 在网络内标识系统。\n- 默认网关指的是路由器的 IP 地址，用于将数据从本地网络发送出去。\n\n### TCP/IP 地址\n- A 类地址的首个八位组范围为\
  \ 0 到 127，默认子网掩码为 255.0.0.0。\n- B 类地址的首个八位组范围为 128 到 191，默认子网掩码为 255.255.0.0。\n\
  - C 类地址的首个八位组范围为 192 到 223，默认子网掩码为 255.255.255.0。\n- D 类地址用于多播。\n- 应用程序或进程使用 TCP/IP\
  \ 端口在客户端和服务器计算机之间进行通信。\n- 最流行，因此最有可能出现在考试中的选项是 FTP 端口（20 和 21）、SMTP 端口（25）、HTTP\
  \ 端口（80）和 HTTPS 端口（443）。\n- 配置 TCP/IP 有两种选择：手动配置或使用 DHCP 服务器。\n- DHCP 负责自动为系统和设备分配\
  \ IP 地址，并减轻网络管理负担。\n\n### 配置 IP 地址设置\n- 你可以在 Windows 中使用 **ipconfig** 命令来验证你的 TCP/IP\
  \ 设置。\n- 你可以在 Linux 中使用 **ifconfig** 命令或 **nmcli** 命令来验证你的 TCP/IP 设置，具体取决于 Linux\
  \ 的发行版和版本。\n- 你可以在 macOS 上使用 **ifconfig** 命令来验证你的 TCP/IP 地址。\n\n### 理解通信路径\n- 请记住，在通信过程中，源\
  \ MAC 地址和目标 MAC 地址会在每一步发生变化。\n- 请记住，在数据包被传递到其目标的整个过程中，源 IP 地址和目标 IP 地址保持不变。\n\n\

  \ 密码\n\n4. 交换机的默认网关地址在哪种配置模式下配置？\nA. 接口\nB. 线路\nC. 全局\nD. 端口\n\n5. 默认情况下，IP 地址不会分配给交换机。在什么情况下你可能需要给交换机分配\

  \ Internet 上路由的 IPv6 私有地址？\n- A. 全球单播\n- B. 多播\n- C. 环回\n- D. 唯一本地\n\n## 性能题\n\n\
  1. 观察以下 IPv6 网络，您会使用哪些命令从路由器 R3 配置到 R1 上 Loopback 接口的主路由，并使用 R2 路径作为备用路由？\n\n从左侧可用命令中，将相应命令连线到路由器\
  \ R3 的两个配置位置（在实际考试中，针对此类题目，您将执行拖放操作）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_868_0.png)\n\
  \n### 可用命令\n\n- ipv6 route 2000::1/128 2014::1\n- ipv6 route 2000::1/128 2015::1\n\
  - ipv6 route 2000::1/128 2014::5 10\n- ipv6 route 2000::1/128 2024::2 10\n- ipv6\
  \ route 2000::1/128 2015::2\n- ipv6 route 2000::1/128 2024::5 10\n\n### 路由器 R3 的期望配置\n\
  \nCommand 1:\n\nCommand 2:\n\n## 答案\n\n1. **D.** 要启用 IPv6 的 OSPF，您必须先启用 IPv6 路由，然后启动\
  \ OSPFv3 路由进程并为其指定 ID。接着为路由器分配路由器 ID，最后为每个所需接口配置 OSPF。\n\n2. **B, C。**2000::57 和\
  \ 2000:FFEE:7878:1111:1:2:7:E 是有效的 IPv6 单播地址。作为参考，**A** 不正确，因为它包含多个 :: 表示法，因此无效。选项\
  \ **D** 的问题在于其接口 ID 值全为 0，这也是无效的。\n\n3. **D。**任播是一种一对最近点类型的地址。\n\n4. **A。**全球单播地址的前三位始终设置为\
  \ 001，这意味着它们总是以 2 (0010) 或 3 (0011) 开头。因此，2001:FFEE:7880:: 是正确的。\n\n5. **A, D。**IPv4\
  \ 的 ARP 和 IGMP 在 IPv6 中已被弃用；这些功能现在由 ICMPv6 执行。\n\n6. **D。**IP Helper 是使路由器能够将 DHCP\
  \ solicit 消息转发到远程 DHCP 服务器的功能。作为参考，**A** (DHCP solicit) 是 DHCP 客户端用于获取其寻址信息生成的消息。**B**\
  \ (无状态自动配置) 是客户端在未配置 DHCP 但仍希望动态获取寻址信息时执行的操作。\n\n7. **B。**RIPng 使用多播地址 FF02::9。\n\
  \n8. 双协议栈：设备上同时运行两种协议栈。6to4 隧道：IPv6 数据包被封装在 IPv4 有效载荷中。ISATAP：虚拟链路连接 IPv6 站点。Teredo\
  \ 隧道：主机到主机隧道。\n\n9. **C。** **ipv6 unicast-routing** 命令在全局范围内启用 IPv6，并且必须是在路由器上执行的第一个\
  \ IPv6 命令。\n\n10. **C。**使用 **ipv6 address autoconfig** 命令自动为地址的主机 ID 部分分配修改后的 EUI-64\
  \ 格式。\n\n11. **A。** **ipv6 rip tag enable** 命令在接口上启用 RIPng。\n\n12. **D。** **unique-local**\
  \ IPv6 地址类型是一种私有地址，类似于 10.0.0.0/8 IPv4 私有地址类型。唯一本地地址也称为站点本地地址，其地址通常以 FE80 开头。\n\n\
  ## 性能题答案\n\n1. 这看起来像是一个复杂的问题，但实际上只是一个简单的路由问题，它使用您在本章中学到的 IPv6 知识，加上第 11 章中的静态路由知识。在此示例中，您需要向\
  \ 2000::1/128 地址添加两条路由。第一条路由必须使用到 R1 的直接路径，因此您指定静态路由发送到 2015::1，而备份路由则使用管理距离设置为更高值（在此示例中为\
  \ 10）的静态浮动路由。备份路由将数据发送到 R2，因此您必须指向 R2 上最接近 R3 的接口。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_870_0.png)\n\
  \n### 可用命令\n\n- ipv6 route 2000::1/128 2014::1\n- ipv6 route 2000::1/128 2014::5\
  \ 10\n- ipv6 route 2000::1/128 2024::2 10\n- ipv6 route 2000::1/128 2015::2\n\n\

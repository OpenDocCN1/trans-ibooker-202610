  您了解了基本服务集 (BSS) 和扩展服务集 (ESS) 之间的区别，以及配置 ESS 的三个核心要求：多个具有相同 SSID 的接入点、不同信道以及至少 10%
  的重叠覆盖区域。您还了解了不同的无线标准，例如 802.11g、802.11n 和 802.11ac。


  然后，您阅读了不同的无线安全协议，以及应在无线网络上使用 WPA2 或 WPA3（如果可能）来加密无线通信。最后，您了解了 Cisco 无线架构，例如自治架构（其中每个接入点单独配置）或
  Split-MAC 架构（涉及使用无线 LAN 控制器从中心位置配置所有接入点）。


  ## 快速复习


  ### 无线网络简介


  - 无线客户端连接到无线接入点 (AP) 以访问网络。无线通信使用无线电波传输数据。

  - 在企业环境中，您可以使用无线 LAN 控制器 (WLC) 集中管理多个 AP。AP 和 WLC 使用名为 CAPWAP 的专用隧道进行通信。

  - BSS 是具有单个 AP 的无线网络，而 ESS 是具有多个 AP 以覆盖更大区域的无线网络。使用 ESS 时，每个 AP 使用相同的 SSID，但使用不同信道。

  - 802.11b 和 802.11g 无线标准在 2.4 GHz 频率上运行。802.11b 标准以 11 Mbps 运行，而 802.11g 以 54 Mbps
  运行。802.11n 标准可在 2.4 GHz 或 5 GHz 频率上运行，而 802.11ac 在 5 GHz 频率上运行。802.11n 标准提供最高 600
  Mbps 的传输速率，而 802.11ac 可提供 1 Gbps。

  - WEP 安全协议使用 RC4 作为加密算法，WPA 使用 TKIP，WPA2 使用 AES。您可以在企业模式下运行 WPA/WPA2/WPA3，这意味着您将
  AP 配置为使用诸如 TACACS+ 或 RADIUS 之类的身份验证服务。


  ### Cisco 无线架构


  - 自治架构涉及单独配置每个 AP。Split-MAC 架构使用 WLC 从中心位置配置所有 AP。使用基于云的架构时，WLC 位于云中。

  - 将 AP 配置为 FlexConnect 模式，以使轻量级接入点 (LAP) 能够直接在客户端和 LAN 之间传递流量，并在 CAPWAP 失败时仍允许 AP
  功能正常。

  - CAPWAP 是一个专用隧道，用于在 LAP 和 WLC 之间传输通信。

  - CAPWAP 隧道中有两个信道：控制信道和数据信道。控制信道传输控制信息，例如命令，并使用 UDP 5246。数据信道在 LAP 和 WLC 之间传输所有其他信息，并使用
  UDP 5247。



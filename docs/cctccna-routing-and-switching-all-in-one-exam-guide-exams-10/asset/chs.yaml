  ```\n\n请注意，您也可以使用 write 命令，它不会提示您确认保存操作的目标。\n\n8. 退出并在您连接到控制台端口时验证每个密码；然后进入特权 EXEC\
  \ 模式。请注意，您输入的第一个密码将是控制台密码，您输入的第二个密码是 secret 密码，因为它优先于 enable 密码。只有在未设置 enable secret\
  \ 时才会使用 enable 密码。\n\n9. 现在在路由器 LA-R1 上配置密码。确保您已通过控制台连接到 LA-R1。\n\n10. 在 LA-R1 上配置控制台密码\
  \ LAconpass。\n\n11. 在 LA-R1 上配置 aux 密码 LAauxpass。\n\n12. 在 LA-R1 上配置 VTY 密码 LAtelnetpass。\n\
  \n13. 创建 enable 密码 LAenablepass。\n\n- 14. 创建 enable secret 为 *LAenablesecret*。\n\
  - 15. 使用 **write** 命令将配置更改保存到 NVRAM。\n- 16. 退出并在您连接到控制台端口时验证每个密码；然后进入特权 EXEC 模式。请注意，您输入的第一个密码将是控制台密码，您输入的第二个密码是\
  \ secret 密码，因为它优先于 enable 密码。只有在未设置 enable secret 时才会使用 enable 密码。\n- 17. 保持设备运行以进行下一次练习。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_350_0.png)\n\n**视频 7.07。** The digital\
  \ resources that accompany this book contain a multimedia demonstration of encrypting\
  \ passwords within the configuration file.\n\n## 配置横幅\n\nBanners provide a way for\
  \ you to display messages to administrators when they connect to your Cisco device.\
  \ There are different types of banners, such as message-of-the-day (MOTD) and login\
  \ banners, which differ in the timing of when they appear. The following is a list\
  \ of some of the common types of banners that can be set:\n\n- **MOTD banner** The\
  \ MOTD banner appears before the administrator is asked to log in and is used to\
  \ display a temporary message that may change from day to day.\n- **Login banner**\
  \ The login banner displays before the administrator logs in, but after the MOTD\
  \ banner appears, and is used to display a more permanent message to the administrator.\n\
  - **Exec banner** The exec banner is used to display a message after the administrator\
  \ authenticates to the system and after he enters user EXEC mode.\n\n要查看 Cisco 设备上支持的横幅列表，请使用\
  \ **banner** 命令的帮助功能：\n\n```\nSwitch(config)#banner ?\n  LINE            c banner-text\
  \ c, where 'c' is a delimiting character\n  exec            Set EXEC process creation\
  \ banner\n  incoming        Set incoming terminal line banner\n  login         \
  \  Set login banner\n  motd            Set Message of the Day banner\n  prompt-timeout\
  \  Set Message for login authentication timeout\n  slip-ppp        Set Message for\
  \ SLIP/PPP\n```\n\nThe setup of each of the banners is similar, so let’s take a\
  \ look at setting a few of the common ones.\n\n### MOTD 横幅\n\nYou can set up a MOTD\
  \ banner on your IOS device that will display a message *之前* the administrator is\
  \ asked to log in to the device (before the console, aux, or VTY passwords). Use\
  \ the **banner motd** command to create the MOTD banner:\n\n```\nIOS(config)# banner\
  \ motd delimiting_char your_banner end_with_delimiting_char\nIOS(config)#\n```\n\
  \nAfter the **banner motd** command, you must enter the delimiting character, which\
  \ is used to signify the beginning and ending of the banner—it cannot appear in\
  \ the actual banner. After you enter the delimiting character, when the IOS parser\
  \ sees this character later in your message text, IOS terminates the banner and\
  \ returns you to the CLI prompt. One nice feature of the banner is that when you\
  \ press the ENTER key, it doesn’t terminate the banner, so you can have banners\
  \ that span multiple lines of text. Whenever you have completed your banner, type\
  \ the delimiting character to end the command.\n\n以下是设置 MOTD 横幅的示例：\n\n```\nIOS(config)#\
  \ banner motd $\nLong weekend upcoming. We will be performing maintenance.\nBack\
  \ up all your configuration.\n$\nIOS(config)#\n```\n\n在此示例中，横幅跨越多行，且分隔字符为美元符号（$）。横幅不必跨越多行，但也可以放在单行中，如以下示例所示：\n\
  \n```\nIOS(config)# banner motd 'Keep Out!'\nIOS(config)#\n```\n\n在此示例中，单引号（'）是分隔字符。创建\
  \ MOTD 横幅后，通过断开与设备的连接然后重新连接来测试它。你应该会在被要求输入设备密码之前看到 MOTD 横幅出现。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_352_0.png)\n\
  \n考试提示 预计你需要知道 banner motd 命令会在管理员对设备进行身份验证之前显示横幅。\n\n## 登录横幅\n\n你也可以创建登录横幅。与 MOTD\
  \ 横幅类似，登录横幅也在管理员登录之前出现，但它在 MOTD 横幅文本出现之后出现。登录横幅设计为更永久性的消息，通常不会经常更改。要创建登录横幅，请将 banner\
  \ motd 命令中的 motd 参数替换为 login。以下是设置登录横幅的示例：\n\n```\nIOS(config)# banner login $\n\
  This is a private system and only authorized individuals\n        are allowed!\n\
  All others will be prosecuted to the fullest extent of the law!\n$\nIOS(config)#\n\
  ```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_353_0.png)\n\n注意 不应在横幅中使用 *welcome*\
  \ 或任何类型的欢迎问候语；使用此类词语可能被误解，并可能使攻击者通过引用登录横幅中的欢迎问候语来为其行为辩护。\n\n## Exec 横幅\n\n使用 exec\
  \ 横幅在管理员使用其控制台或 aux 密码对设备进行身份验证后、但在进入用户 EXEC 模式之前显示一条消息。你使用 **exec** 关键字配置 exec\
  \ 横幅：\n\n```\nIOS(config)# banner exec $\nRemember to save your changes with the\
  \ write command.\nPlease ensure all changes are authorized by your team lead.\n\
  $\nIOS(config)#\n```\n\n## 练习 7-3：设置横幅\n\n在本练习中，你将继续进行上一个练习的配置并为两个路由器添加横幅。你将配置 MOTD\
  \ 横幅、登录横幅和 exec 横幅。参见图 7-4。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_354_0.png)\n\
  \n## 图 7-4 练习的网络拓扑\n\n1. 确保你已通过控制台连接到 VAN-R1。\n\n2. 要在 VAN-R1 上配置 MOTD 横幅，请输入以下命令：\n\
  \n```\nVAN-R1>enable\nVAN-R1#config term\nVAN-R1(config)# banner motd $\nLong weekend\
  \ upcoming.  We will be performing maintenance.\nBack up all your configuration.\n\
  $\nVAN-R1(config)#\n```\n\n3. 要在 VAN-R1 上配置登录横幅，请输入以下命令：\n\n```\nVAN-R1(config)#\
  \ banner login $\nThis is a private system and only authorized individuals\n  are\
  \ allowed!\nAll others will be prosecuted to the fullest extent of the law!\n$\n\
  VAN-R1(config)#\n```\n\n4. 要在 VAN-R1 上配置 exec 横幅，请输入以下命令：\n5. 使用 write 命令保存更改。\n\
  6. 要测试横幅，请退出并断开与设备的连接。重新连接并观察横幅出现的时机。\n7. 连接到 LA-R1 并在 LA-R1 上配置三个横幅。\n8. 使用 write\
  \ 命令将 LA-R1 上的更改保存到 NVRAM。\n9. 断开与 LA-R1 的连接并重新连接以测试横幅。\n10. 保持路由器运行以进行下一个练习。\n\n\
  ```\nVAN-R1(config)# banner exec $\nRemember to save your changes with the write\
  \ command.\n$\nVAN-R1(config)#\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_355_0.png)\n\
  \n视频 7.08. 随书附带的数字资源包含配置 MOTD 横幅的多媒体演示。\n\n## IOS 操作和验证\n\n配置完 IOS 设备后，有许多命令可用于检查和排除配置故障。本节介绍一些基本的\
  \ show 命令，可帮助你验证和排除 Cisco 设备的配置故障。后续章节将讨论可用于帮助排除更复杂问题的其他命令。\n\n## Show 和 Debug 命令概述\n\
  \n你可以使用两个基本命令来排除 IOS 设备上的问题：\n\n- **show** 对特定进程进行快照并显示其信息；显示的信息是静态的，除非重新执行命令，否则不会自行刷新（你可以使用命令行历史记录功能来实现）。\n\
  - **debug** 显示特定进程当前如何运行，显示信息基本实时发生。\n\n## 常用 Show 命令\n\n使用 **show** 命令可快速了解 IOS\
  \ 设备的配置情况（RAM 中的配置、路由协议或生成树协议 [STP]）或进程的当前状态（如接口、路由表或端口地址表）。不幸的是，在某些情况下，**show**\
  \ 命令可能无法提供足够的信息来正确诊断和修复问题。\n\n以下是一些你应该尝试的常用 **show** 命令：\n\n- **show ip interface\
  \ brief** 列出设备上的所有接口并快速查看其状态；指示接口是否已启动并运行以及分配给接口的 IP 地址\n- **show interfaces** 列出所有接口和接口的详细规范\n\
  - **show interfaces g0/0** 列出特定接口的详细信息\n- **show controllers s0/3/0** 列出串行接口等信息，如\
  \ DCE 和 DTE 详细信息\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_356_0.png)\n\n**视频**\
  \ 7.09. 随书附带的数字资源包含 Cisco 考试中应了解的常用 **show** 命令的多媒体演示。\n\n## 常用 Debug 命令\n\n另一方面，**debug**\
  \ 命令显示进程当前如何运行或表现，例如邻居路由器接收到的路由更新内容，因此通常在排除困难问题时更有用。**debug** 命令的主要缺点是它们在 IOS 设备上占用资源较多，应谨慎使用。\n\
  \n## 运行和启动配置\n\n配置 Cisco 设备时，配置设置存储在配置文件中。默认情况下，Cisco 设备上可能存在两种配置：\n\n- **running-config**\
  \ 该文件包含在 IOS 设备 RAM 中运行的实际配置（设备当前使用的设置）。\n- **startup-config** 该文件包含 Cisco 设备非易失性\
  \ RAM（NVRAM）中保存的配置设置，并在启动时应用。\n\n配置文件可以驻留在许多位置，包括 RAM、NVRAM 或简单文件传输协议（TFTP）或 FTP\
  \ 服务器等。当你通过配置模式输入命令来更改 IOS 的配置时，这些更改会写入 RAM（running-config）。然后可以将这些更改保存到 NVRAM（startup-config），这是一种\
  \ *static* 形式的内存；当 Cisco 设备关闭时，NVRAM 的内容不会被擦除，并在加电时可用。IOS 设备不会自动将 RAM 中的配置文件保存到\
  \ NVRAM；必须 *manually* 执行。配置更改也可以使用 TFTP、FTP 和安全复制协议（SCP）保存到外部服务器——不过，这要求你配置 IP\n\
  \n以下各节讨论如何查看 IOS 设备的配置文件以及如何在 IOS 设备本地备份和恢复配置文件。\n\n## 查看配置\n\n要检查 IOS 设备上的活动或运行配置，请使用\
  \ **show running-config** 命令。你必须处于特权 EXEC 模式才能执行此命令。以下是 Cisco 路由器上此命令的示例：\n\n```\n\
  Router# show running-config\nBuilding configuration...\nCurrent configuration:\n\
  !\nversion 12.0\nno service udp-small-servers\nno service tcp-small-servers\n!\n\
  hostname Router\n.\n.\n.\n```\n\n请注意此示例中对 **Building configuration...** 和 **Current\
  \ configuration** 的引用。这两者都指的是 RAM 中的配置。\n\n## 保存更改\n\n启动配置文件存储在交换机和路由器的 NVRAM 中。当\
  \ IOS 设备启动时，IOS 会从 NVRAM 加载配置并将其置于 RAM 中。启动设备后，你可以进行配置更改，这些更改存储在 RAM（running-config）中。为了使该配置在设备重新启动期间保留，你需要将新更改保存到\
  \ NVRAM（startup-config）。要将活动配置保存到 NVRAM，必须从特权 EXEC 模式执行 **copy running-config startup-config**\
  \ 命令。执行此命令后，IOS 设备会将 RAM 中的活动配置\n\nsaves it to NVRAM. In this process, the old configuration\
  \ file in NVRAM is overwritten.\n\nHere is an example of this command:\n\n```\n\
  IOS# copy running-config startup-config\nDestination filename [startup-config]?\n\
  Building configuration...\n[OK]\nIOS#\n```\n\nWhen executing this command, you are\
  \ asked for a filename for the configuration file—the default is *startup-config*.\
  \ This is the filename IOS looks for when booting up. You can change the name for\
  \ backup revisioning purposes (different versions of the backed-up configuration),\
  \ but make sure that your most current configuration is saved as startup-config.\
  \ On the IOS device, you can view the saved configuration in NVRAM with the **show\
  \ startup-config** privileged EXEC mode command.\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_359_0.png)\n\
  \n**提示** A shortcut to save IOS’s configuration to NVRAM is the **write memory**\
  \ command: you can abbreviate this to just **write**. I use **write** all the time\
  \ to save my changes quickly to the startup configuration. Note that **write memory**\
  \ is a deprecated command, so although it currently works, it will eventually be\
  \ removed as a command in future versions of IOS.\n\nTo see the configuration file\
  \ stored in NVRAM, use this command:\n\n```\nRouter# show startup-config\nUsing\
  \ 4224 out of 65536 bytes\n!\nversion 11.3\nno service udp-small-servers\nno service\
  \ tcp-small-servers\n!\nhostname Router\n.\n.\n.\n```\n\nOne difference between\
  \ this output and that from the show running-config command is the first line of\
  \ output: Using 4224 out of 65536 bytes refers to the amount of NVRAM currently\
  \ used by the saved configuration file.\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_360_0.png)\n\
  \n**考试提示** You should know that IOS devices do not automatically save configuration\
  \ changes. You must manually enter the **copy running-config startup-config** command\
  \ or the **write** command. This command backs up your configuration to NVRAM. Also\
  \ remember that any time you want to examine or manipulate a configuration, you\
  \ must be in privileged EXEC mode. If you make configuration changes to a Cisco\
  \ router and forget to save the configuration to NVRAM, you will lose those changes\
  \ when you reboot the device.\n\n## 恢复您的配置\n\nTo revert your configuration from\
  \ NVRAM to RAM, use the **copy startup-config running-config** command from privileged\
  \ EXEC mode:\n\n```\nIOS# copy startup-config running-config\nDestination filename\
  \ [running-config]?\n947 bytes copied in 0.320 secs (2959 bytes/sec)\nIOS#\n```\n\
  \nOne important thing to note is that when you take a configuration file from any\
  \ location and copy it to RAM, IOS uses a merge process to load in the configuration\
  \ file from the source, overwriting matching commands in RAM and adding new commands\
  \ that don’t exist in RAM, but not deleting commands that don’t exist in NVRAM but\
  \ do exist in RAM.\n\n## 设备版本信息\n\nIf you want to see general information about\
  \ your IOS device—its model number, the types of interfaces, the different kinds\
  \ and amounts of memory, its software version, where IOS is located and loaded and\
  \ its configuration file, as well as the configuration settings—you can use the\
  \ **show version** command.\n\nHere is an example of this command on a Cisco router:\n\
  \n```\nRouter> show version\nCisco Internetwork Operating System Software\nIOS (tm)\
  \ 3600 Software (C3640-JS-M), Version 12.0(3c), RELEASE SOFTWARE (fc1)\nCopyright\
  \ (c) 1986-1999 by cisco Systems, Inc.\nCompiled Tue 13-Apr-99 07:39 by phanguye\n\
  Image text-base: 0x60008918, data-base: 0x60BDC000\n\nROM: System Bootstrap, Version\
  \ 11.1(20)AA2, EARLY DEPLOYMENT\nRELEASE SOFTWARE (fc1)\n\nRouter uptime is 2 days,\
  \ 11 hours, 40 minutes\nSystem restarted by power-on\nSystem image file is \"flash:c3640-js-mz.120-3c.bin\"\
  \n\ncisco 3640 (R4700) processor (revision 0x00) with 49152K/16384K\nbytes of memory.\n\
  .\n.\n1 FastEthernet/IEEE 802.3 interface(s)\n8 Low-speed serial(sync/async) network\
  \ interface(s)\n1 Channelized T1/PRI port(s)\nDRAM configuration is 64 bits wide\
  \ with parity disabled.\n125K bytes of non-volatile configuration memory.\n32768K\
  \ bytes of processor board System flash (Read/Write)\n\nConfiguration register is\
  \ 0x2102\n```\n\nIn the middle of the output is **System restarted** followed by\
  \ how the IOS device was last started. In this example, the device had its power\
  \ turned on. The last line of this output is the configuration register value. This\
  \ value determines how the router will boot up, including how it will find its IOS\
  \ and its configuration file. The bootup process of the router is discussed in more\
  \ depth in [第 6 章](#).\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_362_0.png)\n\n\
  **考试提示** Be familiar with the output of the **show version** command, including\
  \ what is displayed, such as IOS version; the uptime; the amount of RAM, NVRAM,\
  \ and flash; the type and number of interfaces; and the configuration register value.\
  \ You can also view the last method used to boot up the IOS device, such as someone\
  \ executing the **reload** command or power-cycling the device.\n\n## 接口信息\n\nThe\
  \ CCT certification objectives include objective 4.11, which is to identify and\
  \ correct common network problems at layer 1 and layer 2. Layer 1 problems would\
  \ be related to identifying physical connection issues such as an unconnected device\
  \ cable. Layer 2 issues would be related to the layer 2 protocol configuration such\
  \ as a serial link having HDLC or PPP configured properly on the serial interfaces.\n\
  \nIn this section you will learn a number of commands that you can use to identify\
  \ layer 1 and layer 2 problems, to determine whether an interface is configured\
  \ for full or half duplex, and to verify the speed of the interface.\n\nYou typically\
  \ will notice any problems with an interface when you enable it, because a status\
  \ message states whether the interface is up (enabled with no problems) or down\
  \ (unable to enable due to configuration errors). In Ethernet, a status message\
  \ could be issued if the wrong cable type (crossover versus straight-through) is\
  \ used, there is a mismatch in the speed or duplex settings, or a bad cable is used.\
  \ This section will discuss how to diagnose these problems with the **show interfaces**\
  \ command.\n\n## 查看接口信息\n\nOne of the most common commands that you will use on\
  \ an IOS device is the show interfaces command. This command enables you to see\
  \ the status and configuration of your interfaces, as well as some statistical information.\
  \ Here is the syntax:\n\n```\nIOS> show interfaces [type [slot_#/]port_#]\n```\n\
  \nIf you don’t specify a specific interface, the IOS device displays all of its\
  \ interfaces—those enabled as well as those disabled. Here is an example of the\
  \ output of this command on a router:\n\n```\nLA-R1>show interfaces g0/0\nGigabitEthernet0/0\
  \ is up, line protocol is up (connected)\n  Hardware is CN Gigabit Ethernet, address\
  \ is 0004.9ab9.5601 (bia 0004.9ab9.5601)\n  Internet address is 14.0.0.1/8\n  MTU\
  \ 1500 bytes, BW 1000000 Kbit, DLY 10 usec,\n    reliability 255/255, txload 1/255,\
  \ rxload 1/255\n  Encapsulation ARPA, loopback not set\n  Keepalive set (10 sec)\n\
  \  Full-duplex, 100Mb/s, media type is RJ45\n  output flow-control is unsupported,\
  \ input flow-control is unsupported\n  ARP type: ARPA, ARP Timeout 04:00:00,\n \
  \ Last input 00:00:08, output 00:00:05, output hang never\n  Last clearing of \"\
  show interface\" counters never\n  Input queue: 0/75/0 (size/max/drops); Total output\
  \ drops: 0\n  Queueing strategy: fifo\n  Output queue :0/40 (size/max)\n  5 minute\
  \ input rate 0 bits/sec, 0 packets/sec\n  5 minute output rate 0 bits/sec, 0 packets/sec\n\
  \    0 packets input, 0 bytes, 0 no buffer\n  Received 0 broadcasts, 0 runts, 0\
  \ giants, 0 throttles\n  0 input errors, 0 CRC, 0 frame, 0 overrun, 0 ignored, 0\
  \ abort\n  0 watchdog, 1017 multicast, 0 pause input\n  0 input packets with dribble\
  \ condition detected\n  0 packets output, 0 bytes, 0 underruns\n  0 output errors,\
  \ 0 collisions, 1 interface resets\n  0 unknown protocol drops\n  0 babbles, 0 late\
  \ collision, 0 deferred\n  0 lost carrier, 0 no carrier\n  0 output buffer failures,\
  \ 0 output buffers swapped out\n```\n\n在输出中，注意接口的相关信息，例如 MAC 地址（第 2 层地址）、IP 地址（第\
  \ 3 层地址）、最大传输单元（MTU）、封装协议（ARPA 表示以太网），以及接口上的双工设置和速率。\n\n## 接口问题故障排除\n\n在此显示中，您首先要检查的就是接口的状态：**GigabitEthernet0/0\
  \ 已启动，线路协议已启动** **（已连接）**。第一个 **启动** 指的是物理层的状态，第二个 **启动** 指的是数据链路层的状态。\n\n以下是物理层状态的可能值：\n\
  \n- **启动** 设备在接口上感知到物理层信号。\n- **关闭** 设备未在接口上感知到物理层信号，这种情况可能发生在连接的设备已关闭、无电缆连接或使用错误类型的电缆时。\n\
  - **管理性关闭** 使用 **shutdown** 命令禁用接口。\n\n以下是数据链路层状态的可能值：\n\n- **启动** 数据链路层运行正常。\n\
  - **关闭** 数据链路层未运行，这种情况可能是由于串行链路上的 keepalive 丢失、没有时钟、封装类型不正确或物理层被禁用所致。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_364_0.png)\n\
  \n**注意** 如果接口状态为“启动 且 启动”，则接口运行正常。如果状态为“启动 且 关闭”，这表明数据链路层（第 2 层）协议存在问题，例如第 2 层协议的配置错误。如果状态显示为“关闭\
  \ 且 关闭”，则存在物理层问题（第 1 层），因为如果状态的第 1 层部分为关闭，则指示第 2 层状态的部分永远不会显示为启动。如果状态为“管理性关闭 且 关闭”，则接口已被其中一名管理员使用\
  \ **shutdown** 命令禁用。“Hardware is” 指的是接口的物理（第 1 层）属性，而“Encapsulation” 指的是接口的数据链路（第\
  \ 2 层）属性。\n\n**show interfaces** 命令的第二行输出显示硬件接口类型（在此示例中为千兆以太网控制器）。随后是接口上的 MAC 地址。第三行显示接口上配置的\
  \ IP 地址和子网掩码（您不会在第 2 层交换机的接口上看到此信息）。第四行显示 MTU 以太网帧大小以及路由协议度量。注意此行中的 **BW** 参数。称为链路的\
  \ *带宽*，这会被某些路由协议，例如开放最短路径优先 (OSPF) 和增强型内部网关路由协议 (EIGRP)，在进行路由决策时使用。对于千兆以太网，这为 1,000,000\
  \ Kbps。此后的行指的是使用的第 2 层封装（帧）类型；对于以太网，这可以是 ARPA，但在 WAN 接口上您可能会看到串行链路协议，例如 HDLC 或 PPP。\n\
  \n表 7-4 解释了您在使用 **show interfaces** 命令时可能会看到的一些元素。请注意，根据 IOS 设备类型和接口类型，**show interfaces**\
  \ 命令中显示的输出可能会略有不同。\n\n| 元素 | 描述 |\n|---|---|\n| 地址 | 接口的 MAC 地址；BIA（烧录地址）是烧录到以太网控制器的\
  \ MAC 地址——这可通过 Interface **mac-address** 命令覆盖。 |\n| 最后输入/输出 | 数据包最后一次在接口上接收或发送出去的时间——可用于确定接口是否正在运行。\
  \ |\n| 最后清除 | 最后一次在接口上执行 **clear counters** 命令的时间。 |\n| 输出队列 | 等待从接口发送出去的数据包数量——斜杠（/）后面的数字是队列的最大大小，其后是因队列已满而被丢弃的数据包数量。\
  \ |\n| 输入队列 | 在接口上接收并等待处理的数据包数量——斜杠（/）后面的数字是队列的最大大小，其后是因队列已满而被丢弃的数据包数量。 |\n| 无缓冲区（输入）\
  \ | 因输入缓冲区已满而被丢弃的接收数据包数量。 |\n| 残帧（输入） | 接收到的数据包数量小于封装类型的最小值（以太网为 64 字节）。 |\n| 巨帧（输入）\
  \ | 接收到的数据包数量大于允许的最大尺寸（以太网为 1518 字节）。 |\n| 输入错误 | 接口接收到的总输入错误数。 |\n| CRC（输入） | 接收到的数据包中校验和错误的数量。\
  \ |\n| 帧（输入） | 接收到的数据包中同时存在 CRC 错误且帧长度不在字节边界的情况的数量。 |\n| 溢出（输入） | 入站数据包速率超过接口处理流量能力的情况次数。\
  \ |\n| 忽略（输入） | 因缺乏输入缓冲区空间而被丢弃的入站数据包数量。 |\n| 中断（输入） | 被中断的接收数据包数量。 |\n| 碰撞（输出） |\
  \ 接口尝试发送数据包但发生碰撞的次数——这应小于离开接口的总流量的 0.1%。 |\n| 接口重置（输出） | 接口通过关闭然后重新启动而改变状态的次数。 |\n\
  | 重启（输出） | 因错误而导致控制器被重置的次数——使用 |\n\n## 表 7-4 show interfaces 命令中元素的说明\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_367_0.png)\n\
  \n**考试提示** 熟悉 **show interfaces** 命令的输出。MTU 大小表示最大数据包大小（不是帧或段）。\n\n在以下示例中，注意 fa0/0\
  \ 交换端口有大量输入和 CRC 错误：\n\n```\nSwitch# show interfaces fa0/0\nFastEthernet 0/1 is\
  \ up, line protocol is up (connected)\n  Hardware is MII Ethernet, address is 0000.0c00.1234\n\
  MTU 1500 bytes, BW 10000 Kbit, DLY 100000 usec, reliability 255/255,\n         \
  \       load 1/255\nEncapsulation ARPA, loopback not set, keepalive set (10 sec)\n\
  Full-duplex, 100Mbps, media type is 10/100BaseTx\ninput flow-control is off, output\
  \ flow-control is unsupported\nLast input 0:00:00, output 0:00:00, output hang never\n\
  Last clearing of \"show interfaces\" counters 0:00:00\nOutput queue 0/40, 0 drops;\
  \ input queue 0/75, 0 drops\nFive minute input rate 354000 bits/sec, 335 packets/sec\n\
  Five minute output rate 357000 bits/sec, 328 packets/sec\n  12375 packets input,\
  \ 1900414 bytes, 0 no buffer\n  Received 1133 broadcasts (0 multicasts)\n  0 runts,\
  \ 0 giants, 0 throttles\n  735 input errors, 731 CRC, 0 frame, 0 overrun, 0 ignored,\
  \ 0 abort\n.\n.\n.\n```\n\n请注意，fa0/0 接口配置为全双工 100 Mbps。如果使用了速率/双工自动感应（这是默认值），则在双工行中会出现\
  \ *自动* 字样。罪魁祸首很可能是在另一端的双工不匹配。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_368_0.png)\n\
  \n**考试提示** 请记住，如果连接到同一子网的设备可以相互 ping 通，但设备无法 ping 通连接到同一子网的路由器，您可以使用 **show interfaces**\
  \ 命令验证接口是否运行正常，并且路由器在其上配置了正确的 IP 地址。\n\n## WAN 串行环回测试\n\n在排查 WAN 上的连接性时，您可能需要在 Cisco\
  \ 设备的串行端口上执行环回测试。环回测试是一种验证 WAN 链路问题发生位置的方法：是在您这边还是在服务提供商那边？\n\n最好先通过执行 CSU/DSU 环回测试来测试到通道服务单元/数据服务单元（CSU/DSU）的连接，以验证您的\
  \ T1 链路或 56K 链路。如果成功，您可以然后通过与服务提供商执行电信协助环回测试来验证从 CSU/DSU 到服务提供商的连接。\n\n可以在 CSU/DSU\
  \ 上执行两种类型的环回测试：\n\n- **软件** 使用 Cisco IOS 命令从路由器测试到 CSU/DSU 的功能。\n- **硬件** 将环回插头/电缆连接到\
  \ CSU/DSU 以执行环回测试。\n\n让我们逐步介绍一些可用于排查 WAN 接口并执行软件环回测试的命令。首先，您可以使用 **show inventory**\
  \ 命令查看设备中存在的硬件，如下所示：\n\n\n```\nRouter>enable\nRouter#show inventory\nNAME: \"2811\
  \ chassis\", DESCR: \"2811 chassis, Hw Serial#: FTX1022A1ZJ, Hw\nRevision: 52.57\"\
  \nPID: CISCO2811        , VID: V02 , SN: FTX1022A1ZJ\n\nNAME: \"c2811 Motherboard\
  \ with 2FE and integrated VPN\", DESCR: \"c2811\nMotherboard with 2FE and integrated\
  \ VPN\"\nPID: CISCO2811        , VID: V02 , SN: FOC1020257J\n\nNAME: \"9 Port FE\
  \ Switch\", DESCR: \"9 Port FE Switch\"\nPID: HWIC-D-9ESW      , VID: VN/A, SN:\
  \ FOC100131K6\n\nNAME: \"WAN Interface Card - DSU/CSU T1 Fractional (V2)\", DESCR:\
  \ \"WAN\nInterface Card - DSU/CSU T1 Fractional (V2)\"\nPID:                  ,\
  \ VID: 1.2, SN: FOC10174ES5\n```\n\n请注意 **show inventory** 命令输出中，这是一台包含九个快速以太网端口的\
  \ 2800 系列路由器。您还可以看到有一个 WAN 接口卡——一个内部 CSU/DSU 设备。要查看该卡是否创建了串行端口，请使用 **show ip interface\
  \ brief** 命令，如下所示：\n\n```\nRouter#show ip interface brief\nInterface           \
  \   IP-Address      OK? Method Status    Protocol\n(output cut for briefness)\n\
  Serial0/2/0            13.0.0.1        YES manual up        up\nVlan1          \
  \        unassigned      YES NVRAM   up        down\n```\n\n注意 S0/2/0 的串行接口。如果您想查看该接口的详细信息，请使用\
  \ **show interface s0/2/0** 命令：\n\n```\nRouter#show interface s0/2/0\nSerial0/2/0\
  \ is up, line protocol is up\n  Hardware is GT96K with integrated T1 CSU/DSU\n \
  \ MTU 1500 bytes, BW 1544 Kbit, DLY 20000 usec,\n    reliability 255/255, txload\
  \ 1/255, rxload 1/255\n  Encapsulation HDLC, loopback not set\n  Keepalive set (10\
  \ sec)\n(output cut for briefness)\n```\n\n在此输出中，您可以看到第 1 层和第 2 层组件正常（它们处于开启状态）。串行端口由于集成的\
  \ CSU/DSU 而存在，并且封装协议为 HDLC。最后需要注意的是，回环未设置。要在此接口上执行回环测试，您需要启用回环。为此，请使用以下命令：\n\n```\n\
  Router#config term\nRouter(config)#interface s0/2/0\nRouter(config-if)#loopback\
  \ ?\n    dte      Loopback on the router side of the CSU/DSU\n    line     Loopback\
  \ on the line side of the CSU/DSU\n    remote   Loopback on the remote side of the\
  \ CSU/DSU\n```\n\n要启用回环，首先导航到接口。然后您可以使用 loopback 命令并指定要执行回环测试的对象。请注意，如果您使用 dte 参数，您正在测试\
  \ CSU/DSU 的路由器侧，但如果您设置 line 参数，您正在测试 CSU/DSU 的提供商侧。如果您将参数设置为 remote，您正在测试 WAN 链路另一端的连通性。对于本次讨论，我们从路由器（DTE\
  \ 设备）到 CSU/DSU 进行测试：\n\n```\nRouter(config-if)#loopback dte\nLoopback in progress\n\
  ```\n\n要验证回环是否已启用，请再次对串行端口使用 show interface 命令。您应该看到消息“loopback is set”而不是“loopback\
  \ not set。”\n\n现在您可以使用 Cisco 设备的扩展 ping 功能来测试连通性。扩展 ping 是一种特殊的 ping 功能，可让您控制 Cisco\
  \ 设备发送的 ping 消息，并提供多种高级选项。要使用扩展 ping，请进入特权 EXEC 模式并使用不带参数的 ping 命令。Cisco 设备将提示您输入多个设置，例如让您设置\
  \ ping 消息的源地址和目标地址、要发送的 ping 消息数量以及消息的大小：\n\n```\nRouter#ping\nProtocol [ip]:\n\
  Target IP address: 13.0.0.1\nRepeat count [5]: 50\nDatagram size [100]: 1500\nTimeout\
  \ in seconds [2]:\nExtended commands [n]: y\nSource address or interface: 13.0.0.1\n\
  Type of service [0]:\nSet DF bit in IP header? [no]:\nValidate reply data? [no]:\n\
  Data pattern [0xABCD]:\nLoose, Strict, Record, Timestamp, Verbose [none]:\nSweep\
  \ range of sizes [n]:\nType escape sequence to abort.\nSending 50, 1500-byte ICMP\
  \ Echos to 13.0.0.1, timeout is 2 seconds:\nPacket sent with a source address of\
  \ 13.0.0.1\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\nSuccess rate is 100\
  \ percent (50/50), round-trip min/avg/max = 31/39/47 ms\nRouter#\n```\n\n请注意，回环测试会干扰您的\
  \ WAN 链路，因此测试后应通过导航到接口并使用 **no loopback dte** 命令将其关闭。\n\n## 练习 7-4：查看您的配置\n\n在本练习中，您将继续进行前几次练习的配置，并通过使用多个\
  \ **show** 命令来验证配置。请参阅图 7-5。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_372_0.png)\n\
  \n### 图 7-5 练习的网络拓扑\n\n- 1. 确保您已通过控制台连接到 VAN-R1。\n- 2. 要查看接口的配置及其状态，请使用 **show ip\
  \ interface brief** 命令。查看输出。\n- 3. 要查看 g0/0 接口的状态，包括其 IP 地址以及其在第 1 层和第 2 层是否正常运行，请使用\
  \ **show interfaces g0/0** 命令。查看输出。\n- 4. 要查看您的串行端口是 DCE 还是 DTE 设备，请使用 **show controllers\
  \ s0/3/0** 命令。查看输出。\n- 5. 将路由器的主机名更改为 *VAN-TEMP*。\n- 6. 要查看 RAM 中的当前配置，请使用 **show\
  \ running-config** 命令。查看输出。您应该看到主机名 VAN-TEMP 行。\n- 7. 要查看 NVRAM 的配置，请使用 **show startup-config**\
  \ 命令。查看输出。您应该会看到此配置仍然具有主机名 VAN-R1。这是因为您尚未将更改保存到 NVRAM。\n\n- 8. 使用 **write** 命令将更改保存到\
  \ NVRAM。\n- 9. 再次查看您的运行配置和启动配置。它们都应具有主机名 VAN-TEMP。\n- 10. 将主机名改回 *VAN-R1*。\n- 11.\
  \ 使用 **write** 命令将更改保存到 NVRAM。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_373_0.png)\n\
  \n**VIDEO 7.10.** 随附本书的数字资源包含使用 Cisco 设备 ping 的多媒体演示。\n\n## 章节回顾\n\n本章向您介绍了 IOS\
  \ CLI 以及如何在 Cisco 的交换机和路由器上进行基本配置。您的 PC 上的终端仿真器需要为控制台连接配置为 9600 bps、8 个数据位、1 个停止位、无奇偶校验和无流量控制。\n\
  \n交换机接口的命名方式如下：*type slot_#/port_#*。接口类型是媒体类型，例如 **Ethernet**、**FastEthernet** 或\
  \ **GigabitEthernet**。接下来是插槽号。对于 2960 交换机上的所有固定接口，插槽号始终为 *0*。所有交换机端口号从 *1* 开始递增。路由器接口的命名方式为\
  \ *type slot_#/port_#* 或 *type port_#*。接口类型是媒体类型，例如 **Ethernet**、**FastEthernet**、**GigabitEthernet**\
  \ 和 **Serial**，以及许多其他类型。接下来是模块化路由器的插槽号。插槽号从 *0* 开始递增。同一插槽和类型内的所有路由器端口号从 *0* 开始递增，这与\
  \ Catalyst 交换机不同。\n\nIOS 提供了一个 CLI，具有许多功能，包括通过使用 **help** 或 **?** 访问的上下文相关帮助、命令行历史记录和高级编辑功能，这些功能在所有模式下均可用，包括用户\
  \ EXEC、特权 EXEC 和配置模式。在配置模式下有子配置模式。要访问特权 EXEC 模式，请使用 **enable** 命令，要访问配置模式，请使用 **configure\
  \ terminal。**\n\n您可以通过分配用户 EXEC 和特权 EXEC 密码来保护对 Cisco 设备的访问。使用线路子配置模式 **password**\
  \ 命令以及两个相应级别的 **enable secret** 或 **enable password** 命令。**service password-encryption**\
  \ 命令在 IOS 设备上加密明文密码。**banner motd** 命令在任何用户名或密码提示之前显示登录横幅。\n\n要查看活动配置，请使用 **show\
  \ running-config** 命令。在 IOS 设备上，您必须使用 **copy running-config startup-config** 命令手动将配置保存到\
  \ NVRAM。\n\n交换机接口默认启用，但路由器接口需要使用 **no shutdown** 命令启用。对于 DCE 串行接口，路由器需要使用 **clock\
  \ rate** 命令应用时钟速率。使用 **show interfaces** 命令查看接口的状态和配置。\n\n## 快速回顾\n\n- 在您的终端仿真软件包中，将速度设置为\
  \ 9600 bps，数据位设置为 8，停止位设置为 1，奇偶校验设置为无，流量控制设置为无。\n- 接口具有名称，可能的插槽号和端口号。2960 的插槽号为\
  \ 0；端口号从 1 开始。路由器插槽号从 0 开始；端口号从 0 开始，并在每个插槽内的每种类型中重新开始。\n\n## 命令行界面 (CLI)\n\n- 存在四种\
  \ CLI 访问模式：用户 EXEC (**IOS>**)、特权 EXEC (**IOS#**)、配置 (**IOS(config)#**) 和 ROMMON\
  \ 模式 (>).\n- **enable** 命令将您从用户 EXEC 移动到特权 EXEC 模式。**exit** 命令将您从 IOS 设备注销。\n\n\
  ## IOS 基础\n\n\n\n- 使用 **?** 在路由器的任何模式下显示上下文相关帮助；它列出可用的命令及其有效参数。\n- 如果执行命令并看到命令的输出结果，请务必检查输出，以确保输入的命令中没有错误。\n\
  - 你可以使用键盘上的方向键来召回和编辑命令。\n- 使用 TAB 键自动补全命令。\n\n## 基本 IOS 配置\n- 使用特权 EXEC **configure\
  \ terminal** 命令进入配置模式。\n- **hostname** 命令为路由器分配一个本地有意义的名称。**no** 参数否定/撤销配置更改。\n\
  - **no shutdown** 命令启用接口；交换机上的接口默认启用，但路由器接口默认禁用。**clock rate** 命令指定路由器上 DCE 串行接口的速度，当在不使用\
  \ CSU/DSU 等外部时钟设备的情况下背靠背连接两个串行接口时需要使用该命令。使用 **show controller** 命令验证串行接口是否为 DTE\
  \ 或 DCE。\n\n## 基本 IOS 安全配置\n- 线路（访问用户 EXEC 模式）可通过 **password** 命令进行保护。特权 EXEC 模式的访问可以通过\
  \ **enable password** 或 **enable secret** 命令进行保护；前者未加密，后者加密强度高。\n- 明文密码可通过 **service\
  \ password-encryption** 命令进行加密。\n- 你可以使用 **banner motd** 命令在用户名/密码提示之前显示登录横幅；在身份验证完成后、用户看到\
  \ EXEC 提示之前，可以使用 **banner exec** 命令显示横幅。\n\n## IOS 操作和验证\n- 必须处于特权 EXEC 模式才能操作配置文件。**show\
  \ running-config** 命令显示 RAM 中的运行配置。**show startup-config** 命令显示 NVRAM 中的备份配置。\n\
  - IOS 设备不会自动将 RAM 中的配置保存到 NVRAM；使用 **copy running-config startup-config** 命令执行此操作。\n\
  - 使用 **show version** 命令查看设备的 IOS 版本及其硬件特性。\n- **show interfaces** 命令用于查看 IOS 设备接口的物理层和数据链路层的运行状态。\n\

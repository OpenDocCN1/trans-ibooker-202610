- "# 高级交换功能\n\n在本章中，您将\n\n- 了解如何设置和管理 VLAN 中继协议\n- 了解生成树协议\n- 了解快速生成树协议\n- 了解如何管理\
  \ EtherChannel\n\n本章是关于第 2 层功能的最后一章。大多数较大的网络实现冗余以在发生故障时保护数据；冗余可以涉及多个广域网 (WAN) 连接、第\
  \ 3 层网络中的多个路径和/或第 2 层网络中的多个路径。本章侧重于第 2 层冗余以及与第 2 层环路相关的问题，包括两种通常用于解决这些问题的功能：生成树协议和\
  \ EtherChannel。\n\n## VLAN 中继协议\n\nVLAN 中继协议 (VTP) 是一种思科专有协议，用于在中继连接上共享思科交换机之间的虚拟局域网\
  \ (VLAN) 配置信息。VTP 使交换机能够共享并同步其 VLAN 信息，从而确保您的网络具有一致的 VLAN 配置。\n\n假设，例如，您的网络有两台交换机，并且您需要添加一个新\
  \ VLAN。您可以通过在两台交换机上手动添加 VLAN 来轻松完成此操作。但是，如果您需要处理 30 台交换机，此过程会变得更加困难和繁琐。在这种情况下，您可能会在其中一台交换机上配置新\
  \ VLAN 时出错，例如为其分配错误的 VLAN 标识符，或者您可能会忘记将新 VLAN 添加到 30 台交换机中的某一台上。VTP 可以解决这些问题。使用\
  \ VTP，您可以在一台交换机上添加 VLAN，并让该交换机通过 VTP 消息将新 VLAN 传播到第 2 层网络中的所有其他交换机，从而导致它们也添加新 VLAN。\n\
  \n如果修改 VLAN 的配置或删除 VLAN，情况也是如此——VTP 可以验证您的 VLAN 配置在所有交换机上是否一致。VTP 甚至可以对 VLAN 执行一致性检查，以确保所有\
  \ VLAN 的配置完全相同。\n\nVLAN 的组件可以包括 VLAN 编号、名称和类型。因此，例如，如果一台交换机上有一个 VLAN 编号为 1 且名称为“admin”的\
  \ VLAN，而第二台交换机上使用的名称为“administrator”用于相同的 VLAN 1，VTP 会检查并修复配置不匹配。\n\nVTP 消息仅通过中继连接传播，因此您需要在交换机之间设置中继才能通过\
  \ VTP 共享 VLAN 信息。VTP 消息由第 2 层设备作为第 2 层组播帧传播。因此，如果路由器分隔了您的两台交换机，路由器不会将 VTP 消息从其中一个接口转发到另一个接口，因为它是第\
  \ 3 层设备。\n\n要使 VTP 正常工作，您必须将交换机与 VTP 域关联。域是一组对其应用相同 VLAN 信息的交换机。基本上，VTP 域类似于自治系统，某些路由协议使用自治系统（自治系统和路由协议在第\
  \ 11 章中介绍）。交换机只能属于单个 VTP 域。VTP 域有名称，当交换机生成 VTP 消息时，它们会在消息中包含 VTP 域名。当交换机接收 VTP 消息时，仅当消息中的\
  \ VTP 域与交换机上配置的 VTP 域名相同时，才会处理 VTP 消息。换句话说，一个 VTP 域中的交换机将忽略来自其他 VTP 域中交换机的 VTP 消息。以下部分介绍\
  \ VTP 使用的组件和消息，以及它提供的一些优势，例如修剪。\n\n\n\n\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_559_0.png)\n\
  \n**提示** VTP 是 Cisco 专有协议，可穿越中继链路。它用于在同一域内的所有交换机上创建一致的 VLAN 配置。可以在一台交换机上添加 VLAN\
  \ 并将其传播到其他交换机；但是，交换机会忽略来自其他 VTP 域的 VTP 消息。\n\n## VTP 模式\n\n在设置 VTP 时，可以为交换机的配置选择三种不同的模式：\n\
  \n- 客户端\n- 服务器\n- 透明\n\n表 10-1 VTP 模式描述\n\n| 描述 | 服务器 | 客户端 | 透明 |\n|---|---|---|---|\n\
  | 可以添加、修改和删除 VLAN | 是 | 否 | 是 |\n| 可以生成 VTP 消息 | 是 | 否 | 否 |\n| 可以传播 VTP 消息 | 是\
  \ | 是 | 是 |\n| 可以接受 VTP 消息中的更改 | 是 | 是 | 否 |\n| 默认 VTP 模式 | 是 | 否 | 否 |\n| 将 VLAN\
  \ 保存到 NVRAM | 是 | 否 | 是 |\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_559_1.png)\n\
  \n**考试提示** 新 CCNA 考试未将 VTP 列为考试主题，但你可能在现有网络中遇到 VTP。出于这个原因，本章将向你介绍 VTP。\n\n配置为 VTP\
  \ 服务器或透明模式的交换机可以添加、修改和删除 VLAN。这两种模式的主要区别在于，对透明交换机所做的配置更改仅影响 *该* 交换机，而不影响网络中的其他交换机。但是，VTP\
  \ 服务器交换机会进行更改，然后将有关更改的 VTP 消息传播到其所有中继端口。如果服务器交换机接收到 VTP 消息，它将合并该更新并将消息转发出其剩余的中继端口。另一方面，透明交换机会忽略\
  \ VTP 消息——它会在中继端口上接受这些消息并将其转发出其剩余的中继端口，但不会将 VTP 消息中的更改合并到其本地 VLAN 配置中。从这个意义上说，透明交换机就像小岛，透明交换机上的更改只影响透明交换机本身，而对其他交换机的更改不会影响透明交换机。\n\
  \nVTP 客户端交换机本身无法更改其 VLAN 配置——它需要服务器交换机告知 VLAN 更改。当客户端交换机从服务器交换机接收到 VTP 消息时，它会合并这些更改，然后将\
  \ VTP 消息泛洪到其剩余的中继端口。\n\n通常，你会将一台交换机设置为服务器模式，将所有其他交换机设置为客户端模式。然后，你将控制谁可以在服务器交换机上进行更改。但是，你应该牢记，如果在服务器交换机上犯了\
  \ VLAN 配置错误，此错误会 *自动传播* 到网络中的所有客户端交换机。想象一下，如果你不小心在服务器交换机上删除了一个 VLAN，并且该 VLAN 中有\
  \ 500 台设备。如果发生这种情况，所有交换机都将从其配置中删除该 VLAN。\n\n鉴于此及类似问题，一些管理员不喜欢使用 VTP 服务器和客户端模式；他们更倾向于将所有交换机配置为透明模式。但是，透明模式的问题在于其可扩展性不高；如果你需要向网络添加一个\
  \ VLAN，而你的网络有 20 台交换机，则需要手动将 VLAN 添加到每个交换机，这是一个耗时的过程。当然，这种方法的优势在于，如果在透明交换机上犯了错误，该问题\
  \ *不会* 传播到其他交换机：它是局部化的。\n\n你也可以将所有交换机设置为服务器模式，这是 VTP 的默认设置。你甚至可以混合使用这些选项——设置几台服务器交换机，其余交换机作为客户端，或者最初将交换机设置为服务器和客户端，在服务器交换机上添加所有\
  \ VLAN，允许客户端获取此信息，然后将所有交换机更改为透明模式。此过程允许你在设置过程中轻松地以一致的 VLAN 配置填充交换机的配置。请注意，如果未为交换机指定\
  \ VTP 模式，它将默认为 *服务器*。如你所见，有多种 VTP 配置选项可供选择。\n\n## VTP 消息\n\n如果为 VTP 使用客户端/服务器配置，这些交换机可以生成三种类型的\
  \ VTP 消息：\n\n- 通告请求\n- 子集通告\n- 摘要通告\n\n*通告请求* 消息是客户端生成的一种 VTP 消息，用于获取 VLAN 信息，服务器会对此作出响应。当服务器响应客户端的请求时，它会生成一个\
  \ *子集通告*。此子集通告包含详细的 VLAN 配置信息，包括 VLAN 编号、名称、类型及其他信息。然后客户端会相应地配置自身。\n\n*摘要通告* 也由处于\
  \ VTP 服务器模式的交换机生成。默认情况下，摘要通告每 5 分钟（300 秒）生成一次，或者在服务器交换机上发生配置更改时生成。与子集通告不同，摘要通告仅包含汇总的\
  \ VLAN 信息。\n\n当服务器交换机生成 VTP 通告时，可以包含以下信息：\n\n- VLAN 的编号和名称\n- VLAN 使用的最大传输单元 (MTU)\
  \ 大小\n- VLAN 使用的帧格式\n- VLAN 的安全关联标识符 (SAID) 值（如果是 802.10 VLAN，则需要；该 VLAN 在使用光纤分布式数据接口\
  \ [FDDI] 的网络中实现）\n- 配置修订号\n- VTP 域名\n\n此列表包含几个需要进一步讨论的重要项目。如果处于同一 VTP 域中，服务器或客户端模式的交换机都会处理\
  \ VTP 消息；但是，对交换机是否应合并更改有一些限制。例如，VTP 摘要通告的一个功能是确保所有交换机都拥有最新更改。如果你在五分钟更新间隔内未对服务器交换机进行更改，当倒计时计时器到期时，服务器交换机仍会发送带有相同汇总信息的摘要通告。让拥有最新信息的其他交换机将相同信息合并到其配置中，这没有意义。\n\
  \n为了使此过程更高效，*配置修订号* 用于跟踪哪台服务器交换机拥有最新更改。初始时，此号码设置为零 (0)。如果你在服务器交换机上进行更改，它会递增其修订号，并通过其中继链路将此信息通告给其他交换机。当客户端或服务器交换机接收到此信息时，它会将消息中的修订号与上次接收到的消息进行比较。如果新到达的消息编号更高，则该服务器交换机必定进行了更改。如果\
  \ VTP 摘要通告中不包含所需的 VLAN 信息，则所有客户端和服务器交换机都会生成通告请求，服务器将在子集通告中响应详细信息。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_562_0.png)\n\
  \n**注释** VTP 服务器每五分钟生成一次 VTP 组播。*配置修订号* 用于确定哪台服务器拥有最新的 VLAN 信息：编号最高的最新。请记住，在将现有服务器交换机连接到现有服务器/客户端\
  \ VTP 网络时，修订号最高的服务器交换机将获胜，其 VLAN 将被使用。其他交换机的 VLAN 将被删除。\n\n如果服务器交换机从另一台服务器接收到 VTP\
  \ 消息，且通告服务器的修订号较低，则接收服务器交换机将使用带有其当前配置修订号的 VTP 消息响应通告服务器。这将告诉通告服务器交换机，它没有最新的 VLAN\
  \ 信息，并应从拥有该信息的服务器请求。从这个意义上说，VTP 消息中使用的修订号在某些方面类似于 TCP 中使用的序列号。还要记住，透明交换机不处理这些 VTP\
  \ 通告——它们只是被动地将这些消息转发到其上中继端口的其他交换机。\n\n## VTP 修剪\n\nVTP 修剪是一项 Cisco 功能，可使你的交换机动态地将\
  \ VLAN 添加到中继链路或从中删除 VLAN，从而创建更高效的交换网络。默认情况下，所有 VLAN 都与中继连接相关联。这意味着，如果任何 VLAN 中的设备生成广播、组播或未知单播，交换机会将此帧泛洪到与源\
  \ VLAN 端口关联的所有端口，包括中继链路。在许多情况下，这种泛洪是必要的，尤其是当 VLAN 跨越多台交换机时。但是，如果相邻交换机在源 VLAN 中没有任何活动端口，则向其泛洪帧没有意义。\n\
  \n### 未启用修剪的中继\n\n在图 10-1 所示的示例中，未启用 VTP 修剪。PC-A、PC-B、PC-E 和 PC-F 位于同一 VLAN 中。如果\
  \ PC-A 生成广播，SwitchA 将此帧转发到 PC-B 连接的访问链路以及中继链路（因为中继链路是所有 VLAN 的成员，由\n\n\n默认情况下）。这是合理的，因为连接到SwitchB的PC-E和PC-F位于同一VLAN中。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_564_0.png)\n\n图10-1 无VTP剪枝的中继\n\n图10-1展示了一个包含两个成员的第二个VLAN：PC-C和PC-D。如果PC-C产生本地广播，SwitchA显然会将其发送到PC-D的端口。不合理的是，SwitchA会将该广播从中继端口泛洪到SwitchB，尽管SwitchB上没有设备属于该VLAN。这是浪费带宽和资源的一个例子。在示例中，单个广播不是什么大问题；然而，如果来自PC-A的视频组播流为5\
  \ Mbps，网络在中继上可能会遇到吞吐量问题，因为交换机对待组播就像对待广播一样——它会将其泛洪到与源端口VLAN关联的所有端口。\n\n你可以使用两种方法之一来解决这个问题：静态VLAN剪枝或动态VLAN剪枝。通过静态配置，你可以手动将非活动VLAN从两台交换机的中继上剪除，如图10-2所示。请注意，在此图中，深色VLAN（用虚线表示）已从中继上被剪除。手动剪枝的问题在于，如果你向SwitchB添加一个深色VLAN成员，你将不得不登录到两台交换机，并手动将该被剪除的VLAN添加回中继。在具有多个VLAN的多交换机网络中，这可能会变得非常混乱，因为并非每个VLAN在每台交换机上都处于活动状态。很容易意外地从一个不应被剪除的中继上剪除某个VLAN，从而造成连通性问题。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_565_0.png)\n\n图10-2 VLAN剪枝\n\n## 带剪枝的中继\n\
  \nVTP剪枝功能使交换机能够共享额外的VLAN信息，并动态地从中继连接中剪除非活动VLAN。在这种情况下，交换机之间会共享哪些VLAN处于活动状态。例如，SwitchA告诉SwitchB它有两个活动VLAN（白色VLAN和深色VLAN）。另一方面，SwitchB只有一个活动VLAN，并将这一事实告知SwitchA。基于共享的信息，SwitchA和SwitchB都意识到深色VLAN在它们的中继连接上不活动，因此深色VLAN应被动态地从中继配置中移除。\n\
  \n此功能的好处在于，如果你碰巧通过将设备连接到SwitchB的某个端口并将该端口分配给深色VLAN来激活SwitchB上的深色VLAN，SwitchB将通知SwitchA这一新激活的VLAN，并且两台交换机会动态地将该VLAN添加回中继配置中。这将使PC-C、PC-D和新设备能够相互发送帧，如图10-3所示。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_566_0.png)\n\n图10-3 VTP剪枝在中继上激活VLAN\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_567_0.png)\n\n**注意** 默认情况下，所有VLAN都可以通过中继传输。VTP剪枝用于在中继连接上动态删除两台交换机之间不活动的VLAN。它必须在VTP服务器交换机上启用，并且其他交换机必须是服务器或客户端。\n\
  \n只有处于*服务器*模式的VTP交换机才能启用VTP剪枝，域中的其余交换机必须处于VTP服务器或客户端模式。如果你有透明模式交换机，则必须手动从其中继链路上剪除VLAN。\n\
  \n## 管理VLAN\n\n与Cisco路由器不同，每台Cisco交换机都带有默认配置。例如，交换机上已经存在一些预配置的VLAN，包括VLAN 1。在配置过程中，所有VLAN命令都引用VLAN编号，尽管你可以为VLAN配置可选名称。默认情况下，交换机上的每个端口都与VLAN\
  \ 1关联。并且来自交换机本身的所有通信——VTP消息、Cisco发现协议（CDP）组播以及交换机产生的其他流量——都发生在VLAN 1中。回顾第9章可知，Cisco交换机的IP配置基于你为其配置IP地址的VLAN接口。\n\
  \nVLAN 1有时被称为*管理VLAN*，尽管你也可以使用不同的VLAN。通常的做法是将所有管理设备——交换机和网管工作站——放在它们自己的VLAN中。如果你决定将交换机放在不同于VLAN\
  \ 1的VLAN中，建议你在所有管理设备上更改此配置，以便更容易地保护它们，因为其他VLAN必须通过三层设备才能访问它们；并且在这个三层设备上，你可以设置访问控制列表来过滤不需要的流量。\n\
  \n所有交换机都应处于同一管理VLAN中，这一点很重要，因为交换机的许多管理协议（如CDP、VTP和动态中继协议（DTP））都发生在交换机的管理VLAN内。如果一台交换机的管理VLAN设置为1，而另一台连接的交换机的管理VLAN设置为2，则这两台交换机会失去很多交换机间功能。\n\
  \n## 配置VTP\n\n无论是排查现有网络设置的问题，还是自行配置VTP，了解常见的VTP参数及其值都很重要。表10-2显示了Cisco交换机的默认VTP配置。以下各节将介绍这些VTP参数的配置。\n\
  \n| VTP组件 | VTP默认值 |\n|---|---|\n| 域名 | 无 |\n| 模式 | 服务器 |\n| 密码 | 无 |\n| 剪枝 | 禁用\
  \ |\n| 版本 | 1 |\n\n表10-2 VTP默认配置值\n\n你在Cisco交换机的全局配置模式下配置VTP：\n\n```\nswitch(config)#\
  \ vtp domain VTP_domain_name\nswitch(config)# vtp mode server|client|transparent\n\
  switch(config)# vtp password VTP_password\nswitch(config)# vtp pruning\n```\n\n\
  vtp domain 命令为你的交换机定义域名。请记住，为了使交换机共享VTP信息，它们必须位于同一域中。从其他域接收的消息将被忽略。如果你没有配置域名，交换机将从服务器通告中学习到该域名。\n\
  \n配置中的其余命令是可选的。第二条 vtp 命令定义交换机的VTP模式。如果你不配置此命令，默认模式为服务器模式。你可以为交换机配置VTP MD5密码，该密码必须与域中每台交换机上配置的密码匹配。交换机将使用此密码来验证来自其他交换机的VTP消息；如果VTP消息中携带的哈希值（通过将VTP消息和密码运行MD5生成哈希签名）无法通过验证，交换机将忽略这些VTP消息。在大多数交换机上，剪枝默认是禁用的，但你可以使用**vtp\
  \ pruning**命令来禁用或启用它。需要注意的是，如果在服务器交换机上启用了剪枝，该服务器交换机会将此信息传播到同一域中的所有其他服务器和客户端交换机。\n\
  \n完成VTP配置后，使用**show vtp status**命令检查你的配置：\n\n```\nswitch# show vtp status\nVTP Version\
  \ : 1\nConfiguration Revision : 17\nMaximum VLANs supported locally : 255\nNumber\
  \ of existing VLANs : 7\nVTP Operating Mode : Server\nVTP Domain Name : dealgroup\n\
  VTP Pruning Mode : Enabled\nVTP V2 Mode : Disabled\nVTP Traps Generation : Disabled\n\
  MD5 digest : 0x95 0xAB 0x29 0x44 0x32 0xA1 0x2C 0x31\nConfiguration last modified\
  \ by 0.0.0.0 at 3-1-03 15:18:37\nLocal updater ID is 192.168.1.4 on interface Vlan1\n\
  (lowest numbered VLAN interface found)\n```\n\n在此示例中，已经发生了17次配置更改（请参阅配置修订号字段）。该交换机正在dealgroup域中以服务器模式运行。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_569_0.png)\n\n**注意** **vtp password**命令用于验证交换机之间的VTP消息。**show\
  \ vtp status**命令将显示\n\n\n交换机正在运行的 VTP 模式、配置修订号，以及该交换机所属的 VTP 域。\n\n使用 **show vtp\
  \ counters** 命令显示有关已发送和已接收 VTP 消息的 VTP 统计信息：\n\n```\nswitch# show vtp counters\n\
  VTP statistics:\n    Summary advertisements received: 12\n    Subset advertisements\
  \ received: 0\n    Request advertisements received: 0\n    Summary advertisements\
  \ transmitted: 7\n    Subset advertisements transmitted: 0\n    Request advertisements\
  \ transmitted: 0\n    Number of config revision errors: 0\n    Number of config\

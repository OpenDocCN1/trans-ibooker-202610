  \  |  |  |  |  |\n| 子网 8 |  |  |  |  |  |\n\n### 任务 2：子网划分 B 类地址\n\n你负责将网络 ID 190.34.0.0\
  \ 子网划分为四个子网。拿一些纸并逐步进行该 B 类网络划分为四个子网的二进制运算。计算完纸上的信息后，填写下面的表格：\n\n|  | 网络 ID | 第一个有效地址\

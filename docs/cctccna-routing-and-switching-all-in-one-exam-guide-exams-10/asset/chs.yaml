  \ |\n| V: | OSPF 版本号 |\n\n## Exercise 12-1：配置 OSPF\n\n本章的最后几个部分介绍了在路由器上配置 OSPF。本练习将帮助你巩固对配置和故障排除\
  \ OSPF 的理解。在本练习中，你将在两台路由器（VAN-R1 和 LA-R1）上配置 OSPF。你的路由器应按照以下网络图进行配置：\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_724_0.png)\n\

  ## 使用不重叠信道


  排查无线网络时请记住，您可能会受到其他无线设备和家用设备（例如无绳电话或运行在同一信道上的蓝牙设备）的干扰。要解决此问题，请尝试更改无线网络使用的信道以减少接收到的干扰量。如表
  15-2 所示，相邻信道具有重叠频率并会相互干扰，因此从信道 2 更改到信道 1 无法解决干扰问题，但从信道 2 更改到信道 6 可能可以。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_887_0.png)


  **提示** 为避免其他家用物品对无线网络造成干扰，请尝试购买运行频率不同于 2.4 GHz 的物品（例如无绳电话）。如果无线网络出现问题，您可以尝试更改无线设备上的信道，看看不同的信道是否更可靠。还请注意，其他非无线设备（例如微波炉）可以通过在
  2.4 GHz 频率范围内产生噪声信号来造成干扰。


  信道具有特定的“宽度”，该宽度允许特定数量的数据通过信道（称为 *带宽*）。此处要指出的是，具有更大信道带宽的无线标准将能够传输更多数据并提供更好的性能。例如，802.11g
  的信道带宽为 20 MHz，而 802.11n 的信道带宽可达 40 MHz（在 5 GHz 频率下运行时）。增加信道带宽是较新无线标准提供更高传输速率的方式。以下列出了每个标准的信道带宽：


  - 802.11a: 20 MHz

  - 802.11b: 22 MHz

  - 802.11g: 20 MHz

  - 802.11n: 20 or 40 MHz

  - 802.11ac: 20, 40, 80, or 160 MHz


  ## 无线安全协议


  多年来，已开发出多种无线身份验证和加密协议，以帮助保护您的无线网络。您应考虑在无线网络上实施这些协议。


  ## 有线等效隐私


  有线等效隐私 (WEP) 旨在为无线世界提供与有线网络世界相当的安全级别。在有线世界中，有人必须身处您的办公室才能将电缆连接到您的网络，但对于无线网络，当然情况并非如此。有人可以坐在您大楼外的停车汽车里并连接到您的无线网络。


  要使用 WEP 配置无线网络，您只需在 WAP 上指定一个共享密钥或通行短语即可。其原理是，如果有人想连接到您的无线网络，他们需要知道共享密钥，并需使用该密钥配置其工作站。当您在
  AP 和客户端上配置共享密钥时，客户端和 AP 之间发送的任何数据都会使用 WEP 进行加密。这将防止未经授权的个人截获传输中的数据并读取它。


  请注意，WEP 在其实现加密和密钥使用方面存在巨大缺陷，因此，64 位和 128 位 WEP 都很容易被破解。出于安全考虑，除非您拥有不支持 WPA 或 WPA2
  的旧版 AP，否则不应使用 WEP。


  ## Wi-Fi 保护访问


  Wi-Fi 保护访问 (WPA) 的设计旨在改进无线安全并修复 WEP 中的一些缺陷。WPA 使用 128 位密钥和临时密钥完整性协议 (TKIP)，该协议用于更改每个发送数据包的加密密钥。这将使黑客更难破解密钥，而使用
  WEP 破解密钥非常容易。WPA 使用 RC4 作为对称加密算法，这就是为什么 WPA 有时被称为 TKIP-RC4（如 CCNA 目标中所述）。


  WPA 相较于 WEP 还有许多其他改进；例如，它具有改进的完整性检查，并支持使用可扩展身份验证协议 (EAP) 进行身份验证，EAP 是一种非常安全的身份验证协议，支持多种身份验证方法，例如
  Kerberos、令牌卡、证书和智能卡。


  EAP 消息被封装在 IEEE 802.1X 数据包中，用于有线或无线网络的网络访问身份验证。当使用 IEEE 802.1X 控制对无线网络的访问时，无线客户端会尝试连接到
  WAP；AP 会向客户端请求身份证明，然后将其转发到 RADIUS 服务器进行身份验证。


  多年来，EAP 发展出了许多变体：


  - **LEAP** 轻量级可扩展身份验证协议是 Cisco 在 IEEE 创建 802.1X 之前创建的专有 EAP 解决方案。

  - **PEAP** 受保护的可扩展身份验证协议用于通过使用传输层安全协议 (TLS) 的安全隧道封装 EAP 消息。因为 EAP 假设数据包通过安全网络发送，所以使用
  PEAP 时，TLS 用于在两个点之间创建安全隧道。

  - **EAP-FAST** EAP-FAST 是 Cisco 设计用于替代 LEAP 的身份验证协议。EAP-FAST 通常用于为无线网络提供身份验证服务。

  - **EAP-TLS** EAP-TLS 是用于在无线网络上进行安全身份验证的 EAP 协议，该协议使用 TLS 安全性。EAP-TLS 解决方案通常涉及使用客户端证书来执行身份验证。

  - **EAP-TTLS** EAP-TTLS (EAP-隧道式传输层安全协议) 在 EAP-TLS 的基础上开发，具备同时验证客户端和服务器的功能，尽管客户端不需要使用证书进行身份验证。在使用服务器证书建立安全信道后，服务器可以对客户端进行身份验证。


  在无线网络上配置 WPA 时，请注意 WPA 有三种不同的模式——WPA 个人版、WPA 企业版和开放模式：


  - **WPA 个人版** 使用 WPA 个人版（又称 WPA-PSK，即 WPA 预共享密钥），您可以使用一个起始密钥值（称为预共享密钥）配置 AP，然后用于加密流量。此模式最常由家庭用户和小型企业使用。

  - **WPA 企业版** WPA 企业版（又称 WPA-802.1X）是一种 WPA 实现，它使用集中式身份验证服务器（例如 RADIUS 服务器）进行身份验证和审计功能。大型组织使用
  WPA 企业版，以便他们可以使用其




  现有身份验证服务器以控制谁有权访问无线网络并记录网络访问。


  - **开放** 开放式无线网络连接不需要任何密码，也不使用任何形式的加密来防止无线数据被窥探者窃取。当然，不建议让您的无线网络保持开放状态（您应该实现 WPA2），也不建议将您的客户端系统连接到您不熟悉的开放网络。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_890_0.png)


  **考试提示** CCNA 认证考试将测试您对 WPA、WPA2、WPA3 和开放网络等不同安全协议的了解。请务必始终实施设备支持的最安全方法；这通常是 WPA2。


  ## WPA2


  WPA2 改进了 WPA 的安全性，如果有选择，应使用 WPA2 而非 WPA。WPA2 在 WPA2 无线网络上使用带有密码块链消息身份验证码协议的计数器模式（CCMP
  或 CCM 模式协议）来实现数据隐私、完整性和身份验证。WPA2 使用与高级加密标准（AES）协议（有时也称为 CCMP-AES）结合的 CCMP 来加密无线流量，而不使用
  TKIP，并支持其他功能，例如对自组网络和密钥缓存的附加保护。因为 WPA2 将 AES 用作其加密协议，所以它支持 128 位、192 位和 256 位加密。


  WPA2 还通过使用 EAP 支持 TLS 和 TTLS 协议。这些协议被称为 EAP-TLS 和 EAP-TTLS，它们提供在无线网络上执行身份验证的安全方法。


  ## WPA3


  WPA3 是 WPA 的最新版本，于 2018 年开发，正在逐渐被制造商采用。因为 WPA3 相当新，您可能只在较新的无线设备上将其作为选项。WPA3 通过引入一些新功能，改进了
  WPA2 的安全性：


  - 它通过使用 256 位 Galois/计数器模式协议（GCMP-256）进行数据加密来改进加密。

  - 同时身份验证对等体（SAE）是 WPA3 的一项功能，它通过允许接入点对客户端进行身份验证，并允许客户端对接入点进行身份验证来提高安全性。这种更强的身份验证方法有助于防止
  WPA2 中常见的握手流量窃听和破解。

  - WPA3 的加密过程使用会话密钥，旨在保护用户，即使两者都使用了相同的 Wi-Fi 密钥，也无法解密另一用户的流量。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_891_0.png)


  **考试提示** 请务必熟悉 CCNA 考试的不同无线安全协议。


  ## Cisco 无线架构


  在设计无线网络时，您可以使用不同的 Cisco 无线架构以及不同的 Cisco WAP 模式。并且，您可以连接到 AP 以执行远程管理。


  ### 无线架构


  您可以以不同方式设置 Cisco 无线网络：每种设置称为无线架构。某些无线架构很简单，仅涉及一个 WAP，而其他架构则拥有 WLC 以帮助管理多个 AP 上的无线设置。


  ## 无线安全实践


  ### 身份验证和授权


  CCNA 考试期望您熟悉通过*身份验证*和*授权*控制谁可以访问无线网络的技术。


  ### 共享或开放


  开放式无线网络（也称为共享网络）不实施任何方法来控制谁可以访问网络。它是所有无线网络类型中安全性最低的一种。


  ### 预共享密钥


  您可以通过在个人模式下配置 WPA2 或 WPA3 等加密协议，然后指定加密密钥（也称为预共享密钥）来控制谁可以访问无线网络。任何想要连接到您的无线网络的设备都需要配置此加密密钥。


  ### MAC 过滤


  除了使用预共享密钥外，您还可以配置 MAC 过滤，该功能根据 MAC 地址授权谁可以访问网络。请记住，可以使用许多工具来监控无线流量并查看连接到接入点的授权客户端的
  MAC 地址。攻击者随后可能会伪造 MAC 地址以绕过 MAC 过滤功能。


  ### 802.1X


  在企业模式下使用 WPA2/WPA3 时，必须在接入点或 WLC 的配置中指定 RADIUS 或 TACACS+ 服务器的 IP 地址。这意味着接入点/WLC
  会将客户端转发到 RADIUS 服务器进行身份验证，然后才授予其访问网络的权限。802.1X 的好处是，您可以不仅通过预共享密钥来验证用户身份，还可以使用用户名和密码针对中央身份验证服务进行身份验证。


  ### 自主架构


  在自主架构模型下，您的 Cisco 无线网络由独立的 AP 组成，通常使用 AP 的 GUI 单独进行管理。每个 AP 可以提供一个或多个 SSID，每个 SSID
  关联到不同的 VLAN。


  使用此模型，每个 SSID 关联到一个 VLAN，并且 AP 使用中继端口连接到交换机。中继端口被配置为承载每个 VLAN 的所有流量。


  在这种情况下，如果您需要向所有 AP 添加新的无线网络（SSID），则必须单独配置每个 AP，因为它们各自独立运行。


  ### 分布式 MAC 架构


  分布式 MAC 架构提供了一个更集中的模型，其中使用 WLC 将配置部署到每个 AP。在这种情况下，AP 称为轻量级接入点（LAP），因为它们从 WLC 接收配置，而不是直接配置。


  在此模型中，WLC 用于部署配置设置，例如要使用的无线电频率、服务质量（QoS）设置、任何涉及 TACACS+/RADIUS 服务器配置的身份验证、授权和计费（AAA）设置以及策略设置。


  在分布式 MAC 架构模型中，无线接入点控制和配置协议（CAPWAP）是一种安全的私有隧道，用于在 WLC 和 LAP 之间传输通信。WLC 和 LAP 之间的所有通信都通过
  CAPWAP 进行。实际上有两条隧道：一条用于控制通信，另一条用于数据：


  - 控制通道承载命令，默认情况下是加密的。CAPWAP 控制通道使用 UDP 5246。

  - 数据通道默认情况下不加密，但可以加密。CAPWAP 数据通道使用 UDP 5247。


  ### 基于云的架构


  在基于云的架构中，WLC 不是您物理网络上的设备，而是由云提供商提供并驻留在云端。基于云的 WLC 提供与连接到您的 LAN 的 WLC 相同的功能，但您可以获得由云提供商管理的云设备的优势。基于云的架构模型包括
  Cisco Meraki 许可证和 Cisco Catalyst 9800-CL，它们为无线网络提供 WLC 功能。


  ### WLC 定位


  您需要了解 WLC 在网络中扮演的角色，以便了解应将 WLC 物理放置在何处。架构类型包括集中式 WLAN、Cisco FlexConnect 模式和融合式 WLAN。


  ### 集中式 WLAN 架构


  在集中式 WLAN 架构中，您使用 WLC 来管理 LAP。所有发往 LAP 的通信都必须通过 WLC 以验证通信是否经过授权（请记住，WLC 可以提供 AAA
  功能）。这意味着，当数据从一个无线设备传输到另一个无线设备时，连接到 LAP 的两个无线客户端之间的通信必须经过 WLC（然后再返回）。如果 WLC 与 LAP
  之间物理距离较远，这可能会导致延迟甚至中断问题。


  应仔细考虑 WLC 的位置。如果您将 WLC 放置在与 LAP 相对的网络端，则承载 LAP 和 WLC 之间流量的 CAPWAP 隧道必须穿越网络，从而导致延迟。此外，因为
  LAP 必须能够与 WLC 通信，如果在集中式 WLAN 架构中 WLC 或 CAPWAP 隧道出现故障，则无线设备将被断开网络连接（即使 LAP 正常工作）。您可以通过更改
  AP 上的模式（稍后介绍）或将 WLC 放置在更靠近 LAP 的位置来解决此问题。


  ### Cisco FlexConnect






  思科 FlexConnect 模式在 LAP 上允许 LAP 直接将数据传输到 LAN，而无需将数据通过 WLC 传输。此外，LAP 可以对客户端进行身份验证，以便客户端获得无线访问权限，而在集中式模型中，所有身份验证均由
  WLC 执行。使用思科 FlexConnect 模式时，如果 CAPWAP 隧道失败，LAP 仍能正常工作，因为它们拥有自身的配置，并被授权将流量传递到网络并对无线客户端进行身份验证。当您的
  WLC 位于总部且分支机构部署有 LAP 时，思科 FlexConnect 模式是一种常用选择。


  ## 汇合式 WLAN 架构


  为确保 WLC 与 LAP 之间的通信高效且可靠，在汇合式 WLAN 架构中，WLC 和 LAP 连接到同一台交换机。这些交换机可以是接入层交换机或分布层交换机。这样，LAP
  可以通过交换机与 WLC 快速通信，而无需流量跨越整个网络。在汇合式 WLAN 架构中，您需要为网络的不同部分部署多个 WLC。其优势在于 CAPWAP 隧道在
  LAP 与其 WLC 之间的距离更短。这种拓扑结构可实现更快的 Wi-Fi 访问，延迟更少。


  ## AP 模式


  您刚刚了解到可以更改 AP 模式以修改 AP 的使用方式和操作方式。对于 CCNA 考试，您需要熟悉这里列出的多种不同的接入点模式。


  ### 本地模式


  这是 LAP 的默认模式，涉及我们之前描述的内容：LAP 与 WLC 之间建立 CAPWAP 隧道，所有流量必须通过 CAPWAP 传输到 WLC。如果 CAPWAP
  失败，该 LAP 上的所有无线客户端都会断开连接。


  ### 桥接模式


  当您希望使用 AP 连接两个网络（例如相距较远的两栋楼的网络）时，会使用此模式。在这种场景中，充当桥梁的 AP 已对远程无线网络进行身份验证，但远程建筑中的设备未经过验证。


  ### FlexConnect 模式


  在此模式下，LAP 位于分支机构，而 WLC 位于总部。LAP 可以在客户端与 LAN 之间直接转发流量，而通常情况下流量需要发送到 WLC。这是一项重要功能，因为它减少了因通过
  WAN 发送流量到达 WLC 而导致的网络延迟。在 FlexConnect 模式下，LAP 还可用于对无线客户端进行身份验证和授权。请记住，在 FlexConnect
  模式下，即使 CAPWAP 隧道失败，LAP 仍能正常工作。


  ### Mesh 模式


  此模式代表另一种特殊场景模式，其中一个 WAP 连接到另一个 WAP，本质上充当无线网络的扩展器。当无线客户端连接并将数据发送到 LAN 时，数据可能在到达 LAN
  之前经过多个 Mesh 节点。Mesh 节点（Mesh 拓扑中的 AP），也称为 Mesh 接入点（MAP），使用自适应无线路径协议（AWPP）来确定到根接入点（RAP）的最佳路径。


  ### 监听模式


  此模式用于监控连接到网络的非法 AP 的活动。以监听模式运行的 AP 不会发送无线信号，而仅接收无线信号以检测非法 AP。


  ### 抓包模式


  要分析无线流量，您可以将 AP 配置为抓包模式。配置抓包模式后，AP 将捕获无线流量并将其发送到远程计算机进行分析。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_896_0.png)


  **考试提示** 务必了解 Cisco CCNA 认证考试所需的 AP 模式。


  ## 管理访问连接


  在管理或配置 WAP 或无线 LAN 控制器时，您可以使用 CLI 或 Web 界面。


  ### 从 CLI 管理


  您可以通过设备上的控制台端口进行本地管理，或者如果已启用使用 Telnet 或安全外壳（SSH）的远程管理，则可以使用这些协议来通过 CLI 管理 AP 或 WLC。对于许多
  AP 和无线控制器，您可以连接到本地控制台端口以从 CLI 配置设备。当然，这假设您可以本地访问设备。您还可以在 AP 或无线 LAN 控制器上启用 Telnet
  或 SSH，以便从网络远程管理设备。如您在后续章节中将了解到的，应优先使用 SSH 而不是 Telnet，因为 SSH 会加密通信。


  ### 从 Web 界面管理


  如果您不希望使用 CLI 配置 WAP 或 WLC，可以通过连接到设备的管理 IP 地址来使用 Web 界面。使用 HTTP（非安全）或 HTTPS（安全）配置
  AP 或 WLC，包括配置 Telnet 或 SSH、配置 RADIUS 用于集中身份验证或创建无线网络等（这只是几个配置选项示例）。


  ### TACACS+/RADIUS


  您可以配置 AP 或 WLC 以使用 TACACS+ 或 RADIUS 等身份验证服务。您将在接下来的几章中了解更多有关身份验证服务的信息，但目前需要知道，您可以要求
  AP 或 WLC 让连接的人通过外部身份验证系统（TACACS+ 或 RADIUS 服务器）进行身份验证。


  ## 使用 GUI 配置无线


  新的 Cisco CCNA 考试要求您了解创建和配置无线 LAN 以及安全设置和 QoS 设置等设置的步骤。在本节中，您将学习在 WLC 上配置无线网络的步骤。


  我应该指出，许多 WLC 都有一个服务端口，这是一种带外管理端口，您可以使用它连接到 WLC 并配置设备。还有一个已分配 IP 地址的管理接口，您也可以使用它远程管理
  WLC 设备。如果您无法连接到管理接口，服务端口是管理设备的一个良好备份方法。


  ## 创建 WLAN


  配置 WLAN 控制器的第一步是创建 WLAN。您需要将 WLAN 连接到 WLC 上的动态接口，该接口可使 WLAN 绑定到有线网络上的 VLAN。


  ### 创建动态接口


  我们的第一项任务是创建动态接口，该接口用于将 WLAN 与交换机上的 VLAN 相关联。步骤如下：


  - 1. 使用 Web 界面登录到 WLC。

  - 2. 在页面顶部选择 Controller。

  - 3. 从左侧导航窗格中选择 Interfaces。

  - 4. 单击右上角的 New 按钮以创建新接口。

  - 5. 输入接口名称，例如 ACCT。

  - 6. 指定要将接口连接到的 VLAN ID。例如，您可以指定 10（即 VLAN ID 10）。

  - 7. 为接口配置 VLAN 网络范围内的 IP 地址。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_899_0.png)


  ### 创建 WLAN


  您的下一项任务是在 WLC 中创建将绑定到该接口的 WLAN 对象。执行以下步骤：


  - 1. 从顶部导航中单击 WLANs 链接。

  - 2. 从右上角的下拉列表中选择 Create New，然后单击 Go。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_900_0.png)


  - 3. 输入 WLAN 的配置文件名称，例如 ACCT。

  - 4. 输入无线 LAN 的 SSID，例如 ACCT。

  - 5. WLAN 在 WLC 中被分配了唯一 ID。单击 Apply。


  单击 Apply 后，您将看到 WLAN 的配置屏幕，可以在其中更改常见设置，例如 SSID、WLAN 分配到的 WLC 上的动态接口，以及是否要广播 SSID。请注意，在下图中，我已将
  ACCT 无线网络分配给了在上一步中创建的名为 ACCT 的动态接口。


  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_901_0.png)


  ### 安全设置


  在修改 WLAN 配置时，您可以选择 Security 选项卡来更改 WLAN 的安全设置。


  - 1. 在屏幕顶部选择 Security 选项卡。

  - 2. 选择 WPA+WPA2 作为第 2 层安全协议。

  - 3. 在 WPA+WPA2 Parameters 部分中选择 WPA2 Policy。

  - 4. 然后可以选择 AES 作为 WPA2 Encryption 类型。

  - 5. 选择 PSK（预共享密钥）作为身份验证密钥管理类型。

  - 6. 选择 ASCII 作为 PSK Format。

  - 7. 输入所需的预共享密钥（无线密码）。






  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_902_0.png)


  ## QoS 配置文件


  配置完无线安全设置后，您可以选择为无线网络配置 QoS 设置。选择 QoS 配置文件将指定 WLC 应如何处理并确定来自此无线网络流量的优先级。您可以从以下 QoS
  配置文件中选择一个：


  - Platinum（用于确保语音流量的高服务质量）

  - Gold（用于确保视频流量的高服务质量）

  - Silver（用于常规流量——默认值，被视为尽力而为配置文件）

  - Bronze（用于背景流量，因为其分配到的带宽最低）


  选择最符合您需求的配置文件。请记住，针对认证考试，VoIP 流量应使用 Platinum QoS 配置文件。


  ## 高级无线 LAN 设置


  选择 QoS 配置文件后，单击“高级”选项卡以设置无线网络的高级设置。在此处，您可以指定诸如会话超时值等设置，即客户端必须重新向 WLAN 进行身份验证的频率；配置诸如点对点
  (P2P) 阻止、URL 过滤等功能，以控制客户端访问的 URL，以及可连接的最大客户端数量。


  1. 选择所需的高级设置。

  2. 单击“应用”以完成配置。


  ## 配置 RADIUS/TACACS+


  如果您希望将无线网络配置为使用 RADIUS 服务器或 TACACS+ 服务器作为连接到您无线网络的客户端的身份验证服务，则需要执行几个配置步骤。首先，必须将
  RADIUS/TACACS+ 服务器添加到配置中，然后才能在配置无线 LAN 时选择该服务器。


  要将 RADIUS/TACACS+ 服务器添加到控制器：


  1. 从顶部导航栏中选择“安全”链接。

  2. 单击“新建”按钮以添加新 RADIUS 服务器。

  3. 输入 RADIUS 服务器的 IP 地址，并填写共享密钥/确认共享密钥。共享密钥是连接到 RADIUS 服务器所需的密码。

  4. 选择“应用”。


  现在，您已添加 RADIUS 服务器，可以返回 WLAN 并将 WLAN 配置为使用该 RADIUS 服务器。按以下步骤将 WLAN 配置为使用 RADIUS
  服务器：


  1. 在顶部导航栏中选择 WLANs 链接。

  2. 单击要编辑的 WLAN 的链接。

  3. 在 WLAN 设置中选择“安全”选项卡。

  4. 选择“AAA 服务器”选项卡。

  5. 从服务器 1 下拉列表中选择 RADIUS 服务器的 IP 地址。

  6. 在右上角选择“应用”。



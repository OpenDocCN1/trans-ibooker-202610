  \ 任务 3：子网划分 C 类地址\n\n你的经理购买了一个 C 类网络范围，并要求你将此 C 类网络子网划分为两个子网，以构建两个网络段。一个网络段将托管客户用于在线订购的客户端机器，另一个段将托管员工使用的企业机器。你购买的\
  \ C 类网络 ID 为 216.83.11.0。再次拿一张纸，先写出该 C 类地址的默认子网掩码。然后开始操作主机位以获取网络 ID、第一个有效主机 ID、最后一个有效主机\
  \ ID、广播地址和新的子网掩码。计算完所有所需信息后，填写下面的表格：\n\n| 网络 ID | 第一个有效地址 | 最后一个有效地址 | 广播地址 |\n\
  |---|---|---|---|\n| 子网 1 |  |  |  |\n| 子网 2 |  |  |  |\n\n两个子网的新子网掩码是_______________。\n\
  \n本节已向你介绍了子网划分的概念，你需要在 CCT/CCNA 考试中非常熟练地掌握它。确保你熟悉如何识别各类地址，并且对如何将它们分解为多个子网有扎实的理解！\n\

  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_573_0.png)\n\n**视频 10.01.** 本书附带的数字资源包含在两台交换机上配置\
  \ VTP 的多媒体演示。\n\n## 生成树协议\n\nSTP 的主要功能（从逻辑上讲）是从拓扑中消除二层环路。数字设备公司（DEC，现为惠普（HP）的一部分）最初开发了\
  \ STP。电气与电子工程师协会（IEEE）增强了 STP 的初始实现，形成了 IEEE 802.1d 标准。由于 STP 的两种不同实现（DEC STP 和\
  \ 802.1d）彼此不兼容，你需要确保所有设备支持其中一种。802.1d 中增加了 Rapid STP（RSTP）和 Multiple STP（MSTP）。基于这些增补，IEEE\
  \ 当前的实现被称为 802.1D。Cisco 的所有交换机都支持 IEEE 802.1D 协议，并且在其交换机上默认启用；发送无标记帧（本征 VLAN）时会启用该协议。如果你的环境是混合厂商环境，其中一些设备运行\
  \ 802.1D，另一些运行 DEC 的 STP，则可能会遇到二层环路问题。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_573_1.png)\n\
  \n**注意** 通常，IEEE 使用小写字母（例如 d）表示草案或仍在开发的状态，使用大写字母（例如 D）表示最终确定的标准。在本书中，提到 802.1d 时，指的是\
  \ IEEE 对 STP 的原始实现，不包括 RSTP 和 MSTP。RSTP 将在本章后面介绍，但 MSTP 超出了本书的范围。\n\n## 桥协议数据单元\n\
  \n为使 STP 正常工作，交换机需要共享有关自身及其连接的信息。它们共享的是桥协议数据单元（BPDU），这些单元以*组播*帧的形式发送，只有其他二层交换机或网桥会侦听这些帧。交换机将使用\
  \ BPDU 来学习网络拓扑：哪台交换机连接到其他交换机，以及基于该拓扑是否存在任何二层环路。\n\n为防止网络中出现环路，交换机会在逻辑上禁用拓扑中的一个或多个端口，以确保不存在环路。请注意，交换机实际上并不会关闭端口，而是将端口置于一种特殊的禁用状态以处理用户流量，本章后面的“端口状态”部分将对此进行讨论。当端口被置于这种特殊禁用状态时，网络中的环路就被阻止，数据在交换机之间只能沿一条路径传输。如果二层网络发生任何变化——链路断开、新增链路、新增交换机或交换机故障——交换机将共享此信息，导致\
  \ STP 算法重新执行，然后创建新的无环拓扑。\n\n默认情况下，BPDU 每两秒发送一次。这有助于加快收敛。*收敛*是网络中的一个术语，用于描述处理变化并使网络恢复运行所需的时间。发现并解决问题的时间越短，网络恢复在线的速度就越快。将\
  \ BPDU 通告时间设置为两秒，可以使变化快速与网络中所有其他交换机共享，从而减少任何中断造成的时间。\n\nBPDU 包含大量信息，可帮助交换机确定拓扑以及该拓扑导致的任何环路。例如，每个网桥都有一个唯一标识符，称为*网桥*或*交换机*\
  \ ID。这通常是交换机的优先级和交换机本身的 MAC 地址。当交换机通告 BPDU 时，它会将自己的交换机 ID 放入 BPDU 中，以便接收交换机能够判断它正从哪台交换机接收拓扑信息。\n\
  \n以下各节介绍在二层网络中执行 STP 时发生的步骤。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_575_0.png)\n\
  \n**考试提示** 请记住，STP 是一种二层协议，用于防止网络中的环路。STP 实现 IEEE 802.1d 标准，其中涉及让交换机交换 BPDU，以帮助检测网络中的环路。*桥协议数据单元*（BPDU）消息是在交换机之间发送的特殊帧，用于共享配置和维护无环生成树网络所需的信息。BPDU\
  \ 消息每两秒以组播形式发送。BPDU 包含有关网络中端口和交换机的信息。\n\n## 根交换机\n\n如你所知，STP 用于发现并消除二层网络中的环路。STP\
  \ 算法的工作方式类似于链路状态路由协议（例如开放最短路径优先（OSPF））确保不创建三层环路的方式；当然，STP 只处理二层环路。\n\n首先创建生成树。基本上，生成树是一棵倒置的树。树的顶部是根，在\
  \ STP 中称为*根交换机或根网桥*。从根交换机开始，分支（物理以太网连接）延伸并连接到其他交换机，然后这些交换机的分支又连接到其他交换机，依此类推。\n\n\
  看一下图 10-4 所示的网络物理拓扑，它展示了一棵生成树。运行 STP 时，会构建一个逻辑树结构，类似于图 10-5 所示。如图 10-5 所示，Switch-A\
  \ 是根交换机，位于树的顶部。它的下方有两个分支，分别连接到 Switch-B 和 Switch-C。这两台交换机连接到 Switch-E，从而形成环路。Switch-B\
  \ 还连接到 Switch-D。此时，STP 仍在运行，环路仍然存在。当 STP 运行时，交换机将确定，在四个\n\n交换机—Switch-A、Switch-B、Switch-C、和\
  \ Switch-E—哪个端口会在逻辑上被禁用以移除环路。这确保从网络中的一台设备到任何其他设备，只会使用一条路径来连接设备。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_576_0.png)\n\
  \n图 10-4 第二层物理环路拓扑\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_576_1.png)\n\n图 10-5\
  \ 第二层 STP 逻辑拓扑\n\n实际上，STP 的第一步是选举根交换机。BPDU 用于选举过程。如前所述，当设备通告 BPDU 时，交换机会将其交换机 ID\
  \ 放入 BPDU 中。交换机 ID 用于选举根交换机。拥有 *最低* 交换机 ID 的交换机被选为根。交换机 ID 由两个组件组成：\n\n- 交换机的优先级，在\
  \ Cisco 交换机上默认为 32,768（长度为 2 字节）\n- 交换机的 MAC 地址（长度为 6 字节）\n\n在 Cisco 交换机上，默认优先级为\
  \ 32,768，由 IEEE 802.1d 定义。假设所有交换机均为 Cisco 交换机且未更改默认优先级，则 MAC 地址 *最低* 的交换机将被选为根交换机。您可以通过更改分配给交换机的优先级值来覆盖选举过程。如果希望某台交换机成为根，请为其分配低于\
  \ 32,768 的优先级值。通过共享 BPDU，交换机将确定哪台交换机的交换机 ID 最低，并选出该交换机作为根交换机。请注意，此选举过程在每台交换机上几乎同时进行，每台交换机都会得出相同的结果。\n\
  \n实现 VLAN 的 Cisco Catalyst 交换机（第 9 章中讨论）会为每个 VLAN 具有不同的交换机 ID *per* VLAN 和 *单独*\
  \ 的每个 VLAN STP 实例。每个 VLAN 都有自己的根交换机（可以是所有 VLAN 的同一交换机，也可以是每个 VLAN 不同的交换机）。在每个 VLAN\
  \ 内，STP 将运行并移除该特定 VLAN 中的环路。Cisco 将此概念称为 *每 VLAN STP* (PVST)。此主题将在“每 VLAN 生成树+ (PVST+)”部分中稍后讨论。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_577_0.png)\n\n**考试提示** 考试题目将要求您记住，交换机（网桥）ID\
  \ 最低的交换机会被选为根交换机。\n\n每当网络中发生拓扑变化（例如根交换机故障或添加新交换机）时，根交换机的选举过程就会发生。第 2 层拓扑中的所有其他交换机都期望在\
  \ *最大老化时间* 内收到来自根交换机的 BPDU，默认值为 20 秒。如果交换机在此期间未收到来自根的 BPDU 消息，则会假设根交换机已失败，并将启动新的选举过程以选择新的根交换机。\n\
  \n## 根端口\n\n选举根交换机后，网络中的每台其他交换机都需要选择自身的一个端口，用于到达根。每台交换机上的此端口称为 *根端口*。对于某些交换机（例如图\
  \ 10-4 中的 Switch-D），这非常简单——它只有一个端口可用于访问交换拓扑。但是，其他每台交换机（例如图 10-4 中的 Switch-B、Switch-C\
  \ 或 Switch-E）可能有两个或多个端口可用于到达根交换机。如果有多个端口选项，需要使用智能方法来选择最佳端口。在 STP 中，选择根端口时会考虑几个因素。需要注意的是，根交换机本身永远不会有根端口——它是根，因此不需要端口来到达自身！\n\
  \n## 端口代价和优先级\n\n首先，每个端口都会分配一个 *端口代价*。代价越低，端口越优，如表 10-3 中 802.1d 的代价列表所示。代价是端口带宽的反向映射。交换机始终优先选择代价较低的端口，而非代价较高的端口。每个端口也会分配一个优先级，称为\
  \ *端口优先级* 值，默认值为 32。同样，交换机会优先选择较低的优先级值，而非较高的值。\n\n**表 10-3 STP 的端口代价**\n\n| 连接类型\
  \ | 新代价值 |\n|---|---|\n| 10 Gbps | 2 |\n| 1 Gbps | 4 |\n| 100 Mbps | 19 |\n| 10\
  \ Mbps | 100 |\n\n## 路径代价\n\n*路径代价* 从根交换机开始计算。路径代价基本上是从根交换机到拓扑中其他交换机的累积端口代价。当根从其接口通告\
  \ BPDU 时，BPDU 帧中的默认路径代价值为 0。当连接的交换机接收此 BPDU 时，它会将本地入站端口的代价加到路径代价上。如果该端口是 Fast Ethernet\
  \ 端口，则路径代价计算如下：0（根的路径代价）+ 19（交换机的端口代价）= 19。当该交换机向其后面的交换机通告 BPDU 时，将包含更新后的路径代价。随着\
  \ BPDU 从根交换机越来越远地传播，累积路径代价值会越来越高。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_579_0.png)\n\
  \n**考试提示** 请记住，路径代价是在 BPDU 进入端口时递增，而不是在通告 BPDU 时。\n\n## 根端口选择\n\n如果交换机有两个或多个路径可选以到达根，则需要选择一条路径，因此只有一个根端口。交换机在选择根端口时将经历以下\
  \ STP 步骤：\n\n- 1. 在两个或多个可选路径中，选择到达根的累积路径代价 *最低* 的路径。\n- 2. 如果存在多个累积路径代价相同的可达根的路径，交换机将选择\
  \ *交换机 ID 值最低* 的相邻交换机（即交换机将通过该交换机到达根）。\n- 3. 如果多条路径均通过同一相邻交换机，则选择优先级值最低的本地端口。\n\
  - 4. 如果端口之间的优先级值相同，交换机将选择交换机上物理编号最低的端口。例如，在 2960 上，这将是 FastEthernet 0/1 或 Gigabit\
  \ 0/1。\n\n经过此选择过程后，交换机将只有一个、且只有一个端口将成为其根端口。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_580_0.png)\n\
  \n**考试提示** 您将被测试在交换机上选择根端口所使用的四个步骤。\n\n## 指定端口\n\n您现在知道，每台交换机都有一个用于到达根交换机的根端口。除了每台交换机有一个根端口之外，每个网段也有一个用于到达根的端口，此端口称为指定端口。例如，假设一个网段连接了两台交换机，其中一台交换机将把此网段的流量转发到网络的其余部分。\n\
  \n运行 STP 的第三步是为网络中的每个网段在单台交换机上选举一个指定端口。选定的交换机（及其端口）应具有到达根交换机的最佳路径。以下是交换机在确定哪台交换机上的哪个端口将被选为特定\
  \ LAN 网段的指定端口时所采取的步骤：\n\n- 1. 将使用网段中累积路径代价到根交换机 *最低* 的连接交换机。\n- 2. 如果两台交换机之间的累积路径代价相同，则选择交换机\
  \ ID 最低的交换机。\n- 3. 如果碰巧是同一台交换机，但与 LAN 网段有两个单独连接，则选择优先级最低的交换机端口。\n- 4. 如果仍然平局（该交换机上的端口优先级相同），则选择交换机上物理编号最低的端口。\n\
  \n在对每个网段执行这些步骤后，每个网段将有一个连接交换机上的单一指定端口，用于到达根交换机。有时包含指定端口的交换机被称为 *指定交换机*。然而，此术语具有误导性，因为负责转发流量的是交换机上的端口。交换机可能连接到两个网段，但可能仅是其中一个网段的指定交换机；另一台交换机可能为第二个网段提供指定端口。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_581_0.png)\n\n**考试提示** 请记住为 CCNA 考试为网段选择指定端口的四个步骤。\n\
  \n有趣的是，根交换机上 *每个* 活动端口都是指定端口。这很合理，因为连接网段到达根的代价为 0，即最低的累积代价值。换句话说，这些 LAN 网段中的每一个都直接连接到根交换机，因此实际上，网段到达根交换机本身不需要任何代价。\n\
  \n## 端口状态\n\n参与 STP 时，端口可以处于以下五种状态之一：\n\n- 阻塞\n- 监听\n- 学习\n- 转发\n- 禁用\n\n在五种状态中，算法运行时仅使用前四种。以下部分将介绍\
  \ STP 的这些端口状态。\n\n\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_582_0.png)\n\n**视频**\
  \ 10.02. 本书附带的数字资源中包含一个多媒体演示，展示了如何使用STP防止二层环路。\n\n## 阻塞状态\n\n端口在以下三种情况之一会进入*阻塞*状态：\n\
  \n- 在选举根交换机期间（例如，当您打开网络中的所有交换机时）\n- 当交换机在某个端口上收到BPDU，表明存在一条比该交换机当前用于到达根的端口更好的路径时\n\
  - 如果端口不是根端口或指定端口\n\n处于阻塞状态的端口默认将保持该状态20秒（最大老化计时器）。在此状态下，端口仅监听和处理其接口上的BPDU。交换机在阻塞端口上收到的任何其他帧都将被丢弃。在阻塞状态下，交换机试图确定哪个端口将成为根端口，交换机上哪些端口需要成为指定端口，以及哪些端口将保持阻塞状态以断开任何环路。\n\
  \n## 监听状态\n\n20秒计时器到期后，根端口或指定端口将进入*监听*状态。任何其他端口将保持阻塞状态。在监听状态下，端口仍在监听BPDU并再次检查二层拓扑。同样，在此状态下端口处理的唯一流量由BPDU组成；所有其他流量都被丢弃。端口将在此状态下保持*转发延迟计时器*的时长。此值的默认值为15秒。\n\
  \n## 学习状态\n\n从监听状态，根端口和指定端口进入*学习*状态。在*学习*状态下，端口仍在监听和处理端口上的BPDU；但是，与监听状态不同，端口开始处理用户帧。在处理用户帧时，交换机检查帧中的源地址并更新其MAC或端口地址表，但交换机仍不将这些帧从目标端口转发出去。端口在此状态下保持转发延迟时间（默认15秒）的时长。\n\
  \n## 转发状态\n\n最后，在转发延迟计时器到期后，处于学习状态的端口进入*转发*状态。在转发状态下，端口将处理BPDU，使用收到的帧更新其MAC地址表，并通过端口*转发*用户流量。\n\
  \n## 禁用状态\n\n*禁用*状态是一种特殊的端口状态。处于禁用状态的端口不参与STP。这可能是因为端口已被管理员手动关闭、手动从STP中移除、因安全问题被禁用，或因缺少物理层信号（例如跳线被拔出）而无法正常工作。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_583_0.png)\n\n**考试提示** 记住STP（802.1d）中使用的四个主要端口状态：阻塞（20秒）、监听（15秒）、学习（15秒）和转发。STP收敛可能需要30到50秒。如果发现新的根或网络中出现拓扑变化（添加新交换机或交换机上端口状态发生变化），STP必须重新计算。还要记住以下几点：在阻塞和监听状态下，只处理BPDU。在学习状态下，正在构建MAC地址表。在转发状态下，用户帧在端口之间移动。STP将端口置于阻塞状态以消除环路。\n\
  \n## 二层收敛\n\n正如您在上一节中应该注意到的，STP经历一个分阶段的过程，这会*减慢*收敛速度。对于交换机，一旦STP完成，收敛即发生：根交换机被选举，根端口和指定端口被选定，根端口和指定端口处于转发状态，所有其他端口处于阻塞状态。\n\
  \n如果端口必须经历所有四个状态，收敛需要50秒：阻塞20秒，监听15秒，学习15秒。如果端口不必经历阻塞状态而从监听状态开始，收敛只需要30秒。这通常发生在根端口仍然有效但发生了另一个拓扑变化时。请记住，在此期间（直到端口达到转发状态），没有用户流量通过端口转发。因此，如果用户正在进行telnet会话，而STP正在重新计算，那么从用户的角度来看，telnet会话会显得停滞或连接似乎已丢失。显然，用户会注意到这种中断。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_584_0.png)\n\n**考试提示** 记住，对于CCNA考试，当所有根端口和指定端口处于转发状态且所有其他端口处于阻塞状态时，STP收敛已完成。\n\
  \n## PortFast概述\n\n收敛发生得越快，对用户造成的中断就越少。您可以减少这两个计时器以加速收敛时间，但如果您在更改它们时不清楚自己在做什么，这可能会产生更多问题。对于用户端口，您可以使用*PortFast*功能来加速收敛。PortFast应仅用于不会产生二层环路的端口，例如连接到PC、服务器和路由器的端口（有时称为用户端口或边缘端口）。\n\
  \n启用PortFast的端口始终处于转发状态——即使STP正在运行且根端口和指定端口正在经历其不同状态，也是如此。因此，当STP运行时，同一交换机上的PortFast端口仍然可以在彼此之间转发流量，从而在一定程度上限制STP中断。但是，如果这些设备想与其他交换机上连接的设备通信，它们必须等到STP完成且根端口和指定端口已进入转发状态。\n\
  \n当您想在工作站上使用预启动执行环境（PXE）引导时，PortFast是一个很好的配置选项，因为引导设备在启动时会立即尝试联系DHCP服务器。如果在此场景中不使用PortFast，工作站将无法在STP的50秒计时器到期之前联系到DHCP服务器。PortFast就是解决方案！\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_585_0.png)\n\n**警告** 连接到非交换机设备（如PC、服务器和路由器）的端口应配置PortFast。但是，请确保不要在连接到另一台二层交换机的端口上启用PortFast，因为您可能无意中创建二层环路，从而导致网络瘫痪。\n\
  \n## PortFast配置\n\nPortFast适用于Cisco交换机支持的所有STP版本。配置PortFast功能很简单，您可以在全局或逐接口的基础上启用它。要在全局启用它，请使用以下命令：\n\
  \n```\nSwitch(config)# spanning-tree portfast default\n```\n\n此命令在交换机上的所有非中继端口上启用PortFast。\n\
  \n要在接口上启用PortFast，请使用以下配置：\n\n```\nSwitch(config)# interface type [slot_#]/port_#\n\
  Switch(config-if)# spanning-tree portfast [trunk]\n```\n\n可选的**trunk**参数可在到非交换机设备（例如带有中继卡的路由器或服务器）的中继连接上启用PortFast。\n\
  \n## BPDU Guard功能\n\nBPDU Guard用于配置了PortFast功能的端口。在这种情况下，如果PortFast端口收到BPDU，交换机会立即禁用该端口。请记住，PortFast用于非交换机端口以使其保持转发状态；其假设是PortFast端口未连接到交换机，因此不应接收BPDU。\n\
  \n要启用BPDU Guard，请使用以下全局配置命令：\n\n```\nSwitch(config)# spanning-tree portfast bpduguard\
  \ default\n```\n\n使用 **show spanning-tree summary totals** 命令验证您的配置：\n\n```\nSwitch#\
  \ show spanning-tree summary totals\nRoot bridge for: none.\nPortFast BPDU Guard\
  \ is enabled\nUplinkFast is disabled\nBackboneFast is disabled\nSpanning tree default\
  \ pathcost method used is short\n```\n\n| 名称 | 阻塞 | 监听 | 学习 | 转发 | STP活动 |\n|------|----------|-----------|----------|------------|------------|\n\
  | 1个VLAN | 0 | 0 | 0 | 1 | 1 |\n\n在收到BPDU时，BPDU Guard操作会禁用配置了PortFast的端口。BPDU Guard将端口转换为errdisable（错误禁用）状态，并在控制台上显示一条消息。以下是此消息的示例：\n\
  \n```\n2001 May 23 18:13:12 %SPANTREE-2-RX_PORTFAST:Received BPDU on PortFast enable\
  \ port. Disabling 1/0/4\n```\n\n当端口处于错误禁用状态时，使用 **errdisable recovery cause bpduguard**\
  \ 命令移除错误禁用状态：\n\n\n```\nSwitch(config)# errdisable recovery cause bpduguard\n```\n\
  \n请注意，执行此命令时，您处于全局配置模式。\n\n或者，您可以通过配置带有间隔（以秒为单位）的命令，让交换机定期执行此操作：\n\n```\nSwitch(config)#\
  \ errdisable recovery interval seconds\n```\n\n此命令将每隔 x 秒自动清除所有端口上的所有 errdisable\
  \ 状态，包括 BPDU 违规。但是，如果再次发生 BPDU 违规，端口将重新进入 errdisable 状态。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_587_0.png)\n\
  \n**考试提示** 对于 CCNA 考试，请记住：当在配置了 PortFast 的端口上收到 BPDU 时，BPDU Guard 会通过将该端口置于错误禁用状态来立即禁用该端口。\n\
  \n## 每 VLAN 生成树增强版（PVST+）\n\nSTP 并不能保证优化、无环的网络。例如，看一下图 10-6 所示的网络，这是一个设计不佳的网络示例。在此示例中，网络有两个\
  \ VLAN，根交换机是 Switch-8。X 标记的是被置于阻塞状态以消除环路的端口。如果查看 VLAN 2 的此配置，它显然不是最优的。例如，Switch-1\
  \ 上的 VLAN 2 设备如果要访问 Switch-4 上的 VLAN 2 设备，必须经过 Switch-2、3、6、9、8，然后到 4。同样，Switch-5\
  \ 或 Switch-7 上的 VLAN 1 设备如果要访问 Switch-4 上的 VLAN 1 设备，必须先将流量转发到 Switch-8，然后再转发到 Switch-4。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_588_0.png)\n\n**图 10-6 STP 与 VLAN**\n\
  \n当只运行一个 STP 实例时，这被称为*公共生成树（CST）*。Cisco 还支持一种称为*每 VLAN 生成树增强版（PVST+）*的进程。使用 PVST+\
  \ 时，*每个* VLAN 都有自己的 STP 实例，拥有自己的根交换机、自己的优先级组和自己的 BPDU 组。在此场景中，BPDU 有一个附加字段，该字段是交换机或网桥\
  \ ID 的组成部分，包含以下三个子字段：交换机优先级、扩展系统 ID 和交换机的 MAC 地址。扩展系统 ID 是一个新字段，携带该 STP 实例的 VLAN\
  \ ID（VID）。\n\n添加此字段后，可以在不同 VLAN 中的交换机上设置不同的优先级；因此，您就可以拥有多个根交换机——每个 VLAN 一个。默认情况下，PVST+\
  \ 中的每个 VLAN 都会形成自己的无环拓扑。当然，PVST+ 和 CST 一样，不会自动创建优化的无环网络；但是，您可以在*每个* VLAN 中更改 STP\
  \ 设置，以优化每个单独 VLAN 的流量模式。强烈建议您为每个 VLAN 调整 STP 以进行优化。PVST+ 的另一个优点是，如果一个 VLAN 中发生 STP\
  \ 更改，不会影响其他 VLAN 的其他 STP 实例，从而使拓扑更加稳定。鉴于此，强烈建议您实施 VTP 剪枝，以从未使用这些 VLAN 的交换机中继上修剪掉这些\
  \ VLAN。本章前面的“VTP 剪枝”一节已讨论过剪枝。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_589_0.png)\n\
  \n**考试提示** 请记住，对于 CCNA 考试，PVST+ 支持每个 VLAN 一个 STP 实例，使您能够为每个 VLAN 调整出最优路径。CST 为*所有*\
  \ VLAN 仅支持一个 STP 实例。\n\n## 简单的 STP 示例\n\n为了帮助您更熟悉 802.1d STP 的工作原理，让我们看一个 STP 实际运行的示例。以图\
  \ 10-7 所示的网络为起点，并假设这些交换机不支持本章后面讨论的快速生成树（RSTP），仅支持 802.1d STP。我还假设只有一个 VLAN。每台交换机上的端口都用字母和数字标记。字母是端口标识符，数字是\
  \ BPDU 进入该端口时该端口的开销。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_590_0.png)\n\n\
  **图 10-7 STP 示例网络**\n\n### 选举根交换机\n\n所有这些交换机启动后，发生的第一件事就是选举根交换机。交换机之间相互共享 BPDU 以选举根交换机。在此示例中，所有交换机均使用默认优先级（32,768）。请记住，交换机\
  \ ID 最低的交换机将被选举为根交换机。由于所有交换机具有相同的优先级，因此 MAC 地址最低的交换机（即 Switch-1）被选为根交换机。根据选举过程，新的网络拓扑如图\
  \ 10-8 所示。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_591_0.png)\n\n**图 10-8 根交换机选举**\n\
  \n### 为每台交换机选择根端口\n\n选举出根交换机后，每台非根交换机必须选择一个用于到达根交换机的根端口。让我们逐台交换机来看，以便您详细了解决策过程。对于\
  \ Switch-1（即根交换机），没有根端口——如果您还记得的话，根交换机上的所有端口都是指定端口。\n\nSwitch-2 有两个端口可用于到达根交换机：E\
  \ 和 F。当 Switch-1 在端口 I 和 J 上生成 BPDU 时，原始路径开销设置为 0。当这些 BPDU 被其他交换机接收时，接收交换机会将路径开销增加接收该\
  \ BPDU 的端口开销。当 BPDU 进入端口 E 时，Switch-2 将路径开销增加到 20；对于端口 F，开销为 10。Switch-2 首先要做的检查是比较路径开销。端口\
  \ F 的路径开销最优，因此被选为根端口，如图 10-9 中的 RP 所示。Switch-3 也有两条到达根交换机的路径：通过端口 C 和 D。端口 C 的累计路径开销为\
  \ 10，而端口 D 的开销为 70。因此，端口 C 被选为根端口。Switch-4 也有两个可用于访问根交换机的端口：H 和 G。端口 H 的累计路径开销为\
  \ 30，而端口 G 的开销为 50，这导致 Switch-4 选择端口 H 作为根端口。Switch-5 的两个端口 A 和 B 的累计路径开销分别为 10\
  \ 和 40，这导致 Switch-5 选择端口 A 作为根端口。请注意，网络中的所有交换机同时运行 STP，并自行确定根交换机的位置以及自己的哪个端口应为根端口。下一节讨论的为网段选择指定端口也是如此。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_592_0.png)\n\n**图 10-9 根端口**\n\n### 为每个网段选择指定端口\n\
  \n选择根端口后，每台交换机将逐段确定其连接到该网段的端口是否应为指定端口。请记住，网段上的指定端口负责在该网段与第 2 层网络的其余部分之间来回传输流量。当然，网段本身完全不知道选择指定端口的这一过程——这是交换机在自行确定的。\n\
  \n在选择指定端口时，首先要检查的是（连接到该网段的）交换机到达根交换机的累计路径开销。对于连接到同一网段的两台交换机，累计路径开销最低的交换机将成为该网段的指定交换机，其连接到该网段的端口将成为指定端口。\n\
  \n回到我们的网络示例，让我们从最简单的网段开始：B 和 C。对于 LAN 网段 B，Switch-1 的累计路径开销为 0，Switch-2 为 20，Switch-5\
  \ 为 10。由于根交换机（Switch-1）的累计路径开销最低，其本地端口（J）成为 LAN 网段 B 的指定端口。LAN 网段 C 也是如此——根交换机的累计路径开销最低（0），使\
  \ Switch-1 上的端口 I 成为 LAN 网段 C 的指定端口。\n\nLAN 网段 A 有两个候选端口：Switch-3 的端口 D 和 Switch-4\
  \ 的端口 H。Switch-3 的累计路径开销较低：10，而 Switch-4 为 50。因此，Switch-3 的端口 D 成为 LAN 网段 A 的指定端口。\n\
  \nLAN 网段 D 也有两个指定端口候选：Switch-5 的端口 B 和 Switch-4 的端口 G。Switch-5 的累计路径开销为 10，Switch-4\
  \ 为 30。因此，Switch-5 的端口 B 成为 LAN 网段 D 的指定端口。\n\n图 10-10 显示了我们的网络更新后的 STP 拓扑，其中 DP\
  \ 代表各 LAN 网段的指定端口。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_593_0.png)\n\n\n\n\
  \n## 更改端口状态\n\n图10-10 根端口和指定端口\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_594_0.png)\n\
  \n指定端口选定后，交换机将使其根端口和指定端口经历各种状态——阻塞、侦听、学习和转发——而任何其他端口将保持阻塞状态。图10-11显示了处于阻塞状态的端口，用X标示。请记住，在Switch-2上，只有端口F（根端口）处于转发状态：端口E将保持阻塞状态。在此示例中，有两个端口留在阻塞状态：Switch-2的端口E和Switch-4的端口G。\n\
  \n图10-11 处于阻塞状态的端口\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_594_1.png)\n\n**注意**\
  \ STP仅保证二层无环拓扑——它并不保证最优拓扑！例如，在图10-10所示的网络中，LAN网段A上的网络设备必须经过Switch-3、Switch-1和Switch-5才能到达LAN网段D，因为Switch-4的端口G处于阻塞状态。\n\
  \n## 快速生成树协议\n\n802.1d标准设计时，等待30到50秒以实现二层收敛并不是问题。然而，在当今的网络中，对于使用实时应用（如IP语音（VoIP）或视频）的网络，这可能会导致严重的性能问题。为克服这些问题，思科开发了名为PortFast（前面已讨论）、UplinkFast和BackboneFast的专有桥接特性。然而，这些特性的问题在于它们是思科专有的。\n\
  \nRSTP是IEEE标准，定义于802.1w，可与802.1d互操作，并且是对802.1d的扩展。在RSTP中，只有三种端口状态：\n\n- 丢弃\n- 学习\n\
  - 转发\n\n处于丢弃状态的端口基本上是802.1d中阻塞、侦听和禁用状态的合并。以下各节介绍RSTP中包含的一些增强功能。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_595_0.png)\n\
  \n**注意** RSTP向后兼容802.1d。\n\n### 额外的端口角色\n\n在RSTP中，仍然有根交换机，也仍然有根端口和指定端口，它们承担与802.1d中相同的角色。但是，RSTP增加了两种额外的端口类型：*替代*端口和*备份*端口。这两种端口类似于802.1d中处于阻塞状态的端口。替代端口具有一条或多条通往根的替代路径，但当前处于丢弃状态。备份端口位于可用于到达根交换机的网段上，但该网段已经指定了一个活动端口。可以这样理解：替代端口是备用且未使用的根端口，备份端口是备用且未使用的指定端口。RSTP中第三个端口角色变化是：不再有阻塞状态；它已被*丢弃*状态取代。所有端口要么处于转发状态，要么处于丢弃状态：根端口和指定端口处于转发状态——所有其他端口处于丢弃状态。\n\
  \n鉴于这些新的端口角色，RSTP计算最终生成树拓扑的方式与802.1d相同。一些术语被更改和扩展，用于缩短收敛时间，正如你将在后面的“RSTP收敛特性”一节中看到的那样。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_596_0.png)\n\n**考试提示** 对于CCNA考试，要知道RSTP引入的新端口状态包括替代端口、备份端口和丢弃端口。RSTP中所有活动端口要么处于转发、学习，要么处于丢弃状态。一旦所有端口都处于转发或丢弃（阻塞）状态，RSTP就已收敛。\n\
  \n### RSTP BPDU\n\n802.1w标准对BPDU引入了一项变化。BPDU中增加了一些额外的标志，以便交换机能够共享关于BPDU发出或离开的端口角色的信息。当网络中发生变更时，这可以帮助相邻交换机更快收敛。\n\
  \n在802.1d中，如果交换机在最大老化时间（20秒）内没有看到根BPDU，STP就会运行，选出新的根交换机，并创建新的无环拓扑。这是一个耗时的过程。在802.1w中，如果在三个预期的hello周期（6秒）内未收到BPDU，STP信息可以立即老化，交换机认为其邻居已丢失，并应采取措施。这与802.1d不同，在802.1d中交换机必须错过来自根的BPDU。在802.1w中，如果交换机连续错过邻居的三个hello报文，就会立即采取措施。\n\
  \n### RSTP收敛特性\n\n802.1w标准包含新的收敛特性，与思科专有的UplinkFast和BackboneFast特性非常相似。第一个特性类似于思科的BackboneFast特性，允许交换机接受劣质BPDU。\n\
  \n请查看图10-12以理解劣质BPDU特性。在此示例中，根桥是Switch-A。Switch-B和Switch-C上直接连接到根的端口都是根端口。对于Switch-B和Switch-C之间的网段，Switch-B提供指定端口，Switch-C提供备份端口（该网段到达根的辅助方式）。Switch-B还通过Switch-C的BPDU得知，其指定端口是替代端口（该交换机到达根的辅助方式）。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_597_0.png)\n\n图10-12 接受劣质BPDU\n\n继续图10-12的示例，根与Switch-B之间的链路发生故障。Switch-B可以通过以下方式检测到这一点：要么错过来自根端口的三个hello报文，要么检测到物理层故障。如果运行的是802.1d，Switch-B会看到经由Switch-C传来的劣质根BPDU（更差的开销值），因此所有端口都必须经过阻塞、侦听和学习状态，默认情况下需要50秒才能收敛。借助劣质BPDU特性，假设Switch-B知道Switch-C为其直接连接的网段有一个替代端口，Switch-B可以通知Switch-C使用其替代端口并将其改为指定端口，而Switch-B会将其指定端口改为根端口。这个过程只需几秒钟，甚至可能更短。\n\
  \n802.1w引入的第二个收敛特性是*快速过渡*。快速过渡包括两个新组件：边缘端口和链路类型。边缘端口是连接到非二层设备（例如PC、服务器或路由器）的端口。RSTP使边缘端口快速过渡到转发状态，这与思科专有的PortFast相同。这些端口状态的变化不会影响RSTP而导致重新计算，而其他端口类型的变化会使这些端口保持转发状态。\n\
  \n在RSTP中，快速过渡只能发生在边缘端口和点对点（P2P）链路上。链路类型根据连接的双工方式自动确定。交换机假设：如果两个交换机之间的端口配置为全双工，则该端口可以快速过渡到不同状态，而无需等待任何计时器到期。如果是半双工，此特性默认不会生效，但你可以为P2P半双工交换机链路手动启用它。\n\
  \n让我们使用图10-13中的拓扑来看一个P2P链路快速过渡的示例。图10-13中的拓扑与图10-12所示的拓扑相同，不同之处在于图10-13中Switch-A（根）与Switch-C之间的链路发生故障。发生这种情况时，Switch-C无法再通过其根端口到达Switch-A。但是，查看其从Switch-A和Switch-B收到的BPDU，Switch-C知道可以通过Switch-B到达根，并且Switch-B为Switch-B和Switch-C之间的网段提供指定端口（该端口处于转发状态）。Switch-C知道这一点后，将备份端口的状态改为根端口，并立即将其置为转发状态，同时通知Switch-B这一变更。此更新通常不到一秒，\n\
  \n\n\n假设根交换机与Switch-C之间的链路故障是物理链路故障，而不是连续丢失三个Hello BPDU。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_599_0.png)\n\
  \n图10-13 快速迁移示例\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_599_1.png)\n\n**考试提示**\
  \ 请记住，在CCNA考试中，RSTP在点对点（P2P）链路上的收敛速度远快于原始IEEE STP（802.1d）。\n\n## RSTP 配置\n\n思科交换机支持三种STP类型，如表10-4所示。思科交换机的默认配置是每个VLAN单独运行一个STP实例，所有VLAN共享一个根交换机，并且没有负载分担。\n\
  \n**表10-4 STP类型**\n\n| STP | 描述 |\n|---|---|\n| PVST+ | 802.1d 每VLAN，带有思科专有扩展（PortFast、UplinkFast、BackboneFast）\
  \ |\n| PVRST+ | 802.1w (RSTP) 每VLAN |\n| 多生成树协议（MSTP） | 802.1s，称为多生成树，将思科PVST+与IEEE标准相结合\
  \ |\n\n本书仅关注PVRST+，而且只是简要介绍。要启用PVRST+，请使用以下命令：\n\n```\nSwitch(config)# spanning-tree\
  \ mode rapid-pvst\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_600_0.png)\n\n\
  **考试提示** 请记住，在CCNA考试中，**spanning-tree mode rapid-pvst** 命令可在IOS交换机上启用RSTP。\n\n启用后，可以使用以下命令按VLAN查看STP：\n\
  \n```\nSwitch# show spanning-tree vlan VLAN_# [detail]\n```\n\n以下是该命令的示例：\n\n```\n\
  Switch# show spanning-tree vlan 10\nVLAN0010\nSpanning tree enabled protocol rstp\n\
  Root ID Priority 32768\nThis bridge is root\nHello Time 2 sec Max Age 20 sec Forward\
  \ Delay 15 sec\nBridge ID Priority 32768 (priority 32768 sys-id-ext 10)\nAddress\
  \ 0000.01c1.1111\nHello Time 2 sec Max Age 20 sec Forward Delay 15 sec\nAging Time\
  \ 300\nInterface Role Sts Cost Prio.Nbr Type\n-------- ---- --- ---- -------- ----\n\
  Fa0/1 Desg FWD 19 128.1 P2p\nFa0/2 Desg FWD 19 128.2 P2p\nFa0/3 Desg FWD 19 128.3\
  \ P2p\n. \n. \n.\n```\n\n在此示例中，该交换机是VLAN 10的根交换机，并且正在使用RSTP。请注意，其所有端口都是指定端口（Desg）并处于转发状态（FWD）——如果所有活动端口都如此，那么该交换机就是根交换机，此处确实如此，如输出的第四行（This\
  \ bridge is root）所示。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_601_0.png)\n\n\
  **考试提示** 请熟悉考试中 **show spanning-tree vlan** 和 **show spanning-tree interface** 命令的输出。\n\
  \n你还可以使用 **show spanning-tree interface** 命令按端口检查STP。以下是一个示例：\n\n```\nSwitch# show\
  \ spanning-tree interface fastethernet 1/0/5\nVlan Role Sts Cost Prio.Nbr Type\n\
  ----- ---- --- ---- -------- ----\nVLAN0001 Root FWD 19 128.1 P2P\nVLAN0002 Altn\
  \ DIS 19 128.2 P2P\nVLAN0003 Root FWD 19 128.2 P2P\n```\n\n在此示例中，F1/0/5是VLAN 2中的备用端口，原因可能是它到根桥的路径开销更高，或者存在平局且该邻居的桥ID更大。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_602_0.png)\n\n**提示** 要排除PVRST+的问题，请使用\
  \ **debug spanning-tree pvst+** 命令；要排除STP中端口状态变化的问题，请使用 **debug spanning-tree switch\
  \ state**。\n\n## PVST+ 和 RSTP 优化\n\n为了理解PVST+和RSTP提供的优势，请查看图10-14。此示例显示了编号为1和2的两个VLAN。思科交换机的默认行为是，根据交换机ID最低的交换机，所有VLAN共用一台根交换机。在此例中，就是Switch-A。请注意，根据RSTP的计算，Switch-C为其两个VLAN都禁用了到Switch-B的端口。这种设计的缺点是，在到分布层的两条连接中，接入交换机上只有一条被使用。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_603_0.png)\n\n**图10-14 PVST+ 和 RSTP 非优化**\n\
  \n一个更好的设计如图10-15所示。然而，要获得这种拓扑，你必须调整你的网络，确保Switch-A是VLAN 1的根交换机，Switch-B是VLAN 2的根交换机。通过这种设计，你实际上可以同时利用接入层交换机到分布层交换机的两条上行链路。在图10-15中，VLAN\
  \ 1将使用左侧上行链路连接，VLAN 2使用右侧上行链路连接。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_604_0.png)\n\
  \n**图10-15 PVST+ 和 RSTP 优化**\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_604_1.png)\n\
  \n**注意** 基于图10-15的设计，你应该确保VLAN 1的默认网关是Switch-A（假设它是三层交换机），VLAN 2的默认网关是Switch-B（假设它是三层交换机）。如果你没有这样配置，而是将默认网关关联到Switch-A，那么VLAN\
  \ 2的流量将不得不从接入层交换机发送到Switch-B，然后通过EtherChannel跨接到Switch-A，才能离开子网。你可以在思科的CCNP交换课程中了解更多相关信息。\n\
  \n请记住，图10-15中的拓扑是由你创建的：你必须手动更改每台交换机的优先级，以创建所需的拓扑。用于实现此目标的命令包括以下内容：\n\n```\nSwitch(config)#\
  \ spanning-tree vlan VLAN_# root primary\nSwitch(config)# spanning-tree vlan VLAN_#\
  \ root secondary\nSwitch(config)# spanning-tree vlan VLAN_# priority priority_#\n\
  ```\n\n请记住，交换机的默认优先级是32,768。第一条命令将指定VLAN的交换机优先级更改为4096。第二条命令将指定VLAN的交换机优先级更改为8192。第三条命令允许你为指定的VLAN自定义优先级。\n\
  \n基于图10-15中的示例，Switch-A的配置如下所示：\n\n```\nSwitch-A(config)# spanning-tree mode rapid-pvst\n\
  Switch-A(config)# spanning-tree vlan 1 root primary\nSwitch-A(config)# spanning-tree\
  \ vlan 2 root secondary\n```\n\nSwitch-B的配置如下所示：\n\n```\nSwitch-B(config)# spanning-tree\
  \ mode rapid-pvst\nSwitch-B(config)# spanning-tree vlan 2 root primary\nSwitch-B(config)#\
  \ spanning-tree vlan 1 root secondary\n```\n\n这两个配置之间唯一的区别是，主备根优先级在两个VLAN上进行了互换，以便能够使用来自接入层交换机Switch-C的两条上行链路。\n\
  \n**注意** 你在交换机上所做的任何STP配置更改都会立即生效，这意味着二层网络必须重新收敛，从而导致二层网络出现短暂中断。\n\n## STP 故障排除\n\
  \n排查环网引起的问题可能是一项困难的任务。本节介绍一些简单的步骤，你可以据此识别并修复二层环路问题。\n\n在讨论不同的二层环路问题之前，我想先定义一下*广播风暴*。交换机会将广播消息发送到交换机上的所有端口（接收该消息的端口除外）。如果存在二层环路，这意味着交换机之间存在多条路径，广播消息会从一台交换机转发到另一台交换机，耗尽交换机的带宽和处理能力——这就是广播风暴。广播风暴是有害的，因为它们最终会使网络瘫痪。\n\
  \n### 环路识别\n\n广播风暴的一个迹象是交换机上的CPU和端口利用率非常高。如本章开头所述，你可以使用 **show processes** 和 **show\
  \ process cpu** 命令检查一台或多台交换机的CPU利用率。持续的高CPU利用率可能表明存在环路。为了确认二层环路导致了问题，请使用协议分析器捕获并分析流量，以确定同一数据包是否多次出现。这通常通过将协议分析器连接到交换机，并使用交换机上的交换机端口分析器（SPAN）功能来完成，该功能会将来自接口或VLAN的帧复制到SPAN端口。一个好的协议分析器应该能够检测到环路的存在，并通知你此问题。\n\
  \n一旦识别出环路，为了快速恢复连通性，你应该开始禁用属于环路一部分的端口；然后诊断问题，以确定是您这边的配置问题，还是新增了二层设备导致了问题。如果你无法确定环路原因，请打开STP的调试功能（**debug\
  \ spanning-tree events**）。\n\n### 配置补救措施\n\n为了简化故障排除过程，请根据需要禁用尽可能多的功能。例如，如果你启用了EtherChannel，禁用该通道将有助于确定通道本身是否工作不正常，并可能造成二层环路。\n\
  \n\n\n\n\n如果不确定哪个交换机是根交换机，请登录逻辑上应该是根的交换机，并通过使用 **spanning-tree vlan *VLAN_#* priority**\
  \ 命令将其优先级更改为 1，强制其成为根。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_607_0.png)\n\n\
  **TIP** 一个很好的步骤是将网络拓扑图中每个交换机的 MAC 地址包括在内。然后，在排查环路问题时，您会发现更容易确定是否有非法交换机被引入拓扑并可能正在创建环路。\n\
  \n确保所有交换机都运行 802.1d 或 802.1w（RSTP），最好是后者。使用 **show spanning-tree** 命令验证这一点，以及交换机是否正在为\
  \ VLAN 扮演根角色。\n\n## 练习 10-2：监控 STP\n\n在本练习中，您将连接两台交换机并验证端口是否已通过 STP 被置于阻塞状态。您将使用本章前一练习中的网络配置。\n\
  \n- 1. 确保两台交换机都已通电。\n- 2. 确保两台交换机上的每个端口 1 都通过交叉电缆相互连接。\n- 3. 等待一分钟，并注意链路两端都变绿。\n\
  - 4. 使用每台交换机上的端口 24 和交叉电缆在 VAN-SW1 和 VAN-SW2 之间创建链路。等待一分钟，并注意其中一个链路将保持琥珀色，因为它被置于阻塞状态以防止环路。\n\
  - 5. 通过控制台登录 VAN-SW1 并运行 **show spanning-tree vlan 1** 命令以查看生成树设置。记录桥 ID 优先级和地址，并将其与输出顶部的根\
  \ ID 进行比较。如果值相同，则说明这是根交换机；如果不相同，则说明该交换机不是根交换机。请记住，根交换机中参与环路的所有端口都将处于转发状态。\n\n- 6.\
  \ 记录 VAN-SW1 的以下信息：\n  - 根 ID 优先级：________________\n  - 根 ID 地址：________________\n\
  \  - 桥 ID 优先级：________________\n  - 桥 ID 地址：________________\n- 7. VAN-SW1 是否为根桥（如果是，则之前记录的值相同）？________________\n\
  - 8. 查看输出底部的接口状态，并记录每个接口的角色：\n  - VAN-SW1 – 端口 1：________________\n  - VAN-SW1 –\
  \ 端口 24：________________\n- 9. 通过控制台登录 VAN-SW2 并运行 **show spanning-tree vlan 1**\
  \ 命令。\n- 10. 记录 VAN-SW2 的以下信息：\n  - 根 ID 优先级：________________\n  - 根 ID 地址：________________\n\
  \  - 桥 ID 优先级：________________\n  - 桥 ID 地址：________________\n- 11. VAN-SW2 是否为根桥（如果是，则之前记录的值相同）？________________\n\
  - 12. 查看输出底部的接口状态，并记录每个接口的角色：\n  - VAN-SW2 – 端口 1：________________\n  - VAN-SW2\
  \ – 端口 24：________________\n- 13. 查看两台交换机上每个已连接接口的 LED 指示灯。您记录的处于阻塞状态的接口应显示琥珀色灯光，表明它处于阻塞状态。\n\
  - 14. 通过控制台登录端口处于阻塞状态的交换机。您将通过更改优先级强制该交换机成为根桥（这将导致该交换机上的所有端口处于转发状态，而阻塞状态的端口将移动到另一台交换机）。要更改交换机的优先级，请输入以下命令（此代码示例假设为\
  \ VAN-SW1，但您可能会遇到 VAN-SW2）：\n\n```\nVAN-SW1>enable\nVAN-SW1#config term\nVAN-SW1(config)#spanning-tree\
  \ vlan 1 root primary\nVAN-SW1(config)#exit\nVAN-SW1#show spanning-tree vlan 1\n\
  ```\n\n- 15. 查看另一台交换机上的生成树状态，以验证阻塞端口是否已移动到另一台交换机。\n\n## EtherChannels\n\n在您的网络中，通常需要为某些类型的连接提供更高的带宽速度，例如从接入层到分发层的连接、分发层交换机之间、分发层和核心层交换机之间，以及某些服务器或路由器与其连接交换机之间的连接。例如，回顾图\
  \ 10-15，您可以看到两台分发层交换机之间以及分发层和核心层交换机之间存在双重第 2 层连接。然而，这种设计的问题是它会创建第 2 层环路；并且在运行 STP\
  \ 时，STP 将确保两台设备之间只有一条路径处于活动状态，这会将您限制在可能存在的多个连接中的一条连接的带宽上。\n\n## EtherChannel 概述\n\
  \nEtherChannel 是一种第 2 层解决方案，使您可以聚合直接连接设备之间的多个基于以太网的第 2 层连接。基本上，EtherChannel 将设备之间的多个以太网端口捆绑在一起，提供看似单个逻辑接口。从\
  \ STP 的角度来看，它将 EtherChannel 视为连接设备之间的单个逻辑连接，这意味着您可以在创建的信道中同时使用所有单独的连接。\n\nEtherChannel\
  \ 提供以下优势：\n\n- **冗余** 如果信道中的一个连接失败，您可以使用信道中的其他连接。\n- **更高带宽** 每个连接都可以同时用于发送帧。\n\
  - **管理简化** 配置是在逻辑接口上进行的，而不是在信道中的每个单独连接上进行的。\n\n## EtherChannel 限制\n\nEtherChannel\
  \ 中的接口必须配置相同：速度、双工模式和 VLAN 设置（如果它们是访问端口，则必须在同一 VLAN 中；如果是干线端口，则必须具有相同的干线属性）必须相同。设置\
  \ EtherChannel 时，最多可以将八个接口捆绑在一起：\n\n- 最多八个快速以太网连接，提供高达 800 Mbps\n- 最多八个千兆以太网连接，提供高达\
  \ 8 Gbps\n- 最多八个万兆以太网连接，提供高达 80 Gbps\n\n通常，交换机上最多可有六个 EtherChannel，但在高端 IOS 交换机上此数量更大。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_610_0.png)\n\n**考试提示** 为 CCNA 考试请记住，在形成\
  \ EtherChannel 时，所有端口都必须配置为相同的速度、干线封装类型（访问、802.1Q 或 ISL）和双工设置。\n\n## EtherChannel\
  \ 操作\n\n可以通过使用两种协议之一（端口聚合协议 (PAgP) 或链路聚合控制协议 (LACP)）在设备之间动态形成信道，如表 10-5 所示。请记住，参与信道的端口必须配置相同。\n\
  \n| 协议 | 描述 |\n|---|---|\n| PAgP | 思科专有协议。它使连接的设备能够将配置相似的端口动态分组到单个信道中。 |\n| LACP\
  \ | 定义于 IEEE 802.3ad 标准。与 PAgP 类似，它从连接的设备中了解哪两个端口配置相同，并在它们之间动态形成信道。 |\n\n表 10-5\
  \ EtherChannel 协议\n\n信道形成后，连接的设备可以使用负载均衡来利用信道中的所有端口。负载均衡通过将帧或数据包中的部分二进制地址缩减为数值，然后将数值关联到信道中的一个端口来执行。负载均衡可以使用\
  \ MAC 或 IP 地址、源地址或目的地址，或源地址和目的地址对。使用负载均衡，可以保证信道中的所有链路都会被利用；但是，不能保证所有端口都会被同等利用。\n\
  \n例如，如果基于源地址进行负载均衡，可以保证不同的源 MAC 地址将使用信道中的不同端口。但是，来自单个源 MAC 地址的所有流量将始终使用信道中的同一端口。在这种情况下，如果一个设备产生大量流量，该链路可能会比信道中的其他链路被更多地利用。在这种情况下，您可能希望基于目的地址或源地址和目的地址两者进行负载均衡。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_611_0.png)\n\n**注意** 要正确配置信道的负载均衡，必须了解网络中的流量模式。一旦了解流量模式，就可以通过选择正确的负载均衡类型来充分利用信道。\n\
  \n\n\n\n\n## EtherChannel 配置\n\n如前文所述，你应确保通道中的所有接口配置相同（接口属性的配置在第 9 章中已讨论）；否则，通道可能无法形成。下面是设置\
  \ EtherChannel 的配置：\n\n```\nSwitch(config)# interface type [slot_#]/port_#\nSwitch(config-if)#\
  \ channel-group group_# mode mode\nSwitch(config-if)# port-channel load-balance\
  \ {dst-ip | dst-mac | src-dst-ip | src-dst-mac | src-ip | src-mac}\n```\n\ngroup_#\
  \ 指定接口所属的通道组，范围为 1 到 6（请记住，交换机上最多可配置六个 EtherChannel）。mode 可以是表 10-6 中列出的模式之一。使用\
  \ PAgP 时，一侧需要配置为 desirable，另一侧配置为 desirable 或 auto；或者可以将两侧都配置为 on。使用 LACP 时，一侧需要配置为\
  \ active，另一侧可以是 active 或 passive。\n\n| 模式 | 协议 | 描述 |\n|---|---|---|\n| auto | PAgP\
  \ | 被动监听来自配置为 desirable 或 on 的 Cisco 设备的 PAgP 查询。默认情况下，接口不属于通道。 |\n| desirable |\
  \ PAgP | 生成 PAgP 查询以形成通道，但默认情况下不属于通道。 |\n| on | PAgP | 生成 PAgP 查询并假设端口属于通道。 |\n\
  | active | LACP | 如果另一侧响应其 LACP 消息，则启用通道。 |\n| passive | LACP | 被动监听 LACP 消息，以便从\
  \ active 端口形成通道。 |\n\n表 10-6 EtherChannel 模式\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_612_0.png)\n\
  \n**注意** 如果要将其视为第 3 层接口（例如在路由器上），并为其分配 IP 地址，则端口通道必须指定为 **interface port-channel**\
  \ *group_#*。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_613_0.png)\n\n**考试提示**\
  \ CCNA 考试中请记住，如果 PAgP EtherChannel 的一侧模式设置为 auto，则另一侧需要设置为 on 或 desirable。active\
  \ 和 passive 模式仅用于使用 LACP 建立 EtherChannel。\n\n以下是 SwitchA 使用 PAgP 与 SwitchB 形成 EtherChannel\
  \ 的配置示例：\n\n```\nSwitchA(config)# interface g1/0/1\nSwitchA(config-if)# channel-group\
  \ 1 mode auto\nSwitchA(config-if)# exit\nSwitchA(config)# interface g1/0/2\nSwitchA(config-if)#\
  \ channel-group 1 mode auto\nSwitchA(config-if)# exit\n```\n\n因为 SwitchA 上的 PAgP\
  \ 使用 auto 模式，所以 SwitchB 必须使用 on 或 desirable 模式，如下所示：\n\n```\nSwitchB(config)# interface\
  \ g1/0/4\nSwitchB(config-if)# channel-group 1 mode on\nSwitchB(config-if)# exit\n\
  SwitchB(config)# interface g1/0/5\nSwitchB(config-if)# channel-group 1 mode on\n\
  SwitchB(config-if)# exit\n```\n\n## 练习 10-3：使用 EtherChannel\n\n在本练习中，您将在温哥华办公室的\
  \ VAN-SW1 和 VAN-SW2 交换机之间配置 EtherChannel 连接。\n\n1. 确保两台交换机已通电。\n2. 如果上一练习的交叉线缆仍然连接，请将其移除。\n\
  3. 使用交叉线缆将两台交换机的端口 1 和 2 相互连接。\n4. 通过控制台登录 VAN-SW1 并输入以下命令：\n5. 运行 **show etherchannel\
  \ summary** 命令查看 EtherChannel 摘要信息。记录以下信息：\n\n    组：________________\n    协议：________________\n\
  \    端口：________________\n\n6. 使用 **show interfaces port-channel 1** 命令查看 port-channel\
  \ 1 接口的状态。请注意，该命令也可缩写为 **show interfaces po1**。\n7. 切换到 VAN-SW2 并输入以下命令，将接口 1 和\
  \ 2 放入 EtherChannel：\n\n    ```\n    VAN-SW1>enable\n    VAN-SW1#config term\n \
  \   Enter configuration commands, one per line. End with CNTL/Z.\n    VAN-SW1(config)#interface\
  \ g1/0/1\n    VAN-SW1(config-if)#channel-group 1 mode auto\n\n    VAN-SW1(config-if)#interface\
  \ g1/0/2\n    VAN-SW1(config-if)#channel-group 1 mode auto\n    ```\n\n    ```\n\
  \    VAN-SW2>enable\n    VAN-SW2#config term\n    VAN-SW2(config)#interface g1/0/1\n\
  \    VAN-SW2(config-if)#channel-group 1 mode on\n\n    VAN-SW2(config-if)#interface\
  \ g1/0/2\n    VAN-SW2(config-if)#channel-group 1 mode on\n    ```\n\n8. 运行 **show\
  \ etherchannel summary** 命令查看 EtherChannel 摘要信息。记录以下信息：\n\n    组：________________\n\
  \    协议：________________\n    端口：________________\n\n9. 使用 **show interfaces port-channel\
  \ 1** 命令查看 port-channel 1 接口的状态。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_615_0.png)\n\
  \n**视频 10.03。** 随本书提供的数字资源包含在交换机上配置 EtherChannel 的多媒体演示。\n\n## 章节复习\n\nVTP 是一种 Cisco\
  \ 私有协议，用于在中继端口之间传输 VLAN 信息。交换机必须在同一域中才能共享消息。VTP 有三种模式：client、server 和 transparent。server\
  \ 和 transparent 交换机可以添加、更改和删除 VLAN，但 server 交换机会通告这些更改。client 只能接受来自 server 交换机的更新。VTP\
  \ 有三种消息：advertisement request、subset advertisement 和 summary advertisement。server\
  \ 每五分钟在中继连接上生成一次 summary advertisement。配置修订版本号用于确定哪个 server 交换机拥有最新的 VLAN 信息。VTP\
  \ pruning 用于修剪两个交换机之间未激活的 VLAN，但它要求交换机处于 server 和/或 client 模式。\n\n在 Cisco 交换机上，使用\
  \ **vtp domain** 命令和 **vtp server|client|transparent** 命令配置 VTP。默认模式为 server。要配置\
  \ VTP 密码，请使用 **vtp password** 命令。\n\nSTP 使用 BPDU 来了解其他相邻交换机。这些 BPDU 每两秒生成一次，作为多播发送。运行\
  \ STP 时，会选举出根交换机——即交换机 ID 或网桥 ID 最低的交换机。交换机 ID 由优先级和交换机的 MAC 地址组成。每个交换机选择一个根端口来到达根交换机——即累积路径代价最低的端口。每个网段在一个交换机上有一个端口成为指定端口，用于转发来自和发往该网段的流量。通常，这是累积路径代价最低的交换机上的端口。共有五种端口状态：阻塞（20\
  \ 秒）、监听（15 秒）、学习（15 秒）、转发和禁用。PortFast 会将端口立即置于转发模式，且应仅用于非交换机端口。PVST+ 为每个 VLAN 运行一个\
  \ STP 实例——这是 Cisco 的私有协议，但已通过 IEEE 与 MSTP 标准化。\n\nRSTP 通过让交换机确定有效的备用根端口和备用指定端口（以便在拓扑变化发生时使用），将收敛时间缩短至几秒钟。使用\
  \ **spanning-tree mode rapid-pvst** 命令启用带 RSTP 的 PVST+。\n\nEtherChannel 将设备之间的第\
  \ 2 层连接捆绑起来，从 STP 的角度看形成一个单一逻辑端口。然后可以在通道中的端口上执行负载均衡。PAgP 或 LACP 用于形成通道。一个通道中最多可包含八个接口。\n\
  \n如果 CPU 和/或端口利用率较高，可能存在第 2 层环路。通常，您应该使用协议分析器，并在帧捕获中查找多个相同帧的副本。\n\n### 快速复习\n\n\
  ### VLAN 中继协议\n\n- VTP 用于共享 VLAN 信息，以确保交换机具有统一的 VLAN 配置。\n- VTP 有三种模式：server（可以做出并接受更改并传播更改）、transparent（可以做出更改，忽略\
  \ VTP 消息）和 client（接受来自 server 的更改，并不将其存储在 NVRAM 中）。默认模式为 server。\n- VTP 消息仅通过中继传播。要使交换机接受\
  \ VTP 消息，域名和可选密码必须匹配。共有三种 VTP 消息：advertisement request（client 或 server 请求）、subset\
  \ advertisement（server 响应 an\n\n\n\n\n广告)，以及汇总广告（服务器每五分钟发送一次）。配置修订号用于 VTP 消息中，以确定是否应对其进行处理。\n\
  \n- VTP 修剪允许根据交换机上是否有活动 VLAN，动态添加和移除中继上的 VLAN。要求交换机处于服务器和/或客户端模式。\n\n## 生成树协议\n\n\
  - STP 在 802.1d 中定义。它可消除网络中的环路。\n- 交换机 ID（优先级 + MAC 地址）最低的交换机被选举为根交换机。\n- 每台交换机都会选择通往根的最佳路径，该端口称为根端口。每个网段都需要一个交换机端口来访问网络的其余部分——该端口称为指定端口。\n\
  - BPDU 用于选举根交换机并共享拓扑信息。BPDU 是每两秒发布一次的组播。\n- STP 端口共有五种状态：阻塞（仅处理 BPDU——20 秒）、侦听（仅处理\
  \ BPDU——15 秒）、学习（处理 BPDU 并构建 CAM 表——15 秒）、转发（处理 BPDU、构建 CAM 表并转发用户流量）和禁用（端口未启用）。根端口和指定端口最终会进入转发状态，这个过程可能需要\
  \ 30 到 50 秒。\n- 当 STP 正在重新计算时，PortFast 可使端口保持在转发状态；不应在交换机到交换机的连接上使用，因为这可能会导致意外环路。\n\
  - PVST+ 是 Cisco 的专有技术，允许每个 VLAN 有一个单独的 STP 实例。\n\n## 快速生成树协议\n\n- RSTP 有三种端口状态：丢弃、学习和转发。\n\
  - RSTP 支持两种额外的端口类型：备用（根端口的辅助端口）和备份（指定端口的辅助端口）。\n\n## EtherChannel\n\n- 从 STP 的角度来看，EtherChannel（设备之间第\
  \ 2 层物理连接的捆绑）被视为单个逻辑连接。\n- EtherChannel 中的端口必须配置相同。可以使用 PAgP 或 LACP 来形成信道。\n\n##\

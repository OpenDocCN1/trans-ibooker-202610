  A. Straight-through UTP\nB. Crossover UTP\nC. Serial\nD. Rollover\n\n9. 你需要将笔记本电脑连接到交换机，将同一交换机连接到另一台交换机，并将第二台交换机连接到路由器。你需要多少根电缆以及应使用什么类型的\

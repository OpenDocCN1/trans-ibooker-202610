  \ not set\n  Keepalive set (10 sec)\n  Full-duplex, 1000Mb/s\n```\n\nA. 该端口因安全违规已被禁用。\n\
  B. 线路协议有问题。\nC. 该端口缺少描述。\nD. 该端口已被管理员禁用。\n\n11. 你会使用哪条 Cisco 交换机命令在接口上启用中继？\nA.\
  \ switchport mode trunk\nB. trunking on\nC. trunking enable\nD. switchport trunk\
  \ on\n\n12. 你会使用哪条 Cisco 交换机命令将端口 10 分配给 VLAN ID 5？\nA. vlan-membership static 10\n\
  B. vlan 5\nC. switchport access vlan 5\nD. switchport mode access\n\n## 基于性能的考题\n\
  \nCisco 考试包含基于性能的考题，你必须将屏幕左侧的项目拖到屏幕右侧的正确位置才能回答问题。以下是本章相关的一些基于性能的考题示例。\n\n1. 你负责配置\
  \ LA 办公室中的 LA-SW1 交换机，以便可以从其他网络远程管理它。将适当的一组命令拖到用于配置该交换机的交换机配置部分。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_552_0.png)\n\
  \n```\nVAN-SW1(config)#interface vlan1\nVAN-SW1(config-if)#ip address 192.168.35.98\
  \ 255.255.255.224\nVAN-SW1(config-if)#no shutdown\nVAN-SW1(config-if)#exit\nVAN-SW1(config)#ip\
  \ default-gateway 192.168.35.65\n```\n\n```\nVAN-SW1(config)#interface vlan1\nVAN-SW1(config-if)#ip\
  \ address 192.168.35.92 255.255.255.224\nVAN-SW1(config-if)#no shutdown\nVAN-SW1(config-if)#exit\n\
  VAN-SW1(config)#ip default-gateway 192.168.35.65\n```\n\n```\nVAN-SW1(config)#interface\
  \ g0/0\nVAN-SW1(config-if)#ip address 192.168.35.92 255.255.255.224\nVAN-SW1(config-if)#no\
  \ shutdown\nVAN-SW1(config-if)#exit\nVAN-SW1(config)#ip default-gateway 192.168.35.65\n\
  ```\n\n```\nVAN-SW1(config)#interface vlan1\nVAN-SW1(config-if)#ip address 192.168.35.98\
  \ 255.255.255.224\nVAN-SW1(config)#ip default-gateway 192.168.35.65\n```\n\n###\
  \ LA-SW1 配置命令\n\n2. 查看以下图示左侧的命令，画一条线将其连接到该命令功能的描述。\n\n\n\n\n\n| Command | Description\
  \ |\n|---|---|\n| hostname VAN-SW1 | 显示与每个端口关联的 MAC 地址。 |\n| no shutdown | 将端口安全配置为仅为端口学习一个\
  \ MAC 地址。 |\n| ip default-gateway 12.0.0.1 | 设置设备名称。 |\n| show mac address-table\
  \ | 为当前连接设备的 MAC 地址配置端口安全。 |\n| switchport port-security mac-address sticky | 启用接口。\
  \ |\n| switchport port-security maximum 1 | 在设备上设置默认网关。 |\n\n## 答案\n\n- 1. C. 如果交换机在启动过程中发生故障，系统\
  \ LED 将显示琥珀色。如果系统无错误启动，系统 LED 将显示绿色。\n- 2. D. 当处于双工显示模式时，如果端口以全双工模式运行，每个端口 LED 将显示绿色；但如果端口以半双工模式运行，LED\
  \ 将关闭。\n- 3. A. 在系统配置对话框脚本中不要求启用接口。思科交换机上默认启用接口。\n- 4. C. ip default-gateway 命令是全局配置模式命令。\n\
  - 5. B. 为交换机分配 IP 地址，以便您可以使用 Telnet 或 SSH 远程管理交换机。\n- 6. 若要查看 CAM 表（也称为 MAC 地址表），请使用\
  \ show mac address-table 命令。\n- 7. A. 如果交换机收到一个帧，其中包含的目标地址不在 MAC 地址表中，交换机将向交换机上的所有端口泛洪该帧。\n\
  - 8. A. 端口安全用于防止未经授权访问 LAN。\n- 9. **C.** 配置端口安全时，您可以配置端口安全功能，使用 sticky 选项（**switchport\
  \ port-security mac-address sticky**）来授权使用该端口的系统的 MAC 地址。这样就无需在每个端口上输入每个 MAC 地址。\n\
  - 10. **D.** 端口的状态为管理关闭；这意味着该端口已被管理员禁用。\n- 11. **A.** **switchport mode trunk**\
  \ 命令在思科交换机上启用中继。请记住，您应在使用 **switchport trunk encapsulation dot1q** 设置封装模式后运行此命令。\n\
  - 12. **C.** **switchport access vlan** 命令将接口分配给 VLAN。您应在将接口置于访问模式后运行此命令。\n\n##\
  \ 基于性能的答案\n\n以下是本章中基于性能的问题的答案。\n\n- 1. 此问题颇具棘手之处，因为它实际上包含两个问题。首先，它测试您为交换机分配 IP 地址和默认网关的知识。其次，这是一个\
  \ IP 子网划分问题，因为您还需要确保所使用的命令采用正确的 IP 地址范围内的 IP 地址。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_555_0.png)\n\

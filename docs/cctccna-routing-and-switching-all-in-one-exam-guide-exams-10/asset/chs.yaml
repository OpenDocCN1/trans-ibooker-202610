  \n**考试提示** 考试时请记住，**show ip cache flow** 命令可视化 IOS 设备捕获的一般 NetFlow 数据。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_807_0.png)\n\
  \n**视频 13.07.** 随本书提供的数字资源包含在 Cisco 路由器上配置和验证 NetFlow 的多媒体演示。\n\n## 章节复习\n\n路由器上的日期和时间对于消息日志、数字证书和许多其他事项非常重要。访问\
  \ NTP 信息的常见方法是通过服务器的组播消息或客户端的单播查询消息。NTPv3 支持使用基于 MD5 的数字签名对消息进行身份验证。建议您设置自己的本地主时间源。\n\
  \n许多 Cisco IOS 设备支持 DHCP 服务器和中继代理功能。设置服务器时，您会创建一个 DHCP 池，其中包含 IP 地址、DNS 服务器、域名、默认网关地址和租用时间。当服务器检查池中未使用的地址是否正在被使用，并确定该地址当前正被另一台设备使用时，就会发生地址冲突。冲突必须由\
  \ IOS 设备上的管理员手动清除。当客户端和 DHCP 服务器位于不同子网 (VLAN) 中时，使用 DHCP 中继；IOS 设备可以充当两台设备之间的中继，使用单播消息与\
  \ DHCP 服务器交互。\n\nSNMP 用于远程管理设备。SNMP 的三个组件是管理站 (NMS)、代理和 MIB。Get、send 和 trap/inform\
  \ 消息在 NMS 和代理之间使用。SNMPv2c 支持用于安全性的共同体字符串，这些字符串以明文形式存在。\n\n\n\n\n\nSNMPv3支持消息验证、身份验证和消息加密，因此比SNMPv2c更安全。\n\
  \n专用地址在RFC 1918中定义：10.0.0.0/8、172.16.0.0/16–172.31.0.0/16和192.168.0.0/24–192.168.255.0/24。如果使用专用地址，必须在数据包到达公共网络之前将其转换为公共地址。当公共地址不足、更换ISP但保留现有地址、合并具有重叠地址空间的公司，或希望将相同IP地址分配给多台机器时，使用地址转换。\n\
  \n术语*内部本地IP地址*指的是带有专用或原始IP地址的数据包。术语*内部全局IP地址*指的是带有公共或转换后地址的数据包。NAT将一个IP地址转换为另一个，而PAT（地址重载）将许多IP地址转换为相同的全局地址，其中源端口号会更改以确保转换设备可以区分连接。PAT将发往某设备端口的流量重定向到另一台设备。\n\
  \n地址转换可以访问几乎取之不尽的地址组，并使您能够向外部人员隐藏内部网络设计。它还使您能够更严格地控制进出网络的流量。但是，地址转换会为流量增加一些延迟，使故障排除更加困难，并且不适用于所有应用程序，尤其是多媒体应用程序。\n\
  \n**ip nat inside source static**命令用于配置静态NAT。**ip nat inside source list**和**ip\
  \ nat pool**命令（添加**overload**以执行PAT）用于配置动态转换。**ip nat inside | outside**接口子配置模式命令定义哪些接口被视为地址转换的内部接口和外部接口。\n\
  \n使用**show ip nat translations**命令查看路由器的地址转换表。**clear ip nat translation ***命令清除路由器转换表中的所有动态地址转换条目。**debug\
  \ ip nat**命令将显示IOS对每个转换数据包执行的转换。\n\n日志记录用于记录设备上发生的事件。日志信息可以在设备上本地查看，或转发到syslog服务器。消息的日志级别表示其严重程度，日志级别范围从0（紧急）到7（调试）。日志提供的信息远多于SNMP陷阱和通知所提供的信息。默认情况下，IOS设备的控制台已启用日志记录，但其他目标必须手动启用。日志和调试消息的时间戳默认禁用，但可以使用**service\
  \ timestamps**命令启用。\n\nNetFlow是Cisco的一项专有技术，用于捕获流信息，这些信息可用于网络流量计费、基于发送流量量的计费/账单、网络容量规划、网络监控以及许多其他网络管理功能。流基本上是两台设备之间的会话，至少必须包含源IP地址、目标IP地址和入站接口。Cisco使用ASIC来捕获流信息。Cisco支持多个版本的NetFlow，其中版本5最常见。**show\
  \ ip cache flow**命令显示会话流的摘要，但要按历史收集信息，需要外部NetFlow收集器。\n\n## 快速复习\n\n## 了解网络服务\n\n\
  - NTP有三种交付时间消息的方法：广播、单播和组播。\n- NTPv3支持使用MD5签名对消息进行身份验证。\n- 应设置自己的时间服务器（通常称为本地主时钟），并使用NTPv3实施MD5身份验证——不要使用SNTP，因为Cisco不支持与其进行身份验证。\n\
  - SNMP的三个组件是管理程序、代理和MIB。\n- SNMP陷阱/通知是由代理生成的警报。\n- SNMPv2c使用社区字符串，并添加了inform和getbulk请求的使用。SNMPv3添加了消息完整性、身份验证和加密。\n\
  \n## 配置DHCP服务\n\n- DHCP服务器向请求主机分配IP地址参数。在Cisco IOS DHCP服务器上，地址定义在池中。\n- 如果为池定义网络号，请确保从池中排除网络号和指向广播地址。\n\
  - IP地址租给主机，通常是临时基础。当客户端当前地址生存期达到租期的一半时，它将尝试续用之前获得的现有寻址信息。\n- 如果检测到地址冲突，则该地址将从DHCP池中删除，管理员必须手动解决问题。可以通过执行**show\
  \ ip dhcp conflict**命令查看冲突。\n\n## 网络地址转换\n\n- 使用地址转换的原因包括公共地址不足、更换ISP、合并具有重叠地址的网络，以及将多台设备表示为单个逻辑设备。\n\
  - 内部本地IP地址是分配给内部设备的专用地址。内部全局IP地址是与内部设备关联的公共地址。\n- NAT执行一对一地址转换。PAT将多个IP地址转换为单个地址，使用源TCP/UDP端口号来区分连接。\n\
  - 端口地址重定向是静态PAT的一种形式，其中发送到特定地址和端口的流量被重定向到另一台机器（以及可能不同的端口）。\n- 要定义内部和外部，请使用**ip nat\
  \ inside | outside**接口子配置模式命令。\n- 要配置静态NAT，请使用**ip nat inside | outside source static**命令。\n\
  - 要设置动态NAT，请使用**ip nat inside source list**命令，并使用标准ACL指定内部本地地址。向此命令添加**overload**以执行PAT。使用**ip\
  \ nat pool**命令指定全局地址。\n- 使用**show ip nat translations**命令查看静态和动态地址转换。使用**clear ip\
  \ nat translation ***命令从地址转换表中清除动态转换。使用**debug ip nat**查看实际转换过程。\n- 当排查地址转换问题时，首先验证地址转换配置。使用**show\
  \ ip nat translations**命令检查转换表。使用**show ip nat statistics**命令查看转换是否实际发生。\n- 使用**debug\
  \ ip nat [detailed]**命令查看是否正在进行转换。验证已正确将路由器接口配置为NAT的内部或外部。使用**show access-lists**命令查看应转换的数据包的permit语句上是否出现命中计数。\n\
  \n## 日志记录和Syslog\n\n- 管理员常用的日志目标包括日志缓冲区（RAM）、控制台终端和syslog服务器。使用syslog的优势在于消息可以存储在syslog服务器的硬盘上，而不是路由器本身，从而释放路由器资源。Syslog使您可以轻松在服务器上集中（聚合）日志消息。\n\
  - 尽管SNMP支持陷阱，但陷阱数量有限：日志支持的消息类型和种类比SNMP陷阱支持的多得多。\n- 日志级别为紧急（0）、警报（1）、严重（2）、错误（3）、警告（4）、通知（5）、信息（6）和调试（7）。日志级别表示该级别或更高级别的任何消息。例如，如果将级别设置为3，则会记录1到3级别的消息。\n\
  - 默认设施级别为local7。\n- **service timestamps**命令用于向日志或调试记录添加本地日期、时间，以及可选的毫秒。\n\n## 使用NetFlow\n\
  \n\n\n\n\n- NetFlow 使管理员能够识别导致网络拥塞的应用程序，诊断运行缓慢问题，并验证应用程序根据其服务类别（CoS）获得适当的带宽。\n-\
  \ NetFlow 的优势包括网络、应用程序和用户监控；网络规划；以及计费/账单。\n- 最少情况下，一个流必须包含源 IP 地址、目标 IP 地址和入接口。如果数据包包含相同的\
  \ IP 地址、端口号和第 3 层协议信息，则流量被视为同一流。\n- 将流信息发送到收集器可能会占用大量 CPU。\n- 收集器的一个问题是收集器将接收的设备数量和流信息的数量。\n\
  - 流监视器是 NetFlow 组件，可让您在全局定义 NetFlow 参数，例如缓存大小和要收集的唯一流记录数量，然后将其应用到相应的接口。\n- **show\
  \ ip cache flow** 命令显示 IOS 设备捕获的常规 NetFlow 数据。\n\n以下问题将帮助您衡量对本章所学材料的理解程度。请仔细阅读所有选项，因为每个问题可能不止一个正确答案。为每个问题选择正确答案。\n\

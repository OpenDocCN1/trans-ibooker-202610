  ### 任务 1：子网划分 A 类地址\n\nA 类地址的网络 ID 为 120.0.0.0。拿几张纸并计算新的子网掩码、网络 ID、第一个有效地址、最后一个有效地址以及四个子网的广播地址。计算出答案后，填写下面的表格。参考本章中的子网划分示例作为指南，帮助你计算本练习的答案。\n\

  C. NAT\nD. DNS\n\n## Performance-based Questions\n思科考试有基于性能的问题，你必须将屏幕左侧的项目拖动到屏幕右侧的适当位置以回答问题。以下是一些基于性能的示例问题。\n\
  \n1. 你需要使用 568B 标准制作自己的以太网电缆。通过在框中写入来将导线按正确顺序放置。\n\n白线 / 绿条纹\n棕线\n白线 / 棕条纹\n白线 /\

  \ 14. 要通过 ping 千兆接口来测试 LA-R1 与温哥华网络之间的连通性，请运行以下命令（请注意，ping 不应成功，因为 LA-R1 不知道如何到达\
  \ :1 子网）：\n\n```\nLA-R1#ping 2001:aaaa:bbbb:1::1\nType escape sequence to abort.\n\
  Sending 5, 100-byte ICMP Echos to 2001:aaaa:bbbb:1::1, timeout is 2 seconds:\n.....\n\
  Success rate is 0 percent (0/5)\n```\n\n- 15. 要能够 ping 通每个网络，您需要将静态 IPv6 路由添加到路由表中。在\
  \ LA-R1 上，通过输入以下命令向 :1 子网添加静态路由：\n\n```\nLA-R1>enable\nLA-R1#config term\nLA-R1(config)#ipv6\
  \ route 2001:aaaa:bbbb:1::/64 2001:aaaa:bbbb:2::1\n```\n\n请注意，此语句的意思是，“如果有针对 2001:aaaa:bbbb:1\
  \ 子网的任何数据，则将其发送到 2001:aaaa:bbbb:2::1 地址”，即 VAN-R1 的 WAN 接口。\n\n- 16. 查看 LA-R1 上的\
  \ IPv6 路由表，您应该能看到 :1 子网的条目。\n- 17. 现在您需要向 VAN-R1 路由器添加一条静态路由，以便它知道如何到达 :3 子网。转到\

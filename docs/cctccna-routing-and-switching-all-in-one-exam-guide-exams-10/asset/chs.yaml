  \n特别感谢 Brendon Clarke 帮助制作了本书中的部分图形。你做得太棒了！\n\n# 引言\n\n欢迎迈出成为 Cisco 认证的第一步！本书不仅为您提供管理\
  \ Cisco 设备所需的背景知识，还为 Cisco CCT 和 CCNA 认证考试提供详细的认证考试指南。无论您是网络新手希望在该领域开启职业生涯，还是经验丰富的网络专业人士正在寻找一本指导考试重点的书籍，本书都适合您！\n\
  \n本书涵盖了 Cisco CCT 和 CCNA 考试所需了解的广泛主题。让我们来看看本书中您将学到什么。\n\n**第 1 章：网络基础** 本书从网络基础章节开始，涵盖网络类型、网络布线、网络架构、网络设备以及网络协议和应用等主题。\n\
  \n**第 2 章：OSI 参考模型** 然后您将了解 OSI 模型及其内部的不同层。您将学习 OSI 模型的每一层的作用、封装的概念，以及网络上发生的通信类型。\n\
  \n**第 3 章：TCP/IP 协议套件** 在本章中您将学习 TCP/IP 协议套件，以及每个协议在协议套件中的作用。协议按其网络层进行标识，并将 TCP/IP\
  \ 模型与 OSI 模型进行比较。\n\n**第 4 章：IP 地址基础** 在本章中您将学习 IP 地址、子网掩码和默认网关设置。本章还向您介绍网络 ID 和主机\
  \ ID，并讨论如何将二进制转换为十进制以及十进制转换为二进制。\n\n**第 5 章：子网划分和 VLSM** 本章指导您了解子网划分的目的以及如何根据物理网络拓扑对\
  \ IP 范围进行子网划分。本章还讨论可变长子网掩码（VLSMs）的重要性以及根据场景计算 VLSM 的步骤。\n\n**第 6 章：Cisco 设备基础**\
  \ 第 6 章开始关注 Cisco 设备。在本章中您将学习 Cisco 设备类型、硬件组件、不同的端口和接口，以及如何将硬件模块安装到设备中。\n\n**第 7\
  \ 章：Cisco IOS 基础** 本章重点介绍 Cisco Internetwork Operating System（IOS）、不同的配置模式以及将基本配置应用于\
  \ Cisco 设备的命令。您还将学习在 Cisco 设备上验证配置的命令。\n\n**第 8 章：Cisco 设备管理** 第 8 章是 Cisco CCT\
  \ 考试的重要章节；您将学习 Cisco 设备的日常管理，包括如何备份 Cisco 配置文件和 IOS 映像，以及在出现问题时如何恢复 Cisco IOS 或配置设置。您还将学习配置寄存器以及如何执行密码恢复。\n\
  \n**第 9 章：交换基础** 这是专注于交换机的两个章节中的第一个。在本章中您将了解交换机的功能和基本配置命令。您还将学习接口配置、如何配置端口安全以及虚拟局域网（VLANs）这一重要主题。\n\
  \n**第 10 章：高级交换功能** 在本章中您将学习额外的交换功能，如 VLAN  trunking 协议、生成树协议（STP）、快速生成树协议（RSTP）和\
  \ EtherChannels。\n\n**第 11 章：路由介绍** 本章是 Cisco CCNA 考试的非常重要的章节，介绍路由的概念。在本章中您将学习静态路由和浮动静态路由，并被介绍到动态路由。您还将学习路由过程以及\
  \ Cisco 设备如何选择到目的地的路由。\n\n# 第 12 章：OSPF 路由\n\n本章是第二个专注于路由的章节，但其目的是向您介绍开放最短路径优先（OSPF）作为动态路由协议。您将学习\
  \ OSPF 的工作原理、如何配置 OSPF 以及如何排除 OSPF 故障。\n\n# 第 13 章：IP 服务\n\n本章是 CCNA 认证的重要章节，有助于您了解\
  \ Cisco 环境中 IP 服务的配置。在本章中您将学习常见的网络服务，如域名系统（DNS）、动态主机控制协议（DHCP）和网络时间协议（NTP）。您还将学习如何在\
  \ Cisco 路由器上配置 DHCP 和网络地址转换（NAT）。\n\n# 第 14 章：IPv6\n\n在本章中您将学习 Internet 协议（IP）随\
  \ IPv6 带来的变化。您将学习不同的地址类型、如何在设备上配置 IPv6 地址以及如何使用 IPv6 配置路由。\n\n# 第 15 章：无线网络\n\n\
  第 15 章讨论无线网络的基础知识，包括无线网络类型、无线标准和无线加密协议。您还将学习无线局域网控制器的目的和无线接入点模式。\n\n# 第 16 章：安全基础\n\
  \n本章介绍一般安全概念，帮助您为 CCNA 考试的相关问题做准备。在本章中您将学习不同类型的攻击、身份验证和授权概念、密码策略的必要性以及虚拟专用网络（VPN）解决方案。\n\
  \n# 第 17 章：在 Cisco 设备上实施安全\n\n本章重点介绍在 Cisco 设备上实施安全。在本章中您将学习如何在 Cisco 设备上配置密码、加密这些密码、交换机上的第二层安全功能以及访问控制列表（ACLs）。\n\
  \n**第 18 章：自动化和可编程性** 本书的最后一章涵盖 CCNA 的新主题，即自动化和可编程性。在本章中您将学习自动化的重要性，然后学习软件定义网络（SDN）和\
  \ Cisco Digital Network Architecture（DNA）。\n\n**在线内容** 使用您的在线代码，您可以访问伴随本书的在线内容，包括练习测试、实验解决方案\
  \ PDF 文档以及作者演示 Cisco 设备上常见配置任务的 40 多个视频。\n\n# 关于考试\n\n本书可帮助您准备两项考试——Cisco CCT 认证考试和\
  \ Cisco CCNA 认证考试。您可以在 https://home.pearsonvue.com/cisco 注册 Cisco 考试。请查看 Cisco 网站以获取有关\
  \ Cisco 认证的最最新信息。以下信息截至本书出版之日为最新信息。\n\n## Cisco CCT 认证：考试 100-490\n\nCisco 认证技术员（CCT）认证考试侧重于为客户或企业支持\
  \ Cisco 设备的 IT 技术人员的岗位角色。要获得此认证，您必须知道如何在网络上支持、配置和排除 Cisco 设备的故障。以下是有关考试的一些详细信息：\n\
  \n| 考试编号: | 100-490 |\n| 时长: | 90 分钟 |\n| 问题数量 | 60 |\n| 领域百分比: | 通用网络知识 – 25% |\n\
  |  | Cisco 设备及相关硬件 – 20% |\n|  | Cisco IOS 软件操作 – 29% |\n|  | 服务相关知识 – 26% |\n\n\
  \n\n## 思科 CCNA 认证：考试 200-301\n\n思科认证网络助理（CCNA）认证考试专为将在网络上部署思科设备的网络专业人员设计。\n\n该考试涵盖广泛的主题，例如\
  \ IP 地址、子网划分和 VLSM、路由、无线、IP 服务和自动化。以下是有关考试的一些详细信息：\n\n| 考试编号: | 200-301 |\n| 时长:\
  \ | 120 分钟 |\n| 题目数量 | 102 |\n| 领域百分比: | 网络基础 – 20%<br>网络访问 – 20%<br>IP 连接 – 25%<br>IP\
  \ 服务 – 10%<br>安全基础 – 15%<br>自动化与可编程性 – 10% |\n\n有关思科 CCT 和 CCNA 认证考试考试目标的详细列表，请查阅本书附录\
  \ A 中找到的考试准备清单。\n\n## 在测试中心或在线参加考试\n\n注册考试时，您可以选择在测试中心参加考试，或在家或办公室的舒适环境中在线参加考试。\n\
  \n如果您在测试中心参加考试，请务必提前 30 分钟到达并携带两种形式的身份证件，其中一种带有照片。您不得将任何物品带入考场。\n\n如果您在线参加考试，您应在考试前\
  \ 30 分钟登录，因为考试开始前需要执行一些验证步骤。作为验证过程的一部分，您需要上传带照片的身份证件，然后拍摄您周围环境的照片并提交。确保您的桌子上除了用于参加考试的电脑外没有任何东西。您必须始终让网络摄像头对准自己，并且不允许离开网络摄像头的视线。我建议您在上锁的房间内参加考试，因为您必须独自参加考试：不允许其他人进入房间或打扰您。\n\
  \n## 推荐的准备步骤\n\n多年来我参加过很多认证考试，我被问到的最常见问题之一是：“您如何准备考试？”因此我想分享我准备任何认证考试的方法。\n\n- **步骤\
  \ 1：通读整本书** 从头到尾阅读本书。阅读时，完成练习和复习问题，但此时不必担心学习本书。这是您第一次阅读本书，因此您只需浏览主题，而不必担心记住什么。您还可以观看随书附带的视频，以了解所涵盖主题的演示。\n\
  - **步骤 2：再次阅读本书** 这次，您应该花时间更详细地学习本书，并探索一些可能没有配套练习的主题。我把这次阅读本书的过程视为我的玩乐时间。我在阅读时再次阅读并尝试相关主题。\n\
  - **步骤 3：第三次阅读本书** 到此时，您对主题已有扎实的理解，您已多次完成练习题，并且已自行实践（动手很重要）。第三次阅读将帮助您注意到前两次阅读中可能未关注的一些细节。\n\
  - **步骤 4：三次参加模拟考试** 需要注意的是，您不应在阅读完整本书并完成实验练习之前参加本书附带的模拟考试。许多人在阅读时喜欢参加模拟考试，但我不建议这样做，因为您会在慢慢练习时习惯这些问题。为了真实评估您在真实考试中的表现，您应在完成整本书的阅读后再参加模拟考试。\n\
  \n模拟考试旨在让您的思维进入“考试模式”，因此我建议在此阶段专注于它们。本书附带四套模拟考试的题目，包括 CCT 认证考试的 100 多道模拟考试题和 CCNA\
  \ 认证考试的 200 多道模拟考试题。您可以根据章节或考试领域生成测试并选择想要的题目数量，或在考试模式下生成计时模拟考试。（有关更多信息，请参阅本书末尾的“关于在线内容”。）您也可以在开卷模式下参加模拟考试并阅读每个问题的解释，以确保您理解每个选项正确或错误的原因。我通常也会三次参加每套模拟考试，并阅读任何不确定的或答错的问题的解释。\n\
  \n# 网络基础\n\n本章中，您将\n\n- 了解常见的网络服务和设备\n- 了解网络拓扑结构\n- 了解布线类型\n- 查看访问方法\n- 了解网络架构\n\
  - 学习虚拟化基础知识\n\n本章对网络进行了简要介绍，并介绍了您需要理解的 Cisco CCT 和 CCNA 考试的一些基本网络术语和概念。您可能已经熟悉这些材料；如果是这样，本章将提供基本网络概念的复习。对于考试，您应该了解网络中使用的各种网络拓扑结构，以及不同类型的网络，例如局域网（LAN）和广域网（WAN）。\n\
  \n## 网络简介\n\n网络包括连接计算机和应用程序的所有组件（硬件和软件），跨越小距离和大距离。网络用于与用户共享信息和服务，以帮助他们提高生产力。例如，网络可以共享网络上的打印机，以便办公室里的每个人都可以访问它，而无需每个用户都拥有自己的打印机。\n\
  \n本节涵盖了网络涉及的一些组件，以及用于连接网络组件（包括计算机）的基本拓扑类型。网络中通常共享的资源包括数据和应用程序、打印机、网络存储组件（共享磁盘空间）和备份存储组件。\n\
  \n## 网络特征\n\n为了设计成功的网络解决方案，您需要熟悉组织的需求和目标。设计网络时请考虑以下特征：\n\n- **成本** 包括网络组件的成本、其安装及其持续维护。\n\
  - **安全性** 包括对网络组件及其包含的数据和/或在它们之间传输的数据的保护。\n- **速度** 包括数据在网络端点之间传输的速度（数据速率）。\n- **拓扑**\
  \ 描述物理布线布局以及数据在组件之间逻辑移动的方式。\n- **可扩展性** 定义网络适应新增长的能力，包括新用户、应用程序和网络组件。\n- **可靠性**\
  \ 定义网络组件提供适当支持级别和所需连接级别的能力。*平均故障间隔时间*（MTBF）是通常用来表示组件故障可能性的度量。\n- **可用性** 衡量网络对用户可用的可能性，其中停机时间发生在网络因中断或计划维护而不可用时。可用的可用性通常以百分比衡量，基于一年中的分钟数。因此，*正常运行时间*\
  \ 将是网络可用的分钟数除以一年中的分钟数。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_36_0.png)\n\n\
  **考试提示** 对于考试，您需要记住设计和维护网络相关的这些重要因素：成本、安全、速度、拓扑、可扩展性、可靠性和可用性。\n\n## 网络组件\n\n*应用程序*，使用户能够执行各种任务的软件，是网络的关键组成部分。许多应用程序是*网络感知*的，这意味着它们使您能够访问和使用未直接存储在本地计算机上的资源。虽然网络应用程序的数量多达数千个，但大多数组织中使用的更常见的网络应用程序包括用于发送和接收电子邮件的电子邮件应用程序、用于传输文件的\
  \ File Transfer Protocol（FTP）应用程序以及用于提供信息图形表示的 Web 应用程序。\n\n*协议* 用于使系统能够在网络上相互通信。一些协议是*开放标准*，这意味着许多厂商可以创建能够与其他使用该协议的应用程序互操作的应用程序。其他协议是*专有*的，这意味着它们仅适用于由特定厂商创建的其他应用程序。\n\
  \n以下是我们日常用于通过互联网通信的常见互联网协议列表：\n\n- **简单邮件传输协议（SMTP）** 用于发送电子邮件的互联网协议。\n- **邮局协议\
  \ 3（POP3）** 用于从电子邮件服务器下载电子邮件到您的系统以便您阅读电子邮件的互联网协议。\n- **互联网消息访问协议版本 4（IMAP4）** 用于阅读电子邮件的互联网协议。IMAP4\
  \ 相对于 POP3 支持额外的功能和文件夹支持。\n- **文件传输协议（FTP）** 用于在互联网上传输文件的互联网协议。\n- **超文本传输协议（HTTP）**\
  \ 用于从 Web 服务器向 Web 浏览器传送网页的协议。所有流行的\n\n类似 Internet Information Services (IIS) 和\
  \ Apache 这样的 Web 服务器正在运行 HTTP 服务器。\n\n一些应用程序，例如电子邮件，需要较少的带宽，而另一些应用程序，例如备份软件、视频软件和文件传输软件，则需要大量带宽。一些应用程序实时运行，例如语音\
  \ over IP (VoIP) 和视频；一些交互式运行，例如即时消息和数据库查询；还有一些以批处理模式运行，需要很少的用户交互。今天的网络需要容纳所有这些不同类型的资源和应用程序，包括它们特定的需求，例如大容量传输的带宽或\
  \ VoIP 和视频的最小延迟和时延。服务质量 (QoS) 功能通常用于满足这些需求。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_38_0.png)\n\
  \n**EXAM TIP** 请记住，在 Cisco CCT 和 CCNA 考试中，VoIP 和视频流量对延迟和时延很敏感。因此，通常会实施 QoS，以确保这些应用程序拥有足够的带宽，并在整个网络中得到优先处理，以限制它们产生的延迟。\n\
  \n要构建网络，您需要三个组件类别：\n\n- **网络软件** 有两种类型的软件组件——服务器软件和客户端软件。服务器软件为网络上的客户端提供某种形式的服务（这就是我们想要网络的原因）。例如，服务器软件可能共享文件或提供电子邮件功能。客户端软件连接到服务器以请求使用服务。\n\
  - **网络硬件** 网络硬件组件——例如集线器、交换机、路由器、防火墙、无线接入点、调制解调器以及信道服务单元/数据服务单元 (CSU/DSU)——负责在 LAN\
  \ 和 WAN 之间移动信息。\n- **媒体类型** 铜缆或光纤电缆等媒体类型用于连接计算机和网络组件，以便组件之间可以共享信息。无线通信也属于此类，因为它用于在网络上的一个系统与另一个系统之间传输数据。\n\
  \n## 网络位置\n\n网络组件用于各种位置。表 1-1 显示了一些用于描述网络组件位置的常用术语。\n\n| 术语 | 定义 |\n|---|---|\n\
  | 小型办公室/家庭办公室 (SOHO) | 在小型或家庭办公室工作的用户（仅少数人） |\n| 分支办公室 | 在一个小区域（LAN）中连接的小组用户，与公司总部地理位置分离\
  \ |\n| 移动用户 | 通过 LAN 或 WAN 从任何位置连接到网络的用户 |\n| 企业或中央办公室 | 组织大多数用户及其资源所在的位置 |\n\n\
  表 1-1 网络位置\n\n## 局域网\n\n局域网 (LANs) 用于连接位于相近地理区域的网络设备，例如建筑物的一层、整栋建筑或校园环境。在 LAN 中，您会找到各种类型的设备，例如\
  \ PC、服务器、交换机、路由器、多层交换机、语音网关、防火墙和其他设备。LAN 中使用的媒体类型包括铜缆和光纤电缆。它们还可包括 Ethernet、快速以太网\
  \ (FE)、千兆以太网 (GE)、令牌环和光纤分布式数据接口 (FDDI)，这些是不同的网络架构。今天，大多数网络使用某种形式的以太网（本章后面“网络架构”部分会讨论）。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_40_0.png)\n\n**NOTE** 以太网已成为基于 LAN 的网络的事实标准。因此，了解其拓扑和工作原理对于在公司网络中实施非常重要。集线器和网桥在当今网络中很少使用：它们已被交换机取代。\n\
  \n## 广域网\n\n广域网 (WANs) 用于连接多个 LAN。例如，假设您在波士顿有一个办公室（一个 LAN），在温哥华有一个办公室（另一个 LAN）；WAN\
  \ 用于连接这两个 LAN，以便用户可以与两个 LAN 上的其他用户和系统进行通信。通常，当必须连接的 LAN 被大距离分隔时，就会使用 WAN。而公司为 LAN\
  \ 提供自己的基础设施，WAN 则从运营商网络租用，例如电话公司和互联网服务提供商 (ISPs)。WAN 服务中使用四种基本类型的连接或电路：电路交换、单元交换、分组交换和专用连接。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_40_1.png)\n\n**EXAM TIP** 对于考试，请记住 LAN\
  \ 提供高速带宽连接，用于在地理位置相近的位置（例如建筑物或校园）互连组件。WAN 提供较低速度的带宽连接，用于互连多个位置或站点。WAN 需要向服务提供商支付经常性的月度费用。\n\
  \n有大量 WAN 服务可用于连接不同的办公地点，包括模拟拨号、异步传输模式 (ATM)、专用电路、有线电视、数字用户线路 (DSL)、帧中继、综合业务数字网络\
  \ (ISDN) 和 X.25。模拟拨号和 ISDN 是电路交换服务的示例；ATM 是单元交换服务的示例；帧中继和 X.25 是分组交换服务的示例。\n\n*电路交换*\
  \ 服务通过电话电路提供临时连接。在网络中，这些服务通常用于主电路的备份和临时带宽提升。今天更常见的是，蜂窝无线服务（3G 和 4G）用于按需拨号应用或备份连接。\n\
  \n*专用电路* 是两个站点之间的永久连接，其中带宽专用于该公司的使用。当各种服务（例如语音、视频和数据）必须通过连接传输并且您希望保证带宽可用时，这些电路很常见。\n\
  \n*单元交换* 服务可以提供专用电路所提供的相同功能，例如具有专用链路，但其相对于专用电路的一个优势是，它使单个设备能够通过同一接口连接到多个设备。这些服务的缺点是它们并非在所有位置都可用，设置和故障排除困难，并且与专用电路所用设备相比，设备成本昂贵。\n\
  \n*分组交换* 服务与单元交换服务类似，只是单元交换服务交换称为单元的*固定长度*分组，而分组交换服务交换*可变长度*分组。此功能使分组交换服务更适合数据服务，但它们仍可提供单元交换服务提供的一些\
  \ QoS 功能。\n\n另外两种非常流行的高速互联网连接技术 WAN 服务是数字用户线路 (DSLs) 和有线电视。DSL 提供最高几兆比特每秒 (Mbps)\
  \ 的速度，并且成本远低于运营商的典型 WAN 电路。它支持语音和视频传输，并且不需要拨号连接（始终启用）。DSL 的主要缺点是覆盖范围限制在约 18,000\
  \ 英尺，并且并非在所有地区都提供服务。有线接入使用同轴铜缆和光纤连接——与提供电视广播服务所使用的媒体相同。有线电视支持比 DSL 更高的传输速率，但与 DSL\
  \ 一样，它提供全天候连接。然而，有线电视有两个主要缺点：它是一种共享服务，并且在逻辑上以总线拓扑运行，类似于以太网（第 2 章讨论），因此某个地区通过有线电视连接的客户越多，每个客户的带宽就越少；此外，由于许多人共享同一介质，它更容易受到安全风险的影响，例如窃听其他订阅者的流量。\n\
  \n用于 WAN 连接的网络设备示例包括有线电视和 DSL 调制解调器、运营商交换机、CSU/DSU、防火墙、模拟调制解调器和路由器。随着我们继续阅读章节，您将了解更多关于这些设备的信息。\n\
  \n## 常见网络服务和设备\n\n您在 CCNA 考试中遇到的大多数问题将涉及在 Cisco 路由器或交换机上正确实施功能，但您会看到一些网络问题，测试您对基本概念的了解，例如不同网络服务和网络基础设施组件的目的。本节您将了解几种网络服务和基础设施组件，例如路由器和交换机。\n\
  \n## 服务类型\n\n当今的网络包括许多提供不同类型服务的服务器。每项服务为网络提供特定的功能，了解这些服务非常重要。您应该熟悉网络上的以下服务器和服务：\n\
  \n- **DNS 服务器** 该服务负责将完全限定域名 (FQDNs) 解析为 IP 地址。例如，当您在浏览器窗口中输入类似 www.gleneclarke.com\
  \ 的地址时，您的计算机会联系 DNS 服务器以确定该友好名称的 IP 地址。\n\n\n\n\n- **DHCP 服务器** 该服务负责在计算机和设备连接到网络时为其分配\
  \ IP 地址，以便它们能够与网络上的其他系统通信或上网。\n- **HTTP 服务器** 该服务负责托管网页，并将网页传送给连接到 Web 服务器的客户端。\n\
  - **文件服务器** 该服务用于保存公司的所有数据文件。文件服务器通常拥有大量存储空间，并成为公司的中央存储点。它也成为备份的中心位置，以确保公司数据文件得到备份。\n\
  - **应用服务器** 该服务器安装了指定的应用程序，以便在网络上提供服务。例如，在应用服务器上安装数据库产品，可以使服务器向网络提供应用数据；在服务器上安装电子邮件服务器应用程序，则可以使所有用户连接到服务器来收发电子邮件。\n\
  - **SMTP/POP** 该服务运行特定的协议，使电子邮件软件能够发送或接收电子邮件。SMTP 是用于发送电子邮件的 Internet 协议，而 POP 是用于阅读电子邮件的\
  \ Internet 协议。\n- **FTP** 该服务可以安装在一台主机上，使人们能够连接到网络并在网络或 Internet 上传输文件。FTP 使用 TCP\
  \ 作为传输层协议，并支持身份验证。\n- **TFTP** 简单文件传输协议服务允许您上传或下载文件。TFTP 使用用户数据报协议（UDP），并且不支持身份验证。\n\
  - **Ping** 这实际上不是一种服务，而是一种用于测试与另一系统连通性的命令行工具。在您系统的命令提示符或终端会话中，可以使用命令 **ping** <*ip_address*>\
  \ 向远程系统发送测试消息。如果您能够与该系统通信，您应该会收到一条 ping 回复消息。\n- **Telnet** 该服务允许您使用系统的文本界面与系统建立远程连接，以执行远程管理。例如，网络管理员可以\
  \ telnet 到交换机或路由器上，对该交换机或路由器进行配置更改。Telnet 以明文发送所有通信内容，包括用户名和密码。\n- **SSH** 安全外壳是对网络上的设备执行远程管理的安全方法。SSH\
  \ 对所有通信（包括用户名和密码）进行加密；它被设计为 Telnet 的安全替代品。\n\n## 网络基础设施组件\n\n如今的网络使用许多不同的设备来增强其功能或安全性。让我们看看一些您在网络中一定会遇到的常见网络设备。\n\
  \n## 集线器\n\n集线器是一种较老的网络设备，希望您不会在您的网络中遇到它们，因为它们已被更高效、更安全的交换机所取代。在较老的网络中，所有系统都连接到集线器上以实现网络通信。网络集线器有三个缺点：\n\
  \n- **无过滤功能** 当一个系统要向另一个系统发送数据时，集线器会接收数据，然后将数据发送到集线器上的所有其他端口。集线器是第 1 层设备（您将在下一章学习\
  \ OSI 层），因此它只是接收信号并将其发送到所有端口；它不理解介质访问控制（MAC）地址，而交换机则可以理解。\n- **冲突** 由于任何发送的数据都会被发送到所有其他端口，并且任何系统都可以随时发送自己的数据，这导致网络上发生大量冲突。当两段数据发生碰撞时，就会产生冲突，并且必须重新传输。\n\
  - **安全性** 由于数据被发送到集线器上的所有端口，所有系统都会收到*所有*数据。系统会查看帧中的目的地址来决定是处理该数据还是丢弃它。但是，如果有人在使用集线器的系统上运行数据包嗅探器，他将收到所有数据包并能够读取它们。这造成了巨大的安全隐患。\n\
  \n集线器问题的解决方案是用交换机取代网络集线器，交换机具有您将在下一节中了解到的过滤功能。既然集线器已被交换机取代，为什么我还要提到集线器呢？了解集线器的工作方式很重要，因为这将帮助您理解交换机的优势。交换机减少了冲突，优化了流量，并且从安全角度来看也更好。\n\
  \n## 局域网交换机\n\n交换机是当今网络中最常用的设备之一。所有其他设备都连接到交换机以接入网络。例如，您会将工作站、服务器、打印机和路由器连接到交换机，以便每个设备都能与其他设备收发数据。交换机充当网络上所有设备的中央连接点。\n\
  \n## 第 2 层交换机\n\n交换机跟踪每台设备的 MAC 地址（烧录在网卡中的物理地址），然后将该设备的 MAC 地址与交换机上连接该设备的端口关联起来。交换机将此信息存储在交换机内存中的\
  \ MAC 地址表中。随后，交换机充当过滤设备，只将数据发送到数据目的地的端口。例如，在图 1-1 中，计算机 A 正在向计算机 C 发送数据（帧）。该帧通过计算机\
  \ A 所连接的端口（端口 2）进入交换机。交换机读取帧的目的地址，发现其目的地是 cccc.cccc.cccc（计算机 C）。然后交换机检查内存中的 MAC\
  \ 表，查看哪个端口具有 cccc.cccc.cccc 的 MAC 地址。交换机注意到计算机 C 连接到端口 4，然后将数据转发到端口 4。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_46_0.png)\n\
  \n| MAC 表 |\n|---|\n| 端口1....dddd.dddd.dddd |\n| 端口2....aaaa.aaaa.aaaa |\n| 端口3....bbbb.bbbb.bbbb\
  \ |\n| 端口4....cccc.cccc.cccc |\n\n图 1-1 交换机是网络上的中央连接设备。\n\n您将在第 9 章中了解更多关于交换机的信息。\n\
  \n## 路由器\n\n交换机用于将局域网环境中所有系统连接在一起，但如果您想将数据从您的网络发送到另一个网络或通过 Internet 发送，该怎么办？那就是路由器的任务。路由器将数据从一个网络发送（即路由）到另一个网络，直到数据到达最终目的地。请注意，虽然交换机查看\
  \ MAC 地址来决定将帧转发到哪里，但路由器使用 IP 地址来确定将数据发送到哪个网络。\n\n路由器有一个路由表，其中列出了它知道如何到达的所有网络。路由器还包含一个最后选用网关（GWLR）设置，当路由器在其路由表中没有到达目的地的路由时，就会使用该设置。\n\
  \n查看图 1-2，您可以看到两个分别标记为 R1 和 R2 的路由器。请注意，R1 与 14.0.0.0 网络没有物理连接。如果计算机 A 想要向计算机 D\
  \ 发送数据，将发生以下过程：\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_47_0.png)\n\n图 1-2 路由器将数据从一个网络发送到另一个网络。\n\
  \n1. 数据将从计算机 A 的网卡发出，并到达交换机。\n2. 交换机将帧转发到 R1 路由器。\n3. R1 路由器将查看数据的目的地址，并注意到数据的目的地是\
  \ 14.0.0.0 网络上的计算机 D。\n4. R1 路由器将查看其路由表，以确定它是否知道如何将数据发送到 14.0.0.0 网络。在这种情况下，它知道——R1\
  \ 知道将数据路由（即发送）到路由器 R2。\n5. 然后数据被发送到路由器 R2。\n6. 当路由器 R2 收到数据时，它查看数据的目的地址，并确定需要将数据发送到局域网上的计算机\
  \ D。\n\n随着我们逐步学习 Cisco 配置主题，您将了解更多关于交换机和路由器的知识，但此时我希望您明白，交换机通常用于局域网，而路由器是广域网设备。\n\
  \n\n\n\n另请注意，交换机是工作于 MAC 地址的第 2 层设备，而路由器是工作于 IP 地址的第 3 层设备。你将在下一章中了解更多关于 OSI 模型各层的信息。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_48_0.png)\n\n**考试提示** 考试目标要求你理解第 2 层交换机和第\
  \ 3 层交换机之间的区别。\n\n## 第 3 层交换机\n\n第 3 层交换机执行第 2 层交换机的所有功能，但它还具有 *作为路由器* 的额外功能。由于大多数公司购买交换机来连接其设备，然后购买路由器将数据发送到\
  \ WAN 或 Internet，Cisco 提供了可作为路由器和交换机合二为一的第 3 层交换机。正如你将在“网络设计模型”部分后面学到的，第 2 层交换机用于接入层，而第\
  \ 3 层交换机用于核心层。\n\n## 使用 CSU/DSU 连接到 WAN\n\n*信道服务单元/数据服务单元* (CSU/DSU) 是一种设备，使组织能够从\
  \ ISP 连接高速数据链路到组织的路由器，以便访问 LAN 或 WAN 以及从 LAN 或 WAN 访问。这些高速连接通常是 T1 或 T3 连接，或其欧洲对应产品\
  \ E1 和 E3。所使用的 CSU/DSU 将特定于与服务提供商连接的线路速度。\n\nCSU/DSU 设备处理 T1/T3 链路上的信号，在你的路由器和服务提供商之间发送数据。CSU/DSU\
  \ 还执行其他功能，例如防止链路两侧的电气干扰。你可能有一个 *外部 CSU/DSU* 设备，它连接到组织路由器上的串行端口，并用于连接来自服务提供商的 T1\
  \ 线路（见图 1-3）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_49_0.png)\n\n### 图 1-3\
  \ 使用外部 CSU/DSU\n\n当今许多路由器都内置了内部 CSU/DSU 模块，这使你无需使用外部 CSU/DSU 即可将路由器连接到 T1 线路。图 1-4\
  \ 显示了集成在 Cisco 路由器中的 CSU/DSU。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_49_1.png)\n\
  \n### 图 1-4 Cisco 路由器上的集成 CSU/DSU\n\n你应该熟悉与将路由器连接到 WAN 相关的另外两个术语：*demarc* 和 *demarc\
  \ extension*。\n\n*demarc*，也称为 *demarcation point*（分界点），是服务提供商设备连接到你建筑物的点。该术语用于确定特定问题的责任方。例如，如果出现故障的设备在\
  \ demarc 点的公司一侧，则是公司的问题需要修复；如果问题在服务提供商一侧的 demarc 点，则解决问题的责任落在服务提供商身上。\n\n*demarc\
  \ extension*（图 1-5）一词指的是建筑物入口连接（来自服务提供商）与公司通信设备之间的区域。demarc extension 通常是一根连接服务提供商线路到公司网络设备的跳线。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_50_0.png)\n\n图 1-5 分界点和 demarc extension\n\
  \n## 防火墙\n\n防火墙控制哪些流量允许进入网络或系统，哪些流量应被阻止。在配置防火墙时，你会根据协议、端口号和流量的方向创建允许和拒绝流量的规则。主要有三种类型的防火墙：\n\
  \n- **包过滤防火墙** 包过滤防火墙可以根据源 IP 地址和目标 IP 地址、源端口号和目标端口号以及所使用的协议来过滤流量。简单包过滤防火墙的缺点是它不理解对话的上下文，因此黑客很容易伪造数据包通过防火墙。\n\
  - **状态包检测防火墙** 与包过滤防火墙类似，状态包检测防火墙根据源 IP 地址和目标 IP 地址、源端口号和目标端口号以及所使用的协议来过滤流量，但它也理解对话的上下文，并且除非符合特定场景，否则不会允许数据包通过防火墙。例如，如果黑客向你的网络发送数据包并试图使其看起来像是有人访问的网站的响应，你的防火墙会知道没有人访问过该网站，因此不会允许该流量通过。\n\
  - **下一代防火墙** 下一代防火墙 (NGFW) 是一种第 7 层防火墙，可以检查应用数据并检测恶意数据包。普通防火墙根据流量是否为 HTTP 或 FTP\
  \ 流量（使用端口号）来过滤流量，但无法确定 HTTP 或 FTP 数据包内部是否存在恶意数据。应用层 NGFW 可以检查数据包中存在的应用数据并确定其中是否存在可疑内容。\n\
  \n## 入侵防御系统\n\n*入侵防御系统 (IPS)* 是一种安全设备，用于监控活动、记录任何可疑活动，然后采取某种形式的纠正措施。例如，如果有人在网络上进行端口扫描，IPS\
  \ 将发现这种可疑活动，记录该活动，然后将执行端口扫描的系统从网络中断开。\n\n## DHCP\n\nDHCP 负责自动为网络上的系统分配 IP 地址信息。网络管理员通过配置\
  \ *作用域*（一组地址范围）来配置 DHCP 服务器，服务器可以从中分配地址。DHCP 服务可能会为客户端配置所有 TCP/IP 设置，包括子网掩码、默认网关和\
  \ DNS 服务器地址。\n\n当客户端启动时，它会发送广播消息寻找 DHCP 服务器以接收 IP 地址。DHCP 服务器回复提供，客户端随后请求已提供的地址。最后，DHCP\
  \ 服务确认客户端在一段时间内拥有该地址（称为租期）。\n\n## 网络地址转换\n\nNAT 使我们能够通过让 NAT 设备接收所有出站数据包，取出内部源地址并替换为\
  \ NAT 设备的公共 IP 地址，从而隐藏我们的内部网络结构。这是有益的，因为任何在 Internet 上拦截数据的人都会认为数据包来自 NAT 设备而不是\
  \ LAN 上的内部计算机。因此，任何决定攻击数据包源的人实际上是在攻击 NAT 设备，而 NAT 设备通常也是防火墙产品。你将在第 13 章了解更多关于 NAT\
  \ 的信息。\n\n## 无线接入点/接入点\n\n*接入点* 是添加到你的网络中的设备，使无线客户端能够连接到网络。许多希望为客户端提供无线连接灵活性的组织会在建筑物内战略性地放置无线接入点，使无线客户端能够连接到网络。\n\
  \n## 无线局域网控制器\n\n配置网络上的每个接入点可能是一项耗时的工作，并且存在很多出错的可能性。作为网络管理员，你可以集中管理设备，而无需到每个设备处进行配置。管理员可以使用无线局域网控制器\
  \ (WLC)，或简称为无线控制器，使用轻量级接入点协议 (LWAPP) 集中管理接入点。这消除了单独配置每个接入点的管理负担。你将在第 15 章了解更多关于无线配置的信息。\n\
  \n## Cisco DNA Center\n\nCisco DNA Center 是一种你可以购买的设备，使你能够集中且同时管理对网络设备的更改。DNA Center\
  \ 的好处是你可以使用多种软件元素，例如脚本，一次性自动化对所有设备的更改。你将在第 18 章了解更多关于 Cisco DNA Center 的信息。\n\n\
  ## 终端和服务器\n\n你的网络可能包括终端，可能包括以下任意数量的设备：\n\n- **客户端** 客户端系统，例如 Windows 或 Linux 机器，连接到网络以访问文件、打印机或\
  \ Internet 等资源。\n- **服务器** 服务器系统为网络提供资源。服务器类型的示例包括文件服务器、Active Directory 服务器、数据库服务器和\
  \ Web 服务器。\n- **打印机** 网络打印机可以连接到网络以使其他连接设备能够打印文档。\n- **移动设备** 例如笔记本电脑、平板电脑或智能手机等设备可以连接到网络以访问资源。\n\
  \n## 碰撞域和广播域\n\nCCT 和 CCNA 认证考试要求你熟悉 *碰撞域* 和 *广播域*。让我们先快速定义每个术语，然后我会稍作扩展：\n\n- **碰撞域**\
  \ 在这个系统组中，同时的数据传输可能会相互碰撞。\n- **广播域** 在这个系统组中，每个系统都可以接收其他系统的广播消息。\n\n## 碰撞域\n\n在碰撞域中，可能会发生数据传输碰撞。例如，假设你使用集线器将五个系统连接到网络。因为\n\
  \n流量会被发送到集线器上的所有端口，因此如果多个系统同时发送数据，数据可能会在网络上发生冲突。因此，集线器上的所有网络端口（以及连接到这些端口的任何设备）都被视为\
  \ *单个冲突域* 的一部分。这也意味着当你将一个集线器级联到另一个集线器上时，所有集线器都属于同一个冲突域。\n\n如果你使用交换机连接这五个系统，交换机上的每个端口都会创建自己的网络段（就像网桥将网络划分为不同的网络段）。当连接到交换机的系统发送数据时，交换机只将数据发送到目的系统所在的端口。因此，如果另一个系统同时发送数据，数据也不会发生冲突。因此，交换机上的每个端口都会创建一个\
  \ *单独的冲突域*。\n\n## 广播域\n\n广播域是一组可以接收彼此广播消息的系统。当使用集线器连接网络环境中的五个系统时，如果一个系统发送广播消息，该消息会被连接到集线器的所有其他系统接收。因此，集线器上的所有端口都创建一个\
  \ *单个广播域*。\n\n同样，如果五个系统都连接到交换机并且其中一个系统发送了广播消息，广播消息将被网络上的所有其他系统接收。因此，使用交换机时，所有端口也是同一广播域的一部分。\n\
  \n如果你想控制哪些系统接收广播消息，就必须使用不将广播消息转发到其他网络的路由器。你还可以在交换机上使用虚拟局域网（VLAN），每个 VLAN 都是一个不同的广播域。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_54_0.png)\n\n**考试提示** 请务必了解 CCT 和 CCNA\
  \ 认证考试中广播域与冲突域之间的区别。此外，请记住路由器是用于创建多个广播域的设备。\n\n## 练习 1-1：识别网络组件\n\n在本练习中，你通过将右侧的组件与左侧的定义进行匹配来回顾不同的网络组件。\n\
  \n| 定义 | 组件 |\n|---|---|\n| ____ 负责将数据从一个网络发送到另一个网络的第 3 层设备 | A. Switch |\n| ____\
  \ 一种检测可疑活动然后采取纠正措施的设备 | B. Collision domain |\n| ____ 用于连接所有系统到网络的第 2 层设备 | C. DHCP\
  \ |\n| ____ 一组可以接收彼此广播消息的系统 | D. Firewall |\n| ____ 一种为网络上的其他系统和设备分配 IP 地址的服务 |\
  \ E. Router |\n| ____ 服务提供商设备连接到你所在建筑物的点 | F. Hub |\n| ____ 一组系统中单独的数据传输可能会发生冲突\
  \ | G. IPS |\n| ____ 用于保护系统或设备免受不需要的流量 | H. Demarc |\n| ____ 用于连接所有系统到网络的第 1 层设备\
  \ | I. Broadcast domain |\n\n## 网络设计模型\n\n一个设计良好的网络在结构上是分层的，其中层次中的每一层都专注于特定的工作职能。一个设计良好的网络也是模块化的，因为可以轻松地向网络添加组件，这样随着公司的增长，网络也可以增长。设计良好的网络还应具有灵活性和弹性，这意味着它始终可用并且包含某种形式的冗余。\n\
  \n在设计 Cisco 网络时，我们通常遵循两种常见的设计模型：*三层架构模型* 和 *折叠核心架构模型*。这里也讨论了其他网络架构。\n\n## 三层架构\n\
  \n三层架构模型是 Cisco 网络专业人员常用的模型，用于设计性能良好的 Cisco 网络。以下是三个层：\n\n- **接入层** 该层位于层次结构的底部；它使终端用户能够通过交换机连接到网络。接入层提供功能，使你能够在不同类型的用户之间隔离流量并划分广播域。位于建筑物每层楼的交换机代表这一层。\n\
  - **汇聚层** 从底部算起的第二层，或中间层，通过使用路由、访问控制列表（ACL）和网络访问策略等功能，使你能够控制谁可以访问网络的哪个部分。汇聚层可以是位于两个建筑物中的中央第\
  \ 3 层交换机，其中每个交换机都可以访问另一个建筑物的第 3 层交换机以进行连接。\n- **核心层** 该模型的顶层代表网络的骨干。该层通常用于连接不同建筑物的网络。它包括多个核心路由器，负责将流量传递到网络和从网络传递。\n\
  \n## 折叠核心（两层）架构\n\n小型组织可能不需要使用三层模型，因此可以将汇聚层和核心层合并为一个称为 *折叠核心层* 的单一层。这使得折叠核心层成为一个两层模型，由\
  \ *接入层* 和 *折叠汇聚/核心层* 组成。在典型场景中，这可能用于在网络中使用建筑物中仅几层楼的小型公司。每层楼将有一个交换机（接入层），使该层楼的客户端能够连接到网络。\n\
  \n每层楼的交换机然后连接到建筑物中的中央交换机，该交换机连接到路由器以访问 WAN 或 Internet。\n\n## 脊叶架构\n\n另一种两层架构的例子是\
  \ *脊叶架构*，其中下层是叶层，包含使设备能够连接到网络的接入交换机。叶层交换机然后连接到脊层交换机，脊层交换机将所有交换机连接到网络的其余部分。脊叶模型如图\
  \ 1-6 所示。请注意，叶层交换机是接入层交换机，具有全网状拓扑，连接到脊层交换机。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_57_0.png)\n\
  \n图 1-6 脊叶网络拓扑\n\n## 小型办公/家庭办公\n\nSOHO 网络是一种完全不同的网络拓扑，专为非常少量的需要访问网络和 Internet 的设备而设计。SOHO\
  \ 网络通常涉及高速 Internet 连接到家庭或办公室，连接到 ISP 的调制解调器。ISP 的调制解调器连接到无线路由器的 WAN/Internet 端口，该路由器通常有四个交换机端口，你可以使用无屏蔽双绞线（UTP）布线连接客户端。SOHO\
  \ 网络中的无线路由器还可以提供许多服务，例如充当 DHCP 服务器、NAT 设备、防火墙或无线接入点。\n\n## 本地部署 vs. 云\n\n在当今网络环境的大多数讨论中，你会听到\
  \ *本地部署* 与 *云端* 的术语。本地部署的网络功能或设备存在于你办公室位置的物理网络上。如果网络功能或设备位于云中，则发生在云提供商的网络中。例如，你可能有一个无线\
  \ LAN 控制器，用于从中央位置配置多个无线接入点作为本地部署设备（在你的办公室），或者你可能使用云服务，这意味着这些服务由云提供商提供给你。云解决方案的一个好处是提供商通常处理服务的高可用性等问题的处理，因此你无需处理。\n\
  \n## 网络拓扑\n\n当你将设备连接到网络时，你需要决定使用哪种拓扑。网络的 *拓扑* 是网络的布局，你可以从少数网络拓扑中进行选择。图 1-7 显示了不同媒体类型使用的四种拓扑的示例。\n\
  \n\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_59_0.png)\n\n## 图 1-7 网络拓扑\n\n点对点拓扑在两个组件之间只有一个连接。在此拓扑中，两个组件可以直接通信而不受其他组件的干扰。当需要连接大量组件时，这类连接并不常见。点对点拓扑的一个例子是两台路由器通过专用\
  \ WAN 链路连接。\n\n在星型拓扑中，中央设备与其他组件有多条点对点连接。星型拓扑用于需要连接大量组件的环境。使用星型拓扑的一种介质类型示例是 1000BaseTx\
  \ 以太网。连接组件时，你将所有设备，例如客户端和服务器，连接到中央交换机。星型拓扑的主要问题是，如果星的中心失效，没有组件可以与其他组件通信。为了解决这个问题，可以使用扩展星型拓扑。扩展星型拓扑基本上是多个互连的星型拓扑。\n\
  \n在 *总线* 拓扑中，所有组件都连接到并共享一根线缆。许多年前，总线拓扑在 10Base5 和 10Base2 以太网等网络架构中很常见。使用总线拓扑时，如果任何系统在电线上发送数据，数据会沿着电线的整个长度传输。用于将设备连接到总线布线的特殊类型的连接器，或收发器。\
  \ 例如，在旧的 10Base5 中，每个设备都通过吸血鬼夹连接到同轴电缆。该设备接入单根同轴电缆，并提供从网络设备到单根电缆的物理连接。\n\n在 *环* 拓扑中，设备一连接到设备二，设备二连接到设备三，依此类推，直到最后一个设备，它再连接到第一个设备。环形拓扑可以实现为单环或双环。双环通常在需要冗余时使用。例如，如果环中的某个组件失效，环可以自行环绕，如\
  \ 图 1-8 所示，以提供一个单一、功能正常的环。FDDI 是使用双环拓扑将系统连接到网络的网络架构示例。单环拓扑缺乏这种冗余功能，因此，如果环中断，网络就会中断。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_60_0.png)\n\n图 1-8 双环与冗余\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_61_0.png)\n\
  \n**NOTE** Token Ring 和 FDDI 是使用环形拓扑的网络架构示例。今天在网络中很少使用它们。\n\n## 物理与逻辑拓扑\n\n*物理*\
  \ 拓扑描述组件如何物理布线连接在一起。例如，1000BaseT 网络具有物理星型拓扑，而 FDDI 使用物理双环拓扑。*逻辑* 拓扑描述组件如何在物理拓扑上通信。物理和逻辑拓扑彼此独立。例如，任何类型的以太网在组件通信时都使用逻辑总线拓扑，而不论布线的物理布局如何。这意味着在以太网中，你可能使用具有物理星型拓扑的\
  \ 1000BaseT 来连接组件；然而，这些组件使用逻辑总线拓扑进行通信。\n\nToken Ring 是物理拓扑与其逻辑拓扑不同的网络架构的另一个良好示例。物理上，Token\
  \ Ring 使用星型拓扑，与 1000BaseT 以太网类似。这意味着每个系统物理连接到中央设备，但逻辑上，Token Ring 组件使用环形拓扑在设备之间通信。这在你尝试确定组件如何连接在一起以及如何通信时会造成混淆。另一方面，FDDI\
  \ 很直接。FDDI 的物理和逻辑拓扑相同：环。\n\n表 1-2 显示了常见网络架构及其物理和逻辑拓扑。\n\n| 网络架构 | 物理拓扑 | 逻辑拓扑 |\n\
  |---|---|---|\n| 以太网 | 总线、星型或点对点 | 总线 |\n| FDDI | 环 | 环 |\n| Token Ring | 星型 | 环\
  \ |\n\n表 1-2 物理和逻辑拓扑示例\n\n## 全网状和部分网状拓扑\n\n*网状* 通常描述组件如何连接在一起。使用了两种网状拓扑类型：*部分* 和\
  \ *全*。在部分网状环境中，每个设备 *不* 连接到每个其他设备。在全网状环境中，每个组件 *是* 连接到每个其他组件。图 1-9 显示了这两种拓扑的示例。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_62_0.png)\n\n图 1-9 部分和全网状拓扑\n\n请注意，像物理和逻辑拓扑一样，部分和全网状可以从物理视图和逻辑视图看到。例如，在物理总线拓扑中，所有组件都是全网状的，因为它们都连接到同一段线缆——这既是物理也是逻辑上的全网状拓扑，在\
  \ LAN 拓扑中很常见。另一方面，由于成本原因，WAN 通常使用部分网状拓扑来降低连接组件和位置的成本。例如，在图 1-3 左侧显示的部分网状网络中，上、左和下组件都可以通过右侧的设备通信。这种通信会引入传输延迟，但会降低成本，因为不需要那么多连接。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_63_0.png)\n\n**TIP** 用于确定完全网状 WAN 所需链路数的公式是\
  \ N × (N − 1) / 2，其中 N 为位置数量。例如，如果你有 10 个位置，你需要 45 条链路 (10 × (10 − 1) / 2) 来完全网状化这些站点。除了成本是制约因素外，WAN\
  \ 设备所需的接口数量以及这些连接的管理，随着连接越来越多，很快就会变得难以承受。\n\n## 布线类型\n\nLAN 通常使用铜缆或光纤布线。铜缆可以包括一根传输电电压的铜线，也可以是多根铜线。光纤布线使用发光二极管\
  \ (LEDs) 和激光通过玻璃芯传输数据。在这种传输中，光用于表示二进制 1 和 0：如果线上有光，表示为 1；如果没有光，表示为 0。\n\n### 铜缆\n\
  \n在铜缆和光纤之间，实施铜缆成本更低。多年来网络中使用了三种铜缆类型：\n\n- **Thicknet** 使用厚同轴电缆（不再用于当今网络）\n- **Thinnet**\
  \ 使用薄同轴电缆（不再用于当今网络）\n- **Unshielded twisted pair (UTP)** 使用四对线在电缆中，每对线定期绞合\n\n在三种铜缆类型中，UTP\
  \ 今天最常见，主要是因为它比另外两种便宜，并且更容易安装和故障排除。尽管有其优势，铜缆（包括 UTP）有两个缺点：\n\n- 它容易受到电磁干扰 (EMI)\
  \ 和射频干扰 (RFI) 的影响。\n- 电缆距离限制在短距离（100 米）。\n\nUTP 内部铜缆直径为 22 或 24 号。以太网的 UTP 具有 100\
  \ 欧姆阻抗，因此不能使用任何 UTP 布线，例如通常用于电话的电缆。电缆内部的八根线都有颜色：有些是纯色，有些是条纹。两对线承载真实电压，通常称为“tip”（T1–T4），另外四根线承载反向电压，通常称为“ring”（R1–R4）。今天，人们通常分别称它们为\
  \ *正* 和 *负* 线。一对由正线和负线组成，例如 T1 和 R1、T2 和 R2，等等，每对线沿电缆长度绞合。\n\n### UTP 类别\n\n为了区分不同种类的\
  \ UTP 布线，创建了不同的类别。表 1-3 显示了 UTP 布线的类别。\n\n\n\n| 类别 | 描述 |\n|---|---|\n| Category\
  \ 1 | 用于电话连接（不适合数据） |\n| Category 2 | 用于最高 4 Mbps 的数据连接—令牌环 |\n| Category 3 | 用于最高\
  \ 10 Mbps 的数据连接—以太网 10BaseT |\n| Category 4 | 用于最高 16 Mbps 的数据连接—令牌环 |\n| Category\
  \ 5 | 用于最高 100 Mbps 的数据连接—以太网 |\n| Category 5E | 用于最高 1 Gbps（千兆每秒）的数据连接—以太网 |\n\
  | Category 6 | 用于最高 1 Gbps（24 号线规）的数据连接—以太网 |\n| Category 6A | 用于最高 10 Gbps 的 10\
  \ 千兆以太网网络 |\n| Category 7 | 用于最高 10 Gbps 的 10 千兆以太网网络 |\n\n表 1-3 UTP 类别\n\nUTP 电缆的每个端点都有一个\
  \ RJ-45 连接器，它是一个公连接器，插入到母 RJ-45 插座中。RJ-45 连接器与电话连接器（RJ-11）上看到的相似，只是 RJ-45 大约大 50%，并且容纳八根线而不是四根线，就像\
  \ RJ-11 的情况一样。\n\n## 布线设备\n\n随着铜缆上以太网的实施，连接由两个组件组成：RJ-45 连接器和 Category 5、5E、6 或\
  \ 6A UTP 电缆。如前所述，UTP 电缆内部有八根线（四对线）。布线两端的引脚排列使用两种类型的实现：*直通* 和 *交叉*。*引脚排列* 指的是导线顺序以及它们在\
  \ RJ-45 接口内连接的引脚。两种标准定义了布线引脚排列：568B 用于直通电缆和交叉电缆的一端。568B 布线颜色列于表 1-4 中。\n\n| 引脚 |\
  \ 颜色 |\n|---|---|\n| 1 | 白线 / 橙色条纹 |\n| 2 | 橙色线 |\n| 3 | 白线 / 绿色条纹 |\n| 4 | 蓝色线\
  \ |\n| 5 | 白线 / 蓝色条纹 |\n| 6 | 绿色线 |\n| 7 | 白线 / 棕色条纹 |\n| 8 | 棕色线 |\n\n表 1-4 UTP\
  \ 引脚分配颜色\n\n一根直通以太网 UTP 电缆在一端引脚 1 连接到另一端引脚 1，引脚 2 连接到引脚 2，依此类推。直通电缆用于连接不同的设备，例如计算机与交换机之间或交换机与路由器之间。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_66_0.png)\n\n**考试提示** CCT 和 CCNA 认证考试会测试您何时使用直通电缆，这里是需要记住的黄金法则：使用直通电缆连接不同的设备，例如将计算机连接到交换机、计算机连接到集线器、交换机连接到路由器。\n\
  \n图 1-10 显示了不同设备之间直通连接的示例。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_67_0.png)\n\
  \n直通电缆：________\n\n### 图 1-10 直通连接\n\n一根交叉 UTP 以太网电缆交叉两组线：一侧引脚 1 连接到另一侧引脚 3，引脚 2\
  \ 连接到引脚 6。对于 CCNA 考试，请记住交叉电缆用于连接相似的设备，例如两台计算机、两台交换机或集线器到交换机。当连接相似的设备时使用交叉电缆，例如以下情况（图\
  \ 1-11 所示）：\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_67_1.png)\n\n交叉电缆：------\n\
  \n### 图 1-11 交叉连接\n\n- 计算机到计算机\n- 集线器到另一个集线器\n- 交换机到另一台交换机\n- 集线器到交换机\n- 路由器到计算机\n\
  - PC、路由器或文件服务器到另一台 PC、路由器或文件服务器\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_68_0.png)\n\
  \n**考试提示** 请记住 CCNA 考试中何时使用直通电缆、何时使用交叉电缆。以太网交叉电缆在一端将引脚 1 和 3 与引脚 2 和 6 交叉。\n\n有时以太网网络接口卡（NIC）母插座会提示您使用哪种类型的电缆。如果端口上出现\
  \ X 而另一个端口没有 X 标记，请使用直通电缆。如果两个设备都没有 X 或两个都有 X，请使用交叉电缆。在某些情况下，此设置可以通过命令在软件中更改，或通过使用双列直插式封装（DIP）开关在硬件中更改，从而使您能够使用当前可用的电缆类型。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_68_1.png)\n\n**注意** 许多厂商的交换机和设备支持电缆类型的自动检测。例如，您可能可以在两台交换机之间使用直通以太网电缆。然而，为了考试目的，您仍应了解之前的考试提示中的信息。\n\
  \n## 光纤\n\n光纤布线通常用于提供非常高的速度并跨越非常大的距离。例如，通过使用光纤可以实现 100 Gbps 的速度和超过 10 公里的距离——铜缆无法接近这些性能。然而，光纤布线也有其缺点：实施成本高、难以排除故障且难以安装。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_69_0.png)\n\n**考试提示** 光纤布线不受 EMI 和 RFI\
  \ 影响，而铜缆会受影响。由于在校园网中跨建筑布设铜缆的问题，光纤是推荐的布线类型。\n\n用于数据连接的光纤有两种类型：多模光纤（MMF）和单模光纤（SMF）。MMF\
  \ 传输 850 或 1300 纳米（nm）波长的光（红外光谱中的光，肉眼不可见）。MMF 的光纤厚度为 62.5/125 微米。MMF 的纤芯和包层直径（实际布线的厚度）在\
  \ 50 至 100 微米范围内。850/1300 nm 波长相当于太赫兹（THz）范围的频率。光通过 LED 传输。在传输信号时，光源会反射到包围光纤的内包层（屏蔽层）上。MMF\
  \ 相对较大的纤芯直径支持在给定波长下多个纵向模式（即不同的光路）的传播；因此使用术语 *多模*。这些多模式会导致色散（信号扩散），从而有效地将光纤传输的数据速率限制在数百\
  \ Mbps 范围内。一个很好的说明是当你靠近墙壁打开手电筒时：随着你远离墙壁，光的直径会越来越大，显示出色散。\n\nSMF 传输 1300 或 1550 nm\
  \ 的光并使用激光作为光源。由于激光的输出高于 LED，SMF 的传输距离可超过 10 公里，速度可达 100 Gbps。由于 SMF 的纤芯直径非常小，在给定波长下只传播单一纵向模式——因此称为\
  \ *单模*。\n\n由于只传播单一模式，SMF 的色散（即信号扩散）比 MMF 小，因此可以支持比 MMF 高得多的传输速率（100+ Gbps）。\n\n\
  过去十年见证了光纤使用和部署的许多进步。一个主要改进是波分复用（WDM）和密集波分复用（DWDM）。WDM 允许在同一根光纤上使用两个以上的波长（信号），从而增加连接数。DWDM\
  \ 允许更多波长，且间隔更紧密：在单根光纤上可将 200 多个波长复用到一束光流中。显然，DWDM 的优点之一是它提供了跨光纤传输的协议和流量的灵活性和透明性。例如，一个波长可用于点对点连接，另一个用于以太网连接，另一个用于\
  \ IP 连接，还有一个用于 ATM 连接。使用 DWDM 提供了可扩展性，并使运营商能够在 *无需* 安装新的光纤线路的情况下配置新连接，因此在您下单后可在很短时间内添加新连接。\n\
  \n让我们谈谈光纤中使用的一些术语以及它们如何影响距离和速度。*布线* 提供保护性外涂层以及内包层。内包层密度更大，以便光源能够反射。电缆中间是 *光纤* 本身，用于传输信号。折射率（IOR）影响光源的速度：它是真空中光速与光纤中光速之比。在真空中，没有变量会影响传输；然而，只要通过光纤或铜缆等介质传输，介质本身就会表现出影响传输的特性，导致可能的延迟。IOR\
  \ 用于衡量这些差异。基本上，IOR 衡量光纤的密度；光纤越致密，光在其中传播越慢。\n\n*损耗因子* 用于描述光源到达光纤末端之前光纤中的任何信号损失。*连接器损耗*\
  \ 发生在连接器连接两段光纤时：预计会有轻微的信号损失。此外，光纤越长，信号强度在到达电缆末端时减弱的可能性就越大。这称为 *衰减*。\n\n另外两个术语描述信号退化。*微弯*\
  \ 发生在光纤出现褶皱时，通常在电缆轻微弯曲处，导致一\n\n光源中的失真。*宏观弯曲* 发生在光源从光纤泄漏时，通常是由于光纤电缆的弯曲。为了克服长距离传输的衰减，可以使用\
  \ *光放大器*。它们类似于以太网中继器或集线器。好的放大器，例如掺铒光纤放大器（EDFA），可直接将光源转换为另一个光源，从而提供对原始信号的最佳再现。其他放大器将光转换为电信号然后再转换回光，这可能会导致信号质量下降。\n\
  \n两项主要标准用于描述光纤中信号的传输：SONET（同步光网络）和 SDH（同步数字体系结构）。SONET 由交换运营商标准协会（ECSA）和美国国家标准学会（ANSI）定义，通常用于北美。SDH\
  \ 是一种国际标准，用于世界大部分地区（北美除外）。这两个标准都定义了用于传输光源的物理层帧结构，其中还包括传输开销。存在三种类型的开销：\n\n- **段开销\
  \ (SOH)** 两个设备之间链路的开销，例如中继器\n- **线路开销 (LOH)** 连接网络设备的一个或多个段的开销，例如集线器\n- **路径开销 (POH)**\
  \ 连接组装和拆卸帧的两个设备的开销，例如载波交换机或路由器的光纤接口\n\n通常，使用环形或点对点拓扑来连接设备。对于运营商城域网（MAN），最常见的实现方式是通过使用环。自动保护倒换（APS）可用于提供线路冗余：在主线路发生故障的情况下，备用线路可以自动使用。表\
  \ 1-5 提供了 SONET 和 SDH 的更常见连接类型的概述。请注意，SONET 使用同步传输信号（STS）来描述信号，而 SDH 使用同步传输模块（STM）来描述信号。\n\
  \n| 常用术语 | SONET 术语 | SDH 术语 | 连接速率 |\n|---|---|---|---|\n| OC-1 | STS-1 | n/a |\
  \ 51.84 Mbps |\n| OC-3 | STS-3 | STM-1 | 155.52 Mbps |\n| OC-12 | STS-12 | STM-4\
  \ | 622.08 Mbps |\n| OC-48 | STS-48 | STM-16 | 2488.32 Mbps |\n| OC-192 | STS-192\
  \ | STM-64 | 9953.28 Mbps |\n\n表 1-5 光纤连接类型\n\n最常见的光纤连接器类型及其典型用途如下列出：\n\n- **光纤通道\
  \ (FC)** 服务提供商在其配线面板中使用\n- **本地连接器 (LC)** 用于企业设备并通常连接到小型封装可插拔（SFP）模块\n- **标准连接器\
  \ (SC)** 用于企业设备\n- **直头 (ST)** 由于其耐用性而用于配线面板\n\n传统上，SC 是最常用的连接器类型；然而，LC 越来越常见。\n\
  \n表 1-6 简要比较了铜缆和光纤电缆类型。\n\n| 电缆 | 距离 | 数据速率 | 比较 |\n|---|---|---|---|\n| UTP | 100\
  \ meters | 10 Mbps-10 Gbps | 易于安装但易受干扰 |\n| Coaxial | 500 meters | 10-100 Mbps |\
  \ 易于安装但难以排查故障（不再用于以太网） |\n| Fiber | 10 kilometers | 10 Mbps-100 Gbps | 安装困难且昂贵，难以排查故障，但可以跨越很长距离且不受干扰\
  \ |\n\n表 1-6 电缆类型比较\n\n## 访问方法\n\n你现在知道网络使用拓扑——即网络的布局——并且你知道某种形式的媒体例如电缆连接网络上的所有主机。我们讨论了三种主要类型的电缆：同轴电缆、双绞线和光纤电缆。\n\
  \n本节将介绍各种访问方法。访问方法决定主机如何将数据放置在传输线上：主机是否必须等待轮到它，还是可以随时将数据放置在传输线上？答案由三种主要访问方法决定：CSMA/CD、CSMA/CA\
  \ 和令牌传递。让我们逐一查看这些访问方法。\n\n### CSMA/CD\n\n*载波侦听多路访问/冲突检测*（CSMA/CD）是目前使用最广泛的访问方法之一。在\
  \ CSMA/CD 中，每个主机对线路都有平等的访问权，并且可以在线路无流量时将数据放置在线路上。如果主机想要将数据放置在线路上，它会“侦听”线路并确定是否已有信号存在。如果有，主机将等待传输数据；如果线路空闲，主机将发送数据。\n\
  \n前面描述的过程的问题在于，如果两个系统同时“侦听”线路，当线路空闲时它们都会同时发送数据。当两段数据同时在线路上传输时，它们会相互碰撞，数据将被破坏。如果数据在传输中被破坏，数据需要重新传输。因此，在发生碰撞后，每个主机将在重新传输数据之前等待一段可变的时间（它们不想再次发生碰撞），从而防止第二次发生碰撞。当系统确定数据发生碰撞然后重新传输数据时，这被称为\
  \ *冲突检测*。\n\n总之，在 CSMA/CD 中，在主机在网络上发送数据之前，它会“侦听”（CS）线路以确保线路无流量。多个系统对线路有平等的访问权（MA），如果发生碰撞，主机将检测到该碰撞（CD）并重新传输数据。\n\
  \n### CSMA/CA\n\n*载波侦听多路访问/冲突避免*（CSMA/CA）不如 CSMA/CD 流行，有其原因。在 CSMA/CA 中，在主机在线路上发送数据之前，它会“侦听”线路以查看是否有信号。如果线路空闲，主机将尝试通过发送信号来“避免”碰撞，让所有其他主机知道在发送数据之前应等待。这有助于防止碰撞发生，但涉及在线路上传输更多数据。\n\
  \n### Token Passing\n\n对于 CSMA/CD 和 CSMA/CA，碰撞的可能性始终存在，并且放置在线路上的主机越多，碰撞的可能性越大，因为你有更多系统“等待”线路空闲以便发送其数据。\n\
  \n令牌传递在确定系统如何将数据放置在线路上时采取了完全不同的方法。在令牌传递中，一个空数据包在线路上运行——“令牌”。要将数据放置在线路上，系统需要等待令牌；一旦系统获得令牌并且令牌无数据，系统就可以将数据放置在线路上。由于只有一个令牌并且主机需要拥有令牌才能“发言”，因此在令牌传递环境中不可能发生碰撞。\n\
  \n例如，如果工作站 1 想要在线路上发送数据，工作站将等待令牌，该令牌每秒在网络上循环数百万次。当令牌到达工作站 1 时，工作站将令牌从网络上取下，用数据填充它，将令牌标记为已使用以便没有其他系统尝试用数据填充令牌，然后将令牌放回线路上前往目标主机。\n\
  \n所有系统都会查看数据，但它们不会处理它，因为数据不是发给它们的。然而，预期目标系统将读取数据并将令牌作为确认发送回发送方。一旦令牌到达原始发送方，令牌将被取消标记为已使用并作为空令牌释放到网络上。\n\
  \n## 网络架构\n\n现在你对电缆、拓扑和访问方法有了更好的理解，让我们检查这些如何用于创建不同的网络架构。以下各节讨论了多年来使用并存在于当今网络中的以太网架构的不同实现。\n\
  \n### Ethernet\n\n许多物理层标准定义了以太网实现的物理特性。其中最常见的是 IEEE 802.3 10Mb。表 1-7 显示了一些 10-Mbps\
  \ 标准。以太网最常见的铜缆是 UTP。\n\n| 以太网类型 | 距离限制 | 电缆类型 | 接口类型 | 物理拓扑 | 逻辑拓扑 |\n|---|---|---|---|---|---|\n\
  | 10Base5 | 500 meters | 厚同轴电缆—50 欧姆（thicknet） | AUI | Bus | Bus |\n| 10Base2 |\
  \ 185 meters | 薄同轴电缆（thinnet） | BNC | Bus | Bus |\n| 10BaseT | 100 meters | UTP\
  \ 电缆（CAT 3、4、5、5E、6 和 6A） | RJ-45 | Star (hub) | Bus |\n\n表 1-7 10-Mbps 以太网特性\n\n\
  以太网支持总线拓扑——物理或逻辑。在总线拓扑中，每个设备都连接到同一段线路，所有设备都能看到每个帧。例如，10Base5 使用一段很长很厚的同轴电缆。网卡使用吸血鬼\
  \ tap 接入这根线路。对于 10Base2，设备通过使用 BNC 连接器连接在一起的许多段线路连接，通常称为 T-tap：T-tap 的一端连接到网卡，另外两端连接到总线的一部分的两根以太网电缆。电缆的两端必须用终端帽终止。对于\
  \ 10BaseT，所有设备都连接到集线器，集线器提供逻辑总线拓扑。所有这些 10 Mbps 以太网解决方案仅支持半双工：它们可以发送或接收，但不能同时进行。\n\
  \n\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_76_0.png)\n\n**EXAM TIP** 考试时，你应熟悉这些连接类型。半双工连接使设备能够在两个方向上发送或接收数据，但同一时间只能在一个方向上进行。此外，像集线器这样的半双工设备会经历高水平的冲突。全双工连接可以同时发送和接收，而不会发生任何冲突。交换机被视为全双工设备，这也是它们在网络上取代集线器的原因之一。\n\
  \n## 快速以太网\nEthernet 10Base2 和 10Base5 已多年未被使用，因为基于它们使用的布线进行网络问题故障排除的难度较大。而 10BaseT\
  \ 网络已被更高速度的以太网解决方案所取代，例如快速以太网和千兆以太网。所有以太网标准均使用 CSMA/CD 作为访问方法，快速以太网运行速度为 100 Mbps（而旧的以太网运行速度为\
  \ 10 Mbps）。旧的 10 Mbps 以太网为半双工，意味着你可以发送和接收数据，但同一时间只能在一个方向上进行。快速以太网为全双工（意味着你可以同时发送和接收数据）。\n\
  \n表 1-8 显示了快速以太网的不同实现。快速以太网支持半双工和全双工连接。使用全双工连接时，设备可以同时发送 *和* 接收，但需要不涉及集线器的点对点连接。\n\
  \n| 以太网类型 | 距离限制 | 电缆类型 | 布线 | 物理拓扑 | 逻辑拓扑 |\n|---|---|---|---|---|---|\n| 100BaseTX\
  \ | 100 米 | UTP CAT 5, 5E, 6, 6A | RJ-45 | 星型 | 总线 |\n| 100BaseFX | 400 米半双工，2000\
  \ 米全双工 | MMF 62.5/125 micron with SC and ST connectors | RJ-45 | 星型 | 总线 |\n| 100BaseT4\
  \ | 100 米 | UTP CAT 3, 4, 5 | RJ-45 | 星型 | 总线 |\n\n表 1-8 快速（100 Mbps）以太网特性\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_77_0.png)\n\
  \n**EXAM TIP** 考试时请熟悉快速以太网和千兆以太网标准。你无需担心 10Base2、10Base5 和 10BaseT 等旧标准。\n\n## 千兆以太网\n\
  千兆以太网在 IEEE 802.3z 中定义。为了实现 1 Gbps 速度，IEEE 采用了 ANSI X3T11 Fiber Channel 标准作为物理层实现。与以太网和快速以太网不同，其物理层使用\
  \ 8B/10B 编码方案在通过线路传输时对物理层信息进行编码。该 IEEE 标准已存在约十年。千兆以太网连接通常用于上行连接（交换机到交换机）和服务器应用。表\
  \ 1-9 显示了千兆以太网的不同实现。\n\n| 以太网类型 | 距离限制 | 电缆类型 |\n|---|---|---|\n| 1000BaseCX | 25\
  \ 米 | STP copper |\n| 1000BaseLX | 3-10 千米 | SMF |\n| 1000BaseSX | 275 米 | MMF |\n\
  | 1000BaseT | 100 米 | CAT 5E and CAT 6 UTP (RJ-45) |\n| 1000BaseZX | 100 米 | SMF\
  \ |\n\n表 1-9 1-Gbps 以太网特性\n\n## 10-千兆以太网\n已开发出使用光纤布线或 UTP 的 10-千兆以太网（10,000 Mbps）标准：\n\
  \n- **10GBaseSR** 以 10 Gbps 运行，并使用“短距离”MMF 电缆，其最大距离为 400 米（取决于使用的光纤类型）\n- **10GBaseLR**\
  \ 以 10 Gbps 运行，并使用“长距离”SMF 电缆，其最大距离为 10 千米\n- **10GBaseER** 以 10 Gbps 运行，并使用“超长距离”SMF\
  \ 电缆，其最大距离为 40 千米\n- **10GBaseT** 使用 CAT 6a UTP 布线以 10 Gbps 运行，其最大距离为 100 米\n\n\
  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_78_0.png)\n\n**EXAM TIP** 请确保为 CCT 和 CCNA\
  \ 考试熟悉快速以太网、千兆以太网和 10-千兆以太网架构。熟悉每种架构的速度、电缆类型、连接器和最大距离范围。\n\n## 串行、光纤和其他架构\n除了非常常见的以太网架构外，你还应熟悉其他网络技术，包括串行技术、光纤技术和\
  \ Power over Ethernet（PoE）。本节概述了这些不同的连接类型和架构。\n\n### 串行\n许多网络技术以串行方式传输数据，这意味着它们以一位接一位的位流方式传输数据（与并行技术一次传输多个位相比）。串行连接通常与\
  \ WAN 连接一起使用，使你的网络能够通过服务提供商连接到其他网络。\n\n### 光纤\n还有使用光纤布线连接到 SONET 网络的 10-千兆以太网特殊\
  \ WAN 版本：\n\n- **10GBaseSW** 短距离 MMF 电缆的 10-千兆以太网标准，其最大距离为 100 米\n- **10GBaseLW**\
  \ 长距离 SMF 电缆的 10-千兆以太网标准，其最大距离为 10 千米\n- **10GBaseEW** 扩展范围 SMF 电缆的 10-千兆以太网标准，其距离可达\
  \ 40 千米\n\n### PoE 概念\nPoE 被称为 IEEE 802.af 标准，是一种使用以太网端口向设备供电的方法。PoE 随着时间的推移而改进，出现了被称为\
  \ PoE+ 的技术，即 802.at 标准。PoE 的好处是，支持 PoE 的设备不需要单独的电源线为设备供电；它可以通过插入的交换机的以太网端口接收电力。能够接收\
  \ PoE 的设备的常见示例有 IP 电话、无线接入点和网络摄像机。\n\n要使 PoE 正常工作，交换机必须具有 PoE 支持的端口，设备将连接到该端口。设备还必须是\
  \ PoE 启用设备，能够接收 PoE 连接。\n\n## GBICs\n*gigabit interface converter*（GBIC）是一种输入/输出（I/O）设备，插入到千兆以太网接口（和\
  \ 10 Gbps 连接器）中，并提供各种接口连接器类型，如表 1-9 所列。GBIC 的优点是，当你购买支持 GBIC 的设备时，你的设备带有千兆以太网端口，你可以根据将使用的布线购买适当的\
  \ GBIC 接口连接器。这意味着，如果你以后需要更改电缆要求，只需将当前 GBIC 更换为与新的布线需求相匹配的 GBIC 即可。大多数 GBIC 是 *hot-swappable*\
  \ 的，但在插入或移除它们之前，你应始终检查设备制造商的说明。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_80_0.png)\n\
  \n**NOTE** 你不必使用一种以太网媒体类型和/或速度——根据具体需求看到混合的媒体类型和连接速度是很常见的。例如，常见的是用户连接使用 Category\
  \ 5 或 5E 布线的 100BaseTX，服务器连接使用 Category 5E 布线的 1000BaseTX，以及交换机到交换机连接使用 1 或 10 Gbps\
  \ 光纤连接。\n\nGBIC 连接器在公司网络中很常见，尤其是在数据中心和校园网络的上行连接中。原始标准 802.3ak 于 2004 年定义了双轴电缆上的\
  \ 10 Gbps，通常称为 InfiniBand。10-千兆以太网需要全双工连接。10 Gbps 有许多不同的标准，它们主要在连接器、布线和信息传输方式上有所不同。今天的标准是\
  \ 802.3-2012，它涵盖了所有 10 Gbps、1 Gbps 和之前的以太网标准。请注意，GBIC 端口和连接器已被 *Small Form-factor\
  \ Pluggable*（SFP）端口所取代，你将在第 6 章中看到它们。\n\n## 接口和电缆问题故障排除\n当你将设备连接到网络时，可能会出现一些常见问题，涉及网络连接和通信问题。以下是一些常见问题及其故障排除方法。\n\
  \n### 冲突\n在以太网网络中，两个系统可能同时在网络上发送数据，导致数据发生冲突。当使用网络集线器时，这是一个常见问题，因为集线器会将数据发送到集线器的每个端口。使用网络交换机有助于防止冲突，因为交换机仅将数据发送到目标系统连接的端口。此外，如果线路因流量而繁忙，交换机可以存储数据包，直到线路信号清除。\n\
  \n### 错误\n如果网络卡或电缆出现故障，可能会发生网络或数据包错误。如果接收到损坏的数据包，发送系统将需要重新传输数据，这最终会占用更多带宽。\n\n###\
  \ 双工不匹配\n通信两端的双工设置应匹配。随着我们进入 Cisco 设备的接口配置，你将学习如何配置双工设置，但现在要知道通信两端应具有相同的双工设置，否则会发生网络错误。有三种双工类型：\n\
  \n- **Simplex** 数据仅在一个方向上传输，要么由接口发送，要么由接口接收。\n- **Half duplex** 数据可以由接口发送或接收，但不能同时进行。\n\
  - **Full duplex** 数据可以由接口同时发送和接收。\n\n### 速度\n\n\n\n网络接口的速度必须与通信另一端的速度相匹配。例如，速度应设置为\
  \ 100 Mbps 或 1000 Mbps，具体取决于要连接的设备的速度。Cisco 设备上的网卡和端口包括自动检测设置，可自动检测正在使用的速度。\n\n\
  ## 虚拟化基础\n\n虚拟化技术在过去几年中迅速发展，企业将许多现有服务器整合到一台物理服务器上，并在虚拟机中运行每台服务器。虚拟机使用实际物理服务器的资源，例如\
  \ RAM 和硬盘空间。\n\n虚拟化技术的优势在于，总体而言，企业在所支付的实际物理服务器上使用的资源很少，例如内存、处理器和磁盘空间。例如，假设贵公司想要一台电子邮件服务器，因此您花费数千美元购买了这台服务器，但在电子邮件服务器安装并运行后，您仅使用了所购买\
  \ RAM 的 30% 和 20% 的处理能力。然后公司想要一台数据库服务器，并为其购买了一台新的物理服务器以安装数据库服务器软件。这没有意义，因为您最初购买的系统利用率不足。在当今时代，您可以使用虚拟化软件在同一台物理服务器上同时运行电子邮件服务器和数据库服务器。VMware\
  \ 和 Microsoft Hyper-V 等产品使您能够在虚拟环境中运行机器。\n\n## Hypervisor\n\n系统的虚拟化由 hypervisor\
  \ 提供。也称为虚拟机监视器（VMM），hypervisor 是使您能够在系统上创建和运行虚拟机的软件组件。当您在系统上安装 hypervisor 时，该系统称为主机系统，而每个虚拟机则称为客户系统。\n\
  \n有两种不同类型的 hypervisor：\n\n- **Type I** 此类 hypervisor 是直接在硬件之上运行的软件，其上主机操作系统作为父虚拟机运行。这使\
  \ hypervisor 能够控制主机和客户系统对硬件的访问。这些也称为裸金属 hypervisor，因为它们直接在硬件之上运行。Microsoft Hyper-V\
  \ 和 VMware ESXi 服务器是 Type I hypervisor 的示例。\n- **Type II** Type II hypervisor 涉及在硬件之上安装操作系统，然后安装将创建\
  \ VM 的虚拟化软件。Type II hypervisor 的示例有 VMware Workstation 和 Oracle VM VirtualBox。\n\
  \n## 虚拟网络组件\n\n使用虚拟化软件，您可以虚拟化多种不同的网络组件。以下是一个部分列表：\n\n- **Virtual switches** 能够创建虚拟交换机使您能够将不同的虚拟机放置在不同的虚拟网络上。\n\
  - **Virtual routers** 您可以通过虚拟路由器连接不同的虚拟交换机，以在不同的虚拟交换机（网络）之间路由流量。Cisco 等公司提供其路由器和防火墙的虚拟版本，您可以像管理实际物理设备一样管理它们。\n\
  - **Virtual firewall** 您可以创建虚拟防火墙来控制哪些流量可以进入或离开不同的虚拟网络。\n- **Virtual NICs** 虚拟化软件通常使您能够在每个\
  \ VM 中创建虚拟网卡，然后将这些虚拟网卡连接到虚拟交换机，或将其映射到物理网卡，以便 VM 可以参与真实网络。\n- **Software-defined\
  \ networking** 软件定义网络（SDN）是一种网络策略，将网络功能分离为控制平面（路由机制）或数据平面（不同目的地）。使用 SDN 可创建更动态且更易管理的网络，因为更改配置和在网络之间移动设备很容易。\n\
  - **Virtual desktops** 公司可以让用户运行虚拟桌面系统，这些系统是存储在中央服务器上的虚拟机，已为用户将使用的应用程序组进行了配置。虚拟桌面使用\
  \ Hyper-V 或 VMware 等虚拟化技术。\n- **Virtual servers** 最常见的虚拟化技术之一是在一台物理服务器上运行多个服务器，这节省了硬件成本，并提供环境效益，例如由于物理机器数量减少而降低的功耗。虚拟服务器使用\
  \ Hyper-V 或 VMware 等虚拟化技术。\n\n## 章节回顾\n\n本章重点介绍了两个主题：网络简介和网络拓扑。网络通过距离连接组件以实现共享资源，例如应用程序和数据、打印机和网络存储。在实施和维护网络设计时需要考虑的特性包括成本、安全、速度、拓扑、可扩展性、可靠性和可用性。网络中常见的组件包括布线、计算机、交换机、路由器、防火墙、无线接入点等。网络有各种形状和大小：中央办公室、分支办公室、SOHO\
  \ 和移动用户。\n\n网络拓扑描述了网络组件如何物理布线以及网络组件在逻辑上如何相互通信。拓扑类型包括点对点、星型、总线和环型。网状结构描述了组件如何相互连接。在全网状拓扑中，每个组件都与其他每个组件直接通信。在部分网状拓扑中，并非每个组件都与其他每个组件直接通信；组件可能需要通过中间组件通信才能将信息传递给实际目的地。\n\
  \n## 快速回顾\n\n### Introduction to Networks\n\n- 网络包括用于在距离上连接计算机以提供信息易于访问并提高生产力的所有硬件和软件组件。要构建网络，您需要计算机、网络设备和介质（有线或无线连接）。\n\
  - SOHO（小型办公室/家庭办公室）是指只有少数人工作的中小型公司办公室或家庭办公室。分支办公室涉及一小群用户在小型区域（LAN）中连接，该区域在地理上与公司总部分离。移动用户可以从任何远程位置连接到网络。中央或公司总部是中央办公室、分支办公室、SOHO\
  \ 和移动用户访问的关键服务和应用程序的所在地。\n\n### Common Network Services and Devices\n\n- 了解常见的网络服务：DHCP\
  \ 是一项服务，用于为网络上的系统分配 IP 地址。DNS 服务器将 www.gleneclarke.com 等友好名称转换为 IP 地址。\n- 基于网络的防火墙用于控制允许进入或离开网络的流量。防火墙通过分析数据包的头部并根据防火墙规则决定是否允许其进入来过滤流量。\n\
  - 接入点是连接到网络并使无线客户端能够连接并访问网络的设备。\n\n### Network Topologies\n\n- 点对点拓扑使用两个设备之间的单一连接，通常用于\
  \ WAN 环境。在星型拓扑中，中央设备与许多其他设备建立点对点连接。10BaseT 集线器是星型拓扑中中央设备的示例。总线拓扑使用所有设备之间的单一连接；Ethernet\
  \ 10Base5 是此拓扑的示例。环型拓扑将一个设备连接到下一个设备，其中最后一个设备连接到第一个。FDDI 是环型拓扑的示例。\n- 物理拓扑定义了计算设备如何物理布线在一起。逻辑拓扑描述了方法\n\
  \n设备通过物理拓扑进行通信的方式。两种拓扑会因所使用的网络技术/标准而有所不同。\n\n- 网状连接通常描述设备如何连接。在部分网状网络中，并非每个设备都与其他每个设备相连。在全网状网络中，每个设备都与其他所有设备相连。\n\
  \n## Types of Cabling\n- 铜缆在以太网中通常使用 UTP，即四对线。它使用成本低廉，易于安装和故障排除。然而，UTP 电缆只能跨越短距离，且易受\
  \ EMI 和 RFI 影响。UTP 电缆使用 RJ-45 连接器。\n- 直通 UTP 电缆用于连接不同类型的设备，例如计算机到交换机或交换机到路由器。交叉\
  \ UTP 电缆用于连接相似设备（网络上的两个主机），例如计算机到计算机、交换机到交换机，或计算机到路由器。\n- 在光纤电缆中，玻璃芯传输光脉冲且不受电气干扰影响。光纤电缆通常用作建筑物之间的骨干，但也可用于工作站。光纤的两种实现包括用于较短距离的\
  \ MMF 和用于较长距离的 SMF。\n\n## Access Methods\n- CSMA/CD 是所有以太网架构使用的访问方法，涉及系统在发送数据到线路上之前先感知线路。\n\
  - 在令牌传递中，系统需要在线路上传递令牌之前等待令牌；一旦系统获得令牌且令牌中无数据，系统即可将数据放置在线路上。系统在发送数据之前需要令牌。令牌环网络架构使用令牌传递作为其访问方法。\n\
  \n## Network Architectures\n- 以太网架构有不同的分类：*Ethernet* 运行速度为 10 Mbps，*Fast Ethernet*\
  \ 运行速度为 100 Mbps，*Gigabit Ethernet* 运行速度为 1000 Mbps（1 Gbps），而 *10-Gigabit Ethernet*\
  \ 运行速度为 10 Gbps。\n- 对于 CCT 和 CCNA 考试，应熟悉 Fast Ethernet，例如 100BaseTX，它使用 UTP CAT\
  \ 5/6/6A 电缆，采用星型拓扑，运行速度为 100 Mbps。100BaseFX 使用 MMF 光纤电缆可达 400 米，传输速率为 100 Mbps。\n\
  - 一些常见的千兆以太网标准是 1000BaseT，它使用 UTP 电缆，最大距离为 100 米，传输速率为 1000 Mbps。1000BaseLX 的传输速率为\
  \ 1000 Mbps，但使用 SMF 光纤电缆可达 10 km。1000BaseSX 使用 MMF 光纤电缆可达约 275 米的较短距离。\n\n## Virtualization\
  \ Fundamentals\n- 虚拟化是一种方法，可让你更好地利用服务器上的资源，例如内存和处理能力，同时使用更少的电力，因为运行虚拟服务器所需的物理服务器更少。\n\
  - 了解不同类型的 hypervisor 以及虚拟组件的类型，例如虚拟网卡和虚拟交换机。\n\n## Questions\n以下自测题将帮助你衡量对本章所介绍材料的理解程度。请仔细阅读所有选项，因为可能存在多个正确答案。选择每个问题的正确答案。\n\

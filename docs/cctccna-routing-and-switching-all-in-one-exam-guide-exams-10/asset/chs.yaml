  \n## 子网划分快捷方式\n\nCCT/CCNA 考试中你会发现的一个主要挑战是能够相当快速地进行子网划分，以免用完时间。为了帮助你相当快速地弄清楚子网划分，这里有一个称为增量快捷方式的技巧。\n\
  \n让我们再次使用快捷方式做一次 B 类网络示例 190.45.0.0。记住我们要将此网络划分为六个子网。第一步仍然相同：使用以下公式确定要从主机位转换为子网位的位数：\n\
  \n2³ = 8 个子网（我们只需要 6 个子网）\n\n然后写出子网掩码的二进制形式，并将前三个主机位转换为子网位如下：\n\n```\nIP Range:\
  \ 190.45.0.0\nSubnet mask (binary): 11111111.11111111.11100000.00000000\n```\n\n\
  注意，当你将新的二进制子网掩码转换为十进制时，所有子网的新子网掩码为 255.255.224.0。\n\n这里就是快捷方式发挥作用的地方。查看最后一个子网位（最右边的子网位）的值，并将其用作增量。在此示例中，增量为\
  \ 32，因为第一个子网位的值为 128，第二个子网位的值为 64，第三个也是最后一个子网位的值为 32。此增量成为每个子网的网络 ID。\n\n首先写出你开始的网络\
  \ ID，然后在包含子网位的八位组中，按增量值递增以获取下一个网络 ID；然后继续如下过程：\n\n```\nSubnet 1: 190.45.0.0\nSubnet\
  \ 2: 190.45.32.0\nSubnet 3: 190.45.64.0\nSubnet 4: 190.45.96.0\nSubnet 5: 190.45.128.0\n\
  Subnet 6: 190.45.160.0\nSubnet 7: 190.45.192.0\nSubnet 8: 190.45.224.0\n```\n\n\
  获得网络 ID 后，你可以通过在每个网络 ID 上加 1 来计算每个子网的第一个有效地址：\n\n```\nFirst valid address (Subnet\
  \ 1): 190.45.0.1\nFirst valid address (Subnet 2): 190.45.32.1\nFirst valid address\
  \ (Subnet 3): 190.45.64.1\nFirst valid address (Subnet 4): 190.45.96.1\nFirst valid\
  \ address (Subnet 5): 190.45.128.1\nFirst valid address (Subnet 6): 190.45.160.1\n\
  First valid address (Subnet 7): 190.45.192.1\nFirst valid address (Subnet 8): 190.45.224.1\n\
  ```\n\n接下来，你可以算出每个子网的广播地址。为此，只需从下一个网络 ID 中减去一个数字即可。例如，第二个子网的网络 ID 为 190.45.32.0。第一个子网的广播地址是第二个子网网络\
  \ ID 减一，即 190.45.31.255。记住，要算出子网的广播地址，你始终要查看下一个子网的网络 ID（两步前确定的）。以下是每个子网的广播地址：\n\n\
  ```\nBroadcast address (Subnet 1): 190.45.31.255\nBroadcast address (Subnet 2):\
  \ 190.45.63.255\nBroadcast address (Subnet 3): 190.45.95.255\nBroadcast address\
  \ (Subnet 4): 190.45.127.255\nBroadcast address (Subnet 5): 190.45.159.255\nBroadcast\
  \ address (Subnet 6): 190.45.191.255\nBroadcast address (Subnet 7): 190.45.223.255\n\
  Broadcast address (Subnet 8): 190.45.255.255\n```\n\n此规则的例外是最后一个子网。因为没有下一个网络 ID\
  \ 可用，最后一个子网始终以原本的网络广播地址结束。\n\n算出广播地址后，你可以通过从广播地址中减去一个数字来算出最后一个有效地址，如下所示：\n\n```\n\
  Last valid address (Subnet 1): 190.45.31.254\nLast valid address (Subnet 2): 190.45.63.254\n\
  Last valid address (Subnet 3): 190.45.95.254\nLast valid address (Subnet 4): 190.45.127.254\n\
  Last valid address (Subnet 5): 190.45.159.254\nLast valid address (Subnet 6): 190.45.191.254\n\
  Last valid address (Subnet 7): 190.45.223.254\nLast valid address (Subnet 8): 190.45.255.254\n\
  ```\n\n现在你已算出所有所需信息，可以将数据放入图表中，以清楚地识别每个子网的网络 ID、第一个有效地址、最后一个有效地址和广播地址。\n\n务必花一些时间练习使用子网划分的快捷方法，以便你能快速回答子网划分问题。练习\
  \ 5-2 是使用快捷方式的练习。\n\n## 练习 5-2：使用快捷方法进行子网划分\n\n在本练习中，你将使用快捷方法对三个不同的网络进行子网划分。\n\n\

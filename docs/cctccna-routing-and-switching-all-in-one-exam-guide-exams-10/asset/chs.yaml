  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_94_5.png)\n\n# OSI 参考模型\n\n本章中，您将\n-\
  \ 了解 OSI 参考模型各层的功能\n- 了解封装和解封装\n\n在成功配置 Cisco 交换机和路由器之前，您必须了解本章概述的基本网络概念以及后续章节中讨论的高级概念。开放系统互连（OSI）参考模型是最好的起点，因为它将帮助您了解信息如何在网络组件之间传输。OSI\
  \ 参考模型中的七层中，您应该了解 OSI 模型的底部四层的功能，因为大多数网络组件都在这些层上运行。本章介绍流量如何在网络组件之间一般性移动，并使用 OSI\
  \ 参考模型来说明封装和解封装过程。\n\n## OSI 参考模型的各层\n\n在 20 世纪 80 年代初，国际标准化组织（ISO）为网络组件制造商定义了一项标准，使这些网络组件能够在不同的环境中通信。该标准的产物体现在\
  \ OSI 参考模型的七层中，如图 2-1 所示：应用层、表示层、会话层、传输层、网络层、数据链路层和物理层。每层负责执行特定的过程或角色。\n\n|  | \
  \ |\n|---|---|\n| 第 7 层 | 应用层 |\n| 第 6 层 | 表示层 |\n| 第 5 层 | 会话层 |\n| 第 4 层 | 传输层\
  \ |\n| 第 3 层 | 网络层 |\n| 第 2 层 | 数据链路层 |\n| 第 1 层 | 物理层 |\n\n图 2-1 OSI 参考模型的各层\n\n\
  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_96_0.png)\n\n**注意** 一个良好的助记符来记住 OSI 参考模型各层是\
  \ “All people seem to need data processing” （应用层，表示层，会话层，传输层，网络层，数据链路层和物理层）。\n\n\
  前三层——应用层、表示层和会话层——的功能被称为 OSI 模型的 *上层*，通常由应用程序软件控制。这些层通常不由网络管理员控制或修改。网络管理员可以利用对传输层、网络层、数据链路层和物理层的了解来帮助排除网络通信故障。这四层被称为\
  \ OSI 模型的 *下层*，作为网络专业人员，您应该对这些层感到熟悉。\n\nOSI 模型的每一层都负责与直接在其上和下方的层进行通信，从相邻层接收数据或向相邻层传递数据。例如，表示层将从应用层接收信息，适当地格式化，然后传递给会话层。表示层永远不会直接处理传输层、网络层、数据链路层或物理层。所有层在与其他层的通信方面都遵循相同的原则。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_97_0.png)\n\n**警告** 了解 OSI 参考模型每一层的功能对于排除网络组件和网络通信故障非常重要。一旦您了解这些功能以及在模型各个层可用的故障排除工具，排除网络相关问题将变得容易得多。\n\
  \n网络通信从 OSI 模型的应用程序层（在发送系统上）开始，并向下穿过各层到达物理层。然后信息沿通信介质传递到接收系统，接收系统从物理层开始向上穿过各层，如图\
  \ 2-2 所示。（阅读本节时请务必经常参考此图。）\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_98_0.png)\n\
  \n图 2-2 数据包如何在 OSI 模型的各层中移动\n\n当您思考两个设备通信时，例如两台计算机，重要的是要了解在发送计算机的一层上执行的任何操作都会在接收计算机的同一层上撤销。例如，如果发送计算机的表示层压缩信息，则接收计算机上的数据将被解压缩。\n\
  \n让我们从两台在彼此之间发送数据的计算机的角度来看待各层。Computer1 和 Server1 在网络上交换数据。Computer1 是发送计算机，Server1\
  \ 是接收计算机，如图 2-3 所示。数据交换始于 Computer1 在应用层向 Server1 发送请求。在 Server1，数据向上穿过各层回到应用层，然后将数据传递给系统上的适当应用程序或服务。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_99_0.png)\n\n图 2-3 识别 OSI 模型每一层的功能\n\n\
  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_99_1.png)\n\n**考试提示** CCT 考试肯定会测试您对 OSI\
  \ 模型及其每一层的了解，因此请为考试熟悉这一点！您还应注意，一旦数据到达不同层，就会分配特殊的术语——在第 4 层，数据称为 *段*；在第 3 层，数据称为\
  \ *数据包*；在第 2 层，数据称为 *帧*。\n\n## 第 7 层：应用层\n\n发送系统（Computer1）上运行的应用层负责发起实际请求。这可能是任何类型的网络请求——使用网络浏览器进行网络请求（HTTP）、使用简单邮件传输协议（SMTP）进行电子邮件投递请求，或使用网络客户端重定向软件进行文件系统请求。在接收系统上，应用层负责将请求传递给该系统上的适当应用程序或服务。在我们的示例中，我们假设您坐在\
  \ Computer1 前并已在网络浏览器中输入 Server1 的地址以创建 HTTP 请求。\n\n有很多很多在应用层运行的协议示例。最常见的是 HTTP、telnet、Secure\
  \ Shell（SSH）、文件传输协议（FTP）、邮局协议 3（POP3）和简单邮件传输协议（SMTP）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_100_0.png)\n\
  \nEXAM TIP 对于考试，请记住 OSI 参考模型的顶层（第七层），应用层，提供使系统能够发起请求（发送系统）或服务请求（接收系统）的协议和服务。应用层协议示例包括\
  \ telnet、FTP、HTTP（用于网页浏览）、SSH、POP3 和 SMTP。\n\n## 第 6 层：表示层\n\n请求发出后，应用层将数据向下传递到表示层，在那里对其进行格式化，以便接收系统可以解释数据（或请求）。当表示层从应用层接收数据时，它确保数据处于适当格式——如果不是，表示层会相应地转换数据。在接收系统上，当表示层从会话层接收网络数据时，它确保数据处于适当格式并再次在需要时转换它。\n\
  \n在发送系统的表示层可能发生的格式化功能包括压缩、加密以及确保字符代码集可在另一端解释。例如，如果我们选择压缩我们正在使用的应用程序的数据，应用层将把该请求传递给表示层，但表示层执行压缩。在接收端，此数据\n\
  \n必须被解压缩才能被读取。当数据到达接收计算机的表示层时，它将解压缩数据并将其传递到应用层。\n\n## 第 5 层：会话层\n\n会话层通过建立、管理和终止它们之间的通信来管理计算机之间的对话。当会话建立时，涉及三个不同的阶段。在建立阶段，请求方启动服务以及两个系统之间通信的规则。这些规则可能包括诸如谁传输以及何时传输，以及一次可以发送多少数据之类的内容。两个系统必须就规则达成一致；规则就像对话的礼仪。一旦规则建立，数据传输阶段就开始。双方都知道如何相互交谈，使用什么最有效的方法，以及如何检测错误，所有这些都是由于第一阶段定义的规则。最后，当会话完成时终止发生，通信有序结束。\n\
  \n在我们的示例中，Computer1 在此时与 Server1 创建会话，并且它们就对话的规则达成一致。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_101_0.png)\n\
  \n考试提示 对于考试，请记住会话层负责设置、维护和拆除网络连接。会话层技术和协议的示例包括远程过程调用（RPCs）和网络文件系统（NFS）。\n\n## 第\
  \ 4 层：传输层\n\n传输层处理诸如数据的可靠和不可靠交付等功能。对于可靠的传输协议，传输层努力确保数据可靠地交付到其目的地。在发送系统上，传输层负责将数据分解为较小的部分，称为\
  \ *段*，这样如果需要重传，只有丢失的段将被发送。丢失的段在传输层从远程系统接收到数据包的确认（ACKs）时被检测到。在接收系统上，传输层负责打开所有数据包并重建原始消息。\n\
  \n传输层的另一个功能是段排序。排序是一种面向连接的服务，它接收乱序接收的段并按正确顺序重新排序。例如，如果我向你发送五个数据包，而你按其序列号接收数据包的顺序为\
  \ 3、1、4、2、5，传输层将读取序列号并按正确顺序组装它们。\n\n传输层还提供指定“服务地址”的选项，被称为 *端口地址*。端口地址使在系统上运行的服务或应用程序能够通过让每个应用程序在系统上使用唯一的端口地址来指定请求来自哪个应用程序以及请求将前往哪个应用程序。所有现代操作系统同时运行许多程序，并且每个网络程序都有唯一的服务地址。由网络标准等定义的众所周知的服务地址称为\
  \ *众所周知的地址*。服务地址也由 TCP/IP 等协议称为 *套接字* 或 *端口*。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_102_0.png)\n\
  \n**考试提示** 请记住考试中 TCP 是负责可靠交付的传输层协议示例，而用户数据报协议（UDP）是负责不可靠交付的传输层协议示例。\n\n此时，请求被分解为段以便在网络上传递，并且传输层信息（例如所使用的传输协议和任何其他传输信息）被附加到请求中。在本示例中，因为我们处理的是\
  \ TCP/IP 应用程序，所以源端口和目标端口被添加。\n\n## 面向连接的通信与无连接通信\n\n面向连接的通信确保数据从发送方到接收方的可靠交付。在建立连接服务时，这种形式的通信要求在通信会话开始时执行某种握手功能。在此过程中，两个计算机确定通信规则，例如一次发送多少数据以及使用哪些端口。握手还确定会话完成时正确终止会话的方式。这确保通信有序结束。\n\
  \n会话是两个计算机之间的可靠对话。会话就像电话呼叫：你通过拨号（握手）建立电话呼叫，然后与对方交谈（交换数据），说“再见”，最后完成后挂断。因为面向连接的服务可以提供可靠通信，所以在两个计算机需要在会话中通信时使用。会话一直保持到两个计算机决定完成通信。\n\
  \n无连接通信是一种通信形式，其中发送系统不会“介绍”自己——它只是发送数据。此外，目标计算机在信息被接收时不会通知源。这种类型的通信被认为不可靠，因为没有通知来保证交付。无连接通信可能比面向连接的通信更快，因为管理会话的开销不存在，并且在信息发送后，没有第二步来确保其被正确接收。\n\
  \n在传输层使用无连接协议意味着传输层协议不保证交付。然而，更高层协议，例如应用层协议，可能包含保证交付的功能。\n\n对于 CCT/CCNA 考试，了解传输层的主要功能很重要：\n\
  \n- 它在两个设备或系统之间设置、维护和拆除连接。\n- 它可以提供通过此连接可靠或不可靠地交付数据。\n- 它将数据分解为更小、更易管理的段。\n- 它复用连接，使多个应用程序能够在同一网络设备上同时发送和接收数据。\n\
  - 它可以通过就绪/未就绪信号或窗口实现流量控制，以确保一个组件不会用连接上的过多数据使另一个组件溢出。这两种方法都用于避免拥塞，通常使用缓冲。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_104_0.png)\n\
  \n**考试提示** 对于考试，你需要知道传输层的五个主要功能：连接管理、数据的可靠和不可靠交付、流量控制、复用和分段。\n\n## 分段\n\n传输层的另一个功能是为会话层设置、维护和拆除连接——也就是说，它处理连接的实际机制。传输层在网络设备之间传输的信息被划分为段。分段是必要的，以便将大量数据分解为网络可以容纳的更易管理的大小。这个过程的一个很好的类比是“通过管道倒鹅卵石比倒巨石更容易。”\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_105_0.png)\n\n**考试提示** 请记住数据在传输层被分解为段。\n\
  \n## 连接复用\n\n由于可能从一个组件建立到另一个组件或多个组件的多个连接，需要某种类型的复用功能来区分穿过各种连接的数据。这确保传输层可以将数据从特定应用程序发送到正确目的地和应用程序，并且在从目的地接收数据时，传输层可以将数据发送到正确的本地应用程序。为了实现连接复用，为每个应用程序分配唯一的端口号。你将在第\
  \ 3 章中了解更多关于端口号的信息。\n\n## 流量控制\n\n传输层的另一个功能是提供可选的流量控制。流量控制用于确保网络组件不会向目的地发送太多信息，使其接收缓冲区空间溢出并导致其丢弃部分传输的信息。溢出不好，因为源将不得不重新发送所有被丢弃的信息。传输层可以使用两种基本的流量控制方法：\n\
  \n- 就绪/未就绪信号\n- 窗口\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_105_1.png)\n\n**考试提示**\
  \ 对于考试，你应该知道流量控制的目的是确保目的地不会被太多\n\n源发送的信息。\n\n## Ready/Not Ready 信号\n\n当接收方收到的流量超过其处理能力时，它可以向源发送\
  \ *未就绪* 信号，指示源应停止传输数据。当接收方有机会赶上并处理源的数据时，接收方会向源回传 *就绪* 信号。在收到就绪信号后，源可以恢复发送数据。\n\n\
  使用就绪/未就绪信号实现流量控制存在两个问题。首先，当其缓冲区填满时，接收方可能会向源发送未就绪信号。在此消息传往源的途中，源 *仍在发送* 信息到接收方，而接收方很可能不得不丢弃这些信息，因为其缓冲区已满。使用这些信号的第二个问题是，一旦接收方准备好接收更多信息，它必须先向源发送就绪信号，而源必须先收到它后才能发送更多信息。这会导致信息传输的延迟。由于就绪/未就绪信号存在这两种低效率，它们通常不用于实现流量控制。有时此过程被称为\
  \ *停止/启动*，即在一段时间内停止传输然后重新开始传输。\n\n## Windowing\n\n*窗口机制* 是比使用就绪/未就绪信号更复杂的高级流量控制方法。在窗口机制中，会定义一个窗口大小，指定在源必须等待接收方确认\
  \ (ACK) 之前可以发送多少数据（段）。一旦收到 ACK，源就可以发送下一批数据（最高达到窗口大小中定义的上限）。\n\n窗口机制实现了两件事：首先，基于窗口大小强制执行流量控制。在许多协议实现中，窗口大小会在连接开始时动态协商，并且可以在连接生命周期内重新协商。这确保了使用最优的窗口大小来发送数据，而不会导致接收方丢弃任何数据。其次，通过窗口过程，接收方会告诉源收到了什么。这表明源在传输过程中是否丢失了任何数据，并使源能够重新发送任何缺失的信息。这为连接提供了可靠性，并且比就绪/未就绪信号更高效。由于这些优点，大多数面向连接的传输协议，例如\
  \ TCP/IP 的 TCP，都使用窗口机制来实现流量控制。\n\n为连接选择的窗口大小会影响其效率和吞吐量，定义了在源必须等待 ACK 之前可以发送多少个段（或字节）。图\
  \ 2-4 说明了窗口大小的重要性。图的上半部分显示了使用窗口大小为 1 的连接。在这种情况下，源发送一个带有序列号的段（此处为 1），然后等待接收方的确认。根据传输协议的不同，接收方可以以不同的方式发送\
  \ ACK：它可以发送回收到的段的序列号列表，也可以发送回它期望的下一个段的序列号。接收方的 ACK 中包含数字 2。这告诉源可以继续发送段 2。同样，当接收方收到此段时，由于窗口大小为\
  \ 1，接收方会立即回复确认，表明已收到此段。在此示例中，接收方确认回 3，表明可以发送段 3，依此类推。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_108_0.png)\n\
  \n图 2-4 窗口大小影响效率。\n\n正如你所见，使用窗口大小为 1 时，流量控制过程并不快速或高效。让我们看一个窗口大小为 3 的示例，如图 2-4 底部部分所示。使用窗口大小为\
  \ 3，源可以在等待 ACK 之前一次性发送三个段。一旦段发送完毕（每个段都有其唯一的序列号：1、2 和 3），源必须等待 ACK。在这种情况下，接收方发送回包含数字\
  \ 4 的 ACK，表明下一个期望的是第四个段。源随后可以继续发送段 4、5 和 6，然后等待接收方的 ACK。在这种情况下，更大的窗口大小更高效：每发送三个段只需要一个\
  \ ACK。因此，窗口大小越大，信息传输的效率就越高。\n\n但这并不总是如此。例如，假设一个段在传输到接收方的途中丢失，如图 2-5 所示。在此示例中，协商的窗口大小为\
  \ 3。PC-A 发送其前三个段，均被 PC-B 成功接收。PC-B 确认它期望的下一个段，即 4。当 PC-A 收到此 ACK 时，它发送段 4、5 和 6。出于某种原因，段\
  \ 4 丢失且从未到达目的地，但段 5 和 6 却到达了。请记住，接收方正在跟踪收到的内容：1、2、3、5 和 6。在此示例中，接收方发送回 ACK 4，表明期望下一个是段\
  \ 4。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_109_0.png)\n\n图 2-5 丢失的段和重传\n\n\
  此时，PC-A 的反应取决于所使用的传输层协议。以下是一些可能的选择：\n\n- PC-A 理解只有段 4 丢失，因此重新发送段 4。然后它发送段 7 和 8，填满窗口大小。\n\
  - PC-A 不了解收到了什么或未收到什么，因此它发送从段 4 开始的三个段，由 PC-B 指示。\n\n当然，如果丢失了两个段，除非接收方可以发送丢失段的列表，否则第一个选项将不起作用。因此，大多数使用窗口机制的协议栈将实现第二个选项。鉴于这种行为，窗口的大小会影响性能。你通常会认为窗口大小为\
  \ 100 会非常高效；然而，如果第一个段丢失，一些协议会让 *全部* 100 个段都被重新发送！如前所述，大多数协议栈使用在开始时协商的窗口大小，并且可以随时重新协商。因此，如果连接遇到大量错误，窗口大小可以减小以提高效率。一旦这些错误消失或降至较低速率，窗口大小可以增大以最大化连接的吞吐量。\n\
  \n使情况更加复杂的是，源设备和接收方设备上的窗口大小可以 *不同*。例如，PC-A 的窗口大小可能为 3，而 PC-B 的窗口大小为 10。在此示例中，PC-A\
  \ 在等待确认之前可以向 PC-B 发送十个段，而 PC-B 只能向 PC-A 发送三个段。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_110_0.png)\n\
  \n**注意** 就绪/未就绪信号和窗口机制用于在传输层实现流量控制。就绪/未就绪信号效率不高，会导致不必要的流量丢弃和传输延迟。窗口机制解决了这些问题。在窗口机制中，建立了一个窗口大小，定义了在等待接收方确认之前可以传输的段数。\n\
  \n## 第 3 层：网络层\n\n网络层负责管理数据包中的逻辑寻址信息，并使用路由表中存储的信息对这些数据包进行交付或路由。路由表是存储在路由器内存中的可用目标列表。\n\
  \n网络层负责处理逻辑地址。逻辑地址唯一标识网络上的系统，同时标识系统所在的网络。这与媒体访问控制 (MAC) 地址（烧录在网卡上的物理地址）不同，因为 MAC\
  \ 地址只为系统提供唯一地址，并不指定或暗示系统所在的网络。逻辑地址由网络层协议用来将数据包交付到正确的网络。\n\n在我们的示例中，请求来自 Web 浏览器，目标是\
  \ Web 服务器，两者都是在 TCP/IP 上运行的应用程序。此时，网络层会向数据包添加源地址（发送系统的 IP 地址）和目标地址（目标系统的 IP 地址），以便接收系统知道数据包来自何处。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_111_0.png)\n\n**考试提示** 对于考试，请记住 OSI 模型的第\
  \ 3 层处理逻辑寻址和路由。逻辑地址的示例是 IP 地址，其形式为 192.168.3.24。IP 地址也称为第 3 层地址。\n\n网络层负责四个主要功能：\n\
  \n- 定义第 3 层使用的逻辑地址\n- 基于逻辑地址的网络号查找到达目标组件的路径\n- 将不同数据链路层类型连接在一起，例如以太网、光纤分布式数据接口 (FDDI)、串行和令牌环\n\
  - 通过使用数据包来传输信息的方式定义分段\n\n\n\n\n为了在具有不同网络号码的设备之间移动信息，需要使用路由器。路由器利用逻辑地址中的信息做出智能决策，以确定如何到达目的地。路由将在第\
  \ 11 章和第 12 章中讨论，在那里你将学习路由的细节。基本上，当路由器接收到一个数据包时，它会将数据包中的目标地址（来自数据包的第 3 层头部，即目标 IP\
  \ 地址）与路由表进行比较，以确定路由器是否知道如何将数据发送到该目标网络。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_112_0.png)\n\
  \n考试提示 考试时请记住，路由器被视为第 3 层设备（网络层），并使用第 3 层地址（IP 地址）工作。\n\n## 第 2 层：数据链路层\n\n在数据链路层，数据从数据包转换为电位信号模式，用于在通信介质上传输数据。在接收系统上，电信号将由数据链路层转换为数据包，然后传递给网络层进行进一步处理。数据链路层分为两个子层：\n\
  \n- **逻辑链路控制 (LLC)** 这负责错误校正和控制功能。\n- **媒体访问控制 (MAC)** 这决定主机的物理寻址。它还决定主机如何将流量放置在介质上——例如，载波侦听多路访问/冲突检测（CSMA/CD）与令牌传递。\n\
  \nMAC 子层维护物理设备地址（通常称为 MAC 地址），用于与网络上的其他设备通信。这些物理地址被烧录到网卡中，构成了用于确定网络流量的源和目的地的低级地址。请注意，MAC\
  \ 地址用于本地网络段上的通信，而 IP 地址用于不同网络上的通信。你将在第 4 章中了解更多关于 IP 地址的信息。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_113_0.png)\n\
  \n**考试提示** 对于 CCT/CCNA 考试，请记住 MAC 地址是分配给网卡的物理地址，被称为第 2 层地址。MAC 地址是一个 48 位值，以十六进制格式显示。MAC\
  \ 地址的示例是 00-02-3F-6B-25-13。\n\n在我们的示例中，一旦发送系统的网络层附加 IP 地址信息，数据链路层将为发送和接收系统附加 MAC\
  \ 地址信息。该层还将通过将数据包转换为二进制信号来为线路准备数据。在接收系统上，数据链路层将把物理层传递给它的信号转换为数据，然后将数据包传递给网络层进行进一步处理。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_113_1.png)\n\n**考试提示** 请记住考试中，第 1 章中你学到的网络访问方法和体系结构在\
  \ OSI 模型的第 2 层运行。例如，以太网和令牌环网络体系结构在 OSI 模型的第 2 层定义。\n\n## 第 2 层帧\n\n数据链路层定义网络组件如何访问其所连接的介质，并定义介质的帧类型和传输方法。帧包括数据链路层用于与同一线路或第\
  \ 2 层拓扑上的设备通信的字段和组件。这种通信仅发生在同一数据链路层介质类型（或同一段线路）上的组件之间，在同一网络段内。例如，要跨越第 2 层协议，从以太网到令牌环，通常使用路由器。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_114_0.png)\n\n**考试提示** 考试中的一些问题要求你知道大多数广域网（WAN）协议主要在数据链路层和物理层运行。\n\
  \n本地局域网（LAN）连接的第 2 层协议和标准的示例包括电气和电子工程师学会（IEEE）802.2、802.3 和 802.5；Ethernet II；以及\
  \ FDDI。第 2 层 WAN 协议和技术的示例包括异步传输模式（ATM）、帧中继、高级数据链路控制（HDLC）、点对点协议（PPP）、同步数据链路控制（SDLC）、串行线路互联网协议（SLIP）和\
  \ X.25。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_114_1.png)\n\n**考试提示** 对于考试，请记住数据链路层定义硬件（MAC）地址以及在介质类型内发生的通信过程。交换机、网桥以及网络接口控制器或卡（NIC）是主要在数据链路层运行的网络组件。例如，交换机使用生成树协议（STP）或快速生成树协议（RSTP）防止网络环路，这些被认为是第\
  \ 2 层协议。数据链路层协议和标准的示例包括 IEEE 的 802.2 和 802.3；Ethernet II；HDLC；PPP；和帧中继。这里也进行错误检测，但不进行纠正（不重传，只丢弃坏帧）。\n\
  \n数据链路层还负责定义第 2 层帧的格式以及设备如何在物理层上相互通信的机制。数据链路层负责以下内容：\n\n- 定义 MAC 或硬件地址\n- 定义连接的物理或硬件拓扑\n\
  - 定义网络层协议如何在数据链路层帧中封装\n- 提供无连接和面向连接的服务\n- 验证接收帧的校验和以确保其有效（如果无效，则丢弃）\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_115_0.png)\n\
  \n考试提示 请记住，数据链路层的主要功能是规范连接到同一第 2 层协议的两个网络设备如何相互通信。它还验证接收帧的校验和以确保其有效。帧用于在数据链路层传输信息。如果设备位于不同的第\
  \ 2 层协议或段上，网络层（第 3 层）通常在这些设备的通信中发挥作用。\n\n## 数据链路层寻址\n\n数据链路层使用 MAC 或硬件地址进行通信。对于\
  \ LAN 通信，同一网络段或拓扑上的每台机器都需要唯一的 MAC 地址。MAC 地址长度为 48 位，表示为十六进制数字，长度为 12 个字符。为了便于阅读，MAC\
  \ 地址以点分十六进制格式表示，如下所示：FFFF.FFFF.FFFF。也常见以这种方式格式化的 MAC 地址：*FF:FF:FF:FF:FF:FF*。由于 MAC\
  \ 地址使用十六进制数字，使用的值范围从 0 到 9 和 A 到 F，单个数字共有 16 个值。例如，十六进制值 A 在十进制中为 *10*。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_116_0.png)\n\
  \n**考试提示** 对于考试，你应该记住 MAC 地址在第 2 层唯一标识设备。MAC 地址只需在广播域内唯一，该广播域包括所有第 2 层连接的冲突域。MAC\
  \ 地址使同一物理网络（第 2 层）上的不同设备之间能够通信。\n\n每个网卡制造商都被分配一个唯一的 24 位厂商 ID，然后将其用作该厂商创建的任何网卡的\
  \ MAC 地址的前 24 位。每个厂商有一个或多个唯一的厂商 ID，每个厂商 ID 构成 MAC 地址的前半部分。这前六位数字通常称为 *组织唯一标识符 (OUI)*。例如，Cisco\
  \ 的一个 OUI 值是 *0000.0C*。最后六位数字用于在 OUI 值内唯一表示网络接口卡（NIC）。理论上，每个 NIC 都有唯一的 MAC 地址。然而，实际上这可能并不正确。对你而言重要的是，在同一\
  \ *网络段* 内，你的每个设备的网卡上都有唯一的 MAC 地址。有些设备允许你更改此硬件地址，而有些则不允许。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_116_1.png)\n\
  \n**考试提示** 请记住，对于 CCT/CCNA 考试，MAC 地址的前 24 位称为 OUI，它是用于该厂商创建的所有接口卡的 MAC 地址第一部分的唯一值\n\
  \n\n\n供应商。你可以在不同的广播域或虚拟局域网中使用相同的 MAC 地址，但在同一网络段中不能使用。\n\n## 通信类型\n\n网络上可以发生不同类型的通信，每种通信都使用特定的寻址方法来识别消息的接收对象。每个数据链路层帧包含两个\
  \ MAC 地址：创建该帧的机器的源 MAC 地址，以及预期接收该帧的设备或设备的目的 MAC 地址。表 2-1 显示了三种一般的通信类型。以下各节将更深入地介绍这些通信类型。\n\
  \n| 通信类型 | 描述 |\n|---|---|\n| 单播 | 表示向段上的单个设备进行通信 |\n| 广播 | 表示向段上的每个设备进行通信 |\n|\
  \ 组播 | 表示向段上的一组设备进行通信 |\n\n表 2-1 数据链路地址类型\n\n### 单播\n\n具有目的 *unicast* MAC 地址的帧仅用于段上的一个网络组件。图\
  \ 2-6 的上部显示了单播通信的一个示例。在此示例中，PC-A 创建了一个以太网帧，其目的 MAC 地址包含 PC-C 的地址。当 PC-A 将此数据链路层帧放到线路上时，段上的所有设备都会接收到它，但除\
  \ PC-C 之外的所有系统都会丢弃该帧，因为它不是发给它们的。这为我们提供了使用单播进行一对一通信。\n\n### 单播\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_118_0.png)\n\
  \n### 组播\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_118_1.png)\n\n### 广播\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_118_2.png)\n\
  \n图 2-6 单播、组播和广播通信\n\n### 组播\n\n与单播地址不同，*multicast* 通信表示向段上的一组设备进行通信。组播组可以包含零个设备到段上的每个设备。组播的一个有趣之处在于组的成员资格是\
  \ *dynamic* 的——设备可以加入和离开组播组。（组播的详细过程超出了本书的范围。）\n\n图 2-6 的中间部分显示了组播通信的一个示例。在此示例中，请注意通信发送给少数系统，但不是所有系统。\n\
  \n### 广播\n\n*broadcast* 消息发送到网络上的所有系统。图 2-6 的底部部分显示了广播的一个示例。在此示例中，PC-A 将广播地址放在数据链路层帧的目的字段中。第\
  \ 2 层表示的广播地址为 *FF:FF:FF:FF:FF:FF*。然后该帧被放到线路上。请注意，在此示例中，计算机 B、C、D、E 和 F 接收到广播消息，并且它们\
  \ *all* 都处理它。需要注意的是，网络上的设备将处理两种帧：发往其自身 MAC 地址的帧，或发往广播地址 (*FF:FF:FF:FF:FF:FF*) 的帧。\n\
  \n## 第 1 层：物理层\n\nOSI 层次结构的最底层只关心在网络介质上移动数据位。这包括网络的物理拓扑（或结构）、所用介质的电气和物理方面，以及比特传输和接收的编码和时序。\n\
  \n在我们的示例中，一旦网络层附加了逻辑地址并将数据传递给数据链路层，在那里附加了 MAC 地址并将数据转换为电信号，数据随后会被传递给物理层，以便在通信介质上释放。在接收系统上，物理层会从线路上拾取数据并将其传递给数据链路层，在那里它将通过读取目的\
  \ MAC 地址来确保信号是发往该系统的。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_120_0.png)\n\n\
  **EXAM TIP** 请记住，对于 CCT/CCNA 考试，任何处理电信号的东西都在 OSI 模型的第 1 层运行。这包括网络电缆和连接器。\n\n物理层负责网络连接的物理机制，包括以下内容：\n\
  \n- 网络设备上使用的接口类型\n- 用于连接设备的电缆类型\n- 电缆两端使用的连接器\n- 电缆上每个连接使用的针脚排列\n- 通过将二进制数字转换为基于介质类型的物理表示来对信号上的消息进行编码，例如铜线的电信号、光纤的光信号或无线电的无线电波\n\
  \n接口类型，或 NIC，可以是您插入计算机的物理卡，例如千兆以太网卡，或路由器上的固定接口，例如 Cisco 1921 路由器上的千兆以太网端口。\n\n物理层还负责二进制信息如何转换为物理层信号以及反之亦然。例如，如果电缆使用铜作为传输介质，物理层定义了如何通过使用不同的电压电平将二进制\
  \ 1 和 0 转换为电信号。如果电缆使用光纤，物理层定义了如何使用发光二极管（LED）或激光以不同的光频率表示 1 和 0。\n\n## 设备\n\n在排除网络组件故障时，网络技术人员了解技术在\
  \ OSI 模型的哪一层运行会很有用。表 2-2 提供了在 OSI 参考模型三个层上运行的设备的提醒。\n\n| 层 | 层名称 | 设备 |\n|---|---|---|\n\
  | 3 | 网络 | 路由器 |\n| 2 | 数据链路 | 交换机、网桥、网卡 |\n| 1 | 物理 | 集线器和中继器 |\n\n表 2-2 设备及其所运行的层\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_121_0.png)\n\n**EXAM TIP** 请记住，对于考试而言，任何处理逻辑寻址或路由的技术都被认为在第\
  \ 3 层运行，任何处理 MAC 地址的技术都在第 2 层运行，任何处理电信号的技术都在 OSI 模型的第 1 层运行。\n\n现在您已经了解了七层 OSI 模型，让我们尝试一个练习来检验您新获得的知识。\n\
  \n## 练习 2-1：混合匹配 OSI 模型定义\n\n在此练习中，您将术语与其适当的定义进行匹配。本练习旨在让您有机会识别 OSI 模型每一层的目的。\n\n\
  | 定义 | 层 |\n|---|---|\n| ____ 负责数据包的逻辑寻址和交付 | A. Session |\n| ____ 负责格式化消息 | B.\
  \ Physical |\n| ____ 负责物理寻址并将数据包转换为电信号 | C. Application |\n| ____ 负责创建、管理和结束对话 |\
  \ D. Network |\n| ____ 负责可靠交付、排序以及将消息分解为数据包 | E. Data link |\n| ____ 负责将信号放置到线路上或从线路上移除\
  \ | F. Presentation |\n| ____ 负责发起或接收网络请求 | G. Transport |\n\n## 封装和解封装\n\n术语 *data\
  \ encapsulation* 指的是随着数据在 OSI 模型的七层中向下传递，报头信息会添加到消息中。例如，当信息到达 OSI 模型的第 4 层时，会添加第\
  \ 4 层报头，其中包含该层的协议信息，例如端口号。在发送系统上，添加第 4 层报头，然后数据传递到第 3 层，在那里第 3 层报头被添加到数据和第 4 层报头的左侧。第\
  \ 3 层报头包含第 3 层协议信息，例如第 3 层源地址和目的地址。一旦应用了第 3 层报头，消息随后传递到第 2 层，在那里分配第 2 层报头并包含源和目的\
  \ MAC 地址（第 2 层地址）。\n\n在接收系统上，消息沿 OSI 模型向上传递。接收系统剥离第 2 层报头并读取目的 MAC 地址以确保该系统是消息的目的地。一旦读取了第\
  \ 2 层报头，消息随后传递到第 3 层协议，该协议读取第 3 层报头（如图 2-7 所示）。这种 *de-encapsulation* 过程继续沿着 OSI\
  \ 模型的七层向上进行。\n\n\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_123_0.png)\n\n图 2-7\
  \ OSI 模型的每一层都添加一个头部。\n\n一般来说，*协议数据单元*（PDU）描述数据在 OSI 模型每一层中传递时的情况。在每一层，都会向数据添加一个新的头部。表\
  \ 2-3 描述了在各层使用的 PDU 术语。例如，当数据从会话层传递到传输层时，传输层通过添加第 4 层头部来*封装*数据 PDU。此时数据被称为段。随着 PDU\
  \ 信息向下传递，每一层都会添加自己的头部，此时数据在模型中使用不同的术语。例如，一旦添加了第 3 层头部，数据就不再称为段；它现在被视为*packet*。同样，一旦添加了第\
  \ 2 层头部信息，数据就被称为*frame*。这对你理解很重要，因为当你阅读第 9 章和第 10 章时，你会注意到我们不使用“分组包”一词——交换机运行在第\
  \ 2 层，因此它处理的是帧而不是分组包。\n\n| PDU 术语 | OSI 参考模型层 |\n|---|---|\n| 数据 | 应用层、表示层和会话层 |\n\
  | 段 | 传输层 |\n| 分组包 | 网络层 |\n| 帧 | 数据链路层 |\n| 位 | 物理层 |\n\n表 2-3 PDU 术语和层\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_124_0.png)\n\
  \n考试提示 你需要知道表 2-3 中 PDU 术语的层级指定，并且应该记住计算机以二进制（位）处理数据。你可以用一个快速的助记法来记住 PDU 术语：“Do\
  \ Sergeants Pay For Beer?”（data, segment, packet, frame, bits）。\n\n一旦到达物理层，数据链路层帧的位将被转换为物理层信号——根据所采用的物理介质类型，转换为电压、光源、无线电波或其他信号。当目的地接收到信息时，它会经历一个反向的解封装过程——基本上在信息从\
  \ OSI 模型的层到层向上传递时，剥离每一层 PDU 信息的头部和尾部。\n\n图 2-8 显示了数据在层间向下和向上传递时用于封装和解封装 PDU 的过程示例。在此示例中，你可以看到应用层、表示层和会话层如何创建数据\
  \ PDU。随着此信息从层到层向下传递，每一层都会添加自己的头部（并且可能添加尾部，如大多数第 2 层协议的情况）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_125_0.png)\n\
  \n图 2-8 封装和解封装过程\n\n接下来的几节将帮助你更好地理解设备在计算机之间传输信息时所经历的过程。下一节详细介绍了信息如何被封装并沿协议栈向下发送，然后放置在到目的地的线路上。随后的一节介绍了反向过程：信息如何在目的地被解封装并传递到应用层的应用程序。章节的最后一部分考察了一个更复杂的环境，其中网桥、路由器和集线器参与通信过程以将信息从源传递到目的地。\n\
  \n## 沿协议栈向下\n\n本节介绍信息在计算机上沿协议栈向下发送时处理的基本机制。请参考前面图 2-8 中显示的图表，随着 PC-A 向 PC-B 发送数据来跟随此过程。在此示例中，假设数据链路层为\
  \ Ethernet，物理层为铜缆。\n\nPC-A 上发生的第一个事情是，用户坐在计算机前创建某种信息或数据，然后将其发送到另一个位置（PC-B）。这包括实际的用户输入（应用层）以及任何格式信息（表示层）。会话层的应用程序（或操作系统）然后确定数据的预期目的地是本地于这台计算机（可能是磁盘驱动器）还是远程位置。在此实例中，用户将信息发送到\
  \ PC-B。我们假设用户正在执行 telnet 连接。\n\n会话层确定该位置是远程的并让传输层传递信息。Telnet 连接使用 TCP/IP 和传输层的可靠连接（TCP），它将来自更高层的数据封装成段。使用\
  \ TCP，如你在第 3 章中将看到的，只添加头部。段包含诸如源端口号和目的端口号等信息。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_126_0.png)\n\
  \n**注意** 根据 RFC 标准，TCP 或 UDP 源端口号实际上应高于 49,151，但并非所有操作系统都严格遵循此标准——在许多情况下，源端口号将高于\
  \ 1023。\n\n传输层将段向下传递给网络层，后者将段封装成分组包。分组包仅添加头部，其中包含第 3 层逻辑寻址信息（源地址和目的地址）以及其他信息，例如创建此信息的上层协议。在此示例中，TCP\
  \ 创建了此信息，因此该事实记录在分组包头部中，并且 PC-A 将其 IP 地址作为分组包中的源地址放置，PC-B 的 IP 地址作为目的地址。这有助于目的地在网络层确定分组包是否发给自己以及哪个上层进程应处理封装的段。在\
  \ TCP/IP 协议栈中，术语*packet*和*datagram*可互换使用来描述此 PDU。如你在第 3 章中将看到的，许多协议参与 TCP/IP 协议栈——地址解析协议（ARP）、TCP、UDP、互联网控制消息协议（ICMP）、开放最短路径优先（OSPF）、增强型内部网关路由协议（EIGRP）等。\n\
  \n网络层随后将分组包向下传递给数据链路层。数据链路层通过添加头部和尾部将分组包封装成帧。此示例使用 Ethernet 作为数据链路层介质，该介质在第 1 章中讨论过。放置在\
  \ Ethernet 帧头部中的重要组件是源和目的 MAC 地址，以及帧校验序列（FCS）值，以便目的地在接收时确定帧是否有效或已损坏。在此示例中，PC-A 将其\
  \ MAC 地址放置在帧的源字段中，并将 PC-B 的 MAC 地址放置在目的字段中。FCS 在第 1 章中有更深入的讨论。\n\n数据链路层帧随后被传递到物理层。此时，请记住“PDU”的概念是我们为了使数据对我们更易读以及帮助将信息传递到目的地而放在数据上的一个人类概念。然而，从计算机的角度来看，数据只是一堆二进制值，1\
  \ 和 0，或位。物理层根据电缆或连接类型将这些位转换为物理属性。在此示例中，电缆是铜缆，因此物理层会将位转换为电压：位值为 1 的一个电压电平，0 的另一个电压电平。\n\
  \n## 沿协议栈向上\n\n为简单起见，假设 PC-A 和 PC-B 在同一段铜缆上。一旦目的 PC 接收到物理层信号，物理层就会将电压电平转换回其二进制表示，并将这些位值传递给数据链路层。\n\
  \n数据链路层将位值重新组装成原始数据链路帧（Ethernet）。网络适配器检查 FCS 以确保帧有效，并检查目的 MAC 地址以确保以太网帧是发给自己的。如果目的\
  \ MAC 地址不\n\n与自身 MAC 地址匹配，或它不是多播或广播地址，网卡会丢弃该帧。否则，网卡会处理该帧。在这种情况下，网卡发现封装的数据包是 TCP/IP\
  \ 数据包，因此它剥离（解封装）以太网帧信息并将数据包上交给网络层的 TCP/IP 协议栈。\n\n网络层随后检查数据包头中的逻辑目的地址。如果目的逻辑地址与自身地址不匹配或不是多播或广播地址，网络层会丢弃该数据包。如果逻辑地址匹配，则目的地的网络层会检查数据包头中的协议信息以确定应由哪个协议处理该数据包。在此示例中，逻辑地址匹配且协议定义为\
  \ TCP。因此，网络层剥离数据包信息并将封装的分段上交给传输层的 TCP 协议。\n\n接收到分段后，传输层可以根据这是可靠连接还是不可靠连接执行许多功能。本讨论重点关注传输层的复用功能。在此实例中，传输层检查分段头中的目的端口号。在我们的示例中，PC-A\
  \ 的用户正在使用 telnet 将信息传输到 PC-B，因此目的端口号为 23。传输层检查该端口号并意识到封装的数据需要转发给 telnet 应用程序。如果\
  \ PC-B 不支持 telnet，传输层会丢弃该分段。如果支持，传输层会剥离分段信息并将封装的数据传递给 telnet 应用程序。如果这是新连接，操作系统会启动一个新的\
  \ telnet 进程。\n\n请注意，逻辑通信发生在两个设备的两个层之间。例如，PC-A 与 PC-B 之间在传输层发生逻辑通信，网络层和数据链路层也是如此。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_128_0.png)\n\n## 考试提示\n\n参加考试时，您应熟悉在设备之间传输数据时沿协议栈向下（封装）和向上（解封装）的过程。\n\
  \n## 层与通信\n\n正如封装和解封装过程所示，源计算机和目标计算机在传输和接收信息时都会发生许多过程。如果源和目标位于不同的网段，由集线器、交换机和路由器等其他网络设备分隔，则会变得更加复杂。图\
  \ 2-9 显示了此过程的一个示例。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_129_0.png)\n\n图 2-9\
  \ 多段通信\n\n让我们看看信息从 PC-A 传输到 PC-B 的路径。在此示例中，PC-A 想要向 PC-B 发送数据。请注意，每个设备都需要处理特定层的信息。例如，一旦\
  \ PC-A 将其信息放置在传输介质上，连接到 PC-A 的交换机就需要处理此信息。回想一下本章前面提到，交换机在 OSI 模型的第 2 层工作。而路由器基于目的第\
  \ 3 层逻辑地址做出路径决策，交换机则基于帧中发现的第 2 层目的 MAC 地址做出路径决策。因此，交换机的物理层必须将物理层信号转换为比特并将这些比特上交给数据链路层，在那里它们被重新组装成帧。交换机检查帧的目的\
  \ MAC 地址并做出交换决策，找到帧需要退出的端口。交换机需要将数据转发给路由器，因此它随后将帧下传到物理层，在那里帧的比特被转换为物理层信号。 （交换将在第\
  \ 9 章中更详细地讨论。）\n\n下一个遇到的设备是路由器。回想一下本章前面提到，路由器在 OSI 模型的第 3 层（网络层）工作。路由器首先在物理层将数据（即在电线上行进的电信号）转换为比特。比特被上交给数据链路层并重新组装成帧。路由器随后检查帧中的目的\
  \ MAC 地址。如果 MAC 地址与自身 MAC 地址不匹配，路由器会丢弃该帧。如果 MAC 地址匹配，路由器会剥离数据链路层帧并将数据包上交给网络层。\n\n\
  在路由器的网络层，路由器的一个功能是将数据包路由到目的地。为此，路由器检查数据包中的目的逻辑地址并从该地址中提取网络号。路由器随后将网络号与路由表中的条目进行比较。如果路由器找不到匹配项，它会丢弃数据包；如果找到匹配项，它会将数据包转发到目的接口（由路由器路由表指定的本地接口）。\n\
  \n为了实现数据包转发，路由器将数据包下传到数据链路层，后者将数据包封装为正确的数据链路层帧格式。如果这是一个以太网帧，例如，源 MAC 地址将是路由器的，目的地将是\
  \ PC-B。在数据链路层，帧随后被下传到物理层，在那里比特再次被转换为物理层电信号。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_131_0.png)\n\
  \n## 考试提示\n\n在不同网段的两个设备之间发送流量时，源设备具有以其自身 MAC 地址作为源、默认网关（路由器）MAC 地址作为目的的第 2 层帧；然而，在第\
  \ 3 层数据包中，源第 3 层地址是源设备，目的第 3 层地址不是默认网关，而是源设备试图到达的实际目的地。对于考试，请记住第 2 层地址用于在同一物理或逻辑第\
  \ 2 层网段/网络上与设备通信，而第 3 层地址用于跨网络（多个网段）与设备通信。另一种记忆方法是 MAC 地址可以从链路到链路发生变化，但默认情况下第 3\
  \ 层逻辑地址不会发生变化。\n\n请注意，路由器分隔物理或逻辑网段，而网桥和交换机则不会。因此，如果 PC-A 想要向 PC-B 发送流量，PC-A 使用路由器的\
  \ MAC（或第 2 层）地址将流量发送到网段的出口点，但它使用 PC-B 的逻辑（或第 3 层）地址告诉路由器此流量不是针对路由器，而是针对不同网段上的机器。\n\
  \n在图 2-9 中，接收这些物理层信号的下一个设备是集线器。请记住，在当今时代，这很可能是一个交换机，但我希望在图中加入一个集线器来讨论集线器如何处理数据。回想一下本章前面提到，集线器和中继器在物理层工作。基本上，集线器是一个多端口中继器：它会重复其接收到的任何物理层信号。因此，集线器一个接口上接收到的信号会被重复到其所有其他接口上。这些信号随后被\
  \ PC-B 接收，后者将此信息沿协议栈向上传递，如前一节所述。今天公司使用交换机而不是集线器，因为集线器会将数据（电信号）发送到所有端口，而交换机则会通过仅将数据发送到目的地址连接的端口来过滤流量。\n\
  \n## 针对 CCT/CCNA 考试：关于 OSI 参考模型的需要记住的内容\n\n参加考试时，请确保您熟悉 OSI 参考模型及其最初开发的原因。\n\n您应知道各层的名称和顺序：应用层、表示层、会话层、传输层、网络层、数据链路层和物理层。您还应知道在各个层工作的设备类型（路由器/网络层、交换机/数据链路层和集线器/物理层）以及这些设备执行的一些重要功能。例如，路由器在网络段之间交换数据包，它们阻止广播的传播，它们可以基于第\
  \ 3 层逻辑地址进行过滤，并且它们确定到目的逻辑网络的路径。您还应能够命名在各个层工作的示例协议。例如，telnet 和 FTP 在应用层工作。\n\n特别熟悉传输层、网络层和数据链路层及其功能。例如，传输层设置、维护和拆除连接。它可以提供数据的可靠或不可靠传输。它将数据分割成更小、更易管理的块。它可以通过就绪/未就绪信号或通过使用序列号和确认号的窗口来实现流量控制以避免拥塞。它使用缓冲区存储传入数据并通过使用端口号和第\
  \ 3 层地址复用多个连接。TCP 和 UDP 是在传输层运行的示例协议。\n\n网络层定义逻辑地址，通过路由器上的路由表找到到目的逻辑地址的最佳路径，并连接不同第\
  \ 2 层链路类型。记住路由器提供的优势，例如通过使用分层网络设计和路由协议实现可扩展性、遏制广播、智能路径选择和流量过滤。\n\n数据链路层定义设备如何连接到第\
  \ 2 层介质类型以及这些设备如何通过使用物理地址（如以太网中的 MAC 地址）相互通信。了解 MAC 地址的格式：它长 48 位，以十六进制表示。\n\n\n\
  \n你还应熟悉 OSI 参考模型各层使用的 PDU 术语——段/传输层、包或数据报/网络层、帧/数据链路层以及位/物理层。你还应能够描述设备在各层如何与其他设备通信：从源到目的地的各个设备之间使用哪些第\
  \ 2 层或第 3 层地址。请记住 MAC 地址可能会因链路而异，但第 3 层地址，例如 TCP/IP 地址，通常不会改变。\n\n## Chapter Review\n\
  \nOSI 参考模型定义了连接两个网络功能层的过程。应用层提供用户界面。表示层决定数据如何向用户表示。会话层负责建立和拆除连接。传输层负责连接的机制，包括保证服务。网络层提供逻辑拓扑和第\
  \ 3 层地址：路由器在此工作。数据链路层定义 MAC 地址以及在特定介质类型上如何进行通信：交换机、网桥和 NIC 在此工作。物理层定义连接和通信的物理属性：中继器和集线器在此工作。无线解决方案在物理层定义。\n\
  \n传输层建立并维护会话层连接，并提供可靠或不可靠的数据传输、流量控制和连接复用。可靠连接通常通过握手过程建立连接。确认用于提供可靠传输。端口或套接字号用于连接复用。就绪/未就绪信号和\
  \ windowing 用于实现流量控制。Windowing 比就绪/未就绪信号更高效。\n\n网络层定义逻辑地址，根据地址的网络部分查找到目的地的路径，并将不同的第\
  \ 2 层介质类型连接在一起。路由器用于限制广播。路由器使用其路由表，其中包含目的网络号列表，以帮助其查找目的地。如果在路由表中找不到目的地，路由器会丢弃该目的地的流量。\n\
  \n数据链路层定义硬件寻址。MAC 地址长度为 48 位，以十六进制表示。前 24 位（六位数字）是组织唯一标识符（OUI）。MAC 地址只需在逻辑段内唯一。在单播中，一个帧发送到段上的所有设备，但只有一个设备会处理它。在组播中，一个帧发送到一组设备。在广播中，一个帧发送到所有设备。\n\
  \n协议数据单元（PDU）描述数据及其开销。应用层的 PDU 称为数据，传输层的 PDU 称为段，网络层的 PDU 称为包或数据报，数据链路层的 PDU 称为帧，物理层的\
  \ PDU 称为位。随着流量向下经过协议栈，每一层都会对上层 PDU 进行封装。在目的地，随着流量向上经过协议栈，会发生解封装过程。\n\n## Quick Review\n\
  \n### Introduction to the OSI Reference Model\n\n- OSI 参考模型提供以下优势：它促进互操作性，定义如何连接相邻层，将组件分\
  \ compartmentalize，允许模块化设计，充当教学工具，并简化故障排除。\n\n### Layers of the OSI Reference Model\n\
  \n- 应用层（第 7 层）负责发起网络请求，或为该网络请求提供服务。表示层（第 6 层）定义信息格式。会话层（第 5 层）负责对话的建立和拆除。传输层（第 4\
  \ 层）处理可靠或不可靠服务的机制。网络层（第 3 层）负责逻辑寻址和路由。路由器在第 3 层工作。数据链路层（第 2 层）分配物理（MAC）地址并定义特定介质类型上设备如何相互通信。网桥、交换机和\
  \ NIC 在第 2 层工作。物理层（第 1 层）处理连接的所有物理属性。集线器和中继器在此工作。\n\n- 数据链路层定义 MAC 地址、物理或硬件拓扑以及使用的帧格式；它提供面向连接和无连接服务。MAC\
  \ 地址长度为 48 位，以十六进制表示。前六位数字是 OUI（厂商代码），后六位数字表示 OUI 内的 NIC。单播发送到段上的一个目的地，组播发送到一组设备，广播（FF:FF:FF:FF:FF:FF）发送到所有设备。\n\
  \n- 网络层定义逻辑地址，使用逻辑地址中的网络号查找到目的地的路径，并将不同介质类型连接在一起。路由器在网络层工作。路由表包含有关目的网络号及其如何到达的信息。路由器限制广播，通过分层设计实现可扩展性，比网桥做出更好的目的地到达决策，可使用\
  \ VLAN 在同一接口上切换数据包，并可实现 QoS 和过滤等高级功能。\n\n- 传输层建立并维护会话连接，将数据分段为更小的负载，提供可靠或不可靠的数据传输，实现流量控制并复用连接。可靠连接使用序列号和确认。TCP\
  \ 是示例。可靠传输协议使用握手过程建立连接。不可靠服务不使用连接建立过程。UDP 是示例。连接复用通过端口或套接字号完成。流量控制可通过就绪/未就绪信号或 windowing\
  \ 实现。Windowing 更高效。窗口大小影响吞吐量。根据大小，源可以在等待确认之前发送 X 个段。\n\n### Encapsulation and De-encapsulation\n\
  \n- 协议数据单元（PDU）描述数据及其开销。每一层都有唯一的 PDU：随着数据向下经过协议栈，每一层通过添加头部以及可能尾部进行封装。目的地在流量向上经过协议栈时对数据进行解封装。\n\
  \n- 传输层 PDU 是段，网络层 PDU 是包或数据报，数据链路层 PDU 是帧，物理层 PDU 是位。\n\n## Questions\n\n以下问题将帮助你衡量对本章材料理解程度。仔细阅读所有选项，因为可能有多个正确答案。选择每个问题的正确答案。\n\
  \n1. OSI 参考模型提供了以下所有内容，除了哪一项？\nA. 定义连接两个层之间的过程，促进供应商之间的互操作性\nB. 允许供应商将设计工作划分为模块化设计，从而简化实现并简化故障排除\n\
  C. 将复杂功能分离为更简单的组件\nD. 定义所有网络协议共有的八层\nE. 提供教学工具，帮助网络管理员理解网络组件之间使用的通信过程\n\n2. 按从高到低的顺序排列以下\
  \ OSI 参考模型层：(a) 会话，(b) 表示，(c) 物理，(d) 数据链路，(e) 网络，(f) 应用，(g) 传输。\nA. c, d, e, g,\
  \ a, b, f\nB. f, a, b, g, d, e, c\nC. f, b, g, a, e, d, c\nD. f, b, a, g, e, d,\
  \ c\n\n3. OSI 模型的 _________ 层提供物理寻址。\nA. Transport\nB. Network\nC. Data link\nD.\
  \ Physical\n\n4. Sue 注意到所有计算机上网卡的 MAC 地址前半部分（24 位）相同。MAC 地址的前 24 位代表什么？\nA. AUI\n\
  B. NIA\nC. RTP\nD. OUI\n\n5. 网络层处理以下所有问题，除了 ________。\nA. Broadcast problems\nB.\
  \ Conversion between media types\nC. Hierarchy through the use of physical addresses\n\
  D. Splitting collision domains into smaller ones\n\n6. ________ 用于提供可靠连接。\nA. Ready/not\
  \ ready signals\nB. Sequence numbers and acknowledgments\nC. Windows\nD. Ready/not\
  \ ready signals and windowing\n\n7. 连接复用是通过使用 ________ 号完成的。\nA. Socket\nB. Hardware\n\
  C. Network\nD. Session\n\n## Performance-based Questions\n\nCisco 考试有基于性能的问题，你必须将屏幕左侧的项目拖到屏幕右侧的正确位置以回答问题。以下是一些基于性能的示例问题。\n\
  \n1. 将设备与设备在 OSI 参考模型中工作的层进行匹配。\n\n\n\n第一层\n\n重复器\n\n交换机\n\n路由器\n\n集线器\n\n第二层\n\n\
  第三层\n\n2. 将PDU名称与OSI参考模型中使用它的层进行匹配。\n\n第一层\n\n第二层\n\n数据包\n\n段\n\n帧\n\n位\n\n第三层\n\
  \n第四层\n\n## 答案\n- 1. D. OSI参考模型是一个七层模型，而不是八层模型，它作为所有网络组件（包括网络硬件和软件）的标准。\n- 2. D.\
  \ 从上到下，OSI参考模型具有以下各层：应用层、表示层、会话层、传输层、网络层、数据链路层和物理层（f, b, a, g, e, d, c）。\n- 3. C.\
  \ 数据链路层提供物理寻址。\n- 4. **D.** MAC地址的前24位标识网络卡制造商的厂商ID。该ID也称为组织唯一标识符（OUI）。\n- 5. **C.**\
  \ 网络层通过使用逻辑地址而不是物理地址来创建层次结构。逻辑地址的示例是IP地址。\n- 6. **B.** 序列号和确认用于提供可靠的传输层连接。\n- 7.\
  \ **A.** 连接复用是通过使用套接字或端口号完成的。\n\n## 基于绩效的答案\n以下是对基于绩效问题的答案。\n\n1. 以下是在每个设备上运行的OSI模型层。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_139_0.png)\n\n2. 以下标识OSI模型不同层数据的PDU名称。\n\
  \n第一层\n\n位\n\n第二层\n\n帧\n\n第三层\n\n数据包\n\n第四层\n\n段\n\n# TCP/IP协议套件\n本章中，您将\n\n- 了解TCP/IP模型的各层\n\
  - 了解传输层协议\n- 使用互联网层协议\n\n当前使用最广泛的协议套件是传输控制协议/互联网协议（TCP/IP）。由于其流行性、灵活性、兼容性以及在小型和大型网络实现中都能发挥作用的能力，互联网和大多数公司内联网目前都使用TCP/IP。TCP/IP可以连接从大型机到手持计算机的各种主机。CCT和CCNA认证考试会大量测试您对TCP/IP的了解。虽然TCP/IP是最常用的协议，但它并不是最容易配置的——甚至也不是最容易理解的。本章为您提供了对TCP/IP的深入理解，包括其使用涉及的架构、寻址问题和配置。CCT和CCNA考试将测试您对该协议的了解，但最重要的是，它们将测试您对不同规模网络的协议实际配置的了解。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_141_0.png)\n\n**EXAM TIP** TCP/IP是一个协议套件——意味着其中包含多个协议。您需要为CCT认证考试了解其中若干协议，并作为CCNA考试的背景信息。\n\
  \n正如您将在本章中了解的那样，套件中的每个协议都有特定的目的和功能。对于CCT和CCNA考试来说，了解TCP/IP的演变并不重要，因此我们在此讨论您可能被测试的协议的细节。请务必花时间学习TCP/IP相关章节，因为这些知识将在您作为网络专业人员工作时帮助您。\n\
  \n## TCP/IP模型\nTCP/IP模型，也称为TCP/IP模型，是一个与七层OSI参考模型概念相似的四层模型。TCP/IP模型的四层映射到OSI版本的七层，但TCP/IP模型合并了OSI模型的多个层，如图3-1所示。TCP/IP协议套件中有多个协议指导计算机如何使用TCP/IP连接和通信，并且每个协议都在TCP/IP模型的不同的层上运行。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_142_0.png)\n\n图3-1 OSI模型与TCP/IP模型（图形由Brendon\
  \ Clarke设计和创建）\n\n## 应用层\n应用层位于TCP/IP模型的最顶层，对应于OSI模型的应用层、表示层和会话层。它负责发起网络请求（发送计算机）或处理请求（接收计算机）。因此，例如，当用户从Web浏览器提交请求时，负责提交请求的Web浏览器在应用层运行。当该Web请求到达Web服务器时，运行在应用层的Web服务器接受该请求。\n\
  \n以下是流行的应用层协议：\n\n- **超文本传输协议（HTTP）** 在Web服务器和Web浏览器之间传输HTML页面\n- **超文本传输协议安全（HTTPS）**\
  \ 从Web服务器向Web浏览器传送加密的HTML页面\n- **简单邮件传输协议（SMTP）** 发送Internet电子邮件\n- **邮局协议（POP）**\
  \ 读取或下载电子邮件到您的系统\n- **文件传输协议（FTP）** 让您从网络或Internet上的系统下载文件\n- **域名系统（DNS）** 将完全限定域名（FQDN）转换为IP地址\n\
  - **远程桌面协议（RDP）** 帮助您远程操作系统\n\n## 传输层\n下一层是传输层，它负责连接导向通信（建立会话）和无连接通信（不建立会话）。当请求从应用层向下传递时，会选择传输协议来处理它。TCP/IP中的两个传输协议是传输控制协议（TCP）和用户数据报协议（UDP）。当数据在TCP/IP模型的各层中向下传递时，如果需要连接导向通信，则使用TCP作为传输层协议，但如果需要无连接通信，则使用UDP。\n\
  \n## 互联网层\n互联网层对应于OSI模型的网络层。它负责许多重要的网络活动，例如逻辑寻址、路由以及将逻辑地址转换为物理媒体访问控制（MAC）地址。\n\n\
  以下是在此层运行的协议示例：\n\n- **互联网协议（IP）** 处理所有逻辑寻址（IP地址）和路由功能\n- **地址解析协议（ARP）** 将逻辑地址（IP地址）转换为物理地址（MAC地址）\n\
  - **互联网控制消息协议（ICMP）** 报告TCP/IP协议套件的状态和任何错误\n\n随着我们继续阅读本章，您将了解更多关于这些协议的信息。\n\n##\
  \ 网络访问层\n网络访问层有时也称为网络接口层或链路层。网络访问层对应于OSI模型的数据链路层和物理层。网络访问层组件的示例包括网络架构、物理寻址、电缆、连接器、网络媒体以及任何其他第2层和第1层网络组件。由于网络访问层组件已在第1章中讨论过，因此本章将重点介绍TCP/IP的协议。\n\
  \n## 传输层协议\n现在让我们更详细地了解一下传输层协议。请记住，传输层包括TCP和UDP协议。在本节中，您将了解每个协议的细节并检查协议头。\n\n##\
  \ 传输控制协议\nTCP负责提供连接导向通信并确保数据交付（称为可靠交付）。连接导向通信首先在两个系统之间建立连接，然后确保跨连接发送的数据到达目的地。TCP将通过重新传输任何丢失或损坏的数据来确保数据到达目的地。TCP被应用程序使用，这些应用程序需要可靠的传输，但这种传输的开销比无连接协议更大，因为会话的构建以及跨该会话的任何数据的监控和重传。\n\
  \n关于TCP的另一个需要记住的因素是，该协议要求接收方确认成功接收数据。当然，所有确认或ACK都会在网络上产生额外的流量，从而减少在给定时间范围内可以传递的数据量。TCP会话的创建、监控和结束所涉及的额外开销是值得的，因为TCP可以确保数据到达目的地。\n\
  \nTCP通过使用序列号和确认号来确保数据交付。序列号是分配给发送的每块数据的数字。系统接收到一块数据后，通过向发送方发送确认消息来确认已接收数据，其中原始序列号成为回复消息的确认号。\n\
  \n## TCP三次握手\n在系统可以通过TCP通信之前，它必须首先建立与远程系统的连接。它通过TCP三次握手来完成此操作（见图3-2）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_145_0.png)\n\
  \n\n\n\n## 图 3-2 TCP 三次握手\n\nTCP 三次握手涉及三个阶段：\n\n- 1. **SYN** 发送系统向接收系统发送 SYN 消息。每个发送的数据包都被分配一个唯一的序列号。SYN\
  \ 消息包含 *初始序列号*（ISN），即要使用的第一个序列号。在此示例中，计算机 A 正在连接到计算机 B 上的网站，因此 SYN 消息发送到计算机 B 的端口\
  \ 80。\n- 2. **SYN/ACK** 此阶段确认第一条消息，同时指示其初始序列号。在此示例中，计算机 B 发送回 SYN/ACK 消息，确认它已收到数据包\
  \ 123（通过确认 124 是下一个序列号），但它也指定了其 ISN 为 326。\n- 3. **ACK** 最后阶段是确认消息，确认第二阶段发送的数据包已收到。在此示例中，计算机\
  \ A 发送 ACK 以确认它已收到数据包 326，通过确认下一个数据包将是序列号 327。\n\n## 从 TCP 会话断开连接\n\n正如 TCP 使用三次握手过程在希望通信的两个系统之间创建连接一样，它也有一个参与者从对话中断开的过程。查看图\
  \ 3-3，如果计算机 A 想从 TCP 会话断开，它必须首先向计算机 B 发送 FIN 标志以发出它想要结束对话的信号。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_146_0.png)\n\
  \n### 图 3-3 终止 TCP 连接\n\n当计算机 B 收到 FIN 消息时，它会回复确认，然后向计算机 A 发送自己的 FIN 消息。作为此过程的最后一步，计算机\
  \ A 必须确认它已收到来自计算机 B 的 FIN 消息。这类似于与某人通过电话交谈——要结束对话，你说再见，然后等待对方说再见后再挂断。我将此描述为以“礼貌”的方式结束对话。\n\
  \n也有一种以“不礼貌”的方式结束对话的方法。回到电话类比：你可以通过在不说再见的情况下挂断电话来不礼貌地结束对话。在 TCP 世界中，你可以通过发送带有 RST（重置）标志设置的\
  \ TCP 消息来“挂断”。\n\n## TCP 端口\n\n当应用程序使用 TCP 或 UDP 在网络上通信时，每个应用程序必须由系统上的唯一端口号唯一标识。端口是分配给应用程序的地址。当客户端想要与其中一个应用程序（也称为服务）通信时，它必须将请求发送到系统上的适当端口号。\n\
  \n作为网络专业人员，你必须知道流行服务使用的一些端口号。表 3-1 标识了你在现实世界和 CCT/CCNA 认证考试中应该知道的常见 TCP 端口号。\n\n\
  | 端口 | 服务 | 描述 |\n|------|---------|-------------|\n| 20 | FTP 数据 | FTP 用于向客户端发送数据\
  \ |\n| 21 | FTP 控制 | FTP 命令发送到服务器时使用 |\n| 22 | SSH | 用作 telnet 的安全替代协议 |\n| 23 |\
  \ Telnet | Telnet 用于远程连接到系统，例如服务器或路由器 |\n| 25 | SMTP | 用于发送 Internet 电子邮件 |\n| 53\
  \ | DNS | 用于 DNS 区域传输 |\n| 80 | HTTP | 用于向浏览器提供网页 |\n| 110 | POP3 | POP3 用于读取电子邮件的\
  \ Internet 协议 |\n| 143 | IMAP | IMAP 用于读取电子邮件的较新 Internet 协议 |\n| 443 | HTTPS |\
  \ 用于安全网页流量 |\n| 3389 | RDP | 用于远程管理 Windows 系统的远程桌面的 TCP 端口 |\n\n表 3-1 常用 TCP 端口\n\
  \nTCP 和 UDP 都支持多达 65,536 个端口号，范围从 0 到 65,535。端口号分为三个不同的类别：\n\n- **众所周知** 这些端口号范围从\
  \ 0 到 1023，由 Internet 分配号码管理局（IANA）分配给在 Internet 上常用的应用程序服务器，例如 HTTP、DNS 和 SMTP。\n\
  - **已注册** 这些端口号范围从 1024 到 49,151，由 IANA 为专有应用程序分配，例如 Microsoft SQL Server、Adobe\
  \ Shockwave、Oracle 软件等。\n- **动态分配** 这些端口号范围从 49,152 到 65,535，由系统动态分配，通常由客户端软件使用，例如你的网络浏览器、FTP\
  \ 客户端或 telnet 客户端。\n\n## TCP 标志\n\nTCP 使用 TCP 标志来标识重要类型的数据包。图 3-4 显示了数据包捕获中的标志。请注意，显示的不是实际的标志，而是由\
  \ Network Monitor 解释的值并显示描述。例如，而不是看到 URG 标志设置为 0，你可以看到第一个标志设置为 0，描述为“无紧急数据”。\n\n\
  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_149_0.png)\n\n### 图 3-4 TCP 头部中的 TCP 标志\n\
  \n以下是你应为 CCT/CCNA 认证考试熟悉的常见 TCP 标志：\n\n- **SYN** SYN 标志分配给三次握手 SYN 阶段的任何数据包。\n-\
  \ **ACK** 确认标志确认先前的数据包已收到。\n- **PSH** 推送标志旨在强制数据到应用程序。\n- **URG** 紧急标志指定数据包是紧急的。\n\
  - **FIN** 完成标志指定你希望完成或结束连接。这是礼貌地结束 TCP 连接的方式——就像说再见来结束电话对话一样。\n- **RST** 重置标志用于不礼貌地结束\
  \ TCP 对话。这就像在不说再见的情况下挂断电话。\n\n## TCP 头部\n\n使用 TCP 发送的每个数据包都分配有一个 TCP 头部，其中包含 TCP\
  \ 相关信息，例如源端口、目标端口和 TCP 标志。图 3-5 显示了 TCP 头部中的不同字段。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_150_0.png)\n\
  \n### 图 3-5 TCP 头部\n\n以下是 TCP 头部中每个字段的简要描述：\n\n- **源端口** 此 16 位字段标识发送系统的端口号。\n-\
  \ **目标端口** 此 16 位字段标识数据包在目标系统上的目标端口号。\n- **序列号** 此 32 位字段标识数据包的序列号。\n- **确认号** 此\
  \ 32 位字段标识此数据包正在确认的数据包。\n- **偏移** 此 4 位字段指示数据开始的位置。\n- **保留** 此 6 位字段始终设置为 0，并为将来使用而设计。\n\
  - **标志** 此 6 位字段存储 TCP 标志。此处每个 TCP 标志都有一个 1 位字段，如本节前面所述。\n- **窗口大小** 此 16 位字段确定在期望确认之前可以发送的信息量。\n\
  - **校验和** 此 16 位字段用于验证 TCP 头部的完整性。\n- **紧急指针** 此 16 位字段仅在设置 URG 标志时使用，是对最后一段紧急信息的引用。\n\
  - **选项** 这是一个可变长度字段，指定 TCP 头部中可能需要的任何其他设置。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_151_0.png)\n\
  \n**考试提示** 请记住，对于 CCT 认证，TCP 和 UDP 被认为是 OSI 模型第 4 层（传输）协议。\n\n## 用户数据报协议\n\nUDP\
  \ 由不关心数据是否到达目标系统的应用程序使用。UDP 用于无连接通信（不可靠），这意味着数据发送到目的地，并且不会做出任何努力来跟踪数据包的进度或确定它是否到达目的地。\n\
  \n## UDP 端口\n\n与 TCP 类似，UDP 使用端口号来标识不同类型的 UDP 流量。表 3-2 标识了一些 UDP 流量示例及其使用的端口。\n\n\
  | 端口 | 服务 | 描述 |\n|------|---------|-------------|\n| 53 | DNS | UDP 端口 53 用于 DNS\
  \ 查询。 |\n| 67 和 68 | DHCP | UDP 端口 67 由 DHCP 服务使用，端口 68 由客户端请求使用。 |\n| 69 | TFTP\
  \ | Trivial File Transfer Protocol 用于在无需身份验证的情况下上传或下载文件。 |\n| 137 和 138 | NetBIOS\
  \ | UDP 端口 137 和 138 由 NetBIOS 名称服务和数据报服务使用。 |\n| 161 | SNMP | UDP 端口 161 由简单网络管理协议使用。\
  \ |\n\n表 3-2 常用 UDP 端口\n\n## UDP 头部\n\n由于 UDP 不需要确认数据包的接收，因此 UDP 头部的结构比 TCP 头部简单得多。例如，UDP\
  \ 头部不需要序列号或确认号；它也不需要标志来指示特殊数据包，例如 SYN 消息，因为没有三次握手（UDP 是无连接的）。图 3-6 显示了 UDP 头部。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_152_0.png)\n\n### 图 3-6 UDP 头部\n\n\n\n\
  UDP 头部包含以下字段：\n\n- **源端口** 该 16 位字段指示发送系统上发送应用程序使用的端口。\n- **目的端口** 该 16 位字段指示目的系统上应用程序使用的端口。\n\
  - **长度** 该 16 位字段指定 UDP 头部的大小（以字节为单位）。\n- **校验和** 该 16 位字段用于验证 UDP 头部的完整性。\n\n##\
  \ 网际层协议\n\n选择传输协议后，该协议基于通信应是有连接的还是无连接的，信息会传递到网际层以确定谁负责其交付。少数协议在网际层运行，例如 IP、ICMP\
  \ 和 ARP。\n\n### 网际协议\n\n网际协议（IP）为模型中更高层的协议提供数据包传输。它是一种无连接的传输系统，会尽最大努力尝试将数据包传递到正确的目的地。IP\
  \ 不保证数据包的传递——这是传输协议的责任；IP 只是发送数据。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_153_0.png)\n\
  \n**考试提示** 对于 CCT 和 CCNA 考试，你应该记住 IP 是 OSI 模型中的第 3 层协议，负责逻辑寻址和路由。\n\n网际协议还负责 TCP/IP\
  \ 的逻辑寻址和路由，因此被视为 OSI 模型中的第 3 层协议。路由器上的 IP 负责递减数据包的 TTL（生存时间，通常减 1），以防止其在“网络环路”中运行。一旦数据包的\
  \ TTL 递减到 0，路由器就会将数据包从网络中移除并向发送方发送状态消息（使用 ICMP）；这可以防止环路。Windows 操作系统默认 TTL 为 128，而大多数\
  \ Linux 操作系统默认 TTL 为 64。\n\n### IP 头部\n\n数据包中的 IP 头部包含有助于数据包从源到目的传输的信息。图 3-7 显示了\
  \ IP 头部结构。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_154_0.png)\n\n图 3-7 IP 头部\n\
  \n以下是 IP 头部字段及其含义的列表：\n\n- **版本** 该 4 位字段标识正在使用的 IP 版本，例如版本 4 或 6。\n- **头部长度** 该\
  \ 4 位字段指示 IP 头部的大小。\n- **服务类型** 该 8 位字段指示系统应如何处理数据包。例如，如果在此处指定低延迟选项，则意味着系统应立即处理数据包。\n\
  - **总长度** 该 16 位字段指示 IP 数据包的大小。\n- **标识** 由于网络只能处理特定最大大小的数据包——称为 *最大传输单元*（MTU）——系统可能会将发送的数据拆分为多个片段。该\
  \ 16 位字段唯一标识片段。\n- **IP 标志** 该 3 位字段指定如何处理片段。例如，更多片段（MF）标志表示还有更多片段要传输。此外，一个称为禁止分片（DF）的位指定不分片数据包。\n\
  - **分片偏移** 该 13 位字段指定在组装数据包时如何重新组合片段的顺序。\n- **生存时间（TTL）** 该 8 位字段指定数据包的过期时间。TTL\
  \ 是随着数据包经过的每个路由器而递减的值。当 TTL 达到 0 时，数据包将被丢弃。\n- **协议** 该 8 位字段指定数据包应使用哪种第 4 层协议（TCP\
  \ 或 UDP）。\n- **头部校验和** 该 16 位字段验证 IP 头部的完整性。\n- **源地址** 该 32 位字段表示发送系统的 IP 地址。这就是接收系统知道将回复消息发送到何处的方式。\n\
  - **目的地址** 该 32 位字段表示数据包的目的系统 IP 地址。\n- **IP 选项** 该可变长度字段用于指定 IP 头部中的其他设置。\n\n##\
  \ 网际控制报文协议\n\n网际控制报文协议（ICMP）使 TCP/IP 网络上的系统能够共享状态和错误信息。你可以使用状态信息来检测网络故障。ICMP 消息封装在\
  \ IP 数据报中，以便它们可以在网络中路由。使用 ICMP 消息的两个程序是 ping 和 tracert。\n\n你可以使用 ping 向 IP 地址发送\
  \ ICMP 回显请求并等待 ICMP 回显响应。Ping 报告发送请求和接收响应之间的时间间隔。使用 ping，你可以确定网络上特定 IP 系统是否正常运行。你可以使用\
  \ ping 实用程序的许多不同选项。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_156_0.png)\n\n考试提示\
  \ 请记住，对于 CCT 和 CCNA 考试，ICMP 是 TCP/IP 协议套件中负责错误和状态报告的协议。ping 和 tracert 等程序使用 ICMP。\n\
  \nTracert 跟踪到特定主机的路径。该实用程序在排除互联网故障时很有用。Tracert 在递增 IP 头部中的 TTL 字段（从 1 开始，每次递增 1）时向\
  \ IP 地址发送 ICMP 回显请求，然后分析返回的 ICMP 错误。每个后续的回显请求应在 TTL 字段达到 0 之前再深入网络一个单位，然后尝试转发它的路由器会返回“ICMP\
  \ 超时”错误消息。\n\n### ICMP 类型和代码\n\nICMP 不使用端口号，而是使用 ICMP 类型和代码来标识不同类型的消息。例如，ping 请求使用的回显请求消息使用\
  \ ICMP 类型 8，而 ping 回复则返回 ICMP 类型 0 消息。\n\nICMP 的某些类型在类型中用不同的代码进一步细分为更精细的级别。例如，ICMP\
  \ 类型 3 是“目标不可达”消息，但由于目标不可达的原因有很多，因此该类型被细分为不同的代码。每个代码代表该类型中的不同消息（见表 3-3）。\n\n| 类型\
  \ | 代码 | 描述 |\n|---|---|---|\n| 0 - 回显应答 | 0 | 回显应答消息 |\n| 3 - 目标不可达 | 0 | 目标网络\
  \ |\n|  | 1 | 目标主机不可达 |\n|  | 2 | 目标协议不可达 |\n|  | 3 | 目标端口不可达 |\n| 8 - 回显请求 | 0\
  \ | 回显请求消息 |\n\n表 3-3 常见 ICMP 类型和代码\n\n### ICMP 头部\n\n与 IP 头部和 TCP 头部相比，ICMP 头部非常小。图\
  \ 3-8 显示了 ICMP 头部，接下来是字段列表：\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_157_0.png)\n\
  \n图 3-8 ICMP 头部\n\n- **类型** 该 8 位字段指示正在使用的 ICMP 类型。\n- **代码** 该 8 位字段指示正在使用的 ICMP\
  \ 代码。\n- **校验和** 该 16 位字段用于验证 ICMP 头部的完整性。\n- **其他** 该字段存储 ICMP 头部中的任何数据。例如，Microsoft\
  \ 操作系统在此字段中放置字母的一部分用于回显请求消息。\n\n还请注意，网际组管理协议（IGMP）是另一个网际层协议，用于组播应用。\n\n## 地址解析协议\n\
  \n地址解析协议（ARP）在 TCP/IP 网络上提供 IP 地址到物理地址的解析。为了实现这一功能，ARP 发送广播消息，其中包含 ARP 请求数据包，其中包含它试图查找的系统的\
  \ IP 地址。本地网络上的所有系统都会看到该消息，而拥有 ARP 正在查找的 IP 地址的系统会通过 ARP 回复数据包向源系统发送其物理地址进行回复。然后物理/IP\
  \ 地址组合存储在源系统的 ARP 缓存中以供将来使用。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_158_0.png)\n\
  \n**考试提示** 对于 CCT 认证考试，请记住 ARP 负责将 IP 地址（第 3 层地址）转换为物理媒体访问控制（MAC）地址（第 2 层地址）。\n\n\
  所有系统都维护包含 IP 地址到物理地址映射的 ARP 缓存。在发起广播之前，始终会检查 ARP 缓存是否存在 IP 地址到物理地址的映射。让我们更详细地看看\
  \ ARP 的工作原理。\n\n### 单段 ARP 示例\n\n让我们开始讨论 ARP 在单段网络上的工作原理，在该网络中，每个人都存在于单个局域网中。图 3-9\
  \ 显示了 ARP 用法的示例。\n\n\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_159_0.png)\n\n\
  ## 图 3-9 单段上的 ARP\n\n在本例中，PC-A 想直接向 PC-B 发送信息。PC-A 知道 PC-B 的 IP 地址（或已通过 DNS 解析为\
  \ IP 地址）；然而，它不知道 PC-B 的以太网 MAC 地址。为了解析或转换 IP 地址为 MAC 地址，PC-A 生成一条 ARP 请求报文。在 ARP\
  \ 请求报文中，源 IP 地址为 10.1.1.1，目的 IP 地址为 255.255.255.255（广播地址，表示数据发往网络上的每台设备）。PC-A 在\
  \ ARP 数据报的数据字段中包含 PC-B 的 IP 地址。这被封装到一个以太网帧中，源 MAC 地址为 0000.0CCC.1111（PC-A 的 MAC\
  \ 地址），目的 MAC 地址为 FF:FF:FF:FF:FF:FF（本地广播地址），然后放置在以太网段上。PC-B 和 PC-C 都能看到此帧，因为它是发往所有系统（广播报文）。\n\
  \n两个设备的网络接口卡（NIC）注意到数据链路层广播地址并假定此帧是发给它们的，因为目的 MAC 地址是广播地址，因此它们剥离以太网帧并将带有 ARP 请求的\
  \ IP 数据报上交给互联网层。同样，目的 IP 地址字段中也有广播地址，因此两个设备的 TCP/IP 栈都会检查数据负载。PC-B 注意到这是一条 ARP 请求并且查询中的是其自身的\
  \ IP 地址，因此它直接向 PC-A 回复 PC-B 的 MAC 地址。\n\nPC-C 然而，看到这不是针对其自身 MAC 地址的 ARP 请求，并忽略该请求的数据报广播。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_160_0.png)\n\n**注意** 一个重要的事情是 PC-B 和\
  \ PC-C 在收到初始广播报文后都会将 PC-A 的 MAC 地址添加到其本地 ARP 表中。它们这样做是为了如果任一设备需要与 PC-A 通信，就不必像 PC-A\
  \ 那样执行 ARP 请求。ARP 缓存表中的条目会在 MAC 地址一段时间内未使用后超时。此时间段取决于所使用的操作系统，但通常可以由用户或管理员更改。此外，设备可以生成一个\
  \ *gratuitous ARP*，即在没有对应的 ARP 请求的情况下生成的 ARP 回复。这通常在设备可能更改其 IP 地址或 MAC 地址并希望通知段上所有其他设备有关更改，以便其他设备在其本地\
  \ ARP 表中拥有正确信息时使用。\n\n## 双段 ARP 示例\n\n图 3-10 显示了 ARP 跨网络的工作方式。对于 CCT 和 CCNA 认证考试，你理解这一点非常重要。在本例中，PC-A\
  \ 想使用 IP 连接到 PC-B。源 IP 地址为 1.1.1.1（PC-A），目的地址为 2.2.2.2（PC-B）。由于两个设备位于不同的网络，因此使用路由器在网络之间通信。因此，如果\
  \ PC-A 想向 PC-B 发送内容，必须通过中间路由器发送。然而，这种通信并非在网络层使用 IP 进行；相反，它发生在数据链路层。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_161_0.png)\n\
  \n| SRC MAC | DST MAC | SRC IP | DST IP |\n|---|---|---|---|\n| 0000.0CCC.1111 |\
  \ 0000.0CCC.2222 | 1.1.1.1 | 2.2.2.2 |\n\n| SRC MAC | DST MAC | SRC IP | DST IP\
  \ |\n|---|---|---|---|\n| 0000.0CCC.3333 | 0000.0CCC.4444 | 1.1.1.1 | 2.2.2.2 |\n\
  \n## 图 3-10 带路由器的 ARP 示例\n\nPC-A 首先要做的是确定目的 IP 地址是在本地网络还是远程网络（你将在第 4 章学习这是如何发生的）。在本例中，确定目的位于远程网络，因此\
  \ PC-A 需要知道默认网关路由器的 MAC 地址才能将数据发送给路由器。如果路由器的 MAC 地址尚未在其本地 ARP 缓存中，PC-A 将为默认网关的 MAC\
  \ 地址生成 ARP 请求。这在图 3-10 的步骤 1 中显示。在步骤 2 中，路由器用其连接到 PC-A 的以太网接口的 MAC 地址进行响应。在步骤 3\
  \ 中，PC-A 创建一个具有源和目的 IP 地址的 IP 数据包（源为 1.1.1.1，目的为 2.2.2.2，即 PC-B），并将其封装在以太网帧中，源 MAC\
  \ 地址为 PC-A，目的 MAC 地址为路由器。PC-A 然后将以太网帧发送给路由器。\n\n当路由器接收到以太网帧时，路由器将帧与其实体以太网接口上的 MAC\
  \ 地址进行比较，匹配成功。路由器剥离以太网帧并根据目的地址 2.2.2.2 做出路由决策。在这种情况下，网络直接连接到路由器的第二个接口。在步骤 4 中，如果路由器在其本地\
  \ ARP 缓存中没有 PC-B 的 MAC 地址，路由器将对 PC-B（2.2.2.2）的 MAC 地址执行 ARP，并在步骤 5 中收到响应。路由器然后在步骤\
  \ 6 中将原始 IP 数据包封装到新的以太网帧中，将其第二个接口的 MAC 地址作为源帧放置在源 MAC 地址字段中，并将 PC-B 的 MAC 地址放置在目的字段中。当\
  \ PC-B 收到此帧时，它知道该帧是发给自己的（目的 MAC 地址匹配），并且根据第 3 层 IP 头中的源 IP 地址，PC-A 是封装的 IP 数据包的源。\n\
  \n请注意，在本例中，路由器并未更改数据包中的原始 IP 地址，但使用了两个以太网帧将 IP 数据包送达目的地。此外，每个设备都会在本地 ARP 缓存中保留 MAC\
  \ 地址，因此下次 PC-A 需要向 PC-B 发送内容时，设备将不必再次对其他中间设备执行 ARP。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_162_0.png)\n\
  \n**考试提示** ARP 用于确定第 2 层地址，以便与同一广播域中的设备通信。对于考试，要熟悉第 2 层和第 3 层中哪个设备与哪个其他设备通信。当源和目的之间有路由器时，请注意第\
  \ 2 层地址在通信路径的每一步都在变化，但源和目的 IP 地址保持不变。\n\n## 练习 3-1：识别 TCP/IP 协议\n\n在本练习中，你将通过将协议与正确描述匹配来复习\
  \ TCP/IP 协议。\n\n| Protocol | Description |\n|---|---|\n| __ TCP | A. 将逻辑地址转换为物理地址\
  \ |\n| __ SMTP | B. 负责逻辑寻址和路由 |\n| __ ICMP | C. 负责可靠交付 |\n| __ ARP | D. 用于下载文件的应用层协议\
  \ |\n| __ UDP | E. 负责错误和状态报告 |\n| __ HTTPS | F. 用于发送电子邮件的互联网协议 |\n| __ FTP | G.\
  \ 网页流量的安全传输 |\n| __ IP | H. 不可靠交付 |\n\n## 章节回顾\n\n在本章中，你学习了 TCP/IP 的基础知识以及使其在当今网络市场中如此常见的因素。以下列表总结了你所学的内容：\n\
  \n- TCP/IP 是一个协议套件，其中最流行的是 TCP、UDP、IP 和 ARP。（CCT/CCNA 考试肯定会有几个问题测试你在现实世界情况下对这些协议的了解。）\n\
  - 应用层协议负责发起网络请求或为网络请求提供服务。示例应用层协议有 HTTP、FTP、DNS、SMTP 和 RDP。\n- 传输层协议处理面向连接的通信（TCP）或无连接通信（UDP）。互联网层协议处理逻辑寻址和路由功能。IP\
  \ 执行逻辑寻址，ARP 将逻辑地址转换为物理地址，而 ICMP 是状态和错误报告协议。\n\n对本章所介绍内容有深入理解后，你将不会在任何 TCP/IP 协议相关问题上遇到困难\n\
  \n\n\n你的考试。不仅这里呈现的材料对考试很重要，而且在你通过考试后继续从事网络专业职业时也很重要。\n\n## 快速复习\n\n## TCP/IP 协议套件\n\
  \n- TCP/IP 是一个协议套件。套件中的每个协议都有其自身的职责。\n- TCP 用于面向连接的、或可靠的通信。TCP 使用序列号和确认号来保证交付。\n\
  - UDP 用于无连接的、或不可靠的通信，并且不保证交付。\n- 互联网协议（IP）处理逻辑寻址和路由。它负责数据包的路由和交付。\n- ARP，地址解析协议，用于将逻辑地址转换为物理地址。\n\
  - ICMP 是 TCP/IP 协议套件中的错误报告或状态报告协议。\n\n## 问题\n\n以下问题将帮助你衡量你对本章所呈现材料理解的程度。请仔细阅读所有选项，因为可能有多个正确答案。选择每个问题的正确答案。\n\
  \n1. IP 在 OSI 模型中运行在哪一层？\nA. 第 2 层\nB. 第 3 层\nC. 第 4 层\nD. 第 5 层\n\n2. 以下哪些协议是 OSI\
  \ 模型的第 4 层协议？（选择所有适用项。）\nA. TCP\nB. IP\nC. ARP\nD. UDP\n\n3. 哪个协议负责将 IP 地址转换为 MAC\
  \ 地址？\nA. IP\nB. TCP\nC. ARP\nD. ICMP\n\n4. 哪个协议负责面向连接的通信？\nA. TCP\nB. IP\nC. UDP\n\
  D. ICMP\n\n5. 哪个协议负责错误报告和状态信息？\nA. ICMP\nB. TCP\nC. UDP\nD. IP\n\n6. 哪个协议负责逻辑寻址和数据包的交付？\n\
  A. ICMP\nB. TCP\nC. IP\nD. UDP\n\n7. TCP 使用哪两项来保证数据的交付？（选择两项。）\nA. 源端口\nB. 确认号\n\
  C. IP 地址\nD. 目标端口\nE. 序列号\n\n8. IP 头中哪个字段标识数据包来自的系统？\nA. 源 IP 地址\nB. 协议\nC. 目标 IP\
  \ 地址\nD. 源端口\n\n9. TCP 头中哪个字段用于指定数据包的目标应用程序？\nA. 源端口\nB. 目标 IP 地址\nC. 源 IP 地址\n\
  D. 目标端口\n\n## 基于性能的问题\n\n基于性能的问题是你在思科考试中会遇到的交互式问题，你必须将对象从屏幕的一个区域拖到另一个区域。以下基于本章内容的是基于性能的示例问题。\n\
  \n1. 使用以下示例，将左侧找到的协议写入右侧适当的框中，以标识协议运行的层。在真正的考试中，你需要将项目拖放到适当的框中。\n\n- ARP\n- SMTP\n\
  - ICMP\n- TCP\n- FTP\n- IP\n- Ethernet\n- HTTP\n- UDP\n\n## 应用层\n\n## 传输层\n\n##\
  \ 互联网层\n\n## 网络访问层\n\n2. 查看以下示例，通过将阶段名称写入框中来标识 TCP 三次握手的阶段。在真正的考试中，你需要将左侧找到的阶段拖到右侧适当的框中。\n\
  \n- SYN/ACK\n- ACK\n- SYN\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_167_0.png)\n\
  \n## 答案\n\n1. B. 互联网协议负责逻辑寻址和路由，这是 OSI 模型第 3 层的功能。\n\n2. A, D. TCP 和 UDP 是传输、第 4\
  \ 层协议。TCP 负责面向连接的通信和无差错交付，而 UDP 负责无连接通信。\n\n3. C. 地址解析协议（ARP）负责将 IP 地址转换为 MAC 地址，以便通信可以发生。\n\
  4. A. TCP 在 TCP/IP 协议套件中负责面向连接的通信。\n5. A. ICMP 负责在通过 TCP/IP 通信时报告错误并发送回状态信息。\n6.\
  \ C. IP 负责数据包交付和逻辑寻址。\n7. B, E. 序列号和确认号由 TCP 用于保证数据的交付。每个消息都被分配一个序列号，当它被目标接收时，会发送回一个带有确认号的\
  \ ACK 消息。\n8. A. 数据包的源 IP 地址标识数据包发送自的系统。这很重要，因为接收系统知道要回复谁，因为发送者的 IP 地址位于源 IP 地址字段中。\n\
  9. D. 目标端口用于标识目标系统上消息要发送到的应用程序的端口号。\n\n## 基于性能的答案\n\n1. 以下示例显示了正确的应用层、传输层、互联网层和网络访问层协议。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_169_0.png)\n\n2. 以下示例显示了 TCP 三次握手的正确阶段。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_169_1.png)\n\n# IP 地址基础\n\n在本章中，你将\n\n\
  - 复习 TCP/IP 基础知识\n- 了解 TCP/IP 地址\n- 了解如何配置 IP 地址设置\n- 了解通信的路径\n\n阅读本章将使你对 TCP/IP\
  \ 地址有深入的理解，在你阅读第 5 章子网划分之前，你需要很好地了解这一点。CCT/CCNA 考试将测试你对不同规模网络的地址配置知识，从地址类开始，逐步深入到子网划分。在参加\
  \ CCT/CCNA 考试之前，你应该对本章和下一章所呈现的信息有深入的理解。\n\n## 配置 TCP/IP\n\n你已经了解了 TCP/IP 套件中存在的一些流行协议。本节将通过讨论寻址方案和为系统分配地址的规则来介绍\
  \ TCP/IP 的配置。要正确配置 TCP/IP，你必须知道 IP 地址、子网掩码和默认网关的设置。让我们从 IP 地址开始。\n\n## IP 地址\n\n\
  IP 地址是一个 32 位值，用于唯一标识网络（或互联网）上的系统。IP 地址分为四个数字，每个数字由一个句点分隔（例如，192.168.1.15）。四个数字中的每一个由\
  \ 8 位组成，有四个 8 位数字，共计 32 位。\n\n每个 8 位值称为一个 *八位组*（例如，前述示例中的 192 或 168 是一个八位组）。IP 地址中有四个八位组。IP\
  \ 地址中的四个八位组分为两部分：网络 ID 和主机 ID。IP 地址的网络 ID 部分是唯一标识特定网络的数字，而主机 ID 部分是唯一标识该网络上的计算机或设备的数字。子网掩码决定了网络\
  \ ID 的位数和主机 ID 的位数。让我们看看这是如何工作的。\n\n## 子网掩码\n\n子网掩码由 TCP/IP 用于确定主机是在本地网络还是远程网络上。当在八位组中使用\
  \ 255 时，则 IP 地址中对应位置的八位组（同一位置的八位组）表示网络 ID。因此，如果我的 IP 地址是 192.168.1.15 而我的子网掩码是 255.255.255.0，则子网掩码的前三个八位组（255.255.255）将表示网络\
  \ ID（对应于 192.168.1），而最后一个八位组（0）将表示主机 ID（对应于 15）。同样，网络 ID 为网络本身分配唯一地址，而主机 ID 唯一标识网络上的系统。\n\
  \n使用另一个示例，如果子网掩码是 255.0.0.0，则意味着 IP 地址的第一个八位组（我们示例中的 192）用作网络 ID 部分，而最后三个八位组（168.1.15）是\
  \ IP 地址的主机 ID 部分。\n\n表 4-1 总结了第一个示例。你可以看到网络 ID（在最下行用“N”表示）是 192.168.1，而主机 ID 是值为\
  \ 15 的最后一个八位组。这意味着该系统位于 192.168.1 网络上，同一网络上的任何其他系统都将具有相同的网络 ID。\n\n\n\n| | 八位组 1\
  \ | 八位组 2 | 八位组 3 | 八位组 4 |\n|---|---|---|---|---|\n| IP 地址 | 192 | 168 | 1 | 15\
  \ |\n| 子网掩码 | 255 | 255 | 255 | 0 |\n| 地址部分 | N | N | N | H |\n\n表 4-1 识别 IP 地址的网络\
  \ ID 和主机 ID 部分\n\n那么子网掩码的用途是什么？或者更确切地说，为什么我们要有子网掩码来将 IP 地址划分为网络 ID 和主机 ID？当像 192.168.1.15\
  \ 这样具有 255.255.255.0 子网掩码的系统向系统 192.198.45.10 发送数据时，发送系统首先需要确定目标计算机是否存在于同一网络上。它通过比较网络\
  \ ID 来实现这一点（参见表 4-2）；如果网络 ID 相同，则两个系统都存在于同一网络上，一个系统可以在不使用路由器的情况下向另一个系统发送数据。如果系统存在于不同的网络上，则数据需要传递给路由器，以便路由器可以将数据发送到另一个网络。\n\
  \n| | 八位组 1 | 八位组 2 | 八位组 3 | 八位组 4 |\n|---|---|---|---|---|\n| IP 地址 1 | 192 |\
  \ 168 | 1 | 15 |\n| 子网掩码 | 255 | 255 | 255 | 0 |\n| IP 地址 2 | 192 | 198 | 45 | 10\
  \ |\n\n表 4-2 使用子网掩码识别位于不同网络上的两个系统\n\n## 练习 4-1：识别远程系统\n\n在本练习中，你将通过填写下表来确定两个系统是否存在于同一网络或不同网络上：\n\
  \n| 计算机 A（IP地址） | 计算机 A（子网掩码） | 计算机 B（IP地址） | 是否同一网络？ |\n|---|---|---|---|\n| 12.45.8.34\
  \ | 255.0.0.0 | 14.34.212.5 | |\n| 131.107.4.78 | 255.255.0.0 | 131.108.45.112 |\
  \ |\n| 198.45.23.2 | 255.255.255.0 | 198.45.23.14 | |\n| 26.45.78.5 | 255.0.0.0\
  \ | 28.45.78.15 | |\n| 176.34.56.12 | 255.255.0.0 | 176.34.12.10 | |\n\n## 默认网关\n\
  \n当你的系统想要向网络上的另一个系统发送数据时，它会查看自己的网络 ID 并将其与目标系统的网络 ID 进行比较。如果两者似乎具有相同的网络 ID，则数据会直接从你的系统发送到目标系统。如果两个系统位于不同的网络上，则你的系统必须将数据传递给路由器，以便路由器可以将数据发送到目标系统的路由器。你的系统如何知道路由器在哪里？默认网关是用于将数据从你的网络发送到另一个网络的路由器的\
  \ IP 地址。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_173_0.png)\n\n**注意** 简而言之，要在\
  \ Internet 上通信，你的系统需要配置 IP 地址、子网掩码和默认网关。如果你只需要与网络上的其他系统通信，则只需要 IP 地址和子网掩码。\n\n##\
  \ TCP/IP 地址\n\n本节介绍 IP 地址的二进制表示，并确保在进入第 5 章之前，你能够熟练地将二进制值转换为十进制以及地址类。你还将了解地址类型、地址方案和\
  \ TCP/IP 端口。\n\n## 理解二进制\n\n你从之前的讨论中知道，IP 地址是一个 32 位地址，分为四个 8 位八位组。这四个八位组通常以十进制值显示，但它们也有如下所示的二进制表示：\n\
  \n```\n11000000 10101000 00000001 00001111\n```\n\n请注意，有四组 8 位（1 或 0），它们构成了 IP 地址的\
  \ 32 位（8 × 4 组）。让我们看看如何确定八位组的二进制表示。\n\n每个八位组内 8 个位的数值如表 4-3 所示。你可以看到，八位组中的第一个位（最右边）十进制值为\
  \ 1，第二个位十进制值为 2，第三个位十进制值为 4，每个附加位的数值都会翻倍。你还可以看到第八个位的十进制值为 128。\n\n| 位 | 8 | 7 |\
  \ 6 | 5 | 4 | 3 | 2 | 1 |\n|---|---|---|---|---|---|---|---|---|\n| 值 | 128 | 64\
  \ | 32 | 16 | 8 | 4 | 2 | 1 |\n\n表 4-3 与八位组中每个位关联的值\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_174_0.png)\n\
  \n注意 第一个位被称为最低有效位或低位，而第八个位被称为最高有效位或高位。\n\n要计算像 192 这样的十进制数的八位组的二进制值，例如，你需要启用或打开那些加起来等于\
  \ 192 的位，如表 4-4 所示。\n\n| 位 | 8 | 7 | 6 | 5 | 4 | 3 | 2 | 1 |\n| 值 | 128 | 64 | 32\
  \ | 16 | 8 | 4 | 2 | 1 |\n| 状态 | 开启 | 开启 |  |  |  |  |  |  |\n\n表 4-4 计算 192 的十进制值在二进制中的表示\n\
  \n在表中，注意位 8 和位 7 被打开以提供 128 + 64 的值，等于 192。剩余的位将处于“关闭”状态，这意味着它们不包含在计算中。处于开启状态的位取“1”，关闭状态取“0”。因此，组成数字\
  \ 192 的 8 位组合为 11000000。\n\n现在你已经知道如何将十进制值转换为二进制以及将二进制值转换为十进制，在进入地址类部分之前，请尝试练习 4-2\
  \ 和练习 4-3。\n\n## 练习 4-2：将十进制转换为二进制\n\n在本练习中，你将通过填写下表来练习将十进制值转换为二进制：\n\n| 十进制 | 二进制\
  \ |\n|---|---|\n| 127 |  |\n| 131 |  |\n| 198 |  |\n| 224 |  |\n| 96 |  |\n| 192.168.1.100\
  \ |  |\n| 216.83.11.78 |  |\n| 202.14.45.0 |  |\n\n## 练习 4-3：将二进制转换为十进制\n\n在本练习中，你将通过填写下表来练习将二进制值转换为十进制值：\n\
  \n| 二进制 | 十进制 |\n|---|---|\n| 10110101 |  |\n| 11000011 |  |\n| 10000111 |  |\n\
  | 11111111 |  |\n| 10101011 |  |\n| 11000001.10000001.00001011.10100001 |  |\n|\
  \ 00000111.10101001.00110101.10110101 |  |\n| 11000000.10100001.00000111.11111111\
  \ |  |\n\n## 地址类\n\n每个 IP 地址都属于一个不同的 *地址类*。互联网社区定义了这些类以适应各种规模的网络。IP 地址所属的类最初决定了地址的网络\
  \ ID 和主机 ID 部分，以及该网络支持的主机数量。不同的类地址有类 A、类 B、类 C、类 D 和类 E。\n\n表 4-5 总结了你应为考试了解的地址类的重要方面。以下各节对每个类提供了更多详细信息。\n\
  \n|  | 第一个八位组值 | 子网掩码 | 每个网络的主机数 |\n|---|---|---|---|\n| 类 A | 1-127 | 255.0.0.0\
  \ | 16,777,214 |\n| 类 B | 128-191 | 255.255.0.0 | 65,534 |\n| 类 C | 192-223 | 255.255.255.0\
  \ | 254 |\n\n表 4-5 地址类的重要方面\n\n## 类 A 地址\n\n类 A 地址的默认子网掩码为 255.0.0.0，这意味着第一个八位组是网络\
  \ ID，最后三个八位组代表地址的主机 ID 部分。每个八位组可以包含 256 个可能的值（0-255），因此类 A 地址在网络上支持 16,777,216 个主机（256\
  \ × 256 × 256）。实际上，只能使用 16,777,214 个有效地址分配给系统，因为每个 IP 网络上都有两个地址你不允许分配给系统，因为它们是保留的。这些是所有主机位设为\
  \ 0s（网络 ID）的地址和所有主机位设为 1s（广播地址）的地址。因此，使用类 A 地址时，你将无法将 n.0.0.0 或 n.255.255.255（其中\
  \ n 是你的网络 ID）分配给网络上的任何主机。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_177_0.png)\n\
  \n考试提示 你需要知道如何为考试识别类 A 地址。类 A 地址的 IP 地址中第一个八位组在 1 到 127 之间。类 A 地址的默认子网掩码也为 255.0.0.0。你可以始终通过第一个八位组的值落在\
  \ 1 到 127 之间来识别类 A 地址。虽然以 127 开头的地址在技术上是类 A 地址，但你不允许使用任何以 127 开头的地址，因为它保留用于环回地址（稍后将介绍环回地址）。类\
  \ A 地址的示例是 IP 地址 12.56.87.34：第一个八位组为 12，落在 1–127 的范围内。\n\n## 类 B 地址\n\n类 B 地址的默认子网掩码为\
  \ 255.255.0.0，这意味着前两个八位组是网络 ID，最后两个八位组是主机 ID 部分。这意味着我们可以在网络上拥有 65,536 个主机（256 ×\
  \ 256）。哦，但等等！不要忘记减去两个保留地址，这样我们就有 65,534 个地址可以分配给网络上的主机。你可以通过第一个八位组开始的数字落在 128 到\
  \ 191 之间来识别类 B 地址。由于类 B 地址支持的主机数量，中型公司使用类 B 地址。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_178_0.png)\n\
  \n考试提示 你需要知道如何为考试识别类 B 地址。类 B 地址的 IP 地址中第一个八位组的值在 128 到 191 之间。记住类 B 地址的默认子网掩码为\
  \ 255.255.0.0。\n\n## 类 C 地址\n\n类 C 地址的子网掩码为 255.255.255.0，这意味着前三个八位组是网络 ID，最后一个八位组是主机\
  \ ID。\n\n\n\n仅有一个八位组作为主机 ID 意味着 C 类地址在网络上只能支持 254 个主机（256 − 2）。\n\nC 类地址的第一个八位组的值范围在\
  \ 192 到 223 之间。例如，IP地址 202.45.8.6 是 C 类地址，因为 202 介于 192 和 223 之间。你也知道该系统具有子网掩码 255.255.255.0，因为它是\
  \ C 类地址。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_179_0.png)\n\n**考试提示** 你需要在考试中知道如何识别\
  \ C 类地址。C 类地址的第一个八位组的值介于 192 和 223 之间。此外，请记住 C 类地址的默认子网掩码为 255.255.255.0。\n\n##\
  \ D 类地址\n\nD 类地址用于网络上的特殊类型的应用——*多播应用*。多播应用通过向多播地址发送数据同时向多台系统发送数据，任何已注册该地址的系统都会接收到数据。由于\
  \ D 类地址用于多播地址，你不会将它们专门分配给网络上的主机用于正常网络通信。\n\nD 类地址的第一个八位组的值范围为 224 到 239。拥有如此多的范围，D\
  \ 类最多可支持 268,435,456 个唯一的组播组，用户可以从多播应用中订阅。\n\n## E 类地址\n\n有趣的是，E 类地址仅为实验目的而设计，因此你永远不会在网络上看到\
  \ E 类地址。E 类地址的第一个八位组的值介于 240 和 247 之间。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_180_0.png)\n\
  \n**考试提示** 可以保证你在两场考试中都会看到有关识别 A、B 和 C 类地址的问题。务必了解每个类别的特征，例如该类别中的地址范围、支持的主机数量以及默认子网掩码。\n\
  \n## 练习 4-4：识别地址类别\n\n在本练习中，你将练习为不同的 IP 地址及其相关子网掩码识别地址类别。填写下表：\n\n| IP 地址 | 子网掩码\
  \ | 地址类别 |\n|---|---|---|\n| 27.56.89.234 |  |  |\n| 196.79.123.56 |  |  |\n| 130.49.34.23\
  \ |  |  |\n| 109.189.109.200 |  |  |\n| 189.90.23.100 |  |  |\n| 126.34.100.12 |\
  \  |  |\n| 14.198.120.100 |  |  |\n\n## 定义类别的规则\n\n我经常被问到 IPv4 的设计者是如何为每个类别制定地址范围的。设计者通过以下规则定义每个类别的边界来确定类别：\n\
  \n- *A 类地址始终以 0 开头。* 这给出二进制值 **00000001** 到 **01111111**，换算为十进制为 1 到 127。请注意，你不能有地址\
  \ 00000000，因此该范围从 1 开始。\n- *B 类地址始终以 10 开头。* 这给出二进制值 **10**000000 到 **10**111111，换算为十进制为\
  \ 128 到 191。\n- *C 类地址始终以 110 开头。* 这给出二进制值 **110**00000 到 **110**11111，换算为十进制为 192\
  \ 到 223。\n- *D 类地址始终以 1110 开头。* 这给出二进制值 **1110**000 到 **1110**1111，换算为十进制为 224 到\
  \ 239。\n- *E 类地址始终以 11110 开头。* 这给出二进制值 **11110**000 到 **11110**111，换算为十进制为 240 到\
  \ 247。\n\n## 环回地址\n\n你已了解到不允许将主机分配为第一个八位组值为 127 的 IP 地址。这是因为 A 类地址范围 127 已保留用于环回地址。\n\
  \n环回地址用于引用本地系统，也称为 *本地主机*。如果要验证 TCP/IP 软件是否已在本地系统上初始化，即使你可能没有 IP 地址，也可以 ping 环回地址，通常称为\
  \ 127.0.0.1。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_181_0.png)\n\n**注意** 你可以从命令行通过输入\
  \ **ping 127.0.0.1**、**ping localhost** 或 **ping loopback** 来测试你自己的本地系统，以验证 TCP/IP\
  \ 协议栈在你的系统上是否正常运行。\n\n## 私有地址\n\n你需要了解的另一种地址类型是 *私有地址*。私有地址可以分配给系统，但不能用于任何类型的 Internet\
  \ 连接。私有地址在 Internet 上是 *不可路由* 的，因此使用它们的任何系统都无法在 Internet 上路由数据。以下三个地址范围为私有：\n\n\
  - 10.0.0.0–10.255.255.255\n- 172.16.0.0–172.31.255.255\n- 192.168.0.0–192.168.255.255\n\
  \n由于 Internet 的增长，无法让每个需要 Internet 访问的设备都使用公共 IP 地址，因为地址已耗尽。因此私有地址在网络内部使用，因为它们不会被\
  \ Internet 上的其他系统看到；我们使用网络地址转换（NAT）设备将私有地址转换为公共地址。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_182_0.png)\n\
  \n**考试提示** 请记住，对于 CCT/CCNA 考试而言，今天网络的一个主要设计考虑是内部使用私有地址，并使用 NAT 设备将私有地址（在 Internet\
  \ 上不可路由）转换为可在 Internet 上路由的公共地址。这本质上使大量运行私有地址的计算机可以共享 NAT 设备的公共地址以获得 Internet 访问。\n\
  \n## APIPA\n\n今天的系统支持 *自动私有 IP 地址分配*（APIPA）功能。当客户端启动且无法联系 DHCP 服务器时，客户端将自动为自己配置一个\
  \ 169.254.x.y 地址。如果 DHCP 服务器出现问题且网络上没有任何系统能够获取地址，所有客户端都将为自己分配 169.254 地址范围内的地址，然后能够相互通信（因为它们都在同一网络上）。\n\
  \nAPIPA 不分配默认网关，因此你将无法访问远程网络和 Internet 上的资源——但仍可以与网络上的系统通信。在排除故障以确定机器为何无法在网络上通信时，请注意具有\
  \ 169.254.x.y 地址范围的系统，因为这表明它们找不到 DHCP 服务器。\n\n## 主机无效的 IP 地址\n\n一些 IP 地址不能分配给网络上的主机。例如，你可能会想，为什么\
  \ C 类地址只能有 254 个主机，而不是 256 个主机，看起来更合理，因为 8 位数字可以有 256 个可能值。这种表面上的差异的原因是可用主机池中丢失了两个地址。第一个是主机\
  \ ID 中所有位都设置为 0 的地址，表示网络的网络 ID。第二个是主机 ID 中所有位都设置为 1 的地址，表示网络的广播地址。因此，例如，在 C 类网络\
  \ 200.158.157.x 中，地址 200.158.157.0（网络 ID）和 200.158.157.255（广播地址）不可用于分配给网络上的主机，将可用主机数从\
  \ 256 减少到 254。\n\n另一个非法地址是第一个八位组为 127 的任何系统；请记住，这已保留为环回地址，你无法将该地址分配给任何主机。以下总结了非法地址：\n\
  \n- **以 127 开头的任何地址** 以 127 开头的 IP 地址保留用于环回地址，不能分配给系统。此非法地址的示例为 127.50.10.23。\n\
  - **所有主机位设为 0** 不允许将具有主机 ID 部分所有位都设为 0 的 IP 地址分配给系统，因为这是网络 ID。此非法地址的示例为 131.107.0.0。\n\
  - **所有主机位设为 1** 不允许将具有所有主机位都设为 1 的 IP 地址分配给系统，因为这对应于网络的广播地址。此类非法地址的示例为 131.107.255.255。\n\
  - **重复地址** 不允许将另一个系统正在使用的地址分配给系统，因为这会导致重复 IP 地址错误。\n\n使用这些地址时无法在 Internet 上路由数据不会构成问题，因为实际上，这些私有地址将位于\
  \ NAT 服务器之后，NAT 服务器会将私有地址转换为可在 Internet 上路由的公共地址。第 13 章提供了有关 NAT 的更多信息。\n\n## 练习\
  \ 4-5：理解有效地址\n\n在本练习中，你将通过记录以下每个地址是否有效来练习识别有效地址。有效地址可以分配给网络上的系统。如果地址无效，请说明原因。\n\n\
  \n\n\n| 地址 | 有效？ |\n|---|---|\n| 10.0.40.10 | |\n| 127.54.67.89 | |\n| 131.107.34.0\
  \ | |\n| 45.12.0.0 | |\n| 216.83.11.255 | |\n| 63.256.4.78 | |\n| 200.67.34.0 |\
  \ |\n| 131.107.23.255 | |\n\n## 地址方案\n\n在网络上，数据可以通过几种不同的方式发送到目的地：数据可以发送到单播地址、广播地址或组播地址。以下概述了单播、广播和组播之间的区别：\n\
  \n- **单播** 将信息发送到一台系统。使用 IP 时，这是通过将数据发送到目标系统的 IP 地址来实现的。\n- **广播** 将信息发送到网络上的所有系统。发往所有系统的數據是通过使用网络的广播地址发送的。网络的广播地址示例为\
  \ 192.168.2.255。广播地址是通过将所有主机位设为 1 然后将八位组转换为十进制数来确定的。还有一个网络间广播地址 255.255.255.255，用于要发送到所有网络的数据。\n\
  - **组播** 将信息发送到选定的系统组。通常，这是通过让系统订阅组播地址来实现的。发送到组播地址的任何数据随后都会被订阅该地址的所有系统接收。大多数组播地址以\
  \ 224.x.y.z 开头，被视为 D 类地址。\n\n## TCP/IP 端口\n\n应用程序或进程使用 TCP/IP 端口作为在系统上运行的该应用程序/进程的标识符。当你从一台计算机向另一台计算机发送数据时，你将数据发送到该应用程序使用的端口。例如，当你在\
  \ Web 浏览器中输入网站的 IP 地址时，Web 浏览器通过将数据发送到端口 80（图 4-1 所示），连接到该系统上运行的 Web 服务器（或 Web 应用程序），这是\
  \ Web 服务器的默认端口。当 Web 服务器通过向浏览器发送网页来响应你的请求时，由于浏览器也在特定端口上运行，因此 Web 服务器将页面发送到 Web 浏览器的端口。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_186_0.png)\n\n图 4-1 将数据发送到端口 80 的 Web\
  \ 服务器\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_187_0.png)\n\n**考试提示** 对于考试，请记住\
  \ TCP 和 UDP 协议都使用端口号。\n\n服务器应用程序通常使用 1024 以下的低端口号，而客户端应用程序通常在大于 1024 的端口号上运行。端口有三种类型：\n\
  \n- **众所周知的端口** 这些端口号由服务器使用，范围从 0 到 1023。\n- **已注册端口** 这些端口分配给某些应用程序或协议。已注册端口范围从\
  \ 1024 到 49151。\n- **动态端口** 这些端口由应用程序临时使用，范围从 49152 到 65535。它们被称为动态端口，因为很多时候，端口是在运行时由应用程序选择的，并且每次程序运行时都不同。例如，当你启动\
  \ Internet Explorer 时，它每次启动程序时可能使用不同的端口号，而 Web 服务器每次都使用相同的端口（端口 80）。\n\n表 4-6 列出了不同类型应用程序或协议使用的众所周知的端口号。务必为\
  \ CCNA 考试了解这些。\n\n| 端口号 | 进程 | 描述 |\n|---|---|---|\n| 20 | FTP-DATA | 文件传输协议——用于从一台机器向另一台机器传输数据\
  \ |\n| 21 | FTP | 文件传输协议——用于 FTP 会话的控制消息 |\n| 22 | SSH | 安全 Shell——用于创建安全连接以管理设备，如服务器、交换机或路由器\
  \ |\n| 23 | Telnet | Telnet——Telnet 用于远程连接到系统，如服务器、交换机或路由器 |\n| 25 | SMTP | 简单邮件传输协议——用于通过\
  \ Internet 发送电子邮件 |\n| 53 | DNS | 域名系统——用于查询 DNS 服务器以获取远程系统的 IP 地址 |\n| 67 or 68\
  \ | DHCP | 由域名主机配置协议（DHCP）客户端和服务器使用，以自动配置客户端 |\n| 69 | TFTP | 简单文件传输协议——一种快速的基于\
  \ UDP 的文件传输协议，不需要身份验证 |\n| 80 | HTTP | 超文本传输协议——用于从 Web 服务器向 Web 客户端提供网页 |\n| 110\
  \ | POP3 | 邮局协议，版本 3——用于通过 Internet 读取电子邮件 |\n| 119 | NNTP | 网络新闻传输协议——用于从新闻服务器读取新闻文章\
  \ |\n| 123 | NTP | 网络时间协议——用于同步系统的时间 |\n| 137–139 | NetBIOS | Windows 系统用于 NetBIOS\
  \ 会话 |\n| 143 | IMAP4 | Internet 消息访问协议，版本 4——另一种用于读取电子邮件的 Internet 协议 |\n| 443\
  \ | HTTPS | 安全超文本传输协议——用于在客户端和服务器之间加密 Web 流量 |\n| 445 | SMB | 服务器消息块——微软文件共享协议 |\n\
  | 1720 | H.323 | 一种较旧的协议，用于通过计算机网络传输音频和视频数据 |\n| 2427/2727 | MGCP | 媒体网关控制协议——用于控制媒体网关的\
  \ VoIP 协议 |\n| 3389 | RDP | 远程桌面协议——用于远程连接和 |\n| 5004/5005 | RTP | 实时传输协议——用于在 VoIP\
  \ 通信中在电话之间发送语音数据 |\n| 5060/5061 | SIP | 会话发起协议——用于设置语音 over IP（VoIP）呼叫 |\n\n表 4-6\
  \ 用于流行的 Internet 应用程序的端口\n\n你将会经常听到另一个术语，即套接字，它是通信的端点，由三个组成部分：系统的 IP 地址、应用程序的端口号以及正在使用的协议，即\
  \ TCP 或 UDP。套接字是数据从一个系统发送到另一个系统的方式，更准确地说，是从一个应用程序发送到另一个应用程序。以下公式定义了套接字是什么：\n\n*套接字\
  \ = IP 地址 + 端口号 + 协议（TCP 或 UDP）*\n\n## 配置 IP 地址设置\n\n新的 CCNA 考试要求你知道如何在包括 Windows、Linux\
  \ 和 macOS 系统的主机系统上配置和验证 IP 地址。以下各节演示了如何在这些系统上配置和验证 TCP/IP 设置。\n\n### 手动配置与 DHCP\n\
  \n在为工作站或路由器和交换机等网络设备配置 IP 地址设置时，你可以手动配置设置，也可以动态分配地址通过 DHCP。\n\n### 手动配置\n\n对工作站或路由器等设备进行手动配置涉及进入网络接口的配置并手动输入\
  \ IP 地址、子网掩码和默认网关设置。手动配置可能非常耗时，因此我们通常只手动配置服务器、路由器和交换机。网络上的客户端从 DHCP 服务器动态获取其 IP\
  \ 地址。\n\n### 动态配置\n\n在大型基于 TCP/IP 的网络上配置 IP 地址可能是一场噩梦，尤其是在机器经常从一个网络移动到另一个网络时。DHCP\
  \ 可以通过在启动时自动为系统分配地址来帮助配置网络上的系统的工作量。\n\n动态分配 IP 地址的过程由 DHCP 服务器管理。DHCP 服务器可以是单独的设备、服务器上运行的服务，或加载在你的\
  \ Cisco 路由器上的服务。DHCP 服务配置有一组可用的 IP 地址，称为作用域。作用域还可以包括子网掩码、默认网关的 IP 地址、DNS 服务器和其他必要的地址。当\
  \ PC 开机并配置为使用 DHCP 服务器时，它使用以下步骤获取地址：\n\n1. **DHCP Discover** 客户端发送 DHCP Discover\
  \ 消息，这是一个广播请求数据包，查找网络上任何 DHCP 服务。\n2. **DHCP Offer** DHCP 服务器响应 DHCP Offer 消息，其中包含客户端可以租用的\
  \ IP 地址。\n3. **DHCP Request** 客户端随后通过向 DHCP 服务器发送 DHCP Request 消息来接受该地址的提议。\n4.\
  \ **DHCP Acknowledgment** DHCP 服务器通过向客户端发送 DHCP ACK 消息来响应，确认客户端正在租用该地址。DHCP ACK\
  \ 消息还包含租用时间等其他 TCP/IP 设置。DHCP 服务器将其数据库中的 IP 地址标记为正在使用，以便不再分配。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_190_0.png)\n\
  \n**注意** 你将在第 13 章学习如何在 Cisco 路由器上配置 DHCP 服务。\n\n\n\n\n## 在系统上配置 TCP/IP\n\n你可以修改系统上的\
  \ TCP/IP 配置设置。步骤取决于你运行的操作系统，但以下各节显示了配置 Windows、Linux 和 macOS 系统的一般步骤。\n\n### Windows\
  \ 10\n\n要更改 Windows 系统上的 TCP/IP 设置，请使用以下步骤：\n\n- 1. 单击“开始”按钮，然后键入 **control**。在“开始”按钮的“最佳匹配”部分中你会看到控制面板。\n\
  - 2. 选择 控制面板 | 网络和 Internet | 网络和共享中心。\n- 3. 单击左侧的“更改适配器设置”链接。\n- 4. 右键单击以太网并选择属性。\n\
  - 5. 选择 Internet 协议版本 4 (TCP/IPv4) 并选择属性。\n- 6. 在属性对话框中，注意默认情况下单选按钮“自动获得 IP 地址”处于选中状态，这意味着系统配置为\
  \ DHCP 客户端：\n\n### Internet 协议版本 4 (TCP/IPv4) 属性\n\n如果你的网络支持此功能，你可以自动获取 IP 设置。否则，你需要向网络管理员索取适当的\
  \ IP 设置。\n\n自动获得 IP 地址\n\n使用下面的 IP 地址：\n\n自动获得 DNS 服务器地址\n\n使用下面的 DNS 服务器地址：\n\n\
  退出时验证设置\n\n- 7. 要静态配置 IP 地址，请选择“使用下面的 IP 地址”，然后输入系统的 IP 地址、子网掩码和默认网关设置。\n- 8. 要配置系统使用特定的\
  \ DNS 服务器，请选择“使用下面的 DNS 服务器地址”，然后输入要使用的 DNS 服务器的 IP 地址。\n- 9. 选择“确定”并关闭所有窗口。\n\n\
  ### Linux\n\n在 Linux 系统上，根据发行版的不同，有几种不同的方法可以修改 IP 地址。多年来，管理员使用 ifconfig 命令通过以下语法更改其\
  \ IP 地址：\n\n```\nifconfig eth0 12.0.0.11 netmask 255.0.0.0\n```\n\n其中：\n\n**eth0**\
  \ 是你要修改的接口或网卡。\n**12.0.0.11** 是你要使用的 IP 地址。\n**netmask 255.0.0.0** 是子网掩码。\n\n你也可以使用图形界面在\
  \ Linux 上更改 IP 地址。要执行此操作，请按照以下步骤操作：\n\n- 1. 在你的 Linux 系统上，在右上角你会看到一个网络图标。右键单击网络图标并选择“编辑连接”：\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_193_0.png)\n\n- 2. 选择你的连接，然后选择底部的设置图标（看起来像齿轮图标）。\n\
  - 3. 选择 IPv4 设置选项卡。\n- 4. 在“方法”下拉列表中，选择“手动”。\n- 5. 单击“添加”按钮以添加你要使用的 IP 地址、子网掩码和默认网关。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_194_0.png)\n\n- 6. 输入 DNS 服务器的 IP 地址，然后单击“保存”。\n\
  - 7. 关闭所有窗口。\n\n### macOS\n\n使用以下步骤修改你的 macOS IP 地址：\n\n- 1. 从 Apple 菜单中选择“系统偏好设置”。\n\
  - 2. 选择“网络”。\n- 3. 在左侧选择你的网络接口。\n- 4. 单击右下角的“高级”按钮。\n- 5. 选择 TCP/IP 选项卡。\n\n- 6.\
  \ 要手动配置 IP 地址，从“配置 IPv4”下拉列表中选择“手动”。然后输入你的 IP 地址、子网掩码和路由器地址（默认网关）。\n\n### 验证 IP\
  \ 地址设置\n\n配置 TCP/IP 设置后，最好验证 IP 地址设置是否已生效。你可以在每个操作系统中通过快速命令来完成此操作。\n\n- **Windows**\
  \ 打开命令提示符并键入 **ipconfig** 以查看基本的 TCP/IP 设置，例如 IP 地址、子网掩码和默认网关。如果要查看所有 TCP/IP 设置，包括\
  \ DHCP 租约时间和 DNS 服务器设置，请使用 **ipconfig /all** 命令。\n- **Linux** 根据你运行的 Linux 版本，你可以使用\
  \ **ifconfig** 命令查看 TCP/IP 设置，或使用网络管理器命令 **nmcli** 检查 IP 设置。\n- **macOS** 使用 **ifconfig**\
  \ 命令验证你的 TCP/IP 设置。\n\n### 理解通信路径\n\n在我们完成 TCP/IP 基础知识之前，你应该了解 TCP/IP 网络上两个系统之间通信的通信路径。以下插图显示了当\
  \ ComputerB 向 ComputerD 发送数据时发生的步骤：\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_196_0.png)\n\
  \n- 1. 在 ComputerB 输入命令 **ping 13.0.0.10** 以启动通信。\n- 2. ComputerB 将其 IP 地址和子网掩码与正在\
  \ ping 的 IP 地址进行比较，以确定系统是否在同一网络上。由于网络 ID 不同，IP 确定系统位于不同的网络上（请注意，这实际上是在二进制级别使用称为\
  \ AND 的过程完成的），如下所示：\n```\n12.0.0.10\n255.0.0.0\n13.0.0.10\n```\n- 3. ComputerB 从\
  \ TCP/IP 设置中检索默认网关设置，因为这是它需要发送数据到的地址，以便向不同网络发送数据。\n- 4. 然后 ComputerB 对默认网关的 IP 地址进行\
  \ ARP，以获取默认网关的 MAC 地址。\n- 5. ARP 回复消息返回到 ComputerB，其中包含默认网关的 MAC 地址。\n- 6. ComputerB\
  \ 使用以下头部信息将数据发送到路由器：\n- 7. 路由器接收到第 2 层帧，然后读取第 3 层头部以确定数据包的去向。路由器看到数据包的目标是 13.0.0.10，因此它检查路由表中是否有路由。它有，并且意识到它只需要通过\
  \ 13.0.0.1 接口发送数据即可到达目的地。\n- 8. 为了发送数据，路由器需要知道 13.0.0.10 的 MAC 地址，因此它发送 ARP 请求消息。\n\
  - 9. 路由器接收到包含 ComputerD MAC 地址的 ARP 回复。\n- 10. 路由器使用以下头部信息将数据发送到 ComputerD：\n\n\
  ```\nLayer 2 Header:\n    Source MAC: 2222.2222.2222\n    Destination MAC: AAAA.5555.5555\n\
  Layer 3 Header:\n    Source IP: 12.0.0.10\n    Destination IP: 13.0.0.10\n```\n\n\
  ```\nLayer 2 Header:\n    Source MAC: BBBB.6666.6666\n    Destination MAC: 4444.4444.4444\n\
  Layer 3 Header:\n    Source IP: 12.0.0.10\n    Destination IP: 13.0.0.10\n```\n\n\
  这里的重要一点是注意到第 2 层头部在沿途的每一步都被修改，以便将帧移动到下一步。但第 3 层头部从未被修改，因为它包含将数据路由到正确网络的网络地址。\n\n\

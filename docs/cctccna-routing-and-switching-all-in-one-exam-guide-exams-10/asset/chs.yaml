  \ | 最后一个有效地址 | 广播地址 |\n|---|---|---|---|\n| 子网 1 |  |  |  |\n| 子网 2 |  |  |  |\n\
  | 子网 3 |  |  |  |\n| 子网 4 |  |  |  |\n\n新子网掩码：__________\n\n## 章节回顾\n\n在本章中，你了解到有时可能需要将一个网络范围划分为多个网络块（子网）以遵循网络的物理结构。因为思科\
  \ CCNA 认证考试会有许多依赖于你对子网划分知识的问题，所以务必认真学习本章。\n\n要对网络进行子网划分，你需要知道需要多少个网络或每个网络的 hosts\
  \ 数量。然后你可以将子网掩码中的主机位转换为子网位，本质上更改你的子网掩码并创建更多网络，同时支持每个网络更少的 hosts。\n\n可变长度子网掩码（VLSM）功能使你能够为网络上的每个子网使用不同的子网掩码；这让你能更好地利用地址。\n\
  \n## 快速回顾\n\n### 理解子网划分\n\n- 子网划分的目的是将一个网络 ID 拆分为多个子网络（子网），以便你可以遵循网络的物理结构。\n- 通过子网划分，你从子网掩码中取出主机位并将其转为网络位——从而创建更多网络但每个网络的机器更少。\n\
  - 要确定从子网掩码的主机 ID 部分取出多少位，请使用公式 2^{masked bits} − 2 = number of networks。\n- 对于创建的每个子网，你必须计算网络\
  \ ID、第一个有效地址、最后一个有效地址、广播地址和新的子网掩码。\n\n### 子网划分快捷方式\n\n- 查看用于子网划分的最后一位的值并将其用作你的增量值。\n\
  - 使用增量值列出所有网络 ID，然后加一以得到每个网络的第一个有效地址。\n- 要确定子网的广播地址，请使用下一个网络 ID 减一的数字。子网的最后一个有效地址将是广播地址减一的数字。\n\
  \n### 分类 vs 无分类寻址\n\n- 在分类寻址中，网络 ID 属于 A 类、B 类或 C 类地址的默认网络 ID 之一。\n- 在无分类寻址中，网络\
  \ ID 从正常的分类地址中更改。\n\n### 可变长度子网掩码\n\n- 为你的每个子网创建相同大小的子网会在设计网络时浪费地址。\n- VLSM 使你能够为每个子网使用不同的子网掩码，以便你能更好地利用可用的地址。\n\
  \n## 问题\n\n以下问题将帮助你衡量你对本章所呈现材料的理解。仔细阅读所有选项，因为可能有多个正确答案。选择每个问题的正确答案。\n\n- 1. 你有一个网络\
  \ ID 为 131.107.0.0，并且你希望将你的网络划分为六个网络。你的新子网掩码是什么？\n  A. 255.224.0.0\n  B. 255.255.224.0\n\
  \  C. 255.192.0.0\n  D. 255.255.192.0\n- 2. 你想将你的网络划分为八个网络。你需要从子网掩码的主机 ID 部分取出多少位？\n\
  \  A. 2\n  B. 3\n  C. 4\n  D. 6\n- 3. 在二进制中，如何计算网络范围的广播地址？\n  - A. 所有主机位设为 0\n \
  \ - B. 所有主机位设为 0，除最低位外\n  - C. 所有主机位设为 1，除最低位外\n  - D. 所有主机位设为 1\n- 4. 在二进制中，如何计算网络范围的网络\
  \ ID？\n  - A. 所有主机位设为 0\n  - B. 所有主机位设为 0，除最低位外\n  - C. 所有主机位设为 1，除最低位外\n  - D.\
  \ 所有主机位设为 1\n- 5. 子网的最后一个有效地址始终是\n  - A. 比广播地址多一个\n  - B. 比广播地址少一个\n  - C. 比网络 ID\
  \ 多一个\n  - D. 比网络 ID 少一个\n- 6. 你需要为使用 200.56.88.96/27 的第四个有效地址的路由器分配一个 IP 地址。你会使用哪个地址？\n\

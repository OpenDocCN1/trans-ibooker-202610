  \ mode trunk\n```\n\n17. 要查看干线端口的状态，请使用 show interfaces trunk 命令并回答以下问题：\n    端口\
  \ 1 和端口 24 的状态是什么？________________\n    哪些 VLAN 流量被允许通过干线端口传输？________________\n\
  \n18. 关闭 VAN-SW1 选项卡。\n\n19. 转到 ComputerA 并 ping 12.0.0.15 (ComputerD)。您能够 ping\
  \ 通吗？________\n    现在允许 VLAN 流量穿越干线端口，因此 ping 消息应发送到另一台交换机上的 ComputerD。\n\n20. 从\
  \ ComputerA，您能够 ping 通 14.0.0.15 (ComputerB) 吗？________\n    请注意，ComputerB 位于同一交换机上，但您无法\
  \ ping 通它，因为它位于不同的 VLAN。VLAN 是一个通信边界。\n\n## 章节回顾\n\n本章侧重于特定于 Cisco 交换机的基本配置任务。回顾了交换机的物理特征，包括\
  \ LED 的含义和 Mode 按钮的使用。\n\n您了解了交换机的核心功能和交换机操作模式。然后，您了解了交换机上的基本配置设置，例如更改交换机名称以及在交换机上配置\
  \ IP 地址和默认网关。随后是交换机端口的配置。\n\n然后，您了解了端口安全功能，这是一种防止未经授权的设备连接到网络的方法。您了解了不同的端口违规模式以及配置端口安全的命令。\n\
  \n作为本章的最后一个主题，您了解了 VLAN 作为在设备之间创建广播域和通信边界的方法。您了解到 VLAN 可以跨连接的交换机，并且需要配置干线端口来在交换机之间传输\
  \ VLAN 流量。\n\n## 快速回顾\n\n### 了解交换机功能\n\n- 交换机有三个核心功能：地址学习、过滤/转发和环路避免。\n- 二层交换机有三种操作模式：存储转发、直通和无碎片转发。Cisco\
  \ 交换机使用无碎片转发。\n\n### 识别交换机组件\n\n- 如果交换机在启动期间发生故障，系统 LED 将显示琥珀色。\n- 使用 Mode 按钮在交换机上切换显示模式。\n\
  - 在 STAT 显示模式下，如果端口 LED 为琥珀色，则端口已因关闭、STP 阻塞或端口安全而被禁用。\n\n\n\n违规。如果端口为绿色，则表示已连接到设备；如果呈绿色闪烁，则表示该端口上有网络活动。\n\
  \n- 在 DUPLX（双工）显示模式下，如果端口 LED 显示稳定的绿色，则该端口正在全双工模式下运行。如果端口 LED 熄灭，则表示该端口处于半双工模式。\n\
  \n## 基本交换机配置\n\n- 可以给交换机上的 VLAN 接口分配 IP 地址，以便通过 telnet 或 SSH 远程访问该交换机。\n- **ip default-gateway**\
  \ 命令为交换机指定一个用于访问其他子网的路由器地址。\n- **show mac address-table** 命令显示交换机的 MAC 地址表以及所有已学习的地址。\n\
  \n## 接口配置\n\n- 端口安全用于在接入接口（非中继连接）上防止对 LAN 的未授权访问。\n- **switchport port-security**\
  \ 命令用于配置端口安全。\n- 端口安全的默认配置是在接口上学习一个 MAC 地址，违规模式为 shutdown（关闭）。\n- 粘性学习使交换机能够动态学习连接到某个接口的\
  \ MAC 地址，然后将这些地址配置为被授权访问该端口的端口安全地址。\n\n## 使用 VLAN\n\n- VLAN 是处于同一广播域中、具有相同网络号或子网号的一组设备。VLAN\
  \ 不受物理位置限制，因此用户可以在交换网络中的任何物理位置。\n- 静态 VLAN（即基于端口的 VLAN）成员身份由管理员手动分配。动态 VLAN 成员身份由用户设备的信息（如\
  \ MAC 地址或 802.1x 身份验证凭据）决定。\n- 接入端口是连接其他设备的端口，支持标准以太网帧，并且仅支持单个 VLAN。中继端口是对帧打标签并允许多个\
  \ VLAN 的端口。只有具备中继能力的端口才支持中继；并非所有以太网端口都支持中继。\n- IEEE 802.1Q 是一种标准化的中继方法。较新的 Cisco\
  \ 交换机仅支持这种中继协议。802.1Q 方法在帧中间插入一个 VLAN 标签，并重新计算帧的校验和。它支持本征 VLAN（native VLAN）——即中继链路上不打标签的\
  \ VLAN。在 Cisco 交换机上，其默认值为 VLAN 1。\n- DTP 是 Cisco 专有协议，用于确定两个连接的接口是否可以成为中继链路。它有五种模式：on（开启）、desirable（期望）、auto-negotiate（自动协商）、off（关闭）和\
  \ no-negotiate（不协商）。如果一侧模式为 on、desirable 或 auto，另一侧模式为 on 或 desirable，则会形成中继。no-negotiate\
  \ 模式启用中继但禁用 DTP。\n- 要在交换机接口上启用中继，请使用 **switchport trunk encapsulation dot1q** 命令，然后使用\
  \ **switchport mode trunk**。要验证中继，请使用 **show interfaces switchport|trunk** 命令。\n\
  - 交换机上的所有端口都会自动置于 VLAN 1 中。要在交换机上添加 VLAN，请使用 **vlan** 命令。要将接口分配给某个 VLAN，请使用 **switchport\
  \ mode access** 和 **switchport access vlan**。要查看 VLAN 以及分配到的端口，请使用 **show vlan**。\n\
  \n## 问题\n\n以下问题将帮助你衡量对本章节内容的理解。请仔细阅读所有选项，因为可能不止一个正确答案。请为每个问题选择正确的答案。\n\n1. 如果交换机在启动过程中出现故障，系统\
  \ LED 将 ________。\nA. 绿色\nB. 熄灭\nC. 琥珀色\nD. 红色\n\n2. 你使用 Mode 按钮切换到双工显示模式。你注意到除一个端口外，所有端口都显示绿色\

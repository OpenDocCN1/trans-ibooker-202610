  \ Manager\n   C. NetFlow\n   D. Syslog\n   E. MIB\n\n5. 输入 IOS 命令以将日志记录到控制台以外的目标：______。\n\
  \n6. 管理员在 Cisco 设备上使用的常见日志记录目标有哪两个？（选择两项。）\n   A. TFTP 服务器\n   B. 终端会话\n   C. Syslog\
  \ 服务器\n   D. RAM\n   E. Flash\n\n7. NetFlow 流最少必须包含哪些项目？（选择两项。）\n   A. IP 地址\n \
  \  B. 端口号\n   C. 入接口\n   D. CoS\n\n8. 版本______是 NetFlow 最常见的实现。\n\n9. ______ 将一个（且仅一个）IP\
  \ 地址转换为另一个。\n   A. NAT\n   B. PAT\n   C. PAR\n   D. NAT 和 PAT\n\n10. ______ 是与内部设备关联的公共\
  \ IP 地址。\n    A. 内部全局 IP 地址\n    B. 内部本地 IP 地址\n    C. 外部全局 IP 地址\n    D. 外部本地 IP\
  \ 地址\n\n11. 哪个命令用于定义静态转换为全局地址的本地地址？\n    A. ip nat inside source static\n    B.\
  \ ip nat inside\n    C. ip nat inside source list\n    D. ip nat pool\n\n12. 您有\
  \ 30 台需要访问 Internet 的内部机器：192.168.1.32/27。您已获得六个用于此访问的公共 IP 地址：199.1.1.41–199.1.1.46。接口\
  \ fastethernet0/0 连接到内部网络，serial1/0 连接到路由器上的 ISP。输入命令以使用此信息执行 PAT。\n\n13. 配置 ip\
  \ nat inside source 命令时，必须指定哪个参数才能执行 PAT？\n    A. pat\n    B. overload\n    C. load\n\
  \    D. port\n\n14. 使用 QoS 时，IP 电话为 VoIP 流量默认在 DSCP 字段中放置哪个 DiffServ 值？\n    A.\
  \ AF22\n    B. ToS\n    C. CS0\n    D. EF\n\n## 基于性能的问题\n\n在 Cisco 考试中，基于性能的问题要求您将屏幕左侧的框拖动到屏幕右侧的适当位置来回答问题。以下是一些基于性能的问题示例。\n\

  \n## Answers\n- 1. **C.** 平均故障间隔时间（MTBF）通常用于衡量可靠性。\n- 2. **A.** 小型办公室/家庭办公室（SOHO）网络涉及使用单个网络设备，例如家庭路由器，提供所有网络功能。\n\
  - 3. **A and C: 1 (LAN); B and D: 2 (WAN).** 以太网架构如 1000BaseT 和交换机是 LAN 技术，而路由器和\
  \ CSU/DSU 是用于连接到 WAN 的组件。\n- 4. **B.** 星型拓扑使用中央连接设备将所有系统连接到网络。\n- 5. **D.** spine-leaf\
  \ 设计拓扑的 leaf 层涉及接入层交换机。该层使终端能够连接到网络。\n- 6. **D.** 1000BaseLX 使用单模光纤电缆可达最长 10 km\
  \ 的距离。\n- 7. **B and C.** UTP 使用多对铜线，易受 EMI 和 RFI 干扰。\n- 8. **B.** 交叉电缆用于连接相似设备。请记住，直通电缆用于连接不同类型的设备。\n\
  - 9. **A.** 笔记本电脑到交换机和交换机到路由器的连接需要两根直通电缆；交换机到交换机的连接需要一根交叉电缆。\n- 10. **C.** 1000BaseT\
  \ 使用 UTP 电缆，使用 RJ-45 连接器。\n- 11. **A.** 以太网网络使用 CSMA/CD 作为其访问方法，这意味着设备只有在线路上没有信号（电缆未被使用）时才能发送数据。\n\
  - 12. **B.** 所有以太网架构都使用载波侦听多路访问/冲突检测（CSMA/CD）。该访问方法涉及系统在发送数据之前检查线路以确保其没有信号。如果数据与其他数据发生冲突，系统将检测到冲突并重新传输。\n\
  - 13. **B.** 1000BaseCX 使用 STP 电缆可达最大 25 米的距离。\n\n\n\n14. C. 网络地址转换（NAT）负责将数据包中的私有\
  \ IP 地址转换为公共 IP 地址，以便其能够在互联网上传输。\n\n15. A. DHCP 网络服务负责为网络设备分配 IP 地址信息，以便它们可以在网络上通信。\n\
  \n16. D. DNS 服务将 FQDN 转换为 IP 地址。如果您无法 ping FQDN，但可以 ping IP 地址，则可能意味着 DNS 将 FQDN\
  \ 转换为 IP 地址时出现问题。这通常意味着 FQDN 在 DNS 中不存在，或者您配置为使用错误的 DNS 服务器。\n\n## 性能型答案\n\n以下是对思科考试中常见的性能型问题的答案。\n\

  \ CAM 表内容的交换机命令：________________。\n\n7. 检查交换机上的以下 MAC 地址表。如果交换机看到目的 MAC 地址为 0000.1111.DDDD\
  \ 的帧，会发生什么？\n\n```\nSwitch> show mac address-table\n```\n\n| VLAN | MAC 地址 | 类型\
  \ | 端口 |\n| --- | --- | --- | --- |\n| 1 | 0000.1111.AAAA | 动态 | Gig0/1 |\n| 1 |\
  \ 0000.1111.CCCC | 动态 | Gig0/2 |\n| 1 | 0000.1111.BBBB | 动态 | Gig0/3 |\n\nA. 向所有端口泛洪\n\
  B. 丢弃该帧\nC. 从 Gig0/1 转发出去\nD. 从 Gig0/1 和 Gig0/2 转发出去\n\n8. 哪种交换机功能用于防止对 LAN 的未授权访问？\n\
  A. 端口安全\nB. 端口安全和 802.1Q\nC. VTY 密码\nD. Enable 密码\n\n9. 你正在接口 Gig0/6 上配置端口安全。你希望交换机为当前正在使用该端口的任何\
  \ MAC 地址配置端口安全。你会使用什么命令？\nA. port-security mac-address dynamic\nB. switchport port-security\
  \ mac-address cccc.cccc.3333\nC. switchport port-security mac-address sticky\nD.\
  \ switchport port-security violation shutdown\n\n10. 你周一早上来上班，收到一个用户的投诉，她说她无法访问网络。你使用以下命令查看她工作站所连接的接口状态。问题是什么？\n\
  \n```\nVAN-SW2#show int g0/9\nGigabitEthernet0/9 is administratively down, line\
  \ protocol is down (disabled)\n  Hardware is Lance, address is 0002.1653.0701 (bia\
  \ 0002.1653.0701)\n  Description:\n  MTU 1500 bytes, BW 1000000 Kbit, DLY 1000 usec,\n\

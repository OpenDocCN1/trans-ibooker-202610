  - 7. 你的系统有一个 IP 地址为 138.97.25.10/20。以下哪个是你的网络上的系统？\n  - A. 138.97.56.8\n  - B. 138.97.17.10\n\
  \  - C. 138.97.15.77\n  - D. 138.97.33.76\n- 8. 以下哪个是 CIDR 记法的示例？\n  - A. 16/10.34.56.78\n\
  \  - B. 10.34.56.78\n  - C. 10.34.56.0\n  - D. 10.34.56.78/16\n- 9. 你的路由器有一个 IP\
  \ 地址为 216.83.11.65/27。你想连接网络上的一个新系统。你会为该新系统分配以下哪个地址？\n  - A. 216.83.11.45\n  - B.\
  \ 216.83.11.87\n  - C. 216.83.11.95\n  - D. 216.83.11.96\n- 10. 你正在为思科路由器上的千兆接口配置\
  \ 131.107.48.0/20 网络的最后一个有效 IP 地址。你会使用哪个地址？\n  - A. 131.107.48.254\n  - B. 131.107.255.254\n\
  \  - C. 131.107.64.254\n  - D. 131.107.63.254\n\n## 基于性能的问题\n\n1. 你正在帮助一名初级管理员理解网络上使用的\
  \ IP 地址方案。你已将网络子网划分以支持 16 个子网，地址方案为 200.15.36.0/28。查看以下展品左侧列出的不同地址，识别该地址是广播地址、网络\
  \ ID 还是主机地址。\n\n- 200.15.36.22\n- 200.15.36.16\n- 200.15.36.79\n- 200.15.36.60\n\
  - 200.15.36.31\n- 200.15.36.48\n\n广播地址\n\n网络 ID\n\n主机地址\n\n## 答案\n\n- 1. B. 鉴于你处理的是\
  \ B 类地址，默认子网掩码是 255.255.0.0。因此，如果你从主机 ID 中取出三位（用于六个网络所需），你将得到新的子网掩码 255.255.224.0。\n\
  - 2. B. 你需要屏蔽三位以获得至少八个网络。计算需要从子网掩码的主机 ID 部分取出多少位的公式是 2^masked bits = number of networks。所以，在这种情况下，2^3\
  \ = 8 个网络。\n- 3. D. 广播地址是通过将所有主机位转换为 1 计算的。\n- 4. A. 网络 ID 是通过将所有主机位设为 0 确定的。\n\
  - 5. B. 最后一个有效地址始终比广播地址少一个。\n- 6. D. 这是一个棘手的问题。当回答这类问题时（你在考试中会遇到），你应该首先查看给你的地址——200.56.88.96/27。首先关注\
  \ /27；这表示子网掩码中有 27 位启用。这是一个 C 类地址，通常只有 24 位启用，所以它告诉你这是一个已子网划分的网络。你知道有三位额外的位已被转换为子网位。使用快捷方法，你知道被子网划分的最后一位（第三个额外位）的值是\
  \ 32。要回答这个问题，你应该在纸上列出该场景的所有网络 ID，使用增量：200.56.88.0、200.56.88.32、200.56.88.64、200.56.88.96，等等。你可以在看到适用于此问题的网络时停止——200.56.88.96\
  \ 网络（或子网）。现在你可以回答关于该子网的第四个有效地址的问题：97 是第一个有效地址，98 是第二个，99 是第三个，100 是第四个有效地址。\n- 7.\
  \ B. 另一个棘手的问题，但你可以像问题 6 一样回答。查看地址，你可以看到它以 138 开头，这是一个 B 类地址。B 类地址的默认子网掩码是 255.255.0.0，这意味着子网掩码中有\
  \ 16 位启用——这是 CIDR 记法中的 /16。因为给出的地址使用的是 /20 而不是 /16，你知道这个问题是一个子网划分的示例。有四个额外的位，这意味着增量是\
  \ 16（四个被子网划分位的最后一个启用位的值），所以你列出\n\n子网以确定您所处理的网络。子网为 138.97.0.0、138.97.16.0、138.97.32.0，等等。请注意，问题中给出的\
  \ IP 为 138.97.25.10，它位于 138.97.16.0 网络上。要回答这个问题，您需要选择一个介于 138.97.16.0 和 138.97.32.0\
  \ 之间的地址。\n\n8. D. CIDR 表示法用于标识 IP 地址中网络 ID 包含多少位比特。使用 CIDR 表示法，您通过在 IP 地址后放置正斜杠（/）然后是构成网络\
  \ ID 的比特数来指定构成网络 ID 的比特数：例如，10.34.56.78/16。\n\n9. B. 因为使用 /27 来标识构成子网掩码的比特数，您知道网络已被子网划分（类\
  \ C 默认情况下为 /24）。在此示例中，路由器所在的网络是 216.83.11.64 网络，而 216.83.11.87 是在此列出的该网络上唯一的可用地址。\n\
  \n10. D. 因为使用 /20 来标识构成子网掩码的比特数，您知道网络已被子网划分（类 B 默认情况下为 /16）。使用快捷方法，您知道 /20 为子网掩码提供了四个额外的比特，增量为\
  \ 16。您正在处理的网络范围是 131.107.48.0，您想知道该子网的最后一个有效地址。确定此地址的快速方法是使用增量来确定下一个网络 ID 131.107.64.0，然后从该地址向后推算，找到最后一个有效地址。131.107.64.0\
  \ 之前的地址是 131.107.63.255，它是 131.107.48.0 网络的广播地址。其之前的地址 131.107.63.254 是最后一个有效地址。\n\
  \n## 基于绩效的解答\n\n1. 这是一个棘手的问题，您肯定会在 Cisco 考试中看到类似的问题，需要您识别网络 ID、广播地址和主机地址。要回答这个问题，首先要关注给出的地址\
  \ 200.15.36.0/28。这是一个具有 4 个子网比特的类 C 地址。接下来，识别 4 个比特中最后一位比特的值，即增量。在本例中，它是 16。然后，在纸上写出不同的网络\
  \ ID：\n\n- 200.15.36.0\n- 200.15.36.16\n- 200.15.36.32\n- 200.15.36.48\n- 200.15.36.64\n\
  - 200.15.36.80\n\n现在您知道了不同的网络 ID。这些网络 ID 之前的数字将是前一个网络的广播地址，中间的数字是主机地址。\n\n| 广播地址\
  \ |  |\n|---|---|\n| 200.15.36.79 | 200.15.36.31 |\n\n| 网络 ID |  |\n|---|---|\n\
  | 200.15.36.16 | 200.15.36.48 |\n\n| 主机地址 |  |\n|---|---|\n| 200.15.36.22 | 200.15.36.60\
  \ |\n"
- "# Cisco 设备基础\n\n本章中，您将\n\n- 查看 Cisco 硬件和软件\n- 了解内存类型\n- 连接到 Cisco 设备\n- 启动 Cisco\
  \ 设备\n- 了解服务相关任务\n\n现在您已经了解网络概念和 TCP/IP 地址分配，让我们深入 Cisco 设备操作的世界。本章您将了解更多关于 Cisco\
  \ 设备的硬件方面和启动过程。然后，第 7 章将重点介绍如何通过操作系统进行导航并执行管理任务。\n\n### 使用 Cisco 设备和软件\n\nCisco\
  \ 提供多个设备系列，提供不同的功能和特性。例如，Catalyst 产品包括 Cisco 的第 2 层和第 3 层交换机的多个型号。在本节中，您将了解一些您可能正在使用的\
  \ Cisco 不同产品线。\n\n### Cisco 设备类型\n\n目前市场上存在多种 Cisco 设备，每种设备都支持特定的功能、硬件模块和接口。以下是您可能会遇到的一些设备的简要概述。\n\
  \n### Cisco Nexus 系列交换机\n\nCisco 的 Nexus 系列交换机专为数据中心设计，通过高可用性功能提高性能，使所有系统都能访问网络和存储资源。Nexus\
  \ 系列交换机运行 NX-OS 网络操作系统。\n\n- **Cisco Nexus 9000 系列** 这些交换机在数据中心提供 1、10、25、50、100\
  \ 和 400 Gbps 的速度。许多功能有助于自动化网络，包括软件定义网络（SDN）。\n- **Nexus 7000 系列** 这些模块化交换机提供 10、40\
  \ 和 100 千兆网络性能。您可以添加 7000 系列模块，例如 Cisco 网络分析模块（NAM），它使您能够分析数据包并排除流量问题。\n- **Nexus\
  \ 3000 系列** 这些 Nexus 3000 系列交换机专为通用第 2 层和第 3 层交换而设计，支持 1、10、25、40、100 和 400 Gbps。某些型号支持可编程性和网络遥测功能。\n\
  \n### Cisco Catalyst 系列交换机\n\nCisco Catalyst 系列交换机设计为 LAN 接入交换机，并用于核心和汇聚层。\n\n-\
  \ **Catalyst 9000 系列** 这些交换机专为校园部署而设计，可以通过有线和无线功能提供对网络的访问。\n- **Catalyst 6800 系列**\
  \ 设计为校园骨干交换机，这些设备提供多个插槽用于插入不同的硬件模块，并支持小型型因子可插拔（SFP）和 SFP+ 收发器。\n- **Catalyst 6500\
  \ E 系列** 这些增强型交换机每个插槽支持 80 Gbps。\n- **Catalyst 3850、3650、2960 和 1000 系列** 这些交换机设计为接入层交换机型号，支持多种不同的模块和配置。例如，3650\
  \ 模块支持 1、10 和 40 Gbps，并带有 SFP+ 上行端口以添加您选择的 SFP+ 收发器。\n\n### Cisco ASR 系列路由器\n\n\
  Cisco Aggregation Services Router（ASR）系列路由器用于大型企业网络或服务提供商。它们最适合高带宽应用环境，因为它们处理 100\
  \ Gbps。ASR 系列路由器由 Cisco 的 IOS XR 和 IOS SE 操作系统驱动。以下是一些流行的 ASR 型号：\n\n- **Cisco 8000\
  \ 系列** 这些路由器专为性能而设计，吞吐量高达 400GB。它们是云增强型，能够集成到管理工具中。\n- **Cisco ASR 9000 系列** 这些高端路由器通常用于核心层或网络边缘。ASR\
  \ 9000 路由器由 IOS XR 操作系统驱动。\n- **Cisco ASR 1000 系列** 这些路由器设计用于在网络边缘使用，并由 IOS XE 操作系统驱动。\n\
  \n### Cisco ISR 系列路由器\n\nIntegrated Services Router（ISR）系列专注于为中小型企业提供服务，其网络规模也为中小型。ISR\
  \ 路由器设计为边缘路由器，为分支机构提供连接。它们由 Cisco IOS 操作系统驱动。\n\n- **Cisco 4000 系列** 这些路由器通过支持千兆以太网、T1/E1\
  \ 和 xDSL 接口等不同连接选项来结合网络、计算和 WAN 服务。\n- **Cisco 1100 系列** 这些小型无风扇路由器提供连接和安全功能，将分支机构连接到其主网络。\n\
  - **Cisco 900 系列** 这些路由器专为小型办公室设计，具有四个 LAN 端口以及 WAN 端口和安全服务，例如虚拟专用网络（VPN）、动态多点 VPN（DMVPN）和防火墙。\n\
  - **Cisco 800 系列** 这些路由器将交换机和路由器结合在一起并增加无线功能。\n\n### 其他 Cisco 设备\n\nCisco 设备的列表继续包括设计用于在云环境中运行的设备或为服务提供商提供大规模平台的设备。以下是您应为\
  \ Cisco CCT 考试熟悉的一些其他 Cisco 设备：\n\n- **MDS 9000 系列** Cisco MDS 9000 系列交换机是用于连接存储环境的<|message|>\
  \ 层交换机。它们旨在为网络设计人员提供构建高可用性、安全且可扩展的存储网络的能力。\n- **Meraki 交换机** Meraki 交换机是 Cisco 专注于从云端管理交换机的产品线。从可在网络上访问的中央仪表板，管理员能够管理组织中的所有交换机。\n\
  - **NCS 5500 系列** Cisco *网络收敛系统*（NCS）专为大规模数据中心汇聚而设计，提供 100 Gbps 架构。它是一种使用 IOS XR\
  \ 操作系统的路由器产品，提供多种服务，例如为大型企业或服务提供商提供应用托管。\n- **NCS 5000 系列** 较旧的 NCS 路由解决方案，NCS 5000\
  \ 系列是为企业网络和服务提供商设计的路由平台。这些路由设备使用 Cisco IOS XR 软件提供 10 Gbps 吞吐量。\n\n### 识别设备型号和序列号\n\
  \n您可以通过查看通常位于设备机箱背面的贴纸（有时显示在前面）来识别 Cisco 设备的型号和序列号。在图 6-1 中，您可以看到我的设备（PID）是 WS-C3750G-24TS-S\
  \ 型号。您还可以看到序列号（SN）：FDO1125Z6VQ。\n\n\n\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_254_0.png)\n\
  \n图 6-1 识别序列号和型号\n\n你可以使用其他方法来识别正在使用的思科硬件的类型。思科路由器或交换机设备通常包含其他标记，例如显示设备型号的徽标。你也可能会找到以下设备的型号标识：\n\
  \n- **适配器** 这些是添加到思科设备的网络接口卡。\n- **模块** 可以将许多不同类型的模块添加到思科设备上的插槽中。模块的常见示例是 WAN 接口卡（WIC），用于向路由器安装\
  \ T1 接口或串行端口。\n- **线路卡** 这是一块电路板，为设计用于接受线路卡的高端路由器提供 LAN 或 WAN 端口。\n\n这些设备中的每一个都可能带有指示设备类型或设备型号的标记。例如，如果你查看\
  \ WIC 模块设备上的金属铭牌，你会看到模块类型，例如 WIC 1DSU/T1，这是一块 T1 WAN 接口卡。\n\n你还可以通过使用 **show version**\
  \ 命令找到思科设备的型号和序列号。查看以下代码示例，我已突出显示了一些相关部分，用于识别思科设备的型号，你可以看到它是一款思科 1900 系列设备（在输出顶部），但更下方可以看到它是一款思科\
  \ 1921 路由器。**show version** 命令还会在“Processor board ID”字段中显示设备的序列号。**show version**\
  \ 命令的另一个优点是，你稍后会学到，它会显示设备中存在哪些接口。你可以看到该设备上有两个千兆接口和总共三个串行接口（稍后会详细介绍接口） 。重点是，**show\
  \ version** 命令不仅显示软件版本，还显示与硬件相关的信息。\n\n```\nRouter>enable\nRouter#show version\n\
  Cisco IOS Software, C1900 Software (C1900-UNIVERSALK9-M), Version 15.7(3)M2,\nRELEASE\
  \ SOFTWARE (fc2)\n(output cut for briefness)\nROM: System Bootstrap, Version 15.0(1r)M12,\
  \ RELEASE SOFTWARE (fc1)\nRouter uptime is 9 minutes\nSystem returned to ROM by\
  \ power-on\nSystem image file is \"usbflash0:c1900-universalk9-mz.SPA.157-3.M2.bin\"\
  \n(output cut for briefness)\nCisco CISCO1921/K9 (revision 1.0) with 487424K/36864K\
  \ bytes of memory.\nProcessor board ID FGL1551222Y\n2 Gigabit Ethernet interfaces\n\
  1 Serial interface\n2 Serial (sync/async) interfaces\n(output cut for briefness)\n\
  ```\n\n## 思科设备上的常见组件\n\n思科设备上通常使用许多组件，例如端口、接口、模块和收发器。你将在本章后面了解更多关于这些组件的信息，对于思科 CCT\
  \ 考试来说，了解它们很重要。每个型号的设备在支持的模块类型方面各不相同。购买思科设备时，请务必查看设备的性能，以确保它满足你的需求。\n\n## 使用思科软件\n\
  \n你需要熟悉思科设备的两个方面：设备上运行的软件（操作系统）和设备的硬件组件。我们将在本节中查看思科软件，并在下一节讨论硬件元素。\n\n## 软件类型\n\n\
  每个思科设备都由思科操作系统驱动，该操作系统负责提供该设备的功能。对于思科 CCT 认证考试，你应该了解以下操作系统：\n\n- **Cisco IOS** 思科互联网操作系统（IOS）是与思科设备一起使用的较为常见的操作系统之一，也是考试中需要了解的。IOS\
  \ 提供设备的网络功能、协议和安全特性。Cisco IOS 直接在思科设备的硬件上运行。\n- **Cisco IOS XE** 该操作系统最初随 ASR 1000\
  \ 和 Catalyst 3850 系列路由器发布。它与 IOS 的不同之处在于 IOS XE 是一个 Linux 内核，其上运行着 IOS 的一个版本（这就是为什么你的\
  \ IOS 命令适用于 IOS XE）。通过以 Linux 内核作为操作系统的基础，你可以在设备上运行不同的应用程序。\n- **Cisco IOS XR**\
  \ 这种基于 Unix 的操作系统与思科 IOS 完全不同，但它使用许多与思科 IOS 上使用的命令类似的命令。需要注意的是，并非所有 IOS 命令都一定能在\
  \ IOS XR 上运行。该操作系统面向服务提供商，并用于思科 XR 12000 系列路由器等设备。\n- **Cisco NX-OS** 该操作系统适用于思科\
  \ Nexus 系列交换机。它基于 Linux 内核构建，并支持 Python 作为用于自动化设备更改的脚本语言。虽然它与思科 IOS 不同，但所使用的命令非常相似，这使得技术人员很容易适应\
  \ NX-OS。\n\n## 许可流程\n\n当你购买思科设备时，必须为该设备购买许可证，如果你用更新的设备替换设备，则需要为新设备获取许可证。每个思科设备都包含许多软件功能。例如，思科防火墙产品包括恶意软件保护功能和\
  \ URL 过滤功能。每个软件功能，或 *附加组件*，都需要你获取软件许可证才能使用它。\n\n许可的一部分与设备以及为设备许可的功能的支持合同有关。支持合同使你能够在硬件故障或操作系统出现问题时从思科获得技术支持。还有针对正在许可的功能的支持合同，例如更新。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_257_0.png)\n\n**注意** 你将在第 8 章学习如何在思科设备上安装和查看许可证。\n\
  \n你可以为思科设备购买两种类型的支持合同：\n\n- **SMARTnet (SNT)** 该支持协议涵盖硬件，并提供诸如次工作日更换故障硬件等服务。该协议还使你能够接收设备操作系统的更新。\n\
  - **Software Support Service (SWSS)** 该支持合同使你能够接收任何附加功能的更新和支持。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_257_1.png)\n\
  \n**注意** 确保两个支持合同始终处于激活状态，以便你能够为思科设备获得全面支持并持续更新其功能。例如，如果在续订时你续订了 SNT 合同但未续订 SWSS，你将不会收到有关附加功能的更新。\n\
  \n## 捆绑模式和安装模式\n\nCisco IOS XE 交换机，例如 3850 和 3650，支持两种操作模式：捆绑模式和安装模式。在捆绑模式下，思科操作系统以映像文件的形式存储在闪存中。设备在启动时将该映像加载到内存中。（你将在第\
  \ 8 章了解更多关于 IOS 映像文件和闪存的信息。）安装模式是交换机上使用的默认模式，并包括用于启动思科交换机的配置文件 packages.conf。交换机还包含闪存中引用的多个\
  \ .pkg 文件，这些文件由 packages.conf 文件引用。如果使用大量交换机，安装模式最有益，因为你可以对所有交换机执行升级，而无需复制映像文件。\n\
  \n## 在思科设备上操作端口\n\n你会在思科设备的背面或前面看到许多不同类型的端口。图 6-2 显示了思科 1921 ISR 路由器的背面，并标识了你在许多不同思科设备上都会看到的一些常见端口。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_258_0.png)\n\n图 6-2 识别思科路由器的端口\n\n###\
  \ 控制端口\n\n你将管理工作站连接到控制台端口以本地管理思科设备——这意味着你坐在设备旁执行管理任务。你会使用控制台电缆（通常为浅蓝色），又称翻转电缆，将计算机的串行端口连接到思科设备的控制台端口。然后你将启动终端仿真程序以从命令行界面（CLI）管理设备。\n\
  \n\n\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_259_0.png)\n\n注意 你将在本章后面的“使用终端仿真软件”部分了解更多关于如何启动终端仿真软件的信息。\n\
  \n你应该知道如何在 Cisco 设备上识别控制台端口，它通常标记为“Console”或“Con0”。图 6-3 显示了控制台端口的特写。请注意控制台端口左侧的\
  \ USB 端口；这是一个 USB 串行端口，五针迷你 USB Type B 端口，你可以用它作为控制台连接，而不用传统的控制台端口（RJ-45 类型的控制台端口）。还请注意标记为“EN”，表示“已启用”的\
  \ LED 灯。你用于登录设备的端口对应的 LED 会亮起。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_259_1.png)\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_259_2.png)\n\n图 6-3 用于本地管理的控制台端口\n\n\
  如今的许多台式机和笔记本电脑都没有用于将控制台电缆连接到笔记本电脑的串行端口。但是，你可以购买一个 USB 转串行适配器连接到笔记本电脑的 USB 端口，然后将适配器连接到连接到\
  \ Cisco 设备的控制台电缆（见图 6-4）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_260_0.png)\n\
  \n图 6-4 使用 USB 转串行适配器连接到 Cisco 设备\n\n## 辅助端口\n\n辅助端口，也称为 AUX 端口，也用于出于管理目的连接到你的 Cisco\
  \ 路由器，但它设计为通过将调制解调器连接到 AUX 端口从而连接到墙上的电话插孔，来以替代方法远程管理你的设备。使用这种设置，如果路由器失去互联网连接，你可以拨号进入路由器。通常，如果设备有互联网连接，你可以使用\
  \ telnet 或安全外壳 Secure Shell（SSH）远程登录到设备。图 6-5 显示了 AUX 端口的典型设置。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_261_0.png)\n\
  \n图 6-5 AUX 端口将调制解调器连接到路由器。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_261_1.png)\n\
  \n**注意** 尽管 AUX 端口的目的是连接调制解调器，你仍然可以将控制台电缆直接连接到该端口并像使用控制台端口一样本地管理设备。\n\n## LAN 端口\n\
  \nCisco 设备还包括一些用于连接到 LAN 的以太网端口——这些称为接口。以太网端口的类型取决于设备的年代。你可能会遇到较旧的 Cisco 设备，其以太网端口\
  \ Cisco 用作 10-Mbps 端口。快速以太网端口运行速度为 100 Mbps，千兆端口运行速度为 1000 Mbps（1 Gbps），而 10 千兆端口运行速度为\
  \ 10 Gbps。图 6-6 显示了 Cisco 路由器上的两个千兆以太网端口。请注意它们标记为 GE0/0 和 GE0/1（千兆）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_262_0.png)\n\
  \n图 6-6 Cisco 路由器上的千兆以太网端口\n\n了解你正在使用的以太网端口类型非常重要，因为管理端口的命令会根据类型而不同。例如，你将快速以太网端口引用为\
  \ FastEthernet0/0，而千兆端口引用为 GigabitEthernet0/0。在具有 10 Mbps 以太网端口的较旧设备上，你将端口引用为 Ethernet0。每个端口类型还有关联的缩写——例如，你可以使用\
  \ FE0/0 或 Gig0/0，具体取决于你想要引用的端口。\n\n表 6-1 显示了不同端口类型的不同标签标识符列表。\n\n| 端口类型 | 速度 | 标签标识符示例\
  \ |\n|---|---|---|\n| 以太网 | 10 Mbps | Ethernet0 or Eth0 |\n| 快速以太网 | 100 Mbps |\
  \ FastEthernet0/0 or FE0/0 |\n| 千兆以太网 | 1000 Mbps / 1 Gbps | GigabitEthernet0/0\
  \ or Gig0/0 |\n| 10 千兆以太网 | 10 Gbps | TenGigabitEthernet0/0 |\n\n表 6-1 LAN 端口速度和标签标识符\n\
  \n关于接口的另一个重要点是，过去它们是通过使用形式为 <TypeOfPort><Index#> 的标识符来引用的。例如，Ethernet0 将是路由器上的第一个以太网端口，而\
  \ Ethernet1 将是第二个以太网端口。随着时间的推移，标识符发生了变化，以便索引号开始使用 0/0 类型的语法，因为 Cisco 设备现在具有模块，这些模块是包含不同类型端口的卡，添加到设备的插槽中。放置在插槽中的每个模块可以有多个接口。0/0\
  \ 形式的语法引用插槽号，然后是斜杠，然后是插槽内接口的索引号。\n\n查看图 6-7，你可以了解 Cisco 交换机上的插槽和接口 ID 的工作原理如何。Cisco\
  \ 交换机上的 LAN 端口通常从插槽号 1 开始，插槽内的接口 ID 为 1，但在路由器上，端口通常从 0 开始编号。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_263_0.png)\n\
  \n图 6-7 Cisco 设备上的插槽和接口\n\n请注意，对于较新的 Cisco 设备，标识符引用为 <TypeOfPort> <DeviceIndex>/<Slot>/InterfaceID——例如，Gig0/1/0。你仍然包含端口类型——在这种情况下是千兆接口——然后包含引用设备的索引号。一些设备可以堆叠在一起作为一个单元工作；在这种情况下，第一个设备将具有设备索引\
  \ 0，而第二个设备将是设备索引 1。识别设备后，如前所述包含插槽和接口号。\n\n## WAN/串行端口\n\n不同类型的以太网端口用于连接到你的 LAN 环境，但\
  \ Cisco 路由器还需要连接到 WAN 环境，以便在公司有多個地點時將流量从一个网络发送到另一个网络。Cisco 路由器上的串行接口使你能够在两种情况下将\
  \ Cisco 路由器连接到其他网络：\n\n- **服务提供商的 WAN 链路** 连接到你的服务提供商或 ISP 网络\n- **背靠背串行连接** 直接在两个路由器之间创建点对点链路。此链路通常用于测试环境或你的\
  \ CCNA 考试学习实验室。\n\n## WAN 链路到服务提供商\n\n要连接相隔一定距离的两个办公室网络，你将订阅来自当地电信公司或服务提供商的 T1 或\
  \ T3 链路等月度服务。电信公司提供 WAN 网络基础设施，你的路由器的串行端口连接到该基础设施，通过服务提供商的网络建立到另一地点的链路。\n\n让我们看一下图\
  \ 6-8 所示的示例。图左侧是温哥华办公室中的路由器、交换机和一些客户端计算机。路由器具有标识符为 s0/0/0 的串行接口，连接到外部通道服务单元/数据服务单元（CSU/DSU）。你还将来自服务提供商的\
  \ WAN 链路插入 CSU/DSU；该组件负责从服务提供商的网络发送和接收数据，本质上充当整个网络的调制解调器。CSU/DSU 从路由器接收数据，然后将其转换为\
  \ WAN 基础设施使用的信号格式，然后将数据发送到服务提供商的网络。数据随后通过许多不同的 WAN 交换机传输，然后到达洛杉矶的 CSU/DSU。洛杉矶的 CSU/DSU\
  \ 负责将信号转换为路由器可以在其串行端口接收的用户数据。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_265_0.png)\n\
  \n图 6-8 CSU/DSU 用于将路由器连接到 WAN。\n\n路由器被视为数据终端设备（DTE）设备，它发送或接收原始数据，该数据由数据通信设备（DCE）转换为\
  \ WAN 的信号。在我们的示例中，CSU/DSU 是 DCE 设备，因为它负责将数据或信号转换为适当的传输格式。在此示例中，CSU/DSU 被视为外部 CSU/DSU，因为它未集成在路由器内。外部\
  \ CSU/DSU 连接到串行端口，通常放置在路由器顶部或旁边。\n\n可以將內部 CSU/DSU 模組安裝到路由器中，然後將 WAN 链路連接到該模組。图 6-9\
  \ 显示了直接集成到路由器中的内部 CSU/DSU 模块（请注意，该模块标记为 DSU/CSU）。\n\n\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_266_0.png)\n\
  \n图 6-9 一个集成的 CSU/DSU\n\n## 背靠背串行连接\n\n你还可以使用串行端口在两台路由器之间创建背靠背连接，这需要一根背靠背串行电缆，如图\
  \ 6-10 所示。使用背靠背串行电缆连接两台路由器可以在测试环境中模拟 WAN 链路。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_266_1.png)\n\
  \n图 6-10 背靠背串行电缆\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_266_2.png)\n\n注意 使用背靠背串行电缆时，请确保电缆一端标记为“DTE”，另一端标记为“DCE”。连接到\
  \ DCE 端的路由器需要配置额外的命令，正如你在第 7 章中将学到的。\n\n## 使用 Cisco 硬件\n\nCisco CCT 认证考试要求你了解将遇到的硬件组件类型以及如何操作它们。\n\
  \n### 了解收发器模块\n\n收发器模块是当今 Cisco 设备的重要特性。Cisco 不为特定类型的接口对 Cisco 设备进行硬连线，而是在部分设备中安装收发器端口，这样你就可以购买带有所需布线端口类型的收发器模块。例如，而不是要求你为千兆接口将\
  \ RJ-45 端口插入设备，你的 Cisco 设备可能包含一个收发器端口，这样你就可以购买一个已经在其上包含 RJ-45 端口的收发器模块。这提供了灵活性，因为\
  \ Cisco 设备不是为一种特定类型的接口硬编码的。然后，如果你后来决定需要将光纤电缆连接到设备，只需购买该类型的收发器并将其插入 Cisco 设备上的收发器端口即可。\n\
  \n图 6-11 显示了两种用于千兆网络的收发器模块：左侧的 GLC-T 模块使用 RJ-45 连接器连接到非屏蔽双绞线（UTP）布线，以及连接到光纤电缆的 GLC-SX-MM\
  \ 模块。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_267_0.png)\n\n图 6-11 用于 UTP 的\
  \ GLC-T SFP 收发器模块（左侧），以及 GLC-SX-MM 光纤模块\n\n安装收发器模块很简单：将模块滑入 Cisco 设备上的 SFP 端口并用夹具固定，如图\
  \ 6-12 所示。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_268_0.png)\n\n图 6-12 将收发器安装到\
  \ SFP 插槽\n\n一些示例收发器类型、其传输速率以及它们使用的介质类型（连接器类型）列在表 6-2 中。\n\n| OEM 零件编号 | 传输速率 | 介质类型\
  \ |\n|---|---|---|\n| GLC-T | 1 Gbps | UTP |\n| GLC-SX-MM | 1 Gbps | 多模光纤 |\n| GLC-LH-SM\
  \ | 1 Gbps | 单模光纤 |\n| SFP-10G-SR-S | 10 Gbps | 多模光纤 |\n| SFP-10G-LR-S | 10 Gbps\
  \ | 单模光纤 |\n| QSFP-40G-SR-S | 40 Gbps | 多模光纤 |\n| QSFP-40G-LR-W | 40 Gbps | 单模光纤\
  \ |\n\n表 6-2 示例收发器模块\n\n### 安装和更换硬件\n\n购买 Cisco 设备后，你需要将其安装在位于服务器机房或通信机柜的机架中。以下是有关安装\
  \ Cisco 设备的一些常见指南：\n\n- 确保设备安装在机架中时，能够看到设备前面板上的 LED，并且可以访问所有端口。\n- 确保电源线能够到达设备安装位置，并确保网络布线远离电源线和荧光灯等电气噪声源。\n\
  - 确保 Cisco 设备周围有足够的空间，以便通风口的空气流通不受限制。\n- 确保电缆长度不超过其规格规定的最大距离。例如，双绞线电缆的最大距离为 100m（328\
  \ 英尺）。\n- 确保设备周围的温度不超过 113°F（45°C）。\n\n从包装盒取出设备后，安装安装支架，以便设备可以固定到通信机架中。使用十字螺丝刀将安装支架拧到设备侧面，然后将设备固定到机架中。\n\
  \n### 安装和更换模块\n\nCisco CCT 认证考试要求你知道如何在 Cisco 路由器或交换机上安装和更换模块。以下是可能安装在路由器上的一些常见模块示例（见图\
  \ 6-13）：\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_269_0.png)\n\n图 6-13 Cisco\
  \ WAN 模块。WIC-1DSU-T1（左）、WIC-1T（中）、WIC 2A/S（右）\n\n- **WIC-1T** 这种带有 DB-60 端口的 WAN\
  \ 接口卡提供一个串行端口，用于连接到 WAN 环境。\n- **WIC 1DSU/T1** 这种带有单个 RJ-45 端口的 WIC 卡是内部 CSU/DSU\
  \ 卡，用于连接到 T1 线路。\n- **WIC 2A/S** 这种带有两个 V.35 串行连接器的 WIC 模块可实现与 WAN 环境的连接。\n\n请记住，每个\
  \ WIC 卡金属板上的标签列出了卡类型。每种模块类型都由特定设备支持，并且有最低 IOS 版本要求才能识别该模块。例如，WIC 1DSU/T1 模块在我的 Cisco\
  \ 1921 路由器中无法识别，因为我的路由器需要该模块的 HWIC 版本。*高速 WAN 接口卡*（HWIC）是 Cisco WIC 卡的新版本，支持更高的速度和更好的吞吐量。\n\
  \n以下是安装或更换 WIC 或 HWIC 模块的方法：\n\n- 1. 通过在 Cisco 网站上搜索模块型号，验证该模块是否受你的设备和操作系统版本支持。\n\
  - 2. 使用菲利普斯螺丝刀拧下要从插槽中移除的空白板或现有模块。然后从插槽中取出空白板或现有模块。\n- 3. 将新模块滑入插槽，确保其完全推入。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_271_0.png)\n\
  \n- 4. 拧紧模块以将其固定到位。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_271_1.png)\n\n安装新硬件模块后，打开\
  \ Cisco 设备的电源，然后使用 **show inventory** 命令验证模块是否被检测到。通过以下代码示例，我们可以获得有关硬件的一些详细信息。首先，注意\
  \ **show inventory** 命令显示了 Cisco 设备的型号，仍然是 Cisco 1921 系列设备。此外，注意我们可以看到设备的序列号。\n\n\
  ```\nRouter>enable\nRouter#show inventory\nNAME: \"CISCO1921/K9\", DESCR: \"CISCO1921/K9\
  \ chassis, Hw Serial#: FGL1551222Y,\nHw Revision: 1.0\"\nPID: CISCO1921/K9 , VID:\
  \ V04 , SN: FGL1551222Y\n\nNAME: \"WAN Interface Card - HWIC CSU/DSU on Slot 0 SubSlot\
  \ 0\", DESCR: \"WAN Interface Card - HWIC CSU/DSU\"\nPID: HWIC-1DSU-T1 , VID: V02\
  \ , SN: FOC19092U9T\n\nNAME: \"WAN Interface Card - HWIC Serial 2T on Slot 0 SubSlot\
  \ 1\", DESCR: \"WAN Interface Card - HWIC Serial 2T\"\nPID: HWIC-2T , VID: V02 ,\
  \ SN: FOC14226262\n```\n\n查看此输出时，你还可以看到设备信息下方安装在设备插槽中的 WIC 卡信息。请注意，第一张 WIC 卡是插槽\
  \ 0/0 中的 HWIC CSU/DSU，型号为 HWIC-1DSU-T1，卡上的序列号为 FOC19092U9T。请注意，第二张卡是位于插槽 0/1 中的\
  \ HWIC-2T，序列号为 FOC14226262。\n\n如果运行 **show inventory** 命令后看不到新的硬件模块，可能是因为硬件模块不受设备支持或你未运行最低\
  \ IOS 版本。务必查看卡（硬件模块）的文档，以确保了解受支持的设备和最低 IOS 版本。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_272_0.png)\n\
  \n**考试提示** 请记住，对于 Cisco CCT 考试，**show version** 命令和 **show inventory** 命令可用于查看硬件设备的型号信息和序列号。\n\
  \n\n\n## 回环插头\n\n回环插头可以连接到端口，以验证端口能够发送和接收信号，而信号不会离开系统。回环插头适用于不同类型的接口，例如 RJ-45 以太网接口、T1\
  \ 链路和 56K 链路。回环插头是一种特殊设计的连接器，其连接器的发送引脚（UTP 布线中的引脚 1 和 2）连接到同一连接器上的双向引脚（UTP 布线中的引脚\
  \ 4 和 5）。\n\n让我们看一个用于 T1 接口的回环插头的创建示例。你需要一个压线钳、一个 RJ-45 连接器和一小段以太网电缆（长度约为 3 到 4\
  \ 英寸）。然后按照以下步骤制作自己的 T1 回环插头：\n\n- 1. 剪下一小段以太网电缆（约 3 或 4 英寸）。\n- 2. 去除电缆的外层护套。\n\
  - 3. 将 RJ-45 连接器的卡扣朝向远离你的方向。左侧为引脚 1，右侧为连接器中的引脚 8。\n- 4. 使用橙色线（可以用任何线），将线的一端插入 RJ-45\
  \ 连接器的引脚 1，然后弯折电线，将电线的另一端连接到连接器的引脚 4。\n- 5. 使用蓝色线（可以用任何线），将线的一端插入 RJ-45 连接器的引脚 2，然后弯折电线，将电线的另一端连接到连接器的引脚\
  \ 5。\n- 6. 线路就位后，将 RJ-45 连接器放入压线钳中并挤压以压接电线。\n\n回环插头制作完成后，你可以将其连接到路由器上的 T1 端口，你应该会通过\
  \ LED 收到链路或回环的指示（取决于接口）。\n\n## Cisco 设备电缆类型\n\n你应该熟悉 Cisco CCT 认证考试中的几种不同类型的电缆。\n\
  \n### 控制台电缆\n\n控制台电缆通常是一根浅蓝色电缆，一端带有串行端口（RS-232）连接器，另一端带有 RJ-45 连接器。该电缆用于将计算机连接到\
  \ Cisco 设备，以便你本地配置设备。如前所述，如果你的计算机没有串行端口（大多数笔记本电脑的情况），你将需要一个 USB 转串行适配器，以便将控制台电缆连接到\
  \ USB 端口。\n\n### 以太网电缆\n\n你将使用直通以太网电缆将工作站连接到交换机，或将路由器连接到交换机。你可能还需要交叉电缆来连接类似的设备，例如两台交换机。\n\
  \n### 串行电缆\n\n使用背靠背串行电缆通过路由器的串行端口连接两台路由器。有多种不同类型的串行端口，因此请确保为这些端口配备正确的电缆类型。图 6-14\
  \ 显示了路由器上的两种不同类型的串行接口以及相应的布线。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_274_0.png)\n\
  \n图 6-14 连接到串行端口的串行电缆\n\n### 交换机堆叠电缆\n\n许多企业级交换机支持 StackWise 功能，该功能使你能够将交换机连接为一个可管理的单元，以便从一个点集中配置所有交换机。要将交换机堆叠连接起来，你需要使用\
  \ StackWise 电缆，如图 6-15 所示。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_275_0.png)\n\
  \n图 6-15 用于连接堆叠交换机的 StackWise 电缆\n\n## 练习 6-1：识别 Cisco 设备组件\n\n在本练习中，你将使用以下图表识别\
  \ Cisco 设备上的组件并找到以下部件（并非所有组件都一定存在）：\n\n|  |  |\n|---|---|\n| 控制台端口 | 串行端口 |\n| 以太网端口\
  \ | 辅助端口 |\n| 集成 CSU/DSU |  |\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_275_1.png)\n\
  \n## 了解内存类型\n\n现在让我们来看看 Cisco 软件组件，从 Cisco 设备上找到的不同类型的内存以及存储在该内存中的信息类型开始。这对于 Cisco\
  \ CCT 考试来说是很重要的内容，请务必好好学习。\n\n### 只读存储器 (ROM)\n\nROM 中的软件无法更改，除非你实际更换 Cisco 设备上的\
  \ ROM 芯片。ROM 是非易失性的——也就是说，当你关闭设备时，ROM 的内容不会被擦除。ROM 包含启动路由器所需的固件，通常具有以下三个组件：\n\n\
  - **开机自检 (POST)** 对设备的硬件组件执行测试。\n- **引导程序** 启动路由器并确定如何找到和加载 IOS 映像和配置文件。\n- **ROM\
  \ 监视器 (ROMMON)** 一个迷你操作系统，使你能够执行低级测试和故障排除；例如，ROMMON 在密码恢复过程中使用。要中止路由器加载 IOS 的正常启动过程，请按\
  \ ctrl-break 进入 ROMMON 模式。ROMMON 模式下的提示符为 > 或 rommon>，具体取决于路由器型号。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_276_0.png)\n\
  \n**考试提示** POST 对硬件执行自检。引导程序启动路由器并找到 IOS 映像。ROMMON 包含一个用于低级测试和调试的迷你操作系统。Mini-IOS\
  \ 是 IOS 的精简版本，用于路由器的紧急启动，被称为 RXBOOT 模式。所有这些组件都存储在 ROM 中。\n\n### 闪存\n\nFlash 是一种非易失性存储器，类似于\
  \ ROM，这意味着当你关闭路由器时，存储在闪存中的信息不会丢失。路由器将其 IOS 映像存储在闪存中，但也可以在此处存储其他信息，例如辅助配置文件。请注意，一些低端\
  \ Cisco 路由器实际上直接从闪存（而非 RAM）运行 IOS。闪存比 RAM 慢，这一事实可能会导致性能问题。图 6-16 显示了闪存被插入紧凑型闪存插槽。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_277_0.png)\n\n图 6-16 Cisco 路由器上的闪存\n\n\
  ### 易失性 RAM (VRAM)\n\nCisco 设备上的易失性 RAM (VRAM) 与计算机中的 RAM 类似，因为在关闭系统时它会丢失其内容。在路由器上，易失性\
  \ RAM，有时仅称为 RAM，包含正在运行的 IOS 映像、活动配置文件（称为运行配置）、任何表（包括路由、ARP 和其他表），以及用于临时存储信息（如接口输入和输出缓冲区和日志消息）的内部缓冲区。当你关闭路由器时，RAM\
  \ 中的所有内容都会被擦除，包括上面提到的项目，例如你的运行配置。\n\n### 非易失性 RAM (NVRAM)\n\nNVRAM 与闪存类似，因为在关闭路由器时其内容不会被擦除。不过，它略有不同，因为它使用电池在\
  \ Cisco 设备关闭时保持信息。路由器（和交换机）使用 NVRAM 存储配置文件，包括在 IOS 加载后启动过程中应用于设备的启动配置。\n\n## 练习\
  \ 6-2：识别内存类型\n\n在本练习中，你将把内存术语与其描述的功能进行匹配。\n\n| 术语 | 描述 |\n|---|---|\n| A. 闪存 | ___\
  \ 包含启动配置文件 |\n| B. 易失性 RAM | ___ 包含运行配置文件 |\n| C. ROM | ___ 包含 IOS 映像文件 |\n| D.\
  \ 非易失性 RAM | ___ 包含引导程序和 ROMMON 程序 |\n\n## 管理 Cisco 设备\n\n安装设备后，你可以启动并配置设备。在我们进入配置（见第\
  \ 7 章）之前，你应该知道可以通过本节讨论的几种方式管理设备。\n\n### 使用 CLI\n\n管理 Cisco 设备最常用且最常用的方法之一是使用命令行界面（CLI）。CLI\
  \ 是一个命令环境，类似于 Windows 命令提示符或 Linux 终端，你必须在其中输入命令以应用配置更改。Cisco CCT 和 CCNA 认证考试要求你知道如何使用\
  \ CLI 应用配置更改。\n\n你可以使用 CLI 进行本地或远程管理。在本地管理中，你已将笔记本电脑连接到设备的控制台端口，并将使用 CLI 管理设备。这里的“本地”是指你与设备在物理上距离很近，可以连接到控制台端口。设备配置完毕并分配了\
  \ IP 地址后，你可以从\n\n工作站连接到网络，可从网络的另一部分通过 telnet 或 SSH 进入设备。\n\n## 基于 Web 的工具\n\n对于某些\
  \ Cisco 设备，例如某些交换机和无线接入点，您可以使用 Web 界面对设备进行配置更改。通过使用 Web 界面，您无需学习配置设备的命令——只需在网页上选择适当的选项即可。\n\
  \nWeb 界面在 CCNA 考试中不是重点，原因有两个：\n\n- 并非所有配置选项都可通过 Web 界面使用，因此最终您仍需要使用 CLI。\n- 并非所有\
  \ Cisco 设备都支持 Web 界面。\n\n## 启动 Cisco 设备\n\nCisco CCT 考试要求您了解 Cisco 设备的启动过程。本节将介绍\
  \ Cisco 设备启动时发生的情况。\n\n## 启动过程\n\n路由器启动时通常会经历六个步骤：\n\n- 1. 路由器加载并运行 POST（位于 ROM\
  \ 中），测试其硬件组件，包括内存和接口。\n- 2. 加载并执行引导程序。\n- 3. 检查配置寄存器以确定如何启动（在哪里找到 IOS 映像和配置文件）。\n\
  - 4. 引导程序查找并加载 IOS 映像。IOS 映像可能位于 flash 或 TFTP 服务器中。\n- 5. IOS 加载后，IOS 会尝试查找并加载配置文件，该文件通常存储在\
  \ NVRAM 中。如果 IOS 找不到配置文件，则会启动系统配置对话框。\n- 6. 配置加载后，您将看到 CLI（请记住，您进入的第一个模式是用户 EXEC\
  \ 模式）。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_280_0.png)\n\n**考试提示** POST 完成后且引导程序加载后，将检查配置以确定下一步操作。\n\
  \n如果您已连接到控制台线路，路由器启动时您将看到以下输出：\n\nSystem Bootstrap, Version 11.0(10c), SOFTWARE\n\
  Copyright (c) 1986-1996 by Cisco Systems\n2500 processor with 6144 Kbytes of main\
  \ memory\n\nF3: 5593060+79544+421160 at 0x3000060\n\nCisco Internetwork Operating\
  \ System Software\nIOS (tm) 2500 Software (C2500-I-L), Version 12.0(5)\nCopyright\
  \ (c) 1986-1999 by Cisco Systems, Inc.\nCompiled Tue 15-Jun-99 19:49 by phanguye\
  \ Image text-base: 0x0302EC70, data-base: 0x00001000 . . .\n.\n.\n.\nCisco 2504\
  \ (68030) processor (revision N) with\n    6144K/2048K bytes of memory.\nProcessor\
  \ board ID 18086269, with hardware revision\n    00000003\nBridging software.\n\
  X.25 software, Version 3.0.0.\nBasic Rate ISDN software, Version 1.1.\n2 Ethernet/IEEE\
  \ 802.3 interface(s)\n2 Serial network interface(s)\n32K bytes of non-volatile configuration\
  \ memory.\n16384K bytes of processor board System flash (Read ONLY)\n\n00:00:22:\
  \ %LINK-3-UPDOWN: Interface Ethernet0, changed\n    state to up\n00:00:22: %LINK-3-UPDOWN:\
  \ Interface Ethernet1, changed\n    state to up\n.\n.\n.\nCisco Internetwork Operating\
  \ System Software\nIOS (tm) 2500 Software (C2500-I-L), Version 12.0(5)\nCopyright\
  \ (c) 1986-1999 by Cisco Systems, Inc.\nCompiled Tue 15-Jun-99 19:49 by phanguye\n\
  \nPress RETURN to get started!\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_281_0.png)\n\
  \nVIDEO 6.01. 本书附带的数字资源包含一个 Cisco 路由器启动的多媒体演示。\n\n您应该注意此输出的几点。首先，注意路由器正在加载引导程序——“System\
  \ Bootstrap, Version 11.0(10c)”——然后是 IOS 映像——“IOS (tm) 2500 Software (C2500-I-L),\
  \ Version 12.0(5)”。在启动过程中，您看不到实际的 POST 过程（不像 Catalyst 交换机）。不过，您会看到有关接口上下状态的信息——这是\
  \ IOS 正在加载配置并启动您之前激活的那些接口的地方。有时，如果路由器有很多接口，“Press RETURN to get started!” 消息会与接口消息混在一起。一旦显示停止，只需按\
  \ Enter 即可访问用户 EXEC 模式。这完成了路由器的启动过程。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_282_0.png)\n\
  \nEXAM TIP 对于考试，请记住此过程：路由器启动时，它会运行 POST、加载引导程序、查找并加载 IOS，然后加载其配置文件——按此顺序。\n\n##\
  \ 引导程序\n\n正如您在启动代码示例中所看到的，引导程序找到了 IOS 并加载了它。引导程序在尝试定位并加载 IOS 映像时会经历以下步骤：\n\n- 1.\
  \ 它检查配置寄存器值。该值是一组四个十六进制数字。最后一位会影响启动过程。如果最后一位在 0x2 到 0xF 之间，路由器将继续下一步。否则，路由器将使用表\
  \ 6-3 中显示的值来确定应如何进行。\n\n| 最后一位的值 | 启动过程 |\n|---|---|\n| 0x0 | 将路由器引导至 ROMMON 模式。\
  \ |\n| 0x1 | 使用 flash 中的第一个 IOS 映像或 ROM 中的 Mini-IOS（RXBOOT 模式）引导路由器（如果后者存在）。 |\n\
  | 0x2-0xF | 使用默认启动序列引导路由器。 |\n\n### 表 6-3 配置寄存器第四个十六进制字符的值\n\n- 2. 它检查 NVRAM 中的配置文件中的\
  \ **boot system** 命令，这些命令告诉引导程序在哪里找到 IOS。这些命令稍后会显示。\n- 3. 如果在 NVRAM 中的配置文件中找不到 **boot\
  \ system** 命令，它将使用 flash 中找到的第一个有效 IOS 映像。\n- 4. 如果 flash 中没有有效的 IOS 映像，它会生成 TFTP\
  \ 本地广播以定位 TFTP 服务器（这称为 *netboot*，不建议使用，因为它非常慢且对于大型 IOS 映像不太可靠）。\n- 5. 如果找不到 TFTP\
  \ 服务器，它将加载 ROM 中的 Mini-IOS（RXBOOT 模式）。\n- 6. 如果 ROM 中有 Mini-IOS，它将加载 Mini-IOS 并进入\
  \ RXBOOT 模式；否则，路由器将重试查找 IOS 映像或加载 ROMMON 并进入 ROMMON 模式。\n\n表 6-3 显示了配置寄存器中用于影响启动过程的第四个十六进制字符中的三个常见配置寄存器值。配置寄存器中的值以十六进制表示，寄存器长度为\
  \ 16 位。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_283_0.png)\n\n**考试提示** 对于 CCT\
  \ 和 CCNA 考试，要知道配置寄存器用于影响 IOS 如何启动。请记住表 6-3 中的值。\n\n对于启动过程的第 2 步，您可以使用以下 **boot system**\
  \ 命令来影响引导程序在尝试定位 IOS 映像时应使用的顺序：\n\n```\nRouter(config)# boot system flash name_of_IOS_file_in_flash\n\
  Router(config)# boot system tftp IOS_image_name\n               IP_address_of_server\n\
  Router(config)# boot system rom\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_284_0.png)\n\
  \n**注意** 输入 **boot system** 命令的顺序很重要，因为引导程序会按您配置的顺序处理它们——一旦程序找到 IOS 映像，它就不会再处理配置文件中的任何其他\
  \ **boot system** 命令。这些命令也受 Catalyst IOS 交换机支持。\n\n**boot system flash** 命令告诉引导程序在启动时加载\
  \ flash 中指定的 IOS 文件名。请注意，默认情况下，引导程序会加载 flash 中 *第一个* 有效的 IOS 映像。此命令告诉引导程序加载与第一个不同的映像。如果您执行升级并且\
  \ flash 中有两个 IOS 映像——旧的和新的——则可能需要这样做。默认情况下，旧的仍会先加载（因为它在 flash 中出现得更早），除非您使用 **boot\
  \ system flash** 命令覆盖此行为或删除旧的 IOS flash 映像。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_284_1.png)\n\
  \n**VIDEO 6.02.** 本书附带的数字资源包含使用路由器上的 **boot system** 命令的多媒体演示。\n\n\n\n你还可以让引导程序从\
  \ TFTP 服务器加载 IOS，但对于大镜像不推荐这样做，因为镜像是通过用户数据报协议（UDP）下载的，而 UDP 速度较慢。最后，你可以用 **boot system\
  \ rom** 命令告诉引导程序从 ROM 中加载 Mini-IOS。要删除这些命令中的任何一个，只需在它们前面加上 **no** 参数即可。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_285_0.png)\n\
  \n**考试提示** **boot system** 命令可用于修改引导程序应从何处加载 IOS 的默认行为。当引导程序加载时，它会检查存储在 NVRAM 中的配置文件，查找\
  \ **boot system** 命令。如果找到这些命令，引导程序将使用这些命令来查找 IOS。如果未找到 **boot system** 命令，路由器将使用查找和加载\
  \ IOS 镜像的默认行为（首先是 flash 中的第一个镜像，然后向 TFTP 服务器广播，最后是 ROM 中的 IOS（如果存在））。当路由器启动时，如果你看到消息“boot:\
  \ cannot open \"flash:\"”；这表明你错误配置了 **boot system** 命令，并且 flash 中对应的 IOS 镜像文件名不存在。\n\
  \n## 系统配置对话框\n\n当路由器启动、运行硬件诊断并加载 IOS 软件后，IOS 随后会尝试在 NVRAM 中查找配置文件。如果找不到要加载的配置文件，IOS\
  \ 就会运行系统配置对话框，通常称为 *设置* 模式，这是一个会提示你输入配置信息的脚本。该脚本的目的是向你提问，以便你能够在路由器上设置基本配置：它并非作为全功能配置工具而设计。换句话说，该脚本没有执行路由器所有配置任务的能力。相反，它被那些不太熟悉\
  \ IOS CLI 的新手使用。一旦你熟悉 CLI 以及路由器上的许多命令，你可能就再也不会使用此脚本了。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_286_0.png)\n\
  \n**考试提示** 请记住，如果在 NVRAM 中找不到启动配置，系统配置对话框脚本就会启动。\n\n## 运行系统配置对话框\n\n一种访问系统配置对话框的方法是在\
  \ NVRAM 中没有配置的情况下启动路由器。第二种方法是在特权 EXEC 模式下使用 **setup** 命令，如下所示：\n\n```\nRouter# setup\n\
  \    --- System Configuration Dialog ---\nContinue with configuration dialog? [yes/no]:\
  \ yes\nAt any point you may enter a question mark '?' for help.\nUse ctrl-c to abort\
  \ configuration dialog at any prompt.\nDefault settings are in square brackets '[\
  \ ]'.\n\nBasic management setup configures only enough connectivity\nfor management\
  \ of the system, extended setup will ask you\nto configure each interface on the\
  \ system\n\nFirst, would you like to see the current interface summary? [yes]:\n\
  Interface IP-Address  OK? Method Status          Protocol\nEthernet0 unassigned\
  \  YES unset  administratively down down\nEthernet1 unassigned  YES unset  administratively\
  \ down down\nSerial0   unassigned  YES unset  administratively down down\n\nWould\
  \ you like to enter basic management setup? [yes/no]: no\nConfiguring global parameters:\n\
  \  Enter hostname [Router]:\nThe enable secret is a password used to protect access\
  \ to\nprivileged EXEC and configuration modes. This password, after\nentered, becomes\
  \ encrypted in the configuration.\nEnter enable secret: dealgroup1\nThe enable password\
  \ is used when you do not specify an\nenable secret password, with some older software\
  \ versions,\nand some boot images.   Enter enable password: dealgroup2\nThe virtual\
  \ terminal password is used to protect\naccess to the router over a network interface.\n\
  Enter virtual terminal password: cisco\nConfigure SNMP Network Management? [no]:\n\
  Configure LAT? [yes]: no\nConfigure AppleTalk? [no]:\nConfigure DECnet? [no]:\n\
  Configure IP? [yes]:\n  Configure IGRP routing? [yes]: no\n  Configure RIP routing?\
  \ [no]:\n.\n.\n.\nConfiguring interface parameters:\nDo you want to configure Ethernet0\
  \ interface? [no]: yes\n  Configure IP on this interface? [no]: yes\n    IP address\
  \ for this interface: 172.15.1.1\n    Subnet mask for this interface [255.255.0.0]\
  \ : 255.255.255.0\n    Class B network is 172.15.0.0, 24 subnet bits; mask is /24\n\
  ```\n\n```\nDo you want to configure Serial0 interface? [no]:\n.\n.\n.\nThe following\
  \ configuration command script was created:\nhostname Router\nenable secret 5 $1$/CCk$4r7zDwDNeqkxFO.kJxC3G0\n\
  enable password dealgroup2\nline vty 0 4\n  password cisco\n.\n.\nend\n\n[0] Go\
  \ to IOS command prompt without saving this config.\n[1] Return back to the setup\
  \ without saving this config.\n[2] Save this configuration to nvram and exit.\n\
  Enter your selection [2]: 2\n```\n\n方括号 ([ ]) 中包含的信息表示默认值——如果你按回车键，则使用方括号中的值。此脚本的一个问题是，如果你犯了错误，就无法返回到前一个问题。相反，你必须使用\
  \ ctrl-c 中断序列来中止脚本并重新开始。\n\n以下各节将分解脚本的不同组件。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_288_0.png)\n\
  \n注 脚本向你提出的问题可能因路由器而异，具体取决于硬件型号、安装的接口以及运行在其上的软件。\n\n## 状态和全局配置信息\n\n脚本开始时，会询问你是否要继续。如果回答\
  \ yes，脚本将继续；否则，如果回答 no，脚本将被中止并返回到特权 EXEC 模式。接下来会询问你是否要查看路由器的接口状态。如果回答 yes，你将看到路由器上的所有接口、接口的\
  \ IP 地址以及接口的状态。\n\n在状态信息之后，会显示实际配置。配置的第一部分处理路由器除接口之外的所有配置信息，接口是第二部分。在配置的这一部分中，会要求你提供诸如特权\
  \ EXEC 密码、虚拟类型终端（VTY）密码（telnet 和 SSH）、你希望全局激活的网络协议以及其他全局配置信息等内容。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_289_0.png)\n\
  \n**注** 请注意，脚本中会提示你输入两个特权 EXEC 密码：**enable secret** 和 **enable password**。尽管你通常只配置一个，但脚本要求你同时输入两者，并且要求两个密码不同。当设置了\
  \ secret 后，你需要使用 secret 进入特权 EXEC 模式。\n\n## 协议和接口配置信息\n\n在为路由器配置全局信息后，脚本会引导你回答有关要使用哪些接口以及应如何配置它们的问题。脚本足够智能，可以根据你对全局问题的回答来提问配置问题。例如，如果你激活了\
  \ IP，脚本会询问你每个已激活的接口是否要处理 IP，如果回答是，则询问该接口的 IP 地址信息。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_290_0.png)\n\
  \n**考试提示** 你应该记住，当路由器启动且 NVRAM 中没有配置时，或从特权 EXEC 模式使用 **setup** 命令时，系统配置对话框脚本会启动。此外，要了解\
  \ Setup 对话框脚本末尾的三个选项。并且请记住，你可以按 ctrl-c 来中止脚本。\n\n## 退出设置模式\n\n在你回答完脚本的所有配置问题后，会显示脚本根据你对脚本问题的回答创建的路由器配置。请注意，IOS\
  \ 尚未激活配置文件。仔细检查配置，然后从表 6-4 中显示的三个选项中选择一个。此外，如果你输入 **1** 作为选项，当脚本重新开始时，你之前输入的信息会出现在方括号中，并在空行上按回车键时成为默认值。\n\
  \n| 选项 | 描述 |\n|---|---|\n| 0 | 丢弃脚本的配置并返回到特权 EXEC 模式。 |\n| 1 | 返回脚本的开头。 |\n| 2\
  \ | 激活脚本的配置，将配置保存到 NVRAM，并返回到特权 EXEC 模式。 |\n\n表 6-4 系统配置对话框结束时的选项\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_290_1.png)\n\
  \n**视频 6.03.** 本书附带的数字资源包含使用系统配置对话框的\n\n一台思科路由器。\n\n## 技术人员服务相关任务\n\n作为思科认证技术员（CCT），在回答客户服务电话时，您将负责执行关键的管理任务。在本节中，您将学习如何执行考试所需了解的常见服务相关任务。\n\
  \n## 使用文本编辑器\n\n尽管大部分管理操作都是在思科设备上执行的，但您应该知道如何在 Windows 或 Linux 中启动文本编辑器。您可以使用文本编辑器准备配置命令，然后将其粘贴到\
  \ CLI 中执行命令。\n\n### 在 Windows 中启动文本编辑器\n\n启动 Windows 中的文本编辑器，请按以下步骤操作：\n\n- 1. 单击“开始”按钮。\n\
  - 2. 输入 **记事本**。\n- 3. 在搜索结果的“最佳匹配”部分中，选择记事本。\n\n### 在 Linux 中启动文本编辑器\n\n根据 Linux\
  \ 的发行版，您可以使用多种不同的方法启动文本编辑器。在 Kali Linux 中，您可以通过以下步骤启动文本编辑器：\n\n- 1. 单击左上角的“应用程序”按钮（Kali\
  \ Linux 图标）。\n- 2. 选择“常用应用程序”。\n- 3. 选择“文本编辑器”。\n\n## 启动命令提示符\n\n在排除连接问题时，您可能需要启动命令提示符并从那里运行一些故障排除命令。以下是一些示例故障排除命令：\n\
  \n- **ping** 使用 **ping** `<ip_address>` 命令来验证设备或系统是否在网络上处于运行状态。\n- **traceroute**\
  \ 在 Windows 中使用 **tracert** `<ip_address>` 命令或在 Linux 中使用 **traceroute** `<ip_address>`\
  \ 命令来验证数据包到达目的地的路径。\n- **nslookup** 使用 **nslookup** `<dns_name>` 命令向 DNS 发送查询以查找\
  \ *完全限定域名*（FQDN）的 IP 地址。\n- **arp** 在您的笔记本电脑上使用 **arp -a** 命令查看系统的 ARP 缓存。\n- **pathping**\
  \ **pathping** 命令结合了 **ping** 和 **tracert** 命令，如下所示：**pathping** `<dns_name>`——例如，**pathping**\
  \ www.dcatt.ca。\n\n### 启动 Windows 命令提示符\n\n要在 Windows 中启动命令提示符然后执行命令，请按以下步骤操作：\n\
  \n- 1. 单击“开始”按钮。\n- 2. 在搜索框中输入 **cmd**。\n- 3. 在搜索结果的“最佳匹配”部分中选择“命令提示符”。\n\n### 启动\
  \ Linux 终端会话\n\nLinux 管理员不像 Windows 管理员那样使用“提示符”一词；相反，Linux 中使用 *终端会话*。要在 Kali Linux\
  \ 中启动终端会话，请按以下步骤操作：\n\n- 1. 右键单击桌面。\n- 2. 选择“在此处打开终端”。\n\n## 配置 NIC 设置\n\n作为服务技术员，当将笔记本电脑的以太网端口连接到思科设备（通常是交换机）时，您可能需要配置技术员笔记本电脑上的\
  \ TCP/IP 设置以访问客户网络。要将笔记本电脑连接到客户网络，请将一根直通以太网电缆连接到笔记本电脑上的以太网端口并连接到思科交换机上的端口。然后您需要验证并可能配置\
  \ TCP/IP 设置以访问网络。\n\n要验证您的 IP 地址设置，请转到命令提示符并输入 **ipconfig** 命令。如果您需要在 Windows 10\
  \ 中更改 TCP/IP 设置，请执行以下操作：\n\n- 1. 单击“开始”按钮。\n- 2. 在搜索框中输入 **control**。\n- 3. 在搜索结果的“最佳匹配”部分中选择“控制面板”。\n\
  - 4. 选择“网络和 Internet | 网络和共享中心”。\n- 5. 在左侧选择“更改适配器设置”。\n- 6. 右键单击以太网适配器并选择“属性”。\n\
  - 7. 选择“Internet 协议版本 4 (TCP/IPv4)”然后单击“属性”按钮。\n- 8. 输入 IP 地址、子网掩码和默认网关值。\n\n##\
  \ 连接到控制台端口\n\n如果您想在不为笔记本电脑配置 IP 地址的情况下本地连接到思科设备，可以使用控制台电缆（也称为翻转电缆）连接到思科设备的控制台端口。要连接到控制台端口，请将控制台电缆连接到笔记本电脑上的串行端口，或如果笔记本电脑没有串行端口，则使用串行转\
  \ USB 适配器。连接控制台电缆到思科设备和笔记本电脑后，您就可以启动终端软件来管理设备。\n\n## 使用终端仿真软件\n\n在处理思科设备时，常见的服务相关任务是使用终端仿真软件连接到控制台端口（本地管理）、通过\
  \ telnet 进入设备（不安全的远程管理）或通过 SSH 进入设备（安全的远程管理）。有许多终端仿真软件示例，但思科 CCT 认证考试要求您熟悉 PuTTY\
  \ 和 Tera Term。\n\n### 使用 PuTTY 连接\n\n在技术员笔记本电脑上下载并安装 PuTTY 后，请按以下步骤使用 PuTTY 连接到控制台端口：\n\
  \n- 1. 启动 PuTTY 以打开配置窗口：\n- 2. 在“连接类型”下，选择“串行”单选按钮以使用串行端口和控制台电缆连接到设备。\n- 3. 选择“串行”选项后，对话框会发生变化（“主机名”选项变为“串行线路”选项）。在“串行线路”设置中，您需要通过指定\
  \ COM1、COM2、COM3 或 COM4（取决于您的系统）来指定要使用的 COM 端口。您可以逐个尝试，直到建立连接。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_294_0.png)\n\
  \n- 4. 设置 COM 编号作为串行线路后，单击“打开”\n- 5. 在终端窗口内单击并按 Enter 键以打开提示符。\n\n### 使用 Tera Term\
  \ 连接\n\n在技术员笔记本电脑上下载并安装 Tera Term 后，请按以下步骤使用 Tera Term 连接到控制台端口：\n\n- 1. 启动 Tera\
  \ Term。在“新建连接”窗口中，指定您希望如何连接到设备。请注意，在 TCP/IP 下，您可以选择远程访问协议，例如 Telnet 或 SSH。您也可以选择“串行”直接通过串行端口连接到设备的控制台。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_295_0.png)\n\n- 2. 在左下角选择“串行”单选按钮以使用串行端口（和控制台电缆）连接到设备。\n\
  - 3. 在“端口”字段中，选择要使用的串行端口。您可以逐个尝试，直到建立连接。\n- 4. 选择 COM 端口号后，单击“确定”。\n- 5. 在终端窗口中的任意位置单击并按\
  \ Enter 键以打开提示符。\n\n## 复制和粘贴配置设置\n\n思科 CCT 认证考试要求您了解如何使用您选择的终端程序将配置从路由器或交换机复制和粘贴，或从路由器或交换机复制和粘贴配置。\n\
  \n要将路由器配置复制到文件，请按以下步骤操作：\n\n- 1. 打开 PuTTY 程序并连接到您的路由器。\n- 2. 输入 **enable** 并按 ENTER。\n\
  - 3. 输入 **terminal length 0** 并按 ENTER。该命令可确保路由器显示所有命令时不会在全屏处暂停并出现 \"--more--\"\
  \ 提示。\n- 4. 右键单击并选择“更改设置”。\n- 5. 选择“会话 | 日志记录 | 记录所有会话输出”。这将把您的命令输出记录到您指定的文件中。\n\
  - 6. 选择要写入的文件：选择“浏览”，然后选择位置和文件名。\n- 7. 选择“应用”。\n- 8. 返回思科设备，输入命令 **show running-config**\
  \ 并按 ENTER。\n- 9. 找到文本文件并打开它以查看配置命令。\n\n将运行配置存储在文本文件中是备份配置的好方法。如果您需要将设备的配置恢复到配置文本文件中的内容，您可以随时将文本文件的内容复制并粘贴到终端程序中。\n\
  \n## 连接并验证设备接口状态\n\n随着后续章节的进展，您将学习如何配置思科设备的许多不同功能。入门时，我将向您展示一些可用于验证接口的命令\n\n设备正在工作。你将在第\
  \ 7 章更详细地看到这些命令。\n\n在此场景中，你已将一台计算机连接到交换机的接口 5，并且想要验证该接口是否正常工作。使用以下命令验证你的接口是否已启动并运行：\n\
  \n- **show ip interface brief** 使用这个很棒的 **show** 命令获取设备上所有接口的列表并快速查看其状态。你可以确定接口是否已启动并运行，并查看分配给接口的\
  \ IP 地址。\n- **show interfaces** 使用此命令查看所有接口的列表以及接口的详细规范。\n- **show interfaces g0/0**\
  \ 使用此命令查看特定接口的详细信息。\n- **show controllers s0/3/0** 在串行接口上使用 **show controllers**\
  \ 命令查看诸如 DCE 和 DTE 详细信息等信息。\n\n## 章节回顾\n\n在本章中，你学习了 Cisco 路由器和交换机上可用的众多 Cisco 硬件和软件功能。你学习了不同系列的\
  \ Cisco 设备，例如 Cisco Nexus 和 Cisco Catalyst 系列设备。你还学习了如何识别你正在维护的 Cisco 设备的型号以及其序列号的位置。\n\
  \n你还学习了 Cisco 设备上包含的不同类型的端口，例如控制台端口、辅助端口、以太网端口以及用于 WAN 连接的串行端口。你学习了如何将 Cisco 设备安装到机架中并使用\
  \ SFP+ 端口连接你选择的收发器。\n\n你学习了 Cisco 设备上存在的不同类型的内存，例如 ROM、VRAM、NVRAM 和闪存内存。最后，你学习了在为设备通电时\
  \ Cisco 设备的启动过程。\n\n## 快速回顾\n\n### 使用 Cisco 设备和软件\n\n- Cisco 提供多个产品线，例如 Cisco Nexus\
  \ 系列交换机和 Cisco Catalyst 系列交换机。\n- 型号和序列号通常位于 Cisco 设备背面的标签上。\n- 控制台端口用于本地管理，而辅助端口用于将调制解调器连接到路由器作为备份管理线路。\n\
  - 每个 LAN 端口由端口类型和索引号标识，例如 FE0/0 表示插槽 0 中的第一个快速以太网端口，或 G0/3 表示插槽 0 中的第三个千兆端口。\n\n\
  ### 了解内存类型\n\n- ROM 内存存储 POST 过程、引导程序以及在排除启动问题时使用的 ROMMON 程序。\n- 闪存存储 IOS 映像。\n\
  - 易失性 RAM 存储运行配置和 RAM 中的不同表，例如路由表。\n- 非易失性内存存储启动配置。\n\n### 管理 Cisco 设备\n\n- 你可以通过使用控制台电缆连接到设备的控制台端口来本地管理\
  \ Cisco 设备。\n- 你可以通过网络使用 telnet 或 SSH 远程连接到设备以对设备进行管理。\n- 在某些设备上，例如无线接入点，你可以使用 Web\
  \ 界面进行管理。\n\n### 启动 Cisco 设备\n\n- 当你启动 Cisco 设备时，首先运行 POST，然后加载引导程序，该程序定位要加载的 IOS\
  \ 映像。最后，在加载 IOS 后应用启动配置。\n- 如果没有启动配置，设备将提示你运行系统配置对话框，这是一个向导式界面，会提示你输入配置信息。\n- 使用\
  \ **boot system** 命令指定要启动的 IOS 映像。\n\n## 技术人员的服务相关任务\n\n- 作为服务技术人员，你必须知道如何通过控制台端口连接到\
  \ Cisco 设备以执行本地管理。\n- 知道如何使用笔记本电脑上的程序，例如文本编辑器和终端仿真软件，来连接到 Cisco 设备。\n- 知道常见的故障排除命令，例如\
  \ **ping**、**ipconfig** 和 **tracert**，以排除通信问题。\n\n## 问题\n\n以下问题将帮助你衡量你对本章所呈现材料的理解程度。仔细阅读所有选项，因为可能有多个正确答案。选择每个问题的正确答案。\n\
  \n1. Cisco 设备上哪种类型的内存存储 POST 过程？\n   A. NVRAM\n   B. VRAM\n   C. Flash\n   D. ROM\n\
  2. 你正在与客户一起检查路由器的端口，客户询问 AUX 端口的用途是什么。你会如何回答？\n   A. 它用于 telnet 到路由器。\n   B. 它用于将调制解调器连接到路由器。\n\
  \   C. 它用于 SSH 到路由器。\n   D. 它用作额外的以太网连接。\n3. 你正在为客户管理一台交换机，需要引用交换机上的第三个千兆以太网端口。用于引用该端口的标签标识符是什么？\n\
  \   A. Eth1/3\n   B. FE1/3\n   C. Gig1/3\n   D. Ethernet1/3\n4. Cisco 设备上的启动配置文件存储在哪里？\n\
  \   A. ROM\n   B. VRAM\n   C. NVRAM\n   D. Flash\n5. 你的路由器有两个用于连接 WAN 的串行端口。你正在将外部\
  \ CSU/DSU 连接到第二个串行端口。引用该端口的标签标识符是什么？\n   A. S0/1\n   B. S0/0\n   C. G0/0\n   D.\
  \ G0/1\n6. 你需要对客户的交换机配置进行一些更改。你已将控制台电缆连接到交换机上的控制台端口和笔记本电脑上的串行端口。你会使用什么程序来管理该设备？（选择两个。）\n\
  \   A. Notepad\n   B. PuTTY\n   C. Ping\n   D. Tracert\n   E. Tera Term\n7. 你对 Cisco\
  \ 设备进行了多次配置更改。哪种类型的内存用于存储运行配置？\n   A. ROM\n   B. Flash\n   C. NVRAM\n   D. VRAM\n\
  8. 你的客户来电称无法访问互联网。你到达客户现场并将笔记本电脑插入网络。你会使用什么命令来验证路由器是否已启动并运行？\n   A. ipconfig\n \
  \  B. ping\n   C. arp\n   D. netstat\n9. Cisco 设备的 IOS 映像文件使用哪种类型的内存存储？\n   A. Flash\n\
  \   B. VRAM\n   C. ROM\n   D. NVRAM\n\n## 绩效型问题\n\n1. 使用以下示例，将不同的命令与其定义进行匹配。\n\n\
  - show inventory\n- nslookup\n- ping\n- traceroute\n- show version\n\n- 用于验证系统或设备是否已启动并运行\n\
  - 用于查看 IOS 和接口信息\n- 用于验证数据包到达目的地的路径\n- 用于查看设备上安装的硬件组件\n- 用于查询 DNS 服务器并查找 FQDN 的\
  \ IP 地址\n\n2. 通过将左侧的步骤写入右侧的适当框中，按顺序排列 Cisco 设备在启动过程中所采取的步骤。\n\n### 步骤\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_302_0.png)\n\
  \n- 启动配置已应用\n- IOS 从闪存加载\n- 引导程序已加载并执行\n- 读取配置寄存器值以确定 IOS 映像和配置文件的位置\n- 设备加载并运行\
  \ POST\n\n## 答案\n\n1. D. 只读内存（ROM）用于存储 POST 过程、引导程序和 ROMMON 程序。\n2. B. 你可以使用 AUX\
  \ 端口连接调制解调器，以便在出现网络问题（如网络接口宕机）时拨号进入路由器。\n3. C. 正确的标识符是 Gig1/3：千兆以太网接口以 Gig、G 或 GigabitEthernet\
  \ 开头，后跟插槽的索引号，然后是接口的索引号。\n4. C. 启动配置存储在非易失性 RAM（NVRAM）中，即使设备断电也能保留配置。\n5. A. 串行端口以\
  \ S 或 Serial 开头，后跟插槽和端口号。路由器的插槽和端口号从 0 开始，因此在此示例中，第二个串行端口为 S0/1。\n6. B, E. 你可以使用任何终端仿真器，例如\
  \ PuTTY 或 Tera Term。两个程序都可在网上免费下载。\n7. D. 设备断电时运行配置会丢失，因此它存储在易失性 RAM（VRAM）中。\n8.\
  \ B. ping 命令可用于通过 IP 地址或 DNS 名称向设备发送测试消息并验证路由器是否已启动并\n\n运行中。\n\n9. A. IOS 映像文件存储在闪存中。\n\
  \n## 基于绩效的答案\n\n1. 下列是命令与其定义的映射。\n请记住，在真正的考试中，您需要将左侧的项目拖动并放置到右侧的匹配项目上。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_303_0.png)\n\
  \n2. 下列是 Cisco 设备启动时的正确事件顺序。请记住，在真正的考试中，您需要将左侧找到的项目拖动并按顺序放置到右侧。\n\n## 步骤\n\n- 1.\
  \ 设备加载并运行 POST\n- 2. 加载并执行引导程序\n- 3. 读取配置寄存器值以确定 IOS 映像和配置文件的位置\n- 4. 从闪存加载 IOS\n\
  - 5. 应用启动配置\n"
- "# Cisco IOS 基础\n\n本章中，您将\n\n- 了解如何与命令行界面 (CLI) 交互\n- 熟悉 IOS 的基础知识\n- 了解基本的 IOS\
  \ 配置\n- 了解基本的 IOS 安全配置\n- 学习一些 IOS 操作和验证命令\n\n本书强调通过命令行界面 (CLI) 和控制台端口访问、配置和管理 Cisco\
  \ 路由器和交换机的基本且重要的概念。您将使用命令和控制台端口连接来执行 Cisco 路由器和交换机的基本配置。\n\n这些讨论假设您从未配置过 Cisco 路由器或交换机；因此我们从基础开始——这些设备使用的操作系统\
  \ (OS)、Cisco 操作系统提供的优势以及使用命令配置 Cisco 设备的用法。后续章节将继续讨论，探讨 Cisco 交换机的配置、路由功能和安全功能。\n\
  \n## 命令行界面\n\n您首次在 Cisco 设备上访问 IOS CLI 的方式取决于您正在配置的设备类型。在几乎所有情况下，您最初都会使用控制台接口与设备交互；然而，从控制台端口访问\
  \ CLI 的方式可能因设备而异。例如，在 Cisco 路由器上，您登录控制台端口后会直接进入 IOS CLI\n当您从控制台端口登录时。如果 IOS 找不到路由器或交换机的配置文件，IOS\
  \ 会引导您进入设置模式（通过系统配置对话框），这是一个基本的配置脚本，会提示您输入有关如何配置 IOS 设备的信息（在第 6 章中讨论）。\n\n一旦您通过控制台端口配置了\
  \ Cisco 设备，您就可以使用其他方法来访问和更改其配置，例如 telnet 或 Secure Shell (SSH)—Cisco 将其称为 *虚拟类型终端*\
  \ (VTY) 访问。或者您可以使用 Trivial File Transfer Protocol (TFTP)、File Transfer Protocol\
  \ (FTP)、Simple Network Management Protocol (SNMP) 或基于 Web 的解决方案（用于路由器的 Cisco Configuration\
  \ Professional，或 CCP）。各种 Cisco 管理产品可用于配置和管理您的 Cisco 设备，例如 Cisco Security Manager\
  \ (CSM)；然而，本书主要关注 IOS CLI。\n\n## IOS 差异\n\n在本章及后续章节中，您会看到尽管 Cisco 路由器和交换机都运行 IOS，但这些产品使用的命令经常不同！换句话说，您在\
  \ Cisco 路由器上配置某个功能的方式可能与在 Catalyst 交换机上配置相同功能的方式不同。然而，如何访问 IOS 以及在 IOS 访问级别之间导航，以及如何使用许多管理命令，在\
  \ *所有* IOS 产品上是相同的。这可能会让 Cisco 新手感到困惑——某个特定功能的命令在所有 Cisco 产品上都相同，但另一个功能的配置在 Cisco\
  \ 路由器和 Catalyst 交换机之间是不同的。\n\n除了路由器和交换机等不同产品之间的命令差异外，产品线内部也可能存在命令差异，例如 Cisco 路由器。例如，Cisco\
  \ 根据您需要的功能为路由器销售不同版本的 IOS 软件。由于硬件差异，某些命令在某些路由器上有效，而在其他路由器上无效。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_307_0.png)\n\
  \n**注意** 最近，IOS 实现的数量大大减少了。每个版本的 IOS 可能有 5、10 甚至 15 个或更多不同的软件包需要下载，具体取决于您购买的功能。今天，软件包的数量更少，通常为\
  \ 3 个或更少。相反，Cisco 将大多数功能捆绑在 IOS 软件包中，但要求您购买许可证密钥来解锁这些功能。许可证在第 8 章中讨论。\n\n## 与 IOS\
  \ 交互\n\nCLI 是一个字符或文本界面。要与 CLI 交互，您只需输入命令，就像在文本编辑器中输入文章或在电子邮件程序中输入消息一样。您甚至可以在 IOS\
  \ CLI 中使用复制和粘贴等功能：例如，您可以使用终端仿真器的复制功能从路由器复制完整的配置，将其粘贴到文本编辑器中，对配置进行更改，选择并复制新的配置，然后将所有这些命令粘贴回\
  \ CLI。\n\nCLI 支持命令解析器。每当您按下 ENTER 键时，IOS 都会解析您输入的命令和参数并检查正确的语法和选项。当您将多个命令粘贴到 CLI\
  \ 中时，IOS 仍会对粘贴功能中包含的每个命令执行此过程。如果您在某个命令中犯了错误，CLI 解析器将显示错误消息，但它仍会继续执行粘贴列表中的下一个命令。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_307_1.png)\n\n**提示** 在对 IOS 设备进行任何配置更改之前，您应先备份！您将在第\
  \ 8 章中学习如何在网络上执行此操作，但您也可以通过执行 **show running-config** 命令、复制输出配置并将其粘贴到计算机上的备份文本文件中来轻松完成此操作。备份文本文件可以然后在配置更改出现问题时参考。您将在第\
  \ 8 章中了解有关备份和恢复配置的更多信息。\n\n## CLI 访问模式\n\n每个 Cisco 设备都支持多种访问模式。对于 CLI 交互，支持四种模式：\n\
  \n- **用户 EXEC** 提供对 IOS 的基本访问权限，命令可用性有限（基本上是简单的监控和故障排除命令）\n- **特权 EXEC** 提供对 IOS\
  \ 的高级管理访问权限，包括用户 EXEC 模式下可用的所有命令\n- **全局配置** 允许对设备进行配置更改\n- **ROM 监视器 (ROMMON)**\
  \ 加载引导程序，允许对 IOS 设备进行低级诊断测试、执行密码恢复程序以及执行紧急升级\n\n在这四种模式中，前三种适用于 IOS。在 ROMMON 模式下，IOS\
  \ 未加载，因此数据包不会在设备的接口之间移动。两种 EXEC 模式都可以受密码保护，使您能够限制可以访问设备以执行管理、配置和故障排除任务的人员。下两节介绍两种\
  \ EXEC 模式。\n\n## 用户 EXEC 模式\n\n您对 CLI 的初始访问是通过用户 EXEC 模式，该模式只有有限数量的 IOS 命令可供执行。根据\
  \ Cisco 设备的配置，您可能需要输入密码才能访问此模式。用户 EXEC 模式通常用于网络问题的基本故障排除。您可以通过检查屏幕左侧的提示来判断您是否处于用户\
  \ EXEC 模式：\n\n```\nIOS>\n```\n\n如果您在行尾看到 > 字符，您就知道您处于用户 EXEC 模式。> 前面的信息是 Cisco 设备的名称。例如，所有\
  \ Cisco 路由器的默认名称为 *Router*，而 2960 交换机的用户 EXEC 提示如下所示：**Switch>**。这些设备名称可以使用 **hostname**\
  \ 命令更改，该命令将在本章后面讨论。在前面的示例中，我将设备重命名为 *IOS*。\n\n## 特权 EXEC 模式\n\n一旦您获得了对用户 EXEC 模式的访问权限，您可以使用\
  \ **enable** 命令访问特权 EXEC 模式：\n\n```\nIOS> enable\nIOS#\n```\n\n一旦您输入 **enable**\
  \ 命令，如果在 Cisco 设备上配置了特权 EXEC 密码，您将被提示输入密码。成功通过身份验证后，您将进入特权 EXEC 模式。您可以通过检查 CLI 提示来判断您是否处于此模式——在前面的代码示例中，注意\
  \ > 变成了 #。\n\n当您处于特权 EXEC 模式时，您可以访问所有用户 EXEC 命令以及许多更高级的管理和故障排除命令。这些命令包括扩展 ping 和\
  \ trace 能力、管理配置文件和 IOS 映像的能力，以及使用 **debug** 命令进行详细故障排除的能力。唯一不能从此模式完成的事情是更改 Cisco\
  \ 设备的配置——这只能从配置模式完成。\n\n要从特权 EXEC 模式返回到用户 EXEC 模式，请使用 **disable** 命令：\n\n\n```\n\
  IOS# disable\nIOS>\n```\n\n再一次，通过检查提示，你可以知道你现在处于用户 EXEC 模式。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_310_0.png)\n\
  \n**考试提示** 对于 Cisco CCT 认证考试，要了解 IOS 中的三种不同模式——user EXEC、privileged EXEC 和配置模式，以及在每种模式下可以执行的操作。还要知道你使用\
  \ **enable** 命令从 user EXEC 模式进入 privileged EXEC 模式，使用 **disable** 命令从 privileged\
  \ EXEC 模式返回 user EXEC 模式，并使用 **exit** 命令从这两种模式中的任何一种注销 IOS 设备。\n\n图 7-1 显示了如何在不同模式之间导航的摘要。一旦进入全局配置模式，你就可以导航到多个子配置模式（我添加了三个作为示例）。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_311_0.png)\n\n图 7-1 导航 Cisco 配置模式\n\n\
  ## 从设备注销\n\n你可以从用户 EXEC 模式或特权 EXEC 模式使用 logout 或 exit 命令注销你的 Cisco 设备：\n\n```\n\
  IOS# logout\n-or-\nIOS# exit\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_311_1.png)\n\
  \nVIDEO 7.01. 本书附带的数字资源包含有关导航配置模式的多媒体演示。\n\n## IOS 基础\n\n接下来的几节描述了内置于 CLI 中的一些功能，这些功能将使你的配置和管理任务更轻松。这些功能包括如何缩写命令、如何调出命令及其特定参数的详细帮助，以及如何解读命令输出、召回命令和编辑命令。\n\
  \n## 命令缩写和补全\n\nIOS 的 CLI 使你能够将命令和参数缩写为其最独特的字符。此功能对于打字有困难的人很有用。例如，当你想从用户 EXEC 模式进入特权\
  \ EXEC 模式时，你可以输入 **en** 而不是 **enable**，如下所示：\n\n```\nIOS> en\nIOS#\n```\n\nCisco\
  \ 设备在内部为你补全命令。但是，你输入的字符必须使命令唯一。例如，你不能仅为 **enable** 输入字母 e，因为还有其他以字母 e 开头的命令，例如 **exit**。\n\
  \n## 上下文相关帮助\n\nIOS 的更强大的功能之一是上下文相关帮助。上下文相关帮助在 IOS 内的所有模式中都受支持，包括用户 EXEC、特权 EXEC\
  \ 和配置模式。你可以以多种方式使用此功能。如果不确定需要执行什么命令，在提示符下输入 **help** 或 **?**。然后 Cisco 设备会显示在你当前所在级别可执行的命令列表，以及每个命令的简要描述。以下是路由器\
  \ CLI 在用户 EXEC 模式下的示例：\n\n```\nRouter> ?\nExec commands:\n  access-enable    Create\
  \ a temporary Access-List entry\n  cd               Change current device\n  clear\
  \            Reset functions\n  .\n  .\n  .\n-- More --\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_313_0.png)\n\
  \n**考试提示** 对于考试，请记住你可以使用 help 命令或 **?** 调出上下文相关帮助。还请记住，你可以将命令缩写为其最独特的字符。\n\n如果你在屏幕底部看到\
  \ -- More --，这表示有比当前屏幕能容纳的更多的帮助信息。在 Cisco 设备上，如果你按下空格键，IOS 会翻页到下一屏帮助信息；如果你按下回车键，帮助信息会一次滚动一行。任何其他按键都会退出帮助文本。\n\
  \n为了获得更详细的帮助，你可以在命令或参数后跟一个空格和 **?**。这会导致 CLI 列出该命令包含的可用选项或参数。例如，你可以输入 **erase**\
  \ 后跟一个空格和 **?** 来查看 **erase** 命令可用的所有参数：\n\n```\nRouter# erase ?\n  /all       \
  \     Erase all files(in NVRAM)\n  flash:          Filesystem to be erased\n  nvram:\
  \          Filesystem to be erased\n  pram:           Filesystem to be erased\n\
  \  slot0:          Filesystem to be erased\n  slot1:          Filesystem to be erased\n\
  \  startup-config  Erase contents of configuration memory\nRouter# erase\n```\n\n\
  在此示例中，你可以看到 **erase** 命令后至少需要的第一个参数。请注意，根据你输入的下一个参数，可能会在第一个参数之后出现其他参数。\n\n如果你不确定如何拼写命令，可以输入前几个字符并立即跟上\
  \ **?**。例如，输入 **e?** 会列出当前模式下以 *e* 开头的所有命令：\n\n```\nRouter# e?\nenable  erase  exit\n\
  Router# e\n```\n\n此示例显示在特权 EXEC 模式下有三个命令以字母 *e* 开头。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_314_0.png)\n\
  \n**VIDEO 7.02.** 本书附带的数字资源包含有关在 IOS 中使用帮助的多媒体演示。\n\n## 错误消息\n\n输入命令时错误不可避免地会发生。如果你输入命令有误，IOS\
  \ 在尝试执行命令后会告诉你它遇到了问题。例如，此消息表示 CLI 输入错误：\n\n```\n% Invalid input detected at '^'.\n\
  ```\n\n你应该检查你输入的命令和错误消息之间的行。在此行的某处，你会看到一个 ^ 字符。IOS 使用它来指示命令行在该位置存在错误。\n\n以下是另一个\
  \ CLI 错误消息：\n\n```\n% Incomplete command.\n```\n\n此错误表示你尚未输入命令所需的所有必要参数。命令的语法是正确的，但需要更多参数。在这种情况下，你可以使用上下文相关帮助功能来帮助你找出忘记了哪些参数。\n\
  \n如果你输入的字符不足以使命令或参数唯一，你会看到类似以下内容的错误消息：\n\n```\n% Ambiguous command: \"show i\"\n\
  ```\n\n在此示例中，显然 **show** 命令的多个参数以字母 i 开头。同样，你可以使用上下文相关帮助来确定使用哪个参数：\n\n```\nRouter#\
  \ show i?\nidb  interfaces  ip  ipv6\nRouter# show i\n```\n\n如果你输入 IOS 不理解的命令，你会看到此错误消息：\n\
  \n```\n% Unknown command or computer name, or unable to find computer address\n\
  ```\n\n如果你看到此消息，请使用上下文相关帮助来确定正确的输入命令。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_315_0.png)\n\
  \n**考试提示** 在考试的模拟和 simlet 问题中，不要害怕利用上下文相关帮助功能。此功能可用于输入命令的帮助，并且在考试的路由器和交换机模拟及 simlet\
  \ 问题中可用；请使用它。\n\n## 输入命令\n\n与输入命令相关的 IOS 中包含四个关键功能：\n\n- Symbolic translation\n\
  - Command prompting\n- Syntax checking\n- Command recall\n\n每当你在 CLI 中输入命令时，命令行解析器会拆解命令，确保它是具有有效参数的有效命令。在\
  \ Cisco IOS 的情况下，如果 CLI 解析器找不到实际命令，IOS 会假设你正尝试通过该名称 telnet 到一台机器，并尝试将名称通过域名系统 (DNS)\
  \ 解析为 IP 地址。此过程称为 *符号转换*，有时会很烦人。但它确实使 telnet 到远程机器变得更容易，因为你只需输入机器的名称或 IP 地址，而无需使用\
  \ **telnet** 命令，如第 8 章所述。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_316_0.png)\n\
  \n**提示** 使用 **no ip domain-lookup** 配置模式命令禁用 IOS 设备上的 DNS 查找。这通常是我在路由器上配置的第一个命令之一。通过这样做，每当你输入无效命令时，IOS\
  \ 不会执行 DNS 查找，而是会返回无效命令消息。此命令的缺点是 IOS 设备将不再执行任何类型的 DNS 查找，但在大多数情况下这通常不是问题。\n\n你已经了解了\
  \ *命令提示* 功能——这在使用上下文相关帮助时最常见，例如以下内容：\n\n```\nRouter# show ?\n  aaa             \
  \  Show AAA values\n  aal2              Show commands for AAL2\n  access-expression\
  \ List access expression\n  access-lists      List access lists\n  accounting  \
  \      Accounting data for active sessions\n  .\n  .\n  .\nRouter# show\n```\n\n\
  在此示例中，使用上下文相关帮助与 **show** 命令后，**show** 命令在显示输出后仍保留在命令行中。IOS 假定您正在输入该命令的参数之一，因此在\
  \ CLI 上重新输入该命令。如果您忘记路由器正在执行此功能并重新输入命令，这可能会很烦人，如下所示：\n\n```\nRouter# show show\n\
  ```\n\nCLI 总是解析您的命令并使用 *语法检查* 功能检查其有效性。任何不存在的命令或输入不当的命令都会导致 IOS 生成带有适当错误描述的错误消息。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_317_0.png)\n\n**提示** 只要您正确输入命令，很少会看到\
  \ IOS 的任何输出，除非您键入的命令以某种方式改变了路由器或其组件的状态，例如接口启动或关闭。因此，您主要应在输入命令后 IOS 显示消息时感到担忧——您应假定可能存在问题。\n\
  \n当然，在配置 IOS 设备时，您有时会输入错误或输入无效命令。如果您输入了一个 20 个参数的命令并且在最后一个字符上犯了错误，Cisco 要求您重新输入完整命令将是残忍的。*命令召回*\
  \ 功能非常有用，因为它使您能够召回和编辑先前执行的命令。接下来两个部分将讨论如何召回和编辑之前的（或当前）命令。\n\n## 命令行历史\n\n在任何 IOS\
  \ 设备上，您可以使用 **show history** 命令查看之前输入的命令：\n\n```\nIOS# show history\n  enable\n\
  \  show interface\n  show version\n  show history\nIOS#\n```\n\n默认情况下，IOS 设备存储您执行的最后\
  \ 10 条命令。您可以通过按 CTRL-P 或向上箭头键来召回这些命令。如果您不小心越过了想要编辑或重新执行的命令，请按 CTRL-N 或向下箭头键。\n\n\
  您可以使用 **terminal history size** 命令将历史记录缓冲区的大小从 10 条命令增加到 256 条：\n\n```\nIOS# terminal\
  \ history size #_of_commands\n```\n\n## 编辑命令行\n\n表 7-1 显示了您可用于在命令行上编辑信息的控制或命令序列。\n\
  \n| 控制序列 | 描述 |\n|---|---|\n| CTRL-A | 将光标移动到行首 |\n| CTRL-E | 将光标移动到行尾 |\n| ESC-B\
  \ | 每次向后移动一个单词的光标 |\n| ESC-F | 每次向前移动一个单词的光标 |\n| CTRL-B or LEFT ARROW | 每次向后移动一个字符的光标\
  \ |\n| CTRL-F or RIGHT ARROW | 每次向前移动一个字符的光标 |\n| CTRL-P or UP ARROW | 召回上一个命令 |\n\
  | CTRL-N or DOWN ARROW | 召回最近执行的命令 |\n| CTRL-D | 删除光标下的字符 |\n| BACKSPACE | 删除光标前的字符\
  \ |\n| CTRL-R | 重新显示当前行 |\n| CTRL-U | 完全擦除该行 |\n| CTRL-W | 擦除光标下的单词 |\n| CTRL-Z\
  \ | 将您从配置模式返回到特权 EXEC 模式 |\n| TAB | 在您输入字符并按 TAB 后，IOS 设备会补全该词，前提是您输入的字符足以使命令或参数唯一\
  \ |\n| $ | 在命令行开头，这表示 $ 右侧还有更多字符 |\n\n表 7-1 IOS 设备的编辑控制序列\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_319_0.png)\n\
  \n**考试提示** 请记住用于在 CLI 中编辑命令的基本编辑控制序列。默认情况下，IOS 存储最后 10 条执行的命令。您可以使用 TAB 键自动补全命令。\n\
  \n## IOS 功能示例\n\n此示例使用 **clock** 命令来说明 IOS 命令行功能的实用性。该命令用于在路由器上设置当前日期和时间。例如，假设英语不是您的母语，并且您不确定如何拼写\
  \ *clock*，但您知道它以字母 *c* 和 *l* 开头。以下是示例：\n\n```\nIOS# cl?\nclear      clock\nIOS#\
  \ cl\n```\n\n请注意此示例输出中的两点。首先，两个命令以 **cl** 开头：**clear** 和 **clock**。其次，请注意帮助输出后的\
  \ CLI —IOS 将 **cl** 保留在命令行上。一些管理员喜欢此功能，一些则讨厌它。我属于后者，因为我经常忘记 IOS 设备正在执行此操作，并且我从头开始输入，如下所示：\n\
  \n```\nIOS# clclock\nTranslating \"clclock\"\n% Unknown command or computer name,\
  \ or unable to find computer address\nIOS#\n```\n\n如果您已经猜到了，这是一个无效命令。\n\n现在您知道如何拼写\
  \ *clock*，如果您不知道在 **clock** 命令后输入什么参数，可以使用上下文相关帮助：\n\n```\nIOS# clock ?\n  set \
  \ Set the time and date\nIOS# clock\n```\n\n第一列是参数的名称，第二列是其描述。在这种情况下，IOS 需要单词 *set*：\n\
  \n```\nIOS# clock set ?\n  hh:mm:ss  Current Time\nIOS# clock set\n```\n\n下一个参数需要当前时间。这基于\
  \ UTC（除非您更改了设备的时区）并且采用 24 小时格式。例如，下午 3 点为 15:00:00。再次使用上下文相关帮助来确定是否需要更多参数：\n\n```\n\
  IOS# clock set 15:00:00 ?\n  <1-31>  Day of the month\n  MONTH  Month of the year\n\
  IOS# clock set 15:00:00\n```\n\n每当您在尖括号内看到数字范围时，必须在此范围内选择一个值。如果您看到全大写的参数，例如 MONTH，则必须提供名称。在此时钟示例中，IOS\
  \ 需要日期的数字或月份的名称，例如 May——对于此命令，路由器并不在意这两个参数的输入顺序，但许多情况下顺序很重要。再次使用上下文相关帮助，在月份名称后指定年份的数字：\n\
  \n```\nIOS# clock set 15:00:00 23 May ?\n  <1993-2035>  Year\nIOS# clock set 15:00:00\
  \ 23 May\n```\n\n再次使用上下文相关帮助查看接下来是什么：\n\n```\nIOS# clock set 15:00:00 23 May 2004\
  \ ?\n  <cr>\nIOS# clock set 15:00:00 23 May 2004\nIOS#\n```\n\n<cr> 表示您可以按 ENTER\
  \ 键，IOS 设备将接受该命令。在 IOS 路由器上，使用 show clock 命令查看当前时间和日期：\n\n```\nIOS# show clock\n\
  15:00:02.187 UTC Fri May 23 2003\nIOS#\n```\n\n## 基本 IOS 配置\n\n在这里，您将学习访问 IOS 软件和在\
  \ IOS 设备上创建简单配置的基础知识。许多配置命令在 Cisco 路由器和交换机上是相同的，简化了这些设备的基本设置；然而，正如您在后续章节中将看到的，某些功能特定于每种产品类型，因此每种产品都有独特的配置命令。\n\
  \n## 访问配置模式\n\nIOS 中的所有系统/操作更改必须在配置模式下进行。要访问此模式，您必须首先处于特权 EXEC 模式并使用以下命令：\n\n```\n\
  IOS# configure terminal\nIOS(config)#\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_322_0.png)\n\
  \n考试提示 在准备考试时，请注意哪些命令直接从全局配置模式配置。\n\n请注意，提示符已从 # 更改为 (config)#，表示模式已更改。此模式通常称为配置模式或全局配置模式。您可以将\
  \ configure terminal 缩写为 conf t。在配置模式下，您可以执行更改路由器或交换机配置的命令；然而，您无法在此模式下实际查看更改，因为这是在特权\
  \ EXEC 模式下完成的。要退出配置模式并返回特权 EXEC 模式，请键入 end 或按 CTRL-Z。\n\n## 设备标识\n\n您的首要任务之一是更改\
  \ IOS 设备的名称。此名称仅具有本地意义，并用于管理目的。例如，Cisco Discovery Protocol（CDP）使用设备名称。（CDP\n\n在第\
  \ 8 章中进行了讨论。）在路由器和交换机上，您使用 **hostname** 命令来更改设备的名称。以下是将名称 *Router* 更改为名称 *Perimeter*\
  \ 的简单示例：\n\n```\nRouter(config)# hostname Perimeter\nPerimeter(config)#\n```\n\n\
  首先，注意设备的新的名称（*Perimeter*）放在 **hostname** 命令之后。一旦按下 ENTER，新的 CLI 提示符会立即更改——它包含设备的新的名称。\n\
  \n要撤消更改或否定 Cisco 设备上的命令，您可以在命令前加上 **no** 参数。例如，要将主机名改回出厂默认值，请使用以下命令：\n\n```\nPerimeter(config)#\
  \ no hostname Perimeter\nRouter(config)#\n```\n\n在某些情况下，否定命令时不必包含命令的参数。在前面的示例中，您可以轻松输入\
  \ **no hostname** 来完成更改，但在其他情况下，您必须输入 **no** 并跟上整个配置命令。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_323_0.png)\n\
  \n**EXAM TIP** 对于 Cisco CCT 认证，请记住 **hostname** 命令为 IOS 设备分配一个本地有意义的标识符。在某些考试模拟问题中，您可能需要在配置中配置主机名。在考试中，名称区分大小写！\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_323_1.png)\n\nVIDEO 7.03. 本书附带的数字资源包含在\
  \ Cisco 设备上配置主机名的多媒体演示。\n\n## 子配置模式\n\nIOS 设备上的某些配置命令会进入特定的子配置模式，通常称为 *subcommand\
  \ mode*。表 7-2 显示了您在 IOS 设备上可能会看到的几个子配置模式。\n\n| IOS Prompt | Subconfiguration Mode\
  \ |\n|---|---|\n| (config-if)# | 接口子配置模式 |\n| (config-subif)# | 子接口子配置模式 |\n| (config-line)#\
  \ | 线路子配置模式 |\n| (config-controller)# | 控制器子配置模式 |\n| (config-router)# | IP 路由协议子配置模式\
  \ |\n\nTable 7-2 Subconfiguration Modes on IOS Devices\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_324_0.png)\n\
  \n**NOTE** 并非所有子配置模式都受所有 IOS 设备支持。当您在子配置模式下工作时，您输入的命令仅影响路由器或交换机的特定组件。\n\n要离开子配置模式并返回到全局配置模式，请使用\
  \ **exit** 命令。使用 **end** 命令或按 CTRL-Z 始终会带您返回特权 EXEC 模式，无论您当前正在哪个配置模式下工作。以下是从子配置模式到全局配置模式的示例：\n\
  \n```\nIOS(config)# line con 0\nIOS(config-line)# exit\nIOS(config)#\n```\n\n在许多情况下，当您在子配置模式下工作并输入全局配置模式命令时，IOS\
  \ 会执行它并且模式会更改为全局配置模式，如下所示：\n\n```\nIOS(config)# line con 0\nIOS(config-line)# hostname\
  \ 2960\n2960(config)#\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_325_0.png)\n\
  \n**EXAM TIP** 请记住，许多全局配置模式命令会影响整个 IOS 设备，例如 hostname 命令：您只需输入一次命令，它就会影响整个设备。子配置模式命令仅影响\
  \ IOS 设备的特定组件，例如接口、线路或路由协议，仅举几例。使用 exit 命令返回一个配置级别。使用 end 命令或按 CTRL-Z 退出配置模式。\n\n\
  请注意，当在线路子配置模式下执行 hostname 命令时，交换机不仅更改了模式，还更改了其名称。有时，您会从路由器收到无效命令响应；在这种情况下，您必须先退出子配置模式，然后在全局配置中执行命令。\n\
  \n## 线路配置\n\nIOS 设备上的线路提供对 EXEC shell 的访问；有时这称为字符模式访问，因为它涉及 CLI。表 7-3 显示了受支持的线路类型。line\
  \ 命令用于在配置模式下引用线路。您必须指定要配置的线路类型以及线路号，其中线路号从 0 开始递增。请注意，控制台和辅助线路只有一个线路号：0。配置 VTY 和\
  \ TTY 时，您可以指定数字范围。执行 **line** 命令会进入子配置模式，您在其中输入的命令会影响该特定线路，或者使用 VTY 和电传终端（TTY）时可能影响多条线路。\n\
  \n| Line Type | Description | Command Nomenclature |\n|---|---|---|\n| Console |\
  \ 提供初始 CLI 访问的物理端口；当无法远程访问 IOS 设备时用于故障排除。设备上仅支持一个。 | line con 0 |\n| Auxiliary |\
  \ 通常用于拨号进入 IOS 设备的备份物理端口；并非所有设备都有辅助端口，每个设备仅支持一个。 | line aux 0 |\n| VTY | 允许通过 telnet\
  \ 和 SSH 等远程访问连接访问 CLI 的逻辑端口。IOS 设备上支持多个 VTY，数量取决于设备、型号和软件版本。 | line vty 0 4 |\n\
  | TTY | 用于连接调制解调器以进行终端服务或访问其他设备的控制台端口的物理端口。这些端口仅在路由器上找到，支持的数量取决于路由器型号和安装的异步卡。 |\
  \ line tty 0 31 |\n\nTable 7-3 IOS Line Types\n\n### 更改非活动超时\n\n默认情况下，IOS 设备在 10\
  \ 分钟不活动后会自动注销您。您可以使用 **exec-timeout** 线路子配置模式命令更改此设置：\n\n```\nIOS(config)# line\
  \ line_type line_#\nIOS(config-line)# exec-timeout minutes seconds\n```\n\n请记住，这仅更改您指定的线路（或线路）的配置——其他线路仍将使用默认空闲时间。如果您不希望特定线路超时，您可以将分钟和秒值设置为\
  \ **0**，如下所示：\n\n```\nIOS(config)# line console 0\nIOS(config-line)# exec-timeout\
  \ 0 0\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_327_0.png)\n\n**CAUTION**\
  \ 在生产环境中禁用线路的超时是不推荐的，因为它会造成安全问题。但是，出于培训目的，例如学习 CCNA 考试，这是可以的。\n\n如果您想完全禁用线路的使用，请使用以下配置：\n\
  \n```\nIOS(config)# line line_type line_#\nIOS(config-line)# no exec\n```\n\n要验证线路配置，请使用\
  \ **show line** 命令：\n\n```\nIOS# show line con 0\n  Tty Typ  Tx/Rx A Modem Roty\
  \ AccO AccI Uses Noise Overruns\n* 0 CTY       -   -    -    -    -    0    0  \
  \  0/0\n\nLine 0, Location: \"\", Type: \"\"\nLength: 24 lines, Width: 80 columns\n\
  Status: Ready, Active\nCapabilities: none\nModem state: Ready\nSpecial Chars: Escape\
  \ Hold Stop Start Disconnect Activation\n             ^^x   none  -    -      none\n\
  Timeouts: Idle EXEC Idle Session Modem Answer Session Dispatch\n          never\
  \    never                     none    not set\nSession limit is not set.\nTime\
  \ since activation: 0:04:49\nEditing is enabled.\nHistory is enabled, history size\
  \ is 10.\nFull user help is disabled\nAllowed transports are pad telnet mop.  Preferred\
  \ is telnet.\nNo output characters are padded\nNo special data dispatching characters\n\
  ```\n\n在此示例中，请注意超时值设置为 **never**。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_328_0.png)\n\
  \n**TIP** 请注意，**show** 命令不是从配置模式输入的。要在配置模式中输入用户和特权 EXEC 模式命令，请在命令前加上 **do** 字，如下所示：**do\
  \ show line con 0**。这可以避免您每次都要退出以使用 **show** 命令并查看更改的效果。节省大量时间！\n\n### 限制 VTY 协议访问\n\
  \n默认情况下，允许 VTY 的所有访问方法，包括 telnet 和 SSH（使用 telnet 和 SSH 在第 8 章中讨论）。控制 VTY 上允许的连接类型是通过\
  \ **transport input**\n\n(可用于连接到路由器的协议) 和 **transport output** (可用于从路由器连接的协议) 命令：\n\
  \n```\nIOS(config)# line vty line_# [line_#]\nIOS(config-line)# transport input\
  \ {all | telnet | ssh}\nIOS(config-line)# transport output {all | telnet | ssh}\n\
  ```\n\n默认情况下，允许所有协议。\n\n在下面的示例中，仅允许在 VTYs 上使用 SSH 协议（到路由器或从路由器）：\n\n```\nRouter(config)#\
  \ line vty 0 15\nRouter(config-line)# transport input ssh\nRouter(config-line)#\
  \ transport output ssh\n```\n\n第 8 章更深入地讨论了 telnet 和 SSH 的设置。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_329_0.png)\n\
  \n**EXAM TIP** 对于 CCNA 考试，请熟悉限制对 VTY 的协议访问。\n\n## CLI Output\n\nIOS 设备的一个不错的功能是，当某些类型的事件发生时，例如接口\
  \ down 或 up、管理员进行配置更改或 **debug** 命令的输出，IOS 设备默认会在控制台行上打印一条信息消息。但是，如果你是通过 telnet\
  \ 或 SSH 登录 IOS 设备，或通过辅助或 TTY 线路访问设备，则不会显示相同的消息。\n\n如果是这种情况，你可以通过执行特权 EXEC **terminal\
  \ monitor** 命令（如图所示）让 IOS 在你的屏幕上显示这些消息：\n\n```\nIOS# terminal monitor\n```\n\n你必须在从\
  \ VTY、TTY 或辅助线路登录 IOS 后执行此命令。但是，一旦你注销，此命令不适用于其他登录同一线路的 IOS 设备用户；每个单独的线路会话都必须重新执行此命令。\n\
  \nCLI 屏幕上显示的信息消息的一个令人烦恼的问题是，如果你在输入 IOS 命令时，设备显示消息时，会从光标所在的位置开始打印，使你难以弄清输入中断的位置。如果你记得，只需继续输入命令，或按\
  \ CTRL-C 中止命令。更好的方法是将 IOS 设置为在消息在窗口中打印后，在新的 CLI 提示符下重新显示你已输入的内容。logging synchronous\
  \ 命令实现了这一点：\n\n```\nIOS(config)# line line_type line_#\nIOS(config-line)# logging\
  \ synchronous\n```\n\n请注意，此命令在线路子配置模式下执行。如果你想实现此功能，你需要在所有将用于访问 IOS 设备的线路下设置它，包括你的\
  \ VTY 和控制台端口。你也可以按 CTRL-R 刷新屏幕。\n\n## Interface Configuration\n\nCisco CCT 认证考试要求你了解如何配置以太网接口和串行接口，以及如何排查接口的第\
  \ 1 层和第 2 层问题。在本节中，你将学习如何在以太网和串行接口上配置常见设置，例如启用和禁用接口，以及配置速度和双工设置。本章后面你将学习用于排查接口第\
  \ 1 层和第 2 层问题的 show 命令。\n\n要配置接口，你必须首先进入接口子配置模式：\n\n```\nIOS(config)# interface\
  \ type [slot_#/]port_#\nIOS(config-if)#\n```\n\n你必须为 interface 命令指定两个组成部分：类型和位置。当你输入完整的\
  \ interface 命令时，请注意\n\n提示符会发生变化，表示你已进入指定接口的接口子配置模式——**(config-if)#** 在此示例中。\n\n\
  ![](img/0eafdcebe219ef3756f0e57bcf1eb997_331_0.png)\n\n**TIP** 你无法通过检查提示符来确定正在操作的接口。如果你不确定，请使用命令召回功能召回\
  \ **interface** 命令并重新执行它。\n\n指定接口时，你可以使用以下任何命名法：\n\n```\nIOS(config)# interface\
  \ GigabitEthernet 0/1\nIOS(config)# interface GigabitEthernet0/1\nIOS(config)# int\
  \ g 0/1\nIOS(config)# int g0/1\nIOS(config)# int gig 0/1\nIOS(config)# int gig0/1\n\
  ```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_331_1.png)\n\n**NOTE** 你可以用空格分隔类型和位置，或将两者连接在一起。同样，你也可以缩写命令和参数。\n\
  \n## Assign IP Address\n\n导航到接口后，你可以执行多个命令来修改接口的特性。例如，在 Cisco 路由器上，你可能希望使用以下命令为接口分配\
  \ IP 地址：\n\n```\nIOS>enable\nIOS#config term\nEnter configuration commands, one\
  \ per line. End with CNTL/Z.\nIOS(config)#interface G0/0\nIOS(config-if)#ip address\
  \ 14.0.0.1 255.0.0.0\n```\n\n在此示例中，我首先导航到要配置的千兆以太网接口，然后为接口分配 IP 地址和子网掩码。\n\n你也可以使用以下命令将接口配置为动态\
  \ IP 地址（从 DHCP 服务器接收 IP 地址）：\n\n```\nIOS(config-if)#ip address dhcp\n```\n\n## Enable\
  \ and Disable the Interface\n\n在 Catalyst 交换机上，接口默认启用；在 Cisco 路由器上，接口默认禁用。你可以在接口子配置提示符下使用\
  \ shutdown 命令禁用接口：\n\n```\nIOS(config)# interface type slot_#/port_#\nIOS(config-if)#\
  \ shutdown\n```\n\n要启用接口，请使用 no shutdown 命令。通常在为接口分配 IP 地址后，我会养成启用接口的习惯。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_332_0.png)\n\
  \nEXAM TIP 对于 Cisco CCT 和 CCNA 考试，请记住 IOS 交换机接口默认启用，但路由器接口默认禁用。还请记住如何在 IOS 设备上启用和禁用接口：no\
  \ shutdown 和 shutdown。\n\n无论何时接口状态发生变化，IOS 都会在屏幕上打印一条消息告知你。以下是一个路由器上接口被激活的示例\n\n\
  ：\n\n```\nIOS(config)# interface gigabitethernet0/1\nIOS(config-if)# no shutdown\n\
  1w0d: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up\n1w0d: %LINEPROTO-5-UPDOWN:\
  \ Line protocol on Interface\n    GigabitEthernet0/1, changed state to up\nIOS(config-if)#\n\
  ```\n\n在此示例中，第一条信息行表示物理层已激活。第二条信息行表示数据链路层协议已启用，在本例中为以太网——对于 WAN 端口，第 2 层协议为高级数据链路控制\
  \ (HDLC) 或点对点协议 (PPP)。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_333_0.png)\n\n\
  NOTE 当将配置文件复制并粘贴到路由器中，并且路由器接口已通过 shutdown 命令禁用时，粘贴的配置文件必须包含 no shutdown 命令才能激活接口。当从旧路由器复制并粘贴配置文件到新路由器时，这是一个常见问题，新路由器的接口默认禁用。\n\
  \n## Description\n\n你可以使用 description 命令为任何接口添加描述：\n\n```\nIOS(config)# interface\
  \ type [slot_#/]port_#\nIOS(config-if)# description interface_description\n```\n\
  \ndescription 命令提供接口所连接设备的单行描述，或你想要分配的任何描述。此描述会出现在本章后面讨论的 show interfaces 命令的输出中。\n\
  \n## Speed and Duplexing for Ethernet Interfaces\n\n要设置基于以太网的接口的速度和双工速度，请使用以下配置：\n\
  \n```\nIOS(config)# interface ethernet_type [slot_#]/port_#\nIOS(config-if)# speed\
  \ 10|100|1000|auto\nIOS(config-if)# duplex full|half|auto\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_334_0.png)\n\
  \n**NOTE** 对于 10/100/1000 以太网端口，不再建议使用 **speed** 和 **duplex** 命令硬编码速度和双工；相反，让接口从直接连接的设备自动感知这些设置。更改速度和双工设置的命令用于在自动协商无法工作且需要强制速度或双工设置时进行故障排除。\n\
  \n需要注意的是，如果你错误地设置了双工设置或速度，这可能会导致通信问题。这就是更改 **duplex** 和 **speed** 设置的原因之一；如果它们最初设置不正确，你可能需要更改它们以匹配网络环境。\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_334_1.png)\n\n**VIDEO 7.04.** 本书附带的数字资源包含在路由器上配置千兆接口的多媒体演示。\n\
  \n## Serial Interfaces on Routers\n\n\n\n配置串行接口时情况会有些不同，因为你不仅需要配置 IP 地址，还必须指定要使用的第二层协议。首先让我们使用以下命令为串行接口分配\
  \ IP 地址和描述：\n\n```\nIOS(config)#interface s0/3/0\nIOS(config-if)#ip address 13.0.0.2\
  \ 255.0.0.0\nIOS(config-if)#description LINK-TO-ISP\n```\n\n为串行接口分配 IP 地址后，您可以选择要用于在串行链路上承载流量的第二层协议。在局域网中，第二层协议是\
  \ Ethernet，但在我们的串行线路上不使用它。我们需要在将数据发送到串行端口之前指定要将 IP 数据包封装在其中的第二层帧类型。\n\n在 Cisco 路由器上使用两种主要的串行链路协议：\n\
  \n- **HDLC** 该协议是 Cisco 专有协议，用于在串行链路上发送数据。HDLC 的优点在于它无需配置，如果未指定，则为默认封装协议。\n- **PPP**\
  \ 该行业标准协议受许多不同厂商和产品支持，如果网络中同时存在 Cisco 设备和非 Cisco 设备，则应使用它。\n\n在本讨论中，我们将选择使用 HDLC\
  \ 作为封装协议。请记住，如果您想查看串行接口支持哪些封装协议，始终可以使用 **help** 命令：\n\n```\nIOS(config-if)#encapsulation\
  \ ?\n  hdlc          Serial HDLC synchronous\n  ppp           Point-to-Point protocol\n\
  IOS(config-if)#encapsulation hdlc\n```\n\n如果您想配置串行接口使用 PPP 作为封装协议，则应使用以下命令。\n\n\
  ```\nIOS(config-if)#encapsulation ppp\n```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_336_0.png)\n\
  \n注意 为了使串行接口正常运行，您必须在链路的两端配置相同的封装协议。\n\nPPP 的好处之一是可以配置身份验证——这意味着为了通过串行链路发送数据，其他路由器必须知道串行链路上的密码。要使用\
  \ PPP 配置身份验证：\n\n- 在每台路由器上设置主机名。\n- 在每台路由器上创建与另一台路由器名称匹配的用户名和密码。\n- 使用 PAP 或 CHAP\
  \ 身份验证协议启用身份验证。由于 PAP 以明文发送用户名和密码，因此更推荐使用 CHAP。\n\n以下是每个步骤的命令：\n\n```\nVAN-R1#config\
  \ term\n\nVAN-R1(config)#username LA-R1 password wanpass\n\nVAN-R1(config)#interface\
  \ s0/3/0\n\nVAN-R1(config-if)#encapsulation ppp\n\nVAN-R1(config-if)#ppp authentication\
  \ chap\n```\n\n查看前面的代码，您可以看到我正在为 VAN-R1 路由器配置 LA-R1 路由器的用户名。然后我启用 PPP 封装协议，最后将 PPP\
  \ 身份验证协议配置为 CHAP。然后您将以类似方式配置 LA-R1 路由器。\n\n现在我们已经在串行接口上配置了 IP 地址和封装协议，接下来需要做的就是确保接口接收到链路的时钟速度或定时。设置时钟速度是数据通信设备（DCE）的责任。当将路由器连接到\
  \ ISP 时，ISP 是链路的 DCE 端，因此 ISP 设置链路的时钟速度。在 ISP 示例中，您的路由器是数据终端设备（DTE），因此您不允许设置链路的时钟速度。\n\
  \n如果 ISP 设置了它，为什么我要提到这一点呢？好吧，如果您使用背靠背串行电缆通过串行端口将两台路由器连接在一起，电缆的一端通常标记为“DCE”，另一端标记为“DTE”。在具有电缆\
  \ DCE 端的路由器上，您需要使用以下命令设置时钟速率：\n\n```\nIOS(config-if)#clock rate 64000\n```\n\n如果您在配置\
  \ DTE 设备时尝试执行 **clock rate** 命令，您将收到一条消息，指出该命令仅在 DCE 设备上执行。尝试一下也没关系。\n\n在串行接口上配置的最后一个命令是通过使用\
  \ **no shutdown** 命令启用接口（无论您是 DCE 还是 DTE 设备）：\n\n```\nIOS(config-if)#no shutdown\n\
  ```\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_337_0.png)\n\n**视频 7.05。** 本书附带的数字资源包含有关在路由器上配置串行接口的多媒体演示。\n\
  \n如果您不确定哪台路由器具有电缆的 DTE 端，哪台具有 DCE 端，可以使用 **show controllers** 命令来确定：\n\n```\nRouter>\
  \ show controllers serial [slot_#]/port_#\n```\n\n这是在少数几个命令中，您不能将类型和端口号连接在一起——您必须用空格分隔。以下是此命令的使用示例：\n\
  \n```\nRouter> show controllers serial 0/3/0\nHD unit 0, idb = 0x121C04, driver\
  \ structure at 0x127078\nbuffer size 1524 HD unit 0, DTE V.35 serial cable attached\n\
  .\n.\n```\n\n请注意，此示例的第二行包含两条重要信息：连接类型（DTE）和电缆类型（V.35）。\n\n以下是连接到 DCE 电缆末端的接口的示例：\n\
  \n```\nRouter> show controllers serial 0/3/0\nHD unit 0, idb = 0x1BA16C, driver\
  \ structure at 0x1C04E0\nbuffer size 1524  HD unit 0, V.35 DCE cable, clockrate\
  \ 64000\n.\n.\n```\n\n在此示例中，时钟已配置：64,000 bps。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_338_0.png)\n\
  \n**考试提示** 对于考试，请记住您可以使用 show controllers 命令来确定 DTE 和 DCE 连接，并使用 clock rate 命令为\
  \ DCE 连接配置速度。\n\n## 练习 7-1：基本路由器配置\n\n在本练习中，您需要两台 Cisco 路由器和两台 Cisco 交换机，或能够创建包含两台路由器和两台交换机的拓扑图的网络模拟器。图\
  \ 7-2 显示了本示例中您将配置的网络。本练习侧重于配置\n\n两台路由器；我们将在交换章节中重点关注交换机。\n\n- 1. 确保所有物理组件（如路由器和交换机）已按照图\
  \ 7-2 连接，然后打开电源。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_339_0.png)\n\n图 7-2\
  \ 练习网络拓扑\n\n- 2. 将工作站连接到将成为 VAN-R1 的路由器的控制台端口。然后启动 PuTTY，选择串行连接，设置正确的 COM 端口，然后选择打开。\n\
  - 3. 在 PuTTY 窗口中按 ENTER 以在 Cisco 设备上获取提示符。\n- 4. 使用以下命令将 Cisco 路由器的名称设置为 VAN-R1：\n\
  \n```\nRouter>enable\nRouter#config term\nRouter(config)#hostname VAN-R1\n```\n\n\
  - 5. 使用以下命令配置千兆以太网 0/0 接口的 IP 地址：\n\n```\nVAN-R1(config)#interface g0/0\nVAN-R1(config-if)#ip\
  \ address 12.0.0.1 255.0.0.0\nVAN-R1(config-if)#no shutdown\n```\n\n请注意，g0/0 接口状态变为\
  \ up（未处于 up and running 状态）。\n\n- 6. 使用以下命令配置路由器上的串行 0/3/0 接口：\n\n```\nVAN-R1(config-if)#interface\
  \ s0/3/0\nVAN-R1(config-if)#ip address 13.0.0.1 255.0.0.0\nVAN-R1(config-if)#encapsulation\
  \ hdlc\nVAN-R1(config-if)#clock rate 64000\nVAN-R1(config-if)#no shutdown\n```\n\
  \n请注意，即使已完全配置，串行接口状态消息仍指示其处于 down 状态。这是因为在链路启动之前，必须先配置串行链路的另一端（LA-R1 路由器）。\n\n-\
  \ 7. 请务必记住，您必须通过输入以下命令将这些更改保存到 NVRAM：\n\n```\nVAN-R1(config-if)#exit\nVAN-R1(config)#exit\n\
  VAN-R1#copy running-config startup-config\nDestination filename [startup-config]?\n\
  Building configuration...\n[OK]\n```\n\n- 8. 连接到将成为 LA-R1 的路由器的控制台端口，然后在 PuTTY 屏幕中按\
  \ ENTER 刷新屏幕。现在您应该已连接到第二台路由器。\n- 9. 将第二台路由器的主机名设置为 LA-R1。\n- 10. 将千兆以太网 0/0 接口的\
  \ IP 地址配置为 14.0.0.1 并确保接口已启用。\n- 11. 为路由器上的串行 0/3/0 接口配置 IP 地址 13.0.0.2 并设置封装协议；请注意，如果此\n\
  \n连接的 DTE 端，您无需设置时钟速率。\n\n12. 将新的更改保存到 NVRAM。\n\n13. 要验证 LA-R1 是否可以 ping 通 VAN-R1\
  \ 的 IP 地址，请键入以下命令：\n\n```\nLA-R1#ping 13.0.0.1\nType escape sequence to abort.\n\
  Sending 5, 100-byte ICMP Echos to 13.0.0.1, timeout is 2 seconds:\n!!!!!\nSuccess\
  \ rate is 100 percent (5/5), round-trip min/avg/max = 1/1/2 ms\n```\n\n14. 在 LA-R1\
  \ 上，使用以下命令查看您的配置（花几分钟时间查看每个命令的输出）：\n\n```\nLA-R1#show interfaces\nLA-R1#show interfaces\
  \ g0/0\nLA-R1#show ip interface brief\n```\n\n15. 在 VAN-R1 上，使用以下命令查看您的配置（花几分钟时间查看每个命令的输出）：\n\
  \n```\nVAN-R1#show interfaces\nVAN-R1#show interfaces g0/0\nVAN-R1#show ip interface\
  \ brief\n```\n\n16. 将路由器保持运行状态以供下一个练习使用。\n\n## 基本 IOS 安全配置\n\n计算机安全研究所（CSI）是一个提供网络安全基础教育和培训的组织。它定期对公司进行安全问题的市场研究。在一项研究中，超过\
  \ 70% 的受访公司报告经历了某种安全漏洞。了解这些信息，作为网络管理员，您的一项职责将是确保对网络设备的访问得到严格控制。以下各节将介绍如何保护您的 IOS\
  \ 设备。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_342_0.png)\n\n**注意** 本章介绍的信息仅包括您将在\
  \ IOS 设备上设置的少数安全功能；本书中讨论了更多这些功能，例如第 9 章中交换机的端口安全和第 17 章中的访问控制列表（ACL），仅举几例。\n\n##\
  \ 物理和环境威胁\n\n许多网络管理员忘记了，保护网络设备安全的首要防线包括防范物理和环境威胁，包括以下内容：\n\n- **硬件** 通过物理措施限制对路由器的物理访问，例如锁门、门禁卡、摄像机等\n\
  - **电气** 确保设备免受浪涌/尖峰、欠压和断电的保护\n- **环境** 保护设备免受过冷或过热的温度，或过高湿度的影响\n- **维护** 确保在处理敏感电子部件时遵循静电放电程序，为关键部件备有备件，并正确标记设备和电缆\n\
  \n对这些问题的深入讨论超出了本书的范围；它们在思科的 CCNA 和 CCNP Security 课程中得到了更深入的介绍。\n\n## 密码\n\n限制对 IOS\
  \ 设备物理访问的最常见方法是使用某种用户身份验证。例如，您可以配置密码来限制对 IOS 设备线路（用户 EXEC 模式）的访问以及对特权 EXEC 模式的访问。在\
  \ Catalyst IOS 交换机（如 2950 和 2960）上配置密码与在 IOS 路由器上配置密码相同。以下各节讨论在 IOS 设备上配置密码。\n\n\
  ## 用户 EXEC 密码保护\n\n控制对 IOS 设备用户 EXEC 模式的访问是按线路进行的：控制台、辅助、TTY 和 VTY。请记住，并非所有设备都支持辅助端口，只有路由器支持\
  \ TTY，并且 IOS 设备支持的 VTY 数量取决于产品，从五个 VTY（0–4）到近一千个不等。\n\n要保护控制台端口，您必须首先使用 line console\
  \ 0 命令进入控制台的线路子配置模式以配置线路密码：\n\n```\nIOS(config)# line console 0\nIOS(config-line)#\
  \ password console_password\nIOS(config-line)# login\n```\n\n第一个命令中的 0 指定控制台端口。线路和接口从\
  \ 0 开始编号。即使 IOS 设备只有一个控制台端口，它也被指定为 0（这适用于大多数，但不是全部思科产品）。接下来，注意第二行的提示已更改。一旦进入线路子配置模式，您可以使用\
  \ password 命令为控制台分配密码。最后的 login 命令是必需的，表示您希望思科设备强制人们使用该密码进行身份验证，如果他们连接到控制台 0 端口。IOS\
  \ 设备上的密码区分大小写。请记住，当在 line console 0 下执行 password 命令时，它仅为尝试从控制台端口访问 IOS 设备的用户设置用户\
  \ EXEC 密码。\n\n辅助端口通常用作带有调制解调器连接的远程访问端口，这使您可以在 Internet 连接出现问题且无法通过 telnet 或 SSH\
  \ 远程连接时拨号进入路由器。以下代码显示了在辅助端口上设置密码身份验证的语法：\n\n```\nRouter(config)# line aux 0\nRouter(config-line)#\
  \ password aux_password\nRouter(config-line)# login\n```\n\n再次，**login** 命令是必需的；如果您忘记它，您将在端口上设置了密码，但不会要求思科设备在有人连接到该端口时提示输入该密码。\n\
  \n要为您的 VTY 设置 telnet 密码，请使用以下配置：\n\n```\nIOS(config)# line vty 0 15\nIOS(config-line)#\
  \ password telnet_password\nIOS(config-line)# login\n```\n\n此命令中的 **vty** 参数指的是\
  \ *虚拟终端*，即 telnet 或 SSH 访问的专业名称。思科设备支持多个同时的 VTY（telnet）会话，其中每个连接在内部由一个数字跟踪：0–15。根据路由器型号和\
  \ IOS 软件版本，该数字可能从 5（0–4）到近 1000 不等。您可以为每个 VTY 分配不同的密码，但这样在 telnet 到 IOS 设备时您就不知道使用哪个密码。但是，IOS\
  \ 允许您使用 **line** 命令指定多个 VTY 端口，从而简化配置，如前述配置所示：**line vty 0 15**。您需要在同一行上指定开始和结束的\
  \ VTY 编号。\n\n一旦进入线路子配置模式，请使用 **password** 命令设置密码。您还需要在这些端口上输入 **login** 命令以强制身份验证，本质上是告诉设备如果有人尝试通过\
  \ telnet 连接，则提示输入密码。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_344_0.png)\n\n\
  **考试提示** 请记住，在 CCNA 考试中，如果您 telnet 到思科设备，并看到消息“Password required but none set”，则表示您尚未使用\
  \ **password** 命令在该线路上配置密码，直到您配置一个密码之前将无法登录。请记住，您应该使用密码和登录过程保护您的 VTY。另一种保护 VTY 端口的安全选项是应用\
  \ ACL。ACL 在第 17 章中讨论。\n\n如果您在配置 VTY 时仅指定一个数字，例如以下内容，则您仅配置该 VTY：\n\n```\nIOS(config)#\
  \ line vty 0\nIOS(config-line)# password cisco123\nIOS(config-line)# login\n```\n\
  \n在此示例中，仅为 VTY 0 线路分配了密码，并且通过要求某人登录到该端口来强制身份验证。如果这是您在出厂默认的 IOS 设备上为 VTY 配置的唯一项目，则只有一个人可以通过\
  \ VTY 0 使用 telnet 或 SSH 远程访问 IOS 设备。\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_345_0.png)\n\
  \nVIDEO 7.06. 随本书附带的数字资源包含有关在您的线路端口上配置密码的多媒体演示。\n\n## 创建用户名和密码\n\n还有其他验证访问的方法，例如本地用户名数据库或外部身份验证服务器。路由器上的本地用户名数据库使您能够指定用户名和密码以限制对\
  \ IOS 设备线路的访问。使用用户名和密码比仅在线路上使用密码更推荐：这种方法的优点是每个用户可以拥有自己的密码而不是共享密码，从而提供更大的问责制。以下命令说明了本地用户名数据库的设置及其在\
  \ VTY 上的使用：\n\n```\nIOS(config)# username name {secret | password} password\nIOS(config)#\
  \ line vty 0 15\nIOS(config-line)# login local\n```\n\n\n\nThe **username** command\
  \ specifies the name and password for the user. The main difference between the\
  \ **secret** and **password** parameters is that the **secret** parameter tells\
  \ IOS to encrypt the password with an MD5 hash, and the **password** parameter doesn’t\
  \ (the password is stored in clear text). This is true of the line subconfiguration\
  \ mode **password** command: it also is stored in clear text.\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_346_0.png)\n\
  \n**注意** The **login local** command can be used on any of the lines on Cisco device\
  \ to tell the device to perform authentication using the local username and password\
  \ database. You can use this on console, auxiliary, and VTY ports to force the Cisco\
  \ device to require a username *和* password when someone connects.\n\n## 特权 EXEC\
  \ 密码保护\n\nAlong with protecting access to the lines on an IOS device, you can also\
  \ control access to privileged EXEC mode by assigning a password to it. Two configuration\
  \ options are shown here:\n\n```\nSwitch(config)# enable password Privilege_EXEC_password\n\
  ```\n\nor\n\n```\nSwitch(config)# enable secret Privilege_EXEC_password\n```\n\n\
  Both of these commands configure the privileged EXEC password. The main difference\
  \ between the two, as with the **username** command, is that the **secret** parameter\
  \ encrypts the privileged EXEC password and the **password** parameter doesn’t.\
  \ If you configure both of these commands, the password configured with the **enable\
  \ secret** command always takes precedence over the password configured with the\
  \ **enable password** command. The **enable password** command is still supported\
  \ by Cisco for backward-compatibility purposes.\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_347_0.png)\n\
  \n**考试提示** For the exam, you’ll need to remember that without user EXEC *和* privileged\
  \ EXEC authentication (passwords), you will not be able to access IOS device remotely\
  \ via telnet or SSH, by default.\n\n## 密码加密\n\nPasswords that are not encrypted\
  \ can be encrypted by using the **service password-encryption** Global Configuration\
  \ mode command. However, the **enable secret** command’s encryption is *非常* stronger\
  \ than using the **service password-encryption** command to do the encryption.\n\
  \n![](img/0eafdcebe219ef3756f0e57bcf1eb997_347_1.png)\n\n**考试提示** Remember for the\
  \ CCT and CCNA exam that you use the **enable password** or **enable secret** command\
  \ to secure privileged EXEC access. Remember that the **enable secret** command\
  \ creates an encrypted secret value that takes precedence over the password if both\
  \ are configured. With VTY access, you should also configure a password on the VTY\
  \ ports and you must also specify the **login** command to have the device prompt\
  \ for the password. Use the **service password-encryption** command to encrypt all\
  \ clear-text passwords within your configuration: this includes the **password**\
  \ command for the VTYs and other lines, the **enable password** command, and other\
  \ commands that have a clear-text password.\n\n## 练习 7-2：配置密码\n\nIn this exercise\
  \ you will continue with the configuration of the previous exercise and add passwords\
  \ to the two routers. You will configure a console password, an auxiliary password\
  \ (if you have an aux port), and VTY port passwords. See Figure 7-3.\n\n![](img/0eafdcebe219ef3756f0e57bcf1eb997_348_0.png)\n\
  \n图 7-3 练习的网络拓扑\n\n- 1. 确保您已通过控制台连接到 VAN-R1。\n- 2. 要在 VAN-R1 上配置控制台密码 conpass，请输入以下命令：\n\
  - 3. 要在 VAN-R1 上配置 aux 密码 auxpass，请输入以下命令：\n\n```\nVAN-R1>enable\nVAN-R1#config\
  \ term\nVAN-R1(config)#line con 0\nVAN-R1(config-line)#password conpass\nVAN-R1(config-line)#login\n\
  ```\n\n```\nVAN-R1(config-line)#line aux 0\nVAN-R1(config-line)#password auxpass\n\
  VAN-R1(config-line)#login\n```\n\n4. 通过配置 VTY 端口来配置 telnet 密码 telnetpass，请输入以下命令：\n\
  \n```\nVAN-R1(config-line)#line vty 0 4\nVAN-R1(config-line)#password telnetpass\n\

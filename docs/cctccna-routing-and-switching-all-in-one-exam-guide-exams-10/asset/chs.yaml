  \ use type 1\n```\n\n但是，如果两台 OSPF 路由器上的密码（密钥）不匹配，您会看到类似如下的输出：\n\n```\nOSPF: Rcv\
  \ pkt from 192.168.1.1, Serial1/0 :\nMismatch Authentication Key - Clear Text\n\
  ```\n\n## debug ip ospf events 命令\n\n如果要查看路由器上的 OSPF 事件，请使用 **debug ip ospf events**\

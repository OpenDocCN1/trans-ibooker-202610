  \n基于性能的问题是你在思科考试中会遇到的交互式问题，你必须将对象从屏幕的一个区域拖到另一个区域。以下基于本章内容提供的示例基于性能的问题。\n\n1. 从展品左侧的地址画一条线，并将其连接到以下展品右侧的匹配地址类型。\n\
  \n**左侧地址：**\n- 127.0.0.1\n- 200.45.67.100\n- 169.254.65.78\n- 172.28.35.10\n- 100.95.87.23\n\
  \n**右侧地址类型：**\n- 一个 APIPA 地址\n- 一个私有地址\n- 环回地址\n- A 类地址\n- C 类地址\n\n2. 使用左侧的端口号，将正确的端口号写入显示相关协议的适当框中。在真正的考试中，你会将端口号拖放到适当的框中。\n\
  \n**端口号：**\n- TCP 22\n- TCP 3389\n- TCP 23\n- TCP 80\n- UDP 53\n- TCP 21\n\n**协议：**\n\
  - DNS\n- SSH\n- HTTP\n- Telnet\n- FTP\n- RDP\n\n## 答案\n\n1. D. 在排查 TCP/IP 通信问题时，如果你注意到系统使用的是\
  \ 169.254.x.y 的 IP 地址，你可以假设与 DHCP 服务器的通信存在问题。以 169.254.x.y 开头的地址是 APIPA 地址，当找不到\
  \ DHCP 服务器时会自动配置。\n\n2. **B.** IP 地址，特别是本章讨论的 IPv4 地址，是一个 32 位地址。\n\n3. **C.** C\
  \ 类地址始终将地址的前 3 位设置为 110。这给出二进制值 **110**00000 到 **110**11111，换算成十进制为 192 到 223。\n\
  \n4. **C.** 子网掩码 255.255.255.0 表示前三个八位组是网络 ID 的一部分，最后一个八位组是地址的主机 ID 部分。\n\n5. **B.**\
  \ 因为子网掩码是 255.255.0.0，任何使用相同前两个八位组的系统都在同一网络上。IP 地址的网络 ID 为 134.67.*x.y*。\n\n6. **B.**\
  \ B 类网络支持 65,534 个主机，因为最后两个八位组是主机 ID，每个八位组支持 256 个可能值。256 × 256 = 65,536——但不要忘记有\
  \ 2 个地址不可用（保留用于网络 ID 和广播地址）。\n\n7. **C.** C 类网络的默认子网掩码是 255.255.255.0；前三个八位组表示网络\
  \ ID，最后一个八位组是主机 ID。\n\n8. **D.** 环回地址通常被称为 127.0.0.1 地址，但它可以是任何以 127.*x.y.z* 开头的地址。\n\
  \n9. **C.** HTTP 使用的端口是 80 端口。\n\n10. **A, C.** 10.0.0.34 和 172.16.7.99 是属于私有 IP\
  \ 地址范围的地址示例，这些地址在互联网上不可路由。\n\n11. **B.** 端口 25 用于 SMTP 在 TCP/IP 网络上发送电子邮件。\n\n12.\
  \ **B.** 171.103.2.30 是一个 B 类地址，因此它的子网掩码为 255.255.0.0。\n\n13. **C.** DHCP 负责自动分配\
  \ IP 地址给系统，这样网络管理员就不必手动执行这项工作。\n\n## 基于性能的答案\n\n1. 以下展品将地址与其正确的地址类型对应。\n\n127.0.0.1\n\

  **100BaseT** 一种使用 CAT 5 双绞线以 100 Mbps 速率传输的以太网架构，也称为快速以太网。每个段的最大距离为 100 米。


  **1000BaseT** 一种使用 CAT 5e 双绞线以 1000 Mbps 速率传输的以太网架构，也称为千兆以太网。每个段的最大距离为 100 米。


  **802.1Q** 这种 IEEE 干线标准支持两种类型的帧：带标记帧和不带标记帧。不带标记帧不携带任何 VLAN 识别信息——基本上，这是一个标准以太网帧。802.1Q
  标记会修改原始以太网帧。一个名为标记字段的 4 字节字段被插入到原始以太网帧头的中间，并且原始帧的 FCS（校验和）会根据此更改重新计算。执行标记是为了帮助其他连接的交换机将帧保留在源
  VLAN 中。


  **802.2** IEEE 已将 OSI 参考模型的数据链路层分为两个组件：介质访问控制 (MAC) 和逻辑链路控制 (LLC)。LLC 在软件中执行，在 802.2
  中定义，负责识别封装的上层协议。LLC 有两种实现：服务访问点 (SAP) 和子网络访问协议 (SNAP)。MAC 在硬件中执行。不同类型 MAC 的示例包括
  802.3 以太网和 802.5 令牌环网。


  **802.3** 此 IEEE 标准定义了以太网的实现方式。它负责定义用于在两个网络接口卡 (NIC) 之间传输信息的帧格式。帧标准化了帧中的字段及其长度，以便每个设备都了解如何读取帧的内容。802.3
  具有长度字段，而 Ethernet II 具有类型字段。802.2 LLC 帧在从以太网接口发送之前会被封装在 802.3 帧中。


  **AAA (认证、授权和计费)** 一种身份验证服务，使用户能够登录，控制谁可以登录，并跟踪系统的使用情况。


  **访问控制列表 (ACL)** 以其在流量进入或离开接口时过滤流量的能力而闻名，ACL 还可用于其他目的，包括：限制对路由器的 Telnet（虚拟类型终端 [VTY]）访问、过滤路由信息、通过排队优先处理广域网流量、使用按需拨号路由
  (DDR) 触发电话呼叫，以及更改路由的管理距离。ACL 是一组语句。Cisco IOS 自上而下处理 ACL：一旦数据包的内容匹配条件，就会执行操作（允许或拒绝）。如果未找到匹配项，则会应用隐式拒绝规则。


  **接入层** Cisco 三层分层模型的底层。接入层位于校园网络的边缘，通过分发层与核心层分隔。接入层的主要功能是为用户提供到网络的初始连接。通常，此连接由交换机提供。


  **访问链路连接** 到设备的此连接具有标准以太网 NIC，仅能理解标准以太网帧——换句话说，是能够理解 IEEE 802.3 和/或 Ethernet II
  帧的普通 NIC。访问链路连接只能与一个 VLAN 关联。它有时也称为访问端口。


  **访问方法** 这些是管理各种设备使用物理网络的规则。访问方法决定了数据如何在线路上提交。访问方法的两个示例是令牌传递和带有碰撞检测的载波侦听多路访问 (CSMA/CD)。


  **接入点** 又称无线接入点；无线客户端通过接入点连接到有线网络。


  **访问速率** 您的路由器与中继交换机（例如 T1）之间物理连接的速度。


  **帐户** 网络上存储有关网络访问信息的位置。它包含使用户能够使用网络的信息，包括用户名和登录规范、密码以及对目录和资源的权限。


  **帐户锁定** 一项功能，在一定数量的不成功登录尝试后锁定帐户（三次错误尝试是常见选择）。通常，锁定的帐户在管理员解锁前无法再使用。这有助于防止黑客入侵帐户。


  **确认 (ACK)** 从接收计算机发送到发送计算机的信息包，用于验证传输是否已接收。传输不成功会生成否定确认 (NACK)。


  **适配器** 插入系统以提供功能的卡，例如网络适配器，它提供网络连接。


  **地址重载** 请参见端口地址转换 (PAT)。


  **地址解析协议 (ARP)** 一种 Internet 层协议，帮助 TCP/IP 设备查找同一广播域中的其他设备。ARP 使用本地广播来发现相邻设备。基本上，ARP
  将目标的第 3 层 IP 地址解析为目标的第 2 层 MAC 地址。


  **管理距离** 一种 Cisco 专有机制，用于对 IP 路由协议进行排序。如果路由器正在从两个不同的路由协议（例如开放最短路径优先 (OSPF) 和增强内部网关路由协议

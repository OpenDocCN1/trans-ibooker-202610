  VAN-R1(config)#enable password enablepass\n```\n\n6. 创建 enable secret 为 enablesecret：\n\
  \n```\nVAN-R1(config)#enable secret enablesecret\nVAN-R1(config)#exit\nVAN-R1#\n\

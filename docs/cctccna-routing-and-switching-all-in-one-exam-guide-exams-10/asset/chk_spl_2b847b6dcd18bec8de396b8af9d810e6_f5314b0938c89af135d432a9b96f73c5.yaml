- 'no': 2970
  overturn_probability: 0.08
  alternative: 正文中的一级部分标题（非全书最高层级章节）
  counter_evidence:
  - 该标题缺少“第 X 章”显式编号，仅以“# 子网划分和 VLSM”呈现，语义上可能是某部分下的子标题而非全书最高层级章。
  - 正文后续大量使用“##”作为子标题（如“## 计算网络 ID”），若“#”为章标题则层级合理，但也可能说明其只是前一章或部分中的一级小标题，排版层级并不明确指向独立章节。
  - 该行前为大量协议/端口列表（DNS、UDP 53 等），看起来更像是上一章附录或参考表格的结尾，该标题可能只是新增内容模块的起始而非独立章节。
  keep_split: true
- 'no': 3975
  overturn_probability: 0.12
  alternative: 正文中的一级部分标题或未编号章节节标题
  counter_evidence:
  - 无显式“第 X 章”编号，仅为“# Cisco 设备基础”，语义上可理解为“设备基础”这一节，而非独立章节。
  - 该标题下直接出现“### 使用 Cisco 设备和软件”（行3987），出现了从“#”直接跳到“###”的情况，暗示“#”可能并非最高层级章标题，排版层级混乱。
  - 标题后列出的“查看 Cisco 硬件和软件”等 bullet points 更像是章节学习目标，但本身不足以将其与“节”区分开。
  keep_split: true
- 'no': 4981
  overturn_probability: 0.08
  alternative: 正文中的一级小标题或部分标题
  counter_evidence:
  - 标题缺少显式章序号（如“第 7 章”），仅以“# Cisco IOS 基础”形式出现，可能是某部分或前一章下的小节标题。
  - 正文中大量使用“##”作为子标题（如“## 命令行界面”），若该行为章标题则层级清晰，但也可能只是某大章下的一个主要部分，因排版需求被提升为一级标题。
  - 该行紧接第6章习题与答案之后，可能被误认为是第6章的结尾部分，而非新章开头。
  keep_split: true

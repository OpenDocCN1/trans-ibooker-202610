  \n### 工作原理...\n\n应用是 Power BI 服务中的一种内容类型，允许在单一位置共享和访问多个仪表板、报表和工作簿。每个工作区仅限一个应用；虽然应用可以包含指向工作区外部内容的链接，但这些链接不会作为应用的一部分发挥作用，而只是将用户带到外部仪表板、报表或网页地址。\n\
  \n即使存在这些限制，当设计者不希望向业务用户授予整个工作区的权限时，应用在同时共享多个内容项方面仍具有优势。业务用户只需一个链接即可访问应用中的所有内容，从而从中受益。\n\
  \n### 更多内容...\n\n应用发布后可以修改。在工作区中，单击右上角原先**发布应用**按钮所在位置的**更新应用**按钮即可完成修改。配置应用的选项卡与发布时相同，只是**权限**选项卡现在包含**链接**区域：\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_571_0.png)\n\n图 12.36：应用“权限”选项卡上的“链接”区域\n\
  \n所有三个选项卡上的应用设置都可以编辑，完成后，只需单击右下角最初**发布应用**按钮所在位置的**更新应用**按钮即可。\n\n## 部署和分发 Power\
  \ BI 内容\n\n应用也可以取消发布。同样，在工作区中通过使用省略号 (...) 然后选择**取消发布应用**即可完成。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_572_0.png)\n\
  \n如你所见，应用提供了一种灵活向用户分发内容的方法。\n\n### 另请参阅\n\n- - 什么是 Power BI 应用？：https://bit.ly/3fMYsI5\n\
  - - 在 Power BI 中发布应用：https://bit.ly/39NW12S\n\n## 将报表发布到公共 Internet\n\nPower BI\
  \ 服务中的**发布到 Web**功能允许通过将报表嵌入网站、博客文章以及共享 URL 链接的方式，向公众共享 Power BI 报表。如果启用了**发布到 Web**\
  \ 租户设置，并且用户对报表具有编辑权限，则可以生成嵌入代码，其中包含用于嵌入报表的 HTML 代码和报表的 URL。报表的所有页面，包括任何受支持的自定义视觉对象以及筛选、交叉突出显示等标准交互功能，均可供报表消费者使用。此外，报表会自动更新以反映源数据集的刷新情况，并且可以管理嵌入代码，必要时还可选择删除，以通过嵌入代码和\
  \ URL 消除对报表的访问。\n\n本指南介绍了使用**发布到 Web**功能的基本步骤和注意事项。\n\n### 准备工作\n\n要准备本指南，请执行以下步骤：\n\
  \n- 1. 在 Power BI 服务中，单击右上角的齿轮图标，然后选择**管理门户**。\n\n### 操作步骤...\n\n要实现本指南，请执行以下步骤：\n\
  \n- 1. 在 Power BI 服务中创建工作区，用于承载**发布到 Web**报表。\n- 2. 为工作区指定一个描述性名称，使其与**发布到 Web**内容或公开可用的数据相关联。\n\
  - 3. 允许成员编辑内容，并且只添加需要内容编辑权限的个人用户。\n- 4. 新建一个 Power BI Desktop 文件，作为**发布到 Web**报表的数据集。\n\
  - 5. 开发必要的数据连接、查询、模型关系和度量值，以支持报表。\n- 6. 保存文件，并将其发布到之前创建的应用工作区。\n- 7. 打开一个新的 Power\
  \ BI Desktop 文件，作为**发布到 Web**报表。\n- 8. 单击**获取数据**，通过 Power BI 数据集连接器连接到已发布的数据集。\n\
  - 9. 开发报表，包括所有视觉对象、布局和格式选项，以及页面大小（16:9 或 4:3）。\n- 10. 为文件命名、保存，并单击**发布**。报表将发布到源数据集所在的工作区。\n\
  - 11. 在 Power BI 服务中访问该工作区。\n- 12. 在“管理网关”门户中，将新的本地数据源添加到本地数据网关。\n- 13. 打开数据集的设置，分配网关（如果适用），并配置计划刷新。\n\
  - 14. 打开报表，依次单击“文件”、“嵌入报表”，然后选择**发布到 Web（公共）**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_575_0.png)\n\
  \n图 12.39：Power BI 服务中报表的“发布到 Web”选项\n\n- 15. 单击**创建嵌入代码**，然后**发布**。\n- 16. 显示一个**成功！**对话框，允许你复制报表的嵌入代码。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_575_1.png)\n\n图 12.40：成功发布到 Web\n\n现在，你可以共享**发布到\
  \ Web** URL，或将 HTML 代码用于自己的网站。\n\n### 工作原理...\n\n对于**发布到 Web**，技术上来讲并不需要单独的工作区，但建议进行这种隔离，以便于管理并降低发布机密或专有信息的风险。同样，Premium\
  \ 容量也不是必需的，但对于较大的数据集，或者当更频繁的数据刷新和一致的性能很重要时，Premium 容量可能比较合适。\n\n所提供的 HTML 代码可以手动编辑，以改善报表在嵌入目标位置上的适配效果。将高度尺寸增加\
  \ 56 像素可以调整底部栏的大小。要获得完美适配，可能需要在 Power BI Desktop 中设置页面大小、设置 Power BI 服务中的查看模式（右上角报表页眉中的**视图**图标），并手动调整\
  \ iFrame 的高度和宽度值。\n\n根据*图 12.39*，Power BI 报表也可以嵌入 SharePoint Online。单击**SharePoint\
  \ Online**会提供一个 URL，该 URL 可用于 SharePoint Online 中的 Power BI Web 部件。访问 SharePoint\
  \ Online 页面的用户还必须具有在 Power BI 服务中访问该报表的权限。\n\nPower BI 会缓存报表定义以及用户查看报表时所需的查询结果。由于存在缓存，报表定义的更改或数据集刷新的影响大约需要一个小时才能反映在用户所查看的报表版本中。\n\
  \n### 更多内容...\n\n所有**发布到 Web**及其他嵌入代码都可以由创建嵌入代码的工作区的成员进行管理。此外，管理员可以在集中位置管理所有工作区的所有嵌入代码。要了解具体操作，请执行以下步骤：\n\
  \n- 1. 在 Power BI 服务中，打开创建**发布到 Web**嵌入代码的工作区。\n- 2. 单击右上角的齿轮图标，并选择**管理嵌入代码**。\n\
  - 3. 将显示为该工作区创建的所有嵌入代码，可以使用省略号（**...**）检索或删除这些代码。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_576_0.png)\n\

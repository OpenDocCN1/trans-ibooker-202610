  \n18. 完成后，单击**保存**按钮。\n\n19. 单击**我的流**，然后**运行**工作流。\n\n20. 单击**流运行页面**链接并等待流完成，以监视流。\n\
  \n21. 打开一个新的 Power BI Desktop 文件。\n\n22. 单击**获取数据**，然后选择 **Power BI 数据集**。\n\n23.\
  \ 选择 **Customer Survey Responses** 数据集，并单击**创建按钮**。\n\n24. 创建一个对数据集中的行进行计数的简单视觉对象。\n\
  \n在生产场景中，需要修改此方案，使 Power Automate 流的每次运行不会重复 Power BI 数据集中已有的行。\n\n## 工作原理...\n\n\
  在 Power BI 服务中为流式数据集启用历史数据分析后，创建的数据集既是流式数据集，也是推送数据集。作为推送数据集，会在 Power BI 服务中为该数据集创建数据库和表，从而允许基于此表创建\
  \ Power BI 报表视觉对象和功能。如果未启用历史数据分析（默认情况），则数据集仅为流式数据集。Power BI 会临时缓存数据，但没有底层数据库，因此可视化这些数据的唯一方法是通过实时流式仪表板磁贴。\n\
  \nPower Automate 流在概念上类似于 **SQL Server 集成服务 (SSIS)** 包的控制流界面。可以通过分支条件、作用域和循环结构向\
  \ Power Automate 工作流添加复杂逻辑。Power Automate 专为自助服务场景和业务高级用户设计。Power Automate 利用 Azure\
  \ Logic Apps，这是一项基于云的集成服务，更面向开发人员和企业集成场景。\n\n流的运行历史记录（包括成功和失败的执行）可通过单击 Power Automate\
  \ 网站**我的流**区域中的流名称来查看。此外，特定于给定流的**我的流**页面允许添加所有者、查看连接、编辑流和关闭流。\n\n## 更多内容...\n\n\

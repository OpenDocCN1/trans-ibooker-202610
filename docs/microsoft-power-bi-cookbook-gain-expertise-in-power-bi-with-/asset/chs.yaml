  },\n            {\"Product Category\", \"ProductCategoryKey\"}\n        )\nin\n\
  \    Category\n```\n\n- 15. 将 **Internet Sales** 查询移动到 **事实** 查询组，并将 **Dates** 和\
  \ **Products** 查询移动到 **维度** 查询组。\n- 16. 在 **其他查询** 组中，创建一个名为 **Calculations** 的空白查询。\n\
  - 17. 在 **主页** 选项卡的功能区中选择 **关闭并应用**。\n- 18. 切换到 **模型** 视图，并在 **Dates** 表中的 **DateKey**\
  \ 列与 **Internet Sales** 表中的 **OrderDateKey** 列之间创建关系。\n- 19. 在 **Products** 表和 **Internet\
  \ Sales** 表的 **ProductKey** 列之间创建关系。\n- 20. 保存你的工作。\n\n## 如何使用 R 和 Python 视觉对象\n\
  \n要实现本节内容，请使用以下步骤：\n\n- 1. 在 **Calculations** 表中创建以下度量：\n  **Internet Gross Sales\
  \ = SUM('Internet Sales'[SalesAmount])**\n  \n  **Internet Sales Discounts = SUM('Internet\
  \ Sales'[DiscountAmount])**\n  \n  **Internet Net Sales = [Internet Gross Sales]\
  \ - [Internet Sales Discounts]**\n- 2. 在 **报表** 视图中，使用 **筛选器** 窗格为 **Dates** 表中的\
  \ **CalendarYear** 列添加筛选器，并仅选择 **2013**\n- 3. 从 **可视化** 窗格添加一个 R 脚本视觉对象，并将 **Products**\
  \ 表中的 **ProductKey** 和 **ListPrice** 列、**Dates** 表中的 **CalendarYear** 列以及 **Internet\
  \ Net Sales** 度量添加到 **值** 字段井中\n- 4. 在 R 脚本编辑器中输入以下 R 脚本，并单击 **运行脚本** 图标：\n- 5.\
  \ 在同一页面上复制并粘贴该 R 脚本视觉对象\n\n```\npar(bg = \"#E6E6E6\")\nhist(dataset$'ListPrice',\
  \ breaks = seq(from=0, to = 2500, by = 500), col = \"#2C95FF\",\nmain = \"Current\
  \ Year Online Sales List Price Distribution\", cex.main = 1.75, cex.axis = 1.2,\
  \ cex.lab = 1.4, ylab = \"Count of Products\", xlab = \"Product List Price Bins\"\
  , las = 1, labels = TRUE, border = \"black\", ylim=c(0,50))\n```\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_449_0.png)\n\
  \n图 9.37：通过基础绘图系统在 Power BI 中呈现的 R 脚本视觉对象\n\n- 6. 选择粘贴的 R 脚本视觉对象，并将代码更改为以下内容：\n\n\
  ```\nprices <- as.numeric(as.character(dataset$'ListPrice'))\nbreakpoints <- seq(from=0,\
  \ to = 2500, by = 500)\nlibrary(\"ggplot2\")\nggplot(dataset, aes(x = prices)) +\
  \ geom_histogram(breaks = breakpoints, fill = \"#2C95FF\", color = \"black\") +\
  \ xlab(\"Product List Price Bins\") + ylab(\"Count of Products\") + ggtitle(\"Current\

  - 向表或矩阵添加超链接（URL）：http://bit.ly/39dxJ3r\n- 在报表的表或矩阵中显示图像：http://bit.ly/2Pkx1dE\n\
  - 在 Power BI Desktop 中按列排序：http://bit.ly/2pFXhgh\n- Chelsie Eiden 的 Duration 文章：http://bit.ly/31KFUtf\n\
  - 自定义格式字符串：http://bit.ly/3sj648B\n- 在 Power BI Desktop 中使用自定义格式字符串：http://bit.ly/3cXAW8o\n\
  \n## 隐藏列和表\n\n数据模型必须平衡功能、范围与可用性之间的相互冲突的需求。随着为了满足各种分析需求而添加更多的表、列、度量值和其他结构，模型很快就会让最终用户感到困惑。因此，尽量减少列和表的可见性以提供直观的界面非常重要。\n\
  \n在本方案中，我们演示如何对报表使用者隐藏列，甚至隐藏整个表。\n\n### 准备工作\n\n要准备本方案，请执行以下步骤：\n\n1. 打开 Power BI\
  \ Desktop。\n2. 创建一个名为 AdWorksDW 的导入模式数据源查询。该查询应类似于以下内容：\n\n```\nlet\n    Source\
  \ = Sql.Database(\"localhost\\\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\")\nin\n\
  \    Source\n```\n\n3. 将此查询隔离到名为 **Data Sources** 的查询组中，并禁用加载。\n4. 右键单击 AdWorksDW\
  \ 并选择**引用**（Reference）。\n5. 选择 **FactInternetSales** 表，并将此查询命名为 **Internet Sales**。\n\
  6. 重复步骤 4 和 5，创建一个导入 **DimDepartmentGroup** 的 **Departments** 查询和一个导入 **DimAccount**\
  \ 的 **Accounts** 查询。\n7. 使用以下代码，基于 **DimProduct**、**DimProductCategory** 和 **DimProductSubcategory**\
  \ 表创建一个 **Products** 查询。也可以使用本章先前方案*实施数据模型*中的 SQL 视图来获取产品。\n\n```\nlet\n    Source\
  \ = AdWorksDW,\n    Navigation = Source{[Schema=\"dbo\", Item=\"DimProduct\"]}[Data],\n\
  \    Subcategory =\n        Table.ExpandRecordColumn(\n            Navigation, \"\
  DimProductSubcategory\",\n            {\"EnglishProductSubcategoryName\", \"DimProductCategory\"\
  },\n            {\"Product Subcategory\", \"DimProductCategory\"}\n        ),\n\
  \    Category =\n        Table.ExpandRecordColumn(\n            Subcategory, \"\
  DimProductCategory\",\n            {\"EnglishProductCategoryName\"}, {\"Product\
  \ Category\"}\n        ),\n    RemoveColumns =\n        Table.SelectColumns(\n \
  \           Category,\n            {\"ProductKey\", \"EnglishProductName\", \"DaysToManufacture\"\
  ,\n             \"Product Subcategory\", \"Product Category\"}\n        )\nin\n\
  \    RemoveColumns\n```\n\n8. 将 **Internet Sales** 查询移动到一个名为 **Facts** 的查询组，并将 **Departments**、**Accounts**\
  \ 和 **Products** 查询移动到一个名为 **Dimensions** 的查询组。\n\n9. 在**开始**选项卡的功能区中单击**关闭并应用**，将表加载到数据模型。\n\
  \n10. 基于 **Products** 表和 **Internet Sales** 表的 **ProductKey** 列创建关系。\n\n11. 在 **Internet\
  \ Sales** 表中创建以下四个度量值：\n\n```\nInternet Sales = SUM('Internet Sales'[SalesAmount])\n\
  \nInternet Sales Freight = SUM('Internet Sales'[Freight])\n\nInternet Sales Order\
  \ Quantity = SUM('Internet Sales'[OrderQuantity])\n\nInternet Sales Distinct Products\
  \ =\n    COUNTROWS(DISTINCT('Internet Sales'[ProductKey]))\n```\n\n### 如何隐藏列和表\n\
  \n要实现本方案，请使用以下步骤：\n\n1. 在**数据**视图的**字段**窗格中，右键单击 **Internet Sales** 表中的某一列，然后选择**在报表视图中隐藏**。注意，**字段**窗格中该列的右侧会显示带删除线的“可见”图标。此外，这些列在数据查看区域中会变灰。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_152_0.png)\n\n图 3.20：在报表视图中隐藏\n\n2. 对\
  \ **Internet Sales** 表中的所有列（但不包括度量值）重复此过程。\n\n3. 当所有列都隐藏后，切换到**报表**视图，会看到 **Internet\
  \ Sales** 表现在显示在其他两个表的上方，不按字母顺序排列。此外，该表的图标是计算器而不是表。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_152_1.png)\n\
  \n图 3.21：报表视图字段列表中的度量值表\n\n\n\n\n简化“字段”列表的一个选项是将度量值合并到更少的主表中，并隐藏未使用的表。可以创建专用的度量组表来组织和分组相似的度量值。专用度量组是通过不返回行或引用其他源、也不需要刷新的查询创建的空表。创建专用度量组表的一种方法是创建一个名为“Calculations”之类的空白查询，然后将其加载并应用到模型中。在\
  \ Desktop 中，在此表中至少创建一个度量值，并隐藏查询自动创建的、与查询/表同名的单个列。度量值可以直接在此表中创建，也可以通过“度量工具”选项卡功能区中的“主表”属性，将现有度量值关联到模型的任意表。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_154_0.png)\n\n### 更多内容...\n\n在包含多个页面的报表中，也可以向报表阅读者隐藏页面。要隐藏页面，请右键单击“页面”选项卡并选择“隐藏页面”。这在保留开发和故障排除期间使用的页面，或使用工具提示页面时非常有用。\n\
  \n透视表本质上是模型的视图定义，这样仅将模型中定义好的表、列和度量值集合公开给给定视图。Power BI Desktop 支持透视表，但必须使用外部工具（如\
  \ Tabular Editor）创建。要了解如何创建和使用透视表，请按照以下步骤操作：\n\n1.  在“报表”视图中，从“外部工具”选项卡的功能区中选择“Tabular\
  \ Editor”。\n2.  在 Tabular Editor 中，请注意仅显示可见的表——“Departments”表缺失。您可以通过从“视图”菜单中选择“隐藏对象”来查看隐藏的对象。\n\
  3.  右键单击“Perspectives”文件夹，选择“新建透视表”，并将透视表命名为“New Perspective”。\n4.  在“Tables”文件夹中，右键单击“Internet\
  \ Sales”表，选择“在透视表中显示”，然后选择“所有透视表”。\n5.  对“Products”表重复步骤 4。\n6.  展开“Products”表，右键单击“DaysToManufacture”列，选择“在透视表中隐藏”，然后选择“New\
  \ Perspective”。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_155_0.png)\n\n*图 3.23：Tabular\
  \ Editor*\n\n7.  右键单击“Accounts”表，选择“在透视表中隐藏”，然后选择“所有透视表”。\n8.  从“文件”菜单中选择“保存”。\n\
  9.  关闭 Tabular Editor。\n10. 返回 Power BI Desktop，创建第二个页面，然后保存报表。\n11. 从“文件”菜单中选择“选项和设置”，然后选择“选项”。\n\
  12. 在“报表设置”下的“当前文件”中，打开“允许报表阅读者按需个性化视觉对象”选项。\n13. 在第二个页面的“可视化”窗格的“格式”部分，注意新的“个性化视觉对象”区域。\n\
  14. 将“报表阅读者透视表”设置为“New Perspective”。\n\n作为报表编辑者，在 Power BI Desktop 的“报表”视图中，您将继续看到模型中未隐藏的所有表和列。但是，当用户在\
  \ Power BI 服务中个性化 Page 2 上的视觉对象时，用户将看不到透视表中未包含的任何表和列。请注意，透视表在任何情况下都不应被视为安全机制。\n\n\
  ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_156_0.png)\n\n### 另请参阅\n\n-   允许用户在报表中个性化视觉对象：http://bit.ly/3cljuvm\n\
  -   在报表中个性化视觉对象：http://bit.ly/2OZX8a8\n\n## 使用 DAX 丰富模型\n\n为了推动用户采用并为支持更高级的分析奠定基础，嵌入在核心或“基础”DAX\
  \ 度量值中的逻辑必须准确反映业务定义，这一点至关重要。这些基础度量值可跨从数据模型构建的众多报表提供版本控制，并避免在报表层应用额外逻辑。应记录所需业务指标的清晰定义，并在使用这些新度量值将任何报表部署到生产环境之前，验证相应\
  \ DAX 度量值的准确性。\n\n性能、可用性和版本控制是有效数据模型的基本特征，但通常是额外的分析上下文使模型脱颖而出。一旦实现了基础度量值，就可以开发额外的\
  \ DAX 度量值来支持常见和高优先级的业务分析。这些度量值通常可以取代业务用户的临时和手动数据分析，以及 BI 组织维护的专用自定义报表。由于度量值存储在数据模型内，因此可以在各种组合和未来的项目中重用该逻辑。\n\
  \n在开发这些指标时，重要的是要确定要创建的基础度量值集、要验证的数据源以及主题专家。协调源系统定义与报表中应用的任何自定义逻辑之间的差异。请求业务组织的项目发起人审查和批准定义和验证。最后，识别与现有业务定义的任何冲突，并就实现度量值的复杂性提出建议。\n\
  \n在本节中，将创建 DAX 度量值来表示业务定义并支持更深入的分析。\n\n### 准备工作\n\n为准备本节内容，请按照以下步骤操作：\n\n1.  打开\
  \ Power BI Desktop。\n2.  创建一个名为 `AdWorksDW` 的 Import 模式数据源查询。此查询应类似于以下内容：\n\n  \
  \  ```powerquery\n    let\n        Source = Sql.Database(\"localhost\\MSSQLSERVERDEV\"\
  , \"AdventureWorksDW2019\")\n    in\n        Source\n    ```\n\n3.  将此查询隔离在名为“Data\
  \ Sources”的查询组中，并禁用加载。\n4.  右键单击 `AdWorksDW` 并选择“引用”。\n5.  选择 `FactResellerSales`\
  \ 表，并将此查询命名为“Reseller Sales”。\n6.  重复步骤 4 和 5，创建一个导入 `FactCurrencyRates` 的“Currency\
  \ Rates”查询，一个导入 `FactInternetSales` 的“Internet Sales”查询，一个导入 `DimDate` 的“Dates”查询，以及一个导入\
  \ `DimCustomer` 的“Customers”查询。\n7.  向“Currency Rates”查询添加一个从 1 开始的“索引列”，并将“CurrencyKey”列筛选为\
  \ 98。\n8.  使用以下代码，基于 `DimProduct`、`DimProductCategory` 和 `DimProductSubcategory`\
  \ 表创建一个“Products”查询。或者，使用本章先前配方“实现数据模型”中的产品 SQL 视图。\n\n    ```powerquery\n    let\n\
  \        Source = AdWorksDW,\n        Navigation = Source{[Schema=\"dbo\",Item=\"\
  DimProduct\"]}[Data],\n        Subcategory =\n            Table.ExpandRecordColumn(\n\
  \                Navigation, \"DimProductSubcategory\",\n                {\"EnglishProductSubcategoryName\"\
  , \"DimProductCategory\"},\n                {\"Product Subcategory\", \"DimProductCategory\"\
  }\n            ),\n        Category =\n            Table.ExpandRecordColumn(\n \
  \               Subcategory, \"DimProductCategory\",\n                {\"EnglishProductCategoryName\"\
  }, {\"Product Category\"}\n            )\n    in\n        Category\n    ```\n\n\
  9.  将**Reseller Sales**、**Internet Sales** 和 **Currency Rates** 查询移动到一个名为 **Facts**\
  \ 的查询组，并将 **Dates**、**Products** 和 **Customers** 查询移动到一个名为 **Dimensions** 的查询组。\n\
  10. 在 **Other Queries** 组中创建四个空白查询，分别命名为 **Reseller Measures**、**Pricing Measures**、**Customer\
  \ Measures** 和 **Currency Measures**。\n11. 单击 **Home** 选项卡功能区中的 **Close & Apply**，将表加载到数据模型中。\n\
  12. 创建 *图 3.25* 所示的关系。\n\n| 活动 | 从：表（列） | 到：表（列） |\n|---|---|---|\n| ☑ | Currency\
  \ Rates (DateKey) | Dates (DateKey) |\n| ☑ | Internet Sales (CustomerKey) | Customers\
  \ (CustomerKey) |\n| ☐ | Internet Sales (DueDateKey) | Dates (DateKey) |\n| ☑ |\
  \ Internet Sales (OrderDateKey) | Dates (DateKey) |\n| ☑ | Internet Sales (ProductKey)\
  \ | Products (ProductKey) |\n| ☐ | Internet Sales (ShipDateKey) | Dates (DateKey)\
  \ |\n| ☐ | Reseller Sales (DueDateKey) | Dates (DateKey) |\n| ☑ | Reseller Sales\
  \ (OrderDateKey) | Dates (DateKey) |\n| ☑ | Reseller Sales (ProductKey) | Products\
  \ (ProductKey) |\n| ☐ | Reseller Sales (ShipDateKey) | Dates (DateKey) |\n\n*图 3.25：模型关系*\n\
  \n13. 所有这些关系的交叉筛选方向应为**单**，除了 **Internet Sales 到 Customers** 关系，该关系应设置为**两者**。\n\
  14. 切换到**数据**视图，隐藏 **Reseller Measures**、**Pricing Measures**、**Customer Measures**\
  \ 和 **Currency Measures** 表中的单个列。\n15. 右键单击 **Dates** 表，选择**标记为日期表**，使用 **FullDateAlternateKey**\
  \ 作为**日期**列。\n\n\n\n\n\n## 如何通过DAX丰富模型\n\n要实现本方案，请按照以下步骤操作：\n\n1. 切换到 **数据** 视图。\n\
  \n2. 在 **经销商度量值** 表中创建以下八个销售和成本DAX度量值。\n\n```\nReseller Discount Amount = SUM('Reseller\
  \ Sales'[DiscountAmount])\n\nReseller Gross Sales =\n    SUMX('Reseller Sales',\n\
  \        'Reseller Sales'[UnitPrice] * 'Reseller Sales'[OrderQuantity])\n\nReseller\
  \ Net Sales =\n    CALCULATE ( [Reseller Gross Sales] - [Reseller Discount Amount],\n\
  \        'Reseller Sales'[ShipDate] <> DATEVALUE(\"12/31/2099\") )\n\nReseller Product\
  \ Cost =\n    SUMX('Reseller Sales',\n        'Reseller Sales'[OrderQuantity]*'Reseller\
  \ Sales'[ProductStandardCost])\n\nReseller Gross Margin % =\n    DIVIDE([Reseller\
  \ Gross Sales] - [Reseller Product Cost],\n        [Reseller Gross Sales])\n\nReseller\
  \ Margin % =\n    DIVIDE([Reseller Net Sales] - [Reseller Product Cost],\n     \
  \   [Reseller Net Sales])\n\nReseller Count of Products Sold =\n    CALCULATE(DISTINCTCOUNT('Products'[ProductAlternateKey]),\n\
  \        'Reseller Sales')\n\nReseller Count of Sales Orders = DISTINCTCOUNT('Reseller\
  \ Sales'[SalesOrderNumber])\n```\n\n3. 在 **定价度量值** 表中创建以下七个销售和成本DAX度量值：\n\n```\n\
  Effective Unit Price =\n    DIVIDE(SUM('Reseller Sales'[ExtendedAmount]),\n    \
  \    SUM('Reseller Sales'[OrderQuantity]) )\n\n25th Percentile Unit Price = PERCENTILE.INC('Reseller\
  \ Sales'[UnitPrice],.25)\n\n75th Percentile Unit Price = PERCENTILE.INC('Reseller\
  \ Sales'[UnitPrice],.75)\n\nMaximum Unit Price = MAX('Reseller Sales'[UnitPrice])\n\
  \nMedian Unit Price = MEDIAN('Reseller Sales'[UnitPrice])\n\nMinimum Unit Price\
  \ = MIN('Reseller Sales'[UnitPrice])\n\nRange of Unit Prices = [Maximum Unit Price]\
  \ - [Minimum Unit Price]\n```\n\n4. 在 **定价度量值** 表中创建以下三个销售和成本DAX度量值：\n\n```\nCount\
  \ of Accessory But Not Bike Customers =\nVAR BikeCustomers =\n    SUMMARIZE(\n \
  \       CALCULATETABLE('Internet Sales','Products'[Product Category] = \"Bikes\"\
  ),\n        'Customers'[CustomerAlternateKey])\nVAR AccessoryCustomers =\n    SUMMARIZE(\n\
  \        CALCULATETABLE('Internet Sales',\n            'Products'[Product Category]\
  \ = \"Accessories\"),\n        'Customers'[CustomerAlternateKey])\nRETURN\n    CALCULATE(\n\
  \        DISTINCTCOUNT('Customers'[CustomerAlternateKey]),\n        EXCEPT(AccessoryCustomers,BikeCustomers)\
  \ )\n\nCount of Bike Only Customers =\nVAR BikeCustomers =\n    SUMMARIZE(\n   \
  \     CALCULATETABLE('Internet Sales','Products'[Product Category] = \"Bikes\"),\n\
  \        'Customers'[CustomerAlternateKey]\n    )\nVAR ClothesAndAccessoryCustomers\
  \ =\n    SUMMARIZE(\n        CALCULATETABLE('Internet Sales',\n            'Products'[Product\
  \ Category] IN {\"Accessories\",\"Clothing\"}\n        ), 'Customers'[CustomerAlternateKey])\n\
  RETURN\n    CALCULATE(\n        DISTINCTCOUNT('Customers'[CustomerAlternateKey]),\n\
  \        EXCEPT(BikeCustomers,ClothesAndAccessoryCustomers) )\n\nCount of Last Year\
  \ Customers ex Current Year =\nVAR CurrentYear = 2012\nVAR LastYear = CurrentYear\
  \ - 1\nVAR LYCustomers =\n    SUMMARIZE(\n        CALCULATETABLE('Internet Sales',\n\
  \            FILTER(ALL('Dates'),'Dates'[CalendarYear] = LastYear)\n        ), 'Customers'[CustomerAlternateKey])\n\
  VAR CYCustomers =\n    SUMMARIZE(\n        CALCULATETABLE(\n            'Internet\
  \ Sales',\n            FILTER(ALL('Dates'),'Dates'[CalendarYear] = CurrentYear)\n\
  \        ), 'Customers'[CustomerAlternateKey])\nRETURN\n    CALCULATE(\n       \
  \ DISTINCTCOUNT('Customers'[CustomerAlternateKey]),\n        EXCEPT(LYCustomers,CYCustomers)\
  \ )\n```\n\n5. 在 **日期** 表中创建以下两个DAX列：\n\n```\nYearMonth = [CalendarYear]*100 + [MonthNumberOfYear]\n\
  \nYearMonthIndex =\n    COUNTROWS(\n        SUMMARIZE(FILTER('Dates',[YearMonth]\
  \ < EARLIER([YearMonth])),[YearMonth])\n    ) + 1\n```\n\n6. 在 **货币度量值** 表中创建以下十一个销售和成本DAX度量值：\n\
  \n```\nMax Daily Rate = MAX('Currency Rates'[EndOfDayRate])\n\nLast Rate =\n   \
  \ CALCULATE(DISTINCT('Currency Rates'[EndOfDayRate]),\n        LASTNONBLANK('Dates'[FullDateAlternateKey],[Max\
  \ Daily Rate]) )\n\nPrevious Daily Rate =\n    CALCULATE([Last Rate],\n        FILTER(ALL('Currency\
  \ Rates'),\n            'Currency Rates'[Index] = MAX('Currency Rates'[Index]) -\
  \ 1)\n    )\n\nPrevious Monthly Rate =\n    CALCULATE([Last Rate],\n        FILTER(ALL('Dates'),\n\
  \            'Dates'[YearMonthIndex] = MAX('Dates'[YearMonthIndex]) - 1)\n    )\n\
  \nPrevious Year Rate =\n    CALCULATE([Last Rate],\n        FILTER(ALL('Dates'),\n\
  \            'Dates'[CalendarYear] = MAX('Dates'[CalendarYear]) - 1 )\n    )\n\n\
  Daily Change % = DIVIDE([Last Rate],[Previous Daily Rate])\nMonthly Change % = DIVIDE([Last\
  \ Rate],[Previous Monthly Rate])\nYearly Change % = DIVIDE([Last Rate],[Previous\
  \ Year Rate])\nDaily Geometric Return = GEOMEANX('Currency Rates',[Daily Change\
  \ %])-1\nDaily Geometric Change = GEOMEANX('Currency Rates',[Daily Change %])-1\n\
  Yearly Geometric Change = GEOMEANX(DISTINCT('Dates'[CalendarYear]),[Yearly Change\
  \ %])-1\n```\n\n### 工作原理\n\n当数据通过数据治理委员会、主数据服务（MDS）、数据质量服务和Azure数据目录等流程和工具进行内部管理时，度量值的定义可以很简单。根据Power\
  \ BI治理与部署白皮书，Power BI项目以及所有BI项目都能从这些数据清理和信息管理工具中大大受益。本章引用的数据仓库总线矩阵以及第4章“编写Power\
  \ BI报表”中引用的利益相关者矩阵，有助于将度量值定义过程聚焦于版本控制和透明度。\n\n度量值的名称应当直观且针对业务流程具有特定性。最好遵循命名标准，以平衡名称的详细程度与文本对可视化效果的影响。在真实项目场景中，验证后可能还会创建几个额外的度量值。这些可能包括净销售额占毛销售额的百分比、每订单销售额、每订单数量和未发货销售额。这些度量值以及更高级的度量值都将利用经验证的度量值。\n\
  \n对于经销商度量值，定义了以下业务口径：\n\n- 毛销售额等于单价乘以订单数量，不应用折扣。\n- 净销售额为毛销售额减去折扣，且必须已发货。\n- 产品成本等于产品标准成本乘以订单数量。\n\
  \n源数据库中存在两个列，分别反映 **经销商毛销售额** 和 **经销商产品成本**。只有通过导入价格和数量列并在度量值内相乘，才能提高性能和内存使用效率。对于\
  \ **经销商毛销售额** 度量值，使用SUMX函数遍历第一个参数中指定的表。第二个参数中指定的计算对每一行执行，然后所有行相加。净销售额度量值从毛销售额中扣除折扣，并且只包含已发货的产品。这里假设任何未发货的销售订单都被赋予日期值12/31/2099。\n\
  \n需要反映毛销售额和净销售额（含折扣）的利润率百分比度量值。这些分别是 **经销商毛利率%** 和 **经销商利润率%** 度量值。也可以创建 **利润额**\
  \ 度量值，并替代 **利润率%** 度量值的分子。DISTINCTCOUNT可以直接用于事实表上的外键关系列和任何退化维度列，例如 **SalesOrderNumber**。始终使用带有可选第三个参数的DIVIDE函数，以避免除以零的错误。\n\
  \n销售订单和已售产品的非重复计数也是许多报表中使用的核心度量值，并被其他度量值引用。这些是 **经销商已售产品计数** 和 **经销商销售订单计数** 度量值。**经销商已售产品计数**\
  \ 度量值使用事实表筛选上下文中的产品自然键来对唯一产品进行计数。考虑到缓慢变化的维度，使用事实表上的产品键会对一个产品进行多次计数。\n\n**定价度量值**\
  \ 提供了一个支持更深入的价格趋势分析的示例。这些度量值旨在实现以下目标：\n\n- 描述价格的中心趋势和分布。\n- 考虑产品销售组合的影响，以支持有效定价与产品定价的分析。\n\
  \n**有效单价** 度量值考虑了销售数量的影响，并使用现有的销售额和数量指标。百分位数和中位数度量值 **第25百分位单价**、**第75百分位单价** 和\
  \ **单价中位数** 有助于更好地描述价格分布。MEDIAN函数返回列中值的第50百分位数。PERCENTILE.INC函数用于第25和第75百分位数。\n\n\
  \n\n\n\n| 产品类别 | CustomerKey 计数 |\n|---|---|\n| 配件 | 15114 |\n| 自行车 | 9132 |\n|\
  \ 服装 | 6852 |\n| 总计 | 18484 |\n\n图 3.27：按产品类别划分的唯一客户\n\n**配件但非自行车客户计数** 和 **仅自行车客户计数**\
  \ 指标有助于我们确定购买了服装或配件但未购买自行车的客户数量，或仅购买自行车而未购买配件的客户数量，分别。这些指标可用于 **卡片** 可视化，以显示仅自行车客户远少于仅购买服装或配件而未购买自行车的客户。此外，这些指标可用于包含\
  \ **CustomerAlternateKey** 列的 **表格** 可视化以识别单个客户；当这些指标在单个客户级别计算时，指标返回零或一，且零值默认会被从\
  \ **表格** 可视化中自动过滤。注意，你可以点击 **CustomerAlternateKey** 的 **值** 区域中的下拉箭头并选择 **显示无数据项**\
  \ 来更改此默认行为。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_165_0.png)\n\n图 3.28：指标\
  \ 配件但非自行车客户计数 和 仅自行车客户计数\n\n**配件但非自行车客户计数** 指标使用变量 (VAR) 创建虚拟表 BikeCustomers 和 AccessoryCustomers，分别存储与两个产品类别\
  \ 自行车 和 配件 相关的不同客户键。SUMMARIZE 函数对客户键值进行分组，而 EXCEPT 执行基于集合的操作。对于 **仅自行车客户计数** 指标，语法与第一个指标的结构一致，只是使用了\
  \ DAX IN 运算符将配件和服装包含在同一组客户键中。鉴于这些指标的强大功能，它们可能是销售和营销仪表板以及异常报告的候选指标；销售团队可以专注于对仅自行车客户进行交叉销售以及向非自行车客户销售自行车。\n\
  \n**去年客户排除今年客户计数** 指标演示了如何识别去年购买但今年尚未购买的客户。此指标的结构与前两个指标类似，只是使用了 CALCULATETABLE 函数来创建过滤后的表集。在配方中，CurrentYear\
  \ 变量被硬编码为 2012。在生产数据集中，这可能会改为类似 YEAR(TODAY()) 以获取当前年份或 YEAR(MAX('Dates'[Date]))\
  \ 以获取上下文中最新的年份。此指标也可用于 **卡片** 或 **表格** 可视化。\n\n**货币指标** 提供了在日、月和年粒度上计算几何平均值的示例。在\
  \ **上次汇率** 指标中，需要 LASTNONBLANK 函数来处理数据中可能没有记录汇率的天数。此指标用于计算日、月和年粒度下的前一汇率（**前一日汇率**、**前一月汇率**\
  \ 和 **前一年汇率**）。百分比变化指标 **日变化 %**、**月变化 %** 和 **年变化 %** 是几何平均值计算的源值，因此表示为正数。GEOMEANX\
  \ 函数在不同粒度上迭代表并为每一行计算 Change % 指标。几何平均值（取 N 次方根的乘积）最后针对此值列表计算。几何变化指标可用于多行卡片可视化，并指定\
  \ 10 位小数：\n\n| -0.0108542283 | -0.0011481367 | -0.0000349297 |\n| 年度几何变化 | 月度几何变...\
  \ | 日度几何变化 |\n\n图 3.29：几何平均值指标\n\n## 更多内容...\n\n许多数据模型中常见的场景是比较粒度不同的表，例如比较实际值与预算值时，实际值按日报告，而预算按月或季度分配。在这种情况下，可以创建桥接表，其中每个桥接表包含预算表粒度下的维度的唯一值。这些桥接表可以利用模型中用于加载维度表的现有\
  \ M 查询。例如，以下 M 表达式引用 **Dates** 表查询作为其源，并仅选择 **Calendar Yr-Mo** 列的唯一值。如果这是预算表的粒度，此单列表可用作桥接表。\n\
  \n```\nlet Source = Dates,\n    YearMonthColumn = Table.SelectColumns(Source,{\"\
  Calendar Yr-Mo\"}),\n    RemoveDuplicates = Table.Distinct(YearMonthColumn)\nin\
  \ RemoveDuplicates\n```\n\n或者，可以创建一个简单的 SQL 视图（'Select Distinct [Calendar Yr-Mo]\
  \ From dbo.DimDate'）来选择该列的唯一值；此视图可从新的桥接表 M 查询中访问。\n\n可以创建从桥接表到预算表的一对多关系，并进行单向交叉筛选。随后在桥接表与其对应的维度表之间创建多对一关系，并进行双向交叉筛选。一个示例最终模型可能与图\
  \ 3.30 所示相同。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_167_0.png)\n\n## 图 3.30：互联网销售与预算数据模型\n\
  \n图像中突出的两个双向关系允许对 Date 和 Product 表的筛选传播到 Internet Sales Budget 表，以及 Internet Sales\
  \ 事实表。\n\n仅剩需要一定程度代码的步骤是避免无效的筛选上下文。例如，Internet Sales 事实表当然可以按单个产品和日期进行筛选，但此粒度对 Internet\
  \ Sales Budget 表不可用，因此应返回空白值。\n\n可以创建筛选测试指标来测试筛选上下文。筛选测试用于防止对每个事实表应用不同筛选时的无效销售与预算报告。以下指标检查是否在比预算表更高的粒度上应用了筛选：\n\
  \n```\nBudget Filter Test =\n    VAR CustomerFilter = ISCROSSFILTERED(Customer)\n\
  \    VAR ProductGrain =\n        ISFILTERED('Product'[Product Class]) || ISFILTERED('Product'[Product\
  \ Color])\n    ||\n        ISFILTERED('Product'[Product Subcategory]) || ISFILTERED('Product'[Product\
  \ Name])\n    VAR DateGrain =\n```\n\n```\nISFILTERED('Date'[Calendar Yr-Wk]) ||\
  \ ISFILTERED('Date'[Date]) || ISFILTERED('Date'[Wk End Date])\nRETURN\nIF(CustomerFilter\
  \ = TRUE() || ProductGrain = TRUE() || DateGrain =TRUE(), \"Higher Grain\", \"Common\
  \ Grain\")\n```\n\nISFILTERED 和 ISCROSSFILTERED 函数基于表或列的筛选上下文返回布尔值。ISFILTERED 函数仅限于模型中的单个列，并且特定于给定列。ISCROSSFILTERED\
  \ 函数可以检查单个列或整个表。来自其他表的筛选也包含在评估中。\n\nBudget Filter Test 指标然后可用于创建预算指标和实际与预算差异指标：\n\
  \n```\nInternet Sales Budget =\n    VAR BudgetSales = sum('Internet Sales Budget'[Online\
  \ Sales Budget])\nRETURN\nIF([Budget Filter Test] = \"Common Grain\", BudgetSales,\
  \ BLANK())\n```\n\n```\nInternet Sales Actual to Budget Variance =\nIF(ISBLANK([Internet\
  \ Sales Budget]),BLANK(), [Internet Sales] - [Internet Sales Budget])\n```\n\n在此场景中，需求是仅测试共同粒度，否则返回空白。可以在\
  \ DAX 预算指标中构建分配逻辑以考虑更高粒度。一般而言，这些分配规则最好在预算流程本身或通过 ETL 工具和查询语言（如 SQL 和 M）实现。这些指标可用于可视化实际值与预算之间的差异。\n\
  \n| 产品类别 | 2017-Jan | 2017-Feb | 2017-Mar | 2017-Apr | 2017-May | 2017-Jun | 2017-Jul\
  \ |\n|---|---|---|---|---|---|---|---|\n| 配件 | ($5,524) | ($462) | $13,281 | ($3,103)\
  \ | ($16,784) | ($1,876) | $8,120 |\n| 自行车 | ($66,393) | $98,532 | ($48,389) | $271,293\
  \ | ($336,043) | $465,368 | $385,256 |\n| 服装 | ($87) | $2,131 | $2,679 | $5,333\
  \ | $266 | ($2,943) | ($5,602) |\n| 总计 | ($72,005) | $100,200 | ($32,428) | $273,523\
  \ | ($352,562) | $460,549 | $387,774 |\n\n图 3.31：按产品类别和年-月划分的互联网销售实际值与预算\n\n矩阵可视化提供了与\
  \ Excel 数据透视表类似的功能，因此是预算与实际值的不错选择。\n\n## 另请参阅\n\n- DAX 函数参考: http://bit.ly/3rrQFlt\n\
  - 治理和部署方法: http://bit.ly/1VLwdVg\n\n\n\n\n\n## 支持虚拟表关系\n\n虚拟表关系是 DAX 表达式，用于在两个表之间不存在关系时从一个表过滤另一个表。然后可以使用这两个表（以及与其相关的表）构建报表可视化，并且\
  \ DAX 度量值会像定义了正常关系一样更新。虚拟关系通常用于解决表的不同粒度问题以及利用性能分段表。\n\n尽管物理关系是性能和可管理性方面的长期首选解决方案，但在物理关系不可行时，虚拟关系提供了一个有吸引力的替代方案。在本配方中，我们提供了使用自定义性能分段表和聚合表的虚拟关系示例。\n\
  \n### 准备工作\n\n为准备本配方，请执行以下步骤：\n\n- 1. 打开 Power BI Desktop。\n- 2. 创建一个名为 **AdWorksDW**\
  \ 的导入模式数据源查询。此查询应类似于以下内容：\n\n```powerquery\nlet\n    Source = Sql.Database(\"localhost\\\
  \\MSSQLSERVERDEV\", \"AdventureWorksDW2019\")\nin\n    Source\n```\n\n- 3. 将此查询隔离到名为\
  \ **Data Sources** 的查询组中并禁用加载。\n- 4. 右键单击 AdWorksDW 并选择 **Reference**。\n- 5. 选择\
  \ **FactInternetSales** 表并将此查询命名为 **Internet Sales**。\n- 6. 重复步骤 4 和 5 以创建导入 **DimDates**\
  \ 的 **Dates** 查询。\n- 7. 使用以下代码创建 **Customers** 查询：\n\n```powerquery\nlet\n    Source\
  \ = AdWorksDW,\n    dbo_DimCustomer = Source{[Schema=\"dbo\",Item=\"DimCustomer\"\
  ]}[Data],\n    Country =\n        Table.ExpandRecordColumn(\n            dbo_DimCustomer,\
  \ \"DimGeography\",\n            {\"EnglishCountryRegionName\"}, {\"Country\"})\n\
  in\n    Country\n```\n\n- 8. 使用以下代码创建 **Products** 查询：\n\n```powerquery\nlet\n \
  \   Source = AdWorksDW,\n    Navigation = Source{[Schema=\"dbo\",Item=\"DimProduct\"\
  ]}[Data],\n    Subcategory =\n        Table.ExpandRecordColumn(\n            Navigation,\
  \ \"DimProductSubcategory\",\n            {\"EnglishProductSubcategoryName\", \"\
  DimProductCategory\"},\n            {\"Product Subcategory\", \"DimProductCategory\"\
  }\n        )\nin\n    Subcategory\n```\n\n- 9. 将 **Internet Sales** 查询移动到名为 **Facts**\
  \ 的查询组，并将 **Dates**、**Products** 和 **Customers** 查询移动到名为 **Dimensions** 的查询组。\n\
  - 10. 使用 **Enter Data** 查询在 **Other Queries** 组中创建 **GrowthTiers** 查询。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_170_0.png)\n\
  \n图 3.32：销售增长分段表，GrowthTiers\n\n- 11. 在 **Other Queries** 组中创建 **SubCatPlan** 查询并使用以下代码：\n\
  \n```powerquery\nlet\n    Source = Products,\n    Sales =\n        Table.ExpandTableColumn(\n\
  \            Source, \"FactInternetSales\",\n            {\"SalesAmount\", \"OrderDate\"\
  }, {\"SalesAmount\", \"OrderDate\"}\n        ),\n    RemoveNulls = Table.SelectRows(Sales,\
  \ each [SalesAmount] <> null),\n    Year =\n        Table.AddColumn(\n         \
  \   RemoveNulls, \"Calendar Year\", each Date.Year([OrderDate])\n        ),\n  \
  \  Month =\n        Table.AddColumn(\n            Year, \"Calendar Month\", each\
  \ Date.MonthName([OrderDate])\n        ),\n    Group =\n        Table.Group(\n \
  \           Month,\n            {\"Calendar Year\", \"Calendar Month\", \"Product\
  \ Subcategory\"},\n            {{\"SalesAmount\", each List.Sum([SalesAmount]),\
  \ type nullable number}}\n        ),\n    Index = Table.AddIndexColumn(Group, \"\
  Index\", 1, 1, Int64.Type),\n    Plan =\n        Table.AddColumn(\n            Index,\
  \ \"Plan Amt\",\n            each if Number.IsEven([Index])\n                then\
  \ 1/Number.RandomBetween(5,10) * [SalesAmount] + [SalesAmount]\n               \
  \ else (-1 * 1/Number.RandomBetween(5,10) * [SalesAmount]) + [SalesAmount]\n   \
  \     ),\n    Remove = Table.RemoveColumns(Plan,{\"SalesAmount\", \"Index\"}),\n\
  \    Currency = Table.TransformColumnTypes(Remove,{{\"Plan Amt\", Currency.Type}})\n\
  in\n    Currency\n```\n\n- 12. 在 Other Queries 组中创建名为 **Calculations** 的空白查询。\n\
  - 13. 在“开始”选项卡功能区的“关闭并应用”中单击以将表加载到数据模型。\n- 14. 创建图 3.33 中显示的单个交叉筛选关系；请注意，**GrowthTiers**\
  \ 或 **SubCatPlan** 表没有关系：\n\n| Active | From: Table (Column) | To: Table (Column)\
  \ |\n| --- | --- | --- |\n| ☑ | Internet Sales (CustomerKey) | Customers (CustomerKey)\
  \ |\n| ☐ | Internet Sales (DueDateKey) | Dates (DateKey) |\n| ☑ | Internet Sales\
  \ (OrderDateKey) | Dates (DateKey) |\n| ☑ | Internet Sales (ProductKey) | Products\
  \ (ProductKey) |\n| ☐ | Internet Sales (ShipDateKey) | Dates (DateKey) |\n\n图 3.33：模型关系\n\
  \n- 15. 切换到数据视图并隐藏 Calculations 表中的单个列。\n- 16. 在 Calculations 表中创建以下度量值：\n\n```DAX\n\
  Sales Current Year =\n    CALCULATE(SUM('Internet Sales'[SalesAmount]),\n      \
  \  FILTER(ALLEXCEPT('Internet Sales','Customers'),\n            YEAR('Internet Sales'[OrderDate])\
  \ =\n        MAX('Dates'[CalendarYear]) ) )\n```\n\n```DAX\nSales Previous Year\
  \ =\n    CALCULATE(\n        SUM('Internet Sales'[SalesAmount]),\n        FILTER(ALLEXCEPT('Internet\
  \ Sales','Customers'),\n            YEAR('Internet Sales'[OrderDate]) =\n      \
  \  MAX('Dates'[CalendarYear])-1 ) )\n```\n\n```DAX\nSales Growth =\n    DIVIDE([Sales\
  \ Current Year] - [Sales Previous Year],\n        [Sales Previous Year], BLANK()\
  \ )\n```\n\n- 17. 右键单击 Dates 表并选择使用 FullDateAlternateKey 作为日期列标记为日期表。\n\n### 如何支持虚拟表关系\n\
  \n要实现本配方，请使用以下步骤：\n\n- 1. 在 Calculations 表中创建销售增长层级度量值：\n\n```DAX\nSales Growth\
  \ Tier =\n    VAR Growth = [Sales Growth]\n    VAR Level1 =\n        CALCULATE(MIN('GrowthTiers'[Max]),\
  \ 'GrowthTiers'[GrowthTierKey] = 1)\n    VAR Level2 =\n        CALCULATE(MIN('GrowthTiers'[Max]),\
  \ 'GrowthTiers'[GrowthTierKey] = 2)\n    VAR Level3 =\n        CALCULATE(MIN('GrowthTiers'[Max]),\
  \ 'GrowthTiers'[GrowthTierKey] = 3)\n    VAR Level4 =\n        CALCULATE(MIN('GrowthTiers'[Max]),\
  \ 'GrowthTiers'[GrowthTierKey] = 4)\n    RETURN\n        SWITCH(TRUE(),\n      \
  \      ISBLANK(Growth), BLANK(),\n            Growth <= Level1, CALCULATE(DISTINCT('GrowthTiers'[Growth\
  \ Tier]),\n                'GrowthTiers'[GrowthTierKey] = 1),\n            Growth\
  \ <= Level2, CALCULATE(DISTINCT('GrowthTiers'[Growth Tier]),\n                'GrowthTiers'[GrowthTierKey]\
  \ = 2),\n            Growth <= Level3, CALCULATE(DISTINCT('GrowthTiers'[Growth Tier]),\n\
  \                'GrowthTiers'[GrowthTierKey] = 3),\n            Growth <= Level4,\
  \ CALCULATE(DISTINCT('GrowthTiers'[Growth Tier]),\n                'GrowthTiers'[GrowthTierKey]\
  \ = 4\n            ), \"Unknown\")\n```\n\n- 2. 在 **Calculations** 表中创建虚拟表关系度量值\
  \ **Customer Countries**：\n\n```DAX\nCustomer Countries =\n    CALCULATE(DISTINCTCOUNT('Customers'[Country]),\n\
  \        FILTER(ALL('Customers'[Country]),\n            [Sales Growth] > MIN('GrowthTiers'[Min])\
  \ &&\n            [Sales Growth] < MAX('GrowthTiers'[Max]) ) )\n```\n\n- 3. 创建一个使用\
  \ **Dates** 表中 **CalendarYear** 列的 **Slicer** 可视化对象。\n- 4. 创建一个 **Matrix** 可视化对象，将\
  \ **Customers** 表中的 **Country** 列用作 **Rows**，将度量值 **Sales Growth**、**Sales Current\
  \ Year**、**Sales Previous Year** 和 **Sales Growth Tier** 用作 **Values**。\n- 5. 创建一个\
  \ **Clustered column chart** 可视化对象，将 **GrowthTiers** 表中的 **Growth Tier** 列用作 **Axis**，并将\
  \ **Customer Countries** 度量值用作 **Values**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_173_0.png)\n\
  \n图 3.34：虚拟关系分段示例\n\n- 6. 保存你的工作。\n\n### 工作原理\n\n本配方的目标是将来自未连接的 GrowthTiers 表的 Growth\
  \ Tier 分段应用于数据模型的度量值。两个度量值用于形成此虚拟关系，Sales Growth Tier 和 Customer Countries。度量值根据分段表阈值和\
  \ Sales Growth 度量值应用筛选器。实际上，这些度量值通过执行的计算在数据模型中的表之间形成关系。\n\nSales Growth Tier 度量值返回指定上下文中\
  \ Sales Growth 度量值值的 Growth Tier 列的文本值。现有的 Sales Growth 度量值和四个分段阈值存储在 DAX 变量中（VAR\
  \ 语句）。SWITCH 函数将销售增长与分段阈值进行比较以分配 Growth Tier 值。将 TRUE() 提供为 SWITCH 函数的第一个参数允许按顺序（从上到下）独立评估逻辑条件。这类似于\
  \ SQL 中的 CASE 表达式。Customer Countries 度量值使用简单的 CALCULATE 语句返回按每个 Growth Tier 的 MIN\
  \ 和 MAX 限制筛选的国家/地区的 DISTINCTCOUNT。\n\nSales Growth Tier 度量值可用于分析模型的其他维度，并在不同的粒度上使用；例如，如果在\
  \ Customers 表中添加 StateProvinceName 并创建层次结构，则可以使用矩阵可视化向下钻取并按州/省查看增长层级。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_174_0.png)\n\
  \n有选项可修改数据模型以支持物理关系，从而避免虚拟关系的限制。例如，可以通过 SQL、M 或 DAX 计算列为每个表创建 Year-Month 等连接列。\n\
  \n\n\n\n或者，使用具有双向交叉筛选关系的桥接表可以为多对多场景提供简单的解决方案。最后，对于小型事实表，可以在支持关系的计算列中使用LOOKUPVALUE函数。\n\
  \n## 更多内容……\n\nDAX TREATAS函数于2017年初添加，与涉及INTERSECT或带CONTAINS函数参数的FILTER的替代虚拟关系方法相比，它提供了更简单的语法和更好的性能。我们可以使用TREATAS函数将汇总表**SubCatPlan**集成到我们的Power\
  \ BI数据模型中。当企业希望通过他们经常使用的相同的**Products**和**Dates**表来筛选计划数据，并创建实际与计划对比的报告时，这非常有用。SubCatPlan表的粒度是按日历年、日历月划分的产品子类别；如*图3.36*所示。\n\
  \n| 产品子类别 | 日历年 | 日历月 | 计划金额 |\n|---|---:|---|---:|\n| 山地自行车 | 2013 | 一月 | $313,596.6261\
  \ |\n| 水壶和笼架 | 2013 | 一月 | $2,284.3156 |\n\n图3.36：用于虚拟关系的计划汇总表\n\n由于多对多关系，无法直接创建从**SubCatPlan**表到**Date**和**Product**表的关系。Power\
  \ BI中的每个物理关系都基于每个表中的单个列，其中一个关系列唯一标识其宿主表的所有行。这与SSAS表格模型和Excel的Power Pivot模型一致。\n\n\
  要使用DAX创建虚拟表关系，请按照以下步骤操作：\n\n- 1. 在**Calculations**表中创建**Subcat Plan Amt**度量值。该度量值通过**Products**表和**Dates**表筛选子类别计划度量值：\n\
  \n```dax\nSubcat Plan Amt =\n    VAR ProductSubCats = VALUES('Products'[Product\
  \ Subcategory])\n    VAR DateTbl =\n        SUMMARIZE('Dates', 'Dates'[CalendarYear],\
  \ 'Dates'[EnglishMonthName])\n    RETURN\n        CALCULATE(\n            SUM('SubCatPlan'[Plan\
  \ Amt]),\n            TREATAS(ProductSubCats, 'SubCatPlan'[Product Subcategory]),\n\
  \            TREATAS(DateTbl, 'SubCatPlan'[Calendar Year], 'SubCatPlan'[Calendar\
  \ Month])\n        )\n```\n\n本配方演示了如何利用DAX父级和子级层次结构函数来创建层次结构的列。然后将该层次结构实现到数据模型中，并创建一个组以进一步助力分析。\n\
  \n## 准备工作\n\n要为此配方做准备，请按照以下步骤操作：\n\n- 1. 打开Power BI Desktop。\n- 2. 创建一个名为AdWorksDW的导入模式数据源查询。该查询应与以下内容类似：\n\
  \n```m\nlet\n    Source = Sql.Database(\"localhost\\\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\"\
  )\nin\n    Source\n```\n\n- 3. 将此查询隔离到一个名为**数据源**的查询组中，并禁用加载。\n- 4. 右键单击AdWorksDW并选择**引用**。\n\
  - 5. 选择**FactInternetSales**表并将此查询命名为**Internet Sales**。\n- 6. 重复步骤4和5，创建一个导入**FactFinance**的**总账**查询。\n\
  - 7. 使用以下代码创建**Products**查询：\n\n```m\nlet\n    Source = AdWorksDW,\n    Navigation\
  \ = Source{[Schema=\"dbo\",Item=\"DimProduct\"]}[Data],\n    Subcategory =\n   \
  \     Table.ExpandRecordColumn(\n            Navigation, \"DimProductSubcategory\"\
  ,\n            {\"EnglishProductSubcategoryName\", \"DimProductCategory\"},\n  \
  \          {\"Product Subcategory\", \"DimProductCategory\"}\n        ),\nin\n \
  \   Subcategory\n```\n\n- 8. 使用以下代码创建**Accounts**查询：\n\n```m\nlet\n    Source =\
  \ AdWorksDW,\n    dbo_DimCustomer = Source{[Schema=\"dbo\",Item=\"DimAccount\"]}[Data],\n\
  \    Parent =\n        Table.ExpandRecordColumn(\n            dbo_DimCustomer, \"\
  DimAccount(ParentAccountKey)\",\n```\n\n```dax\nAccount Level 4 =\n    VAR __Key\
  \ = PATHITEM('Accounts'[Path],4,1)\nRETURN\n    LOOKUPVALUE('Accounts'[AccountDescription],'Accounts'[AccountKey],\n\
  __Key)\n```\n\n```dax\nAccount Level 5 =\n    VAR __Key = PATHITEM('Accounts'[Path],5,1)\n\
  RETURN\n    LOOKUPVALUE('Accounts'[AccountDescription],'Accounts'[AccountKey],\n\
  __Key)\n```\n\n```dax\nAccount Level 6 =\n    VAR __Key = PATHITEM('Accounts'[Path],6,1)\n\
  RETURN\n    LOOKUPVALUE('Accounts'[AccountDescription],'Accounts'[AccountKey],\n\
  __Key)\n```\n\n- 2. 在数据视图的字段列表中，右键单击Account Level 1列，然后选择创建层次结构。\n- 3. 通过右键单击层次结构并选择重命名，将Account\
  \ Level 1 Hierarchy重命名为Account Hierarchy。\n- 4. 右键单击Account Level 2列，选择添加到层次结构，然后选择Account\
  \ Hierarchy。\n- 5. 依次对Account Level 3、Account Level 4、Account Level 5和Account Level\
  \ 6列重复步骤4。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_179_0.png)\n\n图3.39：字段列表中的层次结构\n\
  \n- 6. 右键单击组成层次结构的各个列，然后选择在报表视图中隐藏。\n- 7. 切换到报表视图，创建一个矩阵可视化，将Account Hierarchy作为行，将General\
  \ Ledger表中的Amount列作为值。\n\n| 账户级别1 | 金额 |\n|---|---:|\n| 资产负债表 | 1,107,010,918.52\
  \ |\n| 资产 | 553,505,459.26 |\n| 流动资产 | 505,506,336.27 |\n| 其他资产 | 6,080,005.58 |\n\
  | 不动产、厂房和设备 | 41,919,117.41 |\n| 负债和所有者权益 | 553,505,459.26 |\n| 净利润 | 239,257,169.18\
  \ |\n| 统计账户 | 12,372,325.00 |\n| 总计 | 1,358,640,412.70 |\n\n图3.40：账户层次结构的矩阵可视化\n\
  \n- 8. 在字段列表中，右键单击Products表中的Product Subcategory列，然后选择新建组。\n- 9. 通过编辑名称字段，将组重命名为Product\

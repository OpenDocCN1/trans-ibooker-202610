  \ 列的关系\n- 15. 保存你的工作\n\n## Applying Advanced Analytics and Custom Visuals\n\n```\n\
  Average Customer Orders =\nAVERAGEX(DISTINCT(Customers[CustomerAlternateKey]),[Internet\

  \n### 工作原理\n\n本方案演示了如何将工作簿从 Excel 发布到 Power BI，然后在 Power BI 服务中固定该工作簿报表中的项目。使用此方法，工作簿在发布后无法刷新。这意味着，在将项目直接从\
  \ Excel 工作簿固定到仪表板后，必须定期刷新与 Power BI 服务中所托管数据集的连接，并且需要移除磁贴后重新固定。\n\n为避免这种手动且本地的刷新过程，Excel\
  \ 报表视觉对象可以基于 Excel 数据模型构建；然后可以将此 Excel 工作簿发布到 Power BI 服务。包含数据模型的已发布工作簿可以在 Power\
  \ BI 服务中配置计划刷新，并且其从属报表也会更新以反映这些刷新。\n\n最近，Microsoft 在 Excel 网页版中增加了刷新已连接数据透视表的功能。这意味着，在\
  \ Excel 网页版中连接到 Power BI 的数据透视表现在可以刷新。可以通过在服务的报表中选择 **在 Excel 中分析** 选项，或在 Excel\
  \ 中插入数据透视表时选择 **从 Power BI** 选项，来创建已连接的数据透视表。\n\n### 更多内容\n\n也可以将 SSRS 报表元素固定到 Power\
  \ BI 仪表板。若要了解其工作原理，请执行以下操作：\n\n- 1. 创建或确定支持该仪表板的 SSRS 报表。\n- 2. 将此报表发布到 SSRS 报表服务器，或在报表服务器上打开此报表。\n\
  - 3. 在报表服务器浏览器窗口中，单击 Power BI 图标，并使用相应的 Power BI 账户登录。\n- 4. 单击要固定的 SSRS 报表项。\n\
  - 5. 在 **固定到 Power BI 仪表板** 对话框中，选择要将项目固定到的工作区和仪表板。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_285_0.png)\n\
  \n图 5.32：从 SSRS 2016 固定到 Power BI\n\n更新频率会创建 SSRS 订阅，以保持 Power BI 中的磁贴更新。如果这些项目位于报表正文中（而不是页眉或页脚），你还可以将\
  \ SSRS 报表中的图表、仪表面板、地图和图像固定到 Power BI 仪表板。目前无法固定来自 SSRS 报表的表、矩阵或列表报表项。\n\n\n\n\n\n\
  11. 在仪表板功能区中，选择**编辑**，然后选择**添加磁贴**。\n12. 在**添加磁贴**窗格中，从**实时数据**区域选择**自定义流数据**。\n\
  13. 单击**下一步**按钮。\n14. 在**你的数据集**下，选择**流传感器数据**，然后单击**下一步**。\n15. 对于**可视化类型**，选择**折线图**。\n\
  16. 对于**轴**，使用 **timestamp**，对于**值**，使用 **ambient_temperature**。\n17. 单击**下一步**按钮。\n\
  18. 为该磁贴输入**标题**名称**温度**，并单击**应用**按钮。\n19. 向下滚动仪表板，找到**温度**磁贴。\n\n## 工作原理\n\n实际上，Power\
  \ BI 中有三种类型的流数据集：\n\n- 推送（Push）\n- 流式（Streaming）\n- PubNub\n\n推送数据集由外部程序将数据推送到 Power\
  \ BI；数据作为数据集存储在 Power BI 中。推送数据集将信息永久存储在 Power BI 中，之后可用于创建报表。使用推送数据集时，可通过报表生成视觉对象，然后将其固定到仪表板。推送数据集限制为每秒\
  \ 1 个请求、每个请求 16 MB、每小时 100 万行。\n\n流数据集将数据推送到 Power BI，但不将数据存储在 Power BI 数据集中。因此，流数据集不能用于报表，只能用于仪表板。流数据集限制为每秒\
  \ 5 个请求、每个请求 15 KB，但对每小时处理的行数没有限制。\n\nPubNub 数据集也不在 Power BI 中存储数据，因此只能用于仪表板。对于每秒发送的请求数或每个请求发送的数据量没有限制，因为\
  \ Power BI Web 客户端使用 PubNub SDK 读取现有的 PubNub 数据流，而不是将信息推送到 Power BI。\n\n推送数据集和流数据集可以使用\
  \ Power BI REST API 创建，也可以在使用 Azure 流分析创建新的流数据集时，通过服务中的 **API** 选项创建。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_289_0.png)\n\
  \n图 5.34：新建流数据集的选项\n\n在服务中使用 API 选项创建流数据集时，配置屏幕包含“历史数据分析”开关。此开关默认关闭，将创建流数据集——将“历史数据分析”切换到“开启”将创建推送数据集。创建\
  \ PUSH/STREAMING 数据集后，可以使用 Power BI REST API 的推送数据集功能将数据推送到数据集中。\n\nPower BI 服务中的“Azure\
  \ 流”选项在撰写本文时尚未完全实现，但实现后将提供一个界面，用于将 Azure 流分析数据集成到 Power BI 中。目前，必须从 Azure 流分析激活\
  \ Power BI 集成。Power BI 是 Azure 流分析数据的输出选项之一。将 Power BI 设置为 Azure 流分析的输出，会创建一个既可以利用推送也可以利用流式功能的\
  \ Power BI 数据集。默认情况下，此数据集存储 200,000 行数据，并采用先进先出（FIFO）方式使数据过期。\n\n## 更多内容\n\n对于实时或近实时数据，另一个选项是使用自动页面刷新。自动页面刷新用于报表页，可设置视觉对象的刷新间隔，且仅在查看报表时生效——该选项不适用于导入数据源。自动页面刷新可在\
  \ Power BI Desktop 或 Power BI 服务的页面格式选项中配置。刷新类型可以配置为固定间隔，也可以基于变更检测配置。变更检测支持因存储模式、数据源以及使用的是专用容量（Premium）还是共享容量而异。共享容量不支持任何存储模式或数据源的变更检测。最小固定刷新间隔也因存储模式、数据源和容量类型而异。对于专用容量，最小固定刷新间隔为\
  \ 1 秒，但 Azure Analysis Services 除外，其间隔为 30 分钟。对于共享容量，所有存储模式和数据源的最小固定刷新间隔均为 30 分钟。\n\

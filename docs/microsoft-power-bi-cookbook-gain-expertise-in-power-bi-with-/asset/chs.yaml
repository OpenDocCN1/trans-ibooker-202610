  \ |\n\n表 1.1：详细说明 Power BI 功能和工具及其使用示例的博客列表。\n\n除 *Kasper On BI* 外，所有这些博客均来自非微软员工，因此不一定代表微软的观点或对其产品的推荐做法。此外，其中一些博客并非只关注\
  \ Power BI；它们还可能涵盖其他 MSBI、Azure、SQL Server 和 Office 365 工具和服务。\n\n另一个学习和部署 Power\
  \ BI 的资源是 Adam Saxton 和 Patrick LeBlanc 的 *Guy in a Cube* 视频频道 (http://bit.ly/2o2lRqU)。这些视频提供简洁、动手实践的评论，以及对常见问题和场景的解决方案。它们还提供对\
  \ Power BI 近期更新和发布的高层总结。作为微软员工，Adam 和 Patrick 能够结合微软产品和技术团队的具体指导，并且定期识别来自更广泛 Power\
  \ BI 社区的最新博客文章。强烈建议您订阅该频道，以便随时了解新文章！\n\n## 另请参阅\n\n- 在 Excel 中分析：http://bit.ly/3bIMSeM\n\
  - 在 Excel 中分析 – 高级方法：https://bit.ly/3bLbpzG\n\n## 安装和配置其他工具\n\n负责开发语义模型（数据集）的 Power\
  \ BI 专业人员通常使用 Power BI Desktop 之外的其他工具来创建和管理模型。例如，他们使用 Tabular Editor 快速实施度量值更改或添加新对象，如透视和计算组。同样，ALM\
  \ Toolkit 通常用于向 Power BI 部署增量更改和仅元数据更改。\n\n**另一个此类工具是 DAX Studio**，这是一个第三方工具，用于查询数据模型、编辑和格式化代码、浏览数据模型的结构和元数据，以及分析\
  \ DAX 查询的性能和执行特征。对于更大、更复杂的数据模型和表达式，以及涉及多个模型的项目，DAX Studio 成为开发和性能调优过程的重要补充。\n\n\
  **DAX（数据分析表达式）**是“Power BI 的语言”，因为它用于创建在 Power BI 报表和仪表板中可视化的度量值和查询。Power BI 根据可视化的结构、用户选择和筛选器生成\
  \ DAX 查询并将其提交到源数据模型——正如 Excel 等其他工具根据工作簿中数据透视表和切片器的选择和结构生成 MDX 查询一样。DAX 表达式还用于定义安全角色，并且可以选择用于基于模型中的其他表和列在数据模型中创建列和表，这些列和表可以在处理时刷新并被度量值和查询使用。DAX\
  \ 在 Azure Analysis Services (AAS) 和 SQL Server Analysis Services (SSAS) 表格模型以及 Power\
  \ Pivot for Excel 模型中同样发挥着作用，因此 BI 专业人员必须拥有一个强大的工具来开发和解析 DAX 代码以及包含这些表达式的数据模型。\n\
  \n## 如何安装和配置其他工具\n\n- 1. 从 DAX Studio 网站下载最新版本：https://daxstudio.org/downloads/。安装程序版本是单个文件，提供基于向导的安装和设置，而便携版是\
  \ ZIP 文件，不提供基于向导的安装。\n- 2. 使用“打开文件”链接或从“下载”文件夹运行该文件。\n- 3. 安装开始后，选择“为所有用户安装”（推荐）选项。\n\
  - 4. 接受许可协议，然后点击“下一步”按钮。\n- 5. 选择用于安装工具的文件夹路径，然后点击“下一步”按钮。\n- 6. 选择是否同时安装适用于 Excel\
  \ 的 DAX Studio 加载项。点击“下一步”按钮。请注意：\n  - 连接 Power Pivot for Excel 数据模型需要 Excel 加载项。\n\
  \  - 此外，当从 Excel 打开 DAX Studio 时，查询结果可以直接导出到 Excel 表格中。\n- 7. 选择“开始”菜单文件夹（默认为 DAX\
  \ Studio），然后点击“下一步”按钮。\n- 8. 勾选“创建桌面快捷方式”复选框，然后点击“下一步”按钮。\n- 9. 最后，点击“安装”按钮。\n\n\
  ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_39_0.png)\n\n图 1.24：DAX Studio 安装文件\n\n\
  ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_39_1.png)\n\n图 1.25：DAX Studio 安装成功\n\n\

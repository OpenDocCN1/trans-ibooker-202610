  2. 从报表菜单栏单击省略号 (...) 并选择 **固定到仪表板**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_270_0.png)\n\
  \nFigure 5.12: 固定到仪表板\n\n3. 选择 **固定到仪表板** 后，选择 **现有仪表板**，选择 **北美销售** 仪表板，然后单击 **固定实时**\
  \ 按钮。\n\n4. 导航到 **北美销售** 仪表板，向下滚动并注意报表现在已作为磁贴固定。\n\n仪表板用户可以与实时页面的区域和日期切片器以及其他视觉对象交互。鉴于报表页面的大小，通常不建议将实时报表页面固定到\
  \ **移动视图**。实时页面磁贴右上角的省略号包括 **转到报表** 链接以访问实时页面报表的所有页面。对底层报表的修改将反映在固定的实时页面上。其他视觉对象链接到其报表页面。\n\
  \n## See also\n\n- - Power BI 设计师的仪表板简介：http://bit.ly/31KvIrv\n- - 设计出色的 Power BI\
  \ 仪表板的技巧：http://bit.ly/2PspxG3\n- - 向仪表板添加图像、视频等：https://bit.ly/31QypHP\n\n## Preparing\
  \ for Q&A\n\nQ&A 可以成为一种强大的方法，使用户能够探索数据集，使他们能够直接在 Power BI 服务和通过 Power BI 移动应用程序提交自己的问题。每个数据集的表和度量，由仪表板上的磁贴表示，可用于回答\
  \ Q&A 问题。\n\n\n\n\n本指南提供数据模型设计和元数据提示，用于为 Q&A 准备数据集。此外，将在 Power BI Desktop 数据模型中添加同义词，以提高自然语言查询的准确性。\n\
  \n## 准备工作\n\n要准备本指南：\n\n- 完成本章的第一个指南，*构建仪表板*。\n\n## 如何为 Q&A 做准备\n\n要实现本指南，请执行以下步骤：\n\
  \n- 1. 打开**北美销售**仪表板。\n- 2. 在仪表板的左上角，单击**就你的数据提问**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_271_0.png)\n\
  \n图 5.13：Power BI Q&A\n\n- 3. 输入以下内容：`wholesaler net sales by country.`\n- 4. 请注意，单词\
  \ **wholesaler** 以红色双下划线标注，**net sales** 以蓝色下划线标注，而 **country** 以红色虚线下划线标注。\n\n\
  ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_271_1.png)\n\n图 5.14：显示按经销商国家/地区的净销售额结果\n\
  \n- 5. 将鼠标悬停在显示的地图气泡之一上，注意工具提示显示的是 **Total Net Sales**，而不是 **Reseller Net Sales**。\n\
  - 6. 单击屏幕右下角的“不喜欢”图标。\n- 7. 打开文件 `CH5_R1_SalesAndFinanceDataset.pbix`。\n- 8. 切换到**模型**视图。\n\
  - 9. 在**主页**选项卡的功能区中，单击**Q&A 设置**。\n- 10. 在**Q&A 设置**对话框中，单击**审阅问题**选项卡，请注意所提出的问题出现在列表中。请注意，你可能需要等待几分钟，并使用刷新图标来显示该问题。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_272_0.png)\n\n图 5.15：审阅问题\n\n- 11. 单击**需要修复**列下的铅笔图标。请注意，如果几分钟后问题仍未出现，只需转到**教\
  \ Q&A** 选项卡，输入问题 **wholesaler net sales by country**，单击**提交**按钮，然后继续执行步骤 13。\n-\
  \ 12. 将打开**教 Q&A** 选项卡，并显示该问题。\n- 13. 单词“wholesaler”被标记在两个手柄之间；在**定义 Q&A 无法理解的术语**中，在输入字段中键入\
  \ **reseller**（见图 5.16）。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_272_1.png)\n\
  \n图 5.16：为 reseller 添加同义词\n\n- 14. 单击**保存**，但请注意，地图视觉对象仍然不正确。\n- 15. 拖动右侧手柄（红色棒和圆圈）以包含整个短语\
  \ **wholesaler net sales**，并单击**提交**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_272_2.png)\n\
  \n图 5.17：为 wholesaler net sales 添加术语\n\n- 16. 在**定义 Q&A 无法理解的术语**对话框中，在输入字段中键入 **reseller\
  \ net sales**，并注意地图会更新；正确信息现在显示在工具提示中。\n- 17. 单击**保存**按钮。\n- 18. 单击**管理术语**选项卡，注意\
  \ **wholesaler** 和 **wholesaler net sale** 现在已定义为具有正确定义的术语。\n- 19. 单击**字段同义词**选项卡，展开**经销商**表，注意\
  \ **wholesaler** 同义词已添加到**经销商**表中。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_273_0.png)\n\
  \n图 5.18：表同义词\n\n- 20. 展开**经销商销售**表，向下滚动，看到 **wholesaler net sale** 同义词已添加到 **Reseller\
  \ Net Sales** 度量值。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_273_1.png)\n\n图 5.19：度量值同义词\n\
  \n- 21. 使用右上角的关闭按钮关闭**Q&A 设置**对话框。\n\n## 工作原理\n\nPower BI Q&A 支持导入模式以及与 Azure Analysis\
  \ Services、SQL Server Analysis Services（通过网关）和 Power BI 数据集的实时连接。这些数据源支持 RLS。此外，Q&A\
  \ 支持与 SQL DirectQuery 源的 DirectQuery 连接，例如 Azure SQL Database、Azure Synapse Analytics\
  \ 和 SQL Server 2019。Q&A 不支持复合数据模型或 Reporting Services。\n\n同义词是确保业务用户获得简单直观的 Q&A\
  \ 体验以及获得其问题正确答案的关键部分。同义词允许向数据模型添加语义层，该语义层使用业务术语，而不仅仅是模型中表、列和度量值的名称。表、列和度量值可以包含在\
  \ Q&A 中或从中排除，并且可以定义同义词。\n\n## 在服务中工作\n\n设置 Q&A 的一些通用提示包括：\n\n- 修订任何数据类型不正确的列，例如存储为文本数据类型的日期或数字。\n\
  - 将维度列的默认汇总设置为**不要汇总**。\n- 将地理列（如州和邮政编码）与相关数据类别关联。\n- 将包含多个值的列拆分为不同的列。\n- 规范化表，使表内的实体移动到其各自独立的表中；例如，产品表中供应商的列可以移动到供应商表中。\n\
  - Q&A 查询仅对模型的活动关系有效。考虑使用具有活动关系的专用角色扮演维度。或者，考虑将非活动关系维度反规范化为事实表。\n- 定义最常见或最常用的自然语言问题，并在\
  \ Power BI 中测试其准确性。\n- 识别数据模型实体名称与自然语言查询中使用的名称之间的差距。\n- 关注用户不会随意使用的较长且不太直观的实体名称。\n\
  - 避免在多个实体间重用相同的同义词，因为这可能导致不正确的查询结果。\n- 确保模型中每个实体的主同义词是唯一的。\n\n## 更多内容\n\nQ&A 可能不适用于某些仪表板和数据集。例如，Q&A\
  \ 搜索栏**就你的数据提问**可能会分散只想查看所呈现的 KPI 和其他信息的用户的注意力。此外，如果数据集需要网关（例如本地 SSAS 服务器或通过 DirectQuery\
  \ Power BI Desktop 模型连接到本地源），则可能应避免使用 Q&A，考虑到额外的（可能低效的）查询和性能问题。\n\n要启用或禁用 Q&A，请按照以下步骤操作：\n\
  \n- 1. 在 Power BI 服务中，访问包含仪表板的应用工作区。\n- 2. 使用三个垂直点并单击**设置**。\n\n图 5.20：仪表板设置\n\n\
  3. 选中或取消选中“在此仪表板上显示 Q&A 搜索框”复选框。\n\n图 5.21：在此仪表板上显示 Q&A 搜索框\n\n驱动 Q&A 的整个语义层定义可以通过\
  \ Power BI Desktop 在模型视图中使用“主页”选项卡功能区中的“语言架构”选项进行导出、修改和导入。导出的文件是 YAML 文件。YAML（YAML\
  \ Ain't Markup Language）是一种用于数据序列化的人类可读文本文件。添加 wholesaler net margin 同义词后，YAML 文件的一部分如下所示：\n\
  \n```\nreseller_sale.reseller_net_sales:\n  Definition:\n    Binding: {Table: Reseller\
  \ Sales, Measure: Reseller Net Sales}\n  State: Generated\n  Terms:\n  - reseller\
  \ net sales: {State: Generated}\n  - wholesaler net sale: {LastModified: '2021-04-05T16:58:30.2996117Z'}\n\
  \  - sales: {State: Generated, Weight: 0.97}\n  - net sales: {State: Generated,\
  \ Weight: 0.97}\n  - sale: {State: Suggested, Weight: 0.97}\n  - net sale: {State:\
  \ Suggested, Weight: 0.97}\n  - reseller net sale: {Type: Noun, State: Suggested,\
  \ Weight: 0.739}\n  - wholesaler net auction: {Type: Noun, State: Suggested, Weight:\
  \ 0.492}\n  - net auction: {Type: Noun, State: Suggested, Weight: 0.485}\n```\n\n\
  ```\n- wholesaler net transaction: {Type: Noun, State: Suggested, Weight: 0.482}\n\
  - auction: {Type: Noun, State: Suggested, Weight: 0.476}\n- net transaction: {Type:\
  \ Noun, State: Suggested, Weight: 0.475}\n- wholesaler net deal: {Type: Noun, State:\

  \n## 普及人工智能\n\nPower BI 可视化库近期新增的功能通过让机器学习变得直观且易于最终用户使用，帮助普及人工智能。本章介绍的**关键影响因素**和**分解树**可视化，以及**智能叙述**和**问答**等其他视觉对象，利用机器学习算法实时分析可视化数据，将人工智能见解带给大众。机器学习是纯粹基于数学算法分析数据，以识别模式、关键指标、聚类、异常值和关键分类的过程。\n\
  \n本方案演示如何配置和使用**关键影响因素**和**分解树**可视化的人工智能功能。\n\n## 准备工作\n\n要准备本方案，请按照以下步骤操作：\n\n\
  - 1. 在本地打开 Power BI Desktop 文件，并通过单击**主页**选项卡功能区中的**转换数据**进入 **Power Query 编辑器**。\n\
  - 2. 创建名为 AdWorksDW 的查询，如下所示：\n\n```\nlet\n    Source = Sql.Database(\"localhost\\\
  \\MSSQLSERVERDEV\", \"AdventureWorksDW2019\")\nin\n    Source\n```\n\n- 3. 禁用 AdWorksDW\
  \ 查询的加载，并将其放入**数据源**查询组中。\n- 4. 右键单击 AdWorksDW 查询，然后选择**引用**。\n- 5. 将查询重命名为 **Internet\
  \ Sales**，并选择 **FactInternetSales** 表。\n- 6. 重复步骤 4 和 5，创建指向 **DimDates** 表的 **Dates**\
  \ 查询，以及指向 **DimSalesTerritory** 表的 **Sales Territories** 查询。\n- 7. 使用以下代码创建 **Customers**\
  \ 查询：\n\n```\nlet\n    Source = AdWorksDW,\n    dbo_DimCustomer = Source{[Schema=\"\
  dbo\",Item=\"DimCustomer\"]}[Data],\n    ExpandGeography = Table.ExpandRecordColumn(dbo_DimCustomer,\
  \ \"DimGeography\",\n{\"City\", \"StateProvinceCode\", \"EnglishCountryRegionName\"\
  , \"PostalCode\", \"DimSalesTerritory\"},\n{\"City\", \"StateProvinceCode\", \"\
  EnglishCountryRegionName\", \"PostalCode\", \"DimSalesTerritory\"}),\nExpandSalesTerritory\
  \ = Table.ExpandRecordColumn(ExpandGeography, \"DimSalesTerritory\", {\"SalesTerritoryRegion\"\
  }, {\"SalesTerritoryRegion\"}),\nDupCity = Table.DuplicateColumn(ExpandSalesTerritory,\
  \ \"City\", \"City1\"),\nDupZip = Table.DuplicateColumn(DupCity, \"PostalCode\"\
  , \"Zip\"),\nAddress = Table.CombineColumns(DupZip, {\"AddressLine1\", \"City1\"\
  , \"StateProvinceCode\"}, Combiner.CombineTextByDelimiter(\", \", QuoteStyle.None),\"\
  Address\"),\nFullAddress = Table.CombineColumns(Address,{\"Address\", \"Zip\"},\
  \ Combiner.CombineTextByDelimiter(\" \", QuoteStyle.None),\"Full Address\")\nin\n\
  FullAddress\n```\n\n- 8. 使用以下代码创建 **Products** 查询：\n\n```\nlet\n    Source = AdWorksDW,\n\
  \    Navigation = Source{[Schema=\"dbo\",Item=\"DimProduct\"]}[Data],\n    Subcategory\
  \ =\n        Table.ExpandRecordColumn(\n            Navigation, \"DimProductSubcategory\"\
  ,\n            {\"EnglishProductSubcategoryName\", \"DimProductCategory\"},\n  \
  \          {\"Product Subcategory\", \"DimProductCategory\"}\n        ),\n    Category\
  \ =\n        Table.ExpandRecordColumn(\n            Subcategory, \"DimProductCategory\"\
  ,\n            {\"EnglishProductCategoryName\"}, {\"Product Category\"}\n      \
  \  )\nin\n    Category\n```\n\n- 9. 将 **Internet Sales** 查询移动到 **Facts** 查询组，并将\
  \ **Sales Territories**、**Dates**、**Customers** 和 **Products** 查询移动到 **Dimensions**\
  \ 查询组。\n- 10. 从**主页**选项卡的功能区中选择**关闭并应用**。\n- 11. 切换到**模型**视图，并在 **Internet Sales**\
  \ 和 **Sales Territories** 表中的 **SalesTerritoryKey** 列之间创建关系。\n- 12. 在 **Internet\
  \ Sales** 和 **Products** 表中的 **ProductKey** 列之间创建关系。\n- 13. 在 **Dates** 表中的 **DateKey**\
  \ 列与 **Internet Sales** 表中的 **OrderDateKey** 列之间创建关系。\n- 14. 在 **Internet Sales**\
  \ 和 **Customers** 表中的 **CustomerKey** 列之间创建关系。\n- 15. 保存您的工作。\n\n## 如何普及人工智能\n\n\
  要实施本方案，请使用以下步骤：\n\n- 1. 在**报表**视图中，创建一个**关键影响因素**可视化，将 **Internet Sales** 表中的 **SalesAmount**\
  \ 列放入**分析**字段井中，并将以下列放入**按以下项解释**字段井中：\n  - 来自 **Sales Territories** 表的 **SalesTerritoryCountry**\
  \ 列\n  - 来自 **Sales Territories** 表的 **SalesTerritoryGroup** 列\n  - 来自 **Sales Territories**\
  \ 表的 **SalesTerritoryRegion** 列\n  - 来自 **Products** 表的 **Product Category** 列\n\
  \  - 来自 **Products** 表的 **Product Subcategory** 列\n  - 来自 **Customers** 表的 **City**\
  \ 列\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_414_0.png)\n\n图 9.14：关键影响因素可视化\n\
  \n- 2. 点击不同的**条件**项，查看与影响因素相关的视觉对象。\n- 3. 点击**顶级细分**选项卡，查看识别出的不同细分。\n- 4. 点击感兴趣的细分，查看附加信息和视觉对象。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_415_0.png)\n\n图 9.15：关键影响因素可视化中的细分详情\n\
  \n## 工作原理\n\n**关键影响因素**视觉对象使用机器学习算法分析添加到视觉对象中的数据，并基于这些算法提取见解。根据指标具有分类还是连续的关键影响因素，会创建不同的视觉对象与见解。在**分析**字段井中使用未汇总的数值字段，可以将**格式**窗格中的**分析**更改为**分类**或**连续**。使用度量值或聚合列会强制进行**连续**分析。度量值既可以用作待分析的指标，也可以用作关键影响因素（**按以下项解释**）。\n\
  \n可以在**格式**窗格的**分析**部分中启用计数。计数有助于确定关键影响因素是否具有较大影响，但仅代表总数据的一小部分。启用计数会在每个关键影响因素圆周围创建一个环，表示该关键影响因素出现的数据行所占的百分比。环绕整个圆的环表示\
  \ 100% 的数据都包含该关键影响因素。\n\n**顶级细分**选项卡分析数据，以查找相似数据点的聚类。同样，使用机器学习聚类算法从可视化所使用的基础数据中查找并提取这些细分。\n\
  \n**关键影响因素**可视化存在某些限制，主要与支持的数据源以及视觉对象可显示的位置有关。例如，关键影响因素视觉对象不支持 DirectQuery，也不支持与\
  \ Azure Analysis Services 或 SQL Server Analysis Services 的实时连接。此外，在使用**发布到 Web**或将可视化嵌入\
  \ SharePoint Online 时，不支持关键影响因素可视化。\n\n\n\n\n\n### 更多内容\n\n另一个最近新增的高级可视化是分解树。要了解如何配置和使用分解树可视化，请按照以下步骤操作：\n\
  \n1. 在报表视图中，通过将 Internet Sales 表中的 SalesAmount 列放入“分析”字段井，并将以下列放入“解释依据”字段井，创建关键影响因素可视化：\n\
  \    - Sales Territories 表中的 SalesTerritoryCountry 列\n    - Products 表中的 Product\
  \ Category 列\n    - Products 表中的 Product Subcategory 列\n    - Customers 表中的 City\
  \ 列\n    - Dates 表中的 CalendarYear 列\n2. 单击 SalesAmount 条末尾的 + 图标，然后选择“高值”。\n3. 重复此过程，直到树完全展开，如图9.17所示。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_416_0.png)\n\n图9.16：分解树展开过程\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_416_1.png)\n\
  \n图9.17：完全展开的分解树可视化\n\n展开分解树时，选择“高值”或“低值”会利用人工智能机器学习算法来展开树，分别返回所分析度量的最高值或最低值。分解树可视化对于最终用户来说是一种强大而灵活的工具，可用于探索和分析其数据，因为用户可以按任意顺序浏览“解释依据”类别，或者让机器学习算法引导其分析。\n\
  \n### 另请参阅\n\n- 关键影响因素可视化教程：https://bit.ly/3h414Cn\n- 分解树：https://bit.ly/2PC9ZiR\n\
  \n## 构建动画和叙事\n\n业务团队和分析师通常负责与其他利益相关者（如高级管理层）分享或“讲解”业务结果、趋势以及他们的分析发现。为了最有效地支持信息传递过程，Power\
  \ BI 为标准散点图和 ArcGIS 地图可视化类型提供了内置动画功能。此外，核心视觉对象和自定义视觉对象（如脉冲图）通过将用户自定义注释嵌入视觉对象并提供对动画的完全播放控制，进一步帮助了叙事过程。\n\
  \n> “我们正在将叙事引入 Power BI。我们正在把 Power BI 变成数据的 PowerPoint。”\n>\n> —— Amir Netz，微软技术院士\n\
  \n本操作指南包含一些示例，介绍如何准备标准**散点**图可视化以进行动画，并利用**ArcGIS Maps for Power BI**视觉对象的日期动画功能。还包括有关**书签**窗格以及**智能叙述**和其他叙事自定义视觉对象的详细信息。\n\
  \n### 准备工作\n\n要为执行本操作指南做好准备，请按照以下步骤操作：\n\n1. 在本地打开一个 Power BI Desktop 文件，然后通过单击“开始”选项卡功能区中的**转换数据**来访问**Power\
  \ Query 编辑器**。\n2. 创建一个名为 AdWorksDW 的查询，类似如下：\n\n```\nlet\n    Source = Sql.Database(\"\
  localhost\\MSSQLSERVERDEV\",\n    \"AdventureWorksDW2019\")\nin\n    Source\n```\n\
  \n3. 禁用 AdWorksDW 查询的加载，并将此查询放入**Data Sources**查询组。\n4. 右键单击 AdWorksDW 查询，然后选择**引用**。\n\
  5. 将查询重命名为 Internet Sales，并选择 FactInternetSales 表。\n6. 重复步骤4和5，创建一个指向 DimDates 表的\
  \ Dates 查询，以及一个指向 DimSalesTerritory 表的 Sales Territories 查询。\n7. 使用以下代码创建 Customers\
  \ 查询：\n\n```\nlet\n    Source = AdWorksDW,\n    dbo_DimCustomer = Source[{Schema=\"\
  dbo\",Item=\"DimCustomer\"}][Data],\n    ExpandGeography = Table.ExpandRecordColumn(dbo_DimCustomer,\n\
  \        \"DimGeography\",\n        {\"City\", \"StateProvinceCode\", \"EnglishCountryRegionName\"\
  ,\n        \"PostalCode\",\n        \"DimSalesTerritory\"},\n        {\"City\",\
  \ \"StateProvinceCode\", \"EnglishCountryRegionName\",\n        \"PostalCode\",\n\
  \            \"DimSalesTerritory\"}),\n    ExpandSalesTerritory = Table.ExpandRecordColumn(ExpandGeography,\n\
  \        \"DimSalesTerritory\", {\"SalesTerritoryRegion\"},\n        {\"SalesTerritoryRegion\"\
  }),\n    DupCity = Table.DuplicateColumn(ExpandSalesTerritory, \"City\",\n     \
  \   \"City1\"),\n    DupZip = Table.DuplicateColumn(DupCity, \"PostalCode\", \"\
  Zip\"),\n    Address = Table.CombineColumns(DupZip,\n        {\"AddressLine1\",\
  \ \"City1\", \"StateProvinceCode\"},\n        Combiner.CombineTextByDelimiter(\"\
  \ \", QuoteStyle.None), \"Address\"),\n    FullAddress = Table.CombineColumns(Address,\
  \ {\"Address\", \"Zip\"},\n        Combiner.CombineTextByDelimiter(\" \", QuoteStyle.None),\
  \ \"Full Address\")\nin\n    FullAddress\n```\n\n8. 使用以下代码创建 Products 查询：\n\n```\n\
  let\n    Source = AdWorksDW,\n    Navigation = Source[{Schema=\"dbo\",Item=\"DimProduct\"\
  }][Data],\n    Subcategory =\n        Table.ExpandRecordColumn(\n            Navigation,\
  \ \"DimProductSubcategory\",\n            {\"EnglishProductSubcategoryName\", \"\
  DimProductCategory\"},\n            {\"Product Subcategory\", \"DimProductCategory\"\
  }\n        ),\n    Category =\n        Table.ExpandRecordColumn(\n            Subcategory,\
  \ \"DimProductCategory\",\n            {\"EnglishProductCategoryName\"}, {\"Product\
  \ Category\"}\n        )\nin\n    Category\n```\n\n9. 将**Internet Sales**查询移动到**Facts**查询组，并将**Sales\
  \ Territories**、**Dates**、**Customers**和**Products**查询移动到**Dimensions**查询组。\n10.\
  \ 从“开始”选项卡的功能区中选择**关闭并应用**。\n11. 在 Power BI Desktop 中，选择**Customers**表中的**City**列，并为其分配**数据类别**为**City**。\n\
  12. 选择**Customers**表中的**Full Address**列，并为其分配**数据类别**为**Address**。\n13. 切换到**模型**视图，并在**Internet\
  \ Sales**表与**Sales Territories**表中的**SalesTerritoryKey**列之间创建关系。\n14. 在**Internet\
  \ Sales**表和**Products**表的**ProductKey**列之间创建关系。\n15. 在**Dates**表的**DateKey**列与**Internet\
  \ Sales**表的**OrderDateKey**列之间创建关系。\n16. 在**Internet Sales**表和**Customers**表的**CustomerKey**列之间创建关系。\n\
  17. 保存你的工作。\n\n### 如何构建动画和叙事\n\n要实现本操作指南，请使用以下步骤：\n\n1. 在**报表**视图中，将**SalesTerritories**表中的**SalesTerritoryGroup**列的报表级或页面级筛选器设置为**Europe**值。\n\
  2. 创建一个**散点**图可视化，使用**SalesTerritories**表中的**SalesTerritoryCountry**列作为**详细信息**，使用**Internet\
  \ Sales**表中的**CustomerKey**列（计数）作为**X 轴**，使用**SalesAmount**（求和）作为**Y 轴**。\n3. 在**格式**窗格中，展开**形状**卡片，将**大小**设置为**100**，并将**填充点**、**类别标签**和**按类别着色**切换为**开**。\n\
  4. 使用以下公式在**Dates**表中创建两个新列：\n\n```\n**YearMonth** = [CalendarYear] & \"-\" & LEFT([EnglishMonthName],3)\n\
  **YearMonthSort** = [CalendarYear]*100 + [MonthNumberOfYear]\n```\n\n5. 将**YearMonth**列的**按列排序**设置为**YearMonthSort**列。\n\
  \n15. 将**Dates**表中的**FullDateAlternateKey**列添加到**时间**字段井。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_421_0.png)\n\
  \n图9.19：使用热力图主题和时间线的 ArcGIS Maps for Power BI 视觉对象\n\n16. 添加一个新页面，并使用**筛选器**窗格添加页面级筛选器，使用**Dates**表中的**CalendarYear**列筛选年份**2011、2012和2013**。\n\
  17. 在**可视化**窗格中，单击省略号 (…) 并选择**获取更多视觉对象**。\n18. 搜索、查找并添加**播放轴（动态切片器）**可视化。\n19.\
  \ 创建一个**簇状**柱形图可视化，将**Dates**表中的**YearMonth**列作为**轴**，将**SalesAmount**列（求和）作为**值**。\n\
  20. 创建一个**簇状**条形图可视化，将**Sales Territories**表中的**SalesTerritoryCountry**列作为**轴**，将**SalesAmount**列（求和）作为**值**。\n\
  21. 添加**播放轴**可视化，并将**Dates**表中的**YearMonth**列用作**字段**。\n\n\n\n\n\n## 22. 点击 Play\
  \ Axis 可视化中的播放按钮\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_422_0.png)\n\n图 9.20：Play\
  \ Axis 自定义视觉筛选两个图表并暂停在 2013 年 6 月\n\n## 如何工作\n\n对于散点图，使用度量作为 Size 字段井来显示气泡是一种替代方法，在散点图上应用度量/列作为\
  \ Size，气泡的大小用于视觉上强调某个指标。然而，与饼图和环形图类似，很难直观地判断气泡大小的差异。此外，即使是少量维度项，例如产品类别，以气泡图呈现时也可能导致可视化变得杂乱。\n\
  \n在散点图示例中，可以通过按住 Ctrl 键并从另一个系列中点击气泡来选择或取消选择多个项目。选中后，散点图会突出显示给定项目（或项目）在 Play Axis\
  \ 上当前选中或筛选的点之前的路径。播放和暂停 Play Axis 并选择散点图的维度（），使演示者能够轻松地指出显著的异常值或相关趋势开始的时间点。\n\n\
  微软还创建了 Enhanced Scatter 自定义视觉，它支持背景图片 URL，例如业务位置或图表，以及为各个绘制的类别提供图片。然而，该视觉不包含 Play\
  \ Axis 或标准散点图在此配方中使用的任何视觉动画。Enhanced Scatter 可视化可在 AppSource 中获得。\n\n对于 ArcGIS 可视化，用于\
  \ Time 字段井的列必须是日期或日期/时间数据类型，例如单个日历日期或周结束日期。不支持文本和数值数据类型列，例如日历年。可视化底部的 timeline 可用于播放每个单独的日期值，或通过修改\
  \ timeline 的开始和结束点来设置自定义时间间隔。\n\n例如，可以在 timeline 开始时设置代表四周的日期间隔，点击播放图标将依次显示每个间隔。向前和向后图标可用于快速导航到不同的时间段或间隔。\n\
  \n最后，Play Axis 可视化为没有原生动画功能的视觉添加了动画功能。Play Axis 可视化通过利用 Power BI 原生的跨筛选和跨突出显示功能来工作。Play\
  \ Axis 可视化最好与柱形图、条形图以及允许 **Highlight** 视觉交互的其他图表结合使用。\n\n## 还有更多\n\n书签可用于保存特定的报表状态，包括筛选上下文和报表画布上特定项目的可见性。当使用动画视觉时，这尤其有用，以便跳到动画中最有趣的部分。**Bookmarks**\
  \ 窗格可在 **View** 选项卡的 ribbon 中在 **Report** 视图中访问。使用 **Add** 按钮创建书签。使用 **View** 按钮可像幻灯片一样轻松浏览书签。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_423_0.png)\n\n**Selection** 窗格，也可在 **View**\
  \ 选项卡的 ribbon 中使用，可与书签一起设置书签的视觉可见性。在 Power BI 报表中浏览书签类似于 Microsoft PowerPoint 演示文稿（在演示模式下）利用动画。此外，书签可以与报表中的其他对象（如图片）链接，使得在报表页面之间创建直观的导航体验成为可能。\n\
  \n微软还在为 Power BI 添加叙述和讲故事的视觉。**Smart narrative** 视觉已添加到 Power BI Desktop。要了解 Smart\
  \ narrative 的工作原理，请按照以下步骤操作：\n\n- 1. 创建一个新页面并将 **Clustered** 柱形图可视化添加到页面，使用 **Dates**\
  \ 表中的 **CalendarYear** 列作为 **Axis**，以及 **Internet Sales** 表中的 **SalesAmount** 列作为\
  \ **Values**\n- 2. 复制并粘贴此视觉\n\n3. 选择复制的视觉后，点击 Visualizations 选项卡中的 Smart narrative\
  \ 视觉\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_424_0.png)\n\n图 9.22：相同数据同时以聚类柱形图和\
  \ Smart narrative 视觉呈现\n\nSmart narrative 可视化分析数据并创建数据的自然语言叙述，该叙述在可视化中呈现。其他专注于将解释性文本或注释与数据模型中的数据集成的自定义视觉包括\
  \ Add Intelligent Narratives for BI 视觉、Enlighten Data Story 视觉和 Timeline Storyteller。\n\
  \n## 另请参阅\n\n- Scatter, bubble, and dot plot charts in Power BI: https://bit.ly/3u38toZ\n\

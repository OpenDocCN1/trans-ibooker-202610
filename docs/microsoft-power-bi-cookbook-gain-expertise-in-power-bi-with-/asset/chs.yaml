  \n图 5.42：Products 数据流\n\n32. 将鼠标悬停在 **Products** 数据流上，并单击**立即刷新**图标。\n\n## 工作原理\n\
  \n数据流允许在 Power BI 服务中构建 Power Query 查询。此外，与在 Power BI Desktop 中构建的 Power Query 查询不同，数据流可跨多个数据集（模型）重复使用。由于数据流和在\
  \ Power BI Desktop 中构建的 Power Query 查询使用相同的底层 M 代码技术，因此实际上可以将在 Power BI Desktop\
  \ 中构建的查询轻松迁移到数据流，方法是使用**高级编辑器**功能在桌面端和数据流之间复制粘贴代码，或者在创建数据流时使用**导入模型**功能。\n\n数据流将来自源的数据引入到存储在\
  \ Azure Data Lake Storage Gen2 中的符合通用数据模型（Common Data Model，Dataverse）的文件夹中。数据流还允许你将你自己的\
  \ Azure Data Lake Gen2 存储中的数据公开给其他 Azure 服务。创建后，数据流必须至少刷新一次，以初始化 Azure Data Lake\
  \ Gen2 存储中的数据。数据流支持与数据集类似的设置，即你可以配置计划刷新并在刷新数据时使用网关。\n\n专用容量（例如 Premium）支持额外的数据流功能，例如：\n\
  \n- 增强的计算引擎，使数据流能够利用 `DirectQuery`\n- 刷新其他数据流中的链接表\n- **自动机器学习（AutoML）**和认知服务\n\n\
  ## 更多内容\n\n创建后，数据流可以在 Power BI Desktop 中用作数据源。要了解其工作原理，请执行以下操作：\n\n1. 打开新的 Power\
  \ BI Desktop 文件。\n2. 从**开始**选项卡的功能区中选择**获取数据**，然后选择 **Power BI 数据流**。\n3. 展开创建 **Products**\
  \ 数据流的工作区。\n4. 展开 **Products** 数据流。\n5. 选择 DimProduct 表，然后单击**加载**按钮。\n\n\n\n\n\
  DimProduct 表现已添加到数据集中。\n\n## 另请参阅\n\n- 数据流和自助数据准备简介：https://bit.ly/3uCjNZf\n- 创建数据流：https://bit.ly/2RiiGPV\n\
  - 配置和使用数据流：https://bit.ly/2RhIVHm\n- 数据流最佳实践：https://bit.ly/3cZIIQr\n- 数据流的限制和注意事项：https://bit.ly/3t2UChM\n\
  - 数据流的高级功能：https://bit.ly/3fZXLLA\n- 在 Power BI 中构建机器学习模型：https://bit.ly/3d1XGp7\n\
  - 将机器学习（认知服务）与数据流结合使用：https://bit.ly/3fT3nYk\n\n## 结论\n\nPower BI 服务提供了创建和共享其他 BI\
  \ 对象（如仪表板、应用、流式数据集和数据流）的功能；这些组件可以通过警报、订阅、图像和 Web 内容来丰富和增强。本章构建了 Power BI 仪表板，以提供对关键度量和高影响力业务活动的简单、一目了然的监控。本章还介绍了仪表板的独特功能，例如\
  \ Q&A 自然语言查询、数据警报，以及与其他报表类型（如 Excel 和 SSRS）的集成。最后，本章还涵盖了流式数据集和数据流的创建和使用。\n\n日期表应包含每个日历日期的单行记录（无间隙）。鉴于其规模较小（20\
  \ 年跨度包含最后一年约为 7,600 行），请包含所有必要的历史数据以及三年或更久的未来年份。\n\n## 如何构建维度表\n\n要实现此方案，请执行以下步骤：\n\
  \n- 1. 识别并记录日期维度所需的列，并找出与现有表之间的差距。\n\n  与其他维度表一样，团队通常可以通过附加逻辑随着时间的推移逐步改进其日期维度表。例如，如果绝大多数分析围绕会计日历并在特定粒度下进行，那么可以首先针对这些列。成熟的日期表——包括标准和财务日历、顺序代理列以及逻辑或动态列（如\
  \ Fiscal Period Status）——通常非常宽，有 40 多列。必需的日期维度列包括以下内容：\n\n  - 适用于标准和财务日历的 Prior\
  \ Year Date 和 Prior Period Date 列\n  - 所有级别的自然层次结构属性，例如 2013、2013-Q3、2013-Sep、2013-Wk39\
  \ 和 9/25/2013\n\n  自然层次结构（每个子值对应一个父值）允许用户通过向下钻取和下一级命令轻松导航 Power BI 报表视觉对象。如果没有自然层次结构，则在钻取到给定父级时会丢失父值的上下文。例如，向下钻取到\
  \ 2017 年将显示每个月的名称，但与此月关联的年份只能通过将鼠标悬停在图表上在工具提示中看到。有了自然层次结构，此上下文不会丢失，因为 Calendar Yr-Mo\
  \ 列可能包含诸如 2017-Aug 之类的值。\n\n  Power BI 提供了一种通过层次结构钻取功能中的“将所有级别向下展开一级”来处理报表视觉对象中非自然层次结构的方法。但是，当使用多个层次结构级别时，这可能导致轴标签过于密集。考虑到日期智能需求以及其他可视化的需求，建议构建日期表以支持自然层次结构。在构建自然层次结构时，请考虑构建以下支持列：\n\
  \n  - 一个整数列，对应于每个字符串列的按时间顺序，例如 Weekday。例如，一个 Weekday Number 列，其值为 1 到 7，将设置 Weekday\
  \ 的“排序依据”属性。\n  - 多个“X in Y”列，例如 Day in Year、Day in Month、Week in Month 和 Week in\
  \ Year，存储为整数。\n  - 指示器列，例如 Weekday Indicator、Holiday Indicator 和 Working Day Indicator。这些列的值应适合报表使用，例如\
  \ Holiday 和 Non-Holiday。\n  - 针对所支持的不同粒度的开始和结束日期列，例如 Week Ending Date 和 Period Ending\
  \ Date。\n\n- 2. 考虑将其他日历（如期间或会计日历）集成到源数据库中的同一日期表中。可以创建不同的视图以支持角色扮演维度。参见“还有更多……”一节。\n\
  \n- 3. 识别现有报表中或业务用户在 Excel 或 Power BI 中进行的常见日期操作，并考虑添加日期维度列以消除或简化此工作。\n\n- 4. 确保日期列（例如，Prior\
  \ Year Date）和数字列（例如 Calendar Year）分别存储为日期和整数数据类型，因为这允许算术和 DAX 函数（如 MAX 和 MIN）在不进行任何类型转换的情况下运行。\n\
  \n  如果日期维度表作为数据仓库提取-转换-加载（ETL）过程的一部分每天更新，则标识当前期间和先前期间的列（如 IsCurrentFiscalPeriod\
  \ 和 IsPrior60Days）也很常见。\n\n- 5. 考虑向关系数据库中存储的日期表添加两列：一个自然层次结构字符串（例如 2009-Jan）和一个整数列（例如\
  \ Calendar Year Month Number (200901)）。\n\n- 6. 创建一个包含三列的表：Calendar Year、Calendar\
  \ Month Number 以及一个增量值为 1 的标识列 Calendar Yr Mo Index：\n\n```sql\nCreate Table dbo.TempTblYearMo\n\
  ( [Calendar Year] int not null\n, [Calendar Month Number] tinyint not null\n, [Calendar\
  \ Yr Mo Index] smallint identity(1,1) not null)\n```\n\n- 7. 执行一条 INSERT INTO SQL\
  \ 语句以加载此表。\n\n- 8. 对现有日期表中的 Calendar Year 和 Calendar Month Number 列执行 SELECT、GROUP\
  \ BY 和 ORDER BY。\n\n  SELECT 语句的 ORDER BY 子句应按 Calendar Year，然后按 Calendar Month\
  \ Number 排序。临时表的索引列（Calendar Yr Mo Index）现在按月跨年按顺序填充，如图 6.1 所示。\n\n| Calendar Year\
  \ | Calendar Month Number | Calendar Yr Mo Index |\n| 2016 | 11 | 95 |\n| 2016 |\
  \ 12 | 96 |\n| 2017 | 1 | 97 |\n| 2017 | 2 | 98 |\n\n图 6.1：通过 INSERT INTO 语句加载的\
  \ TempTblYearMo 表\n\n- 9. 执行一条 UPDATE 语句，用标识值填充 `Calendar Year Month Number` 列：\n\
  \n```sql\nUPDATE DBO.DimFinDateTestTbl\nSET [Calendar Year Month Number] = T.[Calendar\
  \ Yr Mo Index]\nFROM\nDBO.DimFinDateTestTbl as D INNER JOIN dbo.TempTblYearMo as\
  \ T\nON D.[Calendar Year] = T.[Calendar Year] AND D.[Calendar Month Number] = T.[Calendar\
  \ Month Number]\n```\n\n图 6.2 中的以下查询显示了日期表中依次递增的 `Calendar Year Month Number` 列。\n\
  \n| Date | Calendar Yr-Mo | Calendar Year Month Number |\n| 2017-12-30 | 2017-Dec\
  \ | 108 |\n| 2017-12-31 | 2017-Dec | 108 |\n| 2018-01-01 | 2018-Jan | 109 |\n| 2018-01-02\
  \ | 2018-Jan | 109 |\n\n图 6.2：更新了 Calendar Year Month Number 列的日期表\n\n- 10. 对其他自然层次结构列（如\
  \ Year-Qtr 和 Year-Wk）重复此过程，然后删除临时表。\n\n- 11. 加载到模型后，应将代理列从报表视图中隐藏，并用作“排序依据”列。\n\n\
  - 12. 按照*创建层次结构和组*中的方法（在*第 3 章 构建 Power BI 数据模型*中介绍）在字段列表中实现层次结构。\n\nSQL 窗口函数有助于创建某些“X\
  \ in Y”日期维度列。例如，以下 DENSE_RANK 函数返回给定日历月份的日历周编号：\n\n```sql\nOVER(PARTITION BY D.[CALENDAR\
  \ YEAR MONTH NUMBER] ORDER BY D.[Calendar Week Number in Year])\n```\n\n对于 DirectQuery\
  \ 数据模型（其中定义模型表的 SQL 查询在运行时执行），最好将尽可能多的数据转换逻辑移回源系统。复杂的 SQL 查询、DAX 计算列和 M 查询表达式逻辑都可能导致低效的查询计划，从而对\
  \ DirectQuery 解决方案的性能产生负面影响。\n\n\n\n## 工作原理...\n\n日期智能度量通过引用代理键列，可以轻松定义特定的时间段筛选条件，例如在\
  \ Internet Net Sales (Trailing 3 Periods) 中：\n\n```\nInternet Net Sales (Trailing\
  \ 3 Periods) =\n    CALCULATE(\n        [Internet Net Sales],\n        FILTER(\n\
  \            ALL('Date'),\n            'Date'[Calendar Year Month Number] >=\n \
  \               MAX('Date'[Calendar Year Month Number])-2\n            &&\n    \
  \        'Date'[Calendar Year Month Number] <=\n                MAX('Date'[Calendar\
  \ Year Month Number])\n        )\n    )\n```\n\nInternet Net Sales (Trailing 3 Periods)\
  \ 可用于视觉对象，如图 6.3 所示。\n\n| Calendar Yr-Mo | Calendar Year Month Number | Internet\
  \ Net Sales | Internet Net Sales (Trailing 3 Periods) |\n|---|---|---|---|\n| 2017年5月\
  \ | 101 | $1,169,589 | $3,265,519 |\n| 2017年4月 | 100 | $1,046,023 | $2,867,279 |\n\
  | 2017年3月 | 99 | $1,049,907 | $2,678,946 |\n\n图 6.3：Trailing 3 Periods 度量包含 2017\
  \ 年 5 月的 Calendar Year Month Number 值 99 到 101。\n\n如果 Calendar Year Month Number\
  \ 列不是顺序的，则无法在不使用复杂逻辑的情况下引用跨年月份，例如 2017 年 1 月的尾随三个月平均值。请注意，在此示例中，2017 年 5 月是当前月份，因此已包含在内，但通常在这些计算中仅包含已完成（或之前的）月份。\n\
  \n数据模型使用的 SQL 视图应动态筛选所需日期，例如过去三年：\n\n```\nFROM DBO.DimFinDate as D\nWHERE\nD.[Date]\
  \ BETWEEN DATEADD(YEAR,-3,CAST(CURRENT_TIMESTAMP AS date)) AND CAST(CURRENT_TIMESTAMP\
  \ as date)\n```\n\n在此示例中，仅将当前系统日期和之前三个日历年度加载到数据模型中。\n\n## 更多内容...\n\n通过 *第 3 章：构建\
  \ Power BI 数据模型* 中描述的 USERELATIONSHIP 函数来使用“次要关系”（非活动关系），其替代方案是在数据模型中包含多个日期维度表，每个表都基于事实表的不同日期列具有单个活动关系。例如，模型可以包含\
  \ Order Date、Ship Date 和 Delivery Date 维度表。这种方法称为**角色扮演表**，可减少必须在模型中开发和维护的自定义度量数量。如果选择此方法，请针对源日期维度表创建与每个角色扮演表对应的单独视图。在每个视图中应用列别名，将属性与日期关联（例如，Ship\
  \ Date Year 或 Ship Date Month）。\n\n如果源事实表仅包含代理键（通常为 YYYYMMDD 格式），数据模型使用的源视图可以包含以下转换逻辑：\n\
  \n```\n`CONVERT(date, (CAST(F.OrderDateKey AS nvarchar(8)))) as [Order Date-Convert]`\n\
  ```\n\nSQL Server 中的 DATEFROMPARTS 函数可用于许多其他日期转换或逻辑需求。\n\n作为一般做法，我们建议在企业数据仓库系统（如\
  \ Azure Synapse Analytics）中开发单个日期维度表，并在多个数据集中利用此维度。在许多情况下，针对特定业务流程和团队的 Power BI\
  \ 数据集需要自定义日期筛选或分组，而数据仓库中现有的日期维度表不支持这些。在这些场景中，可以将额外逻辑合并到特定于数据集的 SQL 视图对象中；或者，如果该需求预计在多个数据集中很常见，则可以将新逻辑或列构建到数据仓库维度表中。\n\
  \n## 通过查询编辑器准备日期维度\n\n在某些 BI 环境中，按照之前的方案修改源日期表，甚至修改用于加载日期维度表的 SQL 视图，是不可行的。在这些情况下，Power\
  \ BI Desktop 的查询编辑器和 M 表达式可以作为有效的替代方案，提供驱动强大日期智能分析所需的相同列。\n\n在本方案中，将分享一个示例日期维度 M\
  \ 查询，该查询构建常见日期属性以及动态逻辑列。此外，还包含通过 M 表达式添加顺序日期智能列的过程。\n\n## 准备工作\n\n要准备此方案，请执行以下操作：\n\
  \n- 从以下 GitHub 仓库下载 CH6_DateTable.xlsx：https://github.com/PacktPublishing/Microsoft-Power-BI-Cookbook-Second-Edition\n\
  \n## 如何准备日期维度\n\n要实现此方案，请执行以下步骤：\n\n- 1. 创建新的 Power BI Desktop 文件。\n- 2. 通过单击“开始”选项卡功能区中的“转换数据”打开\
  \ Power Query 编辑器。\n- 3. 创建一个从 CH6_DateTable.xlsx 导入 Dates 工作表的查询，并将此查询命名为 BaseDateTable。\n\
  - 4. 创建一个引用 BaseDateTable 查询的 M 查询，该查询检索最近三年的日期，并通过 M 函数计算 11 个附加列：\n\n```\nlet\n\
  \    Dates = BaseDateTable,\n    CurrentDate = DateTime.Date(DateTime.LocalNow()),\n\
  \    CurrentYear = Date.Year(DateTime.Date(DateTime.LocalNow())),\n    CurrentMonth\
  \ = Date.Month(DateTime.Date(DateTime.LocalNow())),\n    FilteredDates =\n     \
  \   Table.SelectRows(\n            Dates,\n            each [Date] >= Date.AddYears(CurrentDate,-3)\
  \ and [Date] <= CurrentDate\n        ),\n    DateCol = Table.SelectColumns(FilteredDates,\"\
  Date\"),\n    YearCol =\n        Table.AddColumn(\n            DateCol, \"Year\"\
  , each Date.Year([Date]), Int64.Type\n        ),\n    MonthNameCol =\n        Table.AddColumn(\n\
  \            YearCol, \"Month Name\", each Date.MonthName([Date]), type text\n \
  \       ),\n    YearMonthCol =\n        Table.AddColumn(\n            MonthNameCol,\
  \ \"Year-Mo\",\n            each Text.From([Year]) & \"-\" & [Month Name], type\
  \ text\n```\n\n```\nMonthNumberCol =\n    Table.AddColumn(\n        YearMonthCol,\
  \ \"Month Number\", each Date.Month([Date]),\n        Int64.Type\n    ),\nWeekdayNameCol\
  \ =\n    Table.AddColumn(\n        MonthNumberCol, \"Weekday\", each Date.DayOfWeekName([Date]),\n\
  \        type text\n    ),\nDayNumberOfWeekCol =\n    Table.AddColumn(\n       \
  \ WeekdayNameCol, \"Weekday Number\",\n        each Date.DayOfWeek([Date]), Int64.Type\n\
  \    ),\nYearStatusCol =\n    Table.AddColumn(DayNumberOfWeekCol, \"Year Status\"\
  , each\n        if Date.IsInCurrentYear([Date]) = true then \"Current Year\"\n \
  \       else if [Year] = [CurrentYear] - 1 then \"Prior Year\"\n        else \"\
  Other Year\", type text\n    ),\nMonthStatusCol =\n    Table.AddColumn(YearStatusCol,\
  \ \"Month Status\", each\n        if [Year Status] = \"Current Year\" and [Month\
  \ Number] = CurrentMonth\n        then \"Current Month\" else\n        if [Year]\
  \ =\n            Date.Year(\n                Date.AddMonths(DateTime.Date(DateTime.LocalNow()),\
  \ -1)\n            )\n            and [Month Number] =\n                Date.Month(\n\
  \                    Date.AddMonths(DateTime.Date(DateTime.LocalNow()), -1)\n  \
  \              )\n        then \"Prior Month\" else \"Other Month\", type text\n\
  \    ),\nDayInMonthCol =\n    Table.AddColumn(\n        MonthStatusCol, \"Day in\
  \ Month\", each Date.Day([Date]),\n        Int64.Type\n    ),\nWeekOfYearCol =\n\
  ```\n\n```\nTable.AddColumn(\n    DayInMonthCol, \"Week of Year\", each Date.WeekOfYear([Date]),\n\
  \    Int64.Type\n),\nWeekOfMonthCol =\n    Table.AddColumn(\n        WeekOfYearCol,\
  \ \"Week of Month\",\n        each Date.WeekOfMonth([Date]), Int64.Type\n    )\n\
  in\n    WeekOfMonthCol\n```\n\n- 5. 将此查询命名为 `DatesInterim`。\n- 6. 创建一个名为 `Dates`\
  \ 的新查询，该查询添加一个用于日期智能度量的代理顺序列：\n\n```\nlet\n    Source = BaseDateTable,\n    YearMonthCols\
  \ =\n        Table.Distinct(\n            Table.SelectColumns(\n               \
  \ Source, {\"Calendar Year\", \"Calendar Month Number\"}\n            )\n      \
  \  ),\n    YearMonthColSort =\n        Table.Sort(\n            YearMonthCols,\n\
  \            {\n                {\"Calendar Year\", Order.Ascending},\n        \
  \        {\"Calendar Month Number\", Order.Ascending}\n            }\n        ),\n\
  \    YearMonthColIndex =\n        Table.AddIndexColumn(YearMonthColSort, \"YearMonthIndex\"\
  , 1, 1),\n    JoinedDateTable =\n        Table.NestedJoin(\n            DatesInterim,\
  \ {\"Year\", \"Month Number\"},\n            YearMonthColIndex, {\"Calendar Year\"\
  , \"Calendar Month Number\"},\n            \"Year-Mo Index\", JoinKind.Inner\n \
  \       ),\n    IndexColumnAdded =\n        Table.ExpandTableColumn(\n         \
  \   JoinedDateTable,\n            \"Year-Mo Index\", {\"YearMonthIndex\"}, {\"Year\
  \ Month Number\"}\n        )\n```\n\n\n```\nin\nIndexColumnAdded\n```\n\n- 7. 右键单击查询并取消选中“启用加载”，以禁用\
  \ BaseDateTable 和 DatesInterim 的加载。只有 Dates 查询需要加载到数据模型中。\n\n### 工作原理...\n\n对于 DatesInterim\
  \ 查询，可以将 CurrentDate、CurrentMonth 和 CurrentYear 表达式存储为单独的查询。DateTime.LocalNow 函数用于动态\
  \ M 日期逻辑，类似于 SQL 语句中使用的 CURRENT_TIMESTAMP 函数。通过 Table.SelectRows 函数应用筛选，仅检索最近三年的日期，并使用条件逻辑填充动态的\
  \ Year Status 和 Month Status 列（例如 Current Year）。其余表达式使用 Date 对象类的函数或连接列。\n\n尽管源系统中有一个极简日期表（只需包含日期的列），M\
  \ 查询仍会为模型生成一个有用的日期维度表，其中包含许多最常见和最重要的列。\n\n对于最终的 Dates 查询，使用了两个额外的列（Calendar Year\
  \ 和 Calendar Month Number），尽管我们可以使用 DatesInterim 查询中的 Year 和 Month Number 列执行自联接查询。例如，如果我们将\
  \ Dates 查询重命名为 DatesInterim2，我们还可以创建最终的 Dates 表，为 Year Week Number 添加顺序索引：\n\n```\
  \ \nlet\n    Source = DatesInterim2,\n    YearMonthWeekCols =\n        Table.Distinct(\n\
  \            Table.SelectColumns(\n                Source, {\"Year\", \"Month Number\"\
  , \"Week of Year\"}\n            )\n        ),\n    YearMonthWeekColSort =\n   \
  \     Table.Sort(\n            YearMonthWeekCols,\n            {\n             \
  \   {\"Year\", Order.Ascending},\n                {\"Month Number\", Order.Ascending},\n\
  \                {\"Week of Year\", Order.Ascending}\n            }\n        ),\n\
  YearMonthWeekColIndex =\n    Table.AddIndexColumn(YearMonthWeekColSort, \"YearMonthWeekIndex\"\
  ,1,1),\nJoinedDateTable =\n    Table.NestedJoin(\n        DatesInterim2,{\"Year\"\
  , \"Month Number\", \"Week of Year\"},\n        YearMonthWeekColIndex, {\"Year\"\
  , \"Month Number\", \"Week of Year\"},\n        \"Year-Mo-Wk Index\", JoinKind.Inner\n\
  \    ),\nIndexColumnAdded =\n    Table.ExpandTableColumn(\n        JoinedDateTable,\n\
  \        \"Year-Mo-Wk Index\", {\"YearMonthWeekIndex\"},{\"Year Month Week Number\"\
  }\n    )\nin\n    IndexColumnAdded\n```\n\nTable.AddIndexColumn 函数应用于排序后的 DatesInterim2\
  \ 表，以创建顺序列 YearMonthWeekColIndex。然后将 DatesInterim2 查询与包含此新列的表联接。最后，使用 Table.ExpandTableColumn\
  \ 函数展开联接后的表。\n\nYear-Mo 列（即 2016-Dec）现在可以在数据模型中按 Year Month Number 列排序，DAX 度量可以引用\
  \ Year Month Number 列来应用日期智能筛选条件，例如最近六个月。\n\n### 更多内容...\n\n本配方中使用的 Table.AddIndexColumn\
  \ 函数目前不支持 SQL Server 的 DirectQuery 模式，因此本配方“日期维度 M 查询”部分中的完整 M 查询不能在 DirectQuery\
  \ 数据模型中使用。\n\n由于 DirectQuery 模型中定义维度表和事实表的数据访问查询在运行时执行，因此这些查询应尽可能简单。例如，这些查询应避免联接、派生表、子查询、数据类型转换、CASE\
  \ 语句等。对于访问模型中最大表的查询，简单、高效或优化的查询尤为重要。为确保 DirectQuery 模型在 Power BI 中具有足够性能，应使用 SQL\
  \ Server 列存储索引和表分区等功能，对 DirectQuery 模型的大型源表进行读取性能优化。\n\n### 另请参阅\n\n- Power Query\
  \ 日期函数：https://bit.ly/3wSCMAz\n- Power Query 表函数：https://bit.ly/3wMx1mC\n\n## 编写日期智能度量\n\
  \n有了完整的日期维度表，就可以开发日期智能度量，以支持常见需求，例如年初至今、同比和滚动历史，以及更复杂的、特定于上下文的行为。\n\n本配方中描述的日期智能模式适用于标准和非标准财务日历，因为它们利用了基本的\
  \ DAX 函数以及本章前面创建的顺序日期智能列。\n\n本配方包括核心的年初至今和上一年度度量示例，以及一个更高级的动态上期度量，该度量可适应日期维度的所有粒度。\n\
  \n### 准备工作\n\n要为此配方做准备，请执行以下步骤：\n\n- 1. 完成本章中的“通过查询编辑器准备日期维度”配方，或者拥有一个与该配方具有相同列的日期表。\n\
  \n- 2. 编辑 DatesInterim 查询的初始部分，以加载所有行，而不仅仅是前三年。下面的代码片段表示删除了 FilteredDates 表达式后的查询初始部分。查询的其余部分与本配方相同。请注意，DateCol\
  \ 表达式现在引用 Dates 表达式，而不是 FilteredDates 表达式：\n\n``` \nDates = BaseDateTable,\nCurrentDate\
  \ = DateTime.Date(DateTime.LocalNow()),\nCurrentYear = Date.Year(DateTime.Date(DateTime.LocalNow())),\n\
  CurrentMonth = Date.Month(DateTime.Date(DateTime.LocalNow())),\nDateCol = Table.SelectColumns(Dates,\"\
  Date\"),\n```\n\n- 3. 使用以下代码，在 DatesInterim 查询末尾添加两个额外列，用于 Prior Year Date 和 Prior\
  \ Month Date：\n\n``` \nPriorYearDate =\n    Table.AddColumn(\n        WeekOfMonthCol,\
  \ \"Prior Year Date\", each Date.AddYears([Date],-1)\n    ),\nPriorMonthDate =\n\
  Table.AddColumn(\n    PriorYearDate, \"Prior Month Date\", each Date.\n    AddMonths([Date],-1)\n\
  )\nin\n    PriorMonthDate\n```\n\n- 4. 从 AdventureWorksDW2019 数据库导入 FactInternetSales\
  \ 表。\n\n- 5. 在 Dates 表的 Date 列与 FactInternetSales 表的 OrderDate 列之间创建关系。\n\n- 6.\
  \ 使用 Date 列将 Dates 表标记为日期表。\n\n规划一个标准度量命名约定，以标识日期智能逻辑，例如 Sales (PYTD)。货币（$）或百分比（%）等符号字符也可以帮助用户浏览度量。记录要实现的日期智能度量类型以及应用到模型的哪些度量。创建日期智能度量矩阵，用于文档记录并支持与利益相关者的沟通。\n\
  \n| 日期智能度量 | YTD | MTD | WTD | PY | PM | PMTD | YOY | YOY % | YOY YTD % | 滚动 12\
  \ 个月 |\n|---|---|---|---|---|---|---|---|---|---|---|\n| Internet Sales | ✓ | ✓\
  \ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |\n| Internet Orders | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |\
  \ ✓ | ✓ | ✓ | ✓ |\n| Reseller Sales | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |\n\n\
  图 6.4：日期智能度量矩阵\n\n在设计报告时，与业务用户一起进行审查和/或质量保证测试，以验证逻辑并演练用例。由于需要开发的新度量数量众多，最好先让业务人员批准一两个度量，然后再将日期智能逻辑应用于其他度量。\n\
  \n### 如何编写日期智能度量\n\n要实现此配方，请执行以下步骤：\n\n- 1. 创建一个简单的 Internet Sales 度量：\n\n``` \n\
  Internet Sales = SUM('FactInternetSales'[SalesAmount])\n```\n\n- 2. 创建年初至今 (YTD)、月初至今\
  \ (MTD) 和周至今 (WTD) 度量：\n\n``` \nInternet Sales (YTD) =\n    CALCULATE([Internet\
  \ Sales],\n        FILTER(ALL('Dates'),\n            'Dates'[Year] = MAX('Dates'[Year])\
  \ &&\n            'Dates'[Date] <= MAX('Dates'[Date])\n        )\n    )\n\nInternet\
  \ Sales (MTD) =\n    CALCULATE([Internet Sales],\n        FILTER(ALL('Dates'),\n\
  \            'Dates'[Year Month Number] = MAX('Dates'[Year Month Number]) &&\n \
  \           'Dates'[Date] <= MAX('Dates'[Date])\n        )\n    )\n\nInternet Sales\
  \ (WTD) =\n    CALCULATE([Internet Sales],\n        FILTER(ALL('Dates'),\n     \
  \       'Dates'[Year Week Number] = MAX('Dates'[Year Week Number]) &&\n        \
  \    'Dates'[Date] <= MAX('Dates'[Date])\n        )\n    )\n```\n\n- 3. 创建上一年度 (PY)、上一年度至今\
  \ (PYTD) 和上月至今 (PMTD) 度量：\n\n``` \nInternet Sales (PY) =\n    CALCULATE([Internet\
  \ Sales],\n        FILTER(ALL('Dates'),\n            'Dates'[Date] >= MIN('Dates'[Prior\
  \ Year Date]) &&\n            'Dates'[Date] <= MAX('Dates'[Prior Year Date])\n \
  \       )\n    )\n\nInternet Sales (PYTD) =\n    CALCULATE([Internet Sales],\n \
  \       FILTER(ALL('Dates'),\n            'Dates'[Year] = MAX('Dates'[Year]) - 1\
  \ &&\n            'Dates'[Date] <= MAX('Dates'[Prior Year Date])\n        )\n  \
  \  )\n\nInternet Sales (PMTD) =\n    CALCULATE([Internet Sales],\n        FILTER(ALL('Dates'),\n\
  \            'Dates'[Year Month Number] = MAX('Dates'[Year Month Number]) - 1 &&\n\
  \            'Dates'[Date] <= MAX('Dates'[Prior Month Date])\n        )\n    )\n\
  ```\n\n- 4. 使用当前年度和上一年度度量创建同比 (YOY) 度量：\n\n``` \nInternet Sales (YOY YTD) = [Internet\
  \ Sales (YTD)] - [Internet Sales (PYTD)]\n\nInternet Sales (YOY YTD %) = DIVIDE([Internet\
  \ Sales (YOY YTD)],[Internet Sales (PYTD)])\n```\n\n\n-   5. 在日期智能度量中构建逻辑，以处理替代性小计筛选上下文，例如，在年度、季度或周小计上下文中计算上一期间度量时：\n\
  \n```\nInternet Sales (Prior Period) =\n    VAR Periods = DISTINCTCOUNT('Dates'[Year\
  \ Month Number])\n    RETURN SWITCH(TRUE,\n        HASONEVALUE('Dates'[Date]),\n\
  \            CALCULATE([Internet Sales],\n                FILTER(ALL('Dates'),'Dates'[Date]\
  \ = MAX('Dates'[Date])-1)),\n        HASONEVALUE('Dates'[Year Week Number]),\n \
  \           CALCULATE([Internet Sales],\n                FILTER(ALL('Dates'),\n\
  \                    'Dates'[Year Week Number] = MAX('Dates'[Year Week Number])-1)),\n\
  \        CALCULATE([Internet Sales],\n            FILTER(ALL('Dates'),\n       \
  \         'Dates'[Year Month Number] >= MIN('Dates'[Year Month Number]) - Periods\
  \ &&\n                'Dates'[Year Month Number] <= MAX('Dates'[Year Month Number]\
  \ - Periods )))\n```\n\n-   6. 创建一个矩阵可视化，使用 Dates 表中的 Year 列作为列，并将 Internet Sales\
  \ (YTD) 和 Internet Sales (PYTD) 作为值。\n\n## 工作原理...\n\n在设计日期智能度量时，重要的是要理解“当前”和“上一期间”的定义是由度量所在的可视化上下文决定的。FILTER\
  \ 函数会遍历每一行（一个日期），以确定哪些行被传递给 CALCULATE 函数。ALL 函数会移除所有现有的日期表筛选器，从而使度量中的筛选条件能够访问日期表的所有行。\n\
  \n对于“当前”日期期间度量，每个度量表达式在表示目标粒度的列上设置“等于”条件；该列通过 MAX 尊重报表查询的筛选上下文。如果对日期表的源查询被筛选为仅检索小于或等于当前日期的日期，则这些度量在添加到报表时将默认为当前年份、月份（或期间）和周。\n\
  \n请注意，Year Month Number 和 Year Week Number 列应为顺序递增的整数。\n\n对于“上一期间”日期期间度量，对上一日期列同时应用\
  \ MIN 和 MAX 筛选条件，可以选择相应的日期范围。从列的 MAX 中减去一个值（在此示例中为 1）会将所选时间段向后移动。\n\n增长或差异度量用于计算度量的当前时间段值与上一时间段（如同比（YOY）增长）之间的差异，可以通过创建新度量来实现，这些新度量从当前期间度量中减去上一期间度量。以百分比表示的其他增长或差异度量可以使用\
  \ DIVIDE 函数来计算该差异占上一期间值的百分比。\n\n上一期间日期列允许上一时间段度量相对于活动日期筛选上下文应用简单的筛选表达式，直到单个日期粒度。在没有这些列的情况下，对于期间级或月级日期表，度量筛选条件可以编写如下：\n\
  \n```\nPrior Year (PY) = 'Dates'[Year Month Number] = MAX('Dates'[Year Month Number]\
  \ - 12)\nPrior Month (PM) = 'Dates'[Year Month Number] = MAX('Dates'[Year Month\
  \ Number]) - 1)\n```\n\n对于动态上一期间度量 Internet Sales (Prior Period)，DAX 变量（Periods）计算当前筛选上下文中的期间数，例如，如果小计为年则为\
  \ 12，如果为季度则为 3，如果为单个期间则为 1。使用 HASONEVALUE 的测试条件检查是否选择了单个日期或周，并分别返回相应的前一天或上一周。其余日期粒度（年、季度、期间）由\
  \ Periods 变量处理；该值会从给定上下文的期间编号的 MIN 和 MAX 中减去。此示例强调了顺序日期智能列在跨粒度访问特定时间范围以应用自定义筛选条件方面的重要性。\n\
  \n## 更多内容...\n\nDAX 包含一整套时间智能函数，如 DATESYTD 和 SAMEPERIODLASTYEAR，在给定标准（公历）日历的情况下，这些函数可以计算出与本配方中的表达式相同的值。尽管这些函数通常比本配方中的示例更具可读性，但在使用非标准日历时（如会计日历和更复杂的场景），使用（并了解）核心\
  \ DAX 函数（如 FILTER、MAX 和 MIN）是必要的。考虑到绝大多数 DAX 时间智能函数只是 FILTER 函数和关于日历日期的简化假设的语法糖，在许多实际场景中依赖\
  \ DAX 时间智能函数发挥任何有意义的作用是不明智的。\n\n对于许多刚接触商业智能的人来说，组织衡量和概念化时间的方式如此不同，常常令人惊讶；这在星期方面尤其如此。在这里，DAX\
  \ 时间智能函数再次无用，因为没有包含任何周函数。在处理周时，不同的组织会在一个星期内的不同日期开始一周。因此，在按年或按月粒度分配周数时，务必牢记这一点。\n\
  \n此外，不同组织对不完整周的处理方式也不同。例如，在最终的 Dates 表中，有一个 Year Week Number 为 54 的条目。这是因为 2010\
  \ 年以一个不完整的第 53 周结束。这一周中的单独一天，即 2011 年 1 月 1 日（星期六），不属于 2010 年。组织对这些不完整周的处理方式各不相同，可能会将该单独的一天作为\
  \ 2010 年开始的那一周的一部分，或将其作为独立的一周，或作为 2011 年第一个完整周的一部分。\n\n## 另请参阅\n\n-   - DAX FILTER\
  \ 函数：https://bit.ly/2Q1S45q\n-   - DAX HASONEVALUE 函数：https://bit.ly/3wXSEBE\n-\
  \   - DAX 时间智能函数：https://bit.ly/3mKWtWp\n-   - 让时间智能**见鬼**去吧：https://bit.ly/3gaUHN6\n\
  \n## 开发高级日期智能度量\n\n日期智能度量通常处于最引人注目的 Power BI 报表和仪表板以及更复杂的业务分析的中心。因此，考虑到每个组织和 BI\
  \ 项目的独特要求，了解如何超越前一配方中描述的标准模式以有效地嵌入自定义逻辑非常重要。此外，回答业务问题“X 何时发生（或未发生）？”的能力是对数据模型的有力补充，可以通过\
  \ DAX 度量逻辑加以支持。\n\n在本配方中，提供了一个度量示例，用于识别特定区域和产品类别未记录销售信息的日期。此外，还描述了一个自定义的上一期间年初至今（YTD）度量，该度量具有默认（无筛选）行为，并排除当前年份中的不完整期间。\n\
  \n## 准备工作\n\n要准备此配方，请按照以下步骤操作：\n\n-   1. 打开 Power BI Desktop。\n-   2. 完成本章中的“通过查询编辑器准备日期维度”配方。\n\
  -   3. 创建一个名为 AdworksDw 的导入模式数据源查询。此查询应类似于以下内容：\n\n```\nlet\n    Source = Sql.Database(\"\
  localhost\\MSSQLSERVERDEV\",\n```\n\n\"AdventureWorksDW2019\")\nin\n    Source\n\
  \n-   4. 将此查询隔离到一个名为 `Data Sources` 的查询组中，并禁用加载。\n-   5. 右键单击 `AdWorksDW`，然后选择“引用”。\n\
  -   6. 选择 `FactInternetSales` 表，并将此查询命名为 `Internet Sales`。\n-   7. 对 `DimSalesTerritory`\
  \ 表重复步骤 5 和 6，并将此查询命名为 `Sales Territories`。\n-   8. 基于 `DimProduct`、`DimProductCategory`\
  \ 和 `DimProductSubcategory` 表，使用以下代码创建一个 Products 查询。\n\n```\nlet\n    Source =\
  \ AdWorksDW,\n    Navigation = Source{[Schema=\"dbo\",Item=\"DimProduct\"]}[Data],\n\
  \    Subcategory =\n        Table.ExpandRecordColumn(\n            Navigation, \"\
  DimProductSubcategory\",\n            {\"EnglishProductSubcategoryName\", \"DimProductCategory\"\
  },\n            {\"Product Subcategory\", \"DimProductCategory\"}\n        ),\n\
  \    Category =\n        Table.ExpandRecordColumn(\n            Subcategory, \"\
  DimProductCategory\",\n            {\"EnglishProductCategoryName\"}, {\"Product\
  \ Category\"}\n        )\nin\n    Category\n```\n\n-   9. 将事实查询 `Internet Sales`\
  \ 分离到一个 Facts 查询组中。\n-   10. 将维度查询 `Dates`、`Sales Territories` 和 `Products` 分离到一个\
  \ Dimensions 查询组中。\n-   11. 在 Other Queries 组中创建一个名为 `Calculations` 的空白查询。\n-  \
  \ 12. 在“主页”选项卡的功能区中选择“关闭并应用”，将表加载到数据模型中。\n-   13. 使用 Dates 表中的 Date 列和 Internet\
  \ Sales 表中的 OrderDate 列创建关系。\n-   14. 使用 ProductKey 列和 SalesTerritoryKey 列，分别在 Internet\
  \ Sales 表与 Products 表、Sales Territories 表之间创建关系。\n-   15. 将 Dates 表中 Year-Mo 列的“排序依据”列设置为\
  \ Year Month Number 列。\n\n\n\n\n## 如何开发高级日期智能度量值\n\n要实现本方案，请执行以下步骤：\n\n1. 创建一个度量值，用于计算在以下条件下没有对应事实表行的行（天）数：\n\
  \n```dax\nDays Without Northwest Bike Sales =\n    COUNTROWS(\n        FILTER('Dates',\n\
  \            ISEMPTY(CALCULATETABLE('Internet Sales',\n                FILTER(CROSSJOIN(ALL('Sales\
  \ Territories'),ALL('Products')),\n                    'Sales Territories'[SalesTerritoryRegion]\
  \ = \"Northwest\" &&\n                    'Products'[Product Category] = \"Bikes\"\
  )))))\n```\n\n2. 创建一个 Power BI 报表可视化对象来分析该度量值。执行此操作的结果如图 6.5 所示。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_316_0.png)\n\
  \n图 6.5：2013 年中西北地区未产生任何自行车销售额的 22 天\n\n### 工作原理...\n\n在本示例中，新的度量值必须计算西北销售区域未产生任何自行车产品类别在线销售额的天数。通过\
  \ CROSSJOIN 与 ALL 子句的组合，移除了 Product 和 Sales Territory 表上的任何现有筛选器。然后，对 Internet Sales\
  \ 事实表按西北区域和自行车类别进行筛选，并对筛选上下文中的每个日期应用 ISEMPTY。FILTER 仅返回没有行的日期进行计数。\n\n使用 CROSSJOIN\
  \ 是必要的，因为需要移除模型中不同表的列上的筛选器。单个 ALL 函数可用于移除单个表筛选上下文中的一个或多个列，例如 ALL('Product'[Product\
  \ Color], 'Product'[Product Class])。\n\n### 更多内容...\n\n前期日期智能度量值可能变得相当复杂。例如，考虑这样一种场景：对于月度粒度的上年截至当前日期（Prior\
  \ Year-to-Date）度量值，业务要求仅按当前年度已完成的期间来筛选上一年度（仅将已完成期间与已完成期间进行比较）。目标是自动计算上年截至当前日期值（仅已完成期间），而无需在报表中使用任何日期列，并且如果在报表视觉对象中选择了未完成的当前期间，则返回空值。要实现此度量值，请执行以下步骤：\n\
  \n1. 在 Calculations 表中，创建以下度量值：\n\n```dax\nToday = DATE(2013,6,28)\nCurrent Year\
  \ = LOOKUPVALUE('Dates'[Year], 'Dates'[Date],[Today])\nCurrent Period = LOOKUPVALUE('Dates'[Year\
  \ Month Number],'Dates'[Date],[Today])\nLast Complete Period = [Current Period]\
  \ - 1\nLast Complete Month = LOOKUPVALUE('Dates'[Month Number],'Dates'[Year Month\
  \ Number],[Last Complete Period])\nInternet Sales = SUM('FactInternetSales'[SalesAmount])\n\
  ```\n\n2. 在“报表视图”中隐藏 Calculations 表。\n\n3. 在 Calculations 表中创建一个度量值，其中包含多对条件和结果，以应对不同的筛选上下文和需求：\n\
  \n```dax\nSales (PYTD-Custom) =\nSWITCH(TRUE(),\n    NOT(ISCROSSFILTERED('Dates')),\n\
  \    CALCULATE([Internet Sales],\n        FILTER(ALL('Dates'),\n            'Dates'[Year]\
  \ = [Current Year]-1 &&\n            'Dates'[Month Number] <= [Last Complete Month])),\n\
  \    HASONEVALUE('Dates'[Year Month Number]) &&\n    MAX('Dates'[Year Month Number])\
  \ > [Last Complete Period],BLANK(),\n    HASONEVALUE('Dates'[Year Month Number])\
  \ &&\n    MAX('Dates'[Year Month Number]) <= [Last Complete Period],\n    CALCULATE([Internet\
  \ Sales],\n        FILTER(ALL('Dates'),'Dates'[Year] = MAX('Dates'[Year])-1 &&\n\
  \        'Dates'[Year Month Number] <= MAX('Dates'[Year Month Number])-12))\n)\n\
  ```\n\n- DAX CROSSJOIN 函数：https://bit.ly/2Ryr3qx\n- DAX HASONEVALUE 函数：https://bit.ly/3wXSEBE\n\
  \n## 使用 DAX 和计算表简化日期智能\n\n除了本章前面描述的 M 查询转换之外，DAX 表函数也可以用于 Power BI 导入模式模型，以增强和简化日期智能。DAX\
  \ 查询可以访问数据模型中的现有表，刷新期间计算出的表可以像所有其他表一样用于关系以及度量值计算。与计算列类似，计算表应很少使用——考虑到 M、SQL 和 ETL\
  \ 工具的转换能力——但对于小型表（例如角色扮演日期维度和桥接表）来说，它们可以作为模型的有价值补充。\n\n本方案提供了一个示例，演示如何使用 DAX 计算表来支持角色扮演日期维度。此外，还通过\
  \ DAX 创建了一个单行表，以简化常见的日期智能度量值。\n\n### 准备就绪\n\n要准备本方案，请遵循以下步骤：\n\n1. 打开 Power BI Desktop。\n\
  \n2. 创建一个名为 AdWorksDW 的导入模式数据源查询。该查询应类似于以下内容：\n\n```dax\nlet\n    Source = Sql.Database(\"\
  localhost\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\")\nin\n    Source\n```\n\n\
  3. 将此查询隔离到名为“Data Sources”的查询组中，并禁用加载。\n\n4. 右键单击 AdWorksDW，然后选择“引用”（Reference）。\n\
  \n5. 选择 FactInternetSales 表，并将此查询命名为 Internet Sales。\n\n6. 对 DimDate 表重复步骤 5 和 6，并将此查询命名为\
  \ Order Dates。\n\n7. 将事实查询 Internet Sales 分入“Facts”查询组。\n\n8. 将维度查询 Order Dates\
  \ 分入“Dimensions”查询组。\n\n9. 在“Other Queries”组中创建一个名为 Calculations 的空白查询。\n\n10. 在“开始”选项卡的功能区中选择“关闭并应用”（Close\
  \ & Apply），以将表加载到数据模型。\n\n11. 使用 Order Dates 表中的 FullDateAlternateKey 列和 Internet\
  \ Sales 表中的 OrderDate 列创建关系。\n\n### 如何简化日期智能\n\n要实现本方案，请执行以下步骤：\n\n1. 在“报表视图”中，单击“建模”选项卡功能区中的“新建表”（New\
  \ Table）。\n\n2. 在公式栏中，为日期维度表指定名称（例如 Shipment Dates），并使用 SELECTCOLUMNS 函数从现有的日期维度表中检索日期列：\n\
  \n```dax\nShipment Dates =\n    SELECTCOLUMNS('OrderDates',\n        \"Shipment\
  \ Date\", 'OrderDates'[FullDateAlternateKey],\n        \"Shipment Year\", 'OrderDates'[CalendarYear],\n\
  \        \"Shipment Month\", 'OrderDates'[EnglishMonthName],\n        \"Last Refreshed\"\
  , NOW()\n    )\n```\n\n3. 按照示例，应用列别名（Shipment...）以避免与模型中的其他日期表产生混淆。\n\n4. 在 Shipment\
  \ Dates 表中的 Shipment Date 列与 Internet Sales 表中的 ShipDate 列之间创建关系。\n\n5. 将 Order\
  \ Dates 表中的 FullDateAlternateKey 列重命名为 Order Date。\n\n### 工作原理...\n\n在本示例中，模型现在有两个日期维度表，它们与事实表、订单日期和发货日期之间具有活动关系。通常，当使用角色扮演日期维度时，会对所有表和列应用别名，因此需要将日期表及其列重命名为\
  \ Order Dates。但是，如果新的角色扮演日期表很少使用，那么可能只需要对这些新的角色扮演日期表应用别名。\n\n### 更多内容...\n\n进一步简化日期智能度量值的一种选择是，在模型中嵌入一个计算表，该表生成经常用作筛选条件的值：\n\
  \n1. 在 Calculations 表中创建一个 Today 度量值：\n\n```dax\nToday = DATE(2013,6,28)\n```\n\n\
  2. 在`报表视图`中隐藏`Calculations`表，并注意`Calculations`表的图标从表变为计算器。该度量值表将保持在`字段`列表中其他非仅度量值表的上方。\n\
  \n3. 在`报表视图`中，从`建模`选项卡的功能区中选择`新建表`，并输入以下 DAX 查询：\n\n```dax\nDate Parameters =\n\
  \    VAR __Today = [Today]\n    VAR __CurrentFiscalYear =\n        LOOKUPVALUE('OrderDates'[FiscalYear],\
  \ 'OrderDates'[Order Date], __Today)\n    VAR __CurrentFiscalQuarter =\n       \
  \ LOOKUPVALUE('OrderDates'[FiscalQuarter], 'OrderDates'[Order Date], __Today)\n\
  \    RETURN\n        ROW(\n            \"Last Refreshed\", NOW(),\n            \"\
  Today\", __Today,\n            \"30 Days Prior\", __Today - 30,\n            \"\
  90 Days Prior\", __Today - 90,\n            \"Current Fiscal Year\", __CurrentFiscalYear,\n\
  \            \"Prior Fiscal Year\", __CurrentFiscalYear - 1,\n            \"Current\
  \ Fiscal Quarter\", __CurrentFiscalQuarter\n        )\n```\n\n4. 从`报表`视图中隐藏参数表。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_321_0.png)\n\n图 6.7：通过 DAX 计算表查询创建的单行表（Date\
  \ Parameters）示例\n\n5. 创建利用计算表中存储的值的日期智能度量值：\n\n```dax\nInternet Sales = SUM('Internet\
  \ Sales'[SalesAmount])\n\nLast 90 Days Sales =\n    CALCULATE([Internet Sales],\n\
  \        'OrderDates'[Order Date] >= DISTINCT('Date Parameters'[90 Days Prior])\n\
  \            &&\n        'OrderDates'[Order Date] <= DISTINCT('Date Parameters'[Today]))\n\
  ```\n\n由于我们在 Adventure Works 数据库中处理的是历史信息，因此 Today 度量值被设置为一个特定日期。在生产场景中，Today 度量值可以是类似于\
  \ `Today = TODAY()`，或者，如果您在查询中筛选日期表仅到当前日期，则可以使用 `Today = MAX('Dates'[Date])`。\n\n\
  \n\n变量名称前可以使用下划线或其他前导字符，以确保变量名称不与保留字冲突，同时也可用于区分变量和 DAX 新增列与数据模型中的实际列和表。\n\nDISTINCT\
  \ 函数从表中检索单个值，以便与 CALCULATE 的筛选条件中相应的日期维度列进行比较。有人可能会想在此处使用 MAX 或 MIN 函数代替 DISTINCT，但这会产生错误，提示\
  \ MAX 或 MIN 函数已用于用作表筛选表达式的 True/False 表达式中。\n\n## 另请参阅\n\n- ► DAX SELECTCOLUMNS\
  \ 函数：https://bit.ly/2OSw4JA\n- ► DAX LOOKUPVALUE 函数：https://bit.ly/3gdjZK1\n- ►\
  \ DAX ROW 函数：https://bit.ly/3dobQ3R\n\n## 利用计算组\n\n在处理日期智能时，通常会有许多准冗余度量，用于计算 YTD、MTD、PY、PYTD、PMTD\
  \ 以及其他常见日期智能区间的各种不同指标。例如，业务用户可能对总销售额、净销售额和其他度量的年初至今、同比和同比百分比计算感兴趣。通常，这需要九个 DAX 度量来计算每个日期智能区间上的这些度量。\n\
  \n计算组可以通过允许 DAX 表达式为任何度量重用，极大地帮助减少所需度量的数量。在给出的示例中，这意味着三个 DAX 表达式即可满足不使用计算组时所需的九个\
  \ DAX 表达式的需求。\n\n本方案演示了在日期智能上下文中使用计算组，以消除冗余的 DAX 表达式。\n\n## 准备工作\n\n要准备本方案，请执行以下步骤：\n\
  \n- 1. 打开 Power BI Desktop。\n- 2. 创建一个名为 AdWorksDw 的导入模式数据源查询。此查询应类似于以下内容：\n\n```\n\
  let\n    Source = Sql.Database(\"localhost\\MSSQLSERVERDEV\",\n\"AdventureWorksDW2019\"\
  )\nin\nSource\n```\n\n- 3. 将此查询隔离在名为 Data Sources 的查询组中，并禁用加载。\n- 4. 右键单击 AdworksDW，然后选择“引用”。\n\
  - 5. 选择 FactInternetSales 表，并将此查询命名为 Internet Sales。\n- 6. 对 DimDate 表重复步骤 4 和 5，并将此查询命名为\
  \ Order Dates。\n- 7. 将事实查询 Internet Sales 分离到 Facts 查询组中。\n- 8. 将维度查询 Order Dates\
  \ 分离到 Dimensions 查询组中。\n- 9. 在 Other Queries 组中创建一个名为 Calculations 的空白查询。\n- 10.\
  \ 在“开始”选项卡的功能区中选择“关闭并应用”，以将表加载到数据模型。\n- 11. 使用 Order Dates 表中的 FullDateAlternateKey\
  \ 列和 Internet Sales 表中的 OrderDate 列创建关系。\n- 12. 将 FullDateAlternateKey 列重命名为 Date。\n\
  - 13. 将 Order Dates 表标记为日期表，并使用 Date 作为日期列。\n- 14. 在 Calculations 表中，创建一些简单度量：\n\
  - 15. 隐藏 Calculations 表中的 Calculations 列。\n- 16. 将 EnglishMonthName 列的“排序依据”列设置为\
  \ MonthNumberOfYear 列。\n\n```\nInternet Sales = SUM('Internet Sales'[SalesAmount])\n\
  ```\n\n```\nOrders = COUNTROWS('Internet Sales')\n```\n\n## 如何使用计算组\n\n要实现本方案，请执行以下步骤：\n\
  \n- 1. 在“外部工具”选项卡的功能区中选择 Tabular Editor。\n- 2. 在 Tabular Editor 中，选择 Model，然后选择\
  \ New Calculation Group。\n- 3. 将新的计算组命名为 Date Intelligence Group。\n- 4. 展开 Date\
  \ Intelligence Group，右键单击 Calculation Items，然后选择 New Calculation Item。\n5. 使用公式\
  \ SELECTEDMEASURE() 创建一个 Current 计算项。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_324_0.png)\n\
  \n图 6.8：创建 Current 计算项\n\n6. 重复步骤 4 和 5，创建以下计算项：\n\n对于 YTD：\n\n```\nCALCULATE(SELECTEDMEASURE(),\n\
  \    FILTER(ALL('Order Dates'),\n        'Order Dates'[CalendarYear] = MAX('Order\
  \ Dates'[CalendarYear])\n        &&\n        'Order Dates'[Date] <= MAX('Order Dates'[Date])))\n\
  ```\n\n对于 MTD：\n\n```\nCALCULATE(SELECTEDMEASURE(),\n    FILTER(ALL('Order Dates'),\n\
  \        'Order Dates'[CalendarYear] = MAX('Order Dates'[CalendarYear])\n      \
  \  &&\n        'Order Dates'[MonthNumberOfYear] = MAX('Order Dates'[MonthNumberOfYear])\n\
  \        && 'Order Dates'[Date] <= MAX('Order Dates'[Date])))\n```\n\n对于 QTD：\n\n\
  ```\nCALCULATE(SELECTEDMEASURE(),\n    FILTER(ALL('Order Dates'),\n        'Order\
  \ Dates'[CalendarYear] = MAX('Order Dates'[CalendarYear])\n        &&\n        'Order\
  \ Dates'[CalendarQuarter] = MAX('Order Dates'[CalendarQuarter]) &&\n        'Order\
  \ Dates'[Date] <= MAX('Order Dates'[Date])))\n```\n\n对于 PY：\n\n```\nVAR __MaxDate\
  \ = MAX('Order Dates'[Date])\nVAR __MinDate = MIN('Order Dates'[Date])\nRETURN\n\
  \    CALCULATE(SELECTEDMEASURE(),\nFILTER(ALL('Order Dates'),\n    'Order Dates'[Date]\
  \ >=\n        DATE(YEAR(__MinDate)-1,MONTH(__MinDate),DAY(__MinDate))\n    &&\n\
  \        'Order Dates'[Date] <=\n        DATE(YEAR(__MaxDate)-1,MONTH(__MaxDate),DAY(__MaxDate)))\n\
  ```\n对于 PY YTD：\nVAR __MaxDate = MAX('Order Dates'[Date])\nRETURN\n    CALCULATE(SELECTEDMEASURE(),\n\
  \        FILTER(ALL('Order Dates'),\n            'Order Dates'[CalendarYear] =\n\
  \                MAX('Order Dates'[CalendarYear])-1 &&\n            'Order Dates'[Date]\
  \ <=\n                DATE(\n                    YEAR(__MaxDate)-1,\n          \
  \          MONTH(__MaxDate),\n                    DAY(__MaxDate))))\n对于 YOY：\nSELECTEDMEASURE()\n\
  \    - CALCULATE(SELECTEDMEASURE(),'Date Intelligence Group'[Name] = \"PY\")\n对于\
  \ YOY %：\nDIVIDE(\n    CALCULATE(SELECTEDMEASURE(),'Date Intelligence Group'[Name]\
  \ = \"YOY\"),\n    CALCULATE(SELECTEDMEASURE(),'Date Intelligence Group'[Name] =\
  \ \"PY\"))\n```\n\n- 7. 对于 YOY % 计算项，将格式字符串表达式设置为 `0.00%;-0.00%;0.00%`\n- 8. 在 Tabular\
  \ Editor 中，选择 File，然后选择 Save。\n- 9. 在 Power BI Desktop 中，在有关刷新计算组的警告框中单击“立即刷新”。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_325_0.png)\n\n图 6.9：手动刷新计算组\n\n- 10.\
  \ 创建一个矩阵视觉对象，将 Order Dates 表中的 CalendarYear 和 EnglishMonthName 列作为行，将 Internet Sales\
  \ 度量作为值，并将 Date Intelligence Group 中的 Name 列作为列。\n- 11. 将 Orders 度量作为值添加到矩阵视觉对象中。\n\
  \n## 工作原理...\n\n目前，Power BI Desktop 不提供创建和编辑计算组的方法，因此必须在 Visual Studio 或 Tabular\
  \ Editor 中完成。\n\nSELECTEDMEASURE 函数获取上下文中的当前度量，并将度量返回的值替换为计算组中的计算结果。返回值的格式（货币、整数、小数）与所选度量的格式相对应，除非被指定的格式字符串表达式覆盖。对于数值，格式字符串表达式应始终包含三个以分号分隔的格式规范，分别用于正值、负值和零值。\n\
  \n当所有计算项的 Ordinal 属性设置为 -1 时，返回的计算项顺序将按字母顺序排列。可以通过指定从 0 及更高的 Ordinal 数字来覆盖此顺序。Ordinal\
  \ 数字较小的显示在前。\n\n## 更多内容...\n\n使用 DAX 时间智能函数也可以获得相同的结果，但需要注意的是，DAX 时间智能函数假定使用标准（公历）日历，因此在处理会计日历和更复杂的场景时应避免使用。要了解其工作原理，请执行以下操作：\n\
  \n- 1. 在 Tabular Editor 中，选择 Model，然后选择 New Calculation Group。\n- 2. 将新的计算组命名为 Time\
  \ Intelligence Group。\n- 3. 创建以下计算项：\n  - **Current：** `SELECTEDMEASURE()`\n  -\
  \ **YTD：** `CALCULATE(SELECTEDMEASURE(), DATESYTD('Order Dates'[Date]))`\n  - **MTD：**\
  \ `CALCULATE(SELECTEDMEASURE(), DATESMTD('Order Dates'[Date]))`\n  - **QTD：** `CALCULATE(SELECTEDMEASURE(),\
  \ DATESQTD('Order Dates'[Date]))`\n  - **PY：** `CALCULATE(SELECTEDMEASURE(), SAMEPERIODLASTYEAR('Order\
  \ Dates'[Date]))`\n  - **PY YTD：** `CALCULATE(SELECTEDMEASURE(), SAMEPERIODLASTYEAR('Order\
  \ Dates'[Date]), 'Time Intelligence Group'[Name] = \"YTD\")`\n  - **YOY：** `SELECTEDMEASURE()\
  \ - CALCULATE(SELECTEDMEASURE(), 'Time Intelligence Group'[Name] = \"PY\")`\n  -\
  \ **YOY %：** `DIVIDE(CALCULATE(SELECTEDMEASURE(), 'Time Intelligence Group'[Name]\
  \ = \"YOY\"), CALCULATE(SELECTEDMEASURE(), 'Time Intelligence Group'[Name] = \"\
  PY\"))`\n\n\n\n\n+   4. 复制页面 1\n+   5. 选择 `Duplicate of Page 1` 上的矩阵可视化，并用 `Time\
  \ Intelligence Group` 中的名称列替换列\n\n两个矩阵中的数字是相同的。\n\n## 另请参阅\n\n+   - Analysis Services\
  \ 表模型中的计算组：https://bit.ly/3t1JRYd\n+   - DAX `SELECTEDMEASURE` 函数：https://bit.ly/3sv5XWN\n\
  \n## 结论\n\n本章提供了准备数据模型以支持稳健的日期智能以及编写自定义日期智能度量的配方。日期智能提供了一套广泛的数据建模模式和函数，可实现跨时间段的分析。为日期智能创建的度量可以相互组合，以支持增长和差异度量，并且通常在\
  \ Power BI 仪表板中用作 KPI。正确实施时，日期智能极大地扩展了数据模型的分析能力，并简化了报表和仪表板开发。\n\n## 参数化 Power BI\
  \ 解决方案\n\n在 Power BI 部署的基础建立起来后，数据检索和报表设计流程的组件——以及用户体验——可以被参数化，以为技术服务和用户提供更大的灵活性。例如，查询参数可以隔离和限制数据源以支持变化的源系统，模板可以实现针对预定义元数据的参数化报表开发，而\
  \ M 和 DAX 函数可以提供自定义集成和分析功能。\n\n本章中的配方涵盖了 Power BI 中的标准参数化功能和技术，以及更高级的自定义实现。对数据源、查询、用户定义函数和报表的参数化示例进一步体现了\
  \ M 语言及其与 Power BI Desktop 其他功能集成的强大功能。其他示例，例如基于 URL 的参数过滤器、专用的预测或假设分析工具，以及用户选择参数表，利用\
  \ Power BI 的转换和分析功能，使用户能够更好地控制 Power BI 数据模型的分析和可视化。\n\n在本章中，我们将介绍以下配方：\n\n+   -\
  \ 动态过滤报表\n+   - 利用查询参数\n+   - 使用模板\n+   - 将静态查询转换为动态函数\n+   - 使用参数表捕获用户选择\n+   -\
  \ 使用假设分析进行预测\n\n## 技术要求\n\n完成本章中的配方需要以下内容：\n\n+   - Power BI Desktop\n+   - 安装了\
  \ AdventureWorksDW2019 数据库的 SQL Server。该数据库及其安装说明可在以下位置获取：http://bit.ly/20VQfG7\n\
  +   - 本章文件可从以下 GitHub 仓库下载：https://github.com/geckler/PowerBICookbook2ndEdition\n\
  \n## 动态过滤报表\n\n除了 *第 4 章《创建 Power BI 报表* 中涵盖的 Power BI Desktop 中的报表筛选选项外，还可以通过 URL\
  \ 字符串对已发布的 Power BI 报表应用筛选器。无需多个专用报表和具有不同筛选条件的报表页面，带有唯一查询字符串的 URL 链接可以利用 Power BI\
  \ 服务中的单个已发布报表。此外，URL 链接可以嵌入到数据集中，以便已发布的报表可以公开指向具有预定义筛选条件的其他报表的链接。\n\n在本配方中，创建了两个\
  \ URL 字符串以演示单数和多个筛选参数语法。第二个示例通过 M 查询为产品维度表的每一行创建 URL 字符串，并在报表可视化中公开此动态链接。\n\n##\
  \ 准备工作\n\n为准备本配方，请执行以下步骤：\n\n+   1. 从以下 GitHub 仓库下载 CH7_R1.pbix：https://github.com/PacktPublishing/Microsoft-Power-BI-Cookbook-Second-Edition\n\
  +   2. 在 Power BI Desktop 中打开 CH7_R1.pbix。\n+   3. 编辑 AdWorksDW 查询并将 Source 行更改为指向安装了\
  \ AdventureWorksDW2019 数据库的 SQL 服务器。\n+   4. 将报表发布到 Power BI 服务。\n\n## 如何动态过滤报表\n\
  \n要实施本配方，请执行以下步骤：\n\n+   1. 在 Power BI 服务中打开报表。\n+   2. 用以下内容替换 URL 中的查询字符串并按 Enter：\n\
  +   `?filter=Products/ProductCategory eq 'Bikes'`\n+   3. 要应用多个 URL 筛选参数，请使用 and\
  \ 运算符分隔列筛选器，如以下示例所示：\n+   `?filter=Products/ProductCategory eq 'Bikes' and Dates/CalendarYear\
  \ eq 2013`\n+   4. 复制报表 URL，不包括查询字符串（? 之后的部分）。\n+   5. 在 Power BI Desktop 中打开 CH7_R1.pbix\n\
  +   6. 在 Power Query 编辑器中编辑 Products 查询。\n+   7. 通过在“添加列”选项卡的功能区中使用自定义列，向 Products\
  \ 表添加一个名为 Product URL 的列，格式类似于以下内容：\n+   `\"https://app.powerbi.com/groups/[...]/reports/[...]/[...]\
  \ ?filter=Products/ProductName eq '' & [ProductName] & ''\"`\n\n> 请注意，[...] 将被替换为您的唯一\
  \ ID。\n\n+   8. 关闭并应用查询更改以将其应用到模型。\n+   9. 将 Products 表中 Product URL 列的数据类别更改为 Web\
  \ URL。\n+   10. 向报表添加第二个页面。\n+   11. 创建一个表格可视化，其中包含来自 Products 表的 ProductName 列、来自\
  \ Calculations 表的 Total Net Sales 度量以及来自 Products 表的 Product URL 列。\n+   12. 选择表格可视化后，使用格式窗格，展开“值”部分，并将\
  \ URL 图标切换为开。\n+   13. 保存并发布报表。\n+   14. 在 Power BI 服务中打开报表，导航到第 2 页，然后单击某个产品的 URL\
  \ 图标之一。\n\n## 其工作原理...\n\nURL 筛选器可以应用于数据模型中任何文本或数值数据类型列。列不必在“字段”列表中可见或在“报表”视图的“筛选”字段井中使用即可用于\
  \ URL 筛选。\n\n语法为 <报表 URL>?filter=表/列 eq '值'。表和字段名称（不含空格）区分大小写，并且文本值的 '值' 必须用单引号括起来。但是不要对数值使用单引号。\n\
  \n用于 URL 筛选的表和列名称不得包含空格。如果您希望为报表用户提供列的友好名称，可以复制友好名称列，从重复列名称中删除空格，然后从报表视图中隐藏重复列名称。这样，您就可以拥有一个用于报表中的列，以及一个可用于\
  \ URL 筛选的重复列。使用重复列时，鉴于新列所需的额外资源，请尽量将列限制为具有少量不同值的列。此外，可以基于多个列的连接创建一个没有空格的单个隐藏列，以简化\
  \ URL 字符串。\n\n## 还有更多...\n\n自定义 URL 带有查询字符串的报表可视化可以固定到仪表板，并且仪表板磁贴将在刷新后反映筛选条件。但是，默认情况下，选择固定的仪表板磁贴将导航到未筛选的源报表。可以将自定义\
  \ URL 与仪表板磁贴关联以控制仪表板导航，如图 7.1 所示：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_332_0.png)\n\
  \n图 7.1：Power BI 仪表板磁贴的自定义 URL 链接\n\n## 另请参阅\n\n+   使用 URL 中的查询字符串参数筛选报表：https://bit.ly/3swEJPF\n\
  \n## 如何利用查询参数\n\n要实施本配方，请执行以下步骤：\n\n+   1. 创建一个名为 CurrentDate 的空白查询并禁用该查询的加载，方法是右键单击该查询然后取消选择\
  \ **启用加载**：\n+   \n+   ```m\n+   let\n+       Source = #date(2014,1,28)\n+   in\n\
  +       Source\n+   ```\n+   2. 从 **Power Query 编辑器** 的 **主页** 选项卡中，单击 **管理参数**\
  \ 下拉菜单并选择 **新建参数**：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_334_0.png)\n\n图\
  \ 7.2：为筛选事实表查询而创建的新参数\n\n+   3. 为查询命名为 **Days Prior to Current Date**，数据类型为 **十进制数**，并且为此示例输入建议值列表。必要时也可以将参数应用于列表之外的建议值。\n\
  +   4. 基于 **值列表**，输入 **默认值** 和 **当前值**。\n\n\n\n\n\n5. 创建一个名为 **StartDate** 的新空白查询，该查询基于\
  \ **CurrentDate** 查询和新的参数计算日期值，然后禁用加载：\n\n    ```powerquery\n    let\n        Source\
  \ = Date.AddDays(CurrentDate, - #\"Days Prior to Current Date\")\n    in\n     \
  \   Source\n    ```\n\n    在此示例中，根据默认参数值返回当前日期之前 365 天的日期。\n\n6. 根据以下 M 代码创建 **Internet\
  \ Sales** 查询：\n\n    ```powerquery\n    let\n        Source = AdWorksDW,\n     \
  \   dbo_FactInternetSales =\n            Source{[Schema=\"dbo\",Item=\"FactInternetSales\"\
  ]}[Data],\n        ChangeType = Table.TransformColumnTypes(\n            dbo_FactInternetSales,{{\"\
  OrderDate\", type date}}),\n        RowFilter = Table.SelectRows(\n            ChangeType,\n\
  \            each [OrderDate] >= StartDate and [OrderDate] <= CurrentDate)\n   \
  \ in\n        SalesTerritoryJoin\n    ```\n\n7. 在查询编辑器的 **Home** 选项卡中单击 **Close\
  \ & Apply**。\n\n8. 可选地，针对刷新的事实表构建报表或查询以验证筛选器。\n\n9. 从 **Report** 视图的 **Home** 选项卡中，单击功能区中的\
  \ **Transform data** 下拉菜单并选择 **Edit Parameters**：\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_335_0.png)\n\
  \n    Figure 7.3: Editing parameters from the Report view\n\n10. 从下拉菜单中选择建议的值，或在输入框中输入数字然后单击\
  \ **OK**。\n\n11. 从警告对话框中单击 **Apply Changes**。StartDate 和受参数更改影响的事实表查询都将被刷新。\n\n\
  ## How it works...\n\n在生产场景中，CurrentDate 查询不会硬编码为日期，而更类似于以下内容：\n\n```powerquery\n\
  let\n    Source = DateTime.Date(DateTime.LocalNow())\nin\n    Source\n```\n\nStartDate\
  \ 查询使用参数根据从值列表中选择的日期数计算早于 CurrentDate 的日期。参数可以在查询中引用，就像引用查询中的其他查询或步骤一样，同样适用相同的规则。当参数名称中包含空格时，引用参数必须以哈希\
  \ (#) 和双引号开头，并以双引号结尾 (#\"Days Prior to Current Date\")。参数名称中不包含空格的参数可以直接引用，无需前缀或后缀。\n\
  \nInternet Sales 查询在 RowFilter 步骤中使用 Table.SelectRows 函数，使用 OrderDate 列筛选 Fact.InternetSales\
  \ 表，使其大于或等于 StartDate（日期值）。OrderDate 列的数据类型与 StartDate 查询的数据类型必须相互匹配。例如，Date 数据类型不能与\
  \ DateTime 数据类型进行比较。\n\n目前，参数无法在 Power BI 服务中创建或编辑。发布时配置的参数值将用于每次刷新。\n\n在考虑自己的场景时，确定查询参数的候选对象，例如硬编码的日期筛选器和具有少量不同值的维度属性（例如，部门组）。确定某些业务用户或团队需要对数据集（即源查询、模型关系和度量）具有编辑权限，但仅需要一个小型、高度筛选的模型用于自助开发的场景。\n\
  \n## There's more...\n\n查询可受多个参数影响。此外，参数也可以使用查询作为其建议值。要了解如何在查询中使用多个参数，以及如何使用查询为参数提供建议值，请执行以下操作：\n\
  \n1. 在 **Power Query Editor** 中，创建一个名为 **SalesTerritoryGroupsList** 的查询，该查询返回 **DimSalesTerritory**\
  \ 表中的不同 **Sales Territory Groups**，并禁用查询的加载：\n\n    ```powerquery\n    let\n   \
  \     Source = AdWorksDW,\n        Navigation = Source{[Schema=\"dbo\",Item=\"DimSalesTerritory\"\
  ]}[Data],\n        RemoveColumns = Table.SelectColumns(Navigation,{\"SalesTerritoryGroup\"\
  }),\n        FilterNA = Table.SelectRows(RemoveColumns, each ([SalesTerritoryGroup]\
  \ <> \"NA\")),\n        RemoveDups = Table.Distinct(FilterNA),\n        List = Table.ToList(RemoveDups)\n\
  \    in\n        List\n    ```\n\n2. 从 **Home** 选项卡功能区中的 **Manage Parameters** 下拉菜单中单击\
  \ **New Parameter**。\n\n3. 创建一个名为 **Territory Group** 的参数，其数据类型为 **Text**，并使用 **SalesTerritoryGroupsList**\
  \ 查询作为 **Suggested Values**：\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_337_0.png)\n\
  \n    Figure 7.4: Territory Group parameter\n\n4. 创建一个 **SalesTerritoryKeys** 查询，该查询使用\
  \ **Territory Group** 参数设置的值选择与此维度关联的唯一键值，并禁用加载：\n\n    ```powerquery\n    let\n\
  \        Source = AdWorksDW,\n        Navigation = Source{[Schema=\"dbo\",Item=\"\
  DimSalesTerritory\"]}[Data],\n        ParamFilter = Table.SelectRows(Navigation,\
  \ each [SalesTerritoryGroup] = #\"Territory Group\"),\n        KeyColumn = Table.Distinct(Table.SelectColumns(ParamFilter,{\"\
  SalesTerritoryKey\"}))\n    in\n        KeyColumn\n    ```\n\n5. 在 Internet Sales\
  \ 表查询中，针对新的 SalesTerritoryKeys 查询创建内部连接表达式步骤：\n\n    ```powerquery\n    let\n  \
  \      Source = AdWorksDW,\n        dbo_FactInternetSalesReason = Source{[Schema=\"\
  dbo\",Item=\"FactInternetSales\"]}[Data],\n        ChangeType = Table.TransformColumnTypes(dbo_FactInternetSalesReason,\
  \ {{\"OrderDate\", type date}}),\n        RowFilter = Table.SelectRows(ChangeType,\
  \ each [OrderDate] >= StartDate and [OrderDate] <= CurrentDate),\n        SalesTerritoryJoin\
  \ = Table.Join(RowFilter,\"SalesTerritoryKey\",SalesTerritoryKeys,\"SalesTerritoryKey\"\
  ,JoinKind.Inner)\n    in\n        SalesTerritoryJoin\n    ```\n\nInternet Sales\
  \ 表现在同时由 Days Prior to Current Date 参数和 Territory Group 参数筛选。Territory Group 不是静态值列表，而是从模型中的另一个查询\
  \ SalesTerritoryGroupsList 查询派生建议值。对于要在参数中用作建议值的查询，查询必须返回 List 数据类型，而不是表。SalesTerritoryGroupsList\
  \ 查询中使用 Table.ToList 函数将单列表转换为列表。\n\nSalesTerritoryKeys 查询返回一个单列表，其中包含与为 Territory\
  \ Group 参数选择的值相对应的不同 SalesTerritoryKey 值。该表在 Internet Sales 查询中的 Table.Join 表达式中使用，以筛选\
  \ Internet Sales 表，仅包含使用 Territory Group 参数选择的销售区域。\n\n## See also\n\n- Using parameters:\
  \ https://bit.ly/37rXLP6\n- Edit parameter settings in the Power BI service: https://bit.ly/3iuC1sn\n\
  \n## Working with templates\n\nPower BI 模板可以从 Power BI Desktop 文件创建，以便为用户和其他报表作者提供访问预定义元数据的方式，例如\
  \ M 查询、DAX 度量、模型关系和报表可视化。由于模板文件不包含实际数据，因此非常轻量级，对于导入模式模型，只有在打开模板时才会检索数据。此外，如果已配置查询参数，则会提供用户界面以输入参数值，并且这些参数可以与源查询和数据集的其他组件集成。\n\
  \n在本配方中，向 Power BI Desktop 文件添加参数和支持查询以支持 Power BI 模板的发布。\n\n### Getting ready\n\
  \n为准备本配方，请执行以下步骤：\n\n1. 从以下 GitHub 仓库下载 `CH7_R3_Start.pbix`：`https://github.com/PacktPublishing/Microsoft-Power-BI-Cookbook-Second-Edition`。\n\
  2. 编辑 AdWorksDW 查询以指向您自己的 AdventureWorksDW2019 数据库副本。\n\n### How to work with templates\n\
  \n在本示例中，目标是提供一个仅检索单个客户国家/地区数据的 Power BI 模板。要实现本配方，请执行以下步骤：\n\n1. 在 Power BI Desktop\
  \ 中打开 `CH7_R3_Start.pbix`。\n2. 从 **Home** 选项卡的功能区中选择 **Transform data** 以打开 **Power\
  \ Query Editor**。\n3. 在 **Queries** 窗格中，右键单击空白区域并选择 **New Group** 以创建一个名为 **Parameters**\
  \ 的新查询组。\n4. 右键单击 **Other Queries** 并创建一个名为 **CustomerCountries** 的列表查询，以从 **Customers**\
  \ 查询中检索 **Country** 名称：\n\n    ```powerquery\n    let\n        Source = Customers,\n\
  \        SelectColumn = Table.SelectColumns(Source,{\"Country\"}),\n        Distinct\
  \ = Table.Distinct(SelectColumn),\n        List = Table.ToList(Distinct)\n    in\n\
  \        List\n    ```\n\n5. 禁用 **CustomerCountries** 查询的加载。\n6. 右键单击 **Parameters**\
  \ 查询组并选择 **New Parameter**。\n7. 创建一个名为 **Customer Country** 的参数，其类型为 **Text**，**Suggested\
  \ Values** 为 **CustomerCountries** 查询，当前值为 **United States**。\n8. 在 **Other Queries**\
  \ 组中，创建一个名为 **CustomerKeys** 的查询，该查询引用 **Customer Country** 参数，并禁用此查询的加载：\n\n  \
  \  ```powerquery\n    let\n        CountryParamFilter = Table.SelectRows(Customers,\
  \ each [Country] = #\"Customer Country\"),\n        CustomerKeys = Table.SelectColumns(CountryParamFilter,\n\
  \    ```\n\n\n\n\n+   6. 点击 **确定** 按钮退出 **管理参数** 对话框。\n+   7. 修改 AdWorksDW 查询以使用新参数：\n\
  \n```powerquery\nlet\n    SQLInstance =\n        if #\"SQL Server Instance\" = null\n\
  \        then \"localhost\\\\MSSQLSERVERDEV\" else #\"SQL Server Instance\",\n \
  \   SQLDatabase =\n        if #\"SQL Database\" = null\n        then \"AdventureWorksDW2019\"\
  \ else #\"SQL Database\",\n    Source = Sql.Database(SQLInstance, SQLDatabase)\n\
  in\n    Source\n```\n\n在这种情况下，修改后的 AdWorksDW 查询演示了如何处理可能不需要的参数。该查询使用 if 语句来确定参数值是否为\
  \ null，如果为 null，则为 SQLInstance 和 SQLDatabase 表达式使用默认值。如果保存为模板，则在打开 PBIT 文件时，SQL\
  \ Server 实例和 SQL 数据库的这些参数将呈现给用户。这将允许用户连接到自己的本地数据库副本，以检索报告中使用的数据。然后，用户可以将文件保存为 PBIX。\n\
  \n## 另请参阅\n\n-   ➤ 在 Power BI Desktop 中使用模板：https://bit.ly/3gpXtxX\n\n## 将静态查询转换为动态函数\n\
  \n除了 M 查询可用的标准函数库之外，还可以创建用户定义的函数来封装查询逻辑，以便针对参数输入进行动态应用。与 SQL 存储过程一样，M 函数可以带或不带输入参数创建，这些参数可以是必需的或可选的。此外，由于函数是\
  \ M 语言中的值，就像表和列表值一样，它们可以在给定的 Power BI 数据模型中的多个区域按需调用。\n\n在本教程中，将创建一个函数来支持集成数据仓库环境之外维护的员工\
  \ ID 列表。该函数接受员工 ID 值作为参数输入，并检索相关的列值。\n\n## 准备工作\n\n要准备本教程，请执行以下步骤：\n\n-   1. 从以下\
  \ GitHub 存储库下载 `Employees.xlsx`：https://github.com/PacktPublishing/Microsoft-Power-BI-Cookbook-Second-Edition。\n\
  -   2. 在本地打开 **Power BI Desktop** 文件，然后通过单击 **主页** 选项卡功能区中的 **转换数据** 访问 **Power\
  \ Query 编辑器**。\n-   3. 创建一个名为 AdWorksDW 的查询，类似于以下查询：\n    \n    ```m\n    let\n\
  \        Source = Sql.Database(\"localhost\\\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\"\
  )\n    in\n        Source\n    ```\n-   4. 禁用 AdWorksDW 查询的加载，并将其放入“数据源”查询组中。\n\
  -   5. 创建一个引用 AdWorksDW 查询并导入 DimEmployee 表的 Employees 查询：\n    \n    ```m\n   \
  \ let\n        Source = AdWorksDW,\n        dbo_DimEmployee = Source{[Schema=\"\
  dbo\",Item=\"DimEmployee\"]}[Data],\n        FullName =\n            Table.CombineColumns(\n\
  \                dbo_DimEmployee,\n                {\"FirstName\", \"LastName\"\
  },\n                Combiner.CombineTextByDelimiter(\" \", QuoteStyle.None),\n \
  \               \"EmployeeName\"\n            )\n    in\n        FullName\n    ```\n\
  -   6. 将 Employees 查询放入名为“Dimensions”的查询组中，并禁用加载。\n\n## 如何转换静态查询\n\n要实现本教程，请执行以下步骤：\n\
  \n-   1. 在 **其他查询** 组中创建一个名为 EmployeeKeysAdHoc 的 M 查询，用于从 Excel 工作簿中检索员工 ID：\n \
  \   \n    ```m\n    let\n        Source = Excel.Workbook(File.Contents(\"C:\\\\\
  Employees.xlsx\"), null, true),\n        Employees_Sheet = Source{[Item=\"Employees\"\
  ,Kind=\"Sheet\"]}[Data],\n    ```\n\n```\nHeaders = Table.PromoteHeaders(Employees_Sheet,\
  \ [PromoteAllScalars=true]),\nTypeConversion =\n    Table.TransformColumnTypes(\n\
  \        Headers,{ {\"EmployeeAlternateKey\", type text}}\n    ),\nRemoveNullsAndDups\
  \ =\n    Table.Distinct(\n        Table.SelectRows(TypeConversion, each [EmployeeAlternateKey]<>null)\n\
  \    )\nin\n    RemoveNullsAndDups\n```\n\n-   2. 禁用 **EmployeeKeysAdHoc** 查询的加载。\n\
  -   3. 通过创建一个 **空白查询**，使用以下代码创建一个函数，该函数从 **Employees** 查询中检索给定员工 ID 输入参数所需的员工列值：\n\
  \n```\n(EmployeeID as text) =>\n    let\n        EmployeeDimFilter =\n         \
  \   Table.SelectRows(\n                Employees,\n                each [EmployeeNationalIDAlternateKey]\
  \ = EmployeeID and\n                     [EndDate] = null),\n        EmployeeColumnSelection\
  \ = Table.SelectColumns(\n            EmployeeDimFilter,\n            {\"EmployeeName\"\
  , \"DepartmentName\", \"EmailAddress\"})\n    in\n        EmployeeColumnSelection\n\
  ```\n\n-   4. 将此函数命名为 **EmployeeDetailFunction**，并将其放入 **函数** 查询组中。查询编辑器中的公式 (fx)\
  \ 图标将标识该值为函数。\n-   5. 在 **其他查询** 组中创建一个新的空白查询，引用 **EmployeeKeysAdHoc** 查询；将此新查询命名为\
  \ **EmployeeIDLookup**。\n-   6. 添加一个表达式，该表达式在 `Table.AddColumn` 函数中调用 **EmployeeDetailFunction**\
  \ 函数，然后使用 `Table.ExpandTableColumn` 函数展开该列，以公开从 **EmployeeDetailFunction** 函数返回的三列：\n\
  \n```\nlet\n    Source = EmployeeKeysAdHoc,\n    CallFunction =\n        Table.AddColumn(\n\
  \            Source,\n```\n\n```m\n\"FunctionTbl\", each EmployeeDetailFunction([EmployeeAlternateKey])\n\
  ),\nExpand =\n    Table.ExpandTableColumn(\n        CallFunction,\n        \"FunctionTbl\"\
  ,\n        {\"EmployeeName\", \"DepartmentName\", \"EmailAddress\"},\n        {\"\
  EmployeeName\", \"DepartmentName\", \"EmailAddress\"}\n    )\nin\n    Expand\n```\n\
  \n7. 单击 **主页** 选项卡功能区中的 **关闭并应用**，然后保存您的工作。\n\n## 工作原理...\n\n在此示例中，业务团队在 Excel 工作簿中维护着一个员工\
  \ ID 列表，并希望能够从数据模型中与这些 ID 相关的员工维度表中访问多个列。在 EmployeeKeysAdhoc 查询中，应用了三个 M 转换函数来保护集成过程：将数据类型转换为文本、删除任何空值以及删除任何重复值。从文件和非结构化数据源导入时，始终建议进行数据清理操作。\n\
  \n在 EmployeeDetailFunction 函数中，首先将 EmployeeID 参数定义为必需的文本类型输入参数。然后，该参数在 EmployeeDimFilter\
  \ 表达式中用作 Table.SelectRows 过滤函数的一部分。鉴于 Employees 表应用了类型 2 缓慢变化维度逻辑，每个员工可能有多行，因此有必要根据\
  \ EmployeeDimFilter 变量表达式（[End Date = null]）过滤当前员工行。设置此过滤条件可确保仅返回员工的当前或“活动”行（无结束日期）。\n\
  \n缓慢变化维度逻辑会随着维度中实体的变化而为核心维度插入和/或更新行，这是数据仓库的一项基本功能。此类维度所代表的实体可以是产品、员工等。Power BI 数据集设计人员必须了解此逻辑在维度列中的表示方式，例如代理键和备用键或业务键，并相应开发\
  \ M 和 DAX 表达式。\n\n应用过滤条件后，使用一个简单的 Table.SelectColumns 表达式来检索所需的三列。每个行返回一个表值，每个表包含\
  \ Excel 工作簿中给定员工 ID 的列。根据 M 表达式代码，EmployeeDetailFunction 函数接受 EmployeeNationalIDAlternateKey\
  \ 列中的值作为其参数输入。\n\nExcel 工作簿中员工键列表的更改将在每次刷新时反映在 Power BI 报表中。可以向函数中添加其他列和逻辑，由于函数只是元数据，它可以在其他数据转换场景中使用——在此模型或其他模型中——只要可以访问\
  \ Employees 表。\n\n本教程中的函数（基于 Excel 列表）以及针对支持查询折叠的关系数据库源应用的函数，仍然需要 M 引擎的本地资源。如图 7.6\
  \ 所示：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_346_0.png)\n\n图 7.6：调用的 M 函数没有查询折叠\n\
  \n鉴于本地资源使用和函数的迭代性质，请尽量限制或避免对多行使用函数，以及避免使用具有复杂、多步骤逻辑的函数。例如，在本教程中，员工列表非常小，函数仅从小维度表中选择了几列。由于联接函数（Table.Join、Table.NestedJoin）和过滤表达式会折叠回关系数据库源，查询作者应设计查询过程以实现与函数相同的结果，但要避免逐行迭代，从而避免本地或网关资源的使用。\n\
  \n## 更多内容...\n\nExcel 文件连接信息可以进行参数化。要了解其工作原理，请执行以下步骤：\n\n-   1. 在 Power Query 编辑器中，选择“管理参数”，然后选择“主页”选项卡功能区中的“新参数”。\n\
  -   2. 创建一个名为 ExcelFolder 的文本类型参数，并将“当前值”设置为 Employees.xlsx 文件所在的文件夹路径，路径末尾不要带反斜杠\
  \ \\。\n\n\n\n\n\n+   3. 创建第二个参数 **ExcelFile**，类型为 **Text**，并将 **Current Value**\
  \ 设置为 `Employees.xlsx`。\n+   4. 将 **ExcelFolder** 和 **ExcelFile** 参数移动到 **Parameters**\
  \ 查询组。\n+   5. 在 **Other Queries** 组中创建一个新的 **Blank Query**，命名为 **ExcelFilePath**\
  \ 并禁用加载：\n\n```\nlet\n    ExcelPath = ExcelFolder & \"\\\\\" & ExcelFile\nin\n \
  \   ExcelPath\n```\n\n+   6. 编辑 `EmployeeKeysAdHoc` 查询的 Source 行以使用 `ExcelFilePath`\
  \ 查询：\n\n```\nSource = Excel.Workbook(File.Contents(ExcelFilePath), null, true),\n\
  ```\n\nExcel 文件的路径和文件名现在由 ExcelFolder 和 ExcelFile 参数控制。\n\n## See also\n\n+   ➤\
  \ Writing Custom Functions in Power Query M: https://bit.ly/3xnPuYc\n\n## Capturing\
  \ user selections with parameter tables\n\n为 Power BI 报表用户提供参数功能的一种替代方法是使用专用的参数表。在这种方法中，参数表的值要么在数据集刷新过程中计算，要么作为一次性手动操作加载。DAX\
  \ 度量引用此参数表以及模型中的其他表和表达式，以丰富自助分析体验并支持 Power BI 报表开发。这种方法最适合参数不经常更改的情况，因为 Power BI\
  \ 中的硬编码参数表意味着数据集所有者必须进行此类更改。如果参数需要频繁更改，最好使用数据库表或外部文件作为参数表，这样更容易编辑和更改。\n\n本食谱中的示例涉及为基线年度销售计划提供四种替代场景的简单可见性——高于和低于基线计划的\
  \ 10% 和 20%。一组内联场景值嵌入在数据模型中，并使用 DAX 度量来捕获筛选上下文——例如业务用户选择——并计算相应的场景逻辑。\n\n## Getting\
  \ ready\n\n为本食谱做准备，请按以下步骤操作：\n\n+   1. 在本地打开一个 Power BI Desktop 文件，通过单击 **Home**\
  \ 选项卡功能区中的 **Transform Data** 访问 **Power Query Editor**。\n+   2. 创建一个名为 AdWorksDW\
  \ 的查询，类似于以下内容：\n   \n   ```powerquery\n   let\n       Source = Sql.Database(\"localhost\\\
  \\MSSQLSERVERDEV\", \"AdventureWorksDW2019\")\n   in\n       Source\n   ```\n+ \
  \  3. 禁用 AdWorksDW 查询的加载并将其放在 Data Sources 查询组中。\n+   4. 右键单击 AdWorksDW 查询并选择 **Reference**。\n\
  +   5. 使用以下代码创建 Products 查询：\n   \n   ```powerquery\n   let\n       Source = AdWorksDW,\n\
  \       Navigation = Source{[Schema=\"dbo\",Item=\"DimProduct\"]}[Data],\n     \
  \  Subcategory =\n           Table.ExpandRecordColumn(\n               Navigation,\
  \ \"DimProductSubcategory\",\n               {\"EnglishProductSubcategoryName\"\
  , \"DimProductCategory\"},\n               {\"Product Subcategory\", \"DimProductCategory\"\
  }\n           ),\n       Category =\n           Table.ExpandRecordColumn(\n    \
  \           Subcategory, \"DimProductCategory\",\n               {\"EnglishProductCategoryName\"\
  }, {\"Product Category\"}\n           )\n   in\n       Category\n   ```\n+   6.\
  \ 使用以下代码创建 CategoryPlan 查询：\n   \n   ```powerquery\n   let\n       Source = Products,\n\
  \       Sales =\n           Table.ExpandTableColumn(\n               Source, \"\
  FactInternetSales\",\n               {\"SalesAmount\", \"OrderDate\"}, {\"SalesAmount\"\
  , \"OrderDate\"}\n           ),\n       RemoveNulls = Table.SelectRows(Sales, each\
  \ [SalesAmount] <> null),\n       Year =\n   ```\n\n```\nTable.AddColumn(\n    RemoveNulls,\
  \ \"Calendar Year\", each Date.Year([OrderDate])\n),\nMonth =\n    Table.AddColumn(\n\
  \        Year, \"Calendar Month\", each Date.MonthName([OrderDate])\n    ),\nMonthNum\
  \ =\n    Table.AddColumn(\n        Month, \"Month Number\", each Date.Month([OrderDate])\n\
  \    ),\nGroup =\n    Table.Group(MonthNum, {\"Calendar Year\", \"Calendar Month\"\
  , \"Product Category\", \"Month Number\"}, {{\"SalesAmount\", each List.Sum([SalesAmount]),\
  \ type nullable number}}),\nIndex = Table.AddIndexColumn(Group, \"Index\", 1, 1,\
  \ Int64.Type),\nPlan =\n    Table.AddColumn(\n        Index, \"Plan Amt\",\n   \
  \     each if Number.IsEven([Index])\n            then 1/Number.RandomBetween(5,10)\
  \ * [SalesAmount] + [SalesAmount]\n            else (-1 * 1/Number.RandomBetween(5,10)\
  \ * [SalesAmount]) + [SalesAmount]\n    ),\nYearMonthSort =\n    Table.AddColumn(\n\
  \        Plan, \"YearMonthSort\", each [Calendar Year] * 100 + [Month Number]\n\
  \    ),\nYearMonth =\n    Table.CombineColumns(\n        Table.TransformColumnTypes(\n\
  \            YearMonthSort, {{\"Calendar Year\", type text}}, \"en-US\"\n      \
  \  ),\n        {\"Calendar Year\", \"Calendar Month\"},\n        Combiner.CombineTextByDelimiter(\"\
  -\", QuoteStyle.None), \"Year-Month\"\n    ),\nCurrency = Table.TransformColumnTypes(YearMonth,\
  \ {{\"Plan Amt\", Currency.Type}})\nin\n    Currency\n```\n\n+   7. 将 **CategoryPlan**\
  \ 查询移动到名为 **Facts** 的查询组，并将 **Products** 查询移动到名为 **Dimensions** 的查询组。\n\n## Parameterizing\
  \ Power BI Solutions\n\n+   8. 禁用 **Products** 查询的加载。\n+   9. 从 **Home** 选项卡功能区中选择\
  \ **Close & Apply**。\n+   10. 在 CategoryPlan 表中，将 **Year-Month** 列的 **Sort By**\
  \ 列设置为 YearMonthSort 列。\n+   11. 保存你的工作。\n\n## How to capture user selections\n\n\
  要实现本食谱，请执行以下步骤：\n\n+   1. 在 Power BI Desktop 中，在 **Report** 视图中，单击 **Modeling**\
  \ 选项卡功能区中的 **New Table**。\n+   2. 使用 DAX DATATABLE 函数创建一个计算表，其中包含场景名称、场景值和排序键：\n\
  \n```\nPlan Scenarios =\n    DATATABLE(\n        \"Plan Scenario\", STRING,\n  \
  \      \"Var to Plan\", DOUBLE,\n        \"Scenario Sort\", INTEGER,\n        {\n\
  \            {\"Plan\",1,3},{\"10% Above Plan\",1.1,2},\n            {\"20% Above\
  \ Plan\",1.2,1},\n            {\"10% Below Plan\",.9,4},\n            {\"20% Below\
  \ Plan\",.8,5}\n        }\n    )\n```\n\n+   3. 在 **Data** 视图中选择新表 (**Plan Scenarios**)，并使用功能区\
  \ **Column tools** 选项卡中的 **Sort by column** 功能将 **Plan Scenario** 列设置为按 **Scenario\
  \ Sort** 列排序。\n+   4. 右键单击 **Scenario Sort** 和 **Var to Plan** 列并选择 **Hide in Report\
  \ View**。\n+   5. 返回 **Report** 视图并创建一个度量以检索 **Plan Scenario** 列的筛选上下文：\n   \n \
  \  ```\n   Sales Plan Scenario Filter Branch =\n       SWITCH(TRUE(),\n        \
  \   NOT(ISFILTERED('Plan Scenarios'[Plan Scenario])),\n           \"No Selection\"\
  ,\n           NOT(HASONEFILTER('Plan Scenarios'[Plan Scenario])),\n           \"\
  Multiple Selections\",\n           \"Single Selection\"\n       )\n   ```\n+   6.\
  \ 创建一个 **Plan Amount** 度量：\n   \n   ```\n   Plan Amount = SUM('SubCatPlan'[Plan\
  \ Amt])\n   ```\n+   7. 创建一个 **Internet Sales Plan Scenario** 度量，该度量根据筛选上下文动态计算预算/计划金额：\n\
  \   \n   ```\n   Internet Sales Plan Scenario =\n       VAR FilterContext = [Sales\
  \ Plan Scenario Filter Branch]\n   RETURN\n       SWITCH(TRUE(),\n           FilterContext\
  \ = \"Single Selection\",\n               MIN('Plan Scenarios'[Var to Plan]) * [Plan\
  \ Amount],\n           FilterContext = \"No Selection\",\n               [Plan Amount],\n\
  \           FilterContext = \"Multiple Selections\",BLANK()\n       )\n   ```\n\
  +   8. 将货币格式应用于 **Plan Amount** 和 **Internet Sales Plan Scenario** 度量。\n+   9. 创建可视化以显示不同的计划场景；示例显示在图\
  \ 7.7 中：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_352_0.png)\n\n图 7.7：计划场景的可视化\n\
  \n## How it works…\n\n在使用 DAX DATATABLE 函数在 Plan Scenarios 表中时，列名和类型会被声明，并且每一行都用大括号括起来——M\
  \ 查询中的 List 值。理想情况下，新的场景表可以持久化在数据仓库中，并且 Power BI 解决方案可以对场景名称和值的更改具有弹性。\n\n\n\n\n\
  如同其他配方，使用 DAX 创建表或列通常应被视为次要且临时的选项，例如在概念验证场景中，或在狭窄的静态用例中，例如由业务团队拥有和维护的 Power BI 模型。\n\
  \n中间度量“Sales Plan Scenario Filter Branch”通过计算三种可能的筛选上下文之一（无选择、单选、多选）简化了参数选择度量。该度量可以从报表视图的“字段”列表中隐藏。\n\
  \n方案度量“Internet Sales Plan Scenario”将中间度量传递给 FilterContext 变量，并利用现有的“Plan Amount”度量。如果已进行单个方案选择（例如在切片器视觉对象上），则“Plan\
  \ Scenarios”表中将仅激活单个值，并通过 MIN 函数检索该值。通常，如果未进行任何选择，则默认采用标准或基准值；如果进行了多项选择，则返回空白，这有助于最大程度地降低复杂性和用户困惑。\n\
  \n标准切片器是在报表中呈现参数值的最直接方法，并且方案值的降序排列（基于“排序依据”列）使切片器对用户直观易用。与矩阵视觉对象一样，“Plan Scenario”列也可以在报表视觉对象中使用。此外，任何与计划/预算事实表具有关系的维度表（例如\
  \ Products 表）也可以与新的方案度量一起用于报表可视化。切片器可用于控制所选计划方案，或者可以应用视觉级筛选器以仅显示五个方案值中的一个或几个。\n\n\
  断开连接的参数表是 Power BI 中较为强大且易于实现的模式之一，有许多已发布的示例，例如使用户能够通过切片器按自己的 TOP 标准（即前 5、10、15、20）筛选报表。一种更动态、更分析性的方法涉及在每次刷新时通过\
  \ M 查询计算参数值，例如价格的标准差、中位数和平均值，然后在 DAX 度量中使用这些查询结果。\n\n## 更多内容...\n\n参数表还可以在直接查询（DirectQuery）源中用于动态筛选\
  \ Power Query 查询。这意味着用户可以使用报表切片器动态筛选 DirectQuery 查询返回的信息。此功能在本书出版时可能仍处于预览阶段，但有关此功能的更多信息请参阅本配方的“另请参阅”部分。\n\
  \n## 另请参阅\n\n- Power BI Desktop 中的动态 M 查询参数（预览）：https://bit.ly/2QYrvhq\n\n## 使用\
  \ what-if 分析进行预测\n\nPower BI 可直接用于支持创建预测、预算以及未来业务指标和事件的其他计划值。这些数据集的关系和逻辑通常在 Excel\
  \ 公式中实现并由业务团队维护，可以在专用的 Power BI Desktop 文件中高效复制。在 Power BI 中将 what-if 输入变量与预测创建、存储和可视化隔离，使用户能够更轻松地创建、分析和协作处理业务预测。\n\
  \n在本配方中，使用 Power Desktop 模型从 Excel 中摄取预测变量输入，并通过对这些变量进行动态转换处理来生成可供可视化的预测表。此设计使业务团队能够快速迭代预测，并最终支持可与其他数据模型集成的正式或经批准的预测或计划。\n\
  \n## 准备就绪\n\n要准备本配方，请按照以下步骤操作：\n\n- 1. 从以下 GitHub 存储库下载 `Forecast.xlsx`：https://github.com/PacktPublishing/Microsoft-Power-BI-Cookbook-Second-Edition。\n\
  - 2. 在本地打开 **Power BI Desktop** 文件，并通过单击 **开始** 选项卡功能区中的 **转换数据** 访问 **Power Query\
  \ 编辑器**。\n- 3. 创建一个名为 `AdWorksDW` 的查询，如下所示：\n  \n  ```powerquery\n  let\n      Source\
  \ = Sql.Database(\"localhost\\\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\")\n  in\n\
  \      Source\n  ```\n- 4. 禁用 AdWorksDW 查询的加载，并将其放入 Data Sources 查询组。\n- 5. 右键单击\
  \ AdWorksDW 查询，然后选择 **引用**。\n- 6. 将查询重命名为 `Internet Sales`，选择 `FactInternetSales`\
  \ 表，并将 `OrderDate` 列更改为日期数据类型：\n  \n  ```powerquery\n  let\n      Source = AdWorksDW,\n\
  \      dbo_FactInternetSales = Source{[Schema=\"dbo\",Item=\"FactInternetSales\"\
  ]}[Data],\n      DateType = Table.TransformColumnTypes(\n          dbo_FactInternetSales,{{\"\
  OrderDate\", type date}})\n  ```\n- 7. 重复步骤 5 和 6，创建指向 DimSalesTerritory 表的“Sales\
  \ Territories”查询，以及指向 DimDates 表的“Dates”查询。\n- 8. 向 Dates 表添加 YearMonth 和 YearMonthSort\
  \ 列：\n\n  ```powerquery\n  let\n      Source = AdWorksDW,\n      dbo_DimDate = Source{[Schema=\"\
  dbo\",Item=\"DimDate\"]}[Data],\n      YearMonth = Table.AddColumn(\n          dbo_DimDate,\
  \ \"YearMonth\",\n          each Text.From([CalendarYear]) & \"-\" & Text.Start([EnglishMonthName],3)\n\
  \      ),\n      YearMonthSort = Table.AddColumn(\n          YearMonth, \"YearMonthSort\"\
  , each [CalendarYear]*100+[MonthNumberOfYear])\n  in\n      YearMonthSort\n  ```\n\
  - 9. 从 **开始** 选项卡的功能区中选择 **关闭并应用**。\n- 10. 切换到 **模型** 视图，并在 `Internet Sales` 表和\
  \ `Sales Territories` 表中的 `SalesTerritoryKey` 列之间创建关系。\n- 11. 在 `Dates` 表中的 `DateKey`\
  \ 列与 `Internet Sales` 表中的 `OrderDateKey` 列之间创建关系。\n- 12. 将 `Dates` 表中 `YearMonth`\
  \ 列的“排序依据”列设置为 `YearMonthSort` 列。\n\n## 如何使用 what-if 分析进行预测\n\n要实现本配方，请执行以下步骤：\n\
  \n- 1. 在 **报表** 视图中，从 **开始** 选项卡的功能区中选择 **转换数据**。\n- 2. 在 `Data Sources` 查询组中创建一个名为\
  \ **ForecastFile** 的查询，指向 `Forecast.xlsx` 文件并禁用加载：\n\n  ```powerquery\n  let\n \
  \     Source = Excel.Workbook(File.Contents(\"C:\\Forecast.xlsx\"), null, true)\n\
  \  in\n      Source\n  ```\n- 3. 右键单击 **ForecastFile** 查询，然后选择 **引用**。\n\n## 为 Power\
  \ BI 解决方案参数化\n\n- 4. 将查询重命名为 ForecastYear，并使用以下代码：\n\n  ```powerquery\n  () =>\n\
  \      let\n          Source = ForecastFile,\n          FY = Source{[Item=\"ForecastYear\"\
  ,Kind=\"DefinedName\"]}[Data],\n          Rename = Table.RenameColumns(FY,{{\"Column2\"\
  , \"ForecastYear\"}}),\n          SelectColumn = Table.SelectColumns(Rename,{\"\
  ForecastYear\"}),\n          Record = Table.Max(SelectColumn,{\"ForecastYear\"}),\n\
  \          Year = Record.Field(Record,\"ForecastYear\")\n      in\n          Year\n\
  \  ```\n- 5. 将 ForecastYear 函数移动到一个名为 Forecast 的查询组。\n- 6. 在 Forecast 查询组中，创建一个名为\
  \ ForecastTotalGrowth 的查询并禁用加载：\n\n  ```powerquery\n  let\n      Source = ForecastFile,\n\
  \      Forecast = Source{[Item=\"TotalSalesGrowthBaseForecast\",Kind=\"DefinedName\"\
  ]}[Data],\n      Promote = Table.PromoteHeaders(Forecast, [PromoteAllScalars=true]),\n\
  \      Unpivot = Table.UnpivotOtherColumns(\n          Promote, {\"Value\"}, \"\
  Attribute\", \"Value.1\"),\n      RemoveColumn = Table.RemoveColumns(Unpivot,{\"\
  Value\"}),\n      Rename = Table.RenameColumns(\n          RemoveColumn,{{\"Attribute\"\
  , \"Month\"}, {\"Value.1\", \"Sales Growth\"}}),\n      ChangeToPercent = Table.TransformColumnTypes(\n\
  \          Rename,{{\"Sales Growth\", Percentage.Type}})\n  in\n      ChangeToPercent\n\
  \  ```\n- 7. 在 Forecast 查询组中，创建一个名为 ForecastAllocation 的查询并禁用加载：\n\n  ```powerquery\n\
  \  let\n      Source = ForecastFile,\n      Allocation = Source{[Item=\"SalesGroupAllocation\"\
  ,Kind=\"DefinedName\"]}[Data],\n      Promote = Table.PromoteHeaders(Allocation,\
  \ [PromoteAllScalars=true]),\n      Unpivot = Table.UnpivotOtherColumns(\n     \
  \     Promote, {\"Group\"}, \"Attribute\", \"Value\"),\n      Rename = Table.RenameColumns(Unpivot,\n\
  \          {\n              {\"Group\", \"Sales Territory\"}, {\"Attribute\", \"\
  Month\"},\n              {\"Value\", \"Allocation\"}\n          })\n  ```\n\n\n\n\
  \n## 参数化 Power BI 解决方案\n\n```powerquery\n}),\nChangeToPercent = Table.TransformColumnTypes(\n\
  \    Rename,{{\"Allocation\", Percentage.Type}})\nin\n    ChangeToPercent\n```\n\
  \n- 8. 在 Forecast 查询组中，创建一个名为 CurrentDate 的函数：\n\n  ```powerquery\n  () as date\
  \ =>\n  let\n      Current = Date.FromText(\"6/28/2013\")\n  in\n      Current\n\
  \  ```\n\n- 9. 在 Forecast 查询组中，创建一个名为 PriorYearMonthlySales 的查询，并禁用加载：\n\n  ```powerquery\n\
  \  let\n      CurrentYear = Date.Year(CurrentDate()),\n      CurrentMonth = Date.Month(CurrentDate()),\n\
  \      WorkingMonth =\n          if Date.DaysInMonth(CurrentDate()) = Date.Day(CurrentDate())\n\
  \          then CurrentMonth + 1 else CurrentMonth,\n      PYJoin = Table.Join(\n\
  \          #\"Internet Sales\", \"OrderDate\",\n          Dates, \"FullDateAlternateKey\"\
  , JoinKind.Inner),\n      PYFilter = Table.SelectRows(PYJoin, each [CalendarYear]\
  \ =\n          CurrentYear - 1 and\n          [MonthNumberOfYear] >= WorkingMonth),\n\
  \      PYGroup = Table.Group(\n          PYFilter, {\"CalendarYear\", \"MonthNumberOfYear\"\
  ,\n              \"EnglishMonthName\"},\n          {{\"Sales\", each List.Sum([SalesAmount]),\
  \ Currency.Type}}),\n      RemoveColumns = Table.RemoveColumns(PYGroup, {\"MonthNumberOfYear\"\
  }),\n      Month = Table.TransformColumns(\n          RemoveColumns,\n         \
  \ {{\"EnglishMonthName\", each Text.Start(_, 3), type text}}),\n      Rename = Table.RenameColumns(Month,\
  \ {{\"EnglishMonthName\", \"Month\"}})\n  in\n      Rename\n  ```\n\n- 10. 在 Forecast\
  \ 查询组中，创建一个名为 CurrentYearMonthlySales 的查询，并禁用加载：\n\n  ```powerquery\n  let\n   \
  \   CurrentYear = Date.Year(CurrentDate()),\n      CurrentMonth = Date.Month(CurrentDate()),\n\
  \      WorkingMonth =\n          if Date.DaysInMonth(CurrentDate()) = Date.Day(CurrentDate())\n\
  \          then CurrentMonth else CurrentMonth - 1,\n      PYJoin = Table.Join(\n\
  \          #\"Internet Sales\", \"OrderDate\",\n          Dates, \"FullDateAlternateKey\"\
  , JoinKind.Inner),\n      PYFilter = Table.SelectRows(PYJoin, each [CalendarYear]\
  \ =\n          CurrentYear and\n              [MonthNumberOfYear] <= WorkingMonth),\n\
  \      PYGroup = Table.Group(\n          PYFilter, {\"CalendarYear\", \"MonthNumberOfYear\"\
  ,\n              \"EnglishMonthName\"},\n          {{\"Sales\", each List.Sum([SalesAmount]),\
  \ Currency.Type}}),\n      RemoveColumns = Table.RemoveColumns(PYGroup, {\"MonthNumberOfYear\"\
  }),\n      Month = Table.TransformColumns(\n          RemoveColumns,\n         \
  \ {{\"EnglishMonthName\", each Text.Start(_, 3), type text}}),\n      Rename = Table.RenameColumns(Month,\
  \ {{\"EnglishMonthName\", \"Month\"}})\n  in\n      Rename\n  ```\n\n- 11. 在 Forecast\
  \ 查询组中，创建一个名为 `SalesForecastBase` 的查询，并禁用加载：\n\n  ```m\n  let\n      History = Table.Combine({CurrentYearMonthlySales,\
  \ PriorYearMonthlySales}),\n      JoinForecast = Table.NestedJoin(\n          History,\
  \ \"Month\", ForecastTotalGrowth, \"Month\",\n          \"Fcst Column\", JoinKind.Inner),\n\
  \      ForecastColumns = Table.ExpandTableColumn(\n          JoinForecast, \"Fcst\
  \ Column\", {\"Sales Growth\"}, {\"Sales Growth\"}),\n      MonthlyForecast = Table.AddColumn(\n\
  \          ForecastColumns,\n          \"Forecast Sales\", each ([Sales Growth]\
  \ + 1) * [Sales], Currency.Type),\n      AddForecastYear = Table.AddColumn(\n  \
  \        MonthlyForecast, \"Forecast Year\", each ForecastYear()),\n      RemoveColumns\
  \ = Table.RemoveColumns(\n          AddForecastYear, {\"CalendarYear\", \"Sales\"\
  , \"Sales Growth\"})\n  in\n      RemoveColumns\n  ```\n\n```DAX\nIF(\n    MAX('Dates'[FullDateAlternateKey])<[Today],\n\
  \    SUM('Internet Sales'[SalesAmount]),\n    BLANK()\n),\nSUM('Sales Forecast'[Forecast\
  \ Sales])\n)\n```\n\n- 24. 创建一个折线图视觉对象，使用 Dates 表中的 YearMonth 列作为轴，并使用 Total Sales\
  \ Amount 度量值作为值。\n\n- 25. 添加一个切片器视觉对象，使用 Sales Territories 表中的 SalesTerritoryGroup\
  \ 列，如*图 7.9*所示：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_361_0.png)\n\n图 7.9：历史销售额与预测销售额\n\
  \n### 工作原理...\n\nForecastYear、ForecastTotalGrowth 和 ForecastAllocation 查询使用 Forecast.xlsx\
  \ 文件中的命名区域来导入所需的预测信息。ForecastYear 查询是一个没有输入参数的函数，返回预测年份的单个数值。ForecastTotalGrowth\
  \ 和 ForecastAllocation 查询使用 Table.UnpivotOtherColumns 函数对数据中的月份列进行逆透视，分别返回 12 行和\
  \ 36 行。在 ForecastTotalGrowth 查询中，每一行代表预测年份中的一个月份以及预测的同比增长百分比。在 ForecastAllocation\
  \ 查询中，每一行代表按销售区域和月份划分的预测增长的预期分配。\n\nCurrentDate 查询通过使用一个没有输入参数的函数来指定当前日期的日期。该函数被指定为返回\
  \ Date 数据类型。在本方案中，CurrentDate 的值被硬编码为 2013 年 6 月 28 日。在生产环境中，将改用类似 Date.LocalNow\
  \ 的函数。\n\nPriorYearMonthlySales、CurrentYearMonthlySales 和 SalesForecastBase 查询协同工作，为报表创建基础预测。PriorYearMonthlySales\
  \ 和 CurrentYearMonthlySales 查询都按月份从 Internet Sales 查询中检索聚合值。PriorYearMonthlySales\
  \ 和 CurrentYearMonthlySales 查询中使用 Table.SelectRows 筛选函数，以确保两个查询的组合始终等于完整的 12 个月。例如，在\
  \ 2013 年 6 月，CurrentYearMonthlySales 查询仅检索 1 月到 5 月的数据，其余月份由 PriorYearMonthlySales\
  \ 查询检索。\n\nSalesForecastBase 查询使用 Table.Combine 函数将 PriorYearMonthlySales 和 CurrentYearMonthlySales\
  \ 查询合并到 History 表达式中。然后将合并后的表联接到 ForecastTotalGrowth 查询，以添加预测的 Sales Growth 列。基础预测（即\
  \ Forecast Sales 列）是通过将 Internet Sales 中的 Sales 列乘以 1 + Sales Growth 百分比创建的。最后，通过从\
  \ Table.AddColumn 表达式调用 ForecastYear 函数来添加 Forecast Year 列，并删除不必要的列。\n\n最终的 Sales\
  \ Forecast 查询将 ForecastAllocation 查询联接到 SalesForecastBase 查询，以便按销售区域归属指定分配的销售增长。使用\
  \ Left.Outer 联接来确保 ForecastAllocation 查询中的所有行都出现在结果表中，其中 AllocationTable 列包含来自 SalesForecastBase\
  \ 查询的列。展开 SalesForecastBase 表中的列后，可以通过将 Forecast Sales Total 列乘以 Allocation 列来创建\
  \ Forecast Sales 列。最后，删除不必要的列，并创建一个 YearMonth 列，以确保 Sales Forecast 表可以与模型中的 Dates\
  \ 表建立关联。\n\n`ForecastDateBridge` 和 `ForecastTerritoriesBridge` 表分别包含 `YearMonth`\
  \ 和 `SalesTerritoryGroup` 的唯一值。这些表在模型中用于桥接 Dates 表、Sales Territories 表和 Sales Forecast\
  \ 表之间的不同粒度。\n\n`Total Sales Amount` 度量值确定该度量值是在当前还是未来的 YearMonth 中执行，并通过针对当前 YearMonth\
  \ 值对 Internet Sales 表中的 SalesAmount 列求和，或针对未来 YearMonth 值对 Sales Forecast 表中的 Forecast\
  \ Sales 列求和来计算该值。\n\n### 扩展内容...\n\n可以修改预测，加入一个可由用户选择的 what-if 参数，以可视化超出预测指定百分比的情况。为演示其工作原理，请执行以下步骤：\n\
  \n- 1. 在**报表**视图中，从**建模**选项卡的功能区中选择**新建参数**。\n\n- 2. 将参数命名为 `Beat Forecast By`，为数据类型选择\
  \ `Decimal number`，将**最小值**设置为 `0.1`，**最大值**设置为 `0.4`，**增量**设置为 `0.1`。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_363_0.png)\n\
  \n图 7.10：What-if 参数\n\n\n\n\n\n3. 修改 Total Sales Amount 度量值，如下所示：\n\n```\nTotal\
  \ Sales Amount =\n    VAR __BeatForecastValue = [Beat Forecast By Value]\n    VAR\
  \ __ForecastIncrease =\n        IF(ISBLANK(__BeatForecastValue),1,1+__BeatForecastValue)\n\
  RETURN\n    SWITCH(TRUE(),\n        ISBLANK(COUNTROWS('Sales Forecast')),\n    \
  \    IF(\n            MAX('Dates'[FullDateAlternateKey])<[Today],\n            SUM('Internet\
  \ Sales'[SalesAmount]),\n            BLANK()\n        ),\n        SUM('Sales Forecast'[Forecast\
  \ Sales]) * __ForecastIncrease\n    )\n```\n\n用户现在可以使用 Beat Forecast By 切片器来控制假设分析场景，即按指定百分比超出销售预测的场景。\n\
  \n## 另请参阅\n\n- 使用假设参数可视化变量：https://bit.ly/2QsmNZu\n\n## 结论\n\n本章中的方案涵盖了 Power BI\
  \ 中的标准参数化功能和技术，以及更高级的自定义实现。对数据源、查询、用户定义函数和报表进行参数化的示例展示了 M 语言的强大功能及其与 Power BI Desktop\
  \ 其他功能的集成。其他示例，例如基于 URL 的参数筛选器、专用的预测或假设分析工具，以及用户选择参数表，同时利用了 Power BI 的转换和分析功能，使用户能够更好地控制\
  \ Power BI 数据模型的分析和可视化。\n\n## 实现动态\n### 基于用户的可见性\n### 在 Power BI 中\n\n数据安全性（即阻止用户或用户组查看数据集的一部分）通常是\
  \ Power BI 部署中的首要要求。安全性实现的复杂度各不相同，从基于单个维度值（如部门或区域）将若干安全组映射到其关联的行级安全性角色，到涉及专用用户权限表和动态\
  \ DAX 函数的动态、基于用户的安全性。考虑到用例的多样性以及跨利益相关者安全共享数据集的重要性，了解可用于开发、测试和运营数据安全角色的流程和技术至关重要。\n\
  \n除了**行级安全性 (RLS)** 角色之外，动态的、基于用户的筛选上下文技术也可用于简化和个性化用户体验。例如，报表中内置的筛选条件以及最终用户的交互式筛选选择都可以动态更新并显示在直观的视觉对象中，以帮助理解。在更高级的方案中，DAX\
  \ 度量值本身可以根据与内容交互的用户信息进行筛选，以提供个性化体验。本章包含针对 Import 和 DirectQuery 数据集构建和部署动态、基于用户的安全性的详细示例，以及用于增强用户体验的动态筛选上下文功能的示例。\n\
  \n在本章中，我们将介绍以下方案：\n\n- 捕获当前用户上下文\n- 定义 RLS 角色和筛选表达式\n- 设计动态安全性模型\n- 为 DirectQuery\
  \ 构建动态安全性\n- 显示当前筛选上下文\n- 避免用户手动点击\n\n## 技术要求\n\n完成本章中的方案需要满足以下条件：\n\n- Power BI\
  \ Desktop。\n- 安装了 AdventureWorksDW2019 数据库的 SQL Server。该数据库及其安装说明可在此处获取：http://bit.ly/2OVqfG7。\n\
  - 本章的文件可从以下 GitHub 仓库下载：https://github.com/PacktPublishing/Microsoft-Power-BI-Cookbook-Second-Edition。\n\
  \n## 捕获当前用户上下文\n\nPower BI 中动态用户安全性和可见性的基础是能够提取正在访问 Power BI 服务内容的业务用户的用户主体名称 (UPN)\
  \ 或登录凭据。USERPRINCIPALNAME DAX 函数可检索此文本值，从而使筛选表达式能够应用于安全角色中的模型表。除了 RLS 角色（会覆盖并影响数据集的所有\
  \ DAX 度量值）之外，UPN 或“当前用户”文本值还可供 DAX 度量值用来检索 UPN 前缀和后缀，或筛选其他度量值。\n\n在本方案中，DAX 度量值被添加到数据模型中，以动态检索\
  \ UPN 以及 UPN 的前缀和后缀。还将介绍 Power BI 中身份验证的更多细节，以及 USERNAME 函数（另一个也可以在 Power BI 服务中检索\
  \ UPN 的动态 DAX 函数）。\n\n## 准备工作\n\n要准备本方案，请执行以下步骤：\n\n- 1. 在 Power BI Desktop 中打开新文件并登录\n\
  - 2. 单击“开始”选项卡功能区中的“转换数据”\n- 3. 在 Power Query 编辑器中，创建一个名为“Dynamic User Measures”的新空白查询\n\
  - 4. 单击“开始”选项卡功能区中的“关闭并应用”\n- 5. 切换到“数据”视图，并隐藏“Dynamic User Measures”表中的“Dynamic\
  \ User Measures”列\n\n## 如何捕获用户上下文\n\n要实现本方案，请使用以下步骤：\n\n- 1. 在**数据**视图中，在 **Dynamic\
  \ User Measures** 表中创建三个 DAX 度量值：\n  \n  ```DAX\n  User Principal Name = USERPRINCIPALNAME()\n\
  \  ```\n  \n  ```DAX\n  UPN Prefix = LEFT([User Principal Name], SEARCH(\"@\", [User\
  \ Principal Name]) - 1)\n  ```\n  \n  ```DAX\n  UPN Suffix =\n      RIGHT(\n   \
  \       [User Principal Name],\n          LEN([User Principal Name]) - LEN([UPN\
  \ Prefix]) - 1\n      )\n  ```\n\n- 2. 创建一个**表**视觉对象，并将这三个度量值作为**值**添加到表中\n\n| 用户主体名称\
  \ | UPN 前缀 | UPN 后缀 |\n|---|---|---|\n| BrettP@FrontlineAnalytics.onmicrosoft.com\
  \ | BrettP | FrontlineAnalytics.onmicrosoft.com |\n\n图 8.1：UPN 度量值\n\n- 3. 将报表发布到\
  \ Power BI 服务\n- 4. 向工作区添加另一个用户，或与另一个用户共享报表\n- 5. 请求该用户登录工作区以查看报表，或使用备用用户的凭据登录\n\
  \n| 用户主体名称 | UPN 前缀 | UPN 后缀 |\n|---|---|---|\n| JenLawrence@FrontlineAnalytics.onmicrosoft.com\
  \ | JenLawrence | FrontlineAnalytics.onmicrosoft.com |\n\n图 8.2：该函数返回不同已登录用户的 UPN\n\
  \n### 工作原理 …\n\n为了实施动态安全性或可见性，技术上并不需要创建这些度量值，但这种方法可以简化开发，因为度量值表达式可以被重用并对用户隐藏。\n\n\
  Power BI 使用 **Azure Active Directory (AAD)** 对登录 Power BI 服务的用户进行身份验证。当用户尝试访问需要身份验证的资源时，Power\
  \ BI 登录凭据（例如 `BrettP@FrontlineAnalytics.onmicrosoft.com`）将用作有效用户名。`USERPRINCIPALNAME`\
  \ DAX 函数返回用于登录 Power BI 的电子邮件地址。对于使用工作电子邮件地址登录 Power BI 的组织，此有效用户名映射到本地 Active Directory\
  \ 中的 UPN。\n\n在 Power BI 服务到本地的方案中（例如使用本地 SSAS 多维数据集），来自 Power BI 服务的有效用户名（登录凭据）将映射到本地\
  \ Active Directory 中的 UPN，并解析为关联的 Windows 域账户。\n\n如果数据集尚未配置安全角色，工作区的成员（例如 JenLawrence）将通过工作区中的读取或编辑权限看到其\
  \ UPN。如果已经为数据集配置了安全角色，则该成员需要具有工作区的编辑权限，或者可以被添加到为数据集定义的安全角色之一，并被授予对工作区的读取访问权限。安全角色应用于应用工作区的只读成员。或者，应用工作区管理员或具有编辑权限的工作区成员可以测试映射到某个安全角色但不是工作区成员的用户的安全性。\n\
  \n## 更多内容...\n\nUSERNAME DAX 函数在本地返回格式为 domain\\user 的用户域登录名，但在 Power BI 服务中返回用户主体名称（用户的登录凭据）。因此，安全角色筛选表达式、用户权限表以及添加到\
  \ Power BI 数据集中的任何其他动态用户功能都应与 USERPRINCIPALNAME 提供的 UPN 电子邮件地址格式保持一致。\n\n在本地共享数据模型中，可以使用\
  \ DAX 文本函数从 USERNAME 中提取域和用户名，就像本方案示例中对 USERPRINCIPALNAME 所做的那样：\n\n```\nUser Name\
  \ = USERNAME()\n```\n\n```\nUser Name Domain = LEFT([User Name], SEARCH(\"\\\\\"\
  , [User Name]) - 1)\n```\n\n```\nUser Name Login =\n    RIGHT([User Name], LEN([User\
  \ Name]) - LEN([User Name Domain]) - 1)\n```\n\n| 用户名 | 用户名域 | 用户登录名 |\n|---|---|---|\n\
  | ATLAS\\Brett Powell | ATLAS | Brett Powell |\n\n图 8.3：在本地和 Power BI 服务之外使用 USERNAME\
  \ 函数\n\nUSERNAME 函数通常用于基于 SSAS 表格模型的动态安全性实现中。USERPRINCIPALNAME 是为了简化用户标识而引入的，因为它在本地和\
  \ Power BI 服务中均返回 UPN（电子邮件地址格式）。一个罕见的例外是 PC 未加入域的情况。在这种不太可能出现的场景中，USERPRINCIPALNAME\
  \ 会像 USERNAME 一样以 (domain\\user) 格式返回域和用户名。\n\n\n\n\n\n还有一个 USEROBJECTID DAX 函数，当在\
  \ Power BI 服务或 Azure Analysis Services 的上下文中使用时，它会返回当前用户来自 AAD 的对象 ID。当与本地 SQL Server\
  \ Analysis Services 一起使用时，将返回用户的 Security Identifier (SID)。\n\n## See also\n\n-\
  \ Power BI security documentation and whitepaper: http://bit.ly/22NH zRS\n- DAX\
  \ USERPRINCIPALNAME function: https://bit.ly/3dMDhVc\n- DAX USERNAME function: https://bit.ly/2RRFuWT\n\
  - DAX USEROBJECTID function: https://bit.ly/3aCEXPo\n\n## Defining RLS Roles and\
  \ Filter Expressions\n\n数据安全应始终是首要考虑事项，BI 团队和开发人员应努力确保用户永远不会获得超出执行合法业务功能所必需的更大访问权限或权限。\n\
  \n在 Power BI 项目的上下文中，“谁应该可以看到什么？”这个问题应在发布任何报表或授予数据集的读取访问权限之前得到明确定义并记录下来。此外，应有一个明确定义的流程来创建和管理安全实现中使用的安全组。\n\
  \nPower BI 模型的数据安全由模型内定义的安全角色组成，每个角色包含一个或多个唯一的 DAX 过滤表达式。角色及其关联的过滤表达式在 Power BI\
  \ Desktop 中创建，用户或组在 Power BI 服务中映射到安全角色。单个 DAX 过滤表达式可以应用于给定安全角色中模型的每个表，用户可以选择映射到多个安全角色。应用于安全角色中表的过滤表达式也会通过模型中定义的关联来过滤模型中的其他表，就像应用于\
  \ Power BI 报表的过滤器一样，并且会应用于安全角色成员提交的所有查询。\n\n本食谱包含配置、部署和验证 RLS 角色的端到端示例，适用于导入和 DirectQuery\
  \ 数据模型。还包括有关合并安全角色表以提高更改安全要求可管理性的额外指导。\n\n## Getting ready\n\n为准备本食谱，请执行以下步骤：\n\n\
  - 1. 在本地打开一个 Power BI Desktop 文件，通过单击“开始”选项卡功能区中的“转换数据”访问 Power Query 编辑器\n- 2.\
  \ 创建一个名为 AdWorksDW 的查询，类似于以下内容：\n  ```\n  let\n      Source = Sql.Database(\"localhost\\\
  MSSQLSERVERDEV\", \"AdventureWorksDW2019\")\n  in\n      Source\n  ```\n- 3. 禁用\
  \ AdWorksDW 查询的加载并将其放入数据来源查询组中\n- 4. 右键单击 AdWorksDW 查询并选择引用\n- 5. 重命名查询为 Internet\
  \ Sales 并选择 FactInternetSales 表\n- 6. 重复步骤 4 和 5，创建指向 DimResellers 表的 Resellers\
  \ 查询、指向 FactResellerSales 查询的 Reseller Sales 查询、指向 DimSalesTerritory 表的 Sales Territories\
  \ 查询以及指向 DimDate 表的 Dates 查询\n- 7. 使用以下代码创建 Customers 查询：\n  ```\n  let\n      Source\
  \ = AdWorksDW,\n      dbo_DimCustomer = Source[{Schema=\"dbo\",Item=\"DimCustomer\"\
  }][Data],\n      DimGeography = Table.ExpandRecordColumn(\n          dbo_DimCustomer,\
  \ \"DimGeography\",\n          {\"DimSalesTerritory\"}, {\"DimSalesTerritory\"}),\n\
  \      SalesTerritory = Table.ExpandRecordColumn(\n          DimGeography, \"DimSalesTerritory\"\
  ,\n          {\"SalesTerritoryGroup\"}, {\"SalesTerritoryGroup\"})\n  in\n     \
  \ SalesTerritory\n  ```\n- 8. 使用以下代码创建 Products 查询：\n  ```\n  let\n      Source\
  \ = AdWorksDW,\n      Navigation = Source[{Schema=\"dbo\",Item=\"DimProduct\"}][Data],\n\
  \      Subcategory = Table.ExpandRecordColumn(\n          Navigation, \"DimProductSubcategory\"\
  ,\n  ```\n  ```\n  {\n      \"EnglishProductSubcategoryName\", \"DimProductCategory'\"\
  ,\n      {\"Product Subcategory\", \"DimProductCategory\"}\n  ),\n  Category =\n\
  \      Table.ExpandRecordColumn(\n          Subcategory, \"DimProductCategory\"\
  ,\n          {\"EnglishProductCategoryName\"}, {\"Product Category\"}\n  )\n  in\n\
  \      Category\n  ```\n- 9. 将 **Internet Sales** 和 **Reseller Sales** 查询移动到 **Facts**\
  \ 查询组，并将 **Sales Territories**、**Dates**、**Customers**、**Resellers** 和 **Products**\
  \ 查询移动到 **Dimensions** 查询组\n- 10. 在 **Other Queries** 组中，创建一个名为 **Calculations**\
  \ 的 **Blank** 查询\n- 11. 从“开始”选项卡的功能区中选择“关闭并应用”\n- 12. 切换到“模型”视图并在 **Internet Sales**\
  \ 和 **Sales Territories** 表之间创建 **SalesTerritoryKey** 列的关系\n- 13. 在 **Reseller Sales**\
  \ 和 **Sales Territories** 表之间创建 **SalesTerritoryKey** 列的关系\n- 14. 在 **Reseller Sales**\
  \ 和 **Products** 表之间创建 **ProductKey** 列的关系\n- 15. 在 **Internet Sales** 和 **Products**\
  \ 表之间创建 **ProductKey** 列的关系\n- 16. 在 **Dates** 表的 **DateKey** 列与 **Internet Sales**\
  \ 表的 **OrderDateKey** 列之间创建关系\n- 17. 在 **Dates** 表的 **DateKey** 列与 **Reseller Sales**\
  \ 表的 **OrderDateKey** 列之间创建关系\n- 18. 在 **Internet Sales** 和 **Customers** 表之间创建\
  \ **CustomerKey** 列的关系\n- 19. 在 **Reseller Sales** 和 **Resellers** 表之间创建 **ResellerKey**\
  \ 列的关系\n- 20. 保存你的工作\n\n定义并记录要实现的安全角色要求以及这些角色的成员或组。使用 *第 3 章《构建 Power BI 数据模型》*\
  \ 中描述的公交矩阵图（*图 3.1* 和 *图 3.2*）来帮助传达模型中当前存储的数据。鉴于数据的风险或敏感性，验证角色安全性是否确实是必需的（而不是报表或模型过滤器）。\n\
  \n不要将安全角色过滤器与 Power BI 中的各种其他形式的过滤器混淆，例如报表、页面和视觉级别的过滤器，以及 DAX 度量中的过滤逻辑。RLS 角色过滤器应用于安全角色成员的所有查询，有效地在查询时为给定角色生成数据模型的一个虚拟子集。鉴于将安全角色过滤器与报表查询过滤器叠加的性能影响，所有用户体验和分析过滤器都应在安全角色过滤器之外实现。安全过滤器应专门用于保护敏感数据。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_372_0.png)\n\n图 8.4：RLS 角色和过滤表达式的模型\n\
  \n## How to Define RLS Roles and Filter Expressions\n\n要实现本食谱，请使用以下步骤：\n\n- 1. 在报表视图中，在\

  \ **平均线** 部分，并单击 **添加**。\n- 4. 将 **数据标签** 切换为 **开**，并将 **文本** 更改为 **名称和值**。\n- 5.\
  \ **趋势** 线可用，但仅当 x 轴设置为 **连续** 时才可用。**Date** 列是提供 **连续** 轴的不错选择。**Date** 列还使 **预测**\
  \ 分析可用。\n- 6. 折线图视觉对象的一个有用技巧是使用度量来添加条件格式。在 **Internet Sales** 表中创建以下度量：\n\n- 7.\
  \ 将此度量添加到折线图的 **值** 字段井中。条件度量将包含在折线图中，但仅在满足条件时才有值（且不为空白）。这种方法遵循了通用报表设计目标，即在不影响可用性的情况下在同一空间中提供更多分析价值。通过轴中的数据层次结构进行下钻，以及工具提示中的额外度量，在同一报表画布空间中提供了进一步支持。\n\

  \ 切换为 **列**，选择向下箭头以打开 *钻取* 模式，并单击 **自行车** 列。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_231_0.png)\n\
  \n图 4.37：矩阵视觉对象\n\n- 21. 保存你的工作。\n\n### 工作原理\n\n表和矩阵视觉对象会自动筛选掉没有数据的行和列。实际上，如果 **值**\
  \ 区域中的聚合或度量值全部计算为空白，则该行不会在表中显示。**显示无数据的项目** 功能会覆盖这一默认行为，但并非万无一失，如使用 **显示值为** 功能的情况所示。另一种方法是构造度量值，使其返回零而不是空白，如下面的示例所示：\n\
  \n```\nMeasure =\n    VAR __Sum = SUM('Internet Sales'[Sales Amount])\nRETURN\n\
  \    IF(ISBLANK(__Sum),0,__Sum)\n```\n\n或\n\n```\nMeasure = SUM('Internet Sales'[Sales\
  \ Amount]) + 0\n```\n\n或\n\n```\nMeasure =\n    COALESCE(\n        SUM('Internet\
  \ Sales'[Sales Amount]),\n        0\n    )\n```\n\n数据条可以像本示例中这样与度量值一起显示，也可以作为独立条显示。还可以输入特定的最小和最大阈值，以驱动数据条的条件格式。\n\
  \n除了对背景色和数据条应用条件格式外，条件格式还可用于字体和图标。如果字体色阶和背景色阶使用相同的格式逻辑和颜色，则只会显示值的颜色，例如在热图中。\n\n\
  对于添加到表和矩阵视觉对象中的度量值，可以使用 **显示值为** 选项，将度量值显示为行、列或总计的百分比。但是，表和矩阵视觉对象中的度量值目前无法设置为显示单位，也无法设置小数位数，例如千或百万。对于表视觉对象，由于视觉对象只有单一维度，因此只有\
  \ **占总计的百分比** 可用。\n\n对于矩阵视觉对象，可以通过每行开头的 **+** 和 **-** 图标导航行层次结构。或者，在 **钻取** 下拉菜单中选择\
  \ **行**，可以使用钻取图标导航行层次结构。同样，在 **钻取** 下拉菜单中选择 **列**，可以通过相同的钻取图标导航列。共有四个钻取图标：向上箭头图标在层次结构中向上钻取一层；向下箭头图标打开钻取模式。当钻取模式处于活动状态（实心圆）时，单击某一行或列会仅针对该特定列或行向下钻取一层。双向下箭头图标会对所有行或列向下钻取一层，但在此情况下会丢失父级层次结构上下文。若要对所有行或列向下钻取一层并保留父级层次结构上下文，请使用分叉向下箭头图标。\n\
  \n### 更多内容...\n\n表和矩阵视觉对象的一个额外条件格式选项是 **Web URL**。使用 **Web URL** 条件格式可以将显示的值转换为实时链接。若要演示其工作原理，请执行以下操作：\n\
  \n- 在 **Scratch** 页面上，使用 **客户表** 中的 **客户名称**、**电子邮件** 和 **服务 URL** 列创建一个 **表视觉对象**。\n\
  - 在 **表视觉对象** 的 **值** 井中，访问 **客户名称** 度量值的 **条件格式**，并选择 **Web URL**。\n- 在 **Web URL**\
  \ 对话框中，将 **基于字段** 更改为 **客户表** 中的 **电子邮件** 列。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_232_0.png)\n\

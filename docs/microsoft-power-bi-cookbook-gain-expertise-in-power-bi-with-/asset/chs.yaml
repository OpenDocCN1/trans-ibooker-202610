  - 在 Power BI 报表中设置钻取：http://bit.ly/31SH2lv\n- 使用报表页钻取：http://bit.ly/3sKg5w0\n- 在\
  \ Power BI Desktop 中使用跨报表钻取：http://bit.ly/3fzfQjJ\n\n## 设置报表格式以供发布\n\nPower BI Desktop\
  \ 包含多项功能，可精细控制并增强报表的格式和布局。在将报表发布到 Power BI 服务之前，可以对齐视觉对象、调整其大小并使其均匀分布，以形成有序、对称的布局。此外，还可以添加形状、文本框和图像等补充报表元素，以进一步组织报表页面，并通过文字和视觉辅助手段丰富页面内容。\n\
  \n本操作指南演示了如何控制报表视觉对象的位置、对齐和分布，以及按组呈现和处理视觉对象的一些技巧。此外，还提供了在发布报表之前进行最终清理的有用提示，以及发布后设置\
  \ Q&A 的提示。\n\n\n\n\n## 准备工作\n\n要准备本食谱，请按照以下步骤操作：\n\n- 1. 打开 CH4_R8.pbix 文件，并将文件另存为\
  \ CH4_R9.pbix。\n- 2. 切换到 Scratch 页面，使用 Ctrl-A，然后按 Delete 删除所有视觉对象。\n- 3. 检查“筛选器”窗格，确保只有\
  \ Europe 筛选器处于活动状态。\n\n## 如何设置报表格式\n\n要实现本食谱，请按照以下步骤操作：\n\n- 1. 将四个 KPI 视觉对象从 Europe\
  \ 页面复制并粘贴到 Scratch 页面。\n- 2. 在页面上移动 KPI 视觉对象，将它们垂直间隔开，并置于不同的水平位置。\n- 3. 注意移动或调整视觉对象大小时出现的自动对齐参考线（称为智能参考线的红色虚线）。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_240_0.png)\n\n图 4.49：自动对齐参考线\n\n- 4.\
  \ 使用 Ctrl-A 选择所有 KPI 视觉对象。\n- 5. 在功能区中选择“格式”选项卡，选择“对齐”，然后选择“左对齐”。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_240_1.png)\n\
  \n图 4.50：格式功能区中的排列选项\n\n- 6. 所有视觉对象都将与最左侧的视觉对象对齐。\n- 7. 再次选择 **对齐**，然后选择 **垂直分布**。\n\
  - 8. 视觉对象将以相等的间距在页面上垂直分布。\n- 9. 在 **格式** 选项卡的功能区中选择 **组合**，然后选择 **组合**。\n- 10. 现在可以将视觉对象作为一个整体在页面上移动。\n\
  - 11. 选择 **组合**，然后选择 **取消组合**。\n- 12. 将视觉对象大致堆叠在一起。\n- 13. 单击页面上的空白区域，然后选择最上方的视觉对象。\n\
  - 14. 在 **格式** 选项卡中，选择 **下移一层**，然后选择 **置于底层**。\n- 15. 单击页面画布的空白区域，注意该视觉对象现在位于所有其他视觉对象的下方。\n\
  - 16. 选择其中一个视觉对象，这次在 **格式** 选项卡的功能区中选择 **选择**，以显示 **选择** 窗格。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_241_0.png)\n\
  \n图 4.51：选择窗格\n\n- 17. 使用向上和向下图标更改视觉对象的 **图层顺序**。\n- 18. 切换到 **Tab 键顺序**，再次使用向上和向下图标更改视觉对象的\
  \ Tab 键顺序。\n- 19. 关闭 **选择** 窗格。\n- 20. 将 KPI 视觉对象在页面上水平分布。\n- 21. 使用 *Ctrl-A* 选择所有视觉对象。\n\
  - 22. 选择 **格式** 选项卡，并在功能区中选择 **对齐 | 顶端对齐**，然后选择 **对齐 | 水平分布**。\n- 23. 将每个 **KPI**\
  \ 视觉对象转换为 **卡片** 视觉对象。\n- 24. 将其中一个 KPI 视觉对象的 **边框** 和 **背景** 切换为 **关**。\n- 36.\
  \ 对 **Product Tooltip** 和 **Customer Drill through** 页面重复 *步骤 32*。\n- 37. 使用 **+**\
  \ 选项卡添加一个名为 **信息** 的页面。\n- 38. 在 **信息** 页面上，使用功能区中的 **插入** 选项卡创建一个 **文本框**，类似于 *图\
  \ 4.55* 中的图像。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_243_0.png)\n\n图 4.55：带有可用的\
  \ mailto 链接的报表信息页面\n\n- 39. 在此情况下，选择 **帮助台** 并将其设为可用的 **mailto:** 链接。\n- 40. 在 **视图**\
  \ 选项卡中，选择功能区中的 **锁定对象**。\n- 41. 选择 **Europe** 页面并保存工作。\n- 42. 在 **开始** 选项卡中，选择功能区中的\
  \ **发布**，将报表发布到 Power BI 服务。\n\n## 工作原理\n\n当报表准备好发布时，最好使用 **锁定对象** 设置来防止视觉元素被意外移动或调整大小。但需要注意的是，**锁定对象**\
  \ 仅影响通过鼠标和键盘移动或调整视觉对象大小的操作。**格式** 窗格 **常规** 部分中的 **X 位置**、**Y 位置**、**宽度** 和 **高度**\
  \ 设置仍然可以重新定位和调整视觉对象的大小。\n\n在发布报表之前，应隐藏或删除开发期间使用的页面，例如 **Scratch** 页面。用于报表页工具提示的页面也应隐藏。钻取页面可能会被隐藏，也可能不会，这取决于它们在报表中的用途。在\
  \ Power BI 服务中查看报表时，隐藏页面不会显示给报表阅读者。\n\n通常最好包含一个 **信息** 页面。信息页面可用于描述报表中使用的数据源、浏览报表的有用提示，甚至支持信息。\n\
  \n定位和对齐是专业报表的关键要素。如本食谱所示，Power BI 提供了许多选项来确保视觉对象以对称方式对齐和调整大小。在页面上移动或调整视觉元素大小时，自动对齐参考线始终会出现。\n\
  \n- 3. 填充移动布局视图：在设备网格中单击并拖动视觉对象到所需位置。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_247_0.png)\n\
  \n图 4.61：填充后的移动布局\n\n- 4. 切换到 United Kingdom 页面，并同样配置移动布局。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_247_1.png)\n\
  \n图 4.62：United Kingdom 销售和利润移动布局\n\n- 5. 通过在 **视图** 选项卡的功能区中单击 **移动布局** 来退出 **移动布局**。\n\
  - 6. 保存工作。\n- 7. 将报表发布到 Power BI 服务。\n- 8. 使用手机上的 Power BI 应用测试移动视图。\n\n## 工作原理\n\
  \nPower BI 报表的使用方式往往会因设备不同而存在显著差异。例如，包含多个切片器和表格或矩阵视觉对象的报表页面可能适合在笔记本电脑上提供详细的交互式体验，但可能不适合移动设备使用。在许多场景中，用户更希望在移动设备上简单、方便地访问少数几个高层级视觉对象，如卡片或\
  \ KPI，而不是页面上所有视觉对象的欠佳呈现。\n\n如果预期会有移动端使用，报表作者应与用户协作设计此布局和整体体验。由于 **移动布局** 处于报表页面级别，并且无法组合来自多个页面的视觉对象，因此包含最重要度量值或\
  \ KPI 的专用报表页面会很有帮助。这些报表页面通常仅通过卡片、仪表或 KPI 视觉对象包含数字，以便在移动端一目了然地查看最重要的数据点。\n\n手机布局呈现一个矩形的移动设备网格和一个\
  \ **可视化** 窗格，其中包含给定报表页面的不同元素，包括文本框和形状。虽然可以为每个报表页面设计针对移动优化的布局，但对于大多数报表而言，可能只需要设计一个或两个移动布局，重点突出报表中最重要的度量值或趋势。\n\
  \n**移动布局** 的 **可视化** 窗格使识别要包含或排除的元素变得容易。视觉对象以默认大小吸附到网格，并在不同尺寸的移动设备上放大或缩小。\n\n一旦保存并重新发布到\
  \ Power BI 服务，从移动设备访问报表的用户将看到定义的手机布局。如果没有移动布局，移动用户将收到尚未配置的通知，并可以调整设备方向（横向）以横向视图查看报表页面。无论是否配置了手机布局，切换到横向方向都会以标准桌面视图打开报表。Power\
  \ BI 报表的页面可以通过从屏幕侧面滑动或点击页面图标来访问。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_249_0.png)\n\
  \n图 4.63：切换到横向视图\n\n## 更多内容...\n\nPower BI 报表的许多交互功能，如钻取模式和切片器，也可以通过 Power BI 移动应用使用。然而，考虑到外形因素的限制，评估这些元素的可用性并考虑诸如卡片或\
  \ KPI 等移动友好的视觉对象是否能够提供必要的可见性非常重要。\n\n在 Power BI 中创建和修改仪表板时，该服务为仪表板提供了类似的移动优化创作体验。在\
  \ Power BI 服务中的仪表板上，单击 **编辑** 下拉菜单，如 *图 4.64* 所示。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_249_1.png)\n\
  \n图 4.64：Power BI 服务中仪表板的移动视图\n\n\n\n\n\n## 创作 Power BI 报表\n\n移动视图和功能与 Power BI\
  \ Desktop 中的移动布局非常相似。固定到仪表板的实时页面会成为单个仪表板磁贴，因此只有一个移动视觉对象。因此，若要有效配置针对移动优化的仪表板，必须将单个报表视觉对象固定到仪表板中的磁贴。\n\
  \n### 另请参阅\n\n- 适用于移动设备的 Power BI 应用：`http://bit.ly/2q6SG8f`\n- 使用 Power BI 开发移动友好型报表的提示：`https://bit.ly/3wpUJX8`\n\
  \n### 创建分页报表\n\nMicrosoft 已做出巨大努力，确保分页报表（SSRS 风格报表）在 Power BI 生态系统中成为一流公民。Power\
  \ BI Premium 支持此类报表，**Power BI 报表服务器（PBIRS）** 也是如此。Microsoft 仍致力于在 Power BI 中支持分页报表的最新证据是，其宣布了计划在\
  \ Power BI Desktop 中提供用于创建分页报表的报表构建体验，以及于 2021 年 5 月发布的**分页报表**视觉对象。\n\n但截至目前，分页报表仍必须在单独的工具\
  \ Power BI 报表生成器中创建。本方案演示如何下载并安装 Power BI 报表生成器，以及如何使用该工具构建分页报表。\n\n#### 准备工作\n\n\
  要准备本方案，请按照以下步骤操作：\n\n1. 从此位置下载 Power BI 报表生成器：`https://bit.ly/2X0p1G1`。\n2. 打开 **PowerBIReportBuilder.msi**\
  \ 文件。\n3. 使用向导完成安装。\n\n在考虑分页报表时，确认是否确实需要开发分页报表会很有帮助。以下问题有助于确认是否需要分页报表：\n\n1. 报表是否需要跨多页打印？\n\
  2. 报表是否更像只包含数据表格的静态操作报表？\n3. 报表数据本身是否需要通过电子邮件订阅发送给用户？\n\n对这些问题中的一个或多个回答“是”，有助于确认需要分页报表。\n\
  \n#### 如何创建分页报表\n\n要实现本方案，请使用以下步骤：\n\n1. 运行 Power BI 报表生成器应用。\n2. 打开 Power BI 报表生成器后，依次选择“新建报表”和“表或矩阵向导”。\n\
  3. 选择“创建数据集”，然后单击“下一步”。\n4. 选择“新建”以创建新的数据源连接。\n5. 选择连接类型“Microsoft SQL Server”。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_251_0.png)\n\n图 4.65：报表生成器“开始使用”对话框\n\
  \n6. 使用 **构建** 选项配置数据源；完成后，单击 **确定** 按钮。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_252_0.png)\n\
  \n7. 单击 **确定** 按钮。\n8. 单击 **下一步** 按钮。\n9. **展开“视图”**，然后展开 **vProducts** 视图以选择以下字段：\n\
  \n- ProductKey\n- EnglishProductName\n- EnglishProductCategoryName\n- EnglishProductSubcategoryName\n\
  - DaysToManufacture\n- Color\n\n10. **展开“表”**，然后展开 **FactInternetSales** 表以选择以下字段：\n\
  \n- ProductKey\n- OrderQuantity\n- UnitPrice\n- DiscountAmount\n- SalesAmount\n\
  - TaxAmt\n- Freight\n- OrderDate\n\n11. 展开“关系”区域，取消选择“自动检测”，然后按“添加关系”图标。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_253_0.png)\n\
  \n图 4.67：添加关系\n\n12. 选择 vProducts 作为左表，并选择 FactInternetSales 作为右表。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_253_1.png)\n\
  \n图 4.68：联接表\n\n13. 双击“联接字段”下方的区域。\n\n14. 在“编辑相关字段”对话框中，单击“添加字段”图标，然后从每个表中选择 ProductKey\
  \ 字段；单击 **确定** 按钮。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_254_0.png)\n\n15.\
  \ 在“设计查询”对话框中，单击 **下一步** 按钮。\n16. 在“排列字段”对话框中，按以下顺序将字段放入“行组”区域：\n\n- EnglishProductCategoryName\n\
  - EnglishProductSubcategoryName\n- EnglishProductName\n\n17. 将以下字段放入“值”区域：\n\n-\
  \ OrderQuantity\n- UnitPrice\n- DiscountAmount\n- SalesAmount\n- TaxAmt\n- Freight\n\
  \n18. 保持聚合为“求和”；也可以通过“值”区域中字段的下拉列表进行更改。\n19. 单击 **下一步** 按钮。\n20. 在“选择布局”对话框中，选择“递阶，小计在上方”，然后单击\
  \ **下一步** 按钮。\n21. 在“预览”屏幕上单击 **完成 >>**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_257_0.png)\n\
  \n图 4.72：查询设计器\n\nPower BI 报表生成器包含“插入”菜单中提供的许多视觉元素，包括：\n\n- 表\n- 矩阵\n- 列表\n- 柱形图\n\
  - 折线图\n- 饼图\n- 条形图\n- 面积图\n- 仪表\n- 地图\n- ESRI 形状文件\n- 数据条\n- 迷你图\n- 指示器\n\n还可使用\
  \ **文本框、图像、线条** 和 **矩形** 等元素。报表还可以包含 **子报表、页眉** 和 **页脚**。\n\n可以使用众多函数和运算符创建计算字段；以下两个公式分别创建\
  \ **TaxAndFreight** 和 **Year** 的计算字段：\n\n```text\n=Fields!TaxAmt.Value+Fields!Freight.Value\n\
  =Year(Fields!OrderDate.Value)\n```\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_258_0.png)\n\

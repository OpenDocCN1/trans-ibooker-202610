  \n## 另请参阅\n\n- ► 在 Power BI Desktop 中使用分组和分箱：https://bit.ly/3xHnMpG\n\n## 检测和分析聚类\n\
  \n聚类是一种数据挖掘和机器学习技术，用于根据一个或多个度量的值对一个维度的项目进行分组（聚类）。鉴于不同维度项目的数量，例如产品或客户，以及描述这些项目的度量数量，聚类是探索数据以发现标准报表和分析技术难以检测的关系的强大方法。Power\
  \ BI Desktop 提供了内置支持来创建聚类，并允许这些聚类像数据模型中的其他列一样进行管理、修订和使用于 Power BI 报表中。\n\n在本食谱中，基于销售额、订单数量和上次购买以来的天数创建客户聚类。创建\
  \ DAX 度量以支持此分析，并创建 **Scatter Chart** 可视化对象以进一步分析聚类。\n\n## 准备工作\n\n为本食谱做准备，请按以下步骤操作：\n\
  \n- 1. 在本地打开 Power BI Desktop 文件并通过单击 **Home** 选项卡功能区中的 **Transform Data** 访问 **Power\
  \ Query Editor**\n- 2. 创建一个名为 AdWorksDW 的查询，类似于以下内容：\n\n```\nlet\n    Source = Sql.Database(\"\
  localhost\\MSSQLSERVERDEV\",\n    \"AdventureWorksDW2019\")\nin\n    Source\n```\n\
  \n\n\n\n- 3. 禁用 AdWorksDW 查询的加载并将其放入 **Data Sources** 查询组\n- 4. 右键单击 AdWorksDW 查询并选择\
  \ **Reference**\n- 5. 重命名查询为 **Internet Sales** 并选择 **FactInternetSales** 表\n- 6.\
  \ 重复步骤 4 和 5，创建一个指向 **DimDates** 表的 **Dates** 查询、一个指向 **DimCustomer** 表的 **Customers**\
  \ 查询，以及一个指向 **DimSalesTerritory** 表的 **Sales Territories** 查询\n- 7. 使用以下代码创建 **Products**\
  \ 查询：\n\n```let\n    Source = AdWorksDW,\n    Navigation = Source{[Schema=\"dbo\"\
  ,Item=\"DimProduct\"]}[Data],\n    Subcategory =\n        Table.ExpandRecordColumn(\n\
  \            Navigation, \"DimProductSubcategory\",\n            {\"EnglishProductSubcategoryName\"\
  , \"DimProductCategory\"},\n            {\"Product Subcategory\", \"DimProductCategory\"\
  }\n        ),\n    Category =\n        Table.ExpandRecordColumn(\n            Subcategory,\
  \ \"DimProductCategory\",\n            {\"EnglishProductCategoryName\"}, {\"Product\
  \ Category\"}\n        )\nin\n    Category\n```\n\n- 8. 将 **Internet Sales** 查询移动到\
  \ **Facts** 查询组，并将 **Dates**、**Customers** 和 **Products** 查询移动到 **Dimensions** 查询组\n\
  - 9. 在 **Other Queries** 组中，创建一个名为 **Calculations** 的空白查询\n- 10. 从 **Home** 选项卡的功能区中选择\
  \ **Close & Apply**\n- 11. 切换到 **Model** 视图并在 **Dates** 表中的 **DateKey** 列与 **Internet\

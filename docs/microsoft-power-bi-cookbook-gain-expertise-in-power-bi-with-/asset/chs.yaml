  \ 放在 Size 区域。你可以向下钻取到邮政编码级别并放大以调查特定区域有多少客户。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_145_1.png)\n\
  \nFigure 3.15: Default Visual of the Geographical Data Category\n\n## Building a\
  \ Power BI Data Model\n\n- 10. 在仍处于 **Report** 视图时，创建仅包含 **EnglishMonthName** 列的\
  \ **Table** 可视化。请注意，月份名称在表中按字母顺序出现。\n- 11. 在 **Fields** 列表中选择 **EnglishMonthName**\
  \ 列，并从 **Column tools** 选项卡将 **Sort by column** 更改为 **MonthNumberOfYear** 列。执行此操作后，月份名称将按正确的日历顺序排序。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_146_0.png)\n\nFigure 16: Sort by column\n\
  \n- 12. 切回 **Data** 视图并从 **General Ledger** 表中选择 **AccountKey** 列。\n- 13. 在 **Column\
  \ tools** 选项卡上，将默认 **Summarization** 从 **Count** 更改为 **Don't summarize**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_146_1.png)\n\
  \nFigure 3.17: Default Summarization for Columns\n\n\n\n\n默认情况下，**整数**、**小数**和**固定小数位数**的默认汇总方式均为**求和**。对于应用了默认汇总方式的数字列，在报表可视化中使用时，字段列表会应用一个求和符号，并根据默认汇总设置聚合该列的值。无论配置了何种默认汇总方式（例如，**平均值**和**计数**），都会显示相同的符号。\n\
  \n简单的 DAX 度量值可以提供所有**默认汇总**选项（**求和、最小值、最大值、平均值、计数**和**非重复计数**）。此外，命名度量值（如 **Count\
  \ of Products**）有助于消除关于默认汇总图标的混淆。正是出于这个原因，许多 BI 专业人士倾向于用度量值替换事实列。简单的 DAX 表达式用于执行数据模型所需的各种聚合或汇总；然后隐藏事实列。当所有事实列都隐藏时，相关度量值会显示在**字段**列表的顶部。此外，使用度量值还可以应用业务逻辑，例如包含或排除某些值。\n\
  \n### 更多内容...\n\n在微软实习期间，Chelsie Eiden 通过在 Power BI Desktop 的 2019 年 9 月版本中实现自定义格式字符串，解决了一个长期存在的与\
  \ Power BI 持续时间相关的问题。自 Power BI Desktop 发布以来，一直存在一个问题：如何聚合持续时间并以 *HH:MM:SS* 格式显示。这是因为模型引擎不像\
  \ M 查询引擎那样包含真正的 **Duration**（持续时间）数据类型。你可以将持续时间转换为秒来聚合，但无法在视觉对象中显示以数字形式正确聚合并以 *小时:分钟:秒*\
  \ 格式显示的聚合持续时间。原因是没有针对持续时间的数字格式选项，而使用 DAX FORMAT 函数会将数字转换为文本。自定义格式字符串解决了这个问题，它允许列保持为数字，同时允许创建自定义格式用于显示。可以使用**模型**视图的**属性**窗格将自定义格式字符串应用于列或度量值，如*图\
  \ 3.18*所示。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_148_0.png)\n\n图 3.18：自定义格式字符串\n\
  \nDAX 可用于协助解决排序问题；例如，可以创建一个 DAX 计算列来支持对 **Calendar Yr-Mo** 列（包含如 *2016-Jan* 等值）进行排序。创建\
  \ **CalYr-Mo Sort** 列的 DAX 公式如下：\n\n```\nCalYr-Mo Sort = YEAR('Dates'[Date]) * 100\
  \ + MONTH('Dates'[Date])\n```\n\n该计算会生成如 *201601* 这样的值。对 **Date** 列应用 YEAR 函数，再乘以\
  \ 100 以增加两位数字。然后将该乘积与对 **Date** 列应用 MONTH 函数的结果相加，MONTH 函数返回 1 到 12 之间的值。虽然这种方法实现简单且资源消耗低，但新列的数值不是连续的，因此限制了该列在时间智能度量值（例如，过去\
  \ 3 个月）中的使用。为日期维度的每个粒度创建连续的代理键列，包括会计日历，是构建稳健的日期智能逻辑的重要组成部分。\n\nDAX 的 RANKX 函数也可用于排序。例如，使用以下\
  \ DAX 代码在 **Departments** 表中创建一个排名列，该排名基于每个 **Department Group** 在 **General Ledger**\
  \ 中获得的资金。\n\n```\nDeptGroupRank = RANKX('Departments',[Finance])\n```\n\n该排名基于本方案中创建的\
  \ **Finance** 度量值。**DeptGroupRank** 列会在每次刷新时重新计算，因此排序顺序可能会发生变化以反映源数据。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_149_0.png)\n\
  \n现在，**DepartmentGroupName** 列可以指定**按列排序**为 **DeptGroupRank**，以按资金对部门进行排序，其中 **Sales\
  \ and Marketing** 排名第一（资金最多），**Quality Assurance** 排名最后（资金最少）。\n\n### 另请参阅\n\n-\

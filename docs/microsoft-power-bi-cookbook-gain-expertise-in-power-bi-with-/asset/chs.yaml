  \ Sales表中的SalesAmount列作为值。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_181_0.png)\n\
  \n图3.42：启用了其他组的Product Subcategories组\n\n## 工作原理\n\n对于所创建的层次结构，PATH函数将子键列与父键列进行比较，并返回一个包含给定位所有父成员的分隔文本字符串。PATHITEM函数根据位置参数，从最高到最低返回路径中的键值。PATHITEM函数的第三个也是最后一个参数(1)指定以整数形式返回该值。LOOKUPVALUE函数将账户键与PATHITEM函数返回的键进行比较，并返回由第一个参数AccountDescription指定的列。某些行的给定列具有空值，因为该列在结构中级别更高；例如，Balance\
  \ Sheet账户在第2级到第6级列中没有值。计算列将出现在字段列表中，并带有公式图标。\n\n现在只需单击一下即可将层次结构添加到视觉对象中。可通过向下钻取来浏览所有六列。或者，在矩阵可视化中，可以使用每行开头的展开和折叠控件来查看层次结构。层次结构位于字段列表中，隐藏各个列可能会提高可用性。但是，需要各列来查看不同的列顺序，或在相对的轴上查看层次结构的各个列。\n\
  \n将本配方中创建的层次结构视为自然层次结构，而不是非自然层次结构。自然层次结构为每个父值包含唯一的子值，是推荐的层次结构。例如，Fiscal Year列中的每个唯一值将有12个唯一的子值，例如“2017-Mar”。非自然层次结构会在多个父值中重复相同的子值。\n\
  \n在几乎所有场景中，SQL源视图或M查询是比DAX计算列更可取的替代方案。所使用的DAX父子函数是为该场景开发的，而Accounts表只有100行。\n\n\n\
  \n\nDAX 中的计算列和计算表在处理/刷新操作期间会消耗模型资源，且不会被压缩，从而增加模型的内存占用。因此，应避免在大型事实表上使用计算列。\n\n分组可以使\
  \ Power BI 报表和仪表板更加直观，并有助于简化分析。通常，分组用于那些可能使数据可视化的内容变得混乱的不常见维度值。如果某个在 Power BI Desktop\
  \ 中创建的分组在报表和仪表板中变得普遍，则可能适合在数据仓库或数据模型的检索查询中构建等效的分组。新分组名称“产品子类别”在字段列表中显示为一个由四个相等部分分割的正方形形状图标。此外，新分组的名称还会在“数据”视图中作为一列显示。\n\
  \n默认情况下，“组”对话框中的“包含其他组”选项未启用。如果启用，未包含在某个组中的列的所有其他不同值或成员将被分组到“其他”组中。在“数据”视图中，“其他”组的成员显示为值（空白）。\n\
  \n只有在加载了数据模型的 Power BI Desktop 中，才能创建和编辑组和层次结构。在 Power BI 服务中访问数据模型的用户只能使用现有的组和层次结构。组和层次结构也可以在\
  \ DirectQuery 数据模型中创建。在 DirectQuery 模型中也可以创建计算列，但性能可能会受到负面影响。\n\n### 更多内容...\n\n\
  分组也可用于日期和数值数据类型列，并包含“分箱”的概念，即根据落入特定范围的值进行分组。例如，可以将“产品”表中的 ListPrice 列划分为大小相等的箱，以便跨价格范围进行分析。可以选择一个箱的具体大小或一组箱的数量。日期数据类型也可使用类似的对话框。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_182_0.png)\n\n图3.43：数值数据类型列的分箱\n\n##\
  \ 如何设计列级安全性\n\n要实现本操作，请执行以下步骤：\n\n- 1. 使用两个表中的 **Index** 列在 **Reseller Costs** 和\
  \ **Reseller Sales** 表之间创建关系。将此关系设置为一对多，**Reseller Sales** 表位于 **一** 侧，**Reseller\
  \ Costs** 表位于 **多** 侧。\n- 2. 在 **模型** 视图的 **主页** 选项卡或 **报表** 视图的 **建模** 选项卡的功能区中，单击\
  \ **管理角色**。\n- 3. 使用 **创建** 按钮创建一个 **Sales Person** 角色，该角色在 **Reseller Costs** 表上具有\
  \ RLS，使用 DAX 公式 `ISBLANK([Index])`，并 **保存** 该角色。\n- 4. 在 **报表** 视图中，使用 **Reseller\
  \ Sales** 表中的 **SalesOrderNumber** 和 **SalesAmount** 列，以及 **Reseller Costs** 表中的\
  \ **ProductStandardCost** 和 **TotalProductCost** 列，创建一个简单的 **表** 可视化。注意，所有列都会显示值。\n\
  - 5. 在 **建模** 选项卡的功能区中单击 **查看身份**，选择 **Sales Person**，然后单击 **确定** 按钮。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_185_0.png)\n\
  \n图3.44：所需的多对一关系\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_185_1.png)\n\n图3.45：管理角色对话框\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_185_2.png)\n\n图3.46：查看身份角色对话框\n\n- 6.\
  \ 等待可视化刷新，注意 **ProductStandardCost** 和 **TotalProductCost** 列现在为空。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_186_0.png)\n\
  \n图3.47：以角色身份查看\n\n### 工作原理\n\n本操作的关键在于：在中间查询中实现 **Index** 列，**Reseller Sales**\
  \ 和 **Reseller Costs** 表之间关系的特性，以及通过 **Sales Person** 角色实现 RLS。\n\n由于 **Index**\
  \ 列是在一个中间表中创建的，而 **Reseller Sales** 和 **Reseller Costs** 查询均将其引用为 **Source**，因此我们可以确定\
  \ **Reseller Sales** 和 **Reseller Costs** 表中的行之间存在一一对应关系。\n\n至关重要的是，**Reseller Sales**\
  \ 和 **Reseller Costs** 表之间的关系必须是一对多，并且具有 **单个** 交叉筛选方向，尽管从技术上讲，这两个表之间存在一对一关系。原因是一对一关系必须是双向的。这意味着，筛选掉\
  \ **Reseller Costs** 表中所有行的 DAX RLS 规则将反过来筛选掉 **Reseller Sales** 表中的所有行，这不是我们期望的结果。\n\
  \nDAX RLS 规则 `ISBLANK([Index])` 会为 **Sales Person** 角色筛选掉 **Reseller Costs** 表中的所有行，因为\
  \ **Index** 列永远不会为空。请注意，虽然值被隐藏，但受保护列的元数据在模型中仍然可用。\n\n### 更多内容...\n\n存在其他列级安全性的替代方法。一种方法是使用单个事实表，并使用度量值来实现列安全性。在这种方法中，会创建一个虚拟的\
  \ **Security** 表，该表只有一列一行，包含一个值。对于此虚拟表，会为角色创建一个类似的 DAX RLS 规则，例如 `ISBLANK([Column])`。使用此方法，所有需要安全保护的列都会在模型中隐藏，并替换为具有类似于以下语法的度量值：\n\
  \n```dax\nIF(ISBLANK(COUNTROWS('Security')),BLANK(),SUM('Reseller Sales'[TotalProductCost]))\n\
  ```\n\n这种方法可以扩展到处理多个角色，每个角色需要不同的列安全性，方法是在 Security 表中为每个角色设置一行，并设置相应的 RLS 规则，例如\
  \ [Column] = \"Sales Person\"、[Column] = \"Marketing\" 和 [Column] = \"Accounting\"\
  。DAX 度量值将相应调整。请注意，虽然值被隐藏，但受保护列的元数据在模型中仍然可用。还可以在 Tabular Editor 中编辑表权限。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_187_0.png)\n\
  \n图3.48：Tabular Editor 中角色的表权限\n\n遗憾的是，Power BI Desktop 并未完全支持这一点。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_187_1.png)\n\
  \n图3.49：Power BI Desktop 中的错误\n\n最后，SSAS 表格 2017 及更高版本实现了真正的 OLS，允许表和列完全对角色屏蔽，包括其元数据。Azure\
  \ Analysis Services 和 Power BI Premium 也支持 OLS。\n\n### 另请参阅\n\n- 列级安全性：http://bit.ly/2P5Gc20\n\
  - Analysis Services 表格模型对象级安全性：http://bit.ly/2PEbCMs\n- Analysis Services 2017 中的对象安全性：http://bit.ly/39m1P4S\n\
  - 宣布 Power BI 中对象级安全性的公开预览：https://bit.ly/3x182N0\n\n## 利用聚合表\n\nDirectQuery 模式是克服导入模式可伸缩性问题或为业务用户提供实时报表的绝佳工具。但是，DirectQuery\
  \ 可能很慢，并且会给后端服务器系统带来很大负担，因为每次视觉对象刷新和交互都会向源系统发送查询。聚合表和双模式存储表旨在解决对包含数百万、数十亿和数万亿行的大型数据集使用\
  \ DirectQuery 时产生的速度问题。本质上，聚合表预先聚合数据，并将其存储在导入模式中。Power BI 在可能的情况下会在后台使用这些聚合表，以限制发送到数据源的查询数量。\n\
  \n本操作演示如何创建和配置用于 Power BI 报表的聚合表。\n\n### 准备工作\n\n要准备本操作，请执行以下步骤：\n\n- 1. 打开 Power\
  \ BI Desktop。\n- 2. 创建名为 **Internet Sales** 的 DirectQuery 查询，该查询访问 **FactInternetSales**\
  \ 表。\n- 3. 创建名为 **Customers** 的 DirectQuery 查询，该查询访问 **DimCustomers** 表。\n- 4. 创建名为\
  \ **Dates** 的 DirectQuery 查询，该查询访问 **DimDates** 表。\n- 5. 使用以下代码添加一个名为 **Sales Agg**\
  \ 的查询（编辑 **Source** 行）：\n\n```\nlet\n    Source = Sql.Database(\"localhost\\MSSQLSERVERDEV\"\
  ,\n    \"AdventureWorksDW2019\"),\n    Navigation = Source{[Schema=\"dbo\",Item=\"\
  FactInternetSales\"]}[Data],\n    Group =\n        Table.Group(Navigation, {\"OrderDateKey\"\
  , \"CustomerKey\"},\n        {{\"SalesAmount_Sum\", each List.Sum([SalesAmount]),\
  \ type number},\n```\n\n\n\n\n\n```\n{\"{UnitPrice_Sum}\", each List.Sum([UnitPrice]),\
  \ type number}),\nChangeType = Table.TransformColumnTypes(Group,\n    {{\"SalesAmount_Sum\"\
  , Currency.Type},\n    {\"UnitPrice_Sum\", Currency.Type}} )\nin\nChangeType\n```\n\
  \n+   6. 将 Internet Sales 查询移动到名为 Facts 的查询组中，将 Customers 和 Dates 查询移动到名为 Dimensions\
  \ 的查询组中，并将 Sales Agg 查询移动到 Other Queries 查询组。\n+   7. 在“开始”选项卡的功能区上单击“关闭并应用”以将表加载到数据模型中。\n\
  +   8. 在模型中创建以下单向、一对多关系，如图 3.50 所示。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_189_0.png)\n\
  \n请注意，您可能需要为数据源使用数据库凭据而不是 Windows 凭据。在测试中，我们在尝试使用 Sales Agg 表和维度表创建关系时，使用 Windows\
  \ 凭据遇到了问题。\n\n# 如何操作\n\n要实现此配方，请使用以下步骤：\n\n+   1. 在 **Model** 视图中，右键单击 **Sales Agg**\
  \ 表并选择 **Manage aggregations**。\n+   2. 为 **Sales Agg** 表创建下面所示的聚合，然后单击 **Apply\
  \ all** 按钮。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_190_0.png)\n\n图 3.51：Manage\
  \ aggregations 对话框\n\n+   3. 在 **Model** 视图中，选择 **Customers** 表，并在 **Properties**\
  \ 窗格的 **Advanced** 区域中，将 **Storage mode** 设置为 **Dual**。\n+   4. 对 **Dates** 表重复\
  \ *step 3*。\n+   5. 从 SQL Server Management Studio 的 **Tools** 菜单打开 **SQL Server\
  \ Profiler** 并运行跟踪。\n+   6. 创建一个 **Table** 可视化，使用 **Customers** 表中的 **EnglishEducation**\
  \ 列和 **Internet Sales** 表中的 **SalesAmount** 列。请注意，跟踪中没有任何内容被记录。\n+   7. 创建一个 **Clustered\
  \ column chart**，以 **Dates** 表中的 **CalendarYear** 列作为 **Axis**，以 **Internet Sales**\
  \ 表中的 **SalesAmount** 列作为 **Values**。同样，没有任何内容被记录。\n\n# 其工作原理\n\n核心事实表 **Internet\
  \ Sales** 必须设置为 **DirectQuery** 存储模式至关重要，因为聚合表仅适用于设置为 **DirectQuery** 存储模式的明细表。聚合表本身\
  \ **Sales Agg** 必须设置为 **Import** 存储模式。与 **Internet Sales** 表和 **Sales Agg** 表都有关系的两个维度表\
  \ **Customers** 和 **Dates**，应设置为 **Dual** 存储模式，以便这些表能够在任一模式下最佳运行。配置表的聚合会自动在数据模型中隐藏该表，因为聚合表必须被隐藏。\n\
  \n维度表与聚合表之间必须存在关系。这是因为聚合表在可能的情况下用作详细 **DirectQuery** 模式事实表的替代，因此聚合表应与事实表对维度表具有相同的关系。\n\
  \n在配置聚合时，还必须牢记列数据类型。这是因为 **Manage aggregations** 对话框强制执行 **Detail Column** 必须与 **Aggregation\
  \ Column** 具有相同数据类型的规则。唯一例外是 **Count** 和 **Count table rows** 的 **Summarizations**。**Count**\
  \ 和 **Count table rows** 需要整数聚合列，但不要求 **Detail Column** 的数据类型匹配。\n\n其他限制包括链式聚合、由\
  \ DAX USERELATIONSHIP 函数支持的非活动关系的使用，以及使用相同的 **Summarization**、**Detail Table** 和\
  \ **Detail Column** 的重复聚合。均不支持这些场景。\n\n# 还有更多...\n\n为了正常运行，RLS 表达式应同时过滤明细表和聚合表。事实上，一旦为表设置了聚合，仅过滤聚合表而不过滤关联\
  \ **Detail Table** 的 RLS 表达式将不被 **Manage roles** 对话框允许。\n\n**Manage roles** 对话框包括设置\
  \ **Precedence** 的功能。这意味着您可以拥有不同粒度级别的多个聚合表，并设置这些聚合表的 **Precedence**，以便它们可以被单个子查询考虑。例如，如果\
  \ **Products** 表包含在此模型中，您可能会为 **Product Category** 创建一个聚合表，并为 **Product Subcategory**\
  \ 创建一个单独的聚合表。您将把 **Product Category** 聚合表的粒度设置为 10，并将 **Product Subcategory** 聚合表的粒度设置为\
  \ 0。子查询将首先考虑粒度最高的聚合表，如果该粒度级别不足，则会考虑粒度较低的其他聚合表。\n"
- "# Authoring Power  \nBI Reports\n\nPower BI 报表是仪表板、数据探索以及 Power BI 中内容协作和分发的构建基块。Power\
  \ BI Desktop 提供了丰富的数据可视化功能和选项，使能够在各种设备上构建高度针对性、用户友好的报表成为可能。由于每个 Power BI Desktop\
  \ 报表可以包含多个页面，每个页面包含多个视觉对象，因此单个 Power BI 报表可以支持多种用例、受众和业务需求。例如，KPI 视觉对象可以固定到 Power\
  \ BI 服务中的仪表板，而报表页面可以支持详细、特定领域的分析。这些功能可直接与竞争对手分析平台的可视化产品竞争，并且可以通过自定义视觉对象和报表主题进一步扩展。\n\
  \n报表设计中 Power BI 可视化功能的选型和配置对于从 *Chapter 2, Accessing and Retrieving Data* 和 *Chapter\
  \ 3, Building a Power BI Data Model* 中涵盖的数据检索和建模过程中获取价值至关重要。在本章中，我们开发并描述了最基本的报表可视化和设计概念。此外，还提供了指导，以增强和控制用户在\
  \ Windows 和移动设备上与 Power BI 报表交互和使用时的用户体验。\n\n在本章中，我们将介绍以下配方：\n\n+   - Building Rich\
  \ and Intuitive Reports\n+   - Filtering at Different Scopes\n+   - Integrating\
  \ Card Visualizations\n+   - Using Slicers\n+   - Controlling Visual Interactions\n\
  \n# Getting ready\n\n利益相关者矩阵可以帮助围绕访问模型和报表的不同各方需求来构建报表设计规划过程。利益相关者或业务部门，例如 Merchandising，出现在列轴上，并取代了第\
  \ 3 章《Building a Power BI Data Model》中数据仓库总线矩阵中使用的规范化维度（即 Product 或 Vendor）。\n\n\
  |  | Stakeholders |  |  |  |  |  |  |  |\n|---|---|---|---|---|---|---|---|---|\n\
  | BUSINESS PROCESSES | Executive | Sales | Finance | Marketing | Merchandising |\
  \ eCommerce | Customer Service | Supply Chain |\n| Internet Sales | ✓ | ✓ | ✓ |\
  \ ✓ | ✓ | ✓ |  |  |\n| Internet Sales Plan | ✓ | ✓ |  | ✓ |  | ✓ | ✓ | ✓ |\n| Reseller\
  \ Sales | ✓ | ✓ | ✓ |  | ✓ |  |  |  |\n| General Ledger | ✓ |  | ✓ |  |  |  |  |\
  \  |\n| Inventory |  |  | ✓ | ✓ | ✓ | ✓ |  |  |\n| Customer Surveys | ✓ | ✓ | ✓\
  \ | ✓ |  | ✓ | ✓ | ✓ |\n| Customer Service Calls |  |  | ✓ |  |  |  | ✓ |  |\n|\
  \ Shipping |  |  | ✓ |  | ✓ |  |  | ✓ |\n\n图 4.1：利益相关者矩阵\n\n在此示例中，数据模型包含四个突出显示的事实表：Internet\
  \ Sales、Internet Sales Plan、Reseller Sales 和 General Ledger。当给定业务职能内可能存在多个具有各自独特需求和用例的利益相关者时，这些利益相关者可以作为列添加到利益相关者矩阵中。在\
  \ Power BI 中，有许多选项可使用相同的数据模型和底层检索和数据架构来满足不同利益相关者的独特需求。\n\n# How to Build Reports\n\
  \n虽然报表开发应是一个敏捷过程，在报表设计和开发过程中应定期征求利益相关者的反馈，但在报表开始前进行扎实的规划和设计过程对于了解其范围和要求非常有益。单个报表不应试图解决不相关的业务问题或满足高度多样化用户（如企业财务分析师或商店经理）的需求。多范围报表可能导致复杂的用户体验和报表级定制，这难以维护和扩展。报表规划和设计过程应回答以下五个问题：\n\
  \n+   1. 谁将访问此报表？\n+   2. 此报表的首要优先事项在业务问题方面是什么？\n+   3. 报表将如何访问和使用？\n\n\n\n\n\n\
  报告将如何被访问和使用？报告将如何被访问，以及业务用户希望如何与报告交互，是在开始报告开发之前就应该回答的关键问题。报告的访问方式和交互性是报告设计人员应该理解的关键组成部分，以确保报告包含适当的元素、视图、筛选器和度量值。请考虑以下事项：\n\
  \n-   用户是仅查看报告，还是将报告作为进一步分析的起点？\n-   如果希望不进行交互或仅进行有限的交互，请计划在报告中嵌入条件逻辑和异常情况。\n- \
  \  如果交互性较高，请计划使用层次结构、工具提示和切片器来实现数据探索。\n-   报告与现有仪表板有何关系？\n-   确定报告中将对现有仪表板有所贡献的组件。\n\
  -   如果基于该报告创建新仪表板，请确定磁贴和交互方式。\n-   报告是仅通过 Web 浏览器访问，还是会定期使用移动设备？\n-   如果预期有移动端消费，可以针对这种体验进行报告设计。\n\
  -   Power BI 仪表板也可以在 Power BI 服务中针对手机布局进行优化。\n\n所需数据的更新频率是多少？这会影响模型吗？所需数据的更新频率会影响所选择的存储模式，无论是导入模式、DirectQuery\
  \ 模式、双模式，甚至是流式数据集。导入模式模型对于只需要每天刷新一两次数据的业务用户来说可能已经足够，但对于需要更即时更新频率的业务用户，DirectQuery\
  \ 模型可能更为合适。其他因素也可能影响修改数据模型的需求，包括：\n\n-   如果某项报告需求对某个利益相关者群体的所有报告都具有系统性影响，请考虑修改模型。\n\
  -   如果需要进行复杂的报告级自定义，或者性能不佳，请考虑修改模型。\n-   这些修改通常包括新的逻辑属性或新的 DAX 度量值。\n\n最后，理解在 Power\
  \ BI Desktop 中创建的 Power BI 报告并非适用于所有报告类型，这一点至关重要。多页打印、以各种文件格式附加数据的电子邮件订阅以及像素级完美格式控制等报告需求，与在\
  \ Power BI Report Builder 中创建的分页报告更为匹配。同样，涉及单元格级控制和格式设置的自定义布局的财务报表和会计报告通常更适合使用 Excel。幸运的是，Power\
  \ BI 完全支持另外这两种报告类型，因此可以开发包含全部三种不同报告类型的解决方案。\n\n## 工作原理\n\n在此示例中，利益相关者是欧洲销售区域组，由法国、德国和英国组成。规划过程揭示了两种主要用户类型。第一种用户是欧洲销售组经理，负责管理整个销售区域。第二种用户是负责各个国家的经理。\n\
  \n确定的首要优先级是按国家和产品细分（相对于类别、子类别和型号）查看和分析月度粒度的互联网销售与计划、经销商销售和销售利润率。国家经理希望获得州/省、城市和邮政编码级别的更细粒度地理数据。整个组织在会计核算上采用会计日历，但业务利益相关者希望报告在报告数据时使用日历月而不是会计月。业务方还对随时间比较互联网销售与客户数量感兴趣。\n\
  \n关于报告的访问和使用方式，欧洲销售组经理需要整个欧洲销售区域的关键事实、数据和趋势；预计该经理不会与报告进行大量交互，但仍应有机会在需要时深入查看数据。欧洲销售组经理希望获得一份可以在手机上查看的移动报告，因为此人经常在国家之间出差，始终处于移动状态。各个国家经理希望以高度交互的方式分析自己的数据。国家级经理也对销售计划负责，但他们对更大的自助服务灵活性感兴趣，并且需要一些表格格式的详细报告，以展示多个度量值的具体数值。国家经理预计将通过桌面端\
  \ Web 浏览器访问报告。\n\n在数据更新速度方面，销售组经理和国家经理都认为每日刷新一次或两次是可以接受的，因为主要关注的粒度是月度数据。各方还一致认为，使用美式英语名称、描述和货币最能满足该团队的需求。根据规划过程中确定的需求，决定了模型必须包含互联网销售、经销商销售、总账和互联网销售计划的事实表。此外，还需要以下维度：产品、账户、带地理数据的客户、日期、部门、组织、员工、经销商、促销和销售区域。目前没有任何单一模型包含所有所需信息，因此决定开发一个新模型。\n\
  \n需求收集完成后，确定报告将包含两到四个主要报告页，每个国家一个页面（或一个单独的钻取国家页面），以及一个供欧洲销售组经理使用的页面。所有报告页面左上角都将包含相同的四个优先度量值：月度互联网销售、月度互联网利润率%、月度经销商销售和月度经销商利润率%，以及一个按日历年和日历月显示的**互联网销售与计划**图表。对于没有目标或目标值（计划）的度量值，使用过去\
  \ 6 个月的平均值度量。\n\n考虑到性能和可用性，决定将每页的视觉对象数量限制为四五个，并避免密集的“数据提取或转储”视觉对象。此限制不适用于卡片图、仪表图和\
  \ KPI 视觉对象。DAX 查询是为报告视觉对象生成的，与密集视觉对象（如包含许多行和列的表格或矩阵）关联的查询比卡片图和 KPI 视觉对象慢得多。此外，包含许多视觉对象的报告页面可能显得拥挤且难以使用。此外，还将研究在报告和页面级别应用简单筛选器（当前年份或上一年份）的机会，以进一步提高性能。报告将在报告级别按欧洲筛选，并针对这些特定页面在页面级别按各个国家筛选。\n\
  \n报告有效性的一个可靠预测指标是业务见解（度量值、上下文或分析）与用户消费信息所需付出的努力之间的比率。理想情况下，报告应提供开箱即用的分析，用户只需要访问权限以及对术语和领域的基本了解即可。用户需要滚动、点击以及避开不必要的颜色或数据元素的操作越多，报告的有效性就越低。\n\
  \n规划和设计完成后，创建报告页面的线框图，向用户展示，并进行完善。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_199_0.png)\n\
  \n图 4.2：欧洲月度销售和利润率报告页面\n\n图 4.2 是区域级别报告的线框图，而图 4.3 在国家级别显示类似信息。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_200_0.png)\n\
  \n图 4.3：英国报告页面\n\n根据用户反馈，使用带有月度趋势和目标度量值的 KPI 视觉对象，与卡片图或仪表图视觉对象相比，能提供更丰富的上下文。总体而言，选择了一种在视觉感知和额外分析上下文方面具有优势的标准视觉对象类型。例如，使用\
  \ KPI 而不是卡片视觉对象；避免使用仪表图、树状图和饼图。对于**互联网销售与计划**，选择了聚集柱形图而不是折线图，因为每个月的单个数值都很重要。一目了然，每个国家报告页面还通过自动更新的\
  \ KPI 视觉对象提供数值。\n\n其他设计决策包括以下内容：\n\n- 切片器视觉对象以及散点图上的**播放**轴排列在左侧，以支持用户的筛选选择。\n-\
  \ 将鼠标悬停在地图中的气泡或图表中的条形图上时，会通过工具提示显示其他度量值。\n- 页面标题使用文本框，最后刷新日期页脚是卡片视觉对象。检索使用`DateTime.LocalNow`函数的\
  \ M 查询，并将其传递给 DAX 度量值，返回文本。\n- 图表标题经过自定义，并在可能的情况下移除 y 轴。\n\n\n\n\n\n本章其他配方中包含了本示例中使用的各个报表组件的更多详细信息。\n\
  \n## There's more...\n\n与 *Chapter 3, Building a Power BI Data Model* 中分享的数据建模简单却重要的细节类似，若干设计实践显著提升了\
  \ Power BI 报表的价值和用户采用率：\n\n- **Minimalism:** 任何对理解并非严格必需的报表元素都应移除。示例包括图像、冗余图表轴、冗长文本和不必要的数据图例。\n\
  - **Efficient visuals:** 利用在相同空间内提供额外洞察的可视化对象和功能；示例包括 KPI 和组合图表可视化、工具提示、趋势线和颜色饱和度。\n\
  - **Meaningful colors:** 颜色应用于传达含义，例如相对于目标或度量的高或低差异。应选择性地使用颜色，避免因颜色种类或密度过多而使用户感到不知所措或分心。\n\
  - **Organized:** 报表可视化应保持对齐、分布均匀，并位于相关可视化附近。最重要的可视化应位于画布左上角，空白应分隔可视化。\n- **Consistent:**\
  \ 布局和格式选择，例如可视化放置、字体和文本对齐应保持一致。例如， slicer 可视化应始终放置在可视化的左侧或顶部。\n\n关于一致性，Power BI\
  \ 支持包含标准调色板、字体、字体大小以及控制报表和可视化默认值的其他元数据元素的报表主题。Power BI 报表默认设置的几乎每个方面都可被控制，包括轴标题是否显示、标签方向、图例标记，以及页面和可视化在\
  \ **Format** 选项卡中出现的几乎所有内容。\n\n许多组织将拥有标准报表主题，甚至标准报表布局。通常，这些主题反映了企业品牌和身份。在本示例中，对报表应用了报表主题，以便色觉缺陷的用户能够清晰地理解：\n\
  \n- 从报表主题库下载 **Color Blind Friendly** 主题 https://aka.ms/pbithemes。 使用 ColorblindSafe-Longer.json\
  \ 文件。\n- 在 Power BI Desktop 中打开 CH4_Start.pbix 并将此文件另存为 CH4_R1.pbix。\n\n在 **View**\
  \ 选项卡的 ribbon 中，单击 **Themes** 区域中的下拉箭头并选择 **Browse for themes**：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_202_0.png)\n\
  \n浏览到下载的 JSON 文件，选择它并单击 **Open**。 将出现一条消息，说明主题已成功导入。 主题设置将应用于报表。 现在用于格式化可视化的颜色反映了主题的颜色。\
  \ 保存 CH4_R1.pbix。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_202_1.png)\n\n主题无法在\
  \ Power BI 服务中应用，并且某些自定义可视化不应用报表主题。 此外，报表主题不影响图像的颜色，也不覆盖对可视化中特定数据点应用的任何自定义颜色。 在开发报表时尽早应用主题非常重要，以避免在应用主题后花费数小时的格式设置突然被撤销的情况！\n\
  \n每个报表主题 JSON 文件都具有与 *Figure 4.6* 所示一致的颜色代码映射元素结构。\n\n```json\n{\n  \"name\": \"\
  ColorBlindSafe-Longer\",\n  \"dataColors\": [\"#074650\", \"#009292\", \"#edc948\"\
  , \"#eb6ba4\", \"#490091\", \"#b5d6ff\", \"#b3dafe\", \"#6db6ff\", \"#914800\",\
  \ \"#23cfd3\"],\n  \"background\": \"#FFFFFF\",\n  \"foreground\": \"#074650\",\n\
  \  \"tableAccent\": \"#f2e6db\"\n}\n```\n\nJSON 文件中仅 **Name** 字段是必需的。可以在 dataColors\
  \ 字段中输入任意数量的不同代码。\n\n## See also\n\n- ▶ Visualizations in Power BI reports: http://bit.ly/2poUeMv\n\
  - ▶ Tips For Power BI Report Design – Best Practices: http://bit.ly/3fmFXPf\n- ▶\
  \ Power BI Best Practices Guide: http://bit.ly/3cxCs29\n- ▶ Power BI Community Themes\
  \ Gallery: https://aka.ms/pbithmes\n- ▶ Use report themes in Power BI Desktop: http://bit.ly/31vBixz\n\
  - ▶ Theme generator: https://themes.powerbi.tips/\n\n## Filtering at Different Scopes\n\
  \n过滤器可针对 Power BI 报表的每个架构级别进行配置，包括整个报表、报表页面和单个可视化。由于报表过滤器在设计时配置且不像切片器那样在画布上公开，因此过滤器提供了一种强大而高效的方法，可根据特定需求自定义报表元素。\
  \ 与访问报表的用户或团队或要分析的特定实体相一致的报表级和页面级过滤器可提供即时关注和一定程度的组织。例如，为一个产品类别构建的报表页面可以为其他产品类别页面复制，每个页面包含不同的页面级过滤器。可视化级过滤器提供更大的灵活性，因为除了报表级和页面级过滤器之外，还可以定义包括度量在内的复杂过滤条件。\n\
  \n在本配方中，提供了在三个不同范围实现过滤器的示例。本节演示了 Top N 可视化级过滤条件，并在 How it works 中分享了过滤器类型生成的 DAX\
  \ 查询示例。\n\n### Getting ready\n\n为准备本配方，请执行以下步骤：\n\n- 1. 打开 CH4_R1.pbix 文件并将其另存为\
  \ CH4_R2.pbix。\n- 2. 右键单击页面选项卡并选择 Rename Page，将 Page 1 重命名为 Europe：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_203_0.png)\n\
  \nFigure 4.7: Page renaming and creation\n\n### Authoring Power BI Reports\n\n-\
  \ 3. 使用 **+** 图标创建四个额外的报表页面，命名为 **France**、**Germany** 和 **United Kingdom**，以及 **Scratch**：\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_204_0.png)\n\nFigure 4.8: Report pages\n\
  \n- 4. 保存您的工作。\n\n### How to Filter at Different Scopes\n\n要实现本配方，请使用以下步骤：\n\n-\
  \ 1. 切换到 **Europe** 页面。\n- 2. 在 **Fields** 窗格中，将 **Sales Territories** 表中的 **Sales\
  \ Territory Group** 列拖到 **Filters** 窗格中的 **Filters on all pages** 区域。\n- 3. 使用 **Basic\
  \ filtering** 选择 **Europe**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_204_1.png)\n\
  \nFigure 4.9: Report-level filter for European Sales and Margin Monthly Report\n\
  \n- 4. 同样地，在 **France**、**Germany** 和 **United Kingdom** 的国家页面上，将 **Sales Territories**\
  \ 表中的 **Sales Territory Country** 列从 **Fields** 窗格拖到 **Filters** 窗格中的 **Filters\
  \ on this page** 区域，并从 **Basic filtering** 中为页面选择相应的国家。\n- 5. 现在选择 **Scratch** 页面。\n\
  - 6. 通过从 **Visualizations** 窗格中选择 **Table visual** 创建 **Table visualization**，然后从\
  \ **Fields** 窗格中添加 **Sales Territories** 表中的 **Sales Territory Country** 和 **Internet\
  \ Sales** 表中的 **Internet Gross Sales** 度量。\n- 7. 选择 **Table visualization**，并在 **Filters**\
  \ 窗格中展开 **Filters on this visual** 部分中的 **Internet Gross Sales** 区域。\n- 8. 从 **Show\
  \ items when the value** 下的下拉菜单中选择 **is greater than**，并在下拉菜单下方的字段中输入 `3000000`。\n\
  - 9. 单击 **Apply filter** 将过滤器应用于可视化。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_205_0.png)\n\
  \nFigure 4.10: Visual-level filter\n\n### How it works\n\n报表级过滤器会影响报表中的所有页面；因此，当过滤器应用于\
  \ **Filters** 窗格的 **Filters on all pages** 区域时，只要模型中存在维度关系且 DAX 未覆盖过滤器，所有页面上的所有可视化都会遵守此过滤器。对于上一配方中描述的报表，已确定欧洲团队无需查看其他销售组或国家，因此我们对整个报表（所有页面）按\
  \ **Sales Territory Group of Europe** 进行过滤。同样，页面级过滤器仅影响其应用的页面上的可视化。因此，我们将每个国家页面过滤为适当的\
  \ **Sales Territory Country**。\n\n报表级和页面级过滤器最常在维度层次结构的相对静态且唯一值较少的不同级别实现，例如本配方中的示例。日期范围过滤器通常应应用于数据检索查询或报表画布中，使用日期切片器等可视化。由于这些过滤器分别应用于报表或页面中的所有可视化，因此应避免对高基数列（如\
  \ **ProductKey** 或 **Sales Order Number**）进行过滤。DAX 度量不能用于定义报表级和页面级过滤器。\n\n可视化级过滤器可以基于数据模型中的度量和列。这些度量和列可能存在于可视化中，也可能不存在。\n\
  \n\n\n\nPower BI 创建的 DAX 查询揭示了不同筛选器层的实现方式。使用 DAX Studio，我们可以查看用于存储报表级和页面级筛选器（以及切片器选择）的\
  \ DAX 变量：\n\n```\nDEFINE\nVAR __DS0FilterTable =\nTREATAS({\"Europe\"}, 'Sales Territories'[Sales\
  \ Territory Group])\n```\n\n图 4.11：DAX Studio 中的 DAX 报表级筛选器变量\n\n视觉级筛选器也是变量，但使用报表级和页面级变量作为输入。Power\
  \ BI 创建的 DAX 查询利用了最新的函数和功能，例如变量、VAR 和 TREATAS。\n\n## 更多内容...\n\n除了基本筛选，还有更高级的筛选选项，包括高级筛选和\
  \ Top N 筛选。文本列和数值列均支持 AND 条件和 OR 条件，以创建更复杂的筛选条件。要了解其工作原理，请按照以下步骤操作：\n\n1. 选择在“Scratch”页面上创建的表格可视化。\n\
  2. 在“筛选器”窗格中，清除“Internet Gross Sales”中的视觉级筛选器。\n3. 展开“此视觉对象上的筛选器”部分中的“Sales Territory\
  \ Country”区域，并将“筛选器类型”切换为“高级筛选”。\n4. 在“当值为下列项时显示项目”下拉列表中选择“包含”，在下方字段中输入字母 a，然后单击“应用筛选器”。United\
  \ Kingdom 将从表格可视化中消失。\n5. 清除此筛选器并将“筛选器类型”更改为“Top N”。\n6. 在“显示项目”下，选择“Top”并输入数字 2。\n\
  7. 将 Reseller Sales 表中的 Reseller Net Sales 度量值拖到“按值”区域，然后点击“应用筛选器”。此时 Germany 从表格中消失。\n\
  \n如果需要复杂的筛选条件，或者需要对包含许多不同值的列（例如 Sales Order Number）进行筛选，则在数据检索或模型中考虑此逻辑可能会有所帮助，从而简化生成的\
  \ DAX 查询。\n\n此外，报表级、页面级和视觉级筛选器可以使用 DAX 度量值覆盖。要了解其工作原理，请在 Sales Territories 表中创建以下度量值：\n\
  \n```\nCount Countries = COUNTROWS(ALL('Sales Territories'))\n```\n\n在 **Scratch**\
  \ 页面上使用**卡片可视化**来显示此新度量值，并观察该度量值为 **11**。无论应用何种报表级、页面级和视觉级筛选器，此度量值始终为 **11**。DAX\
  \ 函数 ALL 会覆盖应用于 **Sales Territories** 表的筛选器。\n\n## 另请参阅\n\n- Power BI 报表中的筛选器和突出显示：http://bit.ly/39y0msh\n\
  - Power BI 报表中的筛选器类型：http://bit.ly/3sBkMrQ\n\n## 集成卡片可视化\n\n卡片和多行卡片可视化通常位于报表页面的顶部和左侧区域，因为单个度量值和少量度量值组合很重要。虽然卡片在图形效果和交互性方面不如其他视觉对象，但卡片也是固定到\
  \ Power BI 仪表板的最常见磁贴，并且经常用于手机布局中以供移动查看。报表设计中的一个常见做法是，以卡片或 KPI 视觉对象的形式呈现几个高级度量值，然后围绕它们构建其他图表和表格视觉对象。\n\
  \n本教程演示如何使用卡片、多行卡片、KPI 和仪表可视化，以及文本框。\n\n### 准备工作\n\n若要准备本教程，请按照以下步骤操作：\n\n1. 打开\
  \ **CH4_R2.pbix** 文件，并将其另存为 CH4_R3.pbix。\n2. 切换到 **Scratch** 页面，然后使用 Ctrl-A 和 Delete\
  \ 删除所有视觉对象。\n3. 检查**筛选器**窗格，确保只有 **Europe** 筛选器处于活动状态。\n\n### 如何集成卡片可视化\n\n若要实施本教程，请执行以下步骤：\n\
  \n1. 选择 **Europe** 页面。\n2. 使用**可视化**窗格创建**卡片可视化**，然后在**字段**列表中选择 **Calculations**\
  \ 表中的 **Last Full Month** 度量值。\n3. 在**格式**窗格中，将**类别**和**背景**滑块切换为“关闭”。\n\n   ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_208_0.png)\n\
  \n   图 4.12：“格式”窗格\n\n4. 展开**数据标签**部分，将**文本大小**设置为 **18**，将**字体系列**设置为 **Segoe（粗体）**。\n\
  5. 展开**常规**部分，将**X 位置**设置为 **0**，**Y 位置**设置为 **0**，**宽度**设置为 **448**，**高度**设置为 **48**。通常建议先设置**宽度**和**高度**，再设置**X\
  \ 位置**和**Y 位置**。\n6. 单击页面画布的空白区域，重复步骤 2、3 和 4 以创建另一个显示 **Date Last Refreshed** 度量值的**卡片可视化**；在**常规**部分中，将**X\
  \ 位置**设置为 **168**，**Y 位置**设置为 **680**，**宽度**设置为 **305**，**高度**设置为 **36**。\n7. 单击页面画布的空白区域，在**插入**选项卡的功能区中选择**文本框**，然后输入\
  \ *欧洲每月销售和利润报告*。\n8. 使用 **Ctrl-A** 选择所有文本，然后将字体更改为 **Segoe（粗体）**，设置文本大小为 **18**，并使文本右对齐。\n\
  \n   ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_208_1.png)\n\n   图 4.13：格式化时要选择的设置\n\
  \n9. 在**设置文本框格式**窗格中，将**背景**滑块切换为“关闭”，并在**常规**部分中将**X 位置**设置为 **624**，**Y 位置**设置为\
  \ **0**，**宽度**设置为 **656**，**高度**设置为 **48**。\n10. 选择刚刚创建的**文本框**元素，然后使用 **Ctrl-C**\
  \ 和 **Ctrl-V** 在页面上复制并粘贴该视觉对象。\n11. 重新定位新的**文本框**元素，将文本替换为**上次刷新时间：**，并使文本左对齐。\n\
  12. 在**设置文本框格式**窗格的**常规**部分中，将**X 位置**设置为 **0**，**Y 位置**设置为 **675**，**宽度**设置为 **190**，**高度**设置为\
  \ **45**。\n13. 单击画布的空白区域，然后从**可视化**窗格中选择 KPI 可视化。\n14. 在**字段**列表中，展开 **Internet\
  \ Sales** 表，选择 **Internet Monthly Net Sales** 度量值作为**指示器**，选择 **Internet Monthly\
  \ Sales Goal** 度量值作为**目标**。在 **Dates** 表中，使用 **Year Month** 列作为**趋势轴**。\n15. 通过展开**标题**部分、将**标题**重命名为**每月\
  \ Internet 销售额**并居中**标题**，来设置刚刚创建的 KPI 视觉对象的格式。\n16. 在**指示器**部分中，将**显示单位**设置为**千**，**值小数位数**设置为\
  \ **0**，**文本大小**设置为 **40**。\n17. 在**常规**部分中，将**X 位置**设置为 **0**，**Y 位置**设置为 **48**，**宽度**设置为\
  \ **225**，**高度**设置为 **122**。\n18. 将**边框**滑块切换为“打开”，展开**边框**部分，并将**圆角半径**设置为 **5**。\n\
  19. 在**目标**部分中，将**标签**从**百分比**更改为**值**。\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_209_0.png)\n\
  \n    图 4.14：KPI 可视化\n\n20. 选择 KPI 可视化，然后使用 *Ctrl-C* 和 *Ctrl-V* 复制并粘贴该视觉对象。\n21.\
  \ 在页面上重新定位新的 KPI 视觉对象，并将**指示器**和**目标**分别替换为 **Internet Sales** 表中的 **Internet Monthly\
  \ Margin %** 和 **Internet Monthly Margin % Goal** 度量值。\n22. 设置此新 KPI 可视化的格式：将**标题**更改为**每月\
  \ Internet 利润率 %**，将**指示器显示单位**更改为**自动**，并在**常规**部分中将**X 位置**设置为 **224**，**Y 位置**设置为\
  \ **48**。\n23. 按住 *Ctrl* 键，然后使用鼠标选择两个 KPI 视觉对象。\n24. 使用 *Ctrl-C* 和 *Ctrl-V* 复制并粘贴这两个视觉对象，然后在页面上重新定位它们。\n\
  25. 对于**每月 Internet 销售额**视觉对象，将**指示器**和**目标**分别替换为 **Reseller Sales** 表中的 **Reseller\
  \ Monthly Net Sales** 和 **Reseller Monthly Sales Goal** 度量值。\n26. 设置此新 KPI 可视化的格式：将**标题**更改为**每月经销商销售额**，并在**常规**部分中将**X\
  \ 位置**设置为 **0**，**Y 位置**设置为 **168**。\n\n\n\n虽然在显示数值时应当优先使用 KPI 可视化效果，但卡片可视化也可以非常有效地用于显示动态文本数据，例如\
  \ **Date Last Refreshed** 列和 **Last Refreshed** 度量。**Last Refreshed** 度量的公式如下：\n\
  \n```\nLast Full Month = \"Last Full Month: \" & FORMAT(EOMONTH([Today],-1),\"yyyy-mmm\"\
  )\n```\n\n**Date Last Refreshed** 列是使用以下 Power Query 查询创建的：\n\n```\nlet Source =\
  \ #table(type table[Date Last Refreshed=datetime], {{DateTime.LocalNow()}}) in Source\n\
  ```\n\n静态文本信息可以使用简单的**文本框**元素显示，例如右上角的报告/页面标题和左下角的 **Last Refreshed:**。但是，文本框也可以通过问答（Q&A）功能实现动态显示，该功能可以在**文本框**格式对话框的**值**和**查看**对话框中访问。\n\
  \n## 更多内容...\n\nPower BI Desktop 的默认可视化库中还有两种卡片式和 KPI 式可视化效果：**多行卡片**和**仪表**可视化效果。多行卡片通常围绕共同维度和度量进行组织，并常常放置在\
  \ **KPI** 或**仪表**可视化的右侧作为补充详细信息。若要查看**多行卡片**可视化效果的实际应用，请按照以下步骤操作：\n\n- 1. 切换到 **Scratch**\
  \ 页面。\n- 2. 在**可视化**窗格中选择**多行卡片可视化**，然后将 **Internet Sales** 表中的 **Internet Customer\
  \ Count France**、**Internet Customer Count Germany** 和 **Internet Customer Count\
  \ United Kingdom** 度量放置在可视化的**字段**区域中。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_211_0.png)\n\
  \n图 4.15：多行卡片可视化\n\nPower BI Desktop 还包含一个**仪表**可视化，它是仪表板中**卡片**和 **KPI** 可视化的流行替代方案。若要查看**仪表**可视化的实际效果，请按照以下步骤操作：\n\
  \n- 1. 从 **Europe** 页面复制 **Monthly Internet Sales KPI** 可视化，并将其粘贴到 **Scratch** 页面。\n\
  - 2. 选中 KPI 可视化后，单击**可视化**窗格中的**仪表**可视化，将 KPI 可视化转换为**仪表**可视化。\n\n3. 将**值**设置为 **Internet\
  \ Monthly Net Sales** 度量，将**目标值**设置为 **Internet Monthly Sales Goal** 度量。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_212_0.png)\n\
  \n图 4.16：比较两个度量的仪表可视化（值与目标值）\n\n## 另请参阅\n\n- - **关键绩效指标（KPI）** 可视化：http://bit.ly/3rFPxe7\n\
  - - Power BI 中的径向仪表图：http://bit.ly/2PgtTjv\n- - 卡片可视化（大数字磁贴）：http://bit.ly/3uaMPib\n\
  - - 在 Power BI 中复制并粘贴可视化效果：http://bit.ly/39vECNL\n- - 开始设置 Power BI 可视化格式：http://bit.ly/3sGqzwm\n\
  \n## 使用切片器\n\n切片器可视化是用户向报表页面的其他可视化应用筛选选择的主要方式，因此其实现方式极大地影响了可用性和分析灵活性。尽管用户与其他可视化的交互也会对其他可视化应用交叉筛选，但切片器提供了定义特定筛选条件（例如三个特定月份和两个产品类别）的最快、最直观的方法。切片器可视化还具有用于定义选择行为的独特格式选项，包括**全选**选项。\n\
  \n切片器的替代方法是使用“筛选”窗格。虽然对最终用户来说可能不那么明显，并且需要特定的培训，但与切片器相比，使用“筛选”窗格确实具有节省画布空间的优势。然而，尽管“筛选”窗格可以提供切片器常见的一些基本使用场景，但切片器在与页面上不同可视化的交互、跨特定页面的切片器同步以及筛选元素相对于其他可视化的布局和位置方面提供了更大的灵活性。\n\
  \n在本节中，我们将探讨切片器的主要用例和报表设计注意事项，包括选择属性和格式选项。我们还将回顾适用于**日期**数据类型的切片器筛选配置，并提供有关文本搜索和替代切片器可视化的更多详细信息。\n\
  \n## 准备工作\n\n若要准备本节内容，请按照以下步骤操作：\n\n- 1. 打开 CH4_R3.pbix 文件，并将文件另存为 CH4_R4.pbix。\n\
  - 2. 切换到 Scratch 页面，然后使用 Ctrl-A 再按 Delete 删除所有可视化。\n- 3. 检查筛选窗格，确保仅激活 Europe 筛选器。\n\
  \n## 如何使用切片器\n\n若要实现本节内容，请使用以下步骤：\n\n- 1. 选择 Europe 页面。\n- 2. 使用可视化窗格创建切片器可视化，然后在字段列表中选择\
  \ Dates 表中的 Year Month 列。\n- 3. 选中切片器后，使用省略号 (...) 将排序更改为降序排序。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_213_0.png)\n\
  \n- 4. 在格式窗格中，将切片器标头设置为关闭，将标题设置为开启，并将标题更改为 Calendar Month。\n- 5. 在格式窗格中，将边框设置为开启，并将半径设置为\
  \ 5；在常规部分，将 X 位置设置为 0，Y 位置设置为 295，宽度设置为 160，高度设置为 178。\n- 6. 为 Products 表中的 Product\
  \ Category 列创建第二个切片器。\n- 7. 右键单击切片器中的 (Blank) 选项，然后选择排除。对 Components 重复此操作。\n- 8.\
  \ 在格式窗格中，将切片器标头设置为关闭，将标题设置为开启，并将标题更改为 Product Category。\n\n- 9. 另外，在**格式**窗格中，将**边框**设置为**开启**，并将**半径**设置为\
  \ **5**；在**常规**部分，将 **X 位置**设置为 **0**、**Y 位置**设置为 **479**、**宽度**设置为 **160**、**高度**设置为\
  \ **95**。\n- 10. 使用 *Ctrl-C* 和 *Ctrl-V* 复制并粘贴 **Product Category** 切片器。\n- 11. 在页面上重新定位新切片器，将切片器的**字段**替换为\
  \ **Sales Territories** 表中的 **Sales Territory Country** 列，并将切片器的**标题**编辑为 **Country**。\n\
  - 12. 编辑 **Country** 切片器的**常规**设置，将 **X 位置**设置为 **0**、**Y 位置**设置为 **580**、**宽度**设置为\
  \ **160**、**高度**设置为 **94**。\n- 13. 选择这三个切片器，然后使用 *Ctrl-C* 进行复制。\n- 14. 切换到 **France**\
  \ 页面，使用 *Ctrl-V* 粘贴这些切片器，并在**同步可视化**提示中选择**同步**。\n- 15. 在**视图**选项卡的功能区中选择**同步切片器**，选择\
  \ **Country** 切片器，然后取消选中 **France** 页面的同步。正确的配置如 *图 4.19* 所示。\n- 16. 关闭**同步切片器**窗格，将\
  \ **Country** 切片器的**字段**替换为 **Customers** 表中的 **State/ Province** 列，并将**标题**编辑为\
  \ **Regions**。\n- 17. 将 **Calendar Month** 和 **Product Category** 切片器复制到 **Germany**\
  \ 和 **United Kingdom** 页面，两次都选择**同步**。\n- 18. 将 **Regions** 切片器从 **France** 页面复制到\
  \ **Germany** 和 **United Kingdom** 页面，但这次在两个实例中都选择**不同步**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_214_0.png)\n\
  \n图 4.18：同步可视化提示\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_214_1.png)\n\n图 4.19：同步切片器控件\n\
  \n- 19. 在 **Germany** 页面上，将 **Regions** 切片器的**标题**更改为 **States**。\n- 20. 在 **United\
  \ Kingdom** 页面上，将 **Regions** 切片器的**字段**替换为 **Customers** 表中的 **City** 列，并将**标题**更改为\
  \ **Cities**。\n- 21. 在 **Europe** 页面的 **Calendar Month** 切片器中选择以下值：**2013-Dec, 2013-Nov,\
  \ 2013-Oct, 2013-Sept, 2013-Aug,** 和 **2013-Jul**。\n- 22. 切换到其他页面时，这些页面上的 **Calendar\
  \ Month** 切片器也会具有这些选择。\n- 23. 保存您的工作。\n\n## 工作原理\n\n切片器是重要的 Power BI 可视化对象，因此在确定切片器列时应仔细考虑。通常，切片器列是父级维度，例如年份或区域，且单个值较少。选择值较少的列可以允许这些项以列表形式在画布上显示，而不是使用下拉列表。使用过多的切片器，或具有过多不同值的切片器，会降低报表页面的可用性。如果没有大量的\
  \ DAX 自定义来解释筛选选择，用户可能不确定已应用了哪些筛选器。度量不能用于切片器，但切片器支持在其**字段**区域中使用层次结构和临时层次结构。\n\n\
  建议将切片器放置在页面上所有其他可视化的左侧。使用边框和/或背景颜色设置切片器可视化格式，使切片器在页面上突出显示。关于使用**切片器标头**还是**标题**，请选择其中一个，并在页面上所有切片器中保持一致。**切片器标头**提供**清除选择**选项（橡皮擦图标），并允许您将切片器从**列表**切换为**下拉列表**，反之亦然。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_215_0.png)\n\n在切片器中选择项会对页面上的其他可视化进行交叉筛选。单击选项旁边的复选框一次以选择该值，然后再次单击同一个复选框以取消选择同一值。按住\
  \ **Ctrl** 键可以选择多个值。可以使用**格式**窗格的**选择控件**区域来控制此行为。\n\n\n\n\n\n激活此选项会在项目列表顶部显示一个\
  \ **Search** 搜索栏。**Search** 对于长项目列表非常有用。\n\n切片器也可以在报表页面之间同步。同步的切片器意味着在一个页面上切片器中选择的项目会影响任何其他页面上存在同步切片器的页面。\
  \ 在页面之间复制和粘贴切片器会提示 **Sync visuals** 同步视觉对象 对话框，但也可以通过 **Sync slicers** 切片器同步 面板进行控制。默认情况下，不同页面上具有相同\
  \ **Field** 字段 的切片器会被“分组”，但您可以使用 **Advanced options** 高级选项 来控制这些分组。除了同步之外，**Sync\
  \ slicers** 切片器同步 对话框还允许您控制切片器在页面上的可见性。将同步切片器与在页面上使切片器不可见相结合可用于释放页面画布空间。\n\n## There's\
  \ more...\n\n切片器有很多选项。除了迄今为止讨论的选项外，还有特殊类型的切片器，例如水平切片器、范围切片器和相对日期切片器。\n\n水平切片器是一种可通过在\
  \ **Format** 格式 面板的 **General**常规 格式部分中更改 **Orientation** 方向 设置来激活的替代设计。水平方向的切片器通常放置在报表页面的顶部，并且对移动消费有益。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_217_0.png)\n\n切片器视觉对象在使用 **Date** 日期\
  \ 数据类型时包含强大的筛选选项，包括图形日期选择、之前/之后条件、相对日期和相对时间。**Date** 日期 数据类型的默认切片器类型是日期范围切片器或 **Between**\
  \ 之间 切片器。时间线的开始和结束点可以被选中并拖动以修改筛选条件。或者，选择日期输入单元格会显示一个图形日历选择器元素以选择日期。**Before** 之前\
  \ 和 **After** 之后 筛选选项分别使 **Between** 之间 对话框的开始和结束日期输入单元格变灰。**Relative Date** 相对日期\
  \ 选项提供三个输入框。第一个输入框允许选择 **Last** 上一个、**Next** 下一个 或 **This** 本。\n\n中间输入框允许输入一个数字，最后一个输入框提供各种日期间隔的下拉菜单；见图\
  \ 4.25。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_218_0.png)\n\n图 4.25：基于日期列的用于相对日期筛选的标准切片器\n\
  \n在 Format 面板中，您可以指定相对日期筛选器中是否包含当前日期以及锚定日期。切片器视觉对象的相对日期筛选选项也可用作报表、页面和视觉级别的筛选器。相对时间选项的功能类似于相对日期选项，只是间隔为分钟和小时。\n\
  \n数值数据类型的默认切片器格式也是 Between 切片器。数值切片器的 Less than or equal to 小于或等于 和 Greater than\
  \ or equal to 大于或等于 选项类似于日期切片器的 Before 之前 和 After 之后 选项。\n\n## See also\n\n- Slicers\
  \ in Power BI: http://bit.ly/3mkZcFX\n- Using slicers in the Power BI service: http://bit.ly/3fsCdHr\n\
  \n## Controlling Visual Interactions\n\nPower BI 报表页面默认是交互式的，所有视觉对象（切片器除外）都通过应用于一个视觉对象的选择进行交叉筛选。虽然这种动态筛选上下文通常有助于跨维度探索和分析，但通常也需要排除某些视觉对象不受此行为影响。例如，卡片或\
  \ KPI 视觉对象中反映的高优先级度量可以配置为忽略来自页面上切片器和其他视觉对象的任何筛选选择。此外，与默认的交叉筛选视觉对象的突出显示相比，专门在其他视觉对象中显示相关值可能更有益。\n\
  \n在本配方中，我们提供了配置视觉对象之间交互性的示例。\n\n## Getting ready\n\n为本配方做准备，请执行以下步骤：\n\n- 1. 打开\
  \ `CH4_R4.pbix` 文件并将文件另存为 `CH4_R5.pbix`。\n- 2. 切换到 **Scratch** 草稿 页面并使用 **Ctrl-A**\
  \ 然后 *Delete* 删除 来删除任何视觉对象。\n- 3. 检查 **Filters** 筛选器 面板并确保仅 **Europe** 欧洲 筛选器处于活动状态。\n\
  \n## How to Control Visual Interactions\n\n要实现本配方，请使用以下步骤：\n\n- 1. 选择 **Europe**\
  \ 欧洲 页面。\n- 2. 选择任何视觉对象并在 **Format** 格式 选项卡的 ribbon 上单击 **Edit interactions** 编辑交互。\n\
  - 3. 选择 **Calendar Month** 日历月份 切片器。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_219_0.png)\n\
  \n图 4.26：编辑交互\n\n- 4. 对于四个 KPI 视觉对象，单击 **None** 无 圆形图标。\n- 5. 对 **Product Category**\
  \ 产品类别 和 **Country** 国家/地区 切片器重复步骤 3 和 4。\n- 6. 对 **France** 法国、**Germany** 德国 和\
  \ **United Kingdom** 英国 页面重复步骤 3、4 和 5。\n- 7. 选择任何视觉对象并在 **Format** 格式 选项卡的 ribbon\
  \ 上单击 **Edit interactions** 编辑交互 以关闭编辑交互。\n- 8. 保存您的工作。\n\n## How it works\n\n在此示例中，确定\
  \ KPI 视觉对象应始终显示所有产品以及所有国家/地区、州/省和城市的最近完整月份的统计数据。为确保这一点，使用 Power BI Desktop 上的 **Edit\
  \ interactions** 编辑交互 功能，将所有其他视觉对象上的页面与所有其他视觉对象的交互设置为 **None** 无 而不是默认的 **Filter**\
  \ 筛选。\n\n必须认识到 DAX 度量可以通过使用 ALL、ALL EXCEPT 和 REMOVEFILTERS 等筛选函数来覆盖交叉筛选行为。事实上，根本不需要将日历月份切片器与\
  \ KPI 视觉对象之间的交互设置为 **None**，因为驱动 KPI 视觉对象的 DAX 度量在其计算中包含对 **Dates** 日期 表的 ALL 函数的使用。\n\
  \n## There's more...\n\n视觉对象之间的交叉筛选交互具有 **Filter** 筛选、**Highlight** 突出显示 和 **None**\
  \ 无 的选项——某些视觉对象，例如 KPI 视觉对象，仅包括 **Filter** 筛选 和 **None** 无 选项，而其他视觉对象，例如条形图和柱形图，还包括\
  \ **Highlight** 突出显示 选项。要查看 **Highlight** 突出显示 选项，请执行以下操作：\n\n- 1. 从 **Visualizations**\
  \ 视觉对象 面板创建 **Clustered column chart** 簇状柱形图。\n- 2. 从 **Fields** 字段 列表中，将 **Dates**\
  \ 日期 表中的 **Year Month** 年月 列添加为轴，并将 **Internet Sales** 互联网销售 表中的 **Internet Net\
  \ Sales** 互联网净销售额 和 **Internet Plan** 互联网计划 度量添加为 **Values** 值。\n- 3. 在 **Format**\
  \ 格式 面板中，展开 **Legend** 图例 并将 **Position** 位置 更改为 **Bottom** 底部，关闭 **X axis** X 轴上的\
  \ **Title** 标题，完全关闭 **Y axis** Y 轴，展开 **Data labels** 数据标签，并将 **Display units**\
  \ 显示单位 更改为 **Thousands** 千，**Value decimal places** 值小数位数 更改为 **0**，**Orientation**\
  \ 方向 更改为 **Horizontal** 水平；展开 **Title** 标题 部分并将 **Title text** 标题文本 更改为 **Internet\
  \ Sales to Plan** 互联网销售与计划，**Alignment** 对齐方式 为 **Center** 居中，并将 **Background**\
  \ 背景 关闭。\n- 4. 在 **General**常规 部分中，将 **X Position** X 位置 设置为 **449**，**Y Position**\
  \ Y 位置 设置为 **47**，**Width** 宽度 设置为 **831**，**Height** 高度 设置为 **241**。\n- 5. 创建一个\
  \ **Stacked bar chart** 堆积条形图，将 **Sales Territories** 销售区域 表中的 **Sales Territory\
  \ Country** 销售区域国家/地区 列作为 **Axis** 轴，并在 **Values** 值 字段井中放置 **Internet Sales** 互联网销售\
  \ 表中的 **Internet Net Sales** 互联网净销售额 度量，以及 **Reseller Sales** 经销商销售 表中的 **Reseller\
  \ Net Sales** 经销商净销售额 度量。\n- 6. 在 **Format** 格式 面板中，展开 **Legend** 图例 并将 **Position**\
  \ 位置 更改为 **Bottom** 底部，关闭 **Y axis** Y 轴上的 **Title** 标题，关闭 **X axis** X 轴上的 **Title**\
  \ 标题，然后完全关闭 **X axis** X 轴；展开 **Data labels** 数据标签 并将 **Display units** 显示单位 更改为\
  \ **Thousands** 千，展开 **Title** 标题 部分并将 **Title text** 标题文本 更改为 **Internet and Reseller\
  \ Sales by Country** 按国家/地区划分的互联网和经销商销售，**Alignment** 对齐方式 为 **Center** 居中，并将 **Background**\
  \ 背景 关闭。\n- 7. 在 **General**常规 部分中，将 **X Position** X 位置 设置为 **753**，**Y Position**\
  \ Y 位置 设置为 **295**，**Width** 宽度 设置为 **527**，**Height** 高度 设置为 **212**。\n- 8. 选择\
  \ **Stacked bar chart** 堆积条形图 视觉对象并在 **Format** 格式 选项卡的 ribbon 上单击 **Edit interactions**\
  \ 编辑交互。\n- 9. 将 **Clustered column chart** 簇状柱形图 视觉对象的交叉筛选从 **Highlight** 突出显示 更改为\
  \ **Filter** 筛选。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_221_0.png)\n\n图 4.27：交叉筛选图标\n\
  \n- 10. 对于四个 KPI 视觉对象，单击 **None** 无 圆形图标。\n- 11. 选择 **Clustered column chart** 簇状柱形图\
  \ 视觉对象并为四个 KPI 视觉对象单击 **None** 无 圆形图标。\n- 12. 选择任何视觉对象并在 **Format** 格式 选项卡上单击 **Edit\
  \ interactions** 编辑交互 以关闭编辑交互。\n- 13. 单击 **Internet Sales Plan** 互联网销售计划 视觉对象中的列并观察\
  \ **Internet and Reseller Sales by Country** 按国家/地区划分的互联网和经销商销售 视觉对象上的突出显示。\n- 14.\
  \ 同样，单击 **Internet and Reseller Sales by Country** 按国家/地区划分的互联网和经销商销售 视觉对象中的条形并观察\
  \ **Internet Sales Plan** 互联网销售计划 视觉对象被筛选。\n- 15. 将 **Internet Sales Plan** 互联网销售计划\
  \ 视觉对象复制到 **France** 法国、**Germany** 德国 和 **United Kingdom** 英国 页面。\n- 16. 保存您的工作。\n\
  \n## See also\n\n- Change how visuals interact in a report: http://bit.ly/3cGQazB\n\
  - Understand how visuals interact in a report: http://bit.ly/3wgsQR3\n\n\n\n\n\n\
  ## 利用图形可视化\n\n数据可视化和探索是 Power BI 的核心，报告中选用的可视化类型对用户的理解和采用贡献巨大。Power BI Desktop 包含一系列现代视觉对象，例如树状图和漏斗图，同时也为传统的折线图、条形图/柱状图、组合图和散点图提供了一组丰富的格式选项。此外，还有五种地图视觉对象可用于分析地理数据，并且通过\
  \ AppSource 商店（已集成到 Power BI Desktop 的“开始”功能区和“可视化”窗格中）可以获得整个自定义视觉对象库。\n\n缺乏经验的报表开发人员常犯的一个错误是过度使用花哨或复杂的图形视觉对象。报表开发人员应根据视觉对象与报表范围内业务问题的契合度来选择视觉对象，并且应始终优先考虑简单性和易用性。\n\
  \n本食谱提供了使用各种图形可视化类型的示例，如**折线图**、**折线和群集柱状图**、**地图**和**形状地图**。\n\n## 准备工作\n\n要准备本食谱，请执行以下步骤：\n\
  \n- 1. 打开 CH4_R5.pbix 文件，并将文件另存为 CH4_R6.pbix。\n- 2. 切换到 **Scratch** 页面，使用 *Ctrl-A*\
  \ 然后 *Delete* 删除所有视觉对象。\n- 3. 检查 **筛选器** 窗格，确保只有 **Europe** 筛选器处于活动状态。\n\n## 如何利用图形可视化\n\
  \n要实现本食谱，请执行以下步骤：\n\n- 1. 选择 **Europe** 页面。\n- 2. 从 **可视化** 窗格中选择 **散点图** 视觉对象，并从\
  \ **Sales Territories** 表中将 **Sales Territory Country** 列添加为 **图例**。\n- 3. 从 **Internet\
  \ Sales** 表中，将 **Internet Net Sales** 度量添加为 **X 轴**，将 **Internet Customer Count**\
  \ 度量添加为 **Y 轴**，将 **Internet Order Quantity Total** 度量添加为 **大小**。\n- 4. 从 **Dates**\
  \ 表中，将 **Date** 列（*不是 Date 层次结构*）添加到 **播放轴**。\n- 5. 在 **格式** 窗格的“常规”部分中，将 X 位置设置为\
  \ 160，Y 位置设置为 295，宽度设置为 594，高度设置为 381。\n- 6. 在 **格式** 窗格中，将图例设置为“关闭”，展开 Y 轴部分，并将轴标题更改为\
  \ Distinct Customers；然后展开标题部分，将标题文本更改为 Internet Sales and Customer Count Trend by\
  \ Country，并将对齐方式设置为居中。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_223_0.png)\n\n\
  图 4.28：散点图视觉对象\n\n- 7. 单击页面画布上的空白位置，然后从 **可视化** 窗格中选择 **折线图**。\n- 8. 使用来自 **Dates**\
  \ 表的 **Year Month** 列作为轴，来自 **Sales Territories** 表的 **Sales Territory Country**\
  \ 列作为图例，以及来自 **Internet Sales** 表的 **Internet Margin %** 度量作为值。\n- 9. 在 **格式** 窗格的“常规”部分中，将\
  \ X 位置设置为 754，Y 位置设置为 508，宽度设置为 526，高度设置为 212。\n- 10. 展开图例部分，将位置设置为底部，并删除图例名称。\n\
  - 11. 展开 X 轴和 Y 轴部分，并将两者的标题切换为“关闭”。\n- 12. 将数据标签切换为“关闭”。\n- 13. 展开标题部分，将标题文本更改为\
  \ Internet Sales Margin % by Country，并将对齐方式设置为居中。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_224_0.png)\n\
  \n图 4.29：折线图视觉对象\n\n- 14. 切换到 France 页面。\n- 15. 从 **可视化** 窗格中选择 **地图** 视觉对象，将来自\
  \ **Customers** 表的 **Location** 列添加为位置，将来自 **Internet Sales** 表的 **Internet Customer\
  \ Count** 度量添加为大小。\n- 16. 在 **格式** 窗格的“常规”部分中，将 X 位置设置为 160，Y 位置设置为 295，宽度设置为 288，高度设置为\
  \ 381。\n- 17. 将类别标签切换为“关闭”，并将标题切换为“关闭”。\n- 18. 单击画布的空白区域，并从 **可视化** 窗格中选择 **折线和群集柱状图**。\n\
  - 19. 从字段列表中，将来自 **Dates** 表的 **Year Month** 列添加为轴。\n- 20. 从 **Reseller Sales**\
  \ 表中，将 **Reseller Net Sales** 度量添加为柱形值，将 **Reseller Margin %** 度量添加为线值。\n- 21. 在\
  \ **格式** 窗格的“常规”部分中，将 X 位置设置为 448，Y 位置设置为 295，宽度设置为 832，高度设置为 232。\n- 22. 展开图例部分，并将位置更改为底部。\n\
  - 23. 展开 X 轴和 Y 轴部分，并将两者的标题切换为“关闭”，然后将 Y 轴切换为“关闭”。\n- 24. 展开数据标签部分，并将方向更改为水平。\n\
  - 25. 展开标题部分，并将标题文本更改为 Reseller Sales and Margin %，对齐方式为居中。\n- 26. 将背景切换为“关闭”。\n\
  - 27. 复制 **地图** 和 **折线和群集柱状图**，并粘贴到 **Germany** 和 **United Kingdom** 页面。\n- 28.\
  \ 切换到 **Germany** 页面，并选择 **地图** 视觉对象。\n- 29. 改用来自 **Customers** 表的 **State/Province**\
  \ 列作为位置。\n- 30. 在选中 **地图** 视觉对象的情况下，从 **可视化** 窗格中选择 **形状地图**。如果 **形状地图** 不存在，可以通过\
  \ **预览功能** 激活此视觉对象，方法是选择菜单/功能区中的 **文件**，然后选择 **选项和设置**，最后选择 **选项**。\n- 31. 在 **格式**\
  \ 窗格中，展开 **形状** 部分，并将 **地图** 更改为 Germany states。\n- 32. 保存你的工作。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_225_0.png)\n\
  \n图 4.30：形状地图视觉对象\n\n## 工作原理\n\n当单个值及其比较比趋势更重要时，选择柱状图。当轴类别标签较长时，选择条形图，因为条形图比柱状图能显示更多的标签文本。当数据的趋势或形状比单个值及其比较更重要时，使用折线图。选择散点图以展示一个维度在两个度量之间的相关性。选择专用视觉对象，如树状图和瀑布图，作为标准视觉对象的补充。\n\
  \n通常建议避免使用饼图、环形图、仪表图和树状图视觉对象，因为其他视觉对象在视觉感知和理解方面具有优势。例如，饼图和仪表图的弯曲形状比柱状图/条形图中的直线以及散点图中的点间距离更难解释。\n\
  \n瀑布图应按度量排序，以支持从组件到 **总计** 列的直观“走查”。默认的红色表示负值、绿色表示正值的颜色格式通常是合适的。可以向 **类别** 字段添加额外的列，以实现下钻维度。来自\
  \ **Dates** 表的 **Year Month** 列或来自 **Products** 表的 **Product Category** 列是不错的选择。此外，也可以向\
  \ **细分** 字段添加一列。**细分** 字段计算两个类别值之间单个维度值的方差和百分比方差。将 **Product Category** 列添加到 **细分**\
  \ 字段，可以显示国家之间差异最显著的产品类别，详细信息可在工具提示中查看。\n\n许多图表类型（如折线图）都有有用的分析选项。为了演示这些分析功能，请执行以下操作：\n\
  \n- 1. 在 **Scratch** 页面上，创建一个 **折线图**，将来自 **Dates** 表的 **Year Month** 列作为轴，将来自 **Internet\

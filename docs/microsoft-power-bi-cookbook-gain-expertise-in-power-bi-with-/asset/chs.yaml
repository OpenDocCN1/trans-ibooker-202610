  \ 视觉对象：https://bit.ly/3yg5a0n\n\n## 利用 Dataverse 和 Dynamics 365\n\nMicrosoft Power\
  \ Platform 包含 Dataverse，即以前所称的 **Common Data Service (CDS)**。Dataverse 在云中安全地存储业务数据，并允许你管理业务应用使用的数据。Dataverse\
  \ 以表的形式存储数据，包含适用于常见场景的基础表，也允许创建新的自定义表。Dynamics 365 应用（如 Dynamics 365 Sales、Dynamics\
  \ 365 Talent 和 Dynamics 365 Customer Service）将数据原生存储在 Dataverse 中；此外，还可以使用 Power\
  \ Apps 基于这些核心数据构建应用，而无需集成。最后，Dynamics 365 Business Central 和 Dynamics 365 Finance\
  \ and Operations 也与 Dataverse 进行了原生集成。\n\n本方案演示如何将 Power BI 与 Dataverse 和 Dynamics\
  \ 365 结合使用。\n\n## 准备就绪\n\n要准备本方案，请执行以下步骤：\n\n+   1. 如果尚未完成，请在数据网关中配置到 **AdventureWorksDW2019**\
  \ 数据库的连接。有关详细信息，请参阅*第 12 章“部署和分发 Power BI 内容”*。\n+   2. 打开 Web 浏览器，转到 https://admin.powerplatform.microsoft.com，并使用你的\
  \ Microsoft 365 帐户登录。这是 Power Platform 管理中心。\n+   3. 在左侧导航窗格中，单击**环境**。\n\n+   4.\
  \ 在功能区区域，单击**+ 新建**。这将在页面右侧打开**新环境**窗格。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_627_0.png)\n\
  \n图 13.49：Power Platform 管理中心\n\n+   5. 在**新环境**窗格中，输入环境的**名称**，选择**类型**（**生产**、**沙盒**或**试用**），并选择**区域**。此外，将**为此环境创建数据库**切换为**是**，然后点击窗格底部的**下一步**按钮。\n\

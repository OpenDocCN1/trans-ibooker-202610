  \ URL**。\n\n现在，你已经准备好完成此方案。\n\n## 操作步骤...\n\n要实现本方案，请执行以下步骤：\n\n+   1. 导航到 https://powerapps.com，并切换到在*准备就绪*中创建的新环境。当前环境位于右上角。\n\

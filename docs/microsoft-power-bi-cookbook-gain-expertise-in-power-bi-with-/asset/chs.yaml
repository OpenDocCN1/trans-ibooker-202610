  \ SSAS 表格、R 视觉对象或适用于 Power BI 的 ArcGIS 地图。\n\n### 另请参阅\n\n- 从 Power BI 发布到 Web：https://bit.ly/3bezKxq\n\
  \n## 启用移动体验\n\nPower BI 移动应用的设计与 Power BI 服务中的用户体验和功能集紧密对齐。这为用户提供了简单、熟悉的导航体验，并允许\
  \ BI 和 IT 团队利用现有的 Power BI 资产和知识来增强其组织中的移动体验。\n\n本食谱包含两个流程，以利用 Power BI 的移动功能。第一个流程有助于识别“速赢”机会，这些机会需要有限的\
  \ BI/IT 投资，以更好地利用基本的 Power BI 移动功能。第二个流程识别 Power BI 移动应用的一些不太常见但强大且新兴的用例。\n\n###\
  \ 准备工作\n\n要准备本食谱，请执行以下步骤：\n\n1. 通过打开 Power BI 管理门户（齿轮图标：管理门户）并选择“使用情况指标”菜单项，确定使用最频繁的仪表板和报表。\n\

  - Smart narratives tutorial: https://bit.ly/3e57xuM\n\n## 嵌入统计分析\n\n超出基本聚合的统计分析通常由数据科学家和数据科学应用程序在业务智能语义模型之外实现。然而，在可能的情况下，利用现有数据模型、Power\
  \ BI 技能以及用于其他 Power BI 报表和仪表板的特性——例如本章前面描述的 Analytics 窗格——会更高效。\n\n在此配方中，支持线性回归模型的数据点是从现有的\
  \ Power BI 数据模型创建的。然后通过 DAX 度量对其进行分析和描述，值包括斜率、Y 截距和残差的 Z 分数。最后，构建一个丰富的报表页面以可视化回归模型的强度和准确性并检测异常值。\n\
  \n## 准备工作\n\n为准备此配方，请按照以下步骤操作：\n\n- 1. 在本地打开一个 Power BI Desktop 文件并通过点击 **Home**\
  \ 选项卡 ribbon 上的 **Transform Data** 访问 **Power Query Editor**\n- 2. 创建一个名为 **AdWorksDW**\
  \ 的查询，类似于以下内容：\n```\nlet\n    Source = Sql.Database(\"localhost\\MSSQLSERVERDEV\"\
  , \"AdventureWorksDW2019\")\nin\n    Source\n```\n- 3. 禁用 **AdWorksDW** 查询的加载并将其放入\
  \ **Data Sources** 查询组\n- 4. 右键点击 **AdWorksDW** 查询并选择 **Reference**\n- 5. 重命名查询为\
  \ **Internet Sales** 并选择 **FactInternetSales** 表\n- 6. 重复步骤 4 和 5，创建指向 **DimDates**\
  \ 表的 **Dates** 查询\n- 7. 将 **Internet Sales** 查询移动到 **Facts** 查询组，并将 **Dates** 查询移动到\
  \ **Dimensions** 查询组\n- 8. 从 **Home** 选项卡的 ribbon 中选择 **Close & Apply**\n- 9. 切换到\
  \ **Model** 视图并在 **Dates** 表的 **DateKey** 列与 **Internet Sales** 表的 **OrderDateKey**\
  \ 列之间创建关系\n- 10. 在 **Dates** 表中创建两个新列，使用以下公式：\n```\nYearMonth = [CalendarYear] &\
  \ \"-\" & LEFT([EnglishMonthName],3)\nYearMonthSort = [CalendarYear]*100 + [MonthNumberOfYear]\n\
  ```\n- 11. 将 **YearMonth** 列的 **Sort by column** 设置为 **YearMonthSort** 列\n- 12.\
  \ 保存你的工作\n\n## 如何嵌入统计分析\n\n要实现此配方，请使用以下步骤：\n\n- 1. 在 **Report** 视图中，点击 **Modeling**\
  \ 选项卡 ribbon 上的 **New table** 并使用以下代码：\n```\nMktSalesRegression =\n    FILTER(\n\
  \        SUMMARIZECOLUMNS(\n```\n\n```\n```DAX\n'Dates'[YearMonth],\n'Dates'[YearMonthSort],\n\
  CALCULATETABLE('Dates',\n    'Dates'[FullDateAlternateKey] >= DATE(2011,1,1) &&\n\
  \    'Dates'[FullDateAlternateKey] <= DATE(2013,12,31)),\n\"Marketing Amount\",\n\
  \    VAR __MonthNum = MAX('Dates'[MonthNumberOfYear])\n    VAR __Value = SUM('Internet\
  \ Sales'[SalesAmount])\n    RETURN SWITCH(__MonthNum,\n        1,__Value*.8,\n \
  \       2,__Value*.8,\n        3,__Value*.8,\n        4,__Value*.8,\n        5,__Value*.8,\n\
  \        6,__Value*1,\n        7,__Value*.8,\n        8,__Value*.8,\n        9,__Value*.6,\n\
  \        10,__Value*.8,\n        11,__Value*.8,\n        12,__Value*.8),\n\"Internet\
  \ Sales\", SUM('Internet Sales'[SalesAmount])\n),\nNOT(ISBLANK([Internet Sales])\
  \ || ISBLANK([Marketing Amount]))\n```\n```\n\n- 2. 创建相关系数、斜率、y 截距和决定系数（R 平方）的度量：\n\
  \n```\n```DAX\nMktSalesCorrelNum = SUMX(MktSalesRegression,\n    (\n        ( MktSalesRegression[Marketing\
  \ Amount] -\n            AVERAGE(MktSalesRegression[Marketing Amount]) ) *\n   \
  \     ( MktSalesRegression[Internet Sales] -\n            AVERAGE(MktSalesRegression[Internet\
  \ Sales]) )\n    )\n)\n\nMktSalesCorrelDenomX = SUMX(MktSalesRegression,\n    (\
  \ MktSalesRegression[Marketing Amount] -\n        AVERAGE(MktSalesRegression[Marketing\
  \ Amount]) )^2 )\n\nMktSalesCorrelDenomY = SUMX(MktSalesRegression,\n    ( MktSalesRegression[Internet\
  \ Sales] -\n        AVERAGE(MktSalesRegression[Internet Sales]) )^2 )\n\nMkt-Sales\
  \ Correl = DIVIDE([MktSalesCorrelNum],\n    SQRT([MktSalesCorrelDenomX]*[MktSalesCorrelDenomY])\
  \ )\n```\n```\n\n## 应用高级分析和自定义视觉\n\n\n\n\n\nMkt-Sales R Squared = [Mkt-Sales Correl]^2\n\
  \nMktSalesSlope = DIVIDE([MktSalesCorrelNum],[MktSalesCorrelDenomX])\n\nMktSales\
  \ Intercept = AVERAGE(MktSalesRegression[Internet Sales]) - ( [MktSalesSlope]*AVERAGE(MktSalesRegression[Marketing\
  \ Amount]) )\n\n3. 从 Modeling 选项卡的 ribbon 中单击 New table 并使用以下代码：\nResiduals =\n\
  \    VAR Intercept = [MktSales Intercept]\n    VAR Slope = [MktSalesSlope]\nRETURN\n\
  \    ADDCOLUMNS(MktSalesRegression,\"Y Intercept\",Intercept,\"Slope\",Slope,\n\
  \    \"Predicted Internet Sales\", ([Marketing Amount]*Slope) + Intercept,\n   \
  \ \"Residual\",[Internet Sales] - (([Marketing Amount]*Slope) + Intercept))\n\n\
  4. 创建以下度量值：\nResiduals Amount = SUM(Residuals[Residual])\n\nResiduals Average =\
  \ CALCULATE(AVERAGE(Residuals[Residual]),ALL(Residuals))\n\nResiduals Sample Std\
  \ Dev = CALCULATE(STDEV.S(Residuals[Residual]),ALL(Residuals))\n\nResiduals Z Score\
  \ = DIVIDE([Residuals Amount] - [Residuals Average],[Residuals Sample Std Dev])\n\
  \nRegression Line Message = \"Regression Line: Y= \" & FORMAT([MktSalesSlope],\"\
  #,###\") & \"X\" & \"+\" & FORMAT([MktSales Intercept],\"#,###\")\n\nLast Month\
  \ Internet Sales =\n    VAR __LastMonth = MAX('Residuals'[YearMonthSort])\nRETURN\n\
  \    LOOKUPVALUE('Residuals'[Internet Sales],[YearMonthSort],__LastMonth)\n\nLast\
  \ Month Predicted Internet Sales =\n    VAR __LastMonth = MAX('Residuals'[YearMonthSort])\n\
  RETURN\n    LOOKUPVALUE('Residuals'[Predicted Internet Sales],[YearMonthSort],__LastMonth)\n\
  \n+   5. 从 **Report** 视图创建卡片视觉对象以显示 **Last Month Internet Sales**、**Last Month Predicted\
  \ Internet Sales**、**Mkt-Sales Correl**、**Mkt-Sales R Squared** 和 **Regression Line\
  \ Message** 度量值\n+   6. 创建散点图可视化，使用 **MktSalesRegression** 表中的 **Marketing Amount**\
  \ 列（求和）作为 **X Axis**，**MktSalesRegression** 表中的 **Internet Sales** 列（求和）作为 **Y Axis**，以及\
  \ **MktSalesRegression** 表中的 **YearMonth** 列作为 **Details**\n+   7. 从 **Analytics**\
  \ 窗格添加 **Trend** 线\n+   8. 创建第二个散点图可视化，使用 **Residuals** 表中的 **Predicted Internet\
  \ Sales** 列（求和）作为 **X Axis**，**Residuals** 表中的 **Residuals Z Score** 列（求和）作为 **Y\
  \ Axis**，以及 **Residuals** 表中的 **YearMonth** 列作为 **Details**\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_428_0.png)\n\
  \nFigure 9.23: Regression report page\n\n通过此报表设计，用户可通过 **Marketing Amount and Internet\
  \ Sales by YearMonth** 散点图以及 *Figure 9.23* 中显示的相关系数和 R 平方卡片的高值，立即感知关系的强度。**Predicted\
  \ Internet Sales and Residuals Z Score by YearMonth** 散点图有助于识别变化相对较大的月份。\n\n## How\
  \ it works\n\n在本示例中，我们显然人为构建了月度营销支出指标，使其与互联网销售额高度相关。如果我们使用来自总账 **FactFinance** 事实表的实际\
  \ **Sales and Marketing** 支出数字，将发现完全没有相关性。\n\n简单的单变量回归模型通常不足以准确估计 Y 值，但本配方中使用的许多概念和技术适用于更复杂的多元线性回归模型。\n\
  \n主要的相关性计算处理 **MktSalesRegression** 表中的数据。该表创建了我们希望进行相关性的两个指标之间对应的数据行。SUMMARIZECOLUMNS\
  \ 函数按月粒度对表进行分组，而 FILTER 函数删除没有互联网销售额和营销值的行（月份）。对计算至关重要的是，数据在任何一个时间序列中都不存在缺口。CALCULATETABLE\
  \ 函数将过滤后的日期表传递给 SUMMARIZECOLUMNS，以排除某些月份。**Marketing Amount** 和 **Internet Sales**\
  \ 列是我们希望找到或不找到相关性的两个度量值。请注意，要尝试不同度量值之间的相关性，只需更改 **Marketing Amount** 和 **Internet\
  \ Sales** 表达式——所有其他度量值和 DAX 计算都可以保持不变。\n\n可以在源系统中开发新的 SQL 视图以满足回归表要求，并且作为另一种选择，数据集中的\
  \ M 查询可以利用现有的总账、互联网销售和日期查询。然而，像本示例这样的小型 DAX 表（36 行）是支持自定义或高级分析和功能的好选择。\n\n相关系数被拆分为三个独立的中间度量值（**MktSalesCorrelNum**、**MktSalesCorrelDenomX**\
  \ 和 **MktSalesCorrelDenomY**），这些度量值在 **Mkt-Sales Correl** 度量值中被引用。相关性和其组成部分在模型中定义后，斜率（**MktSalesSlope**）度量值可以利用相同的分子度量值\
  \ **MktSalesCorrelNum** 以及 **MktSalesCorrelDenomX** 度量值。最后，我们可以计算回归的 y 截距，**MktSales\
  \ Intercept**。\n\n现在我们有了直线方程 *y = mx + b* 的所有组成部分，其中 *m* 是斜率，*b* 是 y 截距。此公式使我们能够在\
  \ **Residuals** 表中计算 **Predicted Internet Sales**。**Residuals** 表中的 **Predicted\
  \ Internet Sales** 列通过引用 **Marketing Amount** 列（*x*）、斜率（**MktSalesSlope**）和 y 截距（**MktSales\
  \ Intercept**）来实现直线的方程（*y = mx + b*）。最后，**Residual** 列计算为从 **Internet Sales** 列中的观测（实际）值中减去预测销售额值。\n\
  \n为每个残差数据点（一个月）计算 Z 分数，以确定预测值和观测值之间的变化（或“误差”）相对于其他数据点是否较大。为了支持可视化，一个度量值返回包含回归模型直线方程的文本字符串。此外，还创建了两个度量值以显示分析中最后一个月的实际和预测互联网销售额。\n\
  \n本配方中的两个计算表，**MktSalesRegression** 和 **Residuals**，与模型中的其他表没有任何关系。刷新两个 DAX 表的源表（查询）也会刷新计算表。\n\
  \n## There's more\n\n本配方中创建的 DAX 度量值对应于 Microsoft Excel 中的 CORREL、SLOPE 和 INTERCEPT\
  \ 函数。这些 Excel 函数的文档提供了以下公式：\n\nCORREL 函数的公式，对于样本（Pearson 相关系数）：\n\nCorrel (X, Y)\
  \ = Σ(x − x̄)(y − ȳ) / √Σ(x − x̄)²(y − ȳ)²\n\n求直线斜率的标准公式：\n\nb = Σ(x − x̄)(y − ȳ)\
  \ / Σ(x − x̄)\n\n求 y 截距的标准公式：\n\na = ȳ − b x̄\n\n相关系数范围从 -1 到 1。两个指标之间的正相关意味着一个度量值上升或下降时，另一个指标也会上升或下降。负数表示反相关，其中两个指标呈反向相关，即一个指标上升时，另一个指标下降，反之亦然。接近\
  \ 1 或 -1 的值表示两个指标具有强相关性并直接相互影响。接近 0 的值表示两个指标之间没有关系。\n\nR 平方值，或决定系数，仅仅是相关系数的平方。R\
  \ 平方值介于 0 和 1 之间，因为负数的平方为正。R 平方值为 1 表示一个指标的变动 100% 由比较指标的变动解释，而值为 0 表示两个指标之间没有关系。R\
  \ 平方值在 .85 到 1 之间被认为是“高”，意味着两个指标紧密相关，而低于 .7 则被认为是弱或影响相对较小。\n\n重要的是要考虑时间序列数据通常表现出季节性，这意味着数字由于例如季度影响而人为地高于或低于正常水平。想想零售销售和第四日历季度的假日，如感恩节和圣诞节。当数据表现出季节性时，在进行相关性分析之前，至关重要的是对指标的值进行去季节化。\n\
  \n另一个需要考虑的是领先和滞后指标。领先指标意味着一个时间序列中的值与另一个时间序列相关，但存在若干周或月份的偏移。换句话说，一个指标可能上升并对应另一个指标上升，但第二个指标反映第一个指标的变动之前存在一段时间或延迟。\n\
  \n\n\n\n\n寻找领先指标在业务中可以极具价值，因为它们提供了可预测的指标，企业可以根据预期未来行为做出决策并采取行动。要找到领先指标，相关性分析中的值必须根据适当的时间段数量相互偏移。这通常会导致在各种时间段偏移下进行相关性计算，以确定一个指标是领先于还是滞后于另一个指标。\n\

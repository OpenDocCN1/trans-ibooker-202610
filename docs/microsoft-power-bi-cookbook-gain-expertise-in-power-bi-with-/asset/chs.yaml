  \ = .5))\n```\n\n- 7. 此代码更改的结果如图 9.38 所示\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_450_0.png)\n\
  \n图 9.38：通过 ggplot2 包在 Power BI 中呈现的 R 脚本视觉对象\n\n## 工作原理\n\n如果按照“准备工作”部分安装了受支持的外部\
  \ R IDE，并在“检测到的 R IDE”R 脚本选项中选择了该 IDE，则可以单击“在外部 R IDE 中编辑脚本”（向上箭头图标）。这将启动 IDE 应用程序（如\
  \ RStudio），并从 Power BI Desktop 导出数据帧。R 脚本 IDE 的常见功能（如 IntelliSense 和变量历史记录）对于开发复杂的\
  \ R 脚本视觉对象很有帮助（甚至必不可少）。\n\n本节中两个视觉对象的要求是显示当前日历年内已在线销售的产品列表价格的分布。第一个示例使用 R 基础绘图系统中的标准\
  \ hist() 函数，第二个示例使用 R 的 ggplot2 包提供的 ggplot() 函数。\n\n通过 `par()` 函数设置浅灰色背景，`hist()`\
  \ 函数的参数定义 x 轴和 y 轴、标题的文本字符串、数据标签、字体大小以及条形的浅蓝色。`seq()` 函数用于配置 x 轴间隔（分箱），宽度或箱大小为 500\
  \ 美元，最大价格为 2,500 美元。\n\n`ggplot2` 的 `geom_histogram()` 需要连续变量，因此 **List Price**\
  \ 列被转换为 `prices` 变量中的数值数据类型。之前示例中用于 x 轴（按 500 到 2,500 分箱）的向量表达式（`seq()`）被用作 `geom_histogram()`\
  \ 和 `stat_bin()` 的 **breaks** 参数。同样，之前示例中 y 轴的表达式被重用，但作为参数传递给 `coord_cartesian()`\
  \ 函数。`qplot()` 函数（快速绘图的缩写）在 `ggplot2` 包中也可用，并且可以用更少的代码（通常只需一行）更快地开发相对复杂的可视化。\n\n\
  Power BI Desktop 中的 R 脚本编辑器会自动创建数据帧，并根据加载到 **值** 字段井中的列删除重复行。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_451_0.png)\n\
  \n图 9.39：Power BI Desktop R 脚本编辑器数据帧和重复项删除\n\n在本示例中，其目的是统计单个产品（包括那些具有相同列表价格的产品），因此有必要在数据帧中添加一个单独的列（**product\
  \ key** 列），使数据帧的每一行都是唯一的。在其他场景中，可以使用 `Table.AddIndexColumn()` M 函数来创建唯一性。\n\n在 R\
  \ 脚本视觉对象的数据帧中包含 **Internet Net Sales** 度量，可以使视觉对象通过 **Date** 维度列和报表页面上的其他维度表进行筛选。\n\
  \n默认情况下，根据此筛选上下文，没有任何销售记录的产品将不会包含在数据帧中，这符合本节的要求。如果要在此视觉对象中包含没有销售记录的产品，可以使用 **值**\
  \ 字段井中 **Product Key** 列的 **显示无数据的项目** 选项。\n\nR 脚本数据源连接器可在 **获取数据** 对话框的 **其他**\
  \ 类别中使用。在查询编辑器的 **转换** 窗口中提供了 **运行 R 脚本** 命令图标。许多使用 R 构建的自定义视觉对象已在 AppSource 中提供，并且截至\
  \ 2017 年 7 月，R 自定义视觉对象可以包含交互功能，例如选择和缩放。\n\n\n\n\n\n# 更进一步\n\nPython 还可以用来创建可视化。要了解如何实现，请执行以下操作：\n\
  \n- 1. 创建一个新页面并使用 **Filters** 面板为 **Dates** 表中的 **CalendarYear** 列添加筛选器，仅选择 **2013**\n\
  - 2. 创建一个 Python 可视化并添加 **Products** 表中的 **Product Category** 列，以及将 **Internet Net\
  \ Sales** 度量添加到 **Values** 字段井中\n- 3. 使用以下代码用于 Python 可视化，并单击 **Run script** 图标：\n\
  \n```\n```python\nimport matplotlib.pyplot as plt\ndataset.plot(kind='bar',x='Product\
  \ Category',y='Internet Net Sales')\nplt.show()\n```\n```\n\n- 4. 此代码更改导致显示在 *Figure\

  \nFigure 3.14: Data Category Selection\n\n- 8. 重复此过程，将 City 列设置为 City，将 CountryRegionName\
  \ 列设置为 Country，并将 PostalCode 列设置为 Postal code。请注意，字段列表中所有这些列旁边都会出现一个地球图标。\n- 9.\

- "# 10\n\n## 管理和监控 Power BI\n\n除了针对业务流程和实体（如销售和客户）的解决方案外，Power BI 还可以作为系统监控和管理的平台。各种系统遥测和诊断数据源，例如\
  \ Azure 服务的日志、性能监视计数器和事件，可以集成到 Power BI 数据集中，以提供对系统健康状况、活动和性能的强大可见性。尽管有多个专用监控工具可用，例如\
  \ Microsoft System Center 中的 Operations Manager，使用 Power BI 构建自定义解决方案可提供对解决方案所有层的完全灵活性和控制，同时利用相关的\
  \ Power BI 功能，包括数据驱动的警报、电子邮件通知和订阅以及 Power BI 移动。此外，随着越来越多的组织采用和部署 Power BI，现有的许可证和经验可以显著降低开发和维护这些解决方案的成本。\n\
  \n本章的食谱重点介绍了最常见和最具影响力的管理数据源，包括 Windows Performance Monitor、SQL Server Query Store、本地数据网关、MSDB\
  \ 系统数据库和扩展事件。建立在这些数据源之上的 Power BI 解决方案可主动评估使用趋势和资源瓶颈，并提供识别根本原因所需的详细分析。此外，通过 **动态管理视图\
  \ (DMVs)** 暴露的现有 Power BI 和 SSAS 数据模型的元数据，例如度量和关系定义以及资源消耗，可以集成以提供 BI 和业务团队的简化参考或文档资产。SQL\
  \ skills 的首席顾问 Erin Stellato 和 Microsoft 数据平台 MVP 为其中一些食谱做出了贡献，包括对关系数据库监控和管理数据源的设置和利用的参考。\n\
  \n在本章中，我们将介绍以下食谱：\n\n- 使用 Power BI 创建集中式 IT 监控解决方案\n- 构建监控、可视化和分析层\n- 导入和可视化动态管理视图\
  \ (DMV) 数据\n- 提高 DBA 生产率\n- 提供文档\n- 分析 SSAS 多维数据集数据库和网关\n- 分析扩展事件\n- 可视化日志文件数据\n\
  - 利用 Power BI PowerShell 模块\n\n# 技术要求\n\n- Power BI Desktop。\n- 安装了 AdventureWorksDW2019\
  \ 数据库的 SQL Server。此数据库及其安装说明可在以下位置获得：http://bit.ly/2OVqfG7。\n- 本章的文件可以从以下 GitHub\
  \ 仓库下载：https://github.com/PacktPublishing/Microsoft-Power-BI-Cookbook-Second-Edition。\n\
  \n# 使用 Power BI 创建集中式 IT 监控解决方案\n\nPower BI 强大的数据连接和转换功能非常适合系统和数据库管理员的集成需求。可以从文件目录（或多个目录）检索包含性能监视计数器统计信息的一组日志文件，进行整合，并进一步增强以支持报告。还可以将存储在专用管理员数据库中的性能和配置数据的快照等其他来源包含在计划的数据刷新过程中，并且包含现有的\
  \ BI 维度表，例如日期和时间，进一步简化整体监控解决方案。\n\n在本食谱中，包含有关 CPU、内存等统计信息的 Windows Performance Monitor\
  \ 计数器文件与存储在 SQL Server 数据库中的管理数据集成在一起，包括查询等待统计信息和实例配置值。\n\n- 4. 创建一个名为 **AdminDB:**\
  \ 的查询\n```\nlet\n    Source = Sql.Database(SQLServer, AdminDB)\nin\n    Source\n\
  ```\n- 5. 禁用对 **AdWorksDW** 和 **Admin** 查询的加载，并将两个查询都放入 **Data Sources** 查询组中。\n\
  - 6. 创建一个 **Parameters** 查询组。\n- 7. 在 **Parameters** 查询组中，创建一个名为 **CounterHistoryDays**\
  \ 的参数并分配 **7** 或 **30** 的值以限制检索的天数。\n- 8. 在 **Parameters** 查询组中，创建一个名为 **PerformanceCountersFolder**\
  \ 的参数并将值设置为性能计数器日志文件的位置。\n- 9. 在 **Other Queries** 查询组中创建一个名为 **Performance Counters**\
  \ 的查询以检索性能计数器日志文件：\n```\nlet\n    CurrentDate = DateTime.Date(DateTime.LocalNow()),\n\
  \    EarliestDate = Date.AddDays(CurrentDate,-CounterHistoryDays),\n    SourceFolder\
  \ = Folder.Files(PerformanceCountersFolder),\n    ReportFiles = Table.SelectRows(SourceFolder,\
  \ each [Extension] = \".csv\" and DateTime.Date([Date modified]) >= EarliestDate)\n\
  in\n    ReportFiles\n```\n- 10. 单击 **Content** 列上的向下双箭头以将剩余文件合并为一个查询。在 **Combine\
  \ Files** 对话框中，单击 **OK**。\n- 11. 在 **Transform File from Performance Counters**\
  \ 查询组中，编辑 **Transform Sample File** 查询：\n```\nlet\n    Source = Csv.Document(Parameter1,[Delimiter=\"\
  ,\", Columns=8, Encoding=1252, QuoteStyle=QuoteStyle.None]),\n    PromoteHeaders\
  \ = Table.PromoteHeaders(Source, [PromoteAllScalars=true]),\n    ParsedDate = Table.AddColumn(PromoteHeaders,\
  \ \"Date\", each Date.From(DateTimeZone.From([\"#(PDH-CSV 4.0) (Eastern Daylight\
  \ Time)(240)\"])), type date),\n    ParsedTime = Table.AddColumn(ParsedDate, \"\
  Time\", each Time.From(DateTimeZone.From([\"#(PDH-CSV 4.0) (Eastern Daylight Time)(240)\"\
  ])), type time),\n    RemoveColumns = Table.RemoveColumns(ParsedTime,\n{\"(PDH-CSV\
  \ 4.0) (Eastern Daylight Time)(240)}\",\nRenameColumns = Table.RenameColumns(RemoveColumns,\n\
  \    {{\"Memory\\Available MBytes\", \"AvailableMemoryMB\"},\n    {\"Buffer Manager\\\
  Page life expectancy\", \"PageLifeExpectancy\"},\n    {\"SQL Statistics\\Batch Requests/sec\"\
  , \"BatchRequestsPerSec\"},\n    {\"PhysicalDisk(_Total)\\Avg. Disk sec/Read\",\
  \ \"AvgDiskSecPerRead\"},\n    {\"PhysicalDisk(_Total)\\Avg. Disk sec/Write\", \"\
  AvgDiskSecPerWrite\"},\n    {\"Processor(_Total)\\% Processor Time\", \"ProcessorTime%\"\
  }}),\nHourText = Table.AddColumn(RenameColumns, \"TextHour\", each if Time.Hour([Time])\
  \ < 10 then \"0\" & Text.From(Time.Hour([Time])) else Text.From(Time.Hour([Time])),\
  \ type text),\nMinText = Table.AddColumn(HourText, \"TextMin\", each if Time.Minute([Time])\
  \ < 10 then \"0\" & Text.From(Time.Minute([Time])) else Text.From(Time.Minute([Time])),\
  \ type text),\nSecText = Table.AddColumn(MinText, \"TextSec\", each if Number.RoundDown(Time.Second([Time]),0)\
  \ < 10 or Number.RoundUp(Time.Second([Time]),0) < 10 then \"0\" & Text.From(Number.RoundDown(Time.Second([Time]),0))\
  \ else Text.From(Number.RoundDown(Time.Second([Time]),0)), type text),\nSecondCol\
  \ = Table.AddColumn(SecText,\"SecondOfDay\", each [TextHour] & [TextMin] & [TextSec],\
  \ type text),\nRemoveOtherColumns = Table.SelectColumns(SecondCol,\n    {\"AvailableMemoryMB\"\
  , \"PageLifeExpectancy\", \"BatchRequestsPerSec\", \"AvgDiskSecPerRead\", \"AvgDiskSecPerWrite\"\
  , \"ProcessorTime%\", \"Date\", \"Time\", \"SecondOfDay\"})\nin\nRemoveOtherColumns\n\
  ```\n- 12. 在 Performance Counters 查询上，删除自动添加的 Changed Type 查询步骤并用你自己的手动设置类型替换它：\n\
  ```\nTypeChanges = Table.TransformColumnTypes(PreviousStep,\n    {{\"AvailableMemoryMB\"\
  , Int64.Type}, {\"PageLifeExpectancy\", Int64.Type},\n    {\"BatchRequestsPerSec\"\
  , type number},\n    {\"AvgDiskSecPerRead\", type number},\n    {\"AvgDiskSecPerWrite\"\
  , type number}, {\"ProcessorTime%\", type number},\n    {\"Date\", type date}, {\"\
  Time\", type time}, {\"SecondOfDay\", type text}})\n```\n\n\n\n\n\n+   13. 在 **Other\
  \ Queries** 组中，创建一个名为 **Calculations** 的空白查询。\n+   14. 从 **Home** 选项卡的功能区中选择 **Close\
  \ & Apply**。\n+   15. 使用以下 DAX 代码创建 **Dates** 表：\n+   16. 创建 **Time** 表：\n+   17.\
  \ 将 **Dates** 表中 **Date** 列的 **Data type** 改为 **Date**。\n+   18. 将 **Time** 表中 **SecondOfDay**\
  \ 列的 **Data type** 改为 **Text**。\n+   19. 在 **Model** 视图中，在 **Dates** 表和 **Performance\
  \ Counters** 表之间创建 **Date** 列的关系。\n+   20. 在 **Time** 表和 **Performance Counters**\
  \ 表之间创建 **SecondOfDay** 列的关系。\n+   21. 保存你的工作。\n\n```\nDates =\n    VAR __Today\
  \ = TODAY()\nRETURN\n    CALENDAR(DATE(YEAR(__Today)-1,1,1),DATE(YEAR(__Today)+1,12,31))\n\
  ```\n\n```\nTime =\n    VAR __hrs = SELECTCOLUMNS(GENERATESERIES(1,23,1),\"Hour\"\
  ,[Value])\n    VAR __mins = SELECTCOLUMNS(GENERATESERIES(0,59,1),\"Minutes\",[Value])\n\
  \    VAR __secs = SELECTCOLUMNS(GENERATESERIES(0,59,1),\"Seconds\",[Value])\n  \
  \  VAR __hoursMinutes = GENERATEALL(__hrs, __mins)\n    VAR __hoursMinutesSeconds\
  \ = GENERATEALL(__hoursMinutes,__secs)\n    VAR __final = ADDCOLUMNS(ADDCOLUMNS(__hoursMinutesSeconds,\n\
  \        \"Time\", TIMEVALUE(FORMAT([Hour],\"00\") & \":\" &\n            FORMAT([Minutes],\"\
  00\") & \":\" & FORMAT([Seconds],\"00\")),\n        \"SecondOfDay\", FORMAT([Hour],\"\
  00\") & FORMAT([Minutes],\"00\") &\n            FORMAT([Seconds],\"00\"))\nRETURN\
  \ __final\n```\n\n## How it works...\n\n计划的数据收集器集将为每个新的文件输出自动生成一个子目录。Power BI M\
  \ 查询引用根目录（或父目录），并且此查询的子目录中的所有受支持文件格式都可供检索。根据计数器的数量、其时间间隔（即 15 秒）以及收集器集的计划和持续时间，可能会累积大量文件。\n\
  \n如果源 DateTime 列已四舍五入到整秒，例如 SQL Server datetime2(0)，则可通过 DateTime.Time M 函数创建的 Time\
  \ 列用于与 Time 维度表的关系。\n\n建议在用于导入到 Power BI 的 SQL 视图中将 SQL Server datetime 数据类型列转换为\
  \ datetime2(0)，以避免在 Power BI 查询中实现额外的四舍五入逻辑。在性能监视器计数器日志文件的情况下，DateTime 列未四舍五入到整秒，因此在\
  \ M 查询中应用四舍五入逻辑以创建六字符文本列。连接的 SecondOfDay 列用于与 Time 维度表的关系。\n\n在此示例中，Time 维度表有 86,400\
  \ 行，即一天中每秒一行。此粒度下的细节有助于故障排除和更深入的分析，但仅有 1,440 行的分钟粒度时间维度可能已足够。无论是按秒还是按分钟，Time 维度表对于在同一报表中筛选多个事实表以及提供有用的分组（例如上午\
  \ 7 点至 9 点的时间段）尤其推荐。\n\n## There's more...\n\n可以向模型添加额外的性能数据；SQL 性能指标，包括等待统计信息和实例配置数据存储。可以在\
  \ Admin 数据库中创建表，例如 WaitStats 和 ConfigData，其列分别对应 sys.dm_os_wait_stats 和 sys.configurations\
  \ 系统视图。这些表本质上包含性能或配置数据的快照，就像性能计数器代表在所选间隔的点-in-time 值一样。维护这些数据收集过程使 Power BI 等工具能够生成洞察并驱动适当的响应。请参考以下来源获取更多信息：\n\
  \n- ► 等待统计数据存储的设置和等待统计信息的捕获由 Erin Stellato 在以下博客文章中描述：https://sqlperformance.com/2015/10/sql-performance/proactive-sql-server-health-checks-5\n\
  - ► 实例配置数据存储的设置和这些值的捕获也由 Erin Stellato 在此博客文章中描述：https://sqlperformance.com/2015/02/system-configuration/proactive-sql-server-health-checks-3\n\
  \n应在 admin 数据库中为 Wait Stats 和 Config Data 表创建 SQL 视图。每个视图都应应用报表友好的列别名和 WHERE 子句，仅导入所需的时间范围。sys.configurations\
  \ 视图和要在 Admin 数据库中创建的表中的 value 和 value_in_use 列以 sql_variant 数据类型存储。用于将此数据导入 Power\
  \ BI 的视图将这些列转换为 Integer 数据类型，并将 datetime CaptureDate 列转换为 datetime2(0)，以将此列四舍五入到秒。\n\
  \n将 WaitStats 和 ConfigData 的两个视图导入 Power BI 模型并根据需要构建适当的关系。还可以集成其他输入，例如 SQL Server\
  \ Agent 和备份日志文件，以帮助管理员评估可用资源、工作负载和系统配置变化的原因和影响。\n\n## See also\n\n- - Combine binaries\
  \ in Power BI Desktop: http://bit.ly/2oL2nM4\n\n## Constructing a monitoring, visualization,\
  \ and analysis layer\n\n监控和 administration 工具，例如 Performance Monitor、SQL Server\
  \ Activity Monitor、Query Store 和 Extended Events，都包含用于查看和分析其各自特定数据集的图形界面。然而，相对于专用\
  \ BI 工具（如 Power BI）提供的数据探索和可视化功能，这些功能是有限的。此外，根据本章的第一个配方，系统和数据库管理员需要对不同的数据源进行集成视图，并具有通用且灵活的可视化表面。在监控源数据之上定义逻辑的能力，以及\
  \ Power BI 内容的“随时随地”可用性及其数据警报和高级分析功能，进一步增强了集成监控数据集的价值。\n\n在本配方中，本章第一个配方中创建的监控数据集被用于开发报告内容，以解决主要利益相关者的优先事项，例如“今天的性能如何？”和“是否有任何配置值发生变化？”SQL\
  \ Server Query Store 特定的报表可视化包含在 *There's more...* 部分。\n\n## Getting ready\n\n为准备本配方，请执行以下步骤：\n\
  \n- 1. 从利益相关者和主题专家（SMEs）处获取有关性能基线和阈值值的指导。例如，“可用内存”指标应与最近 7 天、30 天或更长时间进行比较吗？等待统计信息度量或\
  \ CPU 时间是否与良好（绿色）、满意（黄色）和问题（红色）值相关联？\n- 2. 完成本章的第一个配方，*Creating a centralized IT\
  \ monitoring solution with Power BI*。\n\n## How to construct a monitoring visualization\
  \ and analysis layer\n\n要实施本配方，请执行以下步骤：\n\n- 1. 在 **Calculations** 表中，为性能计数器创建简单的\
  \ DAX 度量（AVERAGE、MIN 和 MAX），并创建日期智能度量以支持将性能监控计数器与先前时间段或基线进行比较：\n  \n  ```DAX\n \
  \ Available Memory MB (Today) = CALCULATE([Available Memory (MB)],\n      FILTER(ALL('Dates'),'Dates'[Date]\
  \ = [Today]))\n  \n  Batch Requests per Sec (Yesterday) = CALCULATE([Batch Requests\
  \ Per Sec],\n      FILTER(ALL('Dates'),'Dates'[Date] = [Yesterday]))\n  \n  Min\
  \ Available Memory MB (Today) = CALCULATE([Min Available Memory (MB)],\n      FILTER(ALL('Dates'),'Dates'[Date]\
  \ = [Today]),ALL('Time'))\n  ```\n\n- 2. 在 **Time** 表中创建 **Hour Time** 列以启用切片器选择：\n\
  \  \n  ```DAX\n  Hour Time = TIMEVALUE(FORMAT('Time'[Hour], \"00\") & \":00\")\n\
  \  ```\n\n- 3. 创建一个基于性能监视器计数器的报表页面，以解决主要可见性需求，例如“今天的性能如何？”和“我们距离资源阈值有多近？”\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_463_0.png)\n\
  \nFigure 10.1: Performance Monitoring Report page leveraging Windows Performance\
  \ Monitor counters\n\n\n\n\n\n## 工作原理...\n\n两个仪表盘视觉对象和KPI视觉对象用于显示相对于预定义阈值或基线具有最高优先级的计数器。例如，磁盘每秒读取时间（Disk\
  \ Seconds Per Read）以绿色突出显示，因为其值低于目标值 .003；磁盘每秒写入时间（Disk Seconds Per Write）以红色突出显示，因为其值高于目标值\
  \ .004。这四个视觉对象都遵循左下角的小时筛选器控件（一个自定义的Chiclet切片器），并且使用Time维度表中的 Minute of Day Time\
  \ 数据类型列作为KPI视觉对象的趋势轴。\n\n一组“今日最高值和最低值”卡片视觉对象忽略时间筛选器选择（例如切片器中的9:00 P.M.），但应用当前日期筛选器。在此示例中，CPU（处理器百分比）、每秒批处理请求数和可用内存与前一天的值在折线图中进行对比。七天和三十天的平均值度量通常用作性能基线。\n\
  \n## 更多内容...\n\n如果按照之前的配方实现，还可以为等待统计和配置值创建报表视觉对象。要了解其工作原理，请执行以下步骤：\n\n- 1. 创建DAX度量值以识别数据库实例配置更改：\n\
  \n```\nConfig Value = IF(AND(HASONEVALUE('Configuration Values'[ConfigurationID]),\
  \ HASONEVALUE('Dates'[Date])), MAX('Configuration Values'[Configuration Value]),BLANK())\n\
  \nConfig Value (Today) = CALCULATE([Config Value], FILTER(ALL('Dates'),'Dates'[Date]\
  \ = [Today]))\n\nConfig Value (Yesterday) = CALCULATE([Config Value], FILTER(ALL('Dates'),\
  \ 'Dates'[Date] = [Yesterday]))\n\nConfig Change (Today) = IF([Config Value (Today)]\
  \ <> [Config Value (Yesterday)], \"Config Change\", \"No Change\")\n\nConfig Changes\
  \ = IF([Config Value] = [Prior Day Config],0,1)\n```\n\n性能监控报表：实例配置\n\n上次配置捕获日期：7/15/2017\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_465_0.png)\n\n图10.2：实例配置报表页面：当前日期及过去30天的更改历史\n\
  \n- 2. “当前日期配置更改”表视觉对象在 Config Change (Today) 度量值上使用视觉级筛选器，以便仅显示（当天的）已更改配置。“前30天配置更改”表视觉对象使用两个视觉级筛选器。一个筛选器应用于Dates维度表中的\
  \ Date 列，并使用相对日期筛选功能来检索过去30天但不包括当天；另一个筛选条件应用于 Config Changes 度量值，筛选值为1。\n\n- 3.\
  \ 为Wait Statistics表创建类似的DAX度量值，例如当前日期的平均等待秒数。\n\n- 4. 在新页面上，将当前日期的等待统计捕获数据的平均值与先前日期进行比较：\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_465_1.png)\n\n图10.3：等待统计报表示例：KPI、瀑布图和散点图视觉对象\n\
  \n> “等待统计信息可能是开始排查SQL Server性能问题的最佳单一途径。SQL Server知道执行为何停滞（换句话说，线程为何必须等待），因此利用这些信息来识别瓶颈和进一步调查的方向，可以显著减少诊断工作负载性能下降原因所需的时间。”\n\
  > \n> ——Paul Randal，SQLskills CEO，微软数据平台MVP\n\n在此有限的等待统计报表示例中，页面级别应用了相对日期筛选，仅包含过去30天；因此，两个KPI视觉对象的背景中显示了30天趋势。视觉级别还向瀑布图和散点图应用了相对日期筛选，分别仅包含最近2天和当天。瀑布图的“分解字段”井用于自动识别从昨天到当前日期的等待秒数（等待类型）变化的最大驱动因素。\n\
  \n高级等待统计报表可用作分析的快速起点，以识别系统中的瓶颈。此外，在具备成熟且可预测的基线数据后，该报表可用于排查性能下降问题。例如，PAGEIOLATCH_EX等待的突然飙升可能表明存在缺失索引问题、相关数据库架构或代码更改问题。\n\
  \n## 另请参阅\n\n- SQL Server等待类型库：https://www.sqlskills.com/help/waits/。\n\n## 导入和可视化动态管理视图（DMV）数据\n\
  \nAnalysis Services数据模型和Power BI实例包含许多动态管理视图（DMV），这些视图可用于检索与各种数据库对象相关的架构元数据和资源使用情况。导入数据模型的查询性能直接受所消耗内存量的影响。因此，在性能调优工作中，了解内存消耗以及影响内存消耗的因素（如压缩和基数）至关重要。Power\
  \ BI集成和可视化工具可以增强DMV提供的系统信息的价值，从而为Power BI和SSAS数据集的所有者提供一个直观、可持续的报表层，以支持这些资产。\n\n\
  ### 准备工作\n\n要准备此配方，请执行以下步骤：\n\n- 1. 打开包含要分析的数据集的Power BI Desktop文件。在数据检索期间，该文件必须保持打开状态。\n\
  - 2. 从“外部工具”中打开DAX Studio。\n- 3. 从DAX Studio状态栏的右下角检索与正在运行的Power BI Desktop文件关联的服务器名称和端口；例如\
  \ localhost:56514。\n- 4. 在DAX Studio中，在左上角的“元数据”下，右键单击数据库ID，然后选择“复制数据库ID”。\n- 5.\
  \ 打开一个新的Power BI Desktop文件，并点击“开始”选项卡功能区中的“转换数据”，以打开Power Query编辑器窗口。\n- 6. 创建两个参数\
  \ Server 和 Database，并将从DAX Studio检索到的值作为当前值应用：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_467_0.png)\n\
  \n图10.4：具有本地Power BI模型值的查询参数\n\n### 如何导入和可视化DMV数据\n\n要实现此配方，请执行以下步骤：\n\n- 1. 创建一个\
  \ Segments 查询：\n\n```\nlet Source = AnalysisServices.Database\n(Server, Database,[Query=\"\
  Select * From $SYSTEM.DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS\"]),\n    Segments\
  \ = Table.AddColumn(Source, \"Structure Type\", each\n        if Text.Range([TABLE_ID],1,1)\
  \ <> \"$\" then \"Data\"\n        else if Text.Start([TABLE_ID],2) = \"H$\" then\
  \ \"Column Hierarchy\"\n        else if Text.Start([TABLE_ID],2) = \"U$\" then \"\
  User Hierarchy\"\n        else if Text.Start([TABLE_ID],2) = \"R$\" then \"Relationship\"\
  \n        else \"unknown\", type text),\n    RenameTable = Table.RenameColumns(Segments,{{\"\
  DIMENSION_NAME\", \"Table\"}}),\n    KeyColumn = Table.AddColumn(RenameTable, \"\
  ColumnKey\", each [Table] & \"-\" & [COLUMN_ID], type text)\nin KeyColumn\n```\n\
  \n- 2. 创建一个 **Columns** 查询：\n\n```\nlet Source = AnalysisServices.Database\n   \
  \ (Server, Database,[Query=\"Select * From $SYSTEM.DISCOVER_STORAGE_TABLE_COLUMNS\"\
  ]),\n        BasicData = Table.SelectRows(Source, each ([COLUMN_TYPE] = \"BASIC_DATA\"\
  )),\n        RenameTable = Table.RenameColumns(BasicData,{{\"DIMENSION_NAME\", \"\
  Table\"},{\"ATTRIBUTE_NAME\", \"Column\"}}),\n        KeyColumn = Table.AddColumn(RenameTable,\
  \ \"ColumnKey\", each [Table] & \"_\" & [COLUMN_ID], type text),\n        DateRetrieved\
  \ = Table.AddColumn(KeyColumn, \"Date Retrieved\", each DateTime.Date(DateTime.LocalNow()),\
  \ type date)\n    in DateRetrieved\n```\n\n- 3. 创建一个名为 **Calculations** 的空查询。\n\n\
  - 4. 点击 **“开始”** 选项卡功能区中的 **“关闭并应用”**。\n\n- 5. 在 **“模型”** 视图中，在 **Segments** 和 **Columns**\
  \ 表的 **ColumnKey** 列之间创建关系。\n\n- 6. 创建以下DAX度量值：\n\n```\nBytesPerMB = 1048576\n\n\
  Segment Size (MB) = DIVIDE(SUM(Segments[USED_SIZE]),[BytesPerMB])\n\nDictionary\
  \ Size (MB) = DIVIDE(SUM('Columns'[DICTIONARY_SIZE]),[BytesPerMB])\n\nData Size\
  \ (MB) =\n    CALCULATE([Segment Size (MB)],Segments[Structure Type] = \"Data\"\
  )\n\nColumn Hierarchies Size (MB) =\n    CALCULATE([Segment Size (MB)],Segments[Structure\
  \ Type] = \"Column Hierarchy\")\n\nUser Hierarchy Size (MB) =\n    CALCULATE([Segment\
  \ Size (MB)],Segments[Structure Type] = \"User Hierarchy\")\n\nRelationship Size\
  \ (MB) =\n    CALCULATE([Segment Size (MB)],Segments[Structure Type] = \"Relationship\"\
  )\n\nTotal Column Size (MB) = [Data Size (MB)] + [Dictionary Size (MB)]\n\nTotal\
  \ Size (MB) = [Column Hierarchies Size (MB)] + [Relationship Size (MB)]\n```\n\n\
  \n\n\n(MB)] +\n[用户层次结构大小 (MB)] + [字典大小 (MB)] + [数据大小 (MB)]\n\n```\nLast Refresh\
  \ Message = VAR RefreshDate = MAX('Columns'[Date Retrieved])\nRETURN \"Last Refreshed:\
  \ \" & RefreshDate\n```\n\n+   7. 基于检索到的并已建模的 DMV 数据创建 Power BI 报表页，如图 10.5 所示：\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_469_0.png)\n\n图 10.5：Power BI 数据集的摘要内存报告\n\
  \n## 工作原理...\n\n对于 Segments 查询，使用 Server 和 Database 参数，以及针对 DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS\
  \ DMV 的 SQL 语句，从正在运行的 Power BI Desktop 文件（其中包含 Analysis Services 实例）中提取并访问内存使用数据。添加条件列\
  \ Structure Type 以标识每一行所表示的内存结构，并创建串联列 ColumnKey 以支持与 Columns 表之间的关系。\n\n对于 Columns\
  \ 查询，会根据 Column_Type 列对 DISCOVER_STORAGE_TABLE_COLUMNS DMV 进行筛选，并创建串联列 ColumnKey\
  \ 用于与 Segments 表建立关系。此外，还添加了一个动态的 Date Retrieved 列，以支持报表层。\n\n两个源 DMV 的内存列均以字节为单位。由于\
  \ MB 的位数更少，因此更直观、更易于展示；因此，使用 BytesPerMB 度量值（硬编码为 1,048,576）对 USER_SIZE 和 DICTIONARY_SIZE\
  \ 列的总和进行 DIVIDE 运算。在 Segments 查询中创建的 Structure Type 列用于支持总体内存使用的不同组成部分，并为汇总级报表创建了两个总计度量值。\n\
  \n使用卡片视觉对象显示总体内存使用情况；两个带有“前 N 项”视觉级筛选器的表视觉对象提供更多详细信息。在此示例中，**Reseller Sales XL**\
  \ 表是模型中目前最大的表，具体而言，该表的 **CarrierTrackingNumber**、**SalesOrderNumber** 和 **CustomerPONumber**\
  \ 列消耗的内存最多。单击 **Top 5 Tables** 视觉对象中的表名会交叉筛选 **Top 5 Columns** 视觉对象。\n\n可以添加更多 DMV\
  \ 和逻辑，以构建一个更强大的模板报表，供各 Power BI 项目使用。请注意，当所分析的 PBIX 文件被关闭并重新打开时，需要更新 **Server**\
  \ 和 **Database** 参数。\n\n## 更多内容...\n\n除了每列的压缩数据内存结构外，导入的数据模型还会在内部创建字典和列层次结构（**H$**）以支持查询。通过\
  \ columns DMV 检索到的字典结构存储列的唯一值，因此对于高基数列，其占用空间更大。另外两种内存结构包括用户定义的层次结构（**U$**）和表关系（**R$**）。\n\
  \n在本技巧中，分配给列层次结构（**H$**）的内存在 **Total Column Size** 度量值中被排除，但被包含在 **Total Size**\
  \ 度量值中。这样做的目的是将分析重点放在内存的较大组成部分上，而这些部分可能会受到数据模型修订的直接影响。同样，用于关系和用户定义层次结构的内存相对于模型列的数据和字典大小而言很小。\n\
  \n导入数据模型的基本性能调优主要侧重于尽量减少高基数列和关系，以减少扫描的内存。更高级的调优（通常用于 SSAS 模型）涉及表分区、段大小以及优化引擎在压缩期间使用的排序顺序。对于\
  \ Power BI 数据集，只有排序顺序可用。\n\nVertipaq Analyzer 利用 DMV 收集数据集的信息，现已集成到 DAX Studio 的\
  \ **Advanced** 菜单以及 Tabular Editor 3 中。与自行编写针对 DMV 的查询相比，使用 Vertipaq Analyzer 是一种更快速、更轻松的分析数据模型内存大小、基数和其他方面的方法。\n\
  \n## 另请参阅\n\n- Kasper de Jonge 发表了一篇关于使用 Power BI 构建 SSAS 内存报表的博客：http://bit.ly/2tDumgk.\n\
  - SQL BI 的 Vertipaq Analyzer Excel 文件：http://bit.ly/2sTTuS0.\n- Analysis Services\
  \ 中的**动态管理视图 (DMVs)**：https://bit.ly/33etDoc.\n\nVertipaq Analyzer 用于 Tabular Editor\
  \ 2 的脚本：https://bit.ly/2YA97zv\n\n## 提高 DBA 生产力\n\nSQL Server 查询存储（Query Store）是一项监控功能，适用于\
  \ SQL Server 2016 及更高版本的所有版本——它极大地简化和加快了查询调优和故障排除。查询存储数据库提供关于查询执行、查询计划和等待统计的聚合指标，使性能趋势和使用模式可见。\n\
  \n> “查询存储是执行计划的绝佳飞行数据记录器。它将帮助你排查参数嗅探问题、连接设置问题、计划回归、糟糕的统计信息以及更多问题。”\n\n— Brent Ozar，作者、Microsoft\
  \ 认证大师（SQL Server）\n\n查询存储包含图表和用户控件的图形界面，其架构非常适合自定义 T-SQL 查询，例如过去一小时内运行时间最长的 10\
  \ 个查询。虽然这些功能很棒并且足以应对某些场景，但管理员通常不得不在 T-SQL 的灵活性与查询存储提供的图形控件之间进行权衡。在本技巧中，将简单的 T-SQL\
  \ 语句从 Power BI 传递给 SQL Server 查询存储，以识别和分析最近的性能问题以及特定存储过程的性能。\n\n## 准备工作\n\n若要准备本技巧，请执行以下步骤：\n\
  \n- 1. 在最新版本的 SQL Server Management Studio (SSMS) 中启用查询存储，可以通过对象资源管理器界面中的“数据库属性”对话框（右键单击数据库，选择“属性”），也可以通过以下\
  \ T-SQL 语句：\n\n```\nALTER DATABASE AdventureWorksDW2019 SET QUERY_STORE = ON;\n\
  ```\n\n- 2. 根据你的要求配置查询存储设置，例如统计信息收集间隔、保留期和最大大小 (MB)。\n\n在此示例中，单个查询的性能将被聚合或汇总到 5\
  \ 分钟的时间范围内。较小的收集时间间隔可提供更多详细信息，但也会消耗更多的存储和收集资源。若要获得不对查询进行分组时的最大详细信息，可以计划一个扩展事件 (Extended\
  \ Events) 会话。有关更多详细信息，请参阅本章后面的“分析扩展事件”技巧。\n\n## 如何提高 DBA 生产力\n\n若要实施本技巧，请执行以下步骤：\n\
  \n- 1. 生成并测试用于检索所需查询存储统计信息的 T-SQL 语句：\n\n```\nSELECT\n    [rs].[avg_duration], [rs].[avg_logical_io_reads],\
  \ [qst].[query_text_id],\n    [qsq].[query_id],\n    [qst].[query_sql_text], CASE\
  \ WHEN [qsq].[object_id] = 0\n        THEN N'Ad-hoc' ELSE OBJECT_NAME([qsq].[object_id])\n\
  \        END AS [ObjectName],\n    [qsp].[plan_id], GETUTCDATE() AS CurrentUTCtime,\n\
  \    [rs].[last_execution_time],\n        CAST((DATEADD(MINUTE,\n            -(DATEDIFF(MINUTE,\
  \ GETDATE(), GETUTCDATE())),\n            [rs].[last_execution_time])) AS datetime2(0))\n\
  \        AS LocalLastExecutionTime\nFROM\n    [sys].[query_store_query] [qsq]\n\
  \    JOIN [sys].[query_store_query_text] [qst] ON\n        [qsq].[query_text_id]\
  \ = [qst].[query_text_id]\n    JOIN [sys].[query_store_plan] [qsp] ON\n        [qsq].[query_id]\
  \ = [qsp].[query_id]\n    JOIN [sys].[query_store_runtime_stats] [rs] ON\n     \
  \   [qsp].[plan_id] = [rs].[plan_id]\nWHERE [rs].[last_execution_time] > DATEADD(hour,\
  \ -8, GETUTCDATE())\n```\n\n- 2. 创建另一个 T-SQL 语句，其中包含类似的与性能相关的列，并筛选到特定的存储过程，该存储过程同时检索收集间隔时间：\n\
  \n```\nSELECT * FROM\n[sys].[query_store_query] [qsq]\nJOIN [sys].[query_store_query_text]\
  \ [qst] ON\n    [qsq].[query_text_id] = [qst].[query_text_id]\nJOIN [sys].[query_store_plan]\
  \ [qsp] ON\n    [qsq].[query_id] = [qsp].[query_id]\nJOIN [sys].[query_store_runtime_stats]\
  \ [rs] ON\n    [qsp].[plan_id] = [rs].[plan_id]\nJOIN [sys].[query_store_runtime_stats_interval]\
  \ [rsi] ON\n    [rs].[runtime_stats_interval_id] = [rsi].[runtime_stats_interval_id]\n\
  WHERE [qsq].[object_id] = OBJECT_ID(N'Sales.usp_GetFullProductInfo')\n```\n\n\n\n\
  \n+   3. 在 SQL Server 中为两个 **查询存储** 查询创建一个视图和一个参数化存储过程，不要使用 WHERE 子句过滤器——此条件将由 Power\
  \ BI 参数驱动。\n+   4. 设计 SQL Server 存储过程，使其包含一个 WHERE 子句，其中带有一个将从 Power BI 传入的参数，例如以下内容：\n\
  ```\nCREATE PROCEDURE [Website].[QueryStoreProc]\n@QSProcedure nvarchar(55)\nAS\
  \ ......\nWHERE [qsql].[object_id] = OBJECT_ID(@QSProcedure)\n```\n+   5. 在本地打开\
  \ Power BI Desktop 文件，并为“查询存储”数据库添加服务器和数据库参数。\n+   6. 使用引用这两个参数的 Sql.Database 函数创建一个新查询\
  \ **AdWorksDW**。\n+   7. 创建一个参数 **HoursInPast**，数据类型为十进制数，以及一个 **QueryStoreProcedure**\
  \ 文本参数。\n+   8. 创建一个新的 M 查询 **Query Store DurationIO**，该查询检索所有查询的 I/O 和持续时间统计信息，并使用\
  \ **HoursInPast** 参数：\n```\nlet\n    Source = AdWorksDW,\n    SQLView = Source{[Schema=\"\
  Website\", Item=\"QueryStoreDurationIO\"]}[Data],\n    ParamFilter = Table.SelectRows(SQLView,\
  \ each\n        [LocalLastExecutionTime] >=\n            (DateTime.LocalNow() -\
  \ #duration(0,HoursInPast,0,0))),\n    ExecutionDate = Table.AddColumn(ParamFilter,\n\
  \        \"Last Execution Date\",\n        each DateTime.Date([LocalLastExecutionTime]),\
  \ type date),\n    ExecutionTime = Table.AddColumn(ExecutionDate,\n        \"Time\"\
  , each DateTime.Time([LocalLastExecutionTime]), type time)\nin ExecutionTime\n```\n\
  +   9. 创建一个新的 M 查询 **Query Store Procedure**：\n```\nlet\n    Source = AdWorksDW,\n\
  \    Procedure = Value.NativeQuery(Source,\n        \"EXECUTE Website.QueryStoreProc\
  \ @QSProcedure = \"\n        & \"'\" & QueryStoreProcedure & \"'\"),\n    InsertedDate\
  \ = Table.AddColumn(Procedure, \"Date\",\n        each DateTime.Date([end_time]),\
  \ type date),\n    InsertedTime = Table.AddColumn(InsertedDate, \"Time\",\n    \
  \    each DateTime.Time([end_time]), type time)\nin InsertedTime\n```\n+   10. 创建一个名为\
  \ **Calculations** 的空白查询。\n+   11. 在 **开始** 选项卡的功能区中单击 **关闭并应用**。\n+   12. 使用以下\
  \ DAX 代码创建 **Dates** 表：\n```DAX\nDates\n    VAR __Today = TODAY()\n    RETURN\n\
  \    CALENDAR(DATE(YEAR(__Today)-1,1,1),DATE(YEAR(__Today)+1,12,31))\n```\n+   13.\
  \ 创建 **Time** 表：\n```DAX\nTime =\n    VAR __hrs = SELECTCOLUMNS(GENERATESERIES(1,23,1),\
  \ \"Hour\", [Value])\n    VAR __mins = SELECTCOLUMNS(GENERATESERIES(0,59,1), \"\
  Minutes\", [Value])\n    VAR __secs = SELECTCOLUMNS(GENERATESERIES(0,59,1), \"Seconds\"\
  , [Value])\n    VAR __hoursMinutes = GENERATEALL(__hrs, __mins)\n    VAR __hoursMinutesSeconds\
  \ = GENERATEALL(__hoursMinutes,__secs)\n    VAR __final = ADDCOLUMNS(ADDCOLUMNS(__hoursMinutesSeconds,\n\
  \        \"Time\", TIMEVALUE(FORMAT([Hour], \"00\") & \":\" &\n            FORMAT([Minutes],\
  \ \"00\") & \":\" & FORMAT([Seconds],\"00\"))),\n        \"SecondOfDay\", FORMAT([Hour],\"\
  00\") & FORMAT([Minutes],\"00\")\n            & FORMAT([Seconds],\"00\"))\n    RETURN\
  \ __final\n```\n+   14. 将 **Dates** 表中 **Date** 列的 **数据类型** 更改为 **Date**。\n+   15.\
  \ 将 **Time** 表中 **SecondOfDay** 列的 **数据类型** 更改为 **Text**。\n+   16. 在 **模型** 视图中，在\
  \ **Query Store DurationIO** 和 **Query Store Procedure** 表与 **Dates** 和 **Time**\
  \ 表之间创建关系。\n+   17. 向 **Calculations** 表添加 DAX 度量值：\n```DAX\nAverage CPU Time (QS\
  \ Proc) = AVERAGE('Query Store Procedure'[avg_cpu_time])\n\nAverage Duration (QS\
  \ Proc) = AVERAGE('Query Store Procedure'[avg_duration])\n\nAverage Logical IO Reads\
  \ (QS Proc) = AVERAGE('Query Store Procedure'[avg_logical_io_reads])\n```\n+   18.\
  \ 利用这些度量值和关系，为两个“查询存储”表创建专用报表页：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_475_0.png)\n\
  \n图 10.6：查询存储示例报表页 – 存储过程\n\n**查询存储存储过程** 报表页按 **上下文设置 ID** 和各个 **查询 ID** 细分性能度量值。组合图显示各时间间隔内\
  \ CPU 和持续时间的性能趋势；与存储过程关联的 SQL 语句通过表视觉对象显示。此外，还使用自定义 Chiclet 切片器为用户提供按小时时间段的简单筛选控制。\n\
  \n## 工作原理...\n\nSQL Server 查询存储收集与数据库的查询和查询计划相关的编译和运行时信息。这些持久化数据通过三个独立的数据存储提供给分析：\n\
  \n- 包含查询执行计划信息的计划存储\n- 包含执行统计信息的运行时统计存储\n- 包含查询等待统计信息的等待统计存储\n\n在 SQL Server 2016\
  \ 或更高版本中，可以通过以下系统视图查询这三个数据存储：sys.query_store_plan、sys.query_store_runtime_stats\
  \ 和 sys.query_store_wait_stats。\n\n第一个 T-SQL 查询检索过去 8 小时内收集的查询存储时间间隔的平均持续时间和逻辑 I/O\
  \ 读取次数，以及 SQL 语句本身和 **查询 ID**。可以在 Power BI 中设置要检索的小时数参数，因此为检索此数据而创建的 SQL 视图不需要 WHERE\
  \ 子句。Power BI 将通过查询折叠动态构建包含此参数的 WHERE 子句筛选器的 T-SQL 语句。\n\n## 另请参阅\n\n-   使用查询存储监控性能：`http://bit.ly/2s9Cx5r`\n\
  \n## 提供文档\n\n随着数据模型不断增长和变化以支持新的业务流程和逻辑，访问最新文档变得至关重要。基本元数据的可见性，例如模型的关系、表的列以及度量值中内置的筛选逻辑，可以显著帮助业务团队利用\
  \ Power BI 数据集。此外，对于可能刚接触特定模型或不熟悉模型某个组件的商业智能和 IT 专业人员而言，直接访问技术元数据（如数据源参数、SQL 和 M\
  \ 查询以及已配置的安全角色）也会带来极大帮助。\n\n在本节中，将访问与 Power BI 数据集架构相关的若干 **动态管理视图 (DMV)**，并将其集成到\
  \ Power BI 报表中。然后，创建一个带参数的模板，以便在多个 Power BI 数据集之间生成标准文档报表。\n\n## 准备工作\n\n要准备本节内容，请执行以下步骤：\n\
  \n+   1. 打开包含要分析的数据集的 Power BI Desktop 文件。在数据检索期间，此文件必须保持打开状态。\n+   2. 从 **外部工具**\
  \ 打开 DAX Studio。\n+   3. 从 DAX Studio 状态栏右下角检索与正在运行的 Power BI Desktop 文件关联的服务器名称和端口，例如\
  \ **localhost:56514**。\n+   4. 在 DAX Studio 中，靠近左上角的 **元数据** 下，右键单击数据库 ID，然后选择 **复制数据库\
  \ ID**。\n+   5. 打开一个新的 Power BI Desktop 文件，在 **开始** 选项卡的功能区中单击 **转换数据**，以打开 **Power\
  \ Query 编辑器** 窗口。\n+   6. 创建两个参数 **Server** 和 **Database**，并将从 DAX Studio 检索到的值作为当前值应用。\n\
  \n## 如何提供文档\n\n要实现本节内容，请执行以下步骤：\n\n+   1. 创建一个名为 **TablesDMV** 的新空白 M 查询，该查询通过 **Server**\
  \ 和 **Database** 参数检索 TMSCHEMA_TABLES DMV：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_478_0.png)\n\
  \n图 10.8：正在运行的 Power BI Desktop 文件的表元数据\n\n+   2. 复制 **TablesDMV** 查询，以同时检索以下五个架构\
  \ DMV：\n   \n   - SYSTEM.TMSCHEMA_COLUMNS\n   - SYSTEM.TMSCHEMA_MEASURES\n   - SYSTEM.TMSCHEMA_ROLES\n\
  \   - SYSTEM.TMSCHEMA_TABLE_PERMISSIONS\n   - SYSTEM.TMSCHEMA_RELATIONSHIPS:\n+\
  \   3. 根据其来源命名查询，并将这些查询及其参数组织到各自的文件夹中：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_478_1.png)\n\
  \n图 10.9：用于支持模型文档的参数和 DMV 查询\n\n+   4. 创建名为 **Documentation** 的第三个查询组，以及一个名为 **Columns**\
  \ 的新空白查询：\n```\n```m\nlet\n    Tables = TablesDMV, Columns = ColumnsDMV,\n    Join\
  \ = Table.NestedJoin(Columns,{\"TableID\"},Tables,{\"ID\"},\n```\n\n\n\n\n“TableColumns”，JoinKind.LeftOuter），\n\
  TableExpand = Table.ExpandTableColumn（Join，“TableColumns”， {“Name”}，{“Table”}），\n\
  DataType = Table.AddColumn（TableExpand，“Data Type”，每个\n    如果 [ExplicitDataType]\
  \ = 2 则 “Text” 否则\n    如果 [ExplicitDataType] = 6 则 “Whole Number” 否则\n    如果 [ExplicitDataType]\
  \ = 8 则 “Decimal Number” 否则\n    如果 [ExplicitDataType] = 9 则 “Date” 否则\n    如果 [ExplicitDataType]\
  \ = 10 则 “Fixed Decimal Number” 否则 “Other”，\n    类型文本），\nColumnType = Table.AddColumn（DataType，“Column\
  \ Type”，每个\n    如果 [Type] = 1 则 “Standard” 否则\n    如果 [Type] = 2 则 “Calculated”\
  \ 否则 “Other”，类型文本），\nFilter = Table.SelectRows（ColumnType，每个\n    不是 Text.StartsWith（[ExplicitName]，“RowNumber”）\n\
  \    且不是 Text.StartsWith（[Table]，“LocalDate”）\n    且不是 Text.StartsWith（[Table]，“DateTableTemplate”）），\n\
  Rename = Table.RenameColumns（Filter，\n    {{“ExplicitName”，“Column”}，{“DataCategory”，“Data\
  \ Category”}，\n    {“IsHidden”，“Is Hidden”}，{“FormatString”，“Column Format”}}）\n\
  在 Rename 中\n\n5. 创建一个名为 Relationships 的新空白查询，并识别每个关系的表和列：\n\n```\nlet\n    Relationships\
  \ = RelationshipsDMV,\n    Tables = TablesDMV, Columns = ColumnsDMV,\n    FromTableJoin\
  \ = Table.NestedJoin（Relationships，\n        {“FromTableID”}，Tables，{“ID”}，“FromTableCols”，JoinKind.Inner），\n\
  \    FromTable = Table.ExpandTableColumn（FromTableJoin，\n        “FromTableCols”，{“Name”}，{“From\
  \ Table”}），\n    ToTableJoin = Table.NestedJoin（FromTable，\n        {“ToTableID”}，Tables，{“ID”}，“ToTableCols”，JoinKind.Inner），\n\
  \    ToTable = Table.ExpandTableColumn（ToTableJoin，“ToTableCols”，\n        {“Name”}，{“To\
  \ Table”}），\n    FilterDateTbls = Table.SelectRows（ToTable，\n        每个不是 Text.StartsWith（[To\
  \ Table]，“LocalDateTable”）），\n    FromColumnJoin = Table.NestedJoin（FilterDateTbls，\n\
  \        {“FromColumnID”}，Columns，{“ID”}，“FromColumnCols”，JoinKind.Inner），\n   \
  \ FromColumn = Table.ExpandTableColumn（FromColumnJoin，“FromColumnCols”，\n      \
  \  {“ExplicitName”}，{“From Column”}），\n```\n\n## 管理和监控 Power BI\n\n```\nToColumnJoin\
  \ = Table.NestedJoin（FromColumn，\n    {“ToColumnID”}，Columns，{“ID”}，“ToColumnCols”，JoinKind.Inner），\n\
  ToColumn = Table.ExpandTableColumn（ToColumnJoin，“ToColumnCols”，\n    {“ExplicitName”}，{“To\
  \ Column”}），\nCrossFiltering = Table.AddColumn（ToColumn，“Cross Filtering”，\n   \
  \ 每个如果 [CrossFilteringBehavior] = 1 则 “Single Direction”\n        否则 “Bidirectional”，类型文本），\n\
  Rename = Table.RenameColumns（CrossFiltering，{{“ID”，“Relationship ID”}}）\n在 Rename\
  \ 中\n```\n\n- 6. 创建一个名为 **Metrics** 的简单查询，基于 **MeasuresDMV** 查询，通过连接到 **TablesDMV**\
  \ 查询来添加表名。\n- 7. 添加一个名为 **Security Roles** 的查询，将 **RolesDMV** 查询与 **TablePermissionsDMV**\
  \ 查询和 **TablesDMV** 查询连接，使得安全角色名称、筛选条件和筛选条件所在的表都包含在查询中。\n- 8. 在 **Home** 选项卡的功能区中单击\
  \ **Close & Apply**。\n- 9. 在 **Report** 视图中，创建以下四个报表页面：\n  - Columns\n  - Relationships\n\
  \  - Measures\n  - Security\n- 10. 使用表视觉对象在每个页面上公开每个集成 M 查询中最重要的列：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_480_0.png)\n\
  \n图 10.10：Relationships 元数据报表页面\n\n## 工作原理...\n\n当作为数据集（而不是实时连接的报表）使用时，打开的 Power\
  \ BI Desktop 文件包含一个 SQL Server Analysis Services（SSAS）实例。因此，Power BI Desktop 文件中包含的所有数据模型对象（包括\
  \ DMV）都可以作为 SSAS 数据源进行访问。例如，SQL Server Profiler、SQL Server Management Studio 和 Microsoft\
  \ Excel 都可以引用相同的端口和目录名称来建立与数据源的连接。此外，本食谱中的相同方法也适用于 DirectQuery 模式下的 Power BI Desktop\
  \ 模型：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_482_0.png)\n\n图 10.13：Windows\
  \ 任务管理器：与打开的 PBIX 数据集关联的 SQL Server Analysis Services 进程\n\nColumns 查询连接了 Columns\
  \ 和 Tables DMV 查询，并创建了两个新列来标识数据类型和任何计算列。此外，还应用了筛选器来移除与 Power BI 为日期列创建的内部日期表相关的元数据，并重命名了若干列以支持文档报表。\n\
  \nRelationships DMV 包含模型中定义的每个关系两侧的表和列 ID 键。因此，使用四个单独的连接表达式来检索 From Table 和 From\
  \ Column 以及 To Table 和 To Column。此外，添加了一个列来标识任何双向交叉筛选关系，并应用筛选器来移除内部日期表。\n\n## 更多内容...\n\
  \n对于 SSAS 表格文档，可以使用额外的 DMV，例如 TMSCHEMA_KPIS 和 TMSCHEMA_PERSPECTIVES，以及有关列和度量的显示文件夹、模型作者为各种对象输入的描述以及分区的更多详细信息。目前特定于\
  \ SSAS 的元数据（例如透视和 KPI）未来也可能被 Power BI 数据集使用。\n\n## 另请参阅\n\n- 四种查找 Power BI 本地端口号的方法：https://bit.ly/3uiV01d\n\
  - Analysis Services 中的动态管理视图（DMV）：https://bit.ly/33etDoc\n\n## 分析 SSAS 表格数据库和网关\n\
  \nMicrosoft 本地数据网关使特定云服务（包括 Power BI、Azure Analysis Services、Power Apps 和 Power\
  \ Automate）能够安全地连接到本地数据源。在 Power BI 的上下文中，这些连接既支持存储在 Power BI 中的导入数据集的计划刷新，也支持 DirectQuery\
  \ 和 Live Connection 数据集，在这些数据集中，只有报表查询及其结果在 Power BI 和本地源之间交换。由于网关的可用性和性能对于任何需要本地数据的\
  \ Power BI 和其他受支持的云服务部署都至关重要，因此建议定期监控网关服务及其主机服务器。\n\n在本食谱中，特定于本地数据网关和 SQL Server\
  \ Analysis Services 的性能监视器计数器被集成到单个 Power BI 数据集中。此源数据通过 M 查询动态检索和增强，并创建示例报表可视化以支持监控和分析。\n\
  \n## 准备工作\n\n要准备此食谱，请执行以下步骤：\n\n- 1. 在初始部署或规划阶段，查看有关 SSAS 表格和本地数据网关的可用文档、提示和最佳实践，包括推荐的硬件和网络配置。\n\
  \n  SSAS 表格服务器应具有其压缩内存数据库 2.5 倍的 RAM，并且应打开出站端口 443 以在默认 HTTPS 模式下运行本地数据网关（如果使用 TCP\
  \ 模式，则为端口 9350-9353）。尽管硬件充足，但数据模型、M 查询和 DAX 度量的设计和复杂性会显著影响资源使用和性能。有关更多详细信息，请参阅第\
  \ 11 章“增强和优化现有 Power BI 解决方案”。\n\n- 2. 确定一个安全的网络位置目录来存储性能计数器文件。此路径可以使用通用网络驱动器和其他监控日志文件的父文件夹。\n\
  \n3. 使用 Windows 性能监视器设计和计划一个新的数据收集器集，其中包含以下性能监视器计数器：\n\n- \\MSOLAP:Memory\\Memory\
  \ Limit Hard KB\n- \\MSOLAP:Memory\\Memory Limit High KB\n- \\MSOLAP:Memory\\Memory\
  \ Limit Low KB\n- \\MSOLAP:Memory\\Memory Limit Vertipaq KB\n- \\MSOLAP:Memory\\\
  Memory Usage KB\n\n性能监视器默认使用 .blg 日志文件，但 Power BI 只能合并文本、CSV 和 Excel 格式的文件，因此请将日志格式设置为逗号分隔。Windows\
  \ 性能监视器有完善的文档，并且大多数管理员都很熟悉。通过 PowerShell 进行最佳实践和自动化超出了本食谱的范围。\n\n## 如何分析 SSAS 表格模型和网关\n\
  \n要实现此食谱，请执行以下步骤：\n\n- 1. 打开一个新的 Power BI Desktop 文件，用于同时收集 SSAS 表格和本地数据网关计数器。\n\
  - 2. 为 Server、Database 和要检索的历史天数（CounterHistoryDays）创建数据源参数。\n- 3. 定义一个查询 AdWorksDW，用于公开数据库对象（表和视图）。\n\
  - 4. 创建一个名为 SSAS Memory 的新查询，选择 SSAS 表格性能计数器的父文件夹位置，并按照本章前面“使用 Power BI 创建集中式 IT\
  \ 监控解决方案”食谱中描述的导入性能监视器计数器文件的相同步骤操作。\n- 5. 在 Home 选项卡的功能区中单击 Close & Apply。\n- 6.\
  \ 使用以下 DAX 代码创建 Dates 表：\n- 7. 创建 Time 表：\n\n```\nDates =\n    VAR __Today = TODAY()\n\
  RETURN\n    CALENDAR(DATE(YEAR(__Today)-1,1,1),DATE(YEAR(__Today)+1,12,31))\n```\n\
  \n```\nTime =\n    VAR __hrs = SELECTCOLUMNS(GENERATESERIES(1,23,1),\"Hour\",[Value])\n\
  ```\n\n\n```\nVAR __mins = SELECTCOLUMNS(GENERATESERIES(0,59,1), \"Minutes\", [Value])\n\
  VAR __secs = SELECTCOLUMNS(GENERATESERIES(0,59,1), \"Seconds\", [Value])\nVAR __hoursMinutes\
  \ = GENERATEALL(__hrs, __mins)\nVAR __hoursMinutesSeconds = GENERATEALL(__hoursMinutes,__secs)\n\
  VAR __final = ADDCOLUMNS(ADDCOLUMNS(__hoursMinutesSeconds,\n    \"Time\", TIMEVALUE(FORMAT([Hour],\"\
  00\") & \":\" &\n        FORMAT([Minutes],\"00\") & \":\" & FORMAT([Seconds],\"\
  00\")),\n    \"SecondOfDay\", FORMAT([Hour],\"00\") & FORMAT([Minutes],\"00\")\n\
  \        & FORMAT([Seconds],\"00\")))\nRETURN __final\n```\n\n- 8. 将 **Dates** 表中的\
  \ **Date** 列的**数据类型**更改为 **Date**。\n- 9. 将 **Time** 表中的 **SecondOfDay** 列的**数据类型**更改为\
  \ **Text**。\n- 10. 在**模型**视图中，在 **Dates** 表的 **Date** 列与 **SSAS Memory** 表之间创建关系。\n\
  - 11. 在 **Time** 表的 **SecondOfDay** 列与 **SSAS Memory** 表之间创建关系。\n- 12. 创建 DAX 度量值以支持报表和分析，如下所示：\n\
  \n```\nKB to GB Conversion = 1048576\n\nAvg Memory Limit Hard (GB) =\n    DIVIDE(AVERAGE('SSAS\
  \ Memory'[Memory Limit Hard KB]),[KB to GB Conversion])\n\nAvg Memory Usage GB (Today)\
  \ =\n    CALCULATE([Avg Memory Usage (GB)],\n        FILTER(ALL('Date'),'Date'[Date]\
  \ = [Current Date]))\n\nMax Memory Usage GB (Today) =\n    CALCULATE([Max Memory\
  \ Usage (GB)],\n        FILTER(ALL('Date'),'Date'[Date] = [Current Date]))\n\nMax\
  \ Memory GB (Today, All Time) =\n    CALCULATE([Max Memory Usage GB (Today)],ALL('Time'))\n\
  ```\n\n- 13. 利用合并后的计数器文件、模型关系和度量值创建 SSAS 表格内存报表：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_486_0.png)\n\
  \n图 10.14：SQL Server Analysis Services 服务器属性 – 内存属性\n\n### 工作原理\n\nSSAS 表格模式在处理操作期间，除了用于现有数据的内存外，还需要内存来加载新数据。此外，有时会创建临时内存结构来处理某些查询。这三个组成部分构成了\
  \ 2.5 倍 RAM 的建议（2 倍用于当前数据和新数据，0.5 倍用于临时结构）。\n\n当 SSAS 实例所需的内存超过特定内存限制或阈值时，根据服务器可用\
  \ RAM 量以及分析服务器属性中定义的内存属性，SSAS 会采取各种操作，从清除低优先级内存缓存（LowMemoryLimit）到强制终止用户会话（HardMemoryLimit）。有关\
  \ SSAS 内存属性文档的参考，请参见“另请参阅”部分。\n\nDAX 度量值将内存计数器值从 KB 转换为 GB，并便于在不同筛选上下文中比较当天与前一天。例如，Avg\
  \ Memory Usage GB (Today) 度量值筛选到当前日期，但会遵循 Time 维度表上用户或报表筛选器的选择。而 Max Memory GB (Today,\
  \ All Time) 度量值将同时忽略 Dates 和 Time 筛选选择，始终显示当前日期的最高内存使用值。\n\n内存使用量的显著峰值可能表明 DAX 度量值不够优化，或报表查询效率低下，需要大型临时内存结构。BI\
  \ 团队需要确保内存使用量不超过计数器识别的内存限制，以避免性能下降。增加 SSAS 内存限制属性设置，或仅为 SSAS 服务器增加总 RAM，是避免内存不足的两种选择。\n\
  \n### 更多内容...\n\n根据数据集的大小以及其 M 查询是否可以作为 SQL 语句折叠到数据源，计划刷新导入到 Power BI 的数据集可能在刷新时需要大量资源。例如，如果使用在源\
  \ Oracle 数据库中没有等效表达式的 M 函数，则网关中的 M 引擎将用于执行筛选、排序和聚合等逻辑。\n\n然而，DirectQuery 和 SSAS\
  \ 实时连接的资源消耗较低，因为只有查询和查询结果数据通过网关传输。尽管如此，重要的是要考虑以下事实：这些连接根据并发用户数、用户对已发布报表的使用或交互、可视化的类型和数量，以及是否配置了**行级安全性（RLS）**角色，会产生高频率的查询。\n\
  \n还可以为 Power BI 网关创建性能报表。要了解具体做法，请执行以下步骤：\n\n- 1. 创建并计划一个新的性能监视器数据收集器集，其中包含本地数据网关计数器：\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_487_0.png)\n\n图 10.15：本地数据网关性能计数器\n\n\
  - 2. 在包含 SSAS 计数器的同一个 Power BI Desktop 文件中，对网关计数器文件的父文件夹创建额外的查询，并应用相同的 M 查询转换来筛选导入的文件、调整数据类型、重命名列，以及添加\
  \ **Date** 和 **Time** 列，以支持与 **Dates** 和 **Time** 维度表的关系。\n- 3. 针对不同的网关计数器列构建基本聚合度量值。\n\
  - 4. 按照与 **SSAS Memory** DAX 度量值相同的表达式模式，构建额外的 DAX 度量值，以应用或移除来自 **Dates** 和 **Time**\
  \ 表的筛选上下文。\n- 5. 为网关性能计数器设计一个专用的网关报表页面：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_488_0.png)\n\
  \n图 10.16：网关性能报表\n\n在此示例中，该组织使用 SSAS 2014 表格服务器作为 Power BI 报表和仪表板内容的主要数据源。因此，使用基于\
  \ ADOMD 网关计数器的度量值来展示此工作负载的量（底部图表）。顶部图表使用了 **每秒执行的查询总数** 性能计数器，以及折线图上方的平均和最大卡片视觉对象。虽然不太常见，该组织还使用此网关来支持某些\
  \ Power BI 数据集的导入刷新（Mashup 计数器）和 DirectQuery 数据集的刷新（ADO.NET 计数器）。\n\n将卡片、仪表和标准 KPI\
  \ 视觉对象固定为仪表板磁贴后，可以触发数据警报和电子邮件通知。在本方案的上下文中，超过 VertiPaq 和其他内存限制的内存使用量可能触发数据警报。同样，大量查询失败或网关计数器报告的意外查询类型活动也可能触发数据警报。例如，如果某个网关专门用于导入（Mashup）工作负载，则计数器不应报告\
  \ ADO.NET（DirectQuery）或 OLEDB 连接的查询活动。\n\n应注意，本地数据网关支持通过管理应用程序的**诊断**选项卡进行日志记录。可以通过打开**附加日志记录**选项来启用详细日志记录，但此选项仅应在故障排除时使用，不应永久启用，因为这会显著增加日志文件的数量和大小。网关日志可以在同一个**诊断**选项卡上导出。\n\
  \n### 另请参阅\n\n- Power BI 数据网关部署指南：http://bit.ly/2t8hk9i\n- SQL Server Analysis Services\
  \ 内存属性：http://bit.ly/2vuY1I2\n- 监视和优化本地数据网关性能：https://bit.ly/3nffIJQ\n\n## 分析扩展事件\n\
  \n扩展事件是一个高度可配置且轻量级的性能监视系统，可用于 SQL Server 关系数据库引擎和 Analysis Services。特定会话可以使用大量事件库，这些事件可以被保存、计划，然后进行分析，以支持性能调优、故障排除和常规监视。然而，与其他监视工具（如\
  \ Windows 性能监视器和 SQL Server 查询存储）类似，扩展事件的图形界面缺乏 Power BI 等报表工具所具备的丰富分析能力和灵活性。\n\n\
  在本方案中，将包含查询执行统计信息的扩展事件会话输出提取到专用的 Power BI 事件分析报表文件中。来自该文件的 140 万行事件数据在导入过程中得到增强，并开发了报表可视化，以突出最有意义的趋势和度量值，并支持进一步的自助分析。\n\
  \n### 准备就绪\n\n要准备此方案，请执行以下步骤：\n\n- 1. 确定与主要监视和故障排除用例关联的事件。\n\n\n\n\n\n+   2. 为这些用例创建单独的扩展事件会话，并使用筛选器排除无关或冗余的数据\n\
  +   3. 确定会话的数据存储目标，例如事件文件，以及该文件的位置\n+   4. 可选地，配置诸如事件保留模式和最大内存大小等设置，和/或可选地配置 SQL\
  \ Agent 作业以启动和停止事件会话\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_490_0.png)\n\n\
  图 10.17：具有两个事件和一个筛选器的扩展事件会话\n\n# 如何分析扩展事件\n\n要实现此配方，请执行以下步骤：\n\n+   1. 获取对扩展事件目标\
  \ XEL 目标文件的访问权限并从 SQL Server Management Studio (SSMS) 打开它，或在 SSMS 的另一个实例中直接从 Windows\
  \ 资源管理器打开它。\n+   2. 在 SSMS 中打开 XEL 文件后，单击工具栏上的扩展事件选项卡并选择底部的导出到。\n+   3. 选择 CSV 文件选项，输入描述会话的文件名，并选择扩展事件以及可能的其他性能和行政日志文件共用的网络路径：\n\
  +   4. 打开已包含日期和时间表的 Power BI Desktop 文件，或使用本章前面所述的《使用 Power BI 创建集中式 IT 监控解决方案》配方中描述的相同流程创建这些表\n\
  +   5. 单击“开始”选项卡功能区上的“转换数据”以打开 Power Query 编辑器\n+   6. 为事件会话文件的文件夹路径创建参数，并为会话文件名创建参数\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_490_1.png)\n\n图 10.18：扩展事件会话目标 XEL 文件及其导出为\
  \ CSV 文件\n\n+   7. 打开一个空白查询，将两个参数连接成完整的路径。命名此查询为 **XEventsSession**：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_491_0.png)\n\
  \n图 10.19：查询编辑器视图，其中包含 Data Sources 参数和 XEventsSession 查询\n\n+   8. 创建一个使用文本/CSV\
  \ 数据连接器的查询，并将文件路径替换为 **XEventsSession** 查询\n\n+   9. 将顶部行提升为列标题并通过 `Table.TransformColumnTypes`\
  \ 函数转换数据类型\n\n+   10. 基于源文件的 **Timestamp** 列添加一个 **Date** 列：\n\n```\n```powerquery\n\
  let\n    Source = Csv.Document(File.Contents(XEventsSession),\n        [Delimiter=\"\
  ,\", Columns=31, Encoding=65001, QuoteStyle=QuoteStyle.None]),\n    PromotedHeaders\
  \ = Table.PromoteHeaders(Source,\n        [PromoteAllScalars=true]),\n    ChangedTypes\
  \ = Table.TransformColumnTypes(PromotedHeaders,\n        {{\"timestamp\", type datetime},\
  \ {\"duration\", Int64.Type}}),\n    DateColumn = Table.AddColumn(RenameColumns,\
  \ \"Timestamp Date\",\n        each DateTime.Date([timestamp]), type date)\nin\n\
  \    DateColumn\n```\n```\n\n+   11. 添加一个 **Time** 列和一个 **SecondOfDay** 列以支持与 **Time**\
  \ 维度表的关联\n\n请参阅本章前面所述的《使用 Power BI 创建集中式 IT 监控解决方案》配方，了解 **SecondOfDay** 列的逻辑和语法。与该示例中的性能监视器计数器数据一样，扩展事件会话的时间戳不是按秒粒度，因此仅通过\
  \ `DateTime.Time` M 函数添加时间列不足以支持与 **Time** 维度表的模型关系\n\n+   12. 将此查询命名为 **Execution\
  \ Stats**；禁用 **XEventsSession** 查询的加载\n\n+   13. 创建一个名为 **Calculations** 的空白查询\n\
  +   14. 单击“开始”选项卡功能区上的“关闭并应用”\n+   15. 从 **Execution Stats** 到 **Dates** 和 **Time**\
  \ 表创建多对一、单向关系\n+   16. 开发并格式化简单的 DAX 度量以支持扩展事件事实列的常见聚合，例如查询持续时间、CPU 时间以及逻辑读取和写入的平均值、最小值和最大值：\n\
  +   \n+      **Average CPU Time = AVERAGE('Execution Stats'[cpu_time])**\n+   \n\
  +      **Max Duration = MAX('Execution Stats'[duration])**\n+   \n+      **Minimum\
  \ Logical Reads = MIN('Execution Stats'[logical_reads])**\n+   \n+   17. 创建报表以可视化数据，如\
  \ *图 10.20* 所示：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_492_0.png)\n\n在此示例中，3\
  \ 个折线图突出了在 30 分钟扩展事件会话期间发生的逻辑读取、CPU 时间和查询持续时间的峰值。散点图按持续时间和 CPU 时间绘制单个 query_hash\
  \ 值，并使用工具提示显示所代表的单个 SQL 语句。还使用带有自动换行的表格视觉对象来显示与用户选择关联的 SQL 语句。请参阅 *How it works...*\
  \ 部分，了解有关示例报表视觉对象的更多详细信息。\n\n# 如何工作...\n\n按设计，扩展事件会话不能写入 SQL Server 中的表。捕获和分析事件会话数据的其他选项可用，例如\
  \ **histogram** 和 **pair matching** 目标。数据也可以通过 **Watch Live Data** 实时查看；CSV 和表导出选项将此数据公开给\
  \ Power BI 等工具。\n\n请注意，如果事件文件已导出到 SQL Server 中的表，则 Power BI 数据集可以配置为 DirectQuery\
  \ 模式。避免通过 DirectQuery 将数据导入 Power BI 可能是有用的，甚至是必要的设计选择，如果在同一个 Power BI 数据集中需要大型和/或多个事件会话文件。第一配方中描述的专用\
  \ **Admin** 数据库可以存储扩展事件数据，并且必要的 **Dates** 和 **Time** 表可以导入到同一服务器和数据库中，从而允许 DirectQuery\
  \ 模式。\n\n# 还有更多...\n\nSQL Server Profiler 在 SQL Server 2016 中受支持，但现在已是关系数据库引擎的已弃用功能；扩展事件是其长期替代品。Profiler\
  \ 对于 Analysis Services 并不是已弃用功能，尽管 SSAS 2016 中图形界面到扩展事件是一个新功能，并且有几个新的 SSAS 跟踪事件仅通过扩展事件可用。无论是关系还是分析数据库引擎，扩展事件都比\
  \ SQL Server Profiler 更高效、更灵活，从而允许以更少的生产工作负载影响收集更细致的事件数据。与新 SQL Server 功能关联的事件仅限于扩展事件。\n\
  \n诸如阻塞和死锁会话之类的其他标准事件会话可以集成到 Power BI 数据集中，类似于本章前面所述的合并数据集和可视化层。随着解决方案的成熟，可以在数据集中嵌入事件的自定义分组和/或数值列的区间，以进一步简化分析。\n\
  \n在 Azure 中，可以使用 Azure Log Analytics 监控在 Azure 中运行的虚拟机和其他资源活动。可以编写 Kusto 查询从此数据中提取日志事件。然后，这些\
  \ Kusto 查询可以使用 **Export** 菜单导出到 **Power Query (M)**。然后可以将这些 **Power Query (M)**\
  \ 查询粘贴到 Power BI 中的空白查询中以提取相同数据并包含在模型中。\n\n# 另请参阅\n\n+   - Quickstart: Extended\
  \ Events in SQL Server: https://bit.ly/2Ss8pRN\n+   - XEvents overview—SQL Server:\
  \ https://bit.ly/2QJmfPj\n+   - Log Analytics tutorial - Azure Monitor: https://bit.ly/3hn3NGn\n\
  \n# 可视化日志文件数据\n\n包含 SQL Server Agent 作业历史记录的日志文件以及存储在 Office 365 审核日志和 Power BI\
  \ 活动日志中的 Power BI 使用活动也可以集成到本章前面所述的 Power BI 监控解决方案中。例如，SQL Agent 作业数据可以揭示重要趋势，例如用于加载数据仓库的夜间作业的性能以及这些作业中各个步骤的持续时间和可靠性。同样，基于用户在\
  \ Power BI 服务中的活动（如删除仪表板）的详细报告和可选警报，使 BI 和 IT 管理员能够更好地管理和治理 Power BI 部署。\n\n在此配方中，对\
  \ Power BI 审核日志的结构应用了转换，以将以 JSON 格式存储的审核数据转换为并调整为本地时间报告。此外，还使用高级 T-SQL 查询访问 SQL\
  \ Server Agent 系统表中的作业历史记录数据，并为在 Power BI 中可视化准备此数据。虽然此配方涵盖 Office 365 审核日志，但也可以使用\
  \ Power BI 活动日志获得类似信息。请参阅此配方的“另请参阅”部分，了解有关 Power BI 活动日志的更多信息。\n\n# 准备就绪\n\n为准备此配方，请执行以下步骤：\n\
  \n+   1. 在 Power BI 管理门户中，选择租户设置并启用审核日志记录：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_494_0.png)\n\
  \n图 10.21：Power BI 审核日志记录已启用\n\n+   2. 确保您是 Office 365 全局管理员，或另有权限启用访问 Office 365\
  \ 审核日志\n+   3. 以管理员身份运行 PowerShell 会话\n+   4. 设置执行策略：\n\n```\nSet-ExecutionPolicy\
  \ RemoteSigned\n```\n\n+   5. 运行以下命令以安装 Exchange Online Management 模块：\n\n```\n\
  Install-Module ExchangeOnlineManagement\n```\n\n\n\n\n\n## 管理和监控 Power BI\n\n2.\
  \ 创建一个名为 **PBIAuditLog** 的空白查询，该查询基于参数返回完整的文件路径；禁用加载：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_496_0.png)\n\
  \n图 10.22：查询编辑器中 PBIAuditLog 文件路径查询和其他参数\n\n3. 创建一个名为 **O365PBIAuditLog** 的新查询：\n\
  \n```powerquery\nlet\n    Source = Csv.Document(File.Contents(PBIAuditLog),\n  \
  \      [Delimiter=\",\", Columns=13, Encoding=65001,\n        QuoteStyle=QuoteStyle.Csv]),\n\
  \    RemoveTopRows = Table.Skip(Source,1),\n    PromoteHeaders = Table.PromoteHeaders(RemoveTopRows,\n\
  \        [PromoteAllScalars=true]),\n    ApplyDateType = Table.TransformColumnTypes(PromoteHeaders,\n\
  \        {{\"CreationDate\", type datetime}}),\n    AddCreationDateColumn = Table.AddColumn(ApplyDateType,\n\
  \        \"CreationDateOnly\", each DateTime.Date([CreationDate]), type date),\n\
  \    AddLocalTime = Table.AddColumn(AddCreationDateColumn, \"LocalCreationDate\"\
  ,\n        each [CreationDate] + #duration(0,USEasternDSTOffset,0,0)),\n    AddLocalCreationDateColumn\
  \ = Table.AddColumn(AddLocalTime,\n        \"LocalCreationDateOnly\", each DateTime.Date([LocalCreationDate]),\
  \ type date),\n    ParseJSON = Table.TransformColumns(AddLocalCreationDateColumn,\n\
  \        {{\"AuditData\", Json.Document}})\nin\n    ParseJSON\n```\n\n4. 添加步骤以展开\
  \ **Audit** 列并为展开的列设置适当的数据类型。\n\n5. 创建或重用 **Server** 和 **Database** 参数以创建一个名为 **SQLAgentHistory**\
  \ 的查询来检索代理数据：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_496_1.png)\n\n图 10.23：在“AdminProd”查询中公开的\
  \ SQL Server Agent 历史记录视图\n\n6. 从 **Home** 选项卡的 ribbon 中单击 **Close & Apply**\n\n\
  7. 使用以下 DAX 代码创建 **Dates** 表：\n\n```\nDates =\n    VAR __Today = TODAY()\n    RETURN\n\
  \        CALENDAR(DATE(YEAR(__Today)-1,1,1),DATE(YEAR(__Today)+1,12,31))\n```\n\n\
  8. 创建 **Time** 表：\n\n```\nTime =\n    VAR __hrs = SELECTCOLUMNS(GENERATESERIES(1,23,1),\
  \ \"Hour\", [Value])\n    VAR __mins = SELECTCOLUMNS(GENERATESERIES(0,59,1), \"\
  Minutes\", [Value])\n    VAR __secs = SELECTCOLUMNS(GENERATESERIES(0,59,1), \"Seconds\"\
  , [Value])\n    VAR __hoursMinutes = GENERATEALL(__hrs, __mins)\n    VAR __hoursMinutesSeconds\
  \ = GENERATEALL(__hoursMinutes, __secs)\n    VAR __final = ADDCOLUMNS(ADDCOLUMNS(__hoursMinutesSeconds,\n\
  \        \"Time\", TIMEVALUE(FORMAT([Hour],\"00\") & \":\" &\n            FORMAT([Minutes],\"\
  00\") & \":\" & FORMAT([Seconds],\"00\"))),\n        \"SecondOfDay\", FORMAT([Hour],\"\
  00\") & FORMAT([Minutes],\"00\") &\n            FORMAT([Seconds],\"00\"))\n    RETURN\
  \ __final\n```\n\n9. 将 **Dates** 表中 **Date** 列的 **Data type** 更改为 **Date**\n\n10.\
  \ 将 **Time** 表中 **SecondOfDay** 列的 **Data type** 更改为 **Text**\n\n11. 在 **Model**\
  \ 视图中，在 **Dates** 和 **Time** 表与 **O365PBIAuditLog** 和 **SQLAgentHistory** 表之间创建关系\n\
  \n12. 创建 DAX 度量值和报表可视化以按步骤和随时间推移的持续时间分解代理作业\n\n13. 创建报表页面以可视化数据：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_497_0.png)\n\
  \n图 10.24：SQL Server Agent 历史记录可视化——按运行日期、作业和步骤的平均持续时间\n\n### How it works...\n\n\
  用于 PowerShell 的 Search-UnifiedAuditLog cmdlet 用于从 Office 365 审计日志中访问 Power BI 数据。可以定义完整\
  \ CSV 文件路径以及开始和结束日期的变量，评估并将其作为参数传递给 Search-UnifiedAuditLog cmdlet。有关更多信息，请参阅本食谱的“另请参阅”部分。\n\
  \nmsdb 数据库的 dbo 架构中提供了 20 多个 SQL Server Agent 系统表。在本食谱“准备就绪”部分创建的视图中，run_date 和\
  \ run_time 列以整数形式存储在 SQL Server 中，因此分别转换为日期和时间数据类型。run_duration 列以 HHMMSS 格式以整数存储并转换为分钟。run_status\
  \ 列被替换为 Execution Status 列以显示用户友好的值，例如 succeeded，并且同样从 enabled 源列创建 Job Status 列以显示\
  \ disabled 与 enabled 值。\n\n对于本食谱中的 SQL Agent 报表，使用堆叠条形图显示构成每个作业的各个步骤；悬停在条形上会显示特定于作业步骤的详细信息。条形图上的用户选择会过滤折线图，从而可以轻松访问任何作业步骤的近期性能。在\
  \ Power BI 中分析 SQL Agent 作业历史记录比 SQL Server Management Studio 中的 Job Activity Monitor\
  \ 和 Log File Viewer 接口容易得多且更灵活。\n\n### There's more...\n\nPower BI 服务为仪表板和已发布报表提供免费使用报表。这些使用报表可以轻松扩展以使用以下步骤分析应用程序工作区中包含的所有报表和仪表板活动：\n\
  \n1. 在 Power BI 服务中打开应用程序工作区并选择报表或仪表板的垂直省略号；选择 View usage metrics report（使用指标报表也可以通过打开报表或仪表板后通过工具栏省略号\
  \ (...) 并选择 Open usage metrics 来访问）：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_498_0.png)\n\
  \n2. 打开使用指标报表后，单击 File | Save as 以向应用程序工作区添加新报表：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_499_0.png)\n\
  \n图 10.26：保存为以创建工作区的使用指标数据集\n\n3. 打开新报表并简单地删除报表级筛选器，以便包含所有报表和仪表板：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_499_1.png)\n\
  \n图 10.27：使用指标报表\n\n请注意，单个用户包含在数据集和默认报表中，使得识别谁访问或未访问内容变得容易。\n\n### See also\n\n\
  - SQL Server Agent Table documentation: http://bit.ly/2v7kWdc\n- Monitor usage metrics\
  \ in the new workspace experience: https://bit.ly/2Srjy1V\n- Track user activities\
  \ in Power BI: https://bit.ly/3raDXZD\n\n## 利用 Power BI PowerShell 模块\n\nPower BI\
  \ 管理员可以通过开发利用 Microsoft Power BI Management PowerShell 模块中包含的命令（如 Get-PowerBIWorkspace\
  \ 和 Add-PowerBIWorkspaceUser）的 PowerShell 脚本来自动化常见任务。此外，可以使用 Power BI REST API 和\
  \ .NET 客户端库开发自定义管理解决方案。使用 Power BI REST API，管理员可以自动化工作区和仪表板的创建、发布工作区内容、共享工作区内容、删除对工作区的访问、删除工作区等等。\n\
  \n本食谱演示了如何通过 PowerShell 连接到 Power BI 并执行简单的管理功能。\n\n### Getting ready\n\n为本食谱做准备，请执行以下步骤：\n\
  \n1. 在 Power BI 服务的租户设置中启用 Power BI API：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_500_0.png)\n\
  \n图 10.28：Power BI 服务中 Power BI API 的租户设置\n\n2. 确保您是 Power BI 管理员或具有 Power BI 权限\n\
  \n3. 以管理员身份运行 PowerShell 会话\n\n4. 设置执行策略：\n\n```\nSet-ExecutionPolicy RemoteSigned\n\
  ```\n\n5. 运行以下命令安装 Power BI Management 模块：\n\n```\nInstall-Module MicrosoftPowerBIMgmt\
  \ -Force\n```\n\n6. 连接到 Power BI：`Login-PowerBI`\n\n7. 验证访问：`Get-PowerBIWorkspace\
  \ | Format-Table`\n\n### How to leverage the Power BI PowerShell Module\n\n要实现本食谱，请执行以下步骤：\n\
  \n1. 在 PowerShell 中获取所有新工作区的列表，包括个人工作区，并将其导出为 CSV 文件：\n\n```powershell\nGet-PowerBIWorkspace\
  \ -Scope Organization -All | Export-Csv c:\\temp\\workspaces.csv\n```\n\n2. 获取所有工作区的列表，包括经典工作区，但排除个人工作区，并将其导出到\
  \ CSV 文件：\n\n```powershell\nGet-PowerBIWorkspace -All | Export-Csv c:\\temp\\workspaces2.csv\n\
  ```\n\n3. 获取所有新工作区的所有工作区用户列表：\n\n```powershell\nGet-PowerBIWorkspace -Scope Organization\
  \ -Include All -All |\nForEach-Object {\n    $Workspace = $_.name\n    $WorkspaceId\
  \ = $_.Id\n    foreach ($User in $_.Users) {\n        [PSCustomObject]@{\n     \
  \       Workspace = $Workspace\n            Id = $WorkspaceId\n            Role\
  \ = $User.accessright\n            User = $user.Identifier\n        }\n    }\n}\
  \ | Export-Csv \"c:\\temp\\workspaceusers.csv\" -NoTypeInformation\n```\n\n4. 创建一个名为\
  \ Workspaces2 的查询并禁用加载：\n\n```powerquery\nlet\n    Source = Csv.Document(File.Contents(\"\
  C:\\temp\\workspaces2.csv\"),\n        [Delimiter=\",\", Columns=15, Encoding=1252,\n\
  \        QuoteStyle=QuoteStyle.None]),\n    RemoveRows = Table.Skip(Source,1),\n\
  \    Headers = Table.PromoteHeaders(RemoveRows, [PromoteAllScalars=true]),\n   \
  \ ChangeTypes = Table.TransformColumnTypes(Headers,{{\"Id\", type text},\n     \
  \   {\"Name\", type text}, {\"IsReadOnly\", type logical},\n        {\"IsOnDedicatedCapacity\"\
  , type logical}, {\"CapacityId\", type text},\n        {\"Description\", type text},\
  \ {\"Type\", type text}, {\"State\", type text},\n```\n\n\n\n\n\nforeach ($Report\
  \ in $_.Reports) {\n[PSCustomObject]@{\nWorkspace = $Workspace\nId = $WorkspaceId\n\
  ReportID = $Report.Id\nReport = $Report.Name}} | Export-Csv \"c:\\temp\\wsreports.csv\"\
  \ -NoTypeInformation\n```\n\n- 8. 从 **Home** 选项卡的 功能区 中单击 **Close & Apply**。\n-\
  \ 9. 在 **Workspaces** 和 **WorkspaceUsers** 表之间建立 **ID** 列的关系。\n- 10. 可选地，在 **Workspaces**\
  \ 表与 Reports、Dashboards、Datasets、Dataflows 和 Workbooks 的其他表之间建立 **ID** 列的额外关系。\n\
  - 11. 创建一个用于连接用户的度量值：\n  **Users = CONCATENATEX('WorkspaceUsers',[User],\", \")**\n\
  - 12. 创建一个矩阵可视化，使用 **Workspaces** 表中的 **Name** 列作为 **Rows**，**WorkspaceUsers** 表中的\
  \ **Role** 列作为 **Column**，以及 **Users** 度量值作为 **Values**。\n\n## How it works...\n\
  \n经典 Power BI 工作区的功能比新工作区少。对于经典工作区，用户权限列表无法通过 Power BI API 获取，因为访问权限是通过 Office 365\
  \ 组授予的。此外，PSCustomObject 未包含在支持经典工作区的 cmdlet 调用中。作为 Power BI 管理员，您可以通过访问 Power BI\
  \ **Admin portal** 并选择 **Workspaces** 来升级工作区。在列出的 **Workspaces** 中，选择一个或多个工作区，然后从工具栏单击\
  \ **Upgrade**。\n\n通过本食谱中创建的矩阵可视化，可以轻松找到经典工作区，只需单击 **Rows** 字段中 **Name** 列的下拉菜单并选择\
  \ **Show items with no data**。没有列出用户、例如 **Admin**、**Contributor**、**Member** 或 **Viewer**\
  \ 的非孤立工作区几乎肯定是应升级的经典工作区。\n\n## There's more...\n\n可用于 Power BI 的 PowerShell cmdlet\
  \ 很多，包括以下内容：\n\n- 1. 获取所有已删除工作区的列表：\n  **Get-PowerBIWorkspace -Scope Organization\
  \ -Deleted -All**\n\n## Administering and Monitoring Power BI\n\n- 2. 恢复工作区：\n \
  \ \n  ```powershell\n  Restore-PowerBIWorkspace -Id \"<Workspace GUID>\" -RestoredName\
  \ \"<Workspace Name>\" -AdminEmailAddress \"<Admin UPN>\"\n  ```\n  \n- 3. 查找孤立工作区：\n\
  \  \n  ```powershell\n  Get-PowerBIWorkspace -Scope Organization -Orphaned -All\n\
  \  ```\n  \n- 4. 解决孤立工作区问题：\n  \n  ```powershell\n  Add-PowerBIWorkspaceUser -Scope\
  \ Organization -Id <Workspace ID> -UserPrincipalName <User UPN> -AccessRight Admin\n\
  \  ```\n  \n- 5. 获取 Power BI 活动日志事件：\n  \n  ```powershell\n  $events = Get-PowerBIActivityEvent\
  \ -StartDateTime '2021-07-14T00:00:00' -EndDateTime '2021-07-14T23:59:59' -ActivityType\
  \ 'ViewDashboard' | ConvertFrom-Json\n  $events.Count\n  $events[0]\n  ```\n\n并非所有\
  \ Power BI REST API 调用都有对应的 PowerShell cmdlet。然而，这并不意味着这些 REST API 调用不能仍从 PowerShell\
  \ 中使用。Power BI 的 PowerShell cmdlet 包括通用的 Invoke-PowerBIRestMethod 方法。此方法允许调用任何 Power\
  \ BI REST API 调用，例如以下示例，它创建一个包含所有工作区以及关联用户、报表、仪表板、数据集和工作簿的 JSON 文件：\n\n```\n```powershell\n\
  Invoke-PowerBIRestMethod -Url 'https://api.powerbi.com/v1.0/myorg/admin/Groups?$top=5000&$expand=users,reports,dashboards,datasets,workbooks'\
  \ -Method Get > c:\\temp\\workspaces.json\n```\n```\n\n此方法使用 Login-PowerBI、Login-PowerBIServiceAccount\
  \ 或 Connect-PowerBIServiceAccount 调用设置的相同凭据。要在 PowerShell 之外使用经过身份验证的会话，请使用以下命令：\n\
  \n```\n```powershell\nGet-PowerBIAccessToken -AsString\n```\n```\n\n## See also\n\
  \n- PowerShell cmdlets, REST APIs, and .NET client libraries for administrators:\
  \ https://bit.ly/3vDJ5qc\n- Power BI REST APIs: https://bit.ly/3eR70R6\n- Power\
  \ BI Cmdlets reference: https://bit.ly/3h1ShR2\n- Track user activities in Power\
  \ BI: https://bit.ly/3raDXZD\n\n## Conclusion\n\n本章的食谱重点介绍了最常见且影响最大的管理数据源，包括 Windows\
  \ Performance Monitor、SQL Server Query Store、本地数据网关、MSDB 系统数据库和 Extended Events。构建在这些数据源之上的\
  \ Power BI 解决方案可主动评估使用趋势和资源瓶颈，同时提供识别根本原因所需的详细分析。此外，本章还介绍了通过 **dynamic management\
  \ views (DMVs)** 暴露的现有 Power BI 和 SSAS 数据模型的元数据，例如度量值和关系定义以及资源消耗。\n"
- "## 11\n\n## Enhancing and Optimizing Existing Power BI Solutions\n\nPower BI 项目通常从关注特定功能需求开始，例如为某个业务领域和团队提供一组仪表板和报表。在需求相对狭窄且数据集较小的情况下，通常无需对数据检索、模型和报表层进行设计和代码增强即可实现足够的性能和可靠性。此外，Power\
  \ BI Premium 容量以及在某些情况下的 Analysis Services 资源提供了增强数据集可扩展性的可行选项。\n\n对于更大的 Power BI\
  \ 项目——特别是当 Power BI Premium 和 Analysis Services 选项不可用时——识别改进报表查询性能的机会以及更有效地使用系统资源来存储和刷新数据集变得很重要。\n\
  \n此外，数据导入过程通常可以变得更具弹性且资源消耗更少。此外，在 Power Query (M) 和 DAX 表达式中应用标准编码语法、变量和注释，进一步提高了\
  \ Power BI 数据集的可持续性。\n\n本章的食谱包含增强 Power BI 数据集性能、可扩展性和可靠性的顶级数据建模、DAX 度量值和 M 查询模式。这包括数据模型和度量的性能调优示例、M\
  \ 查询的错误处理和查询折叠示例，以及关于 DAX 和 M 查询引擎的支持细节。\n\n在本章中，我们将介绍以下食谱：\n\n- Enhancing Data\
  \ Model Scalability and Usability\n- Improving DAX Measure Performance\n- Pushing\
  \ Query Processing Back to Source Systems\n- Strengthening Data Import and Integration\
  \ Processes\n- Isolating and Documenting DAX Expressions\n- Improving Data Load\
  \ Speeds with Incremental Refresh\n\n## Technical Requirements\n\n完成本章食谱所需的条件如下：\n\
  \n- Power BI Desktop\n- 安装了 AdventureWorksDW2019 数据库的 SQL Server。此数据库及安装说明可在以下位置获取：http://bit.ly/20VQfG7\n\
  - 本章的文件可从以下 GitHub 仓库下载：https://github.com/PacktPublishing/Microsoft-Power-BI-Cookbook-Second-Edition\n\
  \n## Enhancing Data Model Scalability and Usability\n\n所有 Power BI 报表的性能都受数据模型设计的影响。在访问报表时执行的\
  \ DAX 查询以及在交互式、自助用户会话中动态更新报表可视化时所依赖的查询，都依赖于模型中定义的关系以及对模型表的优化。对于内存中模型，导入列的基数和这些列的压缩会影响数据集的大小和查询持续时间。对于\
  \ DirectQuery 数据模型，源表的引用完整性和关系源的优化在很大程度上决定了查询性能。\n\n本食谱包含三个优化过程，均以包含 1170 万行的 Reseller\
  \ Sales 事实表为重点。第一个示例利用第 10 章 Administering and Monitoring Power BI 中创建的 DMVs 和 Power\
  \ BI 内存报告来识别和解决最昂贵的列。第二个示例将维度表拆分为两个较小的表，最后一个示例对导入的事实表应用自定义排序顺序，以优化报表中常用的列的压缩。\n\n\
  \n\n\n\n## 增强和优化现有的 Power BI 解决方案\n\n对于导入模式模型来说，昂贵的列是指具有大量唯一值（高基数）的列，例如*第 2 章“访问和检索数据”*中用作示例的**订单编号**列。同样，每个日期包含多个时间值的\
  \ **DateTime** 列会比两个独立的 **Date** 和 **Time** 列消耗更多内存。最好只导入**Date**列，或者只导入**Date**和**Time**列，而不是**DateTime**列。\n\
  \n此外，按照*选择和重命名列*中的方法，针对低基数列（如**单价**和**数量**）执行简单算术运算的 DAX 度量值可以避免导入更昂贵的派生列（如**销售额**和**含税销售额**）。而且，虽然看起来有违直觉，但跨多列进行算术运算的\
  \ SUMX 度量值通常优于简单的 SUM 度量值。\n\n- 3. 识别以高精度（小数点右侧的位数）十进制数字数据类型存储的列。如果不需要这种精度级别，请考虑在\
  \ SQL 视图中或通过 M 导入查询来舍入这些列，以降低基数（唯一值的数量），从而改善压缩效果。如果 (19,4) 列能提供足够的大小和精度，请在模型中应用定点十进制数字类型。\n\
  \n- 4. 替换大型事实表上的任何 DAX 计算列，因为导入列比计算列能实现更好的压缩。事实表上的计算列通常可以用 DAX 度量值来解决，而不会牺牲性能；但如果无法使用\
  \ DAX 度量值，则将该列的逻辑移至事实表的 SQL 视图或 M 查询中，或移至数据源本身。如果修改了 M 查询，请确保逻辑被下推到源系统。\n\n- 5.\
  \ 同样，移除或替换任何大型维度表上的 DAX 计算列，方法是将此逻辑移至数据检索过程或利用源系统。\n\n查找包含 RELATED 或 LOOKUPVALUE\
  \ 函数的计算列，这些函数类似于 Excel VLOOKUP 函数，只是从与事实表存在多对一关系的“一”侧表中检索列值。业务用户通常使用 RELATED 和 LOOKUPVALUE\
  \ 函数来扁平化或反规范化事实表，就像在标准 Excel 工作表中那样，但在 Power BI 中这种重复通常是不必要的，而且计算列不像标准导入列那样被压缩。此外，请考虑将计算列表达式的逻辑（例如计算日期、日期差异和派生数值列）迁移到\
  \ DAX 度量值中。\n\n- 6. 在此示例中，数据集的当前状态为 334 MB 的压缩磁盘空间（从 KB 转换的 PBIX 文件大小）和 674 MB 的总内存（根据*第\
  \ 10 章“管理和监控 Power BI”*中引入的内存报告）。\n\n按照上述步骤，在 Reseller Sales 事实表（1170 万行）上发现了几个立竿见影的优化点，包括：\n\
  \n- 分析只需要 CarrierTrackingNumber 的最后四个字符。\n- 可以移除 YYYYMMDD 格式的 Order Date、Ship Date\
  \ 和 Due Date 列，因为这些列与该列的数据类型（日期）冗余，而关系仅使用日期数据类型。\n- 可以移除四个计算列（Due Date 与 Order Date\
  \ 之间的天数、Order Days、Reseller 和 Product Name），因为可以使用 DATEDIFF DAX 度量值，并且可以改用现有的维度列。\n\
  - 可以移除 Sales Amount、Extended Amount 和 Total Product Cost 列，因为简单的 DAX 度量值可以计算它们的值。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_511_0.png)\n\n完成修订后，数据集现在占用 429 MB 内存，Power\
  \ BI Desktop 文件（PBIX）占用 221 MB 磁盘空间，内存和磁盘空间节省了 33% 以上。\n\n大型维度表（约 100 万行以上）由于与事实表存在高基数关系，是\
  \ Power BI 和 SSAS 表格导入模型的主要性能瓶颈。请考虑以下同时描述经销商和促销活动的维度表：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_511_1.png)\n\
  \n- 7. 合并后的表包含 10,520 行，**Reseller Sales** 表上的关系列为 19.4 MB。\n\n| 列 | 总列大小（MB） |\
  \ 数据大小（MB） | 字典大小（MB） | VERTIPAQ_STATE |\n|---|---:|---:|---:|---|\n| CarrierTrackingSuffix\
  \ | 23.9 | 22.3 | 1.6 | COMPLETED |\n| ResellerPromoKey | 19.4 | 19.2 | 0.2 | COMPLETED\
  \ |\n| OrderDate | 16.7 | 16.5 | 0.2 | COMPLETED |\n\n图 11.3：Reseller 促销键，大小约为 20\
  \ MB\n\n- 8. 我们可以将此表拆分（规范化）为较小的 **Reseller**（701 行）和 **Promotion**（16 行）维度表，并删除合并的\
  \ **Reseller Promotion** 维度表以及事实表上昂贵的 ResellerPromoKey 列。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_512_0.png)\n\
  \n图 11.4：Reseller 和 Promotion 表替代合并后的 Reseller Promotion 表\n\n较小的关系可以提高访问 **Promotion**\
  \ 和 **Reseller** 列的查询性能。此外，移除 ResellerPromoKey 关系列将减小数据集的大小。\n\n在此特定示例中，行数足够少，因此影响不大；但随着查询工作负载的增加，请考虑将超过\
  \ 200,000 行的大型维度表拆分为较小的表（更低粒度）。例如，一个 100 万行的客户表可以仅根据常见的查询模式（如客户区域或地理位置）拆分为两个数据模型表。\n\
  \n### 工作原理...\n\n请记住，针对导入模式模型执行的 DAX 查询会访问和扫描与各列关联的内存。因此，事实表上可能存在几个具有数百万唯一值的非常昂贵的列，但这可能不会对不引用这些列的查询性能产生负面影响。移除这些昂贵的列或用更便宜的列替换它们可以减小数据集的整体大小，但您不应指望查询性能得到改善。\n\
  \n当数据加载到 Power BI Desktop 模型（导入模式）时，VertiPaq 存储引擎会对每一列应用压缩算法以减少内存占用，从而提高性能。VertiPaq\
  \ 首先存储列的所有唯一值（通过值编码或哈希编码），然后，更重要的是，应用**运行长度编码（RLE）**，对一组连续行中出现的重复值只存储一次。因此，唯一值较少的列（如月份名称）会被高度压缩，而主键和\
  \ GUID 列则完全不会被压缩。\n\nPower BI Desktop（以及 Excel 的 Power Pivot）中的数据模型以 100 万行的列段存储。例如，一个\
  \ 2000 万行的销售事实表将包含大约 20 个不同的段。如果报表查询所需的数据分散在所有 20 个段中，则需要更多资源（和更长时间）来访问每个段并合并这些结果以解决查询。但是，如果这些段按日期或某个给定维度（例如\
  \ **StoreID**）排序，并且报表查询包含利用此顺序的筛选器（如会计年度或商店区域），则只会查询一部分段。\n\n举个简单的例子，假设一个 2000 万行的事实表在导入\
  \ Power BI 时按日期排序，每个日历年代表 100 万行。一个仅按 2 年筛选的报表查询将只需要访问 20 个列段中的 2 个，因为其他 18 个段包含的日期不在查询范围内。\n\
  \nVertiPaq Analyzer 现在已集成到 DAX Studio 的**高级**菜单以及 Tabular Editor 3 中。VertiPaq Analyzer\
  \ 可以轻松快速地识别消耗内存最多的列。这和 Tabular Editor 中的 Best Practice Analyzer 是分析 Power BI 数据集健康状况最常用且最易用的两个工具。\n\
  \n### 更多内容...\n\n虽然分析数据模型并进行优化很重要，但在 Power Query 编辑器中也可以进行优化。例如，避免将仅用于数据检索/转换逻辑的表（如暂存查询）加载到数据模型。即使从**字段**列表中隐藏，这些表也像模型中的所有其他表一样消耗处理和存储资源，并增加不必要的复杂性。在\
  \ Power Query 编辑器中右键单击这些查询，并禁用**启用加载**以从数据模型中移除该表。请记住，具有许多 M 查询的数据模型，无论是否加载，在刷新期间都可能会使源系统的可用线程/资源不堪重负，因为所有查询都会同时提交。\n\
  \n此外，识别很少更改的表，并考虑禁用默认的**包含在报表刷新中**属性（通过在 Power Query 编辑器中右键单击查询）。该表仍可加载到数据模型中，因此可用于关系和\
  \ DAX 度量值，但其源查询将不再随每次刷新一起执行。典型的候选表包括每年只更新一次的年度预算或计划表、货币表，以及可能的地理或人口统计表。\n\n\n\n\n\
  \n## 准备工作\n\n要为本配方做准备，请按照以下步骤操作：\n\n- 1. 打开包含要分析的数据模型和度量的 Power BI Desktop 文件\n\
  - 2. 从 **External Tools** 选项卡的 ribbon 中选择 **DAX Studio**\n- 3. 如有必要，构建一个与性能不佳的报表或常见报表布局相匹配的示例报表页\n\
  - 4. 在 Power BI Desktop 中，从 **View** 选项卡的 ribbon 中选择 **Performance analyzer**\n\n\
  ## 如何操作…\n\n要实现本配方，请使用以下步骤：\n\n- 1. 在 **Performance analyzer** 窗格中，选择 **Start recording**。\n\
  - 2. 在 Power BI Desktop 报表视觉对象上进行一次选择，并在 **Performance analyzer** 中观察 DAX 查询。在此案例中，所研究的度量为\
  \ Gross_Sales_Warehouse 度量，定义如下：\n  \n  **Gross_Sales_Warehouse = CALCULATE([Reseller\
  \ Gross Sales], FILTER('Reseller', 'Reseller'[Business Type] = \"Warehouse\"))**\n\
  \  \n- 3. 在 **Performance analyzer** 中展开包含所需度量的视觉对象并选择 **Copy query**：\n\n```\n\
  DEFINE\n    VAR __DS0FilterTable = FILTER(KEEPFILTERS(VALUES('Date'[Calendar Year])),\n\
  \        OR('Date'[Calendar Year] = 2016, 'Date'[Calendar Year] = 2017))\n    VAR\
  \ __DS0FilterTable2 = FILTER(KEEPFILTERS(VALUES('Product'[Product Category])),\n\
  \        'Product'[Product Category] = \"Bikes\")\n    VAR __DS0FilterTable3 = FILTER(KEEPFILTERS(VALUES('Promotion'[Promotion\
  \ Type])),\n        OR(OR(OR('Promotion'[Promotion Type] = \"Excess Inventory\"\
  ,\n            'Promotion'[Promotion Type] = \"New Product\"), 'Promotion'[Promotion\
  \ Type] = \"No Discount\"),\n            'Promotion'[Promotion Type] = \"Volume\
  \ Discount\"))\nEVALUATE\n    TOPN(1001, SUMMARIZECOLUMNS('Reseller'[Reseller],\
  \ __DS0FilterTable, __DS0FilterTable2, __DS0FilterTable3,\n        \"Gross_Sales_Warehouse\"\
  , 'Reseller Sales'[Gross Sales Warehouse]),\n        [Gross_Sales_Warehouse], 0,\
  \ 'Reseller'[Reseller], 1)\n```\n\n使用修订后的度量后，基准查询执行速度提高了 35%（**69 ms** 至 **45 ms**），并且仅需要\
  \ **1 SE** 查询。\n\n## 其工作原理...\n\n第一个度量较慢的原因是，使用对 **Reseller** 的 FILTER，报表中切片器视觉对象的筛选选择（**Date**、**Product**\
  \ 和 **Promotion**）必须在仓库筛选执行之前得到尊重。例如，**Reseller** 维度表将在应用 **Warehouse** 筛选之前被筛选为仅包含\
  \ 2016-2017 年自行车类别销售且属于特定促销的经销商。这需要对事实表进行额外扫描，因此效率较低。\n\n来自 Power BI 报表视觉对象的 DAX\
  \ 查询由 DAX 公式引擎和 DAX 存储引擎解析。存储引擎是导入模式模型的内存中列式压缩数据库（也称为 VertiPaq），也是 DirectQuery 模型的关联数据库。在任何模式下，公式引擎负责生成查询计划并可以执行所有\
  \ DAX 函数，包括复杂的表达式逻辑，但它仅限于单线程且无缓存。\n\n公式引擎向存储引擎发送请求，如果存储引擎在现有数据缓存中没有请求的数据，则存储引擎利用多个线程访问数据模型中的数据段（每段\
  \ 1 个线程，每段 100 万行）。存储引擎执行简单的连接、分组、筛选和聚合，包括不同计数，以便将请求的数据缓存提供给公式引擎。鉴于此架构，基本的 DAX 和\
  \ Power BI 模型设计实践是最大化将查询分配给存储引擎，并最小化由公式引擎操作的数据缓存的大小。\n\n鉴于减少存储的性能优势，引擎请求也考虑使用变量。虽然\
  \ DAX 变量的主要好处是提高可读性，但变量还可以减少与度量相关的查询数量（从而缩短其执行时间），因为变量仅评估一次并且可以在表达式中多次重用。查找具有多个\
  \ IF 或 SWITCH 分支的 DAX 度量，这些分支多次引用相同的计算或度量。对于这些度量，请考虑声明一个变量，该变量仅引用现有度量（`VAR MyVariable\
  \ = [Sales Amount]`），然后在每个逻辑条件中引用此变量，而不是度量。\n\n虽然 Power BI 生成的 DAX 查询无法编辑，但 DAX\
  \ 查询可以完全从头开始为其他工具编写，例如 **SQL Server Reporting Services (SSRS)** 报表中的数据集。许多较新的 DAX\
  \ 函数，例如 **TREATAS and SUMMARIZECOLUMNS**，对查询特别有帮助，通常度量和查询的性能考虑是相同的。研究 Power BI 生成的\
  \ DAX 查询是学习如何编写高效 DAX 查询和 DAX 的好方法。\n\n## 还有更多...\n\nDAX 度量可以优化的另一个示例是此示例，其中度量必须按来自两个不同表的两个列的\
  \ OR 条件进行筛选。与前一个示例一样，在此场景中无法避免 FILTER 函数，因为必须在同一表达式中引用多个列（OR 条件）。当前度量定义如下：\n\n```\n\
  Reseller Gross Sales (Filter OR) =\nCALCULATE([Reseller Gross Sales], FILTER('Reseller\
  \ Sales',\nRELATED('Product'[Product Subcategory]) = \"Mountain Bikes\" ||\nRELATED('Reseller'[Reseller\
  \ Country]) IN {\"United States\", \"Australia\"}))\n```\n\n对事实表应用了 FILTER，并使用单独的\
  \ RELATED 函数来实现所需的 OR 逻辑。要了解如何优化此度量，请考虑以下内容：\n\n- 1. 就像前一个示例一样，从 **Performance analyzer**\
  \ 窗格在 Power BI Desktop 中捕获生成的示例 DAX 查询\n- 2. 在 DAX Studio 中测试和分析查询，以建立当前度量的基线\n\
  - 3. 现在创建两个单独的替代度量——一个使用 SUMMARIZE，另一个使用 CROSSJOIN：\n  \n  **Reseller Gross Sales\
  \ (Summarize OR) =**\n  ```dax\n  CALCULATE([Reseller Gross Sales], FILTER(\n  SUMMARIZE('Reseller\
  \ Sales', 'Product'[Product Subcategory], 'Reseller'[Reseller Country]),\n  'Product'[Product\
  \ Subcategory] = \"Mountain Bikes\" ||\n  'Reseller'[Reseller Country] IN {\"United\
  \ States\", \"Australia\"}))\n  ```\n  \n  **Reseller Gross Sales (Crossjoin OR)\
  \ =**\n  ```dax\n  CALCULATE([Reseller Gross Sales], FILTER(\n  CROSSJOIN(ALL('Product'[Product\
  \ Subcategory]),ALL(Reseller[Reseller Country])), 'Product'[Product Subcategory]\
  \ = \"Mountain Bikes\" ||\n  'Reseller'[Reseller Country] IN {\"United States\"\
  , \"Australia\"}))\n  ```\n  \n- 4. 在 Power BI Desktop 中确认新度量产生的结果与当前度量相同\n- 5.\
  \ 在 DAX Studio 中，将对（filter OR）度量的引用替换为对新度量的引用\n\n- 6. 重复清除缓存后执行多个查询并记录性能的过程，以为三种版本的度量建立基线\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_520_0.png)\n\n图 11.8：DAX Studio 中基线查询（filter\
  \ OR）度量与两个新度量的服务器时序\n\n两个新度量比当前状态快 16.7 倍（2,844 至 170 ms），并且超过 90% 在存储引擎（SE）中执行。在此场景中，CROSSJOIN\
  \ 方法比 SUMMARIZE 稍快，但此比较会根据所涉及列的基数而变化。此示例的主要观点是，在迭代函数（如 FILTER 和 SUMX）的表达式参数中实现存储引擎不支持的逻辑所带来的危险。这在传递给这些函数的表参数行数很多时尤其如此，例如本配方中使用的\
  \ 1170 万行的 Reseller Sales 事实表。\n\n请注意，如果两个列来自同一表，例如 ALL('Product'[Product Category],\
  \ 'Product'[Product Color])，则可以使用 ALL 函数生成表参数。ALL 不能直接访问来自不同表的列。\n\n在高层次上，始终考虑被筛选表的大小，并寻找可以用来减小此表大小的简单筛选条件和单列。例如，用实现简单、高效筛选条件的\
  \ CALCULATETABLE 函数替换 SUMX 和 FILTER 等函数的表参数。然后，更复杂的表达式，这些表达式无法由存储引擎处理，可以在此较小的表上运行。同样，考虑（并测试）嵌套筛选条件，使最具选择性、最有效的筛选条件首先应用（内部\
  \ FILTER，外部 CALCULATE）：\n\n```\nCALCULATE(\n    CALCULATE(<param1>, <param2>)\n\
  ) //outer calculate\n```\n\n```\nFILTER(\n    FILTER(<param1>,<param2>), // inner\
  \ FILTER\n    <param2>\n)\n```\n\n\n\n## 另请参阅\n\n- 使用 Performance analyzer 在 Power\
  \ BI Desktop 中检查报表元素性能：`https://bit.ly/3eWXdEb`\n\n## 将查询处理推回源系统\n\n在从本地源检索的数据集的计划刷新期间，任何未由源系统执行的查询转换都将需要本地资源，即本地数据网关服务器的\
  \ **M (Mashup)** 引擎。随着数据集变大，并且可能在同一网关服务器上同时进行其他计划刷新，设计能够通过查询折叠充分利用源系统资源的 M 查询变得非常重要。虽然针对某些源（如文件）的转换始终需要本地资源，但在许多场景中，可以修改\
  \ M 查询以帮助引擎生成等效的 SQL 语句，从而最小化本地资源消耗。\n\n在本配方中，提供了一个流程和项目列表，用于识别当前未折叠的查询及其潜在原因。此外，还基于现有\
  \ SQL 语句重新设计了一个查询，使用 M 表达式实现查询折叠。\n\n### 准备工作\n\n为本配方做准备，请执行以下步骤：\n\n- 1. 识别要评估查询折叠的数据集\n\
  - 2. 使用网关服务器内存性能计数器数据建立执行刷新时当前使用的资源基线，因为这些计数器应会受到任何更改的影响\n\n此外，使用 Power Query 编辑器\
  \ **Tools** 选项卡中的新 **Diagnostic tools** 建立查询性能基线。\n\n要优化的数据集通常是一个大型 PBIX 文件（100\
  \ MB+），已发布到 Power BI 服务，并配置了计划刷新以使用本地数据网关，且查询关系数据库（SQL、Oracle）作为主要源。如果大型 PBIX 文件是从文件或文件夹中的文件集合检索的，修订是完全可能的，例如根据文件修改日期相对于当前日期进行过滤，但对于文件源而言，查询折叠不是一个选项。\n\
  \n### 如何操作...\n\n以下步骤概述了一般的查询折叠分析流程：\n\n- 1. 打开用作已发布数据集并进行本地数据计划刷新的 Power BI Desktop\
  \ 文件。\n- 2. 从 **Home** 选项卡的 ribbon 中单击 **Edit Queries** 以打开 Power Query 编辑器。\n-\
  \ 3. 从 **Query Settings** 窗口中，从最大的查询（事实表）开始，右键单击最终步骤。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_522_0.png)\n\
  \n图 11.9：最终查询步骤的 View Native Query 已禁用\n\n如果 **View Native Query** 选项被禁用，则本地 M 引擎至少正在执行此最终步骤。如果\
  \ **View Native Query** 未被禁用，您可以可选地查看 SQL 语句，如之前的配方所述。\n\n- 4. 检查之前的步骤以确定哪些步骤（如果有）被折叠，从而确定导致查询使用本地资源的步骤。一旦查询中的某个步骤（M\
  \ 变量表达式）使用本地资源，查询中的所有后续步骤也将使用本地资源。\n- 5. 识别本地操作的成因，例如源系统不支持的特定 M 函数。\n\n- 6. 考虑修订源数据库对象、M\
  \ 表达式和数据源隐私级别以启用查询折叠。\n\n作为执行此流程的示例，考虑以下案例，其中业务分析师已使用 SQL 语句和查询编辑器构建了一个客户查询：\n\n\
  ```\nlet Source = Sql.Database(\"ATLASC\", \"AdventureWorksDW2016CTP3\"),\n    Query\
  \ = Value.NativeQuery(Source, \"Select CustomerKey,FirstName,LastName,BirthDate,MaritalStatus,YearlyIncome\
  \ From dbo.DimCustomer\"),\n    ChangedType = Table.TransformColumnTypes(Query,{{\"\
  BirthDate\", type date}, {\"YearlyIncome\", Int64.Type}}),\n    ReplacedValue =\
  \ Table.ReplaceValue(ChangedType,\"M\",\"Married\",Replacer.ReplaceText,{\"MaritalStatus\"\
  }),\n    ReplacedValue1 = Table.ReplaceValue(ReplacedValue,\"S\",\"Single\",Replacer.ReplaceText,{\"\
  MaritalStatus\"}),\n    MergedColumns = Table.CombineColumns(ReplacedValue,{ \"\
  FirstName\", \"LastName\"},Combiner.CombineTextByDelimiter(\", \", QuoteStyle.None),\"\
  Customer Name\"),\n    RenamedColumns = Table.RenameColumns(MergedColumns,{{\"MaritalStatus\"\
  , \"Marital Status\"}, {\"YearlyIncome\", \"Yearly Income\"}, {\"BirthDate\", \"\
  Date of Birth\"}})\nin RenamedColumns\n```\n\n图 11.10：基于原生 SQL 语句和 M 转换的客户查询\n\n\
  在此场景中，SQL 语句针对数据仓库中的基础客户表（不是视图），并且对查询结果应用的后续转换在每次刷新过程中都使用本地网关服务器资源，因为第一步执行了原生 SQL\
  \ 查询。现有 SQL 视图（vDim_Customer）包含 Customer Name 列，消除了合并操作的需要，尽管 Marital Status 列未按分析师的转换转换为更长的\
  \ Married 或 Single 字符串。可以通过利用查询折叠来改进查询，如下所示：\n\n- 1. 创建一个新的 M 查询，使用参数用于服务器和数据库，并使用客户\
  \ SQL 视图：\n\n```\nlet Source = AdWorksProd,\nCustomer = AdWorksProd{[Schema = \"\
  BI\", Item = \"vDim_Customer\"]}[Data],\nSelectColumns = Table.SelectColumns(Customer,{\"\
  Customer Key\", \"Customer Name\", \"Date of Birth\", \"Marital Status\", \"Annual\
  \ Income\"}),\nMarriageStatus = Table.AddColumn(SelectColumns, \"M Status\", each\
  \ if [Marital Status] = \"M\" then \"Married\" else \"Single\", type text),\nRemovedColumns\
  \ = Table.RemoveColumns(MarriageStatus,{\"Marital Status\"}),\nRenamedColumns =\
  \ Table.RenameColumns(RemovedColumns,{{\"M Status\", \"Marital Status\"}, {\"Annual\
  \ Income\", \"Yearly Income\"}})\nin RenamedColumns\n```\n\n利用了现有的 SQL 视图 vDim_Customer，并且\
  \ Marital Status 条件逻辑是在 Table.AddColumn 表达式中构建的。剩下的几个步骤只是选择、删除和重命名列，都是可以折叠回 SQL\
  \ Server 的转换。\n\n- 2. 右键单击新修订查询的最终步骤，并确保 **View Native Query** 已启用。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_524_0.png)\n\
  \n*图 11.11：基于修订后的客户 M 查询的原生查询（已折叠）*\n\n新查询返回相同的结果，但现在已折叠回 SQL Server 而不是使用本地资源。`if...then...else`\
  \ M 表达式被折叠为 SQL Server 执行的 CASE 表达式。\n\n### 工作原理...\n\n查询折叠受源系统支持的转换、内部专有 M 引擎逻辑、分配给数据源的隐私级别、原生数据库查询（SQL\
  \ 语句）的使用以及自定义 M 函数和逻辑的影响。例如，即使出于性能考虑查询折叠是合适的，例如使用服务器与本地文件进行连接操作，如果本地文件配置为私有数据源，折叠也不会发生。\n\
  \n根据本配方中的查询折叠重新设计示例，如果查询的第一步或 **Source** 步骤是原生 SQL 语句，请考虑修订 M 查询步骤以帮助 M 引擎形成 SQL\
  \ 查询（折叠 M 查询）。在原生 SQL 数据库查询（通过 `Value.NativeQuery`）之上应用的任何 M 转换都不会折叠到源系统。如果使用原生\
  \ SQL 查询，例如存储过程调用，建议将所有查询步骤和转换嵌入到原生 SQL 查询本身中。如果不可能，请将最耗资源的运算嵌入到存储过程中，并从 Power BI\
  \ 向存储过程传递过滤参数以减少本地 M 引擎的工作负载。\n\n如果有必需的转换或逻辑不被源系统支持用于查询折叠，建议将这些步骤移到查询的最后。例如，允许 SQL\
  \ Server 通过查询折叠执行过滤、派生列和其他简单步骤，然后再在 SQL 查询结果集之上本地应用复杂步骤。\n\n一些常见的 M 函数不被大多数关系数据库源支持，例如\
  \ `Table.Distinct`，它从表中删除重复行，以及 `Table.RemoveRowsWithErrors`，它从表中删除包含错误的行。如果在查询中合并数据源，请检查其隐私设置（**Data\
  \ source settings | Edit Permissions...**），以确保隐私配置允许折叠，例如从一个组织源到另一个组织源。\n\n通常，以下操作不被查询折叠支持：\n\
  \n- 更改列数据类型\n- 添加索引列\n- 从不同源合并或追加查询\n- 使用在数据源中没有等效函数的 Power Query 函数添加自定义列\n\n###\
  \ 还有更多...\n\n对于具有许多查询和大型表的模型，请考虑在 **File | Options | Options and settings | CURRENT\
  \ FILE** 中禁用默认的并行加载表，因为同时执行的许多查询可能会压倒源系统资源并导致刷新过程失败。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_525_0.png)\n\
  \n图 11.12：并行加载表 – CURRENT FILE 设置\n\n仅仅因为查询被折叠成 SQL 语句，并不意味着没有可能的性能问题。例如，查询可能选择了数据模型不需要的更多列，或者可能在数据库模式支持内部连接时执行外部连接查询。这些查询的可见性可以为\
  \ BI 架构和 M 查询的更改提供信息。\n\n关系数据库系统或数据仓库的所有者可以通过 **Extended Events** 等工具注意 Power BI\
  \ 的折叠 SQL 查询。例如，数据库管理员或 BI 团队成员可以根据收集到的信息修订现有的 SQL 视图、表索引等。同样，Power BI 查询作者也可以被告知访问相同数据的更好或首选方法，例如在不同列上连接。\n\
  \n\n\n\n\n## 另请参阅\n\n- ► Power Query 查询折叠：https://bit.ly/3jB5wrx\n- ► 展开表格列时优化 Power\
  \ Query：https://bit.ly/3trdKFA\n\n## 加强数据导入和集成流程\n\n许多 Power BI 数据集必须在没有数据仓库甚至关系型数据库源系统的情况下创建。这些数据集通常会转换和合并较少结构化和受管控的数据源，例如文本和\
  \ Excel 文件，一般需要更复杂的 M 查询来为分析准备数据。更复杂的 M 查询与这些源中周期性的结构变化和数据质量问题相结合，可能导致刷新失败以及支持数据集方面的挑战。此外，由于\
  \ M 查询有时最初完全通过 Query Editor 界面创建，所生成的实际 M 代码可能包含意外的逻辑，从而导致结果不正确并对源数据产生不必要的依赖。\n\n\
  本配方包含增加数据导入流程可靠性和可管理性的实用示例，包括数据源合并、错误处理和注释，以及应对缺失或更改的源列。\n\n## 准备工作\n\n为本配方做准备，请执行以下步骤：\n\
  \n- 1. 识别用于评估数据刷新可靠性的数据集，例如从逗号分隔值 CSV 文件导入信息的数据集\n- 2. 在 Power BI Desktop 中打开该数据集的\
  \ PBIX 文件\n\n本示例的目标是从包含 30 列描述客户的文本文件中检索四列。\n\n## 如何操作...\n\n要实施本配方，请使用以下步骤：\n\n\
  - 1. 使用文本/CSV 连接器连接到文件并用从参数创建的查询替换硬编码路径：\n\n```\nlet Source = Csv.Document(File.Contents(CustomerTextFile),[Delimiter=\"\
  \ \", Columns=30, Encoding=1252, QuoteStyle=QuoteStyle.None]),\nPromotedHeaders\
  \ = Table.PromoteHeaders(Source, [PromoteAllScalars=true])\nin PromotedHeaders\n\
  ```\n\n## 还有更多...\n\n除了可靠性改进之外，还可以使用 Query Editor 中的 Tools 功能区中提供的 Query Diagnostics\
  \ 来分析查询性能。还有改进 Power Query 代码整体可维护性的方法。其中两种方法是注释和数据源管理。\n\n与所有编程语言一样，注释可用于提高 M 代码的整体可维护性，如以下示例所示：\n\
  \n```\n/* This query joins the Product query to the Product Subcategory query.\n\
  \    The product subcategory column 'EnglishProductSubcategoryName' is renamed\n\
  \    'Product Subcategory' */\nlet ProductToProductSubCatJoin =\ntry\n// Nested\
  \ outer join based on Subcategory Surrogate Key\nTable.NestedJoin(Product,{\"ProductSubcategoryKey\"\
  },#\"Product Subcategory\",{\"\nProductSubcategoryKey\"},\"ProductSubCatColumns\"\
  ,JoinKind.LeftOuter) otherwise\nProduct,\nAddProductSubCatColumn =\ntry\n// Will\
  \ return nulls if EnglishProductSubcategoryName is renamed or missing in\nProduct\
  \ Subcategory query\nTable.ExpandTableColumn(ProductToProductSubCatJoin, \"ProductSubCatColumns\"\
  ,{\"Eng\nlishProductSubcategoryName\"}, {\"Product Subcategory\"}) otherwise Product\n\
  in AddProductSubCatColumn\n```\n\n注释以多行和单行格式使用，以帮助解释逻辑。多行注释以 /* 开始并以 */ 结束，而单行注释以\
  \ // 字符开头。变量名（即 AddProductSubCatColumn）采用正确的大小写且没有空格，以避免不必要的双引号并进一步描述流程。\n\n提高 Power\
  \ Query 代码可维护性的另一种方法是进行适当的数据源管理。考虑一个包含 10 个查询的 PBIX 文件，其中三个不同的数据源硬编码到每个查询中。在此示例中，10\
  \ 个查询使用三个单独的源（SQL Server、Excel 文件和 MS Access 数据库文件）。对数据源路径或连接信息进行的任何更改都需要更改多达 10\
  \ 个不同的查询。要了解如何解决此问题，请考虑以下内容：\n\n- 1. 打开 Power BI Desktop 文件并识别所有查询访问的数据源\n- 2. 报告视图中\
  \ Home 选项卡功能区 Transform data 下拉菜单中的 Data source settings 对话框将显示当前文件源\n- 3. 为了获得更详细的信息，请打开\
  \ Power Query Editor 并从 View 选项卡的功能区中单击 Query Dependencies\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_529_0.png)\n\
  \n图 11.14：10 个查询的 Query Dependencies 视图\n\n- 4. 在查询窗口中创建以下文件夹组：**Parameters**、**Data\
  \ Source Queries**、**Dimensions** 和 **Facts**\n- 5. 创建六个文本参数以从三个源中抽象文件名、文件路径、服务器和数据库名称\n\
  - 6. 从引用这些参数的单个空白查询中开发三个数据源查询：\n  = Sql.Database(\"#SQL Server AdWorks Server\"\
  , \"#SQL Server AdWorks DB\")\n  = \"#MS Access AdWorks Path\" & \"\\\" & \"#MS\
  \ Access AdWorks DB\" & \".accdb\"\n  = \"#MS Excel Ad Works Path\" & \"\\\" & \"\
  #MS Excel Ad Works File\" & \".xlsx\"\n- 7. 为这些查询分配名称，例如 **MS Access Ad Works Connection**\
  \ 并禁用其加载到数据模型\n- 8. 最后，修改每个 10 个查询以引用其中三个数据源查询，如下所示：\n\n```\nlet Source = Access.Database(File.Contents(\"\
  #MS Access Ad Works Connection\"), [CreateNavigationProperties=true]),\nCustomer\
  \ = Source[{\"Schema=\"\",Item=\"DimCustomer\"}][Data]\nin Customer\n```\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_529_1.png)\n\
  \n图 11.15：Power Query Editor 中合并且参数化的数据源\n\n## 增强和优化现有的 Power BI 解决方案\n\n文件夹组、参数和数据源查询使理解和管理检索过程变得更容易。\n\
  \n## 另请参阅\n\n- - *Power Query 中 10 个常见错误及如何避免陷阱* 作者 Gil Raviv：`http://bit.ly/2uW6c33`\n\
  - - *Query Diagnostics*：`https://bit.ly/2YBEmKv`\n\n## 隔离和记录 DAX 表达式\n\n建议将表达式隔离为独立且可互换的\
  \ DAX 度量或作为度量中的变量，以简化数据集的开发和所有权。独立度量可以从 **Fields** 列表中隐藏，但包含核心业务定义和高效的过滤逻辑，以驱动模型中许多其他度量的结果和性能。虽然作用域限定于每个度量，但\
  \ DAX 变量提供自记录的编码风格，并且与标量值度量不同，还支持表值，从而允许更大的模块化。\n\n在本配方中，DAX 变量、度量和注释在不同示例中使用，演示了\
  \ DAX 表达式的创建和使用的最佳实践。\n\n## 准备工作\n\n为本配方做准备，请执行以下步骤：\n\n- 1. 在本地打开 Power BI Desktop\
  \ 文件并通过单击 **Home** 选项卡功能区中的 **Transform Data** 访问 **Power Query Editor**。\n- 2.\
  \ 创建一个名为 AdWorksDW 的查询，类似于以下内容：\n  \n      ```m\n      let\n          Source = Sql.Database(\"\
  localhost\\\\MSSQL_SERVERDEV\", \"AdventureWorksDW2019\")\n      in\n          Source\n\
  \      ```\n- 3. 禁用 **AdWorksDW** 查询的加载并将其放置在 **Data Sources** 查询组中。\n- 4. 右键单击\
  \ **AdWorksDW** 查询并选择 **Reference**。\n- 5. 重命名查询为 **Reseller Sales** 并选择 **FactResellerSales**\
  \ 表。\n- 6. 重复步骤 4 和 5 以创建选择 **DimReseller** 表的 **Resellers** 表和选择 **DimDate** 表的\
  \ **Dates** 查询。\n- 7. 将 **Reseller Sales** 查询移动到 **Facts** 查询组，并将 **Resellers**\
  \ 和 **Dates** 查询移动到 **Dimensions** 查询组\n- 8. 在 **Other Queries** 查询组中，创建一个名为 **Calculations**\
  \ 的空白查询\n- 9. 从 **Home** 选项卡的功能区中选择 **Close & Apply**\n- 10. 保存您的工作\n\n## 如何操作...\n\
  \n要实施本配方，请使用以下步骤：\n\n- 1. 在 **Calculations** 表中创建以下基础度量：\n  `Reseller Gross Sales\
  \ = SUM('Reseller Sales'[SalesAmount])`\n  `Reseller Discount Amount = SUM('Reseller\
  \ Sales'[DiscountAmount])`\n- 2. 在 **Calculations** 表中创建 **Reseller Margin %** 度量：\n\
  \  `Reseller Margin % =`\n  `/*`\n  `Net Sales = Gross sales net of discounts that\
  \ have shipped`\n  `Product Cost = Product standard cost of all ordered products\
  \ (including not shipped). A Date of 12/31/2099 used for unshipped sales order lines\
  \ since 1/1/2015`\n  `*/`\n  `VAR ShippedSales = CALCULATETABLE('Reseller Sales',\
  \ 'Reseller Sales'[ShipDate] <> DATEVALUE(\"12/31/2099\"))`\n  `VAR NetSalesShipped\
  \ = CALCULATE([Reseller Gross Sales] - [Reseller Discount Amount],ShippedSales)`\n\
  \  `VAR ProductCost = SUMX('Reseller Sales', 'Reseller Sales'[OrderQuantity] * 'Reseller\
  \ Sales'[ProductStandardCost])`\n  `RETURN`\n  `DIVIDE(NetSalesShipped - ProductCost,NetSalesShipped)`\n\
  - 3. 在 **Calculations** 表中创建 **Reseller Gross Sales (Custom)** 度量：\n  `Reseller\
  \ Gross Sales (Custom) =`\n  `VAR CurrentDate = MAX('Dates'[FullDateAlternateKey])`\n\
  \  `VAR ResellerTypes = CALCULATETABLE('Resellers', Resellers[BusinessType] = \"\
  Warehouse\")`\n  `VAR DateHistory = --Trailing 10 Days`\n  `FILTER(ALL('Dates'),'Dates'[FullDateAlternateKey]\
  \ <= CurrentDate && 'Dates'[FullDateAlternateKey] >= CurrentDate - 10)`\n  `RETURN`\n\
  \  `CALCULATE([Reseller Gross Sales],ResellerTypes,DateHistory)`\n\n\n\n\n\n## 工作原理...\n\
  \n**Reseller Margin %**（经销商利润率）度量包含三行注释，用于描述度量各组件的业务定义。还可以通过 `--` 和 `//` 字符逐行添加注释，Power\
  \ BI 会将这些文本以绿色编码显示。对于包含多个组件的复杂度量以及构成许多其他度量基础的简单度量，都建议嵌入注释。\n\n**ShippedSales** 变量对\
  \ **Reseller Sales**（经销商销售）事实表进行筛选，以排除未发货的销售订单行，该表随后作为 **NetSalesShipped** 变量中的筛选参数使用。这里引用了现有的\
  \ **Reseller Gross Sales**（经销商总销售额）和 **Reseller Discount Amount**（经销商折扣金额）度量，但 **ProductCost**\
  \ 变量是显式针对 **Reseller Sales** 事实表（无论是否发货）定义的。虽然比实现相同计算的其他 DAX 表达式长得多，但使用变量和注释消除（或减少）了查看其他度量以理解逻辑和源列的需求。\n\
  \n对于 **Reseller Gross Sales (Custom)** 度量，为每个要筛选的表声明了变量，并插入了一条注释（**Trailing 10 Days**（最近10天））来帮助解释\
  \ **DateHistory** 变量。这些变量作为筛选参数传递给 CALCULATE，因此 **Reseller Gross Sales** 度量反映了这种修改后的筛选上下文。将所有筛选逻辑都写在\
  \ CALCULATE 中也能实现相同的功能结果，但这会降低表达式的可读性，从而使维护更加困难。\n\n## 更多内容...\n\n可以在 DAX Studio\
  \ 中使用 DAX Formatter 来让括号与关联函数对齐。可以将长而复杂的 DAX 度量从 Power BI Desktop 复制到 DAX Studio\
  \ 中进行格式化。要使用 DAX Studio 格式化查询，请打开 DAX Studio，将 Power BI Desktop 中的查询复制粘贴到主窗口中，然后在\
  \ DAX Studio 中点击 **Format Query**（格式化查询）。从 DAX Studio 中复制格式化后的查询，替换 Power BI Desktop\
  \ 中的原表达式。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_533_0.png)\n\n图 11.16：DAX\
  \ Studio 中的 DAX Formatter 用于格式化年度累计度量\n\nPower BI Desktop 中的 DAX 编写也支持括号高亮，但 DAX\
  \ Formatter 将函数独立成行，并缩进内部函数参数。如果没有 DAX Formatter 提供的函数隔离和缩进，复杂表达式往往过于宽泛，难以解读或排查问题。\n\
  \n## 另请参阅\n\n- 通过优化 DAX 提升 Power BI 性能：https://bit.ly/3uqUs4x\n\n## 使用增量刷新提升数据加载速度\n\
  \n增量刷新最初是面向 Power BI Premium 容量发布的功能，但后来也成为 Pro 许可证可用的功能。在增量刷新之前，Power BI 刷新数据集时只有一种操作模式——全量加载。换句话说，数据集中的现有数据会在每次刷新时被移除并完全替换。当处理包含数百万行的大型事实表时，全量加载刷新过程可能需要很长时间。增量刷新通过只刷新数据集中的新增和变更数据来解决此问题。由于增量刷新相对较新，较旧的数据集很可能仍在使用全量加载过程，因此通过改造为增量刷新可能会受益。\n\
  \n本教程演示如何在 Power BI 中设置和配置增量刷新。\n\n### 准备工作\n\n要为本教程做准备，请执行以下步骤：\n\n- 1. 在本地打开一个\
  \ Power BI Desktop 文件，点击 **开始** 选项卡功能区中的 **转换数据**，进入 **Power Query 编辑器**。\n- 2.\
  \ 创建一个名为 AdWorksDW 的查询，类似如下：\n\n```\n```powerquery\nlet\n    Source = Sql.Database(\"\
  localhost\\\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\")\nin\n    Source\n```\n\
  ```\n\n- 3. 禁用 AdWorksDW 查询的加载，并将其放入 **数据源** 查询组中。\n- 4. 右键单击 AdWorksDW 查询，选择 **引用**。\n\
  - 5. 将查询重命名为 **Reseller Sales**（经销商销售），并选择 **FactResellerSales** 表。\n- 6. 将 **Reseller\
  \ Sales** 查询移动到 **Facts** 查询组。\n- 7. 在 **其他查询** 查询组中，创建一个名为 **Calculations** 的空白查询。\n\
  - 8. 在 **开始** 选项卡的功能区中选择 **关闭并应用**。\n- 9. 保存你的工作。\n\n- 12. 点击 **关闭并应用**。\n- 13.\
  \ 在 **数据** 视图中，按降序对 **OrderDate** 列排序，注意 **11/29/2013 12:00:00 AM** 的行不存在。\n- 14.\
  \ 仍在 **数据** 视图中，右键单击 **Reseller Sales** 表，选择 **增量刷新**。\n- 15. 在 **增量刷新** 对话框中，为\
  \ **Reseller Sales** 表将 **增量刷新** 切换为 **开**，并将 **存储行...** 设置为 **30 年**，**刷新行...**\
  \ 设置为 **3 天**，如下图所示：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_536_0.png)\n\n\
  图 11.18：增量刷新对话框设置\n\n- 16. 点击 **全部应用** 按钮。\n- 17. 为报告创建一个简单的卡片视觉对象，显示 **最新订单日期**。\n\
  - 18. 将报告发布到 Power BI 服务。\n- 19. 在 Power BI 服务中打开发布报告所在的工作区。\n- 20. 打开数据集的 **设置**。\n\
  - 21. 如有必要，将数据源添加到任何网关集群。\n- 22. 在 Power BI 服务中打开发布报告所在的工作区。\n- 23. 点击数据集的 **立即刷新**\
  \ 图标。\n- 24. 打开数据集的 **设置**，查看 **刷新历史记录**。\n- 25. 等待数据集刷新，然后打开报告，验证 **最新订单日期** 现在是否为\
  \ **11/29/2013 12:00:00 AM**。\n\n## 工作原理...\n\n增量刷新在执行增量刷新时使用保留的参数名称 **RangeStart**\
  \ 和 **RangeEnd**。虽然这些参数在增量刷新配置期间初始设置，但之后由 Power BI 服务更新，以确定数据集中需要增量刷新的行。\n\n配置增量刷新的筛选行时，需要注意\
  \ **RangeStart** 和 **RangeEnd** 的两个条件不能都包含等于（=）子句，因为这可能导致重复数据。只将其中一个条件配置为包含等于（=）子句，以避免这种情况。\n\
  \n在服务中首次刷新数据时，Power BI 会按照 **增量刷新** 对话框中的 **存储行（其中列在最近...）** 设置刷新整个数据集。换句话说，在首次刷新配置了增量刷新的数据集时，刷新过程类似于对所有数据执行全量重新加载。除非有其他筛选器适用，否则存储期间内的所有行都会包含在数据集中。后续刷新仅按照\
  \ **刷新行（其中列在最近...）** 设置刷新新数据。\n\n务必记住，一旦配置了增量刷新，就无法再从服务中导出发送 Power BI 文件。因此，必须保留原始\
  \ Power BI Desktop 文件，以防需要进行更改。\n\n## 更多内容...\n\n**增量刷新** 对话框中有两个可选的增量刷新设置。这些可选设置如下：\n\
  \n- 检测数据变更\n- 仅刷新完整天数\n\n**检测数据变更** 设置可用于进一步优化增量刷新的数据刷新。此设置必须使用 **日期/时间** 类型的列，且该列不应与用于\
  \ **RangeStart** 和 **RangeEnd** 参数的列相同。Power BI 服务在刷新时会评估此列的最大值，如果该值自上次刷新以来未发生变化，则不会刷新数据集中的任何数据。\n\
  \n**仅刷新完整天数** 设置用于防止不完整的天被包含在数据刷新中。例如，如果刷新操作检测到某天不完整（例如在凌晨4点进行计划刷新），则该天的数据不会包含在刷新操作中。这对于只希望数据集中包含完整每日信息以供报告的组织来说非常有用。\n\
  \n\n\n\n\n## 另请参阅\n\n- Power BI 中的增量刷新：`https://bit.ly/3f3DSkM`\n- Power BI 中数据集的增量刷新：`https://bit.ly/3w10oSv`\n\
  \n## 结论\n\n本章的配方包含了提升 Power BI 数据集性能、可扩展性和可靠性的顶级数据建模、DAX 度量和 M 查询模式。这包括数据模型和度量的性能调优示例、错误处理，以及\
  \ M 查询的查询折叠示例，另外还包括有关 DAX 和 M 查询引擎的支持细节。下一章将全部关于使用 Power BI 服务、Teams 和移动设备部署和分发\
  \ Power BI 内容。\n\n## 12\n"
- "## 部署和分发 Power BI 内容\n\n迄今为止，本书的大部分内容都集中在个人 BI 专业人员使用 Power BI 创建数据模型、报表、仪表板和其他\
  \ BI 和系统资产上。然而，BI 的全部意义在于为业务提供洞察和信息。因此，对于任何 BI 项目来说，创建的数据和洞察都必须在整个组织中共享和分发都是成功的关键。\n\
  \n本章包含通过 Power BI 服务和 Power BI 移动应用程序部署和分发 Power BI 内容的详细示例和注意事项。这包括应用程序工作区和应用程序的创建和配置、采购和分配\
  \ Power BI Premium 容量、配置数据源和刷新计划，以及从 Power BI 移动应用程序中获得更大价值。此外，还涵盖了跨开发和生产环境分阶段部署以及多节点\
  \ Premium 容量部署等主题。\n\n在本章中，我们将介绍以下配方：\n\n- 为内容创建和协作做准备\n- 在环境之间管理内容\n- 与同事共享内容\n\
  - 配置工作区\n- 配置本地网关数据源连接\n- 发布应用程序\n\n## 部署和分发 Power BI 内容\n\n- 将报表发布到公共互联网\n- 启用移动体验\n\
  - 使用 Teams 分发内容\n\n在本章结束时，您将很好地了解如何部署和分发您的 Power BI 内容。\n\n### 技术要求\n\n完成本章中的配方需要以下内容：\n\
  \n- Power BI Desktop。\n- 安装了 AdventureWorksDW2019 数据库的 SQL Server。该数据库及其安装说明可在以下位置获取：http://bit.ly/20VQfG7。\n\
  - 本章的文件可从以下 GitHub 仓库下载：https://github.com/PacktPublishing/Microsoft-Power-BI-Cookbook-Second-Edition\n\
  \n### 为内容创建和协作做准备\n\nPower BI 协作环境可以有多种形式，从一小群 Power BI Pro 用户在单个应用程序工作区中相互创建和共享内容，到以许多只读用户通过\
  \ Power BI 应用程序访问 Power BI Premium 容量资源为特征的大规模企业 BI 场景。鉴于 Power BI Premium 提供的基于容量的定价模式的成本优势，以及它提供的增强性能和可扩展性功能，正确配置和管理这些资源非常重要。\n\
  \n本配方提供了与本章整体目的基本相关的两个流程：部署和分发 Power BI 内容。第一个流程强调了规划和管理 Power BI 部署中的几个关键问题和问题。第二个流程详细说明了\
  \ Power BI Premium 专用容量资源的配置以及将这些资源分配给特定部署工作负载的应用程序工作区。\n\n### 准备工作\n\nPower BI\
  \ 有五种主要的许可机制\n\n- Power BI Free\n- Power BI Pro\n- 专用容量（嵌入式、Premium）\n- 每用户 Premium\n\
  - 本地部署（Power BI Report Server）\n\nPower BI Free 提供的共享和分发功能极其有限（发布到网络），而 Power BI\
  \ Pro 和 Premium Per User 要求创建或使用 Power BI 内容的每个用户都必须获得许可。嵌入式和 Premium 等专用容量允许免费用户使用发布到嵌入式或\
  \ Premium 专用容量工作区的内容。本地部署通过 Power BI Report Server 获得许可，后者是 SQL Server Reporting\
  \ Services（SSRS）的超集。\n\n必须仔细审查每个部署选项相关的许可和功能。例如，Power BI 服务中的许多功能，如仪表板和 Q&A（自然语言查询）在本地\
  \ Power BI Report Server 中不可用。同样，某些 Power BI Premium SKU 专门用于将 Power BI 嵌入到应用程序中。有关\
  \ Power BI 许可选项的更完整介绍，请参阅本配方的“另请参阅”部分。\n\n### 如何操作...\n\n要实施本配方，请执行以下操作：\n\n1. 确定\
  \ Power BI 内容（数据集、报表和仪表板）将如何部署并被用户使用。\n   - 内容是否将部署到 Power BI 服务并通过应用程序和 Power BI\
  \ 移动应用程序访问？\n   - 内容是否将部署到 Power BI 服务但嵌入到业务应用程序中？\n   - 内容是否将部署到本地 Power BI 报表服务器并通过报表服务\
  \ Web 门户以及 Power BI 移动应用程序访问？\n\n对于混合部署，例如同时使用 Power BI 服务和嵌入，或使用 Power BI 服务和 Power\
  \ BI Report Server，请估算每个工作负载所需的资源，并评估合并许可模式和单独的专用许可。例如，如果使用 Power BI Premium P2\
  \ SKU 配置了 16 个虚拟核心，则 16 个单独的核心也可用于许可本地 Power BI Report Server。这种合并许可可能比单独许可 Power\
  \ BI Report Server 并支付额外的 Power BI Pro 许可更有利。\n\n## 部署和分发 Power BI 内容\n\n2. 根据他们在组织中的角色和需求识别或估算\
  \ Power BI Pro 和 Power BI Free 用户。\n   \n   - 用户是否会创建和发布内容（Power BI Pro）？\n   -\
  \ 用户是否只会使用内容并可选择为个人使用创建内容（Power BI Free）？\n\n通过“在 Excel 中分析”和 Power BI 服务实时连接连接到已发布的数据集是\
  \ Power BI Pro 功能，因此即使数据集分配给 Power BI Premium 容量，Power BI Free 用户也无法使用这些功能。然而，Power\
  \ BI Free 用户仍然可以查看和订阅 Premium 容量中的报表和仪表板，并且还可以将内容导出到 CSV 和 PowerPoint。\n\n3. 对于具有大量只读用户的更大部署，请估算所需的\
  \ Power BI Premium 资源。\n   \n   - 使用“另请参阅”部分中引用的 Power BI 专用容量负载评估工具作为起点。\n   -\
  \ 规划部署工作负载如何在 Premium 容量节点之间分配。\n   - 特定的工作负载（或也许是业务功能）是否将拥有自己的容量，还是单个更大的容量将支持多个或所有工作负载或团队？\n\
  \n如果 Power BI 数据集以导入模式作为支持报表和仪表板的主要数据存储选项，请考虑其内存使用情况相对于每个 Power BI Premium SKU 可用内存的情况。例如，P1\
  \ 容量节点目前可用 25 GB RAM，这可能不足以支持服务中存储的较大数据集（模型）并进行计划刷新。与 SSAS 多维数据集模型类似，应配置 2.5 倍的内存以支持处理和刷新、查询以及查询期间创建的临时内存结构。\n\
  \n4. 评估和规划数据建模工具（数据集）。\n   \n   - Power BI Desktop 是否将用于数据建模和报表开发，还是 Analysis Services\
  \ 将用于数据建模而 Power BI Desktop 仅用于报表？\n   - 这些新的语义模型将采用何种存储模式（导入、DirectQuery、复合）以及对所需内存有何影响？例如，聚合仅在\
  \ Power BI Premium 中可用，因此如果正确使用聚合，则需要配置的内存会显著减少。\n   - 是否需要对关系数据源或基础设施进行更改以支持性能？\n\
  \n在某些情况下，必须修改或增强关系数据源以支持足够的 DirectQuery 性能。这些增强措施因源而异，但可能包括索引（例如 SQL Server 中的列存储索引）、更大的计算和内存资源、非规范化和引用完整性。\n\
  \n\n\n\n\n如果 SSAS 在本地部署作为 Power BI 的数据源（通过本地数据网关），则利用 Azure ExpressRoute 为 Power\
  \ BI 租户的 Azure 数据中心创建专用连接可能是有益的。\n\n5. 规划 Power BI 项目的扩展和迁移，因为采用率和需求发生变化，并确定项目生命周期的关键点以及随着需求变化而迁移和扩展所需的功能。\n\
  \n此类的示例包括添加单独的 Power BI Premium 容量节点（扩展），更大的容量节点（纵向扩展），将 Power BI Desktop 数据集迁移到\
  \ SSAS 或 Azure Analysis Services，在 Dev、Test 和 Production Power BI 工作区和应用之间分阶段部署，将工作区移入和移出\
  \ Premium 容量，以及在团队之间转移内容所有权，例如从业务团队转移到企业 BI 团队。\n\n6. 为 Power BI 团队成员分配角色和职责。\n\n\
  - 数据集作者，包括源连接、检索查询、数据建模和度量开发\n- 报表作者，包括仪表板、移动优化的报表和仪表板，以及应用\n- 管理员，包括本地数据网关、Premium\
  \ 容量和租户设置\n\n7. 针对这些团队角色确定目标技能和知识。\n\n- 数据集作者应学习 Power BI 和 SSAS 的 DAX、M 和数据建模基础知识。\n\
  - 报表作者应了解或学习可视化标准、交互性和筛选，以及自定义视觉对象。\n- 管理员应研究用于本地网关监控的工作区、Premium 容量、Office 365\
  \ 审计日志和 Power BI 活动日志的监控工具和可用数据。\n\n报表作者通常是 IT 或 BI 组织之外的业务分析师，应定期查看 Power BI 月度更新中发布的新报表功能和近期报表功能。\n\
  \n8. 建立跨团队的协作流程。\n\n- 数据集作者应与数据源的所有者和主题专家协作。例如，任何对数据源模式或资源所做的更改都应进行沟通。\n- 报表作者应有权访问数据集文档并与数据集作者协作。例如，不适用于新报表的度量或维度应进行沟通。任何标准，例如企业\
  \ Power BI 报表主题或字体，都应记录下来。\n- 管理员应与 Office 365 全局管理员、数据治理和安全团队协作。例如，管理员应确认 Power\
  \ BI 租户设置与组织策略保持一致。此外，管理员可以请求或采购安全组来管理 Power BI。\n- 规划常见支持场景、新项目请求和增强请求。例如，创建自动分配\
  \ Power BI 许可证和安全组成员身份的流程。此外，计划 Power BI 内容消费者的提问或问题。\n\n任何具有显著规模的成功 Power BI 部署都需要规划、团队和跨团队协作、业务流程、主动管理以及有针对性的技能和资源。本食谱中的步骤仅确定了几个基本主题——实际流程始终特定于组织及其部署目标、策略以及可用的技能和资源。\n\
  \n## There's more...\n\nPower BI Premium 被引入以支持企业的大规模 Power BI 部署。Power BI Premium\
  \ 从其核心来看，是为给定组织配置和根据其自身用例和策略使用的专用硬件资源池。虽然其他旧版 Microsoft BI 技术（如 Analysis Services\
  \ 和 Reporting Services）将继续得到支持，但所有新功能和功能，例如复合模型和聚合，仅对 Power BI Premium 客户可用。此外，Power\
  \ BI Premium 容量支持包括在应用程序中嵌入内容以及使用 Power BI 公共云服务和本地部署的 Power BI 报表服务器的组合等新场景。或许对于大型部署而言最重要的是，Power\
  \ BI Premium 避免了为每个用户购买许可证的需求，因为只读用户可以在没有专业许可证的情况下访问 Power BI Premium 内容。此外，作为托管云服务，资源可以通过简单的纵向扩展和横向扩展选项与组织不断变化的需求保持一致。\n\
  \n> “在许多情况下，Power BI Premium 的构建是为了应对大规模部署 Power BI 的挑战，您拥有随着时间推移而增长的更大数据模型，并且有更多用户访问内容。”\n\
  > \n> - Adam Wilson，Power BI 集团项目经理\n\n在此示例中，组织中特定于职能区域的工作区与两个单独的 Power BI Premium\
  \ 容量节点相关联。\n\n一个额外的 workspace 和与所有帐户关联的 My Workspace（Power BI Free 和 Pro）包含在共享容量中——Power\
  \ BI 服务的多租户环境。配置此类环境的流程如下：\n\n1. Microsoft 365 全局管理员或计费管理员在 **Microsoft 365 管理中心**\
  \ 中购买所需的 Pro 和 Free 许可证。\n2. 根据规划阶段确定的角色将这些许可证分配给用户。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_545_0.png)\n\
  \n图 12.1：Microsoft 365 管理中心 – 购买服务\n\n3. 通过向下滚动、单击 **Power BI Premium P2** 标题下的\
  \ **详细信息** 按钮，然后单击 **购买** 按钮来购买 Power BI Premium P2 容量节点。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_545_1.png)\n\
  \n图 12.2：购买 Power BI Premium P2 容量\n\n## 部署和分发 Power BI 内容\n\n4. 购买 Power BI Premium\
  \ P3 容量。\n5. 确认新的 Power BI Premium 订阅出现在 **您的产品** 窗口中，与已购买的 Power BI Pro 和 Power\
  \ BI Free 许可证一起出现。\n6. Microsoft 365 全局管理员或 Power BI 服务管理员打开 Power BI 管理门户。在 Power\
  \ BI 服务中，单击右上角的齿轮图标并选择 **管理门户**。\n7. 从管理门户中选择 **容量设置**，然后单击 **设置新容量**。\n8. 为容量提供描述性名称并将容量管理员角色分配给一个或多个用户。\n\
  9. 为容量授予特定 Power BI Pro 用户或组的 workspace 分配权限。\n\n全局管理员和 Power BI 服务管理员默认是容量管理员，但容量管理员角色可以分配给不是\
  \ Power BI 服务管理员的用户。容量管理员角色权限特定于给定的容量。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_546_0.png)\n\
  \n图 12.3：容量设置中的用户权限\n\n10. 设置购买的另一个容量，分配其容量管理员，并授予其 workspace 分配权限。\n11. 具有 workspace\
  \ 分配权限的 Power BI Pro 用户可以在 Power BI 服务中创建 Premium 工作区。\n\n在 Power BI 管理门户中，容量管理员可以为\
  \ Premium 容量分配或移除工作区，以及将用户列入白名单，以便将给定用户的所有工作区分配给 Premium 容量。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_547_0.png)\n\
  \n图 12.4：Power BI Premium 容量分配给工作区\n\n在此示例中，三个工作区（销售、营销和财务）分配给名为 Enterprise BI（P3）的\
  \ Power BI Premium 容量。此外，该容量还支持自定义应用程序的嵌入式报表需求。选择了更大的 P3（32 核，100 GB RAM）容量，因为这些工作区的查询流量更高，并且需要更大的数据集大小。\n\
  \n供应链和运营工作区分配给 P2 容量。在这种情况下，尽管工作负载小于 P3 容量，但这些组仍需要与许多免费用户共享内容。最后，一个小型 IT 用户组（IT\
  \ Admin）的工作区使用 Power BI Pro 许可证维护在共享容量中。该工作区不需要 Power BI Premium，因为向免费用户分发的需求最小，并且数据集较小，刷新计划相对不频繁。\n\
  \n横向扩展 Power BI Premium 涉及在多个容量之间分发已配置的容量（v-core）。例如，作为 P3 容量节点的一部分购买的 32 个 v-core\
  \ 可以选择拆分为三个单独的容量：两个各 8 个 v-core 的 P1 容量和一个 16 个 v-core 的 P2 容量（8 + 8 + 16 = 32）。将\
  \ v-core 分布到不同的 Premium 容量中的这种能力称为 v-core 池。\n\nPremium 容量的原地扩展涉及根据食谱在 Microsoft\
  \ 365 管理中心购买额外的容量节点，然后调整给定 Premium 容量的容量大小以反映额外的核心：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_547_1.png)\n\
  \n图 12.5：Power BI 管理门户中容量的可用 v-core\n\n\n\n\n例如，如果确定P1容量不足以满足所需的性能或可扩展性，可以购买额外的P1容量。此时，在购买了两个各8个v-core的P1容量后，可以在Power\
  \ BI管理门户中为原始容量设置P2容量大小（16个v-core）。这样就可以根据需求变化快速、轻松地逐步扩展。\n\n## 另请参阅\n\n- Power BI许可图解：https://bit.ly/2R4xYYN\n\
  - 什么是Microsoft Power BI Premium？：https://bit.ly/3eyrpq8\n- 规划Power BI企业部署白皮书：http://bit.ly/2wBGPRJ\n\
  - Power BI嵌入式分析中的容量和SKU：https://bit.ly/2REM437\n- 容量规划：https://bit.ly/3tG66aR\n\n\
  ## 管理环境之间的内容\n\n熟悉项目生命周期、源代码控制系统以及管理开发、测试和生产环境的公司BI和IT团队，也应考虑将这些流程应用于Power BI部署。Power\
  \ BI Desktop本身不直接与标准的源代码控制系统（如Azure DevOps）集成。然而，Power BI文件可以存储在SharePoint Online团队网站和OneDrive\
  \ for Business中，以提供版本历史记录可见性、本地设备与云服务之间的同步、还原功能等。在Power BI服务中，可以创建独立的开发、测试和生产工作区及其对应的应用，以支持分阶段部署。利用这些工具和功能，Power\
  \ BI团队可以高效管理工作流，向用户交付一致、高质量的内容。\n\n本方案介绍了使用Power BI部署管道部署内容的方法，这是一项Premium功能。为没有Premium的用户提供的替代方法包含在“更多内容”部分中。\n\
  \n## 准备工作\n\n为准备本方案，请按照以下步骤操作：\n\n- 1. 在Power BI服务中，创建一个新的Premium工作区。\n- 2. 在Power\
  \ BI Desktop中打开包含查询参数的报告，并将报告发布到第1步创建的Premium工作区。查询参数应设置为`Text`。\n\n同样，本方案需要Power\
  \ BI Premium容量。\n\n## 如何操作...\n\n创建和使用Power BI部署管道相对容易。要创建和使用管道，请按照以下步骤操作：\n\n-\
  \ 1. 在Power BI服务中，从左侧导航窗格中选择**部署管道**。\n- 2. 选择**创建管道**。\n- 3. 提供**管道名称**，并单击**创建**按钮。\n\
  - 4. 单击**分配工作区**按钮。\n- 5. 选择第1步创建的Premium工作区，将该工作区的部署阶段分配为**开发**，并单击**分配**按钮。\n\n\
  ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_549_0.png)\n\n图12.6：将工作区分配到部署管道\n\n6. 在**开发**阶段下，单击**部署到测试**按钮。这将创建一个新工作区，并将**开发**中的内容部署到此工作区。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_549_1.png)\n\n图12.7：Power BI部署管道\n\n\
  - 7. 内容部署到**测试**后，单击**测试**阶段标题中的闪电图标。\n- 8. 单击**数据集**标题下的数据集。\n- 9. 展开**参数规则**，并单击**添加规则**按钮。\n\
  - 10. 在**对于此参数**标题下，选择一个参数。\n- 11. 在**应用此值**下，编辑参数并单击**保存**按钮。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_550_0.png)\n\
  \n图12.8：Power BI部署管道参数规则\n\n现在，每次将数据集部署到测试阶段时，该参数将指向测试SQL Server，而不是开发SQL Server。有关Power\
  \ BI管道以及如何在Power BI部署场景中使用它们的更多信息，请参阅本方案的“另请参阅”部分。\n\n## 工作原理...\n\nPower BI部署管道允许内容在开发、测试和生产部署阶段之间轻松移动。这些部署阶段与管道自动创建的各个工作区相关联。当不同阶段中的内容发生变化时，可以将该内容部署到先前阶段或后续阶段。此外，可以在测试和生产阶段内定义规则，更改数据源或参数以指向相应的源系统。\n\
  \n开发阶段被设计为报告开发的工作区域。测试阶段是已开发内容可以与业务用户共享以进行用户验收测试的地方。最后，生产阶段是最终产品呈现给业务的地方。\n\n##\
  \ 更多内容...\n\n如果你没有Power BI Premium，可以使用Power BI REST API在工作区之间部署内容。此外，ALM工具包允许你使用开源的BISM\
  \ Normalizer工具集来比较和合并两个Analysis Services表格模型。BISM代表商业智能语义模型（Business Intelligence\
  \ Semantic Model），是微软为报表、分析、记分卡和仪表板定义的一种模型。\n\n## 准备工作\n\n确认仪表板所有者以及接收者或使用者均具有Power\
  \ BI Pro许可证。如果接收者没有Power BI Pro许可证，请检查仪表板是否包含在已分配给高级容量的工作区中。共享仪表板需要Pro许可证或Premium容量。Power\
  \ BI Pro用户无法与Power BI免费用户共享托管在Power BI共享容量中的仪表板。\n\n在Power BI管理门户中为组织或特定安全组启用外部共享功能。共享仪表板的所有者可以允许接收者重新共享仪表板，但任何与外部用户共享的仪表板都无法再次共享。此外，仪表板所有者可以删除用户对仪表板的访问权限以及重新共享能力。与本章后面描述的发布到Web功能不同，外部共享可以限于特定安全组或从特定安全组中排除。\n\
  \n在此示例中，BI团队的Jennifer负责与加拿大销售团队的Brett以及组织外部的另一个人Jack共享仪表板。Brett将需要能够与他的团队的几个成员共享仪表板。\n\
  \n## 如何操作...\n\n要实现本方案，请执行以下操作：\n\n- 1. 在Power BI服务中创建一个专用工作区。\n- 2. 将工作区的隐私级别设置为允许成员编辑内容，并向工作区添加团队成员。\n\
  - 3. 在Power BI Desktop中为**加拿大销售团队**创建安全角色。\n- 4. 将Power BI Desktop文件发布到工作区，并将成员或安全组添加到**加拿大销售团队**角色。\n\
  \n通过使用安全角色，包含其他国家/地区销售数据的现有Power BI Sales数据集可用于仪表板。Brett将被允许共享仪表板，但RLS将阻止他和通过安全组映射到安全角色的那些人查看其他国家/地区的销售数据。有关配置RLS的详细信息，请参阅*第8章，在Power\
  \ BI中实现基于用户的动态可见性*。\n\n- 5. 创建与工作区中已发布数据集具有实时连接的新Power BI Desktop报告文件。\n- 6. 在每个文件中构建基本可视化，并发布这些报告。\n\
  - 7. 在Power BI服务中，创建一个新仪表板**加拿大销售仪表板**，从报告中固定视觉对象，并调整布局。\n\n8. 在Power BI服务工作区中，单击加拿大销售仪表板上的“共享”。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_553_0.png)\n\n图12.9：共享加拿大销售仪表板\n\n9.\
  \ 添加外部用户Brett，并可选地在共享仪表板表单上添加消息。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_553_1.png)\n\
  \n图12.10：Power BI服务中的共享仪表板表单\n\nPower BI将会检测并尝试在“授予访问权限”输入框中输入电子邮件地址时自动补全。此外，尽管共享仪表板有时被称为点对点共享，但可以粘贴电子邮件地址列表，并且支持所有常见的组实体，包括通讯组、安全组和Office\
  \ 365组。如图所示，如果输入了组织外部的用户，将出现警告。\n\n10. 在此示例中，在消息下方保持启用“允许接收者共享此仪表板”选项。单击“授予访问权限”。\n\
  \n如果在共享表单上保持启用此选项，接收者将收到电子邮件通知以及Power BI中的通知。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_553_2.png)\n\
  \n图12.11：Power BI服务中仪表板接收者的通知中心\n\n\n\n\n对于接收者来说，仪表板会出现在 **与我共享** 选项卡中。如果仪表板所有者启用了该选项（并且如果用户是组织内部成员），则与他人共享仪表板的选项将启用。用户将能够收藏仪表板、从\
  \ Power BI 移动应用访问它，并与其内容交互（例如筛选选择），但不能编辑报表或仪表板。\n\n### 工作原理...\n\n内容应始终从工作区分发，而不是从\
  \ **我的工作区** 分发。即使在相对非正式的场景（例如与一个用户共享仪表板）中，从 **我的工作区** 共享仪表板也会使单个用户（本例中为 Jennifer）承担维护内容的责任。从工作区与\
  \ BI 团队的多个成员共享内容，可消除 Jennifer 无法维护内容的风险，并受益于微软持续对工作区的管理和治理功能进行的投入。\n\n拥有编辑权限的工作区成员可以禁用仪表板的二次共享，并完全停止共享。要编辑权限，请打开仪表板，单击\
  \ **共享**，单击省略号 (...)，然后选择 **管理权限**，以查看并视需要修改当前访问权限。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_554_0.png)\n\
  \n图 12.12：共享仪表板，管理权限\n\n在 **管理权限** 窗格中，单击底部的 **高级**，然后选择 **直接访问** 选项卡。如图 12.13 所示，您可以在此添加用户、编辑权限和删除访问权限。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_554_1.png)\n\n图 12.13：共享和访问选项\n\n###\
  \ 更多内容...\n\n在 Power BI 服务中，共享报表与共享仪表板的操作在用户界面方面完全相同。唯一区别在于，该过程从服务中的报表页开始，而不是仪表板。\n\
  \n还可以通过提供数据集的特定读取访问权限来共享数据集。方法是单击数据集旁边的三个垂直点，这些点可位于左侧导航窗格中，也可在查看工作区的 **数据集 + 数据流**\
  \ 窗格时出现。\n\n### 另请参阅\n\n- 与同事和其他人共享 Power BI 报表和仪表板：https://bit.ly/3f991lw\n- 在\
  \ Power BI 中协作和共享的方式：https://bit.ly/3tyIuMv\n\n## 配置工作区\n\n工作区（以前称为应用工作区）是 Power\
  \ BI 服务中供 Power BI Pro 用户开发内容的共享区域。工作区中包含的数据集、报表和仪表板可以发布为 Power BI 应用以分发给用户组。此外，工作区可以分配给专用硬件的\
  \ Power BI Premium 容量，使所有用户（无论许可证如何）都能使用已发布的应用，并提供一致的性能和更大的可扩展性。此外，工作区与已发布的应用保持一对一的映射关系，使工作区的成员和管理员能够在发布应用更新之前暂存和测试迭代。\n\
  \n阅读各种相关历史文档时，了解工作区的历史会有所助益。当 Power BI 首次发布时，该服务包含了工作区的概念。然而，这些工作区与 Office 365 组绑定，并存在各种限制。Microsoft\
  \ 发布了组工作区的更新，并把这些新工作区命名为工作区。传统工作区被标记为 **经典工作区**。如今，由于经典工作区几乎已被淘汰，所有新工作区都是工作区，现简称为\
  \ **工作区**。虽然这可能看起来有点像“伊斯坦布尔，不是君士坦丁堡”那样令人困惑，但只需明白，在阅读博客文章和其他提及工作区的信息时，这仅指 Power BI\
  \ 服务中的现代工作区体验。\n\n在本节中，将创建并配置一个工作区。在本节及其辅助部分中，确定了所有主要考虑因素，包括工作区的范围或内容，以及将工作区分配到高级容量。\n\
  \n### 准备工作\n\n要准备本节内容，请按照以下步骤操作：\n\n1. 确认工作区的管理员和成员可以使用 Power BI Pro 许可证。\n2. 确保工作区符合组织的\
  \ Power BI 内容分发策略或标准。\n3. 如果已预配高级容量，但未批量分配给组织的所有工作区，请确定新工作区是否将托管在高级容量中。\n4. 如果已预配高级容量并授权给新工作区，请评估高级容量的当前利用率，并确定新应用部署所产生数据集和用户查询的预期工作负载是否需要更大或独立的容量。此外，确认工作区管理员具有工作区分配权限，或按照“具体操作方法...”中的第一步在\
  \ Power BI 管理门户中分配此权限。\n5. 单击 Power BI 服务右上角的问号 (?) 图标，然后选择“关于 Power BI”，以检索 Power\
  \ BI 租户的 UTC 偏移量。UTC 偏移量如图 12.14 所示，本例中为 -0400：\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_556_0.png)\n\
  \n    图 12.14：Power BI 租户的 UTC 偏移量\n\n6. 从 Power BI 服务管理门户的容量设置中检索高级容量 ID。\n7. 在容量设置中，单击所需容量“操作”下的齿轮图标，并记下容量\
  \ ID。\n8. 在 Power BI 服务的工作区中，从屏幕左下角选择“获取数据”。\n9. 在“服务”部分中，单击“获取”按钮。\n10. 搜索“Premium”，并选择“Premium\
  \ Gen2 容量利用率指标”应用。\n11. 在模板应用的 AppSource 页面上，单击“立即获取”按钮，如图 12.15 所示：\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_557_0.png)\n\
  \n    图 12.15：AppSource 中的 Premium Gen2 容量利用率指标应用\n\n12. 填写联系信息，接受条款和条件，并单击“继续”按钮。\n\
  \n13. 单击“安装到新工作区”单选按钮，提供工作区名称，然后点击“安装”按钮以安装应用。\n\n以上即完成本节准备的步骤。\n\n### 具体操作方法...\n\
  \n要实现本节内容，请执行以下操作：\n\n1. 打开新工作区，并从 Power BI 服务的导航窗格中选择“应用”。\n2. 单击“Gen2 利用率指标”应用。\n\
  3. 在屏幕顶部，单击“连接数据”，如图 12.16 所示：\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_557_1.png)\n\
  \n    图 12.16：Gen2 利用率指标中的“连接数据”提示\n\n4. 输入应用要求的 **容量 ID** 和其他信息，然后点击 **下一步** 按钮。\n\
  \n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_558_0.png)\n\n    图 12.17：连接到 Gen2\
  \ 利用率指标\n\n5. 在下一个屏幕上，选择 **登录并连接**，然后登录到 Power BI 服务。\n\n6. 通过 CPU、内存和查询的使用度量查看容量的近期性能。\n\
  \n7. 假设容量指标正常，请单击应用左下角的 **返回** 链接退出应用。\n\n8. 单击 **工作区** 旁边的箭头，然后点击 **创建工作区**。\n\n\
  \    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_558_1.png)\n\n    图 12.18：在 Power\
  \ BI 服务中创建工作区\n\n分配到高级容量的工作区在 Power BI 服务中会以菱形图标标识。\n\n9. 提供工作区名称，展开“高级”部分，选择“按容量高级版”的许可证模式，并选择一个容量。\n\
  \n**创建工作区**\n\n| 字段 | 值 |\n| --- | --- |\n| 联系人列表 | |\n| 工作区管理员 | 特定用户和组 / 输入用户和组\
  \ |\n| 工作区 OneDrive | （可选） |\n| 许可证模式 | Pro / 按用户高级版 / 按容量高级版 / 嵌入式 |\n| 选择容量 |\
  \ P1 MVP 演示 请勿更改任何内容 - 美国东部 2 |\n| 默认存储格式 | 小型数据集存储格式 |\n| 操作 | 保存 / 取消 |\n\n图 12.19：创建高级工作区\n\
  \n10. 单击“保存”按钮以创建工作区。\n\n11. 在工作区中，单击标题中的“访问”链接以添加工作区成员。\n\n现在，工作区成员可以发布数据集和报表，并创建仪表板以通过应用分发。从技术上讲，可以将成员添加到仅查看组，并将开发人员分配为工作区管理员角色，以便他们可以编辑内容。不建议使用这种协作方法，因为与共享仪表板一样，仅查看成员将立即看到所有更改。从工作区发布的应用提供了暂存部署，是将内容分发给只读成员的建议解决方案。\n\
  \n\n\n\n## 另请参阅\n\n- ▶ 管理 Power BI Premium： http://bit.ly/2vq8wHe\n- ▶ 监控 Power\
  \ BI Premium 容量： https://bit.ly/3xZqp6f\n\n## 配置本地网关数据连接\n\n利用 Power BI 服务和移动应用程序在所有设备上提供丰富的集成仪表板和报告访问的承诺，需要对数据源和使用的数据集进行周到的配置。对于许多组织而言，主要的商业智能数据源托管在本地，因此，除非\
  \ Power BI 报表专门部署到本地 Power BI Report Server，否则需要本地数据网关来安全地促进 Power BI 服务与本地系统之间查询和数据的传输。此外，通常支持许多报表和仪表板的数据集必须配置为使用本地数据网关，以便进行计划刷新以将数据导入\
  \ Power BI，或支持从 Power BI 生成的 DirectQuery 和实时连接查询。\n\n本食谱包含两个配置已发布数据集的数据源和计划刷新的示例。第一个示例为导入模式\
  \ Power BI 数据集配置了两个本地数据源（SQL Server 和 Excel）并安排每日刷新。第二个示例为 DirectQuery Power BI\
  \ 数据集配置了单独的本地 SQL Server 数据库，并设置了 15 分钟的仪表板磁贴刷新计划。\n\n## 准备工作\n\n为准备本食谱，请按以下步骤操作：\n\
  \n- 1. 下载、安装并配置本地数据网关，如第 1 章《配置 Power BI 工具》中创建本地数据网关所述。\n- 2. 成为本地数据网关的管理员。\n\n\
  ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_561_0.png)\n\n## 部署和分发 Power BI 内容\n\n\
  强烈建议为每个安装的网关至少设置两位管理员，以提供冗余和备份管理功能。\n\n## 如何操作...\n\n在本示例中，已使用 Power BI Desktop\
  \ 创建了一个导入模式数据集，以从两个本地数据源检索，分别是 SQL Server 数据库和 Excel 文件。要实施本食谱，请执行以下操作：\n\n- 1.\
  \ 确定 Power BI Desktop 文件中使用的服务器名称和数据库名称。\n- 2. 确定 Excel 文件的完整路径。\n- 3. 在 Power BI\
  \ 服务中，点击右上角的齿轮图标并选择 **管理网关**。\n- 4. 从 **管理网关** 界面，点击 **添加数据源** 并选择 **SQL Server**。\n\
  - 5. 提供一个不会与其他源冲突的直观源名称，并输入服务器和数据库名称。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_562_0.png)\n\
  \n图 12.22：添加 SQL Server 数据库作为本地数据网关的源\n\n网关的服务器和数据库名称必须与 Power BI 数据集中使用的名称完全匹配。\n\
  \n如果为网关配置 SSAS 数据源（数据源类型 = 分析服务），请确保使用的凭据也是给定 SSAS 实例的 SSAS 服务器管理员。服务器管理员凭据用于建立连接，但每次用户从\
  \ Power BI 与 SSAS 数据源交互时，其 UPN（用户主体名称）都会通过\n\nEffectiveUserName 连接属性传递给服务器。这允许在\
  \ SSAS 数据库中定义的 RLS 角色应用于 Power BI 用户。\n\n- 6. 在 **高级设置** 下，检查源是否使用适当的隐私级别，例如组织或私有。\n\
  - 7. 点击 **添加**，然后通过 **用户** 选项卡添加有权使用此网关访问此数据源的用户。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_563_0.png)\n\
  \n图 12.23：为本地数据网关成功设置数据源\n\n- 8. 使用文件数据源类型为 Excel 文件添加另一个数据源。\n- 9. 与 SQL Server\
  \ 数据源一样，通过 **用户** 页面为此网关和此数据源授权用户。\n- 10. 将导入模式 Power BI Desktop 文件（数据集）发布到 Power\
  \ BI 服务的工作区。\n- 11. 访问工作区并从 **数据集 + 数据流** 列表中，点击数据集的 **计划刷新** 图标。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_563_1.png)\n\
  \n图 12.24：Power BI 服务中已发布数据集可用的操作\n\n- 12. 展开 **网关连接** 部分。\n\n如果满足以下三个条件，网关将作为数据刷新的选项出现：\n\
  \n- - ☐ 用户列在网关中数据源的 **用户** 页面上\n- - ☐ 为网关在 Power BI 服务中配置的服务器和数据库名称与 Power BI Desktop\
  \ 文件中使用的名称匹配\n- - ☐ 数据集使用的每个数据源都已配置为网关的数据源\n\n13. 在本数据集包含的数据源部分，使用映射到下拉菜单选择已配置的网关数据源连接。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_564_0.png)\n\n图 12.25：将数据源与 Power BI\
  \ 网关数据连接关联\n\n14. 点击应用按钮将数据源连接到网关。\n\n15. 现在展开计划刷新部分。\n\n16. 点击添加另一个时间链接以添加刷新的计划时间。\n\
  \n17. 添加完刷新时间后，点击应用按钮。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_564_1.png)\n\n\
  图 12.26：数据集的计划刷新\n\n您的数据集现在已安排刷新。\n\n## 其工作原理...\n\n对于共享容量，无法保证计划刷新会在其计划的确切时间发生，例如本示例中的凌晨\
  \ 5:00。实际刷新可能在 Power BI 服务中计划时间后长达 20-30 分钟进行。\n\n仪表板磁贴使用的数据缓存会在导入模式数据集的刷新操作后更新（或手动更新）。Power\
  \ BI 服务还会缓存报表可视化的数据，并在数据集刷新时更新这些缓存。仪表板磁贴可以在 Power BI 服务中通过 **刷新可视化** 菜单项手动刷新（右上角，圆形箭头图标）。同样，报表也可以从\
  \ Power BI 服务手动刷新，但这仅与 DirectQuery 和 SSAS 实时连接相关；这*不会*启动导入模式数据集的刷新。\n\n导入模式数据集可以通过\
  \ Power BI 服务中的计划或通过 REST API 刷新。Power BI 数据刷新 API 允许 BI 团队以编程方式触发 Power BI 服务中的刷新操作。\n\
  \n例如，可以向现有的夜间（或更频繁）数据仓库或 ETL 流程添加一个步骤，以启动使用此数据源的 Power BI 数据集的刷新。这允许 Power BI 服务中的仪表板和报表尽可能快地反映数据源的最新成功刷新。换句话说，源系统刷新与\
  \ Power BI 数据集计划刷新之间的差距或延迟可以减少到在 Power BI 服务中刷新数据集所需的时间。\n\n要为 Power BI 服务中的数据集触发刷新，只需发出以下\
  \ HTTP 请求：\n\n```\nPOST https://api.powerbi.com/v1.0/myorg/groups/{group_id}/datasets/{dataset_id}/refreshes\n\
  ```\n\n请参阅本食谱 *另请参阅* 部分中的 Power BI REST API 身份验证文档和 Power BI REST API 参考。\n\n##\
  \ 还有更多...\n\n在本示例中，基于单独的本地 SQL Server 数据库的 Power BI Desktop 文件（数据集）在 DirectQuery\
  \ 模式下必须部署到 Power BI 服务。目的是使基于此数据集的仪表板尽可能保持最新。要实施本食谱，请执行以下操作：\n\n- 1. 与导入模式数据集一样，将\
  \ SQL Server 数据库添加为网关的数据源。\n- 2. 将用户分配给此数据源和网关。\n\n\n\n\n\n## 部署和分发 Power BI 内容\n\

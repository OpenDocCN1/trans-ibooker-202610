  \ 中的 SQL Server 连接信息\n\n13. 配置**获取行 (V2)** 步骤：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_620_1.png)\n\
  \n图 13.39：在 Power Automate 中配置 SQL Server 获取行 (V2) 步骤\n\n+   14. 单击**新建步骤**按钮。\n\

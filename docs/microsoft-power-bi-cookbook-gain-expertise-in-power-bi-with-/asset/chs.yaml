  \n### 结论\n\nPower BI 报表是 Power BI 中仪表板、数据探索以及内容协作和分发的基础。Power BI Desktop 提供了丰富的数据可视化功能和选项，使你能够在各种设备上构建高度针对性强且用户友好的报表。在本章中，我们开发并描述了最基本的报表视觉对象和设计概念。此外，还提供了相关指导，以增强和控制用户与\
  \ Power BI 报表交互以及在 Windows 和移动设备上使用这些报表时的体验。\n\n## 在服务中工作\n\n> “仪表板实际上是一个内容聚合器。它让你能够将许多不同的数据源汇集到一个地方，从而在一个仪表板上全面了解你的业务。”\n\
  >\n> —— Adam Wilson，Power BI 服务组项目主管\n\nPower BI 仪表板是在 Power BI 服务中创建的磁贴集合，代表一个或多个\
  \ Power BI 报表中的视觉对象，也可以包含其他来源（如 Excel 和 SQL Server Reporting Services（SSRS））的视觉对象。仪表板最适合用于以视觉和移动优化布局集中展示关键绩效指标（KPI）、度量值和趋势。此外，仪表板还可以作为通向其他仪表板或报表的入口，并通过\
  \ URL 链接、流式数据、图像、Web 内容以及交互性得到进一步增强。\n\n在本章中，我们将构建 Power BI 仪表板，以提供对关键度量值和高影响力业务活动的直观、一目了然的监控。本章还涵盖了仪表板的独特功能，例如\
  \ Q&A 自然语言查询、数据警报，以及集成其他报表类型（如 Excel 和 SSRS）。最后，还介绍了如何创建其他内容对象，例如流式数据集和数据流。\n\n\
  在本章中，我们将介绍以下方案：\n\n- 构建仪表板\n- 为 Q&A 做准备\n- 添加警报和订阅\n- 从 Excel 和 SSRS 部署内容\n- 流式数据集\n\
  - 创作数据流\n\n\n\n\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_263_0.png)\n\nFigure\
  \ 5.1: 北美销售仪表板结构：4 个报表和 1 个数据集\n\n## Getting Ready\n\n为准备本配方，请按以下步骤操作：\n\n- 1. 登录\
  \ Power BI 服务。\n- 2. 在左侧导航窗格中单击工作区，并在弹出菜单底部选择创建工作区。如果无法创建工作区，请咨询您的 Power BI 管理员，因为他们可能已禁用此选项。\n\
  - 3. 在创建工作区对话框中，输入工作区名称并单击保存。\n- 4. 在中央区域，单击添加内容。\n- 5. 在获取数据对话框中，单击文件旁的获取按钮。\n\n\
  ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_263_1.png)\n\nFigure 5.2: 创建工作区\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_263_2.png)\n\
  \nFigure 5.3: 获取数据，文件\n\n- 6. 选择 **本地文件**。\n- 7. 选择 CH5_R1_SalesAndFinanceDataset.pbix\
  \ 文件并单击 **打开**。\n- 8. 在 Power BI Desktop 中打开 CH5_R1_RegionMonthlyReport.pbix 文件。\n\
  - 9. 如有必要登录到 Power BI 服务，并在 **无法连接** 对话框中选择 **编辑**。如果收到错误，请联系管理员以允许连接到实时数据集。\n-\
  \ 10. 在 **选择数据集创建报表** 页面，选择 **CH5_R1_SalesAndFinanceDataset**，然后单击 **创建** 按钮。\n\
  - 11. 在 *步骤 3* 创建的 **工作区** 中 **保存** 并 **发布** 报表到服务。\n- 12. 对 CH5_R1_CountryMonthlyReport.pbix\
  \ 和 CH5_R1_MarginAnalysisReport.pbix 重复 *步骤 8、9、10 和 11*。\n\n如果无法在 Power BI 服务中创建\
  \ **工作区**，您可以使用 **我的工作区** 替代。完成这些步骤后，报表都已与数据集 CH5_R1_SalesAndFinanceDataset 建立实时连接。\n\
  \n## How to Build a Dashboard\n\n要实现本配方，请使用以下步骤：\n\n- 1. 在 Power BI 服务中，选择本配方 *入门*\
  \ 部分创建的工作区。\n- 2. 在中央区域，单击 **新建** 然后选择 **仪表板**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_264_0.png)\n\
  \nFigure 5.4: 创建新仪表板\n\n- 3. 在 **创建仪表板** 对话框中，为 **仪表板名称** 输入 **北美销售** 然后单击 **创建**。\n\
  - 4. 创建空白仪表板；单击左侧导航窗格中的工作区并注意 **北美销售** 仪表板显示在列表中。\n- 5. 在服务中打开 **CH5_R1_RegionMonthlyReport**\
  \ 报表并导航到 **北美** 页面。\n\n6. 将鼠标悬停在月度互联网销售额 KPI 可视化上并单击固定视觉图标。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_265_0.png)\n\
  \nFigure 5.5: 固定视觉对象\n\n7. 在固定到仪表板对话框中，选择现有仪表板，选择北美销售，然后单击固定按钮。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_265_1.png)\n\
  \nFigure 5.6: 固定到仪表板\n\n- 8. 将月度互联网利润率 % KPI 可视化固定到北美销售仪表板。\n- 9. 在服务中打开 CH5_R1_MarginAnalysisReport\
  \ 报表。\n- 10. 在销售组切片器中，选择北美。\n- 11. 在日历月份切片器中，选择 2013-12、2013-11、2013-10、2013-09、2013-08\
  \ 和 2013-07。\n- 12. 将净销售额与去年同期  clustered 柱状图可视化固定到北美销售仪表板。\n- 13. 在服务中打开 CH5_R1_CustomerActivityReport\
  \ 报表。\n- 14. 在销售组切片器中，选择北美。\n- 15. 在日历月份切片器中，选择 2013-12、2013-11、2013-10、2013-09、2013-08\
  \ 和 2013-07。\n- 16. 将月度客户 KPI 可视化固定到北美销售仪表板。\n\n- 17. 将年初至今净销售额与去年同期仪表可视化固定到北美销售仪表板。\n\
  - 18. 将按区域客户计数堆积柱状图可视化固定到北美销售仪表板。\n- 19. 将按区域年初至今净销售额 clustered 条形图可视化固定到北美销售仪表板。\n\
  - 20. 在服务中打开 CH5_R1_CountryMonthlyReport 报表。\n- 21. 导航到美国报表页面。\n- 22. 将填充地图可视化固定到北美销售仪表板。\n\
  - 23. 导航到加拿大报表页面。\n- 24. 将填充地图可视化固定到北美销售仪表板。\n- 25. 在服务中打开北美销售仪表板。\n- 26. 移动并调整仪表板磁贴大小，使最重要的视觉对象位于左上角。\n\
  - 27. 在美国的填充地图上，将鼠标悬停在磁贴上并从右上角选择省略号 (...)。\n- 28. 选择编辑详细信息。\n- 29. 编辑标题为互联网净销售额按州，删除副标题文本，然后单击应用。\n\
  - 30. 对加拿大地图重复步骤 27 到 29，使用互联网净销售额按省作为标题。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_266_0.png)\n\
  \nFigure 5.7: 北美销售仪表板\n\n仪表板提供了对北美销售团队最重要的度量的概览。您可以通过单击仪表板磁贴访问任意四个底层报表。\n\n请注意，调整和移动仪表板磁贴起初可能有点棘手。将光标悬停在仪表板磁贴上会在磁贴右下角显示一个调整大小手柄。单击此调整大小手柄可调整磁贴大小。磁贴会调整为在调整大小时显示在磁贴周围的灰色框显示的预配置磁贴大小。\n\
  \n移动磁贴时，单击并按住磁贴以在仪表板上移动磁贴。其他磁贴会根据您放置磁贴的位置自动移动。释放鼠标按钮以放置磁贴。\n\n- 31. 在主仪表板区域正上方，选择\
  \ **编辑** 然后 **添加磁贴**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_267_0.png)\n\n\
  Figure 5.8: 仪表板编辑菜单\n\n- 32. 在 **添加磁贴** 面板中，选择 **图像**，然后单击 **下一步**。\n- 33. 在 **URL**\
  \ 中，放置以下链接：`https://bit.ly/3mhzBxv`。\n- 34. 选中 **设置自定义链接** 复选框。\n- 35. 将 **链接类型**\
  \ 设置为 **外部链接** 且 **URL** 为 `http://www.adventure-works.com`。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_267_1.png)\n\
  \nFigure 5.9: 图像磁贴设置\n\n## Working in the Service\n\n- 36. 单击 **应用** 按钮。\n- 37.\
  \ 再添加一个磁贴，这次是 **文本** 框。\n- 38. 在 **内容** 区域添加文本；注意您可以使用 **插入链接** 图标添加活动链接。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_268_0.png)\n\

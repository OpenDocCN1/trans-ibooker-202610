  \ 环境中的仓库。\n- 41. 保存并将报表发布到 Power BI 服务。\n- 42. 在 Power BI 服务中打开报表并将报表可视化对象固定到仪表板：\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_635_0.png)\n\n图 13.54：Dataverse 环境中的仓库\n\
  \n*图 13.54 显示了从 Dynamics 365 Finance and Operations 加载到 Dataverse 的仓库位置。*\n\n##\
  \ 其工作原理...\n\n在配置环境时，您可以选择是否创建数据库。如果环境仅用于 Power Apps 和 Power Automate 开发，且源数据来自\
  \ Dataverse 环境以外的其他位置，您可能会选择不创建数据库。通过创建带有数据库的 Dataverse 环境并将 **Deploy Dynamics 365\
  \ apps** 勾选为 **Yes**，将向环境中添加额外的表以支持所选应用程序。\n\n重要的是，您必须将默认团队的角色设置为 **System Administrator**\
  \ 或 **System Customizer**。默认情况下，配置过程创建的团队在系统中没有任何权限，而创建环境的 用户会被授予 **System Administrator**\
  \ 等角色。然而，连接集、项目和任务执行的同步目前在写入 Dataverse 环境时使用的是团队权限，而不是用户权限。\n\n创建数据集成项目包括三个任务：创建连接、创建连接集，最后创建包含要执行任务的项目。连接仅保存数据源的身份验证凭据，类似于在\
  \ Power BI 中定义数据源连接（数据源设置）。连接集仅定义源系统和目标系统。与 Power BI 不同，Power BI 的目标始终是 Power BI\
  \ 数据模型，数据集成项目可以在任意两个源系统之间同步数据。最后，项目定义了数据集成期间要执行的任务。任务保存源系统和目标系统之间列的映射。\n\n在 Power\
  \ Platform 管理中心创建的数据集成项目利用了与 Power BI 和数据流相同的 Power Query 技术。这可以通过选择本配方中创建的数据集成项目中的任务，然后选择\
  \ **Advanced query and filtering** 来看出。熟悉的 Power Query 编辑器界面会显示，包括访问 **Advanced\
  \ Editor** 以直接插入 M 代码。此 **Advanced query and filtering** 界面可用于进一步细化源数据查询，例如删除不必要的列，以提高数据源查询的整体效率或执行所需的转换。\n\
  \n## 另请参阅\n\n- Administer Power Platform: https://bit.ly/3bqaKTQ\n- Integrate data\
  \ into Microsoft Dataverse: https://bit.ly/3bpQykV\n\n## 结论\n\n本章重点介绍了 Power BI、SSRS、Analysis\
  \ Services、Excel、PowerPoint、Power Apps、Power Automate、Dataverse 和 Dynamics 365 之间强大的集成点。这包括将\
  \ Power BI 连接到 Analysis Services，利用 DAX 作为查询语言来支持 Excel 中的自定义报表，将报表服务可视化对象固定到 Power\
  \ BI 仪表板，以及利用立方体公式构建模板或记分卡报表布局。此外，还提供了一个示例，说明如何使用 Power Automate 设计自动化工作流，将数据从关系数据库推送到\
  \ Power BI 服务中的流式数据集，从而通过常见的 Power BI 可视化和数据警报功能实时查看源数据更改。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_639_0.png)\n\

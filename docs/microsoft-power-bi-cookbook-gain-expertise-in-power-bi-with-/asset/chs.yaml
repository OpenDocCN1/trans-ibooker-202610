  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_629_0.png)\n\n图 13.50：Dataverse 环境中的客户\n\
  \n*图 13.50* 显示了加载到 Dataverse 的客户位置。\n\n### How it works…\n\nPower Apps 数据流使用与 Power\
  \ BI 相同的 Power Query 技术。这些数据流可以从许多不同的源摄取数据，包括通过数据网关的本地源以及基于云的源。一旦数据导入 Dataverse，此数据可以通过导入或\
  \ DirectQuery 由 Power BI 访问。\n\n重要的是要指出，Power Apps 和 Power Automate 也可以原生访问存储在 Dataverse\
  \ 环境中的数据。\n\n### There's more…\n\n除了 Dataverse 之外，Power BI 还与 Dynamics 365 应用程序具有原生集成，允许\
  \ Power BI 仪表板在 Dynamics 365 应用程序内显示。为演示此功能，请执行以下操作：\n\n1. 打开 Power Platform 管理中心，`https://admin.powerplatform.microsoft.com`\n\
  2. 在左侧导航窗格中，单击 **Environments**\n3. 单击在此食谱中创建的环境\n4. 单击 **Environment URL** 的链接以打开环境\n\
  5. 选择右上角的齿轮图标并选择 **Advanced Settings**\n6. 从左上角的 **Settings** 下拉菜单中选择 **Administration:**\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_630_0.png)\n\n图 13.51：Dynamics 365 设置\n\
  \n7. 选择 **System Settings**\n8. 单击 **Reporting** 选项卡并将 **Allow Power BI visualization\
  \ embedding** 设置为 **Yes**\n9. 单击 **OK** 按钮\n10. 打开环境的 Sales Hub 应用并单击 **Dashboards**\n\
  11. 选择 **New** 然后选择 **Power BI Dashboard**\n12. 如有必要，登录到 Power BI\n13. 选择一个 **Workspace**\
  \ 和一个 **Dashboard** 并单击 **Save** 按钮\n14. 选择 New 然后选择 **Dynamics 365 Dashboard**\n\
  15. 选择一个布局然后单击 **Create** 按钮\n16. 单击 **Add a Power BI tile to the dashboard** 图标：\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_630_1.png)\n\n图 13.52：Dynamics 365 中添加到仪表板的\
  \ Power BI 磁贴图标\n\n17. 选择一个 **Workspace**、一个 **Dashboard** 和一个 **Tile** 然后单击 **OK**\
  \ 按钮\n18. 为仪表板提供一个 **Name** 并单击 **Save** 然后单击 **Close**\n\nPower BI 仪表板和磁贴继续表现出对其底层报表的链接行为。单击报表磁贴会打开底层报表，并且该报表是交互式的，这意味着单击视觉对象会交叉筛选报表中的其他视觉对象，就像在\
  \ Power BI 服务中查看报表一样。\n\n### See also\n\n- Administer Power Platform: https://bit.ly/3bqaKTQ\n\
  - Create and use dataflows in Power Apps: https://bit.ly/3eP6tLL\n\n## Connecting\
  \ Dynamics 365 Finance and Operations and the Power Platform\n\nPower BI 是 Microsoft\
  \ Power Platform 产品系列的一部分。Power Platform 包括 Power BI、Power Apps、Power Automate 和\
  \ Power Virtual Agents。然而，Power Platform 也是一个更大产品系列的一部分，即 Microsoft Business Applications。Microsoft\
  \ Business Applications 是围绕 Dynamics 365 Sales、Dynamics 365 Business Central 和 Dynamics\
  \ 365 Finance and Operations 构建的应用程序。Microsoft 实际上将 Business Applications 细分为以下几类：\n\
  \n- Microsoft Power Platform\n- Customer Service\n- Field Service\n- Finance\n-\
  \ Marketing\n- Operations\n- Commerce\n- Human Resources\n- Sales\n\n然而，需要注意的是，Customer\
  \ Service、Field Service、Marketing、Commerce、Human Resources 和 Sales 都是围绕 Microsoft\
  \ **客户关系管理 (CRM)** 系统构建的，该系统以前称为 Microsoft CRM。可扩展的 Microsoft CRM 系统，有时称为 XRM，实际上是\
  \ Dataverse 的核心。Finance and Operations 应用程序指的是 **企业资源规划 (ERP)** 应用程序，即 Dynamics\
  \ 365 Finance and Operations 或 Dynamics 365 Business Central。请注意，Dynamics 365 Finance\
  \ and Operations 是基于 Dynamics **AX (Axapta)** 构建的，而 Dynamics 365 Business Central\
  \ 是基于 Dynamics **NAV (Navision)** 构建的。Dynamics **GP (Great Plains)** 并未过渡到云端。\n\n\
  ## Integrating Power BI with Other Applications\n\nPower Platform 管理中心提供了一个中央位置，用于集成\
  \ Microsoft Business Applications 组合中的各种产品。这还包括强大的数据集成功能，允许管理员将来自许多不同环境的数据集成到 Dataverse\
  \ 环境中。与数据流类似，这些数据集成项目促进了数据管理策略和业务信息流的集中控制。\n\n本食谱演示如何使用 Power Platform 管理中心创建数据集成项目，将\
  \ Dynamics 365 Finance and Operations 数据与 Dataverse 环境同步，然后从该数据构建 Power BI 报表。\n\
  \n### Getting ready\n\n为准备本食谱，请执行以下步骤：\n\n1. 打开 Web 浏览器，前往 `https://admin.powerplatform.microsoft.com`，并使用你的\
  \ Microsoft 365 帐户登录。这是 Power Platform 管理中心。\n2. 在左侧导航窗格中，单击 **Environments**。\n\
  3. 在功能区区域中，单击 **+ New**。这将在页面右侧打开一个 **New environment** 窗格。\n4. 在 **New environment**\
  \ 窗格中，输入环境的 **Name**，选择 **Type**（**Production、Sandbox** 或 **Trial** 之一），并选择一个 **Region**。此外，将\
  \ **Create a database for this environment** 切换为 **Yes** 并单击窗格底部的 **Next** 按钮。\n\
  5. 选择 **Language** 和 **Currency**。如有需要提供 **URL**。\n6. 将 **Enable Dynamics 365 apps**\
  \ 切换为 **Yes**。\n7. 单击 **Automatically deploy these apps** 的下拉菜单并选中所有复选框。\n8. 单击窗格底部的\
  \ **Save** 按钮。\n9. 单击环境并记下 **Environment URL**。\n10. 单击 **Environment URL** 以打开环境。\n\
  11. 单击右上角的齿轮图标并选择 **Advanced Settings**。\n12. 单击 **Settings** 然后单击 **Security**。\n\
  13. 选择 **Teams**。\n14. 选中默认团队旁边的复选框并选择 **MANAGE ROLES**。\n15. 选中 **System Administrator**\
  \ 的复选框并单击 **OK** 按钮。\n\n\n\n\n\n## 如何操作...\n\n要实现此配方，请使用以下步骤：\n\n- 1. 导航到 https://powerapps.com\
  \ 并切换到 *Getting ready* 中创建的新环境。当前环境位于右上角。\n- 2. 展开 **Data** 并选择 **Connections**。\n\
  - 3. 单击 **New connection**。\n- 4. 搜索 **Dynamics** 并添加一个 **Fin & Ops Apps (Dynamics\
  \ 365)** 连接。\n- 5. 重复 *步骤 3 和 4* 以添加一个 **Dataverse** 连接和一个 **Dynamics 365 (deprecated)**\
  \ 连接。\n- 6. 在 **Data** 标题下，现在选择 **Tables**。\n- 7. 切换到 **All** 视图并搜索 *warehouse*。\n\
  - 8. 单击 **Warehouse** 表。\n- 9. 单击 **Add column**。\n- 10. 添加一个 **City** 文本列。\n- 11.\
  \ 单击右下角的 **Save Table**。\n- 12. 导航到 Power Platform 管理中心。\n- 13. 单击 **Data integration**。\n\
  - 14. 单击 **New connection set**。\n- 15. 为 **Connection set name** 提供一个描述性值。\n- 16.\
  \ 对于 **First app connection**，选择之前创建的 **Finance and Operations apps** 连接并选择正确的环境。\n\
  - 17. 对于 **Second app connection**，选择 **Dynamics 365 for Sales** 并选择本配方中创建的环境。请注意，在撰写本文时，**Dynamics\
  \ 365 for Sales** 是正确的连接类型。旧的 **Common Data Service** 连接类型无法使用，而新的 **Dataverse**\
  \ 连接类型不会出现在可用应用程序列表中。将来，**Dataverse** 连接类型很可能会是正确的选择。\n- 18. 选择正确的组织，例如 **Finance\
  \ and Operations apps** 的 **USMF**，以及 **Dynamics 365 for Sales** 组织的 环境名称。\n- 19.\
  \ 单击 **Save** 按钮。\n- 20. 单击 **New project**。\n- 21. 提供一个 **Project name**，例如 **Warehouse\
  \ Sync**。\n- 22. 单击 **Choose an existing connection set** 并选择之前创建的连接集。\n\n## 将 Power\
  \ BI 与其他应用程序集成\n\n- 23. 单击 **Choose template**，选择 **Warehouses (Fin and Ops to Field\
  \ Service)** 模板，然后单击 **OK** 按钮。\n- 24. 在 **Organizations** 下选择组织对并单击 **Create**\

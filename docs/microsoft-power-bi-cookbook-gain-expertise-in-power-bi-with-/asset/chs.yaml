  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_375_0.png)\n\n图 8.10：行级安全性对话框\n\n## 工作原理\n\
  \n**行级安全性（RLS）**角色中的筛选表达式始终会被强制执行，并覆盖连接报表或 DAX 度量值中的任何筛选逻辑。负责定义 RLS 角色的模型的 BI 开发人员应当能够向报表作者和其他利益相关者说明\
  \ RLS 逻辑如何影响常见报表和度量值。\n\n安全角色中应用的筛选器会像 Power BI 报表中的筛选器以及 DAX 度量值中应用的筛选器一样遍历关系。例如，对产品维度表的安全筛选会从**产品**表（关系的一端）流向多端（**在线销售**），但会在此停止，也不会流向与**在线销售**相关的其他表，除非在**在线销售**与这些其他维度表之间启用了双向关系。请注意，以任一角色或无角色身份查看时，**日期行数**度量值保持不变，因为没有直接应用筛选器——也没有任何\
  \ DAX 筛选表达式通过关系传播到**日期**表。\n\n数据模型同时包含在线销售和经销商销售，但每个角色应仅限于其特定的业务流程（事实表）。此外，**美国在线自行车销售**角色应能够查看北美客户详细信息（加拿大和美国），但只能查看美国客户在自行车类别中购买商品的销售数据。**销售区域**筛选器确保成员只能看到与美国客户关联的销售数据。**客户**表筛选器允许安全成员选择查看加拿大和美国客户。FALSE\
  \ 函数用于筛选**经销商**表中的每一行，这也会筛选相关的**经销商销售**表。\n\n由于 FALSE 安全筛选器，两个经销商表度量值返回空值。**在线销售**表由**产品**筛选器（自行车）和**销售区域**筛选器（美国）进行筛选。**在线销售**表也由**客户**筛选器进行筛选，但**销售区域**筛选器的限制性更强。\n\
  \n即使对于经验丰富的 Power BI 开发人员，并且对于相对简单的需求，一次只应用一个安全筛选器并观察对行数的影响也很有帮助。带有行数以及可能的事实表度量值的标准测试报表页面有助于加快这一过程。\n\
  \n对于**欧洲经销商山地车和旅行车**角色，**经销商**筛选器仅使**产品线**为**山地车**或**旅行车**的行可见。IN DAX 运算符比旧版本语言中用作逻辑\
  \ OR 运算符的 || 符号更直观且更易于维护。**在线销售**和**客户**表因**客户**表的 FALSE 表达式而为空。**客户**与**在线销售**之间是一对多、单向关系。因此，对**客户**表的筛选会影响**在线销售**，但不会影响其他表。\n\
  \n**销售区域**表因欧洲筛选器而剩余三行（法国、德国和英国）。**经销商销售**事实表同时受到**销售区域**筛选器和**经销商产品线**筛选器（**山地车**或**旅行车**）的影响。来自**经销商**和**销售区域**表的筛选器会流向**经销商销售**表，但会在此停止，不会影响其他表。\n\
  \n在收集安全需求时，以及在测试或**质量保证（QA）**阶段，应向利益相关者说明哪些表不受安全筛选器影响。用户可能会错误地认为**产品**表的安全筛选器也会筛选其他维度表，例如**商店**维度，因为某些产品只在某些商店销售。然而，如果直接查询**商店**表，并且**商店**与**销售**事实表之间没有双向关系，则所有商店都是可访问的。只有当视觉对象中使用销售度量值时，具有空值（鉴于**产品**筛选器）的商店才会默认被丢弃，即便如此，用户也可以通过**显示无数据的项目**设置访问这些商店。若要保护这些表并避免这些关系的双向交叉筛选，可能需要额外的表特定安全筛选器。\n\
  \n## 更多内容\n\n安全角色定义特定于给定的 Power BI 模型（数据集）。在多个 Power BI 模型中维护通用安全角色和业务定义的管理开销和风险，以及资源使用过多的问题，应促使\
  \ IT/BI 团队考虑将这些模型整合到单个 Power BI 高级数据集或可选的 Analysis Services 模型中。在多个 Power BI 模型中维护通用安全角色和业务定义的管理开销和风险，可以促使\
  \ IT/BI 团队在可行时整合数据模型，并考虑将 **SQL Server Analysis Services（SSAS）** 或 **Azure Analysis\
  \ Services** 模型作为更高效、更安全的长期解决方案。\n\n随着数据模型需要越来越多的角色和角色筛选要求，可以在数据仓库中构建一个中央安全角色表，其中包含与要保护的列值相关联的不同角色名称。针对此表的查询可由导入或\
  \ DirectQuery 数据模型使用，以通过关系实现这些角色。\n\n## 另请参阅\n\n- ► 使用 Power BI 实现行级安全性（RLS）：https://bit.ly/3nhx3zW\n\
  - ► Power BI Desktop 中的行级安全性（RLS）指南：https://bit.ly/3tUH3kY\n\n## 设计动态安全模型\n\nPower\
  \ BI 中的动态安全模型根据登录用户与数据模型中存储的一个或多个列的关系来筛选表。USERPRINCIPALNAME DAX 函数返回用户的 UPN，如本章第一个配方所述，安全角色的筛选表达式接受此值作为参数。与\
  \ Power BI 数据模型中的所有筛选器一样，安全角色中应用的筛选器也会通过一对多和双向关系筛选其他表。安全角色还可以将动态的基于用户的筛选器与标准安全筛选器结合使用，以进一步限制映射到这些角色的成员的可见性。\n\
  \n本配方在 Employees 维度表上实现动态安全。结果是，登录用户（员工）只能查看自己的数据以及直接或通过其他经理间接向其汇报的员工的数据。\n\n###\
  \ 准备工作\n\n若要准备此配方，请执行以下步骤：\n\n- 1. 在本地打开 Power BI Desktop 文件，并通过在“开始”选项卡的功能区中单击“转换数据”来访问\
  \ Power Query 编辑器\n- 2. 创建一个名为 AdWorksDW 的查询，类似于以下内容：\n- ```\nlet\n    Source =\
  \ Sql.Database(\"localhost\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\")\nin\n  \
  \  Source\n```\n- 3. 禁用 AdWorksDW 查询的加载，并将其放入“数据源”查询组\n- 4. 右键单击 AdWorksDW 查询并选择“引用”\n\
  - 5. 将查询重命名为 Employees，选择 DimEmployee 表，并将其移动到“其他查询”查询组\n- 6. 在“开始”选项卡的功能区中选择“关闭并应用”\n\
  - 7. 切换到“数据”视图并创建以下计算列：\n- ```\nEmployee Name = SWITCH(TRUE(),\n    ISBLANK([MiddleName]),[FirstName]\
  \ & \" \" & [LastName],\n    [FirstName] & \" \" & LEFT([MiddleName],1) & \". \"\
  \ & [LastName])\n```\n\n\n\n\n\n## 产品需求文档（PRD）\n\n**项目名称**：智能文档解析系统\n\n**版本**：v1.2\n\
  \n**更新日期**：2025-06-15\n\n### 1. 项目背景\n\n随着企业数字化转型的深入推进，文档数量呈现指数级增长。传统的文档管理方式存在检索困难、信息利用率低、人工标注成本高等问题。本项目旨在构建一套智能文档解析系统，利用自然语言处理和光学字符识别技术，实现文档的自动分类、信息抽取和结构化存储。\n\
  \n### 2. 需求概述\n\n- 支持PDF、Word、扫描件等多种格式\n- 自动识别文档标题、段落、表格、图片等元素\n- 支持自定义抽取规则\n- 提供可视化标注工具\n\
  - 支持批量处理与导出\n\n### 3. 功能列表\n\n| 编号 | 功能模块 | 优先级 | 描述 |\n|------|----------|--------|------|\n\
  | F001 | 文档上传 | P0 | 支持批量上传与格式校验 |\n| F002 | 版面分析 | P0 | 识别文档布局结构 |\n| F003 | 内容提取\
  \ | P1 | 抽取标题/正文/表格 |\n| F004 | 数据导出 | P1 | 支持JSON/XML/CSV导出 |\n| F005 | 用户管理 |\
  \ P2 | 角色权限与操作审计 |\n\n## 在 Power BI 中实现基于用户的动态可见性\n\n```\nCurrent User Org Level\
  \ = CALCULATE(MAX(Employees[ManagementPathLength]), FILTER(ALL(Employees),Employees[EmployeeKey]\
  \ = [Current User EmployeeKey]))\n```\n\n```\nEmployee Row Count = COUNTROWS('Employees')\n\
  ```\n\n3. 在“建模”选项卡的功能区中选择“管理角色”。\n\n4. 单击“创建”，将角色命名为“Current User”，并在 Employees\
  \ 表上使用以下表筛选器 DAX 表达式：\n\n```\nPATHCONTAINS(Employees[ManagementPath],[Current User\
  \ EmployeeKey])\n```\n\n5. 单击“保存”按钮。\n\n6. 使用 Current User Name、Current User Manager、Current\
  \ User Org Level 和 Employee Row Count 度量作为字段创建一个多卡片可视化对象。\n\n7. 在“建模”选项卡的功能区中选择“查看身份”，然后选择“Current\
  \ User”角色。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_379_0.png)\n\n图 8.12：应用于\
  \ Employees 表的安全角色 Current User 的动态筛选表达式\n\n8. 将 Current User Principal Name 度量编辑为\
  \ peter0@adventure-works.com。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_379_1.png)\n\
  \n图 8.13：以 A. Scott Wright 身份查看报表\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_379_2.png)\n\
  \n图 8.14：以 Peter J. Krebs 身份查看报表\n\n### 工作原理\n\n在生产环境中，**Current User Principal\
  \ Name** 度量不应硬编码为电子邮件地址，而应采用以下公式的形式：\n\n```\nCurrent User Principal Name = USERPRINCIPALNAME()\n\
  ```\n\n本方法中使用的 DAX 函数专用于 **DimEmployee** 源表中存在的父子层次结构。**DimEmployee** 表包含一个电子邮件地址列，该列在登录\
  \ Power BI 服务时对应于 DAX USERPRINCIPALNAME 函数返回的值。此外，本方法仅适用于导入模式数据集，因为 DirectQuery\
  \ 模式模型中无论是计算列还是安全筛选表达式，目前都不支持父子 DAX 函数。\n\n**Employees** 表有 296 行，但登录用户应该只能看到自己的数据以及直接或间接向其汇报的员工的数据。例如，即使经理向高级经理汇报，而高级经理又向副总裁汇报，副总裁仍然应该可以看到经理的数据。但是，高级经理不应该能够查看副总裁的数据或其他高级经理的数据。可见性仅限于当前用户的数据以及通过其他经理直接或间接向当前用户汇报的员工的数据。\n\
  \n**EmployeeKey** 值是通过 PATH 函数获取的 **ManagementPath** 列中的最后一项。**Current User EmployeeKey**\
  \ 度量使用 **Current User Principal Name** 检索 **EmployeeKey** 值，作为 item 参数传递给 RLS 筛选表达式中的\
  \ PATHCONTAINS 函数。在步骤 1 中创建的计算列 **ManagementPath** 提供了每个 **Employees** 行要评估的值字符串。\n\
  \n### 扩展内容\n\nRLS 表达式可能会显著降低查询性能，因为当安全角色成员访问此内容时，这些筛选器将应用于 Power BI 报表中的其他筛选器和表达式之外。一般规则是，如本章以下方法所示，尝试使用低基数表之间的关系来实现动态安全性。LOOKUPVALUE、CONTAINS\
  \ 和 PATHCONTAINS 等实用函数或信息函数可以满足导入模式模型中的复杂安全规则，但应用到较大的维度表（例如包含超过一百万行的客户表或产品表）时，从性能角度来看可能会非常昂贵。\n\
  \n### 另请参阅\n\n- 使用 Power BI 的行级安全性 (RLS)：https://bit.ly/3nhx3zW\n- Power BI Desktop\
  \ 中的行级安全性 (RLS) 指南：https://bit.ly/3tUH3kY\n\n## 为 DirectQuery 构建动态安全性\n\n可通过关系在\
  \ DirectQuery 模型中实现动态行级安全性角色，并在用户安全表与要保护的维度表之间进行特定的双向交叉筛选。在导入模式模型的角色安全表达式中常用的 DAX\
  \ 信息函数（如 CONTAINS 和 LOOKUPVALUE）在 DirectQuery 模式模型中不受支持，因此需要基于关系的安全设计。尽管仅限于这一种方法，但可以快速为\
  \ DirectQuery 模型开发动态安全性并轻松维护，而无需复杂的 DAX 安全表达式。\n\n本方法将介绍在 DirectQuery 模型中支持动态安全性所需的步骤和设置。\n\
  \n### 准备工作\n\n要准备此方法，请按照以下步骤操作：\n\n1. 在本地打开 Power BI Desktop 文件，并单击“开始”选项卡功能区中的“转换数据”以访问\
  \ **Power Query 编辑器**。\n2. 创建一个新查询，以访问 SQL Server 上的 **AdventureWorksDW2019** 数据库副本，并确保**数据连接**模式设置为\
  \ **DirectQuery**。\n3. 在“导航”对话框中选择 **FactInternetSales** 表。\n4. 将查询重命名为 **Internet\
  \ Sales**。\n5. 右键单击 **Internet Sales** 查询，然后选择“复制”。\n6. 将“导航”步骤改为指向 **DimSalesTerritory**\
  \ 表。\n7. 将查询重命名为 **Sales Territories**。\n8. 右键单击 **Internet Sales** 查询，然后选择“复制”。\n\
  9. 将“导航”步骤改为指向 **DimEmployee** 表。\n10. 将查询重命名为 **Employees**。\n11. 将 **Employees**\
  \ 查询编辑为以下内容（将 **Source** 行替换为你的 SQL Server 实例）：\n\n```\nlet\n    Source = Sql.Database(\"\
  localhost\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\"),\n    dbo_DimEmployee = Source{[Schema=\"\
  dbo\",Item=\"DimEmployee\"]}[Data],\n    ExpandSalesTerritory = Table.ExpandRecordColumn(\n\
  \        dbo_DimEmployee, \"DimSalesTerritory\",\n        {\"SalesTerritoryCountry\"\
  }, {\"SalesTerritoryCountry\"}),\n    RemoveColumns = Table.SelectColumns(\n   \
  \     ExpandSalesTerritory,\n        {\"SalesTerritoryCountry\", \"EmployeeKey\"\
  ,\n         \"EmployeeNationalIDAlternateKey\", \"EmailAddress\"})\nin\n    RemoveColumns\n\
  ```\n\n12. 右键单击 **Employees** 查询，然后选择“复制”。\n13. 将查询重命名为 **Countries**。\n14. 将 **Countries**\
  \ 查询编辑为以下内容（将 **Source** 行替换为你的 SQL Server 实例）：\n\n```\nlet\n    Source = Sql.Database(\"\
  localhost\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\"),\n    dbo_DimEmployee = Source{[Schema=\"\
  dbo\",Item=\"DimEmployee\"]}[Data],\n    ExpandSalesTerritory = Table.ExpandRecordColumn(\n\
  \        dbo_DimEmployee, \"DimSalesTerritory\",\n        {\"SalesTerritoryCountry\"\
  }, {\"SalesTerritoryCountry\"}),\n    RemoveColumns = Table.SelectColumns(\n   \
  \     ExpandSalesTerritory,{\"SalesTerritoryCountry\"}),\n    RemoveDups = Table.Distinct(RemoveColumns)\n\
  in\n    RemoveDups\n```\n\n15. 在“开始”选项卡的功能区中单击“关闭并应用”。\n16. 切换到“模型”视图，在 **Sales\
  \ Territories** 和 **Countries** 表的 **SalesTerritoryCountry** 列之间创建关系。\n17. 在 **Sales\
  \ Territories** 和 **Internet Sales** 表的 **SalesTerritoryKey** 列之间创建关系。\n18. 在 **Countries**\
  \ 和 **Employees** 表的 **SalesTerritoryCountry** 列之间创建关系。\n19. 保存你的工作。\n\n### 如何为\
  \ DirectQuery 构建动态安全模型\n\n要实现此方法，请执行以下操作：\n\n1. 在“模型”视图中，打开 **Countries** 到 **Employees**\
  \ 关系的属性，并将“交叉筛选方向”设置为“双向”。\n2. 同时勾选“假设引用完整性”和“在两个方向上应用安全筛选器”复选框，然后单击“确定”。\n\n\n\n\
  \n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_383_0.png)\n\nFigure 8.15: Bidirectional\
  \ relationship between the Countries and Employees tables\n\n3. The model should\
  \ now look the same as that shown in Figure 8.16\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_383_1.png)\n\
  \nFigure 8.16: Dynamic user security relationships\n\n4. Create the following measure,\
  \ Current User Principal Name:\nCurrent User Principal Name = \"david8@adventure-works.com\"\
  \n\n5. Click Manage roles in the ribbon of the Modeling tab\n\n6. Click Create,\
  \ and name the role Current User, with a table filter DAX expression on the Employees\
  \ table of the following code:\n\n```\n[EmailAddress] = [Current User Principal\
  \ Name]\n```\n\n7. Figure 8.17 shows this DAX formula entered into Power BI Desktop's\
  \ interface for creating RLS roles\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_383_2.png)\n\
  \nFigure 8.17: DAX table filter expression applied to the EmailAddress column of\
  \ the Employees table\n\n## Implementing Dynamic User-Based Visibility in Power\
  \ BI\n\n- 8. Click the **Save** button\n- \n- 9. Create a Table visualization using\
  \ the **EmailAddress** and **SalesTerritoryCountry** columns from the **Employees**\
  \ table\n- \n- 10. Create a **Clustered column chart** visualization using the **SalesTerritoryCountry**\
  \ column from the **Countries** table as the **Axis**, and the **SalesAmount** column\
  \ (sum) from the **Internet Sales** table as **Values**\n- \n- 11. Click **View\
  \ as** in the ribbon of the **Modeling** tab, choose **Current User**, and click\
  \ the **OK** button to see that only the **United States** column is shown in the\
  \ clustered column chart\n- \n- 12. Edit the **Current User Principal Name** measure\
  \ to be lynn@adventure-works.com and observe that only **Australia** is shown in\
  \ the clustered column chart\n\n## How it works\n\nIn a production environment,\
  \ the **Current User Principal Name** measure would not be hardcoded to an email\
  \ address, but would rather be of the following formula:\n\n```\nCurrent User Principal\
  \ Name = USERPRINCIPALNAME()\n```\n\nWhen a user mapped to the dynamic security\
  \ role connects to the DirectQuery dataset, their UPN is computed via the USERPRINCIPALNAME\
  \ function. This value filters the **Employees** table to a single row, which then\
  \ filters the **Countries** table via the bidirectional, one-to-many relationship.\
  \ The filtered countries, such as Australia and the United States, then filter the\
  \ **Sales Territories** dimension table. As a final step, the **Internet Sales**\
  \ fact table is filtered by the **Sales Territories** table, and thus all **Internet\
  \ Sales** measures and aggregations reflect the given **SalesTerritoryCountry**\
  \ of the employee.\n\nNote that the **Countries** table, which contains only the\
  \ distinct country values, is necessary, since the **Sales Territories** table contains\
  \ many regions for the same country, and all relationships must have a side that\
  \ identifies each row of a table.\n\nEnsure that **Apply security filter in both\
  \ directions** is selected for the bidirectional (both) cross-filter relationship\
  \ between the **Countries** and **Employees** tables. In addition, the **Assume\
  \ referential integrity** setting causes the DirectQuery data model to send inner\
  \ join SQL queries to the source database and this—of course—significantly improves\
  \ performance with larger models.\n\n## There's more\n\nThe approach from this recipe\
  \ can be implemented in the same way for an Import mode model, and can also be used\
  \ with a consolidated security role table. For example, instead of an **Employees**\
  \ table containing UPNs (email addresses), a **Permissions** table could be loaded\
  \ to the model containing the names of each RLS role and the columns to secure.\n\
  \n## Getting ready\n\nTo prepare for this recipe, follow these steps:\n\n- 1. Open\
  \ a Power BI Desktop file locally and access the **Power Query Editor** by clicking\
  \ on **Transform Data** in the ribbon of the **Home** tab.\n- 2. Create a query\
  \ named **AdWorksDW**, similar to the following:\n- \n  ```m\n  let\n      Source\
  \ = Sql.Database(\"localhost\\\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\")\n  in\n\
  \      Source\n  ```\n- \n- 3. Disable load on the **AdWorksDW** query and place\
  \ it into a **Data Sources** query group.\n- 4. Right-click the **AdWorksDW** query\
  \ and choose **Reference**.\n- 5. Rename the query **Sales Territories**, choose\
  \ the **DimSalesTerritory** table, and move to the **Other Queries** query group.\n\
  - 6. Create a **Products** query using the following code:\n- \n  ```m\n  let\n\
  \      Source = AdWorksDW,\n      Navigation = Source{[Schema=\"dbo\",Item=\"DimProduct\"\
  ]}[Data],\n      Subcategory =\n          Table.ExpandRecordColumn(\n          \
  \    Navigation, \"DimProductSubcategory\",\n              {\"EnglishProductSubcategoryName\"\
  , \"DimProductCategory\"},\n              {\"Product Subcategory\", \"DimProductCategory\"\
  }\n          ),\n      Category =\n          Table.ExpandRecordColumn(\n       \
  \       Subcategory, \"DimProductCategory\",\n              {\"EnglishProductCategoryName\"\
  }, {\"Product Category\"}\n          )\n  in\n      Category\n  ```\n- \n- 7. Move\
  \ the **Sales Territories** and **Products** queries to the **Other Queries** query\
  \ group.\n- 8. Select **Close & Apply** from the ribbon of the **Home** tab.\n-\
  \ 9. Save your work.\n\n## How to do it\n\nTo implement this recipe, perform the\
  \ following:\n\n- 1. Create a DAX measure for **Regions Selected:**\n- \n      Regions\
  \ Selected =\n          VAR Selected =\n              FILTERS('Sales Territories'[SalesTerritoryRegion])\n\
  \          VAR String = \"Regions Selected: \" &\n              CONCATENATEX(\n\
  \                  Selected,[SalesTerritoryRegion],\", \",[SalesTerritoryRegion])\n\
  \          VAR StringLength = LEN(String)\n          VAR NumOf = COUNTROWS(Selected)\n\
  \      RETURN\n          SWITCH(TRUE(),\n              NOT(ISFILTERED('Sales Territories'[SalesTerritoryRegion])),\n\
  \              \"No Regions Selected\",\n              StringLength < 45, String,\n\
  \              NumOf & \" Regions Selected\" )\n- \n- 2. Create a DAX measure for\
  \ **Categories Selected:**\n- \n      Categories Selected =\n          VAR Selected\
  \ =\n              FILTERS('Products'[Product Category])\n          VAR String =\
  \ \"Categories Selected: \" &\n              CONCATENATEX(\n                  Selected,[Product\
  \ Category],\", \",[Product Category])\n          VAR StringLength = LEN(String)\n\
  \          VAR NumOf = COUNTROWS(Selected)\n      RETURN\n          SWITCH(TRUE(),\n\
  \              NOT(ISFILTERED('Sales Territories'[SalesTerritoryRegion])),\n   \
  \           \"No Categories Selected\",\n              StringLength < 45, String,\n\
  \              NumOf & \" Categories Selected\" )\n- \n- 3. Add a **Card** or **Multi-row\
  \ card** visualization for each measure created\n\n## There's more\n\n- 1. Create\
  \ a DAX measure that identifies the remaining **SalesTerritoryRegion** values, given\
  \ all other filters are applied:\n\n```\n```DAX\nRegions Remaining =\n    VAR Remaining\
  \ = DISTINCT('Sales Territories'[SalesTerritoryRegion])\n    VAR String = \"Regions\
  \ Remaining: \" &\n        CONCATENATEX(\n            Remaining,[SalesTerritoryRegion],\"\
  , \",[SalesTerritoryRegion])\n    VAR StringLength = LEN(String)\n    VAR NumOf\
  \ = COUNTROWS(Remaining)\n    RETURN\n        SWITCH(TRUE(),\n            NOT(ISCROSSFILTERED('Sales\
  \ Territories')),\n                \"No Sales Territories Filters\",\n         \
  \   StringLength < 55, String,\n            NumOf & \" Regions Remaining\")\n```\n\
  ```\n\n- 2. Create a DAX measure that identifies the remaining **Product Subcategories**\
  \ values, given all other filters are applied:\n\n```\n```DAX\nSubcategories Remaining\
  \ =\n    VAR Remaining = DISTINCT('Products'[Product Subcategory])\n    VAR String\
  \ = \"Subcategories Remaining: \" &\n        CONCATENATEX(\n            Remaining,[Product\
  \ Subcategory],\", \",[Product Subcategory])\n    VAR StringLength = LEN(String)\n\
  \    VAR NumOf = COUNTROWS(Remaining)\n    RETURN\n        SWITCH(TRUE(),\n    \
  \        NOT(ISCROSSFILTERED('Sales Territories')),\n                \"No Products\
  \ Filters\",\n            StringLength < 55, String,\n            NumOf & \" Subcategories\
  \ Remaining\")\n```\n```\n\nThe DISTINCT function replaces the FILTERS function\
  \ used in the earlier example to return the unique values still active despite filters\
  \ on other columns. The ISCROSSFILTERED function replaces the ISFILTERED function\
  \ used in the earlier example to test if any column from the **Sales Territories**\
  \ dimension table is being used as a filter.\n\n\n\n\n测试新度量：如图 8.20 所示，对列应用筛选器以减少可用值或剩余值。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_390_0.png)\n\n图 8.20：Regions Remaining\
  \ 和 Subcategories Remaining 度量\n\nSalesTerritoryRegion 和 Product Subcategory 列分别受到应用于\
  \ SalesTerritoryGroup 和 Product Category 列的筛选器的影响。鉴于 15 个产品子类别的文本字符串字符数较多，因此只显示剩余数量。\n\
  \n请注意，当筛选器直接应用在给定列上时，这些剩余表达式将返回与第一个示例相同的字符串值。例如，如果在销售区域地区切片器上选择了 Northwest 和 Northeast\
  \ 地区，那么它们将是仅剩的两个地区。这两个示例中应用的技术可以进一步混合或丰富，例如将数值度量与分隔字符串返回的每个维度值关联起来。\n\n## 另请参阅\n\
  \n- DAX FILTERS 函数：https://bit.ly/3aAVTFB\n- DAX CONCATENATEX 函数：https://bit.ly/3sVmvHQ\n\
  - DAX ISCROSSFILTERED 函数：https://bit.ly/3vo13gr\n\n## 避免用户手动点击\n\n在 BI 项目中，常见场景是需要定制一组核心报表和仪表板，以更好地匹配更大团队或组织职能中特定角色或用户的职责与分析需求。理想情况下，特定业务用户应能立即、默认地看到相关数据，而无需与内容交互或修改内容，例如应用筛选器选择。\n\
  \nPower BI 丰富的自助服务功能有时可以满足这一需求（或部分满足），而其他由 IT 支持的、针对特定角色的报表和仪表板则是另一个实际可行的选择。\n\n\
  第三种选择（也是本技巧的主题）是将基于用户的动态筛选逻辑嵌入 DAX 度量中。通过这种方法，可以在组织的多个层级中利用单个或少数几个报表和仪表板，从而避免开发新报表的需要。\n\
  \n## 准备工作\n\n要准备此技巧，请按照以下步骤操作：\n\n- 1. 在本地打开 Power BI Desktop 文件，然后通过单击“开始”选项卡功能区中的“转换数据”来访问\
  \ Power Query 编辑器。\n- 2. 创建一个名为 AdWorksDW 的查询，类似于以下内容：\n- 3. 禁用 AdWorksDW 查询的加载，并将其放入\
  \ Data Sources 查询组。\n- 4. 右键单击 AdWorksDW 查询，然后选择“引用”（Reference）。\n- 5. 将查询重命名为 Internet\
  \ Sales，然后选择 FactInternetSales 表。\n- 6. 对名为 Sales Territories（指向 DimSalesTerritory\
  \ 表）的查询和名为 Customers（指向 DimCustomers 表）的查询重复步骤 4 和 5。\n- 7. 编辑 Customers 查询以展开 DimGeography\
  \ 列：\n\n```\nlet\n    Source = Sql.Database(\"localhost\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\"\
  )\nin\n    Source\n```\n\n```\nlet\n    Source = AdWorksDW,\n    dbo_DimCustomer\
  \ = Source[{\"Schema\"=\"dbo\",Item=\"DimCustomer\"}][Data],\n    ExpandGeography\
  \ = Table.ExpandRecordColumn(\n        dbo_DimCustomer, \"DimGeography\",\n    \
  \    {\"City\", \"StateProvinceName\", \"EnglishCountryRegionName\", \"PostalCode\"\
  },\n        {\"City\", \"StateProvinceName\", \"EnglishCountryRegionName\", \"PostalCode\"\
  })\nin\n    ExpandGeography\n```\n\n## 在 Power BI 中实现基于用户的动态可见性\n\n- 8. 将 **Internet\
  \ Sales** 查询移动到名为 **Facts** 的查询组，并将 **Sales Territories** 和 **Customers** 查询移动到名为\
  \ **Dimensions** 的查询组。\n- 9. 在 **Dimensions** 查询组中创建一个名为 **Sales User Roles** 的\
  \ **Enter Data** 查询，包含以下信息：\n\n| EmailAddress | SalesTerritoryKey | UserRole |\n\
  |---|---|---|\n| david8@adventure-works.com | 2 | Country |\n| linda3@adventure-works.com\
  \ | 4 | Region |\n| pamela0@adventure-works.com | 6 | Group |\n\n- 10. 在 **Other\
  \ Queries** 组中，创建一个名为 **Calculations** 的 **Blank** 查询。\n- 11. 在 **Home** 选项卡的功能区中选择\
  \ **Close & Apply**（关闭并应用）。\n- 12. 在 **Sales Territories** 表和 **Internet Sales**\
  \ 表的 **SalesTerritoryKey** 列之间创建关系。\n- 13. 在 **Sales Territories** 表和 **Sales User\
  \ Roles** 表的 **SalesTerritoryKey** 列之间创建关系。\n- 14. 在 **Internet Sales** 表和 **Customers**\
  \ 表的 **CustomerKey** 列之间创建关系。\n- 15. 将 **Customers** 表中 **Postal Code** 列的 **Data\
  \ category**（数据类别）设置为 **Postal Code**。\n- 16. 保存你的工作。\n\n现在的模型应与 *图 8.21* 中所示相同。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_392_0.png)\n\n图 8.21：此技巧的模型\n\n## 如何避免用户手动点击\n\
  \n要实现此技巧，请使用以下步骤：\n\n- 1. 在 **Calculations** 表中创建以下 DAX 度量：\n\n```\nUser Principal\
  \ Name = \"david8@adventure-works.com\"\n```\n\n```\nUser Sales Territory Key =\
  \ LOOKUPVALUE('Sales User Roles'[SalesTerritoryKey],\n    'Sales User Roles'[EmailAddress],[User\
  \ Principal Name])\n```\n\n```\nUser Sales Role =\n    VAR RoleLookup = LOOKUPVALUE('Sales\
  \ User Roles'[UserRole],\n        'Sales User Roles'[EmailAddress],[User Principal\
  \ Name])\nRETURN IF(ISBLANK(RoleLookup),\"Role Not Found\",RoleLookup)\n```\n\n\
  ```\nUser Sales Group = IF([User Sales Role] = \"Role Not Found\",\n    \"Role Not\
  \ Found\", LOOKUPVALUE('Sales Territories'[SalesTerritoryGroup],\n        'Sales\
  \ Territories'[SalesTerritoryKey],[User Sales Territory Key]))\n```\n\n```\nUser\
  \ Sales Country = IF([User Sales Role] = \"Role Not Found\",\n    \"Role Not Found\"\
  , LOOKUPVALUE('Sales Territories'[SalesTerritoryCountry],\n        'Sales Territories'[SalesTerritoryKey],[User\
  \ Sales Territory Key]))\n```\n\n```\nUser Sales Region = IF([User Sales Role] =\
  \ \"Role Not Found\",\n    \"Role Not Found\", LOOKUPVALUE('Sales Territories'[SalesTerritoryRegion],\n\
  \        'Sales Territories'[SalesTerritoryKey],[User Sales Territory Key]))\n```\n\
  \n- 2. 在 **Calculations** 表中创建两个 DAX 度量，以检测 **Sales Territories** 表的筛选上下文，并相应地筛选\
  \ **Internet Sales** 表：\n\n```\nSales Territory Detection = IF(ISCROSSFILTERED('Sales\
  \ Territories'),\n    \"Filters Applied\", \"No Filters\")\n```\n\n```\nInternet\
  \ Sales Amount = SWITCH(TRUE(),\n    [Sales Territory Detection] = \"Filters Applied\"\
  \ ||\n    [User Sales Role] = \"Role Not Found\",SUM('Internet Sales'[SalesAmount]),\n\
  \    [User Sales Role] = \"Group\",\n```\n\n```\nCALCULATE(SUM('Internet Sales'[SalesAmount]),\n\
  FILTER(ALL('Sales Territories'),\n'Sales Territories'[SalesTerritoryGroup] = [User\
  \ Sales Group])),\n[User Sales Role] = \"Country\",\nCALCULATE(SUM('Internet Sales'[SalesAmount]),\n\
  FILTER(ALL('Sales Territories'),\n'Sales Territories'[SalesTerritoryCountry] =\n\
  [User Sales Country])),\n[User Sales Role] = \"Region\",\nCALCULATE(SUM('Internet\
  \ Sales'[SalesAmount]),\nFILTER(ALL('Sales Territories'),\n'Sales Territories'[SalesTerritoryRegion]\
  \ =\n[User Sales Region])) )\n```\n\n- 3. 创建一个包含新度量和 Sales Territory 表的标准报表，以测试或演示该逻辑。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_394_0.png)\n\n图 8.22：用户 Pamela（北美地区的组角色成员）的默认筛选上下文\n\
  \n- 4. 更改 User Principal Name 度量以测试三种不同的角色。\n\n## 工作原理\n\n在生产环境中，User Principal\
  \ Name 度量不会硬编码为电子邮件地址，而应使用以下公式：\n\n```\nUser Principal Name = USERPRINCIPALNAME()\n\
  ```\n\n此外，生产级实现会将 **Sales User Roles** 表存储在 SQL 数据仓库中，而不是使用 **Enter Data** 查询。\n\
  \n此技巧中的度量相互依赖，最终形成 **Internet Sales Amount** 度量。这些度量的目的是为度量（**Internet Sales Amount**）提供特定的默认筛选上下文。例如，国家/地区角色成员在打开报表时，默认应看到按自己所在国家/地区筛选的数据。但是，条件逻辑也可以允许用户应用自己的筛选选择，从而提供额外的可见性选项。\n\
  \n**Sales Territory Detection** 度量是此方法的基础。如果 **Sales Territories** 表上的任何列都未被筛选（例如通过切片器），则销售度量应默认为基于用户的特定筛选上下文。如果已对\
  \ **Sales Territories** 列进行了筛选选择，则度量应使用这些选择。\n\n如果当前用户在 **Sales User Roles** 表中找不到，**Internet\
  \ Sales Amount** 度量默认会对 **Internet Sales** 表中的 **SalesAmount** 列求和。如果确定了用户的角色，并且未对\
  \ **Sales Territories** 表应用筛选器，则会应用用户角色级别（**Group**、**Country** 或 **Region**）的筛选器以及特定维度成员。\n\
  \n## 更多内容\n\n示例报表左上角卡片视觉对象中显示的五个 DAX 度量定义如下：\n\n```\nUser Role Status = \"My Sales\
  \ Role: \" & [User Sales Role]\n```\n\n```\nSales Group Status = \"My Group: \"\
  \ & [User Sales Group]\n```\n\n```\nSales Country Status = \"My Country: \" & [User\
  \ Sales Country]\n```\n\n```\nSales Region Status = \"My Region: \" & [User Sales\
  \ Region]\n```\n\n```\nFilter Status = VAR Prefix = \"Sales Territory Filter Status:\
  \ \"\nRETURN IF([Sales Territory Detection] = \"No Filters\",\n    Prefix & \"Role\
  \ Based\",Prefix & \"User Defined\")\n```\n\n## 另请参阅\n\n- DAX LOOKUPVALUE 函数：https://bit.ly/3gdjZKl\n\
  \n\n\n\n\n## 结论\n\n本章提供了针对导入和 DirectQuery 数据集构建和部署动态的、基于用户的安全性的详细示例，以及增强用户体验的动态筛选上下文功能示例。在\
  \ Power BI 部署中，阻止用户或用户组查看数据集的一部分的数据安全性通常是一项首要需求，安全实现可以从简单到复杂。考虑到用例的多样性以及此功能在利益相关者之间安全共享数据集的重要性，了解可用于开发、测试和操作数据安全角色的流程和技术非常重要。\n\
  \n## 应用高级分析和自定义视觉对象\n\nPower BI Desktop 的标准报表创作工具为开发丰富的 BI 和分析内容提供了坚实的基础。由 Microsoft\
  \ 和第三方开发的自定义可视化通过其独特功能进一步补充了这些能力，并且可以与 Power BI 报表和仪表板中的标准视觉对象集成。此外，地理空间分析功能（例如适用于\
  \ Power BI 的 ArcGIS 地图视觉对象、自定义维度分组以及动画和批注选项）进一步有助于从数据中提取含义，并支持与他人共享这些见解。\n\nPower\
  \ BI Desktop 还包含反映现代数据科学工具和算法的高级分析功能，包括聚类、预测以及对自定义 R 和 Python 脚本和视觉对象的支持。例如，可使用“分析”窗格通过其他指标（如趋势线）丰富视觉对象，并且“快速见解”功能使报表作者能够快速分析特定问题并生成新的可视化。\n\
  \n本章包含各种不同的方案，重点介绍 Power BI 的许多最新、最受欢迎的自定义可视化和高级分析功能。其中包括顶级的自定义视觉对象，如子弹图、适用于 Power\
  \ BI 的 ArcGIS 地图视觉对象，以及通过动画和批注进行的数据故事讲述。此外，还提供了利用 Power BI 数据集以及 DAX、R 和 Python\
  \ 语言分别嵌入自定义统计分析和可视化的示例。\n\n本方案包括两个示例，说明如何利用 Power BI Desktop 中的“分析”窗格来提高图表视觉对象的分析价值：一个用于簇状柱形图，另一个用于折线图。分析窗格中内置的预测功能将在本章后面的“预测和异常检测”方案中介绍。\n\
  \n### 准备工作\n\n要为此方案做准备，请按照以下步骤操作：\n\n- 1. 在 Power BI Desktop 中打开新文件\n- 2. 在“主页”选项卡的功能区中单击“转换数据”\n\
  - 3. 在 Power Query 编辑器中，创建一个名为“Internet Sales”的新查询，用于导入 AdventureWorksDW2019 数据库中的\
  \ FactInternetSales 表\n- 4. 在“主页”选项卡的功能区中单击“关闭并应用”\n\n### 如何整合高级分析\n\n要实施此方案，请使用以下步骤：\n\
  \n- 1. 在“报表”视图中，创建一个簇状柱形图视觉对象，使用“Internet Sales”表中的“OrderDate”列作为“轴”，并使用“UnitPrice”列的平均值作为“值”\n\
  - 2. 在“可视化”窗格的“轴”字段井中，选择“OrderDate”列下的下拉列表，并将“日期层次结构”切换为“OrderDate”\n- 3. 使用“筛选器”窗格仅显示从\
  \ 1/1/2013 到 4/1/2013 的值\n- 4. 在“可视化”窗格中，单击“分析”窗格（放大镜图标）\n- 5. 打开“趋势线”卡片，单击“添加”，然后应用颜色黑色、虚线样式和透明度\
  \ 0%\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_399_0.png)\n\n图 9.1：将日期列添加到视觉对象时自动生成的日期层次结构\n\
  \n```DAX\nEVALUATE\n  GROUPBY(\n    __DS0Core,\n    \"MinInternet_Net_Sales\", MINX(CURRENTGROUP(),\
  \ [Internet_Net_Sales]),\n    \"MaxInternet_Net_Sales\", MAXX(CURRENTGROUP(), [Internet_Net_Sales]),\n\
  \    \"AverageInternet_Net_Sales\", AVERAGEX(CURRENTGROUP(), [Internet_Net_Sales]),\n\
  \    \"MinMinDate\", MINX(CURRENTGROUP(), [MinDate])\n  )\n```\n\n图 9.3：使用“分析”窗格获取最小值、最大值和平均值的\
  \ Power BI 文件的 SQL Server 事件探查器跟踪\n\n### 更多内容...\n\n折线图支持比其他大多数视觉对象更多的分析功能，包括预测和\
  \ X 轴常量线。要查看折线图分析的实际效果，请执行以下操作：\n\n- 1. 使用以下公式创建一个名为 **Margin %** 的度量值：\n-   \n\
  -      ```DAX\n-      Margin % =\n-          VAR __Price = SUM('Internet Sales'[SalesAmount])\n\
  -          VAR __Cost = SUM('Internet Sales'[TotalProductCost])\n-          RETURN\
  \ DIVIDE(__Price - __Cost,__Price,0)\n-      ```\n-   \n-   2. 在 **报表** 视图中，创建一个\
  \ **折线图** 视觉对象，使用 **OrderDate**（列，而不是层次结构）作为 **轴**，使用 **Margin %** 作为 **值**。\n-\
  \   3. 使用 **筛选器** 窗格仅显示从 1/1/2013 到 4/1/2013 的值。\n-   4. 在 **分析** 窗格中，添加一条名为 **Target:**\
  \ 的 **Y 轴常量线**，其 **值** 为 0.4。\n-   5. 添加一条名为 **End of Quarter:** 的 **X 轴常量线**，用于\
  \ 3/31/2013。\n-   6. 添加一条名为 **Min:** 的 **最小值** 线和一条名为 **Max:** 的 **最大值** 线，**颜色**\
  \ 为黑色，**线型** 为 **实线**。\n-   7. 添加一条名为 **75% Percentile** 的 **百分位线**，并将 **百分位** 设置为\
  \ **75%**。\n-   8. 对于所有线条，将 **数据标签** 切换为 **开**，并将 **文本** 设置为 **名称和值**。\n-   9. 添加一个\
  \ **预测**，**持续 1 个月**，**置信区间** 为 **75%**，**季节性** 为 **60 个点**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_401_0.png)\n\
  \n图 9.4：带分析线和预测的折线图\n\n在此示例中，40% 被视为关键盈利阈值，因此常量线有助于标出低于此水平的值。此外，设置为 75% 的百分位线有助于识别值的前四分位数。来自\
  \ **分析** 窗格的线条（及其格式）为用户提供了更多的分析价值，而无需为模型添加额外的 DAX 度量值，也不会使视觉对象变得杂乱。\n\n### 另请参阅\n\
  \n- Power BI 分析窗格文档：http://bit.ly/2s2fA0P\n- 如何跟踪 Power BI Desktop 文件：http://bit.ly/2tYRLZg\n\
  \n## 使用自定义视觉对象和快速见解丰富内容\n\n可从 AppSource 查看和下载适用于 Power BI 的自定义视觉对象，以提供超出 Power BI\
  \ Desktop 标准视觉对象所支持范围的功能和选项。AppSource 目前提供 300 多个自定义视觉对象，其中许多由 Microsoft 开发，用于满足常见需求，例如子弹图、直方图和甘特图。AppSource\
  \ 中提供的其他自定义视觉对象由第三方开发，但已经过 Microsoft 的安全验证，这些视觉对象具有独特而强大的功能，例如流图网络可视化和 ZoomCharts\
  \ 开发的交互式视觉对象。除自定义视觉对象外，**快速见解** 可在 Power BI 服务和 Power BI Desktop 中使用，对数据集应用高级分析算法以提取见解（如趋势或关系），并快速生成用于报表和仪表板的新可视化。\n\
  \n只有在自定义视觉对象提供标准视觉对象不提供的极具价值或必需的功能时，才应使用它们。这是因为自定义视觉对象的性能通常远低于标准视觉对象，且可靠性较差。此外，自定义视觉对象的支持难度更大，因为报表作者对自定义视觉对象相关特定选项的熟悉程度不如标准视觉对象。\n\
  \n本方案包括一个在 Power BI Desktop 中访问和使用子弹图自定义视觉对象的示例，以及一个在 Power BI 服务中使用快速见解功能的示例。\n\
  \n### 准备工作\n\n要为此方案做准备，请按照以下步骤操作：\n\n- 1. 在 Power BI Desktop 中打开新文件\n- 2. 在 **主页**\
  \ 选项卡的功能区中单击 **转换数据**\n- 3. 在 Power Query 编辑器中，创建一个名为 **Internet Sales** 的新查询，用于导入\
  \ **AdventureWorksDW2019** 数据库中的 **FactInternetSales** 表：\n\n\n\n\n4. 在 **“开始”**\
  \ 选项卡的功能区中，单击 **“关闭并应用”**\n\n```\nSource = Sql.Database(\"localhost\\\\MSSQLSERVERDEV\"\
  , \"AdventureWorksDW2019\"),\n    Navigation = Source{[Schema=\"dbo\",Item=\"FactInternetSales\"\
  ]}[Data],\n    ExpandedDimSalesTerritory = Table.ExpandRecordColumn(\n        Navigation,\
  \ \"DimSalesTerritory\",\n        {\"SalesTerritoryCountry\"}, {\"SalesTerritoryCountry\"\
  })\nin\n    ExpandedDimSalesTerritory\n```\n\n5. 在 **“可视化”** 窗格中，单击省略号（...），然后选择\
  \ **“获取更多视觉对象”**\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_403_0.png)\n\n图9.5：从\
  \ AppSource 导入自定义视觉对象\n\n6. 使用 **“搜索”** 查找经过认证的（蓝色星号/复选标记图标）**“子弹图”** 视觉对象，并单击 **“添加”**\
  \ 按钮\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_403_1.png)\n\n图9.6：从 Power BI Desktop\
  \ 添加自定义视觉对象\n\n## 如何使用自定义视觉对象和快速见解丰富内容\n\n要实现本操作指南，请执行以下步骤：\n\n- 1. 创建以下度量值：\n\n\
  ```\nSales 2011 = SUMX(FILTER('Internet Sales',YEAR([OrderDate])=2011),[Sales Amount])\n\
  \nSales 2012 = SUMX(FILTER('Internet Sales',YEAR([OrderDate])=2012),[Sales Amount])\n\
  \nSales 2012 Improve = [Sales 2011] * .7\n\nSales 2012 Sat = [Sales 2011] * .8\n\
  ```\n\n子弹图还支持在格式窗格中手动输入目标值和目标值的百分比。但建议使用由 DAX 度量值驱动的数据驱动方法，因为这样可以在其他视觉对象中复用这些计算，并且在目标和阈值逻辑发生变化时，可以轻松调整多个报表。\n\
  \n## 更多内容\n\nPower BI 服务中的 **“快速见解”** 功能和分析引擎现已可用于 Power BI Desktop。若要了解其工作原理，请执行以下步骤：\n\
  \n- 1. 使用以下代码创建 Margin % 度量值：\n\n```\nMargin % =\n    VAR __Price = SUM('Internet\
  \ Sales'[SalesAmount])\n    VAR __Cost = SUM('Internet Sales'[TotalProductCost])\n\
  RETURN DIVIDE(__Price - __Cost,__Price,0)\n```\n\n- 2. 创建一个折线图视觉对象，将“订单日期”（层次结构，而不是列）作为轴，将\
  \ Margin % 度量值作为值。\n\n- 3. 在图表中右键单击 2013 年的数据点，然后选择“分析”，再选择“解释下降”。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_405_0.png)\n\
  \n图9.8：Power BI Desktop 中的“分析”功能\n\n## 应用高级分析和自定义视觉对象\n\n右键单击特定数据点时，会出现 **“分析”**\
  \ 选项，从而可以生成特定于所选项目的其他视觉对象，例如折线图上的日期或条形图上的维度值。生成的视觉对象随后可以添加到 Power BI Desktop 文件中，并可像所有其他视觉对象一样进行编辑。**“分析”**\
  \ 选项是 Power BI Desktop 中 **“快速见解”** 功能和分析引擎的体现。\n\n**“快速见解”** 也可以对 Power BI 服务中的整个数据集执行。若要对数据集运行快速见解，请单击该数据集的省略号，然后选择\
  \ **“获取快速见解”**。通过同一上下文菜单中的 **“查看见解”** 选项，可以访问生成的见解。每条见解都包含一个 Power BI 视觉对象、所采用的见解（算法）标题（例如离群值和相关性）以及一段简短描述。来自\
  \ **“查看见解”** 的视觉对象也可以固定到新的和现有的仪表板。\n\n**“快速见解”** 会对数据集应用复杂的算法，包括类别离群值、相关性、时间序列中的变化点、低方差、多数、时间序列中的季节性以及时间序列中的总体趋势。见解引擎在限定的时间内呈现结果。\n\
  \n**“快速见解”** 视觉对象可以像其他 Power BI 报表和仪表板磁贴一样，固定到新的和现有的仪表板。此外，可以针对之前由快速见解生成的视觉对象再次执行快速见解。\n\
  \n通过隐藏或取消隐藏列，可以改进 **“快速见解”** 的结果。**“快速见解”** 不会搜索隐藏的列，因此隐藏（或删除）不必要的列可以让见解算法只关注重要的列。同样，可以删除或隐藏任何重复的列，从而高效利用可用于运行快速见解的时间。\n\

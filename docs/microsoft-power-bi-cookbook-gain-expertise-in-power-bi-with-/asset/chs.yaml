  \ 10 章“管理和监控 Power BI”*中的说明导入和分析 Microsoft 365 中 Power BI 事件的审核日志。此外，Power BI 服务中的省略号\
  \ (...) 菜单现在提供了特定于各个仪表板和报表的使用情况指标报表。尽管这些报表仅限于特定项目，但它们也指示了 Web 和移动使用之间的划分。\n\n###\
  \ 操作步骤...\n\n要实现本食谱，请执行以下步骤：\n\n1. 通过打开仪表板并切换到**移动视图**，优化 Power BI 仪表板以供移动使用。\n\n\
  ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_579_0.png)\n\n图 12.44：在 Power BI 服务中切换到仪表板的移动视图\n\
  \n2. 从移动视图中取消固定图像、文本以及不太适合移动设备或相关性较低的磁贴。\n3. 在**移动视图**顶部调整 KPI 和基本视觉对象的大小并对其进行组织。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_579_1.png)\n\n图 12.45：在 Power BI 服务中自定义仪表板的移动视图\n\
  \n4. 打开报表的 PBIX 文件。\n5. 在最重要报表页面的**视图**选项卡的功能区中选择**移动布局**，并设计页面的自定义移动布局。有关此过程的详细信息，请参阅*第\
  \ 4 章“创作 Power BI 报表”*。\n6. 将更新后的 Power BI 报表发布到 Power BI 服务中的工作区，并重新固定任何仪表板磁贴。\n\

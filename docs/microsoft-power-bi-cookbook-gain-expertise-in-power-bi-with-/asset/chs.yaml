  \n## 使用 ArcGIS 地图创建地理空间映射\n\nESRI 的 ArcGIS 地图和空间分析软件是 **地理信息系统（GIS）** 市场的领导者，它内置于\
  \ Power BI Desktop 中，可从数据的空间分量中生成更深入的见解。熟悉的报表可视化字段井以及 Power BI 的交叉筛选功能，可以与 ArcGIS\
  \ 的地理空间功能和数据集（如分类类型、图钉和参考图层）相结合，从而在 Power BI 解决方案中构建自定义的智能地理视觉对象。\n\n在本操作指南中，会创建一个自定义地理列，以包含多个地理属性（即街道地址、城市和州），从而支持\
  \ ArcGIS 服务进行准确的地理编码。然后，使用 Power BI Desktop 中的 ArcGIS 视觉对象将客户地址绘制到聚类主题地图视觉对象中，并辅以图钉和信息图。\n\
  \n## 准备工作\n\n要准备本操作指南，请执行以下步骤：\n\n- 1. 在 Power BI 服务中，单击右上角的“设置”（齿轮图标），并在“常规”选项卡上启用\
  \ ArcGIS 地图。这需要具有 Power BI 服务的管理员访问权限。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_407_0.png)\n\
  \n图9.9：Power BI 服务中的“常规设置”对话框\n\n- 2. 在 Power BI Desktop 中打开一个新文件。\n\n- 3. 在“开始”选项卡的功能区中单击“转换数据”。\n\
  \n- 4. 在“Power Query 编辑器”中，使用以下代码创建一个名为 Customers 的新查询（编辑 Source 行）：\n\n```\nlet\n\

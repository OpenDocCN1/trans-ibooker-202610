  - Power BI Q&A 的限制：http://bit.ly/2PtCrDL\n\n## 添加警报和订阅\n\n警报可以配置在仪表板的磁贴上，以在满足特定条件时提供通知。警报规则和选项可以在\
  \ Power BI 服务中进行管理，通知可以仅限于 Power BI 中的通知中心，也可以通过电子邮件共享。数据驱动的警报增强了 Power BI 仪表板的价值，因为在支持仪表板磁贴的数据集刷新时，它们会立即引起对重要事件或结果的关注。Power\
  \ BI 仪表板和报表还支持订阅。订阅按照定义的计划将刷新后的报表和仪表板的图像和链接直接发送到用户收件箱。此外，可以配置分页报表订阅，以常见的文件格式（如 Excel\
  \ 和 PDF）将报表数据附加到订阅电子邮件中。\n\n本指南演示如何创建和配置警报和订阅，以及如何通过使用 Power Automate 来利用此功能释放更强大的功能。\n\

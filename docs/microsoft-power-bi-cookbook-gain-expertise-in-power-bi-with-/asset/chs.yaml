  \n## 创建表和矩阵视觉对象\n\n需要查看精确的单独值，或需要在详细级别（例如单个交易）查看数据时，表和矩阵视觉对象非常合适。Power BI 中的表视觉对象符合经典的列和行“列表”报表格式，但支持强大的交叉突出显示和格式设置选项，包括条件格式。矩阵视觉对象包含表视觉对象的功能，并对应于\
  \ Excel 中数据透视表的布局和一般功能：度量的二维表示，能够在行和列轴上进行向上和向下钻取。\n\n在本方法中，将演示表和矩阵可视化的各种功能，包括条件格式、钻取和交叉突出显示。\n\
  \n### 准备工作\n\n为准备此方法，请执行以下步骤：\n\n- 1. 打开 CH4_R6.pbix 文件，并将文件另存为 CH4_R7.pbix。\n-\
  \ 2. 切换到 Scratch 页面，使用 Ctrl-A 然后按 Delete 删除所有视觉对象。\n- 3. 检查“筛选器”窗格，确保只有“欧洲”筛选器处于活动状态。\n\
  \n### 如何创建表和矩阵视觉对象\n\n要实现此方法，请使用以下步骤：\n\n- 1. 选择“法国”页面。\n- 2. 在“可视化”窗格中，选择“表”视觉对象。\n\
  - 3. 从“产品”表中添加“产品类别”列，从“Internet 销售”表中添加“Internet 净销售额”、“Internet 利润率%”和“Internet\
  \ 客户计数”度量值，以及从“经销商销售”表中添加“经销商净销售额”和“经销商利润率%”度量值。\n- 4. 在视觉对象的“值”区域中，根据需要重新排列度量值。\n\
  - 5. 在视觉对象的“值”井中，双击“Internet 客户计数”度量值，并将其重命名为“Internet 客户”。\n- 6. 在“格式”窗格的“常规”部分，将“X\
  \ 位置”设置为 448，“Y 位置”设置为 526，“宽度”设置为 832，“高度”设置为 194。\n- 7. 展开“样式”部分，选择“对比交替行”。\n\
  - 8. 将此视觉对象复制到“德国”、“英国”和“Scratch”页面。\n- 9. 在“Scratch”页面上，使用“值”井中“经销商利润率%”度量值的下拉菜单，将条件格式应用于背景色。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_229_0.png)\n\n图 4.33：条件格式\n\n- 10. 在“条件格式”对话框中，勾选“发散”复选框，然后单击“确定”按钮。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_229_1.png)\n\n图 4.34：条件格式的发散颜色\n\n- 11.\
  \ 对 **Internet 净销售额** 应用条件格式，但这次将 **格式方式** 更改为 **规则**，并在 **规则** 中将下拉菜单更改为 **为空白**。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_230_0.png)\n\n图 4.35：按规则设置格式\n\n- 12.\

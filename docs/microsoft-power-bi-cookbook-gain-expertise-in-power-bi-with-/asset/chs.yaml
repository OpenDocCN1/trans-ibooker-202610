  \ -m pip install pandas`。\n- 8. 通过在 **主页** 选项卡的功能区中单击 **转换数据**，访问 **Power Query\
  \ 编辑器**。\n- 9. 创建名为 AdWorksDW 的查询，如下所示：\n\n```\nlet\n    Source = Sql.Database(\"\

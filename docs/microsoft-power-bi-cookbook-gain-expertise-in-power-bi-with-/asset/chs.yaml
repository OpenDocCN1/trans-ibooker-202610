  \n图4.47：钻取后的钻取筛选器\n\n## 工作原理\n\n工具提示和报表页工具提示是提高报表信息和分析密度的绝佳方法，可以在相同的报表页面空间内提供额外见解。工具提示和报表页工具提示都会继承光标悬停的视觉对象元素在其粒度级别上的上下文。这意味着，工具提示中的任何度量值以及报表页工具提示中的任何视觉对象，都会反映当前与报表交互的用户的上下文。\n\
  \n报表作者还可以设计钻取报表页，让用户能够快速、轻松地探索与特定关注项关联的详细信息。钻取报表页上的所有视觉对象都会更新，以反映启动钻取时所选项的筛选器上下文。\n\
  \n钻取是一项非常强大且广受欢迎的功能，因为当用户查看报表时，它实际上可以充当按用户问题定制的动态生成报表。因此，在用户经常交互的热门报表中，可能会包含跨常见维度的多个钻取报表页。可考虑使用第7章“参数化\
  \ Power BI 解决方案”中的“使用模板”操作指南中描述的 Power BI 模板（.pbit 文件），以便在新报表中重用现有的钻取报表页。\n\n对于高基数维度列，钻取页尤其有价值，因为这些列的各个值很可能没有自己专用的报表或报表页。例如，“Product\
  \ Category”和“Product Subcategory”列可能已有自己的报表和仪表板，但单个“Product Model”（此层次结构的第三级）可能就是构建一个或多个钻取报表页的理想候选。\n\
  \n当向钻取筛选器字段井中添加列时，系统会自动创建返回按钮。此按钮可以设置格式，也可以完全移除，但通常很有帮助，尤其是在包含多个页面的报表中。另外，任何通过 Power\
  \ BI Desktop 功能区的“插入”选项卡添加的形状或图像，也可以用作钻取页的返回按钮。\n\n## 更多内容\n\n在页面的钻取区域中，您可能已经注意到“跨报表”开关。Power\
  \ BI 确实允许您在报表之间（而不仅仅是在页面之间）进行钻取。必须在“选项和设置”中“当前文件”的“报表设置”中，或者 Power BI 服务中，启用源报表以使用其他报表中的钻取目标。然后，需要配置目标报表，将“跨报表”选项切换为“开”，并相应地配置钻取字段。请注意，跨报表筛选要求报表的数据集架构匹配。\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_239_0.png)\n\n图4.48：跨报表钻取\n\n## 另请参阅\n\

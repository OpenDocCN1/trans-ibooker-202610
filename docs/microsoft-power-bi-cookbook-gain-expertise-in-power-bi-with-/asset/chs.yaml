  \n图 12.46：数据警报通知显示在移动应用外部\n\n11. 向移动用户演示批注和共享功能及相关场景。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_580_1.png)\n\
  \n图 12.47：在 Power BI 移动版中向 Power BI 报表添加批注并通过电子邮件共享\n\n在此示例中，在 Power BI 移动版中访问的报表被轻度批注，并向同事共享了一条简短消息，请求进一步分析。共享电子邮件中内置了指向已批注报表的链接，使收件人能够立即对消息采取行动，并可选地共享针对该请求的批注响应。\n\
  \n12. 在会议和演示中使用 Windows 10 Power BI 应用。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_581_0.png)\n\
  \n图 12.48：Windows 10 Power BI 应用\n\nWindows 10 Power BI 应用支持触摸设备、批注和简单的导航控件。\n\n\
  13. 优化用于 Q&A 的数据集。有关更多详细信息，请参阅*第 5 章“在服务中工作”*中的食谱*“为 Q&A 做准备”*。\n14. 测试常见问题，并为用户提供示例和关键字，以便更好地使用该功能。\n\
  \n构建和优化移动体验可以极大地帮助 Power BI 的采用。\n\n### 工作原理...\n\n只有仪表板的所有者才能在 Power BI 服务中自定义移动视图。根据*第\
  \ 4 章“创作 Power BI 报表”*，报表页面的移动布局是在 Power BI Desktop 文件中实现的。因此，任何有权访问 Power BI 服务中报表工作区和源\
  \ PBIX 文件的 Power BI Pro 用户都可以优化这些报表以供移动使用。\n\n通过为笛卡尔视觉对象（如柱状图、条形图和折线图）启用“响应式视觉对象”属性，这些视觉对象将在尺寸缩小时进行优化，以显示其最重要的元素。这有效地使得在报表的移动布局和仪表板的移动视图中使用这些更密集的视觉对象变得现实。然而，考虑到空间有限，在移动布局中优先考虑\
  \ KPI、卡片和仪表视觉对象仍然是有意义的。\n\n用户配置的数据警报仅对这些用户可见，并且对可配置的警报数量没有限制。例如，用户可能希望为同一个仪表板磁贴设置两个警报，以同时提示高值和低值。目前，数据警报和收藏夹活动不会存储在\
  \ Office 365 审核日志中，因此有必要让移动用户参与这些功能，以了解采用水平。\n\n### 更多内容...\n\nMicrosoft 的 Power\
  \ BI 团队提供了许多在移动设备（如平板电脑、手机甚至手表）上使用 Power BI 的选项。这些选项的示例包括与 Apple Watch 的集成、从手机连接和查看本地\
  \ Reporting Services 报表的能力，以及针对 iOS 和 Android 设备的 Power BI 移动应用功能和特性的持续更新。\n\nPower\
  \ BI 仪表板可以通过适用于 iOS 的 Power BI 应用与 Apple Watch 同步。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_582_0.png)\n\
  \n图 12.49：Apple Watch 上 Power BI 移动应用的索引屏幕（左）和聚焦磁贴（右）\n\n只需在适用于 iOS 的 Power BI 中打开仪表板，单击省略号\
  \ (...)，然后单击**与手表同步**。仅支持卡片和 KPI 磁贴，但可以将 Apple Watch 表盘配置为显示其中一个 Power BI 磁贴。\n\n\
  可以通过点击应用左上角的个人资料图像图标，然后点击**连接到服务器**，从 Power BI 移动应用访问和查看 SSRS 报表。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_583_0.png)\n\
  \n图 12.50：Power BI 移动版中连接到报表服务器的导航菜单\n\n如您所见，Power BI 广泛支持各种不同的移动设备。\n\n### 另请参阅\n\
  \n- Apple App Store 上的 Microsoft Power BI：https://apple.co/2R6kaNs\n- Power BI 移动应用文档：https://bit.ly/33wKWB3\n\
  - 在 Power BI 移动版中查看本地报表服务器报表和 KPI：http://bit.ly/2noIloX\n\n\n\n\n## 使用 Teams 分发内容\n\
  \nMicrosoft Teams 是一个统一的协作和通信平台，将视频会议、电话呼叫、文件存储、持久化工作场所聊天和应用程序集成组合到统一的界面中。Teams\
  \ 是 Microsoft 365 办公生产力套件的一部分，与 Word、PowerPoint、Excel 和 SharePoint Online 原生集成。此外，功能扩展提供了与第三方应用程序集成的支持。\n\
  \n近年来，Microsoft Teams 经历了爆炸式增长，尤其是在 2020 年疫情期间。事实上，在 2020 年 3 月至 6 月之间，Microsoft\
  \ Teams 增长了近 900%。对于超过五十万家组织而言，Microsoft Teams 已成为每天用于推动沟通和协作的基本工具。因此，微软最近发布了 Power\
  \ BI 与 Teams 之间的集成，使 Teams 能够作为仪表板、报表和其他内容的分发渠道也就不足为奇了。\n\n本食谱演示如何利用 Teams 分发和协作\
  \ Power BI 内容。\n\n### 准备工作\n\n为准备本食谱，请执行以下步骤：\n\n1. 确保您已将报表、仪表板或应用发布到 Power BI 服务。\n\
  2. 打开 Microsoft Teams 并加入或创建一个团队。\n\n您现在已准备好完成本食谱。\n\n### 如何操作...\n\n要实现本食谱，请使用以下步骤：\n\
  \n1. 在 Teams 中，选择导航窗格中的 **Teams**，然后选择团队中的一个频道。\n2. 在团队的标题区域（选项卡）中，选择加号图标 (+) 以\
  \ **添加选项卡**。\n   ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_584_0.png)\n   图 12.51：\
  \ 在 Microsoft Teams 中添加选项卡\n3. 在添加选项卡对话框中，搜索 Power BI 并选择 Power BI 应用。\n   图 12.52：\
  \ 在 Microsoft Teams 中添加 Power BI 选项卡\n4. 在 Power BI 对话框中，从工作区、应用或共享给我中选择一个仪表板或报表。\n\
  \   图 12.53： 向 Teams 添加 Power BI 内容\n5. 单击保存按钮。\n6. 报表或仪表板名称将作为团队的选项卡添加。\n7. 如果选中了\
  \ **在此选项卡上向频道发帖**，则会在 **常规**频道的 **发帖**选项卡中出现一条帖子。\n\n恭喜您将第一个 Power BI 报表发布到 Teams！\n\
  \n### 工作原理...\n\n在 Teams 中添加 Power BI 选项卡不会像 **发布到网络**或在 SharePoint Online 中嵌入那样生成嵌入代码，而是利用\
  \ Teams 的功能扩展功能与 Power BI 集成。此外，在 Teams 中创建 Power BI 选项卡并不会授予通过 Teams 分发的仪表板或报表的权限。给定团队的成员必须通过\
  \ Power BI 服务获得 Power BI 内容的权限。\n\n### 更多内容...\n\n在 Microsoft Teams 中向团队添加 Power\
  \ BI 选项卡并不是 Power BI 与 Microsoft Teams 集成的唯一方式。还存在另外两种集成，**在 Teams 中聊天**和将 Power\
  \ BI Windows 10 应用固定到 Teams 导航窗格。要了解这些额外集成的工作方式，请执行以下步骤：\n\n1. 登录 Power BI 服务并打开仪表板、报表或应用。\n\
  2. 在标题栏中，单击 **Chat in Teams**。\n   ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_586_0.png)\n\
  3. 搜索团队或频道以共享 Power BI 内容的链接。\n   ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_586_1.png)\n\
  4. 单击 **Share** 按钮。\n5. 包含指向 Power BI 内容的链接的帖子将被发布到所选团队和频道的 **发帖**选项卡。\n   ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_587_0.png)\n\
  \   图 12.56： Power BI 报表链接共享到 Teams 发帖选项卡\n6. 在 Teams 中，从导航窗格中选择省略号 (...) 并搜索 *Power\
  \ BI*。\n   ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_587_1.png)\n   图 12.57： 在 Teams\
  \ 中添加 Power BI 应用\n7. 选择 Power BI 应用，然后单击 **Add** 按钮。\n"
- "## 13 将 Power BI 与其他应用程序集成\n\nPower BI 工具和服务包括 Power BI Desktop、Power BI Web 服务和\
  \ Power BI 移动应用程序本身就构成了现代、强大的商业智能和分析平台。Power BI Premium 进一步扩展了 Power BI 解决方案的可扩展性和部署选项，使组织能够通过\
  \ Power BI 服务中的应用、嵌入到自定义应用程序中、本地 Power BI 报表服务器或这些分发选项的组合，将 Power BI 内容交付给大量用户。\n\
  \n然而，许多组织要么已经在其他工具中拥有广泛的自助式和企业 BI 资产和技能，例如 Excel、Analysis Services（Azure Analysis\
  \ Services（AAS）或 SQL Server Analysis Services（SSAS））和 SQL Server Reporting Services（SSRS），要么有兴趣将这些工具的独特功能作为其\
  \ Power BI 解决方案的一部分。例如，组织可能会选择保留许多现有的 Excel 报表在 Excel 中，而不是将它们转换为 Power BI 报表，因为\
  \ Excel 具有立方体公式等独特功能。同样，一些组织可能会继续使用现有的 AAS 资源用于语义模型，而不是在一段时间内将这些模型迁移到 Power BI Premium，因为这些模型存在重大的报表依赖关系。此外，鉴于\
  \ Power BI 数据集的许多附加功能和优势，拥有基于旧版 Excel 的数据模型（以前称为 Power Pivot）的组织可能会选择将这些资产迁移到 Power\
  \ BI。\n\n本章中的食谱重点介绍了 Power BI 与 SSRS、Analysis Services、Excel、PowerPoint、Power Apps\
  \ 和 Power Automate 之间的强大集成点。在本章中，我们将介绍以下食谱：\n\n- 集成 SSRS 和 Excel\n- 从 Excel 的 Power\
  \ Pivot 迁移到 Power BI\n- 在 Excel 中访问和分析 Power BI 数据集\n- 将 Power BI 报表构建到 PowerPoint\
  \ 演示文稿中\n- 连接到 Azure Analysis Services\n- 与 Power Automate 和 Power Apps 集成\n- 利用\
  \ Dataverse 和 Dynamics 365\n- 连接 Dynamics 365 Finance and Operations 和 Power Platform\n\
  \n在本章结束时，您将对 Power BI 如何工作以及如何与其他 Microsoft 技术集成有坚实的理解。\n\n### 技术要求\n\n完成本章中的食谱需要以下内容：\n\
  \n- Power BI Desktop\n- Excel\n- Visual Studio\n- 安装了 **AdventureWorksDW2019** 数据库的\
  \ SQL Server。此数据库及其安装说明可在以下位置获得： `http://bit.ly/2OVOfG7`\n- 本章的文件可以从以下 GitHub 仓库下载：\n\
  \  `https://github.com/PacktPublishing/Microsoft-Power-BI-Cookbook-Second-Edition`\n\
  \n### 集成 SSRS 和 Excel\n\nPower BI Desktop 是发布到 Power BI 服务的内容以及嵌入到自定义应用程序中的 Power\
  \ BI 报表可视化的主要报表创作工具。然而，对于许多组织而言，使用 SSRS 和 Excel 构建的现有或遗留报表工作负载的大部分必须维护。在许多情况下，现有的\
  \ SSRS 和 Excel 报表可以转换为现代 Power BI 报表和仪表板，但 Power BI 并不是这些其他工具所有功能和用例的完全替代品。除了通过\
  \ Power BI Premium 支持分页报表（即 SSRS 报表）和针对 Power BI 数据集构建的 Excel 报表的刷新外，Power BI 服务还提供进一步的方法将来自\
  \ Excel 和 SSRS 的内容集成到 Power BI。此外，鉴于 Power BI、Excel 的 Power Pivot 和 Analysis Services\
  \ 的通用数据库引擎和 DAX 语言，BI 团队可以通过编写自定义 DAX 查询来完全控制在 SSRS 和 Excel 中呈现的报表。\n\n本食谱包含两个从\
  \ SSRS 和 Excel 创作和发布内容到 Power BI 的示例。\n\n\n\n\n\n## 准备工作\n\n为准备本配方，请按以下步骤操作：\n\n\
  - 1. 如有必要，请下载、安装并配置 Microsoft SSRS：https://bit.ly/3yfdTjk。\n- 2. 确保 SSRS 已配置为 Power\
  \ BI 集成：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_591_0.png)\n\n图 13.1：Report\
  \ Server Configuration Manager—Power BI 集成\n- 3. **Power BI Integration** 菜单项位于列表底部，并包含\
  \ Power BI 租户名称（ID）。您必须已配置 Web 服务 URL 和 Web 门户 URL 才能配置此设置。\n- 4. 确保已安装 Visual Studio\
  \ 并验证在 Visual Studio 中已安装 **SQL Server Data Tools**、**Workload for Data storage\
  \ and processing** 以及 **Extension for Microsoft Reporting Services Projects**。在\
  \ Visual Studio 中根据需要安装适当的项目。要了解如何安装 Visual Studio，请使用此链接：https://bit.ly/389eozC。\n\
  \n您现在可以完成本配方的步骤。\n\n## 如何操作...\n\n要实现本配方，请执行以下操作：\n\n- 1. 在 Power BI 服务中创建或识别一个用于托管报表内容的\
  \ workspace。\n- 2. 创建或识别此 workspace 中将显示报表内容的工作区仪表板。\n- 3. 在 Visual Studio 中创建新的\
  \ Report Server Project 或打开现有项目。\n- 4. 将 AdventureWorksDW2019 数据库配置为项目的共享数据源：\n\n\
  ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_592_0.png)\n\n图 13.2：Report Server Project\
  \ —SQL 数据库的共享数据源配置\n- 5. 右键单击 Reports 文件夹并选择 Add New Report。\n- 6. 右键单击 Data Sources\
  \ 并选择 Add Data Source...\n- 7. 选择 Shared data source 选项，选择步骤 4 中创建的共享数据源，然后按 Next>\
  \ 按钮。\n- 8. 构建自己的查询或使用以下查询：\n\n```\nSELECT\nvProducts.ProductKey AS [vProducts ProductKey]\n\
  ,vProducts.EnglishProductSubcategoryName\n,vProducts.EnglishProductName\n,vProducts.DaysToManufacture\n\
  ,vProducts.Color\n,FactInternetSales.ProductKey AS [FactInternetSales ProductKey]\n\
  ,FactInternetSales.OrderQuantity\n,FactInternetSales.UnitPrice\n,FactInternetSales.DiscountAmount\n\
  ,FactInternetSales.SalesAmount\n,FactInternetSales.TaxAmt\n,FactInternetSales.Freight\n\
  ,vProducts.EnglishProductCategoryName\n,FactInternetSales.OrderDate\nFROM\n    vProducts\n\
  \    INNER JOIN FactInternetSales\n        ON vProducts.ProductKey = FactInternetSales.ProductKey\n\
  ```\n- 9. 单击 **OK** 按钮退出 **Query Designer**，然后单击 **Next>** 按钮。\n- 10. 选择 **Tabular**\
  \ 并单击 **Next>** 按钮。\n- 11. 单击 **Finish>>** 按钮。\n- 12. 单击 **Finish** 按钮。\n- 13. 删除中央设计面板（设计表面）中创建的表格。\n\
  - 14. 使用数据集创建用于固定的 SSRS 报表可视化对象。图表、仪表板、地图和图像可以从 SSRS 固定到 Power BI 仪表板。\n- 15. 将\
  \ SSRS 报表部署到 SSRS 门户中的报表文件夹并确认其正确呈现：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_593_0.png)\n\
  \n图 13.3：将 SSRS 报表可视化对象固定到 Power BI 仪表板\n- 16. 单击 Power BI 图标，然后单击要固定的报表中的图表。\n\
  - 17. 选择 **Workspace**、**Dashboard** 和 **Frequency of updates**：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_593_1.png)\n\
  \n图 13.4：从 SSRS 固定到 Power BI\n- 18. 单击 **Pin** 按钮。\n- 19. 在 SSRS 门户中，单击齿轮图标并选择 **My\
  \ subscriptions** 以确认 **Power BI Dashboard** 订阅：\n\n| Edit | Report | Description\
  \ | Status | Type | Folder | Delivery |\n|---|---|---|---|---|---|---|\n|  | Top\
  \ 100 Customers |  | Enabled | Standard | /AdventureWorks Reports | Power BI Dashboard\
  \ |\n\n图 13.5：SSRS 中的我的订阅\n- 20. 在 Power BI 服务中，调整仪表板磁贴的大小、位置，并可选择标题和副标题。\n- 21.\
  \ 单击仪表板磁贴以测试 URL 是否在 SSRS 门户中打开报表。设置链接在单独的选项卡中打开。\n\n本配方现已完成。\n\n## 其工作原理...\n\n\
  微软已明确表示 Power BI 和 SSRS 是为独特的 BI 工作负载和场景而设计的，组织可以选择最适合其特定项目的工具，以及在同一解决方案和整体 BI 部署中使用多个报表创作工具。Power\
  \ BI 专为现代、交互式和丰富的数据探索体验而设计。\n\nSSRS 现已包含在 Power BI Report Server 中，继续提供强大的企业报表功能，具有更新的分页报表对象，适用于操作性报表和分发功能，例如订阅。\n\
  \n在某些报表场景中，具有完全配置的页面和在 Visual Studio SSRS 项目中定义的报表布局的分页或“经典”报表是合适的。此外，对于只能在本地部署\
  \ BI 或某些 BI 内容（如高度敏感的报表）必须保留在本地的组织，Power BI Report Server 提供单一的本地解决方案和门户，可同时包含传统的\
  \ SSRS 报表以及可选的 Power BI 报表。最后，Power BI Premium 包含将 SSRS 分页报表部署到 Power BI 服务的功能。\n\
  \n在相对简单的表格报表文档需要跨组或团队分发或以 PDF 或 Excel 等特定文件格式提供时，操作性报表工作负载非常适合 SSRS。分页 SSRS 报表可以通过报表参数和图表提供基本的用户交互和数据可视化，但这并非其优势或核心用例。请注意，SSRS\
  \ 还具有移动报表类型和 Microsoft SQL Server Mobile Report Publisher 中的移动报表创作工具。Power BI 支持个人用户对报表的电子邮件订阅，但\
  \ SSRS 支持基于订阅者信息（如东部地区或销售经理）将参数应用于报表的基于数据驱动的报表订阅。\n\n未来对 Power BI 报表和仪表板订阅功能的改进，以及对表格和矩阵可视化的更大控制和\
  \ Power BI Premium 专属硬件，可能会使 Power BI 承担传统上由 SSRS 处理的更大份额的报表工作负载。\n\n## 还有更多...\n\
  \n除了与 SSRS 构建集成外，微软还将另一款流行的 BI 工具 Excel 与 Power BI 集成。要演示 Excel 与 Power BI 的集成，请执行以下操作：\n\
  \n- 1. 确认 Excel 报表内容使用 Excel 数据模型作为其数据源。只有具有数据模型的工作簿才能在 Power BI 服务中配置为计划刷新。有关如何使用\
  \ Excel 数据模型构建 Excel 报表的详细信息，请使用此链接：https://bit.ly/3j9AY0B。\n- 2. 识别 Excel 数据模型使用的数据源，并在必要时将其添加到本地数据网关。\n\
  - 3. 在 DAX Studio 中开发和测试 DAX 查询，以便在 Excel 中用作数据集和表。\n- 4. 打开包含数据模型的 Excel 工作簿。\n\
  - 5. 从 Data 选项卡中，单击 Existing Connections 并选择用于加载数据模型的一个查询。选择其中一个较小的维度表查询，例如 Currency：\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_595_0.png)\n- 10. 按 **OK** 按钮。\n- 11.\
  \ 选择 **File**，然后从 Excel 功能区选择 **Publish**。\n- 12. 在 **Publish** 对话框中，选择工作区然后单击 **Upload**\
  \ 按钮：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_597_0.png)\n\n图 13.10：将 Excel\
  \ 数据模型上传到 Power BI 工作区\n- 13. 打开 Power BI 服务并导航到包含已发布 Excel 工作簿的工作区。\n- 14. 从工作区的\
  \ **Workbooks** 菜单中，选择三个垂直点然后选择 **Schedule refresh**。\n- 15. 将数据源与数据网关关联，单击 **Apply**，然后安排数据刷新：\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_597_1.png)\n\n图 13.11：工作簿的网关配置\n- 16.\
  \ 选择工作簿以打开报表。选择整个表格然后单击 **Pin**。\n\n\n\n\n\n在本简短的配方中，一个数据模型及其包含在 Excel 工作簿中的源 M\
  \ 查询通过导入 Excel 工作簿到 Power BI Desktop 迁移功能迁移到 Power BI 数据集。有关导入的工作簿内容以及 Excel 到 Power\
  \ BI 迁移的其他选项和注意事项的更多详细信息，请参阅 *How it works...* 和 *There's more...* 部分。\n\n## Getting\
  \ ready\n\n分析 Excel 工作簿以识别可以导入到 Power BI Desktop 的组件。例如，Excel 工作表中的数据表或数据范围将不会被导入，但\
  \ Excel 数据模型中的表将被导入。同样，Excel 中的 Power View 报表工作表及其可视化效果将通过标准 Excel 图表迁移，数据透视表和工作表公式和格式将不会迁移。\n\
  \n在某些情况下，可能需要修改 Excel 工作簿以建立将被迁移的数据源连接和查询。此外，可能需要使用 Power BI Desktop 报表制作可视化效果重新创建\
  \ Excel 特定的报表可视化效果，例如数据透视表和图表。包含大量自定义内容（如 VBA 宏和复杂的 Excel 公式逻辑）的工作簿可能需要对 Excel 工作簿或\
  \ Power BI Desktop 模型进行大量修改，或两者结合，以支持迁移。\n\n## How to do it...\n\n要实现此配方，请执行以下操作：\n\
  \n- 1. 保存或下载最新的 Excel 工作簿\n- 2. 打开一个新的 Power BI Desktop (PBIX) 文件\n- 3. 从 **Report\
  \ View**，点击 **File | Import | Power Query, Power Pivot, Power View**\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_599_0.png)\n\
  \nFigure 13.13: Import queries and models created in Excel to Power BI\n\n- 4. 选择\
  \ Excel 文件并点击 **Open** 按钮\n\n您的新 Power BI 数据集现在可在 Power BI 服务中使用。如果需要，您甚至可以针对此数据集创建新的实时连接报表。\n\
  \n## How it works...\n\n迁移可能需要几分钟时间，具体取决于导入的数据模型的大小。Power BI Desktop 导入 M 查询、数据模型表、DAX\
  \ 度量值和 KPI，以及任何用于 Excel 的 power view 工作表。\n\n对于严重依赖不导入的项目（如 Excel 公式、标准 Excel 表（非模型表）、工作表范围数据、标准\
  \ Excel 图表和条件格式）的工作簿，可能需要在一定程度上继续支持。例如，可以将最少量的数据导入到 Excel 的数据模型中以继续驱动基于 Excel 的报表，并将此工作簿上传到\
  \ Power BI 服务并进行刷新。\n\nPower BI 表和矩阵可视化效果包含 Excel 数据透视表最重要的功能，例如丰富的条件格式选项、在行上显示多个度量值、在行和列上钻取上下层级、控制小计可见性、分步或交错布局、行/列/总计百分比等。这些增强功能以及\
  \ Power BI 报表独有的强大交叉高亮显示功能，使得将大多数基于 Excel 数据透视表的报表迁移到 Power BI 成为可能且有利。\n\n例如，如果\
  \ Power Pivot for Excel 工作簿包含多个数据透视表、数据透视图和标准 Excel 图表的工作表，则可以开发包含相同度量值和属性的新 Power\
  \ BI 报表作为替代方案。将数据模型和报表完全迁移到 Power BI 后，可以将 Excel 工作簿从 Power BI 服务或任何刷新和分发流程中移除。\n\
  \n## There's more...\n\n如果尽管迁移后仍需要某些 Excel 特定内容，可以将 Power Pivot for Excel 数据模型上传到同一工作区，并在\
  \ Power BI 服务中为此工作簿配置刷新计划。这可以通过从 Excel 功能区选择 File 然后选择 Publish 来完成。一旦文件发布到 Power\
  \ BI 服务的工作区，Power Pivot 数据集将出现在工作区的数据集中，而 Excel 工作簿将出现在工作区的 Workbooks 中。\n\n还可以通过在服务底部左侧使用\
  \ **Get Data** 链接，然后选择 **Files** 来将工作簿添加到 Power BI 服务：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_602_0.png)\n\
  \nFigure 13.16: Publish Excel workbook with Data Model to Power BI—upload\n\nExcel\
  \ 中的 **Export** 选项等同于本配方中从 Power BI Desktop 导入迁移到 Power BI 的过程，只是新数据集已发布到 Power\
  \ BI 服务的工作区中。然而，不推荐这种迁移方法，因为您将失去从 Power BI 服务下载创建的数据集 PBIX 文件的能力。按照本配方先导入到 Power\
  \ BI Desktop，可保留此选项。\n\n## See also\n\n- - Import Excel workbooks into Power BI\
  \ Desktop: https://bit.ly/3eI4gBG\n\n## Accessing and Analyzing Power BI Datasets\
  \ in Excel\n\n通过在 Power BI 服务中托管的集中且可能已认证的 Power BI 数据集，拥有免费和专业版许可证的 Excel 用户可以充分利用\
  \ Excel 熟悉的界面以及高级功能和用例，例如立方体公式和自定义 DAX 查询。\n\n尽管这些 Excel 报表与 SSRS 分页报表一样，只是 Power\
  \ BI 服务中 Power BI 报表和仪表板的补充，但在具有自定义格式和许多度量值和列的记分卡布局中通常很有用。\n\n在此场景中，经验丰富的 Excel\
  \ 用户可以利用已发布 Power BI 数据集的性能、规模和自动刷新来创建自定义、完全格式化的 Excel 报表。此外，Excel 报表作者可以灵活地在数据集之上应用报表范围的逻辑，使用熟悉的技术，这些自定义可以为\
  \ BI 团队或数据集所有者提供现有差距或所需增强的信息。\n\n本配方包含两个访问和分析 Power BI 数据集在 Excel 中的示例。第一个示例使用立方体公式和\
  \ Excel 切片器生成交互式模板报表。第二个示例将自定义 DAX 查询传递给 Power BI 数据集以支持 Excel 地图。有关 Excel 中立方体函数和新\
  \ Excel 可视化的更多详细信息包含在支持部分中。\n\n## Getting ready\n\n为准备本配方，请执行以下步骤：\n\n- 1. 确保用户拥有\
  \ Power BI Pro 许可证。\n- 2. 确认 Power BI Pro 用户有权访问包含 Power BI 报表和数据集的工作区。\n- 3. 选择用于分析的报表。例如，如果您已完成\
  \ *Chapter 5, Working in the Service* 中的配方，**CH5_R1_CountryMonthlyReport** 是一个不错的选择。您可以从\
  \ GitHub 下载此报表的 PBIX 并将其发布到 Power BI 服务。\n\n您现在可以完成本配方。\n\n## How to do it…\n\n\
  要实现此配方，请执行以下操作：\n\n- 1. 在 Power BI 服务中打开所选报表\n- 2. 在报表的页眉/功能区中，选择 **Export** 然后选择\
  \ **Analyze in Excel**\n- 3. 打开从 Power BI 服务下载的 Excel 文件\n\n## Integrating Power\
  \ BI with Other Applications\n\n- 4. 点击数据透视表并从数据集中添加度量值和列：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_604_0.png)\n\
  \nFigure 13.17: Excel Pivot Table with two Slicers based on the Power BI dataset\n\
  \n- 5. 在数据透视表中选择一个单元格\n- 6. 从 **PivotTable Analyze** 选项卡中选择 **OLAP Tools** 下拉菜单并点击\
  \ **Convert to Formulas**：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_604_1.png)\n\
  \nFigure 13.18: Convert to Formulas Option in the PivotTable Analyze Tab of Excel\n\
  \n## How it works...\n\n数据透视表被转换为 Excel 公式，例如以下内容：\n\n```\n```excel\n=CUBEVALUE(\"\
  pbiazure://api.powerbi.com <id> Model\",$A3,C$2, Slicer_Sales_Territory_Hierarchy)\n\
  ```\n```\n\n在此示例中，工作簿单元格 **C3** 引用单元格 **A3** 中的 **Total Net Sales** 度量值和单元格 **C2**\
  \ 中的 **2011-Jan** 维度值。请注意，两个 Excel 切片器可视化效果仍与每个 CUBEVALUE 公式单元格连接，因此可用于过滤报表。日历月份（例如\
  \ 2011-Jan）被转换为对特定值进行硬编码引用的 CUBEMEMBER 函数。这些公式必须由 Excel 报表作者维护和/或更新：\n\n```\n```excel\n\
  =CUBEMEMBER(\"pbiazure://api.powerbi.com <id> Model\",\"[Dates].[Year Month].&[2011-Jan]\"\
  )\n```\n```\n\nExcel 报表作者可以快速学习自定义立方体公式，例如应用不同的过滤器并支持报表更改，包括新的度量值（行）和属性值（列）。\n\n\
  CUBEVALUE 和 CUBEMEMBER 函数是最常见的立方体函数，但也可以使用其他函数，例如 CUBESETCOUNT。Excel 中的 **Formulas**\
  \ 界面提供每个函数的参数信息。在更高级的场景中，可以为立方体公式分配 **Named Ranges**，并可选择性地为报表中的其他公式分配，然后作为参数传递到立方体公式中：\n\
  \n```\n```excel\n=CUBEMEMBER(strConn,\"[PeriodStart].[Period Start].[\"&SPUser&\"\
  ]\")\n```\n```\n\n在此示例中，strConn 是 Excel 中包含 Power BI 数据集数据连接名称的 **Named Range**。PeriodStart\
  \ 是数据模型中一个断开连接且隐藏的 PeriodStart 表中的列，而 SPUser 是反映 Excel 中经典组合框窗体控件上业务用户选择的命名范围。单独的\
  \ CUBEVALUE 函数可以引用此 CUBEMEMBER 函数，以便用户在简单的 Excel 控件中的选择可以通过立方体函数传递到源数据集并在报表中反映。\n\
  \n## There's more...\n\n一旦 Analyze in Excel 创建了 Power BI 数据集与 Excel 之间的连接，此连接可用于创建额外的报表元素。要了解如何操作，请执行以下操作：\n\
  \n- 1. 在本地打开的同一 Excel 工作簿中，创建一个 **New sheet**。\n- 2. 从 **Data** 选项卡的功能区中选择 **Existing\
  \ Connections**。\n\n\n\n\n\n## 将 Power BI 与其他应用程序集成\n\n- 3. 在 **现有连接** 对话框中，选择 Power\
  \ BI 连接并选择 **打开** 按钮。\n- 4. 在 **导入数据** 对话框中，选择 **数据透视表报表** 然后选择 **确定** 按钮。\n- 5.\
  \ 创建一个简单的数据透视表报表，包含一个度量值和一个属性，例如按 **产品类别** 的 **Internet Net Sales**。\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_606_0.png)\n\
  \n    图 13.19：基于 Power BI 服务数据集的 Excel 数据透视表\n\n- 6. 双击其中一个度量值单元格，例如 **$339,773**\
  \ 以执行“下钻”查询。底层 **Internet Sales** 事实表的全部列将被检索，并按 **Clothing** 类别进行筛选。\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_606_1.png)\n\
  \n    图 13.20：下钻的 Excel 表结果\n\n- 7. 在 Excel 表中选择一个单元格，右键单击并选择 **表格** 然后 **编辑查询**...\n\
  \n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_606_2.png)\n\n    图 13.21：Excel 表格选项\n\
  \n- 8. 在 **命令文本** 区域中，输入（或粘贴）自定义 DAX 查询并单击 **确定。**\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_607_0.png)\n\
  \n    图 13.22：从 DAX Studio 粘贴到编辑 OLE DB 查询对话框的命令文本区域中的 DAX 查询\n\n- 9. 如果查询有效，Excel\
  \ 表将更新以返回查询中指定的列。\n- 10. 可视化对象，例如地图可视化对象，可以使用此表（DAX 查询）作为其数据源。\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_607_1.png)\n\
  \n    图 13.23：DAX 查询的 Excel 表结果（左）和 Excel 地图可视化对象（右）\n\n可在 **连接属性** 中的 **OLAP 下钻**\
  \ 属性中调整要检索的行数。可视化对象上应用了自定义数据标签格式，以千为单位并保留一位小数表示值。请注意，默认数据透视表不能用作此可视化对象或其他多个新 Excel\
  \ 可视化对象的源。\n\n### 另请参阅\n\n- Analyze in Excel: https://bit.ly/3bIMSeM\n- CUBEVALUE\
  \ function: https://bit.ly/3DfftUA\n- CUBEMEMBER function: https://bit.ly/3AXr1Kq\n\
  \n## 将 Power BI 报表构建到 PowerPoint 演示文稿中\n\nMicrosoft PowerPoint 仍然是标准的幻灯片演示应用程序，而将外部工具中的数据分析和可视化集成到演示文稿中通常是有效演示文稿的重要组成部分。为响应大量客户请求，Power\
  \ BI 服务支持将 Power BI 报表导出为 PowerPoint 文件的功能。Power BI 报告的每个页面都会转换为独立的 PowerPoint 幻灯片，并且\
  \ Power BI 服务会根据报表和相关元数据（例如最后刷新日期）创建标题页。存在一些当前限制，例如导出的文件是静态的以及支持的可视化对象，但该功能可供所有\
  \ Power BI 用户使用，以简化演示文稿幻灯片的创建。然而，更深层次的集成计划在未来实现，包括将动态 Power BI 报表嵌入到 PowerPoint\
  \ 中的能力。\n\n本食谱包含一个准备过程，以更好地利用导出到 PowerPoint 的功能并避免当前限制。此外，还描述了一个用户从已发布的应用程序导出 Power\
  \ BI 报表并在 PowerPoint 中访问内容的示例过程。\n\n### 准备就绪\n\n为准备本食谱，请执行以下步骤：\n\n- 1. 登录到 Power\
  \ BI 服务。\n- 2. 单击右上角的齿轮图标并选择 **管理门户**。\n- 3. 单击 **租户设置**。\n- 4. 在 **导出和共享** 下，在\
  \ Power BI 管理门户中启用 **导出报表为 PowerPoint 演示文稿或 PDF 文档** 功能：\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_609_0.png)\n\
  \n    *图 13.24：Power BI 管理门户中的租户设置*\n\n    如前面的屏幕截图所示，Power BI 管理员或 Office 365 全局管理员还可以将该功能限制为特定的安全组。\n\
  \n- 5. 确定将作为要创建的 PowerPoint 的来源的 Power BI 报表及其数据集。\n- 6. 如果报表包含多个页面，请统计报表页面的数量。目前超过\
  \ 15 页的报表无法导出。\n- 7. 确定报表中是否有任何不受支持的可视化对象，包括 R 可视化对象和未通过认证的自定义可视化对象。\n- 8. 检查报表可视化对象中是否使用了任何背景图像或是否设置了任何自定义页面大小。最好避免使用背景图像和自定义页面大小。\n\
  - 9. 根据之前的步骤和导出的初始测试，对现有报表进行修订或创建单独的报表（以当前报表为起点），该报表将专门用于 PowerPoint。\n\n现在您可以完成本食谱的步骤。\n\
  \n### 如何操作...\n\n要实施本食谱，请执行以下操作：\n\n- 1. 在 Power BI 服务中打开报表。\n- 2. 从报表标题中选择导出，然后选择\
  \ PowerPoint。\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_610_0.png)\n\n   \
  \ 图 13.25：导出到 PowerPoint\n\n- 3. 导出对话框提供选项，单击导出按钮。\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_610_1.png)\n\
  \n    图 13.26：PowerPoint 的导出选项\n\n- 4. 消息将指示导出正在进行中，可能需要几分钟。\n- 5. 打开 PowerPoint\
  \ 文件并在 PowerPoint 中根据需要进行额外调整。\n\n    ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_610_2.png)\n\
  \n    图 13.27：Microsoft PowerPoint 幻灯片排序视图中的已导出 Power BI 报表\n\n正如您所见，导出到 PowerPoint\
  \ 非常容易！\n\n### 其工作原理...\n\n根据浏览器及其下载设置，文件将下载到特定路径，或浏览器会显示保存或打开 PowerPoint 文件的消息。导出过程会自动生成标题页，其中包含报表名称和指向\
  \ Power BI 服务中报表的链接。标题页还包括最后数据刷新和下载日期时间值。每个报表页面都会转换为包含报表页面高质量渲染图像的幻灯片。针对可视化对象指定的任何替代文本都包含在每个页面的备注中。\n\
  \n与执行仪表板等高可见性内容的其他规划和预防措施类似，了解和确信数据源、刷新过程、数据质量和所有权非常重要。例如，如果源数据集从多个来源检索，包括临时 Excel\
  \ 文件，并且刷新失败的历史记录，则该报表可能不是 PowerPoint 演示文稿的良好候选者。基于已验证的 IT 管理的 Analysis Services\
  \ 模型并且拥有明确所有者的报表将是更好的选择。\n\n背景图像将被图表的边界区域裁剪，因此建议删除或避免背景图像。此外，导出的报表页面始终会生成标准 16:9\
  \ PowerPoint 幻灯片大小，因此应避免自定义或非标准页面大小。用于提供自定义分组、边框和可视化对象背景色的形状（例如矩形和线条）也可能需要删除以实现正确的\
  \ PowerPoint 渲染。最后，在使用导出到 PowerPoint 的报表中应避免使用未认证的可视化对象、R 可视化对象和 Python 可视化对象。\n\
  \n### 更多内容...\n\nPower BI 服务支持通过 Power BI REST API 将报表导出为 PowerPoint 或 PDF 以及图像文件。此外，分页报表还可以导出为以下其他格式：\n\
  \n- MHTML\n- Microsoft Word\n- XML\n\nAppSource 中提供了一个第三方加载项，用于将 Power BI 服务中的 Power\
  \ BI 瓷砖集成到 Microsoft Office 文档中，名为 Power BI Tiles：https://bit.ly/3w2sUmq。DevScope\
  \ 的产品包括自动化的 Office 到 Power BI 刷新流程，并支持 Word、Outlook 和 PowerPoint。\n\n\n\n\n\n##\
  \ 将 Power BI 与其他应用程序集成\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_613_0.png)\n\n\
  请注意，租户可以被视为公寓楼中的一间公寓。Microsoft Azure 中的 Power BI 服务类似于大楼，提供基础、管道和其他公共设施。然而，Power\
  \ BI 服务中的每个居民都有自己的私人生活区域（租户）。\n\n3. 登录 Microsoft Azure 门户，https://portal.azure.com。\n\
  4. 选择 **创建资源**。\n5. 搜索 **Analysis Services** 并选择 **创建**。\n6. 通过填写必填字段创建 Azure Analysis\
  \ Services 服务器：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_613_1.png)\n\n为了获得最小的延迟，所选位置应与\
  \ *准备工作* 中 Power BI 租户的位置相匹配。需要标准或开发层 Azure Analysis Services 实例才能从 Power BI Desktop\
  \ 导入。\n\n7. 点击 **创建** 并等待服务器在 Azure 门户中可见（通常不到一分钟）。\n8. 导航到 **Analysis Services**\
  \ 资源并打开该实例。\n9. 在 **模型** 下，选择 **管理**。\n10. 选择 **新建模型**，选择 **示例数据**，然后点击 **添加** 按钮。\n\
  \n一个新的名为 **adventureworks** 的模型将被添加到你的 Analysis Services 实例中。\n\n### 如何操作...\n\n\
  要实现此配方，请执行以下操作：\n\n1. 在 Analysis Services 资源打开的情况下，点击 **概述** 并获取 **服务器名称**。\n\n\
  ![](img/0b67f3eabca89f1e12f62eac78fb9ffb_614_0.png)\n\n2. 如果服务器上有多个模型，请确认模型名称并选择要连接到的透视（可选）。Azure\
  \ 门户中也会列出 AAS 服务器上的所有模型。\n3. 打开一个新的 Power BI Desktop 文件，点击 **获取数据**，并选择 **Analysis\
  \ Services**。\n4. 输入或粘贴服务器名称和数据库（模型名称），然后按 **确定** 按钮：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_614_1.png)\n\
  \n5. 使用 **Microsoft 账户** 进行身份验证。\n6. 创建 Power BI 报表并将其发布到 Power BI 服务中的工作区。\n\n\
  正如你所见，连接到 Analysis Services 数据库非常简单直接。\n\n### 其工作原理...\n\n**实时连接** 是默认选项，并且这应该代表绝大多数如果不是全部连接，因为数据已经导入到（或在\
  \ SSAS DirectQuery 模型的情况下从中连接）Azure Analysis Services 数据库。导入数据到 Power BI Desktop\
  \ 将需要其自己的刷新过程，但在某些罕见场景中，DAX 查询可以从 AAS 数据库中检索，然后选择性地将此数据与其他数据源在 Power BI Desktop\
  \ 中合并或集成。\n\n就像 Power BI Desktop 报表与 Power BI 服务中数据集的实时连接一样，报表作者也可以为与 Analysis Services\
  \ 的实时连接创建特定于给定报表的 DAX 度量。此功能使熟悉 DAX 的报表作者能够满足报表独特的指标需求。如果相同的报表级度量在多个报表中被重复创建，负责\
  \ Analysis Services 模型的 BI/IT 团队可以考虑将此逻辑实现到模型中。\n\nAzure Analysis Services 实例按小时计费，根据\
  \ **QPUs（查询处理单元）** 和内存计费。一个虚拟核心大约等于 20 QPUs。例如，S4 实例拥有 400 QPUs，大约有 20 个虚拟核心和 100\
  \ GB RAM：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_615_0.png)\n\n图 13.32：Azure\
  \ Analysis Services 实例定价\n\nAzure Analysis Services 服务器可以暂停，并且在服务器暂停期间不会产生费用。此外，服务器的定价层可以上下移动服务层，例如从\
  \ S1 到 S3 或反之亦然。服务器也可以从较低的服务层升级，例如从开发版到标准版，但服务器不能从较高的服务层降级。\n\n### 还有更多...\n\n鉴于\
  \ Power BI 和 Analysis Services Tabular 共享相同的数据库引擎，并且由于 Azure Analysis Services 消除了通过本地数据网关在\
  \ Power BI 服务与本地服务器之间通信的查询延迟和基础设施成本，组织可以考虑将 Power BI 和 SSAS 模型迁移到 Azure Analysis\
  \ Services。作为一个示例，模型的源数据如 Teradata 可以保留在本地，但模型表和表分区的计划或触发刷新过程将通过本地数据网关更新 Azure 主持的模型。除了\
  \ Azure Analysis Services 平台即服务（PaaS）提供的其他成本和灵活性优势之外，Power BI Premium 容量可以使所有业务用户访问构建在\
  \ Azure Analysis Services 模型之上的 Power BI 报表和仪表板。一旦迁移到 Azure Analysis Services，表格模型可以作为\
  \ Power BI 报表的源进行访问。\n\n### 另请参阅\n\n- Azure Analysis Services: https://azure.microsoft.com/en-us/services/analysis-services/\n\
  - 连接到 Azure Analysis Services 的客户端库: http://bit.ly/2vzLAv0\n\n### 与 Power Automate\
  \ 和 Power Apps 集成\n\nPower BI 的工具和服务旨在从数据中得出意义和洞察力，并使这些洞察力可供他人访问。虽然这两种功能都很重要，但 Power\
  \ BI 本身并不打算对分析可视化的数据采取行动或执行业务决策。此外，信息工作者经常与许多应用程序或服务交互，因此，为了保持生产力，需要在 Power BI 与这些应用程序之间自动化工作流并嵌入逻辑，以简化业务流程。Power\
  \ Apps 和 Power Automate 都是 Microsoft 365 应用程序，是与 Power BI 一起构成业务应用程序平台的一部分，通过使业务用户能够创建自定义业务应用程序和工作流流程来满足这些需求。\n\
  \n在本配方中，创建了一个 Power Automate 工作流来支持 Power BI 服务中的流式数据集。具体来说，Power Automate 工作流被配置为每两分钟从本地\
  \ SQL Server 表中读取，并将此数据推送到 Power BI，以提供接近实时的可见性并支持数据驱动的警报和通知。\n\n### 准备工作\n\n为准备此配方，请执行以下步骤：\n\
  \n1. 打开 **SQL Server Management Studio (SSMS)**，连接到包含 **AdventureWorksDW2019** 数据库的本地\
  \ SQL 数据库，并熟悉 **dbo.FactSurveyResponse** 表的 **列**：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_617_0.png)\n\
  \n2. 确保你有一个与 Power Automate 兼容的数据网关正在运行。有关安装说明，请参阅 *第 1 章，配置 Power BI 工具*。\n\n在本配方中，使用本地数据网关通过\
  \ Power Automate 从本地 SQL Server 数据库表支持 Power BI 流式数据集。根据先前章节，支持 Power BI 刷新过程和实时连接或\
  \ DirectQuery 模型的同一网关也可以用于 Power Apps 和 Power Automate。根据这些不同活动和应用程序产生的负载，以及基于网关资源监控，可能有必要将\
  \ Power Apps 和 Power Automate 隔离到专用的本地网关，或在未来向高可用性网关集群添加服务器。\n\n### 如何操作...\n\n\
  要实现此配方，请执行以下操作：\n\n1. 在 Power BI 服务中打开一个工作区，并在顶部菜单栏中点击 **新建** 按钮。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_618_0.png)\n\
  \n图 13.34：Power BI 服务中工作区的新建选项\n\n2. 选择 **流式数据集**，点击 **API** 图标，然后点击 **下一步** 按钮。\n\
  3. 配置流式数据集以与 **FactSurveyResponse** 表的列和数据类型保持一致。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_618_1.png)\n\
  \n图 13.35：流式数据集配置\n\n\n\n\n+   4. 输入**数据集名称**，启用**历史数据分析**设置，并单击**创建按钮**。\n+   5.\
  \ 复制**推送 URL** 值，并单击**完成按钮**。\n+   6. 登录 Microsoft 365 中的 Power Automate：https://flow.microsoft.com。\n\
  +   7. 在左侧导航窗格中，单击**创建**。\n+   8. 在**从空白开始**区域中，单击**计划云流**。\n+   9. 提供**流名称**，将工作流设置为**每\
  \ 5 分钟重复一次**，然后点击**创建按钮**。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_619_0.png)\n\
  \n图 13.36：创建 Power Automate 工作流\n\n+   10. 在设计屏幕上，单击**新建步骤**。\n+   11. 搜索 SQL Server，然后在**操作**中选择**获取行\

  ## 增强报表\n\n许多报表功能可以为报表提供更丰富的上下文，并增强自助式数据探索体验。其中三项功能是工具提示、工具提示页和钻取报表页。\n\n在本操作指南中，我们将逐步介绍如何使用工具提示、工具提示页和钻取报表页来增强我们的报表。\n\
  \n## 准备工作\n\n若要为此操作指南做准备，请按照以下步骤操作：\n\n- 1. 打开 CH4_R7.pbix 文件，并将文件另存为 CH4_R8.pbix。\n\
  - 2. 切换到 Scratch 页，按 Ctrl-A 后按 Delete，删除所有视觉对象。\n- 3. 检查“筛选器”窗格，确保只有 Europe 筛选器处于活动状态。\n\
  \n## 如何增强报表\n\n要实施本操作指南，请执行以下步骤：\n\n- 1. 选择 Germany 页。\n- 2. 选择“形状地图”视觉对象。\n- 3.\
  \ 在字段井中，将 Internet Sales 表中的“Internet Net Sales”、“Internet Margin %”和“Internet Sales\
  \ Per Customer”度量值添加到“工具提示”字段。\n- 4. 将鼠标悬停在已着色的德国州上，即可在工具提示弹出窗口中看到新的度量值：\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_234_0.png)\n\
  \n- 5. 创建一个名为 **Product Tooltip** 的新**页面**。\n- 6. 在 **格式**窗格中，展开 **页面信息**部分，然后将\
  \ **工具提示**切换为 **开**。\n- 7. 展开 **页面大小**部分，并将 **类型**更改为 **工具提示**。\n- 8. 创建 **簇状条形图**视觉对象，并调整其大小以占满整个页面。\n\
  - 9. 将 Products 表中的 **Product Subcategory**列添加到 **轴**。\n- 10. 将 Internet Sales 表中的\
  \ **Internet Net Sales**度量值添加到 **值**。\n- 11. 在 **筛选器**窗格中，对 **Product Subcategory**应用视觉级筛选器，选择按\
  \ **Internet Net Sales**排序显示前 5 项的 **Top N**筛选器。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_235_0.png)\n\
  \n图4.42：工具提示视觉筛选器\n\n- 12. 在 **Germany**页上，选择 **表视觉对象**。\n- 13. 在 **格式**窗格中，将 **工具提示**切换为\
  \ **开**。\n- 14. 展开 **工具提示**部分，将 **类型**设置为 **报表**页，并将 **页面**设置为“Product Tooltip”。\n\
  \n15. 将鼠标悬停在表中任意单元格上时，会弹出 Product Tooltip 页，作为该行产品类别下子类别的工具提示。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_236_0.png)\n\

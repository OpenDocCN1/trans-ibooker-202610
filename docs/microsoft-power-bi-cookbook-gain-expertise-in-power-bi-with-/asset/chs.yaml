  \ Days Since Last Purchase\n\n基于这些集群的一个潜在用例或行动是，专注于将最近购买过的 **Cluster1** 客户转化为更高价值的\
  \ **Cluster3** 客户。此外，**Cluster2** 客户可能已经转向了新的自行车供应商，或者更乐观地说，可能在两到三年前购买过自行车，并且可能不知道有哪些自行车相关配件和服装可供选择。\n\
  \n### How it works\n\n特征工程是数据科学中的常见做法，其中向数据集添加新列以生成更准确的模型。新列通常包含内置逻辑，并且根据生成的模型迭代地添加、删除和修改特征（列）。通过以不同的方式表示维度，识别对算法增加最多价值的度量。本示例中用于支持聚类的三个度量值遵循\
  \ RFM 技术，识别客户购买历史的最近性、频率和货币价值。添加涵盖 RFM 各组成部分的度量值（特征工程）对于各种营销和客户流失分析非常有用。\n\n遵循 RFM\
  \ 技术，**Days Since Last Purchase** 度量值识别最近性，**Internet Sales Orders** 度量频率，而 **Internet\
  \ Net Sales** 度量货币价值。**Last Purchase Date** 度量值是为支持 **Days Since Last Purchase**\
  \ 度量值而创建的中间度量值。**Days Since Last Purchase** 使用 **Last Purchase Date** 度量值和 **Today**\
  \ 度量值作为 DATEDIFF 函数的参数输入。在生产场景中，**Today** 度量值将使用 TODAY 函数而不是硬编码的 DATE。\n\n本示例中创建了三个集群。这些集群由添加到数据模型中\
  \ **Customers** 表的一列表示，其名称在 **Clusters** 对话框中提供，**Customers (RFM)**。集群列在 **Fields**\
  \ 列表中以两个重叠的正方形形状标识，并且可以通过右键单击该列或选择该列旁边的省略号来提供 **Edit clusters** 选项。\n\n对于分析度量值 **Average\
  \ Customer Sales**、**Average Customer Orders** 和 **Average Days Since Last Purchase**，使用\
  \ **AVERAGEX** 函数遍历由 **DISTINCT** 函数提供的唯一客户键，以计算客户特定的值（销售额、订单数和购买天数），然后返回每个集群的度量值的平均值。\n\
  \nPower BI 聚类功能使用 K-Means 算法来确定要创建的最佳集群数量。目前，集群最多限于 15 个度量值和一个维度；如果超过这些限制，将返回错误消息。\n\
  \n### There's more\n\n除了本食谱中的标准 Power BI 聚类之外，AppSource 中还提供用于聚类的其他自定义视觉对象，包括 **Clustering**\
  \ 和 **Clustering with Outliers**。这两个自定义视觉对象均使用 R 统计编程语言构建。\n\n与示例中的表格视觉对象一样，集群也可以从散点图视觉对象自动创建。这些集群最多限于两个输入度量值（X\
  \ 和 Y），但集群会自动添加到 **Details** 字段。要了解其工作原理，请执行以下操作：\n\n- 1. 在新页面上，创建一个散点图可视化，使用 **Internet\
  \ Net Sales** 度量值作为 **X Axis**，**Internet Sales Orders** 度量值作为 **Y Axis**，并使用 **Products**\
  \ 表中的 **EnglishProductName** 列作为 **Details**\n- 2. 选择散点图可视化，单击省略号（**...**），并选择 **Automatically\
  \ find clusters**\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_440_0.png)\n\nFigure\
  \ 9.31: Clusters automatically added to the legend of a Scatter chart\n\n### See\
  \ also\n\n- Apply clustering techniques: https://bit.ly/3gWvKK3\n\n## Forecasting\
  \ and Anomaly Detection\n\n标准的 Power BI 报表和仪表板可视化是支持历史或实时数据的描述性和诊断分析的优秀工具，但最终组织需要预测性和规范性分析来帮助指导涉及未来结果的决策。Power\
  \ BI Desktop 提供了一个时间序列预测工具，具有内置的预测建模功能，使报表作者能够快速创建自定义预测、评估这些预测的准确性，并构建直观的可视化，将实际或历史数据与预测融合。\n\
  \n\n\n本方案包含两个完整的预测示例。第一个示例利用自动日期层次结构构建未来三个月的月度预测。第二个示例构建未来八周的每周预测，并评估将预测应用于近期数据时的准确性。最后，提供了一个使用异常检测的示例。\n\
  \n## 准备工作\n\n要准备本方案，请按照以下步骤操作：\n\n- 1. 在本地打开一个 Power BI Desktop 文件，并确保在**当前文件数据加载**选项中启用了**自动日期/时间**设置（通过**文件\
  \ | 选项和设置 | 选项**）\n- 2. 通过单击**主页**选项卡功能区中的**转换数据**访问**Power Query 编辑器**\n- 3. 创建一个名为\
  \ AdWorksDW 的查询，如下所示：\n  \n  ```powerquery\n  let\n      Source = Sql.Database(\"\
  localhost\\\\MSSQLSERVERDEV\", \"AdventureWorksDW2019\")\n  in\n      Source\n \
  \ ```\n  \n- 4. 禁用 AdWorksDW 查询的加载，并将其放入 **Data Sources** 查询组中\n- 5. 右键单击 AdWorksDW\
  \ 查询，然后选择**引用**\n- 6. 将查询重命名为 **Internet Sales**，然后选择 **FactInternetSales** 表\n\
  - 7. 重复步骤 4 和 5，创建一个指向 **DimDates** 表的 **Dates** 查询\n- 8. 将 **Internet Sales** 查询移动到\
  \ **Facts** 查询组，将 **Dates** 查询移动到 **Dimensions** 查询组\n- 9. 在 **Other Queries** 组中，创建一个名为\
  \ **Calculations** 的空白查询\n- 10. 从**主页**选项卡的功能区中选择**关闭并应用**\n- 11. 切换到**模型**视图，并在\
  \ **Dates** 表中的 **DateKey** 列与 **Internet Sales** 表中的 **OrderDateKey** 列之间创建关系\n\
  - 12. 保存你的工作\n\n## 如何执行预测和异常检测\n\n要实现本方案，请执行以下步骤：\n\n- 1. 在 Calculations 表中创建以下度量：\n\
  \  Today = DATE(2014,1,28)\n  Internet Gross Sales = SUM('Internet Sales'[SalesAmount])\n\
  \  Internet Sales Discounts = SUM('Internet Sales'[DiscountAmount])\n  Internet\
  \ Net Sales = [Internet Gross Sales] - [Internet Sales Discounts]\n- 2. 在报表视图中，创建一个折线图视觉对象，使用\
  \ Dates 表中的 FullDateAlternateKey 作为轴，并使用 Internet Net Sales 度量作为值\n- 3. 选中该视觉对象后，单击层次结构中的“向下展开一级”按钮两次，以导航到月度粒度\n\
  - 4. 选中折线图后，打开分析窗格，展开预测，并单击添加\n- 5. 在**预测长度**中输入 3，在**忽略最后**中输入 1，在**季节性**中输入 12\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_442_0.png)\n\n图9.32：使用“向下展开一级”按月份显示折线图视觉对象\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_442_1.png)\n\n图9.33：包含三个预测点并排除最近一个月的月度预测\n\
  \n- 6. 在 Dates 表中使用以下代码创建新列：\n\n```\nSequential =\n    VAR __Date = 'Dates'[FullDateAlternateKey]\n\
  \    VAR __Year = YEAR(__Date)\n    VAR __Calendar = ADDCOLUMNS(ALL('Dates'),\n\
  \        \"__Year\", YEAR('Dates'[FullDateAlternateKey]),\n        \"__WeekNum\"\
  , WEEKNUM('Dates'[FullDateAlternateKey]))\n    VAR __FirstYear = MINX(__Calendar,[__Year])\n\
  \    VAR __WeekNum = MAXX(FILTER(__Calendar,\n        [FullDateAlternateKey] = __Date),\
  \ [__WeekNum])\n    VAR __MaxWeeks = GROUPBY(__Calendar, [__Year],\n        \"__MaxWeek\"\
  , MAXX(CURRENTGROUP(), [__WeekNum]))\n    VAR __Start = SUMX(FILTER(__MaxWeeks,\
  \ [__Year]<__Year), [__MaxWeek])\n    VAR __Calendar1 = ADDCOLUMNS(__Calendar,\n\
  \        \"__MaxWeek\",\n            MAXX(FILTER(__Calendar, [__Year] =\n      \
  \          EARLIER([__Year])),[__WeekNum]))\n    VAR __SubtractTable = GROUPBY(FILTER(__Calendar1,\n\
  \        [__Year] < __Year && [__WeekNum] = [__MaxWeek]), [__Year],\n        \"\
  __NumWeekDays\", COUNTX(CURRENTGROUP(),[FullDateAlternateKey]))\n    VAR __Subtract\
  \ = COUNTROWS(FILTER(__SubtractTable, [__NumWeekDays]<7))\n    VAR __Sequential\
  \ = IF(__Year=__FirstYear,\n        __WeekNum,\n        __Start + __WeekNum - __Subtract)\n\
  RETURN __Sequential\n```\n\n```\nWeek Ending Date =\n    VAR __CurrentWeek = [Sequential]\n\
  RETURN\n    MAXX(FILTER(ALL('Dates'),[Sequential] = __CurrentWeek),\n        [FullDateAlternateKey])\n\
  ```\n\n```\nIsCurrentWeek =\n    VAR __CurrentWeek =\n        LOOKUPVALUE('Dates'[Sequential],'Dates'[FullDateAlternateKey],[Today])\n\
  RETURN\n    IF([Sequential] = __CurrentWeek,1,0)\n```\n\n## 应用高级分析和自定义视觉对象\n\n-\
  \ 7. 在**报表**视图中，创建另一个**折线图**视觉对象，使用 **Dates** 表中的 **Week Ending Date**（不是层次结构）作为**轴**，并使用\
  \ **Internet Net Sales** 度量作为**值**\n  \n- 8. 选中该视觉对象后，使用**筛选器**窗格，将 **IsCurrentWeek**\
  \ 列添加到该视觉对象的筛选器中，并排除值为 **1** 的数据\n  \n- 9. 选中折线图后，打开**分析**窗格，展开**预测**，并单击**添加**\n\
  \  \n- 10. 在**预测长度**中输入 **8**，在**忽略最后**中输入 **5**，在**季节性**中输入 **52**\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_444_0.png)\n\
  \n图9.34：每周销售趋势和排除前5个完整周的三周预测\n\n## 工作原理\n\nPower BI 预测工具使用指数平滑时间序列预测算法。该方法广泛应用于多个领域，有助于抑制异常值，同时有效捕捉趋势。预测工具目前仅适用于**折线图**视觉对象，并且该视觉对象上只允许一个度量（线）。x\
  \ 轴值需要具有日期或日期/时间数据类型，或是均匀递增的整数，并且至少需要六个日期点。\n\nPower BI 中的预测工具包含一个**忽略最后**功能，它允许从预测中排除不完整的期间（月、周和天）。然而，对于常见的加法度量，例如\
  \ **Sales Amount**，不过滤掉当前期间往往会显著降低视觉对象的可用性，因为当前（不完整）期间会呈现急剧下降。动态更新的日期列（如 **IsCurrentWeek**）通常可以解决此问题。\n\
  \n在第一个折线图中，默认情况下，将为所选度量在未来 10 个点（月）内创建预测，并采用 95% 的**置信区间**。预测会自动确定步长（月度粒度），并确定应用于预测的季节性因子。在此示例中，未对报表应用任何筛选器，因此当前（不完整）月份最初会被预测使用。通过将**忽略最后**设置为\
  \ **1** 个点，我们排除了最近的、不完整的月份。\n\n现在，预测中包含了当前（不完整）月份的预测值。在已知粒度（每年 12 个）下应用**季节性**变量，将覆盖默认的季节性因子。\n\
  \n当已知季节性（每个周期的点数）时，建议手动应用此值以提高准确性。根据 95% 的置信区间，将鼠标悬停在预测数据点上会显示预测值以及上限和下限值。\n\n在第二个示例中，最后一个完整的\
  \ **Week Ending Date** 是 2014 年 1 月 25 日（1/25/14）。因此，给定要忽略的 **5** 个点，该点与前四个周将从预测算法中排除，这样预测只能使用截至\
  \ 2013 年 12 月 21 日（12/21/13）及更早的周来生成预测。对于结束于 2014 年 2 月 1 日、2014 年 2 月 8 日和 2014\
  \ 年 2 月 15 日的周，将计算另外三个预测点（8（预测长度）− 5（忽略最后））。\n\n### 更多内容\n\n除了预测功能之外，折线图视觉对象现在还包括异常检测功能。要了解其工作原理，请执行以下操作：\n\
  \n- 1. 通过选择**文件 | 选项和设置 | 选项**，然后选择**预览功能**，确保**异常检测**功能已在**预览功能**中激活\n- 2. 将 **Week\
  \ Ending Date** 折线图复制到新页面\n- 3. 删除**分析**窗格中的**预测**\n- 4. 展开**查找异常**，然后选择**添加**\n\
  \n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_445_0.png)\n\n图9.35：查找异常\n\n默认**敏感度**为\
  \ 70%。提高**敏感度**会识别出更多异常。\n\n### 另请参阅\n\n- 使用 Power BI Desktop 进行数据预测与分析：https://bit.ly/3xFWakx\n\
  - 异常检测教程：https://bit.ly/3t6NAiC\n\n\n\n\n\n## 使用 R 和 Python 视觉对象\n\nR 和 Python 编程语言（包括其在数据处理、高级分析和可视化方面的强大且可扩展的功能）已与\
  \ Power BI 深度集成。R 和 Python 脚本可用作 Power BI 数据集的数据源、M 查询中的数据转换和整形过程，以及 Power BI 报表和仪表板中的独立视觉对象类型。与标准\
  \ Power BI 视觉对象一样，R 和 Python 脚本视觉对象直接利用数据模型中定义的关系，并可通过其他视觉对象（如切片器）进行动态筛选。\n\n在本节中，将使用\
  \ R 脚本在 Power BI Desktop 中创建两个直方图视觉对象：一个使用 R 的标准基础绘图系统，另一个使用流行的 ggplot2 可视化包。此外，还包含一个\
  \ Python 视觉对象示例。\n\n## 准备工作\n\n要准备本节内容，请按照以下步骤操作：\n\n- 1. 使用以下任一方式在本地计算机上下载并安装 R\
  \ 引擎：\n  - https://cran.r-project.org/bin/windows/base/\n  - https://aka.ms/rclient/\n\
  - 2. 通过以下命令为 R 安装 ggplot2 包：install.packages(\"ggplot2\")。\n- 3. （可选）安装用于编辑 R 脚本的\
  \ IDE，例如 RStudio（https://www.rstudio.com/）。\n- 4. 打开 Power BI Desktop，确认在 Power\
  \ BI Desktop 的 R 脚本选项中反映了本地 R 安装目录路径（文件 | 选项和设置 | 选项）。\n- 5. 类似地，从 http://www.python.org\
  \ 或 Anaconda（https://www.anaconda.com/）中捆绑的 Python 安装 Python，并在 Power BI Desktop\
  \ 中验证 Python 脚本选项（文件 | 选项和设置 | 选项）。\n\n![](img/0b67f3eabca89f1e12f62eac78fb9ffb_447_0.png)\n\
  \n**检测到的 R IDE** 和 **检测到的 Python IDE** 下拉列表可用于在多个已安装的 IDE 之间进行选择。如果 Power BI Desktop\
  \ 中尚未使用 R 和 Python 脚本视觉对象，将出现 **启用脚本视觉对象** 提示。单击 **启用**。\n\n- 6. 使用以下命令为 Python\

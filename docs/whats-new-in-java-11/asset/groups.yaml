  - '[PAGE 30]


    *Pack200* is a compression scheme for JAR files that was introduced in Java 5.
    The compression mechanism was especially popular in the context of Applets. As
    mentioned earlier, support for Applets has been dropped, thus making this tool
    less useful. For that very reason, Java marked it as deprecated. For more information,
    refer to JEP 336.


    The last but very important section in this report covers performance and security.


    # Performance and Security


    Developers usually look for the shiny, convenient features in a new Java release
    that directly affect and improve their daily work routines. Nonfunctional aspects
    like performance and security, on the other hand, become extremely important after
    you release your project to production. A slow-running application won’t win over
    customers. Security holes in your runtime environment lead to diminished trust
    with your users. Java 11 can deliver on this front, as well. First, we take a
    look at performance improvements.


    # Garbage Collection


    Garbage collection is a built-in feature of Java that’s responsible for the creation
    and destruction of objects. Let’s begin by reviewing the improvements that have
    been made to the default garbage collector. Later, we analyze the new, experimental
    garbage collectors that were added in this release.


    # IMPROVEMENTS TO THE DEFAULT G1 COLLECTOR


    Java 7 introduced the Garbage-First (G1) Collector. It later became the default
    garbage collector with Java 9. G1 is optimized for high probability and throughput.
    As mentioned by Thomas Schatzl, Java 11 improves pause times by up to 60% on x64
    processors at a highly reduced memory footprint. That’s a big gain for anyone
    ready to upgrade to Java 11 in production systems.


    Moreover, this release of Java introduces two experimental garbage collectors.
    Let’s see what they can bring to the table. We begin with ZGC.


    # ZGC: A SCALABLE, LOW-LATENCY GARBAGE COLLECTOR


    Garbage collection is one of Java’s compelling features. As a developer, you don’t
    need to take care of marking objects for removal after you are done using them.
    The garbage collector takes care of it behind the scenes. One issue that you might
    face when garbage collection kicks in is pause times. This results in a poor customer
    experience because users must wait for the application to respond. Wait times
    are even more damaging to mission-critical applications committed to responsiveness,
    high throughput, and availability with agreed-upon Service-Level'

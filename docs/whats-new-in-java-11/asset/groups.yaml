    \ 10 为平台添加了新功能。然而，对于许多用户来说，这些变化不足以证明迁移到 Java 10 的努力是合理的。但 Java 11 超出了典型的全新功能和错误修复。\n\
    \n作为一名 Java 开发者，很难跟上每个版本中包含的最新发展。本报告解释了升级到 Java 11 的好处，并为您提供了对其引人注目的特性的快速但凝练而富有洞察力的概述。\n\
    \n从早期版本的 Java 迁移可能并不像您预期的那样简单。Java 11 从平台中移除了多种技术和 API。在本报告中，您将了解有助于您尽快跟上进度的迁移策略。但是，尽管存在潜在障碍，Java\
    \ 11 的新功能使升级是值得的。\n\n## Convergence of Oracle JDK and OpenJDK\n\nOpenJDK，即 Oracle\
    \ JDK 的开源对应版本，自 Java 7 以来就已存在。在很大程度上，两种发行版的语言特性、核心 Java 库和工具非常相似，甚至完全相同。除了这些方面之外，Java\

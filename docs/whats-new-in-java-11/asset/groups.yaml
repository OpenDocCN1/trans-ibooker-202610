    Next, we discuss the features and APIs that have been removed with Java 11.


    # Removed Features and APIs


    Upgrading a project to a newer version of Java sounds easy in theory. But in practice,
    there are various factors that complicate the upgrade process. One example is
    the continued use of deprecated features and APIs. A good practice is to periodically
    review your code, identify the usage of deprecated functionality, and find a replacement
    as early as possible.


    Java 11 removes features and APIs that have been marked deprecated in earlier
    versions. In this section, we review each of them and propose alternative options
    where applicable. This section also serves to provide information that can help
    you assess how a removal might affect your project.


    # Removed Java EE Modules


    Java 9 started the process of modularizing the JDK. While modularizing Java, it
    became abundantly clear that some technologies and APIs belonged to Java EE instead
    of Java SE. The Java team deprecated those modules and remove them with the next
    LTS version. Thus, with the release of Java 11, these technologies are no longer
    a part of the JDK. Table 1-1 lists the removed modules.'

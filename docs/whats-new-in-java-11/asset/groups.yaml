    \n## Applets and Java Web Start\n\nRemember those days when we used to think of\
    \ Java primarily in the context of Applets? Well, that time has long passed. Today,\
    \ Java is used in many other contexts, such as server\napplications, mobile, and\
    \ Internet of Things (IoT) devices.\n\nFast-forward to 2018, and browser providers\
    \ have either begun to remove or have already removed support for plug-in–based\
    \ technologies like Flash and Java because of performance and security concerns.\
    \ Java 9 followed the trend and deprecated support for Applets in 2017. Java 11\
    \ closes the circle and removes Applets completely without a replacement.\n\n\
    Java Web Start provides a way to download a Java desktop application from a browser\
    \ instead of running it in the browser. To many users, it was somewhat of a surprise\
    \ that Java 11 also removes support for Java Web Start. For that reason, converting\
    \ an Applet to a Java Web Start application is out of the question.\n\nIf you\
    \ are still maintaining applications based on Applets or Java Web Start, you will\
    \ need to look into a replacement if you are planning to upgrade to Java 11. The\
    \ next section touches on JavaFX, a valid and powerful option for desktop application\
    \ development.\n\n## JavaFX Migrates to OpenJFX\n\nAs of Java 11, JavaFX—the technology\
    \ for building Java client applications—is no longer distributed with the Oracle\
    \ JDK. But this doesn’t mean that the project is dead. It was simply reduced to\
    \ OpenJFX, the open source counterpart of JavaFX. Consequently, OpenJFX can release\
    \ new versions independent of the JDK release cycle. Especially with the involvement\
    \ of the wider Java community, this is a big win. We can likely expect more frequent\
    \ releases.\n\nOpenJFX provides a very approachable and detailed documentation\
    \ page, as shown in Figure 1-7. You can integrate the technology with Maven and\
    \ Gradle build processes. Getting started with OpenFX couldn’t be easier.\n\n\
    ![](img/2331c4028acf1b9f21065457e9b2d8d4_28_0.png)\n\nFigure 1-7. The community-driven\
    \ home of OpenJFX\n\nAs with previous Java versions, features and APIs go through\
    \ a deprecation cycle before they are actually removed, which we discuss in the\
    \ next section.\n\n## Deprecated Features and APIs\n\nJava 11 deprecates the Nashorn\
    \ JavaScript engine, some VM options, and support for the compression scheme Pack200.\
    \ I strongly advise incorporating the recommended replacements as soon as possible\
    \ to ensure a smooth upgrade procedure to a post-Java 11 version. Let’s go through\
    \ them one by one.\n\n### NOTE\n\n> It’s difficult to keep track of all of the\
    \ Java versions, especially if you are making the jump across multiple versions.\
    \ The tool jdeps helps with detecting the use of deprecated APIs in your project\
    \ code and its dependencies. Integrating jdeps as part of your Continuous Integration\
    \ process is a great idea. You will receive fast feedback and gain deep insight\
    \ into the use of deprecated APIs.\n\n### Nashorn JavaScript Engine\n\n*Pack200*\
    \ is a compression scheme for JAR files that was introduced in Java 5. The compression\
    \ mechanism was especially popular in the context of Applets. As mentioned earlier,\
    \ support for Applets has been dropped, thus making this tool less useful. For\
    \ that very reason, Java marked it as deprecated. For more information, refer\
    \ to JEP 336.\n\nThe last but very important section in this report covers performance\
    \ and security.\n\n## Performance and Security\n\nDevelopers usually look for\
    \ the shiny, convenient features in a new Java release that directly affect and\
    \ improve their daily work routines. Nonfunctional aspects like performance and\
    \ security, on the other hand, become extremely important after you release your\
    \ project to production. A slow-running application won’t win over customers.\
    \ Security holes in your runtime environment lead to diminished trust with your\
    \ users. Java 11 can deliver on this front, as well. First, we take a look at\
    \ performance improvements.\n\n## Garbage Collection\n\nGarbage collection is\
    \ a built-in feature of Java that’s responsible for the creation and destruction\
    \ of objects. Let’s begin by reviewing the improvements that have been made to\
    \ the default garbage collector. Later, we analyze the new, experimental garbage\
    \ collectors that were added in this release.\n\n### IMPROVEMENTS TO THE DEFAULT\
    \ G1 COLLECTOR\n\nJava 7 introduced the Garbage-First (G1) Collector. It later\
    \ became the default garbage collector with Java 9. G1 is optimized for high probability\
    \ and throughput. As mentioned by Thomas Schatzl, Java 11 improves pause times\
    \ by up to 60% on x64 processors at a highly reduced memory footprint. That’s\
    \ a big gain for anyone ready to upgrade to Java 11 in production systems.\n\n\
    Moreover, this release of Java introduces two experimental garbage collectors.\
    \ Let’s see what they can bring to the table. We begin with ZGC.\n\n### ZGC: A\
    \ SCALABLE, LOW-LATENCY GARBAGE COLLECTOR\n\nGarbage collection is one of Java’s\
    \ compelling features. As a developer, you don’t need to take care of marking\
    \ objects for removal after you are done using them. The garbage collector takes\
    \ care of it behind the scenes. One issue that you might face when garbage collection\
    \ kicks in is pause times. This results in a poor customer experience because\
    \ users must wait for the application to respond. Wait times are even more damaging\
    \ to mission-critical applications committed to responsiveness, high throughput,\
    \ and availability with agreed-upon Service-Level\n"

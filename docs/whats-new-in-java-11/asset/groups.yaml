    ## 使用 Java 飞行记录器记录操作系统和 JVM 事件\n\nJava 飞行记录器（JFR）是一种用于剖析正在运行的 Java 应用程序并捕获诊断信息以进行进一步分析的工具。这个工具对\
    \ Java 来说并不新鲜。它在 Java 7 中已经推出，但当时被视为商业功能，你需要使用 JVM 选项 -XX:+UnlockCommercialFeatures\
    \ -XX:+FlightRecorder 显式启用。\n\n在 Java 11 中，JFR 开源了，并包含在 OpenJDK 中。为了让你了解如何使用 JFR，让我们看看捕获指标所需的步骤。首先，你需要运行一个\

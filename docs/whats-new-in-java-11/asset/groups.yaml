    \ Collector，可通过在启动新 JVM 时传递 `-XX:+UnlockCommercialFeatures` 选项来激活。Java 11 之后，商业功能免费，并已添加到\
    \ OpenJDK。我们将在后面的章节中讨论其中一些功能。\n\nOracle 的长期目标是通过将商业工具完全开源来使两个发行版趋同。Java 11 实现了这一里程碑，同时还存在一些小的打包和外观差异。那么，您可能会问，对于您的项目应该选择哪个发行版？让我们来看看每个选项的许可影响。\n\
    \n## Licensing of the Oracle JDK and OpenJDK\n\nOracle JDK 和 OpenJDK 之间唯一的区分因素是许可协议。OpenJDK\
    \ 继续以 GNU 通用公共许可证第 2 版（GPL 2）附带类路径例外的方式许可。该许可证允许您在开发和生产用途中将 Java 用于开源项目以及商业产品而无需任何限制或归属。类路径例外将\
    \ OpenJDK 的许可条款与随可执行程序捆绑的外部库适用的许可条款解耦。关于 Oracle JDK，其许可已从 Oracle Java SE 技术的二进制代码许可（BCL）更改为商业许可。因此，您不能再在不购买\
    \ Java SE 订阅模式的情况下将 Oracle JDK 用于生产。\n\n> **NOTE**\n> \n> 订阅模式也适用于 2019 年 1 月之后发布的任何\
    \ Java 8 修补程序版本，如果用于商业产品。\n\n了解许可影响非常重要，以便为您的组织做出正确的选择。如果您正在从事关键任务软件，并且希望依靠 Oracle\
    \ 对长期补丁的支持，商业 Oracle JDK 许可可能是最佳选择。对于开源软件和仅在未来六个月内需要短期补丁发布的产品，OpenJDK 应该完全足够。无论哪种方式，在升级到\
    \ Java 11 时，您都需要决定使用哪个 Java 发行版。请注意，还有其他供应商提供的免费 OpenJDK 发行版。有关更多信息，请参阅 Java Champions\

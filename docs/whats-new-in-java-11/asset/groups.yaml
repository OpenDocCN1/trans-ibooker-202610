    \ Oracle 的学习资料和 Javadocs。\n\nJava 11 中另一个有趣的特性是无需编译即可启动 Java 程序的能力。让我们来看看这是如何工作的。\n\
    \n## 无需编译即可启动单文件程序\n\nJava 不是一种脚本语言。对于你想执行的每个程序，你都需要先通过显式运行 javac 命令对其进行编译。这种往返过程使得尝试测试用小代码片段变得不太方便。Java\

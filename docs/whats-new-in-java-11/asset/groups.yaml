    \        <artifactId>jaxb-runtime</artifactId>\n        <version>2.3.1</version>\n\
    \    </dependency>\n</dependencies>\n```\n\n当然，你也可以将相同的依赖添加到 Gradle 构建脚本中。以下示例构建脚本在\

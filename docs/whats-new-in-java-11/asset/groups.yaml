    As with previous Java versions, features and APIs go through a deprecation cycle
    before they are actually removed, which we discuss in the next section.


    # Deprecated Features and APIs


    Java 11 deprecates the Nashhorn JavaScript engine, some VM options, and support
    for the compression scheme Pack200. I strongly advise incorporating the recommended
    replacements as soon as possible to ensure a smooth upgrade procedure to a post-Java
    11 version. Let’s go through them one by one.


    # NOTE


    > It’s difficult to keep track of all of the Java versions, especially if you
    are making the jump across multiple versions. The tool jdeps helps with detecting
    the use of deprecated APIs in your project code and its dependencies. Integrating
    jdeps as part of your Continuous Integration process is a great idea. You will
    receive fast feedback and gain deep insight into the use of deprecated APIs.



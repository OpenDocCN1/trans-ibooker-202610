  mdcn: "\n如果你之后意识到需要商业支持，你仍然可以切换回 Oracle JDK 并购买许可证。\n\n在掌握了 Java 11 的基础知识后，让我们深入探讨此版本提供的新特性。与其他版本相比，这些特性可能显得微不足道。尽管如此，它们仍能改善你日常使用\
    \ Java 的工作方式。\n\n## 新特性\n\n对于许多开发者而言，升级到新 Java 版本的主要动力在于通过应用最新且强大的功能来提高生产力。在本节中，你将了解\
    \ Java 11 引入的语言和平台改进。我们将首先看看影响最大的特性：新的 HTTP 客户端。\n\n## 通过 HttpClient 实现内置和增强的\
    \ HTTP 通信\n\n在微服务和服务 API 的世界里，HTTP 通信是不可避免的。通常，你需要编写代码来调用端点以获取或修改数据。\n\nHttpURLConnection\
    \ 是一个用于 HTTP 通信的 API，已经存在很久了，但无法满足现代应用程序的需求。因此，过去 Java 开发者不得不求助于更高级、功能更丰富的库，例如\
    \ Apache HttpComponents 或 Square 的 OKHttp，它们已经支持 HTTP/2 和 WebSocket 通信。\n\nOracle\
    \ 意识到了 Java 功能集中的这一不足之处，并在 Java 9 中引入了 HTTP 客户端实现作为实验性功能。HttpClient 已经成熟，现在是 Java\
    \ 11 中的一个最终特性。如果有一个理由让你升级到 Java 11，那就是这个！再也不要维护构建过程中所需的外部依赖项了。\n\n简而言之，Java 的\
    \ HTTP API 可以处理同步和异步通信，支持 HTTP 1.1 和 2，并且支持所有常见的 HTTP 方法，如 GET、POST、PUT 和 DELETE。使用\
    \ java.net.http 模块进行典型的 HTTP 交互如下所示：\n\n- 1. 创建 HttpClient 的实例并对其进行配置。\n- 2. 创建\
    \ HttpRequest 的实例并填充信息。\n- 3. 将请求传递给客户端，执行请求，并获取 HttpResponse 的实例。\n- 4. 处理 HttpResponse\
    \ 中包含的信息。\n\n听起来很抽象？让我们看看同步和异步 HTTP 通信的具体示例。\n\n## 同步通信\n\n首先，让我们编写一个执行同步 GET\
    \ 调用的程序。图 1-2 表明，同步调用会阻塞客户端，直到 HTTP 请求被服务器处理且响应被发送回来。\n\n![](img/2331c4028acf1b9f21065457e9b2d8d4_8_0.png)\n\
    \n图 1-2. 同步 HTTP 通信\n\n为了演示目的，我们使用 Postman Echo，这是一个用于测试 HTTP 客户端的 RESTful 服务。示例\
    \ 1-1 创建了一个 HTTP 客户端实例，执行了一个 GET 调用，并在控制台上渲染了一些响应信息。\n\n### 示例 1-1. 使用 HttpClient\
    \ API 进行同步 GET 调用\n\n```\nimport java.io.IOException;\nimport java.net.URI;\n\
    import java.net.http.HttpClient;\nimport java.net.http.HttpRequest;\nimport java.net.http.HttpResponse;\n\
    ```\n\n```\n```java\nimport java.time.Duration;\n\nHttpClient httpClient = HttpClient.newBuilder()\n\
    \        .connectTimeout(Duration.ofSeconds(10))\n        .build();\n\ntry {\n\
    \    String urlEndpoint = \"https://postman-echo.com/get\";\n    URI uri = URI.create(urlEndpoint\
    \ + \"?foo1=bar1&foo2=bar2\");\n    HttpRequest request = HttpRequest.newBuilder()\n\
    \            .uri(uri)\n            .build();\n    HttpResponse<String> response\
    \ = httpClient.send(request,\n            HttpResponse.BodyHandlers.ofString());\n\
    } catch (IOException | InterruptedException e) {\n    throw new RuntimeException(e);\n\
    }\n\nSystem.out.println(\"Status code: \" + response.statusCode());\nSystem.out.println(\"\
    Headers: \" + response.headers()\n        .allValues(\"content-type\"));\nSystem.out.println(\"\
    Body: \" + response.body());\n```\n```\n\n- 1. 创建并配置 HTTP 客户端实例。该客户端使用 10 秒的连接超时。\n\
    - 2. 创建并配置 HTTP 请求。默认情况下，HTTP 请求使用 GET 方法。\n- 3. 发送 HTTP 请求并获取响应。\n- 4. 处理 HTTP\
    \ 响应返回的数据；例如，状态码、头部和正文。\n\n> **注意**\n> \n> 你可能已经注意到，`HttpClient` API 大量依赖建造者模式。当创建可以填充可选参数的更复杂对象时，建造者模式特别有用。与暴露具有多个参数重载的构造函数不同，建造者模式提供了用于配置对象的直观方法，从而形成一种易于理解和使用的流畅\
    \ API。\n\n`HttpClient` API 并不局限于仅仅进行同步调用。在下一节中，我们将探讨一个异步通信的示例。\n\n## 异步通信\n\n\
    如果你不想等待响应并希望稍后处理响应，或者如果你想并行处理一系列调用，异步通信就非常有用。图 1-3 展示了这种形式。\n\n![](img/2331c4028acf1b9f21065457e9b2d8d4_10_0.png)\n\
    \n*图 1-3. 异步 HTTP 通信*\n\n假设你想实现一个工具，用于解析网页上使用的链接，并通过对其发起 HTTP GET 请求来验证它们。示例 1-2\
    \ 定义了一个 URI 列表，并通过发出异步调用并收集结果来检查这些 URI。\n\n### 示例 1-2. 执行异步 HTTP 调用并稍后对响应做出反应\n\
    \n```\n```java\nimport java.io.IOException;\nimport java.net.URI;\nimport java.net.http.HttpClient;\n\
    import java.net.http.HttpRequest;\nimport java.net.http.HttpResponse;\n```\n```\n\
    \n```\n```java\nimport java.time.Duration;\nimport java.util.List;\nimport java.util.concurrent.CompletableFuture;\n\
    import java.util.stream.Stream;\n\nimport static java.util.stream.Collectors.toList;\n\
    \nfinal List<URI> uris = Stream.of(\n        \"https://www.google.com/\",\n  \
    \      \"https://www.github.com/\",\n        \"https://www.ebay.com/\"\n    ).map(URI::create).collect(toList());\n\
    \nHttpClient httpClient = HttpClient.newBuilder()\n        .connectTimeout(Duration.ofSeconds(10))\n\
    \        .followRedirects(HttpClient.Redirect.ALWAYS)\n        .build();\n\nCompletableFuture[]\
    \ futures = uris.stream()\n        .map(uri -> verifyUri(httpClient, uri))\n \
    \       .toArray(CompletableFuture[]::new);\nCompletableFuture.allOf(futures).join();\n\

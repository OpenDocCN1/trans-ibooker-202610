  - '[PAGE 27]


    applications, mobile, and Internet of Things (IoT) devices.


    Fast-forward to 2018, and browser providers have either begun to remove or have
    already removed support for plug-in–based technologies like Flash and Java because
    of performance and security concerns. Java 9 followed the trend and deprecated
    support for Applets in 2017. Java 11 closes the circle and removes Applets completely
    without a replacement.


    Java Web Start provides a way to download a Java desktop application from a browser
    instead of running it in the browser. To many users, it was somewhat of a surprise
    that Java 11 also removes support for Java Web Start. For that reason, converting
    an Applet to a Java Web Start application is out of the question.


    If you are still maintaining applications based on Applets or Java Web Start,
    you will need to look into a replacement if you are planning to upgrade to Java
    11. The next section touches on JavaFX, a valid and powerful option for desktop
    application development.


    # JavaFX Migrates to OpenJFX


    As of Java 11, JavaFX—the technology for building Java client applications—is
    no longer distributed with the Oracle JDK. But this doesn’t mean that the project
    is dead. It was simply reduced to OpenJFX, the open source counterpart of JavaFX.
    Consequently, OpenJFX can release new versions independent of the JDK release
    cycle. Especially with the involvement of the wider Java community, this is a
    big win. We can likely expect more frequent releases.


    OpenJFX provides a very approachable and detailed documentation page, as shown
    in Figure 1-7. You can integrate the technology with Maven and Gradle build processes.
    Getting started with OpenFX couldn’t be easier.'

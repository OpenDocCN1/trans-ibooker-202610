    \ API 的列表。\n\n## Applets and Java Web Start\n\n还记得那些我们主要在 Applet 上下文中思考 Java 的日子吗？好吧，那个时代早已过去。今天，Java\
    \ 在许多其他上下文中使用，例如服务器\n应用程序、移动和物联网 (IoT) 设备。\n\n快进到 2018 年，浏览器提供商已开始移除或已移除对 Flash\
    \ 和 Java 等基于插件技术的支持，因为性能和安全方面的担忧。Java 9 遵循这一趋势并在 2017 年弃用了对 Applets 的支持。Java 11\
    \ 完成了这一循环并完全移除了 Applets，且没有替代品。\n\nJava Web Start 提供了一种从浏览器下载 Java 桌面应用程序而不是在浏览器中运行的方式。对许多用户来说，Java\
    \ 11 也移除了对 Java Web Start 的支持，这有点令人惊讶。因此，将 Applet 转换为 Java Web Start 应用程序已不可行。\n\
    \n如果你仍在维护基于 Applets 或 Java Web Start 的应用程序，如果计划升级到 Java 11，你将需要寻找替代方案。下一节涉及 JavaFX，这是在桌面应用程序开发中一个有效且强大的选择。\n\
    \n## JavaFX Migrates to OpenJFX\n\n从 Java 11 开始，JavaFX——用于构建 Java 客户端应用程序的技术——不再随\
    \ Oracle JDK 分发。但这并不意味着该项目已死亡。它只是被精简为 OpenJFX，即 JavaFX 的开源对应物。因此，OpenJFX 可以独立于\
    \ JDK 发布周期发布新版本。尤其是在更广泛的 Java 社区参与下，这是一个巨大的胜利。我们很可能会看到更频繁的发布。\n\nOpenJFX 提供了一个非常易于接近且详细的文档页面，如图\
    \ 1-7 所示。你可以将其技术与 Maven 和 Gradle 构建流程集成。开始使用 OpenFX 从未如此简单。\n\n![](img/2331c4028acf1b9f21065457e9b2d8d4_28_0.png)\n\
    \nFigure 1-7. The community-driven home of OpenJFX\n\n与之前的 Java 版本一样，功能和 API 在实际移除之前会经历弃用周期，我们将在下一节讨论。\n\
    \n## Deprecated Features and APIs\n\nJava 11 弃用了 Nashorn JavaScript 引擎、一些 VM 选项以及对\
    \ Pack200 压缩方案的支持。我强烈建议尽快采用推荐的替代方案，以确保顺利升级到 Java 11 之后的版本。让我们逐一介绍。\n\n### NOTE\n\
    \n> 很难跟踪所有 Java 版本，尤其是在跨多个版本跳跃时。工具 jdeps 有助于检测项目代码及其依赖项中使用已弃用 API 的情况。将 jdeps\
    \ 集成到你的持续集成流程中是一个好主意。你将获得快速反馈并深入了解已弃用 API 的使用情况。\n\n### Nashorn JavaScript Engine\n\
    \n*Pack200* 是在 Java 5 中引入的用于 JAR 文件的压缩方案。该压缩机制在 Applet 上下文中尤其流行。如前所述，Applet 的支持已被放弃，因此该工具变得不太有用。正因如此，Java\
    \ 将其标记为已弃用。有关更多信息，请参阅 JEP 336。\n\n本报告中最后一个但非常重要的部分涵盖了性能和安全。\n\n## Performance\
    \ and Security\n\n开发人员通常会寻找新 Java 版本中那些直接影响并改善日常工作流程的闪亮、便捷功能。另一方面，非功能性方面如性能和安全，在你将项目发布到生产环境后变得极其重要。运行缓慢的应用程序不会赢得客户。运行时环境中的安全漏洞会导致用户信任度下降。Java\
    \ 11 在这方面也能提供支持。首先，我们来看性能改进。\n\n## Garbage Collection\n\n垃圾收集是 Java 的内置功能，负责对象的创建和销毁。让我们首先回顾一下对默认垃圾收集器的改进。稍后，我们将分析本次发布中添加的新实验性垃圾收集器。\n\
    \n### IMPROVEMENTS TO THE DEFAULT G1 COLLECTOR\n\nJava 7 引入了 Garbage-First (G1)\
    \ 收集器。它后来在 Java 9 中成为默认垃圾收集器。G1 针对高概率和吞吐量进行了优化。正如 Thomas Schatzl 所提到的，Java 11\
    \ 在 x64 处理器上将暂停时间提高了高达 60%，同时内存占用大幅减少。对于准备将 Java 11 升级到生产系统的人来说，这是一个巨大的提升。\n\n\
    此外，本次 Java 发布引入了两个实验性垃圾收集器。让我们看看它们能带来什么。我们从 ZGC 开始。\n\n### ZGC: A SCALABLE, LOW-LATENCY\
    \ GARBAGE COLLECTOR\n\n垃圾收集是 Java 的一项引人注目的功能。作为开发人员，你无需在不再使用对象后手动标记对象以便移除。垃圾收集器会在幕后处理此事。你可能会遇到的问题之一是垃圾收集启动时的暂停时间。这会导致糟糕的客户体验，因为用户必须等待应用程序响应。对于致力于响应性、高吞吐量和可用性并具有约定服务级别的任务关键型应用程序来说，等待时间更是致命的。\n\
    \n"

  要理解 Java 11 的下一个变更，我们需要看看嵌套类。假设你有一个名为 Outer.java 的外部类，其中包含一个名为 Inner.java 的内部类。Inner.java\
  \ 可以访问 Outer.java 的所有私有字段和方法，因为它们在逻辑上属于一起。图 1-5 展示了这种数据结构。\n\n## Outer.java\n\n\
  ```\nprivate static String level = \"outer\";\n```\n\n## Inner.java\n\n```\npublic\
  \ static String getOuterField() {\n    return Outer.level;\n}\n```\n\n图 1-5. 从嵌套类访问父类字段\n\
  \n你可能知道，Java 编译器会为内部类创建新的类文件，在本例中为 Outer$Inner.class。在底层，编译过程还会在类之间创建所谓的扩展可访问性的桥接方法。\n\
  \nJava 11 借助所谓的嵌套类同伴，偿还了必须生成这些桥接方法的技术债务。现在，内部类无需编译器进行额外工作即可访问外部类的字段和方法。\n\n你可能会问自己：“编译器优化很棒，但它对我作为开发者有什么影响呢？”\
  \ 嗯，在 Java 11 之前，如果不将可访问性控制设置为 true，就不可能通过反射访问外部类的字段。随着嵌套访问控制的改变，这种控制不再需要。下面的类层次结构演示了改变后的行为：\n\
  \n```\nimport java.lang.reflect.Field;\n\npublic class Outer {\n    private static\
  \ String level = \"outer\";\n\n    public static class Inner {\n        public static\
  \ String getOuterViaRegularFieldAccess() {\n            return Outer.level;\n  \
  \      }\n    }\n```\n\n```\n```java\npublic static String getOuterViaReflection()\
  \ {\n    try {\n        Field levelField = Outer.class\n                .getDeclaredField(\"\
  level\");\n        // levelField.setAccessible(true);\n        return levelField.get(null).toString();\n\
  \    } catch (NoSuchFieldException\n             | IllegalAccessException e) {\n\
  \        throw new RuntimeException(e);\n    }\n}\n\npublic static void main(String[]\
  \ args) {\n    Inner.getOuterViaRegularFieldAccess();\n    Inner.getOuterViaReflection();\n\
  }\n```\n```\n\n① Java 10 或更早版本需要此行。\n\n② 在 Java 10 中已有效。\n\n与本节的先前代码示例一样，我们也通过测试验证了正确行为，如下所示（有关此更改的更多详细信息，请参阅\
  \ JEP 181）：\n\n```\n```java\nprivate final Outer.Inner inner = new Outer.Inner();\n\
  \n@Test\nvoid canAccessPrivateFieldFromOuterClass() {\n    assertEquals(\"Outer\"\
  , inner.getOuterViaRegularFieldAccess());\n}\n\n@Test\nvoid canAccessPrivateFieldFromOuterClassViaReflection()\
  \ {\n    assertEquals(\"Outer\", inner.getOuterViaReflection());\n}\n```\n```\n\n\

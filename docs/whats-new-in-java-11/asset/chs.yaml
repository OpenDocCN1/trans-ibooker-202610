- '# Java 11 的新特性






  '
- "## What’s New in Java 11\n\n## Introduction\n\n几十年来，Java 一直是企业软件中最常用的编程语言之一，其发布节奏比以往任何时候都快。从\
  \ 2017 年发布的 Java 9 开始，发布节奏已改为每六个月一次。Java 10 为平台添加了新功能。然而，对于许多用户来说，这些变化不足以证明迁移到 Java\
  \ 10 的努力是合理的。但 Java 11 超出了典型的全新功能和错误修复。\n\n作为一名 Java 开发者，很难跟上每个版本中包含的最新发展。本报告解释了升级到\
  \ Java 11 的好处，并为您提供了对其引人注目的特性的快速但凝练而富有洞察力的概述。\n\n从早期版本的 Java 迁移可能并不像您预期的那样简单。Java\
  \ 11 从平台中移除了多种技术和 API。在本报告中，您将了解有助于您尽快跟上进度的迁移策略。但是，尽管存在潜在障碍，Java 11 的新功能使升级是值得的。\n\
  \n## Convergence of Oracle JDK and OpenJDK\n\nOpenJDK，即 Oracle JDK 的开源对应版本，自 Java\
  \ 7 以来就已存在。在很大程度上，两种发行版的语言特性、核心 Java 库和工具非常相似，甚至完全相同。除了这些方面之外，Java 11 之前的 Oracle\
  \ JDK 版本还包括商业功能，如 Flight Recorder、Java Mission Control 和 Z Garbage Collector，可通过在启动新\
  \ JVM 时传递 `-XX:+UnlockCommercialFeatures` 选项来激活。Java 11 之后，商业功能免费，并已添加到 OpenJDK。我们将在后面的章节中讨论其中一些功能。\n\
  \nOracle 的长期目标是通过将商业工具完全开源来使两个发行版趋同。Java 11 实现了这一里程碑，同时还存在一些小的打包和外观差异。那么，您可能会问，对于您的项目应该选择哪个发行版？让我们来看看每个选项的许可影响。\n\
  \n## Licensing of the Oracle JDK and OpenJDK\n\nOracle JDK 和 OpenJDK 之间唯一的区分因素是许可协议。OpenJDK\
  \ 继续以 GNU 通用公共许可证第 2 版（GPL 2）附带类路径例外的方式许可。该许可证允许您在开发和生产用途中将 Java 用于开源项目以及商业产品而无需任何限制或归属。类路径例外将\
  \ OpenJDK 的许可条款与随可执行程序捆绑的外部库适用的许可条款解耦。关于 Oracle JDK，其许可已从 Oracle Java SE 技术的二进制代码许可（BCL）更改为商业许可。因此，您不能再在不购买\
  \ Java SE 订阅模式的情况下将 Oracle JDK 用于生产。\n\n> **NOTE**\n> \n> 订阅模式也适用于 2019 年 1 月之后发布的任何\
  \ Java 8 修补程序版本，如果用于商业产品。\n\n了解许可影响非常重要，以便为您的组织做出正确的选择。如果您正在从事关键任务软件，并且希望依靠 Oracle\
  \ 对长期补丁的支持，商业 Oracle JDK 许可可能是最佳选择。对于开源软件和仅在未来六个月内需要短期补丁发布的产品，OpenJDK 应该完全足够。无论哪种方式，在升级到\
  \ Java 11 时，您都需要决定使用哪个 Java 发行版。请注意，还有其他供应商提供的免费 OpenJDK 发行版。有关更多信息，请参阅 Java Champions\
  \ 的博客文章“Java Is Still Free”。\n\n## Six-Month Release Cadence: What It Means to You\n\
  \n在 Java 的早期，新版本是一件大事。它们每两到三年才发布一次，包含大量重大、有时是破坏性的更改，例如 Java 5 中的泛型，或 Java 8 中的语法更改，或\
  \ Java 9 的模块系统。将软件项目迁移到新 Java 版本通常需要大量的计划和工作。一些项目甚至不得不推迟软件生产过程，直到迁移完全完成。\n\n许多行业领导者转向持续交付模型以推动创新并降低风险：更改更少，发布更频繁。Oracle\
  \ 致力于遵循这一做法，每六个月发布一个主要版本，每两个月发布一个次要版本。因此，升级到新版本的 Java 对您的项目影响会更小。图 1-1 显示了即将到来的主要和次要\
  \ Java 版本的预期日期。\n\n![](img/2331c4028acf1b9f21065457e9b2d8d4_6_0.png)\n\nFigure 1-1.\
  \ Java’s projected release cycle\n\n发布频率更高意味着确保平台稳定性的责任。正是出于这个原因，Oracle 每三年提供一个长期支持版本。接下来，我们来看看“长期支持”在实践中意味着什么。\n\
  \n## Long-Term Support\n\nOracle 为所有被指定为长期支持（LTS）版本的主要 Java 版本提供终身 Premier 支持。LTS\
  \ 版本的好处是，付费客户即使在下一个主要版本发布后仍会收到定期补丁更新。例如，Java 11 之后的下一个 LTS 版本将是计划于 2021 年 9 月发布的\
  \ Java 17。在此期间，您将继续收到上一节中解释的新版本。对于任何主要 Java 版本，OpenJDK 用户将仅收到另外两次补丁发布。此后，假设您需要升级到下一个主要版本。\n\
  \nNOTE\n\n2018 年 10 月 30 日，Amazon 在 Amazon Linux 2 中宣布为 OpenJDK 8 和 OpenJDK 11 Java\
  \ 运行时提供免费长期支持，Amazon Linux 2 是 Amazon Web Services（AWS）提供的 Linux 服务器操作系统。2018 年\
  \ 11 月 14 日，James Gosling 宣布了 Corretto，这是一个生产就绪的 Java 长期支持发行版。\n\nLTS 版本对于升级速度较慢的保守企业客户尤其有吸引力。您可能不确定自己的软件项目需要商业许可还是免费许可。一个安全的选择是从免费的基于\
  \ OpenJDK 的发行版开始。如果您\n\n\n如果你之后意识到需要商业支持，你仍然可以切换回 Oracle JDK 并购买许可证。\n\n在掌握了 Java\
  \ 11 的基础知识后，让我们深入探讨此版本提供的新特性。与其他版本相比，这些特性可能显得微不足道。尽管如此，它们仍能改善你日常使用 Java 的工作方式。\n"
- "## 新特性\n\n对于许多开发者而言，升级到新 Java 版本的主要动力在于通过应用最新且强大的功能来提高生产力。在本节中，你将了解 Java 11 引入的语言和平台改进。我们将首先看看影响最大的特性：新的\
  \ HTTP 客户端。\n\n## 通过 HttpClient 实现内置和增强的 HTTP 通信\n\n在微服务和服务 API 的世界里，HTTP 通信是不可避免的。通常，你需要编写代码来调用端点以获取或修改数据。\n\
  \nHttpURLConnection 是一个用于 HTTP 通信的 API，已经存在很久了，但无法满足现代应用程序的需求。因此，过去 Java 开发者不得不求助于更高级、功能更丰富的库，例如\
  \ Apache HttpComponents 或 Square 的 OKHttp，它们已经支持 HTTP/2 和 WebSocket 通信。\n\nOracle\
  \ 意识到了 Java 功能集中的这一不足之处，并在 Java 9 中引入了 HTTP 客户端实现作为实验性功能。HttpClient 已经成熟，现在是 Java\
  \ 11 中的一个最终特性。如果有一个理由让你升级到 Java 11，那就是这个！再也不要维护构建过程中所需的外部依赖项了。\n\n简而言之，Java 的 HTTP\
  \ API 可以处理同步和异步通信，支持 HTTP 1.1 和 2，并且支持所有常见的 HTTP 方法，如 GET、POST、PUT 和 DELETE。使用 java.net.http\
  \ 模块进行典型的 HTTP 交互如下所示：\n\n- 1. 创建 HttpClient 的实例并对其进行配置。\n- 2. 创建 HttpRequest 的实例并填充信息。\n\
  - 3. 将请求传递给客户端，执行请求，并获取 HttpResponse 的实例。\n- 4. 处理 HttpResponse 中包含的信息。\n\n听起来很抽象？让我们看看同步和异步\
  \ HTTP 通信的具体示例。\n\n## 同步通信\n\n首先，让我们编写一个执行同步 GET 调用的程序。图 1-2 表明，同步调用会阻塞客户端，直到 HTTP\
  \ 请求被服务器处理且响应被发送回来。\n\n![](img/2331c4028acf1b9f21065457e9b2d8d4_8_0.png)\n\n图 1-2.\
  \ 同步 HTTP 通信\n\n为了演示目的，我们使用 Postman Echo，这是一个用于测试 HTTP 客户端的 RESTful 服务。示例 1-1 创建了一个\
  \ HTTP 客户端实例，执行了一个 GET 调用，并在控制台上渲染了一些响应信息。\n\n### 示例 1-1. 使用 HttpClient API 进行同步\
  \ GET 调用\n\n```\nimport java.io.IOException;\nimport java.net.URI;\nimport java.net.http.HttpClient;\n\
  import java.net.http.HttpRequest;\nimport java.net.http.HttpResponse;\n```\n\n```\n\
  ```java\nimport java.time.Duration;\n\nHttpClient httpClient = HttpClient.newBuilder()\n\
  \        .connectTimeout(Duration.ofSeconds(10))\n        .build();\n\ntry {\n \
  \   String urlEndpoint = \"https://postman-echo.com/get\";\n    URI uri = URI.create(urlEndpoint\
  \ + \"?foo1=bar1&foo2=bar2\");\n    HttpRequest request = HttpRequest.newBuilder()\n\
  \            .uri(uri)\n            .build();\n    HttpResponse<String> response\
  \ = httpClient.send(request,\n            HttpResponse.BodyHandlers.ofString());\n\
  } catch (IOException | InterruptedException e) {\n    throw new RuntimeException(e);\n\
  }\n\nSystem.out.println(\"Status code: \" + response.statusCode());\nSystem.out.println(\"\
  Headers: \" + response.headers()\n        .allValues(\"content-type\"));\nSystem.out.println(\"\
  Body: \" + response.body());\n```\n```\n\n- 1. 创建并配置 HTTP 客户端实例。该客户端使用 10 秒的连接超时。\n\
  - 2. 创建并配置 HTTP 请求。默认情况下，HTTP 请求使用 GET 方法。\n- 3. 发送 HTTP 请求并获取响应。\n- 4. 处理 HTTP\
  \ 响应返回的数据；例如，状态码、头部和正文。\n\n> **注意**\n> \n> 你可能已经注意到，`HttpClient` API 大量依赖建造者模式。当创建可以填充可选参数的更复杂对象时，建造者模式特别有用。与暴露具有多个参数重载的构造函数不同，建造者模式提供了用于配置对象的直观方法，从而形成一种易于理解和使用的流畅\
  \ API。\n\n`HttpClient` API 并不局限于仅仅进行同步调用。在下一节中，我们将探讨一个异步通信的示例。\n\n## 异步通信\n\n如果你不想等待响应并希望稍后处理响应，或者如果你想并行处理一系列调用，异步通信就非常有用。图\
  \ 1-3 展示了这种形式。\n\n![](img/2331c4028acf1b9f21065457e9b2d8d4_10_0.png)\n\n*图 1-3.\
  \ 异步 HTTP 通信*\n\n假设你想实现一个工具，用于解析网页上使用的链接，并通过对其发起 HTTP GET 请求来验证它们。示例 1-2 定义了一个 URI\
  \ 列表，并通过发出异步调用并收集结果来检查这些 URI。\n\n### 示例 1-2. 执行异步 HTTP 调用并稍后对响应做出反应\n\n```\n```java\n\
  import java.io.IOException;\nimport java.net.URI;\nimport java.net.http.HttpClient;\n\
  import java.net.http.HttpRequest;\nimport java.net.http.HttpResponse;\n```\n```\n\
  \n```\n```java\nimport java.time.Duration;\nimport java.util.List;\nimport java.util.concurrent.CompletableFuture;\n\
  import java.util.stream.Stream;\n\nimport static java.util.stream.Collectors.toList;\n\
  \nfinal List<URI> uris = Stream.of(\n        \"https://www.google.com/\",\n    \
  \    \"https://www.github.com/\",\n        \"https://www.ebay.com/\"\n    ).map(URI::create).collect(toList());\n\
  \nHttpClient httpClient = HttpClient.newBuilder()\n        .connectTimeout(Duration.ofSeconds(10))\n\
  \        .followRedirects(HttpClient.Redirect.ALWAYS)\n        .build();\n\nCompletableFuture[]\
  \ futures = uris.stream()\n        .map(uri -> verifyUri(httpClient, uri))\n   \
  \     .toArray(CompletableFuture[]::new);\nCompletableFuture.allOf(futures).join();\n\
  \nprivate CompletableFuture<Void> verifyUri(HttpClient httpClient,\n           \
  \                               URI uri) {\n    HttpRequest request = HttpRequest.newBuilder()\n\
  \            .timeout(Duration.ofSeconds(5))\n            .uri(uri)\n          \
  \  .build();\n\n    return httpClient.sendAsync(request,\n            HttpResponse.BodyHandlers.ofString())\n\
  \            .thenApply(HttpResponse::statusCode)\n            .thenApply(statusCode\
  \ -> statusCode == 200)\n            .exceptionally(__ -> false)\n            .thenAccept(valid\
  \ -> {\n                if (valid) {\n                    System.out.println(\"\
  [SUCCESS] Verified \"\n                            + uri);\n                } else\
  \ {\n                    System.out.println(\"[FAILURE] Could not \"\n         \
  \                   + \"verify \" + uri);\n                }\n            });\n\
  }\n```\n```\n\n- ❶ 定义应被验证的 URI 列表。\n- ❷ 异步验证所有 URI 并评估 future 结果。\n\n3. 发送异步 HTTP\
  \ 请求，检查响应的状态码是否为 OK，并通过打印消息对结果做出反应。\n\n正如示例 1-1 和 1-2 所示，新的 HttpClient 功能非常强大且富有表现力。HttpClient\
  \ 还具备此处未提及的更多功能。例如，它还可以处理反应式流、身份验证和 Cookie 等。欲了解更多信息，请参考 Oracle 的学习资料和 Javadocs。\n\
  \nJava 11 中另一个有趣的特性是无需编译即可启动 Java 程序的能力。让我们来看看这是如何工作的。\n\n## 无需编译即可启动单文件程序\n\nJava\
  \ 不是一种脚本语言。对于你想执行的每个程序，你都需要先通过显式运行 javac 命令对其进行编译。这种往返过程使得尝试测试用小代码片段变得不太方便。Java\
  \ 11 改变了这一情况。你现在可以直接执行包含在单个文件中的 Java 源代码，而无需先编译，如图 1-4 所示。\n\n![](img/2331c4028acf1b9f21065457e9b2d8d4_12_0.png)\n\
  \n图 1-4. 编译和不编译执行 Java 程序\n\n这一新功能为 Java 语言初学者提供了一个很好的起步平台，并允许用户以临时方式尝试逻辑。\n\n开始很容易。让我们选择一个简单的例子。文件\
  \ HelloWorld.java 通过 main 方法中的 System.out.println 在控制台上显示消息“Hello World”：\n\n```\n\
  public class HelloWorld {\n    public static void main(String[] args) {\n      \
  \  System.out.println(\"Hello World!\");\n    }\n}\n```\n\n\n\n\n要执行，请使用 Java 11\
  \ 运行 `java` 命令。Java 会即时编译源文件，并使用类路径中的类文件运行程序。任何可能出现的编译错误都会在控制台中显示：\n\n```\n$ java\
  \ -version\nopenjdk version \"11\" 2018-09-25\nOpenJDK Runtime Environment 18.9\
  \ (build 11+28)\nOpenJDK 64-Bit Server VM 18.9 (build 11+28, mixed mode)\n\n$ java\
  \ HelloWorld.java\nHello World!\n```\n\n无需编译即可启动单文件程序非常方便，但有几个限制需要注意。在 Java 11 中，程序不能使用除\
  \ `java.base` 模块之外的任何外部依赖。此外，只能启动单文件程序。目前不支持从其他 Java 源文件调用方法，但如有需要，可以在同一文件中定义多个类。我个人认为这一功能是快速原型设计的有用工具。\n\
  \n在下一节中，你将了解已添加到现有库类中的新方法。\n\n## 字符串、集合和文件的新库方法\n\n很多时候，Java 开发人员不得不依赖像 Google Guava\
  \ 或 Apache Commons 这样的外部库来获取便捷方法，否则他们就需要从一个项目复制粘贴到另一个项目。这些实现可能很小，但它们确实增加了需要维护和测试的额外\
  \ API 接口。Java 11 为 `String`、`Collections` 和 `Files` API 添加了便捷方法。\n\n让我们通过示例来探索新功能。为了有趣，让我们编写一些\
  \ JUnit 测试，应用新的 API 并验证它们在不同用例中的正确行为。\n\n## 字符串 API 增强\n\n`String` API 新增了四个便捷方法。让我们通过示例逐一了解它们。\n\
  \n### 重复字符串\n\n我们来看的第一个方法是 `String.repeat(Integer)`。从名称来看，你可能已经猜到该功能的目的。它只是将字符串重复\
  \ n 次。\n\n我能想到不止一种情况下 `repeat` 方法会派上用场。假设你需要构建一个数据表，在键/值对之间填充空白以提高可读性。以下测试用例演示了该方法在这种场景下的使用：\n\
  \n```\n@Test\nvoid canRepeatString() {\n    assertEquals(\"CPU Usage:          \
  \     5%\",\n        renderInfo(\"CPU Usage:\", \"5%\"));\n    assertEquals(\"Memory\
  \ Usage:          9.14 MB\",\n        renderInfo(\"Memory Usage:\", \"9.14 MB\"\
  ));\n    assertEquals(\"Free Disk:             96.5 GB\",\n        renderInfo(\"\
  Free Disk:\", \"96.5 GB\"));\n}\n\nprivate String renderedInfo(String title, String\
  \ value) {\n    return title + \" \".repeat(30 - title.length()\n        - value.length())\
  \ + value;\n}\n```\n\n### 检查空白或空字符串\n\n我相信你在职业生涯中的某个时刻一定需要实现数据验证。假设你想验证输入到基于 Web\
  \ 的输入字段中的值的有效性。当然，我们不想允许空白值。\n\nJava 11 引入了 `String.isBlank()` 方法，它指示字符串是否为空或仅包含空白。现在此功能已成为\
  \ Java 核心特性，不再需要引入 Apache `StringUtils` 作为外部依赖。你可以在以下测试用例中看到它的使用：\n\n```\n@Test\n\
  void canCheckIfStringContainsWhitespaces() {\n    String nameFormFieldWithoutWhitespace\
  \ = \"Duke\";\n    String nameFormFieldWithWhitespace = \"   \";\n    assertFalse(nameFormFieldWithoutWhitespace.isBlank());\n\
  \    assertTrue(nameFormFieldWithWhitespace.isBlank());\n}\n```\n\n### 移除前导和尾随空白\n\
  \n验证字符串与清理字符串密切相关。开发人员经常遇到需要清理以提取实际信息的数据。这可能涉及过滤隐藏、错误或无用的字符。\n\n新引入的 `String.strip()`\
  \ 方法负责移除前导和尾随空白。你还可以更具体地使用 `String.stripLeading()` 仅移除前导字符，或使用 `String.stripTrailing()`\
  \ 仅移除尾随字符。以下测试用例演示了所有三种方法的使用：\n\n```\n@Test\nvoid canStripStringOfLeadingAndTrailingWhitespaces()\
  \ {\n    String nameFormField = \"   Java Duke   \";\n    assertEquals(\"Java Duke\"\
  , nameFormField.strip());\n    assertEquals(\"Java Duke\", nameFormField.stripLeading());\n\
  \    assertEquals(\"   Java Duke\", nameFormField.stripTrailing());\n}\n```\n\n\
  ### 处理多行字符串\n\n逐行处理多行字符串可能既繁琐又消耗内存。首先，你必须根据行终止符拆分字符串。接下来，你需要遍历每一行。对于处理大型文本操作的软件系统，内存消耗可能是一个大问题。\n\
  \nJava 11 中引入的 `String.lines()` 方法允许你将多行文本作为 `Stream` 处理。`Stream` 表示一个元素序列，可以顺序处理，无需一次性将所有元素加载到内存中。以下是一个实际使用该方法的测试用例：\n\
  \n```\n@Test\nvoid canStreamLines() {\n    String testString = \"This\\nis\\na\\\
  ntest\";\n    List<String> lines = new ArrayList<>();\n    testString.lines().forEach(line\
  \ -> lines.add(line));\n    assertEquals(List.of(\"This\", \"is\", \"a\", \"test\"\
  ), lines);\n}\n```\n\n## 集合 API 增强\n\n在过去，将集合转换为数组很麻烦。你需要提供数组的新实例、其泛型类型以及数组的最终大小。\n\

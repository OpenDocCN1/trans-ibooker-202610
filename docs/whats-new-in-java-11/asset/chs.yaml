  \ API 的列表。\n\n## Applets and Java Web Start\n\n还记得那些我们主要在 Applet 上下文中思考 Java 的日子吗？好吧，那个时代早已过去。今天，Java\
  \ 在许多其他上下文中使用，例如服务器\n应用程序、移动和物联网 (IoT) 设备。\n\n快进到 2018 年，浏览器提供商已开始移除或已移除对 Flash\
  \ 和 Java 等基于插件技术的支持，因为性能和安全方面的担忧。Java 9 遵循这一趋势并在 2017 年弃用了对 Applets 的支持。Java 11\
  \ 完成了这一循环并完全移除了 Applets，且没有替代品。\n\nJava Web Start 提供了一种从浏览器下载 Java 桌面应用程序而不是在浏览器中运行的方式。对许多用户来说，Java\
  \ 11 也移除了对 Java Web Start 的支持，这有点令人惊讶。因此，将 Applet 转换为 Java Web Start 应用程序已不可行。\n\
  \n如果你仍在维护基于 Applets 或 Java Web Start 的应用程序，如果计划升级到 Java 11，你将需要寻找替代方案。下一节涉及 JavaFX，这是在桌面应用程序开发中一个有效且强大的选择。\n\
  \n## JavaFX Migrates to OpenJFX\n\n从 Java 11 开始，JavaFX——用于构建 Java 客户端应用程序的技术——不再随\

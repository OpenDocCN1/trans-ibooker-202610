  \ `org.omg` |\n\n那么，如果你在代码中使用了这些模块中的一个并直接升级到 Java 11 会怎样？你的代码将无法再编译，或者你可能会遇到运行时错误。虽然之前的版本允许通过手动使用\
  \ `--add-modules` 添加模块来变通，但这在 Java 11 中不再有效。\n\n最好的办法是找到作为外部依赖可用的功能替代品并将其添加到你的编译类路径中。你会发现许多被移除的模块在\

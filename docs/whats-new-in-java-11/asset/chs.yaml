  \        StandardOpenOption.WRITE);\n    assertEquals(tmpFilePath, returnedFilePath);\n\
  }\n```\n\n## Optional 和 Predicate 的增强\n\nJava 8 添加了 `Optional` 类型。该类型是一个包含可选值的单值容器。其主要目的是避免代码中充满不必要的\

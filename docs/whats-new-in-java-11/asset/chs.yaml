  \ API。一个好的做法是定期审查代码，识别已弃用功能的使用情况，并尽早找到替代方案。\n\nJava 11 移除了在早期版本中标记为已弃用的特性和 API。在本节中，我们逐一回顾这些特性和\
  \ API，并在适用的情况下提出替代方案。本节还旨在提供信息，帮助你评估移除可能对项目造成的影响。\n\n## 已移除的 Java EE 模块\n\nJava\
  \ 9 开始了 JDK 模块化的进程。在模块化 Java 的过程中，很明显一些技术和 API 属于 Java EE 而非 Java SE。Java 团队弃用了这些模块，并在下一个\
  \ LTS 版本中将其移除。因此，随着 Java 11 的发布，这些技术不再属于 JDK 的一部分。表 1-1 列出了已移除的模块。\n\n\n\n\n\n##\
  \ Table 1-1. *从 Java 11 中移除的模块*\n\n| Module | Packages |\n|---|---|\n| JavaBeans\
  \ Activation Framework (JAF) | `javax.activation` |\n| Java Transaction API (JTA)\

- pgno: 13
  md: 'To execute, run the java command with Java 11. Java will compile the source
    file on the fly and run the program with the class file on the classpath. Any
    compilation error that might occur will be rendered on the console:


    ```

    $ java -version

    openjdk version "11" 2018-09-25

    OpenJDK Runtime Environment 18.9 (build 11+28)

    OpenJDK 64-Bit Server VM 18.9 (build 11+28, mixed mode)


    $ java HelloWorld.java

    Hello World!

    ```


    Launching a single-file program without compilation is very convenient, but there
    are a couple limitations that you need to be aware of. With Java 11, the program
    cannot use any external dependencies other than the java.base module. Furthermore,
    you can launch only a single-file program. Calling methods from other Java source
    files is currently not supported, but you can define multiple classes in the same
    file if needed. I personally see this feature as a helpful tool for rapid prototyping.


    In the next section, you learn about the new methods that have been introduced
    to existing library classes.


    # New Library Methods for Strings, Collections, and Files


    All too often, Java developers must rely on external libraries like Google Guava
    or Apache Commons for convenience methods that they otherwise would need to copy
    and paste from one project to another. The implementations might be small, but
    they do create additional API surface that needs to be maintained and tested.
    Java 11 adds convenience methods to the String, Collections, and Files APIs.


    Let’s explore the new functionality by example. For the fun of it, let’s write
    some JUnit tests that apply the new APIs and verify their correct behavior for
    different use cases.


    # STRING API ENHANCEMENTS


    The String API adds four new convenience methods. Let’s have a look at each one
    of them by example.


    # Repeating a string


    The first method we look at is String.repeat(Integer). Judging by the name, you
    might have already guessed the purpose of the functionality. It simply repeats
    a string n times.'

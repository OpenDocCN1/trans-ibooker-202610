  md: 'Sounds abstract? Let’s have a look at concrete examples for synchronous and
    asynchronous HTTP communication.


    # SYNCHRONOUS COMMUNICATION


    First, let’s write a program that makes a synchronous GET call. Figure 1-2 shows
    that a synchronous call blocks the client until the HTTP request has been handled
    by the server and the response has been sent back.


    ![](img/2331c4028acf1b9f21065457e9b2d8d4_8_0.png)


    Figure 1-2. Synchronous HTTP communication


    For demonstration purposes, we use Postman Echo, a RESTful service for testing
    HTTP clients. Example 1-1 creates an HTTP client instance, performs a GET call,
    and renders some of the response information on the console.


    # Example 1-1. Making a synchronous GET call with HttpClient API


    ```

    import java.io.IOException;

    import java.net.URI;

    import java.net.http.HttpClient;

    import java.net.http.HttpRequest;

    import java.net.http.HttpResponse;

    ```'

  md: "you might ask? Let’s have a look at the license implications for each option.\n\
    \n# Licensing of the Oracle JDK and OpenJDK\n\nThere’s a single, distinguishing\
    \ factor between the Oracle JDK and OpenJDK: the license agreement. The OpenJDK\
    \ continues to be licensed with the GNU General Public License, version 2 (GPL\
    \ 2) with a classpath exception. This license allows you to use Java for open\
    \ source projects as well as commercial products without any restrictions or attribution\
    \ for development and production purposes. The classpath exception decouples the\
    \ licenses terms of the OpenJDK from the licenses terms applicable to external\
    \ libraries bundled with the executable program. Regarding the Oracle JDK, the\
    \ license has changed from the Binary Code License (BCL) for Oracle Java SE technologies\
    \ to a commercial license. As a result, you can no longer use the Oracle JDK for\
    \ production without buying into the Java SE subscription model.\n\n> **NOTE**\n\
    > \n> The subscription model also applies to any Java 8 patch release published\
    \ after January 2019 if it is used for commercial products.\n\nIt’s important\
    \ that you understand the license implications to make a choice that’s right for\
    \ your organization. If you are working on mission-critical software and you’d\
    \ like to rely on Oracle’s support for long-term patches, the commercial Oracle\
    \ JDK license is likely the best option. For open source software and products\
    \ that require only short-term patch releases for the next six months, the OpenJDK\
    \ should fully suffice. Either way, you will need to decide which Java distribution\
    \ to use as soon as you upgrade to Java 11. Be aware that there are alternative,\
    \ free distributions of the OpenJDK from other vendors. For more information,\
    \ see the Java Champions’ blog post “Java Is Still Free”.\n\n# Six-Month Release\
    \ Cadence: What It Means to You\n\nIn the early days of Java, new releases were\
    \ a big deal. They used to happen only every two to three years and contained\
    \ a lot of significant, sometimes breaking, changes like Generics in Java 5, or\
    \ syntax changes in Java 8, or the Java 9 module system. Migrating a software\
    \ project to a new Java version often required a lot of planning and effort. Some\
    \ projects even had to postpone the software production process until the migration\
    \ had been fully completed.\n\nMany industry leaders moved to a Continuous Delivery\
    \ model to drive innovation and mitigate risk: fewer changes, more frequent releases.\
    \ Oracle is committed to following this example by"

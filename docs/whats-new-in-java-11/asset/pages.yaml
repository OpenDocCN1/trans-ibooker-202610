  md: 'provides a high-level recap of the changes offered with Java 11.


    # Oracle JDK and OpenJDK converged functionally


    The main difference is that the Oracle JDK will require users to purchase a license
    for production environments. Java now follows a six-month release cycle for major
    versions. Additionally, you can expect two patch releases between each major version
    for fixing critical bugs. Java 11 is an LTS release. Paying customers of Oracle
    JDK will receive additional minor and patch releases. The OpenJDK continues to
    be a free-of-charge, open source distribution.


    # Latest features and API enhancements


    Probably the biggest feature in Java 11 is the HTTP client implementation, an
    API for HTTP communication that can meet the demands of modern application development.
    We looked at the ability to execute single-file Java programs without the need
    for compiling the code. The functionality is helpful if you want to quickly try
    out Java code snippets for prototyping purposes. The Java team added convenience
    methods to the standard modules. As a result, developers can do away with relying
    on external libraries that implement similar helper methods. Java 11 also adopts
    Unicode 10, nest-based access control, and the open source profiling tools Java
    Flight Recorder and Java Mission Control.


    # Removed APIs and deprecations


    There are a number of removed APIs and Java EE modules in Java 11, and that has
    a great impact when you upgrade a project from an earlier Java version. But there
    are other options for external libraries that can take their place. It has been
    a long time coming, but with Java 11, Applets and Java Web Start are finally out.
    Decoupling JavaFX from the JDK is going to be helpful to ensure consistent and
    periodic releases of Java. A number of functionalities have also been marked for
    removal in future versions.


    # Performance and security


    Java 11 has made the default garbage collector more efficient and has introduced
    two new experimental garbage collectors: ZGC, which is suited for memory-intensive
    applications, and Epsilon, which targets programs with a predictable, short-term
    memory footprint. Java 11 supports the latest version of the Transport Layer Security
    protocol, TLS 1.3, making HTTPS communication faster and safer than ever. Although
    it might require some work to integrate, I think the new features, changes, and
    optimizations in Java 11 are worth the effort because they facilitate a more efficient
    programming style and provide improved performance and security in production.'

  md: 'releasing a new major version every six months, and a minor release every two
    months. As a result, upgrading to a new version of Java will have less of an impact
    on your project. Figure 1-1 shows the expected dates of the upcoming major and
    minor Java releases.


    ![](img/2331c4028acf1b9f21065457e9b2d8d4_6_0.png)


    Figure 1-1. Java’s projected release cycle


    With more frequent releases comes the responsibility of ensuring platform stability.
    For that very reason, Oracle provides a long-term support release every three
    years. Next, we have a look at what “long-term support” means in practice.


    # Long-Term Support


    Oracle offers lifetime Premier Support for all major Java versions that have been
    designated a long-term support (LTS) release. The benefit of an LTS release is
    that paying customers will receive periodic patch updates even after the next
    major version has been released. For example, the next LTS release after Java
    11 will be Java 17, which is planned for September 2021. In the meantime, you
    will continue to receive new releases, as explained in the previous section. For
    any major Java version, OpenJDK users will receive only two more patch releases.
    After that, it is assumed that you will need to upgrade to the next major version.


    NOTE


    On October 30, 2018, Amazon announced free long-term support for OpenJDK 8 and
    OpenJDK 11 Java runtimes in Amazon Linux 2, a Linux server operating system from
    Amazon Web Services (AWS). On November 14, James Gosling announced Corretto, a
    production-ready, long-term support distribution of Java.


    LTS releases are especially attractive for more conservative enterprise customers
    with a slower upgrade rate. You might be unsure whether you need a commercial
    or free license for your software projects. A safe bet is to start with one of
    the free OpenJDK-based distributions. If you'

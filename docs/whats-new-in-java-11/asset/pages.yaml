  md: 'The `HttpClient` API isn’t limited to just making a synchronous call. In the
    following section, we explore an example for asynchronous communication.


    # ASYNCHRONOUS COMMUNICATION


    Asynchronous communication is useful if you don’t want to wait on the response
    and deal with the response later or if you want to process a list of calls in
    parallel. Figure 1-3 shows what this looks like.


    ![](img/2331c4028acf1b9f21065457e9b2d8d4_10_0.png)


    *Figure 1-3. Asynchronous HTTP communication*



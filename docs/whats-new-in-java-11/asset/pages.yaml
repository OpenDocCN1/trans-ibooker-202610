  md: 'Agreements (SLAs).


    The Z Garbage Collector (ZGC) is a scalable, low-latency garbage collector. What
    does that mean in practice? Although ZGC does not eliminate pause times completely,
    it guarantees a maximum pause time of 10 ms. Moreover, it can handle heaps from
    small to large (multiple terabytes). One other optimization that is important
    to mention is that with ZGC pause times do not increase the heap size. These conditions
    make ZGC a good for fit for memory-hungry applications that deal with a lot of
    data.


    Do you want to try running a Java program with ZGC? You can enable the garbage
    collector by providing the VM options -XX:+UnlockExperimentalVMOptions -XX:+UseZGC.
    ZGC has been marked as experimental, so you will need to be cautious when using
    it for production systems. For more information, see the ZGC documentation page.


    Java 11 adds another experimental garbage collector: Epsilon. In the next section,
    we take a brief look at its use cases and performance criteria.


    # THE NO-OP GARBAGE COLLECTOR: EPSILON


    The second, experimental garbage collector available in Java 11 is called the
    Epsilon Garbage Collector. Epsilon is a low-overhead garbage collector, also referred
    to as a no-op garbage collector. You might be able to guess what that means. It
    doesn’t reclaim memory at all after the space has been allocated.


    Although this behavior sounds a bit strange at first, it definitely makes sense
    to apply Epsilon in certain use cases. Examples include short-lived programs such
    as command-line applications that execute only a single command and then shut
    down the JVM, or scenarios in which you want to performance-test a program.


    To enable Epsilon for a program, use the VM options -XX:+UnlockExperimentalVMOptions
    -XX:+UseEpsilonGC. For more information, see JEP 318, the enhancement proposal
    document.



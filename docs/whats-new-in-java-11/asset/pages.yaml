    \ value) {\n    return title + \" \".repeat(30 - title.length()\n        - value.length())\
    \ + value;\n}\n```\n\n# Checking for empty or whitespaces\n\nI am sure you have\
    \ needed to implement data validation at some point of your career. Suppose that\

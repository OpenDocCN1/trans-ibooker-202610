  md: 'later realize that you need commercial support, you can still switch to the
    Oracle JDK and pay for the license.


    With the basic knowledge of Java 11 under your belt, let’s dive into the new features
    this release has to offer. They might be small compared to other releases. Nevertheless,
    they can improve how you work with Java on a day-to-day basis.


    # New Features


    For many developers, the main motivation for upgrading to a new Java version is
    to increase productivity by applying the latest and greatest features. In this
    section, you will learn about the language and platform improvements introduced
    with Java 11. We’ll begin by looking at the feature with the biggest impact: the
    new HTTP client.


    # Built-in and Improved HTTP Communication with HttpClient


    In a world of microservices and service APIs, HTTP communication is inevitable.
    It’s common to need to write code that makes a call to an endpoint to retrieve
    or modify data.


    HttpURLConnection, an API for HTTP communication, has been around for ages but
    couldn’t keep up with the requirements of modern-day applications. As a result,
    in the past, Java developers had to resort to more advanced, feature-rich libraries
    like Apache HttpComponents or Square’s OKHttp, which already supported HTTP/2
    and WebSocket communication.


    Oracle recognized this shortcoming in Java’s feature set and introduced an HTTP
    client implementation as an experimental feature with Java 9. HttpClient has grown
    up and is now a final feature in Java 11. If there’s one reason to upgrade to
    Java 11, this is it! No more external dependencies that you need to maintain as
    part of your build process.


    In a nutshell, Java’s HTTP API can handle synchronous and asynchronous communication
    and supports HTTP 1.1 and 2 as well as all common HTTP methods like GET, POST,
    PUT, and DELETE. A typical HTTP interaction with the java.net.http module looks
    like this:


    +   1. Create an instance of HttpClient and configure it as needed.

    +   2. Create an instance of HttpRequest and populate the information.

    +   3. Pass the request to the client, perform the request, and retrieve an instance
    of HttpResponse.

    +   4. Process the information contained in the HttpResponse.'

    \nAnother interesting feature in Java 11 is the ability to launch a Java program\
    \ without the need for compilation. Let’s explore how this works.\n\n# Launching\
    \ Single-File Programs Without Compilation\n\nJava is not a scripting language.\
    \ For every program that you’d like to execute, you need to first compile it by\
    \ explicitly running the javac command. This roundtrip makes it less convenient\
    \ to try out little snippets of code for testing purposes. Java 11 changes that.\
    \ You can now execute Java source code contained in a single file without the\
    \ need to compile it first, as shown in Figure 1-4.\n\n![](img/2331c4028acf1b9f21065457e9b2d8d4_12_0.png)\n\

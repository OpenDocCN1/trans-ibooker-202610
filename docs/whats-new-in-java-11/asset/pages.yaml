  md: "# Enhancements to Optional and Predicate\n\nJava 8 added the `Optional` type.\
    \ This type is a single-value container that contains an optional value. Its main\
    \ purpose is to avoid cluttering the code with unnecessary null checks. You can\
    \ check whether a value is present within the container without actually retrieving\
    \ it by calling the `isPresent()` method.\n\nIn the latest version of Java, you\
    \ can also ask for the inverse: “Is the value empty?” Instead of using the negation\
    \ of the `isPresent()` method, you can now just use the `isEmpty()` method to\
    \ make the code easier to understand. The following test case compares the use\
    \ of both methods:\n\n```\n@Test\nvoid canCheckOptionalForEmpty() {\n    String\

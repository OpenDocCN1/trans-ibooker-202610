- '# AI 公平性


  ## 简介


  ### 人类决策是否比自动化决策偏见更少？


  本报告将指导数据科学领导者和实践者了解定义公平性以及在整个机器学习流水线中减少不公平偏见的关键挑战。它阐述了为什么数据科学团队需要尽早且权威地参与构建值得信赖的人工智能（AI）。它还用通俗易懂的英语解释了组织应如何思考
  AI 公平性，以及模型偏见与模型准确性之间的权衡。虽然已有大量文献论述 AI 偏见的社会不公，但本报告重点关注团队如何利用 `AI Fairness 360 (AIF360)`
  中可用的开源工具来缓解不公平的机器偏见。


  开发无偏见算法涉及公司内部的许多利益相关者。读完本报告后，您将了解在为您的用例定义公平性时需要考虑的诸多因素（如法律合规性、道德伦理和信任度）。您还将了解到定义公平性有多种方式，因此衡量和减少不公平偏见也有多种不同的方法。虽然无法消除所有偏见，但您将了解到组织应为模型准确性和偏见定义可接受的阈值。


  在本报告中，我们将概述随着算法使用日益普及，AI 偏见如何可能对每个行业产生负面影响。接下来，我们将讨论如何定义公平性及偏见的来源。然后，我们将讨论机器学习流水线中的偏见以及当前的偏见缓解工具包。随后，我们将深入探讨
  `AI Fairness 360` 工具包，重点介绍如何衡量偏见并尝试消除它。最后，我们将通过一个信用评分用例的 Python 教程进行总结，并提供关于公平性和偏见的一些指导。


  ### AI 公平性变得日益关键


  AI 正越来越多地用于医疗保健、招聘和刑事司法等高度敏感领域，因此人们更广泛地关注其中嵌入的偏见和不公平性的影响。我们知道，许多领域的人类决策都存在偏见，并受到我们个人或社会偏见的影响，这些偏见往往是无意识的。人们可能会假设使用数据来自动化决策会让一切变得公平，但我们现在知道事实并非如此。AI
  偏见可能通过嵌入在训练数据集中的社会偏见、机器学习开发过程中做出的决策，以及机器学习模型部署到现实世界时产生的复杂反馈循环而引入。


  大量证据表明，AI 可以将人类和社会偏见内化并大规模部署。许多专家现在表示，不必要的偏见可能是阻碍 AI 发挥全部潜力的主要障碍。一个备受媒体关注的案例是“替代制裁矫正罪犯管理画像”（COMPAS），这是一种用于预测佛罗里达州布劳沃德县等司法管辖区的被告如果不被羁押是否可能犯罪的算法。2016
  年，ProPublica 的记者进行的一项调查发现，COMPAS 算法[将非裔美国被告错误标记为“高风险”的比率](https://oreil.ly/Xcl1Q)，几乎是白人被告的两倍。这说明
  AI 算法可能对社会产生重大负面影响。那么，我们如何确保自动化决策比人类决策更少偏见？


  ### 定义公平性


  公平性是一个复杂且多面的概念，取决于语境和文化。因此，为组织的用例定义公平性可能很困难。至少有 21 种数学定义的公平性。^(1) 这些不仅仅是衡量公平性的理论差异；不同的定义关注公平性的不同方面，因此可能产生截然不同的结果。公平性研究人员已经证明，不可能同时满足不同的公平性定义。^(2)
  芝加哥大学创建了一个[决策树](https://oreil.ly/VJBni)，有助于思考组织如何定义公平性。


  许多定义要么关注**个体公平性**（对相似个体给予相似对待），要么关注**群体公平性**（使模型的预测/结果在不同群体间公平）。个体公平性旨在确保相似个体的结果统计度量相等。群体公平性根据受保护属性将人口划分为不同群体，并旨在确保不同群体间的结果统计度量相等。


  在关注群体公平性的人群中，存在两种对立的世界观。可以大致概括为“我们都是平等的”（WAE）和“所见即所得”（WYSIWYG）。^(3) WAE 世界观认为所有群体拥有相同的能力，而
  WYSIWYG 世界观认为观察结果反映了群体的能力。


  例如，让我们考虑大学如何利用 SAT 成绩作为预测大学成功的特征来定义群体公平性。WYSIWYG 世界观会认为分数与未来的成功有很好的相关性，可用于准确比较申请者的能力。相反，WAE
  世界观会认为 SAT 成绩可能包含结构性偏见，因此其在不同群体间的分布差异不应被误认为是能力分布的差异。





  此外，不同的偏见处理算法针对机器学习生命周期的不同部分；即使对于算法公平性专家来说，理解如何、何时以及为何使用每项研究贡献也颇具挑战。因此，AI 利益相关者和从业者需要明确如何着手。目前负担落在了从业者身上，他们面临如下问题：


  *   我们的数据是否应该去偏？

  *   我们是否应该创建能学习无偏模型的新分类器？

  *   纠正模型的预测结果是否更好？


  本报告帮助您制定策略，以针对贵组织的特定用例解决此类问题。


  ## 偏见从何而来？


  算法偏见常在机器学习中被讨论，但在大多数情况下，底层数据而非算法才是偏见的主要来源。以监督学习为例，这是最常见的机器学习形式。其目标是找到一个数学函数，该函数以数值、序数或分类特征的数据点为输入，并预测这些数据点的正确标签。模型在数据上训练，而这些数据往往包含反映社会或历史不平等影响的人类决策。


  例如，在信用评分模型中，特征可能是申请人的收入、教育水平和职业，标签可能是申请人三年后是否违约。算法通过在大量已标记的样本上训练来找到所需的函数。虽然该函数拟合了训练数据，但当应用于新数据点时，它必须泛化以实现良好的预测。在其最基本的形式中，拟合是为了优化平均准确率等标准而进行的。


  机器学习模型最大的问题在于训练分布并不总是与期望分布相匹配。如果当下的现实让某些个体处于系统性劣势，训练数据分布很可能会复现这种劣势，而非反映更公平的未来。无论何时法官和招聘经理做出决策，刑事司法系统中针对非裔美国人的偏见和就业中针对女性的偏见都可能存在。这些决策反映在训练数据中，随后被固化到未来的机器学习模型决策中。可能引入数据的偏见类型包括以下几种：


  采样偏差

  : 当某一人群在训练数据集中过度代表或代表不足时，就会发生采样偏差。例如，一个主要基于白人男性求职者训练的招聘工具。


  标签偏差

  : 在创建训练数据时，如果标注过程引入了偏见，就会发生标签偏差。例如，标注数据的人员可能无法代表多样化的地区、种族、语言、年龄和性别群体，并会将其隐性个人偏见带入标签中。这可能导致标签出现偏斜，从而使某些群体处于系统性劣势。


  结果代理偏差

  : 当机器学习任务未被适当指定时，就会发生结果代理偏差。例如，如果想预测某人犯罪的可能性，用逮捕记录作为代理是有偏见的，因为警察巡逻更多的社区逮捕率更高。此外，被捕并不意味着有罪。同样，用一个人对医疗系统的成本作为其健康质量的代理也是有偏见的。


  ## 偏见与机器学习


  机器学习模型对特定实例的结果进行预测。例如，给定一个贷款申请实例，模型可能会预测申请人是否会偿还贷款。模型基于训练数据集进行这些预测，该数据集提供了许多其他实例（其他贷款申请）和实际结果（借款人是否偿还）。因此，当需要对新实例进行预测时，机器学习算法会尝试在训练数据集中寻找模式，或称*泛化*。例如，一种模式可能是：如果一个人的薪水超过
  40,000 美元且未偿还债务少于 5,000 美元，他们就会偿还贷款。在许多领域，这种称为*监督机器学习*的技术效果很好。


  然而，有时此类模型发现的模式是不可取甚至违法的。例如，我们的贷款偿还模型可能会判定年龄在偿还预测中起重要作用，因为训练数据集碰巧显示某个年龄组的偿还率优于另一个年龄组。这引发了两个问题。首先，训练数据集可能不能代表所有年龄段人群的真实总体。其次，即使它具有代表性，仅基于申请人的年龄做决定也是违法的，无论这是否是基于历史数据的良好预测。


  AIF 360 通过*公平性指标*和*偏见缓解器*来解决此问题。我们可以使用公平性指标检查机器学习工作流中的偏见。我们可以使用偏见缓解器克服工作流中的偏见，以产生更公平的结果。贷款场景描述了一个非法偏见的直观例子。然而，机器学习中并非所有不可取的偏见都是违法的；偏见也可能以更微妙的方式表现出来。例如，贷款公司可能希望在所有收入水平上拥有多元化的客户组合，因此会认为向高收入客户发放更多贷款而非低收入客户是不可取的。虽然这样做不违法也不违背伦理，但不利于公司的战略。


  ## 我能不能直接移除受保护属性？


  在构建机器学习模型时，许多数据科学家假设只需移除受保护属性（即种族、性别、年龄）即可避免不公平偏见。然而，有许多特征与受保护属性关联过于紧密，这使得即使你从训练集中删除了种族等受保护属性，也很容易重构出来。


  一个例子是亚马逊推出了针对 35 美元以上订单的 Prime 免费当日达服务。项目推出 11 个月后，亚马逊在 27 个大都市区提供当日达服务。然而，一项 [2016
  年彭博新闻分析](https://oreil.ly/6_D_s) 发现，在受服务的主要城市中，有六个城市在不同程度上排除了以黑人为主的邮编区域。而在亚特兰大、芝加哥、达拉斯、华盛顿、波士顿和纽约，黑人居民生活在可享受亚马逊当日达服务的社区的可能性只有白人居民的一半左右。这是如何发生的？亚马逊将其当日达服务模型聚焦于
  Prime 会员高度集中的邮编区域，而非种族。然而，在大多数付费会员集中在以白人为主的城区的城市里，关注数字而非人并未能阻止数据驱动的计算强化零售服务获取方面根深蒂固的不平等。


  ## 结论


  偏见缓解并非灵丹妙药。公平性是一个多面的、依赖语境的社会建构，无法用简单的定义概括。AIF 360 中的指标和算法可以通过[分配正义](https://oreil.ly/ZDm9O)的视角来审视，并不能涵盖所有情境下公平性的完整范畴。该工具包仅应用于非常有限的场景：具有明确定义的受保护属性的分配或风险评估问题，在这些问题中，人们希望拥有某种统计或数学意义上的同质性概念。即便如此，AIF
  360 中包含的代码和附属材料也只是多方利益相关者就整体决策工作流进行更广泛讨论的起点。





  ## 参考文献


  ^(1) Arvind Narayanan，“21 个公平性定义及其政治含义”，公平性、问责制与透明度大会教程，2018 年 2 月。[*https://oreil.ly/MhDrk*](https://oreil.ly/MhDrk)。


  ^(2) J. Kleinberg 等，“风险评分公平确定中的固有权衡”，载于*第 8 届理论计算机科学创新会议论文集*，2017 年 1 月，43.1–43.23。


  ^(3) S. A. Friedler 等，“论公平性的（不）可能性”，2016 年 9 月，*arXiv:1609.07236*。[*https://oreil.ly/ps4so*](https://oreil.ly/ps4so)。


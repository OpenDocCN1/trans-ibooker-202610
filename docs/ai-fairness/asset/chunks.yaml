    ## 简介


    ### 人类决策是否比自动化决策偏见更少？


    本报告将指导数据科学领导者和实践者了解定义公平性以及在整个机器学习流水线中减少不公平偏见的关键挑战。它阐述了为什么数据科学团队需要尽早且权威地参与构建值得信赖的人工智能（AI）。它还用通俗易懂的英语解释了组织应如何思考
    AI 公平性，以及模型偏见与模型准确性之间的权衡。虽然已有大量文献论述 AI 偏见的社会不公，但本报告重点关注团队如何利用 `AI Fairness 360
    (AIF360)` 中可用的开源工具来缓解不公平的机器偏见。


    开发无偏见算法涉及公司内部的许多利益相关者。读完本报告后，您将了解在为您的用例定义公平性时需要考虑的诸多因素（如法律合规性、道德伦理和信任度）。您还将了解到定义公平性有多种方式，因此衡量和减少不公平偏见也有多种不同的方法。虽然无法消除所有偏见，但您将了解到组织应为模型准确性和偏见定义可接受的阈值。


    在本报告中，我们将概述随着算法使用日益普及，AI 偏见如何可能对每个行业产生负面影响。接下来，我们将讨论如何定义公平性及偏见的来源。然后，我们将讨论机器学习流水线中的偏见以及当前的偏见缓解工具包。随后，我们将深入探讨
    `AI Fairness 360` 工具包，重点介绍如何衡量偏见并尝试消除它。最后，我们将通过一个信用评分用例的 Python 教程进行总结，并提供关于公平性和偏见的一些指导。


    ### AI 公平性变得日益关键


    AI 正越来越多地用于医疗保健、招聘和刑事司法等高度敏感领域，因此人们更广泛地关注其中嵌入的偏见和不公平性的影响。我们知道，许多领域的人类决策都存在偏见，并受到我们个人或社会偏见的影响，这些偏见往往是无意识的。人们可能会假设使用数据来自动化决策会让一切变得公平，但我们现在知道事实并非如此。AI
    偏见可能通过嵌入在训练数据集中的社会偏见、机器学习开发过程中做出的决策，以及机器学习模型部署到现实世界时产生的复杂反馈循环而引入。


    大量证据表明，AI 可以将人类和社会偏见内化并大规模部署。许多专家现在表示，不必要的偏见可能是阻碍 AI 发挥全部潜力的主要障碍。一个备受媒体关注的案例是“替代制裁矫正罪犯管理画像”（COMPAS），这是一种用于预测佛罗里达州布劳沃德县等司法管辖区的被告如果不被羁押是否可能犯罪的算法。2016
    年，ProPublica 的记者进行的一项调查发现，COMPAS 算法[将非裔美国被告错误标记为“高风险”的比率](https://oreil.ly/Xcl1Q)，几乎是白人被告的两倍。这说明
    AI 算法可能对社会产生重大负面影响。那么，我们如何确保自动化决策比人类决策更少偏见？


    ### 定义公平性


    公平性是一个复杂且多面的概念，取决于语境和文化。因此，为组织的用例定义公平性可能很困难。至少有 21 种数学定义的公平性。^(1) 这些不仅仅是衡量公平性的理论差异；不同的定义关注公平性的不同方面，因此可能产生截然不同的结果。公平性研究人员已经证明，不可能同时满足不同的公平性定义。^(2)
    芝加哥大学创建了一个[决策树](https://oreil.ly/VJBni)，有助于思考组织如何定义公平性。


    许多定义要么关注**个体公平性**（对相似个体给予相似对待），要么关注**群体公平性**（使模型的预测/结果在不同群体间公平）。个体公平性旨在确保相似个体的结果统计度量相等。群体公平性根据受保护属性将人口划分为不同群体，并旨在确保不同群体间的结果统计度量相等。


    在关注群体公平性的人群中，存在两种对立的世界观。可以大致概括为“我们都是平等的”（WAE）和“所见即所得”（WYSIWYG）。^(3) WAE 世界观认为所有群体拥有相同的能力，而
    WYSIWYG 世界观认为观察结果反映了群体的能力。


    例如，让我们考虑大学如何利用 SAT 成绩作为预测大学成功的特征来定义群体公平性。WYSIWYG 世界观会认为分数与未来的成功有很好的相关性，可用于准确比较申请者的能力。相反，WAE
    世界观会认为 SAT 成绩可能包含结构性偏见，因此其在不同群体间的分布差异不应被误认为是能力分布的差异。


    '

    \ data-driven calculation from reinforcing long-entrenched inequality in access\
    \ to retail services.\n\n# Conclusion\n\nBias mitigation is not a silver bullet.\
    \ Fairness is a multifaceted, context-dependent social construct that defies simple\
    \ definition. The metrics and algorithms in AIF 360 can be viewed through the\

    Although *bias* can refer to any form of preference, fair or unfair, our focus
    is on *undesirable bias* or *discrimination*, which is when specific privileged
    groups are placed at a systematic advantage and specific unprivileged groups are
    placed at a systematic disadvantage. This relates to attributes such as race,
    gender, age, and sexual orientation.


    # Which Metrics Should You Use?


    AIF360 currently contains 77 fairness metrics to measure bias (see [Figure 1-2](#ch01.xhtml#fig_2_how_bias_is_measured)),
    so it can be difficult to understand which metrics to use for each use case. Because
    there is no one best metric for every case, it is recommended to use several metrics,
    carefully chosen with the guidance of subject matter experts and key stakeholders
    within your organization. AIF360 has both difference and ratio versions of metrics
    that essentially convey the same information, so you can choose based on the comfort
    of the users examining the results.


    AIF360’s [API documentation](https://oreil.ly/LSBZO) allows you to view all of
    its metrics and algorithms along with a definition of each metric, algorithm,
    or explainer; the research on which it is based; its source code; and its parameters
    and exceptions. There are several classes of metrics listed in the API categories
    that follow. If your use case requires metrics on training data, use the ones
    in the `DatasetMetric` class (and in its child classes, such as `BinaryLabelDatasetMetric`).
    If the application requires metrics on models, use the `ClassificationMetric`
    class. Here are the relevant classes:


    **`BinaryLabelDatasetMetric`**: A class for computing metrics based on a single
    binary label dataset


    **`ClassificationMetric`**: A class for computing metrics based on a two binary
    label dataset


    **`SampleDistortionMetric`**: A class for computing metrics based on two structured
    datasets


    **`Utility Functions`**: A helper script for implementing metrics


    ![](Images/aifa_0102.png)


    ## Individual Versus Group Fairness Metrics


    If your use case is focused on individual fairness, use the metrics in the `SampleDistortionMetric`
    class or the consistency metric. If your focus is on group fairness, use the `DatasetMetric`
    class (and its child classes, such as the `BinaryLabelDatasetMetric`) as well
    as `ClassificationMetric`. And if your use case is concerned with *both* individual
    and group fairness and requires the use of a single metric, use the generalized
    entropy index and its specializations to the Theil index and the coefficient of
    variation in the `ClassificationMetric` class. However, multiple metrics, including
    ones from both individual and group fairness, can be examined simultaneously.


    ## Worldviews and Metrics


    If your use case follows the WAE worldview, use the demographic parity metrics
    (such as `disparate_impact` and `statistical_parity_difference`). If your use
    case follows the WYSIWYG worldview, use the equality of odds metrics (such as
    `average_odds_difference` and `average_abs_odds_difference`). Other group fairness
    metrics (often labeled “equality of opportunity”) lie in between the two worldviews.
    Relevant metrics include the following:


    *   `false_negative_rate_ratio`

    *   `false_negative_rate_difference`

    *   `false_positive_rate_ratio`

    *   `false_positive_rate_difference`

    *   `false_discovery_rate_ratio`

    *   `false_discovery_rate_difference`

    *   `false_omission_rate_ratio`

    *   `false_omission_rate_difference`

    *   `error_rate_ratio`

    *   `error_rate_difference`


    ## Dataset Class


    The `Dataset` class and its subclasses are a key abstraction that handle all forms
    of data. Training data is used to learn classifiers, whereas testing data is used
    to make predictions and compare metrics. Besides these standard aspects of a machine
    learning pipeline, fairness applications also require associating protected attributes
    with each instance or record in the data. To maintain a common format, independent
    of what algorithm or metric is being applied, AIF360 structures the `Dataset`
    class so that all relevant attributes (features, labels, protected attributes,
    and their respective identifiers) are present in and accessible from each instance
    of the class. Subclasses add further attributes that differentiate the dataset
    and dictate with which algorithms and metrics it can interact.


    Structured data is the primary type of dataset studied in fairness literature
    and is represented by the `StructuredDataset` class. Further distinction is made
    for a `BinaryLabelDataset`—a structured dataset that has a single label per instance
    that can take only one of two values: favorable or unfavorable. Unstructured data
    can be accommodated in the AIF360 architecture by constructing a parallel class
    to the `StructuredDataset` class, without affecting existing classes or algorithms
    that do not apply to unstructured data.


    # Transparency in Bias Metrics


    We now turn our focus to the broader issue of improving transparency in bias metrics.


    ## Explainer Class


    The AIF 360 toolkit prioritizes the need to explain fairness metrics, so IBM researchers
    developed an `Explainer` class to coincide with the `Metrics` class that provides
    further insights about computed fairness metrics. Different subclasses of varying
    complexity that extend the `Explainer` class can be created to output explanations
    that are meaningful to different kinds of users. The explainer capability implemented
    in the first release of AIF360 is basic reporting through printed JSON outputs.
    Future releases might include fine-grained localization of bias, actionable recourse
    analysis, and counterfactual fairness.


    ## AI FactSheets


    One barrier to fairness and trust in AI is the lack of standard practices to document
    how AI services are created, tested, trained, deployed, and evaluated. Organizations
    are asking for transparency in AI services as well as how they should and should
    not be used. To address this need, [AI FactSheets](https://oreil.ly/Bvo10)^([1](#ch01.xhtml#idm46444778451176))
    provide information about a machine learning model’s important characteristics
    in a similar way to food nutrition labels or appliance specification sheets. They
    would contain information such as system operation, training data, underlying
    algorithms, test setup and results, performance benchmarks, fairness and robustness
    checks, intended uses, maintenance, and retraining. Example questions could be
    as follows:


    *   Does the dataset used to train the service have a datasheet or data statement?

    *   Were the dataset and model checked for biases? If so, describe the bias policies
    that were checked, bias checking methods, and results.

    *   Was any bias mitigation performed on the dataset? If so, describe the mitigation
    method.

    *   Are algorithm outputs explainable or interpretable? If so, explain how (for
    example, through a directly explainable algorithm, local explainability, or explanations
    via examples).

    *   Who is the target user of the explanation (machine learning expert, domain
    expert, general consumer, regulator, etc.)?

    *   Was the service tested on any additional datasets? Do they have a datasheet
    or data statement?

    *   Describe the testing methodology.

    *   Is usage data from service operations retained?

    *   What behavior is expected if the input deviates from training or testing data?

    *   How is the overall workflow of data to the AI service tracked?


    This information will aid users in understanding how the service works, its strengths
    and limitations, and whether it is appropriate for the application they are considering.


    ^([1](#ch01.xhtml#idm46444778451176-marker)) M. Arnold et al., “FactSheets: Increasing
    Trust in AI Services through Supplier’s Declarations of Conformity” in *IBM Journal
    of Research and Development* 63, no. 4/5, (July/September 2019): 6, [*https://oreil.ly/Bvo10*](https://oreil.ly/Bvo10).


    # Chapter 2. Algorithms for Bias Mitigation


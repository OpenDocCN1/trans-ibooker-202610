    \ = [{'race': 1}] # White\nunprivileged_groups = [{'race': 0}] # Not white\n```\n\
    \n# Step 3: Compute Fairness Metric on Original Training Dataset\n\nNow that we’ve\
    \ identified the protected attribute, `race`, and defined privileged and unprivileged\
    \ values, we can use AIF360 to detect bias in the dataset. One simple test is\
    \ to compare the percentage of favorable results for the privileged and unprivileged\
    \ groups, subtracting the former percentage from the latter. A negative value\

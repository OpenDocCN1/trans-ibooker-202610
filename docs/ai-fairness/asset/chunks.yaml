    \ \n    Original training dataset \nDifference in mean outcomes between unprivileged\
    \ and \\\n    privileged groups = -0.104553\n```\n\n# Step 4: Mitigate Bias by\
    \ Transforming the Original Dataset\n\nThe previous step showed that the privileged\
    \ group was getting 10.5% more positive outcomes in the training dataset. Because\
    \ this is not desirable, we are going to try to mitigate this bias in the training\
    \ dataset. As stated earlier, this is called *pre-processing mitigation* because\

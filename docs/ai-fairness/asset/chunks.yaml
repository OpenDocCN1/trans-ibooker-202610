    \ learning pipeline. In this chapter, we look at the pre-processing, in-processing,\
    \ and post-processing categories of bias mitigation algorithms.\n\n# Most Bias\
    \ Starts with Your Data\n\nAIF360’s bias mitigation algorithms are categorized\
    \ based on where in the machine learning pipeline they are deployed, as illustrated\
    \ in [Figure 2-1](#ch02.xhtml#fig_1_where_can_you_intervene_in_the_pipeline).\
    \ As a general guideline, you can use its pre-processing algorithms if you can\
    \ modify the training data. You can use in-processing algorithms if you can change\
    \ the learning procedure for a machine learning model. If you need to treat the\
    \ learned model as a black box and cannot modify the training data or learning\
    \ algorithm, you will need to use the post-processing algorithms.\n\n![](Images/aifa_0201.png)\n\
    \n# Pre-Processing Algorithms\n\nPre-processing is the optimal time to mitigate\
    \ bias given that most bias is intrinsic to the data. With pre-processing algorithms,\
    \ you attempt to reduce bias by manipulating the training data before training\
    \ the algorithm. Although this is conceptually simple, there are two key issues\
    \ to consider. First, data can be biased in complex ways, so it is difficult for\
    \ an algorithm to translate one dataset to a new dataset which is both accurate\
    \ and unbiased. Second, there can be legal issues involved: in [some cases](https://oreil.ly/d_PGf),\
    \ training the decision algorithm on nonraw data can violate antidiscrimination\
    \ laws.\n\nThe following are the pre-processing algorithms in AIF360 as of early\
    \ 2020:\n\nReweighing Pre-Processing\n\n: \n\nGenerates weights for the training\
    \ samples in each (group, label) combination differently to ensure fairness before\
    \ classification. It does not change any feature or label values, so this is ideal\
    \ if you are unable to make value changes.\n\nOptimized Pre-Processing\n\n: \n\
    \nLearns a probabilistic transformation that edits the features and labels in\
    \ the data with group fairness, individual distortion, and data fidelity constraints\
    \ and objectives.\n\nLearning Fair Representations\n\n: \n\nFinds a latent representation\
    \ that encodes the data well but obfuscates information about protected attributes.\n\
    \nDisparate-Impact Remover\n\n: \n\nEdits feature values to increase group fairness\
    \ while preserving rank ordering within groups.\n\nIf your application requires\
    \ transparency about the transformation, Disparate-Impact Remover and Optimized\
    \ Pre-Processing are ideal.\n\n# In-Processing Algorithms\n\nYou can incorporate\
    \ fairness into the training algorithm itself by using in-processing algorithms\
    \ that penalize unwanted bias. In-processing is done through fairness constraints\
    \ (e.g., older people should be accepted at the same rate as young people) that\
    \ influence the loss function in the training algorithm. Here are some of the\
    \ most widely used in-processing algorithms in AIF360:\n\nAdversarial Debiasing\n\
    \n: \n\nLearns a classifier to maximize prediction accuracy and simultaneously\
    \ reduces an adversary’s ability to determine the protected attribute from the\
    \ predictions. This approach leads to a fair classifier because the predictions\
    \ can’t carry any group discrimination information that the adversary can exploit.\n\
    \nPrejudice Remover\n\n: \n\nAdds a discrimination-aware regularization term to\
    \ the learning objective.\n\nMeta Fair Classifier\n\n: \n\nTakes the fairness\
    \ metric as part of the input and returns a classifier optimized for the metric.\n\
    \n# Post-Processing Algorithms\n\nIn some instances, a user might have access\
    \ to only black-box models, so post-processing algorithms must be used. AIF360\
    \ post-processing algorithms (see [Figure 2-2](#ch02.xhtml#fig_2_algorithms_in_the_machine_learning_pipeline))\
    \ can be used to reduce bias by manipulating the output predictions after training\
    \ the algorithm. Post-processing algorithms are easy to apply to existing classifiers\
    \ without retraining. However, a key challenge in post-processing is finding techniques\
    \ that reduce bias and maintain model accuracy. AIF360’s post-processing algorithms\
    \ include the following:\n\nEqualized Odds\n\n: \n\nSolves a linear program to\
    \ find probabilities with which to change output labels to optimize equalized\
    \ odds.\n\nCalibrated Equalized Odds \n\n: \n\nOptimizes over calibrated classifier\
    \ score outputs to find probabilities with which to change output labels with\
    \ an equalized odds objective.\n\nReject Option Classification\n\n: \n\nGives\
    \ favorable outcomes to unprivileged groups and unfavorable outcomes to privileged\
    \ groups in a confidence band around the decision boundary with the highest uncertainty.\n\
    \n![](Images/aifa_0202.png)\n\n# Continuous Pipeline Measurement\n\nThe probability\
    \ distribution governing data can change over time, resulting in the training\
    \ data distribution drifting away from the actual data distribution. It can also\
    \ be difficult to obtain sufficient labeled training data to model the current\
    \ data distribution correctly. This is known as *dataset drift* or *dataset shift*.\
    \ Training models on mismatched data can severely degrade prediction accuracy\
    \ and performance, so bias measurement and mitigation should be integrated into\
    \ your continuous pipeline measurements, in a similar manner that functional testing\
    \ is integrated with each application change.\n\n# Chapter 3. Python Tutorial\n\
    \nThis chapter introduces the basic functionality of AIF 360 to interested developers\
    \ who might not have a background in bias detection and mitigation. It offers\

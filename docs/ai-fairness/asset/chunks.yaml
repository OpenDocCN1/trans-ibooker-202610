    \n978-1-492-07765-7\n\n\\[LSI\\]\n\n# Introduction\n\n# Are Human Decisions Less\
    \ Biased Than Automated Ones?\n\nThis report takes data science leaders and practitioners\
    \ through the key challenges of defining fairness and reducing unfair bias throughout\
    \ the machine learning pipeline. It shows why data science teams need to engage\
    \ early and authoritatively on building trusted artificial intelligence (AI).\
    \ It also explains in plain English how organizations should think about AI fairness,\
    \ as well as the trade-offs between model bias and model accuracy. Much has been\
    \ written on the social injustice of AI bias, but this report focuses on how teams\
    \ can mitigate unfair machine bias by using the open source tools available in\
    \ AI Fairness 360 (AIF360).\n\nDeveloping unbiased algorithms involves many stakeholders\
    \ across a company. After reading this report, you will understand the many factors\
    \ that you need to consider when defining fairness for your use case (such as\
    \ legal compliance, ethics, and trust). You will also learn that there are several\
    \ ways to define fairness, and thus many different ways to measure and reduce\
    \ unfair bias. Although not all bias can be removed, you will learn that organizations\
    \ should define acceptable thresholds for both model accuracy and bias.\n\nIn\
    \ this report, we provide an overview of how AI bias could negatively affect every\
    \ industry as the use of algorithms becomes more prevalent. Next, we discuss how\
    \ to define fairness and the source of bias. Then, we discuss bias in the machine\
    \ learning pipeline and the current bias mitigation toolkits. We then go into\
    \ the AI Fairness 360 toolkit with a focus on how to measure bias and attempt\
    \ to remove it. We conclude with a Python tutorial of a credit-scoring use case\
    \ and provide some guidance on fairness and bias.\n\n# AI Fairness Is Becoming\
    \ Increasingly Critical\n\nAI is increasingly being used in highly sensitive areas\
    \ such as health care, hiring, and criminal justice, so there has been a wider\
    \ focus on the implications of bias and unfairness embedded in it. We know that\
    \ human decision-making in many areas is biased and shaped by our individual or\
    \ societal biases, which are often unconscious. One may assume that using data\
    \ to automate decisions would make everything fair, but we now know that this\
    \ is not the case. AI bias can come in through societal bias embedded in training\
    \ datasets, decisions made during the machine learning development process, and\
    \ complex feedback loops that arise when a machine learning model is deployed\
    \ in the real world.\n\nExtensive evidence has shown that AI can embed human and\
    \ societal biases and deploy them at scale. Many experts are now saying that unwanted\
    \ bias might be the major barrier that prevents AI from reaching its full potential.\
    \ One such case that has received media attention is that of Correctional Offender\
    \ Management Profiling for Alternative Sanctions (COMPAS), an algorithm used to\
    \ predict whether defendants in Broward County, Florida, among other jurisdictions,\
    \ were likely to commit a crime if they were not remanded. A 2016 investigation\
    \ by journalists at ProPublica found that the COMPAS algorithm [incorrectly labeled\
    \ African-American defendants as “high-risk”](https://oreil.ly/Xcl1Q) at nearly\
    \ twice the rate it mislabeled white defendants. This illustrates the significant\
    \ negative impact an AI algorithm can have on society. So how do we ensure that\
    \ automated decisions are less biased than human decision-making?\n\n# Defining\
    \ Fairness\n\nFairness is a complex and multifaceted concept that depends on context\
    \ and culture. Defining it for an organization’s use case can thus be difficult.\
    \ There are at least 21 mathematical definitions of fairness.^([1](#preface01.xhtml#idm46444778659464))\
    \ These are not just theoretical differences in how to measure fairness; different\
    \ definitions focus on different aspects of fairness and thus can produce entirely\
    \ different outcomes. Fairness researchers have shown that it is impossible to\
    \ satisfy different definitions of fairness at the same time.^([2](#preface01.xhtml#idm46444778658776))\
    \ The University of Chicago has created a [decision tree](https://oreil.ly/VJBni)\
    \ that is useful in thinking through how organizations can define fairness.\n\n\
    Many definitions focus either on individual fairness (treating similar individuals\
    \ similarly) or on group fairness (making the model’s predictions/outcomes equitable\
    \ across groups). Individual fairness seeks to ensure that statistical measures\
    \ of outcomes are equal for similar individuals. Group fairness partitions a population\
    \ into groups defined by protected attributes and seeks to ensure that statistical\
    \ measures of outcomes are equal across groups.\n\nWithin those who focus on group\
    \ fairness, there are two opposing worldviews. These can be roughly summarized\
    \ as “We’re All Equal” (WAE) and “What You See is What You Get” (WYSIWYG).^([3](#preface01.xhtml#idm46444778643000))\
    \ The WAE worldview holds that all groups have the same abilities, while the WYSIWYG\
    \ worldview holds that observations reflect the abilities of groups.\n\nFor example,\
    \ let’s consider how universities could define group fairness using SAT scores\
    \ as a feature for predicting success in college. The WYSIWYG worldview would\
    \ say that the score correlates well with future success and can be used to compare\
    \ the abilities of applicants accurately. In contrast, the WAE worldview would\
    \ say that SAT scores may contain structural biases, so its distribution being\
    \ different across groups should not be mistaken for a difference in distribution\
    \ of ability."

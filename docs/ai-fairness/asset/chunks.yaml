    \ import \\\n    OptimPreproc\nfrom aif360.algorithms.preprocessing.optim_preproc_helpers.\
    \ \\\n    data_preproc_functions import load_preproc_data_adult\nfrom aif360.algorithms.preprocessing.optim_preproc_helpers.\
    \ \\\n    distortion_functions import get_distortion_adult\nfrom aif360.algorithms.preprocessing.optim_preproc_helpers.\
    \ \\\n    opt_tools import OptTools\n\nfrom IPython.display import Markdown, display\n\
    In [2]:\nnp.random.seed(1)\n```\n\n```python\ndataset_orig = load_preproc_data_adult(['race'])\
    \ \n\ndataset_orig_train, dataset_orig_test = \\\n    dataset_orig.split([0.7],\
    \ shuffle=True) \n\nprivileged_groups = [{'race': 1}] # White\nunprivileged_groups\
    \ = [{'race': 0}] # Not white\n```\n\n## 步骤 3：在原始训练数据集上计算公平性指标\n\n现在我们已经确定了受保护属性\
    \ `race`，并定义了特权值和非特权值，可以使用 AIF360 来检测数据集中的偏见。一个简单的测试是比较特权群体和非特权群体的有利结果百分比，用后者减去前者。负值表示非特权群体的有利结果较少。这在\
    \ `BinaryLabelDatasetMetric` 类的 `mean_difference()` 方法中实现。下面的代码执行此检查并显示输出：\n\n\
    ```python\nmetric_orig_train = BinaryLabelDatasetMetric(dataset_orig_train, \n\
    \              unprivileged_groups=unprivileged_groups, \n              privileged_groups=privileged_groups)\
    \ \ndisplay(Markdown(\"#### Original training dataset\"))\nprint(\"Difference\
    \ in mean outcomes between unprivileged and \\\n    privileged groups = %f\" %\
    \ \\\n    metric_orig_train.mean_difference())\n```\n\n原始训练数据集  \n非特权群体和特权群体之间平均结果的差异\
    \ = -0.104553\n\n## 步骤 4：通过转换原始数据集来缓解偏见\n\n上一步显示，特权群体在训练数据集中获得的正面结果多出 10.5%。因为这是不可取的，我们将尝试缓解训练数据集中的这种偏见。如前所述，这称为预处理缓解，因为它发生在模型创建之前。\n\
    \n我们选择优化预处理算法[²]，该算法实现于 `aif360.algorithms.preprocessing` 目录下的 `OptimPreproc`\
    \ 类中。该算法转换数据集，使特权群体和非特权群体在受保护属性上的正面结果更加公平。\n\n该算法需要一些调优参数，这些参数在 `optim_options`\
    \ 变量中设置，并连同其他参数（包括步骤 3 中定义的包含非特权群体和特权群体的两个变量）作为参数传递。\n\n然后我们调用 `fit()` 和 `transform()`\
    \ 方法来执行转换，生成一个新的转换后训练数据集 (`dataset_transf_train`)。最后，我们确保转换后数据集与原始数据集之间的特征对齐，以便进行比较：\n\
    \n```python\noptim_options = {\n    \"distortion_fun\": get_distortion_adult,\
    \ \n    \"epsilon\": 0.05, \n    \"clist\": [0.99, 1.99, 2.99], \n    \"dlist\"\
    : [.1, 0.05, 0] \n}\nOP = OptimPreproc(OptTools, optim_options) \n \nOP = OP.fit(dataset_orig_train)\
    \ \ndataset_transf_train = OP.transform(dataset_orig_train, \\\n    transform_Y=True)\
    \ \n\ndataset_transf_train = dataset_orig_train.align_datasets( \\\n    dataset_transf_train)\n\
    ```\n\n优化预处理：目标收敛至 0.000000\n\n## 步骤 5：在转换后的数据集上计算公平性指标\n\n现在我们有了转换后的数据集，可以通过使用步骤\
    \ 3 中用于原始训练数据集的相同指标，来检查我们消除偏见的努力有多有效。同样，我们使用 `BinaryLabelDatasetMetric` 类中的 `mean_difference()`\
    \ 函数：\n\n```python\nmetric_transf_train = BinaryLabelDatasetMetric( \\\n    dataset_transf_train,\
    \ unprivileged_groups= \\\n    unprivileged_groups, privileged_groups=privileged_groups)\
    \ \ndisplay(Markdown(\"#### Transformed training dataset\"))\nprint(\"Difference\
    \ in mean outcomes between unprivileged and \\\n    privileged groups = %f\" %\
    \ metric_transf_train. \\\n    mean_difference())\n```\n\n转换后的训练数据集  \n非特权群体和特权群体之间平均结果的差异\
    \ = -0.051074\n\n我们看到缓解步骤非常有效：平均结果的差异现在是 –0.051074。因此，特权群体的优势从 10.5% 降至 5.1%——减少了一半多！\n\
    \n一个更完整的用例将采取下一步，查看转换后的数据集如何影响训练模型的准确性和公平性。这在 AIF360 工具包 examples 目录下的演示笔记本 `demo_reweighing_preproc.ipynb`\
    \ 中实现。\n\n[¹]: 此演示与[信用评分教程](https://oreil.ly/H_-eJ)非常相似。它旨在作为一个替代介绍，使用不同的数据集和缓解算法。\
    \  \n[²]: F. Calmon 等人，“用于防止歧视的优化预处理”，载于《神经信息处理系统进展》，2017 年。\n\n# 第 4 章：结论\n\n\
    ## AI 公平性的未来\n\n对机器学习缺乏信任可能是阻碍 AI 发挥全部潜力的单一最大因素。为了建立这种信任，数据科学家必须考虑超越预测准确性的措施。缓解偏见、确保公平，以及提供鲁棒性和透明度，对于开创一个机器学习系统成为人类可信赖伙伴的世界至关重要。\n\
    \n对于给定的应用领域，公平性很难定义，也不是数据科学家应该独自解决的问题。在进行任何建模之前，纳入多方利益相关者和视角至关重要。在就 AI 系统的期望价值观和目标达成一定程度的共识后，可以利用\
    \ AIF 360 提供的工具来检测、理解和缓解不必要的偏见。这些工具仅解决整体公平性问题的一小部分，应与程序性和组织性措施结合使用。\n\n## 关于作者\n\
    \n**Trisha Mahoney** 是 IBM 的 AI 技术布道师，专注于公平性和偏见。Trisha 过去 10 年在旧金山湾区的多家科技公司（包括\
    \ Salesforce、IBM 和 Cisco）从事人工智能和云解决方案工作。在此之前，Trisha 在化学检测领域担任数据科学家长达八年。她拥有电气工程学位和技术管理\
    \ MBA 学位。\n\n"

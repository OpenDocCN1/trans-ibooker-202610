- raw: "^([1](#preface01.xhtml#idm46444778659464-marker)) Arvind Narayanan, “21 Fairness\
    \ Definitions and Their Politics,” tutorial at Conference on Fairness, Accountability,\
    \ and Transparency, February 2018. [*https://oreil.ly/MhDrk*](https://oreil.ly/MhDrk).\n\
    \n^([2](#preface01.xhtml#idm46444778658776-marker)) J. Kleinberg et al., “Inherent\
    \ Tradeoffs in the Fair Determination of Risk Scores,” in *Proceedings of the\
    \ 8th Innovations in Theoretical Computer Science Conference*, January 2017, 43.1–43.23.\n\
    \n^([3](#preface01.xhtml#idm46444778643000-marker)) S. A. Friedler et al., “On\
    \ the (Im)possibility of Fairness,” September 2016, *arXiv:1609.07236*. [*https://oreil.ly/ps4so*](https://oreil.ly/ps4so).\n\
    \n# Chapter 1. Understanding and Measuring Bias with AIF 360\n\nBias can occur\
    \ at any stage in the machine learning pipeline ([Figure 1-1](#ch01.xhtml#fig_1_bias_in_the_machine_learning_pipeline)),\
    \ and fairness metrics and bias mitigation algorithms can be performed at various\
    \ stages within the pipeline. We recommend checking for bias as often as possible,\
    \ using as many metrics as are relevant to your application. We also recommend\
    \ integrating continuous bias detection into your automated pipeline. AIF360 is\
    \ compatible with the end-to-end machine learning workflow and is designed to\
    \ be easy to use and extensible. Practitioners can go from raw data to a fair\
    \ model easily while comprehending the intermediate results, and researchers can\
    \ contribute new functionality with minimal effort.\n\nIn this chapter, we look\
    \ at current tools and terminology and then begin looking at how AIF360’s metrics\
    \ work.\n\n![](Images/aifa_0101.png)\n\n# Tools and Terminology\n\nSeveral open\
    \ source libraries have been developed in recent years to contribute to building\
    \ fairer AI models. Most address only bias detection, not mitigating bias. Just\
    \ a handful of toolkits (like Themis-ML and Fairness Comparison) address both,\
    \ but they are often limited for commercial use due to their usability and license\
    \ restrictions. IBM fairness researchers took on the initiative to unify these\
    \ efforts, as shown in [Table 1-1](#ch01.xhtml#other_open_source_libraries_on_bias_and_fairness),\
    \ and bring together a comprehensive set of bias metrics, bias mitigation algorithms,\
    \ bias metric explanations, and industrial usability in one open source toolkit\
    \ with AIF360.\n\n Table 1-1. Other open source libraries on bias and fairness\
    \ \n\n| Open source library  || Advantages/disadvantages |\n\n| --- | --- |\n\n\
    | Fairness Measures || Provides several fairness metrics, including difference\
    \ of means, disparate impact, and odds ratio. It also provides datasets, but some\
    \ are not in the public domain and require explicit permission from the owners\
    \ to access or use the data. |\n\n| --- | --- |\n\n| FairML || Provides an auditing\
    \ tool for predictive models by quantifying the relative effects of various inputs\
    \ on a model’s predictions, which can be used to assess the model’s fairness.\
    \ |\n\n| FairTest || Checks for associations between predicted labels and protected\
    \ attributes. The methodology also provides a way to identify regions of the input\
    \ space where an algorithm might incur unusually high errors. This toolkit also\
    \ includes a rich catalog of datasets. |\n\n| Aequitas || This is an auditing\
    \ toolkit for data scientists as well as policy makers; it has a Python library\
    \ and website where data can be uploaded for bias analysis. It offers several\
    \ fairness metrics, including demographic, statistical parity, and disparate impact,\
    \ along with a “fairness tree” to help users identify the correct metric to use\
    \ for their particular situation. Aequitas’s license does not allow commercial\
    \ use. |\n\n| Themis || An open source bias toolbox that automatically generates\
    \ test suites to measure discrimination in decisions made by a predictive system.\
    \ |\n\n| Themis-ML || Provides fairness metrics, such as mean difference, some\
    \ bias mitigation algorithms,^([a](#ch01.xhtml#idm46444778596184)) additive counterfactually\
    \ fair estimator,^([b](#ch01.xhtml#idm46444778595512)) and reject option classification.^([c](#ch01.xhtml#idm46444778600744))\
    \ The repository contains a subset of the methods described in this book. |\n\n\
    | Fairness Comparison || Includes several bias detection metrics as well as bias\
    \ mitigation methods, including disparate impact remover,^([d](#ch01.xhtml#idm46444778591576))\
    \ prejudice remover,^([e](#ch01.xhtml#idm46444778585240)) and two-Naive Bayes.^([f](#ch01.xhtml#idm46444778583464))\
    \ Written primarily as a test bed to allow different bias metrics and algorithms\
    \ to be compared in a consistent way, it also allows additional algorithms and\
    \ datasets. |\n\n| ^([a](#ch01.xhtml#idm46444778596184-marker)) F. Kamiran and\
    \ T. Calders, “Data preprocessing techniques for classification without discrimination,”\
    \ in *Knowledge and Information Systems* 33, no. 1, 2012, 1–33.^([b](#ch01.xhtml#idm46444778595512-marker))\
    \ M. J. Kusner et al., “Counterfactual Fairness,” in *Advances in Neural Information\
    \ Processing Systems*, 2017, 4,069–4,079.^([c](#ch01.xhtml#idm46444778600744-marker))\
    \ F. Kamiran et al., “Decision Theory for Discrimination-Aware Classification,”\
    \ in *Proceedings of IEEE International Conference on Data Mining*, 2012, 924–929.^([d](#ch01.xhtml#idm46444778591576-marker))\
    \ M. Feldman et al., “Certifying and Removing Disparate Impact,” in *Proceedings\
    \ of the ACM SIGKDD International Conference on Knowledge Discovery and Data Mining*,\
    \ August 2015, 259–268.^([e](#ch01.xhtml#idm46444778585240-marker)) T. Kamishima\
    \ et al., “Fairness-Aware Classifier with Prejudice Remover Regularizer,” in *Machine\
    \ Learning and Knowledge Discovery in Databases*, 2012, 35–50.^([f](#ch01.xhtml#idm46444778583464-marker))\
    \ T. Calders and S. Verwer, “Three Naive Bayes Approaches for Discrimination-Free\
    \ Classification,” in *Data Mining and Knowledge Discovery* 21, 2010, 77–292.\
    \ |\n\n| --- |\n\nAIF360 is an extensible, open source toolkit for measuring,\
    \ understanding, and reducing AI bias. It combines the top bias metrics, bias\
    \ mitigation algorithms, and metric explainers from fairness researchers across\
    \ industry and academia. The goals of the AIF360 toolkit are as follows:\n\n*\
    \   To promote a deeper understanding of fairness metrics and mitigation techniques\n\
    \n*   To enable an open common platform for fairness researchers and industry\
    \ practitioners to share and benchmark their algorithms\n\n*   To help facilitate\
    \ the transition of fairness research algorithms for use in an industrial setting\n\
    \nAIF360 currently includes Python packages that implement techniques from eight\
    \ published papers across the greater AI fairness research community. There are\
    \ currently 77 bias detection metrics and 10 bias mitigation algorithms that can\
    \ be called in a standard way similar to scikit-learn’s fit/transform/predict\
    \ paradigm. The toolkit is open source and contains documentation, demonstrations,\
    \ and other artifacts.\n\n## Terminology\n\nTo use the AIF360 toolkit effectively,\
    \ it helps to be familiar with the relevant fairness terminology. Here are a few\
    \ of the specialized machine learning terms to know:\n\nFavorable label\n\n: \n\
    \nA label whose value corresponds to an outcome that provides an advantage to\
    \ the recipient (such as receiving a loan, being hired for a job, not being arrested)\n\
    \nProtected attribute\n\n: \n\nAn attribute that partitions a population into\
    \ groups whose outcomes should have parity (such as race, gender, caste, and religion)\n\
    \nPrivileged value (of a protected attribute)\n\n: \n\nA protected attribute value\
    \ indicating a group that has historically been at a systemic advantage\n\nFairness\
    \ metric\n\n: \n\nA quantification of unwanted bias in training data or models\n\
    \nDiscrimination/unwanted bias\n\n: "
  fmt: "\n## References\n\n^([1](#preface01.xhtml#idm46444778659464-marker)) Arvind\
    \ Narayanan, “21 Fairness Definitions and Their Politics,” tutorial at Conference\
    \ on Fairness, Accountability, and Transparency, February 2018. [*https://oreil.ly/MhDrk*](https://oreil.ly/MhDrk).\n\
    \n^([2](#preface01.xhtml#idm46444778658776-marker)) J. Kleinberg et al., “Inherent\
    \ Tradeoffs in the Fair Determination of Risk Scores,” in *Proceedings of the\
    \ 8th Innovations in Theoretical Computer Science Conference*, January 2017, 43.1–43.23.\n\
    \n^([3](#preface01.xhtml#idm46444778643000-marker)) S. A. Friedler et al., “On\
    \ the (Im)possibility of Fairness,” September 2016, *arXiv:1609.07236*. [*https://oreil.ly/ps4so*](https://oreil.ly/ps4so).\n\
    \n# Chapter 1. Understanding and Measuring Bias with `AIF360`\n\nBias can occur\
    \ at any stage in the machine learning pipeline ([Figure 1-1](#ch01.xhtml#fig_1_bias_in_the_machine_learning_pipeline)),\
    \ and fairness metrics and bias mitigation algorithms can be performed at various\
    \ stages within the pipeline. We recommend checking for bias as often as possible,\
    \ using as many metrics as are relevant to your application. We also recommend\
    \ integrating continuous bias detection into your automated pipeline. `AIF360`\
    \ is compatible with the end-to-end machine learning workflow and is designed\
    \ to be easy to use and extensible. Practitioners can go from raw data to a fair\
    \ model easily while comprehending the intermediate results, and researchers can\
    \ contribute new functionality with minimal effort.\n\nIn this chapter, we look\
    \ at current tools and terminology and then begin looking at how `AIF360`’s metrics\
    \ work.\n\n![](Images/aifa_0101.png)\n\n## Tools and Terminology\n\nSeveral open\
    \ source libraries have been developed in recent years to contribute to building\
    \ fairer AI models. Most address only bias detection, not mitigating bias. Just\
    \ a handful of toolkits (like `Themis-ML` and `Fairness Comparison`) address both,\
    \ but they are often limited for commercial use due to their usability and license\
    \ restrictions. IBM fairness researchers took on the initiative to unify these\
    \ efforts, as shown in [Table 1-1](#ch01.xhtml#other_open_source_libraries_on_bias_and_fairness),\
    \ and bring together a comprehensive set of bias metrics, bias mitigation algorithms,\
    \ bias metric explanations, and industrial usability in one open source toolkit\
    \ with `AIF360`.\n\n### Table 1-1. Other open source libraries on bias and fairness\n\
    \n| Open source library | Advantages/disadvantages |\n| --- | --- |\n| `Fairness\
    \ Measures` | Provides several fairness metrics, including difference of means,\
    \ disparate impact, and odds ratio. It also provides datasets, but some are not\
    \ in the public domain and require explicit permission from the owners to access\
    \ or use the data. |\n| `FairML` | Provides an auditing tool for predictive models\
    \ by quantifying the relative effects of various inputs on a model’s predictions,\
    \ which can be used to assess the model’s fairness. |\n| `FairTest` | Checks for\
    \ associations between predicted labels and protected attributes. The methodology\
    \ also provides a way to identify regions of the input space where an algorithm\
    \ might incur unusually high errors. This toolkit also includes a rich catalog\
    \ of datasets. |\n| `Aequitas` | This is an auditing toolkit for data scientists\
    \ as well as policy makers; it has a `Python` library and website where data can\
    \ be uploaded for bias analysis. It offers several fairness metrics, including\
    \ demographic, statistical parity, and disparate impact, along with a “fairness\
    \ tree” to help users identify the correct metric to use for their particular\
    \ situation. `Aequitas`’s license does not allow commercial use. |\n| `Themis`\
    \ | An open source bias toolbox that automatically generates test suites to measure\
    \ discrimination in decisions made by a predictive system. |\n| `Themis-ML` |\
    \ Provides fairness metrics, such as mean difference, some bias mitigation algorithms,^([a](#ch01.xhtml#idm46444778596184))\
    \ additive counterfactually fair estimator,^([b](#ch01.xhtml#idm46444778595512))\
    \ and reject option classification.^([c](#ch01.xhtml#idm46444778600744)) The repository\
    \ contains a subset of the methods described in this book. |\n| `Fairness Comparison`\
    \ | Includes several bias detection metrics as well as bias mitigation methods,\
    \ including disparate impact remover,^([d](#ch01.xhtml#idm46444778591576)) prejudice\
    \ remover,^([e](#ch01.xhtml#idm46444778585240)) and two-Naive Bayes.^([f](#ch01.xhtml#idm46444778583464))\
    \ Written primarily as a test bed to allow different bias metrics and algorithms\
    \ to be compared in a consistent way, it also allows additional algorithms and\
    \ datasets. |\n\n^([a](#ch01.xhtml#idm46444778596184-marker)) F. Kamiran and T.\
    \ Calders, “Data preprocessing techniques for classification without discrimination,”\
    \ in *Knowledge and Information Systems* 33, no. 1, 2012, 1–33.  \n^([b](#ch01.xhtml#idm46444778595512-marker))\
    \ M. J. Kusner et al., “Counterfactual Fairness,” in *Advances in Neural Information\
    \ Processing Systems*, 2017, 4,069–4,079.  \n^([c](#ch01.xhtml#idm46444778600744-marker))\
    \ F. Kamiran et al., “Decision Theory for Discrimination-Aware Classification,”\
    \ in *Proceedings of IEEE International Conference on Data Mining*, 2012, 924–929.\
    \  \n^([d](#ch01.xhtml#idm46444778591576-marker)) M. Feldman et al., “Certifying\
    \ and Removing Disparate Impact,” in *Proceedings of the ACM SIGKDD International\
    \ Conference on Knowledge Discovery and Data Mining*, August 2015, 259–268.  \n\
    ^([e](#ch01.xhtml#idm46444778585240-marker)) T. Kamishima et al., “Fairness-Aware\
    \ Classifier with Prejudice Remover Regularizer,” in *Machine Learning and Knowledge\
    \ Discovery in Databases*, 2012, 35–50.  \n^([f](#ch01.xhtml#idm46444778583464-marker))\
    \ T. Calders and S. Verwer, “Three Naive Bayes Approaches for Discrimination-Free\
    \ Classification,” in *Data Mining and Knowledge Discovery* 21, 2010, 77–292.\n\
    \n`AIF360` is an extensible, open source toolkit for measuring, understanding,\
    \ and reducing AI bias. It combines the top bias metrics, bias mitigation algorithms,\
    \ and metric explainers from fairness researchers across industry and academia.\
    \ The goals of the `AIF360` toolkit are as follows:\n\n*   To promote a deeper\
    \ understanding of fairness metrics and mitigation techniques\n*   To enable an\
    \ open common platform for fairness researchers and industry practitioners to\
    \ share and benchmark their algorithms\n*   To help facilitate the transition\
    \ of fairness research algorithms for use in an industrial setting\n\n`AIF360`\
    \ currently includes `Python` packages that implement techniques from eight published\
    \ papers across the greater AI fairness research community. There are currently\
    \ 77 bias detection metrics and 10 bias mitigation algorithms that can be called\
    \ in a standard way similar to `scikit-learn`’s `fit`/`transform`/`predict` paradigm.\
    \ The toolkit is open source and contains documentation, demonstrations, and other\
    \ artifacts.\n\n## Terminology\n\nTo use the `AIF360` toolkit effectively, it\
    \ helps to be familiar with the relevant fairness terminology. Here are a few\
    \ of the specialized machine learning terms to know:\n\n**Favorable label**  \n\
    : A label whose value corresponds to an outcome that provides an advantage to\
    \ the recipient (such as receiving a loan, being hired for a job, not being arrested)\n\
    \n**Protected attribute**  \n: An attribute that partitions a population into\
    \ groups whose outcomes should have parity (such as race, gender, caste, and religion)\n\
    \n**Privileged value (of a protected attribute)**  \n: A protected attribute value\
    \ indicating a group that has historically been at a systemic advantage\n\n**Fairness\
    \ metric**  \n: A quantification of unwanted bias in training data or models\n\
    \n**Discrimination/unwanted bias**  \n:\n"
  trans: "\n\n## 参考文献\n\n^(1) Arvind Narayanan，“21 个公平性定义及其政治含义”，公平性、问责制与透明度大会教程，2018\
    \ 年 2 月。[*https://oreil.ly/MhDrk*](https://oreil.ly/MhDrk)。\n\n^(2) J. Kleinberg\
    \ 等，“风险评分公平确定中的固有权衡”，载于*第 8 届理论计算机科学创新会议论文集*，2017 年 1 月，43.1–43.23。\n\n^(3) S.\
    \ A. Friedler 等，“论公平性的（不）可能性”，2016 年 9 月，*arXiv:1609.07236*。[*https://oreil.ly/ps4so*](https://oreil.ly/ps4so)。\n\
    \n# 第 1 章 使用 `AIF360` 理解和度量偏见\n\n偏见可能发生在机器学习流水线的任何阶段（图 1-1），公平性指标和偏见缓解算法可在流水线的各个阶段执行。我们建议尽可能频繁地检查偏见，使用与您的应用相关的尽可能多的指标。我们还建议将持续偏见检测集成到您的自动化流水线中。`AIF360`\
    \ 兼容端到端的机器学习工作流，设计为易于使用和扩展。实践者可以轻松地从原始数据得到一个公平的模型，同时理解中间结果，研究人员可以以最小的工作量贡献新功能。\n\
    \n在本章中，我们将了解当前的工具和术语，然后开始探讨 `AIF360` 的指标如何工作。\n\n![](img/aifa_0101.png)\n\n##\
    \ 工具和术语\n\n近年来，开发了多个开源库以助力构建更公平的 AI 模型。大多数仅解决偏见检测，而不解决偏见缓解。只有少数工具包（如 `Themis-ML`\
    \ 和 `Fairness Comparison`）两者兼顾，但由于其易用性和许可证限制，往往限于商业用途。IBM 公平性研究人员主动统一这些工作，如表 1-1\
    \ 所示，将一套全面的偏见指标、偏见缓解算法、偏见指标解释和工业易用性汇集在一个开源工具包 `AIF360` 中。\n\n### 表 1-1. 偏见与公平性方面的其他开源库\n\
    \n| 开源库 | 优缺点 |\n| --- | --- |\n| `Fairness Measures` | 提供多种公平性指标，包括均值差异、不同影响和比值比。它还提供数据集，但部分数据集不在公共领域，访问或使用数据需要获得所有者的明确许可。\
    \ |\n| `FairML` | 通过量化各种输入对模型预测的相对影响，为预测模型提供审计工具，可用于评估模型的公平性。 |\n| `FairTest`\
    \ | 检查预测标签与受保护属性之间的关联。该方法还提供了一种识别输入空间区域的方法，算法在这些区域可能会产生异常高的错误。该工具包还包含丰富的数据集目录。\
    \ |\n| `Aequitas` | 这是一个面向数据科学家和政策制定者的审计工具包；它拥有 `Python` 库和网站，可上传数据进行偏见分析。它提供多种公平性指标，包括人口统计学平等、统计平价和不同影响，以及一个“公平性树”帮助用户确定其特定情况下应使用的正确指标。`Aequitas`\
    \ 的许可证不允许商业用途。 |\n| `Themis` | 一个开源偏见工具箱，可自动生成测试套件以衡量预测系统决策中的歧视。 |\n| `Themis-ML`\
    \ | 提供公平性指标，如均值差异、一些偏见缓解算法，^(a) 累加反事实公平估计器，^(b) 和拒绝选项分类。^(c) 该代码库包含本书所述方法的一个子集。\
    \ |\n| `Fairness Comparison` | 包含多种偏见检测指标以及偏见缓解方法，包括不同影响移除器，^(d) 偏见移除器，^(e) 和双朴素贝叶斯。^(f)\
    \ 主要作为一个测试平台编写，允许以一致的方式比较不同的偏见指标和算法，也允许添加额外的算法和数据集。 |\n\n^(a) F. Kamiran 和 T.\
    \ Calders，“无歧视分类的数据预处理技术”，载于*知识与信息系统* 33 卷，第 1 期，2012 年，1–33 页。  \n^(b) M. J.\
    \ Kusner 等，“反事实公平性”，载于*神经信息处理系统进展*，2017 年，4,069–4,079 页。  \n^(c) F. Kamiran 等，“歧视感知分类的决策理论”，载于*IEEE\
    \ 国际数据挖掘会议论文集*，2012 年，924–929 页。  \n^(d) M. Feldman 等，“认证与移除不同影响”，载于*ACM SIGKDD\
    \ 国际知识发现与数据挖掘会议论文集*，2015 年 8 月，259–268 页。  \n^(e) T. Kamishima 等，“带有偏见移除正则化项的公平性感知分类器”，载于*机器学习与数据库知识发现*，2012\
    \ 年，35–50 页。  \n^(f) T. Calders 和 S. Verwer，“用于无歧视分类的三种朴素贝叶斯方法”，载于*数据挖掘与知识发现*\
    \ 21 卷，2010 年，77–292 页。\n\n`AIF360` 是一个可扩展的开源工具包，用于度量、理解和减少 AI 偏见。它汇集了来自工业界和学术界公平性研究人员的顶级偏见指标、偏见缓解算法和指标解释器。`AIF360`\
    \ 工具包的目标如下：\n\n*   促进对公平性指标和缓解技术的更深入理解\n*   为公平性研究人员和行业实践者提供一个开放的通用平台，以共享和基准测试他们的算法\n\
    *   帮助推动公平性研究算法向工业应用的转变\n\n`AIF360` 目前包含实现了整个 AI 公平性研究社区八篇已发表论文技术的 `Python` 包。目前有\
    \ 77 个偏见检测指标和 10 个偏见缓解算法，可以按照类似 `scikit-learn` 的 `fit`/`transform`/`predict` 范式的标准方式调用。该工具包是开源的，包含文档、演示和其他工件。\n\
    \n## 术语\n\n为了有效使用 `AIF360` 工具包，熟悉相关的公平性术语会有所帮助。以下是一些需要了解的专业机器学习术语：\n\n**有利标签**\
    \  \n: 其值对应于为接收者提供优势的结果的标签（如获得贷款、被录用、不被逮捕）\n\n**受保护属性**  \n: 将人口划分为结果应当平等的群体的属性（如种族、性别、种姓和宗教）\n\
    \n**特权值（受保护属性的）**  \n: 表示历史上处于系统性优势地位的群体的受保护属性值\n\n**公平性指标**  \n: 训练数据或模型中不想要的偏见的量化\n\
    \n**歧视/不想要的偏见**  \n:\n\n"

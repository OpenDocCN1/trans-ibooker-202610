    \ notebooks.^([1](#ch03.xhtml#idm46444778400680))\n\nAs these examples illustrate,\
    \ a bias detection and/or mitigation toolkit needs to be tailored to the particular\
    \ bias of interest. More specifically, it needs to know the attributes, called\
    \ *protected attributes*, that are of interest: race is one example of a protected\
    \ attribute; age is a second.\n\nWe will use the Adult Census Income dataset,\
    \ splitting it into training and test datasets. We will look for bias in the creation\
    \ of our machine learning model, which is intended to help decide whether an individual’s\
    \ annual income should be set greater than $50,000, based on various personal\
    \ attributes. The protected attribute will be race, with “1” (white) and “0” (not\

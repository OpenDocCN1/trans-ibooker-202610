  md: '“No. I just heard them yell, ‘She’s hit!’”

    The manager noticed the Muskrats and shouted, “Hey, you kids, get out of here!”

    The cousins just smiled and stayed on their side of the road. Mr. Makowski pushed
    the rolled sleeves of his shirt farther up his forearm, debating whether to come
    over. But he forgot about the Muskrats when the fittest of the security guards
    returned with one of the protestors.

    The twenty-something guard held up a chain. “He was trying to lock himself to
    the big gas tank with this.”

    “What the heck were you trying to do!” The veins stuck out on the manager’s neck.
    He pulled the thin activist closer as he spat the words.

    “Stop you from killing our land!” The protestor pushed against the big man’s arms
    but couldn’t free himself.

    “Oh, you freakin’ idiots! It’s the twenty-first century!” Makowski’s rant was
    interrupted by police sirens approaching down the road.

    “Now we’ll see if these Indian cops will arrest their own.”

    More guards brought their captors back to the gate. The manager studied each activist.

    “How many were there?” His eyes bored into the senior guard.

    “We don’t know, sir. Nobody thought to count as they ran in.”

    “Is this all all of them?”'

  md: '# THE CASE OF WINDY LAKE


    Uncle Levi was unruffled in the face of the manager’s storm.


    “Who is your supervisor?”


    Uncle Levi smiled at the implied threat.


    “Hell no, I won’t go!” Denice’s voice was growing hoarse.


    Her uncle continued to ignore her.


    “She’s only tied to one post. There’s plenty of room to get around her.” He pointed
    at the circle made by the boxes. He noticed the Muskrats peering over the edge
    of one but said nothing.


    “I’m going to have your job!” Makowski jabbed his finger in the air.


    Uncle Levi hitched up his belt and chuckled. “She hasn’t really blocked you at
    all has she?”


    “Without water we die!” Denice screamed.


    The Muskrats burst into giggles at their cousin’s protest.


    “Look…” Makowski bellowed.


    “NO!” With all the cursing the manager had done, this was the first time the police
    officer had spoken sharply to him.


    The men’s eyes met.


    “You look…” Uncle Levi’s voice was serious and steady. He pointed again at the
    circle of boxes around Denice.


    The manager took a deep breath and assessed the situation. “I suppose not.”'

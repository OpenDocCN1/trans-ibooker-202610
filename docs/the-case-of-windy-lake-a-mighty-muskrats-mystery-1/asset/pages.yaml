  md: '# CHAPTER 3


    # Protest Hug of Steel


    The security guards threw their hands in the air and watched the scramble of activists.
    But when the office door slammed open, they began to run toward the nearest trespasser.
    The mine manager, Mr. Makowski, roared, “Who the hell let those…morons into the
    compound! Don’t just look at me, you idiots! Get them before they sabotage something!”


    His messy hair looked like gray flames above the burning crimson of his face as
    he marched toward the gate.


    The truck driver hopped out of the truck. “They tricked me!”


    “What?”


    “The protestors.” They pretended someone got run over. When your men went to check
    it out, they broke and ran.”


    “Did you see who pretended to get hit?”'

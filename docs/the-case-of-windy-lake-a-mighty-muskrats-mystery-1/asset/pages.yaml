  md: '# CHAPTER 2


    # A Community in Conflict


    Through the trees, a horn blast from a large truck was met with shouts and curses.
    The kids bounded off their shortcut and back onto the road. Rounding the corner,
    they saw a large dump truck trying to exit the mining company compound. It was
    slowly nudging its way through a small crowd of people. Protestors pounded on
    the truck with homemade signs. Others pushed ineffectively against its relentless
    bumper. The owner of the scream was now leading the mini-mob in a chant.


    “What do we want!” The megaphone barked the words of their older cousin, Denice.
    Her long, dark hair hung over a camouflage jacket.


    “Consultation!” the protestors shouted back.


    “What’s it gotta be?” Denice tapped the shoulder of a man pushing against the
    front of the truck. He stood up and hoisted his sign.'

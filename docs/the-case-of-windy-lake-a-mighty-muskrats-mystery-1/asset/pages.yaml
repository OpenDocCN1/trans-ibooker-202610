  md: '# THE CASE OF WINDY LAKE


    Behind the long warehouse was a wide pier with two docks that stretched out into
    the lake. The cranes worked steadily. The area was littered with steel boxes of
    various shapes and sizes. Posts dotted the edge of the pier for the barges and
    boats to tie to. One of the company men stood with his hands on his hips glaring
    down at something hidden behind a set of stacked crates.


    Mr. Makowski cursed loudly when he saw what it was. When Uncle Levi caught up,
    he took off his hat, wiped his brow, then shook his head.


    Unseen, the Muskrats slipped behind a pile of boxes. They jostled for position
    before they slowly peeked over the edge.


    The first things they saw were the mine manager swearing, their uncle staring
    out over the water, and the company employee trying to hide his smile behind his
    hand.


    Farther down, their activist cousin sat with her arms and legs wrapped around
    one of the thick mooring posts. Denice looked as quiet and serene as the calm
    water beside her. Her grasp around the post was reinforced by metal; her hands,
    past her wrists, were slipped into either end of a steel tube, securing her firmly
    in place. The Muskrats looked at each other and giggled. After her own laughter
    subsided, Chickadee shushed the others. “Let’s listen!”


    Once again, the kids watched from behind the crate. The security guards had stopped
    looking for them and gravitated to their manager.'

  md: '# ABOUT THE AUTHOR


    MICHAEL HUTCHINSON is a citizen of the Misipawistik Cree Nation in the Treaty
    5 territory. As a teen, he pulled nets on Lake Winnipeg, fought forest fires in
    the Canadian Shield, and worked at the Whiteshell Nuclear Research Station’s Underground
    Research Lab. As a young adult, he worked as a bartender, a caterer for rock concerts
    and movie shoots, and, eventually, as a print reporter for publications such as
    The Calgary Straight and Aboriginal Times. After being headhunted by the Indian
    Claims Commission, Michael moved from journalism to the communications side of
    the desk and worked for the ICC in Ottawa as a writer. He returned to his home
    province to start a family. Since then, he has worked as the Director of Communications
    for the Assembly of Manitoba Chiefs, a project manager for the Treaty Relations
    Commission of Manitoba, where he helped create the “We are all treaty'
  merge: -1
  img_proc: true
- pgno: 155
  md: people” campaign, and as a communications officer for the Assembly of First
    Nations. Over seven years ago, he jumped at the chance to make mini-documentaries
    for the first season of *APTN Investigates*. Michael then became host of *APTN
    National News* and produced APTN’s sit-down interview show, *Face to Face*, and
    APTN’s version of *Politically Incorrect*, *The Laughing Drum*. Michael was recently
    in charge of communications for the Manitoba Keewatinowi Okimakanak, an advocacy
    organization for First Nations in northern Manitoba. He is currently the Press
    Secretary for the National Chief of the Assembly of First Nations, an advocacy
    organization for First Nations across Canada. His greatest accomplishments are
    his two lovely daughters.

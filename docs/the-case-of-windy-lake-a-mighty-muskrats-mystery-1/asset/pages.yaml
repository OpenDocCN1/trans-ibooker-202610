- pgno: 15
  md: 'The trunk of an overturned car sat in front of the bus, which prevented anyone
    from seeing in or out.


    Atim went to a discarded set of weights closely gathered around an incline bench
    that was screwed together from mismatched pieces. Otter quietly picked up a battered
    guitar leaning against the wall and pulled out one of the dining chairs. His fingers
    began to play over the strings.


    “Here he is,” Chickadee spoke. “Degree in anthropology and archeology from Victoria
    University.... Dr. Pixton has written Oral History: Smoke or Mirror? and Canada
    Had a Spirit and Intent Too! Treaty-making in the Late 1800s. He was the head
    of the Native Studies Department at the University of Alberta.”


    “Sounds like he’s anti-Indian.” Sam shook his head. “An archeologist who doesn’t
    like the cultures he’s studying.”


    “Doesn’t seem that weird when you consider he’s hired by the mining company.”
    Atim curled a barbell.


    “Maybe that’s where we should start…at the company office.” Chickadee swiveled
    her chair until she was facing the boys. They nodded in agreement.


    “Sounds good.” Samuel snapped his book shut.


    Otter stopped playing guitar and they got ready to leave the fort. Once they were
    back in the Bombardier snow-van, they surveyed the land outside its rounded windows.'

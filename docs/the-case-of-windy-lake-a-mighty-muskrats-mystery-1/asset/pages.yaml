  md: '# Internet of Things (IoT)


    The term IoT, or Internet of Things, refers to the collective network of interconnected
    devices and the technology that facilitates communication between devices and
    the cloud, as well as between the devices themselves. Thanks to the advent of
    inexpensive computer chips and high bandwidth telecommunication, we now have billions
    of devices connected to the internet. This means everyday devices like toothbrushes,
    vacuums, cars, and machines can use sensors to collect data and respond intelligently
    to their users.


    The IoT has evolved from the convergence of wireless technologies, microelectromechanical
    systems (MEMSes), microservices, and the internet. This convergence helped tear
    down the silos that existed between operational technology (OT) and information
    technology (IT), enabling machine-generated, unstructured data to be analyzed
    for insights to drive improvements.


    Although the concept of IoT has been around since the 1990s, it has only truly
    become practical. Both consumers and businesses are leveraging IoT to improve
    everything from health care to supply chain management.


    Although the term is similar to the IoT, IIoT is the Internet of Things as it
    applies to the industrial sector. The IIoT uses smart sensors and actuators to
    enhance manufacturing and industrial processes. Also known as the industrial internet
    or the Industrial Internet of Things (IIoT), it uses the power of the smart machines
    and real-time analytics to take advantage of the data that "dumb machines" have
    produced in machine logs on factory floors for years.


    The driving philosophy behind the IoT is to make the surrounding elements—parts
    of the environment that are relevant to the user, their role, machine, or task—actionable
    to create a common operating picture (COP) that enables an unprecedented ability
    to make decisions.


    # An IoT ecosystem


    An IoT ecosystem consists of web-enabled smart devices that use embedded systems,
    such as processors, sensors, and communication hardware to collect, send, and
    act on the data they acquire from their environments. IoT devices share the sensor
    data they collect by connecting to an IoT gateway or other edge device where data
    is either sent to the cloud to be analyzed or analyzed locally. Sometimes, these
    devices communicate with other related devices and act on the information they
    get from one another. The devices do most of the work without human intervention,
    although people can interact with the devices—for instance, to set them up, give
    them instructions, or access the data.'

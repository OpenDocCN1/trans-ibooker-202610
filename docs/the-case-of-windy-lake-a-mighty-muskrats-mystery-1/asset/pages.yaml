  md: '# THE CASE OF WINDY LAKE


    their state of repair. That stretched from condemn-able to could-use-a-good-paint.


    In time, they turned off the road and down a trail that entered a smattering of
    forest. The houses of the reserve were scattered along a stretch of highway and
    not in the neat rows of the Métis half of the community or the trailer park. It
    was not uncommon to come across a patch of wilderness between neighborhoods on
    the rez. In the shadows of the thin, but tall, pines the temperature dropped to
    a chill. The kids walked a little quicker.


    A scream cut the air.


    Otter stopped. “Hear that?”


    A woman’s angry outburst once again sliced through the quiet of the bush.


    The Mighty Muskrats looked at each other and then took off running.'

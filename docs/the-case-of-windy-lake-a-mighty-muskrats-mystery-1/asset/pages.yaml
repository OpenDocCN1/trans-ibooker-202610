- pgno: 10
  md: '“Who’s a war chief?”


    “Denice.” Uncle Levi sounded slightly annoyed.


    “She’s your niece.” Grandpa looked at his son.


    Uncle grunted in acceptance.


    “You know why she fights like that,” Grandpa gently chided his son. “Your brother
    lived fast and hard. He partied too much. Denice rebelled by devoting her life
    to taking care of him. I don’t have to tell you that.”


    Uncle Levi nodded in grudging agreement.


    “To take care of him…she had to go to the same rough places he did, stay up as
    long as he did, be out all night with the same people he was. She became rough
    and tough too, trying to take care of her dad. And when he passed, she had no
    one to take care of anymore. So, she turned outwards.” Grandpa leaned toward his
    son, looking into his eyes. “You know she will do much for our community, if she
    can turn her strength to a good cause.”


    Uncle Levi nodded but stared out the window at the lake.


    The sound of logs tumbling from the boys’ arms into the wood box drew everyone’s
    attention. Grandpa seemed to notice the children for the first time, but they
    all knew he had just been waiting until all their chores were done. With a wave
    of his hand he dismissed them. “All right. Go outside, rez puppies.”


    The kids left the small house in a rush. They were inseparable, and they had been
    given the name Mighty'

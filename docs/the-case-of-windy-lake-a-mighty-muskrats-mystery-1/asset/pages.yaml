- pgno: 14
  md: 'old carpets lay along its bottom. The kids crouched and crawled into the tunnel.
    Otter closed the metal screen that hid the tunnel behind him.


    The other end of the culvert was stuck into the emergency door of a school bus.
    The long vehicle was buried in the pile of cars. Couches replaced most of the
    bus seats, a dining table and chairs were pushed against one wall, and a laptop
    computer blinked on a table in front of a sofa. Long ago, the kids had snaked
    an electrical cord to their sanctuary from a nearby hydro pole.


    Chickadee took a Wi-Fi adapter from her pocket and plugged it into her computer’s
    USB port. In a moment, she was searching for the doctor’s name.


    “Troy Pixton…Troy Pixton…Troy Pixton…come to me, Troy Pixton.”


    The boys giggled.


    “Shhh!” Chickadee scolded. But she broke into a grin as her attention shifted
    back to the screen.


    The boys moved farther into the bus.


    “Probably not the cricket player…. Wow! A lot of people know him,” she cried.
    “Probably not the psychiatrist from the States.”


    Samuel slumped into the driver’s seat and took his current read from off the thin
    dash. Knickknacks and interesting items from the refuse outside covered the bus’s
    hood and filled the view through the missing windshield.'

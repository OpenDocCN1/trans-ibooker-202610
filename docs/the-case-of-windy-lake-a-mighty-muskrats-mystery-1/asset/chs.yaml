  Denice thought. “Yes…yes, I did.”


  “Once you learned something, did you use that information to come up with a better
  way of doing what you want to do?”


  “I think so.”


  “Then…this will only be worthless if you do not act on your vision.” Grandpa stroked
  her hair.


  Denice stared out across the lake, and then at the crowd of people waiting for the
  boat that held the rescued archeologist.


  “How do we get you off of here? Where are the handcuff keys?” Samuel looked at the
  pipe as though it was a puzzle.


  “Handcuff keys?” Denice smiled. “I’m just holding my hands together in here.”


  Atim laughed. “You mean they could have just pulled you off of there if they wanted?”


  “I was going to use handcuffs, but I forgot them.” Denice looked sheepish. She slid
  her red, raw hands out from the confines of the pipe. “Oh! The pins and needles!”
  The exhausted activist spread out her fingers and then made a fist.


  “Wait till you try to stand up, cuz,” Sam warned with a smile.


  “Don’t laugh at me!” Denice tried to raise her voice, but it was too hoarse. She
  managed to chuckle.


  “Is it over? Is she done?” Steven from Smokey Bend suddenly stuck his head into
  the group.


  “I’m just getting started,” Denice stated. “But I’m taking the fight to them.”


  As Chickadee helped Denice straighten her legs, her older cousin moaned in pain.


  Steven knelt down and rubbed her back.


  The noise from the crowd farther down the dock suddenly rose. The RCMP boat had
  been spotted.


  “Grandpa?” Sam questioned his Elder, eager to see and hear what was happening. The
  chatter grew as the sound of the approaching boat was heard.


  “I’ll sit with her,” Steven offered. He looked at Denice with concern.


  “Okay, Mighty Muskrats…go see them bring in the bone-digger.” Denice knew the curiosity
  that infused her cousins. “I’ll be okay.”


  The Mighty Muskrats paused until Grandpa nodded his permission. The boys took off
  down the dock to check out the crowd. Chickadee took her grandfather’s hand and
  pulled him along.


  The boys stopped outside of the circle. They were unable to see anything. But when
  Grandpa arrived, the crowd parted at the sight of him. The kids followed in his
  wake as he made his way to the front.


  Uncle Levi and Gus were there. They smiled at the family as they came through the
  crowd. The Muskrats jostled for position in front of the forest of legs. The archeologist
  had finally stepped out of the RCMP boat and onto the dock.


  Dr. Pixton was wrapped in a blanket. His skin was chalk-white and the veins on his
  hands stood out in blue. The doctor’s spine was bowed from the weight of the experience.
  All of his energy was being spent shivering. He looked permanently cold.


  “We have to get him to the ambulance!” the RCMP sergeant shouted. “He has hypothermia.”


  “Clear the way!” the company manager yelled.


  Although the officer and Makowski were in a hurry, the doctor wasn’t. He walked
  at a glacial pace, refusing to be hurried or put on a stretcher.


  “I’ll make it,” he gritted his chattering teeth as he spoke.


  A TV news reporter from the Aboriginal Peoples Television Network appeared out of
  the crowd and shoved a microphone in Dr. Pixton’s face.


  “Doctor, what happened out there?”


  “Leave him be! Can’t you see he’s weak?” Makowski’s thick arm tried to sweep the
  reporter aside.


  The young Native journalist stood her ground and pointed the microphone at the manager.
  “Well, can you tell us what happened?”


  Makowski suddenly realized that he was being taped. He straightened up and changed
  the tone of his voice.


  “He told us he pulled ashore to go look at the Indians’ …uh…the people of Windy
  Lake’s old winter camp, but he got lost and never made it back to his boat.”


  Suddenly, the doctor stopped his determined march. The crowd hushed.


  “I…am small.” The old bone-digger took the reporter’s arm and looked into her eyes.
  “But do you know how big it is? The universe…the wheels within wheels…the circle
  in the sky? I saw them!”


  The reporter slowly took her arm back.


  “You saw the universe?” She looked around at those in the crowd as though to confirm
  she had heard right.


  “I was hungry. I was alone. Your people lived here… and survived!” The archeologist
  spoke as though it were a revelation.


  The reporter looked uncomfortable and mumbled, “I’m Anishinaabe. My people are from
  down south….”


  “What strength!” Dr. Pixton looked around at the crowd happily. Makowski opened
  his mouth to say something, stopped, started again, and then shook his head in bewilderment.
  He touched the doctor’s back, urging him to walk on.


  “What will you do now?” the reporter probed.





  ## 风湖疑案


  皮克斯顿博士沉思片刻，虚弱地笑了笑。“我再也不做野外工作了。再也不去挖掘原住民的遗骨了。是时候让我去见见一些活着的人了。”他伸出手，真诚地握了握记者的胳膊，然后走向等待的救护车。医生改变主意的消息在人群中悄悄传开。大家都急于想听更多，于是跟着老人一起被抬上担架。


  救护车驶出停车场时，负责的皇家骑警警官转向人群和 APTN 的摄像机。“我想感谢大家自愿出来寻找皮克斯顿博士。正因为你们的帮助，我们才能把他带回家！”


  人群中爆发出欢呼，大家互相拍着后背。勇敢的水獭鼠们欣喜地互相看着。爷爷微笑着揉了揉海狸的头发。


  警官继续说道。


  “我们真的要感谢风湖警察局、利维和加斯，不仅安排了志愿者，还提供了帮助我们改变搜索地点……并最终找到医生的信息。加斯，你上来说几句。”


  加斯是个爱开玩笑的人，习惯了成为众人关注的焦点。“我很想把功劳揽在自己身上，我真的很想……”他耸了耸肩。“但功劳应该归功于功劳所在的人。是勇敢的水獭鼠们想出了办法。”


  人群中传来一阵大声的“哦——！”皇家骑警警官看起来有些尴尬。勇敢的水獭鼠们被推到了圈子的中央。


  加斯对他们微笑，把他们排成一排，拍了拍他们的后背。APTN 的摄像机正在拍摄。


  加斯对人群和记者说道。


  > “我们从发现船的方式推断，有人把船拖进了三角洲的泥里。但这些孩子们想明白了事情并不是这样发生的。是怎么发生的，海狸？”


  海狸遮住眼睛挡住摄像机刺眼的光线。


  > “爷爷告诉我们，如果想知道秘密，就必须了解三角洲和鸟儿知道的事情。嗯，鸟儿知道如果你抓起一条蛇然后放下它，你就能杀死它！”


  记者完全不知道海狸在说什么。她满怀期待地等待着。他带着一种完成感微笑着。


  知更鸟把山姆推了出来。


  > “…这就是我们发现船的绳子是被一只鹰拉出来的原因……而不是皮克斯顿博士，或是偷船的人。我们还发现，雨夹雪事件随后大坝开启足以抬起船。然后风一定只是自然地把它推到了湖的另一边。”



    Sam leaned toward Chickadee. “There isn’t any mining stuff anywhere near here.”


    “I was thinking of that. I know the snake pits are back there. But Grandpa’s never
    shown me anything other than that.”


    Sam shook his head to indicate he’d never been introduced to anything sacred or
    culturally significant in this area either. “Otter! He ever take you anywhere
    special back in the bush?”


    Otter shook his head. He was the most bush savvy of the Muskrats. His grandfather
    used him as a fire keeper during the sweat lodge and other ceremonies when the
    older cousins weren’t around.


    They sat in silence and watched the RCMP officer struggle in the muck.


    “Look at that. That’s why there’s no tracks. It just sucks them up.” Gus shook
    his head.


    “Did you check the hard shore?” Atim looked in the direction of the distant rocks.


    “Well, we hope the dog will pick something up over there, but if not, we’ll need

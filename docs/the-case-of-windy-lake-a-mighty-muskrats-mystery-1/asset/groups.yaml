    “We’re going to wait until he’s away from that crew before we ask him anything.”
    Chickadee plopped down beside Otter. The Muskrats watched Fish’s table. The waitress
    brought the fries with a second plate for Otter. He didn’t like ketchup on top.
    He only liked to dip. The kids began to grab the potato sticks hungrily. The Coke
    was shared.


    Eventually, Fish started saying good-bye to those he was with.


    “Okay, he’s leaving by himself,” Chickadee whispered. “That’s good, hey?” Atim
    nudged her. She pushed him back.


    “He may talk more if he’s alone,” Sam answered Atim. Fish eventually limped across
    the restaurant and out the door. The Muskrats gulped down the last of the chips
    and followed.


    “Hey, Fish!” Atim called.


    The young man turned to see who called his name. Although Fish was only in his
    thirties, he seemed haggard. An old boating injury caused him to limp and slouch
    forward slightly. His hand-me-down clothes didn’t fit well.


    “What do you kids want?” He began to walk away as he asked the question.


    “Did you hear they found that old man?” Sam asked, trailing after him.


    “The Doc?”


    "Hey!" Atim yelled and pointed.


    The traditionalists’ camp had just come into a view. Not much could be seen, just
    flashes of color amidst the black and gray trunks of thin evergreens. There were
    several motorboats pulled up along the shore.


    The landing site was filled with countless multi-colored stones slowly being ground
    into sand by the motion of the waves. Mark killed the engine and lifted the prop
    out of the water. Only the slap of waves could be heard until the pebbles began
    their subtle scratching as the ground came up to meet the aluminum bow.


    Otter leapt into the knee-deep, clear water with the boat’s rope in hand. With
    the help of the occasional lift from the waves he pulled his cousins farther into
    shore and tied the rope to a tree.


    "Holee!" Mark exclaimed. "They’ve been raising the water at the dam. Look at what
    it did to the shore there." The frequent raising and lowering of the lake’s water
    by the nearby hydro dam had eroded the bank of soil above the now wider strip
    of pebbled shore.


    "I’ve never had to tie up this high before." Otter looked worried.


    With everyone disembarked, they began the trudge up the hill to the camp.


    Mark and Otter carried the ducks.


    The traditionalists’ camp was a group of teepees, wigwams, and shacks scattered
    amongst the trees in the sparse, spruce forest. Most of the teepees were painted
    with the colors and patterns of the people that owned them.


    A few small cooking fires burned here and there, but the Muskrats headed for the
    fire in the center of the camp where the old men hung out, and where most of the
    visiting took place. Two old couples relaxed in lounge chairs, sipping their tea
    in the warmth of the flames.


    Mark, being the oldest cousin, had the responsibility of speaking first. He presented
    his ducks to the Elders. Chickadee touched the arm of one of the older ladies
    and pulled up a stump of wood near her. Sam smiled at everyone and also sat on
    a section of tree trunk. Atim and Otter went to the nearby pile of firewood. Otter
    began to cut kindling with an ax as he listened to the conversation.


    “Give two of those ducks to Grace. Her old man is in town, but he’s coming back
    with their kids.” A lady Elder lip-pointed toward Grace’s camp.


    “I’ll take one.” Her husband laughed. “I’ve been craving duck soup.”


    “You don’t make good duck soup,” his wife teased.


    “I didn’t say I was craving my duck soup.”


    “So, whose duck soup are you craving?” The old lady pretended to be angry. “Are
    you craving another woman’s soup?”


    The Elders, Muskrats, and Mark giggled. A quiet moment passed after the chuckling
    subsided.


    “I hear they found that missing archeologist by the delta,” Sam offered.

    “What?” The old men were suddenly attentive. Sam was a little surprised by the
    level of focus.

    “Yeah…. Fish told us. Said the cops found his boat by the delta…or somebody did.”

    “Did you tell your grandfather this?” One of the old men poked the fire as he
    spoke.

    “We didn’t have time….” Chickadee also felt the tension in her Elders. “We wanted
    to check it out.”

    One of the old women leaned forward. “Well…we want you to check it out too. Then
    come back and tell us what you saw. Tell us everything.”

    “Why do you want to know?” Sam felt it was more than idle curiosity.

    “I saw that little old white man, wearing his blazer in the bush.” The wrinkled
    Elder shook his head. “It sounds funny to think of him as dangerous. But to us,
    those bone-diggers can be worse than the miners. They want to turn our sacred
    places into money-making ventures like nobody else. If the miners want our sacred
    land, it is usually just by coincidence, but the bone-digger makes money from…us…our
    stories, our ancestors’ places.”

    “I know about the old camp…and the old dancing site. Do you mean places like those?”
    Chickadee felt they were on the edge of a secret.


    ## THE CASE OF WINDY LAKE


    “Yes, places like those….” The old people shared a glance.


    “There is nothing that I know of by the delta.” Chickadee pushed.


    The old woman beside Chickadee gave her a nudge. With a gentle smile she said,
    “Maybe you haven’t earned that knowledge yet.”


    That put an end to the questions.


    “Be careful as you go, young ones.” One of the Elders stood. “It’s getting late
    in the day. If you cannot get back to us, don’t worry. Tell your grandfather.
    We’ll hear about it eventually.”


    With quick good-byes and promises to return, the Muskrats and Mark were soon leaving
    the community fire and making their way back to the boat. Otter pushed them off
    the shore and they were soon pounding across the waves.



    a walking stick that could support his slight frame.


    ## THE CASE OF WINDY LAKE


    Atim assessed the shoreline and the difficulty of traversing it. “Are we going
    to walk along the shore here, Uncle?” he asked. “It might be easier if we took
    the trail to the snake pits and then cut in.”


    “We’ll have to take the hard road. I want to be sure the dog gets a chance to
    whiff this whole stretch. Maybe, we’ll walk out along that trail.”


    Atim shrugged, but he wasn’t excited about trying to scramble over the steep shore
    between the bush and the water. His stomach growled.


    “Here, big guy.” A smirking Otter passed Atim a much thicker walking stick than
    his own. “This *might* keep you out of the water.”


    Atim flicked the hair out of his eyes and grabbed the stick with a mock show of
    anger. They both laughed.


    “Boys,” their uncle looked over at them with a touch of a smile, “quit being funny
    and come here.”


    He surveyed the trek they were about to take. “We have to find Dr. Pixton. This
    winter held on so long, the nights are still getting cold. Heck, we still had
    snow before the rain the other day. If he’s out here cold and wet…”


    He looked at them seriously and then shook his head. “I’m pretty sure even a city
    guy like him can last one night, but…not too much more….”


    Out from the inside of his jacket, Uncle Levi brought a large Ziploc bag containing
    some crumbled cloth. He shouted out Scout’s name.


    “We paid a lot of money for this mutt to be trained, so he better work.”


    The dog came running over from a rotting tree stump he had been investigating
    and nuzzled up against their uncle’s leg.


    “Pixton’s shirt,” he announced as he pulled it from the bag and presented it to
    the German shepherd. The excited dog took great interest in the smells on the
    garment. “Hopefully, this will give him what he needs to find that old guy.”


    The dog continued to snuffle and snort at the shirt. Then Uncle Levi put the shirt
    back in the bag. “Search, Scout. Search.”


    The dog looked into his handler’s eyes and then began to search the ground with
    his nose. He cast back and forth, but soon started going over old ground. He seemed
    unable to find what he was looking for.


    “I don’t know if he’ll find any scent. If Pixton was out in the rain, the water
    may have washed it away.” Their uncle looked off into the distance. “But hopefully,
    we’ll find something.” Uncle Levi grabbed an ax from the patrol boat and they
    started to walk along the edge of the bay.


    Otter and Atim waded at the edge of the water, using the limestone shelf that
    stuck out from the shore. Their uncle walked on top of a man-high, limestone cliff
    covered in mud and brush. Scout swept back and forth over



    ## The Case of Windy Lake


    Dr. Pixton thought for a moment and laughed weakly. “No more field work for me.
    No more digging up the bones of Native people. It’s time I met some of the living
    ones.” He reached out, squeezed the reporter’s arm sincerely, and then walked
    to the waiting ambulance. The doctor’s change of heart was whispered through the
    crowd. Eager to hear more, everyone followed the old man as he was helped onto
    a stretcher.


    As the ambulance was pulling out of the parking lot, the lead RCMP officer turned
    to the crowd and the APTN cameras. “I want to thank you all for volunteering to
    look for Dr. Pixton. We were able to bring him home due to your help!”


    The people in the crowd cheered and patted each other on the back. The Mighty
    Muskrats looked at each other gleefully. Grandpa smiled and tousled Otter’s hair.


    The officer went on.


    “We really want to thank the Windy Lake Police, Levi and Gus, for not only arranging
    the volunteers, but also giving us the information that helped us change our search
    location…and actually find the doctor. Come up here and say something, Gus.”


    Gus was a funny guy who was used to being the center of attention. “I’d like to
    claim the credit, I really would…” He shrugged. “But I have to give credit where
    credit is due. It was the Mighty Muskrats who figured it out.”


    A great “Oh-ho!” went up from the crowd. The RCMP officer looked a bit chagrined.
    The Mighty Muskrats were pushed forward into the center of the circle.


    Gus smiled at them and lined them up and patted them on the back. The APTN camera
    was rolling.


    Gus spoke to the crowd and the reporter.


    > “We thought, from the way we found the boat, that someone had pulled it into
    the mud of the delta. But these kids figured out that wasn’t the way it happened.
    How did it happen, Otter?”


    Otter shielded his eyes from the camera’s bright light.


    > “Grandpa told us that if we wanted to know the secret, we’d have to know the
    delta and what the birds know. Well, the birds know that if you pick up a snake
    and drop it, you can kill it!”


    The reporter had no idea what Otter was talking about. She waited expectantly.
    He smiled with a feeling of completion.


    Chickadee pushed Sam forward.


    > “…And that’s how we found out the boat’s rope was pulled out by a hawk…and not
    Dr. Pixton, or someone who stole the boat. We also found out the rain-on-snow
    event followed by the dam opening was enough to lift the boat. Then the wind must
    have just naturally pushed it to the other side of the lake.”


    The reporter looked impressed. Denice and Steven pushed through the crowd. Steven
    had his arm around her waist and was helping her walk. They both smiled when they
    saw Denice’s little cousins. Grandpa proudly watched his grandchildren from the
    edge of the crowd.


    Sam continued. “That’s when we figured a hawk saw the rope. It must have picked
    it up and tried to pull it high, but, of course, the boat was too heavy. So, the
    hawk dropped the rope, making it look like someone had pulled it out. Everyone
    was searching on the wrong side of the lake.”


    The RCMP officer, after hearing the whole story, smiled at the kids.


    The reporter tightened up the line of Mighty Muskrats. Sam, Chickadee, Atim, and
    Otter hugged each other and giggled uncontrollably.


    “There you have it, folks,” the reporter said into the camera. “The case of Windy
    Lake has been solved by these kids, called…” She motioned to Sam as though he
    should say the name.


    Instead, the four sleuths looked at each other and with a wide grin they yelled
    as one, “The Mighty Muskrats!”



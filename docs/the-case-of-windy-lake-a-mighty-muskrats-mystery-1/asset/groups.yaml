    thinks I’m on a quest?” Denice sounded annoyed. “Crazy old man. Sends me a sip
    or two of one of his potions. *Pff!*”


    The Muskrats were a little taken aback by their cousin’s disrespectful words.


    “Did he give me anything else?”


    Atim reached back into the bag and pulled out a small packet of four salted crackers.


    “Crackers?” Denice laughed. “My throat is so dry, I can’t eat crackers.”


    “It’s what Gramps gave us,” Sam told her. “He said you picked your wilderness…for
    your vision quest. And now you have to see it through.”


    “Well…I’m sore. The thirst and the hunger aren’t so bad. My shoulders are so sore.
    My legs. My back is on fire. Keep rubbing it.” Denice winced as she changed the
    shoulder she was leaning against. Chickadee upped the pressure and frequency of
    her strokes along the older girl’s back. It seemed weird to see Denice so weak.


    Sam noticed a furious blotch of red rash where Denice’s skin had pressed against
    the stained wood. It was then that he noticed his grandmother’s blanket wasn’t
    in sight.


    Denice let out a sigh. “You guys are good kids.” She lifted her head to smile
    at each of them. “That’s why I’m doing this—so it’s still here for you when you
    get to my age. They’ve made so many changes. And they never stop.” She sat in
    silence.


    Sam looked out over the pier. Men were working here and there, wherever a barge
    had docked along the thick wooden fingers that stretched into the lake. Behind
    him the warehouse overshadowed the scene like a great wall that blocked off this
    portion of the shore from the rest of the world.


    The area smelled of diesel and wood rot. The action of moving the ore off the
    barges and loading it onto the trucks had caused many a minor spill. Now this
    ore-gravel was pressed into every nook and cranny of the wood and concrete pier.
    Denice was fastened to a dock pillar. A small group of boxes still sat in a half
    circle around the protest.


    Samuel stood above Chickadee. She continued to massage Denice’s back. Atim looked
    down at the girls, his face drawn and worried.


    “Where’s Grandma’s blanket?” Sam whispered. He was almost surprised that anyone
    heard.


    Denice beckoned with her head. “Give me another sip.” When she had finished what
    was left in the bottle, she went on. “I gave it to Steven. To put in his locker.
    I didn’t want it to get dirty.”


    “Was that the guy from Smokey Bend?” Chickadee asked.


    “Yeah, that’s him.” Denice laughed in spite of her aches. “Cute, hey? For a guy
    from Smokey Bend, anyway.”


    “He spoke to us at the Station. He said he talked to you.” Chickadee smiled at
    her cousin.


    “We talked,” Denice replied. “He said he had good kids, too.” She lost herself
    in thought for a moment. “That blanket is all we have of Grandma. She always told
    us our job in life was to provide a good life for our kids.”


    “That’s what that guy from Smokey Bend said.” Sam pictured his grandmother’s face.
    Her only ambition was to be a help to the next generation and make sure they had
    everything they needed—heart, body, and soul. She had earned a name among their
    people that best translated to English as “everyone’s mom.”


    “She always said to take care of your family.” Denice shrugged as she looked up
    at Sam. “Steven is trying to take care of his family, but he needs this job to
    do it. I don’t know…I wish he didn’t have to do this…work for the company.”


    Sam shook his head. “The company provides him with a paycheck. Not too many jobs
    around here that pay as good.” He had asked his cousins who worked for the company
    how much they made at the entry level. Few made it beyond that. It wouldn’t get
    you rich, but you could provide your kids with a pretty good Christmas if you
    watched your pennies.


    “I’m so tired.” Denice sighed and leaned heavily on the pier. “I think I’m almost
    ready to give in. You know, look around, I didn’t stop anything. Didn’t even slow
    them down.”


    She lifted up her hands, imprisoned in the pipe. “My shoulders and hands ache
    more than my stomach. I think I’m ready…”


    “WHAT ARE YOU KIDS DOING HERE?!” Mr. Makowski’s voice bellowed from behind them.
    The Mighty Muskrats jumped.


    ## CHAPTER 16


    ### The Day Gets Warmer


    “We’re just…” Sam knew what he wanted to say but was too startled.


    “They’re just bringing me supplies so I can stay here for another four days!”
    Denice’s defiant voice had lost its dry rasp.


    “YOU KIDS GET OUT OF HERE!” The company manager was steadily walking toward them.


    “I think we should go,” Sam said to Denice. “We’re leaving right now, Sir!” he
    called to Makowski.


    Chickadee stood up. Sam could see she was angry that Mr. Makowski didn’t care
    about their older cousin. Atim was also fired up. Sam stepped in front of both
    of them. “We haven’t left her anything. We’re just about to go. We just had to
    check on her…. Our grandpa said.”


    “LEAVE THEM ALONE!” Denice screamed.


    “We don’t know where Uncle Levi is,” Atim shot back at the big man.


    “This one is going to starve here.” Makowski pointed at their cousin. “She’s almost
    done.” He laughed.


    “You don’t care!” Chickadee shouted at him.


    Mr. Makowski pointed in the direction of the gate.


    “GET OUT OF HERE!”


    Samuel kept eye contact with the man as he slowly turned. “Good-bye, Denice,”
    he said as he left.


    “Yeah, see you soon,” Atim said with anger in his voice.


    Chickadee bent down and gave her cousin a hug. She gave Denice’s shoulders a quick
    squeeze as she stood and gave the manager a fiery look.


    The Mighty Muskrats walked stiff-legged around the warehouse.


    “That old man may be dead because nobody in this town cares.” Makowski walked
    right behind them.


    “We’ve been figuring out where he is since we heard about him,” Sam shot over
    his shoulder.


    “We care,” Atim added. “We just don’t think he is where they’re looking!”


    “Kids!” The company man snorted. “We’ve been all around those snake pits. We’re
    going to push farther back into the bush today, if that’s what you’re talking
    about.”


    “You aren’t even looking in the right place,” Samuel said out loud.


    The manager’s frown deepened, but he didn’t say anything.


    The group arrived at the fence. Makowski motioned for his men to get out of the
    way as he swung the chain-link gate open. When the kids were through, he gave
    the gate a shove and turned to go back to the office.


    The nice guard who’d let them in looked slightly chagrined as the gate clicked
    closed.


    “I’ll keep an eye on her,” he whispered with a smile.


    Chickadee looked back at the warehouse that blocked her view of Denice. “Please,
    take care of her,” she said to both the universe and the guard. Turning away,
    she and Atim started walking down the road.


    “Thanks.” Sam nodded at the man and then he followed his brother and cousin.


    *


    In the rising heat of the spring day, Atim took off his jacket as he broke the
    silence. “Where are we going now?”


    “Yeah,” Chickadee said with a sigh. “I wish Otter was here.”


    Sam started pinching his chin. “I don’t know where we’re going.”


    Chickadee sighed again. Atim kicked at a rock. They kept walking down the dusty
    road.


    “It’s after lunch, and I didn’t have much for breakfast.” Atim rubbed his belly
    as he walked.


    Sam and Chickadee ignored the hint.


    “Kay, maybe we need to look at this a whole different way.” Sam felt under pressure
    to find a destination. “Who pulled out that rope? Maybe…it wasn’t Dr. Pixton.”


    “Mr. Mackie rented out the boat.” Chickadee nodded, interested in Sam’s line of
    thought.


    “I don’t know…I’m wondering why we can’t find Fish.” Atim swung his head to move
    his hair so he could see his brother clearly.


    “That old man has been gone for…three days, two nights now. We haven’t found Fish
    for the last two.” Sam pinched his chin.


    “His wife said he was around,” Chickadee said.


    “She’d lie for him,” Atim reasoned.


    Nobody disagreed.


    “Should we go bang on his door again?” Atim asked.


    Sam was deep in thought. Mr. Mackie was an old Métis fisherman with an extra boat.
    He didn’t seem like someone who would do away with an archaeologist. Fish had
    always seemed harmless, but he did have cousins and a brother who had been in
    trouble with the law…on more than one occasion. “If we go to his door again, maybe

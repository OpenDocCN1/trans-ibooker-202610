    “Let’s hurry!” Chickadee started jogging down the road. Her cousins picked up
    their pace.


    Eventually they rounded the last corner that blocked their view of the company
    gate. They slowed to a walk.


    “Do you think they’ll let us in?” Atim flicked his hair while looking at the guards
    at the gate. There were fewer now that the entrance was no longer blocked by protestors.


    “I wonder where Denice’s friends are?” Chickadee’s brow furrowed.


    “Maybe they’re like Gramps and figure this is her ordeal.” Sam shrugged.


    Chickadee looked thoughtful. “Maybe that nice guy from Smokey Bend who spoke to
    Denice earlier will be here.”


    They stopped in front of the gate, a little nervous about approaching the company
    men.


    A large blond security guard with a big beard noticed them. He walked out of the
    compound and over to the kids. “Are you here for Denice?” He looked the three
    over.


    The Mighty Muskrats were surprised that one of the miners knew their cousin by
    name.


    “Yeah.” Sam squinted up at the man.


    “She’s not looking good. Your family needs to get her out of here.” The man sounded
    worried, not angry.


    “We brought her something from our grandpa.” Atim held up the package.


    “Well…some of her friends were here earlier, but Makowski sent them packing.”
    The man was struggling with the idea of letting them in. “They were protestors
    though…you’re family.”


    “You could take it to her,” Atim ventured.


    Chickadee gave him a look that shut him up.


    “Nooo…. Makowski might kill me for that.” The man chuckled and shook his head.
    “She’s a tough chick. A few of the guys were talking to her. At first, we thought
    she was crazy, but you know, she’s just trying to protect her land.”


    The children were even more surprised by the miner.


    “My auntie says because of the law First Nations live under, the environmental
    standards are less strict.” Sam tried to sound adult.


    “I don’t know about that.” The big guy shook his beard and looked over at the
    company building. It seemed he was trying to look through it at Denice. “I’m going
    to let you guys in. But you have to make it quick. Makowski is off the compound,
    but I don’t know when he’s coming back.”


    “Thanks. We just need to deliver this package and give her a message from our
    grandpa.” Sam nodded at the man.


    “Well, if anyone asks, tell them you climbed the fence.” The blond miner laughed.
    “Get going! Make it quick!” He opened the compound gate.


    The three kids took off across the yard. It didn’t take long to get around the
    other side of the long warehouse and office.


    Chickadee gasped when she saw her cousin. “Oh, Denice!” she cried as tears began
    to flow. The boys were speechless.


    Denice leaned heavily against the pillar she was wrapped around. Creosote stuck
    to her arms, chin, and cheeks. Blobs of the tar clung to her long, black hair.
    Her eyes were dull.


    “Water?” Denice looked up. Her neck seemed to struggle with the weight of her
    head.


    Sam realized it was the first time he hadn’t seen Denice smile when they met.
    He noticed her skin near the pipe that hid her hands had turned raw.


    Atim had forgotten about the package, but he finally ripped it open and looked
    inside. A small, much-used bottle was about a quarter filled with cloudy water.
    Sediment of some kind was clinging to the bottom.


    “Grandpa gave you this…to drink.” He held up the bottle for everyone to see.



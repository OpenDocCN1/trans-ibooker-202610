    # THE CASE OF WINDY LAKE


    “The next day? I want her out of here today!” Grandpa looked into the manager’s
    eyes. “Oh, I don’t think that will happen. She’ll be fine here for another day…or
    two.” He turned and laid a hand on Denice’s head. He closed his eyes and said
    a little prayer.


    “Okay…it’s time to go, children.” Chickadee took the old man’s elbow. His walking
    stick began to *tick, tock, tick* down the pier.


    “I’ll be back tomorrow evening, my girl,” the old man shouted over his shoulder.


    The Mighty Muskrats followed Grandpa back around the warehouse. Mr. Makowski and
    his men followed a little way behind them, making sure they actually left.


    The gate clinked closed with a rattle.


    With that task done, Grandpa was in the mood for tea. The Muskrats walked him
    to their Auntie Yvette’s house for some bannock and a visit.


    At the end of the driveway, the cousins paused, unsure of what direction to take
    down the gravel rez road.


    “What do you want to do now?” Chickadee asked Sam.


    “Well, Grandpa said he doesn’t think the archeologist is where they’re looking.”


    “Then how would the boat get there?” Atim picked up a rock and threw it over their
    aunt’s house.



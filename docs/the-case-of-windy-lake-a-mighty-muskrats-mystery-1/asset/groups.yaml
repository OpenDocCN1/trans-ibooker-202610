    to go. That was that. I didn’t even hear back from the others…and they all have
    boats that could take people out. They wanted to help when I first told them.”


    Samuel was processing the information.


    Mavis continued. “If you ask me, it was those Elders. Who knows where it started?”
    She threw up her hands. “But somebody says ‘remember when’ and then none of them
    move.” She shook her head in disgust.


    Sam nodded.


    Chickadee rolled her eyes at his silence. “We don’t know what happened,” she explained
    to Mavis. “We were in the parking lot at the Station when the RCMP met the company
    guys. The big hothead manager was mad that there were no volunteers.”


    “Who? Makowski? I could tell you a few things about that guy.” She chuckled, then
    remembered she was talking to the nosiest children in town.


    She got serious. “If you want to know why the volunteers dried up…well, go and
    ask your grandfather. He’s their…whatever you call it.” Mavis dismissed the subject
    with a wave of her hand and then walked away.


    ## CHAPTER 14


    ### Searching for a Sign


    It was still dark when Otter woke. He quietly snuck out of the house and into
    his grandfather’s shed. When he came out he was lugging a small boat engine that
    weighed almost as much as he did. He loaded the engine into an old, tin wagon
    and pulled it down to the riverbank. The lake was almost wave-free. A steady but
    shallow undulation reflected the night sky and the lights along the shore. The
    water lapping against the sand and stones was hardly louder than a whisper.


    His grandfather’s canoe was overturned on the shore. Otter pulled a life jacket
    out from under the canoe and put it on.


    It wasn’t long before Otter was gliding through the waves at the small engine’s
    top speed. Its steady burp seemed to float out over the darkness of the lake.
    Otter’s mind still rang with the words that his grandfather had spoken the night
    before.


    The old man listened but carried on with his work. Chickadee continued. “We saw
    him at the Station. He called us over. He told her that he needs his job. That
    he’s a dad with kids. He…wanted the company to follow the rules, but…they didn’t
    always. Still…he needed his job so he could give his kids a good life.”


    Grandpa continued to slice the meat. Finally, he laughed and said, “Maybe that
    will be her vision. We will see what comes of that.”


    Their Elder didn’t say anything for a long time. Sam finished cleaning up in the
    entranceway and went to hold the dustpan for Otter.


    Eventually, Grandpa held up the knife he was using to cut the meat, showing it
    to the kids.


    “It’s an old question, what would you rather go through life with, a knife or
    a hammer? Maybe that will be your cousin’s vision.”


    The door squeaked open. Wearing his dirty outside boots, Atim walked over the
    recently swept floor and dumped a crumbling load of logs into the wood box. He
    immediately turned, kicked his boots sailing back into the entranceway, and then
    brushed the wood chips onto the kitchen floor.


    The family looked at him.


    “Were you guys talking about me, or what?” he asked when he noticed.


    Chickadee returned to washing dishes. Grandpa continued to slice the moose. Sam
    and Otter shook their heads and picked up the broom and dustpan again.


    “What...?” Atim looked around confused.


    Sam took the moment to change the topic of the conversation back to the Pixton
    case.


    “You were right, Grandpa,” Samuel said as he picked the larger wood chips up off
    the floor. “The boat may have floated on its own. The combination of the rainstorm
    on the snow caused a lot of water to pour into the lake....”


    “So, the wind could have pushed it to the delta,” Grandpa finished the thought.
    Chickadee nodded and smiled at him.


    “The wind probably did push the boat,” Chickadee said.


    “But the shore rope was pulled out like someone tried to drag it.” Atim retrieved
    a sock that had flown across the room when he kicked off his rubber boots. “We
    have to figure out what caused that...” Atim tossed the hair out of his eyes and
    looked at his brother, “...before we go to Uncle Levi.” His voice was insistent.


    “Yes, that’s the sticky bit,” Samuel said with a sigh.


    Sensing the tension, Grandpa looked at the brothers. “You need to know who pulled
    the rope out?”


    The Mighty Muskrats nodded. Grandpa went back to slicing his meat.


    The kids knew he was thinking, so they continued with their chores quietly.


    Their Elder eventually spoke. “Our people believe you are the land you live on.
    That means the land…the food that’s on it—that which can be gathered and that
    which can be hunted—its seasons, its water…its possibilities, and even the very
    shape of the landscape pour themselves into the beings and spirits that live on
    it.”


    With the roaster full of meat, Grandpa put the cover on and placed it in the fridge.
    He picked up what was left of the haunch and motioned to Atim. “Go put this back
    in the freezer.”


    Atim gingerly, but quickly, took the still-frozen hunk of meat and bone and ran
    to the shed and back. While he was gone, the old man quietly washed his hands
    in the sink. When he was done, he put the kettle on and sat at the scarred wood
    table.


    When Atim returned, Grandpa spoke again. “So, if you want to know a place, you
    must know the land. Know how it affects the animals and how they live their lives.”


    “Well, hopefully, a little bird will tell us.” Sam shook his head. He had wanted
    to hear something more helpful from his Elder. His grandfather noticed his slightly
    hidden sarcasm.


    “If you could talk to the birds, this mystery would already be solved,” Grandpa
    chided. “Do you know what the birds know?”


    Sam shook his head angrily.


    The lake was so calm it mirrored the sky perfectly. The small engine on the canoe
    was slow but sincere as it pushed the craft through the crisp water. The trip
    seemed to take twice as long as on Uncle Saul’s boat. Otter had passed the cultural
    camp an hour earlier, had watched the slow approach of the dock at the snake pits,
    and was now approaching the long, last point of land before the delta.


    He didn’t want to scare off anything in the bay, so he turned off the small motor.
    Leaning forward, he grabbed a paddle, but just held it crosswise across the canoe.
    Silently, he passed the fingertip of land and slipped into the crescent shape
    of Snake Creek Bay.


    The point was covered in gray-trunked evergreens. They stood close together near
    the shore, creating a thin stretch of thick forest that hid the parking lot and
    buildings of the snake pits.


    The thin sticks of spruce stopped short before a narrow stretch of field that
    gradually gave way to swamp grass as the land neared the water. Through it all,
    an occasional knee of limestone stuck out from the soil like a petrified whale
    caught in mid-breach.



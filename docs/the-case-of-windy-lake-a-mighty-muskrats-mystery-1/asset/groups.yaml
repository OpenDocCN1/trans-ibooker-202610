    “Hey. What are you kids doing here?”


    “We heard they found that company man.” Sam shaded his eyes from the sunlight
    as he spoke.


    “Found his boat, or the boat Mackie rented him, but we have no idea where he is.”
    A wood match danced from side to side in Gus’s mouth.


    “No tracks?” Atim leaned his head to get the hair out of his eyes and pointed
    at the rocky shore about a football field away from where they were parked on
    the edge of the delta’s silt.


    “There must have been some…but in this muck they disappear. It’s practically quicksand.
    But he did get out… the shore rope was pulled out across the muck.”


    The black-and-yellow, nylon rope that would usually secure the rental boat to
    shore was, instead, stretched out to its full length across the mud. It looked
    as though someone had tried to pull the yawl toward the distant rocks.


    “How do you know he didn’t sink?” Sam looked over the bow.


    “At this point…we don’t.” Gus studied the mud between the boat and the farther
    shore. “Your uncle is on the way with a dog…and Jerry is out there now with the
    probe.”


    Jerry was the RCMP officer from the patrol boat on the delta. He was wearing hip
    waders that went up to his armpits, which was a good thing because he sank up
    to his waist in the silty mud. He probed the area around the'

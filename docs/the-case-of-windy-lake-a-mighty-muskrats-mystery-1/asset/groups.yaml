    indicated a smattering of small and medium islands within the fan of creeks, silt,
    and swamp. Willows sprouted in those areas dry enough to support roots. Bulrushes
    embroidered the edge of any standing water, and a pudding of black and gray mud
    fertilized the lot. For most of the year, Snake Creek was just a series of trickling
    fingers into the bay. The boat had been caught near the largest of these, where

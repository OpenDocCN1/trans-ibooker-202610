    ## THE CASE OF WINDY LAKE


    Behind the long warehouse was a wide pier with two docks that stretched out into
    the lake. The cranes worked steadily. The area was littered with steel boxes of
    various shapes and sizes. Posts dotted the edge of the pier for the barges and
    boats to tie to. One of the company men stood with his hands on his hips glaring
    down at something hidden behind a set of stacked crates.


    Mr. Makowski cursed loudly when he saw what it was. When Uncle Levi caught up,
    he took off his hat, wiped his brow, then shook his head.


    Unseen, the Muskrats slipped behind a pile of boxes. They jostled for position
    before they slowly peeked over the edge.



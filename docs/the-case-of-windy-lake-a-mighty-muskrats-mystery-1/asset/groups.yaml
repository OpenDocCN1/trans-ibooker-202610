    ## 风湖疑案


    皮克斯顿博士沉思片刻，虚弱地笑了笑。“我再也不做野外工作了。再也不去挖掘原住民的遗骨了。是时候让我去见见一些活着的人了。”他伸出手，真诚地握了握记者的胳膊，然后走向等待的救护车。医生的改变心意在人群中悄悄传开。大家都急于想听更多，于是跟着老人一起被抬上担架。


    救护车驶出停车场时，负责的皇家骑警警官转向人群和 APTN 摄像机。“我想感谢大家自愿出来寻找皮克斯顿博士。正因为你们的帮助，我们才能把他带回家！”


    人群欢呼并互相拍背。勇敢的水獭鼠们欣喜地互相对视。爷爷微笑着揉乱了海狸的头发。


    警官继续说道。


    “我们真的要感谢风湖警察局、利维和加斯，不仅安排了志愿者，还提供了帮助我们改变搜索地点……并最终找到医生的信息。加斯，你上来说几句。”


    加斯是个爱开玩笑的人，习惯成为众人关注的焦点。“我很想把功劳揽在自己身上，我真的很想……”他耸了耸肩。“但功劳应该归于功劳所在的人。是勇敢的水獭鼠们想出了办法。”


    人群中爆发出一阵“哦——！”的惊叹。皇家骑警警官看起来有些尴尬。勇敢的水獭鼠们被推到圆圈中央。


    加斯对他们微笑，把他们排好队并拍了拍他们的后背。APTN 摄像机正在拍摄。


    加斯对人群和记者说道。


    > “我们从发现船的方式推断，有人把船拖进了三角洲的泥里。但这些孩子们想明白了事情并不是这样发生的。是怎么发生的，海狸？”


    海狸遮住眼睛挡住摄像机刺眼的光线。


    > “爷爷告诉我们，如果想知道秘密，就必须了解三角洲和鸟儿知道的事情。嗯，鸟儿知道如果你抓起一条蛇然后放下它，你就能杀死它！”


    记者完全不知道海狸在说什么。她满怀期待地等待着。他带着一种了结的感觉微笑着。


    知更鸟把山姆推了出来。


    > “…这就是我们发现船的绳子是被一只鹰拉出来的原因……而不是皮克斯顿博士，或是偷船的人。我们还发现，雨夹雪事件随后大坝开启足以抬起船。然后风一定只是自然地把它推到了湖的另一边。”


    记者看起来印象深刻。丹妮丝和史蒂文挤过人群。史蒂文搂着她的腰，扶着她走路。他们看到丹妮丝的小表亲时都笑了。爷爷自豪地从人群边缘看着他的孙辈。


    山姆继续说。“这就是我们推断有一只鹰看到了绳子。它一定把它抓起来试图拉高，但当然，船太重了。所以，鹰把绳子丢了，让它看起来像是有人把它拉出来。大家都在湖的错误一侧搜索。”


    皇家骑警警官听完整个故事后，对孩子们微笑。


    记者把勇敢的水獭鼠们排成一排。山姆、知更鸟、阿提姆和海狸互相拥抱，不可控制地咯咯笑。


    “各位，就是这样，”记者对着摄像机说。“风湖的案件是由这些孩子们解决的，他们叫……”她示意山姆好像他应该说出名字。


    相反，这四个侦探互相看着，咧嘴一笑异口同声地喊道：“勇敢的水獭鼠！”


    ## 关于作者


    迈克尔·哈钦森是《条约5》领地内米西帕维斯蒂克克里族的公民。青少年时期，他在温尼伯湖拉网，在加拿大地盾扑灭森林火灾，并在怀特谢尔核研究站的地下研究实验室工作。成年后，他曾担任酒吧服务员、摇滚音乐会和电影拍摄的餐饮服务员，最终成为《卡尔加里直报》和《原住民时报》等出版物的印刷记者。在被印第安索赔委员会挖角后，迈克尔从新闻业转向了传播领域，并在渥太华的
    ICC 担任作家。他回到家乡省开始组建家庭。此后，他曾担任曼尼托巴酋长大会传播总监、曼尼托巴条约关系委员会项目经理，在那里他帮助创建了“我们都是条约人民”运动，以及原住民大会的传播官。七多年前，他抓住机会为
    APTN 调查的第一季制作迷你纪录片。随后他成为《APTN 国家新闻》的主持人，并制作了 APTN 的对谈访谈节目《面对面》以及 APTN 版的《政治不正确》——《欢笑鼓》。迈克尔最近负责曼尼托巴基瓦蒂诺威奥基马卡纳克的传播工作，这是一个为曼尼托巴北部原住民发声的倡导组织。他目前是原住民大会国家酋长的新闻秘书，原住民大会是加拿大各地原住民的倡导组织。他的最大成就是他的两个可爱的女儿。



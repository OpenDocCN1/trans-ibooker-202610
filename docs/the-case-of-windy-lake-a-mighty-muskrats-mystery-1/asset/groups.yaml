    “What about the rope being pulled toward the shore?”

    “I don’t know about that one either…but the answer is out there. Go look again.”
    Grandfather waved in the direction of the delta.


    ## CHAPTER 10

    ### Visiting a Water Warrior


    The Mighty Muskrats and Grandpa turned off the road and onto a shortcut through
    the bush. It was dark, cool, and damp under the trees. Soon they were back on
    the road that led past the company pier.


    At the gate, the old man explained why they were there. The company lot was busy.
    There was much hustle and bustle. The large trucks were leaving like clockwork.


    The guards went through their grandfather’s jacket and searched the blanket they
    had brought for Denice. Grandpa chuckled as the guards unfolded the blanket looking
    for something that wasn’t there. Then he insisted they fold it up again. When
    they went to frisk Grandpa, his smile turned to a frown. But it was relit with
    a guffaw as the guard searched the old man’s ticklish spots.


    “We good?” Grandpa smiled at the young man who searched him.


    “I…I…” Denice looked down at the pattern covering her shoulders.


    “You’re hungry…” Grandpa took a seat on a nearby crate. A group of workmen walked
    past, curious at the little family gathering on their dock.


    “So hungry, Grandpa. But you didn’t bring any food!”


    “I have some water.” The old man unclipped a plastic bottle strapped to his belt.
    He gave it to Otter. The boy went over to his cousin and held it to her lips.
    Denice bowed her head and drank eagerly.


    “Only a little!” Grandpa held up his hand, and Otter pulled the bottle away. Denice
    coughed and sputtered. Chickadee kneeled down and wiped her cousin’s mouth with
    her sleeve. At that moment, the company manager rounded the corner of the warehouse
    with a group of men.


    “Do you want to leave this place, child?” Grandpa asked. “It has been a cold night.”


    At this Denice sat up and shook the self-pity from her face. She flashed a determined
    smile.


    “They’ll destroy our water, Grandpa. They’ll…you see what the hydro dam does to
    the shore.” Denice was getting fired up even amidst her pain.


    “All right, all right. We’ll be going then.” Grandpa got up to leave.


    “Grandpa…why did you come if you’re not going to bring food or help me?”


    “We brought you a sip of water, which is more than some get on a quest.” Grandpa
    smiled affectionately.


    “Who are you? And what are you doing here? I didn’t authorize your entry!” Mr.
    Makowski was not enraged like he had been the day before, but he was pretty stern
    nonetheless.


    “I’m her grandfather.” The old man hopped off the crate and walked to Denice.


    “Well, if you didn’t come to cut her loose, we don’t want you here. We don’t want
    anyone bringing her supplies.” Mr. Makowski swung his arms as he spoke.


    “I gave Denice her grandmother’s blanket.” Grandpa was slow and calm. When he
    was talking to someone who was angry, Grandpa always spoke to them as though they
    were children. It made him seem a little child-like himself, but only to those
    who didn’t know him. “It is an old blanket, one of the last that my wife made
    before she passed. I hope you won’t mind. We don’t want her to get sick.”


    The manager scratched the back of his head. “Well… no…we don’t want her getting
    sick…on my pier.” His mind was working. “The blanket is all right. But nothing
    else.” Mr. Makowski sounded resigned. “And I think it’s time to leave…” he said
    sternly but taking care not to command the old man.


    “Yes, I think it is time to go.” Grandpa nodded in agreement. “We will be back
    for her, if not tomorrow… the next day. She’ll have had her vision by then.”


    ## THE CASE OF WINDY LAKE


    “The next day? I want her out of here today!” Grandpa looked into the manager’s
    eyes. “Oh, I don’t think that will happen. She’ll be fine here for another day…or
    two.” He turned and laid a hand on Denice’s head. He closed his eyes and said
    a little prayer.


    “Okay…it’s time to go, children.” Chickadee took the old man’s elbow. His walking
    stick began to *tick, tock, tick* down the pier.


    “I’ll be back tomorrow evening, my girl,” the old man shouted over his shoulder.


    The Mighty Muskrats followed Grandpa back around the warehouse. Mr. Makowski and
    his men followed a little way behind them, making sure they actually left.


    The gate clinked closed with a rattle.


    With that task done, Grandpa was in the mood for tea. The Muskrats walked him
    to their Auntie Yvette’s house for some bannock and a visit.


    At the end of the driveway, the cousins paused, unsure of what direction to take
    down the gravel rez road.


    “What do you want to do now?” Chickadee asked Sam.


    “Well, Grandpa said he doesn’t think the archeologist is where they’re looking.”


    “Then how would the boat get there?” Atim picked up a rock and threw it over their
    aunt’s house.


    “It could drift, I suppose.” Sam pinched his chin as he thought.


    “Water’s still high from winter melting.” Otter stopped Atim from throwing an
    even bigger rock over the house.

    “Let’s go to the clubhouse.” Samuel had figured out a plan.

    “What’s at the clubhouse?” Atim shook Otter’s hand off his arm.

    “There’s something I want Chickadee to look up on the computer.” Samuel smiled.

    “Cool. Let’s go!” Chickadee said and started running down the road. Her cousins
    looked at each other and then ran after her.


    他们看着驶来的船。


    最终，Uncle Levi 减慢了发动机，缓缓向他们驶来。当他注意到这些年轻人时，他看起来更像是恼怒而不是愤怒。Muskrats 叹了口气松了口气。他们可以应付恼怒。Sam
    看向 Chickadee 并向她点了点头。


    Chickadee 来到船尾。用唱歌般的声音她说：“嗨，叔叔！你带上 Scout 了吗？”


    德国牧羊犬疯狂地在缓慢移动的巡逻船周围前后弹跳。


    “你怎么知道的？” Uncle Levi 轻笑。他试图，但不成功地安抚那只狗。


    他们都笑了。Uncle Levi 驾驶他的慢速船从他们身边驶过，以便与 RCMP 交谈。


    “各位怎么样？”


    “挺艰难的。”年长的警察似乎欢迎这段对话。年轻的警官抬头看着站在船上的上司，满脸困惑，摇了摇头，然后继续在淤泥中挣扎。


    “好吧，我们要带着狗回到那边去，” Uncle Levi 沿着岩石岸边指了指，“在那里我们可以把船拉到坚实的陆地上。然后我们会沿着岸线走。看看能不能闻到气味。”


    与 RCMP 和 Gus 又聊了一些闲话后，Uncle Levi 重新启动发动机，慢慢地驶离岸边。


    “你们三个，”他用口型指着 Mark、Sam 和 Chickadee，“去告诉长老们和祖父，我们可能需要志愿者。告诉他们等我打电话，但要让他们的人做好准备。”


    他把船靠在他们的船边。


    “你们两个跟我来。”他示意 Atim 和 Otter。两个男孩跳进他们叔叔的船里，对表亲们笑了笑。


    Muskrats 很兴奋能被他们的叔叔委以任务。


    “开走吧！” Uncle Levi 轻笑。他推下油门，强大的警用船冲入波浪中。


    Mark 向 Gus 挥手。“听见没，先生说的。我们撤了。”


    当 Mark 启动发动机慢慢驶离时，Chickadee 和 Sam 看着年长的 RCMP 警官努力保持干净，试图帮助年轻的警官进入他们的船。


    ## CHAPTER 7


    ### The House-taurant


    回到保留地，在与文化营地的长老们交谈后，Chickadee 和 Sam 发现爷爷的房子锁着，他的卡车也不见了。


    “你觉得他在哪儿？” Sam 问。


    Chickadee 耸了耸肩。“我们去 Station 吧，路上顺便去 House-taurant。”


    如果 Station 是该地区八卦的交汇点，那么 House-taurant 就是保留地二手信息的核心。


    这家餐馆的老板兼厨师 Mavis 已经搬到地下室，把她的房子改造成了一家咖啡馆。她的餐厅和客厅里摆满了不匹配的桌椅。角落里有一个大冰箱嗡嗡作响。音乐由一台便携式
    CD 播放器提供，其扬声器安装在墙的上角。一台落地式电视在屏幕上播放着城市世界的模糊画面。


    孩子们打开门时，铃铛叮当作响。House-taurant 空无一人。铃声把 Mavis 从楼下叫了上来。


    “你们两个在干嘛？”她问孩子们。她用香烟示意她在厨房附近的常坐位置。那张桌子上放着一个烟灰缸、一块 cribbage 板和一副破旧的扑克牌。常用的调味品整齐地排在靠墙的一端。


    “我们在找 Gramps。” Sam 说话时坐了下来。


    “要咖啡吗？”


    “嗯……只要点水，” Chickadee 说。Sam 点了点头。


    Mavis 在厨房水槽里倒了两杯水端回来。她把她庞大的身躯慢慢沉入椅子，把烟弹向烟灰缸。


    “今天到目前为止挺安静的。你们这些 Muskrats 在干嘛？” Mavis 打量着孩子们。她是个好听众，所以人们会跟她说话。她知道保留地上的一切。


    “他们找到了那位老人的船，” Sam 咧嘴笑着宣布。


    “他们找到他了吗？”


    “还没。” Chickadee 咕哝着空气，喝完一口水。


    “嗯……” Mavis 在椅子上挪动。“船在哪儿？”


    ## THE CASE OF WINDY LAKE


    “在三角洲外，” Chickadee 说道。

    孩子们知道如果想打听点什么，他们必须给她点有料的东西。


    “他们可能很快会找志愿者。” Sam 知道这是 Mavis 可以传播的官方信息。这是一张相当大的八卦皮毛。


    “这有点意思。” Mavis 装作不感兴趣。“人们会想帮忙的。”


    “嗯……他们应该等到 Uncle Levi 批准。他现在在蛇坑那边带着狗。希望他能找到那个挖骨人。”


    “如果他们确实需要志愿者，他们可能需要租船把他们送过去。”孩子们可以看到餐馆老板脑子里在转念。


    “老人们在我们告诉他们时似乎有点被吓到。” Sam 观察着 Mavis 的反应。“不确定他们为什么会担心一堆蛇。”


    “是啊，那里不就是蛇坑吗？” Chickadee 问，没有特定对象。


    Mavis 在椅子上扭动。孩子们知道她总是需要一段时间才能挖出好八卦。她那样扭动时，里面似乎有东西想出来。


    “这就是我们想找 Gramps 的原因。我们想问他那里有什么特别的。” Sam 知道 Mavis 喜欢第一个透露秘密。


    孩子们开始朝 Station 的方向走去。

    “所以，那后面确实有重要的东西。一定很特别，长老们才会对大家……好吧，大多数人隐瞒，” Sam 大声推测。

    “是啊，爷爷甚至没告诉我们！” Chickadee 听起来有点被背叛。


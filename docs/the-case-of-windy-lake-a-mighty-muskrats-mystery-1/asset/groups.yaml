    “Now we’ll see if these Indian cops will arrest their own.”


    More guards brought their captors back to the gate. The manager studied each activist.


    “How many were there?” His eyes bored into the senior guard.


    “We don’t know, sir. Nobody thought to count as they ran in.”


    “Is this all all of them?”


    “Our guys are still checking.”


    “Damn!”


    The big man paced back and forth as a police truck pulled up and crunched to a
    stop in front of the dump truck.


    As Uncle Levi opened his car door, the manager marched up and shouted in his face.


    “You’re responsible for your own people! Why can’t you control them?!”


    The Mighty Muskrats watched as their Uncle stepped slowly out of his vehicle,
    fixed his belt, and swept his gaze around the site, the bush, and the horizon.


    “Because they’re people,” he said.


    He sighed when the company bigwig began to scream in his face again.


    “We were told that the law would be followed! Well?! Where were you when these
    animals ripped down my gate?” Mr. Makowski was turning purple now.


    Uncle Levi looked at the activists standing in a tight group guarded by company
    security. He shut the police-truck door and looked at the Muskrats. “Was your
    cousin here?”


    The kids nodded as one and looked into the compound.


    “All right.” Their uncle gave them a smirk. “Get out of here. We don’t need any
    more of the family in trouble.”


    Uncle Levi hitched up his belt and walked onto the company lot.


    The manager followed close on his heels. “Their cousin? Who are those kids?! What
    do they have to do with this? Where the hell are you going?”


    Uncle regarded the company man with a slightly sympathetic look. “You don’t have

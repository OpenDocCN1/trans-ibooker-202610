- pgno: 329
  md: "+   2. Rename the `tree` parameter and remove it from the return statement\
    \ because we will not use it. The resulting factory function should look like\
    \ the following:\n\n```\nexport function crudService(_options: any): Rule {\n\
    \  return (_tree: Tree, _context: SchematicContext) =>\n    {};\n}\n```\n\n+ \
    \  3. Add the following snippet in the `crudService` function:\n\n```\nconst templateSource\
    \ = apply(url('./files'), [\n  applyTemplates({\n    ..._options,\n    classify:\
    \ strings.classify,\n    dasherize: strings.dasherize\n  }),\n  move(normalize(_options.path\
    \ ??\n    normalize('src/app/')))\n]);\n```\n\nThe previous snippet looks identical\
    \ to the one that we used for our component schematic. The main differences are\
    \ that the default path is the `src\\app` folder and that we pass all available\
    \ options using the `_options` parameter to the schematic.\n\n> **Important note**\n\
    > \n> It is not possible to know which options will be used to generate the Angular\
    \ service beforehand. Thus, we use the *spread* operator to pass all available\
    \ options to the `templateSource` method. That is also the reason that the `_options`\
    \ parameter is of type `any`.\n\n+   4. Add the following return statement at\
    \ the end of the function:\n\n```\nreturn chain([\n  externalSchematic('@schematics/angular',\
    \ 'service',\n    _options),\n  mergeWith(templateSource, MergeStrategy.Overwrite)\n\
    ]);\n```"
  merge: -1

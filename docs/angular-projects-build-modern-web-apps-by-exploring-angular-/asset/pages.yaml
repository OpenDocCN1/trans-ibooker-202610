- pgno: 123
  md: 'The preceding template consists of several components from the Angular Material
    library, including a `mat-form-field` component that contains the following child
    elements:


    +   - An input HTML element for entering the name of the city. When the user has
    finished editing and presses the *Enter* key, it calls the `search` component
    method passing the value property of the `cityCtrl` variable as a parameter. The
    `cityCtrl` variable is a **template reference variable** and indicates the actual
    object of the native HTML `input` element.

    +   - A `mat-icon` component displays a *magnifier* icon and is located at the
    end of the input element, as indicated by the `matSuffix` directive. It also calls
    the `search` component method when clicked.


    > > **Important note**

    > > The `cityCtrl` template reference variable is indicated by a # and is accessible
    everywhere inside the template of the component.


    A `mat-card` component presents information in a card layout and is displayed
    only when the `weather` component property has a value. It consists of the following
    child elements:


    +   - `mat-card-header`: The header of the card. It consists of a `mat-card-title`
    component that displays the name of the city and the country code and a `mat-card-subtitle`
    component that displays the current weather conditions.

    +   - `mat-card-image`: The image of the card that displays the icon of the weather
    conditions, along with a description as an alternate text.

    +   - `mat-card-content`: The main content of the card. It displays the temperature,
    pressure, humidity, and wind speed of the current weather. The temperature is
    displayed without any decimal points, as indicated by the `number` pipe.'

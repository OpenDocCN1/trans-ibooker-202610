- pgno: 143
  md: '# 5

    Building a WYSIWYG Editor for the Desktop using Electron


    Web applications are traditionally built with HTML, CSS, and JavaScript. Their
    use has also been widely spread to server development using Node.js. Various tools
    and frameworks have emerged in recent years that use HTML, CSS, and JavaScript
    to create applications for desktop and mobile. In this chapter, we are going to
    investigate how to create desktop applications using Angular and Electron.


    Electron is a JavaScript framework that is used to build native desktop applications
    with web technologies. If we combine it with the Angular framework, we can create
    fast and highly performant web applications. In this chapter, we will build a

  md: "# Turning on suggestions for new issues\n\nThe reactive forms API contains\
    \ a mechanism for getting notified when the value of a particular form control\
    \ changes. We will use it in our application to find related issues when reporting\
    \ a new one. More specifically, we will display a list of suggested issues when\
    \ the user starts typing in the title form control:\n\n+   1. Open the `issues.service.ts`\
    \ file and add the following method:\n\n```\n```typescript\ngetSuggestions(title:\
    \ string): Issue[] {\n  if (title.length > 3) {\n    return this.issues.filter(issue\
    \ =>\n      issue.title.indexOf(title) !== -1);\n  }\n  return [];\n}\n```\n```\n\
    \nThe getSuggestions method takes the title of an issue as a parameter and searches\
    \ for any issues that contain the same title. The search mechanism is triggered\
    \ when the title parameter is more than three characters long to limit results\
    \ down to a reasonable amount.\n\n+   2. Open the `issue-report.component.ts`\
    \ file and add the following import statement:\n\n```\n```typescript\nimport {\
    \ Issue } from '../issue';\n```\n```\n\n+   3. Create a new component property\
    \ to hold the suggested issues:\n\n```\n```typescript\nsuggestions: Issue[] =\
    \ [];\n```\n```\n\n+   4. The controls property of a FormGroup object contains\
    \ all form controls as a key-value pair. The key is the name of the control, and\
    \ the value is the actual form control object of the AbstractControl type. We\
    \ can get notified about changes in the value of a form control by accessing its\
    \ name, in this case the title, in the following way:\n\n```\n```typescript\n\
    ngOnInit(): void {\n  this.issueForm = this.builder.group({\n    title: ['', Validators.required],\n\
    \    description: [''],\n    priority: ['', Validators.required],\n```\n```"
  merge: -1
  img_proc: true
- pgno: 105
  md: "```\n```typescript\n    type: ['', Validators.required]\n  });\n  this.issueForm.controls.title.valueChanges.subscribe((\n\
    \    title: string) => {\n      this.suggestions =\n        this.issueservice.getSuggestions(title);\n\
    \    });\n  }\n```\n```\n\nEach control exposes a valueChanges observable that\
    \ we can subscribe to and get a continuous stream of values. The valueChanges\
    \ observable emits new values as soon as the user starts typing in the title control\
    \ of the form. We set the result of the getSuggestions method in the suggestions\
    \ component property when that happens.\n\n+   5. To display the suggested issues\
    \ on the template of the component, open the `issue-report.component.html` file\
    \ and add the following HTML code right after the `clr-input-container` element:\n\
    \n```\n```html\n<div class=\"clr-row\" *ngIf=\"suggestions.length\">\n  <div class=\"\
    clr-col-lg-2\"></div>\n  <div class=\"clr-col-lg-6\">\n    <clr-stack-view>\n\
    \      <clr-stack-header>Similar issues\n      </clr-stack-header>\n      <clr-stack-block\
    \ *ngFor=\"let issue of\n        suggestions\">\n        <clr-stack-label>#{{issue.issueNo}}:\n\
    \          {{issue.title}}</clr-stack-label>\n        <clr-stack-content>{{issue.description}}\n\
    \        </clr-stack-content>\n      </clr-stack-block>\n    </clr-stack-view>\n\
    \  </div>\n</div>\n```\n```"
  merge: -1

    \ #cityCtrl\n    (keydown.enter)=\"search(cityCtrl.value)\">\n  <mat-icon matSuffix\n\
    \    (click)=\"search(cityCtrl.value)\">search</mat-icon>\n</mat-form-field>\n\
    <mat-card *ngIf=\"weather\">\n  <mat-card-header>\n    <mat-card-title>{{weather.name}},\n\

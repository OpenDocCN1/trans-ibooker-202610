  md: '# Project overview


    In this project, we will build a desktop WYSIWYG editor that keeps its content
    local to the filesystem. Initially, we will build it as an Angular application
    using **ngx-wig**, a popular WYSIWYG Angular library. We will then convert it
    to a desktop application using Electron and learn how to sync content between
    Angular and Electron. We will also see how to persist the content of the editor
    into the filesystem. Finally, we will package our application as a single executable
    file that can be run in a desktop environment.


    Build time: 1 hour.


    # Getting started


    The following software tools are required to complete this project:


    +   - Angular CLI: A command-line interface for Angular that you can find at https://angular.io/cli.

    +   - Visual Studio Code: A code editor that you can download from https://code.visualstudio.com/Download.

    +   - GitHub material: The code for this chapter can be found in the Chapter05
    folder at https://github.com/PacktPublishing/Angular-Projects-Second-Edition.



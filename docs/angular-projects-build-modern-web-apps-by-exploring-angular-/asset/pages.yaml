- pgno: 133
  md: "```\ntemplateUrl: './app.component.html',\nstyleUrls: ['./app.component.scss']\n\
    })\nexport class AppComponent implements OnInit {\n  title = 'weather-app';\n\n\
    \  constructor(private updates: SwUpdate, private\n    snackbar: MatSnackBar)\
    \ {}\n}\n```\n\nThe MatSnackBar service is an Angular service exposed from MatSnackBarModule.\
    \ The SwUpdate service is part of the service worker and contains observables\
    \ that we can use to notify regarding the update process on our application.\n\
    \n+   4. Create the following ngOnInit method:\n\n```\nngOnInit() {\n  this.updates.available.pipe(\n\
    \    switchMap(() => this.snackbar.open('A new version\n      is available!',\
    \ 'Update now').afterDismissed(),\n    filter(result => result.dismissedByAction),\n\
    \    map(() => this.updates.activateUpdate().then(() =>\n      location.reload()))\n\
    \  ).subscribe();\n}\n```\n\nThe ngOnInit method is an implementation method of\
    \ the OnInit interface and is called upon initialization of the component. The\
    \ SwUpdate service contains an available observable property that we can use to\
    \ get notified when a new version of our application is available. Typically,\
    \ we tend to subscribe to observables, but in this case, we don't. Instead, we\
    \ subscribe to the pipe method, an RxJS operator for composing multiple operators.\n\
    \n+   5. Add the following import statements at the top of the app.component.ts\
    \ file:\n\n```\nimport { filter, map, switchMap } from 'rxjs/operators';\n```"
  merge: -1
  img_proc: true
- pgno: 134
  md: "A lot is going on inside the pipe method that we defined previously, so let's\
    \ break it down into pieces to understand it further. The pipe operator combines\
    \ three RxJS operators:\n\n+   - switchMap: This is called when a new version\
    \ of our application is available. It uses the open method of the snackbar property\
    \ to show a snack bar with an action button and subscribes to its afterDismissed\
    \ observable. The afterDismissed observable emits when the snack bar is closed\
    \ either by clicking on the action button or programmatically using its API methods.\n\
    +   - filter: This is called when the snack bar is dismissed using the action\
    \ button.\n+   - map: This calls the activateUpdate method of the updates property\
    \ to apply the new version of the application. Once the application has been updated,\
    \ it reloads the window of the browser for the changes to take effect.\n\nLet's\
    \ see the whole process of updating to a new version in action:\n\n+   1. Run\

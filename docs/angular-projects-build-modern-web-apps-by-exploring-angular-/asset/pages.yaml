    }\n```\n```\n\nWe automatically assign a new `issueNo` to the issue before adding\
    \ it to the `issues` array.\n\n> **Tip**\n> \n> The `issueNo` property is currently\
    \ calculated according to the length of the `issues` array. A better approach\

    \ value. In this case, we initialize all controls to empty strings because the\
    \ form will be used to create a new issue from scratch.\n\n+   4. We now need\
    \ to associate the FormGroup object that we created with the respective HTML elements.\
    \ Open the `issue-report.component.html` file and replace its content with the\
    \ following HTML code:\n\n```\n```html\n<h3>Report an issue</h3>\n<form clrForm\
    \ *ngIf=\"issueForm\" [formGroup]=\"issueForm\">\n  <clr-input-container>\n  \
    \  <label>Title</label>\n```\n```"

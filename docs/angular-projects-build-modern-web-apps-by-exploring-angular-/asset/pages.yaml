- pgno: 240
  md: "Our application initiates all HTTP requests to the GitHub API as if it was\
    \ rendered from a browser. It essentially duplicates all HTTP requests needed\
    \ from the application even if data has already been prerendered on the HTML page.\
    \ Why is that?\n\nThe application makes one HTTP request for the browser rendered\
    \ version and another for the SSR application because both versions have a different\
    \ state. We can prevent the previous behavior by sharing the state between the\
    \ server and the browser. More specifically, we can transfer the state of the\
    \ server to the browser using a special-purpose Angular module of the Angular\
    \ Universal library called TransferHttpCacheModule.\n\nIf we use TransferHttpCacheModule,\
    \ the server will cache responses from the GitHub API and the browser will use\
    \ the cache instead of initiating a new request. TransferHttpCacheModule solves\
    \ the problem by installing an HTTP interceptor in the Angular application that\
    \ ignores HTTP requests that have been handled by the server initially.\n\n> **Important\
    \ note**\n> An HTTP interceptor is an Angular service that intercepts HTTP requests\
    \ and responses that originate from the built-in HTTP client of the Angular framework.\n\
    \nTo install TransferHttpCacheModule in our GitHub portfolio application, follow\
    \ these steps:\n\n+   1. Open the main module file of the Angular application,\
    \ app.module.ts, and import TransferHttpCacheModule from the @nguniversal/common\
    \ npm package:\n\n```\nimport { TransferHttpCacheModule } from '@nguniversal/common';\n\
    ```\n\n+   2. Add the TransferHttpCacheModule class to the imports array of the\
    \ @NgModule decorator:\n\n```\n@NgModule({\n  declarations: [\n    AppComponent,\n\
    \    PersonalInfoComponent,\n    PanelComponent,\n    RepositoriesComponent,\n\
    \    OrganizationsComponent\n```"
  merge: -1
  img_proc: true
- pgno: 241
  md: "```\n],\nimports: [\n  BrowserModule.withServerTransition({ appId:\n  'serverApp'\
    \ }),\n  HttpClientModule,\n  TransferHttpCacheModule\n],\nproviders: [],\nbootstrap:\
    \ [AppComponent]\n})\n```\n\n+   3. Open the main module file of the SSR application,\
    \ app.server.module.ts, and import ServerTransferStateModule from the @angular/platform-server\
    \ npm package:\n\n```\nimport { ServerModule, ServerTransferStateModule }\nfrom\
    \ '@angular/platform-server';\n```\n\n+   4. Add the ServerTransferStateModule\
    \ class to the imports array of the @NgModule decorator:\n\n```\n@NgModule({\n\
    \  imports: [\n    AppModule,\n    ServerModule,\n    ServerTransferStateModule\n\
    \  ],\n  bootstrap: [AppComponent],\n})\n```\n\n+   5. Execute the following command\
    \ to prerender your application:\n\n```\nnpm run prerender\n```\n\n+   6. Run\
    \ the following command to start your prerendered application:\n\n```\nnpm run\
    \ serve:ssr\n```"

- pgno: 131
  md: "The (**ServiceWorker**) value in the **Size** column indicates that the service\
    \ worker served a cached version of our application.\n\nWe have now successfully\
    \ installed the service worker and went one step closer to converting our application\
    \ into a PWA. In the following section, we will learn how to notify users of the\
    \ application about potential updates.\n\n# Staying up to date with in-app notifications\n\
    \nWhen we want to apply a change in a web application, we make the change and\
    \ build a new version of our application. The application is then deployed to\
    \ a web server, and every user has access to the new version immediately. But\
    \ this is not the case with PWA applications.\n\nWhen we deploy a new version\
    \ of our PWA application, the service worker must act accordingly and apply a\
    \ specific update strategy. It should either notify the user of the new version\
    \ or install it immediately. Whichever update strategy we follow depends on our\
    \ needs. In this project, we want to show a prompt to the user and decide whether\
    \ they want to update. Let's see how to implement this feature in our application:\n\
    \n+   1. Open the `app.module.ts` file and add `MatSnackBarModule` to the `imports`\
    \ array of the `@NgModule` decorator:\n\n```\nimport { MatSnackBarModule } from\
    \ '@angular/material/snack-bar';\n\n@NgModule({\n  declarations: [\n    AppComponent,\n\
    \    WeatherComponent\n  ],\n  imports: [\n    BrowserModule,\n    BrowserAnimationsModule,\n\
    \    HttpClientModule,\n    MatIconModule,\n    MatInputModule,\n    MatCardModule,\n\
    \    MatSnackBarModule,\n    ServiceWorkerModule.register('ngsw-worker.js', {\n\
    \      enabled: environment.production,\n\n```"
  merge: -1
  img_proc: true
- pgno: 132
  md: "```\n// Register the ServiceWorker as soon as the app\n// is stable\n// or\
    \ after 30 seconds (whichever comes first).\nregistrationStrategy: 'registerWhenStable:30000'\n\
    })\n],\nproviders: [],\nbootstrap: [AppComponent]\n})\n```\n\nMatSnackBarModule\
    \ is an Angular Material module that allows us to interact with snack bars. A\
    \ snack bar is a pop-up window that usually appears on the bottom of the page\
    \ and is used for notification purposes.\n\n+   2. Open the app.component.ts file\
    \ and add the OnInit interface to the implemented interfaces of the AppComponent\
    \ class:\n\n```\nimport { Component, OnInit } from '@angular/core';\n\n@Component({\n\
    \  selector: 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls:\
    \ ['./app.component.scss']\n})\nexport class AppComponent implements OnInit {\n\
    \  title = 'weather-app';\n}\n```\n\n+   3. Inject the MatSnackBar and SwUpdate\
    \ services in the constructor of the AppComponent class:\n\n```\nimport { Component,\
    \ OnInit } from '@angular/core';\nimport { MatSnackBar } from '@angular/material/snack-bar';\n\
    import { SwUpdate } from '@angular/service-worker';\n\n@Component({\n  selector:\
    \ 'app-root',\n```"
  merge: -1

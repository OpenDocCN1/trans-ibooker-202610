- pgno: 172
  md: "We will cover the following topics in detail:\n\n+   - Creating a mobile application\
    \ with **Ionic**\n+   - Taking photos with **Capacitor**\n+   - Storing data in\
    \ **Firebase**\n+   - Previewing photos with **CesiumJS**\n\n# Essential background\
    \ theory and context\n\nCapacitor is a native mobile runtime that enables us to\
    \ build native **Android** and **iOS** applications with web technologies, including\
    \ Angular. It provides an abstraction API layer for web applications to interact\
    \ with the native resources of a mobile OS. It does not include a UI layer or\
    \ any other way of interacting with the user interface.\n\nIonic is a mobile framework\
    \ that contains a collection of UI components that we can use in an application\
    \ built with Capacitor. The main advantage of Ionic is that we maintain a single\
    \ code base across all native mobile platforms. That is, we write the code once,\
    \ and it works everywhere. Ionic supports all popular JavaScript frameworks, including\
    \ Angular.\n\n> **Important note**\n> \n> When we create a new Ionic application\
    \ from scratch, we also get Capacitor installed and configured out of the box.\n\
    \nFirebase is a **Backend-as-a-Service (BaaS)** platform provided by Google that\
    \ contains a set of tools and services for building applications. **Cloud Firestore**\
    \ is a database solution provided by Firebase that features a flexible and scalable\
    \ NoSQL document-oriented database that can be used in web and mobile applications.\
    \ **Storage** is a Firebase service that allows us to interact with a storage\
    \ mechanism and upload or download files.\n\nCesiumJS is a JavaScript library\
    \ for creating interactive 3D maps in the browser. It is an open source, cross-platform\
    \ library that uses **WebGL** and allows us to share geospatial data on multiple\
    \ platforms. It is empowered by **Cesium**, a platform for building high-quality\
    \ and performant 3D geospatial applications."
  merge: -1
  img_proc: true
- pgno: 173
  md: '# # Project overview


    In this project, we will build a mobile application that can take photos according
    to the current location and preview them on a map. Initially, we will learn how
    to create a mobile application using Angular and Ionic. We will then use Capacitor
    to take photos using the camera of the mobile device and tag them with the current
    location via the GPS. We will upload those photos in Firebase along with their
    location data. Finally, we will use CesiumJS to load location data on a 3D globe
    along with a preview of the photo.


    > > **Important note**

    > > In this chapter, you will learn how to build a mobile application with Angular
    and Ionic. To follow up with the project and preview your application, you will
    need to follow the getting started guide for your development environment (Android
    or iOS), which you can find in the *Further reading* section.


    Build time: 2 hours


    # # Getting started


    You will need the following software and tools to complete the project:


    +   - For Android: **Android Studio** with a minimum of Android SDK 21 or higher
    and **Android WebView** with Chrome 50 or later.

    +   - For iOS: **Xcode** 11 or above and **Xcode Command Line Tools**.

    +   - A physical mobile device.

    +   - GitHub material: The related code for this chapter can be found in the Chapter06
    folder at https://github.com/PacktPublishing/Angular-Projects-Second-Edition.


    # # Creating a mobile application with Ionic


    The first step toward building our application is creating a new mobile application
    using the Ionic toolkit. We will start building our application with the following
    tasks:


    +   - Scaffolding the application

    +   - Building the main menu


    Ionic has a pretty straightforward process for creating a new mobile application
    from scratch, which can be done from the Ionic website without entering a single
    line of code.'
  merge: -1
  img_proc: true

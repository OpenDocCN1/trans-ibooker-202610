- pgno: 106
  md: "We use the `clr-stack-view` component from the Clarity library to display suggested\
    \ issues in a key-value pair representation. The key is indicated by the `clr-stack-header`\
    \ component and displays the title and the number of the issue. The value is indicated\
    \ by the `clr-stack-content` component and displays the description of the issue.\n\
    \n> **Important Note**\n> \n> We display similar issues only when there are any\
    \ available suggested ones.\n\nRun `ng serve` and open the report issue form to\
    \ create a new issue. When you start typing in the **Title** input, the application\
    \ will suggest any related issues with the one that you are trying to create:\n\
    \n![](img/efea53d01337e7b223389b38dcdb0160_106_0.png)\n\n*Figure 3.8 – Similar\
    \ issues*\n\nThe user will now see if there are any similar issues and avoid reporting\
    \ a duplicate issue.\n\n# Summary\n\nIn this chapter, we built an Angular application\
    \ for managing and tracking issues using reactive forms and Clarity Design System.\n\
    \nFirst, we installed Clarity to an Angular application and used a data grid component\
    \ to display a list of pending issues. Then, we introduced reactive forms and\
    \ used them to build a form for reporting a new issue. We added validations in\
    \ the form to give our users a visual indication of the required fields and guard\
    \ against unwanted behavior.\n\nAn issue tracking system is not efficient if our\
    \ users are not able to resolve them. We built a modal dialog using Clarity to\
    \ resolve a selected issue. Finally, we improved the UX of our application by\
    \ suggesting related issues when reporting a new one.\n\nIn the next chapter,\
    \ we will build a progressive web application for the weather using the Angular\
    \ service worker."

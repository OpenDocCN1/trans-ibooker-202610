- pgno: 121
  md: "4. Open the `weather.component.ts` file, create a weather property of the Weather\
    \ type, and inject WeatherService into the constructor of the WeatherComponent\
    \ class:\n\n```\n```typescript\nimport { Component, OnInit } from '@angular/core';\n\

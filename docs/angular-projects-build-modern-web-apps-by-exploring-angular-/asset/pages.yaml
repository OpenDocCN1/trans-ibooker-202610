  md: "+   2. Open the `confirm-dialog.component.ts` file and create the following\
    \ input and output properties in the `ConfirmDialogComponent` class:\n\n```\n\
    import { Component, EventEmitter, Input, Output } from '@angular/core';\n\n@Component({\n\

  md: "The camera button on the page needs to open the camera to take a photo. In\
    \ the following section, we will learn how to use Capacitor to interact with the\
    \ camera.\n\n# Interacting with Capacitor\n\nTaking photos in our application\
    \ involves using two APIs from the Capacitor library. The **Camera** API will\
    \ open the camera to take a photo, and the **Geolocation** API will read the current\

    have taken with the camera on a 3D map. The CesiumJS library provides a viewer
    with a 3D globe that we can use to visualize various things, such as images in
    specific locations. This new feature of our application will consist of the following:


    +   - Configuring CesiumJS

    +   - Displaying photos on viewer


    We will begin by learning how to set up the CesiumJS library.


    # Configuring CesiumJS


    The CesiumJS library is an npm package that we can install to start working with
    3D maps and visualizations:


    +   1. Run the following npm command to install CesiumJS:


    ```

    ```bash

    npm install cesium

    ```

    ```'

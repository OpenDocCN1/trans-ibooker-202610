  md: '# Summary


    In this project, we build a portfolio application for our GitHub profile. Initially,
    we learned how to interact with the GitHub API in a new Angular application. We
    also used Bootstrap CSS and Bootstrap Icons to provide a beautiful user interface
    for our portfolio application.


    We then saw how to convert our Angular application into an SSR application using
    Angular Universal. We learned how to benefit from prerendering content when users
    have low-end and slow-performant devices and some of the potential pitfalls of
    this technique.


    We used some of the available SEO techniques that the Angular framework offers
    to improve the discoverability of our application. Finally, we installed the preboot
    library to improve the user experience of our application during loading.


    In the next chapter, we will learn about the monorepo architecture and how we
    can manage the state of an Angular application.



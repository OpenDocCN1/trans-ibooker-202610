  md: "5. Let's create our viewer now. Open the view.page.ts file and modify it as\
    \ follows:\n\n```\nimport { AfterViewInit, Component, OnInit, ElementRef, ViewChild\
    \ } from '@angular/core';\nimport { Viewer } from 'cesium';\n\n@Component({\n\
    \  selector: 'app-view',\n  templateUrl: './view.page.html',\n  styleUrls: ['./view.page.scss'],\n\
    })\nexport class ViewPage implements OnInit, AfterViewInit {\n\n  @ViewChild('mapContainer')\
    \ content: ElementRef;\n\n  constructor() { }\n\n  ngOnInit() {\n  }\n\n  ngAfterViewInit()\
    \ {\n    const viewer = new\n      Viewer(this.content.nativeElement);\n  }\n\
    }\n```\n\nWe create a new Viewer object inside the ngAfterViewInit method of the\
    \ component. The ngAfterViewInit method is called when the view of the component\
    \ has finished loading, and it is defined in the AfterViewInit interface. The\
    \ constructor of the Viewer class accepts as a parameter the native HTML element\
    \ on which we want to create the viewer. In our case, we want to attach it to\
    \ the map container element that we created earlier. Thus, we use the @ViewChild\
    \ decorator to reference that element by passing the template reference variable\

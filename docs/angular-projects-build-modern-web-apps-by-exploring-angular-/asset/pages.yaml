    We pass the issueNo of the selectedIssue property to the input binding of the
    dialog component. We use the ? safe navigation operator to avoid errors in our
    application because initially there is no issue selected and the issueNo property
    is not available.


    We also bind the onConfirm component method to the confirm event so that we can
    be notified when the user either agrees or not. The $event parameter is a reserved
    keyword in Angular and contains the event binding result, which is dependent on
    the type of the HTML element. In this case, it contains the Boolean result of
    the confirmation.



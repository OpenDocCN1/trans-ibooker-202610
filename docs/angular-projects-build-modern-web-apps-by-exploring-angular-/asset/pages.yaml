  md: "4. Create a new method to dispatch the selectPoi action to the store along\
    \ with the selected PoiEntity:\n\n```\nselectPoi(poi: PoiEntity) {\n    this.store.dispatch(PoiActions.selectPoi({poiId:\n\
    \        poi.id}));\n}\n```\n\n5. Open the poi-list.component.html file and bind\

- pgno: 318
  md: '# Essential background theory and context


    Angular schematics are libraries that can be installed using npm. They are used
    in various situations, including creating components that share a standard user
    interface or even enforcing conventions and coding guidelines inside an organization.
    A schematic can be used standalone or as a companion for an existing Angular library.


    Angular schematics are packaged into collections, and they reside in the @schematics/angular
    npm package. When we use the Angular CLI to run the ng add or the ng build command,
    it runs the appropriate schematic from that package. The Angular CLI currently
    supports the following types of schematics:


    +   - **Add schematic**: This is used to install an Angular library in an Angular
    CLI workspace using the ng add command.

    +   - **Update schematic**: This is used to update an Angular library using the
    ng update command.

    +   - **Generate schematic**: This is used to generate Angular artifacts in an
    Angular CLI workspace using the ng generate command.


    In this project, we will focus on generate schematics, but the same rules apply
    to all the other commands.


    # Project overview


    In this project, we will learn how to use the schematics API to build custom Angular
    CLI generate schematics for creating components and services. First, we will build
    a schematic for creating an Angular component that uses the Tailwind CSS framework
    in its template. Then, we will create a schematic to generate an Angular service
    that injects the built-in HTTP client by default and creates one method for each
    HTTP request in a CRUD operation.


    Build time: 1 hour


    # Getting started


    The following prerequisites and software tools are required to complete this project:


    +   - Angular CLI: A command-line interface for Angular that you can find at https://angular.io/cli.

    +   - GitHub material: The code for this chapter can be found in the Chapter10
    folder at https://github.com/PacktPublishing/Angular-Projects-Second-Edition.'
  merge: -1
  img_proc: true
- pgno: 319
  md: "# Installing the schematics CLI\n\nThe schematics CLI is a command-line interface\
    \ that we can use to interact with the schematics API. To install it, run the\
    \ following npm command:\n\n```\n```bash\nnpm install -g @angular-devkit/schematics-cli\n\
    ```\n```\n\nThe preceding command will install the @angular-devkit/schematics-cli\
    \ npm package globally on our system. We can then use the schematics executable\
    \ to create a new schematics collection:\n\n```\n```bash\nschematics blank my-schematics\n\
    ```\n```\n\nThe previous command will generate a schematics project called my-schematics.\
    \ It contains a schematic with the same name by default inside the src folder.\
    \ A schematic contains the following files:\n\n+   - `collection.json`: A JSON\
    \ schema that describes the schematics that belong to the my-schematics collection\n\
    +   - `my-schematics\\index.ts`: The main entry point of the my-schematics schematic\n\
    +   - `my-schematics\\index_spec.ts`: The unit test file of the main entry point\
    \ of the my-schematics schematic\n\nThe JSON schema file of the collection contains\
    \ one entry for each schematic associated with that collection:\n\n# collection.json\n\
    \n```\n```json\n{\n  \"$schema\": \"../node_modules/@angular-devkit/schematics/collection-schema.json\"\
    ,\n  \"schematics\": {\n    \"my-schematics\": {\n      \"description\": \"A blank\
    \ schematic.\",\n      \"factory\": \"./my-schematics/index#mySchematics\"\n \
    \   }\n  }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 320
  md: "Each schematic in the collection contains a short description, as indicated\
    \ by the `description` property, and a `factory` property that points to the main\
    \ entry point of the schematic using a special syntax. It contains the filename\
    \ `./my-schematics/index`, followed by the `#` character, and the name of the\
    \ function exported by that file, named `mySchematics`.\n\nThe main entry point\
    \ of a schematic contains a rule factory method that is exported by default and\
    \ returns a `Rule` object:\n\n# index.ts\n\n```\n```typescript\nimport { Rule,\
    \ SchematicContext, Tree } from '@angular-devkit/schematics';\n\n\n\n// You don't\
    \ have to export the function as default.\n// You can also have more than one\
    \ rule factory\n// per file.\nexport function mySchematics(options: any): Rule\
    \ {\n  return (tree: Tree, _context: SchematicContext) => {\n    return tree;\n\
    \  };\n}\n```\n```\n\nA schematic does not interact directly with the filesystem.\
    \ Instead, it creates a virtual filesystem that is represented by a `Tree` object.\
    \ The virtual filesystem contains a staging area where all transformations from\
    \ schematics happen. This area aims to make sure that any transformations that\
    \ are not valid will not propagate to the actual filesystem. As soon as the schematic\
    \ is valid to execute, the virtual filesystem will apply the changes to the real\
    \ one. All transformations of a schematic operate in a `SchematicContext` object.\n\
    \nIn the following section, we will learn how to use the schematics CLI and create\
    \ a component generation schematic.\n\n# Creating a Tailwind component\n\nTailwind\
    \ is a very popular CSS framework that enforces a utility-first core principle.\
    \ It contains classes and styles that can be used in Angular applications to create\
    \ easily composable user interfaces."
  merge: -1
  img_proc: true
- pgno: 321
  md: "We will use the schematics API of the Angular CLI to build a generation schematic\
    \ for Angular components. The schematic will generate a new Angular component\
    \ that is styled with a Tailwind container layout.\n\n> **Important note**\n>\
    \ \n> The schematic that we will build does not need to have Tailwind CSS installed\
    \ by default. However, the application in which we will use the schematic does\
    \ require it.\n\nLet's see how we can accomplish that:\n\n+   1. Execute the following\
    \ schematics CLI command to add a new schematic to our collection:\n+   \n+  \
    \ ```bash\n+   schematics blank tailwind-container\n+   ```\n+   \n+   The preceding\
    \ command will update the `collection.json` file to contain a new entry for the\
    \ `tailwind-container` schematic. It will also create a `tailwind-container` folder\
    \ in the `src` folder of our workspace.\n+   \n+   2. Create a `schema.json` file\
    \ inside the `tailwind-container` folder and add the following content:\n\n```\n\
    ```json\n{\n  \"$schema\": \"http://json-schema.org/schema\",\n  \"id\": \"TailwindContainerSchema\"\
    ,\n  \"title\": \"My Tailwind Container Schema\",\n  \"type\": \"object\",\n \
    \ \"properties\": {\n    \"name\": {\n      \"description\": \"The name of the\
    \ component.\",\n      \"type\": \"string\"\n    },\n    \"path\": {\n      \"\
    type\": \"string\",\n      \"format\": \"path\",\n      \"description\": \"The\
    \ path to create the component.\",\n      \"visible\": false\n    }\n  }\n}\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 322
  md: "```\n},\n\"required\": [\"name\"]\n}\n```\n\nEach schematic can have a JSON\
    \ schema file that defines the options that are available when running the schematic.\
    \ Since we want to create a component generation schematic, we need a name and\
    \ a path property for our component. Each of these properties has metadata associated\
    \ with it, such as the type and the description. The name of the component is\
    \ required when invoking the schematic as indicated by the required array property.\n\
    \n+   3. Open the collection.json file and set the properties of the tailwind-container\
    \ schematic as follows:\n\n```\n{\n  \"$schema\": \"../node_modules/@angular-devkit/schematics/collection-schema.json\"\
    ,\n  \"schematics\": {\n    \"my-schematics\": {\n      \"description\": \"A blank\
    \ schematic.\",\n      \"factory\": \"./my-schematics/index#mySchematics\"\n \
    \   },\n    \"tailwind-container\": {\n      \"description\": \"Generate a Tailwind\
    \ container component\",\n      \"factory\": \"./tailwind-container/index#tailwindContainer\"\
    ,\n      \"schema\": \"./tailwind-container/schema.json\"\n    }\n  }\n}\n```\n\
    \nIn the preceding file, we set a proper description for our schematic. We also\
    \ add the schema property that points to the absolute path of the schema.json\
    \ file we created in step 3."
  merge: -1
  img_proc: true
- pgno: 323
  md: "4. Create a schema.ts file inside the tailwind-container folder and add the\
    \ following content:\n\n```\nexport interface Schema {\n    name: string;\n  \
    \  path: string;\n}\n```\n\nThe preceding file defines the Schema interface that\
    \ contains mapping properties to those defined in the schema.json file.\n\nWe\
    \ have now created all the underlying infrastructure that we will use to create\
    \ our schematic. Let's see how to write the actual code that will run our schematic:\n\
    \n+   1. Create a folder named files inside the tailwind-container folder.\n+\
    \   2. Create a file called __name@dasherize__.component.html.template inside\
    \ the files folder and add the following contents:\n\n```\n<div class=\"container\
    \ mx-auto\">\n</div>\n```\n\nThe preceding file denotes the template of the component\
    \ that our schematic will generate. The __name prefix will be replaced by the\
    \ name of the component that we will pass as an option in the schematic. The @dasherize__\
    \ syntax indicates that the name will be separated with dashes and converted to\
    \ lowercase if passed in camel case.\n\n3. Create a file called __name@dasherize__.component.ts.template\
    \ and add the following contents:\n\n```\nimport { Component } from '@angular/core';\n\
    \n@Component({\n    selector: 'my-<%= dasherize(name) %>',\n    templateUrl: './<%=\
    \ dasherize(name) %>.component.html'\n})\nexport class My<%= classify(name) %>Component\
    \ {}\n```"

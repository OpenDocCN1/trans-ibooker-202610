    \ void {\n    this.issueForm = this.builder.group({\n      title: [''],\n    \
    \  description: [''],\n      priority: [''],\n      type: ['']\n    });\n  }\n\
    \n}\n```\n```\n\nFormGroup is used to group individual controls into a logical\
    \ representation of a form. The group method of the FormBuilder class is used\

  md: "# Packaging a desktop application\n\nWeb applications are usually bundled and\
    \ deployed to a web server that hosts them. On the other hand, desktop applications\
    \ are bundled and packaged as a single executable file that can be easily distributed.\
    \ Packaging our WYSIWYG application requires the following steps:\n\n+   - Configuring\
    \ webpack for production mode\n+   - Using an Electron bundler\n\nWe will look\
    \ at both of them in more detail in the following sections.\n\n# Configuring webpack\
    \ for production\n\nWe have already created a webpack configuration file for the\
    \ development environment. We now need to create a new one for production. Both\
    \ configuration files will share some functionality, so let's start by creating\
    \ a common one:\n\n+   1. Create a webpack.dev.config.js file in the root folder\
    \ of the Angular CLI workspace with the following content:\n\n```\nconst path\
    \ = require('path');\nconst baseConfig = require('./webpack.config');\n\nmodule.exports\
    \ = {\n  ...baseConfig,\n  mode: 'development',\n  devtool: 'source-map',\n  output:\
    \ {\n    path: path.join(process.cwd(), 'dist', 'my-editor'),\n    filename: 'shell.js'\n\
    \  }\n};\n```\n\n+   2. Remove the mode, devtool, and output properties from the\
    \ webpack.config.js file."
  merge: -1
  img_proc: true
- pgno: 165
  md: "+   3. Open the `package.json` file and pass the new webpack development configuration\
    \ file at the `start:desktop` script:\n\n```\n```json\n\"start:desktop\": \"concurrently\
    \ \\\\\\\"ng build --delete-output-path=false --watch\\\\\\\" \\\\\\\"webpack\
    \ --config webpack.dev.config.js --watch\\\\\\\"\"\n```\n```\n\n+   4. Create\
    \ a `webpack.prod.config.js` file in the root folder of the Angular CLI workspace\
    \ with the following content:\n\n```\n```javascript\nconst path = require('path');\n\
    const baseConfig = require('./webpack.config');\n\nmodule.exports = {\n  ...baseConfig,\n\
    \  output: {\n    path: path.join(process.cwd(), 'dist', 'my-editor'),\n    filename:\
    \ 'main.js'\n  }\n};\n```\n```\n\nThe main difference with the webpack configuration\
    \ file for the development environment is that we changed the filename of the\
    \ output bundle to `main.js`. The Angular CLI adds a hashed number in the `main.js`\
    \ file of the Angular application in production, so there will be no conflicts.\
    \ Other things to notice are that mode is set to `production` by default when\
    \ we omit it, and the `devtool` property is missing because we do not want to\
    \ enable source maps in production mode.\n\n+   5. Add a new entry in the `scripts`\
    \ property of the `package.json` file for building our application in production\
    \ mode:\n\n```\n```json\n\"scripts\": {\n  \"ng\": \"ng\",\n  \"start\": \"ng\
    \ serve\",\n  \"build\": \"ng build\",\n  \"watch\": \"ng build --watch --configuration\
    \ development\",\n  \"test\": \"ng test\",\n  \"start:desktop\": \"concurrently\
    \ \\\\\\\"ng build --delete-\n```\n```"
  merge: -1
  img_proc: true

  md: "# # Deploying our app with Firebase hosting\n\nFirebase is a hosting solution\
    \ provided by Google that we can use to deploy our Angular applications. The Firebase\
    \ team has put a lot of effort into creating an Angular CLI schematic for deploying\
    \ an Angular application using one single command. Before diving deeper, let’s\

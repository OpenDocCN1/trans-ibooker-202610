- pgno: 113
  md: '# # Displaying weather data


    In this section, we will create an Angular application to display weather information
    for a city. The user will enter the name of the city in an input field, and the
    application will use the OpenWeather API to get weather data for the specified
    city. We will cover the following topics in more detail:


    +   - Setting up the Angular application

    +   - Communicating with the OpenWeather API

    +   - Displaying weather information for a city


    Let''s start by creating the Angular application first in the following section.


    # # Setting up the Angular application


    We will use the `ng new` command of the Angular CLI to create a new Angular application
    from scratch:


    ```

    ```

    ng new weather-app --style=scss --routing=false

    ```

    ```


    The preceding command will create a new Angular CLI application with the following
    properties:


    +   - `weather-app`: The name of the Angular application

    +   - `--style=scss`: Indicates that our Angular application will use the SCSS
    stylesheet format

    +   - `--routing=false`: Disables Angular routing in the application


    The user should be able to enter the name of the city in an input field, and the
    weather information of the city should be visualized in a card layout. The **Angular
    Material** library provides a set of Angular UI components, including an input
    and a card, to use for our needs.


    Angular Material components adhere to the Material Design principles and are maintained
    by the Components team of Angular. We can install the Angular Material using the
    following command of the Angular CLI:


    ```

    ```

    ng add @angular/material --theme=indigo-pink --typography=true

    --animations=true

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 114
  md: "The preceding code uses the `ng add` command of the Angular CLI, passing additional\
    \ configuration options:\n\n+   - `@angular/material`: The npm package name of\
    \ the Angular Material library. It will also install the `@angular/cdk` package,\
    \ a set of behaviors and interactions used to build Angular Material. Both packages\
    \ will be added to the dependencies section of the `package.json` file of the\
    \ application.\n\n+   - `--theme=indigo-pink`: The name of the Angular Material\
    \ theme that we want to use. Adding a theme involves modifying several files of\
    \ the Angular CLI workspace. It adds entries of the CSS theme file to the `angular.json`\
    \ configuration file:\n\n```\n```\n./node_modules/@angular/material/prebuilt-themes/indigo-\n\
    pink.css\n```\n```\n\nIt also includes the Material Design icons in the `index.html`\
    \ file:\n\n```\n```\n<link href=\"https://fonts.googleapis.com/\nicon?family=Material+Icons\"\
    \ rel=\"stylesheet\">\n```\n```\n\nAngular Material comes with a set of predefined\
    \ themes that we can use. Alternatively, we can build a custom one that fits our\
    \ specific needs.\n\n+   - `--typography=true`: Enables Angular Material typography\
    \ globally in our application. Typography defines how text content is displayed\
    \ and uses the **Roboto** Google font by default, which is included in the `index.html`\
    \ file:\n\n```\n```\n<link href=\"https://fonts.googleapis.com/\ncss2?family=Roboto:wght@300;400;500&display=swap\"\
    \nrel=\"stylesheet\">\n```\n```\n\nIt adds the following class to the body of\
    \ the HTML file:\n\n```\n```\n<body class=\"mat-typography\">\n  <app-root></app-root>\n\
    </body>\n```\n```\n\nIt also adds some CSS styles to the global `styles.scss`\
    \ file of our application:\n\n```\n```\nhtml, body { height: 100%; }\nbody { margin:\
    \ 0; font-family: Roboto, \"Helvetica Neue\", sans-serif; }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: "+   - `--animations=true`: Enables browser animations in our application by\
    \ importing `BrowserAnimationsModule` into the main application module, `app.module.ts`:\n\
    \n```\nimport { NgModule } from '@angular/core';\nimport { BrowserModule } from\
    \ '@angular/platform-browser';\n\nimport { AppComponent } from './app.component';\n\
    import { BrowserAnimationsModule } from '@angular/platform-browser/animations';\n\
    \n@NgModule({\n  declarations: [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n\
    \    BrowserAnimationsModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n\
    })\nexport class AppModule { }\n```\n\nWe have nearly completed the setup and\
    \ configuration of our Angular application. The last step is to add the API key\
    \ that we created in the *Setting up the OpenWeather API* section.\n\nThe Angular\
    \ CLI workspace contains the `src\\environments` folder that we can use for defining\
    \ application settings such as API keys and endpoints. It contains one TypeScript\
    \ file for each environment that we want to support in our application. The Angular\
    \ CLI creates two files by default:\n\n+   - `environment.ts`: The TypeScript\
    \ file for the development environment. It is used when we start an Angular application\
    \ using `ng serve`.\n+   - `environment.prod.ts`: The TypeScript file for the\
    \ production environment. It is used when we build the application using `ng build`."
  merge: -1
  img_proc: true
- pgno: 116
  md: "Each environment file exports an `environment` object. Add the following properties\
    \ to the object in both development and production files:\n\n```\n```\napiUrl:\
    \ 'https://api.openweathermap.org/data/2.5/',\napiKey: '<Your API key>'\n```\n\
    ```\n\nIn the preceding snippet, the `apiUrl` property is the URL of the endpoint\
    \ that we will use to make calls to the OpenWeather API, and `apiKey` is our API\
    \ key. Replace the `<Your API key>` value with the API key that you have.\n\n\
    We now have all the moving parts in place to build our Angular application. In\
    \ the following section, we will create a mechanism for interacting with the OpenWeather\
    \ API.\n\n# # Communicating with the OpenWeather API\n\nThe application should\
    \ interact with the OpenWeather API over HTTP to get weather data. Let's see how\
    \ we can set up this type of communication in our application:\n\n+   1. First,\
    \ we need to create an interface for describing the type of data we will get from\
    \ the API. Use the following `generate` command of the Angular CLI to create one:\n\
    +   \n+      ```\n+      ng generate interface weather\n+      ```\n+   \n+  \
    \    The preceding command will create the `weather.ts` file in the `src\\app`\
    \ folder of our Angular CLI project.\n+   \n+   2. Open the `weather.ts` file\
    \ and modify it as follows:\n+   \n+      ```typescript\n+      export interface\
    \ Weather {\n+        weather: WeatherInfo[],\n+        main: {\n+          temp:\
    \ number;\n+          pressure: number;\n+          humidity: number;\n+     \
    \   };\n+        wind: {\n+          speed: number;\n+        };\n+        sys:\
    \ {\n+          country: string\n+        };\n+      ```"
  merge: -1
  img_proc: true
- pgno: 117
  md: "```\n```typescript\nname: string;\n}\n\ninterface WeatherInfo {\n  main: string;\n\
    \  icon: string;\n}\n```\n```\n\nEach property corresponds to a weather field\
    \ in the OpenWeather API response. You can find a description for each one at\
    \ https://openweathermap.org/current#parameter.\n\nThen, we need to set up the\
    \ built-in HTTP client provided by the Angular framework.\n\n+   3. Open the `app.module.ts`\
    \ file and add `HttpClientModule` to the imports array of the `@NgModule` decorator:\n\
    \n```\n```typescript\nimport { HttpClientModule } from '@angular/common/http';\n\
    import { NgModule } from '@angular/core';\nimport { BrowserModule } from '@angular/platform-browser';\n\
    \nimport { AppComponent } from './app.component';\nimport { BrowserAnimationsModule\
    \ } from '@angular/platform-browser/animations';\n\n@NgModule({\n  declarations:\
    \ [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n    BrowserAnimationsModule,\n\
    \    HttpClientModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\n\
    export class AppModule { }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 118
  md: "+   4. Use the `generate` command of the Angular CLI to create a new Angular\
    \ service:\n\n```\n```bash\nng generate service weather\n```\n```\n\nThe preceding\
    \ command will create the `weather.service.ts` file in the `src\\app` folder of\
    \ our Angular CLI project.\n\n+   5. Open the `weather.service.ts` file and inject\
    \ the `HttpClient` service into its constructor:\n\n```\n```typescript\nimport\
    \ { HttpClient } from '@angular/common/http';\nimport { Injectable } from '@angular/core';\n\
    \n@Injectable({\n  providedIn: 'root'\n})\nexport class WeatherService {\n  constructor(private\
    \ http: HttpClient) { }\n}\n```\n```\n\n+   6. Add a method in the service that\
    \ accepts the name of the city as a single parameter and queries the OpenWeather\
    \ API for that city:\n\n```\n```typescript\ngetWeather(city: string): Observable<Weather>\
    \ {\n  const options = new HttpParams()\n    .set('units', 'metric')\n    .set('q',\
    \ city)\n    .set('appId', environment.apiKey);\n\n  return this.http.get<Weather>(environment.apiUrl\
    \ +\n    'weather', { params: options });\n}\n```\n```\n\nThe getWeather method\
    \ uses the get method of the HttpClient service that accepts two parameters. The\
    \ first one is the URL endpoint of the OpenWeather API, which is available from\
    \ the apiUrl property of the environment object."
  merge: -1
  img_proc: true
- pgno: 119
  md: '**Important note**

    The `environment` object is imported from the default `environment.ts` file. The
    Angular CLI is responsible for replacing it with the `environment.prod.ts` file
    when we build our application.


    The second parameter is an `options` object used to pass additional configuration
    to the request, such as URL query parameters with the `params` property. We use
    the constructor of the `HttpParams` object and call its `set` method for each
    query parameter that we want to add to the URL. In our case, we pass the `q` parameter
    for the city name, the `appId` for the API key that we get from the `environment`
    object, and the type of `units` we want to use. You can learn more about supported
    units at https://openweathermap.org/current#data.


    **Tip**

    We used the `set` method to create query parameters because the `HttpParams` object
    is immutable. Calling the constructor for each parameter that you want to pass
    will throw an error.


    We also set the type of response data as `Weather` in the `get` method. Notice
    that the `getWeather` method does not return `Weather` data, but instead an `Observable`
    of this type.


    +   7. Add the following import statements at the top of the file:


    ```

    ```typescript

    import { HttpClient, HttpParams } from ''@angular/common/http'';

    import { Injectable } from ''@angular/core'';

    import { Observable } from ''rxjs'';

    import { environment } from ''../environments/environment'';

    import { Weather } from ''./weather'';

    ```

    ```


    The Angular service that we created contains all the necessary artifacts for interacting
    with the OpenWeather API. In the following section, we will create an Angular
    component for initiating requests and displaying data from it.'
  merge: -1
  img_proc: true
- pgno: 120
  md: "# # Displaying weather information for a city\n\nThe user should be able to\
    \ use the UI of our application and enter the name of a city that wants to view\
    \ weather details. The application will use that information to query the OpenWeather\
    \ API, and the result of the request will be displayed on the UI using a card\
    \ layout. Let's start building an Angular component for creating all these types\
    \ of interactions:\n\n+   1. Use the generate command of the Angular CLI to create\
    \ an Angular component:\n+   \n+   ng generate component weather\n\n+   2. Open\
    \ the template of the main component, app.component.html, and replace its content\
    \ with the selector of the new component, app-weather:\n+   \n+   <app-weather></app-weather>\n\
    \n+   3. Open the app.module.ts file and add the following modules from the Angular\
    \ Material library to the imports array of the @NgModule decorator:\n\n```\n@NgModule({\n\
    \  declarations: [\n    AppComponent,\n    WeatherComponent\n  ],\n  imports:\
    \ [\n    BrowserModule,\n    BrowserAnimationsModule,\n    HttpClientModule,\n\
    \    MatIconModule,\n    MatInputModule,\n    MatCardModule\n  ],\n  providers:\
    \ [],\n  bootstrap: [AppComponent]\n})\n```\n\nAlso, add the necessary import\
    \ statements at the top of the file:\n\n```\nimport { MatCardModule } from '@angular/material/card';\n\
    import { MatIconModule } from '@angular/material/icon';\nimport { MatInputModule\
    \ } from '@angular/material/input';\n```"

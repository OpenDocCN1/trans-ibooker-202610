- pgno: 90
  md: "4. Add a new component method that will call the `createIssue` method of the\
    \ injected service:\n\n```\n```typescript\naddIssue() {\n  this.issueService.createIssue(this.issueForm?.value);\n\
    }\n```\n```\n\nWe pass the value of each form control using the `value` property\
    \ of the `issueForm` object.\n\n> > **Important Note**\n> >\n> > The `value` property\
    \ of a `FormGroup` object contains the model of the form. The keys of the model\
    \ match the property names of the `IIssue` interface, which is the type that the\
    \ `createIssue` method accepts as a parameter. If those were different, we should\
    \ convert the form model before passing it to the method.\n\n5. Open the `issue-report.component.html`\
    \ file and bind the `ngSubmit` event of the form to the `addIssue` component method:\n\
    \n```\n```html\n<form clrForm *ngIf=\"issueForm\" [formGroup]=\"issueForm\" (ngSubmit)=\"\
    addIssue()\">\n```\n```\n\nThe `ngSubmit` event will be triggered when we click\
    \ on the Create button of the form.\n\nWe have now completed all the processes\
    \ involved to add a new issue to the system. In the following section, we will\
    \ learn how to display a newly created issue in the table of pending issues.\n\
    \n# # Displaying a new issue in the list\n\nDisplaying issues and creating new\
    \ ones are two tasks delegated to different Angular components. When we create\
    \ a new issue with `IssueReportComponent`, we need to notify `IssueListComponent`\
    \ to reflect that change in the table. First, let's see how we can configure `IssueReportComponent`\
    \ to communicate that change:\n\n1. Open the `issue-report.component.ts` file\
    \ and use the `@Output()` decorator to add an `EventEmitter` property:\n\n```\n\
    ```typescript\n@Output() formClose = new EventEmitter();\n```\n```\n\n`Output`\
    \ and `EventEmitter` symbols can be imported from the `@angular/core` npm package."

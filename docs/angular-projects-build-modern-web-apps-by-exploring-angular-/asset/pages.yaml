- pgno: 324
  md: "The preceding file contains the TypeScript class of the component that will\
    \ be generated. The selector and the templateUrl properties of the @Component\
    \ decorator are built using the dasherize method and the name of the component.\
    \ The name of the class contains a different method called classify that takes\
    \ the name of the component as a parameter and converts it to title case.\n\n\
    +   4. Open the index.ts file of the tailwind-container folder, set the type of\
    \ options to Schema and remove the return statement:\n\n```\nimport { Rule, SchematicContext,\
    \ Tree } from '@angular-devkit/schematics';\nimport { Schema } from './schema';\n\
    \n// You don't have to export the function as default.\n// You can also have more\
    \ than one rule factory\n// per file.\nexport function tailwindContainer(_options:\
    \ Schema): Rule {\n  return (_tree: Tree, _context: SchematicContext) => {};\n\
    }\n```\n\n+   5. Add the following import statements at the top of the file:\n\

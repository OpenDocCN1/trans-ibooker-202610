  md: "+   7. Modify the `init$` property to use the `poiService` variable:\n\n```\n\
    ```\ninit$ = createEffect(() =>\n  this.actions$.pipe(\n    ofType(PoiActions.init),\n\
    \    fetch({\n      run: (action) => {\n        return this.poiService.getAll().pipe(\n\
    \          map(pois => PoiActions.loadPoiSuccess({ poi:\n            pois }))\n\
    \        )\n      },\n\n      onError: (action, error) => {\n        console.error('Error',\
    \ error);\n        return PoiActions.loadPoiFailure({ error });\n      },\n  \
    \  })\n  )\n);\n```\n```\n\nThe effect is responsible for listening to all actions\
    \ that are dispatched in the store. As soon as a `PoiActions.init` action is dispatched,\
    \ the `init$` property is triggered and calls the `getAll` method of the `poiService`\
    \ variable. The `init$` property knows which action to listen for by the parameters\
    \ in the `ofType` operator.\n\n> **Tip**\n> The `ofType` operator can accept more\
    \ than one action.\n\nIf the data is fetched successfully, the effect will dispatch\
    \ a new action in the store, `PoiActions.loadPoiSuccess`, with POI data as the\
    \ payload. If there is a failure getting the data, it will dispatch a `PoiActions.loadPoiFailure`\
    \ action in the store.\n\n+   8. Open the `app.module.ts` file and import `HttpClientModule`\
    \ from the `@angular/common/http` namespace:\n\n```\n```\nimport { HttpClientModule\
    \ } from\n  '@angular/common/http';\n```\n```\n\nAdd the `HttpClientModule` class\
    \ also in the `imports` array of the `@NgModule` decorator."

  md: "The chart.js npm package is a **CommonJS** module. The Angular CLI displays\
    \ a warning when using a CommonJS module because it can prevent it from optimizing\
    \ your application, resulting in large bundle sizes. Setting the allowedCommonJsDependencies\
    \ option will not display the warning while building the application.\n\n4. Open\
    \ the admin.component.ts file and add the following import statements:\n\n```\n\
    import { Component, OnDestroy, OnInit } from '@angular/core';\nimport { Store\
    \ } from '@ngrx/store';\nimport { PoiActions, PoiEntity, PoiSelectors } from '@packt/poi';\n\
    import { Subscription } from 'rxjs';\n```\n\n5. Modify the AdminComponent class\
    \ so that it interacts with the application store for getting POI data:\n\n```\n\
    export class AdminComponent implements OnInit,\n  OnDestroy {\n\n  private subscription:\
    \ Subscription | undefined;\n\n  constructor(private store: Store) { }\n\n  ngOnInit():\
    \ void {\n    this.subscription = this.store.select(\n      PoiSelectors.getAllPoi).subscribe();\n\
    \    this.store.dispatch(PoiActions.init());\n  }\n\n  ngOnDestroy() {\n    this.subscription?.unsubscribe();\n\
    \  }\n}\n```"

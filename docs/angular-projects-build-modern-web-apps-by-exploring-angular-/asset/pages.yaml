  md: "```\n```typescript\n'@angular/forms';\n\n@Component({\n  selector: 'app-issue-report',\n\
    \  templateUrl: './issue-report.component.html',\n  styleUrls: ['./issue-report.component.css']\n\
    })\nexport class IssueReportComponent implements OnInit {\n\n  issueForm: FormGroup\

- pgno: 32
  md: "# # Interacting with the Angular framework\n\nWhen working with Angular, the\
    \ real fun starts when we get our hands dirty with the framework itself. Understanding\
    \ how Angular works and writing the application code is what matters, after all.\n\
    \nThe application source code resides inside the `src\\app` folder, in the root\
    \ of our Angular CLI project. It contains all the files needed to build and test\
    \ our Angular application, including a component and a module. The component is\
    \ the main component of the Angular application:\n\n**app.component.ts**\n\n```\n\
    ```typescript\nimport { Component } from '@angular/core';\n\n@Component({\n  selector:\
    \ 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.css']\n\
    })\nexport class AppComponent {\n  title = 'my-angular';\n}\n```\n```\n\nThe following\
    \ properties characterize an Angular component:\n\n+   * `selector`: A unique\
    \ name that is used to identify and declare the component inside HTML content.\
    \ It is used as an HTML tag, just like any native HTML element, such as `<app-root></app-root>`.\n\
    \n> > **Tip**\n> > The Angular CLI provides the app prefix by default in component\
    \ selectors. We can use a custom one using the `--prefix` option when creating\
    \ a new Angular CLI application from scratch. A custom prefix can be based on\
    \ the name of an organization or a particular product, and it helps avoid collisions\
    \ with other libraries or modules.\n\n+   * `templateUrl`: The path pointing to\
    \ an HTML file that contains the HTML content of the component, which is called\
    \ the template of the component.\n+   * `styleUrls`: A list of paths where each\
    \ one points to a stylesheet file containing the CSS styles of the component."
  merge: -1
  img_proc: true
- pgno: 33
  md: "The preceding properties are defined using the `@Component` decorator. It is\
    \ a function that decorates the TypeScript class of the component and recognizes\
    \ it as an Angular component. The `title` property of the AppComponent class is\
    \ a public property that contains a string value and can be used in the template\
    \ of the component.\n\nThe main module of our Angular application uses a similar\
    \ decorator called `@NgModule` to define its properties:\n\n# app.module.ts\n\n\
    ```\n```typescript\nimport { NgModule } from '@angular/core';\nimport { BrowserModule\
    \ } from '@angular/platform-browser';\n\nimport { AppComponent } from './app.component';\n\
    \n@NgModule({\n  declarations: [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule\n\
    \  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\nexport class AppModule\
    \ { }\n```\n```\n\nThe decorator of an Angular module defines a set of properties\
    \ that can be used to configure the module. The most common ones are as follows:\n\
    \n+   - `declarations`: Defines Angular components that are part of the Angular\
    \ module. Every component that exists in the Angular module *must* be added to\
    \ the declarations array.\n+   - `imports`: Defines other Angular modules that\
    \ contain functionality the Angular module needs."
  merge: -1
  img_proc: true

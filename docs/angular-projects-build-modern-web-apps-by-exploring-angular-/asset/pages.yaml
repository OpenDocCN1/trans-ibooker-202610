- pgno: 327
  md: "# Creating an HTTP service\n\nFor our schematics library, we will create a\
    \ schematic that scaffolds an Angular service. It will generate a service that\
    \ imports the built-in HTTP client. It will also contain one method for each HTTP\
    \ request that is involved in a CRUD operation.\n\nThe generation schematic that\
    \ we are going to build will not stand on its own. Instead, we will combine it\
    \ with the existing generation schematic of the Angular CLI for services. Thus,\
    \ we do not need a separate JSON schema.\n\nLet's get started by creating the\
    \ schematic:\n\n+   1. Execute the following command to add a new schematic to\
    \ our collection:\n+   2. Open the collection.json file and provide an explanatory\
    \ description for the schematic:\n+   3. Create a folder named files inside the\
    \ crud-service folder of the workspace.\n+   4. Create a file named __name@dasherize__.service.ts.template\
    \ inside the files folder and add the following code:\n\n```\nschematics blank\
    \ crud-service\n```\n\n```\n\"crud-service\": {\n  \"description\": \"Generate\
    \ a CRUD HTTP service\",\n  \"factory\": \"./crud-service/index#crudService\"\n\
    }\n```\n\n```\nimport { Injectable } from '@angular/core';\nimport { HttpClient\
    \ } from '@angular/common/http';\nimport { Observable } from 'rxjs';\n\n@Injectable({\n\
    \  providedIn: 'root'\n})\nexport class <%= classify(name) %>Service {\n  constructor(private\
    \ http: HttpClient) { }\n}\n```\n\nThe preceding file is the template of the Angular\
    \ service file that our schematic will generate. It injects the HttpClient service\
    \ in the constructor of the class by default."
  merge: -1

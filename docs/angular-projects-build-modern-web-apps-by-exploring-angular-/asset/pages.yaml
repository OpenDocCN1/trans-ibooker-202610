    \  styleUrls: ['./issue-report.component.css']\n})\nexport class IssueReportComponent\
    \ implements OnInit {\n\n  constructor(private builder: FormBuilder) { }\n\n \
    \ ngOnInit(): void {\n  }\n\n}\n```\n\nFormBuilder is an Angular service that\
    \ we use to build a reactive form in an easy and convenient way.\n\n+   3. Declare\
    \ an `issueForm` property of the FormGroup type and initialize it inside the ngOnInit\
    \ method:\n\n```\nimport { Component, OnInit } from '@angular/core';\nimport {\
    \ FormBuilder, FormGroup } from\n```"
  merge: -1

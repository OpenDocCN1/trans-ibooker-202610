- pgno: 41
  md: '# 2

    Building an

    SPA Application

    with Scully and

    Angular Router


    Angular applications follow the **Single Page Application (SPA)** architecture,
    where different views of the web page can be activated according to the browser
    URL. Any changes to that URL can be intercepted by the Angular router and translated
    to routes that can activate a particular Angular component.


    **Scully** is a popular static website generator that is based on the **Jamstack**
    architecture. It can cooperate nicely with the Angular router to prerender the
    content of an Angular application according to each route.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'In this chapter, we are going to combine Angular and Scully to create a personal
    blog. The following topics are going to be covered:


    +   - Setting up routing in an Angular application

    +   - Creating the basic layout of our blog

    +   - Configuring routing for our application

    +   - Adding blog capabilities with Scully

    +   - Displaying blog posts on the home page


    # # Essential background theory and context


    In the old days of web development, client-side applications were highly coupled
    with the underlying server infrastructure. Much machinery was involved when we
    wanted to visit the page of a website using a URL. The browser would send the
    requested URL to the server, and the server should respond with a matching HTML
    file for that URL. This was a complicated process that would result in delays
    and varying round-trip times.


    Modern web applications eliminate these problems using the SPA architecture. A
    client needs to request a single HTML file only once from the server. Any subsequent
    changes to the URL of the browser are handled internally from the client infrastructure.
    In Angular, the router is responsible for intercepting in-app URL requests and
    handling them according to a defined route configuration.


    Jamstack is a hot, emerging technology that allows us to create fast and secure
    web applications. It can be used for any application type, ranging from an e-commerce
    website to a **Software as a Service (SaaS)** web application or even a personal
    blog. The architecture of Jamstack is based on the following pillars:


    +   - **Performance:** Pages are generated and prerendered during production,
    eliminating the need to wait for content to load.

    +   - **Scaling:** Content is static files that can be served from anywhere, even
    from a **Content Delivery Network (CDN)** provider that improves the performance
    of the application.

    +   - **Security:** The serverless nature of server-side processes and the fact
    that content is already static eliminates potential attacks that target server
    infrastructures.


    Scully is the first static website generator for Angular that embraces the Jamstack
    approach. It essentially generates pages of the Angular application during build
    time to be immediately available when requested.'
  merge: -1
  img_proc: true
- pgno: 43
  md: "# # Project overview\n\nIn this project, we will build a personal blog using\
    \ the Angular framework and enhance it with Jamstack characteristics using the\
    \ Scully site generator. Initially, we will scaffold a new Angular application\
    \ and enable it for routing. We will then create the basic layout of our application\
    \ by adding some barebone components. As soon as we have a working Angular application,\
    \ we will add blog support to it using Scully. We will then create some blog posts\
    \ using Markdown files and display them on the home page of our application.\n\
    \nBuild time: 1 hour.\n\n# ## Getting started\n\nThe following software tools\
    \ are required to complete this project:\n\n+   - Angular CLI: A command-line\
    \ interface for Angular that you can find at `https://angular.io/cli`\n+   - GitHub\
    \ material: The related code for this chapter, which you can find in the `Chapter02`\
    \ folder at `https://github.com/PacktPublishing/Angular-Projects-Second-Edition`.\n\
    \n# ## Setting up routing in an Angular application\n\nWe will kick off our project\
    \ by creating a new Angular application from scratch. Execute the following command\
    \ of the Angular CLI in a terminal window to create a new Angular application:\n\
    \n```\n```bash\nng new my-blog --routing --style=scss\n```\n```\n\nWe use the\
    \ `ng new` command to create a new Angular application, passing the following\
    \ options:\n\n+   - `my-blog`: The name of the Angular application that we want\
    \ to create. The Angular CLI will create a `my-blog` folder in the path where\
    \ we execute the command.\n+   - `--routing`: Enables routing in the Angular application.\n\
    +   - `--style=scss`: Configures the Angular application to use the SCSS stylesheet\
    \ format when working with CSS styles.\n\n> **Important Note**\n> \n> Every command\
    \ that we run in the terminal window should be run inside this folder."
  merge: -1
  img_proc: true
- pgno: 44
  md: "When we enable routing in an Angular application, the Angular CLI imports several\
    \ artifacts from the @angular/router npm package in our application:\n\n+   -\
    \ It creates the `app-routing.module.ts` file, which is the main routing module\
    \ of our application:\n\n```\nimport { NgModule } from '@angular/core';\nimport\
    \ { RouterModule, Routes } from '@angular/router';\n\nconst routes: Routes = [];\n\
    \n@NgModule({\n  imports: [RouterModule.forRoot(routes)],\n  exports: [RouterModule]\n\
    })\nexport class AppRoutingModule { }\n```\n\n+   - It imports `AppRoutingModule`\
    \ into the main module of our application, `app.module.ts`:\n\n```\nimport { NgModule\
    \ } from '@angular/core';\nimport { BrowserModule } from '@angular/platform-browser';\n\
    \nimport { AppRoutingModule } from './app-routing.module';\nimport { AppComponent\
    \ } from './app.component';\n\n@NgModule({\n  declarations: [\n    AppComponent\n\
    \  ],\n  imports: [\n    BrowserModule,\n    AppRoutingModule\n  ],\n  providers:\
    \ [],\n  bootstrap: [AppComponent]\n})\nexport class AppModule { }\n```"
  merge: -1

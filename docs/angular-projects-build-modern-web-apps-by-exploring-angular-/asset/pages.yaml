- pgno: 278
  md: "The MatCardModule class is an Angular Material module that exposes all components\
    \ that we need for creating a card component.\n\n+   3. Open the map.component.ts\
    \ file and add the following import statements:\n\n```\nimport { Component, OnInit,\
    \ ViewChild } from\n'@angular/core';\nimport { Store } from '@ngrx/store';\nimport\
    \ { PoiSelectors } from '@packt/poi';\nimport { MapInfoWindow, MapMarker } from\n\
    '@angular/google-maps';\n```\n\n+   4. Declare a component property to get a reference\
    \ to the information window using the @ViewChild decorator:\n\n```\n@ViewChild(MapInfoWindow)\
    \ info: MapInfoWindow |\n    undefined;\n```\n\n+   5. Create a method for opening\
    \ the information window:\n\n```\nshowInfo(marker: MapMarker) {\n    this.info?.open(marker);\n\
    }\n```\n\nIn the preceding code, we call the open method of the information window\
    \ reference, passing the associated map marker as a parameter.\n\n+   6. Open\
    \ the map.component.html file and bind the showInfo component method to the mapClick\
    \ event of the map-marker component:\n\n```\n<map-marker #marker=\"mapMarker\"\
    \ [position]=\"poi\" (mapClick)=\"showInfo(marker)\"></map-marker>\n```\n\nWe\
    \ create the marker template reference variable to get a reference to the mapMarker\
    \ object and pass it as a parameter in the showInfo method.\n\n+   7. Run the\
    \ application using the Serve option of Nx Console and select a POI from the list."

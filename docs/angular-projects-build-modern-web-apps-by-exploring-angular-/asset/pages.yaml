    \ following content:\n\n```\n```json\n{\n  \"name\": \"my-editor\",\n  \"main\"\
    : \"main.js\"\n}\n```\n```\n\nThe `electron-packager` library requires a `package.json`\
    \ file to be present in the output folder and points to the main entry file of\
    \ the Electron application.\n\n+   4. Open the `webpack.prod.config.js` file and\
    \ add the CopyWebpackPlugin in the plugins property:\n\n```\n```javascript\nconst\
    \ path = require('path');\nconst baseConfig = require('./webpack.config');\nconst\
    \ CopyWebpackPlugin = require('copy-webpack-plugin');\n\nmodule.exports = {\n\
    \  ...baseConfig,\n  output: {\n    path: path.join(process.cwd(), 'dist', 'my-editor'),\n\
    \    filename: 'main.js'\n  },\n```\n```"

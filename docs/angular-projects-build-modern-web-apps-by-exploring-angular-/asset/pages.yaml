- pgno: 126
  md: "Congratulations! At this point, you have a fully working Angular application\
    \ that displays weather information for a specific city. The application consists\
    \ of a single Angular component that communicates with the OpenWeather API using\
    \ an Angular service through HTTP. We learned how to style our component using\
    \ Angular Material and give our users a pleasant experience with our app. But\
    \ what happens when we are offline? Does the application work as expected? Does\
    \ the user's experience remain the same? Let's find out in the following section.\n\
    \n# Enabling offline mode with the service worker\n\nUsers from anywhere can now\
    \ access our Angular application to get weather information for any city they\
    \ are interested in. When we say *anywhere*, we mean any network type such as\
    \ broadband, cellular (3G/4G/5G), and Wi-Fi. Consider the case where a user is\
    \ in a place with low coverage or frequent network outages. How is our application\
    \ going to behave? Let's find out by conducting an experiment:\n\n+   1. Run the\
    \ Angular application using the serve command of the Angular CLI:\n+   \n+   \
    \   ```ng serve```\n+   \n+   2. Open your favorite browser and navigate to `http://localhost:4200`,\
    \ which is the default address and port number for an Angular CLI project. You\
    \ should see the input field for entering the name of the city:\n+   \n+     \
    \ ![Enter city input field](placeholder)\n+      Figure 4.2 – Entering the name\
    \ of a city\n+   \n+   3. Open the developer tools of your browser and navigate\
    \ to the **Network** tab. Set the value of the **Throttling** dropdown to **Offline**:\n\
    +   \n+      ![Network tab with Offline selected](placeholder)\n+      Figure\
    \ 4.3 – Offline network mode"
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   4. Try to refresh your browser. You will see an indication that you are
    disconnected from the internet, as shown in the following screenshot:


    ![](img/efea53d01337e7b223389b38dcdb0160_127_0.png)


    Figure 4.4 – No internet connection (Google Chrome)


    The previous case is pretty standard in areas with low-quality internet connections.
    So, what can we do for our users in such areas? Luckily, the Angular framework
    contains an implementation of a service worker that can significantly enhance
    the UX of our application when running in offline mode. It can cache certain parts
    of the application and deliver them accordingly instead of making real requests.


    > **Tip**

    > The Angular service worker can also be used in environments with large network
    latency connections. Consider using a service worker in this type of network to
    also improve the experience of your users.


    Run the following command of the Angular CLI to enable the service worker in our
    Angular application:


    ```

    ng add @angular/pwa

    ```'
  merge: -1
  img_proc: true
- pgno: 128
  md: "The preceding command will transform the Angular CLI workspace accordingly\
    \ for PWA support:\n\n+   * It adds the `@angular/service-worker` npm package\
    \ to the dependencies section of the `package.json` file of the application.\n\
    +   * It creates the `manifest.webmanifest` file in the `src` folder of the application.\
    \ The manifest file contains information about the application needed to install\
    \ and run the application as a native one. It also adds it to the `assets` array\
    \ of the `build` options in the `angular.json` file.\n+   * It creates the `ngsw-config.json`\
    \ file at the root of the project, which is the service worker configuration file.\
    \ We use it to define configuration-specific artifacts, such as which resources\
    \ are cached and how they are cached. You can find more details about the configuration\
    \ of the service worker at the following link: https://angular.io/guide/service-worker-config#service-worker-configuration.\n\
    +   \n+     The configuration file is also set in the `ngswConfigPath` property\
    \ of the `build` configuration in the `angular.json` file.\n+   \n+   * It sets\
    \ the `serviceWorker` property to `true` in the `build` configuration of the `angular.json`\
    \ file.\n+   * It registers the service worker in the `app.module.ts` file:\n\n\
    ```\n```typescript\nimport { ServiceWorkerModule } from '@angular/service-\nworker';\n\
    import { environment } from '../environments/\nenvironment';\n\n@NgModule({\n\
    \  declarations: [\n    AppComponent,\n    WeatherComponent\n  ],\n  imports:\
    \ [\n    BrowserModule,\n    BrowserAnimationsModule,\n    HttpClientModule,\n\
    \    MatIconModule,\n    MatInputModule,\n```\n```"
  merge: -1
  img_proc: true

  md: "The global state of our application is now configured and ready to be used.\
    \ In the following section, we will create additional Angular components in the\
    \ visitor library that will interact with the feature state of our application.\n\
    \n# # Interacting with the store\n\nThe visitor portal will interact with the\
    \ feature state of our application through two Angular components. One component\
    \ will display the list of POIs and allow the user to select one. The other component\
    \ will display a **Google Maps** map and display the selected POI on it.\n\nInitially,\
    \ we will build the component that displays the list of POIs:\n\n+   1.  Open\
    \ the visitor.module.ts file and add the following import statement:\n+      \
    \ \n+       ```\n+       import { PoiModule } from '@packt/poi';\n+       ```\n\
    +       \n+   2.  Add PoiModule in the imports array of the @NgModule decorator:\n\
    +       \n+       ```\n+       @NgModule({\n+         imports: [CommonModule,\
    \ LayoutModule,\n+           MatToolbarModule, MatButtonModule,\n+           MatSidenavModule,\
    \ MatIconModule, MatListModule,\n+           RouterModule.forChild([\n+      \
    \       { path: '', component: VisitorComponent }\n+           ]),\n+        \
    \   PoiModule\n+         ],\n+         declarations: [VisitorComponent],\n+  \
    \     })\n+       ```\n+       \n+       We import PoiModule so that the poi feature\
    \ state is registered in the store as soon as the visitor portal is loaded.\n\
    +       \n+   3.  Execute the following command of Nx CLI to create the Angular\
    \ component:\n+       \n+       ```\n+       nx generate component poi-list --project=visitor\n\
    +       ```\n+       \n+   4.  Open the poi-list.component.ts file and add the\
    \ following import statements:\n+       \n+       ```\n+       import { Store\
    \ } from '@ngrx/store';\n+       import { PoiActions, PoiSelectors } from '@packt/poi';\n\
    +       ```"
  merge: -1
  img_proc: true
- pgno: 270
  md: "+   5. Inject the Store service in the constructor of the PoiListComponent\
    \ class:\n\n```\nconstructor(private store: Store) { }\n```\n\n+   6. Dispatch\
    \ the PoiActions.init action in the store to fetch POI data when the component\
    \ is initialized:\n\n```\nngOnInit(): void {\n  this.store.dispatch(PoiActions.init());\n\
    }\n```\n\nWe execute the action as a method and pass its result to the dispatch\
    \ method of the store variable.\n\n+   7. Create a component property that invokes\
    \ the PoiSelectors.getAllPoi selector to list POI data from the store:\n\n```\n\
    pois$ = this.store.select(PoiSelectors.getAllPoi);\n```\n\nWe use the select method\
    \ of the store variable to execute the selector.\n\n> **Important note**\n> We\
    \ did not create the PoiSelectors.getAllPoi selector. NgRx did it for us when\
    \ we generated the feature state in the poi library.\n\n+   8. Open the poi-list.component.html\
    \ file and replace its content with the following HTML template:\n\n```\n<mat-action-list\
    \ *ngFor=\"let poi of pois$ | async\">\n  <button mat-list-item>{{poi.name}}</button>\n\
    </mat-action-list>\n```\n\nWe use the mat-action-list component of the Angular\
    \ Material library to display each POI as a single action item. We subscribe to\
    \ the pois$ property using the async pipe and create a button element with the\
    \ mat-list-item directive for each POI.\n\n+   9. Open the visitor.component.html\
    \ file and replace the mat-nav-list component with the selector of the Angular\

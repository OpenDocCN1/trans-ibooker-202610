- pgno: 252
  md: '# Creating a monorepo application using Nx


    Nx Dev Tools provides developers with tools for working with monorepos, including
    the following:


    +   - **create-nx-workspace**: An npm package that scaffolds a new Nx monorepo
    application.

    +   - **Nx CLI**: A command-line interface that runs commands against a monorepo
    application. Nx CLI extends the Angular CLI to provide more commands, and it is
    faster due to the distributed caching mechanism.


    > **Tip**

    > It is recommended to use the *Quick Open* feature of VSCode when working with
    Nx monorepos. The number of generated folders and files will significantly increase,
    and it will be challenging to navigate through them. You can find out more at
    https://code.visualstudio.com/docs/editor/editingevolved#_quick-file-navigation.


    When we use the preceding npm package to create a new Nx monorepo workspace, it
    will check whether Nx CLI has already been installed. To install Nx CLI, run the
    following command in a terminal:


    ```

    npm install -g nx

    ```


    The preceding command will install the nx npm package globally on our system.
    We can now scaffold a new Nx monorepo workspace using the following command:


    ```

    npx create-nx-workspace packt --appName=tour --preset=angular --style=css --linter=eslint
    --nx-cloud=false --routing

    ```


    The preceding command uses npx, an npm command-line tool that allows us to execute
    an npm package without installing it first. It executes the create-nx-workspace
    package passing the following options:


    +   - `packt`: The name of the Nx monorepo workspace. In large enterprise environments,
    we typically use the organization name.

    +   - `--appName=tour`: The name of the application.

    +   - `--preset=angular`: Nx supports applications built with various JavaScript
    frameworks. The preset option defines what type of application we want to build.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '+   - `--style=css`: Indicates that our application will use the CSS stylesheet
    format.

    +   - `--linter=eslint`: Configures our application to use **ESLint** as the default
    linter.

    +   - `--nx-cloud=false`: Disables Nx Cloud for our application.

    +   - `--routing`: Enables Angular routing in the application.


    > **Important note**

    > Creating a new Nx workspace may take some time to complete, as it installs all
    the necessary packages for an enterprise environment.


    After the creation of the workspace has been completed, we can run it to verify
    that everything has been set up correctly:


    +   1. Open the project in the VSCode editor and click on the **Nx Console** menu

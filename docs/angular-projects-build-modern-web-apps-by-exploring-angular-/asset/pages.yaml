- pgno: 311
  md: 'Well done! Your library is now on the public npm registry and can be used by
    other developers in their Angular applications.


    > **Important note**

    > Always remember to change the version number in the package.json file of your
    library before publishing it. Otherwise, the npm registry will throw an error,
    stating that the version you are trying to publish already exists. There are also
    some npm packages such as standard-version that can automate this for you.


    In the following section, we will learn how to use our library in non-Angular
    applications using Angular elements.


    # Using components as Angular elements


    We have already learned how to use the Angular CLI for creating an Angular library.
    We also saw how to publish our library to the npm registry so that other Angular
    projects can use it and benefit from it. In this section, we will go the extra
    mile and learn how to build our Angular library to be used in non-Angular environments.


    As we have already pointed out, the Angular framework is a cross-platform JavaScript
    framework in many ways. It can run on the server using Angular Universal, and
    on mobile platforms. It can also run on a native desktop environment. In addition
    to those platforms, it can even run on web applications that are not built with
    Angular, using Angular elements.


    Let''s see how we can convert our clipboard component to an Angular element, as
    follows:


    +   1. Execute the following Angular CLI command to generate a new Angular application
    in our workspace:


    ```

    ng generate application ui-elements --defaults

    ```


    The preceding command will generate the ui-elements Angular application in the
    projects folder using default options.


    > **Important note**

    > The Angular CLI does not currently support the use of Angular elements directly
    on an Angular library. Thus, we need to create an Angular application whose only
    purpose will be to export our components as Angular elements.'

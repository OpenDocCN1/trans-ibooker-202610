    \ section, we will take our component a step further and make our cards able to\
    \ change their location in the list.\n\n# Adding drag-and-drop functionality\n\
    \nA feature of the card list component is that we will be able to change the location\
    \ of a card by dragging and dropping it inside the list. The order of the card\
    \ list should be emitted back to the consumer application using an output property\
    \ binding.\n\nThe Angular CDK contains a drag-and-drop module that we can use\
    \ for this purpose. To do so, follow these steps:\n\n+   1. Open the `ui-controls.module.ts`\
    \ file and import `DragDropModule` from the `@angular/cdk/drag-drop` namespace,\
    \ like this:\n\n```\n```typescript\nimport { DragDropModule } from '@angular/cdk/drag-drop';\n\
    ```\n```\n\n+   2. Add the `DragDropModule` class to the `imports` array of the\
    \ `@NgModule` decorator, like this:\n\n```\n```typescript\n@NgModule({\n  declarations:\
    \ [\n    UiControlsComponent,\n    CardListComponent\n  ],\n```\n```"

- pgno: 234
  md: "Our application now features a complete portfolio for the profile of a GitHub\
    \ user. It displays the following:\n\n+   - Personal information, a short biography,\
    \ and social media links\n+   - A list of public user repositories that contains\
    \ links to each one for more information\n+   - A list of organizations where\
    \ the user is a member with links to each one for further details\n\nIn the next\
    \ section, we will learn how to integrate Angular Universal and render our application\
    \ in the server.\n\n# # Integrating Angular Universal\n\nAngular Universal is\
    \ an Angular library that enables an Angular CLI application to be rendered on\
    \ the server. An SSR application increases the loading speed of an Angular application\
    \ and improves the loading of the first page.\n\nTo install Angular Universal\
    \ in an existing Angular CLI application, we will use the following command of\
    \ the Angular CLI:\n\n```\nng add @nguniversal/express-engine\n```\n\nThe previous\
    \ command uses the `ng add` command of the Angular CLI to install the `@nguniversal/express-engine`\
    \ npm package. The `@nguniversal/express-engine` package is the heart of the Angular\
    \ Universal library and consists of a **Node.js Express** web server at its core.\n\
    \nWhen we execute the preceding command to install Angular Universal, we are not\
    \ only installing the library but also modifying our Angular CLI workspace with\
    \ the following files:\n\n+   - `angular.json`: This creates new entries in the\
    \ architect section to build and enable our Angular Universal application. One\
    \ of these entries is the `server` property, which is responsible for building\
    \ our application with SSR. It outputs the generated bundle into a separate `server`\
    \ folder, inside the standard output folder of the Angular CLI application:\n\n\
    ```\n\"options\": {\n  \"outputPath\": \"dist/gh-portfolio/server\",\n  \"main\"\
    : \"server.ts\",\n  \"tsConfig\": \"tsconfig.server.json\",\n  \"inlineStyleLanguage\"\
    : \"scss\"\n}\n```"
  merge: -1
  img_proc: true
- pgno: 235
  md: "The original application bundle is now generated into a browser folder, inside\
    \ the standard output folder:\n\n```\n\"options\": {\n  \"outputPath\": \"dist/gh-portfolio/browser\"\
    ,\n  \"index\": \"src/index.html\",\n  \"main\": \"src/main.ts\",\n  \"polyfills\"\
    : \"src/polyfills.ts\",\n  \"tsConfig\": \"tsconfig.app.json\",\n  \"inlineStyleLanguage\"\
    : \"scss\",\n  \"assets\": [\n    \"src/favicon.ico\",\n    \"src/assets\"\n \
    \ ],\n  \"styles\": [\n    \"src/styles.scss\"\n  ],\n  \"scripts\": []\n}\n```\n\
    \nThus, an Angular Universal application generates two versions of the same Angular\
    \ application, one version for the server and another one for the browser.\n\n\
    +   - package.json: This adds all the necessary npm dependencies and creates a\
    \ handful set of npm scripts to start building with Angular Universal:\n\n```\n\
    \"scripts\": {\n  \"ng\": \"ng\",\n  \"start\": \"ng serve\",\n  \"build\": \"\
    ng build\",\n  \"watch\": \"ng build --watch --configuration development\",\n\
    \  \"test\": \"ng test\",\n  \"dev:ssr\": \"ng run gh-portfolio:serve-ssr\",\n\
    \  \"serve:ssr\": \"node dist/gh-portfolio/server/main.js\",\n  \"build:ssr\"\
    : \"ng build && ng run gh-portfolio:server\",\n  \"prerender\": \"ng run gh-portfolio:prerender\"\
    \n}\n```"
  merge: -1
  img_proc: true
- pgno: 236
  md: "Scripts that contain the :ssr suffix are related to building and serving the\
    \ Angular Universal application. The prerender script will create a prerendered\
    \ version of an Angular application during build time. We will learn about the\
    \ prerender script in the Prerendering content during build section.\n\n+   -\
    \ `server.ts`: This contains the Node.js Express application that will host the\
    \ server-side rendered version of our portfolio application.\n+   - `main.server.ts`:\
    \ This is the main entry point of our Angular Universal application.\n+   - `app.server.module.ts`:\
    \ This is the main application module of the server-side rendered application.\n\
    +   - `tsconfig.server.json`: This is the TypeScript configuration for our Angular\
    \ Universal application.\n+   - `main.ts`: The main entry point of our Angular\
    \ application loads the main application module only after the DOM has been loaded\
    \ completely:\n+   - `app.module.ts`: This calls the withServerTransition method\
    \ of BrowserModule to load our application as a server-side rendered one:\n\n\
    ```\ndocument.addEventListener('DOMContentLoaded', () => {\n  platformBrowserDynamic().bootstrapModule(AppModule)\n\
    \    .catch(err => console.error(err));\n});\n```\n\n```\n@NgModule({\n  declarations:\
    \ [\n    AppComponent,\n    PersonalInfoComponent,\n    PanelComponent\n    RepositoriesComponent,\n\
    \    OrganizationsComponent\n  ],\n  imports: [\n    BrowserModule.withServerTransition({\
    \ appId:\n      'serverApp' }),\n    HttpClientModule\n  ],\n  providers: [],\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 237
  md: "```\nbootstrap: [AppComponent]\n})\nexport class AppModule { }\n```\n\n> **Important\
    \ note**\n> Global JavaScript objects such as `window` and `document` are not\
    \ available when rendering an Angular application in the server because there\
    \ is no browser. Angular provides abstraction APIs for some of these objects,\
    \ such as the `DOCUMENT` injection token. If you need to enable them conditionally,\
    \ you can inject the `PLATFORM_ID` token and use the `isPlatformServer` or `isPlatformBrowser`\
    \ methods from the `@angular/common` npm package to check on which platform your\
    \ application is currently running:\n\n```\nimport { Inject, PLATFORM_ID } from\
    \ '@angular/core';\nimport { isPlatformBrowser } from '@angular/common';\n\nexport\
    \ class CheckPlatformComponent {\n  isBrowser: boolean;\n\n  constructor( @Inject(PLATFORM_ID)\
    \ platformId: any) {\n    this.isBrowser = isPlatformBrowser(platformId);\n  }\n\
    }\n```\n\nWe can now run our GitHub portfolio application on the server using\
    \ the following npm command:\n\n```\nnpm run dev:ssr\n```\n\nTo preview your GitHub\
    \ portfolio application on the server, open your browser at http://localhost:4200.\n\
    \nYou should typically see the application as it was before. So, what have we\
    \ gained here? Angular Universal applications do not reveal their full potential\
    \ when running in a development machine with a powerful processor and a lot of\
    \ memory. Instead, we need to run and preview them in real-world cases, such as\
    \ a slow network. We can use **Google Chrome Developer Tools** to emulate a slow\
    \ network in a development environment:\n\n+   1. Open the Google Chrome browser.\n\
    +   2. Toggle the developer tools and select the **Network** tab."
  merge: -1
  img_proc: true
- pgno: 238
  md: "+   3. Select the **Slow 3G** option from the **Throttling** dropdown.\n+ \
    \  4. Enter `http://localhost:4200` in the address bar of your browser.\n\nIf\
    \ you click on any link while the page is loading, you will notice that nothing\
    \ happens. Why is that? The server first loads a static version of your application\
    \ to display to the user until waiting for the actual Angular application to load\
    \ in the background. During this FCP, all links except `routerLink` directives\
    \ are not responding. Angular Universal will switch to the complete application\
    \ when it has been fully loaded in the background.\n\nLater, in the *Replaying\
    \ events with preboot* section, we will see how to handle these events. In the\
    \ meantime, we will investigate how to improve the loading speed of our application\
    \ even more using prerendering in the following section.\n\n# Prerendering content\
    \ during build\n\nThe `package.json` file of our Angular CLI workspace contains\
    \ the prerender npm script that we can use to improve the first loading of our\
    \ application. The script runs the `prerender` command from the architect section\
    \ of the `angular.json` configuration file and prerenders the content of our application\
    \ during build time. Let's see the effect that prerendering will have on our GitHub\
    \ portfolio application:\n\n+   1. Execute the following npm command to generate\
    \ a prerendered version of the application:\n\n```\nnpm run prerender\n```\n\n\
    > **Important note**\n> \n> The username and apiUrl properties in the environment\
    \ production file should be set correctly. Otherwise, the command will output\
    \ errors in the terminal window of VSCode.\n\nThe preceding command will output\
    \ a production bundle of the application into the `dist\\gh-portfolio\\browser`\
    \ folder.\n\n+   2. Navigate to the `dist\\gh-portfolio\\browser` folder and you\
    \ should see two HTML files, `index.html` and the `index.original.html` file.\n\
    +   3. Open the `index.original.html` file and find the `app-root` HTML element.\
    \ This is the main component of our Angular application where Angular will render\
    \ the content of our application in the browser."

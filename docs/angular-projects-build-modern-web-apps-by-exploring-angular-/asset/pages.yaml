- pgno: 84
  md: 'In the preceding snippet, we use several Angular components of the Clarity
    library:


    +   - `clr-datagrid`: Defines a table.

    +   - `clr-dg-column`: Defines a column of a table. Each column uses the `clrDgField`
    directive to bind to the property name of the issue represented by that column.
    The `clrDgField` directive provides us with sorting and filtering capabilities
    without writing even a single line of code in the TypeScript class file. Sorting
    works automatically only with string-based content. If we want to sort by a different
    primitive type, we must use the `clrDgColType` directive and specify the particular
    type.

    +   - `clr-dg-row`: Defines a row of a table. It uses the `clrDgItems` directive
    to iterate over the issues and create one row for each issue.

    +   - `clr-dg-cell`: Each row contains a collection of `clr-dg-cell` components
    to display the value of each column using interpolation. In the last cell, we
    add the `label-danger` class when an issue has a high priority to indicate its
    importance.

    +   - `clr-dg-footer`: Defines the footer of a table. In this case, it displays
    the total number of issues.


    If we run our Angular application using `ng serve`, the output will look like
    the following:


    | Issue No | Type | Title | Description | Priority |

    |---|---|---|---|---|

    | 1 | Feature | Add email validation in registration form | Validate the email
    entered in the user registration form | high |

    | 2 | Feature | Display the adress details of a customer | Add a column to display
    the details of the customer address in the customer list | low |

    | 3 | Bug | Export to CSV is not working | The export process of a report into
    CSV format throws an error | high |

    | 4 | Feature | Locale settings per user | Add settings configure the locale of
    the current user | low |


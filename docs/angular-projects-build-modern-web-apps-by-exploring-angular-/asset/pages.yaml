- pgno: 79
  md: "# # Displaying an overview of issues\n\nOur Angular application will be responsible\
    \ for managing and tracking issues. When the application starts up, we should\
    \ display a list of all pending issues in the system. Pending issues are defined\
    \ as those issues that have not been resolved. The process that we will follow\
    \ can be further analyzed into the following:\n\n+   - Fetching pending issues\n\
    +   - Visualizing issues using a data grid\n\n# ## Fetching pending issues\n\n\
    First, we need to create a mechanism for fetching all pending issues:\n\n+   1.\
    \ Use the `generate` command of the Angular CLI to create an Angular service named\
    \ `issues`:\n\n```\n```bash\nng generate service issues\n```\n```\n\nThe preceding\
    \ command will create an `issues.service.ts` file in the `src\\app` folder of\
    \ our Angular CLI project.\n\n+   2. Every issue will have specific properties\
    \ of a defined type. We need to create a TypeScript interface for that with the\
    \ following Angular CLI command:\n\n```\n```bash\nng generate interface issue\n\
    ```\n```\n\nThe previous command will create an `issue.ts` file in the `src\\\
    app` folder of the project.\n\n+   3. Open the `issue.ts` file and add the following\
    \ properties in the `Issue` interface:\n\n```\n```typescript\nexport interface\
    \ Issue {\n  issueNo: number;\n  title: string;\n  description: string;\n  priority:\
    \ 'low' | 'high';\n  type: 'Feature' | 'Bug' | 'Documentation';\n  completed?:\
    \ Date;\n}\n```\n```\n\nThe completed property is the date that an issue is resolved.\
    \ We define it as optional because new issues will not have this property set."
  merge: -1
  img_proc: true
- pgno: 80
  md: "4. Open the Angular service that we created in `step 1` and add an `issues`\
    \ property to hold our issue data. Also create a `getPendingIssues` method that\
    \ will return all issues that have not been completed:\n\n```\n```typescript\n\
    import { Injectable } from '@angular/core';\nimport { Issue } from './issue';\n\
    \n@Injectable({\n  providedIn: 'root'\n})\nexport class IssuesService {\n\n  private\
    \ issues: Issue[] = [];\n\n  constructor() { }\n\n  getPendingIssues(): Issue[]\
    \ {\n    return this.issues.filter(issue =>\n      !issue.completed;\n  }\n\n\
    }\n```\n```\n\n5. We initialize the `issues` property to an empty array. If you\
    \ want to get started with sample data, you can use the `mock-issues.ts` file\
    \ from the `src\\assets` folder that exists in the GitHub material of this chapter\
    \ and import it as follows:\n\n```\n```typescript\nimport { issues } from '../assets/mock-issues';\n\
    ```\n```\n\nIn the following section, we will create a component for displaying\
    \ those issues.\n\n# Visualizing issues in a data grid\n\nWe are going to use\
    \ the **data grid** UI component of the Clarity library to display data in a tabular\
    \ format. A data grid also provides mechanisms for filtering and sorting out of\
    \ the box. Let's create the Angular component that will host the data grid first:\n\
    \n+   1. Use the `generate` command of the Angular CLI to create the component:\n\
    \n```\n```bash\nng generate component issue-list\n```\n```"

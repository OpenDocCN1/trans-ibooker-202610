  md: "# Reporting new issues\n\nOne of the main features of our issue tracking system\
    \ is the ability to report new issues. We will use Angular reactive forms to create\
    \ a form for adding new issues. The feature can be further subdivided into the\
    \ following tasks:\n\n+   - Setting up reactive forms in an Angular application\n\
    +   - Creating the report issue form\n+   - Displaying a new issue in the list\n\
    +   - Validating the details of an issue\n\nLet’s begin by introducing reactive\
    \ forms in our Angular application.\n\n# Setting up reactive forms in an Angular\
    \ application\n\nReactive forms are defined in the @angular/forms npm package\
    \ of the Angular framework:\n\n+   1. Open the app.module.ts file and import ReactiveFormsModule:\n\
    +   2. Add ReactiveFormsModule into the imports array of the @NgModule decorator:\n\
    \n```\nimport { ReactiveFormsModule } from '@angular/forms';\n```\n\n```\n@NgModule({\n\
    \  declarations: [\n    AppComponent,\n    IssueListComponent\n  ],\n  imports:\
    \ [\n    BrowserModule,\n    ClarityModule,\n    BrowserAnimationsModule,\n  \
    \  ReactiveFormsModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n\
    })\n```"
  merge: -1
  img_proc: true
- pgno: 86

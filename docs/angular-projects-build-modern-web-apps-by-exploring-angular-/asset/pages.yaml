    # # Resolving an issue


    The main idea behind having an issue tracking system is that an issue should be
    resolved at some point. We will create a user workflow in our application to accomplish
    such a task. We will be able to resolve an issue directly from the list of pending
    issues. The application will ask for confirmation from the user before resolving
    with the use of a modal dialog:


    +   1. Create an Angular component to host the dialog:


    ```

    ```

    ng generate component confirm-dialog

    ```

    ```'

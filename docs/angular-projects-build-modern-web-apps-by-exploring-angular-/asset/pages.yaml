    # # Essential background theory and context


    The Angular framework provides two types of forms that we can use:


    +   - **Template-driven:** They are easy and straightforward to set up in an Angular
    application. Template-driven forms do not scale well and are difficult to test
    because they are defined in the template of the component.

    +   - **Reactive:** They are based on a reactive programming approach. Reactive
    forms operate in the TypeScript class of the component, and they are easier to
    test and scale better than template-driven forms.


    In this chapter, we will get hands-on with the reactive forms approach, which
    is the most popular in the Angular community.


    Angular components can get data either from external sources such as HTTP or from
    other Angular components. In the latter case, they interact with components that
    have data using a public API:


    +   - `@Input()`: This is used to pass data into a component.

    +   - `@Output()`: This is used to get notified about changes or get data back
    from a component.


    Clarity is a design system that contains a set of UX and UI guidelines for building
    web applications. It also consists of a proprietary HTML and CSS framework packed
    with these guidelines. Luckily, we do not have to use this framework since Clarity
    already provides a wide variety of Angular-based UI components that we can use
    in our Angular applications.


    # # Project overview


    In this project, we will build an Angular application for managing and tracking
    issues using reactive forms and Clarity. Initially, we will display a list of
    issues in a table that we can sort and filter. We will then create a form for
    allowing users to report new issues. Finally, we will create a modal dialog for
    resolving an issue. We will also go the extra mile and turn on suggestions when
    reporting an issue to help users avoid duplicate entries.


    Build time: 1 hour'

  md: '# # Foreword


    Angular is a powerful web framework that helps teams build robust scalable applications.
    Angular continues to evolve but the core values remain the same: build a platform
    developers love to use, enable developers to build applications that users love
    to use, and have a community where everyone feels welcomed


    *Angular Projects* is a book that embraces these values and takes a unique approach
    to empower new and experienced developers to build great applications using Angular.
    Aristeidis uses a project-driven approach to help learners understand modern Angular
    techniques in an intriguing and accessible way.


    This guide will help learners to build their first application with the powerful
    Angular CLI, take advantage of Angular''s strong PWA integration, build performant
    static applications with Scully, and more. This book will add significant value
    to developers looking to get the most out of their Angular experience


    As Angular continues to power incredible experiences inside Google and across
    the web this book will serve as an excellent learning resource for developers
    looking to build great apps.


    *Mark Thompson*


    *Angular Team at Google*'

- pgno: 211
  md: '# # 7


    # Building an SSR Application for a GitHub Portfolio Using Angular


    A typical Angular application follows the **Single-Page Application** (SPA) approach,
    where each page is created in the DOM of the browser while the user interacts
    with the application. A web server hosts the application and is responsible for
    serving only the main page, usually called `index.html`, at application startup.


    **Server-Side Rendering** (SSR) is a technique that follows an entirely different
    approach for application rendering than SPA. It uses the server to prerender pages
    while they are requested at runtime from the user. Rendering content on the server
    dramatically enhances the performance of a web application and improves its **Search
    Engine Optimization** (SEO) capabilities. To perform SSR in an Angular application,
    we use a library called **Angular Universal**.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'In this chapter, we will learn how to benefit from Angular Universal by building
    a portfolio application using the **GitHub API**. We will cover the following
    topics:


    +   - Building an Angular application with the GitHub API

    +   - Integrating Angular Universal

    +   - Prerendering content during build

    +   - Enhancing SEO capabilities

    +   - Replaying events with preboot


    # # Essential background theory and context


    An Angular application consists of several pages that are created dynamically
    in the DOM of the browser by the Angular framework while we use the application.
    Angular Universal enables the Angular framework to create these pages on the server
    statically during application runtime. In other words, it can create a fully static
    version of an Angular application that can run even without needing to have JavaScript
    enabled. Prerendering an application on the server has the following advantages:


    +   - It allows web crawlers to index the application and make it discoverable
    and linkable on social media websites.

    +   - It makes the application usable to mobile and other low-performant devices
    that cannot afford to execute JavaScript on their side.

    +   - It improves the user experience by loading the first page quickly and, at
    the same time, loading the actual client page in the background (**First Contentful
    Paint (FCP)**).


    > **Important note**

    > The application does not respond to user events during the FCP other than navigation
    events initiated from the `routerLink` directive of the Angular router. However,
    we can use a special-purpose library called **preboot** to replay those events
    after the entire application has been loaded.


    The GitHub API is an HTTP REST API for interacting with GitHub data. It can be
    used either publicly or in private using an authentication mechanism provided
    out of the box.'
  merge: -1
  img_proc: true
- pgno: 213
  md: "> **Important note**\n> \n> Unauthorized requests to the GitHub API are limited\
    \ to 60 requests per hour. For an overview of available authentication methods,\
    \ you can find more details at `https://docs.github.com/en/rest/overview/other-authentication-methods`.\n\
    \nTo communicate over HTTP in Angular, we use the built-in HTTP client that is\
    \ available in the `@angular/common/http` npm package. Interacting with HTTP in\
    \ SSR applications may result in duplicated HTTP requests due to the page prerendering\
    \ at the FCP. However, Angular Universal can overcome this type of duplication\
    \ using a mechanism called **TransferState**.\n\n# ## Project overview\n\nIn this\
    \ project, we will build a portfolio application for our GitHub user profile.\
    \ We will initially use the Angular CLI to scaffold an Angular application that\
    \ interacts with the GitHub API. We will learn how to use the GitHub API and fetch\
    \ user-specific data. We will also use the **Bootstrap CSS** library to style\
    \ our application and create a beautiful user interface.\n\nAfter creating our\
    \ Angular application, we will turn it into a server-side rendered application\
    \ using Angular Universal. We will see how to install and configure Angular Universal,\
    \ and we will learn how to prerender it during build time. Then, we will configure\
    \ our application to be correctly rendered using SEO in the most popular social\
    \ platforms. Finally, we will find out how to use the preboot library to play\
    \ back browser events that are not fully supported in SSR applications.\n\nBuild\
    \ time: 2 hours\n\n# ## Getting started\n\nThe following prerequisites and software\
    \ tools are required for completing this project:\n\n+   - **GitHub account:**\
    \ A valid GitHub user account.\n+   - **Angular CLI:** A CLI for Angular that\
    \ you can find at `https://angular.io/cli`.\n+   - **GitHub material:** The related\
    \ code for this chapter can be found in the Chapter07 folder at `https://github.com/PacktPublishing/Angular-Projects-Second-Edition`."
  merge: -1
  img_proc: true
- pgno: 214
  md: "# # Building an Angular application with the GitHub API\n\nGitHub contains\
    \ an API that we can use to fetch various information about the profile of a GitHub\
    \ user. The Angular application that we are building will communicate with the\
    \ GitHub API and display a brief portfolio for our GitHub profile. Our application\
    \ will consist of the following features:\n\n+   - **Dashboard:** This will be\
    \ the landing page of the application, and it will display a summary of our GitHub\
    \ profile.\n+   - **Info:** This will display personal information about us.\n\
    +   - **Repositories:** This will display a list of our *public* repositories.\n\
    +   - **Organizations:** This will display a list of GitHub organizations of which\
    \ we are members.\n\n> **Important note**\n> \n> The resulting output of each\
    \ feature that is displayed in the screenshots of this chapter will be different\
    \ according to your GitHub profile.\n\nThe dashboard will be the main page of\
    \ the application, and it will contain all the other features. We will learn how\
    \ to build the dashboard page in the following section.\n\n# ## Building the dashboard\n\
    \nBefore we can start creating the main features of our application, we need to\
    \ scaffold and configure an Angular application first by running the following\
    \ command:\n\n```\n```bash\nng new gh-portfolio --routing=false --style=scss\n\
    ```\n```\n\nThe preceding command will use the `ng new` command of the Angular\
    \ CLI, passing the following options:\n\n+   - `gh-portfolio`: The name of the\
    \ Angular application that we want to create\n+   - `--routing=false`: Disables\
    \ routing because our application will consist of a single page\n+   - `--style=scss`:\
    \ Configures the Angular application to use the SCSS stylesheet format when working\
    \ with CSS styles"
  merge: -1
  img_proc: true
- pgno: 215
  md: 'We will use the Bootstrap CSS library for styling our portfolio application.
    Let''s see how to install and configure it in the Angular CLI application that
    we have just created:


    +   1. Execute the following npm command to install the Bootstrap CSS library:


    ```

    npm i bootstrap

    ```


    +   2. Open the src\styles.scss file and import the Bootstrap SCSS stylesheet:


    ```

    @import "~bootstrap/scss/bootstrap";

    ```


    The styles.scss file contains CSS styles that are applied globally to the application.
    The @import CSS rule accepts the absolute path of a stylesheet file that we want
    to load.


    > **Important note**

    > When we import a stylesheet format using the @import rule, we omit the extension
    of the file.


    The ~ character denotes the node_modules folder in the root folder of our Angular
    CLI application.


    +   3. Execute the following command to install Bootstrap Icons, a free and open
    source icon library:


    ```

    npm install bootstrap-icons

    ```


    Bootstrap Icons can be used in various formats, such as SVG or font. In this project,
    we are going to use the latter.


    +   4. Import the font icons format of the Bootstrap Icons library into the styles.scss
    file:


    ```

    @import "~bootstrap/scss/bootstrap";

    @import "~bootstrap-icons/font/bootstrap-icons";

    ```


    We have already created the Angular application and added the necessary artifacts
    for styling it. We are now ready to start creating the main page of our Angular
    application:


    +   1. Download an Angular logo of your choice from the press kit of the official
    Angular documentation at https://angular.io/presskit.

    +   2. Copy the downloaded logo file into the src\assets folder of the Angular
    CLI workspace. The assets folder is used for static files such as images, fonts,
    and JSON files.'
  merge: -1
  img_proc: true

  md: "The previous approach is called **lazy loading** and improves the startup and\
    \ the overall performance of an Angular application. It creates a separate bundle\
    \ for each lazy-loaded module, which is loaded upon request, reducing the final\
    \ bundle size and the memory consumption of your application. Let's wire up the\
    \ new route to our header component:\n\n+   1. Open the `header.component.html`\
    \ file and add the following `routerLink` and `routerLinkActive` directives to\
    \ the Articles anchor HTML element:\n+   \n+   ```html\n+   <li class=\"nav-item\"\
    >\n+       <a routerLink=\"/articles\" routerLinkActive=\"active\"\n+        \
    \  class=\"nav-link\">Articles</a>\n+   </li>\n+   ```\n+   \n+   2. Run `ng serve`\
    \ and use your favorite browser to preview your application.\n+   3. Open the\
    \ developer tools of your browser, click on the **Articles** link and inspect\
    \ the **Network** tab:\n\n![](img/efea53d01337e7b223389b38dcdb0160_58_0.png)\n\
    \nAmong other requests, you should see one named **articles-articles-module.js**.\
    \ It is the bundle of the lazy-loaded articles module that was loaded when you\
    \ clicked on the **Articles** link."

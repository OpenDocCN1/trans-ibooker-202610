  md: "4. Open the card-list.component.ts file and add the following import statements:\n\
    \n```\nimport { Component, Input, Output, OnInit, EventEmitter } from '@angular/core';\n\
    import { Card } from '../card';\nimport { CdkDragDrop, moveItemInArray } from\
    \ '@angular/cdk/drag-drop';\n```\n\n5. Create an output property using the @Output\
    \ decorator and use it in the sortCards component method to emit the re-ordered\
    \ list to the consumer of the component, as follows:\n\n```\nexport class CardListComponent\
    \ implements OnInit {\n  @Input() cards: Card[] = [];\n  @Output() cardChange\
    \ = new EventEmitter<Card[]>();\n\n  constructor() { }\n\n  ngOnInit(): void {\n\
    \  }\n\n  sortCards(event: CdkDragDrop<string[]>): void {\n    moveItemInArray(this.cards,\
    \ event.previousIndex, event.currentIndex);\n    this.cardChange.emit(this.cards);\n\
    \  }\n}\n```\n\nIn the previous code snippet, we use the moveItemInArray built-in\
    \ method of DragDropModule to change the order of the cards property. We pass\
    \ the event parameter to the moveItemInArray method containing the previous and\
    \ current index of the moved card. We also use the emit method of the cardChange\
    \ property to propagate the change back to the Angular application."

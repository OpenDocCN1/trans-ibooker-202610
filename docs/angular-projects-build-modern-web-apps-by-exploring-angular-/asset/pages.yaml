- pgno: 242
  md: "If you preview the portfolio application and inspect the **Network** tab of\
    \ your browser, you will notice that it does not make additional HTTP requests.\
    \ `TransferHttpCacheModule` intercepted all HTTP requests and stored them in the\
    \ `TransferState` store of our application. TransferState is a key-value store\
    \ that can be transferred from the server to the browser. The browser version\
    \ of the application later can read the HTTP responses directly from the store\
    \ without making an extra call.\n\nWe now have a fully prerendered version of\
    \ our GitHub portfolio. But how can we optimize it further so that we can share\
    \ it on a social media platform? We will learn more about SEO optimization techniques\
    \ in the following section.\n\n# Enhancing SEO capabilities\n\n**SEO** is the\
    \ process of optimizing a website to be correctly indexed from a web crawler.\
    \ A web crawler is a special-purpose software that is present on most search engines\
    \ and can identify and index websites so that they are easily discoverable and\
    \ linkable through their platforms.\n\nAngular Universal does a great job of SEO\
    \ by prerendering content during build time. Some web crawlers cannot execute\
    \ JavaScript and build the dynamic content of an Angular application. Prerendering\
    \ with Angular Universal eliminates the need for JavaScript, thus allowing web\
    \ crawlers to do their best to identify the web application.\n\nWe can also help\
    \ SEO by defining several tags in the `head` element of the main `index.html`\
    \ file of an Angular application, such as `title`, `viewport`, and `charset`:\n\
    \n# index.html\n\n```\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
    utf-8\">\n  <title>GhPortfolio</title>\n  <base href=\"/\">\n  <meta name=\"viewport\"\
    \ content=\"width=device-width,\n    initial-scale=1\">\n  <link rel=\"icon\"\
    \ type=\"image/x-icon\" href=\"favicon.ico\">\n</head>\n<body>\n```"
  merge: -1
  img_proc: true
- pgno: 243
  md: "```\n<app-root></app-root>\n</body>\n</html>\n```\n\nYou can find a list of\
    \ available tags at https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta/name.\n\
    \nHowever, setting a tag in the index.html file is not adequate, especially when\
    \ an Angular application has routing enabled and contains several routes. The\
    \ Angular framework provides a couple of handy services that we can use to set\
    \ tags programmatically. First, let's see how to set the title tag in our application:\n\
    \n+   1. Open the app.component.ts file and import the Title and OnInit Angular\
    \ artifacts:\n\n```\nimport { Component, OnInit } from '@angular/core';\nimport\
    \ { environment } from\n'../environments/environment';\nimport { Title } from\
    \ '@angular/platform-browser';\n```\n\n+   2. Inject the Title service into the\
    \ constructor of the AppComponent class:\n\n```\nexport class AppComponent {\n\
    \  username = environment.username;\n\n  constructor(private title: Title) {}\n\
    }\n```\n\n+   3. Add the OnInit interface to the implemented interface list of\
    \ the component and call the setTitle method of the title variable in the ngOnInit\
    \ method:\n\n```\nexport class AppComponent implements OnInit {\n  username =\
    \ environment.username;\n\n  constructor(private title: Title) {}\n\n  ngOnInit()\
    \ {\n    this.title.setTitle('GitHub portfolio app');\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 244
  md: "+   4. Run `npm run dev:ssr` to preview the application, and you should see\

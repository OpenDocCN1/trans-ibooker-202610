    \  <mat-card-title>{{poi.name}}</mat-card-title>\n    </mat-card-header>\n   \
    \ <img mat-card-image [src]=\"poi.imgUrl\">\n    <mat-card-content>\n      <p>{{poi.description}}</p>\n\
    \    </mat-card-content>\n  </mat-card>\n</map-info-window>\n</google-map>\n```\n\

    \ that we will need to work with forms, as we will see in the following section.\n\
    \n# Creating the report issue form\n\nNow that we have introduced reactive forms\
    \ in our Angular application, we can start building our form:\n\n+   1. Create\
    \ a new Angular component named `issue-report`:\n\n```\nng generate component\

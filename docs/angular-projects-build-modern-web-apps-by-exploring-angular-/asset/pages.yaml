  md: "> **Important note**\n> We are using Google Maps in development mode in this\
    \ project. For production environments, you should get an API key at https://developers.google.com/maps/gmp-get-started\
    \ and include it in the Google Maps JavaScript API script that you load in the\
    \ index.html file such as `<script src=\"https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY\"\
    ></script>`.\n\nWe have now completed all the required features for the portal\
    \ of our visitors. Well done! Implementing the basic functionality of the visitor\
    \ portal required interacting with NgRx for managing the global state of our application.\
    \ The global state was separated into the root state for the application and the\
    \ feature state for the visitor portal. The latter was used in the visitor library\
    \ to create Angular components for displaying a POI list and selecting one to\
    \ view in Google Maps.\n\nIn the next section, we will build the administrator\
    \ portal to get visit statistics for each POI.\n\n# # Visualizing data with graphs\n\
    \nThe administrator portal will be responsible for displaying traffic visits for\
    \ each POI using a chart. Traffic will be generated when a visitor visits a POI\
    \ by clicking its marker on the map. The application will persist visit data in\
    \ the local storage of the browser. It will keep a record for each visit containing\
    \ the ID of the POI and the total visits. The administrator portal will consist\
    \ of the following features:\n\n+   - Persisting visit data in the store\n+  \
    \ - Displaying visit statistics\n\nWe will start building the administrator portal\
    \ by implementing the mechanism of keeping track of visits in the following section.\n\
    \n# # Persisting visit data in the store\n\nOur application does not record traffic\
    \ statistics for POIs yet. Let's see how we can accomplish this task:\n\n+   1.\
    \ Open the map.component.html file and add a map-info-window component:\n\n```\n\
    ```html\n<google-map height=\"100%\" width=\"auto\" *ngIf=\"poi$ |\n  async as\
    \ poi\" [center]=\"poi\">\n  <map-marker [position]=\"poi\"></map-marker>\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 277

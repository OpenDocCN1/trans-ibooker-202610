- pgno: 330
  md: 'In the preceding statement, we first use the externalSchematic method to call
    the built-in generation schematic for creating Angular services. Then, we merge
    the result from executing that schematic with our templateSource variable. We
    also define the strategy of the merge operation using MergeStrategy.Overwrite
    so that any changes made by our schematic will overwrite the default ones.


    Our schematic for creating CRUD services is now complete. Let''s use it in our
    sample application:


    +   1. Execute the following command to build the schematics library:


    ```

    npm run build

    ```


    > Tip

    > We do not need to link the schematics library again. Our application will be
    automatically updated as soon as we make a new build of our schematics.


    +   2. Navigate to the my-app folder in which our application resides.


    +   3. Execute the following command to generate an Angular service using our
    new schematic:


    ```

    ng generate my-schematics:crud-service --name=customers

    ```


    We use the generate command of the Angular CLI, passing the name of our schematics
    collection again but targeting the crud-service schematic this time.


    +   4. The new Angular service is created in the src\app folder as indicated by
    the output in the terminal window:


    ```

    CREATE src/app/customers.service.spec.ts (372 bytes)

    CREATE src/app/customers.service.ts (545 bytes)

    ```


    Figure 10.2 – Generating an Angular service


    Notice that the schematic has generated a unit test file for us automatically.
    How is this possible? Well, recall that we merged our schematic with the built-in
    generate schematic of the Angular CLI. So, whatever the default schematic does,
    it reflects directly to the execution of the custom schematic.


    We have just added a new helpful command to our schematics collection. We can
    generate an Angular service that interacts with HTTP endpoints. Moreover, we have
    added the fundamental methods that will be needed for communicating with the endpoint.'

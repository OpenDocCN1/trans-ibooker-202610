- pgno: 279
  md: "8. Click on the POI marker on the map, and you should get an output similar\
    \ to the following:\n\n![](img/efea53d01337e7b223389b38dcdb0160_279_0.png)\n\n\
    Figure 8.20 – Map information window\n\nWe consider that a POI is visited when\
    \ the visitor clicks on the map marker and the information window appears. Our\
    \ application will then notify the store of that action to save it in the local\
    \ storage. Let's create the logic for interacting with the store:\n\n+   1. Open\
    \ the poi.actions.ts file and create a new action indicating that a POI has been\
    \ visited:\n\n```\nexport const visitPoi = createAction(\n  '[Poi/API] Visit Poi',\n\
    \  props<{ poiId: string | number }>(\n)\n```\n\n+   2. Open the poi.effects.ts\
    \ file and add the following import statement:\n\n```\nimport { EMPTY } from 'rxjs';\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 280
  md: "+   3. Create a new effect that listens to the `visitPoi` action and increases\
    \ the total visits of the specified `poiId` by *one*:\n\n```\n```typescript\n\
    visit$ = createEffect(() =>\n  this.actions$.pipe(\n    ofType(PoiActions.visitPoi),\n\
    \    fetch({\n      run: action => {\n        const stat = localStorage.getItem('tour-'\
    \ + action.poiId);\n        const total = stat ? Number(stat) + 1 : 1;\n     \
    \   localStorage.setItem('tour-' + action.poiId, total.toString());\n        return\
    \ EMPTY;\n      }\n    })\n  )\n);\n```\n```\n\nIn the preceding code, we fetch\
    \ the local storage key that begins with the word `tour-` followed by the POI\
    \ ID. If there is one, we increment it by *one* and update the local storage.\
    \ Otherwise, we initialize it to *one*.\n\n> **Tip**\n> In a real case, it would\
    \ be better to abstract the logic of `localStorage` in an Angular service that\
    \ would act as a wrapper over the global `localStorage` object. We encourage you\
    \ to create such a service while building this project.\n\nThe `run` method of\
    \ the effect returns the `EMPTY` RxJS operator, which causes the observable to\
    \ complete with no value.\n\n+   4. Open the `map.component.ts` file and import\
    \ `PoiActions` from the `@packt/poi` namespace:\n\n```\n```typescript\nimport\
    \ { PoiActions, PoiSelectors } from '@packt/poi';\n```\n```"
  merge: -1
  img_proc: true
- pgno: 281
  md: "+   5. Modify the `showInfo` component method so that it dispatches a `visitPoi`\
    \ action to the store:\n\n```\n```typescript\nshowInfo(marker: MapMarker, poiId:\
    \ string | number) {\n  this.store.dispatch(PoiActions.visitPoi({ poiId }));\n\
    \  this.info?.open(marker);\n}\n```\n```\n\n+   6. Finally, open the `map.component.html`\
    \ file and pass the selected POI ID into the `showInfo` method:\n\n```\n```html\n\
    <map-marker #marker=\"mapMarker\" [position]=\"poi\"\n  (mapClick)=\"showInfo(marker,\
    \ poi.id)\"></map-marker>\n```\n```\n\nOur application can now record the visits\
    \ of each POI and keep them in the local storage of the browser. In the following\
    \ section, we will create the main component of the administrator portal that\
    \ leverages visit data.\n\n# Displaying visit statistics\n\nThe administrator\
    \ portal will display visit statistics on its main component with a graph. We\
    \ will use the **ng2-charts** library for visualizing data on a pie chart. Let's\
    \ see how to add the required functionality in that component:\n\n+   1. Install\
    \ the ng2-charts library using the following command:\n\n```\n```bash\nnpm install\
    \ ng2-charts chart.js@2.9.3\n```\n```\n\nThe preceding command will also install\
    \ the `chart.js` library, which is at the core of the ng2-charts library.\n\n\
    +   2. Open the `admin.module.ts` file and import `PoiModule` from the `@packt/poi`\
    \ namespace and `ChartsModule` from the ng2-charts npm package:\n\n```\n```typescript\n\
    import { NgModule } from '@angular/core';\nimport { CommonModule } from '@angular/common';\n\
    import { AdminComponent } from './admin.component';\nimport { RouterModule } from\
    \ '@angular/router';\nimport { PoiModule } from '@packt/poi';\nimport { ChartsModule\
    \ } from 'ng2-charts';\n```\n```"

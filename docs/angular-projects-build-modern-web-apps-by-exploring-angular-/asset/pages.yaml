  md: "The global state of the application does not currently know when a POI has\
    \ been selected. We need to add the necessary code for setting the selected POI\
    \ and interacting with the store:\n\n1. Open the poi.actions.ts file and add a\
    \ new action for passing the ID of the selected POI:\n\n```\nexport const selectPoi\
    \ = createAction(\n  '[Poi/API] Select Poi',\n  props<{ poiId: string | number\
    \ }>()\n);\n```\n\n2. Open the poi.reducer.ts file and add a new statement in\
    \ the poiReducer property that will listen to the selectPoi action and save the\
    \ selected POI in the store:\n\n```\nconst poiReducer = createReducer(\n  initialState,\n\
    \  on(PoiActions.init, (state) => ({ ...state, loaded: false, error: null })),\n\
    \  on(PoiActions.loadPoiSuccess, (state, { poi }) =>\n    poiAdapter.setAll(poi,\
    \ { ...state, loaded: true })\n  ),\n  on(PoiActions.loadPoiFailure, (state, {\
    \ error }) =>\n    ({ ...state, error })),\n  on(PoiActions.selectPoi, (state,\
    \ { poiId }) => ({\n    ...state, selectedId: poiId }))\n);\n```\n\n3. Open the\
    \ poi-list.component.ts file and import the PoiEntity interface:\n\n```\nimport\
    \ { Component, OnInit } from '@angular/core';\nimport { Store } from '@ngrx/store';\n\
    import { PoiActions, PoiEntity, PoiSelectors } from '@packt/poi';\n```"
  merge: -1
  img_proc: true

  md: "5. To preview the application, run `ng serve` and open your browser at `http://localhost:4200`.\
    \ You should then see something like this:\n\n# Assassins Creed Series\n\n![](img/efea53d01337e7b223389b38dcdb0160_300_0.png)\n\
    \nFigure 9.2 – Card list component\n\nThe card list component displays data that\

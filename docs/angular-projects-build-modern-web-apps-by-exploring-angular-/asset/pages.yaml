    ## Forms


    Web applications use HTML forms to collect data from users and validate them,
    such as when logging in to an application, performing a search, or completing
    an online payment. The Angular framework provides two types of forms, reactive
    and template-driven, that we can use in an Angular application.


    In this chapter, we will build a system for managing and tracking issues. We will
    use Angular reactive forms for reporting new issues. We will also use **Clarity
    Design System** from VMware for designing our forms and displaying our issues.


    We will cover the following topics:


    +   - Installing the Clarity Design System to an Angular application

    +   - Displaying an overview of issues

    +   - Reporting new issues'

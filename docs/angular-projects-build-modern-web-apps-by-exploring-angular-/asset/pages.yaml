- pgno: 110
  md: "We will cover the following topics in detail:\n\n+   - Setting up the OpenWeather\
    \ API\n+   - Displaying weather data\n+   - Enabling offline mode with the service\
    \ worker\n+   - Staying up to date with in-app notifications\n+   - Deploying\
    \ our app with **Firebase** hosting\n\n# Essential background theory and context\n\
    \nTraditional web applications are usually hosted in a web server and are immediately\
    \ available to any user at any given time. Native applications are installed on\
    \ the device of the user, have access to its native resources, and can work seamlessly\
    \ with any network. PWA applications stand between the two worlds of web and native\
    \ applications and share characteristics from both. A PWA application is a web\
    \ application that is based on the following pillars to convert into a native\
    \ one:\n\n+   - **Capable:** It can access locally saved data and interact with\
    \ peripheral hardware that is connected to the device of the user.\n+   - **Reliable:**\
    \ It can have the same performance and experience in any network connection, even\
    \ in areas with low connectivity and coverage.\n+   - **Installable:** It can\
    \ be installed on the device of the user, can be launched directly from the home\
    \ screen, and interact with other installed native applications.\n\nConverting\
    \ a web application into a PWA involves several steps and techniques. The most\
    \ essential one is configuring a service worker. The service worker is a mechanism\
    \ that is run on the web browser and acts as a proxy between the application and\
    \ an external HTTP endpoint or other in-app resources such as JavaScript and CSS\
    \ files. The main job of the service worker is to intercept requests to those\
    \ resources and act on them by providing a cached or live response.\n\n> **Important\
    \ note**\n> \n> The service worker is persisted after the tab of the browser is\
    \ closed.\n\nThe Angular framework provides an implementation for the service\
    \ worker that we can use to convert our Angular applications into PWA."
  merge: -1
  img_proc: true

- pgno: 249
  md: '# # 8


    # Building an Enterprise Portal Using Nx Monorepo Tools and NgRx


    Typical enterprise applications usually consist of a backend and a frontend system.
    The backend is responsible for interacting with a database for data persistence
    and exposes a REST API. The frontend communicates with the backend system via
    the REST interface to exchange data. In some cases, the frontend system can consist
    of more than one application, including a web interface or a mobile application.
    Keeping all these applications and systems in separate source control repositories
    does not scale well, and it is not easy to maintain and build. Alternatively,
    we can follow **monorepo** architecture for such large enterprise applications,
    where each application resides in a separate location inside the same repository.


    A popular tool in the Angular ecosystem that embraces monorepo architecture is
    **Nx Dev Tools**. Combining an Nx monorepo application with a state management
    library can significantly level up your application. **NgRx**, a popular state
    management library for Angular applications, can help us keep a consistent and
    manageable state globally.'
  merge: -1
  img_proc: true

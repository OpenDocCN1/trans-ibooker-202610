    \n    [alt]=\"weather.weather[0].main\">\n  <mat-card-content>\n    <h1>{{weather.main.temp\
    \ | number:'1.0-0'}} &#8451;</h1>\n    <p>Pressure: {{weather.main.pressure}}\
    \ hPa</p>\n    <p>Humidity: {{weather.main.humidity}} %</p>\n    <p>Wind: {{weather.wind.speed}}\
    \ m/s</p>\n  </mat-card-content>\n</mat-card>\n```\n```"

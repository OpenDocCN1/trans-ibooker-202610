- pgno: 289
  md: '# # 9

    # Building

    a Component

    UI Library Using

    Angular CLI and

    Angular CDK


    An Angular application consists of Angular components that are organized into
    modules. When components need to share a similar appearance or behavior across
    modules, we extract their functionality into reusable components and group them
    in a shared module. Reusable components may vary from complex **user interface**
    (UI) structures with many controls (such as forms) up to single native **HyperText
    Markup Language (HTML)** elements (such as buttons).


    A component UI library is a collection of reusable components that can be used
    outside of a specific application domain. A large enterprise application built
    with a monorepo architecture can use these components across all its applications.
    A project outside of an organization can also use the same component library as
    an external dependency.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'The Angular **command-line interface (CLI)** includes all the necessary tooling
    for creating libraries with Angular. The **Angular Component Dev Kit (CDK)** provides
    a broad range of functionalities for creating accessible and high-performant UI
    components. In this chapter, we will combine them with **Bulma**, a modern **Cascading
    Style Sheets (CSS)** framework, to create a simple component UI library from scratch.


    In this chapter, we will cover the following topics in more detail:


    +   - Creating a library with the Angular CLI

    +   - Building a draggable card list

    +   - Interacting with the clipboard

    +   - Publishing an Angular library to npm

    +   - Using components as Angular elements


    # Essential background theory and context


    The Angular CDK contains a collection of common interactions and behaviors that
    we can apply to Angular components. It is at the heart of the Angular Material
    library, but can be used with any CSS framework in an Angular application. The
    Angular CDK is available from the @angular/cdk npm package.


    The Angular CLI supports creating Angular libraries out of the box. The functionality
    of an Angular library can be used only in Angular applications, and it is decoupled
    from specific business logic. If we want to use an Angular library in a non-Angular
    application, we need to convert it into Angular elements.


    **Custom elements** are a web standard that allows the creation of HTML elements,
    independent of any JavaScript framework. It works by declaring a custom HTML tag
    and associating it with a JavaScript class. The browser can identify the HTML
    tag and execute the JavaScript code that is defined inside the class.


    Angular elements are Angular components converted to custom elements using the
    @angular/elements npm package. Packaging an Angular component as a custom element
    connects the Angular framework to the **Document Object Model (DOM)**, enriching
    the native HTML element with data binding, component life cycle, and change detection
    features.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Project overview


    In this project, we will build a component UI library for our Angular projects.
    Initially, we will use the Angular CLI to scaffold a new Angular workspace for
    our library. We will then use the Angular CDK and the Bulma CSS framework to create
    the following components:


    +   - A list of cards that we can rearrange using drag-and-drop features

    +   - A button that will allow us to copy arbitrary content to the clipboard


    We will learn how to deploy the library into a package registry such as npm. Finally,
    we will convert one of our components into an Angular element for sharing it with
    non-Angular applications, using the ngx-build-plus library.


    Build time: 1½ hours


    # Getting started


    The following prerequisites and software tools are required for completing this
    project:


    +   - Angular CLI: A CLI for Angular that you can find at https://angular.io/cli.

    +   - GitHub material: The related code for this chapter can be found in the Chapter09
    folder at https://github.com/PacktPublishing/Angular-Projects-Second-Edition.


    # Creating a library with the Angular CLI


    Before we can start working with Angular libraries using the Angular CLI, we need
    to create an Angular CLI workspace. The Angular CLI workspace will contain our
    Angular library and an Angular application for testing the library.


    Use the following command to generate a new Angular CLI workspace:


    ```

    ng new my-components --defaults

    ```


    The preceding command will create a new Angular CLI workspace that contains an
    Angular application named my-components. Navigate to the my-components folder
    and execute the following command to generate a new Angular library:


    ```

    ng generate library ui-controls

    ```'
  merge: -1
  img_proc: true
- pgno: 292
  md: "The preceding command will create a `ui-controls` library inside the `projects`\
    \ folder of the workspace. It will contain various files similar to those when\
    \ creating an Angular application, including the following:\n\n+   - `src\\lib`:\
    \ This contains the source code of the library, such as modules, components, and\
    \ services.\n+   - `src\\public-api.ts`: This exports artifacts from the library\
    \ that we want to make publicly available in other Angular applications.\n+  \
    \ - `ng-package.json`: This contains a configuration for the ng-packagr library\
    \ that the Angular CLI uses under the hood for building libraries.\n+   - `tsconfig.lib.json`:\
    \ The TypeScript configuration file for our library that also contains several\
    \ Angular compiler options.\n+   - `tsconfig.lib.prod.json`: The TypeScript configuration\
    \ file that is used when building our library in production mode.\n\nThe Angular\
    \ CLI will generate a module, a component, and a service in the `src\\lib` folder\
    \ for us by default. It will also export them so that they can be used by any\
    \ Angular application that will use the library. You can see an example of this\
    \ here:\n\n# public-api.ts\n\n```\n/*\n * Public API Surface of ui-controls\n\
    \ */\n\nexport * from './lib/ui-controls.service';\nexport * from './lib/ui-controls.component';\n\
    export * from './lib/ui-controls.module';\n```\n\nNow that we have set up our\
    \ Angular CLI workspace, we can go ahead and install the Bulma and the Angular\
    \ CDK libraries, as follows:\n\n+   1. Execute the following npm command to install\
    \ the Angular CDK:\n+   \n+      ```bash\n+      npm install @angular/cdk\n+ \
    \     ```\n+   \n+   2. Run the following command to install the bulma CSS framework:\n\
    +   \n+      ```bash\n+      npm install bulma\n+      ```"

    # Nx Console


    The Nx Console is a VSCode extension developed by the Nrwl team that provides
    a graphical user interface over the Angular CLI. It contains most of the Angular
    CLI commands, and it uses the Angular CLI internally to execute each one. We will
    learn more about this extension in the *Building our application with Nx Console*
    section.


    # Angular Language Service


    The Angular Language Service extension provides various enhancements while editing
    HTML templates in an Angular application, including the following:


    +   - Code autocompletion

    +   - Compile error messages

    +   - Go-to definition techniques


    Code autocompletion is a feature that helps us find the right property or method
    to use while typing. It works by displaying a list of suggestions while we start
    typing in HTML content:


    ![](img/efea53d01337e7b223389b38dcdb0160_24_0.png)


    Figure 1.3 – Code completion


    In the previous screenshot, when we start typing the word `ti`, the Angular Language
    Service suggests the `title` component property. Notice that code completion only
    works for the public properties and methods in a component.


    One of the most common issues when developing web applications is detecting errors
    before the application reaches production. This problem can be solved partially
    by the Angular compiler, which is bootstrapped upon building an Angular application
    for production. Moreover, the Angular Language Service can take this further by
    displaying compilation error messages far before our application reaches the compilation
    process:'

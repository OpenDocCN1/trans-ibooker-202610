  md: '+   - Communicating between Angular and Electron

    +   - Packaging a desktop application


    # Essential background theory and context


    Electron is a cross-platform framework that is used to build desktop applications
    for Windows, Linux, and Mac. Many popular applications are built with Electron,
    such as **Visual Studio Code**, **Skype**, and **Slack**. The Electron framework
    is built on top of Node.js and **Chromium**. Web developers can leverage their
    existing HTML, CSS, and JavaScript skills to create desktop applications without
    learning a new language such as C++ or C#.


    > **Tip**

    > Electron applications have many similarities with PWA applications. Consider
    building an Electron application for scenarios such as advanced filesystem manipulation
    or when you need a more native look and feel for your application. Another use
    case is when you are building a complementary tool for your primary desktop product
    and you want to ship them together.


    An Electron application consists of two processes:


    +   - **Main**: This interacts with the native local resources using the Node.js
    API.

    +   - **Renderer**: This is responsible for managing the user interface of the
    application.


    An Electron application can have only one main process that can communicate with
    one or more renderer processes. Each renderer process operates in complete isolation
    from the others.


    The Electron framework provides the `ipcMain` and `ipcRenderer` interfaces, which
    we can use to interact with these processes. The interaction is accomplished using
    **Inter-Process Communication (IPC)**, a mechanism that exchanges messages securely
    and asynchronously over a common channel via a Promise-based API.'
  merge: -1
  img_proc: true

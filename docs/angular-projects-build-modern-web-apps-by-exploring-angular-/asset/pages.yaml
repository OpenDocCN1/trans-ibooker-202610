    \ webpack.dev.config.js --watch\\\"\",\n\"build:electron\": \"ng build && webpack\
    \ --config\n  webpack.prod.config.js\",\n\"package\": \"electron-packager dist/my-editor\
    \ --\n  out=dist --asar\"\n}\n```\n```\n\nIn the preceding script, `electron-packager`\

  md: '# Summary


    In this project, we built an enterprise portal application for visiting POIs on
    a map and displaying visit statistics for each one. First, we saw how to use Nx
    Dev Tools to scaffold a new Nx monorepo application. Then, we created two different
    portals for our application, a visitor and an administrator one. We learned how
    to use the NgRx library in the visitor portal to maintain and manage the state
    of our application. Finally, we saw how to use a chart library in the administrator
    portal for displaying statistics for each POI.


    In the next chapter, we will use the Angular CLI to build a UI component library
    using the Angular CDK.



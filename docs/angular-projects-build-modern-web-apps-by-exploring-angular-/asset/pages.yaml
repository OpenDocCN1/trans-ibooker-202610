- pgno: 204
  md: "# Displaying photos on viewer\n\nThe next thing that we need to do for our\
    \ application to be ready is to display our photos on the map. We will get all\
    \ the photos from Firebase and add them to the viewer in the specified locations.\
    \ Let's see how we can accomplish that:\n\n+   1. Create a new Angular service\
    \ using the following command of the Ionic CLI:\n\n```\nionic generate service\
    \ cesium\n```\n\n+   2. Open the `cesium.service.ts` file and add the following\
    \ import statements:\n\n```\nimport { AngularFirestore } from '@angular/fire/firestore';\n\
    import { Cartesian3, Color, PinBuilder, Viewer } from 'cesium';\nimport { Observable\
    \ } from 'rxjs';\nimport { map } from 'rxjs/operators';\nimport { Photo } from\
    \ './photo';\n```\n\n+   3. Inject the `AngularFirestore` service in the constructor\
    \ of the `CesiumService` class and create a viewer property, which we will use\
    \ to store our `Viewer` object:\n\n```\nexport class CesiumService {\n\n  private\
    \ viewer: Viewer;\n\n  constructor(private firestore: AngularFirestore) { }\n\
    }\n```\n\n+   4. Create a `register` method to set the viewer property:\n\n```\n\
    register(viewer: Viewer) {\n  this.viewer = viewer;\n}\n```\n\n+   5. Create a\
    \ method to get the photos collection from Cloud Firestore:\n\n```\nprivate getPhotos():\
    \ Observable<Photo[]> {\n  return this.firestore.collection<Photo>('photos')\n\
    \    .snapshotChanges().pipe(\n      map(actions => actions.map(a => a.payload.doc.data()\n\
    \        as Photo))\n}\n```"
  merge: -1
  img_proc: true
- pgno: 205
  md: "```\n);\n}\n```\n\nIn the preceding method, we call the snapshotChanges method\
    \ to get the data of the photos collection. We have already learned that a collection\
    \ consists of doc objects. Thus, we can reach the actual photo object using the\
    \ data method on the doc property for each action object.\n\n+   6. Create the\
    \ following method for adding all the photos to the viewer:\n\n```\naddPhotos()\
    \ {\n  const pinBuilder = new PinBuilder();\n\n  this.getPhotos().subscribe(photos\
    \ => {\n    photos.forEach(photo => {\n      const entity = {\n        position:\
    \ Cartesian3.fromDegrees(photo.lng, photo.lat),\n        billboard: {\n      \
    \    image: pinBuilder.fromColor(Color.fromCssColorString('#de6b45'), 48).toDataURL()\n\
    \        },\n        description: `<img width=\"100%\" style=\"margin:auto; display:\
    \ block;\" src=\"${photo.url}\" />`\n      };\n      this.viewer.entities.add(entity);\n\
    \    });\n  });\n}\n```\n\nThe location of each photo on the viewer will be displayed\
    \ as a pin. Thus, we need to initialize a PinBuilder object first. The preceding\
    \ method subscribes to the getPhotos method to get all photos from Cloud Firestore.\
    \ For each photo, it creates an entity object that contains the position, which\
    \ is the location of the photo in degrees, and a billboard property that displays\
    \ a pin of 48 pixels in size. It also defines a description property that will\
    \ display the actual image of the photo when we click on the pin."

    \nFigure 7.7 – Browser tab title\n\nSimilar to the Title service, we can use the\
    \ Meta service to set meta tags for our application:\n\n+   1. Open the `app.component.ts`\
    \ file and import `Meta` from the `@angular/platform-browser` npm package:\n+\

    # Building the main menu


    Ionic provides a command-line tool called the Ionic CLI that is used to build
    and run an Ionic mobile application. Let''s see how we can install it and start
    building the main menu of our application:


    +   1. Install the Ionic CLI using the following npm command:


    ```

    npm install -g @ionic/cli cordova-res

    ```


    The cordova-res library is used to generate the icons and splash screens of our
    application for native mobile devices.


    +   2. Ionic has already created a Git repository for our Ionic application in
    our Git host. Clone the repository locally into your system and run the following
    command to install all the dependencies of the application:


    ```

    npm install

    ```


    +   3. Open the main HTML file of the application, index.html, and add the name
    of your application in the title tag:


    ```

    <title>Phototag App</title>

    ```


    +   4. Open the template file of the main component, app.component.html, and remove
    the second ion-list element. An ion-list element displays a collection of items
    in a list view.


    +   5. Add the name of your application in the ion-list-header element and change
    the text of the ion-note element:


    ```

    <ion-list-header>Phototag</ion-list-header>

    ```


    ```

    <ion-note>Capture geotagged photos</ion-note>

    ```'

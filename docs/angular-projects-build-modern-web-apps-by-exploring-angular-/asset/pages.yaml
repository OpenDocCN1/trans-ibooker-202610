- pgno: 112
  md: "We need to get an API key first to start using the OpenWeather API:\n\n+  \
    \ 1. Navigate to the OpenWeather API website: https://openweathermap.org/api.\n\
    +   \n+   You will see a list of all available APIs from the OpenWeather team.\n\
    +   2. Find the section entitled **Current Weather Data** and click on the **Subscribe**\
    \ button.\n+   \n+   You will be redirected to the page with the available pricing\
    \ schemes of the service. Each scheme supports a different combination of API\
    \ calls per minute and month. For this project, we are going to use the **Free**\
    \ tier.\n+   3. Click on the **Get API key** button.\n+   \n+   You will be redirected\
    \ to the sign-up page of the service.\n+   4. Fill in all the required details\
    \ and click on the **Create Account** button.\n+   \n+   A confirmation message\
    \ will be sent to the email address that you used to create your account.\n+ \
    \  5. Find the confirmation email and click on the **Verify your email** button\
    \ to complete your registration.\n+   \n+   You will shortly receive another email\
    \ from OpenWeather with details about your current subscription, including your\
    \ API key and the HTTP endpoint that we will use for communicating with the API.\n\
    \n> **Important note**\n> \n> The API key may take some time to be activated,\
    \ usually a couple of hours, before you can use it.\n\nAs soon as the API key\
    \ has been activated, we can start using it within an Angular application. We\
    \ will learn how to do this in the following section."

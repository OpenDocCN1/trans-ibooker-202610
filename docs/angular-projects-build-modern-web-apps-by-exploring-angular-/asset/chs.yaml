- "# 5 使用 Electron 为桌面构建 WYSIWYG 编辑器\n\nWeb 应用程序传统上使用 HTML、CSS 和 JavaScript 构建。它们的使用也已广泛扩展到使用\
  \ Node.js 的服务器开发。近年来出现了各种工具和框架，它们使用 HTML、CSS 和 JavaScript 为桌面和移动设备创建应用程序。在本章中，我们将研究如何使用\
  \ Angular 和 Electron 创建桌面应用程序。\n\nElectron 是一个 JavaScript 框架，用于使用 Web 技术构建原生桌面应用程序。如果我们将其与\
  \ Angular 框架结合使用，我们可以创建快速且高性能的 Web 应用程序。在本章中，我们将构建一个桌面 WYSIWYG 编辑器并涵盖以下主题：\n\n-\
  \ 为 Angular 添加 WYSIWYG 编辑器库\n- 在工作区中集成 Electron\n- Angular 与 Electron 之间的通信\n- 打包桌面应用程序\n\
  \n## 基本背景理论和上下文\n\nElectron 是一个跨平台框架，用于为 Windows、Linux 和 Mac 构建桌面应用程序。许多流行应用程序都是使用\
  \ Electron 构建的，例如 **Visual Studio Code**、**Skype** 和 **Slack**。Electron 框架建立在 Node.js\
  \ 和 **Chromium** 之上。Web 开发人员可以利用现有的 HTML、CSS 和 JavaScript 技能来创建桌面应用程序，而无需学习 C++\
  \ 或 C# 等新语言。\n\n> **提示**\n> Electron 应用程序与 PWA 应用程序有许多相似之处。考虑在需要高级文件系统操作或需要为应用程序提供更原生的外观和感觉的情况下构建\
  \ Electron 应用程序。另一个用例是当你为主要桌面产品构建补充工具并且希望将它们一起发布时。\n\nElectron 应用程序由两个进程组成：\n\n\
  - **Main**：使用 Node.js API 与本地原生资源交互。\n- **Renderer**：负责管理应用程序的用户界面。\n\nElectron\
  \ 应用程序只能有一个主进程，该主进程可以与一个或多个渲染进程通信。每个渲染进程彼此完全隔离。\n\nElectron 框架提供了 `ipcMain` 和 `ipcRenderer`\
  \ 接口，我们可以使用它们与这些进程交互。交互是通过 **进程间通信（IPC）** 实现的，这是一种通过基于 Promise 的 API 在公共通道上安全且异步地交换消息的机制。\n\
  \n## 项目概述\n\n在这个项目中，我们将构建一个桌面 WYSIWYG 编辑器，其内容保存在文件系统中。最初，我们将使用 **ngx-wig**，一个流行的\
  \ WYSIWYG Angular 库，将其构建为独立的 Angular 应用程序。我们将然后使用 Electron 将其转换为桌面应用程序，并学习如何在 Angular\
  \ 和 Electron 之间同步内容。我们还将了解如何将编辑器的内容持久化到文件系统中。最后，我们将把应用程序打包为可在桌面环境中运行的单个可执行文件。\n\n\
  构建时间：1 小时。\n\n## 开始\n\n完成本项目需要以下软件工具：\n\n- Angular CLI：Angular 的命令行界面，可在 https://angular.io/cli\
  \ 找到。\n- Visual Studio Code：代码编辑器，可从 https://code.visualstudio.com/Download 下载。\n\
  - GitHub 材料：本章的代码可在 https://github.com/PacktPublishing/Angular-Projects-Second-Edition\
  \ 的 Chapter05 文件夹中找到。\n\n## 为 Angular 添加 WYSIWYG 编辑器库\n\n我们将通过首先创建一个独立的 Angular\
  \ 应用程序作为 WYSIWYG 编辑器来启动项目。使用 Angular CLI 从头开始创建一个新的 Angular 应用程序：\n\n```bash\nng\
  \ new my-editor --defaults\n```\n\n我们向 `ng new` 命令传递以下选项：\n\n- `my-editor`：定义应用程序的名称\n\
  - `--defaults`：将 CSS 定义为应用程序的首选样式表格式，并禁用路由，因为我们的应用程序将由一个组件组成，该组件将托管编辑器\n\nWYSIWYG\
  \ 编辑器是一种富文本编辑器，例如 Microsoft Word。我们可以使用 Angular 框架从头开始创建一个，但这将是一个耗时的过程，我们只是在重新发明轮子。Angular\
  \ 生态系统包含大量可用于此目的的库。其中之一是 ngx-wig 库，它没有任何外部依赖，只有 Angular！让我们将该库添加到我们的应用程序中并学习如何使用它：\n\
  \n1. 使用 npm 客户端从 npm 包注册表中安装 ngx-wig：\n\n```bash\nnpm install ngx-wig\n```\n\n2.\
  \ 打开 app.module.ts 文件并将 NgxWigModule 添加到 @NgModule 装饰器的 imports 数组中：\n\n```typescript\n\
  import { NgModule } from '@angular/core';\nimport { BrowserModule } from '@angular/platform-browser';\n\
  import { NgxWigModule } from 'ngx-wig';\n\nimport { AppComponent } from './app.component';\n\
  \n@NgModule({\n  declarations: [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n\
  \    NgxWigModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\nexport\
  \ class AppModule { }\n```\n\nNgxWigModule 是 ngx-wig 库的主模块。\n\n3. 创建一个新的 Angular\
  \ 组件来托管我们的 WYSIWYG 编辑器：\n\n```bash\nng generate component editor\n```\n\n\n\n\n\
  + 4. 打开新生成组件的模板文件 `editor.component.html`，并将其内容替换为以下 HTML 片段：\n\n```html\n<ngx-wig\
  \ placeholder=\"Enter your content\"></ngx-wig>\n```\n\nNgxWigModule 提供了一组可在我们的应用程序中使用的\
  \ Angular 服务和组件。该模块的主要组件是 `ngx-wig` 组件，它显示实际的所见即所得（WYSIWYG）编辑器。它暴露了一系列我们可以设置的输入属性，例如编辑器的占位符。你可以在\
  \ https://github.com/stevermeister/ngx-wig 找到更多选项。\n\n+ 5. 打开 `app.component.html`\
  \ 文件，并将其内容替换为 `app-editor` 选择器：\n\n```html\n<app-editor></app-editor>\n```\n\n+\
  \ 6. 打开 `styles.css` 文件（该文件包含 Angular 应用程序的全局样式），并添加以下样式，使编辑器可停靠并占据整个页面：\n\n```css\n\
  html, body {\n  margin: 0;\n  width: 100%;\n  height: 100%;\n}\n\n.ng-wig, .nw-editor-container,\
  \ .nw-editor {\n  display: flex !important;\n  flex-direction: column;\n  height:\
  \ 100% !important;\n  overflow: hidden;\n}\n```\n\n+ 7. 打开 Angular 应用程序的主 HTML 文件\
  \ `index.html`，并从 `head` 元素中移除 `base` 标签。浏览器使用 `base` 标签来引用具有相对 URL 的脚本和 CSS 文件。若保留\
  \ `base` 标签，我们的桌面应用程序将无法运行，因为它会直接从本地文件系统加载所有必要的资源。我们将在“*将 Angular 与 Electron 集成*”部分进一步了解。\n\
  \n让我们看看目前已经实现了什么。运行 `ng serve` 并导航到 http://localhost:4200 来预览应用程序：\n\n![](img/efea53d01337e7b223389b38dcdb0160_148_0.png)\n\
  \n图 5.1 – 应用程序输出\n\n我们的应用程序由以下部分组成：\n\n- 一个带有按钮的工具栏，允许我们对编辑器内容应用不同的样式\n- 一个文本区域，用作向编辑器添加内容的主要容器\n\
  \n至此，我们已经使用 Angular 创建了一个包含功能完备的所见即所得编辑器的 Web 应用程序。在下一节中，我们将学习如何使用 Electron 将其转换为桌面应用程序。\n\
  \n## 在工作区中集成 Electron\n\nElectron 框架是一个 npm 包，我们可以使用以下命令安装它：\n\n```bash\nnpm install\
  \ -D electron\n```\n\n上述命令会将最新版本的 Electron npm 包安装到 Angular CLI 工作区中。它还会在我们的项目的\
  \ `package.json` 文件的 `devDependencies` 部分中添加一个相应的条目。\n\n> **重要说明**\n>\n> Electron\
  \ 被添加到 `package.json` 文件的 `devDependencies` 部分，因为它是我们应用程序的开发依赖项。它仅用于准备和构建桌面版应用程序，而不在运行时使用。\n\
  \nElectron 应用程序在 Node.js 运行时上运行，并使用 Chromium 浏览器进行渲染。Node.js 应用程序至少有一个 JavaScript\
  \ 文件，通常称为 `index.js` 或 `main.js`，它是应用程序的主入口点。由于我们使用 Angular 和 TypeScript 作为开发技术栈，我们首先创建一个相应的\
  \ TypeScript 文件，该文件最终将被编译为 JavaScript：\n\n+ 1. 在 Angular CLI 工作区的 `src` 文件夹中创建一个名为\
  \ `electron` 的文件夹。`electron` 文件夹将包含与 Electron 相关的所有源代码。\n\n> 提示\n>\n> 我们可以将应用程序视为两个不同的平台。Web\
  \ 平台是 Angular 应用程序，位于 `src\\app` 文件夹中。桌面平台是 Electron 应用程序，位于 `src\\electron` 文件夹中。这种方法有很多好处，包括在我们的应用程序中强制实现关注点分离，并且允许每个平台独立开发。从现在开始，我们将它们分别称为\
  \ Angular 应用程序和 Electron 应用程序。\n\n+ 2. 在 `electron` 文件夹中创建一个 `main.ts` 文件，内容如下：\n\
  \n```typescript\nimport { app, BrowserWindow } from 'electron';\n\nfunction createWindow\
  \ () {\n    const mainWindow = new BrowserWindow({\n        width: 800,\n      \
  \  height: 600\n    });\n\n    mainWindow.loadFile('index.html');\n}\n\napp.whenReady().then(()\
  \ => {\n    createWindow();\n});\n```\n\n我们首先从 `electron` npm 包中导入 `BrowserWindow`\
  \ 和 `app` 构件。`BrowserWindow` 类用于为我们的应用程序创建桌面窗口。我们通过在其构造函数中传入一个选项对象来定义窗口尺寸，该对象设置窗口的\
  \ `width` 和 `height` 值。然后我们调用 `loadFile` 方法，将我们想要在窗口中加载的 HTML 文件作为参数传入。\n\n> **重要说明**\n\
  >\n> 我们在 `loadFile` 方法中传入的 `index.html` 文件是 Angular 应用程序的主 HTML 文件。它将通过 `file://`\
  \ 协议加载，这就是我们在“*添加一个所见即所得的 Angular 库*”部分中移除 `base` 标签的原因。\n\n`app` 对象是桌面应用程序的全局对象，就像网页上的\
  \ `window` 对象一样。它暴露了一个 `whenReady` Promise，当该 Promise 被解析时，意味着我们可以运行应用程序的任何初始化逻辑，包括创建窗口。\n\
  \n+ 3. 在 `electron` 文件夹中创建一个 `tsconfig.json` 文件，并添加以下内容：\n\n```json\n{\n  \"extends\"\
  : \"../../tsconfig.json\",\n  \"compilerOptions\": {\n    \"importHelpers\": false\n\
  \  },\n  \"include\": [\n    \"**/*.ts\"\n  ]\n}\n```\n\n`main.ts` 文件需要被编译为 JavaScript，因为浏览器目前不理解\
  \ TypeScript。这个编译过程称为**转译**，并且需要一个 TypeScript 配置文件。该配置文件包含驱动 TypeScript **转译器**的选项，转译器负责转译过程。\n\
  \n前面的 TypeScript 配置文件使用 `include` 属性定义了 Electron 源代码文件的路径，并将 `importHelpers` 属性设置为\
  \ false。\n\n> **重要说明**\n>\n> 如果我们启用 `importHelpers` 标志，它将把 `tslib` 库中的辅助函数包含到我们的应用程序中，从而导致更大的打包体积。\n\
  \n4. 运行以下命令来安装 **webpack 命令行工具**：\n\n```bash\nnpm install -D webpack-cli\n```\n\n\
  webpack 命令行工具用于从命令行调用 **webpack**——一个流行的模块打包器。我们将使用 webpack 来构建和打包我们的 Electron 应用程序。\n\
  \n5. 使用以下 npm 命令安装 ts-loader npm 包：\n\n```bash\nnpm install -D ts-loader\n```\n\n\
  ts-loader 库是一个 webpack 插件，可以加载 TypeScript 文件。\n\n现在，我们已经创建了使用 Electron 将 Angular\
  \ 应用程序转换为桌面应用程序所需的各个部分。我们只需要将它们组合在一起，以便能够构建和运行桌面应用程序。编排 Electron 应用程序的主要部分是 webpack\
  \ 配置文件，我们需要在 Angular CLI 工作区的根文件夹中创建该文件：\n\n## webpack.config.js\n\n```javascript\n\
  const path = require('path');\nconst src = path.join(process.cwd(), 'src', 'electron');\n\
  \nmodule.exports = {\n  mode: 'development',\n  devtool: 'source-map',\n  entry:\
  \ path.join(src, 'main.ts'),\n  output: {\n    path: path.join(process.cwd(), 'dist',\
  \ 'my-editor'),\n    filename: 'shell.js'\n  },\n  module: {\n    rules: [\n   \
  \   {\n        test: /\\.ts$/,\n        loader: 'ts-loader',\n        options: {\n\
  \          configFile: path.join(src, 'tsconfig.json')\n        }\n      }\n   \
  \ ]\n  },\n  target: 'electron-main'\n};\n```\n\n前面的文件使用以下选项在我们的应用程序中配置 webpack：\n\
  \n- `mode`：表示我们当前正在开发环境中运行。\n- `devtool`：启用 source map 文件生成，用于调试。\n- `entry`：表示\
  \ Electron 应用程序的主入口点，即 `main.ts` 文件。\n- `output`：定义 webpack 将生成的 Electron 包的路径和文件名。`path`\
  \ 属性指向与 Angular CLI 用于生成 Angular 应用程序包相同的文件夹。`filename` 属性设置为 `shell.js`，因为 webpack\
  \ 生成的默认文件名是 `main.js`，这将会与 Angular 应用程序生成的 `main.js` 文件冲突。\n- `module`：指示 webpack\
  \ 加载 ts-loader 插件来处理 TypeScript 文件。\n- `target`：表示我们当前正在 Electron 的主进程中运行。\n\n现在\
  \ webpack 包含了构建和打包 Electron 应用程序所需的全部信息。另一方面，Angular CLI 负责构建 Angular 应用程序。让我们看看如何将它们组合起来并运行我们的桌面应用程序：\n\
  \n+ 1. 运行以下 npm 命令来安装 concurrently npm 包：\n\n```bash\nnpm install -D concurrently\n\
  ```\n\nconcurrently 库使我们能够并发执行多个进程。在我们的场景中，它将使我们能够并行运行 Angular 和 Electron 应用程序。\n\
  \n\n\n\n\n2. 打开 package.json 文件并在 scripts 属性中添加一个新条目：\n\n```\n\"scripts\": {\n \
  \   \"ng\": \"ng\",\n    \"start\": \"ng serve\",\n    \"build\": \"ng build\",\n\
  \    \"watch\": \"ng build --watch --configuration development\",\n    \"test\"\
  : \"ng test\",\n    \"start:desktop\": \"concurrently \\\"ng build --delete-output-path=false\
  \ --watch\\\" \\\"webpack --watch\\\"\"\n}\n```\n\nstart:desktop 脚本使用 Angular CLI\
  \ 的 ng build 命令构建 Angular 应用，并使用 webpack 命令构建 Electron 应用。两个应用都使用 --watch 选项以监视模式运行，因此每次我们在代码中进行更改时，应用都会重新构建以反映更改。每当我们修改\
  \ Angular 应用时，Angular CLI 默认会删除 dist 文件夹。我们可以使用 --delete-output-path=false 选项来防止这种行为，因为\
  \ Electron 应用也在同一文件夹中构建。\n\n> 重要说明\n> 我们没有将 webpack 配置文件传递给 webpack 命令，因为它默认假设 webpack.config.js\
  \ 文件名。\n\n3. 点击 Visual Studio Code 侧边栏中存在的 Run 菜单：\n\n![](img/efea53d01337e7b223389b38dcdb0160_153_0.png)\n\
  \n图 5.2 – Run 菜单\n\n![](img/efea53d01337e7b223389b38dcdb0160_155_0.png)\n\n在前面的截图中，我们可以看到我们的\
  \ Angular 应用，其 WYSIWYG 编辑器托管在原生桌面窗口内。它包含我们在桌面应用中通常会找到的以下特征：\n\n- 带有图标的标题栏\n- 主菜单\n\
  - 最小化、最大化和关闭按钮\n\nAngular 应用在 Chromium 浏览器中渲染。要验证这一点，请点击 **View** 菜单项并选择 **Toggle\
  \ Developer Tools** 选项。\n\n做得好！你已成功创建了自己的桌面 WYSIWYG 编辑器。在下一节中，我们将学习如何让 Angular 和\
  \ Electron 之间进行交互。\n\n## Angular 与 Electron 之间的通信\n\n根据项目规范，WYSIWYG 编辑器的内容需要在本地文件系统中持久化。此外，内容将在应用启动时从文件系统加载。\n\
  \nAngular 应用使用 Electron 的渲染进程处理 WYSIWYG 编辑器与其数据之间的任何交互，而 Electron 应用则使用主进程管理文件系统。因此，我们需要建立\
  \ IPC 机制在两个 Electron 进程之间进行通信，如下所示：\n\n- 配置 Angular CLI 工作区\n- 与编辑器交互\n- 与文件系统交互\n\
  \n让我们从第一个开始，设置 Angular CLI 项目以支持所需的通信机制。\n\n### 配置 Angular CLI 工作区\n\n我们需要修改多个文件来配置应用的工作区：\n\
  \n1. 打开 `src\\electron` 文件夹中存在的 `main.ts` 文件，并在 `BrowserWindow` 构造函数中将 `nodeIntegration`\
  \ 属性设置为 `true`：\n\n```javascript\nfunction createWindow () {\n  const mainWindow\
  \ = new BrowserWindow({\n    width: 800,\n    height: 600,\n    webPreferences:\
  \ {\n      nodeIntegration: true,\n      contextIsolation: false\n    }\n  });\n\
  \n  mainWindow.loadFile('index.html');\n}\n```\n\n前面的标志将启用渲染进程中的 Node.js 并公开 `ipcRenderer`\
  \ 接口，我们将需要它与主进程通信。\n\n2. 打开 Angular CLI 工作区根文件夹中存在的 `tsconfig.app.json` 文件，并在 `types`\
  \ 属性内添加 `electron` 条目：\n\n```json\n{\n  \"extends\": \"./tsconfig.json\",\n  \"\
  compilerOptions\": {\n    \"outDir\": \"./out-tsc/app\",\n    \"types\": [\n   \
  \   \"electron\"\n    ]\n  },\n  \"files\": [\n    \"src/main.ts\",\n    \"src/polyfills.ts\"\
  \n  ],\n  \"include\": [\n    \"src/**/*.d.ts\"\n  ]\n}\n```\n\nElectron 框架包含可在\
  \ Angular 应用中使用的类型。\n\n3. 在 `src\\app` 文件夹内创建一个名为 `window.ts` 的新文件并输入以下代码：\n\n```typescript\n\
  import { InjectionToken } from '@angular/core';\n\nexport const WINDOW = new\n \
  \ InjectionToken<Window>('Global window object', {\n    factory: () => window\n\
  \  });\n\nexport interface ElectronWindow extends Window {\n  require(module: string):\
  \ any;\n}\n```\n\nElectron 框架是一个 JavaScript 模块，可以从浏览器的全局 `window` 对象加载。我们使用 `InjectionToken`\
  \ 接口使 window 对象可注入，以便我们可以在 Angular 组件和服务中使用它。此外，我们使用工厂方法返回它，以便在没有 window 对象访问权限的平台上，例如服务器，很容易替换它。\n\
  \nElectron 使用 window 对象的 `require` 方法加载，该方法仅在 Node.js 环境中可用。为了在 Angular 应用中使用它，我们创建了\
  \ `ElectronWindow` 接口，它通过定义该方法扩展了 `Window` 接口。\n\nAngular 和 Electron 应用现在已准备好使用\
  \ IPC 机制相互交互。让我们先在 Angular 应用中实现必要的逻辑。\n\n### 与编辑器交互\n\nAngular 应用负责管理 WYSIWYG 编辑器。编辑器的内容通过\
  \ Electron 的渲染进程与文件系统保持同步。让我们了解如何使用渲染进程：\n\n1. 使用 Angular CLI 的 generate 命令创建一个新的\
  \ Angular 服务：\n\n```\nng generate service editor\n```\n\n2. 打开 editor.service.ts\
  \ 文件并在 EditorService 类的构造函数中注入 WINDOW 令牌：\n\n```\nimport { Inject } from '@angular/core';\n\
  import { Injectable } from '@angular/core';\nimport { ElectronWindow, WINDOW } from\
  \ './window';\n\n@Injectable({\n  providedIn: 'root'\n})\nexport class EditorService\
  \ {\n\n  constructor(@Inject(WINDOW) private window: ElectronWindow) {}\n\n}\n```\n\
  \n3. 创建一个 getter 属性，从 electron 模块返回 ipcRenderer 对象：\n\n```\nprivate get ipcRenderer():\
  \ Electron.IpcRenderer {\n  return this.window.require('electron').ipcRenderer;\n\
  }\n```\n\nelectron 模块是 Electron 框架的主模块，可访问各种属性，包括主进程和渲染进程。我们还将 ipcRenderer 属性的类型设置为\
  \ Electron.IpcRenderer，它是 Electron 内置类型的一部分。\n\n4. 创建一个方法，用于从文件系统获取编辑器的内容：\n\n```\n\
  getContent(): Promise<string> {\n    return this.ipcRenderer.invoke('getContent');\n\
  }\n```\n\n我们使用 ipcRenderer 属性的 invoke 方法，将通信通道的名称作为参数传递。getContent 方法的结果是 string\
  \ 类型的 Promise 对象，因为编辑器的内容是原始文本数据。invoke 方法通过 getContent 通道启动与主进程的连接。在 与文件系统交互 部分，我们将看到如何设置主进程以响应该通道中\
  \ invoke 方法的调用。\n\n5. 创建一个方法，用于将编辑器的内容保存到文件系统：\n\n```\nsetContent(content: string)\
  \ {\n    this.ipcRenderer.invoke('setContent', content);\n}\n```\n\nsetContent 方法再次调用\
  \ ipcRenderer 对象的 invoke 方法，但使用不同的通道名称。它还使用 invoke 方法的第二个参数将数据传递给主进程。在这种情况下，content\
  \ 参数将包含编辑器的内容。我们将在 与文件系统交互 部分看到如何配置主进程以处理数据。\n\n6. 打开 editor.component.ts 文件并创建\
  \ myContent 属性来保存编辑器数据。还将 EditorService 注入 EditorComponent 类的构造函数中：\n\n```\nimport\
  \ { Component, OnInit } from '@angular/core';\nimport { EditorService } from '../editor.service';\n\
  \n@Component({\n    selector: 'app-editor',\n    templateUrl: './editor.component.html',\n\
  \    styleUrls: ['./editor.component.css']\n})\nexport class EditorComponent implements\
  \ OnInit {\n```\n\n\n\n```\nmyContent = '';\n\nconstructor(private editorService:\
  \ EditorService) {}\n\nngOnInit(): void {\n}\n}\n```\n\n7. 创建一个调用 editorService\
  \ 变量的 getContent 方法并在 ngOnInit 方法内部执行它：\n\n```ts\nngOnInit(): void {\n  this.getContent();\n\
  }\n\nprivate async getContent() {\n  this.myContent = await\n    this.editorService.getContent();\n\
  }\n```\n\n我们使用 async/await 语法，这允许我们在基于 promise 的方法调用中同步执行代码。\n\n8. 创建一个调用 editorService\
  \ 变量的 setContent 方法：\n\n```ts\nsaveContent(content: string) {\n  this.editorService.setContent(content);\n\
  }\n```\n\n9. 让我们将我们创建的这些方法与组件的模板连接起来。打开 editor.component.html 文件并添加以下绑定：\n\n```html\n\
  <ngx-wig placeholder=\"Enter your content\"\n  [ngModel]=\"myContent\"\n  (contentChange)=\"\
  saveContent($event)\"></ngx-wig>\n```\n\n## 与文件系统交互\n\n主进程使用内置于 Electron 框架中的 `fs`\
  \ Node.js 库与文件系统交互。让我们看看如何使用它：\n\n1. 打开 src/electron 文件夹中存在的 main.ts 文件并导入以下构件：\n\
  \n```ts\nimport { app, BrowserWindow, ipcMain } from 'electron';\nimport * as fs\
  \ from 'fs';\nimport * as path from 'path';\n```\n\n`fs` 库负责与文件系统交互。`path` 库提供用于处理文件和文件夹路径的实用工具。`ipcMain`\
  \ 对象允许我们使用 Electron 的主进程。\n\n2. 创建一个变量来保存包含编辑器内容的文件的路径：\n\n```ts\nconst contentFile\
  \ = path.join(app.getPath('userData'), 'content.html');\n```\n\n保存编辑器内容的的文件是存在于保留的\
  \ userData 文件夹中的 content.html 文件。userData 文件夹是每个操作系统的特殊用途系统文件夹的别名，用于存储应用程序特定的文件，例如配置。您可以在\
  \ https://www.electronjs.org/docs/api/app#appgetpathname 找到有关 userData 文件夹以及其他系统文件夹的更多详细信息。\n\
  \n> **重要说明**\n>\n> `app` 对象的 `getPath` 方法跨平台工作，用于获取特殊文件夹的路径，例如用户的主目录或应用程序数据。\n\n\
  3. 调用 `ipcMain` 对象的 `handle` 方法开始监听 getContent 通道中的请求：\n\n```ts\nipcMain.handle('getContent',\
  \ () => {\n    if (fs.existsSync(contentFile)) {\n        const result = fs.readFileSync(contentFile);\n\
  \        return result.toString();\n    }\n    return '';\n});\n```\n\n当主进程在此通道中接收到请求时，它使用\
  \ `fs` 库的 `existsSync` 方法检查编辑器内容的 文件是否已存在。如果存在，它使用 `readFileSync` 方法读取它并将其内容返回给渲染进程。\n\
  \n4. 再次调用 `handle` 方法，但这次针对 setContent 通道：\n\n```ts\nipcMain.handle('setContent',\
  \ (event, content: string) => {\n  fs.writeFileSync(contentFile, content);\n});\n\
  ```\n\n在前面的代码片段中，我们使用 `fs` 库的 `writeFileSync` 方法将 content 属性的值写入文件中。\n\n5. 打开 package.json\
  \ 文件并更改 `@types/node` npm 包的版本：\n\n```json\n\"@types/node\": \"^15.6.0\"\n```\n\n\
  现在我们已经连接了 Angular 和 Electron 应用程序，是时候预览我们的 WYSIWYG 桌面应用程序了：\n\n1. 执行 start:desktop\
  \ npm 脚本并按 F5 运行应用程序。\n\n2. 使用编辑器及其工具栏输入一些内容，例如以下内容：\n\n![](img/efea53d01337e7b223389b38dcdb0160_163_0.png)\n\
  \n图 5.5 – 编辑器内容\n\n3. 关闭应用程序窗口并重新运行应用程序。如果一切正常，您应该在编辑器中看到您输入的内容。\n\n恭喜！您已通过为其添加持久化功能来丰富了您的\
  \ WYSIWYG 编辑器。在下一节中，我们将朝着创建桌面应用程序的最后一步迈进，并学习如何打包和分发它。\n\n## 打包桌面应用程序\n\nWeb 应用程序通常捆绑并部署到托管它们的\
  \ Web 服务器。另一方面，桌面应用程序被捆绑和打包为单个可执行文件，可以轻松分发。打包我们的 WYSIWYG 应用程序需要以下步骤：\n\n- 为生产模式配置\
  \ webpack\n- 使用 Electron 打包器\n\n我们将在以下各节中更详细地介绍它们。\n\n### 为生产配置 webpack\n\n我们已经为开发环境创建了\
  \ webpack 配置文件。现在我们需要为生产环境创建一个新的。两个配置文件将共享一些功能，所以让我们先创建一个公共的：\n\n1. 在 Angular CLI\
  \ 工作区的根文件夹中创建 webpack.dev.config.js 文件，其内容如下：\n\n```js\nconst path = require('path');\n\
  const baseConfig = require('./webpack.config');\n\nmodule.exports = {\n  ...baseConfig,\n\
  \  mode: 'development',\n  devtool: 'source-map',\n  output: {\n    path: path.join(process.cwd(),\
  \ 'dist', 'my-editor'),\n    filename: 'shell.js'\n  }\n};\n```\n\n2. 从 webpack.config.js\
  \ 文件中删除 `mode`、`devtool` 和 `output` 属性。\n\n3. 打开 `package.json` 文件并在 `start:desktop`\
  \ 脚本中传递新的 webpack 开发配置文件：\n\n```json\n\"start:desktop\": \"concurrently \\\"ng build\
  \ --delete-output-path=false --watch\\\" \\\"webpack --config webpack.dev.config.js\
  \ --watch\\\"\"\n```\n\n4. 在 Angular CLI 工作区的根文件夹中创建 webpack.prod.config.js 文件，其内容如下：\n\
  \n```js\nconst path = require('path');\nconst baseConfig = require('./webpack.config');\n\
  \nmodule.exports = {\n  ...baseConfig,\n  output: {\n    path: path.join(process.cwd(),\
  \ 'dist', 'my-editor'),\n    filename: 'main.js'\n  }\n};\n```\n\n与开发环境的 webpack\
  \ 配置文件的主要区别是我们将输出 bundle 的文件名更改为 `main.js`。Angular CLI 在生产环境中为 Angular 应用程序的 `main.js`\
  \ 文件添加哈希号，因此不会有冲突。其他需要注意的是，当我们省略它时，mode 默认设置为 `production`，并且缺少 `devtool` 属性，因为我们不希望在生产模式下启用\
  \ source map。\n\n5. 在 `package.json` 文件的 `scripts` 属性中添加一个新条目，用于在生产模式下构建我们的应用程序：\n\
  \n```json\n\"scripts\": {\n  \"ng\": \"ng\",\n  \"start\": \"ng serve\",\n  \"build\"\
  : \"ng build\",\n  \"watch\": \"ng build --watch --configuration development\",\n\
  \  \"test\": \"ng test\",\n  \"start:desktop\": \"concurrently \\\"ng build --delete-output-path=false\
  \ --watch\\\" \\\"webpack --config webpack.dev.config.js --watch\\\"\",\n  \"build:electron\"\
  : \"ng build && webpack --config webpack.prod.config.js\"\n}\n```\n\nbuild:electron\
  \ 脚本同时在生产模式下构建 Angular 和 Electron 应用程序。\n\n我们已经完成了打包桌面应用程序所需的所有配置。在下一节中，我们将学习如何将其转换为特定于每个操作系统的单个\
  \ bundle。\n\n### 使用 Electron 打包器\n\nElectron 框架拥有由开源社区创建和维护的各种工具。\n\n您可以在以下链接的 Tools\
  \ 部分看到可用项目的列表：\n\nhttps://www.electronjs.org/community\n\n其中一个工具是 electron-packager\
  \ 库，我们可以使用它将桌面应用程序打包为每个操作系统的单个可执行文件（Windows、Linux 和 macOS）。让我们看看如何将其集成到我们的开发工作流程中：\n\
  \n1. 运行以下 npm 命令将 electron-packager 作为开发依赖项安装到我们的项目中：\n\n```bash\nnpm install -D\
  \ electron-packager\n```\n\n2. 在 `package.json` 文件的 `scripts` 属性中添加一个新条目用于打包我们的应用程序：\n\
  \n```json\n\"scripts\": {\n  \"ng\": \"ng\",\n  \"start\": \"ng serve\",\n  \"build\"\
  : \"ng build\",\n  \"watch\": \"ng build --watch --configuration development\",\n\
  \  \"test\": \"ng test\",\n  \"start:desktop\": \"concurrently \\\"ng build --\n\
  \n\n```json\n\"delete-output-path=false --watch\" \"webpack --config webpack.dev.config.js\
  \ --watch\",\n\"build:electron\": \"ng build && webpack --config webpack.prod.config.js\"\
  ,\n\"package\": \"electron-packager dist/my-editor --out=dist --asar\"\n}\n```\n\
  \n在上述脚本中，`electron-packager` 会读取 `dist/my-editor` 文件夹中的所有文件，将它们打包，并将最终的分发包输出到 `dist`\
  \ 文件夹中。`--asar` 选项指示打包工具将所有文件以 ASAR 格式归档，类似于 ZIP 或 TAR 文件。\n\n3. 在 `src\\electron`\
  \ 文件夹中创建一个 `package.json` 文件，并添加以下内容：\n\n```json\n{\n  \"name\": \"my-editor\",\n\
  \  \"main\": \"main.js\"\n}\n```\n\n`electron-packager` 库要求输出文件夹中存在一个 `package.json`\
  \ 文件，并且该文件指向 Electron 应用程序的主入口文件。\n\n4. 打开 `webpack.prod.config.js` 文件，并在 `plugins`\
  \ 属性中添加 CopyWebpackPlugin：\n\n```javascript\nconst path = require('path');\nconst\
  \ baseConfig = require('./webpack.config');\nconst CopyWebpackPlugin = require('copy-webpack-plugin');\n\
  \nmodule.exports = {\n  ...baseConfig,\n  output: {\n    path: path.join(process.cwd(),\
  \ 'dist', 'my-editor'),\n    filename: 'main.js'\n  },\n  plugins: [\n    new CopyWebpackPlugin({\n\
  \        patterns: [\n            {\n                context: path.join(process.cwd(),\
  \ 'src',\n                'electron'),\n                from: 'package.json'\n \
  \           }\n        ]\n    })\n  ]\n}\n```\n\n我们使用 CopyWebpackPlugin 在构建生产模式应用程序时，将\
  \ `package.json` 文件从 `src\\electron` 文件夹复制到 `dist\\my-editor` 文件夹中。\n\n5. 运行以下命令以生产模式构建应用程序：\n\
  \n```\nnpm run build:electron\n```\n\n6. 现在运行以下 npm 命令进行打包：\n\n```\nnpm run package\n\
  ```\n\n上述命令会针对你当前运行的操作系统打包应用程序，这是 `electron-packager` 库的默认行为。你可以通过传递额外的选项来改变此行为，这些选项可以在“进一步阅读”部分列出的库的\
  \ GitHub 仓库中找到。\n\n7. 导航到 Angular CLI 工作区的 `dist` 文件夹。你会找到一个名为 `my-editor-{OS}`\
  \ 的文件夹，其中 `{OS}` 是当前操作系统及其架构。例如，在 Windows 中，该文件夹名为 `my-editor-win32-x64`。打开该文件夹，你会得到以下文件：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_169_0.png)\n\n图 5.6 – 应用程序包（Windows）\n\
  \n在上述截图中，`my-editor.exe` 文件是我们桌面应用程序的可执行文件。我们的应用程序代码并不包含在该文件中，而是包含在位于 `resources`\
  \ 文件夹中的 `app.asar` 文件中。\n\n运行该可执行文件，桌面应用程序应正常打开。你可以将整个文件夹上传到服务器，或通过任何其他方式分发它。你的所见即所得编辑器现在可以触达更多用户，例如那些大部分时间处于离线的用户。太棒了！\n\
  \n## 总结\n\n在本章中，我们使用 Angular 和 Electron 构建了一个桌面端的所见即所得编辑器。首先，我们创建了一个 Angular 应用程序，并添加了流行的\
  \ Angular 所见即所得库 `ngx-wig`。然后，我们学习了如何构建一个 Electron 应用程序，并实现了一种在 Angular 应用程序和 Electron\
  \ 应用程序之间交换数据的通信机制。最后，我们学习了如何打包我们的应用程序并做好分发准备。\n\n在下一章中，我们将学习如何使用 Angular 和 Ionic\
  \ 构建一个移动端照片地理标记应用程序。\n\n## 练习题\n\n让我们来看几个练习题：\n\n1. 在 Electron 中，哪个类负责创建桌面窗口？\n\
  2. 在 Electron 中，我们如何在主进程和渲染进程之间进行通信？\n3. 哪个标志允许在渲染进程中使用 Node.js？\n4. 我们如何将一个全局 JavaScript\
  \ 对象转换为 Angular 可注入的对象？\n5. 在 Angular 应用程序中，我们如何加载 Electron？\n6. 在 Angular 应用程序中，我们使用哪个接口与\
  \ Electron 交互？\n7. 我们如何从 Angular 应用程序向 Electron 主进程传递数据？\n8. 在 Electron 中，我们使用哪个包来操作文件系统？\n\
  9. 我们使用哪个库来打包 Electron 应用程序？\n\n## 进一步阅读\n\n以下是一些链接，可以帮助你深入学习本章内容：\n\n- Electron：https://www.electronjs.org/\n\
  - Electron 快速入门：https://www.electronjs.org/docs/tutorial/quick-start\n- ngx-wig：https://github.com/stevermeister/ngx-wig\n\
  - webpack 配置：https://webpack.js.org/configuration/\n- ts-loader：https://webpack.js.org/guides/typescript/\n\
  - 在 Angular 中注入对象：https://angular.io/guide/dependency-injection-providers#injecting-an-object\n\
  - Node.js 文件系统 API：https://nodejs.org/api/fs.html\n- electron-packager：https://github.com/electron/electron-packager\n\
  - concurrently：https://github.com/kimmobrunfeldt/concurrently\n\n我们将详细讨论以下主题：\n\n\
  - 使用 **Ionic** 创建移动应用程序\n- 使用 **Capacitor** 拍照\n- 在 **Firebase** 中存储数据\n- 使用 **CesiumJS**\
  \ 预览照片\n\n## 基本背景理论与上下文\n\nCapacitor 是一个原生移动运行时，使我们能够使用 Web 技术（包括 Angular）构建原生的\
  \ **Android** 和 **iOS** 应用程序。它为 Web 应用程序提供了一个抽象 API 层，用于与移动操作系统的原生资源进行交互。它不包含 UI\
  \ 层或任何其他与用户界面交互的方式。\n\nIonic 是一个移动框架，包含一组 UI 组件，我们可以在使用 Capacitor 构建的应用程序中使用这些组件。Ionic\
  \ 的主要优点是我们在所有原生移动平台上保持单一代码库。也就是说，我们只需编写一次代码，就可以在任何地方运行。Ionic 支持所有流行的 JavaScript\
  \ 框架，包括 Angular。\n\n> **重要提示**\n>\n> 当我们从头开始创建一个新的 Ionic 应用程序时，也会自动安装并配置好 Capacitor。\n\
  \nFirebase 是 Google 提供的一个 **后端即服务（BaaS）** 平台，包含一组用于构建应用程序的工具和服务。**Cloud Firestore**\
  \ 是 Firebase 提供的一种数据库解决方案，它具有灵活、可扩展的 NoSQL 面向文档的数据库，可用于 Web 和移动应用程序。**Storage**\
  \ 是 Firebase 的一项服务，允许我们与存储机制交互并上传或下载文件。\n\nCesiumJS 是一个用于在浏览器中创建交互式 3D 地图的 JavaScript\
  \ 库。它是一个开源、跨平台的库，使用 **WebGL**，并允许我们在多个平台上共享地理空间数据。它由 **Cesium** 提供支持，这是一个用于构建高质量、高性能\
  \ 3D 地理空间应用程序的平台。\n\n## 项目概述\n\n在这个项目中，我们将构建一个移动应用程序，可以根据当前位置拍照并在地图上预览照片。首先，我们将学习如何使用\
  \ Angular 和 Ionic 创建移动应用程序。然后，我们将使用 Capacitor 通过移动设备的摄像头拍照，并通过 GPS 为照片标记当前位置。我们将把这些照片连同位置数据上传到\
  \ Firebase。最后，我们将使用 CesiumJS 在 3D 地球上加载位置数据，并附上照片预览。\n\n> **重要提示**\n> 在本章中，你将学习如何使用\
  \ Angular 和 Ionic 构建移动应用程序。为了继续完成项目并预览应用程序，你需要按照开发环境（Android 或 iOS）的入门指南操作，该指南可以在\
  \ *进一步阅读* 部分找到。\n\n构建时间：2 小时\n\n## 开始\n\n你需要以下软件和工具来完成此项目：\n\n- 对于 Android：**Android\
  \ Studio**（最低 Android SDK 21 或更高版本）以及 **Android WebView**（Chrome 50 或更高版本）。\n- 对于\
  \ iOS：**Xcode** 11 或更高版本，以及 **Xcode 命令行工具**。\n- 一台实体移动设备。\n- GitHub 材料：本章的相关代码可以在\
  \ https://github.com/PacktPublishing/Angular-Projects-Second-Edition 的 Chapter06\
  \ 文件夹中找到。\n\n## 使用 Ionic 创建移动应用程序\n\n构建应用程序的第一步是使用 Ionic 工具包创建一个新的移动应用程序。我们将通过以下任务开始构建应用程序：\n\
  \n- 搭建应用程序脚手架\n- 构建主菜单\n\nIonic 有一个非常简单的流程，可以从零开始创建新的移动应用程序，甚至可以在 Ionic 网站上不写一行代码就完成。\n\
  \n\n\n\n\n# 搭建应用程序\n\n要创建一个新的 Ionic 应用程序，我们需要前往 https://www.ionicframework.com 并完成以下步骤：\n\
  \n- 1. 点击着陆页页眉上显示的 Get Started 按钮：\n- 2. 在 App name 字段中输入你的应用程序名称：\n- 3. 使用 Pick\
  \ an icon 字段来定义应用程序的图标。将鼠标悬停在默认图标上，然后从 emoji 画廊中选择一个或上传你自己的图标。\n- 4. 在 Pick a theme\
  \ color 字段中选择应用程序的品牌颜色。品牌颜色用于应用程序的各个地方，例如背景、工具栏和文本。你可以选择预定义的颜色，或使用 RGB 组合创建自定义颜色。\n\
  - 5. 使用 Pick a layout template 字段选择应用程序的布局。你可以在三种不同的模板中进行选择。在本项目中，我们将使用 MENU 模板：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_174_0.png)\n\n你将被重定向到 Create your Ionic\
  \ App 页面，以填写创建 Ionic 应用程序所需的所有必要详细信息。\n\n![](img/efea53d01337e7b223389b38dcdb0160_174_1.png)\n\
  \n图 6.1 – 开始一个 Ionic 应用程序\n\n图 6.2 – 输入应用程序名称\n\n- 7. 你将被重定向到注册页面，在那里你需要创建一个 Ionic\
  \ 账户。你可以从头创建一个新账户，或选择使用其中一个免费的 Git 服务：\n\n![](img/efea53d01337e7b223389b38dcdb0160_176_0.png)\n\
  \n图 6.5 – 创建一个 Ionic 账户\n\n> **提示**\n> \n> 如果你选择后者，Ionic 将自动为你的应用程序创建一个仓库并将其与你的\
  \ Ionic 控制面板连接。\n\n对于本项目，建议选择其中一个可用的免费 Git 服务。当你选择这样做时，系统会要求你使用所选的 Git 服务进行授权。\n\
  \n8. 点击你选择的 Git 主机上的 **Connect** 按钮，将你的新 Ionic 账户与 Git 服务连接：\n\n![](img/efea53d01337e7b223389b38dcdb0160_177_0.png)\n\
  \n图 6.6 – 连接到 Git 主机\n\n9. 点击 **Choose** 按钮选择你的 Git 账户，Ionic 将开始构建你的应用程序：\n\n![](img/efea53d01337e7b223389b38dcdb0160_177_1.png)\n\
  \n图 6.7 – 构建 Ionic 应用程序\n\n构建完成后，你将被重定向到应用程序的 Ionic 控制面板。从那里，你可以为你的应用程序完成特定任务，例如设置持续集成/开发\
  \ CI/CD 管道、构建和预览你的应用程序。\n\nIonic 为我们创建了一个示例应用程序，其中包含一些现成的[content]\n\n# Scaffolding\
  \ the application\n\nTo create a new Ionic application, we need to head over to\
  \ https://www.ionicframework.com and complete the following steps:\n\n- 1. Click\
  \ on the Get Started button that is displayed on the header of the landing page:\n\
  - 2. Enter the name of your application in the App name field:\n- 3. Use the Pick\
  \ an icon field to define the icon of your application. Hover with your mouse over\
  \ the default icon, and either pick one from the emoji gallery or upload one of\
  \ your choice.\n- 4. Select the brand color of your application in the Pick a theme\
  \ color field. The brand color is used in various places of an application, such\
  \ as the background, toolbars, and text. You can select either a predefined color\
  \ or create a custom one using an RGB combination.\n- 5. Choose the layout of your\
  \ application using the Pick a layout template field. You can select among three\
  \ different templates. In this project, we will use the MENU template:\n\n![](img/efea53d01337e7b223389b38dcdb0160_174_0.png)\n\
  \nYou will be redirected to the Create your Ionic App page to fill in all the necessary\
  \ details to create your Ionic application.\n\n![](img/efea53d01337e7b223389b38dcdb0160_174_1.png)\n\
  \nFigure 6.1 – Start an Ionic application\n\nFigure 6.2 – Enter the application\
  \ name\n\n- 7. You will be redirected to the signup page, where you will need to\
  \ create an Ionic account. You can either create a new one from scratch or select\
  \ to use one of the free Git services:\n\n![](img/efea53d01337e7b223389b38dcdb0160_176_0.png)\n\
  \nFigure 6.5 – Create an Ionic account\n\n> **Tip**\n> \n> Ionic will create a repository\
  \ for your application automatically and connect it with your Ionic dashboard if\
  \ you select the latter.\n\nFor this project, it is recommended to select one of\
  \ the free Git services available. When you choose to do so, you will be asked to\
  \ be authorized with the selected Git service.\n\n8. Click the **Connect** button\
  \ on the Git host of your choice to connect your new Ionic account with the Git\
  \ service:\n\n![](img/efea53d01337e7b223389b38dcdb0160_177_0.png)\n\nFigure 6.6\
  \ – Connect to a Git host\n\n9. Click the **Choose** button to select your Git account,\
  \ and Ionic will start building your application:\n\n![](img/efea53d01337e7b223389b38dcdb0160_177_1.png)\n\
  \nFigure 6.7 – Building the Ionic application\n\nAfter the build has finished, you\
  \ will be redirected to the Ionic dashboard of your application. From there, you\
  \ can accomplish specific tasks for your application, such as setting up a Continuous\
  \ Integration/Development (CI/CD) pipeline, building, and previewing your application.\n\
  \nIonic has created a sample application for us with some ready-made data. To modify\
  \ it according to our needs, we need to get a copy of the application locally. Let's\
  \ see how we can accomplish that in the following section.\n\n## Building the main\
  \ menu\n\nIonic provides a command-line tool called the Ionic CLI that is used to\
  \ build and run an Ionic mobile application. Let's see how we can install it and\
  \ start building the main menu of our application:\n\n- 1. Install the Ionic CLI\
  \ using the following npm command:\n\n```\nnpm install -g @ionic/cli cordova-res\n\
  ```\n\nThe cordova-res library is used to generate the icons and splash screens\
  \ of our application for native mobile devices.\n\n- 2. Ionic has already created\
  \ a Git repository for our Ionic application in our Git host. Clone the repository\
  \ locally into your system and run the following command to install all the dependencies\
  \ of the application:\n\n```\nnpm install\n```\n\n- 3. Open the main HTML file of\
  \ the application, index.html, and add the name of your application in the title\
  \ tag:\n\n```\n<title>Phototag App</title>\n```\n\n- 4. Open the template file of\
  \ the main component, app.component.html, and remove the second ion-list element.\
  \ An ion-list element displays a collection of items in a list view.\n\n- 5. Add\
  \ the name of your application in the ion-list-header element and change the text\
  \ of the ion-note element:\n\n```\n<ion-list-header>Phototag</ion-list-header>\n\
  ```\n\n```\n<ion-note>Capture geotagged photos</ion-note>\n```\n\nAn ion-list-header\
  \ element is the header of a list. An ion-note element is a text element that is\
  \ used to provide additional information, such as the subtitle of a list.\n\n- 6.\
  \ Open the TypeScript file of the main component, `app.component.ts`, and modify\
  \ it as follows:\n\n```\nimport { Component } from '@angular/core';\n@Component({\n\
  \  selector: 'app-root',\n  templateUrl: 'app.component.html',\n  styleUrls: ['app.component.scss'],\n\
  })\nexport class AppComponent {\n  public appPages = [\n    {\n      title: 'Take\
  \ a photo',\n      url: '/capture',\n      icon: 'camera'\n    },\n    {\n     \
  \ title: 'View gallery',\n      url: '/view',\n      icon: 'globe'\n    }\n  ];\n\
  }\n```\n\nThe appPages property contains all the pages of our application. Each\
  \ page has a title, the URL from which it is accessible, and an icon. Our application\
  \ will consist of two pages, one that will be used for taking photos using the camera\
  \ and another for displaying them on a map.\n\n- 7. Run the `serve` command of the\
  \ Ionic CLI to start the application:\n\n```\nionic serve\n```\n\nThe preceding\
  \ command will build your application and open your default browser at `http://localhost:8100`.\n\
  \nClick on the **Menu** button, and you should see the following output:\n\n![](img/efea53d01337e7b223389b38dcdb0160_180_0.png)\n\
  \nFigure 6.8 – Main menu\n\n> **Tip**\n> \n> Try to adjust your browser window size\
  \ to achieve a more realistic view for a mobile device, or use the **Device toolbar**\
  \ in the **Google Chrome** developer tools. You can find more details about the\
  \ Device toolbar at `https://developers.google.com/web/tools/chrome-devtools/device-mode#viewport`.\n\
  \nWe have learned how to create a new Ionic application using the getting started\
  \ page of the Ionic website. We also saw how to get the application locally on our\
  \ machine and make modifications according to our needs.\n\nIf we now try to click\
  \ on a menu item, we will notice that nothing happens since we have not created\
  \ the necessary pages that will be activated in each case. In the following section,\
  \ we will learn how to complete this task by building the functionality of the first\
  \ page.\n\n## Taking photos with Capacitor\n\nThe first page of our application\
  \ will allow the user to take photos using the camera. We will use the Capacitor\
  \ runtime to get access to the native resource of the camera. To implement the page,\
  \ we need to take the following actions:\n\n- Create the user interface.\n- Interact\
  \ with Capacitor.\n\nLet's start building the user interface of the page.\n\n```\n\
  <ion-menu-button color=\"primary\">\n</ion-menu-button>\n</ion-buttons>\n<ion-title>Take\
  \ a photo</ion-title>\n</ion-toolbar>\n</ion-header>\n```\n\nThe ion-toolbar element\
  \ is part of the ion-header element, which is the top navigation bar of the page.\
  \ It contains an ion-menu-button element for toggling the main menu of the application\
  \ and an ion-title element that depicts the title of the page.\n\n- 3. Add a second\
  \ ion-header element inside the ion-content element with the following HTML code:\n\
  \n```\n<ion-content>\n<ion-header collapse=\"condense\">\n<ion-toolbar>\n<ion-title\
  \ size=\"large\">Take a photo</ion-title>\n</ion-toolbar>\n</ion-header>\n</ion-content>\n\
  ```\n\nThe header will be displayed when the page is expanded and the main menu\
  \ is displayed on the screen. The size attribute of the ion-title element is set\
  \ to large for supporting collapsible large tiles on iOS devices.\n\n- 4. Add the\
  \ following HTML code immediately after the second header:\n\n```\n<div id=\"container\"\
  >\n<strong class=\"capitalize\">Take a nice photo with\n your camera</strong>\n\
  <ion-fab vertical=\"center\" horizontal=\"center\"\n slot=\"fixed\">\n<ion-fab-button>\n\
  <ion-icon name=\"camera\"></ion-icon>\n</ion-fab-button>\n</ion-fab>\n</div>\n```\n\
  \nIt contains an `ion-fab-button` element, which, when clicked, will open the camera\
  \ of the device to take a photo.\n\n- 5. Finally, let's add some cool styles to\
  \ our page. Open the `capture.page.scss` file and enter the following CSS styles:\n\
  \n```\n```css\n#container {\n    text-align: center;\n    position: absolute;\n\
  \    left: 0;\n    right: 0;\n    top: 50%;\n    transform: translateY(-50%);\n\
  }\n\n#container strong {\n    font-size: 20px;\n    line-height: 26px;\n}\n\n#container\
  \ ion-fab {\n    margin-top: 60px;\n}\n```\n```\n\nLet's run the application using\
  \ `ionic serve` to get a quick preview of what we have built so far:\n\n![](img/efea53d01337e7b223389b38dcdb0160_183_0.png)\n\
  \nFigure 6.9 – Capture page\n\n\n\n\n页面上的相机按钮需要打开相机进行拍照。在接下来的部分中，我们将学习如何使用 Capacitor\
  \ 与相机交互。\n\n# 与 Capacitor 交互\n\n在我们的应用中拍照需要用到 Capacitor 库中的两个 API。**Camera** API\
  \ 将打开相机拍照，**Geolocation** API 将从 GPS 读取当前位置。让我们看看如何在应用中使用这两个 API：\n\n1. 执行以下 npm\
  \ 命令来安装这两个 API：\n\n   ```bash\n   npm install @capacitor/camera @capacitor/geolocation\n\
  \   ```\n\n2. 使用以下 Ionic CLI 命令创建一个 Angular 服务：\n\n   ```bash\n   ionic generate\
  \ service photo\n   ```\n\n3. 打开 `photo.service.ts` 文件并添加以下导入语句：\n\n   ```typescript\n\
  \   import { Camera, CameraResultType, CameraSource } from '@capacitor/camera';\n\
  \   import { Geolocation } from '@capacitor/geolocation';\n   ```\n\n4. 在 PhotoService\
  \ 类中创建一个方法，从 GPS 设备读取当前位置：\n\n   ```typescript\n   private async getLocation() {\n\
  \     const location = await\n       Geolocation.getCurrentPosition();\n     return\
  \ location.coords;\n   }\n   ```\n\nGeolocation 对象的 getCurrentPosition 方法包含一个 coords\
  \ 属性，其中包含各种基于位置的数据，例如纬度和经度。\n\n5. 创建另一个方法，调用 getLocation 方法并打开设备相机拍照：\n\n   ```typescript\n\
  \   async takePhoto() {\n     await this.getLocation();\n\n     await Camera.getPhoto({\n\
  \       resultType: CameraResultType.DataUrl,\n       source: CameraSource.Camera,\n\
  \       quality: 100\n     });\n   }\n   ```\n\n我们使用 Camera 对象的 getPhoto 方法，并传入一个配置对象来定义每张照片的属性。resultType\
  \ 属性表示照片将以 data URL 格式保存，以便日后轻松保存到云端。source 属性表示我们将使用相机设备获取照片，quality 属性定义实际照片的质量。\n\
  \n6. 打开 capture.page.ts 文件，并在 CapturePage 类的构造函数中注入 PhotoService：\n\n   ```typescript\n\
  \   import { Component, OnInit } from '@angular/core';\n   import { PhotoService\
  \ } from '../photo.service';\n\n   @Component({\n     selector: 'app-capture',\n\
  \     templateUrl: './capture.page.html',\n     styleUrls: ['./capture.page.scss'],\n\
  \   })\n   export class CapturePage implements OnInit {\n\n     constructor(private\
  \ photoService: PhotoService) { }\n\n     ngOnInit() {\n     }\n\n   }\n   ```\n\
  \n7. 创建一个组件方法，调用 photoService 变量的 takePhoto 方法：\n\n   ```typescript\n   openCamera()\
  \ {\n     this.photoService.takePhoto();\n   }\n   ```\n\n8. 打开 `capture.page.html`\
  \ 文件，并将 `ion-fab-button` 元素的 `click` 事件绑定到 `openCamera` 组件方法：\n\n   ```html\n  \
  \ <ion-fab vertical=\"center\" horizontal=\"center\"\n   slot=\"fixed\">\n     <ion-fab-button\
  \ (click)=\"openCamera()\">\n       <ion-icon name=\"camera\"></ion-icon>\n    \
  \ </ion-fab-button>\n   </ion-fab>\n   ```\n\n现在我们已经添加了使用设备相机拍照所需的所有部分。让我们尝试在真实设备上运行应用，测试与相机的交互：\n\
  \n1. 首先，我们需要使用以下 Ionic CLI 命令构建应用：\n\n   ```bash\n   ionic build\n   ```\n\n上述命令将在项目的根目录中创建一个包含应用包的\
  \ www 文件夹。\n\n2. 使用以下命令安装要在其上运行应用的相应平台：\n\n   ```bash\n   npm install @capacitor/<os>\n\
  \   ```\n\n在上一个命令中，`<os>` 参数可以是 `android` 或 `ios`。如果你的应用面向两个平台，则必须执行该命令两次。\n\n3.\
  \ 然后，使用以下命令将已安装的平台添加到 Capacitor 中：\n\n   ```bash\n   ionic cap add <os>\n   ```\n\
  \n`cap` 命令是 Capacitor 库的可执行文件。\n\n该命令将为每个平台创建一个文件夹，并且还会在 `package.json` 文件的 `dependencies`\
  \ 部分添加所需的 npm 包。\n\n> **重要说明**\n> 你必须将特定的平台文件夹添加到源代码管理中，以便项目的其他部分可以使用它。\n\n4. 最后，运行以下命令打开应用：\n\
  \n   ```bash\n   ionic cap open <os>\n   ```\n\n在上一个命令中，`<os>` 可以是 `android` 或 `ios`。执行后，它将根据你指定的平台在相应的\
  \ IDE（Android Studio 或 Xcode）中打开原生移动项目。然后必须使用该 IDE 运行原生应用。\n\n> **重要说明**\n>\n> 每次重新构建应用时，你都需要运行\
  \ `npx cap copy` 命令，将应用包从 www 文件夹复制到原生移动项目中。\n\n5. 点击相机按钮，应用将分别请求你允许使用 GPS 和相机。\n\
  \n> **重要说明**\n>\n> 你可能需要在开发环境的原生移动项目中添加额外的权限。请查看 Capacitor 网站上有关这些 API 的相应文档。\n\n\
  现在，我们应用的第一页拥有一个简洁的界面，允许用户与相机交互。我们还创建了一个 Angular 服务，确保与 Capacitor 无缝交互，从而获取基于位置的数据并拍照。在下一节中，我们将了解如何使用\
  \ Firebase 将它们保存到云端。\n\n# 在 Firebase 中存储数据\n\n应用将能够把照片及其位置存储到 Firebase 中。我们将使用 Storage\
  \ 服务上传照片，并使用 Cloud Firestore 数据库保存它们的位置。我们将通过以下任务进一步扩展应用：\n\n- 创建 Firebase 项目\n\
  - 集成 **AngularFire** 库\n\n首先，我们需要为应用创建一个新的 Firebase 项目。\n\n## 创建 Firebase 项目\n\n\
  我们可以使用 https://console.firebase.google.com 上的 Firebase 控制台来设置和配置 Firebase 项目：\n\n\
  1. 单击 **添加项目** 按钮创建一个新的 Firebase 项目：\n\n![](img/efea53d01337e7b223389b38dcdb0160_188_0.png)\n\
  \n图 6.10 – 创建新的 Firebase 项目\n\n2. 为你的项目输入一个名称，然后单击 **继续** 按钮：\n\n![](img/efea53d01337e7b223389b38dcdb0160_188_1.png)\n\
  \n图 6.11 – 输入项目名称\n\n> **重要说明**\n> Firebase 会为你的项目生成一个唯一标识符，该标识符位于项目名称下方，并在各种 Firebase\
  \ 服务中使用。\n\n3. 为此项目禁用 **Google Analytics**，并单击 **创建项目** 按钮：\n\n![](img/efea53d01337e7b223389b38dcdb0160_189_0.png)\n\
  \n图 6.12 – 禁用 Google Analytics\n\n4. 等待新项目创建完成，然后单击 **继续** 按钮。你将跳转到新项目的仪表板，其中包含一系列选项：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_189_1.png)\n\n图 6.13 – 选择应用类型\n\n单击带有\
  \ *代码* 图标的第三个选项，将 Firebase 添加到 Web 应用中。\n\n5. 在 **应用昵称** 字段中输入应用名称，并单击 **注册应用**\
  \ 按钮：\n\n![](img/efea53d01337e7b223389b38dcdb0160_189_2.png)\n\n图 6.14 – 应用注册\n\n\
  6. Firebase 将生成一个配置，我们稍后将在移动应用中使用该配置：\n\n   ```javascript\n   var firebaseConfig\
  \ = {\n       apiKey: \"<Your API key>\",\n       authDomain: \"<Your project auth\
  \ domain>\",\n       projectId: \"<Your project ID>\",\n       storageBucket: \"\
  <Your storage bucket>\",\n       messagingSenderId: \"<Your messaging sender ID>\"\
  ,\n       appId: \"<Your application ID>\"\n   };\n   ```\n\n记下 `firebaseConfig`\
  \ 对象，并单击 **转到控制台** 按钮。\n\n> **提示**\n>\n> 稍后还可以通过 `https://console.firebase.google.com/project/<project-id>/settings/general`\
  \ 访问 Firebase 配置，其中 project-id 是你的 Firebase 项目的 ID。\n\n7. 返回仪表板控制台，选择 **Cloud Firestore**\
  \ 选项以在应用中启用 Cloud Firestore：\n\n![](img/efea53d01337e7b223389b38dcdb0160_190_0.png)\n\
  \n图 6.15 – 启用 Cloud Firestore\n\n\n\n\n\n10. 根据区域设置选择数据库位置并单击 **Enable** 按钮：\n\n\
  \   ![](img/efea53d01337e7b223389b38dcdb0160_192_0.png)\n\n   *Figure 6.18 – Select\
  \ the database location*\n\n恭喜！你已创建了一个新的 Cloud Firestore 数据库。在下一节中，我们将学习如何将新数据库投入使用，通过我们的移动应用程序保存数据。\n\
  \n## Integrating the AngularFire library\n\nAngularFire 库是一个 Angular 库，我们可以在 Angular\
  \ 应用中使用它来与 Firebase 家族产品（如 Cloud Firestore 和 Storage 服务）交互。要在我们的应用中安装它，请运行以下 Angular\
  \ CLI 命令：\n\n```bash\nng add @angular/fire\n```\n\n前面的命令会要求你选择我们在上一节中创建的 Firebase\
  \ 项目，并相应地修改应用结构以使用 AngularFire。现在让我们看看如何在我们的应用中使用 AngularFire 库：\n\n1. 打开 `src\\\
  environments\\environment.ts` 文件并将你的 Firebase 配置内容复制到 environment 对象中，如下所示：\n\n\
  \   ```typescript\n   export const environment = {\n     production: false,\n  \
  \   firebaseConfig: {\n       apiKey: '<Your API key>',\n       authDomain: '<Your\
  \ project auth domain>',\n       projectId: '<Your project ID>',\n       storageBucket:\
  \ '<Your storage bucket>',\n       messagingSenderId: '<Your messaging sender ID>',\n\
  \       appId: '<Your application ID>'\n     }\n   };\n   ```\n\n   environment.ts\
  \ 文件在我们以开发模式运行应用时使用。\n\n2. 我们在生产模式下运行应用时也需要相同的 Firebase 配置。将 Firebase 配置内容复制到生产模式下使用的\
  \ `src\\environments\\environment.prod.ts` 文件中。\n\n3. 打开 app.module.ts 文件并添加以下导入语句：\n\
  \n   ```typescript\n   import { AngularFireModule } from '@angular/fire';\n   import\
  \ { AngularFirestoreModule } from '@angular/fire/firestore';\n   import { AngularFireStorageModule\
  \ } from '@angular/fire/storage';\n   import { environment } from '../environments/environment';\n\
  \   ```\n\n   AngularFireModule 是 AngularFire 库的主模块。AngularFirestoreModule 是 AngularFire\
  \ 的特定模块，我们在处理 Cloud Firestore 数据库时需要它。AngularFireStorageModule 是我们可以用来与 Storage\
  \ 服务交互的模块。\n\n   在前面的代码中，我们还导入了包含 Firebase 配置的 environment 对象。\n\n   > **Important\
  \ note**\n   > 我们从开发环境文件导入 environment 对象，而不是生产环境文件。Angular 框架足够智能，可以理解我们当前以何种环境运行应用，并在运行时使用适当的文件。\n\
  \n4. 还将 AngularFire 模块添加到 @NgModule 装饰器的 imports 数组中：\n\n   ```typescript\n   imports:\
  \ [BrowserModule, IonicModule.forRoot(),\n     AppRoutingModule,\n     AngularFireModule.initializeApp\n\
  \       (environment.firebaseConfig),\n     AngularFirestoreModule,\n     AngularFireStorageModule\n\
  \   ]\n   ```\n\n   在前面的代码中，我们使用 `AngularFireModule` 类的 `initializeApp` 方法将我们的应用注册到我们的\
  \ Firebase 项目。\n\n5. 在继续之前，我们需要为将保存在 Cloud Firestore 数据库中的数据创建一个模型。执行以下 Ionic CLI\
  \ 命令来创建它：\n\n   ```bash\n   ionic generate interface photo\n   ```\n\n6. 打开 `photo.ts`\
  \ 文件并在 Photo 接口中添加以下属性：\n\n   ```typescript\n   export interface Photo {\n     url:\
  \ string;\n     lat: number;\n     lng: number;\n   }\n   ```\n\n   url 属性将是实际照片的\
  \ URL，而 `lat`/`lng` 属性表示当前位置的纬度和经度。\n\n7. 打开 `photo.service.ts` 文件并添加以下导入语句：\n\n\
  \   ```typescript\n   import { AngularFirestore } from '@angular/fire/firestore';\n\
  \   import { AngularFireStorage } from '@angular/fire/storage';\n   import { Photo\
  \ } from './photo';\n   ```\n\n   AngularFirestore 服务包含我们与 Cloud Firestore 数据库交互所需的所有方法。AngularFireStorage\
  \ 服务包含用于将文件上传到 Storage 服务的方法。\n\n8. 将两个服务都注入到 PhotoService 类的构造函数中：\n\n   ```typescript\n\
  \   constructor(private firestore: AngularFirestore, private storage: AngularFireStorage)\
  \ {}\n   ```\n\n9. 创建以下方法以将照片保存到 Firebase：\n\n   ```typescript\n   private async\
  \ savePhoto(dataUrl: string, latitude: number, longitude: number) {\n     const\
  \ name = new Date().getUTCMilliseconds().toString();\n     const upload = await\
  \ this.storage.ref(name).putString(dataUrl, 'data_url');\n     const photoUrl =\
  \ await upload.ref.getDownloadURL();\n     await this.firestore.collection<Photo>('photos').add({\n\
  \       url: photoUrl,\n       lat: latitude,\n       lng: longitude\n     });\n\
  \   }\n   ```\n\n   首先，我们为照片创建一个随机名称，并使用 storage 变量的 putString 方法将其上传到 Firebase\
  \ 存储。一旦上传完成，我们使用 getDownloadURL 方法获取可下载的 URL，可用于访问该照片。最后，我们使用 add 方法在 firestore\
  \ 变量的 collection 属性中添加一个新的 Photo 对象。我们使用 collection 属性，因为我们希望在应用中处理照片列表。\n\n   >\
  \ **Tip**\n   > firestore 变量还包含一个 doc 属性，可在我们想要处理单个对象时使用。collection 属性内部维护着一个 doc\
  \ 对象的列表。\n\n10. 修改 takePhoto 方法以调用我们在步骤 9 中创建的 savePhoto 方法：\n\n    ```typescript\n\
  \    async takePhoto() {\n      const { latitude, longitude } = await this.getLocation();\n\
  \n      const cameraPhoto = await Camera.getPhoto({\n        resultType: CameraResultType.DataUrl,\n\
  \        source: CameraSource.Camera,\n        quality: 100\n      });\n\n     \
  \ await this.savePhoto(cameraPhoto.dataUrl, latitude, longitude);\n    }\n    ```\n\
  \n我们现在准备好检查拍照过程的完整功能：\n\n1. 使用以下 Ionic CLI 命令构建应用：\n\n   ```bash\n   ionic build\n\
  \   ```\n\n2. 运行以下 Capacitor 命令将应用包复制到原生移动项目中：\n\n   ```bash\n   ionic cap copy\n\
  \   ```\n\n3. 使用 Capacitor 的 open 命令打开原生移动项目，并使用相应的 IDE 运行项目。\n\n4. 打开你的应用的 Firebase\

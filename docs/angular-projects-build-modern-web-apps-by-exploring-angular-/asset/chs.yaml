- "# 1 创建我们的第一个 Angular 应用\n在 Angular 中创建你的第一个 Web 应用程序\n\n**Angular** 是一个流行且现代的 **JavaScript**\
  \ 框架，除了 Web 之外，它还可以在不同的平台上运行，例如桌面和移动端。Angular 应用程序使用 **TypeScript** 编写，TypeScript\
  \ 是 JavaScript 的一个超集，提供了诸如强类型和面向对象技术等语法糖。\n\nAngular 应用程序是使用 Angular 团队制作的一个名为 **Angular\
  \ CLI** 的命令行工具创建和开发的。它自动化了许多开发任务，例如搭建脚手架、测试和部署 Angular 应用程序，这些任务如果手动配置将花费大量时间。\n\
  \nAngular 框架的流行在很大程度上反映在其对工具生态的广泛支持上。**Visual Studio Code（VSCode）** 编辑器包含各种扩展，可增强使用\
  \ Angular 时的开发体验。\n\n在本章中，我们将涵盖以下主题：\n\n- Angular 简介\n- Angular CLI 简介\n- 探索 VSCode\
  \ 中丰富的 Angular 工具生态系统\n- 如何创建我们的第一个 Angular 应用程序\n- 如何使用 Nx Console 自动化 Angular\
  \ CLI 命令\n\n## 基本背景理论和上下文\n\nAngular 框架是一个跨平台的 JavaScript 框架，可以在包括 Web、服务器、移动端和桌面在内的广泛环境中运行。它由一组\
  \ JavaScript 库组成，我们可以用它们来构建高性能、可扩展的 Web 应用程序。Angular 应用程序的架构基于组件的分层表示。组件是 Angular\
  \ 应用程序的基本构建块。它们表示并控制网页的特定部分，称为*视图*。组件的一些示例如下：\n\n- 博客文章列表\n- 问题报告表单\n- 天气显示小部件\n\
  \nAngular 应用程序的组件可以在逻辑上组织为一棵树：\n\n![](img/efea53d01337e7b223389b38dcdb0160_20_0.png)\n\
  \n按照惯例，Angular 应用程序通常有一个主组件，称为 **AppComponent**。树中的每个组件都可以使用由各自定义的应用程序编程接口与其兄弟组件进行通信和交互。\n\
  \nAngular 应用程序可以具有许多被称为模块的功能。每个模块提供一块单一功能，对应于特定的应用领域或工作流。Angular 模块用于对具有相似功能的 Angular\
  \ 组件进行分组：\n\n![](img/efea53d01337e7b223389b38dcdb0160_21_0.png)\n\n在上图中，虚线圆圈代表 Angular\
  \ 模块。按照惯例，Angular 应用程序通常有一个主模块，称为 **AppModule**。如果某个模块希望使用 Angular 应用程序中其他模块的部分功能，则它可以导入这些模块。\n\
  \n模块的功能可以进一步划分为功能的表示逻辑和业务逻辑。Angular 组件只应负责处理表示逻辑，并将业务逻辑任务委托给服务。Angular 框架使用内置的**依赖注入（DI）**机制向组件提供\
  \ Angular 服务。\n\nAngular DI 框架使用称为注入器的专用对象，来隐藏为 Angular 应用程序提供依赖关系的大部分复杂性。组件不需要知道\
  \ Angular 服务的任何实际实现。它们只需要向注入器请求即可。\n\nAngular 服务应遵循单一职责原则，并且不应跨越不同 Angular 模块之间的边界。服务的一些示例如下：\n\
  \n- 使用 HTTP 协议从后端 API 访问数据。\n- 与浏览器的本地存储进行交互。\n- 错误日志记录。\n- 数据转换。\n\n在构建 Angular\
  \ 应用程序时，Angular 开发人员不需要死记硬背如何创建组件、模块和服务。幸运的是，Angular CLI 可以通过提供命令行界面来帮助我们完成这些任务。\n\
  \n## Angular CLI 简介\n\nAngular CLI 是由 Angular 团队创建的一个工具，它改善了构建 Angular 应用程序时的开发体验。它隐藏了搭建和配置\
  \ Angular 应用程序的许多复杂性，同时让开发人员能够专注于他们最擅长的事情——编码！在开始使用 Angular CLI 之前，我们需要在系统中设置以下先决条件：\n\
  \n- **Node.js：** 一个基于 Chrome 的 v8 引擎构建的 JavaScript 运行时。你可以从 https://nodejs.org/en\
  \ 下载任何**长期支持（LTS）**版本。\n- **npm：** Node.js 运行时的包管理器。\n\n然后我们可以使用 npm 从命令行安装 Angular\
  \ CLI：\n\n```bash\nnpm install -g @angular/cli\n```\n\n我们可以使用 `-g` 选项全局安装 Angular\
  \ CLI，因为我们想从操作系统的任何路径创建 Angular 应用程序。\n\n> **重要说明**\n> 在某些操作系统中，安装 Angular CLI 可能需要管理员权限。\n\
  \n\n\n\n\n前面的列表并非详尽无遗，其中一些扩展已包含在 **Angular Essentials** 套件中。不过，你可以在 `https://marketplace.visualstudio.com/search?term=angular&target=VSCode`\
  \ 浏览更多适用于 VSCode 的 Angular 扩展。\n\n## Nx Console\n\nNx Console 是由 Nrwl 团队开发的 VSCode\
  \ 扩展，它为 Angular CLI 提供了图形用户界面。它包含了大部分 Angular CLI 命令，并在内部使用 Angular CLI 来执行每一条命令。我们将在\
  \ *使用 Nx Console 构建我们的应用程序* 部分更深入地学习该扩展。\n\n## Angular Language Service\n\nAngular\
  \ Language Service 扩展在编辑 Angular 应用中的 HTML 模板时提供了各种增强功能，包括以下内容：\n\n- 代码自动补全\n- 编译错误信息\n\
  - 转到定义技术\n\n代码自动补全是一项功能，可在输入时帮助我们找到要使用的正确属性或方法。它通过在我们开始在 HTML 内容中输入时显示建议列表来实现：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_24_0.png)\n\n图 1.3 – 代码补全\n\n在之前的截图中，当我们开始输入单词\
  \ `ti` 时，Angular Language Service 会建议 `title` 组件属性。请注意，代码补全仅适用于组件中的公共属性和方法。\n\n\
  在开发 Web 应用时最常见的问题之一是在应用进入生产环境之前检测错误。此问题可部分通过 Angular 编译器解决，该编译器在为生产环境构建 Angular\
  \ 应用时启动。此外，Angular Language Service 可以更进一步，在我们的应用进入编译过程之前就显示编译错误信息：\n\n![](img/efea53d01337e7b223389b38dcdb0160_25_0.png)\n\
  \n例如，如果我们不小心拼错了组件的属性或方法名称，Angular Language Service 将显示相应的错误信息。\n\n## Angular Snippets\n\
  \nAngular Snippets 扩展包含用于 TypeScript 和 HTML 的 Angular 代码片段集合。在 TypeScript 中，我们可以在空白\
  \ TypeScript 文件中使用它来创建组件、模块或服务：\n\n![](img/efea53d01337e7b223389b38dcdb0160_25_1.png)\n\
  \n在 HTML 模板中，我们可以使用该扩展创建有用的 Angular 工件，例如 *ngFor 指令，以在 HTML 中循环遍历列表：\n\n![](img/efea53d01337e7b223389b38dcdb0160_26_0.png)\n\
  \n图 1.6 – *ngFor 片段\n\n由于 Angular CLI 的广泛流行和功能，使用它来在 TypeScript 中生成 Angular 工件似乎更方便。然而，Angular\
  \ Snippets 在 HTML 部分做得非常出色，因为在 HTML 部分有更多需要死记硬背的内容。\n\n## Angular Evergreen\n\n\
  Angular 框架如此稳定的主要因素之一是它遵循基于语义化版本控制的定期发布周期。如果我们希望我们的 Angular 应用配备最新功能和修复程序，就必须定期更新它们。但我们如何以最高效的方式保持最新？我们可以使用\
  \ Angular Evergreen 扩展来实现！\n\n它将 Angular CLI 项目的 Angular 和 Angular CLI 版本与最新版本进行比较，并提醒你是否需要更新：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_27_0.png)\n\n它提供了一个易于使用的用户界面来执行以下命令：\n\
  \n- 将 Angular 依赖项升级到 *latest* 版本\n- 将 Angular 依赖项升级到 *next* 版本\n- 升级所有 npm 依赖项\n\
  \nAngular Evergreen 是确保你的 Angular 项目永不落伍的完美扩展。\n\n## Material Icon Theme\n\n列表中最后一个扩展并不会在很大程度上增加开发者的生产力。相反，它专注于可发现性和美观性，通过修改\
  \ VSCode 的图标主题来实现。\n\n- **VSCode**：可从 https://code.visualstudio.com/Download 下载的代码编辑器。\n\
  - **Angular CLI**：我们在 *基本背景理论和上下文* 部分介绍的 Angular 命令行界面。\n- **GitHub material**：本章的相关代码可在\
  \ https://github.com/PacktPublishing/Angular-Projects-Second-Edition 的 Chapter01\
  \ 文件夹中找到。\n\n## 创建我们的第一个 Angular 应用\n\n要创建一个全新的 Angular 应用，我们必须执行 Angular CLI 的\
  \ `ng new` 命令，并将应用名称作为选项传递：\n\n```\nng new my-angular\n```\n\nnew 命令用于创建新的 Angular\
  \ 应用或新的 Angular 工作区。Angular 工作区是包含一个或多个 Angular 应用的 Angular CLI 项目，其中一些可以是 Angular\
  \ 库。因此，当我们执行 `ng new` 命令时，默认情况下会创建一个包含 Angular 应用的 Angular 工作区。\n\n在之前的命令中，我们的 Angular\
  \ 应用名称为 `my-angular`。执行命令后，Angular CLI 会提出一些问题，以尽可能多地收集有关我们想要创建的应用性质的信息。让我们看一下：\n\
  \n1. 首先，它会询问我们是否要在 Angular 应用中启用路由：\n\n```\n? Would you like to add Angular routing?\
  \ (y/N)\n```\n\n图 1.9 – Angular 路由\n\nAngular 中的路由就是使用 URL 在 Angular 应用的组件之间导航。在本项目中，我们不关心路由，因此按\
  \ *Enter* 接受默认值。\n\n2. 然后，Angular CLI 会提示我们选择要在整个 Angular 应用中使用的样式表格式：\n\n```\n\
  ? Which stylesheet format would you like to use? (Use arrow keys)\n> CSS\n  SCSS\
  \   [ https://sass-lang.com/documentation/syntax#scss                ]\n  Sass \
  \  [ https://sass-lang.com/documentation/syntax#the-indented-syntax ]\n  Less  \
  \ [ http://lesscss.org                                             ]\n```\n\n图 1.10\
  \ – 样式表格式\n\n3. 从可用样式表列表中选择一种格式并按 *Enter*。\n\n> **提示**\n> \n> 你可以使用键盘上的方向键在可用的样式表选项之间导航。\n\
  \nAngular CLI 启动你的 Angular 应用的创建过程，该过程包括以下内容：\n\n- 搭建典型 Angular CLI 项目所需的必要文件夹结构\n\
  - 安装所需 npm 依赖项和 Angular 包\n- 在 Angular CLI 项目中初始化 Git\n\n此过程可能需要一些时间，具体取决于网络速度。完成后，你应该在运行\
  \ `ng new` Angular CLI 命令的路径下拥有一个名为 `my-angular` 的新文件夹。\n\n现在，是时候运行我们的 Angular 应用并亲眼看看它了：\n\
  \n1. 打开一个终端窗口并导航到 my-angular 文件夹。\n2. 运行以下 Angular CLI 命令：\n\n```\nng serve\n```\n\
  \n这将构建 Angular 应用并启动一个内置 Web 服务器，我们可以用它来预览应用。Web 服务器以监视模式启动；也就是说，每当我们在代码中进行更改时，它都会自动重建\
  \ Angular 应用。Angular 应用首次构建时需要相当长的时间才能完成，因此我们必须耐心等待。当你在终端窗口中看到以下消息时，你就知道该过程已成功完成且无错误：\n\
  \n```\n** Angular Live Development Server is listening on localhost:4200, open your\
  \ browser on http://localhost:4200/ **\n\n✔ Compiled successfully.\n```\n\n图 1.11\
  \ – Angular 构建输出\n\n3. 启动你喜欢的浏览器并导航到 `http://localhost:4200` 以预览你全新的 Angular 应用：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_31_0.png)\n\n图 1.12 – 最小 Angular 应用\n\
  \nAngular CLI 默认创建一个最小的 Angular 应用，为我们的 Angular 项目提供起点。它包含一些现成的 CSS 样式和 HTML 内容，我们将在下一节学习如何根据我们的规范对其进行更改。\n\
  \n\n\n\n\n## 与 Angular 框架交互\n\n在与 Angular 协作时，当我们开始深入接触框架本身时，真正的乐趣才开始。理解 Angular\
  \ 的工作原理并编写应用程序代码才是关键。\n\n应用程序源代码位于 Angular CLI 项目根目录下的 `src\\app` 文件夹内。它包含构建和测试\
  \ Angular 应用程序所需的所有文件，包括一个组件和一个模块。组件是 Angular 应用程序的主组件：\n\n**app.component.ts**\n\
  \n```\n```typescript\nimport { Component } from '@angular/core';\n\n@Component({\n\
  \  selector: 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.css']\n\
  })\nexport class AppComponent {\n  title = 'my-angular';\n}\n```\n```\n\n以下属性描述了\
  \ Angular 组件的特征：\n\n- * `selector`: 一个唯一名称，用于在 HTML 内容中标识并声明组件。它用作 HTML 标签，就像任何原生\
  \ HTML 元素一样，例如 `<app-root></app-root>`。\n\n> > **提示**\n> > Angular CLI 默认在组件选择器中提供\
  \ app 前缀。我们可以在从头创建新的 Angular CLI 应用程序时使用 `--prefix` 选项使用自定义前缀。自定义前缀可以基于组织名称或特定产品名称，有助于避免与其他库或模块发生冲突。\n\
  \n- * `templateUrl`: 指向包含组件 HTML 内容的 HTML 文件的路径，该文件称为组件的模板。\n- * `styleUrls`: 一组路径列表，其中每个路径指向包含组件\
  \ CSS 样式的样式表文件。\n\n上述属性是使用 `@Component` 装饰器定义的。它是一个装饰 TypeScript 组件类的函数，并将其识别为 Angular\
  \ 组件。AppComponent 类的 `title` 属性是一个公共属性，包含字符串值，可在组件模板中使用。\n\n我们 Angular 应用程序的主模块使用类似的装饰器\
  \ `@NgModule` 来定义其属性：\n\n### app.module.ts\n\n```\n```typescript\nimport { NgModule\
  \ } from '@angular/core';\nimport { BrowserModule } from '@angular/platform-browser';\n\
  \nimport { AppComponent } from './app.component';\n\n@NgModule({\n  declarations:\
  \ [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule\n  ],\n  providers:\
  \ [],\n  bootstrap: [AppComponent]\n})\nexport class AppModule { }\n```\n```\n\n\
  Angular 模块的装饰器定义了一组可用于配置模块的属性。其中最常见的是：\n\n- - `declarations`: 定义属于 Angular 模块的 Angular\
  \ 组件。Angular 模块中存在的每个组件 *必须* 添加到 declarations 数组中。\n- - `imports`: 定义包含 Angular\
  \ 模块所需功能的其它 Angular 模块。\n\n现在让我们通过修改 Angular 应用程序的代码来开始实践。我们将更改以下在应用程序启动时显示的问候消息，使其更有意义：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_34_0.png)\n\n图 1.13 – 问候消息\n\n首先，我们需要找到上一个截图中消息声明的位置。Angular\
  \ 应用程序的主组件是默认在应用程序启动时加载的组件。\n\n> **提示**\n> \n> 在 Angular 应用程序引导时显示的组件由应用程序主模块的 `bootstrap`\
  \ 属性指示。我们很少需要更改此属性。该组件的选择器默认在 `index.html` 文件中使用。\n\n因此，消息应该在 `app.component.ts`\
  \ 文件中声明。让我们看一下：\n\n- 1. 打开 VSCode 编辑器，并在 **Welcome** 屏幕的 **Start** 部分中选择 **Open\
  \ folder…**。\n- 2. 找到我们创建的 Angular 应用程序的 `my-angular` 文件夹并选择它。\n- 3. 从 **EXPLORER**\
  \ 面板导航到 `src\\app` 文件夹并选择 `app.component.ts` 文件。\n- 4. 在 AppComponent 类中定位 `title`\
  \ 属性并将其值更改为 `Angular Projects:`\n- 5. 如果应用程序未运行，从 Terminal 窗口运行 `ng serve`，并使用浏览器导航到\
  \ `http://localhost:4200`。我们的 Angular 应用程序现在应显示以下问候消息：\n\n```\n```typescript\ntitle\
  \ = 'Angular Projects';\n```\n```\n\n![](img/efea53d01337e7b223389b38dcdb0160_35_0.png)\n\
  \n图 1.14 – 问候消息\n\ntitle 属性绑定到主组件的模板。如果我们打开 app.component.html 文件并转到第 346 行，我们将看到以下\
  \ HTML 代码：\n\n```\n```html\n<span>{{ title }} app is running!</span>\n```\n```\n\
  \n包围 `title` 属性的 `{{}}` 语法称为 **插值**。在插值期间，Angular 框架读取封闭的组件属性值，将其转换为文本并打印到屏幕上。\n\
  \nAngular CLI 提供了丰富的命令集合，可在日常开发过程中协助我们。从 Terminal 窗口运行这些命令看起来很简单，但很快就会变成噩梦。\n\n\
  ### 使用 Nx Console 构建我们的应用程序\n\nAngular CLI 是一种命令行工具，具有多种命令。每个命令都可以根据我们想要完成的任务接受各种选项和参数。记住这些命令及其选项的过程令人望而生畏且耗时。在这种情况下，Angular\
  \ 工具生态系统可以派上用场。VSCode Marketplace 包含许多有用的扩展，我们可以安装它们来帮助我们在 Angular 开发过程中。其中一个扩展是\
  \ Nx Console，它在 Angular CLI 之上提供用户界面。要在环境中安装 Nx Console，请按照以下步骤操作：\n\n- 1. 打开 VSCode\
  \ 并单击侧边栏中的 **Extensions** 菜单：\n\n![](img/efea53d01337e7b223389b38dcdb0160_35_1.png)\n\
  \n图 1.15 – VSCode Extensions\n\n- 2. 在出现的 **EXTENSIONS** 面板中，输入 `Nx Console`。\n\
  - 3. 单击第一个项目的 **Install** 按钮以安装 Nx Console 扩展。\n\nNx Console 扩展现在已全局安装在我们的环境中，这意味着我们可以在任何\
  \ Angular 项目中使用它。它是 Angular CLI 最常见命令的图形表示。目前，它支持以下命令（括号中显示相关的 Angular CLI 命令）：\n\
  \n- - **Generate**: 生成新的 Angular 工件，例如组件和模块（`ng generate`）。\n- - **Run**: 运行在 Angular\
  \ CLI 工作区的 `angular.json` 配置文件中定义的 architect 目标（`ng run`）。\n- - **Build**: 构建 Angular\
  \ 应用程序（`ng build`）。\n- - **Serve**: 构建并提供 Angular 应用程序（`ng serve`）。\n- - **Test**:\
  \ 运行 Angular 应用程序的单元测试（`ng test`）。\n- - **E2E**: 运行 Angular 应用程序的端到端或集成测试（`ng e2e`）。\n\
  - - **Lint**: 根据一组 linting 规则检查 Angular 应用程序（`ng lint`）。\n- - **Change workspace**:\
  \ 在 VSCode 中加载不同的 Angular CLI 工作区。\n\n我们可以用 Angular CLI 做的事情几乎都可以用 Nx Console 实现。真正的优势在于，开发人员无需记住所有\
  \ Angular CLI 命令选项，因为它们都以图形界面表示。让我们看看如何操作：\n\n- 1. 使用 VSCode 打开 `my-angular` 文件夹并单击侧边栏中的\
  \ **Nx Console** 菜单：\n\n![](img/efea53d01337e7b223389b38dcdb0160_36_0.png)\n\n图\
  \ 1.16 – Nx Console\n\n- 2. 从 **NX CONSOLE** 面板中单击 **Serve** 命令：\n\n![](img/efea53d01337e7b223389b38dcdb0160_37_0.png)\n\
  \n图 1.17 – Serve 命令\n\n- 3. 在出现的对话框中选择 **my-angular** 项目：\n\n![](img/efea53d01337e7b223389b38dcdb0160_37_1.png)\n\
  \n图 1.18 – 选择项目\n\nNx Console 将打开 **Serve** 选项卡，您可以在其中可选地设置 Angular CLI 的 serve\
  \ 命令支持的额外选项。每个选项都包含一个标题和简短说明，解释其作用。\n\n> **重要说明**\n> \n> 某些选项的标题中可能包含 **(deprecated)**\
  \ 字样。这表示该选项已在当前版本的 Angular CLI 中弃用，并将在以后的版本中最终移除。\n\n- 4. 单击 **Run** 按钮启动 Angular\
  \ 应用程序：\n\n![](img/efea53d01337e7b223389b38dcdb0160_37_2.png)\n\n图 1.19 – Serve\
  \ 选项卡\n\n\n\n\n\nVSCode 在编辑器底部打开一个集成终端并执行 `ng serve` 命令：\n\n![](img/efea53d01337e7b223389b38dcdb0160_38_0.png)\n\
  \n图 1.20 – VSCode 集成终端\n\n这与我们从终端窗口使用 Angular CLI 时执行的命令相同。\n\nNx Console 在内部使用任务来运行\
  \ Angular CLI 命令。任务是 VSCode 的内置机制，允许我们在不直接与命令行交互的情况下运行脚本或启动外部进程。\n\nNx Console 扩展在消除死记硬背\
  \ Angular CLI 命令的负担方面做得非常出色。VSCode Marketplace 包含许多更多适用于 Angular 开发人员的扩展，可补充 Nx\
  \ Console 的工作。\n\n## Summary\n\n在本章中，我们学习了 Angular 框架的基本原理，并对 Angular 架构进行了简要概述。我们看到了一些流行的\
  \ VSCode 扩展，我们可以在使用 Angular 时使用它们来增强我们的开发体验。\n\n然后，我们学习了如何使用 Angular CLI，这是一个强大的\
  \ Angular 生态系统工具，从头开始脚手架化并构建新的 Angular 应用程序。我们还通过修改典型 Angular CLI 应用程序的 Angular\
  \ 组件进行了第一次与 Angular 代码的交互。最后，我们安装了 Nx Console 扩展并学习了如何使用它来构建我们的应用程序。\n\n在下一章中，我们将研究\
  \ Angular Router，并学习如何使用它通过 Scully 静态网站生成器创建一个个人博客。\n\n## Practice questions\n\n\
  让我们看几个练习题：\n\n- 1. Angular 应用程序的基本构建块是什么？\n- 2. 我们如何对功能相似的组件进行分组？\n- 3. 谁负责处理 Angular\
  \ 应用程序中的业务逻辑任务？\n- 4. 我们可以使用哪个 Angular CLI 命令来创建一个新的 Angular 应用程序？\n- 5. 我们可以使用哪个\
  \ Angular CLI 命令来提供 Angular 应用程序？\n- 6. 我们如何在 HTML 中声明 Angular 组件？\n- 7. 我们如何在模块中声明\
  \ Angular 组件？\n- 8. 我们在 HTML 模板上使用什么语法进行文本绑定？\n- 9. 使用 Nx Console 的好处是什么？\n- 10.\
  \ 我们使用哪个扩展在 Angular 代码中执行静态分析？\n\n## Further reading\n\n以下是一些用于扩展本章所学内容的链接：\n\n\
  - Introduction to Basic Concepts: https://angular.io/guide/architecture\n- Interpolation:\
  \ https://angular.io/guide/interpolation\n- Nx Console: https://nx.dev/latest/angular/cli/console\n\
  - Angular Essentials: https://marketplace.visualstudio.com/items?itemName=johnpapa.angular-essentials\n\
  - Angular Evergreen: https://expertlysimple.io/get-evergreen\n"
- "## 2 使用 Scully 构建博客应用\nBuilding an\nSPA Application\nwith Scully and\nAngular Router\n\
  \nAngular 应用程序遵循 **Single Page Application (SPA)** 架构，其中网页的不同视图可以根据浏览器 URL 进行激活。对该\
  \ URL 的任何更改都可被 Angular 路由器拦截并转换为可激活特定 Angular 组件的路由。\n\n**Scully** 是一个流行的静态网站生成器，基于\
  \ **Jamstack** 架构。它可以很好地与 Angular 路由器配合使用，根据每个路由预渲染 Angular 应用程序的内容。\n\n在本章中，我们将结合\
  \ Angular 和 Scully 创建一个个人博客。以下主题将被涵盖：\n\n- 在 Angular 应用程序中设置路由\n- 创建我们博客的基本布局\n\
  - 为我们的应用程序配置路由\n- 使用 Scully 添加博客功能\n- 在主页上显示博客文章\n\n## Essential background theory\
  \ and context\n\n在 Web 开发的旧时代，客户端应用程序与底层服务器基础设施高度耦合。当我们想要使用 URL 访问网站的页面时，需要涉及大量机械。浏览器会将请求的\
  \ URL 发送到服务器，服务器应为该 URL 响应匹配的 HTML 文件。这是一个复杂的过程，会导致延迟和不同的往返时间。\n\n现代 Web 应用程序使用\
  \ SPA 架构消除了这些问题。客户端只需从服务器请求一次 HTML 文件。浏览器 URL 的任何后续更改都由客户端基础设施内部处理。在 Angular 中，路由器负责拦截应用程序内的\
  \ URL 请求并根据定义的路由配置处理它们。\n\nJamstack 是一项热门的新兴技术，允许我们创建快速且安全的 Web 应用程序。它可用于任何类型的应用程序，从电子商务网站到\
  \ **Software as a Service (SaaS)** Web 应用程序，甚至是个人博客。Jamstack 的架构基于以下支柱：\n\n- **Performance:**\
  \ 页面在生产期间生成并预渲染，消除了等待内容加载的需求。\n- **Scaling:** 内容是静态文件，可以从任何地方提供，甚至可以从 **Content\
  \ Delivery Network (CDN)** 提供商提供，从而提高应用程序的性能。\n- **Security:** 服务器端进程的无服务器性质以及内容已经是静态的事实消除了针对服务器基础设施的潜在攻击。\n\
  \nScully 是第一个拥抱 Jamstack 方法的 Angular 静态网站生成器。它本质上在构建时生成 Angular 应用程序的页面，以便在请求时立即可用。\n\
  \n## Project overview\n\n在这个项目中，我们将使用 Angular 框架构建一个个人博客，并使用 Scully 网站生成器增强其 Jamstack\
  \ 特性。最初，我们将脚手架化一个新的 Angular 应用程序并为其启用路由。然后，我们将通过添加一些基本组件来创建应用程序的基本布局。一旦我们拥有一个可工作的\
  \ Angular 应用程序，我们将使用 Scully 为其添加博客支持。然后，我们将使用 Markdown 文件创建一些博客文章并在应用程序的主页上显示它们。\n\
  \n构建时间：1 小时。\n\n### Getting started\n\n完成本项目需要以下软件工具：\n\n- Angular CLI：Angular 的命令行界面，您可以在\
  \ `https://angular.io/cli` 找到\n- GitHub material：本章的相关代码，您可以在 `https://github.com/PacktPublishing/Angular-Projects-Second-Edition`\
  \ 的 `Chapter02` 文件夹中找到。\n\n### Setting up routing in an Angular application\n\n\
  我们将通过从头开始创建一个新的 Angular 应用程序来启动我们的项目。在终端窗口中执行以下 Angular CLI 命令以创建一个新的 Angular 应用程序：\n\
  \n```\n```bash\nng new my-blog --routing --style=scss\n```\n```\n\n我们使用 `ng new`\
  \ 命令创建新的 Angular 应用程序，并传递以下选项：\n\n- `my-blog`：我们想要创建的 Angular 应用程序的名称。Angular CLI\
  \ 将在我们执行命令的路径中创建一个 `my-blog` 文件夹。\n- `--routing`：在 Angular 应用程序中启用路由。\n- `--style=scss`：配置\
  \ Angular 应用程序在处理 CSS 样式时使用 SCSS 样式表格式。\n\n> **Important Note**\n> \n> 我们在终端窗口中运行的每个命令都应在该文件夹内运行。\n\
  \n当我们在 Angular 应用程序中启用路由时，Angular CLI 会从 @angular/router npm 包导入多个工件到我们的应用程序中：\n\
  \n- 它创建 `app-routing.module.ts` 文件，这是我们应用程序的主要路由模块：\n\n```\nimport { NgModule }\
  \ from '@angular/core';\nimport { RouterModule, Routes } from '@angular/router';\n\
  \nconst routes: Routes = [];\n\n@NgModule({\n  imports: [RouterModule.forRoot(routes)],\n\
  \  exports: [RouterModule]\n})\nexport class AppRoutingModule { }\n```\n\n- 它将 `AppRoutingModule`\
  \ 导入到我们应用程序的主模块 `app.module.ts` 中：\n\n```\nimport { NgModule } from '@angular/core';\n\
  import { BrowserModule } from '@angular/platform-browser';\n\nimport { AppRoutingModule\
  \ } from './app-routing.module';\nimport { AppComponent } from './app.component';\n\
  \n@NgModule({\n  declarations: [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n\
  \    AppRoutingModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\n\
  export class AppModule { }\n```\n\n\n\n\n\n我们将应用程序配置为使用 SCSS 样式表格式。我们不会手动创建应用程序的样式，而是使用\
  \ **Bootstrap CSS** 库：\n\n1. 在终端窗口中执行以下命令来安装 Bootstrap：\n\n   ```\n   npm install\
  \ bootstrap\n   ```\n\n2. 在 Angular 应用程序 `src` 文件夹中的 `styles.scss` 文件顶部添加以下导入语句：\n\
  \n   ```\n   @import \"~bootstrap/scss/bootstrap\";\n   ```\n\n`styles.scss` 文件包含全局应用于我们应用程序的\
  \ CSS 样式。在前面的代码片段中，我们将 Bootstrap 库中的所有样式导入到应用程序中。`@import` CSS 规则接受 `bootstrap.scss`\
  \ 文件的绝对路径作为选项，无需添加 `.scss` 扩展名。`~` 字符代表 Angular 应用程序的 `node_modules` 文件夹。\n\n> **重要提示**\n\
  > `node_modules` 文件夹包含我们的应用程序在开发或运行时所需的所有 npm 包和库。\n\n在接下来的部分中，我们将学习如何通过创建组件（如头部和页脚）来创建博客的基本布局。\n\
  \n## 创建博客的基本布局\n\n博客通常有一个包含所有主要网站链接的头部，以及一个包含版权信息和其他有用链接的页脚。在 Angular 世界中，这两者都可以表示为独立的组件。\n\
  \n头部组件只使用一次，因为它在应用程序启动时添加，并且始终渲染为网站的主菜单。在 Angular 中，我们通常会按照约定创建一个名为 **core** 的模块，以将这些组件或服务作为应用程序的核心。要创建该模块，我们使用\
  \ Angular CLI 的 `generate` 命令：\n\n```\nng generate module core\n```\n\n上述命令将在应用程序的\
  \ `src\\app\\core` 文件夹中创建该模块。要创建头部组件，我们将使用相同的命令，并传递一组不同的选项：\n\n```\nng generate\
  \ component header --path=src/app/core --module=core --export\n```\n\n上一个命令将在 `src\\\
  app\\core\\header` 文件夹内创建所有必要的组件文件：\n\n![](img/efea53d01337e7b223389b38dcdb0160_46_0.png)\n\
  \n图 2.1 - 头部组件\n\n它还会在核心模块中声明 `HeaderComponent`，并将其添加到 `exports` 属性中，以便其他模块可以使用它：\n\
  \n### core.module.ts\n\n```typescript\nimport { NgModule } from '@angular/core';\n\
  import { CommonModule } from '@angular/common';\nimport { HeaderComponent } from\
  \ './header/header.component';\n\n@NgModule({\n    declarations: [\n        HeaderComponent\n\
  \    ],\n    imports: [\n        CommonModule\n    ],\n    exports: [\n        HeaderComponent\n\
  \    ]\n})\nexport class CoreModule { }\n```\n\n头部组件应显示我们博客的主要链接。打开头部组件的 `header.component.html`\
  \ 模板文件，并将其内容替换为以下代码片段：\n\n### header.component.html\n\n```html\n<nav class=\"navbar\
  \ navbar-expand navbar-light bg-light\">\n  <div class=\"container-fluid\">\n  \
  \  <a class=\"navbar-brand\">Angular Projects</a>\n    <ul class=\"navbar-nav me-auto\"\
  >\n      <li class=\"nav-item\">\n        <a class=\"nav-link\">Articles</a>\n \
  \     </li>\n      <li class=\"nav-item\">\n        <a class=\"nav-link\">Contact</a>\n\
  \      </li>\n    </ul>\n  </div>\n</nav>\n```\n\n页脚组件可以在 Angular 应用程序中多次使用。目前，我们希望将其显示在应用程序的主页上。将来，我们可能还希望将其显示在博客访客可用的登录页面上。在这种情况下，页脚组件应该是可复用的。当我们想要把将在整个应用程序中复用的组件组织在一起时，通常会按照约定创建一个名为\
  \ **shared** 的模块。使用 Angular CLI 的 generate 命令创建 shared 模块：\n\n```bash\nng generate\
  \ module shared\n```\n\n上述命令将在应用程序的 `src\\app\\shared` 文件夹中创建 shared 模块。现在可以使用以下命令创建页脚组件：\n\
  \n```bash\nng generate component footer --path=src/app/shared --module=shared --export\n\
  ```\n\n上一个命令将在 `src\\app\\shared\\footer` 文件夹内创建页脚组件的所有必要文件。它还会将 FooterComponent\
  \ 添加到共享模块的 declarations 和 exports 属性中：\n\n### shared.module.ts\n\n```typescript\n\
  import { NgModule } from '@angular/core';\nimport { CommonModule } from '@angular/common';\n\
  import { FooterComponent } from './footer/footer.component';\n\n@NgModule({\n  declarations:\
  \ [\n    FooterComponent\n  ],\n  imports: [\n    CommonModule\n  ],\n  exports:\
  \ [\n    FooterComponent\n  ]\n})\nexport class SharedModule { }\n```\n\n页脚组件的内容应包含我们博客的版权信息。让我们看看如何将这些信息添加到组件中：\n\
  \n1. 打开页脚组件的 `footer.component.ts` TypeScript 类文件。在 `FooterComponent` 类中添加一个 `currentDate`\
  \ 属性，并将其初始化为新的 Date 对象：\n\n   ```typescript\n   export class FooterComponent implements\
  \ OnInit {\n\n     currentDate = new Date();\n\n     constructor() { }\n\n     ngOnInit():\
  \ void {\n     }\n\n   }\n   ```\n\n2. 打开页脚组件的 `footer.component.html` 模板文件，并将其内容替换为以下内容：\n\
  \n   ```html\n   <nav class=\"navbar fixed-bottom navbar-light bg-light\">\n   \
  \  <div class=\"container-fluid\">\n       <p>Copyright @{{currentDate | date: 'y'}}.\
  \ All Rights Reserved</p>\n     </div>\n   </nav>\n   ```\n\n前面的代码使用插值在屏幕上显示 `currentDate`\
  \ 属性的值。它还使用内置的日期管道，仅显示当前日期的年份。\n\n> **重要提示**\n> 管道是 Angular 框架的内置功能，可对组件属性的视图表示进行转换。属性的底层值保持不变。\n\
  \n我们已经创建了博客的基本组件。现在该将它们显示在屏幕上了：\n\n1. 打开应用程序的主模块 `app.module.ts` 文件，并将 CoreModule\
  \ 和 SharedModule 添加到 @NgModule 装饰器的 imports 属性中：\n\n   ```typescript\n   @NgModule({\n\
  \     declarations: [\n       AppComponent\n     ],\n     imports: [\n       BrowserModule,\n\
  \       AppRoutingModule,\n       CoreModule,\n       SharedModule\n     ],\n  \
  \   providers: [],\n     bootstrap: [AppComponent]\n   })\n   ```\n\n2. 在文件顶部为每个模块添加相应的\
  \ `import` 语句：\n\n   ```typescript\n   import { NgModule } from '@angular/core';\n\
  \   import { BrowserModule } from '@angular/platform-browser';\n\n   import { AppRoutingModule\
  \ } from './app-routing.module';\n   import { AppComponent } from './app.component';\n\
  \   import { CoreModule } from './core/core.module';\n   import { SharedModule }\
  \ from './shared/shared.module';\n   ```\n\n3. 打开主组件的 `app.component.html` 模板文件，并将其内容替换为以下\
  \ HTML 片段：\n\n   ```html\n   <app-header></app-header>\n   <app-footer></app-footer>\n\
  \   ```\n\n在前面的代码片段中，我们通过使用它们的 CSS 选择器添加了头部和页脚组件。\n\n如果我们运行 Angular CLI 的 `serve`\
  \ 命令来预览应用程序，我们应该会得到以下结果：\n\n![](img/efea53d01337e7b223389b38dcdb0160_50_0.png)\n\
  \n图 2.2 – 基本布局\n\n我们已经完成了博客应用程序的基本布局，看起来很棒！但头部还包含两个我们尚未涉及的额外链接。我们将在下一节学习如何使用路由来激活这些链接。\n\
  \n## 为我们的应用程序配置路由\n\n我们在上一节创建的头部组件包含两个链接：\n\n- **文章**：显示博客文章列表\n- **联系**：显示博客所有者的个人信息\n\
  \n这些链接也将成为我们应用程序的主要功能。因此，我们需要为每个链接创建一个 Angular 模块。\n\n> **提示**\n> 在设计网站并需要决定要使用的\
  \ Angular 模块时，请查看网站的主菜单。菜单中的每个链接都应是一个不同的功能，因此对应一个不同的 Angular 模块。\n\n按照约定，为特定功能提供实现的\
  \ Angular 模块称为**功能模块**。\n\n## 创建联系页面\n\n让我们首先创建联系功能：\n\n1. 创建一个作为联系功能载体的模块：\n\n\
  \   ```\n   ng generate module contact\n   ```\n\n2. 创建一个将成为联系模块主组件的组件：\n\n   ```\n\
  \   ng generate component contact --path=src/app/contact --module=contact --export\
  \ --flat\n   ```\n\n我们将 `--flat` 选项传递给 `generate` 命令，这样 Angular CLI 就不会像之前那样为我们的组件创建单独的文件夹。联系组件将是我们模块中唯一的组件，因此没有理由单独为它创建文件夹。\n\
  \n\n\n\n\n+   3. 打开 `contact.component.html` 文件，并添加以下 HTML 内容：\n\n```\n```html\n\
  <div class=\"card mx-auto text-center border-light\"\n     style=\"width: 18rem;\"\
  >\n  <img src=\"assets/angular.png\" class=\"card-img-top\"\n       alt=\"Angular\
  \ logo\">\n  <div class=\"card-body\">\n    <h5 class=\"card-title\">Angular Projects</h5>\n\
  \    <p class=\"card-text\">\n      A personal blog created with the Angular\n \
  \     framework and the Scully static site generator\n    </p>\n    <a href=\"https://angular.io/\"\
  \ target=\"_blank\"\n       class=\"card-link\">Angular</a>\n    <a href=\"https://scully.io/\"\
  \ target=\"_blank\"\n       class=\"card-link\">Scully</a>\n  </div>\n</div>\n```\n\
  ```\n\n在前面的代码中，我们使用了 `angular.png` 图像。你可以在随附 GitHub 仓库项目的 `src\\assets` 文件夹中找到该图像。\n\
  \n> **提示**\n> \n> Angular CLI 项目中的 assets 文件夹用于存放图像、字体或 JSON 文件等静态内容。\n\n我们已经创建了\
  \ contact 功能。下一步是将其添加到 Angular 应用程序的主页中：\n\n+   1. 打开 `app-routing.module.ts` 文件，并在\
  \ `routes` 属性中添加一个新的路由配置对象：\n\n```\n```typescript\nimport { ContactComponent } from\
  \ './contact/contact.component';\n\nconst routes: Routes = [\n  { path: 'contact',\
  \ component: ContactComponent }\n];\n```\n```\n\n前面的代码表示，当浏览器的 URL 指向 contact 路径时，应用程序将激活\
  \ `ContactComponent`，并在屏幕上显示它。路由模块的 routes 属性包含相应功能模块的路由配置。它是一个路由配置对象数组，每个对象都会定义激活该路由的组件类和\
  \ URL 路径。\n\n+   2. 将 ContactModule 添加到 AppModule 的 @NgModule 装饰器的 imports 数组中，以便使用它：\n\
  \n```\n```typescript\n@NgModule({\n  declarations: [\n    AppComponent\n  ],\n \
  \ imports: [\n    BrowserModule,\n    AppRoutingModule,\n    CoreModule,\n    SharedModule,\n\
  \    ContactModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\n```\n\
  ```\n\n不要忘记在文件顶部添加 ContactModule 相应的导入语句。\n\n+   3. 路由组件和 ContactComponent 一样，需要一个可以加载它们的位置。打开\
  \ app.component.html 文件，并添加 router-outlet 指令：\n\n```\n```html\n<app-header></app-header>\n\
  <div class=\"container\">\n  <router-outlet></router-outlet>\n</div>\n<app-footer></app-footer>\n\
  ```\n```\n\n## 使用 Scully 和 Angular Router 构建 SPA 应用程序\n\n现在，我们需要将创建的路由配置与 header\
  \ 组件中的实际链接连接起来：\n\n+   1. 打开 `header.component.html` 文件，并将 `routerLink` 指令添加到相应的锚点\
  \ HTML 元素：\n\n```\n```html\n<li class=\"nav-item\">\n  <a routerLink=\"/contact\"\
  \ routerLinkActive=\"active\"\n     class=\"nav-link\">Contact</a>\n</li>\n```\n\
  ```\n\n在前面的代码片段中，`routerLink` 指令指向路由配置对象的 path 属性。我们还添加了 `routerLinkActive` 指令，当特定路由被激活时，它会为锚点元素设置\
  \ active 类。\n\n> **重要提示**\n> \n> 请注意，`routerLink` 指令的值包含一个前导 `/`，而我们定义的路由配置对象的 path\
  \ 属性并不包含。根据具体情况，省略 `/` 会赋予该路由不同的含义。\n\n+   2. `routerLink` 和 `routerLinkActive`\
  \ 指令属于 Angular router 软件包。要使用它们，我们需要在核心模块中导入 `RouterModule`：\n\n```\n```typescript\n\
  import { NgModule } from '@angular/core';\nimport { CommonModule } from '@angular/common';\n\
  import { HeaderComponent } from './header/header.component';\nimport { RouterModule\
  \ } from '@angular/router';\n\n@NgModule({\n  declarations: [\n    HeaderComponent\n\
  \  ],\n  imports: [\n    CommonModule,\n    RouterModule\n  ],\n  exports: [\n```\n\
  ```\n```\nHeaderComponent\n]\n})\nexport class CoreModule { }\n```\n\n现在，我们已经准备好预览新的\
  \ contact 页面了！如果使用 `ng serve` 运行应用程序，然后点击 **Contact** 链接，应该会看到以下输出：\n\n![](img/efea53d01337e7b223389b38dcdb0160_55_0.png)\n\
  \n*图 2.3 – Contact 页面*\n\n在下一节中，我们将为博客页眉中的 **Articles** 链接构建相应功能。\n\n## 添加 articles\
  \ 页面\n\n负责在博客中显示文章的功能将由 articles 模块实现。它还将负责连接 Angular 和 Scully。我们将使用 Angular CLI\
  \ 的 generate 命令创建该模块：\n\n```\nng generate module articles --route=articles --module=app-routing\n\
  ```\n\n在前面的命令中，我们传入了一些额外的路由选项：\n\n+   - `--route`：定义功能的 URL 路径\n+   - `--module`：指定将定义用于激活该功能的路由配置对象的路由模块\n\
  \n执行该命令时，Angular CLI 除了创建模块之外，还会执行以下操作：\n\n+   - 在 `src\\\\app\\\\articles` 文件夹中创建一个路由组件，该组件默认会由路由导航对象激活。它是该功能的着陆页，并将显示博客文章列表，具体内容将在\
  \ *在主页上显示博客数据* 一节中介绍。\n+   - 创建一个名为 `articles-routing.module.ts` 的路由模块，其中包含 articles\
  \ 模块的路由配置。\n+   - 在主应用程序模块的路由配置中添加一个新的路由配置对象，用于激活 articles 模块。\n\n`articles-routing.module.ts`\
  \ 文件包含 articles 模块的路由配置：\n\n### articles-routing.module.ts\n\n```\nimport { NgModule\
  \ } from '@angular/core';\nimport { RouterModule, Routes } from '@angular/router';\n\
  import { ArticlesComponent } from './articles.component';\n\nconst routes: Routes\
  \ = [{ path: '', component: ArticlesComponent }];\n\n@NgModule({\n  imports: [RouterModule.forChild(routes)],\n\
  \  exports: [RouterModule]\n})\nexport class ArticlesRoutingModule { }\n```\n\n\
  前面介绍的方法称为**懒加载**，可以改善 Angular 应用程序的启动速度和整体性能。它会为每个懒加载模块创建一个单独的软件包，并在需要时加载，从而减小最终软件包的大小并降低应用程序的内存消耗。现在，让我们将新路由连接到\
  \ header 组件：\n\n+   1. 打开 `header.component.html` 文件，并将以下 `routerLink` 和 `routerLinkActive`\
  \ 指令添加到 Articles 锚点 HTML 元素中：\n+   \n+   ```html\n+   <li class=\"nav-item\">\n\
  +       <a routerLink=\"/articles\" routerLinkActive=\"active\"\n+          class=\"\
  nav-link\">Articles</a>\n+   </li>\n+   ```\n+   \n+   2. 运行 `ng serve`，并使用你喜欢的浏览器预览应用程序。\n\
  +   3. 打开浏览器的开发者工具，点击 **Articles** 链接，然后检查 **Network** 选项卡：\n\n![](img/efea53d01337e7b223389b38dcdb0160_58_0.png)\n\
  \n在其他请求中，你应该会看到一个名为 **articles-articles-module.js** 的请求。它就是在点击 **Articles** 链接时加载的懒加载\
  \ articles 模块的软件包。\n\n现在，我们已经准备好将这个出色的 Angular 应用程序转换为专业的博客网站了。在继续之前，让我们向 `app-routing.module.ts`\
  \ 文件添加一些其他路由：\n\n```\n```typescript\nconst routes: Routes = [\n  { path: 'contact',\
  \ component: ContactComponent },\n  { path: 'articles', loadChildren: () =>\n  \
  \    import('./articles/articles.module').then(m =>\n      m.ArticlesModule) },\n\
  \  { path: '', pathMatch: 'full', redirectTo: 'articles' },\n  { path: '**', redirectTo:\
  \ 'articles' }\n];\n```\n```\n\n我们添加了一个默认路由，以便博客用户访问博客时自动重定向到 `articles` 路径。此外，我们还创建了一个新的路由配置对象，并将其\
  \ path 设置为 `**`，该路由同样会导航到 `articles` 路径。`**` 语法称为**通配符路由**，当路由器无法将请求的 URL 与已定义的路由匹配时，就会触发该路由。\n\
  \n> **提示**\n> \n> 先定义最具体的路由，然后再添加默认路由和通配符路由等通用路由。Angular 路由器会按照我们定义的顺序解析路由配置，并遵循\
  \ *第一个匹配项获胜* 的策略来选择路由。\n\n我们已经在 Angular 应用程序中启用并配置了路由。在下一节中，我们将建立向应用程序添加博客功能所需的基础设施。\n\
  \n## 使用 Scully 添加博客功能\n\n目前，我们的应用程序还没有任何与博客文章相关的特定逻辑。它只是一个使用路由的典型 Angular 应用程序。不过，通过添加路由配置，我们已经为使用\
  \ Scully 添加博客支持奠定了基础。\n\n> **重要提示**\n> \n> Scully 至少需要在 Angular 应用程序中定义一个路由，才能正常工作。\n\
  \n首先，我们需要在应用程序中安装 Scully。\n\n\n\n\n\n## 安装 Scully 库\n\n我们将使用 Angular CLI 的 add 命令在\
  \ Angular 应用中安装 Scully：\n\n```\nng add @scullyio/init\n```\n\n上述命令会下载并安装所有必要的 npm\
  \ 包，使 Scully 能够在我们的 Angular 应用中正常工作。它还会修改 Angular 项目的结构，以满足其特定需求。\n\n它会在我们的主应用模块中导入\
  \ `ScullyLibModule`：\n\n### app.module.ts\n\n```typescript\nimport { NgModule }\
  \ from '@angular/core';\nimport { BrowserModule } from '@angular/platform-browser';\n\
  \nimport { AppRoutingModule } from './app-routing.module';\nimport { AppComponent\
  \ } from './app.component';\nimport { ContactModule } from './contact/contact.module';\n\
  import { CoreModule } from './core/core.module';\nimport { SharedModule } from './shared/shared.module';\n\
  import { ScullyLibModule } from '@scullyio/ng-lib';\n\n@NgModule({\n  declarations:\
  \ [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n    AppRoutingModule,\n\
  \    CoreModule,\n    SharedModule,\n    ContactModule,\n    ScullyLibModule\n \
  \ ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\nexport class AppModule\
  \ { }\n```\n\nScullyLibModule 是 Scully 库的主模块，其中包含 Scully 所需的各种 Angular 服务和指令。\n\n\
  它还会在 Angular CLI 工作区的根文件夹中为 Scully 库创建一个配置文件：\n\n### scully.my-blog.config.ts\n\n\
  ```typescript\nimport { ScullyConfig } from '@scullyio/scully';\nexport const config:\
  \ ScullyConfig = {\n  projectRoot: \"./src\",\n  projectName: \"my-blog\",\n  outDir:\
  \ './dist/static',\n  routes: {\n  }\n};\n```\n\n配置文件包含关于我们 Angular 应用的信息，Scully\
  \ 在后续过程中会用到这些信息：\n\n- projectRoot：包含 Angular 应用源代码的路径\n- projectName：Angular 应用的名称\n\
  - outDir：Scully 生成文件的输出路径\n\n> **重要提示**\n>\n> Scully 的输出路径必须与 Angular CLI 输出 Angular\
  \ 应用包的路径不同。后者可以在 `angular.json` 文件中配置。\n\n- routes：它包含用于访问我们博客文章的路由配置。Scully 会自动填充它，我们将在下一节中看到。\n\
  \n既然我们已经在 Angular 应用中成功安装了 Scully，现在可以配置它来初始化我们的博客了。\n\n## 初始化我们的博客页面\n\nScully\
  \ 提供了一个特定的 Angular CLI 原理图（schematic），用于通过 Markdown（`.md`）文件初始化 Angular 应用（如博客）：\n\
  \n```\nng generate @scullyio/init:markdown\n```\n\n上述命令将通过一系列问题来启动我们博客的配置过程（括号内显示的是默认值）：\n\
  \n1. 输入 `posts` 作为博客模块的名称：\n\n   ```\n   ? What name do you want to use for the\
  \ module? (blog)\n   ```\n\n   *图 2.5 – 博客模块名称*\n\n   这将创建一个名为 `posts` 的新 Angular\
  \ 模块。\n\n2. 将 slug 选项留空，然后按 Enter 接受默认值：\n\n   ```\n   ? What slug do you want for\
  \ the markdown file? (id)\n   ```\n\n   *图 2.6 – Markdown slug*\n\n   slug 是每篇文章的唯一标识符，它定义在模块的路由配置对象中。\n\
  \n3. 输入 `mdfiles` 作为 Scully 用来存储我们实际博客文章文件的路径：\n\n   ```\n   ? Where do you want\
  \ to store your markdown files?\n   ```\n\n   *图 2.7 – Markdown 文件路径*\n\n   这将在我们\
  \ Angular CLI 项目的根路径下创建一个 `mdfiles` 文件夹。默认情况下，它还会为我们创建一个博客文章。我们将在“在主页上显示博客数据”一节中学习如何创建我们自己的博客文章。\n\
  \n4. 输入 `posts` 作为访问我们博客文章的路由名称：\n\n   ```\n   ? Under which route do you want your\
  \ files to be requested?\n   ```\n\n   *图 2.8 – 博客路由名称*\n\n   路由名称是即将创建的路由配置对象的\
  \ `path` 属性。\n\n在执行上述命令时，Scully 会执行多种操作，包括创建 posts 模块的路由配置：\n\n### posts-routing.module.ts\n\
  \n```typescript\nimport {NgModule} from '@angular/core';\nimport {Routes, RouterModule}\
  \ from '@angular/router';\n\nimport {PostsComponent} from './posts.component';\n\
  \nconst routes: Routes = [\n  {\n    path: ':id',\n    component: PostsComponent,\n\
  \  },\n  {\n    path: '**',\n    component: PostsComponent,\n  }\n];\n\n@NgModule({\n\
  \  imports: [RouterModule.forChild(routes)],\n  exports: [RouterModule],\n})\nexport\
  \ class PostsRoutingModule {}\n```\n\n第一条路由的路径设置为 `:id`，并激活 `PostsComponent`。冒号字符表示\
  \ `id` 是一个路由参数。`id` 参数与前面在 Scully 配置中定义的 slug 属性相关。Scully 的工作方式是为我们创建的每篇博客文章生成一条路由。它使用\
  \ posts 模块和主应用模块的路由配置来构建 Scully 配置文件中的 `routes` 属性：\n\n```javascript\nroutes: {\n\
  \  '/posts/:id': {\n    type: 'contentFolder',\n    id: {\n      folder: \"./mdfiles\"\
  \n    }\n  }\n}\n```\n\nPostsComponent 是用于渲染每篇博客文章详细信息的 Angular 组件。该组件的模板文件可以根据你的需求进一步自定义：\n\
  \n### posts.component.html\n\n```html\n<h3>ScullyIo content</h3>\n<hr>\n\n<!-- This\
  \ is where Scully will inject the static HTML -->\n<scully-content></scully-content>\n\
  <hr>\n<h4>End of content</h4>\n```\n\n你可以自定义上述模板文件中的所有内容，除了 `<scully-content></scully-content>`\
  \ 这一行，该行由 Scully 内部使用。\n\n至此，我们已经在 Angular 应用中完成了 Scully 的安装和配置。现在是时候进行项目的最后一部分了！在下一节中，我们将让\
  \ Angular 与 Scully 协作，在 Angular 应用中显示博客文章。\n\n## 在主页上显示博客文章\n\n我们希望用户在进入我们的博客网站后，立即看到可用博客文章的列表。根据我们定义的默认路由路径，`ArticlesComponent`\
  \ 是我们博客的着陆页。Scully 提供了 `ScullyRoutesService`，这是一个 Angular 服务，我们可以在组件中使用它来获取 Scully\
  \ 将根据博客文章创建的路由信息。让我们在着陆页上使用这个服务：\n\n1. 导航到 `articles.component.ts` TypeScript 类文件。\n\
  2. 从 `@scullyio/ng-lib` 包中导入 `ScullyRoute` 和 `ScullyRoutesService`：\n\n   ```typescript\n\
  \   import { ScullyRoute, ScullyRoutesService } from '@scullyio/ng-lib';\n   ```\n\
  \n3. 在 `ArticlesComponent` 类的构造函数中注入 `ScullyRoutesService`：\n\n   ```typescript\n\
  \   constructor(private scullyService: ScullyRoutesService) {\n   }\n   ```\n\n\
  4. 创建一个 `ScullyRoute` 数组类型的组件属性：\n\n   ```typescript\n   posts: ScullyRoute[] =\
  \ [];\n   ```\n\n5. 编辑组件的 `ngOnInit` 方法并添加以下代码：\n\n   ```typescript\n   ngOnInit():\
  \ void {\n       this.scullyService.available$.subscribe(posts => {\n          \
  \ this.posts = posts.filter(post => post.title);\n       });\n   }\n   ```\n\n6.\
  \ 打开 `articles.component.html` 文件并添加以下 HTML 代码：\n\n   ```html\n   <div class=\"\
  list-group mt-3\">\n       <a *ngFor=\"let post of posts\"\n           [routerLink]=\"\
  post.route\" class=\"list-group-item\n           list-group-item-action\">\n   \
  \        <div class=\"d-flex w-100 justify-content-between\">\n               <h5\
  \ class=\"mb-1\">{{post.title}}</h5>\n           </div>\n           <p class=\"\
  mb-1\">{{post.description}}</p>\n       </a>\n   </div>\n   ```\n\n前面的步骤涉及许多 Angular\
  \ 技术，让我们逐一拆解。\n\n当我们在组件中需要使用 Angular 服务时，只需向 Angular 框架请求它即可。怎么做？通过将它作为组件构造函数中的一个属性添加进去。组件不需要了解该服务是如何实现的。\n\
  \n`ngOnInit` 方法是 `OnInit` 接口的一部分，我们的组件实现了该接口。当组件被初始化时，Angular 框架会调用它，并为我们提供了一个钩子，用于添加要执行的自定义逻辑。\n\
  \n\n\n\n> **提示**\n> \n> 为组件提供初始化逻辑的 Angular 服务应在 `ngOnInit` 方法中调用，*而不是*在构造函数中调用，因为在对组件进行单元测试时，更容易为这些服务提供模拟对象。\n\
  \n`ScullyRoutesService` 的 `available$` 属性被称为**可观察对象**。要获取它的值，我们需要订阅它。返回的 `posts`\
  \ 变量将包含 Scully 生成的所有可用路由。Scully 会针对我们 Angular 应用程序的所有路由运行。为了避免显示与博客文章无关的路由（例如联系页面路由），我们会从\
  \ `available$` 属性的结果中过滤掉这些内容。\n\n当我们订阅一个可观察对象时，需要在组件不再存在时取消订阅。否则，我们的 Angular 应用程序可能会出现内存泄漏。让我们看看如何使用组件的另一个生命周期钩子\
  \ `ngOnDestroy` 来完成这项任务：\n\n- 1. 在 `ArticlesComponent` 类中声明一个 `Subscription` 类型的私有\
  \ `routeSub` 属性。`Subscription` 可以从 `rxjs` npm 包中导入。\n- 2. 将 `available$` 可观察对象返回的值赋给\
  \ `routeSub` 属性。\n- 3. 将 `OnDestroy` 接口添加到组件实现的接口列表中。`OnDestroy` 可以从 `@angular/core`\
  \ npm 包中导入。它在组件被销毁时执行，此时组件不再渲染在屏幕上。\n- 4. 实现 `ngOnDestroy` 方法，并在方法体中调用 `routeSub`\
  \ 属性的 `unsubscribe` 方法。\n\n组件的最终 TypeScript 文件应如下所示：\n\n### articles.component.ts\n\
  \n```typescript\nimport { Component, OnInit, OnDestroy } from '@angular/core';\n\
  import { ScullyRoute, ScullyRoutesService } from '@scullyio/ng-lib';\nimport { Subscription\
  \ } from 'rxjs';\n\n@Component({\n  selector: 'app-articles',\n  templateUrl: './articles.component.html',\n\
  ```\n\n- 2. 执行以下 npm 命令来构建 Scully 并生成我们的博客路由：\n\n```\nnpm run scully\n```\n\n上述命令将在\
  \ src\\assets 文件夹中创建一个 scully-routes.json 文件。它包含我们 Angular 应用程序的路由，是 Scully 运行时所需要的。\n\
  \n> **提示**\n> 首次运行 Scully 可执行文件时，它会提示你收集匿名错误以改进其服务。\n\n- 3. 运行以下 npm 命令来为我们的博客提供服务：\n\
  \n```\nnpm run scully:serve\n```\n\n上述命令将启动两个 Web 服务器：一个包含使用 Scully 构建的我们网站的静态预渲染版本，另一个是我们应用程序的\
  \ Angular 实时版本：\n\n```\nusing plugins from folder \"./scully\"\n* starting static\
  \ server\nAngular distribution server started on \"http://localhost:1864/\"\nScully\
  \ static server started on \"http://localhost:1668/\"\n```\n\n图 2.9 —— 为我们的应用程序提供服务\n\
  \n如果我们打开浏览器并导航到 http://localhost:1668，我们将看不到任何博客文章。这是为什么呢？\n\n使用 Scully 创建的博客文章*除非*我们发布它，否则不会在\
  \ `ScullyRoutesService` 的 `available$` 属性中返回。要发布博客文章，我们需要执行以下操作：\n\n- 1. 导航到 Scully\
  \ 创建的 mdfiles 文件夹，打开你唯一能找到的 .md 文件。文件名和内容可能与你的文件不同，因为它基于 Scully 的创建日期：\n\n```\n\
  ---\ntitle: 2020-11-15-posts\ndescription: 'blog description'\npublished: false\n\
  ```\n\n```\nslugs:\n  - ___UNPUBLISHED___ khm71wkh_hIzSmrBDHceuWrDrqgTnY8qCwvurkxdT\n\
  ---\n\n# 2020-11-15-posts\n```\n\nScully 在文件顶部闭合和结束的 --- 行之间定义了一组属性，代表博客文章的元数据。你也可以以键值对的形式添加自己的属性。\n\
  \n2. 删除 slugs 属性，并将 published 属性设置为 true：\n\n```\n---\ntitle: 2020-11-15-posts\n\
  description: 'blog description'\npublished: true\n---\n\n# 2020-11-15-posts\n```\n\
  \n> 提示\n> 如果你不想手动发布文章，Scully 支持自动发布博客文章。你可以在元数据中使用保留的 publishDate 属性来定义你希望发布博客文章的日期，Scully\
  \ 会完成其余工作。\n\n3. 运行以下命令，强制 Scully 重新生成我们应用程序的路由：\n\n```\nnpm run scully\n```\n\n\
  每次我们对博客相关文件进行更改时，都需要执行上述命令。\n\n4. 执行 npm run scully:serve 命令并导航到预览生成的网站。\n\n现在我们可以看到一篇博客文章，即我们安装\
  \ Scully 时创建的默认文章。让我们再创建一篇：\n\n- 1. 运行 Angular CLI 的以下生成命令：\n\n```\nng generate\
  \ @scullyio/init:post --name=\"Angular and Scully\"\n```\n\n在上述命令中，我们使用 @scullyio/init:post\
  \ 原理图，并将要创建的文章名称作为选项传入。\n\n- 2. 将新博客文章的目标文件夹设置为 mdfiles：\n\n? What's the target\
  \ folder for this post? (blog)\n\n图 2.10 —— 新博客文章的目标文件夹\n\n- 3. Scully 将在指定文件夹中创建一个名为\
  \ angular-and-scully.md 的 Markdown 文件。打开该文件并将其内容更新为以下内容：\n\n```\n---\ntitle: 'Angular\
  \ and Scully'\ndescription: 'How to build a blog with Angular and Scully'\npublished:\
  \ true\n---\n\n# Angular and Scully\nAngular is a robust JavaScript framework that\
  \ we can use to build excellent and performant web applications.\nScully is a popular\
  \ static website generator that empowers the Angular framework with Jamstack characteristics.\n\
  You can find more about them in the following links:\n\n- https://angular.io\n-\
  \ https://scully.io\n- https://www.jamstack.org\n```\n\n- 4. 运行 npm run scully 为新创建的博客文章创建路由。Scully\
  \ 还会用新路由更新 scully-routes.json 文件。\n\n如果我们现在预览应用程序，它应如下所示：\n\n![](img/efea53d01337e7b223389b38dcdb0160_71_0.png)\n\
  \n如果我们点击其中一篇博客文章，将导航到选中的博客文章。当前屏幕上显示的内容是博客文章路由的预渲染版本：\n\n![](img/efea53d01337e7b223389b38dcdb0160_71_1.png)\n\
  \n要验证这一点，请导航到 Angular 项目的 `dist` 文件夹，你会在其中找到两个文件夹：\n\n- - `my-blog`：这包含我们应用程序的 Angular\
  \ 实时版本。当我们执行 `ng build` Angular CLI 命令时，它会构建我们的应用程序并将打包文件输出到此文件夹中。\n- - `static`：这包含我们运行\
  \ `npm run scully` 命令时由 Scully 生成的 Angular 应用程序的预渲染版本。\n\n如果我们导航到 `static` 文件夹，会看到\
  \ Scully 为我们 Angular 应用程序的每个路由创建了一个文件夹。每个文件夹包含一个 `index.html` 文件，它代表从该路由激活的组件。`index.html`\
  \ 文件的内容由 Scully 自动生成，其结果相当于我们实时运行应用程序并导航到该组件。\n\n现在你可以获取你的 Angular 应用程序，将其上传到你选择的\
  \ CDN 或 Web 服务器，你很快就能拥有自己的博客了！届时你只需发挥你的写作技巧，创作出色的博客内容即可。\n\n## 总结\n\n在本章中，我们学习了如何将\
  \ Angular 框架与 Scully 库结合使用来创建个人博客。\n\n我们了解了 Angular 如何使用内置的路由包为 Web 应用程序增强应用内导航。我们还学习了如何将\
  \ Angular 应用程序组织成模块，以及如何在这些模块之间导航。\n\n我们使用 Scully 库将 Jamstack 引入到我们的 Angular 应用程序中，并看到了将应用程序转换为预渲染博客是多么容易。我们使用\
  \ Scully 界面创建了一些博客文章并将其显示在屏幕上。\n\n在下一章中，我们将研究 Angular 框架的另一个令人兴奋的特性——表单。我们将学习如何使用它们并构建一个问题跟踪系统。\n\
  \n\n\n\n\n## 使用响应式表单构建问题跟踪系统\n\nWeb 应用程序使用 HTML 表单从用户收集数据并对其进行验证，例如登录应用程序、执行搜索或完成在线支付时。Angular\
  \ 框架提供了两种类型的表单，即响应式表单和模板驱动表单，我们可以在 Angular 应用程序中使用它们。\n\n在本章中，我们将构建一个用于管理和跟踪问题的系统。我们将使用\
  \ Angular 响应式表单来报告新问题。我们还将使用 VMware 的 **Clarity Design System** 来设计我们的表单并显示问题。\n\
  \n我们将涵盖以下主题：\n- 向 Angular 应用程序安装 Clarity Design System\n- 显示问题的概览\n- 报告新问题\n- 将问题标记为已解决\n\
  - 为新问题开启建议\n\n## 基本背景理论和上下文\n\nAngular 框架提供了两种可用的表单类型：\n- **模板驱动：** 它们在 Angular\
  \ 应用程序中设置起来简单直接。模板驱动表单扩展性不佳，并且难以测试，因为它们在组件模板中定义。\n- **响应式：** 它们基于响应式编程方法。响应式表单在组件的\
  \ TypeScript 类中运行，并且比模板驱动表单更容易测试且扩展性更好。\n\n在本章中，我们将亲手实践响应式表单方法，这是 Angular 社区中最流行的方法。\n\
  \nAngular 组件可以从外部源（如 HTTP）或从其他 Angular 组件获取数据。在后一种情况下，它们通过公共 API 与具有数据的组件交互：\n-\
  \ `@Input()`：用于将数据传递到组件。\n- `@Output()`：用于获取有关更改的通知或从组件获取数据。\n\nClarity 是一个设计系统，其中包含构建\
  \ Web 应用程序的 UX 和 UI 指南的集合。它还包含一个包含这些指南的专有 HTML 和 CSS 框架。幸运的是，我们不必使用此框架，因为 Clarity\
  \ 已经提供了各种基于 Angular 的 UI 组件，我们可以在 Angular 应用程序中使用它们。\n\n## 项目概览\n\n在该项目中，我们将使用响应式表单和\
  \ Clarity 构建一个用于管理和跟踪问题的 Angular 应用程序。最初，我们将在表中显示可排序和过滤的问题列表。然后，我们将创建一个表单以允许用户报告新问题。最后，我们将创建一个用于解决问题的模态对话框。我们还将更进一步，在报告问题时开启建议，以帮助用户避免重复条目。\n\
  \n构建时间：1 小时\n\n## 开始\n\n完成本项目需要以下软件工具：\n- **Angular CLI**：Angular 的命令行界面，可在 https://angular.io/cli\
  \ 找到\n- **GitHub 材料**：本章的相关代码，可在 https://github.com/PacktPublishing/Angular-Projects-Second-Edition\
  \ 的 Chapter03 文件夹中找到。\n\n### 向 Angular 应用程序安装 Clarity\n\n让我们开始创建问题跟踪系统，通过脚手架创建一个新的\
  \ Angular 应用程序：\n\n```\nng new issue-tracker --defaults\n```\n\n我们使用 Angular CLI\
  \ 的 ng new 命令创建具有以下特征的新 Angular 应用程序：\n- issue-tracker：Angular 应用程序的名称。\n- --defaults：这会禁用应用程序的\
  \ Angular 路由并将样式表格式设置为 CSS。\n\n我们现在需要在 Angular 应用程序中安装 Clarity 库。VMware 团队创建了一个\
  \ Angular CLI schematic，我们可以使用它。导航到使用前一个命令创建的 issue-tracker 文件夹并运行以下 Angular CLI\
  \ 的 add 命令：\n\n```\nng add @clr/angular\n```\n\n前一个命令将在我们的 Angular CLI 工作区中执行以下修改：\n\
  - 1. 它会将 Clarity 库的所有必要 npm 包添加到 package.json 文件的 dependencies 部分。\n- 2. 它会在 Angular\
  \ CLI 工作区的配置文件 angular.json 中添加必要的样式：\n\n```json\n\"styles\": [\n  \"node_modules/@clr/ui/clr-ui.min.css\"\
  ,\n  \"src/styles.css\"\n]\n```\n\n3. 最后，它将在主应用程序模块 `app.module.ts` 中导入 `ClarityModule`：\n\
  \n```typescript\nimport { NgModule } from '@angular/core';\nimport { BrowserModule\
  \ } from '@angular/platform-browser';\n\nimport { AppComponent } from './app.component';\n\
  import { ClarityModule } from '@clr/angular';\nimport { BrowserAnimationsModule\
  \ } from '@angular/platform-browser/animations';\n\n@NgModule({\n  declarations:\
  \ [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n    ClarityModule,\n\
  \    BrowserAnimationsModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n\
  })\nexport class AppModule { }\n```\n\n它还将从 `@angular/platform-browser/animations`\
  \ npm 包导入 `BrowserAnimationsModule`。`BrowserAnimationsModule` 用于在应用程序中发生特定操作时显示动画，例如单击按钮。\n\
  \n现在我们已完成在应用程序中安装 Clarity，我们可以开始使用它构建精美的设计。在下一节中，我们将首先创建一个用于显示问题的列表。\n\n## 显示问题的概览\n\
  \n我们的 Angular 应用程序将负责管理和跟踪问题。当应用程序启动时，我们应该显示系统中所有待处理问题的列表。待处理问题定义为尚未解决的问题。我们将遵循的流程可以进一步分析为以下内容：\n\
  - 获取待处理问题\n- 使用数据网格可视化问题\n\n### 获取待处理问题\n\n首先，我们需要创建一个用于获取所有待处理问题的机制：\n- 1. 使用 Angular\
  \ CLI 的 `generate` 命令创建一个名为 `issues` 的 Angular 服务：\n\n```bash\nng generate service\
  \ issues\n```\n\n前一个命令将在 Angular CLI 项目的 `src\\app` 文件夹中创建 `issues.service.ts` 文件。\n\
  - 2. 每个问题都将具有特定类型的特定属性。我们需要为其创建一个 TypeScript 接口，使用以下 Angular CLI 命令：\n\n```bash\n\
  ng generate interface issue\n```\n\n前一个命令将在项目的 `src\\app` 文件夹中创建 `issue.ts` 文件。\n\
  - 3. 打开 `issue.ts` 文件并在 `Issue` 接口中添加以下属性：\n\n```typescript\nexport interface Issue\
  \ {\n  issueNo: number;\n  title: string;\n  description: string;\n  priority: 'low'\
  \ | 'high';\n  type: 'Feature' | 'Bug' | 'Documentation';\n  completed?: Date;\n\
  }\n```\n\ncompleted 属性是问题被解决的日期。我们将其定义为可选，因为新问题不会设置此属性。\n\n4. 打开我们在步骤 1 中创建的 Angular\
  \ 服务并添加一个 `issues` 属性来保存我们的问题数据。还创建一个 `getPendingIssues` 方法，该方法将返回所有未完成的问题：\n\n\
  ```typescript\nimport { Injectable } from '@angular/core';\nimport { Issue } from\
  \ './issue';\n\n@Injectable({\n  providedIn: 'root'\n})\nexport class IssuesService\
  \ {\n\n  private issues: Issue[] = [];\n\n  constructor() { }\n\n  getPendingIssues():\
  \ Issue[] {\n    return this.issues.filter(issue =>\n      !issue.completed;\n \
  \ }\n\n}\n```\n\n5. 我们将 `issues` 属性初始化为空数组。如果您想使用示例数据开始，可以使用本章 GitHub 材料中 `src\\\
  assets` 文件夹中存在的 `mock-issues.ts` 文件并按如下方式导入它：\n\n```typescript\nimport { issues\
  \ } from '../assets/mock-issues';\n```\n\n在下一节中，我们将创建一个用于显示这些问题的组件。\n\n### 在数据网格中可视化问题\n\
  \n我们将使用 Clarity 库的 **数据网格** UI 组件以表格格式显示数据。数据网格还开箱即用地提供了过滤和排序机制。让我们首先创建将托管数据网格的\
  \ Angular 组件：\n- 1. 使用 `generate` 命令的 Angular CLI 创建组件：\n\n```bash\nng generate\
  \ component issue-list\n```\n\n\n\n\n\n4. 创建一个名为 `getIssues` 的方法，它将调用注入服务的 `getPendingIssues`\
  \ 方法并将其返回值保存在 `issues` 组件属性中：\n\n```typescript\nimport { Component, OnInit } from\
  \ '@angular/core';\nimport { Issue } from '../issue';\nimport { IssuesService }\
  \ from '../issues.service';\n\n@Component({\n  selector: 'app-issue-list',\n  templateUrl:\
  \ './issue-list.component.html',\n  styleUrls: ['./issue-list.component.css']\n\
  })\nexport class IssueListComponent implements OnInit {\n\n  issues: Issue[] = [];\n\
  \n  constructor(private issueService: IssuesService) { }\n\n  ngOnInit(): void {\n\
  \  }\n\n  private getIssues() {\n    this.issues =\n      this.issueService.getPendingIssues();\n\
  \  }\n}\n```\n\n5. 最后，在 `ngOnInit` 组件方法中调用 `getIssues` 方法，以便在组件初始化时获取所有待处理的 issues：\n\
  \n```typescript\nngOnInit(): void {\n  this.getIssues();\n}\n```\n\n我们已经在组件中实现了获取\
  \ issue 数据的过程。现在要做的就是在模板中显示它。打开 `issue-list.component.html` 文件并用以下 HTML 代码替换其内容：\n\
  \n### `issue-list.component.html`\n\n```html\n<clr-datagrid>\n  <clr-dg-column [clrDgField]=\"\
  'issueNo'\"\n    [clrDgColType]=\"'number'\">Issue No</clr-dg-column>\n  <clr-dg-column\
  \ [clrDgField]=\"'type'\">Type</clr-dg-column>\n  <clr-dg-column [clrDgField]=\"\
  'title'\">Title</clr-dg-column>\n  <clr-dg-column [clrDgField]=\"'description'\"\
  >Description\n    </clr-dg-column>\n  <clr-dg-column [clrDgField]=\"'priority'\"\
  >Priority\n    </clr-dg-column>\n\n  <clr-dg-row *clrDgItems=\"let issue of issues\"\
  >\n    <clr-dg-cell>{{issue.issueNo}}</clr-dg-cell>\n    <clr-dg-cell>{{issue.type}}</clr-dg-cell>\n\
  \    <clr-dg-cell>{{issue.title}}</clr-dg-cell>\n    <clr-dg-cell>{{issue.description}}</clr-dg-cell>\n\
  \    <clr-dg-cell>\n      <span class=\"label\" [class.label-danger]=\"issue.priority\
  \ === 'high'\">{{issue.priority}}</span>\n    </clr-dg-cell>\n  </clr-dg-row>\n\n\
  \  <clr-dg-footer>{{issues.length}} issues</clr-dg-footer>\n</clr-datagrid>\n```\n\
  \n在前面的代码片段中，我们使用了 Clarity 库的多个 Angular 组件：\n\n- `clr-datagrid`：定义一个表格。\n- `clr-dg-column`：定义表格的一列。每个列都使用\
  \ `clrDgField` 指令绑定到该列所代表的 issue 的属性名。`clrDgField` 指令为我们提供了排序和过滤功能，而无需在 TypeScript\
  \ 类文件中编写哪怕一行代码。排序仅对基于字符串的内容自动生效。如果我们想按其他原始类型排序，则必须使用 `clrDgColType` 指令并指定特定类型。\n\
  - `clr-dg-row`：定义表格的一行。它使用 `clrDgItems` 指令遍历 issues 并为每个 issue 创建一行。\n- `clr-dg-cell`：每一行都包含一组\
  \ `clr-dg-cell` 组件，用于通过插值显示每个列的值。在最后一个单元格中，当 issue 的优先级为高时，我们添加 `label-danger` 类以表明其重要性。\n\
  - `clr-dg-footer`：定义表格的页脚。在此情况下，它显示 issues 的总数。\n\n如果我们使用 `ng serve` 运行 Angular\
  \ 应用程序，输出将如下所示：\n\n| Issue No | Type | Title | Description | Priority |\n|---|---|---|---|---|\n\
  | 1 | Feature | Add email validation in registration form | Validate the email entered\
  \ in the user registration form | high |\n| 2 | Feature | Display the address details\
  \ of a customer | Add a column to display the details of the customer address in\
  \ the customer list | low |\n| 3 | Bug | Export to CSV is not working | The export\
  \ process of a report into CSV format throws an error | high |\n| 4 | Feature |\
  \ Locale settings per user | Add settings to configure the locale of the current\
  \ user | low |\n| 5 | Documentation | Add new customer tutorial | Create a tutorial\
  \ on how to add a new customer into the application | high |\n|  |  |  |  | 5 issues\
  \ |\n\n图 3.1 – 待处理 issues 概览\n\n> **重要说明**\n>\n> 在之前的截图中，应用程序使用了来自 `mock-issues.ts`\
  \ 文件的示例数据。\n\nClarity 库的数据网格组件具有丰富的可用功能，可在我们的 Angular 应用程序中使用。在下一节中，我们将学习如何使用响应式表单来报告新的\
  \ issue。\n\n## 报告新 issues\n\n我们 issue 跟踪系统的核心功能之一是能够报告新的 issues。我们将使用 Angular 响应式表单来创建添加新\
  \ issues 的表单。该功能可进一步细分为以下任务：\n\n- 在 Angular 应用程序中设置响应式表单\n- 创建报告 issue 表单\n- 在列表中显示新的\
  \ issue\n- 验证 issue 的详细信息\n\n让我们开始在 Angular 应用程序中引入响应式表单。\n\n### 在 Angular 应用程序中设置响应式表单\n\
  \n响应式表单定义在 Angular 框架的 `@angular/forms` npm 包中：\n\n1. 打开 `app.module.ts` 文件并导入 `ReactiveFormsModule`：\n\
  \n```typescript\nimport { ReactiveFormsModule } from '@angular/forms';\n```\n\n\
  2. 将 `ReactiveFormsModule` 添加到 `@NgModule` 装饰器的 `imports` 数组中：\n\n```typescript\n\
  @NgModule({\n  declarations: [\n    AppComponent,\n    IssueListComponent\n  ],\n\
  \  imports: [\n    BrowserModule,\n    ClarityModule,\n    BrowserAnimationsModule,\n\
  \    ReactiveFormsModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n\
  })\n```\n\nReactiveFormsModule 包含我们与表单交互所需的所有 Angular 指令和服务，如下一节所述。\n\n### 创建报告\
  \ issue 表单\n\n现在我们已在 Angular 应用程序中引入了响应式表单，可以开始构建表单了：\n\n1. 创建一个名为 `issue-report`\
  \ 的新 Angular 组件：\n\n```\nng generate component issue-report\n```\n\n2. 打开 `issue-report.component.ts`\
  \ 文件并在 `IssueReportComponent` 类的构造函数中注入 `FormBuilder`：\n\n```typescript\nimport\
  \ { Component, OnInit } from '@angular/core';\nimport { FormBuilder } from '@angular/forms';\n\
  \n@Component({\n  selector: 'app-issue-report',\n  templateUrl: './issue-report.component.html',\n\
  \  styleUrls: ['./issue-report.component.css']\n})\nexport class IssueReportComponent\
  \ implements OnInit {\n\n  constructor(private builder: FormBuilder) { }\n\n  ngOnInit():\
  \ void {\n  }\n\n}\n```\n\nFormBuilder 是一个 Angular 服务，我们用它以简便的方式构建响应式表单。\n\n3. 声明一个\
  \ `issueForm` 属性，其类型为 `FormGroup`，并在 `ngOnInit` 方法中初始化它：\n\n```typescript\nimport\
  \ { Component, OnInit } from '@angular/core';\nimport { FormBuilder, FormGroup }\
  \ from '@angular/forms';\n\n@Component({\n  selector: 'app-issue-report',\n  templateUrl:\
  \ './issue-report.component.html',\n  styleUrls: ['./issue-report.component.css']\n\
  })\nexport class IssueReportComponent implements OnInit {\n\n  issueForm: FormGroup\
  \ | undefined;\n\n  constructor(private builder: FormBuilder) { }\n\n  ngOnInit():\
  \ void {\n    this.issueForm = this.builder.group({\n      title: [''],\n      description:\
  \ [''],\n      priority: [''],\n      type: ['']\n    });\n  }\n\n}\n```\n\nFormGroup\
  \ 用于将单个控件组合成表单的逻辑表示。`FormBuilder` 类的 `group` 方法用于构建表单。它接受一个对象作为参数，其中每个键是表单控件的唯一名称，每个值是一个包含其默认值\
  \ 的数组。在此情况下，我们将所有控件初始化为空字符串，因为表单将用于从头创建新的 issue。\n\n4. 现在我们需要将创建的 `FormGroup` 对象与相应的\
  \ HTML 元素关联。打开 `issue-report.component.html` 文件并用以下 HTML 代码替换其内容：\n\n```html\n<h3>Report\
  \ an issue</h3>\n<form clrForm *ngIf=\"issueForm\" [formGroup]=\"issueForm\">\n\
  \  <clr-input-container>\n    <label>Title</label>\n```\n\n\n```html\n<input clrInput\
  \ formControlName=\"title\" />\n</clr-input-container>\n<clr-textarea-container>\n\
  \  <label>描述</label>\n  <textarea clrTextarea\n            formControlName=\"description\"\
  ></textarea>\n</clr-textarea-container>\n<clr-radio-container clrInline>\n  <label>优先级</label>\n\
  \  <clr-radio-wrapper>\n    <input type=\"radio\" value=\"low\" clrRadio\n     \
  \      formControlName=\"priority\" />\n    <label>低</label>\n  </clr-radio-wrapper>\n\
  \  <clr-radio-wrapper>\n    <input type=\"radio\" value=\"high\" clrRadio\n    \
  \       formControlName=\"priority\" />\n    <label>高</label>\n  </clr-radio-wrapper>\n\
  </clr-radio-container>\n<clr-select-container>\n  <label>类型</label>\n  <select clrSelect\
  \ formControlName=\"type\">\n    <option value=\"Feature\">功能</option>\n    <option\
  \ value=\"Bug\">缺陷</option>\n    <option value=\"Documentation\">文档\n    </option>\n\
  \  </select>\n</clr-select-container>\n</form>\n```\n\n`formGroup` 和 `clrForm` 指令用于将\
  \ HTML 表单元素与 `issueForm` 属性关联，并将其标识为 Clarity 表单。\n\n`formControlName` 指令用于通过名称将\
  \ HTML 元素与表单控件关联。每个控件还使用 Clarity 容器元素进行定义。例如，标题输入控件是一个 `clr-input-container` 组件，其中包含一个\
  \ input HTML 元素。\n\n每个原生 HTML 元素都根据其类型附加了相应的 Clarity 指令。例如，`input` HTML 元素包含一个 `clrInput`\
  \ 指令。\n\n5. 最后，为 `issue-report.component.css` 文件添加一些样式：\n\n```css\n.clr-input, .clr-textarea\
  \ {\n  width: 30%;\n}\n\nbutton {\n  margin-top: 25px;\n}\n```\n\n现在我们已经创建了表单的基础部分，接下来我们将学习如何提交其详细信息：\n\
  \n1. 在 HTML 表单元素的结束标签*之前*添加一个 HTML button 元素：\n\n```html\n<button class=\"btn btn-primary\"\
  \ type=\"submit\">创建</button>\n```\n\n我们将其类型设置为 submit，以便在点击按钮时触发表单提交。\n\n2. 打开\
  \ `issues.service.ts` 文件，添加一个 `createIssue` 方法，将新问题插入到 `issues` 数组中：\n\n```typescript\n\
  createIssue(issue: Issue) {\n  issue.issueNo = this.issues.length + 1;\n  this.issues.push(issue);\n\
  }\n```\n\n在将问题添加到 `issues` 数组之前，我们会自动为其分配一个新的 `issueNo`。\n\n> **提示**\n>\n> `issueNo`\
  \ 属性目前是根据 `issues` 数组的长度计算的。更好的做法是实现一个生成器机制，用于创建唯一且随机的 `issueNo` 值。\n\n3. 返回 `issue-report.component.ts`\
  \ 文件，导入 `IssuesService`，并将其注入到 TypeScript 类的构造函数中：\n\n```typescript\nconstructor(private\
  \ builder: FormBuilder, private issueService: IssuesService) { }\n```\n\n4. 添加一个新的组件方法，用于调用注入服务的\
  \ `createIssue` 方法：\n\n```typescript\naddIssue() {\n  this.issueService.createIssue(this.issueForm?.value);\n\
  }\n```\n\n我们通过 `issueForm` 对象的 `value` 属性传递每个表单控件的值。\n\n> **重要说明**\n>\n> `FormGroup`\
  \ 对象的 `value` 属性包含表单的模型。该模型的键与 `Issue` 接口的属性名称相匹配，而 `Issue` 接口是 `createIssue` 方法作为参数接受的类型。如果两者不同，我们应在将表单模型传递给该方法之前对其进行转换。\n\
  \n5. 打开 `issue-report.component.html` 文件，将表单的 `ngSubmit` 事件绑定到 `addIssue` 组件方法：\n\
  \n```html\n<form clrForm *ngIf=\"issueForm\" [formGroup]=\"issueForm\" (ngSubmit)=\"\
  addIssue()\">\n```\n\n当我们点击表单的“创建”按钮时，将触发 `ngSubmit` 事件。\n\n现在我们已经完成了向系统添加新问题所涉及的所有流程。在下一节中，我们将学习如何在待处理问题表格中显示新创建的问题。\n\
  \n## 在列表中显示新问题\n\n显示问题和创建新问题是委托给不同 Angular 组件的两项任务。当我们使用 `IssueReportComponent`\
  \ 创建新问题时，需要通知 `IssueListComponent` 在表格中反映该更改。首先，让我们看看如何配置 `IssueReportComponent`\
  \ 来传达该更改：\n\n1. 打开 `issue-report.component.ts` 文件，使用 `@Output()` 装饰器添加一个 `EventEmitter`\
  \ 属性：\n\n```typescript\n@Output() formClose = new EventEmitter();\n```\n\n`Output`\
  \ 和 `EventEmitter` 符号可以从 `@angular/core` npm 包中导入。\n\n2. 在 addIssue 组件方法中，创建问题之后立即调用\
  \ formClose 输出属性的 emit 方法：\n\n```typescript\naddIssue() {\n  this.issueService.createIssue(this.issueForm?.value);\n\
  \  this.formClose.emit();\n}\n```\n\n3. 在组件模板中添加第二个 HTML button 元素，并在其点击事件上调用 emit\
  \ 方法：\n\n```html\n<button class=\"btn btn-primary\" type=\"submit\">创建</button>\n\
  <button class=\"btn\" type=\"button\" (click)=\"formClose.emit()\">取消</button>\n\
  ```\n\n现在，IssueListComponent 可以绑定到 IssueReportComponent 的 formClose 事件，并在点击任一按钮时收到通知。让我们来了解具体方法：\n\
  \n1. 打开 `issue-list.component.ts` 文件，在 `IssueListComponent` 类中添加以下属性：\n\n```typescript\n\
  showReportIssue = false;\n```\n\nshowReportIssue 属性将切换报告问题表单的显示状态。\n\n2. 添加以下组件方法，当报告问题表单发出\
  \ formClose 事件时将调用该方法：\n\n```typescript\nonCloseReport() {\n  this.showReportIssue\
  \ = false;\n  this.getIssues();\n}\n```\n\nonCloseReport 方法会将 showReportIssue 属性设置为\
  \ false，以便报告问题表单不再可见，并改为显示待处理问题表格。它还会再次获取问题以刷新表格中的数据。\n\n3. 打开 `issue-list.component.html`\
  \ 文件，在模板顶部添加一个 HTML button 元素。点击该按钮时将显示报告问题表单：\n\n```html\n<button class=\"btn btn-primary\"\
  \ (click)=\"showReportIssue = true\">添加新问题</button>\n```\n\n4. 将按钮和数据网格组合在一个 `ng-container`\
  \ 元素内。如 `*ngIf` Angular 指令所示，当报告问题表单不可见时，将显示 `ng-container` 元素的内容：\n\n```html\n\
  <ng-container *ngIf=\"showReportIssue === false\">\n  <button class=\"btn btn-primary\"\
  \ (click)=\"showReportIssue = true\">添加新问题</button>\n  <clr-datagrid>\n    <clr-dg-column\
  \ [clrDgField]=\"'issueNo'\" [clrDgColType]=\"'number'\">问题编号</clr-dg-column>\n\
  \    <clr-dg-column [clrDgField]=\"'type'\">类型</clr-dg-column>\n    <clr-dg-column\
  \ [clrDgField]=\"'title'\">标题</clr-dg-column>\n    <clr-dg-column [clrDgField]=\"\
  'description'\">描述</clr-dg-column>\n    <clr-dg-column [clrDgField]=\"'priority'\"\
  >优先级</clr-dg-column>\n\n    <clr-dg-row *clrDgItems=\"let issue of issues\">\n \
  \     <clr-dg-cell>{{issue.issueNo}}</clr-dg-cell>\n      <clr-dg-cell>{{issue.type}}</clr-dg-cell>\n\
  \      <clr-dg-cell>{{issue.title}}</clr-dg-cell>\n      <clr-dg-cell>{{issue.description}}</clr-dg-cell>\n\
  \      <clr-dg-cell>\n        <span class=\"label\" [class.label-danger]=\"issue.priority\
  \ === 'high'\">\n          {{issue.priority}}</span>\n      </clr-dg-cell>\n   \
  \ </clr-dg-row>\n\n    <clr-dg-footer>{{issues.length}} 个问题</clr-dg-footer>\n  </clr-datagrid>\n\
  </ng-container>\n```\n\nng-container 元素是一个不会在屏幕上渲染的 Angular 组件，用于对 HTML 元素进行分组。\n\
  \n5. 在模板末尾添加 app-issue-report 组件，并使用 `*ngIf` 指令在 showReportIssue 属性为 true 时显示它。同时将其\
  \ formClose 事件绑定到 onCloseReport 组件方法：\n\n```html\n<app-issue-report *ngIf=\"showReportIssue\
  \ == true\" (formClose)=\"onCloseReport()\"></app-issue-report>\n```\n\n我们已经成功地将所有环节连接起来，并完成了报告问题表单与显示问题表格之间的交互。现在是时候让它们发挥作用了：\n\
  \n1. 使用 `ng serve` 运行 Angular 应用程序。\n2. 点击 **ADD NEW ISSUE** 按钮并输入新问题的详细信息：\n\n\
  ![](img/efea53d01337e7b223389b38dcdb0160_93_0.png)\n\n图 3.2 – 报告问题表单\n\n\n\n\n\n\
  ## 校验问题详情\n\n当我们使用问题报告表单创建问题时，由于尚未添加任何校验规则，表单控件的值可以为空。要在表单控件中添加校验，我们使用 `@angular/forms`\
  \ npm 包中的 `Validators` 类。校验器会被添加在使用 `FormBuilder` 服务构建的每个表单控件实例中。在本例中，我们将使用 `required`\
  \ 校验器来指示某个表单控件必须有值：\n\n- 1. 打开 `issue-report.component.ts` 文件，并从 `@angular/forms`\
  \ npm 包中导入 `Validators`：\n\n```\nimport { FormBuilder, FormGroup, Validators } from\n\
  '@angular/forms';\n```\n\n- 2. 在除问题描述之外的所有控件中设置 `Validators.required` 静态属性：\n\n\
  ```\nngOnInit(): void {\n  this.issueForm = this.builder.group({\n    title: ['',\
  \ Validators.required],\n    description: [''],\n    priority: ['', Validators.required],\n\
  \    type: ['', Validators.required]\n  });\n}\n```\n\n我们可以为表单控件使用各种校验器，例如 `min`、`max`\
  \ 和 `email`。如果想在一个表单控件中设置多个校验器，可以将它们放在一个数组中。\n\n- 3. 在表单中使用校验器时，我们需要为用户提供视觉提示。打开\
  \ `issue-report.component.html` 文件，并为每个必填的表单控件添加一个 `clr-control-error` 组件：\n\n```html\n\
  <clr-input-container>\n  <label>Title</label>\n  <input clrInput formControlName=\"\
  title\" />\n  <clr-control-error>Title is required\n  </clr-control-error>\n</clr-input-container>\n\
  <clr-textarea-container>\n  <label>Description</label>\n  <textarea clrTextarea\
  \ formControlName=\"description\">\n  </textarea>\n</clr-textarea-container>\n<clr-radio-container\
  \ clrInline>\n  <label>Priority</label>\n  <clr-radio-wrapper>\n    <input type=\"\
  radio\" value=\"low\" clrRadio\n      formControlName=\"priority\" />\n    <label>Low</label>\n\
  \  </clr-radio-wrapper>\n  <clr-radio-wrapper>\n    <input type=\"radio\" value=\"\
  high\" clrRadio\n      formControlName=\"priority\" />\n    <label>High</label>\n\
  \  </clr-radio-wrapper>\n  <clr-control-error>Priority is required\n  </clr-control-error>\n\
  </clr-radio-container>\n<clr-select-container>\n  <label>Type</label>\n  <select\
  \ clrSelect formControlName=\"type\">\n    <option value=\"Feature\">Feature</option>\n\
  \    <option value=\"Bug\">Bug</option>\n```\n\n**标题**输入框下方应出现一条消息，提示我们尚未输入任何值。Clarity\
  \ 库中的校验消息以文本和红色感叹号图标的形式显示在被校验的表单控件中。\n\n- 6. 现在，点击**创建**按钮：\n\n![](img/efea53d01337e7b223389b38dcdb0160_97_0.png)\n\
  \n图 3.5 – 表单校验消息\n\n所有校验消息将同时显示在屏幕上，并且表单不会被提交。响应式表单中的校验是确保我们的 Angular 应用具有流畅用户体验的重要组成部分。在下一节中，我们将学习如何使用\
  \ Clarity 创建模态对话框，并用它来解决列表中的问题。\n\n## 解决问题\n\n问题跟踪系统的主要思想是问题应该在某个时刻得到解决。我们将在应用中创建一个用户工作流来完成此任务。我们将能够直接从待处理问题列表中解决问题。应用将通过模态对话框在解决前请求用户确认：\n\
  \n- 1. 创建一个 Angular 组件来承载对话框：\n\n```\nng generate component confirm-dialog\n```\n\
  \n- 2. 打开 `confirm-dialog.component.ts` 文件，并在 `ConfirmDialogComponent` 类中创建以下输入和输出属性：\n\
  \n```\nimport { Component, EventEmitter, Input, Output } from '@angular/core';\n\
  \n@Component({\n  selector: 'app-confirm-dialog',\n  templateUrl: './confirm-dialog.component.html',\n\
  \  styleUrls: ['./confirm-dialog.component.css']\n})\nexport class ConfirmDialogComponent\
  \ {\n  @Input() issueNo: number | null = null;\n  @Output() confirm = new EventEmitter<boolean>();\n\
  }\n```\n\n我们将使用 `@Input()` 装饰器获取问题编号，并将其显示在组件的模板上。`confirm` 的 `EventEmitter` 属性将发出一个布尔值，以指示用户是否确认解决问题。\n\
  \n- 3. 创建两个方法，它们将以 `true` 或 `false` 调用 `confirm` 输出属性的 `emit` 方法：\n\n```\nagree()\
  \ {\n  this.confirm.emit(true);\n  this.issueNo = null;\n}\n\ndisagree() {\n  this.confirm.emit(false);\n\
  \  this.issueNo = null;\n}\n```\n\n这两个方法都会将 `issueNo` 属性设置为 `null`，因为该属性还将控制模态对话框是否打开。因此，当用户同意或不同意解决问题时，我们都要关闭对话框。\n\
  \n我们已经设置了对话框组件的 TypeScript 类。现在让我们将其与模板连接起来。打开 `confirm-dialog.component.html` 文件并将其内容替换为以下内容：\n\
  \n### confirm-dialog.component.html\n\n```html\n<clr-modal [clrModalOpen]=\"issueNo\
  \ !== null\"\n           [clrModalClosable]=\"false\">\n  <h3 class=\"modal-title\"\
  >\n    Resolve Issue #\n    {{issueNo}}\n  </h3>\n  <div class=\"modal-body\">\n\
  \    <p>Are you sure you want to close the issue?</p>\n  </div>\n  <div class=\"\
  modal-footer\">\n    <button type=\"button\" class=\"btn btn-outline\"\n       \
  \     (click)=\"disagree()\">Cancel</button>\n    <button type=\"button\" class=\"\
  btn btn-danger\"\n            (click)=\"agree()\">Yes, continue</button>\n  </div>\n\
  </clr-modal>\n```\n\nClarity 模态对话框由一个 `clr-modal` 组件和一组带有特定类的 HTML 元素组成：\n\n- `modal-title`：对话框的标题，显示当前的问题编号。\n\
  - `modal-body`：对话框的主要内容。\n- `modal-footer`：对话框的页脚，通常用于为该对话框添加操作。我们目前添加了两个 HTML 按钮元素，并将其点击事件分别绑定到组件的\
  \ `agree` 和 `disagree` 方法上。\n\n```\n}\n\nonCloseReport() {\n  this.showReportIssue\
  \ = false;\n  this.getIssues();\n}\n\nonConfirm(confirmed: boolean) {\n  if (confirmed\
  \ && this.selectedIssue) {\n    this.issueService.completeIssue(this.selectedIssue);\n\
  \    this.getIssues();\n  }\n  this.selectedIssue = null;\n}\n\nprivate getIssues()\
  \ {\n  this.issues = this.issueService.getPendingIssues();\n}\n}\n```\n\n只有在 `confirmed`\
  \ 参数为 `true` 时，`onConfirm` 方法才会调用 `issueService` 属性的 `completeIssue` 方法。在这种情况下，它还会调用\
  \ `getIssues` 方法来刷新表格数据。`selectedIssue` 属性保存我们想要解决的问题对象，并且在调用 `onConfirm` 方法时会被重置。\n\
  \n- 3. 打开 `issue-list.component.html` 文件，并在 `clr-dg-row` 组件内添加一个操作溢出组件：\n\n```\n\
  <clr-dg-row *clrDgItems=\"let issue of issues\">\n  <clr-dg-action-overflow>\n \
  \   <button class=\"action-item\" (click)=\"selectedIssue = issue\">Resolve</button>\n\
  \  </clr-dg-action-overflow>\n  <clr-dg-cell>{{issue.issueNo}}</clr-dg-cell>\n \
  \ <clr-dg-cell>{{issue.type}}</clr-dg-cell>\n  <clr-dg-cell>{{issue.title}}</clr-dg-cell>\n\
  \  <clr-dg-cell>{{issue.description}}</clr-dg-cell>\n  <clr-dg-cell>\n    <span\
  \ class=\"label\" [class.label-danger]=\"issue.priority === 'high'\">{{issue.priority}}</span>\n\
  \  </clr-dg-cell>\n</clr-dg-row>\n```\n\nClarity 的 `clr-dg-action-overflow` 组件会在表格的每一行中添加一个下拉菜单。该菜单包含一个按钮，点击后会将该行的当前问题设置为\
  \ `selectedIssue` 属性。\n\n- 4. 最后，在模板末尾添加 `app-confirm-dialog` 组件：\n\n```\n<app-confirm-dialog\
  \ *ngIf=\"selectedIssue\"\n[issueNo]=\"selectedIssue.issueNo\"\n(confirm)=\"onConfirm($event)\"\
  ></app-confirm-dialog>\n```\n\n我们将 `selectedIssue` 属性的 `issueNo` 传递给对话框组件的输入绑定。我们使用\
  \ `?` 安全导航运算符来避免应用中出现错误，因为最初未选择任何问题，`issueNo` 属性不可用。\n\n我们还将 `onConfirm` 组件方法绑定到\
  \ `confirm` 事件，以便在用户同意或不同意时收到通知。`$event` 参数是 Angular 中的保留关键字，包含事件绑定的结果，该结果取决于 HTML\
  \ 元素的类型。在本例中，它包含确认的布尔结果。\n\n我们已经将所有部分都整合到位来解决问题。让我们试一试：\n\n- 1. 运行 `ng serve` 并在\
  \ http://localhost:4200 打开应用。\n- 2. 如果没有任何问题，请使用“添加新问题”按钮创建一个。\n- 3. 点击某一行的操作菜单并选择“解决”。该菜单是“问题编号”列旁边的三个垂直点图标：\n\
  \n\n\n![](img/efea53d01337e7b223389b38dcdb0160_103_0.png)\n\n图 3.6 – 操作菜单\n\n- 4.\
  \ 在弹出的 **解决问题** 对话框中，点击 **是，继续** 按钮：\n\n![](img/efea53d01337e7b223389b38dcdb0160_103_1.png)\n\
  \n图 3.7 – 解决问题对话框\n\n点击按钮后，对话框会关闭，该问题将不再显示在列表中。\n\n我们为应用程序的用户提供了一种解决问题的方式。我们的问题跟踪系统现在已经完整，可以投入使用了！有时候，用户可能很匆忙，会报告一个已经报告过的问题。在下一节中，我们将学习如何利用高级响应式表单技术来帮助他们。\n\
  \n## 开启新问题建议\n\n响应式表单 API 提供了一种机制，可以在某个表单控件的值发生变化时得到通知。我们将在应用程序中使用它，在报告新问题时查找相关问题。更具体地说，当用户开始在标题表单控件中键入内容时，我们将显示建议问题列表：\n\
  \n- 1. 打开 `issues.service.ts` 文件并添加以下方法：\n\n```typescript\ngetSuggestions(title:\
  \ string): Issue[] {\n  if (title.length > 3) {\n    return this.issues.filter(issue\
  \ =>\n      issue.title.indexOf(title) !== -1);\n  }\n  return [];\n}\n```\n\ngetSuggestions\
  \ 方法将问题的标题作为参数，并搜索包含相同标题的任何问题。当 title 参数超过三个字符时，搜索机制会触发，以便将结果限制在合理的数量内。\n\n- 2.\
  \ 打开 `issue-report.component.ts` 文件并添加以下导入语句：\n\n```typescript\nimport { Issue }\
  \ from '../issue';\n```\n\n- 3. 创建一个新的组件属性来保存建议的问题：\n\n```typescript\nsuggestions:\
  \ Issue[] = [];\n```\n\n- 4. FormGroup 对象的 controls 属性包含所有表单控件，以键值对形式存储。键是控件的名称，值是对应的\
  \ AbstractControl 类型的实际表单控件对象。我们可以通过访问其名称（此处为 title）来获取表单控件值变化的通知，方式如下：\n\n```typescript\n\
  ngOnInit(): void {\n  this.issueForm = this.builder.group({\n    title: ['', Validators.required],\n\
  \    description: [''],\n    priority: ['', Validators.required],\n    type: ['',\
  \ Validators.required]\n  });\n  this.issueForm.controls.title.valueChanges.subscribe((\n\
  \    title: string) => {\n      this.suggestions =\n        this.issueservice.getSuggestions(title);\n\
  \    });\n  }\n```\n\n每个控件都暴露了一个 valueChanges 可观察对象，我们可以订阅它并持续获取值流。当用户开始在该表单的 title\
  \ 控件中键入内容时，valueChanges 可观察对象会立即发出新值。此时，我们便将 getSuggestions 方法的返回值赋给 suggestions\
  \ 组件属性。\n\n- 5. 要在组件模板上显示建议的问题，打开 `issue-report.component.html` 文件，并在 `clr-input-container`\
  \ 元素之后立即添加以下 HTML 代码：\n\n```html\n<div class=\"clr-row\" *ngIf=\"suggestions.length\"\
  >\n  <div class=\"clr-col-lg-2\"></div>\n  <div class=\"clr-col-lg-6\">\n    <clr-stack-view>\n\
  \      <clr-stack-header>Similar issues\n      </clr-stack-header>\n      <clr-stack-block\
  \ *ngFor=\"let issue of\n        suggestions\">\n        <clr-stack-label>#{{issue.issueNo}}:\n\
  \          {{issue.title}}</clr-stack-label>\n        <clr-stack-content>{{issue.description}}\n\
  \        </clr-stack-content>\n      </clr-stack-block>\n    </clr-stack-view>\n\
  \  </div>\n</div>\n```\n\n我们使用 Clarity 库中的 `clr-stack-view` 组件来以键值对表示形式显示建议的问题。键由\
  \ `clr-stack-header` 组件表示，显示问题的标题和编号。值由 `clr-stack-content` 组件表示，显示问题的描述。\n\n> **重要提示**\n\
  > \n> 我们仅在存在可用的建议问题时才显示类似问题。\n\n运行 `ng serve`，打开报告问题表单以创建新问题。当你在 **标题** 输入框中开始键入时，应用程序会建议与你尝试创建的问题相关的任何问题：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_106_0.png)\n\n*图 3.8 – 类似问题*\n\n现在，用户可以看到是否存在类似问题，从而避免报告重复问题。\n\
  \n## 总结\n\n在本章中，我们使用响应式表单和 Clarity 设计系统构建了一个用于管理和跟踪问题的 Angular 应用程序。\n\n首先，我们为 Angular\
  \ 应用程序安装了 Clarity，并使用数据网格组件显示待处理问题列表。然后，我们介绍了响应式表单，并使用它们构建了一个用于报告新问题的表单。我们在表单中添加了验证，以让用户直观地看到必填字段，并防止不需要的行为。\n\
  \n如果用户无法解决问题，问题跟踪系统的效率就不高。我们使用 Clarity 构建了一个模态对话框来解决选定的问题。最后，我们通过在报告新问题时建议相关问题，改善了应用程序的用户体验。\n\
  \n在下一章中，我们将使用 Angular Service Worker 构建一个用于天气的渐进式 Web 应用程序。\n\n我们将详细介绍以下主题：\n\n\
  - 设置 OpenWeather API\n- 显示天气数据\n- 使用 Service Worker 启用离线模式\n- 通过应用内通知保持最新状态\n- 使用\
  \ **Firebase** 托管部署应用\n\n## 必要的背景理论和上下文\n\n传统 Web 应用程序通常托管在 Web 服务器上，任何用户在任何给定时间都可以立即访问。原生应用程序安装在用户设备上，可以访问其原生资源，并且可以在任何网络下无缝工作。PWA\
  \ 应用程序介于 Web 和原生应用两个世界之间，兼具两者的特征。一个 PWA 应用程序是一种 Web 应用程序，基于以下支柱转变为原生应用：\n\n- **功能强大：**\
  \ 它可以访问本地保存的数据，并与连接到用户设备的外围硬件交互。\n- **可靠：** 它可以在任何网络连接中保持相同的性能和体验，即使在连接覆盖较差的区域也是如此。\n\
  - **可安装：** 它可以安装在用户设备上，可以直接从主屏幕启动，并与其他已安装的原生应用程序交互。\n\n将 Web 应用程序转换为 PWA 涉及多个步骤和技术。最核心的一步是配置\
  \ Service Worker。Service Worker 是在 Web 浏览器中运行的一种机制，充当应用程序与外部 HTTP 端点或其他应用内资源（如 JavaScript\
  \ 和 CSS 文件）之间的代理。Service Worker 的主要工作是拦截对这些资源的请求，并通过提供缓存响应或实时响应来处理它们。\n\n> **重要提示**\n\
  > \n> 浏览器标签页关闭后，Service Worker 仍然存在。\n\nAngular 框架提供了一个 Service Worker 实现，我们可以用它来将\
  \ Angular 应用程序转换为 PWA。\n\n我们需要先获取 API 密钥，然后才能开始使用 OpenWeather API：\n\n- 1. 访问 OpenWeather\
  \ API 网站：https://openweathermap.org/api。\n  \n  你会看到 OpenWeather 团队提供的所有可用 API 列表。\n\
  - 2. 找到标题为 **当前天气数据** 的部分，点击 **订阅** 按钮。\n  \n  你将被重定向到包含该服务可用定价方案的页面。每种方案都支持每分钟和每月不同组合的\
  \ API 调用次数。对于这个项目，我们将使用 **免费** 层级。\n- 3. 点击 **获取 API 密钥** 按钮。\n  \n  你将被重定向到该服务的注册页面。\n\
  - 4. 填写所有必需的详细信息，然后点击 **创建账户** 按钮。\n  \n  一条确认消息将发送到你创建账户时使用的电子邮件地址。\n- 5. 查找确认邮件，点击\
  \ **验证你的电子邮件** 按钮以完成注册。\n  \n  你很快会收到来自 OpenWeather 的另一封邮件，其中包含当前订阅的详细信息，包括你的 API\
  \ 密钥以及我们将用于与 API 通信的 HTTP 端点。\n\n> **重要提示**\n> \n> API 密钥可能需要一段时间才能激活，通常要几个小时，之后你才能使用它。\n\
  \nAPI 密钥激活后，我们就可以在 Angular 应用程序中使用它了。我们将在下一节中学习如何做到这一点。\n\n\n\n\n## 显示天气数据\n\n在本节中，我们将创建一个\
  \ Angular 应用程序来显示某个城市的天气信息。用户将在输入框中输入城市名称，应用程序将使用 OpenWeather API 获取指定城市的天气数据。我们将更详细地介绍以下主题：\n\
  \n- 搭建 Angular 应用程序\n- 与 OpenWeather API 通信\n- 显示某个城市的天气信息\n\n让我们先在下一节中创建 Angular\
  \ 应用程序。\n\n## 搭建 Angular 应用程序\n\n我们将使用 Angular CLI 的 `ng new` 命令从头创建一个新的 Angular\
  \ 应用程序：\n\n```\nng new weather-app --style=scss --routing=false\n```\n\n上述命令将创建一个具有以下属性的新\
  \ Angular CLI 应用程序：\n\n- `weather-app`：Angular 应用程序的名称\n- `--style=scss`：表示我们的 Angular\
  \ 应用程序将使用 SCSS 样式表格式\n- `--routing=false`：在应用程序中禁用 Angular 路由\n\n用户应该能够在输入框中输入城市名称，并且该城市的天气信息应以卡片布局可视化展示。**Angular\
  \ Material** 库提供了一组 Angular UI 组件，包括输入框和卡片，可供我们使用。\n\nAngular Material 组件遵循 Material\
  \ Design 原则，并由 Angular 的组件团队维护。我们可以使用 Angular CLI 的以下命令安装 Angular Material：\n\n\
  ```\nng add @angular/material --theme=indigo-pink --typography=true\n--animations=true\n\
  ```\n\n上述代码使用了 Angular CLI 的 `ng add` 命令，并传递了额外的配置选项：\n\n- `@angular/material`：Angular\
  \ Material 库的 npm 包名称。它还会安装 `@angular/cdk` 包，这是一组用于构建 Angular Material 的行为和交互。这两个包都会被添加到应用程序\
  \ `package.json` 文件的依赖项部分。\n- `--theme=indigo-pink`：我们想要使用的 Angular Material 主题名称。添加主题涉及修改\
  \ Angular CLI 工作区的多个文件。它会将 CSS 主题文件的条目添加到 `angular.json` 配置文件中：\n\n```\n./node_modules/@angular/material/prebuilt-themes/indigo-\n\
  pink.css\n```\n\n它还会在 `index.html` 文件中包含 Material Design 图标：\n\n```\n<link href=\"\
  https://fonts.googleapis.com/\nicon?family=Material+Icons\" rel=\"stylesheet\">\n\
  ```\n\nAngular Material 附带了一组我们可以使用的预定义主题。或者，我们可以构建一个适合我们特定需求的自定义主题。\n\n- `--typography=true`：在我们的应用程序中全局启用\
  \ Angular Material 排版。排版定义了文本内容的显示方式，默认使用 **Roboto** Google 字体，该字体包含在 `index.html`\
  \ 文件中：\n\n```\n<link href=\"https://fonts.googleapis.com/\ncss2?family=Roboto:wght@300;400;500&display=swap\"\
  \nrel=\"stylesheet\">\n```\n\n它会将以下类添加到 HTML 文件的 body 中：\n\n```\n<body class=\"\
  mat-typography\">\n  <app-root></app-root>\n</body>\n```\n\n它还会向我们的应用程序全局 `styles.scss`\
  \ 文件添加一些 CSS 样式：\n\n```\nhtml, body { height: 100%; }\nbody { margin: 0; font-family:\
  \ Roboto, \"Helvetica Neue\", sans-serif; }\n```\n\n- `--animations=true`：通过将 `BrowserAnimationsModule`\
  \ 导入主应用程序模块 `app.module.ts`，在我们的应用程序中启用浏览器动画：\n\n```typescript\nimport { NgModule\
  \ } from '@angular/core';\nimport { BrowserModule } from '@angular/platform-browser';\n\
  \nimport { AppComponent } from './app.component';\nimport { BrowserAnimationsModule\
  \ } from '@angular/platform-browser/animations';\n\n@NgModule({\n  declarations:\
  \ [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n    BrowserAnimationsModule\n\
  \  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\nexport class AppModule\
  \ { }\n```\n\n我们几乎完成了 Angular 应用程序的设置和配置。最后一步是添加我们在*设置 OpenWeather API*一节中创建的 API\
  \ 密钥。\n\nAngular CLI 工作区包含 `src\\environments` 文件夹，我们可以使用它来定义应用程序设置，例如 API 密钥和端点。它为我们想要在应用程序中支持的每个环境包含一个\
  \ TypeScript 文件。Angular CLI 默认创建两个文件：\n\n- `environment.ts`：开发环境的 TypeScript 文件。当我们使用\
  \ `ng serve` 启动 Angular 应用程序时会使用它。\n- `environment.prod.ts`：生产环境的 TypeScript 文件。当我们使用\
  \ `ng build` 构建应用程序时会使用它。\n\n每个环境文件都会导出一个 `environment` 对象。在开发和生产文件中，向该对象添加以下属性：\n\
  \n```\napiUrl: 'https://api.openweathermap.org/data/2.5/',\napiKey: '<Your API key>'\n\
  ```\n\n在上述代码片段中，`apiUrl` 属性是我们将用于调用 OpenWeather API 的端点 URL，`apiKey` 是我们的 API 密钥。将\
  \ `<Your API key>` 值替换为你拥有的 API 密钥。\n\n现在我们已经准备好构建 Angular 应用程序所需的所有组件。在下一节中，我们将创建一种与\
  \ OpenWeather API 交互的机制。\n\n## 与 OpenWeather API 通信\n\n应用程序应通过 HTTP 与 OpenWeather\
  \ API 交互以获取天气数据。让我们看看如何在应用程序中设置这种类型的通信：\n\n1. 首先，我们需要创建一个接口，用于描述我们将从 API 获取的数据类型。使用\
  \ Angular CLI 的以下 `generate` 命令创建一个：\n\n   ```\n   ng generate interface weather\n\
  \   ```\n\n   上述命令将在我们的 Angular CLI 项目的 `src\\app` 文件夹中创建 `weather.ts` 文件。\n\n2.\
  \ 打开 `weather.ts` 文件并按如下方式修改它：\n\n   ```typescript\n   export interface Weather\
  \ {\n     weather: WeatherInfo[],\n     main: {\n       temp: number;\n       pressure:\
  \ number;\n       humidity: number;\n     };\n     wind: {\n       speed: number;\n\
  \     };\n     sys: {\n       country: string\n     };\n     name: string;\n   }\n\
  \n   interface WeatherInfo {\n     main: string;\n     icon: string;\n   }\n   ```\n\
  \n每个属性对应 OpenWeather API 响应中的一个天气字段。你可以在 https://openweathermap.org/current#parameter\
  \ 找到每个字段的描述。\n\n然后，我们需要设置 Angular 框架提供的内置 HTTP 客户端。\n\n3. 打开 `app.module.ts` 文件，并将\
  \ `HttpClientModule` 添加到 `@NgModule` 装饰器的 imports 数组中：\n\n   ```typescript\n   import\
  \ { HttpClientModule } from '@angular/common/http';\n   import { NgModule } from\
  \ '@angular/core';\n   import { BrowserModule } from '@angular/platform-browser';\n\
  \n   import { AppComponent } from './app.component';\n   import { BrowserAnimationsModule\
  \ } from '@angular/platform-browser/animations';\n\n   @NgModule({\n     declarations:\
  \ [\n       AppComponent\n     ],\n     imports: [\n       BrowserModule,\n    \
  \   BrowserAnimationsModule,\n       HttpClientModule\n     ],\n     providers:\
  \ [],\n     bootstrap: [AppComponent]\n   })\n   export class AppModule { }\n  \
  \ ```\n\n4. 使用 Angular CLI 的 `generate` 命令创建一个新的 Angular 服务：\n\n   ```bash\n   ng\
  \ generate service weather\n   ```\n\n   上述命令将在我们的 Angular CLI 项目的 `src\\app` 文件夹中创建\
  \ `weather.service.ts` 文件。\n\n5. 打开 `weather.service.ts` 文件，并将 `HttpClient` 服务注入到其构造函数中：\n\
  \n   ```typescript\n   import { HttpClient } from '@angular/common/http';\n   import\
  \ { Injectable } from '@angular/core';\n\n   @Injectable({\n     providedIn: 'root'\n\
  \   })\n   export class WeatherService {\n     constructor(private http: HttpClient)\
  \ { }\n   }\n   ```\n\n6. 在服务中添加一个方法，该方法接受城市名称作为单个参数，并查询该城市的 OpenWeather API：\n\n\
  \   ```typescript\n   getWeather(city: string): Observable<Weather> {\n     const\
  \ options = new HttpParams()\n       .set('units', 'metric')\n       .set('q', city)\n\
  \       .set('appId', environment.apiKey);\n\n     return this.http.get<Weather>(environment.apiUrl\
  \ +\n       'weather', { params: options });\n   }\n   ```\n\ngetWeather 方法使用 HttpClient\
  \ 服务的 get 方法，该方法接受两个参数。第一个是 OpenWeather API 的 URL 端点，可从 environment 对象的 apiUrl 属性获取。\n\
  \n\n\n\n\n**重要提示**\n\n`environment` 对象从默认的 `environment.ts` 文件导入。当我们构建应用程序时，Angular\
  \ CLI 负责将其替换为 `environment.prod.ts` 文件。\n\n第二个参数是一个 `options` 对象，用于向请求传递额外的配置，例如通过\
  \ `params` 属性传递 URL 查询参数。我们使用 `HttpParams` 对象的构造函数，并对其 `set` 方法进行调用，以添加我们想要添加到 URL\
  \ 的每个查询参数。在我们的例子中，我们传递城市名称的 `q` 参数、从 `environment` 对象获取的 API 密钥 `appId`，以及我们想要使用的\
  \ `units` 类型。你可以在 https://openweathermap.org/current#data 了解更多关于支持的单位的信息。\n\n**提示**\n\
  \n我们使用 `set` 方法来创建查询参数，因为 `HttpParams` 对象是不可变的。为你想要传递的每个参数调用构造函数将抛出错误。\n\n我们还在 `get`\
  \ 方法中将响应数据的类型设置为 `Weather`。请注意，`getWeather` 方法不返回 `Weather` 数据，而是返回此类型的 `Observable`。\n\
  \n7. 在文件顶部添加以下导入语句：\n\n```typescript\nimport { HttpClient, HttpParams } from '@angular/common/http';\n\
  import { Injectable } from '@angular/core';\nimport { Observable } from 'rxjs';\n\
  import { environment } from '../environments/environment';\nimport { Weather } from\
  \ './weather';\n```\n\n我们创建的 Angular 服务包含与 OpenWeather API 交互所需的所有工件。在下一节中，我们将创建一个\
  \ Angular 组件，用于发起请求并显示来自该 API 的数据。\n\n## 显示城市的天气信息\n\n用户应该能够使用我们应用程序的 UI，并输入他们想要查看天气详情的城市名称。应用程序将使用该信息查询\
  \ OpenWeather API，请求的结果将使用卡片布局显示在 UI 上。让我们开始构建一个 Angular 组件来创建所有这些类型的交互：\n\n1. 使用\
  \ Angular CLI 的 generate 命令创建一个 Angular 组件：\n\n```\nng generate component weather\n\
  ```\n\n2. 打开主组件的模板 `app.component.html`，将其内容替换为新组件的选择器 `app-weather`：\n\n```\n<app-weather></app-weather>\n\
  ```\n\n3. 打开 `app.module.ts` 文件，并将 Angular Material 库中的以下模块添加到 `@NgModule` 装饰器的\
  \ `imports` 数组中：\n\n```typescript\n@NgModule({\n  declarations: [\n    AppComponent,\n\
  \    WeatherComponent\n  ],\n  imports: [\n    BrowserModule,\n    BrowserAnimationsModule,\n\
  \    HttpClientModule,\n    MatIconModule,\n    MatInputModule,\n    MatCardModule\n\
  \  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\n```\n\n同时，在文件顶部添加必要的导入语句：\n\
  \n```typescript\nimport { MatCardModule } from '@angular/material/card';\nimport\
  \ { MatIconModule } from '@angular/material/icon';\nimport { MatInputModule } from\
  \ '@angular/material/input';\n```\n\n4. 打开 `weather.component.ts` 文件，创建一个 `Weather`\
  \ 类型的 `weather` 属性，并将 `WeatherService` 注入到 `WeatherComponent` 类的构造函数中：\n\n```typescript\n\
  import { Component, OnInit } from '@angular/core';\n\nimport { Weather } from '../weather';\n\
  import { WeatherService } from '../weather.service';\n\n@Component({\n  selector:\
  \ 'app-weather',\n  templateUrl: './weather.component.html',\n  styleUrls: ['./weather.component.scss']\n\
  })\nexport class WeatherComponent implements OnInit {\n\n  weather: Weather | undefined;\n\
  \n  constructor(private weatherService: WeatherService)\n  { }\n\n  ngOnInit():\
  \ void {\n  }\n}\n```\n\n5. 创建一个组件方法，订阅 `WeatherService` 的 `getWeather` 方法，并将结果赋值给\
  \ `weather` 组件属性：\n\n```typescript\nsearch(city: string) {\n  this.weatherService.getWeather(city).subscribe(weather\n\
  \    => this.weather = weather);\n}\n```\n\n我们已经完成了组件 TypeScript 类文件的工作。让我们将其与模板连接起来。打开\
  \ `weather.component.html` 文件，并将其内容替换为以下 HTML 代码：\n\n### weather.component.html\n\
  \n```html\n<mat-form-field>\n  <input matInput placeholder=\"Enter city\" #cityCtrl\n\
  \    (keydown.enter)=\"search(cityCtrl.value)\">\n  <mat-icon matSuffix\n    (click)=\"\
  search(cityCtrl.value)\">search</mat-icon>\n</mat-form-field>\n<mat-card *ngIf=\"\
  weather\">\n  <mat-card-header>\n    <mat-card-title>{{weather.name}},\n      {{weather.sys.country}}</mat-card-title>\n\
  \    <mat-card-subtitle>{{weather.weather[0].main}}\n    </mat-card-subtitle>\n\
  \  </mat-card-header>\n  <img mat-card-image\n    src=\"https://openweathermap.org/img/wn/\n\
  \      {{weather.weather[0].icon}}@2x.png\"\n    [alt]=\"weather.weather[0].main\"\
  >\n  <mat-card-content>\n    <h1>{{weather.main.temp | number:'1.0-0'}} &#8451;</h1>\n\
  \    <p>Pressure: {{weather.main.pressure}} hPa</p>\n    <p>Humidity: {{weather.main.humidity}}\
  \ %</p>\n    <p>Wind: {{weather.wind.speed}} m/s</p>\n  </mat-card-content>\n</mat-card>\n\
  ```\n\n前面的模板由 Angular Material 库中的几个组件组成，包括一个 `mat-form-field` 组件，它包含以下子元素：\n\n\
  - 一个用于输入城市名称的 input HTML 元素。当用户完成编辑并按下 *Enter* 键时，它调用 `search` 组件方法，并将 `cityCtrl`\
  \ 变量的 `value` 属性作为参数传递。`cityCtrl` 变量是一个**模板引用变量**，表示原生 HTML `input` 元素的实际对象。\n-\
  \ 一个 `mat-icon` 组件显示一个*放大镜*图标，并由 `matSuffix` 指令指示位于输入元素的末尾。它还在被点击时调用 `search` 组件方法。\n\
  \n> > **重要提示**\n> > `cityCtrl` 模板引用变量由 # 表示，并且可以在组件的模板内的任何位置访问。\n\n一个 `mat-card`\
  \ 组件以卡片布局呈现信息，并且仅在 `weather` 组件属性有值时显示。它由以下子元素组成：\n\n- `mat-card-header`：卡片的头部。它由一个显示城市名称和国家代码的\
  \ `mat-card-title` 组件，以及一个显示当前天气状况的 `mat-card-subtitle` 组件组成。\n- `mat-card-image`：卡片的图像，显示天气状况的图标，并带有描述作为替代文本。\n\
  - `mat-card-content`：卡片的主要内容。它显示当前天气的温度、气压、湿度和风速。温度不显示任何小数点，如 `number` 管道所示。\n\n\
  现在让我们通过向组件添加一些样式来增添一些趣味：\n\n### **weather.component.scss**\n\n```scss\n:host {\n\
  \  display: flex;\n  align-items: center;\n  justify-content: center;\n  flex-direction:\
  \ column;\n  padding-top: 25px;\n}\n\nmat-form-field {\n  width: 20%;\n}\n\nmat-icon\
  \ {\n  cursor: pointer;\n}\n\nmat-card {\n  margin-top: 30px;\n  width: 250px;\n\
  }\n\nh1 {\n  text-align: center;\n  font-size: 2.5em;\n}\n```\n\n`:host` 选择器是一个\
  \ Angular 独有的 CSS 选择器，它针对承载我们组件的 HTML 元素，在我们的例子中，是 `app-weather` HTML 元素。\n\n如果我们使用\
  \ `ng serve` 运行我们的应用程序，导航到 `http://localhost:4200`，并搜索 **Athens** 的天气信息，我们应该在屏幕上得到以下输出：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_125_0.png)\n\n恭喜！此时，你已经拥有一个完全可用的 Angular\
  \ 应用程序，可以显示特定城市的天气信息。该应用程序由一个 Angular 组件组成，该组件通过 HTTP 使用 Angular 服务与 OpenWeather\
  \ API 通信。我们学习了如何使用 Angular Material 为我们的组件设置样式，并为我们的用户提供愉快的应用体验。但是当我们离线时会发生什么？应用程序是否按预期工作？用户体验是否保持不变？让我们在下一节中一探究竟。\n\
  \n## 使用 Service Worker 启用离线模式\n\n来自任何地方的用户现在都可以访问我们的 Angular 应用程序，以获取他们感兴趣的任何城市的天气信息。当我们说*任何地方*时，我们指的是任何网络类型，例如宽带、蜂窝（3G/4G/5G）和\
  \ Wi-Fi。考虑用户处于覆盖范围低或网络频繁中断的地方的情况。我们的应用程序将如何表现？让我们通过进行一个实验来一探究竟：\n\n1. 使用 Angular\
  \ CLI 的 serve 命令运行 Angular 应用程序：\n\n   ```\n   ng serve\n   ```\n\n2. 打开你最喜欢的浏览器并导航到\
  \ `http://localhost:4200`，这是 Angular CLI 项目的默认地址和端口号。你应该看到用于输入城市名称的输入字段：\n\n   ![Enter\
  \ city input field](placeholder)\n   图 4.2 – 输入城市名称\n\n3. 打开浏览器的开发者工具，并导航到 **Network**\
  \ 选项卡。将 **Throttling** 下拉框的值设置为 **Offline**：\n\n   ![Network tab with Offline selected](placeholder)\n\
  \   图 4.3 – 离线网络模式\n\n\n\n\n4. 尝试刷新浏览器。您会看到一条表明您已断开互联网连接的提示，如以下截图所示：\n\n    ![](img/efea53d01337e7b223389b38dcdb0160_127_0.png)\n\
  \n    图4.4 – 无互联网连接 (Google Chrome)\n\n以上情况在互联网连接质量较差的地区相当普遍。那么，我们能为这些地区的用户做些什么呢？幸运的是，Angular\
  \ 框架包含一个 Service Worker 的实现，它可以显著改善我们的应用在离线模式下的用户体验。它可以缓存应用的某些部分，并在无需发出真实请求的情况下提供相应内容。\n\
  \n> **提示**\n> Angular Service Worker 也可以用于网络延迟较大的环境。在这种网络中考虑使用 Service Worker 也能改善用户的体验。\n\
  \n运行以下 Angular CLI 命令，在我们的 Angular 应用中启用 Service Worker：\n\n```\nng add @angular/pwa\n\
  ```\n\n上述命令将相应地改造 Angular CLI 工作区以支持 PWA：\n\n- 它将 `@angular/service-worker` npm\
  \ 包添加到应用的 `package.json` 文件的 `dependencies` 部分。\n- 它在应用的 `src` 文件夹中创建 `manifest.webmanifest`\
  \ 文件。该清单文件包含将应用作为原生应用安装和运行所需的信息。它还会将该文件添加到 `angular.json` 文件中 `build` 选项的 `assets`\
  \ 数组中。\n- 它在项目根目录创建 `ngsw-config.json` 文件，即 Service Worker 配置文件。我们使用它来定义配置相关的产物，例如哪些资源被缓存以及如何缓存。您可以在以下链接找到有关\
  \ Service Worker 配置的更多详细信息：https://angular.io/guide/service-worker-config#service-worker-configuration。\n\
  \n    该配置文件还会在 `angular.json` 文件的 `build` 配置的 `ngswConfigPath` 属性中进行设置。\n\n- 它将\
  \ `angular.json` 文件的 `build` 配置中的 `serviceWorker` 属性设置为 `true`。\n- 它在 `app.module.ts`\
  \ 文件中注册 Service Worker：\n\n    ```typescript\n    import { ServiceWorkerModule }\
  \ from '@angular/service-worker';\n    import { environment } from '../environments/environment';\n\
  \n    @NgModule({\n      declarations: [\n        AppComponent,\n        WeatherComponent\n\
  \      ],\n      imports: [\n        BrowserModule,\n        BrowserAnimationsModule,\n\
  \        HttpClientModule,\n        MatIconModule,\n        MatInputModule,\n  \
  \      MatCardModule,\n        ServiceWorkerModule.register('ngsw-worker.js', {\n\
  \          enabled: environment.production,\n          // Register the ServiceWorker\
  \ as soon as the app is\n          // stable\n          // or after 30 seconds (whichever\
  \ comes first).\n          registrationStrategy: 'registerWhenStable:30000'\n  \
  \      })\n      ],\n      providers: [],\n      bootstrap: [AppComponent]\n   \
  \ })\n    ```\n\n`ngsw-worker.js` 文件是包含 Service Worker 实际实现的 JavaScript 文件。当我们以生产模式构建应用时，它会自动为我们创建。Angular\
  \ 使用 `ServiceWorkerModule` 类的 `register` 方法在我们的应用中注册它。\n\n- 它创建了几个图标，供应用作为原生应用安装到用户设备时使用。\n\
  - 它在 `index.html` 文件的头部包含了清单文件和一个用于主题颜色的 meta 标签：\n\n    ```\n    <link rel=\"manifest\"\
  \ href=\"manifest.webmanifest\">\n    <meta name=\"theme-color\" content=\"#1976d2\"\
  >\n    ```\n\n现在我们已经完成了 Service Worker 的安装，是时候测试它了！在继续之前，我们应该安装一个外部 web 服务器，因为 Angular\
  \ CLI 的内置功能无法与 Service Worker 一起工作。一个不错的选择是 http-server：\n\n1. 运行 npm 客户端的安装命令来安装\
  \ http-server：\n\n    ```\n    npm install -D http-server\n    ```\n\n    上述命令将\
  \ http-server 作为我们 Angular CLI 项目的开发依赖安装。\n\n2. 使用 Angular CLI 的构建命令构建 Angular 应用：\n\
  \n    ```\n    ng build\n    ```\n\n3. 打开 Angular CLI 工作区的 `package.json` 文件，并将以下条目添加到\
  \ `scripts` 属性中：\n\n    ```json\n    \"scripts\": {\n        \"ng\": \"ng\",\n \
  \       \"start\": \"ng serve\",\n        \"build\": \"ng build\",\n        \"watch\"\
  : \"ng build --watch --configuration development\",\n        \"test\": \"ng test\"\
  ,\n        \"server\": \"http-server -p 8080 -c-1 dist/weather-app\"\n    }\n  \
  \  ```\n\n4. 使用以下命令启动 HTTP web 服务器：\n\n    ```bash\n    npm run server\n    ```\n\
  \n    上述命令将在 8080 端口启动 `http-server`，并禁用缓存。\n\n5. 打开浏览器并导航到 `http://localhost:8080`。\n\
  \n    > **提示**\n    >\n    > 最好在隐私或隐身模式下打开页面，以避免 Service Worker 的意外行为。\n\n6. 重复我们在本节开头采取的切换到离线模式的过程。\n\
  \n7. 如果现在刷新页面，您会注意到应用运行正常。\n\nService Worker 为我们完成了所有工作，这个过程非常透明，我们甚至无法分辨自己是在线还是离线。您可以通过检查**网络**选项卡来验证这一点：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_130_0.png)\n\n图4.5 – Service Worker（离线模式）\n\
  \n**大小**列中的（**ServiceWorker**）值表明 Service Worker 提供了我们应用的缓存版本。\n\n现在我们已经成功安装了 Service\
  \ Worker，并朝着将应用转换为 PWA 的目标又迈进了一步。在下一节中，我们将学习如何通知应用用户潜在更新。\n\n## 通过应用内通知保持最新\n\n\
  当我们想要对 Web 应用进行更改时，我们会做出更改并构建应用的新版本。然后应用被部署到 Web 服务器上，每个用户都可以立即访问新版本。但 PWA 应用并非如此。\n\
  \n当我们部署 PWA 应用的新版本时，Service Worker 必须相应地执行特定的更新策略。它应该要么通知用户有新版本，要么立即安装新版本。我们采用哪种更新策略取决于我们的需求。在本项目中，我们想向用户显示一个提示，让他们决定是否要更新。让我们看看如何在我们的应用中实现此功能：\n\
  \n1. 打开 `app.module.ts` 文件，并将 `MatSnackBarModule` 添加到 `@NgModule` 装饰器的 `imports`\
  \ 数组中：\n\n    ```typescript\n    import { MatSnackBarModule } from '@angular/material/snack-bar';\n\
  \n    @NgModule({\n      declarations: [\n        AppComponent,\n        WeatherComponent\n\
  \      ],\n      imports: [\n        BrowserModule,\n        BrowserAnimationsModule,\n\
  \        HttpClientModule,\n        MatIconModule,\n        MatInputModule,\n  \
  \      MatCardModule,\n        MatSnackBarModule,\n        ServiceWorkerModule.register('ngsw-worker.js',\
  \ {\n          enabled: environment.production,\n          // Register the ServiceWorker\
  \ as soon as the app\n          // is stable\n          // or after 30 seconds (whichever\
  \ comes first).\n          registrationStrategy: 'registerWhenStable:30000'\n  \
  \      })\n      ],\n      providers: [],\n      bootstrap: [AppComponent]\n   \
  \ })\n    ```\n\n    MatSnackBarModule 是一个 Angular Material 模块，允许我们与 Snack Bar 交互。Snack\
  \ Bar 是一个弹出窗口，通常出现在页面底部，用于通知目的。\n\n2. 打开 `app.component.ts` 文件，并将 `OnInit` 接口添加到\
  \ `AppComponent` 类实现的接口中：\n\n    ```typescript\n    import { Component, OnInit }\
  \ from '@angular/core';\n\n    @Component({\n      selector: 'app-root',\n     \
  \ templateUrl: './app.component.html',\n      styleUrls: ['./app.component.scss']\n\
  \    })\n    export class AppComponent implements OnInit {\n      title = 'weather-app';\n\
  \    }\n    ```\n\n3. 在 `AppComponent` 类的构造函数中注入 `MatSnackBar` 和 `SwUpdate` 服务：\n\
  \n    ```typescript\n    import { Component, OnInit } from '@angular/core';\n  \
  \  import { MatSnackBar } from '@angular/material/snack-bar';\n    import { SwUpdate\
  \ } from '@angular/service-worker';\n\n    @Component({\n      selector: 'app-root',\n\
  \    ```\n\n```\ntemplateUrl: './app.component.html',\nstyleUrls: ['./app.component.scss']\n\
  })\nexport class AppComponent implements OnInit {\n  title = 'weather-app';\n\n\
  \  constructor(private updates: SwUpdate, private\n    snackbar: MatSnackBar) {}\n\
  }\n```\n\nMatSnackBar 服务是一个由 MatSnackBarModule 公开的 Angular 服务。SwUpdate 服务是 service\
  \ worker 的一部分，它包含一些可观察对象，我们可以用它们来获知应用的更新过程。\n\n+   4. 创建如下 ngOnInit 方法：\n\n```\n\
  ngOnInit() {\n  this.updates.available.pipe(\n    switchMap(() => this.snackbar.open('A\
  \ new version\n      is available!', 'Update now').afterDismissed(),\n    filter(result\
  \ => result.dismissedByAction),\n    map(() => this.updates.activateUpdate().then(()\
  \ =>\n      location.reload()))\n  ).subscribe();\n}\n```\n\nngOnInit 方法是 OnInit\
  \ 接口的实现方法，在组件初始化时被调用。SwUpdate 服务包含一个 available 可观察属性，当我们的应用有新版本可用时，我们可以通过它获得通知。通常我们会订阅可观察对象，但这里我们没有这样做。相反，我们订阅的是\
  \ pipe 方法，它是一个用于组合多个操作符的 RxJS 操作符。\n\n+   5. 在 app.component.ts 文件顶部添加以下 import\
  \ 语句：\n\n```\nimport { filter, map, switchMap } from 'rxjs/operators';\n```\n\n\
  我们前面定义的 pipe 方法内部发生了很多事情，所以让我们把它拆解开来进一步理解。pipe 操作符组合了三个 RxJS 操作符：\n\n+   - switchMap：当我们的应用有新版本可用时，这个方法会被调用。它使用\
  \ snackbar 属性的 open 方法显示一个带有操作按钮的 SnackBar，并订阅其 afterDismissed 可观察对象。当 SnackBar\
  \ 通过点击操作按钮或使用其 API 方法以编程方式关闭时，afterDismissed 可观察对象会发送值。\n+   - filter：当 SnackBar\
  \ 通过操作按钮关闭时，这个方法会被调用。\n+   - map：这个方法调用 updates 属性的 activateUpdate 方法来应用应用的新版本。应用更新完成后，它会重新加载浏览器窗口，使更改生效。\n\
  \n让我们实际看看更新到新版本的整个过程：\n\n+   1. 运行 Angular CLI 的 build 命令来构建 Angular 应用：\n+   2.\
  \ 启动 HTTP 服务器来提供应用服务：\n+   3. 打开浏览器的私密或无痕窗口，并导航到 http://localhost:8080。\n+   4.\
  \ 在不关闭浏览器窗口的情况下，让我们在应用中引入一处更改，并添加一个头部组件。运行 Angular CLI 的 generate 命令来创建一个组件：\n+\
  \   5. 打开 app.module.ts 文件，并导入几个 Angular Material 模块：\n\n```\nng build\n```\n\n\
  ```\nnpm run server\n```\n\n```\nng generate component header\n```\n\n```\nimport\
  \ { MatButtonModule } from '@angular/material/button';\n```\n\n```\nimport { MatToolbarModule\
  \ } from '@angular/material/toolbar';\n```\n\n```\n@NgModule({\n  declarations:\
  \ [\n    AppComponent,\n    WeatherComponent,\n```\n\n```\nHeaderComponent\n],\n\
  imports: [\n  BrowserModule,\n  BrowserAnimationsModule,\n  HttpClientModule,\n\
  \  MatIconModule,\n  MatInputModule,\n  MatCardModule,\n  MatSnackBarModule,\n \
  \ MatButtonModule,\n  MatToolbarModule,\n  ServiceWorkerModule.register('ngsw-worker.js',\
  \ {\n  enabled: environment.production,\n  // Register the ServiceWorker as soon\
  \ as the app is\n  // stable\n  // or after 30 seconds (whichever comes first).\n\
  \  registrationStrategy: 'registerWhenStable:30000'\n  })\n],\nproviders: [],\n\
  bootstrap: [AppComponent]\n}\n```\n\n6. 打开 header.component.html 文件，创建一个 mat-toolbar\
  \ 组件，其中包含两个 HTML button 元素，每个元素内都有一个 mat-icon 组件：\n\n```\n<mat-toolbar color=\"\
  primary\">\n  <span>Weather App</span>\n  <span class=\"spacer\"></span>\n  <button\
  \ mat-icon-button>\n    <mat-icon>refresh</mat-icon>\n  </button>\n  <button mat-icon-button>\n\
  \    <mat-icon>share</mat-icon>\n  </button>\n</mat-toolbar>\n```\n\n+   7. 将以下\
  \ CSS 样式添加到 header.component.scss 文件中，以将按钮定位到页眉的最右端：\n\n```\n.spacer {\n  flex:\
  \ 1 1 auto;\n}\n```\n\n+   8. 打开 app.component.html 文件，并在顶部添加 app-header 组件：\n\n\
  ```\n<app-header></app-header>\n<app-weather></app-weather>\n```\n\n+   9. 重复步骤\
  \ 1 和 2 来构建并启动应用。在已经打开的浏览器窗口中打开一个新标签页，几秒钟后，你会看到页面底部出现以下通知：\n\n![](img/efea53d01337e7b223389b38dcdb0160_136_0.png)\n\
  \n图 4.6 – 新版本通知\n\n+   10. 点击“Update now”按钮，等待浏览器窗口重新加载，然后你应该就能看到你的更改了：\n\n![](img/efea53d01337e7b223389b38dcdb0160_136_1.png)\n\
  \n图 4.7 – 应用输出\n\n我们的 Angular 应用已经开始转变为一个 PWA 应用。除了 Angular service worker 提供的缓存机制之外，我们还添加了一种用于安装应用新版本的机制。在下一节中，我们将学习如何部署我们的应用，并将其原生安装到我们的设备上。\n\
  \n## 使用 Firebase 托管部署我们的应用\n\nFirebase 是 Google 提供的一种托管解决方案，我们可以用它来部署 Angular 应用。Firebase\
  \ 团队投入了大量精力，创建了一个 Angular CLI schematic，以便只用一条命令即可部署 Angular 应用。在深入之前，让我们先学习如何设置\
  \ Firebase 托管：\n\n+   1. 使用 Google 账户登录 Firebase，网址为 `https://console.firebase.google.com`。\n\
  +   2. 点击 **添加项目** 按钮，以创建新的 Firebase 项目。\n+   3. 输入项目名称 `weather-app`，然后点击 **继续**\
  \ 按钮。\n\n> **重要说明**\n> \n> Firebase 会在项目名称下方为你的项目生成一个唯一标识符，例如 **weather-app-b11a2**。该标识符稍后将用于你项目的托管\
  \ URL。\n\n+   4. 为你的项目禁用 **Google Analytics**，然后点击 **创建项目** 按钮。\n+   5. 项目创建完成后，屏幕上将显示以下内容：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_137_0.png)\n\n图 4.8 – Firebase 项目创建\n\
  \n+   6. 点击 **继续** 按钮，你将被重定向到新 Firebase 项目的仪表盘。\n\n现在我们已经完成了 Firebase 托管的配置。是时候将它集成到我们的\
  \ Angular 应用中了。运行以下 Angular CLI 命令，在 Angular CLI 项目中安装 @angular/fire npm 包：\n\n\
  ```\nng add @angular/fire\n```\n\n前面的命令还会使用 Firebase 对你进行身份验证，并提示你选择一个 Firebase\
  \ 项目进行部署。使用方向键选择我们之前创建的 weather-app 项目，然后按 Enter 键。该过程会相应地修改 Angular CLI 工作区，以适应其到\
  \ Firebase 的部署：\n\n+   - 它会在项目的 package.json 文件中的 dependencies 和 devDependencies\
  \ 部分添加几个 npm 包。\n+   - 它会在根文件夹中创建一个 .firebaserc 文件，其中包含所选 Firebase 项目的详细信息。\n+ \
  \  - 它会在根文件夹中创建一个 firebase.json 文件，这就是 Firebase 配置文件：\n\n```\n{\n  \"hosting\":\
  \ [\n    {\n      \"target\": \"weather-app\",\n      \"public\": \"dist/weather-app\"\
  ,\n      \"ignore\": [\n        \"**/.*\"\n      ],\n      \"headers\": [\n    \
  \    {\n          \"source\": \"*.[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f].+(css|js)\"\
  ,\n          \"headers\": [\n            {\n              \"key\": \"Cache-Control\"\
  ,\n              \"value\": \"public,\n```\n\n```\nmax-age=31536000,immutable\"\n\
  }\n]\n}\n],\n\"rewrites\": [\n{\n\"source\": \"**\",\n\"destination\": \"/index.html\"\
  \n}\n]\n}\n]\n}\n```\n\n该配置文件指定了一些设置，例如 public 属性中所述的将要部署到 Firebase 的文件夹，以及通过 rewrites\
  \ 属性设置的重写规则。\n\n> **重要说明**\n> 默认情况下部署的文件夹是当我们运行 ng build 命令时由 Angular CLI 创建的 dist\
  \ 输出文件夹。\n\n+   - 它会在 angular.json 配置文件的 architect 部分添加一个 deploy 条目：\n\n```\n\"\
  deploy\": {\n\"builder\": \"@angular/fire:deploy\",\n\"options\": {}\n}\n```\n\n\
  要部署应用，我们只需运行一条 Angular CLI 命令，其余的工作由 Angular CLI 完成：\n\n```\nng deploy\n```\n\n\n\
  \n前面的命令将构建应用程序并开始将其部署到选定的 Firebase 项目。部署完成后，Angular CLI 将报告以下信息：\n\n- **项目控制台**：Firebase\
  \ 项目的仪表板。\n- **托管 URL**：已部署应用程序版本的 URL。它由 Firebase 项目的唯一标识符和 Firebase 自动添加的 `.web.app`\
  \ 后缀组成。\n\n> **重要说明**\n> 除用于开发的 **localhost** 外，服务工作线程要求应用程序通过 HTTPS 提供服务才能作为 PWA\
  \ 正常工作。Firebase 默认使用 HTTPS 托管 Web 应用程序。\n\n现在我们已经部署了应用程序，让我们看看如何将其作为 PWA 安装到我们的设备上：\n\
  \n1. 导航到托管 URL 并点击浏览器地址栏旁边的 **plus** 按钮：\n\n![](img/efea53d01337e7b223389b38dcdb0160_140_0.png)\n\
  \n图 4.9 – 安装应用程序（Google Chrome）\n\n> **重要说明**\n> 在其他浏览器中，**Install** 按钮可能位于不同的位置。\n\
  \n浏览器将提示我们安装 **weather-app** 应用程序。\n\n## 练习题\n\n让我们看几个练习题：\n\n1. Angular 中环境文件的用途是什么？\n\
  2. 我们如何在 HTTP 请求中传递查询参数？\n3. 我们如何从 HTTP get 方法获取结果？\n4. 我们为什么使用服务工作线程？\n5. 用于通知的\
  \ Angular Material 组件是什么？\n6. 我们如何获知服务工作线程的更新？\n7. pipe RxJS 操作符的主要用途是什么？\n8. 我们如何更改\
  \ PWA 应用程序的主题颜色？\n9. 我们在部署到 Firebase 时使用哪个 npm 包？\n10. 我们如何更改在 Firebase 中部署的文件夹？\n\
  \n## 进一步阅读\n\n在项目符号前添加此内容：\n\n- PWA: https://web.dev/progressive-web-apps/\n- OpenWeather\
  \ API: https://openweathermap.org/api\n- Angular Material: https://material.angular.io/\n\
  - Angular HTTP client: https://angular.io/guide/http\n- Angular service worker:\
  \ https://angular.io/guide/service-worker-getting-started\n- Communicating with\
  \ the Angular service worker: https://angular.io/guide/service-worker-communications\n\
  - HTTP server: https://www.npmjs.com/package/http-server\n- Firebase hosting: https://firebase.google.com/docs/hosting\n\

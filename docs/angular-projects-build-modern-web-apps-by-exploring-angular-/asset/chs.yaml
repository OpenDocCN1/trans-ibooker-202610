  \n## 在查看器上显示照片\n\n我们应用程序要准备好的下一步是在地图上显示我们的照片。我们将从 Firebase 获取所有照片并将它们添加到查看器中指定的位置。让我们看看如何实现这一点：\n\
  \n1. 使用 Ionic CLI 的以下命令创建一个新的 Angular 服务：\n\n```\nionic generate service cesium\n\
  ```\n\n2. 打开 `cesium.service.ts` 文件并添加以下导入语句：\n\n```\nimport { AngularFirestore\
  \ } from '@angular/fire/firestore';\nimport { Cartesian3, Color, PinBuilder, Viewer\
  \ } from 'cesium';\nimport { Observable } from 'rxjs';\nimport { map } from 'rxjs/operators';\n\
  import { Photo } from './photo';\n```\n\n3. 在 `CesiumService` 类的构造函数中注入 `AngularFirestore`\
  \ 服务并创建一个 `viewer` 属性，我们将用它来存储我们的 `Viewer` 对象：\n\n```\nexport class CesiumService\
  \ {\n\n  private viewer: Viewer;\n\n  constructor(private firestore: AngularFirestore)\
  \ { }\n}\n```\n\n4. 创建一个 `register` 方法来设置 `viewer` 属性：\n\n```\nregister(viewer:\
  \ Viewer) {\n  this.viewer = viewer;\n}\n```\n\n5. 创建一个方法来从 Cloud Firestore 获取照片集合：\n\
  \n```\nprivate getPhotos(): Observable<Photo[]> {\n  return this.firestore.collection<Photo>('photos')\n\
  \    .snapshotChanges().pipe(\n      map(actions => actions.map(a => a.payload.doc.data()\n\
  \        as Photo))\n}\n```\n\n```\n);\n}\n```\n\n在前面的方法中，我们调用 `snapshotChanges`\
  \ 方法来获取照片集合的数据。我们已经了解到集合由 `doc` 对象组成。因此，我们可以使用每个 `action` 对象的 `doc` 属性上的 `data`\
  \ 方法到达实际的照片对象。\n\n6. 创建以下方法以将所有照片添加到查看器：\n\n```\naddPhotos() {\n  const pinBuilder\
  \ = new PinBuilder();\n\n  this.getPhotos().subscribe(photos => {\n    photos.forEach(photo\
  \ => {\n      const entity = {\n        position: Cartesian3.fromDegrees(photo.lng,\
  \ photo.lat),\n        billboard: {\n          image: pinBuilder.fromColor(Color.fromCssColorString('#de6b45'),\
  \ 48).toDataURL()\n        },\n        description: `<img width=\"100%\" style=\"\
  margin:auto; display: block;\" src=\"${photo.url}\" />`\n      };\n      this.viewer.entities.add(entity);\n\
  \    });\n  });\n}\n```\n\n每个照片在查看器上的位置将显示为一个图钉。因此，我们首先需要初始化一个 `PinBuilder` 对象。前面的方法订阅\
  \ `getPhotos` 方法以从 Cloud Firestore 获取所有照片。对于每张照片，它创建一个 `entity` 对象，其中包含位置，即照片的度数位置，以及一个\
  \ `billboard` 属性，显示大小为 48 像素的图钉。它还定义了一个 `description` 属性，当我们单击图钉时将显示照片的实际图像。\n\n\
  \n\n\n每个实体对象都通过其 add 方法添加到查看器的实体集合中。\n\n7. 每个实体的描述都会显示在信息框内。打开包含应用程序全局样式的全局 .scss\
  \ 文件，并为信息框添加以下 CSS 样式：\n\n```\n.cesium-infoBox, .cesium-infoBox-iframe {\n  height:\
  \ 100% !important;\n  width: 100%;\n}\n```\n\n8. 现在，让我们从页面中使用 CesiumService。打开 view.page.ts\
  \ 文件，并将 CesiumService 类注入到 ViewPage 类的构造函数中：\n\n```\nimport { AfterViewInit, Component,\
  \ OnInit, ElementRef, ViewChild } from '@angular/core';\nimport { Viewer } from\
  \ 'cesium';\nimport { CesiumService } from '../cesium.service';\n\n@Component({\n\
  \  selector: 'app-view',\n  templateUrl: './view.page.html',\n  styleUrls: ['./view.page.scss'],\n\
  })\nexport class ViewPage implements OnInit, AfterViewInit {\n\n  @ViewChild('mapContainer')\
  \ content: ElementRef;\n\n  constructor(private cesiumService: CesiumService) {}\n\
  \n  ngOnInit() {\n  }\n\n  ngAfterViewInit() {\n    const viewer = new\n      Viewer(this.content.nativeElement);\n\
  \  }\n\n}\n```\n\n9. 修改 ngAfterViewInit 方法以注册查看器并添加照片：\n\n```\nngAfterViewInit()\
  \ {\n    this.cesiumService.register(new\n    Viewer(this.content.nativeElement));\n\
  \    this.cesiumService.addPhotos();\n}\n```\n\n我们现在已准备好在地图上查看照片：\n\n- 使用 `ionic\
  \ serve` 命令运行应用程序。\n- 使用应用程序拍摄一些漂亮的照片，最好是在不同的位置。\n- 从主菜单中选择 **查看图库** 选项，你应该会看到如下输出：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_207_0.png)\n\n图 6.22 – 地图上的照片\n\n4. 点击地图上的其中一个图钉，你应该会看到你的照片：\n\
  \n查看图库\n\n![](img/efea53d01337e7b223389b38dcdb0160_208_0.png)\n\n图 6.23 – 照片显示\n\
  \n我们现在拥有一个完整的移动应用程序，可以拍摄带有地理位置标记的照片并将其显示在地图上。我们了解了如何设置 CesiumJS 库以及如何从 Cloud Firestore\
  \ 获取照片。CesiumJS 查看器的 API 为我们提供了一种简单的方式来在地图上可视化我们的照片并与之交互。\n\n- 使用 Ionic 进行 Angular\
  \ 开发：https://ionicframework.com/docs/angular/overview\n- AngularFire 库文档：https://firebaseopensource.com/projects/angular/angularfire2/\n\
  - CesiumJS 快速入门指南：https://cesium.com/docs/tutorials/quick-start/\n- CesiumJS 和 Angular\
  \ 文章：https://cesium.com/blog/2018/03/12/cesium-and-angular/\n\n## 7 使用 Angular 为\
  \ GitHub 作品集构建 SSR 应用程序\n\n# 使用 Angular 为 GitHub 作品集构建 SSR 应用程序\n\n典型的 Angular 应用程序遵循**单页应用程序**（SPA）方法，其中每个页面都是在用户与应用程序交互时在浏览器的\
  \ DOM 中创建的。Web 服务器托管应用程序，并负责在应用程序启动时仅提供主页面（通常称为 `index.html`）。\n\n**服务器端渲染**（SSR）是一种与\
  \ SPA 完全不同的应用程序渲染技术。当页面在运行时被用户请求时，它使用服务器预渲染这些页面。在服务器上渲染内容可以极大地提升 Web 应用程序的性能，并增强其**搜索引擎优化**（SEO）能力。要在\
  \ Angular 应用程序中执行 SSR，我们使用一个名为 **Angular Universal** 的库。\n\n在本章中，我们将通过使用 **GitHub\
  \ API** 构建一个作品集应用程序，学习如何从 Angular Universal 中受益。我们将涵盖以下主题：\n\n- 使用 GitHub API 构建\
  \ Angular 应用程序\n- 集成 Angular Universal\n- 在构建期间预渲染内容\n- 增强 SEO 能力\n- 使用 preboot\
  \ 重放事件\n\n## 基本背景理论与上下文\n\nAngular 应用程序由多个页面组成，这些页面在我们使用应用程序时由 Angular 框架在浏览器的 DOM\
  \ 中动态创建。Angular Universal 使 Angular 框架能够在应用程序运行时在服务器上静态地创建这些页面。换句话说，它可以创建 Angular\
  \ 应用程序的完全静态版本，即使不需要启用 JavaScript 也能运行。在服务器上预渲染应用程序具有以下优点：\n\n- 它允许 Web 爬虫索引应用程序，使其在社交媒体网站上可被发现和链接。\n\
  - 它使应用程序可用于移动设备和其他无法在其端执行 JavaScript 的低性能设备。\n- 它通过快速加载首页，同时在后台加载实际的客户端页面来改善用户体验（**首次内容绘制（FCP）**）。\n\
  \n> **重要说明**\n> 在 FCP 期间，除了从 Angular 路由器的 `routerLink` 指令发起的导航事件外，应用程序不会响应用户事件。但是，我们可以使用一个名为\
  \ **preboot** 的特殊用途库在应用程序完全加载后重放这些事件。\n\nGitHub API 是一个用于与 GitHub 数据交互的 HTTP REST\
  \ API。它既可以公开使用，也可以使用开箱即用的身份验证机制以私有方式使用。\n\n> **重要说明**\n> \n> 对 GitHub API 的未授权请求限制为每小时\
  \ 60 次。有关可用身份验证方法的概述，你可以在 `https://docs.github.com/en/rest/overview/other-authentication-methods`\
  \ 找到更多详细信息。\n\n在 Angular 中通过 HTTP 进行通信时，我们使用 `@angular/common/http` npm 包中内置的 HTTP\
  \ 客户端。在 SSR 应用程序中与 HTTP 交互可能由于 FCP 时的页面预渲染而导致重复的 HTTP 请求。但是，Angular Universal 可以使用一种名为\
  \ **TransferState** 的机制来克服这种重复。\n\n## 项目概述\n\n在本项目中，我们将为我们的 GitHub 用户个人资料构建一个作品集应用程序。我们将首先使用\
  \ Angular CLI 来搭建一个与 GitHub API 交互的 Angular 应用程序。我们将学习如何使用 GitHub API 并获取特定于用户的数据。我们还将使用\
  \ **Bootstrap CSS** 库来为我们的应用程序设置样式，并创建一个漂亮的用户界面。\n\n在创建 Angular 应用程序后，我们将使用 Angular\
  \ Universal 将其转换为服务器端渲染的应用程序。我们将了解如何安装和配置 Angular Universal，并学习如何在构建期间预渲染它。然后，我们将配置我们的应用程序，以便在最流行的社交平台上使用\
  \ SEO 正确渲染。最后，我们将了解如何使用 preboot 库来重放 SSR 应用程序中不完全支持的浏览器事件。\n\n构建时间：2 小时\n\n## 开始\n\
  \n完成此项目需要以下先决条件和软件工具：\n\n- **GitHub 账户：** 一个有效的 GitHub 用户账户。\n- **Angular CLI：**\
  \ 一个用于 Angular 的 CLI，你可以在 `https://angular.io/cli` 找到它。\n- **GitHub 材料：** 本章的相关代码可以在\
  \ `https://github.com/PacktPublishing/Angular-Projects-Second-Edition` 的 Chapter07\
  \ 文件夹中找到。\n\n## 使用 GitHub API 构建 Angular 应用程序\n\nGitHub 包含一个 API，我们可以使用它来获取有关 GitHub\
  \ 用户个人资料的各种信息。我们正在构建的 Angular 应用程序将与 GitHub API 通信，并为我们的 GitHub 个人资料显示一个简短的作品集。我们的应用程序将包含以下功能：\n\
  \n- **仪表板：** 这将是应用程序的着陆页，它将显示我们 GitHub 个人资料的摘要。\n- **信息：** 这将显示关于我们的个人信息。\n- **仓库：**\
  \ 这将显示我们的*公开*仓库列表。\n- **组织：** 这将显示我们所属的 GitHub 组织列表。\n\n> **重要说明**\n> \n> 本章截图中显示的每个功能的输出结果将根据你的\
  \ GitHub 个人资料而有所不同。\n\n仪表板将是应用程序的主页面，它将包含所有其他功能。我们将在下一节中学习如何构建仪表板页面。\n\n## 构建仪表板\n\
  \n在我们可以开始创建应用程序的主要功能之前，我们需要先通过运行以下命令来搭建和配置 Angular 应用程序：\n\n```bash\nng new gh-portfolio\
  \ --routing=false --style=scss\n```\n\n前面的命令将使用 Angular CLI 的 `ng new` 命令，并传递以下选项：\n\
  \n- `gh-portfolio`：我们要创建的 Angular 应用程序的名称\n- `--routing=false`：禁用路由，因为我们的应用程序将由单个页面组成\n\
  - `--style=scss`：配置 Angular 应用程序在处理 CSS 样式时使用 SCSS 样式表格式\n\n\n\n\n我们将使用 Bootstrap\
  \ CSS 库来为我们的作品集应用设置样式。让我们看看如何在刚刚创建的 Angular CLI 应用中安装和配置它：\n\n- 1. 执行以下 npm 命令来安装\
  \ Bootstrap CSS 库：\n\n```\nnpm i bootstrap\n```\n\n- 2. 打开 `src\\styles.scss` 文件并导入\
  \ Bootstrap 的 SCSS 样式表：\n\n```\n@import \"~bootstrap/scss/bootstrap\";\n```\n\n\
  `styles.scss` 文件包含全局应用于应用的 CSS 样式。`@import` CSS 规则接受我们要加载的样式表文件的绝对路径。\n\n> **重要说明**\n\
  > 当我们使用 `@import` 规则导入样式表格式时，我们会省略文件的扩展名。\n\n`~` 字符表示 Angular CLI 应用根目录下的 `node_modules`\
  \ 文件夹。\n\n- 3. 执行以下命令来安装 Bootstrap Icons，这是一个免费开源的图标库：\n\n```\nnpm install bootstrap-icons\n\
  ```\n\nBootstrap Icons 可以使用多种格式，例如 SVG 或字体。在本项目中，我们将使用后者。\n\n- 4. 将 Bootstrap Icons\
  \ 库的字体图标格式导入到 `styles.scss` 文件中：\n\n```\n@import \"~bootstrap/scss/bootstrap\";\n\
  @import \"~bootstrap-icons/font/bootstrap-icons\";\n```\n\n我们已经创建了 Angular 应用，并添加了设置样式所需的必要资源。现在，我们准备开始创建\
  \ Angular 应用的主页面：\n\n- 1. 从 Angular 官方文档的新闻资料包（https://angular.io/presskit）中下载一个你喜欢的\
  \ Angular 徽标。\n- 2. 将下载的徽标文件复制到 Angular CLI 工作区的 `src\\assets` 文件夹中。`assets` 文件夹用于存放静态文件，例如图片、字体和\
  \ JSON 文件。\n\n- 3. 打开 `src\\environments` 文件夹中的 `environment.ts` 文件，并向 `environment`\
  \ 对象添加一个新属性：\n\n```typescript\nexport const environment = {\n  production: false,\n\
  \  username: '<Your GitHub login>'\n};\n```\n\n将 `username` 属性的值替换为你的 GitHub 登录名。`environment`\
  \ 对象用于定义应用级属性，例如配置设置或后端 API 的 URL。\n\n- 4. 打开同一文件夹中的 `environment.prod.ts` 文件，并添加与步骤\
  \ 3 相同的属性。当我们以生产模式运行 Angular CLI 应用时，会使用 `environment.prod.ts` 文件。`environment.ts`\
  \ 文件是默认文件，在开发模式中使用。\n\n> **重要说明**\n> 在所有环境文件中，`environment` 对象必须具有相同的结构和属性。\n\n\
  - 5. 打开 `app.component.ts` 文件，并在 `AppComponent` 类中创建一个属性，以从 `environment` 对象中获取\
  \ `username` 属性：\n\n```typescript\nimport { Component } from '@angular/core';\n\
  import { environment } from\n  '../environments/environment';\n\n@Component({\n\
  \  selector: 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.scss']\n\
  })\nexport class AppComponent {\n  username = environment.username;\n}\n```\n\n\
  > **重要说明**\n>\n> 我们从默认的环境文件中导入 `environment` 对象。Angular CLI 会根据我们当前运行的模式（开发或生产）将其替换为相应的环境文件。\n\
  \n- 6. 打开 `app.component.html` 文件，并将其内容替换为以下 HTML 模板：\n\n```html\n<div class=\"\
  toolbar d-flex align-items-center\">\n  <img width=\"40\" alt=\"Angular Logo\"\n\
  \       src=\"assets/angular.png\" />\n  <span>Welcome to my GitHub portfolio</span>\n\
  \  <a class=\"ms-auto p-2\" target=\"_blank\"\n     rel=\"noopener\" href=\"https://github.com/{{username}}\"\
  \n     title=\"GitHub\">\n    <i class=\"bi-github\"></i>\n  </a>\n</div>\n```\n\
  \n在前面的模板中，我们定义了应用的表头。它包含一个链接到我们 GitHub 个人资料的锚点元素。我们还使用 Bootstrap 图标集中的 `bi-github`\
  \ 类添加了 GitHub 图标。\n\n- 7. 在应用的表头之后插入以下 HTML 片段：\n\n```html\n<div class=\"content\
  \ d-flex flex-column\">\n  <div class=\"row\">\n    <div class=\"col-sm-3\"></div>\n\
  \    <div class=\"col-sm-9\">\n      <div class=\"row\">\n        <div class=\"\
  col-12 col-sm-12\"></div>\n      </div>\n      <div class=\"row\">\n        <div\
  \ class=\"col-12 col-sm-12\"></div>\n      </div>\n    </div>\n  </div>\n</div>\n\
  ```\n\n在前面的片段中，我们为应用的基本功能创建了容器元素。带有 `col-sm-3` 类选择器的元素将显示个人信息功能。带有 `col-sm-9` 类选择器的元素将被拆分为两行，分别用于仓库和组织功能。内容的最终布局将如下所示：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_218_0.png)\n\n图 7.1 – 主要内容\n\n- 8. 打开\
  \ `app.component.scss` 文件，并为应用的表头及内容添加以下 CSS 样式：\n\n```\n.toolbar {\n  height: 60px;\n\
  \  background-color: #1976d2;\n  color: white;\n  font-weight: 600;\n}\n\n.toolbar\
  \ img {\n  margin: 0 16px;\n}\n\n.toolbar i {\n  font-size: 1.5rem;\n  color: white;\n\
  \  margin: 0 16px;\n}\n\n.toolbar a {\n    margin-bottom: 5px;\n}\n\n.toolbar i:hover\
  \ {\n    opacity: 0.8;\n}\n\n.content {\n    margin: 52px auto 32px;\n    padding:\
  \ 0 16px;\n}\n```\n\n- 9. 运行 `ng serve` 启动应用，并导航至 http://localhost:4200。应用的表头应如下所示：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_219_0.png)\n\n图 7.2 – 应用表头\n\n我们作品集应用的主页面现已准备就绪。它包含一个表头和一个用于添加主要功能的空容器元素。在下一节中，我们将开始构建应用的个人信息功能。\n\
  \n## 显示个人信息\n\n我们应用的第一个功能将是显示来自我们 GitHub 个人资料的个人信息，例如全名、个人资料照片和一些社交媒体链接。在创建该功能之前，我们首先需要配置应用，以便它可以与\
  \ GitHub API 通信：\n\n- 1. 打开应用的主模块 `app.module.ts` 文件，并将 `HttpClientModule` 类添加到\
  \ `@NgModule` 装饰器的 `imports` 数组中：\n\n```\nimport { NgModule } from '@angular/core';\n\
  import { BrowserModule } from '@angular/platform-browser';\nimport { HttpClientModule\
  \ } from\n'@angular/common/http';\n\nimport { AppComponent } from './app.component';\n\
  \n@NgModule({\n  declarations: [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n\
  \    HttpClientModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\n\
  export class AppModule { }\n```\n\n`HttpClientModule` 类是内置 HTTP 库的主要 Angular 模块，它导出了与\
  \ HTTP 资源交互所需的所有服务。\n\n- 2. 使用以下 Angular CLI 命令创建一个新的 Angular 服务：\n\n```\nng generate\
  \ service github\n```\n\n- 3. 打开 `github.service.ts` 文件，并将 `HttpClient` 服务注入到 `GithubService`\
  \ 类的构造函数中：\n\n```\nimport { HttpClient } from '@angular/common/http';\nimport {\
  \ Injectable } from '@angular/core';\n\n@Injectable({\n  providedIn: 'root'\n})\n\
  export class GithubService {\n\n  constructor(private http: HttpClient) { }\n}\n\
  ```\n\n- 8. 打开 `personal-info.component.html` 文件，并将其内容替换为以下 HTML 模板：\n\n```html\n\
  <div class=\"card\" *ngIf=\"user$ | async as user\">\n  <img [src]=\"user.avatar_url\"\
  \ class=\"card-img-top\"\n       alt=\"{{user.name}} photo\">\n  <div class=\"card-body\"\
  >\n    <h5 class=\"card-title\">{{user.name}}</h5>\n    <p class=\"card-text\">{{user.bio}}</p>\n\
  \  </div>\n  <ul class=\"list-group list-group-flush\">\n    <li class=\"list-group-item\"\
  \ title=\"Location\">\n      <i class=\"bi-geo me-2\"></i>{{user.location}}\n  \
  \  </li>\n    <li class=\"list-group-item\" title=\"Followers\">\n      <i class=\"\
  bi-people me-2\"></i>{{user.followers}}\n    </li>\n  </ul>\n  <div class=\"card-body\"\
  >\n    <a href=\"https://www.twitter.com/{{user.twitter_username}}\" class=\"card-link\"\
  >Twitter</a>\n    <a [href]=\"user.blog\" class=\"card-link\">Personal blog</a>\n\
  \  </div>\n</div>\n```\n\n在前面的模板中，我们使用了 `async` 管道，因为 `user$` 属性是一个可观察对象，我们需要订阅它才能获取其值。`async`\
  \ 管道的主要优点是，当组件被销毁时，它会自动取消订阅该可观察对象，从而避免潜在的内存泄漏。\n\n我们还为可观察对象创建了 `user` 别名，以便在组件模板的各个位置轻松引用它。\n\
  \n- 9. 打开 `app.component.html` 文件，并将 `PersonalInfoComponent` 的选择器添加到带有 `col-sm-3`\
  \ 类选择器的元素中：\n\n```html\n<div class=\"col-sm-3\">\n  <app-personal-info></app-personal-info>\n\
  </div>\n```\n\n\n\n如果我们运行 `ng serve` 来预览应用，应该会在页面左侧看到个人信息面板：\n\n![](img/efea53d01337e7b223389b38dcdb0160_224_0.png)\n\
  \n图 7.3 – 个人信息\n\n我们作品集应用的第一个功能现已完成。它显示了 GitHub 个人资料中的个人信息，附带简短简介和一些社交网络链接。在下一节中，我们将构建应用的仓库功能。\n\
  \n## 列出用户仓库\n\nGitHub 用户资料包含用户拥有的仓库列表，称为**源仓库**（**sources**），以及用户贡献过的仓库，称为**分叉仓库**（**forks**）。我们应用的仓库功能将仅显示源仓库。\n\
  \n仓库和组织功能将具有类似的用户界面。因此，我们需要创建一个可用于这两个功能的组件：\n\n- 1. 执行以下 Angular CLI 命令创建一个新组件：\n\
  \n```bash\nng generate component panel\n```\n\n- 2. 打开 `panel.component.ts` 文件，使用\
  \ `@Input` 装饰器定义两个输入属性：\n\n```typescript\nimport { Component, Input, OnInit } from\
  \ '@angular/core';\n\n@Component({\n  selector: 'app-panel',\n  templateUrl: './panel.component.html',\n\
  \  styleUrls: ['./panel.component.scss']\n})\nexport class PanelComponent implements\
  \ OnInit {\n\n  @Input() caption: string = '';\n  @Input() icon: string = '';\n\n\
  \  constructor() { }\n\n  ngOnInit(): void {\n  }\n\n}\n```\n\n- 3. 打开 `panel.component.html`\
  \ 文件，将其内容替换为以下 HTML 模板：\n\n```html\n<div class=\"card mb-4\">\n  <div class=\"card-header\"\
  >\n    <i class=\"bi bi-{{icon}} me-1\"></i>\n```\n\n```typescript\nconstructor(private\
  \ http: HttpClient) {\n  this.userUrl = `${environment.apiUrl}/users/${environment.username}`;\n\
  }\n\ngetUser(): Observable<User> {\n  return this.http.get<User>(this.userUrl);\n\
  }\n}\n```\n\n5. 创建一个新方法，用于获取当前 GitHub 用户的仓库：\n\n```typescript\ngetRepos(): Observable<Repository[]>\
  \ {\n  return this.http.get<Repository[]>(this.userUrl +\n  '/repos');\n}\n```\n\
  \n现在我们已经完成了从 GitHub API 获取用户仓库的准备工作，可以开始构建显示这些仓库的组件了：\n\n1. 执行以下命令，使用 Angular CLI\
  \ 创建一个新的 Angular 组件：\n\n```bash\nng generate component repositories\n```\n\n2. 打开\
  \ `repositories.component.ts` 文件，添加以下导入语句：\n\n```typescript\nimport { Observable\
  \ } from 'rxjs';\nimport { map } from 'rxjs/operators';\nimport { GithubService\
  \ } from '../github.service';\nimport { Repository } from '../repository';\n```\n\
  \n3. 将 `GithubService` 注入 `RepositoriesComponent` 类的构造函数中，并创建一个组件属性来获取 `getRepos`\
  \ 方法的结果：\n\n```typescript\nexport class RepositoriesComponent implements OnInit\
  \ {\n\n  repos$: Observable<Repository[]> | undefined;\n\n  constructor(private\
  \ githubService: GithubService) {}\n```\n\n```typescript\nngOnInit(): void {\n \
  \ this.repos$ = this.githubService.getRepos().pipe(\n    map(repos => repos.filter(repo\
  \ => !repo.fork))\n  );\n}\n}\n```\n\n我们使用 `pipe` RxJS 操作符将 `getRepos` 方法返回的可观察对象与\
  \ `map` 操作符组合，以过滤掉分叉仓库，仅保留源仓库。过滤操作通过数组的标准 `filter` 方法完成。\n\n4. 打开 `repositories.component.html`\
  \ 文件，将其内容替换为以下 HTML 模板：\n\n```html\n<app-panel caption=\"Repositories\" icon=\"\
  archive\">\n  <div class=\"row row-cols-1 row-cols-md-3 g-4\">\n    <div class=\"\
  col p-2\" *ngFor=\"let repo of repos$ | async\">\n      <div class=\"card h-100\"\
  >\n        <div class=\"card-body\">\n          <h5 class=\"card-title\">\n    \
  \        <a [href]=\"repo.html_url\">{{repo.name}}</a>\n          </h5>\n      \
  \    <p class=\"card-text\">{{repo.description}}</p>\n        </div>\n      </div>\n\
  \    </div>\n  </div>\n</app-panel>\n```\n\n在上述模板中，我们将组件的主要内容包装在 `app-panel` 组件内，并设置标题和图标属性。\n\
  \n7. 运行 `ng serve` 预览应用，你应该会在个人信息功能旁边看到新的面板：\n\n![](img/efea53d01337e7b223389b38dcdb0160_230_0.png)\n\
  \n图 7.4 – 仓库\n\n我们应用的第二个功能已完成。它显示了 GitHub 个人资料中的公共仓库列表。我们的应用现在还有一个面板组件，我们可以在下一节中使用它来构建应用的组织功能。\n\
  \n## 可视化组织成员资格\n\nGitHub 用户可以是某个 GitHub 组织的成员。我们的应用将显示用户组织列表，并附带每个组织的一些附加信息。让我们开始构建组织列表：\n\
  \n- 1. 创建一个接口来定义组织的属性：\n\n```bash\nng generate interface organization\n```\n\n-\
  \ 2. 打开 `organization.ts` 文件，添加以下属性：\n\n```typescript\nexport interface Organization\
  \ {\n  login: string;\n  description: string;\n  avatar_url: string;\n}\n```\n\n\
  - 3. 打开 `github.service.ts` 文件，导入 `Organization` 接口：\n\n```typescript\nimport {\
  \ Organization } from './organization';\n```\n\n- 4. 创建一个新方法，用于获取当前 GitHub 用户的组织：\n\
  \n```typescript\ngetOrganizations(): Observable<Organization[]> {\n  return this.http.get<Organization[]>(this.userUrl\
  \ +\n    '/orgs');\n}\n```\n\n- 5. 执行以下命令，为我们的功能创建一个 Angular 组件：\n\n```bash\nng\
  \ generate component organizations\n```\n\n- 6. 打开 `organizations.component.ts`\
  \ 文件，添加以下导入语句：\n\n```typescript\nimport { Observable } from 'rxjs';\nimport { GithubService\
  \ } from '../github.service';\nimport { Organization } from '../organization';\n\
  ```\n\n- 7. 将 `GithubService` 注入 `OrganizationsComponent` 类的构造函数中，并将其 `getOrganizations`\
  \ 方法的结果设置为一个可观察的组件属性：\n\n```typescript\nexport class OrganizationsComponent implements\
  \ OnInit {\n\n  orgs$: Observable<Organization[]> | undefined;\n\n  constructor(private\
  \ githubService: GithubService) { }\n\n  ngOnInit(): void {\n    this.orgs$ =\n\
  \      this.githubService.getOrganizations();\n  }\n\n}\n```\n\n8. 打开 `organizations.component.html`\
  \ 文件，将其内容替换为以下 HTML 模板：\n\n```html\n<app-panel caption=\"Organizations\" icon=\"\
  diagram-3\">\n  <div class=\"list-group\">\n    <a href=\"https://www.github.com/{{org.login}}\"\
  \n      class=\"list-group-item list-group-item-action\"\n      *ngFor=\"let org\
  \ of orgs$ | async\">\n      <div class=\"row\">\n        <img [src]=\"org.avatar_url\"\
  >\n        <div class=\"col-sm-9\">\n          <div class=\"d-flex w-100 justify-content-between\"\
  >\n            <h5 class=\"mb-1\">{{org.login}}</h5>\n          </div>\n       \
  \   <p class=\"mb-1\">{{org.description}}</p>\n        </div>\n      </div>\n  \
  \  </a>\n  </div>\n</app-panel>\n```\n\n在上述 HTML 模板中，我们将组件的主要内容放在 `app-panel` 组件内，并传入适当的标题和图标。我们显示每个组织的名称和描述。每个组织都被包装在一个指向该组织\
  \ GitHub 页面的锚点元素中。\n\n9. 打开 `organizations.component.scss` 文件，为组织徽标添加以下 CSS 样式：\n\
  \n```css\nimg {\n  width: 60px;\n  height: 40px;\n}\n```\n\n10. 打开 `app.component.html`\
  \ 文件，在第二个带有 `col-12 col-sm-12` 类选择器的元素中添加 `OrganizationsComponent` 的选择器：\n\n```html\n\
  <div class=\"col-sm-9\">\n  <div class=\"row\">\n    <div class=\"col-12 col-sm-12\"\
  >\n      <app-repositories></app-repositories>\n    </div>\n  </div>\n  <div class=\"\
  row\">\n    <div class=\"col-12 col-sm-12\">\n      <app-organizations></app-organizations>\n\
  \    </div>\n  </div>\n</div>\n```\n\n11. 运行 `ng serve` 启动应用，你应该会在仓库功能下方看到组织列表：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_233_0.png)\n\n图 7.5 – 组织\n\n\n\n\n我们的应用程序现在为\
  \ GitHub 用户的个人资料提供了完整的作品集功能。它显示以下内容：\n\n- 个人信息、简短传记和社交媒体链接\n- 用户公开仓库的列表，其中包含指向每个仓库的链接以获取更多信息\n\
  - 用户所属组织的列表，其中包含指向每个组织的链接以查看更多详细信息\n\n在下一节中，我们将学习如何集成 Angular Universal 并在服务器上渲染我们的应用程序。\n\
  \n## 集成 Angular Universal\n\nAngular Universal 是一个 Angular 库，它使 Angular CLI 应用程序能够在服务器上渲染。SSR\
  \ 应用会提高 Angular 应用的加载速度，并改善首屏加载。\n\n要在现有的 Angular CLI 应用程序中安装 Angular Universal，我们将使用\
  \ Angular CLI 的以下命令：\n\n```\nng add @nguniversal/express-engine\n```\n\n前面的命令使用\
  \ Angular CLI 的 `ng add` 命令来安装 `@nguniversal/express-engine` npm 包。`@nguniversal/express-engine`\
  \ 包是 Angular Universal 库的核心，其核心是一个 **Node.js Express** Web 服务器。\n\n当我们执行上述命令安装 Angular\
  \ Universal 时，我们不仅在安装该库，还会使用以下文件修改我们的 Angular CLI 工作区：\n\n- `angular.json`：这会在 architect\
  \ 部分创建新条目，以构建和启用我们的 Angular Universal 应用程序。其中一个条目是 `server` 属性，它负责使用 SSR 构建我们的应用程序。它会将生成的\
  \ bundle 输出到 Angular CLI 应用标准输出文件夹内的单独 `server` 文件夹中：\n\n```\n\"options\": {\n \
  \ \"outputPath\": \"dist/gh-portfolio/server\",\n  \"main\": \"server.ts\",\n  \"\
  tsConfig\": \"tsconfig.server.json\",\n  \"inlineStyleLanguage\": \"scss\"\n}\n\
  ```\n\n原始应用程序的 bundle 现在会生成到标准输出文件夹内的 browser 文件夹中：\n\n```\n\"options\": {\n  \"\
  outputPath\": \"dist/gh-portfolio/browser\",\n  \"index\": \"src/index.html\",\n\
  \  \"main\": \"src/main.ts\",\n  \"polyfills\": \"src/polyfills.ts\",\n  \"tsConfig\"\
  : \"tsconfig.app.json\",\n  \"inlineStyleLanguage\": \"scss\",\n  \"assets\": [\n\
  \    \"src/favicon.ico\",\n    \"src/assets\"\n  ],\n  \"styles\": [\n    \"src/styles.scss\"\
  \n  ],\n  \"scripts\": []\n}\n```\n\n因此，Angular Universal 应用程序会生成同一 Angular 应用的两个版本：一个用于服务器，另一个用于浏览器。\n\
  \n- `package.json`：这会添加所有必要的 npm 依赖，并创建一组 npm 脚本，用于开始使用 Angular Universal 构建：\n\n\
  ```\n\"scripts\": {\n  \"ng\": \"ng\",\n  \"start\": \"ng serve\",\n  \"build\"\
  : \"ng build\",\n  \"watch\": \"ng build --watch --configuration development\",\n\
  \  \"test\": \"ng test\",\n  \"dev:ssr\": \"ng run gh-portfolio:serve-ssr\",\n \
  \ \"serve:ssr\": \"node dist/gh-portfolio/server/main.js\",\n  \"build:ssr\": \"\
  ng build && ng run gh-portfolio:server\",\n  \"prerender\": \"ng run gh-portfolio:prerender\"\
  \n}\n```\n\n包含 :ssr 后缀的脚本与构建和提供 Angular Universal 应用程序有关。prerender 脚本将在构建期间创建 Angular\
  \ 应用的预渲染版本。我们将在“在构建期间预渲染内容”一节中了解 prerender 脚本。\n\n- `server.ts`：这包含 Node.js Express\
  \ 应用程序，它将托管我们作品集的服务器端渲染版本。\n- `main.server.ts`：这是我们 Angular Universal 应用程序的主入口点。\n\
  - `app.server.module.ts`：这是服务器端渲染应用程序的主应用模块。\n- `tsconfig.server.json`：这是我们 Angular\
  \ Universal 应用程序的 TypeScript 配置。\n- `main.ts`：我们 Angular 应用的主入口点仅在 DOM 完全加载后才加载主应用模块：\n\
  \n```\ndocument.addEventListener('DOMContentLoaded', () => {\n  platformBrowserDynamic().bootstrapModule(AppModule)\n\
  \    .catch(err => console.error(err));\n});\n```\n\n- `app.module.ts`：这调用 BrowserModule\
  \ 的 withServerTransition 方法，将我们的应用程序作为服务器端渲染的应用加载：\n\n```\n@NgModule({\n  declarations:\
  \ [\n    AppComponent,\n    PersonalInfoComponent,\n    PanelComponent\n    RepositoriesComponent,\n\
  \    OrganizationsComponent\n  ],\n  imports: [\n    BrowserModule.withServerTransition({\
  \ appId:\n      'serverApp' }),\n    HttpClientModule\n  ],\n  providers: [],\n\
  ```\n\n```\nbootstrap: [AppComponent]\n})\nexport class AppModule { }\n```\n\n>\
  \ **重要提示**\n> 在服务器上渲染 Angular 应用时，由于没有浏览器，`window` 和 `document` 等全局 JavaScript 对象不可用。Angular\
  \ 为其中一些对象提供了抽象 API，例如 `DOCUMENT` 注入令牌。如果您需要按条件启用它们，可以注入 `PLATFORM_ID` 令牌，并使用 `@angular/common`\
  \ npm 包中的 `isPlatformServer` 或 `isPlatformBrowser` 方法来检查您的应用程序当前运行在哪个平台上：\n\n```\n\
  import { Inject, PLATFORM_ID } from '@angular/core';\nimport { isPlatformBrowser\
  \ } from '@angular/common';\n\nexport class CheckPlatformComponent {\n  isBrowser:\
  \ boolean;\n\n  constructor( @Inject(PLATFORM_ID) platformId: any) {\n    this.isBrowser\
  \ = isPlatformBrowser(platformId);\n  }\n}\n```\n\n现在我们可以使用以下 npm 命令在服务器上运行我们的 GitHub\
  \ 作品集应用：\n\n```\nnpm run dev:ssr\n```\n\n要在服务器上预览您的 GitHub 作品集应用，请在浏览器中打开 http://localhost:4200。\n\
  \n通常情况下，您会看到与之前一样的应用。那么，我们在这里获得了什么呢？Angular Universal 应用在功能强大的处理器和大内存的开发机上运行时，并不会展现出全部潜力。相反，我们需要在真实场景（如慢速网络）中运行和预览它们。我们可以使用\
  \ **Google Chrome 开发者工具** 在开发环境中模拟慢速网络：\n\n- 1. 打开 Google Chrome 浏览器。\n- 2. 切换开发者工具并选择\
  \ **网络** 选项卡。\n- 3. 从 **节流** 下拉菜单中选择 **慢速 3G** 选项。\n- 4. 在浏览器地址栏中输入 `http://localhost:4200`。\n\
  \n如果在页面加载时点击任何链接，您会注意到没有任何反应。这是为什么呢？服务器首先加载应用的一个静态版本显示给用户，同时在后台等待实际的 Angular 应用加载。在此\
  \ FCP 期间，除 `routerLink` 指令外，所有链接都没有响应。当 Angular Universal 在后台完全加载后，它会切换到完整应用。\n\n\
  稍后，在 *使用 preboot 重放事件* 一节中，我们将了解如何处理这些事件。与此同时，我们将在下一节中研究如何使用预渲染来进一步提高应用程序的加载速度。\n\
  \n## 在构建期间预渲染内容\n\n我们的 Angular CLI 工作区的 `package.json` 文件包含 prerender npm 脚本，我们可以使用它来改善应用程序的首次加载。该脚本会运行\
  \ `angular.json` 配置文件中 architect 部分的 prerender 命令，并在构建期间预渲染应用程序的内容。让我们看看预渲染会对我们的\
  \ GitHub 作品集应用产生什么效果：\n\n- 1. 执行以下 npm 命令以生成应用的预渲染版本：\n\n```\nnpm run prerender\n\
  ```\n\n> **重要提示**\n> \n> 生产环境文件中的 username 和 apiUrl 属性应该正确设置。否则，该命令将在 VSCode 的终端窗口中输出错误。\n\
  \n上述命令会将应用程序的生产版 bundle 输出到 `dist\\gh-portfolio\\browser` 文件夹中。\n\n- 2. 导航到 `dist\\\
  gh-portfolio\\browser` 文件夹，您应该会看到两个 HTML 文件：`index.html` 和 `index.original.html`\
  \ 文件。\n- 3. 打开 `index.original.html` 文件并找到 `app-root` HTML 元素。这是我们 Angular 应用的主组件，Angular\
  \ 将在浏览器中渲染我们应用的内容。\n\n\n\n\n\n-   4. 打开 `index.html` 文件，再次查看 `app-root` 元素。\n\n\
  这次主组件不是空的了。Angular Universal 已经向 GitHub API 发出了所有 HTTP 请求，并在运行时预获取了应用的内容。所有组件模板和样式都已预渲染到主\
  \ HTML 文件中，这实质上意味着即使不启用 JavaScript，我们也可以在浏览器中查看应用！\n\n-   5. 执行以下命令，启动我们的 GitHub\
  \ 作品集应用的预渲染版本：\n\n```\nnpm run serve:ssr\n```\n\n上述命令将在 http://localhost:4000 启动应用。\n\
  \n-   6. 在浏览器设置中禁用 JavaScript，然后访问 http://localhost:4000。\n\n我们创建的 GitHub 作品集应用在未启用\
  \ JavaScript 的情况下仍能完全正常运行。应用的主页面也能即时渲染，用户无需等待应用加载。\n\n上述场景非常适合那些无法在设备上启用 JavaScript\
  \ 的用户。但是，当启用了 JavaScript 的用户使用同一个预渲染版本的应用时，会发生什么呢？让我们进一步了解：\n\n-   1. 在浏览器中启用 JavaScript，并切换开发者工具。\n\
  \n-   2. 访问 http://localhost:4000。乍一看似乎没有任何变化。不过，由于预渲染内容的存在，应用会立即加载。\n\n-   3. 检查\
  \ Network 标签页，你会注意到以下内容：\n\n![](img/efea53d01337e7b223389b38dcdb0160_239_0.png)\n\
  \n图 7.6 – Network 标签页（Google Chrome）\n\n我们的应用会向 GitHub API 发起所有 HTTP 请求，就像它是从浏览器渲染出来的一样。它实质上重复了应用所需的所有\
  \ HTTP 请求，即使数据已经预渲染在 HTML 页面中。这是为什么呢？\n\n应用会为浏览器渲染版本发起一个 HTTP 请求，并为 SSR 应用发起另一个请求，因为这两个版本的状态不同。我们可以通过在服务器和浏览器之间共享状态来避免上述行为。更具体地说，我们可以使用\
  \ Angular Universal 库中一个名为 TransferHttpCacheModule 的专用 Angular 模块，将服务器状态传输到浏览器。\n\
  \n如果我们使用 TransferHttpCacheModule，服务器将缓存来自 GitHub API 的响应，浏览器将使用缓存而不是发起新请求。TransferHttpCacheModule\
  \ 通过在 Angular 应用中安装一个 HTTP 拦截器来解决该问题，该拦截器会忽略服务器最初已处理过的 HTTP 请求。\n\n> **重要说明**\n\
  > HTTP 拦截器是一种 Angular 服务，用于拦截源自 Angular 框架内置 HTTP 客户端的 HTTP 请求和响应。\n\n要在我们的 GitHub\
  \ 作品集应用中安装 TransferHttpCacheModule，请按照以下步骤操作：\n\n-   1. 打开 Angular 应用的主模块文件 `app.module.ts`，并从\
  \ @nguniversal/common npm 包中导入 TransferHttpCacheModule：\n\n```\nimport { TransferHttpCacheModule\
  \ } from '@nguniversal/common';\n```\n\n-   2. 将 TransferHttpCacheModule 类添加到 @NgModule\
  \ 装饰器的 imports 数组中：\n\n```\n@NgModule({\n  declarations: [\n    AppComponent,\n\
  \    PersonalInfoComponent,\n    PanelComponent,\n    RepositoriesComponent,\n \
  \   OrganizationsComponent\n],\nimports: [\n  BrowserModule.withServerTransition({\
  \ appId:\n  'serverApp' }),\n  HttpClientModule,\n  TransferHttpCacheModule\n],\n\
  providers: [],\nbootstrap: [AppComponent]\n})\n```\n\n-   3. 打开 SSR 应用的主模块文件 `app.server.module.ts`，并从\
  \ @angular/platform-server npm 包中导入 ServerTransferStateModule：\n\n```\nimport {\
  \ ServerModule, ServerTransferStateModule }\nfrom '@angular/platform-server';\n\
  ```\n\n-   4. 将 ServerTransferStateModule 类添加到 @NgModule 装饰器的 imports 数组中：\n\n```\n\
  @NgModule({\n  imports: [\n    AppModule,\n    ServerModule,\n    ServerTransferStateModule\n\
  \  ],\n  bootstrap: [AppComponent],\n})\n```\n\n-   5. 执行以下命令来预渲染你的应用：\n\n```\n\
  npm run prerender\n```\n\n-   6. 运行以下命令来启动你预渲染后的应用：\n\n```\nnpm run serve:ssr\n\
  ```\n\n如果你预览作品集应用并检查浏览器的 **Network** 标签页，你会注意到它不会发起额外的 HTTP 请求。`TransferHttpCacheModule`\
  \ 拦截了所有 HTTP 请求，并将它们存储在我们应用的 `TransferState` 存储中。TransferState 是一个键值存储，可以从服务器传输到浏览器。应用的浏览器版本之后可以直接从存储中读取\
  \ HTTP 响应，而无需额外发起调用。\n\n我们现在拥有了 GitHub 作品集的完整预渲染版本。但如何进一步优化，以便能在社交媒体平台上分享呢？我们将在下一节中了解更多\
  \ SEO 优化技术。\n\n## 增强 SEO 能力\n\n**SEO** 是优化网站以便被网络爬虫正确索引的过程。网络爬虫是一种专用软件，存在于大多数搜索引擎中，能够识别网站并为其建立索引，使其易于通过搜索引擎平台被发现和链接。\n\
  \nAngular Universal 通过在构建时预渲染内容，在 SEO 方面做得非常出色。有些网络爬虫无法执行 JavaScript，也无法构建 Angular\
  \ 应用的动态内容。使用 Angular Universal 进行预渲染消除了对 JavaScript 的需求，从而使网络爬虫能够尽其所能识别 Web 应用。\n\
  \n我们还可以通过在 Angular 应用的主 `index.html` 文件的 `head` 元素中定义几个标签来帮助 SEO，例如 `title`、`viewport`\
  \ 和 `charset`：\n\n## index.html\n\n```\n<!doctype html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"utf-8\">\n  <title>GhPortfolio</title>\n  <base href=\"/\">\n\
  \  <meta name=\"viewport\" content=\"width=device-width,\n    initial-scale=1\"\
  >\n  <link rel=\"icon\" type=\"image/x-icon\" href=\"favicon.ico\">\n</head>\n<body>\n\
  \n<app-root></app-root>\n</body>\n</html>\n```\n\n你可以在 https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta/name\
  \ 找到可用标签的列表。\n\n然而，仅在 index.html 文件中设置标签并不足够，尤其是当 Angular 应用启用了路由并包含多个路由时。Angular\
  \ 框架提供了几个方便的服务，我们可以用它们以编程方式设置标签。首先，让我们看看如何在应用中设置 title 标签：\n\n-   1. 打开 `app.component.ts`\
  \ 文件，并导入 Title 和 OnInit 这两个 Angular 构件：\n\n```\nimport { Component, OnInit } from\
  \ '@angular/core';\nimport { environment } from\n'../environments/environment';\n\
  import { Title } from '@angular/platform-browser';\n```\n\n-   2. 将 Title 服务注入到\
  \ AppComponent 类的构造函数中：\n\n```\nexport class AppComponent {\n  username = environment.username;\n\
  \n  constructor(private title: Title) {}\n}\n```\n\n-   3. 将 OnInit 接口添加到组件的实现接口列表中，并在\
  \ ngOnInit 方法中调用 title 变量的 setTitle 方法：\n\n```\nexport class AppComponent implements\
  \ OnInit {\n  username = environment.username;\n\n  constructor(private title: Title)\
  \ {}\n\n  ngOnInit() {\n    this.title.setTitle('GitHub portfolio app');\n  }\n\
  }\n```\n\n-   4. 运行 `npm run dev:ssr` 预览应用，你应该能在浏览器标签页中看到标题：\n\n![](img/efea53d01337e7b223389b38dcdb0160_244_0.png)\n\
  \n图 7.7 – 浏览器标签页标题\n\n与 Title 服务类似，我们可以使用 Meta 服务为应用设置 meta 标签：\n\n-   1. 打开 `app.component.ts`\
  \ 文件，并从 `@angular/platform-browser` npm 包中导入 `Meta`：\n\n```\nimport { Meta } from\
  \ '@angular/platform-browser';\n```\n\n-   2. 将 `Meta` 服务注入到 `AppComponent` 类的构造函数中：\n\
  \n```\nconstructor(private title: Title, private meta: Meta) {}\n```\n\n-   3. 使用\
  \ `meta` 变量的 `addTags` 方法向 `ngOnInit` 方法中添加一些 meta 标签：\n\n```\nngOnInit(): void\
  \ {\n  this.title.setTitle('GitHub portfolio app');\n  this.meta.addTags([\n   \
  \ {\n      name: 'description',\n      content: `${this.username}'s GitHub portfolio`\n\
  \    },\n    {\n      name: 'author',\n      content: this.username\n    }\n  ]);\n\
  }\n```\n\n在上述代码中，我们添加了两个 meta 标签。第一个设置 description（描述），其中包含当前 GitHub 个人资料的用户名。第二个将\
  \ author（作者）标签设置为与 GitHub 个人资料的用户名相同。\n\n\n\n\n- 4. 运行 `npm run dev:ssr` 启动应用程序，并导航到\
  \ http://localhost:4200。\n\n- 5. 使用浏览器检查页面，你应该会在页面的 head 元素中看到以下 meta 标签：\n\n```\n\
  <head>\n  <meta charset=\"utf-8\">\n  <title>GitHub portfolio app</title>\n  <base\
  \ href=\"/\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
  >\n  <link rel=\"icon\" type=\"image/x-icon\" href=\"favicon.ico\">\n  <link rel=\"\
  stylesheet\" href=\"styles.css\">\n  <style>...</style>\n  <style>...</style>\n\
  \  <style>...</style>\n  <style>...</style>\n  <style>...</style>\n  <meta name=\"\
  description\" content=\"<Your GitHub login>'s GitHub portfolio\">\n  <meta name=\"\
  author\" content=\"<Your GitHub login>\">\n```\n\n图 7.8 – 应用程序 head 元素\n\n诸如 Twitter、Facebook\
  \ 和 LinkedIn 等热门社交平台都需要各自的 meta 标签，以便 SSR 应用程序的 URL 能够在这些平台上正确显示。如果你不想使用 Angular\
  \ 框架的 Meta 服务手动添加这些标签，可以使用 ngx-seo 库，该库为每个平台提供了内置方法。你可以从位于 https://www.npmjs.com/package/ngx-seo\
  \ 的 npm 仓库中获取该库。\n\n在下一节中，我们将学习如何重放 SSR 应用程序不支持的事件，从而完成我们的项目。\n\n## 使用 preboot 重放事件\n\
  \n在*集成 Angular Universal*一节中，我们了解到 SSR 应用程序在被完全引导之前，除了使用 routerLink 指令进行导航外，不会响应用户事件。现在，我们将学习如何使用\
  \ preboot 库将这些事件排队，并在应用程序完全加载后重放它们。让我们看看如何使用它：\n\n- 1. 执行以下 npm 命令来安装该库：\n\n```\n\
  npm install preboot\n```\n\n- 2. 打开 `app.module.ts` 文件，并从 `preboot` npm 包中导入 `PrebootModule`：\n\
  \n```typescript\nimport { PrebootModule } from 'preboot';\n```\n\n- 3. 将 `PrebootModule`\
  \ 类添加到 `@NgModule` 装饰器的 imports 数组中：\n\n```typescript\n@NgModule({\n  declarations:\
  \ [\n    AppComponent,\n    PersonalInfoComponent,\n    PanelComponent,\n    RepositoriesComponent,\n\
  \    OrganizationsComponent\n  ],\n  imports: [\n    BrowserModule.withServerTransition({\
  \ appId: 'serverApp' }),\n    HttpClientModule,\n    TransferHttpCacheModule,\n\
  \    PrebootModule.withConfig({ appRoot: 'app-root' })\n  ],\n  providers: [],\n\
  \  bootstrap: [AppComponent]\n})\n```\n\n我们使用 `PrebootModule` 的 `withConfig` 方法来定义\
  \ Angular 应用程序的主组件。它接受一个 `PrebootOptions` 类型的选项对象，其中包含各种属性，你可以在 https://github.com/angular/preboot#PrebootOptions\
  \ 找到这些属性。其中一个选项是 `appRoot` 属性，它定义了主组件的选择器。\n\npreboot 库的目的是在应用程序状态从服务器传输到浏览器的过程中保持一致的用户体验。\n\
  \n要验证其功能，请运行 `npm run dev:ssr` 启动 SSR 应用程序，并使用*集成 Angular Universal*一节中描述的步骤来模拟慢速网络。如果在应用程序加载时尝试点击任何链接，你会注意到在应用程序完全加载到浏览器后，浏览器会导航到所选链接。\n\
  \n## 总结\n\n在本项目中，我们为 GitHub 个人资料构建了一个作品集应用程序。最初，我们学习了如何在一个新的 Angular 应用程序中与 GitHub\
  \ API 交互。我们还使用了 Bootstrap CSS 和 Bootstrap Icons，为我们的作品集应用程序提供了漂亮的用户界面。\n\n随后，我们了解了如何使用\
  \ Angular Universal 将 Angular 应用程序转换为 SSR 应用程序。我们学习了当用户使用低端且性能较慢的设备时，如何从预渲染内容中获益，以及这项技术的一些潜在缺陷。\n\
  \n我们使用了 Angular 框架提供的一些可用 SEO 技术来提高应用程序的可发现性。最后，我们安装了 preboot 库，以改善应用程序在加载期间的用户体验。\n\
  \n在下一章中，我们将了解 monorepo 架构，以及如何管理 Angular 应用程序的状态。\n\n## 练习题\n\n让我们来看几个练习题：\n\n-\
  \ 1. Angular 应用程序中环境文件的用途是什么？\n- 2. 我们如何在组件的模板中订阅 observable？\n- 3. 我们使用哪个命令来安装\
  \ Angular Universal？\n- 4. 我们如何以编程方式区分浏览器平台和服务器平台？\n- 5. 哪个命令会生成 SSR 应用程序的预渲染版本？\n\
  - 6. 我们使用哪个 Angular 模块将状态从服务器传输到浏览器？\n- 7. 我们使用哪个 Angular 服务来设置 Angular 应用程序的标题？\n\
  - 8. 我们使用哪个 Angular 服务来在 Angular 应用程序中设置 meta 标签？\n- 9. preboot 库的用途是什么？\n- 10.\
  \ 我们如何在 SSR 应用程序中启用 preboot？\n\n## 延伸阅读\n\n以下是一些链接，供你基于本章所学内容进一步学习：\n\n- Angular\
  \ Universal 指南：`https://angular.io/guide/universal`\n- GitHub REST API：`https://docs.github.com/en/rest`\n\
  - Bootstrap CSS：`https://getbootstrap.com/`\n- Bootstrap Icons：`https://icons.getbootstrap.com/`\n\
  - Angular HTTP 指南：`https://angular.io/guide/http`\n- TransferHttpCacheModule：`https://github.com/angular/universal/blob/master/docs/transfer-http.md`\n\
  - preboot：`https://github.com/angular/preboot`\n"
- "# 8 使用 Nx Monorepo 工具和 NgRx 构建企业门户\n\n# 使用 Nx Monorepo 工具和 NgRx 构建企业门户\n\n典型的企业应用程序通常由后端系统和前端系统组成。后端负责与数据库交互以实现数据持久化，并对外提供\
  \ REST API。前端通过 REST 接口与后端系统通信以交换数据。在某些情况下，前端系统可以由多个应用程序组成，包括 Web 界面或移动应用程序。将所有这类应用程序和系统分别放在独立的源代码控制仓库中，扩展性不佳，并且不易于维护和构建。或者，对于此类大型企业应用程序，我们可以采用\
  \ **monorepo** 架构，即每个应用程序都位于同一仓库内的不同位置。\n\nAngular 生态系统中一个采用 monorepo 架构的流行工具是 **Nx\
  \ Dev Tools**。将 Nx monorepo 应用程序与状态管理库相结合，可以显著提升你的应用程序。**NgRx** 是 Angular 应用程序中流行的状态管理库，可以帮助我们在全局范围内保持一致且可管理的状态。\n\
  \n## 使用 Nx 创建 monorepo 应用程序\n\nNx Dev Tools 为开发人员提供了用于处理 monorepo 的工具，包括以下内容：\n\n\
  - **create-nx-workspace**：一个用于搭建新 Nx monorepo 应用程序的 npm 包。\n- **Nx CLI**：一个针对 monorepo\
  \ 应用程序运行命令的命令行界面。Nx CLI 扩展了 Angular CLI 以提供更多命令，并且由于分布式缓存机制，其速度更快。\n\n> **提示**\n\
  > 在使用 Nx monorepo 时，建议使用 VSCode 的*快速打开*功能。生成的文件夹和文件数量会显著增加，浏览它们将变得很有挑战性。你可以在 https://code.visualstudio.com/docs/editor/editingevolved#_quick-file-navigation\
  \ 了解更多信息。\n\n当我们使用上述 npm 包创建新的 Nx monorepo 工作区时，它会检查 Nx CLI 是否已安装。要安装 Nx CLI，请在终端中运行以下命令：\n\
  \n```\nnpm install -g nx\n```\n\n上述命令将在我们的系统上全局安装 nx npm 包。现在，我们可以使用以下命令搭建一个新的 Nx\
  \ monorepo 工作区：\n\n```\nnpx create-nx-workspace packt --appName=tour --preset=angular\
  \ --style=css --linter=eslint --nx-cloud=false --routing\n```\n\n上述命令使用了 npx，这是一个\
  \ npm 命令行工具，允许我们在不预先安装的情况下执行 npm 包。它执行 create-nx-workspace 包，并传递以下选项：\n\n- `packt`：Nx\
  \ monorepo 工作区的名称。在大型企业环境中，我们通常使用组织名称。\n- `--appName=tour`：应用程序的名称。\n- `--preset=angular`：Nx\
  \ 支持使用各种 JavaScript 框架构建的应用程序。preset 选项定义了我们想要构建的应用程序类型。\n\n\n\n-   `--style=css`：表示我们的应用将使用\
  \ CSS 样式表格式。\n-   `--linter=eslint`：将我们的应用配置为使用 **ESLint** 作为默认的 linter。\n-   `--nx-cloud=false`：为我们的应用禁用\
  \ Nx Cloud。\n-   `--routing`：在应用中启用 Angular 路由。\n\n> **重要提示**\n> 创建新的 Nx 工作区可能需要一些时间才能完成，因为它会安装企业环境所需的所有必要包。\n\
  \n工作区创建完成后，我们可以运行它来验证一切是否已正确设置：\n\n1.  在 VSCode 编辑器中打开项目，然后点击 VSCode 侧边栏中的 **Nx\
  \ Console** 菜单。\n2.  在 **GENERATE & RUN TARGET** 窗格中选择 **Serve** 选项：\n3.  在弹出的对话框中，选择我们创建的应用：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_253_0.png)\n\n图 8.1 – Serve 选项\n\n![](img/efea53d01337e7b223389b38dcdb0160_253_1.png)\n\
  \n图 8.2 – 应用选择\n\n4.  点击 Serve 选项卡的 Run 按钮来构建应用，并在浏览器中打开 http://localhost:4200：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_254_0.png)\n\n图 8.3 – 最小化的 Nx 应用\n\n\
  恭喜！你的新应用已正确配置！Nx 会像 Angular CLI 一样为我们创建一个最小化的骨架应用，以便我们可以在其基础上构建功能。\n\n在下一节中，我们将通过在工作区中创建管理员门户和访客门户，更深入地了解\
  \ Nx Dev Tools。\n\n## 创建用户专属门户\n\n我们的应用将包含两个供不同用户使用的门户。访客将能够查看 POI 列表并在地图上选择它们。管理员将能够查看每个\
  \ POI 的统计数据。我们将在以下章节中进一步了解如何使用 Nx Dev Tools：\n\n-   构建访客门户\n-   构建管理员门户\n\n每个门户都将是一个独立的\
  \ Nx 库，根据在浏览器地址栏中输入的 URL 进行加载。将代码组织在库中使得我们可以在不同应用之间复用它，并单独构建和测试它。我们将在下一节开始构建访客门户。\n\
  \n## 构建访客门户\n\n访客门户将是 Nx 工作区中的一个库，默认情况下会被加载。让我们看看如何通过 Nx Console 构建该库：\n\n1.  从\
  \ VSCode 侧边栏运行 Nx Console，并从 GENERATE & RUN TARGET 窗格中选择 Generate 选项：\n\n![](img/efea53d01337e7b223389b38dcdb0160_255_0.png)\n\
  \n图 8.4 – Generate 选项\n\n2.  在弹出的对话框中选择 @nrwl/angular – library 选项。@nrwl/angular\
  \ 命名空间包含我们可以在 Angular 应用的 Nx monorepo 中执行的原理图。\n\n**重要提示**\n如果在对话框中看不到该选项，请重启 VSCode。\n\
  \n3.  输入 `visitor` 作为库的名称，然后点击 **Generate** 选项卡中的 **Run** 按钮：\n\n![](img/efea53d01337e7b223389b38dcdb0160_256_0.png)\n\
  \n图 8.5 – 库名称\n\n**提示**\n在输入库名称时，你可能注意到 Nx 在终端中执行了 `generate` 命令。实际上它并没有执行。相反，它是在模拟在系统中运行该命令的效果；这种技术称为**试运行**。\n\
  \nNx 将在我们工作区的 `libs` 文件夹中创建 `visitor` 库。该库目前不包含任何组件。根据项目规范，访客门户将包含一个 POI 列表，用户可以在其中选择它们并在地图上查看其位置。因此，我们需要创建一个具有以下布局的\
  \ Angular 组件：\n\n![](img/efea53d01337e7b223389b38dcdb0160_256_1.png)\n\n图 8.6 –\
  \ 访客门户布局\n\n在我们的例子中，我们将使用 `navigation` 组件，因为我们需要一个侧边栏。让我们看看如何生成该组件：\n\n1.  从 VSCode\
  \ 侧边栏打开 Nx Console，然后选择 **Generate** 选项。\n2.  在弹出的对话框中选择 **@angular/material – navigation**\
  \ 选项。\n    **@angular/material** 命名空间包含我们可以运行来创建 Angular Material 组件的原理图。\n3.  输入组件的名称：\n\
  4.  从我们之前创建的 **project** 下拉列表中选择 **visitor** 库：\n5.  勾选 **flat** 选项，这样组件就不会生成在单独的文件夹中：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_258_0.png)\n\n![](img/efea53d01337e7b223389b38dcdb0160_258_1.png)\n\
  \n> **重要提示**\n> 如果库没有出现在下拉列表中，请重启 VSCode。\n\n![](img/efea53d01337e7b223389b38dcdb0160_258_2.png)\n\
  \n该组件将是库中的主组件，因此我们希望它与其相关的模块文件位于同一个文件夹中。\n\n6.  输入将创建组件的文件夹：\n\n![](img/efea53d01337e7b223389b38dcdb0160_259_0.png)\n\
  \n图 8.10 – 组件文件夹\n\n> 提示\n> 无需定义将在其中创建组件的模块，因为 Angular CLI 可以直接从 path 选项推断出来。\n\n\
  7.  点击 Run 按钮生成组件。\n\nNx Console 将在 Nx 工作区的 visitor 库中创建 visitor 组件。我们现在需要将其与工作区的主应用连接起来：\n\
  \n1.  打开 app.component.css 文件并删除所有 CSS 样式，因为我们的应用将使用 Angular Material 库进行样式化。\n\
  2.  打开 app.component.html 文件并将其内容替换为以下 HTML 模板：\n\n```\n<router-outlet></router-outlet>\n\
  ```\n\nrouter-outlet 组件是 Angular 路由的一部分，是一个占位符，我们将在其中加载我们的门户。\n\n3.  打开 app.module.ts\
  \ 文件，并添加一个路由配置，当 URL 包含 tour 路径时加载访客门户：\n\n```\nimport { RouterModule } from '@angular/router';\n\
  @NgModule({\n  declarations: [AppComponent],\n  imports: [BrowserModule, BrowserAnimationsModule,\n\
  \    RouterModule.forRoot([\n      { path: 'tour', loadChildren: () =>\n       \
  \ import('@packt/visitor').then(m =>\n          m.VisitorModule) },\n```\n\n![](img/efea53d01337e7b223389b38dcdb0160_261_0.png)\n\
  \n图 8.11 – 访客门户\n\nAngular 路由会将我们重定向到 `http://localhost:4200/tour`，并显示访客门户。它目前包含一些在我们生成\
  \ navigation 组件时 Angular Material 输入的演示数据。我们将在*使用 NgRx 管理应用状态*一节中重新讨论它，以使用 NgRx\
  \ 实现完整功能。目前，我们将在下一节中继续构建管理员门户。\n\n## 构建管理员门户\n\n管理员门户将是一个包含单个组件的 Nx 库，就像访客门户一样，只是它不会基于\
  \ Angular Material 模板。让我们开始使用 Nx Console 搭建库的结构：\n\n1.  从 VSCode 侧边栏运行 Nx Console，然后选择\
  \ **Generate** 选项。\n2.  在弹出的对话框中，选择 **@nrwl/angular – library** 选项。\n3.  输入 `admin`\
  \ 作为库的名称，然后点击 **Run** 按钮。\n\n![](img/efea53d01337e7b223389b38dcdb0160_261_1.png)\n\
  \n图 8.12 – 库名称\n\n4.  再次点击 Nx Console 中的 **Generate** 选项，然后选择 **@schematics/angular\
  \ – component** 选项。**@schematics/angular** 命名空间包含我们可以使用 Angular CLI 在 Angular 应用中运行的原理图。\n\
  \n5.  为组件输入与库相同的名称：\n\n![](img/efea53d01337e7b223389b38dcdb0160_262_0.png)\n\n图\
  \ 8.13 – 组件名称\n\n6.  在 **project** 下拉列表中选择我们创建的库：\n\n![](img/efea53d01337e7b223389b38dcdb0160_262_1.png)\n\
  \n图 8.14 – 项目选择\n\n> **重要提示**\n> 如果库没有出现在下拉列表中，请重启 VSCode。\n\n7.  勾选 **flat** 选项，这样组件将创建在与库的模块文件相同的文件夹中：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_262_2.png)\n\n图 8.15 – flat 选项\n\n8.\
  \  输入将创建组件的文件夹，然后点击 **Run** 按钮：\n\n![](img/efea53d01337e7b223389b38dcdb0160_262_3.png)\n\
  \n图 8.16 – 组件文件夹\n\n\n\n\n\nThe Angular CLI will create the admin component inside\
  \ the folder of the admin library. We now need to wire up the admin library to the\
  \ monorepo application:\n\n1. Open the app.module.ts file and add a new route configuration\
  \ object for the admin library:\n\n```\nRouterModule.forRoot([\n  { path: 'admin',\
  \ loadChildren: () =>\n    import('@packt/admin').then(m => m.AdminModule) },\n\
  \  { path: 'tour', loadChildren: () =>\n    import('@packt/visitor').then(m => m.VisitorModule)\n\
  \  },\n  { path: '', pathMatch: 'full', redirectTo: 'tour' }\n])\n```\n\n2. Open\
  \ the admin.module.ts file and add a route configuration to activate AdminComponent\
  \ by default:\n\n```\nimport { NgModule } from '@angular/core';\nimport { CommonModule\
  \ } from '@angular/common';\nimport { AdminComponent } from './admin.component';\n\
  import { RouterModule } from '@angular/router';\n\n@NgModule({\n  imports: [\n \
  \   CommonModule,\n    RouterModule.forChild([\n      { path: '', component: AdminComponent\
  \ }\n    ]),\n  ],\n  declarations: [\n    AdminComponent\n  ],\n})\nexport class\
  \ AdminModule {}\n```\n\n3. Use the Serve option of Nx Console to run the application\
  \ and navigate to http://localhost:4200.\n\n4. Edit the URL address of the browser\
  \ and change it to `http://localhost:4200/admin:`\n\nadmin works!\n\nFigure 8.17\
  \ – Administrator portal\n\nThe page will display the default template of the main\
  \ component of the administrator library.\n\nWe have now completed the scaffolding\
  \ of our enterprise application. First, we created the Nx monorepo workspace that\
  \ will host the portals of the application. Then, we used Nx Console to generate\
  \ our portals along with their main components. We also installed Angular Material\
  \ to use its UI elements in our components.\n\nIn the next section, we will implement\
  \ the functionality of the visitor portal using NgRx.\n\n## Managing application\
  \ state with NgRx\n\nThe visitor portal will allow the user to see a list of available\
  \ POIs and select one to view its location on a map. The list of available POIs\
  \ and the selection of a POI is the global state of our application. We will integrate\
  \ NgRx for managing the application state in the visitor portal by completing the\
  \ following tasks:\n\n- Configuring the state\n- Interacting with the store\n\n\
  Let's begin by configuring the state of our application in the following section.\n\
  \n### Configuring the state\n\nOur application will consist of a root state for\
  \ the whole application and a feature state for the visitor portal. We will start\
  \ by executing the following command to create the root state:\n\n```\nnx generate\
  \ ngrx app --root --no-interactive --project=tour --module=apps/tour/src/app/app.module.ts\n\
  ```\n\nThe preceding command uses the generate command of Nx CLI, passing the following\
  \ options:\n\n- ngrx: Indicates that we want to set up an NgRx state\n- app: The\
  \ name of the state\n- --root: Indicates that we want to configure a root state\n\
  - `--no-interactive`: Disables interactive input prompts\n- `--project=tour`: The\
  \ name of the application in our workspace\n- `--module=apps/tour/src/app/app.module.ts`:\
  \ Registers the state with the main Angular module of our application\n\nThe previous\
  \ command will add all necessary NgRx npm packages in the `package.json` file and\
  \ install them. It will also modify the `app.module.ts` file to configure all NgRx-related\
  \ artifacts such as the store, effects, and **Store DevTools**.\n\n> **Tip**\n>\
  \ Store DevTools is an npm package of the NgRx library that provides debugging,\
  \ monitoring, and instrumentation capabilities to the state of an NgRx application.\
  \ It must be used in conjunction with the **Redux DevTools** browser extension,\
  \ which can be found at https://github.com/zalmoxisus/redux-devtools-extension.\n\
  \nThe `visitor` library itself will not manage the data for the state of the visitor\
  \ portal. Instead, we will create a new library in our Nx workspace that will fetch\
  \ and store data in the feature state. Execute the following command of Nx CLI to\
  \ create a new library:\n\n```\nnx generate lib poi\n```\n\nThe preceding command\
  \ will generate the `poi` library in our Nx monorepo.\n\n> **Tip**\n> The `generate`\
  \ command of Nx CLI that we used has the same effect as creating the library using\
  \ Nx Console.\n\nNow that we have created the library, we can set up the feature\
  \ state using the following command:\n\n```\nnx generate ngrx poi --project=poi\
  \ --no-interactive\n--module=libs/poi/src/lib/poi.module.ts --barrels\n```\n\nThe\
  \ preceding command uses the `generate` command of Nx CLI to register a feature\
  \ state passing additional options:\n\n- `ngrx`: Indicates that we want to set up\
  \ an NgRx state.\n- `poi`: The name of the state.\n- `--project=poi`: The name of\
  \ the library in our workspace.\n- `--no-interactive`: Disables interactive input\
  \ prompts.\n- `--module=libs/poi/src/lib/poi.module.ts`: Registers the state with\
  \ the Angular module of our library.\n- `--barrels`: Indicates to use barrel files\
  \ to re-export NgRx artifacts such as selectors and state. The name of a barrel\
  \ file is usually `index.ts` by convention.\n\nThe preceding command will create\
  \ a folder, named `+state` by convention, inside our library that contains the following\
  \ files:\n\n- `poi.actions.ts`: Defines NgRx actions for the feature state\n- `poi.effects.ts`:\
  \ Defines NgRx effects for the feature state\n- `poi.models.ts`: Defines an entity\
  \ interface for POI data\n- `poi.reducer.ts`: Defines NgRx reducers for the feature\
  \ state\n- `poi.selectors.ts`: Defines NgRx selectors for the feature state\n\n\
  Nx CLI has done most of the job by adding the necessary content in the previous\
  \ files, eliminating the boilerplate code for us. We now need to create an Angular\
  \ service in the library that will fetch the POI data:\n\n1. Open the `poi.models.ts`\
  \ file and add the following properties to the `PoiEntity` interface:\n\n```\nexport\
  \ interface PoiEntity {\n  id: string | number; // Primary ID\n  name: string;\n\
  \  lat: number;\n  lng: number;\n  description: string;\n  imgUrl: string;\n}\n\
  ```\n\n2. Execute the following command to generate the Angular service:\n\n```\n\
  nx generate service poi --project=poi\n```\n\nThe preceding command will create\
  \ an Angular service called `poi` in the poi library.\n\n3. Open the poi.service.ts\
  \ file and add the following import statements:\n\n```\nimport { HttpClient } from\
  \ '@angular/common/http';\nimport { Observable } from 'rxjs';\nimport { PoiEntity\
  \ } from '...';\n```\n\n4. Inject HttpClient in the constructor of the PoiService\
  \ class and create a method to get POI data from the assets/poi.json file:\n\n```\n\
  export class PoiService {\n\n  constructor(private http: HttpClient) {}\n\n  getAll():\
  \ Observable<PoiEntity[]> {\n    return\n      this.http.get<PoiEntity[]>('assets/poi.json');\n\
  \  }\n}\n```\n\nWe use the built-in HTTP client of the Angular framework to get\
  \ POI data by initiating a GET HTTP request.\n\n> **Important note**\n> You can\
  \ get the poi.json file from the GitHub repository of the Getting started section\
  \ and copy it to the apps\\tour\\src\\assets folder of your workspace.\n\n5. Open\
  \ the poi.effects.ts file and add the following import statements:\n\n```\nimport\
  \ { map } from 'rxjs/operators';\nimport { PoiService } from '../poi.service';\n\
  ```\n\n6. Inject PoiService in the constructor of the PoiEffects class:\n\n```\n\
  constructor(private actions$: Actions, private poiService: PoiService) {}\n```\n\
  \n7. Modify the `init$` property to use the `poiService` variable:\n\n```\ninit$\
  \ = createEffect(() =>\n  this.actions$.pipe(\n    ofType(PoiActions.init),\n  \
  \  fetch({\n      run: (action) => {\n        return this.poiService.getAll().pipe(\n\
  \          map(pois => PoiActions.loadPoiSuccess({ poi:\n            pois }))\n\
  \        )\n      },\n\n      onError: (action, error) => {\n        console.error('Error',\
  \ error);\n        return PoiActions.loadPoiFailure({ error });\n      },\n    })\n\
  \  )\n);\n```\n\nThe effect is responsible for listening to all actions that are\
  \ dispatched in the store. As soon as a `PoiActions.init` action is dispatched,\
  \ the `init$` property is triggered and calls the `getAll` method of the `poiService`\
  \ variable. The `init$` property knows which action to listen for by the parameters\
  \ in the `ofType` operator.\n\n> **Tip**\n> The `ofType` operator can accept more\
  \ than one action.\n\nIf the data is fetched successfully, the effect will dispatch\
  \ a new action in the store, `PoiActions.loadPoiSuccess`, with POI data as the payload.\
  \ If there is a failure getting the data, it will dispatch a `PoiActions.loadPoiFailure`\
  \ action in the store.\n\n8. Open the `app.module.ts` file and import `HttpClientModule`\
  \ from the `@angular/common/http` namespace:\n\n```\nimport { HttpClientModule }\
  \ from\n  '@angular/common/http';\n```\n\nAdd the `HttpClientModule` class also\
  \ in the `imports` array of the `@NgModule` decorator.\n\n\n\n\n\n应用程序的全局状态现已配置完成，可以开始使用了。在下一节中，我们将在访客库中创建额外的\
  \ Angular 组件，使其与应用程序的功能状态进行交互。\n\n## 与 store 交互\n\n访客门户将通过两个 Angular 组件与应用程序的功能状态进行交互。一个组件将显示\
  \ POI 列表并允许用户选择其中一个。另一个组件将显示一个 **Google Maps** 地图并在地图上显示所选的 POI。\n\n起初，我们将构建显示 POI\
  \ 列表的组件：\n\n1. 打开 visitor.module.ts 文件并添加以下 import 语句：\n\n   ```\n   import { PoiModule\
  \ } from '@packt/poi';\n   ```\n\n2. 在 @NgModule 装饰器的 imports 数组中添加 PoiModule：\n\
  \n   ```\n   @NgModule({\n     imports: [CommonModule, LayoutModule,\n       MatToolbarModule,\
  \ MatButtonModule,\n       MatSidenavModule, MatIconModule, MatListModule,\n   \
  \    RouterModule.forChild([\n         { path: '', component: VisitorComponent }\n\
  \       ]),\n       PoiModule\n     ],\n     declarations: [VisitorComponent],\n\
  \   })\n   ```\n\n   我们导入 PoiModule，以便在访客门户加载时，poi 功能状态立即在 store 中注册。\n\n3. 执行以下\
  \ Nx CLI 命令来创建 Angular 组件：\n\n   ```\n   nx generate component poi-list --project=visitor\n\
  \   ```\n\n4. 打开 poi-list.component.ts 文件并添加以下 import 语句：\n\n   ```\n   import {\
  \ Store } from '@ngrx/store';\n   import { PoiActions, PoiSelectors } from '@packt/poi';\n\
  \   ```\n\n5. 在 PoiListComponent 类的构造函数中注入 Store 服务：\n\n   ```\n   constructor(private\
  \ store: Store) { }\n   ```\n\n6. 在组件初始化时，在 store 中分发 PoiActions.init action 以获取\
  \ POI 数据：\n\n   ```\n   ngOnInit(): void {\n     this.store.dispatch(PoiActions.init());\n\
  \   }\n   ```\n\n   我们将 action 作为方法执行，并将其结果传递给 store 变量的 dispatch 方法。\n\n7. 创建一个组件属性，该属性调用\
  \ PoiSelectors.getAllPoi 选择器以从 store 中列出 POI 数据：\n\n   ```\n   pois$ = this.store.select(PoiSelectors.getAllPoi);\n\
  \   ```\n\n   我们使用 store 变量的 select 方法来执行选择器。\n\n   > **重要说明**\n   > 我们没有创建 PoiSelectors.getAllPoi\
  \ 选择器。NgRx 在我们在 poi 库中生成功能状态时为我们创建了它。\n\n8. 打开 poi-list.component.html 文件并用以下 HTML\
  \ 模板替换其内容：\n\n   ```\n   <mat-action-list *ngFor=\"let poi of pois$ | async\">\n\
  \     <button mat-list-item>{{poi.name}}</button>\n   </mat-action-list>\n   ```\n\
  \n   我们使用 Angular Material 库的 mat-action-list 组件将每个 POI 显示为单个操作项。我们使用 async 管道订阅\
  \ pois$ 属性，并为每个 POI 创建带有 mat-list-item 指令的按钮元素。\n\n9. 打开 visitor.component.html\
  \ 文件并用我们创建的 Angular 组件的选择器替换 mat-nav-list 组件：\n\n   ```\n   <mat-sidenav #drawer\
  \ class=\"sidenav\" fixedInViewport\n     [attr.role]=\"(isHandset$ | async) ? 'dialog'\
  \ :\n     'navigation'\"\n     [mode]=\"(isHandset$ | async) ? 'over' : 'side'\"\
  \n     [opened]=\"(isHandset$ | async) === false\">\n     <mat-toolbar>Menu</mat-toolbar>\n\
  \     <packt-poi-list></packt-poi-list>\n   </mat-sidenav>\n   ```\n\n使用 Nx Console\
  \ 启动应用程序，您应该在菜单侧边栏中看到以下输出：\n\n# Menu\n\nAcropolis\n\nDelphi\n\nWhite Tower\n\nFigure\
  \ 8.18 – List of POIs\n\n我们已经创建了将显示可用 POI 列表的 Angular 组件。现在让我们看看如何创建使用 Google Maps\
  \ 显示 POI 的组件。\n\nAngular Material 库包含一个可用于我们应用程序的 Google Maps 组件：\n\n1. 运行以下 npm\
  \ 客户端命令来安装 Google Maps 组件：\n\n   ```\n   npm install @angular/google-maps\n   ```\n\
  \n2. 打开 visitor.module.ts 文件并添加以下 import 语句：\n\n   ```\n   import { GoogleMapsModule\
  \ } from '@angular/google-maps';\n   ```\n\n3. 将 GoogleMapsModule 添加到 @NgModule\
  \ 装饰器的 imports 数组中：\n\n   ```typescript\n   @NgModule({\n     imports: [CommonModule,\
  \ LayoutModule,\n       MatToolbarModule, MatButtonModule,\n       MatSidenavModule,\
  \ MatIconModule, MatListModule,\n       RouterModule.forChild([\n         { path:\
  \ '', component: VisitorComponent }\n       ]),\n       PoiModule,\n       GoogleMapsModule\n\
  \     ],\n     declarations: [VisitorComponent, PoiListComponent],\n   })\n   ```\n\
  \n4. 打开应用程序的 `index.html` 文件并在 head 元素中包含 **Google Maps JavaScript API**：\n\n  \
  \ ```html\n   <script src=\"https://maps.googleapis.com/maps/api/js\">\n   </script>\n\
  \   ```\n\n现在我们已经在应用程序中安装并注册了 Google Maps，让我们创建将托管它的 Angular 组件：\n\n1. 执行以下 Nx CLI\
  \ 命令来创建一个新的 Angular 组件：\n\n   ```bash\n   nx generate component map --project=visitor\n\
  \   ```\n\n2. 打开 `map.component.ts` 文件并添加以下 import 语句：\n\n   ```typescript\n   import\
  \ { Store } from '@ngrx/store';\n   import { PoiSelectors } from '@packt/poi';\n\
  \   ```\n\n3. 在 MapComponent 类的构造函数中注入 Store 服务并声明一个属性以从 store 获取所选 POI：\n\n   ```typescript\n\
  \   export class MapComponent implements OnInit {\n\n     poi$ = this.store.select(PoiSelectors.getSelected);\n\
  \n     constructor(private store: Store) { }\n\n     ngOnInit(): void {\n     }\n\
  \n   }\n   ```\n\n4. 打开 `map.component.html` 文件并用以下 HTML 模板替换其内容：\n\n   ```html\n\
  \   <google-map height=\"100%\" width=\"auto\" *ngIf=\"poi$ |\n     async as poi\"\
  \ [center]=\"poi\">\n     <map-marker [position]=\"poi\"></map-marker>\n   </google-map>\n\
  \   ```\n\n   在前面的模板中，我们使用 `async` 管道订阅 `poi$` 属性。一旦我们从 store 获取到选定的 POI，我们就会显示一个\
  \ `google-map` 组件并将地图中心设置为 POI 坐标。此外，我们还在指定的 POI 坐标上添加一个标记。\n\n5. 打开 `visitor.component.html`\
  \ 文件并用 `MapComponent` 的选择器替换 `mat-sidenav-content` 组件的内容：\n\n   ```html\n   <mat-sidenav-content>\n\
  \     <mat-toolbar color=\"primary\">\n       <button\n         type=\"button\"\n\
  \         aria-label=\"Toggle sidenav\"\n         mat-icon-button\n         (click)=\"\
  drawer.toggle()\"\n         *ngIf=\"isHandset$ | async\">\n         <mat-icon aria-label=\"\
  Side nav toggle icon\">\n           menu</mat-icon>\n       </button>\n       <span>visitor</span>\n\
  \     </mat-toolbar>\n     <packt-map></packt-map>\n   </mat-sidenav-content>\n\
  \   ```\n\n我们创建的 Angular 组件将在从列表中选择 POI 后立即显示其在地图上的位置。如果您尝试从列表中选择一个 POI，您会注意到什么都没有发生。为什么会这样？\n\
  \n应用程序的全局状态目前不知道何时选择了 POI。我们需要添加必要的代码来设置所选 POI 并与 store 交互：\n\n1. 打开 poi.actions.ts\
  \ 文件并添加一个用于传递所选 POI ID 的新 action：\n\n   ```\n   export const selectPoi = createAction(\n\
  \     '[Poi/API] Select Poi',\n     props<{ poiId: string | number }>()\n   );\n\
  \   ```\n\n2. 打开 poi.reducer.ts 文件并在 poiReducer 属性中添加一个新语句，该语句将监听 selectPoi action\
  \ 并将所选 POI 保存到 store 中：\n\n   ```\n   const poiReducer = createReducer(\n     initialState,\n\
  \     on(PoiActions.init, (state) => ({ ...state, loaded: false, error: null })),\n\
  \     on(PoiActions.loadPoiSuccess, (state, { poi }) =>\n       poiAdapter.setAll(poi,\
  \ { ...state, loaded: true })\n     ),\n     on(PoiActions.loadPoiFailure, (state,\
  \ { error }) =>\n       ({ ...state, error })),\n     on(PoiActions.selectPoi, (state,\
  \ { poiId }) => ({\n       ...state, selectedId: poiId }))\n   );\n   ```\n\n3.\
  \ 打开 poi-list.component.ts 文件并导入 PoiEntity 接口：\n\n   ```\n   import { Component,\
  \ OnInit } from '@angular/core';\n   import { Store } from '@ngrx/store';\n   import\
  \ { PoiActions, PoiEntity, PoiSelectors } from '@packt/poi';\n   ```\n\n\n\n4. 创建一个新方法来将选定的\
  \ PoiEntity  along with the selected PoiEntity 分派到 store 的 selectPoi action：\n\n\
  ```\nselectPoi(poi: PoiEntity) {\n    this.store.dispatch(PoiActions.selectPoi({poiId:\n\
  \        poi.id}));\n}\n```\n\n5. 打开 poi-list.component.html 文件并将 selectPoi 方法绑定到按钮元素的\
  \ click 事件：\n\n```\n<mat-action-list *ngFor=\"let poi of pois$ | async\">\n    <button\
  \ mat-list-item\n        (click)=\"selectPoi(poi)\">{{poi.name}}</button>\n</mat-action-list>\n\
  ```\n\n要查看新功能的效果，请使用 Nx Console 中的 Serve 选项运行应用程序并从列表中选择一个 POI。应用程序的输出应如下所示：\n\n\
  ![](img/efea53d01337e7b223389b38dcdb0160_275_0.png)\n\n图 8.19 – POI 选择\n\n> **重要提示**\n\
  > 我们在该项目中使用开发模式的 Google Maps。对于生产环境，您应该在 https://developers.google.com/maps/gmp-get-started\
  \ 获取 API 密钥并将其包含在 index.html 文件中加载的 Google Maps JavaScript API 脚本中，例如 `<script src=\"\
  https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY\"></script>`。\n\n我们现在已完成访客门户所需的所有功能。做得好！实现访客门户的基本功能需要与\
  \ NgRx 交互以管理应用程序的全局状态。全局状态被分离为应用程序的根状态和访客门户的功能状态。后者在访客库中用于创建 Angular 组件以显示 POI 列表并选择一个在\
  \ Google Maps 中查看。\n\n在下一节中，我们将构建管理员门户以获取每个 POI 的访问统计信息。\n\n## 使用图表可视化数据\n\n管理员门户将负责使用图表显示每个\
  \ POI 的流量访问。流量会在访客通过点击地图上的标记访问 POI 时产生。应用程序将在浏览器的本地存储中持久保存访问数据。它将为每次访问保留一条记录，其中包含\
  \ POI 的 ID 和总访问次数。管理员门户将包括以下功能：\n\n- 在 store 中持久保存访问数据\n- 显示访问统计信息\n\n我们将通过在以下部分实现跟踪访问的机制来开始构建管理员门户。\n\
  \n## 在 store 中持久保存访问数据\n\n我们的应用程序尚未为 POI 记录流量统计信息。让我们看看如何完成此任务：\n\n1. 打开 map.component.html\
  \ 文件并添加 map-info-window 组件：\n\n```\n```html\n<google-map height=\"100%\" width=\"\
  auto\" *ngIf=\"poi$ |\n  async as poi\" [center]=\"poi\">\n  <map-marker [position]=\"\
  poi\"></map-marker>\n```\n```\n\n```\n```html\n<map-info-window>\n  <mat-card>\n\
  \    <mat-card-header>\n      <mat-card-title>{{poi.name}}</mat-card-title>\n  \
  \  </mat-card-header>\n    <img mat-card-image [src]=\"poi.imgUrl\">\n    <mat-card-content>\n\
  \      <p>{{poi.description}}</p>\n    </mat-card-content>\n  </mat-card>\n</map-info-window>\n\
  </google-map>\n```\n```\n\n`map-info-window` 组件是一个弹出窗口，用于显示有关当前地图标记的附加信息。它以 Angular\
  \ Material 卡组件的形式显示 POI 的标题、图像和描述。\n\n`mat-card` 组件包含由 `mat-card-header` 组件表示的标题，以及带有\
  \ `mat-card-image` 指令的 `img` 元素表示的图像。`mat-card-content` 组件表示卡片的主要内容。\n\n2. 打开 `visitor.module.ts`\
  \ 文件并导入 `MatCardModule`：\n\n```\n```typescript\nimport { MatCardModule } from\n\
  \  '@angular/material/card';\n\n@NgModule({\n  imports: [CommonModule, LayoutModule,\n\
  \    MatToolbarModule, MatButtonModule,\n    MatSidenavModule, MatIconModule, MatListModule,\n\
  \    RouterModule.forChild([\n      { path: '', component: VisitorComponent }\n\
  \    ]),\n    PoiModule,\n    GoogleMapsModule,\n    MatCardModule\n  ],\n  declarations:\
  \ [VisitorComponent, PoiListComponent,\n    MapComponent],\n})\n```\n```\n\nMatCardModule\
  \ 类是一个 Angular Material 模块，公开了我们创建卡片组件所需的所有组件。\n\n3. 打开 map.component.ts 文件并添加以下导入语句：\n\
  \n```\nimport { Component, OnInit, ViewChild } from\n'@angular/core';\nimport {\
  \ Store } from '@ngrx/store';\nimport { PoiSelectors } from '@packt/poi';\nimport\
  \ { MapInfoWindow, MapMarker } from\n'@angular/google-maps';\n```\n\n4. 使用 @ViewChild\
  \ 装饰器声明一个组件属性以获取对信息窗口的引用：\n\n```\n@ViewChild(MapInfoWindow) info: MapInfoWindow\
  \ |\n    undefined;\n```\n\n5. 创建一个用于打开信息窗口的方法：\n\n```\nshowInfo(marker: MapMarker)\
  \ {\n    this.info?.open(marker);\n}\n```\n\n在前面的代码中，我们调用信息窗口引用的 open 方法，将关联的地图标记作为参数传递。\n\
  \n6. 打开 map.component.html 文件并将 showInfo 组件方法绑定到 map-marker 组件的 mapClick 事件：\n\n\
  ```\n<map-marker #marker=\"mapMarker\" [position]=\"poi\" (mapClick)=\"showInfo(marker)\"\
  ></map-marker>\n```\n\n我们创建 marker 模板引用变量以获取对 mapMarker 对象的引用并将其作为参数传递给 showInfo\
  \ 方法。\n\n7. 使用 Nx Console 的 Serve 选项运行应用程序并从列表中选择一个 POI。\n\n8. 点击地图上的 POI 标记，您应该得到类似于以下的输出：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_279_0.png)\n\n图 8.20 – 地图信息窗口\n\n我们认为当访客点击地图标记并出现信息窗口时，POI\
  \ 被访问。我们的应用程序随后会通知 store 该操作以将其保存在本地存储中。让我们创建与 store 交互的逻辑：\n\n1. 打开 poi.actions.ts\
  \ 文件并创建一个新的 action 指示 POI 已被访问：\n\n```\nexport const visitPoi = createAction(\n\
  \  '[Poi/API] Visit Poi',\n  props<{ poiId: string | number }>(\n)\n```\n\n2. 打开\
  \ poi.effects.ts 文件并添加以下导入语句：\n\n```\nimport { EMPTY } from 'rxjs';\n```\n\n3. 创建一个新的\
  \ effect 来监听 `visitPoi` action 并将指定 `poiId` 的总访问次数增加 *one*：\n\n```\n```typescript\n\
  visit$ = createEffect(() =>\n  this.actions$.pipe(\n    ofType(PoiActions.visitPoi),\n\
  \    fetch({\n      run: action => {\n        const stat = localStorage.getItem('tour-'\
  \ + action.poiId);\n        const total = stat ? Number(stat) + 1 : 1;\n       \
  \ localStorage.setItem('tour-' + action.poiId, total.toString());\n        return\
  \ EMPTY;\n      }\n    })\n  )\n);\n```\n```\n\n在前面的代码中，我们获取以单词 `tour-` 开头后跟 POI\
  \ ID 的本地存储键。如果存在，我们将其增加 *one* 并更新本地存储。否则，我们将其初始化为 *one*。\n\n> **提示**\n> 在实际情况下，最好将\
  \ `localStorage` 的逻辑抽象到一个 Angular 服务中，该服务作为全局 `localStorage` 对象的包装器。我们鼓励您在构建此项目时创建此类服务。\n\
  \neffect 的 `run` 方法返回 `EMPTY` RxJS 操作符，这会导致 observable 完成且没有值。\n\n4. 打开 `map.component.ts`\
  \ 文件并从 `@packt/poi` 命名空间导入 `PoiActions`：\n\n```\n```typescript\nimport { PoiActions,\
  \ PoiSelectors } from '@packt/poi';\n```\n```\n\n5. 修改 `showInfo` 组件方法使其向 store\
  \ 分派 `visitPoi` action：\n\n```\n```typescript\nshowInfo(marker: MapMarker, poiId:\
  \ string | number) {\n  this.store.dispatch(PoiActions.visitPoi({ poiId }));\n \
  \ this.info?.open(marker);\n}\n```\n```\n\n6. 最后，打开 `map.component.html` 文件并将选定的\
  \ POI ID 传递给 `showInfo` 方法：\n\n```\n```html\n<map-marker #marker=\"mapMarker\" [position]=\"\
  poi\"\n  (mapClick)=\"showInfo(marker, poi.id)\"></map-marker>\n```\n```\n\n我们的应用程序现在可以记录每个\
  \ POI 的访问次数并将其保存在浏览器的本地存储中。在下一节中，我们将创建管理员门户的主要组件，该组件利用访问数据。\n\n## 显示访问统计信息\n\n管理员门户将在其主组件上使用图表显示访问统计信息。我们将使用\
  \ **ng2-charts** 库在饼图上可视化数据。让我们看看如何在该组件中添加所需的功能：\n\n1. 使用以下命令安装 ng2-charts 库：\n\n\
  ```\n```bash\nnpm install ng2-charts chart.js@2.9.3\n```\n```\n\n前面的命令还将安装 `chart.js`\
  \ 库，它是 ng2-charts 库的核心。\n\n2. 打开 `admin.module.ts` 文件并从 `@packt/poi` 命名空间导入 `PoiModule`，并从\
  \ ng2-charts npm 包导入 `ChartsModule`：\n\n```\n```typescript\nimport { NgModule }\
  \ from '@angular/core';\nimport { CommonModule } from '@angular/common';\nimport\
  \ { AdminComponent } from './admin.component';\nimport { RouterModule } from '@angular/router';\n\
  import { PoiModule } from '@packt/poi';\nimport { ChartsModule } from 'ng2-charts';\n\
  ```\n```\n\n\n\n```typescript\n@NgModule({\n  imports: [\n    CommonModule,\n  \
  \  RouterModule.forChild([\n      { path: '', component: AdminComponent }\n    ]),\n\
  \    PoiModule,\n    ChartsModule\n  ],\n  declarations: [\n    AdminComponent\n\
  \  ],\n})\nexport class AdminModule {}\n```\n\n3. 打开 angular.json 文件并在 build 部分的\
  \ options 属性中添加以下属性：\n\n```json\n\"options\": {\n  \"outputPath\": \"dist/apps/tour\"\
  ,\n  \"index\": \"apps/tour/src/index.html\",\n  \"main\": \"apps/tour/src/main.ts\"\
  ,\n  \"polyfills\": \"apps/tour/src/polyfills.ts\",\n  \"tsConfig\": \"apps/tour/tsconfig.app.json\"\
  ,\n  \"assets\": [\"apps/tour/src/favicon.ico\",\n    \"apps/tour/src/assets\"],\n\
  \  \"styles\": [\n    \"./node_modules/@angular/material/prebuilt-themes/deeppurple-amber.css\"\
  ,\n    \"apps/tour/src/styles.css\"\n  ],\n  \"scripts\": [],\n  \"allowedCommonJsDependencies\"\
  : [\"chart.js\"]\n}\n```\n\nThe chart.js npm package is a **CommonJS** module. The\
  \ Angular CLI displays a warning when using a CommonJS module because it can prevent\
  \ it from optimizing your application, resulting in large bundle sizes. Setting\
  \ the allowedCommonJsDependencies option will not display the warning while building\
  \ the application.\n\n4. 打开 admin.component.ts 文件并添加以下 import 语句：\n\n```\nimport\
  \ { Component, OnDestroy, OnInit } from '@angular/core';\nimport { Store } from\
  \ '@ngrx/store';\nimport { PoiActions, PoiEntity, PoiSelectors } from '@packt/poi';\n\
  import { Subscription } from 'rxjs';\n```\n\n5. 修改 AdminComponent 类，使其与应用程序 store\
  \ 交互以获取 POI 数据：\n\n```\nexport class AdminComponent implements OnInit,\n  OnDestroy\
  \ {\n\n  private subscription: Subscription | undefined;\n\n  constructor(private\
  \ store: Store) { }\n\n  ngOnInit(): void {\n    this.subscription = this.store.select(\n\
  \      PoiSelectors.getAllPoi).subscribe();\n    this.store.dispatch(PoiActions.init());\n\
  \  }\n\n  ngOnDestroy() {\n    this.subscription?.unsubscribe();\n  }\n}\n```\n\n\
  在前面的代码中，我们使用 subscription 属性手动订阅 `getAllPoi` 选择器，而不是使用 async pipe。在这种情况下，我们还必须在组件的\
  \ `ngOnDestroy` 生命周期钩子中手动取消订阅，使用 unsubscribe 方法。如果我们未能这样做，我们可能会在应用程序中引入内存泄漏。\n\n\
  现在我们已经设置了与 store 的交互，我们可以从本地存储中获取统计数据并创建饼图：\n\n+   1. 执行以下 Nx CLI 命令在 admin 库中创建一个服务：\n\
  \n```\n```bash\nnx generate service admin --project=admin\n```\n```\n\n+   2. 打开\
  \ `admin.service.ts` 文件并添加以下 import 语句：\n\n```\n```typescript\nimport { PoiEntity\
  \ } from '@packt/poi';\n```\n```\n\n+   3. 创建一个方法来从浏览器本地存储中获取所有保存的流量统计数据：\n\n```\n\
  ```typescript\ngetStatistics(pois: PoiEntity[]): number[] {\n  return pois.map(poi\
  \ => {\n    const stat = localStorage.getItem('tour-' +\n      poi.id) ?? 0;\n \
  \   return +stat;\n  });\n}\n```\n```\n\n在前面的方法中，我们根据其 id 属性获取每个 POI 的流量。我们通过添加\
  \ `+` 前缀将 `stat` 属性转换为数字。\n\n+   4. 打开 `admin.component.ts` 文件并添加以下 import 语句：\n\
  \n```\n```typescript\nimport { Label } from 'ng2-charts';\nimport { AdminService\
  \ } from './admin.service';\n```\n```\n\n+   5. 声明用于在饼图上显示的标签和实际数据的组件属性，并在 `AdminComponent`\
  \ 类的构造函数中注入 `AdminService`：\n\n```\n```typescript\ndata: number[] = [];\nlabels:\
  \ Label[] = [];\n```\n```\n\n```\nconstructor(private store: Store, private\n  adminService:\
  \ AdminService) { }\n```\n\n+   6. 创建一个组件方法来设置图表的标签和数据：\n\n```\nprivate buildChart(pois:\
  \ PoiEntity[]) {\n  this.labels = pois.map(poi => poi.name);\n  this.data = this.adminService.getStatistics(pois);\n\
  }\n```\n\n图表标签是 POI 的标题，数据来自 `adminService` 变量的 `getStatistics` 方法。\n\n+   7. 在\
  \ `getAllPoi` 选择器的 `subscribe` 方法内部调用 `buildChart` 方法：\n\n```\nngOnInit(): void\
  \ {\n  this.subscription = this.store.select(\n    PoiSelectors.getAllPoi).subscribe(pois\
  \ => {\n      this.buildChart(pois);\n    });\n  this.store.dispatch(PoiActions.init());\n\
  }\n```\n\n+   8. 最后，打开 `admin.component.html` 文件并用以下 HTML 模板替换其内容：\n\n```\n<div\
  \ class=\"chart\" *ngIf=\"data.length\">\n  <canvas height=\"100\" baseChart\n \
  \   [data]=\"data\"\n    [labels]=\"labels\"\n    chartType=\"pie\">\n  </canvas>\n\
  </div>\n```\n\n在前面的模板中，我们使用 `baseChart` 指令将 `canvas` 元素转换为图表。图表使用 `chartType` 属性设置为饼图，并使用相应的组件属性中的\
  \ `data` 和 `labels` 属性。\n\n如果我们现在使用 Nx Console 运行应用程序，访问地图上的一些 POI，并切换到 http://localhost:4200/admin\
  \ URL，我们应该会看到以下输出：\n\n![](img/efea53d01337e7b223389b38dcdb0160_286_0.png)\n\nFigure\
  \ 8.21 – POI statistics\n\n管理员现在可以完全了解每个 POI 在访问方面的表现。我们的管理员门户现已完成。访客门户可以与 store\
  \ 交互并在浏览器的本地存储中为每个 POI 保存访问统计数据。然后管理员门户可以获取该数据并使用 ng2-charts 库在饼图上显示它。\n\n# Summary\n\
  \n在本项目中，我们为在地图上访问 POI 并为每个 POI 显示访问统计数据构建了一个企业门户应用程序。首先，我们看到了如何使用 Nx Dev Tools 为新的\
  \ Nx monorepo 应用程序搭建脚手架。然后，我们为应用程序创建了两个不同的门户，一个访客门户和一个管理员门户。我们学习了如何在访客门户中使用 NgRx\
  \ 库来维护和管理应用程序的状态。最后，我们看到了如何在管理员门户中使用图表库来为每个 POI 显示统计数据。\n\n在下一章中，我们将使用 Angular CLI\
  \ 使用 Angular CDK 构建一个 UI 组件库。\n\n# Practice questions\n\n让我们看几个练习题：\n\n+   1. 哪个\
  \ npm 包可以创建 Nx monorepo 应用程序？\n+   2. Angular CLI 和 Nx CLI 有什么区别？\n+   3. 如何在 monorepo\
  \ 的库中启用 NgRx？\n+   4. 如何从 store 中选择数据？\n+   5. 如何在 NgRx 中与 HTTP 交互？\n+   6. 我们在哪里修改\
  \ NgRx store 的状态？\n+   7. 根状态和特性状态有什么区别？\n+   8. 我们可以在 Angular 应用程序中使用哪个 npm 包来使用\
  \ Google Maps？\n+   9. 如何手动订阅 NgRx 选择器？\n+   10. 我们使用哪个组件在 Google Maps 上显示附加信息？\n\
  \n# Further reading\n\n以下是一些用于在本书章节中学到的内容之上的链接：\n\n+   - Nx Dev Tools: https://nx.dev/\n\
  +   - Nx CLI: https://nx.dev/latest/angular/getting-started/cli-overview\n+   -\
  \ NgRx: https://ngrx.io/\n+   - NgRx store guide: https://ngrx.io/guide/store\n\
  +   - Angular Material card component: https://material.angular.io/components/card/overview\n\
  +   - Angular Google Maps: https://github.com/angular/components/tree/master/src/google-maps\n\
  +   - ng2-charts: https://valor-software.com/ng2-charts/\n+   - create-nx-workspace:\
  \ https://www.npmjs.com/package/create-nx-workspace\n"
- "# 9 构建可复用 Angular 库与 Schematics\n## Building\na Component\nUI Library Using\nAngular\
  \ CLI and\nAngular CDK\n\nAngular 应用程序由组织成模块的 Angular 组件组成。当组件需要在模块之间共享相似的外观或行为时，我们将它们的功能提取到可重用组件中并分组到共享模块中。可重用组件可能从具有许多控件的复杂\
  \ **user interface**（UI）结构（例如表单）到单个原生 **HyperText Markup Language (HTML)** 元素（例如按钮）不等。\n\
  \n组件 UI 库是一组可重用组件，可以在特定应用程序域之外使用。采用 monorepo 架构构建的大型企业应用程序可以在其所有应用程序中使用这些组件。组织外部的项目也可以将相同的组件库作为外部依赖项使用。\n\
  \n\n\n\nAngular **命令行界面（CLI）** 包含了使用 Angular 创建库所需的全部工具。**Angular 组件开发工具包（CDK）**\
  \ 提供了广泛的功能，用于创建可访问且高性能的 UI 组件。在本章中，我们将把它们与 **Bulma**（一个现代的**层叠样式表（CSS）** 框架）结合起来，从头创建一个简单的组件\
  \ UI 库。\n\n在本章中，我们将更详细地介绍以下主题：\n\n- 使用 Angular CLI 创建库\n- 构建可拖拽的卡片列表\n- 与剪贴板交互\n\
  - 将 Angular 库发布到 npm\n- 将组件用作 Angular 元素\n\n## 必备的背景理论与上下文\n\nAngular CDK 包含一系列常见的交互和行为，我们可以将它们应用于\
  \ Angular 组件。它是 Angular Material 库的核心，但也可以与 Angular 应用中的任何 CSS 框架一起使用。Angular CDK\
  \ 可从 @angular/cdk npm 包中获取。\n\nAngular CLI 开箱即支持创建 Angular 库。Angular 库的功能只能在 Angular\
  \ 应用中使用，并且与特定的业务逻辑解耦。如果我们想在非 Angular 应用中使用 Angular 库，就需要将其转换为 Angular 元素。\n\n**自定义元素**是一种\
  \ Web 标准，允许创建独立于任何 JavaScript 框架的 HTML 元素。它的工作原理是声明一个自定义 HTML 标签，并将其与一个 JavaScript\
  \ 类关联。浏览器能够识别该 HTML 标签并执行该类中定义的 JavaScript 代码。\n\nAngular 元素是使用 @angular/elements\
  \ npm 包转换为自定义元素的 Angular 组件。将 Angular 组件打包为自定义元素，可以将 Angular 框架与**文档对象模型（DOM）**\
  \ 连接起来，为原生 HTML 元素赋予数据绑定、组件生命周期和变更检测等特性。\n\n## 项目概览\n\n在本项目中，我们将为 Angular 项目构建一个组件\
  \ UI 库。首先，我们将使用 Angular CLI 为我们的库搭建一个新的 Angular 工作区。然后，我们将使用 Angular CDK 和 Bulma\
  \ CSS 框架创建以下组件：\n\n- 一个可以使用拖放功能重新排列的卡片列表\n- 一个允许我们将任意内容复制到剪贴板的按钮\n\n我们将学习如何将库部署到\
  \ npm 等包注册表。最后，我们将使用 ngx-build-plus 库将其中一个组件转换为 Angular 元素，以便与非 Angular 应用共享。\n\n\
  构建时间：1½ 小时\n\n## 入门\n\n完成本项目需要以下先决条件和软件工具：\n\n- Angular CLI：一个用于 Angular 的 CLI，可在\
  \ https://angular.io/cli 找到。\n- GitHub 资料：本章的相关代码可在 https://github.com/PacktPublishing/Angular-Projects-Second-Edition\
  \ 的 Chapter09 文件夹中找到。\n\n## 使用 Angular CLI 创建库\n\n在使用 Angular CLI 开始处理 Angular 库之前，我们需要创建一个\
  \ Angular CLI 工作区。Angular CLI 工作区将包含我们的 Angular 库和一个用于测试该库的 Angular 应用。\n\n使用以下命令生成一个新的\
  \ Angular CLI 工作区：\n\n```\nng new my-components --defaults\n```\n\n上述命令将创建一个新的 Angular\
  \ CLI 工作区，其中包含一个名为 my-components 的 Angular 应用。导航到 my-components 文件夹并执行以下命令以生成一个新的\
  \ Angular 库：\n\n```\nng generate library ui-controls\n```\n\n上述命令将在工作区的 `projects`\
  \ 文件夹中创建一个 `ui-controls` 库。它将包含与创建 Angular 应用时类似的各种文件，包括以下内容：\n\n- `src\\lib`：包含库的源代码，例如模块、组件和服务。\n\
  - `src\\public-api.ts`：导出我们希望在其它 Angular 应用中公开使用的库构件。\n- `ng-package.json`：包含 ng-packagr\
  \ 库的配置，Angular CLI 在底层使用它来构建库。\n- `tsconfig.lib.json`：我们库的 TypeScript 配置文件，还包含若干\
  \ Angular 编译器选项。\n- `tsconfig.lib.prod.json`：在生产模式下构建库时使用的 TypeScript 配置文件。\n\n\
  Angular CLI 默认会在 `src\\lib` 文件夹中为我们生成一个模块、一个组件和一个服务。它还会导出它们，以便任何使用该库的 Angular 应用都可以使用。你可以在此处看到一个示例：\n\
  \n### public-api.ts\n\n```\n/*\n * Public API Surface of ui-controls\n */\n\nexport\
  \ * from './lib/ui-controls.service';\nexport * from './lib/ui-controls.component';\n\
  export * from './lib/ui-controls.module';\n```\n\n现在我们已经设置好了 Angular CLI 工作区，可以继续安装\
  \ Bulma 和 Angular CDK 库了，如下所示：\n\n1. 执行以下 npm 命令安装 Angular CDK：\n\n   ```bash\n\
  \   npm install @angular/cdk\n   ```\n\n2. 运行以下命令安装 bulma CSS 框架：\n\n   ```bash\n\
  \   npm install bulma\n   ```\n\n我们将 Angular CDK 和 Bulma 库添加到 peerDependencies 部分，以确保任何使用方应用都拥有运行我们库所需的特定版本的包。\n\
  \n> **重要说明**\n>\n> 如果你跟随本项目操作，每个包的版本号可能会有所不同。为确保使用正确的版本，请从工作区根文件夹的 package.json\
  \ 文件中复制它们。\n\n现在我们已经完成了 UI 组件库的基本设置。我们还配置了 Angular CLI 工作区自带的 Angular 应用，用于预览和测试该库。在下一节中，我们将构建库的第一个组件——一个可以重新排序的卡片列表。\n\
  \n## 构建可拖拽的卡片列表\n\n我们 UI 库的第一个组件将是一个 Bulma 卡片元素列表。每张卡片将显示标题、描述和一个锚点链接元素。我们还将能够使用\
  \ Angular CDK 拖拽卡片并更改卡片列表的顺序。构建我们的组件将包括以下任务：\n\n- 显示卡片数据\n- 添加拖放功能\n\n在下一节中，我们将首先了解如何在卡片列表上显示数据。\n\
  \n### 显示卡片数据\n\n我们的 Angular 应用应将卡片列表作为输入属性传递给组件以显示它们。让我们看看如何创建一个可拖拽的卡片组件，如下所示：\n\
  \n1. 执行以下 Angular CLI 命令创建一个 Angular 组件：\n\n```\nng generate component card-list\
  \ --project=ui-controls --export\n```\n\n上述命令将在我们 Angular CLI 工作区的 ui-controls 项目中创建一个\
  \ card-list 组件。--export 选项还会从 UiControlsModule 中导出该组件。\n\nUiControlsModule 类已经从\
  \ public-api.ts 文件中导出。因此，当我们的 Angular 应用导入 UiControlsModule 时，也将可以使用我们的组件。\n\n2.\
  \ 使用 Angular CLI 的 generate 命令为卡片数据的结构创建一个接口，如下所示：\n\n```\nng generate interface\
  \ card --project=ui-controls\n```\n\n上述命令将在我们工作区的 ui-controls 项目中创建一个 card.ts 文件。\n\
  \n3. 打开 card.ts 文件并向 Card 接口添加以下属性：\n\n```\nexport interface Card {\n  title: string;\n\
  \  description: string;\n  link: string;\n}\n```\n\n4. 打开 public-api.ts 文件并添加以下导出语句，使组件和接口可供库的使用者使用：\n\
  \n```\nexport * from './lib/card-list/card-list.component';\nexport * from './lib/card';\n\
  ```\n\n5. 打开 card-list.component.ts 文件并使用 @Input 装饰器定义一个 Input 属性，如下所示：\n\n```\n\
  import { Component, Input, OnInit } from '@angular/core';\nimport { Card } from\
  \ '../card';\n\n@Component({\n  selector: 'lib-card-list',\n  templateUrl: './card-list.component.html',\n\
  \  styleUrls: ['./card-list.component.css']\n})\nexport class CardListComponent\
  \ implements OnInit {\n  @Input() cards: Card[] = [];\n\n  constructor() { }\n}\n\
  ```\n\n```typescript\nngOnInit(): void {\n    }\n\n\n}\n```\n\n`cards` 属性将在稍后从 Angular\
  \ 应用中使用我们想要显示的卡片数据进行设置。\n\n6. 打开 `card-list.component.html` 文件，将其内容替换为以下 HTML 模板：\n\
  \n```html\n<div>\n  <div class=\"card m-4\" *ngFor=\"let card of cards\">\n    <header\
  \ class=\"card-header\">\n      <p class=\"card-header-title\">{{card.title}}</p>\n\
  \    </header>\n    <div class=\"card-content\">\n      <div class=\"content\">{{card.description}}</div>\n\
  \    </div>\n    <footer class=\"card-footer\">\n      <a [href]=\"card.link\" class=\n\
  \        \"card-footer-item\">View on Wikipedia</a>\n    </footer>\n  </div>\n</div>\n\
  ```\n\n前面的模板使用了 Bulma 库的卡片组件，并遍历 `cards` 组件属性来显示每一张卡片，使用的是 `*ngFor` 指令。\n\n7. 打开\
  \ `card-list.component.css` 文件，添加以下 CSS 样式：\n\n```css\n:host > div {\n  display:\
  \ grid;\n  grid-auto-flow: column;\n  overflow: auto;\n}\n\n.card {\n  width: 200px;\n\
  }\n```\n\n在前面的样式中，我们使用 `:host` 选择器来定位组件宿主元素中的 `div` 元素，并应用 **CSS Grid** 样式将所有卡片显示在一行中。\n\
  \n8. 打开 `ui-controls.module.ts` 文件，将 CommonModule 添加到 `@NgModule` 装饰器的 imports 数组中，如下所示：\n\
  \n```typescript\nimport { NgModule } from '@angular/core';\nimport { UiControlsComponent\
  \ } from './ui-controls.component';\nimport { CardListComponent } from './card-list/card-list.component';\n\
  import { CommonModule } from '@angular/common';\n\n@NgModule({\n  declarations:\
  \ [\n    UiControlsComponent,\n    CardListComponent\n  ],\n  imports: [CommonModule],\n\
  \  exports: [\n    UiControlsComponent,\n    CardListComponent\n  ]\n})\nexport\
  \ class UiControlsModule { }\n```\n\n在卡片列表组件模板中使用的 *ngFor 指令需要 CommonModule 类。\n\
  \n我们的组件现在已经准备好接收数据并以卡片列表的形式显示它。让我们看看如何从 Angular 应用中使用它，如下所示：\n\n1. 首先，执行以下命令来构建组件\
  \ UI 库：\n\n```\nng build ui-controls\n```\n\nAngular CLI 将开始构建该库，一旦你在终端中看到以下输出，构建就已完成：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_298_0.png)\n\n图 9.1 – 库构建输出\n\n2. 打开\
  \ `app.module.ts` 文件，将 `UiControlsModule` 类添加到 `@NgModule` 装饰器的 `imports` 数组中，如下所示：\n\
  \n```typescript\nimport { NgModule } from '@angular/core';\nimport { BrowserModule\
  \ } from '@angular/platform-browser';\nimport { UiControlsModule } from 'ui-controls';\n\
  \nimport { AppComponent } from './app.component';\n\n@NgModule({\n  declarations:\
  \ [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n    UiControlsModule\n\
  \  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\nexport class AppModule\
  \ { }\n```\n\n> **重要说明**\n> 我们从 ui-controls 命名空间（即库名）导入 UiControlsModule，而不是从工作区中的完整绝对路径导入。\n\
  \n3. 打开 app.component.ts 文件，声明一个 Card[] 类型的组件属性，如下所示：\n\n```typescript\nimport {\
  \ Component } from '@angular/core';\nimport { Card } from 'ui-controls';\nimport\
  \ { assassins } from './assassins';\n\n@Component({\n  selector: 'app-root',\n \
  \ templateUrl: './app.component.html',\n  styleUrls: ['./app.component.css']\n})\n\
  export class AppComponent {\n  title = 'my-components';\n  cards: Card[] = assassins;\n\
  }\n```\n\n我们使用 assassins.ts 文件中的演示数据来初始化 cards 组件属性，你可以在入门部分的 GitHub 仓库中找到该文件。\n\
  \n4. 打开 app.component.html 文件，将其内容替换为以下 HTML 模板：\n\n```html\n<div class=\"container\
  \ is-fluid\">\n  <h1 class=\"title\">Assassins Creed Series</h1>\n  <lib-card-list\
  \ [cards]=\"cards\"></lib-card-list>\n</div>\n```\n\n5. 要预览应用，运行 `ng serve` 并在浏览器中打开\
  \ `http://localhost:4200`。你应该会看到类似以下的内容：\n\n### 刺客信条系列\n\n![](img/efea53d01337e7b223389b38dcdb0160_300_0.png)\n\
  \n图 9.2 – 卡片列表组件\n\n卡片列表组件显示消费应用通过 `cards` 输入属性传递的数据。在下一节中，我们将进一步改进我们的组件，使我们的卡片能够更改它们在列表中的位置。\n\
  \n### 添加拖放功能\n\n卡片列表组件的一个功能是，我们将能够通过在列表内拖放卡片来更改卡片的位置。卡片列表的顺序应使用输出属性绑定发送回消费应用。\n\n\
  Angular CDK 包含一个拖放模块，我们可以用于此目的。为此，请按照以下步骤操作：\n\n1. 打开 `ui-controls.module.ts` 文件，从\
  \ `@angular/cdk/drag-drop` 命名空间导入 `DragDropModule`，如下所示：\n\n```typescript\nimport\
  \ { DragDropModule } from '@angular/cdk/drag-drop';\n```\n\n2. 将 `DragDropModule`\
  \ 类添加到 `@NgModule` 装饰器的 `imports` 数组中，如下所示：\n\n```typescript\n@NgModule({\n  declarations:\
  \ [\n    UiControlsComponent,\n    CardListComponent\n  ],\n  imports: [\n    CommonModule,\n\
  \    **DragDropModule**\n  ],\n  exports: [\n    UiControlsComponent,\n    CardListComponent\n\
  \  ]\n})\n```\n\n3. 打开 `card-list.component.html` 文件并修改模板，如下所示：\n\n```html\n<div\
  \ cdkDropListOrientation=\"horizontal\" cdkDropList\n(cdkDropListDropped)=\"sortCards($event)\"\
  >\n  <div cdkDrag class=\"card m-4\" *ngFor=\"let card of\n    cards\">\n    <header\
  \ class=\"card-header\">\n      <p class=\"card-header-title\">{{card.title}}</p>\n\
  \    </header>\n    <div class=\"card-content\">\n      <div class=\"content\">{{card.description}}</div>\n\
  \    </div>\n    <footer class=\"card-footer\">\n      <a [href]=\"card.link\" class=\n\
  \        \"card-footer-item\">View on Wikipedia</a>\n    </footer>\n  </div>\n</div>\n\
  ```\n\n首先，我们为每个卡片元素添加 `cdkDrag` 指令，以便能够通过拖动来移动它。然后，我们为容器元素添加 `cdkDropList` 指令，将其标记为放置列表。Angular\
  \ CDK 中的放置列表表示其内容可以使用拖放操作重新排序。我们将拖放方向设置为 `horizontal`，因为我们的卡片列表渲染在单行中，并且我们还将 `sortCards`\
  \ 组件方法绑定到放置列表的 `cdkDropListDropped` 事件。\n\n4. 打开 card-list.component.ts 文件并添加以下导入语句：\n\
  \n```typescript\nimport { Component, Input, Output, OnInit, EventEmitter } from\
  \ '@angular/core';\nimport { Card } from '../card';\nimport { CdkDragDrop, moveItemInArray\
  \ } from '@angular/cdk/drag-drop';\n```\n\n5. 使用 @Output 装饰器创建输出属性，并在 sortCards\
  \ 组件方法中使用它将重新排序后的列表发送给组件的消费者，如下所示：\n\n```typescript\nexport class CardListComponent\
  \ implements OnInit {\n  @Input() cards: Card[] = [];\n  @Output() cardChange =\
  \ new EventEmitter<Card[]>();\n\n  constructor() { }\n\n  ngOnInit(): void {\n \
  \ }\n\n  sortCards(event: CdkDragDrop<string[]>): void {\n    moveItemInArray(this.cards,\
  \ event.previousIndex, event.currentIndex);\n    this.cardChange.emit(this.cards);\n\
  \  }\n}\n```\n\n在前面的代码片段中，我们使用 DragDropModule 的内置方法 moveItemInArray 来更改 cards 属性的顺序。我们将包含移动卡片的先前索引和当前索引的\
  \ event 参数传递给 moveItemInArray 方法。我们还使用 cardChange 属性的 emit 方法将更改传播回 Angular 应用。\n\
  \n卡片列表组件现在获得了拖放超级能力。让我们试一试，如下所示：\n\n1. 打开 app.component.html 文件，为 lib-card-list\
  \ 组件的 cardChange 事件添加事件绑定，如下所示：\n\n```html\n<div class=\"container is-fluid\">\n\
  <h1 class=\"title\">Assassins Creed Series</h1>\n<lib-card-list [cards]=\"cards\"\
  \n(cardChange)=\"onCardChange($event)\">\n</lib-card-list>\n</div>\n```\n\n2. 打开\
  \ app.component.ts 文件并创建一个 onCardChange 方法来记录新的卡片列表，如下所示：\n\n```typescript\nonCardChange(cards:\
  \ Card[]) {\n  console.log(cards);\n}\n```\n\n3. 运行以下命令来构建库：\n\n```\nng build ui-controls\n\
  ```\n\n4. 执行 Angular CLI 的 serve 命令来启动你的应用，如下所示：\n\n```\nng serve\n```\n\n5. 尝试从列表中拖放一些卡片，并注意浏览器控制台窗口中的输出。\n\
  \n我们 UI 库的第一个组件现在已具备使其成为拖放列表的所有功能。它可以以 Bulma 卡片格式显示从我们的 Angular 应用传递的列表。它还可以使用 Angular\
  \ CDK 拖放模块更改列表中每个项目的顺序，并将更改传播回我们的应用。\n\n在下一节中，我们将创建库的第二个组件，用于将数据复制到剪贴板。\n\n\n\n\n\
  \n```\nexports: [\n  UiControlsComponent,\n  CardListComponent,\n  CopyButtonComponent\n\
  ]\n```\n\n+   5. 打开 copy-button.component.ts 文件并声明以下组件属性：\n\n```typescript\nimport\
  \ { Component, EventEmitter, Input, OnInit, Output }\nfrom '@angular/core';\n\n\
  @Component({\n  selector: 'lib-copy-button',\n  templateUrl: './copy-button.component.html',\n\
  \  styleUrls: ['./copy-button.component.css']\n})\nexport class CopyButtonComponent\
  \ implements OnInit {\n\n  @Input() data = '';\n  @Output() copied = new EventEmitter();\n\
  \n  constructor() { }\n\n  ngOnInit(): void {\n  }\n\n}\n```\n\ndata 属性将用于设置剪贴板数据，而\
  \ copied 事件将在数据成功复制到剪贴板时触发。\n\n+   6. 创建一个组件方法以触发 copied 输出事件，如下所示：\n\n```typescript\n\
  onCopy() {\n  this.copied.next();\n}\n```\n\n+   7. 打开 copy-button.component.html\
  \ 文件并用以下 HTML 模板替换其内容：\n\n```\n<button\n  class=\"button is-light is-primary\"\n\
  \  [cdkCopyToClipboard]=\"data\"\n  (cdkCopyToClipboardCopied)=\"onCopy() \">\n\
  \    Copy\n</button>\n```\n\n在前面的模板中，我们使用了一个 Bulma 按钮元素并向其附加了两个 Angular CDK 绑定。cdkCopyToClipboard\
  \ 属性绑定表示当按钮被点击时，data 组件属性将被复制到剪贴板。cdkCopyToClipboardCopied 事件绑定将在数据成功复制到剪贴板后立即调用\
  \ onCopy 组件方法。\n\n现在我们已经设置好了组件，让我们来看看如何在我们的 Angular 应用中使用它，如下所示：\n\n+   1. 打开 app.component.html\
  \ 文件并添加一个 div 元素，该元素由一个 input HTML 元素和一个 lib-copy-button 组件组成，如下所示：\n\n```\n<div\
  \ class=\"container is-fluid\">\n  <h1 class=\"title\">Assassins Creed Series</h1>\n\
  \  <lib-card-list [cards]=\"cards\"\n    (cardChange)=\"onCardChange($event)\">\n\
  \  </lib-card-list>\n  <h1 class=\"title mt-5\">Clipboard interaction</h1>\n  <div\
  \ class=\"field has-addons\">\n    <div class=\"control\">\n      <input class=\"\
  input\" type=\"text\"\n        [(ngModel)]=\"title\">\n    </div>\n    <div class=\"\
  control\">\n      <lib-copy-button [data]=\"title\"\n        (copied)=\"log()\"\
  ></lib-copy-button>\n    </div>\n  </div>\n</div>\n```\n\n在前面的模板中，我们使用 `ngModel`\
  \ 指令将组件的 `title` 属性绑定到 `input` 元素。我们还将其绑定到 `lib-copy-button` 组件的 `data` 属性，以将 `input`\
  \ 元素的内容复制到剪贴板。我们还将 `copied` 事件绑定到 `log` 组件方法。\n\n2. 打开 `app.component.ts` 文件并创建一个\
  \ `log` 方法，用于在数据复制到剪贴板时显示信息消息，如下所示：\n\n```\nlog() {\n  alert(this.title + ' copied\
  \ to the clipboard');\n}\n```\n\n3. 打开 `app.module.ts` 文件并导入 `FormsModule`，如下所示：\n\
  \n```\nimport { FormsModule } from '@angular/forms';\n\n@NgModule({\n  declarations:\
  \ [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n    UiControlsModule,\n\
  \    FormsModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\n```\n\
  \n`FormsModule` 类是 `@angular/forms` npm 包的一部分，当我们想在应用中使用 `ngModel` 时是必需的。\n\n4.\
  \ 执行以下命令以构建库，以便我们的应用可以识别新的组件：\n\n```\nng build ui-controls\n```\n\n+   5. 使用 Angular\
  \ CLI 的 `serve` 命令运行应用，你应该会得到以下输出：\n\n![](img/efea53d01337e7b223389b38dcdb0160_308_0.png)\n\
  \n图 9.3 – 剪贴板交互\n\n+   6. 在文本框中输入 `my awesome library` 并点击 **Copy** 按钮，如以下屏幕截图所示：\n\
  \n![](img/efea53d01337e7b223389b38dcdb0160_308_1.png)\n\n图 9.4 – 警告消息\n\n我们已成功创建了一个按钮，可以将其附加到\
  \ Angular 应用并直接与剪贴板交互！\n\nAngular CDK 包含各种其他组件和行为，我们可以在 Angular 应用中使用它们。当与 Bulma\
  \ 等高度可定制的 CSS 框架结合使用时，它可以创建引人注目且独特的界面。在你的 Angular 项目中尝试它们并构建一个具有丰富组件集的库。在下一节中，我们将学习如何将库发布到\
  \ npm 包注册表。\n\n## 将 Angular 库发布到 npm\n\n我们已经看到了如何构建 Angular 库并在同一存储库或组织中将其消费在 Angular\
  \ 应用中。然而，有时你可能希望通过 npm 等公共包注册表将你的库提供给基础设施之外的 Angular 项目。一个常见的情况是当你想将你的库开源，以便开发社区的其他成员也能受益。让我们看看如何将我们的\
  \ `ui-controls` 库发布到 npm，如下所示：\n\n+   1. 如果你没有 npm 账号，请导航到 https://www.npmjs.com/signup\
  \ 创建一个。否则，继续执行步骤 3。\n\n2. 输入以下详细信息并点击 **Create an Account** 按钮：\n\n## Sign Up\n\n\
  Username\n\nEmail address\n\nPassword\n\n**Note:** Your email address will be added\
  \ to the metadata of packages that you publish, so it may be seen publicly.\n\n\
  Your password should be at least 10 characters. [Learn more]()\n\nAgree to the [End\
  \ User License Agreement]() and the [Privacy Policy]().\n\nCreate an Account\n\n\
  or, Login\n\n图 9.5 – 创建 npm 账号\n\n账号创建后，你将被重定向到 npm 上的个人资料页面。\n\n3. 打开 Angular CLI\
  \ 工作区中 projects\\ui-controls 文件夹中存在的 package.json 文件，并相应地更改库的版本，如下所示：\n\n```\n{\n\
  \  \"name\": \"ui-controls\",\n  \"version\": \"1.0.0\",\n  \"peerDependencies\"\
  : {\n    \"@angular/common\": \"^12.0.2\",\n    \"@angular/core\": \"^12.0.2\",\n\
  ```\n\n做得好！你的库现在已在公共 npm 注册表上，其他开发者可以在他们的 Angular 应用中使用它。\n\n> **Important note**\n\
  > 在发布库之前，请务必更改库的 package.json 文件中的版本号。否则，npm 注册表会抛出错误，指出你尝试发布的版本已存在。也有一些 npm 包，例如\
  \ standard-version，可以为你自动化此操作。\n\n在下一节中，我们将学习如何使用 Angular Elements 在非 Angular 应用中使用我们的库。\n\
  \n## 将组件用作 Angular Elements\n\n我们已经学习了如何使用 Angular CLI 创建 Angular 库。我们还看到了如何将库发布到\
  \ npm 注册表，以便其他 Angular 项目可以使用它并从中受益。在本节中，我们将更进一步，学习如何构建 Angular 库以在非 Angular 环境中使用。\n\
  \n正如我们已经指出的那样，Angular 框架在许多方面都是跨平台的 JavaScript 框架。它可以使用 Angular Universal 在服务器上运行，并在移动平台上运行。它也可以在原生桌面环境中运行。除了这些平台之外，它甚至可以在使用\
  \ Angular Elements 的非 Angular Web 应用上运行。\n\n让我们看看如何将我们的剪贴板组件转换为 Angular Element，如下所示：\n\
  \n+   1. 执行以下 Angular CLI 命令在我们的 workspace 中生成一个新的 Angular 应用：\n\n```\nng generate\
  \ application ui-elements --defaults\n```\n\n前面的命令将使用默认选项在 projects 文件夹中生成 ui-elements\
  \ Angular 应用。\n\n> **Important note**\n> Angular CLI 目前不支持直接在 Angular 库上使用 Angular\
  \ Elements。因此，我们需要创建一个 Angular 应用，其唯一目的是将我们的组件导出为 Angular Elements。\n\n2. 运行 Angular\
  \ CLI 的以下 add schematic 以在 ui-elements 应用中安装 Angular Elements 包：\n\n```\nng add\
  \ @angular/elements --project=ui-elements\n```\n\n@angular/elements npm 包包含用于使用\
  \ Angular Elements 的所有必要构件。安装将使用最新版本更新我们工作区的 package.json 文件。它还将 document-register-element\
  \ 库导入 ui-elements 应用的 polyfills.ts 文件，以供不支持自定义元素的浏览器使用。\n\n3. 打开 ui-elements 应用的\
  \ app.module.ts 文件并删除对 AppComponent 类的任何引用。\n\n4. 在 app.module.ts 文件顶部添加以下导入语句：\n\
  \n```\nimport { Injector, NgModule } from '@angular/core';\nimport { createCustomElement\
  \ } from '@angular/elements';\nimport { BrowserModule } from '@angular/platform-browser';\n\
  import { UiControlsModule, CopyButtonComponent } from 'ui-controls';\n```\n\n5.\
  \ 将 UiControlsModule 类添加到 @NgModule 装饰器的 imports 数组中，如下所示：\n\n```\n@NgModule({\n\
  \    declarations: [],\n    imports: [\n        BrowserModule,\n        UiControlsModule\n\
  \    ],\n    providers: [],\n    bootstrap: []\n})\n```\n\n6. 向 AppModule 类添加一个构造函数并注入\
  \ Injector 服务，如下所示：\n\n```\nconstructor(private injector: Injector) {}\n```\n\n\n\
  \n\n\n7. 实现一个 ngDoBootstrap 钩子方法来为 CopyButtonComponent 类创建自定义元素，如下所示：\n\n```\nexport\
  \ class AppModule {\n\n  constructor(private injector: Injector) {}\n\n  ngDoBootstrap()\
  \ {\n    const el =\n      createCustomElement(CopyButtonComponent,\n        { injector:\
  \ this.injector });\n    customElements.define('copy-button', el);\n  }\n}\n```\n\
  \nngDoBootstrap 方法用于挂钩 Angular 应用的手动启动过程。我们使用来自 @angular/elements npm 包的 createCustomElement\
  \ 方法来创建一个自定义元素，传入组件的类和注入器。最后，我们使用 customElements 对象的 define 方法来声明自定义元素，传入我们想要使用的\
  \ HTML 选择器和自定义元素作为参数。\n\n现在我们已经实践了将 Angular 组件转换为 Angular 元素的全部流程，是时候构建它，以便在 Web\
  \ 应用中使用它了。\n\n构建 Angular 元素与构建标准的 Angular 应用不同。当我们构建 Angular 应用时，Angular CLI 会生成包含应用源代码、Angular\
  \ 框架和任何第三方库的不同 JavaScript 包。在 Angular 元素场景中，我们只想生成一个包含我们组件的包文件。为此，我们将使用 ngx-build-plus\
  \ 库，它可以生成单个包等。让我们看看如何安装它并在我们的应用中使用它，如下所示：\n\n1. 执行以下 Angular CLI 命令来安装 ngx-build-plus\
  \ 包：\n\n```\nng add ngx-build-plus --project=ui-elements\n```\n\n前面的命令将修改 Angular\
  \ CLI 工作区的 angular.json 文件，以使用 ngx-build-plus 库来构建 ui-elements 应用。\n\n2. 运行以下 Angular\
  \ CLI 构建命令来构建应用：\n\n```\nng build ui-elements --single-bundle\n```\n\n前面的命令将构建 ui-elements\
  \ 应用并为所有应用代码生成一个单一包。\n\n3. 将 dist\\ui-elements 文件夹复制到硬盘上你选择的另一个位置并使用你的集成开发环境（IDE）打开\
  \ index.html 文件。\n\n4. 从 head 元素中移除 <base> 标签并使用内容分发网络（CDN）添加 Bulma CSS 压缩文件，如下所示：\n\
  \n```\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css\"\
  >\n```\n\n5. 在 body 元素中用以下 HTML 片段替换 app-root 选择器：\n\n```\n<div class=\"container\
  \ is-fluid\">\n<h1 class=\"title\">My Angular Element</h1>\n<copy-button></copy-button>\n\
  </div>\n```\n\n在前面的片段中，我们添加了一个使用 Bulma CSS 类样式化的 div 元素，以及我们在 AppModule 中定义的 Angular\
  \ 元素的选择器。\n\n6. 在 div 元素之后插入以下 JavaScript 代码：\n\n```\n<script>\nconst el = document.getElementsByTagName(\n\
  'copy-button')[0];\nel.setAttribute('data', 'Some data');\nel.addEventListener('copied',\
  \ () => alert('Copied to\nclipboard'));\n</script>\n```\n\n在前面的脚本中，我们使用原生 JavaScript\
  \ 与隐藏在 Angular 元素后面的组件进行通信。首先，我们查询全局 document 对象以获取对 Angular 元素的引用。然后，我们使用元素的 setAttribute\
  \ 方法设置 data 输入属性。最后，我们通过使用 addEventListener 方法附加事件监听器来监听 copied 输出事件。\n\n7. 使用你的浏览器打开\
  \ `index.html` 文件，你应该会看到以下输出：\n\n![](img/efea53d01337e7b223389b38dcdb0160_315_0.png)\n\
  \n图 9.6 – Angular 元素\n\n8. 点击 **Copy** 按钮，你应该会看到以下警告对话框：\n\n![](img/efea53d01337e7b223389b38dcdb0160_315_1.png)\n\
  \n图 9.7 – 警告对话框\n\n我们已经成功地将我们 UI 组件库中的一个 Angular 组件作为原生 HTML 元素用在一个与 Angular 无关的\
  \ Web 应用中！自定义元素的外观和行为与它的 Angular 对应版本相同。唯一的区别是我们如何使用纯 JavaScript 在 Web 应用中设置和配置自定义元素。\n\
  \n## Summary\n\n在本项目中，我们构建了一个组件 UI 库，可以在我们的 Angular 应用中使用。最初，我们学习了如何使用 Angular CLI\
  \ 创建 Angular 库。我们搭建了一个新的 Angular CLI 工作区，其中包含我们的 Angular 库，以及用于测试它的 Angular 应用。\n\
  \n然后我们使用 Angular CDK 和 Bulma CSS 框架构建了我们库的 UI 组件。我们创建了一个可以使用拖放功能重新排序的卡片列表，以及一个用于将内容复制到剪贴板的按钮。\n\
  \n我们还看到了如何将我们的库发布到 npm 仓库以在其他 Angular 项目中使用它。最后，我们使用 Angular Elements 将其转换为自定义元素以分发给非\
  \ Angular 应用。\n\n在下一项目中，即本书的最后一个项目，我们将学习如何自定义 Angular CLI 来创建我们的生成 schematics。\n\
  \n## Essential background theory and context\n\nAngular schematics 是可以使用 npm 安装的库。它们用于各种情况，包括创建具有标准用户界面的组件，甚至在组织内部强制执行约定和编码指南。schematic\
  \ 可以独立使用，也可以作为现有 Angular 库的伴侣。\n\nAngular schematics 被打包到集合中，它们位于 @schematics/angular\
  \ npm 包中。当我们使用 Angular CLI 运行 ng add 或 ng build 命令时，它会运行该包中的相应 schematic。Angular\
  \ CLI 目前支持以下类型的 schematics：\n\n- **Add schematic**：这用于使用 ng add 命令在 Angular CLI\
  \ 工作区中安装 Angular 库。\n- **Update schematic**：这用于使用 ng update 命令更新 Angular 库。\n- **Generate\
  \ schematic**：这用于使用 ng generate 命令在 Angular CLI 工作区中生成 Angular 工件。\n\n在本项目中，我们将专注于\
  \ generate schematics，但相同的规则适用于所有其他命令。\n\n## Project overview\n\n在本项目中，我们将学习如何使用\
  \ schematics API 构建自定义 Angular CLI generate schematics 来创建组件和服务。首先，我们将构建一个用于创建在模板中使用\
  \ Tailwind CSS 框架的 Angular 组件的 schematic。然后，我们将创建一个 schematic 来生成一个 Angular 服务，该服务默认注入内置\
  \ HTTP 客户端并为 CRUD 操作中的每个 HTTP 请求创建一个方法。\n\n构建时间：1 小时\n\n## Getting started\n\n完成本项目需要以下先决条件和软件工具：\n\
  \n- Angular CLI：Angular 的命令行界面，可在 https://angular.io/cli 找到。\n- GitHub 资料：本章的代码可在\
  \ https://github.com/PacktPublishing/Angular-Projects-Second-Edition 的 Chapter10\
  \ 文件夹中找到。\n\n## Installing the schematics CLI\n\nschematics CLI 是一个命令行界面，我们可以使用它与\
  \ schematics API 交互。要安装它，运行以下 npm 命令：\n\n```bash\nnpm install -g @angular-devkit/schematics-cli\n\
  ```\n\n前面的命令将在我们的系统上全局安装 @angular-devkit/schematics-cli npm 包。然后我们可以使用 schematics\
  \ 可执行文件创建一个新的 schematics 集合：\n\n```bash\nschematics blank my-schematics\n```\n\n\
  前面的命令将生成一个名为 my-schematics 的 schematics 项目。它默认在 src 文件夹内包含一个同名的 schematic。schematic\
  \ 包含以下文件：\n\n- `collection.json`：描述属于 my-schematics 集合的 schematics 的 JSON 模式\n-\
  \ `my-schematics\\index.ts`：my-schematics schematic 的主要入口点\n- `my-schematics\\index_spec.ts`：my-schematics\
  \ schematic 主要入口点的单元测试文件\n\n集合的 JSON 模式文件为与该集合关联的每个 schematic 包含一个条目：\n\n### collection.json\n\
  \n```json\n{\n  \"$schema\": \"../node_modules/@angular-devkit/schematics/collection-schema.json\"\
  ,\n  \"schematics\": {\n    \"my-schematics\": {\n      \"description\": \"A blank\
  \ schematic.\",\n      \"factory\": \"./my-schematics/index#mySchematics\"\n   \
  \ }\n  }\n}\n```\n\n\n\n\n集合中的每个原理图都包含一个简短描述（由 `description` 属性指示），以及一个 `factory`\
  \ 属性，该属性使用特殊语法指向该原理图的主入口点。它包含文件名 `./my-schematics/index`，后跟 `#` 字符，以及该文件导出的函数名 `mySchematics`。\n\
  \n原理图的主入口点包含一个默认导出的规则工厂方法，该方法返回一个 `Rule` 对象：\n\n### index.ts\n\n```typescript\n\
  import { Rule, SchematicContext, Tree } from '@angular-devkit/schematics';\n\n//\
  \ You don't have to export the function as default.\n// You can also have more than\
  \ one rule factory\n// per file.\nexport function mySchematics(options: any): Rule\
  \ {\n  return (tree: Tree, _context: SchematicContext) => {\n    return tree;\n\
  \  };\n}\n```\n\n原理图不直接与文件系统交互。相反，它会创建一个由 `Tree` 对象表示的虚拟文件系统。虚拟文件系统包含一个暂存区，原理图的所有转换都在此发生。该区域旨在确保任何无效的转换都不会传播到实际文件系统。一旦原理图可以有效执行，虚拟文件系统就会将更改应用到真实文件系统。原理图的所有转换都在\
  \ `SchematicContext` 对象中操作。\n\n在下一节中，我们将学习如何使用原理图 CLI 并创建一个组件生成原理图。\n\n## 创建 Tailwind\
  \ 组件\n\nTailwind 是一个非常流行的 CSS 框架，它遵循实用优先的核心原则。它包含可在 Angular 应用程序中使用的类和样式，用于创建易于组合的用户界面。\n\
  \n我们将使用 Angular CLI 的原理图 API 为 Angular 组件构建一个生成原理图。该原理图将生成一个使用 Tailwind 容器布局进行样式设置的新\
  \ Angular 组件。\n\n> **重要提示**\n> \n> 我们将构建的原理图默认不需要安装 Tailwind CSS。但是，我们将使用该原理图的应用程序需要安装它。\n\
  \n让我们看看如何实现这一点：\n\n1. 执行以下原理图 CLI 命令，向我们的集合中添加一个新原理图：\n   \n   ```bash\n   schematics\
  \ blank tailwind-container\n   ```\n   \n   上述命令将更新 `collection.json` 文件，使其包含 `tailwind-container`\
  \ 原理图的新条目。它还将在我们工作区的 `src` 文件夹中创建一个 `tailwind-container` 文件夹。\n\n2. 在 `tailwind-container`\
  \ 文件夹内创建一个 `schema.json` 文件，并添加以下内容：\n\n```json\n{\n  \"$schema\": \"http://json-schema.org/schema\"\
  ,\n  \"id\": \"TailwindContainerSchema\",\n  \"title\": \"My Tailwind Container\
  \ Schema\",\n  \"type\": \"object\",\n  \"properties\": {\n    \"name\": {\n   \
  \   \"description\": \"The name of the component.\",\n      \"type\": \"string\"\
  \n    },\n    \"path\": {\n      \"type\": \"string\",\n      \"format\": \"path\"\
  ,\n      \"description\": \"The path to create the component.\",\n      \"visible\"\
  : false\n    }\n  },\n  \"required\": [\"name\"]\n}\n```\n\n每个原理图都可以有一个 JSON schema\
  \ 文件，用于定义运行原理图时可用的选项。由于我们要创建一个组件生成原理图，因此需要为组件提供 `name` 和 `path` 属性。每个属性都有与之关联的元数据，例如类型和描述。如\
  \ `required` 数组属性所示，调用原理图时组件名称是必需的。\n\n3. 打开 `collection.json` 文件，按如下方式设置 `tailwind-container`\
  \ 原理图的属性：\n\n```json\n{\n  \"$schema\": \"../node_modules/@angular-devkit/schematics/collection-schema.json\"\
  ,\n  \"schematics\": {\n    \"my-schematics\": {\n      \"description\": \"A blank\
  \ schematic.\",\n      \"factory\": \"./my-schematics/index#mySchematics\"\n   \
  \ },\n    \"tailwind-container\": {\n      \"description\": \"Generate a Tailwind\
  \ container component\",\n      \"factory\": \"./tailwind-container/index#tailwindContainer\"\
  ,\n      \"schema\": \"./tailwind-container/schema.json\"\n    }\n  }\n}\n```\n\n\
  在上述文件中，我们为原理图设置了适当的描述。我们还添加了 `schema` 属性，该属性指向我们在第 3 步中创建的 `schema.json` 文件的绝对路径。\n\
  \n4. 在 `tailwind-container` 文件夹内创建一个 `schema.ts` 文件，并添加以下内容：\n\n```typescript\n\
  export interface Schema {\n    name: string;\n    path: string;\n}\n```\n\n上述文件定义了\
  \ `Schema` 接口，其中包含与 `schema.json` 文件中定义的属性相对应的映射属性。\n\n我们现在已经创建了用于创建原理图的所有底层基础设施。让我们看看如何编写将运行我们原理图的实际代码：\n\
  \n1. 在 `tailwind-container` 文件夹内创建一个名为 `files` 的文件夹。\n\n2. 在 `files` 文件夹内创建一个名为\
  \ `__name@dasherize__.component.html.template` 的文件，并添加以下内容：\n\n```html\n<div class=\"\
  container mx-auto\">\n</div>\n```\n\n上述文件表示我们原理图将生成的组件的模板。`__name` 前缀将被我们作为原理图选项传递的组件名称替换。`@dasherize__`\
  \ 语法表示如果以驼峰式传递名称，则该名称将用短划线分隔并转换为小写。\n\n3. 创建一个名为 `__name@dasherize__.component.ts.template`\
  \ 的文件，并添加以下内容：\n\n```typescript\nimport { Component } from '@angular/core';\n\n\
  @Component({\n    selector: 'my-<%= dasherize(name) %>',\n    templateUrl: './<%=\
  \ dasherize(name) %>.component.html'\n})\nexport class My<%= classify(name) %>Component\
  \ {}\n```\n\n上述文件包含将要生成的组件的 TypeScript 类。`@Component` 装饰器的 `selector` 和 `templateUrl`\
  \ 属性使用 `dasherize` 方法和组件名称构建。类名包含一个名为 `classify` 的不同方法，该方法以组件名称为参数并将其转换为标题大小写。\n\
  \n4. 打开 `tailwind-container` 文件夹的 `index.ts` 文件，将 `options` 的类型设置为 `Schema`，并删除\
  \ `return` 语句：\n\n```typescript\nimport { Rule, SchematicContext, Tree } from '@angular-devkit/schematics';\n\
  import { Schema } from './schema';\n\n// You don't have to export the function as\
  \ default.\n// You can also have more than one rule factory\n// per file.\nexport\
  \ function tailwindContainer(_options: Schema): Rule {\n  return (_tree: Tree, _context:\
  \ SchematicContext) => {};\n}\n```\n\n5. 在文件顶部添加以下 import 语句：\n\n```typescript\n\
  import { normalize, strings } from '@angular-devkit/core';\nimport { apply, applyTemplates,\
  \ chain, mergeWith, move, Rule, SchematicContext, Tree, url } from '@angular-devkit/schematics';\n\
  import { Schema } from './schema';\n```\n\n6. 在 `tailwindContainer` 函数内插入以下代码：\n\
  \n```typescript\n_options.path = _options.path ?? normalize('src/app/' + _options.name\
  \ as string);\n\n  const templateSource = apply(url('./files'), [\n    applyTemplates({\n\
  \      classify: strings.classify,\n      dasherize: strings.dasherize,\n      name:\
  \ _options.name\n    }),\n    move(normalize(_options.path as string))\n]);\n```\n\
  \n在上述代码中，首先，我们在原理图中未传递组件 `path` 属性的情况下设置该属性。默认情况下，我们在 `src\\app` 文件夹内创建一个与组件同名的文件夹。然后，我们使用\
  \ `apply` 方法从 `files` 文件夹读取模板文件，并使用 `applyTemplates` 函数传递 `dasherize`、`classify`\
  \ 和 `name` 属性。最后，我们调用 `move` 方法在提供的路径中创建生成的组件文件。\n\n7. 在工厂函数末尾添加以下语句：\n\n```typescript\n\
  return chain([\n    mergeWith(templateSource)\n]);\n```\n\n在上述代码片段中，我们调用 `chain`\
  \ 方法来执行我们的原理图，并传递 `mergeWith` 函数的结果，该函数使用我们在 *第 6 步* 中创建的 `templateSource` 变量。\n\
  \n现在我们可以继续测试我们的新组件原理图：\n\n1. 执行以下 `npm` 命令来构建原理图：\n\n```bash\nnpm run build\n```\n\
  \n上述命令将调用 TypeScript 编译器，并将 TypeScript 源文件转译为 JavaScript。它将在与 TypeScript 文件相同的文件夹中并排生成\
  \ JavaScript 输出文件。\n\n2. 运行以下命令，将原理图库安装到我们的全局 npm 缓存中：\n\n```bash\nnpm link\n```\n\
  \n上述命令用于使我们稍后可以安装原理图，而无需查询公共 npm 注册表。\n\n3. 在工作区外你选择的文件夹中执行以下 Angular CLI 命令，以使用默认选项搭建一个新的\
  \ Angular 应用程序：\n\n```bash\nng new my-app --defaults\n```\n\n\n\n\n\n## 创建 HTTP\
  \ 服务\n\n为了构建我们的原理图库，我们将创建一个用于搭建 Angular 服务的原理图。它会生成一个导入内置 HTTP 客户端的服务，并且包含 CRUD\
  \ 操作中每个 HTTP 请求对应的一个方法。\n\n我们将要构建的生成原理图不会独立运行。相反，我们会将其与 Angular CLI 现有的服务生成原理图结合起来。因此，我们不需要单独的\
  \ JSON schema。\n\n让我们从创建原理图开始：\n\n- 1. 执行以下命令，向我们的集合中添加一个新的原理图：\n\n  ```\n  schematics\
  \ blank crud-service\n  ```\n\n- 2. 打开 collection.json 文件，并为该原理图提供描述性说明：\n\n  ```\n\
  \  \"crud-service\": {\n    \"description\": \"Generate a CRUD HTTP service\",\n\
  \    \"factory\": \"./crud-service/index#crudService\"\n  }\n  ```\n\n- 3. 在工作区的\
  \ crud-service 文件夹内创建一个名为 files 的文件夹。\n\n- 4. 在 files 文件夹内创建一个名为 `__name@dasherize__.service.ts.template`\
  \ 的文件，并添加以下代码：\n\n  ```\n  import { Injectable } from '@angular/core';\n  import\
  \ { HttpClient } from '@angular/common/http';\n  import { Observable } from 'rxjs';\n\
  \n  @Injectable({\n    providedIn: 'root'\n  })\n  export class <%= classify(name)\
  \ %>Service {\n    constructor(private http: HttpClient) { }\n  }\n  ```\n\n上面的文件是我们的原理图将要生成的\
  \ Angular 服务文件的模板。它默认在类的构造函数中注入 `HttpClient` 服务。\n\n- 2. 重命名 `tree` 参数，并将其从 return\
  \ 语句中移除，因为我们不会用到它。由此产生的工厂函数应如下所示：\n\n  ```\n  export function crudService(_options:\
  \ any): Rule {\n    return (_tree: Tree, _context: SchematicContext) =>\n      {};\n\
  \  }\n  ```\n\n- 3. 在 `crudService` 函数中添加以下代码片段：\n\n  ```\n  const templateSource\
  \ = apply(url('./files'), [\n    applyTemplates({\n      ..._options,\n      classify:\
  \ strings.classify,\n      dasherize: strings.dasherize\n    }),\n    move(normalize(_options.path\
  \ ??\n      normalize('src/app/')))\n  ]);\n  ```\n\n上面的代码片段与我们用于组件原理图的代码片段看起来完全相同。主要区别在于默认路径是\
  \ `src/app` 文件夹，并且我们通过 `_options` 参数将所有可用的选项传递给原理图。\n\n> **重要说明**\n>\n> 我们无法预先知道哪些选项会被用来生成\
  \ Angular 服务。因此，我们使用*展开*运算符将所有可用选项传递给 `templateSource` 方法。这也是 `_options` 参数类型为 `any`\
  \ 的原因。\n\n- 4. 在函数末尾添加以下 return 语句：\n\n  ```\n  return chain([\n    externalSchematic('@schematics/angular',\
  \ 'service',\n      _options),\n    mergeWith(templateSource, MergeStrategy.Overwrite)\n\
  \  ]);\n  ```\n\n在上述语句中，我们首先使用 `externalSchematic` 方法调用内置的生成原理图来创建 Angular 服务。然后，我们将执行该原理图得到的结果与我们的\
  \ `templateSource` 变量合并。我们还使用 `MergeStrategy.Overwrite` 定义了合并操作的策略，以便我们原理图所做的任何更改都会覆盖默认的更改。\n\
  \n我们用于创建 CRUD 服务的原理图现已完成。让我们在示例应用程序中使用它：\n\n- 1. 执行以下命令来构建原理图库：\n\n  ```\n  npm\
  \ run build\n  ```\n\n  > **提示**\n  >\n  > 我们不需要再次链接原理图库。只要我们重新构建原理图，我们的应用程序就会自动更新。\n\
  \n- 2. 导航到我们的应用程序所在的 `my-app` 文件夹。\n\n- 3. 执行以下命令，使用我们的新原理图生成一个 Angular 服务：\n\n\
  \  ```\n  ng generate my-schematics:crud-service --name=customers\n  ```\n\n  我们使用\
  \ Angular CLI 的 generate 命令，再次传入我们原理图集合的名称，但这次目标是 crud-service 原理图。\n\n- 4. 新的 Angular\
  \ 服务创建在 `src/app` 文件夹中，终端窗口中的输出如下所示：\n\n  ```\n  CREATE src/app/customers.service.spec.ts\
  \ (372 bytes)\n  CREATE src/app/customers.service.ts (545 bytes)\n  ```\n\n图 10.2\
  \ —— 生成 Angular 服务\n\n请注意，该原理图自动为我们生成了一个单元测试文件。这怎么可能呢？嗯，回想一下，我们将自己的原理图与 Angular\
  \ CLI 内置的生成原理图合并了。所以，默认原理图所做的任何操作，都会直接反映到自定义原理图的执行中。\n\n我们刚刚为原理图集合添加了一个有用的新命令。我们可以生成一个与\
  \ HTTP 端点交互的 Angular 服务。此外，我们还添加了与端点通信所需的基本方法。\n\n![](img/efea53d01337e7b223389b38dcdb0160_333_0.png)\n\

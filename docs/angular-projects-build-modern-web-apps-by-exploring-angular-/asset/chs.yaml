  \ Previewing photos with CesiumJS\n\n我们应用的下一个功能将是在 3D 地图上显示我们用相机拍摄的所有照片。CesiumJS\
  \ 库提供了一个带有 3D 地球仪的查看器，我们可以用它来可视化各种事物，例如特定位置的图像。我们应用的这个新功能将包括以下内容：\n\n- Configuring\
  \ CesiumJS\n- Displaying photos on the viewer\n\n我们将首先学习如何设置 CesiumJS 库。\n\n###\
  \ Configuring CesiumJS\n\nCesiumJS 库是一个 npm 包，我们可以安装它来开始使用 3D 地图和可视化：\n\n1. 运行以下\
  \ npm 命令安装 CesiumJS：\n\n   ```bash\n   npm install cesium\n   ```\n\n\n\n2. 打开 `angular.json`\
  \ 配置文件，并在 `build` 架构选项的 `assets` 数组中添加以下条目：\n\n```\n\"assets\": [\n  {\n    \"glob\"\
  : \"**/*\",\n    \"input\": \"src/assets\",\n    \"output\": \"assets\"\n  },\n\
  \  {\n    \"glob\": \"**/*.svg\",\n    \"input\": \"node_modules/ionicons/dist/ionicons/svg\"\
  ,\n    \"output\": \"./svg\"\n  },\n  {\n    \"glob\": \"**/*\",\n    \"input\"\
  : \"node_modules/cesium/Build/Cesium\",\n    \"output\": \"/assets/cesium\"\n  }\n\
  ]\n```\n\n前面的条目将在运行时将所有 CesiumJS 源文件复制到我们应用程序的 `assets` 文件夹内的 `cesium` 文件夹中。\n\n\
  3. 还将 CesiumJS widgets 样式表文件添加到 `build` 部分的 `styles` 数组中：\n\n```\n\"styles\": [\n\
  \  \"node_modules/cesium/Build/Cesium/Widgets/widgets.css\",\n  \"src/theme/variables.scss\"\
  ,\n  \"src/global.scss\"\n]\n```\n\nCesiumJS 的查看器包含一个带有小部件的工具栏，包括搜索栏和用于选择特定地图类型的下拉菜单，例如\
  \ Bing Maps 或 Mapbox。\n\n4. 打开我们应用程序的主入口点文件 `main.ts`，并添加以下行：\n\n```\n// eslint-disable-next-line\
  \ @typescript-eslint/dot-\n// notation\nwindow['CESIUM_BASE_URL'] = '/assets/cesium/';\n\
  ```\n\n`CESIUM_BASE_URL` 全局变量指示 CesiumJS 源文件的位置。\n\n5. 使用以下 npm 命令安装自定义 webpack\
  \ 构建器：\n\n```\nnpm install -D @angular-builders/custom-webpack\n```\n\n**builder**\
  \ 是扩展 Angular CLI 默认功能的 Angular 库。`@angular-builders/custom-webpack` 构建器允许我们在构建应用程序时提供额外的\
  \ webpack 配置文件。当我们想要包含额外的 webpack 插件或覆盖现有功能时，它是有益的。\n\n6. 在项目的根文件夹中创建一个名为 `extra-webpack.config.js`\
  \ 的新 webpack 配置文件并添加以下内容：\n\n```\nmodule.exports = {\n  resolve: {\n    fallback:\
  \ {\n      fs: \"empty\",\n      Buffer: false,\n      http: \"empty\",\n      https:\
  \ \"empty\",\n      zlib: \"empty\"\n    }\n  },\n  module: {\n    unknownContextCritical:\
  \ false\n  }\n};\n```\n\n该配置文件将确保 webpack 不会尝试加载 CesiumJS 无法理解的代码。CesiumJS 使用 webpack\
  \ 无法从静态分析中得知的模块格式。\n\n7. 打开 `angular.json` 文件并将 `build` 架构部分的 `builder` 属性更改为使用自定义\
  \ webpack 构建器：\n\n```\n\"builder\": \"@angular-builders/custom-webpack:browser\"\
  \n```\n\n8. 在 `build` 部分的 `options` 属性中定义自定义 webpack 配置文件的路径：\n\n```\n\"customWebpackConfig\"\
  : {\n    \"path\": \"./extra-webpack.config.js\"\n}\n```\n\n9. 配置 `serve` 架构部分以使用自定义\
  \ webpack 构建器：\n\n```\n\"serve\": {\n    \"builder\": \"@angular-builders/custom-webpack:\n\
  \        dev-server\",\n    \"options\": {\n        \"browserTarget\": \"app:build\"\
  \n    },\n    \"configurations\": {\n        \"production\": {\n            \"browserTarget\"\
  : \"app:build:production\"\n        },\n        \"ci\": {\n            \"progress\"\
  : false\n        }\n    }\n}\n```\n\n10. 打开 `tsconfig.app.json` 文件并在 `compilerOptions`\
  \ 属性中添加 cesium 类型：\n\n```\n\"compilerOptions\": {\n    \"outDir\": \"./out-tsc/app\"\
  ,\n    \"types\": [\"cesium\"]\n}\n```\n\n现在我们已经完成了 CesiumJS 库的配置，我们可以开始为我们的功能创建页面：\n\
  \n1. 运行 Ionic CLI 的以下命令来创建一个新页面：\n\n```\n```bash\nionic generate page view\n```\n\
  ```\n\n2. 打开 `view.page.html` 文件并修改 `ion-header` 元素，使其包含菜单切换按钮：\n\n```\n```html\n\
  <ion-header>\n  <ion-toolbar>\n    <ion-buttons slot=\"start\">\n      <ion-menu-button\
  \ color=\"primary\">\n      </ion-menu-button>\n    </ion-buttons>\n    <ion-title>View\
  \ gallery</ion-title>\n  </ion-toolbar>\n</ion-header>\n```\n```\n\n3. 在 `ion-content`\
  \ 元素内部添加一个 `div` 元素，它将作为我们查看器的容器：\n\n```\n```html\n<ion-content>\n  <div #mapContainer></div>\n\
  </ion-content>\n```\n```\n\n`#mapContainer` 是一个 **模板引用变量**，我们用它为模板中的元素声明一个别名。\n\n\
  4. 打开 `view.page.scss` 文件并设置地图容器元素的大小：\n\n```\n```scss\ndiv {\n  height: 100%;\n\
  \  width: 100%;\n}\n```\n```\n\n5. 现在让我们创建我们的查看器。打开 `view.page.ts` 文件并按如下方式修改它：\n\
  \n```\nimport { AfterViewInit, Component, OnInit, ElementRef, ViewChild } from '@angular/core';\n\
  import { Viewer } from 'cesium';\n\n@Component({\n  selector: 'app-view',\n  templateUrl:\
  \ './view.page.html',\n  styleUrls: ['./view.page.scss'],\n})\nexport class ViewPage\
  \ implements OnInit, AfterViewInit {\n\n  @ViewChild('mapContainer') content: ElementRef;\n\
  \n  constructor() { }\n\n  ngOnInit() {\n  }\n\n  ngAfterViewInit() {\n    const\
  \ viewer = new\n      Viewer(this.content.nativeElement);\n  }\n}\n```\n\n我们在组件的\
  \ `ngAfterViewInit` 方法内部创建一个新的 `Viewer` 对象。`ngAfterViewInit` 方法在组件的视图完成加载时被调用，并且它在\
  \ `AfterViewInit` 接口中定义。`Viewer` 类的构造函数接受我们想要创建查看器的原生 HTML 元素作为参数。在我们的例子中，我们希望将其附加到我们之前创建的地图容器元素。因此，我们使用\
  \ `@ViewChild` 装饰器通过将模板引用变量名作为参数传递来引用该元素。\n\n6. 使用 `ionic serve` 运行应用程序并从主菜单中单击\

  md: "# Plotting Sensor Data\n\nWe can read sensor data from built-in sensor devices\
    \ on Arduino Nano 33 IoT. In this section, we will plot our sensor using the Serial\
    \ Plotter tool from Arduino. For testing, we will use previous projects that read\
    \ the Gyroscope sensor.\n\nYou can open Arduino software. We initialize our Gyroscope\
    \ sensor and serial communication on the setup() function. We set serial baudrate\
    \ 115200 and initialize Gyroscope by calling the IMU.begin() function.\n\n```\n\

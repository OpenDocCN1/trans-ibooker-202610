- pgno: 21
  md: "![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_21_0.png)\n\n*Figure 1-8.* Blinking\
    \ LED on Arduino Nano 33 IoT\n\n# How does it work?\n\nArduino Nano 33 IoT board\
    \ has one built-in LED on digital pin 13. In our program, we set digital pin 13\
    \ as digital output using pinMode(). We initialize this data on the setup() function.\n\
    \n```\n```cpp\nvoid setup() {\n  // initialize digital pin LED_BUILTIN as an output.\n\
    \  pinMode(LED_BUILTIN, OUTPUT);\n}\n```\n```\n\nThe Arduino program defines LED_BUILTIN\
    \ for a general of built-in LED pin. We can set the pin as output mode by giving\
    \ a value, OUTPUT. Now our program will run continuously on the loop() function.\
    \ We turn on LED and then turn off the LED. We can use digitalWrite() to perform\
    \ on/off on the LED. Set the value to HIGH to turn on the LED. Otherwise, we can\
    \ turn off the LED by sending a value of LOW on the digitalWrite() function. We\
    \ also set a delay for turning the LED on/off. We set 1000 ms on the delay() function."
  merge: -1
  img_proc: true
- pgno: 22
  md: "```\nvoid loop() {\n    digitalWrite(LED_BUILTIN, HIGH);    // turn the LED\
    \ on (HIGH\n                                    is the voltage level)\n    delay(1000);\
    \                        // wait for a second\n    digitalWrite(LED_BUILTIN, LOW);\
    \     // turn the LED off by\n                                    making the voltage\
    \ LOW\n    delay(1000);                        // wait for a second\n}\n```\n\n\
    You can practice the blinking LED program.\n\nNext, we can use the Arduino web\
    \ editor for alternative tools for Arduino development. We just need a browser\
    \ and Internet access.\n\n# Arduino Web Editor\n\nArduino provides an online editor\
    \ to build Arduino programs. The advantage of online editor is that we don’t prepare\
    \ too many runtimes and tools. We only need a browser and Internet connection.\n\
    \nWe can access the Arduino web editor using any browser. You can navigate to\
    \ the link https://create.arduino.cc/editor. Figure 1-9 shows the Arduino web\
    \ editor model. To use Arduino web editor, we must register in the Arduino portal\
    \ to build the Arduino program.\n\nIn this section, we will focus on getting started\
    \ with Arduino web editor. We will perform these tasks to complete our Arduino\
    \ development with online web editor:\n\n+   - Register your Arduino portal account\n\
    +   - Install Arduino plug-in\n+   - Build blink application for Arduino Nano\
    \ 33 IoT"
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_23_0.png)


    Figure 1-9. Arduino web editor


    # Registering an Arduino Account


    To use and build the Arduino program with Arduino web editor, we must register
    an Arduino account. This account is a similar account to that used to buy the
    Arduino board in the Arduino store.


    You can register a new Arduino account on the right-top menu icon. You can fill
    personal information through this portal. After completed account registration,
    we can build the Arduino program with Arduino web editor.


    # Installing Arduino Plug-in


    To enable our Arduino Nano 33 IoT to connect to Arduino web editor, we need to
    install the Arduino plug-in. This is a required task for Windows. The Arduino
    plug-in will act as a bridge between local Arduino Nano 33 IoT and the Arduino
    web editor.'
  merge: -1
  img_proc: true

    \ (1);\n}\n```\n```\n\nNow we set our BLE radio name by calling BLE.setLocalName().\
    \ This name will be detected on the BLE reader. We also set BLE UUID by calling\
    \ the BLE.setAdvertisedServiceUuid() function. BLE UUID represents a 128-bit value\
    \ computed. You can generate UUID using this online tool, https://www.guidgenerator.com/online-guid-generator.aspx.\n\
    \n```\n```cpp\nBLE.setLocalName(\"HelloBLE\");\nBLE.setAdvertisedServiceUuid(\"\
    19B10000-E8F2-537E-4F6C-D104768A1214\");\n\n// start advertising\nBLE.advertise();\n\
    Serial.println(\"Bluetooth device active, waiting for connections...\");\n}\n\
    ```\n```\n\nMake sure your BLE UUID complies with standard BLE SIG. Some BLE UUIDs\
    \ are reserved by their services. You can check these services at this link, https://www.bluetooth.com/specifications/assigned-numbers/service-discovery/.\n\
    \nNext, we wait for the incoming BLE reader on the loop() function. We can call\
    \ BLE.central() to wait for BLE readers.\n\n```\n```cpp\nvoid loop() {\n    //\
    \ wait for a BLE central\n    BLEDevice central = BLE.central();\n```\n```"

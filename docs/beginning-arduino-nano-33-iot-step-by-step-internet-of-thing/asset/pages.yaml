  md: '# Displaying Sensor Data with Organic Light-Emitting Diode I2C Display


    In this section, we want to display sensor data on an organic light-emitting diode
    (OLED) display. There are two interface models on OLED display: serial peripheral
    interface (SPI) and I2C. In this demo, we will use the OLED I2C display. You can
    buy any OLED I2C display module in a local electronic store. You can probably
    find it on Aliexpress or Alibaba.


    For this demo, I use the OLED I2C display with 0.96 inch or 128 x 64 pixels. You
    can see my OLED I2C display in Figure 3-8.


    ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_99_0.png)


    Figure 3-8. OLED 0.96-inch I2C display


    You can use any display size for the OLED I2C display. Next, we will wire the
    OLED I2C display for Arduino Nano 33 IoT.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Wiring for Arduino Nano 33 IoT and the OLED I2C Display


    We use the OLED display with an I2C interface so we can connect this OLED display
    to Arduino Nano 33 IoT over I2C pins. You can see my wiring in Figure 3-9. You
    can perform this wiring as follows:


    +   - The OLED I2C display module serial data is connected to the Arduino A4 pin.

    +   - The OLED I2C display module serial clock is connected to the Arduino A5
    pin.

    +   - The OLED I2C display module voltage common collector (VCC) is connected
    to Arduino 3.3V.

    +   - The OLED I2C display module ground (GND) is connected to the Arduino GND
    pin.


    ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_100_0.png)


    Figure 3-9. Wiring the OLED I2C display on Arduino Nano 33 IoT'
  merge: -1
  img_proc: true

  md: '# CHAPTER 4


    # Arduino Nano 33 IoT Networking


    Arduino Nano 33 IoT is designed for IoT implementation. This board has a network
    module, WiFi, which enables communication with other systems. In this chapter,
    we focus on how Arduino Nano 33 IoT accesses and collaborates with external systems,
    such as servers.


    You will learn the following topics in this chapter:


    +   - Setting up WiFi with WiFiNINA library

    +   - Scanning WiFi hotspots

    +   - Connecting to a network

    +   - Accessing network time protocol (NTP) servers

    +   - Building a simple IoT application


    This chapter requires an environment such as a WiFi network. You should provide
    a WiFi hotspot with enabled Internet so Arduino Nano 33 IoT can communicate with
    other systems.'

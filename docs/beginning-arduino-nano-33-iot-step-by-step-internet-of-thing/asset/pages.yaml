    We can access a WiFi hotspot if we know the WiFi SSID name. In this section, we
    build an Arduino program to scan existing WiFi SSIDs and then print the list on
    the serial terminal.


    Now you can open Arduino software. You can write the following completed program.


    ```

    #include <SPI.h>

    #include <WiFiNINA.h>


    int led = 13;

    ```'

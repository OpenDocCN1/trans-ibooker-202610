  md: '# Building a Simple IoT Application


    Since we have a network module in Arduino Nano 33 IoT, we can build a simple IoT
    application. We can control an LED from a website. We can turn on/off LEDs. For
    demo implementation, we need three LEDs.


    Technically, we will build a simple webserver inside Arduino Nano 33 IoT. We receive
    HTTP GET requests to perform LED on/off from users. We define the following HTTP
    GET requests.


    +   - http://<ip_address Arduino>/gpio1/1 for turning on LED1

    +   - http://<ip_address Arduino>/gpio1/0 for turning off LED1

    +   - http://<ip_address Arduino>/gpio2/1 for turning on LED2

    +   - http://<ip_address Arduino>/gpio2/0 for turning on LED2

    +   - http://<ip_address Arduino>/gpio3/1 for turning on LED3

    +   - http://<ip_address Arduino>/gpio3/0 for turning on LED3


    Next, we build wiring for our demo.


    # Wiring


    We need three LEDs for our demo. We can build the following wiring:


    +   - LED 1 is connected to digital pin 6 on Arduino Nano 33 IoT

    +   - LED 2 is connected to digital pin 4 on Arduino Nano 33 IoT.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   - LED 3 is connected to digital pin 3 on Arduino Nano 33 IoT.

    +   - All LED GND pins are connected to ground (GND) pin on Arduino Nano 33 IoT.


    Figure 4-8 shows our wiring for the IoT project.


    ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_129_0.png)


    Figure 4-8. Wiring for the IoT project


    # Developing Program


    Our IoT project implementation is to build the Arduino program with Sketch. We
    will connect to existing WiFi and then perform a simple web server. We must wait
    for incoming HTTP GET requests to turn on/off LEDs.


    To implement, we open Arduino software and create a new project. First, we define
    our LED pins and WiFi SSIDs. Set your WiFi SSID name and SSID key if it’s available.
    To implement a simple web server, we use the WiFiServer library. You can read
    it at this link, https://www.arduino.cc/en/Reference/WiFiServer.'
  merge: -1
  img_proc: true

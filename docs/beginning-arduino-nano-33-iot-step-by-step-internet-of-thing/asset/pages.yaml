- pgno: 132
  md: "Once we have a connected client, we wait for incoming HTTP request packets.\
    \ We parse the packet to identify the type of command. We can use a string manipulation\
    \ process. We call indexOf() if we have “/gpioX/Y” requests. X is an LED number,\
    \ and Y is a command for turning on/off LED.\n\n```\nString req = client.readStringUntil('\\\
    r');\nSerial.println(req);\nclient.flush();\n\n// Match the request\nint val1\
    \ = 0;\nint val2 = 0;\nint val3 = 0;\nint ledreq = 0;\nif (req.indexOf(\"/gpio1/0\"\
    ) != -1) {\n  val1 = 0;\n  ledreq = 1;\n}\nelse if (req.indexOf(\"/gpio1/1\")\
    \ != -1) {\n  val1 = 1;\n  ledreq = 1;\n}\nelse if (req.indexOf(\"/gpio2/0\")\
    \ != -1) {\n  val2 = 0;\n  ledreq = 2;\n}\nelse if (req.indexOf(\"/gpio2/1\")\
    \ != -1) {\n  val2 = 1;\n  req = 2;\n}\nelse if (req.indexOf(\"/gpio3/0\") !=\
    \ -1) {\n  val3 = 0;\n  ledreq = 3;\n}\n```"
  merge: -1

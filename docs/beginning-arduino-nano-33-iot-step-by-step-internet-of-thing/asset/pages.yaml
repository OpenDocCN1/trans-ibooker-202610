- pgno: 39
  md: 'On the loop() function, we do nothing. All codes run on the setup() function.
    That’s why you probably don’t see the program output, because we see it late.


    ```

    void loop() {

    }

    ```


    # Operators


    The Sketch program adopts C++ operators. We can declare arithmetic operators to
    perform mathematic operations. We can use the following arithmetic operators:


    +   - % (remainder)

    +   - * (multiplication)

    +   - + (addition)

    +   - - (subtraction)

    +   - / (division)

    +   - = (assignment operator)



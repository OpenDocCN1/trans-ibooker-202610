  md: '# Hello Arduino: Blinking LED


    We first build a Arduino program. The Arduino Nano 33 IoT board has a built-in
    LED that is attached on digital pin 13. In this section, we build a simple blinking
    LED. Now you can connect Arduino Nano 33 IoT into a computer. Then, we can start
    to write the Arduino program.


    You can open Arduino software. We create a program from the project template.
    You can click menu and then File ➤ Examples ➤ 01.Basics ➤ Blink. After clicked,
    you will obtain program codes as shown in Figure 1-6. This is a program sample
    from Arduino.


    ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_18_0.png)


    *Figure 1-6.* Blink application on Arduino software'
  merge: -1

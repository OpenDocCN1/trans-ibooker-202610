  md: "# How does it work?\n\nFirst, we initialize our I2C, Serial, and PCF8591 AD/DA\
    \ converter module. We define I2C address channel. This is done on the setup()\
    \ function.\n\n```\n```cpp\n#include \"Wire.h\"\n#define PCF8591 0x48 // I2C bus\
    \ address\n#define PCF8591_ADC_CH0 0x00 // thermistor\n#define PCF8591_ADC_CH1\
    \ 0x01 // photo-voltaic cell\n#define PCF8591_ADC_CH2 0x02\n#define PCF8591_ADC_CH3\
    \ 0x03 // potentiometer\nbyte ADC1, ADC2, ADC3;\n\nvoid setup()\n{\n  Wire.begin();\n\
    \  Serial.begin(9600);\n}\n```\n```\n\nWe can read sensor data on the loop() function.\
    \ To read thermistor data, we open I2C using Wire.beginTransmission() with passing\
    \ PCF8591. Then, select a channel for thermistor with value PCF8591_ADC_CH0 using\
    \ Wire.write(). We close transmission by calling Wire.endTransmission(). We read\
    \ sensor data with 2 bytes using the Wire.requestFrom() function.\n\n```\n```cpp\n\
    void loop()\n{\n  // read thermistor\n  Wire.beginTransmission(PCF8591);\n  Wire.write((byte)PCF8591_ADC_CH0);\n\
    \  Wire.endTransmission();\n  delay(100);\n```\n```"

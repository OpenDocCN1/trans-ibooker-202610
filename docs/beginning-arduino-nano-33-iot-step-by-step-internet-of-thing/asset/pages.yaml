  md: "# Demo 2: Controlling LED with BLE\n\nIn this demo, we build an LED controller\
    \ over BLE radio. We utilize the BLE service to expose the LED service. We can\
    \ turn on/off the LED using the mobile application.\n\nFor implementation, we\
    \ use a program sample from Arduino, LED. Next, we develop the Sketch program.\n\
    \n# Writing the Program\n\nWe will develop the Arduino program to control the\
    \ LED over BLE radio. Now you start by opening Arduino software. Create a new\
    \ program. Next, we write codes with step-by-step.\n\nFirst, we import the ArduinoBLE\
    \ library into our program. We also initialize the BLE Service with BLERead and\
    \ BLEWrite characteristics. We define ledPin for LED_BUILTIN. We write the following\
    \ codes.\n\n```\n```cpp\n#include <ArduinoBLE.h>\n\nBLEService ledService(\"19B10000-E8F2-537E-4F6C-D104768A1214\"\
    );\nBLEByteCharacteristic switchCharacteristic(\"19B10001-E8F2-537E-\n4F6C-D104768A1214\"\
    , BLERead | BLEWrite);\n\nconst int ledPin = LED_BUILTIN;\n```\n```\n\nThen, we\
    \ initialize serial communication and digital OUTPUT mode on the setup() function.\
    \ We also initialize BLE radio on Arduino Nano 33 IoT using the BLE.begin() function.\n\
    \n```\n```cpp\nvoid setup() {\n  Serial.begin(9600);\n  while (!Serial);\n\n \
    \ // set LED pin to output mode\n  pinMode(ledPin, OUTPUT);\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 172
  md: "```\n// begin initialization\nif (!BLE.begin()) {\n    Serial.println(\"starting\
    \ BLE failed!\");\n    while (1);\n}\n```\n\nNext, we set the BLE service and\
    \ characteristics using the addCharacteristic() function. We also initialize the\
    \ characteristic value by calling the writeValue() function.\n\n```\n// set advertised\
    \ local name and service UUID:\nBLE.setLocalName(\"LED\");\nBLE.setAdvertisedService(ledService);\n\
    \n// add the characteristic to the service\nledService.addCharacteristic(switchCharacteristic);\n\
    \n// add service\nBLE.addService(ledService);\n\n// set the initial value for\
    \ the characeristic:\nswitchCharacteristic.writeValue(0);\n```\n\nAfter we define\
    \ our BLE service, we can start to advertise using the BLE.advertise() function.\
    \ We print a message for information that our BLE is ready to wait for incoming\
    \ BLE readers.\n\n```\n// start advertising\nBLE.advertise();\n\nSerial.println(\"\
    BLE LED Peripheral\");\n}\n```\n\nOn the loop() function, we wait for BLE readers.\
    \ We use BLE.central(). If the BLE reader is connected to Arduino Nano 33 IoT,\
    \ we will obtain a BLEDevice object."

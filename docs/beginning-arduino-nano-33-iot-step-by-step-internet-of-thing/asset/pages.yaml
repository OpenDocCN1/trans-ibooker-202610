  md: "```\n// initialize serial communication\nSerial.begin(115200);\nwhile (!Serial)\
    \ {\n    ;\n}\n\nint c = a + b;\nint d = a * b;\n\n// print\nSerial.print(\"C=\
    \ \");\nSerial.println(c);\n\nSerial.print(\"d= \");\nSerial.println(d);\n}\n\
    void loop() {\n}\n```"
  merge: -1

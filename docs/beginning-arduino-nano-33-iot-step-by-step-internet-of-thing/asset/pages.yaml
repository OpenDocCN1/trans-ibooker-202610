- pgno: 9
  md: '# CHAPTER 1


    # Setting up

    Development

    Environment


    Arduino Nano 33 IoT is an internet of things (IoT) solution to perform sensing
    and actuating on physical environment. The Arduino Nano 33 IoT board comes with
    WiFi and BLE modules that enable communication with other entities for exchanging
    data. This chapter will explore how to set up the Arduino Nano 33 IoT board for
    development.


    The following is a list of topics in this chapter:


    +   - Reviewing Arduino Nano 33 IoT board

    +   - Setting up development environment

    +   - Building LED blinking program

    +   - Applying Arduino web editor'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Introduction


    Arduino Nano 33 IoT is one of IoT platforms from Arduino. This board uses WiFi
    and Bluetooth modules to connect to a network. WiFi is a common network that people
    use to access Internet. Bluetooth is a part of wireless personal network (WPAN)
    that enables communication with other devices within a short distance.


    Arduino Nano 33 IoT board is designed for low-cost IoT devices to address your
    IoT problems. Arduino Nano 33 IoT has a small-size factor, 45 x 18 mm (length
    x width). You can see my Arduino Nano 33 IoT board in Figure 1-1.


    ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_10_0.png)


    Figure 1-1. Arduino Nano 33 IoT board'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# # Review Arduino Nano 33 IoT Board


    Arduino Nano 33 IoT is built from ARM Cortex M0 32-bit SAMD21. The board also
    has a radio module, NINA-W102, from u-blox. This module is designed for data communication
    over WiFi and Bluetooth. You can read a detailed specification of Arduino Nano
    33 IoT on Table 1-1.


    Since Arduino Nano 33 IoT has some digital and analog I/O, we extend the board
    capabilities by wiring with other sensors or actuators. We also use universal
    asynchronous receiver/transmitter (UART), serial peripheral interface (SPI), and
    interintegrated circuit (I2C) protocols to communicate with other devices.


    **Table 1-1.** *A Specification of Arduino Nano 33 IoT*


    | Features | Notes |

    |---|---|

    | Microcontroller | SAMD21 Cortex-M0+ 32-bit |

    | Radio module | u-blox NINA-W102 |

    | Secure module | ATECC608A |

    | Operating voltage | 3.3V |

    | Input voltage | 21V |

    | DC current per I/O pin (limit) | 7 mA |

    | Clock speed | 48 Mhz |

    | CPU flash memory | 256 KB |

    | SRAM | 32 KB |

    | EEPROM | None |

    | Digital I/O | 14 |

    | PWM pins | 11 (2, 3, 5, 6, 9, 10, 11, 12, 16 / A2, 17 / A3, 19 / A5) |'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Table 1-1. (continued)


    | Features | Notes |

    |---|---|

    | UART | 1 |

    | SPI | 1 |

    | I2C | 1 |

    | Analog Input | 8 (ADC 8/10/12 bit) |

    | Analog Output | 1 (DAC 10 bit) |

    | LED_BUILTIN | 13 |

    | USB | Native in the SAMD21 processor |

    | IMU | LSM6DS3 |

    | Size (Length x Width) | 45 mm x 18 mm |


    Key: CPU, central processing unit; SRAM, static random-access memory; EEPROM,
    electrically erasable programmable read-only memory; PWM, pulse width modulation;
    UART, universal asynchronous receiver/transmitter; SPI, serial peripheral interfact;
    I2C, interintergrated circuit; USB, universal serial bus; IMU, inertial measurement
    unit.


    Next, we will set up Arduino Nano 33 IoT on your computer so you can build programs
    for Arduino board.


    # Set Up Development Environment


    Arduino provides software to build programs for all Arduino board models. We can
    use Arduino software. You can download Arduino software on the following link:
    https://www.arduino.cc/en/Main/Software. This software is available for Windows,
    Linux, and macOS.'
  merge: -1
  img_proc: true
- pgno: 13
  md: "The installation process steps are easy. Just follow the installation guideline\
    \ from Arduino setup. After finished installation, you will see the Arduino application\
    \ menu on main menu from your OS platform.\n\nOpen the Arduino application. Then,\
    \ we will obtain the Arduino application as shown in Figure 1-2. You will see\
    \ skeleton codes on the application dialog. The following is a code template.\n\
    \n```\nvoid setup() {\n    // put your setup code here, to run once:\n}\n\nvoid\
    \ loop() {\n    // put your main code here, to run repeatedly:\n}\n```\n\nWe can\
    \ see that the Arduino program adopts C/C++ program language dialects. We can\
    \ put all data initialization on the setup() function. The program will execute\
    \ codes inside the loop() function continuously."
  merge: -1
  img_proc: true

    chapter. Details about the LSM6DS3 library can be read at this link, https://www.arduino.cc/en/Reference/ArduinoLSM6DS3.


    To install the Arduino LSM6DS3 library, you can open Arduino software. Then, click
    the menu Sketch ▶ Include Library ▶ Manage Libraries, as shown in Figure 3-3.'

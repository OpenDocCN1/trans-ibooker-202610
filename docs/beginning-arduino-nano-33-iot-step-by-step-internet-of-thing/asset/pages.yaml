    # Scanning I2C Address


    Every device/module-based I2C set owns an I2C address on MCU. In this section,
    we want to scan all devices that are attached on Arduino Nano 33 IoT. We also
    have two internal sensor device-based I2Cs inside Arduino Nano 33 IoT.'

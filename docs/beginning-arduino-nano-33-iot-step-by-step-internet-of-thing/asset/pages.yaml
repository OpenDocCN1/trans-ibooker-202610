- pgno: 33
  md: "Since the Sketch program adopts from C++, we put ; at the end of the code line.\
    \ Otherwise, we obtain an error while compiling codes. For instance, we declare\
    \ variables with int and char data types as follows:\n\n```\nint a;\nint b = 10;\n\
    char c;\nchar d = 'A';\n```\n\nWe can set an initial value while declaring a variable.\
    \ For instance, we set int b = 10.\n\n**Table 2-1. Data Types on the Sketch Program**\n\
    \n| array | float | void |\n| bool | int | String() |\n| Boolean | long | unsigned\
    \ char |\n| Byte | short | unsigned int |\n| char | size_t | unsigned long |\n\
    | double | string | word |\n\nFor a demo, we create a project for the Arduino\
    \ Nano 33 IoT. Open the Arduino software and write these codes.\n\n```\nvoid setup()\
    \ {\n  int a = 10;\n  int b = 5;\n```"
  merge: -1
  img_proc: true

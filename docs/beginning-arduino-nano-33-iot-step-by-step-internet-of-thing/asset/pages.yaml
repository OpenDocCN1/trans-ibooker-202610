- pgno: 162
  md: '# CHAPTER 6


    # Bluetooth Low Energy (BLE)


    Arduino Nano 33 IoT has two built-in network modules: WiFi and Bluetooth. In this
    chapter, we explore how to get started with Bluetooth Low Energy (BLE) on Arduino
    Nano 33 IoT. We will build programs to utilize the BLE module.


    You will learn the following topics in this chapter:


    +   - Setting up BLE library on Arduino Nano 33 IoT

    +   - Building a simple BLE application

    +   - Developing an LED control program over BLE

    +   - Exposing sensor data over BLE service


    # Introduction


    Arduino Nano 33 IoT is one of the IoT platforms from Arduino. This board uses
    WiFi and Bluetooth modules to connect to a network. Arduino Nano 33 IoT has support
    for BLE radio. BLE technology enables us to advertise our services and make interactions
    among BLE devices such as mobile devices.'
  merge: -1
  img_proc: true

    # Serial Peripheral Interface


    Serial communication works with asynchronous mode so there is no control on serial
    communication. This means we cannot guarantee the data that is sent will be received
    by receiver. The serial peripheral interface (SPI) is a synchronous serial communication
    interface specification, but SPI has four wires to control data such as master
    out/slave in (MOSI), master in/slave out (MISO), serial clock signal (SCLK), and
    slave select (SS).


    Arduino Nano 33 IoT has one SPI interface with the following SPI pins:


    +   - MOSI on Digital pin 11

    +   - MISO on Digital pin 12

    +   - SCLK on Digital pin 13


    You can attach any sensor or actuator-based SPI interface on Arduino Nano 33 IoT.
    For our demo, we only connect the MISO pin to the MOSI pin using a jumper cable.
    You can connect digital pin 12 to digital pin 11. Figure 2-19 shows my wiring

  md: "After the BLE reader is connected to our BLE radio on Arduino Nano 33 IoT,\
    \ we can obtain BLEDevice object. Then, we turn on the LED by calling digitalWrite()\
    \ with passing HIGH value. Then, we perform infinite looping by checking connection\
    \ status.\n\n```\nif (central) {\n  Serial.print(\"Connected to central: \");\n\
    \  Serial.println(central.address());\n  digitalWrite(LED_BUILTIN, HIGH);\n\n\
    \  while (central.connected()) {\n    // do nothing\n  }\n\n```\n\nIf the BLE\
    \ reader is disconnected, we will obtain a false value from central.connected().\
    \ After that, we turn off the LED by calling digitalWrite() with passing LOW value.\n\
    \n```\ndigitalWrite(LED_BUILTIN, LOW);\nSerial.print(\"Disconnected from central:\
    \ \");\nSerial.println(central.address());\n}\n}\n```\n\nOur program is done.\
    \ You can save this program as HelloBLE.\n\n# Testing Program\n\nNow our Arduino\

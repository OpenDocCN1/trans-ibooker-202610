- pgno: 76
  md: "To access I2C on the Arduino board, we can use the Wire library. We can include\
    \ our program by inserting the wire.h library. For further information about the\
    \ Wire library, we can read on the official website from Arduino (https://www.arduino.cc/en/Reference/Wire).\n\
    \nFor our demo, we use our wiring demo from the PCF8591 AD/DA converter module\
    \ (see Figure 2-22). Open Arduino software and write this complete program.\n\n\
    ```\n#include <Wire.h>\n\nvoid setup() {\n    Serial.begin(115200);\n    Wire.begin();\n\
    \    Serial.println(\"\\nI2C Scanner\");\n}\n\nvoid loop() {\n    byte error,\
    \ address;\n    int nDevices;\n\n    Serial.println(\"Scanning...\");\n\n    nDevices\
    \ = 0;\n    for(address = 1; address < 127; address++) {\n        Wire.beginTransmission(address);\n\
    \        error = Wire.endTransmission();\n\n        if (error == 0) {\n      \
    \      Serial.print(\"I2C device found at address 0x\");\n            if (address\
    \ < 16)\n                Serial.print(\"0\");\n            Serial.println(address,\
    \ HEX);\n\n            nDevices++;\n        }\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 77
  md: "```\nelse if (error == 4) {\n    Serial.print(\"Unknown error at address 0x\"\
    );\n    if (address < 16)\n        Serial.print(\"0\");\n    Serial.println(address,\
    \ HEX);\n}\n}\nif (nDevices == 0)\n    Serial.println(\"No I2C devices found\"\
    );\nelse\n    Serial.println(\"done\");\n\ndelay(5000);\n}\n```\n\nSave this program\

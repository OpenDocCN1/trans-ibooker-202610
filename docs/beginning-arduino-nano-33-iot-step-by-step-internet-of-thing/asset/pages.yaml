- pgno: 30
  md: '# CHAPTER 2


    # Arduino Nano 33 IoT Board Development


    This chapter focuses on how to build Arduino Nano 33 IoT programs. We use Arduino
    Sketch to build Arduino programs. This software is available for Windows, macOS,
    and Linux. Then, we explore how to access Input/Output peripherals on the Arduino
    Nano 33 IoT board by the Arduino program.


    In this chapter, you will learn:


    +   - how to write Arduino programs using Sketch

    +   - how to access digital I/O

    +   - how to access analog I/O

    +   - how to plot analog sensor analog

    +   - how to build a serial communication

    +   - how to access PWM

    +   - how to access SPI

    +   - how to scan an I2C address

    +   - how to read sensor device-based I2C'
  merge: -1
  img_proc: true
- pgno: 31
  md: "# Introduction\n\nWe can say Arduino is a platform since Arduino as a company\
    \ provides hardware and software. To build programs for Arduino Nano 33 IoT boards,\
    \ we can use Arduino Sketch. This program uses C/C++ dialects as its language\
    \ style.\n\nIn this chapter, we learn how to build programs for Arduino Nano 33\
    \ IoT. This is one of various Arduino models. The Arduino Nano 33 IoT board uses\
    \ WiFi and Bluetooth modules to connect to a network. WiFi is a common network\
    \ that people use to access Internet. Bluetooth is a part of wireless personal\
    \ network (WPAN) that enables communication with other device in short distance.\n\
    \nWe use Arduino software to build Arduino programs. This tool uses the Sketch\
    \ program that uses C++ dialects. In the next section, we start to learn Sketch\
    \ programming.\n\n# Basic Sketch Programming\n\nIn this section, we learn about\
    \ Sketch programming language. Technically, Sketch uses C++ dialects, so if you\
    \ have experience with C++ programming language, you can skip this section.\n\n\
    # Main Program\n\nThe Arduino program has a main program to perform tasks continuously.\
    \ When we create a program using Arduino software, we have skeleton codes with\
    \ two functions: setup() and loop(). You can see the complete codes as follows.\n\
    \n```\nvoid setup() {\n  // put your setup code here, to run once:\n}\n```"
  merge: -1
  img_proc: true

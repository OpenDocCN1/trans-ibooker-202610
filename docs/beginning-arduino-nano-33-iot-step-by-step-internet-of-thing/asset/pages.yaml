    # Demo 3: Sensor Real-Time Monitoring


    In this section, we build a sensor real-time monitoring over the BLE radio. We
    make a BLE service that provides Gyroscope sensor data to the BLE reader. The
    BLE reader will obtain notification if the sensor data changes.


    # Writing the Program


    We create a new Arduino program to create the BLE service and then broadcast the
    Gyroscope sensor to BLE readers. We will create a BLE service with three characteristics.
    Each BLE characteristic will expose the Gyroscope sensor for x, y, and z degrees.


    To start to develop, we can open Arduino software. First, we call the required
    libraries.


    ```

    #include <ArduinoBLE.h>

    #include <Arduino_LSM6DS3.h>

    ```'

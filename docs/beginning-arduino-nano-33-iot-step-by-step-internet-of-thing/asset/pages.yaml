  md: "How does it work?\n\nWe initialize SPI and Serial interface on the setup()\
    \ function.\n\n```\n#include <SPI.h>\n\nbyte sendData,recvData;\nvoid setup()\
    \ {\n  SPI.begin();\n  Serial.begin(9600);\n  randomSeed(80);\n}\n```\n\nTo send\
    \ and receive data over SPI, we can use the SPI.transfer() function. We send data\
    \ with a random value on the loop() function.\n\n```\nvoid loop() {\n  sendData\
    \ = random(50, 100);\n  recvData = SPI.transfer(sendData);\n```\n\nThen, we print\
    \ sent data and received data on serial terminal.\n\n```\nSerial.print(\"Send=\"\
    );\nSerial.println(sendData,DEC);\nSerial.print(\"Recv=\");\nSerial.println(recvData,DEC);\n\
    ```\n\nYou have completed the SPI demo. You can practice more with SPI by applying\
    \ sensors or actuator devices.\n\n# Interintegrated Circuit (I2C)\n\nThe interintegrated\
    \ circuit (I2C) protocol is a protocol intended to allow multiple \"slave\" module/device\
    \ (chip) to communicate with one or more \"master\" chips. This protocol works\
    \ with asynchronous mode.\nTo communicate with other devices/modules, I2C protocol\
    \ defines the I2C address for all \"slave\" devices."
  merge: -1
  img_proc: true
- pgno: 73
  md: 'The I2C interface has two pins: serial data (SDA) and serial clock (SCL). For
    data transfer, the I2C interface uses an SDA pin. An SCL pin is used for clocking.
    The Arduino Nano 33 IoT board has I2C pins on A4 as SDA and A5 as SCL.


    For our demo, we use a sensor module-based I2C interface. The I2C interface uses
    a device address so the Arduino Nano 33 IoT board can access data by opening a
    connection to the I2C address. Each analog sensor from sensor module-based I2C
    will be attached to the I2C address.


    For testing, I used a PCF8591 AD/DA converter module with sensor and actuator
    devices. This sensor module can be seen in Figure 2-21. The PCF8591 AD/DA module
    uses a PCF8591 chip that consists of four analog input and AD converters. The
    PCF8591 chip also has analog output with a DA converter. For further information
    about the PCF8591 chip, you can read at this link, https://www.nxp.com/products/interfaces/ic-spi-serial-interface-devices/ic-dacs-and-adcs/8-bit-a-d-and-d-a-converter:PCF8591.


    You can find the chip at an online store like Aliexpress. You can probably obtain
    this module at your local store.


    ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_73_0.png)


    Figure 2-21. PCF8591 ADC DAC AD/DA module'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Based on datasheet documentation of the PCF8591 AD/DA converter module, this
    module uses I2C addresses on 0x48. The PCF8591 AD/DA converter module also consists
    of three sensors as follows:


    +   - Thermistor: using channel 0

    +   - Photoresistor: using channel 1

    +   - Potentiometer: using channel 3


    Now attach the PCF8591 AD/DA converter module to the Arduino Nano 33 IoT board
    with the following wiring:


    +   - The PCF8591 AD/DA module SDA is connected to Arduino A4 pin.

    +   - The PCF8591 AD/DA module SCL is connected to Arduino A5 pin.

    +   - The PCF8591 AD/DA module VCC is connected to Arduino 3.3V.

    +   - The PCF8591 AD/DA module GND is connected to Arduino GND pin.


    Figure 2-22 shows my wiring for the PCF8591 AD/DA converter module and Arduino
    Nano 33 IoT. You should see a lighting LED when we plug in 3.3V to the module.'
  merge: -1

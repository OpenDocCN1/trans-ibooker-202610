  md: '# Register Arduino Nano 33 IoT


    Before we use Arduino IoT Cloud, we have to register our Arduino devices. In this
    chapter, we use Arduino Nano 33 IoT. We have some steps to register our Arduino
    devices. You can perform the following tasks:


    +   - installing Arduino Create Agent

    +   - adding a new Arduino device


    Next, we can install the Arduino Create Agent.


    # Install the Arduino Create Agent


    Arduino Create Agent is a background program to listen to our local Arduino devices.
    This agent program acts as a bridge between local Arduino devices and Arduino
    IoT Cloud.


    The Arduino Create Agent program is available for Windows, Linux, and the macOS
    platform. You can download this program at this link, https://github.com/arduino/arduino-create-agent.
    After installed, you should allow this program to run in the background. On the
    Windows platform, you can see a tray icon for the Arduino Create Agent on the
    taskbar, as shown in Figure 5-2.


    ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_139_0.png)


    Figure 5-2. A tray icon of the Arduino Create Agent on Windows OS'

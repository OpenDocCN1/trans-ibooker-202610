    The Arduino Nano 33 IoT board has an internal sensor, inertial measurement unit
    (IMU). This IMU sensor is built from LSM6DS3. In this chapter, we explore how
    to access the IMU sensor on Arduino Nano 33 IoT.


    You will learn the following topics in this chapter:


    +   - Setting up LSM6DS3 sensor

    +   - Accessing accelerator sensor

    +   - Accessing gyroscope sensor

    +   - Plotting sensor data



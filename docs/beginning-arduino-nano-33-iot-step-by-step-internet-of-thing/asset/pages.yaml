    # Figure 1-5. Detected Arduino Nano 33 IoT on Device Manager—Windows 10


    If you are working on Linux, you can verify the Arduino Nano 33 IoT using this
    command on the terminal.


    ```

    $ ls /dev/ttyUSB*

    ```


    You will see a list of attached devices over USB. Arduino Nano 33 IoT usually
    is detected as /dev/ttyUSB0 or /dev/ttyUSB1. For macOS, you can type this command
    to check Arduino Nano 33 IoT.


    ```

    $ ls /dev/cu*

    ```


    You should see the USB device on your terminal.'

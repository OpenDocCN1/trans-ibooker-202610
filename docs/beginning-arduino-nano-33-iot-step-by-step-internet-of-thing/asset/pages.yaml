    Arduino Nano 33 IoT has an internal sensor that we can access directly. This sensor
    is the IMU-based LSM6DS3. This module consists of accelerator and gyroscope sensors.
    This sensor is connected to Arduino Nano 33 IoT over the interintegrated circuit
    (I2C) interface. For further'

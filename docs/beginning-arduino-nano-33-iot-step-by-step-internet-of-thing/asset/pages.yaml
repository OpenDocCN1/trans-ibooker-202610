    );\nBLEStringCharacteristic xSensorLevel(\"ff99948c-18ff-4ed8-942e-512b9b24b6da\"\
    , BLERead | BLENotify,15);\nBLEStringCharacteristic ySensorLevel(\"8084aa6b-6cae-461f-9540-e1a5768de49d\"\
    , BLERead | BLENotify,15);\nBLEStringCharacteristic zSensorLevel(\"ab80cb77-fe74-40d8-9757-96f8a54c16d9\"\
    , BLERead | BLENotify,15);\n\n// last sensor data\nfloat oldXLevel = 0;\nfloat\
    \ oldYLevel = 0;\nfloat oldZLevel = 0;\nlong previousMillis = 0;\n```\n\nOn the\
    \ setup() function, we initialize serial communication with baudrate 115200, the\
    \ Gyroscope sensor, the LED digital pin, and OLED interintegrated circuit (I2C)\
    \ display module.\n\n```\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial);\n\
    \n  if (!IMU.begin()) {\n    Serial.println(\"Failed to initialize IMU!\");\n\
    \    while (1);\n  }\n}\n```"

- pgno: 79
  md: "Then we open the I2C interface using `Wire.beginTransmission()`.\nNext, we\
    \ close a transmission by calling `Wire.endTransmission()`.\n\n```\nnDevices =\
    \ 0;\nfor(address = 1; address < 127; address++) {\n    Wire.beginTransmission(address);\n\
    \    error = Wire.endTransmission();\n```\n\nWe check for value error. If there\
    \ is no error, it means we have an I2C device on current address. We print the\
    \ I2C address to serial terminal using `Serial.println()` with HEX mode.\n\n```\n\
    if (error == 0) {\n    Serial.print(\"I2C device found at address 0x\");\n   \
    \ if (address < 16)\n        Serial.print(\"0\");\n    Serial.println(address,\
    \ HEX);\n\n    nDevices++;\n}\n```\n\nOtherwise, we check the error code. If error\
    \ = 4, we print errors on this address for unknown errors on the current address.\n\
    \n```\nelse if (error == 4) {\n    Serial.print(\"Unknown error at address 0x\"\
    );\n    if (address < 16)\n        Serial.print(\"0\");\n    Serial.println(address,\
    \ HEX);\n}\n```"

    # Introduction


    Arduino Nano 33 IoT is one of IoT platforms from Arduino. This board uses WiFi
    and Bluetooth modules to connect to a network. WiFi is a common network that people
    use to access the Internet. Bluetooth is a part of the wireless personal network
    (WPAN) that enables communication with other devices within a short distance.


    ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_111_0.png)


    Figure 4-1. WiFi module on Arduino Nano 33 IoT


    Arduino Nano 33 IoT is designed for low-cost IoT devices to leverage IoT solutions.
    Arduino Nano 33 IoT has a WiFi module, as shown in Figure 4-1. In this chapter,
    we apply a WiFi module in Arduino Nano 33 IoT to communicate with others.


    # Set up the WiFiNINA Library


    To access the WiFi module on the Arduino Nano 33 IoT board, we should install
    the WiFiNINA library. We can install it via Library Manager. You can click the
    menu Sketch ▶ Include Library ▶ Manage Libraries. After we click the menu for
    Manage Libraries, we will obtain a dialog as shown in Figure 4-2. You can type
    WiFiNINA in te search textbox. After that, you should see WiFiNINA on the list
    (see Figure 4-2).'

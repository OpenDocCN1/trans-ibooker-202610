    # Displaying the Gyroscope Sensor


    If you don’t see display output, first, check the I2C address of your OLED I2C
    display. Then, make sure your OLED I2C displays with display size 128x64 pixels.


    In this section, we will build the Arduino program to display the Gyroscope sensor
    for the OLED I2C display. We will use a program from the previous section to read
    the Gyroscope sensor.


    Now we can open Arduino software and create a new program. We start by importing
    all required libraries for the OLED I2C display and the Gyroscope sensor.


    ```

    #include <SPI.h>

    #include <Wire.h>

    #include <Adafruit_GFX.h>

    #include <Adafruit_SSD1306.h>

    #include <Arduino_LSM6DS3.h>

    ```


    We define the OLED I2C display size. In this demo, I use 128x64 pixels. You can
    change its size based on your OLED module.


    ```

    #define SCREEN_WIDTH 128

    #define SCREEN_HEIGHT 64

    ```


    Next, we configure Adafruit_SSD1306 with passing the I2C address of the OLED module
    and display size.


    ```

    #define OLED_RESET  4 // Reset pin

    Adafruit_SSD1306 display(Screen_WIDTH, SCREEN_HEIGHT, &Wire, OLED_RESET);

    ```'

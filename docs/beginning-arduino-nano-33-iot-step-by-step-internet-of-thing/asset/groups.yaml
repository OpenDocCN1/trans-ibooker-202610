    \ 上找到此模块。\n\n现在我们可以将 SparkFun Electret Microphone Breakout 连接到 Arduino Nano 33\
    \ IoT。你可以按以下方式构建接线：\n- SparkFun Electret Microphone Breakout 模块 VCC 连接到 Arduino\
    \ 3.3V。\n- SparkFun Electret Microphone Breakout 模块 GND 连接到 Arduino GND。\n- SparkFun\
    \ Electret Microphone Breakout 模块 SIG 连接到 Arduino A0。\n\n你可以在图 2-13 中看到我的硬件接线。\n\
    \n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_59_0.png)\n\n*图 2-13.* Arduino 与 SparkFun\

    \n对于演示，我们构建一个闪烁程序。每个 LED 状态都写入串行终端。我们使用波特率 115200。你可以打开 Arduino 软件并编写此完整程序。\n\n\
    ```\nint led = 13;\n\nvoid setup() {\n    Serial.begin(115200);\n    pinMode(led,\
    \ OUTPUT);\n}\n\nvoid loop() {\n    Serial.println(\"LED: HIGH\");\n    digitalWrite(led,\
    \ HIGH);\n    delay(1000);\n    Serial.println(\"LED: LOW\");\n    digitalWrite(led,\

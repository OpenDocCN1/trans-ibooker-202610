    # Wiring for Arduino Nano 33 IoT and the OLED I2C Display


    We use the OLED display with an I2C interface so we can connect this OLED display
    to Arduino Nano 33 IoT over I2C pins. You can see my wiring in Figure 3-9. You
    can perform this wiring as follows:


    +   - The OLED I2C display module serial data is connected to the Arduino A4 pin.

    +   - The OLED I2C display module serial clock is connected to the Arduino A5
    pin.

    +   - The OLED I2C display module voltage common collector (VCC) is connected
    to Arduino 3.3V.

    +   - The OLED I2C display module ground (GND) is connected to the Arduino GND
    pin.


    ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_100_0.png)


    Figure 3-9. Wiring the OLED I2C display on Arduino Nano 33 IoT'

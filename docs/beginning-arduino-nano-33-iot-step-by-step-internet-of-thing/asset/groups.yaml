    \ our property variable, LED1, is declared on the main Sketch program.\n\n```\n\
    #include \"arduino_secrets.h\"\nbool LED1;\n#include \"thingProperties.h\"\n```\n\
    \n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_150_0.png)\n\n## Figure 5-13. A dashboard\

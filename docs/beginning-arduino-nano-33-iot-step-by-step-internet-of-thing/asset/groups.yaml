    In this chapter, we will explore the IMU sensor, LSM6DS3, on Arduino Nano 33 IoT.\
    \ We access accelerator and gyroscope sensors from the Arduino program.\n\n##\
    \ Set Up LSM6DS3 Library\n\nTo access the IMU sensor-based LSM6DS3 chip on Arduino\
    \ Nano 33 IoT, we need to install the Arduino LSM6DS3 library. This library can\
    \ be used to access the IMU sensor for accelerator and gyroscope sensors. We will\
    \ use this library in this chapter. Details about the LSM6DS3 library can be read\
    \ at this link, https://www.arduino.cc/en/Reference/ArduinoLSM6DS3.\n\nTo install\
    \ the Arduino LSM6DS3 library, you can open Arduino software. Then, click the\
    \ menu Sketch ▶ Include Library ▶ Manage Libraries, as shown in Figure 3-3.\n\n\
    ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_89_0.png)\n\nFigure 3-3. Opening the\
    \ Manage Libraries menu in Arduino software\n\nAfter we click the Manage Libraries\
    \ menu, we will obtain a Library Manager dialog, as shown in Figure 3-4. You can\
    \ type arduino_lsm6ds3 in the search textbox. Then, you should see a list of libraries.\
    \ You should also see the Arduino_LSM6DS3 library. In Figure 3-4 you can see the\
    \ Arduino_LSM6DS3 library that is noted by a red arrow.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_89_1.png)\n\
    \nFigure 3-4. Installing the Arduino LSM6DS3 library\n\nClick the Install button\
    \ after you click the Arduino_LSM6DS3 library. Make sure your computer is connected\
    \ to the Internet. After completing installation, we can access the IMU sensor\
    \ on Arduino Nano 33 IoT.\n\n## Working with an Accelerometer\n\nThe IMU sensor\
    \ in Arduino Nano 33 IoT has an accelerometer sensor. This sensor measures acceleration\
    \ on x, y, and z coordinates. The sensor value ranges from -4 to 4. We will use\
    \ the Arduino LSM6DS3 library to access the IMU accelerometer sensor.\n\nIn general,\
    \ we can start to use the LSM6DS3 library by calling `IMU.begin()`. Then, we can\
    \ read the sensor value by calling the `IMU.readAcceleration()` function.\n\n\
    For the demo, we read the IMU accelerometer on the Arduino Nano 33 IoT board.\
    \ Then, we print the measurement result on the serial terminal. You can open Arduino\
    \ software and write this complete program.\n\n```\n#include <Arduino_LSM6DS3.h>\n\
    \nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial);\n\n  if (!IMU.begin())\
    \ {\n    Serial.println(\"Failed to initialize IMU!\");\n\n    while (1);\n  }\n\
    \n  Serial.print(\"Accelerometer sample rate = \");\n  Serial.print(IMU.accelerationSampleRate());\n\
    \  Serial.println(\" Hz\");\n  Serial.println();\n}\n```\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_92_0.png)\n\
    \nFigure 3-5. Program output from reading the IMU accelerometer\n\nHow does it\
    \ work?\n\nFirst, we include the Arduino LSM6DS3 library in the Arduino program.\n\
    \n```\n#include <Arduino_LSM6DS3.h>\n```\n\nWe initialize the IMU sensor and the\
    \ Serial object on the setup() function.\n\n```\nvoid setup() {\n  Serial.begin(115200);\n\
    \  while (!Serial);\n\n  if (!IMU.begin()) {\n    Serial.println(\"Failed to initialize\
    \ IMU!\");\n\n    while (1);\n  }\n}\n```\n\nWe also can print the current accelerometer\
    \ sample rate by calling the IMU.accelerationSampleRate() function on the serial\
    \ terminal.\n\n```\nSerial.print(\"Accelerometer sample rate = \");\nSerial.print(IMU.accelerationSampleRate());\n\
    Serial.println(\" Hz\");\nSerial.println();\nSerial.println(\"Acceleration in\
    \ G's\");\nSerial.println(\"X\\tY\\tZ\");\n```\n\nOn the loop() function, we read\
    \ the accelerometer sensor. We should check whether there is available accelerometer\
    \ sensor data by calling the IMU.accelerationAvailable() function. If it’s available\
    \ for sensor data, we can read the sensor data using the IMU.readAcceleration()\
    \ function.\n\n```\nvoid loop() {\n    float x, y, z;\n\n    if (IMU.accelerationAvailable())\
    \ {\n        IMU.readAcceleration(x, y, z);\n```\n\nThen, we print the sensor\
    \ data on the serial terminal.\n\n```\nSerial.print(x);\nSerial.print('\\t');\n\
    Serial.print(y);\nSerial.print('\\t');\nSerial.println(z);\n```\n\n## Working\
    \ with Gyroscope\n\nGyroscope is a sensor to measure orientation and angular velocity.\
    \ Arduino Nano 33 IoT has a built-in gyroscope sensor over the IMU LSM6DS3 sensor\

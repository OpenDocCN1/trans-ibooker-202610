    \n```\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) {\n    ;\n \
    \ }\n}\n\nvoid loop() {\n  int val = analogRead(A0);\n  Serial.println(val);\n\
    \  delay(300);\n}\n```\n\n将此程序保存为 AnalogPlotting。现在你可以编译并将此程序上传到 Arduino Nano\
    \ 33 IoT。在 Arduino 软件上打开 Serial Plotter 工具，并点击菜单 Tools ▶ Serial Plotter，如图 2-14\
    \ 所示。\n\n# 图 2-14. 打开 Serial Plotter 工具\n\n在你点击 Serial Plotter 后，你将获得如图 2-15 所示的对话框。对\
    \ SparkFun Electret Microphone Breakout 发出噪音，以便我们在绘图工具上获得各种信号。由于我们使用 delay(300)，绘图仪每\
    \ 300 ms 更新其图表。\n\n# 图 2-15. 绘制传感器数据\n\n它是如何工作的？\n\n此程序工作非常简单。首先，我们通过调用 analogRead()\
    \ 读取模拟传感器。\n\n```\nvoid loop() {\n  int val = analogRead(A0);\n```\n\n然后，我们使用\
    \ Serial 对象的 println() 打印到串行终端。\n\n```\nSerial.println(val);\ndelay(300);\n```\n\
    \n这使得 Serial Plotter 工具显示一个图表。\n\n# Serial Communication\n\n串行通信是在通信信道上一次一位、顺序发送数据的过程。在\
    \ Arduino Nano 33 IoT 中，我们可以使用 Serial 对象实现串行通信。我们已经在之前的项目中使用了此 Serial 对象来使用 Serial\
    \ Monitor 工具显示程序输出。\n\n我们可以通过调用 Serial 对象的 print() 和 println() 将数据写入串行通信。关于 Serial\

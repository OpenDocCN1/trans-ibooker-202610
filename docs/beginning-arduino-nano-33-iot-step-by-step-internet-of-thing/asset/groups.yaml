    \ the serial terminal.\n\n```\nSerial.print(x);\nSerial.print('\\t');\nSerial.print(y);\n\
    Serial.print('\\t');\nSerial.println(z);\n```\n\nThis is the end of the project.\
    \ You can practice by applying the IMU sensor in your projects.\n\n## Plotting\

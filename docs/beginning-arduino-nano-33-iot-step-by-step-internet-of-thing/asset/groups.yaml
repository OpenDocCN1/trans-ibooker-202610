    \ Arduino* by Apress. He is winner of Pi Wars 2018 and member of Medway Makers.\
    \ He is an Arduino and Raspberry Pi enthusiast.\n\nC/C++, Arduino, Python, Processing,\
    \ JS, Node-Red, NodeJS, Lua.\n\n## CHAPTER 1\n### Setting up Development Environment\n\
    \nArduino Nano 33 IoT is an internet of things (IoT) solution to perform sensing\
    \ and actuating on physical environment. The Arduino Nano 33 IoT board comes with\
    \ WiFi and BLE modules that enable communication with other entities for exchanging\
    \ data. This chapter will explore how to set up the Arduino Nano 33 IoT board\
    \ for development.\n\nThe following is a list of topics in this chapter:\n\n-\
    \ Reviewing Arduino Nano 33 IoT board\n- Setting up development environment\n\
    - Building LED blinking program\n- Applying Arduino web editor\n\n### Introduction\n\
    \nArduino Nano 33 IoT is one of IoT platforms from Arduino. This board uses WiFi\
    \ and Bluetooth modules to connect to a network. WiFi is a common network that\
    \ people use to access Internet. Bluetooth is a part of wireless personal network\
    \ (WPAN) that enables communication with other devices within a short distance.\n\
    \nArduino Nano 33 IoT board is designed for low-cost IoT devices to address your\
    \ IoT problems. Arduino Nano 33 IoT has a small-size factor, 45 x 18 mm (length\
    \ x width). You can see my Arduino Nano 33 IoT board in Figure 1-1.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_10_0.png)\n\
    \nFigure 1-1. Arduino Nano 33 IoT board\n\n### Review Arduino Nano 33 IoT Board\n\
    \nArduino Nano 33 IoT is built from ARM Cortex M0 32-bit SAMD21. The board also\
    \ has a radio module, NINA-W102, from u-blox. This module is designed for data\
    \ communication over WiFi and Bluetooth. You can read a detailed specification\
    \ of Arduino Nano 33 IoT on Table 1-1.\n\nSince Arduino Nano 33 IoT has some digital\
    \ and analog I/O, we extend the board capabilities by wiring with other sensors\
    \ or actuators. We also use universal asynchronous receiver/transmitter (UART),\
    \ serial peripheral interface (SPI), and inter-integrated circuit (I2C) protocols\
    \ to communicate with other devices.\n\n**Table 1-1.** *A Specification of Arduino\
    \ Nano 33 IoT*\n\n| Features | Notes |\n|---|---|\n| Microcontroller | SAMD21\
    \ Cortex-M0+ 32-bit |\n| Radio module | u-blox NINA-W102 |\n| Secure module |\
    \ ATECC608A |\n| Operating voltage | 3.3V |\n| Input voltage | 21V |\n| DC current\
    \ per I/O pin (limit) | 7 mA |\n| Clock speed | 48 Mhz |\n| CPU flash memory |\
    \ 256 KB |\n| SRAM | 32 KB |\n| EEPROM | None |\n| Digital I/O | 14 |\n| PWM pins\
    \ | 11 (2, 3, 5, 6, 9, 10, 11, 12, 16 / A2, 17 / A3, 19 / A5) |\n| UART | 1 |\n\
    | SPI | 1 |\n| I2C | 1 |\n| Analog Input | 8 (ADC 8/10/12 bit) |\n| Analog Output\
    \ | 1 (DAC 10 bit) |\n| LED_BUILTIN | 13 |\n| USB | Native in the SAMD21 processor\
    \ |\n| IMU | LSM6DS3 |\n| Size (Length x Width) | 45 mm x 18 mm |\n\nKey: CPU,\
    \ central processing unit; SRAM, static random-access memory; EEPROM, electrically\
    \ erasable programmable read-only memory; PWM, pulse width modulation; UART, universal\
    \ asynchronous receiver/transmitter; SPI, serial peripheral interface; I2C, inter-integrated\
    \ circuit; USB, universal serial bus; IMU, inertial measurement unit.\n\nNext,\
    \ we will set up Arduino Nano 33 IoT on your computer so you can build programs\
    \ for Arduino board.\n\n### Set Up Development Environment\n\nArduino provides\
    \ software to build programs for all Arduino board models. We can use Arduino\
    \ software. You can download Arduino software on the following link: https://www.arduino.cc/en/Main/Software.\
    \ This software is available for Windows, Linux, and macOS.\n\nThe installation\
    \ process steps are easy. Just follow the installation guideline from Arduino\
    \ setup. After finished installation, you will see the Arduino application menu\
    \ on main menu from your OS platform.\n\nOpen the Arduino application. Then, we\
    \ will obtain the Arduino application as shown in Figure 1-2. You will see skeleton\
    \ codes on the application dialog. The following is a code template.\n\n```\n\
    void setup() {\n    // put your setup code here, to run once:\n}\n\nvoid loop()\
    \ {\n    // put your main code here, to run repeatedly:\n}\n```\n\nWe can see\
    \ that the Arduino program adopts C/C++ program language dialects. We can put\
    \ all data initialization on the setup() function. The program will execute codes\
    \ inside the loop() function continuously.\n\n## CHAPTER 1  SETTING UP DEVELOPMENT\
    \ ENVIRONMENT\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_15_0.png)\n\n*Figure\
    \ 1-3.  Adding supported boards for Arduino Nano 33 IoT*\n\nThis installation\
    \ takes several minutes to complete. After completed installation, you can see\
    \ the Arduino Nano 33 IoT board on the targeted board. You can verify it by clicking\
    \ the menu **Tools > Board ... > Boards Manager...** on Arduino software. You\
    \ will see your board list. Figure 1-4 shows Arduino Nano 33 IoT on Arduino software.\n\
    \n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_17_0.png)\n\n# Figure 1-5. Detected\
    \ Arduino Nano 33 IoT on Device Manager—Windows 10\n\nIf you are working on Linux,\
    \ you can verify the Arduino Nano 33 IoT using this command on the terminal.\n\
    \n```\n$ ls /dev/ttyUSB*\n```\n\nYou will see a list of attached devices over\
    \ USB. Arduino Nano 33 IoT usually is detected as /dev/ttyUSB0 or /dev/ttyUSB1.\
    \ For macOS, you can type this command to check Arduino Nano 33 IoT.\n\n```\n\
    $ ls /dev/cu*\n```\n\nYou should see the USB device on your terminal.\n\n### Hello\
    \ Arduino: Blinking LED\n\nWe first build a Arduino program. The Arduino Nano\
    \ 33 IoT board has a built-in LED that is attached on digital pin 13. In this\
    \ section, we build a simple blinking LED. Now you can connect Arduino Nano 33\
    \ IoT into a computer. Then, we can start to write the Arduino program.\n\nYou\
    \ can open Arduino software. We create a program from the project template. You\
    \ can click menu and then File ➤ Examples ➤ 01.Basics ➤ Blink. After clicked,\
    \ you will obtain program codes as shown in Figure 1-6. This is a program sample\
    \ from Arduino.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_18_0.png)\n\n*Figure\
    \ 1-6.* Blink application on Arduino software\n\n## CHAPTER 1   SETTING UP DEVELOPMENT\
    \ ENVIRONMENT\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_20_0.png)\n\n*Figure\
    \ 1-7.* Compiling and flashing a program\n\nAfter uploading the Arduino program\
    \ into Arduino Nano 33 IoT, we will see blinking LED on the Arduino Nano 33 IoT\
    \ board. You can see my blinking LED in Figure 1-8.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_21_0.png)\n\
    \n*Figure 1-8.* Blinking LED on Arduino Nano 33 IoT\n\n### How does it work?\n\
    \nArduino Nano 33 IoT board has one built-in LED on digital pin 13. In our program,\
    \ we set digital pin 13 as digital output using pinMode(). We initialize this\
    \ data on the setup() function.\n\n```cpp\nvoid setup() {\n  // initialize digital\
    \ pin LED_BUILTIN as an output.\n  pinMode(LED_BUILTIN, OUTPUT);\n}\n```\n\nThe\
    \ Arduino program defines LED_BUILTIN for a general of built-in LED pin. We can\
    \ set the pin as output mode by giving a value, OUTPUT. Now our program will run\
    \ continuously on the loop() function. We turn on LED and then turn off the LED.\
    \ We can use digitalWrite() to perform on/off on the LED. Set the value to HIGH\
    \ to turn on the LED. Otherwise, we can turn off the LED by sending a value of\
    \ LOW on the digitalWrite() function. We also set a delay for turning the LED\
    \ on/off. We set 1000 ms on the delay() function.\n"

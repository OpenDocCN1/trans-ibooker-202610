    # Checking the I2C Address of the OLED I2C Display


    After we make wiring between the Arduino Nano 33 IoT and the OLED I2C display,
    we can use the i2c_scanner program from Chapter 2 to check the I2C address from
    devices. We want to know the I2C address from the OLED I2C display.


    Load the i2c_scanner program into Arduino software. Then, compile and upload this
    program into Arduino Nano 33 IoT. After that, open the Serial Monitor tool. You
    should see three I2C addresses. Two of them are I2C built-in sensors on Arduino
    Nano 33 IoT. The rest is our OLED I2C display.



    ff99948c-18ff-4ed8-942e-512b9b24b6da\", BLERead | BLENotify,15);\nBLEStringCharacteristic\
    \ ySensorLevel(\"8084aa6b-6cae-461f-9540-e1a5768de49d\", BLERead | BLENotify,15);\n\
    BLEStringCharacteristic zSensorLevel(\"ab80cb77-fe74-40d8-9757-96f8a54c16d9\"\
    , BLERead | BLENotify,15);\n\n// last sensor data\nfloat oldXLevel = 0;\nfloat\
    \ oldYLevel = 0;\nfloat oldZLevel = 0;\nlong previousMillis = 0;\n```\n\nOn the\
    \ setup() function, we initialize serial communication with baudrate 115200, the\
    \ Gyroscope sensor, the LED digital pin, and OLED interintegrated circuit (I2C)\
    \ display module.\n\n```\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial);\n\
    \n  if (!IMU.begin()) {\n    Serial.println(\"Failed to initialize IMU!\");\n\
    \    while (1);\n  }\n}\n```\n\n```\npinMode(LED_BUILTIN, OUTPUT);\n\nif (!BLE.begin())\
    \ {\n    Serial.println(\"starting BLE failed!\");\n    while (1);\n}\n```\n\n\
    Now we define the BLE service name and add to the advertised service. Then, add\
    \ all the BLE characteristics into the BLE service.\n\n```\nBLE.setLocalName(\"\
    Gyroscope\");\nBLE.setAdvertisedService(sensorService);\n\nsensorService.addCharacteristic(xSensorLevel);\n\
    sensorService.addCharacteristic(ySensorLevel);\nsensorService.addCharacteristic(zSensorLevel);\n\
    BLE.addService(sensorService);\n```\n\nWe set initial default data on all BLE\
    \ characteristics using the writeValue() function.\n\n```\nxSensorLevel.writeValue(String(0));\n\
    ySensorLevel.writeValue(String(0));\nzSensorLevel.writeValue(String(0));\n```\n\
    \nNow we can start to advertise the BLE service by calling the BLE.advertise()\
    \ function. BLE readers will recognize this BLE server.\n\n```\nBLE.advertise();\n\
    Serial.println(\"Bluetooth device active, waiting for connections...\");\n}\n\
    ```\n\nOn the loop() function, we wait for the incoming BLE reader. Once the BLE\
    \ reader is connected, we print the MAC address of the BLE reader. Then, we turn\
    \ on the LED.\n\n```\nvoid loop() {\n    BLEDevice central = BLE.central();\n\
    \    if (central) {\n        Serial.print(\"Connected to central: \");\n     \
    \   Serial.println(central.address());\n        digitalWrite(LED_BUILTIN, HIGH);\n\
    ```\n\nIf the BLE reader is connected, we have the BLEDevice object. We can perform\
    \ a looping function until the BLE reader is disconnected. Inside looping, we\
    \ call the updateGyroscopeLevel() function to update sensor data to the BLE service.\n\
    \n```\nwhile (central.connected()) {\n    //long currentMillis = millis();\n \
    \   updateGyroscopeLevel();\n    delay(300);\n}\n```\n\nWe turn off the LED after\
    \ the BLE reader disconnected.\n\n```\ndigitalWrite(LED_BUILTIN, LOW);\n    Serial.print(\"\
    Disconnected from central: \");\n    Serial.println(central.address());\n}\n}\n\
    ```\n\nFor implementation of the updateGyroscopeLevel() function, we read the\
    \ Gyroscope sensor using IMU.readGyroscope(). We also verify for existing sensor\
    \ data using the IMU.gyroscopeAvailable() function.\n\n```\nvoid updateGyroscopeLevel()\
    \ {\n    float x, y, z;\n\n    if (IMU.gyroscopeAvailable()) {\n        IMU.readGyroscope(x,\
    \ y, z);\n```\n\nFigure 6-12 shows the Gyroscope BLE service detected on an nRF\
    \ Connect for Mobile application. Then, tap the CONNECT button to connect the\
    \ Gyroscope BLE service.\n\nAfter connected, we see properties and characteristics\
    \ of the Gyroscope BLE service, as shown in Figure 6-13.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_183_0.png)\n\
    \nFigure 6-12. Detecting Gyroscope BLE service\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_184_0.png)\n\
    \n***Figure 6-13.***  *Connected to the Gyroscope BLE service*\n\nYou can expand\
    \ Unknown Service to see the BLE characteristics. After expanded, you will see\
    \ three BLE characteristics that represent the Gyroscope sensor data. Figure 6-14\
    \ shows three BLE characteristics of the Gyroscope BLE service.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_185_0.png)\n\
    \n# Figure 6-14. Opening BLE characteristics from the Gyroscope BLE service\n\n\
    Tap the icon of arrow array, as shown in Figure 6-14. After tapping, you will\
    \ see sensor data from the Gyroscope sensor. Figure 6-15 shows the Gyroscope sensor\
    \ data from Arduino Nano 33 IoT. Sensor data is signed by the circle in Figure\
    \ 6-15.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_186_0.png)\n\n**Figure 6-15.**\
    \ *Showing the Gyroscope sensor over the Gyroscope BLE service*\n\nThis is the\
    \ end of the chapter. You can practice more by creating various BLE services.\
    \ You also can build your own mobile application to consume BLE services.\n\n\
    ## Summary\n\nWe have learned how to set up a BLE radio on Arduino Nano 33 IoT\
    \ board. We also built Arduino programs by applying the BLE radio. We started\
    \ with developing the Helloworld application. We also controlled the LED over\
    \ BLE radio.\n\n## Index\n\n# A\n\nArduino IoT Cloud\n  adding new Arduino device,\

    # # Pulse Width Modulation


    Pulse width modulation (PWM) is a method to control analog output. Technically,
    it''s not "true" analog output. A microcontroller unit (MCU) can manipulate duty
    cycles to generate pulses. Arduino Nano 33 IoT has a PWM pin on digital pins.
    You can see a sign "~" on digital pins as a PWM pin. You can see that Figure 2-9
    shows a digital pin such as D2 ~. In general, Arduino Nano 33 IoT has 11 PWM pins
    on 2, 3, 5, 6, 9, 10, 11, 12, 16/A2, 17/A3, and 19/A5.


    For our demo, we use RGB LED. This LED has four pins. Three pins are red, green,
    and blue pins. The rest could be ground (GND) or voltage common collector (VCC),
    depending on RGB cathode or anode model.


    We can implement our demo wiring as shown in Figure 2-17. You can perform the
    wiring as follows:


    +   - RGB red pin is connected to Arduino digital pin 12.

    +   - RGB green pin is connected to Arduino digital pin 11.

    +   - RGB blue pin is connected to Arduino digital pin 10.

    +   - RGB GND pin is connected to Arduino digital pin GND.'

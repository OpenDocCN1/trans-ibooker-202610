    \ Agent 程序，就可以添加新的 Arduino 设备。打开 Arduino IoT Cloud 网站，然后点击 DEVICES 菜单。你会看到 Arduino\
    \ 设备列表。\n\n现在你可以添加新的 Arduino Nano 33 IoT。插入 Arduino Nano 33 IoT 后，你应该会看到如图 5-4\
    \ 所示的对话框。点击 Arduino 设备菜单中的 Set up。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_141_0.png)\n\
    \n图5-4. 添加新的 Arduino 设备\n\n点击此选项后，你应该会看到 Arduino Nano 33 IoT，如图 5-5 所示。如果没有看到\
    \ Arduino Nano 33 IoT，请确保 Arduino Nano 33 IoT 已连接并且 Arduino Create Agent 正在运行。\n\
    \n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_142_0.png)\n\n图5-5. Arduino IoT Cloud\
    \ 检测到 Arduino Nano 33 IoT\n\n为 Arduino Nano 33 IoT 设置设备名称。完成后，可以点击 CONFIGURE 按钮。Arduino\
    \ IoT Cloud 将配置你的 Arduino Nano 33 IoT，如图 5-6 所示。完成此任务需要几分钟时间。配置完成后，你应该会在 Arduino\
    \ IoT Cloud 列表中看到 Arduino Nano 33 IoT，如图 5-7 所示。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_143_0.png)\n\
    \n图5-6. 正在配置 Arduino Nano 33 IoT\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_143_1.png)\n\
    \n图5-7. Arduino Nano 33 IoT 设备已添加\n\n## 开发远程 LED 按钮\n\n在本节中，我们将构建一个程序，通过 Arduino\
    \ IoT Cloud 仪表板远程控制 LED。我们可以从 Arduino IoT Cloud 仪表板网站打开/关闭 Arduino Nano 33 IoT\
    \ 上的 LED。\n\n为了实现演示，我们可以按以下步骤执行一些任务：\n\n- 添加新的 Thing\n- 添加属性\n- 编辑 Sketch 程序\n\
    - 构建仪表板\n- 测试\n\n我们将在下一节中执行这些步骤。\n\n### 添加新的 Thing\n\nArduino IoT Cloud 的一个功能是与\
    \ Arduino 设备交互的程序。使用免费会员资格，我们只能创建一个 Thing。在本演示中，我们通过 Arduino IoT Cloud 仪表板构建 LED\
    \ 的遥控器。\n\n打开 Arduino IoT Cloud 网站，点击 Things 菜单。然后，你会得到一个表单，如图 5-8 所示。输入 Thing\
    \ 名称和 Arduino 设备。每个 Thing 都通过一个 Arduino 设备连接。\n\n设置 Thing 名称后，你可以点击 CREATE 按钮。之后，你会看到一个表单，如图\
    \ 5-9 所示。我们将在下一节配置 Arduino Nano 33 IoT 的属性。\n\n"

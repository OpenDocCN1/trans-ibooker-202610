    To implement this demo, we can perform some tasks with the following steps:\n\n\
    - adding a new thing\n- adding properties\n- editing the Sketch program\n- building\
    \ a dashboard\n- testing\n\nWe implement these steps in the next section.\n\n\
    ## Add a New Thing\n\nYou can create a new Thing on Arduino IoT Cloud. If you\
    \ have a free membership, you should delete the existing Thing on Arduino IoT\
    \ Cloud because you can only create one Thing.\n\nNow you can create a new Thing.\
    \ For instance, we set the Thing name as GyroscopeThing. Then, we can add some\
    \ properties to GyroscopeThing.\n\n## Add Property\n\nAfter creating a Thing,\
    \ we can add properties. For this demo, we create three properties to monitor\
    \ the Gyroscope sensor from Arduino Nano 33 IoT. These properties will be linked\
    \ to X, Y, and Z degrees from the Gyroscope sensor. When we can add a new property,\
    \ we have a form, as shown in Figure 5-20. We add three properties with property\
    \ parameters as shown in Table 5-1.\n\nAfter we create three Thing properties,\
    \ we will return to our Things dashboard. You can see three properties in Figure\
    \ 5-21.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_157_0.png)\n\nFigure 5-21.\
    \ Three properties on GyroscopeThing\n\n## Editing the Sketch Program\n\nAfter\
    \ we add three properties on GyroscopeThing, we can edit the Sketch program. We\
    \ will read the gyroscope sensor and then update sensor data to property variables.\n\
    \nClick the EDIT SKETCH button to edit our program on Arduino IoT Cloud. Then,\
    \ we have the Sketch web editor. We modify this Sketch program to enable us to\
    \ read the Gyroscope sensor and update three Thing properties.\n\nFirst, we set\
    \ the SSID ID and SSID key on Arduino Secret. Then, we open the main program.\
    \ We add the LSM6DS3 library on the Sketch program.\n\n```\n#include \"arduino_secrets.h\"\
    \n#include <Arduino_LSM6DS3.h>\n```\n\nWe will see our property variables, such\
    \ as xDegree, yDegree, and zDegree.\n\n```\nfloat xDegree;\nfloat yDegree;\nfloat\
    \ zDegree;\n```\n\n```\n#include \"thingProperties.h\"\n```\n\nOn the setup()\
    \ function, we initialize the LSM6DS3 library by calling IMU.begin() API. Then,\
    \ we can access the Gyroscope sensor on Arduino Nano 33 IoT.\n\n```\nvoid setup()\
    \ {\n...\n  if (!IMU.begin()) {\n    Serial.println(\"Failed to initialize IMU!\"\
    );\n    while (1);\n  }\n...\n}\n```\n\nWe can read the Gyroscope sensor and then\
    \ update to xDegree, yDegree, and zDegree variables. We can call IMU.gyroscopeAvailable()\
    \ to check whether sensor data is available or not. To read sensor data, we can\
    \ use the IMU.readGyroscope() function.\n\n```\nvoid loop() {\n    ArduinoCloud.update();\n\
    \    // Your code here\n    if (IMU.gyroscopeAvailable()) {\n        IMU.readGyroscope(xDegree,\
    \ yDegree, zDegree);\n    }\n    delay(1000);\n}\n```\n\nSave this program. Now\
    \ you can compile this Sketch program and upload to Arduino Nano 33 IoT device.\n\
    \n## Build a Dashboard\n\nWe build a dashboard to create interaction between Arduino\
    \ Nano 33 IoT and Arduino IoT Cloud. We perform a new dashboard program with the\
    \ following steps:\n\n- Create a new dashboard.\n- Add three value widgets into\
    \ the dashboard editor.\n- Each value widget is to be linked to each Thing Property,\
    \ as shown in Figure 5-22.\n- Do the same action for XDegree, YDegree, and ZDegree\
    \ value widgets.\n\nLast, we can set dashboard name. Now we can test our widgets\
    \ on the dashboard.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_160_0.png)\n\n\
    Figure 5-22. Linking a property to a widget\n\n## Testing\n\nWe can test our Arduino\
    \ IoT Cloud program. You can navigate to the Arduino IoT Cloud dashboard. Click\
    \ the dashboard form that we already created. Click the USE DASHBOARD button to\
    \ be in RUN mode.\n\nYou can see the widget output in Figure 5-23. Shake your\
    \ Arduino Nano 33 IoT board to see sensor data changes on dashboard widgets.\n"

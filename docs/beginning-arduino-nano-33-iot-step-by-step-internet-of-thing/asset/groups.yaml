    \ Arduino Nano 33 IoT 上的内置 LED。我们可以对 LED 设置 I/O，以便通过网络打开/关闭 LED。\n\n你可以先在 Arduino\
    \ IoT Cloud 上打开一个 Thing。图 5-9 显示了我们已经创建的 Thing。点击 Add Property 按钮添加一个新属性。点击后，你将获得一个表单，如图\
    \ 5-10 所示。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_146_0.png)\n\n图 5-10. 添加一个新属性\n\
    \n在此场景中，你可以设置以下选项：\n\n- Name: LED1\n- VARIABLE NAME: LED1\n- TYPE: ON/OFF (Boolean)\n\
    - Permission: Read & Write\n- Update: when the value changes\n- History: checked\n\
    \n我的条目显示在图 5-10 中。填写所有字段后，你可以点击 ADD PROPERTY 按钮。你将返回 Things 表单。你应该在 Thing 表单上看到\
    \ LED1 属性，如图 5-11 所示。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_147_0.png)\n\
    \n图 5-11. 带有一个属性的 Thing\n\n你已经创建了一个 Thing。接下来，我们可以修改 Sketch 程序以连接到此 LED1 属性。\n\
    \n## 编辑 Sketch 程序\n\n现在我们可以编辑我们的 Sketch 程序。在 Thing 仪表盘的属性表单上（见图 5-11），你可以点击 EDIT\
    \ SKETCH 按钮。点击后，你将获得 Arduino 网页编辑器，如图 5-12 所示。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_148_0.png)\n\
    \n*图 5-12.* 编辑 Sketch 程序\n\n首先，我们修改 Secret 程序以配置 Arduino Nano 33 IoT 上的 WiFi 网络。在\

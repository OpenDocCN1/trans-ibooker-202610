    # Building a Simple IoT Application


    Since we have a network module in Arduino Nano 33 IoT, we can build a simple IoT
    application. We can control an LED from a website. We can turn on/off LEDs. For
    demo implementation, we need three LEDs.


    Technically, we will build a simple webserver inside Arduino Nano 33 IoT. We receive
    HTTP GET requests to perform LED on/off from users. We define the following HTTP
    GET requests.


    +   - http://<ip_address Arduino>/gpio1/1 for turning on LED1

    +   - http://<ip_address Arduino>/gpio1/0 for turning off LED1

    +   - http://<ip_address Arduino>/gpio2/1 for turning on LED2

    +   - http://<ip_address Arduino>/gpio2/0 for turning on LED2

    +   - http://<ip_address Arduino>/gpio3/1 for turning on LED3

    +   - http://<ip_address Arduino>/gpio3/0 for turning on LED3


    Next, we build wiring for our demo.


    # Wiring


    We need three LEDs for our demo. We can build the following wiring:


    +   - LED 1 is connected to digital pin 6 on Arduino Nano 33 IoT

    +   - LED 2 is connected to digital pin 4 on Arduino Nano 33 IoT.'

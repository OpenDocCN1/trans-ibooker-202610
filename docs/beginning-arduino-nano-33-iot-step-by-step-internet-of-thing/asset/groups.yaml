    \ 添加一个开关\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_152_0.png)\n\n## 图 5-16.\
    \ 设置 Switch widget\n\n点击 Linked Property 按钮以链接到 Thing 属性。我们将获得一个表单，如图 5-17 所示。选择我们的\
    \ Thing 名称，并选择 Property (LED1)。如果完成，点击 LINK PROPERTY 按钮。然后，我们将返回到仪表盘编辑器。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_153_0.png)\n\
    \n*图 5-17.* 将开关链接到 thing 属性\n\n你也可以重命名我们的仪表盘程序——例如，LED Demo。现在我们可以测试我们的仪表盘程序。\n\
    \n## 测试\n\n要测试我们的程序，我们需要将仪表盘程序激活到运行模式。你可以点击 USE DASHBOARD 按钮来激活仪表盘程序。\n\n你可以尝试将\
    \ Switch 切换到 ON 模式。然后，你应该看到 Arduino Nano 33 IoT 上的内置 LED 点亮。你也可以通过将 Switch 切换到\
    \ OFF 模式来关闭 LED。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_154_0.png)\n\n*图\
    \ 5-18. 仪表盘编辑器上的 LED 演示程序*\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_154_1.png)\n\
    \n*图 5-19. 切换 Switch 以打开 LED*\n\n你可以通过添加一些 LED 来自定义此程序。然后，你可以在 Things 程序上添加一些属性。\n\
    \n## 开发传感器监控\n\n我们已经创建了 Arduino IoT Cloud 来打开/关闭 Arduino Nano 33 IoT 上的 LED。现在我们可以继续构建\
    \ Arduino IoT Cloud 程序以监控传感器。在此演示中，我们使用 Arduino Nano 33 IoT 上的内置传感器。为测试，我们使用陀螺仪传感器。\n\
    \n要实现此演示，我们可以按以下步骤执行一些任务：\n\n- adding a new thing\n- adding properties\n- editing\
    \ the Sketch program\n- building a dashboard\n- testing\n\n我们在下一节中实现这些步骤。\n\n\
    ## 添加一个新的 Thing\n\n你可以在 Arduino IoT Cloud 上创建一个新的 Thing。如果你有免费会员，你应该删除 Arduino\
    \ IoT Cloud 上的现有 Thing，因为你只能创建一个 Thing。\n\n现在你可以创建一个新的 Thing。例如，我们将 Thing 名称设为\
    \ GyroscopeThing。然后，我们可以向 GyroscopeThing 添加一些属性。\n\n## 添加属性\n\n创建 Thing 后，我们可以添加属性。对于此演示，我们创建三个属性来监控来自\
    \ Arduino Nano 33 IoT 的陀螺仪传感器。这些属性将链接到陀螺仪传感器的 X、Y 和 Z 度。当我们可以添加一个新属性时，我们有一个表单，如图\
    \ 5-20 所示。我们添加三个属性，其属性参数如表 5-1 所示。\n\n创建三个 Thing 属性后，我们将返回到 Things 仪表盘。你可以在图 5-21\
    \ 中看到三个属性。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_157_0.png)\n\n图 5-21. GyroscopeThing\
    \ 上的三个属性\n\n## 编辑 Sketch 程序\n\n在 GyroscopeThing 上添加三个属性后，我们可以编辑 Sketch 程序。我们将读取陀螺仪传感器，然后将传感器数据更新到属性变量。\n\
    \n点击 EDIT SKETCH 按钮以在 Arduino IoT Cloud 上编辑我们的程序。然后，我们有 Sketch 网页编辑器。我们修改此 Sketch\
    \ 程序以使我们能够读取陀螺仪传感器并更新三个 Thing 属性。\n\n首先，我们在 Arduino Secret 上设置 SSID ID 和 SSID\
    \ key。然后，我们打开主程序。我们在 Sketch 程序上添加 LSM6DS3 库。\n\n```\n#include \"arduino_secrets.h\"\
    \n#include <Arduino_LSM6DS3.h>\n```\n\n我们将看到我们的属性变量，例如 xDegree、yDegree 和 zDegree。\n\
    \n```\nfloat xDegree;\nfloat yDegree;\nfloat zDegree;\n```\n\n```\n#include \"\
    thingProperties.h\"\n```\n\n在 setup() 函数中，我们通过调用 IMU.begin() API 初始化 LSM6DS3 库。然后，我们可以访问\
    \ Arduino Nano 33 IoT 上的陀螺仪传感器。\n\n```\nvoid setup() {\n...\n  if (!IMU.begin())\
    \ {\n    Serial.println(\"Failed to initialize IMU!\");\n    while (1);\n  }\n\
    ...\n}\n```\n\n我们可以读取陀螺仪传感器然后更新到 xDegree、yDegree 和 zDegree 变量。我们可以调用 IMU.gyroscopeAvailable()\
    \ 来检查传感器数据是否可用。要读取传感器数据，我们可以使用 IMU.readGyroscope() 函数。\n\n```\nvoid loop() {\n\
    \    ArduinoCloud.update();\n    // Your code here\n    if (IMU.gyroscopeAvailable())\
    \ {\n        IMU.readGyroscope(xDegree, yDegree, zDegree);\n    }\n    delay(1000);\n\
    }\n```\n\n保存此程序。现在你可以编译此 Sketch 程序并上传到 Arduino Nano 33 IoT 设备。\n\n## 构建仪表盘\n\n\
    我们构建一个仪表盘以在 Arduino Nano 33 IoT 和 Arduino IoT Cloud 之间创建交互。我们按以下步骤执行一个新的仪表盘程序：\n\
    \n- Create a new dashboard.\n- Add three value widgets into the dashboard editor.\n\
    - Each value widget is to be linked to each Thing Property, as shown in Figure\
    \ 5-22.\n- Do the same action for XDegree, YDegree, and ZDegree value widgets.\n\
    \n最后，我们可以设置仪表盘名称。现在我们可以测试仪表盘上的小部件。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_160_0.png)\n\
    \n图 5-22. 将属性链接到小部件\n\n## 测试\n\n我们可以测试我们的 Arduino IoT Cloud 程序。你可以导航到 Arduino\
    \ IoT Cloud 仪表盘。点击我们已经创建的仪表盘表单。点击 USE DASHBOARD 按钮进入 RUN 模式。\n\n你可以在图 5-23 中看到小部件输出。摇动你的\
    \ Arduino Nano 33 IoT 板以在仪表盘小部件上看到传感器数据变化。\n\n"

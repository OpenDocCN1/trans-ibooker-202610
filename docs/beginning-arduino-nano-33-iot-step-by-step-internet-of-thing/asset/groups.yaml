    \ the Gyroscope sensor and then update to xDegree, yDegree, and zDegree variables.\
    \ We can call IMU.gyroscopeAvailable() to check whether sensor data is available\
    \ or not. To read sensor data, we can use the IMU.readGyroscope() function."

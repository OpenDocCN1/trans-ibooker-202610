    # Demo 3: Sensor Real-Time Monitoring


    In this section, we build a sensor real-time monitoring over the BLE radio. We
    make a BLE service that provides Gyroscope sensor data to the BLE reader. The
    BLE reader will obtain notification if the sensor data changes.



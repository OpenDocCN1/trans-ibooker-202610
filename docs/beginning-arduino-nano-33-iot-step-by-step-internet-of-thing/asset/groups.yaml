    \ (chip) to communicate with one or more \"master\" chips. This protocol works\
    \ with asynchronous mode.\nTo communicate with other devices/modules, I2C protocol\
    \ defines the I2C address for all \"slave\" devices.\n\nThe I2C interface has\
    \ two pins: serial data (SDA) and serial clock (SCL). For data transfer, the I2C\
    \ interface uses an SDA pin. An SCL pin is used for clocking. The Arduino Nano\
    \ 33 IoT board has I2C pins on A4 as SDA and A5 as SCL.\n\nFor our demo, we use\
    \ a sensor module-based I2C interface. The I2C interface uses a device address\
    \ so the Arduino Nano 33 IoT board can access data by opening a connection to\
    \ the I2C address. Each analog sensor from sensor module-based I2C will be attached\
    \ to the I2C address.\n\nFor testing, I used a PCF8591 AD/DA converter module\
    \ with sensor and actuator devices. This sensor module can be seen in Figure 2-21.\
    \ The PCF8591 AD/DA module uses a PCF8591 chip that consists of four analog input\
    \ and AD converters. The PCF8591 chip also has analog output with a DA converter.\
    \ For further information about the PCF8591 chip, you can read at this link, https://www.nxp.com/products/interfaces/ic-spi-serial-interface-devices/ic-dacs-and-adcs/8-bit-a-d-and-d-a-converter:PCF8591.\n\
    \nYou can find the chip at an online store like Aliexpress. You can probably obtain\
    \ this module at your local store.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_73_0.png)\n\
    \nFigure 2-21. PCF8591 ADC DAC AD/DA module\n\nBased on datasheet documentation\
    \ of the PCF8591 AD/DA converter module, this module uses I2C addresses on 0x48.\
    \ The PCF8591 AD/DA converter module also consists of three sensors as follows:\n\
    \n- Thermistor: using channel 0\n- Photoresistor: using channel 1\n- Potentiometer:\
    \ using channel 3\n\nNow attach the PCF8591 AD/DA converter module to the Arduino\
    \ Nano 33 IoT board with the following wiring:\n\n- The PCF8591 AD/DA module SDA\
    \ is connected to Arduino A4 pin.\n- The PCF8591 AD/DA module SCL is connected\
    \ to Arduino A5 pin.\n- The PCF8591 AD/DA module VCC is connected to Arduino 3.3V.\n\
    - The PCF8591 AD/DA module GND is connected to Arduino GND pin.\n\nFigure 2-22\
    \ shows my wiring for the PCF8591 AD/DA converter module and Arduino Nano 33 IoT.\
    \ You should see a lighting LED when we plug in 3.3V to the module.\n"

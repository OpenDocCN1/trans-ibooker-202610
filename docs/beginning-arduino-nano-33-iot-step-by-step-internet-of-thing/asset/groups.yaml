    \ work with the gyroscope sensor and the Serial object on the setup() function.\n\
    \n```\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial);\n}\n```\n\n\
    ```\nif (!IMU.begin()) {\n    Serial.println(\"Failed to initialize IMU!\");\n\
    \    while (1);\n}\n```\n\nWe also can print the current gyroscope sample rate\
    \ by calling the IMU.gyroscopeSampleRate() function on the serial terminal.\n\n\
    ```\nSerial.print(\"Gyroscope sample rate = \");\nSerial.print(IMU.gyroscopeSampleRate());\n\
    Serial.println(\" Hz\");\nSerial.println();\nSerial.println(\"Gyroscope in degrees/second\"\
    );\nSerial.println(\"X\\tY\\tZ\");\n```\n\nOn the loop() function, we read the\
    \ gyroscope sensor. We should check whether there is available gyroscope sensor\
    \ data by calling the IMU.gyroscopeAvailable() function. If it’s available for\

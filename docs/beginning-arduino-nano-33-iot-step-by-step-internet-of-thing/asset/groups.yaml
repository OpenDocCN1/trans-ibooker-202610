    \n## 图 5-13. Arduino IoT Cloud 的仪表盘\n\n我们可以在仪表盘编辑器上添加一个新的开关。点击 ADD 按钮并选择 Switch\
    \ widget。你可以在图 5-14 中看到 Switch widget 选项。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_150_1.png)\n\
    \n## 图 5-14. 在仪表盘上添加一个小部件\n\n点击 Switch widget 然后将其拖到仪表盘编辑器。拖动 Switch widget 后，你应该可以看到\
    \ Switch widget，如图 5-15 所示。\n\n点击 Example Data 将 Switch widget 链接到 Thing 属性。点击后，你将获得如图\

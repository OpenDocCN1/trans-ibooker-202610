    \    digitalWrite(led,state);\n    delay(300);\n}\n```\n\n现在我们已经学习了数字 I/O，我们将在下一节学习模拟\
    \ I/O。\n\n# Analog I/O\n\nArduino Nano 33 IoT 提供模拟 I/O 以使我们能够与传感器和执行器设备进行交互。我们可以看到标有\
    \ Ax 的模拟 I/O 引脚，其中 x 是模拟引脚号。你可以在 Arduino Nano 33 IoT 背面看到这些标签。\n\n你可以在图 2-9 中看到这些引脚。Arduino\
    \ Nano 33 IoT 有八个模拟输入（ADC）和一个模拟输入（DAC）。对于 ADC 模型，Arduino Nano 33 IoT 提供 8 位、10\
    \ 位和 12 位的 ADC 分辨率。此外，DAC 模型具有 10 位分辨率。\n\n对于我们的演示，我们使用模拟传感器 TMP36。它是一个温度传感器。你也可以使用\
    \ TMP36 模块，如 Linksprite 的热模块，https://www.linksprite.com/wiki/index.php?title=Thermal_Module。你可以按图\
    \ 2-11 所示进行接线。你可以按以下方式构建接线：\n- TMP36 模块 VCC 连接到 Arduino 3.3V\n- TMP36 模块 GND 连接到\
    \ Arduino GND\n- TMP36 模块 SIG 连接到 Arduino 模拟 A0\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_56_0.png)\n\
    \n**图 2-11。** *模拟传感器与 Arduino Nano 33 IoT 的接线*\n\n# CHAPTER 2 ARDUINO NANO 33\
    \ IOT BOARD DEVELOPMENT\n\n现在我们可以编写 Arduino 程序来从 TMP36 模块读取模拟传感器。我们读取传感器数据然后在串行终端上显示。你可以开始打开\
    \ Arduino 软件并编写此完整程序。\n\n```\n```cpp\nvoid setup() {\n  Serial.begin(115200);\n\
    \  while (!Serial) {\n    ;\n  }\n}\n\nvoid loop() {\n  int reading = analogRead(A0);\n\
    \n  float voltage = reading * 3.3;\n  voltage /= 1024.0;\n\n  Serial.print(voltage);\
    \ Serial.println(\" volts\");\n\n  float tempC = (voltage - 0.5) * 100 ;\n\n \
    \ Serial.print(tempC);\n  Serial.println(\" degrees C\");\n  delay(3000);\n}\n\
    ```\n```\n\n将此程序保存为 AnalogSensor。现在你可以编译并将此程序上传到 Arduino Nano 33 IoT。打开 Serial\
    \ Monitor 工具以查看程序输出。图 2-12 显示了 AnalogSensor 程序的我的程序输出。\n\n它是如何工作的？\n\n# Plotting\

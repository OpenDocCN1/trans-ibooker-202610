  - '[PAGE 155]


    To implement this demo, we can perform some tasks with the following steps:


    +   - adding a new thing

    +   - adding properties

    +   - editing the Sketch program

    +   - building a dashboard

    +   - testing


    We implement these steps in the next section.


    # Add a New Thing


    You can create a new Thing on Arduino IoT Cloud. If you have a free membership,
    you should delete the existing Thing on Arduino IoT Cloud because you can only
    create one Thing.


    Now you can create a new Thing. For instance, we set the Thing name as GyroscopeThing.
    Then, we can add some properties to GyroscopeThing.


    # Add Property


    After creating a Thing, we can add properties. For this demo, we create three
    properties to monitor the Gyroscope sensor from Arduino Nano 33 IoT. These properties
    will be linked to X, Y, and Z degrees from the Gyroscope sensor. When we can add
    a new property, we have a form, as shown in Figure 5-20. We add three properties
    with property parameters as shown in Table 5-1.'

  mdcn: "\n\n# 第 6 章　蓝牙低功耗 (BLE)\n\n首先，打开串行监视器以查看 LED 程序的程序输出。现在你可以从你的平台打开 nRF Connect\
    \ for Mobile 应用程序。你应该能在该应用程序上看到 BLE 服务，如图 6-7 所示。点击 CONNECT 按钮以连接到 Arduino Nano\
    \ 33 IoT。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_175_0.png)\n\n**图 6-8。**\
    \ *显示 BLE 服务特征*\n\n连接后，你将获得一个表单，如图 6-8 所示。你可以展开 BLE 服务特征。我们有两个属性：READ 和 WRITE。\n\
    \n点击 WRITE 属性图标。然后，设置一个值 15 以打开 LED，如图 6-9 所示。点击 SEND 发送此值。你应该能看到 Arduino Nano\
    \ 33 IoT 上的 LED 点亮。你也可以发送 00 以在 BLE 服务 WRITE 上关闭 LED，如图 6-10 所示。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_176_0.png)\n\
    \n图 6-9. 写入数据 15 以打开 LED\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_177_0.png)\n\
    \n图 6-10. 写入数据 00 以关闭 LED\n\n如果你已经打开了串行监视器工具，你将看到程序输出事件信息。你可以在图 6-11 中看到我的程序输出。\n\
    \n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_178_0.png)\n\n图 6-11. LED 的程序输出\n\n\
    ## 演示 3：传感器实时监控\n\n在本节中，我们通过 BLE 无线电构建传感器实时监控。我们制作一个 BLE 服务，提供陀螺仪传感器数据给 BLE 读取器。BLE\
    \ 读取器将在传感器数据发生变化时获得通知。\n\n## 编写程序\n\n我们创建一个新的 Arduino 程序来创建 BLE 服务，然后广播陀螺仪传感器到\
    \ BLE 读取器。我们将创建一个包含三个特征的 BLE 服务。每个 BLE 特征将公开陀螺仪传感器 x、y 和 z 度的信息。\n\n开始开发时，我们可以打开\
    \ Arduino 软件。首先，我们调用所需的库。\n\n```\n#include <ArduinoBLE.h>\n#include <Arduino_LSM6DS3.h>\n\
    ```\n\n然后，我们定义 BLE 服务和三个 BLE 特征。\n我们需要不同的 UUID 来应用这些功能。我们还定义三个变量来保存传感器数据。\n\n\
    ```\nBLEService sensorService(\"16150f38-e7a9-4fe1-ae08-48464baf25b2\");\nBLEStringCharacteristic\
    \ xSensorLevel(\"ff99948c-18ff-4ed8-942e-512b9b24b6da\", BLERead | BLENotify,15);\n\
    BLEStringCharacteristic ySensorLevel(\"8084aa6b-6cae-461f-9540-e1a5768de49d\"\
    , BLERead | BLENotify,15);\nBLEStringCharacteristic zSensorLevel(\"ab80cb77-fe74-40d8-9757-96f8a54c16d9\"\
    , BLERead | BLENotify,15);\n\n// last sensor data\nfloat oldXLevel = 0;\nfloat\
    \ oldYLevel = 0;\nfloat oldZLevel = 0;\nlong previousMillis = 0;\n```\n\n在 setup()\
    \ 函数中，我们使用波特率 115200 初始化串行通信、陀螺仪传感器、LED 数字引脚和 OLED 集成电路 I2C 显示模块。\n\n```\nvoid\
    \ setup() {\n  Serial.begin(115200);\n  while (!Serial);\n\n  if (!IMU.begin())\
    \ {\n    Serial.println(\"Failed to initialize IMU!\");\n    while (1);\n  }\n\
    }\n```\n\n```\npinMode(LED_BUILTIN, OUTPUT);\n\nif (!BLE.begin()) {\n    Serial.println(\"\
    starting BLE failed!\");\n    while (1);\n}\n```\n\n现在我们定义 BLE 服务名称并添加到广告服务中。然后，将所有\
    \ BLE 特征添加到 BLE 服务中。\n\n```\nBLE.setLocalName(\"Gyroscope\");\nBLE.setAdvertisedService(sensorService);\n\
    \nsensorService.addCharacteristic(xSensorLevel);\nsensorService.addCharacteristic(ySensorLevel);\n\
    sensorService.addCharacteristic(zSensorLevel);\nBLE.addService(sensorService);\n\
    ```\n\n我们使用 writeValue() 函数在所有 BLE 特征上设置初始默认值。\n\n```\nxSensorLevel.writeValue(String(0));\n\
    ySensorLevel.writeValue(String(0));\nzSensorLevel.writeValue(String(0));\n```\n\
    \n现在我们可以通过调用 BLE.advertise() 函数开始广告 BLE 服务。BLE 读取器将识别此 BLE 服务器。\n\n```\nBLE.advertise();\n\
    Serial.println(\"Bluetooth device active, waiting for connections...\");\n}\n\
    ```\n\n在 loop() 函数中，我们等待传入的 BLE 读取器。一旦 BLE 读取器连接，我们打印 BLE 读取器的 MAC 地址。然后，我们打开\
    \ LED。\n\n```\nvoid loop() {\n    BLEDevice central = BLE.central();\n    if (central)\
    \ {\n        Serial.print(\"Connected to central: \");\n        Serial.println(central.address());\n\
    \        digitalWrite(LED_BUILTIN, HIGH);\n```\n\n如果 BLE 读取器已连接，我们有 BLEDevice\
    \ 对象。我们可以执行循环函数直到 BLE 读取器断开连接。在循环内部，我们调用 updateGyroscopeLevel() 函数将传感器数据更新到 BLE\
    \ 服务。\n\n```\nwhile (central.connected()) {\n    //long currentMillis = millis();\n\
    \    updateGyroscopeLevel();\n    delay(300);\n}\n```\n\n在 BLE 读取器断开连接后，我们关闭 LED。\n\
    \n```\ndigitalWrite(LED_BUILTIN, LOW);\n    Serial.print(\"Disconnected from central:\
    \ \");\n    Serial.println(central.address());\n}\n}\n```\n\n对于 updateGyroscopeLevel()\
    \ 函数的实现，我们使用 IMU.readGyroscope() 读取陀螺仪传感器。我们还使用 IMU.gyroscopeAvailable() 函数验证现有传感器数据。\n\
    \n```\nvoid updateGyroscopeLevel() {\n    float x, y, z;\n\n    if (IMU.gyroscopeAvailable())\
    \ {\n        IMU.readGyroscope(x, y, z);\n```\n\n图 6-12 显示了在 nRF Connect for Mobile\
    \ 应用程序上检测到的陀螺仪 BLE 服务。然后，点击 CONNECT 按钮以连接陀螺仪 BLE 服务。\n\n连接后，我们可以看到陀螺仪 BLE 服务的属性和特征，如图\
    \ 6-13 所示。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_183_0.png)\n\n图 6-12. 检测陀螺仪\
    \ BLE 服务\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_184_0.png)\n\n***图 6-13。***\
    \  *已连接到陀螺仪 BLE 服务*\n\n你可以展开 Unknown Service 以查看 BLE 特征。展开后，你将看到代表陀螺仪传感器数据的三个\
    \ BLE 特征。图 6-14 显示了陀螺仪 BLE 服务的三个 BLE 特征。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_185_0.png)\n\
    \n# 图 6-14. 从陀螺仪 BLE 服务打开 BLE 特征\n\n点击箭头数组图标，如图 6-14 所示。点击后，你将看到来自陀螺仪传感器的传感器数据。图\
    \ 6-15 显示了来自 Arduino Nano 33 IoT 的陀螺仪传感器数据。传感器数据由图 6-15 中的圆圈标记。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_186_0.png)\n\
    \n**图 6-15。** *在陀螺仪 BLE 服务上显示陀螺仪传感器*\n\n本章到此结束。你可以通过创建各种 BLE 服务进行更多练习。你也可以构建自己的移动应用程序来消费\
    \ BLE 服务。\n\n## 总结\n\n我们学习了如何在 Arduino Nano 33 IoT 板上设置 BLE 无线电。我们还通过应用 BLE 无线电构建了\
    \ Arduino 程序。我们从开发 Helloworld 应用程序开始。我们还通过 BLE 无线电控制了 LED。\n\n## 索引\n\n# A\n\n\
    Arduino IoT Cloud\n  添加新 Arduino 设备，135\n  构建传感器监控\n    添加新事物，149\n    添加属性，149\n\
    \    编辑 Sketch 程序，151\n    GyroscopeThing，151\n    输入参数，150\n    新仪表板\n      程序，153\n\
    \      测试，154\n  云列表，136\n  配置，136\n  创建代理，133\n  仪表板，132\n  调试控制台，134\n  远程 LED\n\

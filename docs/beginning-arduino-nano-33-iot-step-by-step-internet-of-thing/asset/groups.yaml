    ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_63_0.png)\n\n图 2-16. SerialDemo 程序的程序输出\n\
    \n# Pulse Width Modulation\n\n脉宽调制（PWM）是一种控制模拟输出的方法。技术上，它不是“真正的”模拟输出。微控制器单元（MCU）可以通过操纵占空比来产生脉冲。Arduino\

- "# 第4章\n\n## Arduino Nano 33 IoT网络\n\nArduino Nano 33 IoT是为物联网实现而设计的。该板有一个网络模块WiFi，使其能够与其他系统通信。在本章中，我们重点介绍Arduino\
  \ Nano 33 IoT如何访问外部系统（如服务器）并与之协作。\n\n在本章中，你将学习以下主题：\n\n- 使用WiFiNINA库设置WiFi\n- 扫描WiFi热点\n\
  - 连接到网络\n- 访问网络时间协议（NTP）服务器\n- 构建一个简单的IoT应用\n\n本章需要一个WiFi网络之类的环境。你应该提供一个已启用互联网的WiFi热点，以便Arduino\
  \ Nano 33 IoT可以与其他系统通信。\n\n\n\n\n\n### 引言\n\nArduino Nano 33 IoT 是 Arduino 的物联网平台之一。该板使用\
  \ WiFi 和蓝牙模块连接到网络。WiFi 是人们用来访问互联网的常见网络。蓝牙是无线个人局域网（WPAN）的一部分，可在短距离内与其他设备进行通信。\n\n\
  ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_111_0.png)\n\n图 4-1. Arduino Nano 33 IoT\
  \ 上的 WiFi 模块\n\nArduino Nano 33 IoT 设计用于低成本的物联网设备，以利用物联网解决方案。Arduino Nano 33 IoT\
  \ 具有 WiFi 模块，如图 4-1 所示。在本章中，我们在 Arduino Nano 33 IoT 上应用 WiFi 模块与其他设备进行通信。\n\n###\
  \ 设置 WiFiNINA 库\n\n要访问 Arduino Nano 33 IoT 板上的 WiFi 模块，我们应安装 WiFiNINA 库。我们可以通过库管理器安装它。你可以点击菜单\
  \ Sketch ▶ Include Library ▶ Manage Libraries。点击 Manage Libraries 菜单后，我们会得到如图 4-2\
  \ 所示的对话框。你可以在搜索文本框中输入 WiFiNINA。之后，你应该能在列表中看到 WiFiNINA（见图 4-2）。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_112_0.png)\n\
  \n图 4-2. 安装 WiFiNINA 库\n\n确保你的计算机已连接到互联网。安装 WiFiNINA 库后，我们可以创建 Arduino 程序通过 WiFi\
  \ 网络与其他系统进行通信。\n\n### 扫描 WiFi 热点\n\n如果我们知道 WiFi SSID 名称，我们就可以访问 WiFi 热点。在本节中，我们构建一个\
  \ Arduino 程序来扫描现有的 WiFi SSID，然后在串行终端上打印列表。\n\n现在你可以打开 Arduino 软件。你可以编写以下完整程序。\n\n\
  ```\n#include <SPI.h>\n#include <WiFiNINA.h>\n\nint led = 13;\n```\n\n```\nvoid\
  \ setup() {\n    Serial.begin(115200);\n    pinMode(led, OUTPUT);\n\n    // check\
  \ for the WiFi module:\n    if (WiFi.status() == WL_NO_MODULE) {\n        Serial.println(\"\
  Communication with WiFi module failed!\");\n        // don't continue\n        while\
  \ (true);\n    }\n}\nvoid loop() {\n    digitalWrite(led, HIGH);\n    scanWiFi();\n\
  \    digitalWrite(led, LOW);\n    delay(15000);\n}\n\nvoid scanWiFi() {\n    Serial.print(\"\
  Scanning...\");\n    byte ssid = WiFi.scanNetworks();\n\n    Serial.print(\"found\
  \ \");\n    Serial.println(ssid);\n\n    for (int i = 0; i<ssid; i++) {\n      \
  \  Serial.print(\">> \");\n        Serial.print(WiFi.SSID(i));\n        Serial.print(\"\
  \\tRSSI: \");\n        Serial.print(WiFi.RSSI(i));\n        Serial.print(\" dBm\"\
  );\n        Serial.print(\"\\tEncryption: \");\n        Serial.println(WiFi.encryptionType(i));\n\
  \    }\n}\n```\n\n```\nSerial.println(\"\");\nSerial.println(\"\");\n}\n```\n\n\
  将此程序保存为 WifiScan。现在你可以编译并上传此程序到 Arduino Nano 33 IoT。我们可以使用串行监视器查看程序输出。\n\n图 4-3\
  \ 显示了我对 WifiScan 程序的程序输出。你可以看到 WiFi SSID 的列表。如果你看不到 WiFi SSID 的列表，你应该移动到可以确定找到它们的地方。\n\
  \n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_114_0.png)\n\n图 4-3. 扫描 WiFi 热点\n\n它是如何工作的？\n\
  \n首先，我们定义 WiFiNINA 库和 Arduino Nano 33 IoT 上内置 LED 的数字引脚。\n\n```\n#include <SPI.h>\n\
  #include <WiFiNINA.h>\n\nint led = 13;\n```\n\n在 setup() 函数中，我们初始化 Serial 和 WiFi\
  \ 对象。\n\n```\nvoid setup() {\n    Serial.begin(115200);\n    pinMode(led, OUTPUT);\n\
  \n    // check for the WiFi module:\n    if (WiFi.status() == WL_NO_MODULE) {\n\
  \        Serial.println(\"Communication with WiFi module failed!\");\n        //\
  \ don't continue\n        while (true);\n    }\n}\n```\n\n为了扫描现有的 WiFi SSID，我们创建\
  \ scanWiFi() 函数。我们可以调用 WiFi.scanNetworks() 来检索所有现有的 WiFi SSID。一旦我们获得 WiFi SSID 列表，我们就打印\
  \ WiFi 信息，如 SSID 名称、RSSI 和加密模型。\n\n```\nvoid scanWiFi() {\n    Serial.print(\"Scanning...\"\
  );\n    byte ssid = WiFi.scanNetworks();\n\n    Serial.print(\"found \");\n    Serial.println(ssid);\n\
  \n    for (int i = 0; i<ssid; i++) {\n        Serial.print(\">> \");\n        Serial.print(WiFi.SSID(i));\n\
  \        Serial.print(\"\\tRSSI: \");\n        Serial.print(WiFi.RSSI(i));\n   \
  \     Serial.print(\" dBm\");\n        Serial.print(\"\\tEncryption: \");\n    \
  \    Serial.println(WiFi.encryptionType(i));\n    }\n}\n```\n\n```\nSerial.println(\"\
  \");\nSerial.println(\"\");\n}\n```\n\n我们将在 loop() 函数中使用 scanWiFi() 函数。我们也可以在程序扫描\
  \ WiFi SSID 时打开 LED。完全扫描 WiFi SSID 后，我们关闭 LED 并设置 15 秒的延迟。\n\n```\nvoid loop() {\n\
  \  digitalWrite(led, HIGH);\n  scanWiFi();\n  digitalWrite(led, LOW);\n  delay(15000);\n\
  }\n```\n\n### 连接到 WiFi 网络\n\n我们已经学会如何获取 WiFi SSID 列表。现在我们可以连接到并加入某个 WiFi SSID。我们需要\
  \ WiFi SSID 名称及其密钥的信息，如果该 WiFi SSID 应用了访问安全。\n\n对于我们的演示，我们使用名为 WiFiWebClient 的 Arduino\
  \ 程序。此程序将连接到 WiFi SSID，然后访问 Google 网站。图 4-4 是一个程序示例：WiFiWebClient。\n\n```\n#include\
  \ <SPI.h>\n#include <WiFiNINA.h>\n\n#include \"arduino_secrets.h\"\nchar ssid[]\
  \ = SECRET_SSID;\nchar pass[] = SECRET_PASS;\nint keyIndex = 0;\n\nint status =\
  \ WL_IDLE_STATUS;\nchar server[] = \"www.google.com\";\n\nWiFiClient client;\n```\n\
  \n我们初始化 Serial 和 WiFi 对象。我们为串行通信设置波特率 115200。我们还通过调用 WiFi.status() 函数验证 WiFi 模块。\n\
  \n```\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) {\n    ;\n  }\n\
  \  // check for the WiFi module:\n  if (WiFi.status() == WL_NO_MODULE) {\n    Serial.println(\"\
  Communication with WiFi module failed!\");\n    // don't continue\n    while (true);\n\
  \  }\n}\n```\n\nWiFi 对象初始化后，Arduino 连接到 WiFi 网络。一旦我们的 Arduino 连接上，我们使用 printWiFiStatus()\
  \ 函数在串行终端上打印 WiFi 连接状态。\n\n// attempt to connect to Wifi network:\nwhile (status\
  \ != WL_CONNECTED) {\n    Serial.print(\"Attempting to connect to SSID: \");\n \
  \   Serial.println(ssid);\n    status = WiFi.begin(ssid, pass);\n\n    // wait 10\
  \ seconds for connection:\n    delay(10000);\n}\nSerial.println(\"Connected to wifi\"\
  );\nprintWifiStatus();\n\n然后，我们使用 client.connect() 函数连接到 Google 网站。连接到 Google 网站后，我们可以发出\
  \ HTTP GET 请求。\n\n```\nSerial.println(\"\\nStarting connection to server...\");\n\
  if (client.connect(server, 80)) {\n    Serial.println(\"connected to server\");\n\
  \    // Make a HTTP request:\n    client.println(\"GET /search?q=arduino HTTP/1.1\"\
  );\n    client.println(\"Host: www.google.com\");\n    client.println(\"Connection:\
  \ close\");\n    client.println();\n}\n```\n\n```\nvoid loop() {\n    while (client.available())\
  \ {\n        char c = client.read();\n        Serial.write(c);\n    }\n}\n```\n\n\
  ```\n// if the server's disconnected, stop the client:\nif (!client.connected())\
  \ {\n    Serial.println();\n    Serial.println(\"disconnecting from server.\");\n\
  \    client.stop();\n\n    // do nothing forevermore:\n    while (true);\n}\n}\n\
  ```\n\n以下是 printWiFiStatus() 函数的实现。我们使用 WiFi.localIP() 函数打印 IP 地址。我们还通过调用 WiFi.RSSI()\
  \ 函数获取 RSSI。\n\n```\nvoid printWifiStatus() {\n    // print the SSID of the network\
  \ you're attached to:\n    Serial.print(\"SSID: \");\n    Serial.println(WiFi.SSID());\n\
  \n    // print your WiFi shield's IP address:\n    IPAddress ip = WiFi.localIP();\n\
  \    Serial.print(\"IP Address: \");\n    Serial.println(ip);\n\n    // print the\

  ```\n\n这使得 Serial Plotter 工具显示一个图表。\n\n### Serial Communication\n\n串行通信是在通信信道上一次一位、顺序发送数据的过程。在\
  \ Arduino Nano 33 IoT 中，我们可以使用 Serial 对象实现串行通信。我们已经在之前的项目中使用了此 Serial 对象来使用 Serial\
  \ Monitor 工具显示程序输出。\n\n我们可以通过调用 Serial 对象的 print() 和 println() 将数据写入串行通信。关于 Serial\
  \ 对象的更多信息，你可以阅读 https://www.arduino.cc/reference/en/language/functions/communication/serial/。\n\
  \n对于演示，我们构建一个闪烁程序。每个 LED 状态都写入串行终端。我们使用波特率 115200。你可以打开 Arduino 软件并编写此完整程序。\n\n\
  ```\nint led = 13;\n\nvoid setup() {\n    Serial.begin(115200);\n    pinMode(led,\
  \ OUTPUT);\n}\n\nvoid loop() {\n    Serial.println(\"LED: HIGH\");\n    digitalWrite(led,\
  \ HIGH);\n    delay(1000);\n    Serial.println(\"LED: LOW\");\n    digitalWrite(led,\
  \ LOW);\n    delay(1000);\n}\n```\n\n将此程序保存为 SerialDemo。现在你可以编译并将此程序上传到 Arduino\
  \ Nano 33 IoT。打开 Serial Monitor 工具以查看程序输出。图 2-16 显示了 SerialDemo 程序的我的程序输出。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_63_0.png)\n\
  \n图 2-16. SerialDemo 程序的程序输出\n\n### Pulse Width Modulation\n\n脉宽调制（PWM）是一种控制模拟输出的方法。技术上，它不是“真正的”模拟输出。微控制器单元（MCU）可以通过操纵占空比来产生脉冲。Arduino\
  \ Nano 33 IoT 在数字引脚上有一个 PWM 引脚。你可以在数字引脚上看到“~”符号作为 PWM 引脚。你可以看到图 2-9 显示了一个数字引脚例如\
  \ D2 ~。通常，Arduino Nano 33 IoT 在 2、3、5、6、9、10、11、12、16/A2、17/A3 和 19/A5 上有 11 个 PWM\
  \ 引脚。\n\n对于我们的演示，我们使用 RGB LED。此 LED 有四个引脚。三个引脚是红、绿和蓝引脚。剩余的可能是地（GND）或电压共集电极（VCC），取决于\
  \ RGB 阴极或阳极模型。\n\n我们可以按图 2-17 所示实现我们的演示接线。你可以按如下方式进行接线：\n- RGB 红色引脚连接到 Arduino 数字引脚\
  \ 12。\n- RGB 绿色引脚连接到 Arduino 数字引脚 11。\n- RGB 蓝色引脚连接到 Arduino 数字引脚 10。\n- RGB GND\
  \ 引脚连接到 Arduino 数字引脚 GND。\n\n\n\n\n\n# 第 2 章    ARDUINO NANO 33 IOT 板开发\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_65_0.png)\n\

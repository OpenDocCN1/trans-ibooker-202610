- "# CHAPTER 1\n### 设置开发环境\n\nArduino Nano 33 IoT 是一种物联网（IoT）解决方案，用于在物理环境中进行传感和执行。Arduino\
  \ Nano 33 IoT 板配备了 WiFi 和 BLE 模块，可与其他实体进行通信以交换数据。本章将探讨如何为开发设置 Arduino Nano 33 IoT\
  \ 板。\n\n本章的主题列表如下：\n\n- Reviewing Arduino Nano 33 IoT board\n- Setting up development\
  \ environment\n- Building LED blinking program\n- Applying Arduino web editor\n\n\
  ### Introduction\n\nArduino Nano 33 IoT 是 Arduino 的物联网平台之一。该板使用 WiFi 和蓝牙模块连接到网络。WiFi\
  \ 是人们用来访问互联网的常见网络。蓝牙是无线个人局域网（WPAN）的一部分，可在短距离内与其他设备通信。\n\nArduino Nano 33 IoT 板专为低成本物联网设备设计，以解决您的物联网问题。Arduino\
  \ Nano 33 IoT 尺寸小巧，45 x 18 mm（长 x 宽）。您可以在图 1-1 中看到我的 Arduino Nano 33 IoT 板。\n\n\
  ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_10_0.png)\n\nFigure 1-1. Arduino Nano 33\
  \ IoT board\n\n### Review Arduino Nano 33 IoT Board\n\nArduino Nano 33 IoT 由 ARM\
  \ Cortex M0 32 位 SAMD21 构建。该板还具有来自 u-blox 的射频模块 NINA-W102。该模块专为 WiFi 和蓝牙数据通信而设计。您可以在表\
  \ 1-1 中阅读 Arduino Nano 33 IoT 的详细规格。\n\n由于 Arduino Nano 33 IoT 具有一些数字和模拟 I/O，我们通过与其他传感器或执行器连接来扩展板的能力。我们还使用通用异步收发器/发送器（UART）、串行外设接口（SPI）和内部集成电路（I2C）协议与其他设备通信。\n\
  \n**Table 1-1.** *A Specification of Arduino Nano 33 IoT*\n\n| Features | Notes\
  \ |\n|---|---|\n| Microcontroller | SAMD21 Cortex-M0+ 32-bit |\n| Radio module |\
  \ u-blox NINA-W102 |\n| Secure module | ATECC608A |\n| Operating voltage | 3.3V\
  \ |\n| Input voltage | 21V |\n| DC current per I/O pin (limit) | 7 mA |\n| Clock\
  \ speed | 48 Mhz |\n| CPU flash memory | 256 KB |\n| SRAM | 32 KB |\n| EEPROM |\
  \ None |\n| Digital I/O | 14 |\n| PWM pins | 11 (2, 3, 5, 6, 9, 10, 11, 12, 16 /\
  \ A2, 17 / A3, 19 / A5) |\n| UART | 1 |\n| SPI | 1 |\n| I2C | 1 |\n| Analog Input\
  \ | 8 (ADC 8/10/12 bit) |\n| Analog Output | 1 (DAC 10 bit) |\n| LED_BUILTIN | 13\
  \ |\n| USB | Native in the SAMD21 processor |\n| IMU | LSM6DS3 |\n| Size (Length\
  \ x Width) | 45 mm x 18 mm |\n\nKey: CPU, central processing unit; SRAM, static\
  \ random-access memory; EEPROM, electrically erasable programmable read-only memory;\
  \ PWM, pulse width modulation; UART, universal asynchronous receiver/transmitter;\
  \ SPI, serial peripheral interface; I2C, inter-integrated circuit; USB, universal\
  \ serial bus; IMU, inertial measurement unit.\n\n接下来，我们将在计算机上设置 Arduino Nano 33\
  \ IoT，以便您可以为 Arduino 板构建程序。\n\n### Set Up Development Environment\n\nArduino 提供软件来为所有\
  \ Arduino 板型号构建程序。我们可以使用 Arduino 软件。您可以在以下链接下载 Arduino 软件：https://www.arduino.cc/en/Main/Software。该软件适用于\
  \ Windows、Linux 和 macOS。\n\n安装过程步骤简单。只需按照 Arduino 安装指南进行操作。安装完成后，您将在操作系统的主菜单中看到\
  \ Arduino 应用程序菜单。\n\n打开 Arduino 应用程序。然后，我们将获得如图 1-2 所示的 Arduino 应用程序。您将在应用程序对话框中看到骨架代码。以下是一个代码模板。\n\
  \n```\nvoid setup() {\n    // put your setup code here, to run once:\n}\n\nvoid\
  \ loop() {\n    // put your main code here, to run repeatedly:\n}\n```\n\n我们可以看出\
  \ Arduino 程序采用 C/C++ 程序语言方言。我们可以将所有数据初始化放在 setup() 函数中。程序将连续执行 loop() 函数内的代码。\n\n\
  # CHAPTER 1  SETTING UP DEVELOPMENT ENVIRONMENT\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_15_0.png)\n\
  \n*Figure 1-3.  Adding supported boards for Arduino Nano 33 IoT*\n\n此安装需要几分钟才能完成。安装完成后，您可以在目标板上看到\
  \ Arduino Nano 33 IoT 板。您可以通过在 Arduino 软件中点击菜单 **Tools > Board ... > Boards Manager...**\
  \ 来验证。您将看到您的板列表。图 1-4 显示了 Arduino 软件中的 Arduino Nano 33 IoT。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_17_0.png)\n\
  \n# Figure 1-5. Detected Arduino Nano 33 IoT on Device Manager—Windows 10\n\n如果您在\
  \ Linux 上工作，您可以使用终端上的此命令验证 Arduino Nano 33 IoT。\n\n```\n$ ls /dev/ttyUSB*\n```\n\
  \n您将看到通过 USB 连接的设备列表。Arduino Nano 33 IoT 通常检测为 /dev/ttyUSB0 或 /dev/ttyUSB1。对于 macOS，您可以输入此命令来检查\
  \ Arduino Nano 33 IoT。\n\n```\n$ ls /dev/cu*\n```\n\n您应该在终端上看到 USB 设备。\n\n### Hello\
  \ Arduino: Blinking LED\n\n我们首先构建一个 Arduino 程序。Arduino Nano 33 IoT 板具有一个内置 LED，连接到数字引脚\
  \ 13。在本节中，我们构建一个简单的 LED 闪烁。现在您可以将 Arduino Nano 33 IoT 连接到计算机。然后，我们可以开始编写 Arduino\
  \ 程序。\n\n您可以打开 Arduino 软件。我们从项目模板创建一个程序。您可以点击菜单，然后 File ➤ Examples ➤ 01.Basics ➤\
  \ Blink。点击后，您将获得如图 1-6 所示的程序代码。这是 Arduino 的示例程序。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_18_0.png)\n\
  \n*Figure 1-6.* Blink application on Arduino software\n\n# CHAPTER 1   SETTING UP\
  \ DEVELOPMENT ENVIRONMENT\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_20_0.png)\n\
  \n*Figure 1-7.* Compiling and flashing a program\n\n将 Arduino 程序上传到 Arduino Nano\
  \ 33 IoT 后，我们将在 Arduino Nano 33 IoT 板上看到闪烁的 LED。您可以在图 1-8 中看到我的闪烁 LED。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_21_0.png)\n\
  \n*Figure 1-8.* Blinking LED on Arduino Nano 33 IoT\n\n### How does it work?\n\n\
  Arduino Nano 33 IoT 板在数字引脚 13 上有一个内置 LED。在我们的程序中，我们使用 pinMode() 将数字引脚 13 设置为数字输出。我们在\
  \ setup() 函数中初始化此数据。\n\n```cpp\nvoid setup() {\n  // initialize digital pin LED_BUILTIN\
  \ as an output.\n  pinMode(LED_BUILTIN, OUTPUT);\n}\n```\n\nArduino 程序为内置 LED 引脚定义了\
  \ LED_BUILTIN。我们可以通过赋予值 OUTPUT 将引脚设置为输出模式。现在我们的程序将在 loop() 函数中连续运行。我们打开 LED 然后关闭\
  \ LED。我们可以使用 digitalWrite() 来执行 LED 的开/关。将值设置为 HIGH 以打开 LED。否则，我们可以通过在 digitalWrite()\
  \ 函数中发送 LOW 值来关闭 LED。我们还为打开/关闭 LED 设置延迟。我们在 delay() 函数中设置 1000 ms。\n\n\n\n\n\n```\n\
  void loop() {\n    digitalWrite(LED_BUILTIN, HIGH);    // turn the LED on (HIGH\n\
  \                                    is the voltage level)\n    delay(1000);   \
  \                     // wait for a second\n    digitalWrite(LED_BUILTIN, LOW);\
  \     // turn the LED off by\n                                    making the voltage\
  \ LOW\n    delay(1000);                        // wait for a second\n}\n```\n\n\
  你可以练习闪烁 LED 程序。\n\n接下来，我们可以使用 Arduino 网页编辑器作为 Arduino 开发的替代工具。我们只需要一个浏览器和网络连接。\n\
  \n## Arduino Web Editor\n\nArduino 提供了一个在线编辑器来构建 Arduino 程序。在线编辑器的优势在于我们不需要准备太多运行环境和工具。我们只需要浏览器和网络连接即可。\n\
  \n我们可以使用任何浏览器访问 Arduino 网页编辑器。你可以导航到链接 https://create.arduino.cc/editor。图 1-9 显示了\
  \ Arduino 网页编辑器模型。要使用 Arduino 网页编辑器，我们必须在 Arduino 门户注册以构建 Arduino 程序。\n\n在本节中，我们将重点介绍如何开始使用\
  \ Arduino 网页编辑器。我们将执行以下任务来完成使用在线网页编辑器的 Arduino 开发：\n\n- 注册你的 Arduino 门户账户\n- 安装\
  \ Arduino 插件\n- 为 Arduino Nano 33 IoT 构建 blink 应用\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_23_0.png)\n\
  \n图 1-9. Arduino 网页编辑器\n\n## 注册 Arduino 账户\n\n要使用 Arduino 网页编辑器使用和构建 Arduino 程序，我们必须注册一个\
  \ Arduino 账户。此账户与在 Arduino 商店购买 Arduino 板时使用的账户类似。\n\n你可以在右上角菜单图标上注册新的 Arduino 账户。你可以通过此门户填写个人信息。完成账户注册后，我们就可以使用\
  \ Arduino 网页编辑器构建 Arduino 程序。\n\n## 安装 Arduino 插件\n\n为了使我们的 Arduino Nano 33 IoT\
  \ 能够连接到 Arduino 网页编辑器，我们需要安装 Arduino 插件。这是 Windows 所需的任务。Arduino 插件将充当本地 Arduino\
  \ Nano 33 IoT 与 Arduino 网页编辑器之间的桥梁。\n\n# CHAPTER 1　SETTING UP DEVELOPMENT ENVIRONMENT\n\
  \n首先，我们打开浏览器并导航到链接 https://create.arduino.cc/getting-started/plugin/welcome。然后，我们会看到一个表单，如图\
  \ 1-10 所示。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_24_0.png)\n\n**Figure 1-10.**\
  \ *Arduino plug-in installation*\n\n点击 START 按钮。之后，你会看到一个表单，如图 1-11 所示。点击 DOWNLOAD\
  \ 按钮下载 Arduino 插件应用程序。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_26_0.png)\n\n\
  # Figure 1-12. Detecting the Arduino plug-in\n\n点击 NEXT 按钮后，我们会收到安装完成的确认，如图 1-13\
  \ 所示。\n\n你可以点击 GO TO WEB EDITORS 按钮继续。你将被引导至 Arduino 网页编辑器，如图 1-9 所示。\n\n现在我们已准备好使用\
  \ Arduino 网页编辑器进行 Arduino 开发。接下来，我们将构建一个 blink Arduino 应用。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_27_0.png)\n\
  \n图 1-13. 已完成 Arduino 插件安装\n\n## 构建 Arduino 程序\n\nArduino 网页编辑器具有与桌面版 Arduino 软件相同的功能。Arduino\
  \ 网页编辑器有项目示例。我们也可以向项目中添加 Arduino 库。\n\n在本节中，我们像之前的项目一样构建一个 blink Arduino 应用。我们首先打开浏览器并导航到\
  \ https://create.arduino.cc/editor。点击左侧菜单中的 Examples 菜单。然后，点击 BUILTIN 选项卡并选择 01.BASICS(6)\
  \ -> Blink。你可以在图 1-14 中看到我们的 Arduino 项目。\n\n选择 Blink 项目示例后，我们就有了 blink 程序。你可以在图\
  \ 1-15 中看到此程序。现在我们可以编译并将程序上传到 Arduino Nano 33 IoT。\n\n从设备列表的下拉菜单中选择你的 Arduino Nano\
  \ 33 IoT 板。点击下拉菜单左侧的 Verify and Upload 图标。此工具将编译并将 Arduino 程序上传到目标板。\n\n# CHAPTER\
  \ 1 SETTING UP DEVELOPMENT ENVIRONMENT\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_28_0.png)\n\
  \n图 1-14. 创建新项目\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_28_1.png)\n\n图 1-15.\
  \ 将程序上传到 Arduino Nano 33 IoT\n\n我们可以使用 Arduino 网页编辑器尝试构建另一个 Arduino 项目。我们可以使用此工具的项目示例。\n\
  \n这是设置 Arduino 开发环境的章节结尾。\n\n## Summary\n\n我们学习了如何设置 Arduino 开发环境。我们还在桌面环境中安装了 Arduino\
  \ 软件。我们构建了一个简单的 Arduino 程序 blink。此外，我们尝试使用 Arduino 网页编辑器构建 Arduino 程序。\n\n接下来，我们将学习如何访问\
  \ Arduino Nano 33 IoT 输入/输出。我们也使用其他通信协议。\n"
- "# CHAPTER 2\n\n## Arduino Nano 33 IoT Board Development\n\n本章重点介绍如何构建 Arduino Nano\
  \ 33 IoT 程序。我们使用 Arduino Sketch 来构建 Arduino 程序。此软件适用于 Windows、macOS 和 Linux。然后，我们通过\
  \ Arduino 程序探索如何访问 Arduino Nano 33 IoT 板上的输入/输出外设。\n\n在本章中，你将学习：\n\n- 如何使用 Sketch\
  \ 编写 Arduino 程序\n- 如何访问数字 I/O\n- 如何访问模拟 I/O\n- 如何绘制模拟传感器模拟\n- 如何构建串行通信\n- 如何访问 PWM\n\
  - 如何访问 SPI\n- 如何扫描 I2C 地址\n- 如何基于 I2C 读取传感器设备\n\n### Introduction\n\n我们可以说 Arduino\
  \ 是一个平台，因为 Arduino 公司提供硬件和软件。要为 Arduino Nano 33 IoT 板构建程序，我们可以使用 Arduino Sketch。此程序使用\
  \ C/C++ 方言作为其语言风格。\n\n在本章中，我们学习如何为 Arduino Nano 33 IoT 构建程序。这是各种 Arduino 型号之一。Arduino\
  \ Nano 33 IoT 板使用 WiFi 和蓝牙模块连接到网络。WiFi 是人们用来访问互联网的常见网络。蓝牙是无线个人局域网的一部分，可实现与短距离内其他设备的通信。\n\
  \n我们使用 Arduino 软件来构建 Arduino 程序。此工具使用 Sketch 程序，该程序使用 C++ 方言。在下一节中，我们开始学习 Sketch\
  \ 编程。\n\n### Basic Sketch Programming\n\n在本节中，我们学习 Sketch 编程语言。技术上，Sketch 使用 C++\
  \ 方言，因此如果你有 C++ 编程语言经验，可以跳过本节。\n\n### Main Program\n\nArduino 程序有一个主程序来持续执行任务。当我们使用\
  \ Arduino 软件创建程序时，我们有两个函数的骨架代码：setup() 和 loop()。你可以查看完整的代码如下。\n\n```\nvoid setup()\
  \ {\n  // put your setup code here, to run once:\n}\n```\n\n由于 Sketch 程序采用自 C++，我们将\
  \ ; 放在代码行的末尾。否则，在编译代码时我们会得到错误。例如，我们使用 int 和 char 数据类型声明变量如下：\n\n```\nint a;\nint\
  \ b = 10;\nchar c;\nchar d = 'A';\n```\n\n我们可以在声明变量时设置初始值。例如，我们设置 int b = 10。\n\n\
  **Table 2-1. Data Types on the Sketch Program**\n\n| array | float | void |\n| bool\
  \ | int | String() |\n| Boolean | long | unsigned char |\n| Byte | short | unsigned\
  \ int |\n| char | size_t | unsigned long |\n| double | string | word |\n\n作为演示，我们为\
  \ Arduino Nano 33 IoT 创建一个项目。打开 Arduino 软件并编写这些代码。\n\n```\nvoid setup() {\n  int\
  \ a = 10;\n  int b = 5;\n```\n\n```\n// initialize serial communication\nSerial.begin(115200);\n\
  while (!Serial) {\n    ;\n}\n\nint c = a + b;\nint d = a * b;\n\n// print\nSerial.print(\"\
  C= \");\nSerial.println(c);\n\nSerial.print(\"d= \");\nSerial.println(d);\n}\nvoid\
  \ loop() {\n}\n```\n\n\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_35_0.png)\n\n\
  **图 2-1. 声明变量**\n\n图 2-1 显示了上述代码。要打印消息，我们使用 Serial.print() 和 Serial.println() 函数。我们可以使用\
  \ Serial.print() 在不换行 \"\\r\\n\" 的情况下打印消息。否则，我们可以使用 Serial.println() 打印带换行的消息。\n\
  \n所有使用 Serial 库打印的消息都将显示在串行通信通道上。现在我们可以保存此程序。然后，编译并上传到 Arduino Nano 33 IoT 板。\n\n\
  ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_37_0.png)\n\n**图 2-3. Serial Monitor 工具上的程序输出**\n\
  \n如果您在 Serial Monitor 工具上看不到输出消息，可以点击 Arduino Nano 33 IoT 板上的 RESET 按钮。您可以在 micro\
  \ USB 连接器旁边找到此按钮。您可以在图 2-4 中看到 RESET 按钮的位置。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_37_1.png)\n\
  \n**图 2-4. 在 Arduino Nano 33 IoT 上点击 RESET 按钮**\n\n在 loop() 函数中，我们什么都不做。所有代码都在 setup()\
  \ 函数中运行。这就是你可能看不到程序输出的原因，因为我们看到它太晚了。\n\n```cpp\nvoid loop() {\n}\n```\n\n### 运算符\n\
  \nSketch 程序采用 C++ 运算符。我们可以声明算术运算符来执行数学运算。我们可以使用以下算术运算符：\n\n- % （余数）\n- * （乘法）\n\
  - + （加法）\n- - （减法）\n- / （除法）\n- = （赋值运算符）\n\n对于布尔运算符，我们实现 && 用于逻辑与，|| 用于逻辑或，! 用于逻辑非。\n\
  \n### 条件语句\n\n我们可以执行基于动作的条件。例如，如果光传感器获得低强度值，我们想打开一盏灯。在 Sketch 中，我们使用 if 和 switch\
  \ 语法实现条件语句。带有 if 的条件语句可以如下声明：\n\n```cpp\nif(<conditional>) {\n  // do something\n\
  } else {\n  // do something\n}\n```\n\n我们可以将条件值放在 <conditional> 上，例如应用布尔和算术运算符。作为演示，我们可以在\
  \ Arduino Nano 33 IoT 上创建一个 Sketch 程序。你编写这个完整程序。\n\n```cpp\nlong num_a;\nlong num_b;\n\
  \nvoid setup() {\n  // initialize serial communication\n  Serial.begin(115200);\n\
  \  while (!Serial) {\n    ;\n  }\n}\n\nvoid loop() {\n  num_a = random(100);\n \
  \ num_b = random(100);\n\n  // print\n  Serial.print(\"num_a: \");\n  Serial.print(num_a);\n\
  \  Serial.print(\", num_b: \");\n  Serial.println(num_b);\n\n  if(num_a > num_b)\
  \ {\n    Serial.println(\"num_a > num_b\");\n  }else {\n    Serial.println(\"num_a\
  \ <= num_b\");\n  }\n\n  delay(2000);\n}\n```\n\n将此程序保存为 conditional。现在你可以编译并上传此程序到\
  \ Arduino Nano 33 IoT 板。打开 Serial Monitor 工具即可看到此程序输出。图 2-5 显示了我对条件程序的程序输出。\n\n\
  ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_41_0.png)\n\n**图 2-5. 条件 if 程序的程序输出**\n\

  \ strength (RSSI):\");\n    Serial.print(rssi);\n    Serial.println(\" dBm\");\n\
  }\n```\n\n保存所有代码。现在你可以编译并上传此程序到 Arduino Nano 33 IoT。我们可以使用串行监视器查看程序输出。\n\n图 4-5\
  \ 显示了我对 WiFiWebClient 程序的程序输出。你可以通过访问 Google 网站看到输出程序。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_121_0.png)\n\
  \n图 4-5. 访问 Google 网站的编程输出\n\n### 访问网络时间协议服务器\n\n有时我们想在 Arduino Nano 33 IoT 上获取当前时间。我们可以应用网络时间协议（NTP）服务器来检索当前时间。此时间使用\
  \ UTC 时区。\n\n对于我们的演示，我们可以使用 Arduino 的程序示例。此程序称为 WiFiUdpNtpClient。你可以在图 4-6 中看到此程序。\n\
  \n我们将探索此程序。首先，此程序有两个文件：WiFiUdpNtpClient.ino 和 arduino_secret.h。你可以在 arduino_secret.h\
  \ 文件上设置你的 WiFi SSID 名称和密钥。\n\n```\n#define SECRET_SSID \"SSID\"\n#define SECRET_PASS\
  \ \"SSID-PIN\"\n```\n\n我们的核心程序在 WiFiUdpNtpClient.ino 文件中实现。我们声明 WiFiNINA、WiFi SSID\
  \ 信息和 WiFiClient 对象。\n\n\n\n\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_122_0.png)\n\
  \n#### **图 4-6.** *WiFiUdpNtpClient 的程序代码*\n\n```cpp\n#include <SPI.h>\n#include\
  \ <WiFiNINA.h>\n#include <WiFiUdp.h>\n\nint status = WL_IDLE_STATUS;\n#include \"\
  arduino_secrets.h\"\nchar ssid[] = SECRET_SSID;\nchar pass[] = SECRET_PASS;\nint\
  \ keyIndex = 0;\n```\n\n```\n// attempt to connect to Wifi network:\nwhile (status\
  \ != WL_CONNECTED) {\n    Serial.print(\"Attempting to connect to SSID: \");\n \
  \   Serial.println(ssid);\n    // Connect to WPA/WPA2 network. Change this line\
  \ if using\n    // open or WEP network:\n    status = WiFi.begin(ssid, pass);\n\n\
  \    // wait 10 seconds for connection:\n    delay(10000);\n}\n\nSerial.println(\"\
  Connected to wifi\");\nprintWifiStatus();\n\nSerial.println(\"\\nStarting connection\
  \ to server...\");\nUdp.begin(localPort);\n}\n```\n\n在 loop() 函数中，我们通过调用 sendNTPpacket()\
  \ 函数向 NTP 服务器发送数据。我们将在下一步实现 sendNTPpacket() 函数。一旦我们从 NTP 服务器收到响应，我们使用 Udp.parsePacket()\
  \ 解析数据。\n\n```\nvoid loop() {\n    sendNTPpacket(timeServer);\n    delay(1000);\n\
  \    if (Udp.parsePacket()) {\n        Serial.println(\"packet received\");\n  \
  \      Udp.read(packetBuffer, NTP_PACKET_SIZE);\n```\n\n我们从 NTP 服务器计算出纪元时间，即秒数。\n\
  \n```\nunsigned long highWord = word(packetBuffer[40],\npacketBuffer[41]);\nunsigned\
  \ long lowWord = word(packetBuffer[42],\npacketBuffer[43]);\n\nunsigned long secsSince1900\
  \ = highWord << 16 | lowWord;\nSerial.print(\"Seconds since Jan 1 1900 = \");\n\
  Serial.println(secsSince1900);\n```\n\n```\n// now convert NTP time into everyday\
  \ time:\nSerial.print(\"Unix time = \");\n// Unix time starts on Jan 1 1970. In\
  \ seconds, that's\n// 2208988800:\nconst unsigned long seventyYears = 2208988800UL;\n\
  // subtract seventy years:\nunsigned long epoch = secsSince1900 - seventyYears;\n\
  // print Unix time:\nSerial.println(epoch);\n```\n\n然后，我们将 UTC 时间，如小时、分钟和秒，打印到串行终端。\n\
  \n```\nSerial.print(\"The UTC time is \");\nSerial.print((epoch % 86400L) / 3600);\n\
  Serial.print(':');\nif (((epoch % 3600) / 60) < 10) {\n    Serial.print('0');\n\
  }\nSerial.print((epoch % 3600) / 60);\nSerial.print(':');\nif ((epoch % 60) < 10)\
  \ {\n    Serial.print('0');\n}\n```\n\n```\nSerial.println(epoch % 60); // print\
  \ the second\n}\ndelay(10000);\n}\n```\n\n以下是 `sendNTPpacket()` 函数的实现。我们请求 NTP 服务器的数据。我们传递\
  \ NTP 服务器的 IP 地址。NTP 响应的结果被读取并存储到 packetBuffer 变量中。\n\n```\nunsigned long sendNTPpacket(IPAddress&\
  \ address) {\n  // set all bytes in the buffer to 0\n  memset(packetBuffer, 0, NTP_PACKET_SIZE);\n\
  \  // Initialize values needed to form NTP request\n  packetBuffer[0] = 0b11100011;\
  \  // LI, Version, Mode\n  packetBuffer[1] = 0;           // Stratum, or type of\
  \ clock\n  packetBuffer[2] = 6;           // Polling Interval\n  packetBuffer[3]\
  \ = 0xEC;         // Peer Clock Precision\n  // 8 bytes of zero for Root Delay &\
  \ Root Dispersion\n  packetBuffer[12] = 49;\n  packetBuffer[13] = 0x4E;\n  packetBuffer[14]\
  \ = 49;\n  packetBuffer[15] = 52;\n\n  //NTP requests are to port 123\n  Udp.beginPacket(address,\
  \ 123);\n  Udp.write(packetBuffer, NTP_PACKET_SIZE);\n  Udp.endPacket();\n}\n```\n\
  \n以下是 `printWiFiStatus()` 函数的实现。我们使用 `WiFi.localIP()` 函数打印 IP 地址。我们还通过调用 `WiFi.RSSI()`\
  \ 函数获取 RSSI。\n\n```\nvoid printWifiStatus() {\n    // print the SSID of the network\
  \ you're attached to:\n    Serial.print(\"SSID: \");\n    Serial.println(WiFi.SSID());\n\
  \n    // print your WiFi shield's IP address:\n    IPAddress ip = WiFi.localIP();\n\
  \    Serial.print(\"IP Address: \");\n    Serial.println(ip);\n\n    // print the\
  \ received signal strength:\n    long rssi = WiFi.RSSI();\n    Serial.print(\"signal\
  \ strength (RSSI):\");\n    Serial.print(rssi);\n    Serial.println(\" dBm\");\n\
  }\n```\n\n现在我们可以保存此程序。您可以编译并上传到 Arduino Nano 33 IoT。然后，打开串行监视器工具查看程序输出。图 4-7 显示了我的程序输出。\n\
  \n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_127_0.png)\n\n图 4-7. 从 NTP 服务器获取当前时间的程序输出\n\
  \n### 构建一个简单的物联网应用\n\n由于 Arduino Nano 33 IoT 内置了网络模块，我们可以构建一个简单的物联网应用。我们可以从网站控制\
  \ LED。我们可以打开/关闭 LED。对于演示实现，我们需要三个 LED。\n\n技术上，我们将在 Arduino Nano 33 IoT 内部构建一个简单的\
  \ Web 服务器。我们接收 HTTP GET 请求以从用户处执行 LED 开/关。我们定义以下 HTTP GET 请求。\n\n- http://<ip_address\
  \ Arduino>/gpio1/1 用于打开 LED1\n- http://<ip_address Arduino>/gpio1/0 用于关闭 LED1\n\
  - http://<ip_address Arduino>/gpio2/1 用于打开 LED2\n- http://<ip_address Arduino>/gpio2/0\
  \ 用于打开 LED2\n- http://<ip_address Arduino>/gpio3/1 用于打开 LED3\n- http://<ip_address\
  \ Arduino>/gpio3/0 用于打开 LED3\n\n接下来，我们为演示构建接线。\n\n#### 接线\n\n我们需要三个 LED 用于演示。我们可以构建以下接线：\n\
  \n- LED 1 连接到 Arduino Nano 33 IoT 的数字引脚 6\n- LED 2 连接到 Arduino Nano 33 IoT 的数字引脚\
  \ 4。\n- LED 3 连接到 Arduino Nano 33 IoT 的数字引脚 3。\n- 所有 LED GND 引脚都连接到 Arduino Nano\
  \ 33 IoT 上的地 GND 引脚。\n\n图 4-8 显示了我们物联网项目的接线。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_129_0.png)\n\
  \n图 4-8. 物联网项目的接线\n\n#### 开发程序\n\n我们的物联网项目实现是使用 Sketch 构建 Arduino 程序。我们将连接到现有 WiFi，然后执行一个简单的\
  \ Web 服务器。我们必须等待传入的 HTTP GET 请求以打开/关闭 LED。\n\n要实现，我们打开 Arduino 软件并创建一个新项目。首先，我们定义\
  \ LED 引脚和 WiFi SSID。设置您的 WiFi SSID 名称和 SSID 密钥（如果可用）。要实现一个简单的 Web 服务器，我们使用 WiFiServer\
  \ 库。您可以在此链接阅读它，https://www.arduino.cc/en/Reference/WiFiServer。\n\n```\n#include\
  \ <SPI.h>\n#include <WiFiNINA.h>\n\nint led1 = 6;\nint led2 = 4;\nint led3 = 3;\n\
  \nconst char* ssid = \"wifi-ssid\";\nconst char* password = \"ssid-key\";\n\nint\
  \ status = WL_IDLE_STATUS;\nWiFiServer server(80);\n```\n\n在 setup() 函数中，我们使用波特率\
  \ 115200 初始化 Serial 对象并为 LED 引脚设置数字模式。我们为数字模式设置 OUTPUT。\n\n```\nvoid setup() {\n\
  \  Serial.begin(115200);\n  delay(10);\n\n  // prepare GPIO5\n  pinMode(led1, OUTPUT);\n\
  \  pinMode(led2, OUTPUT);\n  pinMode(led3, OUTPUT);\n  digitalWrite(led1, 0);\n\
  \  digitalWrite(led2, 0);\n  digitalWrite(led3, 0);\n```\n\n接下来，我们通过调用 WiFi.begin()\
  \ 函数并传递 WiFi SSID 及其密钥来连接到现有 WiFi。\n\n```\nwhile (status != WL_CONNECTED) {\n  Serial.print(\"\
  Attempting to connect to SSID: \");\n  Serial.println(ssid);\n  status = WiFi.begin(ssid,\
  \ password);\n```\n\n```\n// wait 10 seconds for connection:\ndelay(10000);\n}\n\
  Serial.println(\"\");\nSerial.println(\"WiFi connected\");\n```\n\n如果我们的 Arduino\
  \ 已连接到 WiFi 网络，我们可以通过从 WiFiServer 对象调用 begin() 函数来启动 Web 服务器。\n\n```\nserver.begin();\n\
  Serial.println(\"Server started\");\n\n// Print the IP address\nchar ips[24];\n\
  IPAddress ip = WiFi.localIP();\nsprintf(ips, \"%d.%d.%d.%d\", ip[0], ip[1], ip[2],\
  \ ip[3]);\nSerial.println(ips);\n}\n```\n\n在 loop() 函数中，我们执行一些任务，例如等待传入的 HTTP 请求。然后，我们解析传入的数据包。如果数据包有效，我们可以打开/关闭\
  \ LED。首先，我们等待传入的客户端连接。我们可以调用 server.available()。\n\n```\nvoid loop() {\n    // Check\
  \ if a client has connected\n    WiFiClient client = server.available();\n    if\
  \ (!client) {\n        return;\n    }\n\n    // Wait until the client sends some\
  \ data\n    Serial.println(\"new client\");\n    while(!client.available()){\n \
  \       delay(1);\n    }\n```\n\n\n\n一旦我们建立了客户端连接，就需要等待传入的 HTTP 请求包。我们解析数据包以识别命令类型。可以使用字符串处理过程。当收到“/gpioX/Y”请求时，我们调用\
  \ `indexOf()`。X 是 LED 编号，Y 是打开/关闭 LED 的命令。\n\n```cpp\nString req = client.readStringUntil('\\\
  r');\nSerial.println(req);\nclient.flush();\n\n// Match the request\nint val1 =\
  \ 0;\nint val2 = 0;\nint val3 = 0;\nint ledreq = 0;\nif (req.indexOf(\"/gpio1/0\"\
  ) != -1) {\n    val1 = 0;\n    ledreq = 1;\n}\nelse if (req.indexOf(\"/gpio1/1\"\
  ) != -1) {\n    val1 = 1;\n    ledreq = 1;\n}\nelse if (req.indexOf(\"/gpio2/0\"\
  ) != -1) {\n    val2 = 0;\n    ledreq = 2;\n}\nelse if (req.indexOf(\"/gpio2/1\"\
  ) != -1) {\n    val2 = 1;\n    ledreq = 2;\n}\nelse if (req.indexOf(\"/gpio3/0\"\
  ) != -1) {\n    val3 = 0;\n    ledreq = 3;\n}\nelse if (req.indexOf(\"/gpio3/1\"\
  ) != -1) {\n    val3 = 1;\n    ledreq = 3;\n}\nelse {\n    Serial.println(\"invalid\
  \ request\");\n    client.stop();\n    return;\n}\n```\n\n识别命令类型后，我们可以使用 `digitalWrite()`\
  \ 打开/关闭 LED。\n\n```cpp\ndigitalWrite(led1, val1);\ndigitalWrite(led2, val2);\ndigitalWrite(led3,\
  \ val3);\n```\n\n接下来，我们向客户端发送响应。我们使用 `client.print()` 函数发送 HTML 脚本。之后，我们关闭客户端连接。\n\
  \n```cpp\nclient.flush();\nString s = \"HTTP/1.1 200 OK\\r\\nContent-Type: text/html\\\
  r\\n\\r\\n<!DOCTYPE HTML>\\r\\n<html>\\r\\n\";\nif(ledreq==1) {\n    s += \"LED1\
  \ is \";\n    s += (val1)? \"ON\": \"OFF\";\n}else if(ledreq==2) {\n    s += \"\
  LED2 is \";\n    s += (val2)? \"ON\": \"OFF\";\n}else if(ledreq==3) {\n    s +=\
  \ \"LED3 is \";\n    s += (val3)? \"ON\": \"OFF\";\n}\ns += \"</html>\\n\";\n\n\
  // Send the response to the client\nclient.print(s);\ndelay(1);\nclient.stop();\n\
  Serial.println(\"Client disconnected\");\n}\n```\n\n你可以将此程序保存为 IoTDemo。接下来，我们可以编译并测试该程序。\n\
  \n#### 测试\n\n我们将 IoTDemo 程序编译并上传到 Arduino Nano 33 IoT 后，可以打开串行监视器工具。我们应该会看到 Arduino\
  \ Nano 33 IoT 的 IP 地址。如果看不到，说明 Arduino Nano 33 IoT 在连接现有 WiFi 时可能遇到了问题。图 4-9 显示了\
  \ Arduino Nano 33 IoT 的 IP 地址。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_134_0.png)\n\
  \n图4-9. Arduino Nano 33 IoT 已连接到 WiFi\n\n测试时，我们可以使用浏览器。你可以发出一个打开 LED 的请求。我们可以访问\
  \ http://<ipaddress>/gpio1/1 来打开 LED 1。如果成功，我们会得到如图 4-10 所示的响应。LED 1 也会点亮。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_135_0.png)\n\
  \n图4-10. 通过 HTTP GET 请求打开 LED\n\n要关闭 LED 1，我们可以使用此链接发出请求：http://<ipaddress>/gpio1/0。我们会看到\
  \ LED 1 熄灭。同时也会收到来自 Arduino Nano 33 IoT 的响应，如图 4-11 所示。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_135_1.png)\n\
  \n图4-11. 通过 HTTP GET 请求关闭 LED\n\n我们的 IoTDemo 程序还会打印有关客户端连接和客户端请求的所有信息。你可以在图 4-12\
  \ 中看到我的程序输出。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_136_0.png)\n\n图4-12. 串行终端上\
  \ IoT 项目的程序输出\n\n本章到此结束。我们可以通过基于 Arduino Nano 33 IoT 板开发 IoT 程序来进行练习。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_136_0.png)\n\
  \n图4-12. 串行终端上 IoT 项目的程序输出\n\n## 总结\n\n我们已经学习了如何在 Arduino Nano 33 IoT 上设置 WiFiNINA\
  \ 库。我们将开发板连接到了现有的 WiFi 网络。然后，我们尝试连接到 Google 网站。我们从 NTP 服务器请求了当前时间。最后，我们构建了一个用于打开/关闭\
  \ LED 的 IoT 应用程序。\n\n在下一章中，我们将学习如何连接到 Arduino IoT Cloud。\n\n### 设置 Arduino IoT Cloud\n\
  \n为了访问 Arduino IoT Cloud 并为其构建程序，我们需要设置 Arduino 设备。我们应在该平台注册一个新账户。你可以通过此链接在 Arduino\
  \ IoT Cloud 上注册账户：https://create.arduino.cc/iot/。注册完成后，我们将 Arduino Nano 33 IoT 注册到\
  \ Arduino IoT Cloud。\n\n你可以在图 5-1 中看到 Arduino IoT Cloud 的仪表板。我们有三个菜单：Things、Dashboards\
  \ 和 Devices。没有付费订阅的成员只能在该平台创建 Things 菜单。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_138_0.png)\n\
  \n图5-1. Arduino IoT Cloud 网站的仪表板\n\n如果你在 Arduino 商店有账户，可以使用同一账户注册 Arduino IoT Cloud。然后，我们就可以注册我们的\
  \ Arduino Nano 33 IoT。\n\n#### 注册 Arduino Nano 33 IoT\n\n在使用 Arduino IoT Cloud 之前，我们必须注册\
  \ Arduino 设备。本章我们使用 Arduino Nano 33 IoT。注册 Arduino 设备需要一些步骤。你可以执行以下任务：\n\n- 安装 Arduino\
  \ Create Agent\n- 添加新的 Arduino 设备\n\n接下来，我们可以安装 Arduino Create Agent。\n\n#### 安装\
  \ Arduino Create Agent\n\nArduino Create Agent 是一个后台程序，用于监听本地 Arduino 设备。该代理程序充当本地\
  \ Arduino 设备与 Arduino IoT Cloud 之间的桥梁。\n\nArduino Create Agent 程序适用于 Windows、Linux\
  \ 和 macOS 平台。你可以通过此链接下载该程序：https://github.com/arduino/arduino-create-agent。安装后，应允许该程序在后台运行。在\
  \ Windows 平台上，你可以在任务栏上看到 Arduino Create Agent 的托盘图标，如图 5-2 所示。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_139_0.png)\n\
  \n图5-2. Windows 操作系统上 Arduino Create Agent 的托盘图标\n\n你可以通过在 Arduino Create Agent\
  \ 中单击 Debug Console 菜单来打开它。如果 Arduino 设备已连接到本地计算机，Arduino Create Agent 的调试控制台将显示设备状态。图\
  \ 5-3 显示我的 Arduino Nano 33 IoT 已被检测到。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_140_0.png)\n\
  \n图5-3. Arduino Create Agent 调试控制台的界面\n\n如果你没有看到 Arduino 设备，请确保 Arduino 已正确连接到计算机。完成后，你可以注册\
  \ Arduino Nano 33 IoT。\n\n#### 添加新的 Arduino 设备\n\n一旦我们在本地计算机上设置了 Arduino Create\
  \ Agent 程序，就可以添加新的 Arduino 设备。打开 Arduino IoT Cloud 网站，然后点击 DEVICES 菜单。你会看到 Arduino\
  \ 设备列表。\n\n现在你可以添加新的 Arduino Nano 33 IoT。插入 Arduino Nano 33 IoT 后，你应该会看到如图 5-4 所示的对话框。点击\
  \ Arduino 设备菜单中的 Set up。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_141_0.png)\n\
  \n图5-4. 添加新的 Arduino 设备\n\n点击此选项后，你应该会看到 Arduino Nano 33 IoT，如图 5-5 所示。如果没有看到 Arduino\
  \ Nano 33 IoT，请确保 Arduino Nano 33 IoT 已连接并且 Arduino Create Agent 正在运行。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_142_0.png)\n\
  \n图5-5. Arduino IoT Cloud 检测到 Arduino Nano 33 IoT\n\n为 Arduino Nano 33 IoT 设置设备名称。完成后，可以点击\
  \ CONFIGURE 按钮。Arduino IoT Cloud 将配置你的 Arduino Nano 33 IoT，如图 5-6 所示。完成此任务需要几分钟时间。配置完成后，你应该会在\
  \ Arduino IoT Cloud 列表中看到 Arduino Nano 33 IoT，如图 5-7 所示。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_143_0.png)\n\
  \n图5-6. 正在配置 Arduino Nano 33 IoT\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_143_1.png)\n\
  \n图5-7. Arduino Nano 33 IoT 设备已添加\n\n### 开发远程 LED 按钮\n\n在本节中，我们将构建一个程序，通过 Arduino\
  \ IoT Cloud 仪表板远程控制 LED。我们可以从 Arduino IoT Cloud 仪表板网站打开/关闭 Arduino Nano 33 IoT 上的\
  \ LED。\n\n为了实现演示，我们可以按以下步骤执行一些任务：\n\n- 添加新的 Thing\n- 添加属性\n- 编辑 Sketch 程序\n- 构建仪表板\n\
  - 测试\n\n我们将在下一节中执行这些步骤。\n\n#### 添加新的 Thing\n\nArduino IoT Cloud 的一个功能是与 Arduino\
  \ 设备交互的程序。使用免费会员资格，我们只能创建一个 Thing。在本演示中，我们通过 Arduino IoT Cloud 仪表板构建 LED 的遥控器。\n\
  \n打开 Arduino IoT Cloud 网站，点击 Things 菜单。然后，你会得到一个表单，如图 5-8 所示。输入 Thing 名称和 Arduino\
  \ 设备。每个 Thing 都通过一个 Arduino 设备连接。\n\n设置 Thing 名称后，你可以点击 CREATE 按钮。之后，你会看到一个表单，如图\
  \ 5-9 所示。我们将在下一节配置 Arduino Nano 33 IoT 的属性。\n\n\n\n\n\n#### 图 5-8. 添加一个新的 Thing\n\
  \n#### 图 5-9. Arduino Thing 的仪表盘\n\n#### 添加属性\n\n我们可以通过 Thing 属性来暴露 Arduino Nano\
  \ 33 IoT 的 I/O。例如，我们想将传感器数据暴露给 Arduino IoT Cloud。在此场景中，我们想暴露 Arduino Nano 33 IoT\
  \ 上的内置 LED。我们可以对 LED 设置 I/O，以便通过网络打开/关闭 LED。\n\n你可以先在 Arduino IoT Cloud 上打开一个 Thing。图\

- "# CHAPTER 6\n\n## Bluetooth Low Energy (BLE)\n\nArduino Nano 33 IoT 具有两个内置网络模块：WiFi\
  \ 和 Bluetooth。本章我们探讨如何在 Arduino Nano 33 IoT 上开始使用 Bluetooth Low Energy (BLE)。我们将构建程序来利用\
  \ BLE 模块。\n\n本章你将学习以下主题：\n\n- Setting up BLE library on Arduino Nano 33 IoT\n- Building\
  \ a simple BLE application\n- Developing an LED control program over BLE\n- Exposing\
  \ sensor data over BLE service\n\n### Introduction\n\nArduino Nano 33 IoT 是 Arduino\
  \ 的物联网平台之一。该板使用 WiFi 和 Bluetooth 模块连接到网络。Arduino Nano 33 IoT 支持 BLE 无线电。BLE 技术使我们能够广告我们的服务并在\
  \ BLE 设备之间进行交互，例如移动设备。\n\n# CHAPTER 6　BLUETOOTH LOW ENERGY (BLE)\n\n```cpp\n// begin\
  \ initialization\nif (!BLE.begin()) {\n    Serial.println(\"starting BLE failed!\"\
  );\n    while (1);\n}\n```\n\n现在我们通过调用 BLE.setLocalName() 设置我们的 BLE 无线电名称。该名称将在\
  \ BLE 读卡器上被检测到。我们还通过调用 BLE.setAdvertisedServiceUuid() 函数设置 BLE UUID。BLE UUID 表示计算出的\
  \ 128 位值。你可以使用此在线工具生成 UUID，https://www.guidgenerator.com/online-guid-generator.aspx。\n\
  \n```cpp\nBLE.setLocalName(\"HelloBLE\");\nBLE.setAdvertisedServiceUuid(\"19B10000-E8F2-537E-4F6C-D104768A1214\"\
  );\n\n// start advertising\nBLE.advertise();\nSerial.println(\"Bluetooth device\
  \ active, waiting for connections...\");\n}\n```\n\n确保你的 BLE UUID 符合标准 BLE SIG。一些\
  \ BLE UUID 由其服务保留。你可以在此链接检查这些服务，https://www.bluetooth.com/specifications/assigned-numbers/service-discovery/。\n\
  \n接下来，我们在 loop() 函数中等待传入的 BLE 读卡器。我们可以调用 BLE.central() 来等待 BLE 读卡器。\n\n```cpp\n\
  void loop() {\n    // wait for a BLE central\n    BLEDevice central = BLE.central();\n\
  ```\n\n在 BLE 读卡器连接到 Arduino Nano 33 IoT 上的 BLE 无线电后，我们可以获得 BLEDevice 对象。然后，我们通过调用\
  \ digitalWrite() 并传递 HIGH 值来打开 LED。然后，我们通过检查连接状态进行无限循环。\n\n```cpp\nif (central)\
  \ {\n  Serial.print(\"Connected to central: \");\n  Serial.println(central.address());\n\
  \  digitalWrite(LED_BUILTIN, HIGH);\n\n  while (central.connected()) {\n    // do\
  \ nothing\n  }\n```\n\n如果 BLE 读卡器断开连接，我们将从 central.connected() 获得 false 值。之后，我们通过调用\
  \ digitalWrite() 并传递 LOW 值来关闭 LED。\n\n```cpp\ndigitalWrite(LED_BUILTIN, LOW);\n\
  Serial.print(\"Disconnected from central: \");\nSerial.println(central.address());\n\
  }\n}\n```\n\n我们的程序已完成。你可以将此程序保存为 HelloBLE。\n\n### Testing Program\n\n现在我们的 Arduino\
  \ 程序 HelloBLE 可以编译并上传到 Arduino Nano 33 IoT。为了测试此程序，我们需要一台具有 Android 或 iOS 平台的手机。在此演示中，我使用了一部\
  \ Android 手机。\n\n首先，打开 Serial Monitor 以查看来自 HelloBLE 程序的程序输出。接下来，在 Google Play 商店或\
  \ Apple 商店安装 nRF Connect for Mobile 应用程序。你可以在图 6-2 中看到来自 Google Play 商店的 nRF Connect\
  \ for Mobile 应用程序。\n\n下载并安装适用于移动平台的 nRF Connect for Mobile 应用程序。安装后，你可以运行此程序。你可以看到我的\
  \ Android 上的 nRF Connect for Mobile 应用程序，如图 6-3 所示。接下来，我们可以连接到 Arduino Nano 33 IoT。\n\
  \n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_167_0.png)\n\nFigure 6-2. nRF Connect\
  \ for Mobile application on the Google Play store\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_168_0.png)\n\
  \n#### Figure 6-3. A form of nRF Connect for Mobile application\n\n我们可以点击 SCAN 以获取\

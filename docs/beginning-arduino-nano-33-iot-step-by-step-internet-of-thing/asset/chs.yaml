  \ Arduino GND\n- TMP36 模块 SIG 连接到 Arduino 模拟 A0\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_56_0.png)\n\
  \n**图 2-11。** *模拟传感器与 Arduino Nano 33 IoT 的接线*\n\n# CHAPTER 2 ARDUINO NANO 33 IOT\

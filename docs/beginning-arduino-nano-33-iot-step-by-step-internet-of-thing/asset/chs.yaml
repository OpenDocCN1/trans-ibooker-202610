  \nFigure 6-6. Program output on the serial console from HelloBLE\n\n### Demo 2:\
  \ Controlling LED with BLE\n\n在此演示中，我们通过 BLE 无线电构建一个 LED 控制器。我们利用 BLE 服务来公开 LED\
  \ 服务。我们可以使用移动应用程序打开/关闭 LED。\n\n对于实现，我们使用来自 Arduino 的程序示例 LED。接下来，我们开发 Sketch 程序。\n\
  \n### Writing the Program\n\n我们将开发 Arduino 程序通过 BLE 无线电控制 LED。现在你开始打开 Arduino 软件。创建一个新程序。接下来，我们逐步编写代码。\n\
  \n首先，我们将 ArduinoBLE 库导入到我们的程序中。我们还使用 BLERead 和 BLEWrite 特性初始化 BLE 服务。我们为 LED_BUILTIN\
  \ 定义 ledPin。我们编写以下代码。\n\n```cpp\n#include <ArduinoBLE.h>\n\nBLEService ledService(\"\
  19B10000-E8F2-537E-4F6C-D104768A1214\");\nBLEByteCharacteristic switchCharacteristic(\"\
  19B10001-E8F2-537E-4F6C-D104768A1214\", BLERead | BLEWrite);\n\nconst int ledPin\
  \ = LED_BUILTIN;\n```\n\n然后，我们在 setup() 函数中初始化串行通信和数字 OUTPUT 模式。我们还使用 BLE.begin()\
  \ 函数在 Arduino Nano 33 IoT 上初始化 BLE 无线电。\n\n```cpp\nvoid setup() {\n  Serial.begin(9600);\n\
  \  while (!Serial);\n\n  // set LED pin to output mode\n  pinMode(ledPin, OUTPUT);\n\
  }\n```\n\n```cpp\n// begin initialization\nif (!BLE.begin()) {\n    Serial.println(\"\
  starting BLE failed!\");\n    while (1);\n}\n```\n\n接下来，我们使用 addCharacteristic()\
  \ 函数设置 BLE 服务和特性。我们还通过调用 writeValue() 函数初始化特性值。\n\n```cpp\n// set advertised local\
  \ name and service UUID:\nBLE.setLocalName(\"LED\");\nBLE.setAdvertisedService(ledService);\n\
  \n// add the characteristic to the service\nledService.addCharacteristic(switchCharacteristic);\n\
  \n// add service\nBLE.addService(ledService);\n\n// set the initial value for the\
  \ characeristic:\nswitchCharacteristic.writeValue(0);\n```\n\n在我们定义 BLE 服务后，我们可以使用\
  \ BLE.advertise() 函数开始广告。我们打印一条信息，说明我们的 BLE 已准备好等待传入的 BLE 读卡器。\n\n```cpp\n// start\
  \ advertising\nBLE.advertise();\n\nSerial.println(\"BLE LED Peripheral\");\n}\n\
  ```\n\n在 loop() 函数中，我们等待 BLE 读卡器。我们使用 BLE.central()。如果 BLE 读卡器连接到 Arduino Nano 33\
  \ IoT，我们将获得一个 BLEDevice 对象。\n\n最后，如果 BLE 读卡器断开连接，我们将向串行终端打印消息。\n\n```cpp\nSerial.print(f(\"\
  Disconnected from central: \"));\nSerial.println(central.address());\n}\n}\n```\n\
  \n我们的程序已完成。你可以将此程序保存为 LED。\n\n### Testing the Program\n\n现在我们的 Arduino 程序 LED 可以编译并上传到\
  \ Arduino Nano 33 IoT。为了测试此程序，我们需要一台具有 Android 或 iOS 平台的手机。在此演示中，我使用了一部 Android\
  \ 手机。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_174_0.png)\n\n*Figure 6-7. LED\
  \ service shows in nRF Connect for Mobile application*\n\n\n\n\n\n# 第 6 章　蓝牙低功耗\

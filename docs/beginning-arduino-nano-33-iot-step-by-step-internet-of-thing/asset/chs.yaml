  ```\n\n```\nSerial.print(\"Photo-voltaic cell=\");\nSerial.println(ADC2);\n```\n\
  \n我们还从 PCF8591 AD/DA 转换器模块读取电位器。打开 I2C 接口并选择 PCF8591_ADC_CH3 的通道。然后，我们可以读取传感器数据并在串行终端上打印它。\n"
- "# 第3章\n\n## IMU 传感器：\n加速度计和\n陀螺仪\n\nArduino Nano 33 IoT 板具有一个内部传感器，即惯性测量单元（IMU）。该\
  \ IMU 传感器由 LSM6DS3 构建。在本章中，我们将探讨如何访问 Arduino Nano 33 IoT 上的 IMU 传感器。\n\n您将在本章中学习以下主题：\n\
  \n- 设置 LSM6DS3 传感器\n- 访问加速度计传感器\n- 访问陀螺仪传感器\n- 绘制传感器数据\n\n### 简介\n\nArduino Nano\
  \ 33 IoT 具有一个可直接访问的内部传感器。该传感器是基于 LSM6DS3 的 IMU。该模块由加速度计和陀螺仪传感器组成。该传感器通过内部集成电路（I2C）接口连接到\
  \ Arduino Nano 33 IoT。有关更多信息\n\n\n\ninformation about technical documentation of\
  \ LSM6DS3, we can read the detailed datasheet document at this link, https://content.arduino.cc/assets/st_imu_lsm6ds3_datasheet.pdf.\
  \ You can see the LSM6DS3 chip on Arduino Nano 33 IoT board in Figure 3-1.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_87_0.png)\n\
  \nFigure 3-1. LSM6DS3 chip on Arduino Nano 33 IoT\n\nIn Chapter 2, we learned about\
  \ the I2C interface. We also perform a scan of the I2C address. You can run the\
  \ i2c_scanner program from Chapter 2. Figure 3-2 shows a list of I2C addresses of\
  \ I2C devices. The IMU sensor runs on 0x6A and 0x6B I2C addresses.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_88_0.png)\n\
  \nFigure 3-2. A list I2C addresses from sensor device-based I2C interface\n\nIn\
  \ this chapter, we will explore the IMU sensor, LSM6DS3, on Arduino Nano 33 IoT.\
  \ We access accelerator and gyroscope sensors from the Arduino program.\n\n### Set\
  \ Up LSM6DS3 Library\n\nTo access the IMU sensor-based LSM6DS3 chip on Arduino Nano\
  \ 33 IoT, we need to install the Arduino LSM6DS3 library. This library can be used\
  \ to access the IMU sensor for accelerator and gyroscope sensors. We will use this\
  \ library in this chapter. Details about the LSM6DS3 library can be read at this\
  \ link, https://www.arduino.cc/en/Reference/ArduinoLSM6DS3.\n\nTo install the Arduino\
  \ LSM6DS3 library, you can open Arduino software. Then, click the menu Sketch ▶\
  \ Include Library ▶ Manage Libraries, as shown in Figure 3-3.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_89_0.png)\n\
  \nFigure 3-3. Opening the Manage Libraries menu in Arduino software\n\nAfter we\
  \ click the Manage Libraries menu, we will obtain a Library Manager dialog, as shown\
  \ in Figure 3-4. You can type arduino_lsm6ds3 in the search textbox. Then, you should\
  \ see a list of libraries. You should also see the Arduino_LSM6DS3 library. In Figure\
  \ 3-4 you can see the Arduino_LSM6DS3 library that is noted by a red arrow.\n\n\
  ![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_89_1.png)\n\nFigure 3-4. Installing the\
  \ Arduino LSM6DS3 library\n\nClick the Install button after you click the Arduino_LSM6DS3\
  \ library. Make sure your computer is connected to the Internet. After completing\
  \ installation, we can access the IMU sensor on Arduino Nano 33 IoT.\n\n### Working\
  \ with an Accelerometer\n\nThe IMU sensor in Arduino Nano 33 IoT has an accelerometer\
  \ sensor. This sensor measures acceleration on x, y, and z coordinates. The sensor\
  \ value ranges from -4 to 4. We will use the Arduino LSM6DS3 library to access the\
  \ IMU accelerometer sensor.\n\nIn general, we can start to use the LSM6DS3 library\
  \ by calling `IMU.begin()`. Then, we can read the sensor value by calling the `IMU.readAcceleration()`\
  \ function.\n\nFor the demo, we read the IMU accelerometer on the Arduino Nano 33\
  \ IoT board. Then, we print the measurement result on the serial terminal. You can\
  \ open Arduino software and write this complete program.\n\n```\n#include <Arduino_LSM6DS3.h>\n\
  \nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial);\n\n  if (!IMU.begin())\
  \ {\n    Serial.println(\"Failed to initialize IMU!\");\n\n    while (1);\n  }\n\
  \n  Serial.print(\"Accelerometer sample rate = \");\n  Serial.print(IMU.accelerationSampleRate());\n\
  \  Serial.println(\" Hz\");\n  Serial.println();\n}\n```\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_92_0.png)\n\
  \nFigure 3-5. Program output from reading the IMU accelerometer\n\nHow does it work?\n\
  \nFirst, we include the Arduino LSM6DS3 library in the Arduino program.\n\n```\n\
  #include <Arduino_LSM6DS3.h>\n```\n\nWe initialize the IMU sensor and the Serial\
  \ object on the setup() function.\n\n```\nvoid setup() {\n  Serial.begin(115200);\n\
  \  while (!Serial);\n\n  if (!IMU.begin()) {\n    Serial.println(\"Failed to initialize\
  \ IMU!\");\n\n    while (1);\n  }\n}\n```\n\nWe also can print the current accelerometer\
  \ sample rate by calling the IMU.accelerationSampleRate() function on the serial\
  \ terminal.\n\n```\nSerial.print(\"Accelerometer sample rate = \");\nSerial.print(IMU.accelerationSampleRate());\n\
  Serial.println(\" Hz\");\nSerial.println();\nSerial.println(\"Acceleration in G's\"\
  );\nSerial.println(\"X\\tY\\tZ\");\n```\n\nOn the loop() function, we read the accelerometer\
  \ sensor. We should check whether there is available accelerometer sensor data by\
  \ calling the IMU.accelerationAvailable() function. If it’s available for sensor\
  \ data, we can read the sensor data using the IMU.readAcceleration() function.\n\
  \n```\nvoid loop() {\n    float x, y, z;\n\n    if (IMU.accelerationAvailable())\
  \ {\n        IMU.readAcceleration(x, y, z);\n```\n\nThen, we print the sensor data\
  \ on the serial terminal.\n\n```\nSerial.print(x);\nSerial.print('\\t');\nSerial.print(y);\n\
  Serial.print('\\t');\nSerial.println(z);\n```\n\n### Working with Gyroscope\n\n\
  Gyroscope is a sensor to measure orientation and angular velocity. Arduino Nano\
  \ 33 IoT has a built-in gyroscope sensor over the IMU LSM6DS3 sensor chip. We can\
  \ access this sensor using the Arduino LSM6DS3 library.\n\nSave this program as\
  \ SimpleGyroscope. Now you can compile and upload this program into Arduino Nano\
  \ 33 IoT. We can see the program output using the Serial Monitor. Change your board\
  \ orientation to see the change values on the Serial Monitor tool.\n\nFigure 3-6\
  \ shows my program output for the SimpleGyroscope program. You can see gyroscope\
  \ values for x, y, and z.\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_95_0.png)\n\
  \nFigure 3-6. Program output from reading the gyroscope sensor\n\nHow does it work?\n\
  \nFirst, we include the Arduino LSM6DS3 library in the Arduino program.\n\n```\n\
  #include <Arduino_LSM6DS3.h>\n```\n\nWe initialize the IMU sensor to enable work\
  \ with the gyroscope sensor and the Serial object on the setup() function.\n\n```\n\
  void setup() {\n  Serial.begin(115200);\n  while (!Serial);\n}\n```\n\n```\nif (!IMU.begin())\
  \ {\n    Serial.println(\"Failed to initialize IMU!\");\n    while (1);\n}\n```\n\
  \nWe also can print the current gyroscope sample rate by calling the IMU.gyroscopeSampleRate()\
  \ function on the serial terminal.\n\n```\nSerial.print(\"Gyroscope sample rate\
  \ = \");\nSerial.print(IMU.gyroscopeSampleRate());\nSerial.println(\" Hz\");\nSerial.println();\n\

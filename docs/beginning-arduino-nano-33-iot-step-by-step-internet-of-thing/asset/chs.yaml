  );\ndelay(1000);\n```\n\n你可以通过组合红、绿、蓝的值来练习生成新的颜色。我们只能设置 0 到 255 的值。\n\n### 串行外设接口\n\
  \n串行通信以异步模式工作，因此对串行通信没有控制。这意味着我们无法保证发送的数据会被接收方接收。串行外设接口（SPI）是一种同步串行通信接口规范，但 SPI\
  \ 有四根线来控制数据，例如主出/从入（MOSI）、主入/从出（MISO）、串行时钟信号（SCLK）和从设备选择（SS）。\n\nArduino Nano 33\
  \ IoT 具有一个 SPI 接口，其 SPI 引脚如下：\n\n- MOSI 在数字引脚 11 上\n- MISO 在数字引脚 12 上\n- SCLK 在数字引脚\
  \ 13 上\n\n你可以在 Arduino Nano 33 IoT 上连接任何基于 SPI 接口的传感器或执行器。对于我们的演示，我们仅使用跳线将 MISO\
  \ 引脚连接到 MOSI 引脚。你可以将数字引脚 12 连接到数字引脚 11。图 2-19 显示了我 SPI 演示的接线。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_70_0.png)\n\
  \n**图 2-19.** 连接 Arduino SPI 的 MISO 和 MISO 引脚\n\n要在 Arduino Nano 33 IoT 上访问 SPI\
  \ 接口，我们可以使用 SPI 库。你可以在此链接 https://www.arduino.cc/en/Reference/SPI 获取有关此库的详细信息。\n\
  \n现在我们可以构建 Arduino 程序。我们的程序将向 SPI 发送数据并从 SPI 接收数据。打开 Arduino 软件然后编写此完整程序。\n\n```cpp\n\
  #include <SPI.h>\n\nbyte sendData,recvData;\nvoid setup() {\n  SPI.begin();\n```\n\
  \n它是如何工作的？\n\n我们在 setup() 函数上初始化 SPI 和串行接口。\n\n```cpp\n#include <SPI.h>\n\nbyte\
  \ sendData,recvData;\nvoid setup() {\n  SPI.begin();\n  Serial.begin(9600);\n  randomSeed(80);\n\
  }\n```\n\n要通过 SPI 发送和接收数据，我们可以使用 SPI.transfer() 函数。我们在 loop() 函数上使用随机值发送数据。\n\n\
  ```cpp\nvoid loop() {\n  sendData = random(50, 100);\n  recvData = SPI.transfer(sendData);\n\
  ```\n\n然后，我们在串行终端上打印发送数据和接收数据。\n\n```\nSerial.print(\"Send=\");\nSerial.println(sendData,DEC);\n\
  Serial.print(\"Recv=\");\nSerial.println(recvData,DEC);\n```\n\n你已完成 SPI 演示。你可以通过应用传感器或执行器设备来练习更多\
  \ SPI。\n\n### 内部集成电路（I2C）\n\n内部集成电路（I2C）协议是一种旨在允许多个“从”模块/设备（芯片）与一个或多个“主”芯片通信的协议。此协议以异步模式工作。\n\
  为了与其他设备/模块通信，I2C 协议为所有“从”设备定义 I2C 地址。\n\nI2C 接口有两个引脚：串行数据（SDA）和串行时钟（SCL）。对于数据传输，I2C\
  \ 接口使用 SDA 引脚。SCL 引脚用于时钟。Arduino Nano 33 IoT 板的 I2C 引脚为 A4 作为 SDA 和 A5 作为 SCL。\n\
  \n对于我们的演示，我们使用基于 I2C 接口的传感器模块。I2C 接口使用设备地址，因此 Arduino Nano 33 IoT 板可以通过打开到 I2C 地址的连接来访问数据。来自基于传感器模块的\
  \ I2C 的每个模拟传感器都将连接到 I2C 地址。\n\n为了测试，我使用了一个带传感器和执行器设备的 PCF8591 AD/DA 转换器模块。此传感器模块可在图\
  \ 2-21 中看到。PCF8591 AD/DA 模块使用 PCF8591 芯片，该芯片由四个模拟输入和 AD 转换器组成。PCF8591 芯片还具有带 DA\
  \ 转换器的模拟输出。有关 PCF8591 芯片的更多信息，你可以阅读此链接 https://www.nxp.com/products/interfaces/ic-spi-serial-interface-devices/ic-dacs-and-adcs/8-bit-a-d-and-d-a-converter:PCF8591。\n\
  \n你可以在像 Aliexpress 这样的在线商店找到该芯片。你可能可以在当地商店获得此模块。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_73_0.png)\n\
  \n图 2-21. PCF8591 ADC DAC AD/DA 模块\n\n根据 PCF8591 AD/DA 转换器模块的数据表文档，此模块使用 I2C 地址\
  \ 0x48。PCF8591 AD/DA 转换器模块还由以下三个传感器组成：\n\n- 热敏电阻：使用通道 0\n- 光敏电阻：使用通道 1\n- 电位器：使用通道\
  \ 3\n\n现在将 PCF8591 AD/DA 转换器模块连接到 Arduino Nano 33 IoT 板，接线如下：\n\n- PCF8591 AD/DA\
  \ 模块 SDA 连接到 Arduino A4 引脚。\n- PCF8591 AD/DA 模块 SCL 连接到 Arduino A5 引脚。\n- PCF8591\
  \ AD/DA 模块 VCC 连接到 Arduino 3.3V。\n- PCF8591 AD/DA 模块 GND 连接到 Arduino GND 引脚。\n\n\
  图 2-22 显示了我 PCF8591 AD/DA 转换器模块和 Arduino Nano 33 IoT 的接线。当我们将 3.3V 插入模块时，你应该看到一个点亮的\
  \ LED。\n\n\n\n\n\n# 第2章 Arduino Nano 33 IoT 板开发\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_75_0.png)\n\
  \n**图 2-22.** *将 PCF8591 ADC DAC AD/DA 模块与 Arduino Nano 33 IoT 进行接线*\n\n我们已完成此演示的接线。接下来，我们将实现以下两个项目演示：\n\
  \n- I2C 扫描应用程序\n- I2C 传感器应用程序\n\n接下来，我们在 Arduino Nano 33 IoT 板上构建一个扫描 I2C 地址的应用程序。\n\
  \n### 扫描 I2C 地址\n\n每个基于设备/模块的 I2C 都在 MCU 上拥有一个 I2C 地址。在本节中，我们希望扫描连接到 Arduino Nano\
  \ 33 IoT 的所有设备。我们在 Arduino Nano 33 IoT 内部还拥有两个基于设备的内部 I2C 传感器。\n\n要访问 Arduino 板上的\
  \ I2C，我们可以使用 Wire 库。我们可以通过插入 wire.h 库来包含我们的程序。有关 Wire 库的更多信息，我们可以阅读 Arduino 官方网站上的内容\
  \ (https://www.arduino.cc/en/Reference/Wire)。\n\n对于我们的演示，我们使用来自 PCF8591 AD/DA 转换器模块的接线演示（见图\
  \ 2-22）。打开 Arduino 软件并编写此完整程序。\n\n```\n#include <Wire.h>\n\nvoid setup() {\n   \
  \ Serial.begin(115200);\n    Wire.begin();\n    Serial.println(\"\\nI2C Scanner\"\
  );\n}\n\nvoid loop() {\n    byte error, address;\n    int nDevices;\n\n    Serial.println(\"\
  Scanning...\");\n\n    nDevices = 0;\n    for(address = 1; address < 127; address++)\
  \ {\n        Wire.beginTransmission(address);\n        error = Wire.endTransmission();\n\
  \n        if (error == 0) {\n            Serial.print(\"I2C device found at address\
  \ 0x\");\n            if (address < 16)\n                Serial.print(\"0\");\n\
  \            Serial.println(address, HEX);\n\n            nDevices++;\n        }\n\
  ```\n\n```\nelse if (error == 4) {\n    Serial.print(\"Unknown error at address\
  \ 0x\");\n    if (address < 16)\n        Serial.print(\"0\");\n    Serial.println(address,\
  \ HEX);\n}\n}\nif (nDevices == 0)\n    Serial.println(\"No I2C devices found\");\n\
  else\n    Serial.println(\"done\");\n\ndelay(5000);\n}\n```\n\n将此程序保存为 i2c_scanner。现在您可以将此程序编译并上传到\
  \ Arduino Nano 33 IoT。我们可以使用串行监视器查看程序输出。\n\n图 2-23 显示了我对 i2c_scanner 的程序输出。您可以看到有三个\
  \ I2C 地址。0x48 是我们的 PCF8591 AD/DA 转换器模块。两个 I2C 地址 0x60 和 0x6A 是 Arduino Nano 33 IoT\
  \ 内部的 I2C 传感器。\n\n然后我们使用 `Wire.beginTransmission()` 打开 I2C 接口。\n接下来，我们通过调用 `Wire.endTransmission()`\
  \ 关闭传输。\n\n```\nnDevices = 0;\nfor(address = 1; address < 127; address++) {\n  \
  \  Wire.beginTransmission(address);\n    error = Wire.endTransmission();\n```\n\n\
  我们检查错误值 error。如果没有错误，则意味着当前地址上有一个 I2C 设备。我们使用 `Serial.println()` 以 HEX 模式将 I2C 地址打印到串行终端。\n\
  \n```\nif (error == 0) {\n    Serial.print(\"I2C device found at address 0x\");\n\
  \    if (address < 16)\n        Serial.print(\"0\");\n    Serial.println(address,\
  \ HEX);\n\n    nDevices++;\n}\n```\n\n否则，我们检查错误代码。如果 error = 4，我们在此地址上打印未知错误。\n\n\
  ```\nelse if (error == 4) {\n    Serial.print(\"Unknown error at address 0x\");\n\
  \    if (address < 16)\n        Serial.print(\"0\");\n    Serial.println(address,\
  \ HEX);\n}\n```\n\n最后，我们从串行终端打印 I2C 接口的发现结果。\n\n```\n```cpp\nif (nDevices == 0)\n\
  \    Serial.println(\"No I2C devices found\");\nelse\n    Serial.println(\"done\"\
  );\n```\n```\n\n此程序可用于检查连接到 Arduino Nano 33 IoT 的 I2C 设备列表。\n\n### 读取基于传感器的 I2C\
  \ 地址\n\n在本节中，我们从 I2C 设备读取传感器数据。我们已在图 [2-22](#) 中配置了硬件接线。PCF8591 AD/DA 转换器模块具有三个传感器：热敏电阻、光伏电池和电位器。每个传感器在\
  \ 0x00、0x01 和 0x03 上都有一个通道地址，分别对应。\n\n让我们开始构建 Arduino 程序以通过 I2C 接口访问传感器设备。我们将使用图\
  \ [2-22](#) 中的硬件接线。您可以打开 Arduino 软件并编写此完整程序。\n\n```\n```cpp\n#include \"Wire.h\"\
  \n#define PCF8591 0x48 // I2C bus address\n#define PCF8591_ADC_CH0 0x00 // thermistor\n\
  #define PCF8591_ADC_CH1 0x01 // photo-voltaic cell\n#define PCF8591_ADC_CH2 0x02\n\
  #define PCF8591_ADC_CH3 0x03 // potentiometer\nbyte ADC1, ADC2, ADC3;\n\nvoid setup()\n\
  {\n    Wire.begin();\n    Serial.begin(9600);\n```\n```\n\n```\n```cpp\n}\nvoid\
  \ loop()\n{\n    // read thermistor\n    Wire.beginTransmission(PCF8591);\n    Wire.write((byte)PCF8591_ADC_CH0);\n\
  \    Wire.endTransmission();\n    delay(100);\n    Wire.requestFrom(PCF8591, 2);\n\
  \    delay(100);\n    ADC1=Wire.read();\n    ADC1=Wire.read();\n\n    Serial.print(\"\
  Thermistor=\");\n    Serial.println(ADC1);\n\n    // read photo-voltaic cell\n \
  \   Wire.beginTransmission(PCF8591);\n    Wire.write(PCF8591_ADC_CH1);\n    Wire.endTransmission();\n\
  \    delay(100);\n    Wire.requestFrom(PCF8591, 2);\n    delay(100);\n    ADC2=Wire.read();\n\
  \    ADC2=Wire.read();\n\n    Serial.print(\"Photo-voltaic cell=\");\n    Serial.println(ADC2);\n\
  \n    // potentiometer\n    Wire.beginTransmission(PCF8591);\n    Wire.write(PCF8591_ADC_CH3);\n\
  \    Wire.endTransmission();\n```\n\n```\ndelay(100);\nWire.requestFrom(PCF8591,\
  \ 2);\ndelay(100);\nADC3=Wire.read();\nADC3=Wire.read();\n\nSerial.print(\"potentiometer=\"\
  );\nSerial.println(ADC3);\n\ndelay(500);\n}\n```\n\n将此程序保存为 I2CSensor。现在您可以将此程序编译并上传到\
  \ Arduino Nano 33 IoT。在 Arduino 软件上打开串行监视器工具。您应该会看到来自 I2C 协议的传感器数据。图 2-24 显示了我对\
  \ I2CSensor 的程序输出。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_82_0.png)\n\n图 2-24.\
  \ 通过 I2C 读取传感器的程序输出\n\n### 它是如何工作的？\n\n首先，我们初始化 I2C、串行和 PCF8591 AD/DA 转换器模块。我们定义\
  \ I2C 地址通道。这是在 setup() 函数中完成的。\n\n```\n```cpp\n#include \"Wire.h\"\n#define PCF8591\
  \ 0x48 // I2C bus address\n#define PCF8591_ADC_CH0 0x00 // thermistor\n#define PCF8591_ADC_CH1\
  \ 0x01 // photo-voltaic cell\n#define PCF8591_ADC_CH2 0x02\n#define PCF8591_ADC_CH3\
  \ 0x03 // potentiometer\nbyte ADC1, ADC2, ADC3;\n\nvoid setup()\n{\n  Wire.begin();\n\
  \  Serial.begin(9600);\n}\n```\n```\n\n我们可以在 loop() 函数中读取传感器数据。要读取热敏电阻数据，我们使用传递\
  \ PCF8591 的 Wire.beginTransmission() 打开 I2C。然后，使用 Wire.write() 选择热敏电阻的通道，值为 PCF8591_ADC_CH0。我们通过调用\
  \ Wire.endTransmission() 关闭传输。我们使用 Wire.requestFrom() 函数读取 2 字节的传感器数据。\n\n```\n\
  ```cpp\nvoid loop()\n{\n  // read thermistor\n  Wire.beginTransmission(PCF8591);\n\
  \  Wire.write((byte)PCF8591_ADC_CH0);\n  Wire.endTransmission();\n  delay(100);\n\
  ```\n```\n\n```\nWire.requestFrom(PCF8591, 2);\ndelay(100);\nADC1=Wire.read();\n\
  ADC1=Wire.read();\n```\n\n我们设置 delay(100) 以等待模块完成我们的请求。我们使用 Wire.read() 函数按字节读取数据。接下来，我们在串行终端上打印热敏电阻数据。\n\
  \n```\nSerial.print(\"Thermistor=\");\nSerial.println(ADC1);\n```\n\n使用相同的方法，我们可以通过更改通道值为\
  \ PCF8591_ADC_CH1 来读取光伏电池。之后，我们读取传感器数据并将结果打印到串行终端。\n\n```\n// read photo-voltaic\

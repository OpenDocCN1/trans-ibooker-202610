  \n### Break and Continue\n\n当我们执行循环时，我们可能想要退出循环或跳过循环中的某一步骤。在 Sketch 程序中，我们可以使用 break\
  \ 和 continue 语句。\n\n为了演示，我们创建 Sketch 程序来从 0 循环到一个随机值。当循环迭代达到 5 时，我们使用 continue 语句跳过此步骤。然后，当我们达到迭代值大于\
  \ 10 时，使用 break 语句退出循环。\n\n现在我们可以打开 Arduino 软件。我们可以编写此完整的 break 和 continue 实现程序。\n\
  \n```\nvoid setup() {\n  // initialize serial communication\n  Serial.begin(115200);\n\
  \  while (!Serial) {\n    ;\n  }\n}\n```\n\n```\nvoid loop() {\n  long val = random(6,\
  \ 15);\n  int i;\n\n  // print\n  Serial.print(\"val: \");\n  Serial.println(val);\n\
  ```\n\n```\n// looping\nSerial.println(\"Looping: for\");\nfor(i=0;i<val;i++){\n\
  \    if(i==5)\n        continue;\n\n    if(i>10)\n        break;\n\n    Serial.print(i);\n\
  \    Serial.print(\" \");\n}\nSerial.println();\n\ndelay(3000);\n}\n```\n\n将此程序保存为\
  \ BreakContinue。编译并将此程序上传到 Arduino Nano 33 IoT。上传程序后，我们可以使用 Serial Monitor 工具查看程序输出。你可以在图\
  \ 2-8 中看到我的程序输出。\n\n![](img/62b0cd46c774c5bcb05b9b67bb2cb8b0_51_0.png)\n\n图 2-8.\
  \ 在 Sketch 程序上应用 break 和 continue\n\n```\nvoid loop() {\n    state = digitalRead(pushButton);\n\

  可解释人工智能（XAI）是一种旨在创建在很大程度上可被人类解释和/或理解的机器学习模型的人工智能形式。XAI 源于打破人工智能模型黑箱的需要，使其可被人类解释，目的是最大限度地降低这些模型产生未知或不可预测结果的风险。XAI
  不仅与监管和法律原因相关，而且是监控和管理模型性能的重要工具。



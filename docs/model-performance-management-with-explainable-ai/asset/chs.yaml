  我们将在第 6 章更深入地讨论负责任人工智能，但在讨论 XAI 如何融入其中时，让我们在此简要介绍一下。负责任人工智能是人工智能的一个分支，旨在确保所有人工智能系统在设计和构建时都考虑到公平性、隐私、安全性和可解释性。如果你的模型很复杂，它们可能需要由你的数据科学团队解释，以了解（并尝试消除或减少）任何潜在的偏差。如果你在银行、保险或其他高合规行业运营，你的模型也可能因监管原因需要被解释。



- '# Chapter 1. Introduction to Model Performance Management and Explainability


  在互联网兴起之前，由于分发和访问软件的性质，软件开发生命周期更长。还记得过去必须购买 CD 或 DVD 并插入电脑来安装软件的日子吗？生命周期是瀑布式的，以前推送补丁或更新给消费者需要数月（如果不是数年）的时间，而这些在今天的敏捷世界中是理所当然的。


  互联网带来了更互联的软件系统后，监控系统之间以及人与系统之间的通信和交互变得越来越困难。这导致了两种框架的兴起，它们协同工作以实现快速迭代同时保持高性能系统：开发运营（DevOps）和应用性能管理（APM）。随着系统开始变得更智能，我们看到了机器学习（ML）和人工智能（AI）系统的兴起。但随着这项新技术而来的是许多风险和问题，如果我们让这些系统以无法解释或不可理解的方式行为会发生什么。


  这些系统的快速出现也导致了针对机器学习和数据专门的新实践的发展。对于传统软件，很容易测试它是否正常工作：通常有一组离散的可能输入和输出。然而，对于复杂的 ML
  模型和 AI 系统，很难完全监控和观察内部发生了什么。一些模型可能依赖数千甚至数百万个输入来做出决策。这就是为什么我们需要一个以数据为中心的新框架，旨在生产高质量的模型和系统，同时与
  DevOps 和 MLOps 的快速迭代目标保持一致。


  这样的框架将类似于 APM，但适用于 ML 模型并考虑这些模型与传统应用程序之间的细微差别和差异。该框架可以称为 *模型性能管理*（MPM）。模型性能不仅依赖于指标，还依赖于当某事最终出错时模型能够被解释得多好。这就是所谓的
  *模型可解释性*。正如 APM 旨在为运维团队提供对整个应用程序开发过程的更多可见性，MPM 允许这些团队在模型被训练、验证和部署时对其进行监控。在本章中，我们将在深入探讨
  ML 生命周期中涉及的细微差别和阶段以及 MPM 和模型可解释性如何融入其中之前，讨论建立这样一个框架的必要性。


  ## DevOps and Application Performance Management


  让我们退一步谈谈 DevOps 和 APM 是为什么出现以及它们是什么。


  ## DevOps


  DevOps，或开发运营，是一个用于描述用于实现快速迭代和高速度的文化实践、业务流程和工具链组合的术语。目标是快速创新并在问题出现时尽快发现问题。市面上有许多
  DevOps 框架和工具，每个都有其优缺点，但核心是统一实践的整体哲学，在某种程度上在公司和领域之间统一。


  DevOps 的一个原则是系统可观测性，进而是监控。监控是通过使用指标和日志实现的，使我们能够跟踪应用程序内部发生的情况。有工具可以做到




  监控，并且有提供完整可观测性的工具，但没有统一的框架旨在实现对应用系统的完全可见性。因此，DevOps 通常会与 APM 结合使用。


  ## 应用性能管理


  APM 提供了一个框架，用于通过衡量有关应用程序的指标来监控和管理软件应用程序性能，其目标是在问题出现时甚至之前就捕获问题。使用的确切指标可能有所不同，但随着应用程序越来越多地迁移到云，确保
  API 保持高效并满足用户实时期望变得越来越复杂。我们需要确保我们的应用程序在需要时始终可用，并且能够在负载增加或减少时处理而不损失性能。


  您的业务可能为客户提供 API，或为员工使用的应用程序提供内部 API。您也可能为自己的业务需求使用外部供应商的 API。无论细节如何，您都需要确保使用这些 API
  的应用程序具有可接受的响应性和流畅性，以便用户不必等待数分钟页面加载。这归结为 API 对用户请求响应的速度。如果 API 突然变慢，APM 框架会自动提醒负责团队，以便他们可以调查、找到根本原因并解决它。完整的可见性使团队能够在问题导致业务收入损失之前快速识别和修复问题。


  APM 的好处是：


  ### 广泛的可见性


  在今天我们拥有的 DevOps 工具兴起之前，监控基础设施在功能上有限且难以使用。软件和硬件是分开监控的，造成了脱节的体验。APM 在整个部署周期中引入了广泛的可见性，并在一个统一的框架下统一。


  ### 增强的可观测性


  当监控触发警报时，团队会通过修复来解决问题。然而，定位源可能很繁琐且重复，尤其是在警报实际上是预期而不是意外时。超越可见性，APM 提供了额外的根本原因调试支持，称为
  *可观测性*。例如，通过可观测性，应用程序性能下降可能归因于集群中的节点无法处理请求，而不是代码本身的问题。


  ### 明确的责任归属


  APM 使 DevOps 工程师能够通过可观测性和明确的责任归属来管理生产代码的端到端生命周期。责任归属的清晰度允许指定专门的人员，以便快速响应问题。


  ### 迭代速度


  最终，流程的简化、明确的利益相关者和广泛可见性的监控工具的可用性使您的团队能够快速部署、识别和修复问题，从而减少迭代之间的时间并最大化每次迭代的影响。


  ## 应用性能指标


  通常用于衡量应用性能的指标有：


  ### API 延迟


  系统执行操作所需的时间，通常以毫秒（ms）为单位衡量


  ### 每秒查询数（QPS）


  API 每秒被调用的次数


  这些指标对于应用程序团队监控其应用程序能够处理的规模和负载至关重要。它们也是任何自动警报或基于触发的事件的基础，例如系统故障转移，并且可以馈入自动扩展管理解决方案，例如集群调整大小或节点池调整大小（一种管理
  API 用于处理其请求所使用的计算机数量的方式）。随着云计算变得越来越普及，公司正在将许多应用程序和工作负载迁移到云中，使得监控这些指标变得越来越重要。


  可能有一天——比如黑色星期五——您的系统会被请求淹没，导致应用程序崩溃。通过使用 APM 框架模拟此类流量并在事前衡量系统在任何给定 QPS 下的延迟，您的团队可以捕获任何问题并提前设计以防止任何故障或性能下降。这被称为负载测试，可以帮助扩展系统。


  实时流数据、历史回放和出色的可视化工具是当今 APM 解决方案的标准部分。流行的 APM 产品不仅提供对简单统计数据的洞察，而且还具有可用于业务的 API 和组件集成。


  ## MLOps 的兴起


  随着应用程序开始采用更先进的决策算法和模型，确保高性能所需的管理和工具变得更加复杂。对于以代码为中心的应用程序，测试它们是否按预期工作相对简单。但 ML 和 AI
  模型是以数据为中心的，这增加了传统 DevOps 团队不习惯处理的许多挑战（例如确保数据完整性和有效性）。这就是 MLOps 发挥作用的地方。


  机器学习运维，或简称 MLOps，是围绕数据及其使用、数据科学和工具的文化实践的融合，旨在快速迭代模型版本或快速运行实验以测试不同的假设。MLOps 不独立于
  DevOps 存在，它们需要携手合作以确保所有方面都得到覆盖，并且任何问题都可以用最少的团队精力得到解决和解决。我们将在本报告的第 3 章介绍 ML 生命周期和一些
  ML 方面，但现在让我们看看 MLOps 与 DevOps 的比较。


  ## MLOps 与 DevOps 的比较


  MLOps 和 DevOps 都源于相同的根基，并专注于快速迭代和持续改进。没有基于这些哲学的框架，团队将很难建立高效的周期，并且会产生很少的有益成果。MLOps
  和 DevOps 都建议在系统发布前进行验证和测试。然而，它们在可观测性和监控方面存在不足。这就是 APM 在 DevOps 中大放异彩的地方，因为它提供了对应用程序的完全可见性，使团队能够在问题变得明显时立即找到根本原因。


  ML/AI 模型本质上是黑盒；数据科学家并不总是知道模型为何以及如何工作。但这种缺乏可见性无法通过一刀切的解决方案解决，因为每个模型都是独特的。因此，您需要执行大量规划和工作来正确监控模型所需的测试和验证。


  ## 模型性能指标


  有许多不同类型的机器学习（ML）模型，每个模型都有其自己的细微差别和需要跟踪的指标。ML 模型高度依赖于数据，并且依赖于输入数据的质量和一致性。以下是当今 ML
  模型复杂性的一些来源示例：


  - *多功能性*


  ML 服务于广泛的用例——反洗钱、职位匹配、临床诊断和行星监视，仅举几例。


  ### 架构


  ML 算法可以采用多种形式，解释起来更容易或更难；它们范围从简单的逻辑回归和决策树到用于深度学习的先进神经网络。


  ### 多样性


  ML 模型有许多种类（表格、时间序列、文本、图像、视频和音频），并且这些模态通常在某些领域中混合，进一步增加了跟踪模型性能复杂性。


  ### 数据量


  云计算的兴起使团队能够并行使用更多数据训练多个模型，这使得更难跟踪训练数据。


  团队必须能够监控数据分布的突然变化，这可能导致偏差。其他问题可能源于模型训练数据过少或过多，导致性能不佳。跟踪可能影响模型性能的所有参数比跟踪代码库中的代码更改要困难得多。


  通常用于跟踪模型性能的指标有：


  ### 准确率


  实际正确的预测占总预测的百分比


  ### 精确率


  正确识别的阳性案例占阳性案例的百分比


  ### 负预测值


  正确识别的阴性案例占阴性案例的百分比






  ### 灵敏度/召回率


  正确识别的实际阳性病例的百分比


  ### 特异性


  正确识别的实际阴性病例的比例


  使用这些指标中的一些或全部，可以从离线跟踪模型到在线，并将其性能与模拟基线进行比较。由于不同的模型具有不同类型的数据和输出，因此每个模型都会使用这些指标的不同形式。一种常用的可视化工具是混淆矩阵。图
  1-1 使用二元分类的矩阵说明了这一概念（模型仅预测真或假）。如果模型具有更多输出类别，则该矩阵可以扩展到任意数量的行和列，以分析所有表现不佳的类别。


  使用该矩阵，我们可以看到：


  - Accuracy = TP + TN / (TP + TN + FP + FN)

  - Precision = TP / (TP + FP)

  - Recall = TP / (TP + FN)


  尽管这些指标可以很好地衡量模型的性能，但在模型部署后，通常无法确定预测的“真实”值。在生产环境中，模型通常根据其试图实现业务结果来衡量。例如，面向定向邮件的营销模型可能会通过有多少封邮件导致购买来衡量。在这种情况下，模型不是按准确率衡量，而是按其能够实现的业务结果衡量。我们将在后面的章节中更详细地介绍所有这些指标。


  ### 真实值（实际）


  Positive


  Negative


  Predicted


  Positive



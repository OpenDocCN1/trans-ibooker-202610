  ## 机器学习开发流程


  开发机器学习模型通常涉及多个步骤，不同利益相关者共同工作，并在工作流程中不断迭代数据和模型。作为第一步，数据科学家定义业务问题并将其转化为机器学习模型，在收集必要数据后进行。


  接下来，模型验证者评估模型以确保其按预期工作并符合公司标准和政府法规。模型验证后，由机器学习工程师将其部署到生产环境并开始在业务应用中进行预测。一旦投入生产，持续监控、测试和调试的过程就开始了，通常由
  DevOps 工程师、数据工程师、ML 工程师和数据科学家团队管理。最后，团队实时或批量分析模型的输出以检查其性能、修复错误并收集见解以训练性能更好的模型。


  利益相关者因公司而异，因为该领域仍新且在发展中，但迭代 ML 模型的核心循环保持不变。简单来说，MLOps 就是将机器学习模型操作化的这种持续反馈驱动循环。为了关闭此循环，MLOps
  需要一个专用框架，可作为 ML 工作流程核心的集中控制系统。该框架在所有阶段跟踪和监控模型的性能，即模型性能管理。


  ## 模型性能管理


  与应用性能相比，管理和监督模型性能需要处理更多数据，并对所涉及的领域有更深入的理解。如果没有统一的框架或工具集，数据科学和机器学习团队可能很难大规模部署模型并保持高性能。这就是

  MPM 的用武之地。MPM 是一个管理模型在其生命周期内性能的框架，并确保团队对 ML 生命周期每个阶段都有清晰的可见性。图 1-2 显示了该生命周期的概述。MPM
  提供的反馈循环允许持续改进模型。


  ## 图例


  Online


  Offline


  ## Train


  Log training and test datasets

  Check for bias and feature quality


  Feedback loop


  ## Analyze


  Root-cause performance issues

  Slice and dice prediction log data

  Generate adversarial examples


  ## Validate


  Ingest the model, explain performance

  Discover slices of low model performance

  Create model dashboards and reports


  ## Monitor


  Observe performance, drift, outliers, bias, and errors

  Alert on conditions and slices


  ## Deploy


  Record model traffic and metadata

  Compare challenger and champion models on performance and bias


  图 1-2. 模型的生命周期


  MPM 反馈循环通过以下方式增强生命周期的每个步骤：


  - 在 *training* 模型并选择用于训练模型的功能或数据时，您的团队可以通过数据中代表不足或过度代表的群体发现隐藏的偏差。偏差也可能由于输入数据的变化而发生，称为
  *data drift*。

  - 模型训练后，MPM 框架可以 *validate* 并将任何性能估计记录到数据库中以供跟踪和审计。此信息可用于为业务、合规和 AI 伦理利益相关者生成摘要报告。

  - 当新模型准备好 *deploy* 时，可以使用相同的数据将其与以前的版本进行比较，以确保新模型优于旧模型。这通常称为 champion/challenger
  测试和验证。

  - 一旦模型发布到生产环境，MPM 框架可作为 *monitoring* 工具来观察模型性能、漂移、偏差，并在出现错误条件时发出警报。MPM 框架还可用于同时衡量两个模型的性能，称为
  A/B 或 champion/challenger 测试。

  - 由于 MPM 是一个反馈循环，任何从错误、性能问题或 *analyses* 中产生的见解都可用于提高未来模型的性能。


  需要注意的是，MPM 框架不会取代现有的 ML 训练、部署和服务系统。相反，它位于 ML 工作流程的核心，捕获所有模型工件、训练和生产数据以及模型性能指标。


  由于 ML 空间内的复杂性增加，即使他们已拥有 MLOps 框架，团队也经常面临以下挑战：


  ## 性能不一致


  由于 ML 模型是在历史数据上训练的，因此模型在离线（在暂存环境中）的表现与在线（在生产环境中，使用以前未见过的数据）的表现之间可能存在很大差异。


  ## 缺乏控制


  机器学习通常是黑盒。这使得很难理解模型如何以及为何从给定数据中得出输出以推动性能改进。


  ## 偏差放大


  模型会放大其训练数据的偏差，这使得识别潜在的偏差来源非常重要。此外，由于缺乏可见性，很难确定模型在测试数据集或真实数据上的运行方式是否与训练数据上的运行方式相同。未能识别历史数据和真实数据集之间的差异或不平衡可能会放大隐藏的偏差，可能违反公司政策并导致客户不信任。


  ## 缺乏可调试性


  无法调试复杂模型可能导致信任度低和模型性能下降。它还阻止这些模型在金融和医疗保健等受监管行业中使用。


  ## 反馈循环


  模型退化经常推动构建更好的模型以代表当前的业务现实的需求——但形成反馈循环的操作见解今天却缺失了。


  ## 难以迭代改进性能


  跟踪和比较生产版本中模型行为和性能的挑战使得很难理解性能如何随着时间的推移而改进。


  ## 用于全面覆盖的可解释性 MPM


  准确率约为 80–90% 的高性能 ML 模型仍可能存在隐藏的偏差和数据中代表不足的群体。为了检测数据中的隐藏偏差，团队需要分析使用的特征以及这些特征中数据的分布。这应在特征选择和模型训练阶段进行，通常会导致这些问题在早期被发现。然而，随着时间的推移，模型被设置为自动重新训练，偏差可能会开始渗入，因为某些数据群体变得更普遍或不那么普遍。为了应对这种情况，MPM
  框架需要监控数据分布与基线，以捕捉可能导致偏差的任何出现的漂移。


  漂移可能由于用于进行预测的数据发生变化或用于训练模型的数据发生变化而发生。在任何一种情况下，MPM 都需要跟踪数据分布并考虑模型期望的内容与实际看到的内容之间的变化。任何超出正常范围的偏差都应被标记以进行调查和调试。第
  2 章将更详细地介绍可解释性并讨论可解释人工智能的哲学。


  ## 使用 MPM 框架的好处


  如前所述，MPM 框架旨在为机器学习生命周期带来可见性。它解决了 MLOps 中的几个运营挑战，例如性能不一致、控制力丧失和缺乏反馈循环。但这对企业意味着什么？让我们来看看
  MPM 框架提供的一些关键业务优势。


  ## MPM 在模型上线前验证模型


  在部署模型之前，验证模型至关重要，无论是否法律要求。这确保了在发布时，您拥有高性能、经过充分测试且稳健的模型。由于模型将围绕




  业务假设或问题，验证过程涉及与业务利益相关者核实，一旦部署后它是否解决了预期的问题，并且不会损害业务的其他方面。这要求模型以人类可理解的术语进行解释。为了回答诸如“模型是如何做出预测的？”和“是否存在任何偏差？”这样的问题，模型必须经过验证。验证通常可以使用诸如交叉验证等技术来评估模型行为的变化。如果模型通过验证，它将被部署，业务就可以开始使用机器学习，并对机器学习模型的影响有清晰的理解。然而，这只是机器学习反馈循环的开始。


  ## MPM 持续监控生产环境中的模型性能


  与传统程序相比，机器学习模型是独特的软件实体，因为它们是使用历史示例针对可重复任务的高性能进行训练的。因此，随着它们作为输入接收到的真实世界数据发生变化，其性能会随着时间推移而波动。没有公司能确切知道模型部署后会表现如何。因此，成功的机器学习部署需要持续监控，以持续重新评估模型对业务的价值和性能。


  ## MPM 主动解决模型偏差


  偏差在世界上是普遍存在的。由于机器学习模型从有限的训练数据中捕捉关系，因此它们很可能传播或放大现有的数据偏差，甚至可能引入新的偏差。关于信贷借贷、招聘和医疗保健人工智能算法中
  alleged 偏差的故事证明了这些风险。因此，公司一直在花费额外精力来衡量和防范偏差，通过摄取或推断受保护属性。但模型在发布后也可能变得有偏差。


  由于偏差可能造成严重的业务损害，尤其是在高度受监管的环境中，实时识别偏差可以让公司避免昂贵的处罚，例如财务罚款或消费者愤怒。与性能指标一样，数据科学家通常需要离线计算偏差指标，这增加了出错的风险（因为他们没有使用生产数据）。此外，偏差问题可能与其他问题相关；例如，男性求职者数量的激增可能导致求职者匹配中的偏差。孤立地调查偏差原因可能会导致数据科学家忽视此类相关性，导致他们不必要地花费时间调试本可以轻松纠正的问题。


  ## MPM 检测训练/服务偏差


  用于在在线和离线环境中训练和服务模型的特征可能不同。当这种情况发生时，模型的行为会不同，需要进行调试。通过将训练数据和预测日志保存在一个地方，MPM 使开发人员能够检测这些偏差。


  ## MPM 解释过去的预测


  想象一家银行正在使用机器学习来批准贷款，而一位客户对某笔贷款被拒提出投诉。由于 MPM 从训练到服务跟踪模型的行为，风险运营官可以回溯时间重现预测以及解释（这被称为“预测时间旅行”）。


  在下一章中，我们将讨论可解释人工智能如何进一步增强 MPM 的优势。


  在视频上运行的模型的工作方式与图像模型类似，但会为每一帧生成预测。因此，解释将包括在视频上叠加显示模型感兴趣的区域。当观察到意外行为时，可以暂停或减慢视频，并分析感兴趣的帧以调整模型的性能。



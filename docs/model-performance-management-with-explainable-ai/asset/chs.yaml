  ## 谁需要 XAI？


  有许多利益相关者可能希望你解释模型的输出。这些利益相关者可分为三大类：


  - 内部技术和业务利益相关者，如数据科学家、机器学习工程师、产品负责人或高管

  - 人工智能系统或产品的终端用户

  - 公共利益相关者，如监管机构或投资者



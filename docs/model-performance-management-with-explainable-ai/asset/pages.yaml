    storing, and analyzing tools and services that can be used in a multitude of use
    cases and in different configurations. This is open source software with options
    for managed services provided by many vendors, including Elasticsearch itself.
    This means that you can choose to manage your own infrastructure or allow a vendor
    or service provider to manage the infrastructure for you. Managing'

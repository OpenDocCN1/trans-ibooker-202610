  img_proc: true
- pgno: 30
  md: 'XAI is used in many different domains, and it is used in different ways to
    explain models across these domains. This section will discuss the three main
    types of explainable models that you might encounter—models for text, images,
    and tabular/structured data—and the different ways they might be explained.


    # Tabular/Structured Data Models (Highest Contributing Features)


    Structured data models are typically opaque and are not easy to interpret if there
    are more than one or two inputs. As these models become more complex and involve
    more variables, they become harder and harder to explain. But since they output
    predictions based on a series of inputs, it can be beneficial to know which inputs
    are contributing the most to the model’s output.


    To explain a structured or tabular data model, the inputs are sorted in terms
    of their weight contribution to the model’s prediction, and color coding can be
    applied to help visualize what is happening and to pinpoint outliers or abnormalities.


    Once a model explanation is available, the team can use it to understand what
    factors are contributing to the model’s predictions, whether it has any bias,
    or if any features can be removed without impacting the model’s output.


    Suppose we have a model that works by analyzing a combination of features about
    a financial transaction with the intent of detecting fraud. These features might
    include some information about the customer, describing their typical behavior.
    The output of this model predicts how likely a transaction is to be fraudulent.
    Once a transaction is flagged, precautionary measures can be taken, such as locking
    the account until the user either calls the bank or visits a branch. If a transaction
    is incorrectly flagged as fraud, it is possible that the model doesn’t have enough
    features to understand the full context or was not trained on similar examples.
    In either case, a model explanation can be used to figure out which features'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'contributed to the model underperforming or not behaving as expected, and new
    models can be trained to address this issue.


    # Text/Speech Models (Sentiment)


    The majority of text models perform some form of natural language processing (NLP)
    and involve a corpus or dictionary of words that are used to generate a score
    for the provided text. This score can be used in many ways to create a picture
    of the sentiment or emotion in a given piece of text. Sentiment analysis is the
    most commonly used form of NLP, and these models usually display a binary positive
    or negative sentiment along with a score.


    In order to explain such models, we attempt to identify the words in the text
    that contributed most to the text’s sentiment score. This can help pinpoint words
    that are missing from the corpus used to train the model to produce the scores,
    or words that are misclassified. Being able to understand the model’s output will
    allow your team to easily identify issues and work to constantly improve its performance.


    Suppose we have a corpus that produces the following sentiment mapping: {“love”:
    +1}. Now let’s assume we provide the model with the following text: “I love how
    much you hate this subject.” If I were to ask you if that statement was negative
    or positive, what would you say? To me, that sentence is pretty neutral: love
    and hate effectively cancel each other out. If we were to ask our model, however,
    it would think that the sentence was positive since it only knows that “love”
    has a score of +1. An explanation of the model’s output might look something like
    this: “I love+1 how much you hate this subject.” To fix this issue, we would want
    to modify our corpus to look something like this: {“love”: +1, “hate”: −1}. This
    would result in a total score of 0 and a model explanation that might look like
    the following: “I love+1 how much you hate−1 this subject.”


    This oversimplified example is essentially how NLP models work at scale, but models
    are usually trained on huge corpora and might have custom domain-specific scores.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'A real-world example would be a Twitter analytics tool that is used to monitor
    the overall sentiment and/or emotion of a given hashtag or account. To ensure
    the model is performing as expected, samples of predictions can be run through
    XAI to highlight the words that are contributing the most to a given score. Let’s
    now assume that someone in QA discovers a word that is highly negative in sentiment
    but is not being highlighted. This word can be flagged as needing to be added
    to the corpus along with the negative sentiment. Because of the fast-paced nature
    of the Twitterverse and the constant evolution of the language, with new acronyms
    and slang terms being introduced all the time, this kind of adaptation is often
    required.


    # Image/Video Models (Heatmaps)


    Image models typically fall into one of two major categories: image classification,
    where one or more labels might be the output of the model, and object detection,
    where a box is usually drawn around an object in the image along with some labels
    or tags. In either case, the underlying algorithms are usually of the same type—a
    form of deep learning algorithm called a neural network—and can be explained in
    similar ways.


    Convolutional neural networks (CNNs) are a common type of neural network used
    in image models. Without going into the nitty-gritty details, these models break
    down the image into smaller chunks and then decide based on those chunks which
    pixels are important or not important.


    Similar to how in text models the words that contribute the most to the model’s
    prediction are highlighted, in image models, pixels are highlighted to show which
    areas in the image the model decided to focus on versus ignore. The actual layers
    of the model might not be directly interpretable, however, as these models are
    usually complicated neural networks.


    Figure 2-1 illustrates what this overlay might look like for a model that is identifying
    a cat.'

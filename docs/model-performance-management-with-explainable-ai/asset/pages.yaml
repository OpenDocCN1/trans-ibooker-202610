- pgno: 17
  md: '# The ML Development Process


    Developing a machine learning model typically involves multiple steps, with various
    stakeholders working together and constantly iterating on data and models in the
    workflow. As the first step, data scientists define a business problem and turn
    it into a machine learning model, after gathering the necessary data.


    Next, a model validator evaluates the model to make sure it works as intended
    and complies with company standards and government regulations. After the model
    is validated, it’s deployed into production by a machine learning engineer and
    starts to make predictions in business applications. Once it’s in production,
    the process of continuous monitoring, testing, and debugging starts, typically
    managed by a team of DevOps engineers, data engineers, ML engineers, and data
    scientists. And finally, teams analyze the model’s output in real time or in batches
    to check its performance, fix errors, and gather insights to train a better-performing
    model.


    The stakeholders may vary from company to company because this field is still
    new and developing, but the core loop of iterating ML models remains the same.
    Simply put, MLOps is this continuous feedback-driven loop of operationalizing
    machine learning models. To close this loop, MLOps requires a dedicated framework
    that can act as a centralized control system at the heart of the ML workflow.
    This framework, which tracks and monitors the model’s performance through all
    the stages, is model performance management.


    # Model Performance Management


    When compared to application performance, managing or overseeing model performance
    is a lot more data-intensive and requires a deeper understanding of the domain
    at hand. Without a unified framework or set of tools to use, your data science
    and machine learning teams might find it hard to deploy models at scale and maintain
    high performance. This is'
  merge: -1
  img_proc: true
- pgno: 18
  md: where MPM comes in. MPM is a framework for managing model performance throughout
    its life cycle and ensuring that teams have clear visibility into every stage
    of the ML life cycle. Figure 1-2 shows an overview of this life cycle. The feedback
    loop provided by MPM permits continuous model improvement.
  merge: -1
  img_proc: true

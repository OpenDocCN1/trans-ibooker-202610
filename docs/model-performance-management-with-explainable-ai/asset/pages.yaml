- pgno: 66
  md: 'Figure 5-1. MPM in the model training, deployment, and monitoring stages


    # Model Training and Offline Performance


    When training a model offline, as was mentioned in the previous chapters, the
    data is split into training and test sets and the performance is measured with
    the objective of tuning it to achieve the optimal model. During training, the
    target objective (label or expected output) is used to measure how accurate or
    precise the model is and thus how well it is performing. These target metrics
    are usually identified and set early on in the machine learning life cycle. The
    offline evaluations serve as a measure to estimate how well the model will perform
    in the real world.


    Offline metrics can only show how well a model will perform on historical data,
    however, and might not be a good measure for how well the model will perform online.
    It’s possible that bias that exists in the historical data might not be accounted
    for, and the problems might only become apparent after the model has been deployed.
    This can have a large impact on your business. In order to prevent such scenarios
    from happening, it is important to continuously monitor model performance issues
    during training and to stress-test the model in order to catch any problems before
    it goes live.


    # Online Model Performance


    Once a model does go live, it becomes harder to track its performance as the target
    labels or outputs from the model are not known ahead of time. One way to track
    the performance is to measure any changes in the predictions being made and whether
    they suddenly vary outside a normal range. If that does happen, it could trigger
    a model performance issue. Another way to monitor performance in a live environment
    is to use indirect measures, such as increases in sales or customer satisfaction.
    These proxy measures might not reveal any direct issues in the model but are a
    good way to track complex models that are not performance critical. For models
    that are performance critical, a QA sample can be taken and a human evaluator
    can measure the accuracy or performance of the model'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'and track any issues for the data science and machine learning teams to look
    into. Issues might also arise due to customers reporting a bug or asking for an
    explanation as to why a certain result was given to them.


    # An Ideal MPM Framework


    When thinking about an ideal MPM framework that will help in managing models,
    we need to start with the KPIs and metrics that will help us in tracking performance.
    An MPM framework implements the MPM process in order to provide continuous feedback
    to your team and allows for transparency into the process. This framework should
    track the performance of the model from the time it is trained until it is deployed
    and released.


    An ideal MPM framework needs to be able to aid in pinpointing the root cause of
    model performance issues. As such, it needs sufficient visibility into your system
    and the outputs it is producing. Here are some of the criteria that define a good
    MPM framework:


    +   - It tracks the *model version* alongside the *training data* used.

    +   - It stores all *metadata* about predictions alongside the *predictions* themselves.

    +   - It provides *automated alerts* when set *thresholds* are reached.

    +   - It has the ability to *replay predictions* in order to *compare models*.

    +   - It has a *graphical interface* to allow monitoring of the health of the
    system.

    +   - It allows the team to *analyze the raw data and metadata* to uncover undetected
    issues.

    +   - It *utilizes XAI* to *uncover hidden bias* in the data.


    This list is far from exhaustive and can be expanded upon based on your needs.
    Once the MPM system requirements have been identified for your team and/or organization,
    it is time to select the tool(s) to implement such a'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'framework. The following sections offer some examples of tools, frameworks,

- pgno: 20
  md: 'Figure 1-2. The life cycle of a model


    The MPM feedback loop augments each step of the life cycle in the following ways:


    +   - While *training* a model and selecting features or data to train the model
    on, your teams can uncover hidden bias through under- or overrepresented groups
    in the data. Bias can also occur as a result of a change in the data coming in,
    known as *data drift*.


    +   - After the model is trained, the MPM framework can *validate* and log any
    performance estimates to a database for tracking and auditing purposes. This can
    be used to generate summary reports for business, compliance, and AI ethics stakeholders.


    +   - When a new model is ready to be *deployed*, it can be compared to a previous
    version using the same data to ensure that the new model is outperforming the
    old one. This is often called champion/challenger testing and validation.


    +   - Once the model is launched to production, an MPM framework serves as a *monitoring*
    tool to observe model performance, drift, bias, and alerts on error conditions.
    An MPM framework can also be used to measure the performance of two models simultaneously,
    known as A/B or champion/challenger testing.


    +   - Since MPM is a feedback loop, any insights generated from errors, performance
    issues, or *analyses* can be used to improve future models’ performance.


    It is important to note that an MPM framework does not replace existing ML training,
    deployment, and serving systems. Instead, it sits at the heart of the ML workflow,
    capturing all the model artifacts, training and production data, and model performance
    metrics as well.


    Because of the increased complexity within the ML space, teams often struggle
    with the following challenges, even when they have an MLOps framework in place:'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Inconsistent performance


    Since ML models are trained on historical data, there can be large differences
    between how the models perform offline (in staging) and how they perform online
    (in production, with previously unseen data).


    # Lack of control


    Machine learning is often a black box. This makes it difficult to understand why
    and how the model is deriving an output from the given data to drive performance
    improvements.


    # Amplification of bias


    Models can amplify bias in the data they are trained on, which makes identifying
    potential sources of bias very important. Furthermore, because of the lack of
    visibility, it can be difficult to be sure that the model is operating the same
    way on the test dataset or on real data as it did on the training data. Failure
    to identify discrepancies or imbalances between the historical and real datasets
    could amplify hidden biases, possibly violating corporate policy and resulting
    in customer mistrust.


    # Lack of debuggability


    Inability to debug complex models could lead to low trust and model performance
    deterioration. It also prevents these models from being used in regulated industries
    such as finance and healthcare.


    # Feedback loop


    Model degradation frequently drives the need to build a better model to represent
    the current business reality—but the operational insights that form the feedback
    loop are missing today.


    # Difficulty in improving performance iteratively


    Challenges in tracking and comparing model behavior and performance across production
    versions make it difficult to understand how'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'performance can be improved over time.


    # MPM with Explainability for Full Coverage


    A high-performing ML model with around 80–90% accuracy might still have hidden
    biases and underrepresented groups in the data. In order to detect hidden biases
    in data, teams need to analyze the features being used and the distribution of
    data in those features. This should take place during the feature selection and
    model training stages, and usually leads to these issues being caught early on.
    However, as time goes on and models are set up to be automatically retrained,
    bias can start to creep in as certain groups of data become more or less prevalent.
    In order to account for this, an MPM framework needs to monitor data distributions
    against a baseline to catch any arising drift that might cause bias.


    Drift can occur due to the data being used to make the predictions changing or
    the data being used to train the model changing. In either case, MPM needs to
    track the distribution of data and account for the changes between what the model
    is expecting and what it is seeing. Any deviation above what is normal should
    be flagged for investigation and debugging. Chapter 2 will go into explainability
    in more detail and talk about the philosophy of Explainable AI.


    # Benefits of Using an MPM Framework


    As mentioned previously, the MPM framework aims to bring visibility into the machine
    learning life cycle. It addresses several of the operational challenges in MLOps,
    such as inconsistent performance, loss of control, and lack of a feedback loop.
    But what does that mean for a business? Let’s take a look at some key business
    benefits that the MPM framework provides.


    # MPM validates models before pushing them live


    Before deploying a model, it is crucial to validate it, whether required by law
    or not. This ensures that at launch, you have a high-performing, well-tested,
    and robust model. Since the model will have been built around a'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'business hypothesis or problem, the validation process involves verifying with
    business stakeholders that it solves the intended problem once deployed and does
    so without hampering other aspects of the business. This requires the model to
    be explained in human-understandable terms. To answer questions like “How is the
    model making a prediction?” and “Are there any biases?” a model has to be validated.
    The validation can often be performed using techniques such as cross-validation
    to assess changes in the model’s behavior. If the model passes validation, it
    gets deployed, and the business gets to start using machine learning with a clear
    understanding of the ML model’s impact. However, this is just the beginning of
    the ML feedback loop.


    # MPM continuously monitors model performance in production


    Machine learning models are unique software entities compared to traditional programs
    because they are trained for high performance on repeatable tasks using historical
    examples. As a result, their performance can fluctuate over time as the real-world
    data they receive as input changes. No company can know for certain exactly how
    a model will perform after it’s deployed. So, successful ML deployments require
    continuous monitoring to reassess the model’s business value and performance on
    an ongoing basis.


    # MPM proactively addresses model bias


    Biases exist in the world, as a rule. Since ML models capture relationships from
    a limited set of training data, they are likely to propagate or amplify existing
    data bias and may even introduce new bias. Stories about alleged bias in credit
    lending, hiring, and healthcare AI algorithms demonstrate these risks. As a result,
    companies have been spending extra effort to measure and guard against bias by
    either ingesting or inferring protected attributes. But models can become biased
    after release as well.


    Because bias can cause serious business damage, especially in highly regulated
    environments, identifying it in real time can save companies from costly penalties,
    such as financial fines or consumer outrage. As is the case'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'with performance metrics, a data scientist typically needs to calculate bias
    metrics offline, which heightens the risk of errors (because they are not using
    production data). Moreover, bias issues can be correlated to other issues; for
    example, a spike in the number of male job applicants could cause bias in job
    candidate matching. Investigating causes of bias in a silo can cause data scientists
    to overlook such correlations, resulting in them spending time unnecessarily on
    debugging issues that could have been easily corrected.


    # MPM detects training/serving skew


    Features used to train and serve the models in online and offline environments
    can differ. When this happens, the model will behave differently and needs to
    be debugged. By keeping the training data and prediction log in one place, MPM
    enables developers to detect these skews.


    # MPM explains past predictions


    Imagine a bank is using ML to approve loans, and a customer files a complaint
    about a particular loan being denied. Because MPM tracks a model’s behavior from
    training to serving, a risk operations officer can go back in time to reproduce
    the prediction along with the explanation (this is known as “prediction time travel”).


    In the next chapter, we’ll discuss how Explainable AI enhances the benefits of
    MPM even further.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Chapter 2. Explainable AI


    Explainable AI (XAI) is a form of AI that aims at creating machine learning models
    that are, for the most part, explainable and/or interpretable by humans. XAI evolved
    out of the need to break open the black box of AI models to make them interpretable
    by humans, with the intent of minimizing the risk of unknown or unpredictable
    outcomes from those models. XAI is not only relevant for regulatory and legal
    reasons, but it is also an important tool for monitoring and managing model performance.


    In this chapter, we will discuss who in your company (or outside it) might want
    an explanation of your models’ predictions, the many reasons you might want your
    models to be explainable and/or interpretable, and how different types of models
    can be explained. The focus will be on how explainability can be used to understand
    and thereby improve the performance of ML models.


    # Explainability in Context


    Before exploring XAI, let’s briefly discuss what AI is and its relationship to
    Responsible AI. AI is a form of intelligence demonstrated by machines, which is
    akin to natural intelligence demonstrated by animals and humans but without the
    ability to display emotions or consciousness. You might have heard of some advanced
    AI systems, such as the autopilot feature on planes or the autonomous driving
    capability of cars, that have been in the limelight of the AI community for the
    past decade.


    AI systems can be as simple as the devices that turn on the lights as you walk
    into a room or as complex as an autonomous rover that can explore foreign planets.
    Think of FaceID on the iPhone as a form of AI that’s used to verify your identity,
    or a fraud detection model that aims to catch fraudulent transactions on your
    bank account. The use of AI has expanded to touch nearly every aspect of daily
    life in unprecedented ways.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# How Does XAI Fit into Responsible AI?


    We’ll discuss Responsible AI in more depth in Chapter 6, but let’s briefly introduce
    it here to discuss how XAI fits into it. Responsible AI is a branch of AI that
    aims at ensuring all AI systems are designed and built with fairness, privacy,
    security, and explainability in mind. If your models are complex, they might need
    to be explained by your data science team to understand (and try to eliminate
    or reduce) any potential biases. Your models might also need to be explained for
    regulatory reasons if you operate in banking, insurance, or other high-compliance
    industries.


    XAI goes hand in hand with Responsible AI’s focus on ensuring fairness and limiting
    bias. XAI can be used to detect higher-weighted features in the model and either
    remove them altogether or reduce their weights through negative biasing. Reducing
    bias or noise in the data can make the model easier to explain or interpret.


    # Who Needs XAI?


    There are many stakeholders that might want you to explain your models’ outputs.
    These stakeholders fall into three main categories:


    +   - Internal technical and business stakeholders such as data scientists, machine
    learning engineers, product owners, or executives

    +   - End users of the AI system or product

    +   - Public stakeholders such as regulators or investors


    Internal teams are interested in continuously improving the model’s performance
    through understanding why it predicted certain things. From management to low-level
    developers, it is important to comprehend what your model is doing and how it
    will behave in the real world before letting it run wild and free. Model explainability
    techniques can help stakeholders understand the effect each input had on the output
    (its weight) and how different classes of data behave. Models come in many forms,
    and later in this chapter we will discuss the different forms of explainability
    across'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'different model types (including models dealing with text, images, and tabular
    data).


    End users might also want to understand why a model predicted a certain outcome
    for them. Depending on your use case, you may want to transparently expose this
    explanation. In the case of a dispute, the explanation can be used to justify
    or arbitrate the outcome of the model; it’s an especially important tool in high-risk
    models, such as those in the healthcare domain, where a model’s decision can mean
    life or death.


    Finally, we have public interests such as regulatory bodies and investors. These
    stakeholders are interested in ensuring your models are compliant with all the
    rules and regulations that might apply to your company or industry. In Chapter
    6, we will discuss in more detail how Responsible AI as a whole is used to manage
    these stakeholders’ interests.


    # How XAI Can Be Used to Manage Model Performance


    The different types of explanations discussed in the next section offer insight
    into the practical application of XAI. This section will introduce how XAI can
    be used within the context of MPM.


    # Interpretability Versus Explainability


    AI systems often involve machine learning models, which are essentially the decision-making
    algorithms that predict an outcome or recommend a decision. These predictions
    may or may not be fully interpretable or explainable by humans. Interpretability
    and explainability are often used interchangeably in the context of AI, but let’s
    briefly walk through the subtle differences between the two.


    Interpretability is the ability for a cause-and-effect relationship to be mapped—that
    is to say, a defined set of inputs produces a defined and deterministic set of
    outputs every time, without necessarily knowing why that is the case. To put this
    in the context of machine learning, the model’s'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'output can be predicted from the inputs, but there is no explanation as to
    why this output may have been produced. For example, a model that predicts your
    income based on your age group alone will be fully interpretable, since for the
    same age it will always yield the same result.


    Explainability, on the other hand, is the ability for the effect of each of a
    model’s inputs on its output or prediction to be explained. Such explanations
    are important for complicated models such as neural networks where there are multiple
    inputs fed into a black box, with little insight into its inner workings. In one
    approach to explain a model’s predictions, the input values are perturbed slightly
    to see if there’s an effect on the model’s output. Using such techniques, we can
    gain insight into why the model is behaving the way it is. An example of an explainable
    model would be a loan default prediction algorithm based on a number of inputs,
    such as debt-to-income ratio and credit score. With this model, it will be hard
    to map the inputs to outputs, since that would yield too many combinations. In
    this case, it might be difficult to *interpret* the model, but the model can be
    *explained* by using XAI techniques to determine how much each input contributes
    to the output.


    # Models That Are Interpretable by Design Versus Explainable After


    With the slew of machine learning frameworks and toolsets to choose from, generating
    model interpretations and/or explanations becomes a nontrivial task. Not all tools
    are created equal, and not all models are built for explainability or interpretability.
    Depending on the type of model or framework used, the outputs or predictions may
    be fully explainable and/or interpretable from the get-go (as is the case with
    simpler models like logistic regressions or decision trees), or they may need
    to have someone explain them post-training (as is the case with deep learning
    models or pretrained models). Models that are interpretable by design are often
    viewed as the least risky, since they are easier to explain. So where possible,
    you might decide to stick with these simpler models that your stakeholders can
    understand rather than invest resources into building a'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'more advanced model that might not fully be explainable or interpretable and
    thus harder to get buy-in on.


    # Understanding Model Predictions


    Understanding why different models are predicting what they are predicting is
    very important in order to analyze model behavior, debug issues, track performance,
    and understand bias. If you suddenly notice a dip in your model’s performance,
    the first place to look is the prediction outputs. If there is a problem with
    the model itself, then model explanations can be used to debug it or to account
    for how it deals with new data in the system. Often models experience what is
    known as data drift (or model drift), where over time the data provided to the
    model changes slightly (or new data emerges), causing its performance to degrade
    if it is not updated. It’s important to observe model predictions after deployment
    and check that they remain understandable and do not deviate from expectations.


    # Offline Versus Online Explainability


    Model explanations can be generated either offline or online. As the name suggests,
    offline explanations are typically used during the development cycles of a model
    in order to understand the model better and hopefully build the best version for
    production use. In contrast, online explanations are based on the model’s predictions
    after it goes into use. Generating spot online explanations can help you debug
    and find the root cause of operational issues by providing an additional layer
    of model understanding, while generating them continuously can help you monitor
    how model behavior is changing (for example, how the top three most important
    features change over time). This is why it is vital to have a robust MPM process
    in place that can flag events as abnormal or track model confidence in order to
    alert the team when certain thresholds are passed.


    # XAI in Different Domains'

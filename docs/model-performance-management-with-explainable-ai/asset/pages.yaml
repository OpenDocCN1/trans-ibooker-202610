    Whether your team chooses an on-premises or cloud native solution will come down
    to a multitude of factors. If latency and scale are concerns for your business,
    then it might be beneficial to adopt cloud native systems. If cost and security
    are more important to you, then an on-premises solution using an open source offering
    might be the right choice. The decision will impact the system’s performance in
    a production setting, and care should be given to your choice. A hybrid approach
    can also be used if data residency is a requirement in your industry or business.


    # Custom-Built Systems


    If the needs of your team are not met by any of the cloud platforms or specialized
    tools you evaluate, it might be worthwhile considering building your own MPM framework.
    There are many open source tools and frameworks that can be leveraged for this
    task. One software stack that can meet the needs of MPM is the Elasticsearch ELK

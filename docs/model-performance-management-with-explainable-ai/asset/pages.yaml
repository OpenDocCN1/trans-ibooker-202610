- pgno: 6
  md: '# Preface


    Every industry, company, and consumer has been impacted by artificial intelligence
    (AI). According to [The State of AI 2019: Divergence](https://), 1 in 10 enterprises
    currently use 10 or more AI applications. According to [Gartner](https://), 75%
    of businesses are expected to shift from piloting to operationalizing AI by 2024.
    How many AI applications does your company currently operate?


    AI has the potential to provide productive, efficient, and innovative solutions
    to our everyday problems, but it comes with its risks. We’ve seen multiple examples
    in the past few years of alleged bias in AI. One high-profile example was the
    [Apple Card/Goldman Sachs scandal](https://) in 2019, where what started as a
    tweet thread with multiple reports of alleged bias eventually led to a regulator
    opening an investigation into algorithm prediction practices at Goldman Sachs.
    And this isn’t an isolated instance; there have also been reports about [Amazon’s
    biased hiring algorithm](https://), [racial bias in healthcare algorithms](https://),
    and [bias in AI for judicial decisions](https://).


    These issues might have been avoided if humans had visibility into every stage
    of the system life cycle. Part of that life cycle involves training a machine
    learning (ML) model to help in making decisions. In the model validation stage,
    teams could have unearthed instances of unwanted model behavior. With visibility
    into model performance online and offline, these sorts of unwanted behaviors can
    be detected and managed early on.


    For each high-profile case that comes under public scrutiny, there are probably
    many systems that are silently operating and negatively impacting lives. One of
    the main concerns with AI today is that issues are detected after the fact, usually
    when people have already been affected by them. This is a foundational problem
    in AI that needs a foundational fix. That’s where model performance management
    (MPM) comes in.


    Technology teams often utilize DevOps principles and application performance management
    (APM) to rapidly iterate software development'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'and ensure high performance, respectively. MPM is a framework that draws on
    these learnings and applies them to the unique challenges of working with ML models
    to provide teams with control and visibility over the entire ML workflow. MPM
    is to MLOps what APM is to DevOps: it’s a framework that offers observability
    and control over model performance.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Chapter 1. Introduction to Model Performance Management and Explainability


    Before the rise of the internet, software development life cycles were longer
    due to the nature of distributing and accessing software. Remember the days of
    having to purchase a CD or DVD and insert it into your computer to install software?
    The life cycle was a waterfall, and it used to take months (if not years) to perform
    actions like pushing a patch or an update to consumers that are taken for granted
    in today’s agile world.


    After the internet brought about more connected software systems, monitoring communications
    and interactions between systems as well as between people and systems became
    harder and harder. This led to the rise of two frameworks that work well with
    each other to enable rapid iteration while maintaining high-performing systems:
    development operations (DevOps) and application performance management (APM).
    As systems started to advance and become more intelligent, we saw the rise of
    machine learning (ML) and artificial intelligence (AI) systems. But with this
    fancy new technology comes many risks and questions about what might happen if
    we let these systems behave in uninterpretable or unexplainable ways.


    The rapid emergence of these systems also led to the development of new practices
    focused on machine learning and data specifically. With traditional software,
    it is easy to test if it’s working: there is usually a discrete set of possible
    inputs and outputs. When it comes to sophisticated ML models and AI systems, however,
    it becomes hard to fully monitor and observe what is happening inside. Some models
    may draw upon thousands if not millions of inputs to make a decision. This is
    why we need a new framework focused around ML and AI that is data-centric and
    aims at'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'producing high-quality models and systems that work with the goals of rapid
    iteration of DevOps and MLOps.


    Such a framework would be similar to APM but would apply to ML models and account
    for the nuances and differences between these models and traditional applications.
    This framework can be called *model performance management* (MPM). Model performance
    is not only reliant on metrics but also on how well a model can be explained when
    something eventually goes wrong. This is known as *model explainability*. Just
    as APM aims at providing ops teams with more visibility into the entire application
    development process, MPM allows those teams to monitor models as they are being
    trained, validated, and deployed. In this chapter, we will discuss the need for
    such a framework before delving deeper into the nuances and stages involved in
    the ML life cycle and how MPM and model explainability fit into it.


    # DevOps and Application Performance Management


    Let’s take a step back and talk about why DevOps and APM came to be and what they
    are.


    # DevOps


    DevOps, or development operations, is a term used to describe the combination
    of cultural practices, business processes, and toolchains that are used to achieve
    rapid iteration and high velocity. The goal is to innovate quickly and catch problems
    and issues as soon as they arise. There are many DevOps frameworks and tools out
    there, and each has its pros and cons, but at the center of it all is an overarching
    philosophy that unifies the practices in some ways across companies and domains.


    One tenet of DevOps is system observability and, in turn, monitoring. Monitoring
    is achieved through the use of metrics and logs that enable us to track what is
    happening inside an application. There are tools that do'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'monitoring, and there are tools that offer full observability, but there is
    no one unified framework that aims at achieving full visibility into application
    systems. Thus, DevOps is often combined with APM.


    # Application Performance Management


    APM provides a framework for monitoring and managing software application performance
    through measuring metrics about the application, with the aim of catching issues
    as soon as they appear, if not before. The exact metrics used can vary, but, with
    applications increasingly moving to the cloud, ensuring that APIs remain performant
    and meet users’ real-time expectations is getting more and more complicated. We
    need to make sure our applications are always available when needed and can handle
    an increase or decrease in load without losing performance.


    Your business might have APIs it serves to customers, or internal APIs for applications
    used by employees. You might also be using an external vendor’s APIs for your
    own business needs. Regardless of the details, you will need to ensure that the
    applications using these APIs are performing with acceptable responsiveness and
    fluidness so that users aren’t left waiting for minutes for a page to load. This
    comes down to how fast the API can respond to user requests. If an API is suddenly
    slowing down, an APM framework will automatically alert the responsible team so
    they can investigate it, find the root cause, and address it. Having full observability
    allows teams to rapidly identify and fix problems before they cause a loss in
    revenue for your business.


    The benefits of APM are:


    # *Broad visibility*


    Prior to the rise of the DevOps tools that we have today, monitoring infrastructure
    was limited in functionality and difficult to use. Software and hardware were
    monitored separately, creating disconnected experiences. APM introduces broad
    visibility across all aspects of the deployment cycle, unified under one framework.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Increased observability


    When monitoring triggers an alert, teams address the problem with a fix. However,
    locating the source can be tedious and repetitive, especially when an alert was
    actually expected rather than a surprise. Going beyond visibility, APM provides
    additional root-cause debugging support, called *observability*. For example,
    with observability, an application’s drop in performance might be attributed to
    a node in the cluster failing to process requests and not a problem with the code
    itself.


    # Clear ownership


    APM enables DevOps engineers to manage the end-to-end life cycle of production
    code through observability and clear ownership. Clarity of ownership allows for
    the designation of specialized individuals who can respond to issues rapidly.


    # Iteration speed


    Ultimately, a streamlined process with clear stakeholders and availability of
    monitoring tools for broad visibility enables your teams to deploy and identify
    and fix issues quickly, thus reducing the time between iterations and maximizing
    the impact of each iteration.


    # Application Performance Metrics


    The typical metrics that are measured for application performance are:


    # API latency


    The amount of time the system takes to perform an action, typically measured in
    milliseconds (ms)


    # Queries per second (QPS)


    The amount of times the API is invoked every second'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'These metrics are vital for an application team to monitor the scale and load
    their application is able to handle. They are also the basis for any automated
    alerts or trigger-based events, such as system failovers, and can feed into an
    automated scale management solution such as cluster resizing or node pool resizing
    (a way of managing the number of computers the API is using to process its requests).
    With cloud computing becoming more and more accessible, companies are migrating
    many of their applications and workloads to the cloud, making monitoring these
    metrics ever more important.


    There might be a day—say, Black Friday—when your systems get flooded with requests,
    causing the application to crash. By simulating such traffic using an APM framework
    and measuring the latency the system will have at any given QPS before the fact,
    your team can capture any issues and design ahead to prevent any failures or performance
    degradations. This is known as load testing and can aid in scaling up systems.


    Real-time streaming data, historical replay, and great visualization tools are
    standard parts of APM solutions today. The popular APM products don’t just offer
    insights into simple statistics but also have API and component integrations that
    are business-ready.


    # The Rise of MLOps


    As applications have started to adopt more advanced decision-making algorithms
    and models, the management and tooling required to ensure high performance has
    become more complicated. With code-centric applications, it’s fairly trivial to
    test whether they are doing what they’re supposed to do. But ML and AI models
    are data-centric, which adds many challenges that traditional DevOps teams are
    not used to dealing with (like ensuring data integrity and validity). This is
    where MLOps comes in.


    Machine learning operations, or MLOps for short, is an amalgamation of cultural
    practices around data and its usage, data science, and tools that all aim at rapidly
    iterating through versions of a model or running experiments rapidly to test different
    hypotheses. MLOps does not exist in isolation from'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'DevOps, and they need to work hand in hand to ensure that all bases are covered
    and that any issues can be addressed and resolved with little effort from your
    teams. We will cover the ML life cycle and some aspects of ML in Chapter 3 of
    this report, but for now let’s look at how MLOps compares to DevOps.


    # MLOps Compared to DevOps


    MLOps and DevOps both come from the same foundations and are focused on rapid
    iteration and continuous improvement. Without frameworks based around these philosophies,
    teams will have a hard time establishing efficient cycles and will yield few fruitful
    results. Both MLOps and DevOps propose validating and testing any system before
    it is released. However, they lack when it comes to observability and monitoring.
    This is where APM shines for DevOps, as it offers full visibility into an application,
    allowing teams to find the root cause of a problem as soon as it becomes apparent.


    ML/AI models are inherently black boxes; data scientists do not always know why
    and how a model works. But this lack of visibility can’t be solved with a one-size-fits-all
    solution, because each model is unique. Therefore, the testing and validation
    you need to perform to properly monitor a model require a lot of planning and
    work.


    # Model Performance Metrics


    There are many different types of machine learning (ML) models, each with its
    own nuances and metrics that it needs to track. ML models are highly data-centric
    and rely on the quality and consistency of the data being fed into them. Here
    are some examples of the sources of complexity in ML models today:


    *Versatility*


    ML serves a wide range of use cases—anti-money laundering, job matching, clinical
    diagnosis, and planetary surveillance, just to name a few.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Architecture


    ML algorithms can take many forms, which are easier or harder to interpret; they
    range from simple logistic regression and decision trees to advanced neural networks
    for deep learning.


    # Variety


    ML models come in many varieties (tabular, time series, text, image, video, and
    audio), and often these modalities are mixed for certain domains, further adding
    to the complexity of tracking the performance of the model.


    # Volume


    The rise of cloud computing has enabled teams to train multiple models with more
    data in parallel, which makes it harder to keep track of the training data.


    Teams must be able to monitor sudden changes in data distributions that might
    lead to bias. Other issues might arise from the model being trained on too little
    or too much data, making it underperform. Tracking all the parameters that can
    affect a model’s performance is much harder than tracking code changes in a repository.


    The metrics often used to track model performance are:


    # Accuracy


    The percentage of total predictions that were actually correct


    # Precision


    The percentage of positive cases that were correctly identified


    # Negative predictive value


    The percentage of negative cases that were correctly identified'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Sensitivity/recall


    The percentage of actual positive cases that are correctly identified


    # Specificity


    The proportion of actual negative cases that are correctly identified


    Using some or all of these metrics, a model can be tracked from offline to online
    and have its performance measured against a simulated baseline. Since different
    models have different types of data and outputs, each will use different forms
    of these metrics. A tool that’s commonly used to visualize them is the confusion
    matrix. Figure 1-1 illustrates this concept using a matrix with binary classification
    (the model only predicts either true or false). If the model has more output classes,
    then this matrix can be scaled to any number of rows and columns to analyze all
    the classes that are underperforming.


    Using this matrix, we can see that:


    +   - Accuracy = TP + TN / (TP + TN + FP + FN)

    +   - Precision = TP / (TP + FP)

    +   - Recall = TP / (TP + FN)


    Although these metrics can offer a good measure of the performance of a model,
    it is not always possible to determine the “true” values of the predictions once
    a model is deployed. In production situations, models are often measured in relation
    to the business outcome they are trying to achieve. For example, a marketing model
    aimed at targeted emails might be measured by how many of the emails result in
    a purchase. In this scenario, the model is not measured by accuracy but by the
    business outcome it is able to achieve. We will go into more detail about all
    of these metrics in later chapters.'
  merge: -1
  img_proc: true

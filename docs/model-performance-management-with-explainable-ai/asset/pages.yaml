- pgno: 38
  md: 'Figure 3-1. Three types of data analytics


    To take this a step further, a machine learning model can be built to predict
    outcomes of certain situations, also known as predictive analytics. This usually
    follows on from descriptive analysis, where a specific scenario can be modeled
    and the inputs can be mapped to create a virtual representation of that one real-world
    scenario in order to predict a certain output. Future outcomes can be predicted
    based on the incoming data at any point in time. Any previously unseen scenarios
    might not be able to be predicted accurately, though, and this is one shortcoming
    of machine learning today. This is also why MPM is crucial for staying on top
    of changes in the data or the model.


    The final form of analytics is known as prescriptive analytics, and it is the
    least commonly used as it is the most difficult to implement. However, it potentially
    provides the most value to your business. A prescriptive model will provide a
    prescription for a set of actions in order to achieve a desired outcome or target.
    Such models can be used to automate decisions or improve customer experiences,
    and they usually require multiple inputs to provide a prescription. Think of a
    scenario with multiple steps, where the prescriptive model tells you what to do
    at every step of the way. Depending on the outcome at each stage, the model can
    readjust and predict a new optimal path.


    # Life Cycle Stages


    Now that you understand the different types of analytics to which machine learning
    can be applied, let’s tie this back to the machine learning life cycle and MPM.
    Figure 3-2 illustrates the different stages of the ML life cycle when it is applied
    to a new problem. Note that different models involve varying levels of complexity
    and might not need to go through all of these steps.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/67dbd3f08ade4e35edf8f6d7240af081_39_0.png)


    Figure 3-2. The stages in the ML life cycle


    As you can see, there are nine stages, which can be summarized as:


    +   1. Problem definition

    +   2. Data collection'
  merge: -1
  img_proc: true
- pgno: 40
  md: '+   3. Data processing and storage

    +   4. Metrics definition

    +   5. Data exploration and analysis

    +   6. Feature extraction and engineering

    +   7. Model training and offline evaluation

    +   8. Model integration and deployment

    +   9. Model release and monitoring


    The life cycle starts when a problem is identified, and then it feeds back into
    itself. This is the iterative nature of model development at play. Once you or
    your team have been through this cycle a few times, the data that needs to be
    analyzed or collected might already be available, and it may be possible to skip
    some steps. The cycle repeats itself to keep up with constantly changing data
    and requirements. As we’ll see, MPM closes the loop between the training, deployment,
    and monitoring of a machine learning model and can aid in detecting these changes
    and drifts and enable your teams to rapidly iterate.


    Before we consider how it fits in, let’s look at each stage of the ML life cycle
    in a little more detail.


    # Problem Definition


    The very first stage in any machine learning model’s life cycle is identifying
    and defining the problem it aims to solve. This problem can come in many forms
    and may be related to internal or external stakeholders’ interests or needs. The
    problem needs to be defined with enough detail to be able to be understood by
    your engineering and data science teams. Something like “customers are not happy”
    is not a well-defined problem, but something like “customers have been having
    difficulty locating items they recently viewed” is. Depending on the goal of your
    team or company, the problem can be as simple as improving team collaboration'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'or as complicated as predicting customer churn and prescribing actions to avoid
    it.


    Let’s consider an example problem in which we can follow through the different
    stages of the ML life cycle. Suppose you are the owner of an ecommerce startup
    and realize that you have no insight into what customers are doing on your site
    other than your bottom line and maybe some basic traffic metrics. You notice a
    dip in overall year-on-year sales, and you think it would be a good idea to check
    out any feedback customers have provided. You see a lot of comments from users
    saying that it’s not easy for them to find products they’ve viewed recently, and
    that it would be nice to have some sort of recommendations based on the products
    they are viewing to help them find other relevant items easily. So the problem
    is that your company is experiencing a drop in sales due to a lack of user tracking
    and intelligent features. You think to yourself, “This can’t be that hard. I’ll
    just ask my team to integrate this into the application.”


    At this point, you go to your team and ask them what needs to be done in order
    to understand customers’ behavior better and offer them a better experience through
    recommendations and personalization. They say they need more data in order to
    give you insights and build models to improve the customer experience, with the
    hopes of increasing sales. This is where data collection comes in.


    # Data Collection


    Now that you have defined the problem and identified the data you need to collect,
    it’s time to implement all the necessary pieces to start collecting, processing,
    and storing the data. Before beginning to collect any data, it is important to
    set some policies around how the data will be used, who will have access, and
    what parts of the data will be accessible. This is usually the role of a CIO or
    a data governance officer. These policies will need to be transparent in order
    to instill confidence in your users about how their personal data is being used
    by your business.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Your data collection and privacy policies might include a mandate to obfuscate
    any personally identifying information (PII) so it is not visible to the analytics
    teams, or to only allow access to production data to privileged users such as
    team leaders or directors. Once all the policies are in place, the necessary tools
    can be selected and implemented in order to begin collecting the data for analysis
    and modeling. This will usually involve some changes to the application, such
    as adding frontend and backend components to track what your users are doing or
    adding functionality to use any future models into the workflow or website (such
    as the ability to identify a user using a stored cookie or other unique identifier).


    Let’s go back to the example of the ecommerce startup. Your team now needs to
    implement a frontend tracker that sends an event to a backend service whenever
    a user performs some action on the site. This might be a search, a click on a
    product, or a click away from the site. No matter what the user is doing, it should
    be possible to track and store that information. A cookie can be stored on the
    user’s browser in order to track the same user across multiple events on the backend.


    Let’s say, for the sake of this example, that there are an average of 100 people
    online at any given second of the day clicking through your website or app. That
    would mean you would have to process and store around 100 events every second.
    Assuming each event is about 10 KB in size, the traffic would generate 10 × 100
    = 1 MB of data every second. Given that there are 86,400 seconds in a day, this
    would mean you would need to process 1 × 86,400 = 86.4 GB every single day. If
    you tried to store that in an Excel file on your computer, you would probably
    run out of space within a week. You can see how that amount of data can easily
    add up and become harder and harder to manage. This is where data processing and
    storage solutions come into play, bringing the power and scalability of the cloud
    into your grasp.


    # Data Processing and Storage


    You may have heard of the terms “data warehouse” or “data lake”—these are examples
    of data storage solutions. A data warehouse is a structured'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'store of data (think of an SQL database), while a data lake is an unstructured
    file store, usually in the form of a filesystem-like service called blob storage.
    Data warehouses are used for analytical purposes such as sales reporting. The
    incoming data might be unstructured but will be converted into a structured form
    that is then stored in the data warehouse. Data lakes are useful for storing files
    such as images or raw text files that can be used as part of a machine learning
    pipeline.


    In order to process large amounts of data, or “big data” as it is colloquially
    known, cloud computing tools such as batch or stream processing frameworks can
    be used to ingest the data into the warehouse or lake. *Batch processing* is when
    data is processed in batches at regular intervals or based on the batch size (think
    baking cookies in an oven that can only fit 10 cookies at once). *Stream processing*
    is when data is processed as it comes in and is usually implemented in cases where
    data needs to be analyzed in real time (think cookies cooking on a conveyor belt
    for mass production). A variant of stream processing is microbatch processing,
    where events are processed in small batches at very short intervals (say, every
    few seconds).


    There are two common patterns for data ingestion for stream and batch processing:
    Extract, Transform, Load (ETL) and Extract, Load, Transform (ELT). In ETL, the
    data is transformed in flight (a common pattern in stream processing systems)
    and then loaded into its final resting place, either a data warehouse or a data
    lake. ELT, on the other hand, favors loading the data in its raw form and then
    using built-in or third-party tools, transforming it, and inserting it into its
    final location.


    Depending on your requirements and the speed at which the data will need to be
    used, both ETL and ELT can be used. Loading the data in its raw form will preserve
    it in case there are any errors in the transformation. Some data might not need
    to be aggregated or analyzed in real time, while other types of data might need
    to be aggregated or analyzed in real time for tracking or compliance reasons.
    (Having redundancy doesn’t hurt in the world of data; you could always use both
    approaches for the same data.)'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Let’s tie this back to our ecommerce example. You have around 1 MB of data
    being ingested every second, and around 86 GB each day. To handle this, you’ll
    need an ETL or ELT processing system (or a combination of both!) with some sort
    of obfuscation (removing any personal information) and some data quality checks.
    Any data that fails the check should be forked to another location for analysis
    or reprocessing. Once the good data has been processed and stored, it is ready
    for analysis, exploration, and (the exciting part) building some machine learning
    models!


    Data that is processed in real time can feed into an analytics engine for the
    data science and analytics teams to consume. Data that is aggregated from the
    raw data every few hours, days, or weeks can be used by the business to track
    overall health and the key performance indicators (KPIs) of the different lines
    of business. But before you start doing all that, you should probably define some
    requirements for any analyses and potential models that are going to be built
    or developed by your team.


    # Metrics Definition


    Now that you have started collecting data in order to better understand your business
    or problem, let’s talk about the requirements for metrics. It is good practice
    to prepare for any unforeseen circumstances by defining good metrics early on.
    These metrics might also serve as the accuracy or performance measures for any
    models that will get deployed to production. This will not only aid in selecting
    which models to deploy and which to shelve, but also serve as a way for you and
    your team to compare different models against each other. They provide the basis
    for any benchmark or evaluation, and can come in the form of business metrics
    such as revenue or customer satisfaction (usually based on survey scores) or technical
    metrics such as model accuracy. Depending on your use case, you should spend some
    time with your team early on defining these metrics to help everyone align on
    the goals of the analysis or model.


    To tie this to the ecommerce example, let’s recall the problem at hand. You noticed
    a dip in total sales due to some customer experience features that were missing.
    Any model that is built with the intention of improving the'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'customer experience should in turn hopefully lead to more sales as well. Using
    this as a metric to track any model changes can be a good proxy to measuring how
    well customers are responding to new models. This is a useful business metric,
    but it does not help your team develop the model offline (they can’t tell which
    model will lead to more sales).


    To remedy this, another requirement would be to have the ability to measure the
    accuracy of a recommendations engine. This could be used to predict how likely
    a user would be to click on any product that would be recommended to them if there
    were a recommendations engine present. This is a good metric to use offline: your
    team can study real user flows and measure how many of your users would be helped
    by the introduction of a recommendations or personalization model. This is a technical
    metric that can aid in developing and evaluating the model offline before it is
    deployed and the sales generation can be measured.


    # Data Exploration


    Now that there are some metrics for the business side and your technical team,
    it’s time to start exploring the data. It is also possible at this stage to start
    developing hypotheses for predictive or prescriptive models that can validate
    or invalidate the possibility of using the collected data for a given model. This
    is usually done by subject matter experts, such as specialized data analysts or
    data scientists, and relationships between different data points can be mapped
    to create a better picture of the system.


    During this stage of the life cycle, it is usually descriptive analytics that
    is the most useful, as it is easier to translate findings from the technical side
    to the business side this way (think dashboards and reports). Reports can be generated
    to understand different types of data groups (such as customer types) and their
    intrinsic characteristics. Descriptive analytics can also be used to inform areas
    of improvement that can be addressed by a machine learning model that understands
    the domain and can eventually evolve from descriptions to making predictions or
    even offering prescribed actions.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'In the context of our ecommerce startup, to show users items they have recently
    viewed, the data for each user can be looked up based on their identifier. Once
    you understand what a few users are doing individually, you can try to create
    relationships between different users to draw out some patterns.


    You can generate user *personas* for the different types of users that are using
    your site based on the products they are looking at and buying, as well as other
    features (such as frequency and location, to name a few). This information can
    then be used to provide more tailored experiences to different users. The term
    “features” here is used to describe a feature of a person shopping on the site,
    and in the context of an ML model, it means almost the same thing. A model feature
    is a data point that is known to the model at the time it is trained and can be
    used to represent how the input to the model would look at the time of making
    a prediction. (Think of knowing the persona of a new user—that’s not possible,
    so would this be a good feature for a model?) This brings us to the next step,
    feature extraction and engineering.


    # Feature Extraction and Engineering


    The features that are fed into the machine learning model (user personas, for
    example) can be selected by the data science team according to the inherent nature
    of the domain, or they can be automatically generated by some optimization that
    aims at maximizing a set target outcome (such as accuracy or performance). This
    is the role of feature selection, extraction, and engineering.


    Once you’ve identified the features and/or targets, the next step is to set up
    an automatic way to generate these features and store them. This can be done in
    real time, as the data is coming in, or retroactively in batches every few hours,
    days, or weeks. It depends on what your domain is and what cadence makes sense
    for the type of model being used. If the feature is the average monthly spend
    of a customer type, then it only makes sense to generate that feature once every
    month. If, however, you want to see the daily spend, then this feature would need
    to be extracted once a day.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Features are usually the inputs to the machine learning model, and depending
    on how complex your system is, you might have a handful (say, 5–10) or an incomprehensible
    amount (say, a few million) of different types of features.


    As described in the previous chapter, these features may be known up front, or
    they might be determined by the model itself and require some explanation or interpretation
    after the model is trained. No matter how complex or simple your model is, you
    will need to train and evaluate different hypotheses to produce the best possible
    model. With advanced models, like deep neural networks, the features might be
    images with labels, or bodies of text with some tags. These are fed into the model
    in order to show it some examples so it can form an understanding of the system.
    The model can use the examples provided to select the best features that identify
    what the target label is. Think of a model that is identifying cats in pictures,
    where the shape of the ears can be picked up as an identifying feature. This is
    where model training and offline evaluation come in and can help in building models
    that will hopefully make it into production one day.


    # Model Training and Offline Evaluation


    Once you understand your data (for the most part) and have some features that
    represent your system, you can build and evaluate some models that can help you
    predict outcomes or analyze data. For this, you’ll need to set up a collaborative
    environment where your data science and analytics teams can work together to create
    the best possible models.


    The first step in model training is to split your data into two sets, for training
    and testing (80/20 and 70/30 are common train/test split ratios). This can be
    done by randomly separating out some of the data into a test set that the model
    will not see during training, but that has the target outputs labeled to allow
    you to measure the model’s performance. The target can be in the form of a label
    or a prediction. Once the training and test sets are ready to go, you can start
    training models and evaluating them against the test set. The metrics defined
    in the requirements stage can be used to'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'compare the performance of different models or frameworks. Generating multiple
    training and test splits, which is commonly referred to as *cross-validation*,
    can help in testing for model sensitivity or identifying bias in the model that
    may arise from over- or underrepresented data. Once a stable model with desirable
    results is developed offline, it can move on to integration and deployment.


    Let’s take the example of building a recommendation system model for our hypothetical
    ecommerce startup. A recommendation system is usually a banner that sits somewhere
    on the page (or along the user journey) that shows other products the user might
    be interested in or has recently viewed, or that others have also looked at or
    bought. A common method used to create a recommendation system is collaborative
    filtering—without going into too much detail, this method works by creating a
    sort of hive mind that can understand patterns and relationships between different
    items listed on the website based on users’ behaviors.


    For simplicity, let’s assume there are only three products (A, B, and C) listed
    and only two customers (1 and 2) shopping. If customer 1 looks at products A and
    B but customer 2 only looks at B, then customer 2 will be recommended product
    A because customer 1 also looked at A. Now if customer 2 also looks at product
    C, then customer 1 will be recommended product C as well. You can see how slowly,
    with a few million users and a few hundred or even thousand products, the model
    would start to understand what products are intrinsically related based on user
    behavior alone.


    Going back to our ecommerce example, using the data we have collected from users
    so far, we can split the users into a training set and a test set. The model can
    be trained on the training set and evaluated against the test set based on how
    many of the items that would be recommended were actually actioned on by that
    user. Using this benchmark, the model can be trained and tuned in order to achieve
    a desirable level of accuracy. As mentioned earlier, not all metrics can be evaluated
    offline (in this case, sales generation, for example) and some will need to be
    live tested, which is'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'usually done through an A/B test or a champion/challenger test. That means
    moving on to the model integration and deployment stage.


    # Model Integration and Deployment


    Once a model has been developed and evaluated against offline metrics to show
    its viability, it will need to be integrated or deployed into your application,
    workflow, or website. Integration involves adding code or support for the model
    to operate within your website, application, or workflow. Deployment involves
    launching the model in a state where it is ready to be released. Depending on
    the architecture of your system and where the model will be called from (edge
    versus cloud, for example), the specifics of how this is done may vary. This integration
    and deployment process might also be referred to as a continuous integration/continuous
    deployment (CI/CD) pipeline in some contexts.


    In some cases model integration and deployment is as easy as merging a pull request
    (CI) into a branch on a repository, which will then trigger a deployment job (CD)
    contingent on some automated tests passing. It can also be as easy as pushing
    a button in your cloud provider or service provider’s console (e.g., AWS SageMaker
    or Google AI Platform) that will update the parameters or version number through
    a UI. In other cases, however, model deployment might involve releasing new versions
    of software to your users or device fleet. If downloads aren’t automatic, then
    some users might be left out of the updates until they decide to update the application
    manually on their devices.


    Let’s take a look at how we would integrate and deploy the shiny new recommendation
    system we just built for our ecommerce startup example. First we would need to
    add support for our frontend to talk to the model on the backend. We would also
    need a mechanism to split traffic between users to allow for an A/B test or a
    challenger/champion experiment. We would need to test whether having a recommendations
    banner would help increase sales or even just user views of items. Once we have
    the integration ready, we can deploy our model and stage it for release and monitoring,
    which is the final stage of the journey to production.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Model Release and Monitoring


    After a model has been integrated and deployed, it can be released and monitored.
    The release process might involve changing its configuration to point to the latest
    deployment of the model or simply pushing a button to update to that version.
    However complex or simple this process is, it should be done by someone who has
    the authority and responsibility to perform this task.


    After a machine learning model is released, there is no guarantee that the underlying
    system it is representing isn’t going to change or there isn’t going to be new
    behavior that needs to be accounted for. This is where monitoring comes in and
    ties in to MPM. MPM can offer a lot of insight into how models are performing
    and which models need to be updated. The model version, parameters, and target
    user base can all be modified during the release stage according to the identified
    splits in the previous stages. Since the model can target different groups for
    experimentation, monitoring can be applied to these different sets, based on their
    identifiers, in order to monitor the performance across each. Experimentation
    can help validate or invalidate certain theories your subject matter experts might
    have about your domain.


    Let’s say you were looking to increase the sales in your organization and wanted
    to test out different models to see which would generate the most profit. Monitoring
    would be the most important part of that experiment, as it would aid in tracking
    the different models and how the users are reacting to them.


    To close off the life cycle of ML models, let’s talk about what happens once you
    have the recommendation system on your ecommerce site. Once the model is released
    to a portion of the users, you start to notice that the users with the recommendations
    banner are interacting with the website a lot more and in turn end up buying more
    products as a percentage of their group. This is great news! You have validated
    that a recommendation system would increase your sales.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'But the journey isn’t over yet. Now it’s time to roll out the model to everyone
    else and start thinking about a better version—perhaps a version 2.0 that challenges
    this model or maybe a version that is a little more personalized, say, using deep
    neural networks. Multiple parallel iterations of this life cycle can be occurring
    at any given time, and this is a good sign of a healthy data-driven organization.


    # How MPM Fits into the Life Cycle


    Let’s close this chapter by discussing where MPM fits into the ML life cycle and
    what it can and can’t do. MPM is a philosophy and a set of tools and frameworks
    (analogous to APM within DevOps) that aims at measuring models in terms of their
    performance. The management comes in the form of intervention, such as a new model
    being built, or a model being decommissioned and sent to the model graveyard.
    As shown in Figure 3-3, MPM starts at either stage 6 or stage 7 of the ML life
    cycle, depending on whether the features are relevant to the model’s performance
    or not. As mentioned in the “Data Processing and Storage” subsection, any data
    quality issues should be captured long before the data gets to the model training
    stage.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/67dbd3f08ade4e35edf8f6d7240af081_52_0.png)


    Figure 3-3. The stages in the ML life cycle


    If the data being used to predict an outcome is causing issues in the model, then
    MPM suggests that the incoming data be stored for the team to analyze'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'and dig deeper. This analysis might include considering parameters such as
    who the user or caller of the model was, what the input data was, and what the
    model predicted. Using XAI techniques, the model can be explained to understand
    any undesirable behavior in order to fix or correct it.


    Undesirable model performance would usually originate at the user level, where
    a bug or issue is flagged by your QA team or automatically detected. Once this
    happens, the team in charge of the model may need to escalate and fix the issue,
    depending on how mission critical it is. If the issue does not appear to originate
    with the model, they can trace the path back up the pipeline until the issue is
    detected and resolved. If the problem happens to be that the model is out of date
    or is not accounting for new data types, then it might be necessary to retrain
    or update the model. As more and more models start making their way into production,
    you can see how it gets harder and harder to manage and monitor them.


    Having an MPM solution in place can help with monitoring and tracking model performance,
    and it gives you almost full observability into your models out in the wild. Combining
    MPM with the previously discussed XAI gives you a full picture of what is going
    on with your models and why. This will never replace the know-how and expertise
    of subject matter experts, but it can serve as a useful tool to help them manage
    models efficiently at scale and help you ensure your models are built responsibly.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Chapter 4. MPM in the ML Life Cycle


    MPM serves as the glue that binds the model training, deployment, and monitoring
    stages together. Without an MPM process or system in place, your team will have
    a hard time finding the root cause of model performance issues. Whether the problem
    is caused by bad data or by the model being out of date, your team should be able
    to pinpoint its source. In this chapter, we’ll look at how MPM can help provide
    full visibility into any issues that may arise when training, deploying, and monitoring
    models.


    # The ML Feedback Loop


    The machine learning life cycle is cyclic, due to the ever-changing nature of
    the world. Since models serve as general representations of real-world situations
    or scenarios, they need to constantly be monitored and updated to deal with new
    or previously unseen data and circumstances. *Closing the feedback loop* is a
    concept taken from control theory where the expected outputs and measured outputs
    of a system are compared in order to tune the system’s performance and achieve
    optimal results with minimal or zero error. To explore this concept further, let’s
    first take a quick look at what control theory is.


    # Brief on Control Theory


    Control theory is about the control of dynamic (engineered) systems, typically
    using feedback mechanisms, in order to achieve optimality. Optimality is based
    on the context of the system being controlled and can be deterministic and exact
    or within a margin of acceptable error. There are two types of controllers, open
    loop and closed loop. To relate this to MPM, the expected outputs and metrics
    of a model need to be tracked with their'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'actual outputs and metrics over time to ensure that the model is achieving
    optimal results.


    MPM closes the loop of outputs in order to correct any errors in the future and
    maintain a state of optimality (something we will discuss later in this chapter).
    Often in control systems, the analysis is done in the frequency domain as opposed
    to the time domain. This means that instead of analyzing when something happened,
    a control system analyzes how often and how intensely something happens. Model
    error is a good thing to measure, as it can show how often something is not going
    as expected rather than when this is occurring. This measurement helps in pinpointing
    the highest-priority issues to fix (i.e., those that have the highest impact on
    your business).


    # Open-loop versus closed-loop controllers


    An open-loop controller is one that does not rely on the measured output for regular
    operation. This is the case in highly predictable systems that have a discrete
    set of outputs based on the inputs. Looking at Figure 4-1, we can see how the
    flow of inputs to outputs is linear and easy to follow.


    ![](img/67dbd3f08ade4e35edf8f6d7240af081_55_0.png)


    Figure 4-1. An open-loop controller


    Think of the timer on a microwave that heats up food. It only knows how long it
    needs to go for and has no need to detect the temperature of whatever’s inside
    it to adjust that time. The reference here would be the time the food needs to
    be heated for, and the system input would be to turn on or keep on the microwave
    based on how much time is left. Once the reference signal runs out (the timer
    ends), the controller will turn off the microwave.


    A closed-loop controller, as can be seen in Figure 4-2, is one where the system
    relies on the output to achieve its desired state. The reference signal'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'and the measured output are compared in order to tune the controller’s output
    (which would be the system input) and try to minimize the error between the reference
    and the measured output. An error function is used to compare the two signals,
    and it sends the error as an input into the controller. The controller then, using
    its internal model, tweaks the system inputs to try and achieve the desired output.


    ![](img/67dbd3f08ade4e35edf8f6d7240af081_56_0.png)


    Figure 4-2. A closed-loop controller


    In Figure 4-3 we see an example of a closed-loop controller: the power steering
    system on a car. The desired direction of the car is implied by the direction
    the steering wheel is being turned in, and any undesired resistance is given as
    feedback to the user in the form of the steering wheel rotating in the direction
    of the undesired motion. The controller has an internal model mapping the rotational
    distance of the steering wheel to the desired direction of the wheels to turn
    the car.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '![](img/67dbd3f08ade4e35edf8f6d7240af081_57_0.png)


    Figure 4-3. A closed-loop controller in a car’s power steering system


    There might be some background noise that causes the steering wheel to turn without
    any input from the driver, maybe due to a bump or a hole in the road. The power
    steering system receives the reference signal (in this case, the rotation of the
    steering wheel by the driver) as well as signals from sensors in the car (the
    measured output) and uses these to determine how to steer the car to achieve the
    user’s desired result, as well as to return some feedback to the driver in case
    any undesired movement is detected.


    # Control Theory and MPM


    Similar to how control theory operates on feedback using sensors, MPM acts as
    a feedback mechanism for your ML system. In the context of machine learning, the
    sensor in charge of giving feedback to your ML team is the MPM framework that
    is tracking the outputs of the model. The user (or human-in-the-loop) is the data
    scientist or ML engineer constantly monitoring and trying to update the model.
    The feedback is all the data collected from the model, as well as some metadata.
    The error function'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'would be part of the MPM system that can flag any errors based on the reference
    inputs from the team or system. If the error function shows that the model is
    producing undesirable results, the ML system can then be investigated with the
    aim of improving the performance.


    Thinking of the machine learning life cycle as a dynamic system allows us to understand
    the need for closing the feedback loop and tracking error (divergence from the
    desired references). References in the machine learning world are often the target
    labels used for training the model, which might not exist in incoming data since
    the expected prediction of the model is not known at the time of the prediction.
    Tracking the frequency of changes, as well as deviations in the model’s output,
    might help reveal any model drift or data drift issues. These can then trigger
    the team to investigate and try to correct the error in the system. Often this
    process of validating the model’s performance relies on some user input, such
    as ground truth labels or expected outputs. This validation process can be achieved
    through sampling a small set of the data and applying these labels, then comparing
    the output of the model to this expectation or ground truth.


    # MPM in the Training and Deployment Stage


    Now that you understand what model performance is, let’s talk about how MPM fits
    into the ML life cycle stages and offers an easy way to manage processes to continuously
    monitor and improve model performance. MPM can start at the time the features
    are being extracted or engineered, or it can start at the moment the model is
    trained. This depends on the complexity of the input data and the effect of data
    drift on the model’s performance: a model that has very few inputs that rarely
    deviate from the norm would not need its features tracked since the inputs will
    always be predictable and have a low risk, whereas a complex model with multiple
    inputs that are completely variable and can change over time would need to be
    tracked.


    # Using XAI to Understand Model Bias'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'During the training stage of a model, bias might be hard to detect or prevent
    without trying to understand how the model might behave with inherent bias. In
    order to mitigate possible bias, XAI (discussed in Chapter 2) can be used to explain
    why results might be biased to a certain subset of the data. This can be caused
    by unbalanced training data or by the model being set up with inherent bias. Detecting
    unbalanced training data can be done by analyzing the distribution of the different
    labels and input data points to detect any underrepresented or overrepresented
    data. The data can then be undersampled or oversampled in order to reduce or eliminate
    any bias. If, however, the bias occurs due to the model itself being biased, this
    would show up through testing the model and using XAI to understand the model’s
    predictions.


    Once the bias has been reduced to a negligible amount or eliminated completely,
    the candidate models can then be evaluated against the target labels to find the
    best one to release. Sometimes the best-performing model is also the most biased,
    and using XAI in conjunction with MPM is key to detecting these issues early on.
    (When you develop models that are not sensitive to bias, of course, you do not
    need to worry as much about detecting bias.)


    # Choosing the Best Model to Release


    Choosing which model to integrate into your application or workflow and release
    to your users after optimizing performance and dealing with bias might be the
    most difficult decision, as models can sometimes be unpredictable, and any unpredictable
    behavior may translate to business risk and possible liability (depending on your
    line of business). The best-performing model offline might not prove to be the
    best-performing model online. This can be due to a high level of sensitivity—any
    model that you choose to release should therefore be analyzed for its sensitivity
    both to the training data and any unseen prediction data. As discussed already,
    this is done through splitting the historic data into training and test splits,
    where the test set is not seen by the model during training, but the expected
    prediction is stored alongside the test data.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Once a model is deemed to be ready for production, it can be versioned, integrated,
    and released. This versioning will help with many downstream analytics dependent
    on tracking the lineage of the model as well as its outputs. Any discrepancies
    between the model in offline and online environments can then be identified, and
    the performance of the model can be optimized to achieve the desired results.


    # MPM in the Release and Monitoring Stage


    After a model has been approved for release, there are a number of measures to
    take to ensure that it can be confidently rolled out to all your users. MPM suggests
    that the model log all its predictions and input data alongside the model version
    and other metadata to allow the team to monitor it. Any issues that happen in
    the model can be detected by tracking the predictions being made and whether they
    begin to deviate far enough from the norm to trigger an investigation (known as
    model drift), and the root cause can be investigated using XAI. Models can also
    be compared in a live setting (known as A/B testing or challenger/champion testing).
    More advanced models might need to have more than two variations compared in order
    to ensure the highest-performing model is promoted; this form of testing is called
    multivariate testing.


    # Detecting Model Drift


    Model drift occurs when the data feeding into the model begins to change or deviate
    from what the model expects, resulting in changes in the model output. When this
    occurs, it might be hard to detect since the model outputs are not usually stored
    alongside some metadata for analysis. Using an MPM system or process ensures that
    the model outputs are stored and accessible by your data science or operations
    teams. On an average day, the expectations of distributions across the different
    input groups should be within an acceptable margin of error. If these values begin
    to deviate over time, the analysis of the outputs can show any drift and allow
    your team to pinpoint and fix any issues.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'One issue might be that the model needs to be seasonally updated due to the
    seasonality of your business. Another case would be that the model itself was
    not trained to account for all scenarios and is therefore producing unexpected
    outputs for unseen data. This can be caused from underrepresentation or overrepresentation
    of certain subsets of the data. To remedy this, your team can add in paths for
    unseen data, such as triggering a customer support ticket or referring the user
    to documentation in order to try to remedy the problem. Whether the issue is detected
    by the system or by users contacting your support team, the MPM system can be
    used to replay and analyze the predictions in order to update the model to remedy
    the issue.


    # Finding the Root Cause Using MPM and XAI


    Once an issue has been identified by either the MPM system, a customer, or your
    QA team, it’s time to find the root cause and address it. Your team might be tempted
    to hastily attempt to remedy the issue by applying a quick fix or patch at the
    application layer without looking into the black box that is the machine learning
    model. But using MPM, they can identify and fix the root cause of the problem
    by isolating the issue and determining an appropriate remedy that has no impact
    on other parts of your system.


    In order to mitigate the risk of customer satisfaction or compliance issues, your
    team can test out changes or fixes on a small portion of the data, or replay the
    past few days’ worth of live data in a simulated environment to check if the changes
    would have resulted in the expected behavior. Without an MPM system to store all
    the predictions alongside the metadata, it would be hard to replay data and run
    historical tests on any patches or fixes. Once the fixes have been validated on
    historical data, they can be released to your users. In order to mitigate any
    unforeseen risk, the model can be released to a small portion of your users first,
    and the results can be monitored to ensure the fix is safe to roll out to the
    rest of your users.


    # Live Experiments'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Validating whether a new model (or an updated model) is going to accomplish
    the desired outcomes might be hard to achieve without mechanisms to mitigate unforeseen
    risk. There are many methods you can use to identify potential issues or defects
    early on in the process. Private testers or QA teams can capture these issues
    and log them for your engineering teams to address. No process is 100% perfect,
    though, and there will always be unknowns. So, to further mitigate risks, live
    experimentation can be done to minimize any damage by targeting specific subsets
    of incoming data for the new model to receive. By splitting the data in this way,
    the person tracking the experiment can monitor the results to validate any hypotheses
    or fixes that might have been applied. Once the model is validated on a small
    portion of the data, the ratio can be increased, either straight to 100% or gradually
    in order to account for edge cases or low-volume data points.


    # Random sampling versus targeted splitting


    When conducting an experiment, it is important to keep in mind the data split
    that will be done in order to achieve the desired ratios. Sometimes you might
    need to validate that a very specific edge case has been fixed and that this fix
    does not cause any other issues. In these cases, you might want to target the
    fix for the users that fit into that edge case and validate that it works before
    going on to validate that it does not cause any issues for other users. Random
    sampling can be used for testing all users by ensuring an even split of samples
    across the two (or more) experiment targets.


    There are many methods to randomly split data to ensure no biased targets occur.
    A common method is to use a hash of non-identifying fields in the data (metadata)
    and randomly split that set of hashes into target groups. Since the data being
    used to generate the hash is not unique to that row, the samples will be randomly
    distributed across the groups. This ensures that the “randomness” of the selection
    process for the target groups contains no bias toward selecting one specific group
    over the other based on any of its identifying features. This method applies to
    cases where the individual predictions are not related to a specific user, but
    sometimes you might want to split the users into groups.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'If you want to target users rather than data points, you can first assign a
    random universally unique identifier (UUID) to each user and then sample the IDs
    using the same method as mentioned previously. You might need to generate these
    UUIDs for each user, or you might be able to use an existing field (e.g., a user
    ID field). In either case, these IDs are usually stored on the user’s device or
    attached to their login information in order to better track the performance of
    the different models across the different target user groups.


    # A/B testing


    Now that we’ve seen how the models can be split into target groups, let’s talk
    about the simplest type of live experiment we can perform: the A/B test or challenger/champion
    test. The A and B in A/B testing just refer to two models; they can be two completely
    different models or slightly modified versions of the same model. In either case,
    there is usually one model that is already in production (assuming this isn’t
    the first experiment you are running), which would be the champion in a challenger/champion
    test. The challenger is tasked with outperforming the champion and talking over
    its role as the champion model. Once a challenger that has been shown to be superior
    to the champion is promoted to that role, it awaits challenges from future models.


    # Multivariate testing


    Sometimes you might have many different variables that need to be tested at the
    same time, or many different variations of models that you want to experiment
    with. In these cases, you’ll need to have multiple target groups vying for the
    glory of champion. Once the different groups and variables have been released,
    without an MPM system in place that is keeping track of all the different things
    happening at the same time, it might become extremely hard to analyze the results.
    Ensuring that the MPM system also tracks the metadata of each model version, as
    well as the users’ UUIDs, becomes a full stack effort requiring the integration
    of these metric trackers into your application or system.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Chapter 5. Implementing MPM in Practice


    Closing the feedback loop of ML using MPM is an important step in ensuring constant
    monitoring and improvement of your AI systems. There are a number of methods or
    tools that can be used to implement an MPM system or framework to achieve this
    in practice. Before we look at the different options, let’s start by discussing
    what makes a good MPM framework.


    # Model Performance in Staging Versus Production (Offline Versus Online)


    As illustrated in Figure 5-1, MPM serves as a way to ensure that you have full
    visibility into your model and that any predictions it makes are stored along
    with the input data and the model version. This allows you to replay the predictions
    later in order to try and fix any performance issues, possibly using XAI to help
    understand them.'
  merge: -1
  img_proc: true

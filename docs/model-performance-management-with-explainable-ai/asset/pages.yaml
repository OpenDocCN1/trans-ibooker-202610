- pgno: 71
  md: '# Chapter 6. MPM and Responsible AI


    One of the reasons that many companies are now considering MPM solutions is that
    it helps them get to an important end goal: not just implementing AI systems that
    are high quality and drive the bottom line of the business, but doing so *responsibly*.
    [According to Accenture](According to Accenture), corporate social responsibility
    and ethics are increasingly important to consumers— and if that isn’t enough,
    companies worldwide face a growing landscape of regulations around how AI can
    be implemented and used. But what is “Responsible AI,” and how can MPM help? Let’s
    take a look.


    # What Is Responsible AI?


    Responsible AI is the practice of building AI that is *transparent*, *accountable*,
    *ethical*, and *reliable*. When AI is developed responsibly, stakeholders have
    insight into how decisions are made by the AI system, and the system is governable
    and auditable through human oversight. As a result, outcomes are fair to end users,
    stakeholders have visibility into the AI post-deployment, and the AI system continuously
    performs as expected in production.


    Transparency ensures that stakeholders have visibility into what the AI system
    is doing. They understand the “why” behind the decisions and predictions made,
    and build systems with privacy and security built in. Accountability provides
    much-needed checks and balances for AI systems with guardrails, guidelines, and
    governance frameworks in place. Most importantly, there is human oversight and
    the ability to override decisions where needed. Ethics broadly refers to ensuring
    that AI is doing well by all impacted, with a focus on fairness and inclusion.
    Reliability is one of the'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'most important principles because it is what ensures that responsible models
    are maintained over time, continuously.


    # The Challenges of Responsible AI


    Why aren’t our existing practices for software development sufficient for deploying
    AI systems responsibly in production?


    The reason is that AI systems are not like traditional software. With normal software,
    you develop to a specification, run tests, and rest assured that your program
    will not suddenly change its behavior. Furthermore, you can document, inspect,
    and debug how the software is working and what leads it to return a certain result.


    AI systems are different. They are based on data, which is constantly changing.
    The production data that the model sees might look very different from its training
    data, causing its predictions to miss the mark. And AI systems are much more complex
    than traditional software, with layers of deep neural networks that operate in
    a dimensionality that is much higher than the human brain can comprehend.


    When we talk about Responsible AI, we typically hear teams mentioning several
    different kinds of challenges, centered around explainability, reliability, fairness,
    and cultural change. Let’s take a look at some of the issues involved.


    # Explainability


    Explainability—that is, being able to understand why the model generated a certain
    result—is an essential component of Responsible AI. To be accountable to your
    users, you need to be able to explain why a certain prediction was made, in a
    way that is humanly understandable. Furthermore, to assess what went wrong when
    decisions were unfair or harmful, and make sure this doesn’t happen again, you
    need to be able to inspect the model and see why it behaved the way it did.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Explainability is a major challenge with AI systems, because of the “black
    box” problem. Whether it’s the data science practitioner or the compliance team
    reviewing the model, no one really knows why it made a certain decision. That’s
    because the model is making decisions based on hundreds or even thousands of factors,
    which are transformed and used to generate the outcome in nuanced ways, not unlike
    how neurons work in the brain.


    These systems are so high-dimensional that humans can’t interpret them by looking
    at patterns in the output or at the code itself. They need special explainability
    algorithms and tools, which is a burgeoning field of AI research.


    # Reliability


    When you have developed a model and launched it into production, it’s important
    to know how the model is performing. Unlike traditional software, the behavior
    of an AI system can change at any time when the data in production starts to look
    quite different from the data the system saw in training. As an example of this
    kind of data drift, during the COVID-19 pandemic, there was a massive shift in
    behavior worldwide. People’s purchasing patterns completely changed, causing once-commonplace
    items to become hard to find. Demand for plane tickets virtually disappeared overnight.
    Individuals were taking out loans when they’d never had to before.


    We’ve heard countless stories of teams who had to completely retrain their models
    to account for the fluctuations in data. And those are just the teams that caught
    the problem—often, reliability issues with AI go undetected. The reason for this
    is, again, that these systems are complex and entirely dependent on data, which
    means they need new monitoring techniques. AI is also prone to unique security
    issues, like attackers trying to send misleading data to the model to manipulate
    its results.


    # Fairness'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Fairness is the absence of bias for or against an individual or group based
    on their characteristics. At a fundamental level, the world is, sadly, an unfair
    place. Bias is inherently present in the world around us and encoded into our
    society. We can’t directly solve the problem of bias in the world at large, but
    Responsible AI is about making sure that we take all the measures possible to
    weed out bias from our data, our models, and our human review processes.


    The challenge is that AI systems are particularly prone to bias. Traditional software
    algorithms can be biased too, but machine learning models are more likely to hide
    the underlying biases in the data, and they might introduce specific, localized
    discrimination. There are just more ways for bias to seep in, particularly in
    the data chosen for training. For example, the [data used to train Amazon’s facial
    recognition](data used to train Amazon’s facial recognition) system was mostly
    based on white faces, leading to issues with detecting darker-skinned faces.


    [Figure 6-1](Figure 6-1) shows the many kinds of bias that can enter an AI system
    at each stage of its development.'
  merge: -1
  img_proc: true

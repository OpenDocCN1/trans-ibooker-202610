- pgno: 76
  md: 'Figure 6-1. The kinds of bias that can be found in an AI system


    # Cultural Change


    Finally, an additional challenge is the cultural buy-in at all levels of the company
    that it takes in order to slow down, or even stop, to implement Responsible AI
    practices. Many teams are already feeling like they’re behind when it comes to
    taking advantage of AI. They’re looking for a fast solution that they can put
    in production, preferably yesterday. But moving too fast, without thinking about
    the potential for harm, is extremely risky—not only to the end users, but to the
    company’s reputation.


    This is one area where tech companies would do well to take a page out of a financial
    institution’s playbook. The financial industry is heavily regulated, and for many
    years the use of models (which were traditionally simpler statistical models)
    has been accompanied by strict compliance rules. As a result, banks have had model
    risk management teams for over a decade, overseeing and validating models. This
    role is naturally expanding to AI as well.


    # How Model Performance Management Solves These Challenges


    MPM goes hand in hand with implementing Responsible AI. In fact, it would be very
    difficult to overcome the challenges we’ve just described without MPM. It solves
    these roadblocks with a few key innovations.


    # Explainable AI


    MPM solves the AI “black box” problem by introducing explainability into every
    stage of the operational ML life cycle. With any good MPM solution, explainability
    is part of the package. During model development and validation, practitioners
    can use MPM to inspect how features contribute to the model, helping find places
    for improvement or even eliminate features that could be contributing to bias.
    Explainability tools with MPM can help'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'teams prepare models for regulatory audits and provide transparency to end
    users as well.


    We looked at Explainable AI in Chapter 2, but how does explainability work? Early
    explainability approaches were either simpler interpretable models that approximated
    the models being explained or applications of a game theory concept called Shapley
    values. Today we have many more explainability solutions, including gradient-based
    techniques like Integrated Gradients that work better for models using unstructured
    data. The original idea behind Shapley values was to fairly distribute gains to
    a coalition of players in a cooperative game based on their contribution. When
    applied to the machine learning context, the ML model becomes the game, the inputs
    are the players, and the model prediction is the gain. The Shapley values approach
    probes the model in a combinatorial way to see what its output would have been
    if the inputs had been changed. It does this in the context of individual and
    groups of features to account for feature correlations. This creates a unique
    set of contributions for each given input for a given model prediction output
    to help determine how much it contributed to the output.


    # Monitoring in Production


    For an AI system, production can be full of issues such as data drift, broken
    data pipelines, latency problems, or computational bottlenecks. Just as we prepare
    for planes to crash, it’s important to prepare for models to fail.


    That’s where MPM comes in. When a model is in production, it needs continuous
    monitoring to watch out for operational challenges like data drift, data integrity,
    model decay, outliers, and bias. By combining traditional performance monitoring
    techniques with model explainability, MPM gives teams access to actionable monitoring
    alerts that show them the “why” behind these operational challenges, so they can
    quickly solve any issues that arise.


    # A Single Source of Truth'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'To enable cultural change and address the foundational issues that contribute
    to “irresponsible AI,” MPM provides visibility into the model for the entire team,
    throughout every stage of the model’s development. This helps everyone, from engineers
    to business stakeholders, get on the same page. When you give teams the tools
    to examine and explain AI models, everyone is empowered to be accountable for
    the model’s decisions.


    # Model Governance and How MPM Fits into the Life Cycle


    Outside of monitoring a single model with MPM, teams need to manage the upstream
    and downstream dependencies between their models. However, they often lack good
    tools to manage their models. Model ownership is not always clearly defined, and
    owners may not know who all their users are. All too often, a change in one model
    can break another without anyone noticing. Model governance answers questions
    like: Who is responsible for the model? Who is held accountable for errors in
    the model? Is the model operating according to industry standard regulations?


    With MPM, similar to DevOps, models have clear owners and are managed in one central
    location, providing visibility to the entire team. Let’s take a look at how the
    AI life cycle works with MPM from start to finish. First, teams document the desired
    behavior of the AI systems and the larger product that they fit into. For example,
    what are the KPIs that will show whether the model is behaving as desired? These
    KPIs are then built into the MPM system.


    Next, the model is trained and validated in a test environment. Validation helps
    teams quality-check the model before moving it to production; the model’s creators
    can access individual explanations for each prediction to better understand what
    influenced that prediction. It’s important to proactively look for what can go
    wrong. If a certain attribute is contributing a lot to the model’s predictions
    (say, if someone’s income has a 20% effect on whether they are approved for a
    loan), does this have the potential for'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'negative outcomes and harm? Explainable AI with MPM helps teams develop these
    insights.


    Finally, an internal auditing and reporting process is put in place, which can
    be accessed by all stakeholders. MPM ensures that everyone has access to a shared
    source of truth, complete with monitoring and alerting of outliers, data drift,
    or any other type of production failure.


    # The Future of Responsible AI and MPM


    The influence of AI will only continue to grow, and Responsible AI is more important
    than ever. Here are some of the ways we expect Responsible AI and MPM to change
    and develop over the next few years.


    # New Regulations


    In 2019, Democratic lawmakers proposed the Algorithmic Accountability Act. The
    Pentagon adopted Ethical AI principles in 2020. There’s a trend here, and with
    China’s race to AI dominance and constant AI issues in the news, the current administration
    will most likely be compelled to approve the first federal regulations in AI accountability.
    While some regulations have come out of the EU and other countries, a well-drafted
    regulation from the US will be key to AI’s adoption and (responsible) growth over
    the next decade.


    # A New Role: Chief Ethics Officer


    In 2020 there were significant breakthroughs in AI, from GPT-3 to a solution for
    the decades-long protein folding problem. This growth is both exciting and alarming,
    causing many to think about putting more guardrails in place for AI systems. Unless
    companies take a more human-centric approach to developing AI, individuals working
    on these kinds of innovations will increasingly blow the whistle on moral issues
    with AI. The companies that succeed will be those that hire chief ethics officers
    to'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'proactively address this problem by implementing Responsible AI with MPM.


    # More Tools to Test Bias


    National protests about racial inequity put a powerful spotlight on bias in society
    in 2020. Against this backdrop, the multitude of AI bias issues at prominent companies
    made ML teams increasingly aware of the need for MPM and Responsible AI. No company
    introduces bias in its products deliberately—it’s a result of inadequate tools
    and processes. Consumers are overwhelmingly demanding change. Fortunately, 2020
    saw the release of several open source ML fairness tools, such as Fairlearn from
    Microsoft. With stronger ecosystem support, ML teams will embrace bias testing,
    even for nonregulatory use cases, as part of their MPM systems. The adoption will
    start small. We expect the initial focus to most likely be on assessment rather
    than mitigation.


    # MPM with Monitoring Will Become Mission Critical


    The pandemic caused a dramatic shift in consumer behavior that impacted models
    and caught teams off guard. A lack of real-time operational visibility into production
    models resulted in delayed team responses, lost revenues, and reputational risks.
    As AI accelerates from labs into the real world, business leaders are seeing the
    need for visibility into deployed AI systems to ensure their metrics are continuously
    monitored and no inadvertent liabilities are introduced. Just like DevOps was
    established to create more reliable software, ML teams will introduce monitoring
    with MPM.


    # ML Model Validation Spreads Beyond Banking


    The Federal Reserve and the Office of the Comptroller of the Currency mandated
    validation of banking models in the aftermath of the financial crisis of 2008.
    With AI models replacing quantitative ones, banks are applying the same rigor
    and process to ensure AI models are sound. After'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'years in research and development, Explainable AI products are finally mature
    enough for broad adoption in financial services, giving rise to new roles like
    AI validator on an AI governance team. With a model validation step, banks have
    been able to successfully limit inadvertent AI issues and increase their AI-driven
    top line. Other verticals, like insurance, retail, healthcare, and recruiting,
    will adopt some aspects of this model validation process to not only ensure that
    their models are robust but also bring ML transparency to their partner teams
    in 2021.


    2021 is shaping up to be a seminal year in Responsible AI, where companies finally
    begin to adopt key practices due to undeniable political and social pressure.
    Companies that invest in MPM are likely to see that investment pay off in added
    consumer trust, fewer regulatory hurdles, and more opportunities for growth.'
  merge: -1
  img_proc: true

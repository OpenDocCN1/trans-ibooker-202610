    # Integrated Tools Provided by Cloud Platforms


    There are many large cloud providers and platforms today offering a range of products
    and services in the space of data science and data engineering. The three biggest
    players in the cloud computing space—Amazon Web Services (AWS), Microsoft Azure,
    and Google Cloud Platform (GCP)—all have some model tracking and performance management
    capabilities built into their offerings or available as supplementary add-ons.
    The systems for tracking model performance are usually integrated into their AI
    or machine learning services and give users advanced visibility into model performance.
    If you already have a cloud provider, using the tools and services they offer
    will allow your team to integrate them into an MPM framework with little to no
    overhead.


    If your team is considering moving to the cloud (or changing providers), you should
    evaluate the different platforms and sets of tools depending on your specific
    needs and use cases. One platform might offer superior model tracking compared
    to another, and each should be evaluated on its merits. Going with a multicloud
    approach might also be of benefit, as it can offer the best of all worlds with
    direct comparisons of which platform meets your needs best. This industry is still
    developing, and there will be something new offered by a competitor every year,
    so it’s best to stay agile and have the ability to transition if need be.


    # Specialized MPM Software


    If you’re not yet ready to move to the cloud, or the offerings of the cloud providers
    do not meet your team’s needs, then adopting some specialized software for MPM
    might be a suitable option. If your system is sitting behind a private network
    or firewall with no access to the internet, then it might be hard to integrate
    with some services that operate over the internet. There are both open source
    and software-as-a-service (SaaS) MPM'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'offerings. Open source offerings can be run within your infrastructure and
    offer more configurability; examples include MLFlow and Seldon. SaaS offerings,
    on the other hand, rely on an active internet connection in order to interface
    with the provider’s services or your account within its environment. An example
    of a full-featured SaaS MPM solution is Fiddler, a system that allows users to

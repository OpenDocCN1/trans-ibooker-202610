    biased hiring algorithm](https://), [racial bias in healthcare algorithms](https://),
    and [bias in AI for judicial decisions](https://).


    These issues might have been avoided if humans had visibility into every stage
    of the system life cycle. Part of that life cycle involves training a machine
    learning (ML) model to help in making decisions. In the model validation stage,
    teams could have unearthed instances of unwanted model behavior. With visibility
    into model performance online and offline, these sorts of unwanted behaviors can
    be detected and managed early on.


    For each high-profile case that comes under public scrutiny, there are probably
    many systems that are silently operating and negatively impacting lives. One of
    the main concerns with AI today is that issues are detected after the fact, usually
    when people have already been affected by them. This is a foundational problem
    in AI that needs a foundational fix. That’s where model performance management
    (MPM) comes in.



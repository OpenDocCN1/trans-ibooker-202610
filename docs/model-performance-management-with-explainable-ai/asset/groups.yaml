    the different types of analytics to illustrate how machine learning has evolved
    over time.


    ## The Three Types of Analytics


    As you can see in Figure 3-1, there are three types of analytics: descriptive
    analytics, predictive analytics, and prescriptive analytics. Machine learning
    models can be used for all three.


    Descriptive analytics, as the name suggests, usually comes in the form of reports
    or charts where insights can then be derived by a human. This is the most commonly
    used of the three types, and you are probably using it in your company already.
    The aim of descriptive analytics is to tell you what happened in the past, not
    to provide any recommendations for the future beyond what a human can interpret
    from the data. Machine learning models can be built to describe data too; this
    type of analytics is not limited to just charts and reports.


    ### Prescriptive analytics

    How will we make it happen?


    ### Predictive analytics

    What will happen?


    ### Descriptive analytics

    What happened and why?


    Future


    Present


    Past


    Value and difficulty


    Adoption


    Figure 3-1. Three types of data analytics


    To take this a step further, a machine learning model can be built to predict
    outcomes of certain situations, also known as predictive analytics. This usually
    follows on from descriptive analysis, where a specific scenario can be modeled
    and the inputs can be mapped to create a virtual representation of that one real-world
    scenario in order to predict a certain output. Future outcomes can be predicted
    based on the incoming data at any point in time. Any previously unseen scenarios
    might not be able to be predicted accurately, though, and this is one shortcoming
    of machine learning today. This is also why MPM is crucial for staying on top
    of changes in the data or the model.


    The final form of analytics is known as prescriptive analytics, and it is the
    least commonly used as it is the most difficult to implement. However, it potentially
    provides the most value to your business. A prescriptive model will provide a
    prescription for a set of actions in order to achieve a desired outcome or target.
    Such models can be used to automate decisions or improve customer experiences,
    and they usually require multiple inputs to provide a prescription. Think of a
    scenario with multiple steps, where the prescriptive model tells you what to do
    at every step of the way. Depending on the outcome at each stage, the model can
    readjust and predict a new optimal path.


    ## Life Cycle Stages


    Now that you understand the different types of analytics to which machine learning
    can be applied, let’s tie this back to the machine learning life cycle and MPM.
    Figure 3-2 illustrates the different stages of the ML life cycle when it is applied
    to a new problem. Note that different models involve varying levels of complexity
    and might not need to go through all of these steps.


    ![](img/67dbd3f08ade4e35edf8f6d7240af081_39_0.png)


    Figure 3-2. The stages in the ML life cycle


    As you can see, there are nine stages, which can be summarized as:


    - 1. Problem definition

    - 2. Data collection

    - 3. Data processing and storage

    - 4. Metrics definition

    - 5. Data exploration and analysis

    - 6. Feature extraction and engineering

    - 7. Model training and offline evaluation

    - 8. Model integration and deployment

    - 9. Model release and monitoring


    The life cycle starts when a problem is identified, and then it feeds back into
    itself. This is the iterative nature of model development at play. Once you or
    your team have been through this cycle a few times, the data that needs to be
    analyzed or collected might already be available, and it may be possible to skip
    some steps. The cycle repeats itself to keep up with constantly changing data
    and requirements. As we’ll see, MPM closes the loop between the training, deployment,
    and monitoring of a machine learning model and can aid in detecting these changes
    and drifts and enable your teams to rapidly iterate.


    Before we consider how it fits in, let’s look at each stage of the ML life cycle
    in a little more detail.


    ## Problem Definition


    The very first stage in any machine learning model’s life cycle is identifying
    and defining the problem it aims to solve. This problem can come in many forms
    and may be related to internal or external stakeholders’ interests or needs. The
    problem needs to be defined with enough detail to be able to be understood by
    your engineering and data science teams. Something like “customers are not happy”
    is not a well-defined problem, but something like “customers have been having
    difficulty locating items they recently viewed” is. Depending on the goal of your
    team or company, the problem can be as simple as improving team collaboration


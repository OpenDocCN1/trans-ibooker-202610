  - '[PAGE 45]


    customer experience should in turn hopefully lead to more sales as well. Using
    this as a metric to track any model changes can be a good proxy to measuring how
    well customers are responding to new models. This is a useful business metric,
    but it does not help your team develop the model offline (they can’t tell which
    model will lead to more sales).


    To remedy this, another requirement would be to have the ability to measure the
    accuracy of a recommendations engine. This could be used to predict how likely
    a user would be to click on any product that would be recommended to them if there
    were a recommendations engine present. This is a good metric to use offline: your
    team can study real user flows and measure how many of your users would be helped
    by the introduction of a recommendations or personalization model. This is a technical
    metric that can aid in developing and evaluating the model offline before it is
    deployed and the sales generation can be measured.


    # Data Exploration


    Now that there are some metrics for the business side and your technical team,
    it’s time to start exploring the data. It is also possible at this stage to start
    developing hypotheses for predictive or prescriptive models that can validate
    or invalidate the possibility of using the collected data for a given model. This
    is usually done by subject matter experts, such as specialized data analysts or
    data scientists, and relationships between different data points can be mapped
    to create a better picture of the system.


    During this stage of the life cycle, it is usually descriptive analytics that
    is the most useful, as it is easier to translate findings from the technical side
    to the business side this way (think dashboards and reports). Reports can be generated
    to understand different types of data groups (such as customer types) and their
    intrinsic characteristics. Descriptive analytics can also be used to inform areas
    of improvement that can be addressed by a machine learning model that understands
    the domain and can eventually evolve from descriptions to making predictions or
    even offering prescribed actions.'

    # Feature Extraction and Engineering


    The features that are fed into the machine learning model (user personas, for
    example) can be selected by the data science team according to the inherent nature
    of the domain, or they can be automatically generated by some optimization that
    aims at maximizing a set target outcome (such as accuracy or performance). This
    is the role of feature selection, extraction, and engineering.



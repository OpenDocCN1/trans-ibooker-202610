    data is transformed in flight (a common pattern in stream processing systems)
    and then loaded into its final resting place, either a data warehouse or a data
    lake. ELT, on the other hand, favors loading the data in its raw form and then
    using built-in or third-party tools, transforming it, and inserting it into its
    final location.


    Depending on your requirements and the speed at which the data will need to be
    used, both ETL and ELT can be used. Loading the data in its raw form will preserve
    it in case there are any errors in the transformation. Some data might not need
    to be aggregated or analyzed in real time, while other types of data might need
    to be aggregated or analyzed in real time for tracking or compliance reasons.
    (Having redundancy doesn’t hurt in the world of data; you could always use both
    approaches for the same data.)


    Let’s tie this back to our ecommerce example. You have around 1 MB of data being
    ingested every second, and around 86 GB each day. To handle this, you’ll need
    an ETL or ELT processing system (or a combination of both!) with some sort of
    obfuscation (removing any personal information) and some data quality checks.
    Any data that fails the check should be forked to another location for analysis
    or reprocessing. Once the good data has been processed and stored, it is ready
    for analysis, exploration, and (the exciting part) building some machine learning
    models!


    Data that is processed in real time can feed into an analytics engine for the
    data science and analytics teams to consume. Data that is aggregated from the
    raw data every few hours, days, or weeks can be used by the business to track
    overall health and the key performance indicators (KPIs) of the different lines
    of business. But before you start doing all that, you should probably define some
    requirements for any analyses and potential models that are going to be built
    or developed by your team.


    ## Metrics Definition


    Now that you have started collecting data in order to better understand your business
    or problem, let’s talk about the requirements for metrics. It is good practice
    to prepare for any unforeseen circumstances by defining good metrics early on.
    These metrics might also serve as the accuracy or performance measures for any
    models that will get deployed to production. This will not only aid in selecting
    which models to deploy and which to shelve, but also serve as a way for you and
    your team to compare different models against each other. They provide the basis
    for any benchmark or evaluation, and can come in the form of business metrics
    such as revenue or customer satisfaction (usually based on survey scores) or technical
    metrics such as model accuracy. Depending on your use case, you should spend some
    time with your team early on defining these metrics to help everyone align on
    the goals of the analysis or model.


    To tie this to the ecommerce example, let’s recall the problem at hand. You noticed
    a dip in total sales due to some customer experience features that were missing.
    Any model that is built with the intention of improving the


- raw:
  - '[PAGE 60]


    Once a model is deemed to be ready for production, it can be versioned, integrated,
    and released. This versioning will help with many downstream analytics dependent
    on tracking the lineage of the model as well as its outputs. Any discrepancies
    between the model in offline and online environments can then be identified, and
    the performance of the model can be optimized to achieve the desired results.


    # MPM in the Release and Monitoring Stage


    After a model has been approved for release, there are a number of measures to
    take to ensure that it can be confidently rolled out to all your users. MPM suggests
    that the model log all its predictions and input data alongside the model version
    and other metadata to allow the team to monitor it. Any issues that happen in
    the model can be detected by tracking the predictions being made and whether they
    begin to deviate far enough from the norm to trigger an investigation (known as
    model drift), and the root cause can be investigated using XAI. Models can also
    be compared in a live setting (known as A/B testing or challenger/champion testing).
    More advanced models might need to have more than two variations compared in order
    to ensure the highest-performing model is promoted; this form of testing is called
    multivariate testing.


    # Detecting Model Drift


    Model drift occurs when the data feeding into the model begins to change or deviate
    from what the model expects, resulting in changes in the model output. When this
    occurs, it might be hard to detect since the model outputs are not usually stored
    alongside some metadata for analysis. Using an MPM system or process ensures that
    the model outputs are stored and accessible by your data science or operations
    teams. On an average day, the expectations of distributions across the different
    input groups should be within an acceptable margin of error. If these values begin
    to deviate over time, the analysis of the outputs can show any drift and allow
    your team to pinpoint and fix any issues.'
  - '[PAGE 61]


    One issue might be that the model needs to be seasonally updated due to the seasonality
    of your business. Another case would be that the model itself was not trained
    to account for all scenarios and is therefore producing unexpected outputs for
    unseen data. This can be caused from underrepresentation or overrepresentation
    of certain subsets of the data. To remedy this, your team can add in paths for
    unseen data, such as triggering a customer support ticket or referring the user
    to documentation in order to try to remedy the problem. Whether the issue is detected
    by the system or by users contacting your support team, the MPM system can be
    used to replay and analyze the predictions in order to update the model to remedy
    the issue.


    # Finding the Root Cause Using MPM and XAI


    Once an issue has been identified by either the MPM system, a customer, or your
    QA team, it’s time to find the root cause and address it. Your team might be tempted
    to hastily attempt to remedy the issue by applying a quick fix or patch at the
    application layer without looking into the black box that is the machine learning
    model. But using MPM, they can identify and fix the root cause of the problem
    by isolating the issue and determining an appropriate remedy that has no impact
    on other parts of your system.


    In order to mitigate the risk of customer satisfaction or compliance issues, your
    team can test out changes or fixes on a small portion of the data, or replay the
    past few days’ worth of live data in a simulated environment to check if the changes
    would have resulted in the expected behavior. Without an MPM system to store all
    the predictions alongside the metadata, it would be hard to replay data and run
    historical tests on any patches or fixes. Once the fixes have been validated on
    historical data, they can be released to your users. In order to mitigate any
    unforeseen risk, the model can be released to a small portion of your users first,
    and the results can be monitored to ensure the fix is safe to roll out to the
    rest of your users.


    # Live Experiments'
  - '[PAGE 62]


    Validating whether a new model (or an updated model) is going to accomplish the
    desired outcomes might be hard to achieve without mechanisms to mitigate unforeseen
    risk. There are many methods you can use to identify potential issues or defects
    early on in the process. Private testers or QA teams can capture these issues
    and log them for your engineering teams to address. No process is 100% perfect,
    though, and there will always be unknowns. So, to further mitigate risks, live
    experimentation can be done to minimize any damage by targeting specific subsets
    of incoming data for the new model to receive. By splitting the data in this way,
    the person tracking the experiment can monitor the results to validate any hypotheses
    or fixes that might have been applied. Once the model is validated on a small
    portion of the data, the ratio can be increased, either straight to 100% or gradually
    in order to account for edge cases or low-volume data points.


    # Random sampling versus targeted splitting


    When conducting an experiment, it is important to keep in mind the data split
    that will be done in order to achieve the desired ratios. Sometimes you might
    need to validate that a very specific edge case has been fixed and that this fix
    does not cause any other issues. In these cases, you might want to target the
    fix for the users that fit into that edge case and validate that it works before
    going on to validate that it does not cause any issues for other users. Random
    sampling can be used for testing all users by ensuring an even split of samples
    across the two (or more) experiment targets.


    There are many methods to randomly split data to ensure no biased targets occur.
    A common method is to use a hash of non-identifying fields in the data (metadata)
    and randomly split that set of hashes into target groups. Since the data being
    used to generate the hash is not unique to that row, the samples will be randomly
    distributed across the groups. This ensures that the “randomness” of the selection
    process for the target groups contains no bias toward selecting one specific group
    over the other based on any of its identifying features. This method applies to
    cases where the individual predictions are not related to a specific user, but
    sometimes you might want to split the users into groups.'
  - '[PAGE 63]


    If you want to target users rather than data points, you can first assign a random
    universally unique identifier (UUID) to each user and then sample the IDs using
    the same method as mentioned previously. You might need to generate these UUIDs
    for each user, or you might be able to use an existing field (e.g., a user ID
    field). In either case, these IDs are usually stored on the user’s device or attached
    to their login information in order to better track the performance of the different
    models across the different target user groups.


    # A/B testing


    Now that we’ve seen how the models can be split into target groups, let’s talk
    about the simplest type of live experiment we can perform: the A/B test or challenger/champion
    test. The A and B in A/B testing just refer to two models; they can be two completely
    different models or slightly modified versions of the same model. In either case,
    there is usually one model that is already in production (assuming this isn’t
    the first experiment you are running), which would be the champion in a challenger/champion
    test. The challenger is tasked with outperforming the champion and talking over
    its role as the champion model. Once a challenger that has been shown to be superior
    to the champion is promoted to that role, it awaits challenges from future models.


    # Multivariate testing


    Sometimes you might have many different variables that need to be tested at the
    same time, or many different variations of models that you want to experiment
    with. In these cases, you’ll need to have multiple target groups vying for the
    glory of champion. Once the different groups and variables have been released,
    without an MPM system in place that is keeping track of all the different things
    happening at the same time, it might become extremely hard to analyze the results.
    Ensuring that the MPM system also tracks the metadata of each model version, as
    well as the users’ UUIDs, becomes a full stack effort requiring the integration
    of these metric trackers into your application or system.'

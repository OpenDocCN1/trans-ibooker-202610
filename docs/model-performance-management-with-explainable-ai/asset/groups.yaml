    ## Preface


    每个行业、公司和消费者都受到了人工智能（AI）的影响。根据 [《2019 年人工智能现状：分歧》](https://)，目前有 1/10 的企业使用 10
    个或更多 AI 应用。根据 [Gartner](https://)，预计到 2024 年，75% 的企业将从试点转向将 AI 投入运营。贵公司目前运营着多少个
    AI 应用？


    AI 有潜力为我们日常问题提供高效、有效和创新的解决方案，但它也伴随着风险。过去几年我们见过多个 AI 存在 alleged bias 的例子。一个备受关注的例子是
    2019 年的 [Apple Card/Goldman Sachs 丑闻](https://)，最初是一条推文线程，包含多起 alleged bias 报告，最终导致监管机构对
    Goldman Sachs 的算法预测实践展开调查。这并不是孤立的案例；也有关于 [亚马逊有偏见的招聘算法](https://)、[医疗算法中的种族偏见](https://)
    以及 [司法决策 AI 中的偏见](https://) 的报道。


    如果人类能够在系统生命周期的每个阶段都拥有可见性，这些问题本可以避免。生命周期的一部分涉及训练机器学习（ML）模型来帮助做出决策。在模型验证阶段，团队本可以发现不期望的模型行为。通过对模型在线和离线性能的可见性，这类不期望的行为可以及早被检测和管理。


    对于每个受到公众审视的高调案例，恐怕还有许多系统在默默运行并对生活产生负面影响。今天 AI 的主要担忧之一是问题是在事后才被发现，通常在人们已经受到影响之后。这是一个需要根本性修复的基础性
    AI 问题。这就是模型性能管理（MPM）发挥作用的地方。


    技术团队通常利用 DevOps 原则和应用性能管理（APM）来快速迭代软件开发并分别确保高性能。MPM 是一个框架，它借鉴了这些经验并将其应用于与 ML 模型合作的独特挑战，为团队提供对整个
    ML 工作流的控制和可见性。MPM 之于 MLOps 就像 APM 之于 DevOps：它是一个为模型性能提供可观测性和控制的框架。


    ## Chapter 1. Introduction to Model Performance Management and Explainability


    在互联网兴起之前，由于分发和访问软件的性质，软件开发生命周期更长。还记得过去必须购买 CD 或 DVD 并插入电脑来安装软件的日子吗？生命周期是瀑布式的，以前推送补丁或更新给消费者需要数月（如果不是数年）的时间，而这些在今天的敏捷世界中是理所当然的。


    互联网带来了更互联的软件系统后，监控系统之间以及人与系统之间的通信和交互变得越来越困难。这导致了两种框架的兴起，它们协同工作以实现快速迭代同时保持高性能系统：开发运营（DevOps）和应用性能管理（APM）。随着系统开始变得更智能，我们看到了机器学习（ML）和人工智能（AI）系统的兴起。但随着这项新技术而来的是许多风险和问题，如果我们让这些系统以无法解释或不可理解的方式行为会发生什么。


    这些系统的快速出现也导致了针对机器学习和数据专门的新实践的发展。对于传统软件，很容易测试它是否正常工作：通常有一组离散的可能输入和输出。然而，对于复杂的 ML
    模型和 AI 系统，很难完全监控和观察内部发生了什么。一些模型可能依赖数千甚至数百万个输入来做出决策。这就是为什么我们需要一个以数据为中心的新框架，旨在生产高质量的模型和系统，同时与
    DevOps 和 MLOps 的快速迭代目标保持一致。


    这样的框架将类似于 APM，但适用于 ML 模型并考虑这些模型与传统应用程序之间的细微差别和差异。该框架可以称为 *模型性能管理*（MPM）。模型性能不仅依赖于指标，还依赖于当某事最终出错时模型能够被解释得多好。这就是所谓的
    *模型可解释性*。正如 APM 旨在为运维团队提供对整个应用程序开发过程的更多可见性，MPM 允许这些团队在模型被训练、验证和部署时对其进行监控。在本章中，我们将在深入探讨
    ML 生命周期中涉及的细微差别和阶段以及 MPM 和模型可解释性如何融入其中之前，讨论建立这样一个框架的必要性。


    ## DevOps and Application Performance Management


    让我们退一步谈谈 DevOps 和 APM 是为什么出现以及它们是什么。


    ## DevOps


    DevOps，或开发运营，是一个用于描述用于实现快速迭代和高速度的文化实践、业务流程和工具链组合的术语。目标是快速创新并在问题出现时尽快发现问题。市面上有许多
    DevOps 框架和工具，每个都有其优缺点，但核心是统一实践的整体哲学，在某种程度上在公司和领域之间统一。


    DevOps 的一个原则是系统可观测性，进而是监控。监控是通过使用指标和日志实现的，使我们能够跟踪应用程序内部发生的情况。有工具可以做到



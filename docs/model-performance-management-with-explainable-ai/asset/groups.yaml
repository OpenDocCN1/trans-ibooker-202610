    你自己的基础设施在维护 MPM 系统所需资源方面会带来很多开销，但能为你提供完全的可配置性。


    ELK 只是能够满足 MPM 需求的堆栈的一个例子。在可能的情况下，使用预包装的解决方案或服务可能会减少开销和周转时间，并且具有优势，即有专门的团队（供应商或服务提供商）可用于处理任何缺陷或问题。使用服务还允许你的团队专注于构建工作流或模型性能检查，而不是解决跟踪模型性能的问题。


    你可能已经拥有一套工具和服务，可以用作 MPM 框架的构建模块，但缺乏端到端覆盖。在这种情况下，在团队流程中实现 MPM 的工作流可能是最佳解决方案。将各个步骤的数据馈送集成到中央数据存储中将允许在该数据之上构建分析层。将分析层集成到界面中将为你的团队提供一个集中性能跟踪的
    MPM 框架。还可以实施自动警报和模型标记，以便集成到 PagerDuty 等工具中或直接集成到你的消息平台（例如 Slack）中。


    ## 第 6 章. MPM 与负责任的 AI


    许多公司现在考虑 MPM 解决方案的一个原因是因为它帮助他们实现一个重要的最终目标：不仅仅是实施高质量且推动业务底线的 AI 系统，而且要 *负责任地* 做到这一点。[根据埃森哲](According
    to Accenture)，企业社会责任和道德对消费者越来越重要——如果这还不够，全球各地的公司都面临着关于 AI 如何实施和使用的日益增长的法规。但什么是“负责任的
    AI”，MPM 又如何提供帮助？让我们来看看。


    ### 什么是负责任的 AI？


    负责任的 AI 是构建 *透明*、*可问责*、*合乎道德* 且 *可靠* 的 AI 的实践。当 AI 负责开发时，利益相关者可以洞察 AI 系统如何做出决策，并且系统可以通过人工监督进行治理和审计。因此，结果对终端用户公平，利益相关者可以在部署后洞察
    AI，并且 AI 系统在生产中持续按预期执行。


    透明度确保利益相关者能够洞察 AI 系统正在做什么。他们理解决策和预测背后的“为什么”，并构建具有内置隐私和安全性的系统。可问责性为 AI 系统提供了急需的制衡措施，设有护栏、指南和治理框架。最重要的是，有人工监督，并且在需要时能够覆盖决策。道德总体上是指确保
    AI 对所有受影响者都有益，重点是公平和包容。可靠性是最重要的原则之一，因为它确保负责任的模型能够随着时间的推移得到维护，并持续运行。


    ### 负责任的 AI 的挑战


    为什么我们现有的软件开发实践不足以负责任地在生产中部署 AI 系统？


    原因在于 AI 系统不像传统软件。对于普通软件，你按规范开发，运行测试，并且可以放心你的程序不会突然改变行为。此外，你可以记录、检查和调试软件的工作方式以及导致其返回特定结果的原因。


    AI 系统不同。它们基于数据，而数据是不断变化的。模型在生产中看到的数据可能与训练数据看起来非常不同，导致其预测失准。而且 AI 系统比传统软件复杂得多，具有深层神经网络层，其维度远高于人类大脑能够理解的维度。


    当我们谈论负责任的 AI 时，我们通常听到团队提到围绕可解释性、可靠性、公平性和文化变革的几种不同挑战。让我们来看看其中涉及的一些问题。


    ### 可解释性


    可解释性——即能够理解模型为何生成特定结果——是负责任的 AI 的重要组成部分。为了对用户负责，你需要能够以人类可理解的方式解释为何做出特定预测。此外，为了评估当决策不公平或有害时出了什么问题，并确保这种情况不再发生，你需要能够检查模型并了解其为何如此行为。


    可解释性是 AI 系统面临的重大挑战，因为“黑箱”问题。无论是数据科学从业者还是审查模型的合规团队，没有人真正知道它为何做出特定决策。这是因为模型是基于数百甚至数千个因素做出决策，这些因素被转换并以细微的方式用于生成结果，很像大脑中神经元的工作方式。


    这些系统维度如此之高，人类无法通过查看输出中的模式或代码本身来解释它们。它们需要特殊的解释算法和工具，这是一个蓬勃发展的 AI 研究领域。


    ### 可靠性


    当你开发了一个模型并将其投入生产时，了解模型表现如何很重要。与传统软件不同，AI 系统的行为可能在任何时候发生变化，当生产中的数据开始看起来与系统在训练中看到的数据大不相同。举例说明这种数据漂移，在
    COVID-19 大流行期间，全球行为发生了巨大转变。人们的购买模式完全改变，导致曾经常见的商品变得难以找到。飞机票的需求一夜之间几乎消失。个人开始申请贷款，而以前从未需要过。


    我们听过无数团队不得不完全重新训练模型以应对数据波动的故事。而这些只是发现问题的团队——通常，AI 的可靠性问题未被检测到。原因再次在于，这些系统复杂且完全依赖数据，这意味着它们需要新的监控技术。AI
    还容易出现独特的安全问题，例如攻击者试图向模型发送误导性数据以操纵其结果。


    ### 公平性


    公平性是指基于个人或群体的特征而不存在偏袒或歧视。在根本层面上，世界很遗憾是不公平的。偏见固有地存在于我们周围的世界中并编码到我们的社会中。我们不能直接解决整个世界偏见的问题，但负责任的
    AI 是关于确保我们采取一切可能的措施，从我们的数据、我们的模型和我们的人工审查流程中剔除偏见。


    挑战在于 AI 系统特别容易出现偏见。传统软件算法也可能存在偏见，但机器学习模型更可能隐藏数据中固有的偏见，并且可能引入特定的、局部的歧视。偏见渗入的方式更多，尤其是在为训练选择的数据中。例如，用于训练亚马逊面部识别系统的[数据](data
    used to train Amazon’s facial recognition)主要基于白人面孔，导致检测深色皮肤面孔出现问题。


    [图 6-1](Figure 6-1) 显示了在 AI 系统开发的每个阶段可能进入的各种偏见。


    ### 偏见


    数据

    - 历史偏见

    - 代表性偏见

    - 测量偏见

    - 时间偏见

    - 省略变量偏见


    AI/ML

    - 算法偏见

    - 评估偏见

    - 聚合偏见

    - 热门偏见

    - 排名偏见

    - 新生偏见

    - 链接偏见


    人工审查

    - 行为偏见

    - 呈现偏见

    - 内容生产偏见

    - 社会偏见


    行动



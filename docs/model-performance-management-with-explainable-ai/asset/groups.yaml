    and hate effectively cancel each other out. If we were to ask our model, however,
    it would think that the sentence was positive since it only knows that “love”
    has a score of +1. An explanation of the model’s output might look something like
    this: “I love+1 how much you hate this subject.” To fix this issue, we would want
    to modify our corpus to look something like this: {“love”: +1, “hate”: −1}. This

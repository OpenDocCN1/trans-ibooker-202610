    # Model Release and Monitoring


    After a model has been integrated and deployed, it can be released and monitored.
    The release process might involve changing its configuration to point to the latest
    deployment of the model or simply pushing a button to update to that version.
    However complex or simple this process is, it should be done by someone who has
    the authority and responsibility to perform this task.


    After a machine learning model is released, there is no guarantee that the underlying
    system it is representing isn’t going to change or there isn’t going to be new
    behavior that needs to be accounted for. This is where monitoring comes in and
    ties in to MPM. MPM can offer a lot of insight into how models are performing
    and which models need to be updated. The model version, parameters, and target
    user base can all be modified during the release stage according to the identified
    splits in the previous stages. Since the model can target different groups for
    experimentation, monitoring can be applied to these different sets, based on their
    identifiers, in order to monitor the performance across each. Experimentation
    can help validate or invalidate certain theories your subject matter experts might
    have about your domain.


    Let’s say you were looking to increase the sales in your organization and wanted
    to test out different models to see which would generate the most profit. Monitoring
    would be the most important part of that experiment, as it would aid in tracking
    the different models and how the users are reacting to them.


    To close off the life cycle of ML models, let’s talk about what happens once you
    have the recommendation system on your ecommerce site. Once the model is released
    to a portion of the users, you start to notice that the users with the recommendations
    banner are interacting with the website a lot more and in turn end up buying more
    products as a percentage of their group. This is great news! You have validated
    that a recommendation system would increase your sales.'

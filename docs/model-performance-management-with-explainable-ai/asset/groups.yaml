  - '[PAGE 10]


    monitoring, and there are tools that offer full observability, but there is no
    one unified framework that aims at achieving full visibility into application
    systems. Thus, DevOps is often combined with APM.


    # Application Performance Management


    APM provides a framework for monitoring and managing software application performance
    through measuring metrics about the application, with the aim of catching issues
    as soon as they appear, if not before. The exact metrics used can vary, but, with
    applications increasingly moving to the cloud, ensuring that APIs remain performant
    and meet users’ real-time expectations is getting more and more complicated. We
    need to make sure our applications are always available when needed and can handle
    an increase or decrease in load without losing performance.


    Your business might have APIs it serves to customers, or internal APIs for applications
    used by employees. You might also be using an external vendor’s APIs for your
    own business needs. Regardless of the details, you will need to ensure that the
    applications using these APIs are performing with acceptable responsiveness and
    fluidness so that users aren’t left waiting for minutes for a page to load. This
    comes down to how fast the API can respond to user requests. If an API is suddenly
    slowing down, an APM framework will automatically alert the responsible team so
    they can investigate it, find the root cause, and address it. Having full observability
    allows teams to rapidly identify and fix problems before they cause a loss in
    revenue for your business.


    The benefits of APM are:


    # *Broad visibility*


    Prior to the rise of the DevOps tools that we have today, monitoring infrastructure

    ## Preface


    Every industry, company, and consumer has been impacted by artificial intelligence
    (AI). According to [The State of AI 2019: Divergence](https://), 1 in 10 enterprises
    currently use 10 or more AI applications. According to [Gartner](https://), 75%
    of businesses are expected to shift from piloting to operationalizing AI by 2024.
    How many AI applications does your company currently operate?


    AI has the potential to provide productive, efficient, and innovative solutions
    to our everyday problems, but it comes with its risks. We’ve seen multiple examples
    in the past few years of alleged bias in AI. One high-profile example was the
    [Apple Card/Goldman Sachs scandal](https://) in 2019, where what started as a
    tweet thread with multiple reports of alleged bias eventually led to a regulator
    opening an investigation into algorithm prediction practices at Goldman Sachs.
    And this isn’t an isolated instance; there have also been reports about [Amazon’s
    biased hiring algorithm](https://), [racial bias in healthcare algorithms](https://),
    and [bias in AI for judicial decisions](https://).


    These issues might have been avoided if humans had visibility into every stage
    of the system life cycle. Part of that life cycle involves training a machine
    learning (ML) model to help in making decisions. In the model validation stage,
    teams could have unearthed instances of unwanted model behavior. With visibility
    into model performance online and offline, these sorts of unwanted behaviors can
    be detected and managed early on.


    For each high-profile case that comes under public scrutiny, there are probably
    many systems that are silently operating and negatively impacting lives. One of
    the main concerns with AI today is that issues are detected after the fact, usually
    when people have already been affected by them. This is a foundational problem
    in AI that needs a foundational fix. That’s where model performance management
    (MPM) comes in.


    Technology teams often utilize DevOps principles and application performance management
    (APM) to rapidly iterate software development


    and ensure high performance, respectively. MPM is a framework that draws on these
    learnings and applies them to the unique challenges of working with ML models
    to provide teams with control and visibility over the entire ML workflow. MPM
    is to MLOps what APM is to DevOps: it’s a framework that offers observability
    and control over model performance.


    ## Chapter 1. Introduction to Model Performance Management and Explainability


    Before the rise of the internet, software development life cycles were longer
    due to the nature of distributing and accessing software. Remember the days of
    having to purchase a CD or DVD and insert it into your computer to install software?
    The life cycle was a waterfall, and it used to take months (if not years) to perform
    actions like pushing a patch or an update to consumers that are taken for granted
    in today’s agile world.


    After the internet brought about more connected software systems, monitoring communications
    and interactions between systems as well as between people and systems became
    harder and harder. This led to the rise of two frameworks that work well with
    each other to enable rapid iteration while maintaining high-performing systems:
    development operations (DevOps) and application performance management (APM).
    As systems started to advance and become more intelligent, we saw the rise of
    machine learning (ML) and artificial intelligence (AI) systems. But with this
    fancy new technology comes many risks and questions about what might happen if
    we let these systems behave in uninterpretable or unexplainable ways.


    The rapid emergence of these systems also led to the development of new practices
    focused on machine learning and data specifically. With traditional software,
    it is easy to test if it’s working: there is usually a discrete set of possible
    inputs and outputs. When it comes to sophisticated ML models and AI systems, however,
    it becomes hard to fully monitor and observe what is happening inside. Some models
    may draw upon thousands if not millions of inputs to make a decision. This is
    why we need a new framework focused around ML and AI that is data-centric and
    aims at


    producing high-quality models and systems that work with the goals of rapid iteration
    of DevOps and MLOps.


    Such a framework would be similar to APM but would apply to ML models and account
    for the nuances and differences between these models and traditional applications.
    This framework can be called *model performance management* (MPM). Model performance
    is not only reliant on metrics but also on how well a model can be explained when
    something eventually goes wrong. This is known as *model explainability*. Just
    as APM aims at providing ops teams with more visibility into the entire application
    development process, MPM allows those teams to monitor models as they are being
    trained, validated, and deployed. In this chapter, we will discuss the need for
    such a framework before delving deeper into the nuances and stages involved in
    the ML life cycle and how MPM and model explainability fit into it.


    ## DevOps and Application Performance Management


    Let’s take a step back and talk about why DevOps and APM came to be and what they

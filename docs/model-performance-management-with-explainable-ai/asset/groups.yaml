    the classes that are underperforming.


    Using this matrix, we can see that:


    +   - Accuracy = TP + TN / (TP + TN + FP + FN)

    +   - Precision = TP / (TP + FP)

    +   - Recall = TP / (TP + FN)


    Although these metrics can offer a good measure of the performance of a model,
    it is not always possible to determine the “true” values of the predictions once
    a model is deployed. In production situations, models are often measured in relation
    to the business outcome they are trying to achieve. For example, a marketing model
    aimed at targeted emails might be measured by how many of the emails result in
    a purchase. In this scenario, the model is not measured by accuracy but by the

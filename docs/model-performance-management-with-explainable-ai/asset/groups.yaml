    ## Model Integration and Deployment


    Once a model has been developed and evaluated against offline metrics to show
    its viability, it will need to be integrated or deployed into your application,
    workflow, or website. Integration involves adding code or support for the model
    to operate within your website, application, or workflow. Deployment involves
    launching the model in a state where it is ready to be released. Depending on
    the architecture of your system and where the model will be called from (edge
    versus cloud, for example), the specifics of how this is done may vary. This integration
    and deployment process might also be referred to as a continuous integration/continuous
    deployment (CI/CD) pipeline in some contexts.


    In some cases model integration and deployment is as easy as merging a pull request
    (CI) into a branch on a repository, which will then trigger a deployment job (CD)
    contingent on some automated tests passing. It can also be as easy as pushing
    a button in your cloud provider or service provider’s console (e.g., AWS SageMaker
    or Google AI Platform) that will update the parameters or version number through
    a UI. In other cases, however, model deployment might involve releasing new versions
    of software to your users or device fleet. If downloads aren’t automatic, then
    some users might be left out of the updates until they decide to update the application
    manually on their devices.


    Let’s take a look at how we would integrate and deploy the shiny new recommendation
    system we just built for our ecommerce startup example. First we would need to
    add support for our frontend to talk to the model on the backend. We would also
    need a mechanism to split traffic between users to allow for an A/B test or a
    challenger/champion experiment. We would need to test whether having a recommendations
    banner would help increase sales or even just user views of items. Once we have
    the integration ready, we can deploy our model and stage it for release and monitoring,
    which is the final stage of the journey to production.


    ## Model Release and Monitoring


    After a model has been integrated and deployed, it can be released and monitored.
    The release process might involve changing its configuration to point to the latest
    deployment of the model or simply pushing a button to update to that version.
    However complex or simple this process is, it should be done by someone who has
    the authority and responsibility to perform this task.


    After a machine learning model is released, there is no guarantee that the underlying
    system it is representing isn’t going to change or there isn’t going to be new
    behavior that needs to be accounted for. This is where monitoring comes in and
    ties in to MPM. MPM can offer a lot of insight into how models are performing
    and which models need to be updated. The model version, parameters, and target
    user base can all be modified during the release stage according to the identified
    splits in the previous stages. Since the model can target different groups for
    experimentation, monitoring can be applied to these different sets, based on their
    identifiers, in order to monitor the performance across each. Experimentation
    can help validate or invalidate certain theories your subject matter experts might
    have about your domain.


    Let’s say you were looking to increase the sales in your organization and wanted
    to test out different models to see which would generate the most profit. Monitoring
    would be the most important part of that experiment, as it would aid in tracking
    the different models and how the users are reacting to them.


    To close off the life cycle of ML models, let’s talk about what happens once you
    have the recommendation system on your ecommerce site. Once the model is released
    to a portion of the users, you start to notice that the users with the recommendations
    banner are interacting with the website a lot more and in turn end up buying more
    products as a percentage of their group. This is great news! You have validated
    that a recommendation system would increase your sales.


    But the journey isn’t over yet. Now it’s time to roll out the model to everyone
    else and start thinking about a better version—perhaps a version 2.0 that challenges
    this model or maybe a version that is a little more personalized, say, using deep
    neural networks. Multiple parallel iterations of this life cycle can be occurring
    at any given time, and this is a good sign of a healthy data-driven organization.


    ## How MPM Fits into the Life Cycle


    Let’s close this chapter by discussing where MPM fits into the ML life cycle and
    what it can and can’t do. MPM is a philosophy and a set of tools and frameworks
    (analogous to APM within DevOps) that aims at measuring models in terms of their
    performance. The management comes in the form of intervention, such as a new model
    being built, or a model being decommissioned and sent to the model graveyard.
    As shown in Figure 3-3, MPM starts at either stage 6 or stage 7 of the ML life
    cycle, depending on whether the features are relevant to the model’s performance
    or not. As mentioned in the “Data Processing and Storage” subsection, any data
    quality issues should be captured long before the data gets to the model training
    stage.


    ![](img/67dbd3f08ade4e35edf8f6d7240af081_52_0.png)


    Figure 3-3. The stages in the ML life cycle


    If the data being used to predict an outcome is causing issues in the model, then
    MPM suggests that the incoming data be stored for the team to analyze


    and dig deeper. This analysis might include considering parameters such as who
    the user or caller of the model was, what the input data was, and what the model
    predicted. Using XAI techniques, the model can be explained to understand any
    undesirable behavior in order to fix or correct it.


    Undesirable model performance would usually originate at the user level, where
    a bug or issue is flagged by your QA team or automatically detected. Once this
    happens, the team in charge of the model may need to escalate and fix the issue,
    depending on how mission critical it is. If the issue does not appear to originate
    with the model, they can trace the path back up the pipeline until the issue is
    detected and resolved. If the problem happens to be that the model is out of date
    or is not accounting for new data types, then it might be necessary to retrain
    or update the model. As more and more models start making their way into production,
    you can see how it gets harder and harder to manage and monitor them.


    Having an MPM solution in place can help with monitoring and tracking model performance,
    and it gives you almost full observability into your models out in the wild. Combining
    MPM with the previously discussed XAI gives you a full picture of what is going
    on with your models and why. This will never replace the know-how and expertise
    of subject matter experts, but it can serve as a useful tool to help them manage
    models efficiently at scale and help you ensure your models are built responsibly.



    monitoring, and there are tools that offer full observability, but there is no
    one unified framework that aims at achieving full visibility into application
    systems. Thus, DevOps is often combined with APM.


    ## Application Performance Management


    APM provides a framework for monitoring and managing software application performance
    through measuring metrics about the application, with the aim of catching issues
    as soon as they appear, if not before. The exact metrics used can vary, but, with
    applications increasingly moving to the cloud, ensuring that APIs remain performant
    and meet users’ real-time expectations is getting more and more complicated. We
    need to make sure our applications are always available when needed and can handle
    an increase or decrease in load without losing performance.


    Your business might have APIs it serves to customers, or internal APIs for applications
    used by employees. You might also be using an external vendor’s APIs for your
    own business needs. Regardless of the details, you will need to ensure that the
    applications using these APIs are performing with acceptable responsiveness and
    fluidness so that users aren’t left waiting for minutes for a page to load. This
    comes down to how fast the API can respond to user requests. If an API is suddenly
    slowing down, an APM framework will automatically alert the responsible team so
    they can investigate it, find the root cause, and address it. Having full observability
    allows teams to rapidly identify and fix problems before they cause a loss in
    revenue for your business.


    The benefits of APM are:


    ### Broad visibility


    Prior to the rise of the DevOps tools that we have today, monitoring infrastructure
    was limited in functionality and difficult to use. Software and hardware were
    monitored separately, creating disconnected experiences. APM introduces broad
    visibility across all aspects of the deployment cycle, unified under one framework.


    ### Increased observability


    When monitoring triggers an alert, teams address the problem with a fix. However,
    locating the source can be tedious and repetitive, especially when an alert was
    actually expected rather than a surprise. Going beyond visibility, APM provides
    additional root-cause debugging support, called *observability*. For example,
    with observability, an application’s drop in performance might be attributed to
    a node in the cluster failing to process requests and not a problem with the code
    itself.


    ### Clear ownership


    APM enables DevOps engineers to manage the end-to-end life cycle of production
    code through observability and clear ownership. Clarity of ownership allows for
    the designation of specialized individuals who can respond to issues rapidly.


    ### Iteration speed


    Ultimately, a streamlined process with clear stakeholders and availability of
    monitoring tools for broad visibility enables your teams to deploy and identify
    and fix issues quickly, thus reducing the time between iterations and maximizing
    the impact of each iteration.


    ## Application Performance Metrics


    The typical metrics that are measured for application performance are:


    ### API latency


    The amount of time the system takes to perform an action, typically measured in
    milliseconds (ms)


    ### Queries per second (QPS)


    The amount of times the API is invoked every second


    These metrics are vital for an application team to monitor the scale and load
    their application is able to handle. They are also the basis for any automated
    alerts or trigger-based events, such as system failovers, and can feed into an
    automated scale management solution such as cluster resizing or node pool resizing
    (a way of managing the number of computers the API is using to process its requests).
    With cloud computing becoming more and more accessible, companies are migrating
    many of their applications and workloads to the cloud, making monitoring these
    metrics ever more important.


    There might be a day—say, Black Friday—when your systems get flooded with requests,
    causing the application to crash. By simulating such traffic using an APM framework
    and measuring the latency the system will have at any given QPS before the fact,
    your team can capture any issues and design ahead to prevent any failures or performance
    degradations. This is known as load testing and can aid in scaling up systems.


    Real-time streaming data, historical replay, and great visualization tools are
    standard parts of APM solutions today. The popular APM products don’t just offer
    insights into simple statistics but also have API and component integrations that
    are business-ready.


    ## The Rise of MLOps


    As applications have started to adopt more advanced decision-making algorithms
    and models, the management and tooling required to ensure high performance has
    become more complicated. With code-centric applications, it’s fairly trivial to
    test whether they are doing what they’re supposed to do. But ML and AI models
    are data-centric, which adds many challenges that traditional DevOps teams are
    not used to dealing with (like ensuring data integrity and validity). This is
    where MLOps comes in.


    Machine learning operations, or MLOps for short, is an amalgamation of cultural
    practices around data and its usage, data science, and tools that all aim at rapidly
    iterating through versions of a model or running experiments rapidly to test different
    hypotheses. MLOps does not exist in isolation from DevOps, and they need to work
    hand in hand to ensure that all bases are covered and that any issues can be addressed
    and resolved with little effort from your teams. We will cover the ML life cycle
    and some aspects of ML in Chapter 3 of this report, but for now let’s look at
    how MLOps compares to DevOps.


    ## MLOps Compared to DevOps


    MLOps and DevOps both come from the same foundations and are focused on rapid
    iteration and continuous improvement. Without frameworks based around these philosophies,
    teams will have a hard time establishing efficient cycles and will yield few fruitful
    results. Both MLOps and DevOps propose validating and testing any system before
    it is released. However, they lack when it comes to observability and monitoring.
    This is where APM shines for DevOps, as it offers full visibility into an application,
    allowing teams to find the root cause of a problem as soon as it becomes apparent.


    ML/AI models are inherently black boxes; data scientists do not always know why
    and how a model works. But this lack of visibility can’t be solved with a one-size-fits-all
    solution, because each model is unique. Therefore, the testing and validation
    you need to perform to properly monitor a model require a lot of planning and
    work.


    ## Model Performance Metrics


    There are many different types of machine learning (ML) models, each with its
    own nuances and metrics that it needs to track. ML models are highly data-centric
    and rely on the quality and consistency of the data being fed into them. Here
    are some examples of the sources of complexity in ML models today:


    - *Versatility*


    ML serves a wide range of use cases—anti-money laundering, job matching, clinical
    diagnosis, and planetary surveillance, just to name a few.


    ### Architecture


    ML algorithms can take many forms, which are easier or harder to interpret; they
    range from simple logistic regression and decision trees to advanced neural networks
    for deep learning.


    ### Variety


    ML models come in many varieties (tabular, time series, text, image, video, and
    audio), and often these modalities are mixed for certain domains, further adding
    to the complexity of tracking the performance of the model.


    ### Volume


    The rise of cloud computing has enabled teams to train multiple models with more
    data in parallel, which makes it harder to keep track of the training data.


    Teams must be able to monitor sudden changes in data distributions that might
    lead to bias. Other issues might arise from the model being trained on too little
    or too much data, making it underperform. Tracking all the parameters that can
    affect a model’s performance is much harder than tracking code changes in a repository.


    The metrics often used to track model performance are:


    ### Accuracy


    The percentage of total predictions that were actually correct


    ### Precision


    The percentage of positive cases that were correctly identified


    ### Negative predictive value



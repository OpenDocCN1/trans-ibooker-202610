    A lot of times, moving on to work for a new company can be an excellent choice,
    but as with everything else, you need to leave the right way. If you decide to
    move on, define your ideal job and manager, create a plan, and set your goals.
    Never burn a bridge behind you. No matter what, follow the golden rule to “do
    unto others as you would have them do unto you,” which means giving adequate notice,
    assisting with the transition, training your successor, helping your soon-to-be-former
    teammates succeed, and keeping all communications professional and positive.



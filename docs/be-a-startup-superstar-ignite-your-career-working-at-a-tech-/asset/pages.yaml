  md: '# Walk in Others’ Shoes


    Leadership relies, almost more than anything else, on empathy. If you want to
    inspire people to work their hardest, come up with their best ideas, and love
    working for you, you need to understand their feelings and their perspective.
    Developing this one skill will give you the ability to know what to say to motivate
    them and what environment they need in order to perform at their best. This soft
    skill is an absolute necessity for succeeding in the C-suite, especially in the
    start-up world. Start-ups tend to attract diverse workforces and also employ remote
    workers who might come from places as far flung as Norway or India. Effective
    cross-cultural communication completely depends upon strong empathetic skills.


    That, and the fast-paced start-up environment, means that you need to develop
    the ability to see something from someone else’s perspective on the fly. This
    applies to understanding the boss’s reasoning behind a request or mandate, seeing
    the customer’s perspective, or understanding a co-worker’s thinking.


    For example, if a co-worker says, “I propose we add lavender paisleys to our product
    packaging,” and you think it’s the dumbest idea of the month, you can train yourself
    to respond along the lines of, “I can see that you’re excited about that idea.
    Tell me more about why you think that fits with our brand.”


    This gives them a chance to be heard and gives you a chance to glean a greater
    understanding that might prove valuable in some way. It also inspires them to
    keep sharing more (and hopefully better) ideas in the future.


    In any culture, the lack of empathy will stop a leader in his or her tracks. I
    once worked with a high-performer whose department suffered from high turnover
    among his direct reports. He was known for being inflexible, demanding, and curt
    in his communications. He never sought to understand the perspectives, needs,
    and feelings of others. His most memorable trait was interrupting when someone
    else was talking. Everyone knew it, and we all just resigned ourselves to the
    fact that he would bust-in midsentence when someone else was talking. It was as
    though his priorities and ideas were the'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'only ones that mattered. In short, he was the ultimate “I” person, and you
    could see it in everything he did. All of his emails were littered with “I” statements,
    and whenever he spoke in meetings it was always “I, I, I,” and never “we.”


    Eventually, this kind of attitude wears people out, and they stop wanting to work
    for you. For this reason, make sure to change the “I” to a “we” whenever possible.
    It’s one small way to be seen as a better leader and team player, and it will
    help you take your career further. Being an “I” person, like the man mentioned
    earlier, can tank your career. It happened to him; even though he was a high performer,
    the CEO had to can him because the costs associated with the high turnover rate
    he produced became insurmountable.


    Some people mistake this type of attitude for good leadership. They think that
    it shows strength and makes them bold, decisive leaders. While you want to be
    all of these things, the only things that an inability to empathize and listen
    displays is your own arrogance and insecurity. In the end, this will hold you
    back. I’m sure you also know talented people who act this way, firmly keeping
    their own shoes triple-tied and buckled, maybe duct-taped and zip-tied to their
    feet so they don’t have to consider anything from another’s perspective. Imagine
    you had the chance to promote one of these people. Would you? Of course not, because
    nobody would want to work with them, and like I said, we all want to see the people
    we like succeed.


    The data backs all of this up. In a 2018 study conducted by Businessolver, 87%
    of CEOs say they see a direct link between workplace empathy and business performance,
    productivity, retention, and general business health. Additionally, the study
    found that 81% of employees said they would be willing to work longer hours for
    an empathetic employer.¹ Authenticity and empathy are the new business strengths.
    They build a greater level of trust and strengthen relationships in ways that
    benefit everyone.


    > ¹ Karen Higginbottom, “Why Empathy Matters in the Workplace,” *Forbes* (May
    31, 2018), https://www.forbes.com/sites/karenhigginbottom/2018/05/31/why-empathy-matters-in-the-workplace/#7f2af6da1130.'

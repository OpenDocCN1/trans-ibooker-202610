  md: 'mitigate the risks and provides you with the *Five Key Traits* to look for
    when selecting a tech startup before applying for a job. Part Two shares the *Seven
    Keys to the C-Suite*, the traits they don’t teach you in college or on the job.
    These leadership attributes and an entrepreneurial mindset will separate you from
    the crowd and accelerate your career.


    *Be a Startup Superstar* will help you make better decisions, get better outcomes,
    and raise your potential to the next level of success. There has never been a
    better time to stop climbing corporate ladders and start riding the tech startup
    rocket—straight to the top!


    **STEVEN MARK KAHAN** is the CMO of Thycotic, an IT security company based in
    Washington, DC. An award-winning cybersecurity marketer and startup entrepreneur,
    Steve has successfully helped to grow seven startup companies from early-stage
    development to going public or being sold, resulting in more than $3 billion in
    shareholder value. He is known for his ability to plan and execute marketing strategies
    that accelerate a company’s revenue, grow its market share, and consistently deliver
    superior returns for its shareholders. Connect with Steve at StevenMarkKahan.com.'

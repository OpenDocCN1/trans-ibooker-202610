  md: 'Kevin Klausmeyer, a financial expert and noted recruiter of top-flight talent,
    says that two qualities he looks for are passion and tenacity. He goes on to say,
    “When I say passion, I mean they wake up every day with a super positive frame
    of mind, willing and ready to take on anything that gets in their way.”⁸


    Klausmeyer asks interviewees to share about scenarios where the dynamics changed
    and they had to pivot, or to tell him stories around something they did in school
    or when working as a team. He uses the vigor and enthusiasm with which interviewees
    tell their stories to gauge their level of passion.⁹ In short, it’s not enough
    to simply have a lot of passion—to be an effective leader and attractive candidate
    for recruitment, you need to be able to communicate it.


    # Keep Your Surroundings Positive


    I choose to surround myself with positive, optimistic (yet realistic), people.
    They are more fun, more resilient, and they make better decisions under stress.
    They don’t sweat the small stuff. And they help to keep me optimistic, too.


    On the flip side, I’ll go out of my way to avoid negative people—they are a drain
    on energy. It seems as if some people carry around a giant straw they use to suck
    the life out of everyone. I strongly suggest that you do your best to avoid these
    types as well. Give them a wide berth, and don’t let yourself get dragged down
    into their negativity. One key to this is avoiding the rumor mill. Never talk
    negatively behind the backs of any of your co-workers, especially while you’re
    at work. These are simply distractions and opportunities for insecure people to
    make themselves feel better in the short term, but in the long run, it will undermine
    people’s ability to trust you and hog-tie your career advancement. Don’t give
    in to it.'

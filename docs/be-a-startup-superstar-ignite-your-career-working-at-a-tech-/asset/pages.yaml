  md: '# Set Clear, Inspiring Goals


    No one reaches lofty heights without lofty goals. If you want to lead, then your
    goals need to inspire you to jump out of bed and give everything your best each
    morning. For a goal to be truly attainable, whether it be applied to projects
    and initiatives, health and fitness, relationships, or your career, you must give
    it this level of enthusiasm.


    Far too often, people get stuck in low-level positions because they let the inertia
    of a daily workload distract them from their biggest dreams. Without a larger
    goal to work toward, years slip by, and you run the risk of going nowhere. If
    you don’t set the goal, then by default, your career goal will become merely to
    get through another day. Don’t let this happen to you. Use the opportunity of
    working with a start-up to set big goals that inspire you.


    With 100% certainty, I would not have achieved anything big or inspiring without
    first setting the goal and then asking trusted advisors for guidance when I found
    myself beyond my depth. Everything I have achieved in my career has come from
    setting clear, specific short- and long-term goals, with an overarching “why”
    that drives me.


    # Three Pillars of Goal-Setting


    Not every goal is created equal. If you want to see results, master the skill
    of crafting goals. I’ve determined that every good goal rests upon three pillars:
    specificity, relevance, and competitive attention. Leave out any one of these,
    and your goal will crumble.


    **Specificity** means to be precise in the wording of your goals. “I will sell
    more than I did last year” is not a goal, it is just a lame collection of vague
    words. “I will sell 15% more each month for the next three months” is a specific
    goal.


    **Relevance** means that each goal should be difficult to achieve and directly
    applicable to your career and path. If you undershoot, you’ll underperform and
    never reach your potential. So, here’s the question: what would you dare to accomplish
    that would provide'

  md: '# Getting Hired


    Finding companies to apply to and even get your foot in the door is only the first
    part—no matter what, there will be an interview process, and you have to nail
    it. Going into the interview, make sure that you’re ready to demonstrate that
    you have the skills, and more importantly, the mind-set that they are looking
    for. As I’ve mentioned, start-ups place less emphasis on your education and prior
    experience than large corporations.


    Doug Erwin, the serial tech entrepreneur I mentioned earlier in this chapter,
    says when he’s hiring at a start-up, “I look for people who want to build solutions
    to solve problems. People who have failed and then succeeded, and who aren’t afraid
    to take chances. I look for people who are prepared. People who are good communicators
    and who have a sense of humor and can laugh at themselves. And, of course, people
    who have the skills to do the job. I want people who show they can think outside
    the box.”


    What does this look like? Erwin tells the story about when he used to have a friendly
    annual meeting with the head of HR at Southwest Airlines. On one visit, Erwin
    waited in the lobby with a bunch of men interviewing to be pilots. Erwin says,
    “The lobby was full of these serious men with cropped hair, obviously military
    pilots. Someone came into the lobby and announced, ‘To all of you interviewing
    for pilot jobs, we are only interviewing people in shorts. Thank you very much,’
    and then disappeared back through the door. I saw one guy cut his pant legs off
    right there in the lobby. Others ran out to their cars and put on their gym shorts,
    and came back in.”


    While Southwest Airlines isn’t a start-up anymore, their HR team demonstrated
    a start-up mentality in seeking quick-thinking people who were willing to go all-in
    and have a sense of humor. Bring that energy to your interview, and it will make
    you stand out to start-up leaders.


    Great energy will help, but the single fastest way to snag the attention of a
    start-up founder is to have an elevator pitch—for'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'yourself. This seems incredibly simple, yet most people don’t do it. When you
    go into an interview, you need to be selling yourself, your brand, and what you
    will bring to the start-up that nobody else will. For example, my elevator pitch
    for myself is, “I deliver plans for marketing strategy and execution that help
    start-up companies achieve breakthrough revenue growth in brutally competitive
    marketplaces.”


    One sentence that describes what they get when they hire me. And notice, it’s
    not shy; it’s bold and concrete. “Breakthrough revenue growth” operates well because
    it’s vague (not a specific numeral), but clearly conveys that I will take revenue
    to the next level breakthrough. And notice *brutally*—I could have said very or
    hyper or extremely, but brutally tells you that I am somebody who’s accustomed
    to working in fields where the competition can be cutthroat. You want to create
    your sentence so that when people hear it, they say: “Oh, how do you do that?”
    Once they ask, then you can follow it up with your story.


    Of course, I have years of success to back this statement up. But this elevator
    pitch tactic holds up in all situations. No matter where you are, at any point
    in your career, you need to be able to succinctly express what makes you a unique
    asset. As an example, let’s say that you’re fresh out of college, looking to join
    a sales team, and you don’t have much experience. Your statement might be, “I
    help companies I work for to increase sales by listening to customers and providing
    them the best solutions to solve their toughest business challenges.” Then, you
    tie it into who you are. You might not have much sales experience, but they’ll
    ask, “How do you do that?” And you’ll say, “I’m a hard worker and I learn rapidly.
    I’ll aggressively research the product, the market, and the competition. I’ll
    listen to our customer’s biggest challenges, and show them how our product is
    a solution, if indeed it is.”


    Finally, don’t be afraid to tell them how what you bring to the table is unique.
    Say that no one else will listen better than you, work harder than you, or know
    their products and the advantages over competitors better than you. If you come
    in with this level of preparation, a concise explanation of what you provide,
    and the right attitude and energy, you’ll have a much better chance at getting
    the head of a start-up to roll the dice on you.'

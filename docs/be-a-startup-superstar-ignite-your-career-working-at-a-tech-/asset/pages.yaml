  md: '# How to Foster Optimism in Yourself and Your Environment


    I’ve been fortunate to have worked in a number of amazingly positive work environments,
    but I’ve experienced the negative ones, too. I’ve often thought about what separates
    those positive work environments from the stiff, gloomy ones. Is it the people,
    the culture, the success trajectory, or the perception of the difference we make
    in the lives of customers? The answer: it’s all of those things.


    Like gratitude, optimism and energy are infectious. Just by practicing them within
    yourself, you can have a massive effect across the entire company. For example,
    recently at Thycotic, we hired a new, young employee. He asked me for guidance,
    and I agreed to meet him at the end of a day after I’d had two four-hour meetings.


    As I entered the room for my meeting with him, I felt completely drained. But
    this kid came in with a giant smile and tons of enthusiasm and energy. After that
    meeting, I felt completely revived. He came to me for help, but that day, just
    being around him helped me! Being like that kid—positive, energetic—is a choice
    you can make, and it’s one that will put you on the radar of higher-ups the next
    time they’re looking for someone to promote.


    This is not to say it’s easy. As Joe Robinson, a work-life balance trainer and
    speaker points out, “The negative side is much more powerful than the positive,
    so we have to be proactive about bringing the positive forward.” He goes on to
    explain that research from the University of California’s Barbara Fredrickson
    shows that to keep a cheery disposition, we need three positive events to every
    one negative event. Of course, that doesn’t mean you need three more positive
    things than negative things to happen every day, just that you need to focus on
    three more positives than negatives a day.¹⁰


    > 10 Posted by Joe Robinson, "Working Smarter: How Optimism Boosts Productivity
    and Work-Life Balance," https://www.worktolive.info/blog/bid/336460/how-optimism-boosts-productivity-and-work-life-balance.'

- pgno: 183
  md: "# HOW TO FIND A JOB AND QUICKLY  \nCLIMB THE RANKS AT A TECH STARTUP,  \nEVEN\
    \ IF YOU’RE NOT A TECHIE\n\nAn increasing number of recent college graduates are\
    \ underemployed or struggling to find a fulfilling career. For many, the well-worn\
    \ path from an MBA program to the daily corporate grind appears to be the only\
    \ option—they seem blind to the possibility of working for a company that’s just\
    \ starting out. Tech startups are springing up everywhere. You don’t have to be\
    \ a tech wiz to succeed at a tech firm; these up-and-coming companies are desperate\
    \ for all kinds of talent and creativity from people with new ideas and leadership\
    \ skills.\n\nBe a *Startup Superstar* is a must-read book for any recent graduate\
    \ or job-seeker looking to turn their general business know-how into a successful\
    \ career at a tech startup. In the years since he left his safe corporate job\
    \ to work in the world of tech startups, author Steven Mark Kahan has successfully\
    \ helped seven startup companies sell or go public. In this book, Steve shares\
    \ his insights on getting hired in a fast-paced workplace where you can be creative,\
    \ make good money, rise to the top, and stay there.\n\n> > “Be a *Startup Superstar*\
    \ is the book I wish I had when I was in university and considering a career in\
    \ business. It’s a deep dive into startup culture.”\n> >\n> > —Excerpt from the\
    \ Foreword by David Meerman Scott, bestselling author and business growth strategist\n\
    \nBUSINESS & ECONOMICS/Entrepreneurship  \n$27.95 USA/$33.99 CAN\n\n![](img/bf6d6350e5469b2432eea642e445fdf5_183_0.png)"

  md: 'out a ton of top-notch work. This can be a challenge if, for example, you’re
    a night owl and your boss is a morning person. They might see you come in a bit
    later in the day and say something like, “Why is it that I never see you in here
    at 7 a.m.?” To which you can say, “Well, since I leave so late, between you and
    me, I think we’ve got the clock covered.” You can defuse a potentially tense situation
    by turning it into a joke, and reminding your boss that you still get the hours
    in. If you’re polite, any competent manager will respect the work schedule that
    maximizes your personal results.


    # Live Life to the Fullest


    I vividly remember conversations with my grandfather when he described how, someday,
    he would open a deli in Chicago. His eyes would sparkle and he’d smile as he described
    his plans with passion and detail. He had the entire business plan in his mind.
    You could tell he had put years of time into thinking through every detail. But
    eventually, all of these conversations ended with his spark of passion fading,
    and him falling back into his well-practiced excuses. I would tell him it wasn’t
    too late, but he passed away six months to the day after the last time he shared
    his restaurant dream with me. My grandfather was an amazing man who accomplished
    much, but he never acted on the true burning desire of his heart to open his restaurant,
    and he died with regrets.


    We all want to live life to the fullest and say yes to the people, experiences,
    and careers we’re passionate about. Yet so many people, like my grandfather, sit
    on their dreams, and end up in old age pondering the things they woulda, coulda,
    shoulda done if only the time or situation had been exactly right. Here’s the
    thing: the situation will never be exactly right, and neither will the time. You
    will never reach a point where you’re completely ready to follow a dream. You
    just have to start.


    So, how do you start? Figure out what you want. Close your eyes. Ask yourself
    these questions and answer them honestly. What are you super passionate about?
    What do you keep putting off? What'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'type of workplace would invigorate you and your dreams? Do you already regret
    some area where you haven’t yet taken a leap of faith? Are you willing to take
    that leap now? How will you feel when you start taking action on your passion?


    If you answer these questions honestly, you’ll have an idea of what your dreams
    and passions are. Once you have an idea, start to take the first baby steps toward
    those goals, make time for them on your calendar, do your due diligence, and take
    the leap.


    Watching my grandfather die with so many regrets broke my heart. Yet I learned
    from his suffering. I have taken many leaps of faith—in fact, my entire career
    has been a series of leaps of faith. Often, I did not know how I would achieve
    a result, but I trusted that I would figure it out. I did not know how it would
    work out for me to change companies, or if the new company would be successful.
    But I’ve learned that if we make time for our dreams and priorities, we will achieve
    the landing on our leaps of faith more often than not.


    I’ve gained career and life success beyond my wildest dreams, and it all started
    with the biggest, wisest leap of faith I ever could have made: joining a tech
    start-up.'

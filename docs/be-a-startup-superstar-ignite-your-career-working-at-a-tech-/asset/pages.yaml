  md: 'His risky all-or-nothing batting style sent him on a record number of triumphant
    trips around the bases, and a record number of walks straight back to the dugout.


    The lesson: you won’t hit a home run if you don’t take a chance and swing. Don’t
    get confused. I’m not advocating for swinging hard at every opportunity. I’m advocating
    taking big swings at ripe pitches, in game-changing moments, after you have prepared
    and practiced.


    I’ve developed a reputation as a risk-taker, but I don’t see myself that way.
    I see myself as a calculated risk-taker, and there’s a big, subtle difference.
    A risk denotes unnecessary action that’s often impulsive and driven by emotion.
    A calculated risk means taking a chance after you’ve done your homework and prepared
    a Plan B (and Plan C, if necessary). If you never take a risk, you won’t go anywhere,
    but if you take lots of big risks, you’ll likely falter. To create an impact,
    you must be willing to take calculated risks.


    Even with calculated risks, you’ll still lose occasionally. I did—while nearly
    all of my bold moves paid off, a few fizzled. For instance, I once sunk a huge
    amount of time and money into a new marketing campaign. The campaign’s theme was
    bold and different, and our team expected that this difference would lead to greater
    success. It flopped miserably. Though I dreaded telling the CEO, I took full responsibility
    and provided solutions to move forward. This strikeout hurt, but it also fortified
    my character, resilience, and knowledge so I could hit a home run the next time.
    Which I did.


    Even though I failed on that attempt, I didn’t stop taking risks. If you’re bent
    on maintaining the status quo, you won’t last long at a start-up. To ignite your
    career, you’ve got to be willing to shine a light on the important things that
    must change, and to lead the effort. This doesn’t mean challenging everything
    so you’re perceived as an anti-establishment contrarian. It’s more about challenging
    the old ways and creating new, better ways where it counts. Focus on taking calculated
    risks and innovating in areas where your special brand of thinking can make the
    biggest impact, such as increasing revenue, lowering costs, and improving customers’
    lives.'

  md: 'hours and job demands that they stopped exercising and started to neglect their
    own nutrition. Don’t let it happen to you!


    One of the most common excuses people give for not exercising is that they “Don’t
    have time to exercise.” Whenever I hear this one, I always ask, “Do you watch
    TV in the evening? Do you sit in needless meetings? Do you make time to work on
    your priorities? Can you block off your lunch hour every day?” If they answer
    yes to even one of those questions, then they have time to exercise.


    Even Richard Branson, who founded the Virgin Group and has started more than 400
    companies, makes the time for working out.⁷ He described his “systematic fitness
    programme” to keep his weight down and build his bone mass and muscles. He says
    that every day he does an hour of weights and band stretches, changing workouts
    and muscle groups every other day. He also plays tennis and enjoys ocean kitesurfing.
    If Branson can find the time to work out while planning a space trip and running
    the Virgin conglomerate, then you can, too.


    Of course, setting aside workout time can be more difficult in a start-up setting.
    While larger companies may have employee wellness teams, on-site gyms, or a complex
    wellness program complete with incentives, start-ups often don’t have the bandwidth
    or budget for such initiatives. Employees are often left to maintain their health
    on their own accord, so you have to be proactive about managing your fitness.
    If you don’t want to get sweaty in the midday, at least take a refreshing mental
    break to get away, take a walk, or find a park bench and read a nonwork book—anything
    that gives your mind a chance to disconnect and reboot. After work hours, go to
    a gym or go to YouTube where you can find everything you need to exercise outside
    or at home with free online guidance. Any exercise is better than none, so take
    the walk, take the stairs, get out of the rideshare car a few blocks early so
    you can walk the rest of the way, stretch at your desk, go dancing after work,
    or hire a trainer. Bottom line: do whatever physical activity makes you feel good.



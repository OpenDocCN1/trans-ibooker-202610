    # Financial Rewards


    If you aspire to work in a big corporate environment because you think you want
    the security, predictability, well-defined processes, and better pay (sometimes)
    from the start—beware. What you’re really buying into is limitation. I see it
    all the time in my dealings with large corporations: the old corporate mind-set
    is filled with bureaucracy, politics, boredom, pigeon-holed roles, and fewer opportunities
    for employees to shine. All of this translates to minimal financial rewards. It’s
    hard to stand out in a company with thousands of employees.


    Go to work for a big company, and you’ll get a paycheck—a paycheck and a 4% annual
    raise along with a formal review from a manager who dreads delivering it. The
    *potential upside* is far greater at start-ups. And the initial financial rewards
    might not be too bad either. Depending on the size, cash flow, and product launch
    status, a start-up may offer a competitive salary right off the bat, or it may
    start you off with a modest salary with the potential to own a piece of the pie
    through stock options. The stock options could lead to astronomical compensation
    later on, if the company is successful.


    In my opinion, always go for the stock options. A good rule of thumb: the earlier
    you get in at a start-up, usually the better. For example, if someone joined Thycotic
    in 2019 and took stock options, they’d get their options at the current fair market
    value, which, for the point of this example, let’s say is $10, while if you’d
    gotten into Thycotic at the ground floor when the options were valued at, say,
    $3, then you would have gained $7 per unit. The earlier you get in, assuming the
    company grows, the more money you can end up making.


    The second piece to stock options is just how important they can be for personal
    wealth. In my experience, as you grow in your career and move up the ladder, you
    have the opportunity to make more money. And, as you get older, you get new responsibilities.'

  md: 'is properly capitalized so it has the best chance at stability and growth.
    Choose a start-up that has a long enough runway for it to get off the ground.
    That means there’s enough money to go from development through marketing and launch
    and pay its people well along the way. This is not too much to ask; it’s a non-negotiable
    requirement.


    *Even if they offer stock options, you should never accept stock options in place
    of a livable salary, because if they’re making that offer, it probably means they
    don’t have enough money to launch, and those stock options won’t be worth the
    paper they’re printed on. A too-short financial runway means the start-up may
    run out of tarmac and, at best, putter out, at worst, crash and implode.*


    During an interview, ask questions such as, “How is the start-up funded? What’s
    the five-year plan? How long is the runway? How tight is the budget right now?”


    Find out where the money is coming from. Is it self-funded or are venture capitalists
    behind it? Who has skin in this game? The answers to these questions will give
    you a good idea about not only the funding, but whether the leaders are inclined
    to tiptoe around the financials. If they lean toward vague answers, it would be
    hard to feel confident about their ability to be up front about the company’s
    health in the future. Look for transparency and straight-shooting conversations
    about financials. Also, VCs often list on their websites the companies they fund,
    so you can use this bit of research to confirm that a start-up’s funding is legit.


    While funding is technically the start-up’s lifeblood and a concrete indicator
    of its chances for success, there is a bit of a chicken-and-egg scenario at play.
    If the management team is strong and the product solves a problem, then the funding
    will come. You’re just usually better off to delay making a commitment until the
    funding is in place.


    Those are the criteria I use to evaluate start-ups. Only go to work for one that
    has a combination of all five. Three, even four, won’t cut it. If you want to
    zoom to the C-suite, you’ll need an environment with these conditions to spur
    you forward.'

  md: 'as those who would be able to lead with a steady hand and a plan when they
    had a chance to move up to a leadership role.


    You can’t control your competitors’ moves, nefarious people, or the weather. You
    can, however, have the right principles in place (individually, as a team, and
    as a company) so you can handle potential chaos in an orderly way.


    This doesn’t mean overanalyzing everything that could go wrong to the point of
    fear and overwhelm. That’s counterproductive—if you get stuck thinking about everything
    that might not work out, you’ll never be able to get anything done. Instead, focus
    on these six ways to build your propensity for creating order out of chaos, and
    stand out as a potential leader:


    +   1. **Embrace the chaos.** While some people shy away from it, great leaders
    lean in. They realize that turbulence is part of flying, and you have to fly through
    it.

    +   2. **Focus on the destination.** Chaos is distracting and noisy. Maintain
    clarity around where you are headed. When kids are learning to ride a bike, they
    quickly realize that they have to look up ahead. If they stare at their spinning
    front tire, they will soon crash, and the crying won’t be pretty.

    +   3. **Focus on the must-haves, not on the should-haves.** Establish order in
    the most critical and largest areas first.

    +   4. **Be the model.** No matter what position you currently hold, or the level
    of instability around you, you can demonstrate your leadership with a clear purpose,
    determination, and a sense of calm.

    +   5. **Communicate professionally.** Take a deep breath before you speak, and
    don’t allow your emotions to get the best of you. Others will notice what you
    say and your body language, even in the midst of chaos.

    +   6. **Properly manage expectations.** People naturally want to take action
    to quickly eliminate chaos. Resist that temptation. Sometimes, fast action only
    exacerbates the crisis. You won’t be able to resolve every crisis instantly or
    in one fell swoop, and make sure that you and your team are aware it is a process.'

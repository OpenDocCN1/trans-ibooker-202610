- pgno: 69
  md: 'If you don’t take responsibility for your mistakes, it will put you on the
    fast track to the can. When I led a team tasked with rolling out a digital channel
    to market our product to a new audience, we had a short deadline. Everyone needed
    to work hard and meet their individual deadlines for us to be successful. Most
    people did, but we had one employee who never finished his work on time, and who
    never gave updates to the rest of us. This held back the project and sent us scrambling
    to pick up his slack, but whenever somebody confronted him, he blew it off like
    it was no big deal. His teammates, fed up, bypassed him and stopped inviting him
    to project meetings. And I fired him before he had a chance to ask, “Can we shift
    the dates again?”


    Accountability works two ways. You need to hold yourself accountable to meet deadlines
    and produce excellent work. The best way to do this is to be ultra-clear about
    project ownership, goals, timelines, outcomes, and metrics, so that you know your
    commitments. If a responsibility isn’t clear, ask for clarity. Then, as I’ve said
    before, take it a step further and write down your personal goals and plans on
    a sticky note or index card and keep it readily available. Regularly review them,
    monitor progress and performance, and adjust.


    The other side of accountability is accepting when other people hold you accountable.
    There’s a phrase that knocks around the start-up world, “One throat to choke.”
    Essentially, it means that, at the end of the day, there should be one person
    who is ultimately held accountable for any given project, and that usually ends
    up being the leader. While other workers might have their own responsibilities
    and tasks, ultimately it falls to one person to make sure that everything works.
    And, in my experience, this sort of centralization is vital. If there’s one central
    authority delegating those tasks and then making sure that they’re done well and
    on time, it frees everyone else up to focus on their specific tasks. If you want
    to stand out, lead projects, and eventually land in the C-suite, make sure that
    throat is yours. Embrace the role of taking the lead and being the one responsible
    to ensure the project’s success. Use that position to grow as a leader and impress
    your superiors.'

  md: '+   - Remember the 7% rule: communication is 7% verbal and 93% nonverbal. Watch
    your body language, and learn how to read your co-workers’ body language as well.
    It will allow you to understand their emotional state and respond accordingly.
    For this reason, it’s best to rarely use email and instant messaging to communicate.
    These tools have their place, but they also blur the intent, mask the accompanying
    body language, and make miscommunications far more likely.


    # Get to Know Your Team


    The most important part of empathy is simply getting to know your team. This is
    because, as Prudy Gourguechon, a psychologist who advises executives on critical
    decisions, explains in a *Forbes* article, walking in someone else’s shoes means
    that you “Make sure you are assessing how *they* would feel in their shoes, not
    how *you* would feel in their shoes.”² In other words, your goal is to find out
    how they actually think and feel, not how you think they think and feel.


    To that end, any little bit helps. During lunch gatherings at Thycotic, we play
    games where we each share about our weekends, or we’ll reveal little-known facts
    about ourselves to the surprise and delight of our co-workers. Some of the details
    I’ve shared: I used to dejay, and I also once had a managerial role with the Sugarland
    Skeeters minor league baseball team. Jon in accounting told us about the three
    books of poetry he’d published, and Annette in R&D told us about her antique sword
    collection. Sharing this kind of information, while it might seem trivial, leads
    to a deeper connection. It helps us to know who we are working with, and it builds
    camaraderie and trust.


    Taken a step further, it is also useful to gather information about your team
    in a focused, targeted manner. When I offered to take over



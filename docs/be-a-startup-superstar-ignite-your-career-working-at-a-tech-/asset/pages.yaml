    is that it softens the harsh reality of the inevitable negatives we all have to
    deal with. There is a psychological aspect to why this is true, as Dr. Camille
    Preston explains: “Gratitude, when it’s genuine, has the power to help transform
    the emotional bankruptcy we feel when confronted with negative feedback.”⁵


    Appreciation is one of the easiest ways to make someone’s day, energize them,

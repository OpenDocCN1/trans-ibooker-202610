  md: '# Eat Right


    Good nutrition benefits your body and boosts your brain’s performance capacity
    at the same time. Marcel Daane, acclaimed executive and fitness coach, wrote in
    Headstrong Performance, “In today’s highly competitive and volatile business world,
    executives are expected to be able to accomplish more with less resources, thus
    resulting in a demand for a capacity to inspire, perform, and innovate that is
    much greater than we have ever seen before.... To maintain performance capacity,
    those resources need to be replenished periodically by high quality fuel.”8 In
    short, eating well will not only extend your life, but it will also help you reach
    the C-suite.


    With so many experts promoting wildly different nutrition programs and advice,
    I’m not going to suggest any “fuel” plan in particular, but you already know that
    none of them includes a side of fries. When eating to maximize capacity, avoid
    fried foods as well as foods that are heavy in bread or sugar, as they tend to
    cause an energy crash after you consume them. I like to eat as many different
    types of vegetables as possible and stick to leaner proteins. Some co-workers
    I know find that avoiding large morning and midday meals and just snacking on
    protein foods, like nuts, helps keep them sharp. Find whatever diet makes your
    body and brain feel the best, and stick to that.


    # Sleep More


    Finally, any discussion about health should include the topic of sleep. We spend
    about one-third of our lives sleeping, and we know that how much we sleep impacts
    every area of our lives. If you’re not getting enough sleep, use this as a wake-up
    call to make changes.


    As an article in Inc. points out, sleep is undervalued. “For entrepreneurs, sleep
    is often one of the first casualties of growing'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'a company. In our culture where being busy and working beyond capacity is celebrated,
    sleep is undervalued—but that is changing as we learn more about the importance
    of adequate rest. Instead of being wasted time, there’s mighty ROI in a good night’s
    sleep, especially considering that a lack of sleep contributes to a host of health
    problems from heart disease to obesity to reduced cognitive function. Yet, approximately
    a hundred million Americans don’t get enough sleep.”⁹


    To make sure that you reach the C-suite, and are alive long enough to enjoy it,
    see that you get enough rest.


    Personally, I live by the following rule: sleep when and as much as you need to.
    I think any study that says “you must get X hours of sleep” is B.S. When you’re
    getting too little sleep, you’ll know. You’ll be walking around almost like a
    zombie, unable to focus on your work, irritable, and in want of good ideas.


    Pay attention to how much sleep you get and notice your relative performance.
    That will help you zero in on how many hours you need. I know some people who
    need a full eight hours to be their best, and some who get by just fine on five
    and a half. Find what works for you.


    Duration is only part of maximizing the efficiency of your sleeping habits. The
    other part comes from understanding whether you’re a night owl or an early bird,
    and then, as much as possible, planning your sleep and work schedules accordingly.
    For me, I know that my most effective hours come in the morning, so I get up at
    an hour that most people would think is ungodly, go work out, and get into the
    office usually before most others arrive. Because I know this about myself, I
    try to schedule as many important meetings and presentations in the morning as
    possible. I can still perform in the afternoon, of course, but it takes extra
    effort, so as the day goes on, I try to schedule less and less.


    Now, you may know that you’re a night owl, that it’s impossible for you to get
    up super early and drag yourself to work, but at night, when everyone else is
    asleep, you can sit down, focus, and knock


    ⁹ Entrepreneurs’ Organization, “Wake-up Call: Eight Ways Entrepreneurs Can Get
    More Sleep,” Inc. (November 6, 2018).'

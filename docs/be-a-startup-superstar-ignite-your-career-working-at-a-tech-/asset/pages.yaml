- pgno: 24
  md: '# Chapter 1


    # Use the Tech Start-Up

    Boom to Zoom


    > > A start-up is “the largest group of rebels, rule-breakers, and unconventional
    thinkers that you can find to create breakthrough change in the world.”

    > >

    > > —Chris Kane, co-founder and CEO of Munchmoney


    Picture this: a lecture hall crammed with students in their last semester. The
    professor asks for a show of hands—who is planning on applying to a Fortune 500
    company, or a top five tech giant? A sea of hands rises. A start-up? Merely a
    smattering. This was the scene that my friend, Josiah Sternfeld, professor at
    the McCombs School of Business at the University of Texas at Austin, described
    to me.


    I was surprised. I’d spent my entire career working for a string of tech start-ups,
    making millions of dollars, countless friends, and indelible memories in the process.
    It seemed nonsensical to me that so few business school students had considered
    start-ups, while at the same time so many young companies found themselves in
    talent droughts. With so many unemployed and underemployed young'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'people, I tried to imagine why so few had raised their hands to apply for a
    job at a start-up in tech. Maybe because so many are carrying student loan debt,
    they fear it would be too risky to work for a company with no track record.


    But I had to wonder if all those eager undergrads gunning for the Fortune 500
    gigs ended up employed. I thought not—as my friend discovered, *everyone* wants
    to work for these companies. The big corporates have the name, the prestige, they
    offer stability, and, because they receive so many applications, they can afford
    to be highly selective.


    I did some research, and, as I suspected, many of the “Big Company or Bust” grads
    weren’t enjoying smooth success in the professional world. Fourteen percent of
    young adults with bachelor’s degrees (or higher),¹ and 43% are underemployed,
    according to a report by the labor analytics firm Burning Glass Technologies.²
    So, what’s happening here? Why are so many bright, energetic, and creative young
    people having trouble finding gainful work? Why is it so many recent grads send
    out hundreds of applications that yield little more than an interview or two?


    I read more articles and found out that many of these once-hopeful grads become
    resigned, defeated, and end up taking jobs in the service sector and living with
    their parents, licking their wounds before making a charge at an MBA. Or, like
    me when I first got out of college, they fall into some dead-end, miserable job,
    and wait for the day they can quit.


    If this scenario sounds familiar, if the person I’m describing is you, take heart.
    It doesn’t have to be like this. I once was in your predicament, and I found a
    way out and never looked back. You have other options. Lots of them. Today, you
    can find massive opportunities in technology start-ups, and you don’t have to
    be a techie.


    ¹ IES National Center for Education Statistics. Employment rates of 25- to 34-year-olds
    in 2017. https://nces.ed.gov/fastfacts/display.asp?id=561.

    ² Melissa Korn. “Some 43% of College Grads Are Underemployed in First Job.” *Wall
    Street Journal* (October 26, 2018). https://www.wsj.com/articles/study-offers-new-hope-for-english-majors-1540546200.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# The Unprecedented Opportunity in Tech Start-Ups


    First, let’s examine what a start-up even is. According to the US Small Business
    Administration, a start-up is a firm that’s less than one year old. That, however,
    provides a poor picture of what actually defines a start-up. My friend Doug Erwin,
    chairman and principal of RedHouse Associates and a serial tech entrepreneur,
    offers a more instructive definition. According to him, start-up is a stage. He
    says, “A company is still in the start-up stage if it operates like it’s the last
    frontier for outlaws, a world where nonconformists can live and create and sell
    their ideas.”


    Who doesn’t want to be involved in that? At a start-up, you get to play the rough
    riding rebel on the run, the freewheeling upstart pestering the lumbering, flat-footed
    law. If you go to work for any of the Fortune 500 or Big Tech, you become one
    of those bumbling lawmen—a cog, punching in to pass the days pushing papers in
    a daze.


    “Sure,” you say, “this sounds great. But how do I get in?” Well, the good news
    is, start-ups are proliferating at an unprecedented pace. According to the *Global
    Entrepreneurship Monitor*, worldwide, *three new start-ups open every second*.
    That comes out to 100 million a year.$^{3}$ In 2017, in the US alone, entrepreneurs
    created 404,000 new start-ups.$^{4}$


    The growth in start-ups, and the potential for upward mobility, is particularly
    strong in the technology sector where I have spent my career. My first tech start-up
    experience began more than 30 years ago—long before the boom. If anything, that
    sector is an even more lucrative opportunity now, as new technology permeates
    every aspect of our world—how we work, communicate, travel, eat, exercise, buy
    things, manage our health, move money around, consume entertainment, and even
    interact with our pets.


    $^{3}$ Manoj Madhusudanan, “Fast-Growing, Emerging Firms are Great Targets for
    B2B Sales,” Ziligence Blog (July 16, 2018), https://ziligence.com/blog/2018/07/16/fast-growing-emerging-firms-are-great-targets-for-b2b-sales/.


    $^{4}$ U.S. Small Business Administration Office of Advocacy, Annual Report of
    the Office of Economic Research, FY 2017, https://www.sba.gov/sites/default/files/OER_2017_Annual_Report.pdf.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Naturally, the tech sector has become one of the largest components of the
    US economy. According to CompTIA’s Cyberstates 2019 report, nearly 503,000 tech
    businesses were operating in the US in 2018, marking six consecutive years of
    growth. Fueled by small, emerging tech businesses, employment in the US technology
    sector reached 11.8 million workers in 2018, increasing by an average of 200,000
    new jobs every year since 2010.5 The tech boom is on, and there’s a massive opportunity
    to reap the rewards for anyone who is willing to rise to the challenge.


    This is particularly true now, with an extremely high amount of capital flowing
    into tech start-ups that shows no signs of stopping. From 2016 through the first
    half of 2018, 44,000 start-up businesses received more than $282 billion in funding.
    Forty-one percent of them, nearly half, were technology companies.6


    However, life is not all rosy in the start-up world. The market is saturated with
    ideas and products, so in order to succeed, tech start-ups need a lot more than
    money. They need a unique and valuable product or service, a solid business plan,
    intelligent advertising, effective management, and high customer retention. Of
    course, you can’t just go out and buy any of these things, which means that tech
    start-ups primarily need one thing to succeed: strong teams of people.


    According to a 2018 survey of tech start-up CEOs, 66% said the number-one issue
    keeping them up at night is “hiring good people.” Not acquiring customers, not
    revenue growth, not raising more money.7 While this may seem counterintuitive,
    it’s actually obvious—a company can only go as far as the people who run it will
    take it.


    In the same survey, 60% of CEOs said it was harder to recruit talent in 2018 than
    it was in 2017. So, finding the right talent is a


    5 “Cyberstates 2019” research report, CompTIA, https://www.cyberstates.org/pdf/CompTIA_Cyberstates_2019.pdf.


    6 “These Are the Industries Attracting the Most Venture Capital,” World Economic
    Forum (February 13, 2017), https://www.weforum.org/agenda/2017/02/these-are-the-industries-attracting-the-most-venture-capital/.


    7 “State of Startups 2018,” First Round, accessed December 22, 2018, http://stateofstartups.firstround.com/2018/.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'problem, and it''s getting worse. Add that to the fact that 45% of tech start-up
    CEOs expected to hire 6 to 20 employees in the following year, with 13% saying

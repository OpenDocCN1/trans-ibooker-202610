  md: '# A Role You Can Fill Today with More Opportunities Tomorrow


    Look at the company’s job postings and see if they have needs that truly match
    your interests and areas of expertise. Not all opportunities are posted, so a
    little networking can go a long way toward finding out what a company actually
    needs and how you can help. Don’t settle for a role in which you have zero interest,
    but keep an open mind. Allow yourself the room to imagine what taking on new roles
    would be like. Be willing to be flexible in how you apply your skills. Remember,
    a lot of start-ups haven’t pigeonholed roles and responsibilities yet, and you
    need to be ready to step up when called upon.


    Once you get to the interview stage, ask if the start-up aims to hire people who
    they can develop and promote. Some start-ups promote from within more than others.
    It depends on their culture and their leadership team’s interest in and (usually
    brief) history of raising leaders through the ranks. Many times, I’ve seen promotions
    take place via a tap on the shoulder while someone is filling up a coffee mug
    in the kitchenette: “Hey, Courtney, I’d like you to step into the manager role,
    starting now.”


    Choose a start-up where you can make an instant impact, and grow into a larger
    role. It’s best to choose a start-up that’s in it for the long-haul and working
    to build a great company. If in the interview they’re already talking about an
    exit, then that’s your cue to exit the interview. What you’re trying to do is
    find a strong enough start-up where you can stay long enough to help build a great
    company with lots of happy customers and employees, while developing your own
    expertise and leadership skills along the way. If the interview discussion reveals
    that everyone is focused on selling out, rather than continuing to build the strongest
    possible company, then the selling day will never happen, so avoid wasting your
    time there.


    # The Start-Up Is Well-Funded


    It all rides on the money, honey. Before you get too serious about pursuing a
    job with a particular start-up, verify that the company'

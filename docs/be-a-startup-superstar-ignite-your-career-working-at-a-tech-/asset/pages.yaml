- pgno: 152
  md: 'The key, then, is to train yourself to look for the positive. Here’s how you
    can do that:


    +   - Surround yourself with positive people.

    +   - Regularly spend 30 minutes writing down all the positives in your life and
    the things you’re thankful for.

    +   - Expect highs and lows, and keep them in perspective. Things that seem like
    the end of the world are rarely the end of the world.

    +   - Strive for good enough, not perfection.

    +   - Focus on your strengths, your successes, and your goals, rather than comparing
    yourself to others.

    +   - When you hear negative self-talk in your head, deliberately change it to
    positive self-talk, even if it seems forced at first.

    +   - Gain a mentor’s perspective on ways to build energy and optimism.

    +   - When you feel pessimism setting in, interrupt it. Get out of the office,
    go for a walk, head to the gym, watch a short comedy. Then tackle the issues from
    a more positive, optimistic point of view.


    At the end of the day, you will never achieve great things unless you believe
    you can. This is a huge part of why optimism is essential to reach the C-suite:
    you must believe you will get there, and then believe that once you’re there,
    you can steer the ship the right way, and even when the skies darken, you will
    remember that the next dawn is on its way.'

  img_proc: true
- pgno: 92
  md: 'the most joy and satisfaction? Which mere idea of a goal is so exciting that
    it gets your blood moving? Think about your big achievements as if you were guaranteed
    to succeed. I like to ask a team what success looks like if we go a step further,
    and I call it “Goals Plus One.” Do the same for all of your goals, and they will
    be relevant.


    Finally, **Competitive Attention** means you always aim to maintain an edge. Pay
    attention to what the competition is doing, and set your goals in relation to

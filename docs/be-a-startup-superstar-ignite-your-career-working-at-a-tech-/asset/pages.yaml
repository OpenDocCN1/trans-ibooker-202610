  md: 'One great example: I joined Quest Software, a relatively large public technology
    company, to run their marketing. I realized that our cross-selling was abysmal.
    Customers would buy one product, and that’s it. We sold a bunch of different products,
    some of which we had developed natively, but we had acquired several from smaller
    companies, and our customers weren’t getting the benefit of all we had to offer.


    I undertook the first step of any improvement process: asking a question. I asked,
    “Why is the cross-selling of our own products so poor?”


    I did some research. I went down to the sales floor and interviewed our salespeople,
    asking them to give me the elevator pitch for the company. Almost none of them
    could agree on what it was, and I soon realized that we had so many products,
    the salespeople only pushed the ones they knew best. Then I looked at the website.
    We had no system to organize our products by type; we organized them based on
    how recently we’d acquired them. Imagine if instead of grouping products by shopping
    categories (books, food, clothes, etc.), Amazon had all of their items listed
    by how recently they’d acquired them. You’d never buy anything from them!


    Well, that’s more or less where we were, so I asked two more questions: “Why don’t
    we have an elevator pitch?” And “Why do we organize our products in this way?”
    And everyone told me the same thing—that’s what the chairman wanted.


    I went to the chairman and told him everyone had told me that the reason we had
    a muddled elevator pitch and a hodgepodge website was that he had wanted it that
    way, and I asked him why that was. He, of course, was shocked—he’d never said
    he wanted that. In fact, he had wanted the opposite.


    What happened was that everyone in the company had become accustomed to the status
    quo. They were so used to how things were that they’d invented a story about why
    things were like that, which simply wasn’t true.


    After our discussion, the CEO gave me the green light to revamp the elevator pitch
    and the website. A few months later, my team and I rolled out a compelling elevator
    pitch and product'

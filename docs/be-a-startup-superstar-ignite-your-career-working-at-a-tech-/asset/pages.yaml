    # How to Find Start-Up Opportunities


    As you begin your search, you should keep this in mind—generally speaking, a start-up
    handles hiring in two waves: in the first, they’re just trying to assemble the
    core team. The start-up usually is brand new, and as such, the process might not
    be as efficient. Once the start-up is beginning to prove it is viable and can
    scale, then it makes second-wave hires. These positions tend to be more specialized,
    the hiring process is streamlined, and the company already has a bit of momentum.


    Recognizing the difference between first- and second-wave hiring will help you
    evaluate each start-up you find to determine whether you want to apply, as there
    are advantages and drawbacks to joining with each wave. If you join in the first
    wave, the company will be smaller and in a more precarious position, as they haven’t
    proven viability. For the most part, these jobs are hard to find, and usually
    go to someone with either a personal connection to the founder or some sort of
    a reputation in the start-up world. For that reason, combined with the precariousness
    of joining a'

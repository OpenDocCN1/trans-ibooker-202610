    the lack of a formal HR structure for the reviews themselves. If a review isn’t
    on the calendar at your workplace, ask your manager for it. Request a serious,
    detailed review of what you’re doing well and where you can improve. By asking
    for this valuable feedback, your manager feels appreciated and will see that you
    want to excel.


    I didn’t do that in my earlier years at start-ups, and now I wonder what golden
    gems of insights I missed because I didn’t ask. Reviews also are an opportunity

    # Put Your Family First


    Here’s a secret to my success: I’m a workaholic and I put my family and myself
    first. Even at start-ups where long hours are the norm, you don’t need to sacrifice
    your family to excel or make it to the C-suite. Unfortunately, many make that
    choice and they pay a terrible price. Time is your most precious resource, in
    business and in your personal life. Kids and grandkids grow up, marriages need
    nurturing, and elderly relatives may need attention, too. All too often I’ve seen
    someone climb as high as they can in their career, and then they look at their
    weathered face in the mirror and realize they missed spending time with the people
    they valued the most. Success loses much of its sweetness when you have no one
    to share it with.


    We all face the conflicting priorities of work and family. Each one of us has
    our own unique situations and priorities—there is no one-size-fits-all solution
    to the problem, and, indeed, over the years the amount of time you need to dedicate
    to work and family will fluctuate.


    It’s a constant tug-of-war. Part of the problem stems from living in an age of
    universal technology accessibility. Company leaders often hope and expect employees
    to stay connected and to be available at a moment’s notice at all hours: early
    in the morning,'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'lunchtime, all afternoon, dinnertime, evenings, weekends, and even on vacations.
    If you let them have it all, they will take it. Instead of enjoying the ocean
    with your friends or family, you will be sitting under a cabana trying not to
    get sand in the keys of your laptop.


    To find the right work/life balance, you’ve got to ask the tough question: how
    can you be the most effective provider for your family? The typical answer to
    this question is that work and income have to come first. But that puts you on
    a slippery slope. The right answer to this question is that work and family time
    are equally important because they are interdependent. I know that if I’m unhappy
    in my personal life, it will negatively affect my work life, so I don’t let that
    happen. Likewise, I know that if I’m unsuccessful in my professional life, it
    will negatively impact my family, so I do what I need to do to succeed at work.
    The key is finding a happy medium.


    This medium can seem impossible to find, but you will experience significant benefits
    by seeking it. A study by Family Living Today and NowSourcing reported that 66%
    of full-time employees don’t strongly believe they have achieved a work-life balance.⁴
    The study went on to say that this lack of balance includes both short-term and
    long-term consequences. In the short term, at home, 51% of respondents said they’ve
    missed out on important life events, and 40% said they’ve had time spent with
    the family ruined by work. In the workplace, 68% experienced poor morale, 36%
    reported poor productivity, and 41% reported a high turnover rate due to burnout
    and fatigue.


    The long-term effects are downright scary, as those who lack work/life balance
    carry a higher risk of heart disease and stroke, as well as depression and anxiety.
    Striking a healthy work/life balance could literally prolong your life.


    And it is attainable. I’ve been an executive leader the better part of 30 years
    while keeping my family as my top priority. I’ve always worked hard to set aside
    time for my wife, my kids, their games and performances (when they were young),
    and my friends. It'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'wasn’t always easy, but co-workers have respected and understood my commitment
    to being there for my family. Many have told me that they appreciate the example
    I’d set, as it helped them feel comfortable doing the same.


    The key is to establish a boundary between work and home life and stick to it.
    If you’re going on vacation, don’t work during the day, and only answer emails
    within a specific time window. I also unplug from work while at home and eat dinner
    with the family at least four times a week. Literally, unplugging means no electronics
    at the table or during family time, because if they are on or around, the temptation
    to just tap out a quick email is too strong.


    Of course, there have been times when I’ve been out of town or attending an evening
    board meeting and had to miss a family event. It’s okay as long as it doesn’t
    happen too often. Families understand. As long as this kind of thing is the exception
    and not the norm, then you’ll be well on your way to striking a healthy balance.


    As early in your career as possible, be proactive about putting your family first.
    Be present for important family events and moments. Surprise your family by occasionally
    coming home early or leaving for work later. Schedule work outings that include
    your family. Plan special family activities, but also be there for the day-to-day
    interactions. Work on becoming a good listener to each person in your family or
    close friend group, so you know which types of interactions are most important
    to each one. Co-workers will come and go, but your family is with you for the
    long run and should be paramount.


    # Make Health and Fitness a Priority


    Start-ups move fast, and this requires you to be able to keep up. You must have
    energy and stamina, focus, and be able to handle stress. If you want to excel,
    create time to support your own health and fitness. Taking care of your body will
    pay huge dividends in stress reduction, as well as improve your efficiency and
    overall mood. All of these benefits add up to a higher performance in'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'the workplace. While it might seem like taking care of yourself takes a lot
    of time, the opposite is actually true. You don’t have time not to exercise, eat
    well, and sleep enough. None of us do.


    # Work Out


    Just about any successful executive will tell you that working out is a vital
    component of their success. Dick Costolo, former CEO at Twitter, says that exercise
    “is probably the best investment in yourself that you can make. You’ll get a much
    bigger return from 20 minutes of exercise than you will from another 20 minutes
    wading through emails or being in meetings.”5


    The proof isn’t merely anecdotal. An article by the BBC cited a study showing
    “that regardless of age, people experience ‘immediate benefits’ for cognition
    following ‘a single bout of moderate exercise,’ such as fifteen minutes of moderately
    intense cycling on a stationary bike. These findings suggest that working out
    during the day could be even better than bookending gym time before or after the
    office.”6


    It works for me. I personally work out twice a day—once right when I wake up,
    and again during my lunch break. Before I blocked my calendar during lunch, it
    was difficult to say no to invites during this popular time for casual meetings.
    I would succumb to these working lunches, and as a result, I felt less productive
    and less energetic in the afternoon. Finally, I got my priorities straight. While
    there have been exceptions, I block out the lunch hour on my calendar and politely
    say no to invites. Working out has produced far greater results in my work output
    and my health than using that time for work or socializing ever did. I recommend
    that you do the same—block off that time and protect it.


    Over and over again, I’ve seen new employees at start-ups quickly gain weight
    as they became so caught up in the long work



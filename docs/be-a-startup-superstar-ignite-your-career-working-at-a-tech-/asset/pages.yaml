    I learned this lesson early. At one of my first start-up positions, I earned a
    reputation as someone who delivered, so the leadership asked me to take on a new
    function, well outside of my previous experience. I wanted desperately to impress
    my new manager, so at each meeting with him, I barfed-up a nonstop barrage of
    plans and solutions. He just listened quietly, and I left each meeting congratulating
    myself on how smart and clever I was.


    Even though my team got impressive results, my relationship with my manager soured.
    I couldn’t understand why. Then one day, a mentor of mine asked how I was doing.
    I told him I was down because my manager and I weren’t working together well,
    and I couldn’t figure out why. What else would this mentor do, but ask a bunch
    of questions? After listening to my responses, he said, “Ask your manager more
    of the right questions instead of telling him all the answers.”


    In those days, I carried a notebook wherever I went. My mentor gestured to it
    and told me to write a small question mark at the top of every page to remind
    myself what to do.


    I took his advice. It worked like magic. Turns out my manager had wanted me to
    ask for his priorities and feedback so he could collaborate with my team and me.
    Our relationship improved, and so did our team’s results.


    I see the same tendency to try to act like an expert all the time in young, confident
    professionals. It never works—it’s the rough equivalent of getting “INEXPERIENCED”
    tattooed on your forehead. If you want to impress, especially when you’re young,

    # The Baby Steps


    Once you’ve set your goals, the best way to execute on them is to break them down
    into baby steps. The system I use to break down my goals into steps begins by
    asking the following questions:


    +   - **What** specifically do you want to achieve and what are the milestones
    along the way?

    +   - **Who** is involved and what are their responsibilities?

    +   - **Which** resources will be required?

    +   - **How** will you measure progress to stay on track?

    +   - **When** will you achieve the goal?


    For example, let’s say that I’m setting goals for my marketing team. For the what,
    I’ll set very specific marketing metrics about the amount that marketing needs
    to contribute to revenue growth. But deeper than that, I look at it cross-structurally
    and ask how much revenue the sales team needs to create. I set very specific milestones,

    It’s worth noting that a big opportunity to differentiate yourself is when you
    help to differentiate your company in the market. It’s a double-dip of differentiation—you
    can improve both your own standing and your company’s standing. A great example
    of this came during my time at PentaSafe. When I joined, we were a small, private
    cybersecurity firm competing against three much larger public companies. The thing
    was, we were all selling essentially the same product: vulnerability assessment
    and intrusion detection.


    We needed a way to differentiate ourselves, and because of our limited resources,
    we would never be able to do that with the technology alone. The other companies
    had much larger and more impressive R&D departments. So, I took a look at our
    company and a look at the field, and what I realized was that while the other
    firms focused on the technology alone, nobody was looking at the other side of
    the security equation: the people and the policies.


    We had this project that one of our creative engineers was working on. We weren’t
    sure we’d take it to market. It was a tool that allowed companies to assess how
    well their employees understand the security policies, which is huge, because
    most employees don’t know these policies at all. Usually, they get a huge dump
    of papers, sign them without reading them, and forget about it.'

    \ at PentaSafe, everyone was in the habit of saying a genuine thank you whenever\
    \ it was deserved, even when everyone was time-crunched by deadlines. When someone\
    \ gave a presentation, everyone said thank you. When employees held drive-by impromptu\
    \ meetings at my office door, they said thank you. This made everyone feel respected\

- pgno: 77
  md: 'We went ahead and brought the product to market and we used that as a main
    differentiator. It allowed us to sell ourselves as the only company that addressed
    all three factors in the security equation: the technology, the policies, and
    the people.


    The funny thing is, we hardly sold any of the new tools that would assess how
    well employees understood the policies. On that level, it would look like a failure,
    *but the fact that we had the tool* got us into the door at many firms. Once we
    were in the door, we were able to sell them on our main product and steal business
    from the larger competitors. So, in that way, it was a great success.


    We didn’t stop there. Along with two team members, Chris Pick and Todd Tucker,
    the three of us developed a community we called “the Human Firewall Council.”
    We gathered thousands of people from all over the world together in one place
    to talk about cybersecurity.


    The council really took off. Chris and Todd, after PentaSafe was acquired and
    we all cashed out in a big way, both went on to work for another firm, APPTIO.
    There, they implemented the same sort of council and expanded on and improved
    the idea. This initiative helped them achieve success and move into executive

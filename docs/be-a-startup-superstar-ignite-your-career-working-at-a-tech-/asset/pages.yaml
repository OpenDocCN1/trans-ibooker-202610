  md: '# Show Humility


    I once had an open leadership position on my marketing team, and two internal
    candidates for the job. Both were highly skilled, knowledgeable, proven leaders.
    But there was one major difference: one seemed to credit every good result to
    his own sage wisdom, while the other acknowledged contributions from everyone
    on her teams. I promoted the second because of that confident humility. I knew
    she would share successes with the team, inspire trust and confidence, and admit
    when she was wrong, all of which are powerful tools in building camaraderie.


    We’ve all known “I people” who are out for themselves, taking all the credit,
    hiding the contributions of others, and decreasing morale. Guess what? No one
    wants to help them get to the top. Instead, if you’re a “we person,” giving credit
    where it’s due, you’ll bring out the best in others, and inspire trust and confidence.
    And people will like you, which, at the end of the day, is one of the most important
    aspects of success. People want to see people they like succeed.


    So, what is humility? It is not low self-esteem. In fact, the opposite. Humble
    people don’t boast often, instead, they project quiet confidence. It’s okay to
    toot your own horn, but mainly as a tool to establish your credibility. Never,
    ever, boast just to “impress” people. Being humble is the ability to stand confidently
    in what you know and have accomplished, and remember that you can always learn
    more, and that no single accomplishment is yours alone. It’s the ability to also
    be listening and seeking out ways to grow, and to give credit to how other people
    contribute to your successes.


    Of course, it’s not easy to let go of your ego. Often, people are afraid to show
    humility because they think it makes them look weak. But it doesn’t. As Zachary
    Feder and Khatera Sahibzada point out in an article for Entrepreneur, “Humility
    … requires a substantial inner strength to embody—one that not only welcomes feedback
    and criticism but knows that it is one of the fundamental ways that we grow.”'

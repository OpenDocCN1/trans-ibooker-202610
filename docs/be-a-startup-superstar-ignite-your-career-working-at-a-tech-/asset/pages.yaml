    area.


    When you have selected a list of events to attend, go to them. But don’t just
    show up. Go with a plan. Research the event beforehand, know who will be there,
    and know who you want to talk to. When you arrive with your target list in mind,
    don’t just cruise around asking CEOs for jobs. Introduce yourself and ask questions.
    People love to talk about themselves, so this is the easiest way to establish
    rapport. You can start by asking about the technology at hand, but eventually
    you should personalize it. Ask them about things like what they do for the company,
    what they love about working for the company, what makes the company special,
    and what makes them excited to get up in the morning.


    Listen to their responses. Don’t just feign interest. This is the most important
    thing—nobody likes insincerity and people can always detect it. If you’re serious
    about breaking into whatever the industry is, you should have a genuine interest
    in the answers. Because you will learn, not only about the company, but also about
    how to be successful in the industry. Then, once you get a conversation flowing,
    if a bridge to asking about employment or getting your foot in the door materializes,
    you can use it. You can say something like, “Wow, it sounds like you have the
    kind of position that I would really love to have one day. Do you mind if I tell
    you what I do, where I’m at, and would you mind giving me some pointers?” Then,
    without having seen your resume, they already have a sense of your skill set.
    From there, you can ask if they know if their company is hiring, and if you could
    throw your hat into the ring. This way you don’t come across as desperate, just
    genuinely interested in the company’s work.'

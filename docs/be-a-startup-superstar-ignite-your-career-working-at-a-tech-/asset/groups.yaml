    \ from him as my first mentor.\n\n## Choose Your Mentors\n\nDon’t wait around\
    \ for a mentor to select you. Be proactive about it. Seek out advice when you\
    \ realize that you’re in over your head. Or even better, line up a good relationship\
    \ with a mentor beforehand.\n\nThe key is to choose carefully and wisely. When\
    \ you look for a mentor, first define the areas you want to improve and which\
    \ skills and work habits that you need to be successful in your career. Like any\
    \ other goals, write these down and keep them in front of you. Once you have that\
    \ clarity, look for someone who can help you enhance those skills. Also, be sure\
    \ to find someone who complements your personality, skills, and needs.\n\nA great\
    \ place to start is to look at your goals and then identify people who have achieved\
    \ similar things. Then, pick one or two A-plus-talent types who seem like they\
    \ would be able and willing mentors. This works best if you start with someone\
    \ who already knows your work ethic and with whom you already have a relationship.\n\
    \nMy first mentor told me that he only agreed to help me because he could see\
    \ that I was eager, enthusiastic, organized, and, most importantly, open to new\
    \ opinions and ideas. If you already impress daily in the workplace, finding a\
    \ mentor will be that much easier.\n\nIt’s possible to find mentors among those\
    \ you do not yet know. Mentors make themselves available at tech accelerators,\
    \ business MeetUp groups, and the like. But again, it’s ideal to start from an\
    \ existing baseline of a respectful relationship so you know you and your mentor\
    \ share a connection, trust, and similar views on what you want to get out of\
    \ it.\n\nOnce you have your target, find the right time to engage that person\
    \ and open a dialogue so you can ask if he or she is willing to mentor you. Don’t\
    \ worry about whether the request will be seen as rude or off-putting. Remember\
    \ that almost everyone in a position of power got there because they had mentors,\
    \ and most are looking to pay that generosity forward. Personally, I’ve mentored\
    \ 15 people, and I love seeing the people I take under my wing get results.\n\n\
    The right mentor relationship will seem like a natural extension of the relationship\
    \ you already have. You may want to start by getting together a couple of times\
    \ to make sure it’s a good fit before you both commit to a long-term mentorship.\
    \ Like any other relationship, this one is a two-way street. The best mentors\
    \ take their roles seriously and give you the honest, tough-love low-down about\
    \ yourself that others don’t want to tell you, and they will advise you on the\
    \ best ways for taking action. They can serve as sounding boards. A great mentor\
    \ will always look out for your best interests. All of this can help you reduce\
    \ mistakes and build confidence.\n\nYou have an equally important role as a mentee.\
    \ For the relationship to be successful, take an active role in the partnership.\
    \ It can’t be treated as a casual thing—you must truly desire the insights, wisdom,\
    \ counseling, and coaching, and be ready to receive negative and positive feedback.\
    \ Take notes. Accept the guidance in a respectful way, ask direct questions, follow\
    \ through on advice. And here’s the top responsibility of a mentee: say thank\
    \ you. Mentors only get paid in gratitude, so make sure you offer plenty. They\
    \ believe in the value of sharing their knowledge with the next generation and\
    \ they want to know it’s being put to good use and appreciated.\n\n## Mentor/Mentee\
    \ Relationship Guidelines\n\nThe best mentorships operate under a set of ground\
    \ rules. For example, the mentor will commit to a certain amount of time and frequency,\
    \ and you will act on the mentor’s suggestions and circle back to let the mentor\
    \ know how it’s working out or to seek\n"
  mdcn: "\n任何人都喜欢这样，尤其是坐下来聊聊自己的机会。你不需要刻意去给他们留下深刻印象，也不必对世界上所有问题都有答案。只要真诚、有礼貌，你就能大受欢迎。一旦你们彼此欣赏，魔法就会开始发生。\n\
    \n在创业公司里，你没有任何理由不去接触高层管理人员。如果你在 Facebook 工作，你大概永远见不到马克·扎克伯格。哪怕你靠近他的办公室门口，他的某个安保团队也会立刻把你轰走。但在创业公司，CEO\
    \ 的办公室很可能就在你隔壁，而且门通常是敞开的。尽快去敲门吧。礼貌地询问对方能否安排时间一起喝杯咖啡，聊一聊他们的公司和理念。大多数 CEO 都会欣然接受这样的机会——我曾对那位强势、令人生畏的\
    \ CEO 做过同样的事。他非常乐意交谈，而不可思议的是，我在那次会面中几乎没说什么话。然而，当我离开时，我相信他心里在想：“这小子真不错。”你也可以，而且应该这么做。\n\
    \n主动接近那些在各自领域处于顶尖地位的人，向他们提问以更深入地了解公司或其某个项目，并从中吸取经验，这要好得多。邀请你的经理或高层领导喝杯咖啡，或者进行五分钟的交谈；这会让高管团队看到你是一个有潜力的领导者，认真对待自己的职业发展，并致力于帮助公司成长。\n\
    \n当然，你并不总能控制自己和谁待在一起。有时你不得不和表现不佳的人或心态消极的人共事。在这种情况下，不要喝他们那杯“毒药”。除非万不得已，否则一分钟都别多待，否则他们会把你拖下水，让你士气低落，比你深深叹一口气的速度还要快。虽然表现不佳的人可能是“好人”，也可能交付还算不错的结果，但总体而言，他们是坏苹果，会毁掉整个职场环境。如果你花太多时间和那些“消极的妮莉”待在一起，不仅你的业绩会受影响，你的声誉也会受损。每个人都会觉得你和那些低成就者没什么两样，从而把你视为可有可无的人。\n\
    \n## 找到合适的导师\n\n> 导师是成功创业公司的秘密武器。  \n> ——瑞特·莫里斯，Endeavor Insight 总监\n\n你懂得再多，也总有更多可以学习的地方。在职业生涯的每一个阶段，导师都能帮助你缩短学习曲线，加速你通往高管层的道路。我也不例外——在我职业生涯的每个阶段，都有导师帮助我获得特定专长或消除盲点。随着我的成长，我的需求不断变化，导师也随之改变。总的来说，我先后从\
    \ 10 位不同的导师和引路人那里获益良多。\n\n虽然没有导师也有可能成功，但大多数人做不到。根据美国培训与发展协会的一项调查，75% 的高管表示，导师制对他们的职业发展至关重要。[^2]\
    \ 原因在于，没有人一开始就是某个领域的专家。没有人会指望你在没有老师的情况下，就能在有机化学期末考试中拿 A。因此，没有引路人，几乎不可能在商业中取得非凡成就。\n\
    \n[^2]: Alyssa Rapp，“Be One, Get One: The Importance of Mentorship，”《福布斯》（2018\
    \ 年 10 月 2 日），https://www.forbes.com/sites/yec/2018/10/02/be-one-get-one-the-importance-of-mentorship/#1ec411b74343。\n\
    \n举个例子，我要回到之前提到的一个故事。当时我在 KnowledgeWare 工作，在商界还非常青涩。公司正在尝试组建并运营一个咨询部门，但原来的经理未能取得成果。我的老板让我接手。我对这个挑战和证明自己的机会充满热情。但同时，我也紧张得冷汗直冒。想象一下这样的画面：二十多岁的我，走进一群经验丰富的顾问中间，他们都比我年长，然后我告诉他们：“嗨，我是史蒂夫。我以前从没做过这个，现在我是你们的经理。”听起来像是一场灾难的配方，对吧？\n\
    \n幸运的是，我早已认识一位外部顾问，并与他建立了良好的关系，我们请他帮忙管理客户服务组织。虽然他主要与副总裁合作，但我已经见识过他的技能，对他的知识以及制定计划并贯彻到底的能力印象深刻。我决定就这个新项目向他请教。谢天谢地，他答应了。\n\
    \n他帮我组织了一个为期三天的工作坊，让整个团队达成共识。那时我刚刚开始培养自己的领导力。如果没有他的建议，我根本不会想到这一步，结果也会因此大打折扣。最终，我成功带领团队达到了公司预期的收入增长水平。直到今天，我仍在实践从他——我的第一位导师——那里学到的东西。\n\
    \n## 选择你的导师\n\n不要干等导师来挑中你。要主动出击。当你意识到自己力不从心时，就去寻求建议。或者更好的做法是，提前与导师建立良好的关系。\n\n\
    关键在于谨慎而明智地选择。当你寻找导师时，首先要明确你想提升的领域，以及你职业成功所需的技能和工作习惯。像其他目标一样，把这些写下来，放在你眼前。一旦你有了清晰的认识，就去寻找能帮你提升这些技能的人。同时，一定要找到一位能在性格、技能和需求上与你互补的人。\n\
    \n一个很好的切入点是审视你的目标，然后找出那些实现了类似目标的人。接着，挑选一两位 A+ 级人才，他们看起来既有能力又愿意当你的导师。如果你从那些已经了解你职业道德、且与你已有关系的人开始，效果最好。\n\
    \n我的第一位导师告诉我，他之所以同意帮我，是因为他看到我渴望、热情、有条理，最重要的是，愿意接受新的观点和想法。如果你已经在日常工作中表现出色，那么找到导师就会容易得多。\n\
    \n你也可以在尚未认识的人中寻找导师。导师们会在科技加速器、商务 MeetUp 小组等场合出现。但同样，最好从一段相互尊重的现有关系开始，这样你就能知道你和导师之间有联系、有信任，并对期望达成的目标有相似的看法。\n\
    \n一旦你确定了目标，就要找合适的时机与对方接触并开启对话，这样你就可以询问对方是否愿意指导你。不要担心这个请求会被视为无礼或令人反感。请记住，几乎每个身居要职的人之所以能达到今天的位置，都是因为有导师，而且大多数人都希望将这份慷慨传递下去。就我个人而言，我指导过\
    \ 15 个人，我非常喜欢看到我所提携的人取得成果。\n\n合适的导师关系会看起来像是你现有关系的自然延伸。你也许可以先聚几次，确保双方合适，然后再承诺建立长期的导师关系。就像任何其他关系一样，这也是双向的。最好的导师会认真对待自己的角色，给你其他人不愿告诉你的、诚实的、爱之深责之切的真实评价，并且会就如何采取行动给你最好的建议。他们可以作为你的“回音板”。一位伟大的导师总会为你的最大利益着想。所有这些都能帮助你减少错误、建立自信。\n\
    \n作为被指导者，你同样扮演着重要的角色。为了让这段关系成功，你要在协作中扮演积极的角色。不能把它当作随随便便的事——你必须真正渴望获得洞见、智慧、咨询和辅导，并准备好接受负面和正面的反馈。做笔记。以尊重的方式接受指导，提出直接的问题，落实建议。而被指导者最重要的责任是：说谢谢。导师只以感激作为回报，所以一定要充分表达你的谢意。他们相信与下一代分享知识的价值，并且希望知道这些知识得到了善用和珍视。\n\
    \n## 导师/被指导者关系准则\n\n最好的导师关系遵循一套基本规则。例如，导师承诺投入一定的时间和频率，而你则按照导师的建议行事，并回头告知导师进展如何，或者寻求进一步的帮助。\n\
    \n"

  - '[PAGE 126]


    any other person likes, especially the chance to just sit back and talk about
    themselves. You don’t need to go in and try to impress them or try to have all
    of the answers to all of the world’s problems. Just be authentic and polite, and
    you’ll be a hit. Once you like them and they like you, that’s when the magic starts
    to happen.


    In the start-up world, there’s no excuse not to make contact with the top executives.
    If you work for Facebook, you’ll probably never see Mark Zuckerberg. If you get
    anywhere near his door, one of his security teams will bounce you right to the
    floor. But at a start-up, the CEO probably has their office right next to yours,
    and their door is probably open. Go, as soon as possible, and knock on the door.
    Ask politely if you can schedule a time to grab some coffee and just talk about
    their company and philosophy. Most CEOs will jump at this chance—I did this with
    that bullying, intimidating CEO. He was more than happy to talk, and the incredible
    thing is that I said almost nothing in the meeting. Yet, when I walked away, I’m
    sure he thought to himself, “That kid’s impressive.” You can, and should, do the
    same.


    It’s far better to seek out those who are at the top of their game, ask them questions
    to better understand the company or one of its projects, and soak up the learning.
    Invite your managers or top leaders to coffee or five-minute conversations; this
    shows the executive team that you’re a potential leader who is serious about advancing
    your career and helping the company grow.


    Of course, you can’t always control who you spend time with. Sometimes you get
    stuck working alongside poor performers or people with negative mind-sets. In
    these situations, don’t drink from their poison cup. Avoid spending one minute
    longer with them than you have to, or they will drag you down and demotivate you
    faster than you can let out a deep sigh. While poor performers may be “nice” people
    and may deliver decent results, overall they’re bad apples that can spoil the
    entire workplace. If you spend too much time with the “negative-Nellies,” not
    only will your results suffer, but your reputation will, too. Everyone will think
    that you’re just like the other low-achievers, and you’ll be viewed as expendable.'

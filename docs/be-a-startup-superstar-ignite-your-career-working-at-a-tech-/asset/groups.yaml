    - 记住 7% 法则：沟通中 7% 是语言的，93% 是非语言的。注意你的肢体语言，也要学会读懂同事的肢体语言。这将使你能够理解他们的情绪状态并做出相应回应。正因如此，最好很少使用电子邮件和即时通讯来沟通。这些工具各有其用途，但它们也会模糊意图，掩盖伴随的肢体语言，并使误解更有可能发生。


    ## 了解你的团队


    同理心的最重要部分就是简单地去了解你的团队。这是因为，正如为高管提供关键决策建议的心理学家 Prudy Gourguechon 在一篇 *Forbes* 文章中所解释的那样，设身处地意味着你“要确保你评估的是
    *他们* 穿上自己的鞋子时会有什么感受，而不是你穿上他们的鞋子时会有什么感受。”² 换句话说，你的目标是弄清楚他们实际的想法和感受，而不是你认为他们想法和感受的样子。


    为此，任何一点帮助都有用。在 Thycotic 的午餐聚会期间，我们会玩一些游戏，让每个人分享周末的经历，或者我们会透露一些鲜为人知的关于自己的事实，让同事们惊喜不已。我分享过的一些细节：我曾经做过
    DJ，而且我还曾在 Sugarland Skeeters 小联盟棒球队担任过管理职务。会计部的 Jon 告诉我们他出版了三本诗集，而研发部的 Annette
    告诉我们她收藏了古董剑。分享这类信息，虽然看起来微不足道，却能带来更深的联系。它帮助我们了解我们正在与谁共事，并建立了同志情谊和信任。


    更进一步，系统、有针对性地收集有关团队的信息也很有用。当我自愿接手


    > ² Prudy Gourguechon，“Empathy Is an Essential Leadership Skill—And There’s Nothing
    Soft About It”，*Forbes*（2017 年 12 月 26 日），https://www.forbes.com/sites/prudygourguechon/2017/12/26/empathy-is-an-essential-leadership-skill-and-theres-nothing-soft-about-it/#3511d147d2b9d。


    ## 说谢谢并真心实意


    > *培养一个人的最佳方式是通过赞赏和鼓励。*

    > —Charles Schwab，美国投资者和慈善家


    如果你在几乎任何一家公司对员工进行抽样调查，问他们有多少人感到不受重视，你可能会惊讶于有多少人会说自己不受重视。每个人都希望自己的工作得到认可，而当他们得到认可时，就会营造出令人惊叹的积极环境。我曾与一些团队共事，每个人似乎都太忙了，甚至连一句谢谢都懒得说，于是有才华的人因为感觉不到被重视而离开。


    相反，在 PentaSafe，每个人都有说真心感谢的习惯，只要值得感谢，即使大家都因截止日期而时间紧张。当有人做演示时，每个人都会说谢谢。当员工在我办公室门口进行即兴的“路边会议”时，他们也会说谢谢。这让每个人都感到受尊重和被重视。


    关于这一点的分析数据也强化了感恩的重要性。John Templeton Foundation 进行的一项调查显示，感恩在职场中非常重要。“93% 的受访者同意，感恩的老板更有可能成功。”而且，根据调查，其益处还延伸到工作之外，超过
    90% 的受访者同意感恩的人更充实，过着更丰富的生活，并且更有可能拥有朋友。³


    相反，当缺乏感恩时，人们就会离开。2017 年 OfficeTeam 对美国和加拿大员工和高级管理人员的调查显示，三分之二（66%）的员工表示，如果他们感觉不到被重视，就会走人。似乎进入劳动力市场的千禧一代的涌入推动了对认可的需求不断升高，因为早在
    2012 年，只有 51% 的人表示如果感觉不到被重视就会离开。在千禧一代中，“如果得不到认可就会离开的员工比例上升到七十六 percent。”⁴ 感恩是当今和未来的成功关键，因此最好现在就养成习惯。


    > ³ Emiliana R. Simon-Thomas and Jeremy Adam Smith，“How Grateful Are Americans?”
    *Greater Good Magazine*，由 UC Berkeley 的 GGSC 出版（2013 年 1 月 10 日），https://greatergood.berkeley.edu/article/item/how_grateful_are_americans。

    > ⁴ “Thanks, But No Thanks”，OfficeTeam 由 Robert Half 发表的新闻稿（2017 年 4 月 12 日），http://rh-us.mediaroom.com/2017-04-12-THANKS-BUT-NO-THANKS-Survey-Reveals-Strongest-Forms-of-Workplace-Recognition-Research-Also-Finds-Two-in-Three-Employees-Would-Leave-Their-Job-If-They-Didnt-Feel-Appreciated。


    ## 感恩具有传染性


    新员工最能产生影响的方式之一就是实践感恩。你不需要依赖任何人来做。你不需要等待机会。你不需要领导团队。你不需要在正确的时间出现在正确的地方。你可以养成真诚致谢的习惯，而没有人能阻止你。


    这也可以让你更快地进入领导层，因为感恩具有传染性。当你出现并开始感谢同事时，他们会想要将这份善意传递下去。人们会注意到你推动了这种转变，并同样感激你。即使你的感恩没有传播开来，它也会让你脱颖而出，成为一个积极的力量，具有领导潜力。这在反面也同样适用。如果你习惯不向同事表达感恩，就会滋生怨恨，导致他人也不表达感恩。这同样会被注意到。


    ## 如何表达感恩


    大多数经理和员工错过了他们表达感恩的最佳机会之一：年度绩效评估。通常，这些强制性的评估双方都感到畏惧。它们往往主要集中在需要改进的方面，而不是出色的工作。我保证，大多数经理心里真的在想，“哦糟糕。我太忙了，还得做某人的评估。算了，快点做完吧。”


    然后在评估期间，他们会说，“做得不错，但你可以在这几个方面做得更好……”，然后大家就回去工作了。


    这只是表面上的感恩，并不真诚或有影响力。在我的职业生涯中，我只有少数几次有意义的评估，让我真正感受到对我辛勤工作的认可，同时也获得了改进不足之处的反馈。


    在初创公司，评估（如果存在的话）由于团队规模较小、每位领导的直接下属较少，以及缺乏正式的 HR 评估结构，而更有机会变得更有意义。如果你的工作场所没有安排评估，请向你的经理索取。要求进行一次认真、详细的回顾，说明你做得好的地方以及可以改进的地方。通过寻求这种宝贵的反馈，你的经理会感到被重视，并会看到你渴望卓越。


    我在初创公司的早期年里没有那样做，现在我不禁想知道，因为我没有主动询问，我错过了多少金玉良言。评估也是你作为员工向经理表达感恩的机会，感谢他们为你成长所做的任何帮助，或推动你成为更好的自己，或感谢你欣赏的他们领导风格的任何方面。


    当然，会有需要对某人进行纠偏的时候。每当有必要给出负面反馈时，都要夹杂一点感恩。你会惊讶于它如何改善绩效。感恩之美的一部分在于它软化了我们所有人都必须面对的不可避免的负面现实的严酷性。Dr.
    Camille Preston 解释了其背后的心理原因：“当感恩是真诚的时，它有力量帮助我们转化在面对负面反馈时所感受到的情感破产。”⁵


    赞赏是让某人一天变得美好、激励他们并激发他们做得更多的最简单方法之一。除了绩效评估之外，这里还有其他表达感激的方式：


    - 面对面地说出来。

    - 写一封简短的便条。


    > ⁵ Dorcas Cheng-Tozun。“5 Competitive Advantages that Gratitude Gives Entrepreneurs”，Inc.（2018
    年 11 月 19 日），https://www.inc.com/dorcas-cheng-tozun/5-competitive-advantages-that-gratitude-gives-entrepreneurs.html。



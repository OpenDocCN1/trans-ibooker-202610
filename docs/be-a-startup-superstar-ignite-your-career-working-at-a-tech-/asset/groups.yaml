    2017 年的一项调查显示，公司文化是人才选择新工作时最重要的因素。⁸ 然而，文化变革对大公司来说仍然难以捉摸。根据盖洛普 2017 年的 *State of
    the American Workplace* 报告，只有 33% 的美国员工在各规模公司中在工作中感到投入。⁹ 这意味着 67% 的员工没有投入，我们可以有把握地说，其中许多人就隐藏在老牌垄断公司中。这些员工只做被分配的工作，什么都不多做。这扼杀了创造力，并切断了任何成长的可能性。沮丧和无聊，员工像影子一样出现，按部就班，做最少的事情以维持生计。如果足够多的人躲起来，它会慢慢杀死一家公司，股东价值也会受到打击。但对我来说，真正的悲剧是成千上万工人的创造力、独创性和对成长的自然驱动力，在被
    relegated 到狭小、灰色的隔间里从事重复性任务多年后被扼杀。


    ## 上升流动性


    如果你有足够的驱动力，攀登老牌公司的企业阶梯是可能的，但要做好缓慢攀爬的准备。老牌公司背负着老牌思维。晋升的障碍很高，机会很少。如果你立志进入财富 500
    强甚至财富 1000 强公司的 C 套房，你的机会严重受限。在这些公司中，只能有 500 家或 1000 家 CEO 席位，也许在整个套房中还有 2,500
    到 5,000 个席位。这意味着你获得财富 500 强公司 C 套房工作的几率低于被美国国家橄榄球联盟选中的几率——低得多，考虑到 NFL 每年选秀 224
    名新球员，¹⁰ 而人们往往在 C 套房停留的时间比这长得多。


    将这些数字与美国的 46,500 家初创公司¹¹ 相比，很容易看出初创公司有更多的高管领导机会。如果你相信你的职业命运是成为一名领导者，你可以找到一家具有动态、快速发展的环境、重视主动性并提供快速晋升机会的初创公司。


    当然，最好的机会往往伴随着风险。当你将才华与初创公司分享时，你必须准备好快速行动并适应不断变化的环境。没有躲藏的地方。但凭借初创公司的思维方式和努力工作，你可以收获回报。


    最后，关于前面提到的观点，初创公司所赋予的这种多功能性有助于让你快速进入 C 套房。关于成为 CEO 的最快路径的《纽约时报》报道指出，“拥有尽可能多业务职能领域的经验非常有帮助。一个人如果在比如财务部门埋头多年，达到最高执行职位机会会更少，而一位不仅在企业财务方面有专长，还曾在营销、或工程、或两者兼有等领域工作过的公司财务专家则机会更大。”¹²


    当 James Legg 现在担任 Thycotic 总裁兼 CEO 时，他大学毕业后很高兴在一家名为 Computer Associates 的大公司担任客户经理，但三年内公司收购了其他公司，员工人数从
    500 人激增到 5,000 人。他对增长着迷，但不喜欢庞然大物的地位，于是跳槽到 BMC Software 公司，在那里获得了第一个管理职位，并为工作搬到了加州。但很快，这家公司也成长到
    Legg 发现大公司的弊端以及他不想留在其中的原因。“在一家大公司工作很棒，但在那种环境中，我产生影响的能力严重受限。我喜欢建造东西和解决问题，我很好奇我如何建立一家公司、取得进步并将其定位为领导者。我不能在大公司做到这一点，但我可以在初创公司做到。”此后他曾在一系列初创公司担任顶级领导，他的作品可以直接影响底线和世界。¹³


    考虑到所有这些，加入一家科技初创公司似乎是显而易见的。我不想给你错误的印象。然而，确实存在明显的缺点，初创公司世界并不适合所有人。你会经历长时间的工作，而且由于你会很早就参与高风险项目，边学边做，并随公司成长，你会面临很多压力。你将承担比在老牌公司典型初级职位更重的
    workload 和更大的责任。而且在很大程度上，你会因所有这些额外工作而获得更低的薪水和更少的职位保障——起初是这样。


    但，它可能有巨大的回报。


    2018 年春天，我坐在纽约一座摩天大楼顶层的董事会会议室里，俯瞰中央公园。我看到在完美的蓝天下萌芽的树木的明亮绿色。我们刚刚结束一次成功的董事会会议。凝视着这美丽的景色，我回忆起我第一份公司工作时处理索赔的工作。那份工作如此无聊，没有人能付得起让我留下。


    但在那一天，我想：“我会免费做这份工作，但相反，我得到的报酬比我 25 年前坐在隔间里处理索赔时梦想的还要多。如果我从未冒险尝试科技初创公司呢？如果我没有问自己是否还有另一种方式来创造成功的职业生涯呢？”这些都不会发生。我会困在那条职业道路上，像大多数人一样，永远无法摆脱困境。


    好奇心把我从那个隔间带了出来，让我提问并找到榜样，最终使我能够在科技初创公司世界中为自己开辟道路。


    你可以创造一个类似的故事。如果你不让它成为你的故事，它将成为你同事的故事、你室友的故事，或朋友的朋友的故事——因为科技初创公司市场正处于长期繁荣期，有空间让你加入并蓬勃发展。


    # 第 2 章


    # 为你选择合适的初创公司


    > 不要担心失败。你只需要对一次。

    > —Drew Houston，Dropbox 联合创始人兼 CEO


    你是否迫不及待，准备从公司办公桌跳到初创公司轨道？我也是，在毕业后不久，我加入了我第一家初创公司。我冲进了出现的第一个机会。这是错误。我对公司几乎一无所知——我不知道它的资金、增长计划或营销计划。我甚至不太清楚我们卖什么。当然我知道名字，但产品是某种专业技术，我对它实际做什么只有模糊的想法。


    最终，公司取得了成功。它有聪明的领导者、强大的产品和引人注目的故事。在很多方面，这是我职业生涯中最幸运的。因为在我急躁之下，我犯了我能犯的每一个可能的错误。即使公司最终成功了，我们也经历了长时间的挣扎，不得不裁撤大批销售团队，看起来整个事情可能都会垮掉。而这发生的频率太高了。


    [PAGE 37 脚注]

    ¹⁰ 截至 2019 年，32 支球队在七轮选秀中各选一名球员。

    ¹¹ Startup Ranking, https://www.startupranking.com/countries.

    ¹² *The New York Times*, "The Fastest Path to the C-Suite," June 2018.

    ¹³ 传记数据由 Thycotic 提供。



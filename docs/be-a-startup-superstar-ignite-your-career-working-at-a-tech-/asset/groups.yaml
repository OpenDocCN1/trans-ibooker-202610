    Any office that wants to be successful must first be fun. This might seem counterintuitive—but
    the reality is that nobody will ever work hard at an office if they don’t want
    to be there. For this reason, a fun work environment can help attract and retain
    the best talent. This is especially important in the start-up world, as most potential
    employees are young and expect a certain level



    +   - Send an email with “thank you” in the subject line.

    +   - Publicly express gratitude in a meeting.

    +   - Send a quick text.

    +   - Shake someone’s hand in gratitude.

    +   - Send a thank-you card or gift.

    +   - Post a note or video on someone’s social media.

    +   - In public settings and when talking to third parties, thank anyone who helped
    you, by name.


    A great rule of thumb is this: if you feel like you could do a little more to
    show your gratitude, do even a little more than you think you can do. There is
    literally no excuse not to—it costs nothing to say thank you, or, at most, you
    might invest five dollars in a coffee shop gift card.


    If you think you don’t have time to say thank you, realize that is a lame excuse.
    Even the former CEO of Campbell’s Soup, Doug Conant, found time to write 30,000
    thank-you notes to company employees during a 10-year period. If the CEO of a
    large corporation can find time to write personalized thank-you notes, so can
    you. The results will be huge.⁶



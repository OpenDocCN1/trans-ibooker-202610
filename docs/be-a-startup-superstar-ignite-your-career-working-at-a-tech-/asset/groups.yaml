    When I got the call with the news early on a Sunday morning, for just a moment,
    I thought, “We could go out of business. Customers will leave. This is the worst
    thing that could happen.” Now, if I continued to keep tugging at those threads,
    I would have come undone. But those potentially unraveling thoughts didn’t last
    for long. We called a meeting of all of the leadership—on the same Sunday. In
    the meeting, right on a big whiteboard, we developed an action plan for how we
    would manage the crisis. We made two big decisions up front: that we would be
    completely transparent with our customers, telling them not only what we knew,
    but also what we didn’t know, and when we would know what we didn’t know. The
    other: that we would do right by the customer, financially and otherwise. We shaped
    our entire approach around these two principles, sharing updates and photographs
    on the process and offering financial compensation when necessary to the clients.


    We were able to develop a plan so quickly because the leadership had enough confidence
    in our ability to bounce back. If they had succumbed to doubt, we would have never
    recovered from a disaster of this scale. But they didn’t, and they organized us
    to take that first step. And once we had that first step, that plan in place gave
    us even more confidence. We felt that we were doing all the right things—being
    proactive and moving in the correct direction. We had a roadmap and could draw
    extra assurance from it. Ultimately, we lost very few customers and I attribute
    it to the positive self-belief of the company’s leaders.


    Of course, this is an extreme example, but it illustrates an important point about
    succeeding in business. First, that every day in business, especially at start-ups,
    is chaos. Something will happen—a customer will be upset, the competition will
    make some bold move, a server will crash that will require a fast response. You
    need to trust in your ability to handle that, and it’s much easier to trust in
    that ability when you’re prepared. Preparation equals confidence—whether it’s
    putting out literal server fires, or just giving a standard presentation.


    Usually, people with low self-esteem practice a lot of negative self-talk. They
    think “I’m a failure, nothing goes right, I’m a loser.”'

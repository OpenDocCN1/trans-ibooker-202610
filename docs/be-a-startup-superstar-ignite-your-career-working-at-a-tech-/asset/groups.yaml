  - '[PAGE 60]


    me believes they already have happened. I’ve pictured myself in the C-suite. I’ve
    seen myself wow people with my brilliant ideas and incredible results at a board
    meeting. I’ve imagined myself making seven figures as a start-up I’ve worked for
    gets acquired. And I’ve accomplished each of those things.


    Practicing this in the morning allows me to set the tone for the rest of the day.
    I know what I’m moving toward, and it allows me to constantly ask: what can I
    do to take a step in the direction of achieving the outcome I’ve been dreaming
    about? In my experience, when I ask myself these questions, I always come up with
    answers, and success follows.


    My success till date would not have been possible without this visualization.


    Whether you use a digital vision board on your computer, a physical vision board
    with pinned-up images, or you visualize success and capture your ideas in writing—it’s
    having a vision that counts. You want to feel so turned on by your future success
    that you go through your day hearing the waves gently rolling against the side
    of that yacht, feeling the energy of the audience before you, and tasting the
    sweetness of life in that red Italian sunset. The key: be crystal clear and specific
    about your goals, keep them in front of you, and always ask how you will get there.
    This is the first step to success, and also to developing yourself as a leader
    and to fortifying your self-confidence. A leader needs a vision to rally his followers
    toward.


    Also, when you have a strong vision for your success, it will make your outlook
    on life more positive. That way, even when you experience setbacks, you will be
    able to remain undeterred and refocus on your vision.


    You will experience setbacks. Great success is a journey, and it never comes by
    walking in a straight line. If you’re too busy looking down at the road, you won’t
    know where you’re going and you won’t end up anywhere exciting. You will only
    reach a great place if you look ahead and keep advancing toward it, even when
    it seems far away at first.'

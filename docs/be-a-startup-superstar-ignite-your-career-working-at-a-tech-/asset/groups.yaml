    the big “why”—even outside of a meeting, over a cup of coffee. This is how budding
    leaders amp up the motivation for everyone, build meaningful relationships with
    the boss, and stand out as potential leadership material in the start-up space.


    ### Keep Your Goals in Sight


    Doug Erwin, whom I’ve mentioned, says, “When I speak with a group of people, I
    say, ‘Everybody here who thinks you’re a goal-setter, raise your hand.’ Everybody
    raises their hand. I say, ‘Keep ’em up. Now how many of you write down those goals?’
    And half the hands go down. Then I say, ‘How many of you write down those goals
    and post them so that you see them?’ And most of the hands go down.” Erwin says
    that those whose hands are still up are the ones he wants to hire because they
    are the ones constantly focused on what they should be focused on. “You’ve got
    to be so damn laser-focused on what your goals are. I’m not just talking about
    having them on your iPad or your phone. You need to post them in front of you.”


    In other words, they need to be visible. When I worked at PentaSafe under Erwin,
    he created the most powerful visual goal I’ve ever seen. Just before the year
    2000, the start-up was planning for a big year, and we needed to hire about 15
    salespeople so they’d be ready to go in January. Erwin called a company meeting,
    and, at the appointed time, about 50 of us went outside into the front yard of
    our building. Erwin sat on the stairs in front of us, and he called up Eric, a
    sales guy, to sit on a stool up front. Erwin announced that Eric had just closed
    our company’s first million-dollar order, and Eric’s commission was $280,000.


    Right on cue, a Brink’s truck pulled up, two armed guards got out, and they dumped
    $280,000 in tens and twenties over Eric’s head. Erwin said, “That’s what $280,000
    looks like.” Then he told everyone that all of the bonuses he was going to pay
    out to everyone would also add up to another $280,000. Everybody was taking pictures

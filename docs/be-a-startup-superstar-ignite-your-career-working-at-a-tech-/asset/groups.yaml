    # Why Work for a Start-Up Over a Big Corporation?


    A few years ago, Microsoft dangled a senior leadership role in front of me, which
    included a high-compensation offer and the chance to move to Seattle. It was tempting.
    I had been working for Bindview, a start-up where I ran marketing and helped to
    lead. But my role there was soon to end—Symantec, a much larger company, was acquiring
    us. While I could have continued on at Symantec, I didn’t really want to, which
    left me with two real options: Microsoft, or find another start-up.


    On the surface, this might seem like an easy choice. This kind of senior management
    position at Microsoft is something many people only dream of. And Microsoft was
    making a hard push for me. They flew my wife and me out to Redmond, where I interviewed
    with several key senior executives. Later, they organized a huge, scrumptious
    dinner where I had the chance to meet and break bread with people who could end
    up being my peers. They showed me Steve Ballmer’s and Bill Gates’s offices. They
    offered to set us up with temporary corporate living right on a lake near their
    beautiful campus. I met the people who would be working on my team, and the person
    I would be accountable to, and we all hit it off. On top of all this, they offered
    an extremely generous compensation package. And, as a remarkable personal touch,
    they found out that my son loved video games and sent him an Xbox.


    I had spent my entire career working in start-ups. I made more money faster than
    anyone I knew who went the traditional route, and never wanted to change that
    before. But Microsoft had been so persuasive, I seriously considered it. I wrote
    down the pros and cons,'

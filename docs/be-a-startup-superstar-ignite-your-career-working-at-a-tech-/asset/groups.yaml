    # 成为创业


    # 超级明星


    ![](img/bf6d6350e5469b2432eea642e445fdf5_0_0.png)


    点燃你的职业生涯

    在科技初创公司工作


    如果你和许多刚毕业的大学生一样，那么你目前的职业道路与你还在学校时为自己设想的相去甚远。你感到被困住了。困在一份无法给你成就感的工作里，晋升和获得可观收入的前景似乎遥不可及。你拥有教育背景、商业头脑和成功的雄心，但一切却停滞不前。


    你是否曾问过自己：*为什么那些巨大的成功故事似乎都来自科技界？*你并不孤单。作者史蒂文·马克·卡汉也曾身处你的处境，并找到了一条打造卓越职业生涯、实现巨大财富和个人成功的道路。史蒂夫会第一个承认，当他开始进入科技初创公司这个领域时，他对技术*一窍不通*。但他愿意承担风险、抓住机会的态度，远远弥补了他在技术技能和经验上的不足。在*《成为创业超级明星》*中，史蒂夫向你展示了在哪里能找到最好的机会、如何利用这些机会，以及如何选择一家最有可能成功的初创公司。


    本书分为两部分，是一本实战指南，帮助你发现非凡的机会，在时机成熟时抓住它们，并在科技领域点燃职业生涯。本书承认许多初创公司会失败，因此第一部分聚焦于如何



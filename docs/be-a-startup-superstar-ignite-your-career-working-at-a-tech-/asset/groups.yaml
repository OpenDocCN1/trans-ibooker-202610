    # BE A STARTUP


    # SUPERSTAR


    ![](img/bf6d6350e5469b2432eea642e445fdf5_0_0.png)


    IGNITE YOUR CAREER

    WORKING AT

    A TECH STARTUP


    If you’re like so many recent college graduates, your current career bears little
    resemblance to what you imagined for yourself while still in school. You feel
    stuck. Stuck in an unfulfilling job, where the prospects of advancement and earning
    an excellent income seem light-years away. You have the education, the business
    acumen, and the ambition to succeed, but things are at a standstill.


    Do you ever ask yourself: *Why is it that all of the massive success stories appear
    to come from the tech world?* You’re not alone. Author Steven Mark Kahan was in
    your situation and found a way to build a great career and achieve immense financial
    and personal success. Steve will be the first to admit that he knew *nothing*
    about tech when he started his journey through the world of tech startups. But
    his willingness to take risks and jump on opportunities more than made up for
    his lack of technology skills and experience. In *Be a Startup Superstar*, Steve
    shows you where to find the best opportunities, how to take advantage of them,
    and how to choose a startup with the best chance for success.


    Divided into two parts, this real-world guide enables you to find exceptional
    opportunities, seize them when the moment is right, and ignite your career in
    tech. Acknowledging that many startups fail, Part One focuses on how to



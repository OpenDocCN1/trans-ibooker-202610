    them to see how my goals have changed over the years, and what I accomplished
    or chose not to accomplish). I break them down into quarterly objectives and weekly
    goals, and then I stack each goal into one of three buckets: Priority A (do these
    now), Priority B (do these next), and Priority C (don’t waste my time doing these).
    From there, I break down my A and B goals into daily task lists. Every evening,
    I set aside time to plan the next day, and I document my top three (only three!)
    priorities to focus on for the day. This takes discipline and helps me focus on
    the things that matter most so I don’t get caught up in a sea of distractions.
    The key is to be realistic about what I can accomplish each day. When I get to
    the office in the dark of an early weekday morning, I concentrate on completing
    the first priority before moving on to the next one. This is key—you can’t just
    go through the motions of setting goals, you must follow through with action.



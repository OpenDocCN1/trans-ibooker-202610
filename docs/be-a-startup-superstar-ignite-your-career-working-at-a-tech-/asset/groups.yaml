    as those who would be able to lead with a steady hand and a plan when they had
    a chance to move up to a leadership role.


    You can’t control your competitors’ moves, nefarious people, or the weather. You
    can, however, have the right principles in place (individually, as a team, and
    as a company) so you can handle potential chaos in an orderly way.


    This doesn’t mean overanalyzing everything that could go wrong to the point of
    fear and overwhelm. That’s counterproductive—if you get stuck thinking about everything
    that might not work out, you’ll never be able to get anything done. Instead, focus
    on these six ways to build your propensity for creating order out of chaos, and
    stand out as a potential leader:


    - **1. Embrace the chaos.** While some people shy away from it, great leaders
    lean in. They realize that turbulence is part of flying, and you have to fly through
    it.

    - **2. Focus on the destination.** Chaos is distracting and noisy. Maintain clarity
    around where you are headed. When kids are learning to ride a bike, they quickly
    realize that they have to look up ahead. If they stare at their spinning front
    tire, they will soon crash, and the crying won’t be pretty.

    - **3. Focus on the must-haves, not on the should-haves.** Establish order in
    the most critical and largest areas first.

    - **4. Be the model.** No matter what position you currently hold, or the level
    of instability around you, you can demonstrate your leadership with a clear purpose,
    determination, and a sense of calm.

    - **5. Communicate professionally.** Take a deep breath before you speak, and
    don’t allow your emotions to get the best of you. Others will notice what you
    say and your body language, even in the midst of chaos.

    - **6. Properly manage expectations.** People naturally want to take action to
    quickly eliminate chaos. Resist that temptation. Sometimes, fast action only exacerbates
    the crisis. You won’t be able to resolve every crisis instantly or in one fell
    swoop, and make sure that you and your team are aware it is a process.


    ## Make Fact-Informed Gut Decisions


    Steve Jobs was famous for bucking conventional wisdom and following his gut, his
    intuition—and obviously, he scored astronomical wins. But, you and I are not Jobs,
    so for us terrestrial types, I recommend a more balanced decision-making leadership
    style that I call “fact-informed gut decisions.” Data must drive decisions because
    it’s the concrete, proven evidence of a logical, rational set of facts. At the
    same time, you need to embrace a bit of Jobs’s cavalier energy and listen to what’s
    gurgling in your gut. Part of a start-up’s competitive edge comes from its ability
    to move fast, and this often means acting on an opportunity before you have all
    the data, or before the data has caught up with reality. Getting too mired in
    analysis paralysis can negate an important advantage.


    One of the times I listened to my gut, and it paid huge dividends, was when I
    was one of the leaders of Thycotic, a cybersecurity start-up that existed before
    cloud-based security solutions were popular. The CEO and I were deliberating on
    exactly if and when our company would take the giant step to the cloud as a solution
    for IT security. We analyzed all the facts about the cloud and interviewed customers
    to determine their comfort level with the idea. The data we got didn’t support
    the switch—it showed that most customers didn’t trust the cloud enough to handle
    all of their proprietary information. The data indicated that eventually, though
    not right away, the cloud would be popular and profitable, and we should wait
    three to five years before getting into the game.


    But there was this voice in our gut, whispering, *You have a wide-open competitive
    window; do it immediately.*


    We listened, and became one of the first companies to offer cloud-based cybersecurity
    solutions. That first-mover advantage put us in a great position to capitalize
    when the cloud took off in popularity, and our revenues skyrocketed.


    > This reminds me of an observation made by Jack Welch, the former chairman and
    CEO of General Electric, who said, “The best executive today is the executive
    that can see around that corner. [They can see] what’s coming. Not when you’re
    in the tunnel, and did, then take the lesson and put the rest behind you. If you
    do this enough and are honest enough with how you evaluate yourself, you’ll build
    up your intuition and it will help you make better fact-based gut calls in the
    future.


    ## Earn Your Stripes


    In the military, you don’t get stripes on your uniform without hard work that
    puts everything on the line. The same thing holds true in a start-up. You have
    to earn your stripes, every day, especially if you want to be promoted. Being
    seen as a valuable asset is not automatically bestowed upon anyone, even if you
    arrive with heaps of success, a resume stuffed with experience, and a vast collection
    of knowledge.


    This holds true for me, too. When I join a new company, I never feel worthy of
    my title until I get a few major wins. Even then, I never feel 100% comfortable,
    and, if I catch myself getting too relaxed in my position, I create discomfort
    for myself. This motivates me to keep working hard and proving my worth to my
    teammates, and I suggest you adopt this perspective, too.


    For example, when I first came on with PentaSafe, Doug Erwin invited me over to
    his house for a private meeting, where the executive team told me the challenges
    that the company faced. Essentially, we weren’t differentiated enough in the market.
    I set a goal to overhaul the company’s branding, positioning, website, and marketing
    materials—in the first 100 days. Since then, this has become my calling card and
    how I earn my stripes whenever I start at a new company. Just as the first 100
    days of a presidency are some of the most important, I think your first 100 days
    at a new job are the most important. It will set the tone for the rest of your
    time at the company, and show everyone around you what sort of worker you are
    and what to expect.


    So, I got this team I didn’t know at all, and I came in and said, “We’re changing
    everything.” They thought I was crazy—that there was no way we would be able to
    pull off all that I wanted to


    Along the same lines, a great way to stand out and show initiative is to go to
    your boss and say: “Tell me what I need to do to earn my stripes here.” It will
    immediately put you on their radar as someone who is dedicated and eager to provide
    your best work. The key is to listen to the answer and actually follow through.
    When you do that, you’ll put yourself at the front of the pack when the executive
    team is looking for new leaders.



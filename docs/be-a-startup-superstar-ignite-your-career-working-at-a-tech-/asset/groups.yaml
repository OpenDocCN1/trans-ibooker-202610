    North”会议并召集多元化团队共同关注最重要的目标和优先事项来树立优先级标准。


    他在多年前一次飞往澳大利亚的16小时飞行中开发了他的True North流程。他坐在飞机座位上思考他最大的挑战，即如何让国际团队的这么多人保持动力并朝着同一方向拉绳。他观看了一段Stephen

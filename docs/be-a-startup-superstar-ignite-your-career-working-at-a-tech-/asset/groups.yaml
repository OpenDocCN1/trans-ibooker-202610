    # Getting Hired


    Finding companies to apply to and even get your foot in the door is only the first
    part—no matter what, there will be an interview process, and you have to nail
    it. Going into the interview, make sure that you’re ready to demonstrate that
    you have the skills, and more importantly, the mind-set that they are looking
    for. As I’ve mentioned, start-ups place less emphasis on your education and prior
    experience than large corporations.


    Doug Erwin, the serial tech entrepreneur I mentioned earlier in this chapter,
    says when he’s hiring at a start-up, “I look for people who want to build solutions
    to solve problems. People who have failed and then succeeded, and who aren’t afraid
    to take chances. I look for people who are prepared. People who are good communicators
    and who have a sense of humor and can laugh at themselves. And, of course, people
    who have the skills to do the job. I want people who show they can think outside
    the box.”


    What does this look like? Erwin tells the story about when he used to have a friendly
    annual meeting with the head of HR at Southwest Airlines. On one visit, Erwin
    waited in the lobby with a bunch of men interviewing to be pilots. Erwin says,
    “The lobby was full of these serious men with cropped hair, obviously military
    pilots. Someone came into the lobby and announced, ‘To all of you interviewing
    for pilot jobs, we are only interviewing people in shorts. Thank you very much,’
    and then disappeared back through the door. I saw one guy cut his pant legs off
    right there in the lobby. Others ran out to their cars and put on their gym shorts,
    and came back in.”


    While Southwest Airlines isn’t a start-up anymore, their HR team demonstrated
    a start-up mentality in seeking quick-thinking people who were willing to go all-in
    and have a sense of humor. Bring that energy to your interview, and it will make
    you stand out to start-up leaders.


    Great energy will help, but the single fastest way to snag the attention of a
    start-up founder is to have an elevator pitch—for'

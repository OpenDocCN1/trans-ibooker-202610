  - '[PAGE 86]


    She chose C.

    Though it was difficult at first, Becca took the opportunity to learn everything
    possible about digital marketing and high-velocity online sales funnel models.
    She made the tough decision to buckle down and learn, to accept the gaps in her
    knowledge with grace, and to realize where the opportunity could take her. She
    kept her gaze focused on long-term growth, both for Thycotic and for her own career.
    She became an expert in digital marketing. She built a skill set capable of running
    the new strategy, and I predict it will carry her to lasting success and multiple
    CMO offers. But none of that would have happened if she hadn’t decided consciously
    to take on the challenge and make it work.


    # Call Out the Elephant in the Room


    In a 7:30 Monday morning leadership meeting at a fast-growing start-up in my past,
    the CEO suddenly announced that the European leadership team had been let go.
    There was no explanation, no discussion, not even a “Does anyone have any questions?”
    query. As the meeting continued on to the next topic, everyone glanced at one
    another in surprise, and the unanswered questions swirling in their minds loomed
    like an elephant in the room—a big, obvious problem that no one wanted to bring
    up. Yet the meeting kept going.


    Later that day, I scheduled a private meeting with the CEO (again, this is the
    beauty of start-ups where you have greater access to senior leaders) and asked
    him point blank about what had happened. He said the European team had been underperforming,
    so he cleaned house.


    I asked him what the plan was, and he started answering in vague, uncertain terms.
    Eventually, I realized that we had no clear plan going forward. I got worried—the
    company was rocketing, but, if Europe was a mess, all our success was at risk.


    My initiative kicked into action, and I offered a solution: I volunteered to run
    the European division while he figured it out in the interim. Two weeks later,
    I went to Europe with one of our'
  - '[PAGE 87]


    top salespeople. I was there for six months, and we turned the ship around. We
    actually outperformed the US division in one of those quarters, mostly because
    we landed one monster sale.


    I was only there for six months, but my decision to call out the elephant in the
    room reaped huge benefits. It accelerated the rebuilding of our European wing,
    but it also gave me a completely new experience. In my professional career to
    that point, I’d never had success in actual, hands-on sales. I’d always developed
    my marketing with an eye toward sales, but it’s not the same thing. In Europe,
    however, I got to take part in direct sales and experience huge success, for the
    first time.


    I agree with Randy Pausch, American professor and author of *The Last Lecture*,
    when he said, “When there is an elephant in the room, introduce him.” If you look
    for the elephants, you will find them. They are the issues everyone else tiptoes
    around, the uncomfortable topics others want to avoid. Of course, it’s easier
    and less stressful to avoid pointing out big problems or asking probing questions.
    But when you are the brave one who calls out an obvious elephant in the room,
    you become the stand-out savior of the speechless, willing to boldly ask what
    no man or woman has asked before.


    You will get noticed.

    One caveat, you don’t want to be seen as bringing up a nonissue. Before approaching
    the boss about a perceived elephant, first check with others to make sure your
    perception is on target, and that an elephant of a problem actually exists. And
    then, assuming it is a big issue that needs a solution—and this is the crux of
    my point—offer to be part of the solution. Because venting or asking about a problem
    without any proposed action only lowers your reputation and makes the elephant
    grow bigger.


    # Be Known as an Idea Person Who Executes


    There’s no shortage of people with good ideas; there’s a big shortage of people
    with good ideas who follow up with action that yields'
  - '[PAGE 88]


    results. In the highly competitive start-up marketplace, the ability to think
    up *and* execute on good ideas can propel your career and the company’s growth
    at the same time.


    Great ideas come to people whose brains are constantly open to them. Think of
    ideas as the lifeblood of your success in the start-up environment, where innovation
    and creativity are critical to staying alive and ahead of the pack. Jumpstart
    your creative thinking by asking questions such as: “Is there a better way?” “Why
    can’t we do that?” and “What if we do this instead?” Surround yourself with people
    interested in the same topics, and mine their thinking to spur your own. I’ve
    found that simple ideas often win over complex ones. Often, executing on a collection
    of smaller ideas will be more valuable than waiting for that elusive next big
    idea.


    The trick is to allow your mind the space to let your relaxed creativity flow
    so raw ideas can formulate into actionable ones. Find your own best quiet time
    to get into idea-generation mode and go there often. For me, the best ideas float
    into my psyche when I’m just waking up in the morning or when I’m running on a
    beach.


    Around the year 2000, I had been interested in cybersecurity and I had been hearing
    over and over how IT security specialists were drowning in constant alerts from
    various security products. I took off running on the beach, my feet pounding out
    a rhythm on the sand. I thought about conversations I’d had with influencers,
    the solutions I’d studied, and what I had learned about the existing options that
    hadn’t worked. And then an idea washed over me: we could capture and combine the
    various alerts into a single, meaningful and actionable dashboard!


    At this point, I could have decided to document this idea in a journal and let
    it stay there, as I went about my full, busy life. Or I could decide to execute
    on the idea and make something happen. I saw its vast potential value, so I further
    developed the concept and spent long hours building a business plan. I secured
    an entrepreneur to finance it, assembled a team, and in 2003, we launched eSecurity,
    the first company to provide the market with a security information/event management
    solution. It went on to become a multimillion-dollar company, and it all started
    when I'
  - '[PAGE 89]


    focused on solving one problem, created the mental space for ideas to flow, and
    then took action on the best idea.


    For every 10 rough ideas, one brilliant gem might rise to the surface as worthy
    of implementing. You will, of course, never know with 100% certainty which of
    your ideas are brilliant until after you’ve tried them out. That being said, there
    are some ways that you can gauge where your ideas sit on the gradient of dud to
    gem.


    For one, if you know the metrics of the idea, you will have a sense of its quality.
    Using marketing as an example, it’s a lot easier to tell if an idea has potential
    if you understand who the target audience is and what they usually respond to
    or not. Knowing these things makes it easier to see where your idea fits.


    Second, you can test your idea. This can be both external, with the specific target
    audience (for example, holding a focus group), and internal, like running your
    idea by your colleagues. Gauge the reaction you get. Also, dedicate time to testing
    that’s proportional with risk. If your idea is a big gamble that requires a large
    investment, it’s wise to spend more time on testing before you go all-in, and
    the inverse is true.


    Finally, do a gut check. Sometimes you get a sense that an idea is a really good
    one, and, if that happens, follow it. You should still look at the metrics, do
    the testing, and refine your idea, but it’s also important to listen to yourself
    and trust your instincts.


    Too many great ideas whither as a result of inaction. If you have an idea, no
    matter how good it is, nothing will happen with it if you don’t do anything. So,
    if you get that feeling or a hunch, even early in your career, make an opportunity
    to share your idea with the higher-ups. Be strategic about this, of course, but
    don’t ever quash something you believe in because you’re afraid that somebody
    will think the idea is stupid. The price of not sharing a great idea far outweighs
    the risk of keeping it to yourself.'

- raw:
  - '[PAGE 32]


    Start-up entrepreneurs are creators, not maintenance workers, and start-ups need
    visionaries at every level. In addition, tech start-ups are so desperate for A-plus
    talent that they tend to be more flexible about terms and willing to hire employees
    to fill remote positions, regardless of whether they live near a cornfield in
    Nebraska, a beach town in Florida, or in the heart of Karachi.


    # Versatility in Roles


    Most jobs in big, old-school companies offer a limited range of authority, meaning
    no single individual, besides perhaps the CEO, has the ability to influence the
    entire company in a significant way. When you get hired to fill a role at an established
    business, that’s exactly what they expect you to do: fill that role. It’s rare,
    if not impossible, to find the freedom to experiment and try your hand at filling
    different roles within various departments. Large companies don’t want you to
    even think about how or where you could contribute in new ways, yet this level
    of agility is the norm at a start-up.


    Most start-ups don’t hire with a set idea of your potential or career path, because
    the start-up is young and undergoing massive change. Founders may find it hard
    to predict what the company’s needs will be as it grows. This is the perfect environment
    to try on different hats and find your zone of genius—the area where you work
    best—then move up quickly from there.


    When I began at start-ups, I worked in sales, customer support, and professional
    services before finding my zone in marketing. From there I was able to build deep
    experience and expertise in marketing and zoom to the C-suite as CMO.


    # Access to Leaders


    Working for a start-up, you can come in at an entry-level position and end up
    working on big, world-changing projects with the founders where your contributions
    will be seen and noted.'
  - '[PAGE 33]


    # BE A STARTUP SUPERSTAR


    When I was 25 and working with the start-up KnowledgeWare, I was involved with
    a high-stakes project and charged with creating a plan to get existing customers
    to convert, for a small fee, to the new version of our products on a new operating
    system. The founders didn’t want to distract the sales team from attracting new
    customers, and so they asked me to lead the initiative. At the time, I was young
    and mostly untested. This assignment, however, had me meeting with the vice president
    of marketing and the CEO, weekly at first, and eventually we met daily. I had
    been given a tremendous opportunity, and I didn’t want to squander it. I was laser
    focused, and they noticed. Toward the end of the assignment, the company had a
    dinner in my honor and presented me with a special achievement award.


    This was a watershed moment for my career. Beyond the obvious reasons—winning
    an award, developing a close rapport with higher-ups—the experience had put me
    in a kind of pressure cooker that spurred rapid growth. I had to create proven
    results, and learn how to on the job. The fact that the higher-ups had selected
    me to handle this assignment served as a massive confidence boost, because I felt
    like the top executives had seen something in me that I hadn’t yet seen in myself.
    This, in turn, helped me take on even more high-stakes projects. This success
    begot other successes.


    After I delivered on the first project, the company wanted to build a plan to
    develop a consultancy service. They hired an external senior consulting executive
    to handle the implementation. He bungled it, and because they had the confidence
    in me after my handling the OS switch, they asked me to lead that team. I had
    never done consulting before, but learning once more on the job, I added another
    tool to my box, another cross-discipline competency, which ultimately increased
    my value as an executive.


    Now, let’s imagine: what if I had been a new hire for Google at the same age with
    the same shortage of experience? I wouldn’t even have sniffed a project of that
    caliber. I’d have been stuck in some entry-level position within a tiny scope,
    and miles of corporate ladder between me and senior leadership. In a pool the
    size of Google,'
  - '[PAGE 34]


    with so many other swimmers, it’s easy to drown. But at Knowledgeware, I swam
    circles in the kiddie pool.


    # Financial Rewards


    If you aspire to work in a big corporate environment because you think you want
    the security, predictability, well-defined processes, and better pay (sometimes)
    from the start—beware. What you’re really buying into is limitation. I see it
    all the time in my dealings with large corporations: the old corporate mind-set
    is filled with bureaucracy, politics, boredom, pigeon-holed roles, and fewer opportunities
    for employees to shine. All of this translates to minimal financial rewards. It’s
    hard to stand out in a company with thousands of employees.


    Go to work for a big company, and you’ll get a paycheck—a paycheck and a 4% annual
    raise along with a formal review from a manager who dreads delivering it. The
    *potential upside* is far greater at start-ups. And the initial financial rewards
    might not be too bad either. Depending on the size, cash flow, and product launch
    status, a start-up may offer a competitive salary right off the bat, or it may
    start you off with a modest salary with the potential to own a piece of the pie
    through stock options. The stock options could lead to astronomical compensation
    later on, if the company is successful.


    In my opinion, always go for the stock options. A good rule of thumb: the earlier
    you get in at a start-up, usually the better. For example, if someone joined Thycotic
    in 2019 and took stock options, they’d get their options at the current fair market
    value, which, for the point of this example, let’s say is $10, while if you’d
    gotten into Thycotic at the ground floor when the options were valued at, say,
    $3, then you would have gained $7 per unit. The earlier you get in, assuming the
    company grows, the more money you can end up making.


    The second piece to stock options is just how important they can be for personal
    wealth. In my experience, as you grow in your career and move up the ladder, you
    have the opportunity to make more money. And, as you get older, you get new responsibilities.'
  - '[PAGE 35]


    You have a family, you want to buy a house, you want to invest in your children’s
    education, the list goes on. The point is, you constantly find new ways to spend
    money. So, even though your salary is increasing, and even though your bonuses
    are increasing, your actual personal wealth doesn’t grow because your expenses
    increase at the same time. And while some people are more diligent about saving
    and investing than others, the amount of money even the most disciplined person
    can accumulate pales in comparison to what you can make through stock options,
    for the simple reasons that those assets are less liquid, and they can increase
    in value very fast, so you may consider holding on and riding the wave of value
    creation. In the actual handling of stock options, of course, there are all sorts
    of rules and regulations that dictate when and how you cash them out, so that
    will vary on a case-by-case basis.


    The bottom line is this: when it comes to investing, where I’ve found the biggest
    gains, and where I feel the most confident, is betting on myself and the team
    I work with. When you invest in the general stock market, picking up stocks in
    other corporations that you’re not involved in, you’re betting on things outside
    of your control, like if the oil prices will hold, or if the CEO, who you don’t
    know at all, will run the company well. The smart move is to keep your money where
    you can play a direct role in its growth, and you have direct knowledge in the
    day-to-day operations. Do note that not all start-ups offer options, and that
    is something to consider in your selection process, but we will handle this in
    more depth later in the book.


    # Culture


    Remember that earlier quote about being the last outlaws on the frontier? About
    being the freewheeling, quick on the trigger, rebel with a cause ethos of a start-up?
    I can tell you from my experience, it’s true. When you’re working for the right
    start-up, that’s how you feel. And like any band of outlaws, you and your co-workers
    will develop the kind of community that can only exist in a small company of rebels.'
  md: '

    Start-up entrepreneurs are creators, not maintenance workers, and start-ups need
    visionaries at every level. In addition, tech start-ups are so desperate for A-plus
    talent that they tend to be more flexible about terms and willing to hire employees
    to fill remote positions, regardless of whether they live near a cornfield in
    Nebraska, a beach town in Florida, or in the heart of Karachi.


    ## Versatility in Roles


    Most jobs in big, old-school companies offer a limited range of authority, meaning
    no single individual, besides perhaps the CEO, has the ability to influence the
    entire company in a significant way. When you get hired to fill a role at an established
    business, that’s exactly what they expect you to do: fill that role. It’s rare,
    if not impossible, to find the freedom to experiment and try your hand at filling
    different roles within various departments. Large companies don’t want you to
    even think about how or where you could contribute in new ways, yet this level
    of agility is the norm at a start-up.


    Most start-ups don’t hire with a set idea of your potential or career path, because
    the start-up is young and undergoing massive change. Founders may find it hard
    to predict what the company’s needs will be as it grows. This is the perfect environment
    to try on different hats and find your zone of genius—the area where you work
    best—then move up quickly from there.


    When I began at start-ups, I worked in sales, customer support, and professional
    services before finding my zone in marketing. From there I was able to build deep
    experience and expertise in marketing and zoom to the C-suite as CMO.


    ## Access to Leaders


    Working for a start-up, you can come in at an entry-level position and end up
    working on big, world-changing projects with the founders where your contributions
    will be seen and noted.


    ## BE A STARTUP SUPERSTAR


    When I was 25 and working with the start-up KnowledgeWare, I was involved with
    a high-stakes project and charged with creating a plan to get existing customers
    to convert, for a small fee, to the new version of our products on a new operating
    system. The founders didn’t want to distract the sales team from attracting new
    customers, and so they asked me to lead the initiative. At the time, I was young
    and mostly untested. This assignment, however, had me meeting with the vice president
    of marketing and the CEO, weekly at first, and eventually we met daily. I had
    been given a tremendous opportunity, and I didn’t want to squander it. I was laser
    focused, and they noticed. Toward the end of the assignment, the company had a
    dinner in my honor and presented me with a special achievement award.


    This was a watershed moment for my career. Beyond the obvious reasons—winning
    an award, developing a close rapport with higher-ups—the experience had put me
    in a kind of pressure cooker that spurred rapid growth. I had to create proven
    results, and learn how to on the job. The fact that the higher-ups had selected
    me to handle this assignment served as a massive confidence boost, because I felt
    like the top executives had seen something in me that I hadn’t yet seen in myself.
    This, in turn, helped me take on even more high-stakes projects. This success
    begot other successes.


    After I delivered on the first project, the company wanted to build a plan to
    develop a consultancy service. They hired an external senior consulting executive
    to handle the implementation. He bungled it, and because they had the confidence
    in me after my handling the OS switch, they asked me to lead that team. I had
    never done consulting before, but learning once more on the job, I added another
    tool to my box, another cross-discipline competency, which ultimately increased
    my value as an executive.


    Now, let’s imagine: what if I had been a new hire for Google at the same age with
    the same shortage of experience? I wouldn’t even have sniffed a project of that
    caliber. I’d have been stuck in some entry-level position within a tiny scope,
    and miles of corporate ladder between me and senior leadership. In a pool the
    size of Google,


    with so many other swimmers, it’s easy to drown. But at KnowledgeWare, I swam
    circles in the kiddie pool.


    ## Financial Rewards


    If you aspire to work in a big corporate environment because you think you want
    the security, predictability, well-defined processes, and better pay (sometimes)
    from the start—beware. What you’re really buying into is limitation. I see it
    all the time in my dealings with large corporations: the old corporate mind-set
    is filled with bureaucracy, politics, boredom, pigeon-holed roles, and fewer opportunities
    for employees to shine. All of this translates to minimal financial rewards. It’s
    hard to stand out in a company with thousands of employees.


    Go to work for a big company, and you’ll get a paycheck—a paycheck and a 4% annual
    raise along with a formal review from a manager who dreads delivering it. The
    *potential upside* is far greater at start-ups. And the initial financial rewards
    might not be too bad either. Depending on the size, cash flow, and product launch
    status, a start-up may offer a competitive salary right off the bat, or it may
    start you off with a modest salary with the potential to own a piece of the pie
    through stock options. The stock options could lead to astronomical compensation
    later on, if the company is successful.


    In my opinion, always go for the stock options. A good rule of thumb: the earlier
    you get in at a start-up, usually the better. For example, if someone joined Thycotic
    in 2019 and took stock options, they’d get their options at the current fair market
    value, which, for the point of this example, let’s say is $10, while if you’d
    gotten into Thycotic at the ground floor when the options were valued at, say,
    $3, then you would have gained $7 per unit. The earlier you get in, assuming the
    company grows, the more money you can end up making.


    The second piece to stock options is just how important they can be for personal
    wealth. In my experience, as you grow in your career and move up the ladder, you
    have the opportunity to make more money. And, as you get older, you get new responsibilities.


    You have a family, you want to buy a house, you want to invest in your children’s
    education, the list goes on. The point is, you constantly find new ways to spend
    money. So, even though your salary is increasing, and even though your bonuses
    are increasing, your actual personal wealth doesn’t grow because your expenses
    increase at the same time. And while some people are more diligent about saving
    and investing than others, the amount of money even the most disciplined person
    can accumulate pales in comparison to what you can make through stock options,
    for the simple reasons that those assets are less liquid, and they can increase
    in value very fast, so you may consider holding on and riding the wave of value
    creation. In the actual handling of stock options, of course, there are all sorts
    of rules and regulations that dictate when and how you cash them out, so that
    will vary on a case-by-case basis.


    The bottom line is this: when it comes to investing, where I’ve found the biggest
    gains, and where I feel the most confident, is betting on myself and the team
    I work with. When you invest in the general stock market, picking up stocks in
    other corporations that you’re not involved in, you’re betting on things outside
    of your control, like if the oil prices will hold, or if the CEO, who you don’t
    know at all, will run the company well. The smart move is to keep your money where
    you can play a direct role in its growth, and you have direct knowledge in the
    day-to-day operations. Do note that not all start-ups offer options, and that
    is something to consider in your selection process, but we will handle this in
    more depth later in the book.


    ## Culture


    Remember that earlier quote about being the last outlaws on the frontier? About
    being the freewheeling, quick on the trigger, rebel with a cause ethos of a start-up?
    I can tell you from my experience, it’s true. When you’re working for the right
    start-up, that’s how you feel. And like any band of outlaws, you and your co-workers
    will develop the kind of community that can only exist in a small company of rebels.


  - '[PAGE 107]


    person is better educated or better connected than you—how can you compete? By
    outworking them. The truth is, the hustle will cost you. It’s the price for the
    sustained success, and every accomplished start-up leader I know has paid.


    One of them, Simon Azzopardi, senior vice president of the international team
    at Thycotic, says that hard work has bolstered his success at every step of his
    start-up journey. Early in his career, he read a story about John D. Rockefeller
    that captured his imagination. The tycoon was asked, “How much money is enough
    money?” and Rockefeller replied, “Just a little bit more.” Azzopardi adopted that
    mentality and applied it to his work ethic. He says, “How much work is enough
    work? Just a little bit more. My ability to always strive for us to achieve a
    little bit more has helped me tremendously in the start-up world. You have to
    be self-motivated. Nobody’s giving you ‘atta-boys’ every day. It requires hard
    work, and it’s hard when things fail, but when things work, the hard work and
    extra effort were all worth it.”


    This trait is so important that it’s become one of the primary things I look for
    whenever I promote or hire. Early on, one of my mentors told me to fill my team
    with workhorses, not showhorses. The people who end up most successful aren’t
    always the smartest in the room—they’re almost always the hardest working.


    I’m fortunate in the sense that I’ve been a hard worker my entire life. A lot
    of people, especially young people, complain and claim that they are just not
    hard workers. The truth is, with practice, anyone can develop this trait. How?
    Here are my four keys to becoming a hard worker.


    **1. Work smart through prioritization.** A lot of people say, “Work smart, not
    hard.” I agree with half of that. There’s no reason you can’t work smart and hard,
    and the first step in that is cutting the distractions and only focusing on things
    that matter. You know what the time-sucks are: unnecessary email, unnecessary
    meetings, and activities that are not tied to the results required to accomplish
    your goals. Busywork on small, nonimpactful activities is the number-one obstacle
    to success.'

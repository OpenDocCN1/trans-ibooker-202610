    If you were to take a straw poll of employees in just about any company and ask
    how many of them felt underappreciated, you might be surprised how many would
    say they were. Everybody wants to be appreciated for their work, and when they
    are, it creates an amazing, positive environment. I’ve worked with teams where
    everyone seemed too busy to even mutter a thank you, and talented people left

  - '[PAGE 64]


    You have to go deep to go high. When I hire, one of the most important factors
    in my talent evaluation process is deep knowledge. I know that people who have
    taken the time to become an expert will perform better, solve bigger problems,
    and produce higher value. Besides getting you hired, those three qualities will
    get you promoted as well.


    Kevin Klausmeyer, as I mentioned earlier, learned early-on how to distinguish
    himself through deep and wide knowledge. “I was a finance guy in a tech space,”
    Klausmeyer says. “I joined an industry task force focused on writing software
    accounting rules, and the level of knowledge I gained made me unique and helped
    me stand out as a finance guy who’s helping to create the rules that all companies
    in the tech industry needed to follow. That was my differentiator.”³ He encourages
    all employees—whether in or out of tech fields—to find their own differentiator.
    Get that additional certification, join an industry group, and seek a volunteer
    leadership role in an area you’re passionate about that will distinguish you from
    the pack.


    Spend time creating your “whys,” find one main area you’re passionate about, and
    focus your career in that area. Of course, make sure it’s a broad enough area
    to have a growth path to the top within multiple start-ups. If you acquire too-specialized
    knowledge, you won’t be effective in the C-suite. For example, I focused on marketing
    and how it contributes to revenue growth, not website development.


    Once you decide to make yourself an expert, it’s easy to find the information
    you need. Knowledge is everywhere. Learn from analysts, industry influencers,
    and mentors, and take notes on their insider secrets. Dive into market research,
    plans, blogs, articles, websites, and public filings. Say yes to challenging projects
    and learn as you go. Seek help as needed, and look for constructive feedback from
    people whom you trust and respect.


    One of the best places to look for new knowledge is your competitors. Steve Jobs
    loved the Picasso quote “Good artists borrow,


    > “Good artists borrow,”


    ³ Author interview with Kevin Klausmeyer, April 2019.'
  - '[PAGE 65]


    great artists steal,” for a reason. It also applies to business. I once noticed
    that another technology leader had built an online tool for helping organizations
    assess the need for their product. I thought this was a great idea. I studied
    the concept and realized we could develop a better version that focused more on
    the customer and less on our own company. We built it and it was a huge hit. It
    increased our sales and propelled our company forward. The key isn’t to just put
    out some knockoff of what your competitor is doing—it’s to improve upon ideas
    that already exist.


    When people ask me how they can move up, I always tell them to invest in growing
    their knowledge every day. You need a beyond-the-basics understanding of the industry
    and your company. If you’re aiming for a financial position at a tech start-up,
    for example, you’ll need to develop deep financial expertise, plus knowledge of
    the company’s products, competitors, and customers. That doesn’t mean you need
    to know how to code (I don’t). It means you pay attention to innovations happening
    around you and think about how to learn from them to create something better or
    contribute bigger ideas.


    Create your own learning plan that includes what you will learn, by when, and
    with what resources. Then schedule learning times on your calendar and don’t let
    anyone take that time away from you. This is your time to devote to yourself and
    growing your knowledge every day, whether you’re working toward a degree in a
    formal education setting, or engaging in self-guided learning via books, online
    courses, videos, or conferences.


    We’re all busy, and lifelong learning requires effort, but it’s an investment
    that can skyrocket your income, effectiveness, confidence, communication skills,
    and ability to lead. If people know that you’re an expert in the field, they’re
    much, much more likely to follow you.


    # Develop Strong Communication Skills


    Warren Buffett said, “The one easy way to become worth fifty percent more than
    you are now (at least), is to hone your'
  - '[PAGE 66]


    communication skills, both written and verbal. . . . You can have all the brainpower
    in the world, but you have to be able to transmit it. And the transmission is
    communication.”⁴


    The data, again, backs this up. A LinkedIn survey of hiring managers in the US
    revealed that “communication” is the number-one in-demand soft skill, and it’s
    the most desired skill among entry-level individual contributors.⁵ In my experience,
    this is especially true in the start-up world, where change is constant. In order
    to be nimble enough to survive, a start-up needs employees who can adapt to ongoing
    changes and communicate well on the fly.


    Developing strong communication skills will make you a better persuader, too,
    which means you’ll be able to convince people to buy your products, but also convince
    your co-workers to rally around your vision.


    You need this no matter what field you work in, whether financial or marketing.
    Once, in a half-day meeting with our start-up’s C-suite and leaders from a potential
    partner company, our CFO gave a presentation on our financials. The slides were
    great, but she couldn’t present them clearly. Our guests grew more and more doubtful
    about our capabilities. Sensing catastrophe, one of our directors with strong
    communication skills took over the presentation, saving the partnership. And,
    a few months later, the CEO replaced the CFO.


    You must develop your public speaking to zoom to the top. I know—the idea of talking
    in front of a crowd can be terrifying. I struggled with stage fright as well.
    But you have to get over it. I had to, and it didn’t come easy at first. It will
    help to remember that most audiences want you to succeed. Then, the key is this:
    preparation + practice = confidence.


    Pay attention to the speaking habits of the most effective communicators, and
    model what they do. The best presentations I’ve'
  - '[PAGE 67]


    seen are those where the presenter speaks from the heart and starts the whole
    thing off with humor, a question, or a comfortable story to lighten things up
    from the get-go. The speaker shows engaging slides that aren’t wordy (if they
    include slides at all) without reading the slides, and articulates a clear takeaway.


    To fully prepare, you should know the subject and flow of the presentation “cold,”
    understanding the audience and what they’re after, anticipating questions and
    being prepared with answers. Practice any presentation in advance on your spouse,
    partner, your friend, and/or your co-workers.


    Then, during the actual presentation, facilitate two-way dialogue and engagement
    with the audience (ask them questions and invite them to present questions to
    you) and use eye contact to watch for nonverbal clues for engagement.


    Outside of a presentation setting, all of these same rules apply. Be prepared,
    and know what you’re talking about before you speak. And if you don’t, admit to
    it. The worst thing to do is flounder your way through some jumbled statement.
    Finally, proper communication is a two-way street. Just as you need to read the
    audience when you give a presentation, when interacting with co-workers, practice
    listening more than you talk.


    If you can combine expert tech knowledge with precise communication, you will
    become like a golden unicorn: rare and valuable. Most people who work in tech
    are primarily analytical thinkers who communicate in jargon, making them unintelligible
    to the unintitiated. Worse, they often have little patience for anything outside
    of the realms of tech, so it’s difficult to hold their attention long enough to
    effectively communicate. If you’re going to succeed in the tech start-up world,
    or in any field, you need to be able to communicate with these sorts of hyper-analytical
    people. It will make you stand out as a leader, too, as you’ll be able to bridge
    gaps in understanding and propel the company forward.


    So, how do you do that? An important thing to remember is that techies respond
    poorly to platitudes (e.g., “If we work together, nothing can hold us back!”).
    They’re primarily interested in the details that apply to their work, such as
    the customer’s experience of the'

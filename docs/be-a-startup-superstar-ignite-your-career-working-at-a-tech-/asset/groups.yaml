    your mentor share a connection, trust, and similar views on what you want to get
    out of it.


    Once you have your target, find the right time to engage that person and open
    a dialogue so you can ask if he or she is willing to mentor you. Don’t worry about
    whether the request will be seen as rude or off-putting. Remember that almost
    everyone in a position of power got there because they had mentors, and most are
    looking to pay that generosity forward. Personally, I’ve mentored 15 people, and
    I love seeing the people I take under my wing get results.


    The right mentor relationship will seem like a natural extension of the relationship
    you already have. You may want to start by getting together a couple of times
    to make sure it’s a good fit before you both commit to a long-term mentorship.
    Like any other relationship, this one is a two-way street. The best mentors take
    their roles seriously and give you the honest, tough-love low-down about yourself
    that others don’t want to tell you, and they will advise you on the best ways
    for taking action. They can serve as sounding boards. A great mentor will always
    look out for your best interests. All of this can help you reduce mistakes and
    build confidence.


    You have an equally important role as a mentee. For the relationship to be successful,
    take an active role in the partnership. It can’t be treated as a casual thing—you
    must truly desire the insights, wisdom, counseling, and coaching, and be ready
    to receive negative and positive feedback. Take notes. Accept the guidance in
    a respectful way, ask direct questions, follow through on advice. And here’s the
    top responsibility of a mentee: say thank you. Mentors only get paid in gratitude,
    so make sure you offer plenty. They believe in the value of sharing their knowledge
    with the next generation and they want to know it’s being put to good use and
    appreciated.


    # Mentor/Mentee Relationship Guidelines


    The best mentorships operate under a set of ground rules. For example, the mentor
    will commit to a certain amount of time and frequency, and you will act on the
    mentor’s suggestions and circle back to let the mentor know how it’s working out
    or to seek'

    At a dinner party a few years ago, I met a man who told me he worked an eight-to-five
    job for a big company in Austin. I asked him if he liked what he did, and he shrugged
    and said, “It’s a job.” He volunteered to me that years earlier, he had gotten
    in on the ground floor of a start-up and loved it, but it tanked after two years,
    and he never tried to work for a start-up again. With the way I dove head-first
    and blind into my first start-up, I could have very easily ended up on a sinking
    ship, just like this guy. I didn’t. I got lucky and picked a company that turned
    out to be a winner, and I ended up a millionaire. But you don’t have to rely on
    luck.


    What I didn’t realize at the time was that, with the proper preparation and research,
    you can avoid this sort of precariousness. In this chapter, I provide strategies
    for finding start-up job opportunities, and guidelines for how to choose the start-up
    to join that will maximize your chances of success.


    # How to Find Start-Up Opportunities


    As you begin your search, you should keep this in mind—generally speaking, a start-up
    handles hiring in two waves: in the first, they’re just trying to assemble the
    core team. The start-up usually is brand new, and as such, the process might not
    be as efficient. Once the start-up is beginning to prove it is viable and can
    scale, then it makes second-wave hires. These positions tend to be more specialized,
    the hiring process is streamlined, and the company already has a bit of momentum.


    Recognizing the difference between first- and second-wave hiring will help you
    evaluate each start-up you find to determine whether you want to apply, as there
    are advantages and drawbacks to joining with each wave. If you join in the first
    wave, the company will be smaller and in a more precarious position, as they haven’t
    proven viability. For the most part, these jobs are hard to find, and usually
    go to someone with either a personal connection to the founder or some sort of
    a reputation in the start-up world. For that reason, combined with the precariousness
    of joining a'
  - '[PAGE 42]


    company in the first wave, I recommend that young workers or people looking to
    make their transition into the start-up world go after second-wave positions.


    # *Research Posted Jobs Online*


    I know, you just rolled your eyes and muttered “obviously.” This is still the
    best place to start, but to get results, you’ve got to know how to look. Start
    by deciding which area of technology most interests you (e.g., cybersecurity,
    health information technology, artificial intelligence), then add which field
    or department you want to work in (e.g., finance, marketing), and finally add
    phrases like “start-up” or “early stage start-up.” Mix it up by beginning your
    search based on geographical location, whether that’s where you live or in a city
    you’re thinking of moving to. Then, look for positions where you can work remotely.
    Check LinkedIn and other job websites for postings by new companies. These early
    searches will yield a list of companies and jobs in your area, as well as entrepreneur
    events and trade fairs you can attend.


    # *Explore Technology Accelerators*


    Accelerators (or seed accelerators) are application-only programs that provide
    capital, mentorship, and educational opportunities to start-ups, which often culminate
    in either a public pitch event or a demo day. These are a great weeding-out tool,
    as companies that go through an accelerator have a greater chance of attracting
    a lot of venture funding. Research local accelerators and see which companies
    are participating.


    # *Attend In-Person Entrepreneur Events*


    These events might take the form of trade shows, seminars, talks given by industry
    leaders, or networking events held by local trade groups, among many others. For
    example, in cybersecurity, the SANS Institute is a cooperative research and education
    group.'
  - '[PAGE 43]


    SANS, true to its mission, hosts a large number of training and networking events
    around the country, many of which are open to the public and could provide useful
    contacts for breaking into the cybersecurity field. Once you know which field
    of tech you want to work in, figure out what the major trade groups are (like
    the SANS Institute) and be on the lookout for upcoming events. Most local accelerators
    post calendars on their websites that list industry events in the area.


    When you have selected a list of events to attend, go to them. But don’t just
    show up. Go with a plan. Research the event beforehand, know who will be there,
    and know who you want to talk to. When you arrive with your target list in mind,
    don’t just cruise around asking CEOs for jobs. Introduce yourself and ask questions.
    People love to talk about themselves, so this is the easiest way to establish
    rapport. You can start by asking about the technology at hand, but eventually
    you should personalize it. Ask them about things like what they do for the company,
    what they love about working for the company, what makes the company special,
    and what makes them excited to get up in the morning.


    Listen to their responses. Don’t just feign interest. This is the most important
    thing—nobody likes insincerity and people can always detect it. If you’re serious
    about breaking into whatever the industry is, you should have a genuine interest
    in the answers. Because you will learn, not only about the company, but also about
    how to be successful in the industry. Then, once you get a conversation flowing,
    if a bridge to asking about employment or getting your foot in the door materializes,
    you can use it. You can say something like, “Wow, it sounds like you have the
    kind of position that I would really love to have one day. Do you mind if I tell
    you what I do, where I’m at, and would you mind giving me some pointers?” Then,
    without having seen your resume, they already have a sense of your skill set.
    From there, you can ask if they know if their company is hiring, and if you could
    throw your hat into the ring. This way you don’t come across as desperate, just
    genuinely interested in the company’s work.'
  - '[PAGE 44]


    If you go in with the mind-set of selling them on hiring you, then you’re going
    to get nowhere. People hate to be sold to. They want to give and get. When it
    comes to networking, the best way to sell them on you, is to focus on them.


    # Engage with Start-Up Leaders Online


    When you find the companies you’re interested in, follow them and their leaders
    on social media. Read their posts, and when you see something interesting or that
    you have questions about, reach out. A way this might work is if you read a post
    of theirs on LinkedIn, and it resonated with you. You could then reach out with
    a well-written, specialized, private connection request in response to the post.
    This will show that you have done your homework, have thought about the industry
    and this person’s role in it, and you want to engage in a serious manner. Again,
    you don’t want to come across as someone just trying to get something or sell
    them on you.


    If there is somebody you want to get in touch with, keep an eye out for their
    next speaking engagements, hiring events, or announcements about their participation
    in trade shows or conferences. Go to them, introduce yourself, and ask a couple
    of questions. With a little research, usually you can uncover their email address
    and send a thoughtful, well-written email.


    Of course, it’s important to remember that you’re reaching out to busy people
    who probably receive a lot of messages like this. Don’t get discouraged if you
    don’t receive a ton of responses—I know that I ignore most of the LinkedIn messages
    that I receive. But you can maximize your chances by preparing a well-written,
    articulate, and diligent inquiry.


    # Attend Hiring Parties


    When I worked for PentaSafe, we ran our headquarters out of a beautiful, redbrick
    Southern-style mansion. People had their offices in bedrooms, bathrooms, and closets.
    It, of course, seemed like the'
  - '[PAGE 45]


    perfect place for a party, and at that time we were growing rapidly and needed
    to hire more team members.


    More than once, we got a few kegs and put them out on the front lawn, then just
    spread the word around. At the time, a much larger competitor was headquartered
    nearby, so we hired a banner plane to fly over their headquarters with a sign
    that said “We’re Hiring! Check out our website for details about our hiring party!”


    People would come, have a few drinks on the lawn of the mansion with us, listen
    to music, and talk about the company. Several start-ups still use tactics like
    these to attract talent, and if you have a chance to attend one of these parties,
    seize it! Not only are they great for getting you hired, but they also will give
    you an excellent opportunity to gauge the company culture.


    # Be Willing to Intern (Preferably for Pay)


    If your resume doesn’t include any experience beyond front-line retail or foodservice,
    it won’t garner a lot of attention, even at a start-up. That’s why, if you’re
    in school or fresh out, an internship is a great way to get your foot in the door.


    The start-ups I worked for frequently hired paid interns in both tech and nontech
    positions. One start-up, The Planet, hired a young man as a finance intern while
    he was a junior in college. Since he had no experience in finance, we would never
    have hired him as a full-time employee, but we were willing to give him a paid
    internship to assist our finance leader. With us, he made meaningful contributions
    to our financial analysis efforts and developed his Microsoft SQL skills at the
    same time. This is important—not all internships are created equal, and if you’re
    about to provide free or cheap labor for an organization, it’s vital that you
    get valuable experience in turn. Make sure to ask what the scope of any potential
    internship will be, and don’t be afraid to advocate for yourself as an intern.
    Remain professional, of course, but remember that nobody will make sure that you
    benefit from your internship if you’re not proactive.'

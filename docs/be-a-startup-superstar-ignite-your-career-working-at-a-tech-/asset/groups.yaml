    I knew one manager who would tell her team, “If the boss contacts you, I want
    to know about it.” This sent the message that she didn’t trust her team to say
    the right things or handle situations properly. When your team doesn’t feel like
    you trust them, it undermines everything you try to accomplish. They grow resentful,
    lose confidence in you, themselves, and the team’s ability to deliver on the goals.


    Of course, starting out, you might not even have the chance to become a control
    freak boss; you might end up underneath someone’s microscope. If that happens,
    your goal should be to create the type of relationship where you model good leadership
    skills yourself. First, go out of your way to define the communication expectations
    in the relationship. Ask how often you should share status updates, and at what
    level of detail. Listen to what the boss wants, but don’t be afraid to clearly
    tell them what sort of environment you work best in. For example, you might say,
    “No problem, I can deliver weekly reports, but I operate best if I have the freedom
    to succeed and some level of autonomy.” Once you and your boss have reached an
    agreement, document it and send it to your boss. That way, when the boss becomes
    domineering and controlling, you can pull out the agreement and say, “This is
    how we agreed to work together. Do you trust me to do the right thing?”


    Once you advance at a start-up and start leading your own teams, it’s important
    to strike the right balance between being attentive and available to your team
    without being overbearing. Doug Erwin made a point to talk to employees at all
    levels to find out what was going on in the trenches, but he didn’t believe in
    surprise inspections—he made sure to talk loudly for a few steps before showing
    up at an employee’s office. Then he’d sit down with them and have a conversation
    with the goal of building a relationship, not evaluating the performance. At the
    same time, he learned valuable details that would inform his high-level decisions.
    He was learning the details of business operations in all areas, so he could use
    it for productive purposes, as good leaders do.'

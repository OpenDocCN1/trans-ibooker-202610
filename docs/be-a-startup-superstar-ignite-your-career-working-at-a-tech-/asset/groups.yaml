    like you need to tackle the top-priority thing. That’s fine. We all have our own
    ways of working. And besides, it is functionally impossible to get your activities
    to match up 100% with your top objectives every day. Things pop up in life that
    you’ll need to take care of. The key is to make sure that the top priority items
    still get done—if the way your calendar is structured prevents you from doing
    that, go and excise some superfluous items.


    When you’re a young professional or when you’re working in a start-up environment,
    it can be difficult to figure out what to prioritize, as the role you fill might
    be less defined. Early in your career, it’s best to ask your boss to fill you
    in on the company’s top priorities as well as the important objectives within
    your specific department. Then you can seek advice on how you can take specific
    action toward these objectives.


    Here’s a great approach. Ask them, “If in six months, you and I are having a cocktail
    to celebrate something I have just accomplished, what did I do?” Your boss’s answer
    will provide a better sense of which tasks to prioritize, and help you stand out.


    To leverage this into a way to be seen as C-suite material, make sure to follow
    up. If your boss gave metrics for you to hit in a couple of different areas, once
    you’ve gone out and done the work, come back and say, “Hey, we hit the metrics
    here, but we didn’t quite reach it in this area. I’ve thought about this, and
    here’s how I’m going to fix it.”


    Every executive I have ever met would treasure a young professional who did that,
    yet it almost never happens. If you do it, it can help you stand out and move
    up and propel you into the C-suite.


    On the flip side, once you reach a management position, it becomes your job to
    make sure that your team focuses on the most important tasks. For example, in
    my work as CMO at Thycotic, I keep my team focused on our overall goal of growing
    revenue. There are lots of other, smaller tasks or things that we as a marketing
    department can do, many of which are easier or a lot more fun than doing the things
    that contribute to revenue growth. If you don’t pay attention, your workers will
    naturally drift toward those tasks. This doesn’t mean that these tasks shouldn’t
    be done, but that they must take a backseat to the company’s top priorities.


    ## Be Your Own Top Priority


    The most important item on your calendar is you. You are priority number one.
    Does your calendar reflect this? Go ahead and open your calendar right now, and
    check to see how many appointments you have with yourself this week. I’ll bet
    you have too few.


    Think about the most valuable uses of your time, create estimates for how long
    your top business and personal priorities will take you, and block out that time
    on your calendar—as early as possible. First, block off the time you need to care
    for yourself and your family. Personally, I look at my calendar at least two weeks
    in advance and I block out time for myself, such as workouts, family time, learning
    time, and strategy time. I then block out regular meetings that I know I need
    to attend.


    Notice that I don’t just leave my personal time as white space on my calendar—if
    you do that, people will think that time is free and try to schedule you in another
    soul-sucking meeting. Blocking off the time lets everyone know that I have priorities,
    and that the blocks of time I listed earlier are untouchable, except in the most
    extreme circumstances.


    Regardless of what your calendar says, the person you have to protect your calendar
    from the most is yourself. Good time management not only means you make sure to
    set aside the most time you can, but also that you use your time efficiently.


    Often, people try to enhance efficiency by multitasking. Don’t. It doesn’t work.
    Focus on one priority task at a time. Finish it and move on to the next. The American
    Psychological Association reported that “Multitasking takes as much as forty percent
    more time than focusing on one task at a time.”³


    In addition to setting aside time to handle your top-priority work, make sure
    to add essential meetings to your calendar. These should include regular touch-base
    meetings with your boss. Such one-on-ones help you sync up, set priorities, and
    combine brainpower to deal with issues. If you have a crappy boss who doesn’t
    schedule time to meet with you, be proactive and request it. You can even set
    this expectation in an interview before accepting a new job.


    ## Put Your Family First


    Here’s a secret to my success: I’m a workaholic and I put my family and myself
    first. Even at start-ups where long hours are the norm, you don’t need to sacrifice
    your family to excel or make it to the C-suite. Unfortunately, many make that
    choice and they pay a terrible price. Time is your most precious resource, in
    business and in your personal life. Kids and grandkids grow up, marriages need
    nurturing, and elderly relatives may need attention, too. All too often I’ve seen
    someone climb as high as they can in their career, and then they look at their
    weathered face in the mirror and realize they missed spending time with the people
    they valued the most. Success loses much of its sweetness when you have no one
    to share it with.


    We all face the conflicting priorities of work and family. Each one of us has
    our own unique situations and priorities—there is no one-size-fits-all solution
    to the problem, and, indeed, over the years the amount of time you need to dedicate
    to work and family will fluctuate.


    It’s a constant tug-of-war. Part of the problem stems from living in an age of
    universal technology accessibility. Company leaders often hope and expect employees
    to stay connected and to be available at a moment’s notice at all hours: early
    in the morning, lunchtime, all afternoon, dinnertime, evenings, weekends, and
    even on vacations. If you let them have it all, they will take it. Instead of
    enjoying the ocean with your friends or family, you will be sitting under a cabana
    trying not to get sand in the keys of your laptop.


    To find the right work/life balance, you’ve got to ask the tough question: how
    can you be the most effective provider for your family? The typical answer to
    this question is that work and income have to come first. But that puts you on
    a slippery slope. The right answer to this question is that work and family time
    are equally important because they are interdependent. I know that if I’m unhappy
    in my personal life, it will negatively affect my work life, so I don’t let that
    happen. Likewise, I know that if I’m unsuccessful in my professional life, it
    will negatively impact my family, so I do what I need to do to succeed at work.
    The key is finding a happy medium.


    This medium can seem impossible to find, but you will experience significant benefits
    by seeking it. A study by Family Living Today and NowSourcing reported that 66%
    of full-time employees don’t strongly believe they have achieved a work-life balance.⁴
    The study went on to say that this lack of balance includes both short-term and
    long-term consequences. In the short term, at home, 51% of respondents said they’ve
    missed out on important life events, and 40% said they’ve had time spent with
    the family ruined by work. In the workplace, 68% experienced poor morale, 36%
    reported poor productivity, and 41% reported a high turnover rate due to burnout
    and fatigue.


    The long-term effects are downright scary, as those who lack work/life balance
    carry a higher risk of heart disease and stroke, as well as depression and anxiety.
    Striking a healthy work/life balance could literally prolong your life.


    And it is attainable. I’ve been an executive leader the better part of 30 years
    while keeping my family as my top priority. I’ve always worked hard to set aside
    time for my wife, my kids, their games and performances (when they were young),
    and my friends. It


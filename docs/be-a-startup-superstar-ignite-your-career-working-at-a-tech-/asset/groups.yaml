    # How to Develop Empathy


    A lot of people believe that empathy is something you’re either born with, or
    you’re not. While it’s true that some people are more naturally attuned to the
    feelings and moods of others, empathy is still a skill you can develop and practice.


    You can start by simply paying more attention to how you contact your co-workers.
    One of the least-empathetic practices that I see all the time is the email “reply
    to all” feature. Often, sending a mass communication wastes everyone’s time in
    reading a message that isn’t necessary for them to know. It’s even worse if the
    message contains a course correction for a specific employee. These sorts of messages
    are better handled privately—they spare your employees embarrassment. Nobody benefits
    from a public flogging. The greatest danger associated with the “reply all” practice
    is when proprietary information leaks because someone hit reply all by accident.


    At one of the firms I worked for, some partners started discussing a potential
    acquisition while “replying all” to an email thread, and a few employees who really
    shouldn’t have known about it caught wind. The rumor mill started to spin, and
    soon the entire office thought we were on the verge of being bought, which wasn’t
    even true. Make sure you develop the habit of paying close, careful attention
    to how you handle all of your correspondence. Here are other simple ways you can
    practice empathy:


    +   - Listen actively, don’t interrupt, and don’t formulate a response while listening.

    +   - Summarize your understanding of what someone said before sharing your response.

    +   - Find common ground.

    +   - Ask empathetic questions such as, “What’s on your mind?” and “How do you
    feel the new project is going?”

    +   - Make eye contact to show you’re engaged.

    +   - Practice 360-degree feedback sessions to get feedback from those above,
    at your level, and below you in the hierarchy of your organization.'

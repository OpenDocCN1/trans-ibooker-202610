    Kevin Klausmeyer, a financial expert and noted recruiter of top-flight talent,
    says that two qualities he looks for are passion and tenacity. He goes on to say,
    “When I say passion, I mean they wake up every day with a super positive frame
    of mind, willing and ready to take on anything that gets in their way.”⁸


    Klausmeyer asks interviewees to share about scenarios where the dynamics changed
    and they had to pivot, or to tell him stories around something they did in school
    or when working as a team. He uses the vigor and enthusiasm with which interviewees
    tell their stories to gauge their level of passion.⁹ In short, it’s not enough
    to simply have a lot of passion—to be an effective leader and attractive candidate
    for recruitment, you need to be able to communicate it.


    # Keep Your Surroundings Positive


    I choose to surround myself with positive, optimistic (yet realistic), people.
    They are more fun, more resilient, and they make better decisions under stress.
    They don’t sweat the small stuff. And they help to keep me optimistic, too.


    On the flip side, I’ll go out of my way to avoid negative people—they are a drain
    on energy. It seems as if some people carry around a giant straw they use to suck
    the life out of everyone. I strongly suggest that you do your best to avoid these
    types as well. Give them a wide berth, and don’t let yourself get dragged down
    into their negativity. One key to this is avoiding the rumor mill. Never talk
    negatively behind the backs of any of your co-workers, especially while you’re
    at work. These are simply distractions and opportunities for insecure people to
    make themselves feel better in the short term, but in the long run, it will undermine
    people’s ability to trust you and hog-tie your career advancement. Don’t give
    in to it.'
  - '[PAGE 151]


    # How to Foster Optimism in Yourself and Your Environment


    I’ve been fortunate to have worked in a number of amazingly positive work environments,
    but I’ve experienced the negative ones, too. I’ve often thought about what separates
    those positive work environments from the stiff, gloomy ones. Is it the people,
    the culture, the success trajectory, or the perception of the difference we make
    in the lives of customers? The answer: it’s all of those things.


    Like gratitude, optimism and energy are infectious. Just by practicing them within
    yourself, you can have a massive effect across the entire company. For example,
    recently at Thycotic, we hired a new, young employee. He asked me for guidance,
    and I agreed to meet him at the end of a day after I’d had two four-hour meetings.


    As I entered the room for my meeting with him, I felt completely drained. But
    this kid came in with a giant smile and tons of enthusiasm and energy. After that
    meeting, I felt completely revived. He came to me for help, but that day, just
    being around him helped me! Being like that kid—positive, energetic—is a choice
    you can make, and it’s one that will put you on the radar of higher-ups the next
    time they’re looking for someone to promote.


    This is not to say it’s easy. As Joe Robinson, a work-life balance trainer and
    speaker points out, “The negative side is much more powerful than the positive,
    so we have to be proactive about bringing the positive forward.” He goes on to
    explain that research from the University of California’s Barbara Fredrickson
    shows that to keep a cheery disposition, we need three positive events to every
    one negative event. Of course, that doesn’t mean you need three more positive
    things than negative things to happen every day, just that you need to focus on
    three more positives than negatives a day.¹⁰


    > 10 Posted by Joe Robinson, "Working Smarter: How Optimism Boosts Productivity
    and Work-Life Balance," https://www.worktolive.info/blog/bid/336460/how-optimism-boosts-productivity-and-work-life-balance.'
  - '[PAGE 152]


    The key, then, is to train yourself to look for the positive. Here’s how you can
    do that:


    +   - Surround yourself with positive people.

    +   - Regularly spend 30 minutes writing down all the positives in your life and
    the things you’re thankful for.

    +   - Expect highs and lows, and keep them in perspective. Things that seem like
    the end of the world are rarely the end of the world.

    +   - Strive for good enough, not perfection.

    +   - Focus on your strengths, your successes, and your goals, rather than comparing
    yourself to others.

    +   - When you hear negative self-talk in your head, deliberately change it to
    positive self-talk, even if it seems forced at first.

    +   - Gain a mentor’s perspective on ways to build energy and optimism.

    +   - When you feel pessimism setting in, interrupt it. Get out of the office,
    go for a walk, head to the gym, watch a short comedy. Then tackle the issues from
    a more positive, optimistic point of view.


    At the end of the day, you will never achieve great things unless you believe
    you can. This is a huge part of why optimism is essential to reach the C-suite:
    you must believe you will get there, and then believe that once you’re there,
    you can steer the ship the right way, and even when the skies darken, you will
    remember that the next dawn is on its way.'

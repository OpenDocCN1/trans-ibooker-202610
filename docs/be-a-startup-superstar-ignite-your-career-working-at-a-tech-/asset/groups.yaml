    # Choose Your Mentors


    Don’t wait around for a mentor to select you. Be proactive about it. Seek out
    advice when you realize that you’re in over your head. Or even better, line up
    a good relationship with a mentor beforehand.


    The key is to choose carefully and wisely. When you look for a mentor, first define
    the areas you want to improve and which skills and work habits that you need to
    be successful in your career. Like any other goals, write these down and keep
    them in front of you. Once you have that clarity, look for someone who can help
    you enhance those skills. Also, be sure to find someone who compliments your personality,
    skills, and needs.


    A great place to start is to look at your goals and then identify people who have
    achieved similar things. Then, pick one or two A-plus-talent types who seem like
    they would be able and willing mentors. This works best if you start with someone
    who already knows your work ethic and with whom you already have a relationship.


    My first mentor told me that he only agreed to help me because he could see that
    I was eager, enthusiastic, organized, and, most importantly, open to new opinions
    and ideas. If you already impress daily in the workplace, finding a mentor will
    be that much easier.


    It’s possible to find mentors among those you do not yet know. Mentors make themselves
    available at tech accelerators, business MeetUp groups, and the like. But again,
    it’s ideal to start from an existing baseline of a respectful relationship so
    you know you and'

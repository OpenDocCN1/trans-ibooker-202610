  - '[PAGE 108]


    Don’t fall into the trap of working hard on nothingness. Make every moment of
    your hard work count.


    2. **Keep your top goals and priorities in front of you at all times.** Create
    small, attainable goals and link them to specific deadlines so you can feel your
    progress. Accomplishing goals is addictive, and it turns hard work into a habit.


    3. **Find the habits that help you be the most effective you can be.** Some people
    I know work best when they set a timer and pledge to be laser-focused for an hour,
    then give themselves a 10-minute break, then another hour of focus. I find that
    I do my best work early in the morning, so I make sure to wake up, do my workout,
    and get into the office before dawn. Figure out the pattern that works best for
    you.


    4. **And finally, celebrate your hard work.** Take the time to acknowledge what
    you accomplish. At the end of the day, write down a list of everything that you
    got done so you can hold yourself accountable and see how disciplined and productive
    you’re being. After a successful bout of hard work, treat yourself with your own
    rewards, whatever makes you happy. Recognize and celebrate others who worked alongside
    you.


    Of course, there is an entirely different set of challenges, both for workers
    and managers, associated with working remotely, which is very common in the start-up
    world. The remote-team environment magnifies leadership challenges, so managers
    need a mix of guidelines, accountability, and trust that the remote team members
    are working as hard as those on-site. The best leaders build personal relationships
    and get to know their remote workers as best they can. They don’t rely on email
    to communicate, but use tech tools for virtual meetings, instant messages, and
    file repositories to create smooth processes for everyone.


    If you’re considering working remotely, first have an honest conversation with
    yourself. Do you have the discipline to treat your home office in the exact same
    way you’d treat a traditional office? To get up on schedule and eliminate distractions?
    Some people do; some people don’t. If you don’t, and you try to work from home,'
  - '[PAGE 109]


    you’ll hamstring your career by limiting your effectiveness in the short term.


    Regardless of whether you work at home or at the office, one of the benefits of
    working for a start-up is that it’s not a nine-to-five job. It’s way more rewarding
    and exciting than dragging yourself into the office and then fleeing right at
    five. But, at the same time, it does mean that you won’t just work from nine to
    five. You’ll have long hours, especially if you want to get ahead and become a
    leader at the company. The incredible thing about working for the right start-up
    is that it won’t even feel like long hours. I just went to a PentaSafe reunion,
    celebrating the 15th anniversary of when the company was sold. This was the company
    where I pushed my team to work so hard they made the “I Survived a Quarter with
    Kahan” shirts. And yet, when we got together, thinking back on those years, all
    we could talk about was how our hard work back then didn’t feel like work, not
    even for one day.


    # Show You Know Your Customers


    During company meetings at Amazon, CEO Jeff Bezos leaves an empty chair at the
    conference table and announces to attendees that it’s occupied by “the most important
    person in the room”—the customer. Then, he backs up his talk with an array of
    metrics, 80% of which are focused on what customers care about. You don’t have
    to be founder and CEO to take a page from Bezos’s playbook. Understanding customers
    will help your company better invest time and money, get to the heart of problems
    fast, improve your products or services, and test ideas.


    This is especially important to remember as you move up in a company. Generally,
    the higher up you are on the corporate ladder, the less you interface with customers.
    This means that, often, the people making the biggest decisions are those who
    have the haziest idea of what the customer wants. When I was at PentaSafe, Doug


    > ¹ Bob Thompson, “Take a Tip from Bezos: Customers Always Need a Seat at the
    Table,” *Entrepreneur* (May 28, 2016), https://www.entrepreneur.com/article/234254.'
  - '[PAGE 110]


    Erwin combated this by creating a program that required managers to contact five
    to seven customers, twice a year, within a two-week time range and ask them five
    key questions. The questions were:


    +   1. On a scale of 1 to 10, with 10 being extremely satisfied, please tell us
    how satisfied you are.

    +   2. Based on the answer above, please provide the reasons why.

    +   3. Do our products help you achieve your goals?

    +   4. How can we improve?

    +   5. Would you recommend our products to a colleague?


    After we’d all collected our data, the managers would present the results to each
    other in a half-day session. Every single time, we’d uncover essential insights
    into what thrilled our customers and what frustrated them. Of course, all of the
    most valuable insight in the world wouldn’t have mattered if we didn’t take any
    action. Customers hate lip service, and all too often a company will sink massive
    amounts of resources into data collection only to let that data collect dust.
    We documented the feedback and chose the most important items, what steps we would
    take, and who would be held accountable.


    We didn’t stop there, but instead, completed the feedback loop. After the meeting,
    we made sure to follow up with the customers and update them about whether we
    chose to adjust our product or process as a result, and why or why not. This showed
    our customers that we were paying attention to them.


    So, if you’re looking for a great way to stand out right when you arrive at a
    start-up, seek a better understanding of your customers’ needs. As you plan to
    gather their feedback, know what goals you’re trying to achieve; prepare questions
    that will solicit honest, valuable input; identify the right customers; add a
    feedback loop; and be prepared to take action. Here are ideas for gathering customer
    feedback:


    +   - Proactively interview them.

    +   - Send customer surveys.

    +   - Attend your company’s seminars so you can meet customers.

    +   - Create focus groups or customer advisory boards.'
  - '[PAGE 111]


    +   - Seek input on social media.

    +   - Go where customers hang out and get to know them.


    All of these activities are easier at start-ups, where there aren’t as many layers
    of policies or rules to work around. Once you have your data, use it to develop
    new ideas and share them with your managers and supervisors. This will show that
    you’re a motivated self-starter, a proactive and creative thinker, who is primed

    首先，让我们看看什么是初创企业。根据美国小型企业管理署（SBA），初创企业是成立不足一年的公司。然而，这并不能很好地描绘初创企业的真正定义。我的朋友 Doug
    Erwin，RedHouse Associates 的主席和负责人，也是一位连续的科技创业者，提供了一个更具指导性的定义。在他看来，初创是一个阶段。他说：“如果一家公司运营起来像最后一块法外之地的边疆，一个非主流人士可以生存、创造并销售其想法的世界，那么它仍处于初创阶段。”


    谁不想参与其中呢？在初创企业，你可以扮演那个亡命天涯的狂野反叛者，那个无拘无束的新来者，去骚扰那些步履蹒跚、墨守成规的旧势力。如果你去任何一家财富 500
    强或大型科技公司工作，你就会变成那些笨拙的法警之一——一个齿轮，打卡上班，在神志不清中推诿公文，度日如年。



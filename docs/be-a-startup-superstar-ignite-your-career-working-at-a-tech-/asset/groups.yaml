    # Gratitude Is Contagious


    One of the best ways for a new employee to make an impact is by practicing gratitude.
    You don’t have to rely on anybody else to do it. You don’t have to wait for an
    opportunity. You don’t have to be leading a team. You don’t have to be in the
    right place at the right moment. You can create a habit of giving heartfelt thanks,
    and no one can stop you.


    This can also fast-track you into leadership because gratitude is contagious.
    When you show up and start thanking your co-workers, they will want to pay it
    forward. People will notice that you were part of the shift, and likewise, appreciate
    it. And even if your gratitude doesn’t spread, then it will make you stand out
    as a positive force with potential for leadership. This also works in the inverse.
    If you have a habit of not showing gratitude to your co-workers, it will breed
    resentment that leads others to not showing gratitude. This, too, will be noticed.


    # How to Show Gratitude


    Most managers and employees miss out on their best opportunities to show gratitude:
    an annual performance review. Often, these mandatory reviews are dreaded on both
    sides. They tend to mostly focus on areas to improve rather than on great work.
    I guarantee you that most managers literally think, “Oh crap. I’m so busy, and
    I’ve got to do someone’s review. Guess I’ll get it over with.”


    Then during the review, they say, “Great job but you could do these few things
    better . . .” and then everyone goes back to work.


    > ⁴ “Thanks, But No Thanks,” OfficeTeam news release by Robert Half (April 12,
    2017), http://rh-us.mediaroom.com/2017-04-12-THANKS-BUT-NO-THANKS-Survey-Reveals-Strongest-Forms-of-Workplace-Recognition-Research-Also-Finds-Two-in-Three-Employees-Would-Leave-Their-Job-If-They-Didnt-Feel-Appreciated.'

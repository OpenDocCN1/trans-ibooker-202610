  mdcn: '


    坚持几乎总是会得到回报。 要么你会得到你所追求的目标，要么在寻找它的过程中，你会学到宝贵的经验教训，或找到一个更好的解决方案。 在初创公司中尤其如此，公司在起步阶段可能会尝试四五种不同的策略来寻找自己的定位。
    在这个世界里，你可以拥有世上所有的才华，但如果你在遇到第一个小挫折时就放弃，那一切都毫无意义。


    ## 第7章：谨慎选择你所交往的人


    > 如果你是一个房间里最聪明的人，那么你就在错误的房间里。

    > ——洛恩·迈克尔斯，电视制作人


    我们是谁以及我们在商业和生活中表现如何，很大程度上取决于我们交往的人。 如果你让自己周围都是聪明、敬业、努力工作、有创业精神的人，那么他们的特质会开始在你身上显现。
    他们会激励和挑战你，你也会随之成长。 更妙的是，当其他人看到你与这些高绩效者为伍时，他们会通过关联把你也看作高绩效者。 如果你让自己周围都是平庸者，情况则恰恰相反。
    本章概述了你需要了解的关于如何挑选你花费时间的人以及建立这些关系最佳方式的一切。


    ### 让自己周围都是A+人才


    企业家吉姆·罗恩说过，“你就是你花费最多时间相处的五个人平均值的总和。” 如果这是真的（我相信是），你就必须问问自己，如果你把大部分时间都花在那些困在底层的人身上，你怎么能达到C-suite？
    没有人开始职业生涯就知道成功所需的一切知识——我不知道，我认识的人中没有人知道，甚至比尔·盖茨也不知道。 最快学会这些重要教训的方法之一就是让自己周围都是取得了与你想要相媲美成果的A+人才。
    不仅你可以靠模仿来学习——他们还会激发你最好的工作。


    我说的不仅仅是聪明人； 世界上充斥着聪明的平庸者。 我指的是那些体现了全方位素质的人——聪明、有能力、有动力的人，他们每天都会为自己和周围的人提高标准。 或者，正如《Entrepreneur》杂志文章中所定义的那样，你希望让自己周围都是不懈的工作者、积极乐观的人、好奇的人和梦想家。¹


    Thycotic的总裁兼首席执行官James Legg召集了一个由不懈、积极、好奇的梦想家组成的核心团队，其中几个人已经一起工作了10年或更长时间。 “你和你周围的人一样好，”Legg说。
    “我很幸运，我今天合作的许多顶级领导者都从公司到公司一直跟随我。 让自己周围都是能激励你的人所带来的价值是巨大的，而且这种激励是双向的。”


    这段话的最后一部分很重要——A+人才不仅会帮助你成长，他们还会激励你追求以前认为遥不可及的目标，并激励你发挥出最好的工作。 想出一个问题的巧妙解决方案并不是在真空中发生的，它取决于我们吸收的东西，也取决于我们的思考方式。
    把让自己周围都是能挑战你思维的人作为你职业规划的一部分。 理想情况下，让自己周围都是顶尖人才是你职业规划的一部分。


    培养一个精英内圈的方式始于你被雇用之前。 当你研究可能想工作的初创公司时，仔细看看领导团队。 他们是谁，你能从他们身上学到什么？ 在LinkedIn和其他他们被引用或介绍的在线网站上研究他们。
    查看哪些领导者似乎是潜在的导师。


    尤其重要的是要看看你正在考虑的公司是否由具有创业思维的人领导。 有时初创公司会用在大型公司取得成功的人来填补高级领导职位，但他们很快就会发现自己不具备应对初创公司环境的条件。
    为了在面试过程中弄清楚你是否会加入一个具有创业思维领导者的地方，询问公司的文化和他们雇佣的人才类型。 要求与广泛的基础人员进行面试以更好地了解公司文化永远不会有坏处。


    当你在面试时，问这样的问题：“假设我在入职六个月后，人们都在称赞我的成果。 我取得了什么成就？” 这不仅能让你很好地了解他们的期望以及你是否合适，而且还能告诉你这是否是能推动你成长的环境。


    一旦你选对了地方，确保你选对了人。 寻找不懈、积极乐观、好奇心强、有大梦想并能激发你最好的一面、激励你成长的人。 在这里，重要的是要谈谈高成就者到底是什么。
    最好的经验法则是寻找一个作为整体包，是你想要效仿的人。 考虑他们的职业、个人以及在较小程度上财务方面的成就和他们是谁。


    观察他们是什么样的员工，他们如何创造性地思考，他们有多么驱动。 他们在压力下如何处理自己？ 当他们走进一个房间时，他们如何表现自己？


    不要过于专注于职业方面。 确保你让自己周围都是与你有相同价值观的人。 他们是好人吗？ 他们善良慷慨吗？ 他们愿意与年轻或经验较少的人分享他们所知道的知识吗？
    他们有一个他们尊重和爱护的家庭吗？


    不要被令人印象深刻的头衔或巨额财富蒙蔽。 虽然这些可以是高成就的指标，但它们并不一定意味着拥有它们的人在各个方面都表现良好，或是你想要效仿的人。 一旦你确定了一个伟大的榜样，就与他们建立联系，无论是（或两者）面对面还是在线。


    不要羞于接近这些顶尖人才。 当我刚开始时，我得到了一项需要直接向首席执行官汇报的任务。 那位首席执行官有点欺凌——他喜欢碾压别人，让他们感到害怕。 起初，我很兴奋，但也有一点紧张。
    不久我就克服了首席执行官的令人敬畏的气质。 一旦我做到了，我意识到与他沟通加速了我的学习。


    这让我发现了两件事：（1）我应该一直这样做，（2）紧张是好事。 我感到紧张，因为我不确定如何处理这种情况——这意味着我处于可以成长的位置。 即使现在，如果我在某种情况下太舒服了，我也会担心。
    我尽量总是把自己置于能激发一点恐惧的位置。 关键是不要让那种紧张感压倒你——我学会了将其转化为更努力工作、起得更早、更专注于工作的能力。


    我理解接近高成就者可能会让你感到紧张。 好。 迎接它，并在你发现自己身处高层人士中间时，利用这个机会与他们建立关系。 我经常看到年轻员工感到害怕，不敢向高级领导人、更成功的人或上过更好学校的人寻求建议。
    如果这是你的心态，你将停留在底层，因为这证明了你不舒服待在C-suite。


    对与高成就者建立关系的犹豫传达的信息是，“我认为我低人一等。” 正如我们所涵盖的，成功的关键第一是相信自己。 如果你连与你的主管交谈的勇气都鼓不起来，你怎么能经营一家公司呢？


    在接近高成就者时要记住的另一件事——这应该减少敬畏感——是他们只是普通人。 高成就者喜欢几乎



    # Believe in Yourself


    > Confidence equals security equals positive emotion equals better performance.

    > —Tony Schwartz, president and CEO of The Energy Project


    Self-doubt is like a frayed string: if you tug on it, it can unravel your whole
    sweater.


    In my experience, self-belief is the biggest indicator of success at a start-up.
    Not intelligence, not opportunity, not resourcefulness. But the belief that you
    can make your goals happen—especially in a start-up scenario where the path will
    be bumpier than at a major corporation. You need self-belief to stay steady during
    the ups and downs. All of us, myself included, deal with vulnerability, uncertainty,
    and failure. If you let these things defeat you, you’ll never get anywhere. Trust
    that you will move forward and figure it out.


    I am fortunate to have a built-in belief in myself. Even growing up poor, I knew
    that my situation was temporary. On the first day of sixth grade, I showed up
    in my worn-out clothes and toting my worn-out backpack. Right away I noticed that
    most of my classmates sported new gear from head to toe. Despite lacking all the
    external indicators of success (wealthy upbringing, private schools, high-net-worth
    family and friends), I was unfazed. Now, if you don’t have this in-born self-belief,
    don’t worry. It’s a muscle, and like any other, you can build it.


    When I worked for The Planet, we had a crisis that threatened to shut down the
    entire company. Our data center exploded, sending all our servers up in flames.
    Those servers held the cloud data of thousands of our customers, and suddenly,
    it was all gone.'

    或者在起步阶段遇到困难，但所有这些都可能是这一过程的一部分。关键在于在每个阶段都持续学习，努力工作，并遵循本书中的指导方针。


    例如，看看西蒙·阿佐帕迪（Simon Azzopardi）如何走到今天的位置，成为泰科提克（Thycotic）公司的国际高级副总裁。作为一个马耳他年轻人，他最初是在父亲的旅行社里工作，后来接管了业务成为老板。在某个阶段，公司需要更新且安全的
    IT 网络，于是阿佐帕迪决定亲自学习如何构建并维护它。在这个过程中，他意识到自己比起旅行业务，更喜欢 IT 业务。因此，他把业务卖回给家人，并踏上了成为微软认证工程师的旅程。快进至阿佐帕迪在软件公司的早期职业生涯。关键的一点是，他学会了何时该跳槽并换一家公司，以便他能继续扩展知识并在不同的全球科技市场中积累经验。


    最终，他在 GHI Software 找到了一份工作，在那里他建立了一个成功加速软件销售增长的模型。他的老板注意到了这一点，这也是他迎来重大突破的时刻。他这样描述当时的情景：“那是
    2000 年 12 月 7 日，我的老板走到我面前说：‘嘿，西蒙，你喜欢英国吗？我正在找人来启动我们在英国的业务。’”


    > “我回到家，整个晚上都在制定针对英国的提案和商业计划，并在 12 月 8 日没睡一点觉就提交了它。这让他感到很意外。他并没有要求我制定计划，他对计划的详尽程度感到震惊。那天上午
    11 点，我们就在新的职位和地点上达成了协议，我的旅程真正开始了。我在 2001 年 1 月搬到了英国。”


    阿佐帕迪说，如果他现在重读那份计划，他可能会忍不住笑出声。“在那种情况下，尽管当时我并没有具备所有的专业知识，但我还是对那个机会说了‘是’。这为我的人生带来了许多其他机会。我们必须始终提供我们能提供的最好表现。如果我们对一个机会说‘不’，我们就错过了它。我试着说‘是’，然后想办法去实现。”在整个职业生涯中，阿佐帕迪继续在美国公司、一家丹麦公司以及现在的泰科提克公司中承担
    progressively 更大的角色，特别是在初创企业中。


    ## 换位思考


    领导力几乎比任何事物都更依赖于共情。如果你想激励人们全力以赴，激发他们最好的创意，并让他们热爱为你工作，你就需要理解他们的感受和他们看待问题的角度。培养这一项技能将赋予你能力，知道该说些什么来激励他们，以及他们需要在怎样的环境中才能发挥最佳水平。这项软技能是在
    C 级高管层成功所绝对必要的，特别是在初创世界。初创公司往往吸引多元化的人才队伍，并雇用远程工作者，他们可能来自挪威或印度等遥远的地方。有效的跨文化沟通完全依赖于强大的共情能力。


    这一点，加上快节奏的初创环境，意味着你需要培养一种能力，以便迅速从他人的视角看待事物。这适用于理解老板发出请求或指令背后的理由，理解客户的视角，或在倾听时理解同事的视角。

    -   在分享你的回应之前，先总结你对他人所说内容的理解。

    -   寻找共同点。

    -   提出富有共情的问题，例如：“你在想什么？”和“你觉得新项目进行得怎么样？”

    -   进行眼神接触以表明你正全神贯注。

    -   练习 360 度反馈会议，以获取来自你组织层级中上级、同级和下级的反馈。



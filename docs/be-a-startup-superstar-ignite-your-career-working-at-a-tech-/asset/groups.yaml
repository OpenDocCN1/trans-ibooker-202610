    ## 第五章 像领导者一样行动


    ### （即使你还没有头衔）


    > 唯一能像领导者一样思考的方法是先行动起来：把自己投入到新的项目和活动中，与各种不同的人互动，并尝试不熟悉的完成事情的方式。

    > ——赫尔米尼亚·伊巴拉，教授，《像领导者一样行动，像领导者一样思考》的作者


    问一百个商界人士成功的领导力是什么样子，你会得到一百种不同的答案。或许有些重叠，但事实是，领导力是最难以定义的人格特质之一。无数人耗尽心力试图捕捉成为一名伟大领导者的真正含义，而在众多提供建议的竞争声音面前，很难知道该去哪里寻找。在我的经验中，我发现五种基本习惯和特质是我作为领导者发展的绝佳起点。它们帮助我迅速从基层晋升到
    C 套房，我现在很兴奋与你分享它们。它们是：设定明确的目标，对其进行优先排序，在混乱中保持冷静，做出基于事实的直觉决策，并始终努力赢得你的地位。


    ### 设定清晰、有启发性的目标


    没有人能在没有宏伟目标的情况下达到崇高高度。如果你想领导，那么你的目标就必须激励你每天早晨跃出床外，全力以赴。对于一个目标来说，无论是应用于项目和计划、健康和健身、人际关系还是你的职业生涯，要真正可实现，你必须给予它这种程度的热情。


    太多人因为让日常工作的惯性分散了对最大梦想的注意力，而困在低层级职位。没有更大的目标去努力，岁月流逝，你有风险一事无成。如果你不设定目标，那么默认情况下，你的职业目标就仅仅是熬过又一天。不要让这种情况发生在你身上。利用与初创公司合作的机会，设定能激励你的宏大目标。


    我可以百分之百确定，如果我没有先设定目标，然后在自己力不从心时向值得信赖的顾问寻求指导，我就不会取得任何伟大或鼓舞人心的成就。我职业生涯中取得的一切成就都来自于设定清晰、具体的短期和长期目标，并有一个驱动我的整体“为什么”。


    ### 目标设定的三大支柱


    并非每个目标都是一样的。如果你想看到成果，就要掌握制定目标的技巧。我确定每个好目标都建立在三大支柱之上：具体性、相关性和竞争性关注。缺少其中任何一个，你的目标就会崩溃。


    **具体性**意味着在目标的措辞上要精确。“我将比去年卖得更多”不是目标，只是一堆模糊的空话。“我将在接下来的三个月里每月多卖 15%”才是具体的目标。


    **相关性**意味着每个目标都应该难以实现并且直接适用于你的职业和道路。如果你目标定得太低，你的表现就会不佳，永远达不到你的潜力。那么，这里的问题是：你敢于完成什么样的工作会带来最多的快乐和满足感？哪个仅仅是想法的目标如此令人兴奋，以至于它让你热血沸腾？把你的重大成就想象成你保证会成功的情况。我喜欢问团队，如果我们再进一步，成功会是什么样子，我称之为“目标加一”。对你所有的目标都这样做，它们就会变得相关。


    最后，**竞争性关注**意味着你始终努力保持领先优势。关注竞争对手在做什么，并根据他们的行动设定你的目标。


    当然，无论支柱多么坚固，任何目标如果没有基础都会崩溃。那個基础就是为什么，是驱动你的动力。如果你不理解你为之努力的更大目的，你就不会取得任何成就。在设定目标时，给自己留出空间和时间来思考驱动每个目标的为什么。


    ### 小步前进


    一旦你设定了目标，执行它们的最佳方式就是将其分解为小步。我用来将目标分解为步骤的系统始于以下问题的提问：


    - **什么**是你具体想要实现的目标以及途中的里程碑？

    - **谁**参与其中，他们的职责是什么？

    - **哪些**资源将是必需的？

    - **如何**衡量进展以保持正轨？

    - **何时**实现目标？


    例如，假设我为我的营销团队设定目标。对于“什么”，我会设定关于营销需要为收入增长贡献多少的非常具体的营销指标。但更深层次的是，我从跨结构角度来看，并问销售团队需要创造多少收入。我设定非常具体的里程碑，比如我可能会说每个销售人员每月需要进行
    50 或 100 次电话，而营销团队需要在一周内推出新的网络广告。然后我转向“谁”，并首先弄清楚我们可以在内部完成什么，需要外包什么。然后，对于“哪些”，我评估我们需要的资源——诸如材料、金钱和时间之类的东西，但我再次尽可能具体。对于“如何”，我制定人们如何报告结果的计划，并建立会议时间表以让每个人保持更新和了解。最后，对于“何时”，我创建一个主时间表，再次尽可能详细地说明每个个人截止日期和里程碑。正是因为我对目标如此清晰，并在全程保持对每个人的问责制，在
    Thycotic，我们才能够避免任何重大失误。在我任职的每个季度，我们都实现了收入目标，而且很多时候，我们还超额完成了。


    这引出一个重要观点。要成功，你不能只关注你自己的个人目标。即使你只是起步，被视为一个帮助确保项目、团队和工作场所目标清晰且有启发性的人会更好。我曾参加过会议，一位睿智的人举手问道：“我们为什么要做这件事？”因为目的不明确。如果你没有一个分享工作背后鼓舞人心目的的领导者，请主动向他或她询问那个大的“为什么”——即使在会议之外，喝杯咖啡时。这就是有潜力的领导者如何提高每个人的动力，与老板建立有意义的关系，并在初创公司领域脱颖而出，成为潜在的领导人才。


    ### 保持目标在视线内


    我之前提到过的道格·欧文说：“当我与一群人交谈时，我会说，‘这里认为你是一个目标设定者的人，请举手。’每个人都举手。我说，‘保持举着。现在你们中有多少人写下那些目标？’然后一半的手放下了。然后我说，‘你们中有多少人写下那些目标并张贴出来以便看到它们？’然后大多数的手都放下了。”欧文说，那些手仍然举着的人就是他想要雇用的人，因为他们是那些不断专注于他们应该关注的事情的人。“你必须对你的目标极其激光般地专注。我不只是说把它们放在你的
    iPad 或手机上。你需要把它们贴在你面前。”


    换句话说，它们需要可见。当我在欧文手下的 PentaSafe 工作时，他创造了我见过的最有力的视觉目标。就在 2000 年之前，初创公司正在为大年做计划，我们需要招聘大约
    15 名销售人员，以便他们在 1 月准备就绪。欧文召集了一次公司会议，在指定时间，我们大约 50 人走出到我们建筑物前院。欧文坐在我们面前台阶上，他叫上销售员埃里克坐在前面的凳子上。欧文宣布埃里克刚刚完成了我们公司第一个百万美元订单，埃里克的佣金是
    28 万美元。


    正好在此时，一辆 Brink’s 卡车开过来，两名武装警卫下车，把 28 万美元的十元和二十元钞票倒在埃里克头上。欧文说：“这就是 28 万美元的样子。”然后他告诉大家，他将支付给每个人的所有奖金加起来也将达到另外
    28 万美元。每个人都在拍照、录像并在线发布。警卫把钱放回卡车，我们都回到室内，而脑海中满是钱堆的景象。得益于员工在线发布，我们在接下来的两天内收到了超过
    100 份销售人员的简历。吸引优质申请者是欧文创造这个难忘视觉的目的之一，但我保证那天销售团队的每个人都对下一个销售目标有了清晰的画面，并对等待他们的奖励有了强烈的感受。把你的目标放在你面前，并在可能的情况下，为它们附上具体的图像，这样你就能看到自己正在走向什么。


    ### 关于目标的最后思考


    当你第一次为自己设定宏大目标时，你可能会感到某种焦虑或恐惧。这是自然的——你可能会怀疑自己实现所设目标的能力。重要的是要记住，设定宏大、有启发性目标的一些最佳好处并不仅仅在于实现。有时我们没有达到



  mdcn: "\n\n## 第二部分\n### 通往高管层的七个关键\n\n虽然从基层做起是一个很好的开始，但决定你攀升速度和高度的是你的表现。我精心甄选了35项领导特质，帮助你获得录用、迅速登顶并保持地位，我将在接下来的章节中与你逐一分享。\n\
    \n## 第三章\n### 培养你的领导技能和自信心\n\n> 才华横溢的思考实属罕见，但勇气甚至比天才更为稀缺。  \n> ——彼得·蒂尔，企业家，PayPal联合创始人\n\
    \n在初创公司这样的小环境中，高层会看到你所做的一切，而没有什么比领导技能和自信心更能让你迅速脱颖而出。在初创公司工作，你通常比在大公司更早有机会进入领导岗位，你需要作为领导者感到自如和自信，才能积极把握这些机会。缺乏这两种特质，你无法出类拔萃。我曾与技能超群但缺乏自信心去实施想法的员工共事，也曾与那些信心满满却言行不一的人共事。他们都没有登上各自领域的巅峰。在本章中，我将分享如何在自身体内培养这两种特质。\n\
    \n我相信它们已经发生。我曾想象自己进入高管层，想象自己在董事会上用出色的想法和惊人的成果征服众人，想象自己所在的初创公司被收购后我赚得七位数收入。而这一切，我都已实现。\n\
    \n早晨进行这种练习，能让我为接下来的一天定下基调。我知道自己正朝着什么方向前进，这让我不断自问：我能做些什么，朝着实现梦想结果的方向迈出一步？根据我的经验，当我问自己这些问题时，总能找到答案，成功也随之而来。\n\
    \n如果没有这种愿景想象，我迄今为止的成功是不可能的。\n\n无论你是在电脑上使用数字愿景板、用图钉固定图片的实体愿景板，还是通过想象成功并把想法写下来——关键在于拥有愿景。你要被未来的成功深深吸引，以至于整天都能听到海浪轻拍游艇侧舷的声音、感受到面前观众的能量、品尝到意大利红色夕阳下生活的甜美。关键在于：对自己的目标绝对清晰明确，把它们放在眼前，并不断追问自己将如何实现。这是通往成功的第一步，也是培养自己成为领导者、增强自信心的第一步。领导者需要一个愿景来凝聚追随者。\n\
    \n此外，当你对成功抱有坚定的愿景时，你的人生观也会更加积极。这样一来，即使遭遇挫折，你也能保持不退缩，重新聚焦于自己的愿景。\n\n你会经历挫折。伟大的成功是一段旅程，从来不会一帆风顺。如果你只顾低头看路，就不知道自己要往哪里去，最终也到不了任何令人兴奋的地方。只有放眼远方并不断前进，才能抵达伟大的境地，即使一开始它看起来还很遥远。\n\
    \n### 运用“合作竞争”与竞争脱颖而出\n\n我是A型人格，有着强烈的竞争欲望。我确信，这在一定程度上源于我在一个不富裕的家庭中成长为三个男孩中的长子。妈妈会买三四盒麦片回来，可大约两天后就被一扫而空。我和兄弟们都会努力比别人先醒来，跑下楼尽可能多地吞食麦片——如果你不是第一个到那里，几乎就没什么可吃的了。连吃一顿饭都成了一场竞赛。\n\
    \n很多人对竞争持负面看法，但如果没有竞争心，我绝不会取得今天这样的成就。我在每一家初创公司都把全部冷酷的竞争能量投入到带领营销团队上，不断智胜我们最强大的竞争对手。任何优秀的领导者都会有这种竞争驱动力。它具有感染力——当你重视超越其他公司时，这为办公室定下了基调，推动同事齐心协力战胜竞争对手。\n\
    \n你绝不应为胜利感到愧疚。记住，归根结底，你需要赢才能前进。我一直是这样看待的：你的竞争对手正试图从你和家人桌上抢走食物。他们想抢在你之前拿到麦片，所以你需要想尽一切办法击败他们。这并不意味着你应该幸灾乐祸或对竞争对手无礼。事实上，你需要始终谦逊地取胜，尊重竞争对手，因为在初创公司的世界里，局势可能瞬息万变。\n\
    \n强烈的竞争冲动会让你在所任职的公司中脱颖而出，但并不总是出于正确的原因。只要把竞争心指向外部公司，你就是明星。但一旦你与同事竞争，试图贬低他们或让他们显得比你差，你就会被视为混蛋，而不是宝贵资产。\n\
    \n没有人喜欢奖赏混蛋，所以即使你确实在与同事竞争晋升和重大项目，也要优雅地尽力而为。庆祝同事的成功，因为它们是公司的成功，也因此惠及于你。\n\n引导你的竞争能量与同事携手并进，而不是相互对抗。如何做到？专注于更大的问题（即帮助公司成功），而不是纠结于谁会得到高管办公室。这种健康的竞争精神能团结整个办公室和团队。我在PentaSafe工作时，我们不只是派拉横幅的飞机宣传招聘派对。每当季度业绩出色，我们就会租一架挂着“PentaSafe又迎来了一个出色的季度！”横幅的飞机，飞过同一家竞争对手的办公室上空。而我们这些让那个季度业绩出色的团队成员，会一边喝着啤酒，一边看着飞机飞过他们的地盘，共同庆祝。就这样，我们共同的竞争心带来了同袍情谊和巨大成功，因为我们很快占领了市场。\n\
    \n这并不意味着你必须把每个竞争对手都视为敌人。你可以运用“合作竞争”——这个词由作家亚当·布兰登伯格和巴里·纳莱巴夫在他们1996年出版的同名著作中首创——来引导你的成功。合作竞争是指初创公司与竞争对手合作以实现双方共赢。例如，我曾与一家初创公司合作，向一家大型竞争公司提供我们新兴技术的使用权。这种合作竞争帮助我们的初创公司获得收入，而那家成熟公司则无需内部开发，就能为客户提供更好的技术解决方案。双方都大获其利，但这需要一种平衡之举，同时扮演竞争者和合作者的角色。\n\
    \n### 成为专家与终身学习者\n\n要在初创公司环境中晋升，你必须从知识的杯中深饮，而不是只在边缘浅酌。这适用于两类知识：一个主要领域的深度知识，以及涉猎多个领域的广博知识。两者对于实现你的成功愿景都至关重要，而且都是终身的过程。知识不存在足够或过多之说，随着科技行业的变革飞速掠过，你的正规教育变得不那么重要，而掌握行业前沿知识则变得更加关键。\n\
    \n二十多岁时，我在一家初创公司做客户支持。那时还算可以——我的生活比以前更充实，也觉得工作挺有趣，但与此同时我有了两个年幼的孩子，债务也在迅速增加。更糟的是，我对工作并没有真正的热情。\n\
    \n我花时间重新审视自己的“为什么”——本质上就是问自己想要在个人层面实现什么，然后审视自己想在世界上产生怎样的整体影响。这给了我一份目标清单及其背后的理由。没过多久，我意识到自己真正的热情在于市场营销。\n\
    \n随后我迈出了很少有人走的一步，我建议所有读到这本书的人这样做：一旦我明确了自己的“为什么”，我就为职业生涯制定了一份计划。很多人擅长制定商业计划——增长战略、使命宣言、重要里程碑。但几乎没有人会为自己的职业生涯做同样的事。不过，这类计划容易失控——很容易就写出30多页。试着把它精简到一两页你认为最核心的要素，然后把这几页纸折好放进钱包里随身携带，就像我所做的那样，时不时拿出来重新审视并评估自己的进展。\n\
    \n我的个人计划中有一部分是成为市场营销专家。我沉浸在书籍中，研究众多公司的营销运作，把能弄到手的营销计划都做了笔记，还参加研讨会。因此，当我就职的初创公司出现一个初级营销职位时，我已经准备好了。\n\
    \n很快，我的深度学习得到了回报：我的营销知识远远超过了同行。我获得了晋升。这时，我面临一个选择。我可以躺在功劳簿上，认为自己已经学到了足够的营销知识，然后拥有一个平庸至极的职业生涯；或者我可以加大学习投入，在研究中走得更深。我选择了后者，它把我推向了更高的层次。\n\
    \n"

    > —Leonardo da Vinci, Italian Renaissance polymath


    Ockham’s Razor states that, all things being equal, the simplest and most direct
    solution with the fewest number of steps is usually the correct answer to any
    problem. More than 700 years later, Ockham’s maxim is truer today than ever before,
    especially in the start-up world. The person who can take a complex situation
    and simplify it will be the most valuable person in the room—especially at tech
    start-ups, which deal in high-complexity concepts with incredible speed. Time
    and time again, I’ve seen people get bogged down creating complex, intricate plans
    that never come to fruition, and stagnate their careers. While there’s a place
    for complexity and details, more often than not, the best, most elegant solution
    will be the simplest one, and those who can strip away the unnecessary and focus
    on simplicity first—get to the why, the heart of the matter, the essence—reveal
    themselves as clear leaders.


    To be most effective, your commitment to simplicity cannot just be the tip of
    the spear. It has to be encoded into your DNA at every turn. When I worked for
    Quest Software (later acquired by Dell), we used simplicity to differentiate ourselves.
    All of our products were simple, user-friendly, and without a lot of additional
    features. This is great—in the tech world, often bulky software packed with nifty
    but useless bells and whistles goes on to fail.


    However, I noticed that, for some reason, we weren’t always outselling our competitors
    with their bulkier, less elegant software. I realized that while our products
    might be simpler, that was only one aspect of the business partnership. In every
    other area of the business, we had huge amounts of inefficient complexity. If
    we wanted to be the simple solution, we needed to be simpler top to bottom—with
    contracts, pricing, website, customer support, installation—at every level.


    I offered to start a cross-functional simplicity task force, and my CEO not only
    agreed, but attended the meetings. We turned our tools and processes into smooth
    experiences just by simplifying them. We made it easier for customers to try,
    buy, and experience our products. We revamped our customer support portal so they
    could quickly self-serve their product problems. The results were immediate and
    improved the bottom line.


    This process, it should be said, wasn’t easy. Almost everybody in the tech world
    strives for simplicity, but it’s a next-to-impossible goal because complex problems
    rarely have simple solutions. We were only successful because we had a clear understanding
    of the problem we were trying to solve—we didn’t overcomplicate the situation
    and we didn’t hide behind buzzwords. We made sure we knew exactly what we were
    trying to fix, and then did it. That’s my advice for an aspiring leader striving
    for simplicity: define the problem, and then set up a framework and strategy that
    capitalizes on using simplicity as a competitive advantage.


    ## Persist and Be Patient


    > Hold on one second longer than the other guy.

    > —Doug Erwin, chairman and principal, RedHouse Associates


    Persistence is the magic of compounded hustle. Of all the strong start-up leaders
    I’ve worked with, the one unifying trait is persistence. They all see failure
    as a temporary obstacle and a learning opportunity. They don’t let it daunt them;
    instead, they persist and find new solutions.


    Developing this trait will benefit you at every phase of your career. For example,
    as the marketing leader at one start-up, I saw a prime opportunity for co-opetition.
    I realized that we could pair my company’s technology with the tech from a different
    company to provide a unique, improved solution to both customer pools. I suspected
    this collaboration would lead to higher revenues, though I didn’t just go on my
    gut. I validated my premise with analysts and a few of our key customers, and
    I set out to propose my idea to the other company’s executive leader.


    I hit a big, silent, concrete wall. I asked mutual contacts, called his assistant,
    approached him at conferences, left messages, and sent one email a month for six
    months.


    I didn’t want to bug him, but I knew the only way he’d even consider my idea was
    if I was able to connect with him directly. I continued to hold on. My persistence
    and patience paid off. I called him one day at 7 a.m. and, this time, he picked
    up. We both had a laugh, although mine was more of a nervous laugh because I thought
    he’d be upset. I asked for 60 seconds so I could concisely describe my vision.
    Here’s where the hard work of preparation pays off—I’d rehearsed the pitch for
    my idea countless times.


    It worked. He was intrigued and invited me to an hour-long meeting with him in
    his office the following week. At that meeting, I drew on his window a picture
    of our combined solution and how it would give us an “unfair advantage.” (His
    company used windows instead of whiteboards.) I sketched it out for him like that,
    and against the beauty of a blue sky, he saw the elegance of my idea, and we put
    the plan into action.


    Amazingly, this paid off in an even more impressive way than I’d expected. One
    month later, his company bought our start-up for a nice multiple. This successful
    exit would have never happened without my persistence.


    In her article for Inc. magazine, Robin Camarote calls persistence one of the
    three characteristics that define high-impact leaders (the other two are passion
    and kindness). Her reasoning, I think, is revelatory. She writes, “Persistent
    leaders know that nothing works all of the time or, if it does, they’re playing
    it too safe. Persistence is setting goals—big goals—and pursuing them with an
    uncommon drive and focus. Persistence is critical because everyone inevitably
    gets knocked down, shut out, ignored or neglected at some point in their professional
    lives. Persistence . . . enables high-impact leaders to get up again and again.”
    In short, you need persistence, because if you aren’t getting knocked down, you’re
    not trying to go high enough.


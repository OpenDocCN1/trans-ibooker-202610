    # Use “Co-Opetition” and Competition to Stand Out


    I’m a Type A personality with an intense desire to compete. Part of this, I’m
    sure, comes from growing up the eldest of three boys in a family without a lot
    of money. My mom would go and buy three or four boxes of cereal, and just about
    two days later, it’d all be gone. My brothers and I each tried to wake up before
    the others to get downstairs and then scarf down as much cereal as possible—if
    you didn’t get there first, there’d be hardly anything left to eat. Just getting
    a meal became a contest.


    A lot of people view competitiveness negatively, but without it, I never would
    have achieved what I have in my life. I’ve thrown the full weight of my ruthless
    competitive energy into leading marketing teams at any given start-up, consistently
    outsmarting our biggest competitors. Any good leader will have this drive to compete.
    It’s contagious—when you care about outperforming other firms, it sets the tone
    in the office and it pushes your co-workers to work together to outplay the competition.


    You should never be remorseful about winning. Remember, at the end of the day,
    you need to win to get ahead. And the way I’ve always seen it, your competitors
    are trying to take food off your table and your family’s table. They’re trying
    to get to the cereal before you, so you need to try to beat them in every way
    possible. This doesn’t mean you should gloat or be rude to your competitors. In
    fact, you need to always win with humility and treat your competitors with respect,
    because in the start-up world, the tables can turn rapidly.


    A strong competitive impulse will help you stand out in the company you work for,
    but not always for the right reason. As long as you direct your competitiveness
    at external companies, you’ll be a star. But as soon as you compete with co-workers
    and try to undermine them or make them look worse than you, you’ll be viewed as
    an asshole, not an asset.


    Nobody likes to reward an asshole, so even if you do compete with co-workers for
    promotions and major projects, do it with grace and by doing your best. Celebrate
    your co-workers’ successes'
  - '[PAGE 62]


    because they are your company’s successes, and as such, they benefit you.


    Channel your competitive energy to move with your co-workers, not against them.
    How do you do this? By focusing on the larger problem (i.e., helping the company
    succeed), rather than obsessing about who will get the corner office. This healthy
    competitive spirit can unite an office and team. When I worked at PentaSafe, we
    didn’t just fly banner planes to advertise hiring parties. Whenever we had a great
    quarter, we would hire a plane with a banner that said “PentaSafe had another
    great quarter!” and fly it over the same competitor’s offices. And we, the team
    that made that quarter great, would all celebrate with some beers, watching the
    plane fly over their premises. In this way, our shared competitiveness led to
    camaraderie and also great success, as we soon took over the market.


    This doesn’t mean you have to view every competitor as an enemy. You can use “co-opetition,”
    a term coined by authors Adam Brandenburger and Barry Nalebuff in their 1996 book
    of the same name, to channel your success. Co-opetition is when a start-up cooperates
    with a competitor to the benefit of both. For example, I worked with a start-up
    that provided a large, competing company with access to our emerging technology.
    This co-opetition helped our start-up gain revenue, and the established company
    was able to provide better technology solutions to its customers without having
    to develop them internally. Both sides won big, but it required an act of balance
    to work simultaneously as competitors and collaborators.


    # Become an Expert and a Constant Learner


    To move up in a start-up environment, you must drink deeply from the cup of knowledge,
    rather than just sip at the edges. This applies to two types of knowledge: deep
    knowledge in one main area, and broad knowledge in many. Both are critically important
    to achieving your vision of success. And both are lifelong processes. There is
    no such thing as enough or too much knowledge, and as changes'
  - '[PAGE 63]


    in the tech industry whiz by, your formal education becomes less relevant, and
    staying on top of industry knowledge becomes even more crucial.


    In my twenties, I worked in customer support at a start-up. It was okay—I had
    a more engaging life than before and I found my work fairly interesting, but at
    the same time I had two young children and rapidly growing debt. Worse, I didn’t
    feel truly passionate about my job.


    I took the time to reevaluate my “whys”—essentially asking myself what I wanted
    to achieve personally and then examining the impact I wanted to make in the world
    overall. This gave me a list of objectives and the reasoning behind them. Not
    too long into doing this, I realized that my true passion lay in marketing.


    I then took a step few people do, and which I recommend for all who read this:
    once I had my “whys,” I went through and created a plan for my career. A lot of
    people are excellent at mapping out business plans—growth strategies, mission
    statements, major milestones. But almost nobody does the same thing for their
    career. Now, this kind of plan can get out of hand—it’s very easy to end up with
    30 or more pages. Try to knock it down to a page or two of what you view as the
    most essential elements, then keep those pages folded up in your wallet. Carry
    them around with you, as I did, and occasionally pull them out to revisit them
    and evaluate your progress.


    Part of my personal plan included becoming an expert in marketing. I immersed
    myself in books, studying marketing operations from a wide range of companies,
    taking notes on all the marketing plans I could get my hands on, and attending
    seminars. So when an entry-level marketing job opened up at the start-up where
    I worked, I was ready.


    Soon, my deep studies paid off: my marketing knowledge went far beyond my peers’.
    I was promoted. Here, I had a choice. I could rest on my laurels, decide that
    I had learned enough about marketing, and have a perfectly mediocre career, or
    I could intensify my investment in learning and go even deeper in my studies.
    I chose the latter, and it propelled me to even higher levels.'

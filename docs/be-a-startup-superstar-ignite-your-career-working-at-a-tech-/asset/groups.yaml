    这意味着每年有 1 亿家。³ 在 2017 年，仅在美国，创业者就创建了 404,000 家新初创企业。⁴


    初创企业的增长以及向上流动的潜力，在我职业生涯所在的技术领域尤为强劲。我最初在科技初创企业的经历开始于 30 多年前——远早于这次繁荣。如果说有什么不同的话，现在这个领域提供了更赚钱的机会，因为新技术渗透到了我们世界的方方面面——我们如何工作、交流、旅行、用餐、锻炼、购物、管理健康、转移资金、消费娱乐，甚至如何与宠物互动。


    ³ Manoj Madhusudanan, “快速成长的新兴企业是 B2B 销售的绝佳目标,” Ziligence Blog (2018 年 7 月 16
    日), https://ziligence.com/blog/2018/07/16/fast-growing-emerging-firms-are-great-targets-for-b2b-sales/.


    ⁴ 美国小型企业管理署倡导办公室，经济研究办公室年度报告，2017 财年，https://www.sba.gov/sites/default/files/OER_2017_Annual_Report.pdf.


    自然，科技部门已成为美国经济最大的组成部分之一。根据 CompTIA 的《Cyberstates 2019》报告，2018 年，美国有近 503,000 家科技企业在运营，标志着连续第六年增长。5
    在以小型新兴科技企业为动力的推动下，美国科技部门的就业人数在 2018 年达到 1,180 万，自 2010 年以来，每年平均增加 20 万新增就业。⁵ 科技繁荣正在进行中，对于那些愿意迎接挑战的人而言，有巨大的机会获取回报。



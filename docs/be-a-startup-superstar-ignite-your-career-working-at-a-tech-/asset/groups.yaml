    statements applies to your situation, it’s probably time for you to find a new
    start-up:


    - You’re miserable 24/7, and dread going to work.

    - Your job is taking a toll on your health.

    - Your workplace presents moral or ethical differences that you can’t live with.

    - The company has systemic problems, and it’s a sinking ship.

    - It fosters illegal behavior such as sexual harassment.

    - You’ve exhausted all opportunities to grow and advance.


    During my long career, I’ve passed through many toxic situations that I needed
    to escape. For example, I once worked for a company where, at the end of a quarter,
    our numbers weren’t as good as we had hoped. They weren’t bad, but they weren’t
    great, either.


    The chairman blew his top. He was livid, and scheduled a day-long meeting on July
    5, and told every senior leader that we had to give a large presentation about
    where our division stood. My colleague and I spent hours of that holiday weekend
    locked away from our families in a hotel room, working desperately to construct
    this intricate presentation on our marketing department.


    The meeting rolled around. It was a grueling affair, and most of the other divisions
    presented before us. Then, when it was finally our turn, the chairman just said,
    “Oh, you know, we don’t need to hear from marketing.” And he adjourned the meeting.
    That was it—all of that time that we could have spent with our families was wasted.
    I felt disrespected and lied to. I no longer felt that I could trust the chairman.


    Ultimately, I left, mostly because of that instance.


    An important caveat: I didn’t leave right away. I gave myself a few months to
    process what happened, and when I found that I couldn’t move past it, I made the
    decision to leave. If you’re considering leaving a company, I suggest you do the
    same thing. Take the time to think through the decision carefully and thoroughly.
    Often, you will discover that the problem isn’t as dramatic as you originally
    thought.


    James Legg, president and CEO of Thycotic, says, “If you go to work in a particular
    market or for a particular company, and it doesn’t work out, go somewhere else.
    There are so many jobs in technology. The world is changing and tech is growing.
    No matter your religion, have faith that you will find the right fit for you.”³


    ### When to Stay


    The following list includes reasons people decide to leave their jobs, but they’re
    not necessarily the right reasons to jump ship. Usually, these issues can be worked
    out if it’s to your advantage to stay and continue to contribute where you are:


    - You feel unhappy at work. Most people feel unhappy at work from time to time.
    There’s a difference between the ups and downs and being completely at the end
    of your rope. If you have one particularly bad day, don’t make any rash decisions.
    Wait a few months to see if a pattern develops.

    - You think that the grass is greener somewhere else. This one can be particularly
    deadly. If you constantly think about all of the things that you don’t have, you
    might get impatient with your current job and it might make working for a competitor
    seem appealing. Before you decide, take an honest look at your position where
    you are, and talk to people who already work for the company that’s your other
    option. Then, evaluate how green the grass over there really is.

    - You get bored. This might mean that you’ve outgrown the company, but far more
    likely, it means that you haven’t sufficiently explored other roles you can play,
    or a team you can lead, or something new you can learn at the company where you
    work. If you haven’t exhausted your opportunities to grow where you are, there’s
    no point in moving. To move prematurely means your environment will change, but
    you will remain stagnant. Focus on growth.

    - You need to make more money. Money is an important factor, but it doesn’t mean
    you have to leave the company where you’re at to make more. Consider first if
    you are being paid fairly for your position. Look up the going pay rate for your
    job on salary.com to find out. Ask for a raise if it’s justified. And look for
    opportunities to take on more responsibility or bigger projects where you will
    provide greater value and thus be worth a higher salary. Whatever you do, don’t
    decide solely based on the money, as tempting as that may be. At the end of the
    day, extra money is nice, but it’s not the most important thing. Also consider
    the people, the challenges, and where you can make the biggest impact.


    ### Leaving the Right Way


    Whether you focus on putting down roots where you are, or growing shoots in someplace
    new, it won’t be possible to quickly assess any of these aspects, and no matter
    how well you do your diligence, any move will involve some risk. It’s up to you
    (with the help of a wise mentor) to decide which risks have the biggest payout
    potential in knowledge, skills, location, experience, income, and benefits. Sometimes,
    the right decision is to leave a good situation for a great one.


    The hardest career decision I ever made came when I was working at The Planet
    in a job I loved, with a team that was like family, and reporting to my mentor
    Doug Erwin. It was a beautiful workplace life. And then, Quest Software, a billion-dollar
    public company, offered me a higher-level position at more than double the compensation.
    They valued my serial entrepreneurship and wanted a marketing leader with a start-up
    mentality. I struggled mightily with this decision.


    You may think the words “more than double the compensation” would have been enough
    to sway me, but this decision rested on so much more. I had to ask myself whether
    it would be worth it to leave a workplace and team where I was thriving to head
    off into the wild unknown for more pay and a new opportunity. Would I ever have
    such a strong connection with a team again? I made a list of the pros and cons,
    talked with my family, and consulted with Erwin. His response was, “I can’t stand
    in your way.” He then wrote me a heartfelt personal letter that helped me to make
    a balanced decision.


    After a final gut check, I accepted the offer and left The Planet. What ultimately
    swayed me wasn’t the money—I thought that I would have an opportunity to grow,
    test myself, develop new skills, and make a large impact with Quest. In the end,
    my gut was right. I went on to build valuable new skills and relationships. To
    really sweeten the deal, The Planet sold a year later, which confirmed my decision
    and netted me some nice residuals. I didn’t have to worry about breaking up with
    my workplace family forever, as I’ve remained friends with many of them to this
    day.


    A lot of times, moving on to work for a new company can be an excellent choice,
    but as with everything else, you need to leave the right way. If you decide to
    move on, define your ideal job and manager, create a plan, and set your goals.
    Never burn a bridge behind you. No matter what, follow the golden rule to “do
    unto others as you would have them do unto you,” which means giving adequate notice,
    assisting with the transition, training your successor, helping your soon-to-be-former
    teammates succeed, and keeping all communications professional and positive.


    ### Trust Your Unique Path


    If, after reading all of this, you still feel intimidated by the gravity of this
    decision, that’s okay. There’s something that you can keep in mind that hopefully
    takes a little of the pressure off: there is no singular, clear path to success.
    You will likely, especially in the start-up world, especially when you’re young,
    bounce around from company to company for a while. It might seem like you’re having
    false starts


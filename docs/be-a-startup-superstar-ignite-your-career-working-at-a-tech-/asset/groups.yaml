    with an entrepreneurial mind-set. Sometimes start-ups fill senior leadership positions
    with people who have been successful in a larger corporation, but they soon find
    that they aren’t equipped to handle the environment of a start-up. To figure out
    during the interview process if you’ll be joining a place with entrepreneurially
    minded leaders, ask about the company’s culture and the types of talent they hire.
    It never hurts to ask to interview with a broad base of people to get a better
    feel for the company’s culture.


    When you’re in an interview, ask questions like, “Hypothetically, it’s six months
    into my employment, and people are raving about my results. What have I accomplished?”
    Not only will this give you a good sense of their expectations and if you’re a
    good fit, but it will also tell you if this is the kind of environment that will
    push you to grow.


    Once you’ve picked the right place, be sure you pick the right people. Look for
    the relentlessness, the positive attitudes, the inquisitiveness, and the ones
    with big dreams who can bring out the best in you and inspire you to grow. Here,
    it’s important to talk about what exactly a high-achiever is. The best rule of
    thumb is to look for somebody who, as a total package, is the type of person you
    want to model yourself after. Consider who they are and their achievements professionally,
    personally, and to a lesser extent, financially.


    Observe what kind of a worker they are, how creatively they think, how driven
    they are. How do they handle themselves under stress? When they walk into a room,
    how do they carry themselves?


    Don’t be overly focused on the career aspect. Make sure you surround yourself
    with people who have the same values as you. Are they a good person? Are they
    kind and generous? Are they willing to share what they know with those who are
    younger or less experienced? Do they have a family that they respect and love?


    Don’t get blinded by an impressive title or a huge amount of wealth. While these
    can be indicators of high achievement, they don''t necessarily mean that whoever
    has them performs at a high level across the board or would be someone you''d
    want to emulate. Once you identify a great role model, network with them, either
    (or both) in-person or online.


    Don''t be shy about approaching these top performers. When I first started out,
    I got an assignment that required me to report directly to the CEO. The CEO was
    a bit of a bully—he liked to steamroll people and make them feel intimidated.
    At first, I was excited, but also a little bit nervous. It didn''t take long before
    I got through the CEO''s intimidating demeanor. Once I did, I realized that communicating
    with him accelerated my learning.


    This allowed me to discover two things: (1) that I should be doing this sort of
    thing all the time, and (2) that nerves are a good thing. I felt nervous because
    I wasn''t sure how to handle the situation—that meant I was in a position to grow.
    Even now, if I get too comfortable in a situation, I get worried. I try to always
    put myself in a position that inspires a little fear. The key is to not let that
    nervousness overcome you—I''ve learned how to channel it into an ability to work
    harder, get up a little earlier, and be more focused on my work.



    ## Chapter 9: Take Care of What Matters


    > I am not the product of my circumstances. I am the product of my decisions.

    >

    > —Stephen Covey, author and speaker


    Young, eager professionals can be like high mass stars: they burn fast, bright,
    hot, and out. At tech start-ups, the pace of the work and the grueling hours can
    grind people down. That is why one of the most important things you can do to
    guarantee your success in the start-up world is to take care of yourself. You
    will never reach the C-suite if you can’t handle working in the start-up world
    for years on end, and you can’t do that if your mental and physical health aren’t
    in top shape. In this chapter, I share how you can protect the calendar from needless
    time sucks and use that newfound time to put yourself and your family first, manage
    your health, and live without regrets.


    ### Protect Your Calendar


    Time is the only truly finite resource—once you lose it, you can’t get it back.
    That means that you must exercise extreme care in how you manage your time. If
    you don''t protect your calendar, people will abuse it. Consider the following
    calendars: one is blocked out wall to wall with meetings and events, while the
    other features vast swaths of blank space. Which calendar do you think belongs
    to the more successful person? The one with all those meetings, right?


    Wrong. The calendar stuffed with meetings belongs to an eager, excited young professional
    that I know. The nearly empty calendar belongs to none other than Warren Buffett,
    arguably the most successful investor ever. If a man with thousands of people
    hunting for a slice of his time can protect his calendar, so can you. According
    to Bill Gates, this was one of the most important lessons he learned from Buffett
    when the two first met back in 1991, just as Gates was starting his career. Before
    meeting Buffett, Gates said, “I had every minute packed, and I thought that was
    the only way you could do things.” But Buffett taught him “the importance of giving
    yourself time to think.”¹ To make massive leaps in business, to really stand out,
    you need to come up with excellent, fresh, innovative ideas. You can’t have ideas
    like that if you’re constantly in meetings, on calls, or answering emails. Sometimes,
    you just need to block out time to reflect on the problem at hand and think through
    potential solutions, and to set aside time to work on the major tasks that can
    lead to large-scale impacts. On top of that, setting aside deliberate thinking
    time enables you to get clear on your goals and consider the paths to lead you
    to them.


    For this and other reasons, it is vital that you aggressively guard your time
    so that you can give the most focus to the things that truly matter. While this
    may seem obvious, it can be difficult because there are two major traps that I’ve
    seen countless professionals succumb to. The reason they are traps is that they
    can masquerade as effective uses of time, but they often are not: meetings, and
    should-dos, instead of must-dos.


    ### Meetings


    According to the Harvard Business Review, “Meetings are the scourge of modern
    business life, consuming sixty-two hours per month of employees’ time, on average
    (a full half of which is estimated to be wasted).”² So the question then becomes:
    if meetings are so reviled, why are they so ubiquitous? Sometimes managers overload
    the schedule with meetings to cover up for poor management strategies. For example,
    when a large company acquired a start-up I worked for, the new head of marketing
    sent out invites for daily stand-up status meetings. These were painful and a
    waste of precious time. It gave the impression that she lacked a more efficient
    way to receive process updates, and at times, it felt as if she was subconsciously
    trying to slow progress.


    If you end up stuck beneath a manager like this, you have the opportunity to be
    proactive and stop the time-wasting. In this case, our team got together and approached
    her with a more productive way of getting her the information she needed. She
    listened and changed her approach, and I recommend you do something similar.


    Another cause of too many meetings is that some employees and managers, particularly
    younger ones, make the mistake of associating more meetings with greater importance.
    I’ve seen the calendars of young employees who think if they accept every invite,
    meeting, and optional event that comes their way, it will make them appear more
    integral to the company’s operations. Unintentionally, this allows other people’s
    wasted time to become their wasted time. Then, when they get the chance to lead
    projects, they go ahead and fling multiple meeting invites into the masses, and
    then wonder why only a few co-workers attend. This kind of behavior only leads
    to one thing: burnout—for the young employee and all those people who come to
    the meetings they schedule.


    The truth is that you can and should be picky about what meetings you attend.
    Let go of the mind-set that you have to accept all meeting invites from higher-ups.
    Perhaps attend the first few on the schedule to measure the meeting’s value to
    you. You can then adjust your schedule as needed.


    Here are two strategies I recommend to reduce the number of time-wasting, energy-depleting
    meetings you attend: (1) ask your boss for help in establishing meeting priorities
    and which ones you have the “air cover” to say no to. (2) When you’re invited
    to a meeting, ask, “Why specifically do you need me to be there?”


    You may fear this will sound rude, but it’s just a question. There may be a good
    reason for your presence, but many times you’ll find that it’s not necessary for
    you to sit through the whole agenda. Often it makes more sense for you to get
    a status update with the results, or pop in for the part that is relevant to you.
    Learn to sort meeting invites into two piles: a “must be there” pile, which you
    attend no matter what, and the “nice to be there” pile, which you don’t.


    You may think that declining meeting invitations will make you less popular or
    make people in the office angry, but that won’t happen as long as you respectfully
    decline. Whenever you decide not to attend a meeting, send a quick, polite note
    to explain why. Don’t be curt—it will piss people off. Of course, this, like anything
    else in business, is a skill. You may have a hard time saying no. I did, too,
    at first, but it gets easier with practice.


    Unnecessary meetings aren’t the only ones that can waste your time—sometimes,
    important meetings suffer from poor organization and result in meeting sprawl.
    For example, many ad-hoc meetings start as 15-minute around-the-horns to quickly
    share information and create actions, but they turn into 52-minute drone-ons with
    each person trying to make their tasks sound beefy and impressive, while everyone
    else is thinking about what they’re going to say next, or wishing they were elsewhere.
    When this occurs, the meetings become more about posturing than getting anything
    done.


    You can remedy this whether you’re the leader or a participant by pressing for
    a purpose and an agenda. Start on time or request that the leader gets started
    at the appointed time. Ensure meetings end with a summary of what was covered
    and a set of action items with accountability.


    Another piece of meeting advice: mix it up. Cookie-cutter agendas and locations
    are boring. To add interest, you can choose to deep-dive on topics, invite others
    to present, change the location, and, whenever possible, keep them short. If you
    look around the room during a meeting and people’s faces look like death has descended
    upon the corner conference room, then you know the meeting has gone on too long,
    become too boring, or gone too far outside the range of value for participants—or
    all three.


    ### The Should-Dos Trap


    If you follow the advice in this book, you will probably start to set weekly goals
    for yourself and make to-do lists of the things that you need to accomplish. Then,
    when you accomplish them, you’ll cross them off the list and you’ll feel a rush
    (if you haven’t already) of joy and satisfaction to see that crossed-off item.
    You’ve accomplished something, and here it is: proof in the form of a neat black
    line through a bullet point.


    This habit will serve you well in the start-up world, yet it’s easy to get carried
    away with the rush of crossing things off. I’ve seen this happen to many motivated
    young professionals—they get so addicted to the feeling of knocking a to-do off
    their list that they keep adding more and more tasks to it—mostly menial ones.


    They do all of this stuff and feel like they’ve accomplished so much because they’re
    crossing things off the list. What they don’t realize is that success comes from
    deliberate, concentrated action, not just any action. When you add a large number
    of superfluous tasks to your calendar because they are easy to check off, it takes
    away time that you could be spending on your most important goals.


    To avoid this trap, strive to be sure that your calendar and your top priorities
    are in complete alignment. If you take on too many minor things, you’ll end up
    busy as hell without going anywhere.


    In order to achieve this ideal, do two things: (1) proactively put the high-priority
    items on your to-do list first and (2) have an honest conversation with yourself
    about how each task you give yourself



    # Chapter 3

    Develop Your Leadership Skills and Self-Confidence


    > Brilliant thinking is rare, but courage is in even shorter supply than genius.

    > —Peter Thiel, entrepreneur and co-founder of PayPal


    In the small environment of a start-up, the higher-ups see everything you do,
    and nothing will make you stand out faster than leadership skills and self-confidence.
    Often, working for a start-up, you''ll have a chance to step into a leadership
    position much earlier than you would at a large company, and you need to be comfortable
    and confident as a leader to eagerly take advantage of those opportunities. You
    cannot excel without both of these traits. I''ve worked with tremendously skilled
    employees who lacked the self-confidence to implement their ideas. I''ve also
    worked with those who were full of confidence, but couldn''t walk the talk. Neither
    made it to the top of their fields. In this chapter, I share how to develop each
    one within yourself.'

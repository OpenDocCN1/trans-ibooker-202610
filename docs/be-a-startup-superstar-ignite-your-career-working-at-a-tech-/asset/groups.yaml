  mdcn: "\n## 前言\n\n### 你还在等什么？是时候改变世界了！\n\n我一直热切期盼着在华尔街一家规模宏大、声名显赫的投资银行工作的第一天。我算是出人头地了！靠着家族关系，我大学毕业后的第一份工作就获得了一个入门级职位。当然，我是从底层做起，但我相信自己有能力脱颖而出，在职场阶梯上步步高升。那天早上，向我的新经理——一位老练的华尔街老手——自我介绍时，我兴奋不已。\n\
    \n然而，就在见面时，经理用了一个简单的动作，似乎很享受地摧毁了我的热情。他的这个强势举动让我从第一天那种充满期待、眼神发亮、对光明职业前景充满幻想的早晨，一下子跌落到对未来四十年枯燥乏味的想象中。这个多年来一定见过无数像我这样热切、刚毕业的年轻人的家伙，难道对每个人都是这样吗？\n\
    \n在我被介绍给新同事之前，在我知道我的初始工作内容之前，哎呀，在我甚至被告知该去哪儿上厕所之前，我就先被教导如何使用打卡钟。打卡钟！就像你在电影里看到他们描绘旧时代工厂的那种。经理在我职业生涯第一天的头10分钟内，就得意地给了我一张印有我名字的专属考勤卡。他告诉我，早上到达时要打卡，午餐离开时要打卡，午餐回来时要打卡，晚上下班时还要打卡。\n\
    \n打卡钟？真的假的？他们难道不信任我吗？天哪，我心想，我这是把自己弄进了什么境地？那一刻，我知道我必须计划如何摆脱财富500强公司的工作世界。\n\n没过多久，我成为了一家经济咨询公司的第六名员工。那次职业转变真是太棒了。在那种环境中，我能够根据自己的技能和兴趣与公司目标契合度，开辟出自己的道路。\n\
    \n26岁时，我搬到东京，筹备该公司的日本办事处。我从在大公司里实实在在地打卡，变成了自己初创公司在总部以外唯一的员工。很快，我就在高层面上开展业务，并有所作为。我简直乐在其中！我距离管理团队6500英里，再加上12小时的时差，这意味着纽约的其他团队成员都在睡觉时，我在工作。这也意味着我拥有完全、彻底的自主权。我再高兴不过了。\n\
    \n我在庞大的财富500强公司里做微不足道的小角色时的枯燥乏味，与我在一家小型创业企业中作为重要一员的新工作相比，真是天壤之别。关于我自己以及生活中重要之事，我学到的这些教训让我至今仍然不断追寻那种创业文化。\n\
    \n现在，我担任一些精选新兴公司的顾问，这些公司正努力通过提供颠覆性的产品和服务来改造自己的行业。我的咨询客户包括HubSpot，我在2007年开始与该公司合作，当时他们只有少数客户和不到10名员工。我帮助HubSpot团队将公司发展到覆盖90个国家、超过60,000名客户，年收入超过5亿美元。我在创业圈的顾问客户还包括Mynd、Expertfile、YayPay、SlapFive和InstaViser。我也是Stage\
    \ 2 Capital的市场推广有限合伙人，这是一家投资初创公司的风险投资公司。\n\n*成为创业超级明星*就是我在大学考虑从事商业职业时希望拥有的书。它深入探讨了创业文化，包含了关于成功、高增长组织内部生活是什么样的精彩故事。我发现自己每读一页都点头认同和欣赏。\n\
    \n这不是一本仅仅研究他人行为的学者写的学术巨著。史蒂夫·卡汉本身就是一位非常成功的企业家。他曾参与过多个成功的创业项目，也曾在大型公司的战壕里摸爬滚打。史蒂夫每页都提供了宝贵的见解。他是你的个人导师，引导你穿越创业世界。\n\
    \n这些页面中读到的故事会告诉你在初创公司如何成功地工作。根据我的经验，在超大型公司和初创公司中处理工作方式存在巨大差异，史蒂夫确切地告诉了你如何应对这些差异。在大公司里，政治规则盛行。取悦老板往往比服务客户更重要。而在创业世界里，情况恰恰相反：成功来自于你为发展业务所做的事，而不是你为迎合高职位的“大人物”的自我所做的事。史蒂夫用现实世界的例子指出这些差异，以便你能巧妙地驾驭自己的职业生涯。\n\
    \n初创公司为聪明、积极主动的人提供了巨大的机遇。而这些创业企业总是在寻找人才，寻找像你这样的人。CEO们总是告诉我，他们工作中最难的部分是找到那些能为公司带来改变的热情人才。\n\
    \n如果你想在一家公司工作，那里的每个人在鸡尾酒会上都能认出你名片上的公司名字，那么这本书不适合你。如果你想让别人告诉你在工作上该做什么，请另寻他处。然而，如果你渴望获得乐趣、有所作为、改变世界，请继续读下去！我们指望你呢。\n\
    \n> —— 大卫·米曼·斯科特，企业家、商业增长策略师，著有11本畅销书，包括*粉丝崇拜*和*营销与公关的新规则*  \n> www.DavidMeermanScott.com\
    \ @DMScott\n\n## 引言\n\n> 生命对我来说不是短暂的蜡烛。它是一支灿烂的火炬，我暂时握住了它，我要让它燃烧得尽可能明亮，然后交给下一代。\n\
    > ——萧伯纳，剧作家\n\n我邀请你想象我们正在共进晚餐。那是一个温暖的夜晚，我们坐在户外的屋顶餐厅，俯瞰着一座明亮的大城市。当太阳沉入柔和的橙色光芒中，建筑的灯光照亮了下方街道逐渐加深的蓝色时，我们谈论你的大学经历。当你告诉我你所获得的认可；你与教授、同学和挑战你思维的朋友之间体验到的深厚情谊时，你脸上容光焕发。你表达出对教育框架结构的渴望，在那里，成功必然降临到努力工作的人身上。\n\
    \n然后，我们的话题转向了你目前的工作状况。\n\n你深吸一口气。在大学期间，你曾想象未来会有那么多的成功和收入，但现在你就在这里，满腹知识，准备好运用它，准备好证明自己——但你被困住了。你被困在一份晋升似乎遥遥无期的工作中，你的生活缺乏你所渴望和期望的丰富多彩。你想想你的同龄人，虽然有一小部分幸运儿似乎已经富有而幸福（至少根据他们的社交媒体发帖来看），但你和其他大多数人仍在勉强维持生计，试图规避那些前述的、你不能再延期偿还的学生贷款所带来的风险。你希望得到一个重大突破或一段好运连连的日子，或者有一位导师关注你，帮助你走出这个你和年轻专业人士都陷入的职业困境。\n\
    \n我就是那位导师，而且我正关心着你。这本书提供了一位导师的内部视角，他曾处于与你们完全相同的情境，并找到了一条前进的道路——不仅是一份好工作，而且是一份伟大的职业和巨大的成功，既有经济上的，也有个人上的。我想帮你发现自己的道路，成为你以前可能忽视或认为风险太大而放弃的世界的勇敢领导者：科技初创世界。\n\
    \n虽然为初创公司工作似乎比为大型公司工作风险更大，但潜在的回报远远超过风险。而且，如果你够聪明，你就能化解风险。我将向你展示机会在哪里，如何利用这些机会，以及如何选择一家最有成功可能的初创公司——无论你的目标是技术还是非技术岗位。\n\
    \n你是否曾感到工作陷入困境？你是否曾想知道自己如何才能达到想象中的成功水平？你并不孤单。2019年，在强劲经济和低失业率的背景下，大学毕业生却很难找到工作。毕业时，75%的人根本没有确定工作。普通大学毕业生平均花了近八个月才找到工作——而这一切的背景是，平均学生贷款债务为41,810美元。再加上同年美国和加拿大只有31%的员工感到工作投入，我相信这意味着我们面临着一场严重的流行病。\n\
    \n这场流行病并不新鲜。它几乎感染了我。\n"

  - '[PAGE 82]


    One great example: I joined Quest Software, a relatively large public technology
    company, to run their marketing. I realized that our cross-selling was abysmal.
    Customers would buy one product, and that’s it. We sold a bunch of different products,
    some of which we had developed natively, but we had acquired several from smaller
    companies, and our customers weren’t getting the benefit of all we had to offer.


    I undertook the first step of any improvement process: asking a question. I asked,
    “Why is the cross-selling of our own products so poor?”


    I did some research. I went down to the sales floor and interviewed our salespeople,
    asking them to give me the elevator pitch for the company. Almost none of them
    could agree on what it was, and I soon realized that we had so many products,
    the salespeople only pushed the ones they knew best. Then I looked at the website.
    We had no system to organize our products by type; we organized them based on
    how recently we’d acquired them. Imagine if instead of grouping products by shopping
    categories (books, food, clothes, etc.), Amazon had all of their items listed
    by how recently they’d acquired them. You’d never buy anything from them!


    Well, that’s more or less where we were, so I asked two more questions: “Why don’t
    we have an elevator pitch?” And “Why do we organize our products in this way?”
    And everyone told me the same thing—that’s what the chairman wanted.


    I went to the chairman and told him everyone had told me that the reason we had
    a muddled elevator pitch and a hodgepodge website was that he had wanted it that
    way, and I asked him why that was. He, of course, was shocked—he’d never said
    he wanted that. In fact, he had wanted the opposite.


    What happened was that everyone in the company had become accustomed to the status
    quo. They were so used to how things were that they’d invented a story about why
    things were like that, which simply wasn’t true.


    After our discussion, the CEO gave me the green light to revamp the elevator pitch
    and the website. A few months later, my team and I rolled out a compelling elevator
    pitch and product'
  - '[PAGE 83]


    reorganization that grouped every product into seven logical and easily distinguishable
    categories. Then, we studied which products would work best together, and designed
    the website to make recommendations to customers based on these compatibilities.


    These changes didn’t come easy. People had become so comfortable in the status
    quo that, at first, we encountered resistance and pushback. A lot of the sales
    team didn’t buy into the new elevator pitch right away, and people from different
    departments fought us over where their products would be grouped. Eventually,
    we got enough support and momentum from the employees and other stakeholders to
    make the change successful.


    This became a complete overhaul of marketing and sales, so we risked losing a
    lot of invested time, money, and training. But it was a calculated risk and it
    paid off with a high potential to increase revenue in the long term.


    Taking any risk, no matter how calculated, can generate fear. As we’ve established,
    even joining a start-up can be a calculated risk. At the same time, people constantly
    tell me that when they’ve taken a calculated risk, they’ve experienced the most
    success and happiness.


    Test it for yourself: write down three of the biggest calculated risks you’ve
    taken in your life. Then, write down the outcome of each and how it changed your
    life. This exercise will build your confidence for your next calculated risk.


    Remember to pick your risks well—there’s no point risking a huge chunk of revenue
    on something that will hardly move the needle. Once you’ve identified your aim,
    be prepared. Do your homework, ask questions, weigh outcomes, consider alternatives,
    and start with baby steps before going all-in. Recruit other like-minded leaders
    to join you in the effort—not for cover, but for assistance. If a calculated risk
    turns out to be a dud, owning up to it and moving on will also help you to stand
    out as leadership material.


    Bottom line: an effective leader takes calculated risks, and if you do the same,
    you will stand out from the herd big time.'
  - "[PAGE 84]\n\n# Find the Courage to Make Tough Decisions\n\n> In any moment of\
    \ decision, the best thing you can do is the right thing, the next best thing\
    \ is the wrong thing, and the worst thing you can do is nothing.\n> \n> —President\
    \ Theodore Roosevelt\n\nIf you can’t make strong decisions along the way to the\
    \ top, you’ll never make it to the top. No matter what your job title is, it’s\
    \ never good to idle in a cloud of indecision. If you want to zoom up the start-up\
    \ ladder, prove from the get-go that you have the guts to confidently assess a\
    \ situation and make an informed decision. You won’t start out making the biggest\
    \ company-wide decisions, of course, but you should still train your decision-making\
    \ muscle on your way.\n\nMost people think that tough decisions are restricted\
    \ to business matters, but this isn’t true. Life is filled with tough decisions—from\
    \ deciding where to focus your expertise, which employer to choose, how to protect\
    \ your work/life balance, when to ask for help, how to spend your company’s money\
    \ on projects within your realm, whom you choose to marry, if you choose to marry,\
    \ whether to have children, etc. Essentially, every aspect of your life, from\
    \ your daily habits to your behavior, is a decision.\n\nThe only difference is\
    \ that as you go higher in a company, the decisions you need to make become more\
    \ complicated. In a 10-year study by Navalent of more than 2,700 leaders, 57%\
    \ of newly appointed executives said that decisions were more complicated and\
    \ difficult to make than they had expected.³\n\nIf you’re unaccustomed to making\
    \ big decisions, you can practice and develop the mental toughness by deciding\
    \ on smaller issues within your realm. When others are riding the fence between\
    \ two tough options, be the one who stands out by advocating for the decision\
    \ that you think is best and presenting evidence for why. This leadership quality\
    \ will be noticed and appreciated. It also can help you get to and stay in the\
    \ C-suite."
  - '[PAGE 85]


    I’ve always loved being the person on a team who’s held accountable for making
    tough decisions. Of course, I don’t make them in a vacuum, but I established myself
    early in my career as one who was willing to “make the call.” I’ve since learned
    to surround myself with others who have the courage to make tough decisions after
    doing their homework on the issues, because having decisive, confident people
    on my team makes my job easier.


    Of course, effective decision-making is a tricky skill to master because the outcomes
    of big decisions rarely exist in black and white. A strong leader recognizes that
    a decision might produce unclear or undesired outcomes, but will decide anyway.
    Build your courage to make tough decisions by focusing on the primary desired
    outcome. Research the facts, involve others in the process, and welcome the discomfort.


    Put the consequences of the decision into perspective. Ask yourself, “What’s the
    worst that can happen?” and “What if I’m wrong?” Likely, you’ll see that the consequences
    are not as dire as you thought. Failure leads to learning, which leads to success.
    When a bold decision produces stellar results, internalize them and use that success
    to boost your courage.


    In the early days of the start-up Thycotic, Becca, a super-talented individual,
    ran marketing. At the time, Thycotic focused the majority of its marketing around
    face-to-face tactics like trade shows, events, and seminars. When I came on board,
    I realized there was no way we could accomplish wild growth through the seminar
    approach. We needed to transition to a high-velocity, digital-centric sales and
    marketing model. I made a case for capturing buyers at the point of need with
    free online tools, free trials, and interesting content they would want to download.


    And this is where Becca’s tough decision-making moment came into being. She was
    running marketing at the time, but the digital-centric approach was not in her
    skill set. She had to make a tough decision. She could: (A) get frustrated and
    leave. (B) Get frustrated and stay, pretending to go along while resisting and
    trying to maintain the old way for as long as possible. Or (C) jump on board,
    commit to the success of the company and her own long-term career growth, and
    embrace a ton of new learning.'

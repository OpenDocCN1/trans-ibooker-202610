    ## Chapter 5 Act Like a Leader


    ### (Even If You Don’t Have the Title Yet)


    > The only way to think like a leader is to first act: to plunge yourself into
    new projects and activities, interact with very different kinds of people, and
    experiment with unfamiliar ways of getting things done.

    > —Herminia Ibarra, professor and author of Act Like a Leader, Think Like a Leader


    Ask a hundred business people what successful leadership looks like, and you’ll
    get a hundred different answers. There might be some overlap, sure, but the truth
    is that leadership is one of the most difficult traits to define. Thousands of
    minds have been exhausted in an attempt to capture exactly what it means to be
    a great leader, and, with so many competing voices offering advice, it’s hard
    to know where to look. In my experience, I’ve found five basic habits and traits
    to be a great starting place in my development as a leader. They have helped me
    quickly go from the ground floor to the C-suite and I am excited to share them
    with you now. They are: set clear goals, prioritize them, remain calm during chaos,
    make fact-informed gut decisions, and always work to earn your stripes.


    ### Set Clear, Inspiring Goals


    No one reaches lofty heights without lofty goals. If you want to lead, then your
    goals need to inspire you to jump out of bed and give everything your best each
    morning. For a goal to be truly attainable, whether it be applied to projects
    and initiatives, health and fitness, relationships, or your career, you must give
    it this level of enthusiasm.


    Far too often, people get stuck in low-level positions because they let the inertia
    of a daily workload distract them from their biggest dreams. Without a larger
    goal to work toward, years slip by, and you run the risk of going nowhere. If
    you don’t set the goal, then by default, your career goal will become merely to
    get through another day. Don’t let this happen to you. Use the opportunity of
    working with a start-up to set big goals that inspire you.


    With 100% certainty, I would not have achieved anything big or inspiring without
    first setting the goal and then asking trusted advisors for guidance when I found
    myself beyond my depth. Everything I have achieved in my career has come from
    setting clear, specific short- and long-term goals, with an overarching “why”
    that drives me.


    ### Three Pillars of Goal-Setting


    Not every goal is created equal. If you want to see results, master the skill
    of crafting goals. I’ve determined that every good goal rests upon three pillars:
    specificity, relevance, and competitive attention. Leave out any one of these,
    and your goal will crumble.


    **Specificity** means to be precise in the wording of your goals. “I will sell
    more than I did last year” is not a goal, it is just a lame collection of vague
    words. “I will sell 15% more each month for the next three months” is a specific
    goal.


    **Relevance** means that each goal should be difficult to achieve and directly
    applicable to your career and path. If you undershoot, you’ll underperform and
    never reach your potential. So, here’s the question: what would you dare to accomplish
    that would provide the most joy and satisfaction? Which mere idea of a goal is
    so exciting that it gets your blood moving? Think about your big achievements
    as if you were guaranteed to succeed. I like to ask a team what success looks
    like if we go a step further, and I call it “Goals Plus One.” Do the same for
    all of your goals, and they will be relevant.


    Finally, **Competitive Attention** means you always aim to maintain an edge. Pay
    attention to what the competition is doing, and set your goals in relation to
    their actions.


    Of course, any goal, no matter how strong the pillars are, will crumble without
    a foundation. That foundation is the why, the motivation that drives you. If you
    don’t understand the larger purpose you’re working for, you won’t achieve anything.
    As you set your goals, give yourself the space and time to think about the why
    that motivates each goal.


    ### The Baby Steps


    Once you’ve set your goals, the best way to execute on them is to break them down
    into baby steps. The system I use to break down my goals into steps begins by
    asking the following questions:


    - **What** specifically do you want to achieve and what are the milestones along
    the way?

    - **Who** is involved and what are their responsibilities?

    - **Which** resources will be required?

    - **How** will you measure progress to stay on track?

    - **When** will you achieve the goal?


    For example, let’s say that I’m setting goals for my marketing team. For the what,
    I’ll set very specific marketing metrics about the amount that marketing needs
    to contribute to revenue growth. But deeper than that, I look at it cross-structurally
    and ask how much revenue the sales team needs to create. I set very specific milestones,
    like I might say that each sales member needs to have 50 or 100 calls in a month,
    and that the marketing team needs to deliver new internet ads in a week. I then
    move on to the who, and figure out first what we can do in-house and what we need
    to contract out. Then, for the which, I assess which resources we need—things
    like materials, money, and time, but again, I get as specific as possible. For
    the how, I develop a plan for how people report on their results, and establish
    a schedule of meetings to keep everyone updated and in the loop. And finally,
    for the when, I create a master timetable that, again, gets as detailed as possible
    about each individual deadline and milestone. The fact that I’m so clear about
    the goals and consistent in holding everyone accountable is how, at Thycotic,
    we’ve been able to avoid any major hiccups. For every single quarter I’ve been
    there, we’ve hit our revenue goals, and many times, we’ve exceeded them.


    This brings up an important point. To succeed, you can’t just focus on your own
    personal goals. Even when you’re just starting out, it’s better to be seen as
    a person who helps to ensure that the project, team, and workplace goals are clear
    and inspiring. I’ve been in meetings where a wise person raises a hand and asks,
    “And why are we doing this?” because it wasn’t clear. If you don’t have a leader

    bank are the ones doing all the talking in a meeting. But it’s the opposite: they
    ask thoughtful questions and listen for responses. They realize that the right
    questions inspire reflection, and that reflection inspires action. If you want
    to move up to the C-suite, cultivate this skill.


    I learned this lesson early. At one of my first start-up positions, I earned a
    reputation as someone who delivered, so the leadership asked me to take on a new
    function, well outside of my previous experience. I wanted desperately to impress
    my new manager, so at each meeting with him, I barfed-up a nonstop barrage of
    plans and solutions. He just listened quietly, and I left each meeting congratulating
    myself on how smart and clever I was.


    Even though my team got impressive results, my relationship with my manager soured.
    I couldn’t understand why. Then one day, a mentor of mine asked how I was doing.
    I told him I was down because my manager and I weren’t working together well,
    and I couldn’t figure out why. What else would this mentor do, but ask a bunch
    of questions? After listening to my responses, he said, “Ask your manager more
    of the right questions instead of telling him all the answers.”


    In those days, I carried a notebook wherever I went. My mentor gestured to it
    and told me to write a small question mark at the top of every page to remind
    myself what to do.


    I took his advice. It worked like magic. Turns out my manager had wanted me to
    ask for his priorities and feedback so he could collaborate with my team and me.
    Our relationship improved, and so did our team’s results.


    I see the same tendency to try to act like an expert all the time in young, confident
    professionals. It never works—it’s the rough equivalent of getting “INEXPERIENCED”
    tattooed on your forehead. If you want to impress, especially when you’re young,
    focus more on asking smart questions than on telling people what you know. It
    will show you have the maturity to realize how much you don’t know, and are eager
    to deepen your knowledge. This will make your supervisors and peers trust you
    and want to give you more challenging projects and responsibility.'
  - '[PAGE 79]


    It takes effort to overcome the urge to have all the answers or to “be right,”
    but it’s essential for success, especially in the start-up world. In *The Book
    of Beautiful Questions*, published in 2018, innovation expert Warren Berger quotes
    the venture capitalist Christopher Schroeder, who says, “he uses the following
    question to remind himself to keep an open mind: *Would I rather be right . .
    . or would I rather understand?* If you’re adamant about being right,” Schroeder
    says, “you lock yourself in your own echo chamber—and that can cause you to make
    bad decisions.”¹


    In a large company with established processes, it’s easy for an employee to do
    only what they’re told, without asking questions. But in a start-up environment,
    where the company’s processes are being developed, it’s critical to ask intelligent
    and useful questions to comprehend the big picture and find additional creative
    solutions. Not only will it make you stand out as thoughtful, but it will also
    make you better at your job.


    The same concept applies when talking to customers. I’ve received hundreds of
    sales calls during my career. Most of the salespeople can express their value
    proposition, but only a handful ask me questions.


    Those salespeople who don’t ask questions forget the most important aspect of
    sales: listening. How can they pitch a product to me if they don’t even know what
    problems I’m currently dealing with? Maybe I have a problem that I don’t even
    realize I have yet. Sure, they can tell me they see a problem, but I’m far more
    likely to believe it if I say it myself. The salespeople who ask the most intelligent
    questions that make me realize the gaps in my solutions are almost always the
    ones I end up buying from.


    The big takeaway from this isn’t just to ask more questions. It’s to ask more
    thoughtful, higher-quality questions. There’s nothing more annoying than someone
    who asks questions just to ask them, or who asks questions about something that’s
    already been covered.


    If you want to learn how to ask good questions, there’s no better teacher than
    Socrates. According to his method, you start with


    > ¹ Warren Berger, *The Book of Beautiful Questions* (London: Bloomsbury Publishing,
    2018).'
  - '[PAGE 80]


    an open-ended, challenging question. Then, follow it up by asking “Why?” After
    much discussion, you might land on some sort of an answer. Then, you ask more
    questions about that answer, examining the solution you came up with.


    Of course, unlike in philosophy, in business, you must act, so at a certain point
    you need to pause the process of reevaluation to implement a solution. After that,
    however, you still should continue to ask questions regarding your solution, and
    refine your thinking.


    While this might seem intellectualized and esoteric, it applies to business as
    well. For example, instead of asking, “Are our customers satisfied?” ask questions
    like, “How can we help our customers experience greater satisfaction?” “What is
    the purpose of this function?” and “How can we better support customer success?”
    From there, it’s a matter of finding the best answer and coming up with a set
    of actionable items. Then, carry out those actions but don’t let the process stop
    there. Once you have results, continue to interrogate what happened, asking questions
    like, “Why did that occur?” With those sorts of questions, you can refine the
    steps you took even further.


    There is, however, one question that is more important than any other in any decision-making
    scenario, personal or professional. Asking this question can lead to a deeper
    understanding, better decisions, and more brilliant outcomes. Those who ask this
    question are seen as more strategic and forward-thinking, and those are traits
    that zoom leaders to the top. The question: What’s next?


    Simple, isn’t it? Try it and see the results for yourself.


    # Take Calculated Risks and Challenge the Status Quo


    When you think of Babe Ruth, what comes to mind? Home runs? In 1927, Babe Ruth
    hit his 60th home run of the season and set a home run record that would stand
    for 34 years.² But the Babe wasn’t just the Sultan of Swat, he was also the King
    of Strikeouts.'
  - '[PAGE 81]


    His risky all-or-nothing batting style sent him on a record number of triumphant
    trips around the bases, and a record number of walks straight back to the dugout.


    The lesson: you won’t hit a home run if you don’t take a chance and swing. Don’t
    get confused. I’m not advocating for swinging hard at every opportunity. I’m advocating
    taking big swings at ripe pitches, in game-changing moments, after you have prepared
    and practiced.


    I’ve developed a reputation as a risk-taker, but I don’t see myself that way.
    I see myself as a calculated risk-taker, and there’s a big, subtle difference.
    A risk denotes unnecessary action that’s often impulsive and driven by emotion.
    A calculated risk means taking a chance after you’ve done your homework and prepared
    a Plan B (and Plan C, if necessary). If you never take a risk, you won’t go anywhere,
    but if you take lots of big risks, you’ll likely falter. To create an impact,
    you must be willing to take calculated risks.


    Even with calculated risks, you’ll still lose occasionally. I did—while nearly
    all of my bold moves paid off, a few fizzled. For instance, I once sunk a huge
    amount of time and money into a new marketing campaign. The campaign’s theme was
    bold and different, and our team expected that this difference would lead to greater
    success. It flopped miserably. Though I dreaded telling the CEO, I took full responsibility
    and provided solutions to move forward. This strikeout hurt, but it also fortified
    my character, resilience, and knowledge so I could hit a home run the next time.
    Which I did.


    Even though I failed on that attempt, I didn’t stop taking risks. If you’re bent
    on maintaining the status quo, you won’t last long at a start-up. To ignite your
    career, you’ve got to be willing to shine a light on the important things that
    must change, and to lead the effort. This doesn’t mean challenging everything
    so you’re perceived as an anti-establishment contrarian. It’s more about challenging
    the old ways and creating new, better ways where it counts. Focus on taking calculated
    risks and innovating in areas where your special brand of thinking can make the
    biggest impact, such as increasing revenue, lowering costs, and improving customers’
    lives.'

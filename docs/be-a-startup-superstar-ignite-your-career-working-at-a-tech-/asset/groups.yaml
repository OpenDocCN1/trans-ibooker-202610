    team that will find inexpensive ways for the employees to have fun together. This
    will show initiative and enhance your popularity around the office, two items
    that will help you stand out. Finally, always remember that creating fun and joy
    at your workplace starts with you. Enter each day with the mind-set that you will
    enjoy your time at work. It works for me. Each morning, often while I’m still
    in bed and about to jump into my day, I ask myself, “How will I have fun at work
    today?” I suggest you do the same. You’ll start to love your job, work harder,
    and produce better results, all while having a great time along the way.'

    he confirmed that it would require jumping in slow motion through layers of hoops.


    Prior to that call, I had nearly accepted the offer. But, hearing about all the
    big corporate red tape I’d have to wade through, I realized that taking that job
    would make me miserable. I couldn’t get myself to leave the high-flying start-up
    atmosphere where I had the freedom to move the needle in quantum leaps, not increments.


    It’s a big decision to choose to share your talents with a start-up versus a large
    corporate incumbent. Both options include benefits and risks. But if you have
    an entrepreneurial mind-set, you will discover, like I did, that start-ups can
    offer huge benefits. Here are what I see as the top six.


    # Fewer Barriers to Entry


    While big corporations often choose to hire the candidates who went to Ivy League
    schools, are well-connected, or have loads of experience at higher-level positions,
    start-ups are interested in something else. They choose to hire people who think
    creatively, show a willingness to work hard, and demonstrate raw leadership qualities
    that, once cultivated, can help the company (and the individual) achieve breakthrough
    success. Remember, this is the ground floor—every early hire plays a vital part
    in the company’s construction and development.'

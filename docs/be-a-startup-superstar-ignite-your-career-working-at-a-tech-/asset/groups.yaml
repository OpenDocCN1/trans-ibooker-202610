    # Foreword


    # What Are You Waiting For?

    It’s Time to Change

    the World!


    I had been eagerly awaiting my first day at an enormous and very famous Wall Street
    investment bank. I had hit the big time! Through a family connection, I had landed
    an entry-level position as my first job after college. Sure, I would be starting
    at the ground floor, but I was confident that I had the chops to succeed and move
    my way up the corporate ladder. I was super excited that morning as I introduced
    myself to my new manager, a grizzled Wall Street veteran.


    However, with one simple action upon meeting me, the manager seemed to delight
    in crushing my enthusiasm. With his power move, my morning went from the wide-eyed,
    first-day excitement and dreams of a promising career, to imagining mind-numbing'
  - '[PAGE 13]


    drudgery for the next four decades. Did this guy, who must have seen hundreds
    of eager, fresh graduates just like me over the years, do this to everyone?


    Before I was introduced to my new colleagues, before I knew what my initial role
    would be, heck, before I was even told where to pee, I was shown how to use the
    time clock. A time clock! Like you see in movies when they depict old-time factories.
    The manager smirked as he gave me my very own punch card with my name on it within
    10 minutes of the first day of my career. I was told I had to punch in when I
    arrived in the morning, again when I went to lunch, when I returned from lunch,
    and finally when I left in the evening.


    A time clock? Really? Did they not trust me? Yikes, I thought, what have I gotten
    myself into? At that moment, I knew I had to plot my exit from the Fortune 500
    company world of work.


    It wasn’t long before I became the sixth employee of an economic consulting company.
    What a fantastic career move that was. This was an environment where I was able
    to carve out my own path based on how my skills and interests aligned with the
    company’s goals.


    At the age of 26, I moved to Tokyo to start the company’s Japan office. I went
    from literally punching a time clock at a massive corporation to being the sole
    employee of my start-up company outside the home office. Soon I was doing business
    at a high level and making a difference. And I was having an absolute blast! The
    fact that I was located 6,500 miles away from the management team, plus the 12-hour
    time difference, meant I was working when the rest of the team back in New York
    was asleep. And this meant that I had total and complete autonomy. I couldn’t
    have been happier.


    What a remarkable difference between the drudgery of my work as a tiny part of
    an enormous Fortune 500 company compared to my new work as a huge part of a small
    entrepreneurial venture. The lessons I learned about myself and what matters in
    my life have led me to continue chasing that start-up culture to this day.


    Now, I serve as an advisor to select emerging companies that are working to transform
    their industries by delivering disruptive products and services. My advisory clients
    include HubSpot,'
  - '[PAGE 14]


    a company I started working with in 2007 when they had a handful of customers
    and fewer than 10 employees. I helped the HubSpot team grow the company to more
    than 60,000 customers in 90 countries, and more than $500 million in annual revenue.
    My current portfolio of advisory clients in the start-up world also includes Mynd,
    Expertfile, YayPay, SlapFive, and InstaViser. I’m also a Go-To-Market Limited
    Partner at Stage 2 Capital, a venture capital firm that invests in start-up companies.


    *Be a Startup Superstar* is the book I wish I had when I was in college and considering
    a career in business. It’s a deep dive into start-up culture and includes wonderful
    stories about what life is like on the inside of successful, high-growth organizations.
    I found myself nodding in understanding and appreciation on each page.


    This is no academic tome written by somebody who simply studies what others do.
    Steve Kahan is a highly successful entrepreneur himself. He’s been in a number
    of successful start-up ventures and has also been in the trenches in the huge-company
    world. Steve delivers valuable insights on every page. He’s your personal mentor
    as he guides you through the start-up world.


    The stories you read in these pages show you how to be successful working at a
    start-up. In my experience, there is a huge difference in how to approach work
    at a mega-corporation versus a start-up, and Steve tells you exactly how to navigate
    those differences. In a big company, politics rule. Pleasing the boss is often
    more important than serving the customer. In the start-up world, the opposite
    is true: Success comes from what you do to grow the business, not from what you
    do to serve the egos of the muckety-mucks with big titles. Steve uses real-world
    examples to point out those differences so you can navigate your career with skill.


    Start-up companies represent an enormous opportunity for smart self-starters.
    And these entrepreneurial ventures are always on the lookout for talent, for people
    like you. CEOs tell me all the time that the most difficult part of their job
    is finding the passionate people who will make a difference in their companies.


    If you want to work for a company where everybody at the cocktail party will recognize
    the name on your business card, this is not'
  - "[PAGE 15]\n\nthe book for you. If you want somebody else to tell you what to\
    \ do at work, look elsewhere. However, if you’re eager to have fun, make a difference,\
    \ and change the world, read on! We’re counting on you.\n\n> — David Meerman Scott,\
    \ entrepreneur, business growth strategist, and bestselling author of 11 books,\
    \ including *Fanocracy* and *The New Rules of Marketing and PR*  \n> www.DavidMeermanScott.com\
    \ @DMScott"
  - '[PAGE 16]


    # Introduction


    > Life is no brief candle to me. It is a sort of splendid torch which I have got
    a hold of for the moment, and I want to make it burn as brightly as possible before
    handing it on to future generations.

    > —George Bernard Shaw, playwright


    I invite you to imagine you and I are meeting for a dinner appointment. It''s
    a warm evening and we are seated at an outdoor rooftop restaurant overlooking
    a bright, big city. As the sun sinks into a soft orange glow, and the lights from
    the buildings illuminate the deepening blue of the streets below, we talk about
    your college experience. Your face lights up as you tell me about the recognition
    you received; the camaraderie you experienced with professors, classmates, and
    friends who challenged your thinking. You express a longing for the structure
    of the educational framework where success surely comes to those who work hard.


    And then our conversation shifts to your current job situation.


    You inhale deeply. During college, you had imagined so much success and income
    in your future, but here you are, full of'
  - '[PAGE 17]


    knowledge and ready to put it to use, ready to prove yourself—but you’re stuck.
    You’re stuck in a job where advancement seems long and far away, and your life
    lacks the richness you desire and expect. You think about your peers, and while
    there are a few lucky ones who already seem rich and happy (according to their
    social media posts, anyway), you and most others are still getting by, trying
    to mitigate risk due to those aforementioned student loans you can no longer defer.
    You’re hoping for a big break or a lucky streak, or a mentor to take an interest
    in you and help you to navigate through this career conundrum in which you and
    other young professionals are caught.


    I am that mentor, and I’m taking an interest in you. This book provides the insider
    perspective of a mentor who has been in your exact situation and found a way forward,
    not just to a great job, but to a great career and massive success, both financial
    and personal. I want to help you discover your own path to becoming a brave leader
    in a world that you might have previously overlooked or written off as too risky:
    the tech startup world.


    While working for a startup might seem riskier than working for a large corporation,
    the potential rewards far outweigh the risks. And, if you’re smart, you can mitigate
    the risk. I will show you where the opportunities lie, how to take advantage of
    them, and how to choose a start-up with the best chance for success—whether you’re
    aiming for a tech or nontech role.


    Have you ever felt stuck in your job? Have you wondered how you will ever reach
    the level of success you imagined for yourself? You’re not alone. In 2019, amid
    a robust economy and low unemployment, college graduates struggled to get hired.
    Upon graduation, 75% didn’t have a job lined up at all. It took the average college
    graduate almost eight months to find a job—all against a backdrop where the average
    student loan debt was $41,810. Add to that the fact that in the same year, only
    31% of employees in the US and Canada felt engaged at work, and I believe this
    means we have a serious epidemic on our hands.


    This epidemic is not new. It nearly infected me.'

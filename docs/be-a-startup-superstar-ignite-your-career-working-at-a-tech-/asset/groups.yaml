    must change, and to lead the effort. This doesn’t mean challenging everything
    so you’re perceived as an anti-establishment contrarian. It’s more about challenging
    the old ways and creating new, better ways where it counts. Focus on taking calculated
    risks and innovating in areas where your special brand of thinking can make the
    biggest impact, such as increasing revenue, lowering costs, and improving customers’
    lives.


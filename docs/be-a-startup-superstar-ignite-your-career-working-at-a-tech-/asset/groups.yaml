    \ and interesting content they would want to download.\n\nAnd this is where Becca’s\
    \ tough decision-making moment came into being. She was running marketing at the\
    \ time, but the digital-centric approach was not in her skill set. She had to\
    \ make a tough decision. She could: (A) get frustrated and leave. (B) Get frustrated\
    \ and stay, pretending to go along while resisting and trying to maintain the\
    \ old way for as long as possible. Or (C) jump on board, commit to the success\
    \ of the company and her own long-term career growth, and embrace a ton of new\
    \ learning.\n"
  mdcn: "\n\n一个很好的例子：我加入 Quest Software，一家相对较大的上市公司，负责他们的营销工作。我意识到我们的交叉销售糟糕透顶。客户会买一个产品，就这样结束了。我们销售很多不同的产品，其中一些是我们原生开发的，但我们也从一些小公司收购了好几款，而我们的客户并没有享受到我们所能提供的全部价值。\n\
    \n我采取了任何改进流程的第一步：提出问题。我问：“为什么我们自己的产品交叉销售如此糟糕？”\n\n我做了一些研究。我下到销售现场，采访了我们的销售人员，请他们为公司做电梯演讲。几乎没有人能就此达成一致，我很快意识到我们产品太多，销售人员只推销他们最熟悉的那些。然后我查看了网站。我们没有系统来按类型组织产品；我们是按收购时间的先后顺序来组织的。想象一下，如果亚马逊不是按购物类别（书籍、食品、衣服等）来分组商品，而是按他们最近收购的时间顺序列出所有商品。你永远不会从他们那里买东西！\n\
    \n好吧，我们的情况基本上就是这样，所以我又问了两个问题：“为什么我们没有电梯演讲？”以及“为什么我们要这样组织产品？”每个人都告诉我同样的事情——那是董事长想要的。\n\
    \n我去找董事长告诉他，每个人都说我们电梯演讲混乱、网站杂乱的原因是他想要这样，我问他为什么。他当然很震惊——他从未说过他想要那样。事实上，他想要的是相反的。\n\
    \n发生的事情是，公司里每个人都习惯了现状。他们对现状如此熟悉，以至于编造了一个关于现状为何如此的故事，而这个故事根本不真实。\n\n在我们讨论之后，CEO\
    \ 批准我重新打造电梯演讲和网站。几个月后，我和我的团队推出了一套引人注目的电梯演讲和产品重组，将每款产品都归入七个逻辑清晰且易于区分的类别。然后，我们研究了哪些产品最能协同工作，并设计网站根据这些兼容性向客户做出推荐。\n\
    \n这些改变并不容易。人们对现状如此舒适，以至于一开始我们遇到了阻力和反对。销售团队中的很多人一开始并不接受新的电梯演讲，不同部门的人为他们的产品将被归入何处而与我们争执。最终，我们获得了员工和其他利益相关者的足够支持和动力，使变革成功。\n\
    \n这成为营销和销售的全面改造，因此我们冒着失去大量投入的时间、金钱和培训的风险。但这是一个经过计算的风险，它在长期内带来了提高收入的巨大潜力而得到回报。\n\
    \n无论多么经过计算，承担任何风险都可能产生恐惧。正如我们所建立的，加入一家初创公司本身也可能是一种经过计算的风险。与此同时，人们不断告诉我，当他们承担经过计算的风险时，他们经历了最多的成功和幸福。\n\
    \n自己试试：写下你一生中承担的三个最大的经过计算的风险。然后，写下每个风险的结果以及它如何改变了你的生活。这个练习将为你下一次的经过计算的风险建立信心。\n\
    \n记住要明智地选择你的风险——在某件事几乎不会推动指针的情况下冒巨大的收入风险是没有意义的。一旦你确定了目标，就要做好准备。做你的功课，提问，权衡结果，考虑替代方案，并在全力以赴之前先迈出小步。招募其他志同道合的领导者加入你的努力——不是为了掩护，而是为了协助。如果经过计算的风险最终失败，承担责任并继续前进也会帮助你脱颖而出，成为领导力人才。\n\
    \n底线：有效的领导者会承担经过计算的风险，如果你也这样做，你将远远脱颖而出。\n\n## 找到做出艰难决定的勇气\n\n> 在任何决策的时刻，你能做的最好的事情是做正确的事情，其次最好的事情是做错误的事情，而最糟糕的事情是无所作为。\n\
    > \n> ——总统西奥多·罗斯福\n\n如果你不能在通往顶峰的路上做出强有力的决定，你永远也到不了顶峰。无论你的职位头衔是什么，徘徊在犹豫不决的云雾中永远不是好事。如果你想在初创公司的阶梯上快速上升，就从一开始就证明你有勇气自信地评估情况并做出明智的决定。当然，你不会一开始就做出最大的公司范围的决定，但你应该在途中训练你的决策肌肉。\n\
    \n大多数人认为艰难的决定仅限于商业事务，但事实并非如此。生活充满了艰难的决定——从决定专注于哪个专业领域，选择哪个雇主，如何保护你的工作/生活平衡，何时寻求帮助，如何在你的职责范围内为项目花钱，选择与谁结婚，是否结婚，是否要孩子等。基本上，你生活的方方面面，从你的日常习惯到你的行为，都是一个决定。\n\
    \n唯一的区别是，当你在公司中职位越高，你需要做出的决定就越复杂。在 Navalent 对 2,700 多名领导者进行的为期 10 年的研究中，57% 的新任高管表示，决策比他们预期的更复杂、更难以做出。³\n\
    \n如果你不习惯做大决定，你可以通过在你的职责范围内决定较小的问题来练习并培养心理韧性。当其他人在两个艰难的选择之间骑墙时，要成为那个通过倡导你认为最好的决定并提出证据来说明原因而脱颖而出的人。这种领导力品质会被注意到并受到赞赏。它也有助于你进入并留在\
    \ C 套房。\n\n我一直喜欢成为团队中被要求对艰难决定负责的人。当然，我不是在真空中做决定，但我在职业生涯早期就确立了自己是愿意“拍板”的人。我此后学会了让自己周围的人也具备在对问题做足功课后做出艰难决定的勇气，因为拥有果断、自信的人在我的团队中会让我的工作更轻松。\n\
    \n当然，有效的决策是一项难以掌握的技巧，因为重大决定的结果很少是黑白分明的。强有力的领导者认识到一个决定可能会产生不明确或不理想的结果，但仍会做出决定。通过专注于主要期望结果来培养你做出艰难决定的勇气。研究事实，让他人参与过程，并欢迎这种不适感。\n\
    \n将决定的后果放在适当的视角下。问自己，“最坏的情况会怎样？”以及“如果我错了会怎样？”很可能，你会发现后果并没有你想象的那么严重。失败导致学习，学习导致成功。当大胆的决定产生出色的结果时，内化它们并利用这种成功来增强你的勇气。\n\
    \n在初创公司 Thycotic 的早期，Becca，一位超有才华的人，负责营销。当时，Thycotic 将大部分营销重点放在面对面策略上，如贸易展览、活动和研讨会。当我加入时，我意识到我们不可能通过研讨会方式实现疯狂增长。我们需要转向高速、以数字为中心的销售和营销模式。我为在需求点捕获买家提出了论据，提供免费的在线工具、免费试用和他们想要下载的有趣内容。\n\
    \n而这正是 Becca 艰难决策时刻的到来。她当时负责营销，但以数字为中心的方法不在她的技能范围内。她必须做出艰难的决定。她可以：（A）感到沮丧并离开。（B）感到沮丧并留下，假装配合，同时抵制并尽可能长时间地维持旧方式。或（C）加入进来，致力于公司的成功和她自己的长期职业成长，并拥抱大量的新学习。\n\
    \n"

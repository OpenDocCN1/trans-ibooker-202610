    # Everything Can’t Be a High Priority


    > Things which matter most must never be at the mercy of things which matter least.

    > —Johann Wolfgang von Goethe, German writer and statesman


    Setting clear goals pays another dividend: it provides the barometer to help you
    decide what to say yes to and what to say no to. In an intense start-up environment,
    it’s easy to be overwhelmed by too many goals when they all seem like high priorities.
    Don’t be so busy chasing all the loose dogs that you can’t build a fence. Focus
    your energy on the goals that will solve the biggest problems, create the best
    results, and propel you the farthest, the fastest.


    Early in my career, I had typed up my goals and printed out a long list to keep
    in front of me. Just looking at it made me anxious and jittery. I didn’t know
    where to start. I asked my manager for help prioritizing. I handed her my list,
    halfway thinking she would be impressed with my willingness to take on such a
    huge workload. I thought she would just arrange them in a better order. We spent
    about 30 minutes discussing them, and during that time, she crossed out about
    half of my goals. She told me that if I tried to accomplish them all, I would
    only have a meager pittance of time to spend on each one, and the results would
    be equally meager. I’d be going an inch in every direction without moving a mile.
    This lesson in prioritization changed my life.


    High performers, as I saw myself to be even at that point of my career, tend to
    take on massive workloads. This is part of the DNA of hard-working people, and
    it’s a trait I respect. But it can also create significant stress and lead to
    burnout over the long haul. I’ve learned that you can be a high performer without
    being overwhelmed, if you prioritize your goals. Success isn’t about how much
    you do. Success'

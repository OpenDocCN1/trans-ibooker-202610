    position at Microsoft is something many people only dream of. And Microsoft was
    making a hard push for me. They flew my wife and me out to Redmond, where I interviewed
    with several key senior executives. Later, they organized a huge, scrumptious
    dinner where I had the chance to meet and break bread with people who could end
    up being my peers. They showed me Steve Ballmer’s and Bill Gates’s offices. They
    offered to set us up with temporary corporate living right on a lake near their
    beautiful campus. I met the people who would be working on my team, and the person
    I would be accountable to, and we all hit it off. On top of all this, they offered
    an extremely generous compensation package. And, as a remarkable personal touch,
    they found out that my son loved video games and sent him an Xbox.



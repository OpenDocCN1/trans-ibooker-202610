    ## Why Work for a Start-Up Over a Big Corporation?


    A few years ago, Microsoft dangled a senior leadership role in front of me, which
    included a high-compensation offer and the chance to move to Seattle. It was tempting.
    I had been working for Bindview, a start-up where I ran marketing and helped to
    lead. But my role there was soon to end—Symantec, a much larger company, was acquiring

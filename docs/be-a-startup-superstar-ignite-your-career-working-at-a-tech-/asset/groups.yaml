    # Be Part of the Solution


    If you’re not part of the solution, you’re part of the problem. You’ve probably
    heard this before, but nowhere is this proverb truer than in a start-up environment.
    A start-up’s quick-change nature means more problems and surprises will pop up
    at a start-up than at an established company. In fact, as *Entrepreneur* magazine
    points out, by their very nature, start-ups are “companies in search of a problem
    to solve.”² To be a successful member of a start-up, you need to be the type of
    person who seeks problems to solve. The key to this rests in your mind-set—if
    you’re a negative person, problems can seem discouraging, but if you keep a positive
    attitude and focus on finding solutions, they’ll become exciting.


    For example, a colleague of mine, responsible for competitive intelligence, called
    to complain that the sales team was ignoring his reports because his info was
    frequently out of date. He was so despondent that he avoided the sales team altogether.
    Rather than commiserate, I told him to shift his outlook to search for solutions
    instead of just bitching about his problem. I suggested he put


    > ² Ali Beheshti, “Don’t Go Looking for Problems: Curing Your Own Pain Points
    Is a Good Way to Develop a New Product,” *Entrepreneur* (March 19, 2018).'
  - '[PAGE 113]


    together a core group to collect current intelligence, and involve the sales team
    in the data-collection process. I told him to present it as a competition to see
    who can provide the most relevant, timely news flashes. He liked the solution
    and implemented it. It paid huge dividends, and he was able to provide accurate,
    timely, usable competitive intelligence. A week later, everyone, including the
    sales team, was singing his praises.


    Each one of us is faced with problems of various sizes every day, inside and outside
    of work. Some will walk right past a “fire,” blame others, moan about it, make
    excuses, or ignore the situation in hopes that someone else takes it on. Obviously,
    not a good leadership style. On the other hand, if you approach problems as one
    intriguing challenge after another, you’ll go far in business and in life.


    That’s also not to say that you need to solve every problem that pops up in your
    path like you do in a video game. Like with your goals, it’s best to prioritize
    your problems. Ask yourself three questions about each problem: (1) How painful
    is the problem? (2) how frequently does it occur? and (3) What are the benefits
    of resolving it? Then spend time creating solutions for the problems that rise
    to the top, based on these criteria.


    This mind-set shift is the first step toward becoming a better problem-solver,
    but not the last. You can’t solve most problems by yourself, so seek input from
    people you respect. Estimate what resources are required and how long it will
    take to resolve. Realize that issues often take time to resolve. It’s too easy
    to slip into passivity when change doesn’t happen in a flash. It takes grit to
    hang in there and keep making progress. Of course, the best way to solve a problem
    is to prevent it. Use your intuition to predict where problems might arise, and
    take proactive steps to make sure they don’t.


    Finally, I’ll leave you with this parable. A man was fishing in the river when
    he noticed someone was drowning. He pulled them out and attempted to resuscitate
    them. Shortly afterward, he noticed another person in the river and saved them
    too. He then noticed another, and another, and another. Soon he was exhausted
    and realized he would not be able to save all of the drowning people. He went
    further upstream to find out why all these people'
  - '[PAGE 114]


    were falling into the river. He saw that a broken bridge was causing the problem.
    He decided he would just go ahead and fix the bridge.³


    # Pay Attention to Details

    (without Being a Control Freak)


    A co-worker of mine once spent hours preparing an amazing presentation. He did
    all of his research, built a gorgeous PowerPoint, and practiced for hours. On
    the day of the meeting, he showed up and pulled out his laptop, but when he opened
    it, nothing happened. The battery had died. He searched through his bag, but it
    was all for naught: he’d left his charging cord at home. All of that work, and
    we just ended up staring at a blank screen.


    This sort of thing happens to all of us, including me. It’s easy to look at the
    surface level and think that everything is on track, and it’s easy to put so much
    focus on the big ideas that you forget to charge your laptop.


    The best way to prevent problems is to never lose sight of the details. Every
    project depends on the success of its smaller components.


    In the larger corporate world, the highest-level employees have swarms of assistants
    who handle all the details for them. At a start-up, no one is too high up the
    food chain to ignore the details crucial to their own work. Each person needs
    to build their own presentations, practice them, and remember their own power
    cord, at every level. You’ll never reach the highest levels if you don’t have
    a reputation for minding the details.


    Often, paying attention to details will allow you to find creative or even upstream
    solutions to problems. For example, at one of my past start-ups, thousands of
    calls were coming into our call center. As the call volume increased, the wait
    time increased, and customer satisfaction went down. We spent loads of time focusing'
  - '[PAGE 115]


    on getting the call time down to handle the increased volume. However, it wasn’t
    until we examined all of the details that we saw the problem. We asked why there
    were so many calls in the first place. What were they about? Did we have issues
    with quality or usability? We discovered that we had a major product problem,
    so we had to involve developers and the quality assurance team to fix the issues,
    and then provide self-service access to training for customers. If we had continued
    to focus only at the surface level, we would never have understood the true reason
    for the call spike.


    Running this level of analysis can be complicated. Getting into the details takes
    time and extra effort. But paying more attention to them will improve efficiency,
    minimize the risk of errors, and turn a good result into a great result. Beyond
    that, getting the small things right matters, because even little mistakes can
    have a big impact on your reputation, your results, and your entire business.
    A friend of mine worked for a large company that printed its mission, vision,
    and values statements on slick, full-color cards. They distributed them to hundreds
    of executive leaders at their annual conference, and mailed them to thousands
    of employee homes across the system. After they went out, several leaders noticed
    that the cards included the line, “Excellence in everyting we do.” Yes, “everyting.”
    Even though the cards had a beautiful concept, purpose, and design—that small,
    overlooked detail was a costly mistake that involved reprinting, remailing, and
    recovering from the embarrassment.


    To become a detail-oriented person, ask more questions, use lists to keep track
    of details, audit projects, and get feedback from others. Of course, there are
    people who are just not wired to be detail-oriented. If you fall into that category,
    still try to do everything in your power to become as detail-oriented as possible,
    but if that fails, make sure you surround yourself with those who are.


    An important caveat: paying attention to the details is not the same as being
    a micromanaging control freak. I’ve worked with plenty of control freaks, and
    simply put, they don’t last long in a start-up environment. You simply don’t have
    that much control.'

    \ 七大关键要素*，即大学或工作中没有教给你的特质。这些领导属性以及创业思维将使你在人群中脱颖而出，并加速你的职业发展。\n\n*《成为初创公司明星》*将帮助你做出更好的决策，获得更好的结果，并将你的潜力提升到成功的下一个层次。现在是停止攀爬企业阶梯，开始乘坐科技初创公司火箭——直抵顶峰——的最佳时机！\n\
    \n**STEVEN MARK KAHAN** 是总部位于华盛顿特区的信息安全公司 Thycotic 的市场营销总监 (CMO)。作为一名屡获殊荣的网络安全营销人员和初创企业创业者，Steve\
    \ 成功帮助七家初创公司从早期开发阶段成长至上市或被收购，创造了超过 30 亿美元的股东价值。他以制定和执行能够加速公司收入增长、扩大市场份额并持续为股东带来卓越回报的营销策略而闻名。请在\
    \ StevenMarkKahan.com 与 Steve 建立联系。\n\n"

  ². Dorie Clark, “How to Get Out of a Meeting You Know Will Waste Your Time,” Harvard
  Business Review (January 3, 2018), https://hbr.org/2018/01/how-to-get-out-of-a-meeting-you-know-will-waste-your-time.





  moves you toward your overall goals. If a task doesn’t contribute to your overall
  goals, you ought to question why it is on there.


  Maybe one of your top objectives is really difficult and you put a couple of lower-priority
  things first on the daily schedule as a warm-up to give you the momentum you feel
  like you need to tackle the top-priority thing. That’s fine. We all have our own
  ways of working. And besides, it is functionally impossible to get your activities
  to match up 100% with your top objectives every day. Things pop up in life that
  you’ll need to take care of. The key is to make sure that the top priority items
  still get done—if the way your calendar is structured prevents you from doing that,
  go and excise some superfluous items.


  When you’re a young professional or when you’re working in a start-up environment,
  it can be difficult to figure out what to prioritize, as the role you fill might
  be less defined. Early in your career, it’s best to ask your boss to fill you in
  on the company’s top priorities as well as the important objectives within your
  specific department. Then you can seek advice on how you can take specific action
  toward these objectives.


  Here’s a great approach. Ask them, “If in six months, you and I are having a cocktail
  to celebrate something I have just accomplished, what did I do?” Your boss’s answer
  will provide a better sense of which tasks to prioritize, and help you stand out.


  To leverage this into a way to be seen as C-suite material, make sure to follow
  up. If your boss gave metrics for you to hit in a couple of different areas, once
  you’ve gone out and done the work, come back and say, “Hey, we hit the metrics here,
  but we didn’t quite reach it in this area. I’ve thought about this, and here’s how
  I’m going to fix it.”


  Every executive I have ever met would treasure a young professional who did that,
  yet it almost never happens. If you do it, it can help you stand out and move up
  and propel you into the C-suite.


  On the flip side, once you reach a management position, it becomes your job to make
  sure that your team focuses on the most important tasks. For example, in my work
  as CMO at Thycotic, I keep my team focused on our overall goal of growing revenue.
  There are lots of other, smaller tasks or things that we as a marketing department
  can do, many of which are easier or a lot more fun than doing the things that contribute
  to revenue growth. If you don’t pay attention, your workers will naturally drift
  toward those tasks. This doesn’t mean that these tasks shouldn’t be done, but that
  they must take a backseat to the company’s top priorities.


  ## 把自己放在首位


  The most important item on your calendar is you. You are priority number one. Does
  your calendar reflect this? Go ahead and open your calendar right now, and check
  to see how many appointments you have with yourself this week. I’ll bet you have
  too few.


  Think about the most valuable uses of your time, create estimates for how long your
  top business and personal priorities will take you, and block out that time on your
  calendar—as early as possible. First, block off the time you need to care for yourself
  and your family. Personally, I look at my calendar at least two weeks in advance
  and I block out time for myself, such as workouts, family time, learning time, and
  strategy time. I then block out regular meetings that I know I need to attend.


  Notice that I don’t just leave my personal time as white space on my calendar—if
  you do that, people will think that time is free and try to schedule you in another
  soul-sucking meeting. Blocking off the time lets everyone know that I have priorities,
  and that the blocks of time I listed earlier are untouchable, except in the most
  extreme circumstances.


  Regardless of what your calendar says, the person you have to protect your calendar
  from the most is yourself. Good time management not only means you make sure to
  set aside the most time you can, but also that you use your time efficiently.


  Often, people try to enhance efficiency by multitasking. Don’t. It doesn’t work.
  Focus on one priority task at a time. Finish it and move on to the next. The American
  Psychological Association reported that “Multitasking takes as much as forty percent
  more time than focusing on one task at a time.”³


  In addition to setting aside time to handle your top-priority work, make sure to
  add essential meetings to your calendar. These should include regular touch-base
  meetings with your boss. Such one-on-ones help you sync up, set priorities, and
  combine brainpower to deal with issues. If you have a crappy boss who doesn’t schedule
  time to meet with you, be proactive and request it. You can even set this expectation
  in an interview before accepting a new job.


  ## 家庭第一


  Here’s a secret to my success: I’m a workaholic and I put my family and myself first.
  Even at start-ups where long hours are the norm, you don’t need to sacrifice your
  family to excel or make it to the C-suite. Unfortunately, many make that choice
  and they pay a terrible price. Time is your most precious resource, in business
  and in your personal life. Kids and grandkids grow up, marriages need nurturing,
  and elderly relatives may need attention, too. All too often I’ve seen someone climb
  as high as they can in their career, and then they look at their weathered face
  in the mirror and realize they missed spending time with the people they valued
  the most. Success loses much of its sweetness when you have no one to share it with.


  We all face the conflicting priorities of work and family. Each one of us has our
  own unique situations and priorities—there is no one-size-fits-all solution to the
  problem, and, indeed, over the years the amount of time you need to dedicate to
  work and family will fluctuate.


  It’s a constant tug-of-war. Part of the problem stems from living in an age of universal
  technology accessibility. Company leaders often hope and expect employees to stay
  connected and to be available at a moment’s notice at all hours: early in the morning,
  lunchtime, all afternoon, dinnertime, evenings, weekends, and even on vacations.
  If you let them have it all, they will take it. Instead of enjoying the ocean with
  your friends or family, you will be sitting under a cabana trying not to get sand
  in the keys of your laptop.


  To find the right work/life balance, you’ve got to ask the tough question: how can
  you be the most effective provider for your family? The typical answer to this question
  is that work and income have to come first. But that puts you on a slippery slope.
  The right answer to this question is that work and family time are equally important
  because they are interdependent. I know that if I’m unhappy in my personal life,
  it will negatively affect my work life, so I don’t let that happen. Likewise, I
  know that if I’m unsuccessful in my professional life, it will negatively impact
  my family, so I do what I need to do to succeed at work. The key is finding a happy
  medium.


  This medium can seem impossible to find, but you will experience significant benefits
  by seeking it. A study by Family Living Today and NowSourcing reported that 66%
  of full-time employees don’t strongly believe they have achieved a work-life balance.⁴
  The study went on to say that this lack of balance includes both short-term and
  long-term consequences. In the short term, at home, 51% of respondents said they’ve
  missed out on important life events, and 40% said they’ve had time spent with the
  family ruined by work. In the workplace, 68% experienced poor morale, 36% reported
  poor productivity, and 41% reported a high turnover rate due to burnout and fatigue.


  The long-term effects are downright scary, as those who lack work/life balance carry
  a higher risk of heart disease and stroke, as well as depression and anxiety. Striking
  a healthy work/life balance could literally prolong your life.


  And it is attainable. I’ve been an executive leader the better part of 30 years
  while keeping my family as my top priority. I’ve always worked hard to set aside
  time for my wife, my kids, their games and performances (when they were young),
  and my friends. It



  并不总是容易的，但同事们尊重并理解我对陪伴家人的承诺。很多人告诉我，他们很欣赏我树立的榜样，这让他们感到安心去做同样的事。


  关键在于在工作和家庭生活之间建立界限并坚持下去。如果你要去度假，白天不要工作，只在特定的时间窗口内回复邮件。我在家时也会与工作断开联系，至少每周四次与家人一起吃晚饭。说得直白点，断开连接意味着在餐桌上或家庭时间里不使用任何电子设备，因为如果它们在身边或附近，忍不住想快速回一封邮件的诱惑就太强了。


  当然，也曾有过我因出差或参加晚间董事会会议而不得不错过家庭活动的时候。只要这种情况不常发生就没问题。家人会理解。只要这类情况是例外而不是常态，那么你就离实现健康的平衡更近了一步。


  尽早在职业生涯中，主动把家庭放在首位。出席重要的家庭活动和时刻。偶尔提早回家或晚点去上班，给家人一个惊喜。安排包含家人的工作外出。计划特别的家庭活动，但也要参与日常的互动。努力成为家人或密友中每个人的好倾听者，这样你就知道对每个人来说哪种类型的互动最重要。同事会来来去去，但你的家人会陪伴你很长时间，应该被放在首位。


  ## 把健康和健身放在首位


  初创公司发展迅速，这要求你能够跟上节奏。你必须有精力和耐力，专注，并能够应对压力。如果你想出类拔萃，就要抽出时间来支持自己的健康和健身。照顾好自己的身体会在减轻压力方面带来巨大的回报，同时也会提高你的效率和整体情绪。这些好处加起来会提高你在工作场所的表现。虽然照顾自己看起来似乎需要花费大量时间，但事实恰恰相反。你没有时间不去锻炼、不吃得好、不睡够。我们谁都没有。


  ### 锻炼


  几乎任何成功的企业高管都会告诉你，锻炼是他们成功的重要组成部分。Twitter 前 CEO Dick Costolo 说，锻炼“可能是你对自己做的最好的投资。你从
  20 分钟的锻炼中获得的回报会比你再花 20 分钟翻阅邮件或开会大得多。”5


  证据不仅仅是轶事性的。BBC 的一篇报道引用了一项研究，显示“无论年龄如何，人们在进行‘一次中等强度的运动’后都会对认知产生‘即时益处’，例如在固定自行车上进行十五分钟的中等强度骑行。这些发现表明，在白天锻炼可能比在办公室前后安排健身房时间更好。”6


  对我来说是有效的。我个人每天锻炼两次——一次是在刚醒来时，另一次是在午餐时间。在我把午餐时间安排在日历上之前，在这个非正式会议的热门时段很难拒绝邀请。我会屈服于这些工作午餐，结果下午感觉生产力更低、精力更差。最后，我理清了优先事项。虽然有例外，但我会在日历上空出午餐时间，并礼貌地拒绝邀请。锻炼在我的工作产出和健康方面带来的成果，远比把那段时间用于工作或社交要大。我建议你也这样做——把那段时间空出来并保护好它。


  一次又一次，我看到初创公司的员工在长时间工作和工作要求中很快增重，因为他们停止锻炼并开始忽视自己的营养。不要让这种情况发生在你身上！


  人们不锻炼最常见的借口之一是“没有时间锻炼”。每当我听到这个借口时，我总是问：“你晚上看电视吗？你参加不必要的会议吗？你会为自己的优先事项安排时间吗？你能每天把午餐时间空出来吗？”如果他们对其中任何一个问题的回答是肯定的，那么他们就有时间锻炼。


  就连创立 Virgin Group 并创办了 400 多家公司的 Richard Branson 也会抽出时间锻炼。7 他描述了他的“系统化健身计划”来保持体重、增强骨量和肌肉。他说他每天做一小时的负重和弹力带拉伸，每隔一天更换锻炼内容和肌肉群。他还打网球，喜欢海上风筝冲浪。如果
  Branson 在计划太空旅行并经营 Virgin 集团的同时还能找到时间锻炼，那么你也可以。


  当然，在初创公司环境中安排锻炼时间可能更困难。虽然大型公司可能有员工健康团队、现场健身房或包含激励措施的复杂健康计划，但初创公司往往没有这样的带宽或预算来开展此类举措。员工通常只能自行维持健康，因此你必须主动管理自己的健身。如果你不想在中午出汗，至少抽出时间来获得一个清新的精神休息，出去散步，或找个公园长椅读一本与工作无关的书——任何能让你的大脑有机会断开连接并重启的事情。下班后，去健身房或去
  YouTube，在那里你可以找到在户外或在家锻炼所需的一切免费在线指导。任何锻炼都比不锻炼好，所以去散步，爬楼梯，提前几条街下车步行剩下的路，在办公桌前伸展，下班后去跳舞，或请一位教练。总之：做任何让你感觉良好的身体活动。



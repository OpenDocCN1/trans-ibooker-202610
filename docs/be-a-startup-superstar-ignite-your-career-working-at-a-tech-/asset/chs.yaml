- "# 第三章\n## 培养你的领导技能和自信心\n\n> 才华横溢的思考实属罕见，但勇气甚至比天才更为稀缺。  \n> ——彼得·蒂尔，企业家，PayPal联合创始人\n\
  \n在初创公司这样的小环境中，高层会看到你所做的一切，而没有什么比领导技能和自信心更能让你迅速脱颖而出。在初创公司工作，你通常比在大公司更早有机会进入领导岗位，你需要作为领导者感到自如和自信，才能积极把握这些机会。缺乏这两种特质，你无法出类拔萃。我曾与技能超群但缺乏自信心去实施想法的员工共事，也曾与那些信心满满却言行不一的人共事。他们都没有登上各自领域的巅峰。在本章中，我将分享如何在自身体内培养这两种特质。\n\
  \n我相信它们已经发生。我曾想象自己进入高管层，想象自己在董事会上用出色的想法和惊人的成果征服众人，想象自己所在的初创公司被收购后我赚得七位数收入。而这一切，我都已实现。\n\
  \n早晨进行这种练习，能让我为接下来的一天定下基调。我知道自己正朝着什么方向前进，这让我不断自问：我能做些什么，朝着实现梦想结果的方向迈出一步？根据我的经验，当我问自己这些问题时，总能找到答案，成功也随之而来。\n\
  \n如果没有这种愿景想象，我迄今为止的成功是不可能的。\n\n无论你是在电脑上使用数字愿景板、用图钉固定图片的实体愿景板，还是通过想象成功并把想法写下来——关键在于拥有愿景。你要被未来的成功深深吸引，以至于整天都能听到海浪轻拍游艇侧舷的声音、感受到面前观众的能量、品尝到意大利红色夕阳下生活的甜美。关键在于：对自己的目标绝对清晰明确，把它们放在眼前，并不断追问自己将如何实现。这是通往成功的第一步，也是培养自己成为领导者、增强自信心的第一步。领导者需要一个愿景来凝聚追随者。\n\
  \n此外，当你对成功抱有坚定的愿景时，你的人生观也会更加积极。这样一来，即使遭遇挫折，你也能保持不退缩，重新聚焦于自己的愿景。\n\n你会经历挫折。伟大的成功是一段旅程，从来不会一帆风顺。如果你只顾低头看路，就不知道自己要往哪里去，最终也到不了任何令人兴奋的地方。只有放眼远方并不断前进，才能抵达伟大的境地，即使一开始它看起来还很遥远。\n\
  \n### 运用“合作竞争”与竞争脱颖而出\n\n我是A型人格，有着强烈的竞争欲望。我确信，这在一定程度上源于我在一个不富裕的家庭中成长为三个男孩中的长子。妈妈会买三四盒麦片回来，可大约两天后就被一扫而空。我和兄弟们都会努力比别人先醒来，跑下楼尽可能多地吞食麦片——如果你不是第一个到那里，几乎就没什么可吃的了。连吃一顿饭都成了一场竞赛。\n\
  \n很多人对竞争持负面看法，但如果没有竞争心，我绝不会取得今天这样的成就。我在每一家初创公司都把全部冷酷的竞争能量投入到带领营销团队上，不断智胜我们最强大的竞争对手。任何优秀的领导者都会有这种竞争驱动力。它具有感染力——当你重视超越其他公司时，这为办公室定下了基调，推动同事齐心协力战胜竞争对手。\n\
  \n你绝不应为胜利感到愧疚。记住，归根结底，你需要赢才能前进。我一直是这样看待的：你的竞争对手正试图从你和家人桌上抢走食物。他们想抢在你之前拿到麦片，所以你需要想尽一切办法击败他们。这并不意味着你应该幸灾乐祸或对竞争对手无礼。事实上，你需要始终谦逊地取胜，尊重竞争对手，因为在初创公司的世界里，局势可能瞬息万变。\n\
  \n强烈的竞争冲动会让你在所任职的公司中脱颖而出，但并不总是出于正确的原因。只要把竞争心指向外部公司，你就是明星。但一旦你与同事竞争，试图贬低他们或让他们显得比你差，你就会被视为混蛋，而不是宝贵资产。\n\
  \n没有人喜欢奖赏混蛋，所以即使你确实在与同事竞争晋升和重大项目，也要优雅地尽力而为。庆祝同事的成功，因为它们是公司的成功，也因此惠及于你。\n\n引导你的竞争能量与同事携手并进，而不是相互对抗。如何做到？专注于更大的问题（即帮助公司成功），而不是纠结于谁会得到高管办公室。这种健康的竞争精神能团结整个办公室和团队。我在PentaSafe工作时，我们不只是派拉横幅的飞机宣传招聘派对。每当季度业绩出色，我们就会租一架挂着“PentaSafe又迎来了一个出色的季度！”横幅的飞机，飞过同一家竞争对手的办公室上空。而我们这些让那个季度业绩出色的团队成员，会一边喝着啤酒，一边看着飞机飞过他们的地盘，共同庆祝。就这样，我们共同的竞争心带来了同袍情谊和巨大成功，因为我们很快占领了市场。\n\
  \n这并不意味着你必须把每个竞争对手都视为敌人。你可以运用“合作竞争”——这个词由作家亚当·布兰登伯格和巴里·纳莱巴夫在他们1996年出版的同名著作中首创——来引导你的成功。合作竞争是指初创公司与竞争对手合作以实现双方共赢。例如，我曾与一家初创公司合作，向一家大型竞争公司提供我们新兴技术的使用权。这种合作竞争帮助我们的初创公司获得收入，而那家成熟公司则无需内部开发，就能为客户提供更好的技术解决方案。双方都大获其利，但这需要一种平衡之举，同时扮演竞争者和合作者的角色。\n\
  \n### 成为专家与终身学习者\n\n要在初创公司环境中晋升，你必须从知识的杯中深饮，而不是只在边缘浅酌。这适用于两类知识：一个主要领域的深度知识，以及涉猎多个领域的广博知识。两者对于实现你的成功愿景都至关重要，而且都是终身的过程。知识不存在足够或过多之说，随着科技行业的变革飞速掠过，你的正规教育变得不那么重要，而掌握行业前沿知识则变得更加关键。\n\
  \n二十多岁时，我在一家初创公司做客户支持。那时还算可以——我的生活比以前更充实，也觉得工作挺有趣，但与此同时我有了两个年幼的孩子，债务也在迅速增加。更糟的是，我对工作并没有真正的热情。\n\
  \n我花时间重新审视自己的“为什么”——本质上就是问自己想要在个人层面实现什么，然后审视自己想在世界上产生怎样的整体影响。这给了我一份目标清单及其背后的理由。没过多久，我意识到自己真正的热情在于市场营销。\n\
  \n随后我迈出了很少有人走的一步，我建议所有读到这本书的人这样做：一旦我明确了自己的“为什么”，我就为职业生涯制定了一份计划。很多人擅长制定商业计划——增长战略、使命宣言、重要里程碑。但几乎没有人会为自己的职业生涯做同样的事。不过，这类计划容易失控——很容易就写出30多页。试着把它精简到一两页你认为最核心的要素，然后把这几页纸折好放进钱包里随身携带，就像我所做的那样，时不时拿出来重新审视并评估自己的进展。\n\
  \n我的个人计划中有一部分是成为市场营销专家。我沉浸在书籍中，研究众多公司的营销运作，把能弄到手的营销计划都做了笔记，还参加研讨会。因此，当我就职的初创公司出现一个初级营销职位时，我已经准备好了。\n\
  \n很快，我的深度学习得到了回报：我的营销知识远远超过了同行。我获得了晋升。这时，我面临一个选择。我可以躺在功劳簿上，认为自己已经学到了足够的营销知识，然后拥有一个平庸至极的职业生涯；或者我可以加大学习投入，在研究中走得更深。我选择了后者，它把我推向了更高的层次。\n\
  \n\n\n\n\n你必须深入才能攀升。当我招聘时，我在人才评估过程中最看重因素之一就是深度知识。我知道那些花时间成为专家的员工会表现得更好，解决更大的问题，并创造更高的价值。除了帮助你获得聘用，这三种品质也会让你获得晋升。\n\
  \n正如我前面提到的，Kevin Klausmeyer 很早就学会了如何通过深厚且广博的知识来脱颖而出。“我是在科技领域里的财务人员，”Klausmeyer 说。“我加入了一个专注于编写软件会计准则的行业工作组，我获得的知识水平让我与众不同，让我作为一个帮助制定科技行业所有公司都需要遵循的规则的财务人员脱颖而出。那就是我的差异化因素。”³\
  \ 他鼓励所有员工——无论是否在科技领域——都要找到自己的差异化因素。获得额外的认证，加入行业团体，并在你热衷的领域寻求志愿领导角色，以此让你从人群中脱颖而出。\n\
  \n花时间创造你的“为什么”，找到你真正热衷的一个主要领域，并将你的职业聚焦于该领域。当然，确保它是一个足够宽泛的领域，以便在多家初创公司内部都有通往顶层的成长路径。如果你获得过于专业化的知识，你在\
  \ C-suite 就不会有效。例如，我专注于营销以及它如何促进收入增长，而不是网站开发。\n\n一旦你决定让自己成为专家，找到所需信息就很容易了。知识无处不在。从分析师、行业影响者和导师那里学习，并记下他们的内部秘诀。深入研究市场研究、计划、博客、文章、网站和公开文件。接受具有挑战性的项目，并在实践中学习。必要时寻求帮助，并向你信任和尊重的人寻求建设性反馈。\n\
  \n寻找新知识的最佳场所之一就是你的竞争对手。史蒂夫·乔布斯喜欢毕加索的名言“好艺术家借鉴”，\n\n> “Good artists borrow,”\n\n\
  ³ Author interview with Kevin Klausmeyer, April 2019.\n\n“伟大艺术家窃取”，是有原因的。它同样适用于商业。我曾经注意到另一位科技领袖建立了一个在线工具，帮助组织评估其产品需求。我认为这是一个好主意。我研究了这个概念并意识到我们可以开发一个更好的版本，更注重客户而非我们自己的公司。我们把它建成了，它大获成功。它增加了我们的销售额并推动了公司向前发展。关键不是简单地推出竞争对手正在做的仿制品——而是要在已有想法的基础上进行改进。\n\
  \n当人们问我如何晋升时，我总是告诉他们每天投资于知识的成长。你需要对行业和你的公司有超越基础的理解。例如，如果你瞄准科技初创公司的财务职位，你需要发展深厚的财务专业知识，加上对公司产品、竞争对手和客户的了解。这并不意味着你需要知道如何编程（我不会）。这意味着你要关注你周围发生的创新，并思考如何从中学习以创造更好的东西或贡献更大的想法。\n\
  \n为自己制定学习计划，包括你将学习什么、何时学习以及使用什么资源。然后在日历上安排学习时间，不要让任何人占用这段时间。这是你奉献给自己并每天增长知识的时间，无论你是在正规教育环境中攻读学位，还是通过书籍、在线课程、视频或会议进行自主学习。\n\
  \n我们都很忙，终身学习需要付出努力，但这是一项投资，可以让你的收入、有效性、信心、沟通技巧和领导能力飙升。如果人们知道你在这个领域的专家，他们就更有可能追随你。\n\
  \n## 培养强大的沟通技巧\n\n沃伦·巴菲特说过，“成为你现在价值至少高出五十 percent 的最简单方法，就是磨练你的\n\n沟通技巧，无论是书面还是口头……你可能拥有全世界的智力，但你必须能够传达它。而传达就是沟通。”⁴\n\
  \n数据再次证明了这一点。LinkedIn 对美国招聘经理的调查显示，“沟通”是需求量最大的软技能第一名，也是初级个人贡献者中最受青睐的技能。⁵ 在我的经验中，这在初创公司世界尤其如此，因为变化是持续不断的。为了足够敏捷以求生存，初创公司需要能够适应持续变化并能即时良好沟通的员工。\n\
  \n培养强大的沟通技巧也会让你成为更好的说服者，这意味着你能够说服人们购买你的产品，也能说服你的同事围绕你的愿景团结起来。\n\n无论你从事什么领域，无论是财务还是营销，你都需要这一点。一次，在我们初创公司\
  \ C-suite 与潜在合作公司领导之间为期半天的会议上，我们的 CFO 就财务状况做了演示。幻灯片很棒，但她无法清晰地呈现。我们的客人对我们的能力越来越怀疑。感受到灾难即将来临，我们的一位具有强大沟通技巧的董事接管了演示，挽救了合作关系。而几个月后，CEO\
  \ 更换了 CFO。\n\n你必须发展你的公众演讲能力才能登顶。我知道——在众人面前讲话的想法可能令人恐惧。我也曾为舞台恐惧而挣扎。但你必须克服它。我也必须克服，而且一开始并不容易。记住大多数观众都希望你成功会有所帮助。然后，关键是：准备\
  \ + 练习 = 自信。\n\n注意最有效的沟通者的演讲习惯，并模仿他们的做法。我见过的最佳演示是演讲者发自内心地演讲，并以幽默、提问或轻松的故事开头来从一开始就活跃气氛。演讲者展示引人入胜且不冗长的幻灯片（如果他们使用幻灯片的话），不照读幻灯片，并阐明清晰的要点。\n\
  \n为了充分准备，你应该“倒背如流”地掌握演示主题和流程，了解受众和他们的需求，预料问题并准备好答案。在配偶、伴侣、朋友和/或同事面前提前练习任何演示。\n\n\
  然后，在实际演示中，促进与观众的双向对话和参与（向他们提问并邀请他们向你提问），并利用眼神交流来观察参与的非语言线索。\n\n在演示之外，所有这些规则同样适用。做好准备，并在发言前知道自己在谈论什么。如果不知道，就承认这一点。最糟糕的做法是通过一些支离破碎的陈述磕磕绊绊。最后，适当的沟通是双向的。就像你在做演示时需要阅读观众一样，在与同事互动时，练习多听少说。\n\
  \n如果你能将专业的科技知识与精准的沟通相结合，你将成为像金色独角兽一样：稀有且有价值。大多数科技工作者主要是分析型思维者，用行话交流，让外行难以理解。更糟的是，他们往往对科技领域之外的事情缺乏耐心，很难长时间保持他们的注意力以便有效沟通。如果你要在科技初创公司世界，或任何领域取得成功，你需要能够与这种超分析型的人沟通。这也会让你作为领导者脱颖而出，因为你能够弥合理解差距并推动公司向前发展。\n\
  \n那么，你该怎么做呢？要记住一件重要的事情是，技术人员对空话反应很差（例如，“如果我们齐心协力，就没有什么能阻挡我们！”）。他们主要对适用于他们工作的细节感兴趣，例如客户的体验\n\
  \n\n他们设计的产品。关注细节，展示你思考过他们的工作，并且你自己也有分析能力。运用你积累的深厚而广泛的知识基础。他们想知道你没有忽视他们，但没有什么比被迫参加他们认为不必要的会议更让他们恼火的了。\n\
  \n这最终是沟通最重要方面之一的一个例子：适应性。每个人都偏好以某种方式接收信息并被互动。如果你能发现这种方式，并做出细微调整，让他们感到被倾听、被看见、被欣赏和被包容，你的领导能力将突飞猛进。这种进步将带你进入高管层。\n\
  \n## 拥抱责任感\n\n根据 *《哈佛商业评论》* 的数据，每两位管理者中就有一位极不擅长问责，而且“高管们最回避的责任就是让员工承担责任。”随着劳动力日趋年轻化，这一问题愈发严重。*HBR*\
  \ 报告称，千禧一代的员工期望得到表扬和认可，却尚未准备好高效地处理建设性批评。⁶ 这种无法为自己的行为负责或担责的态度会引发问题，尤其是在科技初创企业中。要以感激和优雅的态度接受建设性反馈。不仅如此，还要主动寻求他人对你工作表现的反馈。\n\
  \n科技初创企业太小，无处躲藏。如果你搞砸了，后果很严重，而且如果你不承担责任，所有人都会注意到。另一方面，因为这种品质太稀缺，它是一个让你脱颖而出的绝佳机会，尤其对年轻员工而言。如果你能坦然接受反馈并承认错误，人们会注意到。这会自然地让他们把你视为领导者，并让你走上快速晋升的轨道。\n\
  \n> ⁶ Darren Overfield 和 Rob Kaiser 著，《每两位管理者中就有一位极不擅长问责》，*《哈佛商业评论》*（2012年11月8日），https://hbr.org/2012/11/one-out-of-every-two-managers-is-terrible-at-accountability.\n\
  \n如果你不为自己的错误承担责任，那你会迅速走向被解雇的结局。当我带领一个团队负责推出一个数字渠道，将我们的产品营销给新受众时，我们的期限很紧张。每个人都必须努力工作并按时完成各自的任务，我们才能成功。大多数人做到了，但有一位员工从未按时完成工作，也从不向我们其他人通报进展。这拖慢了项目进度，让我们手忙脚乱地收拾他的烂摊子，但每当有人质问他时，他都不当回事，仿佛没什么大不了。他的队友们受够了，绕过他，不再邀请他参加项目会议。而我在他有机会问“我们能再次推迟日期吗？”之前就解雇了他。\n\
  \n问责是双向的。你需要让自己对按时完成任务和交出优秀工作成果负责。最好的方法是极其清楚地明确项目所有权、目标、时间线、结果和衡量指标，这样你就知道自己的承诺。如果某项职责不清晰，就要求澄清。然后，正如我之前所说，更进一步，在便利贴或索引卡上写下你的个人目标和计划，并随身携带。定期回顾它们，监控进展和表现，并做出调整。\n\
  \n问责的另一面是接受他人对你的问责。初创圈流传着一句话：“One throat to choke”（只有一个可以掐住的喉咙）。从本质上说，它的意思是，归根结底，任何项目都应该有一个人最终承担责任，而这个人通常就是领导者。其他员工可能有各自的职责和任务，但最终要有一个人来确保一切运转正常。根据我的经验，这种集中是至关重要的。如果有一个中央权威来分配任务，然后确保任务按时保质完成，其他人就能解放出来，专注于各自的具体任务。如果你想脱颖而出、领导项目，并最终进入高管层，那就确保那个喉咙是你的。承担起领导角色，成为确保项目成功的那个人。利用这个位置成长为领导者，并给上级留下深刻印象。\n\
  \n## 展现谦逊\n\n我曾有一个营销团队领导职位空缺，有两个内部候选人。两人都能力出众、知识渊博，而且是久经考验的领导者。但有一个主要区别：其中一人似乎把所有好成绩都归功于自己的英明智慧，而另一人则认可来自团队每位成员的贡献。我晋升了后者，因为她带着那份自信的谦逊。我知道她会与团队分享成功，激发信任与信心，并在犯错时承认，这些都是建立战友情谊的有力工具。\n\
  \n我们都认识那种“我型人”，他们只为自己着想，独占功劳，隐藏他人的贡献，打击士气。猜猜怎么着？没人想帮助他们上位。相反，如果你是“我们型人”，把功劳归于应得之人，你就能激发出他人最好的一面，激发信任和信心。人们会喜欢你，而归根结底，这是成功最重要的方面之一。人们希望看到他们喜欢的人成功。\n\
  \n那么，什么是谦逊？它不是自卑。事实上恰恰相反。谦逊的人不常自夸，而是展现出沉稳的自信。自夸是可以的，但主要应作为确立可信度的工具。永远不要只是为了“打动”别人而自夸。谦逊是一种能力：能够自信地立足于你所知道和已经完成的事情，同时记住你总可以学到更多，并且没有任何一项成就是你独自取得的。它还是一种能力：始终保持倾听、寻找成长方法，并认可他人如何为你的成功做出贡献。\n\
  \n当然，放下自我并不容易。人们常常害怕展现谦逊，因为他们觉得那样会让自己显得软弱。但事实并非如此。正如 Zachary Feder 和 Khatera Sahibzada\
  \ 在《Entrepreneur》杂志的一篇文章中指出的那样：“谦逊……需要强大的内在力量来体现——这种力量不仅欢迎反馈和批评，而且深知这是我们成长的根本途径之一。”\n\
  \n我发现，当你把功劳归给别人、把光芒照向他们时，这实际上会以十倍的回报回到你身上。他们会愿意为你赴汤蹈火，助你成功。掌权者和你的同事都会欣赏你展现谦逊并认可他人。别弄错了，掌权者知道你所扮演的角色——你不必一直告诉他们。\n\
  \n## 相信你自己\n\n> 信心等于安全感，等于积极情绪，等于更好的表现。\n> ——托尼·施瓦茨（Tony Schwartz），The Energy Project\
  \ 总裁兼首席执行官\n\n自我怀疑就像一根磨损的线：如果你拉扯它，它可能会让整件毛衣散架。\n\n根据我的经验，在初创企业中，自信是成功最大的指标。不是智力，不是机会，也不是足智多谋。而是相信自己能够实现目标——尤其是在初创企业的环境中，那里道路比大公司更崎岖。在起起伏伏中，你需要自信来保持稳定。我们所有人，包括我自己，都要面对脆弱、不确定性和失败。如果你让这些事打败你，你将一事无成。要相信你会继续前进并找到解决办法。\n\
  \n我很幸运，天生就相信自己。即使从小贫困，我也知道自己的处境是暂时的。六年级第一天，我穿着破旧的衣服，背着一个破旧的书包。我立刻注意到大多数同学从头到脚都是新装备。尽管缺乏所有外在的成功标志（富裕的成长环境、私立学校、高净值的家人和朋友），我依然泰然自若。如果你没有这种天生的自信，别担心。它是一块肌肉，和任何其他肌肉一样，你可以锻炼它。\n\
  \n当我在 The Planet 工作时，我们遇到了一场险些让整个公司倒闭的危机。我们的数据中心发生爆炸，所有服务器都被火焰吞噬。那些服务器中存储着数千名客户的云数据，而转眼间，一切都消失了。\n\
  \n\n\n周日清晨，我接到电话得知这个消息时，有那么一瞬间，我想：“我们可能要倒闭了。客户会离开。这是可能发生的最糟糕的事。”如果我一直顺着这些念头想下去，我可能就崩溃了。但这些可能让我崩溃的念头并没有持续太久。就在同一个周日，我们召集了所有领导层开会。会上，就在一块大白板上，我们制定了一份应对危机的行动计划。我们一开始就做出了两个重大决定：一是对客户完全透明，不仅告诉他们我们知道什么，也告诉他们我们不知道什么，以及我们何时会知道我们不知道的事；二是要在经济和其他方面对客户公平。我们围绕这两个原则制定了整套应对方案，分享进展更新和照片，并在必要时向客户提供经济补偿。\n\
  \n我们能这么快制定出计划，是因为领导层对我们能东山再起有足够的信心。如果他们向怀疑低头，我们永远无法从这种规模的灾难中恢复过来。但他们没有，他们带领我们迈出了第一步。一旦迈出了第一步，这计划就给了我们更大的信心。我们感觉自己正在做所有正确的事——积极主动，朝着正确的方向前进。我们有路线图，并能从中获得额外的安心。最终，我们几乎没有流失客户，我把这归功于公司领导层积极的自我信念。\n\
  \n当然，这是一个极端的例子，但它说明了在商业中成功的一个重要道理。首先，商业中的每一天都充满混乱，尤其是在初创公司。总会有事情发生：客户不满、竞争对手大胆出手、服务器崩溃需要快速响应。你需要相信自己有能力处理这些事；而当你做好准备时，这种自信就会容易得多。准备充足就等于自信——无论是扑灭字面意义上的服务器火灾，还是只是做一场普通的演示。\n\
  \n通常，自卑的人会进行大量消极的自我对话。他们会想：“我是个失败者，什么事都不顺，我是个废物。”\n"
- "# 第4章\n\n## 从人群中脱颖而出\n\n> 如果你想从人群中脱颖而出，就给人们一个不忘记你的理由。\n> ——理查德·布兰森爵士，投资者、作家、维珍集团创始人\n\
  \n一旦你被初创公司聘用，你不会自动升到顶端。这是一场战斗，需要付出很多努力才能浮出水面。你将与初创圈中的其他人竞争领导职位，而事实是，他们中的许多人拥有相似的技能组合。要从人群中脱颖而出，你需要找到新的方法让自己与众不同，最好的方法之一就是培养并展现强大的领导特质。领导力是一种多方面的技能，需要花时间和精力去学习。我们在上一章讨论的只是一个起点——要真正脱颖而出，你需要培养自己多提问、多冒险、做出艰难决定、提出好主意并执行它们的能力。\n\
  \n### 让自己与众不同\n\n正如我之前提到的，你需要为自己准备一段电梯演讲，在与初创公司领导者面试时能马上用出来。它应该和乘电梯一样长——最多 20 秒，并立刻说明为什么他们应该录用你。确保它传达出你如何提供独特价值，以及他们为什么应该在你身上投资。\n\
  \n为了帮你找到写这段演讲的内容，请同事、导师和朋友描述你最强大、最独特的品质和优势。虽然我们可能对自己为什么独特有自己的想法，但没有什么能代替了解别人眼中你脱颖而出的原因。同时，也请这些人告诉你最大的弱点是什么，并强迫自己不带防备地倾听。如果他们的反馈是诚实的，可能会帮你发现可以改进的领域。\n\
  \n正如初创公司必须创造产品和服务，以便在与更大、资金更充足的公司竞争的市场中实现差异化，你也必须让自己与那些觊觎你所追求的高职位的人区别开来。初创公司的差异化因素包括它们提供的产品、服务、分销、品牌形象或专长。当你把这些概念应用到自己的职业生涯时，会是这样的：你的产品就是你的工作表现。你的服务就是你如何交付卓越的解决方案并建立人际关系。你的分销渠道就是你如何沟通和分享自己的表现。你的（个人）品牌就是别人与你互动时的体验。你的专长则是你在一个主要领域的深厚知识，它帮助你比别人更好地交付你的产品。\n\
  \n在我多年做人事决策的经历中，我注意到，那些被录用并晋升的员工，都是能让其他人都意识到他们是自己领域最棒的人。即使是经验最少的员工，也可以通过展示领导技能，领先于那些资历更老的员工获得晋升。\n\
  \n以下是六种让你从人群中脱颖而出的具体方法：\n\n- 1. **主动采取行动。** 你经理的待办事项清单上有重要任务吗？去接手一个没人愿意碰，但又必须完成的项目。\n\
  - 2. **在公司内部建立人际关系。** 能做成大事的人，都认识能帮上忙的人。\n- 3. **展现你对公司的热爱。** 令人惊讶的是，没有多少人会特意展示自己对一家公司及其价值观和目标的承诺。\n\
  - 4. **提升你的技能。** 随着你在想晋升的领域不断积累知识，你会成为不可或缺的资产。\n- 5. **加倍努力。** 归根结底，最受你控制的品质就是努力。如果你偷懒，别人会看出来，你就会被解雇。但如果你逼自己一把，比任何人都更进一步，这一点也会被看见，并帮助你在公司里晋升。\n\
  - 6. **磨炼你的沟通技巧。** 即使是写得很糟糕的电子邮件，也会让你的能力显得很差，所以始终要让邮件简洁有力。\n\n值得注意的是，一个让自己差异化的大好机会，就是帮助你的公司在市场上实现差异化。这是差异化的双重红利——你既能提升自己的地位，也能提升公司的地位。我在\
  \ PentaSafe 工作期间就有一个很好的例子。我加入时，我们是一家小型私营网络安全公司，与三家规模大得多的上市公司竞争。问题是，我们销售的产品本质上都一样：漏洞评估和入侵检测。\n\
  \n我们需要一种让自己差异化的方式，而由于资源有限，单靠技术我们永远无法做到。其他公司的研发部门规模更大，也更令人印象深刻。于是，我审视了我们的公司，也审视了这个领域，然后意识到：其他公司只关注技术，没有人关注安全等式的另一面——人和政策。\n\
  \n我们有一个项目，是公司一位富有创造力的工程师在做的。当时我们不确定是否会把它推向市场。这个工具可以评估员工对安全政策的理解程度，这一点非常关键，因为大多数员工对这些政策完全不了解。通常，他们会拿到一大堆文件，看都不看就签字，然后忘得一干二净。\n\
  \n我们还是把产品推向了市场，并把它作为主要的差异化因素。这让我们得以把自己标榜为唯一一家解决安全等式中全部三个因素的公司：技术、政策和人。\n\n有趣的是，这个用于评估员工对政策理解程度的新工具，我们几乎没卖出去多少。从这个层面看，它似乎是一个失败，但正因我们拥有这个工具，我们才得以进入许多公司的大门。一旦进了门，我们就能向他们推销我们的主打产品，并从更大的竞争对手那里抢走生意。所以，从这个角度看，它取得了巨大成功。\n\
  \n我们并没有止步于此。我和两位团队成员 Chris Pick、Todd Tucker 一起，创建了一个我们称之为“人类防火墙委员会”的社区。我们把来自世界各地的数千人聚在一起，讨论网络安全。\n\
  \n这个委员会真的发展得很好。在 PentaSafe 被收购、我们都大赚一笔之后，Chris 和 Todd 都去了另一家公司 APPTIO 工作。在那里，他们实施了同样的委员会，并拓展、改进了这个想法。这一举措帮助他们取得了成功，进入了高管领导层。\n\
  \n我们来剖析一下这里的经验，因为不止一条。第一条是，无论你是一家公司还是一个人，要想成功，都需要找到一个自己能脱颖而出的领域。第二条是，很多时候，你可以同时实现这两个目标。当你发现能帮助公司脱颖而出的关键创新并付诸行动时，你也会随之脱颖而出，然后你就能利用新获得的专长，在新事业中取得成功。\n\
  \n### 多提问题\n\n你可能会认为，最成功的初创公司 CEO 们拥有辉煌的战绩、庞大的社交影响力平台，以及数百万……\n\n\n\n你可能认为最优秀的人是那些在会议上说个不停的人。但事实恰恰相反：他们提出深思熟虑的问题，并倾听回应。他们明白，正确的问题能激发思考，而思考能引发行动。如果你想晋升到最高管理层，请培养这项技能。\n\
  \n我很早就学到了这一课。在我最初的几个初创公司职位中，我赢得了“能成事”的名声，因此领导让我承担一项全新的职能，完全超出我之前的经验范围。我拼命想给新经理留下深刻印象，所以每次与他开会时，我都滔滔不绝地抛出一连串计划和解决方案。他只是安静地听着，而每次会议结束时，我都暗自庆幸自己多么聪明。\n\
  \n尽管我的团队取得了令人瞩目的成绩，我和经理的关系却恶化了。我不明白为什么。后来有一天，我的一位导师问我的近况。我告诉他我很沮丧，因为我和经理合作得不好，我不知道原因。这位导师除了问一堆问题，还能做什么呢？在听完我的回答后，他说：“多向你的经理提出恰当的问题，而不是告诉他所有答案。”\n\
  \n那时候，我无论走到哪里都带着一个笔记本。我的导师指了指笔记本，让我在每页顶部写一个小问号，提醒自己该怎么做。\n\n我听从了他的建议。效果神奇。原来，我的经理一直希望我询问他的优先事项和反馈，这样他就能与我和我的团队合作。我们的关系改善了，团队的业绩也提高了。\n\
  \n我看到年轻、自信的专业人士身上也有同样的倾向：总是试图表现得像个专家。这从来不会奏效——这几乎等同于在额头上纹上“缺乏经验”四个字。如果你想给人留下深刻印象，尤其是在年轻时，与其告诉别人你知道什么，不如多提出聪明的问题。这会表明你有足够的成熟度，能意识到自己还有很多不懂的地方，并且渴望加深知识。这会让你的上级和同事信任你，愿意给你更有挑战性的项目和更大的责任。\n\
  \n要克服“掌握所有答案”或“永远正确”的冲动并不容易，但这对于成功至关重要，尤其是在创业领域。在2018年出版的*《美丽问题之书》*中，创新专家沃伦·伯杰引用了风险投资家克里斯托弗·施罗德的话：“他用以下问题提醒自己保持开放的心态：*我宁愿正确……还是宁愿理解？*”施罗德说：“如果你执意要正确，就会把自己锁在回声室里——这可能导致你做出糟糕的决定。”¹\n\
  \n在流程成熟的大公司里，员工很容易只按指示做事，而不提出问题。但在创业环境中，公司的流程尚在建设之中，提出有见地、有用的问题来理解全局并找到更多创造性的解决方案至关重要。这不仅会让你显得深思熟虑，还会让你在工作中更加出色。\n\
  \n同样的理念也适用于与客户交谈。在我的职业生涯中，我接到过数百个销售电话。大多数销售人员都能陈述自己的价值主张，但只有少数人会问我问题。\n\n那些不提问的销售人员忘记了销售中最重要的方面：倾听。如果他们连我目前正在处理的问题是什么都不知道，又怎么能向我推销产品呢？也许我还有一个自己都尚未意识到的问题。当然，他们可以告诉我他们看到了问题，但如果由我自己说出来，我更容易相信。那些提出最睿智的问题、让我意识到自己方案中的缺口的销售人员，几乎总是我最终愿意向其购买的人。\n\
  \n从中得到的最大启示不仅仅是多提问，而是提出更有深度、更高质量的问题。没有什么比一个人为了提问而提问，或者问一些已经涵盖过的问题更令人厌烦的了。\n\n如果你想学习如何提出好问题，没有比苏格拉底更好的老师了。按照他的方法，你从一个开放式的、具有挑战性的问题开始。然后，接着问“为什么？”经过大量讨论，你可能会得出某种答案。然后，你就那个答案再提出更多问题，审视你提出的解决方案。\n\
  \n> ¹ 沃伦·伯杰，*《美丽问题之书》*（伦敦：布鲁姆斯伯里出版社，2018年）。\n\n当然，与哲学不同，在商业中你必须行动，所以在某个时刻，你需要暂停重新评估的过程来实施一个解决方案。然而，在那之后，你仍应继续就你的解决方案提出问题，并完善你的思考。\n\
  \n虽然这听起来有些理智化、深奥难懂，但它同样适用于商业。例如，不要问“我们的客户满意吗？”，而应该问“我们如何帮助客户获得更大的满意度？”“这个功能的目的何在？”以及“我们如何更好地支持客户成功？”从那里开始，就是找到最佳答案并制定一系列可执行事项的问题。然后，执行这些行动，但不要让过程就此止步。一旦你得到结果，继续追问发生了什么，问“为什么会这样？”这类问题。通过这类问题，你可以进一步完善你所采取的步骤。\n\
  \n然而，在任何决策场景中，无论是个人还是职业领域，都有一个比其他问题更重要的问题。提出这个问题可以带来更深刻的理解、更好的决策和更出色的结果。那些提出这个问题的人被视为更具战略眼光和前瞻性，而这些特质能让领导者迅速登上顶峰。这个问题就是：下一步是什么？\n\
  \n很简单，不是吗？试试看，亲身体验结果。\n\n## 承担计算过的风险，挑战现状\n\n当你想到贝比·鲁斯时，你会想到什么？本垒打？1927年，贝比·鲁斯打出了他赛季的第60支本垒打，创下了保持34年的本垒打纪录。²\
  \ 但这位“贝比”不仅仅是“打击王”，他还是“三振王”。\n\n他那孤注一掷的冒险击球风格，让他创纪录地成功绕垒得分，也创纪录地走回休息区。\n\n教训是：如果你不冒险挥棒，就击不出本垒打。别搞混了。我不是主张在每个机会都用力挥棒。我主张在时机成熟、能够改变局面的时刻，在你已经做好准备和练习之后，大力挥棒。\n\
  \n我赢得了“冒险者”的名声，但我并不这样看自己。我认为自己是一个“有计算的风险承担者”，这两者之间有一个巨大而微妙的差别。风险意味着不必要的行为，往往是冲动的、由情绪驱动的。计算过的风险意味着在做好功课并准备好备选方案（如有必要，还有C计划）之后才去冒险。如果你从不冒险，你将一事无成；但如果你冒很多大风险，你很可能跌跌撞撞。要产生影响，你必须愿意承担经过计算的风险。\n\
  \n即使是经过计算的风险，你偶尔仍然会输。我就如此——虽然我几乎所有大胆的举动都得到了回报，但也有几次失败了。例如，我曾在一项新的营销活动中投入了大量时间和金钱。该活动的主题大胆而与众不同，我们的团队期望这种不同会带来更大的成功。结果它彻底失败了。尽管我害怕向CEO汇报，但我承担了全部责任，并提供了继续前进的解决方案。这次三振很痛苦，但也磨练了我的品格、韧性和知识，使我下次能够击出本垒打。而我确实做到了。\n\
  \n尽管那次尝试失败了，我并没有停止冒险。如果你执意维护现状，你在初创公司待不长。要激发你的职业生涯，你必须愿意照亮那些必须改变的重要事情，并带头努力。这并不意味着挑战一切，让自己被看作反体制的叛逆者。更重要的是挑战旧方法，在关键之处创造新的、更好的方法。专注于承担经过计算的风险，并在你独特的思维方式能够产生最大影响的领域进行创新，例如增加收入、降低成本、改善客户生活。\n\
  \n\n\n\n一个很好的例子：我加入 Quest Software，一家相对较大的上市公司，负责他们的营销工作。我意识到我们的交叉销售糟糕透顶。客户会买一个产品，就这样结束了。我们销售很多不同的产品，其中一些是我们原生开发的，但我们也从一些小公司收购了好几款，而我们的客户并没有享受到我们所能提供的全部价值。\n\
  \n我采取了任何改进流程的第一步：提出问题。我问：“为什么我们自己的产品交叉销售如此糟糕？”\n\n我做了一些研究。我下到销售现场，采访了我们的销售人员，请他们为公司做电梯演讲。几乎没有人能就此达成一致，我很快意识到我们产品太多，销售人员只推销他们最熟悉的那些。然后我查看了网站。我们没有系统来按类型组织产品；我们是按收购时间的先后顺序来组织的。想象一下，如果亚马逊不是按购物类别（书籍、食品、衣服等）来分组商品，而是按他们最近收购的时间顺序列出所有商品。你永远不会从他们那里买东西！\n\
  \n好吧，我们的情况基本上就是这样，所以我又问了两个问题：“为什么我们没有电梯演讲？”以及“为什么我们要这样组织产品？”每个人都告诉我同样的事情——那是董事长想要的。\n\
  \n我去找董事长告诉他，每个人都说我们电梯演讲混乱、网站杂乱的原因是他想要这样，我问他为什么。他当然很震惊——他从未说过他想要那样。事实上，他想要的是相反的。\n\
  \n发生的事情是，公司里每个人都习惯了现状。他们对现状如此熟悉，以至于编造了一个关于现状为何如此的故事，而这个故事根本不真实。\n\n在我们讨论之后，CEO 批准我重新打造电梯演讲和网站。几个月后，我和我的团队推出了一套引人注目的电梯演讲和产品重组，将每款产品都归入七个逻辑清晰且易于区分的类别。然后，我们研究了哪些产品最能协同工作，并设计网站根据这些兼容性向客户做出推荐。\n\
  \n这些改变并不容易。人们对现状如此舒适，以至于一开始我们遇到了阻力和反对。销售团队中的很多人一开始并不接受新的电梯演讲，不同部门的人为他们的产品将被归入何处而与我们争执。最终，我们获得了员工和其他利益相关者的足够支持和动力，使变革成功。\n\
  \n这成为营销和销售的全面改造，因此我们冒着失去大量投入的时间、金钱和培训的风险。但这是一个经过计算的风险，它在长期内带来了提高收入的巨大潜力而得到回报。\n\n\
  无论多么经过计算，承担任何风险都可能产生恐惧。正如我们所建立的，加入一家初创公司本身也可能是一种经过计算的风险。与此同时，人们不断告诉我，当他们承担经过计算的风险时，他们经历了最多的成功和幸福。\n\
  \n自己试试：写下你一生中承担的三个最大的经过计算的风险。然后，写下每个风险的结果以及它如何改变了你的生活。这个练习将为你下一次的经过计算的风险建立信心。\n\n\
  记住要明智地选择你的风险——在某件事几乎不会推动指针的情况下冒巨大的收入风险是没有意义的。一旦你确定了目标，就要做好准备。做你的功课，提问，权衡结果，考虑替代方案，并在全力以赴之前先迈出小步。招募其他志同道合的领导者加入你的努力——不是为了掩护，而是为了协助。如果经过计算的风险最终失败，承担责任并继续前进也会帮助你脱颖而出，成为领导力人才。\n\
  \n底线：有效的领导者会承担经过计算的风险，如果你也这样做，你将远远脱颖而出。\n\n## 找到做出艰难决定的勇气\n\n> 在任何决策的时刻，你能做的最好的事情是做正确的事情，其次最好的事情是做错误的事情，而最糟糕的事情是无所作为。\n\
  > \n> ——总统西奥多·罗斯福\n\n如果你不能在通往顶峰的路上做出强有力的决定，你永远也到不了顶峰。无论你的职位头衔是什么，徘徊在犹豫不决的云雾中永远不是好事。如果你想在初创公司的阶梯上快速上升，就从一开始就证明你有勇气自信地评估情况并做出明智的决定。当然，你不会一开始就做出最大的公司范围的决定，但你应该在途中训练你的决策肌肉。\n\
  \n大多数人认为艰难的决定仅限于商业事务，但事实并非如此。生活充满了艰难的决定——从决定专注于哪个专业领域，选择哪个雇主，如何保护你的工作/生活平衡，何时寻求帮助，如何在你的职责范围内为项目花钱，选择与谁结婚，是否结婚，是否要孩子等。基本上，你生活的方方面面，从你的日常习惯到你的行为，都是一个决定。\n\
  \n唯一的区别是，当你在公司中职位越高，你需要做出的决定就越复杂。在 Navalent 对 2,700 多名领导者进行的为期 10 年的研究中，57% 的新任高管表示，决策比他们预期的更复杂、更难以做出。³\n\
  \n如果你不习惯做大决定，你可以通过在你的职责范围内决定较小的问题来练习并培养心理韧性。当其他人在两个艰难的选择之间骑墙时，要成为那个通过倡导你认为最好的决定并提出证据来说明原因而脱颖而出的人。这种领导力品质会被注意到并受到赞赏。它也有助于你进入并留在\
  \ C 套房。\n\n我一直喜欢成为团队中被要求对艰难决定负责的人。当然，我不是在真空中做决定，但我在职业生涯早期就确立了自己是愿意“拍板”的人。我此后学会了让自己周围的人也具备在对问题做足功课后做出艰难决定的勇气，因为拥有果断、自信的人在我的团队中会让我的工作更轻松。\n\
  \n当然，有效的决策是一项难以掌握的技巧，因为重大决定的结果很少是黑白分明的。强有力的领导者认识到一个决定可能会产生不明确或不理想的结果，但仍会做出决定。通过专注于主要期望结果来培养你做出艰难决定的勇气。研究事实，让他人参与过程，并欢迎这种不适感。\n\
  \n将决定的后果放在适当的视角下。问自己，“最坏的情况会怎样？”以及“如果我错了会怎样？”很可能，你会发现后果并没有你想象的那么严重。失败导致学习，学习导致成功。当大胆的决定产生出色的结果时，内化它们并利用这种成功来增强你的勇气。\n\
  \n在初创公司 Thycotic 的早期，Becca，一位超有才华的人，负责营销。当时，Thycotic 将大部分营销重点放在面对面策略上，如贸易展览、活动和研讨会。当我加入时，我意识到我们不可能通过研讨会方式实现疯狂增长。我们需要转向高速、以数字为中心的销售和营销模式。我为在需求点捕获买家提出了论据，提供免费的在线工具、免费试用和他们想要下载的有趣内容。\n\
  \n而这正是 Becca 艰难决策时刻的到来。她当时负责营销，但以数字为中心的方法不在她的技能范围内。她必须做出艰难的决定。她可以：（A）感到沮丧并离开。（B）感到沮丧并留下，假装配合，同时抵制并尽可能长时间地维持旧方式。或（C）加入进来，致力于公司的成功和她自己的长期职业成长，并拥抱大量的新学习。\n\
  \n\n\n\n她选择了C。\n\n尽管起初很困难，贝卡还是抓住机会，尽可能学习所有关于数字营销和高速在线销售漏斗模型的知识。她做出了一个艰难的决定：埋头学习，坦然接受自己知识上的空白，并认识到这个机会能带她走向何方。她始终将目光聚焦在长期增长上，无论是对于Thycotic公司还是她自己的职业生涯。她成为了数字营销专家。她建立了一套能够执行新策略的技能组合，我预测这将带给她持久的成功和多个首席营销官（CMO）的职位邀请。但如果她没有自觉地决定接受挑战并使之成功，这一切都不会发生。\n\
  \n## 指出房间里的大象\n\n在我曾任职的一家快速发展的初创公司，周一早上7:30的领导力会议上，CEO突然宣布欧洲领导团队已被解雇。没有解释，没有讨论，甚至没有人问一句“大家有问题吗？”当会议继续进入下一个议题时，每个人都惊讶地互相张望，脑海中盘旋的未解之问就像房间里的大象一样赫然显现——一个没人愿意提起的明显大问题。然而会议仍在继续。\n\
  \n那天晚些时候，我安排了与CEO的私人会议（再次说明，这就是初创企业的好处——你可以更容易接触到高层领导），并直截了当地问他发生了什么。他说欧洲团队表现不佳，所以他进行了人员清理。\n\
  \n我问他有什么计划，他开始用含糊不清、不确定的措辞回答。最后我意识到，我们并没有明确的后续计划。我开始担心——公司正在飞速发展，但如果欧洲一团糟，我们所有的成功都将面临风险。\n\
  \n我的主动性发挥了作用，我提出了一个解决方案：我主动请缨，在他想办法的过渡期间去管理欧洲分部。两周后，我和我们一位顶级销售员一起去了欧洲。我在那里待了六个月，我们扭转了局面。实际上，在其中某个季度，我们的业绩超过了美国分部，这主要是因为完成了一笔巨额销售。\n\
  \n我只在那里待了六个月，但指出房间里的大象这一决定带来了巨大的好处。它加速了我们欧洲分支的重建，也给了我一次全新的经历。在那之前的职业生涯中，我从未在实际的一线销售中取得成功。我一直是带着销售意识来做营销，但那不一样。然而在欧洲，我第一次亲身参与了直接销售，并体验到了巨大的成功。\n\
  \n我赞同美国教授、《最后的演讲》的作者兰迪·波许所说的话：“当房间里出现大象时，把它介绍出来。”如果你去寻找大象，你就能找到它们。它们是其他人小心翼翼绕开的问题，是别人想要回避的令人不适的话题。当然，不去指出大问题或提出追根究底的问题，会更容易、压力也更小。但当你成为那个勇敢地指出房间里显而易见的大象的人时，你就会成为那些无言者的杰出救星，敢于大胆提出别人从未问过的问题。\n\
  \n你会被注意到。\n\n有一点告诫：你不想被视为在提出一个无关紧要的问题。在就一个察觉到的大象问题去找老板之前，先和其他人核实，确保你的看法是准确的，并且确实存在一个大象般的问题。然后，假设这是一个需要解决的大问题——这正是我的核心观点——主动提出成为解决方案的一部分。因为仅仅是发泄情绪或询问问题而不提出任何行动建议，只会降低你的声誉，并让大象变得更大。\n\
  \n## 以“有想法且能执行”的人而闻名\n\n有好主意的人并不少；但有好主意并能付诸行动、取得成果的人却非常稀缺。在竞争激烈的初创市场中，想出新点子*并*执行好主意的能力，可以同时推动你的职业发展和公司成长。\n\
  \n伟大的想法总是降临在那些始终保持开放思维的人身上。把想法视为你在初创环境中成功的命脉，在这个环境中，创新和创造力对于生存和保持领先至关重要。通过提出诸如此类的问题来激发你的创造性思维：“有没有更好的方法？”“为什么我们不能那样做？”“如果我们改这样做会怎样？”让自己身边围绕着对相同话题感兴趣的人，并挖掘他们的想法来激发你自己的思考。我发现，简单的想法往往胜过复杂的想法。通常，执行一系列较小的想法比等待那个难以捉摸的下一个伟大想法更有价值。\n\
  \n诀窍在于给你的思维留出空间，让放松的创造力流动起来，从而使原始想法形成可执行的方案。找到你自己最适合的安静时间，进入创意生成模式，并经常这样做。对我来说，最好的想法往往在我早晨刚醒来或在海滩上跑步时飘入我的脑海。\n\
  \n大约在2000年，我一直对网络安全感兴趣，而且反复听到IT安全专家被各种安全产品持续不断的警报淹没。我开始在海滩上奔跑，双脚在沙滩上敲出节奏。我想到了与有影响力人士的对话、研究过的解决方案，以及了解到的现有方案为何无效。然后一个想法涌上心头：我们可以捕获并整合各种警报，汇集成一个有意义且可操作的统一仪表盘！\n\
  \n在那一刻，我本可以选择把这个想法记录在日志里，然后继续忙碌的生活，让它停留在那里。或者我可以决定去执行这个想法，让它变成现实。我看到了它巨大的潜在价值，于是进一步深化这个概念，花了大量时间制定商业计划。我找到了一位企业家来投资，组建了团队，并在2003年推出了eSecurity——第一家为市场提供安全信息/事件管理解决方案的公司。它后来成长为一家价值数百万美元的公司，而这一切都始于我专注于解决一个问题，为想法流动创造思维空间，然后对最好的想法采取行动。\n\
  \n每10个粗糙的想法中，可能会有一个闪耀的宝石浮现出来，值得实施。当然，在你尝试之前，你永远无法100%确定哪些想法是出色的。话虽如此，你还是可以通过一些方法来判断你的想法处于从废品到宝石的哪个梯度上。\n\
  \n首先，如果你知道这个想法的衡量标准，你就能对其质量有所感知。以营销为例，如果你了解目标受众是谁、他们通常回应什么或不回应什么，就更容易判断一个想法是否有潜力。了解这些，会让你更容易看清你的想法适合哪里。\n\
  \n其次，你可以测试你的想法。这既可以是外部的，针对特定的目标受众（例如，举办焦点小组），也可以是内部的，比如把你的想法拿给同事评估。注意你得到的反应。此外，投入与风险成比例的测试时间。如果你的想法是一场需要大量投资的豪赌，那么在全力以赴之前花更多时间测试是明智的，反之亦然。\n\
  \n最后，做一次直觉检查。有时你会感觉到某个想法确实很好，如果发生这种情况，就去追随它。你仍然应该查看衡量标准、进行测试并完善你的想法，但倾听自己、相信直觉也很重要。\n\
  \n太多伟大的想法因不作为而枯萎。如果你有一个想法，无论它有多好，如果你不采取任何行动，它就不会有任何结果。所以，如果你有那种感觉或预感，即使在职业生涯早期，也要创造机会与上级分享你的想法。当然，要有策略地去做，但永远不要因为害怕别人会认为这个想法很蠢，就压制你深信不疑的东西。不分享一个好想法的代价，远远超过把它藏在心里的风险。\n\
  \n\n\n\n"
- '# 第五章 像领导者一样行动


  ## （即使你还没有头衔）


  > 唯一能像领导者一样思考的方法是先行动起来：把自己投入到新的项目和活动中，与各种不同的人互动，并尝试不熟悉的完成事情的方式。

  > ——赫尔米尼亚·伊巴拉，教授，《像领导者一样行动，像领导者一样思考》的作者


  问一百个商界人士成功的领导力是什么样子，你会得到一百种不同的答案。或许有些重叠，但事实是，领导力是最难以定义的人格特质之一。无数人耗尽心力试图捕捉成为一名伟大领导者的真正含义，而在众多提供建议的竞争声音面前，很难知道该去哪里寻找。在我的经验中，我发现五种基本习惯和特质是我作为领导者发展的绝佳起点。它们帮助我迅速从基层晋升到
  C 套房，我现在很兴奋与你分享它们。它们是：设定明确的目标，对其进行优先排序，在混乱中保持冷静，做出基于事实的直觉决策，并始终努力赢得你的地位。


  ### 设定清晰、有启发性的目标


  没有人能在没有宏伟目标的情况下达到崇高高度。如果你想领导，那么你的目标就必须激励你每天早晨跃出床外，全力以赴。对于一个目标来说，无论是应用于项目和计划、健康和健身、人际关系还是你的职业生涯，要真正可实现，你必须给予它这种程度的热情。


  太多人因为让日常工作的惯性分散了对最大梦想的注意力，而困在低层级职位。没有更大的目标去努力，岁月流逝，你有风险一事无成。如果你不设定目标，那么默认情况下，你的职业目标就仅仅是熬过又一天。不要让这种情况发生在你身上。利用与初创公司合作的机会，设定能激励你的宏大目标。


  我可以百分之百确定，如果我没有先设定目标，然后在自己力不从心时向值得信赖的顾问寻求指导，我就不会取得任何伟大或鼓舞人心的成就。我职业生涯中取得的一切成就都来自于设定清晰、具体的短期和长期目标，并有一个驱动我的整体“为什么”。


  ### 目标设定的三大支柱


  并非每个目标都是一样的。如果你想看到成果，就要掌握制定目标的技巧。我确定每个好目标都建立在三大支柱之上：具体性、相关性和竞争性关注。缺少其中任何一个，你的目标就会崩溃。


  **具体性**意味着在目标的措辞上要精确。“我将比去年卖得更多”不是目标，只是一堆模糊的空话。“我将在接下来的三个月里每月多卖 15%”才是具体的目标。


  **相关性**意味着每个目标都应该难以实现并且直接适用于你的职业和道路。如果你目标定得太低，你的表现就会不佳，永远达不到你的潜力。那么，这里的问题是：你敢于完成什么样的工作会带来最多的快乐和满足感？哪个仅仅是想法的目标如此令人兴奋，以至于它让你热血沸腾？把你的重大成就想象成你保证会成功的情况。我喜欢问团队，如果我们再进一步，成功会是什么样子，我称之为“目标加一”。对你所有的目标都这样做，它们就会变得相关。


  最后，**竞争性关注**意味着你始终努力保持领先优势。关注竞争对手在做什么，并根据他们的行动设定你的目标。


  当然，无论支柱多么坚固，任何目标如果没有基础都会崩溃。那個基础就是为什么，是驱动你的动力。如果你不理解你为之努力的更大目的，你就不会取得任何成就。在设定目标时，给自己留出空间和时间来思考驱动每个目标的为什么。


  ### 小步前进


  一旦你设定了目标，执行它们的最佳方式就是将其分解为小步。我用来将目标分解为步骤的系统始于以下问题的提问：


  - **什么**是你具体想要实现的目标以及途中的里程碑？

  - **谁**参与其中，他们的职责是什么？

  - **哪些**资源将是必需的？

  - **如何**衡量进展以保持正轨？

  - **何时**实现目标？


  例如，假设我为我的营销团队设定目标。对于“什么”，我会设定关于营销需要为收入增长贡献多少的非常具体的营销指标。但更深层次的是，我从跨结构角度来看，并问销售团队需要创造多少收入。我设定非常具体的里程碑，比如我可能会说每个销售人员每月需要进行
  50 或 100 次电话，而营销团队需要在一周内推出新的网络广告。然后我转向“谁”，并首先弄清楚我们可以在内部完成什么，需要外包什么。然后，对于“哪些”，我评估我们需要的资源——诸如材料、金钱和时间之类的东西，但我再次尽可能具体。对于“如何”，我制定人们如何报告结果的计划，并建立会议时间表以让每个人保持更新和了解。最后，对于“何时”，我创建一个主时间表，再次尽可能详细地说明每个个人截止日期和里程碑。正是因为我对目标如此清晰，并在全程保持对每个人的问责制，在
  Thycotic，我们才能够避免任何重大失误。在我任职的每个季度，我们都实现了收入目标，而且很多时候，我们还超额完成了。


  这引出一个重要观点。要成功，你不能只关注你自己的个人目标。即使你只是起步，被视为一个帮助确保项目、团队和工作场所目标清晰且有启发性的人会更好。我曾参加过会议，一位睿智的人举手问道：“我们为什么要做这件事？”因为目的不明确。如果你没有一个分享工作背后鼓舞人心目的的领导者，请主动向他或她询问那个大的“为什么”——即使在会议之外，喝杯咖啡时。这就是有潜力的领导者如何提高每个人的动力，与老板建立有意义的关系，并在初创公司领域脱颖而出，成为潜在的领导人才。


  ### 保持目标在视线内


  我之前提到过的道格·欧文说：“当我与一群人交谈时，我会说，‘这里认为你是一个目标设定者的人，请举手。’每个人都举手。我说，‘保持举着。现在你们中有多少人写下那些目标？’然后一半的手放下了。然后我说，‘你们中有多少人写下那些目标并张贴出来以便看到它们？’然后大多数的手都放下了。”欧文说，那些手仍然举着的人就是他想要雇用的人，因为他们是那些不断专注于他们应该关注的事情的人。“你必须对你的目标极其激光般地专注。我不只是说把它们放在你的
  iPad 或手机上。你需要把它们贴在你面前。”


  换句话说，它们需要可见。当我在欧文手下的 PentaSafe 工作时，他创造了我见过的最有力的视觉目标。就在 2000 年之前，初创公司正在为大年做计划，我们需要招聘大约
  15 名销售人员，以便他们在 1 月准备就绪。欧文召集了一次公司会议，在指定时间，我们大约 50 人走出到我们建筑物前院。欧文坐在我们面前台阶上，他叫上销售员埃里克坐在前面的凳子上。欧文宣布埃里克刚刚完成了我们公司第一个百万美元订单，埃里克的佣金是
  28 万美元。


  正好在此时，一辆 Brink’s 卡车开过来，两名武装警卫下车，把 28 万美元的十元和二十元钞票倒在埃里克头上。欧文说：“这就是 28 万美元的样子。”然后他告诉大家，他将支付给每个人的所有奖金加起来也将达到另外
  28 万美元。每个人都在拍照、录像并在线发布。警卫把钱放回卡车，我们都回到室内，而脑海中满是钱堆的景象。得益于员工在线发布，我们在接下来的两天内收到了超过 100
  份销售人员的简历。吸引优质申请者是欧文创造这个难忘视觉的目的之一，但我保证那天销售团队的每个人都对下一个销售目标有了清晰的画面，并对等待他们的奖励有了强烈的感受。把你的目标放在你面前，并在可能的情况下，为它们附上具体的图像，这样你就能看到自己正在走向什么。


  ### 关于目标的最后思考


  当你第一次为自己设定宏大目标时，你可能会感到某种焦虑或恐惧。这是自然的——你可能会怀疑自己实现所设目标的能力。重要的是要记住，设定宏大、有启发性目标的一些最佳好处并不仅仅在于实现。有时我们没有达到




  我们的宏大目标，或者我们换挡并调整到新的目标。这是可以的，因为仅仅追求一个宏大目标就能提升你的专注力，拓展你的能力，并帮助你成长。


  ## 并非一切都能成为高优先级


  > 重要的事情绝不能受制于不重要的事情。

  > ——约翰·沃尔夫冈·冯·歌德，德国作家和政治家


  设定清晰的目标还能带来另一个回报：它提供了一个标尺，帮助你决定什么该说“是”，什么该说“不”。在紧张的初创环境中，很容易被太多目标压垮，因为它们看起来都像是高优先级。不要忙于追逐所有散乱的目标，以至于无法建起围栏。集中精力于那些能解决最大问题、创造最佳成果、并能让你最快、最远推进的目标。


  在我职业生涯早期，我曾把目标打字出来并打印成一份长长的清单放在面前。光是看着它就让我焦虑不安。我不知道从何开始。我向我的经理求助以便进行优先级排序。我把清单递给她，心里半以为她会为我愿意承担如此巨大的工作量而印象深刻。我以为她只是会把它们重新排列得更好。我们花了大约30分钟讨论这些目标，在此期间，她划掉了我大约一半的目标。她告诉我，如果我试图全部完成，我只能在每个目标上花费微薄的时间，结果也会同样微薄。我会在各个方向上只前进一英寸，却无法走出一英里。这堂关于优先级的课改变了我的生活。


  高绩效者，就像我当时认为自己那样，往往会承担巨大的工作量。这是有责任感的人的DNA的一部分，我很尊重这种特质。但这也可能造成巨大的压力，并导致长期倦怠。我学到的是，你可以在不感到不知所措的情况下成为高绩效者，只要你对目标进行优先级排序。成功不在于你做了多少。成功在于你朝着正确的目标采取正确的行动，从而创造最大的影响。


  关键在于转变思维模式。这不仅仅是做比别人更多——在充满超常表现者的高度竞争领域，这几乎是不可能的。让你脱颖而出的，是取得比别人更好的成果，而最好的实现方式就是进行优先级排序。我个人很喜欢Facebook首席运营官谢丽尔·桑德伯格提出的“无情的优先级排序”理念，她将其定义为“只专注于最好的想法。这意味着列出你清单上的10件事，如果你不能全部完成，就把前两件做得非常好。”¹


  我为无情的优先级排序创建了一个框架，这也是我30年执行领导力的流程。我首先创建一个年度主目标清单（我在每年年底保留这些清单，有时会重新审视以了解我的目标多年来发生了怎样的变化，以及我完成了什么或选择不完成什么）。我将它们分解为季度目标和每周目标，然后把每个目标归入三个桶之一：A类优先（现在就做）、B类优先（接下来做）和C类优先（不要浪费时间做这些）。从那里，我将A类和B类目标分解为每日任务清单。每天晚上，我会留出时间来规划第二天，并记录我当天要专注的仅有的三个！优先事项。这需要自律，并帮助我专注于最重要的事情，以免被一堆干扰淹没。关键是要对每天能完成的事情保持现实。当我在工作日的清晨黑暗中到达办公室时，我会专注于完成第一个优先事项，然后再进行下一个。这很关键——你不能只是走过场地设定目标，你必须付诸行动。


  我对我的营销团队的目标采用类似的优先级排序流程。我们从我们试图实现的最顶层目标开始。沿用之前的例子，我们团队的第一目标


  > ¹ Jeanne Sahadi，“How Sheryl Sandberg Practices ‘Ruthless Prioritization,’” CNN.com
  (October 3, 2018), https://www.cnn.com/2018/10/03/success/sheryl-sandberg-profile/index.html.


  可能是为公司整体收入目标贡献特定金额的收入。然后，利用上述问题，我们从那里进行分解。我们确保营销团队的每个人都知道自己的角色、目标，以及为了为我们的营销目标和公司的收入目标做出贡献而需要优先考虑的具体任务。


  我们也不会把目标和指标藏起来。我们实时地把它们公布在每个人的电脑仪表板上。我们在Thycotic办公室的公共空间的显示器上展示它们。我们可以在任何时候在手机上调出它们。我们实际上为计划创建了一个管理目标法（MBO）附录，其中每个人的季度目标都被记录下来并与整个团队共享，并且他们会定期报告进展。公司里的每个人都可以看到营销团队如何每天、每季度、每年为我们主要优先目标的收入达成做出贡献。这使我们能够在进行中进行调整，并让每个人都专注于最高优先级的目标，不会浪费时间在无用的工作上。


  在Thycotic，我们的国际高级副总裁Simon Azzopardi，有一种很酷的方式让团队始终关注最大的目标。他的团队覆盖中东、欧洲、亚洲和非洲，并与世界各地的分销商合作。为了保持大家的一致，他通过举办“True
  North”会议并召集多元化团队共同关注最重要的目标和优先事项来树立优先级标准。


  他在多年前一次飞往澳大利亚的16小时飞行中开发了他的True North流程。他坐在飞机座位上思考他最大的挑战，即如何让国际团队的这么多人保持动力并朝着同一方向拉绳。他观看了一段Stephen
  Covey站在满是高管的房间前面的YouTube视频。Covey让大家站起来，闭上眼睛指向北方。然后他们睁开眼睛。每个人指向的方向都不同。他解释说，这种缺乏方向性导致公司浪费了最多的资源，因为每个人都在朝不同的“北方”前进。


  正是这种领导力能够让你脱颖而出，并加速你通往C-suite的道路。


  混乱可能表现为财务灾难、诉讼、品牌失败或突然的坏名声。或者，就像PentaSafe在2008年的情况一样，它可能是一场飓风。


  我们的公司位于市中心大楼的顶层。当飓风艾克袭来时，洪水在下面的街道上涨，城市陷入黑暗。我们所有人都安全，但我们的服务器宕机了。我们在世界各地都有客户，他们依赖我们的服务器来支持他们使用我们的产品。我们认为他们不会意识到或同情我们城市的自然灾害。我们知道我们不能让客户失望，然后就窝在家里享受意外的假期。


  每个人都回家了，但都在线上并制定了远程协作工作的计划。我们管理团队的人驾驭着被淹的街道，聚集在我们的办公大楼，市政府允许我们临时进入顶层办公室。我们在黑暗、潮湿、闷热的楼梯间里步行上25层楼，并多次往返，搬出了我们最关键的服务器和设备。


  我们把所有设备搬到有电的干燥地点，我们的IT团队让它们全部重新连接并启动，以便我们的客户支持能够继续进行。虽然许多休斯顿公司在那一周关闭了，但我们几乎没有中断，继续提供客户期望的同等水平的支持。这归结为在混乱中创造秩序。在愤怒之中，我们有一个沟通流程，以便我们可以制定游戏计划。我们专注于一套优先事项，并把客户放在名单的顶端。


  在另一个缓解混乱的案例中，一名黑客发动了DDoS（分布式拒绝服务）攻击，在季度末我们正试图达成销售数字时瘫痪了我们的网站。再次，冷静主导了局面，我们评估了情况，了解我们需要做什么，并制定了优先事项。表现出冷静、镇定、从容的员工给人留下了



  作为那些在有机会晋升到领导岗位时，能够以稳健的手腕和计划来领导的人。


  你无法控制竞争对手的举动、居心不良的人，或天气。然而，你可以建立正确的原则（个人层面、团队层面和公司层面），以便以有序的方式应对潜在的混乱。


  这并不意味着过度分析所有可能出错的事情，以至于产生恐惧和不堪重负。那是适得其反的——如果你困在思考一切可能不顺利的事情上，你将永远无法完成任何事情。相反，专注于以下六种培养你从混乱中创造秩序倾向的方法，并作为潜在领导者脱颖而出：


  - **1. 拥抱混乱。** 有些人会避开它，而伟大的领导者会迎难而上。他们意识到湍流是飞行的一部分，你必须穿过它。

  - **2. 专注于目的地。** 混乱令人分心且嘈杂。保持对目标方向的清晰。当孩子们学习骑自行车时，他们很快就会意识到必须向前看。如果他们盯着旋转的前轮看，他们很快就会摔倒，而且哭声不会好看。

  - **3. 专注于必须具备的，而非应该具备的。** 首先在最关键和最大的领域建立秩序。

  - **4. 成为榜样。** 无论你目前担任什么职位，或周围的不稳定程度如何，你都可以用明确的目的、决心和冷静感来展示你的领导力。

  - **5. 专业地沟通。** 说话前先深呼吸，不要让情绪占上风。其他人会在混乱之中注意到你所说的话和你的肢体语言。

  - **6. 妥善管理期望。** 人们自然想要采取行动迅速消除混乱。抵制这种诱惑。有时，快速行动只会加剧危机。你无法立即或一举解决每一个危机，并确保你和你的团队意识到这是一个过程。


  ## 做出基于事实的直觉决策


  史蒂夫·乔布斯以违背常规智慧并遵循他的直觉而闻名——显然，他取得了惊人的胜利。但你和我不是乔布斯，所以对于我们这些凡人来说，我推荐一种更平衡的决策领导风格，我称之为“基于事实的直觉决策”。数据必须驱动决策，因为它是逻辑、理性事实集的具体、经证实的证据。与此同时，你需要拥抱乔布斯的一点轻率能量，倾听你肠胃里翻腾的声音。初创公司的竞争优势之一来自于其快速行动的能力，这通常意味着在你拥有全部数据之前，或在数据追上现实之前就抓住机会。陷入分析瘫痪会削弱重要的优势。


  我曾听从直觉并获得巨大回报的一次，是在我担任 Thycotic 的领导者时，该公司是一家在基于云的安全解决方案流行之前就已存在的网络安全初创公司。CEO 和我正在商讨公司是否以及何时将
  IT 安全解决方案的巨大一步迈向云端。我们分析了有关云的所有事实，并采访客户以确定他们对这一想法的舒适度。我们得到的数据不支持转换——它显示大多数客户不信任云来处理他们所有的专有信息。数据显示，最终，虽然不是马上，云会流行且盈利，我们应该在三到五年后再进入这个领域。


  但我们内心有一个声音在低语，*你有一个宽敞的竞争窗口；立即行动。*


  我们听从了，并成为首批提供基于云的网络安全解决方案的公司之一。这一先发优势使我们在云流行时处于极佳的资本化位置，我们的收入飙升。


  > 这让我想起通用电气前董事长兼首席执行官杰克·韦尔奇的观察，他说：“今天最好的高管是能够看到拐角后面的人。[他们能看到]即将发生的事情。不是当你在隧道里时，然后吸取教训并把其余的抛在身后。如果你这样做足够多，并且在自我评价上足够诚实，你会培养你的直觉，这将帮助你在未来做出更好的基于事实的直觉判断。”


  ## 赚取你的军衔


  在军队中，你不会在不付出把一切都押上的努力的情况下获得制服上的军衔。在初创公司中也是如此。你必须每天赚取你的军衔，尤其是如果你想晋升。被视为宝贵资产并不是自动赋予任何人的，即使你带着堆积如山的成功、塞满经验的简历和大量的知识而来。


  对我来说也是如此。当我加入一家新公司时，直到取得几次重大胜利，我从未觉得自己配得上我的头衔。即便如此，我也从未感到 100% 舒适，如果我发现自己在职位上过于放松，我会为自己制造不适。这激励我继续努力工作并向我的队友证明我的价值，我建议你也采用这种观点。


  例如，当我第一次加入 PentaSafe 时，Doug Erwin 邀请我到他家进行私人会面，执行团队在那里告诉我公司面临的挑战。从本质上讲，我们在市场上不够差异化。我设定了一个目标，在前
  100 天内彻底改造公司的品牌、定位、网站和营销材料。从那时起，这就成了我的名片，也是我每次在新公司开始时赚取军衔的方式。正如总统任期的前 100 天是最重要的，我认为你在新工作中的前
  100 天是最重要的。它将为你在公司剩余时间的基调定下基调，并向周围的每个人展示你是什么样的工作人员以及可以期待什么。


  所以，我得到了一支我完全不认识的团队，我进来就说：“我们要改变一切。”他们认为我疯了——认为我们根本不可能完成我想做的一切


  同样，一种很好的脱颖而出并展示主动性的方法是去找你的老板说：“告诉我，我在这里需要做什么来赚取我的军衔。”这会立即让你进入他们的雷达，作为一个致力于提供最佳工作的人。关键是倾听答案并真正付诸行动。当你这样做时，你会在执行团队寻找新领导者时把自己放在队伍的最前面。


  如果另一个人比你受教育程度更高或人脉更广——你如何竞争？通过比他们更努力工作。事实是，拼搏会付出代价。这是持续成功的代价，我认识的每一位成功的初创公司领导者都付出了代价。


  其中一位，Thycotic 国际团队高级副总裁 Simon Azzopardi 说，努力工作在他的初创公司旅程的每一步都增强了他的成功。他职业生涯早期读到关于约翰·D·洛克菲勒的故事，激发了他的想象力。被问及“多少钱才算够钱？”时，这位大亨回答：“再多一点。”Azzopardi
  采纳了这种心态并将其应用于他的工作态度。他说：“多少工作才算够工作？再多一点。我始终努力让我们多实现一点的能力极大地帮助了我在这个初创世界中。你必须自我激励。没有人每天给你‘好样的’。这需要努力工作，当事情失败时很难，但当事情成功时，努力工作和额外付出都是值得的。”


  这一特质如此重要，以至于它已成为我每次晋升或招聘时主要寻找的东西之一。早期，我的一位导师告诉我要用工作马填满我的团队，而不是表演马。最终最成功的人并不总是房间里最聪明的人——他们几乎总是工作最努力的人。


  我很幸运，因为我一生都是一个努力工作的人。很多人，尤其是年轻人，抱怨并声称他们只是不努力工作。事实是，通过练习，任何人都可以培养这种特质。怎么做？以下是成为努力工作者的四个关键。


  - **1. 通过优先排序来聪明工作。** 很多人说，“聪明工作，不要努力工作。”我同意其中的一半。没有理由你不能既聪明又努力工作，第一步是减少干扰，只专注于重要的事情。你知道什么是在浪费时间：不必要的电子邮件、不必要的会议，以及与实现目标所需结果无关的活动。对小而无影响的活动的忙碌工作是成功的头号障碍。





  不要陷入在无意义的事情上辛苦工作的陷阱。让你的每一分辛苦都物有所值。


  2. **时刻把你的首要目标和优先事项放在眼前。** 制定小而可实现的目标，并将其与具体的截止日期挂钩，这样你就能感受到自己的进步。完成目标会上瘾，它会把辛苦工作变成一种习惯。


  3. **找到能让你发挥最大效能的习惯。** 我认识的一些人工作效率最高的方式是设定计时器，承诺高度专注一小时，然后给自己10分钟的休息时间，再进行一小时的专注。我发现我做得最好的工作是在清晨，所以我确保起床、锻炼，并在黎明前进入办公室。找出最适合你的模式。


  4. **最后，庆祝你的辛苦工作。** 花时间认可你所取得的成就。每天结束时，写下你完成的一切清单，这样你就能对自己负责，并看到自己的自律和生产力。经过一次成功的辛苦工作后，用你自己的奖励来犒赏自己，无论什么能让你开心。认可并庆祝与你一起工作的他人。


  当然，与远程工作相关的一整套不同的挑战，无论是对员工还是管理者，都存在于初创公司世界中很常见。远程团队环境放大了领导力挑战，因此管理者需要一套指南、问责制和信任的结合，相信远程团队成员的工作强度与现场人员一样。最好的领导者会建立个人关系，尽可能多地了解他们的远程员工。他们不依赖电子邮件进行沟通，而是使用技术工具进行虚拟会议、即时消息和文件存储，以为每个人创造顺畅的流程。


  如果你正在考虑远程工作，首先要与自己进行一次诚实的对话。你有纪律把家庭办公室当作传统办公室一样对待吗？按时起床并消除干扰？有些人能做到；有些人不能。如果你做不到，并且尝试在家工作，你会通过在短期内限制你的效率来束缚自己的职业生涯。


  无论你是在家工作还是在办公室工作，初创公司工作的一大好处是它不是朝九晚五的工作。它比拖着自己去办公室然后在五点准时逃离要更有回报和更令人兴奋得多。但与此同时，这也意味着你不会只从九点工作到五点。你会有很长的工作时间，特别是如果你想出人头地并成为公司的领导者。令人难以置信的是，在合适的初创公司工作时，甚至感觉不到工作时间很长。我刚参加了
  PentaSafe 的聚会，庆祝公司被出售 15 周年。这是我推动团队如此努力工作，以至于他们制作了 “我挺过了与 Kahan 的一个季度” T 恤的公司。然而，当我们聚在一起，回想那些年时，我们谈论的全部是当时我们的辛苦工作感觉不像工作，甚至一天也不像。


  ## 展示你了解你的客户


  在亚马逊的公司会议上，CEO 杰夫·贝佐斯会在会议桌上留一个空椅子，并告诉与会者它被“房间里最重要的人”——客户——占据。然后，他用一系列指标来支持他的讲话，其中
  80% 都集中在客户关心的事物上。你不必是创始人兼 CEO 才能借鉴贝佐斯的策略。了解客户将帮助你的公司更好地投资时间和金钱，快速找到问题的核心，改进你的产品或服务，并测试想法。


  当你在公司中晋升时，特别重要的是记住这一点。一般来说，你在公司阶梯上越高，与客户的接触就越少。这意味着，通常做出最大决策的人，往往对客户想要什么的了解最模糊。当我在
  PentaSafe 时，Doug Erwin 通过创建一个要求管理者每年两次、在两周的时间范围内联系五到七名客户并向他们提出五个关键问题的项目来对抗这种情况。问题是：


  > ¹ Bob Thompson，“Take a Tip from Bezos: Customers Always Need a Seat at the Table,”
  *Entrepreneur* (May 28, 2016), https://www.entrepreneur.com/article/234254.


  1. 在 1 到 10 的量表上，10 表示极度满意，请告诉我们您有多满意。

  2. 根据上面的答案，请提供原因。

  3. 我们的产品是否有助于您实现目标？

  4. 我们如何改进？

  5. 您会向同事推荐我们的产品吗？


  我们收集完数据后，管理者会在半天的会议中向彼此展示结果。每次，我们都会发现对客户感到兴奋和沮丧的本质洞察。当然，世界上最有价值的洞察如果不采取任何行动就毫无意义。客户讨厌敷衍了事，太多的公司会投入大量资源进行数据收集，却让数据积灰。我们记录了反馈，选择最重要的项目，我们将采取的步骤，以及谁将负责。


  我们没有就此止步，而是完成了反馈循环。会议后，我们确保跟进客户，并告知他们我们是否选择调整产品或流程作为结果，以及为什么或为什么不这样做。这向我们的客户表明我们正在关注他们。


  因此，如果你想在刚加入初创公司时脱颖而出，就寻求更好地了解客户需求。在计划收集他们的反馈时，了解你试图实现的目标；准备能引出诚实、有价值意见的问题；确定合适的客户；增加反馈循环；并准备好采取行动。以下是收集客户反馈的想法：


  - 主动采访他们。

  - 发送客户调查。

  - 参加你公司的研讨会，以便你能见到客户。

  - 创建焦点小组或客户顾问委员会。

  - 在社交媒体上寻求意见。

  - 去客户常去的地方并认识他们。


  所有这些活动在初创公司中都更容易进行，因为没有那么多政策或规则的层级需要绕开。一旦你有了数据，就用它来开发新想法并与你的经理和主管分享。这将表明你是一个有动力的自发者，一个主动且富有创造力的思考者，准备好晋升。


  虽然上述举措是一个很好的开始，但不要将你的分析局限于你已有的客户。扩大你的定义，以包括潜在客户以及内部客户。内部客户通常是你所从事工作的第一个下游使用者。例如，当我的营销团队制定计划时，我们的第一个下游使用者是我们的内部销售代表。通常，这些人是你关于工作的最有价值的反馈来源。花时间从他们的角度体验你的产品或服务。问他们需要什么以及期望什么。这开启了一个双向对话，你也可以让他们知道你对他们的期望和需求。更牢固的内部联系总是会带来更好的结果。


  当我在欧洲关闭一笔巨大的交易时，这只发生是因为我花时间去了解一位潜在客户。我们与一家大型潜在客户 ABN AMRO Bank，位于阿姆斯特丹，已经合作了近两年。几乎整个时间里，交易似乎都快要成交了，但还没有成形。在伦敦，我开始参加
  Luke Brown，我们的销售代表，与 John Vincent，ABN AMRO 的决策者之间的会议，以了解潜在客户。我们进行了数月的会议，这使我能够做两件事：（1）对
  ABN AMRO 的业务需求形成清晰的理解，（2）与 John Vincent 建立牢固的个人关系。由于会议几乎没有推动进展，我决定是时候利用这两个优势了。


  Luke 和我知道 John 在伦敦的某个时间在两栋建筑之间行走。我基本上在前面的一家咖啡馆里蹲守



  在那些大楼旁，我等待着。我的想法是，可以在非正式场合与他交谈，就这笔交易进行一次坦诚、私人的对话。事实也正是如此。我在拥挤的人行道上追上他，基本上是这样说的：“约翰，你看。你我都知道，这笔交易对我们双方来说都是巨大的双赢。我们在这件事上已经拖得太久了。你能向我个人保证，你会把它办成吗？”他做出了承诺，果不其然，在那之后不久，交易就达成了。如果我不是对这笔交易的商业利益有透彻的理解，并且与约翰有坚实的私人关系，这一切就不会发生。如果你也专注于对潜在客户的需求建立同样的理解，你将在创业界脱颖而出。


  ## 成为解决方案的一部分


  如果你不是解决方案的一部分，那你就是问题的一部分。你可能听过这句话，但这句话在创业环境中比其他任何地方都更贴切。创业公司快速变化的本质意味着，相比成熟公司，创业公司会出现更多问题和意外。事实上，正如*《企业家》*杂志所指出的，创业公司本质上就是“寻找问题来解决的公司”。²
  要在创业公司中成为一名成功的成员，你需要是那种主动寻找问题去解决的人。关键在于你的心态——如果你是一个消极的人，问题似乎令人沮丧；但如果你保持积极态度并专注于寻找解决方案，它们就会变得令人兴奋。


  > ² 阿里·贝赫什提，《别去自找麻烦：解决自己的痛点才是开发新产品的良方》，*《企业家》*（2018年3月19日）。


  例如，我的一位同事负责竞争情报，他打电话抱怨销售团队无视他的报告，因为他的信息经常过时。他非常沮丧，干脆完全避开销售团队。我没有跟着抱怨，而是告诉他要转变思维，去寻找解决方案，而不是仅仅抱怨问题。我建议他组建一个核心小组收集最新情报，并让销售团队参与数据收集过程。我告诉他把这当作一场竞赛，看谁能提供最相关、最及时的新闻快讯。他喜欢这个解决方案并付诸实施。这带来了巨大回报，他也能提供准确、及时、可用的竞争情报了。一周后，包括销售团队在内的所有人都对他赞不绝口。


  我们每个人每天都面临大大小小的问题，无论是工作中还是生活中。有些人会从“火情”旁径直走过，指责他人，抱怨连连，找借口，或者无视情况，希望别人来接手。显然，这不是好的领导风格。另一方面，如果你把问题当作一个又一个有趣的挑战，你会在事业和生活中走得更远。


  这也不是说，你需要像在电子游戏里那样解决路上遇到的每一个问题。如同设定目标一样，最好对问题按优先级排序。针对每个问题，问自己三个问题：


  - 这个问题有多棘手？

  - 它多久发生一次？

  - 解决它有什么好处？


  然后，根据这些标准，把时间花在创造解决方案上，解决那些排在前列的问题。


  这种思维转变是成为更好的问题解决者的第一步，但不是最后一步。大多数问题你无法独自解决，所以要向你尊敬的人寻求意见。估算解决问题需要哪些资源以及需要多长时间。要意识到问题往往需要时间才能解决。当变化没有立即发生时，人们很容易陷入被动。坚持住并不断前进需要毅力。当然，解决问题的最好方式是从源头上预防。用你的直觉预测可能出现问题的地方，并主动采取措施确保它们不会发生。


  最后，请允许我与你分享一个寓言。一个人在河边钓鱼，突然注意到有人溺水。他把那人拉上来并尝试进行急救。没过多久，他又发现河里有一个人，也救了上来。接着一个又一个，一个又一个。很快他精疲力竭，意识到自己救不了所有溺水的人。他沿着河往上游走，想弄清楚为什么这么多人掉进河里。他看到是一座断桥导致了问题。于是他决定索性把桥修好。³


  ## 关注细节（但不要成为控制狂）


  我的一位同事曾花了数小时准备一场精彩的演示。他完成了所有研究，制作了精美的 PowerPoint，并练习了好几个小时。会议当天，他到场后拿出笔记本电脑，可打开时，电脑毫无反应——电池没电了。他在包里翻找，却无济于事：他把充电线落在了家里。所有努力都白费了，我们最终只能盯着空白屏幕。


  这种事我们所有人都遇到过，包括我在内。人们很容易只看表面，以为一切都在正轨上；也很容易过分关注大的想法，以至于忘记给笔记本电脑充电。


  防止问题发生的最佳方式就是永远不要忽视细节。每个项目的成功都依赖于其更小组成部分的成功。


  在更大的企业界，最高层级的员工有一大群助理替他们处理所有细节。而在创业公司里，没有谁的职位高到可以无视对自己工作至关重要的细节。在每一个层级，每个人都需要自己制作演示文稿，自己练习，并记得带上自己的电源线。如果你没有以关注细节著称，你永远无法达到最高层级。


  通常，关注细节能让你找到有创意的甚至是从源头解决问题的方案。例如，在我过去创办的一家创业公司，有成千上万个电话打入我们的呼叫中心。随着呼叫量增加，等待时间变长，客户满意度下降。我们花了很多时间专注于缩短通话时间，以应对增加的呼叫量。然而，直到我们仔细审视了所有细节，才看清问题所在。我们首先问为什么会有这么多电话。这些电话是关于什么的？我们的产品质量或易用性有问题吗？我们发现了一个重大的产品问题，于是必须让开发人员和质量保证团队参与进来修复问题，然后为客户提供自助式培训服务。如果我们当时继续只停留在表面，就永远无法理解呼叫量激增的真正原因。


  进行这种层面的分析可能很复杂。深入细节需要时间和额外的精力。但多关注细节会提高效率，将错误风险降到最低，并让一个好结果变成卓越结果。除此之外，把小事做好很重要，因为即使是小错误也会对你的声誉、成果以及整个业务产生重大影响。我的一位朋友曾在一家大型公司工作，该公司将使命、愿景和价值观印在光亮的全彩卡片上。他们在年度会议上分发给数百名高管，并邮寄给全系统数千名员工家中。卡片发出后，几位领导注意到上面有一句话：“我们做的每一件事都追求卓越。”
  是的，是“每一件事”（原文误拼为''everyting''）。尽管卡片的概念、目的和设计都很精美——这个被忽视的小细节却是一个代价高昂的错误，导致重新印刷、重新邮寄，并要从尴尬中恢复过来。


  要成为一个注重细节的人，就要多问问题，用清单来追踪细节，审计项目，并征求他人的反馈。当然，有些人天生就不注重细节。如果你属于这类人，仍然要尽己所能去养成注重细节的习惯；但如果做不到，那就确保你身边有这样的人。


  一个重要提醒：关注细节与事无巨细地微观管理、控制欲强不是一回事。我和许多控制狂共事过，简单说吧，他们在创业公司环境中待不长。因为你根本不可能拥有那么多控制权。





  我认识一位经理，她会告诉她的团队：“如果老板联系你，我希望知道这件事。”这传递出一个信息：她不信任她的团队去说正确的话或妥善处理情况。当你的团队感觉不到你的信任时，会破坏你试图实现的一切。他们会产生怨恨，对你、对自己以及团队实现目标的能力失去信心。


  当然，起初，你可能甚至没有机会成为一个控制狂老板；你可能会处于某人的显微镜之下。如果发生了这种情况，你的目标应该是建立一种关系，在这种关系中，你自己也要树立良好的领导技能。首先，主动明确关系中的沟通期望。询问你应该多久分享一次状态更新，以及详细程度如何。倾听老板想要什么，但不要害怕清楚地告诉他们你最适合在什么样的环境中工作。例如，你可以说：“没问题，我可以交付每周报告，但如果我有成功的自由和一定的自主权，我的工作效率会最好。”一旦你和老板达成一致，就把协议记录下来并发送给老板。这样，当老板变得专横和控制欲强时，你可以拿出协议并说：“这是我们同意的合作方式。你信任我做正确的事情吗？”


  一旦你在初创公司晋升并开始领导自己的团队，重要的是在对团队保持关注和可获得性与过于专横之间取得正确的平衡。道格·欧文（Doug Erwin）会特意与各个层级的员工交谈，以了解前线发生了什么，但他不相信突击检查——他在到员工办公室之前会提前几步大声说话。然后他会坐下来与他们交谈，目标是建立关系，而不是评估绩效。与此同时，他学到了宝贵的细节，这些细节会为他的高层决策提供信息。他正在学习各个领域的业务运营细节，以便像优秀的领导者一样将其用于生产性目的。


  ## 通过简洁创造价值


  > 简洁是终极的精致。

  > ——列奥纳多·达·芬奇，意大利文艺复兴时期博学家


  奥卡姆剃刀指出，在所有条件相同的情况下，最简单、最直接、步骤最少的解决方案通常是任何问题的正确答案。700多年后，奥卡姆的格言今天比以往任何时候都更真实，尤其是在初创公司世界。能够将复杂情况简化的人将是房间里最有价值的人——尤其是在科技初创公司，它们以难以置信的速度处理高复杂性的概念。一次又一次，我看到人们陷入创建复杂、错综复杂的计划，这些计划从未实现，并使他们的职业生涯停滞不前。虽然复杂性和细节有其位置，但更常见的是，最佳、最优雅的解决方案将是最简单的解决方案，而那些能够剔除不必要的东西并首先专注于简洁——弄清为什么、问题的核心、本质——的人，展现出清晰的领导力。


  要最有效，你对简洁的承诺不能只是矛尖。它必须在每一步都编码到你的DNA中。当我在Quest Software工作时（后来被戴尔收购），我们利用简洁来区分自己。我们的所有产品都很简单、用户友好，且没有太多附加功能。这很棒——在科技世界，常常是装满花哨但无用的铃铛和口哨的笨重软件最终会失败。


  然而，我注意到，出于某种原因，我们并不总是 outsell 那些拥有更笨重、更不优雅软件的竞争对手。我意识到，虽然我们的产品可能更简单，但这只是商业合作的一个方面。在业务的每个其他领域，我们都有大量的低效复杂性。如果我们想成为简单的解决方案，我们需要在从上到下的一切上都更简单——合同、定价、网站、客户支持、安装——在每个层面。


  我提出成立一个跨职能的简洁工作组，我的CEO不仅同意，还参加了会议。我们仅仅通过简化就将我们的工具和流程转变为顺畅的体验。我们让客户更容易尝试、购买和体验我们的产品。我们改造了客户支持门户，以便他们可以快速自行解决产品问题。结果是立竿见影的，并改善了底线。


  应该说，这个过程并不容易。几乎科技界的每个人都追求简洁，但这是一个几乎不可能的目标，因为复杂问题很少有简单的解决方案。我们之所以成功，是因为我们对我们试图解决的问题有清晰的理解——我们没有使情况复杂化，也没有躲在流行语后面。我们确保我们确切知道要修复什么，然后去做。这是我对追求简洁的
  aspiring 领导者的建议：定义问题，然后建立一个框架和战略，利用简洁作为竞争优势。


  ## 坚持并保持耐心


  > 比别人多坚持一秒钟。

  > ——道格·欧文，RedHouse Associates 主席兼负责人


  坚持是复合式努力的魔力。我与之合作的所有强大的初创公司领导者中，统一的特质是坚持。他们都将失败视为暂时的障碍和学习机会。他们不会因此气馁；相反，他们坚持并找到新的解决方案。


  培养这种特质将在你职业生涯的每个阶段受益于你。例如，作为一家初创公司的营销负责人，我看到了合作竞争的绝佳机会。我意识到我们可以将我公司的技术与另一家公司的技术配对，为两个客户群体提供独特的、改进的解决方案。我怀疑这种合作会带来更高的收入，但我不仅仅凭直觉。我通过分析师和我们一些关键客户验证了我的前提，并着手向另一家公司的执行领导提出我的想法。


  我撞上了一堵大而沉默的水泥墙。我询问了共同联系人，打电话给他的助理，在会议上接近他，留言，并每月发送一封电子邮件，持续六个月。


  我不想打扰他，但我知道他只有在我能直接与他联系时才会考虑我的想法。我继续坚持。我的坚持和耐心得到了回报。我有一天早上7点打电话给他，这次他接了。我们都笑了，虽然我的笑更像是紧张的笑，因为我以为他会生气。我请求60秒，以便简洁地描述我的愿景。这里就是准备工作的辛苦付出得到回报的地方——我无数次排练过这个想法的推介。


  它奏效了。他很感兴趣，并邀请我在下周到他的办公室与他进行一次一小时的会议。在那次会议上，我在他窗户上画出了我们联合解决方案的图片，以及它将如何给我们带来“不公平的优势”。（他的公司使用窗户而不是白板。）我像这样为他勾画出来，在湛蓝的天空的美丽映衬下，他看到了我想法的高雅，我们付诸行动。


  令人惊讶的是，这比我预期的更令人印象深刻地得到了回报。一个多月后，他的公司以一个不错的倍数收购了我们的初创公司。如果没有我的坚持，这次成功的退出永远不会发生。


  在她为《Inc.》杂志撰写的文章中，罗宾·卡马罗特（Robin Camarote）称坚持是定义高影响力领导者的三个特征之一（另外两个是激情和善良）。我认为她的理由是启发性的。她写道：“坚持的领导者知道没有什么东西总是有效，或者，如果有效，他们玩得太安全了。坚持就是设定目标——大目标——并以不寻常的驱动力和专注力追求它们。坚持至关重要，因为每个人在职业生涯中不可避免地会在某个时候被击倒、被拒之门外、被忽视或被冷落。坚持……使高影响力领导者一次又一次地站起来。”简而言之，你需要坚持，因为如果你没有被击倒，你就不是在努力达到足够的高度。






  坚持几乎总是会得到回报。 要么你会得到你所追求的目标，要么在寻找它的过程中，你会学到宝贵的经验教训，或找到一个更好的解决方案。 在初创公司中尤其如此，公司在起步阶段可能会尝试四五种不同的策略来寻找自己的定位。
  在这个世界里，你可以拥有世上所有的才华，但如果你在遇到第一个小挫折时就放弃，那一切都毫无意义。


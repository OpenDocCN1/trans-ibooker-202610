- "# 第7章：谨慎选择你所交往的人\n\n> 如果你是一个房间里最聪明的人，那么你就在错误的房间里。\n> ——洛恩·迈克尔斯，电视制作人\n\n我们是谁以及我们在商业和生活中表现如何，很大程度上取决于我们交往的人。\
  \ 如果你让自己周围都是聪明、敬业、努力工作、有创业精神的人，那么他们的特质会开始在你身上显现。 他们会激励和挑战你，你也会随之成长。 更妙的是，当其他人看到你与这些高绩效者为伍时，他们会通过关联把你也看作高绩效者。\
  \ 如果你让自己周围都是平庸者，情况则恰恰相反。 本章概述了你需要了解的关于如何挑选你花费时间的人以及建立这些关系最佳方式的一切。\n\n## 让自己周围都是A+人才\n\
  \n企业家吉姆·罗恩说过，“你就是你花费最多时间相处的五个人平均值的总和。” 如果这是真的（我相信是），你就必须问问自己，如果你把大部分时间都花在那些困在底层的人身上，你怎么能达到C-suite？\
  \ 没有人开始职业生涯就知道成功所需的一切知识——我不知道，我认识的人中没有人知道，甚至比尔·盖茨也不知道。 最快学会这些重要教训的方法之一就是让自己周围都是取得了与你想要相媲美成果的A+人才。\
  \ 不仅你可以靠模仿来学习——他们还会激发你最好的工作。\n\n我说的不仅仅是聪明人； 世界上充斥着聪明的平庸者。 我指的是那些体现了全方位素质的人——聪明、有能力、有动力的人，他们每天都会为自己和周围的人提高标准。\
  \ 或者，正如《Entrepreneur》杂志文章中所定义的那样，你希望让自己周围都是不懈的工作者、积极乐观的人、好奇的人和梦想家。¹\n\nThycotic的总裁兼首席执行官James\
  \ Legg召集了一个由不懈、积极、好奇的梦想家组成的核心团队，其中几个人已经一起工作了10年或更长时间。 “你和你周围的人一样好，”Legg说。 “我很幸运，我今天合作的许多顶级领导者都从公司到公司一直跟随我。\
  \ 让自己周围都是能激励你的人所带来的价值是巨大的，而且这种激励是双向的。”\n\n这段话的最后一部分很重要——A+人才不仅会帮助你成长，他们还会激励你追求以前认为遥不可及的目标，并激励你发挥出最好的工作。\
  \ 想出一个问题的巧妙解决方案并不是在真空中发生的，它取决于我们吸收的东西，也取决于我们的思考方式。 把让自己周围都是能挑战你思维的人作为你职业规划的一部分。\
  \ 理想情况下，让自己周围都是顶尖人才是你职业规划的一部分。\n\n培养一个精英内圈的方式始于你被雇用之前。 当你研究可能想工作的初创公司时，仔细看看领导团队。\
  \ 他们是谁，你能从他们身上学到什么？ 在LinkedIn和其他他们被引用或介绍的在线网站上研究他们。 查看哪些领导者似乎是潜在的导师。\n\n尤其重要的是要看看你正在考虑的公司是否由具有创业思维的人领导。\
  \ 有时初创公司会用在大型公司取得成功的人来填补高级领导职位，但他们很快就会发现自己不具备应对初创公司环境的条件。 为了在面试过程中弄清楚你是否会加入一个具有创业思维领导者的地方，询问公司的文化和他们雇佣的人才类型。\
  \ 要求与广泛的基础人员进行面试以更好地了解公司文化永远不会有坏处。\n\n当你在面试时，问这样的问题：“假设我在入职六个月后，人们都在称赞我的成果。 我取得了什么成就？”\
  \ 这不仅能让你很好地了解他们的期望以及你是否合适，而且还能告诉你这是否是能推动你成长的环境。\n\n一旦你选对了地方，确保你选对了人。 寻找不懈、积极乐观、好奇心强、有大梦想并能激发你最好的一面、激励你成长的人。\
  \ 在这里，重要的是要谈谈高成就者到底是什么。 最好的经验法则是寻找一个作为整体包，是你想要效仿的人。 考虑他们的职业、个人以及在较小程度上财务方面的成就和他们是谁。\n\
  \n观察他们是什么样的员工，他们如何创造性地思考，他们有多么驱动。 他们在压力下如何处理自己？ 当他们走进一个房间时，他们如何表现自己？\n\n不要过于专注于职业方面。\
  \ 确保你让自己周围都是与你有相同价值观的人。 他们是好人吗？ 他们善良慷慨吗？ 他们愿意与年轻或经验较少的人分享他们所知道的知识吗？ 他们有一个他们尊重和爱护的家庭吗？\n\
  \n不要被令人印象深刻的头衔或巨额财富蒙蔽。 虽然这些可以是高成就的指标，但它们并不一定意味着拥有它们的人在各个方面都表现良好，或是你想要效仿的人。 一旦你确定了一个伟大的榜样，就与他们建立联系，无论是（或两者）面对面还是在线。\n\
  \n不要羞于接近这些顶尖人才。 当我刚开始时，我得到了一项需要直接向首席执行官汇报的任务。 那位首席执行官有点欺凌——他喜欢碾压别人，让他们感到害怕。 起初，我很兴奋，但也有一点紧张。\
  \ 不久我就克服了首席执行官的令人敬畏的气质。 一旦我做到了，我意识到与他沟通加速了我的学习。\n\n这让我发现了两件事：（1）我应该一直这样做，（2）紧张是好事。\
  \ 我感到紧张，因为我不确定如何处理这种情况——这意味着我处于可以成长的位置。 即使现在，如果我在某种情况下太舒服了，我也会担心。 我尽量总是把自己置于能激发一点恐惧的位置。\
  \ 关键是不要让那种紧张感压倒你——我学会了将其转化为更努力工作、起得更早、更专注于工作的能力。\n\n我理解接近高成就者可能会让你感到紧张。 好。 迎接它，并在你发现自己身处高层人士中间时，利用这个机会与他们建立关系。\
  \ 我经常看到年轻员工感到害怕，不敢向高级领导人、更成功的人或上过更好学校的人寻求建议。 如果这是你的心态，你将停留在底层，因为这证明了你不舒服待在C-suite。\n\
  \n对与高成就者建立关系的犹豫传达的信息是，“我认为我低人一等。” 正如我们所涵盖的，成功的关键第一是相信自己。 如果你连与你的主管交谈的勇气都鼓不起来，你怎么能经营一家公司呢？\n\
  \n在接近高成就者时要记住的另一件事——这应该减少敬畏感——是他们只是普通人。 高成就者喜欢几乎\n\n\n任何人都喜欢这样，尤其是坐下来聊聊自己的机会。你不需要刻意去给他们留下深刻印象，也不必对世界上所有问题都有答案。只要真诚、有礼貌，你就能大受欢迎。一旦你们彼此欣赏，魔法就会开始发生。\n\
  \n在创业公司里，你没有任何理由不去接触高层管理人员。如果你在 Facebook 工作，你大概永远见不到马克·扎克伯格。哪怕你靠近他的办公室门口，他的某个安保团队也会立刻把你轰走。但在创业公司，CEO\
  \ 的办公室很可能就在你隔壁，而且门通常是敞开的。尽快去敲门吧。礼貌地询问对方能否安排时间一起喝杯咖啡，聊一聊他们的公司和理念。大多数 CEO 都会欣然接受这样的机会——我曾对那位强势、令人生畏的\
  \ CEO 做过同样的事。他非常乐意交谈，而不可思议的是，我在那次会面中几乎没说什么话。然而，当我离开时，我相信他心里在想：“这小子真不错。”你也可以，而且应该这么做。\n\
  \n主动接近那些在各自领域处于顶尖地位的人，向他们提问以更深入地了解公司或其某个项目，并从中吸取经验，这要好得多。邀请你的经理或高层领导喝杯咖啡，或者进行五分钟的交谈；这会让高管团队看到你是一个有潜力的领导者，认真对待自己的职业发展，并致力于帮助公司成长。\n\
  \n当然，你并不总能控制自己和谁待在一起。有时你不得不和表现不佳的人或心态消极的人共事。在这种情况下，不要喝他们那杯“毒药”。除非万不得已，否则一分钟都别多待，否则他们会把你拖下水，让你士气低落，比你深深叹一口气的速度还要快。虽然表现不佳的人可能是“好人”，也可能交付还算不错的结果，但总体而言，他们是坏苹果，会毁掉整个职场环境。如果你花太多时间和那些“消极的妮莉”待在一起，不仅你的业绩会受影响，你的声誉也会受损。每个人都会觉得你和那些低成就者没什么两样，从而把你视为可有可无的人。\n\
  \n## 找到合适的导师\n\n> 导师是成功创业公司的秘密武器。  \n> ——瑞特·莫里斯，Endeavor Insight 总监\n\n你懂得再多，也总有更多可以学习的地方。在职业生涯的每一个阶段，导师都能帮助你缩短学习曲线，加速你通往高管层的道路。我也不例外——在我职业生涯的每个阶段，都有导师帮助我获得特定专长或消除盲点。随着我的成长，我的需求不断变化，导师也随之改变。总的来说，我先后从\
  \ 10 位不同的导师和引路人那里获益良多。\n\n虽然没有导师也有可能成功，但大多数人做不到。根据美国培训与发展协会的一项调查，75% 的高管表示，导师制对他们的职业发展至关重要。[^2]\
  \ 原因在于，没有人一开始就是某个领域的专家。没有人会指望你在没有老师的情况下，就能在有机化学期末考试中拿 A。因此，没有引路人，几乎不可能在商业中取得非凡成就。\n\
  \n[^2]: Alyssa Rapp，“Be One, Get One: The Importance of Mentorship，”《福布斯》（2018 年\
  \ 10 月 2 日），https://www.forbes.com/sites/yec/2018/10/02/be-one-get-one-the-importance-of-mentorship/#1ec411b74343。\n\
  \n举个例子，我要回到之前提到的一个故事。当时我在 KnowledgeWare 工作，在商界还非常青涩。公司正在尝试组建并运营一个咨询部门，但原来的经理未能取得成果。我的老板让我接手。我对这个挑战和证明自己的机会充满热情。但同时，我也紧张得冷汗直冒。想象一下这样的画面：二十多岁的我，走进一群经验丰富的顾问中间，他们都比我年长，然后我告诉他们：“嗨，我是史蒂夫。我以前从没做过这个，现在我是你们的经理。”听起来像是一场灾难的配方，对吧？\n\
  \n幸运的是，我早已认识一位外部顾问，并与他建立了良好的关系，我们请他帮忙管理客户服务组织。虽然他主要与副总裁合作，但我已经见识过他的技能，对他的知识以及制定计划并贯彻到底的能力印象深刻。我决定就这个新项目向他请教。谢天谢地，他答应了。\n\
  \n他帮我组织了一个为期三天的工作坊，让整个团队达成共识。那时我刚刚开始培养自己的领导力。如果没有他的建议，我根本不会想到这一步，结果也会因此大打折扣。最终，我成功带领团队达到了公司预期的收入增长水平。直到今天，我仍在实践从他——我的第一位导师——那里学到的东西。\n\
  \n## 选择你的导师\n\n不要干等导师来挑中你。要主动出击。当你意识到自己力不从心时，就去寻求建议。或者更好的做法是，提前与导师建立良好的关系。\n\n关键在于谨慎而明智地选择。当你寻找导师时，首先要明确你想提升的领域，以及你职业成功所需的技能和工作习惯。像其他目标一样，把这些写下来，放在你眼前。一旦你有了清晰的认识，就去寻找能帮你提升这些技能的人。同时，一定要找到一位能在性格、技能和需求上与你互补的人。\n\
  \n一个很好的切入点是审视你的目标，然后找出那些实现了类似目标的人。接着，挑选一两位 A+ 级人才，他们看起来既有能力又愿意当你的导师。如果你从那些已经了解你职业道德、且与你已有关系的人开始，效果最好。\n\
  \n我的第一位导师告诉我，他之所以同意帮我，是因为他看到我渴望、热情、有条理，最重要的是，愿意接受新的观点和想法。如果你已经在日常工作中表现出色，那么找到导师就会容易得多。\n\
  \n你也可以在尚未认识的人中寻找导师。导师们会在科技加速器、商务 MeetUp 小组等场合出现。但同样，最好从一段相互尊重的现有关系开始，这样你就能知道你和导师之间有联系、有信任，并对期望达成的目标有相似的看法。\n\
  \n一旦你确定了目标，就要找合适的时机与对方接触并开启对话，这样你就可以询问对方是否愿意指导你。不要担心这个请求会被视为无礼或令人反感。请记住，几乎每个身居要职的人之所以能达到今天的位置，都是因为有导师，而且大多数人都希望将这份慷慨传递下去。就我个人而言，我指导过\
  \ 15 个人，我非常喜欢看到我所提携的人取得成果。\n\n合适的导师关系会看起来像是你现有关系的自然延伸。你也许可以先聚几次，确保双方合适，然后再承诺建立长期的导师关系。就像任何其他关系一样，这也是双向的。最好的导师会认真对待自己的角色，给你其他人不愿告诉你的、诚实的、爱之深责之切的真实评价，并且会就如何采取行动给你最好的建议。他们可以作为你的“回音板”。一位伟大的导师总会为你的最大利益着想。所有这些都能帮助你减少错误、建立自信。\n\
  \n作为被指导者，你同样扮演着重要的角色。为了让这段关系成功，你要在协作中扮演积极的角色。不能把它当作随随便便的事——你必须真正渴望获得洞见、智慧、咨询和辅导，并准备好接受负面和正面的反馈。做笔记。以尊重的方式接受指导，提出直接的问题，落实建议。而被指导者最重要的责任是：说谢谢。导师只以感激作为回报，所以一定要充分表达你的谢意。他们相信与下一代分享知识的价值，并且希望知道这些知识得到了善用和珍视。\n\
  \n## 导师/被指导者关系准则\n\n最好的导师关系遵循一套基本规则。例如，导师承诺投入一定的时间和频率，而你则按照导师的建议行事，并回头告知导师进展如何，或者寻求进一步的帮助。\n\
  \n\n\n\n\nadditional guidance. After you’ve done that, a huge part of the joy of\
  \ mentorship comes from the new surprises and growth you experience. For example,\
  \ another mentor of mine, and my favorite, has been Doug Erwin who you know as my\
  \ CEO at PentaSafe and The Planet. I regularly sought out his opinions and guidance\
  \ then, and I still do at times today. He’s had a huge impact on my life and career,\
  \ and I respect his opinions and judgment. But our relationship has evolved: now,\
  \ I’d call Erwin my “friend-tor,” a combination of friend and mentor. He’s not alone:\
  \ nearly all of my mentors over time have become friends for life, and I contact\
  \ many of them at least every quarter. If you don’t have a mentor, find one. If\
  \ you have one mentor, get another. Their insights and assistance will boost your\
  \ career in ways that you would never be able to accomplish alone.\n\n## 何时留下何时离开\n\
  \nHigh-performing start-up employees are like white rhinoceroses: majestic, rare,\
  \ and at high risk from poachers. If you follow the advice in this book and start\
  \ to shine at your chosen start-up, other companies will notice and they will try\
  \ to lure you away. Faced with this plethora of opportunity, it’s not always easy\
  \ to know when to stay and when to go. This choice matters—a start-up with high\
  \ growth potential and strong leaders can be a great place to advance your career,\
  \ but a toxic environment can stall your career if you stay too long.\n\nThere are\
  \ other downsides to leaving a position too quickly. You don’t want to earn a reputation\
  \ as a job-hopper. Still, you need to strike a balance. It’s not a great idea to\
  \ spend your whole career in one spot. Looking for the best work environment is\
  \ a lot like dating—sometimes you need to play the field enough to find out what\
  \ gets your juices going. Eventually, there will come a time when you need to leave\
  \ your first start-up, or a really excellent opportunity will appear.\n\nStill,\
  \ it’s not always easy to tell when to stay and when to go. This is one of the most\
  \ difficult decisions you can make, and each time you face it, the situation will\
  \ be unique and will require its own approach. That being said, there are a few\
  \ rules of thumb you can follow.\n\n### When to Go\n\nThe first rule of thumb is\
  \ to check your current environment to see if it’s toxic. Sometimes, having the\
  \ same experience every day can make it seem “normal,” but some companies’ “normal”\
  \ is unhealthy and a career-killer. If any of the below statements applies to your\
  \ situation, it’s probably time for you to find a new start-up:\n\n- You’re miserable\
  \ 24/7, and dread going to work.\n- Your job is taking a toll on your health.\n\
  - Your workplace presents moral or ethical differences that you can’t live with.\n\
  - The company has systemic problems, and it’s a sinking ship.\n- It fosters illegal\
  \ behavior such as sexual harassment.\n- You’ve exhausted all opportunities to grow\
  \ and advance.\n\nDuring my long career, I’ve passed through many toxic situations\
  \ that I needed to escape. For example, I once worked for a company where, at the\
  \ end of a quarter, our numbers weren’t as good as we had hoped. They weren’t bad,\
  \ but they weren’t great, either.\n\nThe chairman blew his top. He was livid, and\
  \ scheduled a day-long meeting on July 5, and told every senior leader that we had\
  \ to give a large presentation about where our division stood. My colleague and\
  \ I spent hours of that holiday weekend locked away from our families in a hotel\
  \ room, working desperately to construct this intricate presentation on our marketing\
  \ department.\n\nThe meeting rolled around. It was a grueling affair, and most of\
  \ the other divisions presented before us. Then, when it was finally our turn, the\
  \ chairman just said, “Oh, you know, we don’t need to hear from marketing.” And\
  \ he adjourned the meeting. That was it—all of that time that we could have spent\
  \ with our families was wasted. I felt disrespected and lied to. I no longer felt\
  \ that I could trust the chairman.\n\nUltimately, I left, mostly because of that\
  \ instance.\n\nAn important caveat: I didn’t leave right away. I gave myself a few\
  \ months to process what happened, and when I found that I couldn’t move past it,\
  \ I made the decision to leave. If you’re considering leaving a company, I suggest\
  \ you do the same thing. Take the time to think through the decision carefully and\
  \ thoroughly. Often, you will discover that the problem isn’t as dramatic as you\
  \ originally thought.\n\nJames Legg, president and CEO of Thycotic, says, “If you\
  \ go to work in a particular market or for a particular company, and it doesn’t\
  \ work out, go somewhere else. There are so many jobs in technology. The world is\
  \ changing and tech is growing. No matter your religion, have faith that you will\
  \ find the right fit for you.”³\n\n### When to Stay\n\nThe following list includes\
  \ reasons people decide to leave their jobs, but they’re not necessarily the right\
  \ reasons to jump ship. Usually, these issues can be worked out if it’s to your\
  \ advantage to stay and continue to contribute where you are:\n\n- You feel unhappy\
  \ at work. Most people feel unhappy at work from time to time. There’s a difference\
  \ between the ups and downs and being completely at the end of your rope. If you\
  \ have one particularly bad day, don’t make any rash decisions. Wait a few months\
  \ to see if a pattern develops.\n- You think that the grass is greener somewhere\
  \ else. This one can be particularly deadly. If you constantly think about all of\
  \ the things that you don’t have, you might get impatient with your current job\
  \ and it might make working for a competitor seem appealing. Before you decide,\
  \ take an honest look at your position where you are, and talk to people who already\
  \ work for the company that’s your other option. Then, evaluate how green the grass\
  \ over there really is.\n- You get bored. This might mean that you’ve outgrown the\
  \ company, but far more likely, it means that you haven’t sufficiently explored\
  \ other roles you can play, or a team you can lead, or something new you can learn\
  \ at the company where you work. If you haven’t exhausted your opportunities to\
  \ grow where you are, there’s no point in moving. To move prematurely means your\
  \ environment will change, but you will remain stagnant. Focus on growth.\n- You\
  \ need to make more money. Money is an important factor, but it doesn’t mean you\
  \ have to leave the company where you’re at to make more. Consider first if you\
  \ are being paid fairly for your position. Look up the going pay rate for your job\
  \ on salary.com to find out. Ask for a raise if it’s justified. And look for opportunities\
  \ to take on more responsibility or bigger projects where you will provide greater\
  \ value and thus be worth a higher salary. Whatever you do, don’t decide solely\
  \ based on the money, as tempting as that may be. At the end of the day, extra money\
  \ is nice, but it’s not the most important thing. Also consider the people, the\
  \ challenges, and where you can make the biggest impact.\n\n### 正确的方式离开\n\nWhether\
  \ you focus on putting down roots where you are, or growing shoots in someplace\
  \ new, it won’t be possible to quickly assess any of these aspects, and no matter\
  \ how well you do your diligence, any move will involve some risk. It’s up to you\
  \ (with the help of a wise mentor) to decide which risks have the biggest payout\
  \ potential in knowledge, skills, location, experience, income, and benefits. Sometimes,\
  \ the right decision is to leave a good situation for a great one.\n\nThe hardest\
  \ career decision I ever made came when I was working at The Planet in a job I loved,\
  \ with a team that was like family, and reporting to my mentor Doug Erwin. It was\
  \ a beautiful workplace life. And then, Quest Software, a billion-dollar public\
  \ company, offered me a higher-level position at more than double the compensation.\
  \ They valued my serial entrepreneurship and wanted a marketing leader with a start-up\
  \ mentality. I struggled mightily with this decision.\n\nYou may think the words\
  \ “more than double the compensation” would have been enough to sway me, but this\
  \ decision rested on so much more. I had to ask myself whether it would be worth\
  \ it to leave a workplace and team where I was thriving to head off into the wild\
  \ unknown for more pay and a new opportunity. Would I ever have such a strong connection\
  \ with a team again? I made a list of the pros and cons, talked with my family,\
  \ and consulted with Erwin. His response was, “I can’t stand in your way.” He then\
  \ wrote me a heartfelt personal letter that helped me to make a balanced decision.\n\
  \nAfter a final gut check, I accepted the offer and left The Planet. What ultimately\
  \ swayed me wasn’t the money—I thought that I would have an opportunity to grow,\
  \ test myself, develop new skills, and make a large impact with Quest. In the end,\
  \ my gut was right. I went on to build valuable new skills and relationships. To\
  \ really sweeten the deal, The Planet sold a year later, which confirmed my decision\
  \ and netted me some nice residuals. I didn’t have to worry about breaking up with\
  \ my workplace family forever, as I’ve remained friends with many of them to this\
  \ day.\n\nA lot of times, moving on to work for a new company can be an excellent\
  \ choice, but as with everything else, you need to leave the right way. If you decide\
  \ to move on, define your ideal job and manager, create a plan, and set your goals.\
  \ Never burn a bridge behind you. No matter what, follow the golden rule to “do\
  \ unto others as you would have them do unto you,” which means giving adequate notice,\
  \ assisting with the transition, training your successor, helping your soon-to-be-former\
  \ teammates succeed, and keeping all communications professional and positive.\n\
  \n### 相信你独特的道路\n\nIf, after reading all of this, you still feel intimidated by the\
  \ gravity of this decision, that’s okay. There’s something that you can keep in\
  \ mind that hopefully takes a little of the pressure off: there is no singular,\
  \ clear path to success. You will likely, especially in the start-up world, especially\
  \ when you’re young, bounce around from company to company for a while. It might\
  \ seem like you’re having false starts\n\n或者在起步阶段遇到困难，但所有这些都可能是这一过程的一部分。关键在于在每个阶段都持续学习，努力工作，并遵循本书中的指导方针。\n\
  \n例如，看看西蒙·阿佐帕迪（Simon Azzopardi）如何走到今天的位置，成为泰科提克（Thycotic）公司的国际高级副总裁。作为一个马耳他年轻人，他最初是在父亲的旅行社里工作，后来接管了业务成为老板。在某个阶段，公司需要更新且安全的\
  \ IT 网络，于是阿佐帕迪决定亲自学习如何构建并维护它。在这个过程中，他意识到自己比起旅行业务，更喜欢 IT 业务。因此，他把业务卖回给家人，并踏上了成为微软认证工程师的旅程。快进至阿佐帕迪在软件公司的早期职业生涯。关键的一点是，他学会了何时该跳槽并换一家公司，以便他能继续扩展知识并在不同的全球科技市场中积累经验。\n\
  \n最终，他在 GHI Software 找到了一份工作，在那里他建立了一个成功加速软件销售增长的模型。他的老板注意到了这一点，这也是他迎来重大突破的时刻。他这样描述当时的情景：“那是\
  \ 2000 年 12 月 7 日，我的老板走到我面前说：‘嘿，西蒙，你喜欢英国吗？我正在找人来启动我们在英国的业务。’”\n\n> “我回到家，整个晚上都在制定针对英国的提案和商业计划，并在\
  \ 12 月 8 日没睡一点觉就提交了它。这让他感到很意外。他并没有要求我制定计划，他对计划的详尽程度感到震惊。那天上午 11 点，我们就在新的职位和地点上达成了协议，我的旅程真正开始了。我在\
  \ 2001 年 1 月搬到了英国。”\n\n阿佐帕迪说，如果他现在重读那份计划，他可能会忍不住笑出声。“在那种情况下，尽管当时我并没有具备所有的专业知识，但我还是对那个机会说了‘是’。这为我的人生带来了许多其他机会。我们必须始终提供我们能提供的最好表现。如果我们对一个机会说‘不’，我们就错过了它。我试着说‘是’，然后想办法去实现。”在整个职业生涯中，阿佐帕迪继续在美国公司、一家丹麦公司以及现在的泰科提克公司中承担\
  \ progressively 更大的角色，特别是在初创企业中。\n\n## 换位思考\n\n领导力几乎比任何事物都更依赖于共情。如果你想激励人们全力以赴，激发他们最好的创意，并让他们热爱为你工作，你就需要理解他们的感受和他们看待问题的角度。培养这一项技能将赋予你能力，知道该说些什么来激励他们，以及他们需要在怎样的环境中才能发挥最佳水平。这项软技能是在\
  \ C 级高管层成功所绝对必要的，特别是在初创世界。初创公司往往吸引多元化的人才队伍，并雇用远程工作者，他们可能来自挪威或印度等遥远的地方。有效的跨文化沟通完全依赖于强大的共情能力。\n\
  \n这一点，加上快节奏的初创环境，意味着你需要培养一种能力，以便迅速从他人的视角看待事物。这适用于理解老板发出请求或指令背后的理由，理解客户的视角，或在倾听时理解同事的视角。\n\
  -   在分享你的回应之前，先总结你对他人所说内容的理解。\n-   寻找共同点。\n-   提出富有共情的问题，例如：“你在想什么？”和“你觉得新项目进行得怎么样？”\n\
  -   进行眼神接触以表明你正全神贯注。\n-   练习 360 度反馈会议，以获取来自你组织层级中上级、同级和下级的反馈。\n\n\n\n\n\n- 记住 7%\
  \ 法则：沟通中 7% 是语言的，93% 是非语言的。注意你的肢体语言，也要学会读懂同事的肢体语言。这将使你能够理解他们的情绪状态并做出相应回应。正因如此，最好很少使用电子邮件和即时通讯来沟通。这些工具各有其用途，但它们也会模糊意图，掩盖伴随的肢体语言，并使误解更有可能发生。\n\
  \n## 了解你的团队\n\n同理心的最重要部分就是简单地去了解你的团队。这是因为，正如为高管提供关键决策建议的心理学家 Prudy Gourguechon 在一篇\
  \ *Forbes* 文章中所解释的那样，设身处地意味着你“要确保你评估的是 *他们* 穿上自己的鞋子时会有什么感受，而不是你穿上他们的鞋子时会有什么感受。”²\
  \ 换句话说，你的目标是弄清楚他们实际的想法和感受，而不是你认为他们想法和感受的样子。\n\n为此，任何一点帮助都有用。在 Thycotic 的午餐聚会期间，我们会玩一些游戏，让每个人分享周末的经历，或者我们会透露一些鲜为人知的关于自己的事实，让同事们惊喜不已。我分享过的一些细节：我曾经做过\
  \ DJ，而且我还曾在 Sugarland Skeeters 小联盟棒球队担任过管理职务。会计部的 Jon 告诉我们他出版了三本诗集，而研发部的 Annette\
  \ 告诉我们她收藏了古董剑。分享这类信息，虽然看起来微不足道，却能带来更深的联系。它帮助我们了解我们正在与谁共事，并建立了同志情谊和信任。\n\n更进一步，系统、有针对性地收集有关团队的信息也很有用。当我自愿接手\n\
  \n> ² Prudy Gourguechon，“Empathy Is an Essential Leadership Skill—And There’s Nothing\
  \ Soft About It”，*Forbes*（2017 年 12 月 26 日），https://www.forbes.com/sites/prudygourguechon/2017/12/26/empathy-is-an-essential-leadership-skill-and-theres-nothing-soft-about-it/#3511d147d2b9d。\n\
  \n## 说谢谢并真心实意\n\n> *培养一个人的最佳方式是通过赞赏和鼓励。*\n> —Charles Schwab，美国投资者和慈善家\n\n如果你在几乎任何一家公司对员工进行抽样调查，问他们有多少人感到不受重视，你可能会惊讶于有多少人会说自己不受重视。每个人都希望自己的工作得到认可，而当他们得到认可时，就会营造出令人惊叹的积极环境。我曾与一些团队共事，每个人似乎都太忙了，甚至连一句谢谢都懒得说，于是有才华的人因为感觉不到被重视而离开。\n\
  \n相反，在 PentaSafe，每个人都有说真心感谢的习惯，只要值得感谢，即使大家都因截止日期而时间紧张。当有人做演示时，每个人都会说谢谢。当员工在我办公室门口进行即兴的“路边会议”时，他们也会说谢谢。这让每个人都感到受尊重和被重视。\n\
  \n关于这一点的分析数据也强化了感恩的重要性。John Templeton Foundation 进行的一项调查显示，感恩在职场中非常重要。“93% 的受访者同意，感恩的老板更有可能成功。”而且，根据调查，其益处还延伸到工作之外，超过\
  \ 90% 的受访者同意感恩的人更充实，过着更丰富的生活，并且更有可能拥有朋友。³\n\n相反，当缺乏感恩时，人们就会离开。2017 年 OfficeTeam\
  \ 对美国和加拿大员工和高级管理人员的调查显示，三分之二（66%）的员工表示，如果他们感觉不到被重视，就会走人。似乎进入劳动力市场的千禧一代的涌入推动了对认可的需求不断升高，因为早在\
  \ 2012 年，只有 51% 的人表示如果感觉不到被重视就会离开。在千禧一代中，“如果得不到认可就会离开的员工比例上升到七十六 percent。”⁴ 感恩是当今和未来的成功关键，因此最好现在就养成习惯。\n\
  \n> ³ Emiliana R. Simon-Thomas and Jeremy Adam Smith，“How Grateful Are Americans?”\
  \ *Greater Good Magazine*，由 UC Berkeley 的 GGSC 出版（2013 年 1 月 10 日），https://greatergood.berkeley.edu/article/item/how_grateful_are_americans。\n\
  > ⁴ “Thanks, But No Thanks”，OfficeTeam 由 Robert Half 发表的新闻稿（2017 年 4 月 12 日），http://rh-us.mediaroom.com/2017-04-12-THANKS-BUT-NO-THANKS-Survey-Reveals-Strongest-Forms-of-Workplace-Recognition-Research-Also-Finds-Two-in-Three-Employees-Would-Leave-Their-Job-If-They-Didnt-Feel-Appreciated。\n\
  \n## 感恩具有传染性\n\n新员工最能产生影响的方式之一就是实践感恩。你不需要依赖任何人来做。你不需要等待机会。你不需要领导团队。你不需要在正确的时间出现在正确的地方。你可以养成真诚致谢的习惯，而没有人能阻止你。\n\
  \n这也可以让你更快地进入领导层，因为感恩具有传染性。当你出现并开始感谢同事时，他们会想要将这份善意传递下去。人们会注意到你推动了这种转变，并同样感激你。即使你的感恩没有传播开来，它也会让你脱颖而出，成为一个积极的力量，具有领导潜力。这在反面也同样适用。如果你习惯不向同事表达感恩，就会滋生怨恨，导致他人也不表达感恩。这同样会被注意到。\n\
  \n## 如何表达感恩\n\n大多数经理和员工错过了他们表达感恩的最佳机会之一：年度绩效评估。通常，这些强制性的评估双方都感到畏惧。它们往往主要集中在需要改进的方面，而不是出色的工作。我保证，大多数经理心里真的在想，“哦糟糕。我太忙了，还得做某人的评估。算了，快点做完吧。”\n\
  \n然后在评估期间，他们会说，“做得不错，但你可以在这几个方面做得更好……”，然后大家就回去工作了。\n\n这只是表面上的感恩，并不真诚或有影响力。在我的职业生涯中，我只有少数几次有意义的评估，让我真正感受到对我辛勤工作的认可，同时也获得了改进不足之处的反馈。\n\
  \n在初创公司，评估（如果存在的话）由于团队规模较小、每位领导的直接下属较少，以及缺乏正式的 HR 评估结构，而更有机会变得更有意义。如果你的工作场所没有安排评估，请向你的经理索取。要求进行一次认真、详细的回顾，说明你做得好的地方以及可以改进的地方。通过寻求这种宝贵的反馈，你的经理会感到被重视，并会看到你渴望卓越。\n\
  \n我在初创公司的早期年里没有那样做，现在我不禁想知道，因为我没有主动询问，我错过了多少金玉良言。评估也是你作为员工向经理表达感恩的机会，感谢他们为你成长所做的任何帮助，或推动你成为更好的自己，或感谢你欣赏的他们领导风格的任何方面。\n\
  \n当然，会有需要对某人进行纠偏的时候。每当有必要给出负面反馈时，都要夹杂一点感恩。你会惊讶于它如何改善绩效。感恩之美的一部分在于它软化了我们所有人都必须面对的不可避免的负面现实的严酷性。Dr.\
  \ Camille Preston 解释了其背后的心理原因：“当感恩是真诚的时，它有力量帮助我们转化在面对负面反馈时所感受到的情感破产。”⁵\n\n赞赏是让某人一天变得美好、激励他们并激发他们做得更多的最简单方法之一。除了绩效评估之外，这里还有其他表达感激的方式：\n\
  \n- 面对面地说出来。\n- 写一封简短的便条。\n\n> ⁵ Dorcas Cheng-Tozun。“5 Competitive Advantages that\
  \ Gratitude Gives Entrepreneurs”，Inc.（2018 年 11 月 19 日），https://www.inc.com/dorcas-cheng-tozun/5-competitive-advantages-that-gratitude-gives-entrepreneurs.html。\n\
  \n\n\n\n\n- 在邮件主题行中写上“谢谢”并发送邮件。\n- 在会议中公开表达感激之情。\n- 发送一条简短的短信。\n- 以感激之情与某人握手。\n\
  - 发送感谢卡或礼物。\n- 在某人的社交媒体上发布留言或视频。\n- 在公开场合以及与第三方交谈时，点名感谢帮助过你的人。\n\n一个很好的经验法则是：如果你觉得自己还能做一点点来表达感激，那就比你认为能做的多做一点点。说句实话，这根本没有借口——说声谢谢不需要花费任何成本，或者最多你只需花五美元买一张咖啡店的礼品卡。\n\
  \n如果你认为自己没有时间说谢谢，请明白这是一个苍白的借口。甚至是坎贝尔汤公司的前首席执行官道格·康纳特，在十年期间也抽出时间给公司员工写了 30,000 封感谢信。如果一家大公司的首席执行官能找到时间写个性化的感谢信，你也能做到。结果将会是巨大的。⁶\n\
  \n⁶ Jill Griffin, “The Value of a Well-Written Thank-You Note,” Forbes (August 7,\
  \ 2018). https://www.forbes.com/sites/jillgriffin/2018/08/07/the-value-of-a-well-written-thank-you-note/#2f106e936500.\n\
  \n## 营造乐趣与喜悦\n\n> 人们很少能在不享受自己所做的事情的情况下取得成功。\n> ——戴尔·卡耐基，《如何赢得朋友并影响他人》的作者\n\n任何想要成功的办公室首先必须是好玩的。这看起来可能违反直觉——但现实是，如果人们不想待在那里，他们永远不会在办公室里努力工作。因此，充满乐趣的工作环境可以帮助吸引和留住最佳人才。在初创公司世界中，这尤其重要，因为大多数潜在员工都很年轻，并期望从周围环境中获得一定的刺激。除此之外，乐趣还能激发创造力，推动人们创新。甚至还有研究表明，工作场所的乐趣和喜悦能提高整体生产力。根据华威大学全球经济竞争优势研究中心的数据，“快乐的员工平均生产力提高十二个百分点，在某些情况下高达二十个百分点。”\n\
  \n营造乐趣的举措可以有多种形式。在我曾工作过的一家初创公司，我们曾聘请一支高中行进乐队来帮助团队振奋精神、激发灵感。乐队直接从我们正门进入，沿着走廊向会议室进发，鼓声轰鸣，小号嘹亮，墙壁都在震动。我们都坐在椅子上，随着巨大的声响越来越近。谈何响亮；谈何棒极了！这确实让我们热血沸腾。\n\
  \n我们还举办过辣椒烹饪比赛、惊喜冰淇淋圣代站以及公司支付的咖啡或鸡尾酒。有一次，当我的团队得知是我妻子的生日时，他们邀请她来喝香槟和吃纸杯蛋糕。来自各个部门各个层级的员工都来参与，包括客户支持、市场营销和\
  \ IT 人员。谈话短暂地从业务中解脱出来。这些即兴的、相对 inexpensive 的活动有助于营造一个更具吸引力、更难忘、更有趣的工作环境。\n\n如果你进入一个新的工作环境，听到人们抱怨说他们从不快乐，那就主动起来。提供组织并领导一个小团队，寻找让员工以低成本的方式一起玩乐的方法。这将展现你的主动性并提升你在办公室的人气，这两项都有助于你脱颖而出。最后，请始终记住，在你的工作场所营造乐趣和喜悦始于你自己。用这样的心态进入每一天：你会享受在工作中的时光。对我来说，这很有效。每天早上，往往在我还在床上准备开始新的一天时，我会问自己：“我今天如何在工作中获得乐趣？”我建议你也这样做。你会开始热爱你的工作，更努力工作，取得更好的成果，同时一路度过一段美好的时光。\n\
  \n金融专家兼顶尖人才知名招聘者凯文·克劳斯迈耶表示，他寻找的两个品质是热情和坚韧。他继续说道：“当我说热情时，我指的是他们每天醒来都带着超级积极的心态，愿意并准备好应对挡在他们面前的一切。”⁸\n\
  \n克劳斯迈耶要求面试者分享动态发生变化并需要调整的情况，或讲述他们在学校或团队工作中所做的事的故事。他利用面试者讲述故事时的活力和热情来衡量他们的热情程度。⁹\
  \ 简而言之，光有大量的热情是不够的——要成为一名有效的领导者并成为招聘的理想候选人，你需要能够传达它。\n\n## 保持周围环境积极\n\n我选择让自己周围都是积极、乐观（但又现实）的人。他们更有趣、更有韧性，并在压力下做出更好的决策。他们不会为小事而烦恼。而且他们也能帮助我保持乐观。\n\
  \n反过来，我会尽力避开负面的人——他们会消耗你的能量。似乎有些人随身携带一根巨大的吸管，用来吸走每个人的生命力。我强烈建议你也尽力避开这类人。给他们留出宽阔的距离，不要让自己被拖入他们的负面情绪中。其中一个关键是避开流言蜚语。永远不要在背后说任何同事的坏话，尤其是在工作时。这些只是分心，是不安全的人为了短期内让自己感觉更好而制造的机会，但从长远来看，它会破坏人们对你的信任并束缚你的职业发展。不要屈服于它。\n\
  \n## 如何在自己和环境中培养乐观\n\n我很幸运曾在许多令人惊叹的积极工作环境中工作，但我也经历过负面的环境。我经常思考是什么区分了那些积极的工作环境和僵硬、阴郁的环境。是人、文化、成功轨迹，还是我们对客户生活产生影响的感知？答案是：所有这些因素都是。\n\
  \n就像感恩一样，乐观和能量也是会传染的。仅仅在自己身上实践它们，就能在整个公司产生巨大的影响。例如，最近在 Thycotic，我们聘请了一名新员工，他很年轻。他向我寻求指导，我同意在一天结束时与他会面，在我参加了两个四小时的会议之后。\n\
  \n当我进入与他会面的房间时，我感到完全精疲力竭。但这个孩子带着巨大的笑容和大量的热情与能量走进来。会面后，我感到完全恢复了活力。他来找我寻求帮助，但那天，只是与他在一起就帮助了我！像那个孩子一样——积极、充满活力——是一个你可以做出的选择，而且这会让你在高层寻找晋升人选时进入他们的视野。\n\
  \n这并不意味着很容易。正如工作与生活平衡培训师和演讲者乔·罗宾逊所指出的，“负面的一面比正面的一面更有力量，所以我们必须主动地将正面的一面带向前。”他继续解释说，来自北卡罗来纳大学的芭芭拉·弗雷德里克森的研究表明，为了保持愉快的心态，我们需要三个积极事件对应一个消极事件。当然，这并不意味着你每天需要发生三个比消极事件更多的积极事件，只是你需要每天关注的积极事物比消极事物多三个。¹⁰\n\
  \n¹⁰ Posted by Joe Robinson, “Working Smarter: How Optimism Boosts Productivity\
  \ and Work-Life Balance,” https://www.worktolive.info/blog/bid/336460/how-optimism-boosts-productivity-and-work-life-balance.\n\
  \n关键在于训练自己去寻找积极面。以下是你可以这样做的方法：\n\n- 让自己周围都是积极的人。\n- 定期花 30 分钟写下你生活中的所有积极事物和你感恩的事情。\n\
  - 预期会有高潮和低谷，并保持适当的视角。看起来像是世界末日的事情很少是世界末日。\n- 追求足够好，而不是完美。\n- 专注于你的优势、你的成功和你的目标，而不是与他人比较。\n\
  - 当你听到脑中出现消极的自我对话时，有意将其改为积极的自我对话，即使一开始看起来很勉强。\n- 向导师请教如何建立能量和乐观的方法。\n- 当你感到悲观情绪开始出现时，打断它。离开办公室，去散步，去健身房，看一段短喜剧。然后从更积极、更乐观的角度来处理问题。\n\
  \n归根结底，除非你相信自己能够做到，否则你永远不会取得伟大的成就。这也是乐观对进入 C 套房至关重要的一个重要原因：你必须相信自己会到达那里，然后相信一旦到达那里，你就能正确地掌舵，即使天空变暗，你也会记得下一个黎明即将到来。\n\
  \n\n\n\n"
- '# 第9章：照料真正重要的事


  > 我不是我处境的产物。我是我决策的产物。

  >

  > ——史蒂芬·柯维，作家及演讲者


  年轻、热切的专业人士可能就像大质量恒星：燃烧得快、亮、热，然后耗尽。在科技初创企业中，工作节奏和苛刻的工作时间可能会把人压垮。这就是为什么保证你在初创世界取得成功的最重要的事情之一，就是照顾好你自己。如果你无法应对在初创世界年复一年的工作，你永远无法进入高层管理团队（C-suite）；而如果你的精神和身体健康状况没有达到最佳状态，你就无法做到这一点。在这一章中，我将分享你如何保护你的日程表免受无谓的时间消耗，并利用这些新获得的时光将你自己和你的家人放在首位，管理你的健康，并无悔地生活。


  ## 保护你的日程表


  时间是唯一真正有限的资源——一旦你失去了它，你就无法将其找回。这意味着你必须极其小心地管理你的时间。如果你不保护你的日程表，别人就会滥用它。请考虑以下两种日程表：一种被会议和活动填满，密密麻麻；另一种则有大量的空白空间。你认为哪个日程表属于更成功的人？那个有很多会议的人，对吧？


  错了。那个塞满会议的日程表属于我认识的一位热切、兴奋的年轻专业人士。那个几乎空白的日程表属于沃伦·巴菲特，他可能是有史以来最成功的投资者。如果一个有成千上万人寻求他时间片段的人都能保护他的日程表，你也一样可以。据比尔·盖茨称，这是他在
  1991 年第一次与巴菲特见面时学到的最重要的一课，当时盖茨刚刚起步职业生涯。盖茨说，在见巴菲特之前，“我每一分钟都排得满满的，我以为那是做事的唯一方式。”但巴菲特教给了他“留出时间思考的重要性”。¹
  要在事业上取得巨大的飞跃，真正脱颖而出，你需要想出出色、新颖、创新的想法。如果你总是处于会议、通话或回复电子邮件中，你不可能有那样的想法。有时，你只需要留出时间来反思手头的问题，思考潜在的解决方案，并留出时间处理那些能带来大规模影响的重要任务。此外，刻意留出思考时间能让你明确你的目标，并考虑通往这些目标的路径。


  出于这个以及其他原因，你必须积极保护你的时间，以便将最大的注意力集中在真正重要的事情上。虽然这看起来可能很明显，但这可能很难做到，因为我发现无数专业人士陷入了两个主要的陷阱。之所以称它们为陷阱，是因为它们可以伪装成有效的时间利用方式，但往往并非如此：会议，以及“应该做”的事情，而不是“必须做”的事情。


  ### 会议


  根据《哈佛商业评论》的说法，“会议是现代商业生活的梦魇，平均每月占用员工 62 小时的时间（据估计，其中有一半是完全浪费的）。”² 因此，问题就变成了：如果会议如此令人讨厌，为什么它们如此普遍？有时，管理者会用过多的会议来掩盖糟糕的管理策略。例如，当一家大公司收购我工作的初创公司时，新的营销负责人发出了每日站会状态会议的邀请。这些会议令人痛苦，是宝贵时间的浪费。这给人一种印象，即她缺乏更高效的方式来接收流程更新，有时，感觉她似乎潜意识地试图减缓进度。


  如果你最终被困在一个像这样的管理者手下，你有机会积极主动地阻止这种浪费时间。在这种情况下，我们团队聚在一起，向她提出了一种更有效的方式来获取她需要的信息。她倾听并改变了她的方法，我建议你做类似的事情。


  会议过多的另一个原因是，一些员工和经理，特别是年轻的人，犯了一个错误，即把更多的会议与更高的重要性联系起来。我见过一些年轻员工的日程表，他们认为如果接受所有发给他们的邀请、会议和可选活动，会使他们看起来对公司运营更加核心。无意之中，这允许别人的浪费时间成为他们的浪费时间。然后，当他们有机会领导项目时，他们向大众抛出多个会议邀请，然后疑惑为什么只有少数同事参加。这种行为只会导致一件事：倦怠——对于年轻员工以及所有参加他们安排的会议的人来说都是如此。


  事实是，你可以也应该挑剔你参加的会议。放下你必须接受所有来自上级会议邀请的心态。也许参加前几次会议，以衡量会议对你的价值。然后你可以根据需要调整你的日程。


  以下是我建议的两项策略，以减少你参加那些浪费时间、消耗精力的会议的数量：(1) 请求你的老板帮助建立会议优先次序，以及哪些会议你有“空中掩护”可以说“不”。(2)
  当你被邀请参加会议时，问：“你为什么特别需要我在那里？”


  你可能担心这听起来会粗鲁，但这只是一个问题。你的在场可能有正当理由，但很多时候你会发现，你并不必坐完全程的议程。通常，获取带有结果的状态更新，或者只参加与你相关的部分，对你来说更合理。学会将会议邀请分成两堆：一堆是“必须出席”，无论发生什么你都参加；另一堆是“最好出席”，你不参加。


  你可能认为拒绝会议邀请会让你变得不受欢迎或让办公室的人生气，但只要你有礼貌地拒绝，这种情况就不会发生。每当你决定不参加某个会议时，发送一封简短、礼貌的便条解释原因。不要唐突——那会惹恼人。当然，这像商业中的其他事情一样，是一种技能。你可能很难说“不”。我一开始也是，但随着练习，它会变得容易些。


  不必要的会议并不是唯一能浪费你时间的会议——有时，重要的会议因组织不善而导致会议蔓延。例如，许多临时会议开始时是 15 分钟绕弯子的快速信息共享和行动创造，但变成了
  52 分钟的冗长独白，每个人试图让他们的任务听起来重要而令人印象深刻，而其他人则在想他们接下来要说什么，或者希望自己在别的地方。当这种情况发生时，会议变得更像是摆姿势，而不是完成任何事情。


  无论你是领导者还是参与者，都可以通过坚持目的和议程来弥补这一点。准时开始，或要求领导者在指定时间开始。确保会议结束时总结所涵盖的内容，并列出具有问责制的行动项目。


  另一个会议建议：改变一下。千篇一律的议程和地点是无聊的。为了增加趣味，你可以选择深入探讨主题，邀请他人展示，改变地点，并尽可能保持简短。如果你在会议中环顾四周，发现人们的脸色看起来像是死神降临在角落的会议室，那么你就知道会议进行得太久、太无聊，或者超出了参与者的价值范围——或者三者兼有。


  ### “应该做”的陷阱


  如果你遵循本书中的建议，你可能会开始为自己设定每周目标，并制作你需要完成的事情的待办清单。然后，当你完成它们时，你会从清单上划掉它们，你会感到一阵（如果你还没有的话）喜悦和满足，看着那些被划掉的项目。你完成了一些事情，这是证据：一条整洁的黑线穿过一个项目符号。


  这种习惯在初创世界会对你大有裨益，但很容易被划掉事情的快感冲昏头脑。我见过许多有动力的年轻专业人士发生这种情况——他们对勾选待办清单的感觉如此上瘾，以至于不断添加更多任务到清单上——大多是琐碎的事情。


  他们做了所有这些琐事，并觉得他们完成了很多，因为他们正在划掉清单上的项目。他们没有意识到的是，成功来自于刻意、集中的行动，而不仅仅是任何行动。因为勾选容易，你在日历上添加大量多余的琐事，这会剥夺你本可以花在最重要目标上的时间。


  为了避免这个陷阱，努力确保你的日历和你的最高优先级完全一致。如果你承担了太多琐事，最终你会忙得不可开交，却无处可去。


  为了实现这一理想，做两件事：(1) 主动将高优先级项目首先列在待办清单上，(2) 诚实地与你自己对话，关于你交给自己的每项任务



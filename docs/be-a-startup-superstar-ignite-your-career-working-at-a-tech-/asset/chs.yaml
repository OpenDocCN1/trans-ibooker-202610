  \ StevenMarkKahan.com 与 Steve 建立联系。\n\n\n\n\n\n## 如何在科技初创公司找到工作并快速晋升，即使你不是技术达人\n\
  \n越来越多的应届大学毕业生处于未充分就业状态，或难以找到一份有成就感的职业。对许多人来说，从MBA课程到日复一日的公司苦差事这条老路似乎是唯一的选择——他们似乎看不到为一家刚刚起步的公司工作的可能性。科技初创公司正遍地开花。你不需要成为技术奇才也能在科技公司取得成功；这些新兴公司迫切需要各种人才和创造力，而这些正来自拥有新想法和领导能力的人。\n\
  \n*成为初创公司超级明星*是任何应届毕业生或求职者的必读书籍，他们希望将通用的商业知识转化为在科技初创公司中的成功职业生涯。离开安稳的企业工作、投身科技初创公司领域多年以来，作者史蒂文·马克·卡汉已成功帮助七家初创公司出售或上市。在这本书中，史蒂夫分享了他对在快节奏工作场所获得聘用的洞见：在那里你可以发挥创造力、赚取丰厚收入、升至高层并留在那里。\n\
  \n> “*成为初创公司超级明星*是我在大学期间考虑商业职业时希望拥有的一本书。它是对初创公司文化的深入探讨。”\n>\n> ——摘自戴维·米尔曼·斯科特所写的前言，他是畅销书作家和商业增长策略师\n\

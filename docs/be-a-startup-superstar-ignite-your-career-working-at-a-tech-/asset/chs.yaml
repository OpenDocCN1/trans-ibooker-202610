- '# 成为初创企业超级明星：在科技初创公司工作点燃你的职业生涯










  '
- "## 前言\n\n### 你还在等什么？是时候改变世界了！\n\n我一直热切期盼着在华尔街一家规模宏大、声名显赫的投资银行工作的第一天。我算是出人头地了！靠着家族关系，我大学毕业后的第一份工作就获得了一个入门级职位。当然，我是从底层做起，但我相信自己有能力脱颖而出，在职场阶梯上步步高升。那天早上，向我的新经理——一位老练的华尔街老手——自我介绍时，我兴奋不已。\n\
  \n然而，就在见面时，经理用了一个简单的动作，似乎很享受地摧毁了我的热情。他的这个强势举动让我从第一天那种充满期待、眼神发亮、对光明职业前景充满幻想的早晨，一下子跌落到对未来四十年枯燥乏味的想象中。这个多年来一定见过无数像我这样热切、刚毕业的年轻人的家伙，难道对每个人都是这样吗？\n\
  \n在我被介绍给新同事之前，在我知道我的初始工作内容之前，哎呀，在我甚至被告知该去哪儿上厕所之前，我就先被教导如何使用打卡钟。打卡钟！就像你在电影里看到他们描绘旧时代工厂的那种。经理在我职业生涯第一天的头10分钟内，就得意地给了我一张印有我名字的专属考勤卡。他告诉我，早上到达时要打卡，午餐离开时要打卡，午餐回来时要打卡，晚上下班时还要打卡。\n\
  \n打卡钟？真的假的？他们难道不信任我吗？天哪，我心想，我这是把自己弄进了什么境地？那一刻，我知道我必须计划如何摆脱财富500强公司的工作世界。\n\n没过多久，我成为了一家经济咨询公司的第六名员工。那次职业转变真是太棒了。在那种环境中，我能够根据自己的技能和兴趣与公司目标契合度，开辟出自己的道路。\n\
  \n26岁时，我搬到东京，筹备该公司的日本办事处。我从在大公司里实实在在地打卡，变成了自己初创公司在总部以外唯一的员工。很快，我就在高层面上开展业务，并有所作为。我简直乐在其中！我距离管理团队6500英里，再加上12小时的时差，这意味着纽约的其他团队成员都在睡觉时，我在工作。这也意味着我拥有完全、彻底的自主权。我再高兴不过了。\n\
  \n我在庞大的财富500强公司里做微不足道的小角色时的枯燥乏味，与我在一家小型创业企业中作为重要一员的新工作相比，真是天壤之别。关于我自己以及生活中重要之事，我学到的这些教训让我至今仍然不断追寻那种创业文化。\n\
  \n现在，我担任一些精选新兴公司的顾问，这些公司正努力通过提供颠覆性的产品和服务来改造自己的行业。我的咨询客户包括HubSpot，我在2007年开始与该公司合作，当时他们只有少数客户和不到10名员工。我帮助HubSpot团队将公司发展到覆盖90个国家、超过60,000名客户，年收入超过5亿美元。我在创业圈的顾问客户还包括Mynd、Expertfile、YayPay、SlapFive和InstaViser。我也是Stage\
  \ 2 Capital的市场推广有限合伙人，这是一家投资初创公司的风险投资公司。\n\n*成为创业超级明星*就是我在大学考虑从事商业职业时希望拥有的书。它深入探讨了创业文化，包含了关于成功、高增长组织内部生活是什么样的精彩故事。我发现自己每读一页都点头认同和欣赏。\n\
  \n这不是一本仅仅研究他人行为的学者写的学术巨著。史蒂夫·卡汉本身就是一位非常成功的企业家。他曾参与过多个成功的创业项目，也曾在大型公司的战壕里摸爬滚打。史蒂夫每页都提供了宝贵的见解。他是你的个人导师，引导你穿越创业世界。\n\
  \n这些页面中读到的故事会告诉你在初创公司如何成功地工作。根据我的经验，在超大型公司和初创公司中处理工作方式存在巨大差异，史蒂夫确切地告诉了你如何应对这些差异。在大公司里，政治规则盛行。取悦老板往往比服务客户更重要。而在创业世界里，情况恰恰相反：成功来自于你为发展业务所做的事，而不是你为迎合高职位的“大人物”的自我所做的事。史蒂夫用现实世界的例子指出这些差异，以便你能巧妙地驾驭自己的职业生涯。\n\
  \n初创公司为聪明、积极主动的人提供了巨大的机遇。而这些创业企业总是在寻找人才，寻找像你这样的人。CEO们总是告诉我，他们工作中最难的部分是找到那些能为公司带来改变的热情人才。\n\
  \n如果你想在一家公司工作，那里的每个人在鸡尾酒会上都能认出你名片上的公司名字，那么这本书不适合你。如果你想让别人告诉你在工作上该做什么，请另寻他处。然而，如果你渴望获得乐趣、有所作为、改变世界，请继续读下去！我们指望你呢。\n\
  \n> —— 大卫·米曼·斯科特，企业家、商业增长策略师，著有11本畅销书，包括*粉丝崇拜*和*营销与公关的新规则*  \n> www.DavidMeermanScott.com\
  \ @DMScott\n"
- '## 引言


  > 生命对我来说不是短暂的蜡烛。它是一支灿烂的火炬，我暂时握住了它，我要让它燃烧得尽可能明亮，然后交给下一代。

  > ——萧伯纳，剧作家


  我邀请你想象我们正在共进晚餐。那是一个温暖的夜晚，我们坐在户外的屋顶餐厅，俯瞰着一座明亮的大城市。当太阳沉入柔和的橙色光芒中，建筑的灯光照亮了下方街道逐渐加深的蓝色时，我们谈论你的大学经历。当你告诉我你所获得的认可；你与教授、同学和挑战你思维的朋友之间体验到的深厚情谊时，你脸上容光焕发。你表达出对教育框架结构的渴望，在那里，成功必然降临到努力工作的人身上。


  然后，我们的话题转向了你目前的工作状况。


  你深吸一口气。在大学期间，你曾想象未来会有那么多的成功和收入，但现在你就在这里，满腹知识，准备好运用它，准备好证明自己——但你被困住了。你被困在一份晋升似乎遥遥无期的工作中，你的生活缺乏你所渴望和期望的丰富多彩。你想想你的同龄人，虽然有一小部分幸运儿似乎已经富有而幸福（至少根据他们的社交媒体发帖来看），但你和其他大多数人仍在勉强维持生计，试图规避那些前述的、你不能再延期偿还的学生贷款所带来的风险。你希望得到一个重大突破或一段好运连连的日子，或者有一位导师关注你，帮助你走出这个你和年轻专业人士都陷入的职业困境。


  我就是那位导师，而且我正关心着你。这本书提供了一位导师的内部视角，他曾处于与你们完全相同的情境，并找到了一条前进的道路——不仅是一份好工作，而且是一份伟大的职业和巨大的成功，既有经济上的，也有个人上的。我想帮你发现自己的道路，成为你以前可能忽视或认为风险太大而放弃的世界的勇敢领导者：科技初创世界。


  虽然为初创公司工作似乎比为大型公司工作风险更大，但潜在的回报远远超过风险。而且，如果你够聪明，你就能化解风险。我将向你展示机会在哪里，如何利用这些机会，以及如何选择一家最有成功可能的初创公司——无论你的目标是技术还是非技术岗位。


  你是否曾感到工作陷入困境？你是否曾想知道自己如何才能达到想象中的成功水平？你并不孤单。2019年，在强劲经济和低失业率的背景下，大学毕业生却很难找到工作。毕业时，75%的人根本没有确定工作。普通大学毕业生平均花了近八个月才找到工作——而这一切的背景是，平均学生贷款债务为41,810美元。再加上同年美国和加拿大只有31%的员工感到工作投入，我相信这意味着我们面临着一场严重的流行病。


  这场流行病并不新鲜。它几乎感染了我。





  传统的企业规范。你可以开始培养这些领导力特质和创业心态，它们能推动你登上顶峰并让你留在那里。这些特质是大学或企业内部学习与发展团队在职培训中不会教你的。这些是那些缺失的领导力技能，将帮助你脱颖而出，跻身顶尖行列。它们会将你成功的潜力变为现实。它们将帮助你汲取经验教训，从而在工作和生活中做出更好的决策，获得更佳的结果。


  简而言之，忘掉攀爬企业阶梯吧；我将向你展示如何像火箭一样飞速越过每一级台阶，以最快速度进入高管团队。前所未有的机遇正降临，让你能高速攀升至巅峰。现在是全力出击的时候了。

  '
- '# 第一部分：最好的机会在于初创企业


  科技初创企业遍地开花，它们急需人才。你不需要成为技术宅才能在科技公司取得成功。这些公司需要各种各样的人才，需要有宏大想法并具备领导才能将其变为现实的人带来的创造力。

  '
- '## 第一章：利用科技初创热潮极速前行


  > 初创企业是“你能找到的最大规模的反抗者、规则破坏者和非常规思想者群体，他们致力于在世界创造突破性的变革。”

  >

  > —Chris Kane，Munchmoney 联合创始人兼首席执行官


  想象这样一个场景：最后一学期的教室里挤满了学生。教授让大家举手——谁计划申请财富 500 强公司，或是前五大科技巨头？一片手臂举起。初创企业？寥寥无几。这就是我的朋友、德克萨斯大学奥斯汀分校麦考姆斯商学院教授
  Josiah Sternfeld 向我描述的场景。


  我感到惊讶。我整个职业生涯都在一连串科技初创企业中工作，在这个过程中赚了数百万美元，结交了无数朋友，留下了不可磨灭的记忆。在我看来，如此多的商学院学生不考虑初创企业，同时如此多的年轻公司却陷入人才短缺，这毫无道理。在如此多的年轻失业者和就业不足者的背景下，我试图想象为什么如此少的人举手申请科技初创企业的职位。也许是因为背负着巨额学生贷款债务，他们担心在一家没有业绩记录的公司工作风险太大。


  但我不得不怀疑，那些热衷于追求财富 500 强职位的本科生最终是否都找到了工作。我认为是没有的——正如我的朋友发现的那样，*每个人都*想为这些公司工作。大型公司拥有品牌、声望，提供稳定性，而且由于收到的申请数量巨大，它们有资本进行高度筛选。


  我进行了一些研究，结果正如我所料，许多“大公司否则就崩溃”的毕业生在职业世界中并未享受顺利的成功。根据劳动力分析公司 Burning Glass Technologies
  的报告，¹ 14% 拥有学士学位（或更高学历）的年轻成年人处于失业状态，² 43% 处于就业不足状态。


  那么，这里发生了什么？为什么如此许多聪明、精力充沛且富有创造力的年轻人难以找到有价值的工作？为什么许多应届毕业生发出数百份申请，结果仅仅换来一两个面试机会？


  我阅读了更多文章，发现许多曾经充满希望的毕业生变得心灰意冷、挫败感强，最终从事服务业工作并与父母同住，舔舐伤口后再去攻读 MBA。或者，就像我刚大学毕业时那样，他们陷入了一些死胡同、痛苦的工作，等待着可以辞职的那一天。


  如果这种场景听起来很熟悉，如果我描述的人是你，请振作起来。情况不必如此。我曾经身处你的困境，但我找到了一条出路，且从未回头。你有其他选择。还有很多。如今，你可以在科技初创企业中找到巨大的机会，而且你不必是技术专家。


  ¹ 美国教育统计中心（IES）。2017 年 25 至 34 岁人群的就业率。https://nces.ed.gov/fastfacts/display.asp?id=561.


  ² Melissa Korn. “43% 的大学生毕业生在第一份工作中就业不足。” *华尔街日报*（2018 年 10 月 26 日）。https://www.wsj.com/articles/study-offers-new-hope-for-english-majors-1540546200.


  ### 科技初创企业前所未有的机遇


  首先，让我们看看什么是初创企业。根据美国小型企业管理署（SBA），初创企业是成立不足一年的公司。然而，这并不能很好地描绘初创企业的真正定义。我的朋友 Doug
  Erwin，RedHouse Associates 的主席和负责人，也是一位连续的科技创业者，提供了一个更具指导性的定义。在他看来，初创是一个阶段。他说：“如果一家公司运营起来像最后一块法外之地的边疆，一个非主流人士可以生存、创造并销售其想法的世界，那么它仍处于初创阶段。”


  谁不想参与其中呢？在初创企业，你可以扮演那个亡命天涯的狂野反叛者，那个无拘无束的新来者，去骚扰那些步履蹒跚、墨守成规的旧势力。如果你去任何一家财富 500 强或大型科技公司工作，你就会变成那些笨拙的法警之一——一个齿轮，打卡上班，在神志不清中推诿公文，度日如年。


  “当然，”你会说，“这听起来很棒。但我怎么进去？”嗯，好消息是，初创企业正在以前所未有的速度激增。根据*全球创业监测报告*，全球范围内，*每秒钟就有三家新初创企业成立*。³
  这意味着每年有 1 亿家。³ 在 2017 年，仅在美国，创业者就创建了 404,000 家新初创企业。⁴


  初创企业的增长以及向上流动的潜力，在我职业生涯所在的技术领域尤为强劲。我最初在科技初创企业的经历开始于 30 多年前——远早于这次繁荣。如果说有什么不同的话，现在这个领域提供了更赚钱的机会，因为新技术渗透到了我们世界的方方面面——我们如何工作、交流、旅行、用餐、锻炼、购物、管理健康、转移资金、消费娱乐，甚至如何与宠物互动。


  ³ Manoj Madhusudanan, “快速成长的新兴企业是 B2B 销售的绝佳目标,” Ziligence Blog (2018 年 7 月 16 日),
  https://ziligence.com/blog/2018/07/16/fast-growing-emerging-firms-are-great-targets-for-b2b-sales/.


  ⁴ 美国小型企业管理署倡导办公室，经济研究办公室年度报告，2017 财年，https://www.sba.gov/sites/default/files/OER_2017_Annual_Report.pdf.


  自然，科技部门已成为美国经济最大的组成部分之一。根据 CompTIA 的《Cyberstates 2019》报告，2018 年，美国有近 503,000 家科技企业在运营，标志着连续第六年增长。5
  在以小型新兴科技企业为动力的推动下，美国科技部门的就业人数在 2018 年达到 1,180 万，自 2010 年以来，每年平均增加 20 万新增就业。⁵ 科技繁荣正在进行中，对于那些愿意迎接挑战的人而言，有巨大的机会获取回报。


  如今，这一点尤其真实，因为大量资本涌入科技初创企业，且没有停止的迹象。从 2016 年到 2018 年上半年，44,000 家初创企业获得了超过 2,820 亿美元的融资。其中
  41%，即近一半，是科技公司。⁶


  然而，初创世界的日子并不全是一帆风顺。市场充斥着想法和产品，因此为了成功，科技初创企业需要的不仅仅是资金。它们需要独特且有价值的产品或服务，坚实的商业计划，明智的广告，有效的管理，以及高客户留存率。当然，你不能只是出去购买这些中的任何一样，这意味着科技初创企业成功主要需要一样东西：强大的人才团队。


  根据一项针对科技初创企业首席执行官的 2018 年调查，66% 的人说让他们夜不能寐的头号问题是“招聘优秀人才”。不是获取客户，不是收入增长，也不是融资更多。⁷
  虽然这看起来可能违反直觉，但其实是显而易见的——一家公司只能发展到其管理者所能带领它达到的高度。


  在同一项调查中，60% 的首席执行官表示，2018 年比 2017 年更难招募人才。因此，找到合适的人才是一个




  问题，而且还在恶化。再加上45%的科技初创公司CEO预计在接下来一年里会招聘6到20名员工，13%的人表示他们预计明年会招聘超过51名员工，你就会明白这是一场人才荒。


  现在，你可能会认为科技公司想要填补的所有这些职位都是软件开发人员和程序员。并非如此。他们还需要销售、市场、运营、财务、设计和人力资源等岗位的员工，仅举几例。


  为什么初创公司很难找到优秀人才？很大一部分问题在于应届毕业生一心只想着为大公司工作。尽管科技初创公司提供了大量福利（本章后面会讨论），它们仍然不得不与老牌巨头竞争。在科技公司最集中的地区，如纽约和旧金山湾区，谷歌、Facebook和苹果这样的巨头吞噬了大部分人才。在其他地方，《财富》500强和本地老牌巨头会派代表参加学校的招聘会，在那里物色并招募他们需要的人才。你永远不会在学校的招聘会上看到初创公司。它们无法从日常运营的全员投入中抽出人力或资金。通常，初创公司需要招聘能够远程工作的人。但你能想象硅谷或西雅图的初创公司派一个团队去堪萨斯州的劳伦斯以及其他一千个拥有大学的小城镇寻找人才吗？它们做不到。


  这意味着初创公司极度渴望聪明、自我驱动、有创造力、勤奋、有远见的人，他们愿意在一个充满活力和机遇的创新工作场所贡献自己的才华。而且他们不只是寻找技术人员。他们需要各种类型和不同经验水平的人——艺术型、技术型、年轻的和年长的、经验丰富的和初出茅庐的、坐班的和远程的。


  请注意，我并没有说初创公司只是在寻找“拥有常春藤盟校MBA和名门人脉的有才华的人”。如今最有价值的大公司（如苹果、亚马逊、Airbnb或优步）在不久前还是起点卑微的初创公司。它们最初的团队成员并没有带着哈佛MBA和企业多年工作经验加入。事实上，引入具有传统商业背景的领导者很可能会阻碍这些公司的成长能力。


  如今的初创公司有伟大的想法，资金充足，它们需要能够加入团队并帮助实现愿景的人。它们找的就是你。所以，如果你有创业精神、充满活力、渴望学习和努力工作，那么对于合适的初创公司来说，你可能是天赐之才。


  我知道你可能会想：“这不适合我。初创公司世界风险太大了。公司倒闭了怎么办？我还有学生贷款。我想组建家庭。而且，当然，史蒂夫，你赚了几百万，你过着这种精彩的生活，但你怎么知道你不是运气好？”


  或者你可能年纪稍大一些，在一份无聊、没有前途的工作上干了很久，害怕迈出这一步。无论如何，你越早放弃借口，就能越早摆脱这种困境，去寻找绝佳的机会。如果你认真想要快速晋升到高管层，并且准备好迎接快节奏、刺激的工作环境，那么科技初创公司就是你的选择。


  我知道我已经说过这一点，但我再怎么强调也不为过：你不必是技术人员也能成为科技初创团队中宝贵的一员。我在六家科技初创公司担任过高管职位，但我一行代码都不会写。史蒂夫·乔布斯与史蒂夫·沃兹尼亚克相比是个技术恐惧者，然而凭借他的其他技能，他成为了苹果公司的代言人，而苹果公司在撰写本文时是美国最成功的公司之一，并且可以说是历史上最重要的初创公司之一。


  我们还要记住，虽然大公司的工作看起来更稳定，但从来没有什么真正的保证。而且，如果你按照本书中的建议挑选最适合你的初创公司，这将大大降低选错公司的风险。当然，如果我这样成功过一次，那可能是运气。但两次？三次？四次？五次？六次？你明白我的意思了。任何事情都有一点运气成分，但我相信，大多数人所谓的“运气”实际上是专注努力和准确思考的结果。你需要努力工作，并在创造机会时明智地加以利用。而且，好吧，如果你真的满足于失业和父母住在一起，或者你喜欢现在的工作因为它节奏缓慢且要求不高，那么你尽管留在原地。但如果你感到无聊，如果你觉得自己还能贡献更多，如果你想玩更大的游戏，那就勇敢跨越这一步。继续读下去。


  ## 为什么选择初创公司而非大公司？


  几年前，微软向我抛出一个高级领导职位，其中包括高薪待遇和搬到西雅图的机会。这很诱人。我当时在Bindview这家初创公司工作，负责营销并帮助领导公司。但我在那里的角色很快就要结束——赛门铁克，一家更大的公司，正在收购我们。虽然我本可以继续留在赛门铁克，但我并不真的想这样，这让我面临两个真正的选择：微软，或者找另一家初创公司。


  从表面上看，这似乎是一个简单的选择。这种在微软的高级管理职位是许多人梦寐以求的。而且微软在努力争取我。他们安排我和妻子飞到雷德蒙德，在那里我与几位关键高级主管进行了面试。后来，他们组织了一场盛大的美味晚宴，我有机会与可能成为我同事的人见面并共进晚餐。他们带我参观了史蒂夫·鲍尔默和比尔·盖茨的办公室。他们提出让我们住进他们美丽校园附近湖边的临时公司公寓。我见了将在我团队中工作的人，以及我要向其汇报的人，我们都很合得来。最重要的是，他们提供了一个极其慷慨的薪酬方案。而且，作为一份贴心的个人关怀，他们发现我儿子喜欢电子游戏，就送了他一台Xbox。


  我整个职业生涯都在初创公司工作。我比任何走传统路线的人赚钱更快，而且以前从未想改变这一点。但微软如此有说服力，我认真地考虑了一下。我写下了利弊，与我的导师交谈，并与妻子和孩子讨论。我妻子很喜欢这个想法，尽管这意味着要搬家并让孩子转学。当我们去西雅图参观园区时，天气异常晴朗，太平洋西北地区在她看来就像人间天堂，这也有帮助。孩子们也同意——Xbox已经起到了作用。


  然后，一天清晨我在思考这个offer时，想象自己会如何改变公司网站以抓住一个紧迫的市场机会，然后我想到了我必须经历的大公司官僚程序，我猜想那会像试图让一项法案通过国会一样困难。我打电话给招聘经理，请他举例说明他的团队是如何推动这样一项变革的，他证实那需要像慢动作一样跳过层层障碍。


  在那通电话之前，我几乎已经接受了offer。但听到我要趟过的大公司繁文缛节，我意识到接受那份工作会让我痛苦不堪。我无法让自己离开那种高飞的初创氛围，在那里我有自由以量子跃迁的方式推动变革，而不是一点点增量。


  选择把你的才华贡献给初创公司而不是大型老牌企业是一个重大决定。两个选择都有利有弊。但如果你有创业心态，你会发现，就像我一样，初创公司可以提供巨大的好处。以下是我认为最重要的六点。


  ## 成为初创公司巨星


  ### 更低的入门门槛


  虽然大公司通常倾向于招聘常春藤盟校毕业生、人脉广泛或在高层职位有丰富经验的候选人，但初创公司关注的是别的东西。它们选择招聘那些有创造性思维、愿意努力工作、展现出原始领导素质的人，这些素质一旦得到培养，就能帮助公司（和个人）取得突破性成功。记住，这是打地基的阶段——每个早期员工都在公司的建设和发展中扮演着至关重要的角色。






  Start-up entrepreneurs are creators, not maintenance workers, and start-ups need
  visionaries at every level. In addition, tech start-ups are so desperate for A-plus
  talent that they tend to be more flexible about terms and willing to hire employees
  to fill remote positions, regardless of whether they live near a cornfield in Nebraska,
  a beach town in Florida, or in the heart of Karachi.


  ## 角色多样性


  Most jobs in big, old-school companies offer a limited range of authority, meaning
  no single individual, besides perhaps the CEO, has the ability to influence the
  entire company in a significant way. When you get hired to fill a role at an established
  business, that’s exactly what they expect you to do: fill that role. It’s rare,
  if not impossible, to find the freedom to experiment and try your hand at filling
  different roles within various departments. Large companies don’t want you to even
  think about how or where you could contribute in new ways, yet this level of agility
  is the norm at a start-up.


  Most start-ups don’t hire with a set idea of your potential or career path, because
  the start-up is young and undergoing massive change. Founders may find it hard to
  predict what the company’s needs will be as it grows. This is the perfect environment
  to try on different hats and find your zone of genius—the area where you work best—then
  move up quickly from there.


  When I began at start-ups, I worked in sales, customer support, and professional
  services before finding my zone in marketing. From there I was able to build deep
  experience and expertise in marketing and zoom to the C-suite as CMO.


  ## 接触领导者


  Working for a start-up, you can come in at an entry-level position and end up working
  on big, world-changing projects with the founders where your contributions will
  be seen and noted.


  ## 成为初创公司超级明星


  When I was 25 and working with the start-up KnowledgeWare, I was involved with a
  high-stakes project and charged with creating a plan to get existing customers to
  convert, for a small fee, to the new version of our products on a new operating
  system. The founders didn’t want to distract the sales team from attracting new
  customers, and so they asked me to lead the initiative. At the time, I was young
  and mostly untested. This assignment, however, had me meeting with the vice president
  of marketing and the CEO, weekly at first, and eventually we met daily. I had been
  given a tremendous opportunity, and I didn’t want to squander it. I was laser focused,
  and they noticed. Toward the end of the assignment, the company had a dinner in
  my honor and presented me with a special achievement award.


  This was a watershed moment for my career. Beyond the obvious reasons—winning an
  award, developing a close rapport with higher-ups—the experience had put me in a
  kind of pressure cooker that spurred rapid growth. I had to create proven results,
  and learn how to on the job. The fact that the higher-ups had selected me to handle
  this assignment served as a massive confidence boost, because I felt like the top
  executives had seen something in me that I hadn’t yet seen in myself. This, in turn,
  helped me take on even more high-stakes projects. This success begot other successes.


  After I delivered on the first project, the company wanted to build a plan to develop
  a consultancy service. They hired an external senior consulting executive to handle
  the implementation. He bungled it, and because they had the confidence in me after
  my handling the OS switch, they asked me to lead that team. I had never done consulting
  before, but learning once more on the job, I added another tool to my box, another
  cross-discipline competency, which ultimately increased my value as an executive.


  Now, let’s imagine: what if I had been a new hire for Google at the same age with
  the same shortage of experience? I wouldn’t even have sniffed a project of that
  caliber. I’d have been stuck in some entry-level position within a tiny scope, and
  miles of corporate ladder between me and senior leadership. In a pool the size of
  Google,


  with so many other swimmers, it’s easy to drown. But at KnowledgeWare, I swam circles
  in the kiddie pool.


  ## 财务回报


  If you aspire to work in a big corporate environment because you think you want
  the security, predictability, well-defined processes, and better pay (sometimes)
  from the start—beware. What you’re really buying into is limitation. I see it all
  the time in my dealings with large corporations: the old corporate mind-set is filled
  with bureaucracy, politics, boredom, pigeon-holed roles, and fewer opportunities
  for employees to shine. All of this translates to minimal financial rewards. It’s
  hard to stand out in a company with thousands of employees.


  Go to work for a big company, and you’ll get a paycheck—a paycheck and a 4% annual
  raise along with a formal review from a manager who dreads delivering it. The *potential
  upside* is far greater at start-ups. And the initial financial rewards might not
  be too bad either. Depending on the size, cash flow, and product launch status,
  a start-up may offer a competitive salary right off the bat, or it may start you
  off with a modest salary with the potential to own a piece of the pie through stock
  options. The stock options could lead to astronomical compensation later on, if
  the company is successful.


  In my opinion, always go for the stock options. A good rule of thumb: the earlier
  you get in at a start-up, usually the better. For example, if someone joined Thycotic
  in 2019 and took stock options, they’d get their options at the current fair market
  value, which, for the point of this example, let’s say is $10, while if you’d gotten
  into Thycotic at the ground floor when the options were valued at, say, $3, then
  you would have gained $7 per unit. The earlier you get in, assuming the company
  grows, the more money you can end up making.


  The second piece to stock options is just how important they can be for personal
  wealth. In my experience, as you grow in your career and move up the ladder, you
  have the opportunity to make more money. And, as you get older, you get new responsibilities.


  You have a family, you want to buy a house, you want to invest in your children’s
  education, the list goes on. The point is, you constantly find new ways to spend
  money. So, even though your salary is increasing, and even though your bonuses are
  increasing, your actual personal wealth doesn’t grow because your expenses increase
  at the same time. And while some people are more diligent about saving and investing
  than others, the amount of money even the most disciplined person can accumulate
  pales in comparison to what you can make through stock options, for the simple reasons
  that those assets are less liquid, and they can increase in value very fast, so
  you may consider holding on and riding the wave of value creation. In the actual
  handling of stock options, of course, there are all sorts of rules and regulations
  that dictate when and how you cash them out, so that will vary on a case-by-case
  basis.


  The bottom line is this: when it comes to investing, where I’ve found the biggest
  gains, and where I feel the most confident, is betting on myself and the team I
  work with. When you invest in the general stock market, picking up stocks in other
  corporations that you’re not involved in, you’re betting on things outside of your
  control, like if the oil prices will hold, or if the CEO, who you don’t know at
  all, will run the company well. The smart move is to keep your money where you can
  play a direct role in its growth, and you have direct knowledge in the day-to-day
  operations. Do note that not all start-ups offer options, and that is something
  to consider in your selection process, but we will handle this in more depth later
  in the book.


  ## 企业文化


  Remember that earlier quote about being the last outlaws on the frontier? About
  being the freewheeling, quick on the trigger, rebel with a cause ethos of a start-up?
  I can tell you from my experience, it’s true. When you’re working for the right
  start-up, that’s how you feel. And like any band of outlaws, you and your co-workers
  will develop the kind of community that can only exist in a small company of rebels.






  例如，在我担任 PentaSafe 英国办公室团队负责人六个月期间，我与一个名叫 Dave 的男人共事，他从不笑。他是个好人，但干巴得像砖头。有一天，有人第一次看到他笑了，于是拍了张照片。因为我们知道他不会介意，我们复印了数百份照片并挂满了整个办公室。第二天他来上班时笑得前仰后合，其他人也一样。合适的初创公司的环境和文化会鼓励这种乐趣和同志情谊。


  这就是为什么初创公司世界的*文化*首先让我远离了枯燥的公司工作。我甚至没有想过显赫的头衔或巨额奖金的承诺，我并不是唯一有这种感受的人。数据也支持这一点。文化与员工参与度和幸福感有很大关系。即使在长时间工作和艰苦劳动中，初创公司，尤其是资金充足的初创公司，通常也知道如何帮助创造力蓬勃发展。午餐时你还能找到乒乓球锦标赛，或是下午晚些时候在茶水间喝康普茶聚会吗？


  当一家公司为员工提供乒乓球桌、台球、电子游戏、开放空间甚至免费零食等减压工作场所设施时，一切都显得很初创风——但归根结底是人的文化，而不是设施。拥有所有这些东西可能会很棒，或者即使有这些，环境仍然糟糕。我曾在一家提供此类福利的初创公司工作过，也曾与
  Thycotic 等初创公司共事，我们都挤在隔间里，但我们不在乎。我们受到激励并与一种目标感保持一致，而这比游乐空间更能衡量一家公司的文化。


  2017 年的一项调查显示，公司文化是人才选择新工作时最重要的因素。⁸ 然而，文化变革对大公司来说仍然难以捉摸。根据盖洛普 2017 年的 *State of
  the American Workplace* 报告，只有 33% 的美国员工在各规模公司中在工作中感到投入。⁹ 这意味着 67% 的员工没有投入，我们可以有把握地说，其中许多人就隐藏在老牌垄断公司中。这些员工只做被分配的工作，什么都不多做。这扼杀了创造力，并切断了任何成长的可能性。沮丧和无聊，员工像影子一样出现，按部就班，做最少的事情以维持生计。如果足够多的人躲起来，它会慢慢杀死一家公司，股东价值也会受到打击。但对我来说，真正的悲剧是成千上万工人的创造力、独创性和对成长的自然驱动力，在被
  relegated 到狭小、灰色的隔间里从事重复性任务多年后被扼杀。


  ## 上升流动性


  如果你有足够的驱动力，攀登老牌公司的企业阶梯是可能的，但要做好缓慢攀爬的准备。老牌公司背负着老牌思维。晋升的障碍很高，机会很少。如果你立志进入财富 500 强甚至财富
  1000 强公司的 C 套房，你的机会严重受限。在这些公司中，只能有 500 家或 1000 家 CEO 席位，也许在整个套房中还有 2,500 到 5,000
  个席位。这意味着你获得财富 500 强公司 C 套房工作的几率低于被美国国家橄榄球联盟选中的几率——低得多，考虑到 NFL 每年选秀 224 名新球员，¹⁰ 而人们往往在
  C 套房停留的时间比这长得多。


  将这些数字与美国的 46,500 家初创公司¹¹ 相比，很容易看出初创公司有更多的高管领导机会。如果你相信你的职业命运是成为一名领导者，你可以找到一家具有动态、快速发展的环境、重视主动性并提供快速晋升机会的初创公司。


  当然，最好的机会往往伴随着风险。当你将才华与初创公司分享时，你必须准备好快速行动并适应不断变化的环境。没有躲藏的地方。但凭借初创公司的思维方式和努力工作，你可以收获回报。


  最后，关于前面提到的观点，初创公司所赋予的这种多功能性有助于让你快速进入 C 套房。关于成为 CEO 的最快路径的《纽约时报》报道指出，“拥有尽可能多业务职能领域的经验非常有帮助。一个人如果在比如财务部门埋头多年，达到最高执行职位机会会更少，而一位不仅在企业财务方面有专长，还曾在营销、或工程、或两者兼有等领域工作过的公司财务专家则机会更大。”¹²


  当 James Legg 现在担任 Thycotic 总裁兼 CEO 时，他大学毕业后很高兴在一家名为 Computer Associates 的大公司担任客户经理，但三年内公司收购了其他公司，员工人数从
  500 人激增到 5,000 人。他对增长着迷，但不喜欢庞然大物的地位，于是跳槽到 BMC Software 公司，在那里获得了第一个管理职位，并为工作搬到了加州。但很快，这家公司也成长到
  Legg 发现大公司的弊端以及他不想留在其中的原因。“在一家大公司工作很棒，但在那种环境中，我产生影响的能力严重受限。我喜欢建造东西和解决问题，我很好奇我如何建立一家公司、取得进步并将其定位为领导者。我不能在大公司做到这一点，但我可以在初创公司做到。”此后他曾在一系列初创公司担任顶级领导，他的作品可以直接影响底线和世界。¹³


  考虑到所有这些，加入一家科技初创公司似乎是显而易见的。我不想给你错误的印象。然而，确实存在明显的缺点，初创公司世界并不适合所有人。你会经历长时间的工作，而且由于你会很早就参与高风险项目，边学边做，并随公司成长，你会面临很多压力。你将承担比在老牌公司典型初级职位更重的
  workload 和更大的责任。而且在很大程度上，你会因所有这些额外工作而获得更低的薪水和更少的职位保障——起初是这样。


  但，它可能有巨大的回报。


  2018 年春天，我坐在纽约一座摩天大楼顶层的董事会会议室里，俯瞰中央公园。我看到在完美的蓝天下萌芽的树木的明亮绿色。我们刚刚结束一次成功的董事会会议。凝视着这美丽的景色，我回忆起我第一份公司工作时处理索赔的工作。那份工作如此无聊，没有人能付得起让我留下。


  但在那一天，我想：“我会免费做这份工作，但相反，我得到的报酬比我 25 年前坐在隔间里处理索赔时梦想的还要多。如果我从未冒险尝试科技初创公司呢？如果我没有问自己是否还有另一种方式来创造成功的职业生涯呢？”这些都不会发生。我会困在那条职业道路上，像大多数人一样，永远无法摆脱困境。


  好奇心把我从那个隔间带了出来，让我提问并找到榜样，最终使我能够在科技初创公司世界中为自己开辟道路。


  你可以创造一个类似的故事。如果你不让它成为你的故事，它将成为你同事的故事、你室友的故事，或朋友的朋友的故事——因为科技初创公司市场正处于长期繁荣期，有空间让你加入并蓬勃发展。


  md: 'Recently I had an opportunity to coach Maria, a very smart and ambitious engineer
    in a very successful firm. She was also the only female engineer at her executive
    level. Although she stood out at work, she would try to disappear in staff meetings.


    I asked her, “Maria, what is happening in these meetings? What triggering event
    or circumstance happens where you would say to yourself—I add no value in our
    meetings and must stay quiet?”


    “Michael,” she said, “when I’m in these meetings, I am sitting there with all
    these bright, intelligent engineers. I know they have more experience and are
    smarter than I am. Nothing I say can say will sound intelligent to them. So I
    don’t say anything at all. I sit there in silence knowing that my voice and contribution
    in our meetings won’t matter.”


    “Maria,” I responded, “why don’t you think your perspective matters? Why do you
    believe this voice that tells you you’re not smart enough? How can you silence
    that inner critic that says you are not smart enough, your voice and opinion doesn’t
    matter, and that you’re stupid compared to everyone else? How can you reframe
    this situation so these negative thoughts stop influencing your behavior?”


    Maria determined that when these negative thoughts or feelings surfaced in moments
    of insecurity, she wanted to be more assertive and to amplify her voice.


    “I do have an inner critic that sabotages my voice and silences me,” she shared.
    “And it diminishes my voice and my value at work and in other key relationships
    that are important to me. We explored two key strategies that she could do when
    these negative triggers appear: 1. Focus on her gifts, strengths, and talents
    and how she could best add value to the group. 2. Get curious and ask questions
    in areas where the team may struggle, need to solve problems, or need to focus
    on customer value, partner support, and market opportunity.”


    Recognizing that coaching is not counseling or therapy, how would you coach someone
    like Maria to help her reframe her inner narrative? Here are some questions that
    might help a client, a partner, or a direct report overcome a limiting mindset:


    +   Can you think of a time when you might act or respond negatively or reactively?

    +   What triggering event influences you to go negative or pessimistic, or to
    be reactive?'

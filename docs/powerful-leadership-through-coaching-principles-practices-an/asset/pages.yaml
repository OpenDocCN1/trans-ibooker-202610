    One of my clients, Ashley, switched jobs in 2002 during a down economy. She had
    taken a pay cut for something a little more stable but still ripe with opportunity.
    “I thought that I found a really good fit for me,” Ashley admitted. As a mid-level
    executive, she was promised everything from the opportunity to lead high-level

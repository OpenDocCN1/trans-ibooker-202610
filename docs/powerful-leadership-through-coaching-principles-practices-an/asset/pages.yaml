    # Coaching through Potential Burnout


    > > *Dear Stress, I would like a divorce. Please understand it is not you, it
    is me.*

    > >

    > > —Thomas E. Rojo Aubrey (2019)


    This last area—burnout—is paradoxical because it can affect team members who are
    intensely and maybe even excessively engaged. They are often your most valuable
    people; because they are so valuable, they are often overburdened and risk breaking
    down.


    For example, a great executive that I coached was worried about losing one of
    his best managers. Her name was McKenna. She was a very hard worker and was good
    at execution. Her work ethic was impeccable. She always came in early and left
    late. She connected well with people and was very empathetic to those around her.
    She was on top in her production with nearly 100% of the assignments that she
    was given. An ideal employee, right? But this executive wasn’t worried about squeezing
    more productivity out of McKenna. He was a talent leader. He had enough vision
    to know there would be trouble ahead if she stayed on this path of aggressively
    doing too much.


    > > “In our organization, being the first in and the last out is not a merit badge
    for success. Staying in the fast lane with a focus on completing all the urgency
    tasks coming at you will lead to burnout,” McKenna’s boss says. “We value people.
    We value seeking balance in their lives and their families. We want to model the
    right culture of work-life balance from the top. It is critical for our people
    to look after their physical health, to manage the emotional costs of work on
    their personal life, to effectively manage time with personal and family relationships
    off the job, and then find a way to scale things back to achieve that balance.”


    With McKenna, his coaching agenda was all about helping her find work-career-life
    balance. This is coaching at its best. Nothing was “wrong.” Nothing was “broken.”
    But the risk of future problems was real. We’ve all seen it. The company keeps
    pushing for more and more'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'and more. If left unchecked, work can become 24 hours a day, 7 days a week,
    365 days a year.


    McKenna’s boss checked in with her frequently. They brainstormed creative ideas
    for achieving a better mix of work, career, and personal life. McKenna liked putting
    out fires, being in all the meetings, and making most, if not all, of the day-to-day
    business decisions. She needed to better engage her team members and better clarify
    roles, delegate and entrust her direct reports to make decisions, and work on
    getting out of their way—particularly on the more operational and tactical sides
    of the business.


    She realized that most days, she left the office late in the evening, and that
    wasn’t working for her. She decided to begin clearing emails between 2:00 and
    4:00 p.m. every day, instead of starting around 6:00 p.m.; the new timing would
    help her be home with her husband and children for dinner.


    For a long time, she had felt that her workday never ended. “It never feels complete,
    and I’m tempted to take it home with me and stay connected online all night.”
    An external coach was able to help her to establish a consistent ritual: she now
    took 15–20 minutes each day before leaving the office to plan the next day. This
    seemingly small ritual made a big impact. McKenna was gaining self-discipline
    as she became better organized. Coaching helped her plan, prepare, prioritize,
    delegate, entrust others, clarify roles, and stay at a more strategic level, while
    pushing the more operational and tactical tasks to her team members. McKenna now
    had the tools not only to elevate her own work and life, but also to enable those
    around her to learn and develop.


    We live in an urgent whirlwind environment with constant 24 × 7 access from emails,
    texts, calls, meetings, and social media posts from smartphones that push constant
    reminders and urgent requests with an endless onslaught of data and information.
    Work is demanding and can feel relentless. It’s becoming increasingly difficult
    to find work-life balance among our various roles and responsibilities. It is
    hard to switch on and off among the workplace, home, family, friends, communities,
    and those with whom we have daily interactions. Burnout can lead to anxiety, depression,
    insomnia, strained or ruined relationships, health issues, disconnection, fatigue,
    and resentment.


    We all have different capacities to respond to emotional stress, negative triggers,
    and physical strains. Burnout should be a wake-up call for all employers to help
    treat chronic stress that has not been'

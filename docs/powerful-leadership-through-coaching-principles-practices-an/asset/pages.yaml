- pgno: 146
  md: '# Listening with Empathy


    > To be with another empathically means that for the time being, you lay aside
    your own views and values to enter another’s world without prejudice. In a sense
    you lay aside yourself; this can only be done by people that are secure in themselves.

    > —Carl Rogers, American author and twentieth-century humanist psychologist


    When was the last time you spoke with someone who was a truly lousy listener?
    How did you know they were not listening? Was it the fact that they checked their
    phone or watch or email every few seconds? That they did not make eye contact?
    That they did not ask any follow-up questions? Did they try to interrupt you?
    Were they just waiting for their turn to talk?


    In contrast, think about some of your most powerful exchanges when you interacted
    with a great listener. How did you know they were really listening? Did they appear
    zoned in to what you were saying, and only what you were saying? Were they present,
    available emotionally, and focused on the moment at hand? Did they make and keep
    eye contact? Did they ask timely follow-up and clarifying questions? Did you feel
    that they were not simply waiting their turn in the conversation, but were fully
    engaged nonverbally and verbally in what you were saying?


    The times you feel listened to become priceless memories. You connect on a deeper
    level with those who listen, and you arrive at authentic understanding.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Evaluate Your Listening Skills


    Many leaders are not very good at listening. Great listening skills are the pathway
    to gaining more connected relationships, influencing others, and effectively diagnosing
    problems and issues. Much of work is emotional, psychological, and cultural. Effective
    listening allows us to check our title, position, ego, wisdom, and competence
    at the door long enough to show respect and real understanding of what is happening
    with others. Not only do great listening skills help to build better relationships,
    solve problems, understand issues, and resolve conflict; but they also help to
    improve quality, speed, commitment, satisfaction, and engagement.


    Here are some self-assessment questions to consider as you evaluate your own listening
    skills in the role of becoming a great leader-coach:


    +   - On a scale from 1–10, how good a listener am I? (1 = poor listener, 10 =
    very good listener.)

    +   - How well do I listen and show respect while communicating with others?

    +   - Am I fully present and engaged in coaching conversations?

    +   - Do I really want to set aside my agenda and listen with empathic accuracy
    to the other person’s agenda?

    +   - Do I create a safe environment for listening, confidentiality, comfort,
    and dialogue without distractions?

    +   - Do I interrupt others while they are speaking?

    +   - Do I schedule adequate time for the coaching conversation?

    +   - How well do I understand the other’s position, perspectives, and point of
    view?

    +   - Am I okay with silence?

    +   - Do I pretend to listen, or listen selectively?

    +   - Do I listen in a way that leads to creative dialogue, innovation, and improved
    performance?

    +   - Do I ask clarifying questions?

    +   - Do people feel understood, valued, and respected during our dialogue and
    conversation?'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Listening Empathically


    > Most people do not listen with the intent to understand; they listen with the
    intent to reply.

    > —Dr. Stephen R. Covey, professor, author, speaker, and businessman


    Great coaches take time to listen. Nothing makes a team member feel more supported
    and respected than an open-door policy where they can maintain a positive connection,
    offer input, and receive ongoing support and encouragement. Listening to your
    team members will do more good than almost anything else you do.


    Why do people love good listeners? Because a good listener always lets people
    hear their favorite speaker—themselves! As a coach, listen more and talk less.
    Great listening begins and ends with making the other person feel respected and
    important. Talk-show host Larry King once said, “I remind myself every morning:
    Nothing I say this day will teach me anything. So, if I’m going to learn, I must
    do it by listening.”


    Listening is a lost art. As a father and as a global consultant, teacher, and
    coach, I have witnessed that many of our employees and our children spend so much
    time seeking digital connection with others, and even the masses online, that
    many have a difficult time engaging in real-time, face-to-face, old-fashioned
    conversation. In a world where we’re increasingly connected online or with cellular
    devices, it’s a sad dilemma to consider that more access to efficient digital
    connections with people can lead to a lessening in the art of connection, conversation,
    and deep listening skills.


    Coaching allows leaders the opportunity to dust off that lost art. It’s absolutely
    required. To be a great coach, you must listen with empathy and truly care about
    understanding another human being.


    To listen well when practicing empathy, we must give up interrupting, advising,
    judging, interpreting, or evaluating. Good listening requires us to be completely
    present in the moment. It requires us to get lost in another person’s world in
    terms of context (the overall setting), content (what is going on from their perspective),
    and feeling (how they are emotionally reacting and responding). We can’t pretend'
  merge: -1
  img_proc: true

    *Key coaching questions:* Does this culture or organization tend to be more individualistic
    or more inclined to support collective views and behaviors for the greater good
    of society, organization, and group success?


    # 3. Masculinity and Femininity


    This section refers to the degree to which a culture is based on values that emphasize
    masculine and feminine traits. In masculine-oriented societies, the roles of men
    and women rarely overlap; gender roles are clearly differentiated. Masculine cultures
    are intended for men to lead and women to follow: people admire the achievement
    and accomplishment of men. They value male independence, aggressiveness, dominance,
    and assertiveness. Women tend to receive less pay and work in lower-level supporting
    roles and jobs.


    If you are doing business in a high-masculine country or culture, you need to
    recognize that gender, title, ego, power, status, and money outweigh other considerations.
    Examples of masculine-oriented societies include Latin and South America, Southeast
    Asia, China, India, the Middle East, Russia, and Eastern European countries.'

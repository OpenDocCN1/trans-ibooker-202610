  md: The best way to change the world is to become a great coach! Life can be hard
    and full of challenges and difficulties. It can also be an abundant, ongoing blessing
    and adventure. There are those leaders and managers who constantly inspire each
    of us to reach for new heights, to build upon our talents and strengths, and who
    challenge us to make a difference in the world. This book is dedicated to those
    powerful leaders and coaches in my life — my wife Cynthia Reeves-Simpson and my
    children Zachary, Luke, Jacob, and McKay. My family has shown love and encouragement
    to me throughout my life. They have been a constant inspiration and support with
    everything I have chosen to do. It is my hope to develop every leader and manager
    as a coach. My intent is for all coaches to help others dream big, achieve their
    goals, make good decisions, positively impact change in behavior through accountability,
    in order to connect with and inspire others. My hope is to add some effective
    tools to your coaching toolbox so that you will continue to impact the success
    of your life and the lives of those you lead. Enjoy the journey!

  md: '# Typical


    “Is that project going to be done on time?”


    Provocative


    “What stands in the way of meeting the project deadline?”


    >>>


    Typical


    “Did you do a quality check on that process?”


    Provocative


    “What quality issues concern you the most about that process?”


    Can you see the difference between the typical judgmental questions and the provocative,
    open-ended questions? Can you sense the difference in mindset between the two
    questions?


    The typical questions are diminishing and disempowering. You’re treating your
    team member like a servant who is expected to jump at your commands. The provocative
    questions are empowering: You’re treating team members like equals who can make
    their own professional judgments and decisions.


    Avoid putting people on the defensive by asking questions that by implication
    judge or diminish them. Move towards more open, exploring, collaborative, and
    creative inquiry without judgment.


    If your goal is to have an open conversation, use open-ended, nondirective queries:
    “Tell me about the situation.” “Why do you think about this?” “What is your opinion
    about?” “When this situation arises, how do you feel about . . . ?” “Why is this
    such a big issue for you?”


    Open questions tend to produce more information. Closed questions tend to produce
    short, limited responses. For instance, “Tell me more about how this all began”
    will produce more information than “Why have you been acting this way?”


    If your questions are met with silence, use the silence. In his book *Find Your
    Why*, Simon Sinek observes that silence is an important tool for a leader: “If
    you ask a question and feel they are struggling to answer, let them struggle.
    . . . Resist the temptation to fill the silence with another question or a suggested
    answer. . . . Emotions are difficult to articulate, and it may take the person
    a little time to formulate the right words” (Sinek 2017, p. 52).'

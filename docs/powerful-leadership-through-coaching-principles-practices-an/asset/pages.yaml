- pgno: 56
  md: 'Mindset is how you look at the world around you. According to Dr. Dweck, your
    mindset profoundly affects the way you lead your life.


    By the way, like individuals, teams also have mindsets. As you discover the collective
    mindset that drives a team’s vision, values, and goals, you can effectively test
    assumptions, tap into their strengths, and improve their decision-making and innovation.


    Examine your own personal mindset. Some mindsets can be realistic, some can be
    limiting, and others can be flat-out distorted, false, and wrong. It is your mindset
    asking questions like, “Why am I so smart?” or “Why am I so stupid?” “Why is everyone
    around me smarter (or more stupid)?” These inner conversations are the most important
    conversations you will ever have. Your conversation with yourself will determine
    the outcome of your life and dramatically influence all of those around you.


    Coaches can offer great insights into what motivates and influences mindset just
    by framing the right questions.


    # Overcoming a Fixed Mindset


    We generally categorize mindsets as either *fixed* or *growth* mindsets.


    If you have a fixed mindset, you believe that you cannot grow, improve, or change.
    You also believe you were born with a certain level of intelligence and certain
    personality traits. And that’s it. It’s fixed—it’s determined.


    By contrast, if you have a growth mindset, you believe that you can keep growing
    and learning with time, effort, and help. The sky is literally the limit. People
    with a growth mindset agree with the former American Major League baseball pitcher
    Roger Clemens: “I think anything is possible if you have the mindset and the will
    and desire to do it and put the time in.”


    One of your primary tasks as a coach is to help your clients discover *inner innovation*
    within themselves: a growth mindset rather than a fixed mindset (see Figure 3.1).
    With a fixed mindset, they cannot make much progress because they don’t think
    it’s possible. This is doubly true for you as the coach: you are not likely to
    help others if you are encumbered with a fixed, judgmental, or pessimistic mindset.


    Besides, mindsets can and do change. Those with a fixed mindset actually believe
    in an illusion—that nothing can ever change them.'

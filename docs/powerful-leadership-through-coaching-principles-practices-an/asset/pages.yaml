- pgno: 195
  md: '# Coaching for Contribution


    company exists without customers willing to pay money for a product or service;
    once you lose sight of your market, you will lose your value. And those needs
    change, meaning we must continually learn, improve, and adapt as we seek to add
    value. Similarly, in government, education, or nonprofits, the organization exists
    to add value to a societal need, community values, or a particular mission-driven
    need.


    Your contribution must drive one great overarching purpose: to serve a series
    of identified human needs. It’s not only a societal or marketplace imperative.
    We grow personally when we are giving of ourselves to others. Viewed this way,
    leadership really is a creative, innovative, and enabling art more than a science.


    According to some of the great psychologists—Abraham Maslow, Clayton Alderfer,
    and Frederick Herzberg—each of us has five basic areas of need: financial, physical,
    emotional, mental, and spiritual. As a coach, you guide your team through these
    five areas as they formulate the contributions they want to make. Help them to
    examine their skills, capabilities, talents, and desires to improve in each of
    the five areas.


    As your team members develop their own definition of what they can contribute,
    the following coaching questions might be helpful:



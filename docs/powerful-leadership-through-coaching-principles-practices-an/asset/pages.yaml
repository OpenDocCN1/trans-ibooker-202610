  md: 'and innovative frontiers ahead. I like to say that with an increase in globalization,
    the world of work is becoming smaller and smaller. With international trade and
    global outsourcing, as well as advances in technology, communication, and travel,
    the world is truly open for business 24 hours a day every day of the year.


    This reality means the competition to attract, retain, and engage global talent
    has never been more intense and competitive. There is a war for recruiting, developing,
    leveraging, and keeping the best talent. Thus, it makes sense that organizations
    are embracing global diversity and inclusion not only in trade and commerce but
    also in leveraging a diverse talent pool.


    Can you coach people to adopt a global mindset? Can you effectively engage a diverse,
    multicultural talent pool? Do you possess global self-awareness? Do you value
    diversity and inclusion? Hopefully, you can say yes to each of these questions.
    If not, keep open and practicing.


    Leaders who understand the significance of these skills can connect more effectively
    with others, understand and respect different worldviews, and improve learning,
    innovation, collaboration, and results. Coaches who demonstrate cross-cultural
    intelligence can build trust and rapport with others far more quickly and easily
    than those who ignore cross-cultural issues and the unconscious bias that exists
    within all people.


    However, engaging diversity is not simple. Like an iceberg, the elements of culture
    are often both visible and invisible. Figure 16.1 displays both sides of culture
    and diversity.


    While race, gender, work style, language, and behavioral norms are easy enough
    to see on the surface, coaches must be aware of the many attitudes that are not
    so perceptible. Religious values, national sensitivities, life experiences, orientation,
    and diverse attitudes and perceptions toward life need careful study and empathy,
    which are less visible beneath the surface.


    Therefore, managing global diversity requires a long-term commitment to coaching
    about handling differences across cultures. Business issues such as strategy,
    goals, values, leadership philosophy, and talent management can present minefields.
    Diversity touches nearly everything: recruitment, development, business transactions,
    partnerships, and relationships.


    One example of a successful diversity and inclusion initiative with coaching at
    its heart is GlaxoSmithKline’s (GSK) Accelerating Difference program. The aim
    of the diversity and inclusion program is to promote more women to senior levels
    within the organization'

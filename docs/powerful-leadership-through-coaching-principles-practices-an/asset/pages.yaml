    Author Andrew Sobel writes that the simplest question—“Why?”—can be wonderful
    and needed (as long as it doesn’t “come across as cynical, critical, or reproachful—especially
    when asked of a subordinate or a child”). Sobel says good questions are authentic,
    sincere, and non-manipulative (Sobel 2012). The most powerful coaching questions
    help:


    +   - Dig under the surface to uncover root causes

    +   - Clarify the issues and focus the conversation

    +   - Create a common understanding of the situation

    +   - Uncover dreams, ambitions, and aspirations

    +   - Understand and connect with the most important priorities and needs

    +   - Motivate people to see their own experiences and issues from a new perspective

    +   - Test for alignment with values

    +   - Reframe problems in more productive ways

    +   - Create learning and innovation

    +   - Inspire commitment

    +   - Lead people to draw their own conclusions

    +   - Validate and affirm your confidence in them


    For over three years, I taught as a part of the leadership faculty with Dr. Stephen
    R. Covey, Dr. Ram Charan, and Dr. Mette Norgaard at FranklinCovey’s Executive
    Leadership Summit in Deer Valley and Sundance, Utah. All three of my colleagues
    were master teachers, but Ram Charan, author of What the CEO Wants You to Know,
    stood out to me for his ability to ask very good, penetrating questions. He would

- pgno: 32
  md: 'to replace them. We have not developed the next generation of talented leaders
    that are prepared to take over. We have a huge talent gap!"


    This executive is not alone. All too often, organizations are unprepared with
    their leadership and talent pipeline. This lack of preparation poses a real strategic
    threat to any team or organization. What’s the solution? Coaching and development
    of your people. Coaches understand what is important for customers and the business.
    They understand how each business unit and team supports a shared leadership responsibility
    for vision, strategy, goal execution, and delegation. They also understand what
    is involved for employees to grow their skills; increase their decision-making;
    expand their roles and responsibilities; and increase their motivation, productivity,
    and engagement.


    Your top talent, and often your middle talent, will have multiple career choices
    and options outside of your organization. Some may feel like their job is a dead
    end. Others will have a bad relationship with the boss or other team members.
    Others find no significant purpose or excitement in their current roles.


    That’s why it’s urgent that you become the kind of coach I’ve defined here: a
    true partner who inspires others to maximize their personal and professional potential.


    # Coaching: What It Is and What It Isn’t


    > Coaching is unlocking a person’s potential to maximize their own performance.
    It’s helping them to learn rather than teaching them.

    > —Sir John Whitmore, founder of GROW Coaching Model and co-founder of Performance
    Consultants International


    I’ve known many leaders who tried to become trained as coaches but found their
    training didn’t work. It was too simplistic, boring, overly theoretical, not practical,
    or too academic. Others felt their coach training was from a different planet,
    taking them on a New Age–filled psychological journey loaded with mystical lingo
    with no relation to reality.


    In contrast, the coaching skills and tools in this book are practical and easy
    to use. They are based on years of testing, trial, and practice. My purpose is
    not to bore or mystify you, but to help you understand the basic elements of how
    to become a great coach.'

    situations.


    Changing behavior is hard, but people play differently in life and at work when
    they start keeping score. People also play better when they are treated better.


    In time, Anthony became a great leader-coach. He was able to be authentically
    helpful instead of hurtful.


    # # Becoming Emotionally Intelligent


    > > Emotions are contagious. We’ve all known it experientially. You know after
    you have a cup of coffee or a drink with a friend, you feel good. When you have
    a rude clerk and negative interaction in a store, you walk away feeling bad.

    > >

    > > —Dr. Daniel Goleman, author, speaker, and psychologist


    My client Alison helps manage corporate travel for an international company. Her
    team is small, around 19 people, but they can be tracking hundreds of travelers
    each day, ensuring that everything goes smoothly around the world.


    When she steps into the office each morning, she checks in with a couple of co-workers
    to see what they call a “mood check.” “Who has seen the boss? Was he smiling?
    Did he greet anyone on the way to his corner office? How is he today?”


    “It’s exhausting,” Alison confided to me. “Every day is a different mood, and
    we have to adjust everything we do based on that.”


    Unsurprisingly, turnover in the office is very high, with workers being fired
    or deciding to leave on their own. “Only four people have been here for more than
    a year,” Alison says.'

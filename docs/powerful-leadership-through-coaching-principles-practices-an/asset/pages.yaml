  md: '# PRACTICE: YOUR COACHING PLAYBOOK: LISTENING WITH EMPATHY


    In the Broadway musical *Hamilton*, Alexander Hamilton talks with Aaron Burr,
    who advises him, “talk less, smile more.” Here’s a coaching challenge: During
    the next week, pick one conversation where you talk less and listen more. In fact,
    make a concerted effort to talk less than the person you are talking to. Instead
    of talking, pause and reflect on what is being said, and listen. Instead of inserting
    or commenting, just listen. Instead of inserting ideas, overpowering, and dominating,
    simply listen. At the end of the week, take a moment to note: When were you successful
    in practicing empathy and when could you get better?


    +   1. How did the other person respond to me when they noticed they had my complete

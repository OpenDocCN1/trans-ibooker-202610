- pgno: 275
  md: '# PRACTICE: YOUR COACHING PLAYBOOK: COACHING THE 7 CORE FACTORS FOR ORGANIZATIONAL
    CHANGE


    Leader-coaches must take time to understand and engage time with other leaders,
    managers, and people at all organizational levels in exploring these questions.
    If possible, remember to start first at the senior or strategic level, then move
    to the business unit or operational level, and then to the tactical or team level
    as you design for clarity, focus, alignment, and accountability at each level
    of your organization:


    +   1. Why: “Why do we exist? Who do we serve? What are our mission, vision, and
    values?”

    +   2. Where: “Where will we compete? What is our unique, competitive strategy?”
    “What is our path and plan?”

    +   3. What: “What are our narrowly focused, most important goals?”

    +   4. How: “How do we execute the right actions and behaviors?”

    +   5. When: “What is the timeframe for achieving our goals with excellence?”

    +   6. Who: “Who are the right people? Are they in the right seats?”

    +   7. Systems: “How do we recognize, reward, and develop talent?”


    Ask yourself, in relation to the 7 Core Factors:


    +   1. Where can our organization get better focus and alignment?

    +   2. Where do we have great alignment, commitment, and buy-in?

    +   3. Where are we clear, focused, and aligned?

    +   4. Where are we unclear, unfocused, and misaligned?

    +   5. Where do we need better sponsorship, engagement, and support?

    +   6. Where can we help coach and offer better support and accountability?


    # PRACTICE: YOUR COACHING PLAYBOOK: COACHING ACROSS THE GLOBE


    To support ongoing diversity and inclusion development in your organization, you
    may find the following exercises helpful.


    Develop a clear set of global values and cross-cultural expectations based on
    mutual respect, responsibility, empathy, access, opportunity,'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'and inclusion. Take into account the cultural diversity issues discussed in
    this chapter. Remember, diversity and inclusion are talent readiness, talent engagement,
    and leadership pipeline imperatives.

    As a leader-coach, you can help increase diversity and multicultural awareness
    and global practices through:


    +   1. Establishing common organizational values, laws, and policies consistent
    with mutual respect, dignity, and equality; and valuing embracing differences,
    championing diversity, global experiences, cross-cultural exchanges, improved
    awareness training, and inclusivity

    +   2. Ongoing training about global and multicultural awareness, diversity and
    inclusion, and unconscious bias

    +   3. Promoting mentorship, sponsorship, and access for diverse populations with
    key senior leaders, with advancement opportunities

    +   4. Offering leadership development, coaching, and mentoring access with senior
    executives

    +   5. Offering diverse groups to promote social networking and develop professional
    communities, such as: women’s groups, Hispanic groups, African American groups,
    LGBTQ-plus groups, and various ethnic and religious groups.

    +   6. Offering equal pay and advancement opportunities, with global job rotation
    and cross-cultural work assignments

    +   7. Encouraging breakthrough thinking, innovation, creativity, and being open
    to ideas from all people at all levels

    +   8. Championing equal employment opportunity laws, diversity and inclusion
    policies and procedures, and anti-discrimination policies


    # Reference


    Duhigg, Charles. (2012). Habits: Why we do what we do. Interview. Harvard Business
    Review.'

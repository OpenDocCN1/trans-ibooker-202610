  md: '# Coaching for Contribution


    networks, and partnerships with others around the desired future state for change.
    They help themselves and others get clear on organizational and team strategies,
    goals, and objectives, while they help identify others wins and opportunities
    for their growth, development, and success. They help co-create new and better
    habits and action plans for success. They are empathic and affirming, and value
    others’ opinions and feedback; and they overcome fears, apathy, failure, and resistance
    to change. Coaches as change agents help map out and define realistic actions
    and plans for success. They hold people accountable and are impeccably honest
    and supportive while change initiatives are successfully implemented.


    Coaching can offer life-changing tools to help people on their road to happiness,
    fulfillment, and great success. Understanding a person’s life history, context,
    experience, and roadmap will go a long way to influence their personal mindset,
    strengths, behaviors, limitations, incongruencies, and frustrations, and much
    of the pain and shame they may experience on life’s journey. Coaching must offer
    a safe and confidential place to be curious, explore truth, challenge assumptions,
    be empathic, focus on the client’s agenda, explore choices and options, and help
    to reframe the right mindset or story if a false story has held them hostage or
    unable to overcome life’s challenges.


    Let me share the coaching context and how it can lead to understanding your life
    journey and how to find passion, purpose, and meaning despite setbacks and challenges.
    One of my good friends and former work colleagues, Sam Bracken, grew up in an
    unthinkable family environment as a young boy in Las Vegas, Nevada: poverty, drugs,
    gambling, and fighting; emotional, physical, and sexual abuse; and lack of parental
    support. Eventually, Sam had to transition to foster care as a teenager.


    Given his many early setbacks, Sam’s mindset could have been “poor me, life is
    terribly unfair, and nobody loves or cares about me” (these things were essentially
    true for Sam!). He could have sunk into self-victimization and easily ended up
    on the streets or in prison like other family members or similar teens in his
    situation.


    But something deep inside Sam said, “Not me. I’m not like them, and I will not
    be like them.” Instead of blaming, moaning, complaining, and becoming resentful
    and bitter, Sam got better! Blessed with a big athletic body and a big heart,
    he followed his passions, running track and playing football. Although every voice
    in his life told him'

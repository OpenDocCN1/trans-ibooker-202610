  md: 'Have you ever heard comments like these? Perhaps you’ve said such things yourself.


    These are the voices of people at work—millions of executives, leaders, managers,
    supervisors, workers, professionals, teachers, and families all over the world.
    There is a lot of pain in people’s lives. Many feel lost, overwhelmed, and full
    of resentment, and don’t know how to “ignite the fire within.”


    Can you relate?


    Of course, many people are fully engaged, contributing, passionate, fulfilled,
    and energized in their work and in their lives. But the happy, connected, and
    engaged are far too few. During many of my work sessions worldwide, I’ve enjoyed
    asking the following question: “How many agree that the majority of the workforce
    in your organization possesses much more talent, capability, creativity, and initiative
    than their current job requires or allows them to contribute?” Most people raise
    their hands.


    Globally, there is a war for great talent. Employees face a new and increasing
    expectation to produce more in their jobs for less money. In the past, companies
    could offer employment for life; today, they can only offer employability. In
    this highly competitive, dynamic world, organizations need higher levels of trust
    and empowerment and the full engagement of their people. The irony is that many
    employees are not allowed to use a significant portion of their talents, innovation,
    drive, and intelligence. Because people are not fully engaged, there is a clear
    waste of underutilized talent, energy, and capability.


    # The High Cost of Disengagement


    A Harris Interactive research group surveyed 23,000 US people employed full time
    in several different industries and across many different functional work areas.
    Consider a few of the most stunning findings from this research:


    +   - Only 37% of respondents said they have a clear understanding of what their
    organization’s goals are and what they are trying to achieve and why.

    +   - Only 1 in 5 employees were enthusiastic about their team’s and organization’s
    goals.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '+   - Only 1 in 5 employees said they have a clear “line of sight” between
    their work roles and their team’s and organization’s goals.

    +   - Only 50% of the employees were satisfied with the work they accomplished
    at the end of each week.

    +   - Only 15% felt they worked in a high-trust environment.


    The data is sobering. The results are the same for employees in organizations
    all around the world. Despite all our gains in education, engineering, technology,
    product innovation, and global business, most employees are not fully engaged
    and thriving in the organizations they work for. They are neither fulfilled nor
    excited. Many are frustrated and disengaged. They are not clear about where the
    organization is headed or what its highest priorities are. Many don’t feel valued
    or respected.


    Can you begin to estimate the personal and organizational cost of failing to fully
    engage the passion, talent, and intelligence of your workforce? The cost of disengagement
    and lack of productivity is staggering. It is a far greater cost to business than
    taxes, interest charges, and labor costs put together!


    In fact, Gallup Research stunned the business world by announcing that employee
    disengagement cost companies in the United States $450 billion annually. Only
    30% of US employees are engaged at work, and only 13% are engaged at work worldwide.
    Gallup defined engaged employees “as those who are involved in, enthusiastic about,
    and committed to their work and workplace” (Gallup 2014). Sadly, in many organizations
    today, if a better-paying job or a more fulfilling and engaging culture was offered
    to people, most of the talent would leave.


    # The Benefits of Engagement


    What makes an employee engaged? The greatest variable appears to be the employee’s
    immediate boss or manager. Gallup estimated that managers accounted for at least
    70% of the variance in employee engagement scores across business units (Beck
    and Harter 2015).


    The Gallup research also shows that when a manager gets people in their work roles
    focused on applying their natural gifts, strengths, and talent, they score 75%
    or higher on job satisfaction and engagement.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Gallup found that people in organizations with a culture of engagement are
    480% more committed to corporate success, 250% more likely to recommend improvements,
    and 370% more likely to recommend their company as an employer of choice.


    These are all great things, but I’d like to assert one more. Employees who are
    engaged stay and effectively produce results, which impacts the bottom line of
    any organization. Those who are not effectively engaged and are not aligned to
    leverage their natural gifts, talents, and strengths will simply choose to go
    elsewhere.


    Great leaders acquire the right talent, retain and develop them, and develop and
    coach their strengths and skills to achieve great performance. A leader can have
    the best talent in the world, but if those individuals are not aligned in the
    right roles, respected, trusted, valued, and developed—they will not be fully
    engaged, motivated, and productive.


    There’s usually little focus on talent development and retention. We do not take
    the time to consider, “What is happening with our culture?” “How engaged is my
    team?” “What is my bench strength, and what does my future talent pipeline look
    like?” “What are my opportunities and plans to help our people become more engaged?”
    “How can I invest in the development of a strength-based team and talent-based
    organization?” “How can I create a system to help our people develop their career
    paths?” As a leader-coach, your role is not only to recruit, align, develop, and
    retain your talent; your role is also to seek ways to empower, entrust, and engage
    your team members so they can perform to their best abilities.


    # Be Sure You Coach the Right People


    > In high-performance teams, the role of the team leader is less important and
    more difficult to identify because all members lead the team at different times.”

    > —Douglas Smith and Jon Katzenbach (1999)


    In his book Good to Great, Jim Collins advises, “You first have to get the right
    people on the bus (and the wrong people off the bus) and then figure out how to
    expand the seats on the bus and where to drive'

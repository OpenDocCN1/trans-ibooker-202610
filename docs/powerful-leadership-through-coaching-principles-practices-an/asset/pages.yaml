    \ You must demonstrate your respect for the person you’re coaching, be present,\
    \ and focus on them. You can be listening; but if you really don’t care to understand\
    \ the person, or if you try to fake respect, they will tune in to this insincerity\
    \ and question your influence.\n\nBeing authentically curious can take practice.\
    \ You must keep trying to connect and show interest intentionally. You must accept\
    \ the idea that others may be as smart or smarter than you, and at least temporarily\
    \ suspend asserting your own opinions and viewpoints.\n\nHere are some questions\
    \ to ask yourself before the coaching conversation:\n\n+   - What is my intent?\n\
    +   - Do I genuinely care about this person?\n+   - Do I truly value others’ ideas,\

- pgno: 132
  md: 'While no gold-medal awards are on the line in coaching, it’s still important
    to end each coaching session with a strong dismount—a strong conclusion. When
    it comes time to end the session, here are some ideas for closing remarks:


    +   - *Express gratitude*: Thank the person you’re coaching for being open and
    willing to participate.

    +   - *Get better*: Ask for feedback on the coaching session. “What would you
    like to see more or less of?”

    +   - *Align to purpose*: Help the person see the why, the bigger picture, organizational
    alignment connection, or stakeholder impact from your discussion.

    +   - *Notice the details*: Discuss something you appreciate about the person.

    +   - *Be affirming*: Affirm, show support, and express confidence in the person.

    +   - *They do the heavy lifting*: Ask for the person’s summary of the discussion.

    +   - *Reinforce commitments*: Ask for a recap of any goals or commitments made
    in the coaching session.

    +   - *Call to action*: Request that they summarize and recap their specific actions
    before the next session.


    # PRACTICE: YOUR COACHING PLAYBOOK


    Hold a practice coaching session in which you strive to follow the key elements
    of asking the right questions, in the right way, at the right time. Invite someone
    you trust to be coached, and explain to them that it is a practice session. Remember
    to:


    +   1. Express appreciation and respect to the person you’re coaching.

    +   2. Ask questions that support their agenda, not yours.

    +   3. Clearly identify the topic of the conversation. Practice the 3Ds!

    +   4. Be courageous and transparent about any key issues or opportunities of
    focus in the moment.

    +   5. Ask good coaching questions to clearly summarize issues.

    +   6. Help the participant narrow the focus on key actions and next steps.'

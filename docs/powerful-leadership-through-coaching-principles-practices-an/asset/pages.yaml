- pgno: 99
  md: '# Creating a Safe Space for Coaching


    > There is no innovation and creativity without failure, period.

    > —Dr. Brené Brown, New York Times best-selling author, psychologist, counselor,
    and speaker


    Only when people know they can trust you will they feel safe opening up to you.
    Servant leaders exist to create comfort and happiness for those they serve. For
    coaching to be successful, there must be a safe environment. The timing, climate,
    and setting for your coaching are crucial to your dialogue. By asking the following
    questions, you can ensure that people will trust you and feel safe about opening
    up:


    +   - Are you open to having a conversation?

    +   - Would you like to have a conversation?

    +   - Is this a good time to talk?

    +   - I would really enjoy getting together soon and catching up. When would be
    a good time to connect?

    +   - I would like to get your advice on a few things and also share some of my
    thinking.

    +   - I would like to check in and make sure everything is going well for you.

    +   - Would you be willing to have a conversation about how we could get better
    together?


    As a coach, always get permission to proceed before you start coaching. This is
    a good way to declare good intent and show value and respect at the same time.


    Recently, I gave a keynote presentation to a group called the Association for
    Contractors and Builders on improving the execution of safety standards in the
    workplace. Under federal law, your employer must provide a safe workplace free
    of known health and safety hazards and violations. As I spoke, I noticed a banner
    in the room with a picture of a mom, dad, and kids. The sign read, “Every family
    is entitled to have their loved ones come home from work every night safe and
    free from accidents, injury, or death.” I was deeply touched with this all-important
    message about safety.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Like physical safety, everyone is entitled to psychological safety in the workplace.
    Coaches ensure that every interaction is open, respectful, inclusive, trusting,
    and safe. Confidentiality and no fear of retribution is also critical to safety.


    In their book *Driving Fear Out of the Workplace*, Daniel K. Oestreich and Kathleen
    Ryan ask, “What does it mean to feel psychologically safe at work?” Their findings:
    when people know they can tell the truth without fear of repercussions, then indicators
    of quality, innovation, collaboration, and productivity all dramatically improve
    (Oestreich and Ryan 1991, pp. 65–67, 86–94).


    So, how do you break a cycle of fear and mistrust and create a trusting and safe
    environment?


    One way to create a safe environment is to allow people to make mistakes and learn
    from them. I have a close friend, Tanios Viviani, whom I have coached as he has
    led several multi-billion-dollar companies. Over the years, we have shared life’s
    ups and downs and many successes along the way. I have found it refreshing to
    discuss lessons of life with Tanios. One intriguing topic we’ve talked about is
    failure. We’ve tossed around four key lessons about failure:


    +   1. *Fail fast.* Overcome hubris, ego, and arrogance. Failing fast means you
    have open, two-way feedback loops that are transparent and offer fast, honest
    feedback so you can make a course correction.


    +   2. *Fail cheaply.* We have all learned from very expensive mistakes when we
    go all in. Reduce the cost of failures by alpha and beta testing—piloting and
    testing the waters—before a big investment of time, money, and resources.


    +   3. *Fail publicly.* Don’t be embarrassed by failure. Everybody fails! If you
    fail publicly, you will gain respect rather than lose it, because you are demonstrating
    absolute honesty and commitment. Put failures out into the public domain so everyone
    can learn from them and get better.


    +   4. *Fail forward.* There is no shame in failure. Adapt and keep moving forward!
    You cannot innovate and collaborate in an environment of fear. If a toddler falls,
    we don’t yell at them. We know they’re going to fall down a hundred times, but
    each time they fall, they arise a little stronger and a little wiser, and move
    forward. Learn and reflect on the past, but focus all your efforts on a successful
    future of continuous improvement.'
  merge: -1
  img_proc: true

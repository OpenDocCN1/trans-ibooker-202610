  md: '# Coaching the 7 Core Factors for Organizational Change


    > In all my years as a leader at Frito Lay and PepsiCo, I have found that building
    trust with my team and in our culture was the single greatest thing that I could
    do to improve performance.

    > —Al Carey, former president, PepsiCo North America


    In this part of the book, we go beyond helping individuals change, to helping
    entire leadership teams and organizations learn and align to better serve their
    customers, better compete in the marketplace, and better serve its mission, vision,
    and ultimate purpose in society.


    Of course, no one coaches an organization. You’re still coaching people, but now
    we’re talking about coaching senior executive leaders and teams and others who
    have general leadership, management, and often global responsibilities.


    As a coach practitioner who has practiced in over 35 countries for approximately
    three decades, I have found that my favorite work is developing senior leaders
    and executive teams; helping them to set clear visions, values, strategies, and
    goals with aligned roles and structure for their organizations; and coaching them
    in a way that brings simplicity to their executive teams. Arthur W. Jones from
    Procter & Gamble famously stated, “All organizations are perfectly aligned to
    get the results they get.” The trick is to design and align the organization to
    the desired results that are wanted. Executive coaches can play an essential role
    in that design and alignment.


    Organizational coaching offers the executive team the opportunity to gain direction,
    clarity, focus, and alignment. Learning and change'

    To dramatically transform the way people solve problems, they need to shift their
    mindsets. If you have a Learner mindset, you are open to what is possible. You
    do not focus on the problem, you focus on your responsibility, your creative choices,
    and on new and better solutions. An effective leader starts with a Learner mindset
    and coaches others toward a Learner mindset.


    On the other hand, Judgers live out of fear and defensiveness. They are close-minded.
    Blame and shame others and hold them hostage to the past. They think they know
    all the answers and seek to control and micromanage others.


    I was recently leading a large-scale coaching engagement with General Dorothy
    Hogg, who is the surgeon general and leader for the US Air Force Medical Services
    Corps. in Washington, D.C. Among her executive teams were a number of very experienced
    major generals, brigadier generals, and colonels. This was an exciting engagement
    where I was able to personally offer both team and one-on-one coaching over a
    six-month period with each of these leaders. They were going through a number
    of monumental changes with military healthcare reform, an internal transformation
    and reorganization effort with their military health system, and many budget allocation
    and resource changes. Having a Judger or reactionary mindset and culture is common
    in organizations with changes of this magnitude that were this disruptive. The
    coaching engagement required a number of shifts in thinking and behavioral changes
    for the leadership team, as well as for the organizational system as a whole.
    Certainly, any such change takes time and requires tremendous effort and support
    at all levels. That said, I was very impressed with how well the overall team
    was able to adapt and establish trust as they led this change effort by building
    a common language, a common learner mindset, and a common set of communication
    tools to help influence high-trust conversations with all of their key stakeholders.
    Developing a more proactive, Learner mindset helped establish General Hogg and
    her leadership team to focus on those things they could directly influence and
    control, versus getting stuck or reactionary about the many things they could
    not control during very turbulent and distrusting circumstances.'

  md: 'available to them vary widely. Of course, these things are true of you, too.
    You have to gauge what you are able to contribute to the engagement as well.


    Remember the administrative aspect of any coaching engagement and relationship,
    which needs to be clarified up front. Both parties will need to plan, schedule,
    and make the time to converse and check in. Effective scheduling and time for

    # Seeing Yourself as a Servant, Not a Master


    > > A leader is one who knows the way, goes the way, and shows the way.

    > >

    > > —John C. Maxwell, New York Times best-selling author


    It’s tough to find models of authentic leadership. When we check the news about
    government, education, business, and international relations, we find mostly examples
    of how not to lead.


    Robert Greenleaf, well-known researcher and teacher of leadership and author of
    the book *The Servant Leader*, was one of the first to research and define the
    concept of *servant leadership*. He states, “The big idea is that leadership must
    be about service. You cannot separate great leadership from service.” He realized
    that people in the best organizations see themselves serving one another, easing
    their burdens, and enabling them to succeed (Greenleaf 1998, pp. 5–10).


    According to Cheryl Bachelder, the former CEO of Kentucky Fried Chicken and AFC
    Enterprises, conventional leadership suffers from a “spotlight problem.” In her
    book *Dare to Serve: How to Drive Superior Results by Serving Others*, Bachelder
    says most leaders are “drivers and high achievers, though perhaps a bit self-absorbed.
    We tolerate that, because they are going places that we want to go. If they are
    successful, we will be successful.”'

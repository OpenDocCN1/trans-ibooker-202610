    # Coaching in Action: Rebecca’s Story


    Rebecca was facing a challenge: she was brought into an international organization
    to help strengthen relationships with customers and local distributors. Studying
    the data, she broke the current distributors into three general categories based
    on their performance and ease of doing business with them: top performing, middle
    performing, and low performing. Her goal was to address the low-performing distributors,
    but when she examined the situation closely, she discovered that they were “protected”
    through their friendship with the CEO.


    In a coaching session with Rebecca, we utilized the Simpson 3Ds Coaching Model:
    1. diagnose, 2. design, 3. deliver.


    # 1. Diagnose: What Is the Coaching Agenda?


    Rebecca explained to me, “Michael, there’s a serious problem here. We have some
    low-performing distributors who are losing customers and losing their own employees.
    But they know that they are protected by their longtime friendship with the CEO.
    I can’t address the problem with them without them complaining to the CEO, which
    may get me fired. I have no power here. How do I influence upward when there are
    serious political consequences, and the CEO has the power to get rid of my job?”


    As the children’s story reminds us, it’s very hard to tell the emperor that he
    has no clothes.


    I restated the situation to make sure I understood it. “Rebecca, this is a difficult
    and sensitive situation. The distributors seem to be old school buddies, protecting
    themselves in ways that are not adding value and making this a political situation.”


    I then introduced to Rebecca the mindset of “courage and consideration” (more
    on this later). When coaching upward, it’s crucial to lead with absolute consideration—start
    with loyalty and respect, expressing a desire to hold a hard conversation about
    improving the situation.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Then balance consideration with courage—lay out your data and feedback and
    your perceptions of the risks. Assure the boss that you are being fully transparent.
    Focus on customer value and objectives, organizational benefits, and shared opportunities
    for the customer and the business.


    # 2. Design: What Matters Most?


    “Rebecca, right now you’re alone on this problem, and if you attack it alone,
    how will you be perceived? As a whiner, a complainer, and not being loyal to the
    boss, she responded. “Can you attack his ego straight on?” I asked. She realized
    that she would lose that battle, and that she needed internal political and business
    support.


    “Who else is impacted by this situation?” I asked. “Which stakeholders are also
    paying the cost for this? Where else can you turn to get support? Tell me more
    about whom you need to influence and who might offer political support internally.”


    Rebecca shared that the chief operating officer was approachable and would be
    a good ally. Rebecca understood that she also needed to influence members of the
    board of directors. She began to brainstorm a plan that was inclusive and solution-oriented
    rather than problem- or person-focused.


    “What messages will appeal to the COO? To the board of directors? What business
    data do you need to compile, and what fact-based message will you need to prepare
    for them? How can the data speak to customer needs, customer value, and to the
    best interests of the business?”


    “Michael, the data clearly show that we are losing good employees and good customers,”
    she replied. “Both losses are very costly and risky to the business and to our
    future viability and sustainability. That means our opportunities for growth are
    being hurt, and the culture of our corporation is suffering. I need to show the
    CEO that protecting a few nonperforming friends who are modeling the wrong values
    and behaviors is backfiring in a big way. I need to talk about turnover, low productivity,
    nonperformance issues, misalignment to values, and poor customer feedback. In
    the end, the CEO is a logical man and wants what is best for the business and
    to look good in eyes of his board of directors. With the COO’s help and the board’s
    support, I think he’ll listen to logic, facts, data, and customer needs.”'

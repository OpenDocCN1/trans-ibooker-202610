- pgno: 186
  md: '# Low Skill/Low Will (Doubtful)


    How to best engage those doubtful:


    +   - First, build the will. Provide a clear briefing, identify motivations, and
    develop a vision of future performance.

    +   - Then build the skill. Structure tasks for quick wins; coach and train.

    +   - Finally, sustain the will. Provide frequent feedback; praise and nurture.

    +   - Throughout, supervise closely with tight control and clear rules and deadlines.


    ![](img/3b9ba4a318234a9c4d131f84093751e0_186_0.png)


    A U: these words don’t appear in previous figs?


    **Figure 12.5** Low skill/low will (doubtful)


    future. Build skills by structuring job tasks that ensure quick wins and ongoing
    mentoring. Finally, sustain the will and motivation by providing frequent feedback
    with rewards, recognition, and praise, and tasks that build confidence. If you
    don’t see results in time, transition the person out. Don’t waste too much time
    here. Protecting your nonperformers will backfire, as other workers will resent
    them for their nonperformance and you for keeping them on. They can also destroy
    the future success of your culture if not held accountable, offered corrective
    feedback, or transitioned out for nonperformance.


    People can and do move from one quadrant to another, depending on their experience
    and knowledge and stage of life cycle in their career. An unwise change in role
    can even cause a Quadrant 2 (high skill and will) to become a Quadrant 4 (high
    skill and low will)! Dr. Stephen R. Covey’s wisdom is appropriate here. You continually
    need to coach, engage, connect, and seek to inspire others. Dr. Covey has stated,
    “Leadership is communicating to people their worth and potential so clearly that
    they are inspired to see it in it themselves” (Covey 2007).


    Following are a series of practical “Skill-Will” coaching questions to help engage
    and motivate your employees and keep your employees in Quadrant 2 (high skill,
    high will). These should be ongoing, frequent conversations to engage your people
    to higher levels of engagement'

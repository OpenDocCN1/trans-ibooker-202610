- pgno: 152
  md: '+   - **Asserting control:** A conversation is always easier if you’re in charge.
    You get to pick the topics and direct the conversation because you are much more
    interested in what you have to say than anything anyone else has to say. Giving
    advice can also be a form of control. We put ourselves in the driver’s seat and
    jump in with our agenda, our solutions, or our need to be validated.


    +   - **Being the smartest one in the room:** If you have a large ego, you want
    to be the hero of the situation. Everyone needs to know how smart you are and
    how brilliantly you solve problems. You don’t need to understand other people’s
    viewpoints, because their viewpoints don’t matter.


    +   - **Hurrying along:** You’re busy! You have only so much time and a lot of
    competing priorities. It’s hard to turn off that list and focus on the needs of
    others. You might be suffering from the common management syndrome called “chasing
    squirrels,” or Attention Deficit Disorder (ADD). Everything is shiny, and you’re
    too busy to stop and really hear people out.


    Ineffective leaders view communication as an opportunity to promote their own
    personal agendas. Great leaders understand that the deepest need of the human
    heart is to be understood. Everyone wants to feel valued and heard, so effective
    leaders work at understanding and focusing on what matters most to the people
    they lead. They are then in a better situation to engage and release the talent,
    strengths, and passions of their team toward the organization’s highest priorities.


    # Responding Empathically


    > Unexpressed feelings never die; they are buried alive and come forth in uglier
    ways.

    > —Dr. Stephen R. Covey, professor, author, speaker, and businessman


    Hand in hand with empathic listening is empathic responding. This means communicating
    back to a person that we hear, validate, and understand their feelings.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Suppose your close friend comes to you with the bad news that he has just been
    fired from his job. How should you respond? In Dr. Covey’s 7 Habits book, he shows
    how to effectively connect with others by practicing empathy. He cites four typical
    responses, including advising, probing, interpreting, or evaluating what you’ve
    heard:


    +   - **Advise:** “Well, you’d better update your resume. I would go to their
    competitor and get a better job and more money.”

    +   - **Probe:** “When? Who fired you? Why? What were theys are very helpful when
    seeking mutual understanding. Empathic responses are quite different.


    You start by allowing your friend to talk as much as they want. Before they can
    move forward, they need ample opportunity to express their feelings, which are
    probably confused, angry, or fearful. You can help by saying, “Tell me more about
    what happened.” Or, “What was happening that may have influenced their decision?”
    Or, “In addition to what you’ve already told me, is there anything else that you
    believe influenced their decision?”


    You can respond with affirmation and empathy: “This must be very frustrating and
    upsetting for you. I sense your frustration and your disappointment.”


    Help your friend find their own way forward by listening with sincere respect
    and kindness: “I am so sorry to hear that . . .” “What are your thoughts and feelings
    going forward?”


    As an empathic listener, you have no agenda (Covey 1989). You are not jumping
    in and adding to or controlling the conversation. The speaker drives the agenda.
    Be curious, respectful, and kind. Your intent is only to clarify what happened
    and to offer compassion and support in a difficult situation. Many times, just
    being with a person and listening can add tremendous value.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# PRACTICE: YOUR COACHING PLAYBOOK


    In the Broadway musical *Hamilton*, Alexander Hamilton talks with Aaron Burr,
    who advises him, “talk less, smile more.” Here’s a coaching challenge: During
    the next week, pick one conversation where you talk less and listen more. In fact,
    make a concerted effort to talk less than the person you are talking to. Instead
    of talking, pause and reflect on what is being said, and listen. Instead of inserting
    or commenting, just listen. Instead of inserting ideas, overpowering, and dominating,
    simply listen. At the end of the week, take a moment to note: When were you successful
    in practicing empathy and when could you get better?


    +   1. How did the other person respond to me when they noticed they had my complete
    attention?

    +   2. How did I feel during the conversation? Was it hard to remain silent? Did
    it feel awkward?

    +   3. Did I learn anything that I might otherwise have missed by talking?

    +   4. What were the benefits of practicing empathy?

    +   5. What barriers or challenge get in the way of me becoming a better listener?

    +   6. What was the hardest part?

    +   7. What was the easiest part?

    +   8. Did others give any positive feedback—either verbal or nonverbal—due to
    practice with empathic communication?


    # References


    Covey, Stephen R. (1989). *The 7 Habits of Highly Effective People*. Free Press.

    Goldsmith, Marshall. (2014). *What Got You Here Won’t Get You There*. MJF.'
  merge: -1

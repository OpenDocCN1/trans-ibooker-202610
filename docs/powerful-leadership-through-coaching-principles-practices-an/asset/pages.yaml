- pgno: 35
  md: '# Why Every Leader and Manager Should Be a Great Coach


    But his true greatness as a leader was in his highly effective coaching. He was
    highly emotionally intelligent.


    Stephen M.R. had ongoing coaching conversations with me about my job performance,
    my future, my learning and development, and even my personal and family goals.
    His coaching was both personal and professional. He knew me, cared about me, and
    brought out the best in me. He evaluated my performance against a “win-win agreement”—a
    plan by which both the firm and I would benefit in concrete ways.


    Instead of handing out directives, Stephen M.R. asked questions. He empathically
    listened to the answers—from customers and from his own people. He sought our
    input and feedback and validated our views. He took a deep interest in us, treating
    us as whole-people and not just cogs in an organizational machine. He recognized
    and rewarded our contributions. I was impressed by how open he was and how much
    he trusted everyone on our team.


    Stephen M.R.’s coaching was open, honest, humble, positive, and focused on solutions.
    He was interested in our success, not in finding fault, judging, blaming, or shaming.
    He was fully invested in the art of coaching others to become successful leaders
    themselves.


    I firmly believe every leader can be a great coach, like Stephen M.R. Covey. That’s
    why I’ve written this book. In my view, coaching is the central skillset of a
    great leader. As you read this book, consider the many, many leadership challenges
    that can be solved through great coaching. Here are just a few such challenges
    to ponder:


    +   - Do team members buy in to the organizational strategy? How can you help
    them get aligned with organizational and team goals?

    +   - Are team members fully aware of the performance standards they are expected
    to meet?

    +   - Do they get effective feedback? Do they know what needs to be improved and
    by when?

    +   - Do they have “skill issues” or “will issues”?

    +   - Do they know what their strengths are and how to consistently leverage their
    gifts and talents?

    +   - Do they have clear action plans with defined accountability and support?

    +   - When they fall short, are they dealing with issues within or beyond their
    control?

    +   - What training, resources, or mentoring do they need to improve their performance?'

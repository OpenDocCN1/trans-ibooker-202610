    # Is This Person Motivated to Begin a Coaching Relationship?


    > *The way to get started is to quit talking and begin doing.*

    > —Walt Disney, entrepreneur, animator, director, and film producer


    The Buddhists have a proverb that states, “To know and not to do, is really not
    to know.” Confucius said virtually the same thing: “I hear and I forget. I see
    and I remember. I do and I understand.” Moving from conceptually knowing to doing
    is the key. This is a tricky. Personally, I find that motivation is less about
    what people know or feel than about what they do and why they do it. Walking,
    talking, practicing, and performing with the person will be the key to getting
    and keeping them motivated. The more participants do, the more motivated they
    become. The key is to get them started. Once participants brainstorm action steps,
    prioritize them, and carry them out, they will move forward.


    In graduate school at Columbia University, I was fortunate to have Dr. Victoria
    Marsick as a professor. She is one of the world’s leading experts in adult learning,
    training, and development. Much of her research and client work has been in adult
    learning and action-learning.'

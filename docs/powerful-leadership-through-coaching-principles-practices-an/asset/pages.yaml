  md: 'When it comes to modeling influence, a great place to start is in your mindset,
    your language, and your conversations. Mahatma Gandhi said, “Become the change
    that you seek in the world.” Recognize that your words matter, so mean what you
    say—and say what you mean. Begin by genuinely caring about people, and let people
    hear that you care about them. There is no replacement for sitting down and having
    a one-on-one conversation to understand them and connect with what is important
    to them. Talk about how you appreciate them. Express concern, listen and get to
    know them, and validate them. As a coach, you must have this emotional connection
    with people, or nothing you say or do will have lasting value.


    Some leaders get lazy and apathetic about their roles as influencers. They abandon
    people or use people as things or simply as a means to get what they want. They
    disengage. Weeks and months go by with little contact except in routine meetings.
    Or, they do the opposite—they micromanage and paralyze independent action, holding
    people hostage in a victim cycle of blame and judgment. Or, they may proverbially
    disregard people and throw them under the bus without loyalty or support.


    Recall what my friend Dr. Marilee Adams says about Learners and Judgers. Learners
    are emotionally intelligent leaders whose language and behavior offer a positive
    influence, while Judgers are emotionally unintelligent. Their language and actions
    create anxiety, helplessness, and resentment. Here are some examples of both Learner
    and Judger language (Adams 2015):


    # Judger language


    +   - “I can’t . . .”

    +   - “I won’t . . .”


  md: '# Why Every Leader and Manager Should Be a Great Coach


    Burnside was such an inspiring and motivating coach, these qualities come to mind:


    +   - He inspired us with a clear vision, purpose, and values.

    +   - He put each of us in positions to play to our unique gifts, strengths, and
    talents. We were very clear on our individual roles, but we were trusted and empowered

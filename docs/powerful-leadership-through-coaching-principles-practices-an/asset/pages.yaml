  md: 'not only help you understand, but also allows the speaker to move out of the
    emotional brain and into the thinking or conceptual brain by giving them space
    to verbalize their situation, concerns, issues, and feelings. Following are examples
    of clarifying questions to practice in your coaching conversations:


    +   - “When you say . . . , what do you mean? Can you tell me more about that?”

    +   - “Help me understand what you mean by . . .”

    +   - “I’m interested in your perspective on . . . Can you tell me more about
    it?”

    +   - “Can you give me some examples of . . . so I can understand better?”

    +   - “Tell me more about . . .”


    As a coach, after you have listened and asked clarifying questions, you are ready
    to identify the real problem and possible solution.


    +   - Identify the problem:

    +     - What issues seem to be the most important to the person you’re coaching?

    +     - What is the evidence of these issues?

    +     - What are the impacts of these issues?

    +   - Clarify the solution:

    +     - “To make sure I am on point, what might be the best solution to this problem?”

    +     - “If we solved this problem right now, what do you think the impact would
    be?”

    +     - “What do you believe would be the best next steps going forward?”


    # Avoiding Pitfalls


    > We have two ears and one mouth, so we should listen more than we talk.

    > —Zeno of Citium, founder of the Stoic school of philosophy and virtuous teachings
    in Athens, Greece, about 300 BCE


    Why is it so hard for many leaders to listen effectively? There are many reasons,
    but here are a few typical pitfalls:'

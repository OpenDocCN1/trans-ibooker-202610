- pgno: 39
  md: '# The Simpson 3Ds Coaching Model: The “How to” of Coaching


    an overview of the 3Ds Coaching Model and associated tools, which you can access
    or download online at www.simpsonexecutivecoaching.com.


    Here are the 3Ds:


    +   1. Diagnose: What is the coaching agenda?

    +   2. Design: What matters most?

    +   3. Deliver: What actions will be done?


    Let me explain them and provide powerful coaching questions that are useful at
    each phase.


    # 1. Diagnose: What Is the Coaching Agenda?


    > > *If I had an hour to solve a problem and my life depended on the solution,
    I would spend the first 55 minutes determining the proper question to ask, for
    once I know the proper question, I could solve the problem in less than five minutes.*

    > >

    > > —Albert Einstein, German-born scientist and theoretical physicist


    In the diagnose phase, you’re finding out what is happening and why. You empathically
    diagnose the current and past state to understand the employee better: their strengths,
    their perspective, and their influence on others. You’re learning historical context,
    listening to their story, figuring out their mindset. You’re defining the agenda
    of your coaching experience.


    Suppose you have Morgan on your sales team. It’s close to year end, and Morgan
    is not delivering the expected sales results. You don’t know why. You ask Morgan
    to meet with you and find a quiet room for a coaching conversation. You explain
    to Morgan that you want to understand what is happening in the sales process and
    get a better idea of where clients are in the sales pipeline. You might ask these
    diagnostic questions:


    +   ▪ “Can you tell me more about how you and your team are doing on sales goals?”'

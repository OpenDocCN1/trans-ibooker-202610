  md: '# Coaching the Whole-Person


    Once you set your whole-person goals, you’ll need to block out time on your calendar
    for achieving them. Transformation usually requires lots of repetition: one exercise
    session won’t do you much good, so you need to make time for an organized sequence
    of activities that will change your life. I call these activities rituals because
    they are programmed and repeated. Adopting certain rituals will help you fill
    your whole-person needs more easily.


    Your whole-person plan might include rituals like these:


    +   1. Over the next three to five years, I will schedule . . .

    +   2. Over the next two years . . .

    +   3. On a yearly basis . . .

    +   4. On a quarterly basis . . .

    +   5. On a monthly basis . . .

    +   6. On a weekly basis . . .

    +   7. On a daily basis . . .


    You will always have more good ideas than you have time, resources, or capacity
    to execute. Keep it simple, narrow the focus, and don’t try to do too much at
    once. Your ability to consistently carry out a few rituals will grow.


    Emma had a 16-year-old daughter. That statement alone should explain what Emma
    was dealing with when it came to coaching the whole-person. She had an emotional
    need: how to connect with a daughter who thought that her mother was unavailable
    and disconnected.


    > “I have two summers left with my daughter before she moves out,” Emma explained
    to me. “I am running out of time to connect with her. What can I do?”


    I introduced Emma to the Learner/Judger mindset, and we discussed how she could
    begin to connect better with her daughter in a nonjudgmental way.


    I brainstormed some options with Emma. She wanted her daughter to give less time
    and attention to her phone and social media. She wanted to find an opportunity
    to connect with her in a safe, uninterrupted environment. After some discussion,
    Emma settled on a service project in Mexico, helping to build a school.


    As part of a team, Emma and her daughter mixed cement, sawed beams, drove nails,
    and painted, doing a different job each day. But they also participated in certain
    daily rituals. Each morning began with worship. At breakfast, they met with the
    children who would'

  md: "# Coaching to Keep People Engaged\n\n> > *A leader is one who is more interested\
    \ in the success of their people than the success of themselves.*  \n> > —Catherine\
    \ Pulsifer, Canadian motivational author\n\nNow that you have “the right people\
    \ on the bus,” your next task is to coach them and keep them engaged and productive.\
    \ This ongoing process of coaching and engagement will never end. It is an effort\
    \ of all great leaders and managers.\n\nAs the third generation in an established\
    \ and successful family business, Mario’s success was nearly guaranteed. The business\
    \ was thriving and growing at an unprecedented rate. But while the business was\
    \ progressing, Mario felt unfulfilled with the direction of his own career. On\
    \ one side was great success; on the other side was dissatisfaction.\n\n> > “Everyone\
    \ has their hurdles, but I’m sitting here, facing mine, not knowing what direction\
    \ to go to and how to get to the other side of the hurdle,” Mario shared with\
    \ me. “I’m helping my family members run our family business, but I’m stuck trying\
    \ to find my own way, my own voice, and fearful that some of my family members\
    \ will try to edge me out to make room for their own kids’ legacy and to eventually\
    \ take over. I’m frustrated, and my emotions are building up to the point where\
    \ I’m angry and have a lot of resentments.”\n\nIn coaching Mario, I started with\
    \ his emotional triggers and his current dissatisfaction about his role and perceived\
    \ contribution within the company. We had to unpack and uncover a lot of raw feelings,\
    \ resentments, and areas where he was stuck.\n\n> > “Mario, how do you feel about\
    \ this company? Do you love it or resent it? Is it more than just a family obligation?”\n\
    \nHe told me that he loved being a part of his family’s company. He saw it as\
    \ a ship. He loved his crew. He loved being a captain and driving it forward.\
    \ The company was a positive place for him. Over the years he had carried out\
    \ many interesting roles, responsibilities, and projects, and had learned every\
    \ area of the business. He had developed great pride while building upon the legacy\
    \ of his father and grandfather.\n\n> > “But now I feel stuck, and I don’t know\
    \ what to do. I would like to build my own legacy and not simply fulfill the legacy\
    \ of my father and grandfather,” he admitted."

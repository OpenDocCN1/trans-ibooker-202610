    \ this session. At one point he shared openly with the team key data from his\
    \ own feedback report. He was very vulnerable intellectually and emotionally.\
    \ He shared items he needed to work on: communicating at all levels within the\
    \ company, holding others accountable, and focusing more on customer needs. He\
    \ showed no defensiveness: “This feedback is true,” he said, “and I need to do\

    +   - Be more forthright and direct about asking questions, criticizing ideas,
    or giving honest upward feedback to others

    +   - Be less subtle, more open, and transparent when expressing disagreement

    +   - Be more willing to directly debate issues openly at meetings

    +   - Get to the point more directly and quickly


    *Key coaching questions:* Does this society or organization tend to have high-power-distance
    or a low-power-distance culture, behaviors, and communication style?


    # 2. Individualism vs. Collectivism


    Individualism refers to a social structure and culture that place a high degree
    of importance on personal freedoms, individual expression, and personal interests.
    A collectivism culture focuses more on the needs and interests of the collective
    society, group, or team.


    For example, in high-individualism cultures, they tend to be focused on the person’s
    needs, success, personal fulfillment, individual rights and freedoms, autonomy,
    pleasure, and well-being. “I” is more important that the “we” or the group (e.g.
    the United States, Canada, United Kingdom, Scandinavia, and Australia).


    In contrast, collectivism’s focus is on the group people belong to, and the interests
    and success of the society, group, or team is more important that satisfying the
    individual’s rights and needs. The needs of the overall state, or organizational
    interests, tend to outweigh any individual needs and concerns. However, with a
    collectivism mindset, the state and organization must seek to take care of the
    individual’s needs. The individual’s duty is to respect the overall society or
    group membership. In a collectivist society (e.g. Russia, Eastern Europe, China,
    South East Asia, India, and the Middle East), people are very loyal to one another
    and more communal, socialistic, caretaking, and responsible for each other. Individuals
    in such a culture tend to:'

  md: '# Becoming a Confident Coach


    > > *It’s what I’ve looked for and tried to build in every executive who has ever
    worked with me. Confidence gives you courage and extends your reach. It lets you
    take greater risks and achieve far more than you ever thought possible. Building
    self-confidence in others is a huge part of leadership. It comes from providing
    opportunities and challenges for people to do things they never imagined they
    could do—rewarding them after each success in every way possible.*

    > >

    > > —Jack Welch (2001)


    Jack Welch, one of the great businessmen of our time, grew up with a speech impediment.
    As he explains in his book *Straight from the Gut*, his stammer embarrassed him
    from a very young age. Then his mother helped reframe his limitation for him.
    “It’s because you’re so smart,” she told her son. “No one’s tongue could keep
    up with an intelligent brain like yours!”


    Welch believed his mother: that his mind worked faster than his mouth, and that’s
    why he had a stammer. So, he stopped worrying about it.


    Decades later, Welch saw some pictures of himself as a child and was shocked by
    his appearance. He was small. “Yet I never knew it or felt it,” Welch wrote. “It’s
    just ridiculous that I wasn’t more conscious of my size. . . . My mother convinced
    me that I could be anyone I wanted to be. It was really up to me” (Welch 2001).
    Instead of limiting him, his mindset drove his success as a business leader.


    An effective coach enables clients to develop mindsets that are engaged, productive,
    adaptive, and innovative. That’s why leaders need to be effective coaches. As
    leadership expert and author Fred A. Manske Jr. observes, “The ultimate leader
    is one who is willing to develop people to the point that they eventually surpass
    him or her in knowledge and ability” (Manske 1999).'

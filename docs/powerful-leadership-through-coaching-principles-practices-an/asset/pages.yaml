- pgno: 223
  md: 'Goals are great. Action is even better. One key to turning a commitment into
    action is to have a coach as an accountability partner: someone you can report
    to who will hold you to your commitments.


    For about a year, I had the opportunity to be a coaching accountability partner
    for Parker, an entrepreneur and president of a very successful and profitable
    startup business. He was highly motivated, intelligent, and a great visionary.
    He had a very strong work ethic, but he still needed someone to help him stay
    true to his plan.


    We put together a coaching plan for Parker to work on his personal and professional
    goals in all five whole-person areas: financial, physical, social/emotional, intellectual,
    and spiritual, with an emphasis on his key relationships and career success.


    The plan also included guidelines for me as Parker’s peer accountability coach:


    +   - Be his “guide on the side” consistently each week

    +   - Help him stay consistently on track with his rituals

    +   - Listen and maintain ongoing support, accountability, and confidentiality

    +   - Mentor him to solve big problems and overcome big challenges

    +   - Help him stay focused on the right leadership mindset, behaviors, and performance
    results

    +   - Role-play crucial conversations with others so he could build relationships
    of trust

    +   - Challenge and support him in modeling the values he believed in

    +   - Help review and track his success measures and help him adapt the plan as
    needed


    Parker was a conscientious individual with every intention to stay true to his
    goals, but he told me that his goals always stayed at the forefront of his mind
    because he knew I would call, check in, and challenge him. He made real progress
    because he had a plan and knew there was going to be ongoing support and accountability.


    Here are some questions to ask in your role as a peer accountability coaching
    partner:


    +   - “What do you want to accomplish with your coaching agenda?”

    +   - “What would you like to achieve this year?”'

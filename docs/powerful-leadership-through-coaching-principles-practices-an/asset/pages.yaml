    It was magical how he could test, prod, question, facilitate, and pull out lessons
    from leaders’ own experiences. He asked more curious questions than he gave answers.
    He certainly added in many of his own timely stories, as well; however, he pushed,
    pulled, challenged, tested, debated, and facilitated dialogue in a way that made
    people question their own assumptions and think deeply about their experiences
    and their answers. I have tried to model Ram’s Socratic and insightful method
    of questioning. Following are some sample questions that'

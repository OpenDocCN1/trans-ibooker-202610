  md: "# 52  Coaching with a Mindset of Abundance\n\nThis language reveals a scarcity\
    \ and Judger mindset. How do you reset a fixed position into a win/win position?\n\
    \nSome competition is good and even necessary, but when you need to partner, collaborate,\
    \ work interdependently, and cooperate, then the only realistic option is a true\
    \ win/win approach. Dr. Covey suggested beginning by recognizing abundant and\
    \ trustworthy people around you. Learn from them, associate with them, and choose\
    \ to model them (Covey 1989, p. 231).\n\nFor me, an example of abundance thinking\
    \ and behaving is Stephen Covey’s son, Stephen M.R. Covey. Early in my career,\
    \ as I mentioned earlier, he was my boss at Covey Leadership Center. I’ve worked\
    \ with Stephen M.R. for many years and continue to partner with him personally\
    \ and professionally to this day. He models the win-win, abundance mentality in\
    \ every possible way.\n\nBefore he meets personally with a client, Stephen wants\
    \ to know more about them. He is deeply curious about their back story and their\
    \ future. He wants to understand his client’s needs and seeks to engage with them\
    \ in a custom, flexible, and value-based way. He models what it means to be empathic,\
    \ creative, adaptable, and flexible to meet clients’ needs. He is a deal maker\
    \ and a champion of making sure everyone benefits and wins in negotiations.\n\n\
    He practices an abundance mindset with his colleagues as well as his customers.\
    \ When we meet together, he genuinely wants to know about my life and my career\
    \ interests, and how I am feeling about my contribution at work. How am I progressing?\
    \ How am I doing personally? He has no political or hidden agenda other than a\
    \ sincere interest in helping everyone around him be successful. He is also very\
    \ honest and transparent, and has a trustworthy agenda.\n\nI wanted—and still\
    \ want—to be more like Stephen M.R. Covey. An effective leader as coach will be\
    \ like him—a model of the Learner and of the Abundance mindset.\n\n# Coaching\
    \ as a Learner\n\n> *Not to know is bad; not to wish to know is worse.*  \n> —Nigerian\
    \ proverb\n\nBefore you can ever hope to coach or influence another person, you\
    \ must build personal relationships and rapport. If you are a Learner, it"

    > —Vic Johnson, Major League Baseball player


    Every person can choose a path to fulfillment and greatness. We find greatness
    in making the contribution only we can make. For each one of us, this quest or
    path can be a bit different. There is no “one size fits all”; it is more like,
    “one size fits one.” We must constantly question the needs of others, the talents
    unique to us, our innate passions, and the voice of conscience. Listen to your
    inner voice: it will tell you who you are, what you should do in life, and how
    to make a difference.


    One of my clients, Robert, had a “crisis of finding his unique and important contribution.”
    He was feeling deep frustration in his role and turned to coaching to help him
    regain his sense of purpose.


    Robert’s father had founded a business when his two sons were both very young.
    Robert remembers being frequently told, “Robert, one day you’ll run this business
    with your brother.” Sure enough, the business grew stronger and more profitable
    every year until his father was ready to retire and hand over the reins to his
    two sons.


    But things turned sour. Robert was the “little brother,” and his older brother
    never let him forget it. Robert had been in the shadow of his brother his entire
    life.


    In our coaching conversations, we spent a lot of time working through Robert’s
    mindset—helping to shift from a resentful, Judger mindset to a Learner mindset.
    Maybe his brother was a “complete idiot.” Maybe his brother was selfish and controlling.
    Maybe his'

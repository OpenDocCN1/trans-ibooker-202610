  md: '+   Is coaching clearly linked to a business strategy, talent management, performance
    management, a business challenge, career development, behavior change, work-life
    balance, or other opportunities?


    These questions are crucial when deciding whether you are ready to coach a person.
    Try to determine in advance as much as you can about the person. Gather data from
    different sources in order to target areas for coaching. Surveys, interviews,
    and questionnaires such as 360-degree assessments can help gauge the person’s
    needs, gaps, and level of desire to address those needs.


    Personally, when I am hired as an external coach for a client or leadership team,
    I like to send a 10-page confidential Coaching Scope Document for the participant
    to fill out prior to our first intake scoping session. This document helps the
    coachee or client and me gain personal insights about what matters most to them
    both professionally and personally. Then I can customize my coaching to many of
    their needs, dreams, aspirations, and desired outcomes. But it’s also important
    to know how things are going from the viewpoints of bosses, peers, direct reports,
    partners, and so forth. One-on-one personal interviews, 360-degree assessment,
    and surveys are ideal to gain data and needed context. Is this person delivering
    results? Is performance at a high level? Is there a work-life balance? Does this
    person want to change or improve certain behaviors? Here are some of the sample
    questions asked in my Coaching Scope Document:


    +   “What is happening in your world, right now?”

    +   “How open are you to change and improvement?”

    +   “How do you view your current level of performance?”

    +   “How do others view your current level of performance? How do you know?”

    +   “What seems to be working well for you right now?”

    +   “What is not working well, and what does that mean to you?”

    +   “What specific goals and objectives do you wish to achieve?”

    +   “What do you want to focus on in our coaching session?”

    +   “What aspects of your professional role do you want to improve?”

    +   “What aspects of your personal life do you want to improve?”

    +   “Listing your top stakeholders or key relationships, with whom do you need
    to improve trust and credibility?”

    +   “What aspects of your work-life balance would you like to improve?”'

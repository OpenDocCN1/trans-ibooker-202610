  img_proc: true
- pgno: 34
  md: 'Everyone has the potential to be a great leader and coach. Within every human
    soul is the capacity to develop natural gifts, talent, and strengths. It starts
    with focusing less on self and more on building, developing, and empowering people
    around us.


    My first introduction to professional executive coaching occurred back in the
    1990s when I was working for PricewaterhouseCoopers as a management consultant.
    I saw a coaching course advertised at the University of Maryland, and I was instantly
    intrigued. The title was “The Art and Practice of Coaching Leaders.”


    Coaching leaders. Not athletes. Not All-Americans, but leaders in a business context.
    I went to the course, and as I sat there, I was instantly hooked. I saw at once
    that coaching in the workplace could become a critical part of an effective leader’s
    toolbox.


    After that, I knew I could walk into my family room, my favorite automobile repair
    shop, or the corner executive office of a Fortune 500 company as a coach. I knew
    I could bring about a significant, productive change in thinking no matter where,
    no matter with whom.


    Since then, research data show my instincts were good. According to a study published
    in The Manchester Review, the right kind of coaching can improve productivity
    by 53%, quality of work by 48%, working relationships by 71%, teamwork by 67%,
    and job satisfaction by 61%.


    I strongly believe that everyone can be a great coach and that coaching is needed
    everywhere. In fact, I’ve built an entire business around the belief that coaches
    are not born: coaches can be developed. All it takes is learning a few new skills
    and turning those skills into a natural competency.


    This is my coaching promise: as you read this book and put these tools to work,
    you will increase your skills and capabilities as a coach. You will gain the ability
    and confidence to better engage and unleash the passion and talent of your team
    toward their highest goals and priorities.


    # An Example of a Highly Effective Coach


    Early in my career, I had a leader who was great because he was a highly effective
    coach. His name is Stephen M.R. Covey, the son of Dr. Stephen R. Covey. Over the
    three years he led and managed me and our consulting team of 20 people, I came
    to recognize that he had strong business acumen. He worked at understanding our
    customers, the industry, and the market. He was sound in his judgment and in strategic
    thinking. He was a very competent business person.'

    \ with others, the excitement at arriving at solutions no one ever thought of.\n\
    \nBut first, let’s go over the rules for asking provocative, open-ended questions.\n\
    \n# Rule 1: Care About the Person You’re Coaching\n\n> Caring—about people, about\

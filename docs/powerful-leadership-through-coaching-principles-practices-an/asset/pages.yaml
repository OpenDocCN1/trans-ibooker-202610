- pgno: 156
  md: '# Coaching and

    Feedback


    > > Sometimes you can’t see yourself clearly until you see yourself

    > > through the eyes of others.

    > > —Ellen DeGeneres, American comedian, television host,

    > > actress, gender equality activist, writer, and producer


    Amy, the front-desk receptionist, believed that she was the face of the corporation
    to customers. When people came in, they saw and interacted with her first. She
    wanted to ensure that every interaction was a positive one. She smiled a lot,
    laughed a lot, and tried to help everyone who asked her for assistance.


    Until the day came when she received the feedback that she was trying too hard
    to please everyone. Her mindset and feeling about her role shifted. What she once
    considered to be a positive thing—in fact, her very job—became a source of doubt
    and discouragement. Negative feedback robbed her of some of her confidence. She
    still tried to be helpful, but she was not as happy about it.


    What is the purpose of feedback? To help people engage fully in their work by
    leveraging their strengths, skills, competency, motivation, and experience. After
    all, their success is your success! It is estimated that 70% of a customer’s experience
    with a company’s brand is through their interaction with front-line employees.
    We should seek to treat our employees as we do our finest customers.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# The Balancing Act of Giving Feedback


    Most of us have received job performance feedback throughout our career. Many
    leaders are equipped with great coaching skills and know how to give feedback
    to help people improve. Others use feedback as a hammer. Still others aren’t quite
    sure how to give feedback.


    Harsh feedback can demotivate and derail performance. Charles Schwab, former CEO
    and a great personal wealth manager and financial investor, says, “I have yet
    to find the man or woman, however exalted in their station in life, who did not
    do better work and put forth greater effort under the spirit of approval and support
    than under a spirit of criticism” (Schwab 2004).


    Dr. Don Clifton, former head of the American Psychological Association and father
    of strength-based feedback and developmental psychology, gathered 50 years of
    Gallup research from 20,000 leadership interviews and 10,000 follower interviews
    to find out what effective leaders do well. Clifton discovered that the most effective
    leaders regularly and frequently seek and offer feedback in order to maximize
    the strengths of their people.


    People get energized if they can approach the feedback process openly and positively.


    But a lot of damage can be done, all in the name of feedback— which is perhaps
    why we dread giving it almost as much as we dread receiving it. If feedback is
    used as a punitive, punishing, “knife in the back” approach, engagement and performance
    will decrease rather than increase. Some people hide behind anonymous feedback
    surveys: like trolls on the Internet, they take aggressive, abusive shots at their
    colleagues, who are generally seeking to improve. There is instructive, helpful
    feedback; and there are very negative, abusive forms of feedback. Feedback should
    never be used in a punitive, manipulative, or abusive way.


    Feedback has a purpose: most people think they know what they’re good at, and
    they are usually wrong. They have not stopped to see where their natural gifts
    and talents lie. Feedback has the potential to fill in the blind spots and provide
    clarity on strengths, as well as the ability to recognize areas of improvement
    and opportunities.


    Marshall Goldsmith has argued that feedback is necessary because some people are
    “incredibly delusional.” He observes that 95% of'

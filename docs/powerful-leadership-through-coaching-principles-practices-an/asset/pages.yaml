- pgno: 233
  md: 'with leaders begins with the strategical level, then the operational level,
    and ultimately the team and tactical levels. This means coaching can be extremely
    useful at all levels. I believe a critical role with the executive and leadership
    team is a partnership with human resources or talent management, helping to build
    internal leaders who can become coaches, thus building a coaching culture across
    the organization. Internal leader-coaches can help individuals and teams everywhere
    to align and cascade vision, values, strategy, and goals to each business unit
    and function at every level.


    # Introducing the 7 Core Factors for Organizational Change


    All organizational learning and change is dynamic and takes time to implement.
    It doesn’t happen overnight and will not happen overnight; it requires top-level
    sponsorship and ongoing discipline to follow what I call the *7 Core Factors for
    Organizational Change*. Having worked with thousands of organizations across the
    world—corporate, government, education, and nonprofit—I have found that coaching
    leaders to answer 7 Core Factor questions can work well at any level, in any industry,
    and in any culture, if the leaders, sponsors, and internal coaches fully commit
    to the process. Success hinges on intensive coaching and ongoing follow-up. This
    process is not about simply teaching or training. It is an ongoing sustainability
    process that requires follow-up, accountability, ratification, engagement checkpoints,
    and ongoing coaching.


    The 7 Core Factors are asked first at the strategic level and then at the operational
    levels, and then at the tactical and team levels. We will begin to uncover and
    help design and align around the following organizational coaching areas:


    +   1. “Why does our organization exist? Who do we serve?”

    +   2. “What are the cultural values, beliefs, and norms?”

    +   3. “Where is our organization going strategically?”


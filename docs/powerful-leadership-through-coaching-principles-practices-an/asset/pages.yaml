    If scarcity can be a natural response from childhood, then how do we embrace an
    abundance mindset as we grow into higher levels of personal security, self-worth,
    and maturity?


    Coach and author Naphtali Hoff suggested several ways to live your life and lead
    abundantly at work (Hoff 2017). One way is to write down the benefits of the abundant
    life. This can help you to become more self-aware of the benefits of being abundant
    and to rewire your thinking and make positive changes. Other methods may be to
    reward those around you who choose to act in abundant win-win ways. Find a way
    to bring generosity, civility, and mutual benefit into your work environment and
    into your home. Remember that what goes around, comes around. What you give to
    others you get back in return—eventually. “People appreciate generosity and often
    find ways to give back,” Hoff says.


    While I was preparing for a workshop on trust with the CEO and executive team
    of Zotec Corporation, the company’s head of human resources came to me and said,
    “We have a leadership advisor who will be attending your trust and culture work
    session today. His name is Coach Lou Holtz, the head football coach at Notre Dame
    University from 1986 to 1996. He has been advising Zotec’s leaders for years and
    would like to sit in and learn from you today.”


    I was surprised and taken back—you could even say “shocked”—because I seriously
    thought, “I would rather listen to Coach Holtz talk about leadership and trust
    throughout the day, rather than listen to myself.” Coach Holtz was gracious, kind,
    witty, intelligent, and insightful. I would raise a topic and say, “Hey coach,

  md: 'your self-worth can empower you to walk down an even brighter path. Transforming
    fear into freedom—how great is that?” (O’Brien 2014). Such vision and goal setting
    must meet certain goal planning principles and criteria (McChesney, Covey, and
    Huhing 2016):


    +   - *Understanding the “why” behind the goal* is the first step. There must
    be a good motive for either pain or gain. Goals must have a strong benefit or
    business case that feels logical, rational, and motivating.

    +   - Goals must be *practical but motivating*. If a goal is not realistic and
    winnable, there is no hope; but without a meaningful challenge or gap to close
    with the goal, there will be no motivation.

    +   - Goals must be *measurable*. The goal must move us from X to Y with a clear
    gap, a clear measure, and a clear finish line or realistic target date for the
    goal to be achieved.

    +   - Goals must be *influenceable*. The team must be able to influence the outcome
    at least 80%, or its achievement is out of their hands.

    +   - Goals must be *collaborative*. There must be commitment to the goals by
    all parties involved. Goals must be legal, ethical, and environmentally and culturally
    sound.


    Some of the best thinking on goals comes from Sir John Whitmore, world-renowned
    performance coach and international consultant, and creator of the GROW coaching
    model for achieving goals. I first encountered the GROW model while working at
    Pricewaterhouse Coopers in New York in the late 1990s. Since then, I’ve seen the
    model adopted worldwide because of its effectiveness in establishing clear goals
    and expectations for team members.


    GROW is an acronym for Goals, Reality, Options, and Way Forward. Many coaches

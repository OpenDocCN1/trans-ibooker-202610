  md: '# High Skill/Low Will (Capable)


    How to best engage those capable:


    +   - Identify reasons for the low will (e.g. task/management, style/personal
    factors).

    +   - Identify and connect with their key motivating factors.

    +   - Work on their confidence by developing a vision of how good they could be
    at completing the task.

    +   - Monitor with feedback and praise.


    ![](img/3b9ba4a318234a9c4d131f84093751e0_185_0.png)


    Figure 12.4 High skill/low will (capable)


    opportunities to grow and develop. Coach this person to promote freedom and flexibility
    to do their job and set goals and objectives, not methods. Give them more autonomy,
    freedom, empowerment, and flexibility in their role. The employee should be praised,
    not ignored, and encouraged to take on more responsibilities and participate in
    greater levels of ownership, autonomy, and authority with decision-making and
    by expanding their role. The employee should be given the freedom to take on appropriate
    risks, supported and entrusted, but not over-managed.


    Quadrant 3—Capable (Figure 12.4): This is a capable person who has high skill
    but lacks the will and motivation to complete the job or task. They have hit a
    wall and need a new why, a purpose, or a challenge or support from others to overcome
    barriers with execution to get things done. The leader should find ways to connect
    with the person’s motivations and leverage their strengths. Sometimes these employees
    may talk a good game and be highly analytical or very experienced, but they do
    not execute well or walk the talk. Coach them with regular feedback and praise.
    Surround them with people, resources, and things that can help them execute and
    make up for their limitations with will, motivation, drive, or execution capability.


    Quadrant 4—Doubtful (Figure 12.5): This person has neither the skill nor the will
    to complete the job or task to be effective in their role. They may also be a
    beginner who is risk-averse and afraid to fail. The leader should assess and coach
    first, to build the will by identifying motivations, values, and a vision for
    the'

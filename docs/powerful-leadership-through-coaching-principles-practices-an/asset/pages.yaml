- pgno: 23
  md: '# My Personal Coaching Journey


    waves and talked about where we had been and what was left to do. It felt like
    the world had stopped, with the sun on our faces, the warm water, and sounds of
    the breaking surf—it was like a small slice of heaven.


    We talked things back and forth, from professional to personal. No notes, no time
    limits, no distractions—just a safe, confidential, human connection. I had found
    the ideal coaching relationship, far more than just a transaction between a consultant
    and a client. It felt like my entire career as a coach had led to this enlightened,
    nirvana moment in the Pacific. Ocean, connecting with that incredible human being.


    I reflected on the life experiences that had led me here.


    I looked back on my years with Covey Leadership Center, beginning in 1987 as the
    35th employee, under the mentorship of the legendary Dr. Stephen Covey. His principle-centered
    approach to life and work inspired me, and I saw how I could use it to unleash
    my own potential and dramatically impact many of the Fortune 500 companies. I
    helped train leaders at Robert Redford’s Sundance Ski Resort in the 7 Habits Principle-Centered
    Leadership. We worked with executives on their 360-degree feedback to pinpoint
    how to improve their effectiveness, and then used a blended model of training,
    coaching, and certification to facilitate their personal and organizational development.


    In August 1995, I left Covey Leadership Center to teach business at South China
    University of Technology in Guangzhou and consult with Nike Corporation on building
    high-potential Chinese leaders. There I learned even more how central coaching
    can be to changing mindsets, to adapting to rapid change, and to building high-performance
    teams.


    Returning to the United States, I entered the graduate school in Organizational
    Behavior at Columbia University in New York City. I was excited to bring my decade
    of practical work experience to research projects on organizational change and
    high-performance team building. As I applied different human-performance theories
    and change models to leaders at the United Nations and Ernst & Young, I was brought
    back again and again to the importance of leadership mindset.


    At Columbia, I met Dr. Terry Maltbia, director of the university’s professional-coaching
    certification program. A world leader in the study and practice of business coaching,
    he has allowed me to partner with'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'him in certifying many effective coaches around the world. Terry is not only
    an expert in the various coaching models and tools, but also a wonderful model
    of empathic listening and provocative questioning—essential coaching skills.


    After Columbia, I joined the Strategic and Organizational Change Practice at PricewaterhouseCoopers
    in New York, helping them develop their partners through a program called “PwC
    Leadership and Teamwork in Action.” In my role as regional Knowledge Management
    practice leader, I met quarterly with PwC thought leaders across the United States,
    Europe, and Asia to share client experiences and research results.


    As it became more and more clear to me that executive coaching had tremendous
    influence on organizational results, I dove deeply into it, becoming certified
    as an executive coach by Columbia University, the University of Maryland, and
    Inside-Out Coaching.


    These influences and others have helped me immeasurably in my leadership development
    and international coaching practice. As I have sought to “influence the influence
    in people, teams, and organizations everywhere.” My career in coaching has offered
    the incredible privilege of working directly with thousands of leaders and organizations
    worldwide.


    I’ve also enjoyed writing seven books on leadership and coaching to leverage my
    professional work and amazing journey around the world. These writings have helped
    to synthesize and highlight practical experience over the years engaging with
    many diverse and inspiring leaders, teams, and organizations.


    I tell you these things not to simply provide you my experiences, but to outline
    my global journey and the deep corporate and government experiences I’ve had in
    coaching and leadership development, so you can read this book with confidence
    that I know whereof I speak.


    That’s enough about my fun and enjoyable journey around the world. Now, let’s
    talk about why you as a leader or manager should want to become a great coach.


    # References


    +   Jobs, Steve. (2005). *Commencement address*. Stanford University.

    +   Sheff, David. (1985). *Playboy interview: Steve Jobs*. http://reprints.longform.org/playboy-interview-steve-jobs.'

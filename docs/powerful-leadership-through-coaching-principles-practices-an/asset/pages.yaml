    running fast on life’s treadmill and cannot get off. Many of life’s events can
    negatively or adversely impact our personal health, worth, value, or satisfaction.


    A coach with a whole-person mindset can truly help people self-assess where they
    are now and gain insights into each dimension of their lives. Coaches can help
    people examine what matters most to them. Each person has diverse needs, aspirations,
    passions, expectations, and desires. The key is to remember that each person is
    a whole-person, and their interests, dreams, pursuits, and needs are as diverse
    as there are stars in the universe. Coaches can help people examine their financial
    wealth and security goals; their physical health, wellness, and nutrition goals;
    their key loving relationships and social connection goals; their academic, professional,

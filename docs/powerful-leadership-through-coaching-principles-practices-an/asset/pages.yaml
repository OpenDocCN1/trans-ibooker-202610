  md: '# Choosing Your Story


    > You can’t stop the onslaught of the pounding waves, but you can learn to surf.

    > —Jon Kabat-Zinn, American professor emeritus of medicine and teacher of mindfulness


    Like Jack Welch, we can tell ourselves a different story about our challenges
    and surmount them. A great coach continually urges clients toward a mindset that
    makes the most of any situation. When the client’s story isn’t working, the coach
    helps them reframe, rewrite, and choose a different story.


    When I coached Ethan, the company he worked for was expanding internationally.
    Ethan had been good at setting price points for new products domestically, but
    the international markets were much trickier. Meanwhile, Ethan’s peer was a true
    expert at pricing. “And, truthfully, he thinks he should have my job,” Ethan admitted
    to me. “His passive aggressiveness is overwhelming at times.”


    I asked Ethan if he thought his own response to his peer was within his control.
    Of course it was, he said. No matter how difficult the situation, we can always
    choose our response to it. We have no control over how others behave, whether
    they are passive-aggressive, toxic, or openly hostile, but we can frame our own
    response. Someone else’s anger, hostility, ego, dominance, and diminishing behaviors
    have nothing to do with us, so why should we allow them to control our behaviors
    and possibly ruin our lives?


    I asked Ethan, “When you encounter this passive-aggressive behavior, what is a
    productive way to respond? What are the opportunities for improving this situation?
    How can you influence the situation in a more positive way? Who are your allies?
    Who are your advocates when someone is being destructive or diminishing you?”


    Unfortunately, the antagonizing peer did not become his best friend—there are
    no fairytale endings here—but through ongoing coaching Ethan thrived. As his coach,
    I was able to help him reframe his story of bitter helplessness and victimization.
    He found new resources and allies at work. He developed some practical tools to
    help handle this difficult situation.


    “When you’re going through a hard time, there’s a part of you that doesn’t understand
    that it’s going to be all right, that you’re going to'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'come through to the other side,” Ethan told me later. “It was hard for me to
    keep moving forward when I just wanted to give up. I was so focused on the negative,
    I did not leave enough room for the positive to sink in. Knowing I could control
    my response and that I had rational options helped me see the situation through
    a different lens. I started looking through a positive lens instead of a negative
    doom-and-gloom lens.”


    Fundamental to coaching success is this ability to help people reframe unproductive
    mindsets. As a coach, you start by discovering the client’s mindset and whether
    it accurate or not. What in that mindset is blocking the client from seeing a
    whole world of possibility? That’s the most crucial discovery you can make as
    a coach because it governs everything you do from then on. In addition to mindset,
    it is also important to examine their results and see if those results offer them
    outcomes that give them success.


    # PRACTICE: YOUR COACHING PLAYBOOK


    Based on what you’ve learned in this chapter, grade your own mindset. On a scale
    from 1 (low) to 10 (high), how positive and optimistic is your mindset? Where
    do you fall short? Are you a victim of what fate or circumstance has dealt you,
    or fixed in an unproductive narrative? Do you have it within yourself to grow,
    improve, and change your narrative? Can you help others discover their own effective
    stories? As a leader, in what ways can you begin to improve your mindset and your
    team’s mindset? Check yourself against the following questions.


    # Mindset Check List


    +   1. Do you have positive inner thoughts and messages for yourself with good
    intent or motive?

    +   2. Are you acting with integrity and in alignment with your deep-seated motives,
    values, and beliefs?

    +   3. Are you assuming and looking for good intentions in others?

    +   4. Are you acting toward others with genuine care, respect, and mutual benefit?

    +   5. How can you catch others doing something right?

    +   6. How will you make time to connect with others in honest and open communication?

    +   7. How will you actively listen, show respect, and fully understand the viewpoints
    of others?'

  md: 'hard—I value these people and community connections tremendously. However,
    they should not be at the expense of the things that matter most, given my limited
    time with my family.


    It’s still hard to stay balanced. But now, when I am home, I have learned to be
    better about saying no to a lot of “good things,” “good relationships,” and “worthwhile
    urgent activities.” With limited time, I am learning to dedicate blocks of time
    for myself and exercise or renewal, my most important relationships with my family
    and friends, and other key community interests.


    There will always be more worthwhile, urgent, and good demands on your time than
    you have time and capacity to execute. The key to whole-person balance and discipline
    among the five dimensions is to review each area every week. Do not neglect one
    of them at the expense of the others. Don’t get caught up in the good things in
    just one or two dimensions. As Jim Collins says, “The enemy of the great is the
    good.” Keep a holistic, balanced view across every dimension.


    This “aha” moment from my Columbia Coaching cohort practicum helped me realize
    I needed to better plan, prioritize, and fully commit to my mission and vision
    statements. Then, I needed to responsibly commit to improving my own wellness
    and energy levels while finding better ways to connect with my wife, four boys,
    and others who mattered most. The German writer and statesman Johann Wolfgang
    von Goethe said it best: “Things that matter most, must never be at the mercy
    of things that matter least.” As I reflect on my coaching experience with Ann
    Powers and on Goethe’s quote, I am coming to understand that choices in life are
    not always between good and bad or right and wrong; many times responsible choices
    are between good, better, and best.


    We all make decisions and place goals, values, needs, and importance on where
    we choose to spend our time and where we choose not to spend our time. Defining
    why and where is critical to self-awareness about where we allocate our time,
    effort, and resources. Losing my father at age 19 brought a more intense focus
    on why I desired to be more “present and available” as an active part of my wife’s
    and boys’ lives. I sincerely desire to connect and engage with them, to teach
    and affirm them, and to raise these great boys to be responsible men who lead
    lives of integrity and make meaningful contributions to society and their future
    families.'

- pgno: 280
  md: '# About the Author


    ![](img/3b9ba4a318234a9c4d131f84093751e0_280_0.png)


    Michael K. Simpson is one of the world''s preeminent executive coaches, leadership
    thought leaders, and organizational development consultants and advisors to top
    leaders and teams globally. He is a distinguished author of eight leadership and
    coaching books, an engaging keynote speaker, and a practitioner who has held senior
    executive positions and served on numerous boards of directors. As a coaching
    and leadership development thought leader, Michael has spent 30 years, in over
    35 countries, helping leaders and teams drive vision, strategic direction, goal
    execution, accountability, and a high trust culture. For over 20 years, Michael
    has been the Managing Director of Executive Coaching and a Global Consultant with
    FranklinCovey''s Strategy Execution, Leadership, and Trust Practices. As a facilitator,
    teacher, and keynote speaker, he was on the faculty for three years at Covey''s
    Executive Leadership Summit, teaching with Dr. Stephen Covey, Dr. Ram Charan,
    and Dr. Mette Norgaard. Michael also taught and coached senior government leaders
    for three years at the US Department of Defense''s senior executive Vanguard Leadership
    Program in Washington, DC. Michael has conducted thousands of executive offsite
    leadership retreats and offered executive coaching to senior leaders and teams
    in top organizations, including: General Electric, PepsiCo, Frito-Lay, Marriott,
    Hilton, Coca-Cola, IBM, Hewlett Packard, Xerox, Lilly, Baxter, Amgen, Sunovion,
    Johnson & Johnson, Nike, HSBC Bank, OCBC Bank, Bank of Islam, John Deere, Whirlpool,
    TE Connectivity, ExxonMobil, Chevron, Shell, Petronas, United Nations, NASA, NATO,
    Los Alamos National Labs, US Nuclear Regulatory Commission, US Department of Homeland
    Security/ICE, US Army, US Navy, US Air Force, US Marines, and US Coast Guard.


    Michael was a Principal Consultant in the Strategy and Organizational Change Practice
    for PricewaterhouseCoopers in New York City. He was a Senior Consultant in the
    Change Management Division for Ernst & Young in Washington, DC. He was Vice President
    of Sales and Marketing for two leading technology companies, Mediconnect Global
    and America To Go. Michael is CEO of Simpson Executive Coaching, and CEO of Impact
    International Education (IIE) in China, in partnership with Franklin-Covey-International.
    He leads 7 Habits and Leader in Me'

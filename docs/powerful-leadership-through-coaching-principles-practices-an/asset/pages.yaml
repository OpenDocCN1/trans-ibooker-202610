    When you design, you test assumptions, creatively and innovatively brainstorm,
    imagine desired future states, and explore various options for going forward.


    In the design phase, you may want to ask Morgan:


    +   - “What has worked in the past to help close sales?”

    +   - “What new or creative actions could you take to help advance and close your

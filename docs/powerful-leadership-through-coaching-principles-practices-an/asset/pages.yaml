  md: '# Interpersonal Maturity and Effectiveness Requires Balancing Courage and Consideration


    Balance both courage and consideration. Doing so is the essence of high maturity.
    Dr. Covey taught that a leader can be both courageous (honest and direct) and
    considerate (loyal and respectful) at the same time. Courage is a willingness
    and ability to speak your thoughts, feelings, issues, and challenges with complete
    transparency. Consideration is a willingness and ability to seek and listen to
    others’ thoughts and feelings with affirmation, courtesy, and respect.


    A leader as coach should be courageous, which focuses on honestly and directly
    confronting the brutal facts about goals, targets, measures, numbers, scoreboards,
    ethics, values, rules, policies, guidelines, and laws. At the same time, a leader
    as coach should be considerate and give feedback in a way that is helpful, safe,
    kind, and respectful. Keep in mind feelings, context, circumstances, capabilities,
    differences, history, expectations, and personality differences.


    A leader as coach who is courageous but inconsiderate can be perceived as being
    “win/lose” a thinker. However, if a leader as coach only seeks to be considerate
    and not courageous, they will be perceived as being “lose/win.” Neither of these
    approaches is sustainable for long-term success. The leader as coach should practice
    using a balance of both approaches in conversations (Covey 2006, pp. 230–232).
    To be successful, you must start first with kindness, respect, and considerate
    language and behaviors. Then seek to be courageous, honest, and transparent about
    the goals, measures, targets, laws, and objectives.


    Clarify your intent. Be open and explicit in sharing your motives. “This is what
    I intend to do and why.” Based on your observation and your personal experiences,
    you can say, “I see the problem as . . .” “From my perspective, this is what I’ve
    observed . . .” “Here is where I come from . . .” “My perspectives may be limited
    or short-sighted, but this is what I’ve seen . . . or this is what I intend to
    do.” Always come first from a place of openness, consideration, and respect. When
    we begin with consideration, people open up because they feel safe and not judged.
    Ask your clients, customers, or partners how to move forward and get better together.
    “What are the shared objectives or the shared pool of opportunities for us to
    work better together? What are ways can our teams begin to work better together
    going forward?”'

- pgno: 204
  md: 'that he was stupid, worthless, and a failure, he discovered the truth: he was
    not worthless, not a failure, and not stupid.


    With counseling, a supportive foster family, and many people who noticed and cared
    about him, Sam was able to reframe his inner negative dialogue. He began to have
    daily inner conversations that became positive, affirming, and full of hope. He
    realized he was smart, he could be a good student, and his hard work ethic could
    pay off in the classroom and on the football field. He also found peace in attending
    a local church and claimed further light and hope in who he was and what his destination
    could be through his faith. He connected with God and found happiness in worship,
    which helped him overcome the negative life challenges that young people should
    never have to face in their lives.


    Ultimately, the “dirty little kid” (as Sam calls himself) played Division-I football
    on an athletic scholarship at Georgia Tech University, and was a four-year starter,
    a team captain, and all ACC newcomer of the year. He received two academic All-American
    honors his junior and senior years. He graduated from Georgia Tech with honors,
    served a full-time, two-year mission for his church in Toronto, Canada, and received
    his MBA from Brigham Young University. Sam has been happily married to his sweetheart,
    Kim, for over 30 years, and they have four beautiful children.


    > “My proactive change all started first with gaining a bold vision for my life.
    I had to reframe my negative experiences and see a new and better future of who
    I was and who I wanted to become. Don’t ever be happy with where you are. Don’t
    look back on negative life experiences with anger, regret, or resentment. I realized,
    life is hard, life is full of setbacks and opposition. I had to look forward and
    find my passion and purpose in life. I realized that I could choose a different
    path in life than the one I was heading down. People along the way helped me develop
    a vision of who I could be and who I wanted to be. They helped me realize that
    I could make choices in life to achieve a unique contribution despite my awful
    past. Once you’ve made substantial progress along your path, reflecting upon how
    far you’ve come and what you’ve accomplished with the help of so many, life can
    be humbling and gratifying—it is a sweet life” (Bracken 2012, pp. 1–31).


    There is a lot to unpack with the life story of Sam. We are all products of our
    life’s story with all its twists, turns, ups, and downs. Life'

    +   - He communicated very well and connected personally with each player.

    +   - He helped us form great relationships and build our confidence in each other.

    +   - He put in the time needed to prepare his players well for every game.

    +   - We had fun!


    Coach Burnside took us from being young, immature kids to being confident, focused,
    and skilled champions.


    Can you re-create that in your life and in your business? Can you create a great
    team by discovering individual strengths and potential, communicating effectively,
    actively forming relationships of trust, and putting in the time necessary to
    help develop the talents, skills, and capabilities of those around you?


    If you cannot say, “Yes!” to this now, you will be able to by the end of this

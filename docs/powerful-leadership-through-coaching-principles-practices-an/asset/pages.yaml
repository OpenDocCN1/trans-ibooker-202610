- pgno: 183
  md: 'it relates to doing the job. If their skills are not performing at base-level
    performance or if they are falling behind, they can disengage or lose confidence;
    likewise, if their will is lacking—their passion, drive, motivation, intensity,
    and excitement—their productivity and performance can lapse over time.


    This was the case with Mario. We needed to determine where his skills would be
    best applied in his role and responsibility. We also needed to find opportunities
    that would energize him and help him find passion and greater motivation with
    his will.


    Introduced by Max Landsberg in his book *The Tao of Coaching*, the Skill-Will
    Matrix is a tool to help you identify ways to motivate people and keep them fully
    engaged. The matrix allows you to gauge the current situation of a particular
    individual and guide them to finding new skills and new excitement in their work.


    The Skill-Will Matrix assesses employees against two sections (Figure 12.1): the
    Skill section is the individual’s capabilities based on their experience, training,
    competence, skills, and knowledge. The Will section is the individual’s attitude,
    motivation, desire, drive, determination, and passion. People with high skill
    and high will are essential to any high-performance organizational culture.


    # Skill/Will


    | | |

    |---|---|---|

    | Guide

    Aspiring

    Invest

    Train | Delegate

    Excel

    Support

    Promote |

    | Direct

    Doubtful

    Decide

    Remove | Motivate

    Capable

    Challenge

    Engage |


    Figure 12.1 The Skill-Will Matrix


    Source: Adapted from (Landsberg 1997).'

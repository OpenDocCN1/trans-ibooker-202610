  md: "them, move away from unproductive mindsets, and create their own solutions\
    \ to big problems. I always feel that I am walking on sacred ground when I engage\
    \ in such transformational, inspiring work.\n\nMy job is to be genuinely curious\
    \ and ask questions that provoke clients to examine their mindsets, missions,\

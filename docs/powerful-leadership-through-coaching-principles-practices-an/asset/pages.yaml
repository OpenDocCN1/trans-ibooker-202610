- pgno: 95
  md: '# Coaching with Authenticity


    When Alison reports to work on a good-mood day, she appreciates it the way we
    might enjoy a sunny day in January: we take it while we can. But these sunny days
    do not fool Alison. Unfortunately, she has learned that they do not last.


    A good leader, a good coach, does not have a mindset as fickle as the weather.
    A good leader-coach chooses their own weather. They choose to be positive, optimistic,
    curious, and emotionally intelligent.


    > Dr. Daniel Goleman wrote, “When leaders habitually use displays of bad moods
    to motivate, more work may seem to get done—but it will not necessarily be better
    work. And relentlessly foul moods corrode the emotional climate, sabotaging the
    brain’s ability to work at its best” (Goleman 2014).


    > Goleman continues, “The leader can drive an employee’s emotions to a better
    or a worse state.” Which state do you choose?


    It depends on how emotionally intelligent you are.


    *Emotional intelligence* is the ability to control one’s own emotions and to handle
    interpersonal relationships “judiciously and empathetically,” according to the
    dictionary. Simply put, emotionally intelligent people connect effectively and
    consistently with others.


    Emotionally unintelligent leaders don’t control their emotions well. They play
    victim, they fight, they abandon, they micromanage, they manipulate—they don’t
    know any other way to get results. Unfortunately, their toxic emotions are contagious.
    Goleman compares them to viruses: “A steady dose of toxic energy from higher-ups
    will encourage valuable team members to update their resumes rather than their
    to-do lists” (Goleman 2015).


    Such energy can also go from peer to peer. A study of 70 work teams across diverse
    industries found that people in meetings together ended up sharing moods, good
    and bad (Goleman 2015).


    Emotionally intelligent leaders coach their teams toward awareness. For example,
    IDEO Corporation, known for innovating world-class products, intentionally banishes
    victimization, blaming, and shaming. IDEO’s website (https://www.ideo.com/about)
    states that it is “a global design company committed to making a positive impact.”
    IDEO believes failure is necessary for innovation. The company lives by these
    standards:


    +   1. Be optimistic.

    +   2. Collaborate.'

  md: 'My general rule is this: after you ask a question, count to 15. Silence is
    uncomfortable, and people naturally want to fill it—just make sure it isn’t you!
    If you don’t get an answer after 15 seconds, then you rephrase the question if
    you want to.


    Listen carefully to the individual’s or team’s responses. You’ve permitted them
    the space and luxury of thinking through your question. From there, you can guide
    their thinking: help them reframe their thinking or move toward solutions of their
    own.


    # Rule 3: Clearly Identify the Topic of the Conversation


    > *The main thing is to keep the main thing the main thing.*

    > —General John Paxman, US Marine Corps


    Coaching is always about context. What is the situation? What is going on? What
    is the defined topic and scope of the coaching conversation? You may know why
    you want to have a coaching conversation with the employee, but does the employee
    share the same vision and commitment? To get on the same page, the following coaching
    questions are very helpful in clarifying the topic of conversation:


    +   - “What’s your understanding of the purpose of our coaching conversation?”

    +   - “What topic or issue do we want to focus on today?”

    +   - “Why are we here? What are the issues, challenges, or opportunities that
    bring us together?”

    +   - “This is what I perceive as our purpose for coming together. . . . What
    do you think? How do you see it?”

    +   - “What do you feel is the most important thing for us to discuss today?”



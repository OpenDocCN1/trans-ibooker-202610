    +   - “Why is this so challenging for you?”

    +   - “Why would you want to focus on that?”

    +   - “Why do you think that’s the case?”

    +   - “How does that inform your thinking?”

    +   - “How would you like things to be different?”

    +   - “What was most useful about this discussion?”

    +   - “What stops you from doing that?”

    +   - “What could you do to make that happen?”

    +   - “What have you learned?”

    +   - “Which do you see as being most important to focus on?”

    +   - “How does that impact your team? Your organization? Your customer? Your
    position in the marketplace?”

    +   - “When you say you are overcoming this issue, what makes it so difficult
    to change? Why?”

    +   - “How will you apply that in your current role?”

    +   - “Because you’re finding it difficult to apply this in your leadership role,
    what specifically could you do differently to make a change?”

    +   - “How could you apply that thinking with your team?”

    +   - “What did you learn from this situation that will make a difference in your
    job?”

    +   - “What are you committed to do?”

    +   - “What actions will you take?”


    Good questions can be shocking, but in a good way, like settling into a warm spa
    or Jacuzzi when it’s snowing outside. We don’t ask questions for their “shock
    value,” but to create honest self-awareness and reflection. Provocative questions
    can help solicit insight and create new perspectives.


    And there’s an important benefit: as team members internalize the questions and
    own the answers, they learn how to coach and question themselves so when the next
    issue arises, they can be more self-aware and respectfully challenging with their

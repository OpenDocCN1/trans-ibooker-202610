  md: '# Coaching and Feedback


    leadership. Not everyone wants to change and improve. People see in themselves
    only what they are prepared to see. As a coach, you set the tone by the way you
    receive feedback from others: If you accept feedback with humility, others will
    more willingly accept feedback from you.


    In his book *Good to Great*, Jim Collins uncovered through extensive research
    that the highest-performing leaders in great organizations are humble. They are
    generally quiet, reserved, shy, and motivated to act on good information rather
    than overwhelm everyone with their charisma and ego. In fact, Collins feels that
    humility is the number-one characteristic of great leaders, or what he terms a
    *level-five*, highest-level leader. Their humility surfaces primarily in their
    ability to leverage feedback—to listen to the customers, the marketplace, competitors,
    and employees—and adapt to the necessary changes based on input and ongoing feedback
    (Collins 2001).


    I wasn’t surprised by this research because we have all seen that the downfall
    of most civilizations, countries, companies, and individuals begins when they
    become self-centered, internally focused, arrogant, myopic, and isolated from
    honest, candid feedback.


    Dr. Clayton Christensen, renowned Harvard Business School professor, once asked
    his MBA students to describe one person they knew who was very humble. It turned
    out that the humblest person they knew was also the person they admired the most.
    For the students, humility was not a self-deprecating behavior; rather, it was
    a sign of a healthy self-esteem accompanied by an openness to feedback.


    I remember early in my career, Dr. Stephen Covey would often say that humility
    is the mother of all principles, and obedience to principles is the father. We
    need to be open and humble to market, customer, and employee feedback. Then, we
    need to obediently align to those principles of continuous improvement, innovation,
    and getting better.


    I have been assigned to coach leaders all along the humility spectrum. For example,
    Austin was a very energetic, innovative, and experienced executive. After many
    years, he had worked his way up in the business to the proverbial corner office.
    Unfortunately, now that Austin had finally achieved everything he wanted in terms
    of professional success, he treated everyone around him as if they were idiots.
    He had to be the smartest person in the room. He was the source of all knowledge
    in his department, and if anyone spoke up independently, Austin quickly neutered
    their voice.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'The consequences in Austin''s department were dramatic and noticeable. His
    employees were disengaged. They went silent, which was fine with him.


    I was brought in as a coach for Austin. I asked him, “Austin, do you realize how
    you are showing up in the office with your team?” Austin thought he was dynamic,
    engaging, and fun. He did have a very charming side, which his employees saw to
    an extent. I asked them, “What do you love about Austin?” They conceded he was
    bright and charismatic and possessed a lot of competence in his role—but he had
    a temper, he had his own agenda, and they couldn’t trust him. He thought he was
    a smooth operator, but others disliked him intensely and saw him as an obstacle
    to the success of the team.


    I asked him, “Are there any derailing behaviors you have that you would like to
    change?” He couldn’t think of any. “What do you want to do about this?” I asked,
    confronting him with survey responses from his employees. He quickly turned into
    a victim. “What can I do?” he asked. “I’m doing the best I can with the staff
    I have; they’re all idiots, and I can’t help it if I get easily frustrated with
    stupid people!”


    The ego is a hustler; it wants to protect itself against honest feedback. It needs
    to be the smartest one in the room. It needs to be in control, it can be very
    hard on other people, and it seeks to promote itself nonstop. Ego can even hide
    under the mask of false humility. Austin’s ego was calling in reinforcements;
    he was not open to feedback, input, and change.


    “But Austin,” I said, “what will the cost be if you do not change?” Unfortunately,
    Austin soon afterward learned the cost: he was terminated from his position. Despite
    his solid financial results, he lost his influence because his values were contrary
    to the culture of the company, and he was unwilling to change. His demise was
    not about what [goals, financial results, measures, and targets] he produced;
    it was how [language, communication, behaviors, and values] he produced it. The
    how was not sustainable and was inconsistent with his ability to build a high-trust
    culture.


    In contrast with my work with Austin, I had a far more satisfying experience conducting
    a leadership work session and coaching assignment with a billion-dollar global
    company in Dallas, Texas. I was working with the CEO, Duncan (who has become a
    very good friend), as well as with his executive team from Europe, Asia, Latin
    America, Canada, and the United States.'

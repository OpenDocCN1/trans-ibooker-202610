- pgno: 114
  md: '# Setting

    Priorities


    > > *It is not enough to be busy . . . the question is: What are we busy about?*

    > >

    > > —Henry David Thoreau, American author, essayist, poet, and philosopher


    Thoroughly and physically beaten, a man collapsed near a major thoroughfare. He
    struggled on the side of the road. He was not alone, but that did not mean people
    rushed to his aid. In fact, people passed this man without stopping to help—out
    of fear or disinterest, we do not know.


    This horrific event did not occur on the busy streets of New York City or a hot,
    sunny sidewalk in Los Angeles. The story is found in the Bible, and it is simply
    known as the story of the Good Samaritan.


    At last, another traveler—a Samaritan—stopped and not only helped the man but
    quite literally went “the extra mile” to ensure that the man was able to recover,
    even though it came at considerable cost to the Samaritan in terms of both time
    and money. The Samaritan had no reason or obligation to help the victim but did
    so anyway.


    In 1973, college students at Princeton Theological Seminary decided to reenact
    this classic story. Forty students preparing for the ministry were asked to participate
    in a general study. Their task was simple: report to one building for an assignment
    and then go to another to fulfill a task.


    In the first building, they were given a questionnaire and instructed to go to
    another building for their actual task. They were told, in varying degrees (slight,
    medium, and extreme), to hurry to their next location, where they were to give
    a talk about either their future career or the parable of the Good Samaritan.
    On the way—directly on the'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# ## Setting Priorities


    path to the second building—was staged another student, who was hunched over and
    clearly in need of help.


    Did anyone stop to help? Some did.


    The variable of what they were going to do next—either talk about their career
    vocation or talk about the story of the Good Samaritan—was found to have no direct
    correlation to the outcome. However, what the researchers called the “hurry” factor
    did. The greater the time constraint, the less likely participants were to stop.
    Only 10% of the “high hurries” stopped to help, while 63% of the “low hurries”
    did.


    What’s the takeaway? Perhaps it’s this: if you’re trying to make a difference
    in someone’s life, the result depends on how you feel about the time involved.
    Do we get too caught up in the urgency of the moment and lose sight of what is
    truly most important?


    We focus intensely on time and the impact of how much or how little we have. Consider
    how many times you check your watch, your phone, your calendar, or the clock on
    the wall. Jude Rake, author of *The Bridge to Growth*, observes that people drowning
    in urgent responsibilities tend to stay afloat by dealing with the task that is
    “loudest”—that is, the most urgent matter that the most people are screaming about.


    What suffers in a world like that? Far more important but less urgent matters
    like vision, values, strategy, goals, talent development, coaching, and culture
    building. We’ll take care of those very important, but less urgent, things “when
    time permits.”


    > “Unfortunately, time rarely does permit,” Rake says, “and leaders who travel
    down this well-worked path deliver sub-optimal results, while wondering why their
    workforce doesn’t perform at a higher level” (Rake 2017).


    Coaching another human being is one of those “most important” but “least urgent”
    tasks. If you’re a leader, nothing is more important than helping your people
    succeed. But coaching requires building relationships. It requires trust. It requires
    frequent interaction.


    It requires planning, time management, and allocating time on your calendar.


    # ## Coaching Must Be a Priority


    Those who say “absence makes the heart grow fonder” know little about leadership.
    A leader who abandons people builds no relationships. If the coach is absent,
    the team languishes. This means you'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'must make time for coaching as a key leadership priority—in fact, the priority
    of coaching and connecting with your people is your key role as a leader. Consider
    who you need to connect with and coach.


    A comedian once said to his audience, “I’m sorry I’m late. I got here as soon
    as I wanted to.” Whether you’re the CEO or the brand-new hire, you have the same
    24 hours in a day and 168 hours in a week to work with. It’s the same for everyone.
    So, as a leader, what do you spend your time on? Or, more important, what do you
    want to spend your time on? The strength of your commitment to coaching says a
    lot about your leadership, and the time you give to it is the measure of that
    commitment.


    What you spend your time on says a lot more about your values than any plaque
    on the wall or verbal declaration that proclaims, “We value our people and culture.”


    My colleague and co-author of the book First Things First, Roger Merrill, observes,
    “There is a constant struggle between two powerful forces: one is ‘The Clock’
    which represents our time, goals, commitments, appointments, schedules, tasks,
    and activities. ‘The Clock’ deals with urgency, speed, and efficiency. The other
    is ‘The Compass’ which represents our mission, vision, values, key relationships,
    principles, conscience, purpose, and direction in life. ‘The Compass’ offers us
    direction and helps us clarify what we value, what we believe is most important,
    and where we are going” (Covey et al. 1994).


    Execution of our Compass priorities is a daily and weekly challenge because the
    pressing demands of the Clock keep urgently pushing at us.


    Business success depends on leaders who can successfully coach people to plan
    and create space for leveraging their most important values, priorities, relationships,
    time, and resources. Great execution is not simply accomplishing a goal. It is
    executing a goal in the midst of noise and hundreds of urgent tasks and priorities.


    For a meaningful life, it’s important to have big goals, to dream, and to dream
    big! I know this is hard to do because so many of us get caught up with day-to-day
    urgency and short-term priorities and never step back to give attention to the
    big picture.


    But big changes only happen when you have a big “why” to shoot for. That big why
    has to be greater than your moods, your distractions, and even your urgencies.
    (Admit it: many things that seem urgent aren’t really that important.) Unless
    you’re ready to go all in, you might as well stop reading now and take a nap.'

    \ |\n|---|---|\n| ▪ Fixed/closed | ▪ Inquiry/learner |\n| ▪ Problem-focused |\
    \ ▪ Solution-seeking |\n| ▪ Afraid of change | ▪ Embraces change |\n| ▪ Inflexible/controlling\
    \ | ▪ Active listener/empathetic |\n| ▪ Reactive/victim | ▪ Proactive/responsible\
    \ |\n| ▪ Directs/tells/advises | ▪ Explores possibilities/curiously explores |\n\
    | ▪ Excludes/defends | ▪ Accepts/open to ideas |\n| ▪ Blames/shames/judges | ▪\
    \ Includes/values differences |\n| ▪ Knows all the answers | ▪ Opportunities/discovery\
    \ |\n| ▪ Self-important/entitled | ▪ Optimistic/multiplier |\n| ▪ Pessimistic/diminishes\
    \ | ▪ Win-win |\n| ▪ Win-lose | ▪ Humble/vulnerable |\n| ▪ Ego-driven/fearful\
    \ | ▪ Creative/innovative |\n| ▪ Scarcity | ▪ Yes, and . . . |\n| ▪ Yes, but .\
    \ . . | |\n\nPeople with a Judger mindset are scarcity minded, while people with\

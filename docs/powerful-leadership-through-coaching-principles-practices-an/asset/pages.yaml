- pgno: 59
  md: '# Coaching from the Inside-Out


    *Intelligence*, Daniel Goleman says, “If we lack the belief that we can handle
    [life’s] challenges, we can start to act in ways that doom us. The thought ‘I
    can’t do this’ is crippling” (Goleman 1998). We get stuck. We disengage.


    How do we overcome this negative, fearful inner narrative? We find our personal
    power. We find our truth and begin to live it.


    Dr. Mark Goulston, author of *Get Out of Your Own Way at Work*, shares the story
    of how he became chronically carsick. He wrote that when he was a young boy he
    read a comic book in the backseat of the family car, got sick, and then threw
    up.


    His mom explained that he was prone to being carsick and he would get carsick
    every time he read in the car. And he was! Dr. Goulston admitted that every time
    he tried to read in the car he would get sick. He did not have a similar problem
    on a plane or a train because his mother never warned him about being sick in
    those environments. But the time came when he really wanted to read in the car.
    So, he started reading! He immediately felt nauseated, but he pushed through until
    the queasiness passed. “And I have been able to read in a car ever since without
    being sick. The mind and the will to persist is an amazing thing, isn’t it?” (Goulston
    2005).


    Dr. Goulston points out how easily we can get stuck inside a limiting narrative—and
    break through it! If he could read in the car, what else could he do? And why
    didn’t he realize it sooner? Our inner narrative tells us what we can and cannot
    do, and we listen to it! We work within the limitations. Many self-imposed limitations
    can become self-fulfilling prophecies. If you think you can or you cannot, you
    are right.


    Perhaps you got scared by a dog when you were little and grew up convinced that
    all dogs are aggressive and mean. Perhaps you watched your dad revel in his new
    Ford, which he hand-washed every Saturday morning, and you grew up thinking that
    Ford was the best brand of car and the only one you would consider purchasing.
    Perhaps you think you’re the smartest person in nearly every room you ever enter.
    Or perhaps you think you’re dumb and if you open your mouth in a staff meeting
    everyone will confirm it.


    What are the consequences of having a limiting or fixed mindset? As fitness and
    wellness author Kelli Calabrese stated, “There is nothing on the outside that
    is going to make you happy, unless you have peace and joy on the inside” (Calabrese
    2015).'

    Take a moment to coach yourself. Take time to reflect and think about a challenging
    situation at work or home that is very frustrating or negative, where you feel
    powerless, have lost faith or perspective, or are unable to control the outcome.
    In what ways could you become a change agent and move out of the victim role into
    that of a responsible leader? What mindset needs to change? What are your responsible
    choices? What is your bold, courageous vision of your desired future state? What
    will you do differently to change this situation? What resources and people can
    you leverage to help support you along the way?


    # PRACTICE: YOUR COACHING PLAYBOOK


    The following activity cannot be done in a few minutes or in a day. Sustainable
    change is often a process of self-discovery and illumination that will sometimes
    come quickly but may require long contemplation and planning, and change in behaviors
    and actions over time.


    Consider two or three of the primary roles in your life where you would like to
    make change or a significant contribution, and ask yourself the following:


    +   1. What changes do I need to make that would be beneficial to me and others?

    +   2. What unmet needs or big opportunities do I see for change?

    +   3. Why is change so important to me and others?

    +   4. What is my bold vision for change?

    +   5. What are the benefits of making these changes?

    +   6. What are the costs of not changing?

    +   7. What have I always loved doing? How can doing those things contribute to
    the world or those around me?'

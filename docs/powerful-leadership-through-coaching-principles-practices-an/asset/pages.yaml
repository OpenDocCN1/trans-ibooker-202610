  md: 'can be hard and full of challenges. A great coach can help to assess history,
    story, beliefs, views, and choice. There are tremendous breakthroughs in coaching
    when the coach helps the client or performer assess where they are now and any
    gaps or areas in which they need to get better; needed changes or negative impacts;

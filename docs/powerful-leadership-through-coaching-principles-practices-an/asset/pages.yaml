  md: '# Modeling the Abundance Mindset


    > > *Scarcity mentality measures out life by the ounce; it always concludes that
    the needs outweigh the resources.*

    > >

    > > —Erin M. Straza, writer and speaker


    I joined Covey Leadership Center (now FranklinCovey) as the 35th employee, after
    returning from a spring and summer university study abroad experience in London,
    England, in August 1987. Dr. Stephen R. Covey was one of my early career teachers
    and mentors. A key insight I learned from him was the value of thinking and acting
    in win/win ways (for fans of his book *The 7 Habits of Highly Effective People*,
    this is Habit #4, the principle of mutual benefit).


    Dr. Covey taught that thinking win/win is the abundance mindset in action. “Win/win
    sees life, and those we need to engage effectively with as a cooperative, not
    a competitive arena. Most people tend to think in terms of dichotomies: either
    or, good or bad, right or wrong, strong or weak, hardball or softball, win or
    lose. But that kind of thinking is fundamentally flawed. . . . Win/win is based
    on the paradigm that there is plenty for everybody to enjoy. The idea is that
    one person’s success is not achieved at the expense or exclusion of the success
    of others” (Covey 1989, p. 218).


    For years, Dr. Covey was told that thinking win/win in a competitive business
    environment was naïve, unrealistic, and unattainable. He did not back down. He
    understood that many leaders, managers, and supervisors came to work each day
    with a scarcity mindset. This mindset would focus on statements such as:


    +   - “There is not enough . . .”

    +   - “That will never work . . .”

    +   - “There is no way to do that . . .”

    +   - “I cannot share . . .”

    +   - “I cannot not trust . . .”

    +   - “We can’t risk . . .”

    +   - “They owe me . . .”

    +   - “If they win . . .”

    +   - “We’re all in trouble . . .”

    +   - “If they get credit . . .”'

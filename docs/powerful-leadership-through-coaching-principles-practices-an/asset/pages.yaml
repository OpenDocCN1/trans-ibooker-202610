- pgno: 20
  md: '# Introduction: A Coach’s Journey


    I’m a coach. Not an athletic coach—I coach leaders in business, government, and
    education. And I love it. Why?


    Because coaching transforms people more than anything else I have experienced
    in 30 years as an executive coach in 35 or so countries to many of the world’s
    top companies, including:


    +   - ExxonMobil

    +   - Chevron Phillips

    +   - Shell Oil

    +   - PETRONAS

    +   - General Electric

    +   - Samsung

    +   - Ericsson

    +   - TE Connectivity

    +   - Laird Connectivity

    +   - Hewlett-Packard

    +   - IBM

    +   - Marriott

    +   - Hilton

    +   - PepsiCo

    +   - Frito Lay

    +   - John Deere

    +   - Sabre

    +   - Baxter

    +   - Amgen

    +   - Eli Lilly

    +   - Johnson & Johnson

    +   - Nike

    +   - HSBC

    +   - OCBC Bank

    +   - Bank of Islam

    +   - US Department of Defense

    +   - US Army, Navy, Air Force, Marines, and Coast Guard


    And many, many more. Every company wants success on the same measures: profitability,
    vision, budget compliance, strategy, goals, effective execution, culture change,
    and simple but powerful leadership development processes. Leaders want to overcome
    barriers, change mindsets, and grow trust. As an executive coach, I’ve seen small
    changes in leaders turn into massive increases in profits and other key success
    measures.


    I have personally witnessed how a simple coaching process and tools can unlock
    individual talents and organizational strengths to achieve what matters most with
    the people I coach.


    That’s why coaching is my career purpose and passion!'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# The Realities of Being a Coach


    Everybody in business, government, or education has hard issues to face. We face
    plenty of challenges and suffer a lot of stress no matter what our jobs are. Sometimes
    we feel defeated and don’t know where to turn. We’ve all worked for that difficult
    boss or on a team that is divided and unproductive. Everybody is constantly distracted
    by the noise of everyday life. Sometimes we feel tossed around as if by waves
    in the ocean or pulled along on strong currents we can’t control, yanked away
    from achieving the goals that really matter to us.


    A leader I admire, Henry B. Eyring, was given this advice by a friend: “Hal, when
    you meet someone, treat them as if they were in serious trouble, and you will
    be right more than half the time.” Not only was he right, but I have learned over
    the years that he was too low in his estimate. Leaders who don’t know this about
    people will eventually see problems fester and human potential go untapped.


    Skilled coaches honestly confront the big issues and the personal behaviors that
    affect results. Of course, coaches might have some advanced financial, technical,
    or operational skills, but those usually are not called for. The primary work
    of a coach is to help people develop the right mindset for achieving their goals—whether
    those goals are about sales, marketing, operational performance, customer service,
    or technology. Equally important is building the right culture—one that is customer
    and market focused, performance based, accountable, respectful, responsible, and
    trustworthy.


    That’s why this book aims to help you coach individuals first and then teams and
    organizations. Both skillsets are crucial. A great coach helps individuals leverage
    their own gifts, talents, and strengths to bless society, improve change, and
    achieve results. A great coach helps a person overcome triggers, fears, resentments,
    and obstacles. A great coach helps people change “from the inside-out”—they come
    to know themselves better and to live according to the principles that get great
    results.


    A great coach also helps teams and organizations find the right focus: clear vision
    and strategy, customer loyalty, positive shareholder value, goal clarity, and
    flawless execution. A great coach helps organizations leverage diversity, succeed
    across cultures, resolve conflicts constructively, and communicate across functional
    and globally diverse boundaries. And a great coach helps team leaders in turn
    to coach their teams'

- pgno: 261
  md: '# Putting It All Together


    We all know what to do; we simply don’t do it. Or, we haven’t put in place a rigorous
    coaching process and structure that demands ongoing practice, the use of ongoing
    tools, reflection, and peer accountability and support.


    Change is hard and uncomfortable. Charles Duhigg, reporter for the *New York Times*
    and author of *The Power of Habit: Why We Do What We Do in Life and Business*,
    explained in an interview with *Harvard Business Review* that habits are formed
    neurologically (Duhigg 2012). He explained that a habit has three components:


    +   1. A trigger for a new behavior

    +   2. A routine behavior (the habit itself)

    +   3. A reward to ensure our brain neurology encodes this positive recognition
    pattern for the future


    Instead of focusing on the second component—the habit itself—Duhigg argues that
    we should focus on the trigger (the stimulus or the cue) and the reward (the response
    or compensation for the action).


    Our behaviors originate in the prefrontal cortex, a relatively new addition to
    the brain. But for a behavior to become habitual, it needs to move into the basal
    ganglia, the oldest parts of the brain, located near the center of the skull.
    The basal ganglia don’t require thinking or decision-making; this is where our
    habits become automatic. Conscious decisions occur in the prefrontal cortex. To
    get to the basal ganglia, where we act out of natural habit, we need to rely on
    (cues) the emotional trigger and (rewards) the reinforcement or compensation.
    A cue could be a ritual, a time of day, a place, the presence of other people,
    or an emotional connection. A reward is an emotional or physical compensation
    for the habit.


    If it sounds too difficult, Duhigg hopes to inspire you by reminding you that
    things you do every day without thinking were once not so common. About 100 years
    ago, no one (except perhaps the upper class) brushed their teeth—until the owner
    of a toothpaste company decided to make brushing teeth a habit. How? By creating
    a cue, a ritual, and reward.


    The cue was to make people uncomfortable about that filmy feeling on their teeth,
    by advertising that the film was a bad thing. The routine was brushing every day.
    But the reward? What reward would make people come back for more? Surprisingly,
    it was not healthy teeth or whiter teeth. It was the tingly, fresh, minty feeling!'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Back in 1915, Pepsodent added ingredients to toothpaste that made the mouth
    tingle. People became addicted to the feeling! The tingling sensation was a great
    reward, and it became associated with cleanliness. Duhigg reports that within
    five years of Pepsodent’s new advertising campaign, half of America was brushing
    every day. That is the brain science behind the behavioral change via habits.


    If you want to make a habit, you need to determine what cues and rewards to adopt.
    This is an important principle for coaches. Duhigg explains, “Good managers understand
    the importance of habits, and they think about it. Bad managers pretend like organizational
    habits don’t exist. And so, when habits emerge, they end up being distortive or
    toxic.”


    If you want habits to stick, pick your cue, pick your behavior, and pick your
    reward.



  img_proc: true
- pgno: 123
  md: 'Conference, why people stop asking questions. “In school, we’re rewarded for
    having the answer, not for asking a good question,” Wurman pointed out (Berger
    2011). Maybe that’s why kids who start off asking endless “why” and “what if”
    questions gradually ask fewer and fewer of them as they progress through school.


    Well, it’s time to brush off your carpet square, open that fruit snack, and be
    a kid again. It’s time to revel in the art of asking good questions. My wife Cynthia
    owns and directs a private school: Ivy Hall Academy in Provo, Utah. Her school’s
    vision for each child is “To develop responsible and interdependent life-long
    learners who lead lives of meaningful contribution.” The school is “inquiry based,”
    meaning students are encouraged to focus on big, open-ended questions to research
    and respond to in their groups. In the process, they develop outstanding researching,
    critical of his team. “I have found that everyone wants an easy answer,” he told
    me. “They want me to tell them what to do because they are frustrated, and they
    just want to move ahead. That’s not how coaching works. We help people by asking
    questions and then step back and let them find their own answers. This is how
    you really learn. You recognize what you are capable of in your work and in your
    life. And you succeed!”


    # Asking Provocative Questions


    > One of the coach’s primary jobs is to be curious and ask provocative, open-ended
    and inviting questions that will invite the client to look in a direction or another,
    but with no preconceived conclusion.

    > —Laura Whitworth, Karen and Henry Kimsey-House, and Phil Sandahl (Whitworth
    et al. 1998)


    I’ve personally observed the transformations that come when a coach asks effective,
    powerful questions. I’ve thoroughly enjoyed helping countless clients discover
    for themselves what’s most important to'

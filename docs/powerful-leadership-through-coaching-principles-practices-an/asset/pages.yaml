- pgno: 107
  md: '# Does This Situation Require Coaching?


    Team members who lack the competency to do a job do not need coaching—they need
    training, skill building, work experience, or education. Coaches help people who
    are already competent to choose their own paths and make their own decisions.
    If, for example, a nurse isn’t qualified to do a certain surgical procedure, she
    may need a course or training, not a coach. Once she’s certified, you can coach
    her as her practices and skills improve, and she can leverage her new skills.


    Often, there’s a fine line between the need for training and the need for coaching.
    You might be coaching a person who is a poor communicator. You might be asking
    them questions that will surface that difficulty and then coaching them to decide
    how to deal with it. But you cannot teach them to be better communicators; your
    task is to guide them toward self-awareness and the desire to create an action
    plan that will help them allocate time and attention to communicate better with
    key stakeholders. That plan might include training courses in speaking, listening,
    or writing, but the coach is not the one to teach those courses.


    # Is This Person Ready to Have a Coaching Conversation?


    Often, a person who would benefit from coaching isn’t ready for it. They may not
    feel safe being coached by you. No one wants to be “fixed” or become a “project.”


    Remember, it is not your job to fix, judge, or change the participant. If you
    hand out orders about what to do and how to do it, whose fault is it if the advice
    doesn’t work? Coaching is an ongoing dialogue with a team member where you do
    not counsel, advise, judge, or tell them what to do. Instead, you ask the right
    questions, in the right way, at the right time, in a safe environment. Through
    open-ended questions, you engage team members to discover their own answers for
    themselves.


    Obviously, you don’t need to take off the table all your wisdom, experience, and
    judgment. But you need to get team members to do the heavy thinking and lifting
    to solve their own problems. As a coach, you'

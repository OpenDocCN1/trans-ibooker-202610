    +   - Subordinate individual rights to that of the state or government

    +   - Offer fewer personal opinions and be more cautious in expressing disagreement

    +   - Have more appreciation and respect for protocols in society and the organization
    or the nation state


    What does this element look like in business? In high-individualism cultures,
    individual accomplishments are encouraged. Individual rewards are expected for
    hard work, individual productivity is high, and individual ideas are encouraged
    and transparently shared openly. If you are doing business in a high-collectivism

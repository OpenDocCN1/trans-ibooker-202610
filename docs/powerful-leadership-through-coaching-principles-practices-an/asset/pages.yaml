  md: 'The coach holds up a mirror to a person’s mindset, thoughts, feelings, motivations,
    behaviors, and choices.


    Our family loves going to Hawaii. When I go scuba diving or snorkeling with my
    family in Kauai, my diving mask helps me to see clearly the beautiful coral reefs,
    brilliantly colored fish, turtles, monk seals, and dolphins that would be just
    a blur without it. Like my diving mask, good feedback helps to clarify the key
    issues, possibilities, and opportunities around me.


    One president of a large global technology company that I was coaching said he
    was struggling but couldn’t pin down exactly why. Despite being at the pinnacle
    of his career and known as a high performer, he felt burned out and stressed,
    and told me, “The harder I work, the more disengaged I feel. I am losing my edge,
    my balance, and my ability to inspire success in my team.”


    Gradually, as we gathered and analyzed feedback, he became more self-aware. He
    began to see that he was too caught up in daily, urgent firefighting. He had lost
    sight of strategic priorities and became a micromanager around the tactical aspect
    of his job. He realized that his executive team was disengaged because he was
    trying to do all the work himself. And when he did delegate, they were never fully
    empowered to make decisions and take action. At last he concluded that he needed
    to lead more strategically, empower his team, give them more authority to act
    independently of him, and balance his personal and work lives.


    Feedback helped this leader fully reengage in improving his company, delegating
    more to his team, and reconnecting with his family. He focused on setting clear
    targets, goals, and objectives that he and his team felt were more motivating
    and realistic. He found his excitement again, but self-awareness had to come first.


    The following open-ended questions can guide a leader-coach in gathering and analyzing
    feedback.


    # Gathering feedback


    +   - “Who are your key stakeholders—customers, peers, co-workers, team members—who
    could give you candid feedback?”

    +   - “What information from them would be helpful to you? What data points, critical
    instances, or evidence would you like to gather?”'

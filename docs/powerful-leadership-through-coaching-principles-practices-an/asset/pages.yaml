- pgno: 78
  md: 'doesn’t take long. Of course, it takes time to build trust, but your genuine,
    sustained interest in others or with your clients will make the process easier.
    Over the years, I have done a lot of work and partnering in businesses in Asia
    and have found that deep, trusting relationships are critical to establishing
    credibility.


    Here are a few powerful questions to get you started in the process of building
    stronger and more engaged relationships at work.


    +   - “Tell me about your background. Where did you grow up? What are your favorite
    things to do in your free time?”

    +   - “What are your personal interests? What do you like to do, and where do
    you excel and find your passion in life?”

    +   - “If you had to return to a favorite vacation spot, where would you go?”

    +   - “If you had unlimited time and resources, what would you choose to do?”

    +   - “Name a time in your life when you were happy. When was it?”

    +   - “What do you think your greatest achievement has been to date?”

    +   - “What is your role here at work?”

    +   - “How do you feel about your contribution here?”

    +   - “What is your greatest contribution to your team?”

    +   - “What are your natural gifts, strengths, and talents?”

    +   - “What is the best part of your job?”

    +   - “When do you feel that you are at your best?”

    +   - “What part of your job do you wish you had more time for?”

    +   - “What part of your job do you wish you could do less of?”

    +   - “How do you think your job could be more fulfilling?”

    +   - “How does this job fit in with your overall goals for your life?”

    +   - “What would you like to be doing in your career within the next five years?”

    +   - “What is the gap between where you are now versus where you want to be?
    How can you close that gap?”

    +   - “How can you live a more engaged, connected, fulfilled, and balanced life?”

    +   - “What stands in your way of achieving more balance in life?”

    +   - “How will you know when you have achieved that balance?”


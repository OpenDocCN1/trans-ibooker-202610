- pgno: 130
  md: 'Once you are comfortable asking your team open-ended questions, build on their
    responses. Asking clarifying questions invites the team members to tell you more;
    that way, you learn more.


    Clarification means making sure you understand the answer. If you are unsure what
    someone means, just ask! “I am not sure if I clearly got your message. Please
    tell me more about . . .” You can also request specific examples: “When you say
    X, Y, or Z, what do you really mean by that?”


    An important benefit of clarifying questions is enabling team members to think
    and express their thoughts more clearly, and perhaps to resolve their own issues.


    Another benefit is building a stronger relationship. Your roles and responsibilities
    and your organizational level may be different, but coaching offers equal ground
    and mutual respect. The coach isn’t answering, telling, or fixing. Instead, the
    coach and team member go on an expedition together to explore answers and co-create
    solutions.


    As a coach, one of my biggest challenges was withholding my own knowledge and
    experience, at least for a time. I’ve been a management consultant for many years.
    As a consultant, you are paid to be the smartest person in the room, the one with
    all the answers: “Here’s the problem,” the consultant says, “and here’s how to
    fix it.” But coaching is not consulting, advising, or counseling. I had to get
    away from telling and advising. I had to move away from a position where I thought
    I knew the solutions, to a position of curiosity, questioning, and helping others
    co-create solutions, by asking good clarifying questions. Following are practical
    examples of key questions to help any leader or manager become a more curious,
    supportive coach:


    +   - “I’m wondering about . . .”

    +   - “Can you help me understand . . . ?”

    +   - “Would you tell me more about . . . ?”

    +   - “What have you observed about . . . ?”

    +   - “Can you please explain more . . . ?”

    +   - “What would happen if . . . ?”

    +   - “How do you feel about . . . ?”

    +   - “What do you think causes this . . . ?”

    +   - “Why is this so . . . ?”'

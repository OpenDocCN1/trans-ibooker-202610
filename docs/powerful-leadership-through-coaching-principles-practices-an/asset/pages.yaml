- pgno: 47
  md: '# 3. Deliver: What Actions Will Be Done?


    > > Clear, simple goals don’t mean much if nobody takes them seriously. The failure
    to follow through is widespread in business, and a major cause of poor execution.
    You need robust dialogue to surface the realities of the business. You need accountability
    for results—discussed openly and agreed to by those responsible—to get things
    done and reward the best performers. You need follow-through to ensure the plans
    are on track.

    > >

    > > —Ram Charan and Larry Bossidy, *Execution: The Discipline of Getting Things
    Done*


    Peter Drucker once said something like this: “All grand strategies eventually
    boil down to work.” In the delivery stage, detailed plans and accountability processes
    for execution are put in place to make it real. This is the area of focused goals,
    desired results, milestones and success measures, execution plans, accountability,
    ongoing communication, and action-learning.


    In the delivery phase, the detailed steps of accountability are mapped out. You
    determine how and when to put the plans into action to improve performance, achieve
    results, and build trust by ongoing engagement with all key stakeholders.


    Coaches can help advance the delivery phase by asking questions like these:


    +   - “Why is this issue [topic] so important to you? What’s the mission, purpose,
    or big picture?”

    +   - “What is your strategy, your path, and your game plan going forward?”

    +   - “What are your key goals, outcomes, objectives, and measures? What does
    success look like?”

    +   - “What goals [topic areas] would you like to put into action?”

    +   - “What measures or key milestones need to be achieved to determine your success?”

    +   - “Who needs to be involved or reported to in order to ensure support and
    success?”

    +   - “How are you going to get this done? What are your defined actions and behaviors?”'

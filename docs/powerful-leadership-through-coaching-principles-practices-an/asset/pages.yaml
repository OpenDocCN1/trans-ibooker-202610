- pgno: 75
  md: 'How do you see yourself? As a Learner or a Judger? Answer the following questions
    and decide for yourself:


    +   - Are you being judgmental of yourself and others?

    +   - Are you reactive, close-minded, defensive, and protective?

    +   - Are you showing up as a Judger 80% of the time?

    +   - How can you be more self-aware when you fall into the role of victim or
    Judger, or have a closed mindset?

    +   - When have you recently been a Judger? What was the triggering event? What
    was the impact? How would you like your response to be different in the future?

    +   - What are the negative impacts of being a Judger and being closed, inflexible,
    and intolerant of others’ viewpoints?

    +   - Are you showing up as a Learner 80% of the time?

    +   - When have you recently been a Learner? What were you curious about? What
    was the impact? In what ways can you continually seek to receive the benefits
    of being a Learner with others?

    +   - What would be the benefits in your relationships of being a Learner versus
    a Judger?

    +   - What are the benefits of practicing being a Learner, seeking common understanding
    and common purposes?

    +   - How can you reframe situations and become more flexible, adaptable, open-minded,
    and encouraging of diverse and challenging perspectives?

    +   - How are you being accepting and open with self, others, and situations?

    +   - How are you being curious, thoughtful, engaging, and empathic?

    +   - How can you become increasingly more abundant and a better Learner?

    +   - Who do you need to begin building trust from a Learner mindset perspective?

    +   - As a Learner, how would you like to act and behave more effectively?

    +   - What choices can you begin to make as a Learner that will benefit your role
    as a leader?


    As a Learner-coach, you will begin to gain greater self-awareness in how you influence
    others more effectively. You will also begin to act in new and better ways that
    will better engage, motivate, and empower those around you.'

    +   2. Ask questions that support their agenda, not yours.

    +   3. Clearly identify the topic of the conversation.

    +   4. Be courageous in the moment.

    +   5. Ask coaching questions that were highlighted in this chapter.

    +   6. Bring all conversations to focused actions.'

- pgno: 220
  md: 'alienation—all these things can and do affect individual workers and in turn
    impact business results. With too little sleep, stress, conflicts, and constant
    work demands, they neglect their whole-person needs and wind up in a very bad
    place. Even some of the most successful producers are neglecting critical areas
    of their lives and heading for burnout, hopelessness, and major setbacks.


    I recently coached a woman I’ll call Emily, who worked for an international consulting
    corporation and had experienced great professional success. Despite her successful
    20-plus-year career, she was exhausted by the nonstop pace of her demanding role
    and wrestling with problems with her health and at home.


    As we began our coaching engagement, we found that one of her biggest struggles
    was her inability to set boundaries. She felt a constant need to please others
    while trying to do a job three people would find overwhelming. Nonstop emails
    and instant messaging to colleagues continued into the late hours most evenings,
    with a barrage of follow-up emails that consistently greeted her at 5:45 a.m.
    every day. She used weekends and vacations to catch up on work.


    So, we explored her mission, her values, her life purpose, and her vision of the
    future she wanted. She charted a plan that set clear boundaries, allowed for time
    off, and still kept appropriate focus on her work. As we identified the needs
    of the whole-person (financial, physical, emotional, intellectual, and spiritual),
    along with her core values in each of her roles (professional, family, and personal),
    she then determined her top priorities and the percentage of time she could allocate
    to each important area of her life.


    Coaching enabled her to recover from a path toward burnout, ruined health, and
    weakened relationships. She was able to change behaviors and create new habits
    and weekly rituals that fulfilled all the dimensions of the whole-person.



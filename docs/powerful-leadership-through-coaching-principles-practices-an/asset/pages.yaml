  md: '# Praise for Powerful Leadership Through Coaching


    > “A great coach helps people understand how they can grow, improve, and achieve
    excellence in every aspect of their life. This is how I coached my players and
    staff at Notre Dame. I recommend you read Michael’s great book, Powerful Leadership
    Through Coaching, as it will teach any leader or manager how to better motivate
    and improve success both professionally and personally.”

    > Lou Holtz, Former Notre Dame Football Coach, Southbend, IN


    > “Finally, a book that makes a clear distinction between professional coaching
    and managerial/leadership coaching. Michael makes it clear that great leaders

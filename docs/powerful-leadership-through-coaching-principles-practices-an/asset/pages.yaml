- pgno: 28
  md: "# Why Every Leader and Manager Should Be a Great Coach\n\n> *Fulfillment is\
    \ a right and not a privilege. Every single one of us is entitled to feel fulfilled\
    \ by the work we do, to wake up feeling inspired to go to work, to feel safe when\
    \ we're there and to return home with a sense that we contributed to something\
    \ larger than ourselves.*\n> \n> —Simon Sinek, British American author, keynote\
    \ speaker, and organizational consultant\n\nWhat’s the difference between a good\
    \ leader and a great leader? All leaders are expected to improve performance and\
    \ achieve great business results. Some leaders are lucky and succeed in spite\
    \ of themselves. Some get mediocre results. Others succeed in the short term but\
    \ in ways that don’t build trust or sustain results.\n\nI submit that the difference\
    \ between good and great leaders is the ability to coach and develop people.\n\
    \nDamon was a vice president of operations within his organization, a firm plagued\
    \ by low levels of trust. He knew that to move forward in this firm, he should\
    \ make a serious effort to build trust with his boss and colleagues. I was asked\
    \ to coach him.\n\nBut I found that Damon was unwilling to put in the work to\
    \ actualize that goal. He was disorganized, an inefficient planner, and poor at\
    \ prioritizing tasks. Though he worked very hard and was quite brilliant, he was\
    \ also a chronic micromanager and often got lost in the weeds, taking his team\
    \ with him. Essentially, Damon “got a lot done,” but he was a horrible leader.\
    \ He failed to define a clear strategy, set focused goals, and empower and engage\
    \ his team around those goals.\n\nFurthermore, Damon was less a leader than a\
    \ cop. A favorite pastime was to catch his team members doing things wrong—“gotcha!”"
  merge: -1
  img_proc: true
- pgno: 29
  md: 'games. He tried to make up for his lack of performance by blaming his team.
    When the time came for Damon’s boss to move on, he naturally expected to get the
    open job. Neither his peers nor his team trusted him to do the job that needed
    to be done, so it went to someone else.


    # “Quit and Leave” or “Quit and Stay” Syndrome


    There might have been a time when aggressive behaviors paid off for leaders like
    Damon, but that time is about over. Faced with untrustworthy managers, employees
    take one of two actions: they quit and leave or they quit and stay.


    We all know what it means to quit and leave, but what does it look like to “quit
    and stay”?


    Consider Scott Adams, who created the cartoon Dilbert. Adams began cartooning
    while he was working at an unmotivating job for managers who were utterly uninterested
    in him. How could he do a full-time job and still produce his famous workplace
    cartoons? He basically quit and stayed. He explained it himself: “The day you
    realize that your efforts and rewards are not related, it really frees up your
    calendar. . . . I had time for hobbies.” His day job gave him plenty of practical
    and fun material to work with.


    Leaders who try to drive, insult, or micromanage people will end up with team
    members who quit and leave or quit and stay. It’s a natural consequence. The inevitable
    result is mediocre business performance or worse.


    Coaching—the right kind of coaching—is the antidote to poor leadership.


    # Coaching by Definition


    If you want to lead, not drive or micromanage, you need to become a coach!


    According to the International Coach Federation, the body that sets standards
    for professional coaching worldwide, coaching is “a partnership that is formed
    to inspire others to maximize their personal and professional potential.”'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'That’s powerful. It means that a leader-coach honors team members as experts
    on their own lives. “The person who is currently doing a job is in the best position
    to know how to do it better,” Dr. Ben Nelson observes. Coaches honor this expertise.
    They believe in the team and the employee. They know that the people they lead
    are creative, resourceful, and whole. They take responsibility to discover, clarify,
    and align each person’s goals with the goals of the organization, producing a
    “win” for everyone. Coaching is the practice of getting people from where they
    are now to where they really want to be.


    How does coaching work? Coaches listen, observe, and adjust their influence based
    on the needs, talents, and strengths of the team and the individual employee.
    By asking powerful coaching questions, the coach elicits solutions and strategies
    directly from the employee to help achieve the aims of the organization as well
    as those of the individual. Thus, coaching is also the art of building an effective
    culture and work environment.


    Obviously, coaching executives and coaching athletes are alike in some ways, and
    the two kinds of coaches can learn from each other. One of the greatest coaches
    I have ever had, whether in a sports or corporate arena, was my sophomore high
    school basketball coach, Ron Burnside.


    Coach Burnside was a short guard with a peculiar appearance and a distinct, high-pitched
    speaking voice. But he knew people, cared about his players, and had a strong
    commitment to coaching. He built into 16 boys a team mindset so we learned to
    care about each other, play for each other, and play to win. He understood purpose,
    vision, values, and high-performance expectations. He coached from the bottom
    up—through fundamentals and hard work to skill development. Although he was known
    for his challenging practice sessions, he kept things fun and entertaining. We
    knew he cared about each one of us as individuals first and players second. He
    showed trust and respect with each of us.


    Under Coach Burnside’s leadership, our team won 16 of 20 games, beating teams
    with far superior athletic talent and size. We did this because our coach believed

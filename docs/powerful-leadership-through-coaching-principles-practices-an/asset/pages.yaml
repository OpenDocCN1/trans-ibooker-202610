  md: 'Ken Blanchard often says, “Feedback is the breakfast of champions.” Effectively
    handled, feedback can be a great tool for continuous improvement. Being honest
    with feedback and discussing real issues can help increase trust and overcome
    fear. So, how do you provide effective feedback in a safe, productive, and instructive
    manner?


    When people feel threatened by feedback—if they are harshly judged, criticized,
    or blamed, or receive negative feedback that they don’t agree with—they get defensive
    or even resentful. To survive, they may create the illusion of having addressed
    the situation. They avoid the issues raised by the feedback, and they blame, avoid,
    or make attributions toward others in their unwillingness to face reality.


    Good coaches can minimize these reactions by separating as far as possible the
    person from the problem or issue. This is partly a balancing act: emphasizing
    the strengths of the person while also approaching weaknesses with a mindset of
    continuous improvement. Consider these guidelines when offering effective feedback:


    +   - Open respectfully, making specific, concrete, future-oriented statements.

    +   - Give feedback that is descriptive, not judgmental. Use factual data, direct
    observations, and concrete examples rather than subjective impressions or gut
    feelings. Maintain objectivity, avoiding labels, stereotyping, and any negative
    bias.

    +   - Use “I” messages to describe how you see the situation rather than “you”
    messages that create defensiveness. For example, “This is how I am seeing or am
    observing this situation.” “This is what I hear you saying.” “Let me see if I
    accurately hear your perspective.” “This is how I am experiencing this situation.”
    “This is how it is showing up for me.” “I may not be seeing the entire picture
    here, but this is what I’ve seen and observed.”

    +   - Listen carefully and empathically to responses, and take time to understand
    the historical or situational context. Feedback can be hard on the emotions: let
    the person process the feedback by talking through it. Check for accuracy of understanding
    using clarifying questions.

    +   - Focus on the person’s strengths, possibilities, and opportunities. Identify
    their current state, and set goals toward a desired future state. Don’t hold people
    hostage to the past.

    +   - Talk about behaviors that can realistically be improved.

    +   - Be willing to let go of your own agenda and focus on theirs.'

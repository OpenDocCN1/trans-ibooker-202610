  md: '# Conducting Effective Conversations to Achieve Better Outcomes


    Here’s a case study to help you think through the process of holding effective
    conversations to achieve better outcomes.


    Sarah is a business unit leader with a reputation for refusing to collaborate
    or to accept ideas from outside her own department. She doesn’t play well in the
    organization, distrusts people, and communicates poorly. She’s built a silo for
    herself within her organization.


    Other units that want and need to work with her are frustrated. Imagine that you
    are Sarah’s peer, a leader of another business unit. You want to improve relations
    by using some coaching skills. But where and how do you start?


    Start with a respectful lead-in question. “Sarah, would you be willing to have
    a conversation with me on how our business units can get better together?” Stay
    away from accusing, judging, or anything that would get in the way of Sarah sharing
    her story or desiring to hold further discussions.


    Ask what unmet needs and opportunities Sarah sees in the marketplace, with shared
    mission or purpose, customer needs, or better alignment across your business units.
    What are your shared objectives, needs, or opportunities going forward? Are there
    better ways to partner, to add value, and to improve your contributions together
    within the organization? How can you overcome your silos, conflicts, or differences
    and explore common interests and shared purposes?


    Look for common purposes, shared mission, or aligned goals: What’s in your collective
    pool of opportunities to get better in serving customer needs, modeling your values,
    and clarifying your shared objectives? Side-step functional silos, historical
    problems, or misaligned work areas at first, and look for the bigger picture and
    purposes where both departments can add better value, service, and support. You
    and Sarah can begin to identify and outline co-mission areas, shared customer
    needs, and market opportunities to partner in the future. Make sure you both are
    clear and transparent and understand what the bigger picture is and what the benefits
    might be for working in new and better ways.


    Listen with empathic accuracy: Ask Sarah for her views on how the business units
    can begin working together to achieve the shared interests, objectives, and goals
    that will better satisfy the mission,'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'customer, or marketplace needs. “What do you see?” “What do you think?” “How
    do you feel?” “What might be getting in the way?” If she expresses frustration,
    respond with empathy. “I am sorry to hear that; you must be feeling very frustrated.”
    Capture and restate the key issues heard and then ask which issues are most important.
    Ask any clarifying questions, like “Can you say more about that? What have you
    observed? What have you learned? Can you tell me more about your concerns about
    quality, costs, pricing, service, or launching a product timely and successfully
    to market?”


    Separate the person from the problem: this coaching conversation is not to fix,
    blame, or judge Sarah. It is to discuss how the key issues of quality, costs,
    pricing, services, or timely product launch impacts confidence and credibility.
    “How does this situation or issue impact your business unit? How might this situation
    impact your customers?”


    # Focus on Solutions to Problems and Challenges, Not Who’s to Blame


    When you’re coaching a peer to build a relationship, you are not blaming anyone,
    you are simply examining facts, data, observable behaviors, events, issues, or
    areas of concern that are causing problems. The idea is that you can improve collaboration
    and seek to fix problems together. The focus should be on first making sure both
    groups identify what the problem is with complete honesty, transparency, and openness.
    Many times, people seek to solve the wrong problem or go after a problem the customer
    doesn’t care about.


    Go in with an abundant mindset of how to get better, how to do continuous improvement,
    and how to learn from customer and partner feedback. All the focus should be on
    the marketplace, the customers, co-mission opportunity, and shared objectives
    going forward. Key questions are: “What do you see as being best for the business
    and for the customer? What do you feel is the right thing for your business unit
    to do differently? What are your best choices and alternatives going forward to
    better serve both internal partners and external customers?”


    When asking these questions, be silent. Let others share their intent and their
    understanding of the situation. Don’t fill in the silence with your advice, stories,
    or input. Let them engage in discovering their part of the story.'

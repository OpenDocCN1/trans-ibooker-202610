  md: '# YOUR COACHING PLAYBOOK: COACHING FOR ENGAGEMENT


    +   1. Do you have the right people on the bus? If not, who needs to be eased
    out of position or placed into another position? How and where will you find the
    right people?

    +   2. Who appears to be disengaging? Do you know why? What is your plan for re-engaging
    this person?

    +   3. Experiment with putting your team members into the Skill-Will Matrix. Who
    has high skill and high will? Who has high skill and low will? And so on. What
    will you do about the results?


    ![](img/3b9ba4a318234a9c4d131f84093751e0_269_0.png)


    # YOUR COACHING PLAYBOOK: COACHING FOR CONTRIBUTION


    **PRACTICE:** The following activity cannot be done in a few minutes or in a day.
    Sustainable change is often a process of self-discovery and illumination that
    will sometimes come quickly, but may require long contemplation and planning,
    and change in behaviors and actions over time.


    Consider two or three of the primary roles in your life where you would like to
    make change or a significant contribution, and ask yourself the following:


    +   1. What changes do I need to make that would be beneficial to me and others?

    +   2. What unmet needs or big opportunities do I see for change?

    +   3. Why is change so important to me and others?'

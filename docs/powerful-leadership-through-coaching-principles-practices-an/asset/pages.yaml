  md: 'I felt the world getting much smaller when I taught an executive leadership
    development course at an offsite retreat in Denmark that included global leaders
    from Europe and Asia. I was able to coach several of them on their 360-degree
    feedback and help co-create action plans to be more effective and build trust
    across cultures. One leader I coached was from Denmark and was a key operations
    leader with an international retail firm. Responsible for global operations, he
    often visited his colleagues at manufacturing plants in Thailand. While there,
    he met with the local leaders, managers, and team members, fielding issues such
    as poor on-time delivery of products, operating process breakdowns, and quality
    and cost issues.


    While coaching the leader in Denmark, I became aware that his strong, direct leadership
    style was based on individualism, being honest and direct, supporting low power
    distance to challenge ideas from everywhere, a value for equality of both masculinity
    and femininity, and a high level of certainty and value for risk. When this great
    Danish leader was working with his colleagues in Thailand, he confided in me,
    “I am stepping on cultural land mines everywhere! They don’t get me, and I don’t
    get them. It’s like communicating with strangers! It is very frustrating because
    I think we have agreement when I am open, direct, and transparent on their operational
    issues. I am sharing facts openly and publically with the entire team. I could
    not be more honest and transparent about our issues. But then nothing ever seems
    to change.” This manager was clearly struggling with his cross-cultural awareness.
    He had failed to adapt his communication and management style to a different culture
    in Asia.


    The Asian culture of his colleagues tended to value collectivism and teamwork,
    high power distance and respect for the leader, indirect communication in which
    they would “save face” and not embarrass a leader in front of the leader’s people,

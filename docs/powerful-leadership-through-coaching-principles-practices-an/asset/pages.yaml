- pgno: 184
  md: '# Low Skill/High Will (Aspiring)


    +   How to best engage those aspiring:

    +   - Invest time early on, with full coaching, training, explaining, and answering
    of questions.

    +   - Create a risk-free environment to allow early mistakes and learning.

    +   - Relax control as progress is shown.


    ![](img/3b9ba4a318234a9c4d131f84093751e0_184_0.png)


    **Figure 12.2** Low skill/high will (aspiring)


    There are four quadrants in the Skill-Will Matrix:


    +   - *Quadrant 1—Aspiring* (Figure 12.2): This is an aspiring person who has
    the desire to complete a task but lacks the necessary skills. Typically, this
    is an enthusiastic new hire. With employees in this quadrant, leaders should coach
    intensely with training, mentoring, explaining, and answering questions. The leader
    should create a risk-free environment to allow early mistakes and ongoing learning.

    +   - *Quadrant 2—Excelling* (Figure 12.3): This is an excelling person who has
    both high skill and high will to perform the task or role at work. This is often
    an experienced person looking for more


    # High Skill/High Will (Excelling)


    +   How to best engage those excelling:

    +   - Promote freedom to do the job; set objectives, not methods.

    +   - Praise, don’t ignore.

    +   - Encourage them to take responsibility and involve them in decision-making.

    +   - Take appropriate risks, including more stretching tasks.

    +   - Don’t over-manage.


    ![](img/3b9ba4a318234a9c4d131f84093751e0_184_1.png)


    **Figure 12.3** High skill/high will (excelling)'

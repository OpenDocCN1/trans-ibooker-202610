  md: 'To help Anthony, we created a new game so he could track his behaviors. Each
    day, he started with 10 pennies in his left pocket. The goal was to move the 10
    pennies from his left pocket to his right pocket by the end of the day. Every
    time he was negatively triggered and wanted to respond in a judgmental or emotionally
    negative way, he would take a deep breath and practice his new Learner behaviors;
    for every positive interaction, he moved a penny into the right pocket. Though
    no one else knew about this little game, he was able to enjoy many private victories

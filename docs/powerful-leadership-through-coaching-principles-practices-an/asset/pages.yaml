  img_proc: true
- pgno: 135
  md: "# GROWING by Setting SMART Goals\n\nFor most of us, a goal means going after\
    \ a big opportunity or closing a gap. No gap, no goal. A good goal fills a significant\
    \ gap in performance, a strategic opportunity to improve, or a stretch target\
    \ to shoot for. Go from “X” to “Y”: Reduce this body weight (X) to that body weight\
    \ (Y). Increase this current level of profits (X) to a new level of profits (Y).\
    \ Move from this measure of quality (X) to that measure of quality (Y).\n\nMaybe\
    \ because we usually fail at New Year’s resolutions, we drag both feet when it\
    \ comes to setting new significant goals. It’s easier to coast, to get stuck,\
    \ or to be indifferent to real, sustainable change. I once had a young family\
    \ member who went through first grade refusing to learn to read. “She hopes it\
    \ will just go away,” her parents told me (ironically, she’s now an elementary\
    \ school teacher teaching other little kids how to read).\n\nLike learning to\
    \ read, some goals are just unavoidably important. There are performance expectations,\
    \ quality standards to be met, and products to be launched. Besides, goals keep\
    \ us motivated! It’s easy to motivate people in the short term. A persuasive pep\
    \ talk, an inspiring story, an immediate reward, an urgent threat—all these can\
    \ motivate people to act. But once the urgency is gone, the short-term motivation\
    \ goes with it. The only kind of commitment that lasts is internal commitment\
    \ with clear, significant, objective, and achievable goals.\n\nFollowing are a\
    \ few rules to remember when coaching others to perform at higher levels.\n\n\

  md: 'values, behaviors, and customs, which requires more learning agility and personal
    responsibility in adapting to those differences. Every organization has a unique
    culture, just as every nation state has a diverse culture. In his study of cultural
    dimensions in 53 cultures and 20 languages for over three decades, Geert Hofstede
    examined global norms, values, and styles of doing business and came up with five
    key elements and questions that can help any leader-coach effectively work and
    navigate across almost any global context. Answering these questions can help
    greatly increase any leader-coach’s cross-cultural intelligence and effectiveness.
    Hofstede’s five key dimensions of cross-cultural differences are defined next.


    # 1. Power Distance: Low vs. High Power


    This refers to the degree to which the people in a society or culture accept differences
    in power, status, rank, office, or leadership levels or positions among themselves.
    A high-power-distance style of leadership and management is top-down, with more
    formal levels of approvals and decision-making. For example, people in a high-power-distance
    society tend to be more hierarchical and autocratic, and display dictatorial control
    from the top. In low-power-distance societies, they have a strong preference for
    flat organizational structures with more trusting, open, transparent communication;
    open, upward feedback; role equality; and participatory decision-making and empowerment
    are encouraged at all organizational levels.


    According to Hofstede, if you are interacting with someone in a high-power-distance
    culture (e.g. South East Asia, Japan, China, India, the Middle East, Russia, or
    Eastern Europe), that person would likely prefer to be in a hierarchy and be directed,
    ordered, and guided through a task. This person may tend to:


    +   - Be less willing to ask questions or give direct feedback upward in meetings,
    especially when more senior members are present

    +   - Be more subtle or indirect when expressing disagreement

    +   - Be respectful of authority and less willing to debate issues in public forums

    +   - Prefer that certain things be avoided and left unsaid


    On the other hand, a low-power-distance organization is shared within a flatter,
    more empowered structure with less hierarchy (e.g.'

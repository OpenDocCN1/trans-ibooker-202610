  md: 'and performance. Take time to identify those people in your areas of direct
    influence and begin asking yourself these questions:


    +   - Is there worth and potential with this person?

    +   - Are they in the right seat on the bus?

    +   - As a coach, how can you develop high levels of skill and will in your team
    members?

    +   - Do you have the right mindset to coach someone based on where they fall
    on the Skill-Will Matrix?

    +   - Do you believe everyone is a leader and has high potential for great performance?

    +   - Do you believe some people just need a little help, resources, encouragement,
    and support along the way?

    +   - Do you see the value of assessing, training, developing, mentoring, and
    coaching this person?

    +   - How can you assume the best in others and help bring about that best performance?


    Here are some questions to help you connect with your employees and help them
    clarify and unleash their strengths and talents:



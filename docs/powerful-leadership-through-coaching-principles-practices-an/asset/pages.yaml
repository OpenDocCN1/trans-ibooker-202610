- pgno: 118
  md: '# Setting Priorities and Leveraging Time


    > How tragic it is to find that an entire lifetime is wasted in pursuit of distractions
    while purpose is neglected.

    > —Sundaty Adelaja, author, speaker, and pastor


    An important part of your coaching agenda is to help others set priorities for
    action. Stephen Covey compared true priorities to big rocks and lesser priorities
    to gravel (Covey et al. 1994, pp. 75-89). Too often we smother ourselves with
    gravel while ignoring the big rocks. “What are our big rocks? What are our team
    members’ big rocks? What are our organization’s big rocks?” Knowing what’s most
    important and what direction we are heading is the first thing that must be established.


    It doesn’t matter how quickly and efficiently we travel if we’re heading in the
    wrong direction! Furthermore, if the direction is vague or undefined, people tend
    to wander around and get distracted by the white noise.


    The coach’s job is to guide people toward a clear purpose, vision, values, strategy,
    and goals. The key is not to prioritize what’s on your schedule, but to plan and
    schedule based on your most important priorities.


    By the way, don’t forget to invest time in yourself. You are your own greatest
    asset. Schedule time for recreation, relaxation, relationships, rest, and personal
    renewal. Read a good book, enjoy a hobby, get some exercise, watch a movie, improve
    a relationship, and develop talents and skills. These things are big rocks that
    are essential to your well-being and become white noise only if they take too
    much of your time.


    Planning and scheduling big-rock priorities is itself a big rock we must take
    care of before we jump into executing the year, quarter, month, week, or day.
    In this way, we can say no to the flood of urgent or unimportant gravel that will
    occupy all our time if we let it.


    Following are important coaching questions about setting priorities (Allen 2001,
    pp. 18–19, 35–36, 138–140):


    +   Do we have honest self-awareness about those things that matter most in our
    lives?


    +   Do we have a clear shared mission, vision, and values that are more important
    than anything?'

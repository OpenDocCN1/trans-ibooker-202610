  md: '2. Body (health/wellness): “How is your health? How are you renewing yourself
    physically? The healthier you are physically, the more engaged you will be and
    the better you will perform. Write down one or two things you will do in the physical
    area to improve and get better.”


    3. Heart (social and emotional health/relationships): “How can you become more
    engaged, supportive, kind, respectful, optimistic, positive, and hopeful? How
    well do you maintain your relationships at work with your boss, co-workers, teams,
    peers, stakeholders, customers, partners, etc.? What key personal or family relationships,
    friendships, or community networks do you need to maintain or develop? How can
    you genuinely connect in uplifting, loving, and mutually respectful relationships?
    Write down one or two things you will do to improve and get better in the social/emotional
    area.”


    4. Mind (education/professional experiences/career development): “How are you
    staying awake mentally? How do you feel about the state of your skills and knowledge?
    What new education, training, learning, skills, and capabilities do you need to
    develop to improve your performance? Write down one or two things you will do
    to develop in the educational and professional development area.”


    5. Spirit (meaning/purpose/service/contribution): “How will you cultivate a life
    that gives real meaning and purpose? How can you move beyond yourself and connect
    to the overall purpose and contribution of your organization? How can you be inspired
    and motivated by a cause, sense of purpose, service, principles, values, and contribution
    yet to be fulfilled? Write down one or two things you will do to develop the spiritual
    area.”


    The following coaching questions are a guide to your own whole-person planning,
    and then use them to help someone else do whole-person planning as well. This
    holistic approach to life can be game changing!'

- pgno: 52
  md: '# 3. Deliver: What Will Be Done?


    To wrap up our coaching conversation, I asked Rebecca, “We’ve talked about a lot
    today. What is your plan for getting it done? What issues are you motivated to
    go after based on our conversation? What do you feel that you need to do first?”
    Rebecca then developed a plan. She decided to start by forming a coalition with
    her COO and members of the board of directors. She would test their support and
    get feedback to make sure the messaging was accurate and would be well received
    by the CEO.


    She needed to recruit support that could back her up in a professional, respectful,
    and loyal way, not in an emotional or judgmental manner. She needed to be both
    highly considerate and at the same time highly courageous in her feedback and
    messaging. Otherwise, the message would not be heard, or her job would be at risk.


    “What tools do you need? What resources do you need?” She felt that she needed
    to assemble a persuasive package of data based on customer needs, market needs,
    turnover reports, exit interviews, and profit/loss statements. She had to connect
    the dots for the CEO and ensure that he did not feel attacked. That meant presenting
    hard facts: customer data, customer loyalty feedback, employee turnover, exit
    interview data, and so on.


    “What are you committed to doing in the next 30, 60, and 90 days?” I asked, Rebecca
    committed to scheduling a meeting first with her COO, then a key influencer with
    whom she had credibility on the board, and then with her CEO.


    “How can I support you and help hold you accountable to this plan?” I asked. We
    agreed that I could call her every two weeks to check in and see how things were
    progressing. We also agreed that she could email or call me anytime if anything
    unforeseen happened or if she needed additional support.


    # PRACTICE: YOUR COACHING PLAYBOOK


    Consider an issue that has become a challenge in your team or organization. Either
    alone or with your team, take the time to practice the following coaching phases
    with their interrelated powerful coaching questions:


    +   1. Diagnose: What is the coaching agenda?

    +   2. Design: What matters most?

    +   3. Deliver: What actions will be done?'

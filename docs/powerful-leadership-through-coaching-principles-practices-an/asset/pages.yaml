- pgno: 194
  md: 'in People. I spent over three years writing and researching this book with
    my FranklinCovey colleagues Roger Merrill, Shawn Moon, and Todd Davis. We also
    received tremendous leadership insights from Dr. Stephen R. Covey and the brilliant
    writing of Dr. Breck England and Rebecca Merrill. My professional colleagues and
    I were all on a professional journey to find the components of a meaningful work-life
    contribution and offer coaching questions to help every manager and leader become
    a great coach. We agreed that professional contribution depends on four key discoveries:


    +   1. Finding a targeted need or a big opportunity in society, the marketplace,
    with customers, or at work

    +   2. Uncovering our unique gifts, strengths, and talents

    +   3. Engaging our passion and joy in our work and life

    +   4. Aligning what we choose to do to be in full alignment with our values and
    conscience


    Sometimes, the catalyst for defining your contribution comes as a response to
    an external problem, challenge, or need in the community or society at large,
    in the marketplace, or in your organization or team. Other times, the catalyst
    may come from your values or conscience, a calling to serve others. Or, you may
    start contributing as you fulfill a deep passion or personal interests.


    But at the intersection of all four discoveries comes your unique purpose and
    contribution in life. Let’s look at each element in sequence.


    # Finding a Need or Opportunity


    > > We never know which lives we influence, or when, or why.

    > > —Stephen King, American novelist of suspense and science fiction stories and
    movies


    As important as it is to identify our strengths, talents, and passion, most people
    will never rise above work as a hobby unless they meet a need in society or in
    the marketplace. We must align our passion and values to what people truly want
    and need from us. I love the statement “No organization inherently has a right
    to exist.” No'

  \ Cardon）提醒说，盖世太保特工和西班牙宗教裁判官也会“问问题”——而且问得很多。因此，在提问时，尊重的意图和真诚的好奇心至关重要。\n\n卡东提醒教练们，他们的团队成员聪明、见多识广，在自己的领域内完全合格，而且往往是唯一“能够找到原创且恰当的答案，以实现（自己的）个人或职业目标”的人（Cardon\

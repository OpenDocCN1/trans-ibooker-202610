  \ 2012）。最有力的辅导问题有助于：\n\n- 深入表象之下，挖掘根本原因\n- 澄清问题，聚焦对话\n- 对情况形成共同理解\n- 发现梦想、雄心和渴望\n\
  - 理解并连接最重要的优先事项和需求\n- 激励人们从新视角看待自己的经历和问题\n- 检验与价值观的一致性\n- 以更富成效的方式重新定义问题\n- 创造学习与创新\n\
  - 激发承诺\n- 引导人们得出自己的结论\n- 验证并肯定你对他们的信心\n\n在三年多的时间里，我作为领导力教员之一，与史蒂芬·R. 柯维博士（Dr. Stephen\
  \ R. Covey）、拉姆·查兰博士（Dr. Ram Charan）和梅特·诺加德博士（Dr. Mette Norgaard）一起，在犹他州鹿谷和圣丹斯举办的富兰克林柯维高管领导力峰会上授课。我的三位同事都是大师级教师，但《CEO想让你知道的事》的作者拉姆·查兰尤其令我印象深刻，因为他能够提出非常出色、切中要害的问题。他会在一个问题之后再追问，以更深入地挖掘参与者正在诉说或经历的内容。\n\
  \n他能够检验、推动、提问、引导，并从领导者自身的经历中引出教训，这简直是一种魔法。他提出的引人深思的问题多于他给出的答案。他当然也会适时分享许多自己的故事；但他以推动、牵引、挑战、检验、辩论和引导对话的方式，让人们质疑自己的假设，并深入思考自己的经历和答案。我一直试图效仿拉姆那种苏格拉底式的、富有洞察力的提问方法。以下是一些示例问题，它们\n\
  \n能够帮助教练型领导者促进对话、深入挖掘，提出更具挑战性和穿透力的问题：\n\n- “为什么这对你来说如此具有挑战性？”\n- “你为什么想专注于那个？”\n\
  - “你为什么认为情况是这样？”\n- “这如何影响你的想法？提出澄清性问题，能促使团队成员向你多说一些；这样，你会学到更多。”\n\n澄清意味着确保你理解了对方的回答。如果你不确定某人的意思，就直接问！“我不确定我是否完全听明白了你的话。请再告诉我更多关于……。”你也可以请求具体的例子：“当你说X、Y或Z时，你真正的意思是什么？”\n\
  \n澄清性问题的一个重要好处是：让团队成员能够更清晰地思考和表达自己的想法，并有可能由此解决他们自己的问题。\n\n另一个好处是建立更牢固的关系。你们的角色、职责和组织层级可能不同，但教练模式提供的是平等的立场和相互尊重。教练不是去回答、告知或纠正。相反，教练和团队成员共同踏上一段探索答案和共创解决方案的旅程。\n\
  \n作为教练，我面临的最大挑战之一是忍住不分享自己的知识和经验，至少在一段时间内如此。我担任管理顾问多年。作为顾问，你的价值在于成为房间里最聪明的人，那个知道所有答案的人：“问题在这里，”顾问说，“这是解决办法。”但教练不是咨询、建议或辅导。我必须远离“告知”和“建议”的模式。我必须从一个自以为知道解决方案的位置，转变到好奇、发问、并通过提出好的澄清性问题帮助他人共同创造解决方案的位置。以下是一些关键问题的实用示例，可帮助任何领导者或管理者成为更有好奇心、更具支持性的教练：\n\
  \n- “我在想……”\n- “你能帮我理解……吗？”\n- “你能多告诉我一些关于……的事吗？”\n- “关于……你观察到了什么？”\n- “能否请你再解释一下……？”\n\
  - “如果……会怎样？”\n- “你对……有什么感觉？”\n- “你认为是什么导致了这种……？”\n- “为什么会这样……？”\n\n虽然教练过程没有金牌奖项的争夺，但每次会谈以有力的“下马”收尾——一个强有力的结论——仍然很重要。当会谈该结束时，这里有一些收尾语的思路：\n\
  \n- *表达感谢*：感谢你教练的对象如此开放并愿意参与。\n- *变得更好*：征求关于本次教练会谈的反馈。“你希望更多或更少看到什么？”\n- *对焦目的*：帮助对方看到谈话中的“为什么”、更大的图景、组织一致性联系，或对利益相关者的影响。\n\
  - *关注细节*：谈论你欣赏对方的一件事。\n- *给予肯定*：肯定对方，表达支持，并对其抱有信心。\n- *由对方承担重任*：请对方总结这次讨论的内容。\n\
  - *强化承诺*：请对方回顾在教练会谈中做出的任何目标或承诺。\n- *行动号召*：要求对方在下次会谈前总结并回顾自己的具体行动。\n\n## 练习：你的教练手册\n\
  \n进行一场练习性教练会谈，努力遵循在正确的时间、以正确的方式提出正确问题的关键要素。邀请一位你信任的人来接受教练，并事先说明这是一次练习。记住：\n\n1.\
  \ 向你教练的人表达欣赏与尊重。\n2. 提出支持对方议程的问题，而不是你自己的想法。\n3. 明确界定谈话的主题。练习“3D法则”！\n4. 对当下关键问题或机会保持勇气和坦诚。\n\
  5. 提出优秀的教练问题，清晰梳理问题。\n6. 帮助参与者把焦点缩小到关键行动与下一步。\n\n## 参考\n\n- Berger, Warren. (2011).\
  \ 大创新挑战现状。如何提出正确的问题？*快公司*. https://www.fastcompany.com/1663429/big-innovations-question-the-status-quo-how-do-you-ask-the-right-questions.\n\
  - Bronson, Po, and Merryman, Ashley. (2010). 创造力危机。*新闻周刊*（7月10日）. https://www.newsweek.com/creativity-crisis-74665.\n\
  - Cardon, Alain. (2008). 有力的教练问题。*元系统教练*. https://www.metasysteme-coaching.eu/english/-powerful-coaching-questions.\n\
  - Sinek, Simon. (2017). *找到你的为什么：发现你和你的团队目标的实用指南*. Portfolio.\n- Sobel, Andrew.\
  \ (2012). 什么是好问题？ https://andrewsobel.com/articles/what-is-a-good-question.\n- Whitworth,\
  \ Laura, Kinsey-House, Henry, and Sandahl, Phil. (1998). *互动式教练：帮助人们在工作和生活中迈向成功的新技能*.\
  \ Davies-Black.\n"
- "## 通过设定SMART目标来实现GROW成长\n\n> 没有明确界定的目标，我们就会奇怪地忠诚于每天做些琐碎的事。\n> ——吉姆·斯图尔特，顾问实践者与目标执行专家\n\
  \n改变自己的行为很难。改变他人的行为更难。我问过世界各地的听众：“你有没有被给过无法影响至少80%的目标？你有没有无法用良好数据每30天进行客观衡量的目标？你有没有过目标太多的时候？你有没有被布置过不现实、无法实现或毫无激励性的目标？”几乎没有谁不笑着说“有”。\n\
  \n除夕前几天，我问邻居蒂姆：“你的新年决心是什么？”蒂姆是一名工程师，聪明、有条理，过着那种你会预料到的热爱细节和数字之人的结构化生活。我想，如果我能从任何人身上学到关于目标和决心的道理，那个人就是蒂姆。\n\
  \n“迈克尔，”他说，“我今年的决心和去年一样。去年它对我很有效，我正期待着第二个成功的大好年头！”\n\n“真的吗？”我问，“是什么？”\n\n“我有一个我知道自己真的能实现的目标，而且是一个让我感觉很好的目标。我的目标是多吃蛋糕，尤其是那些满是糖霜的边角部分。”\n\
  \n我要提一下——具有讽刺意味的是——蒂姆个子很高，而且是我认识的最瘦的人之一。显然，他对蛋糕以及设定可实现目标的道理，有一些我没有完全理解的见解。我想他只是基因特别好，新陈代谢又快。\n\
  \n\n\n\n# 通过设定 SMART 目标获得成长\n\n对我们大多数人来说，目标意味着追求重大机遇或弥合差距。没有差距，就没有目标。一个好的目标能够填补绩效上的显著差距、抓住改进的战略机遇，或者设定一个值得奋力一搏的挑战性目标。从“X”到“Y”：将体重从（X）降到（Y）。将当前利润水平（X）提高到新的利润水平（Y）。将质量指标从（X）提升到（Y）。\n\
  \n也许是因为我们常常在新年决心上栽跟头，所以在设定新的重大目标时会拖拖拉拉、犹豫不决。随波逐流、停滞不前或对真正可持续的改变漠不关心，往往更容易。我曾有一个年幼的亲戚，上一年级时拒绝学习阅读。她的父母告诉我：“她希望这件事能自己消失。”（讽刺的是，她现在是一名小学老师，教其他小孩阅读。）\n\
  \n就像学习阅读一样，有些目标具有不可回避的重要性。有绩效期望要满足，有质量标准要达到，有产品要发布。此外，目标能让我们保持动力！短期内激励人很容易：一场有说服力的动员讲话、一个鼓舞人心的故事、一份即时奖励、一个紧迫的威胁——这些都能促使人们行动。但一旦紧迫感消失，短期动力也随之而去。唯一持久的承诺，是建立在清晰、重要、客观且可实现的目标之上的内在承诺。\n\
  \n以下是指导他人实现更高绩效时需记住的几条规则。\n\n## 开展目标设定对话\n\n> 我不关注自己面对的是什么。我专注于自己的目标，并努力忽略其余一切。\n\
  > \n> ——维纳斯·威廉姆斯，美国职业网球运动员\n\n归根结底，专注于目标规划与执行，能帮助人们成长、进步，并培养自律和信心，使其有能力在生活和工作中完成重要的事情。美国记者索莱达·奥布莱恩在谈到目标实现与转变时曾说：“我了解到，恐惧会限制你和你的视野。它就像眼罩，让你看不清前方几步之遥的路。旅途本身很有价值，但相信自己的天赋、能力和自我价值，能赋予你走向更光明道路的力量。把恐惧转化为自由——这有多棒？”（奥布莱恩，2014）。这样的愿景和目标设定必须符合一定的目标规划原则和标准（McChesney、Covey\
  \ 和 Huhing，2016）：\n\n- *理解目标背后的“为什么”*是第一步。无论是为了规避痛苦还是获得收益，都必须有充分的动机。目标必须具有强大的益处或商业理由，让人感到合乎逻辑、理性且具有激励性。\n\
  - 目标必须*切实可行但具有激励性*。如果目标不现实、无法达成，就没有希望；但如果没有有意义的挑战或需要弥合的差距，就不会有动力。\n- 目标必须*可衡量*。目标必须让我们从\
  \ X 到 Y，有清晰的差距、清晰的衡量标准，以及清晰的终点线或现实的目标达成日期。\n- 目标必须*可受影响*。团队必须能够至少影响 80% 的结果，否则目标的实现就不由他们掌控。\n\
  - 目标必须*具有协作性*。所有相关方都必须对目标做出承诺。目标必须合法、合乎道德，并在环境和文化上是合理的。\n\n到年底，将 90% 的客户的最佳时间从 48\
  \ 小时缩短到不足 8 小时。\n\n- 到第三季度，将网络运营中心一级客户呼叫等待时间从 10 分钟减少到 4 分钟以下。\n\n### 运营\n\n- 到第四季度，实现比去年节省超过\
  \ 200 万美元的运营成本。\n- 到财年末，将“发货至请求”时间从 48 小时提高到 12 小时。\n- 到第四季度，将质量遗漏错误率降低 30%。\n-\
  \ 到 12 月 31 日前，实现生产力成本同比降低 5% 的目标。\n- 到年底，实现 95% 的生产正常运行时间（人员和设备）。\n- 到财年末，实现库存周转率\
  \ > 12。\n- 到 12 月 31 日前，实现 0 起可记录安全事故。\n\n### 信息技术\n\n- 到第三季度，将 IT 中断总时长从 30% 降低至\
  \ 10%。\n- 到 12 月 31 日前，保持 IT 平台稳定，零停机。\n- 到 12 月 31 日前，将 IT 积压工作减少 15%。\n- 到第三季度，向\
  \ 100% 的销售团队用户推出新的销售软件应用项目。\n- 到第四季度，完成向 95% 用户推出新的直接面向零售的产品平台。\n\n\n\n\n- 这些目标是否与其绩效管理中的成功评价标准一致？\n\
  - 这些目标是否与组织计划挂钩，并包含他们负责的具体目标和衡量标准？\n- 他们是否被激励、获得奖励，并与实现这一目标保持一致？\n- 组织目标、部门目标和团队目标之间是否有清晰的关联路径？\n\
  - 该目标是否有明确的商业案例？他们能否描述出来？\n- 该目标是否有助于他们实现自身的职业成功？\n\n## 跟进目标\n\n> 生活中的许多失败者，是因为在放弃时没有意识到自己离成功有多近。\n\
  > ——托马斯·爱迪生，美国发明家、企业家\n\n实现绩效目标的关键在于持续开展以目标问责为核心的教练对话。根据奥利韦罗、班恩和科佩尔曼的教练研究，“与仅进行培训相比，后续教练能将生产力提高300%以上”（Olivero\
  \ et al. 1997）。后续跟进至关重要，它能确保所有成员清楚战略目标——保持一致、专注，并朝着更大的成功迈进。\n\n我的一位前同事比尔·贝内特曾说：“让人们疲惫的往往不是艰苦的工作，而是迷雾或缺乏清晰度。”教练可以帮助团队明确目的、方向和目标，让人们走出迷雾，以积极、热情和兴奋的方式专注投入。然而，团队很容易偏离轨道或误入歧途。这就是为什么教练必须频繁且定期地让成员承担责任——最好是在每周回顾会上，让各方说明自己的个人承诺和实现目标的进展。团队成员会遇到各种障碍：办公室政治、资源问题、优先级变化、干扰等。教练的每周回顾有助于克服这些障碍，确保目标得以实现。\n\
  \n以下是一些关键问题，可帮助团队成员在实现重要目标和目的时保持正轨：\n\n- “这周你是在赢还是在输？”\n- “你在实现目标方面取得了什么进展？”\n-\
  \ “你对进展感觉如何？到目前为止有哪些成功？”\n- “你是否在按计划实现目标？如果没有，你正在采取什么措施回到‘正轨’？”\n- “老板和其他关键利益相关者如何看待你的进展？”\n\
  - “关于哪些方法有效、哪些无效，你学到了哪些经验教训？”\n- “这个目标仍然现实且可实现吗？”\n- “有哪些障碍挡在路上？”\n- “谁能帮你清除这些障碍？”\n\
  - “目前你的计划是什么？”\n- “你看到了哪些向前推进的新机会？”\n- “此时需要哪些资源？”\n- “有哪些问题需要解决？”\n- “你希望什么时候就这些问题见面？”\n\
  - “今后切实可行的下一步是什么？”\n- “我能帮上什么忙？”\n\n## 练习：你的教练手册\n\n回想一次你实现了为自己、为团队或为组织设定的目标的经历。再回想一次你未能达成目标的经历。是什么造成了你的成功与失败之间的差异？\n\
  \n你是否曾制定过宏伟而鼓舞人心的目标，后来却对目标失去了承诺或专注？发生了什么？你将来如何避免这些问题？\n\n你如何帮助他人保持责任感，并致力于实现他们最重要的目标和目的？\n\
  \n你是否可以通过定期的后续检查和持续的绩效对话来提升绩效和问责制？\n\n你近期最重要的目标是什么？它们是SMART目标吗？\n\n当你开始设计和协调目标规划流程时，这里有一种撰写SMART目标的方法，以确保目标在组织结构中保持一致，从业务单元或部门层面，到团队层面，最终到个人层面。确保你的\n\

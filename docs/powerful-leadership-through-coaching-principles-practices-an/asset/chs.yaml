- "## 为什么每个领导者和经理都应该成为一名优秀的教练\n\n> *实现自我满足是一项权利，而不是特权。我们每个人都有权通过自己所做的工作感到满足，醒来时感到受启发去工作，在那里感到安全，并带着自己为比自己更大的事物做出了贡献的感觉回家。*\n\
  > \n> —Simon Sinek，英美作家、主题演讲者和组织顾问\n\n好领导者和伟大领导者有什么区别？所有领导者都期望提高绩效并取得出色的业务成果。有些领导者很幸运，尽管自己如此也能成功。有些人取得平庸的成果。其他人短期内取得成功，但这种成功并不会建立信任或持续产生成果。\n\
  \n我认为好领导者和伟大领导者的区别在于指导和培养人的能力。\n\nDamon 是其组织内运营副总裁，该公司饱受信任度低的困扰。他知道，要在这个公司向前发展，他应该认真努力与他的老板和同事建立信任。我被要求指导他。\n\
  \n但我发现 Damon 不愿意付出努力来实现这一目标。他组织松散，计划效率低下，任务优先级划分也很差。虽然他工作非常努力，也相当聪明，但他也是一个慢性子的微观管理者，经常陷入细节之中，并把他的团队也带了进去。从本质上讲，Damon“完成了很多事情”，但他是一个糟糕的领导者。他未能制定明确的战略，设定专注的目标，并围绕这些目标授权和调动团队。\n\
  \n此外，Damon 更像是一个警察，而不是领导者。他最喜欢的消遣就是抓住团队成员做错事——“抓到了！”\n\n游戏。他试图通过指责团队来弥补自己的表现不足。当\
  \ Damon 的老板离职时，他自然期望得到这个空缺职位。他的同事和团队都不信任他来完成需要完成的工作，所以这个职位被给了别人。\n\n## “辞职并离开”或“辞职并留下”综合征\n\
  \n也许曾经有过像 Damon 这样具有攻击性行为的领导者会受益，但那个时代已经快结束了。面对不可信赖的管理者，员工会采取两种行动之一：他们辞职并离开，或者辞职并留下。\n\
  \n我们都知道辞职并离开是什么意思，但“辞职并留下”是什么样子？\n\n请考虑 Scott Adams，他创作了漫画《呆伯特》。Adams 在为一群对他完全不感兴趣的管理者从事一份令人缺乏动力的全职工作时开始画漫画。他如何能在全职工作和制作他著名的职场漫画之间取得平衡？他基本上辞职并留下了。他自己解释道：“当你意识到你的努力和回报没有关系时，这真的会让你日程表空闲下来……我有时间进行爱好。”他的日常工作为他提供了大量实用且有趣的材料。\n\
  \n试图通过驱动、侮辱或微观管理来管理人的领导者，最终会让团队成员辞职并离开或辞职并留下。这是自然的后果。不可避免的结果是业务表现平庸甚至更差。\n\n教练——正确类型的教练——是糟糕领导的解药。\n\
  \n## 教练的定义\n\n如果你想领导，而不是驱动或微观管理，你需要成为一名教练！\n\n根据国际教练联合会——制定全球专业教练标准的机构——的定义，教练是“一种伙伴关系，旨在激励他人最大化其个人和职业潜力”。\n\
  \n这很强大。这意味着领导者-教练尊重团队成员作为自己生活的专家。“目前从事某项工作的人最有能力知道如何更好地完成这项工作”，Dr. Ben Nelson 指出。教练尊重这种专业知识。他们相信团队和员工。他们知道他们领导的人是富有创造力、资源丰富且完整的。他们承担责任，发现、澄清并使每个人的目标与组织的目标保持一致，为每个人带来“双赢”。教练是帮助人们从现在的位置走向他们真正想要去的地方的实践。\n\
  \n教练是如何运作的？教练倾听、观察，并根据团队和个人员工的需求、才能和优势调整其影响力。通过提出有力的教练问题，教练直接从员工那里引出解决方案和策略，以帮助实现组织的目标以及个人的目标。因此，教练也是建立有效文化和工作环境的艺术。\n\
  \n显然，指导高管和指导运动员在某些方面是相似的，这两种教练可以相互学习。我曾经有过的最伟大的教练，无论是在体育还是企业领域，都是我高中二年级的篮球教练 Ron\
  \ Burnside。\n\nBurnside 教练是一名身材矮小的后卫，外貌奇特，嗓音尖细。但他了解人，关心他的球员，并对教练工作有着强烈的承诺。他将 16\
  \ 个男孩培养成一个团队意识，使我们学会关心彼此，为彼此而战，为胜利而战。他理解目标、愿景、价值观和高绩效期望。他从基础做起——通过基本功和努力工作来培养技能。虽然他以训练刻苦著称，但他保持了趣味性和娱乐性。我们知道他首先关心我们作为个体，其次才是作为球员。他向我们每个人都展示了信任和尊重。\n\
  \n在 Burnside 教练的领导下，我们的球队赢得了 20 场比赛中的 16 场，击败了拥有远超我们运动天赋和体型的球队。我们之所以能做到这一点，是因为我们的教练相信我们作为个体，挑战我们作为团队做到最好，并在训练和比赛表现中设定高期望。他经常说：“你会在比赛中以你在训练中练习的方式比赛。”\n\
  \n所以你以前从未担任过“教练”？这无关紧要。Burnside 教练很年轻。他曾打过大学篮球，但教练经验非常少。多年来我反思过为什么教练\n\n\n\n\n\n\
  ## 为什么每一位领导者和经理都应该成为一名优秀的教练\n\nBurnside 是一位如此鼓舞人心且激励人心的教练，这些品质浮现在脑海中：\n\n- 他用清晰的愿景、目标和价值观激励我们。\n\
  - 他让每一个人都能发挥自己独特的恩赐、优势和才能。我们对各自的角色非常清楚，但我们被信任并被赋予权力，在有机会时投篮。\n- 他要求严格但从不贬低、不尊重或虐待。他以尊重、诚实和忠诚对待我们每一个人。\n\
  - 他懂得如何培养球员的技能和篮球智商，并知道如何激发每位球员的潜力。\n- 他要求每位球员通过努力工作和自律实现个人精通。\n- 他沟通非常好，并与每位球员建立了个人联系。\n\
  - 他帮助我们建立了良好的关系，并在彼此之间建立了信心。\n- 他投入了必要的时间来为每场比赛充分准备球员。\n- 我们玩得很开心！\n\nBurnside 教练把我们从年轻、幼稚的孩子培养成了自信、专注且技艺精湛的冠军。\n\
  \n你能在你的生活和事业中重现这一点吗？你能通过发现个人优势和潜力、有效沟通、积极建立信任关系，并投入必要的时间来帮助周围的人发展才能、技能和能力，从而打造一支优秀的团队吗？\n\
  \n如果你现在不能说“是！”，到本书结束时你就能做到。你将准备好领导并有效地影响你周围的人。幸运的是，如果你是一个令人惊叹的合作伙伴和下属，自然的结果是：人们会留下并为你付出最好的工作。你将留住并充分调动你的人才，你将培养出新的领导者，你将在职业生涯和生活中不断成长。\n\
  \n不幸的是，在太多组织中，恰恰相反的情况正在发生。\n\n一位企业高管最近告诉我，在未来五年里，他 65% 的员工不仅可以退休，而且会退休。对他来说，这些统计数据令人震惊。“迈克尔，”他解释道，“我内部没有人可以取代他们。我们没有培养出准备接手的下一代优秀领导者。我们存在巨大的人才缺口！”\n\
  \n这位高管并不孤单。太多时候，组织在领导力和人才储备方面准备不足。这种缺乏准备对任何团队或组织都构成真正的战略威胁。解决方案是什么？对你的人进行教练和培养。教练了解对客户和业务而言什么是重要的。他们了解每个业务单元和团队如何共同承担愿景、战略、目标执行和授权的领导责任。他们还了解员工需要具备哪些条件才能提升技能；提高决策能力；扩展角色和职责；并提高他们的动力、生产力和参与度。\n\
  \n你的顶尖人才，甚至你的中层人才，都将在组织之外拥有多种职业选择和机会。有些人可能觉得自己的工作是死胡同。其他人会与老板或其他团队成员关系不佳。其他人则在当前角色中找不到显著的意义或激情。\n\
  \n这就是为什么你迫切需要成为我在这里定义的那种教练：一位真正的合作伙伴，激励他人最大化其个人和职业潜力。\n\n## 教练：它是什么，它不是什么\n\n> 教练是释放一个人的潜力以最大化其自身表现。它是帮助他们学习，而不是教他们。\n\
  > ——约翰·惠特莫爵士，GROW 教练模式创始人及 Performance Consultants International 联合创始人\n\n我认识很多试图接受教练培训的领导者，但发现他们的培训不起作用。它过于简单、枯燥、过于理论化、不够实用或过于学术化。其他人则觉得他们的教练培训来自另一个星球，带他们踏上充满新时代心理之旅，充斥着神秘术语，与现实毫无关联。\n\
  \n相比之下，本书中的教练技能和工具是实用且易于使用的。它们基于多年的测试、试验和实践。我的目的不是让你感到无聊或困惑，而是帮助你理解成为一名优秀教练的基本要素。\n\
  \n## 为什么每一位领导者和经理都应该成为一名优秀的教练\n\n教练不是咨询或咨询。这一点让很多人感到惊讶，他们不了解教练的基础。教练不会走进来，告诉你如何成功，并为你解决问题。教练也不会在你躺在黑暗房间的柔软沙发上时探究你的童年创伤。\n\
  \n真正的教练：\n\n- 采取协作和支持的方法，与他人结成伙伴\n- 在正确的时间以正确的方式提出有力且发人深省的开放式问题\n- 专注于客户的议程和对他们最重要的事情\n\
  - 更关注解决方案和机会，而非过去的问题\n- 帮助识别并克服成功的障碍\n- 通过提出诚实的问题展现勇气，通过表示尊重展现体贴\n- 帮助澄清客户的愿景、策略、目标和目的\n\
  - 帮助客户改善心态、行为和改变能力\n- 鼓励客户做出自己的明智选择\n- 对客户的选择负责\n\n真正的教练不会：\n\n- 提供咨询服务，这通常意味着提供专家建议\n\
  - 提供咨询或治疗\n- 进行漫无目的、毫无进展的对话\n- 弄清楚人们为什么“破碎”以及需要“修复”什么\n- 告诉人们该做什么以及如何做\n\n现在我希望你意识到，你不必是咨询或顾问方面的专家才能成为一名优秀的教练。\n\
  \n## 教练可以成为改变游戏规则的力量！\n\n> 切勿怀疑一小群深思熟虑、坚定不移的公民能够改变世界。事实上，这一直是唯一能够做到这一点的力量。\n> ——玛格丽特·米德，美国文化人类学家\n\
  \n每个人都有成为伟大领导者和教练的潜力。每个人类灵魂中都有发展天赋、才能和优势的能力。这始于减少对自我的关注，更多地关注构建、发展和赋能我们周围的人。\n\n\
  我第一次接触专业执行教练是在 1990 年代，当时我在普华永道担任管理顾问。我在马里兰大学看到一门教练课程的广告，我立刻感到好奇。课程标题是“领导者教练的艺术与实践”。\n\
  \n教练领导者。不是运动员。不是全美最佳球员，而是商业环境中的领导者。我参加了课程，坐下后我立刻着迷。我立刻意识到，职场中的教练可以成为有效领导者工具箱中的关键部分。\n\
  \n之后，我知道我可以作为一名教练走进我的家庭房间、我最喜欢的汽车修理店，或是财富 500 强公司的角落执行办公室。我知道无论在哪里、与谁在一起，我都能带来显著而富有成效的思维转变。\n\
  \n从那时起，研究数据表明我的直觉是正确的。根据发表在《曼彻斯特评论》上的一项研究，正确类型的教练可以提高生产力 53%，工作质量 48%，工作关系 71%，团队合作\
  \ 67%，以及工作满意度 61%。\n\n我坚信每个人都可以成为一名优秀的教练，并且教练无处不需要。事实上，我已经围绕着“教练不是天生的：教练可以培养”这一信念建立了整个事业。只需要学习一些新技能，并将这些技能转化为自然的胜任力即可。\n\
  \n这是我的教练承诺：当你阅读本书并将这些工具付诸实践时，你将提高自己作为教练的技能和能力。你将获得能力和信心，更好地调动和释放你的团队的热情和才能，以实现他们的最高目标和优先事项。\n\
  \n## 一位高效教练的范例\n\n在我职业生涯早期，我有一位领导者之所以伟大，是因为他是一位高效的教练。他的名字是 Stephen M.R. Covey，Dr.\
  \ Stephen R. Covey 的儿子。在他领导和管理我和我们 20 人的咨询团队的三年里，我逐渐认识到他具有强大的商业头脑。他致力于了解我们的客户、行业和市场。他的判断和战略思维都很稳健。他是一位非常称职的商人。\n\
  \n\n\n\n\n## 为什么每位领导者和管理者都应当成为优秀的教练\n\n但他作为领导者的真正伟大之处在于他高效的辅导。他具有极高的情商。\n\n斯蒂芬·M.R.\
  \ 柯维曾与我进行持续的教练式对话，涉及我的工作表现、我的未来、我的学习与发展，甚至我的个人与家庭目标。他的辅导既关乎个人，也关乎职业。他了解我、关心我，并激发了我最好的一面。他根据一份“双赢协议”来评估我的表现——这份协议让公司和我在具体方面都能受益。\n\
  \n斯蒂芬·M.R. 柯维没有直接下达指令，而是提出问题。他以同理心倾听来自客户和他自己团队成员的答案。他征求我们的意见和反馈，并肯定我们的看法。他对我们抱有深厚的兴趣，将我们视为完整的人，而不仅仅是组织机器中的齿轮。他认可并奖励我们的贡献。他如此开放，如此信任团队中的每个人，令我印象深刻。\n\
  \n斯蒂芬·M.R. 柯维的辅导坦诚、谦逊、积极、以解决方案为导向。他关心我们的成功，而不是挑错、评判、指责或羞辱。他全身心投入到辅导他人成为成功领导者的艺术中。\n\
  \n我坚信每位领导者都能成为像斯蒂芬·M.R. 柯维一样出色的教练。这正是我写这本书的原因。在我看来，辅导是出色领导者的核心技能。当你阅读这本书时，请思考许多可以通过优秀辅导来解决的领导力挑战。以下是其中几个值得思考的挑战：\n\
  \n- 团队成员是否认同组织战略？你如何帮助他们与组织和团队目标保持一致？\n- 团队成员是否完全清楚他们需要达到的绩效标准？\n- 他们是否能得到有效的反馈？他们是否知道需要改进什么以及何时改进？\n\
  - 他们是“技能问题”还是“意愿问题”？\n- 他们是否知道自己的优势是什么，以及如何持续发挥自己的天赋与才能？\n- 他们是否有明确的行动计划，并明确了责任和支持？\n\
  - 当他们表现不佳时，他们是在处理自己可控范围内的问题，还是超出控制范围的问题？\n- 他们需要哪些培训、资源或指导来提升绩效？\n"
- "## 辛普森 3Ds 教练模型：教练的“方法论”\n\n> 通常，管理者行为或观念上微小的改变，就能为团队绩效带来惊人的变化。\n> ——艾伦·索克威尔，私营和公共董事会顾问\n\
  \n高效教练的技能始于一个有效的教练模型。就像 J.R.R. 托尔金《指环王》中的至尊魔戒一样，你需要“一个统御一切的教练模型”。\n\n当然，教练模型和教练一样多，但大多数都遵循相同的基本流程。你需要一种循序渐进的方法来应对任何教练机会——无论是绩效挑战、职业发展机会、思维或行为改变、人际关系问题——因为你作为教练的许多成功将来自对教练过程的精通。优秀的教练要求教练在正确的时间，以正确的方式，提出正确的问题。\n\
  \n多年来，我研究了许多有影响力的教练模型，这些模型被用来激发卓越的表现和潜力。¹ 套用托尔金的话，所有教练模型都有其价值，每个模型都为其他模型的价值做出贡献。从我研究的众多模型中，我试图将教练简化为一个非常基本的框架，我称之为辛普森\
  \ 3Ds 教练模型：一个简单、相互关联的流程，任何人都可以用它来辅导他人，无论对方面临什么问题。在本章中，我将概述 3Ds 教练模型及相关工具，你可以在 www.simpsonexecutivecoaching.com\
  \ 在线访问或下载。\n\n¹ 这些模型包括哥伦比亚大学的 3C 教练模型、共创式教练模型、约翰·惠特莫尔爵士的 GROW 模型、盖洛普的优势导向教练模型、马歇尔·戈德史密斯的利益相关者中心教练模型、约翰·麦克斯韦的专业教练模型、NLP\
  \ 模型、行动学习模型、循证教练模型、赫曼大脑优势工具（HBDI）、70:20:10 模型、情商教练模型、ASPIRE、FUEL、OSKAR、CINERGY、SOAR、CLEAR、ARROW\
  \ 等许多其他模型。\n\n3Ds 如下：\n\n1. 诊断：教练议程是什么？\n2. 设计：什么最重要？\n3. 交付：将采取什么行动？\n\n下面我将逐一解释，并提供在每个阶段都能发挥作用的强力教练式提问。\n\
  \n### 1. 诊断：教练议程是什么？\n\n> *如果我有一个小时来解决一个问题，而我的生命取决于这个解决方案，我会花前 55 分钟来确定提出什么样正确的问题，因为一旦我知道正确的问题，我就能在不到五分钟内解决它。*\n\
  > ——阿尔伯特·爱因斯坦，德裔科学家和理论物理学家\n\n在诊断阶段，你要弄清正在发生什么以及为什么发生。你以同理心诊断当前和过去的状态，以便更好地理解员工：他们的优势、他们的观点，以及他们对他人的影响。你正在了解历史背景，倾听他们的故事，弄清他们的思维方式。你正在定义教练过程的议程。\n\
  \n假设你的销售团队中有一位摩根。接近年底，摩根没有达到预期的销售业绩。你不知道原因。你请摩根与你见面，找一个安静的房间进行教练式对话。你向摩根解释，你想了解销售过程中发生了什么，并更好地了解客户在销售管道中的位置。你可能会问这些诊断性问题：\n\
  \n- “你能多告诉我一些你和你的团队在销售目标上的进展吗？”\n- “你当前的销售目标是多少？”\n- “你目前如何衡量成功？”\n- “你目前是否在按计划达成销售数字？”\n\
  - “对你来说，成功是什么样子？”\n- “未来你需要在哪些方面取得成功？”\n- “当你考虑你的销售管道时，哪些客户最接近成交？”\n- “是什么似乎在阻碍你实现整体销售目标？”\n\
  - “你尝试过哪些活动来推动客户在销售过程中前进？”\n- “成交的最大挑战是什么？”\n\n摩根说管道中有几笔交易，但本季度没有成交，因为市场正在放缓。\n\n\
  你可以更深入地挖掘：\n\n- “多告诉我一些客户平均销售周期的情况。”\n- “多告诉我为什么客户很难及时做出决定。”\n- “在你客户那里，哪些关键影响者可能有助于影响销售决策？”\n\
  - “销售管道的哪些方面直接处于你的影响或控制范围内？”\n- “销售管道的哪些方面完全超出你的影响或控制范围？”\n- “专注于你能直接影响的部分，你认为影响销售决策最关键的行动是什么？”\n\
  - “我们是否为客户制定了一个扎实的商业案例来促成行动？”\n- “他们理解我们所提供东西的价值吗？”\n- “他们如何知道我们所提供的东西具有最大的价值？”\n\
  - “他们最可能在哪些方面想要[产品/服务/价值]？”\n- “在一个没有障碍的世界里，你希望未来几周/几个月有哪些不同？”\n- “考虑到你当前的管道，你认为哪些客户最接近做出决定？”\n\
  - “是否有需要安排电话或当面会议的客户决策者？”\n- “你认为我怎样才能最好地帮助你推进管道中的客户？”\n- “我们的团队或组织如何帮助你处理那些最接近成交的客户？”\n\
  - “未来几天是否有客户愿意当面会面？”\n- “你认为哪些客户最有可能在短期内会面并成交？”\n- “在 1 到 5 的评分中，1 = 低，5 = 非常高，你追求管道中这些客户的动力处于什么水平？”\n\
  - “什么能帮助你把寻求成交的动力提升到 4 或 5？”\n- “现在最能激发你并让你专注的最大销售机会是什么？”\n\n在诊断过程中，重点是发现和学习状况、环境、背景、历史、基设、问题、当前状态、障碍和阻碍。当你诊断时，你探索个人意识、差距、能力和优势、当前思维模式和范式、当前行为，以及员工对其个人故事的观点。\n\
  \n当你在诊断阶段提问时，你正在确定摩根工作的范围，明确期望，决定要关注的重点，找出阻碍他们的因素，阐明商业案例或收益，探索内在创新，并为建立有效、高度信任的教练关系奠定基础。你是一个在一旁的向导，帮助他们好奇地探索现实和背景。\n\
  \n以下是一些优秀的教练式提问，可以在任何一般教练对话的诊断阶段提出：\n\n- “是什么让你来寻求教练辅导？你想从哪里开始？你的议程是什么？”\n- “你希望在这次会谈中实现什么？”\n\
  - “你想讨论/探索哪些问题、挑战或大机会？”\n- “主要的问题似乎是什么？”\n- “关于[主题]，你最担心的是什么？”\n- “你当前要实现的目标是什么？你想对自己/你的团队/组织改变什么？”\n\
  \n\n\n\n\n- “你的未来目标是什么？你有哪些选择？什么是有可能的？什么让你兴奋？”\n- “现在发生了什么？绩效挑战是什么？”\n- “你能给我介绍一下现在发生的事情的历史和背景吗？”\n\
  - “什么数据、观察或经历表明存在问题/机会？”\n- “你能多告诉我一些吗？还有什么发生了？关于[topic]你有什么感受？”\n- “这之前发生了什么？发生了什么？是什么导致了这个？你能多说一点吗？”\n\
  - “事情进展如何？有什么新情况？最新消息是什么？”\n- “采取这一行动方案的好处是什么？不这样做的成本是什么？”\n- “目前有哪些障碍或挑战阻碍了你？”\n\
  - “你需要克服哪些障碍？”\n- “你对克服这个障碍有什么感受？能多说一点吗？”\n- “是否需要对思维方式、行为、行动或资源进行任何必要的转变或改变？”\n\
  - “你在通往目标的道路上现在处于什么位置？你想处于什么位置[差距]？”\n- “你希望做出哪些具体改变？”\n- “你能否用一句话说明你现在的位置以及你希望取得的成就？”\n\
  - “什么标题可以描述你想要关注的内容以及你最大的挑战或机会？”\n- “在1到5的量表上，1=低，5=非常高，你在实现目标的动力上处于什么位置？”\n- “如果你的理想情况或期望的成功状态在量表上是5，你现在在哪里？”\n\
  - “在一个没有障碍的世界里，在接下来的几周/几个月/年里，你希望有什么不同？”\n- “你如何知道自己已经成功？有什么成功衡量标准？有什么期望的状态结果？”\n\
  - “如果你有一根魔杖，可以改变任何事情来确保你现在的成功，那会是什么？”\n- “现在有哪些巨大的机会让你兴奋并激励你专注于此？”\n- “你想要或希望实现什么？还有什么？”\n\
  - “你会如何总结你今后想要关注的内容？”\n- “通过今天的对话，在下次会议之前，你希望在哪些一两件事上集中精力？”\n- “你将采取什么行动？何时完成？”\n\
  - “我/团队如何最好地支持你今后的发展？”\n\n总之，诊断阶段是帮助客户、团队成员或同事了解他们过去和现在的思维方式、障碍、错误的假设和信念。教练在诊断阶段帮助总结他们的学习成果，以便他们能够清楚地定义问题、挑战以及成长和成功的机会。在诊断中，关键是澄清差距或目标，并总结他们为什么需要改变、什么最重要以及痛苦、收益或机会的范围。他们优先考虑并缩小重点，集中在几个关键领域，并讨论他们针对行为改变、绩效改进、发展或目标设定的重点领域。\n\
  \n## 2. 设计：什么最重要？\n\n> 你将注意力从低价值活动转移到高价值活动的能力，是你生活中取得一切成就的核心。\n> ——Brian Tracy，加拿大美国激励演说家和自我发展作家\n\
  \n在教练的第二阶段，你帮助客户为自己、他们的团队或他们的组织环境设计解决方案。你考虑什么有效，什么无效，并开始创造性地头脑风暴可能有效的方法。当你进行诊断时，你会发现正在发生的事情并澄清关键优先事项和目标。当你进行设计时，你会检验假设，进行创造性和创新性的头脑风暴，设想期望的未来状态，并探索前进的各种选择。\n\
  \n在设计阶段，你可能想问 Morgan：\n\n- “过去什么方法帮助你成功签单？”\n- “你能采取什么新颖或创造性的行动来帮助推进和完成你的销售渠道？”\n\
  \n以下是可以在设计阶段提出的一些优秀教练问题：\n\n- “你今天想解决什么[教练主题]？”\n- “你如何描述和总结这种情况？”\n- “你最有动力和兴奋专注于什么？为什么？”\n\
  - “你从这种情况中获得的主要收获是什么？”\n- “你从反馈、数据、观察或证据中获得了什么见解？”\n- “你对[数据/情况]有什么感受或反应？”\n- “你获得了任何新的见解吗？能多说一点吗？”\n\
  - “你从中得到的关键教训或见解是什么？”\n- “你认为这种情况意味着什么？你会如何总结这种情况？”\n- “你强调了哪些关键数据点、关键问题或重大机会，或关键关系？”\n\
  - “对话或数据的任何方面让你感到困惑？不清楚？不合理？”\n- “这种情况告诉你关于你自己的什么？”\n- “你认为自己如何才能最积极主动和负责任地应对这种情况/信息？”\n\
  - “你是否注意到改善与关键人物或利益相关者关系的机会？”\n- “谁是重要的人、关键关系或重要的利益相关者，他们有特定的需求，你需要有效改善？”\n- “是否有任何团队、组织或客户关系或绩效机会需要你加强和改善？”\n\
  - “你在这一领域的当前优势和劣势是什么？”\n- “你在处理这一[关系/情况]时有哪些选择？”\n- “你从中得到的重要的教训是什么？”\n- “那个解决方案会是什么样子？你能给我举个例子吗？”\n\
  - “当你进行创造性头脑风暴时，哪些想法会浮现？”\n- “哪些重点领域最让你兴奋或最有动力去改进？”\n- “采取这些选项有哪些预期收益？”\n- “如果重来一次，你会做些什么不同的事？”\n\
  - “今后有哪些缺点、陷阱或需要注意的地方？”\n- “过去有什么有效的方法吗？它如何适用于这种情况？”\n- “鉴于可用的选项，你希望追求哪些领域？”\n-\
  \ “你认为最重要的是追求哪些优先事项？”\n- “如果你专注于你的自然优势和才能，你有动力去追求什么？”\n- “你需要什么资源才能成功？”\n- “如果你要优先考虑一到三个最重要的行动领域，那会是什么？”\n\
  - “你认为如何可以改善这种情况？”\n- “可能的解决方案是什么？”\n- “考虑到你所有的选择和选项，你希望追求或去做的是什么？”\n- “你最兴奋今后专注于什么？”\n\
  - “你将采取什么行动？何时完成？”\n- “我/团队如何最好地支持你今后的发展？”\n- “由于我们今天的对话，在下次会议之前，你希望在哪些一两件事上集中精力？”\n\
  \n总之，设计阶段的重点是帮助客户、团队成员或同事为自己、他们的团队和他们的组织环境设计创新解决方案。设计阶段的教练帮助他们考虑什么有效，什么无效，并开始澄清和筛选各种解决方案和期望的未来情景。会探索他们如何最好地优先考虑和影响关键绩效领域、重要的利益相关者关系以及组织和客户需求。设计阶段是关于探索、头脑风暴和创造性地讨论各种选项和计划，这些计划在付诸行动之前最具激励性和成功性。在设计阶段，教练可以通过帮助他人澄清优先事项、探索选项和选择、挖掘创造力、内在创新、优势、兴奋感以及今后令人兴奋的新更好选项，从而增加巨大的价值。\n\
  \n\n\n\n\n## 3. 交付：将采取哪些行动？\n\n> 清晰、简单的目标若无人认真对待，便意义甚微。商业中普遍存在未能贯彻到底的现象，这也是执行力不佳的主要原因。你需要强有力的对话来揭示业务的现实。你需要对结果负责——由责任人公开讨论并达成一致——以便把事情办成，并奖励表现最佳者。你需要跟进落实，确保计划在正轨上。\n\
  >\n> ——拉姆·查兰（Ram Charan）与拉里·博西迪（Larry Bossidy），《执行：如何完成任务的学问》（*Execution: The Discipline\
  \ of Getting Things Done*）\n\n彼得·德鲁克曾说过类似这样的话：“所有宏伟的战略最终都会归结为工作。”在交付阶段，详细的计划和执行问责流程被落实到位，使其成为现实。这是关于聚焦目标、预期结果、里程碑和成功衡量标准、执行计划、问责机制、持续沟通和行动学习的领域。\n\
  \n在交付阶段，详细的问责步骤被规划出来。你确定如何以及何时将计划付诸行动，以提升绩效、达成结果，并通过与所有关键利益相关者的持续互动来建立信任。\n\n教练可以通过提出以下问题来帮助推进交付阶段：\n\
  \n- “这个问题[主题]对你来说为什么如此重要？使命、目的或大局是什么？”\n- “你的战略、路径和前进计划是什么？”\n- “你的关键目标、成果、目的和衡量标准是什么？成功是什么样的？”\n\
  - “你希望将哪些目标[主题领域]付诸行动？”\n- “需要达成哪些衡量标准或关键里程碑来确定你的成功？”\n- “需要谁参与或向谁汇报，以确保获得支持和成功？”\n\
  - “你打算如何完成这件事？你明确的行为和行动是什么？”\n- “你计划何时实施这些关键行动？你打算何时开始每日/每周的行动？”\n- “在接下来的30、60、90天内，你需要制定哪些行动计划？”\n\
  - “你认为实现这些目标和目的有哪些障碍？你需要采取哪些步骤来避免或克服这些障碍？”\n- “我/团队如何为你的未来成功提供支持和所需资源？”\n- “你需要与谁合作才能完成这件事？”\n\
  - “你必须有效调动哪些人员、团队、部门、领导层、关键利益相关者或组织支持，才能执行你的目标和目的？”\n- “你将采取哪些行动？截止何时？”\n\n回到摩根（Morgan）的案例研究。在帮助摩根进入交付阶段时，教练可能会说：“摩根，要最好地执行你的计划，你需要采取的第一步是什么？”\n\
  \n摩根可能会决定联系客户联系人，并与关键决策者安排一次现场会议。\n\n然后你可能会问：“摩根，你还可能遇到哪些其他障碍？”摩根可能会分享他的演示中有一个技术部分需要帮助。如果领导层能有人出席演示，以影响决策者，那将对演示至关重要且有益。\n\
  \n“摩根，这是个很棒的计划。你什么时候可以安排？我如何支持你？什么能为客户和即将到来的会议带来最大价值？会议之后，你将如何衡量成功？我如何跟进你？你还需要我、团队或组织提供其他什么吗？怎样才能最好地让你对自己的计划负责？”最后，表达支持、信心和肯定来结束。“我相信事情会进展得非常顺利。我认为这是一个很棒的计划。我很兴奋能支持这项努力。”\n\
  \n以下是一些在交付阶段可以提出的优秀教练问题：\n\n- “什么问题、挑战或机会[主题领域]是你最期待执行的？”\n- “什么最能激励你、让你最兴奋地去关注和改进？”\n\
  \n绩效目标和目的被清晰界定。汇报的明确期望已达成一致。未来的行动步骤以及与关系、合作伙伴、团队成员和关键利益相关者的成功互动已被规划出来，以供执行。\n\n\
  ## 教练实战：丽贝卡的故事\n\n丽贝卡面临一个挑战：她被引入一家国际组织，帮助加强与客户和本地分销商的关系。通过研究数据，她根据分销商的绩效和与其合作的便利程度，将现有分销商分为三大类：高绩效、中绩效和低绩效。她的目标是处理低绩效分销商的问题，但当她仔细审视情况时，发现这些分销商通过与CEO的友谊而受到“保护”。\n\
  \n在与丽贝卡的教练会谈中，我们运用了辛普森3D教练模型：1. 诊断，2. 设计，3. 交付。\n\n### 1. 诊断：教练议程是什么？\n\n丽贝卡向我解释道：“迈克尔，这里有一个严重的问题。我们有一些低绩效分销商，他们正在流失客户，也在流失自己的员工。但他们知道，自己受到与CEO长期友谊的保护。我无法与他们讨论这个问题，否则他们会向CEO抱怨，而我可能会被解雇。我在这里没有权力。当存在严重的政治后果，而CEO又有权让我丢掉工作时，我该如何向上影响呢？”\n\
  \n正如那个儿童故事提醒我们的那样，告诉皇帝他没穿衣服是非常困难的。\n\n我复述了情况，以确保我理解无误。“丽贝卡，这是一个困难而敏感的局面。这些分销商似乎是老派哥们儿，用一种不创造价值的方式保护自己，并使这件事变成了政治问题。”\n\
  \n然后我向丽贝卡介绍了“勇气与体谅”（courage and consideration）的心态（稍后详述）。在向上教练时，关键是要以绝对的体谅为先导——从忠诚和尊重开始，表达希望就改善现状进行一次艰难的对话。\n\
  \n然后用勇气来平衡体谅——摆出你的数据、反馈和你对风险的看法。向老板保证你完全透明。专注于客户价值和目标、组织利益，以及客户与业务的共同机会。\n\n###\
  \ 2. 设计：什么最重要？\n\n“丽贝卡，现在你是独自面对这个问题，如果你单独去解决，你会被如何看待？”她回应道：“作为一个抱怨者、诉苦者，而且不忠于老板。”“你能直接攻击他的自尊吗？”我问。她意识到自己会输掉那场战斗，而且她需要内部的政治和业务支持。\n\
  \n“还有谁受到这种情况的影响？”我问。“哪些利益相关者也在为此付出代价？你还能从哪里获得支持？跟我说说你需要影响谁，以及谁可能在内部提供政治支持？”\n\n\
  丽贝卡分享说，首席运营官（COO）平易近人，会是一个好盟友。丽贝卡明白，她还需要影响董事会成员。她开始头脑风暴，制定一个包容性强、以解决方案为导向的计划，而不是关注问题或个人。\n\
  \n“什么信息能吸引COO？能吸引董事会？你需要编制哪些业务数据，你需要为他们准备什么样的基于事实的信息？数据如何体现客户需求、客户价值以及业务的最佳利益？”\n\
  \n“迈克尔，数据清楚地显示，我们正在流失优秀员工和优秀客户，”她回答说。“这两种流失对业务以及我们未来的生存能力和可持续性来说，代价高昂且风险巨大。这意味着我们的增长机会正在受损，企业文化也在遭受磨难。我需要向CEO展示，保护几个表现不佳、却在示范错误价值观和行为的朋友，正在以巨大的方式适得其反。我需要谈论人员流动率、低生产率、绩效不佳问题、价值观偏离以及客户反馈不佳。最终，CEO是个理性的人，他想要对业务最有利的东西，也想在董事会眼中表现良好。有了COO的帮助和董事会的支持，我想他会倾听逻辑、事实、数据和客户需求的。”\n\
  \n\n\n\n\n## 3. 交付：将会做什么？\n\n为了总结我们的教练对话，我问 Rebecca：“我们今天谈了很多。你完成它的计划是什么？基于我们的对话，你有动力去解决哪些问题？你觉得自己首先需要做什么？”\
  \ Rebecca 然后制定了计划。她决定首先与她的首席运营官和董事会成员组成一个联盟。她会测试他们的支持并获取反馈，以确保信息准确，并且会得到 CEO 的认可。\n\
  \n她需要招募能够以专业、尊重和忠诚的方式支持她的人，而不是以情绪化或评判的方式。她需要在反馈和信息传递中既高度体谅，又高度勇敢。否则，信息将不会被听见，或者她的工作将处于风险之中。\n\
  \n“你需要什么工具？你需要什么资源？”她觉得自己需要根据客户需求、市场需求、人员流失报告、离职面谈以及损益报表汇编一份有说服力的数据资料包。她必须为 CEO\
  \ 串联起这些要点，并确保他不会感到被攻击。这意味着要呈现硬事实：客户数据、客户忠诚度反馈、员工流失、离职面谈数据等等。\n\n“在接下来的 30、60 和 90\
  \ 天里，你承诺要做什么？”我问。Rebecca 承诺首先安排与她的首席运营官会面，然后与她在董事会中有信誉的关键影响者会面，然后与她的 CEO 会面。\n\n\
  “我如何支持你并帮助你对这个计划负责？”我问。我们同意我可以每两周给她打电话一次，检查进展情况。我们还同意，如果出现任何不可预见的情况或她需要额外支持，她可以随时通过电子邮件或电话联系我。\n\
  \n## 实践：你的教练手册\n\n考虑一下你团队或组织中变得具有挑战性的问题。独自或与你的团队一起，花时间练习以下教练阶段及其相互关联的有力教练问题：\n\n\
  - 1. 诊断：教练议程是什么？\n- 2.  设计：什么最重要？\n- 3.  交付：将会采取哪些行动？\n\n挑战，你会深入挖掘，你会有效参与吗？还是你在必须投入太多之前就脱节并离开？你是否坚信自己和自己的能力，还是你脑中不断传来一个信息，坚信你是个失败者？你的故事是什么？\n\
  \n## 构建你的个人故事\n\n> 不要低估你的心态和愿景改变世界的力量。无论这个世界是你的企业、你的社区、你的政府、一个行业还是一个全球运动，你都需要有一种核心信念，即你所贡献的东西可以从根本上改变范式或思考问题的方式。\n\
  >\n> ——Leroy Hood，美国生物学家和科学仪器开发者\n\n你的个人故事是你基于生活经历的心态。它是你的个人叙述、你的内心对话；当你准备分析问题、做出决定或采取行动时，它会告诉你你是谁，是继续前进取得成功，还是停止因为你会失败。亨利·福特说过：“你认为你能，还是你认为你不能——你是对的。”你的心态是你大部分决定、动机和行动的强大驱动力。当你深入了解某人如何思考以及什么激励他们时，你就可以开始影响新的视角、看待世界的新方式以及新的创新形式。教练从评估和理解心态开始发现过程。\n\
  \n《心态》一书的作者 Carol S. Dweck 博士描述了一项关于孩子们尝试解谜的研究。随着谜题变得更难，她对两位沉浸在困难中的学生感到惊讶。一个男孩表达了他终于得到一个具有挑战性的谜题的喜悦。另一个人兴奋地认为他那天将学到一些有用的东西。Dweck\
  \ 写道，当她看着他们时，她想：“他们怎么了？”（Dweck 2006）。\n\n那是他们心态的问题。这些孩子喜欢挑战，并且知道如果他们付出努力，他们就能解决遇到的任何问题并从中学习！\n\
  \n心态是你看待周围世界的方式。根据 Dweck 博士，你的心态深刻地影响着你过日子的方式。\n\n顺便说一下，就像个人一样，团队也有心态。当你发现驱动团队愿景、价值观和目标的集体心态时，你可以有效地检验假设、发挥他们的优势并改善他们的决策和创新。\n\
  \n审视你自己的个人心态。有些心态可能是现实的，有些可能是限制性的，而另一些可能是完全扭曲的、虚假的和错误的。正是在你的心态中提出这样的问题：“我为什么这么聪明？”或“我为什么这么愚蠢？”“我周围的人为什么更聪明（或更愚蠢）？”这些内心对话是你一生中最重要的对话。你与自己的对话将决定你人生的结果，并极大地影响你周围的每一个人。\n\
  \n教练只需提出正确的问题，就能为是什么激励和影响心态提供极大的见解。\n\n## 克服固定型心态\n\n我们通常将心态归类为*固定型*或*成长型*心态。\n\n\
  如果你有固定型心态，你相信你无法成长、改进或改变。你还相信你天生就具有一定的智力水平和某些人格特质。就这样。它是固定的——它是确定的。\n\n相比之下，如果你有成长型心态，你相信随着时间的推移、努力和帮助，你可以不断成长和学习。天空就是极限。有成长型心态的人同意前美国大联盟棒球投手\
  \ Roger Clemens 的观点：“我认为只要你有心态、有意志和欲望去做并付出时间，任何事情都是可能的。”\n\n作为教练，你的主要任务之一是帮助你的客户在自己内部发现*内在创新*：成长型心态而非固定型心态（见图\
  \ 3.1）。如果有固定型心态，他们就无法取得多大进展，因为他们认为这是不可能的。对你作为教练来说更是如此：如果你背负着固定、评判或悲观的心态，你就不太可能帮助他人。\n\
  \n此外，心态是可以改变的，而且确实会改变。那些有固定型心态的人实际上相信一种幻觉——认为没有任何东西可以改变他们。\n\n## 固定型或成长型心态\n\n![](img/3b9ba4a318234a9c4d131f84093751e0_57_0.png)\n\
  \n图 3.1. 从固定型心态到成长型心态的光谱。\n\n来源：Dweck 2006。\n\n这是错误的。心态往往是多变的、动态的、进步的和不断发展的。\n\n\
  例如，我的熟人 Carter 在服役期间脊柱受伤后，他在一家看起来很适合他和他家人的社区找到了一份工作。幸运的是，他的老板也是退伍军人。他们彼此理解，并基于相似的生活经历进行良好沟通。Carter\
  \ 与他的老板有着强烈的同志情谊。当新同事 Mallory 来到时，Carter 告诉她，老板是他漫长职业生涯中遇到的最好的人之一。\n\n不幸的是，Carter\
  \ 的老板有一天向他承诺——然后违背了诺言。（至少这是 Carter 的看法。）几乎一夜之间，Carter 的老板从世界上最好的人变成了可怕的人和骗子。Carter\
  \ 的工作从理想变成了折磨。\n\n发生了什么事？Carter 的心态发生了负面、有毒的转变。\n\n理想情况下，Carter 的老板本可以介入并解决这种情况，但他没有。Carter\
  \ 的同事 Mallory 看到她的同事开始向下螺旋并脱离，只做维持工作的最低限度。这对每个人来说都是糟糕的情况。虽然她是他的同事，但 Mallory 决定尝试指导\
  \ Carter。一开始，她需要发现他心态转变的原因：他是如何迅速地从热爱工作到憎恨工作的？这种情况中还能挽救什么？让我们观察 Mallory 与 Carter\
  \ 练习 3D 教练阶段中的两个阶段：\n\n\n\n\n\n## 1. Diagnose Phase: What Is the Coaching Agenda?\n\
  \n午餐时间抽空离开办公室，Mallory 问 Carter：“我很好奇。为什么你对工作的感受变化如此之快？你以前是满意的。给我一些你当前情况的背景。过去几个月发生了什么？”她富有同理心地仔细倾听他的故事，没有打断他，也没有表示同意，或试图修复或为老板辩护。\n\
  \n相反，她提供了支持。“听起来你在工作中经历了信任的背叛和缺乏明确的期望。”\n\n## 2. Design Phase: What Matters Most?\n\
  \nMallory 然后开始设计过程，通过重新框定情况：“留下来有什么积极的理由吗？展望未来，哪些好处和创造性机会让你兴奋？在一个没有障碍的世界里，你能做哪些创新和创造性的事情来最好地影响老板和当前的情况？如果你离开，你会带走哪些积极的东西到你的未来工作？”\n\
  \n教练最令人满意的事情之一就是帮助某人挑战虚假、限制性或无效的心态——帮助他们重新框定情况并克服悲观或缺乏希望。许多人发现自己处于绝望或自我挫败行为的状态；我喜欢见证转变，当我辅导的人开始利用创造力、技能和希望的自然资源来寻找新的策略和方法时。重新框定限制性或虚假的心态；帮助人们克服心理障碍；解放他们以提高自我意识、扩大责任和选择以及信心——这些是有效教练的内在回报之一。\n\
  \n你的内心叙事是什么？关于你自己的什么故事影响了你的心态？正如作者 Patrick Rothfuss 在他的书《风之名》中所说：“每个人都在自己脑海里讲述关于自己的故事。总是。一直如此。这个故事造就了你。我们由这个故事构建自己”（Rothfuss\
  \ 2007）。\n\n我们的内心叙事也会分散、扭曲或欺骗我们。它会告诉我们我们很笨，我们不够，或我们缺乏影响我们生活处境的力量。它会告诉我们我们毫无价值。如果是这样，我们就会隐藏在羞耻、自怜、自卑或恐惧中。我们避免可能失败的情况，因为我们的心态告诉我们我们总是失败——我们是失败者。在他的书《与情绪智商共事》中，Daniel\
  \ Goleman 说：“如果我们缺乏能够应对[生活]挑战的信念，我们就会开始以注定失败的方式行事。‘我做不到’这个想法是致命的”（Goleman 1998）。我们陷入停滞。我们脱离。\n\
  \n我们如何克服这种消极、恐惧的内心叙事？我们找到我们的个人力量。我们找到我们的真理并开始生活它。\n\nDr. Mark Goulston，《Get Out\
  \ of Your Own Way at Work》的作者，分享了他如何变得慢性晕车的故事。他写道，当他还是个小男孩时，他在家庭汽车的后座上读漫画书，感到不适，然后呕吐了。\n\
  \n他妈妈解释说他容易晕车，每次在车上读书都会晕车。而他确实会！Dr. Goulston 承认，每次他试图在车上读书时他都会生病。他在飞机或火车上没有类似的问题，因为他母亲从未警告他在这些环境中会生病。但后来他真的很想在车上读书。所以，他开始读书了！他立即感到恶心，但他坚持下去直到不适感消失。“从那以后我就能在车上读书而不生病了。思想和坚持的意志真是令人惊叹，不是吗？”（Goulston\
  \ 2005）。\n\nDr. Goulston 指出我们很容易陷入限制性叙事中——并且突破它！如果他能在车上读书，他还能做什么？为什么他没有更早意识到呢？我们的内心叙事告诉我们我们可以做什么和不能做什么，而我们听从它！我们在限制范围内工作。许多自我强加的限制可能成为自我实现的预言。如果你认为你可以或你不能，你是对的。\n\
  \n也许你小时候被狗吓到并长大后坚信所有狗都很具攻击性和凶恶。 也许你看着你爸爸沉迷于他的新福特，他每个星期六早上亲手洗车，而你长大后变得不同？ 理想的回应会是什么样子？\n\
  - 你如何以更有效的方式回应？\n- 以这种新而更好的方式回应有什么好处？如果未来你不以不同的方式回应，成本或缺点会是什么？\n- 你如何开始分享你的天赋、才能和优势？\n\
  - 你为团队带来什么优势，你如何最好地利用它们为团队的整体利益服务？\n\n## Coaching from the Inside-Out\n\n记住，教练并不是要进行治疗。我不需要对\
  \ Maria 进行精神分析、评估、修复或建议。我不需要发现是否有五年级的老师或过去的负面父母告诉 Maria 她永远不会像男孩一样聪明。那不是教练。需要在房间里成为专家，或增加价值或提供建议的需求，对大多数教练来说都具有挑战性。这也很难以做到！我们想帮助并告诉人们该怎么做。很多时候我们的天性是修复、解决并让一切变得更好。\n\
  \n在为 *Forbes.com* 的一篇文章中，Susanne Biro 讨论了教练和咨询之间的界限经常被模糊的问题（Biro 2017）：\n\n> 许多领导者认为他们了解如何很好地教练。然而，当我教领导者教练并让他们进行第一次教练对话时，我不可避免地发现领导者给出他们的建议，告诉人们该做什么，以及如何做。那些出于好意的策略往往会妨碍表演者、下属或被辅导者进行发现和承担重任，Biro\
  \ 认为。“我们想帮忙！但告诉某人该做什么并无帮助。”作为老板，请记住如果你不断告诉人们该做什么，而它不起作用，那是谁的错？\n\n一位优秀的教练提出问题以使人们拥有自己的问题，解决自己的问题，并探索改善其处境的创造性方法。教练并不意味着我们必须把所有的智慧、判断、建议和经验都放在门口。我们可以\n\
  \n\n\n按需使用。但我们的能力和经验往往阻碍了帮助他人发展自己的能力并从自己的经验中学习。被辅导的人是否应该总是承担繁重的工作？在你的员工会议上，关于你的天赋、优势和才能，什么是真实的？在团队讨论中，你如何最好地将团队与客户需求、相互关联的系统和利益相关者的支持联系起来？你是否真的在会议中没有增加价值，应该保持沉默？你的团队是否在没有你的关键见解和观点的情况下做出了合理的工程决策？”\
  \ 显而易见的答案是“不是”。\n\n我请玛丽亚设定一个目标，在即将到来的员工会议上至少发表三条评论。我们进行了角色扮演，演练她可以做什么、可以提出哪些关键问题。“当你出现却保持沉默时，你就是在一种扭曲和自欺的状态下生活，”我提醒她。\n\
  \n最终，玛丽亚的上司注意到了她的变化。“我真的很欣赏你在我们会议上的贡献和发言，”他告诉她。“我们现在向客户提出了更有连贯性、更一致的问题，涉及我们的产品和服务。”玛丽亚变得更加自信。她仍然难以开口发言，但她意识到了退缩的负面影响。她知道她让自己沉默太久了，她为生活在一个没有羞愧和恐惧的世界里而兴奋。\n\
  \n教练辅导帮助玛丽亚摆脱了消极心态，更充分地发挥了她天生的天赋和优势。\n\n彼得·德鲁克、大卫·库珀里德、马丁·塞利格曼博士、唐·克利夫顿、马库斯·白金汉、汤姆·拉思等专家的重大研究都指向一种基于优势的方法，以获得更高的生产力、积极性、留任率、参与度、绩效和成果。事实上，在教练辅导中，员工的长处是我们最大的资产。\n\
  \n正如金融励志演讲家T.哈维·艾克所说：“去做吧。投入其中。朝着正确方向迈出一步，胜过一百年的思考——关于发生在我们身上的事，以及我们的选择。” 吉姆·柯林斯在他的著作*从优秀到卓越*中说得最好：“伟大的成就从来不是运气、境遇或环境的产物，它永远是自律思考、自律选择和自律行动的结果”（柯林斯，2001）。\n\
  \n## 拥有你自己的故事\n\n> 你必须进去。\n>\n> ——尤达\n\n糟糕的事情会发生。生活是不公平的。人们会让人失望。挫折和失败会出现。但这些事情不一定要定义你自己的内心故事。\n\
  \n在1980年的电影*《帝国反击战》*中，主角充满潜力，但有点爱抱怨，遇到困难时容易放弃。他叫卢克·天行者。作为绝地训练的一部分，他必须在一个黑暗的洞穴中面对自己的恐惧。他很害怕。但他的老师尤达解释说：“你必须进去。”在洞穴里，他与敌人达斯·维达战斗；当卢克砍下维达的头时，卢克看到自己斩首的头正盯着自己。\n\
  \n作家兼心理学家布琳·布朗博士在她的著作*《崛起的力量》*中指出，我们都必须面对那些伤害我们的内在叙事。这可能令人恐惧。但正如布朗所解释的：“拥有我们的故事意味着承认我们的感受，并与艰难的情绪搏斗——我们的恐惧、愤怒、攻击性、羞耻和责备……要驾驭原力，我们必须拥有自己的故事，活出自己的真理。你必须进去。”作家兼励志演说家莱斯·布朗曾说过：“生活是为了活着。当你制定目标和梦想时，在你准备好之前就行动吧”（布朗，1992）。找到你内在的力量，设计你自己的故事——一个你想要专注于并活出的故事！\n\
  \n## 重新构建你自己的故事\n\n重新构建内在叙事被称为“日常教练工具箱中最强大的工具”（Stubblebine，2016）。其基本原理是，我们的大脑必然只能容纳这么多信息，这意味着我们必须有所选择。“你喂养大脑的东西，将引领你的人生，”专业教练克米·索古恩勒如是说。\n\
  \n为了说明这一点，从前有两个能干、勤奋、合格的鞋类销售员。他们各自被分配到一个太平洋岛屿的新区域。一到那里，第一个销售员就紧急给总部打电话：“让我离开这里。这里又热又脏，岛上没有人穿鞋。这个区域是浪费时间！”第二个销售员也给总部打电话：“你不会相信我的区域。请立即让我与制造和运输部门联系。我们的前景非常好。这里有很多人，而且岛上没有人有鞋。”我们看待情况的方式比我们的境况、教育、金钱或才能更为关键。\n\
  \n另一位教练曾与一位CEO谈论一名棘手的员工（Stubblebine，2016）。这名员工很有天赋，入职时得到了非常有力的推荐。CEO对这名员工的潜在贡献感到兴奋——但员工却一事无成。一直以来，CEO都告诉自己：“我有这么一位才华横溢的员工！”直到一位教练走过来问了一个问题：“这名员工对你和组织有什么贡献？”CEO很快回答：“没有。”直到那时，CEO才知道该怎么做：他必须让这名员工离开，并祝福他。CEO能够重新调整自己的视角并采取行动。\n\
  \n通过简单的问题，教练辅导可以揭示我们为什么这样思考，为什么我们会对某些触发因素采取行动或做出反应，以及如何探索对困难情况的可能回应。当我们认识到我们所\n\n\
  ## 成为自信的教练\n\n> 这是我在每一位与我共事过的高管身上寻找并试图培养的品质。信心赋予你勇气，拓展你的能力范围。它让你敢于承担更大的风险，取得比你想象中更大的成就。建立他人的自信是领导力的重要组成部分。它源于为人们提供机会和挑战，让他们去做从未想过自己能做的事情——在他们每一次成功后，用尽一切可能的方式奖励他们。\n\
  >\n> ——杰克·韦尔奇（2001）\n\n杰克·韦尔奇是我们这个时代最伟大的商人之一，他从小就有语言障碍。正如他在其著作*《直抒己见》*中解释的那样，他从小就被口吃所困扰。后来，他的母亲帮助他重新构建了自己的局限。“那是因为你太聪明了，”她对儿子说。“没有人的舌头能跟上像你这样聪明的大脑！”\n\
  \n韦尔奇相信了母亲的话：他的大脑比嘴巴运转得更快，这就是他口吃的原因。于是，他不再为此担心。\n\n几十年后，韦尔奇看到了一些小时候的照片，被自己的样子震惊了。他身材矮小。“然而我从来不知道，也没有感觉到，”韦尔奇写道。“我没有更在意自己的体型，这简直荒唐……我母亲让我相信，我可以成为任何我想成为的人。这真的取决于我自己”（韦尔奇，2001）。这种心态不但没有限制他，反而推动了他作为商业领袖的成功。\n\
  \n一名有效的教练能够帮助客户培养投入、高效、适应性强且富有创新性的心态。这就是为什么领导者需要成为有效的教练。正如领导力专家、作家小弗雷德·A·曼斯克所言：“终极领导者是愿意培养员工，使他们最终在知识和能力上超越自己或自己的人”（曼斯克，1999）。\n\
  \n\n\n\n\n## 选择你的故事\n\n> 你无法阻止汹涌海浪的冲击，但你可以学会冲浪。\n> ——乔恩·卡巴特-津，医学荣休教授、正念导师，美国人\n\n\
  像杰克·韦尔奇一样，我们可以为自己的挑战讲述一个不同的故事并克服它们。一位优秀的教练会不断敦促客户采取一种能最大化利用任何局面的心态。当客户的故事行不通时，教练会帮助他们重新框架、重写并选择一个不同的故事。\n\
  \n当我辅导伊森时，他所在的公司正在国际化扩张。伊森在国内为新产品设定价格点方面做得不错，但国际市场要棘手得多。与此同时，伊森的同事在定价方面是真正的专家。“而且，说实话，他认为自己应该得到我的职位，”伊森承认道。“他的被动攻击性有时令人难以承受。”\n\
  \n我问伊森，他是否认为自己对同事的反应在自己的控制之下。当然在控制之内，他说。无论情况多么困难，我们总可以选择自己的回应。我们无法控制他人如何行为，无论他们是被动攻击、\
  \ toxic 还是公开敌对，但我们可以框定自己的回应。别人的愤怒、敌意、自负、支配和贬低行为与我们无关，那我们为什么要让它们控制我们的行为并可能毁掉我们的生活呢？\n\
  \n我问伊森：“当你遇到这种被动攻击行为时，有什么富有成效的回应方式？有哪些改善这一情况的机会？你如何以更积极的方式影响这一情况？你的盟友是谁？当有人在破坏或贬低你时，谁是你的倡导者？”\n\
  \n不幸的是，那位挑衅的同事并没有成为他的好朋友——这里没有童话结局——但通过持续的教练，伊森茁壮成长。作为他的教练，我能够帮助他重新框架他关于苦涩的无助和受害者的故事。他在工作中找到了新的资源和盟友。他开发了一些实用的工具来应对这一困难局面。\n\
  \n“当你经历困难时期时，你内心的一部分并不理解一切都会好起来的，你会走过这一关，”伊森后来告诉我。“当我只想放弃时，很难让我继续前进。我过于专注于负面，根本没有为正面留下足够的空间。知道我可以控制自己的回应，并且我有理性的选择，这帮助我以不同的视角看待情况。我开始通过积极的镜头看待，而不是消极的末日悲观镜头。”\n\
  \n教练成功的根本在于帮助人们重新框架无成效心态的能力。作为教练，你首先要发现客户的心态，以及它是否准确。那种心态中有什么阻碍客户看到无限可能？这是你作为教练可以做出的最关键的发现，因为它决定了你此后所做的一切。除了心态之外，审视他们的成果也很重要，看看这些成果是否能为他们带来成功的回报。\n\
  \n### 实践：你的教练手册\n\n根据本章所学的内容，评估你自己的心态。在 1（低）到 10（高）的量表上，你的心态有多积极乐观？你在哪方面不足？你是命运或境遇的受害者，还是固守于无成效的叙事？你内心是否有成长、改进和改变叙事的能力？你能帮助他人发现他们自己的有效故事吗？作为领导者，你可以在哪些方面开始改善你和团队的心态？对照以下问题检查自己。\n\
  \n### 心态检查清单\n\n1. 你对自己是否有积极的内心想法和信息，并且出于良好的意图或动机？\n2. 你的行为是否诚实并且与你根深蒂固的动机、价值观和信念一致？\n\
  3. 你是否假设并寻找他人善意的意图？\n4. 你是否以真诚的关怀、尊重和互利的方式对待他人？\n5. 你如何抓住他人做得对的地方？\n6. 你将如何抽出时间与他人进行真诚开放的沟通？\n\

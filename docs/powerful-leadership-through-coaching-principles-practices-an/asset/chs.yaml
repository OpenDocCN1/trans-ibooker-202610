  \ 2017，第52页）。\n\n我的通用规则是：问完一个问题后，数到15。沉默令人不适，人们自然会想去填补它——但请确保填补它的人不是你！如果15秒后你还没有得到回答，那么你可以根据需要换个方式重新提问。\n\

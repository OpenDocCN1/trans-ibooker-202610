  \n辅导总是与情境有关。情况是怎样的？正在发生什么？辅导对话界定的主题和范围是什么？你可能知道自己为什么要与员工进行辅导对话，但员工是否也抱有同样的愿景和承诺？为了达成共识，以下辅导问题非常有助于厘清对话主题：\n\
  \n- “你对我们这次辅导对话的目的有什么理解？”\n- “我们今天想聚焦什么主题或问题？”\n- “我们为什么在这里？是什么议题、挑战或机遇让我们聚在一起？”\n\
  - “在我看来，我们聚在一起的目的如下……你怎么看？你是如何看待的？”\n- “你觉得我们今天最需要讨论的是什么？”\n\n## 规则 4：在当下保持勇气\n\n\
  > *不要害怕失败，而要害怕不去尝试。*\n> —罗伊·T. 贝内特（Roy T. Bennett），政治家和作家\n\n挑战一个人的观点、检验他们的假设，或鼓励不同的选择，可能有助于让他们走出舒适区。你的问题也许会打乱他们看待事物的方式，或他们所做的事、计划做的事。要勇敢。即使不知道问题会引出什么，也不要害怕提出尖锐的问题。\n\

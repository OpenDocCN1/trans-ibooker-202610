- "## Coaching the Organization\n\n- **Chapter 15:** Coaching the 7 Core Factors for\
  \ Organizational Change\n- **Chapter 16:** Coaching Across the Globe\n- **Chapter\
  \ 17:** Putting It All Together\n\n## Coaching the 7 Core Factors for Organizational\
  \ Change\n\n> 在我在 Frito Lay 和 PepsiCo 多年的领导生涯中，我发现与团队和文化建立信任是我能做到的、改善绩效的单一最伟大的事情。\n\
  > —Al Carey，前总裁，PepsiCo North America\n\n在本书的这一部分，我们超越了帮助个人改变，转向帮助整个领导团队和组织学习和调整，以便更好地服务客户、更好地在市场中竞争，并更好地服务其使命、愿景和在社会中的最终目的。\n\
  \n当然，没有人教练一个组织。你仍然在教练人，但现在我们谈论的是教练高级执行领导者和团队以及其他具有一般领导、管理和管理全球责任的人。\n\n作为一位在 35\
  \ 多个国家实践了大约三十年的教练从业者，我发现我最喜欢的工作是培养高级领导者和执行团队；帮助他们设定清晰的愿景、价值观、战略和目标，并为其组织配备对齐的角色和结构；并以一种为其执行团队带来简化的方式对他们进行教练。宝洁公司的\
  \ Arthur W. Jones 曾著名地表示，“所有组织都完美地对齐以获得它们所获得的结果。”诀窍在于将组织设计和对齐到想要的结果。执行教练可以在这种设计和对齐中发挥至关重要的作用。\n\
  \n组织教练为执行团队提供了获得方向、清晰度、专注度和对齐的机会。学习和改变\n\n\n与领导者共事始于战略层面，然后是运营层面，最终是团队和战术层面。这意味着教练辅导在各个层面都可能非常有用。我认为，高管和领导团队的一个关键角色是与人力资源或人才管理建立伙伴关系，帮助培养能够成为教练的内部领导者，从而在整个组织内建立教练文化。内部领导者兼教练可以帮助各地的个人和团队将愿景、价值观、战略和目标对齐并层层传递到每个业务单元和各级职能。\n\
  \n## 组织变革的7个核心要素\n\n所有组织的学习和变革都是动态的，需要时间来实施。它不会一夜之间发生，也不可能在一夜之间发生；它需要高层发起和持续的纪律，来遵循我所说的*组织变革的7个核心要素*。在与全球数千个组织（企业、政府、教育、非营利组织）合作后，我发现，如果领导者、发起人和内部教练完全投入这一过程，那么在任何层面、任何行业、任何文化中，教练领导者回答7个核心要素问题都能发挥良好作用。成功取决于密集的教练辅导和持续的跟进。这一过程不是简单的教学或培训。这是一个持续的可维持性过程，需要跟进、问责、认可、参与度检查和持续的教练辅导。\n\
  \n7个核心要素首先是战略层面，然后是运营层面，接着是战术和团队层面。我们将开始揭示并帮助设计和围绕以下组织教练领域进行对齐：\n\n- 1. “我们的组织为何存在？我们服务谁？”\n\
  - 2. “文化价值观、信念和规范是什么？”\n- 3. “我们组织在战略上走向何方？”\n- 4. “要实现的关键且专注的目标是什么？”\n- 5. “执行战略目标和目的的恰当角色、结构和流程是什么？”\n\
  - 6. “谁来执行我们的关键目标？我们是否让合适的人才坐上了正确的位置？”\n- 7. “如果目标达成，我们将如何奖励和认可我们的优秀人才？”\n\n每个高管团队、部门或业务单元以及一线团队都应接受教练辅导，以便清晰回答这些问题并保持一致。人们常说，简单的问题最难回答：它们可能具有挑战性、深刻、矛盾，有时甚至令人痛苦。但这7个核心问题将帮助组织中每个团队应对所有层面上关于清晰、专注、对齐和主人翁意识的相同挑战。\n\
  \n图15.1绘制了我几十年来与全球数百位CEO和数千个高管团队所采用的教练流程的设计和实施。这张图可以应用于任何组织的任何领导团队——无论是企业、政府、教育还是非营利组织。\n\
  \n## 用7个核心问题开展教练辅导\n\n### 1. 重新发现“为什么”——我们为何存在？我们服务谁？我们的使命、愿景和核心价值观是什么？\n\n> 所有组织都始于“为什么”，但只有伟大的组织年复一年地保持对其“为什么”的清晰认识。\n\
  > ——西蒙·斯涅克，英裔美国作家、励志演说家、组织顾问\n\n首先，从清晰定义你的“为什么”开始。这个组织或团队为什么存在？组织的共同目的和使命是什么？高效能组织明白自己的“为什么”——他们了解自己的客户和市场，并对理想的未来状态有令人信服的愿景。\n\
  \n以及信念。文化必须是一种尊重、重视多样性、包容、诚实、问责和透明的文化。人们还必须知道为什么以及如何服务他们的客户。管理预算、增加利润和增长收入对组织成功至关重要；然而，如果这些成果不是通过为客户带来积极、忠诚的体验而增加真实价值获得的，那么这种增长将不可持续。一位优秀的教练有助于定义清晰的战略方向，并使组织保持一致，以最重要的方式执行，从而为其关键客户提供显著的、独特的价值，并在短期和长期内保持可持续。\n\
  \n教练在帮助各级领导者、团队和人员围绕共同使命、目的、愿景和价值观建立意识方面能增加巨大价值，例如通过以下问题：\n\n- “你的组织和团队是否有清晰的使命和目的？”\n\
  - “使命声明是否张贴在每个人都能阅读和理解的地方？”\n- “你的使命和目的是否在所有层级共享？”\n- “组织中的每个人是否都理解你为何存在、你服务谁，以及你如何走向市场以最好地服务客户？”\n\
  - “你的团队是否理解它如何贡献，如何与整体组织使命和目的保持一致？”\n- “领导者/管理者如何帮助沟通和强化你的整体目的和使命？”\n\n### 2. 重新发现“何处”——我们将在哪里竞争？我们独特的竞争战略是什么？\n\
  \n> *伟大战略的精髓在于选择做什么和不做什么。*\n>\n> ——迈克尔·波特，哈佛商学院战略系主任\n\n“何处”关乎愿景和战略。伟大的组织和团队对未来五到十年有一个清晰而令人信服的愿景，描述未来成功的样子。他们还拥有竞争战略，并有明确的路径和计划，在一到五年的时间内在市场中占据主导、竞争并获胜。由于资源有限且需要聚焦，战略计划还明确了他们将选择不在哪里竞争。正如通用电气前董事长兼首席执行官杰克·韦尔奇提醒所有领导者的那样：“要么掌控自己的命运，要么被别人掌控”，以及“如果你没有竞争优势，就不要竞争。”\n\
  \n教练帮助领导者定义他们的独特性。他们发现如何创新，更清晰地将自己与竞争对手区分开来，并获得独特的竞争优势。这个组织做了什么别人没有做的事？它将如何有竞争力地服务市场和客户，并提供独特的产品、服务或技术？\n\
  \n教练可以通过提出以下问题来帮助定义清晰、共同愿景和未来成功的战略：\n\n- “你的组织和团队是否对未来5到10年的期望状态有清晰愿景？”\n- “你是否撰写了令人信服的愿景声明？”\n\
  - “你是否清楚自己将在哪里竞争、不在哪里竞争？”\n- “你的愿景和战略是否在所有层级共享？”\n- “你将如何帮助组织所有层级分享你的愿景和战略？”\n-\
  \ “你是否有一个严格、开放、透明的年度战略规划流程来审查愿景和战略？你是否要求人们按年度或季度持续负责规划、制定和调整战略？”\n\n### 3. 重新发现“什么”——我们狭隘聚焦且最重要的目标是什么？\n\
  \n> 你可以有很多目标。但有些目标比其他目标更重要——它们必须实现，否则其他一切都不重要。\n> ——吉姆·斯图尔特，前富兰克林柯维执行顾问\n\n“什么”是指你将要实现那些明确定义的目标。绩效目标划定了一条清晰的界限：这就是你的个人、团队和整个组织必须实现的目标，否则其他一切都不重要。实现目标的路径始于设定可实现且重点集中的延伸目标。这些目标必须可影响、重点集中、具体且可衡量。目标必须采用SMART格式声明：具体、可衡量、可行动、现实且有时限。如果没有清晰的衡量标准和明确的时间框架告诉你何时成功，执行是不可能的。\n\
  \n所有高绩效组织、团队和个人都拥有共同的绩效目标，包括目的和明确的成功衡量标准。关键是由那些有权力和被授权执行目标的人，将这些目标与清晰、可衡量的目的对齐。\n\
  \n教练可以帮助质疑和定义绩效预期、卓越标准和目标达成。提出以下问题以帮助明确目标和达成一致：\n\n- “你在此时间段内的组织目标是否与整体愿景、使命和战略一致？”\n\
  - “你的组织目标是否现实、具体且可衡量？”\n- “你必须实现的最重要或战略目标是什么？”\n- “你是否已将这些目标缩小到一、两个或至多三个可以卓越实现的目标？”\n\
  - “这些组织目标是否得到广泛共享和支持，并有明确的商业理由说明其最为重要？”\n- “它们是否令人信服且具有激励性？”\n- “这些目标是否有一个清晰、客观且有效的滞后成功衡量指标，可以每月准确测量和跟踪？”\n\
  - “它们是否可实现？”\n- “你是否定义了正确的结构和角色来执行这些目标？”\n- “团队对这些目标是否有至少80%的影响力？”\n\n### 4. 重新发现“如何”——我们将如何执行关键目标？哪些关键每周行动能推动我们的目标走向成功？\n\
  \n> 不要告诉人们怎么做；告诉他们做什么，让他们用结果给你惊喜。\n> ——乔治·S·巴顿，美国陆军上将\n\n“如何”也关乎你所信奉的价值观。执行不仅仅关乎达成目标：它关乎尊重、协作、支持\n\
  \n\n团队内部以及跨组织与其它团队之间的沟通。组织的共同价值观是什么？目标常常未能实现，并不是因为人们不了解自己的工作，而是因为他们不知道如何合作、如何成为优秀的队友。此外，“如何做”是否也包括帮助员工自我发展？他们是否会变得更熟练、更有能力，并创造一个持续改进的环境？\n\
  \n“如何做”指的是流程以及你为实现目标所遵循的每周行动。一旦目标确定，执行力就取决于采取正确的行动、授权员工尝试，并定期且频繁地跟进以了解哪些方法有效。团队决定遵循哪些方法，并至少每周甚至每天相互检查，以帮助跟踪成功进度。我说“每周或每天”，是因为那些一周以上才回顾一次的目标，往往会在日常工作的紧迫性中迷失。如果一个人或一个团队只关注每月发生一两次的行动，那么要想推动月度目标或指标就太晚了。团队和个人成员需要每周乃至每天的行动频率，才能主动推动目标向前推进直至完成。\n\
  \n教练可以通过强化每周或每日的行动步骤流程，以及维持有效目标达成文化所需的正确价值观来帮助执行。教练可以提出以下问题，以帮助校准能够推动目标达成的正确每周行动：\n\
  \n- “你的组织和团队是否有明确的核心价值观？”\n- “组织的核心价值观和信念是什么？”\n- “组织各层级是否都清楚理解并共同认同这些核心价值观？”\n\
  - “你实现目标的方式是否正在构建一种高信任、协作、相互尊重的文化？”\n- “要实现你最具战略意义的目标——那些必须以卓越方式完成的最少数量的目标——需要付出什么？”\n\
  - “你将以怎样的行动步骤流程让每个团队和个人都与那几个关键目标保持一致？团队能否每周至少对这些行动产生80%的影响？”\n- “团队成员或团队必须每周或每天始终如一地执行哪些行动？”\n\
  - “你的绩效评估是否涉及关键目标的绩效结果？”\n- “工作绩效和职业发展是否与整体人才和绩效管理流程挂钩？”\n- “你如何帮助改进整体基于绩效的文化和高信任的目标执行流程？”\n\
  - “你是否通过践行价值观来系统地审视自己的表现？”\n- “核心价值观是否与明确界定的行为规范和操守标准相关联？”\n- “作为组织，你们如何在践行价值观的同时实现绩效成果，从而获得改进？”\n\
  \n## 5. 重新发现“何时”——目标执行：正确的角色、结构和流程\n\n> *做事的紧迫感给我留下了深刻印象。仅仅知道是不够的，我们必须去应用；仅仅愿意是不够的，我们必须去行动。*\n\
  > \n> ——列奥纳多·达·芬奇，意大利画家、发明家、科学家、雕塑家、音乐家和作家\n\n“何时”关乎执行目标所需的时间框架。它关乎团队共同的绩效和责任感。它关乎团队多久回顾一次记分牌并公开沟通一次，判断自己是在赢还是在输，并确定通向成功的正确行动。是否有每周的责任会议？是否有固定的时间聚在一起讨论事情进展如何、从成功和失败中学习，并营造一种参与和责任的文化？如果有，是在“何时”？\n\
  \n我在哥伦比亚大学研究生院的教授维多利亚·马西克博士是成人学习、培训和行动学习领域的世界级顾问和实践者。她常说：“当你花时间反思行动、审视绩效、质疑潜在假设，并让团队提出关于如何变得更好的问题时，绩效将显著提升。”团队和个人的责任感对于学习敏捷性、创新、最佳实践分享和持续改进至关重要。\n\
  \n教练可以提供很好的见解，帮助强化正确的行动和行为、绩效管理流程、人才发展、人才晋升、反馈和认可。提出以下问题，以帮助推动正确的人才发展角色、职责和结构：\n\
  \n- “你的组织是否支持正式的绩效管理体系，以改善人才和员工发展？”\n- “所有领导者是否都具备与个人和团队进行有效绩效辅导对话所需的技能和流程？”\n-\
  \ “绩效管理流程是否能有效评估和改进绩效、价值观和发展？”\n- “绩效管理流程如何有效帮助发展团队成员的知识、技能、能力和积极性？”\n- “绩效管理流程如何推动正确、可接受的行为和价值观？”\n\
  - “信息如何在组织各层级频繁沟通并最有效地共享？”\n- “你和你团队成员如何每周互相督促绩效目标和指标？”\n- “你的团队如何每周联系并有效沟通？什么方式最有效？什么方式最无效？”\n\
  - “领导和管理者如何帮助改进整体人才和绩效管理流程？”\n\n## 6. 重新发现“谁”——你的人才：识别合适的人，安排在合适的岗位上\n\n> *如果你选对了人，并给他们展翅高飞的机会，那么你几乎不需要管理他们。*\n\
  > ——杰克·韦尔奇，通用电气前董事长兼首席执行官\n\n“谁”关乎你的人才和领导者。谁承担什么角色和职责？每个团队都必须有一位负责任的领导者，由拥有共同目标并因实现目标而获得奖励的团队成员支持。教练可以帮助明确定义“谁”：谁负责完成工作？谁负责支持团队？谁能提供所需资源？谁能清除障碍？谁又能调动取得卓越绩效和成果所需的力量？\n\
  \n教练可以通过提问来强化所有团队成员清晰的人才发展角色和职责：\n\n- “你的组织是否有清晰的组织架构图，明确定义所有角色和职责？”\n- “团队中需要哪些角色和职责才能最有效？”\n\
  - “你目前清楚自己的角色和职责吗？”\n- “团队人才的结构是否能让他们最好地发挥独特的优势、天赋和才能？”\n- “所有个人贡献者和团队成员是否都因其以发挥并最大化优势、天赋和才能的方式行事而获得认可和奖励？”\n\
  - “领导者如何帮助改进其员工和团队的角色、职责和优势？”\n\n## 7. 重新发现动力——识别和奖励人才\n\n> *你来到世间不仅仅是为了谋生。你来到世间是为了让世界更富足，拥有更远大的视野，以更美好的希望和成就精神。你来到世间是为了丰富世界，如果你忘了这使命，就是在使自己贫乏。*\n\
  > ——伍德罗·威尔逊，美国前总统、政治家、律师、政治人物、普林斯顿大学校长\n\n心理学家兼哲学家威廉·詹姆斯曾说：“人性中最深层的渴望是感觉到被欣赏和被重视。”每个组织和团队都应该奖励和认可卓越的绩效（“什么”）和价值观（“如何做”）。这两者对于持续成功都至关重要。\n\
  \n花时间辅导你的团队成员，表明你重视他们。辅导能帮助人们更了解自己并表现得更好，同时也传递出一个信号：组织关心他们，并愿意投资于他们。\n\n\n\n\n准确、客观且可观察，而非针对个人。所有辅导都是为了帮助人们进步、学习和前行，而不是让人难堪或受到惩罚。在给予反馈时，确保每一次互动都有一个圆满的结局——保持尊重、提供帮助，而不是造成伤害。\n\
  \n业务绩效与价值观遵循应得到同等的评估、权衡和奖励。持续给予反馈并纠正方向，确保你正在构建一种积极、激励、信任且安全的文化。作为教练，你的角色是激发人们积极的情感，让他们投入地实现正确目标，并以正确的方式完成它。\n\
  \n最后，确保团队成员明白，积极的反馈、认可和奖励都是为了实现整体大局。组织获胜，团队也随之获胜，个人同样如此。\n\n对组织进行辅导有助于将奖励和认可与绩效标准对齐。关键是如何从标准表现迈向突破性表现。提出以下问题，以帮助奖励和识别人才：\n\
  \n- “你是否已成功地将奖励和认可激励与所有人对齐，以推动正确的绩效目标及正确的价值观和行为？”\n- “你的绩效评估流程是否有助于推动正确的行为、价值观和绩效目标？”\n\
  - “绩效评估流程是否有效地将薪酬与认可联系起来，以推动正确的战略、目标和文化？”\n- “你是否觉得现有的奖励和认可正在推动正确类型的行为和结果？”\n- “你能做些什么来更好地对齐绩效（“做什么”）和价值观（“怎么做”）？”\n\
  - “你是否以公平公正的方式在所有团队和部门中开展绩效管理评审和奖励？你是否奖励并认可顶尖表现？”\n- “通过薪酬、认可和奖励，你如何更好地对齐并赋能员工，使他们取得正确的结果，并树立正确的文化和价值观？”\n\
  \n每个团队和组织都可以通过深入思考这 7 个核心因素的问题，大幅提升绩效和结果。对这七个问题的审视不应只是一年一两次。它们也不应只是打印出来或展示在公司墙上的匾牌上。人们需要进行持续、动态、实时的教练式对话，并提供反馈，以不断强化并与这些关键问题的答案保持对齐。否则，随着时间的推移，组织将开始偏离方向、失去参与感，并变得士气低落。\n\
  \n## 实践：你的教练战术手册\n\n领导者兼教练必须花时间与组织各个层级的其他领导者、管理人员和员工进行交流，共同探索这些问题。如果可能，请记住先从高层或战略层面开始，然后到业务单元或运营层面，再到战术或团队层级，以便在组织的每个层级设计清晰的、聚焦的、对齐的和可问责的目标：\n\
  \n- 1. 为什么：“我们为什么存在？我们服务谁？我们的使命、愿景和价值观是什么？”\n- 2. 在哪里：“我们将在哪里竞争？我们独特且具竞争力的战略是什么？”“我们的路径和计划是什么？”\n\
  - 3. 做什么：“我们至关重要的、最聚焦的目标是什么？”\n- 4. 怎么做：“我们如何执行正确的行动和行为？”\n- 5. 何时：“我们以卓越水平实现目标的时间表是什么？”\n\
  - 6. 谁：“谁是合适的人选？他们是否坐在合适的位子上？”\n- 7. 系统：“我们如何认可、奖励和培养人才？”\n\n结合这 7 个核心因素，问自己：\n\n\
  - 1. 我们的组织可以在哪些方面获得更好的聚焦和对齐？\n- 2. 我们在哪些方面已经很好地对齐、投入并获得了认同？\n- 3. 我们在哪些方面是清晰、聚焦且一致的？\n\
  - 4. 我们在哪些方面不清晰、不聚焦且不一致？\n- 5. 我们在哪些方面需要更好的支持、参与和帮助？\n- 6. 我们可以在哪些方面提供更好的教练支持并强化问责？\n"
- "## 全球范围内的教练式辅导\n\n> 我们实现多样中求统一的能力，将成为我们文明的美丽之处，也是对我们文明的考验。\n> ——圣雄甘地，印度律师、政治家、作家和社会活动家\n\
  \n1987 年，我前往英国伦敦，参加了杨百翰大学伦敦国际研究中心为期两个学期的海外学习项目。那是一次绝佳的学习机会。在那短短几个月里，我有机会学习国际商业、政治、历史、文化、艺术和音乐，当然，还看了很多戏剧和交响乐，吃了许多对我来说新奇的食物。\n\
  \n这段跨文化经历改变了我。我原本计划主修商业营销，但回国后立刻转到了国际关系与商业专业。\n\n伦敦之行后，我深切地渴望与世界各地多元而精彩的人们交流。毕业后，我回到欧洲三个月，游历了斯堪的纳维亚、东欧和西欧、以色列和埃及。所遇文明的多样性令人振奋和欣喜。\n\
  \n此外，在科维领导力机构工作八年后，杨百翰大学肯尼迪国际研究中心为我提供了一份为期一年的教学教授职位，授课地点是中国广州的华南理工大学。我之前的大部分旅行都在欧洲和美洲。现在，一个全新的亚洲世界向我敞开。当我与那里聪明的大学生共事时，我深深陶醉于亚洲的历史、人文、文化和美食。我还有机会设计、授课并辅导高潜力领导者长达一年，项目是我在广州的耐克公司为中国高潜力管理项目开发的。\n\
  \n在耐克担任外部顾问期间，我接触到了著名心理学家吉尔特·霍夫斯泰德博士的研究成果。他曾任职于 IBM，并在马斯特里赫特大学担任人类学与国际管理教授。\n\n\
  我发现霍夫斯泰德的框架对跨文化辅导非常有用，从中国领导者开始，随后延伸到欧洲、澳大利亚、新西兰，再回到美国。后来，在哥伦比亚大学期间，我在联合国纽约总部的研究生实习中教授冲突解决和调解课程时，成功地将霍夫斯泰德的理论融入其中。我最喜欢的一句话，是我妻子辛西娅在我从哥伦比亚大学毕业并完成联合国工作时送给我的。这句话出自参议员威廉·富布赖特：“我们生活在一个多元的世界。国际教育合理而现实的目标既不是皈依也不是灌输，而是鼓励不同文化间的共情与理解。”在我的整个学术和职业生涯中，我一直在\
  \ 35 个以上的国家（并且还在增加）学习并实践如何在多元文化世界中有效领导、工作和辅导。\n\n## 教练式辅导与全球多样性\n\n> *如果我们现在无法消除分歧，至少我们可以帮助世界走向多元共存的安全之地。*\n\
  > ——约翰·F·肯尼迪，美国前总统\n\n组织正在认识到，不仅劳动力日益多元化，市场、客户和利益相关者也在多元化。在全球经济日益一体化的今天，各国之间仍存在持续的文化差异，没有任何一种普适的管理方法可以在所有地方都有效。对于任何从事国际商业和全球贸易的公司而言，理解并善用文化多样性至关重要。即使只在本土或国内经营的公司，也能从理解全球多元化市场的细微差别中受益。\n\
  \n我满怀希望，我们不会回到孤立、恐惧和保护主义的旧时代。前方只有令人兴奋的、全新的多元化\n\n\n\nand innovative frontiers ahead.\
  \ I like to say that with an increase in globalization, the world of work is becoming\
  \ smaller and smaller. With international trade and global outsourcing, as well\
  \ as advances in technology, communication, and travel, the world is truly open\
  \ for business 24 hours a day every day of the year.\n\nThis reality means the competition\
  \ to attract, retain, and engage global talent has never been more intense and competitive.\
  \ There is a war for recruiting, developing, leveraging, and keeping the best talent.\
  \ Thus, it makes sense that organizations are embracing global diversity and inclusion\
  \ not only in trade and commerce but also in leveraging a diverse talent pool.\n\
  \nCan you coach people to adopt a global mindset? Can you effectively engage a diverse,\
  \ multicultural talent pool? Do you possess global self-awareness? Do you value\
  \ diversity and inclusion? Hopefully, you can say yes to each of these questions.\
  \ If not, keep open and practicing.\n\nLeaders who understand the significance of\
  \ these skills can connect more effectively with others, understand and respect\
  \ different worldviews, and improve learning, innovation, collaboration, and results.\
  \ Coaches who demonstrate cross-cultural intelligence can build trust and rapport\
  \ with others far more quickly and easily than those who ignore cross-cultural issues\
  \ and the unconscious bias that exists within all people.\n\nHowever, engaging diversity\
  \ is not simple. Like an iceberg, the elements of culture are often both visible\
  \ and invisible. Figure 16.1 displays both sides of culture and diversity.\n\nWhile\
  \ race, gender, work style, language, and behavioral norms are easy enough to see\
  \ on the surface, coaches must be aware of the many attitudes that are not so perceptible.\
  \ Religious values, national sensitivities, life experiences, orientation, and diverse\
  \ attitudes and perceptions toward life need careful study and empathy, which are\
  \ less visible beneath the surface.\n\nTherefore, managing global diversity requires\
  \ a long-term commitment to coaching about handling differences across cultures.\
  \ Business issues such as strategy, goals, values, leadership philosophy, and talent\
  \ management can present minefields. Diversity touches nearly everything: recruitment,\
  \ development, business transactions, partnerships, and relationships.\n\nOne example\
  \ of a successful diversity and inclusion initiative with coaching at its heart\
  \ is GlaxoSmithKline’s (GSK) Accelerating Difference program. The aim of the diversity\
  \ and inclusion program is to promote more women to senior levels within the organization\
  \ through coaching, mentorship, and open dialogue. Approximately 46% of 2013 participants\
  \ have been promoted by at least one level, compared to 26% of women and 27% of\
  \ men at the same grades across the organization.\n\nParticipants were also 76%\
  \ more likely to stay at the organization, and they improved in manager effectiveness\
  \ and overall engagement scores more than three times faster than the control group.\
  \ This is just one of many examples of how coaching for diversity can support professional\
  \ growth, organizational development, and overall success of the enterprise.\n\n\
  ## The Diversity Iceberg\n\nIt's what we see AND cannot see\n\n![](img/3b9ba4a318234a9c4d131f84093751e0_249_0.png)\n\
  \nValuing differences and inclusion is about engaging all employees to be the best\
  \ they can be!\n\n## Figure 16.1 Understanding culture and diversity\n\n## Recognizing\
  \ Cultural Diversity\n\n> It is never too late to give up your prejudices.\n> —Henry\
  \ David Thoreau, American essayist, poet, and philosopher\n\nI felt the world getting\
  \ much smaller when I taught an executive leadership development course at an offsite\
  \ retreat in Denmark that included global leaders from Europe and Asia. I was able\
  \ to coach several of them on their 360-degree feedback and help co-create action\
  \ plans to be more effective and build trust across cultures. One leader I coached\
  \ was from Denmark and was a key operations leader with an international retail\
  \ firm. Responsible for global operations, he often visited his colleagues at manufacturing\
  \ plants in Thailand. While there, he met with the local leaders, managers, and\
  \ team members, fielding issues such as poor on-time delivery of products, operating\
  \ process breakdowns, and quality and cost issues.\n\nWhile coaching the leader\
  \ in Denmark, I became aware that his strong, direct leadership style was based\
  \ on individualism, being honest and direct, supporting low power distance to challenge\
  \ ideas from everywhere, a value for equality of both masculinity and femininity,\
  \ and a high level of certainty and value for risk. When this great Danish leader\
  \ was working with his colleagues in Thailand, he confided in me, “I am stepping\
  \ on cultural land mines everywhere! They don’t get me, and I don’t get them. It’s\
  \ like communicating with strangers! It is very frustrating because I think we have\
  \ agreement when I am open, direct, and transparent on their operational issues.\
  \ I am sharing facts openly and publically with the entire team. I could not be\
  \ more honest and transparent about our issues. But then nothing ever seems to change.”\
  \ This manager was clearly struggling with his cross-cultural awareness. He had\
  \ failed to adapt his communication and management style to a different culture\
  \ in Asia.\n\nThe Asian culture of his colleagues tended to value collectivism and\
  \ teamwork, high power distance and respect for the leader, indirect communication\
  \ in which they would “save face” and not embarrass a leader in front of the leader’s\
  \ people, and uncertainty avoidance where risk was low, decisions took consensus\
  \ and group input, and final decisions came from authority at the top. Their approach\
  \ to leadership was radically different from his. His colleagues in Thailand were\
  \ loyal and protective of each other, and they considered his factual, open, direct\
  \ communication to be rude and somewhat arrogant and insensitive—particularly when\
  \ he seemed harsh and judgmental in front of the entire team.\n\nThe results were\
  \ awful. The company went through four CEOs in four years. It lost 25% of its market\
  \ share in two years. It did not have a clear vision or strategy for growth. There\
  \ was no transparency or integrity, and\n\n## Coaching Across the Globe\n\na complete\
  \ inability to communicate about how to get better. Essentially, there was a toxic\
  \ relationship between Denmark and Thailand, with suspicion, mistrust, and plenty\
  \ of blame to go around. It was very unhealthy.\n\nMy coaching client wanted a healthy\
  \ company with a healthy, trusting, two-way relationship between the two global\
  \ offices, so he needed a new plan.\n\nWe discussed the research on cultural diversity\
  \ from Geert Hofstede. We talked about the differences between a Judger and a Learner\
  \ mindset, and the choice to change even if it meant leaving some old ways behind.\
  \ He realized that he needed to support his colleagues and to stop diminishing and\
  \ judging them harshly in public settings. In our conversations, he outlined four\
  \ key goals to try to build cross-cultural trust and to turn things around:\n\n\
  - 1. Show better loyalty and respect for his Thailand leader and team.\n- 2. Clarify\
  \ his intent and take the time to listen better first, clarify issues, and express\
  \ support with affirmation and loyalty to the leader and team.\n- 3. Allow his Thailand\
  \ leader to “save face” and share difficult data in a respectful, indirect, and\
  \ open way, even using confidential one-on-one communications with the leader to\
  \ get his buy-in, support, and respect for the process of desired changes. After\
  \ sharing the data, he could offer resources and support to improve the processes\
  \ and communication breakdowns. He began to look for ways to lead and engage his\
  \ Asian counterparts without a spirit of guilt, blame, judgment, and defensiveness.\n\
  - 4. Leave each conversation by clarifying what was expected, what everyone had\
  \ agreed to, and how each side would be accountable to improve and get better over\
  \ time.\n\n## Coaching Across Diverse Cultures\n\n> *When we’re talking about diversity,\
  \ it’s not a box to check. It is a reality that should be deeply felt and held and\
  \ valued by all of us.*\n> \n> —Ava DuVernay, American filmmaker and film distributor\n\
  \nBusiness today is often global, and success requires self-awareness and cross-cultural\
  \ intelligence regarding the nuances of diverse cultural\n\n\n价值观、行为与习俗，这要求人们在适应这些差异时具备更高的学习敏捷性和个人责任感。每个组织都有独特的文化，正如每个民族国家都有多元的文化。吉尔特·霍夫斯泰德（Geert\
  \ Hofstede）在长达三十多年的时间里，对53种文化和20种语言中的文化维度进行了研究，考察了全球的规范、价值观和商业风格，并提出了五个关键要素及相关问题，能够帮助任何领导者-教练在几乎任何全球情境中有效工作并从容应对。回答这些问题，可以极大地提高任何领导者-教练的跨文化智力和效能。以下即霍夫斯泰德定义的跨文化差异五个关键维度。\n\
  \n## 1. 权力距离：低权力距离与高权力距离\n\n这一维度指的是，社会或文化中的人们对彼此之间在权力、地位、级别、职务或领导层级/职位差异上的接受程度。高权力距离型的领导和管理风格是自上而下的，审批和决策的正式层级更多。例如，高权力距离社会中的人往往更等级森严、更专制，并表现出自上而下的独裁控制。在低权力距离社会中，人们强烈偏好扁平化的组织结构，拥有更信任、开放、透明的沟通；鼓励开放的向上反馈、角色平等，并在所有组织层级鼓励参与式决策和授权。\n\
  \n根据霍夫斯泰德的观点，如果你正在与来自高权力距离文化（如东南亚、日本、中国、印度、中东、俄罗斯或东欧）的人互动，对方很可能更愿意处在层级之中，被指挥、被命令，并在任务中得到引导。这类人可能倾向于：\n\
  \n- 在会议上不太愿意提问或向上级直接反馈，尤其当资深成员在场时\n- 表达不同意见时更委婉或间接\n- 尊重权威，不太愿意在公开场合辩论问题\n- 希望某些事情被回避、不予言明\n\
  \n另一方面，低权力距离组织存在于更扁平、更赋权、层级更少的结构中（如美国、加拿大、英国、斯堪的纳维亚和澳大利亚）。授权和赋权是人们期待的；当一项决策影响到所有人时，他们很可能有机会提供意见和反馈。这些人往往：\n\
  \n- 在提问、批评观点或向他人提供坦诚的向上反馈时更直言不讳、更直接\n- 表达不同意见时更不委婉，更开放、透明\n- 更愿意在会议中直接公开地辩论问题\n\
  - 更直接、更迅速地切入要点\n\n*关键教练提问：* 这个社会或组织倾向于拥有高权力距离还是低权力距离的文化、行为和沟通风格？\n\n## 2. 个人主义与集体主义\n\
  \n个人主义指一种高度重视个人自由、个人表达和个人利益的社会结构和文化。集体主义文化则更关注集体社会、群体或团队的需求和利益。\n\n例如，在高度个人主义文化中，人们往往关注个人需求、成功、个人成就感、个人权利和自由、自主、愉悦和福祉。“我”比“我们”或群体更重要（如美国、加拿大、英国、斯堪的纳维亚和澳大利亚）。\n\
  \n相比之下，集体主义关注的是人们所属的群体；社会、群体或团队的利益和成功比满足个人权利和需求更重要。整体国家或组织利益往往超过任何个人需求和关切。然而，在集体主义思维下，国家和组织必须设法照顾个人需求；个人的义务则是尊重整个社会或群体成员身份。在集体主义社会（如俄罗斯、东欧、中国、东南亚、印度和中东），人们彼此非常忠诚，更具公共性、社会主义式、关怀性，并为彼此负责。在这种文化中，个人往往：\n\
  \n- 在采取行动前需要更多来自他人的意见\n- 将个人权利置于国家或政府之下\n- 较少发表个人意见，在表达不同意见时更加谨慎\n- 更欣赏和尊重社会、组织或民族国家中的礼仪规范\n\
  \n这一要素在商业中表现为何？在高度个人主义文化中，个人成就受到鼓励。努力工作会获得个人奖励，个人生产力很高，个人想法受到鼓励并被透明地公开分享。如果你在高度集体主义文化中做生意，层级、和谐、尊重和平等至关重要。任何会破坏和谐与尊重的想法都会受到压制。在公开场合给予直接或负面的反馈是非常无礼和不当的；个人和群体都被期望表现出毫无保留的忠诚。\n\
  \n*关键教练提问：* 这种文化或组织是更倾向于个人主义，还是更倾向于支持集体观点和行为，以实现社会、组织和群体成功的更大利益？\n\n## 3. 男性气质与女性气质\n\
  \n这一维度指的是，文化在多大程度上建立在强调男性特质和女性特质的价值观之上。在男性导向的社会中，男性和女性的角色很少重叠；性别角色被明确区分。男性化文化旨在让男性领导、女性跟随：人们崇敬男性的成就和建树。他们重视男性的独立、进取、支配和果断。女性往往获得较低的报酬，并从事较低层级的支持性角色和工作。\n\
  \n如果你在高度男性化的国家或文化中做生意，你需要认识到性别、头衔、自我、权力、地位和金钱比其他考虑更重要。男性导向社会的例子包括拉丁美洲和南美洲、东南亚、中国、印度、中东、俄罗斯和东欧国家。\n\
  \n玻璃天花板。男性和女性都不被视为比对方更优秀，而是被视为在能力、技能和经验上平等。两性都因其工作而得到认可，并在工作场所和社会中被接纳。重点不在于强势果断，而在于合作、平等和建立良好关系。女性导向社会的例子包括美国、加拿大、英国、斯堪的纳维亚、西欧和澳大利亚。\n\
  \n如果你在高度女性化的文化中开展业务，你需要明白：关系很重要，人人平等很重要；成功往往通过共情倾听、相互理解和尊重、协商与合作来实现。此外，重视并促进灵活性也很重要，同时强调工作与生活的平衡以及对性别差异的包容。\n\
  \n*关键教练提问：* 这种文化如何看待男性和女性的角色？这种文化或组织是否倾向于存在男性主导、好斗和男性支配的特征与行为？还是这种文化或组织在薪酬、角色责任、职业发展与晋升机会、决策机会和社会地位方面平等重视男女？在一种更协作、公平和共情的文化中，男性和女性角色之间是否有大量重叠？\n\
  \n## 4. 决策能力：确定性规避（高风险）与不确定性规避（低风险）\n\n这一要素指的是，文化在多大程度上愿意做出或安心于做出需要承担风险的绝对的或确定的决策。无论哪种情况，生活都是不确定的，充满风险和不可预测的事件。\n\
  \n确定性规避（即接受风险）更注重信任、舒适，以及较低程度的结构和控制。生活本就是要冒险；容忍和重视差异至关重要；冲突可以被建设性地管理；规则和法律应尽可能少。这些国家和文化往往更愿意拥抱风险，更放松、悠闲、灵活、适应性强，并对想法和变化持开放态度。他们偏好快速决策和快速结果，非常重视灵活性和主动性。他们更看重速度而非周密。他们的座右铭也许是：放轻松，一天一天来。\n\
  \n\n\n\n在不确定性规避文化中做生意时，可以预期看到整体的开放性；信任的延伸；以及对创新、失败、纠偏和上市速度的渴望。在这种文化中，过多的结构是不受欢迎的，头衔的重要性不如适应新情况和新环境的能力。不确定性规避国家包括：美国、英国、印度、中国和新加坡。\n\
  \n不确定性规避文化（风险低且不被容忍）更以恐惧为基础且倾向于微观管理。生活被视为危险、不确定，充满必须在外部和内部加以控制的风险。这些文化寻求可预测的结果和对未来的控制。它们在背景调查、政策、规则和研究上花费大量时间。它们在开始项目之前建立适当的程序。它们更重视彻底性而非速度。这种文化对成文的法律、规则和法规、大量政策和程序、以及高问责和监督感到更舒适；并且对结构、问责措施以及减少不确定性和风险所需的负面后果和威胁有很高的需求。这种社会中的稳定来自大量的保障、问责和监督。不确定性规避国家包括意大利、韩国、墨西哥、比利时和俄罗斯。\n\
  \n在不确定性规避文化中做生意意味着对期望、角色和责任要清晰、直接和简洁。还有许多文化结构、政策和规则必须遵守。\n\n关键教练问题：这种文化或组织如何看待其对失败、错误、未知或承担计算风险的舒适度或容忍度？这种文化是否基于对未知的恐惧而规避风险？这种文化是否乐于承担计算风险和潜在失败？这是一个高度参与的信任、创新、协作、合作、开放和透明的文化吗？\n\
  \n## 5. 长期与短期导向\n\n本节指的是文化或社会在多大程度上强调长期未来并重视节俭、节俭和坚持。长期导向会寻找渐进式改进和牢固的关系，而非突破，因此他们舒适地保持耐心，决策缓慢。这种文化风格希望保持谦逊，使用更间接的沟通，并希望学习\n\
  \n- 经验、跨文化交流、提高意识培训和包容性\n- 2. 关于全球和多元文化意识、多样性和包容性以及无意识偏见的持续培训\n- 3. 促进导师制、赞助以及多元化群体与关键高级领导者的接触，并提供晋升机会\n\
  - 4. 提供领导力发展、教练和指导，让高级管理人员参与\n- 5. 提供多元化团体以促进社交网络并发展专业社区，例如：女性团体、西班牙裔团体、非裔美国人团体、LGBTQ-plus\
  \ 团体以及各种族裔和宗教团体。\n- 6. 提供同工同酬和晋升机会，并提供全球工作轮换和跨文化工作分配\n- 7. 鼓励突破或对行动的补偿）。\n\n我们的行为起源于前额叶皮层，大脑中相对较新的部分。但要使行为成为习惯，它需要进入基底神经节，即大脑中最古老的部分，位于颅骨中心附近。基底神经节不需要思考或决策；我们的习惯在这里变得自动。意识决策发生在前额叶皮层。要到达基底神经节，在那里我们出于自然习惯而行动，我们需要依靠（线索）情感触发和（奖励）强化或补偿。线索可能是一种仪式、一天中的某个时间、一个地点、其他人的存在，或情感联系。奖励是对习惯的情感或身体补偿。\n\
  \n如果听起来太困难，杜希格希望通过提醒你来激励你，你每天不假思索地做的事情曾经并不常见。大约 100 年前，没有人（也许除了上层阶级）刷牙——直到一家牙膏公司的老板决定让刷牙成为一种习惯。怎么做到的？通过创造线索、仪式和奖励。\n\
  \n线索是让人们对牙齿上的那层膜感到不舒服，通过广告宣传这种膜是不好的东西。例行程序是每天刷牙。但奖励呢？什么奖励会让人们回来寻求更多？令人惊讶的是，这并不是健康的牙齿或更白的牙齿。而是那种清凉、清新的薄荷味感觉！\n\
  \n早在 1915 年，佩斯登在牙膏中添加了使口腔发麻的成分。人们对这种感觉上瘾了！这种刺痛感是一种很好的奖励，并与清洁感联系在一起。杜希格报道，在佩斯登新广告活动开始后的五年内，美国有一半的人每天刷牙。这就是习惯行为改变背后的大脑科学。\n\
  \n如果你想养成习惯，你需要确定要采用什么线索和奖励。这对教练来说是一个重要原则。杜希格解释说：“好的管理者理解习惯的重要性，并会思考它。坏的管理者假装组织习惯不存在。因此，当习惯出现时，它们最终会变得扭曲或有毒。”\n\
  \n如果你想让习惯坚持下去，选择你的线索，选择你的行为，选择你的奖励。\n\n## 实践：你的教练手册\n\n在本书大多数章节的末尾，你会找到一个名为“实践：你的教练手册”的活动。在体育界，手册是教练的工具，其中包含战术，即针对不同情况的策略和行动计划。这些活动是为了帮助你在每章中应用所学内容。\n\
  \n为了方便你，以下是整个手册。如果你通过手册工作，选择可以成为你习惯的战术，你将成为他人的有效教练。而且你将在此过程中改变自己！\n\n## 实践：你的教练手册：辛普森\
  \ 3DS 教练模型：教练的“怎么做”\n\n考虑一下你团队或组织中出现的一个挑战问题。单独或与团队一起，花时间练习以下教练阶段及其相关的有力教练问题：\n\n\
  - 1. 诊断：教练议程是什么？\n- 2. 设计：什么最重要？\n- 3. 交付：将采取哪些行动？\n\n\n\n\n\n## 实践：你的教练手册：由内而外的教练\n\
  \n根据你在本章所学的内容，给自己的心态打分。从1分（低）到10分（高），你的心态有多积极和乐观？你在哪些方面有所欠缺？你是命运或环境的受害者，还是困在一种无效的叙事中？你内心是否具备成长、改进并改变自己叙事的能力？你能帮助他人发现他们自己有效的故事吗？作为领导者，你可以从哪些方面开始改善自己的心态和团队的心态？请对照以下问题进行自我检查。\n\
  \n### 心态检查清单\n\n- 1. 你是否对自己怀有积极的内心想法和自我对话，且带有良好的意图或动机？\n- 2. 你是否本着正直诚信行事，并与自己最深层的动机、价值观和信念保持一致？\n\
  - 3. 你是否会假定并寻找他人行为中的善意？\n- 4. 你是否以真诚的关心、尊重和互利的方式对待他人？\n- 5. 你能如何发现他人做对了什么事情？\n-\
  \ 6. 你将如何腾出时间，以坦诚开放的沟通与他人建立联系？\n- 7. 你将如何积极倾听、表示尊重，并充分理解他人的观点？\n\n## 实践：你的教练手册：以富足心态进行教练\n\
  \n当你寻求以更富足的方式教练他人时，可以使用以下关于富足的问题，来帮助你构建持续的教练对话：\n\n- 1. “在你看来，有哪些人以富足、双赢的方式行事，是你的绝佳榜样？”\n\
  - 2. “以富足的心态生活和领导他人，有哪些关键益处？”\n- 3. “你可以选择在哪些方面让自己的个人生活和工作生活变得更加富足？”\n- 4. “你会如何奖励身边那些选择以富足方式行事的人？”\n\
  - 5. “你需要与谁一起练习变得更加富足？”\n- 6. “今天你可以在哪些方面表现得慷慨？本周呢？本月呢？今年呢？”\n\n## 实践：你的教练手册：以真诚进行教练\n\
  \n想一想那些人——工作中的领导者、老师、教练、导师、讲师、培训师、家人、朋友——他们曾经并且仍在对你的人生产生影响。他们相信你，信任你，激发出了你最好的一面。\n\
  \n现在轮到你做同样的事了：\n\n- 1. 你的愿景是什么？你怎样才能、又能在哪里发挥最大的影响？\n- 2. 你独特的贡献是什么？\n- 3. 你将要帮助和激励谁？\n\
  - 4. 你打算去影响哪些人的生命，使其变得更好？\n- 5. 你计划在什么时候做这件事？\n- 6. 你将采取哪些行动来让这一切成为现实？\n- 7. 还需要让哪些人参与？\n\
  \n## 实践：你的教练手册：知道何时进行教练\n\n举办一次练习性教练会谈，努力遵循本章中的关键原则。邀请一位你信任的人作为被教练对象，并向他们说明本次练习中的关键要素。请记住：\n\
  \n- 1. 关心你正在教练的人。\n- 2. 提出支持他们目标的问题，而不是你自己的目标。\n- 3. 明确识别对话的主题。\n- 4. 在当下保持勇气。\n\
  - 5. 提出本章重点强调的教练式问题。\n- 6. 将所有对话落实到聚焦的行动上。\n\n## 实践：你的教练手册：设定优先级\n\n以下是一组问题，你可以在教练他人设定最重要的优先级、愿景和明确的目标时使用：\n\
  \n- 1. “你的工作有多大的意义？”\n- 2. “你的使命、愿景、价值观、战略或目标是什么？”\n- 3. “在实现你最重要的目标时，你承担着哪些角色？”\n\
  - 4. “你最重要的关系对象是谁（客户、合作伙伴、利益相关者）？”\n- 5. “你如何才能更有效地利用时间并聚焦关键优先级？”\n- 6. “你希望开始多做哪些事情？”\n\
  - 7. “哪些事情目前进展良好，你应该继续做下去？”\n- 8. “是什么在干扰你，使你无法更有效地实现关键目标？”\n- 9. “你应该停止做哪些低杠杆、非必要的活动？”\n\
  - 10. “你想要停止或放下什么？”\n- 11. “你正忙于哪些其实并不那么重要的紧急事务？”\n- 12. “在哪些方面你可以把非必要或低附加值的活动委派出去？”\n\
  - 13. “你可以如何有意地为关键优先级投入更多时间？”\n- 14. “你承诺要做出的不同做法是什么？”\n- 15. “你接下来最有效的步骤会是什么？”\n\
  \n## 实践：你的教练手册：提出正确的问题\n\n举办一次练习性教练会谈，努力遵循以正确方式、在正确时机提出正确问题的关键要素。邀请一位你信任的人作为被教练对象，并向他们说明这是一次练习。请记住：\n\
  \n- 1. 向你正在教练的人表达欣赏与尊重。\n- 2. 提出支持他们目标的问题，而不是你自己的目标。\n- 3. 明确识别对话的主题。练习 3Ds！\n-\
  \ 4. 在当下的关键时刻，对任何关键问题或重点机会保持勇气和透明。\n- 5. 提出好的教练问题，清晰地总结问题。\n- 6. 帮助参与者将焦点缩小到关键行动和下一步上。\n\
  \n## 实践：你的教练手册：通过设定 SMART 目标实现成长\n\n回想一次你实现了为自己、团队或组织所设定目标的经历。再回想一次你未能达成目标的经历。是什么造成了成功与失败之间的差别？\n\
  \n你是否曾设定过宏大而鼓舞人心的目标，随后却对目标失去了承诺或专注？当时发生了什么？你将来如何避免这些问题？\n\n你如何帮助他人保持责任感，并持续致力于实现他们最重要的目标和目的？\n\
  \n你是否能通过定期跟进检查和持续的绩效对话，来改善绩效和问责？\n\n在不久的将来，你最重要的目标是什么？它们是 SMART 目标吗？\n\n当你开始设计和调整目标规划流程时，这里有一种编写\
  \ SMART 目标的方法，以确保它们贯穿你的组织结构，与业务单元或事业部层面、团队层面，并最终与个人层面保持一致。请确保你的个人目标和团队目标向上对齐到事业部级和组织级的更高目标：\n\
  \n- 1. 组织目标（战略层面）：\n\n- 2. 业务单元/事业部/部门目标（运营层面）：\n\n## 实践：你的教练手册：以同理心倾听\n\n在百老汇音乐剧*《汉密尔顿》*中，亚历山大·汉密尔顿与阿伦·伯尔交谈，伯尔建议他：“少说话，多微笑。”这是一个教练挑战：在接下来的一周里，选择一场对话，让自己少说多听。事实上，请有意识地努力，让自己说得比谈话对象少。不要说话，而是停下来反思对方所说的内容，认真倾听。不要插话或评论，只需要倾听。不要插入自己的观点、不要压过对方、不要主导对话，只是倾听。一周结束时，花点时间记录：你在哪些时刻成功运用了同理心？在哪些方面还可以做得更好？\n\
  \n- 1. 当对方发现我完全专注于他们时，他们对我有什么反应？\n- 2. 在对话过程中我的感受如何？保持沉默很难吗？是否感到尴尬？\n- 3. 我是否学到了某些如果自己一直说话就会错过的东西？\n\
  - 4. 练习同理心带来了哪些益处？\n- 5. 是什么障碍或挑战阻碍了我成为更好的倾听者？\n- 6. 最难的部分是什么？\n- 7. 最简单的部分是什么？\n\
  - 8. 由于练习同理心沟通，其他人是否给出了任何正面反馈——无论是言语的还是非言语的？\n\n## 实践：你的教练手册：教练与反馈\n\n尝试讨论反馈。选择一位你信任的人一起练习。以下是一些示例教练问题，你可以用于年终评估、360\
  \ 度反馈复盘、规划对话，以及其他涉及反馈的持续对话：\n\n- 1. “你对你的反馈最初的反应是什么？”\n- 2. “反馈中提到你最大的优势是什么？”\n\
  - 3. “最让你惊讶的是什么？”\n- 4. “你希望在哪些方面设定改进目标？”\n- 5. “有哪些主题或问题浮现出来，需要你密切关注？”\n- 6. “你最想在哪方面变得更好？”\n\
  - 7. “根据反馈，你将采取哪些短期行动？”\n- 8. “过去一年你最大的成功是什么？”\n- 9. “今年你做出的最佳决定是什么？”\n- 10. “你冒的最大风险是什么？”\n\
  - 11. “最让你惊讶的是什么？”\n- 12. “你想继续在什么方面努力？”\n- 13. “你永远不想再做的是什么？”\n- 14. “哪个错误让你学到最多？”\n\
  - 15. “过去一年你最大的收获或教训是什么？”\n- 16. “今年你是否改善了某些关系？”\n- 17. “今年你是否消除了某些干扰？”\n- 18. “今年你收到的最好的称赞是什么？”\n\
  - 19. “有哪些本应得到肯定的事，却没有得到相应的称赞？”\n- 20. “回顾过去一年，还有没有其他关键问题、事项、领域或关系是你想讨论的？”\n\n\n\
  \n\n\n# 你的教练手册：提升投入度的教练方法\n\n- 1. 你有没有把合适的人放在合适的位置？如果没有，谁需要被调离现职或安排到其他岗位？你将如何以及在何处找到合适的人？\n\
  - 2. 谁看起来正在疏离工作？你知道原因吗？你打算如何让这个人重新投入？\n- 3. 试着将你的团队成员放入“技能-意愿矩阵”中进行评估。谁技能高且意愿强？谁技能高但意愿低？其他人又如何？针对这些结果，你会采取什么行动？\n\
  \n![](img/3b9ba4a318234a9c4d131f84093751e0_269_0.png)\n\n# 你的教练手册：为贡献而教练\n\n**练习：**\
  \ 以下活动无法在几分钟或一天内完成。可持续的改变往往是一个自我发现与领悟的过程，有时会很快到来，但也可能需要长时间的深思和规划，并随着时间推移在行为和行动上做出改变。\n\
  \n请思考你在生活中希望做出改变或做出重大贡献的两三个主要角色，并问自己以下问题：\n\n- 1. 我需要做出哪些对自己和他人都有益的改变？\n- 2. 我看到哪些未被满足的需求或重大变革机会？\n\
  - 3. 为什么这种改变对我和他人如此重要？\n\n2. 身体（健康/养生）：“你的健康状况如何？你在身体上如何自我更新？身体越健康，你的投入度就越高，表现也越好。写下你在身体方面将要做的两三件事，以改善和提升状态。”\n\
  \n3. 心灵（社交与情感健康/人际关系）：“你怎样才能变得更投入、更支持他人、更友善、更尊重、更乐观、更积极、更有希望？你在工作中与老板、同事、团队、同行、利益相关方、客户、合作伙伴等人际关系维护得如何？哪些重要的个人或家庭关系、友谊或社区网络是你需要维护或发展的？你如何真正建立令人振奋、充满爱与相互尊重的关系？写下你在社交/情感方面将要做的两三件事，以改善和提升状态。”\n\
  \n4. 头脑（教育/职业经历/职业发展）：“你如何在心智上保持清醒？你对自己的技能和知识现状感觉如何？你需要发展哪些新的教育、培训、学习、技能和能力来提升自己的表现？写下你在教育和职业发展领域将要做的两三件事。”\n\
  \n5. 精神（意义/目的/服务/贡献）：“你将如何培养一种真正富有意义和目的的生活？你如何超越自我，与组织的整体目的和贡献相连？你如何被一项事业、目标感、服务、原则、价值观以及尚未完成的贡献所激励和鼓舞？写下你在精神领域将要做的两三件事。”\n\
  \n以下教练问题可指导你进行全人规划，随后你还可以用它们帮助他人同样进行全人规划。这种全面的生活方法可能带来颠覆性的改变！\n\n# 个人全人示例\n\n你的个人需求、机遇和目标是什么？作为全人，你如何设计一个充实的人生？\n\
  \n- 1. 财务\n- 1. 自立\n- 2. 增加收入\n- 3. 预算管理\n- 4. 消费习惯\n- 5. 储蓄\n- 6. 减少债务\n- 7. 投资\n\
  - 8. 商业敏锐度\n- 9. 财务规划\n- 10. 税务策略\n- 11. 创业\n- 12. 财务合作伙伴\n\n- 2. 健康\n- 1. 工作与生活平衡\n\
  - 2. 健康与养生\n- 3. 锻炼与休闲\n- 4. 营养、饮食与进食习惯\n- 5. 营养补充剂\n- 6. 睡眠\n- 7. 身体恢复\n- 8. 冥想与瑜伽\n\
  - 9. 减压\n\n- 3. 人际关系\n- 1. 社交联系\n- 2. 伴侣、配偶\n- 3. 重要他人\n- 4. 家庭关系\n- 5. 家庭聚餐\n-\
  \ 6. 朋友与同事\n- 7. 合作伙伴关系\n- 8. 社区服务\n- 9. 社交网络\n- 10. 旅行/爱好\n\n- 4. 职业\n- 1. 学业/学校\n\
  - 2. 在线培训\n- 3. 留学、实习\n- 4. 职业技能培训\n- 5. 职业发展\n- 6. 工作经验\n- 7. 职业社交网络\n- 8. 协会\n\
  - 9. 认证\n\n- 5. 人生目的\n- 1. 亲近自然\n- 2. 写日记、阅读\n- 3. 冥想、祈祷\n- 4. 宗教崇拜\n- 5. 尊敬家人/祖先\n\
  - 6. 志愿服务\n- 7. 倡议与服务团体\n- 8. 社区与公共服务\n- 9. 政府服务组织\n\n# 个人全人规划\n\n你的个人需求、机遇和目标是什么？作为全人，你如何设计一个充实的人生？\n\
  \n# 1. 财务\n\n![](img/3b9ba4a318234a9c4d131f84093751e0_274_0.png)\n\n# 目标/行动\n\n\
  # 2. 健康\n\n![](img/3b9ba4a318234a9c4d131f84093751e0_274_1.png)\n\n# 目标/行动\n\n# 3.\
  \ 人际关系\n\n![](img/3b9ba4a318234a9c4d131f84093751e0_274_2.png)\n\n# 目标/行动\n\n# 4.\
  \ 职业\n\n![](img/3b9ba4a318234a9c4d131f84093751e0_274_3.png)\n\n# 目标/行动\n\n# 5. 人生目的\n\
  \n![](img/3b9ba4a318234a9c4d131f84093751e0_274_4.png)\n\n# 目标/行动\n\n# 练习：你的教练手册：围绕组织变革的7大核心因素开展教练\n\
  \n领导者兼教练必须花时间与各级别的其他领导者、管理人员和员工一同探讨这些问题。如有可能，请记得先从高层或战略层面开始，然后进入业务单元或运营层面，最后再到战术或团队层面，以便在组织各个层面设计清晰度、聚焦点、一致性和问责制：\n\
  \n- 1. 为什么：“我们为什么存在？我们服务谁？我们的使命、愿景和价值观是什么？”\n- 2. 在哪里：“我们将在哪里竞争？我们独特且有竞争力的战略是什么？”“我们的路径和计划是什么？”\n\
  - 3. 是什么：“我们聚焦的核心且最重要的目标是什么？”\n- 4. 怎么做：“我们如何执行正确的行动和行为？”\n- 5. 何时：“我们以卓越达成目标的时间框架是什么？”\n\
  - 6. 谁：“谁是合适的人？他们是否坐在合适的座位上？”\n- 7. 系统：“我们如何认可、奖励和培养人才？”\n\n针对7大核心因素，问自己：\n\n- 1.\
  \ 我们的组织在哪些方面可以更好地聚焦和保持一致？\n- 2. 我们在哪些方面已经高度一致、有承诺和认同感？\n- 3. 我们在哪些方面是清晰、专注且协调一致的？\n\
  - 4. 我们在哪些方面不清晰、不专注且不一致？\n- 5. 我们在哪些方面需要更好的支持、参与和协助？\n- 6. 我们在哪些方面可以帮助教练并提供更好的支持和问责？\n\
  \n# 练习：你的教练手册：跨文化教练\n\n为了支持组织中持续的多样性和包容性发展，你可能会发现以下练习很有帮助。\n\n在相互尊重、责任、共情、机会、包容和可及性的基础上，制定一套明确的全球价值观和跨文化期望。同时考虑本章讨论的文化多样性问题。请记住，多样性和包容性关乎人才准备、人才投入和领导力管道，是当务之急。\n\
  \n作为领导者兼教练，你可以通过以下方式帮助提升多样性、多元文化意识和全球实践：\n\n- 1. 建立与相互尊重、尊严和平等相符的共同组织价值观、法律和政策；重视并拥抱差异、倡导多样性、全球经验、跨文化交流、改进的认知培训以及包容性\n\
  - 2. 持续开展关于全球与多元文化认知、多样性与包容性以及无意识偏见的培训\n- 3. 促进不同群体获得高级领导者的指导、支持和举荐，并为他们提供晋升机会\n\
  - 4. 为不同群体提供与高管共事的发展性领导力培训、教练和指导机会\n- 5. 提供多样化的群体以促进社交网络和建立专业社区，例如：女性团体、西班牙裔团体、非裔美国人团体、LGBTQ+群体，以及各种族和宗教团体\n\
  - 6. 提供同工同酬和晋升机会，并安排全球轮岗和跨文化工作任务\n- 7. 鼓励突破性思维、创新、创造，并对各个层面的所有人的想法持开放态度\n- 8. 倡导平等就业机会法律、多样性与包容性政策和程序，以及反歧视政策\n\
  \n# 参考资料\n\nDuhigg, Charles. (2012). Habits: Why we do what we do. Interview. Harvard\
  \ Business Review.\n\n\n\n\n"
- '## 致谢


  我首先要感谢所有让这本书成为可能的人。我拥有一支优秀的作家、编辑、贡献者和支持者团队，他们挑战我为我之前的两本教练书籍《释放潜能》和《天赋释放》写续集。我相信所有书籍都很难写。幸运的是，我身边围绕着许多聪明的朋友，他们鼓励我根据我与全球顶尖领导者的教练经验，挖掘正确的主题，重点是以实用的方式分享实用见解。


  感谢许多教练客户，我从他们身上学到了很多，感谢那些愿意接受采访的人，感谢提供书籍推荐的人，以及沿途帮助过我的许多其他人。


  如果没有 John Wiley 出版和编辑团队的持续支持，这本书就不会问世。他们在我的工作繁忙、国内和国际客户工作强度大、旅行日程永无止境的情况下，督促并推动我前进。


  感谢那些负责书籍设计、排版、校对、平面设计、营销、推广以及无数其他出版细节的人。团队包括：Richard Narramore、Vicki Adang、Victoria
  Anllo 和 Dawn Kilgore。


  非常感谢 Dr. Breck England 出色的写作和编辑，以及 Alicia Cunningham 的采访和精彩写作。


  非常感谢我的妻子 Cynthia 和我们的儿子 Zachary、Luke、Jacob 和 McKay。在每个成功男人的背后，都有一个妻子和家庭在帮助他走向更高的成功。感谢他们持续的爱、支持和榜样，以及他们每个人都渴望为我们的家庭和社会做出有意义的贡献。


  在职业上，我很感激我的 FranklinCovey 同事，以及我有幸合作的许多优秀客户。世界各地有太多人无法一一提及。我在教练、领导力发展、脑科学和人类发展方面有几个榜样和导师，包括哥伦比亚大学执行教练认证项目的负责人
  Dr. Terrence E. Maltbia。我是他于 2008 年在纽约市的第二届学员组成员。我们共同主持了多项 FranklinCovey-哥伦比亚大学全球教练认证项目。除了
  Dr. Maltbia 的才华和谦逊之外，他一直是伟大的导师、倡导者和榜样。


  我很感激我的朋友 Dr. Marshall Goldsmith。多年来，我欣赏 Marshall 对教练的诚实、直接、实用的方法，摒弃了新时代的空话和复杂的学术术语。


  感谢 Dr. Daniel Goleman 在社会和情绪智力方面的卓越见解，以及 David Rock 在脑科学、克服偏见和神经领导力方面的工作。


  感谢我的挚友 Dr. Marilee Adams，她来自 Inquiry Institute，她对学习者-评判者心态的见解，以及她在提出有力、及时和发人深省的教练问题方面的好奇心。


  最后，我欠已故的 Dr. Stephen R. Covey 和他的儿子 Stephen M. R. Covey 一份债，他们对我的生活产生了如此深远和积极的影响。他们是大师级教师，身体力行地践行他们所教导的内容，并激励世界应用以原则为中心、以品格为基础的领导力，打造高信任度的个人、团队和组织文化。


  我很幸运能被许多伟大的榜样所教导、辅导和指导，他们塑造了我一生“影响有影响力者”的工作，无论是在个人、团队还是世界各地的组织中。能够踏上这段教练之旅是一种喜悦。最后，我引用我朋友
  Dr. Marshall Goldsmith 的名言：“生活很美好！”


  - Welch, Jack. (2001). *Straight from the Gut.* Business Plus.\n\n他谈吐不错，并在职业生涯中获得了丰厚的财务成功。\n\
  \n但在为他工作时，我意识到他的成功是有代价的。他是终极的推卸责任者。他不为自己的错误负责。他无法认可他人的贡献，因为他太不安全了。他真心相信自己比所有人都更好、更成功。他认为自己站在世界之巅，而当他的承诺未能兑现，当商业交易和发票受到抗议时，他总能找到办法责备、羞辱和评判所有人，自己仍留在顶端。他没有任何脆弱性或真实性，不能表现出任何弱点，必须不惜一切代价保持控制和保护自己的形象。作为内部或外部教练，评估团队中某个人是否愿意开放于改变、自我反思、改进和变得更好是很重要的。\n\
  \n米卡可以很聪明、有魅力、机智，但他可以一键切换，很快变得凶残、侮辱和残忍。他经常在背后诋毁他人。他会表现得好像信任别人，但随后又微观管理他们。他会毫不犹豫地把人推下车，操纵数据，歪曲事实，只是为了看起来好，并作为经理再多活一天。\n\
  \n我在米卡手下工作了两年。我想知道他是否会愿意进行一次教练对话，以及他是否会有自我觉察去问：我与我的领导团队是如何出现的？哪些破坏性行为可能在阻碍？在如此有毒的文化中工作令人沮丧。每天我都会问自己：“我为什么还在这里？我的薪水值得这样吗？我真的对这位关键经理和管理团队有影响力吗？”\n\
  \n对我来说，这只是一份工作。当我意识到生活不仅仅是增长销售额、达成目标和赚钱时，我就离开了。虽然为教练创造一个安全的环境可以增加巨大的绩效改进机会，但不幸的是，并非所有人、团队或组织都鼓励教练文化。有些人可能不可教练或尚未准备好接受教练。\n\
  \n许多人相信的业力普遍法则：“善恶终有报”——你如何对待他人，最终会回到你身上，无论是正面还是负面。米卡的行为最终反噬了他。他最终被公司董事会解雇。许多他认为忠于他的人一直在\n\
  \nfear and self-preservation. 不幸的是，这位领导者所塑造和营造的有毒环境，在他人面前显得光鲜成功，却导致了一种虚假的文化，充斥着不信任、羞耻、恐惧、怨恨和不忠。最终，这场幻象随着他与董事会和管理团队的自毁而破灭。当他被要求离开组织时，他缺乏善意的本质也得到了完整的体现。\n\
  \n个人伟大并非源于财富和地位，而是源于寻求有效影响他人并建立他人。并非所有组织都会拥抱开放、领导力发展和教练的文化。许多组织目光短浅，只关注其他一切——金钱、头衔、职位、控制——而这些本应是次要的。\n\
  \n> 前美国总统德怀特·D·艾森豪威尔说过，“你不能通过打人来领导——那是袭击，而不是领导。” 有效的领导者是充盈的、慷慨的、彬彬有礼的，他们寻求影响他人的生活以实现互利。\n\
  \n我的一个客户 Ashley 于 2002 年在经济低迷时期换了工作。她为了更稳定但仍充满机会的工作而接受了降薪。“我以为我找到了一个非常适合我的岗位，”Ashley\
  \ 承认道。作为一名中层高管，她被承诺从主导高层谈判的机会到有趣的出差。\n\n> “2002 年面试时答应我的那些事，现在想起来几乎可笑，”Ashley 说。“我很少能离开办公室四面墙之外。幸运的是，我从窗户看出去的景色很棒！”\n\
  \n发生了什么？据 Ashley 说，她的雇主 Scott 将关系视为“赢-输”。如果 Ashley 建立了良好的联系，Scott 就会认为这是对自己的打击。Ashley\
  \ 发现自己被排除在重要会议之外。于是，她变得孤立，直到 Scott 准备另谋出路。\n\nScott 很聪明也很有效率。他很友好。他很外向。如果你问他每天在员工中是如何“展现自己”的，他可能会说他是忠诚的、有趣的，并且完成了很多工作。但他缺乏情商去理解自己对周围人造成了什么影响。他没有意识到自己是从匮乏和不安全感出发进行管理，而不是从充盈出发。\n\
  \n因此，Scott 仅从 Ashley 能为公司提供的才华中获益了一小部分。她的才能和天赋被低估了。\n\n## Adopting a Learner Mindset\n\
  \n> *Asking a question is the simplest way of focusing to be different in the future?\n\
  - What are the negative impacts of being a Judger and being closed, inflexible,\
  \ and intolerant of others’ viewpoints?\n- Are you showing up as a Learner 80% of\
  \ the time?\n- When have you recently been a Learner? What were you curious about?\
  \ What was the impact? In what ways can you continually seek to receive the benefits\
  \ of being a Learner with others?\n- What would be the benefits in your relationships\
  \ of being a Learner versus a Judger?\n- What are the benefits of practicing being\
  \ a Learner, seeking common understanding and common purposes?\n- How can you reframe\
  \ situations and become more flexible, adaptable, open-minded, and encouraging of\
  \ diverse and challenging perspectives?\n- How are you being accepting and open\
  \ with self, others, and situations?\n- How are you being curious, thoughtful, engaging,\
  \ and empathic?\n- How can you become increasingly more abundant and a better Learner?\n\
  - Who do you need to begin building trust from a Learner mindset perspective?\n\
  - As a Learner, how would you like to act and behave more effectively?\n- What choices\
  \ can you begin to make as a Learner that will benefit your role as a leader?\n\n\
  作为一名学习者型教练，你将开始获得更大的自我觉察，了解如何更有效地影响他人。你也将开始以新的、更好的方式行动，从而更好地吸引、激励和赋能你周围的人。\n\n\n\
  \n\n\n## 构建富足心态\n\n> > *稀缺心态按盎司计量生活；它总是得出结论：需求永远大于资源。*\n> >\n> > ——埃琳·M·斯特拉扎，作家兼演讲者\n\
  \n1987年8月，在结束了英国伦敦的春夏大学留学项目后，我加入了柯维领导中心（现为富兰克林柯维公司），成为第35名员工。斯蒂芬·R·柯维博士是我职业生涯早期的老师兼导师之一。我从他那里学到的一个关键洞见，就是以双赢的方式思考和行动的价值（对于他《高效能人士的七个习惯》一书的读者来说，这就是习惯4——互利原则）。\n\
  \n柯维博士教导说，双赢思维就是富足心态在行动中的体现。“双赢思维把生活以及我们需要有效互动的人视为合作的舞台，而非竞争的竞技场。大多数人倾向于用二元对立的方式思考：非此即彼、好坏、对错、强弱、硬球或软球、赢或输。但这种思维方式有根本性的缺陷……双赢思维基于这样一种范式：每个人都有足够的资源可以享受。其理念是，一个人的成功不是以牺牲或排斥他人的成功为代价的”（柯维，1989，第218页）。\n\
  \n多年来，一直有人告诉柯维博士，在竞争激烈的商业环境中秉持双赢思维是天真、不切实际且无法实现的。但他并未退缩。他明白，许多领导者、管理者和主管每天带着稀缺心态来上班。这种心态会聚焦于诸如此类的话语：\n\
  \n- “资源不够……”\n- “那永远行不通……”\n- “根本没有办法做到……”\n- “我不能分享……”\n- “我不能信任……”\n- “我们不能冒险……”\n\
  - “他们欠我的……”\n- “如果他们赢了……”\n- “我们都有麻烦了……”\n- “如果功劳给了他们……”\n\n## 52 以富足心态进行辅导\n\n\
  这些语言揭示了稀缺心态和评判者心态。如何将一个固守的立场调整为双赢立场？\n\n有些竞争是好的，甚至是必要的，但当需要建立伙伴关系、协作、相互依赖和合作时，唯一现实的选择就是真正的双赢之道。柯维博士建议首先要识别身边富足且值得信赖的人，向他们学习，与他们交往，并选择以他们为榜样（柯维，1989，第231页）。\n\
  \n对我来说，富足思维和行为的典范就是斯蒂芬·柯维的儿子——斯蒂芬·M·R·柯维。在我职业生涯早期，正如我之前提到的，他是我在柯维领导中心的老板。我与斯蒂芬·M·R·共事多年，至今仍与他保持个人和职业上的合作伙伴关系。他以各种可能的方式践行着双赢和富足的心态。\n\
  \n在亲自会见客户之前，斯蒂芬总是想更多地了解对方。他对客户的背景故事和未来充满好奇。他想理解客户的需求，并力求以定制化、灵活且基于价值的方式与他们互动。他以身作则，诠释了什么是共情、富有创造力、适应性强且灵活地满足客户需求。他是交易促成者，也是确保谈判中每个人都能受益和获胜的倡导者。\n\
  \n他对同事和客户都实践着富足心态。当我们会面时，他真诚地关心我的生活、我的职业兴趣，以及我对自己工作贡献的感受。我进展如何？我个人过得怎么样？他没有政治或隐藏的议程，只有真诚地希望帮助身边的每个人取得成功。他也非常诚实透明，有着值得信赖的议程。\n\
  \n我过去想——现在依然想——成为更像斯蒂芬·M·R·柯维那样的人。一位作为教练的有效领导者，将会像他一样——成为学习者思维和富足心态的榜样。\n\n### 作为学习者的教练\n\
  \n> *无知并非坏事；不愿求知才是更糟的。*\n> ——尼日利亚谚语\n\n在你能够指望辅导或影响他人之前，你必须建立人际关系和融洽感。如果你是一位学习者，这并不需要太长时间。当然，建立信任需要时间，但你对他人的真诚、持续的兴趣，或对客户的关心，会让这一过程更容易。多年来，我在亚洲做了大量商务合作与伙伴工作，深切体会到深厚、信任的关系对于建立可信度至关重要。\n\
  \n以下是一些有力的问题，可以帮助你开启建立更牢固、更具参与感的工作关系的过程。\n\n- “跟我聊聊你的背景吧。你在哪里长大？空闲时间最喜欢做什么？”\n-\
  \ “你个人有什么兴趣爱好？你喜欢做什么？在生活中，你在哪里表现出色并找到你的热情？”\n- “如果必须选一个最喜欢的度假地重游，你会去哪里？”\n- “如果你拥有无限的时间和资源，你会选择做什么？”\n\
  - “回忆一下你人生中感到快乐的时刻。那是什么时候？”\n- “你认为迄今为止自己最大的成就是什么？”\n- “你在这里的工作角色是什么？”\n- “你觉得自己在这里的贡献如何？”\n\
  - “你对团队最大的贡献是什么？”\n- “你天生的禀赋、优势和才能是什么？”\n- “你工作中最好的部分是什么？”\n- “什么时候你觉得自己处于最佳状态？”\n\
  - “你希望工作中哪一部分能有更多时间去做？”\n- “你希望工作中哪一部分能少做一些？”\n- “你觉得如何能让这份工作更令人有成就感？”\n- “这份工作如何与你的人生总体目标相契合？”\n\
  - “未来五年，你希望在职业中做些什么？”\n- “你现在的位置与你想要达到的位置之间的差距是什么？你如何弥合这一差距？”\n- “你如何过上一种更投入、更连接、更充实、更平衡的生活？”\n\
  - “是什么阻碍你在生活中实现更多平衡？”\n- “你如何知道你已经实现了那种平衡？”\n- “哪些是最重要的人际关系，你愿意为此投入？”\n- “我怎样才能最好地帮助你实现你的目标、梦想和抱负？”\n\
  \n### 进行有效对话，达成更优成果\n\n下面是一个案例研究，帮助你思考如何开展有效对话以实现更优成果。\n\n莎拉是一位事业部负责人，以拒绝协作、拒不接受本部门以外的主意而闻名。她在组织内不太合群，不信任他人，沟通也很差。她在组织内部为自己筑起了一座孤岛。\n\
  \n其他想要并需要与她合作的事业部都感到挫败。想象一下你是莎拉的同级，另一个事业部的负责人。你想通过运用一些辅导技巧来改善关系。但该从哪里、如何着手呢？\n\n\
  从一个尊重的开场问题开始：“莎拉，你愿意和我聊一聊我们两个事业部如何能更好地协同合作吗？”避免指责、评判，或任何可能妨碍莎拉敞开心扉或愿意进一步讨论的事情。\n\
  \n询问莎拉看到了市场上哪些未被满足的需求和机会，在共同使命或宗旨、客户需求、跨事业部更好对齐方面有什么想法。你们共同的目标、需求或前进的机会是什么？是否有更好的方式来建立伙伴关系、增加价值，并在组织内共同提升贡献？你们如何克服各自为政、冲突或分歧，探索共同利益和共同目标？\n\
  \n寻找共同宗旨、共同使命或对齐的目标：在满足客户需求、践行你们的价值观、明确共同目标方面，你们共同的机会池是什么？先放在职能孤岛、历史问题或不协调的工作领域一边，着眼于全局和共同目标，让两个部门能够在其中增加更好的价值、服务和支撑。你和莎拉可以开始识别并勾勒出共同使命领域、共享的客户需求以及未来合作的市场机会。确保你们双方都清晰透明，理解大局是什么，以及以新的、更好的方式合作可能带来的益处。\n\
  \n以共情式的精确倾听：询问莎拉她如何看待这两个事业部可以开始携手合作，以实现共同的利益、目标和目的，从而更好地达成使命。\n\n\n\n\n客户或市场需求。“你看到了什么？”“你在想什么？”“你感觉如何？”“什么可能阻碍了进展？”如果她表达了挫败感，请以同理心回应。“听到这些我很抱歉；你一定感到非常沮丧。”捕捉并转述听到的关键问题，然后询问哪些问题最重要。提出一些澄清性问题，例如“你能多说一点吗？你观察到了什么？你学到了什么？你能告诉我更多关于你对质量、成本、定价、服务或及时成功地将产品推向市场的担忧吗？”\n\
  \n将人与问题分开：这次教练式对话不是为了修复、责备或评判莎拉。而是讨论质量、成本、定价、服务或及时产品发布等关键问题如何影响信心和信誉。“这种情况或问题如何影响你的业务部门？这种情况可能如何影响你的客户？”\n\
  \n## 专注于问题和挑战的解决方案，而非追究责任\n\n当你以教练身份与同事建立关系时，你并不是在指责任何人，而只是在审视导致问题的事实、数据、可观察的行为、事件、问题或关注领域。其理念是你们可以改善协作并共同寻求解决问题。重点应首先确保双方都以完全诚实、透明和开放的态度确认问题是什么。很多时候，人们试图解决错误的问题，或去解决客户并不关心的问题。\n\
  \n带着富足心态去面对如何变得更好、如何进行持续改进、以及如何从客户和合作伙伴的反馈中学习。所有焦点都应放在市场、客户、共同使命机会以及未来的共同目标上。关键问题是：“你认为对业务和客户最有利的是什么？你觉得你的业务部门应该做出哪些改变？未来更好地服务内部合作伙伴和外部客户，你的最佳选择和替代方案是什么？”\n\
  \n在提出这些问题时，保持沉默。让他人分享他们的意图和对情况的理解。不要用你的建议、故事或意见来填补沉默。让他们参与到发现自己的故事部分中。\n\n## 人际成熟度和有效性需要平衡勇气与体谅\n\
  \n平衡勇气与体谅。这样做是高度成熟的核心。柯维博士教导说，领导者可以同时做到勇敢（诚实直接）和体贴（忠诚尊重）。勇气是一种意愿和能力，能够完全透明地表达你的想法、感受、问题和挑战。体谅是一种意愿和能力，能够以肯定、礼貌和尊重来寻求并倾听他人的想法和感受。\n\
  \n作为教练的领导者应该勇敢，即诚实直接地面对关于目标、指标、衡量标准、数字、记分牌、道德、价值观、规则、政策、指导方针和法律的残酷事实。同时，作为教练的领导者应该体谅他人，并以有帮助、安全、友善和尊重的方式给予反馈。要记住感受、背景、环境、能力、差异、历史、期望和个性差异。\n\
  \n作为教练的领导者如果勇敢但不体谅他人，可能会被视为“赢/输”的思考者。然而，如果作为教练的领导者只寻求体谅而不勇敢，他们会被视为“输/赢”。这两种方式都不可持续，无法获得长期成功。作为教练的领导者应该在对话中练习平衡使用这两种方式（Covey\
  \ 2006，第230-232页）。要取得成功，你必须首先以善良、尊重和体贴的语言和行为开始。然后寻求对目标、衡量标准、指标、法律和宗旨保持勇敢、诚实和透明。\n\
  \n明确你的意图。开放而明确地分享你的动机。“这就是我打算做的事情以及原因。”基于你的观察和个人经验，你可以说：“我认为问题在于……” “从我的角度来看，这是我观察到的……”\
  \ “这就是我的出发点……” “我的观点可能有限或短视，但这是我看到的……或者这是我打算做的。”始终首先从开放、体谅和尊重的立场出发。当我们以体谅开始时，人们会敞开心扉，因为他们感到安全且不被评判。询问你的客户、顾客或合作伙伴如何共同前进并变得更好。“我们有哪些共同目标或共同机会可以更好地合作？未来我们的团队可以通过哪些方式开始更好地合作？”\n\
  \n确认并取得相互承诺，共同找到前进的道路。在对话结束时，表达对你们未来共同成功的信心。展示以新的、更好的方式行动和表现的真诚承诺。“基于我们今天的对话，我想表达我对我们未来合作机会的兴奋、动力或信心。我知道我们能取得伟大的成就。让我们回顾一下我们承诺在未来要做的事情。”\
  \ “你未来的责任是什么？” “我未来的责任是什么？” “我们还需要让谁参与这个项目以使其成功？” “我们如何衡量成功？” “我们如何追踪进展？” “我们未来如何解决任何问题？”\
  \ “我们应该多久会面一次来讨论进展？” “我们应该与谁、在哪里会面？”以及“未来最佳的下一个步骤是什么？”\n\n## 确保“你的成功就是我的成功”\n\n\
  > 天赋是上天赐予的，要保持谦逊；名声是他人给予的，要心存感激；自负是自己养成的，要小心提防。\n> \n> ——约翰·伍登（1972年）\n\n体现富足心态的一位领导者是已故的美国大学篮球教练约翰·伍登。伍登带领加州大学洛杉矶分校的男子篮球队赢得了10次NCAA冠军，取得了88连胜和38场连续锦标赛胜利。ESPN称他为有史以来最伟大的教练。他以高尚的品格和仆人式领导者的谦逊而闻名。约翰·伍登执教的球队在篮球场上取得了前所未有的成功，但比他们取得的成就更重要的是他们如何取得这些成就。\n\
  \n他给其他教练的建议是：“记住，赢得冠军的不是你，而是球员。”伍登教练将自己的角色视为教师和导师。他尊重每一个人。他设定了非常高的期望，并坚持对自己和身边每个人都要求绝对的正直。\n\
  \n## 以富足心态进行教练辅导\n\n他谦逊地将自己个人和职业上的名声与成功归功于他的团队和球员。他以他们的成功来定义自己的成功，不仅仅是在篮球场上，也包括在生活中。他花了数小时进行训练和练习，但他从不谈论胜利。他专注于做好准备并最大化每个人的潜力。\n\
  \n只有当你自我感觉良好时，你才能拥有富足心态。只有那时，你才会想帮助周围的人也自我感觉良好。这源于内心的安全感和自信。当你看到有人以控制、辱骂、傲慢或贬低的方式对待他人时，他们的行为正是缺乏自尊和内心安全感的表现。他们需要贬低别人来让自己感觉良好。\n\
  \n相比之下，伍登教练总是努力提升他人。所有球员都知道，伍登教练深切关心他们作为人的本身，超越了任何战术（Xs and Os）或篮球训练。\n\n> “优秀的领导者会不遗余力地提升员工的自尊心，”沃尔玛创始人山姆·沃尔顿如是说。“如果人们有信心并相信自己，他们能取得的成就会令人惊叹。”\n\
  \n## 拥抱富足心态\n\n> 在你成为领导者之前，成功在于成长自己；当你成为领导者之后，成功在于成长他人。\n> \n> ——杰克·韦尔奇，通用电气前首席执行官\n\
  \n稀缺心态是自然的，往往源于自私、恐惧、自我驱动的视角，或对有限资源的感知。每一种稀缺情境可能来自不同的驱动因素。想象一下一个幼儿的普通一天：\n\n- “我的玩具，我的球，我的奶瓶，我的奶嘴，我的毯子，该我了，我的妈妈……”\n\
  \n你能听到围绕这些话的哭闹，对吧？我们从孩子那里听到这些东西，但不幸的是，我们也从成年人那里听到。有些成年人可能会说：\n\n\n“My title, my\
  \ position, my office, my power, my decision, my team, my recognition, my promotion,\
  \ my bonus, my credit, my need to be famous and constantly recognized . . .”\n\n\
  如果匮乏心态可以是对童年的自然反应，那么当我们成长到更高层次的个人安全感、自尊和成熟时，我们如何拥抱丰盛心态？\n\n教练和作者 Naphtali Hoff 提出了几种在工作和生活中丰盛生活和领导的方式（Hoff\
  \ 2017）。一种方法是写下丰盛生活的益处。这可以帮助你更自知丰盛的益处，并重塑你的思维，做出积极改变。其他方法可能是奖励那些选择以丰盛双赢方式行事的周围人。找到一种方式将慷慨、文明和互利带入你的工作环境和家庭。记住，种瓜得瓜，种豆得豆。你给予他人的，最终会以某种方式回馈给你。“人们欣赏慷慨，往往会找到回馈的方式，”Hoff\
  \ 说。\n\n当我为 Zotec Corporation 的 CEO 和执行团队准备一次关于信任的研讨会时，该公司的首席人力资源官来找我，说：“我们有一位领导力顾问今天会参加你的信任与文化工作坊。他的名字是\
  \ Coach Lou Holtz，他在 1986 年至 1996 年担任圣母大学的主教练。他多年来一直在为 Zotec 的领导者提供建议，今天想来旁听向你学习。”\n\
  \n我感到惊讶和震惊——甚至可以说“震惊”——因为我心里认真地想：“我宁愿整天听 Coach Holtz 谈论领导力和信任，也不愿听自己说话。” Coach Holtz\
  \ 彬彬有礼、善良、风趣、聪明、见解深刻。我会提出一个话题并说：“嘿教练，能否分享一下你对这个话题的观点和经验？你在这种情况下做了什么？”他会用他丰富的经验和简单却深刻的想法——总是带点幽默——吸引整个团队。到了当天结束时，我对他说：“我希望你能和我一起旅行，每周和我的客户一起工作。”他微笑着说：“你今天教的大部分内容，就是我在圣母大学带队的方式。”\n\
  \nCoach Holtz 是我的英雄。能够花一整天向他学习，他的慷慨、经验、丰盛、善良和机智——我可以诚实地说，为什么这么多人愿意为他拼尽全力，并且至今仍如此忠诚和紧密地与他保持联系。他在足球场上与球员们培养了丰盛心态，并让他们为在商业、家庭和社区中领导做好准备。\n\
  \n在我们的工作坊之后，Coach Holtz 给我发了以下电子邮件：“亲爱的 Michael，刚想给你写个便条，告诉你我对你在 Zotec 的演讲印象非常深刻，很高兴有机会参与其中。你显然做了大量的研究，我很感谢你的努力。如果我能以任何方式帮助你，请给我打电话。我只是想让你知道——干得漂亮！Lou\
  \ Holtz。”\n\n在 40 年传奇的教练领导之后，Lou Holtz 感谢我训练他？这就是慷慨、谦逊和丰盛的典范。\n\n## PRACTICE: YOUR\
  \ COACHING PLAYBOOK\n\n当你寻求以更丰盛的方式教练他人时，使用以下丰盛问题来帮助构建你持续的教练对话：\n\n- 1. “对你来说，谁是那些以丰盛、双赢方式运作的绝佳榜样？”\n\
  - 2. “以丰盛生活和领导他人的关键益处是什么？”\n- 3. “在个人和工作生活中，你可以在哪些方面选择变得更丰盛？”\n- 4. “你如何奖励那些选择丰盛行事的周围人？”\n\
  - 5. “你需要与谁练习变得更丰盛？”\n- 6. “今天？本周？本月？今年？你可以在哪些方面变得慷慨？”\n\n## References\n\nAdams,\
  \ Marilee. (2016). Change Your Questions, Change Your Life. Berrett-Koehler Publishers.\n\
  \nCovey, Stephen M.R. (2006). The 13 behaviors of trust action plan. In The Speed\
  \ of Trust. Free Press.\n\n## References\n\nCovey, Stephen R. (1989). *The 7 Habits\
  \ of Highly Effective People*. Free Press.\nHoff, Naphtali. (2017). *7 strategies\
  \ to lead with abundance*. Tanveer Naseer Leadership. http://www.tanveernaseer.com/how-leaders-tap-power-of-abundance-naphtali-hoff.\n\
  Wooden, John. (1972). *They Call Me Coach*. Word Books.\n\n## Coaching with Authenticity\n\
  \n到现在，你可能已经意识到，你作为领导力教练的成功取决于你是什么样的人。你意识到成功的教练始于你自己。你知道你需要丰盛心态。但你不能伪装一个有效教练的人格和心态。在本章中，我们将谈论做*authentic*的重要性。\n\
  \n我们都曾遇到过虚假、不真诚、做作的领导者。与这些类型的领导者互动时，你很快就会发现他们是自私的、投机的和自恋的。在超过三年的时间里，我有机会与一位我认为体现了真实领导者的人密切合作。他的名字是\
  \ Brent Smith。我们第一次见面时，他看着我和我的同事说：“Michael 和 Barney，我们会玩得很开心，而且我们会做很多好事——按这个顺序。”\n\
  \n我们确实做到了！与 Brent 合作时，我感到投入和被赋能。我从不害怕犯错。他总是支持我。我不必担心掩盖自己的痕迹。Brent 为我们提供了清晰的愿景和目标感，并在我们的角色上信任我们。我了解到他会为我和我们的团队做任何事，我们也会为他做任何事。我曾经说过：“我会为他冲破砖墙。”\n\
  \nBrent 为什么是如此有影响力的领导者？他真诚、聪明、努力工作、谦逊。他服务他人并深切关心他们。他不仅仅是一个忠诚的领导者——Brent 完全将注意力 outward\
  \ 放在他能为他人做什么以及如何指导周围的人。他让团队中的每个人都感到被重视、被需要和被尊重。他以善良和诚实对待他人，从不玩“抓现行”的游戏。他的风格低调，他更喜欢寻找和利用周围人的优势，而不是关注他们的弱点和错误。与\
  \ Brent 在一起时，我实际上感觉自己更聪明、更好！\n\n“我们正在培养未来的领导者，”他会提醒我们。“当我们的团队成员离开这里时，他们将拥有所需的信心、技能和资源，在一生中取得成功。”\n\
  \n在超过 30 年的教练生涯中，我一直在不断问自己，Brent Smith 等领导力教练有什么不同？一个关键答案：他们选择做真实的。我四个儿子和我的妻子从我这里听了大量关于领导力的谈话——我总是问他们，“你想成为什么样的人？\
  \ 你想追随什么样的人？ 你不想追随谁？”他们的答案都一样：你总是能分辨出虚假的领导者和真正的领导者。\n\n你怎么分辨？\n\n我有一个朋友喜欢狂看自我提升节目，特别是减肥节目。为了证明时间花得值得，他告诉我他正在考虑写一篇关于这些节目中人们使用的语言类型的论文。\n\
  \n他觉得他仅凭参与者的开场独白就能相当准确地判断出他们的成功程度。他们是否怀着希望、自信和兴奋讨论前方的道路？还是他们带着痛苦和绝望展望未来，害怕自己与想要达到的目标之间的巨大差距？\n\
  \n说实话，大多数人同时受得失两种动机的驱动。伟大的教练用对将要获得的东西的愿景来激励我们。他们点燃我们的热情，激发我们内心的最好。当我们试图解释他们为何如此有效时，我们会关注他们与我们的情感——心灵和精神——积极互动的能力。此外，脑科学现在告诉我们，关注获得会释放动机和积极的化学物质，如血清素和多巴胺。真实的领导者帮助他人关注正确的思维模式、习惯、有纪律的行动以及令人兴奋的理想未来状态的可能性。他们不会仅仅关注新时代的术语、速效公式或表面和肤浅的解决方案。\n\
  \n相比之下，糟糕的领导者寻求通过恐惧、控制、操纵手段和愤怒来影响他人。这些有毒的行为会引发\n\n\n说到塑造影响力，一个很好的起点是你的心态、你的语言和你的对话。圣雄甘地说过：“成为你在世界上寻求的改变。”认识到你的话语很重要，所以言出必行，言为心声。从真诚地关心他人开始，让人们听到你关心他们。坐下来进行一对一的对话，了解他们并连接对他们重要的事情，是无可替代的。谈论你如何欣赏他们。表达关心，倾听并了解他们，认可他们。作为教练，你必须与人建立这种情感连接，否则你的言行都不会有持久的价值。\n\
  \n有些领导对自己作为影响者的角色变得懒惰和冷漠。他们抛弃人，或把人当作物品，或仅仅作为获取所需的手段。他们疏于投入。几个星期甚至几个月过去了，除了例行会议外几乎没有联系。或者，他们反其道而行之——微观管理，使独立行动瘫痪，把人质困在指责与评判的受害者循环中。或者，他们可能会如谚语所说那样漠视他人，毫无忠诚或支持地将他人牺牲掉。\n\
  \n回想我的朋友玛丽莉·亚当斯博士关于“学习者”和“评判者”的论述。学习者是有情商的领导者，他们的语言和行为带来积极影响；而评判者则情商不高。他们的语言和行为制造焦虑、无助和怨恨。以下是一些学习者和评判者语言的例子（亚当斯，2015年）：\n\
  \n## 评判者语言\n- “我做不到……”\n- “我不会……”\n- “这是不可能的……”\n- “他们有什么毛病……”\n- “我有什么毛病……”\n-\
  \ “他们为什么要那样做……”\n- “这没法做到……”\n- “这不是我的责任……”\n- “我什么都知道……”\n- “真是一群白痴……”\n- “规则对我不适用……”\n\
  - “我有权这样，因为……”\n- “我不在乎……”\n\n为了帮助安东尼，我们设计了一个新游戏，让他可以追踪自己的行为。每天开始时，他在左口袋放10枚便士。目标是在一天结束时把那10枚便士从左口袋移到右口袋。每当他受到负面触发，想要以评判或消极情绪的方式回应时，他就会深呼吸，练习新的“学习者”行为；每有一次积极互动，他就把一枚便士移到右口袋。虽然这个小小的游戏没有其他人知道，但他每天都能享受到许多私人的胜利，因为他变得更加有自我意识，并选择用新的、更好的方式应对困难局面。\n\
  \n改变行为很难，但当人们开始计分时，他们在生活和工作中会以不同的方式行事。当人们受到更好的对待时，他们也会表现得更出色。\n\n最终，安东尼成为了一位优秀的领导者兼教练。他能够真正地帮助他人，而不是伤害他们。\n\
  \n## 成为高情商领导者\n\n> 情绪是会传染的。我们都曾亲身感受过。你知道，和朋友喝杯咖啡或小酌一杯后，你会感觉很好。当你在商店里遇到粗鲁的店员和负面的互动，你会带着糟糕的感觉离开。\n\
  >\n> ——丹尼尔·戈尔曼博士，作家、演讲者、心理学家\n\n我的客户艾莉森负责为一家国际公司管理企业差旅。她的团队很小，大约19人，但他们每天可能都要追踪数百名旅行者，确保世界各地的行程一切顺利。\n\
  \n每天早上她走进办公室时，都会和几个同事沟通，看看他们所谓的“情绪检查”。“谁见到老板了？他笑了吗？他在走向角落办公室的路上有没有和谁打招呼？他今天怎么样？”\n\
  \n“这太让人精疲力竭了，”艾莉森向我吐露。“每天都是不同的心情，我们不得不据此调整我们所做的一切。”\n\n毫不意外，办公室的人员流动率非常高，员工要么被解雇，要么自己决定离开。“只有四个人在这里工作超过了一年，”艾莉森说。\n\
  \n## 以真诚之心进行教练\n\n当艾莉森在老板心情好的日子去上班时，她会像我们享受一月的晴天那样珍惜它：趁还能享受时赶紧享受。但这些晴天并不会迷惑艾莉森。不幸的是，她已经明白这些日子不会持久。\n\
  \n一个好的领导者、好的教练，不会拥有像天气一样变幻无常的心态。好的领导者兼教练会选择自己的“天气”。他们选择积极、乐观、好奇和高情商。\n\n> 丹尼尔·戈尔曼博士写道：“当领导者习惯性地用坏情绪来激励员工时，表面上可能完成了更多工作——但这不一定是更好的工作。而且持续不断的坏情绪会侵蚀情绪氛围，破坏大脑发挥最佳工作状态的能力”（戈尔曼，2014年）。\n\
  \n> 戈尔曼继续说道：“领导者可以让员工的情绪状态变得更好或更糟。”你选择哪一种状态？\n\n这取决于你的情商有多高。\n\n根据词典定义，*情商*是控制自己情绪，并“明智且富有同理心地”处理人际关系的能力。简而言之，情商高的人能够与他人有效且持续地建立连接。\n\
  \n情商低的领导者不能很好地控制自己的情绪。他们扮演受害者，争斗，放弃，微观管理，操控——他们不知道还有其他方式取得结果。不幸的是，他们的有毒情绪是会传染的。戈尔曼将它们比作病毒：“来自高层的持续有毒能量，会促使宝贵的团队成员更新简历，而不是更新他们的待办事项清单”（戈尔曼，2015年）。\n\
  \n这种能量也可以在同事之间传递。一项针对不同行业70个工作团队的研究发现，一起开会的人最终会相互感染情绪，无论好坏（戈尔曼，2015年）。\n\n情商高的领导者会引导团队走向觉察。例如，以创新世界级产品闻名的IDEO公司，刻意摒弃受害者心态、指责和羞辱。IDEO的网站（https://www.ideo.com/about）称其为“一家致力于产生积极影响的全球设计公司”。IDEO相信失败是创新所必需的。公司遵循以下标准：\n\
  \n- 1. 保持乐观。\n- 2. 协作。\n- 3. 拥抱不确定性。\n- 4. 从失败中学习。\n- 5. 让他人成功。\n- 6. 主动负责。\n- 7.\
  \ 少说多做。\n\n作为领导者兼教练，你需要以身作则，展现出像IDEO这样的公司所具备的那种情商。一个很好的起点是你如何看待他人、从你口中说出的话，以及随之而来的行为。伟大的成就和可持续的成果将随之而来。\n\
  \n## 将自己视为仆人，而非主人\n\n> 领导者是知道方向、身先士卒并指明方向的人。\n>\n> ——约翰·C.麦克斯韦尔，《纽约时报》畅销书作者\n\n\
  很难找到真正领导力的榜样。当我们查看关于政府、教育、商业和国际关系的新闻时，我们找到的大多是反面教材，说明如何不要领导。\n\n罗伯特·格林利夫，著名的领导力研究者和教师，也是《*仆人式领导*》一书的作者，是最早研究和定义*仆人式领导*概念的人之一。他说：“核心思想是领导力必须关乎服务。你不能把伟大的领导力与服务分开。”他意识到，优秀组织中的人们视自己为相互服务、减轻他人负担并使其成功的人（格林利夫，1998年，第5-10页）。\n\
  \n根据肯德基和AFC企业前首席执行官谢丽尔·巴切尔德的说法，传统领导力存在一个“聚光灯问题”。在她的书《*敢于服务：通过服务他人取得卓越成果*》中，巴切尔德说大多数领导者是“推动者和高成就者，虽然可能有点自我陶醉。我们容忍这一点，因为他们正朝着我们想去的方向前进。如果他们成功了，我们也会成功。”\n\
  \n\n\n\n## 以真实性进行教练\n\nBachelder 将传统的领导者与谦逊的仆人式领导者形成对比，后者避开聚光灯，选择多倾听他人而不是多说话。“他们让人们参与决策。他们做出服务于人们的决定；他们给他人应有的认可”（Bachelder\
  \ 2015）。\n\n我们看到了这种差异。我们感受到了这种差异。但尽管如此，Bachelder 指出，我们害怕仆人式领导者。“我们害怕他们无法让我们取得成功。他们能否交付卓越的绩效结果？我们对此表示怀疑。”我们为什么会怀疑呢？她说，这正是因为我们被告知，善良的人总是最后一名。\n\
  \nBachelder 恳请我们重新审视我们的观点。“你是否曾为一个热爱名声、权力或聚光灯的领导者工作过？你被很好地服务了吗？”她问道。她鼓励领导者走出聚光灯，投身于以最佳努力服务他们的人和客户。\n\
  \n太多领导者认为自己是“掌权者”，而就客户而言，他们是“服务者”。太多教练把自己看作聚光灯下的明星。作为教练和领导者，你每天都要做出选择：你想服务，还是想被服务？你想对人说教，还是想与人建立联系？你想成为台上的人，还是帮助他人成功的人？伟大的领导者型教练会压抑自己的自我和利益，把他人的需求置于自己之上。\n\
  \n## 建立信任\n\n> *任何组织的文化不过是其领导者集体行为的体现。如果你想改变你的文化，就改变你领导者的集体行为。*  \n> —Ram Charan，教授、企业顾问和作家\n\
  \n去年夏天，我有一次难得的机会翻阅几个频道，看看电视上有没有值得观看的东西。最终，我的目光被一个前提如此夸张的节目吸引住了，我以为它不可能真实。\n\n当然，它可能和大多数“真人秀”一样真实，但就几分钟时间，我被吸引住了。一个人在全国电视上寻找爱情，节目时长60分钟。虽然这个人躲在暗色的面板后面，但潜在的伴侣被一个个带上舞台。这个人只能通过名字、年龄、职业，也许还有一个爱好来筛选潜在伴侣。节目结束时，这个人走出来，提出求婚，并附带节目提供的钻戒。\n\
  \n然而最后，这似乎也不算离谱。也许我们看到爱情时就知道那是爱情。信任也是如此：我们感受到它时就知道它。谁知道我们的短期判断是否正确？\n\n真实的领导者应该始终如一，在任何情况下都是同一个人。他们是可信的、值得信赖的。他们在业余时间不是懒散的，而在工作场所也不是暴君。值得信赖的领导者是正直和可信的人，这意味着他们始终选择按自己的价值观生活，走道德之路，即使无人注视。\n\
  \n在教练中，信任和可信度至关重要。要成为受信任的教练，你必须不断练习教练技能并跟上新发展。同样重要的是，你必须成为正直的真实榜样。这关乎既有能力又有爱心。这关乎定义你作为仆人式领导者可以做出的贡献，然后付诸实践。这关乎帮助你的团队成员定义并实现他们的贡献。\n\
  \n仆人式领导者会做出贡献。仆人式领导者知道为他们服务的人需要完成什么工作。仆人式领导者通过持续为周围的人在职业和个人生活上创造价值，从而赢得他们的信任。作为仆人式领导者，这里有一些你可以问自己和你指导的人的问题：\n\
  \n- 我在工作中的角色中能做出的最大贡献是什么？\n- 如何通过贡献的生活带来满足感和幸福感？\n- 我们组织的使命是什么？我们对该使命的具体贡献是什么？\n\
  - 我们的贡献产生了什么影响？\n- 你可以（并且愿意）做哪些具体的事情来更好地做出贡献？\n- 我如何最好地帮助他人在工作中做出有意义且重大的贡献？\n\n\
  ## 为教练创造安全的空间\n\n> 没有失败，就没有创新和创造力，句号。\n> —Dr. Brené Brown，《纽约时报》畅销书作者、心理学家、顾问和演讲者\n\
  \n只有当人们知道他们可以信任你时，他们才会感到安全向你敞开心扉。仆人式领导者的存在是为了为他们服务的人创造舒适和幸福。为了使教练成功，必须有一个安全的环境。你的教练对话的时机、氛围和环境至关重要。通过提出以下问题，你可以确保人们会信任你并感到安全地敞开心扉：\n\
  \n- 你愿意进行一次对话吗？\n- 你想进行一次对话吗？\n- 现在是谈话的好时机吗？\n- 我很乐意尽快见面并聊聊。什么时候联系比较合适？\n- 我想听取你对一些事情的建议，同时也分享一些我的想法。\n\
  - 我想了解一下，确保一切对你来说都进展顺利。\n- 你愿意就我们如何一起变得更好进行一次对话吗？\n\n作为教练，在开始教练之前始终征得许可。这是表明良好意图并同时体现价值和尊重的好方法。\n\
  \n最近，我为一个名为承包商和建筑商协会的团体做了一场主题演讲，主题是改善工作场所安全标准的执行。根据联邦法律，你的雇主必须提供一个安全的工作场所，免受已知的健康和安全危害及违规行为的困扰。当我演讲时，我注意到房间里有一条横幅，上面有一张妈妈、爸爸和孩子的照片。标语写着：“每个家庭都有权让他们的亲人每晚安全回家，免于事故、伤害或死亡。”我深受这个关于安全的重要信息感动。\n\
  \n就像身体安全一样，每个人都有权在工作场所享有心理安全。教练确保每次互动都是开放的、尊重的、包容的、值得信赖的和安全的。保密性和无报复恐惧也是安全的重要组成部分。\n\
  \n在他们的书《Driving Fear Out of the Workplace》中，Daniel K. Oestreich 和 Kathleen Ryan\
  \ 问道：“在工作中感到心理安全意味着什么？”他们的研究发现：当人们知道可以说真话而不必担心后果时，质量、创新、协作和生产力的指标都会显著改善（Oestreich\
  \ and Ryan 1991, pp. 65–67, 86–94）。\n\n那么，你如何打破恐惧和不信任的循环，创造一个值得信赖和安全的环境呢？\n\n创造安全环境的一种方法是允许人们犯错并从中学习。我有一个亲密的朋友\
  \ Tanios Viviani，我曾在他领导多家数十亿美元的公司时对他进行教练。多年来，我们分享了人生的起起落落和许多成功。讨论生活教训与 Tanios 交谈让我耳目一新。我们谈论过的一个有趣话题是失败。我们提出了关于失败的四个关键教训：\n\
  \n- 1. *Fail fast.* 克服自负、自我和傲慢。快速失败意味着你拥有开放的、双向的反馈循环，这些循环是透明的，并提供快速、诚实的反馈，以便你进行方向修正。\n\
  - 2. *Fail cheaply.* 我们都从代价高昂的错误中吸取了教训，当我们全力以赴时。通过在投入大量时间、金钱和资源之前进行 alpha 和 beta\
  \ 测试——试点和试水——来降低失败的成本。\n- 3. *Fail publicly.* 不要因失败而感到尴尬。每个人都会失败！如果你公开失败，你会赢得尊重而不是失去它，因为你展示了绝对的诚实和承诺。把失败放到公共领域，让每个人都能从中学习并变得更好。\n\
  - 4. *Fail forward.* 失败并无耻辱。适应并继续前进！你无法在恐惧的环境中创新和协作。如果一个幼儿摔倒，我们不会对他们大喊。我们知道他们会摔倒一百次，但每次摔倒，他们都会变得更强壮、更明智，并继续前进。学习并反思过去，但把所有努力都集中在持续改进的成功未来上。\n\
  \n\n\n\n\n## 实践：你的教练行动手册\n\n想想那些人——工作中的领导、老师、教练、导师、讲师、训练员、家人、朋友——他们曾经并继续对你的人生产生影响。他们相信你，信任你，激发出你最好的一面。\n\
  \n现在轮到你去这样做了：\n\n1. 你的愿景是什么？你如何以及在哪里最能发挥影响力？\n2. 你独特的贡献是什么？\n3. 你打算帮助和激励谁？\n4. 你打算对哪些人的生活施加正面的影响？\n\
  5. 你计划何时去做？\n6. 你将采取哪些行动来实现这一目标？\n7. 还需要谁参与？\n\n## 参考文献\n\n- Adams, Marilee. (2015).\
  \ *改变你的问题，改变你的人生*. Berrett-Koehler Publishers.\n- Bachelder, Cheryl. (2015). *敢于服务：如何通过服务他人实现卓越成果*.\
  \ Berrett-Koehler Publishers.\n- Goleman, Daniel. (1998). *工作情商*. Bantam.\n- Goleman,\
  \ Daniel. (2014). 情商. http://www.danielgoleman.info/daniel-goleman-be-mindful-of-the-emotions-you-leave-behind.\n\

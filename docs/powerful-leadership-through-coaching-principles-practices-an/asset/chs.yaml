- "## 8 提出正确的问题\n\n> 在教练他人时，要像一个10岁的孩子一样充满好奇心。\n> ——特伦斯·E·马尔比亚博士，哥伦比亚大学教练认证项目教授\n\n\
  我成长于实体图书馆、卡片目录和百科全书的时代。如果我有一个问题，我可以在百科全书中寻找答案。如果那里没有，我可以去图书馆，在长长的矩形抽屉里翻找目录中正确的卡片，它会引导我找到一本有答案的书。\n\
  \n在成长过程中，我一直用这种正式而繁琐的方式获取书籍和信息，因此我现在非常喜欢这种便利：可以向谷歌或Siri提问，并立即得到许多答案。\n\n具有讽刺意味的是，即使有如此多的信息可供获取，研究表明，随着年龄增长，我们提出的问题却越来越少。我们甚至期望信息立刻出现在指尖。在《新闻周刊》一篇题为《创造力危机》的文章中，波·布朗森和阿什利·梅里曼写道：“学龄前儿童平均每天向父母问大约100个问题……到了中学阶段，他们几乎不再提问……学生动机和参与度在同一时期直线下降并非巧合。他们并不是因为失去兴趣而停止提问；恰恰相反，他们是因为停止提问而失去了兴趣。”（Bronson\
  \ and Merryman 2010）\n\n为什么我们会停止提问？也许是因为我们对世界更加熟悉，或者认为自己什么都明白了。也许我们听说提问很烦人。在学校里，我们死记硬背，讨厌那个总是问傻问题的小孩，而我们只想赶紧离开那里。\n\
  \n也许是因为提问不再得到奖励。作家沃伦·伯杰曾问TED大会创始人理查德·索尔·沃曼，为什么人们会停止提问。“在学校，我们因给出答案而受到奖励，而不是因提出好问题而受到奖励，”沃曼指出（Berger\
  \ 2011）。也许这就是为什么那些一开始会问无数“为什么”和“如果……会怎样”的孩子们，随着学业的推进，问得越来越少。\n\n好了，是时候掸掉地毯方块上的灰尘，打开水果零食，重新像个孩子一样了。是时候尽情享受提出好问题的艺术了。我的妻子辛西娅拥有并经营着一所私立学校：位于犹他州普罗沃的艾维霍尔学院（Ivy\
  \ Hall Academy）。她对每个孩子的愿景是“培养负责任、相互依存的终身学习者，让他们过上做出有意义贡献的生活。”这所学校采用“探究式学习”，鼓励学生专注于一些宏大、开放的问题，在小组中研究和回应。在这个过程中，他们培养了出色的研究能力和批判性思维。“我发现每个人都想要一个简单的答案，”他告诉我，“他们希望我告诉他们该做什么，因为他们感到沮丧，只想向前推进。但教练不是这样运作的。我们通过提问帮助人们，然后退后一步，让他们找到自己的答案。这才是真正学习的方式。你认识到自己在工作和生活中有何能力，然后你就成功了！”\n\
  \n### 提出启发式问题\n\n> 教练的首要工作之一，就是保持好奇心，提出具有启发性、开放式且引人思考的问题，这些问题将邀请客户看向一个或另一个方向，但不预设结论。\n\
  > ——劳拉·惠特沃思、凯伦·金西-豪斯、亨利·金西-豪斯，以及菲尔·桑达尔（Whitworth et al. 1998）\n\n我亲身观察到，当教练提出有效而有力的问题时，所带来的转变。我非常享受帮助无数客户自己去发现，对他们来说最重要的是什么\n\
  \n\n他们摆脱低效的思维模式，并创造属于自己的针对重大问题的解决方案。从事这样具有变革性、鼓舞人心的工作时，我总觉得自己正行走在神圣的土地上。\n\n我的工作是保持真正的好奇心，提出一些促使客户审视他们的思维模式、使命、价值观、战略、目标、客户需求以及领导风格的问题——也就是那些影响业务结果的诸多问题。平庸的老板不喜欢被提问。他们需要掌握所有答案，害怕让别人知道他们并非无所不知（当然，有些人真的自以为是！）。对这类老板来说，提问会威胁到他们的安全感，并引发他们对失去控制的恐惧。\n\
  \n相比之下，领导者型教练将提问视为一门必要的艺术和科学。科学的一面是其程式化的部分：例如，如何构造一个开放式问题。这有规则可循。艺术的一面则是趣味所在、创造所在，是当下与他人的共舞，是找到谁都不曾想过的解决方案时的兴奋。\n\
  \n但首先，让我们来看看提出具有启发性的开放式问题的规则。\n\n## 规则 1：关心你所辅导的人\n\n> 关心——关心他人、关心事物、关心生活——是一种成熟的表现。\n\
  > \n> —特蕾西·麦克米伦（Tracy McMillan），作家、撰稿人、人际关系专家\n\n在构思辅导问题时，最重要的一点是对答案保持真正的好奇。你必须关心。你必须表达出对所辅导之人的尊重，专注于当下，并关注他们。你可以倾听；但如果你并非真正想要理解对方，或者试图假装尊重，他们会察觉到这种不真诚，并对你的影响力产生怀疑。\n\
  \n做到真正好奇需要练习。你必须不断尝试建立联结，并有意地表现出兴趣。你必须接受这样一个观念：别人可能和你一样聪明，甚至比你更聪明；同时，至少暂时放下自己的观点和看法。\n\

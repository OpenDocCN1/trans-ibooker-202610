  mathrm{V}}}_{\\mathrm{B}1}-\\frac{\\overrightarrow{\\mathrm{J}}}{{\\mathrm{m}}_{\\\
  mathrm{B}}} $$](img/334805_2_En_9_Chapter_TeX_IEq106.png) (4)\n\n一般来说，旋转是碰撞的内在结果，同一个冲量必须恰当地描述碰撞前后角速度的变化。请记住，惯性，或称转动惯量，是旋转质量。与线速度和质量的情况类似，碰撞中角速度的变化也与转动惯量成反比。如图\

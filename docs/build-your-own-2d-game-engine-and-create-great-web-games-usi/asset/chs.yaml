  \ < 0) {\n        xform.setXPos(100);\n        xform.setYPos(65 * Math.random());\n\
  \    }\n}\n```\n\n## MyGame 场景\n\n与所有情况一样，`MyGame` 关卡在 `my_game.js` 文件中实现。定义了三个特定的\
  \ `GameObject` 子类后，请遵循以下步骤：\n\n### 1. 导入新定义的对象\n\n除了引擎访问文件 `index.js` 外，为了访问新定义的对象，必须导入相应的源代码：\n\
  \n\n\n\n## 游戏对象初始化\n\n```javascript\nimport engine from \"../engine/index.js\";\

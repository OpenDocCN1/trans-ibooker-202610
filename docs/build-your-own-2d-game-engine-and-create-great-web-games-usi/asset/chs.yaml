  K. Sung et al. *Build Your Own 2D Game Engine and Create Great Web Games*  \n[`https://doi.org/10.1007/978-1-4842-7377-7_9`](https://doi.org/10.1007/978-1-4842-7377-7_9)\n\
  \n\n\n\n* 将模拟限制在游戏场景中对象的选定子集上\n\n基于这组假设，刚体物理模拟（或刚体模拟）能够捕获并重现许多熟悉的现实世界物理交互，例如物体弹跳、下落和碰撞，比如一个充满气的弹力球或一个简单的\
  \ *Lego* 积木从桌面弹起并落在硬木地板上。只要碰撞过程中不发生变形，这类刚体物理交互就能可靠地进行实时模拟。\n\n质量均匀分布且在交互过程中不改变形状的物体可适用于游戏中许多重要且实用的场景。一般来说，刚体物理引擎非常擅长模拟移动物体相互接触的情况，例如保龄球撞击瓶子或炮弹击中装甲板。然而，重要的是要认识到，基于给定的这组假设，刚体物理模拟不支持以下情况：\n\
  \n* 由多个几何部分组成的物体，例如箭\n* 具有非平凡材质属性的物体，例如磁性\n* 具有非均匀质量分布的物体，例如棒球棒\n* 在碰撞过程中改变形状的物体，例如橡胶球\n\
  \n在所有现实世界的物理物体交互类型中，刚体交互是理解最透彻、最容易求近似解、实现起来挑战最小的。本章仅专注于刚体模拟。\n\n## 章节概览\n\n与光照功能类似，游戏引擎的物理组件也是游戏引擎设计、架构和实现中一个庞大而复杂的领域。考虑到这一点，你将采用与之前所有游戏引擎组件相同的方法来开发刚体物理组件。即分析、理解并实现各个步骤，以逐步实现组件的核心功能。对于物理组件，涵盖刚体模拟的主要思想包括以下内容：\n\
  \n* **`RigidShape` 类**：定义 `RigidShape` 类，通过在独立的简单几何体上执行计算（而不是潜在的复杂 `Renderable`\
  \ 对象）来支持优化模拟。该主题将在第一个项目“刚体形状与包围盒项目”中介绍。\n* **碰撞检测**：研究并实现数学原理，以精确碰撞圆形和矩形 `RigidShape`\
  \ 对象。一个重要概念是，在数字世界中，刚体形状可以且经常会重叠，因此必须在 `CollisionInfo` 对象中保留此重叠事件的详细信息。碰撞检测涵盖的主题将通过三个独立的项目进行讨论，每个项目专注于一种独特的碰撞交互。它们包括：\n\
  \    * 圆形之间的碰撞：圆形碰撞与 `CollisionInfo` 项目\n    * 矩形之间的碰撞：矩形碰撞项目\n    * 矩形与圆形之间的碰撞：矩形与圆形碰撞项目\n\
  * **运动**：近似描述在固定时间间隔更新的世界中运动的积分。运动主题将在刚体形状运动项目中介绍。\n* **碰撞物体的相互渗透**：采用数值稳定的解决方案，增量式地修正碰撞刚体形状之间的相互渗透问题。该主题在碰撞位置修正项目中介绍。\n\
  * **碰撞响应**：使用冲量法模拟碰撞响应。冲量法将在两个项目中介绍，首先是不考虑旋转的简单情况（碰撞响应项目），最后是考虑旋转的情况（碰撞角度响应项目）。\n\
  \n## 刚体形状与包围盒\n\n模拟任意刚体形状之间交互所涉及的计算在算法上可能很复杂，且计算成本高昂。基于这些原因，刚体模拟通常基于一组有限的简单几何形状，例如刚性圆和矩形。在典型的游戏引擎中，这些简单的刚体形状可以附加到几何结构复杂的游戏对象上，以对这些游戏对象之间的物理交互进行近似模拟，例如，在飞船上附加刚性圆，并对刚性圆进行刚体物理模拟，以近似飞船之间的物理交互。\n\
  \n根据现实经验，你知道简单的刚体形状只有在发生物理接触时才能相互作用。从算法角度来看，这一观察转化为检测刚体形状之间的碰撞。为了进行正确的模拟，每个形状都必须与其他每个形状进行碰撞测试。这样，碰撞测试就是一个\
  \ `O(n²)` 操作，其中 `n` 是参与模拟的形状数量。作为对这一高昂操作的优化，刚体形状通常会被一个简单的几何体（例如圆）包围，仅当形状的包围体重叠时，才会调用潜在的昂贵碰撞计算。\n\
  \n### 刚体形状与包围盒项目\n\n该项目引入了带有简单圆形包围盒的 `RigidShape` 类，用于碰撞优化。定义的 `RigidShape` 类将集成到游戏引擎中，每个\
  \ `GameObject` 对象将同时持有对 `Renderable` 和 `RigidShape` 对象的引用。`Renderable` 对象将被绘制出来，向玩家展示视觉上美观的游戏元素，而\
  \ `RigidShape` 将在刚体形状模拟中被处理，以近似 `GameObject` 对象的行为。你可以在图 9-1 中看到该项目运行的示例。该项目的源代码定义在\
  \ `chapter9/9.1.rigid_shapes_and_bounds` 中。\n\n![图 9-1 ¶ 运行刚体形状与包围盒项目](img/334805_2_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1 ¶ 运行刚体形状与包围盒项目\n\n该项目的控制方式如下：\n\n* **行为控制**：\n    * `G 键`：随机创建一个新的刚性圆或矩形\n\
  * **绘制控制**：\n    * `T 键`：切换所有对象的纹理显示\n    * `R 键`：切换 `RigidShape` 的绘制显示\n    * `B\
  \ 键`：切换每个 `RigidShape` 包围盒的绘制显示\n* **对象控制**：\n    * `左/右方向键`：依次遍历并选择一个对象\n    *\
  \ `WASD 键`：移动选中的对象\n    * `Z/X 键`：旋转选中的对象\n    * `Y/U 键`：增加/减小选中对象的 `RigidShape`\
  \ 大小；这不会改变对应 `Renderable` 对象的大小\n\n该项目的目标如下：\n\n* 定义 `RigidShape` 类并与 `GameObject`\
  \ 集成\n* 演示 `RigidShape` 代表同一 `GameObject` 上对应的 `Renderable` 几何体\n* 为构建刚体形状物理模拟器奠定基础\n\
  * 定义一个初始场景用于测试物理组件\n\n除了系统字体文件夹外，你可以在 `assets` 文件夹中找到以下外部资源文件：\n\n* `minion_sprite.png`\
  \ 用于小兵和英雄对象\n* `platform.png` 和 `wall.png` 是测试场景中的水平和垂直边界对象\n* `target.png` 显示在当前选中的对象上方\n\
  \n### 设置实现支持\n\n\n\n\n## 设置实现支持\n\n您将首先设置实现支持来开始构建此项目。首先，通过为预期的复杂性增加新文件夹来组织引擎源代码结构。其次，定义用于可视化和验证正确性的调试工具。第三，扩展库支持以实现旋转刚性形状。\n\
  \n## 组织引擎源代码\n\n为了预期新组件的加入，在 `src/engine` 文件夹中创建 `components` 文件夹，并将 `input.js`\
  \ 组件源代码文件移动到此文件夹中。该文件夹将包含物理及后续章节将引入的其他组件的源代码。您必须编辑 `camera_input.js`、`loop.js` 和\
  \ `index.js` 以更新 `input.js` 的源代码文件位置变更。\n\n## 支持调试绘制\n\n重要的是要注意，只有 `Renderable`\
  \ 对象（通常由 `GameObject` 引用）实际上在游戏世界中可见。刚性形状实际上并不存在于游戏世界中；它们被定义用于近似模拟相应 `Renderable`\
  \ 对象的物理交互。为了支持适当的调试和正确性验证，能够绘制和可视化刚性形状非常重要。\n\n### 步骤 1：创建 `debug_draw.js`\n\n在\
  \ `src/core` 文件夹中创建 `debug_draw.js`，从 `LineRenderable` 导入，并定义用于绘制简单形状（作为线段）的支持常量和变量：\n\
  \n```javascript\nimport LineRenderable from \"../renderables/line_renderable.js\"\
  ;\nlet kDrawNumCircleSides = 16;  // 将圆周近似为线段\nlet mUnitCirclePos = [];\nlet mLine\
  \ = null;\n```\n\n### 步骤 2：定义 `init()` 函数\n\n定义 `init()` 函数以初始化绘制对象。`mUnitCirclePos`\
  \ 是单位圆圆周上的位置，`mLine` 变量是将用于绘制的线条对象。\n\n```javascript\nfunction init() {\n    mLine\
  \ = new LineRenderable();\n    mLine.setPointSize(5);  // 确保显示时可见\n    let deltaTheta\
  \ = (Math.PI * 2.0) / kDrawNumCircleSides;\n    let theta = deltaTheta;\n    let\
  \ i, x, y;\n    for (i = 1; i <= kDrawNumCircleSides; i++) {\n        let x = Math.cos(theta);\n\
  \        let y = Math.sin(theta);\n        mUnitCirclePos.push([x, y]);\n      \
  \  theta = theta + deltaTheta;\n    }\n}\n```\n\n### 步骤 3：定义绘制函数\n\n定义 `drawLine()`、`drawCrossMarker()`、`drawRectangle()`\
  \ 和 `drawCircle()` 函数，以基于定义的 `mLine` 对象绘制相应形状。这些函数的源代码与物理模拟无关，故不予展示。详情请参阅项目源代码文件夹。\n\
  \n### 步骤 4：导出函数\n\n请记住导出定义的函数：\n\n```javascript\nexport {\n    init,\n    drawLine,\n\
  \    drawCrossMarker,\n    drawCircle,\n    drawRectangle\n}\n```\n\n### 初始化调试绘制功能\n\
  \n编辑 `loop.js`，从 `debug_draw.js` 导入，并在 `start()` 中所有异步加载 Promise 完成后调用 `init()`\
  \ 函数：\n\n```javascript\nimport * as debugDraw from \"./debug_draw.js\";\n// ...\
  \ 与之前代码相同 ...\nasync function start(scene) {\n    // ... 与之前代码相同 ...\n    // 等待游戏加载前的任何异步请求\n\
  \    await map.waitOnPromises();\n    // 所有资源加载完毕后，现在可以初始化\n    // 依赖着色器等的系统内部函数\n\
  \    debugDraw.init();  // 刚性形状等的绘制支持\n    // ... 与之前代码相同 ...\n}\n```\n\n> **注意**：初始化调试绘制的一个有效替代方案是在\
  \ `shader_resources` 模块的 `createShaders()` 函数中，在所有着色器创建完成后进行。然而，在 `shader_resources.js`\
  \ 中从 `debug_draw.js` 导入会产生循环导入：`debug_draw` 从 `LineRenderable` 导入，后者尝试从 `shader_resources`\
  \ 导入。\n\n## 更新 gl-matrix 库\n\n`gl-matrix` 库通过其 `vec2` 加法支持顶点平移，通过其 `vec2` 标量乘法支持顶点缩放，但不支持顶点旋转。编辑\
  \ `src/lib/gl-matrix.js` 文件，并定义 `vec2.rotateWRT()` 函数以支持将顶点位置 `pt` 相对于 `ref` 位置按\
  \ `angle` 旋转。遵循 `gl-matrix` 的惯例，函数的第一个参数 `out` 返回操作结果。\n\n```javascript\nvec2.rotateWRT\
  \ = function(out, pt, angle, ref) {\n    var r = [];\n    vec2.subtract(r, pt, ref);\n\
  \    vec2.rotate(r, r, angle);\n    vec2.add(r, r, ref);\n    out[0] = r[0];\n \
  \   out[1] = r[1];\n    return r;\n};\n```\n\n## 定义 RigidShape 基类\n\n您现在可以定义 `RigidShape`\
  \ 作为矩形和圆形刚性形状的基类。该基类将封装两种形状共有的所有功能。\n\n### 步骤 1：创建 `rigid_shape.js`\n\n首先在 `src/engine`\
  \ 中创建一个新的子文件夹 `rigid_shapes`。在此文件夹中创建 `rigid_shape.js`，从 `debug_draw` 导入，并定义绘制颜色和\
  \ `RigidShape` 类。\n\n```javascript\nimport * as debugDraw from \"../core/debug_draw.js\"\
  ;\nlet kShapeColor = [0, 0, 0, 1];\nlet kBoundColor = [1, 1, 1, 1];\nclass RigidShape\
  \ {\n    // ... 实现如下 ...\n}\nexport default RigidShape;\n```\n\n### 步骤 2：定义构造函数\n\
  \n定义构造函数以包含所有子类共享的实例变量。`xf` 参数通常是对该 `RigidShape` 所代表的 `Renderable` 的 `Transform`\
  \ 的引用。`mType` 变量将由子类初始化以区分形状类型，例如圆形与矩形。`mBoundRadius` 是用于碰撞优化的圆形包围半径，`mDrawBounds`\
  \ 指示是否绘制圆形包围。\n\n```javascript\nconstructor(xf) {\n    this.mXform = xf;\n    this.mType\
  \ = \"\";\n    this.mBoundRadius = 0;\n    this.mDrawBounds = false;\n}\n```\n\n\
  ### 步骤 3：定义 Getter 和 Setter 函数\n\n为实例变量定义适当的 getter 和 setter 函数：\n\n```javascript\n\
  getType() { return this.mType; }\ngetCenter() { return this.mXform.getPosition();\
  \ }\ngetBoundRadius() { return this.mBoundRadius; }\ntoggleDrawBound() { this.mDrawBounds\
  \ = !this.mDrawBounds; }\nsetBoundRadius(r) { this.mBoundRadius = r; }\nsetTransform(xf)\
  \ { this.mXform = xf; }\nsetPosition(x, y) { this.mXform.setPosition(x, y); }\n\
  adjustPositionBy(v, delta) {\n    let p = this.mXform.getPosition();\n    vec2.scaleAndAdd(p,\
  \ p, v, delta);\n}\n_shapeColor() { return kShapeColor; }\n_boundColor() { return\
  \ kBoundColor; }\n```\n\n### 步骤 4：定义 `boundTest()` 函数\n\n定义 `boundTest()` 函数以确定两个形状的圆形包围是否重叠。如图\
  \ 9-2 所示，两个圆之间的碰撞可以通过比较两个半径之和 `rSum` 与两圆圆心之间的距离 `dist` 来确定。这再次是一个相对高效的操作，旨在先于两个形状之间更昂贵的精确碰撞计算。\n\
  \n```javascript\nboundTest(otherShape) {\n    let vFrom1to2 = [0, 0];\n    vec2.subtract(vFrom1to2,\
  \ otherShape.mXform.getPosition(),\n        this.mXform.getPosition());\n    let\
  \ rSum = this.mBoundRadius + otherShape.mBoundRadius;\n    let dist = vec2.length(vFrom1to2);\n\
  \    if (dist > rSum) {\n        // 未重叠\n        return false;\n    }\n    return\
  \ true;\n}\n```\n\n![图 9-2：圆形碰撞检测：(a) 无碰撞。(b) 检测到碰撞](img/334805_2_En_9_Fig2_HTML.png)\n\
  \n### 步骤 5：定义 `update()` 和 `draw()` 函数\n\n定义 `update()` 和 `draw()` 函数。目前 `update()`\
  \ 为空。启用时，`draw()` 函数绘制圆形包围并在包围中心绘制一个 \"X\" 标记。\n\n```javascript\nupdate() {  //\
  \ 暂无内容  }\ndraw(aCamera) {\n    if (!this.mDrawBounds)\n        return;\n    debugDraw.drawCircle(aCamera,\
  \ this.mXform.getPosition(),\n        this.mBoundRadius, this._boundColor());\n\
  \    debugDraw.drawCrossMarker(aCamera, this.mXform.getPosition(),\n        this.mBoundRadius\
  \ * 0.2, this._boundColor());\n}\n```\n\n## 定义 RigidRectangle 类\n\n\n\n\n## 可渲染对象与刚体形状\n\
  \n可渲染对象基于应用于单位正方形的 `Transform` 运算符来编码形状的几何信息。例如，一个旋转的矩形被编码为一个缩放并旋转的单位正方形。正如你所经历的，这种表示方式——单位正方形的顶点保持不变，并结合来自\
  \ `GLSL` 顶点着色器的矩阵变换支持——能有效且高效地支持绘制变换后的形状。\n\n`RigidShape` 对象是专为交互设计的 `Renderable`\
  \ 对象，其底层表示必须支持大量数学计算。在这种情况下，显式表示和更新底层几何形状的顶点更为高效。例如，不再使用缩放并旋转的正方形，而是可以显式计算并存储矩形的顶点位置。这样，实际顶点位置始终可直接用于数学计算。因此，`RigidRectangle`\
  \ 将显式定义并维护矩形的顶点。\n\n有了刚体形状的抽象基类，你现在可以创建第一个具体的刚体形状——`RigidRectangle` 类。为了预期复杂的碰撞函数，实现源代码将被分离到多个文件中。目前，创建\
  \ `rigid_rectangle.js` 作为访问文件，并从 `rigid_rectangle_main.js` 导入，后者将实现核心 `RigidRectangle`\
  \ 功能。\n\n## 实现 RigidRectangle 类\n\n### 步骤 1：创建访问文件\n\n在 `src/rigid_shapes` 文件夹中，创建\
  \ `rigid_rectangle.js` 以从 `rigid_rectangle_main.js` 导入并导出 `RigidRectangle` 类。这是\
  \ `RigidRectangle` 类的访问文件，使用该类的用户应从此文件导入。\n\n```javascript\nimport RigidRectangle\
  \ from \"./rigid_rectangle_main.js\";\nexport default RigidRectangle;\n```\n\n###\
  \ 步骤 2：创建主实现文件\n\n现在，在 `src/rigid_shapes` 文件夹中创建 `rigid_rectangle_main.js` 以导入 `RigidShape`\
  \ 和 `debugDraw`，并定义 `RigidRectangle` 为 `RigidShape` 的子类。\n\n```javascript\nimport\
  \ RigidShape from \"./rigid_shape.js\";\nimport * as debugDraw from \"../core/debug_draw.js\"\
  ;\n\nclass RigidRectangle extends RigidShape {\n    // ... implementation to follow\
  \ ...\n}\nexport default RigidRectangle;\n```\n\n### 步骤 3：定义构造函数\n\n定义构造函数以初始化矩形尺寸\
  \ `mWidth` 乘 `mHeight` 以及 `mType`。重要的是要认识到，刚体矩形的顶点位置由 `mXform` 引用的 `Transform` 控制。相比之下，宽度和高度尺寸由\
  \ `mWidth` 和 `mHeight` 独立定义。这种尺寸分离允许设计者决定 `RigidRectangle` 应多紧密地包裹相应的 `Renderable`。请注意，形状的实际顶点和面法线是在\
  \ `setVertices()` 和 `computeFaceNormals()` 函数中计算的。面法线的定义将在以下步骤中详述：\n\n```javascript\n\
  constructor(xf, width, height) {\n    super(xf);\n    this.mType = \"RigidRectangle\"\
  ;\n    this.mWidth = width;\n    this.mHeight = height;\n    this.mBoundRadius =\
  \ 0;\n    this.mVertex = [];\n    this.mFaceNormal = [];\n    this.setVertices();\n\
  \    this.computeFaceNormals();\n}\n```\n\n### 步骤 4：定义 setVertices() 函数\n\n定义 `setVertices()`\
  \ 函数，根据 `mXform` 定义的尺寸设置顶点位置。如图 9-3 所示，矩形上的顶点定义为：索引 0 为左上角，1 为右上角，2 为右下角，索引 3 对应左下角顶点位置。\n\
  \n```javascript\nsetVertices() {\n    this.mBoundRadius = Math.sqrt(this.mWidth\
  \ * this.mWidth +\n                                  this.mHeight * this.mHeight)\
  \ / 2;\n    let center = this.mXform.getPosition();\n    let hw = this.mWidth /\
  \ 2;\n    let hh = this.mHeight / 2;\n    // 0--左上角; 1--右上角; 2--右下角; 3--左下角\n  \
  \  this.mVertex[0] = vec2.fromValues(center[0] - hw, center[1] - hh);\n    this.mVertex[1]\
  \ = vec2.fromValues(center[0] + hw, center[1] - hh);\n    this.mVertex[2] = vec2.fromValues(center[0]\
  \ + hw, center[1] + hh);\n    this.mVertex[3] = vec2.fromValues(center[0] - hw,\
  \ center[1] + hh);\n}\n```\n\n![图 9-3：矩形的顶点和面法线](img/334805_2_En_9_Fig3_HTML.png)\n\
  \n*图 9-3：矩形的顶点和面法线*\n\n### 步骤 5：定义 computeFaceNormals() 函数\n\n定义 `computeFaceNormals()`\
  \ 函数。图 9-3 显示，矩形的面法线是垂直于边并指向矩形中心外侧的向量。此外，请注意面法线索引与相应顶点之间的关系。面法线索引 0 指向与从顶点 2 到顶点\
  \ 1 的向量相同的方向。该方向垂直于由顶点 0 和 1 形成的边。这样，索引 0 的面法线垂直于第一条边，依此类推。请注意，面法线向量已归一化，长度为 1。面法线向量稍后将用于确定碰撞。\n\
  \n```javascript\ncomputeFaceNormals() {\n    // 0--上; 1--右; 2--下; 3--左\n    // mFaceNormal\
  \ 是指向矩形外部的面法线\n    for (let i = 0; i < 4; i++) {\n        let v = (i + 1) % 4;\n\
  \        let nv = (i + 2) % 4;\n        this.mFaceNormal[i] = vec2.clone(this.mVertex[v]);\n\
  \        vec2.subtract(this.mFaceNormal[i], this.mFaceNormal[i], this.mVertex[nv]);\n\
  \        vec2.normalize(this.mFaceNormal[i], this.mFaceNormal[i]);\n    }\n}\n```\n\
  \n### 步骤 6：定义尺寸与位置操作函数\n\n定义尺寸与位置操作函数。在所有情况下，必须重新计算顶点和面法线（`rotateVertices()` 调用\
  \ `computeFaceNormals()`），且必须确保顶点位置与 `mXform` 的状态保持一致，这至关重要。\n\n```javascript\n\
  incShapeSizeBy(dt) {\n    this.mHeight += dt;\n    this.mWidth += dt;\n    this.setVertices();\n\
  \    this.rotateVertices();\n}\n\nsetPosition(x, y) {\n    super.setPosition(x,\
  \ y);\n    this.setVertices();\n    this.rotateVertices();\n}\n\nadjustPositionBy(v,\
  \ delta) {\n    super.adjustPositionBy(v, delta);\n    this.setVertices();\n   \
  \ this.rotateVertices();\n}\n\nsetTransform(xf) {\n    super.setTransform(xf);\n\
  \    this.setVertices();\n    this.rotateVertices();\n}\n\nrotateVertices() {\n\
  \    let center = this.mXform.getPosition();\n    let r = this.mXform.getRotationInRad();\n\
  \    for (let i = 0; i < 4; i++) {\n        vec2.rotateWRT(this.mVertex[i], this.mVertex[i],\
  \ r, center);\n    }\n    this.computeFaceNormals();\n}\n```\n\n### 步骤 7：定义 draw()\
  \ 和 update() 函数\n\n现在，定义 `draw()` 函数以线段形式绘制矩形边缘，并定义 `update()` 函数以更新矩形的顶点。必须重新计算顶点和面法线，因为正如你可能从\
  \ `RigidShape` 基类构造函数的讨论中回忆的那样，`mXform` 是对 `Renderable` 对象的 `Transform` 的引用；游戏可能已经操纵了\
  \ `Transform` 的位置或旋转。为确保 `RigidRectangle` 始终反映潜在的 `Transform` 变化，必须在每次更新时重新计算顶点和面法线。\n\
  \n```javascript\ndraw(aCamera) {\n    super.draw(aCamera);  // 中心的十字标记\n    debugDraw.drawRectangle(aCamera,\
  \ this.mVertex, this._shapeColor());\n}\n\nupdate() {\n    super.update();\n   \
  \ this.setVertices();\n    this.rotateVertices();\n}\n```\n\n最后，请记得更新引擎访问文件 `index.js`，以将新定义的功能转发给客户端。\n\
  \n## 定义 RigidCircle 类\n\n你现在可以用与 `RigidRectangle` 相似的整体结构来实现 `RigidCircle` 类。\n\n\
  ### 步骤 1：创建访问文件\n\n在 `src/rigid_shapes` 文件夹中，创建 `rigid_circle.js` 以从 `rigid_circle_main.js`\
  \ 导入并导出 `RigidCircle` 类。这是 `RigidCircle` 类的访问文件，使用该类的用户应从此文件导入。\n\n```javascript\n\
  import RigidCircle from \"./rigid_circle_main.js\";\nexport default RigidCircle;\n\
  ```\n\n### 步骤 2：创建主实现文件\n\n\n\n## 创建 RigidCircle 类\n\n现在，在 `src/rigid_shapes` 文件夹中创建\
  \ `rigid_circle_main.js`，导入 `RigidShape` 和 `debugDraw`，并定义 `RigidCircle` 为 `RigidShape`\
  \ 的子类：\n\n```javascript\nimport RigidShape from \"./rigid_shape.js\";\nimport *\
  \ as debugDraw from \"../core/debug_draw.js\";\n\nclass RigidCircle extends RigidShape\
  \ {\n    // ... implementation to follow ...\n}\n\nexport default RigidCircle;\n\
  ```\n\n## 3. 定义构造函数\n\n定义构造函数以初始化圆的半径 `mRadius` 和 `mType`。与 `RigidRectangle` 的尺寸类似，`RigidCircle`\
  \ 的半径由 `mRadius` 定义，独立于 `mXform` 定义的大小。注意 `RigidCircle` 的半径 `mRadius` 和圆形边界 `mBoundRadius`\
  \ 是分别定义的，这是为了确保未来可以将两者分离。\n\n```javascript\nconstructor(xf, radius) {\n    super(xf);\n\
  \    this.mType = \"RigidCircle\";\n    this.mRadius = radius;\n    this.mBoundRadius\
  \ = radius;\n}\n```\n\n## 4. 定义尺寸的 getter 和 setter\n\n```javascript\ngetRadius()\
  \ {\n    return this.mRadius;\n}\n\nincShapeSizeBy(dt) {\n    this.mRadius += dt;\n\
  \    this.mBoundRadius = this.mRadius;\n}\n```\n\n## 5. 定义绘制函数\n\n将圆绘制为沿圆周的线段集合。为了正确可视化圆的旋转，从中心向旋转后的垂直圆周位置绘制一条线段。\n\
  \n```javascript\ndraw(aCamera) {\n    let p = this.mXform.getPosition();\n    debugDraw.drawCircle(aCamera,\
  \ p, this.mRadius, this._shapeColor());\n    let u = [p[0], p[1] + this.mBoundRadius];\n\
  \    // angular motion\n    vec2.rotateWRT(u, u, this.mXform.getRotationInRad(),\
  \ p);\n    debugDraw.drawLine(aCamera, p, u, false, this._shapeColor()); // show\
  \ rotation\n    super.draw(aCamera); // draw last to be on top\n}\n```\n\n最后，记得更新引擎访问文件\
  \ `index.js`，将新定义的功能转发给客户端。\n\n## 修改 GameObject 类以集成 RigidShape\n\n回顾第 6 章的讨论，`GameObject`\
  \ 类旨在封装游戏场景中对象的视觉外观和行为。`GameObject` 的视觉外观由引用的 `Renderable` 对象定义。到目前为止，`GameObject`\
  \ 的行为一直作为类的一部分以特设的形式定义和实现，例如 `mSpeed` 和简单的自主行为 `rotateObjPointTo()`。现在可以用即将推出的系统物理组件支持来替换这些特设参数。\n\
  \n## 1. 编辑 GameObject.js\n\n移除对速度 `mSpeed` 的支持，以及相应的 setter 和 getter 函数和 `rotateObjPointTo()`\
  \ 函数。通过本章其余部分的更改，游戏对象行为将由刚体物理模拟支持。确保保留其他变量和函数；它们是为支持外观和检测纹理重叠 `pixelTouches()` 而定义的。\n\
  \n## 2. 在构造函数中定义新实例变量\n\n引用 `RigidShape` 并提供绘制选项：\n\n```javascript\nclass GameObject\
  \ {\n    constructor(renderable) {\n        this.mRenderComponent = renderable;\n\
  \        this.mVisible = true;\n        this.mCurrentFrontDir = vec2.fromValues(0,\
  \ 1); // front direction\n        this.mRigidBody = null;\n        this.mDrawRenderable\
  \ = true;\n        this.mDrawRigidShape = false;\n    }\n    // ... implementation\
  \ to follow ...\n}\n```\n\n## 3. 定义 mRigidBody 的 getter 和 setter 以及切换绘制选项的函数\n\n\
  ```javascript\ngetRigidBody() {\n    return this.mRigidBody;\n}\n\nsetRigidBody(r)\
  \ {\n    this.mRigidBody = r;\n}\n\ntoggleDrawRenderable() {\n    this.mDrawRenderable\
  \ = !this.mDrawRenderable;\n}\n\ntoggleDrawRigidShape() {\n    this.mDrawRigidShape\
  \ = !this.mDrawRigidShape;\n}\n```\n\n## 4. 优化 draw() 和 update() 函数\n\n遵守绘制选项并将\
  \ `GameObject` 行为更新委托给 `RigidShape` 类：\n\n```javascript\ndraw(aCamera) {\n    if\
  \ (this.isVisible()) {\n        if (this.mDrawRenderable)\n            this.mRenderComponent.draw(aCamera);\n\
  \        if ((this.mRigidBody !== null) && (this.mDrawRigidShape))\n           \
  \ this.mRigidBody.draw(aCamera);\n    }\n}\n\nupdate() {\n    // simple default\
  \ behavior\n    if (this.mRigidBody !== null)\n        this.mRigidBody.update();\n\
  }\n```\n\n## 5. 编辑 game_object_set.js\n\n修改 `GameObjectSet` 类以支持为整个集合切换不同的绘制选项：\n\
  \n```javascript\n// ... identical to previous code ...\ntoggleDrawRenderable() {\n\
  \    let i;\n    for (i = 0; i < this.mSet.length; i++) {\n        this.mSet[i].toggleDrawRenderable();\n\
  \    }\n}\n\ntoggleDrawRigidShape() {\n    let i;\n    for (i = 0; i < this.mSet.length;\
  \ i++) {\n        this.mSet[i].toggleDrawRigidShape();\n    }\n}\n\ntoggleDrawBound()\
  \ {\n    let i;\n    for (i = 0; i < this.mSet.length; i++) {\n        let r = this.mSet[i].getRigidBody();\n\
  \        if (r !== null)\n            r.toggleDrawBound();\n    }\n}\n```\n\n##\
  \ RigidShape 功能测试\n\n`RigidShape` 旨在代表 `Renderable` 对象参与刚体形状模拟。因此，创建和测试不同组合的 `RigidShape`\
  \ 类型（包括圆形和矩形）与所有 `Renderable` 类型组合（更具体地说是 `TextureRenderable`、`SpriteRenderable`\
  \ 和 `SpriteAnimateRenderable`）至关重要。这些组合的正常运行可以证明 `RigidShape` 实现的正确性，并允许你直观地检查用简单圆形和矩形近似\
  \ `Renderable` 对象的适用性及局限性。\n\n测试程序 `MyGame` 的整体结构与之前的项目基本相似，源代码细节可能会分散注意力，因此此处不列出。以下描述测试对象及其如何满足指定要求。一如既往，源代码文件位于\
  \ `src/my_game` 文件夹，支持对象类位于 `src/my_game/objects` 文件夹。\n\n即将发生的碰撞测试需要操纵每个对象的位置和旋转。`WASDObj`\
  \ 类（在 `wasd_obj.js` 中实现）定义了 `GameObject` 的 WASD 键移动和 Z/X 键旋转控制。`Hero` 类（`WASDObj`\
  \ 的子类，在 `hero.js` 中实现）是一个带有 `SpriteRenderable` 和 `RigidRectangle` 的 `GameObject`。`Minion`\
  \ 类（也是 `WASDObj` 的子类，在 `minion.js` 中实现）是一个带有 `SpriteAnimateRenderable` 并由 `RigidCircle`\
  \ 或 `RigidRectangle` 包裹的 `GameObject`。基于这些支持类，创建的 `Hero` 和 `Minion` 对象涵盖了不同的 `Renderable`\
  \ 和 `RigidShape` 类型组合，允许你直观检查用不同 `RigidShape` 表示复杂纹理的准确性。\n\n游戏场景中的垂直和水平边界是带有 `TextureRenderable`\
  \ 和 `RigidRectangle` 的 `GameObject` 实例，由 `my_game_bounds.js` 文件中定义的 `wallAt()` 和\
  \ `platformAt()` 函数创建。`MyGame` 的构造函数、`init()`、`draw()`、`update()` 等在 `my_game_main.js`\
  \ 文件中定义，功能与之前的测试项目基本相同。\n\n## 观察\n\n\n\n现在你可以运行项目并观察创建的 `RigidShape` 对象。请注意，默认情况下，只绘制\
  \ `RigidShape` 对象。你可以通过按 `T` 键来切换开启 `Renderable` 对象的绘制来验证这一点。请注意 `Renderable` 对象的纹理是如何被相应的\
  \ `RigidShape` 实例包围的。你可以按 `R` 键来切换关闭 `RigidShape` 对象的绘制。通常，这正是游戏玩家所观察到的，即只绘制 `Renderable`\
  \ 而不绘制 `RigidShape` 对象。由于本章的重点在于刚性形状及其交互的模拟，因此默认显示 `RigidShape` 而不显示 `Renderable`\
  \ 对象。\n\n现在再次按 `T` 和 `R` 键以切换回 `RigidShape` 对象的绘制。`B` 键显示形状的圆形边界。下几节将要讨论的更精确且开销更大的碰撞计算，仅会在对象的这些边界重叠时才在对象之间进行。\n\
  \n你可以尝试使用 `WASD` 键移动当前选中的对象，默认情况下中心是 Hero。`Z`/`X` 和 `Y`/`U` 键允许你旋转并改变 Hero 的尺寸。按\
  \ `T` 键开启纹理，以验证旋转和移动同时应用于 `Renderable` 及其对应的 `RigidShape`，而 `Y`/`U` 键仅改变 `RigidShape`\
  \ 的尺寸。这使设计师能够控制用相应的 `RigidShape` 多紧密地包裹 `Renderable`。你可以按左/右箭头键来选择并操作场景中的任意对象。最后，`G`\
  \ 键会创建新的 Minion 对象，它们具有 `RigidCircle` 或 `RigidRectangle`。\n\n最后，请注意你可以将任何选中的对象移动到任何位置，包括与另一个\
  \ `RigidShape` 对象重叠。在现实世界中，刚性形状对象的重叠或相互渗透永远不会发生，而在模拟的数字世界中，这是一个必须解决的问题。随着 `RigidShape`\
  \ 类的功能得到验证，你现在可以研究如何计算这些形状之间的碰撞。\n\n## 碰撞检测\n\n为了模拟刚性形状的交互，你必须首先检测哪些形状彼此处于物理接触状态，或者哪些形状发生了碰撞。一般来说，在处理刚性形状碰撞时，有两个重要问题需要解决：计算开销以及形状重叠或相互渗透的情况。在下文中，将解释宽相位和窄相位方法作为一种降低计算开销的途径，并引入碰撞信息来记录相互渗透的状况，以便加以解决。本节和接下来的两小节将详细介绍圆-圆、矩形-矩形和圆-矩形碰撞的碰撞检测算法及实现。\n\
  \n## 宽相位和窄相位方法\n\n正如在介绍 `RigidShape` 对象的圆形边界时所讨论的，通常情况下，每个对象都必须与游戏场景中的其他每个对象进行碰撞测试。例如，如果你想检测五个对象\
  \ A、B、C、D 和 E 之间的碰撞，你必须对第一个对象 A 执行四次检测计算，分别针对对象 B、C、D 和 E。计算完 A 和 B 的结果后，接下来必须对第二个对象\
  \ B 执行三次碰撞检测，分别针对对象 C、D 和 E；随后对第三个对象 C 执行两次；最后对第四个对象 D 执行一次。第五个对象 E 已经针对其他四个对象进行过测试。虽然这一测试过程很彻底，但也有其缺点。如果没有专门的优化，你必须执行\
  \ `O(n²)` 次操作来检测 n 个对象之间的碰撞。\n\n在刚性形状模拟中，需要一种涉及大量计算的详细碰撞检测算法。这是因为必须计算出准确的结果，以支持有效的相互渗透解决和逼真的碰撞响应模拟。宽相位方法通过利用对象的邻近性来排除那些物理上相距甚远、因此明显不可能碰撞的对象，从而优化这一计算。这使得详细且计算密集型的算法（即窄相位方法）仅部署给物理上彼此接近的对象。\n\
  \n一种流行的宽相位方法使用轴对齐包围盒（`AABBs`）或包围圆来近似对象的邻近性。正如第 6 章详述的，`AABBs` 非常适合近似与主轴对齐的对象，但对于旋转的对象存在局限性。正如你通过按\
  \ `B` 键运行上一个项目所观察到的，包围圆是一个以对象为中心并完全包围该对象的圆。通过执行简单直接的包围盒/圆相交计算，可以仅关注边界重叠的对象作为窄相位碰撞检测操作的候选者。\n\
  \n还有其他宽相位方法，它们使用空间结构（如均匀网格或四叉树）或将对象组织成连贯的组（如包围碰撞体的层次结构）。宽相位方法的结果通常被送入中相位，最后送入窄相位碰撞检测方法。每个阶段都会缩小最终碰撞计算的候选范围，而每个后续阶段都会逐步变得更准确、开销更大。\n\
  \n## 碰撞信息\n\n除了报告对象是否发生碰撞外，碰撞检测算法还应计算并返回可用于解决和响应碰撞的信息。正如你在测试上一个项目时所观察到的，`RigidShape`\
  \ 对象在空间中可能会重叠，即相互渗透。由于现实世界中的刚性形状对象无法相互渗透，因此记录细节并解决 `RigidShape` 重叠至关重要。\n\n如图 9-4\
  \ 所示，碰撞和相互渗透的基本信息包括碰撞深度、法线、起点和终点。碰撞深度是对象相互渗透的最小量，碰撞法线是测量碰撞深度的方向。起点和终点是相互渗透的开始和结束位置，定义它们是为了方便将相互渗透绘制为线段。对于凸对象的任何相互渗透，总是可以通过沿碰撞法线移动碰撞对象碰撞深度的大小（或从起点到终点的距离）来解决。\n\
  \n![图 9-4 ¶ 碰撞信息](img/334805_2_En_9_Fig4_HTML.png)\n\n图 9-4 ¶ 碰撞信息\n\n## 圆碰撞与 CollisionInfo\
  \ 项目\n\n该项目构建了基于圆之间碰撞来计算和处理碰撞信息的基础设施。你可以在图 9-5 中看到该项目运行的示例。该项目的源代码定义在 `chapter9/9.2.circle_collisions_and_colllision_info`\
  \ 中。\n\n![图 9-5 ¶ 运行 CollisionInfo 和圆碰撞项目](img/334805_2_En_9_Fig5_HTML.jpg)\n\n\
  图 9-5 ¶ 运行 CollisionInfo 和圆碰撞项目\n\n该项目的控制方式与上一个项目相同，仅在绘制控制中增加了一个 `C` 键命令：\n\n**行为控制**：\n\
  \n- `G` 键：随机创建一个新的刚性圆或矩形\n\n**绘制控制**：\n\n- `C` 键：切换所有 `CollisionInfo` 的绘制\n- `T`\
  \ 键：切换所有对象的纹理\n- `R` 键：切换 `RigidShape` 的绘制\n- `B` 键：切换每个 `RigidShape` 边界的绘制\n\n\n\
  \n## 对象控制\n\n- 左/右箭头键：依次遍历并选择对象。\n- WASD 键：移动选中的对象。\n- Z/X 键：旋转选中的对象。\n- Y/U 键：增加/减小选中对象的\
  \ `RigidShape` 尺寸；这不会改变对应 `Renderable` 对象的尺寸。\n\n## 项目目标\n\n- 理解广相位碰撞检测的优缺点\n- 构建计算圆间碰撞的基础设施\n\
  - 通过 `CollisionInfo` 类定义并处理碰撞条件\n- 理解并实现圆碰撞检测算法\n\n## 定义 CollisionInfo 类\n\n必须定义一个新类来记录\
  \ `RigidShape` 相互穿透的情况，如图 9-4 所示：\n\n1. 在 `src/engine/rigid_shape` 文件夹中，创建 `collision_info.js`\
  \ 文件，从 `debugDraw` 导入，声明绘制颜色为品红，并定义 `CollisionInfo` 类：\n\n```javascript\nimport\
  \ * as debugDraw from \"../core/debug_draw.js\";\nlet kInfoColor = [1, 0, 1, 1];\
  \ // draw the info in magenta\nclass CollisionInfo {\n    ... implementation to\
  \ follow ...\n}\nexport default CollisionInfo;\n```\n\n2. 定义构造函数，包含对应图 9-4 中所示的碰撞深度、法线、起始和结束位置的实例变量：\n\
  \n```javascript\nconstructor() {\n    this.mDepth = 0;\n    this.mNormal = vec2.fromValues(0,\
  \ 0);\n    this.mStart = vec2.fromValues(0, 0);\n    this.mEnd = vec2.fromValues(0,\
  \ 0);\n}\n```\n\n3. 为变量定义 getter 和 setter：\n\n```javascript\ngetDepth() { return\
  \ this.mDepth; }\nsetDepth(s) { this.mDepth = s; }\ngetNormal() { return this.mNormal;\
  \ }\nsetNormal(s) { this.mNormal = s; }\ngetStart() { return this.mStart; }\ngetEnd()\
  \ { return this.mEnd; }\nsetInfo(d, n, s) {\n    this.mDepth = d;\n    this.mNormal[0]\
  \ = n[0];\n    this.mNormal[1] = n[1];\n    this.mStart[0] = s[0];\n    this.mStart[1]\
  \ = s[1];\n    vec2.scaleAndAdd(this.mEnd, s, n, d);\n}\n```\n\n4. 创建一个函数来翻转碰撞法线的方向。此函数将用于确保法线始终指向正在进行碰撞测试的对象。\n\
  \n```javascript\nchangeDir() {\n    vec2.scale(this.mNormal, this.mNormal, -1);\n\
  \    let n = this.mStart;\n    this.mStart = this.mEnd;\n    this.mEnd = n;\n}\n\
  ```\n\n5. 定义 `draw()` 函数，以品红色可视化起点、终点和碰撞法线：\n\n```javascript\ndraw(aCamera) {\n\
  \    debugDraw.drawLine(aCamera, this.mStart, this.mEnd, true, kInfoColor);\n}\n\
  ```\n\n最后，别忘了更新引擎访问文件 `index.js`，将新定义的功能转发给客户端。\n\n## 修改 RigidShape 类\n\n`RigidShape`\
  \ 类必须更新以支持碰撞。由于抽象基础形状 `RigidShape` 不包含实际的几何信息，实际的碰撞函数必须在矩形和圆形类中实现。\n\n### 修改 RigidRectangle\
  \ 类\n\n为提高可读性，碰撞支持将在单独的源代码文件 `rigid_rectangle_collision.js` 中实现：\n\n1. 修改 `rigid_rectangle.js`\
  \ 以从新源代码文件导入：\n\n```javascript\nimport RigidRectangle from \"./rigid_rectangle_collision.js\"\
  ;\nexport default RigidRectangle;\n```\n\n2. 在 `src/engine/rigid_shapes` 文件夹中，创建\
  \ `rigid_rectangle_collision.js` 文件，导入 `CollisionInfo` 和 `RigidRectangle`，并定义 `collisionTest()`\
  \ 函数始终返回碰撞失败状态。直到下一小节之前，与 `RigidRectangle` 形状的碰撞将始终失败。\n\n```javascript\nRigidRectangle.prototype.collisionTest\
  \ = function (otherShape, collisionInfo) {\n    let status = false;\n    if (otherShape.mType\
  \ === \"RigidCircle\") {\n        status = false;\n    } else {\n        status\
  \ = false;\n    }\n    return status;\n}\n```\n\n3. 记得导出扩展后的 `RigidRectangle` 类供客户端使用：\n\
  \n```javascript\nexport default RigidRectangle;\n```\n\n### 修改 RigidCircle 类\n\n\
  以与 `RigidRectangle` 完全相同的方式修改 `RigidCircle` 源代码文件：编辑 `rigid_circle.js` 以从 `rigid_circle_collision.js`\
  \ 导入。现在，你可以实现圆-圆碰撞检测了。\n\n1. 在 `src/engine/rigid_shape` 文件夹中，创建 `rigid_circle_collision.js`\
  \ 文件，导入 `RigidCircle`，并定义 `collisionTest()` 函数：如果 `otherShape` 不是 `RigidCircle`，则始终返回碰撞失败状态；否则，调用并返回\
  \ `collideCircCirc()` 的状态。目前，`RigidCircle` 不知道如何与 `RigidRectangle` 碰撞。\n\n```javascript\n\
  import RigidCircle from \"./rigid_circle_main.js\";\nRigidCircle.prototype.collisionTest\
  \ = function (otherShape, collisionInfo) {\n    let status = false;\n    if (otherShape.mType\
  \ === \"RigidCircle\") {\n        status = this.collideCircCirc(this, otherShape,\
  \ collisionInfo);\n    } else {\n        status = false;\n    }\n    return status;\n\
  }\n```\n\n2. 定义 `collideCircCirc()` 函数以检测两个圆之间的碰撞，并在检测到碰撞时计算相应的碰撞信息。碰撞检测有三种情况：无碰撞（步骤\
  \ 1）、两个圆心位于不同位置时的碰撞（步骤 2）、以及两个圆心位于完全相同位置时的碰撞（步骤 3）。以下代码展示了步骤 1，即无碰撞的检测；请注意，此代码也对应图\
  \ 9-2 所示的情况。\n\n```javascript\nRigidCircle.prototype.collideCircCirc = function\
  \ (c1, c2, collisionInfo) {\n    let vFrom1to2 = [0, 0];\n    // **步骤 1**：确定圆是否重叠\n\
  \    vec2.subtract(vFrom1to2, c2.getCenter(), c1.getCenter());\n    let rSum = c1.mRadius\
  \ + c2.mRadius;\n    let dist = vec2.length(vFrom1to2);\n    if (dist > Math.sqrt(rSum\
  \ * rSum)) {\n        // not overlapping\n        return false;\n    }\n    ...\
  \ implementation of Steps 2 and 3 to follow ...\n}\n```\n\n3. 当检测到碰撞时，如果两个圆心位于不同位置（步骤\
  \ 2），则可以按图 9-6 所示计算碰撞深度和法线。由于 `c2` 是对另一个 `RigidShape` 的引用，碰撞法线是一个从 `c1` 指向 `c2`\
  \ 的向量，或与 `vFrom1to2` 方向相同。碰撞深度是 `rSum` 和 `dist` 的差值，`c1` 的起始位置就是沿着负 `mFrom1to2`\
  \ 方向距离 `c2` 中心 `c2` 半径处的位置。\n\n![图 9-6 ¶ 圆-圆碰撞的细节 ](img/334805_2_En_9_Fig6_HTML.png)\n\
  \n图 9-6 ¶ 圆-圆碰撞的细节\n\n```javascript\n// Step 1: refer to previous step\nif (dist\
  \ !== 0) {\n    // **步骤 2**：碰撞圆心位于不同位置\n    vec2.normalize(vFrom1to2, vFrom1to2);\n\
  \    let vToC2 = [0, 0];\n    vec2.scale(vToC2, vFrom1to2, -c2.mRadius);\n    vec2.add(vToC2,\
  \ c2.getCenter(), vToC2);\n    collisionInfo.setInfo(rSum - dist, vFrom1to2, vToC2);\n\
  }\n... implementation of Step 3 to follow ...\n```\n\n4. 两个碰撞圆的最后一种情况是两个圆心都位于完全相同的位置（步骤\
  \ 3）。在这种情况下，碰撞法线被定义为负 y 方向，碰撞深度就是两个半径中较大的那个。\n\n\n\n\n## 定义物理组件\n\n现在你可以定义物理组件以触发碰撞检测计算：\n\
  \n1. 在 `src/engine/components` 文件夹中，创建 `physics.js` 文件，导入 `CollisionInfo` 并声明变量以支持该文件局部的计算。\n\
  \n2. 定义 `collideShape()` 函数以触发碰撞检测计算。请注意在实际调用形状 `collisionTest()` 之前的两个测试。首先，检查确保这两个形状不是同一个对象。其次，调用宽相位\
  \ `boundTest()` 方法以确定形状的接近程度。请注意，最后一个参数 `infoSet`，如果已定义，将包含所有成功碰撞的 `CollisionInfo`\
  \ 对象。定义它是为了支持可视化 `CollisionInfo` 对象，以便进行验证和调试。\n\n```javascript\nfunction collideShape(s1,\
  \ s2, infoSet = null) {\n    let hasCollision = false;\n    if (s1 !== s2) {\n \
  \       if (s1.boundTest(s2)) {\n            hasCollision = s1.collisionTest(s2,\
  \ mCInfo);\n            if (hasCollision) {\n                // 确保 mCInfo 始终是从 s1\
  \ 指向 s2\n                vec2.subtract(mS1toS2, s2.getCenter(), s1.getCenter());\n\
  \                if (vec2.dot(mS1toS2, mCInfo.getNormal()) < 0)\n              \
  \      mCInfo.changeDir();\n                // 用于展示碰撞 mCInfo！\n                if\
  \ (infoSet !== null) {\n                    infoSet.push(mCInfo);\n            \
  \        mCInfo = new CollisionInfo();\n                }\n            }\n     \
  \   }\n    }\n    return hasCollision;\n}\n```\n\n3. 定义实用函数以支持游戏开发者：`processSet()`\
  \ 用于执行同一 `GameObjectSet` 中所有对象之间的碰撞判定，`processObjToSet()` 用于检查给定 `GameObject` 与\
  \ `GameObjectSet` 中对象之间的碰撞，`processSetToSet()` 用于检查两个不同 `GameObjectSets` 中所有对象之间的碰撞。\n\
  \n```javascript\n// 碰撞 GameObjectSet 中所有对象与其自身\nfunction processSet(set, infoSet\
  \ = null) {\n    let i = 0, j = 0;\n    let hasCollision = false;\n    for (i =\
  \ 0; i < set.size(); i++) {\n        let s1 = set.getObjectAt(i).getRigidBody();\n\
  \        for (j = i + 1; j < set.size(); j++) {\n            let s2 = set.getObjectAt(j).getRigidBody();\n\
  \            hasCollision = collideShape(s1, s2, infoSet) || hasCollision;\n   \
  \     }\n    }\n    return hasCollision;\n}\n\n// 碰撞给定的 GameObject 与一个 GameObjectSet\n\
  function processObjToSet(obj, set, infoSet = null) {\n    let j = 0;\n    let hasCollision\
  \ = false;\n    let s1 = obj.getRigidBody();\n    for (j = 0; j < set.size(); j++)\
  \ {\n        let s2 = set.getObjectAt(j).getRigidBody();\n        hasCollision =\
  \ collideShape(s1, s2, infoSet) || hasCollision;\n    }\n    return hasCollision;\n\
  }\n\n// 碰撞两个不同 GameObjectSets 中的所有对象\nfunction processSetToSet(set1, set2, infoSet\
  \ = null) {\n    let i = 0, j = 0;\n    let hasCollision = false;\n    for (i =\
  \ 0; i < set1.size(); i++) {\n        let s1 = set1.getObjectAt(i).getRigidBody();\n\
  \        for (j = 0; j < set2.size(); j++) {\n            let s2 = set2.getObjectAt(j).getRigidBody();\n\
  \            hasCollision = collideShape(s1, s2, infoSet) || hasCollision;\n   \
  \     }\n    }\n    return hasCollision;\n}\n```\n\n4. 现在，导出所有定义的功能：\n\n```javascript\n\
  export {\n    // 碰撞两个形状\n    collideShape,\n    // 碰撞处理\n    processSet, processObjToSet,\
  \ processSetToSet\n}\n```\n\n最后，记得更新引擎访问文件 `index.js`，将新定义的功能转发给客户端。\n\n## 修改 MyGame\

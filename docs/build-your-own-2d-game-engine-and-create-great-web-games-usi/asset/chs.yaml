- "# 第 1 章：使用 JavaScript 进行 2D 游戏引擎开发简介\n\n**Kelvin Sung**<sup>1</sup>、**Jebediah\
  \ Pavleas**<sup>2</sup>、**Matthew Munson**<sup>3</sup> 和 **Jason Pace**<sup>4</sup>\n\
  \n1. 美国华盛顿州博塞尔  \n2. 美国华盛顿州肯莫尔  \n3. 美国华盛顿州莱克福雷斯特帕克  \n4. 美国俄勒冈州波特兰\n\n## 摘要\n\n\
  视频游戏是复杂、交互式、多媒体软件系统。它们必须实时处理玩家输入、模拟半自主对象的交互、生成高保真图形和音频输出，同时还要努力保持玩家的参与度。构建视频游戏的尝试可能会迅速变得令人不知所措，因为需要精通软件开发，同时还要懂得如何创造吸引人的玩家体验。第一个挑战可以通过软件库或游戏引擎来缓解，其中包含一组专门为开发视频游戏设计的连贯实用工具和对象。玩家参与度的目标通常通过在视频游戏开发过程中仔细的游戏玩法设计和微调来实现。本书讲述游戏引擎的设计与开发；它将专注于实现并隐藏引擎的繁琐操作，同时支持许多复杂的模拟。通过本书中的项目，您将构建一个实用的游戏引擎，用于开发可通过互联网访问的视频游戏。\n\
  \n\n\n\n\n游戏引擎使游戏开发者免于实现简单的例行任务，例如解码键盘上的特定按键、为常见操作设计复杂算法（如在二维世界中模拟阴影），以及理解实现细节中的细微差别（如强制物理模拟的精度容差）。成熟且成熟的商业游戏引擎，如\
  \ *Unity*、*Unreal Engine* 和 *Panda3D*，通过图形用户界面（GUI）展示其系统。友好的 GUI 不仅简化了游戏设计中一些繁琐的过程，例如在关卡中创建和放置对象，更重要的是，它确保了这些游戏引擎对具有不同背景的创意设计师也易于使用，这些设计师可能会觉得软件开发的细节令人分心。\n\
  \n本书专注于独立于 GUI 的游戏引擎核心功能。虽然全面的 GUI 系统可以改善最终用户体验，但其实现需求也可能分散并使游戏引擎的基础变得复杂。例如，用户界面系统中强制兼容数据类型的问题，如限制特定类的对象被指定为阴影接收者，这对\
  \ GUI 设计很重要，但与游戏引擎的核心功能无关。\n\n本书从两个重要方面切入游戏引擎开发：可编程性和可维护性。作为一个软件库，游戏引擎的接口应通过良好抽象的实用方法和对象来促进游戏开发者的可编程性，这些方法和对象隐藏简单的例行任务并支持复杂但常见的操作。作为一个软件系统，游戏引擎的代码库应通过精心设计的基础设施和良好组织的源代码系统来支持可维护性，从而实现代码复用、持续的系统维护、改进和扩展。\n\
  \n本章描述了本书的实现技术和组织结构。讨论将引导您完成下载、安装和设置开发环境的步骤，指导您构建第一个 HTML5 应用程序，并利用这一首次应用程序开发经验，解释阅读和学习本书的最佳方法。\n\
  \n## 技术\n\n构建一个允许游戏通过万维网访问的游戏引擎的目标，是由免费可用的技术实现的。\n\nJavaScript 几乎被所有网页浏览器支持，因为解释器安装在世界上几乎每一台个人电脑上。作为一种编程语言，JavaScript\
  \ 是动态类型的，支持继承和作为一等对象的函数，并且由于拥有成熟的用户和开发者社区，易于学习。凭借这一战略性技术选择，基于 JavaScript 开发的视频游戏可以通过适当的网页浏览器，让互联网上的任何人访问。因此，JavaScript\
  \ 是面向大众开发视频游戏的最佳编程语言之一。\n\n虽然 JavaScript 是实现游戏逻辑和算法的绝佳工具，但仍需要以软件库或应用程序编程接口（API）形式存在的额外技术，来支持用户输入和媒体输出需求。为了构建可通过网页浏览器在互联网上访问的游戏，HTML5\
  \ 和 WebGL 提供了理想的互补输入和输出 API。\n\nHTML5 旨在跨互联网构建和呈现内容。它包含详细的处理模型和相关 API，用于处理用户输入和多媒体输出。这些\
  \ API 是 JavaScript 原生的，非常适合实现基于浏览器的视频游戏。虽然 HTML5 提供了基本的可缩放矢量图形（SVG）API，但它不支持视频游戏所需的复杂效果，如实时光照、爆炸或阴影。Web\
  \ 图形库（WebGL）是一个专门设计用于通过网页浏览器生成二维和三维计算机图形的 JavaScript API。凭借对 OpenGL 着色语言（GLSL）的支持以及访问客户端机器上图形处理单元（GPU）的能力，WebGL\
  \ 能够实时生成高度复杂的图形效果，非常适合作为基于浏览器的视频游戏的图形 API。\n\n本书讲述游戏引擎的概念与开发，其中 JavaScript、HTML5\
  \ 和 WebGL 仅仅是实现工具。本书的讨论侧重于应用这些技术来实现所需功能，而不试图涵盖技术本身的细节。例如，在游戏引擎中，继承是通过基于对象原型链的 JavaScript\
  \ 类功能实现的；然而，基于原型的脚本语言的优点并未讨论。引擎的音频提示和背景音乐功能基于 HTML5 `AudioContext` 接口，但其功能范围未作描述。游戏引擎对象基于\
  \ WebGL 纹理贴图绘制，而 WebGL 纹理子系统的特性未作展示。技术的具体细节会分散对游戏引擎讨论的注意力。本书的关键学习成果是游戏引擎的概念和实现策略，而非任何技术的细节。这样，读完本书后，您将能够基于任何可比较的技术集（如\
  \ C# 和 MonoGame、Java 和 JOGL、C++ 和 Direct3D 等）构建类似的游戏引擎。如果您想了解更多或复习 JavaScript、HTML5\
  \ 或 WebGL，请参阅本章末尾“技术”部分的参考资料。\n\n## 设置您的开发环境\n\n您将构建的游戏引擎将可通过网页浏览器访问，这些浏览器可能运行在任何操作系统（OS）上。您即将设置的开发环境也是与操作系统无关的。为简单起见，以下说明基于\
  \ Windows 10 操作系统。您应该能够通过微小的修改在类 Unix 环境（如 MacOS 或 Ubuntu）中复现类似的环境。\n\n您的开发环境包括一个集成开发环境（IDE）和一个能够托管运行中游戏引擎的运行时网页浏览器。我们发现最方便的系统是\
  \ Visual Studio Code (VS Code) IDE，搭配 Google Chrome 网页浏览器作为运行时环境。详情如下：\n\n- **IDE**：本书中的所有项目均基于\
  \ VS Code IDE。您可以从 [`code.visualstudio.com/`](https://code.visualstudio.com/) 下载并安装该程序。\n\
  - **运行时环境**：您将在 Google Chrome 网页浏览器中执行视频游戏项目。您可以从 [www.google.com/chrome/browser/](http://www.google.com/chrome/browser/)\
  \ 下载并安装此浏览器。\n- `glMatrix` 数学库：这是一个实现基础数学运算的库。您可以从 [`glMatrix.net/`](http://glmatrix.net/)\
  \ 下载此库。您将在第 3 章中将此库集成到您的游戏引擎中，届时将提供更多细节。\n\n请注意，支持 JavaScript 编程语言、HTML5 或 WebGL\
  \ 没有特定的系统要求。所有这些技术都嵌入在网页浏览器运行时环境中。\n\n**注意**\n\n如前所述，我们选择基于 VS Code 的开发环境是因为我们发现它最方便。还有许多其他免费的替代方案，包括但不限于\
  \ NetBeans、IntelliJ IDEA、Eclipse 和 Sublime。\n\n### 下载并安装 JavaScript 语法检查器\n\n我们发现\

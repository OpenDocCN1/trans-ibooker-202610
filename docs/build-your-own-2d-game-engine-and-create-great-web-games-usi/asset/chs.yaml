  overrightarrow{\\\\mathrm{V}}}\\_{\\\\mathrm{A}\\\\mathrm{B}1}\\\\bullet \\\\hat{\\\
  \\mathrm{T}}+{\\\\mathrm{j}}\\_{\\\\mathrm{T}}\\\\left(\\\\frac{1}{{\\\\mathrm{m}}\\\
  _{\\\\mathrm{A}}}+\\\\frac{1}{{\\\\mathrm{m}}\\_{\\\\mathrm{B}}}\\\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq67.png)\n\
  \n最后，合并项并求解 `jT` 或切向冲量，得到以下结果：\n\n*   ![$$ {\\\\mathrm{j}}\\_{\\\\mathrm{T}}=\\\\\
  frac{\\\\left(\\\\mathrm{f}-1\\\\right)\\\\left({\\\\overrightarrow{\\\\mathrm{V}}}\\\

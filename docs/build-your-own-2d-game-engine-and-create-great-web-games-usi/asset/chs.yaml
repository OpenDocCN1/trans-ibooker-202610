  \n### 观察\n\n你现在可以运行项目，注意到六个 minion 稍微复杂一些的运动是通过更简洁的 `init()` 和 `update()` 函数实现的。`init()`\
  \ 函数仅包含在游戏世界中放置创建对象的逻辑和控制，不包含针对不同对象类型的任何特定设置。随着 `Minion` 对象在其自身的 `update()` 函数中定义运动行为，`MyGame`\
  \ 的 `update()` 函数中的逻辑可以专注于关卡的细节。请注意，该函数的结构清晰地表明这三个对象是独立更新的，彼此之间没有交互。\n\n> **注意**\n\
  >\n> 全书几乎所有情况下，`MyGame` 类的设计都是为了展示引擎功能。因此，大多数 `MyGame` 类中的源代码组织可能不代表实现游戏的最佳实践。\n\
  \n## 创建追逐行为\n\n仔细观察之前的项目会发现，虽然屏幕上有不少 minion 在移动，但它们的运动简单且枯燥。尽管速度和方向有变化，但这些运动缺乏目的性，也无法感知场景中的其他游戏对象。为了支持更复杂或有趣的运动，`GameObject`\
  \ 需要感知其他对象的位置，并根据该信息确定运动。\n\n追逐行为就是一个这样的例子。追逐对象的目标通常是捕获其锁定的游戏对象。这需要通过编程操控追逐者的朝向和速度，使其能够锁定目标。然而，通常重要的是要避免实现一个瞄准完美、总能命中目标的追逐者——因为如果玩家无法避免被击中，游戏就会变得难以取胜。尽管如此，这并不意味着如果你的游戏设计需要，你就不应该实现一个完美的追逐者。你将在下一个项目中实现一个追逐者。\n\
  \n向量及其相关运算是实现对象运动和行为的基础。在使用向量编程之前，先进行快速回顾。与矩阵和变换操作符一样，以下讨论并不旨在全面覆盖向量理论。相反，重点在于与游戏引擎实现相关的一小部分概念的应用。这不是对数学背后理论的研究。如果你对向量的具体细节及其与游戏的关系感兴趣，请参阅第\
  \ 1 章的讨论，你可以通过深入研读线性代数和游戏相关书籍，更深入地了解这些主题。\n\n### 向量回顾\n\n向量广泛应用于数学、物理学、计算机科学和工程学等许多研究领域。它们在游戏中尤为重要；几乎每个游戏都以某种方式使用向量。由于它们的应用如此广泛，本节专门用于理解和在游戏中利用向量。\n\
  \n> **注意**\n>\n> 关于向量的入门和全面介绍，可参考 [www.storyofmathematics.com/vectors](http://www.storyofmathematics.com/vectors)。关于向量在游戏中的详细应用，可参考\
  \ *Basic Math for Game Development with Unity 3D: A Beginner’s Guide to Mathematical\
  \ Foundations*，Apress，2019。\n\n向量最常见的用途之一是表示对象的位移和方向或*速度*。这很容易实现，因为向量由其大小和方向定义。仅使用这少量信息，你就可以表示对象的速度或加速度等属性。如果你拥有对象的位置、方向和速度，就拥有了在无需用户输入的情况下在游戏世界中移动它的充分信息。\n\
  \n在进一步深入之前，回顾向量的概念很重要，从如何定义向量开始。向量可以用两个点来指定。例如，给定任意位置 *P*[*a*] = (*x*[*a*], *y*[*a*])\
  \ 和 *P*[*b*] = (*x*[*b*], *y*[*b*])，你可以定义从 *P*[*a*] 到 *P*[*b*] 的向量，即 ![$$ {\\overset{\\\
  rightharpoonup }{V}}_{ab} $$](img/334805_2_En_6_Chapter_TeX_IEq1.png)，计算为 *P*[*b*]\
  \ − *P*[*a*]。你可以在以下公式和图 6-3 中看到这一点：\n\n*   *P*[*a*] = (*x*[*a*], *y*[*a*])\n*  \
  \ *P*[*b*] = (*x*[*b*], *y*[*b*])\n*   ![$$ {\\overset{\\rightharpoonup }{V}}_{ab}={P}_b-{P}_a=\\\
  left({x}_b-{x}_a,{y}_b-{y}_a\\right) $$](img/334805_2_En_6_Chapter_TeX_IEq2.png)\n\
  \n![图 6-3 ¶ 由两个点定义的向量](img/334805_2_En_6_Fig3_HTML.png)\n\n**图 6-3** ¶ 由两个点定义的向量\n\
  \n现在你有了向量 ![$$ {\\overset{\\rightharpoonup }{V}}_{ab} $$](img/334805_2_En_6_Chapter_TeX_IEq3.png)，你可以轻松确定其长度（或大小）和方向。向量的长度等于创建它的两点之间的距离。在本例中，![$$\
  \ {\\overset{\\rightharpoonup }{V}}_{ab} $$](img/334805_2_En_6_Chapter_TeX_IEq4.png)\
  \ 的长度等于 *P*[*a*] 和 *P*[*b*] 之间的距离，而 ![$$ {\\overset{\\rightharpoonup }{V}}_{ab}\
  \ $$](img/334805_2_En_6_Chapter_TeX_IEq5.png) 的方向是从 *P*[*a*] 指向 *P*[*b*]。\n\n> **注意**\n\
  >\n> 向量的大小通常称为其长度或*模*。\n\n\n\n\n## gl-matrix 中的向量运算\n\n## 概述\n\n在 `gl-matrix` 库中，`vec2`\
  \ 对象实现了二维向量的功能。方便的是，你也可以使用 `vec2` 对象来表示空间中的二维点或位置。在前面的示例中，*P*[*a*]、*P*[*b*] 和 ![$$\
  \ {\\overset{\\rightharpoonup }{V}}_{ab} $$](img/334805_2_En_6_Chapter_TeX_IEq6.png)\
  \ 都可以作为 `vec2` 对象的实例来实现。然而，![$$ {\\overset{\\rightharpoonup }{V}}_{ab} $$](img/334805_2_En_6_Chapter_TeX_IEq7.png)\
  \ 才是数学上定义的向量。*P*[*a*] 和 *P*[*b*] 代表用于创建向量的位置或点。\n\n回顾一下，向量也可以被归一化。*归一化* 向量（也称为*单位向量*）的大小始终为\
  \ 1。你可以通过以下函数看到归一化向量，如图 6-4 所示。注意，普通向量的数学符号是 ![$$ {\\overset{\\rightharpoonup }{V}}_a\
  \ $$](img/334805_2_En_6_Chapter_TeX_IEq8.png)，而归一化向量的符号是 ![$$ {\\hat{V}}_a $$](img/334805_2_En_6_Chapter_TeX_IEq9.png)：\n\
  \n*   ![$$ vec2. normalized\\left({\\overset{\\rightharpoonup }{V}}_a\\ \\right)\
  \ $$](img/334805_2_En_6_Chapter_TeX_IEq10.png): 归一化向量 ![$$ {\\overset{\\rightharpoonup\
  \ }{V}}_a $$](img/334805_2_En_6_Chapter_TeX_IEq11.png) 并将结果存储到 `vec2` 对象中\n\n![Figure\
  \ 6-4 ¶ A vector being normalized](img/334805_2_En_6_Fig4_HTML.png)\n\n图 6-4 ¶ 向量归一化\n\
  \n指向位置的向量也可以被旋转。例如，如果向量 ![$$ \\overset{\\rightharpoonup }{V}=\\left({x}_v,{y}_v\\\
  right) $$](img/334805_2_En_6_Chapter_TeX_IEq12.png) 表示从原点指向位置 (*x*[*v*], *y*[*v*])\
  \ 的方向，并且你想将其旋转 θ 角度，则如图 6-5 所示，你可以使用以下公式来求出 *x*[*r*] 和 *y*[*r*]：\n\n*   *x*[*r*]\
  \ = *x*[*v*] cos *θ* − *y*[*v*] sin *θ*\n*   *y*[*r*] = *x*[*v*] sin *θ* + *y*[*v*]\
  \ cos *θ*\n\n![Figure 6-5 ¶ A vector from the origin to the position (xv, yv) being\
  \ rotated by the angle theta](img/334805_2_En_6_Fig5_HTML.png)\n\n图 6-5 ¶ 从原点指向位置\
  \ (*x*[*v*], *y*[*v*]) 的向量被角度 theta 旋转\n\n> **注意**\n>\n> JavaScript 三角函数，包括 `Math.sin()`\
  \ 和 `Math.cos()` 函数，假设输入为弧度而非角度。回顾一下，1 度等于 ![$$ \\frac{\\uppi}{180} $$](img/334805_2_En_6_Chapter_TeX_IEq13.png)\
  \ 弧度。\n\n始终重要的是要记住，向量由其方向和大小定义。换句话说，两个向量可以相等，而与向量的位置无关。图 6-6 显示了两个向量 ![$$ {\\overset{\\\
  rightharpoonup }{V}}_a $$](img/334805_2_En_6_Chapter_TeX_IEq14.png) 和 ![$$ {\\overset{\\\
  rightharpoonup }{V}}_{bc} $$](img/334805_2_En_6_Chapter_TeX_IEq15.png)，它们位于不同的位置，但具有相同的方向和大小，因此它们相等。相比之下，向量\
  \ ![$$ {\\overrightarrow{V}}_d $$](img/334805_2_En_6_Chapter_TeX_IEq16.png) 不同，因为它的方向和大小与其他向量不同。\n\
  \n![Figure 6-6 ¶ Three vectors represented in 2D space with two vectors equal to\
  \ each other](img/334805_2_En_6_Fig6_HTML.png)\n\n图 6-6 ¶ 二维空间中表示的三个向量，其中两个向量相等\n\
  \n## 点积\n\n两个归一化向量的点积提供了求这两个向量夹角的方法。例如，给定以下内容：\n\n*   ![$$ {\\overset{\\rightharpoonup\
  \ }{V}}_1=\\left({x}_1,{y}_1\\right) $$](img/334805_2_En_6_Chapter_TeX_IEq17.png)\n\
  *   ![$$ {\\overset{\\rightharpoonup }{V}}_2=\\left({x}_2,{y}_2\\right) $$](img/334805_2_En_6_Chapter_TeX_IEq18.png)\n\
  \n则以下成立：\n\n*   ![$$ {\\overset{\\rightharpoonup }{V}}_1\\bullet {\\overset{\\rightharpoonup\
  \ }{V}}_2={\\overset{\\rightharpoonup }{V}}_2\\bullet {\\overset{\\rightharpoonup\
  \ }{V}}_1={x}_1{x}_2+{y}_1{y}_2 $$](img/334805_2_En_6_Chapter_TeX_IEq19.png)。\n\n\
  此外，如果向量 ![$$ {\\overset{\\rightharpoonup }{V}}_1 $$](img/334805_2_En_6_Chapter_TeX_IEq20.png)\
  \ 和 ![$$ {\\overset{\\rightharpoonup }{V}}_2 $$](img/334805_2_En_6_Chapter_TeX_IEq21.png)\
  \ 都是归一化的，则\n\n*   ![$$ {\\hat{V}}_1\\bullet {\\hat{V}}_2=\\cos \\theta $$](img/334805_2_En_6_Chapter_TeX_IEq22.png)\n\
  \n图 6-7 描绘了 ![$$ {\\overset{\\rightharpoonup }{V}}_1 $$](img/334805_2_En_6_Chapter_TeX_IEq23.png)\
  \ 和 ![$$ {\\overset{\\rightharpoonup }{V}}_2 $$](img/334805_2_En_6_Chapter_TeX_IEq24.png)\
  \ 向量及其夹角 *θ* 的示例。同样重要的是要认识到，如果 ![$$ {\\overset{\\rightharpoonup }{V}}_1\\bullet\
  \ {\\overset{\\rightharpoonup }{V}}_2=0 $$](img/334805_2_En_6_Chapter_TeX_IEq25.png)，则这两个向量垂直。\n\
  \n![Figure 6-7 ¶ The angle between two vectors, which can be found through the dot\
  \ product](img/334805_2_En_6_Fig7_HTML.png)\n\n图 6-7 ¶ 两个向量之间的夹角，可通过点积求得\n\n> **注意**\n\
  >\n> 如果你需要复习或温习点积的概念，请参考 [www.mathsisfun.com/algebra/vectors-dot-product.html](http://www.mathsisfun.com/algebra/vectors-dot-product.html)。\n\
  \n## 叉积\n\n两个向量的叉积产生一个与原始两个向量都 *正交*（即垂直）的向量。在二维游戏中，二维维度平铺在屏幕上，叉积的结果是一个指向内部（朝向屏幕）或外部（远离屏幕）的向量。这可能看起来很奇怪，因为在二维或\
  \ x/y 平面上叉乘两个向量会产生一个位于第三维度或 z 轴上的向量，这不符合直觉。然而，第三维度中的结果向量包含关键信息。例如，该向量在第三维度中的方向可用于确定游戏对象需要顺时针还是逆时针旋转。仔细看看以下内容：\n\
  \n*   ![$$ {\\overset{\\rightharpoonup }{V}}_1=\\left({x}_1,{y}_1\\right) $$](img/334805_2_En_6_Chapter_TeX_IEq26.png)\n\
  *   ![$$ {\\overset{\\rightharpoonup }{V}}_2=\\left({x}_2,{y}_2\\right) $$](img/334805_2_En_6_Chapter_TeX_IEq27.png)\n\
  \n鉴于上述内容，以下成立：\n\n*   ![$$ {\\overset{\\rightharpoonup }{V}}_3={\\overset{\\rightharpoonup\
  \ }{V}}_1\\times {\\overset{\\rightharpoonup }{V}}_2 $$](img/334805_2_En_6_Chapter_TeX_IEq28.png)\
  \ 是一个同时垂直于 ![$$ {\\overset{\\rightharpoonup }{V}}_1 $$](img/334805_2_En_6_Chapter_TeX_IEq29.png)\
  \ 和 ![$$ {\\overset{\\rightharpoonup }{V}}_2 $$](img/334805_2_En_6_Chapter_TeX_IEq30.png)\
  \ 的向量。\n\n\n\n\n此外，您知道 x/y 平面上两个向量的叉积会产生一个指向 z 方向的向量。当 $\\vec{V}_1 \\times \\vec{V}_2\
  \ > 0$ 时，您知道 $\\vec{V}_1$ 相对于 $\\vec{V}_2$ 在**顺时针**方向；类似地，当 $\\vec{V}_1 \\times\
  \ \\vec{V}_2 < 0$ 时，您知道 $\\vec{V}_1$ 在**逆时针**方向。图 6-8 应有助于阐明这一概念。\n\n![图 6-8 ¶ 两个向量的叉积](img/334805_2_En_6_Fig8_HTML.png)\n\
  \n**图 6-8** ¶ 两个向量的叉积\n\n> **注意**\n>\n> 如果您需要复习或温习叉积的概念，请参阅 [www.mathsisfun.com/algebra/vectors-cross-product.html](http://www.mathsisfun.com/algebra/vectors-cross-product.html)。\n\
  \n## “正向与追逐”项目\n\n该项目基于已回顾的向量概念，实现了更有趣、更复杂的行为。您将不再局限于恒定且无目的的运动，而是会体验定义和改变物体前进方向，以及引导场景中的一个物体去追逐另一个物体的过程。您可以在图\
  \ 6-9 中看到该项目运行的示例。该项目的源代码定义在 `chapter6/6.2.front_and_chase` 文件夹中。\n\n![图 6-9 ¶ 运行“正向与追逐”项目](img/334805_2_En_6_Fig9_HTML.jpg)\n\
  \n**图 6-9** ¶ 运行“正向与追逐”项目\n\n项目控制方式如下：\n\n*   **`WASD` 键**：移动 `Hero`（英雄）对象\n*  \
  \ **左/右箭头键**：当 `Brain`（大脑）对象处于用户控制下时，改变其前进方向\n*   **上/下箭头键**：增加/减少 `Brain` 对象的速度\n\
  *   **`H` 键**：将 `Brain` 对象切换为用户箭头键控制模式\n*   **`J` 键**：将 `Brain` 对象切换为始终指向并移动至当前\
  \ `Hero` 对象位置模式\n*   **`K` 键**：将 `Brain` 对象切换为逐渐转向并移动至当前 `Hero` 对象位置模式\n\n项目目标如下：\n\
  \n*   体验速度与方向的配合使用\n*   练习沿预定义方向移动\n*   使用向量点积和叉积实现算法\n*   检查并实现追逐行为\n\n您可以在 `assets`\
  \ 文件夹中找到与上一个项目相同的外部资源文件。\n\n### 向 `gl-matrix` 库添加向量旋转功能\n\n`gl-matrix` 库不支持在二维空间中旋转位置。可以通过向\
  \ `lib` 文件夹中的 `gl-matrix.js` 文件添加以下代码来修复此问题：\n\n```javascript\nvec2.rotate = function(out,\
  \ a, c) {\n    var r = [];\n    // 执行旋转\n    r[0] = a[0] * Math.cos(c) - a[1] *\
  \ Math.sin(c);\n    r[1] = a[0] * Math.sin(c) + a[1] * Math.cos(c);\n    out[0]\
  \ = r[0];\n    out[1] = r[1];\n    return r;\n};\n```\n\n> **注意**\n>\n> 从现在开始，所有项目都必须包含对\
  \ `gl-matrix` 库的此修改。\n\n### 修改 `GameObject` 以支持有趣的行为\n\n`GameObject` 类抽象并实现了所需的新对象行为：\n\
  \n1.  编辑 `game_object.js` 文件并修改 `GameObject` 构造函数，以定义可见性、前进方向和速度：\n\n```javascript\n\
  constructor(renderable) {\n    this.mRenderComponent = renderable;\n    this.mVisible\
  \ = true;\n    this.mCurrentFrontDir = vec2.fromValues(0, 1); // 前进方向\n    this.mSpeed\
  \ = 0;\n}\n```\n\n2.  为实例变量添加访问器和设置器函数：\n\n```javascript\ngetXform() { return this.mRenderComponent.getXform();\
  \ }\nsetVisibility(f) { this.mVisible = f; }\nisVisible() { return this.mVisible;\
  \ }\nsetSpeed(s) { this.mSpeed = s; }\ngetSpeed() { return this.mSpeed; }\nincSpeedBy(delta)\
  \ { this.mSpeed += delta; }\nsetCurrentFrontDir(f) { vec2.normalize(this.mCurrentFrontDir,\
  \ f); }\ngetCurrentFrontDir() { return this.mCurrentFrontDir; }\ngetRenderable()\
  \ { return this.mRenderComponent; }\n```\n\n3.  实现一个函数，以指定速率 `rate` 将前进方向旋转朝向位置\
  \ `p`：\n\n```javascript\nrotateObjPointTo(p, rate) {\n    // 步骤 A：确定是否到达目标位置 p\n\
  \    let dir = [];\n    vec2.sub(dir, p, this.getXform().getPosition());\n    let\
  \ len = vec2.length(dir);\n    if (len < Number.MIN_VALUE) {\n        return; //\
  \ 已到达。\n    }\n    vec2.scale(dir, dir, 1 / len);\n    // 步骤 B：计算旋转角度\n    let fdir\
  \ = this.getCurrentFrontDir();\n    let cosTheta = vec2.dot(dir, fdir);\n    if\
  \ (cosTheta > 0.999999) { // 方向几乎完全相同\n        return;\n    }\n    // 步骤 C：将 cosTheta\
  \ 限制在 -1 到 1 之间\n    // 在理想世界中，这永远不会发生！但是……\n    if (cosTheta > 1) {\n        cosTheta\
  \ = 1;\n    } else {\n        if (cosTheta < -1) {\n            cosTheta = -1;\n\
  \        }\n    }\n    // 步骤 D：利用叉积结果判断是顺时针还是逆时针旋转\n    let dir3d = vec3.fromValues(dir[0],\
  \ dir[1], 0);\n    let f3d = vec3.fromValues(fdir[0], fdir[1], 0);\n    let r3d\
  \ = [];\n    vec3.cross(r3d, f3d, dir3d);\n    let rad = Math.acos(cosTheta);  //\
  \ 需旋转的弧度\n    if (r3d[2] < 0) {\n        rad = -rad;\n    }\n    // 步骤 E：根据角度和速率旋转朝向方向\n\
  \    rad *= rate;  // 从对象前方向开始实际需要旋转的角度\n    vec2.rotate(this.getCurrentFrontDir(),\
  \ this.getCurrentFrontDir(), rad);\n    this.getXform().incRotationByRad(rad);\n\
  }\n```\n\n`rotateObjPointTo()` 函数以参数 `rate` 指定的速率，将 `mCurrentFrontDir` 旋转使其指向目标位置\
  \ `p`。以下是各操作步骤的详细说明：\n\n1.  **步骤 A** 计算当前对象与目标位置 `p` 之间的距离。如果该值很小，意味着当前对象和目标位置很接近。函数直接返回，不再进行后续处理。\n\
  \n2.  **步骤 B**，如图 6-10 所示，计算点积以确定对象当前前进方向 (`fdir`) 与指向目标位置 `p` 的方向 (`dir`) 之间的夹角\
  \ θ。如果这两个向量指向相同方向（cosθ 接近 1 或 θ 接近零），函数返回。\n\n![图 6-10 ¶ 一个 GameObject (Brain) 正在追逐目标](img/334805_2_En_6_Fig10_HTML.png)\n\
  \n**图 6-10** ¶ 一个 `GameObject` (`Brain`) 正在追逐目标 (`Hero`)\n\n3.  **步骤 C** 检查 `cosTheta`\
  \ 的范围。由于 JavaScript 中浮点运算的不准确性，必须执行此步骤。\n\n4.  **步骤 D** 利用叉积的结果，判断当前 `GameObject`\
  \ 应该顺时针还是逆时针转向，以面向目标位置 `p`。\n\n5.  **步骤 E** 旋转 `mCurrentFrontDir` 并在 `Renderable`\
  \ 对象的 `Transform` 中设置旋转。重要的是要认识到这两个独立的对象旋转控制。`Transform` 控制绘制内容的旋转，而 `mCurrentFrontDir`\
  \ 控制移动方向。在这种情况下，两者是同步的，因此必须同时用新值更新它们。\n\n4.  [内容继续...]\n\n\n\n\n## 追踪功能与碰撞检测\n\n\
  添加一个函数，根据对象的方向和速度更新其位置。请注意，如果 `mCurrentFrontDir` 被 `rotateObjPointTo()` 函数修改，则此\
  \ `update()` 函数将使对象朝向目标位置 `p` 移动，对象的行为将如同在追踪目标。\n\n```javascript\nupdate() {\n \
  \   // 简单的默认行为\n    let pos = this.getXform().getPosition();\n    vec2.scaleAndAdd(pos,\
  \ pos, this.getCurrentFrontDir(), this.getSpeed());\n}\n```\n\n添加一个函数，根据可见性设置绘制对象：\n\
  \n```javascript\ndraw(aCamera) {\n    if (this.isVisible()) {\n        this.mRenderComponent.draw(aCamera);\n\
  \    }\n}\n```\n\n## 测试追踪功能\n\n此测试用例的策略和目标是创建一个可转向的 `Brain` 对象，以演示沿预定义前方向移动，并指挥\
  \ `Brain` 追踪 `Hero` 以演示追踪功能。\n\n### 定义 Brain 游戏对象\n\n`Brain` 对象将在用户左/右箭头键的控制下沿其前方向移动：\n\
  \n#### 1. 创建 Brain 类\n\n在 `src/my_game/objects` 文件夹中创建一个新文件，命名为 `brain.js`。将 `Brain`\
  \ 定义为 `GameObject` 的子类，并实现构造函数以初始化外观和行为参数。\n\n```javascript\nclass Brain extends\
  \ engine.GameObject {\n    constructor(spriteTexture) {\n        super(null);\n\
  \        this.kDeltaDegree = 1;\n        this.kDeltaRad = Math.PI * this.kDeltaDegree\
  \ / 180;\n        this.kDeltaSpeed = 0.01;\n        this.mRenderComponent =\n  \
  \          new engine.SpriteRenderable(spriteTexture);\n        this.mRenderComponent.setColor([1,\
  \ 1, 1, 0]);\n        this.mRenderComponent.getXform().setPosition(50, 10);\n  \
  \      this.mRenderComponent.getXform().setSize(3, 5.4);\n        this.mRenderComponent.setElementPixelPositions(600,\
  \ 700, 0, 180);\n        this.setSpeed(0.05);\n    }\n    // ... 后续实现 ...\n}\nexport\
  \ default Brain;\n```\n\n#### 2. 重写 Update 函数\n\n重写 `update()` 函数以支持用户转向和控制速度。请注意，必须调用\
  \ `GameObject` 中的默认 `update()` 函数，以支持对象根据其速度沿前方向进行基本移动。\n\n```javascript\nupdate()\
  \ {\n    super.update();\n    let xf = this.getXform();\n    let fdir = this.getCurrentFrontDir();\n\
  \    if (engine.input.isKeyPressed(engine.input.keys.Left)) {\n        xf.incRotationByDegree(this.kDeltaDegree);\n\
  \        vec2.rotate(fdir, fdir, this.kDeltaRad);\n    }\n    if (engine.input.isKeyPressed(engine.input.keys.Right))\
  \ {\n        xf.incRotationByRad(-this.kDeltaRad);\n        vec2.rotate(fdir, fdir,\
  \ -this.kDeltaRad);\n    }\n    if (engine.input.isKeyClicked(engine.input.keys.Up))\
  \ {\n        this.incSpeedBy(this.kDeltaSpeed);\n    }\n    if (engine.input.isKeyClicked(engine.input.keys.Down))\
  \ {\n        this.incSpeedBy(-this.kDeltaSpeed);\n    }\n}\n```\n\n### MyGame 场景\n\
  \n修改 `MyGame` 场景以测试 `Brain` 对象的移动。在这种情况下，除 `update()` 函数外，`my_game.js` 中的其余源代码与之前的项目相似。因此，仅展示\
  \ `update()` 函数的细节：\n\n```javascript\nupdate() {\n    let msg = \"Brain [H:keys\
  \ J:imm K:gradual]: \";\n    let rate = 1;\n    this.mHero.update();\n    switch\
  \ (this.mMode) {\n        case 'H':\n            this.mBrain.update();  // 玩家用箭头键转向\n\
  \            break;\n        case 'K':\n            rate = 0.02;  // 渐进速率\n    \
  \        // 在渐进模式下，以下代码也应执行\n        case 'J':\n            this.mBrain.rotateObjPointTo(\n\
  \                this.mHero.getXform().getPosition(), rate);\n            // 默认\
  \ GameObject：仅向前移动\n            engine.GameObject.prototype.update.call(this.mBrain);\n\
  \            break;\n    }\n    if (engine.input.isKeyClicked(engine.input.keys.H))\
  \ {\n        this.mMode = 'H';\n    }\n    if (engine.input.isKeyClicked(engine.input.keys.J))\
  \ {\n        this.mMode = 'J';\n    }\n    if (engine.input.isKeyClicked(engine.input.keys.K))\
  \ {\n        this.mMode = 'K';\n    }\n    this.mMsg.setText(msg + this.mMode);\n\
  }\n```\n\n在 `update()` 函数中，`switch` 语句使用 `mMode` 来决定如何更新 `Brain` 对象。在 `J` 和 `K`\
  \ 模式下，`Brain` 对象通过调用 `rotateObjPointTo()` 函数转向 `Hero` 对象的位置。而在 `H` 模式下，调用 `Brain`\
  \ 对象的 `update()` 函数，让用户用箭头键控制对象。最后三个 `if` 语句仅根据用户输入设置 `mMode` 变量。\n\n请注意，在 `J` 和\
  \ `K` 模式下，为了在 `rotateObjPointTo()` 之后绕过用户控制逻辑，调用的是 `GameObject` 定义的 `update()` 函数，而不是\
  \ `Brain` 定义的。\n\n> **注意**\n>\n> JavaScript 语法 `ClassName.prototype.FunctionName.call(anObj)`\
  \ 调用由 `ClassName` 定义的 `FunctionName`，其中 `anObj` 是 `ClassName` 的子类。\n\n## 观察\n\n\
  现在可以尝试运行项目。最初，`Brain` 对象处于用户控制之下。你可以使用左/右箭头键改变 `Brain` 对象的前方向，体验转向控制。按下 `J` 键会导致\
  \ `Brain` 对象立即指向并移动向 `Hero` 对象。这是由于默认转向速率值为 `1.0` 的结果。`K` 键会导致更自然的行为，`Brain` 对象继续向前移动并逐渐转向移动向\
  \ `Hero` 对象。请随意更改 `rate` 变量的值或修改 `Brain` 对象的控制值。例如，更改 `kDeltaRad` 或 `kDeltaSpeed`\
  \ 以尝试不同的行为设置。\n\n## GameObjects 之间的碰撞\n\n在之前的项目中，`Brain` 对象永远不会停止移动。请注意，在 `J` 和\
  \ `K` 模式下，当 `Brain` 对象到达目标位置时，它会围绕目标运行或快速翻转方向。`Brain` 对象缺乏检测其与 `Hero` 对象碰撞的关键能力，因此它永远不会停止移动。本节介绍轴对齐包围盒（AABB），这是近似对象碰撞最直接的工具之一，并演示基于\
  \ AABB 的碰撞检测实现。\n\n### 轴对齐包围盒（AABB）\n\nAABB 是一个与 x/y 轴对齐的矩形框，用于包围给定对象。*x/y 轴对齐*\
  \ 指的是 AABB 的四条边平行于水平 x 轴或垂直 y 轴。图 6-11 展示了用左下角（`mLL`）、宽度和高度表示 `Hero` 对象包围范围的示例。这是一种相当常见的\
  \ AABB 表示方法，因为它仅使用一个位置和两个浮点数来表示尺寸。\n\n![图 6-11 ¶ 对象包围盒的左下角与尺寸](img/334805_2_En_6_Fig11_HTML.png)\n\
  \n**图 6-11** ¶ 对象包围盒的左下角与尺寸\n\n有趣的是，除了表示对象的包围范围外，包围盒还可以用来表示任意给定矩形区域的包围范围。例如，回想一下\
  \ `Camera` 可见的世界坐标系（WC）是一个矩形区域，摄像机的位置位于中心，WC 的宽度/高度由游戏开发者定义。可以定义一个 AABB 来表示可见的 WC\
  \ 矩形区域（即 WC 窗口），并用于检测游戏世界中 WC 窗口与 `GameObject` 实例之间的碰撞。\n\n> **注意**\n>\n> 在本书中，AABB\
  \ 和“包围盒”交替使用。\n\n### 包围盒与碰撞项目\n\n\n\n\n## 项目概述\n\n本项目演示了如何为 `GameObject` 实例定义包围盒，以及如何基于它们的包围盒检测两个\
  \ `GameObject` 实例之间的碰撞。重要的是要记住，包围盒是轴对齐的，因此本节提出的解决方案不支持旋转对象之间的碰撞检测。您可以在图 6-12 中看到该项目运行的示例。该项目的源代码定义在\
  \ `chapter6/6.3.bbox_and_collisions` 文件夹中。\n\n![图 6-12 ¶ 运行包围盒与碰撞项目](img/334805_2_En_6_Fig12_HTML.jpg)\n\
  \n**图 6-12 ¶ 运行包围盒与碰撞项目**\n\n该项目的控制方式与前一个项目相同：\n\n*   **WASD 键**：移动 Hero 对象\n* \
  \  **左/右箭头键**：当 Brain 对象处于用户控制下时，改变其朝向\n*   **上/下箭头键**：增加/减少 Brain 对象的速度\n*   **H\
  \ 键**：将 Brain 对象切换为用户箭头键控制模式\n*   **J 键**：将 Brain 对象切换为始终指向并移动至 Hero 对象当前位置的模式\n\
  *   **K 键**：将 Brain 对象切换为逐渐转向并移动至 Hero 对象当前位置的模式\n\n项目目标如下：\n\n*   理解包围盒类的实现\n*\
  \   体验使用 `GameObject` 实例的包围盒进行工作\n*   计算并使用 Camera WC 窗口的边界\n*   编程实现对象碰撞以及对象与 Camera\
  \ WC 窗口的碰撞\n\n您可以在 `assets` 文件夹中找到与前一个项目相同的外部资源文件。\n\n## 定义包围盒类\n\n定义一个 `BoundingBox`\
  \ 类来表示矩形区域的边界：\n\n### 步骤 1：创建 `bounding_box.js` 并定义枚举\n\n在 `src/engine` 文件夹中创建一个新文件；将其命名为\
  \ `bounding_box.js`。首先，定义一个枚举数据类型，其值用于标识包围盒的碰撞边。\n\n```javascript\nconst eBoundCollideStatus\
  \ = Object.freeze({\n    eCollideLeft: 1,\n    eCollideRight: 2,\n    eCollideTop:\
  \ 4,\n    eCollideBottom: 8,\n    eInside: 16,\n    eOutside: 0\n});\n```\n\n请注意，每个枚举值只有一个非零位。这允许使用按位或运算符组合枚举值以表示多边碰撞。例如，如果一个物体同时与包围盒的顶部和左侧发生碰撞，碰撞状态将为\
  \ `eCollideLeft | eCollideTop = 1 | 4 = 5`。\n\n### 步骤 2：定义 `BoundingBox` 类和构造函数\n\
  \n现在，定义 `BoundingBox` 类和构造函数，其中包含表示边界的实例变量，如图 6-11 所示。请注意，`eBoundCollideStatus`\
  \ 也必须被导出，以便引擎的其余部分（包括客户端代码）也能访问它。\n\n```javascript\nclass BoundingBox {\n    constructor(centerPos,\
  \ w, h) {\n        this.mLL = vec2.fromValues(0, 0);\n        this.setBounds(centerPos,\
  \ w, h);\n    }\n    // ... 后续实现 ...\n}\nexport {eBoundCollideStatus}\nexport default\
  \ BoundingBox;\n```\n\n### 步骤 3：`setBounds()` 函数\n\n`setBounds()` 函数计算并设置包围盒的实例变量：\n\
  \n```javascript\nsetBounds(centerPos, w, h) {\n    this.mWidth = w;\n    this.mHeight\
  \ = h;\n    this.mLL[0] = centerPos[0] - (w / 2);\n    this.mLL[1] = centerPos[1]\
  \ - (h / 2);\n}\n```\n\n### 步骤 4：`containsPoint()` 函数\n\n定义一个函数来确定给定位置 (x, y) 是否在盒子的边界内：\n\
  \n```javascript\ncontainsPoint(x, y) {\n    return ((x > this.minX()) && (x < this.maxX())\
  \ &&\n            (y > this.minY()) && (y < this.maxY()));\n}\n```\n\n### 步骤 5：`intersectsBound()`\
  \ 函数\n\n定义一个函数来确定给定边界是否与当前边界相交：\n\n```javascript\nintersectsBound(otherBound) {\n\
  \    return ((this.minX() < otherBound.maxX()) &&\n            (this.maxX() > otherBound.minX())\
  \ &&\n            (this.minY() < otherBound.maxY()) &&\n            (this.maxY()\
  \ > otherBound.minY()));\n}\n```\n\n### 步骤 6：`boundCollideStatus()` 函数\n\n定义一个函数来计算给定边界与当前边界之间的相交状态：\n\
  \n```javascript\nboundCollideStatus(otherBound) {\n    let status = eBoundCollideStatus.eOutside;\n\
  \    if (this.intersectsBound(otherBound)) {\n        if (otherBound.minX() < this.minX())\
  \ {\n            status |= eBoundCollideStatus.eCollideLeft;\n        }\n      \
  \  if (otherBound.maxX() > this.maxX()) {\n            status |= eBoundCollideStatus.eCollideRight;\n\
  \        }\n        if (otherBound.minY() < this.minY()) {\n            status |=\
  \ eBoundCollideStatus.eCollideBottom;\n        }\n        if (otherBound.maxY()\
  \ > this.maxY()) {\n            status |= eBoundCollideStatus.eCollideTop;\n   \
  \     }\n        // 如果边界相交但没有任何边重叠\n        // 则 otherBound 完全在 thisBound 内部\n \
  \       if (status === eBoundCollideStatus.eOutside) {\n            status = eBoundCollideStatus.eInside;\n\
  \        }\n    }\n    return status;\n}\n```\n\n请注意 `intersectsBound()` 和 `boundCollideStatus()`\
  \ 函数之间微妙但重要的区别：前者只能返回 true 或 false 条件，而后者将碰撞边编码在返回的状态中。\n\n### 步骤 7：最小/最大值访问器函数\n\
  \n实现返回包围盒最小和最大边界 X/Y 值的函数：\n\n```javascript\nminX() { return this.mLL[0]; }\nmaxX()\
  \ { return this.mLL[0] + this.mWidth; }\nminY() { return this.mLL[1]; }\nmaxY()\
  \ { return this.mLL[1] + this.mHeight; }\n```\n\n最后，请记住更新引擎访问文件 `index.js`，以将新定义的功能转发给客户端。\n\
  \n## 在引擎中使用 BoundingBox\n\n新定义的功能将用于检测对象之间的碰撞以及对象与 WC 边界之间的碰撞。为了实现这一点，必须修改 `GameObject`\
  \ 和 `Camera` 类。\n\n### 步骤 1：编辑 `game_object.js`\n\n编辑 `game_object.js` 以导入新定义的功能并修改\
  \ `GameObject` 类；实现 `getBBox()` 函数以返回未旋转 `Renderable` 对象的包围盒：\n\n```javascript\n\
  import BoundingBox from \"../bounding_box.js\";\nclass GameObject {\n    // ...\
  \ 与之前代码相同 ...\n    getBBox() {\n        let xform = this.getXform();\n        let\
  \ b = new BoundingBox(\n            xform.getPosition(),\n            xform.getWidth(),\n\
  \            xform.getHeight());\n        return b;\n    }\n    // ... 与之前代码相同 ...\n\
  }\n```\n\n### 步骤 2：编辑 `camera.js`\n\n编辑 `camera.js` 以从 bounding box 导入，并修改 `Camera`\
  \ 类以计算 `Transform` 对象边界（通常在 `Renderable` 对象中定义）与 WC 窗口之间的碰撞状态：\n\n```javascript\n\
  import BoundingBox from \"./bounding_box.js\";\nclass Camera {\n    // ... 与之前代码相同\
  \ ...\n    collideWCBound(aXform, zone) {\n        let bbox = new BoundingBox(\n\
  \            aXform.getPosition(),\n            aXform.getWidth(),\n           \
  \ aXform.getHeight());\n        let w = zone * this.getWCWidth();\n        let h\
  \ = zone * this.getWCHeight();\n        let cameraBound = new BoundingBox(this.getWCCenter(),\
  \ w, h);\n        return cameraBound.boundCollideStatus(bbox);\n    }\n}\n```\n\n\
  请注意，`zone` 参数定义了碰撞计算中应使用的 WC 相对大小。例如，`zone` 值为 `0.8` 将意味着基于当前 WC 窗口大小的 80% 来计算相交状态。图\
  \ 6-13 展示了 Camera 如何与对象发生碰撞。\n\n![图 6-13 ¶ Camera WC 边界与定义 Transform 对象的边界发生碰撞](img/334805_2_En_6_Fig13_HTML.png)\n\
  \n**图 6-13 ¶ Camera WC 边界与定义 Transform 对象的边界发生碰撞**\n\n## 使用 MyGame 测试包围盒\n\n\n\n\
  \n\n本测试用例的目标是验证包围盒实现在检测物体-物体和物体-相机相交方面的正确性。再次强调，除 `update()` 函数外，`my_game.js` 文件中的大部分代码与之前的项目相似，此处不再重复。`update()`\
  \ 函数是在上一个项目的基础上修改的，用于测试包围盒相交。\n\n```javascript\nupdate() { \n    ... identical to\
  \ previous code ... \n    switch (this.mMode) { \n        case 'H': \n         \
  \   this.mBrain.update();  // 玩家通过方向键控制转向 \n            break; \n        case 'K':\
  \ \n            rate = 0.02;   // 渐进速率 \n            // 故意不写 break \n        case\
  \ 'J': \n            // 当碰到英雄包围盒时停止大脑 \n            if (!hBbox.intersectsBound(bBbox))\
  \ { \n                this.mBrain.rotateObjPointTo( \n                    this.mHero.getXform().getPosition(),\
  \ rate); \n                // 默认 GameObject：仅向前移动 \n                engine.GameObject.prototype.update.call(this.mBrain);\
  \ \n            } \n            break; \n    } \n    // 检查英雄是否超出 WC 窗口包围盒的 80% 范围\
  \ \n    let status = this.mCamera.collideWCBound(this.mHero.getXform(), 0.8); \n\
  \    ... identical to previous code ... \n    this.mMsg.setText(msg + this.mMode\
  \ + \" [Hero bound=\" + status + \"]\"); \n}\n```\n\n在 switch 语句的 J 和 K 分支中，修改部分在调用\
  \ `Brain.rotateObjPointTo()` 和 `update()` 以产生追逐行为之前，测试 Brain 和 Hero 对象之间的包围盒碰撞。这样，Brain\
  \ 对象一旦接触到 Hero 对象的包围盒就会停止移动。此外，还会计算并显示 Hero 对象与相机 WC 窗口 80% 区域之间的碰撞结果。\n\n### 观察\n\
  \n现在可以运行项目并观察到，当处于自主模式（按 J 或 K 键）时，Brain 对象一旦接触到 Hero 对象就会停止移动。当你移动 Hero 对象时，观察\
  \ Hero bound 输出消息会在 Hero 对象实际接触 WC 窗口边界之前就开始回显 WC 窗口碰撞。这是由于传递给 `mCamera.collideWCBound()`\
  \ 函数的 0.8（即 80%）参数导致的，它将碰撞计算配置为当前 WC 窗口大小的 80%。当 Hero 对象完全位于 WC 窗口边界的 80% 范围内时，输出的\
  \ Hero bound 值为 16，即 `eboundcollideStatus.eInside` 的值。尝试将 Hero 对象移动到接触窗口边界顶部 20%\
  \ 的区域，观察 Hero bound 值为 4，即 `eboundcollideStatus.eCollideTop` 的值。现在将 Hero 对象移向窗口的左上角，观察\
  \ Hero bound 值为 5，即 `eboundcollideStatus.eCollideTop | eboundcollideStatus.eCollideLeft`。以这种方式，碰撞状态是所有碰撞边界的按位或结果。\n\
  \n## 逐像素碰撞\n\n在前面的示例中，你看到了包围盒碰撞近似的结果。即 Brain 对象的运动在其包围盒与 Hero 对象的包围盒重叠时立即停止。这比 Brain\
  \ 对象永不停止移动的原始情况有了很大改进。然而，如图 6-14 所示，基于包围盒的碰撞检测存在两个严重局限性。\n\n1. 上一个示例中引入的 `BoundingBox`\
  \ 对象不考虑旋转。这是 `AABB`（轴对齐包围盒）公认的局限性：虽然该方法计算效率高，但不支持旋转物体。\n\n2. 两个物体实际上并未碰撞。两个物体的包围盒重叠并不自动等同于这两个物体发生了碰撞。\n\
  \n![图 6-14 ¶ 基于包围盒的碰撞检测的局限性](img/334805_2_En_6_Fig14_HTML.png)\n\n图 6-14 ¶ 基于包围盒的碰撞检测的局限性\n\
  \n在本项目中，你将实现逐像素精确碰撞检测、像素精确碰撞检测或逐像素碰撞检测，以检测两个碰撞物体的非透明像素重叠。但请记住，这并非终极解决方案。虽然逐像素碰撞检测很精确，但代价是潜在的性能成本。随着图像变得更大、更复杂，需要检查碰撞的像素也会更多。这与包围盒碰撞检测所需的恒定计算成本形成对比。\n\
  \n### 逐像素碰撞项目\n\n该项目演示了如何检测大型纹理物体（Collector 小兵）与小型纹理物体（Portal 小兵）之间的碰撞。这两个纹理都包含透明和非透明区域。仅当非透明像素重叠时才会发生碰撞。在本项目中，发生碰撞时，一个黄色的\
  \ DyePack（染料包）会出现在碰撞点。你可以在图 6-15 中看到该项目运行的示例。该项目的源代码定义在 `chapter6/6.4.per_pixel_collisions`\
  \ 文件夹中。\n\n![图 6-15 ¶ 运行逐像素碰撞项目](img/334805_2_En_6_Fig15_HTML.jpg)\n\n图 6-15 ¶ 运行逐像素碰撞项目\n\
  \n项目控制如下：\n\n- `方向键`：移动小型纹理物体，Portal 小兵\n- `WASD 键`：移动大型纹理物体，Collector 小兵\n\n项目目标如下：\n\
  \n- 演示如何检测非透明像素重叠\n- 理解使用逐像素精确碰撞检测的优缺点\n\n> **注意**\n>\n> “透明”像素是指你可以完全看穿的像素，在本引擎中，其\
  \ Alpha 值为 0。“非透明”像素的 Alpha 值大于 0，或者该像素不会完全阻挡其后方的内容；它可能遮挡也可能不遮挡。“不透明”像素会遮挡其后方的内容，属于“非透明”，且\
  \ Alpha 值为 1。例如，请注意你可以“看穿” Portal 对象的顶部区域。这些像素是非透明但不不透明的，根据项目定义的参数，当发生重叠时它们应引发碰撞。\n\
  \n你可以在 `assets` 文件夹中找到以下外部资源：包含默认系统字体的 `fonts` 文件夹、`minion_collector.png`、`minion_portal.png`\
  \ 和 `minion_sprite.png`。请注意，`minion_collector.png` 是一张大尺寸的 1024x1024 图像，而 `minion_portal.png`\
  \ 是一张小尺寸的 64x64 图像；`minion_sprite.png` 定义了 DyePack 精灵元素。\n\n#### 逐像素碰撞算法概述\n\n在继续之前，确定检测两个纹理物体之间碰撞的要求非常重要。首要的是纹理本身需要包含透明区域，这种类型的碰撞检测才能提供准确性的提升。如果纹理中没有透明度，你可以也应该使用简单的包围盒碰撞检测。如果一个或两个纹理包含透明区域，则需要处理两种碰撞情况。第一种情况是检查两个物体的包围盒是否碰撞。你可以在图\
  \ 6-16 中看到这一点。请注意物体的包围盒重叠了，但没有任何非透明的彩色像素接触。\n\n![图 6-16 ¶ 包围盒重叠但未发生实际碰撞](img/334805_2_En_6_Fig16_HTML.png)\n\
  \n图 6-16 ¶ 包围盒重叠但未发生实际碰撞\n\n\n\n\n## 检查纹理非透明像素重叠\n\n下一个案例是检查纹理的非透明像素是否重叠。请看图 6-17。`Collector`\
  \ 和 `Portal` 对象纹理的非透明像素明显相互接触。\n\n![图 6-17 ¶ 大纹理与小纹理之间发生的像素碰撞](img/334805_2_En_6_Fig17_HTML.png)\n\
  \n**图 6-17 ¶ 大纹理与小纹理之间发生的像素碰撞**\n\n问题已明确定义，以下是逐像素精确碰撞检测的逻辑或伪代码：\n\n给定两张图像 `Image-A`\
  \ 和 `Image-B`\n如果两者的边界框碰撞，则\n&nbsp;&nbsp;&nbsp;&nbsp;对于 `Image-A` 中的每个 `Pixel-A`\n\
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;如果 `Pixel-A` 不完全透明\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`pixelCameraSpace`\
  \ = `Pixel-A` 在相机空间中的位置\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;将\
  \ `pixelCameraSpace` 转换到 `Image-B` 空间\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;从\
  \ `Image-B` 读取 `Pixel-B`\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;如果\
  \ `Pixel-B` 不完全透明，则\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;发生碰撞\n\
  \n从 `pixelCameraSpace` 到 `Image-B` 空间的逐像素变换是必需的，因为碰撞检查必须在同一坐标空间内进行。\n\n请注意，在算法中\
  \ `Image-A` 和 `Image-B` 是可交换的。即在测试两张图像的碰撞时，哪张是 `Image-A` 或 `Image-B` 无关紧要。碰撞结果将相同：要么两张图像重叠，要么不重叠。此外，请注意该算法的运行时间。`Image-A`\
  \ 中的每个像素都必须处理；因此运行时间为 `O(N)`，其中 `N` 是 `Image-A` 的像素数或分辨率。出于性能原因，选择两张图像中较小者（本例中为\
  \ `Portal` 手下）作为 `Image-A` 非常重要。\n\n此时，您可能已明白为何逐像素精确碰撞检测的性能令人担忧。在每次更新时用许多高分辨率纹理检查这些碰撞会迅速拖慢性能。现在您已准备好研究逐像素精确碰撞的实现。\n\
  \n## 修改 Texture 以将纹理加载为颜色数组\n\n回顾 `Texture` 组件从服务器文件系统读取图像文件，将图像加载到 GPU 内存，并将图像处理为\
  \ `WebGL` 纹理。这样，纹理图像存储在 GPU 上，运行在 CPU 上的游戏引擎无法访问。为支持逐像素碰撞检测，必须从 GPU 检索颜色信息并存储在 CPU\
  \ 中。可修改 `Texture` 组件以支持此需求。\n\n### 1. 扩展 TextureInfo 对象\n\n在 `texture.js` 文件中，扩展\
  \ `TextureInfo` 对象以包含用于存储文件纹理颜色数组的新变量：\n\n```javascript\nclass TextureInfo {\n \
  \   constructor(w, h, id) {\n        this.mWidth = w;\n        this.mHeight = h;\n\
  \        this.mGLTexID = id;\n        this.mColorArray = null;\n    }\n}\n```\n\n\
  ### 2. 定义并导出从 GPU 内存检索颜色数组的函数\n\n```javascript\nfunction getColorArray(textureName)\
  \ {\n    let gl = glSys.get();\n    let texInfo = get(textureName);\n    if (texInfo.mColorArray\
  \ === null) {\n        // create framebuffer bind to texture and read the color\
  \ content\n        let fb = gl.createFramebuffer();\n        gl.bindFramebuffer(gl.FRAMEBUFFER,\
  \ fb);\n        gl.framebufferTexture2D(gl.FRAMEBUFFER,\n            gl.COLOR_ATTACHMENT0,\n\
  \            gl.TEXTURE_2D, texInfo.mGLTexID, 0);\n        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER)\
  \ ===\n            gl.FRAMEBUFFER_COMPLETE) {\n            let pixels = new Uint8Array(\n\
  \                texInfo.mWidth * texInfo.mHeight * 4);\n            gl.readPixels(0,\
  \ 0, texInfo.mWidth, texInfo.mHeight,\n                gl.RGBA, gl.UNSIGNED_BYTE,\
  \ pixels);\n            texInfo.mColorArray = pixels;\n        } else {\n      \
  \      throw new Error(\"...\");\n            return null;\n        }\n        gl.bindFramebuffer(gl.FRAMEBUFFER,\
  \ null);\n        gl.deleteFramebuffer(fb);\n    }\n    return texInfo.mColorArray;\n\
  }\nexport {has, get, load, unload,\n    TextureInfo,\n    activate, deactivate,\n\
  \    getColorArray }\n```\n\n`getColorArray()` 函数创建一个 `WebGL FRAMEBUFFER`，用所需纹理填充缓冲区，并将缓冲区内容检索到由\
  \ `texInfo.mColorArray` 引用的 CPU 内存中。\n\n## 修改 TextureRenderable 以支持逐像素碰撞\n\n`TextureRenderable`\
  \ 是实现逐像素碰撞功能最合适的类。因为 `TextureRenderable` 是所有渲染纹理类的基类。在基类中实现意味着所有子类只需极少的额外更改即可继承该功能。\n\
  \n随着 `TextureRenderable` 类功能的增加，实现源代码的复杂性和规模也将增加。为保持可读性和可扩展性，维护源代码文件大小很重要。一种有效方法是根据功能将类的源代码分离到多个文件中。\n\
  \n### 组织源代码\n\n以下步骤将 `TextureRenderable` 类分离为三个源代码文件：`texture_renderable_main.js`\
  \ 实现之前项目的基本功能，`texture_renderable_pixel_collision.js` 实现新引入的逐像素精确碰撞，`texture_renderable.js`\
  \ 作为类访问点。\n\n#### 1. 重命名文件\n\n将 `texture_renderable.js` 重命名为 `texture_renderable_main.js`。此文件定义\
  \ `TextureRenderable` 类的基本功能。\n\n#### 2. 创建像素碰撞文件\n\n在 `src/engine/renderables`\
  \ 中创建新文件 `texture_renderable_pixel_collision.js`。此文件将用于扩展 `TextureRenderable` 类功能以支持逐像素精确碰撞。添加以下代码以从\
  \ `Texture` 模块和基本 `TextureRenderable` 类导入，并重新导出 `TextureRenderable` 类。目前此文件无实际用途；您将在下一小节添加适当的扩展函数。\n\
  \n```javascript\n\"use strict\";\nimport TextureRenderable from \"./texture_renderable_main.js\"\
  ;\nimport * as texture from \"../resources/texture.js\";\n... implementation to\
  \ follow ...\nexport default TextureRenderable;\n```\n\n#### 3. 创建访问点文件\n\n创建新 `texture_renderable.js`\
  \ 文件作为 `TextureRenderable` 访问点，添加以下代码：\n\n```javascript\n\"use strict\";\nimport\
  \ TextureRenderable from \"./texture_renderable_pixel_collision.js\";\nexport default\
  \ TextureRenderable;\n```\n\n采用此结构，`texture_renderable_main.js` 文件实现所有基本功能并导出到 `texture_renderable_pixel_collision.js`，后者向\
  \ `TextureRenderable` 类追加额外功能。最后，`texture_renderable.js` 从 `texture_renderable_pixel_collision.js`\
  \ 导入扩展函数。`TextureRenderable` 类的用户只需从 `texture_renderable.js` 导入即可访问所有定义的功能。\n\n\
  这样，从游戏开发者的角度看，`texture_renderable.js` 作为 `TextureRenderable` 类的访问点，隐藏了实现源代码结构的细节。同时，从引擎开发者的角度看，复杂实现被分离到文件名指示内容的源代码文件中，实现了各个文件的可读性。\n\
  \n### 定义对纹理颜色数组的访问\n\n回顾您通过首先编辑 `Texture` 模块开始此项目，从 GPU 向 CPU 检索表示纹理的颜色数组。现在必须编辑\
  \ `TextureRenderable` 以获得对该颜色数组的访问。\n\n#### 1.\n\n\n\n## 编辑 texture_renderable_main.js\
  \ 文件\n\n编辑 `texture_renderable_main.js` 文件，并修改构造函数以添加实例变量来保存纹理信息，包括对检索到的颜色数组的引用，以支持逐像素碰撞检测和后续子类重写：\n\
  \n```javascript\nclass TextureRenderable extends Renderable {\n    constructor(myTexture)\
  \ {\n        super();\n        // Alpha of 0: switch off tinting of texture\n  \
  \      super.setColor([1, 1, 1, 0]);\n        super._setShader(shaderResources.getTextureShader());\n\
  \        this.mTexture = null;\n        // these two instance variables are to cache\
  \ texture information\n        // for supporting per-pixel accurate collision\n\
  \        this.mTextureInfo = null;\n        this.mColorArray = null;\n        //\
  \ defined for subclass to override\n        this.mElmWidthPixels = 0;\n        this.mElmHeightPixels\
  \ = 0;\n        this.mElmLeftIndex = 0;\n        this.mElmBottomIndex = 0;\n   \
  \     // texture for this object, cannot be a \"null\"\n        this.setTexture(myTexture);\n\
  \    }\n}\n```\n\n## 修改 setTexture() 函数\n\n修改 `setTexture()` 函数以相应地初始化实例变量：\n\n\
  ```javascript\nsetTexture(newTexture) {\n    this.mTexture = newTexture;\n    //\
  \ these two instance variables are to cache texture information\n    // for supporting\
  \ per-pixel accurate collision\n    this.mTextureInfo = texture.get(newTexture);\n\
  \    this.mColorArray = null;\n    // defined for one sprite element for subclass\
  \ to override\n    // For texture_renderable, one sprite element is the entire texture\n\
  \    this.mElmWidthPixels = this.mTextureInfo.mWidth;\n    this.mElmHeightPixels\
  \ = this.mTextureInfo.mHeight;\n    this.mElmLeftIndex = 0;\n    this.mElmBottomIndex\
  \ = 0;\n}\n```\n\n注意，默认情况下 `mColorArray` 被初始化为 `null`。为了 CPU 内存优化，颜色数组仅从 GPU 获取参与逐像素碰撞的纹理。`mElmWidthPixels`\
  \ 和 `mElmHeightPixels` 变量是纹理的宽度和高度。这些变量是为后续子类重写定义的，以便算法可以支持精灵元素的碰撞。\n\n## 实现逐像素碰撞\n\
  \n你现在可以在新创建的 `texture_renderable_pixel_collision.js` 文件中实现逐像素碰撞算法。\n\n## 1. 定义 setColorArray\
  \ 函数\n\n编辑 `texture_renderable_pixel_collision.js` 文件，并为 `TextureRenderable` 类定义一个新函数来设置\
  \ `mColorArray`：\n\n```javascript\nTextureRenderable.prototype.setColorArray = function()\
  \ {\n    if (this.mColorArray === null) {\n        this.mColorArray = texture.getColorArray(this.mTexture);\n\
  \    }\n}\n```\n\n> **注意**\n>\n> JavaScript 类是基于原型链实现的。类构造完成后，实例方法可以通过类的原型或 `aClass.prototype.method`\
  \ 来访问和定义。有关 JavaScript 类和原型的更多信息，请参阅 [MDN 文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain)。\n\
  \n## 2. 定义 _pixelAlphaValue 函数\n\n定义一个新函数以返回任意给定像素 `(x, y)` 的 alpha 值（即透明度）：\n\n\
  ```javascript\nTextureRenderable.prototype._pixelAlphaValue = function(x, y) {\n\
  \    x = x * 4;\n    y = y * 4;\n    return this.mColorArray[(y * this.mTextureInfo.mWidth)\
  \ + x + 3];\n}\n```\n\n请注意，`mColorArray` 是一个一维数组，像素的颜色以四个浮点数存储并按行组织。\n\n## 3. 定义\
  \ _indexToWCPosition 函数\n\n定义一个函数来计算给定像素 `(i, j)` 的世界坐标位置 (`returnWCPos`)：\n\n```javascript\n\
  TextureRenderable.prototype._indexToWCPosition = function(returnWCPos, i, j) {\n\
  \    let x = i * this.mXform.getWidth() / this.mElmWidthPixels;\n    let y = j *\
  \ this.mXform.getHeight() / this.mElmHeightPixels;\n    returnWCPos[0] = this.mXform.getXPos()\
  \ +\n                     (x - (this.mXform.getWidth() * 0.5));\n    returnWCPos[1]\
  \ = this.mXform.getYPos() +\n                     (y - (this.mXform.getHeight()\
  \ * 0.5));\n}\n```\n\n## 4. 定义 _wcPositionToIndex 函数\n\n现在，实现上一个函数的逆操作，并使用世界坐标位置\
  \ (`wcPos`) 来计算纹理像素索引 (`returnIndex`)：\n\n```javascript\nTextureRenderable.prototype._wcPositionToIndex\
  \ = function(returnIndex, wcPos) {\n    // use wcPos to compute the corresponding\
  \ returnIndex[0 and 1]\n    let delta = [];\n    vec2.sub(delta, wcPos, this.mXform.getPosition());\n\
  \    returnIndex[0] = this.mElmWidthPixels *\n                     (delta[0] / this.mXform.getWidth());\n\
  \    returnIndex[1] = this.mElmHeightPixels *\n                     (delta[1] /\
  \ this.mXform.getHeight());\n    // recall that xForm.getPosition() returns center,\
  \ yet\n    // Texture origin is at lower-left corner!\n    returnIndex[0] += this.mElmWidthPixels\
  \ / 2;\n    returnIndex[1] += this.mElmHeightPixels / 2;\n    returnIndex[0] = Math.floor(returnIndex[0]);\n\
  \    returnIndex[1] = Math.floor(returnIndex[1]);\n}\n```\n\n## 5. 实现 pixelTouches\
  \ 函数\n\n现在可以实现概述的逐像素碰撞算法：\n\n```javascript\nTextureRenderable.prototype.pixelTouches\
  \ = function(other, wcTouchPos) {\n    let pixelTouch = false;\n    let xIndex =\
  \ 0, yIndex;\n    let otherIndex = [0, 0];\n    while ((!pixelTouch) && (xIndex\
  \ < this.mElmWidthPixels)) {\n        yIndex = 0;\n        while ((!pixelTouch)\
  \ && (yIndex < this.mElmHeightPixels)) {\n            if (this._pixelAlphaValue(xIndex,\
  \ yIndex) > 0) {\n                this._indexToWCPosition(wcTouchPos, xIndex, yIndex);\n\
  \                other._wcPositionToIndex(otherIndex, wcTouchPos);\n           \
  \     if ((otherIndex[0] >= 0) &&\n                    (otherIndex[0] < other.mElmWidthPixels)\
  \ &&\n                    (otherIndex[1] >= 0) &&\n                    (otherIndex[1]\
  \ < other.mElmHeightPixels)) {\n                    pixelTouch = other._pixelAlphaValue(\n\
  \                                     otherIndex[0], otherIndex[1]) > 0;\n     \
  \           }\n            }\n            yIndex++;\n        }\n        xIndex++;\n\
  \    }\n    return pixelTouch;\n}\n```\n\n参数 `other` 是对正在测试碰撞的另一个 `TextureRenderable`\
  \ 对象的引用。如果对象之间的像素重叠，返回的 `wcTouchPos` 值是在世界坐标空间中检测到的第一个碰撞位置。请注意，嵌套循环一旦检测到一个像素重叠或\
  \ `pixelTouch` 变为 `true` 就会终止。这是出于效率考虑的重要特性。然而，这也意味着返回的 `wcTouchPos` 只是许多潜在碰撞点中的一个。\n\
  \n## 在 GameObject 中支持逐像素碰撞\n\n编辑 `game_object.js` 文件，向 `GameObject` 类添加 `pixelTouches()`\
  \ 函数：\n\n```javascript\npixelTouches(otherObj, wcTouchPos) {\n    // only continue\
  \ if both objects have getColorArray defined\n    // if defined, should have other\
  \ texture intersection support!\n    let pixelTouch = false;\n    let myRen = this.getRenderable();\n\
  \    let otherRen = otherObj.getRenderable();\n    if ((typeof myRen.pixelTouches\
  \ === \"function\") &&\n        (typeof otherRen.pixelTouches === \"function\"))\
  \ {\n        let otherBbox = otherObj.getBBox();\n        if (otherBbox.intersectsBound(this.getBBox()))\
  \ {\n            myRen.setColorArray();\n            otherRen.setColorArray();\n\
  \            pixelTouch = myRen.pixelTouches(otherRen, wcTouchPos);\n        }\n\
  \        return pixelTouch;\n    }\n}\n```\n\n此函数检查以确保对象正在碰撞，并将实际的逐像素碰撞委托给 `TextureRenderable`\
  \ 对象。请注意，在调用可能昂贵的 `TextureRenderable.pixelTouches()` 函数之前，会先使用 `intersectsBound()`\
  \ 函数进行包围盒相交检查。\n\n## 在 MyGame 中测试逐像素碰撞\n\n\n\n如图 6-15 所示，逐像素碰撞测试相当简单，涉及三个`GameObject`实例：大型`Collector`爪牙、小型`Portal`爪牙和`DyePack`。`Collector`和`Portal`爪牙分别由`arrow`和`WASD`键控制。`MyGame`的实现细节与之前的项目相似，不再展示。\n\
  \n值得注意的代码片段是`update()`函数中的碰撞测试，如下所示：\n\n```\nupdate() {\n    let msg = \"No Collision\"\
  ;\n    this.mCollector.update(engine.input.keys.W, engine.input.keys.S,\n      \
  \  engine.input.keys.A, engine.input.keys.D);\n    this.mPortal.update(engine.input.keys.Up,\
  \ engine.input.keys.Down,\n        engine.input.keys.Left, engine.input.keys.Right);\n\
  \    let h = [];\n    // Portal's resolution is 1/16 x 1/16 that of Collector!\n\
  \    // VERY EXPENSIVE!!\n    // if (this.mCollector.pixelTouches(this.mPortal,\
  \ h)) {\n    if (this.mPortal.pixelTouches(this.mCollector, h)) {\n        msg =\
  \ \"Collided!: (\" + h[0].toPrecision(4) + \" \" +\n            h[1].toPrecision(4)\
  \ + \")\";\n        this.mDyePack.setVisibility(true);\n        this.mDyePack.getXform().setXPos(h[0]);\n\
  \        this.mDyePack.getXform().setYPos(h[1]);\n    } else {\n        this.mDyePack.setVisibility(false);\n\
  \    }\n    this.mMsg.setText(msg);\n}\n```\n\n### 观察\n\n现在你可以通过移动两个爪牙并在不同位置使它们相交（例如，顶部与底部碰撞，左侧与右侧碰撞）或移动它们使其有大面积重叠来测试碰撞精度。注意，预测实际报告的相交位置（`DyePack`的位置）相当困难，甚至不可能。重要的是要记住，逐像素碰撞函数主要是一个返回\
  \ true 或 false 以指示是否发生碰撞的函数。你不能依赖此函数来计算实际的碰撞位置。\n\n最后，尝试切换到调用`Collector.pixelTouches()`函数来检测碰撞。注意其性能低于实时要求！在这种情况下，`Collector.pixelTouches()`函数的计算成本是`Portal.pixelTouches()`函数的\
  \ 16×16=256 倍。\n\n## 广义逐像素碰撞\n\n在上一节中，你看到了实现逐像素精确碰撞检测所需的基本操作。然而，正如你可能注意到的，之前的项目仅适用于纹理沿\
  \ x/y 轴对齐的情况。这意味着你的实现不支持旋转对象之间的碰撞。\n\n本节解释了如何在对象旋转时实现逐像素精确的碰撞检测。该项目的基本概念与上一个项目相同；然而，此版本涉及向量分解，快速复习会有帮助。\n\
  \n## 向量回顾：分量与分解\n\n回顾一下，两个垂直方向可用于将向量分解为相应的分量。例如，图 6-18 包含两个归一化向量（或分量向量），可用于分解向量\

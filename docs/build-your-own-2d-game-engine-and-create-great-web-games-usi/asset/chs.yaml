  \ this.mDrawCollisionInfo = !this.mDrawCollisionInfo;\n    }\n    ... identical\
  \ to previous code ...\n}\n```\n\n## 观察\n\n你现在可以运行项目，通过生成的 `CollisionInfo` 对象来检查你在\
  \ `RigidCircle` 形状之间的碰撞实现。请记住，你目前只实现了圆-圆碰撞。现在，使用左/右箭头键选择并操作一个 `RigidCircle` 对象。使用\
  \ `WASD` 键移动该对象，观察当它与另一个 `RigidCircle` 重叠时，代表碰撞法线和深度的洋红色线段。尝试按 `Y`/`U` 键验证不同半径形状的\
  \ `CollisionInfo` 正确性。现在，按 `G` 键创建更多 `RigidCircle` 对象。尝试移动选定对象并增加其大小，使其同时与多个 `RigidCircle`\
  \ 对象碰撞，观察每次碰撞都能计算出正确的 `CollisionInfo`。最后，请注意你可以使用 `C` 键切换 `CollisionInfo` 的绘制。\n\
  \n你现在已经实现了圆形碰撞检测，构建了支持碰撞所需的引擎基础设施，并验证了系统的正确性。你现在准备好学习分离轴定理（SAT）并实现派生算法来检测矩形之间的碰撞。\n\
  \n## 分离轴定理\n\n分离轴定理（SAT）是用于检测二维通用凸形状碰撞的最流行算法之一的基础。由于派生算法计算量可能很大，通常会先进行一轮宽相位方法的初步检测。SAT\
  \ 定理指出：\n\n> 如果存在一条线（或轴），它垂直于两个多边形给定边缘中的任意一条，并且当将两个多边形的所有边缘投影到此轴上时，投影边缘之间没有重叠，则这两个凸多边形**没有**发生碰撞。\n\
  \n\n\n\n换句话说，给定二维空间中的两个凸形状，逐个遍历两个凸形状的所有边。对于每一条边，推导出一条垂直于该边的线（或轴），将两个凸形状的所有边投影到这条线上，并计算投影边的重叠情况。如果你能找到一条垂直线，使得没有任何投影边重叠，则这两个凸形状不发生碰撞。\n\
  \n图 9-7 使用两个轴对齐矩形演示了这一描述。在这种情况下，有两条线垂直于给定两个形状的边，即 X 轴和 Y 轴。\n\n![Figure 9-7 ¶ A\
  \ line where projected edges do not overlap](img/334805_2_En_9_Fig7_HTML.png)\n\n\
  当将形状的所有边投影到这两条线/轴上时，请注意 Y 轴上的投影结果重叠，而 X 轴上没有重叠。由于存在一条垂直于其中一个矩形边的线，使得投影边不重叠，SAT 得出结论：这两个给定矩形不发生碰撞。\n\
  \n源自 SAT 的算法的主要优势在于，对于非碰撞形状，它具有提前退出的能力。一旦检测到没有重叠投影边的轴，算法即可报告无碰撞，无需继续测试其他轴。在图 9-7\
  \ 的情况下，如果算法从处理 X 轴开始，则无需执行 Y 轴的计算。\n\n## 基于 SAT 的简单算法\n\n基于 SAT 推导的算法通常包含四个步骤。请注意，该算法适用于检测任意凸形状之间的碰撞。为清晰起见，在以下解释中，每个步骤都附带一个由两个矩形组成的简单示例：\n\
  \n*   **步骤 1. 计算面法线**：计算用于投影边的垂直轴或面法线。以矩形为例，图 9-8 说明了有四条边，每条边都有一个对应的垂直轴。例如，`A1`\
  \ 是对应轴，因此垂直于边 `e[A1]`。请注意，在你的 `RigidRectangle` 类中，`mFaceNormal`（即面法线）是垂直轴 `A1`、`A2`、`A3`\
  \ 和 `A4`。\n\n![Figure 9-8 ¶ Rectangle edges and face normals](img/334805_2_En_9_Fig8_HTML.png)\n\
  \n*   **步骤 2. 投影顶点**：将两个凸形状的每个顶点投影到面法线上。对于给定的矩形示例，图 9-9 说明了将所有顶点投影到图 9-8 中的 `A1`\
  \ 轴上。\n\n![Figure 9-9 ¶ Project each vertex onto face normals (shows A1)](img/334805_2_En_9_Fig9_HTML.png)\n\
  \n*   **步骤 3. 确定边界**：确定每个凸形状投影顶点的最小和最大边界。继续矩形示例；图 9-10 显示了两个矩形各自的最小和最大位置。请注意，最小/最大位置是相对于给定轴的方向定义的。\n\
  \n![Figure 9-10 ¶ Identify the min and max bound positions for each rectangle](img/334805_2_En_9_Fig10_HTML.png)\n\
  \n*   **步骤 4. 判断重叠**：判断两个最小/最大边界是否重叠。图 9-11 显示两个投影边界确实重叠。在这种情况下，算法无法得出结论，必须继续处理下一个面法线。请注意，如图\
  \ 9-8 所示，处理面法线 `B1` 或 `B3` 将得出无碰撞的确定性结论。\n\n![Figure 9-11 ¶ Test for overlaps of\
  \ projected edges (shows A1)](img/334805_2_En_9_Fig11_HTML.png)\n\n给定的算法能够在无额外信息的情况下判断碰撞是否发生。回顾一下，检测到碰撞后，物理引擎还必须解决潜在的相互穿透，并为碰撞形状推导响应。这两项计算都需要额外信息——即图\
  \ 9-4 中介绍的碰撞信息。下一节将介绍一种高效的基于 SAT 的算法，该算法计算支撑点，既可告知碰撞检测的真/假结果，又可作为推导碰撞信息的基础。\n\n\
  ## 高效的 SAT 算法：支撑点\n\n如图 9-12 所示，形状 A 的面法线的支撑点被定义为形状 B 上的顶点位置，该顶点到形状 A 对应边的距离最负。当沿\
  \ `A1` 方向测量时，形状 B 上的顶点 `S[A1]` 到边 `e[A1]` 的距离负值最大，因此 `S[A1]` 是面法线 `A1` 的支撑点。负距离意味着测量是有方向的，且支撑点必须位于面法线的反方向。\n\
  \n![Figure 9-12 ¶ Support points of face normals](img/334805_2_En_9_Fig12_HTML.png)\n\
  \n通常，给定面法线的支撑点在每个更新周期可能不同，因此必须在每次碰撞调用时重新计算。此外，也是非常重要的是，面法线完全可能没有定义的支撑点。\n\n### 面法线可能不存在支撑点\n\
  \n仅当沿面法线测量的距离为负值时，支撑点才被定义。例如，在图 9-12 中，形状 B 的面法线 `B1` 在形状 A 上没有对应的支撑点。这是因为形状 A 上的所有顶点在沿\
  \ `B1` 测量时，到对应边 `e[B1]` 的距离均为正值。正距离意味着形状 A 的所有顶点都在边 `e[B1]` 的前方。换句话说，整个形状 A 都在形状\
  \ B 的边 `e[B1]` 前方；因此，这两个形状在物理上不接触；因此，它们不发生碰撞。\n\n由此可见，在计算两个形状之间的碰撞时，如果任意面法线没有对应的支撑点，则这两个形状不发生碰撞。再一次，提前退出能力是一个重要优势——算法一旦检测到第一个未定义支撑点的情况，即可返回判定。\n\
  \n为便于讨论和实现，支撑点与对应边之间的距离称为支撑点距离，并作为正数计算。这样，支撑点距离实际上是沿负面法线方向测量的。本书后续讨论将遵循这一约定。\n\n\
  ### 最小穿透轴与碰撞信息\n\n\n\n## 支持点 SAT 算法\n\n当为凸形状的所有面法线定义了支持点时，具有最小支持点距离的面法线就是导致最小相互渗透的轴。图\
  \ 9-13 展示了两个形状之间的碰撞，其中形状 B 的所有面法线都定义了支持点：形状 A 上的顶点 `S[B1]` 是面法线 `B1` 对应的支持点，`S[B2]`\
  \ 对应面法线 `B2`，以此类推。在这种情况下，`S[B1]` 具有最小的对应支持点距离，因此，面法线 `B1` 就是导致最小相互渗透的轴。图 9-13 右侧的插图显示，在这种情况下，支持点距离即为碰撞深度，面法线\
  \ `B1` 是碰撞法线，支持点 `S[B1]` 是碰撞起点，碰撞终点可以很容易地计算出来；它就是 `S[B1]` 沿碰撞法线方向偏移碰撞深度后的位置。\n\n\
  ![Figure 9-13 ¶ 最小渗透轴及对应的碰撞信息](img/334805_2_En_9_Fig13_HTML.png)\n\n**Figure 9-13**\
  \ ¶ 最小渗透轴及对应的碰撞信息\n\n## 算法\n\n有了上述背景描述，用于计算两个凸形状 A 和 B 之间碰撞的高效基于 SAT 的算法可以总结如下：\n\
  \n1. 计算形状 A 所有面法线的支持点\n   - 如果任意支持点未定义，则没有碰撞\n   - 如果所有支持点都已定义，计算最小渗透轴\n2. 计算形状\
  \ B 所有面法线的支持点\n   - 如果任意支持点未定义，则没有碰撞\n   - 如果所有支持点都已定义，计算最小渗透轴\n\n碰撞信息就是前两个结果中较小的碰撞深度。现在你已经准备好实现支持点\
  \ SAT 算法了。\n\n## 矩形碰撞项目\n\n该项目将指导你完成支持点 SAT 算法的实现。你可以在图 9-14 中看到该项目运行的示例。该项目的源代码定义在\
  \ `chapter9/9.3.rectangle_collisions` 中。\n\n![Figure 9-14 ¶ 运行矩形碰撞项目](img/334805_2_En_9_Fig14_HTML.jpg)\n\
  \n**Figure 9-14** ¶ 运行矩形碰撞项目\n\n该项目的控制方式与前一个项目相同：\n\n### 行为控制\n- **G 键**：随机创建一个新的刚性圆形或矩形\n\
  \n### 绘制控制\n- **C 键**：切换所有 `CollisionInfo` 的绘制\n- **T 键**：切换所有物体的纹理\n- **R 键**：切换\
  \ `RigidShape` 的绘制\n- **B 键**：切换每个 `RigidShape` 包围盒的绘制\n\n### 物体控制\n- **左/右箭头键**：依次遍历并选择一个物体\n\
  - **WASD 键**：移动选中的物体\n- **Z/X 键**：旋转选中的物体\n- **Y/U 键**：增大/减小选中物体的 `RigidShape` 尺寸；这不会改变对应\
  \ `Renderable` 物体的尺寸\n\n项目目标如下：\n- 深入理解并实现支持点 SAT 算法\n- 继续完成窄相碰撞检测的实现\n\n完成该项目后，你的游戏引擎将能够处理圆形与圆形、矩形与矩形之间的碰撞，但仍不支持圆形与矩形之间的碰撞。这将使你更接近完成刚性形状窄相碰撞检测的实现。剩余的功能——检测圆形-矩形碰撞——将在下一小节中介绍。\n\
  \n## 实现支持点 SAT\n\n随着上一个项目中碰撞检测基础设施的完成，唯一需要的修改就是将新功能添加到 `RigidRectangle` 类中。回想一下，源代码文件\
  \ `rigid_rectangle_collision.js` 是为实现矩形碰撞而创建的。\n\n### 步骤 1：定义局部变量\n\n在 `src/engine/rigid_shapes`\
  \ 文件夹中，编辑 `rigid_rectangle_collision.js` 以定义局部变量。这些是计算过程中的临时存储；它们被静态分配并重复使用，以避免每次调用时重复动态分配的开销。\n\
  \n```javascript\nclass SupportStruct {\n    constructor() {\n        this.mSupportPoint\
  \ = null;\n        this.mSupportPointDist = 0;\n    }\n}\n\n// temp work area to\
  \ save memory allocations\nlet mTmpSupport = new SupportStruct();\nlet mCollisionInfoR1\
  \ = new CollisionInfo();\nlet mCollisionInfoR2 = new CollisionInfo();\n```\n\n###\
  \ 步骤 2：创建 `findSupportPoint()` 函数\n\n创建一个新函数 `findSupportPoint()`，根据 `dir`（取反的面法线方向）和\
  \ `ptOnEdge`（给定边上的一个位置，例如顶点）来计算支持点。列出的代码遍历所有顶点；计算 `vToEdge`（从顶点指向 `ptOnEdge` 的向量）；将该向量投影到输入的\
  \ `dir` 上；并记录最大的正投影距离。回想一下，`dir` 是取反的面法线方向，因此，最大的正距离对应最远的顶点位置。注意，所有投影距离均为负值的情况完全可能发生。在这种情况下，所有顶点都在输入\
  \ `dir` 的前方，给定边不存在支持点，因此，两个矩形不会发生碰撞。\n\n```javascript\nRigidRectangle.prototype.findSupportPoint\
  \ = function (dir, ptOnEdge) {\n    // the longest project length\n    let vToEdge\
  \ = [0, 0];\n    let projection;\n    mTmpSupport.mSupportPointDist = -Number.MAX_VALUE;\n\
  \    mTmpSupport.mSupportPoint = null;\n    // check each vector of other object\n\
  \    for (let i = 0; i < this.mVertex.length; i++) {\n        vec2.subtract(vToEdge,\
  \ this.mVertex[i], ptOnEdge);\n        projection = vec2.dot(vToEdge, dir);\n  \
  \      // find the longest distance with certain edge\n        // dir is -n direction,\
  \ so the distance should be positive\n        if ((projection > 0) &&\n        \
  \    (projection > mTmpSupport.mSupportPointDist)) {\n            mTmpSupport.mSupportPoint\
  \ = this.mVertex[i];\n            mTmpSupport.mSupportPointDist = projection;\n\
  \        }\n    }\n}\n```\n\n### 步骤 3：寻找最小渗透轴\n\n有了为任意面法线定位支持点的能力，下一步是使用 `findAxisLeastPenetration()`\
  \ 函数找到最小渗透轴。回想一下，最小渗透轴是具有最小支持点距离的支持点。列出的代码循环遍历四个面法线，找到对应的支持点和支持点距离，并记录最短距离。while\
  \ 循环表示如果任意面法线没有定义支持点，则两个矩形不发生碰撞。\n\n\n\n\n## 矩形-矩形与矩形-圆形碰撞检测实现\n\n## 矩形-矩形碰撞实现\n\
  \n### `findAxisLeastPenetration` 函数\n\n```javascript\nRigidRectangle.prototype.findAxisLeastPenetration\
  \ = function (otherRect, collisionInfo) {\n    let n;\n    let supportPoint;\n \
  \   let bestDistance = Number.MAX_VALUE;\n    let bestIndex = null;\n    let hasSupport\
  \ = true;\n    let i = 0;\n    let dir = [0, 0];\n    while ((hasSupport) && (i\
  \ < this.mFaceNormal.length)) {\n        // Retrieve a face normal from A\n    \
  \    n = this.mFaceNormal[i];\n        // use -n as direction and the vertex on\
  \ edge i as point on edge\n        vec2.scale(dir, n, -1);\n        let ptOnEdge\
  \ = this.mVertex[i];\n        // find the support on B\n        // the point has\
  \ longest distance with edge i\n        otherRect.findSupportPoint(dir, ptOnEdge);\n\
  \        hasSupport = (mTmpSupport.mSupportPoint !== null);\n        // get the\
  \ shortest support point depth\n        if ((hasSupport) && (mTmpSupport.mSupportPointDist\
  \ < bestDistance)) {\n            bestDistance = mTmpSupport.mSupportPointDist;\n\
  \            bestIndex = i;\n            supportPoint = mTmpSupport.mSupportPoint;\n\
  \        }\n        i = i + 1;\n    }\n    if (hasSupport) {\n        // all four\
  \ directions have support point\n        let bestVec = [0, 0];\n        vec2.scale(bestVec,\
  \ this.mFaceNormal[bestIndex], bestDistance);\n        let atPos = [0, 0];\n   \
  \     vec2.add(atPos, supportPoint, bestVec);\n        collisionInfo.setInfo(bestDistance,\
  \ this.mFaceNormal[bestIndex], atPos);\n    }\n    return hasSupport;\n}\n```\n\n\
  ### 实现 `collideRectRect()` 函数\n\n通过计算相对于两个矩形各自的最小穿透轴，并选择两个结果中较小的一个，即可实现 `collideRectRect()`\
  \ 函数：\n\n```javascript\nRectangle.prototype.collideRectRect = function (r1, r2,\
  \ collisionInfo) {\n    var status1 = false;\n    var status2 = false;\n    // find\
  \ Axis of Separation for both rectangle\n    status1 = r1.findAxisLeastPenetration(r2,\
  \ collisionInfoR1);\n    if (status1) {\n        status2 = r2.findAxisLeastPenetration(r1,\
  \ collisionInfoR2);\n        if (status2) {\n            // if rectangles overlap,\
  \ the shorter normal is the normal\n            if (collisionInfoR1.getDepth() <\
  \ collisionInfoR2.getDepth()) {\n                var depthVec = collisionInfoR1.getNormal().scale(\n\
  \                    collisionInfoR1.getDepth());\n                collisionInfo.setInfo(collisionInfoR1.getDepth(),\n\
  \                    collisionInfoR1.getNormal(),\n                    collisionInfoR1.mStart.subtract(depthVec));\n\
  \            } else {\n                collisionInfo.setInfo(collisionInfoR2.getDepth(),\n\
  \                    collisionInfoR2.getNormal().scale(-1),\n                  \
  \  collisionInfoR2.mStart);\n            }\n        }\n    }\n    return status1\
  \ && status2;\n}\n```\n\n### 修改 `collisionTest()` 函数\n\n通过调用新定义的 `collideRectRect()`\
  \ 函数来计算两个矩形之间的碰撞，完成实现：\n\n```javascript\nRigidRectangle.prototype.collisionTest\
  \ = function (otherShape, collisionInfo) {\n    let status = false;\n    if (otherShape.mType\
  \ === \"RigidCircle\") {\n        status = false;\n    } else {\n        status\
  \ = this.collideRectRect(this, otherShape, collisionInfo);\n    }\n    return status;\n\
  }\n```\n\n## 观察结果\n\n现在可以运行项目来测试实现。使用左/右箭头键选择任意刚体形状，使用 `WASD` 键移动选中的对象。再次观察重叠矩形或重叠圆形之间的洋红色碰撞信息。请记住，这条线显示的是确保形状之间无重叠所需的最小位置修正量。按\
  \ `Z/X` 键旋转，按 `Y/U` 键改变选中对象的大小，观察碰撞信息如何随之变化。\n\n此时，仅支持圆-圆和矩形-矩形碰撞，因此当圆与矩形重叠时，不会显示碰撞信息。这将在下一个项目中解决。\n\
  \n## 矩形与圆形的碰撞\n\n支持点算法不适用于圆形，因为圆形没有可识别的顶点位置。取而代之的是，你将实现一个算法，根据圆心相对于矩形的位置来检测矩形与圆形之间的碰撞。\n\
  \n在讨论实际算法之前，如图 9-15 所示，通过延伸相连的边，矩形一条边外部的区域可以分为三个不同的区域。在这种情况下，虚线将给定边的外部区域分为 `RG1`（左/上区域）、`RG2`（右/下区域）和\
  \ `RG3`（紧邻给定边的外部区域）。\n\n![Figure 9-15 ¶ The three regions outside a given edge of\
  \ a rectangle](img/334805_2_En_9_Fig15_HTML.png)\n\nFigure 9-15 ¶ The three regions\
  \ outside a given edge of a rectangle\n\n基于此背景，矩形与圆形的碰撞检测步骤如下：\n\n*   **步骤 A**：计算距离圆心最近的矩形边。\n\
  *   **步骤 B**：如果圆心在矩形内部，则检测到碰撞。\n*   **步骤 C**：如果圆心在矩形外部\n    *   **步骤 C1**：如果在 `RG1`\
  \ 区域，圆心与顶点之间的距离决定是否发生碰撞。\n    *   **步骤 C2**：如果在 `RG2` 区域，圆心与底点之间的距离决定是否发生碰撞。\n \
  \   *   **步骤 C3**：如果在 `RG3` 区域，圆心与边的垂直距离决定是否发生碰撞。\n\n## 矩形与圆形碰撞项目\n\n该项目指导你实现上述矩形-圆形碰撞检测算法。图\
  \ 9-16 展示了该项目运行的示例。源代码定义在 `chapter9/9.4.rectangle_and_circle_collisions` 中。\n\n\

  \ 与之前代码相同 ...\n    togglePositionalCorrection,\n    getPositionalCorrection,\n \
  \   getRelaxationCount,\n    incRelaxationCount\n};\n```\n\n### 步骤 2：定义 positionalCorrection()\
  \ 函数\n\n定义 `positionalCorrection()` 函数，按预定义的速率 `mPosCorrectionRate` 移动并减少物体间的重叠。为了在模拟中正确支持物体动量，每个物体移动的量与其质量成反比。也就是说，发生碰撞时，质量较大的物体移动的量将小于质量较小的物体。请注意，移动方向沿着\
  \ `collisionInfo` 对象中定义的碰撞法线。\n\n```javascript\nfunction positionalCorrection(s1,\
  \ s2, collisionInfo) {\n    if (!mCorrectPosition)\n        return;\n    let s1InvMass\
  \ = s1.getInvMass();\n    let s2InvMass = s2.getInvMass();\n    let num = collisionInfo.getDepth()\
  \ /\n              (s1InvMass + s2InvMass) * mPosCorrectionRate;\n    let correctionAmount\
  \ = [0, 0];\n    vec2.scale(correctionAmount, collisionInfo.getNormal(), num);\n\
  \    s1.adjustPositionBy(correctionAmount, -s1InvMass);\n    s2.adjustPositionBy(correctionAmount,\
  \ s2InvMass);\n}\n```\n\n### 步骤 3：修改 collideShape() 函数\n\n修改 `collideShape()` 函数，以便在检测到碰撞时执行位置修正。请注意，仅当至少有一个物体的质量非零时，才执行碰撞检测。\n\

  \ `P` 处的速度差来定义。\n\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_{ABP1}={\\overrightarrow{\\\
  mathrm{V}}}_{AP1}-{\\overrightarrow{\\mathrm{V}}}_{BP1} $$](img/334805_2_En_9_Chapter_TeX_IEq98.png)\
  \ (15)\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_{ABP2}={\\overrightarrow{\\mathrm{V}}}_{AP2}-{\\\
